- 'no': 2
  name: AI自媒体变现 —— 从“内容创作”到“商业系统”
  desc: 本章聚焦AI自媒体的商业化路径，提出“商业体系先于内容”的倒推法，并以真实涨粉案例展示从定位到变现的完整闭环。
  nodes:
  - 'no': 1
    name: 商业体系先于内容 —— 倒过来想问题
    desc: 打破“先做内容再想赚钱”的惯性，论证AI自媒体应首先明确商业目标，再倒推产品、人群、定位与内容。
