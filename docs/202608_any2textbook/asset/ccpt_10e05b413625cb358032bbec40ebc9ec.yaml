paper: 260824《如何入局FDE，以及FDE的未来》
desc: 该素材讲述了一位前字节/美团工程师辞职转型为 FDE（Forward Deployed Engineer，前线部署工程师）的实战经验与行业观察，内容涵盖入局的四条路径（自媒体、闲鱼小单、线下连接、G
  端合作）、核心盈利判断（最佳订单区间为 5-20 万元，超过 20 万元的项目尾款回收风险超过 60%）以及对 FDE 职业本质与未来出路的反思（本质是卖时间无杠杆，成功者正转向卖课、垂直深耕、平台化、产品化、总包分包等方向）。
concepts:
- name: FDE（Forward Deployed Engineer，前线部署工程师）
  desc: 一种以工程师身份直接面向客户、深入业务一线交付 AI 或技术解决方案的角色，本质是卖时间、缺乏杠杆。
  is_original: false
  excerpt:
  - 前字节/美团工程师辞职做FDE（Forward Deployed Engineer），两个月收入超20万。
  - FDE本质是卖时间没有杠杆，做起来的人都在找下一步出路
- name: FDE 最佳订单区间（5-20 万元）
  desc: 该素材原创提出的 FDE 盈利判断：5-20 万元是 FDE 接单的最优价格带，超出后风险剧增。
  is_original: true
  excerpt:
  - FDE最好的订单区间是5-20万元，超过20万的项目容易陷入企业AI转型泥潭，尾款收不回概率超过60%
- name: FDE 无杠杆本质
  desc: 该素材提出的原创判断：FDE 商业模式本质是出售个人时间，无法规模化，因此从业者必须寻找下一阶段出路。
  is_original: true
  excerpt:
  - FDE本质是卖时间没有杠杆，做起来的人都在找下一步出路（卖课、垂直深耕、平台、产品化、总包分包）。
methods:
- name: __overview__
  desc: 素材整体方法论围绕'如何入局 FDE 及规划其未来'展开，包含入局四路径、订单区间选择、风险规避与转型出路分析。
  excerpt:
  - 入局方式：自媒体、闲鱼小单、线下连接、G端合作。
  - 做起来的人都在找下一步出路（卖课、垂直深耕、平台、产品化、总包分包）。
- name: FDE 入局四路径法
  desc: 通过自媒体获客、闲鱼接小单、线下人脉连接、G 端（政府端）合作四种方式切入 FDE 市场。
  excerpt:
  - 入局方式：自媒体、闲鱼小单、线下连接、G端合作。
- name: FDE 订单区间风控法
  desc: 将订单金额控制在 5-20 万元区间，以规避超过 20 万元项目带来的企业 AI 转型泥潭与尾款坏账风险。
  excerpt:
  - FDE最好的订单区间是5-20万元，超过20万的项目容易陷入企业AI转型泥潭，尾款收不回概率超过60%
- name: FDE 转型出路五方向
  desc: FDE 从业者突破时间杠杆瓶颈的五条进阶路径：卖课、垂直深耕、平台化、产品化、总包分包。
  excerpt:
  - 做起来的人都在找下一步出路（卖课、垂直深耕、平台、产品化、总包分包）。
theorems:
- name: FDE 最优订单区间命题
  desc: 核心主张：FDE 接单的最佳金额区间为 5-20 万元，超出此区间将显著增加项目失败与尾款损失风险。
  excerpt:
  - FDE最好的订单区间是5-20万元，超过20万的项目容易陷入企业AI转型泥潭，尾款收不回概率超过60%
- name: FDE 无杠杆命题
  desc: 核心主张：FDE 本质是出售个人时间，不具备杠杆效应，长期从事必须向更高杠杆模式转型。
  excerpt:
  - FDE本质是卖时间没有杠杆，做起来的人都在找下一步出路
