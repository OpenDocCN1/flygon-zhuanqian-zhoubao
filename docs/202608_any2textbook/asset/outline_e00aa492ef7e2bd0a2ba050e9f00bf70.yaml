- 'no': 1
  name: 变现认知 —— 从“做产品”到“做成交”
  desc: 本章从AI时代变现的根本卡点出发，带你理解为什么工具升级了、门槛降低了，大多数人却仍然赚不到钱——真正的壁垒从来不是产品制作，而是销售与成交能力。
  nodes:
  - 'no': 1
    name: AI没有让成交自动发生
    desc: 工具升级后大家卡住的位置没变：产品变快了，但没有人自动付钱
    role: motivation
    src:
    - paper: 260803《AI时代到底怎么赚钱》
  - 'no': 2
    name: 销售能力才是真正的壁垒
    desc: 你不敢把一个东西清楚地介绍给具体的人并问他愿不愿意付钱——这才是核心卡点
    role: definition
    src:
    - paper: 260803《AI时代到底怎么赚钱》
  - 'no': 3
    name: 离钱最近的事优先做
    desc: 先去做直接产生成交和现金的动作，而非打磨完美产品
    role: method
    src:
    - paper: 260803《AI时代到底怎么赚钱》
  - 'no': 4
    name: 现金投票：先收钱再完善
    desc: 产品可以不完美，先用真实付费验证需求，完成现金投票
    role: method
    src:
    - paper: 260803《AI时代到底怎么赚钱》
  - 'no': 5
    name: 列出通讯录100人，7天落实销售动作
    desc: 把销售对象具体化，用7天行动计划强制启动成交行为
    role: experiment
    src:
    - paper: 260803《AI时代到底怎么赚钱》
