paper: 260817《小红书AI工作台做虚拟产品》
desc: 该素材讲述一位03年出生的自由职业者（大二学生）利用AI Agent搭建了一套覆盖小红书虚拟产品全链路的自动化工作台，涵盖千帆榜单采集、账号评分、商品分析、产品制作、内容生成、审查发布等环节，运营26个虚拟产品实现月被动收入1-2万。素材的核心主张是：AI负责重复性的采集、分析与执行工作，而人负责选方向、定产品和最终验收；找需求应依赖千帆官方数据而非人工刷榜单；内容生产需先将对标账号拆解为Skill再实现稳定输出；整体原则是'人做选择题，AI做执行'。
concepts:
- name: 小红书AI工作台
  desc: 一套由AI Agent驱动的自动化系统，覆盖小红书虚拟产品从选品到发布的全链路，包含千帆榜单采集、账号评分、商品分析、产品制作、内容生成、审查发布六大模块。
  is_original: true
  excerpt:
  - 用406亿Token搭了一套小红书AI工作台做虚拟产品赚钱
  - 覆盖小红书虚拟产品全链路的自动化工作台（千帆榜单采集→账号评分→商品分析→产品制作→内容生成→审查发布）
- name: 人机分工原则（人做选择题，AI做执行）
  desc: 该素材的核心工作哲学：AI负责重复的采集、分析、执行环节，人类负责选方向、定产品和最终验收，即人做选择题、AI做执行。
  is_original: true
  excerpt:
  - AI负责重复的采集、分析、执行，人负责选方向、定产品和最终验收
  - 人做选择题，AI做执行
- name: 对标拆解为Skill
  desc: 将小红书上的对标账号/内容拆解为可复用的Skill（技能模块），使AI能够按照拆解后的结构化能力稳定输出内容，而非依赖一次性提示词。
  is_original: true
  excerpt:
  - 内容生产要先把对标拆成Skill再稳定输出
- name: 千帆官方数据选需求
  desc: 找虚拟产品需求时应使用千帆平台的官方数据进行分析，而非人工手动刷榜单，以提高需求识别的效率和准确性。
  is_original: true
  excerpt:
  - 找需求要用千帆官方数据而非人工刷榜单
- name: AI Agent自动化工作流
  desc: 以AI Agent为核心执行单元，将小红书虚拟产品运营的各个环节串联为自动化工作流，实现从数据采集到内容发布的端到端自动化。
  is_original: false
  excerpt:
  - 用AI Agent搭建覆盖小红书虚拟产品全链路的自动化工作台
methods:
- name: __overview__
  desc: 素材整体方法论为：以AI Agent搭建覆盖小红书虚拟产品全链路的自动化工作台，按'千帆榜单采集→账号评分→商品分析→产品制作→内容生成→审查发布'六步流水线运作，人类在整个流程中仅负责选方向、定产品和最终验收。
  excerpt:
  - 千帆榜单采集→账号评分→商品分析→产品制作→内容生成→审查发布
  - AI负责重复的采集、分析、执行，人负责选方向、定产品和最终验收
- name: 千帆榜单采集
  desc: 工作流第一步：利用AI自动采集千帆平台榜单数据，替代人工刷榜单，作为选品和需求判断的数据基础。
  excerpt:
  - 千帆榜单采集
  - 找需求要用千帆官方数据而非人工刷榜单
- name: 账号评分
  desc: 工作流第二步：对采集到的账号进行自动化评分，用于筛选和评估对标账号的质量与参考价值。
  excerpt:
  - 账号评分
- name: 商品分析
  desc: 工作流第三步：对虚拟产品商品进行自动化分析，辅助判断产品方向与市场机会。
  excerpt:
  - 商品分析
- name: 产品制作
  desc: 工作流第四步：基于分析结果进行虚拟产品的自动化或半自动化制作。
  excerpt:
  - 产品制作
- name: 内容生成（对标拆解为Skill）
  desc: 工作流第五步：先将对标账号/内容拆解为可复用的Skill，再基于Skill驱动AI稳定生成小红书内容，而非依赖一次性提示词。
  excerpt:
  - 内容生成
  - 内容生产要先把对标拆成Skill再稳定输出
- name: 审查发布
  desc: 工作流第六步：由AI执行初步审查，人类进行最终验收后发布，确保内容质量与合规性。
  excerpt:
  - 审查发布
  - 人负责选方向、定产品和最终验收
theorems:
- name: AI执行+人选方向的分工主张
  desc: 核心主张：AI应负责重复性的采集、分析和执行工作，人类应聚焦于选方向、定产品和最终验收，即'人做选择题，AI做执行'。
  excerpt:
  - AI负责重复的采集、分析、执行，人负责选方向、定产品和最终验收
  - 人做选择题，AI做执行
- name: 数据驱动选需求优于人工刷榜单
  desc: 核心主张：找虚拟产品需求应使用千帆官方数据进行分析，而非人工手动刷榜单，前者更高效、更准确。
  excerpt:
  - 找需求要用千帆官方数据而非人工刷榜单
- name: Skill化内容生产优于一次性提示词
  desc: 核心主张：内容生产要先把对标拆解成Skill，再基于Skill实现稳定输出，而非依赖零散的提示词。
  excerpt:
  - 内容生产要先把对标拆成Skill再稳定输出
findings:
- name: 26个虚拟产品月被动收入1-2万
  desc: '[claim] 素材宣称该AI工作台运营26个虚拟产品，实现月被动收入1-2万。素材未提供详细数据表格或验证方法，属于作者自述经营成果，缺乏第三方可验证的证据支撑。'
  excerpt:
  - 运营26个虚拟产品、月被动收入1-2万
- name: 406亿Token消耗搭建工作台
  desc: '[evidence] 素材提及搭建该工作台共消耗406亿Token，作为AI Agent实际运行规模的量化指标，从侧面反映工作流的自动化程度和运行频次。'
  excerpt:
  - 用406亿Token搭了一套小红书AI工作台
- name: 03年自由职业者（大二学生）身份
  desc: '[evidence] 素材以''大二开公司''为标题切入点，表明作者为03年出生的自由职业者，目前大二在读，属于低龄创业者案例，用以增强故事性和传播性。'
  excerpt:
  - 大二开公司
  - 03年自由职业者
