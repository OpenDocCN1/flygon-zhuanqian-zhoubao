- file_path: 260806副业SC精华《AI-实战复盘：跑通微信小店＋知识库自动交付，单周消耗-18-亿-Token》.md
  title: AI 实战复盘：跑通微信小店＋知识库自动交付，单周消耗 18 亿 Token
  summary: 一位全栈程序员复盘如何将 AI 从对话、本地项目辅助开发，逐步推进到驱动微信小店+知识库自动交付系统，单周消耗 18 亿 Token 的完整路径。
  core_question: 如何让 AI 的 Token 消耗随着真实业务稳定增长，并把 AI 从单次对话工具升级为业务系统的自动交付引擎？
  key_judgment: 真正拉开 Token 消耗差距的，不是单次对话长度，而是 AI 在工作流程中被放置的位置：从'老师'（对话问答）到'助手'（本地项目循环开发）再到'服务'（业务系统触发式调用），每次跃迁都对应量级增长。把项目上下文（全局规则/项目规则/任务文档）保存下来，是AI稳定协作的关键。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 口语化
  - 部分技术方案时效性较强（Claude Max、Codex、Hermes 等工具迭代快）
  screening_conclusion: retain
  reason: 提供了从 AI 角色认知、项目上下文管理、方案调研方法论到真实业务自动化交付的完整框架，案例数据具体、流程可迁移，且构建了从认知到落地的清晰逻辑链，适合作为书籍核心章节。
- file_path: 260806副业SC精华《《从0到300+账号矩阵：我如何用网盘拉新项目，四个月变现30万，3.8万字完整复盘》》.md
  title: 从0到300+账号矩阵：我如何用网盘拉新项目，四个月变现30万
  summary: 一位00后流量操盘手复盘网盘拉新项目从发现机会、测试作品、找代发、搭建300+账号矩阵、处理风控到项目下行期调整，四个月变现30万的完整过程。
  core_question: 一个短周期流量项目从0到1，究竟是如何被发现、测试、放大、遇到问题、解决问题，再到进入下行期的？
  key_judgment: 项目不是因新才赚钱，而是因为需求一直存在；矩阵放大的核心不是账号数量，而是能否把复杂动作拆成普通人可执行的标准SOP；有流量不等于有钱，承接链路每一环都决定收益。
  depth: high
  suggested_destination: case
  possible_shape: book
  risks:
  - 内容大量擦边实操细节可能引发合规争议
  - 项目已进入下行期，时效性强
  - 口语化、章节间存在较多重复内容
  - 3.8万字篇幅冗长，需大量精简
  screening_conclusion: retain
  reason: 作为短周期流量项目的完整生命周期样本极具教学价值，从发现到衰退的全过程复盘、代发SOP、评论组承接、风控对抗等细节丰富，可提炼为案例章节中的典型项目样本。但需严格过滤擦边内容并精简。
