- file_path: 260810副业SC精华《做合规、强制执行十几年，分享-OPC、创业者必看的放大思路，帮大家少踩坑》.md
  title: 做合规、强制执行十几年，分享 OPC、创业者必看的放大思路
  summary: 一位法律从业者从强制执行案件出发，总结AI OPC和创业者放大过程中最常见的几种'死法'及规避方法，涵盖公司主体隔离、财务保障、现金流管理、合作边界和投资风险。
  core_question: AI OPC 在放大过程中，创业者本人如何'活下来'，避免因为一次项目失败就永久出局？
  key_judgment: 创业应该是无限概率游戏，不是一命通关；公司制度最大的价值是把'项目死了'和'创业者死了'分开；一人公司举证责任倒置使股东资产风险极高；财务保障计划、客户结构分散、避免个人担保是创业者存活的基本条件。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 法律引用需核实最新法规
  - 部分案例为概括性转述，细节不够具体
  screening_conclusion: retain
  reason: 提供了其他所有素材都缺失的关键维度——风险隔离和创业者生存能力，视角独特、不可替代。将法律实务与创业实践结合的写法实用性强，适合作为全书风控主题的核心章节。
- file_path: 260810副业SC精华《军工程序媛宝妈：通过垂直小号+AI航海家大课的方法实现工作流重塑，拿到正反馈和效率翻倍的实操复盘》.md
  title: 军工程序媛宝妈：通过垂直小号+AI航海家大课的方法实现工作流重塑
  summary: 一位军工领域程序媛宝妈复盘如何通过垂直小号定位、AI知识库搭建、Codex+Obsidian自动化工作流，实现内容生产从手动操作到一句触发词自动生成公众号文章、贴图正文和朋友圈文案的全过程。
  core_question: 如何在主业时间极度受限的情况下，用AI Agent重塑内容生产工作流，把重复劳动自动化，实现副业可持续运转？
  key_judgment: AI Agent不是提效层面的问题，而是这个副业能不能做的问题；知识库不是资料堆，而是可调用资产；Skill是技能工具箱，Agent是手握工具箱的执行者；先写长文再提炼短内容，事实边界才稳。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 技术方案依赖特定工具链（Codex+Obsidian+Hermes+飞书），工具迭代可能影响可复制性
  - 篇幅长且夹杂大量个人感悟和线下社交内容
  - 知识卡片提示词工程内容过长，需提炼
