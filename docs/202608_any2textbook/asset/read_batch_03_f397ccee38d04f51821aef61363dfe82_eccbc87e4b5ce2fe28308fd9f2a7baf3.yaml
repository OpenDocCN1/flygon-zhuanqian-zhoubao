  reason: 提供了一套完整的个人AI知识库+Agent工作流搭建方法论，从定位、内容闭环、知识库选型、Skill拆解到Agent编排，实操性极强且包含大量最小可用模板（skill.md、Agent.md等），适合作为AI工作流主题的核心章节或课程单元基础。
- file_path: 260810副业SC精华《如何用工作流做出4000w播放的海外短剧--tiktok短剧复盘》.md
  title: 如何用工作流做出 4000w 播放的海外短剧——TikTok短剧复盘
  summary: 一位AI漫剧创作者复盘如何通过AI工作流完成TikTok海外短剧的剧本创作、资产搭建、分镜生成和批量提交，单账号5天获得3840万播放，并给出了完整的成本结构和操作流程。
  core_question: 如何用AI工作流批量生产海外短剧，并让AI生成的剧本在TikTok上获得千万级播放？
  key_judgment: 工作流的核心不是做一个什么都能干的AI，而是把人的业务经验拆成可执行的原子步骤；AI写剧本绝对能到4000万播放，但剧本必须人工介入，核心难点在找对标分析和本土化融梗，不在写作本身。
  depth: medium
  suggested_destination: case
  possible_shape: book
  risks:
  - 平台政策（TikTok短剧入驻规则、收益单价）时效性极强
  - 工具依赖（Seedance、LibTV、Trae）变化快
  - 内容和标题偏教程向，深度有限
  screening_conclusion: retain
  reason: 提供了一个AI工作流在具体商业场景中落地并产出大结果的完整案例，'原子级操作拆解'方法论和剧本本土化融梗思路有迁移价值。适合作为案例章节中的AI内容生产案例，但需标注时效性。
