learning_targets:
- 理解Skill价值的本质：价值在工作流和结果物而非内容本身
- 掌握Skill设计三要素（怎么做/用什么/怎样算好）并独立设计一个Skill
- 理解工具分工策略，能判断确定性任务与语义判断任务的边界
- 掌握分层职责架构，能合理分配原则、流程、执行、验证四个层级
- 掌握对标拆解为Skill的方法，能对成功案例进行逆向工程并封装为Skill
- 理解Skill后置原则，能判断何时该沉淀Skill、何时不该封装过载
concept_map:
- Skill篇 —— 让AI学会“怎么干活”
- ├── Skill价值论
- │   ├── 价值定位：工作流+结果物，而非内容本身 —— P001
- │   ├── 关键性质：可复用性/可变现性/沉淀性 —— P001
- │   └── 边界：一次性任务不需Skill化 —— P001
- ├── Skill设计三要素
- │   ├── 怎么做：流程拆解为有序操作步骤 —— P002
- │   ├── 用什么：工具选择（脚本/API/检索库） —— P002
- │   └── 怎样算好：可量化质检标准 —— P002
- ├── 工具分工策略
- │   ├── 确定性任务（格式转换/正则/阈值判断）→ 脚本 —— P003
- │   ├── 语义理解任务（撰写/识别/评估）→ AI —— P003
- │   └── 边界：高度依赖语境的“看似确定”任务仍交AI —— P003
- ├── 分层职责架构
- │   ├── AGENTS.md：存全局原则（价值观/边界） —— P004
- │   ├── Skill：存操作流程（步骤/方法） —— P004
- │   ├── 脚本：负责确定性执行（数据处理） —— P004
- │   └── 验证器：担任最终质量兜底（结果核验） —— P004
- ├── 对标拆解为Skill
- │   ├── 以终为始：从爆款结果倒推过程 —— P005
- │   ├── 可量化复制：提炼公式/模板/结构 —— P005
- │   └── 持续迭代：扩充对标库+反馈修正 —— P005
- └── Skill后置原则
- ├── 先验证后固化：跑通稳定后再封装 —— P006
- ├── 反向指标：频繁返工说明流程未定型 —— P006
- └── 例外条件：长期高频流程可提前规划 —— P006
life_analogy:
- 想象Skill设计是一个**大型餐厅的标准化厨房**：
- '- **Skill价值论** = 餐厅的价值在顾客吃到的成品菜肴和背后的出餐流水线，而不是某一个厨师的闲聊灵感'
- '- **怎么做** = 每道菜的标准化菜谱（备料→切配→烹饪→装盘）'
- '- **用什么** = 厨师该用哪个锅、哪把刀（对应用框架、脚本、API）'
- '- **怎样算好** = 出餐的品控标准（色香味评分、克重误差、出餐时间）'
- '- **工具分工策略** = 切菜机做精确的定量切配，主厨做灵巧的对味觉调控'
- '- **分层职责架构** = 老板管餐厅宗旨（原则层）、厨师长管菜谱（流程层）、帮厨管切配（执行层）、质检员最后把关出餐（验证层）'
- '- **对标拆解为Skill** = 去米其林餐厅采访，把招牌菜的秘密配方和工序反向破解成自己的菜谱'
- '- **Skill后置原则** = 先反复试菜确认顾客喜欢且能稳定复刻，再正式写进菜单并标准化'
summary:
- concept: Skill价值论
  desc: Skill的价值在于可复用的工作流和交付的结果物，而内容本身只是流水线的产品
- concept: Skill设计三要素
  desc: 一个完整的Skill需要回答怎么做（流程）、用什么（工具）、怎样算好（质检标准）
- concept: 工具分工策略
  desc: 确定性任务交给脚本以保效率和精确度，语义理解任务交给AI以发挥灵活判断力
- concept: 分层职责架构
  desc: AGENTS.md存原则、Skill存流程、脚本负责确定性执行、验证器兜底核验，四层各司其职
- concept: 对标拆解为Skill
  desc: 通过逆向工程把成功案例的选题、结构、风格拆解为通用工作流并固化为Skill
- concept: Skill后置原则
  desc: 先跑通流程并证明稳定重复后再沉淀为Skill，防止面向错误路径的过度封装
exercises:
- 'no': 1
  title: 识别Skill价值与普通Prompt的差异
  contents:
  - 给定以下两个场景：
  - 场景A：用户直接让AI写一篇小红书笔记文案；
  - 场景B：用户让AI按照“素材采集→对标分析→文案撰写→配图生成→排版发布”的Skill来完成一篇小红书笔记。
  - 回答问题：
  - '- 场景A和场景B的输出差异是什么？'
  - '- 为什么场景B能形成“可复用性”和“可变现性”（对比场景A）？'
  - '- 有没有可能场景A也值得Skill化？请说出你的判断标准。'
  - '- 请从“工作流+结果物”的视角，指出两个场景各自的“结果物”是什么。'
- 'no': 2
  title: 为一个Skill设计三要素
  contents:
  - 假设你要为一家电商公司设计一个“商品评价自动回复Skill”。
  - 请完成以下设计：
  - 1. 怎么做：拆解出至少4个有序操作步骤（明确每步的输入和输出）
  - 2. 用什么：指出每步使用脚本还是AI（或两者结合），并说明理由
  - 3. 怎样算好：给出3条可量化的质检标准（例如回复字数范围、必须包含的关键要素等）
  - 4. 请指出你的Skill中哪些步骤符合“确定性任务用脚本”原则，哪些符合“语义判断交给AI”原则，为什么？
- 'no': 3
  title: 为Agent做分层职责划分
  contents:
  - 给定一个“周报自动生成Agent”的任务描述：它需要从多个渠道收集本周工作记录、提取关键指标、生成结构化周报、并确保周报格式统一。
  - 现在请运用分层职责架构，设计整个Agent系统：
  - 1. AGENTS.md层：写出2条全局原则（价值观/边界）
  - 2. Skill层：描述核心流程（4~6步）
  - 3. 脚本层：列出2个由脚本负责的确定性任务
  - 4. 验证器层：写出校验器需要检查的2个关键指标/格式
  - 5. 请判断：如果该周报Agent每天只跑一次、流程已稳定运行三个月，是否符合“Skill后置原则”的适用范围？为什么？
- 'no': 4
  title: 对标拆解实战演练
  contents:
  - 选取一个小红书、公众号或抖音中你关注的优质内容账号（可以自己指定一个爆款案例或使用示例：某职场类博主连续爆款）。
  - 按照“以终为始”的思路，拆解其生产流程：
  - 1. 选取2~3篇该账号的爆款内容，归纳它们共同的选题类型
  - 2. 拆解它们的共同结构框架（如：开头→痛点列举→反转→行动清单）
  - 3. 提取一套通用的“标题公式”和“章节模板”
  - 4. 将以上步骤抽象为一个可复用的“内容生成Skill”的逻辑流程
  - 5. 回答问题：为什么“纯灵感型”内容（如诗歌）不适合拆解为Skill？请结合核心性质“可量化复制”说明。
units:
- 'no': 1
  name: Skill价值论 —— 让AI从“会聊”到“会交付”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人用AI只停留在“聊得好”层面，但真正有价值的产出是能直接使用的工作流和结果物'
  - '- 如果没有明确的交付标准，AI的输出会随机波动，无法形成稳定可靠的“生产”能力'
  - '- 生产模式下，中间闲聊内容不具有复用价值，只有沉淀为可复制的工作流才有意义'
  - '**核心定义**'
  - '- Skill的本质价值不是它生成的内容文本，而是承载这些内容的一整套工作流程和最终交付物（结果物）'
  - '- “内容本身”是流水线上的产品，“工作流+结果物”才是让产品持续产出的生产线'
  - '**关键性质**'
  - '- 可复用性：工作流一旦成型，可被反复调用和部署，内容每次由流程自动生成'
  - '- 可变现性：虚拟产品（如模板工具、自动化工作流）可以无限复制出售，边际成本趋近于零'
  - '- 沉淀性：对个人而言，工作流是能力的沉淀，不会因内容过时失效'
  - '**典型例子**'
  - '- 同样是做小红书笔记，一次聊天让AI写一篇爆文是一次性内容；把它拆解成“素材采集→对标分析→文案撰写→配图生成→排版发布”的Skill，则能在每个星期稳定产出多篇笔记，且质量可预期'
  - '**边界条件**'
  - '- 并非所有AI交互都需要Skill化：一次性探索、灵感发想等偶发任务不值得建Skill来固化'
  - '- 只有当任务具备“重复出现+结果可定义+流程可复制”三特性时才该沉淀为Skill，否则过度封装反而增加维护成本'
  - '...'
  sources:
  - paper: 260826《用个人工作台+Skill做虚拟产品生意》
    role: origin
  excerpts:
  - Skill的价值在工作流和结果物而非内容本身。
- 'no': 2
  name: Skill设计三要素 —— 给Skill装上“操作说明书+工具箱+质检标准”
  points:
  - '**为什么需要这个概念？**'
  - '- 有了Skill价值的定位，还要解决“怎么设计和落地”的问题'
  - '- 很多人写Prompt只告诉AI“要什么”，却没告诉AI“怎么一步步做、用什么工具、做到什么程度算好”，结果输出不稳定'
  - '- 需要一套完整的设计规范，让Skill像产品说明一样可执行、可验证'
  - '**核心定义**'
  - '- Skill设计三要素：怎么做（流程拆解）、用什么（工具选择）、怎样算好（质量标准）'
  - '- “怎么做”指将任务分解为数个有序操作步骤，每一步有明确输入输出；“用什么”指定工具类型（脚本、API、检索库等）；“怎样算好”给出评价维度，供AI自检或外部验证'
  - '**关键性质**'
  - '- 可执行性：每一条操作指令指令都要能被AI理解和执行，不能留有模糊地带'
  - '- 可质检性：质量标准必须可量化（字数范围、格式模板、繁简标准）或可判定（含必含关键词、排除敏感词）'
  - '- 可组装性：一个Skill的“怎么做”往往由多个原子化动作组合而成，便于复用和拼装'
  - '**典型例子**'
  - '- 搭建一个“周报整理Skill”：怎么做（收集原始素材→分类→提炼关键指标→生成结构化周报）；用什么（json提取脚本+表格渲染器）；怎样算好（不超过500字、必须含数据环比、格式含三段式标题）'
  - '**边界条件**'
  - '- 三大要素并非在每个Skill中都要做同样深度：简单Skill只要“怎么做”清晰即可；复杂Skill需要强化“工具选择”和“质检标准”；但如果任务本身一次性，则不需要完整三要素设计'
  - '...'
  sources:
  - paper: 260828《Agent员工军团搭建流程》
    role: origin
  excerpts:
  - Skill设计三要素（怎么做/用什么/怎样算好）。
- 'no': 3
  name: 工具分工策略 —— 让脚本和AI各干各的专长
  points:
  - '**为什么需要这个概念？**'
  - '- 在复杂Skill中，既要类精准的逻辑计算，也要灵活语义理解和生成，单一依靠AI全包可能效率低、准确率差'
  - '- 需要明确“确定性任务交给脚本、语义判断交给AI”的分工原则，才能让Skill运行又快又准'
  - '**核心定义**'
  - '- 工具分工策略：将Skill流程中的任务分为“确定性执行”和“语义理解”两类，前者（如格式转换、文件批量处理、正则匹配、阈值判断）由脚本处理，后者（如内容撰写、意图识别、情感评估）交由AI'
  - '**关键性质**- 确定性分工的标准：该任务算法能否给出100%确定的输出，若能则交给脚本，若需要主观理解、语境推理则交给AI'
  - '- 两难处理：当一个任务看似“确定”但实际上高度依赖语境时（如判断消息是否包含投诉意图），仍然应由AI承担'
  - '- 效率提升：脚本以毫秒级完成数据处理，AI专注文本生成，减少双方资源浪费'
  - '**典型例子**'
  - '- 在小红书内容批量生产Skill中：抓取商品信息和图片下载用Python脚本，而“撰写种草文案”和“选择封面图”由AI完成'
  - '**边界条件**'
  - '- 极端情况下若AIAPI频繁故障，脚本任务的占比可适当提高以保障最低可用性'
  - '- 如果任务对语义容错要求极低（如家国硬编码格式），应坚定交给脚本而不是让AI自由发挥'
  - '...'
  sources:
  - paper: 260803《AI Agent员工》
    role: origin
  excerpts:
  - 确定性任务用脚本，语义判断交给AI。
- 'no': 4
  name: 分层职责架构 —— 让原则、流程、执行、兜底各归其位
  points:
  - '**为什么需要这个概念？**'
  - '- 一个复杂的Agent系统往往因把规则、流程、命令和检查混在一起而变得臃肿、难以维护和调试'
  - '- 需要将不同性质的“知识”划分到不同层级：长期原则、流程工具、确定性脚本、最终校验，让每层各司其职'
  - '**核心定义**'
  - '- 分层职责架构：将Agent系统的知识分为四个层级——AGENTS.md存储全局原则（价值观和边界）、Skill存储操作流程（步骤与方法）、脚本负责确定性执行（数据处理）、验证器（校验器）担任最终质量兜底（结果核验）'
  - '**关键性质**'
  - '- 单向依赖：上层可调用下层知识，但下层不要反向侵入上层；原则只约束流程，不考虑具体API细节'
  - '- 覆盖原则：原则层保证了边界安全，流程层确保产出方式，执行层保证效率和精确度，验证层则给出最终可否放行的答案，四层覆盖完整闭环'
  - '- 可维护性：当需求升级时只修改对应层文件即可，无需重写整个Agent'
  - '**典型例子**'
  - '- 构建“招聘筛选Agent”：AGENTS.md写入‘严禁歧视’等原则；Skill内置‘读简历→按指标打分→输出汇总→生成邮件’流程；脚本负责批量PDF转换；验证器最后检查是否有漏选或分数格式错误'
  - '**边界条件**'
  - '- 对于极简型Skill，可弱化分层，无需验证器或脚本；但一旦任务涉生产级交付，四层缺一不可'
  - '- 当原则与流程严重冲突时，原则优先，不能为流程顺滑而破坏原则'
  - '...'
  sources:
  - paper: 260803《AI Agent员工》
    role: origin
  excerpts:
  - AGENTS.md存原则、Skill存流程、脚本负责确定性、验证器兜底。
- 'no': 5
  name: 对标拆解为Skill —— 把爆款内容变成可复制的生产流水线
  points:
  - '**为什么需要这个概念？**'
  - '- 前期我们理解了Skill的价值和设计三要素，但最核心的问题是“如何从零开始设计一个Skill？”尤其要产出稳定爆款内容，不能每次都靠灵感或随机试探'
  - '- 最有效的方法不是凭空发明，而是对已经成功的对标案例做逆向工程：把爆款内容拆解为操作流程，再固化为Skill'
  - '**核心定义**'
  - '- 对标拆解为Skill指：选取优质的对标账号/内容，通过逆向分析法拆解其选题策略、结构框架、风格表达和发布机制，将其抽象为通用工作流并封装为一套可复用的Skill'
  - '**关键性质**- 以终为始：从结果（爆款）推过程（步骤），每一步都有对标样本可供对照优化'
  - '- 可量化复制：拆解后的步骤含具体公式（如标题模板、卡片配色、章节结构），即便换主题也能产出相似質感输出'
  - '- 持续迭代：Skill本身不是终点，通过对标库的扩充和反馈数据持续修正流程，实现自我进化'
  - '**典型例子**'
  - '- 拆解某小红书知识博主：发现其爆款笔记普遍采用“3个痛点+1个颠覆认知+1个行动清单”结构，于是固化为“小红书笔记生成Skill”，后续用不同主题代入同样结构，连续稳定输出同质量爆文'
  - '**边界条件**'
  - '- 对标对象选择需谨慎：可持续产出1-2个月的同类优质内容才能作为对标，普通热门偶然爆款不适合当作稳定模板'
  - '- 不能对“纯灵感型”内容强行拆解，如诗歌、实验性文学，其核心不可在流程层面量化'
  - '...'
  sources:
  - paper: 260817《小红书AI工作台做虚拟产品》
    role: origin
  excerpts:
  - 内容生产先把对标拆成Skill再稳定输出。
- 'no': 6
  name: Skill后置原则 —— 先把流程跑通，再来提效
  points:
  - '**为什么需要这个概念？**'
  - '- 前面的Skill设计原则容易让人产生冲动：一上来就为所有任务建Skill，结果流程没摸清反而被复杂的配置文件拖垮'
  - '- 需要一条“不做什么”的边界原则——Skill与总控Agent应当待流程稳定重复之后再加，防止“面向反模式的设计”'
  - '**核心定义**'
  - '- Skill后置原则：在首次尝试某项AI任务时，不急着固化Skill，先用非正式的交互把完整流程跑通、验证输出结果和稳定性；当某个流程已被证明可重复执行并稳定达标后，再将其沉淀为Skill和总控Agent'
  - '**关键性质**'
  - '- 先验证后固化：只有证明流程每天都能跑通的才值得封装为Skill，否则封装的是错误路径'
  - '- 反向指标：如果一个流程出现了多次返工、修修补补修补，说明流程未定型，先别封装'
  - '- 减少维护负担：过早建Skill会造成后续流程变更时需反复修改配置和验证器，反而浪费更多人力'
  - '**典型例子**'
  - '- 利用Obsidian+Codex搭建个人知识库时，最初先用临时Prompt试写插件脚本，反复确认数据路径和格式后，才正式写成Skill，避免每次修改路径还要改验证器'
  - '**边界条件**'
  - '- 对于长期固定的高频流程（如日报生成）可以提前规划Skill架构再试跑，例外于后置原则'
  - '- 若公司已持有成熟流程模板（来自系统文档）且验证明确，可直接照搬成Skill，无需重新“先跑通”'
