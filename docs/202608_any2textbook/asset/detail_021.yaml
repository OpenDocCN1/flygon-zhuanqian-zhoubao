- 'no': 6
  name: 小红书运营三件套 —— 从曝光到留资的“三位一体”引擎
  points:
  - '**为什么需要这个概念？**'
  - '- 很多品牌做小红书仅发笔记，缺少系统性的承接路径，导致流量进来却无法捕捉'
  - '- 需要用固定的组合框架解决“内容—载体—转化”的链路问题'
  - '**核心定义**'
  - '- 小红书运营的三个核心组件：商卡（品牌承接）+ 账号（内容阵地）+ 引流SOP（转化流程）'
  - '- 三者各自承担不同功能，共同构成完整获客链路'
  - '**关键性质**'
  - '- 分工明确：商卡负责承接信任，账号负责内容输出，引流SOP负责稳定转化'
  - '- 缺一不可：少任一组件链路断裂'
  - '- 可标准化：三件套可沉淀为SOP复用，降低运营门槛'
  - '**典型例子**'
  - '- 一个知识付费品牌：通过小红书账号发布干货笔记 → 用户点击主页商卡了解服务 → 按引流SOP安排企微承接，实现稳定获客'
  - '**边界条件**'
  - '- 适用于以小红书为主要获客渠道的B2C或轻B2B业务'
  - '- 若客户决策周期极长或客单价极高，需在基础上增加更深度的培育环节'
  sources:
  - paper: 260813《账号引流SOP搭建》
    role: origin
  excerpts:
  - 商卡+账号+引流SOP。
- 'no': 7
  name: 上小红书获客动因 —— 为什么偏偏是“小红书”？
  points:
  - '**为什么需要这个概念？**'
  - '- 新消费品牌在做渠道选择时面临多平台困惑，需要清晰的平台选择依据'
  - '- 需要明确小红书与抖音、快手等平台的差异性定位，避免盲目多平台撒网'
  - '**核心定义**'
  - '- 品牌选择小红书作为获客阵地的主要原因有两个（内容生态+用户决策心智）'
  - '- 这两个原因共同构成选择小红书的核心动因'
  - '**关键性质**'
  - '- 定位清晰：小红书是“种草+决策”平台，不只是内容消费平台'
  - '- 二因驱动：用户主动搜索比被动刷到更具购买意图'
  - '- 成本优势：在同等内容投入下，小红书获客性价比高于部分其他平台'
  - '**典型例子**'
  - '- 一个家居品牌，在抖音靠投流获客成本200元/条，在小红书通过种草笔记获客成本80元/条——用户在小红书上有更强的购买决策意愿'
  - '**边界条件**'
  - '- 适用于客单价中高、决策周期中等、女性用户为主或视觉表现力强的品类'
  - '- 若产品依赖强展示或强冲动型消费，小红书可能不是最优阵地'
  sources:
  - paper: 260813《账号引流SOP搭建》
    role: origin
  excerpts:
  - 到小红书上获客的原因主要有两个。
