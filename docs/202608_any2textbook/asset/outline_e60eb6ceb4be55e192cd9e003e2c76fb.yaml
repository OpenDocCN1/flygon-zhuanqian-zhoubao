- 'no': 1
  name: 风控合规 —— 从“一命通关”到“无限游戏”
  desc: 本章从“风险切割”的底层逻辑出发，带你理解创业者如何通过合规设计，将“项目失败”与“个人出局”解耦，从而在创业这场无限游戏中持续参与。
  nodes:
  - 'no': 1
    name: 无限概率游戏视角——创业的Truth or Dare
    desc: 打破“一锤子买卖”的线性思维，用“无限概率游戏”的类比理解创业本质：项目失败不是终局，而是下一轮游戏的筹码。
    role: motivation
    src:
    - paper: 260810《OPC与创业者放大思路（风控合规）》
  - 'no': 2
    name: 公司制度——创业者的“风险安全气囊”
    desc: 指出公司制度的核心价值：将“项目死亡”与“创业者死亡”两大风险事件解耦，让创业者资产与项目债务之间建立隔离带。
    role: definition
    src:
    - paper: 260810《OPC与创业者放大思路（风控合规）》
  - 'no': 3
    name: 法人人格独立与有限责任的边界
    desc: 解析公司法中“有限责任”与“法人人格独立”的形式化定义，说明风险切割的法律基石与适用前提。
    role: definition
    src:
    - paper: 260810《OPC与创业者放大思路（风控合规）》
  - 'no': 4
    name: 一人公司（OPC）的举证责任倒置陷阱
    desc: 重点剖析一人公司中“举证责任倒置”条款：默认股东与公司财产混同，股东需自证清白，导致风险切割机制被严重弱化。
    role: limitation
    src:
    - paper: 260810《OPC与创业者放大思路（风控合规）》
  - 'no': 5
    name: 三重防火墙——财务、客户与担保
    desc: 提出存活三大底线：财务保障计划、客户结构分散、避免个人担保。这既是风控方法，也是防止“公司风险”外溢为“个人风险”的操作规程。
    role: method
    src:
    - paper: 260810《OPC与创业者放大思路（风控合规）》
  - 'no': 6
    name: 举证责任倒置的破解——从形式合规到实质合规
    desc: 针对一人公司“举证责任倒置”局限，给出进阶策略：如何通过独立财务核算、规范的治理留痕等操作，重新找回“风险切割”的保护效力。
    role: extension
    src:
    - paper: 260810《OPC与创业者放大思路（风控合规）》
  - 'no': 7
    name: 「十六年实务」视角——合规不是成本，是下注资格
    desc: 以资深实务者十余年合规与强制执行经验收束：风控的终极目的不是收益最大化，而是保住“继续参与游戏”的资格。
    role: experiment
    src:
    - paper: 260810《OPC与创业者放大思路（风控合规）》
