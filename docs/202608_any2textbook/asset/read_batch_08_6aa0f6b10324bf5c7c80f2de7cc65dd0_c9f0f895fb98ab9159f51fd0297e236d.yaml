  - 后半段MCN蓝图是推演而非已验证
  - 作者有京东运营+B站带货背景，可复制性需标注
  - 营销尾巴（附带私域引流广告）
  screening_conclusion: retain
  reason: 三篇中方法论沉淀最系统的一篇：四层变现体系、'商业目标→产品→人群→定位→内容'倒推法、'流量+干货+IP+营销'内容框架、从4000元小场景切入企业服务的实操路径，均具有高度可迁移性。且作者有前大厂和B站带货背景，可作为'有基础的人做AI自媒体'的案例。小懒判断已标注可复制性风险。
