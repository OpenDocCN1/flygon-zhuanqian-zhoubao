learning_targets:
- 理解高客单转化为何是长链路能力而非流量技巧
- 掌握从模糊咨询到成交的关键环节与需求感知机制
- 理解供应链壁垒与专业学习路径对转化的支撑作用
- 能针对高客单场景设计有效的需求挖掘与方案定制策略
concept_map:
- 高客单转化
- ├── 基础认知
- │   ├── 长链路能力壁垒论 —— P001
