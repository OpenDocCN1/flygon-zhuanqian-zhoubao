- 'no': 5
  name: 反馈回流 —— 让经营系统在循环中“越跑越聪明”
  points:
  - '**为什么需要这个概念？**'
  - '- 自动化系统在真实环境中会遇到未预见的客户拒绝、话术失效等问题'
  - '- 如果系统只会按固定脚本执行，不吸收实际反馈，效率会随环境变化逐渐下降'
  - '- 需要一种机制，把每一次经营互动产生的数据回传至系统，驱动下一次优化'
  - '**核心定义**'
  - '- 指将Agent军团在执行任务过程中的实际表现数据（如客户回复率、成交转化率、话术卡点）自动或被人工采集后，回流到流程定义层，用于迭代更新原则、Skill或脚本'
  - '- 它是Agent军团自我进化的燃料'
  - '**关键性质****'
  - '- 闭环性：执行→反馈→修正→再执行形成持续闭环'
  - '- 多层回流：反馈既可以微调脚本（短期），也可沉淀为Skill新流程（中期），甚至上升为修订AGENTS.md原则（长期）'
  - '- 数据驱动：反馈以数据事实为标准而非主观感受，保证优化方向稳定'
  - '**典型例子**'
  - '- 交付Agent发现学员在第三课后流失率高，验证器自动判断课程交付脚本吸引力不足，将信息回流到Skill层，团队根据反馈增加“每周实践作业点评”环节，下一期流失率显著下降'
  - '**边界条件**'
  - '- 反馈回流依赖准确的数据采集，若Agent未记录关键交互数据，回流信息失真会误导调整方向'
  - '- 小规模经营时反馈样本有限，需人工判断是否已达到“值得调整”的指令阈值，避免频繁改动导致系统不稳'
  - '...'
  sources:
  - paper: 260828《Agent员工军团搭建流程》
    role: origin
  excerpts:
  - 反馈回流是系统进化的关键。
