    \      \"points\": [\n        \"**为什么需要这个概念？**\",\n        \"- 引流获客时，单靠一个环节容易失衡，比如只有流量没有交付口碑，或者有人设但没流量。\"\
    ,\n        \"- 需要一种结构化的思维方式，保证引流端的稳定性和可持续性。\",\n        \"- 传统做法是零散投放，缺乏整体框架，容易顾此失彼。\"\
    ,\n        \"**核心定义**\",\n        \"- 引流端由三条腿构成：人设、流量、交付。三条腿缺一不可，形成稳定三角。\",\n\
