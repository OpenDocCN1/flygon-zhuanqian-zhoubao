    \ \"- 搭建一个“周报整理Skill”：怎么做（收集原始素材→分类→提炼关键指标→生成结构化周报）；用什么（json提取脚本+表格渲染器）；怎样算好（不超过500字、必须含数据环比、格式含三段式标题）\"\
    ,\n        \"**边界条件**\",\n        \"- 三大要素并非在每个Skill中都要做同样深度：简单Skill只要“怎么做”清晰即可；复杂Skill需要强化“工具选择”和“质检标准”；但如果任务本身一次性，则不需要完整三要素设计\"\
