    \    },\n    {\n      \"no\": 3,\n      \"name\": \"工具分工策略 —— 让脚本和AI各干各的专长\",\n\
    \      \"points\": [\n        \"**为什么需要这个概念？**\",\n        \"- 在复杂Skill中，既要类精准的逻辑计算，也要灵活语义理解和生成，单一依靠AI全包可能效率低、准确率差\"\
    ,\n        \"- 需要明确“确定性任务交给脚本、语义判断交给AI”的分工原则，才能让Skill运行又快又准\",\n        \"**核心定义**\"\
    ,\n        \"- 工具分工策略：将Skill流程中的任务分为“确定性执行”和“语义理解”两类，前者（如格式转换、文件批量处理、正则匹配、阈值判断）由脚本处理，后者（如内容撰写、意图识别、情感评估）交由AI\"\
    ,\n        \"**关键性质**- 确定性分工的标准：该任务算法能否给出100%确定的输出，若能则交给脚本，若需要主观理解、语境推理则交给AI\"\
    ,\n        \"- 两难处理：当一个任务看似“确定”但实际上高度依赖语境时（如判断消息是否包含投诉意图），仍然应由AI承担\",\n      \
    \  \"- 效率提升：脚本以毫秒级完成数据处理，AI专注文本生成，减少双方资源浪费\",\n        \"**典型例子**\",\n       \
    \ \"- 在小红书内容批量生产Skill中：抓取商品信息和图片下载用Python脚本，而“撰写种草文案”和“选择封面图”由AI完成\",\n      \
    \  \"**边界条件**\",\n        \"- 极端情况下若AIAPI频繁故障，脚本任务的占比可适当提高以保障最低可用性\",\n      \
    \  \"- 如果任务对语义容错要求极低（如家国硬编码格式），应坚定交给脚本而不是让AI自由发挥\",\n        \"...\"\n      ],\n\
