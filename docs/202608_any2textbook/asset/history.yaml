    \        \"确定性任务用脚本，语义判断交给AI。\"\n      ]\n    },\n    {\n      \"no\": 4,\n  \
    \    \"name\": \"分层职责架构 —— 让原则、流程、执行、兜底各归其位\",\n      \"points\": [\n        \"\
    **为什么需要这个概念？**\",\n        \"- 一个复杂的Agent系统往往因把规则、流程、命令和检查混在一起而变得臃肿、难以维护和调试\"\
    ,\n        \"- 需要将不同性质的“知识”划分到不同层级：长期原则、流程工具、确定性脚本、最终校验，让每层各司其职\",\n        \"\
    **核心定义**\",\n        \"- 分层职责架构：将Agent系统的知识分为四个层级——AGENTS.md存储全局原则（价值观和边界）、Skill存储操作流程（步骤与方法）、脚本负责确定性执行（数据处理）、验证器（校验器）担任最终质量兜底（结果核验）\"\
    ,\n        \"**关键性质**\",\n        \"- 单向依赖：上层可调用下层知识，但下层不要反向侵入上层；原则只约束流程，不考虑具体API细节\"\
    ,\n        \"- 覆盖原则：原则层保证了边界安全，流程层确保产出方式，执行层保证效率和精确度，验证层则给出最终可否放行的答案，四层覆盖完整闭环\"\
    ,\n        \"- 可维护性：当需求升级时只修改对应层文件即可，无需重写整个Agent\",\n        \"**典型例子**\",\n \
    \       \"- 构建“招聘筛选Agent”：AGENTS.md写入‘严禁歧视’等原则；Skill内置‘读简历→按指标打分→输出汇总→生成邮件’流程；脚本负责批量PDF转换；验证器最后检查是否有漏选或分数格式错误\"\
    ,\n        \"**边界条件**\",\n        \"- 对于极简型Skill，可弱化分层，无需验证器或脚本；但一旦任务涉生产级交付，四层缺一不可\"\
    ,\n        \"- 当原则与流程严重冲突时，原则优先，不能为流程顺滑而破坏原则\",\n        \"...\"\n      ],\n \
