    \      \"name\": \"Skill后置原则 —— 先把流程跑通，再来提效\",\n      \"points\": [\n        \"\
    **为什么需要这个概念？**\",\n        \"- 前面的Skill设计原则容易让人产生冲动：一上来就为所有任务建Skill，结果流程没摸清反而被复杂的配置文件拖垮\"\
    ,\n        \"- 需要一条“不做什么”的边界原则——Skill与总控Agent应当待流程稳定重复之后再加，防止“面向反模式的设计”\",\n \
    \       \"**核心定义**\",\n        \"- Skill后置原则：在首次尝试某项AI任务时，不急着固化Skill，先用非正式的交互把完整流程跑通、验证输出结果和稳定性；当某个流程已被证明可重复执行并稳定达标后，再将其沉淀为Skill和总控Agent\"\
    ,\n        \"**关键性质**\",\n        \"- 先验证后固化：只有证明流程每天都能跑通的才值得封装为Skill，否则封装的是错误路径\"\
    ,\n        \"- 反向指标：如果一个流程出现了多次返工、修修补补修补，说明流程未定型，先别封装\",\n        \"- 减少维护负担：过早建Skill会造成后续流程变更时需反复修改配置和验证器，反而浪费更多人力\"\
