    ,\n        \"**核心定义**\",\n        \"- 将客户按意愿度、预算或信任度分层，为每一层设计对应的承接方式（如免费内容、低价体验、正式方案）。\"\
    ,\n        \"- 目的是为高客单产品留出足够的铺垫和缓冲空间。\",\n        \"**关键性质**\",\n        \"- 渐进性：承接路径由轻到重，客户一步步往上走。\"\
    ,\n        \"- 层次感：不同层级对应不同产品策略，而不是一刀切。\",\n        \"- 转化效率：分层能让有限的人力优先服务最有意愿的客户。\"\
