- name: 真正卡住的是不敢向具体的人要钱
  desc: '[claim] 该结论宣称真正卡住的地方是：你不敢把一个东西清楚地介绍给具体的人并问他愿不愿意付钱。素材未提供量化数据支撑，属于作者基于线下活动观察的主张。'
  excerpt:
  - 真正卡住的地方是：你不敢把一个东西清楚地介绍给具体的人并问他愿不愿意付钱。
