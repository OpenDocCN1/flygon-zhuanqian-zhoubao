paper: 260803《AI时代到底怎么赚钱，先去做离钱最近的事》
desc: 该素材基于作者举办31场线下活动的观察，指出AI时代工具虽升级但人们卡住的位置没变——从'有流量不知道怎么变现'变为'用AI做了产品不知道怎么变现'，真正卡点是销售能力，即不敢把产品清楚介绍给具体的人并直接询问付费意愿；AI加速了产品生产但未让成交自动发生，因此提出'先去做离钱最近的事'的核心主张，并给出列通讯录100人、现金投票、7天行动计划等方法论。
concepts:
- name: AI时代的变现卡点转移
  desc: 该概念指工具升级后，人们卡住的位置并未改变，只是从'有流量不知道怎么变现'转变为'用AI做了产品不知道怎么变现'。
  is_original: true
  excerpt:
  - 作者办了31场线下活动，发现工具升级了但大家卡住的位置没变。以前"有流量不知道怎么变现"，现在"用AI做了产品不知道怎么变现"。
- name: 现金投票
  desc: 该概念指先向用户收钱、再完善产品，用真实付费行为验证需求，而非等产品完美后再销售。
  is_original: true
  excerpt:
  - 做现金投票（先收钱再完善产品）
  - 产品可以不完美，先完成现金投票；不要追求产品完美再去卖。
- name: 离钱最近的事
  desc: 该概念指优先去做直接产生成交和现金收入的动作，而非停留在产品打磨或流量获取等间接环节。
  is_original: true
  excerpt:
  - 核心判断："先去做离钱最近的事"。
- name: 销售能力作为真正壁垒
  desc: 该概念指在AI让产品生产变快之后，真正的竞争壁垒不是产品制作，而是把产品清楚介绍给具体的人并促成付费的销售能力。
  is_original: true
  excerpt:
  - 真正壁垒是销售能力。
  - 你不敢把一个东西清楚地介绍给具体的人并问他愿不愿意付钱。AI让产品变快了，但没有让成交自动发生。
methods:
- name: __overview__
  desc: 该素材的整体方法论是：先做离钱最近的事，通过列通讯录100人、现金投票和7天行动计划，把销售动作前置，用真实付费验证并推动成交。
  excerpt:
  - 方法论：列出通讯录100人、做现金投票（先收钱再完善产品）、7天行动计划。
  - 核心判断："先去做离钱最近的事"。
- name: 列出通讯录100人
  desc: 该方法指从通讯录中列出100个具体的人，作为销售和验证的直接对象，避免抽象地谈流量或市场。
  excerpt:
  - 方法论：列出通讯录100人
- name: 现金投票
  desc: 该方法指先收钱再完善产品，用真实付费行为验证需求，而不是等产品完美后再卖。
  excerpt:
  - 做现金投票（先收钱再完善产品）
  - 产品可以不完美，先完成现金投票；不要追求产品完美再去卖。
- name: 7天行动计划
  desc: 该方法指通过一个7天的具体行动计划，把销售和成交动作落实到短期内执行。
  excerpt:
  - 7天行动计划。
theorems:
- name: AI没有让成交自动发生
  desc: 该核心主张认为，AI让产品变快了，但并没有让成交自动发生，成交仍依赖销售动作。
  excerpt:
  - AI让产品变快了，但没有让成交自动发生。
- name: 真正壁垒是销售能力
  desc: 该核心主张认为，在AI时代产品生产门槛降低后，真正的壁垒是销售能力，即敢把产品清楚介绍给具体的人并询问付费意愿。
  excerpt:
  - 真正壁垒是销售能力。
  - 你不敢把一个东西清楚地介绍给具体的人并问他愿不愿意付钱。
- name: 先去做离钱最近的事
  desc: 该核心主张认为，应优先去做直接产生现金和成交的事，而不是先追求产品完美或流量规模。
  excerpt:
  - 核心判断："先去做离钱最近的事"。
- name: 产品可以不完美，先完成现金投票
  desc: 该核心主张认为，不要追求产品完美再去卖，而应先通过现金投票验证需求。
  excerpt:
  - 作者观点：产品可以不完美，先完成现金投票；不要追求产品完美再去卖。
