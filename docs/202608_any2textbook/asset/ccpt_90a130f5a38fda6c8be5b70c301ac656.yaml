paper: 260828《Agent员工军团搭建流程》
desc: 该素材是一份关于AI超级个体搭建多Agent协作系统的实操方法论，提出用「五步法」（拆解业务找场景→数据采集搭知识库→Skill固化产出→设计交互搭Agent→反馈回流驱动进化）从零构建12个Agent员工，实现公众号创作、朋友圈营销等业务全面AI化并达成月入7万的个人商业闭环，核心主张是AI的目标在于提效而非使用工具本身，一切应从真实任务出发、以知识库让AI认识你、以Skill让AI学会干活、以Agent让AI成为员工，并以反馈回流驱动系统持续进化。
concepts:
- name: Agent员工军团
  desc: 由多个各司其职的AI Agent组成的协作团队，替代真人承担公众号创作、朋友圈营销等具体业务职能，形成可规模化的个人商业系统。
  is_original: true
  excerpt:
  - 04年AI超级个体用五步法搭建12个Agent员工，实现公众号创作、朋友圈营销等全面AI化，月入7w。
- name: 五步法
  desc: 搭建Agent员工军团的整体流程框架：拆解业务找场景→数据采集搭知识库→Skill固化产出→设计交互搭Agent→反馈回流驱动进化。
  is_original: true
  excerpt:
  - 五步法：拆解业务找场景→数据采集搭知识库→Skill固化产出→设计交互搭Agent→反馈回流驱动进化。
- name: 知识库四文件夹结构
  desc: 将知识库组织为「任务DNA / 标准 / 资产 / 工作区」四个文件夹的清晰结构，强调知识库不是为大而是为清晰，用于让AI认识你。
  is_original: true
  excerpt:
  - 知识库四文件夹结构（任务DNA/标准/资产/工作区）。
  - 知识库不是为大而是为清晰；知识库让AI认识你。
- name: Skill设计三要素
  desc: Skill固化产出所依赖的三个设计要素：怎么做、用什么、怎样算好，用于让AI学会干活。
  is_original: true
  excerpt:
  - Skill设计三要素（怎么做/用什么/怎样算好）。
  - Skill让AI学会干活。
- name: 反馈回流
  desc: 将Agent员工运行中的结果与反馈回流到系统中，驱动知识库、Skill与Agent持续进化的机制，被视为系统进化的关键。
  is_original: true
  excerpt:
  - 反馈回流是系统进化的关键。
  - 反馈回流驱动进化。
methods:
- name: __overview__
  desc: 以真实业务任务为起点而非从工具出发，按「拆解业务找场景→数据采集搭知识库→Skill固化产出→设计交互搭Agent→反馈回流驱动进化」五步递进搭建Agent员工军团的整体方法论，配套知识库四文件夹结构与Skill设计三要素作为落地抓手。
  excerpt:
  - 五步法：拆解业务找场景→数据采集搭知识库→Skill固化产出→设计交互搭Agent→反馈回流驱动进化。
  - 一切从真实任务开始而非从工具开始。
- name: 拆解业务找场景
  desc: 五步法第一步：将自身业务拆解为可被AI承接的具体场景，作为后续知识库、Skill与Agent建设的输入。
  excerpt:
  - 拆解业务找场景
- name: 数据采集搭知识库
  desc: 五步法第二步：采集数据并按四文件夹结构（任务DNA/标准/资产/工作区）搭建知识库，目标是清晰而非体量庞大，让AI认识你。
  excerpt:
  - 数据采集搭知识库
  - 知识库四文件夹结构（任务DNA/标准/资产/工作区）。
  - 知识库不是为大而是为清晰。
- name: Skill固化产出
  desc: 五步法第三步：按「怎么做/用什么/怎样算好」三要素将产出流程固化为Skill，让AI学会干活。
  excerpt:
  - Skill固化产出
  - Skill设计三要素（怎么做/用什么/怎样算好）。
- name: 设计交互搭Agent
  desc: 五步法第四步：设计交互方式并组装Agent，使AI从工具变为承担岗位职能的「员工」。
  excerpt:
  - 设计交互搭Agent
  - Agent让AI成为员工。
- name: 反馈回流驱动进化
  desc: 五步法第五步：建立反馈回流机制，用运行结果反哺系统，实现知识库、Skill与Agent的持续迭代进化。
  excerpt:
  - 反馈回流驱动进化
  - 反馈回流是系统进化的关键。
theorems:
- name: AI的目的命题
  desc: AI的目的不是用上AI，而是用AI提效——把是否真正提升业务效率作为AI化建设的唯一衡量标准。
  excerpt:
  - 核心判断：AI的目的不是用上AI而是用AI提效。
- name: AI三层递进命题
  desc: 知识库让AI认识你、Skill让AI学会干活、Agent让AI成为员工——三者构成从认知到执行再到岗位化的递进关系。
  excerpt:
  - 知识库让AI认识你、Skill让AI学会干活、Agent让AI成为员工。
- name: 真实任务起点命题
  desc: 搭建Agent系统应当从真实任务开始，而非从工具开始，避免为用工具而搭建。
  excerpt:
  - 一切从真实任务开始而非从工具开始。
- name: 知识库清晰度命题
  desc: 知识库的关键不是体量「大」而是结构「清晰」，清晰度决定AI能否真正认识你与你的业务。
  excerpt:
  - 知识库不是为大而是为清晰。
- name: 反馈回流进化命题
  desc: 反馈回流是系统进化的关键，缺少回流机制的系统无法随业务迭代而进化。
  excerpt:
  - 反馈回流是系统进化的关键。
findings:
- name: AI超级个体商业成果
  desc: '[evidence] 素材以04年AI超级个体为案例，报告其用五步法搭建12个Agent员工，实现公众号创作、朋友圈营销等全面AI化，达到月入7w的结果；该结论属于素材宣称的个案结果，未提供可复核的量化实验数据。'
  excerpt:
  - 04年AI超级个体用五步法搭建12个Agent员工，实现公众号创作、朋友圈营销等全面AI化，月入7w。
- name: 五步法可落地性
  desc: '[claim] 素材宣称五步法（拆解业务找场景→数据采集搭知识库→Skill固化产出→设计交互搭Agent→反馈回流驱动进化）可完整支撑12个Agent员工的搭建，形成从场景识别到持续进化的闭环流程。'
  excerpt:
  - 五步法：拆解业务找场景→数据采集搭知识库→Skill固化产出→设计交互搭Agent→反馈回流驱动进化。
- name: 知识库结构有效性
  desc: '[claim] 素材宣称知识库四文件夹结构（任务DNA/标准/资产/工作区）是让AI认识你的有效组织方式，并主张知识库的价值取决于清晰度而非规模。'
  excerpt:
  - 知识库四文件夹结构（任务DNA/标准/资产/工作区）。
  - 知识库不是为大而是为清晰。
- name: Skill设计要素有效性
  desc: '[claim] 素材宣称Skill设计三要素（怎么做/用什么/怎样算好）是让AI学会干活的关键，可支撑产出流程的固化。'
  excerpt:
  - Skill设计三要素（怎么做/用什么/怎样算好）。
  - Skill让AI学会干活。
