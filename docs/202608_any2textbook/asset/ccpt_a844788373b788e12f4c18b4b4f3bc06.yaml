paper: 260803《用Codex跑通B站带货视频》
desc: 该素材讲述了非程序员乔久伴利用Codex（AI编程工具）在一个月内跑通B站带货视频全链路的实践，日消耗从几百Token增长到10亿Token并实现出单；素材提出了三大基本认识（保留试错空间、资金换执行力、先建最小可用链路）、人机分工的核心判断（人负责目标/边界/责任/审美，AI负责资料处理/重复生产/自检/修复/交付），以及项目地图、七步沉淀法、从评论区找需求再选品、先接受70分完整结果再迭代、反馈双向记录、数据标注证据边界、错误沉淀成规则等方法论。
concepts:
- name: Token消耗量级跃迁
  desc: 用Codex跑通B站带货视频链路后，日消耗从几百Token增长到10亿Token，反映AI执行规模随链路跑通而指数级放大。
  is_original: true
  excerpt:
  - 日消耗从几百Token到10亿Token，B站带货视频出单
- name: 人机分工边界
  desc: 人负责目标、边界、责任与审美；AI负责资料处理、重复生产、自检、修复与交付。
  is_original: true
  excerpt:
  - 人负责目标、边界、责任与审美；AI负责资料处理、重复生产、自检、修复与交付
- name: 最小可用链路
  desc: 新手应先建立一条能跑通的最小可用链路，而非追求完美后再启动。
  is_original: true
  excerpt:
  - 先建立最小可用链路
- name: 评论区需求优先
  desc: 选品逻辑应先从评论区找需求，而非先看销量数据。
  is_original: true
  excerpt:
  - 先从评论区找需求再选品（而非先看销量）
- name: 70分完整结果
  desc: 先接受70分的完整结果，再在此基础上迭代标准，而非一开始就追求高分。
  is_original: true
  excerpt:
  - 先接受70分完整结果再迭代标准
- name: 证据边界标注
  desc: 数据必须标注证据边界，区分事实与推断，避免过度解读。
  is_original: true
  excerpt:
  - 数据必须标注证据边界
- name: 错误沉淀成规则
  desc: 把执行过程中的错误沉淀为可复用的规则，避免重复犯错。
  is_original: true
  excerpt:
  - 把错误沉淀成规则
methods:
- name: __overview__
  desc: 素材整体方法论：以Codex为执行引擎，跑通从评论区需求采集、选品、素材整理、参数核验、PPT、口播、配音到剪辑交付的完整B站带货视频链路，并在此过程中沉淀项目地图、七步沉淀法、反馈记录、证据边界标注和错误规则化等实践。
  excerpt:
  - 用AI跑通从评论区需求采集、选品、素材整理、参数核验、PPT、口播、配音到剪辑交付的完整B站带货视频链路
- name: 项目地图
  desc: 将整个带货视频项目拆解为可导航的模块地图，明确各环节输入输出与依赖关系。
  excerpt:
  - 方法论：项目地图、七步沉淀法
- name: 七步沉淀法
  desc: 将项目执行过程沉淀为七个可复用步骤的方法，用于系统化积累经验与规则。
  excerpt:
  - 七步沉淀法
- name: 评论区需求采集法
  desc: 从B站评论区采集用户真实需求，以此作为选品和内容生产的起点。
  excerpt:
  - 先从评论区找需求再选品（而非先看销量）
- name: 70分迭代法
  desc: 先接受70分的完整交付结果，再基于实际反馈迭代标准，逐步提升质量。
  excerpt:
  - 先接受70分完整结果再迭代标准
- name: 双向反馈记录法
  desc: 反馈不仅要记录好的方面，也要记录不好的方面，形成完整反馈闭环。
  excerpt:
  - 反馈要记录好的和不好的
- name: 证据边界标注法
  desc: 对数据结论必须标注证据边界，明确哪些是数据支撑的、哪些是推测。
  excerpt:
  - 数据必须标注证据边界
- name: 错误规则化法
  desc: 把执行中犯过的错误转化为明确规则，纳入后续流程以避免重复。
  excerpt:
  - 把错误沉淀成规则
theorems:
- name: 新手先保证试错空间
  desc: 新手做AI项目应首先保证有足够的试错空间，而非一开始就追求高效率或高产出。
  excerpt:
  - 新手先保证试错空间
- name: 资金应换成执行力
  desc: 资金投入应转化为执行力提升，而非单纯购买工具或资源。
  excerpt:
  - 资金应换成执行力
- name: 先建立最小可用链路
  desc: 应先建立一条能跑通的最小可用链路，再逐步扩展和优化。
  excerpt:
  - 先建立最小可用链路
- name: 人机分工原则
  desc: 人负责目标、边界、责任与审美；AI负责资料处理、重复生产、自检、修复与交付。
  excerpt:
  - 人负责目标、边界、责任与审美；AI负责资料处理、重复生产、自检、修复与交付
- name: 需求优先于销量
  desc: 选品应优先从评论区找需求，而非先看销量数据。
  excerpt:
  - 先从评论区找需求再选品（而非先看销量）
- name: 先完整后完美
  desc: 先接受70分的完整结果，再迭代标准，而非一开始就追求完美。
  excerpt:
  - 先接受70分完整结果再迭代标准
- name: 反馈双向记录
  desc: 反馈必须同时记录好的和不好的，才能形成有效改进依据。
  excerpt:
  - 反馈要记录好的和不好的
- name: 数据需标注证据边界
  desc: 数据结论必须标注证据边界，区分事实与推断。
  excerpt:
  - 数据必须标注证据边界
- name: 错误应沉淀为规则
  desc: 执行中的错误应被沉淀为规则，纳入流程以避免重复。
  excerpt:
  - 把错误沉淀成规则
findings:
- name: AI跑通带货视频全链路
  desc: '[evidence] 非程序员乔久伴用Codex跑通了从评论区需求采集、选品、素材整理、参数核验、PPT、口播、配音到剪辑交付的完整B站带货视频链路，并实现出单。'
  excerpt:
  - 非程序员乔久伴用AI跑通从评论区需求采集、选品、素材整理、参数核验、PPT、口播、配音到剪辑交付的完整B站带货视频链路
- name: Token消耗从几百到10亿
  desc: '[evidence] 使用Codex一个月后，日消耗从几百Token增长到10亿Token，表明AI执行规模随链路跑通而大幅提升。'
  excerpt:
  - 日消耗从几百Token到10亿Token，B站带货视频出单
- name: B站带货视频出单
  desc: '[claim] 素材宣称通过上述AI链路实现了B站带货视频出单，但未提供具体销量或转化数据细节。'
  excerpt:
  - B站带货视频出单
