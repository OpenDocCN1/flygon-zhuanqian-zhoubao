paper: 260804《健身教练用AI做小程序给门店带来1w+》
desc: 该素材讲述了一位潜水5年的健身教练，利用AI编程工具WorkBuddy在3-4天内做出了一款热量计算小程序，解决了健身教练日常反复回复会员饮食问题的痛点，并间接为门店带来1w+收入。素材的核心判断是：高频重复的工作行为和问题背后藏着需要辨明的需求，找到它就找到方向；AI做工具的核心不是代码能力，而是把需求想清楚、讲明白的能力；小程序的1w+并非直接收入，而是通过节省时间、提升谈单转化率和促进转介绍间接实现的。
concepts:
- name: 高频重复痛点即需求信号
  desc: 该概念指日常工作里反复出现的行为和问题，往往暗示着尚未被满足的真实需求，识别它就能找到做工具的方向。
  is_original: true
  excerpt:
  - 高频重复的工作行为和问题背后藏着需要辨明的需求——找到它就找到方向
- name: AI做工具的核心能力是需求表达而非代码
  desc: 该概念主张用AI做工具的关键不在于编程能力，而在于能否把需求想清楚、讲明白。
  is_original: true
  excerpt:
  - AI做工具的核心不是代码能力，而是把需求想清楚、讲明白的能力
- name: 间接收入
  desc: 该概念指小程序带来的1w+并非直接销售收入，而是通过节省时间、提升谈单转化率和促进转介绍等方式间接实现的收益。
  is_original: true
  excerpt:
  - 小程序的1w+不是直接收入，而是通过节省时间、提升谈单转化率和促进转介绍间接实现的
methods:
- name: __overview__
  desc: 该素材的整体方法论是：从健身教练高频重复回复会员饮食问题这一痛点出发，借助AI编程工具WorkBuddy，在3-4天内快速做出热量计算小程序，从而替代重复劳动并间接创造收益。
  excerpt:
  - 健身教练用AI编程工具WorkBuddy在3-4天做出热量计算小程序，解决健身教练日常反复回复会员饮食问题的痛点，间接为门店带来1w+收入
- name: 用AI编程工具快速构建小程序
  desc: 该方法指使用WorkBuddy这一AI编程工具，在3-4天内完成热量计算小程序的开发，以低代码能力快速将需求落地为工具。
  excerpt:
  - 用AI编程工具WorkBuddy在3-4天做出热量计算小程序
