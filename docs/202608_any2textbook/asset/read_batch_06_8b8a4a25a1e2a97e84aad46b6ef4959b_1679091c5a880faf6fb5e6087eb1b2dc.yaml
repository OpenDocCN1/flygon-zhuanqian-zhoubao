- file_path: 文章/260820副业SC精华《今年418加入生财的新人，我用-AI-做了个小程序，六天跑通并成功变现了》.md
  title: 今年“418”加入生财的新人，我用 AI 做了个小程序，六天跑通并成功变现了
  summary: 一名小学老师用 AI 编程工具从零做了一个课程表壁纸小程序，上线第4天获得500+用户、第6天开通流量主赚到第一元钱，完整复盘了从发现需求到产品上线再到变现的全过程。
  core_question: 一个完全不会写代码的新人，如何借助 AI 从真实需求出发做出一个小程序并跑通变现链路？
  key_judgment: 第一版只解决一个最核心的问题，不做拍照识别等功能，先上线让真实用户验证需求；小程序不是独立赚钱工具，而是已有产品的配套服务和引流入口。
  depth: medium
  suggested_destination: case
  possible_shape: book
  risks:
  - 口语化
  - 时效性
  - 格式预处理
  screening_conclusion: retain
  reason: 这是典型的“新人用 AI 下场拿到结果”的真实案例，虽金额小但链路完整（需求发现→产品开发→推广上线→变现），叙事有代入感，对观望中的读者有激励价值。但更偏个人经历分享而非方法论沉淀，适合作为书中案例素材而非核心章节。
- file_path: 文章/260820副业SC精华《从一天做出-Demo，到公司正式上线：一个零代码小白的-AI-开发实录》.md
  title: 从一天做出 Demo，到公司正式上线：一个零代码小白的 AI 开发实录
  summary: 一个深耕电商的非技术人员用 Codex + Claude 花一个多月做出一套公司40多人实际使用的业务系统（档期管理+CRM+AI销售分析），并附带了4份可直接复用的提示词模板和上线检查清单。
  core_question: 一个懂业务但不懂代码的人，如何用 AI 从零搭建一套公司敢用的正式业务系统？
  key_judgment: Demo 证明的是“能不能做出来”，正式系统解决的是“公司敢不敢用”；真正让系统成熟的不是 AI，而是公司里的真实用户反馈；先跑通最小闭环，再逐步扩展，不要一开始就想把所有功能做完。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 格式预处理
  screening_conclusion: retain
  reason: 本文不仅有完整的实战叙事，还提炼了可复用的方法论（7步流程、Claude规划+Codex执行的分工模式、三次确认机制）和4份高质量提示词模板，兼具故事性和工具性，是书中核心章节的优质素材。
- file_path: 文章/260821副业SC精华《Workbuddy-0基础系统教程》.md
  title: WorkBuddy 0 基础系统教程
  summary: 一份 WorkBuddy 的零基础系统教程，通过与 Codex 对比介绍了 WorkBuddy 的上手难度、价格和模型优势，并用发票整理、数据分析等实操案例讲解了基础用法、专家/技能/连接器和自动化任务四大核心功能。
  core_question: 普通人如何系统掌握 WorkBuddy 这款国内 Agent 产品的核心功能和基本操作？
  key_judgment: WorkBuddy 比 Codex 更适合国内普通人入门——无网络门槛、有免费额度、自带国产模型、上手就能用；专家模式、Skill
    封装和连接器是它区别于普通聊天工具的关键能力。
  depth: medium
  suggested_destination: course_unit
  possible_shape: course
  risks:
  - 时效性
  - 口语化
  - 格式预处理
  screening_conclusion: retain
  reason: 这是一份结构清晰、案例驱动的工具教程，对零基础用户友好。但内容高度依赖 WorkBuddy 这个具体产品的当前版本功能，时效性风险较高，更适合作为课程单元或知识库条目使用，而非书籍正文核心章节。
- file_path: 文章/260821副业SC精华《万字拆解：我是如何帮做AI图片工具的圈友用谷歌广告做到月增500+付费订阅用户》.md
  title: 万字拆解：我是如何帮做AI图片工具的圈友用谷歌广告做到月增500+付费订阅用户
  summary: 一位谷歌广告投手详细拆解了如何帮一个AI图片生成工具从每月80个付费订阅用户提升到500+，涵盖SaaS算账方法、转化追踪设置、关键词策略、落地页优化、广告结构设计、Pmax扩量等完整投放体系。
  core_question: 如何用谷歌广告帮一个出海AI工具实现付费订阅用户的规模化增长，同时把获客成本控制在合理范围内？
  key_judgment: SaaS广告投放的核心不是电商ROAS思维，而是LTV思维——先算清用户终身价值和安全边际，再决定投放策略；搜索广告负责“守”精准词，Pmax负责“攻”增量，6:4配合；广告数据能反哺产品迭代，发现用户真实需求。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 格式预处理
  screening_conclusion: retain
  reason: 这是目前素材中方法论密度最高、专业深度最强的一篇。不仅讲了“怎么做”，还讲了“为什么这么做”，从电商思维到SaaS思维的认知转变、五步算账法、转化追踪双层目标、关键词意图分类等都是可迁移的硬知识，适合作为书中出海/SaaS投放方向的核心章节。
- file_path: 文章/260824副业SC精华《【从0起步2个月赚超20万】如何入局FDE，以及FDE的未来》.md
  title: 【从0起步2个月赚超20万】：如何入局 FDE，以及 FDE 的未来
  summary: 一位前字节/美团工程师辞职创业做 FDE（Forward Deployed Engineer），两个月收入超20万，分享了FDE行业的入局方式（自媒体、闲鱼小单、线下连接、G端合作）、订单筛选原则（5-20万甜点区）和对FDE五种未来方向的分析。
  core_question: FDE 是什么、新人如何入局、这个行业的天花板在哪里？
  key_judgment: FDE 最好的订单区间是5-20万元，超过20万的项目容易陷入企业AI转型泥潭，尾款收不回的概率超过60%；FDE 本质是卖时间没有杠杆，做起来的人都在找下一步出路（卖课、垂直深耕、平台、产品化、总包分包）。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 口语化
  screening_conclusion: retain
  reason: FDE 是一个新兴且高价值的方向，本文提供了行业全景视角和稀缺的一线经验（订单筛选标准、不同城市入局难度差异、五种未来方向分析），对读者理解AI企业服务赛道有重要参考价值。但个人经历部分较多，需要编辑精简，适合作为书籍中的一个独立主题章节。
- file_path: 文章/260824副业SC精华《微信小程序：从-0-到-1-做产品》.md
  title: 微信小程序：从 0 到 1 做产品
  summary: 一份超详细的微信小程序开发全流程教程，涵盖课前调研（选题、类目、资质）、AI工具开发（UI设计、前后端Prompt）、服务器购买与环境搭建（腾讯云+宝塔）、后端开发（Laravel+MySQL）、微信支付接入、Gitee代码管理、部署上线、推广渠道和商单报价参考。
  core_question: 一个零基础的小白如何借助AI工具和标准流程，从零完成一个微信小程序的开发、上线和推广？
  key_judgment: 小程序是普通人做产品的最佳起点——开发成本低、审核快、微信生态自带流量；核心方法是“不看代码，全部交给 AI”，但你必须要知道怎么跟
    AI 说话、怎么确认 AI 做对了。
  depth: high
  suggested_destination: handbook_entry
  possible_shape: handbook
  risks:
  - 时效性
  - 格式预处理
  - 重复
  screening_conclusion: retain
  reason: 这是一份操作手册级别的长文，覆盖从选题到上线到推广到报价的完整链路，实操指导性极强，附带大量可直接复制的Prompt模板。但篇幅极长且技术细节随版本变化快，更适合作为手册/工具书形态使用，而非书籍正文。
