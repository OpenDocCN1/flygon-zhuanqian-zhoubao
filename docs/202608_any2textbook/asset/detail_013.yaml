learning_targets:
- 理解红海机会论的核心观点与适用前提，破除“蓝海必优”的思维惯性
- 掌握虚拟产品的二元构成（基础需求满足+体验创新），能对产品进行结构化拆解
- 理解着力点的定义与作用机制，能分析产品卖不动的原因并找到着力点
- 掌握河流型生意与暴雨型生意的区别，能判断生意的可持续性
- 理解AI改造旧需求而非凭空创造新需求的逻辑，能定位AI应用场景
- 掌握“AI执行+人选方向”的分工原则，能设计人机协同的工作流
