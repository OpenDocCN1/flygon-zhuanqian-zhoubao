  key_judgment: 选品是虚拟资料生意的重中之重，但比给一个具体品类更值钱的是教一套可复制的选品方法——'品就像自己的孩子，只有自己一手养大才会真正上心'。整个闭环是：淘宝MCP采集选品→人工审核→销量监控判断优先级→笔记采集仿写→快速测试→决定是否放大。
  depth: high
  suggested_destination: case
