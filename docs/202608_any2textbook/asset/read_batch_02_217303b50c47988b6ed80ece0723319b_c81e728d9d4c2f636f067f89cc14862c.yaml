- file_path: C:/Users/Administrator/shengcai-zhoubao-202608/260804副业SC精华《【AI网站出海】新手找词指南：从0到1，找到能赚钱的关键词》.md
  title: 【AI网站出海】新手找词指南：从0到1，找到能赚钱的关键词
  summary: 一套面向AI网站出海新手的系统化关键词调研SOP，从基础概念讲到四层漏斗筛选法（发现站—粗筛—深挖—判决），核心是用交叉验证判断一个站是'真SEO词矿'还是'投流站'。
