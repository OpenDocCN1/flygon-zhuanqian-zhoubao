  reason: 选品思路（淘宝MCP→选品库→监控→仿写→测试→放大）具有方法论价值，'选品库是底层资产'和'小红书人群以女性为主'等判断有实操指导意义。运营流程部分可拆为手册条目，完整案例可作为书中虚拟资料项目的案例章节。
- file_path: C:/Users/Administrator/shengcai-zhoubao-202608/260804副业SC精华《潜水5年的健身教练，如何靠AI做了个小程序给门店带来了1w+收入》.md
  title: 潜水5年的健身教练，如何靠AI做了个小程序给门店带来了1w+收入
  summary: 一位健身教练用AI编程工具（WorkBuddy）在3-4天内做出一个热量计算小程序，解决了日常工作中反复回复会员饮食问题的痛点，间接为门店带来1w+收入，并完整记录了从需求文档到上线迭代的全过程。
  core_question: 一个没有技术背景的线下实体从业者，如何用AI把工作中的重复性问题做成工具，提升效率并创造额外价值？
  key_judgment: 高频重复的工作行为和问题背后藏着需要辨明的需求——找到它，就找到了方向。AI做工具的核心不是代码能力，而是把需求想清楚、讲明白的能力。小程序的1w+不是直接收入，而是通过节省时间、提升谈单转化率和促进转介绍间接实现的。
