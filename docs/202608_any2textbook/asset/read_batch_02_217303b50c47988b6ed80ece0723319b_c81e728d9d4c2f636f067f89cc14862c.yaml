- file_path: C:/Users/Administrator/shengcai-zhoubao-202608/260805副业SC精华《心力即-Token：我把创业者的迷茫做成了一个开源-AI-心力教练-Skill，从个人痛点到开源github的完整复盘》.md
  title: 心力即Token：我把创业者的迷茫做成了一个开源AI心力教练Skill，从个人痛点到开源github的完整复盘
  summary: 作者（七天）基于自身高敏感、多方向创业者的心路历程，结合life coach专业训练，用一周时间做出一个'AI心力教练'Skill并开源到GitHub，帮助创业者从'我很乱说不清'走到'我知道卡在哪、下一步做什么'，并复盘了从个人痛点到公共工具的完整产品化路径。
  core_question: 创业者面对方向选择、自我怀疑、机会过载、能量透支等心力问题时，如何用AI搭建一个结构化的外部支点，帮助自己从混乱走到清晰？以及一个人如何从自己的真实需求出发，长出一个可交付的Skill产品？
  key_judgment: '''心力即Token''——人的心力是有限的认知能量，和AI的Token与上下文窗口一样需要被管理。普通AI快速给建议，但创业者需要的不是更多建议，而是先被听见、被整理、被澄清。不同的卡点需要进入不同的处理模式（能量透支/机会过载/自我怀疑/需求验证），统一给建议是错的。'
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性（Skill本身在迭代中）
  - 主观性较强（案例和感受偏个人化）
  - 篇幅和结构需大幅编辑
  - 格式预处理（需清理推广内容）
  screening_conclusion: retain
  reason: '''心力即Token''这一概念具有原创性和传播力，''从个人痛点→可视化→垃圾版本→迭代→公共工具''的产品化路径具有复制价值。AI心力教练Skill的设计逻辑（测评→模式路由→结构化聆听→最小行动）可拆为课程单元，产品化复盘部分可成书。需注意客观性，避免过于个人化的情感表达。'
- file_path: C:/Users/Administrator/shengcai-zhoubao-202608/260805副业SC精华《敢脱离电脑的老板，才是好老板》.md
  title: 敢脱离电脑的老板，才是好老板
  summary: 一篇短篇实操建议，主张'AI员工的老板'应该脱离电脑、用手机远程控制AI干活，推荐UU远程+微信输入法+海外硬件的组合方案，并给出Token
