  key_judgment: 流量高但关键词总数少的站是投流站，不值得抄；流量÷词数这个比值是判断一个站是否为真SEO词矿的最有力一刀。找词的本质不是打开工具搜一下，而是用四层漏斗把最贵的工具留到最后，大部分候选站在免费工具阶段就该被淘汰。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
