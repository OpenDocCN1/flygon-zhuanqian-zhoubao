- file_path: C:/Users/Administrator/shengcai-zhoubao-202608/260805副业SC精华《花12万找FDE踩坑失败经验，用AI自研系统，分享真实甲方的需求变现路径——完整复盘（万字长文）》.md
  title: 花12万找FDE踩坑失败经验，用AI自研系统，分享真实甲方的需求变现路径——完整复盘
  summary: 一位29人家具建材公司老板，花12万外包定制ERP失败后，零技术基础用AI（Codex+Claude）在一个月内自研出包含客资导入、SOP追踪、绩效数据化、项目节点化、实时利润五大模块的ERP系统，并把AI装进系统让'事找人'，每月AI订阅成本仅2000多元。
  core_question: 一个不懂技术的传统行业老板，如何在被外包坑了12万之后，用AI自研出合身的业务系统？以及'懂业务的人自己长出工程能力'这条反向FDE路径是否可复制？
  key_judgment: 让懂业务的人学会用AI，比让AI工程师学会一个行业快得多——业务理解才是护城河，技术是那个可以被AI补上的一半。定制系统真正的价值不是功能比SaaS多，而是你的管理思想能变成代码强制执行。成熟的工作流比聪明的模型更重要，工作流不吃技术天赋，吃的是纪律。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 篇幅极长（万字长文需拆分为多个子章节）
  - 时效性（AI工具和模型迭代快）
  - 个人案例（单一公司经验需标注适用边界）
  - 格式预处理（大量图片和推广尾巴）
  screening_conclusion: retain
  reason: 全文价值极高：'反向FDE'概念具有原创性，12万踩坑复盘有警示价值，自研工作流方法论（六条军规+需求描述六格模板）可直接复用，'把AI装进系统让事找人'的管理理念有前瞻性。适合作为书中的核心章节，可按'踩坑→觉悟→工具线→工作流→模块→AI管理→推行心法→FDE建议'拆为多节。
