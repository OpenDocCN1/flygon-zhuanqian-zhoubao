learning_targets:
- 理解纠偏沉淀验证循环为何是AI Agent系统稳定产出的核心机制
- 掌握三端分工模型（收集/加工/交付）的设计原则与衔接方式
- 学会用最小闭环方法快速验证流程可行性，避免过度设计
- 理解生产与质检分离的必要性及客观验收标准的设定方法
- 能识别并规避内容流转系统中的六类典型失败模式
concept_map:
- 进化篇：让系统自己长大
- ├── 验证驱动迭代
- │   ├── 纠偏沉淀验证循环      —— 核心机制
- │   │   ├── 真实执行：按当前配置跑真实任务
- │   │   ├── 人工纠偏：修正动作即训练信号
- │   │   ├── 规则沉淀：规律固化为规则/提示词
- │   │   └── 重新验证：确认修正有效且无新问题
- │   ├── 渐进收敛性            —— 关键性质
- │   ├── 纠偏信号可迁移性      —— 关键性质
- │   └── 闭环完整性             —— 关键性质
- ├── 从六个坑中学到的教训
- │   ├── 六个坑（路障清单）    —— P002, P003
- │   │   ├── 收集端素材堆积不加工
- │   │   ├── 加工端产出不去目标端验证
- │   │   └── 流程未手动跑通就上自动化
- │   ├── 经验浓缩性            —— 关键性质
- │   ├── 可预防性              —— 关键性质
- │   └── 情境依赖性            —— 关键性质
- ├── Skill后置与系统渐进
- │   ├── 最小闭环              —— P003, P002
- │   │   ├── 结构克制性：目录≤5个
- │   │   ├── 流程完整性：输入-处理-输出闭环
- │   │   ├── 渐进扩展性：保留演进接口
- │   │   └── 快速反馈性：周期短、迭代快
- │   └── 手动先行方法           —— P002
- └── 反馈回流驱动的系统进化
- '    ├── 生产与质检分离         —— P001, P002'
- '    │   ├── 角色独立性：质检者非生产者上下游'
- '    │   ├── 验收标准客观性：锚定目标端场景'
- '    │   ├── 闭环联动性：问题反馈回生产'
- '    │   └── 代价可控性：抽样/自动化控制成本'
- '    └── 目标端回读验收         —— P002'
- '        ├── 三端分工模型       —— P002'
- '        │   ├── 收集端（IMA）：低摩擦、广覆盖'
- '        │   ├── 加工端（Obsidian）：结构化、可检索'
- '        │   └── 交付端（飞书）：协作友好、可触达'
- '        ├── 职责单一性         —— 关键性质'
- '        ├── 端间接口清晰       —— 关键性质'
- '        └── 全链路可追溯       —— 关键性质'
life_analogy:
- 想象搭建内容流转系统如同**一位新手厨师学习做菜**：
- '- **纠偏沉淀验证循环** = 先按菜谱做一遍，尝一口发现太咸，记下“少放半勺盐”，下次再做时改进'
- '- **三端分工模型** = 厨房流水线：买菜员（收集）只管把新鲜食材买回来，切菜工（加工）负责洗净切好，服务员（交付）负责端上桌'
- '- **最小闭环** = 第一次先只做一道西红柿炒蛋，完整走完“买菜—洗切—下锅—上桌”全流程，成功后再学做满汉全席'
- '- **生产与质检分离** = 自己做好的菜不能自己说好吃，要让顾客尝一口，按顾客的标准判断是否合格'
- '- **六个坑** = 前辈厨师总结的“新手常犯错误清单”：比如菜买多了放着烂掉、菜做好了不端上桌就自我感觉良好'
- 就像好厨师靠一次次试吃改进菜谱，好的AI系统也靠真实的反馈闭环才能越用越准。
summary:
- concept: 纠偏沉淀验证循环
  desc: 系统通过真实执行、人工纠偏、规则沉淀、重新验证四阶段迭代，实现渐进收敛
- concept: 真实执行
  desc: 先按当前配置跑真实任务，不追求一次完美，让问题暴露出来
- concept: 人工纠偏
  desc: 人对产出中的错误进行修正，修正动作本身即训练信号
- concept: 规则沉淀
  desc: 把纠偏中发现的规律转变成系统规则或提示词约束，固化复用
- concept: 重新验证
  desc: 用沉淀后的规则重跑任务，确认修正有效并检查是否引入新问题
- concept: 三端分工模型
  desc: 将平台划分为收集、加工、交付三端角色，各司其职、互相衔接
- concept: 收集端
  desc: 负责信息进入与初步筛选，特点是低摩擦、广覆盖（如IMA）
- concept: 加工端
  desc: 负责内容整理、关联、深加工，特点是结构化、可检索（如Obsidian）
- concept: 交付端
  desc: 负责加工成果的输出与分发，特点是协作友好、可触达（如飞书）
- concept: 最小闭环
  desc: 以最少配置（目录≤5个）构建可运行的完整流程，用最小代价验证可行性
- concept: 生产与质检分离
  desc: 产出动作与验证动作分配至不同环节，确保验收标准的客观性
- concept: 目标端回读验收
  desc: 验收标准锚定最终使用场景，如到飞书中重新打开读一遍确认可用
- concept: 手动先行
  desc: 先手动跑通一条完整链路，再谈自动化，降低风险
- concept: 六个坑
  desc: 对常见失败模式的模式化总结，用于后续系统的预防性设计
- concept: 渐进收敛性
  desc: 每轮循环都使系统行为向目标靠近，而非一次性到位
- concept: 职责单一性
  desc: 每个平台只承担一个角色，避免同一平台既收集又交付导致数据熵增
- concept: 端间接口清晰
  desc: 相邻两端通过明确的数据格式和传递机制衔接，如以原始素材+标签流转
exercises:
- 'no': 1
  title: 设计一个纠偏沉淀验证循环
  contents:
  - 假设你负责搭建一个「周报自动生成系统」，系统需要从多个数据源提取信息并生成汇报文档。请按以下步骤设计：
  - 1. 描述一轮完整的纠偏沉淀验证循环中，四个阶段（真实执行、人工纠偏、规则沉淀、重新验证）分别会做什么具体动作。
  - 2. 给出至少两条你认为可以通过纠偏沉淀出来的「规则」，并说明它们如何被固化进系统。
  - 3. 思考：如果发现每条周报都需要专家人工修正 20 分钟，而人工撰写只需 15 分钟，循环是否还值得继续？提出至少一种降低纠偏成本的方案。
- 'no': 2
  title: 为一个新场景设计三端分工模型
  contents:
  - 一家跨境电商公司想搭建内容流转系统：客服需要快速获取产品知识库信息，运营需要持续产出营销素材，管理层需要每周看到销售分析报告。现有工具有：飞书、Notion、企微、Excel、Airtable、企业内部CRM系统。
  - 1. 请把给定工具分配到收集端、加工端、交付端三个角色中，并说明分配理由。
  - 2. 确定收集端→加工端、加工端→交付端之间的接口数据格式（至少包含字段名和含义）。
  - 3. 请指出这套三端设计中可能出现的一处角色重叠或职责模糊，并给出改进方案。
  - 4. 思考：如果未来引入AI助手自动完成加工端的部分工作，三端模型中哪一端的边界定义需要调整？
- 'no': 3
  title: 搭建最小闭环并设定验收标准
  contents:
  - 你要从零搭建一个「竞品监测知识库」，需要定期抓取竞品动态并归档分析。团队希望你一周内跑通流程。
  - 1. 请设计一个最小闭环方案：目录结构（不超过5个）、输入来源（用量化指标定义清楚）、处理环节、输出形态、反馈机制。
  - 2. 请为这个最小闭环设定具体的通过标准：即满足什么条件就算“闭环验证成功”。注意验收要基于目标端可观测的结果。
  - 3. 列出你计划在闭环验证成功后下一步扩展的3项配置（新目录、新规则、新自动化），并解释为什么它们是第二优先。
  - 4. 思考：如果第一轮闭环运行一周后准确率只有65%，你如何利用纠偏沉淀验证循环来提升它？请写出后续两轮循环的具体改进计划。
- 'no': 4
  title: 用六个坑清单做预防性审查
  contents:
  - 你的同事搭建了一个「客户反馈自动分拣系统」，由AI读取邮件、分类、生成工单，但上线一个月后问题频发。请对照六个坑的清单（收集端素材堆积、加工端产出不验证、流程未手动跑通就自动化等）逐一审查该系统。
  - 1. 针对每一类坑，判断该系统是否存在类似风险，并给出1-2条证据支持你的判断。
  - 2. 对于你判断「存在风险」的坑，提出一个具体的预防性或补救性设计决策。
  - 3. 现在系统需要引入智能体（Agent）来回应部分简单客户问题。基于「Skill后置」原则，请说明你应该先做什么、后做什么，为什么不能直接全面铺开。
  - 4. 思考：六个坑中哪一类在你看来最难以预防？为什么？你的应对策略是什么？
- 'no': 5
  title: 设计生产与质检分离的验收流程
  contents:
  - 你负责一个「AI辅助的业务文档生成系统」，AI根据数据库记录自动生成客户合同、报价单、会议纪要等文档。请设计生产与质检分离方案：
  - 1. 明确生产环节由谁承担、产出标准是什么（列出3条以上量化指标）。
  - 2. 设计质检环节：质检者角色（不能是谁）、验收标准的设定原则（应为基于目标端场景的标准而非生产端的自设指标）、质检频次与抽检比例。
  - 3. 画出质检发现问题时反馈回生产环节的闭环流程图（用文字描述即可）。
  - 4. 思考：如果某类文档（如创意提案）质量标准本身模糊，质检分离效果会怎样？你如何调整质检策略来适应这类内容？
units:
- 'no': 1
  name: 纠偏沉淀验证循环 —— 让系统在“做错—修正—固化”中长大
  points:
  - '**为什么需要这个概念？**'
  - '- 追求“完美提示词”本身是迷信：复杂的提示词无法预先穷尽所有边界情况，注定要失败'
  - '- 业务流程的真实难点在于系统会犯错，且错误无法一次性预见，需要一个机制持续吸收教训'
  - '- 传统软件开发用需求文档一次性定稿，但 AI Agent 的行为不可穷举，必须依赖反馈闭环才能稳定产出'
  - '**核心定义**'
  - '- 纠偏沉淀验证循环，是指让系统经历真实执行、人工纠偏、规则沉淀、重新验证四个阶段的迭代过程'
  - '- 真实执行：系统先按当前配置跑真实任务，不追求一次完美'
  - '- 人工纠偏：人对产出中的错误进行修正，修正动作本身即训练信号'
  - '- 规则沉淀：把纠偏中发现的规律转变成系统规则或提示词约束，固化并复用'
  - '- 重新验证：用沉淀后的规则再跑一遍任务，确认修正有效并检查是否引入新问题'
  - '**关键性质**'
  - '- 渐进收敛性：每轮循环都使系统行为向目标靠近，而不是一次性到位'
  - '- 纠偏信号的可迁移性：人工纠偏中发现的规律可以被抽象为通用规则，迁移到同类任务'
  - '- 闭环完整性：四个阶段缺一不可，缺失任何一个环节都会导致系统原地打转或退化'
  - '- 规则沉淀的累积性：沉淀的规则会逐渐增多，但要注意避免规则对旧案例有效而对新案例僵化'
  - '**典型例子**'
  - '- 将内容流转业务流程做成 AI Agent 员工：先让 Agent 执行真实的内容流转任务，人工纠正其分类错误，将纠错归纳为“凡是来源为IMA的素材统一先打标签再入库”的规则，再重新验证该规则对后续任务的准确率提升'
  - '**边界条件**'
  - '- 适用于任务场景稳定、错误可被明确定义并修正的场景；若任务本身高度开放、缺乏明确的正确标准，则纠偏信号难以形成有效规则'
  - '- 人工纠偏成本过高时（如每轮都要资深专家介入），循环收敛速度可能慢于直接人工处理，需要考虑批量纠偏或半自动化纠偏机制'
  - '- 规则沉淀过度可能导致系统对新场景适应性下降，需要在沉淀与保持弹性之间取得平衡'
  sources:
  - paper: 260803《AI Agent员工》
    role: origin
  - paper: 260804《用Codex把IMA、Obsidian、飞书串成内容流转系统》
    role: improve
  excerpts:
  - 关键不是写完美提示词，而是让它经历真实执行、人工纠偏、规则沉淀、重新验证的过程。
  - 先手动跑通一条，再谈自动化。
  - 验收标准必须是到目标端重新打开读一遍。
- 'no': 2
  name: 三端分工模型 —— 给内容流转装上收发分离的“流水线”
  points:
  - '**为什么需要这个概念？**'
  - '- 内容流转系统涉及的平台多、角色杂，如果不明确各端职责，容易造成数据混乱、流程中断'
  - '- 单一工具全流程处理既低效又难以维护，需要将收集、加工、交付三个环节的职责分离，形成清晰的流水线'
  - '- 不同平台的优势各异：收集需要快速与便捷，加工需要深度与结构，交付需要协作与分发，按优势分工能最大化整体效能'
  - '**核心定义**'
  - '- 三端分工模型，指将内容流转系统中的各个平台按照承担职能划分为收集端、加工端、交付端三个角色，各端各司其职、互相衔接'
  - '- 收集端负责信息的进入与初步筛选，特点是低摩擦、广覆盖'
  - '- 加工端负责对收集的内容进行整理、关联、深加工，特点是结构化、可检索'
  - '- 交付端负责加工后成果的输出与分发，特点是协作友好、可触达'
  - '**关键性质**'
  - '- 职责单一性：每个平台只承担一个角色，避免同一平台既收集又交付导致的数据熵增'
  - '- 端间接口清晰：相邻两端之间通过明确的数据格式和传递机制衔接，如收集端到加工端以“原始素材+标签”形式流转'
  - '- 全链路可追溯：内容从哪个端进入、在哪一端被加工、流向哪个端交付，均可被追踪与回溯'
  - '- 各端可独立优化：某一端的流程调整不影响其他端，降低系统改造风险'
  - '**典型例子**'
  - '- 将 IMA（收集）、Obsidian（加工）、飞书（交付）组合成一套内容流转系统：IMA 作为收集端汇聚碎片信息和素材，Obsidian 作为加工端将素材整理为知识卡片和结构化笔记，飞书作为交付端输出为团队可协作的文档或任务'
  - '**边界条件****'
  - '- 适用于信息流转链条清晰、各平台能力差异明显的场景；若所有平台功能高度同质化，分工带来的价值会减弱，反而增加切换成本'
  - '- 当内容量超出某一端的处理能力时（如收集端聚集了大量未分拣素材），需要在端内增加子流程，而模型本身不预设端内细分'
  - '- 三端是逻辑角色而非物理绑定：同一平台在不同场景下可以充当不同的端，但同一闭环链路上不应出现角色重叠'
  sources:
  - paper: 260804《用Codex把IMA、Obsidian、飞书串成内容流转系统》
    role: origin
  excerpts:
  - IMA（收集）、Obsidian（加工）、飞书（交付）。
  - 六个坑。
  - 先手动跑通一条，再谈自动化。
- 'no': 3
  name: 最小闭环 —— 用最小目录先“转起来”再“大起来”
  points:
  - '**为什么需要这个概念？**'
  - '- 追求完整系统容易陷入过度设计的陷阱：目录结构几十个、分类体系完美，但内容却迟迟跑不起来'
  - '- 知识库系统的价值不在于结构复杂度，而在于是否能形成“输入—处理—输出”的完整回路，哪怕规模很小'
  - '- 早期阶段系统的试错成本低，应优先验证流程可行性，再逐步扩展规模和细节'
  - '**核心定义**'
  - '- 最小闭环，指以能够支撑业务循环的最少配置构建一套可运行的完整流程，目录结构控制在5个以内，目的是用最小代价验证系统能否真正运转起来'
  - '- 最小：指结构精简到不能再精简，但功能链必须完整'
  - '- 闭环：指从输入到输出之间存在真实的数据流通和反馈回路，而非停留在配置层面'
  - '**关键性质**'
  - '- 结构克制性：刻意限制目录数量与规则复杂度，降低维护成本和选择负担'
  - '- 流程完整性：虽然结构小，但输入、加工、输出、反馈每个环节必须实际可运行、可达'
  - '- 渐进扩展性：最小闭环保留了向完整系统演进的接口，验证成功后可逐步添加新目录和规则'
  - '- 快速反馈性：运行周期短，问题暴露快，改进迭代节奏快'
  - '**典型例子**'
  - '- 用 3 份资料跑通 Obsidian+Codex 个人 AI 知识库：只建立 4~5 个目录（如收件箱、阅读、知识卡、输出、归档），先用少量资料试运行整个入库流程，验证模型能正确分类和归档后再逐步增加资料量'
  - '**边界条件**'
  - '- 适用于从零启动、流程尚未验证的新系统；若已有成熟大规模系统，直接缩小规模反而会引发流程无法承载的断层'
  - '- 最小闭环不等于减少处理深度，如果连基本的加工质量都无法保证，则闭环虽小却不可用'
  - '- 当闭环验证成功后必须及时扩展配置，否则系统容量不足会成为新瓶颈，需要防止停留在小规模舒适区'
  sources:
