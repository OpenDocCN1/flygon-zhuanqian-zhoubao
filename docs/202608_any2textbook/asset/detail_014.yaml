- 'no': 4
  name: 生产与质检分离 —— 让系统“自己干活、自己不骗自己”
  points:
  - '**为什么需要这个概念？**'
  - '- 如果生产与质检由同一环节承担，系统很容易陷入“自我感动式”验收：产出的内容自己检查总觉得没问题，实际上漏洞百出'
  - '- 内容流转链路上，产出质量关系到下游使用的信任度，需要引入独立的检查视角来把关'
  - '- 生产环节追求速度与产出，质检环节追求准确与合规，二者目标不同，混在一起必然互拖后腿'
  - '**核心定义**'
  - '- 生产与质检分离，指在业务流程中将“产出内容”的动作与“验证质量”的动作分配至不同的环节或角色，确保产出与检验互不干扰、各有标准'
  - '- 生产环节：专注执行加工流程，按既定规则生成产出'
  - '- 质检环节：以目标端标准重新审视产出，发现问题后送回生产环节修正'
  - '**关键性质**'
  - '- 角色独立性：质检者不应是生产者的直接上游或下游，避免利益关联导致漏检'
  - '- 验收标准的客观性：质检标准应锚定最终使用场景（如目标端能否正常打开、阅读、使用），而非生产端的自设指标'
  - '- 闭环联动性：质检发现的问题必须能反馈进入生产环节，否则分离就成了脱节'
  - '- 代价可控性：质检抽取比例、频次与环节深度应控制成本，避免质检环节拖慢整个流程效率'
  - '**典型例子**'
  - '- 在内容流转系统中，生产环节由 Codex 自动生成内容卡片，质检环节则要求“到目标端重新打开读一遍”，确认在飞书中能正常阅读、格式正确、链接有效，而不是在
    Obsidian 里看看就通过'
  - '**边界条件**'
  - '- 适用于产出结果可被客观判定的场景；若质量标准本身模糊（如创意性、审美类内容），质检分离的效果会大幅下降'
  - '- 质检成本过高的场景（如人工逐条审查全部产出）可能导致整体成本高于收益，需结合抽样质检或自动化质检'
  - '- 生产与质检之间的反馈回路必须快速闭环，否则分离只会造成延误而非提升质量'
  sources:
  - paper: 260803《AI Agent员工》
    role: origin
  - paper: 260804《用Codex把IMA、Obsidian、飞书串成内容流转系统》
    role: improve
  excerpts:
  - 生产与质检必须分开。
  - 验收标准必须是到目标端重新打开读一遍。
- 'no': 5
  name: 六个坑 —— 进化路上的“路障清单”
  points:
  - '**为什么需要这个概念？**'
  - '- 系统建设过程中失败的模式往往是重复的，同一类坑会在不同项目中反复踩，缺乏总结就缺乏免疫力'
  - '- 进化不是靠一次成功就能达成，而是对“在哪里跌倒”的深刻复盘，六个坑是对常见失败模式的简约提炼'
  - '- 记录坑本身是一种低成本高回报的知识资产：把失败教训前置到操作手册中，可以避免团队重复试错'
  - '**核心定义**'
  - '- 六个坑，指在搭建内容流转系统过程中被反复验证的六类典型失败模式，以清单形式被沉淀，用于后续系统的预防性设计'
  - '- 其本质是对进化过程中失败经验的模式化总结：不是事后懊悔，而是将失败点提炼为可以复用的规避清单'
  - '**关键性质**'
  - '- 经验浓缩性：将大量失败个案压缩为六类可识别模式，降低记忆和传播成本'
  - '- 可预防性：清单中的每一条都对应一种可提前采取的设计决策或检查动作'
  - '- 情境依赖性：六条坑在特定技术栈和流程中成立，换环境时需要重新验证'
  - '- 非穷举性：六条是高频失败样本，并非全部失败可能，仍需持续积累'
  - '**典型例子**'
  - '- 六类坑中包含“在收集端堆积大量素材迟迟不加工”“加工端产出的内容不去目标端验证”“流程尚未手动跑通就急上自动化”等场景；在后续搭建新知识库时，对照清单逐一排查即可提前避开'
  - '**边界条件**'
  - '- 六个坑是特定项目经验的产物，其优先级和具体表现受团队工具链和流程形态影响，不能直接照搬应用于完全不同的场景'
  - '- 清单的作用是提示而非替代分析，必须结合实际项目重新审视每一条的具体表现'
  - '- 当任务类型发生根本性变化（如从内容流转转向交易处理）时，清单的参考价值大幅下降'
  sources:
  - paper: 260804《用Codex把IMA、Obsidian、飞书串成内容流转系统》
    role: origin
  excerpts:
  - 六个坑。
  - 先手动跑通一条，再谈自动化。
  - 验收标准必须是到目标端重新打开读一遍。
