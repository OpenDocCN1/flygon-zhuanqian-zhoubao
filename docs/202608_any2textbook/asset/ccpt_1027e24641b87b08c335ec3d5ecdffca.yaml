paper: 260821《谷歌广告帮AI工具月增500+订阅》
desc: 该素材讲述一位谷歌广告投手如何帮助一款AI图片生成工具将月付费订阅量从80个提升至500+的实操经验，核心主张是SaaS广告投放应摒弃电商ROAS思维而采用LTV思维，并提出搜索广告与Pmax按6:4配合的攻守策略，以及广告数据反哺产品迭代的闭环逻辑，同时给出五步算账法、转化追踪双层目标、关键词意图分类、落地页优化、广告结构设计和Pmax扩量等一整套方法论。
concepts:
- name: LTV思维（用户终身价值思维）
  desc: SaaS广告投放的核心判断依据应是用户终身价值与安全边际，而非单次转化的ROAS。
  is_original: false
  excerpt:
  - 核心判断：SaaS广告投放核心不是电商ROAS思维，而是LTV思维——先算清用户终身价值和安全边际，再决定投放策略
- name: 攻守配合策略（搜索广告守精准词 + Pmax攻增量）
  desc: 搜索广告负责守住精准关键词的转化基本盘，Pmax负责开拓增量流量，两者按6:4比例配合。
  is_original: true
  excerpt:
  - 搜索广告负责"守"精准词、Pmax负责"攻"增量，6:4配合
- name: 广告数据反哺产品迭代
  desc: 广告投放中积累的关键词、转化与用户行为数据可以反向指导AI产品本身的迭代方向。
  is_original: true
  excerpt:
  - 广告数据能反哺产品迭代
methods:
- name: __overview__
  desc: 整体方法论由五步算账法、转化追踪双层目标、关键词意图分类、落地页优化、广告结构设计和Pmax扩量六个环节组成，覆盖从预算测算到规模放量的完整投放链路。
  excerpt:
  - 方法论：五步算账法、转化追踪双层目标、关键词意图分类、落地页优化、广告结构设计、Pmax扩量。
- name: 五步算账法
  desc: 通过五个步骤先算清用户终身价值与安全边际，再据此决定投放预算与出价策略。
  excerpt:
  - 五步算账法
- name: 转化追踪双层目标
  desc: 在转化追踪中设置两层目标，用于区分不同深度的用户行为并指导出价优化。
  excerpt:
  - 转化追踪双层目标
- name: 关键词意图分类
  desc: 按用户搜索意图对关键词进行分类，以便匹配不同的广告结构与出价策略。
  excerpt:
  - 关键词意图分类
- name: 落地页优化
  desc: 针对AI图片生成工具的目标用户优化落地页，以提升转化率。
  excerpt:
  - 落地页优化
- name: 广告结构设计
  desc: 设计搜索广告与Pmax广告的结构与配比，实现精准词防守与增量进攻的分工。
  excerpt:
  - 广告结构设计
- name: Pmax扩量
  desc: 利用Performance Max广告系列进行增量扩量，承担攻取新流量的角色。
  excerpt:
  - Pmax扩量
theorems:
- name: SaaS投放应基于LTV而非ROAS
  desc: SaaS广告投放的核心决策逻辑是先算清用户终身价值与安全边际，再决定投放策略，而非套用电商的ROAS思维。
  excerpt:
  - 核心判断：SaaS广告投放核心不是电商ROAS思维，而是LTV思维——先算清用户终身价值和安全边际，再决定投放策略
- name: 搜索与Pmax的攻守6:4配合
  desc: 搜索广告负责守住精准关键词的基本盘，Pmax负责攻取增量流量，两者按6:4的比例配合投放。
  excerpt:
  - 搜索广告负责"守"精准词、Pmax负责"攻"增量，6:4配合
- name: 广告数据反哺产品迭代
  desc: 广告投放产生的数据不仅能优化投放本身，还能反向输入到产品迭代决策中。
  excerpt:
  - 广告数据能反哺产品迭代
findings:
- name: AI图片工具月付费订阅从80提升至500+
  desc: '[claim] 素材宣称通过上述LTV思维与攻守配合方法论，帮助AI图片生成工具将月付费订阅量从80个提升到500+。'
  excerpt:
  - 谷歌广告投手帮AI图片生成工具从每月80个付费订阅提升到500+。
