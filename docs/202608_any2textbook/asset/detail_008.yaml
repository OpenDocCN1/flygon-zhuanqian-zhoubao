learning_targets:
- 理解 AI 能力从知识库到 Skill 再到 Agent 的三层递进关系
- 掌握各层级的核心定义与功能定位，能清晰区分认知、能力与行动
- 理解三层之间的依赖关系与递进逻辑，能判断实际应用的所属层级
- 能够运用三层框架分析真实 AI 应用场景并规划提升路径
concept_map:
- AI 能力框架
- ├── 核心命题：三层递进构建 AI 能力演化路径
- │   ├── 知识库（KB） —— AI 认识你
- │   │   ├── 定位：掌握背景、偏好、行业数据等私有信息
- │   │   ├── 作用：让 AI 用你的术语和语境交互
- │   │   └── 边界：仅解决认知问题，不保证能干活
- │   ├── Skill（技能） —— AI 学会干活
- │   │   ├── 定位：封装特定任务的可复用能力
- │   │   ├── 作用：将固定流程标准化，实现单点任务的稳定产出
- │   │   └── 边界：只解决单点任务，不负责跨步骤规划
- │   └── Agent（智能体） —— AI 成为员工
- │       ├── 定位：自主规划与执行完整任务
- │       ├── 作用：调度编排多个 Skill，实现端到端闭环
- │       └── 边界：依赖前两层，缺少任一基础则易“跑偏”或“乏力”
- ├── 关键性质
- │   ├── 递进性 —— 知识库是起点，Agent 是终点，不可跳跃
- │   ├── 可组合性 —— 多个 Skill 可被同一 Agent 调度编排
- │   └── 能力外延性 —— 知识库供“背景”，Skill 供“技能”，Agent 供“主动性”
- └── 实例剖析：小红书内容营销的 AI 化
- ├── 知识库：投喂行业报告与个人笔记，AI 懂得品牌术语
- ├── Skill：定义“小红书文案生成”固定流程，AI 按流程产出
- └── Agent：AI 生成文案后自动排期发布、追踪数据、回复评论，全程无人干预
life_analogy:
- 想象 AI 能力的演化为**新员工入职培训**：
- '- **知识库（KB）** = 新员工的入职手册与公司资料库，里面装着公司文化、业务背景和行业知识'
- '- **Skill（技能）** = 岗位培训中掌握的标准化操作流程（SOP），例如如何填写报销单、如何处理客户投诉'
- '- **Agent（智能体）** = 员工熟悉环境且掌握流程后，被授权独立负责完整项目，自主排期、执行、复盘'
- 就像新员工先“认识公司”、再“学会操作”、最终“独立负责项目”，AI 也必须经历知识库 → Skill → Agent 的三层跃迁才能从“认识你”变成“为你打工”。
summary:
- concept: AI 三层递进
  desc: 从知识库（认知）→ Skill（能力）→ Agent（行动）的递进式 AI 能力框架
- concept: 知识库（KB）
  desc: 让 AI 认识你，掌握背景、偏好与私有数据，解决认知问题
- concept: Skill（技能）
  desc: 让 AI 学会干活，封装特定任务的可复用标准化流程
- concept: Agent（智能体）
  desc: 让 AI 成为员工，自主规划与执行完整任务，调度多个 Skill
- concept: 递进性
  desc: 知识库是起点，Agent 是终点，能力演进不可跳跃
- concept: 可组合性
  desc: 多个 Skill 可被同一个 Agent 编排调度，实现复合任务
- concept: 能力外延性
  desc: 知识库提供背景，Skill 提供技能，Agent 提供主动性
exercises:
- 'no': 1
  title: 识别场景所属层级
  contents:
  - 以下四个 AI 应用场景，分别属于知识库、Skill、Agent 中的哪一层？请写出理由：
  - 1. AI 根据你提供的产品资料自动生成产品介绍文档
  - 2. AI 基于你过去的文章风格模仿你写公众号文章
  - 3. AI 收到客户邮件后自动起草回复、预约会议并更新 CRM 记录
  - 4. AI 根据行业报告回答你“今年营销趋势是什么”
  - 提示：请从“是否解决认知/单点/完整任务”三个维度进行判断。
- 'no': 2
  title: 构建一个三层递进的完整案例
  contents:
  - 以“电商客服自动化”为目标，分别描述：
  - '- 知识库层面：AI 需要掌握哪些背景信息？'
  - '- Skill 层面：需要定义哪些标准化客服流程（如退换货、物流查询、投诉处理）？'
  - '- Agent 层面：AI 应如何自主调度这些 Skill 完成一次完整的客服闭环？'
  - 请用一句话概括三个层面之间的依赖关系。
- 'no': 3
  title: 分析“跳层”的后果
  contents:
  - 假设你现在只有知识库，想直接让 AI 完成“自动撰写并发布一篇小红书笔记”的任务：
  - 1. 缺少 Skill 会造成什么具体问题？
  - 2. 如果强行让 AI“硬做”，可能产生哪些不良结果？
  - 3. 按照三层递进框架，你应该补充什么才能真正完成该任务？
  - 请结合“递进性”与“边界条件”两个概念进行分析。
- 'no': 4
  title: 为三层框架设计评价指标
  contents:
  - 分别为一个“个人知识管理助手”的知识库、Skill 和 Agent 各设计 2 个可量化的评价指标：
  - '- 知识库：如何衡量 AI 对你的背景“认识得够好”？'
  - '- Skill：如何衡量某个固定流程的产出质量与稳定性？'
  - '- Agent：如何衡量其自主执行的完成度与效率提升？'
  - 结合“能力外延性”的概念，说明为何三层需要独立的评价维度。
units:
- 'no': 1
  name: AI三层递进 —— 让AI从“认识你”到“为你打工”
  points:
  - '**为什么需要这个概念？**'
  - '- 面对AI，人们常困惑“AI到底能帮我做什么”，缺乏一个宏观认知框架'
  - '- 不同AI能力（如对话、工具调用、自主执行）之间的边界模糊，导致使用混乱'
  - '- 需要一个递进式的类比，将AI能力从“了解你”到“执行任务”分层，指导实践'
  - '**核心定义**'
  - '- AI三层递进：知识库（KB）→ Skill（技能）→ Agent（智能体），对应认知、能力、行动三个层级'
  - '- 知识库让AI认识你（你的背景、偏好、数据）；Skill让AI学会干活（特定任务的可复用能力）；Agent让AI成为员工（自主规划与执行完整任务）'
  - '- 三层为递进关系：下层是上层的基础，上层是下层的价值延伸'
  - '**关键性质**'
  - '- 递进性：知识库是起点，Agent是终点，不可跳跃'
  - '- 可组合性：多个Skill可被同一个Agent调度编排，实现复合任务'
  - '- 能力外延性：知识库提供“背景”，Skill提供“技能”，Agent提供“主动性”'
  - '**典型例子**'
  - '- 知识库：把你的行业报告和个人笔记喂给AI，它懂得用你的术语与你对话'
  - '- Skill：你定义好一套“小红书文案生成”的固定流程，AI每次按此产出'
  - '- Agent：AI不仅生成文案，还自动排期发布、追踪数据、回复评论，全程无需你干预'
  - '**边界条件**'
  - '- 知识库只解决“认知”问题，不保证AI能干活'
  - '- Skill只解决单点任务，不负责跨步骤的规划'
  - '- Agent依赖前两者，缺少知识库支撑时其决策会“跑偏”，缺少Skill时其执行会“乏力”'
  sources:
  - paper: 260803《AI Agent员工》
    role: origin
  excerpts:
  - 知识库让AI认识你、Skill让AI学会干活、Agent让AI成为员工。
