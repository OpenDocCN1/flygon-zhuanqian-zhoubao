paper: 260824《微信小程序：从0到1做产品》
desc: 该素材是一本以「微信小程序：从0到1做产品」为主题的实战教程，核心主张小程序是普通人做产品的最佳起点，因为开发成本低、审核快、微信生态自带流量；其原创方法论是「不看代码，全部交给AI」，把AI工具贯穿选题调研、UI设计、前后端开发Prompt、服务器搭建（腾讯云+宝塔）、后端实现（Laravel+MySQL）、微信支付接入、Gitee代码管理、部署上线、推广与商单报价的完整产品落地链路，强调关键能力在于「怎么跟AI说话、怎么确认AI做对了」。
concepts:
- name: 小程序是普通人做产品的最佳起点
  desc: 该概念主张在众多产品形态中，微信小程序因开发成本低、审核快、微信生态自带流量，最适合无技术背景的普通人作为做产品的第一站。
  is_original: true
  excerpt:
  - 核心判断：小程序是普通人做产品的最佳起点——开发成本低、审核快、微信生态自带流量
- name: 不看代码，全部交给AI
  desc: 该概念指整套开发流程中不要求读者读懂或手写代码，而是把编码工作全部委托给AI工具完成，读者角色转变为指挥者与验收者。
  is_original: true
  excerpt:
  - 核心方法是"不看代码，全部交给AI"，但你必须知道怎么跟AI说话、怎么确认AI做对了。
- name: 跟AI说话的能力（Prompt能力）
  desc: 该概念指把产品需求准确翻译成AI可执行指令的能力，是本素材方法论中替代传统编程能力的核心门槛。
  is_original: true
  excerpt:
  - 但你必须知道怎么跟AI说话、怎么确认AI做对了。
- name: 确认AI做对了的能力（验收能力）
  desc: 该概念指在不懂代码的前提下判断AI产出是否正确、是否符合预期的能力，与Prompt能力共同构成「不看代码」路线的两个关键支撑。
  is_original: true
  excerpt:
  - 但你必须知道怎么跟AI说话、怎么确认AI做对了。
- name: 课前调研（选题、类目、资质）
  desc: 该概念指正式开发前的准备环节，包括确定选题方向、确认小程序所属类目以及判断所需资质，用于规避上线阶段的审核与合规风险。
  is_original: false
  excerpt:
  - 涵盖课前调研（选题、类目、资质）
- name: AI工具开发（UI设计、前后端Prompt）
  desc: 该概念指使用AI工具完成界面设计与前后端代码生成，其操作核心是编写UI设计Prompt与前后端Prompt。
  is_original: true
  excerpt:
  - AI工具开发（UI设计、前后端Prompt）
- name: 服务器购买与环境搭建（腾讯云+宝塔）
  desc: 该概念指小程序后端运行所需的服务器采购与运行环境配置方案，素材给出的具体组合是腾讯云服务器配合宝塔面板。
  is_original: false
  excerpt:
  - 服务器购买与环境搭建（腾讯云+宝塔）
- name: 后端开发（Laravel+MySQL）
  desc: 该概念指小程序服务端的技术实现方案，素材指定以Laravel作为后端框架、MySQL作为数据库。
  is_original: false
  excerpt:
  - 后端开发（Laravel+MySQL）
- name: 微信支付接入
  desc: 该概念指在小程序中打通微信支付能力，是产品从可玩走向可商业化的关键环节。
  is_original: false
  excerpt:
  - 微信支付接入
- name: Gitee代码管理
  desc: 该概念指使用Gitee对项目代码进行版本托管与管理，用于保障开发过程的可回溯与协作。
  is_original: false
  excerpt:
  - Gitee代码管理
- name: 部署上线
  desc: 该概念指将开发完成的小程序正式发布到线上环境、供真实用户使用的环节。
  is_original: false
  excerpt:
  - 部署上线
- name: 推广渠道
  desc: 该概念指小程序上线后获取用户的途径，属于产品从做完到被使用的延伸环节。
  is_original: false
  excerpt:
  - 推广渠道
- name: 商单报价参考
  desc: 该概念指承接小程序开发类商业订单时的报价依据与参考区间，指向该技能的可变现路径。
  is_original: true
  excerpt:
  - 商单报价参考
methods:
- name: __overview__
  desc: 该素材的整体方法论是「AI代写代码的全流程产品落地法」：以课前调研确定选题与合规边界，用AI完成UI与前后端代码，用腾讯云+宝塔搭建运行环境，以Laravel+MySQL实现后端，接入微信支付，用Gitee管理代码，最终部署上线并进入推广与商单变现，全程读者不阅读代码，只负责Prompt撰写与成果验收。
  excerpt:
  - 微信小程序开发全流程教程，涵盖课前调研（选题、类目、资质）、AI工具开发（UI设计、前后端Prompt）、服务器购买与环境搭建（腾讯云+宝塔）、后端开发（Laravel+MySQL）、微信支付接入、Gitee代码管理、部署上线、推广渠道和商单报价参考。
  - 核心方法是"不看代码，全部交给AI"，但你必须知道怎么跟AI说话、怎么确认AI做对了。
- name: 课前调研法（选题、类目、资质）
  desc: 该方法要求在动手开发前先完成三件事：确定做什么选题、确认落在哪个小程序类目、核实需要哪些资质，以此避免开发完成后卡在审核环节。
  excerpt:
  - 涵盖课前调研（选题、类目、资质）
- name: AI工具开发法（UI设计、前后端Prompt）
  desc: 该方法用AI工具承担界面设计、前端与后端代码编写，读者的实际工作是撰写UI设计Prompt与前后端Prompt。
  excerpt:
  - AI工具开发（UI设计、前后端Prompt）
- name: 腾讯云 + 宝塔环境搭建法
  desc: 该方法通过购买腾讯云服务器并安装宝塔面板，快速获得可用的后端运行环境。
  excerpt:
  - 服务器购买与环境搭建（腾讯云+宝塔）
- name: Laravel + MySQL 后端实现法
  desc: 该方法以Laravel框架配合MySQL数据库实现小程序服务端，处理数据存储与接口逻辑。
  excerpt:
  - 后端开发（Laravel+MySQL）
- name: 微信支付接入法
  desc: 该方法将微信支付能力集成进小程序，使产品具备实际收款与商业化能力。
  excerpt:
  - 微信支付接入
- name: Gitee 代码管理法
  desc: 该方法使用Gitee托管项目代码，配合AI生成代码的工作方式管理版本与变更。
  excerpt:
  - Gitee代码管理
- name: 部署上线法
  desc: 该方法把本地完成的开发成果发布到线上，使小程序可以被真实用户访问。
  excerpt:
  - 部署上线
- name: 推广与商单变现法
  desc: 该方法在小程序上线后通过推广渠道获取用户，并参照商单报价把开发能力转化为收入。
  excerpt:
  - 推广渠道和商单报价参考
theorems:
- name: 小程序是普通人做产品的最佳起点
  desc: 该核心主张认为，对没有技术背景的普通人而言，做产品的最优起点是微信小程序，理由有三：开发成本低、审核快、微信生态自带流量。
  excerpt:
  - 核心判断：小程序是普通人做产品的最佳起点——开发成本低、审核快、微信生态自带流量
- name: 不看代码，全部交给AI
  desc: 该核心主张认为，做小程序不必读代码或写代码，全部编码工作可以交给AI完成。
  excerpt:
  - 核心方法是"不看代码，全部交给AI"
- name: 不看代码的前提是会说会验收
  desc: 该核心主张是对上一条的限定：把代码交给AI并不等于零门槛，读者必须掌握两项能力——怎么跟AI说话（写Prompt）、怎么确认AI做对了（验收），否则方法论无法成立。
  excerpt:
  - 但你必须知道怎么跟AI说话、怎么确认AI做对了。
findings:
- name: 小程序作为产品起点的三个优势
  desc: '[claim] 素材宣称小程序具备开发成本低、审核快、微信生态自带流量三项优势，据此得出它是普通人做产品最佳起点的结论；素材未给出成本数字、审核时长或流量数据等支撑证据。'
  excerpt:
  - 核心判断：小程序是普通人做产品的最佳起点——开发成本低、审核快、微信生态自带流量
- name: AI全托管开发的可行技术栈组合
  desc: '[claim] 素材宣称「不看代码、全部交给AI」的路线可以跑通，并给出配套技术栈为腾讯云+宝塔、Laravel+MySQL、Gitee、微信支付；该结论以教程流程形式呈现，素材未提供项目实测结果或成功率数据作为evidence。'
  excerpt:
  - 服务器购买与环境搭建（腾讯云+宝塔）、后端开发（Laravel+MySQL）、微信支付接入、Gitee代码管理、部署上线
- name: 小程序能力可延伸至商业变现
  desc: '[claim] 素材宣称掌握该流程后可承接商业订单，并给出商单报价参考；素材未提供具体报价区间、成交案例或收入数据。'
  excerpt:
  - 推广渠道和商单报价参考
- name: 课前调研是规避审核风险的前置发现
  desc: '[evidence] 素材把选题、类目、资质三项调研放在开发之前作为独立环节，这一流程安排本身表明：小程序能否上线受类目与资质约束，而非仅由开发完成度决定。'
  excerpt:
  - 涵盖课前调研（选题、类目、资质）
