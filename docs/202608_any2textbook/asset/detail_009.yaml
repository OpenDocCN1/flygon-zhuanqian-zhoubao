learning_targets:
- 理解最小闭环的核心思想：先跑通链路，再逐步完善
- 掌握最小目录结构的设计原则与边界条件
- 能根据任务需求设计不超过5个目录的知识库骨架
- 能判断何时从最小闭环升级为完整系统
concept_map:
- 知识库搭建
- ├── 最小闭环
- │   ├── 核心定义           —— P001
- │   │   ├── 以闭环完成度为衡量标准
- │   │   └── 强调“转得动”而非“建得全”
- │   ├── 关键性质
- │   │   ├── 可运行性
- │   │   ├── 可迭代性
- │   │   └── 低成本
- │   └── 边界条件
- │       ├── 不适用高可靠性生产环境
- │       └── 规模超载需升级
- └── 最小目录结构
- '    ├── 核心定义           —— P002'
- '    │   └── 不超过5个目录，职责单一'
- '    ├── 关键性质'
- '    │   ├── 简洁性'
- '    │   ├── 职责单一'
- '    │   └── 可扩展性'
- '    └── 典型例子'
- '        ├── 项目区 / 资料区 / 模板区 / 输出区 / 归档区'
- '        └── 边界条件：多客户并行需扩展'
life_analogy:
- 想象搭建知识库是**整理一个旅行背包**：
- '- **最小闭环** = 只带上今天必需的物品，先出发，而不是买齐所有装备才走'
- '- **最小目录结构** = 背包只有5个格子：食物、衣物、工具、文档、纪念品'
- '- **职责单一** = 每个格子只放一类东西，拿取方便'
- '- **可扩展性** = 旅途变长时，再额外加挂侧袋，而不是换一个大箱子'
- 就像好的背包设计让你轻装上阵，知识库的最小目录结构让你快速跑通流程，而不是被复杂的管理规则拖累。
summary:
- concept: 最小闭环
  desc: 用最少设计跑通从输入到输出的完整链路，以闭环完成度为衡量标准，而不是功能的全面性
- concept: 可运行性
  desc: 所有环节必须真实可执行，保证知识库能落地使用
- concept: 可迭代性
  desc: 以闭环为起点逐步扩展，避免一次性铺开导致失控
- concept: 低成本
  desc: 控制目录、工具、流程的数量，降低长期维护负担
- concept: 最小目录结构
  desc: 不超过5个职责单一的目录组织知识库，平衡简洁与功能
- concept: 职责单一
  desc: 每个目录对应清晰用途，避免内容存储混乱
- concept: 可扩展性
  desc: 5个目录是起点而非上限，未来可按需增加
- concept: 升级条件
  desc: 当知识库规模或使用频率超出最小闭环承载能力，或业务复杂度上升时需升级
exercises:
- 'no': 1
  title: 设计你的第一个最小闭环
  contents:
  - 选定一个你正在积累的主题领域（如读书笔记、工作项目、写作素材），设计一个只包含录入 -> 加工 -> 检索三段的最小闭环：
  - 1. 明确每一段的具体产出物是什么
  - 2. 为实现每一段只选择一个你已有的工具
  - 3. 写出你将在60分钟内实测完成的一次最小闭环（从录入一条资料到成功检索到它）
  - 回答问题：
  - '- 这次闭环中，哪一环最有可能出现“转不动”的情况？你会如何简化它？'
  - '- 什么情况下，这个最小闭环的表现让你认为可以继续添加目录或自动化？'
- 'no': 2
  title: 限制与扩展：给你的知识库画五格抽屉
  contents:
  - 当前有两个候选目录方案：
  - 方案A：项目区 / 资料区 / 模板区 / 输出区 / 归档区
  - 方案B：学习区 / 工作区 / 生活区 / 收藏区 / 临时区
  - 请完成以下任务：
  - 1. 将你近一个月产生的10条典型资料（如会议纪要、课程笔记、灵感碎片、报告PDF等）分别放入两个方案中，检查是否存在“不知放哪”或“必须硬塞”的情况
  - 2. 针对硬塞的情况，提出一条新的存储规则（不增加目录），解决归属问题
  - 回答问题：
  - '- 方案A与方案B的划分逻辑有何本质不同？对你的资料类型而言，哪个更系统？'
  - '- 若增加第6个目录能一举解决全部归属冲突，你会加吗？为什么？'
- 'no': 3
  title: 判定升级时机：从五格抽屉到专业书架
  contents:
  - 为了区分“何时必须升级”而非“何时想要升级”，请对以下三个业务场景打分（1-5分，5为最高）：
  - '- 多客户项目并行（客户A的交付物与客户B的日常沟通记录混在一起）'
  - '- 年增长资料超过5000条（检索变慢，目录内文件堆积）'
  - '- 对检索实时性有验收要求（如客服场景下必须10秒内给出答案）'
  - 完成以下推理：
  - 1. 当哪些场景同时达到3分以上时，可以判断“最小闭环已超载”？
  - 2. 针对超载场景，仅用“增加领域子目录”和“增加工具（如引入数据库）”两个手段，各给出一种可行的升级方案
  - 回答问题：
  - '- 升级方案中，哪些代价是与“最小闭环”理念相冲突的？你是否愿意承受？'
  - '- 若权衡后认为不应升级，你该如何通过“降低期望”或“缩减范围”来继续留在最小闭环内？'
units:
- 'no': 1
  name: 最小闭环 —— 让知识库先“转起来”再“长大”
  points:
  - '**为什么需要这个概念？**'
  - '- 搭建个人AI知识库时，初学者常陷入追求完整系统的陷阱，导致迟迟无法落地'
  - '- 知识库的价值在使用中产生，而非在搭建中产生'
  - '- 小步快跑、先跑通再优化是工程实践的核心原则'
  - '**核心定义**'
  - '- 最小闭环指用最少的设计与工具，先让知识库从输入到输出的链路完整跑通，形成可复用、可验证的最小流程'
  - '- 强调“转得动”而非“建得全”，以闭环的完成度作为衡量标准'
  - '**关键性质**'
  - '- 可运行性：所有环节（采集、加工、存储、检索）必须真实可执行'
  - '- 可迭代性：以闭环为起点，逐步添加功能，而非一次性铺开'
  - '- 低成本：目录、工具、流程数量最小化，降低维护负担'
  - '**典型例子**'
  - '- 使用Obsidian建立5个以内的目录，配合Codex的自动化脚本，能跑通一次“资料录入->处理->搜索”的完整流程，就算完成一个最小闭环'
  - '**边界条件**'
  - '- 最小闭环不适用于需要高可靠性的生产环境'
  - '- 当知识库的规模或使用频率超过最小闭环的承载能力时，必须升级为完整系统'
  sources:
  - paper: 260810《用3份资料跑通Obsidian+Codex个人AI知识库》
    role: origin
  excerpts:
  - 配合最小目录结构（5个目录以内）比追求完整系统更有效。
- 'no': 2
  name: 最小目录结构 —— 给知识库画一条“五格抽屉”边界
  points:
  - '**为什么需要这个概念？**'
  - '- 知识库目录结构过于复杂会加重维护成本，导致使用意愿下降'
  - '- 目录是知识库的骨架，骨架简洁则内容流转才可能流畅'
  - '- 5个以内的目录足以覆盖个人知识库的核心功能，不需要过度设计'
  - '**核心定义**'
  - '- 最小目录结构指用不超过5个目录来组织知识库，保证每个目录职责单一、易于辨别'
  - '- 强调目录的数量与功能之间的平衡，避免过度分层'
  - '**关键性质**'
  - '- 简洁性：目录数量少，心智负担低'
  - '- 职责单一：每个目录对应清晰的用途，避免内容存储混乱'
  - '- 可扩展性：5个目录是起点，而非上限，未来可按需增加'
  - '**典型例子**'
  - '- 一个常用的最小目录结构：项目区 / 资料区 / 模板区 / 输出区 / 归档区，配合Obsidian和Codex跑通个人工作流'
  - '**边界条件**'
  - '- 当业务场景复杂（如多客户项目并行）时，5个目录可能不够，需要按领域拆分'
  - '- 最小目录结构适合个人或小团队，不适合大型组织知识管理'
  sources:
  - paper: 260810《用3份资料跑通Obsidian+Codex个人AI知识库》
    role: origin
  excerpts:
  - 最小目录结构（5个目录以内）。
'no': 9
