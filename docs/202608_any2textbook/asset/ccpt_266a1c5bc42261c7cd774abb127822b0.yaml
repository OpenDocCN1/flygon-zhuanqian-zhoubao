paper: 260803《如何把你的业务流程做成AI Agent员工》
desc: 该素材以「批量抓取B站字幕并录入Obsidian知识库」为具体案例，系统提出了一套将业务流程转化为AI Agent员工的方法论——Agent制作八步法，并围绕Agent（员工）、Skill（技能）、知识库、CLI、MCP等核心概念，阐述了「稳定做出AI
  Agent员工的关键不是写完美提示词，而是让它经历真实执行、人工纠偏、规则沉淀、重新验证的过程」这一核心判断，同时给出AGENTS.md存原则、Skill存流程、脚本负责确定性、验证器负责兜底、语义判断交给AI、生产与质检必须分开、从真实任务开始而非从工具开始等落地要点。
concepts:
- name: Agent（员工）
  desc: 将AI Agent类比为组织中的「员工」，强调其应承担完整业务流程角色而非单次问答工具，是素材贯穿始终的主隐喻。
  is_original: true
  excerpt:
  - 核心概念：Agent（员工）、Skill（技能）、知识库、CLI、MCP
  - 稳定做出 AI Agent 员工的关键不是写完美提示词
- name: Skill（技能）
  desc: Skill被定位为Agent的「技能」，用于存放流程性知识，与存放原则的AGENTS.md形成分工。
  is_original: true
  excerpt:
  - AGENTS.md 存原则、Skill 存流程、脚本负责确定性、验证器负责兜底
- name: 知识库
  desc: 以Obsidian知识库为落地目标，是Agent处理结果的沉淀容器，也是案例的业务终点。
  is_original: false
  excerpt:
  - 以批量抓取B站字幕录入Obsidian知识库为案例
- name: CLI
  desc: 命令行接口作为Agent可调用的确定性执行手段之一，被归入「脚本负责确定性」的工具分工。
  is_original: false
  excerpt:
  - 核心概念：Agent（员工）、Skill（技能）、知识库、CLI、MCP
  - 确定性任务用脚本
- name: MCP
  desc: 模型上下文协议被列为Agent能力扩展的关键接口概念，与CLI并列作为Agent与外部世界交互的工具通道。
  is_original: false
  excerpt:
  - 核心概念：Agent（员工）、Skill（技能）、知识库、CLI、MCP
methods:
- name: __overview__
  desc: 素材的整体方法论：以真实业务流程（B站字幕抓取→Obsidian入库）为载体，通过「真实执行、人工纠偏、规则沉淀、重新验证」的循环，配合AGENTS.md/Skill/脚本/验证器的分层架构，并坚持生产与质检分离、确定性与语义判断分流，将流程逐步固化为AI
    Agent员工。
  excerpt:
  - 核心判断：稳定做出 AI Agent 员工的关键不是写完美提示词，而是让它经历"真实执行、人工纠偏、规则沉淀、重新验证"的过程。
  - AGENTS.md 存原则、Skill 存流程、脚本负责确定性、验证器负责兜底，语义判断交给 AI，不能硬编码。
  - 生产与质检必须分开，同一个上下文不能又当运动员又当裁判。
  - 工具分工：确定性任务用脚本，需要语义判断的任务交给 AI。
  - Agent 落地要点：从真实任务开始而非从工具开始。
- name: Agent制作八步法
  desc: 素材提出的将业务流程制作为AI Agent员工的具体八步操作流程，是全篇最核心的可复用方法。
  excerpt:
  - Agent 制作八步法。
- name: 生产与质检分离机制
  desc: 将执行任务的上下文与检查任务的上下文分离，避免同一上下文既生产又质检导致自我宽容，对应「不能又当运动员又当裁判」的机制设计。
  excerpt:
  - 生产与质检必须分开，同一个上下文不能又当运动员又当裁判。
- name: 工具分工策略
  desc: 按任务性质分流：确定性任务用脚本（CLI等）执行，涉及语义判断的任务交给AI，避免对语义环节硬编码。
  excerpt:
  - 工具分工：确定性任务用脚本，需要语义判断的任务交给 AI。
  - 语义判断交给 AI，不能硬编码。
theorems:
- name: 稳定产出Agent的关键在于纠偏-沉淀-验证循环
  desc: 核心主张：做出可稳定运行的AI Agent员工，关键不在提示词工程，而在于让Agent经历真实执行、人工纠偏、规则沉淀、重新验证的迭代闭环。
  excerpt:
  - 稳定做出 AI Agent 员工的关键不是写完美提示词，而是让它经历"真实执行、人工纠偏、规则沉淀、重新验证"的过程。
- name: 分层职责原则
  desc: 核心主张：Agent体系应按职责分层——AGENTS.md存原则、Skill存流程、脚本负责确定性、验证器负责兜底，语义判断交给AI且不可硬编码。
  excerpt:
  - AGENTS.md 存原则、Skill 存流程、脚本负责确定性、验证器负责兜底，语义判断交给 AI，不能硬编码。
- name: 裁判与运动员分离原则
  desc: 核心主张：生产与质检必须在不同上下文中进行，同一上下文不能既当运动员又当裁判，否则质检会失真。
  excerpt:
  - 生产与质检必须分开，同一个上下文不能又当运动员又当裁判。
- name: 从真实任务出发原则
  desc: 核心主张：Agent落地应从真实任务出发，而非从选工具出发，工具应为任务服务。
  excerpt:
  - Agent 落地要点：从真实任务开始而非从工具开始。
findings:
- name: B站字幕批量入库Obsidian案例
  desc: '[evidence] 素材以批量抓取B站字幕并录入Obsidian知识库作为完整落地案例，验证了八步法与分层职责、生产质检分离等原则在该真实任务中的可行性。'
  excerpt:
  - 《如何把你的业务流程做成 AI Agent 员工》核心内容：以批量抓取B站字幕录入Obsidian知识库为案例。
- name: 提示词并非稳定性的决定因素
  desc: '[claim] 素材宣称稳定做出AI Agent员工的关键不是写完美提示词，而是纠偏-沉淀-验证的过程；该主张为作者经验性论断，素材未提供对照实验数据。'
  excerpt:
  - 稳定做出 AI Agent 员工的关键不是写完美提示词，而是让它经历"真实执行、人工纠偏、规则沉淀、重新验证"的过程。
- name: 语义判断不可硬编码
  desc: '[claim] 素材主张语义判断应交由AI、不能硬编码为规则；该结论基于案例实践中的经验总结，未提供量化对比证据。'
  excerpt:
  - 语义判断交给 AI，不能硬编码。
  - 工具分工：确定性任务用脚本，需要语义判断的任务交给 AI。
