suggested_preprocess:
- 去重：识别并合并标题高度相似的文件（如《从「读取微信聊天记录」...》出现两次、《300点赞投锚...》出现两次等）
- 提取元数据：从文件名解析日期和主题标签，建立素材索引表
- 内容分类：按主题聚类（AI工具/变现、平台运营、项目复盘、教程类），判断是否存在可成书的统一主线
- 剔除非正文内容：清理推广语、微信联系方式、重复图片占位符
- 评估成书可行性：判断是做成'副业/AI变现实操手册'还是按主题拆分为多个专题册
