paper: 260810《OPC与创业者放大思路（风控合规）》
desc: 该素材是一篇由法律从业者基于十几年合规与强制执行实务经验撰写的风险警示型文章，面向AI时代的OPC（一人公司）及创业者，系统梳理了创业放大过程中最常见的五类致命风险——公司主体隔离失效、财务保障缺失、现金流结构脆弱、合作边界模糊和投资担保陷阱，并指出创业的制度本质是一场无限概率游戏而非一命通关，公司制度的最高价值在于将'项目死亡'与'创业者个人死亡'进行风险切割。
concepts:
- name: OPC（一人公司）举证责任倒置
  desc: 指一人有限责任公司的股东在诉讼中需自行证明公司财产独立于个人财产，否则将对公司债务承担连带责任，这与普通有限公司'谁主张谁举证'的规则相反，使OPC股东的个人资产暴露风险极高。
  is_original: false
  excerpt:
  - 一人公司举证责任倒置使股东资产风险极高
- name: 无限概率游戏（创业观）
  desc: 作者提出的核心创业认知框架：创业应被理解为一个可以多次下注、持续参与的无限概率游戏，而非只有一次生命、失败即终结的'一命通关'模式。
  is_original: true
  excerpt:
  - 创业应该是无限概率游戏，不是一命通关
- name: 公司主体隔离的双重死亡切割
  desc: 作者对公司制度核心价值的原创概括：公司制度的最大价值不是节税或融资便利，而是把'项目死了'和'创业者死了'这两件事在法律和财务上分开。
  is_original: true
  excerpt:
  - 公司制度最大价值是把"项目死了"和"创业者死了"分开
- name: 创业者放大
  desc: 素材的核心议题场景，指创业者从单点业务或小规模经营向更大规模、更多客户、更多合作方扩展的过程，此过程中风险结构发生质变。
  is_original: false
  excerpt:
  - 分享OPC、创业者必看的放大思路
- name: 创业者存活基本条件
  desc: 作者归纳的创业者持续存活所需的三项底线条件：财务保障计划、客户结构分散、避免个人担保。
  is_original: true
  excerpt:
  - 财务保障计划、客户结构分散、避免个人担保是创业者存活基本条件
methods:
- name: __overview__
  desc: 素材整体方法论为'风险清单式防御法'：以法律从业者十几年合规与强制执行实务经验为基础，逆向盘点AI OPC和创业者放大过程中最常见的'死法'，再针对每一种死法给出规避方法，覆盖公司主体隔离、财务保障、现金流管理、合作边界和投资风险五大模块。
  excerpt:
  - 做合规、强制执行十几年，分享OPC、创业者必看的放大思路
  - 涵盖公司主体隔离、财务保障、现金流管理、合作边界和投资风险
theorems:
- name: 创业是无限概率游戏，不是一命通关
  desc: 作者的核心主张：创业者应把创业视为可反复参与、可承受多次失败的无限概率游戏，而非只有一次机会、失败即出局的'一命通关'模式，因此风险控制的目的是保住继续参与的资格。
  excerpt:
  - 创业应该是无限概率游戏，不是一命通关
- name: 公司制度的最高价值是风险切割
  desc: 作者主张公司制度的核心价值不在于税务或融资功能，而在于将'项目死了'与'创业者死了'分开，实现项目风险与个人生存风险的隔离。
  excerpt:
  - 公司制度最大价值是把"项目死了"和"创业者死了"分开
- name: OPC股东资产风险极高
  desc: 作者主张一人公司因举证责任倒置，股东个人资产面临极高风险，是OPC创业者放大过程中必须优先处理的制度性缺陷。
  excerpt:
  - 一人公司举证责任倒置使股东资产风险极高
- name: 三项存活底线条件
  desc: 作者主张财务保障计划、客户结构分散、避免个人担保是创业者存活的基本条件，三者缺一即可能导致创业者个人被项目拖垮。
  excerpt:
  - 财务保障计划、客户结构分散、避免个人担保是创业者存活基本条件
findings:
- name: AI OPC与创业者放大中的常见死法清单
  desc: '[claim] 作者基于十几年合规与强制执行实务经验宣称，AI OPC和创业者放大过程中最常见的死法集中在公司主体隔离、财务保障、现金流管理、合作边界和投资风险五个方面，并对应给出规避方法。'
  excerpt:
  - 法律从业者总结AI OPC和创业者放大过程中最常见的死法及规避方法，涵盖公司主体隔离、财务保障、现金流管理、合作边界和投资风险
- name: 强制执行实务视角的风险验证
  desc: '[evidence] 素材以作者''做合规、强制执行十几年''的执业经历作为经验证据来源，支撑其对创业者死法与规避方法的归纳，但素材未提供具体案例编号、数据表格或统计样本。'
  excerpt:
  - 做合规、强制执行十几年，分享OPC、创业者必看的放大思路
