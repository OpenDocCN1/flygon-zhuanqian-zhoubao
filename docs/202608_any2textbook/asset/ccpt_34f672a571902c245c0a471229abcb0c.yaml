paper: 260805《花12万找FDE踩坑，用AI自研系统》
desc: 该素材讲述了一家29人家具建材公司老板在花费12万元外包定制ERP失败后，凭借零代码基础，利用Codex与Claude在一个月内自研出包含客资导入、SOP追踪、绩效数据化、项目节点化、实时利润五大模块的ERP系统，每月AI订阅成本仅2000多元。素材提出了'反向FDE'这一核心概念，强调让懂业务的人学会用AI远比让AI工程师学会一个行业更快，业务理解才是护城河，并总结了六条军规、需求描述六格模板、把AI装进系统实现'事找人'等方法论。
concepts:
- name: 反向FDE
  desc: 该概念指不是工程师钻进业务，而是业务里的人自己长出工程能力，即由懂业务的人反向掌握AI工程能力来构建系统。
  is_original: true
  excerpt:
  - 核心概念'反向FDE'：不是工程师钻进业务，而是业务里的人自己长出工程能力。
  - 让懂业务的人学会用AI，比让AI工程师学会一个行业快得多；业务理解才是护城河，技术是AI能补上的一半。
- name: 业务理解护城河
  desc: 该概念主张业务理解才是真正的竞争壁垒，技术只是AI能够补上的另一半。
  is_original: true
  excerpt:
  - 业务理解才是护城河，技术是AI能补上的一半。
- name: 管理思想代码化
  desc: 该概念指定制系统的真正价值不在于功能比SaaS多，而在于能把管理思想变成代码强制执行。
  is_original: true
  excerpt:
  - 定制系统真正价值不是功能比SaaS多，而是管理思想能变成代码强制执行。
- name: 工作流优先于模型
  desc: 该概念主张成熟的工作流比聪明的模型更重要，工作流依赖纪律而非天赋。
  is_original: true
  excerpt:
  - 成熟的工作流比聪明的模型更重要，工作流吃纪律不吃天赋。
methods:
- name: __overview__
  desc: 该素材的整体方法论包括六条军规、需求描述六格模板、把AI装进系统让'事找人'三大部分，指导非技术背景的业务人员用AI自研企业系统。
  excerpt:
  - 方法论：六条军规、需求描述六格模板、把AI装进系统让'事找人'。
- name: 六条军规
  desc: 该方法为使用AI自研系统过程中总结出的六条核心操作纪律，具体条目素材中未展开。
  excerpt:
  - 方法论：六条军规、需求描述六格模板、把AI装进系统让'事找人'。
- name: 需求描述六格模板
  desc: 该方法提供一种结构化模板，用六个格子来规范向AI描述需求的方式，具体内容素材中未展开。
  excerpt:
  - 方法论：六条军规、需求描述六格模板、把AI装进系统让'事找人'。
- name: 把AI装进系统让'事找人'
  desc: 该方法指将AI能力嵌入系统之中，实现由事务主动找到人而非人去找事务的工作模式。
  excerpt:
  - 方法论：六条军规、需求描述六格模板、把AI装进系统让'事找人'。
theorems:
- name: 业务人员学AI快于工程师学行业
  desc: 该核心主张认为让懂业务的人学会用AI，比让AI工程师学会一个行业要快得多。
  excerpt:
  - 让懂业务的人学会用AI，比让AI工程师学会一个行业快得多；业务理解才是护城河，技术是AI能补上的一半。
- name: 管理思想代码化是定制系统核心价值
  desc: 该核心主张认为定制系统真正价值不是功能比SaaS多，而是管理思想能变成代码强制执行。
  excerpt:
  - 定制系统真正价值不是功能比SaaS多，而是管理思想能变成代码强制执行。
- name: 工作流比模型更重要
  desc: 该核心主张认为成熟的工作流比聪明的模型更重要，工作流吃纪律不吃天赋。
  excerpt:
  - 成熟的工作流比聪明的模型更重要，工作流吃纪律不吃天赋。
findings:
- name: 外包定制ERP失败
  desc: '[evidence] 素材数据显示，花费12万元外包定制ERP，开发1年上线1个月即被枪毙，说明外包模式在该场景下失败。'
  excerpt:
  - 29人家具建材公司老板富二蛋，花12万外包定制ERP失败（开发1年上线1月被枪毙）。
- name: 零代码基础一个月自研ERP成功
  desc: '[evidence] 素材数据显示，零代码基础的老板用Codex+Claude一个月自研出含客资导入、SOP追踪、绩效数据化、项目节点化、实时利润五大模块的ERP，每月AI订阅成本2000多元。'
  excerpt:
  - 零代码基础用Codex+Claude一个月自研出含客资导入、SOP追踪、绩效数据化、项目节点化、实时利润五大模块的ERP，每月AI订阅成本2000多元。
