paper: 260820《从Demo到公司正式上线：零代码AI开发实录》
desc: 该素材记录了深耕电商的非技术人员使用 Codex 与 Claude 等 AI 工具，在一个多月内从零代码做出公司 40 多人使用的业务系统（档期管理+CRM+AI
  销售分析）的完整实录，核心主张是 Demo 只证明「能不能做出来」而正式系统要解决「公司敢不敢用」，真正让系统成熟的不是 AI 而是公司里的真实用户反馈，并提炼出
  7 步流程、Claude 规划+Codex 执行的分工模式与三次确认机制等方法论，同时附带 4 份可复用提示词模板和上线检查清单。
concepts:
- name: Demo 与正式系统的鸿沟
  desc: 区分「能不能做出来」（Demo 阶段）与「公司敢不敢用」（正式系统阶段）两个不同性质的目标，指出后者才是零代码 AI 开发真正的难点所在。
  is_original: true
  excerpt:
  - Demo证明"能不能做出来"，正式系统解决"公司敢不敢用"
- name: 真实用户反馈驱动系统成熟
  desc: 核心判断：让系统走向成熟的并非 AI 本身的能力提升，而是公司内部真实用户在使用中产生的反馈。
  is_original: true
  excerpt:
  - 真正让系统成熟的不是AI，而是公司里的真实用户反馈
- name: 最小闭环优先策略
  desc: 开发策略上主张先跑通一个最小可用闭环，再在此基础上逐步扩展功能，而非一开始就构建完整系统。
  is_original: true
  excerpt:
  - 先跑通最小闭环再逐步扩展
methods:
- name: __overview__
  desc: 素材整体方法论：以 7 步流程为主线，配合 Claude 负责规划、Codex 负责执行的 AI 分工模式，并通过三次确认机制控制偏差，最终完成从
    Demo 到公司正式上线。
  excerpt:
  - 方法论：7步流程、Claude规划+Codex执行的分工模式、三次确认机制
- name: 7 步开发流程
  desc: 将零代码 AI 开发过程拆解为 7 个步骤的流程化方法，用于指导从零到正式上线的系统构建。
  excerpt:
  - 方法论：7步流程、Claude规划+Codex执行的分工模式、三次确认机制
- name: Claude 规划 + Codex 执行分工模式
  desc: 在多 AI 工具协作中，由 Claude 负责规划与设计，Codex 负责具体代码执行的分工协作方式。
  excerpt:
  - 方法论：7步流程、Claude规划+Codex执行的分工模式、三次确认机制
- name: 三次确认机制
  desc: 在开发流程中设置三次确认环节，用于校验方向与产出、降低返工风险的机制。
  excerpt:
  - 方法论：7步流程、Claude规划+Codex执行的分工模式、三次确认机制
theorems:
- name: Demo 证明可行性，正式系统解决可用性
  desc: 核心主张：Demo 阶段验证的是「能不能做出来」，正式系统阶段解决的才是「公司敢不敢用」，两者目标不同，后者是真正的门槛。
  excerpt:
  - Demo证明"能不能做出来"，正式系统解决"公司敢不敢用"
- name: 用户反馈而非 AI 是系统成熟的关键
  desc: 核心主张：推动系统走向成熟的真正动力来自公司内真实用户的使用反馈，而非 AI 工具本身的迭代。
  excerpt:
  - 真正让系统成熟的不是AI，而是公司里的真实用户反馈
- name: 先跑通最小闭环再逐步扩展
  desc: 核心主张：开发路径应从最小可用闭环起步，验证通过后再逐步扩展功能，以降低复杂度与风险。
  excerpt:
  - 先跑通最小闭环再逐步扩展
findings:
- name: 非技术人员零代码开发公司级系统
  desc: '[evidence] 素材记录一位深耕电商的非技术人员使用 Codex+Claude，在一个多月内做出供公司 40 多人使用的业务系统（档期管理+CRM+AI
    销售分析），支撑了「零代码也能交付公司正式系统」这一结论。'
  excerpt:
  - 深耕电商的非技术人员用Codex+Claude一个多月做出公司40多人使用的业务系统（档期管理+CRM+AI销售分析）
- name: 可复用提示词模板与上线检查清单
  desc: '[evidence] 素材附带 4 份可复用提示词模板和一份上线检查清单，作为上述方法论可迁移、可复用的实证产出。'
  excerpt:
  - 附带4份可复用提示词模板和上线检查清单
