learning_targets:
- 理解真实任务起点原则：先有难题，再有工具
- 掌握五步法：拆解业务找场景→搭知识库→固化Skill→搭Agent→反馈回流
- 掌握Agent制作八步法，理解纠偏-沉淀-验证循环
- 理解生产与质检分离原则，避免同一上下文既当运动员又当裁判
- 掌握人机协作四步流程与反馈回流机制，构建自进化体系
- 能根据业务价值判断任务是否适合Agent化，并选择合适的搭建路径
concept_map:
- Agent员工军团搭建
- ├── 起点原则
- │   ├── 真实任务起点（先有难题再有工具）
- │   │   ├── 业务导向：按业务价值定优先级
- │   │   ├── 可拆解性：能拆成子步骤映射流程
- │   │   └── 可验收性：有明确产出物或指标
- │   └── 边界条件：高频、耗时、规则可描述才适合Agent化
- ├── 搭建方法
- │   ├── 五步法（260828《Agent员工军团搭建流程》）
- │   │   ├── 拆解业务找场景
- │   │   ├── 数据采集搭知识库
- │   │   ├── Skill固化产出
- │   │   ├── 设计交互搭Agent
- │   │   └── 反馈回流驱动进化
- │   ├── Agent制作八步法（260803《AI Agent员工》）
- │   │   ├── 经历真实执行
- │   │   ├── 人工纠偏
- │   │   ├── 规则沉淀
- │   │   └── 重新验证
- │   └── 人机协作四步流程（260810《用3份资料跑通Obsidian+Codex个人AI知识库》）
- │       ├── Codex给方案
- │       ├── 用户确认
- │       ├── Codex执行
- │       └── 自检
- ├── 稳定输出保障
- │   ├── 纠偏沉淀验证循环（核心主张：关键不在完美提示词）
- │   ├── 生产与质检分离（同一上下文不能又当运动员又当裁判）
- │   └── 分层职责架构
- │       ├── AGENTS.md存原则
- │       ├── Skill存流程
- │       ├── 脚本负责确定性
- │       └── 验证器兜底
- └── 系统进化
- ├── 反馈回流机制（系统进化的关键）
- └── 成果验证：用五步法搭建12个Agent员工月入7w
life_analogy:
- 想象搭建Agent员工就像**为新餐厅组建后厨团队**：
- '- **真实任务起点** = 先看菜谱（业务需求）再决定买什么锅（选工具），而不是先买一堆锅再想做什么菜'
- '- **五步法** = 从选定招牌菜（拆解业务）→备齐食材（搭知识库）→写出标准菜谱（固化Skill）→培训厨师（搭Agent）→根据顾客反馈改良（反馈回流）'
- '- **纠偏沉淀验证循环** = 新厨师先试做→主厨纠正手法→把修正后的手法写进菜谱→再次试做确认味道稳定'
- '- **生产与质检分离** = 炒菜的厨师不能同时负责品尝打分，必须由专门的品控员检验出品质量'
- 就像餐厅靠顾客反馈不断改良菜谱，Agent也需要反馈回流持续进化。
summary:
- concept: 真实任务起点
  desc: 先有真实难题，再有工具，任务驱动才能避免技术浪费
- concept: 五步法
  desc: 拆场景→搭知识库→固化Skill→搭Agent→反馈回流，系统化搭建流程
- concept: Agent制作八步法
  desc: 经历真实执行、人工纠偏、规则沉淀、重新验证的迭代过程
- concept: 纠偏沉淀验证循环
  desc: 稳定产出的关键不是完美提示词，而是纠偏-沉淀-验证的闭环
- concept: 生产与质检分离
  desc: 同一上下文不能既当运动员又当裁判，质检需独立
- concept: 人机协作四步流程
  desc: Codex给方案→用户确认→Codex执行→自检，人机分工明确
- concept: 反馈回流机制
  desc: 反馈回流是系统进化的关键，驱动Agent持续改进
- concept: 分层职责架构
  desc: AGENTS.md存原则、Skill存流程、脚本负责确定性、验证器兜底
- concept: Agent军团成果
  desc: 用五步法搭建12个Agent员工月入7w，验证方法有效性
exercises:
- 'no': 1
  title: 识别任务起点：真实任务 vs 工具先行
  contents:
  - 以下哪些描述符合“真实任务起点”原则，哪些是“工具先行”？请分类并说明理由：
  - 1. 团队发现日报撰写每天耗时1小时，决定搭建Agent自动生成
  - 2. 看到LangChain很火，决定用它做一个Agent试试
  - 3. 客服团队收到大量重复咨询，希望Agent自动回答常见问题
  - 4. 想用AutoGPT，先跑通一个demo再说
  - 5. 财务部门月结对账耗时3天，希望Agent辅助对账流程
  - 回答问题：
  - '- 作为起点，上述任务中哪些具备“高频、耗时、规则可描述”三特征？'
  - '- 如果一个任务完全依赖资深员工的隐性经验，是否适合作为Agent化起点？为什么？'
- 'no': 2
  title: 用五步法拆解一个真实任务
  contents:
  - 假设你是一家电商公司的运营，每周需要整理竞品价格变动并生成简报（耗时4小时），请用五步法设计Agent化方案：
  - 1. 第一步（拆解业务找场景）：列出该任务可拆分的子步骤（至少5个）
  - 2. 第二步（数据采集搭知识库）：确定知识库需要哪些数据源（如竞品官网、价格API、历史简报）
  - 3. 第三步（Skill固化产出）：定义简报的固定格式和产出标准
  - 4. 第四步（设计交互搭Agent）：描述用户与Agent的交互流程（输入什么、触发什么输出）
  - 5. 第五步（反馈回流）：设计反馈收集机制，明确哪些反馈应回流改进流程
  - 回答问题：
  - '- 在第二步中，如果竞品价格数据没有公开API，你的替代方案是什么？'
  - '- 你的反馈回流机制如何区别对待“格式调整”和“数据逻辑错误”两类反馈？'
- 'no': 3
  title: 设计纠偏-沉淀-验证循环与质检分离机制
  contents:
  - 你已按八步法搭建了一个生成营销文案的Agent，初始提示词产生的文案质量不稳定。请设计：
  - 1. 纠偏策略：列出至少3种发现Agent输出偏差的方法（如定期人工抽检、用户反馈收集）
  - 2. 规则沉淀：给出2条你从纠偏中提炼的具体规则（例如“禁止使用夸张用语”“必须包含数据支撑”），说明如何将其固化为Skill
  - 3. 重新验证：设计一个验证方案，说明如何确认规则沉淀后输出质量确实提升（如对比前后指标）
  - 4. 质检分离：描述你的“生产Agent”与“质检模块”如何分工，质检模块独立运行
  - 回答问题：
  - '- 如果质检模块本身也由Agent承担，如何避免它和生产Agent共用同一上下文？'
  - '- 当沉淀的规则越来越多时，如何防止规则冲突？你会如何设计规则优先级？'
- 'no': 4
  title: 设计反馈回流机制与进化路径
  contents:
  - 你的Agent已经上线运行并产生输出，请设计一个完整的反馈回流机制：
  - 1. 收集渠道：列出至少3种反馈收集方式（如用户评分、错误报告、定期复盘会）
  - 2. 分类处理：将反馈分为“即时修复”（如数据源错误）和“迭代优化”（如新增功能）两类，分别说明处理流程
  - 3. 回流实施：描述一条具体反馈从收集→分析→沉淀→验证→部署的完整路径
  - 4. 进化评估：设计3个指标衡量你的Agent是否在持续进化（如错误率下降、用户满意度提升、处理速度加快）
  - 回答问题：
  - '- 如果反馈数量过多导致处理滞后，你会优先处理哪类反馈？优先级排序依据是什么？'
  - '- 如何判断一条反馈是“特殊个例”还是“系统性缺陷”？给出你的判断依据和方法。'
- 'no': 5
  title: 综合设计：从零搭建一个合规审查Agent（人机协作+分层架构）
  contents:
  - 某法务团队每天收到50份合同需要合规审查（每份人工耗时40分钟），请结合本章全部概念设计完整方案：
  - 1. 描述真实任务并验证其是否适合Agent化（对照三特征）
  - 2. 用五步法给出整体搭建路线图
  - 3. 设计人机协作流程（参照四步流程：Agent给方案→用户确认→Agent执行→自检）
  - '   - 哪些环节必须人工确认？哪些可以自动执行？'
  - 4. 设计分层职责架构：AGENTS.md存储什么原则？Skill定义什么流程？哪些部分用确定性脚本？验证器如何兜底？
  - 5. 说明如何实施“生产与质检分离”，质检环节如何独立运作
  - 6. 设计纠偏-沉淀-验证循环，给出具体纠偏场景和对应规则沉淀
  - 7. 设计反馈回流机制，说明如何持续提升审查准确率
  - 回答问题：
  - '- 在法律合规场景，哪些子步骤绝不能被Agent独立决策？为什么？'
  - '- 如果Agent给出“合同无风险”结论但人工复核发现重大漏洞，你的责任归属和处理流程是什么？'
units:
- 'no': 1
  name: 真实任务起点 —— 先有难题，再有工具
  points:
  - '**为什么需要这个概念？**'
  - '- 许多人搭建 Agent 时习惯先挑工具（如 LangChain、AutoGPT），再想用途，导致工具闲置或产出脱离业务'
  - '- 真实任务才是 Agent 存在的理由，任务驱动才能让每一步搭建都有明确目标和验收标准'
  - '- 从任务出发能避免“为技术而技术”的资源浪费，让 Agent 直接对应业务痛点'
  - '**核心定义**'
  - '- 搭建 Agent 的第一步不是选工具、写提示词，而是从真实业务场景中提炼出需要被自动化或辅助完成的具体任务'
  - '- 该任务应具备三个特征：高频、耗时、规则可描述（或部分可描述）'
  - '**关键性质**'
  - '- 业务导向：任务的优先级由业务价值决定，而非技术难度'
  - '- 可拆解性：真实任务必须能向下拆分为子步骤，才能映射到 Agent 的流程设计'
  - '- 可验收性：任务必须能用明确的产出物或指标衡量成功与否'
  - '**典型例子**'
  - '- 某团队发现“每周整理竞品动态并生成简报”耗时 3 小时，将此作为起点搭建 Agent，而非先试用各种 Agent 框架'
  - '- 客服场景中“常见问题自动回复”是一个真实任务，而“用 RAG 构建问答系统”是工具先行'
  - '**边界条件**'
  - '- 并非所有任务都适合 Agent 化：一次性、低频率或完全依赖隐性经验的任务不适合作为起点'
  - '- 任务若完全无法拆解出确定性步骤，则更适合纯人工或后续再自动化'
  sources:
  - paper: 260828《Agent员工军团搭建流程》
    role: origin
  excerpts:
  - 五步法：拆解业务找场景→数据采集搭知识库→Skill固化产出→设计交互搭Agent→反馈回流驱动进化。
  - （第一步为“拆解业务找场景”，强调从真实业务出发而非从工具出发）
'no': 11
