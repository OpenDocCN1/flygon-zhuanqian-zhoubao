paper: 260818《公众号99%自动化》
desc: 该素材以“把公众号做到99%自动化”的实践为线索，提出用 Codex 搭建从数据搜索、RAG 检索、AI 写作、图片生成、排版到自动上传公众号草稿箱的完整自动化工作台，并给出各环节的实现指令与踩坑经验；其核心判断是使用
  AI 最难的不是操作而是知道一件事的完整路径，主张把需求拆成输入、处理步骤、输出、失败重试和验收标准后再交给 AI，并强调 RAG 的价值在于精准检索最相关的一小批证据，进而提出价值观/原话/案例/方法/风格的
  RAG 分层设计。
concepts:
- name: 完整路径意识
  desc: 使用 AI 最难的不是具体操作，而是事先知道一件事从输入到输出的完整路径，路径不明则自动化无法成立。
  is_original: true
  excerpt:
  - 核心判断：使用AI最难的不是操作，而是知道一件事情的完整路径
- name: 需求五要素拆解法
  desc: 把交给 AI 的需求拆成输入、处理步骤、输出、失败重试和验收标准五个部分，使任务可执行、可验证。
  is_original: true
  excerpt:
  - 要把需求拆成输入、处理步骤、输出、失败重试和验收标准再交给AI
- name: RAG 精准检索观
  desc: RAG 的价值不是让 AI 读完所有资料，而是精准检索出最相关的一小批证据作为生成依据。
  is_original: true
  excerpt:
  - RAG的价值不是让AI读完所有资料，而是精准检索最相关的一小批证据
- name: RAG 分层设计
  desc: 将 RAG 资料库按价值观、原话、案例、方法、风格五个层次组织，以匹配写作不同维度的检索需求。
  is_original: true
  excerpt:
  - RAG分层设计：价值观/原话/案例/方法/风格。
- name: 公众号自动化工作台
  desc: 以 Codex 为载体，把数据搜索、RAG 检索、AI 写作、图片生成、排版到自动上传公众号草稿箱串成一条端到端流水线。
  is_original: true
  excerpt:
  - 用Codex搭建从数据搜索、RAG检索、AI写作、图片生成、排版到自动上传公众号草稿箱的完整自动化工作台
methods:
- name: __overview__
  desc: 以 Codex 搭建端到端公众号自动化流水线的整体方法论：先明确完整路径，再按环节拆分需求，逐段实现搜索、检索、写作、配图、排版与上传，并沉淀各环节指令与踩坑经验。
  excerpt:
  - 用Codex搭建从数据搜索、RAG检索、AI写作、图片生成、排版到自动上传公众号草稿箱的完整自动化工作台，并给出每环节实现指令和踩坑经验
- name: 需求五要素拆解法
  desc: 在向 AI 下指令前，将任务显式拆为输入、处理步骤、输出、失败重试和验收标准五部分，降低 AI 执行偏差。
  excerpt:
  - 要把需求拆成输入、处理步骤、输出、失败重试和验收标准再交给AI
- name: RAG 分层检索法
  desc: 按价值观、原话、案例、方法、风格五层组织素材库，检索时按写作需求精准召回最相关的一小批证据，而非全量投喂。
  excerpt:
  - RAG的价值不是让AI读完所有资料，而是精准检索最相关的一小批证据。RAG分层设计：价值观/原话/案例/方法/风格。
- name: 各环节实现指令集
  desc: 针对数据搜索、RAG 检索、AI 写作、图片生成、排版、自动上传草稿箱等每个环节给出对应的实现指令，并附踩坑经验。
  excerpt:
  - 并给出每环节实现指令和踩坑经验
theorems:
- name: 路径先于操作
  desc: 使用 AI 的核心难点在于是否知道一件事的完整路径，而非具体操作技巧；路径清晰是自动化的前提。
  excerpt:
  - 核心判断：使用AI最难的不是操作，而是知道一件事情的完整路径
- name: 需求须结构化交付
  desc: 交给 AI 的需求必须先结构化为输入、处理步骤、输出、失败重试和验收标准，才能稳定获得可验收的结果。
  excerpt:
  - 要把需求拆成输入、处理步骤、输出、失败重试和验收标准再交给AI
- name: RAG 精准优于全量
  desc: RAG 的价值定位不是让 AI 读完所有资料，而是精准检索最相关的一小批证据，从而提升生成质量与可控性。
  excerpt:
  - RAG的价值不是让AI读完所有资料，而是精准检索最相关的一小批证据
- name: RAG 五层分类框架
  desc: RAG 素材库应分为价值观、原话、案例、方法、风格五个层次，以支撑写作中不同维度的检索与调用。
  excerpt:
  - RAG分层设计：价值观/原话/案例/方法/风格。
findings:
- name: 公众号自动化可达 99%
  desc: '[claim] 原文宣称通过 Codex 可将公众号从数据搜索到草稿箱上传的流程做到 99% 自动化，剩余部分需人工把关。'
  excerpt:
  - 《研究了几个月，我终于把公众号做到了99%自动化》
- name: 端到端工作台可落地
  desc: '[evidence] 素材以数据搜索、RAG 检索、AI 写作、图片生成、排版、自动上传草稿箱六个环节的实际搭建为例，展示该方法链条可被逐段实现。'
  excerpt:
  - 用Codex搭建从数据搜索、RAG检索、AI写作、图片生成、排版到自动上传公众号草稿箱的完整自动化工作台
- name: RAG 分层提升检索精准度
  desc: '[evidence] 通过价值观/原话/案例/方法/风格的分层组织，使检索能返回最相关的一小批证据，而非让 AI 读取全部资料。'
  excerpt:
  - RAG的价值不是让AI读完所有资料，而是精准检索最相关的一小批证据。RAG分层设计：价值观/原话/案例/方法/风格。
- name: 踩坑经验构成实践结论
  desc: '[evidence] 各环节的踩坑经验被整理为可复用结论，说明自动化流程的难点集中在路径设计与需求拆解，而非工具操作本身。'
  excerpt:
  - 并给出每环节实现指令和踩坑经验
