paper: 260810《用3份资料跑通Obsidian+Codex个人AI知识库》
desc: 该素材是一份保姆级教程，记录了作者从只会用AI对话框到跑通Obsidian+Codex个人AI知识库的完整过程，提出了以'最小闭环'为核心的个人AI知识库搭建方法论，包含最小目录结构、全套Prompt、日常管理四句话、人机协作流程（Codex给方案→用户确认→Codex执行→自检），并主张Skill与总控Agent应在真实流程稳定重复后再逐步增加，而非一开始就追求完整系统。
concepts:
- name: 个人AI知识库最小闭环
  desc: 指用最少的目录结构和最简的人机协作流程，跑通从资料入库到知识调用的完整链路，而非一步到位搭建完整系统。
  is_original: true
  excerpt:
  - 搭建个人AI知识库不需要一步到位
  - 配合最小目录结构（5个目录以内）比追求完整系统更有效
- name: 人机协作模式（Codex给方案→用户确认→Codex执行→自检）
  desc: 一种将AI作为执行主体、用户作为确认与把关角色的四步协作流程，用于在知识库搭建与日常管理中保持可控性。
  is_original: true
  excerpt:
  - Codex给方案→用户确认→Codex执行→自检
- name: 日常管理四句话
  desc: 用于日常维护个人AI知识库的四条固定指令/话术，降低用户管理成本。
  is_original: true
  excerpt:
  - 日常管理四句话
- name: Skill与总控Agent的渐进式引入
  desc: 主张Skill和总控Agent不应在搭建初期就引入，而应在真实流程稳定重复后再增加。
  is_original: true
  excerpt:
  - Skill和总控Agent应该在真实流程稳定重复后再增加，而非一开始就搭建
