excluded: []
screening_principles: 本次筛选遵循三条原则：一、保留能承载核心命题的素材——观点清晰、有作者独立判断、论证完整且可转化为常青表达的内容优先进入正文（如AI
  Agent员工、内容工厂、同城高客单项目、销售能力、Codex带货链路均为高深度、可操作性强的核心章节素材）。二、降权处理有可用材料但强度不足的素材——案例独特但赛道较窄、或工具教程时效性较强需重写才可进入正文的内容，适合作为案例、附录或手册条目保留（如澳洲打工度假案例、Obsidian同步教程）。三、排除信息陈旧、纯工具资讯堆砌或与主线关联弱的素材（本批无排除项）。整体上以'能否转化为书稿中有稳定判断价值的章节、案例或手册条目'为最终筛选尺度。
