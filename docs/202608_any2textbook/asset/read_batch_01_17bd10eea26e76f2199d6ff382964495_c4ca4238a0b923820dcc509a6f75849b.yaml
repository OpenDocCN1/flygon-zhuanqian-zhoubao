  key_judgment: 知识库同步不只是同步笔记文件，还包括AI的全局配置和记忆文件——这样两台电脑上是同一个AI而非两个。所有配置可以通过交给AI来完成操作，0使用门槛。整套方案免费、无容量限制、文件不经过第三方服务器。
