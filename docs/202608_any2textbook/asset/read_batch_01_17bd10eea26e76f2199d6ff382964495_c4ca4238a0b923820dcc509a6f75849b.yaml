  possible_shape: handbook
  risks:
  - 时效性
  - 口语化
  screening_conclusion: retain
  reason: 实操性强、可直接使用的配置指南，'同步AI记忆让两台电脑是同一个AI'的判断有价值。但工具版本和操作步骤有时效性，更适合作为手册条目而非书籍章节。与Agent员工篇的知识库部分有呼应。
