  key_judgment: 稳定做出一个AI Agent员工的关键不是写一条完美提示词，而是让它经历'真实执行、人工纠偏、规则沉淀、重新验证'的过程。AGENTS.md存原则、Skill存流程、脚本负责确定性、验证器负责兜底，语义判断交给AI，不能硬编码。
