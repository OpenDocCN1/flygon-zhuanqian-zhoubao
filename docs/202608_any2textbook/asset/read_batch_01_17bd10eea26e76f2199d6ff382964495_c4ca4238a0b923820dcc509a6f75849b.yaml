  title: Obsidian知识库多设备同步教程丨完全免费，一人公司必备
  summary: 作者叁斤分享了一套完全免费的多设备知识库同步和远程操控方案，用Syncthing同步知识库和AI记忆文件，用Tailscale+屏幕共享或UU远程实现远程操控，核心价值是让一人公司在任何地点都能用同一套知识库和同一个AI干活。
