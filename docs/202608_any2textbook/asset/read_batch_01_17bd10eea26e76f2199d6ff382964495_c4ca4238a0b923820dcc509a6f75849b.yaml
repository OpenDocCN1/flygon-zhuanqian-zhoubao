- file_path: C:/Users/Administrator/shengcai-zhoubao-202608/260803副业SC精华《AI时代到底怎么赚钱，先去做离钱最近的事》.md
  title: AI时代到底怎么赚钱，先去做离钱最近的事
  summary: 作者通过31场线下活动观察，指出AI降低了产品制作门槛，但大多数人仍然卡在不敢向具体的人开口销售这一步，主张先完成现金投票而非追求产品完美。
  core_question: AI时代工具变快了，为什么大多数人还是赚不到钱？离钱最近的事到底是什么？
  key_judgment: AI让产品变快了，但没有让成交自动发生。真正卡住的位置从来不是产品和工具，而是不敢把一个东西清楚地介绍给一个具体的人，然后问他愿不愿意付钱。先做离钱最近的事——找到可能需要产品的人，讲清楚，邀请付费。
  depth: medium
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 口语化
  - 重复
  screening_conclusion: retain
  reason: 观点清晰有实操路径（通讯录100人、现金投票、7天行动计划），对'AI时代真正壁垒是销售能力'的判断有独立思考价值，适合作为商业闭环/销售启动章节的核心素材。但内容有较多口语化重复，需编辑精简。
- file_path: C:/Users/Administrator/shengcai-zhoubao-202608/260803副业SC精华《如何把你的业务流程做成-AI-Agent-员工》.md
  title: 如何把你的业务流程做成 AI Agent 员工
  summary: 以批量抓取B站字幕并录入Obsidian知识库为案例，系统讲解Agent、Skill、知识库、CLI/MCP的概念，以及用'Agent制作八步法'把日常业务流程固化为可复用AI
