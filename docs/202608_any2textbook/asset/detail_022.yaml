life_analogy:
- 将评估AI回答想象成**在采访一位健谈但记忆力有限的专家**：
- '- **专家的话（AI回答）** = 一份看似流畅但可能出错的口述报告'
- '- **Fact-Check链条** = 你手边的采访核对清单，逐条查证专家提供的每一个数字和引语'
- '- **风格变化论** = 专家今天说话更简洁了，但不代表他学识变浅——只是表达方式变了，你换个问法，他仍能给出同样详尽的解释'
- '- **基准差异论** = 你期望专家按“文学赏析”来谈诗，而他习惯按“事实考证”来谈诗——不是他说错了，是你的评价标准和它的内在逻辑没有对齐'
- 就像经验丰富的记者从不轻信单一信源，我们在使用AI时，也应先核验事实，再判断其风格，最后反思自己的预期基准是否合理。
summary:
- concept: AI幻觉/流畅性误导
  desc: AI生成内容看似可信但可能出错，是引入核查流程的直接原因
- concept: Fact-Check链条
  desc: 从AI回答出发，通过回溯、核对、交叉验证形成闭环，判断回答是否靠谱
- concept: 逐层递进约束
  desc: 链条的每个环节受前一环节约束，从单一回答扩展到完整证据链
- concept: 信前必查
  desc: 将验证责任从AI转移到使用者，降低盲信风险
- concept: 风格变化论
  desc: 回答风格（详略、语气）变化 ≠ 底层智力或知识退化，需分开评估
- concept: 风格与能力解耦
  desc: 风格是表层表达形式，能力是深层处理效能，两者为独立维度
- concept: 基准差异论
  desc: 模型内部设定的自我认知与用户外部的期待标准存在偏差，导致评判不一致
- concept: 双重参照系
  desc: 评估AI回答时存在模型内部校准与用户外部期待两个参考点
exercises:
- 'no': 1
  title: 构建你自己的Fact-Check链条
  contents:
  - 选择一个事实型问题（例如“2020年东京奥运会中国代表团获得多少枚金牌”），然后向ChatGPT提问并获取回答。
  - 1. 提取回答中的关键数字、时间、名称等事实要素
  - 2. 选择至少两个独立来源（如官方网站、权威新闻媒体）逐一核对上述要素
  - 3. 记录每个要素的核对结果：一致/不一致/来源缺失
  - 4. 根据核对结果，判断原始回答是否通过链条验证，并写出结论
  - 回答问题：
  - '- 如果两个来源数据不一致，你的链条会给出什么结论？'
  - '- 在时间有限的情况下，你会如何精简链条但仍保证基本可靠性？'
- 'no': 2
  title: 分离“风格”与“能力”的对照实验
  contents:
  - 选取一个提示词（如“解释光合作用”），用两套不同的风格要求向ChatGPT提问：
  - '  版本A：请用一句话简要回答'
  - '  版本B：请用详细步骤、举两个例子并展开说明'
  - 1. 对比两个回答的篇幅、结构、语气差异
  - 2. 针对同一知识点（如柠檬酸循环的产物），分别对两个回答进行事实性检查
  - 3. 判断：两个回答在事实准确性上是否有差异？
  - 4. 基于结果，分析“风格变化”是否被误判为“能力退化”的可能性
  - 回答问题：
  - '- 如果你只看到简短版本，你会得出什么结论？如果看到完整版本呢？'
  - '- 这个实验如何帮助你理解风格变化论的核心主张？'
- 'no': 3
  title: 识别“基准差异”的场景模拟
  contents:
  - 设计两种测试任务来考察ChatGPT的回答：
  - '  任务一（文学性）：请AI以诗歌形式描述“秋天”'
  - '  任务二（事实性）：请AI回答“长江全长多少公里”'
  - 1. 分别向AI提问并记录回答
  - 2. 用自我设定的标准（如文学创意、措辞优美度）评价任务一，用客观数据标准评价任务二
  - 3. 交换评价基准：尝试用事实标准评价任务一，用创意标准评价任务二
  - 4. 分析你在两种基准下的评判差异，找出“不合格”结论的来源
  - 回答问题：
  - '- 为什么同一个任务，在不同基准下结论可能完全相反？'
  - '- 在日常使用中，你如何向AI明确表达你的基准以减少这种偏差？'
units:
- 'no': 1
  name: Fact-Check链条 —— 给AI回答装上“验钞机”
  points:
  - '**为什么需要这个概念？**'
  - '- AI生成内容看似流畅可信，但可能包含事实性错误或幻觉，用户难以直接分辨'
  - '- 仅凭直觉判断AI回答对错，容易“自信地犯错”'
  - '- 需要一个系统化的核查流程，将主观感受转化为可操作的验证步骤'
  - '**核心定义**'
  - '- Fact-Check链条是一种提问与验证的闭环方法，从AI的回答出发，通过回溯关键事实、核对多方来源、交叉验证等步骤，来判断AI的输出是否靠谱'
  - '**关键性质**'
  - '- 逐层递进：从单一回答逐步扩展到证据链，每个环节都受前一环节约束'
  - '- 可操作性强：每一步（如“查出处”“找反例”）都是读者可以直接执行的行动'
  - '- 降低盲信风险：强调“信前必查”，将验证责任从AI转移到使用者'
  - '**典型例子**'
  - '- 问ChatGPT“某市人口是多少”后，不直接采信，而是打开统计局官网或权威新闻对照数字——若来源一致，则回答通过Fact-Check链条；若来源缺失或相互矛盾，则回答需存疑'
  - '**边界条件**'
  - '- 适用于事实型、数据型问题；对主观观点或纯建议类问题（如“如何选择职业”）不完全适用'
  - '- 链条的深度受时间成本限制：对非关键决策，可简化至一两次验证'
  - '- 无法覆盖AI的多轮对话偏见，只针对单次回答的事实核验'
  - '...'
  sources:
  - paper: 260824《AI变差了吗？用Fact-Check来回答》
    role: method
  excerpts:
  - 用Fact-Check链条识别AI的回答是否靠谱。
- 'no': 2
  name: 风格变化论 —— 变的是“语气”还是“智力”？
  points:
  - '**为什么需要这个概念？**'
  - '- 用户常把AI回答变短、变啰嗦或措辞改变，误判为“模型变笨了”'
  - '- 风格（语气、篇幅、结构）与能力（知识、推理）是两个维度的变化，需分开评估'
  - '**核心定义**'
  - '- 风格变化论认为，ChatGPT等模型的回答风格（如详略、正式度、组织方式）会随迭代或提示词而改变，但这并不等于其底层智力或知识储备的退化'
  - '**关键性质**'
  - '- 风格与能力解耦：风格是表层的表达形式，能力是深层的处理效能'
  - '- 主观感知偏差：风格变化更容易被用户感知，因而强化了“变笨”的错觉'
  - '**典型例子**'
  - '- 用户发现新版ChatGPT回答更简短，觉得“它刚出来时更聪明”；但实际上改用详细提示词“请展开三步论证并给例子”后，回答质量与旧版持平'
  - '**边界条件**'
  - '- 适用于模型迭代间的比较：仅当确认知识错误或逻辑断裂时，才能判定能力下降'
  - '- 不适用于跨模型对比：两个模型原本风格就不同，无法用风格差异直接推断能力差异'
  - '...'
  sources:
  - paper: 260824《AI变差了吗？用Fact-Check来回答》
    role: definition
  excerpts:
  - ChatGPT的回答风格变了而非变笨。
- 'no': 3
  name: 基准差异论 —— 用户心里的“及格线”各不相同
  points:
  - '**为什么需要这个概念？**'
  - '- 两人讨论“AI是否变好”时，可能因使用场景、预期标准不同而得出相反结论'
  - '- 对AI的评判总是主观的，需要厘清“谁的基准”在起作用'
  - '**核心定义**'
  - '- 基准差异论指模型的自我认知（即它内部设定的扮演角色与回复准则）与用户心中默认的衡量标准（如精确性、创意性、简洁性）存在偏差，导致双方对同一回答的评价不一致'
  - '**关键性质**'
  - '- 双重参照系：一个参考点是模型内部的校准，另一个是用户外部的期待'
  - '- 评估分歧的根源：差异越大，用户越可能认为模型输出“不合格”或“变烂”'
  - '**典型例子**'
  - '- 用户用“写诗”类问题测试AI，默认标准是文学性，而模型倾向于事实性回答，于是用户觉得“AI退步”；但在事实问答测试中，模型表现优于预期'
  - '**边界条件**'
  - '- 主要适用于开放式、主观性任务；对数学计算等有客观标准的问题，差异影响较小'
  - '- 当用户明确给出基准（如“必须引用数据”），差异可被压缩，但依然存在残余偏差'
  - '- 不适用于评估模型安全或伦理问题，这类问题有独立的标准体系'
  - '...'
  sources:
  - paper: 260824《AI变差了吗？用Fact-Check来回答》
    role: definition
  excerpts:
  - 模型自我认知与用户基准的差异。
