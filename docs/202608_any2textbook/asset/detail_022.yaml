learning_targets:
- 理解为什么需要一套系统化的流程来核查AI的事实性回答
- 掌握Fact-Check链条的完整步骤与操作逻辑
- 区分AI回答的“风格变化”与“能力退化”两个维度
- 识别模型自我认知与用户基准之间的差异，避免主观误判
- 能针对事实型问题设计简易的验证路径，应用于日常AI使用
