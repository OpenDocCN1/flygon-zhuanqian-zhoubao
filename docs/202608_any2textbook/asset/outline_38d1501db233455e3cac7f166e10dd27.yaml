- 'no': 1
  name: 认知篇 —— 让AI从“聊天”到“干活”
  desc: 本章建立对AI Agent员工的基本认知：理解知识库、Skill、Agent三层递进关系，明确人机分工的根本原则，完成从“用对话框”到“搭工作台”的思维转变。
  nodes:
  - 'no': 1
    name: AI三层递进：知识库→Skill→Agent
    desc: 用“认识你→学会干活→成为员工”的递进类比，建立AI能力演化的整体框架
    role: motivation
    src:
    - paper: 260803《AI Agent员工》
  - 'no': 2
    name: 路径先于操作
    desc: 使用AI最难的不是操作，而是知道一件事情的完整路径；理解完整路径意识为何是自动化的前提
    role: motivation
    src:
    - paper: 260818《公众号99%自动化》
  - 'no': 3
    name: 人机分工原则：人做选择题，AI做执行
    desc: 明确AI负责重复的采集、分析、执行，人负责选方向、定产品和最终验收
    role: definition
    src:
    - paper: 260817《小红书AI工作台做虚拟产品》
  - 'no': 4
    name: AI的目的是提效而非用上AI
    desc: 辨析“用上AI”与“用AI提效”的本质区别，防止为了工具而工具
    role: motivation
    src:
    - paper: 260828《Agent员工军团搭建流程》
  - 'no': 5
    name: 知识归属论
    desc: 收藏只是原料，只有变成观点、作品、方案并解决具体问题，知识才真正属于你
    role: motivation
    src:
    - paper: 260804《用Codex把IMA、Obsidian、飞书串成内容流转系统》
