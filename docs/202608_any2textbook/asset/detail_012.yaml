learning_targets:
- 理解需求五要素拆解为何能让 AI 任务变得可执行、可验收
- 掌握完整路径意识——先看见整条链路再动手的原则
- 理解 RAG 精准检索观区别于全量读入的价值
- 掌握手动先行原则并将其作为自动化的前置条件
- 理解目标端回读验收为什么必须以最终消费位置为判据
- 能设计一套端到端工作台并识别环节间的衔接点
- 掌握六步流水线的固定顺序及其数据驱动特性
- 理解数据驱动选需求相比人工刷榜的优势与适用边界
- 学会用成果案例数据评估自动化工作台的真实效率
