learning_targets:
- 理解“给孩子看心法”的本质：把复杂度翻译成大白话，而非降低内容深度
- 掌握爆款范式可拆解的方法，能将爆款文章逆向拆解为可复制的结构要素
- 学会撰写三体式文章结构：开头共鸣场景→中间干货递进→结束行动指令
- 掌握标题抓手法：用收益前置、情绪激活的方式制作抓人但不标题党的标题
- 能运用综合技巧写出一篇直接收割业务线索的商业文章
concept_map:
- 内容杠杆方法论
- ├── 给孩子看心法
- │   ├── 本质：翻译而非简化 —— P001
- │   ├── 优先顺序：读者能听懂 > 作者想表达 —— P001
- │   └── 普适性：技术文、营销文、教材均适用 —— P001
- ├── 爆款范式可拆解
- │   ├── 可复制性：配方可复制到同类主题 —— P002
- │   ├── 结构性：框架+情绪节奏+信息密度 —— P002
- │   └── 可迭代性：复盘拆解，微调优化 —— P002
- ├── 三体式文章结构
- │   ├── 开头：共鸣场景（情绪钩子） —— P003
- │   ├── 中间：干货递进（价值续航） —— P003
- │   └── 结尾：行动指令（转化发射台） —— P003
- ├── 标题抓手法
- │   ├── 收益前置：让读者感知“读了有什么好处” —— P004
- │   ├── 情绪激活：好奇、惊讶、焦虑、共鸣 —— P004
- │   └── 承诺克制：抓人但不标题党 —— P004
- └── 一篇文章十条线索
- ├── 强转化导向：为“下一步连接”服务 —— P005
- ├── 线索密集：多处埋设响应入口 —— P005
- └── 可验证性：用线索数量量化内容生产力 —— P005
life_analogy:
- 想象写文章就像**给邻居家小孩讲一个复杂的科学道理**：
- '- **孩子心法** = 不用术语，用“水往低处流”讲重力，而不是画受力分析图'
- '- **爆款配方** = 你想讲的那道拿手菜——每次做都成功，因为记住了什么时候放盐、什么时候大火'
- '- **开头共鸣** = 开口第一句“你是不是也遇到这个问题了？”——先让孩子觉得“对对对，我也是”'
- '- **中间递进** = 一步一步来，先讲简单例子，再慢慢加深，孩子才跟得上'
- '- **结尾指令** = 讲完问“你现在能自己画一遍了吗？”——给孩子一个明确的下一步动作'
- '- **标题抓手** = 你在门口喊的那句话——“快来看，这有个好玩的东西！”——决定了孩子要不要走进来'
- 就像好老师不是把知识灌给孩子，而是设一个孩子愿意主动走进来、跟得上的课堂，好文章也是给读者设计一条从“好奇”到“行动”的路径。
summary:
- concept: 给孩子看心法
  desc: 把复杂度翻译成大白话而非降低深度，以读者为中心的表达准则
- concept: 爆款范式可拆解
  desc: 爆款背后有可辨认、可复制、可组合的结构配方，而非玄学
- concept: 三体式文章结构
  desc: 开头共鸣→中间递进→结尾指令，一条完整的“内容骨链”
- concept: 标题抓手法
  desc: 收益前置+情绪激活，给文章装一扇“进人的门”，但承诺要克制
- concept: 一篇文章十条线索
  desc: 内容不止传播观点，还能在多个节点直接收割业务线索，可量化验证
exercises:
- 'no': 1
  title: 诊断你的上一篇内容
  contents:
  - 找一篇你最近写过的文章或发过的推文，按五步逐一诊断：
  - 1. 如果读者是一个完全不懂这个主题的孩子，他能看懂几成？哪里会卡住？
  - 2. 这篇文章是否可以逆向拆解出配方？按结构、节奏、信息密度逐项标记。
  - 3. 开头第一句能否制造“这说的就是我”的共鸣？如果不能，改写一版。
  - 4. 标题是否做到了收益前置？读者读完标题能否说出“读了对我有什么用”？
  - 5. 文中有几个可响应的转化入口？是否达到了至少三个？
  - 回答以下问题：
  - '- 你的内容卡在哪个环节？'
  - '- 用“给孩子看”的标准重写开头，语气和措辞上发生了什么变化？'
- 'no': 2
  title: 逆向拆解一篇爆款文
  contents:
  - 找一篇你所在领域的爆款文章（阅读量、转发明星标的），把它拆成配方：
  - 1. 标题用了什么抓手法？收益前置还是情绪激活？承诺了什么？正文兑现了吗？
  - 2. 开头怎么制造共鸣？是否直接点名了目标读者的痛点或场景？
  - 3. 中间用了几个论点/步骤？信息密度是如何递进的？每段之间有没有“继续读下去”的钩子？
  - 4. 结尾给出了什么行动指令？指令是具体的、可执行的，还是“欢迎关注”这类空话？
  - 5. 全文埋了几个转化入口？分别在什么位置？
  - 回答以下问题：
  - '- 拆解出的配方中，哪一条最容易迁移到你的业务？哪一条最困难？'
  - '- 如果让你按这个配方复刻一篇，你会做哪些本地化调整？'
- 'no': 3
  title: 用三体式写一篇业务转化文
  contents:
  - 选取你业务中的一个真实客户痛点，按三体式结构写一篇600-800字的文章：
  - 1. 开头（100-150字）：写一个场景，让目标读者觉得“这说的就是我”。用第二人称“你”直接指认痛点。
  - 2. 中间（400-500字）：给出三步核心方法。每步之间要有递进——从简单到进阶，从问题到方案。
  - 3. 结尾（100-150字）：给一个明确、具体的行动指令，比如“扫描文末二维码，回复‘诊断’，领取你的专属优化方案”。
  - 4. 在文章中间（非仅文末）至少埋设一个第二转化入口。
  - 回答以下问题：
  - '- 你的行动指令是否足够小、足够具体？如果读者读完后犹豫，卡点可能在哪里？'
  - '- 文章正文能否兑现你标题的承诺？如果用户点进来发现名不副实，口碑风险在哪里？'
units:
- 'no': 1
  name: 给孩子看心法 —— 把复杂度翻译成“大白话”
  points:
  - '**为什么需要这个概念？**'
  - '- 内容生产者面临的核心难题：自己懂，不代表读者能懂；专业术语堆砌往往导致信息传达失败'
  - '- 内容虽然是面向成人的，但成人阅读时的注意力与理解力常常与儿童类似——对冗长、抽象的表达缺乏耐心'
  - '- 传统写作只考虑“作者想说什么”，忽略了“读者能接收什么”，使得内容杠杆无从发挥'
  - '**核心定义**'
  - '- 给自己立一条心法：写内容前假设读者是一个孩子，用最直白、生动的语言把复杂概念讲清楚，而非降低内容深度'
  - '**关键性质**'
  - '- 强制优先：把“读者能否听懂”排在“作者想表达什么”之前'
  - '- 翻译而非简化：不删减信息量，而是将抽象逻辑拆解为形象比喻与生活化场景'
  - '- 普适性：适用于技术文、营销文、教材等多种内容形态，本质是“以读者为中心”的写作准则'
  - '**典型例子**'
  - '- 讲“复利”时不说“指数增长”，而说‘钱生钱，第二年生的钱也去生钱’'
  - '- 讲“市场需求”时不说“供需曲线”，而说‘大家排队要买的东西，就是市场’'
  - '**边界条件**'
  - '- 不适用于必须使用精确法律/财务术语的场景（如合同条款、审计报告）——此时“给孩子看”会让表述失真'
  - '- 心法不等于童稚化：给孩子看的不是内容降智，而是表达降门槛；过度口语化可能削弱专业信任感'
  sources:
  - paper: 260826《一篇文章收割十条业务线索》
    role: origin
  excerpts:
  - 做内容先给自己立一条心法：把内容给孩子看。
- 'no': 2
  name: 爆款范式可拆解 —— 爆款不是运气，是“配方”
  points:
  - '**为什么需要这个概念？**'
  - '- 多数人认为爆款是灵感、运气或天赋的偶然结果，导致内容生产不可复制'
  - '- 若不能将爆款拆解为可操作的步骤，做内容就像开盲盒，无法形成稳定的业务杠杆'
  - '- 需要一种确定性的方法论，让爆款从“碰巧”变成“可设计”'
  - '**核心定义**'
  - '- 爆款是有具体配方可拆的：每一篇爆款背后都有可辨认、可复制、可组合的结构要素，而非玄学'
  - '**关键性质**'
  - '- 可复制性：配方一旦拆出，可用于同类主题的持续产出'
  - '- 结构性：配方包含框架（开头-中间-结尾）、情绪节奏、信息密度等多个维度'
  - '- 可迭代性：通过复盘拆解，配方可以不断微调优化'
  - '**典型例子**'
  - '- 拆解某爆款文章后发现其配方=痛点共鸣（开头）+分步方法论（中间）+行动指令（结尾），照此复刻后同样获得高转化'
  - '- 同类短视频爆款均遵循“3秒悬念+15秒干货+5秒引导”的时段配方'
  - '**边界条件**'
  - '- 配方拆解的是“高概率”，不是“必然性”；平台算法、发布时机、受众情绪仍会影响结果'
  - '- 过度公式化可能导致内容同质化，削弱差异化竞争力'
  sources:
  - paper: 260826《一篇文章收割十条业务线索》
    role: origin
  excerpts:
  - 爆款是有具体配方可拆的。
- 'no': 3
  name: 三体式文章结构 —— 共鸣→递进→指令，一条“内容骨链”
  points:
  - '**为什么需要这个概念？**'
  - '- 读者注意力极易分散，若文章开头不能击中情绪、中间不能持续供给价值、结尾不给出口，就沦为“自嗨文”'
  - '- 单凭写作技巧（如辞藻、铺垫）无法完成转化，需要一套从头到尾的节奏骨架'
  - '- 许多内容写完了却没人行动，原因是读者“觉得好”但不知道“下一步做什么”'
  - '**核心定义**'
  - '- 三体式文章结构：开头共鸣场景（让读者觉得“这说的就是我”）→中间干货递进（层层展开方法/观点）→结束给出明确行动指令（让读者知道具体该做什么）'
  - '**关键性质**'
  - '- 头尾呼应：开头制造情绪钩子，尾部用行动指令承接情绪，形成闭环'
  - '- 递进逻辑：中间部分信息难度与价值逐步提升，保持阅读续航'
  - '- 导向明确：结尾不是总结，而是“下一步动作”的发射台'
  - '**典型例子**'
  - '- 开头写‘你是不是天天加班却不出业绩？’→中间给‘时间管理三步法’→结尾写‘今晚就按第一步列三件事，明天告诉我结果’'
  - '- 课程推文：开头讲学习焦虑→中间给学习框架→结尾引导‘扫码领取配套模板’'
  - '**边界条件**'
  - '- 不适合纯学术论文或白皮书——这类文体要求克制表达，不宜强加行动指令'
  - '- 指令必须‘做得到’：行动指令若太大（如‘重构你的商业模式’）反而让读者不知所措'
  sources:
  - paper: 260826《一篇文章收割十条业务线索》
    role: origin
  excerpts:
  - 开头共鸣场景→中间干货递进→结束给出明确行动指令。
- 'no': 4
  name: 标题抓手法 —— 给文章装一扇“进人的门”
  points:
  - '**为什么需要这个概念？**'
  - '- 读者决定是否点开一篇文章的核心判断发生在1秒内，正文再精彩，标题不抓人就没有被阅读的机会'
  - '- 标题如果只是概括主题，无法在信息流中制造差异感，让内容泯然于众'
  - '- 标题是内容杠杆的第一级支点——没有入口，后续一切转化归于零'
  - '**核心定义**'
  - '- 标题抓手法：将全文最大的利益点、最尖锐的冲突或最不可置信的结果浓缩进标题，使其成为读者“入场”的抓手'
  - '**关键性质**'
  - '- 收益前置：让读者瞬间感知到“读了有什么好处”'
  - '- 情绪激活：标题本身带有好奇、惊讶、焦虑或共鸣的触发器'
  - '- 承诺克制：抓人但不标题党——承诺的内容正文必须兑现，否则信任崩坏'
  - '**典型例子**'
  - '- 《一篇文章收割十条业务线索》：用具体数字（十条）制造具体承诺，比《教你做内容获客》更可感'
  - '- 《为什么你写的方案总被否？三招改法》：直接点名读者的失败场景并给出解法数量'
  - '**边界条件**'
  - '- 标题抓人≠低俗噱头：过度承诺或滥用惊叹会让品牌失去信誉，甚至被平台限流'
  - '- 面向垂直专业受众时，过度“标题党”反而显得不专业；此时抓手法应偏向精准而非猛烈'
  sources:
  - paper: 260826《一篇文章收割十条业务线索》
    role: origin
  excerpts:
  - 好标题是给文章留出带人入场的抓手。
- 'no': 5
  name: 一篇文章十条线索 —— 把内容做成“业务捕手”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统内容写作的终点是“读完”，但业务导向的内容写作的终点是“转化”'
  - '- 一篇内容如果只带来阅读量而不带来可联系的线索，就无法体现商业杠杆价值'
  - '- 需要一种可衡量的实验假设：内容不只是传播品，而是直接获客的工具'
  - '**核心定义**'
  - '- 一篇文章十条线索：通过融合前述心法、结构与标题手法，单篇内容不但传播观点，还能直接为业务带来至少十条可供跟进的高质量线索（如咨询、试用、添加微信）'
  - '**关键性质**'
  - '- 强转化导向：文章从选题到结构都为“下一步连接”服务，而非仅追求阅读指标'
  - '- 线索密集：文章内部埋设多个可响应的入口（如二维码、引导语、表单链接），而非仅在文末留一个联系方式'
  - '- 可验证性：通过线索数量直接量化内容的生产力，使内容从成本中心转向利润中心'
  - '**典型例子**'
  - '- 一篇B2B服务商的行业痛点文章，在三个段落各放置一次“领取诊断工具”入口，最终带来12条客户咨询'
  - '- 一篇招聘文按三体式结构写，结尾附“直接投递/内推”动作，收到18份合格简历'
  - '**边界条件**'
  - '- 通常适用于“服务/产品可用线索承接”的业务形态；若产品尚无交付能力，大量线索涌入反而造成口碑反噬'
  - '- ‘十条’是数量刻度而非绝对标准：线索质量比数量更重要，低意向线索过多会浪费销售精力'
  sources:
  - paper: 260826《一篇文章收割十条业务线索》
    role: origin
  excerpts:
  - 一篇文章收割十条业务线索。
