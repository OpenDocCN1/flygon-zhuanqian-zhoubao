learning_targets:
- 理解引流端三足法（人设、流量、交付）作为稳定三角的核心逻辑与价值
- 掌握分层承接机制的设计原则及其在高客单业务中的应用路径
- 理解转介绍闭环的运作原理，能设计简单的转介绍激励流程
- 能通过“陆陆续续成交”案例反推并复现可落地的获客-成交闭环方法论
- 能区分三足法、分层承接、转介绍闭环在完整线索承接链路中的不同作用与衔接关系
concept_map:
- 线索承接篇 —— 从获客到成交的完整闭环
- ├── 三足法：人设+流量+交付
- │   ├── 人设（信任）          —— P001
- │   ├── 流量（触达）          —— P001
- │   ├── 交付（复购/转介绍）   —— P001
- │   └── 稳定三角（联动、全局） —— P001, P004
- ├── 分层承接机制
- │   ├── 分层依据（意愿度/预算/信任度） —— P002
- │   ├── 承接方式（免费内容/低价体验/正式方案） —— P002
- │   ├── 渐进性（由轻到重）    —— P002
- │   └── 升层条件（转化目标）  —— P002
- ├── 转介绍闭环
- │   ├── 成交后动作（回访/福利/激励） —— P003
- │   ├── 信任传递（口碑>广告）  —— P003
- │   └── 循环机制（推荐→新成交） —— P003
- └── 陆陆续续成交案例
- '    ├── 持续性（日均出单，非爆单）  —— P004'
- '    ├── 可复制性（拆解行动步骤）    —— P004'
- '    ├── Agent员工自动化（引流/承接/回访） —— P004, P005'
- '    └── 结果验证（数据可核验）      —— P004, P005'
life_analogy:
- 想象一套完整的业务获客流程是一家**经营多年的老字号餐厅**：
- '- **三足法** = 餐厅的三大支柱：招牌菜（人设）、门口客流量（流量）、上菜品质与服务（交付），三者缺一不可才能稳坐街头'
- '- **分层承接** = 菜单分层：免费试吃小样 → 招牌菜 → 私房定制套餐，让食客一步步从尝试到深爱'
- '- **转介绍闭环** = 老食客带新食客：一道好菜+一张‘带友赠券’，让口碑像传菜一样自然流转'
- '- **陆陆续续成交** = 每天都有稳定的翻台率，而不是偶尔爆满、平日冷清'
- 就像餐厅靠稳定的三角结构和阶梯式菜单，而不是靠一次网红打卡就关门歇业。
summary:
- concept: 三足法（人设+流量+交付）
  desc: 引流端的稳定三角，缺一不可，三者联动支撑业务底盘
- concept: 人设
  desc: 建立客户信任，是转化的前提
- concept: 流量
  desc: 让客户找到你，是触达的保障
- concept: 交付
  desc: 保证复购与口碑，反哺人设与流量
- concept: 分层承接机制
  desc: 按意愿度/预算分层，设计由轻到重的承接路径，为高客单留出缓冲带
- concept: 转介绍闭环
  desc: 成交后通过机制引导老客户推荐新客，形成低成本获客循环
- concept: 陆陆续续成交案例
  desc: 用真实数据验证三足法与闭环打法的有效性，呈现持续出单的经营状态
- concept: Agent员工
  desc: 自动化执行引流、承接、回访流程，提升团队人效，助力持续成交
exercises:
- 'no': 1
  title: 绘制你的三足法框架
  contents:
  - 以你熟悉的一家本地高客单业务（如装修、私教、医美）为例：
  - 1. 分别列出人设、流量、交付三条腿下的具体动作（每个至少2条）
  - 2. 分析三条腿之间的联动关系：人设提升如何带来流量转化？交付满意如何反哺人设？
  - 3. 指出该业务目前最薄弱的一条腿，并给出一个可落地的强化动作
  - 4. 判断：如果砍掉其中一条腿，业务会发生什么连锁反应？
- 'no': 2
  title: 设计一条分层承接路径
  contents:
  - 假设你的高客单服务定价为 20,000 元，设计一条从陌生流量到成交的 4 层承接路径：
  - 1. 为每一层设置：承接方式、定价、目标用户特征
  - 2. 明确每一层到下一层的“升层”触发条件（什么信号表示用户已准备好进入下一层）
  - 3. 判断这条路径是否过于冗长？若需要合并某一层，你会合并哪两层？为什么？
  - 4. 写出若用户在第 2 层停留超过 30 天，你作为运营者的应对策略
- 'no': 3
  title: 构建一个转介绍闭环机制
  contents:
  - 为一个已成交的客户群体（如美甲店会员）设计一个转介绍闭环：
  - 1. 设定转介绍的触发时点（服务完成后？会员续费前？）并说明理由
  - 2. 设计2种转介绍激励方式：一种物质激励，一种精神激励
  - 3. 画出闭环流程图：老客推荐 → 新客到店 → 成交 → 老客再次被激励 → 继续推荐
  - 4. 思考：如果交付质量不够过硬，这个闭环会发生什么？如何通过前端交付保证闭环不破裂？
- 'no': 4
  title: 拆解一单“陆陆续续成交”的真实案例
  contents:
  - 选取你身边一个持续稳定出单的小微业务（或虚构一家代理商的 Agent 自动化成交公司）：
  - 1. 用三足法框架分别描述其人设、流量、交付三要素
  - 2. 列出其分层承接的具体阶梯及每一层的转化数据（如触达 → 咨询 → 成交）
  - 3. 识别该业务中哪些动作属于转介绍闭环的组成部分
  - 4. 评估其“陆陆续续”出单的关键因子是什么（复购？转介绍？季节性？）
  - 5. 给出一个你判断的、可能导致其出单中断的潜在风险因素，并提出对冲方案
units:
- 'no': 1
  name: 三足法 —— 让获客拥有“稳定三角”
  points:
  - '**为什么需要这个概念？**'
  - '- 引流获客时，单靠一个环节容易失衡，比如只有流量没有交付口碑，或者有人设但没流量。'
  - '- 需要一种结构化的思维方式，保证引流端的稳定性和可持续性。'
  - '- 传统做法是零散投放，缺乏整体框架，容易顾此失彼。'
  - '**核心定义**'
  - '- 引流端由三条腿构成：人设、流量、交付。三条腿缺一不可，形成稳定三角。'
  - '- 人设：让客户信任你；流量：让客户找到你；交付：让客户持续复购或转介绍。'
  - '**关键性质**'
  - '- 稳定性：三角结构在几何上最稳定，比喻业务底盘不容易塌。'
  - '- 联动性：三条腿互相支撑，人设强能提升流量转化，交付好能反哺人设。'
  - '- 全局观：它不是单点策略，而是系统层面的架构设计。'
  - '**典型例子**'
  - '- 同城高客单生意中，老板打造“专家人设”，通过本地内容获取流量，再用高客单价服务完成交付，三者形成闭环。'
  - '- 如果只做流量而人设模糊，客户来了也难以成交；如果只有人设没有流量，则无法触达新客户。'
  - '**边界条件**'
  - '- 三足法适用于需要长期经营的领域，尤其是高客单价、决策周期长的行业。'
  - '- 三条腿并非平均用力，在不同阶段可以有所侧重，但结构上不能缺失任何一条。'
  sources:
  - paper: 260802《让同城高客单陆陆续续成交起来》
    role: origin
  excerpts:
  - 引流端三条腿：人设、流量、交付构成稳定三角。
- 'no': 2
  name: 分层承接机制 —— 为高客单留出“缓冲带”
  points:
  - '**为什么需要这个概念？**'
  - '- 高客单客户决策慢、顾虑多，如果一上来就推高价产品，容易把客户吓跑。'
  - '- 需要一套阶梯式的承接路径，让客户从小额尝试逐步建立信任。'
  - '- 低客单和低价引流品如果没有分层承接，转化效率会很低。'
  - '**核心定义**'
  - '- 将客户按意愿度、预算或信任度分层，为每一层设计对应的承接方式（如免费内容、低价体验、正式方案）。'
  - '- 目的是为高客单产品留出足够的铺垫和缓冲空间。'
  - '**关键性质**'
  - '- 渐进性：承接路径由轻到重，客户一步步往上走。'
  - '- 层次感：不同层级对应不同产品策略，而不是一刀切。'
  - '- 转化效率：分层能让有限的人力优先服务最有意愿的客户。'
  - '**典型例子**'
  - '- 高客单咨询业务中，客户先通过 9.9 元公开课了解信任，再进入 499 元小班训练营体验，最后才推荐 2 万元私教方案。'
  - '- 同城客户先预约免费到店体验，再给优惠券引导首单，最后推长期会员套餐。'
  - '**边界条件**'
  - '- 分层不宜过多，否则运营成本高，节奏拖沓。'
  - '- 每一层都需要明确的转化目标和升层条件，不能只是形式上的分层。'
  sources:
  - paper: 260802《让同城高客单陆陆续续成交起来》
    role: origin
  excerpts:
  - 为高客单留出分层承接空间。
- 'no': 3
  name: 转介绍闭环 —— 成交不是终点，而是“滚雪球”的起点
  points:
  - '**为什么需要这个概念？**'
  - '- 一次性成交成本高，老客户流失后需要不断买流量，长期来看利润很薄。'
  - '- 转介绍能让老客户持续带来新客户，获客成本越来越低。'
  - '- 很多生意停在做完一单就结束，缺少后续的经营动作。'
  - '**核心定义**'
  - '- 转介绍闭环：成交之后，通过设计好的流程引导客户进行转介绍（口碑传播、推荐朋友等），再转化为新的成交，形成循环。'
  - '- 它意味着“成交是服务的中间站，不是终点站”。'
  - '**关键性质**'
  - '- 循环性：资源通过转介绍不断回流，客户池越来越大。'
  - '- 低获客成本：相比投广告，转介绍获客成本更低，且客户质量更精准。'
  - '- 信任传递：朋友推荐比广告更有说服力，转化率更高。'
  - '**典型例子**'
  - '- 成交后有回访、感谢卡，附赠一张“老客户专属福利卡”，客户推荐 3 人即可解锁下一次折扣。'
  - '- 客户服务完成后，直接请客户写反馈、晒截图，并设置“推荐提成”奖励机制。'
  - '**边界条件**'
  - '- 转介绍的前提是产品本身交付过硬，否则推荐反而伤品牌。'
  - '- 转介绍需要激励机制和操作指引，不能依赖客户天然主动。'
  sources:
  - paper: 260828《Agent员工军团搭建流程》
    role: origin
  excerpts:
  - 成交不是终点，转介绍才是真正的闭环。
- 'no': 4
  name: 陆陆续续成交案例 —— 让订单像“水龙头”一样不中断
  points:
  - '**为什么需要这个概念？**'
  - '- 做生意最怕一锤子买卖和断崖式收入，老板需要稳定的现金流预期。'
  - '- “陆陆续续成交”意味着客户在持续涌来，而非偶发大单。'
  - '- 需要用完整案例来验证，闭环玩法是否真实有效。'
  - '**核心定义**'
  - '- 陆陆续续成交案例：呈现一个由三足法、分层承接、转介绍闭环共同作用，使得业务稳定出单、持续成交的实际案例。'
  - '- 强调“不是突然爆单，而是每天都有订单进来”的经营状态。'
  - '**关键性质**'
  - '- 持续性：时间线上分布均匀，跨度涵盖多个阶段。'
  - '- 可借鉴性：案例拆解出可复制的行动步骤，而非靠运气或个人魅力。'
  - '- 结果导向：以数据、成交量为佐证，说明方法论有效。'
  - '**典型例子**'
  - '- 某同城高客单服务商使用三足法布局后，三个月内从月 3 单提升到月 15 单，而且每单客单价提升 20%，其中 40% 来自老客转介绍。'
  - '- 某团队搭建 12 个 Agent 员工，自动化执行引流、承接、回访，实现月入 7w。'
  - '**边界条件**'
  - '- 案例需要来自真实场景，且数据要可核验，避免用户只见数据不看过程。'
  - '- 可复制的边界与地域、行业天花板有关，需说明适用条件。'
  sources:
  - paper: 260802《让同城高客单陆陆续续成交起来》
    role: origin
  - paper: 260828《Agent员工军团搭建流程》
    role: apply
  excerpts:
  - 用五步法搭建12个Agent员工，月入7w。
  - 让同城高客单陆陆续续成交。
