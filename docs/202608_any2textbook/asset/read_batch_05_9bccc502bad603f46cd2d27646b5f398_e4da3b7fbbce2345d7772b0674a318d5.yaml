- file_path: C:/Users/Administrator/shengcai-zhoubao-202608/260818副业SC精华《生财一年，从选项目到做论文，再到数据分析，我是如何从踩坑到确定项目，再到转型，实现年入20w的复盘》.md
  title: 生财一年，从选项目到做论文，再到数据分析，我是如何从踩坑到确定项目，再到转型，实现年入20w的复盘
  summary: 作者从多个副业项目失败后聚焦论文代写，通过闲鱼流量运营和转化话术优化做到年入近20万，后因平台管控和修改频繁转型做经管类论文实证分析和比赛类项目。
  core_question: 一个在职普通人如何在高客单价刚需品类（论文/数据分析）中跑通副业并持续转型？
  key_judgment: 闲鱼流量三要素（对标复制+补单+投流）可稳定获客；成交率提升靠价格锚定话术和学历信任背书；跑通0到1后不要轻易换赛道，要沿着已有能力向相邻高价值环节转型。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 涉及灰色地带（论文代写合规风险）
  - 时效性（平台管控持续收紧）
  - 含营销尾部内容
  screening_conclusion: retain
  reason: 闲鱼流量操作方法的总结极其精炼可复用（找对标100%复制、补单2-3天、投流29.9元），价格锚定话术和转化率从10%到30%的提升路径有实操价值。从论文到数据分析的转型逻辑（只做高客单价、只做高效交付品类）具有方法论意义。需注意标注合规风险。
- file_path: C:/Users/Administrator/shengcai-zhoubao-202608/260818副业SC精华《研究了几个月，我终于把公众号做到了99%自动化》.md
  title: 研究了几个月，我终于把公众号做到了99%自动化
  summary: 作者用Codex搭建了一套从数据搜索、RAG检索、AI写作、图片生成、排版到自动上传公众号草稿箱的完整自动化工作台，并给出了每个环节的具体实现指令和踩坑经验。
  core_question: 如何把公众号内容生产从选题到进入草稿箱的全流程做到接近完全自动化？
  key_judgment: 使用AI最难的不是操作，而是知道一件事情的完整路径；要把需求拆成输入、处理步骤、输出、失败重试和验收标准再交给AI；RAG的价值不是让AI读完所有资料，而是精准检索最相关的一小批证据。
  depth: high
  suggested_destination: handbook_entry
  possible_shape: handbook
  risks:
  - 技术细节极多，部分内容偏工程实现
  - 时效性（工具和API迭代快）
  - 格式预处理（含大量代码块和YAML）
  - 含营销尾部内容
  screening_conclusion: retain
  reason: 这篇文章的价值不仅是公众号自动化的具体方法，更在于'如何把一件事拆成完整路径再交给AI'的思维方式。RAG分层设计（价值观/原话/案例/方法/风格）、图片生成的输入输出规范、验收指令的写法都有跨场景迁移价值。适合作为手册中'AI自动化工作流'的独立条目。
