paper: 260826《50元启动虚拟产品一周跑通MVP》
desc: 该素材以作者从一条生财风向标出发、用不到50元和两天时间搭建小红书IMA知识库并实现10天曝光120万+、营业额1000+的真实经历为主线，总结了轻项目筛选六标准与最小验证四步法，核心主张是找项目应先确认最低条件后立刻做最小验证，遵循先手工跑通再工具化、先跟随已验证需求再差异化的原则，并以'有人看、有人关注、有人讨论、有人付费'四信号同时出现作为MVP成立标准。
concepts:
- name: 轻项目筛选六标准
  desc: 用于快速判断一个项目是否值得投入的六项筛选准则，帮助创业者在早期低成本排除不适合的项目。
  is_original: true
  excerpt:
  - 总结轻项目筛选六标准和最小验证四步法
- name: 最小验证四步法
  desc: 将项目验证拆解为四个可执行步骤的方法框架，强调以最低成本快速检验需求是否成立。
  is_original: true
  excerpt:
  - 总结轻项目筛选六标准和最小验证四步法
- name: MVP四信号标准
  desc: 判断MVP是否成立的四项同时出现的信号：有人看、有人关注、有人讨论、有人付费。
  is_original: true
  excerpt:
  - MVP成立标准是"有人看、有人关注、有人讨论、有人付费"四信号同时出现
- name: IMA知识库
  desc: 作为虚拟产品载体的小红书IMA知识库，是作者本次MVP的核心产品形态。
  is_original: false
  excerpt:
  - 用不到50元和两天做成小红书IMA知识库第一版
methods:
- name: __overview__
  desc: 整体方法论为：从风向标发现机会→用轻项目筛选六标准判断→确认最低条件后立刻做最小验证→按四步法手工跑通→以四信号标准判定MVP成立→再工具化与差异化放大。
  excerpt:
  - 找项目不是等完全想清楚再开始，而是先确认自己具备最低条件然后立刻做最小验证
  - 先手工跑通流程再工具化
  - 先跟随已验证需求再差异化
- name: 轻项目筛选六标准
  desc: 在投入前用六项标准快速筛选项目，降低试错成本，聚焦轻量可快速验证的方向。
  excerpt:
  - 总结轻项目筛选六标准和最小验证四步法
- name: 最小验证四步法
  desc: 以最低成本分四步完成需求验证的执行流程，强调快速行动优先于完整规划。
  excerpt:
  - 先确认自己具备最低条件然后立刻做最小验证
  - 先手工跑通流程再工具化
theorems:
- name: 先行动后完善
  desc: 找项目的核心不是等完全想清楚再开始，而是先确认自己具备最低条件然后立刻做最小验证。
  excerpt:
  - 找项目不是等完全想清楚再开始，而是先确认自己具备最低条件然后立刻做最小验证
- name: 先手工后工具
  desc: 在流程跑通之前不急于工具化，先用人工方式验证需求与流程可行性。
  excerpt:
  - 先手工跑通流程再工具化
- name: 先跟随再差异化
  desc: 优先跟随已被验证的需求，在跑通之后再考虑差异化，降低早期不确定性。
  excerpt:
  - 先跟随已验证需求再差异化
- name: MVP四信号判据
  desc: MVP成立的标准是'有人看、有人关注、有人讨论、有人付费'四信号同时出现，缺一不可。
  excerpt:
  - MVP成立标准是"有人看、有人关注、有人讨论、有人付费"四信号同时出现
findings:
- name: 低成本快速跑通MVP
  desc: '[evidence] 素材数据支撑：用不到50元和两天做成第一版，10天曝光120万+、营业额1000+，验证了低成本快速启动的可行性。'
  excerpt:
  - 用不到50元和两天做成小红书IMA知识库第一版，10天曝光120万+、营业额1000+
- name: 从风向标到产品的路径成立
  desc: '[claim] 原文宣称：从一条生财风向标出发即可完成从机会识别到产品落地的完整路径。'
  excerpt:
  - 从一条生财风向标出发，用不到50元和两天做成小红书IMA知识库第一版
