paper: 260803《日更1092天，我把我的AI内容工厂整套开源》
desc: 该素材是作者朝暮（教培执行校长）对其日更1092天、打磨400多次的AI辅助内容生产系统的整套开源，提出以“六引擎”（淘金、布局、铸文、标题、鉴文、淬文）为核心的内容工厂框架，核心主张是多数人用AI写的内容“一眼假”的根源不在提示词技巧，而在于AI不认识作者本人，因此主张正确顺序应为先建立“人格档案”让AI认识你，再通过“对标爆款”让AI认识市场，最后才进入写作，并强调生产与质检必须分离（独立鉴文机制），同时提出“四重错配”诊断框架与“七罪标题系统”；其效率结果为原来一天磨一篇半小时，现在两小时跑完7篇再由人逐篇终审。
concepts:
- name: 六引擎
  desc: 该概念指AI内容工厂的六个核心模块：淘金、布局、铸文、标题、鉴文、淬文，构成从选题挖掘到成稿质检的完整生产流水线。
  is_original: true
  excerpt:
  - 六引擎：淘金、布局、铸文、标题、鉴文、淬文。
- name: 人格档案体系
  desc: 该概念指为了让AI真正“认识你”而建立的一套关于作者本人身份、风格、立场与表达特征的结构化档案，是解决AI写内容“一眼假”的前置基础。
  is_original: true
  excerpt:
  - 正确顺序：先让AI认识你（人格档案），再让它认识市场（对标爆款），最后才轮到写。
  - 人格档案体系。
- name: 四重错配
  desc: 该概念指AI生成内容“一眼假”的四种错配类型：定位错配、素材错配、结构错配、表达错配，用于诊断内容失效的根因。
  is_original: true
  excerpt:
  - 四重错配：定位错配、素材错配、结构错配、表达错配。
- name: 七罪标题系统
  desc: 该概念指一套用于标题创作与诊断的标题方法论体系，命名为“七罪”，用于提升标题的吸引力与匹配度。
  is_original: true
  excerpt:
  - 七罪标题系统。
- name: 独立鉴文机制
  desc: 该概念指将内容质检（鉴文）从内容生产（铸文）中独立出来的一套机制，强调生产与质检必须分开，以保证审校的客观性和有效性。
  is_original: true
  excerpt:
  - 生产和质检必须分开。
  - 独立鉴文机制。
methods:
- name: __overview__
  desc: 该素材的整体方法论是以“六引擎”为流水线，按“先人格档案、再对标爆款、最后写作”的顺序组织AI内容生产，并将生产与质检分离，配套四重错配诊断与七罪标题系统，最终形成由人逐篇终审的AI内容工厂。
  excerpt:
  - 六引擎：淘金、布局、铸文、标题、鉴文、淬文。
  - 正确顺序：先让AI认识你（人格档案），再让它认识市场（对标爆款），最后才轮到写。
  - 生产和质检必须分开。
- name: 先人格、再市场、后写作的三段式顺序法
  desc: 该方法主张在AI写作之前，先建立人格档案让AI认识作者，再通过对标爆款让AI认识市场，最后才进入实际写作环节，以此替代单纯优化提示词技巧的做法。
  excerpt:
  - 正确顺序：先让AI认识你（人格档案），再让它认识市场（对标爆款），最后才轮到写。
- name: 生产质检分离法
  desc: 该方法要求内容生产环节与内容质检环节相互独立，通过独立的鉴文机制对成稿进行审查，避免自产自检带来的标准松弛。
  excerpt:
  - 生产和质检必须分开。
  - 独立鉴文机制。
- name: 四重错配诊断法
  desc: 该方法通过定位、素材、结构、表达四个维度对AI生成内容进行错配诊断，定位“一眼假”的具体成因。
  excerpt:
  - 四重错配：定位错配、素材错配、结构错配、表达错配。
theorems:
- name: 一眼假根因论
  desc: 该核心主张认为，大部分人用AI写的内容“一眼假”的根源不是提示词技巧不够，而是AI不认识你，因此问题重心应从提示词工程转向作者人格与市场信息的注入。
  excerpt:
  - 核心判断：大部分人用AI写的内容一眼假的根源不是提示词技巧不够，而是AI不认识你。
- name: 顺序优先论
  desc: 该核心主张认为AI内容生产的正确顺序是：先让AI认识你（人格档案），再让它认识市场（对标爆款），最后才轮到写，顺序本身决定内容质量。
  excerpt:
  - 正确顺序：先让AI认识你（人格档案），再让它认识市场（对标爆款），最后才轮到写。
- name: 生产质检分离论
  desc: 该核心主张认为内容生产与内容质检必须分开，不能由同一环节既生产又质检，独立鉴文是保证内容质量的必要条件。
  excerpt:
  - 生产和质检必须分开。
findings:
- name: 日更与打磨的实践数据
  desc: '[evidence] 该发现由作者自述的实践数据支撑：朋友圈日更1092天，整套系统打磨400多次，表明该内容工厂框架经过长期高频迭代验证。'
  excerpt:
  - 朋友圈日更1092天，打磨400多次。
- name: 效率提升结果
  desc: '[claim] 该结论为作者宣称的效率结果：以前一天磨一篇半小时，现在两小时跑完7篇再由人逐篇终审，体现AI内容工厂在量产与人工终审结合下的产出提升；素材未提供第三方对照或量化实验数据。'
  excerpt:
  - 结果：以前一天磨一篇半小时，现在两小时跑完7篇再由人逐篇终审。
