learning_targets:
- 理解把 Token 从一次性消耗品转化为长期可复用资产的必要性
- 掌握 know-how 杠杆论的核心逻辑与乘数效应
- 能识别并区分人机协作三阶段的角色迁移特征
- 能应用高频场景程序化的判断标准优化 Token 成本
- 能通过 40 亿 Token 实践案例理解大规模 AI 协作的成本效益平衡
concept_map:
- AI 杠杆 —— 把 Token 变成长期生产资料
- ├── know-how 杠杆论
- │   ├── 为什么需要：避免 Token 消费无复利、行业经验流失
- │   ├── 核心定义：行业 know-how × Agent 规模化执行
- │   ├── 关键性质：稀缺性、规模化、乘数效应
- │   └── 边界条件：know-how 需结构化、知识更新需及时
- ├── 长期生产资料
- │   ├── 为什么需要：Token 对话后即失效、避免一次性消费
- │   ├── 核心定义：低成本窗口期沉淀为代码/服务/Skill
- │   ├── 关键性质：复用性、增值性、时间窗口敏感性
- │   └── 边界条件：非所有产出值得沉淀、需核算维护成本
- ├── 人机协作三阶段
- │   ├── 为什么需要：理解角色迁移而非岗位消失
- │   ├── 核心定义：执行者 → 方向制定者 → 关键决策者
- │   ├── 关键性质：递进性、价值重心上移、决策权在人
- │   └── 边界条件：需领域判断力、高风险场景仍需全程参与
- ├── 高频场景程序化
- │   ├── 为什么需要：Agent 推理消耗 Token 和时间、效率浪费
- │   ├── 核心定义：高频 + 路径确定的场景固化为程序逻辑
- │   ├── 关键性质：确定性、经济性、鲁棒性
- │   └── 边界条件：输入多变则程序化失效、修改需人工介入
- └── 40亿Token实践
- ├── 为什么需要：用真实数据验证理论可行性
- ├── 核心定义：日均 40 亿 Token 的真实高强度压测
- ├── 关键性质：真实性、规模性、诊断性
- └── 边界条件：结果与业务复杂度相关、结论随时间衰减
life_analogy:
- 想象你经营一家**面包店**，每天要消耗大量面粉（Token）烤面包：
- '- **know-how 杠杆论** = 你珍藏的独家配方，同样的面粉，你做出来的面包比别人贵十倍'
- '- **长期生产资料** = 把临时烤出来的面包做成可冷冻保存的半成品，下次加热即卖'
- '- **人机协作三阶段** = 一开始你亲手揉面 → 后来教店员按配方做 → 最后你只决定今天卖什么口味'
- '- **高频场景程序化** = 每天 1000 个顾客买同款吐司，与其让每个店员都重新琢磨配方，不如直接标准化流水线'
- 就像聪明的店主不会让每个面包都从零研究配方，你也应该把 AI 的注意力留给真正需要思考的地方。
summary:
- concept: know-how 杠杆论
  desc: 行业 know-how 与 Agent 规模化执行相乘，是放大生产力回报率最显著的杠杆
- concept: 长期生产资料
  desc: 趁 Token 便宜把高质量输出沉淀为代码、服务和 Skill，从消费原料转为积累资本
- concept: 人机协作三阶段
  desc: 人的角色从执行者退到方向制定者，再退到关键决策者，决策权始终在人
- concept: 高频场景程序化
  desc: 高频且路径确定的场景应固化为程序逻辑，释放 AI 注意力给真正需要思考的地方
- concept: 40亿Token实践
  desc: 日均 40 亿 Token 的高强度真实运行，用于实证检验成本与效益的平衡点
exercises:
- 'no': 1
  title: 诊断你的 Token 消费清单
  contents:
  - 回顾你最近一周的 AI 使用记录，列出 10 个最频繁的调用场景：
  - 1. 为每个场景标注：调用频率（高/中/低）、逻辑确定性（固定/多变）
  - 2. 用'高频场景程序化'的判断标准，筛选出 3 个应被程序化的场景
  - 3. 估算这 3 个场景占你总 Token 消耗的比例
  - 4. 设计一个简单的程序化替代方案（伪代码或流程图即可）
  - 回答问题：
  - '- 哪些场景不适合程序化？为什么？'
  - '- 程序化改造后，省下来的注意力应该投向哪里？'
- 'no': 2
  title: 评估你的协作阶段
  contents:
  - 选取一个你日常工作流中的关键任务，对照人机协作三阶段进行分析：
  - 1. 描述该任务当前的协作形态（你亲手做？AI 做你改？AI 出方案你拍板？）
  - 2. 评估当前属于哪个阶段，并说明判断依据
  - 3. 若要向下一阶段迁移，需要具备哪些前提条件？（信任积累、领域判断力、校准质量等）
  - 4. 识别该任务进入第三阶段（关键决策者）后可能存在的风险
  - 回答问题：
  - '- 什么情况下人机协作停留在第一阶段反而更优？'
  - '- 如果缺失领域判断力，第三阶段的''决策''会退化成什么？'
- 'no': 3
  title: 计算 know-how 杠杆乘数效应
  contents:
  - 假设你是一名财务分析师，拥有一个识别财报造假风险的 know-how（包含 20 条规则）：
  - '- 传统方式：你人工审查一家公司需要 2 小时，每小时人力成本 500 元'
  - '- Agent 方式：将 know-how 注入 Agent，每次调用成本 5 元 Token 费，耗时 2 分钟'
  - 请计算：
  - 1. 审查第 1 家公司时，两种方式的成本差
  - 2. 审查第 50 家公司时，Agent 的累计成本 vs 人工累计成本
  - 3. 当审查量达到多少家时，Agent 的总成本（含开发 know-how 的 1000 元注入成本）开始低于人工？
  - 回答问题：
  - '- 如果行业规则每年更新一次且每次更新需重新注入，这会如何影响杠杆的长期效果？'
  - '- 哪些行业的 know-how 杠杆效应最强？哪些最弱？'
units:
- 'no': 1
  name: know-how 杠杆论 —— 把行业秘密变成机器人的指挥棒
  points:
  - '**为什么需要这个概念？**'
  - '- 单纯买 Token 只是花钱买算力，无法形成复利效应'
  - '- 行业多年积累的专业技能（know-how）如果没有沉淀，会随人员流动而流失'
  - '- 只有将 know-how 注入 Agent，才能让每一次调用都产生超越 Token 本身价值的产出'
  - '**核心定义**'
  - '- 将行业专属知识（know-how）与智能体（Agent）相结合，是放大生产力回报率最显著的杠杆'
  - '- 公式化表达：杠杆效应 = know-how 的稀缺性 × Agent 的规模化执行能力'
  - '**关键性质**'
  - '- 稀缺性：行业 know-how 是长期积累的、难以复制的隐性知识'
  - '- 规模化：Agent 可以无限复制同样的判断逻辑，边际成本趋近于零'
  - '- 乘数效应：杠杆效果随调用次数的增加而持续放大'
  - '**典型例子**'
  - '- 资深律师的合同审核经验（知道哪些条款容易埋雷）被编码成 Agent 的审查逻辑，每审一份合同都在复用这份经验'
  - '**边界条件**'
  - '- 若 know-how 尚未被结构化（仍是模糊的经验直觉），则无法有效注入 Agent，杠杆无法形成'
  - '- 若行业知识更新太快，编码固化后的 Agent 可能因知识过时而产生错误的输出'
  sources:
  - paper: 260811《日均40亿Token：把羊毛变成长期生产资料》
    role: origin
  excerpts:
  - 行业know-how+Agent=最大杠杆。
- 'no': 2
  name: 长期生产资料 —— 趁着Token便宜，赶紧囤积'数字资产'
  points:
  - '**为什么需要这个概念？**'
  - '- Token 是有时效性的消耗品，对话结束后就丧失了价值'
  - '- 如果每天烧掉巨量 Token 却什么都不留下，本质上是在做一次性消费'
  - '- 需要一种思维方式，把短期消耗转化为可反复复用的长期资本'
  - '**核心定义**'
  - '- 在 Token 成本较低的窗口期，把高质量输出沉淀为代码模块、工程化服务、Skill 等可复用的长期资产'
  - '- 这是一种''生产资料''的转化：从消费原料（Token）转为积累资本（资产）'
  - '**关键性质**'
  - '- 复用性：沉淀后的资产可以被多次调用，边际成本低'
  - '- 增值性：随着调用次数增加，资产的单位成本被摊薄，长期价值上升'
  - '- 时间窗口敏感性：趁价格便宜时大量储备，成本优势明显'
  - '**典型例子**'
  - '- 一次性请 AI 写一个临时的数据清洗脚本（消费 Token），不如把它封装成一套可重复执行的数据清洗服务（沉淀资产）'
  - '**边界条件**'
  - '- 并非所有产出都值得沉淀：一次性、高度定制化的内容不需要固化'
  - '- 沉淀的资产需要维护成本，若维护成本高于复用收益，则沉淀失去意义'
  sources:
  - paper: 260811《日均40亿Token：把羊毛变成长期生产资料》
    role: origin
  excerpts:
  - 趁便宜应把Token沉淀为代码、工程化服务和Skill等长期可复用资产。
- 'no': 3
  name: 人机协作三阶段 —— 从'亲手干'到'指挥干'再到'做决定'
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人对 AI 的恐惧来自''被替代''的直觉，但实际变化是角色迁移而非岗位消失'
  - '- 需要一套阶段性框架来描述人在 AI 时代的工作位阶如何逐步后移'
  - '- 帮助团队评估自己处在哪个协作成熟度，从而规划能力升级路径'
  - '**核心定义**'
  - '- 人机协作按角色重心演进分为三个阶段：人作为执行者 → 人作为方向制定者 → 人作为关键决策者'
  - '- 执行者：人亲手完成任务的具体操作'
  - '- 方向制定者：人告诉 Agent 做什么、怎么做，由 Agent 执行'
  - '- 关键决策者：Agent 给出建议和候选方案，人负责拍板关键选择'
  - '**关键性质**'
  - '- 递进性：不可跨级跳跃，需逐步积累信任与校准'
  - '- 人的价值重心逐级上移：从体力输出到定义问题再到承担权重'
  - '- 决策权始终保留在人类手中，Agent 仅提供决策依据'
  - '**典型例子**'
  - '- 第一阶段：自己写周报；第二阶段：让 AI 起草周报，人修改；第三阶段：AI 自动生成多个版本的周报，人选择发哪一版并决定汇报策略'
  - '**边界条件**'
  - '- 第三阶段要求人对领域有足够判断力，否则''决策''会退化为''盲选'''
  - '- 高风险、责任重大的场景仍需人全环节参与，不能因为进入第三阶段就完全放手'
  sources:
  - paper: 260811《日均40亿Token：把羊毛变成长期生产资料》
    role: origin
  excerpts:
  - 人的角色从执行者退到方向制定者和关键决策者。
- 'no': 4
  name: 高频场景程序化 —— 把'注意力'留给真正需要思考的地方
  points:
  - '**为什么需要这个概念？**'
  - '- Agent 每次调用都需要消耗注意力（Token 成本和时间延迟），这是不必要的开销'
  - '- 高频且逻辑固定的场景，反复让 Agent ''思考''是一种效率浪费'
  - '- 需要一种成本优化策略，让 AI 资源从低价值重复劳动中释放出来'
  - '**核心定义**'
  - '- 凡是被反复执行且判定逻辑稳定的场景，应固化为传统程序逻辑处理，而不再依赖 Agent 的动态推理'
  - '- 判断标准：场景是否高频 + 路径是否确定'
  - '**关键性质**'
  - '- 确定性：程序化后的逻辑行为可预期，不会出现 Agent 的幻觉漂移'
  - '- 经济性：运行成本远低于每次调用 Agent 的 Token 开销'
  - '- 鲁棒性：程序处理不依赖模型质量波动，执行结果稳定一致'
  - '**典型例子**'
  - '- 用户每天 1000 次查询天气（高频且逻辑固定），应写成一段调用天气 API 的程序而非让 Agent 每次重新推理如何应答'
  - '**边界条件**'
  - '- 若场景的输入变化多端、难以穷举规则，则程序化的判断逻辑会过拟合而失效'
  - '- 程序化后的逻辑修改需人工介入，不能像 Agent 一样自然语言调整'
  sources:
  - paper: 260811《日均40亿Token：把羊毛变成长期生产资料》
    role: origin
  excerpts:
  - 高频场景应该程序化。
- 'no': 5
  name: 40亿Token实践 —— 用真实火力验证成本与效益的平衡点
  points:
  - '**为什么需要这个概念？**'
  - '- 理论讨论''Token 沉淀为资产''太空泛，缺乏实际数据的支撑'
  - '- 需要一次高强度的真实运行来检验：当 Token 消耗量级达到日均 40 亿时，产出是否匹配投入'
  - '- 通过实践数据回答''疯狂的 Token 投入是否理性''这一关键问题'
  - '**核心定义**'
  - '- 指作者团队在一周内日均消耗 40 亿 Token 的真实使用记录，用于实证检验前文各原则（沉淀、程序化、分工）的可行性'
  - '- 这一规模量级远超日常个人使用，构成一次大规模 AI 协作压测'
  - '**关键性质**'
  - '- 真实性：来自实际业务环境的一线数据，非模拟实验'
  - '- 规模性：40 亿/日代表极高频的调用，能暴露出小规模时不可见的成本与质量问题'
  - '- 诊断性：该实践不是目的而是手段——用于发现哪些场景该保留 Agent、哪些应程序化'
  - '**典型例子**'
  - '- 在一周实践中，发现某个高频扩写任务占用了约 30% 的 Token，经评估后将其程序化，Token 消耗下降 22% 且输出质量反而更稳定'
  - '**边界条件**'
  - '- 40 亿Token的效果与自身业务的复杂度强相关，不同行业不能直接照搬该数字'
  - '- 实践结论具有时间衰减性：随着模型价格下降和能力提升，最优平衡点会动态移动，需定期复测'
  sources:
  - paper: 260811《日均40亿Token：把羊毛变成长期生产资料》
    role: origin
  excerpts:
  - 日均消耗40亿Token的一周实践。
'no': 7
