learning_targets:
- 理解AI时代真正的赚钱壁垒是销售能力而非产品制作能力
- 掌握『离钱最近的事优先做』的原则及优先级排序依据
- 理解现金投票机制如何用真实付费替代完美主义验证需求
- 认识工具升级与成交卡点未变的内在逻辑
- 能运用通讯录100人计划将销售行为具体化并启动成交动作
concept_map:
- 变现认知：从『做产品』到『做成交』
- ├── 核心壁垒：销售能力
- │   ├── 产品变快 ≠ 有人付钱 —— 260803
- │   ├── 敢介绍 + 敢问付费 —— 260803
- │   └── 卡点：不敢成交 —— 260803
- ├── 行动原则：离钱最近的事
- │   ├── 现金优先于完美 —— 260803
- │   ├── 收钱动作 > 打磨动作 —— 260803
- │   └── 低可交付即可启动 —— 260803
- ├── 验证机制：现金投票
- │   ├── 真实付费 = 唯一验证 —— 260803
- │   ├── 先收钱再完善 —— 260803
- │   └── 付费意愿 > 口头承诺 —— 260803
- ├── 认知边界：工具升级，卡点未变
- │   ├── 瓶颈迁移：制作慢 → 不敢卖 —— 260803
- │   └── 自动化边界：AI无法代付钱 —— 260803
- └── 实操方法：通讯录100人计划
- ├── 销售对象具体化 —— 260803
- ├── 7天强制时间窗 —— 260803
- └── 主动介绍 + 主动询问 —— 260803
life_analogy:
- 想象变现过程是**开一家街边小吃摊**：
- '- **产品制作** = 把食材做得好吃（AI帮你加速）'
- '- **销售能力** = 敢端到路人面前问『要不要来一份』'
- '- **离钱最近的事** = 站在摊前吆喝，而不是回厨房继续研究配方'
- '- **现金投票** = 客人真的掏钱买，而不是嘴上说『看起来不错』'
- '- **通讯录100人** = 心里有100个可能路过的老顾客的名字，逐个喊他们来尝'
- 就像再好的手艺没人开口吆喝也卖不出去，AI时代工具再快，不执行成交动作就没有收入。
summary:
- concept: 销售能力壁垒
  desc: 能否清楚介绍产品并直接询问付费，才是AI时代的真正分水岭
- concept: 离钱最近的事
  desc: 优先做直接产生成交和现金的动作，而非后台打磨
- concept: 现金投票
  desc: 用真实付费替代主观猜测，先收钱再完善产品
- concept: 工具升级卡点未变
  desc: AI移除了制作瓶颈，却暴露了不敢成交这一新瓶颈
- concept: 通讯录100人计划
  desc: 把销售对象具体到名字，用7天时间窗强制启动成交动作
exercises:
- 'no': 1
  title: 自评销售能力卡点
  contents:
  - 回顾你最近一个月的工作或学习安排：
  - 1. 列出你投入时间最多的三项任务
  - 2. 标记每项任务属于『产品制作』还是『成交动作』
  - 3. 计算两者时间占比
  - 回答：
  - '- 你的时间分配符合『离钱最近的事优先做』吗？'
  - '- 你是否有过『把产品打磨得更好再卖』的想法？这个想法是否延迟了你的首次收钱？'
- 'no': 2
  title: 设计你的现金投票实验
  contents:
  - 选择一个你有能力交付的轻量产品（课程、咨询服务、社群等）：
  - 1. 定义最低可交付版本（只做核心价值，不做完善）
  - 2. 设定一个价格
  - 3. 选择1-2个真实联系人进行付费邀约
  - 回答：
  - '- 你认为哪些『朋友的夸奖』可能不可靠？'
  - '- 如果无人付费，你如何判断是需求不成立还是销售方式有问题？'
- 'no': 3
  title: 制定你的通讯录100人计划
  contents:
  - 针对你手头的一个真实产品：
  - 1. 从通讯录中列出10个具体联系人（而非100个，先聚焦）
  - 2. 为每个人写一句话介绍产品价值
  - 3. 规划7天内每天联系几人、使用什么沟通方式（私信/朋友圈/电话）
  - 回答：
  - '- 列出名单时，你内心的阻力是什么？'
  - '- 你会选择先联系最熟的人还是最可能付费的人？为什么？'
  - '- 如果7天后成交为零，你计划如何调整话术或产品？'
- 'no': 4
  title: 识别『工具忙碌』陷阱
  contents:
  - 观察你一天的工作：
  - 1. 记录你使用AI工具完成的任务类型
  - 2. 区分哪些任务是『制作』、哪些是『成交』
  - 3. 统计AI工具是否只加速了制作、成交动作是否依然缺失
  - 回答：
  - '- 你的AI使用是否掩盖了不敢成交的问题？'
  - '- 如果AI完全不能帮你成交，你准备用什么原始方式启动第一次销售？'
units:
- 'no': 1
  name: 销售能力壁垒 —— 成交才是真正的分水岭
  points:
  - '**为什么需要这个概念？**'
  - '- AI工具让产品制作速度大幅提升，但产品变快不等于有人付钱'
  - '- 很多人卡在不敢让别人为产品付钱这一步，才是赚钱的瓶颈'
  - '- 必须重新定义什么是真正的壁垒，才能从做产品转向做成交'
  - '**核心定义**'
  - '- 销售能力壁垒是指：能否把一个东西清楚地介绍给具体的人，并直接询问对方是否愿意付钱'
  - '- 决定一个人能否在AI时代赚钱的核心，不是产品制作能力，而是销售能力'
  - '**关键性质**'
  - '- 工具可以降低制作门槛，但无法替代人与人之间的销售动作'
  - '- 销售能力是独立于产品品质的变量：产品可以不完美，销售动作必须发生'
  - '**典型例子**'
  - '- 一个人花一周用AI做好了课程，却迟迟不敢发朋友圈卖课'
  - '- 另一个人产品粗糙，但敢开口介绍、敢于报价，反而先收到第一笔钱'
  - '**边界条件**'
  - '- 销售能力壁垒的前提是有一个具体可交付的产品或服务，销售不等于空谈'
  - '- 适用于个体创业和小团队场景，不适用于纯平台流量驱动的规模化销售场景'
  sources:
  - paper: 260803《AI时代到底怎么赚钱》
    role: origin
  excerpts:
  - 你不敢把一个东西清楚地介绍给具体的人并问他愿不愿意付钱。
  - 真正壁垒是销售能力，而非产品制作。
- 'no': 2
  name: 离钱最近的事 —— 让现金优先于完美
  points:
  - '**为什么需要这个概念？**'
  - '- 打磨完美产品会无限延迟第一次收钱的时间'
  - '- 只有直接产生成交和现金的动作，才能验证商业模式是否成立'
  - '- AI工具降低制作成本后，时间更应该投入到成交动作上'
  - '**核心定义**'
  - '- 离钱最近的事，就是能直接带来成交、收到现金的动作，而非后台的产品打磨'
  - '- 优先级排序：先做产生现金的动作，再做完善产品的工作'
  - '**关键性质**'
  - '- 现金优先原则：收钱的动作权重高于打磨的动作'
  - '- 现金投票验证：真实付款是唯一有效的需求验证，替代主观猜测'
  - '**典型例子**'
  - '- 一个人先发朋友圈预售课程（离钱近），另一个人先花一个月优化PPT（离钱远）'
  - '- 用一次真实付费而非十次问卷调研来判断产品是否值得做'
  - '**边界条件**'
  - '- 离钱近的前提是你已经有最低可交付的产品，纯虚拟概念无法收钱'
  - '- 适用于个人和小团队，不适用于需要合规资质或长期研发的行业'
  sources:
  - paper: 260803《AI时代到底怎么赚钱》
    role: origin
  excerpts:
  - 先去做离钱最近的事。
  - 产品可以不完美，先完成现金投票。
- 'no': 3
  name: 现金投票 —— 用真实付款替代完美主义
  points:
  - '**为什么需要这个概念？**'
  - '- 靠朋友夸奖和问卷调研无法判断产品价值，人们容易说好话但不愿掏钱'
  - '- 打磨产品的时间成本很高，需要更快速的需求验证方式'
  - '- 真实付费是一种最诚实、最直接的投票机制'
  - '**核心定义**'
  - '- 现金投票，指用真实付费行为来验证需求是否成立：有人愿意付钱，需求才被验证'
  - '- 先收钱再完善，产品可以不完美，但付款动作必须先发生'
  - '**关键性质**'
  - '- 真实性：付费意愿是最诚实的反馈，优于口头承诺'
  - '- 先收后改：产品不需要完美才收钱，先完成首次现金交易再迭代'
  - '- 高效性：一次真实付费比十次咨询访谈更能说明问题'
  - '**典型例子**'
  - '- 产品只做了核心功能就上线定价预售，有用户付费即验证需求'
  - '- 在朋友圈发起第一批付费招募，付款人数不足则说明需求不成立'
  - '**边界条件**'
  - '- 现金投票须有最低可交付产品，完全无价值的雏形会损害信任'
  - '- 适用于轻量级产品和服务，不适用于医疗、法律等强监管高责任场景'
  sources:
  - paper: 260803《AI时代到底怎么赚钱》
    role: origin
  excerpts:
  - 产品可以不完美，先完成现金投票。
  - 先收钱再完善产品，用真实付费验证需求。
- 'no': 4
  name: 工具升级，卡点未变 —— AI快在手上，慢在不敢成交
  points:
  - '**为什么需要这个概念？**'
  - '- AI让产品制作效率提升，但很多人的收入没有等比例增长'
  - '- 需要用概念区分开『工具效率』和『赚钱能力』，避免用技术忙碌掩盖成交缺失'
  - '**核心定义**'
  - '- 工具升级但卡点未变，指AI让产品变快，但没有让成交自动发生，大家卡住的位置依然是成交环节'
  - '- 制作环节的瓶颈已被AI移除，真正的瓶颈转移到了销售动作的缺失上'
  - '**关键性质**'
  - '- 瓶颈迁移：工具的改进让旧瓶颈（制作慢）消失，暴露出新瓶颈（不敢卖）'
  - '- 自动化边界：AI能自动化生产内容，但无法自动化完成『他人付钱』这个行为'
  - '**典型例子**'
  - '- 以前一篇文案写一整天，现在AI一分钟生成三篇，但依旧没人来买'
  - '- 用AI一小时做好海报和落地页，却花了两周犹豫要不要发布'
  - '**边界条件**'
  - '- 适用于信息产品和知识付费等轻交付场景，复杂实物产品仍受供应链限制'
  - '- 工具效率提升带来的红利，必须配合成交动作才能转化为收入'
  sources:
  - paper: 260803《AI时代到底怎么赚钱》
    role: origin
  excerpts:
  - AI让产品变快了，但没有让成交自动发生。
  - 工具升级后大家卡住的位置没变。
- 'no': 5
  name: 通讯录100人计划 —— 把销售对象具体到名字
  points:
  - '**为什么需要这个概念？**'
  - '- 『我要开始销售』太抽象，容易无限拖延，需要把销售变成可执行的动作清单'
  - '- 销售不敢开口的真实原因是对象模糊，不知道向谁卖'
  - '- 强制列出具体的人，才能把抽象的销售恐惧变成具体的沟通行为'
  - '**核心定义**'
  - '- 通讯录100人计划，指列出通讯录中100个具体的人作为明确销售对象'
  - '- 在7天内对这些具体的人逐一落实销售动作，强制启动成交行为'
  - '**关键性质**'
  - '- 具体化：从『向市场卖』变成『向某个名字卖』，极大降低行动心理门槛'
  - '- 强制时间窗：7天期限制造紧迫感，阻止无限拖延'
  - '- 主动启动：不等客户上门，主动介绍、主动询问，用行动打破恐惧'
  - '**典型例子**'
  - '- 从微信通讯录挑出100个可能需要的朋友，逐一发送产品介绍并询问购买意愿'
  - '- 7天内每天联系15人左右，完成新产品的首批真实成交测试'
  - '**边界条件**'
  - '- 适用于有初步人脉积累的个体，完全不认识人的通讯录无效率'
  - '- 适用于首批客户验证场景，规模化后需要渠道和流量策略补充'
  sources:
  - paper: 260803《AI时代到底怎么赚钱》
    role: origin
  excerpts:
  - 列出通讯录100人。
  - 7天行动计划。
'no': 1
