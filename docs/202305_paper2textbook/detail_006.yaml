  - 科学研究证明，运动能够使大脑长出更多新的神经元，这意味着运动可以在物理上让你变得更“聪明”。
  - 然后，在运动后的1~2小时内进行高强度、高难度的脑力活动...可以让你的新神经元受到刺激，不断生长
  - 让你的感受回归你当下的行动，工作、学习、跑步、睡觉、吃饭。身心合一的要领不仅是专注于当下，更是享受当下
- 'no': 13
  name: 高效学习内化工具箱 —— 费曼技巧、关键点触发读书、刻意练习缝合知识
  points:
  - '**为什么需要这个概念？**'
  - '- 传统“全书精读/笔记整理”效率极低，且易陷入“收藏夹吃灰”假努力'
  - '- 学习本质是“关联旧知+刻意缝合”，卡壳根源是基础不熟练而非智商不足'
  - '- 需一套低门槛、高迁移、可标准化的学习操作系统'
  - '**核心定义**'
  - '- 费曼技巧：用自己的语言、最简单的话讲清楚复杂概念，让外行也能听懂，检验并深化理解'
  - '- 关键点触发式读书：不求全读，仅捕捉触动感性的关键点/块，打碎重组为个人知识网络'
  - '- 刻意练习缝合：针对“卡壳”点（基础不熟练处），高强度重复训练至自动化'
  - '**关键性质**'
  - '- 感性选择+理性深思：先用感性筛选触动点，再用理性拆解整合，保持在学习“拉伸区”'
  - '- 输出倒逼输入：费曼技巧/写作复盘/公开分享，以输出为目的反向驱动深度输入'
  - '- 标准化流程：关键点记录→关联思考→费曼内化→PARA组织→创作输出，形成闭环'
  - '**典型例子**'
  - '- 作者阅读《认知觉醒》/《纳瓦尔宝典》等：仅摘录触动段落→关联经验→费曼讲述→形成精华帖'
  - '- 番茄工作法/精力桶管理：持续专注+主动休息，维持高效节奏，避免过度消耗'
  - '**边界条件**'
  - '- 适用于“概念/方法论/策略”类知识，技能类（编程/乐器/运动）需大量物理重复训练'
  - '- 触发点捕捉依赖既有认知框架，零基础新手需先建立最小知识骨架'
  - '- 费曼技巧需真实受众（或模拟受众）反馈，自说自话易陷入“自以为懂”'
  sources:
  - paper: docs/202305/M5lpdRp7OoHZAYxuDiicgGtSnpg.md
    role: origin
  excerpts:
  - 学习就是把新知识关联到旧的知识体系中，然后再通过刻意练习将链接处的地方进行深度缝合。
  - 最后，利用费曼技巧，通过自己的语言，用最简单的话把一件事情讲清楚，让外行人也能听懂。
  - 你只需学习那些让你深深触动的知识，尝试去打碎各家的知识体系，只取其中最触动自己的点或块，然后将其拼接成自己的知识网络。
  - 那些轻松的学霸，他们学习时从不过度消耗自己，只要感到精力不足，就停下来主动休息，这反而使他们精力桶的水位得到快速回升。
- 'no': 14
  name: 长价值写作法与双轨制 —— 远离热点、10年生命力、感性故事载理性道理
  points:
  - '**为什么需要这个概念？**'
  - '- 追热点/蹭流量内容生命周期短，无法沉淀资产，且吸引低质量泛流量'
  - '- 纯理性说教枯燥难读，纯感性故事空洞无物，需“故事激活感性→传递理性”双轨制'
