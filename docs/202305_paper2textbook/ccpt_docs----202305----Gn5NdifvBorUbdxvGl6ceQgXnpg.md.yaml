paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
desc: 该素材是生财有术圈友毛韩的实战复盘文章，记录了其从新手小白到通过「小航海」项目实现月净收益2万元并保持20%增长的全过程。核心在于构建了一套适合新手的四阶段方法论：第一阶段「锻造武器」——通过拆解精华帖建立「流量-产品-变现」模块库；第二阶段「明确战场」——创新提出基于个人能力资源匹配度的「项目筛选模型」（含近20项参数），区别于大佬的「挑选」逻辑，主张新手应「筛选」匹配当下能力的项目；第三阶段「勇敢行动」——倡导「开始行动-遇到问题-解决问题」闭环，引入福格行为模型辅助执行；第四阶段「放大项目」——运用「增长模型」拆解业务指标提升本业盈利，并总结「业务迁移」五大路径（同用户上下游、异用户同业务、变卖流量、卖影响力、培训）实现横向扩展。文章附赠飞书可复制的项目筛选模型工具。
concepts:
- name: 流量-产品-变现模块库
  desc: 将所有商业项目拆解为流量获取、产品搭建、变现方式三大核心模块，通过阅读精华帖积累各类模块，实战时像搭积木一样组合成新项目的基础认知框架。
  is_original: false
  excerpt:
  - 既然每个项目都符合这个模型，那么如何引流、如何搭建产品、如何设置变现方式其实就是最基本的武器。
  - 当我们拆解完两篇帖子后，会得到共计 6 个模块。当我们要去做其他项目时，其实只需要把这几个模块拼在一起，就能得到一个新的模式。
- name: 流量形态三分类
  desc: 将所有引流方式归纳为三种本质形态：关键词流量（SEO等）、关系链流量（裂变、社群）、算法推荐流量（短视频等），掌握一类形态即可举一反三复用。
  is_original: true
  excerpt:
  - 它们分别属于不同的三种形式：1. 关键词——通过关键词链接到用户。2. 关系链——通过关系链链接到用户。3. 算法推荐——让算法将自己推荐给目标用户。
- name: 新手项目筛选模型
  desc: 针对新手能力资源有限的现状，构建的含近20项参数（风险、收益、附加价值、市场、能力、时间、成本、个人匹配度等）的决策表格，核心逻辑是「筛选匹配度」而非「挑选优质项目」，支持动态调整参数权重。
  is_original: true
  excerpt:
  - 老师们判断项目的标准其实和新手不太一样...我们新手更应该关注自己的能力和资源和项目是否匹配。
  - 模型很简单，其实只是一系列参数组成的表格，目前覆盖了近 20 项参数。
- name: 积累大于收益原则
  desc: 主张新手期应优先选择能积累资源（货源、人脉、专业能力）、具备杠杆/复利/复购效应的项目，而非单纯追求短期现金流，将积累视为跨越阶层的关键变量。
  is_original: true
  excerpt:
  - 多说一句：其实在我看来积累比收益更加重要。积累能让我步入下一个阶层，但收益不能。
  - 创业做有积累的项目和无积累的项目区别就像"在厂里打螺丝和做技术员的区别一样"
- name: 福格行为模型落地执行
  desc: 将B=MAP模型（行为=动机×能力×触发）应用于创业执行卡点诊断：当行动不达标时，从动机（是否想做）、能力（是否太难/不会）、触发（是否忘记/无提醒）三维拆解并针对性解决。
  is_original: false
  excerpt:
  - 简单点讲，福格行为模型=动机 x 能力 x 触发物。当你遇到挫折、或者行为与预期不符的情况时，可以通过这个模型来分析一下自己为什么没做到。
- name: 项目增长模型
  desc: 将项目最终收益指标层层拆解为可量化、可操作的漏斗公式（如收益=客单价×支付率×咨询率×添加率×触达率×私信率×阅读量），指导精准优化各环节转化率与源头流量。
  is_original: true
  excerpt:
  - 增长模型是用户增长领域的专业名词，指将一个商业项目用一个公式代表，再将公式拆解后得到增长模型。
  - 收益 = 客单价 x 支付率 x 咨询率 x 添加率 x 小红书引流触达率 x 私信率 x 阅读量
- name: 业务迁移五维路径
  desc: 基于已积累的流量（粉丝）或产品（货源）资源，总结的五大横向扩展路径：同用户上下游延伸、异用户同业务复制、变卖流量(广告)、卖影响力(加盟/代理)、卖模式(培训)。
  is_original: true
  excerpt:
  - 我总结出以下几个方式：1. 业务迁移：针对同一类型用户增加上下游其他业务... 2. 针对不同类型用户做同样业务... 3. 变卖流量... 4. 卖影响力...
    5. 培训...
methods:
- name: __overview__
  desc: 新手从0到1跑通项目的四阶段通用方法论：锻造武器(拆解模块库) → 明确战场(筛选模型匹配) → 勇敢行动(行动-问题-解决闭环+福格模型) → 放大项目(增长模型优化本业+业务迁移扩展)。
  excerpt:
  - 这套方法论由我经历的四个阶段组成：1. 初入生财：没日没夜地看几天精华帖... 2. 筛选项目... 3. 尝试动手... 4. 更加焦虑...
  - 总结一下上方提到的所有内容：新手赚第一笔钱会经历的四个阶段及解决方案
- name: 精华帖模块化拆解法
  desc: 按「流量-产品-变现」三维度拆解精华帖，建立个人武器库表格。每拆解一篇帖子获得3个模块，N篇帖子得3N模块，新项目即为模块重组。
  excerpt:
  - 前期阅读精华帖，目的就是拆解并学习圈友是如何引流、如何搭建产品以及如何变现的。
  - 举个例子：当我们了解小红书资料引流项目相关帖子时，按照流量-产品-变现模型来拆解，你会得到以下三部分信息...
- name: 蓝海关键词跨平台验证法
  desc: 在一个平台(如百度/5118)发现需求信号后，去目标平台(如小红书)搜索同词根对比「收录量/笔记数」与「搜索流量」的比值，若目标平台内容极少但流量可观，即判定为蓝海。
  excerpt:
  - 我在 5118 搜索了相关的百度数据...收录页比较多... 我又搜索了小红书的数据，发现只有不到 10 条笔记，但是搜索流量并不低
  - 本着在一个流量池不是蓝海，在另一个流量池可能就是蓝海想法
- name: 项目筛选模型操作流程
  desc: 四步筛选法：1. 先筛原则(红线项如违法) 2. 再筛能力(硬性约束:技能/资源/时间/成本) 3. 再筛收益(反馈周期/天花板/杠杆) 4. 最后筛市场(周期/渗透率/供需)。无结果时反查三问：条件是否太苛刻/看项目是否太少/参数填写是否准确。
  excerpt:
  - 我通常的操作流程为：1. 先筛选自己的原则... 2. 再筛选自己的能力... 3. 再筛选收益... 4. 最后筛选市场。
  - 如果一个项目都没有过滤到，那么你需要考虑三个问题...
- name: 增长模型拆解优化法
  desc: 将业务目标(收益/流量/团队规模)拆解为多层乘法公式，识别每一层转化率与基数，制定针对性提升策略(如优化私信回复速度提升添加率、矩阵号增加账号数)，并可递归拆解子系统(如招聘漏斗)。
  excerpt:
  - 放大一个项目业务本身的收益，就是将每一个环节的转化率都提到最高，同时将最源头的流量提到最高即可。
  - 阅读量 = 推荐阅读量 + 单个关键词流量 x 点击率 x 单篇帖子覆盖关键词数量 x 单账号帖子数量 x 人均账号数 x 客服人数
- name: 最小可行性行动启动法
  desc: 克服完美主义拖延：注册账号→发布内容→无流量想获流→有流无转化优转化。遇阻即用福格模型诊断动机/能力/触发，外包/工具/提醒对症下药。
  excerpt:
  - 比如你要做淘宝蓝海，别管其他的，先注册个店铺、随便上传个商品；
  - 然后你会发现，怎么没流量呢？接下来就是想办法获取流量； 之后会发现，怎么有浏览但没转化呢？那就想办法优化转化率
theorems:
- name: 新手与大佬项目决策不对称定理
  desc: 大佬拥有全量项目视野与充足资源，决策模式为「挑选」最优项目；新手视野与资源受限，决策模式必须为「筛选」匹配当下能力资源的项目，盲目套用大佬标准会导致无项目可做。
  excerpt:
  - 老师们好像看一眼就知道一个项目的全貌...所以老师们是在"挑选"项目。但新手不能，新手还没有那种商业"网感"...所以新手选项目，是"筛选"。
- name: 项目匹配度优于项目绝对质量定理
  desc: 对新手而言，项目能否赚钱更取决于个人能力资源与项目的匹配度，而非项目市场大小或理论上限。一个匹配度高的小项目优于匹配度低的大项目。
  excerpt:
  - 一个项目能否赚到钱更取决于自己的能力、而非市场多大，至少对目前的我来说是这样的。
  - 当我把持续周期改成 1 年时，就有好几个项目可以做。
- name: 积累复利大于现金流定理
  desc: 早期创业应优化积累价值(技能、资源、人脉、杠杆产品)而非现金流。积累具有跨周期迁移性，能降低下一个项目的启动门槛；纯现金流项目(如打螺丝)仅解决温饱，切换赛道需归零。
  excerpt:
  - 积累能让我步入下一个阶层，但收益不能。钱只能判断我现在有钱，积累才是让我未来更加值钱的。
  - 打螺丝的要"换项目”的话，只是换个厂打螺丝。
- name: 放大即增长模型极值化+业务迁移组合定理
  desc: 项目放大分两步走：第一步在现有业务框架内，将增长模型各变量(转化率、流量基数)推向极值(矩阵、投放、流程优化)；第二步利用已积累的流量/产品资产，通过业务迁移五维路径开辟第二增长曲线。
  excerpt:
  - 通常情况下，一个项目有两种放大方法：1. 业务本身... 2. 其他业务...
  - 放大一个项目业务本身的收益，就是将每一个环节的转化率都提到最高，同时将最源头的流量提到最高即可。
- name: 流量形态可迁移性定理
  desc: 掌握一种流量形态(关键词/关系链/算法)的核心打法后，可低成本迁移至同形态的其他平台(如小红书SEO→抖音SEO→微信搜一搜→知乎)，实现流量池的局部垄断与横向扩张。
  excerpt:
  - 比如学会如何寻找关键词、如何铺设关键词，那是否就掌握了「关键词」的流量密码？
  - 参加抖音 SEO 小航海，尝试以同样的操作垄断抖音相关流量 再以同样的方式尝试垄断快手、微信搜一搜、知乎等其他 seo 相关的的流量
findings:
- name: 外卖差评删除项目实测数据
  desc: '[evidence] 作者亲测：电销第1天打13通成交1单，第2天打50通成交2单，第3天微信加20好友成交1单。前期外包同行单价50元(成本40元)赚首笔200+；后自购软件操作月入2000；离职全职后电销月入1万；引入小红书SEO后月入1.8万(3月)→2.25万(4月)，环比增长20%，客源结构为小红书7k/电销1.4万/推荐1.1k。'
  excerpt:
  - 第一天我打 13 个电话，就有一个商家表示要合作...第二天我打约 50 个电话，有 2 个商家表示要合作...第三天...加了 20 个好友，有 1 个商家咨询的。
  - 下图是 4 月份的总收益：从小红书来源的客户收益 7000 元，从微信直加来源的客户收益 14000+，用户推荐的客户收益 1100 元，累计收益 22515
    元。
  - 下面是 3 月份的总收益：累计收益约 18000+元，环比增长率 20%左右。
- name: 小红书SEO低频维护高产出现象
  desc: '[evidence] 作者小红书账号仅1个，近7天仅发2篇笔记，却能占据「外卖差评删除」搜索Top20中5个席位，日均引流5+商家，月引流200人，证明关键词流量形态具备长尾复利与低维护成本特性。'
  excerpt:
  - 其实现在我还没好好做，每隔几天想起来才发一篇笔记，并且只有一个账号... 最近 7 天才发了两篇笔记。
  - 小红书渠道也让我每天都可以引流至少 5 个商家到微信，每月引流约 200 人。
- name: 筛选模型参数调整即时生效验证
  desc: '[evidence] 作者初始筛选条件(周期10年/成本<1万/时间<2h/无资源需求/月内见款)匹配0项目；仅将「持续周期」放宽至1年，即匹配出「小红书资料引流」「闲鱼无货源」等可执行项目，验证模型敏感度与实用性。'
  excerpt:
  - 经过筛选后我的项目库匹配到 0 个项目... 但是当我把持续周期改成 1 年时，就有好几个项目可以做。比如小红书资料引流、比如闲鱼无货源。
- name: 私域资产量化积累结论
  desc: '[claim] 作者宣称项目运营期间累积外卖商家私域流量3万+，合作客户200+，并以此为基础规划扩展外卖运营、电商差评等上下游业务，验证「积累大于收益」原则的资产沉淀效果。'
  excerpt:
  - 我们现在拥有外卖商家私域流量约 3w+，合作过的客户有 200+，有相关资源的可以对接一下
  - 针对现有的客户，扩展其他变现场景。如找做外卖运营的圈友合作，将项目调整下。
- name: 筛选模型工具化交付验证
  desc: '[evidence] 作者将筛选模型制作为飞书多维表格在线工具，提供「创建副本」功能供圈友直接使用、修改参数、新增维度，实现了方法论从隐性知识到显性工具的降维打击式交付。'
  excerpt:
  - 用电脑打开筛选模型：https://wchekk4hs9.feishu.cn/base/TpsBbwxhYaplTWsUGmpc6k6QnXc
  - 点击右上角三个点-创建副本，到自己的飞书文档中
  - 模型中所有项目的参数均为我个人认知，你可以根据自己的认知和情况，修改每个项目的参数
