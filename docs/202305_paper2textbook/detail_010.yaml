learning_targets:
- 理解ChatGPT+RPA协同自动化架构的核心原理：内容引擎+执行器模式
- 掌握结构化提示词工程方法：五段式模板、权重语法、Temperature差异化策略、卖点迁移Prompt
- 熟练构建RPA端到端自动化闭环：可视化拖拽开发、Excel数据驱动、流式输出等待处理
- 建立AI内容自动化生产线全景认知：文本/图像/视频三位一体工具链集成与编排层设计
- 确立AI赚钱第一性原理：AI是放大器而非救世主，执行力>完美主义，方法论资产>单个项目收益
- 掌握低成本验证与避坑指南：手动跑通是自动化前提、工具组合替代单一平台、赛道分层生存法则
concept_map:
- RPA+AI协同自动化
- ├── 核心架构
- │   ├── ChatGPT+RPA协同自动化架构  —— P001(origin/improve/apply)
- │   │   ├── 内容引擎(LLM生成文案/代码/分析)
- │   │   ├── 执行器(RPA数据搬运/跨应用交互/流程编排)
- │   │   └── 标准化接口(剪贴板/文件/API解耦)
- │   ├── 结构化提示词工程  —— P002(origin/apply/improve)
- │   │   ├── 正向词五段式模板[质量+主体+细节+服饰+环境]
- │   │   ├── 权重语法(词:权重)精准控制
- │   │   ├── 负向词万能预设(60+标签抑制缺陷)
- │   │   ├── Temperature差异化策略(带货0.3-0.7/创意0.9)
- │   │   ├── 卖点迁移Prompt(结构保持迁移新品)
- │   │   └── Excel参数化批量生成(CONCAT函数解耦数据指令)
- │   └── ChatGPT中文调教12步法  —— P001(origin)
- │       ├── 基于模仿的少样本微调范式
- │       └── 结构化中文指令替代代码实现人设固化
- ├── RPA端到端自动化闭环  —— P003(origin/theorem/apply)
- │   ├── 可视化拖拽式开发(影刀RPA 13次拖拽成流程)
- │   ├── 标准化流程编排(获取句柄→打开表格→循环遍历读Prompt→发送→等待流式输出→抓取回复→写回)
- │   ├── Excel数据驱动(CONCAT批量生成Prompt)
- │   ├── 手动跑通前提定律(SOP先行工具在后)
- │   ├── 异常处理(流式输出等待/元素失效/风控对抗)
- │   └── 工具组合替代单一平台(热点宝/轻抖/超级写手/一帧秒创/RPA)
- ├── AI内容自动化生产线全景图  —— P004(definition/experiment/apply/method)
- │   ├── 文本层(ChatGPT/GPT-4文案生成/改写/卖点迁移)
- │   ├── 图像层(Midjourney/SD+ControlNet/LoRA/Inpainting)
- │   ├── 视频层(剪映/CapCut/一帧秒创关键帧动态化/素材替换)
- │   ├── 编排层(RPA/Coze/Make/Zapier定时触发/跨平台分发/数据回收)
- │   ├── 低成本视频合成策略(不在意AI素材质量后期替换真实素材)
- │   ├── 人物一致性锚定(Prompt固定核心外貌特征词)
- │   └── SEO霸屏布局(下拉词/相关搜索系统性植入+RPA批量发布)
- └── AI赚钱第一性原理与避坑指南  —— P005(theorem/origin/limitation)
- '    ├── 放大器而非救世主(AI降低技能门槛提高标准化要求)'
- '    ├── 赛道分层生存法则(女频批量vs男频风格化vs短剧CPSvs解压素材)'
- '    ├── 执行力>完美主义(0-1完成比完美重要先发布再修正)'
- '    ├── 信息差半衰期法则(发现×产出×分发速度乘积)'
- '    ├── 低成本验证优于完美策划(8元模板+废号<1100元跑通闭环)'
- '    ├── 方法论资产>单项目收益(像素级拆解/模仿/优化/复制跨周期复利)'
- '    ├── 平台风控窗口期利用(快进快出榨取价值非硬刚)'
- '    ├── 形式大于内容(直播形式可迁移降低主播门槛)'
- '    └── 复购率核心指标(非标产品LTV覆盖获客成本)'
life_analogy:
- 想象AI自动化生产线是一家**智能餐厅的中央厨房系统**：
- '- **ChatGPT（大语言模型）** = **总厨（内容引擎）**：根据菜单（Prompt）设计菜品（文案/代码/分析），掌握核心配方（结构化提示词），能按要求变换口味（Temperature/卖点迁移）'
- '- **RPA（机器人流程自动化）** = **传送带+分拣机器人（执行器）**：负责搬运食材（Excel数据）、摆盘（填表）、上菜（发布分发）、回收反馈（数据回填），不碰核心烹饪但决定上菜速度'
- '- **结构化Prompt模板** = **标准化菜谱（SOP）**：固定“主料+调料+火候+摆盘+装饰”五步骤，新菜（新品文案）只需换主料（变量）保持流程不变'
- '- **Temperature参数** = **出品一致性控制阀**：带货菜设“标准化出品”（0.3-0.7），创意菜开“厨师发挥”（0.9），批量出多版本供食客（筛选机制）挑选'
- '- **自动化流水线（文本/图像/视频/编排）** = **中央厨房+冷链物流+前台点餐系统一体化**：从选题（点单）→生产（烹饪）→发布（上菜）→数据（反馈）全程无人值守'
- '- **手动跑通前提定律** = **先有标准后厨出品流程，再上自动化设备**：没跑通的菜谱上传送带只会批量生产废品'
- '- **工具组合替代单一平台** = **专用设备组合（切菜机/绞肉机/真空包装/传送带）优于全能但笨重的单一大机器或全人工后厨**'
- 就像餐厅要想规模化复制，必须‘菜谱标准化（Prompt工程）→后厨流程固化（SOP）→设备自动化（RPA）→前端分发（多平台矩阵）’，AI自动化也是同理：先把‘怎么做’变成标准动作，再交给机器批量跑。
summary:
- concept: ChatGPT+RPA协同自动化架构
  desc: LLM作内容引擎，RPA作执行器，标准化接口解耦，解决长尾高频办公自动化需求
- concept: 结构化提示词五段式模板
  desc: 质量词+主体+细节+服饰+环境，配合权重语法实现复杂意图标准化表达
- concept: Temperature差异化策略
  desc: 带货文案0.3-0.7保守连贯，创意文案0.9发散，批量设定不同值生成多版本供筛选
- concept: 卖点迁移Prompt
  desc: 先分析种子文案卖点结构与人群画像，再迁移至新商品保持段落结构不变
- concept: Excel参数化批量生成
  desc: CONCAT函数分离固定指令模板与变量数据，实现数据与指令解耦的批量化Prompt工程
- concept: 可视化拖拽式RPA开发
  desc: 影刀RPA预置组件积木式搭建，13次拖拽完成端到端文案自动化流程构建
- concept: 手动跑通是自动化前提定律
  desc: SOP先行工具在后，自动化解决1到100规模化而非0到1验证可行性
- concept: 流式输出等待处理
  desc: 针对ChatGPT网页版逐字输出特性，RPA必须显式等待输入完毕才能抓取完整回复
- concept: AI内容自动化生产线三位一体
  desc: 文本(ChatGPT)+图像(SD/MJ+ControlNet/LoRA)+视频(剪映/一帧秒创)+编排(RPA/Coze)
- concept: 低成本视频合成策略
  desc: 不在意AI生成素材质量，后期剪映批量替换本地真实素材规避选素不准
- concept: 关键帧动态化
  desc: 剪映设置位置/缩放关键帧使静态AI图产生镜头推拉摇移效果消除PPT感
- concept: 人物一致性锚定
  desc: 无LoRA条件下Prompt强制固定核心外貌特征词(发色/瞳色/服饰)维持跨图连续性
- concept: SEO霸屏布局
  desc: 下拉词/相关搜索/大家都在搜系统性植入文案描述标签，配合RPA批量发布构建关键词覆盖矩阵
- concept: AI赚钱第一性原理：放大器而非救世主
  desc: 单纯会用工具不赚钱，必须将业务拆解为SOP注入Prompt工程串联自动化流水线
- concept: 赛道分层生存法则
  desc: 女频批量vs男频风格化vs短剧CPSvs解压素材，新手优先跑通闭环再考虑风格化
- concept: 执行力>完美主义
  desc: 0-1阶段完成比完美重要，先发布再修正用市场反馈倒逼升级
- concept: 信息差半衰期法则
  desc: 信息差商业价值随时间指数衰减，唯有发现×产出×分发速度极致执行力完成变现
- concept: 低成本验证优于完美策划
  desc: 8元模板+废号+现有电脑<1100元成本跑通商业闭环，真实交易数据检验需求唯一标准
- concept: 方法论资产>单个项目收益
  desc: 内化像素级拆解/模仿/优化/复制方法论、识别流量密码嗅觉可跨周期跨赛道复利
- concept: 平台风控红利窗口期
  desc: 不可对抗只能利用，快进快出榨取价值而非硬刚平台(蓝V/开店/保证金)
- concept: 形式大于内容
  desc: 直播形式可迁移性(AE改文字→AI绘画/AI聊天/虚拟主播)，核心降低主播技能门槛提高产出比
- concept: 复购率核心指标
  desc: 非标产品商业模式可行性核心指标，高复购证明情绪价值/社交货币需求真实性与高频性
exercises:
- 'no': 1
  title: 手工搭建一个ChatGPT+RPA文案自动化微流程
  contents:
  - 准备：安装影刀RPA（或UiBot），准备一个Excel表格（A列放5个测试标题，如“AI写作工具推荐”、“短视频变现技巧”等）
  - 1. 在Excel B列使用CONCAT公式生成Prompt：=CONCAT("写一篇关于","“",A2,"”的小红书笔记，要求：标题吸睛、正文干货、结尾引导评论，带emoji")
  - 2. 打开ChatGPT网页版，登录并保持页面激活
  - 3. 在影刀RPA中新建流程，按顺序拖拽以下组件并配置：
  - '   - 获取已打开的网页句柄（指向ChatGPT页面）'
  - '   - 打开/激活Excel文件'
  - '   - 循环遍历（起始行2，结束行6）'
  - '   - 读取单元格（B列，当前行）'
  - '   - 点击元素（定位ChatGPT输入框）'
  - '   - 输入内容（上一步读取的Prompt）'
  - '   - 发送键盘按键（Enter键）'
  - '   - 等待元素出现（定位‘重新生成’按钮或输出区域停止流动，作为流式输出结束标志）'
  - '   - 获取文本（定位最后一条回复元素，提取文本）'
  - '   - 写入单元格（C列，当前行，写入获取的文本）'
  - 4. 运行流程，观察C列是否自动填入生成的文案
  - 回答问题：
  - '- 如果不加‘等待流式输出结束’步骤，会发生什么？'
  - '- 如何让生成的文案风格更统一？（提示词层面 vs Temperature层面）'
  - '- 若ChatGPT网页版UI更新导致‘输入框’元素定位失败，如何快速修复？'
- 'no': 2
  title: 设计一个结构化卖点迁移Prompt并测试效果
  contents:
  - 任务：将一篇爆款‘无线蓝牙耳机’带货文案的结构，迁移到新产品‘便携式颈挂风扇’上
  - 种子文案结构参考：【痛点场景引入→核心卖点逐个拆解（降噪/续航/佩戴感）→适用人群画像→对比竞品优势→价格锚定+限时福利→行动号召】
  - 1. 编写结构化迁移Prompt（参考细纲P002概念）：
  - '   - 角色设定：你是资深带货文案专家'
  - '   - 任务：分析种子文案的卖点表达结构与人群画像，应用于新产品'
  - '   - 输入：种子文案（粘贴一篇真实爆款耳机文案），新产品卖点（挂脖免手/三档风速/静音/续航10h/适合通勤/户外/带娃妈妈），适用人群（地铁通勤/户外遛娃/办公室久坐人群）'
  - '   - 输出要求：严格保持种子文案段落结构不变，仅替换卖点内容与人群描述'
  - 2. 在ChatGPT中测试该Prompt，对比生成文案与种子文案的段落对应关系
  - 回答问题：
  - '- 生成文案中哪个段落最容易出现‘结构偏移’？为什么？'
  - '- 如果新产品卖点数量与种子文案不匹配（如种子5个卖点，新品只有3个），Prompt应如何调整？'
  - '- Temperature设为0.3 vs 0.7，生成文案的‘可控性’与‘生动度’有何差异？'
- 'no': 3
  title: 规划一个低成本AI短视频自动化生产线最小闭环（MVP）
  contents:
  - 场景：单人、零预算（仅用免费/低成本工具）、目标日产10条同赛道短视频（如‘AI工具测评’或‘书单推荐’），跑通‘选题→文案→图/视频→发布→数据回收’全流程
  - 1. 选赛道：在抖音/视频号/小红书搜索‘AI工具测评’或‘书单推荐’，找3个近期点赞>1w的对标账号，记录其选题方向、文案结构、视频形式（口播/混剪/图文成片）
  - 2. 建文案SOP：提炼对标账号通用文案结构（如‘工具名称+核心功能+实测痛点+避坑指南+免费获取方式’），写成结构化Prompt模板
  - 3. 搭建自动化链路（最小工具集）：
  - '   - 文案生成：ChatGPT网页版+Excel CONCAT批量Prompt+影刀RPA免费版（或Auto.js手机端）'
  - '   - 视频制作：剪映专业版（免费）‘图文成片’/‘关键帧动画’+本地素材库替换AI选素'
  - '   - 发布分发：手机端手动发布（初期量小）或RPA模拟发布'
  - '   - 数据回收：飞书/腾讯文档表格手工记录（播放/点赞/评论/转发/转化）'
  - 4. 执行7天测试：每日按SOP产出10条，发布后记录数据，第7天复盘
  - 回答问题：
  - '- 哪个环节最耗时？是否可进一步RPA化？'
  - '- 视频去重处理（镜像/调色/变速/贴纸/换BGM）在剪映中如何批量操作？'
  - '- 若第3天账号被限流（播放<100），如何判断是内容问题还是账号问题？如何低成本验证？'
  - '- 该MVP模型的边际成本（时间/金钱）是多少？规模化到日产100条需补充什么基建？'
- 'no': 4
  title: 复盘一个失败的‘风格化AI内容’项目，提炼‘赛道分层生存法则’教训
  contents:
  - 回顾/调研一个因‘单条制作过久、无法矩阵化、收益不稳’而放弃的AI内容项目（可参考细纲P005中‘风格化AI推文’案例或自行寻找）
  - 1. 记录该项目核心参数：
  - '   - 内容形式（纯原创文案/风格化AI图/固定人设/高代入感）'
  - '   - 单条制作耗时（文案/生图/配音/剪辑/发布各环节用时）'
  - '   - 发布频次与持续天数'
  - '   - 变现数据（播放中位数/爆款率/变现金额/ROI）'
  - '   - 放弃时的核心痛点'
  - 2. 对标‘赛道分层生存法则’（细纲P005定理）：
  - '   - 该项目属于哪一层？（女频批量/男频风格化/短剧CPS/解压素材/其他）'
  - '   - 为何该层级特性与‘风格化高耗时’矛盾？'
  - '   - 若转向‘标准化矩阵操作’（如模板化文案+批量混剪+多账号分发），预估效率提升多少倍？'
  - 回答问题：
  - '- ‘精神洁癖’（过度打磨单条质量）在商业变现早期的机会成本如何量化？'
  - '- 如何判断一个赛道‘适合风格化’还是‘适合矩阵化’？给出3个判断指标'
  - '- 如果重来一次，你会在什么节点（第几条/第几天/什么数据信号）果断转型？'
units:
- 'no': 1
  name: ChatGPT+RPA协同自动化架构 —— 内容引擎与执行器模式
  points:
  - '**为什么需要这个概念？**'
  - '- 单纯会用ChatGPT不赚钱，必须将业务拆解为标准化SOP，注入Prompt工程，再用RPA串联成自动化流水线'
  - '- AI降低了‘从0到1’的技能门槛，但提高了‘从1到N’的标准化要求'
  - '- 长尾高频办公自动化需求（如文案批量生成）未被标准SaaS覆盖，需低代码组合方案'
  - '**核心定义**'
  - '- LLM负责内容生成（文案/代码/分析），RPA负责数据搬运、跨应用交互、流程编排'
  - '- 两者通过标准化接口（剪贴板/文件/API）解耦，形成‘内容引擎+执行器’协作模式'
  - '**关键性质**'
  - '- 解决‘从1到100’的规模化执行问题，而非验证可行性（0到1）问题'
  - '- 手动流程跑通（SOP先行）是自动化前提，工具在后'
  - '- 可视化拖拽开发（影刀RPA），13次拖拽即可构建端到端文案自动化流程'
  - '**典型例子**'
  - '- Excel数据准备→Prompt批量构建→网页交互自动化（含流式输出等待）→结果回填表格'
  - '- 影刀RPA关键节点：获取网页句柄→打开表格→循环遍历（读Prompt→发送→等待流式输出结束→抓取最后一条回复→写回表格）'
  - '**边界条件**'
  - '- 必须显式处理ChatGPT网页版流式输出的‘等待输入完毕’节点，否则抓取不完整回复'
  - '- 适用于高频、重复、规则固定的长尾场景，非标准化决策环节仍需人工介入'
