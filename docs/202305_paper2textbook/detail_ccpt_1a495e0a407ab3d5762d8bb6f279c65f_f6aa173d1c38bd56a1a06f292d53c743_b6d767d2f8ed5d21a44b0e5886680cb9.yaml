  excerpts:
  - A、录制给家长看的视频：想象成自己再跟妈妈聊天。
  - B、录制给学生看的视频：想象成学生犯错了，你把他叫来办公室，跟他谈心。
  - C、录制气氛紧张的视频：想象自己想上厕所，很憋很憋，就想赶快说完去上厕所。
  - 青铜：场景扁平化，后面一排书架... 王者：会找一个墙角，再稍微放点 绿植、暖光灯、摆件 作为背景稍微装饰一下，使空间瞬间变得有层次感，人物主体更立体。
  - 赠送 3 个“角色扮演”小技巧... 剪映的“提词器”
- 'no': 8
  name: 书单带货四代形态进化与红利窗口期论 —— 内容形式的“生命周期”管理
  points:
  - '**为什么需要这个概念？**'
  - '- 同一赛道内容形式有明确生命周期：红利期（自然流易爆）→ 成熟期（必须投流）→ 衰退期（ROI为负）'
  - '- 新手易陷入“守着过时形态不投流”或“盲目跟风新形态无能力”的认知误区'
  - '- 需建立“形态-阶段-玩法”匹配的动态认知框架，做对的事在对的时间'
  - '**核心定义**'
  - '- 四代形态：A4书单(2019极简丢书)→ 笔记书单(2021笔记呈现)→ 讲座书单(2022权威人设)→ 划线书单(2019至今高光金句可视化)'
  - '- 核心逻辑恒定：大道至简、低成本量产、内容形式极简化'
  - '- 红利窗口期规律：早期靠自然流，后期必须依赖投流（随心推/千川）维持'
  - '**关键性质**'
  - '- 形态迁移低成本：核心是“换皮不换骨”，同一选品/文案逻辑可快速适配新形态'
  - '- 跨平台迁移性：抖音验证过的形态迁移至视频号/快手，大概率仍具爆款潜质'
  - '- 跨风格迁移：图文/视频/口播/混剪等形式互为素材源，爆款基因可跨形态复用'
  - '**典型例子**'
  - '- 2019年A4书单巅峰：同行单条视频赚佣金50万，极简丢书动作即可收割红利'
  - '- 2021年笔记书单自然流：作者实操未投流即跑出爆款，验证形态红利期有效性'
  - '- 2023年划线书单投流依赖：作者观察不投流则无法起量，印证内容红利期结束必须付费'
  - '**边界条件**'
  - '- 形态红利期不可预测具体长度，仅能通过“竞争密度/投流渗透率/平台扶策”动态判断'
  - '- 晚入场者只能喝汤（跟风不吃肉），核心优势在于“尽早入场+配套投流能力”'
  - '- 形态迭代本质是“降低制作门槛+提高信息密度”，下一代形态必然更简单、更直击痛点'
  sources:
  - paper: docs/202305/20230516_086.md
    role: origin
  - paper: docs/202305/20230516_082.md
    role: apply
  excerpts:
  - 第一节、A4 书单（2019 年）... 第二节、笔记书单（2021）... 第三节、讲座书单（2022 年）... 第四节、划线书单（2019——至今都可以玩）
  - 那时候可把我羡慕坏了，我知道的时候，玩的人多了，所以赚了几千块钱... 划线书单... 因为别人花钱投流了，你没投，就这么简单
  - 跟风不吃肉，也能喝点汤。
- 'no': 9
  name: 爆款视频五种思维与六大底层传播逻辑 —— 短视频带货的“底层操作系统”
  points:
  - '**为什么需要这个概念？**'
  - '- 短视频带货看似玩技巧，实则拼认知；无底层思维模型，战术再勤奋也是战术性忙碌'
  - '- 需一套覆盖选题、制作、分发、变现全链路的认知清单，指导每一个决策节点'
  - '- 将隐性经验显性化为可传承、可考核、可迭代的标准化知识资产'
  - '**核心定义**'
  - '- 五种思维（心法层）：热点思维（蹭热度）、利他思维（给价值）、发散思维（一题多解）、创造性思维（差异化）、复盘思维（数据驱动迭代）'
  - '- 六大底层逻辑（骨架层）：选品、文案、拍摄、剪辑、投流、主播/人设 —— 缺一不可'
  - '**关键性质**'
  - '- 思维决定上限：五种思维决定你能看到什么机会、能想出什么差异化角度'
  - '- 逻辑决定下限：六大要素任一短板（如选品烂/文案弱/不会投流）都会导致项目失败'
  - '- 系统性缺一不可：单点突破（如只会剪辑）无法构建商业闭环，必须全链路具备及格线以上能力'
  - '**典型例子**'
  - '- 利他思维指导选题：不拍“这个产品多牛”，而拍“你如何用这产品解决xx痛点”，完播率翻倍'
  - '- 复盘思维驱动迭代：每条视频复盘完播/点击/转化数据，定向优化下一条素材的前3秒钩子/中间节奏/结尾引导'
  - '- 六大逻辑自查清单：新项目启动前逐项核对——选品定了吗？文案模板有吗？拍摄SOP有吗？剪辑模板有吗？投流会吗？人设立了吗？'
  - '**边界条件**'
  - '- 思维无法直接变现，必须通过六大逻辑落地为具体动作才能产生商业价值'
  - '- 六大逻辑权重随平台/阶段变化：早期内容权重高（文案/拍摄/剪辑），后期投流权重高（投流/选品/主播）'
  - '- 主播/人设非必需真人出镜，虚拟IP/笔记人设/聊天记录截图均可承载“人设”功能'
  sources:
  - paper: docs/202305/20230516_086.md
    role: origin
  excerpts:
  - A、热点思维 B、利他思维 C、发散思维 D、创造性思维 E、复盘思维
  - 爆款带货短视频具有传播性的六大底层逻辑：选品、文案、拍摄、剪辑、投流、主播/人设
  - 既是文案、摄影、剪辑、投手，同时也是运营，所以熟悉整个闭环
- 'no': 10
  name: 抖音官方出圈效应与黄金前3秒留人技巧 —— 平台给的“作弊码”
  points:
  - '**为什么需要这个概念？**'
  - '- 算法推荐机制不透明，但官方公开的“出圈效应/留人技巧”是极少数确定性指引'
  - '- 前3秒流失率决定生死，黄金5秒未阐述核心 = 白花钱买流量'
  - '- 需将官方建议转化为可执行的拍摄/剪辑/文案标准动作'
  - '**核心定义**'
  - '- 三大出圈效应：人群出圈（大众化表达降低理解门槛）、内容出圈（反差冲突制造张力）、形式出圈（新奇特呈现制造新鲜感）'
  - '- 留人铁律：前3秒必须留人（视觉/听觉/认知钩子），黄金前5秒直接阐述核心重点（一句一句话讲清卖什么/有什么用）'
  - '**关键性质**'
  - '- 平台利益一致：官方建议本质是“让平台赚钱/留住用户”的指引，遵循即顺应算法逻辑'
  - '- 结构化强制动作：视频结构必须= 3秒钩子 + 5秒核心 + 中间干货/剧情 + 结尾引导，不可随意发挥'
  - '- 跨形态通用：无论书单/口播/混剪/真人出镜，前3秒/前5秒法则普适'
  - '**典型例子**'
  - '- 书单视频前3秒：直接展示书名金句/反认知观点（如“读完这本书，我才明白穷人为什么永远翻不身”）'
  - '- 口播带货前5秒：直接展示痛点+方案+产品（如“还在熬夜掉发？这款生发液21天长出绒毛，成分表只有三样东西”）'
  - '- 形式出圈案例：手写视频/第一人称视角/沉浸式Vlog/聊天记录截图等新奇呈现形式'
  - '**边界条件**'
  - '- 官方建议具有时效性，算法迭代可能导致“前3秒”最佳形式变化（如从视觉钩子变为听觉钩子）'
  - '- 标题党/夸大宣传虽能留人但违规风险高，需在“合规边界内”设计钩子'
  - '- 留人只是入场券，转化取决于中间价值塑造与结尾引导，不可本末倒置'
  sources:
  - paper: docs/202305/20230516_086.md
    role: origin
  excerpts:
  - A、出圈效应：人群出圈、内容出圈、形式出圈
  - B、如何让用户感兴趣：前3秒留人，黄金前5秒直接阐述核心重点
- 'no': 11
  name: 口播文案低成本获取三板斧 —— “不写文案”也能日产爆款脚本
  points:
  - '**为什么需要这个概念？**'
  - '- 文案是视频灵魂，但新手写不出、改不会、没灵感，文案生产是最大瓶颈'
  - '- 互联网内容高度同质化，爆款文案结构具有跨平台/跨账号可迁移性'
  - '- 需一套“拿来即用、低成本、高成功率”的文案获取标准化路径'
  - '**核心定义**'
  - '- A板斧：抄袭抖音爆款图文转口播（规避视频非原创判罚，属伪原创安全区，爆率70%+）'
  - '- B板斧：搬运小红书同类目爆款笔记对着镜头读（文案现成、逻辑通顺、爆率高）'
  - '- C板斧：蹭热榜/官方活动页流量红利（蹭平台自带流量话题，自带曝光属性）'
  - '**关键性质**'
  - '- 形式转换规避风控：图文→口播、小红书笔记→抖音视频，平台查重机制跨模态识别较弱'
  - '- 结构化复用：爆款文案=钩子+痛点+方案+产品+引导，仅需替换产品名/参数即可二创'
  - '- 成本极低：零原创成本，仅需筛选/改编/朗读时间，单人日产20+脚本可行'
  - '**典型例子**'
  - '- 搜索抖音“好物推荐”图文榜单，取前10爆款文案改为口播脚本，连拍7天出3条爆款'
  - '- 搬运小红书“考公资料”笔记文案，对着镜头读，配上书桌实拍，单条视频引流200+精准粉'
  - '**边界条件**'
  - '- 直接照搬不改风格/不植入个人人设/不优化前3秒钩子，大概率平庸'
  - '- 同质化竞争加剧：同一爆款文案被百人搬运，后发者需在表达/人设/场景上差异化'
  - '- 素材版权风险：小红书笔记/抖音图文受版权保护，商业化使用需注意合规边界'
  sources:
  - paper: docs/202305/20230516_086.md
    role: origin
  excerpts:
  - A、抖音里有很爆的图文... 你可以直接拿来读一遍发，爆率 70%以上。
  - B、小红书找笔记... 拿来对着镜头巴拉巴拉读一遍，爆率也很高。
  - C、蹭热榜/官方活动页流量红利。
