learning_targets:
- 掌握Stable Diffusion本地与云端部署的标准化流程（秋叶整合包/Colab），解决硬件门槛与环境配置痛点
- 理解核心三要素（大模型、提示词、LoRA）的强绑定关系与决定论层级，实现生成结果的稳定复现
- 熟练运用ControlNet三大核心模态实现姿势迁移、线稿上色、室内结构保持等精细控制
- 掌握局部重绘、涂鸦重绘、高清修复、超分后处理等精细编辑技能包，解决商业交付画质与细节问题
- 建立LoRA训练工业级五步SOP（数据洗净、参数配置、XYZ Grid测试、Metadata反推、业务落地），掌握减标签权重迁移机制
- 构建模型全生命周期管理闭环（获取筛选、目录存放、秋叶工具鉴别、PNG Info/Tagger反推复现）
- 设计工程化量产体系（Generate Forever + 多账号并行 + 打包下载），突破单点算力瓶颈实现批量出图
- 运用X/Y/Z脚本矩阵对比法量化参数边际收益，建立低配/高配差异化参数画像，拒绝玄学调参
- 将通用技能重组为产品设计、AI模特、建筑分镜三大商业化落地场景的标准化交付范式
