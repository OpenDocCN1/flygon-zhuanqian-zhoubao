  desc: 数据洗净→减标签权重迁移触发词→XYZ Grid量化测试→Metadata反推配方
- concept: 模型全生命周期管理
  desc: C站筛选→分类存放→秋叶工具鉴别→PNG Info/Tagger双轨复现→资产库闭环
- concept: 工程化量产体系
  desc: Generate Forever自动化+多账号并行扩容+打包下载，突破算力与文件获取瓶颈
