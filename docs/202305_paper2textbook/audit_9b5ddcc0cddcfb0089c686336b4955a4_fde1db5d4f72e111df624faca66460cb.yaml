unsupported_claims:
- location: '3.3'
  claim: 淘客模式结构性衰退定律包含'搜索权重机制失效(内容化改造)'这一环节
  reason: 素材中仅提到'淘宝内容化改造削弱搜索权重'，未明确表述为'搜索权重机制失效'，且未详细论证内容化改造如何直接导致搜索权重机制失效
- location: '3.4'
  claim: 快团团平台不收取技术服务费
  reason: 素材中提到'平台只收摊位费(技术服务费)'，与'不收技术服务费'表述矛盾
- location: '3.4'
  claim: 快团团商品价格更便宜是因为'免平台抽佣广告费'
  reason: 素材原文表述为'商家在快团团上售卖，是不需要缴纳这些佣金和平台广告费的'，但未对比验证快团团是否完全免除所有平台费用
- location: '3.5'
  claim: 帮卖团长需自担售前售后与信用背书责任
  reason: 素材中提到'售前和售后还是要帮卖团长自己去弄'，但未明确界定'信用背书责任'的具体法律边界
- location: '3.6'
  claim: 自由定价权将利润上限从'平台给多少'转变为'运营能跑出多少'
  reason: 素材中作者观察到'擅长运营的团长通过自由定价，将单品利润率从佣金率30%提升至综合利润率50%+'，但未提供大样本统计数据支撑该结论的普适性
- location: '3.7'
  claim: 有赞推出群团团是因为'商家续费挑战非常大'
  reason: 素材仅为作者推测'由于快团团这种平台出现，现在有赞的商家续费挑战非常大，所以有赞也推出了群团团'，缺乏有赞官方公开声明或第三方数据佐证
