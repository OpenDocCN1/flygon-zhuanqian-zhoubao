learning_targets:
- 理解 Stable Diffusion 核心三要素（大模型、提示词、LoRA）的强绑定关系与各自职责
- 掌握提示词结构化五段式模板法与权重语法，能编写高质量正向/负向提示词
- 理解随机数种子控制底层构图原理，掌握参数复现三要素（同模型+同LoRA+同Seed）实操流程
- 熟练使用 ControlNet 三大核心模式实现姿势迁移、线稿上色、室内结构保持
- 掌握局部重绘与涂鸦重绘实现像素级换装、换脸、指定配色编辑技巧
- 理解 VAE 滤镜作用与高分辨率修复显存权衡策略，能在低显存环境出大图
- 掌握后期超分模型分类选择（动漫用 Anime6B、真人用 GFPGAN/R-ESRGAN）
- 会用 PNG Info/Tagger 反推参数、脚本矩阵对比法量化参数边际收益
- 能根据硬件条件选择本地秋叶整合包部署或云端青椒云备选方案
- 建立模型全生命周期管理闭环：C站获取→分类存放→秋叶工具鉴别→一键复现
concept_map:
- Stable Diffusion 实操体系
- ├── 部署路径
- │   ├── 本地一键部署（秋叶整合包）
- │   │   ├── 解压非C盘 → 安装依赖 → 显存对齐 → 一键启动 → 报错自动修复
- │   │   └── 硬门槛：Win10/11 + N卡 + ≥8G内存 + ≥4G VRAM
- │   └── 云端备选部署（青椒云/AutoDL）
- │       ├── 注册实名 → 选AIGC镜像 → 启动器一键启动 → 用完关机止损
- │       └── 适用：Mac/低配/非N卡/临时大任务
- ├── 核心三要素
- │   ├── 大模型（Checkpoint）
- │   │   ├── 决定基因画风（真人/二次元/3D）
- │   │   ├── 存放：models/Stable-diffusion
- │   │   └── 原则：必须与LoRA画风域对齐
- │   ├── 提示词
- │   │   ├── 正向五段式：质量词+主体+细节+服饰+环境
- │   │   ├── 权重语法：(词:权重)、(词)、[词]
- │   │   ├── 负向万能模板：60+标签抑制90%缺陷
- │   │   └── 格式：英文、半角逗号、分行书写
- │   └── LoRA
- │       ├── 轻量微调：固定人物/动作/风格特征
- │       ├── 存放：models/Lora
- │       ├── 权重：建议≤1，叠加注意冲突
- │       └── 触发词：需在提示词中调用
- ├── 进阶控制
- │   ├── ControlNet
- │   │   ├── 统一入口：启用→上传→预览→切换模型
- │   │   ├── OpenPose：骨骼关键点→姿势迁移
- │   │   ├── Canny：边缘检测→线稿上色/保边（需反色）
- │   │   ├── M-LSD：几何线条→室内结构保持风格化
- │   │   └── 显存+1-2GB，参考图≥512px
- │   ├── 局部重绘
- │   │   ├── 蒙版涂抹→仅重绘指定区域
- │   │   ├── 换装/换脸/修手核心技能
- │   │   └── 边缘羽化4-8px，重绘幅度0.6-0.8
- │   └── 涂鸦重绘
- │       ├── 蒙区手绘色块→指定像素级配色
- │       ├── 结合提示词引导生成
- │       └── 大模型依赖性强（真人模型绿色→苔藓）
- ├── 画质增强
- │   ├── VAE
- │   │   ├── 作用：滤镜/调色板，修正灰蒙蒙色彩
- │   │   ├── 推荐：vae-ft-mse-840000（通用）
- │   │   └── 存放：models/VAE
- │   ├── 高分辨率修复
- │   │   ├── 两阶段：低分出图→放大重绘
- │   │   ├── Denoising：0.3-0.5（平衡细节/结构）
- │   │   ├── 放大算法：Latent(快)/R-ESRGAN 4x(细)
- │   │   └── 低显存方案：512基础+2x高清修复
- │   └── 后期处理
- │       ├── 超分：动漫→R-ESRGAN 4x+ Anime6B，真人→R-ESRGAN 4x+
- │       ├── GFPGAN：人脸专用（Upscaler=None，强度=1）
- │       └── 仅锦上添花，不可修结构性错误
- ├── 复现与调优
- │   ├── 参数复现三要素
- │   │   ├── 同大模型 + 同LoRA组合权重 + 同Seed
- │   │   └── PNG Info(SD原生图) / Tagger(任意图) 辅助获取
- │   ├── 脚本矩阵对比
- │   │   ├── X/Y/Z图表：采样器×步数×CFG网格搜索
- │   │   ├── 提示词矩阵：关键词|对比词 单词增删效果
- │   │   └── 实测结论：25步边际递减、采样器趋同、CFG 7-9最优
- │   └── 模型全生命周期管理
- │       ├── 获取：C站筛选/图片反推下载
- │       ├── 存放：按类型分目录
- │       ├── 鉴别：秋叶工具拖拽识别类型/触发词/预览图
- │       └── 命名：类型_画风_版本_触发词.safetensors
- └── 教学范式
- '    ├── 实操优先：先跑通核心流程产出首图建立信心'
- '    ├── 原理按需：卡在哪补哪（如ControlNet注入层机制）'
- '    ├── 模板化降维：五段式公式/万能负面词/速查表直接复用'
- '    ├── 资源包兜底：模型/LoRA/提示词/工作流一键下载'
- '    └── 容错设计：疑难解答一键修复/常见坑位预置方案'
life_analogy:
- 想象 Stable Diffusion 是一个**专业摄影棚的全套流程**：
- '- **大模型** = **底片/相机机型**：决定画面的基因画质（胶片质感/数码锐度/红外风格），拍摄前必须选对'
- '- **提示词** = **导演给摄影师的分镜头脚本**：「主体穿红裙、站在海边、夕阳逆光、85mm定焦、虚化背景」，按五段式结构下达指令'
- '- **LoRA** = **专用滤镜/预设动作/特定演员贴纸**：「套用『周杰伦脸』贴纸」「加载『赛博朋克』滤镜」「叠加『瑜伽姿势』预设」，权重决定浓淡'
- '- **随机数种子** = **快门按下那一刻的微观光子噪声**；固定 Seed = 复刻同一时空的胶片底片'
- '- **ControlNet** = **绿幕动作捕捉/线稿投影仪/建筑蓝图**；强制规定「骨架动作/轮廓边界/墙体结构」不可违背'
- '- **局部重绘** = **后期修图师的蒙版抠图换装**；只动衣服不动脸，羽化边缘无痕融合'
- '- **涂鸦重绘** = **修图师在蒙版上涂色块指定面料颜色**；「袖子涂蓝、裙子涂粉」，AI 自动补全丝绒/雪纺质感'
- '- **VAE** = **调色师的统一 LUT/滤镜预设**；统一修正相机直出的「偏灰/低饱和」为通透肤色'
- '- **高分辨率修复** = **先拍小样定构图，再用超分放大器放大补细节**；避免直接出大片爆内存/崩构图'
- '- **后期超分/GFPGAN** = **成片后的专项补救站**；动漫锐化线条、真人修复人脸压缩伪影'
- '- **脚本矩阵对比** = **批量拍摄测光/测色/测构图的联机拍摄模式**；一次性看遍 9 组参数组合，肉眼挑最优'
- '- **模型管理** = **器材室分类架**：机身(大模型)/镜头(LoRA)/滤镜(VAE)/灯光预设(ControlNet)——按类归位、拖拽即识别、一键复刻'
- 就像摄影棚「选机型→下脚本→贴预设→定噪声→架绿幕→局部改→统一调→放大补→批量测→器材归位」，SD 也需要按这套标准化 SOP 才能从盲盒走向工业级稳定产出。
summary:
- concept: 大模型/提示词/LoRA 三要素
  desc: SD 生成的核心三角：模型定画风基因、提示词控细节内容、LoRA锁特定特征，三者强绑定且画风域必须对齐
- concept: 提示词五段式公式
  desc: 质量词+主体+主体细节+服饰配饰+环境构图光影，英文半角逗号分行，配合权重语法精准控制生成关注度
- concept: 万能负面词模板
  desc: 包含 worst quality/bad anatomy/bad hands/watermark 等 60+ 标签，一键抑制多指、畸形、低画质、水印等
    90% 常见缺陷
- concept: 随机数种子
  desc: 控制初始噪声模式决定底层构图轮廓；-1随机，固定值配合其余参数一致可 1:1 复现同一张图
- concept: 参数复现三要素
  desc: 完整复现需同时满足：相同大模型、相同 LoRA 组合权重、相同 Seed，缺一不可
- concept: ControlNet 三大模式
  desc: OpenPose 姿势迁移、Canny 线稿上色保边、M-LSD 室内结构保持风格化重设计，统一预处理器入口像素级可控
- concept: 重绘幅度守恒论
  desc: 幅度<0.5微调细节、0.6-0.8风格迁移保结构(二次元/换装黄金区)、>0.9近似文生图，按任务类型定点选择
- concept: 局部重绘/涂鸦重绘
  desc: 蒙版指定区域无缝融合换装换脸；涂鸦手绘色块实现像素级指定配色（蓝袖粉裙黄花纹）
- concept: VAE 与高分辨率修复
  desc: VAE充当滤镜修正色彩(推荐vae-ft-mse-840000)；高清修复两阶段生成(低分出图→放大重绘Denoising 0.3-0.5)破解显存瓶颈出大图
- concept: 后期超分模型分类
  desc: 动漫用 R-ESRGAN 4x+ Anime6B 锐化线条平滑色块；真人用 R-ESRGAN 4x+；GFPGAN 仅修人脸(强度=1)不改背景
- concept: 脚本矩阵对比法
  desc: X/Y/Z 图表网格化对比采样器×步数×CFG 等参数组合，量化边际收益：25步后递减、采样器趋同、低配定参25步+高速采样器
- concept: 本地/云端双轨部署
  desc: 本地首选秋叶整合包(解压即用/报错自修)；云端备选青椒云(按分钟计费/AIGC镜像/用完关机)覆盖 100% 学习者
- concept: 模型全生命周期管理
  desc: C站获取→分类存放(models目录)→秋叶工具鉴别(类型/基模/触发词/预览图)→标准化命名→参数资产库闭环
- concept: 实操优先教学范式
  desc: 跳过扩散模型数学原理，案例驱动→模板复用→资源包兜底→容错设计，让奶奶级小白 5 分钟部署、10 分钟出图、15 分钟玩转 ControlNet
exercises:
- 'no': 1
  title: 手动部署与首图产出
  contents:
  - 1. 根据你的硬件（Win + N卡 / Mac / 核显本本），选择秋叶整合包本地部署或青椒云云端部署，完成 WebUI 启动并截图保存。
  - 2. 在 WebUI 中切换大模型为 ChilloutMix（真人）或 Anything V5（二次元），下载并放入对应 models 目录。
  - 3. 复制教程提供的「万能正向词」与「万能负面词」到对应输入框，步数设为 25，采样器 DPM++ 2M Karras，分辨率 512×768，生成第一张满意图片。
  - 4. 固定该图的 Seed，仅修改提示词中的「主体服装」词（如改「red dress」→「white shirt, jeans」），再次生成，观察构图保持、服装变化的效果。
  - 回答问题：
  - '- 为什么建议新手分辨率锁定 512×512 或 512×768？'
  - '- 当你切换大模型但保持 Seed 不变时，画面会发生什么变化？为什么？'
- 'no': 2
  title: ControlNet 三大模式实战通关
  contents:
  - 准备三张参考图：一张人体动作图（瑜伽/舞蹈）、一张干净线稿图（漫画/草图）、一张室内实拍图（毛坯房/样板间）。
  - 任务 A（OpenPose）：上传动作图，启用 ControlNet → 预处理器/模型选 openpose → 预览骨骼点 → 搭配真人大模型+真人 LoRA
    → 生成「同人同脸、指定动作」图。
  - 任务 B（Canny）：上传线稿图，启用 ControlNet → 勾选「反转输出颜色」→ 预处理器/模型选 canny → 输入风格词「cyberpunk,
    neon light, masterpiece」→ 生成精准着色图。
  - 任务 C（M-LSD）：上传室内图，启用 ControlNet → 预处理器/模型选 mlsd → 切换写实大模型 → 输入「japanese style,
    tatami, shoji, zen garden」→ 生成结构不变、风格化重设计图。
  - 回答问题：
  - '- Canny 模式为何必须开启「反转输出颜色」？不开会怎样？'
  - '- M-LSD 生成的室内图若出现「墙体弯曲/门窗位移」，可能是哪个环节没做对？'
- 'no': 3
  title: 参数复现与矩阵调优挑战
  contents:
  - 1. 找一张 C 站或群友分享的带完整参数的 PNG 图，使用 PNG Info 面板导入，点击「Copy Data」→ 粘贴到 WebUI → 点击分配按钮（文档带箭头图标）→
    手动切换到同名大模型 → 生成，对比与原图的相似度。
  - 2. 若该图无元数据（微信转发/截图），改用 Tagger（WD14）反推标签，手动组装提示词，选相近大模型尝试风格迁移。
  - 3. 运行脚本矩阵对比：
  - '   - X 轴：迭代步数 → 值：20, 25, 30, 35'
  - '   - Y 轴：采样器 → 值：Euler a, DPM++ 2M Karras, DDIM'
  - '   - 固定提示词、模型、Seed、分辨率 512×512、CFG 7'
  - '   - 生成 3×4 网格大图，肉眼标注「画质可接受的最小步数」与「主观最喜欢的采样器」。'
  - 回答问题：
  - '- 为什么不同采样器在 25 步后趋同？这对低显存用户有何指导意义？'
  - '- 复现他人图片时，即使参数全同，为何仍可能出现「细微像素级差异」？列举至少 3 个原因。'
- 'no': 4
  title: 模型资产库建设与全生命周期演练
  contents:
  - 1. 在 C 站按类型筛选下载：1 个真人大模型、1 个二次元大模型、2 个真人 LoRA、2 个二次元 LoRA、1 个 VAE、1 个 ControlNet
    模型。
  - 2. 严格按目录存放：models/Stable-diffusion / models/Lora / models/VAE / models/ControlNet
    / embeddings。
  - 3. 使用秋叶启动器「模型分析工具」拖拽每个 .safetensors 文件，记录：类型、基模（SD1.5/SDXL）、触发词、预览图风格。
  - 4. 按命名规范重命名：如 `Checkpoint_realistic_chilloutmix_v1.safetensors`、`Lora_koreanDollLikeness_v2_kdrama.safetensors`。
  - 5. 建立一个 Excel/Notion 资产表，字段含：文件名、类型、基模、触发词、C站链接、本地路径、适用场景、备注。
  - 回答问题：
  - '- 为什么强制要求 .safetensors 格式而非 .ckpt？'
  - '- SD1.5 训练的 LoRA 能否直接用在 SDXL 大模型上？会发生什么？'
- 'no': 5
  title: 低显存环境下的高清大图生成方案设计
  contents:
  - 假设你只有 RTX 3060 8GB / 笔记本 4GB 显存，需要生成 1024×1536 分辨率的竖版海报图。
  - 设计完整参数方案：
  - 1. 基础分辨率设多少？为什么？
  - 2. 是否开启高分辨率修复？放大算法选 Latent 还是 R-ESRGAN 4x？Denoising Strength 定多少？
  - 3. VAE 是否必须加载？推荐哪个？
  - 4. 采样器、步数、CFG 如何取值以兼顾速度与质量？
  - 5. 生成后是否还需后期超分？若需，动漫/真人分别选哪个模型？
  - 在 WebUI 中实测该方案，记录：显存峰值占用、单张耗时、成图主观评分（1-10 分）。
  - 回答问题：
  - '- 如果把基础分辨率直接设为 1024×1536 关闭高清修复，会发生什么？'
  - '- 高清修复的 Denoising Strength 设为 0.1 和 0.9 分别会有什么后果？'
