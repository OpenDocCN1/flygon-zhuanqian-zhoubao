unsupported_claims:
- location: '21.3'
  claim: 通常来说，至少前两天前五篇都不要复制营销性质的爆款
  reason: 素材中未明确提及'前两天前五篇'的具体时间限制，仅提到'前期不挂车，只发内容视频'等泛泛之谈
- location: '21.5'
  claim: 严禁用AI生成标题，实测数据驱动标题套用法效果显著优于AI创作
  reason: 素材中虽有'我也试过用chatGPT取标题，但效果并不满意'的个人经验，但无系统性A/B测试数据支撑'显著优于'的结论
- location: '21.9'
  claim: 企业号抗风险能力实测验证
  reason: 素材中仅有一句'我们试过升级成企业号，事实证明确实更抗风险'，缺乏对比实验数据、样本量、测试周期等验证细节
- location: '21.9'
  claim: 单号日承接200人上限（5群×40人）
  reason: 素材中虽有'一个号可以建5个群，目测最多可拉40人'的描述，但'目测'非实测，且未说明是否触发风控、封群概率、账号存活周期
- location: '21.9'
  claim: 表情包引流规避图片OCR识别
  reason: 素材中仅提到'建议使用隐晦词汇，试过发图片也提醒违规，所以才做成表情'，未技术性解释为何表情包能绕过OCR，平台是否升级识别策略
