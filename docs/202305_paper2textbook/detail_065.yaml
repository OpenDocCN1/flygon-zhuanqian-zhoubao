    成功上车'
  - '**边界条件**'
  - '- SOP 需随工具迭代更新（如 Unisat 版本更新、新平台出现）'
  - '- 核心参数（Gas 倍数、进度阈值）需根据具体项目拥堵预期微调，不可生搬硬套'
