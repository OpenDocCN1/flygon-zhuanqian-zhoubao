learning_targets:
- 理解 Web3 高不确定性环境下‘认知破偏见’是捕捉红利的前提条件
- 掌握‘运气表面积’与‘Alpha 信息源’的获取与筛选方法论
- 掌握 BRC20 Mint 全流程标准作业程序（SOP）与动态 Gas 博弈模型
- 能够建立‘把鞋弄脏’的小步试错闭环，将隐性知识内化为可复用原则
- 建立极端环境下的身心管理机制与‘落袋为安’的止盈纪律体系
- 识别谣言套利陷阱，建立‘验证猜想、知行合一’的信息验证纪律
- 理解 Web3‘98%项目归零’铁律下，时机选择优于价值分析的生存法则
concept_map:
- Web3 实战认知与方法论
- ├── 认知底座
- │   ├── 认知破偏见（抛弃偏见去机会多的地方）  —— P001
- │   ├── 运气表面积（主动增加遭遇好运的概率）     —— P002
- │   └── Web3 生存铁律（98%归零，核心竞争力是时机选择）  —— P010
- ├── 信息与执行体系
- │   ├── Alpha 信息源（接入已筛选的高质量情报网络）  —— P003
- │   ├── 把鞋弄脏（亲身下场获取隐性知识护城河）      —— P004
- │   ├── 小步试错、快速迭代（OODA循环替代完美计划）  —— P010
- │   └── 谣言套利与信息验证纪律（验证猜想、知行合一）  —— P006
- ├── 链上实战技术栈
- │   ├── BRC20 Mint 标准作业程序 (SOP) 10步闭环  —— P009
- │   ├── 动态 Gas 博弈模型（非线性阈值/进度-拥堵动态调整）  —— P005
- │   └── 备用方案预案（提币通道/平台切换）       —— P009
- └── 身心与纪律系统
- '    ├── 极端环境身心管理（生理/情绪/外部支持维持决策力）  —— P007'
- '    └── 落袋为安纪律（克服贪婪/预设止盈触发条件/规避虚空价格）  —— P008'
life_analogy:
- 想象 Web3 实战是一场**暴风雨中的深海捕鱼**：
- '- **认知破偏见** = 把‘鱼只在浅水区’的旧航海图扔掉，敢于驶向未知的深海（新赛道）'
- '- **运气表面积** = 撒更大的网（好奇心/视野），多出海（行动），自然多撞上鱼群（机会）'
- '- **Alpha 信息源** = 装上老渔民给的‘秘密渔场坐标’（高质量社群情报），少跑空趟'
- '- **把鞋弄脏** = 自己下水摸清水温、暗礁、水流（隐性知识），岸上看书永远学不会‘手感’'
- '- **动态 Gas 博弈** = 捕鱼高峰期（网络拥堵）必须出高价买最好的燃油（Gas拉满）抢航道，尾声时（进度99%）精准加速锁定渔获'
- '- **谣言套利与验证纪律** = 无线电里传来‘这儿有大鱼’（谣言），不盲目冲，先用探鱼器（链上数据）确认，是假信号就无视'
- '- **极端环境身心管理** = 暴风雨持续 19 小时（凌晨 3 点到晚 10 点），靠听戏（娱乐缓解焦虑）、眯会儿（生理恢复）、爱人陪伴（外部支持）不晕船、不抽筋，保持手稳'
- '- **落袋为安纪律** = 鱼仓装满（浮盈 10 倍），暴风眼将至（CEX 上线/前端崩溃），立即收网回港（止盈离场），不贪那最后一网‘虚空价格’'
- '- **BRC20 Mint SOP** = 出海前的标准化检查清单：船况（钱包）、油料（BTC/备用提币）、渔具（平台/工具）、演练（模拟 5-6 遍）、试航（小额测试）、实战（开抢/监控/调参/收网/卸货）'
summary:
- concept: 认知破偏见
  desc: 抛弃固有认知框架，前往流动性最高的新赛道试错，认知升级先于行动致胜
- concept: 运气表面积
  desc: 通过好奇心、扩展视野、心态豁达主动增加遭遇高质量机会的概率面
- concept: Alpha 信息源
  desc: 接入具备筛选能力的社群/大佬网络，利用他人筛选体系获取早期可执行情报
- concept: 把鞋弄脏
  desc: 亲身下场承担风险体验细节，将显性教程内化为隐性实战肌肉记忆（Gas策略/节奏/直觉）
- concept: 动态 Gas 博弈模型
  desc: 基于实时拥堵度、Mint进度、竞争预判动态调整 Gas 定价，寻找区块空间拍卖的非线性‘生死线’
- concept: BRC20 Mint SOP
  desc: 覆盖钱包准备、资金备用、平台选择、资料模拟、小额测试、参数设定、信息监控、动态调参、尾部锁定、打包转移的 10 步标准化作业程序
- concept: 谣言套利与信息验证纪律
  desc: 面对谣言驱动的价格畸变，以链上数据+权威源验证真伪，有纪律地放弃不理解的套利
- concept: 极端环境身心管理
  desc: 在长时高强博弈中，通过娱乐、休息、情绪稳定、外部支持维持决策力在线，不掉线
- concept: 落袋为安纪律
  desc: 浮盈高位预设止盈触发条件（CEX上线/前端崩溃），克服贪婪将纸面富贵变为真钱
- concept: Web3 生存铁律
  desc: 98%项目归零，基本面分析失效，唯一核心技术是‘时机选择’（早发现、早执行、早离场）
exercises:
- 'no': 1
  title: 设计你的 BRC20 Mint 实战 SOP 检查清单
  contents:
  - 假设你要参与一个新的 BRC20 代币 Mint（如 $NEW）
  - 请列出你的 10 步 SOP 清单，必须包含：
  - 1. 钱包与资金准备（含备用提币通道）
  - 2. 资料获取与模拟演练（几遍？怎么算通过？）
  - 3. 小额实战测试（测什么关键指标？Gas底价？确认速度？）
  - 4. 核心参数设定（初始 Gas 倍数、进度阈值、调整步长）
  - 5. 信息监控渠道（倒计时页、创始人推特、Mempool、社群）
  - 6. 动态调参决策树（前期拥堵/中期死守/尾部窗口的具体 Gas 策略）
  - 7. 身心管理预案（熬夜方案/焦虑缓解/外部支持）
  - 8. 落袋为安触发条件（目标倍数/CEX上线时间/前端异常判定/止盈比例）
  - 9. 异常熔断机制（钱包被盗/网络故障/资金不足/平台维护）
  - 10. 复盘模板（投入/产出/关键决策点复盘/隐性知识沉淀）
- 'no': 2
  title: 构建个人 Alpha 信息源评估矩阵
  contents:
  - 列出你目前关注的 5-10 个 Web3 信息源（KOL/社群/媒体/研报）
  - 为每个信息源打分（1-5 分）：
  - '- 历史准确率（过往推荐项目收益/坑项目预警）'
  - '- 信息时效性（早期/独家/二手转发）'
  - '- 筛选透明度（是否分享筛选逻辑/复盘失误）'
  - '- 利益绑定度（是否带单/收费/持仓披露）'
  - '- 互动响应度（答疑/辟谣/补充细节的速度）'
  - 根据总分分级：核心源（≥20 分，重点监控/小额跟投）、参考源（15-19 分，辅助验证）、噪音源（<15 分，取关/静音）
  - 回答问题：
  - '- 你的核心源中，有几个在 2021 年 NFT/2023 年 BRC20 早期发出过明确信号？'
  - '- 如何设计‘小步试错’机制，用极低成本验证新来源的可靠性？'
- 'no': 3
  title: 模拟极端环境下的身心与决策压力测试
  contents:
  - 场景：凌晨 3 点开启 Mint，预计持续到次日 10 点。网络极度拥堵，页面频繁 503/卡死，Gas 从 250 飙至 600+，你的交易卡在‘待打包’
    2 小时未动，浮盈从 0 到 5 倍再回落到 2 倍，群里谣言满天飞，创始人推特沉默。
  - 请书面推演你的应对流程：
  - 1. 生理层面：如何安排休息/进食/姿势，避免身体崩溃导致决策变形？
  - 2. 心理层面：如何处理 FOMO（错失恐惧）、损失厌恶、贪婪上头三种核心情绪？有什么具体的‘心理锚’或‘口诀’？
  - 3. 决策层面：在信息不全时，如何判断‘继续加 Gas’ vs ‘放弃本批次等尾部’ vs ‘切换备用平台/方案’？决策依据是什么？
  - 4. 信息层面：如何在谣言满天飞时，建立‘验证猜想’的最小动作闭环（查链上数据/看创始人推特/问核心源）？
  - 5. 事后复盘：设计一张‘实战复盘卡’，记录关键时间节点、Gas 变化、决策动作、结果、隐性知识沉淀，形成下一次的‘肌肉记忆’
units:
- 'no': 1
  name: 认知破偏见 —— 把偏见当作发现新赛道的‘反向指标’
  points:
  - '**为什么需要这个概念？**'
  - '- 新赛道（如 BRC20）初期往往伴随认知冲突，固有经验会变成‘认知拦路虎’，导致错过红利期（作者因偏见错过 2021 年 NFT）'
  - '- 偏见的本质是‘用旧地图找新大陆’，必须主动打破才能进入高流动性赛道'
  - '**核心定义**'
  - '- 抛弃偏见：强迫自己去理解新事物，前往流动性和热度最高的赛道试错，而非用旧框架评判新事物'
  - '- 认知升级先于行动致胜：心智模型更新是捕捉机会的必要前提，行动是认知变现的结果'
  - '**关键性质**'
  - '- 反直觉：人本能地厌恶不确定性，偏见是大脑的‘省力模式’，打破它需要刻意练习'
  - '- 可迁移：思维框架比单次收益更有价值，可复用到不同周期、不同赛道'
  - '**典型例子**'
  - '- 作者 2021 年因‘比特币只能存储价值’的偏见错过 NFT；2023 年强迫自己研究 BRC20，凌晨三点实战 VMPX，验证框架有效性'
  - '**边界条件**'
  - '- 仅适用于‘高不确定性、高波动率’的新兴赛道，成熟市场需基本面分析'
  - '- 必须配合‘小步试错’与‘风控纪律’，否则易变为盲目冲动'
  sources:
  - paper: docs/202305/20230516_044.md
    role: origin
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: improve
  excerpts:
  - '5 月 8 号凌晨三点冲 #VMPX 也是因为最近摒弃了一些偏见后的第一次实战'
  - 答案是：抛掉偏见去机会多的地方
  - 这次看到 BRC20 我就强迫自己去了解。
  - 文章里面关于 Web3 里面的思考和框架可复用
- 'no': 2
  name: 运气表面积 —— 主动增加遭遇‘好运’的概率面
  points:
  - '**为什么需要这个概念？**'
  - '- Web3 机会稍纵即逝，纯靠等待‘运气降临’胜率极低'
  - '- 需要一套可量化、可执行的‘制造运气’方法论，替代被动祈祷'
  - '**核心定义**'
  - '- 运气表面积：通过保持好奇心、扩展视野、心态豁达、多想好的一面等主观行为，主动增加单位时间内遭遇高质量机会的概率'
  - '- 核心公式：你不能改变运气，但可以改变‘运气的运气’（引用《天赋与运气》研究）'
  - '**关键性质**'
  - '- 可积累：阅读、社交、实操每一次‘把鞋弄脏’都在扩大表面积'
  - '- 非线性：微小的认知/行动改变，可能引发指数级的机会捕获'
  - '**典型例子**'
  - '- 作者加入‘七爷社群’获取 Alpha 信息源，利用他人筛选体系小步试错，最终捕捉 VMPX 机会'
  - '**边界条件**'
  - '- 不等于盲目乐观，必须配合‘信息验证纪律’与‘风控止损’'
  - '- 表面积大只能增加‘撞大运’概率，能否‘接住运气’取决于实战执行力'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 你不能改变运气，但是可以改变运气的运气
  - 保持积极好奇心、扩展视野、心态豁达，遇事多想好的一面，少想坏的一面，好运气就会多一点。
  - 在 Web3 ，这种消息叫 Alpha ，机会总给那些愿意行动起来的人。
- 'no': 3
  name: Alpha 信息源 —— 接入‘已被筛选过的高质量情报网络’
  points:
  - '**为什么需要这个概念？**'
  - '- Web3 信息过载、噪音极大，个人筛选成本极高、易被割韭菜'
  - '- 需要借力‘他人的筛选体系’，实现信息获取的杠杆效应'
  - '**核心定义**'
  - '- Alpha：Web3 行业内指高质量、早期、可执行的投资情报'
  - '- Alpha 信息源：具备筛选能力、愿分享早期情报的社群/大佬/渠道（如七爷社群）'
  - '**关键性质**'
  - '- 信任传递：基于过往验证（如作者曾在 XEN 喝汤）建立的信任链'
  - '- 时效性强：Alpha 衰减极快，必须‘小步试错、快速迭代’'
  - '**典型例子**'
  - '- 作者重视七爷转发的 VMPX 消息，因之前在 XEN 项目中跟随该源获益，完成信任闭环'
  - '**边界条件**'
  - '- 严禁盲目跟单，必须‘验证猜想、知行合一’（如作者验证‘破解代币名称’谣言后放弃套利）'
  - '- 权限门槛：部分 Alpha 需平台资质（Unisat 积分/OG PASS）才能参与，需提前布局'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 在 Web3 ，这种消息叫 Alpha ，机会总给那些愿意行动起来的人。
  - 昨天看到七爷在群里转发 VMPX 的相关消息...因为我之前在 XEN 里面喝了点汤，所以就很重视。
  - 验证猜想、知行合一、不盲目追涨
- 'no': 4
  name: 把鞋弄脏 —— 亲身下场才能获得的‘隐性知识护城河’
  points:
  - '**为什么需要这个概念？**'
  - '- 岸边观望永远学不会链上实战的‘生死细节’（Gas 博弈、网络拥堵应对、界面卡顿）'
  - '- 显性知识（教程）只占 20%，隐性知识（手感、节奏、直觉）决定 80% 成败'
  - '**核心定义**'
  - '- 把鞋弄脏：指亲身承担风险、体验细节、忍受痛苦（网络拥堵、Gas 波动、熬夜）的全过程实操'
  - '- 隐性知识：如 Gas 存在动态生死线、Mint 进度与网络拥堵的非线性关系、前端崩溃时的操作备选方案'
  - '**关键性质**'
  - '- 不可复制粘贴：只能通过‘小额实战测试 → 总结原则 → 全力执行’的 OODA 循环内化'
  - '- 复利增长：每次实战都在为下一次积累‘肌肉记忆’'
  - '**典型例子**'
  - '- 作者模拟 5-6 遍后小额实战测试 Gas 底价，发现‘Gas 给底则鸡飞蛋打’，确立‘Gas 拉满’核心原则，最终在 99.6% 进度调高 Gas
    至 800 上车'
  - '**边界条件**'
  - '- 成本可控：仅用‘能承受损失的小额资金’弄脏鞋，而非梭哈'
  - '- 必须复盘：不复盘的实战只是‘交学费’，不是‘把鞋弄脏’'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 把鞋弄脏，遇到机会的时候，站在岸边指点评价总是容易的，真正投身其中才能感受风浪，风浪越大，鱼越贵。
  - 对着教程开始反复模拟（很重要，要不断模拟测试问题）；模拟了五六遍后觉得没大问题时，开始实操
  - 找了几个 mint 进度 80%——90% 的项目 ，走了几遍流程...才理解了教程里面说的 gas 给底的话，很可能鸡飞蛋打。
  - 基于以上实操，给下一步抢 VMPX 定了个操作原则：gas 拉满抢！
  - 直到 mint 进度到了 99.6%...我把 gas 调到了 800，终于...赶上了末班车
- 'no': 5
  name: 动态 Gas 博弈 —— 在区块空间拍卖中寻找‘生死线’的动态平衡术
  points:
  - '**为什么需要这个概念？**'
  - '- BRC20 Mint 本质是‘区块空间拍卖’，静态 Gas 策略在拥堵度剧变时必死'
  - '- 需要一套随网络拥堵度、Mint 进度、竞争对手行为动态调整的定价模型'
  - '**核心定义**'
  - '- 动态 Gas 博弈模型：基于实时拥堵度、进度、预判竞争对手的 Gas 定价动态调整方法'
  - '- 核心逻辑：前期极度拥堵→Gas 需远超均价（550 仍卡死）；中期死守；后期进度>99%且网络缓解→适度提高 Gas（800）抢末班车'
  - '**关键性质**'
  - '- 非线性阈值：Gas 250（均价）→必败；550（2倍）→卡死；800（尾部窗口）→成功，存在‘生死线’'
  - '- 信息不对称利用：监控创始人推特、Mempool 状态、进度条，比对手快半拍决策'
  - '**典型例子**'
  - '- VMPX 实战：开盘 Gas 250→作者调 550 卡死；进度 99.6% 网络缓解→调 800 成功打包，验证动态策略有效性'
