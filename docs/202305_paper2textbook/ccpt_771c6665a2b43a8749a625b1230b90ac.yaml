paper: docs/202305/NsZwdMgSxovqfxxgJqFc5XtXntb.md
desc: 该素材为资深金融从业者老吴的实战复盘，记录其从年负债19万到年净收益近百万的财富跃迁路径。核心内容包含：建立以记账为基础的财务体系、分三阶段的风险测算与资金管理体系、六大实操投资项目（股票经纪人、超短线股票投资、淘宝客返利、可转债打新、四大行存款套利）的像素级复盘、四大投资避坑案例，以及“稳、靠谱、利他、真诚”底层认知的进阶感悟。素材强调以“被动收入”为锚点，通过信用体系建设、信息差套利、合伙人制杠杆实现复利增长，形成一套可复制的普通人财富积累方法论。
concepts:
- name: 三阶段风险测算体系
  desc: 根据资产量级划分的动态风控模型：第一阶段以年收入为亏损上限（可承受最大亏损<年收入）；第二阶段以净资产20%为亏损上限并引入2倍内杠杆；第三阶段按标普资产配置标准构建利他平台，实现钱生钱。
  is_original: true
  excerpt:
  - 第一阶段：测算可承受最大的风险系数：可能性最大亏损金额<平均月收入*12
  - 第二阶段：我的投资最大亏损金额=身家（不含房子）*20%...可以适当放一些杠杆上去，一半最好就2倍以内
  - 第三阶段了：最近听到一句话，穷人拆台、富人补台、智者搭台...第三阶段，我将按照标准普尔去投资了，然后就是要搭个利他型的平台
- name: 被动收入锚定策略
  desc: 以稳定的被动现金流（如股票经纪人佣金、淘宝客返利）作为心理与资金底座，支撑高风险投资（如股市）的仓位管理与止损执行，实现“亏得起、拿得住、不梭哈”。
  is_original: true
  excerpt:
  - 因为有被动收入，让我各项的投资有了一定的底气，秉承着大不了我亏掉这些额外收入的心思
  - 你的主业副业被动收入，真的很关键
  - 这个利他不是无条件让人白嫖...我考虑投资的优先选择是能增加我的被动式收入
- name: 信用价值变现
  desc: 将个人征信、银行授信额度、高净值人脉资源转化为可量化的低成本融资工具（如抵押贷、经营贷、纳税贷），通过“存贷套利”“存款冲量”实现无本万利的年化收益。
  is_original: true
  excerpt:
  - 这个东西投资的是人脉投资，投资金额很难估算。最大的成本就是你的信用价值
  - 我自己备用了几百万放着，随时要用随时可以用
  - 像我，可以一下子搞出500万的银行额度。一年关键几天的净利润收益也有3万起
- name: 合伙人制杠杆
  desc: 在淘宝客、可转债打新、存款套利等项目中，通过“出资/出技术/出资源”三方分工，将单一项目的边际成本降为零，利用他人账户、粉丝、额度实现规模化复制与风险分摊。
  is_original: true
  excerpt:
  - 小微信号合伙人出钱出微信号，我们出钱出人管。合作共赢
  - 100个户在代打，收益分一半，包括自己家里人户头
  - 他负责他的人脉圈子里提供和寻找匹配银行需求资源，我负责高端客户资源
- name: 流动性优先原则
  desc: 投资铁律：资金流动性必须牢牢掌控在自己手中。要求投资标的可随时变现、自有账户体系可控、拒绝融资融券/他人代管账户等不可控结构，宁可错过风口也要保证资金链安全。
  is_original: false
  excerpt:
  - 资金的流动性，这一条，一定要牢牢控制住。你可以不投资，但手头一定要有临时备用的资金
  - 所有的资金都是在自己名下银行卡内互转！不转给他人，不用买理财产品，随时可以快速赎回
  - 从此以后，怎么样都不碰融资融券
methods:
- name: __overview__
  desc: 核心方法论为：建立记账体系 -> 确立三阶段风控红线 -> 构建被动收入底座 -> 利用信用杠杆放大资金池 -> 筛选高流动性/可复制/利他型项目
    -> 以合伙人制放大规模 -> 严守止损与流动性底线 -> 复利滚动进入下一阶段。
  excerpt:
  - 记账能让你更了解自己的财务体系，掌控自己人生
  - 我自时刻提醒和反思的几个投资要素和把我平常赚钱要养成的几个习惯
  - 赚钱也要做减法...最终还是决定把一些领域的事情做的更大更强
- name: 淘宝客返利实操SOP
  desc: 基于悠哉返利机器人+腾讯云服务器+个人微信号+高佣联盟+自产粉（小红书/知乎/朋友圈）的私域裂变体系。单号承载3000精准粉，年净利3-4万，通过合伙人制解决号源与封号风险。
  excerpt:
  - 去网上搜索悠哉官网http://www.uzaisoft.com/，购买返利机器人或者买悠哉ECO手机（不能息屏）。建议买腾讯云服务器挂机器人
  - 通过小红书、微博、知乎等平台，看你本事进行引粉，现在买粉渠道这块又贵，回本又慢，已经被整个市场淘汰掉了
  - 测算了一下，你有3000个精准粉丝群体可以塞一个微信号，利润大概一年3-4万左右
- name: 四大行存款套利实操SOP
  desc: 利用银行考核信息差：对接行长存款任务 -> 自有资金/授信额度在官方APP操作存入指定账户 -> 截图留存 -> 约定期限后转出 -> 按阶梯价分润。核心优势：资金不出自有卡、四大行系统安全、操作耗时<10分钟。
  excerpt:
  - 需求端是银H的行长...他找我们花个成本2000-3000元左右，完成他的任务
  - 所有的资金都是在自己名下银行卡内互转！不转给他人，不用买理财产品，随时可以快速赎回
  - 操作只需要在官方APP里面操作...前后不用10分钟操作就可以
- name: 可转债打新规模化操作
  desc: 突破个人额度限制：整合亲友/企业账户（无需2年经验/10万资产门槛） -> 批量开户授权代打 -> 收益对半分成 -> 企业店群同步解决纳税贷/流水贷资质。单户年均1000-2000元，百户规模年入6-10万。
  excerpt:
  - 身边的亲戚朋友等，一起来。还包括企业可转债户头。100个户在代打，收益分一半
  - 我们也测出了企业可转债打新的方案和新思路。不用2年交易经验和10万日均资产限制
  - 做无货源或者企业店群的在这块是个好思路，店群既能开店，又能节省很多财务费用
- name: 股票经纪人佣金变现
  desc: 考取从业资格 -> 挂靠券商（无底薪纯佣） -> 多渠道引流（贴吧/公众号/实盘直播/同花顺训练营） -> 承接大户资管账户（28分成） -> 多券商布局规避单一考核风险。年入12-20万被动收入。
  excerpt:
  - 2023年5月8日又开放了证券资格考试，进去证券www.sac.net.cn/pxzx/pxzdydg就能报考
  - 你可以提前去证券公司预约挂靠一个股票经纪人，只拿佣金抽成的那种，没有工资
  - 我有替一些炒股大户承接股票账户存放，因为我们实行28开的分佣制度，他拿走80%佣金，我20%佣金结算给他
- name: 超短线股票委托投资风控模型
  desc: 自有账户授权专业操盘手 -> 本金分仓（3层仓操作+T+0理财） -> 动态增资公式：增资上限 = (已实现盈利 * 0.5) * 5，即最大亏损不超过累计盈利的50%
    -> 止损线15%-20%强制平仓。
  excerpt:
  - 平常买卖3层仓，剩余资金我平常还能做T+0理财
  - 我的本人增投的资金是按照：赚的钱*0.5=增资后最大投资亏损，然后最大投资亏损额度*5
  - 没亏损超过15%，后面也都回来了。真亏了就撤了
theorems:
- name: 稳字当头：投资忌梭哈，生存第一
  desc: 核心投资公理：10次投资9次成功，1次梭哈失败即万劫不复。必须预设最坏后果（祸不及家人），保留后路（保单/房产/黄金），只做风口来了有沉淀、风口去了不摔死的赛道。
  excerpt:
  - 投资是很忌讳梭哈的，10次投资你9次成功，但只要一次失败，就会让你万劫不复，就像乐视的贾跃亭
  - 真正好的赛道，是风口来了你原来有沉淀，知道怎么做。风口走了，你还不至于摔下来摔死
  - 最坏的打算就是投资失败祸不及家人
- name: 投资即投人：靠谱的七维判断标准
  desc: 项目成败核心在于人。靠谱标准：1.消费理性/无不良嗜好 2.有交代/有回音/有落实（执行力） 3.抠门但讲信誉 4.朋友圈层质量 5.对工作生活负责
    6.沟通力强 7.持续学习力。
  excerpt:
  - 投资要投人，一个行业里面，有人亏钱有人赚钱。一个人能不能投，关键看两个字：靠谱
  - 去夜场、外出吃饭、喝酒都懂得适可而止，理性的人...切记，不良嗜好强的，比如爱赌博的人，千万别做合伙人
  - 凡是有交代，事事有回音，件件有落实。归类一点，执行力强的
- name: 利他即利己：搭台与圈层跃迁
  desc: 财富第三阶段核心：从‘独自赚钱’转向‘搭平台、聚人脉、共赢利’。真诚分享方法、垫资护伙伴、多给分润，能吸引高净值圈层，获取颠覆三观的认知与更大商机，实现‘小钱复利放大’。
  excerpt:
  - 穷人拆台、富人补台、智者搭台...第三阶段，我将按照标准普尔去投资了，然后就是要搭个利他型的平台
  - 一定要少点思考利己，多点思考利他...我不会做烂好人，但我会做一个真诚的好人
  - 有个老板告诉我，你在小钱里面能发现大商机。那时，我悟了！诀窍在于小钱复利放大！
- name: 执行力与信用是穷人逆袭的唯一杠杆
  desc: 无资源背景者，唯有‘说到做到’的执行力与‘不占便宜’的真诚，能赢得贵人提携（如同学引入淘宝客、大户托付账户）与合伙人信任，将微小优势复利为核心资产。
  excerpt:
  - 正因为这个经纪人副业，让我主动跟一些大佬接洽，也是平常的靠谱和执行力到位，他们也开始带着我去投资
  - 你带不动，别人总不能求着你跟他一起发财吧。别人提点的几句，你就要主动跟在别人后面学习
  - 在生财里面，你会看到那些赚到钱的人往往是有格局的，他们做人真诚...没有道路通往真诚，真诚就是唯一的道路
findings:
- name: 淘宝客项目全周期收益复盘
  desc: '[evidence] 总投入50万，2019年底-2020年初投入，2021年初回本，2021年净赚70万，2022年净赚50万，2023年月均净利4万（下滑趋势）。验证了‘合伙人制+自产粉+自建机器人’模型的高收益与衰退周期。'
  excerpt:
  - 19年底到20年初投资，2021年初就回本了，那年赚了70万左右。然后2022年50万的净利润。每年利润都会下滑一些。今年目前也在下滑。今年月平均净利润收益目前是4万左右
- name: 四大行存款套利规模化收益验证
  desc: '[evidence] 2021年入行，首年10万+，2022年20万，2023年Q1单季20万（单日峰值10万），预计全年50-60万。验证了‘考核信息差+信用额度+自有卡操作’的高确定性与放大潜力。'
  excerpt:
  - 前年入行，和老胡...一起做的...刚开始一年10几万，去年一年20万，今年第一季度赚20万了，单单季度底一天我就赚了10万
- name: 股票委托投资动态风控有效性验证
  desc: '[evidence] 2018年起投，累计账面盈利百万级，年分红20-50万。最大回撤未超15%，严格执行‘盈利50%作风险预算、5倍杠杆上限、20%止损线’纪律，避免了融资融券爆仓风险。'
  excerpt:
  - 目前大概从股市里面赚了一百多万的样子。一年分红到手收入大概20-50万
  - 没亏损超过15%，后面也都回来了。真亏了就撤了
  - 股市没有最终落入口袋的时候，是不算收入
- name: 融资融券/消息票/他人代管账户三大致命坑实证
  desc: '[evidence] 1.融资融券遭180ETF绕标，10万亏至1万（不可控账户）；2.消息票‘中天金融’重组失败，兄弟300万亏至60万成老赖（无止损梭哈）；3.淘宝达人/外卖CPS项目被合伙人挪用资金/平台扣量，30万投入仅回本80%（财务不透明/平台风险）。'
  excerpt:
  - 我亲戚那个账户被拿过去做了接盘侠，一百多万的资金说没就没...10万就剩下1万块钱了。这是我最大的坑之一。从此以后，怎么样都不碰融资融券
  - 他自己借钱融资上杠杆，投资了三百多万...300多万现在只能下60多万...现在是负债累累几百万
  - 投资外卖CPS和影票CPS，前后投了30万，现在已回本80%...目测平台太坑，饿了么、美团吃相太难看
- name: 可转债打新百户规模稳健收益验证
  desc: '[evidence] 整合100个账户（含企业户），年化收益6-10万，单户均1000-2000元。企业户突破个人门槛（2年经验/10万资产），店群模式同步优化纳税贷资质，验证了‘规模化代打+企业户破限’的可行性。'
  excerpt:
  - 100个户在代打，收益分一半...一个户一年收益1000-2000左右
  - 我们也测出了企业可转债打新的方案和新思路。不用2年交易经验和10万日均资产限制
  - 做无货源或者企业店群的在这块是个好思路，店群既能开店，又能节省很多财务费用
- name: 记账习惯对财务掌控力的量化影响
  desc: '[evidence] 2019年起坚持每日流水账（挖财APP），分类覆盖全业务线，配合自动报表实现‘项目级盈亏测算’与‘开源节流’决策支撑，成为多项目并行管理的基础设施。'
  excerpt:
  - 我是从19年开始记账的。养成这个习惯花了一个月的时间。后面就很顺其自然的每天习惯记账了
  - 记账能让你很适合开源节流，让你有个清晰的知道在哪个项目比较赚钱，哪个地方多花钱
  - 每当你要去计算你每个项目赚多少钱或者花多少钱时，对照每个项目的前后出入逻辑就能测算出来
