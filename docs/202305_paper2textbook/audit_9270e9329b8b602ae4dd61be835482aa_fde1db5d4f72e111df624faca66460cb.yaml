    2.4 万而非 2.4 万（一致），但“生财精选小报童”在素材中仅在 P001 出现，未在其他素材验证。
- location: '75.3'
  claim: 读者林清杰对比反馈：卢曼卡片笔记法门槛高、易陷入“通篇搬运”，而渐进式总结五层法操作指引强、上手快、更难变成搬运工。
  reason: 素材中仅在 P001 找到林清杰评论，内容为“《卡片笔记法》也看过，一直看不懂怎么用的，总觉得哪里不对，最后放弃思考直接通篇搬运当个搬运工了”，未提及“渐进式总结五层法操作指引强、上手快、更难变成搬运工”。
- location: '75.5'
  claim: L2“用自己话复述”是内化的分水岭（费曼技巧内核）
  reason: 素材 P002 提到“用自己的话对每个高亮或下划线部分写一句话的总结”，并引用“费曼学习法，就是把你看过的知识，用自己话复述，这是一种萃取（内化）的办法”，但未明确表述“L2是内化的分水岭”及“费曼技巧内核”这一定性结论。
- location: '75.6'
  claim: P.A.R.A 核心机制：动态流转。新增笔记按“服务当前 Project → 服务长期 Area → 默认 Resource”三步决策树路由；Project
    完成自动沉入 Archive。
  reason: 素材 P003 中提到“当我们看到资料时，就可以想：1. 这将在哪个项目（Project）中最有用？2. 如果没有：这将在哪个区域（Area）中最有用？3.
    如果没有：放在资源吧（Resource）”，但未提及“Project 完成自动沉入 Archive”及“动态流转”机制。
- location: '75.7'
