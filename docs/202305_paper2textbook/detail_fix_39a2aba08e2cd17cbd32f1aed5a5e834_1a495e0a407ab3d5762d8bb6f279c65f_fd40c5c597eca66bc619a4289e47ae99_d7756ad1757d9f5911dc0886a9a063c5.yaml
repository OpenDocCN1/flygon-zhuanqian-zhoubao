  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: improve
  excerpts:
  - 只需要预设好人物的细节特征，比如我心动重启的女主统一关键词都是暗红色眼睛+黑色头发。一般面部细节统一大家看着才会有连续性。
  - 在所有Prompt中强制固定核心外貌特征词（如发色、瞳色、服饰），无需训练即可维持跨图角色视觉连续性，满足连载/系列化需求。
- 'no': 5
  name: 关键帧动态化 —— 让PPT动起来的“呼吸感”
  points:
  - '**为什么需要这个概念？**'
  - '- AI生成的是静态图片，直接拼接成视频会有强烈的“PPT翻页感”，完播率极低'
  - '- 短视频算法偏好有镜头语言（推拉摇移）的动态画面，静态图极难获推'
  - '- 需要零门槛、无需AE/PR、剪映内即可完成的动态化标准动作'
  - '**核心定义**'
  - '- 在剪映中为每张图片设置“位置/缩放”关键帧：起始帧100%，结束帧110%（或位置微移），生成缓慢推拉/横移效果'
  - '- 配合“图片配上文字的末尾，往下拉一点再打上关键帧”，实现图文同步动态'
  - '- 核心参数：关键帧间隔覆盖全片时长、缩放幅度≤10%（避免裁切主体）、移动方向服从构图重心'
  - '**关键性质**'
  - '- 伪动态：本质是2D平面变换，非真实3D空间运动，但视觉欺骗效果极佳'
  - '- 批量化友好：剪映支持“关键帧预设/模板”一键套用全片，单人日产50+条可行'
  - '- 叠加层级：底层图片关键帧 + 中层字幕进出动画 + 顶层扫光/光斑特效 = 商业级质感'
  - '**典型例子**'
  - '- 作者实操：静态AI图加关键帧后，播放量从百级跃升至万级，完播率显著提升'
  - '- 对标账号：头部推文号均使用“缓慢推镜头+字幕呼吸感”作为标准视觉语言'
  - '**边界条件**'
  - '- 竖屏比例（9:16）下横向移动易露出黑边，需配合“画中画/背景填充”扩展画布'
  - '- 过度缩放（>120%）会放大AI生图伪影（噪点/模糊），需配合高清修复前置'
  - '- 群像/全景图不适合强行推镜头，容易造成主体跑出画面，需改用“扫光/粒子”特效代替'
  - '...'
  sources:
  - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
    role: origin
  - paper: docs/202305/EL9Fdl8WFoFxaixaJcLcqnXjn7r.md
    role: improve
  excerpts:
  - 图片配上文字的末尾，往下拉一点再打上关键帧就能发现图片动起来了，不像ppt这么干吧。
  - 剪映关键帧动态化（推拉摇移消除PPT感）
  - 关键帧对比单词增删效果；模型管理覆盖获取C站筛选图片反推下载存放对应目录鉴别秋叶解析工具拖拽识别类型标准化流程。
- 'no': 6
  name: 配音情绪适配 —— 给文案注入“灵魂”
  points:
  - '**为什么需要这个概念？**'
  - '- 同一文案，不同音色/情绪标签，转化率差异可达10倍以上'
  - '- 爽文/虐文/悬疑等类型对音色张力、节奏、情绪标签有严格偏好，选错即“毁文”'
  - '- AI配音工具（云浩宇/云希/魔音工坊/剪映/Edge TTS）提供海量音色，但缺乏“选配标准”'
  - '**核心定义**'
  - '- 根据文案类型选择匹配音色与情绪标签：爽文禁用“失望/低沉”，推荐“云浩宇”类张力感强音色；虐文需“哭腔/压抑”标签'
  - '- 核心判断标准：听前5秒是否有“代入感”，是否能还原主角当下心理状态'
  - '**关键性质**'
  - '- 情绪传递效率：音频比文字更直击边缘系统，是短视频留存的“隐形钩子”'
  - '- 成本倒逼选型：云希为微软Azure免费角色，市面工具月费88元实为中间商倒卖，开发者可直连API零成本获取'
  - '- 批量化策略：建立“文案类型-音色-情绪标签”映射表，RPA自动化批量合成'
  - '**典型例子**'
  - '- 作者踩坑：爽文用“失望”情绪配音，成片“完全没法听”，换用“云浩宇”张力版瞬间起死回生'
  - '- 成本避坑：直接注册Azure账号调用TTS API，获取同款“云希”音色，省下会员费'
  - '**边界条件**'
  - '- 方言/小众语种/特定声线（如老年音/方言）AI配音仍有明显电子感，关键节点需真人录制'
  - '- 多角色对话场景，单音色无法区分人设，需多音色切换或标注“旁白/角色A/角色B”'
  - '- 平台风控：部分平台对纯AI配音视频限流，需在后期混入真人语气词/呼吸音/环境音伪装'
  - '...'
  sources:
