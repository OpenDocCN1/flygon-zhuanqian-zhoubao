learning_targets:
- 理解AI小说推文赛道分层生存法则与商业悖论
- 掌握‘一句话一图’文案视觉化结构化拆解公式
- 熟练运用万金油正反向提示词预设与权重语法控制生成质量
- 掌握无LoRA条件下的人物一致性锚定技术方案
- 掌握剪映关键帧动态化消除PPT感的标准化操作流程
- 能根据文案类型匹配配音音色与情绪标签提升转化
- 理解AI推文自动化流水线架构与‘手动跑通是自动化前提’的工程化原则
- 能制定新手入局避坑策略：优先跑通闭环、拒绝高耗时风格化、拥抱矩阵化放大
concept_map:
- AI小说推文实战体系
- ├── 赛道认知与定位
- │   ├── 赛道分层生存法则（女频批量/男频精华/风格化/解压素材）  —— P001
- │   ├── 纯原创风格化商业悖论（高代入/低效率/难矩阵/副业适配）  —— P001
- │   └── 新手避坑核心原则（验证闭环>打磨单条/自动化>手工/矩阵>单号）  —— P001
- ├── 核心制作方法论
- │   ├── 一句话一图公式（主角+细节+动作+背景四要素结构化）  —— P002
- │   ├── 万金油提示词预设（正向质量词+反向避坑词+权重语法）  —— P003
- │   ├── 人物一致性锚定法（固定核心外貌特征词替代LoRA训练）  —— P004
- │   ├── 关键帧动态化（剪映位置/缩放关键帧模拟镜头语言）  —— P005
- │   └── 配音情绪适配（文案类型-音色-情绪标签映射表）  —— P006
- ├── 工程化与自动化进阶
- │   ├── AI推文自动化流水线（文本分割→Prompt生成→SD批量推理→视频合成→RPA分发）  —— P007
- │   ├── 手动跑通是自动化前提定律（SOP先行，工具在后）  —— P007
- │   ├── SD模型选型与参数配置（Dark模型人像优于Everything/DDIM/20-30步/Hires.fix）  —— P001
- │   └── 云端部署降低硬件门槛（腾讯云/青椒云/Colab秋叶整合包）  —— P001
- └── 实证验证与数据复盘
- '    ├── 单条制作耗时量化（8小时/条：生图4-6h+剪辑2h/3080Ti 50秒4张）  —— P001'
- '    ├── 爆款案例复盘（《缩小灾变》高概念+视觉冲击=61w播放）  —— P001'
- '    ├── 赛道拥挤度与收益天花板验证（月入千元副业/难全职/免费教程泛滥）  —— P001'
- '    └── 自动化效率跃迁预期（全流程自动化后压缩至1-2小时/条）  —— P007'
life_analogy:
- 想象AI小说推文制作是一个**工业化动画电影流水线**：
- '- **文案/剧本** = 导演的分镜头脚本（核心资产，决定上限）'
- '- **一句话一图公式** = 将脚本拆解为标准化的‘镜头指令单’（主角+服化+动作+场景）'
- '- **万金油提示词** = 通用的‘灯光/滤镜/画质预设包’（新手也能出大片质感）'
- '- **人物一致性锚定** = 演员的‘定妆照/人设卡’（全片固定瞳色/发型/服装，无需重新选角）'
- '- **关键帧动态化** = 摄影机的‘推拉摇移’（让静态剧照动起来，消除PPT感）'
- '- **配音情绪适配** = 配音导演的‘选角/导配’（爽文配张力音色，虐文配哭腔，错配即毁片）'
- '- **自动化流水线** = 从‘手工作坊’升级为‘代码工厂’（单条8小时→1小时，日产1条→50条）'
- 就像工业动画靠标准化流程实现量产，AI推文也靠结构化Prompt+自动化工具链实现商业化放大。
summary:
- concept: AI小说推文
  desc: 利用AI绘图将小说转视频引流变现的CPS项目，核心竞争力在文案而非画面
- concept: 赛道分层生存法则
  desc: 女频适合批量矩阵，男频需高成本精华，风格化原创难规模，解压素材高变现
- concept: 纯原创风格化商业悖论
  desc: 100%原创可挂中视频但单条8小时无法矩阵，收益上限低仅适合副业
- concept: 一句话一图公式
  desc: 文案拆解为单句，结构化为‘主角+面部服装细节+动作+背景’四要素生成Prompt
- concept: 万金油提示词预设
  desc: 正向词拉高画质上限+反向词托住畸变下限+权重语法微调，覆盖90%人像场景
- concept: 人物一致性锚定法
  desc: 全Prompt强制固定核心外貌特征词（瞳色/发色/服饰），零训练维持角色跨图连贯
- concept: 关键帧动态化
  desc: 剪映设置位置/缩放关键帧模拟镜头推拉摇移，消除静态图拼接的PPT翻页感
- concept: 配音情绪适配
  desc: 爽文禁用低能量音色推荐张力感强音色，虐文需哭腔压抑，音频是留存隐形钩子
- concept: AI推文自动化流水线
  desc: 文本分割→ChatGPT生成Prompt→SD批量生图→视频合成→RPA分发，解决1到100规模化
- concept: 手动跑通是自动化前提
  desc: SOP必须先人工跑通验证可行，自动化只解决规模化不解决0到1验证
- concept: SD模型选型策略
  desc: 人像生成Dark模型优于Everything，配合DDIM/20-30步/512x768/Hires.fix平衡速度质量
- concept: 新手避坑核心原则
  desc: 优先跑通商业闭环，拒绝精神洁癖过度打磨，无自动化勿碰高耗时路线，拥抱矩阵化
exercises:
- 'no': 1
  title: 文案视觉化拆解实战
  contents:
  - 给定小说片段：“林晚意捏紧了手中的录取通知书，指节发白。她抬头，对上了那双漆黑深邃、仿佛装着整个银河的眼睛。‘我们上同一所大学吧。’少年唇角勾起一抹浅笑，校服敞开着，风吹乱了他额前的碎发。”
  - 任务：
  - 1. 将上文拆解为3-4个‘一句话一图’的结构化Prompt四要素（主角+面部服装细节+动作+背景）
  - 2. 翻译为英文Prompt（可借助翻译工具），并在末尾追加万金油正向词与反向词
  - 3. 设定男女主的一致性锚定特征词（各3个核心特征），说明为何选择这些特征
  - 4. 说明：若用SD生成该场景，采样器/步数/CFG/分辨率/高清修复如何设置？为何？
- 'no': 2
  title: 关键帧动态化与配音适配决策
  contents:
  - 场景：已生成5张关键剧情图（竖屏9:16，已高清修复），需合成15秒视频。
  - 任务：
  - 1. 在剪映中为每张图设置关键帧动画：起始缩放100%→结束110%，位置微向右下移动5%。画出关键帧时间轴示意图（文字描述即可）。
  - 2. 说明：为何缩放幅度不宜超过120%？竖屏横向移动如何避免露出黑边？
  - 3. 该段文案属‘青春暗恋/破镜重圆’甜文，推荐使用云希/云浩宇/魔云熙中的哪个音色？情绪标签选‘温柔/坚定/失望’中的哪个？理由是什么？
  - 4. 若平台查重判定视频‘画面静态’，除了关键帧还可叠加哪两种低成本特效增强动态感？
- 'no': 3
  title: 自动化流水线架构设计与避坑复盘
  contents:
  - 假设你已手工跑通单条视频制作全流程（文案改写→Prompt生成→SD生图→剪映合成→发布），现欲开发自动化脚本。
  - 任务：
  - 1. 绘制自动化流水线模块架构图（文字描述模块名+输入输出+核心工具/API）：文本分割器、Prompt模板引擎、SD批量调度器、视频合成器、发布调度器。
  - 2. 列举SD批量推理模块的三大工程瓶颈（显存/并发/模型加载）及对应解决方案。
  - 3. 视频合成自动化（关键帧/转场/字幕对齐）用Remotion/FFmpeg/剪映草稿三种方案对比优劣，推荐单人小团队方案。
  - 4. 结合素材中‘版权风险/平台风控/模型效果瓶颈’三大边界条件，制定自动化上线前的‘三张清单’：合规白名单清单、风控对抗清单、效果兜底清单。
  - 5. 思考题：为何作者最终放弃风格化路线转而认可‘解压素材矩阵路线’？若你是作者，会在何时决定‘止损放弃’还是‘投入自动化开发’？决策依据是什么？
units:
- 'no': 1
  name: AI小说推文 —— 用“文案为王”驾驭“图文变现”
  points:
  - '**为什么需要这个概念？**'
  - '- 短视频平台流量红利期下，小说推文是低门槛、高确定性的变现赛道'
  - '- AI绘图工具（SD/MJ）极大降低了“不会画画”也能做视频的内容生产门槛'
  - '- 但赛道内卷严重，单纯靠AI生图“凑数”已无法出单，核心竞争力回归到文案与节奏把控'
  - '**核心定义**'
  - '- AI小说推文：利用AI绘图工具将小说文案转化为图文/视频形式，发布于短视频平台引流至小说阅读平台赚取推广佣金（CPS）的项目形态'
  - '- 核心公式：文案（钩子/剧情）> 画面（画质/一致性）> 工具（模型/参数）'
  - '**关键性质**'
  - '- 赛道分层生存法则：女频（知乎/最右）适合改开头+批量矩阵；男频（番茄/QQ阅读）需提炼精华+高成本制作；风格化原创虽有版权优势但单条耗时8小时难矩阵；解压素材虽低俗但高变现确定性'
  - '- 纯原创风格化的商业悖论：100%原创可挂中视频、代入感强，但单条耗时8小时、无法矩阵化、收益上限低，仅适合副业'
  - '- 新手避坑核心原则：优先验证跑通商业闭环；无自动化工作流勿碰高耗时路线；不要因“精神洁癖”过度打磨单条视频'
  - '**典型例子**'
  - '- 《缩小灾变》爆款复盘：自创夸张化开头文案 + SD生成画面 + 配音，抖音单条播放61万+，验证“高概念设定+视觉化冲击”的选题有效性'
  - '- 实测数据：单条4分钟视频制作耗时接近8小时（SD生图4-6小时+剪辑配音2小时），3080Ti显卡生成4张高清修复图需50秒'
  - '**边界条件**'
  - '- 当无本地高配显卡时，可通过腾讯云/青椒云/Colab等云端部署SD，但需权衡成本与速度'
  - '- 赛道拥挤度极高（评论区共识：太多人玩、学费都不要了），单人小白入局面临激烈竞争与流量分发挤压'
  - '- SD模型在特定任务上性能差异大：Everything模型生成人像手部崩坏，需切换Dark模型或加Embedding/负面Prompt规避'
  - '...'
  sources:
  - paper: docs/202305/20230516_071.md
    role: origin
  - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
    role: origin
  - paper: docs/202305/EL9Fdl8WFoFxaixaJcLcqnXjn7r.md
    role: improve
  excerpts:
  - 小说推文的核心是文案，其次才是画面，真的，文案为王。
  - 女频知乎、最右等平台的文章只要改个开头，所以适合批量化矩阵化操作；QQ阅读，番茄等男频平台需要提取精华...内容产出成本很高。
  - 优势：文案+内容100%纯原创，可挂中视频...代入感也是满分。劣势：视频制作时间过长...无法矩阵化操作，收入有限...全职养活自己感觉不大行，但是兼职副业特别香。
  - 基本一条四分钟视频光制作部分得花个4-6个小时，一段四分钟的视频文案+画面我需要接近8个小时才能搞定。
  - 正面词：super detail, award winning, best quality, 16k, UHD,A perfect and delicate
    face；反面词：lowres, bad anatomy, bad hands, text,error, missing fngers,extra digt
    ,fewer digits,cropped, wort quality ,low quality,normal quality, jpeg artifacts,signature,watermark,
    username, blurry, bad feet
  - 只需要预设好人物的细节特征，比如我心动重启的女主统一关键词都是暗红色眼睛+黑色头发。
- 'no': 2
  name: 一句话一图公式 —— 让小说文案变成“分镜脚本”
  points:
  - '**为什么需要这个概念？**'
  - '- 小说文本是连续叙事，视频需要离散的画面序列，缺乏结构化映射标准'
  - '- 新手不会拆解文案，导致画面与文案脱节、节奏拖沓、人物形象漂移'
  - '- 需要一个可标准化、可复制、可教学的“文案转视觉”最小动作单元'
  - '**核心定义**'
  - '- 将文案拆解为单句，前30秒严格执行“一句话一张图”，后期可放宽为“一段话一张图”'
  - '- 单句结构化四要素：主角 + 面部服装细节 + 动作 + 背景'
  - '- 翻译成英文Prompt输入SD：A beautiful woman, beautiful face, school uniform, blush, chin
    on the table, classroom'
  - '**关键性质**'
  - '- 结构化拆解强制创作者从“读者视角”转为“导演视角”，逐句设计画面感'
  - '- 固定主角外貌特征词（暗红色眼睛+黑色头发）锚定人物一致性，无需训练LoRA'
  - '- 配合DDIM采样器、20-30步、512x768分辨率、High-res Fix高清修复，平衡速度与质量'
  - '**典型例子**'
  - '- “你曾经有一个喜欢了你三年的女孩” → 一个美女+漂亮的脸+校服+脸红+在桌上托腮+教室'
  - '- 实操案例：作者《心动重启》系列通过固定核心特征词维持女主跨图视觉连续性'
  - '**边界条件**'
  - '- 仅适用于二次元/半写实风格推文，真人写实风需引入ControlNet/LoRA才能稳定控制'
  - '- 文案过于抽象（心理描写/环境渲染）时难以直接映射为单句画面，需二次改写'
  - '- 依赖翻译软件将中文结构化要素转英文Prompt，术语准确性影响出图质量'
  - '...'
  sources:
  - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
    role: origin
  - paper: docs/202305/20230516_071.md
    role: improve
  excerpts:
  - 开头的素材一句话一张，30秒过后的素材可以一段话一张。我的公式是：一个主角+面部服装细节描写+动作+背景。
  - “你曾经有一个喜欢了你三年的女孩”=一个美女+漂亮的脸+校服+脸红+在桌上托腮+教室。通过翻译软件翻译成英文=A beautiful woman , beautiful
    face , school uniform ,blush , chin on the table , classroom。
  - 只需要预设好人物的细节特征，比如我心动重启的女主统一关键词都是暗红色眼睛+黑色头发，一般面部细节统一大家看着才会有连续性。
  - 基本开了高清修复四张图需要50秒左右，我的显卡是3080ti。
- 'no': 3
  name: 万金油提示词预设 —— 给新手的“避坑护盾”
  points:
  - '**为什么需要这个概念？**'
  - '- SD生图参数极多（采样器、步数、CFG、VAE、负面词...），新手极易在调参中迷失、放弃'
  - '- 人像生成高频故障模式固定：手部畸形、面部崩坏、水印残留、画质模糊'
  - '- 需要一套“开箱即用、覆盖90%场景”的通用正反向词模板，降低认知负荷'
  - '**核心定义**'
  - '- 正向词（质量增强）：super detail, award winning, best quality, 16k, UHD, A perfect and
    delicate face, masterpiece, highly detailed, 8k...'
  - '- 反向词（避坑指南）：lowres, bad anatomy, bad hands, text, error, missing fingers, extra
    digit, fewer digits, cropped, worst quality, low quality, normal quality, jpeg
    artifacts, signature, watermark, username, blurry, bad feet...'
  - '- 权重语法：(关键词:权重) 如 (masterpiece:1.2) 微调权重'
  - '**关键性质**'
  - '- 通用性强：覆盖大多数人像/通用生成场景，无需理解底层原理即可出图'
  - '- 组合拳策略：正向词拉高上限 + 反向词托住下限 + 权重语法微调细节'
  - '- 迁移性：适用于ChilloutMix、DarkSushi等主流真人/二次元底模'
  - '**典型例子**'
  - '- 作者实测：加载万金油预设后，SD生成人物手部完整率显著提升，画质细节肉眼可见提升'
  - '- 评论区验证：新手直接套用该预设，首张出图即可用，避免了“手部崩坏”劝退时刻'
  - '**边界条件**'
  - '- 特殊风格（赛博朋克/水墨/3D渲染）需替换专用风格词，万金油预设会稀释风格特征'
  - '- 高分辨率直出（>1024）时需配合Hires.fix或ControlNet Tile，单靠提示词无法解决崩坏'
  - '- 负面词堆砌过多可能抑制正常细节生成（如过度去水印导致衣服纹理消失）'
  - '...'
  sources:
  - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
    role: origin
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: improve
  excerpts:
  - 正面词：super detail, award winning, best quality, 16k, UHD,A perfect and delicate
    face
  - 反面词：lowres, bad anatomy, bad hands, text,error, missing fngers,extra digt ,fewer
    digits,cropped, wort quality ,low quality,normal quality, jpeg artifacts,signature,watermark,
    username, blurry, bad feet
  - 正向提示词五段式模板：质量词+主体+主体细节+服饰配饰+环境构图光影，每段换行英文逗号结尾配合权重语法(词:权重)微调。
- 'no': 4
  name: 人物一致性锚定法 —— 无LoRA也能演“连续剧”
  points:
  - '**为什么需要这个概念？**'
  - '- 推文/连载类视频要求主角跨镜头、跨集数视觉连贯，否则观众出戏'
  - '- 训练LoRA需显存、数据集、调参技能，门槛高、周期长，不适合新手/轻量化项目'
  - '- 需要一种零训练、零代码、纯Prompt层面的角色固定方案'
  - '**核心定义**'
  - '- 在所有Prompt中强制固定核心外貌特征词（发色、瞳色、发型、标志性服饰）'
  - '- 例：女主统一关键词“dark red eyes, black hair, school uniform”'
  - '- 原理：CLIP文本编码器对固定Token的注意力权重稳定，引导扩散过程生成一致特征'
  - '**关键性质**'
  - '- 零成本：无需额外显存、训练时间、数据集清洗'
  - '- 即时生效：换模型/换种子即可复用，适合快速迭代测试'
  - '- 局限性：仅能固定“显性特征”，难以锁定骨骼结构/侧脸/复杂动作一致性'
  - '**典型例子**'
  - '- 《心动重启》系列：女主全程锚定“暗红色眼睛+黑色头发”，观众反馈“看着才有连续性”'
  - '- 评论区实践者验证：固定“silver hair, blue eyes”后，同一角色在不同场景下辨识度极高'
  - '**边界条件**'
  - '- 跨大模型底模（如从二次元模型切真人模型）时特征词语义空间不兼容，会导致画面崩坏'
  - '- 群像场景/大动作镜头下，单靠特征词无法保证空间关系一致，需引入ControlNet OpenPose'
  - '- 种子变化大时，固定特征词仅能保证“长得像”，无法保证“同一个人同角度”'
  - '...'
