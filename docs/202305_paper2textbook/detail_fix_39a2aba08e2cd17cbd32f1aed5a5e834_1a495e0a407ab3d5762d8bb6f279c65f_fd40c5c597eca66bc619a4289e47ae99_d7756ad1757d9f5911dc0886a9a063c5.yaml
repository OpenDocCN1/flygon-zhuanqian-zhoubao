    role: origin
  - paper: docs/202305/20230516_075.md
    role: improve
  - paper: docs/202305/EL9Fdl8WFoFxaixaJcLcqnXjn7r.md
    role: apply
  excerpts:
  - 通过代码自动化提升效率。目前已经实现把小说分割成多个片段，调用 chatgpt 将片段生成 prompt，调用 sd 生成图片。正在研究将图片合成视频并自动添加横移效果。
  - 手动流程梳理清楚了，再利用通过 RPA 文案生成+视频制作+视频上传全部都批量自动化了。前提是手动流程跑通。
  - 自动化，批量更多的是解决从 1 到 100 的问题而不是解决从 0 到 1 的问题。
  - 第一步：用剪映或者轻抖等小程序提取文案。第二步：修改文案...复制字幕发送给chatgpt...分段投喂，违规那一段就手动修改。
