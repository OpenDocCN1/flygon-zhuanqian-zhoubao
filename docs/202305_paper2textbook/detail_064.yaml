learning_targets:
- 理解股债性价比作为单一核心择时指标的理论支撑与计算逻辑
- 掌握系统性行情与结构性行情的识别方法及其对仓位策略的指导意义
- 熟练运用“三好选基法”（好公司、好经理、好体系）完成主动权益基金的标准化筛选
- 建立择时干扰项清单，学会忽略宏观数据、突发事件与情绪观察对决策的干扰
- 确立普通投资者生存法则：仅在系统性底部重仓，其余时间小仓位或空仓，博取确定性贝塔收益
concept_map:
- 投资择时与选品体系
- ├── 核心择时指标：股债性价比
- │   ├── 定义：(1/PE_TTM) ÷ 十年国债收益率  —— P001
- │   ├── 区间：长期 1.5~3.0 波动  —— P001
- │   ├── 阈值：>3.0 买入区、<1.5 卖出区  —— P001
- │   └── 辅助确认：技术分析验证高位拐点  —— P001
- ├── 行情分类识别
- │   ├── 系统性底部/顶部：四风格估值一致性  —— P002
- │   ├── 结构性底部/顶部：四风格估值分化  —— P002
- │   └── 普通人策略：仅参与系统性行情  —— P005
- ├── 基金筛选漏斗：三好标准
- │   ├── 好公司：六维定性评估  —— P003
- │   ├── 好经理：三大硬指标（业绩/投决委/金牛奖）  —— P003
- │   └── 好体系：规模否决权（只买<50亿，最优<20亿）  —— P003
- ├── 认知减法：干扰项清单
- │   ├── 突发事件/地缘/外盘：事后调仓性价比低  —— P004
- │   ├── 宏观数据（财政/货币/M2/社融）：远期影响已定价于无风险利率  —— P004
- │   └── 情绪观察：样本小、不可量化、成功率无保障  —— P004
- └── 普通投资者生存法则
- '    ├── 判定标准：历史年化<25%  —— P005'
- '    ├── 执行铁律：仅系统性底部重仓  —— P005'
- '    ├── 仓位管理：满仓周期短、空仓周期长  —— P005'
- '    └── 产品选择：宽基/小规模主动基金  —— P005'
life_analogy:
- 想象投资像**在菜市场买菜**：
- '- **股债性价比** = **“菜价指数”**：告诉你现在的菜价（股票收益率）相对于大米价格（无风险收益率）是贵还是便宜'
- '- **>3.0（买入区）** = **“白菜价”**：全市场菜都便宜（系统性底部），闭眼买都不亏'
- '- **<1.5（卖出区）** = **“天价菜”**：全市场菜都贵（系统性顶部），赶紧卖手里囤的菜换现金'
- '- **1.5~3.0（常态区）** = **“正常菜价”**：有的菜贵有的便宜（结构性行情），挑便宜的买需要专业眼光（选风格），外行易买贵'
- '- **技术分析** = **“看菜贩子收摊不收摊”**：菜价已到天价但菜贩子还不收摊（趋势未破），再等等；收摊走人了（跌破趋势线），确认顶部立刻跑'
- '- **三好选基法** = **“选买菜达人帮你买”**：选有名气的大摊主（好公司）、拿过“最佳买手奖”的达人（好经理/金牛奖）、且手头订单不多、采购灵活的小团队（好体系/小规模）'
- '- **忽略宏观/新闻/情绪** = **“不看天气预报、不听大妈闲聊、不理会‘今天菜涨价了’的传言”**：这些只影响当天心情，不改变“菜价指数”反映的长期规律'
- 就像买菜要看“菜价指数”决定买不买、买多少，投资也要看“股债性价比”决定仓位，其余噪音全屏蔽。
summary:
- concept: 股债性价比
  desc: 核心择时锚：(1/PE_TTM)÷十年国债收益率，>3.0重仓，<1.5清仓，长期在1.5-3.0波动
- concept: 系统性底部
  desc: 四大风格象限估值同时处于历史低位，买什么都赚，普通人重仓良机
- concept: 结构性底部
  desc: 风格估值分化（如大盘便宜小盘贵），仅适合专业选手精准选品，普通人小仓位
- concept: 三好选基法
  desc: 好公司(六维)+好经理(三硬指标)+好体系(规模<50亿铁律)，小规模享换仓/打新/迷你股三大优势
- concept: 择时干扰项清单
  desc: 忽略突发事件(事后性价比低)、宏观数据(远期已定价于无风险利率)、情绪观察(样本小不可量化)
- concept: 技术分析辅助角色
  desc: 仅在估值极端区(接近1.5)确认趋势反转(跌破长周期均线)，解决顶部具体数值不可知问题
- concept: 普通投资者生存法则
  desc: 历史年化<25%者，仅等系统性底部(股债性价比>3.0且四风格全便宜)重仓宽基/优质主动基金，其余时间小仓位或空仓
- concept: 小规模基金超额收益源泉
  desc: 换仓摩擦成本低、独享打新超额收益、可参与流动性差的迷你股交易，规模扩大必然收益递减
- concept: 宏观数据无效论
  desc: 财政/货币/M2/社融仅影响日内波动，中长期影响已完全体现在十年国债收益率(股债性价比分母)中
- concept: 作者实盘复盘
  desc: 2015/2018/2021三逃顶、2015/2018/2019三抄底，择时准确率100%，连续十年正收益，验证体系有效性
exercises:
- 'no': 1
  title: 手算一次股债性价比与择时决策
  contents:
  - 给定某日沪深300 PE_TTM = 10.0，十年国债收益率 = 3.0%：
  - 1. 计算沪深300股债性价比
  - 2. 判断当前处于买入区(>3.0)、常态区(1.5-3.0)还是卖出区(<1.5)
  - 3. 若此时四大风格象限估值分位点分别为：大盘成长5%、大盘价值8%、小盘成长12%、小盘价值6%，判断是系统性底部还是结构性底部
  - 4. 根据普通投资者生存法则，给出仓位建议（重仓/小仓位/空仓）
  - 回答问题：
  - '- 为什么十年国债收益率上升会导致股债性价比下降？这对仓位意味着什么？'
  - '- 如果PE_TTM分子用的是预测盈利而非滚动盈利，指标会有什么风险？'
- 'no': 2
  title: 基金筛选实战演练
  contents:
  - 某基金公司旗下有基金经理A、B、C三人，数据如下：
  - 经理A：管理规模180亿，近3年业绩排名前10%，投决委成员，有1座金牛奖
  - 经理B：管理规模15亿，近3年业绩排名前5%，非投决委成员，有2座金牛奖
  - 经理C：管理规模8亿，近3年业绩排名前30%，投决委成员，无金牛奖
  - 公司整体：剔除货币基金管理规模行业前三，高管为投研出身，人才梯队完善，口碑良好，价值观长期主义
  - 任务：
  - 1. 判断该公司是否属于“好公司”
  - 2. 对三位经理分别应用“好经理”三硬指标打分（通过/不通过）
  - 3. 结合“好体系”规模铁律，筛选出符合“三好标准”可买入的基金
  - 回答问题：
  - '- 为什么经理A尽管业绩好、是投决委、有金牛奖，但其管理基金可能不在买入名单内？'
  - '- “不买>50亿基金”这条铁律，在牛市中是否会导致踏空优质大基金？如何权衡？'
- 'no': 3
  title: 干扰项识别与决策净化
  contents:
  - 场景：某周发生以下事件，请判断各事件是否应纳入择时决策模型，并说明理由：
  - 1. 美联储意外加息50BP，美股大跌3%，A股高开低走
  - 2. 央行公布当月M2同比增长11.5%，超预期0.5个百分点
  - 3. 雪球/股吧讨论热度激增，“牛市旗手”券商股连续涨停
  - 4. 沪深300股债性价比从2.8跌至1.48，且指数有效跌破250日均线
  - 5. 某大型基金公司旗舰基金经理离职
  - 任务：
  - '- 将上述事件分类为：核心择时信号 / 干扰项(忽略) / 选品风控信号'
  - '- 对于第4项，结合技术分析辅助确认规则，给出具体操作指令'
  - 回答问题：
  - '- 为什么“M2超预期”属于干扰项而“十年国债收益率突破4%”却是核心信号？'
  - '- 基金经理离职属于选品风控而非择时信号，其背后的逻辑是什么？'
units:
- 'no': 1
  name: 股债性价比 —— 用单一指标穿越牛熊周期
  points:
  - '**为什么需要这个概念？**'
  - '- 普通投资者最怕“猜顶底”，频繁操作导致手续费损耗与心态失衡'
  - '- 宏观数据（M2、社融）、突发事件、情绪观察均不可靠，干扰决策'
  - '- 需要一个理论支撑强、可量化、低频高胜率的核心锚定指标'
  - '**核心定义**'
  - '- 定义：沪深300股债性价比 = (1 / 沪深300 PE_TTM) ÷ 十年国债收益率'
  - '- 本质：股票收益率（PE倒数）与无风险收益率（国债）的比值，反映权益相对债券的风险溢价合理性'
  - '- 历规律：长期在 1.5 ~ 3.0 区间波动，符合美股200年股票收益约为债券2倍的经验'
  - '**关键性质**'
  - '- 单一性：摒弃多因子模型，仅凭这一指标做大类资产轮动决策'
  - '- 低频性：几年才遇一次调仓机会，追求长期复利而非短线博弈'
  - '- 分段性：>3.0 为极度低估（重仓买入区），1.5~3.0 为常态区，<1.5 为极度高估（清仓卖出区）'
  - '- 辅助确认：顶部具体数值不可知（可能1.5、1.6、1.7），需结合技术分析（跌破长周期均线）确认拐点'
  - '**典型例子**'
  - '- 2012年底：指标>3.0且四风格全便宜（系统性底部），买什么都赚'
  - '- 2015年6月：指标<1.5且十年国债收益率高（系统性顶部），跌破趋势线果断清仓'
  - '- 2018年2月：系统性顶部，指标低位+利率突破4%，逃顶成功'
  - '- 2021年3月：指标处中位但风格撕裂（大盘成长贵、价值便宜），结构性行情，仅适合高手'
  - '**边界条件**'
  - '- 仅适用于A股主动权益基金/宽基指数择时，不适用于个股选时'
  - '- 结构性底部（如2016年、2022年）指标虽高但风格分化，普通人不宜重仓，易跑输基准'
  - '- 指标计算依赖PE_TTM滚动市盈率，盈利预测偏差大时指标会失真'
  - '- 十年国债收益率若因政策扭曲（如强制购买），分母失真导致指标失效'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 关键因子只有一项：股债性价比
  - 股债性价比=指数 PE 倒数/十年国债收益率
  - 沪深 300 股债性价比= （1/沪深 300 PE）/十年国债收益率
  - 沪深 300 股债性价比长期在 1.5-3.0 之间运行。
  - 该项指标是有理论支撑的——股票相比债券有风险溢价。
  - 过去十几年，如果在该指标 3.0 附近买入股票/基金，在 1.5 附近卖出，你就是大赢家
  - A 股有在股债性价比 1.5 的时候拐头向下，也有时候是 1.6、1.7。顶部的股债性价比具体数据，我们没有办法提前预知。
  - 结合技术分析的判断，股票性价比低的时候跌破趋势，就有很强的指导意义。
- 'no': 2
  name: 系统性 vs 结构性行情识别 —— 区分“大水漫灌”与“定向灌溉”
  points:
  - '**为什么需要这个概念？**'
  - '- 股债性价比给出估值区间，但无法区分“全市场便宜”还是“只有部分便宜”'
  - '- 普通投资者在结构性行情中极易选错风格，跑输宽基甚至亏损'
  - '- 必须建立行情分类识别机制，决定“重仓、轻仓、不仓”的仓位策略'
  - '**核心定义**'
  - '- 系统性底部：四大风格象限（大盘成长/价值、小盘成长/价值）估值**同时**处于历史低位（股债性价比>3.0）'
  - '- 系统性顶部：四大风格估值**同时**处于历史高位（股债性价比<1.5）'
  - '- 结构性底部/顶部：四大风格估值**分化**，部分便宜部分贵（股债性价比常在中位区）'
  - '**关键性质**'
  - '- 系统性底部：买什么都赚（Beta收益），胜率极高，适合普通人重仓宽基/优质主动基金'
  - '- 系统性顶部：全市场估值高+无风险利率高，清仓为上策，规避系统性风险'
  - '- 结构性行情：仅适合专业选手（年化>25%），需精准选品击中风格热点，否则极易跑输'
  - '- 当前判断：2022年类似2016年，处于结构性底部（大盘成长局部高估），非全市场机会'
  - '**典型例子**'
  - '- 2012年底：典型系统性底部，所有股票便宜，大举买入获暴利'
  - '- 2016年3月：结构性底部，大盘股便宜小盘股贵，随后两年属于大盘股行情'
  - '- 2021年3月：结构性顶部特征，大盘成长高估、价值低估，市场撕裂，难判断'
  - '- 2022年4/10月：指标再达3.0但大盘成长局部高估，结构性底部，普通人仅小仓位'
  - '**边界条件**'
  - '- 风格象限划分依赖指数编制规则，若风格定义变更（如中证改版）需重新校准'
  - '- 判断“四风格均便宜”需查看历史分位点，历史数据长度不足会导致误判'
  - '- 结构性行情中，若持仓基金风格未击中市场主线，即使大盘涨也可能亏钱'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 2012 年底是一次典型的系统性底部——所有股票都很便宜。
  - 2015 年 6 月，是一个典型的系统性顶部——所有股票都很贵。
  - 2016 年 3 月份，则属于一个结构性底部——大盘股估值已经非常便宜，但小盘股估值仍然偏贵。
  - 2021 年 3 月份比较难判断...大盘成长股估值很高，价值股、小盘股估值很便宜，市场是撕裂的。
  - 目前我们还和 2016 年类似，处在一个结构性的底部。
  - 我们不光要看沪深 300 股债性价比，也要看大盘成长/大盘价值/小盘成长/小盘价值四风格象限的估值，才能比较精准地把握结构性行情。
- 'no': 3
  name: 三好选基法（好公司、好经理、好体系） —— 只买小规模基金的筛选漏斗
  points:
  - '**为什么需要这个概念？**'
  - '- 基金数量庞大，优中选优需要标准化、可执行的筛选流程'
  - '- 基金规模膨胀后收益必然递减（容量约束），必须建立“规模否决权”'
  - '- 过去业绩不代表未来，需通过公司实力、经理核心地位、体系优势三重验证'
  - '**核心定义**'
  - '- 好公司（六维）：管规模大、高管投研出身、人才梯队完善、口碑好、价值观长期主义、经理收入高'
  - '- 好经理（三硬指标）：长期业绩居前、投资决策委员会成员、金牛奖得主（筛掉高波动赌风格）'
  - '- 好体系（核心铁律）：**只买小规模基金**，拒绝 >50亿，最优 <20亿'
  - '**关键性质**'
  - '- 公司筛选是定性评估，锁定“强”公司（如景顺、易方达、富国、中欧、交银、华安），避开“大而不强”（如华夏、南方、博时等）'
  - '- 经理筛选用硬指标：投决委成员=核心决策层水平高；金牛奖=考虑风险调整收益，筛掉短期赌风格（如蔡嵩松无金牛奖）'
  - '- 体系筛选是“一票否决”：规模>50亿直接Pass，利用小规模优势获取换仓灵活性、打新收益、迷你股超额收益'
  - '- 小规模优势三大源泉：换仓摩擦成本低、享受打新超额收益、可参与流动性差的迷你股交易'
  - '**典型例子**'
  - '- 作者实操：剔除货币基金看管理规模，考察高管背景（如张坤、刘格菘所在公司），验证投决委成员名单，统计金牛奖数量'
  - '- 反面教材：买入大规模明星基金（如易方达蓝筹扩容后），因容量约束导致后续业绩平庸'
  - '**边界条件**'
  - '- 小规模基金流动性风险：申购赎回可能受限，需确认开放日频次'
  - '- 新基金发行期规模小但无业绩验证，需结合经理过往管理其他产品业绩判断'
  - '- 规模阈值50亿/20亿为经验值，随市场容量扩大可动态调整，但“越小越优”逻辑不变'
  - '- 该方法仅适用于主动权益类基金，债券/货币/被动指数基金不适用'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 构建优质的基金组合，我推崇“三好”标准——好公司、好经理、好体系
  - 我所认为的顶级基金公司是什么样？...1. 剔除货币基金后的管理规模大 2. 公司高管是高水平基金经理出身...
  - 最简单粗暴的——选择长期业绩居前的基金经理...看基金经理是否是公司投资决策委员会成员...金牛奖数量。
  - 投资权益类基金，只需做到一步，就领先了别人大半个身位——只买小规模基金。
  - 我的原则，是不买超过 50 亿规模的基金，最好是 20 亿以下的。
  - 规模越小的基金，基金经理在交易换仓的时候，摩擦成本越小。小规模的基金还有额外的打新股超额收益。也能参与一些迷你股的交易。
  - 大规模基金公司里，给我留下好印象的公司有：景顺长城、易方达、富国、中欧、交银施罗德、华安
  - 大而不强，有规模没质量的公司：华夏、南方、博时、广发、汇添富、鹏华、天弘
- 'no': 4
  name: 择时干扰项清单 —— 宏观、事件、情绪全忽略的“减法思维”
  points:
  - '**为什么需要这个概念？**'
  - '- 投资者常被海量信息淹没：每日宏观数据、突发新闻、微信群讨论，导致决策瘫痪'
  - '- 大多数信息对中长期择时无效，甚至有害（事后诸葛亮、样本偏差、无法量化）'
  - '- 建立“负面清单”，明确什么不看、不信、不用，释放认知带宽聚焦核心指标'
  - '**核心定义**'
  - '- 三类干扰项：①突发事件/地缘/外盘 ②财政货币宏观数据 ③投资者情绪观察'
  - '- 统一处理原则：直接忽略，不纳入决策模型'
  - '**关键性质**'
  - '- 突发事件：发生时股市已跌大半，事后调仓性价比极低（如疫情、地缘冲突）'
  - '- 宏观数据：仅影响日内走势，远期影响已定价于十年国债收益率（股债性价比分母）'
  - '- 情绪观察：样本极小（幸存者偏差）、无法定量、成功率无保障（如雪球/股吧热度）'
  - '- 核心逻辑：股债性价比已隐含所有远期已知信息，额外输入只会增加噪音'
  - '**典型例子**'
  - '- 2020年疫情爆发：指数已大跌后再调仓，错失反弹最佳期'
  - '- 2018年LPR改革/MLF操作：仅影响当日波动，未改变中长期趋势'
  - '- 2015年股吧/雪球讨论热度暴增：情绪高涨往往是顶部信号，但无法量化具体拐点'
  - '**边界条件**'
  - '- 极端黑天鹅（如战争导致市场休市、货币体系崩溃）超出模型适用范围'
  - '- 若十年国债收益率因政策强制扭曲（如金融压抑），宏观数据隐含逻辑失效'
  - '- 短线交易者（日内/波段）仍需关注事件驱动与情绪博弈，本清单仅适用中长期择时'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 非关键因素包括三类：
  - ①突发性事件（如疫情）、地缘政治、外盘（港美股）波动 仅影响短期的行情，事件一发生，股市就已经跌了一大半，此时再做仓位调整，性价比太低
  - ②财政政策、中期货币政策（如 LPR、MLF）、宏观经济数据（M2、社融数据） 这类因素，可能仅能影响大盘日内的走势，直接忽略。远期的影响，已经体现在十年国债收益率里
  - ③投资者情绪观察（如周边人讨论股票的人数、xueqiu/股吧评论内容） 样本太小、无法定量分析，也没办法保证很高的成功率，应该忽略
- 'no': 5
  name: 普通投资者生存法则 —— 只做系统性行情的“懒人策略”
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数散户历史年化<25%，不具备结构性行情的选品风格切换能力'
  - '- 结构性行情中“选错风格=跑输基准=白忙活”，甚至不如买理财'
  - '- 需要一套承认平庸、降低操作频率、博取确定性收益的执行准则'
  - '**核心定义**'
  - '- 判定标准：历史年化收益 < 25% = 水平有限者'
  - '- 执行铁律：仅在 **系统性底部**（股债性价比>3.0 且 四风格全便宜）重仓买入宽基/优质主动基金'
  - '- 其余所有时间（结构性底部、震荡市、顶部区、上涨途中）：**小仓位或空仓**'
  - '- 产品选择：宽基指数基金（如沪深300、中证500ETF）或通过“三好法”筛选的小规模主动基金'
  - '**关键性质**'
  - '- 承认无能是起点：不预测、不选股、不择时（细粒度），只等“显而易见”的大机会'
  - '- 仓位管理：满仓/重仓周期极短（几个月），空仓/轻仓周期极长（几年），耐得住寂寞'
  - '- 心理建设：接受“踏空”大部分上涨行情，只为捕捉那几轮“确定性”的系统性反转'
  - '- 复利逻辑：避开大回撤（-30%以上）比追求高收益更关键，规避系统性顶部即赢大多数人'
  - '**典型例子**'
  - '- 作者实盘：2015/2018/2021三次逃顶，2015/2018/2019三次抄底，十年正收益'
  - '- 反面教材：2016年结构性底部重仓小盘成长，结果跑输大盘价值两年'
  - '- 2022年结构性底部：指标虽>3.0但风格分化，普通人仅小仓位参与，避免深套'
  - '**边界条件**'
  - '- 仅适用于A股主动权益/宽基指数资产配置，不适用于债券、商品、海外市场'
  - '- 若投资者通过刻意练习将年化提升至>25%，可逐步放宽至结构性行情参与'
  - '- 宽基指数选择需匹配风格：系统性底部买沪深300/中证500/中证1000均可，但费率/流动性差异需考虑'
  - '- 极端情况下（如指标长期失效、指数编制规则巨变），需重新验证模型有效性'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 我认为，如果是水平有限（历史年化低于 25%）的投资者，不妨等 A 股系统性底部时，再大举买入，其余时间只值得小仓位参与。
  - 就算是抓准了结构性底部，股票或者基金没买到市场热点，很有可能也会跑输私募 xueqiu 产品，甚至保本理财产品。
  - 依靠一套稳定的择时交易体系，我在 2015 年 6 月、2018 年 2 月、2021 年 2-3 月份成功逃顶，并于 2015 年 9 月、2018 年底再次进入市场。2021
    年 3 月切换赛道。到目前为止，我择时的准确率是 100%。
  - CFA 持证人，2013 年入市 A 股投资，连续十年取得正收益。
