unsupported_claims:
- location: 71.3.2 核心定义
  claim: 商业逆向工程 = 现象观察发现异常值 → 竞品全链路拆解 → 极低成本模仿搭建 → 数据反馈迭代
  reason: 素材中未找到该公式的直接定义表述，仅在章节中通过文字描述体现
- location: 71.4.2 核心定义
  claim: MVP验证 = (流量获取 → 用户转化 → 产品交付 → 收款到账) / 最低成本(金钱/时间/精力)
  reason: 素材中未找到该数学公式表述，仅有文字描述
- location: 71.5.1 核心定义
  claim: 场观数据 = {直播间实时在线人数, 短视频实时播放/点赞/评论增速, 评论区高频追问关键词}
  reason: 素材中未找到该集合论定义表述
- location: 71.6.1 核心定义
  claim: 个人商业变现结果 = 社群认知资产 × 个人执行力迁移能力
  reason: 素材中未找到该乘法公式定义表述
- location: 71.7.1 核心定义
  claim: 执行力杠杆 = (行动启动速度 × 单位时间产出量 × 容错迭代次数) / 完美主义拖延系数
  reason: 素材中未找到该数学公式定义表述
