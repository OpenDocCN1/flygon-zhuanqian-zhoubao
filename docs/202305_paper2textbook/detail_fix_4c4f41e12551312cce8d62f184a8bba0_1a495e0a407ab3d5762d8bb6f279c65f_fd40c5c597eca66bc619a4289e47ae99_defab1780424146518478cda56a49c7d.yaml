learning_targets:
- 理解生财有术教程体系的整体架构与核心逻辑
- 掌握认知底座构建：利他思维、执行力进化、承认无知、个人IP复利
- 掌握训练体系运作：小航海模式、项目筛选六大标准、MVP验证闭环
- 掌握流量底层架构：公域蓄水池、私域提款机、资料整理引流、SEO长尾复利
- 掌握AI生产力革命：ChatGPT+RPA自动化、SD云端部署、提示词工程、ControlNet控制
- 掌握实战项目库：小红书无货源/虚拟资料、视频号投流、闲鱼矩阵、AI短剧、知识付费、海外B2B/Mediabuy、长尾赛道
- 内化通用方法论资产：像素级拆解/模仿、MVP验证、异常值发现、水土匹配、废号资产化、形式迁移、复购率指标
concept_map:
- 生财有术教程体系
- ├── 认知底座与训练体系
- │   ├── 生财小航海           —— 训练营模式、项目筛选六大标准、0-1变现典型路径
- │   ├── 执行力进化论         —— 彻底执行三重境界、笨功夫方法论、注意力守恒、主要矛盾原则、防守优先
- │   ├── 认知重塑底座         —— 利他思维、承认无知三步法、个人IP复利、认知-行动耦合律、认知黑洞/三阶段决策/元认知/身心升级
- │   └── 投资财富管理体系     —— 股债性价比择时、系统性/结构性行情识别、基金三好筛选、三阶段风控、五大被动收入、流动性优先
- ├── 流量与变现架构
- │   ├── 公私域流量架构       —— 资料整理引流法、钩子设计/变现分层漏斗、付费筛选/信任交换、SEO长尾复利、微信生态内导流优势、合规引流边界
- │   ├── AI生产力革命         —— 结构化Prompt/万金油词/Temperature策略、ControlNet多模态/LoRA五步流、RPA+AI协同架构/手动跑通前提、工具组合替代单一平台
- │   └── 平民实体创业手册     —— 消费力套利、首年利润率公式/四步筛选、电影院选址/谈判组合拳/极简装修、无人值守3.0/超卖/志愿者/羊毛党
- ├── 实战项目库（八大验证模型）
- │   ├── 小红书无货源/虚拟资料   —— 选品三维验证/蓝海比值/内容工业化/双引擎流量/SEO四因子/私域漏斗/避坑红线
- │   ├── 视频号短视频挂车投流   —— 自然流vs投流、高客单选品/SKU套装、矩阵组织/三维选品/素材消重/双阶段测品/赔付/关停/黄金时间/分层放量/异常诊断/品素70-30/数据信仰/门槛红利
- │   ├── 闲鱼矩阵无货源         —— 反养号/一机一卡/垂直店铺/三维选品/爆款八要素/矩阵霸屏/创业粉引流/见面交易/差评稀释/竞品反侧写/时间成本匹配/红海规模化/权重双核心/非核心城市组团/副业天花板/保姆级教程/二手书合规/快团团大团长
- │   ├── AI短剧解说/CPS        —— 小说推文迁移/行动先于完美/选品定生死解说降维、新手四步走/AI批量化SOP/核心三要素/避坑清单/首月1.4万验证/社群精华帖/一机一号灰度
- │   ├── 知识付费/写作变现     —— 养生号起号三式/巨量百应榜单/对标橱窗日志/像素级模仿三式/无人直播矩阵置换/面相书籍爆发/PPT IP 47天16.7万/1对1陪跑验证/统一封面转粉/写作BOSS模式/回忆录蓝海/315下架避险/服务超预期/执行力内功/透明管理
- │   ├── 海外独立站B2B         —— 内容为王/五维判真/极简表单/极速响应/首轮反自嗨/留钩子成交/同行反向拆解/25天$4551验证
- │   ├── 海外Mediabuy/Brand Bid —— 品牌词近零成本/CPC-EPC套利/三步执行/授权光谱/港币账户优势/Wise推荐同构/十年长期可行性
- │   └── 长尾非标赛道         —— 二奢下行期红利/资金门槛/三分货盘/资金周转杠杆/轻重协同/同行裂变/鉴定师证书/飞阅会/全渠道货源图谱/分层出货/风控三重/直播标准化/崩盘重组验证/前员工拆分验证/全新爆款验证
- └── 通用方法论资产库
- '    ├── 像素级拆解/逆向工程   —— 全链路复现式分析获取完整SOP'
- '    ├── 像素级模仿           —— 1:1复刻降低认知负荷快速达及格线'
- '    ├── MVP最小可行性验证   —— 8元成本跑通流量-转化-交付闭环'
- '    ├── 异常值发现           —— 常态分布中识别偏离个案作为机会信号'
- '    ├── 水土不服/人群匹配度   —— 同产品跨平台/人群转化率差异，调整素材实现指数级跃升'
- '    ├── 废号资产化           —— 违规账号作低成本测试载体榨取残余价值'
- '    ├── 形式大于内容/流量密码迁移 —— 直播形式跨品类复用降低技能门槛提高产出比'
- '    ├── 复购率核心指标       —— 非标产品无高复购LTV不覆盖获客成本，高复购证明情绪价值真实性'
- '    ├── 低成本验证优于完美策划 —— <1100元跑通闭环，真实交易数据唯一标准'
- '    ├── 平台风控窗口期       —— 快进快出榨取价值而非硬刚平台，接受非长期主义属性'
- '    └── 方法论资产>单项目收益 —— 内化迁移能力跨周期跨赛道复利，执行力是知识变现关键杠杆'
life_analogy:
- 想象生财有术教程体系是一座**从认知地基到变现顶楼的摩天大楼**：
- '- **地基（认知底座）**：利他思维是混凝土，承认无知是钢筋，个人IP复利是预应力，执行力进化论是施工规范——不打牢地基，楼盖得再高也会塌'
- '- **骨架（流量架构）**：公域是蓄水池（小红书/抖音/视频号），私域是提款机（微信/社群），资料整理是连接管道，变现分层漏斗是过滤系统——水不流通，提款机就没水'
- '- **电梯（AI生产力）**：结构化Prompt是按钮，ControlNet是楼层选择，RPA是自动运行程序，LoRA训练是定制装修——不会按电梯只能爬楼梯（人工），电梯坏了（手动没跑通）也得靠腿'
- '- **样板间（实战项目库）**：八大验证模型是八套不同户型的精装修样板间（小红书/视频号/闲鱼/短剧/知识付费/海外B2B/Mediabuy/长尾），都有实测水电费数据（ROI/利润/周期）和避坑指南（风控/天花板/合规）'
- '- **万能钥匙（通用方法论）**：像素级拆解是开锁工具，MVP验证是试钥匙，异常值发现是看门眼，水土匹配是换锁芯，废号资产化是备用钥匙，形式迁移是通用钥匙胚，复购率是验收标准——掌握钥匙制作原理，换什么锁（新项目）都能配'
- 就像盖房子不能只买砖头（工具）不看蓝图（方法论），创业也不能只学招式（项目）不练内功（认知与方法论）。
summary:
- concept: 生财小航海
  desc: 项目制训练营模式，通过截止节点/公开承诺/同伴监督/导师点评四大机制强制跑通0-1商业闭环
- concept: 执行力进化论
  desc: 彻底执行=SOP标准化+全员全时段+穿越周期；笨功夫=海量拆解+工程细节+3-5年刻意练习；复利=正向案例验证+反向教材警示
- concept: 认知重塑底座
  desc: 利他思维(商业底层逻辑)+承认无知三步法(破全能幻觉)+个人IP复利(百年不改名)+认知黑洞/三阶段决策/元认知微操作/身心升级(冥想/运动)
- concept: 公私域流量架构
  desc: 公域蓄水池→私域提款机；资料整理引流法(钩子设计)→变现分层漏斗(资料→咨询→高客单)；付费即筛选，信任源于交换；SEO长尾复利>推荐流量脉冲
- concept: AI生产力革命
  desc: AI是放大器非救世主；核心=Prompt工程+业务拆解+自动化串联；关键技术=结构化Prompt/ControlNet/LoRA五步流/RPA+AI协同/手动跑通前提
- concept: 平民实体创业手册
  desc: 消费力套利(三四线同价异成本)；首年利润率公式(月价×座位×85%×12/总成本)；电影院选址铁律；无人值守3.0(小程序/超卖/志愿者/羊毛党)
- concept: 八大验证模型
  desc: 小红书无货源/虚拟资料(月纯利30-50万)；视频号投流(ROI1:1.5-1:3/月佣10-20万)；闲鱼矩阵(7-400店/月销千单)；AI短剧(日产50-100条/首月1.4万)；知识付费(年入百万/边际成本趋零)；海外B2B(月入$2k-10k)；Mediabuy(ROI359-496%/单人百万)；长尾赛道(二奢/手机壳/写作店铺)
- concept: 需求三部曲
  desc: 发现(生活对话/数据/热点)→验证(评论区/搜索指数/私信)→解决(拆解问题+组合现有资源非硬核自研)；跨域复用实现反脆弱
- concept: 投资财富体系
  desc: 股债性价比择时(>3买/<1.5卖)；基金三好筛选(公司/经理/体系<50亿)；三阶段风控(守收入/守净资产/标普配置)；五大被动收入支柱；流动性优先铁律
- concept: 生财通用方法论
  desc: 像素级拆解/模仿获取SOP；MVP低成本验证；异常值捕捉机会；水土匹配指数级跃升；废号资产化榨取残值；形式迁移降维打击；复购率验证商业可行性；方法论资产跨周期复利
exercises:
- 'no': 1
  title: 小航海项目筛选实战演练
  contents:
  - 假设你是一名月薪8000的程序员，想利用业余时间做副业，手头有5000元启动资金，擅长Python和数据分析，对AI绘图感兴趣。
  - 请使用‘小航海项目筛选六大黄金标准’逐项评估以下三个备选项目，并决定选择哪一个启动：
  - 项目A：开发一款AI绘图提示词优化的Chrome插件，挂载Chrome商店收费订阅
  - 项目B：在小红书运营‘AI绘图提示词教程’账号，引流私域卖9.9元资料包，后端转化299元训练营
  - 项目C：采购二手显卡搭建本地Stable Diffusion服务，接单帮人出图，单价50元/百张
  - 评估维度：
  - 1. 正向现金流速度（首笔收入预计周期）
  - 2. 供应链/囤货复杂度（是否涉及实物/硬件/库存）
  - 3. SOP标准化程度（核心流程能否文档化/外包）
  - 4. AI工具杠杆率（核心环节是否可用AI大幅提效）
  - 5. 公域获客路径明确性（搜索/推荐/广告哪条路最通）
  - 6. 后端高客单/高复购产品可行性（LTV能否>500元）
  - 回答问题：
  - '- 哪个项目综合得分最高？为什么？'
  - '- 如果你只有每晚2小时碎片时间，结论会改变吗？'
  - '- 如果启动资金增加到5万元，会考虑新项目吗？'
- 'no': 2
  title: 视频号带货投流参数手算与决策
  contents:
  - 某视频号带货账号测品数据如下：
  - 计划预算：200元/天，投放时长：6小时
  - 消耗：180元，曝光：15万，点击：1200，加购：45，下单：12，实付金额：2400元，佣金率：30%
  - 商品售价：200元/单，利润率：40%（扣除成本后）
  - 请手算以下指标并判断决策：
  - 1. CTR（点击率）= 点击/曝光
  - 2. CVR（转化率）= 下单/点击
  - 3. ROI（投资回报率）= 佣金收入/消耗
  - 4. 单次下单成本（CPA）= 消耗/下单数
  - 5. 估算EPC（每次点击收益）= 佣金收入/点击数
  - 决策题：
  - '- 根据‘双阶段测品法’，这是1测还是2测？该进入‘放量’还是‘换素材/关停’？'
  - '- 若进入2测探价阶段，建议出价策略如何设定？（参考：出价阶梯降50）'
  - '- 若该素材后续3天数据波动：Day2 ROI=1.1，Day3 ROI=0.9，Day4 ROI=1.3，如何应用‘关停止损公式’与‘分层放量操盘’决策？'
  - '- 该账号处于‘高客单走大额卡赔付’还是‘低客单走小额叠投勤关停’策略层？依据是什么？'
- 'no': 3
  title: AI内容自动化流水线搭建推演
  contents:
  - 目标：搭建一条‘选题→生成文案→生成配图→排版成图→定时发布→数据回收’的全自动化小红书笔记生产线。
  - 可用工具：ChatGPT (API)、Stable Diffusion (本地/Colab)、RPA工具 (按键精灵/Auto.js/Coze)、Excel/飞书表格、Notion。
  - 请设计完整流程并回答：
  - 1. Prompt工程层：如何设计‘结构化提示词模板’覆盖选题生成、标题生成、正文生成、标签生成四个节点？请给出一个通用模板结构示例。
  - 2. 数据流层：如何用Excel/飞书表格作为‘中间数据总线’，实现‘关键词库→ChatGPT批量生成→SD批量生图→RPA读取发布’的解耦？关键字段有哪些？
  - 3. RPA执行层：小红书发布端自动化的关键难点有哪些？（提示：登录态保持、图文上传顺序、定位发布按钮、频控规避、数据回写）
  - 4. 成本核算：假设单条笔记调用ChatGPT $0.002、SD生图$0.001（Colab免费但算时间成本）、RPA运行$0.01/条（人工监管摊销），日产50条，月成本几何？人工成本对比（时薪50元，手工单条20分钟）下，自动化盈亏平衡点在哪里？
  - 5. 风控预案：若小红书升级风控导致RPA失效（如滑块验证码、设备指纹检测），应急方案是什么？如何利用‘废号资产化’和‘手动跑通是自动化前提’原则快速恢复？
- 'no': 4
  title: 需求三部曲与MVP验证实战
  contents:
  - 场景：你发现身边很多宝妈在抱怨‘孩子不爱吃饭、挑食严重、辅食做法不会’，怀疑这是一个高需求赛道。
  - 请严格遵循‘需求三部曲：发现-验证-解决’完成以下任务：
  - 阶段1 发现：列举3个具体的‘留心生活对话/数据/热点’信息来源，并记录至少5句原始痛点语录。
  - 阶段2 验证：设计‘评论区需求验证法’操作步骤：在小红书/抖音/知乎搜索什么关键词？重点分析评论区哪3类高频语义？（如‘怎么做’、‘多少钱’、‘求推荐’）如何量化‘需求强度指数’？
  - 阶段3 解决：假设你不会做辅食、不懂营养学、没供应链。请运用‘资源重组交付法’设计交付物：核心交付物是什么？（视频/文档/社群/咨询？）外部资源从哪获取？（唱吧素人/公开课/合作营养师/母婴品牌方？）如何拆解‘不会核心技能’的交付流程？
  - MVP验证：设计一个‘8元成本/7天跑通’的最小闭环：买什么域名/工具？发什么钩子内容？引流到哪？卖什么首单产品？多少钱？成功标准是什么？（如：进私域>20人，成交>3单，ROI>1）
  - 反脆弱性检验：如果该赛道3个月后变红海（竞品涌入、流量成本上升），你的‘思维模型跨域复用’能力如何迁移到新赛道？请列举3个可迁移的核心模块。
- 'no': 5
  title: 个人IP与财富管理复盘沙盘
  contents:
  - 角色设定：你是一名已跑通‘小红书资料引流+私域卖课’模型的创业者，月纯利稳定5万元，私域好友3000人，想进入财富管理与IP资产化的下半场。
  - 任务1 个人IP资产化审计：
  - '- 当前全域同名覆盖率？（小红书/抖音/视频号/公众号/B站/知乎/小宇宙）'
  - '- 内容资产沉淀度？（爆款笔记数/可复用SOP文档数/标准化课件模块数）'
  - '- 信任资产指标？（私域好友数/高客单成交客户数/复购率/转介绍率）'
  - 任务2 三阶段风控配置模拟：
  - '- 假设年收入60万，净资产30万，无房贷/幼儿。请按‘三阶段风控模型’填写：'
  - '  一阶段（守收入）：年亏损上限设多少？投资仓位上限？'
  - '  二阶段（守净资产）：净资产20%上限=6万，引入2倍杠杆后可投资额度？标普资产配置比例建议？'
  - '  三阶段（搭台利他）：何时触发？核心动作是什么？'
  - 任务3 五大被动收入支柱布局可行性评估：
  - 对经纪佣金、超短线委托、淘宝客裂变、可转债百户代打、四大行存款套利五个支柱，结合你的‘程序员背景+私域流量+5万月结余’，逐项打分（1-5分，5分最易上手）并说明核心阻力点。
  - 任务4 ‘名利分离定理’压力测试：
  - '- 如果你的某篇笔记意外上热门，单日涨粉5万，媒体求访谈、广告找上门、陌生人加微信骚扰。此时你是选择‘放大流量变现’还是‘主动隐退/物理隔离/社交防火墙’？依据‘名气是赚钱后的代价’理论，写出你的决策理由与执行清单。'
