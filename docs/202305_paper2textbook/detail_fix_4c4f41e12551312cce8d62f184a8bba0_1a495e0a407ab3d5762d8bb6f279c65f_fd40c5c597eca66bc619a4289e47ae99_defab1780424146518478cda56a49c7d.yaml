  excerpts:
  - 生财有术教程体系：认知底座→训练体系→流量架构→AI生产力→实战项目库→方法论资产库
  - 执行力稀缺性定律：道理都懂却过不好这一生，核心缺口在于执行力而非认知
  - 彻底执行三重境界：SOP标准化、全员全时段、穿越周期
  - 利他思维：商业协作的底层逻辑，优先为用户创造价值
  - 承认无能与无知：成长的起点，放下体面从最微小确定动作做起
  - 个人IP复利策略：百年不改名，全域用同名，统一ID/头像/简介降低认知成本
  - 公私域协同模型：蓄水池与提款机，资料整理引流法实测日均引私域180+
  - AI赚钱第一性原理：放大器而非救世主，核心竞争力在于提示词工程+业务拆解+自动化串联
  - 八大验证模型：小红书/视频号/闲鱼/短剧/知识付费/海外B2B/Mediabuy/长尾赛道
  - 需求三部曲：发现-验证-解决的通用商业落地模型，项目不值钱挖掘逻辑才值钱
  - 方法论资产>单个项目收益：内化迁移能力跨周期跨赛道复利
