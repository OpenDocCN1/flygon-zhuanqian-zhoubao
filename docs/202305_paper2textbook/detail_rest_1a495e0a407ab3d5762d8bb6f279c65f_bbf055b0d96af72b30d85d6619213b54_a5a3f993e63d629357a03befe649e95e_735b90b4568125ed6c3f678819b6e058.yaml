life_analogy:
- 想象 Mediabuy 品牌词竞价是**在品牌官方旗舰店门口发传单赚佣金**：
- '- **品牌词** = 想进旗舰店买货的精准顾客搜索入口'
- '- **Google Ads 竞价** = 你在门口支个小摊位（成本极低，因为品牌方默许/无人竞争）'
- '- **联盟追踪链接** = 你手里的专属推荐码/二维码'
- '- **EPC - CPC** = 顾客扫码买货你赚的佣金减去摊位费（正向差价即利润）'
- '- **Awin 双周付** = 结账快、信誉好、不赖账的财务公司'
- 就像守在品牌流量必经之路，用近乎零成本的摊位，把官方原本免费的自然流量‘合法截胡’变现。
summary:
- concept: Mediabuy Brand Bid
  desc: 付费竞价品牌词直链联盟链接，吃 CPC 与 EPC 差价
- concept: 品牌词近零成本定理
  desc: 品牌词相关性极高、无竞争，实际 CPC 稳定在 0.01 当地货币
- concept: CPC/EPC 套利模型
  desc: 只要 CPC < EPC 即稳赚，实测 ROI 359%-496%
- concept: 三步执行流程
  desc: 开户→选 Offer→直链投放，无需建站，Direct Linking 降维打击
- concept: Offer 筛选四指标
  desc: 大品牌词、允许竞价、EPC>0.01、双周付，只捡确定性高的钱
- concept: 极低出价策略
  desc: 最高 CPC 设 0.01，港币账户再降 7 倍，成本趋近于零
- concept: 合规授权光谱
  desc: 显性允许>默许>仅允许竞品词，总能找到合规大品牌
- concept: 账户资产隔离
  desc: 广告户/联盟户/收款户三分离，单点失效不伤筋动骨
- concept: 铁三角验证法
  desc: 联盟佣金单+广告花费单+到账单三单对账，拒绝幸存者偏差
- concept: 长期可行性断言
  desc: 十余年存续，三方博弈平衡点稳定，单人年入百万轻松达成
exercises:
- 'no': 1
  title: 手算一次套利账单
  contents:
  - 某账户推广某 SaaS 产品品牌词，数据如下：
  - 联盟后台显示：点击量 12,500，佣金收入 $3,750（含汇率换算）
  - Google Ads 后台显示：花费 $850，展现量 450,000，点击率 2.78%
  - 请计算：
  - 1. EPC（每次点击收益）
  - 2. CPC（每次点击成本）
  - 3. ROI（投资回报率）
  - 4. 利润率
  - 回答问题：
  - '- 如果该品牌词 CPC 突然涨到 $0.05，EPC 不变，项目还能做吗？为什么？'
  - '- 为什么要求 Offer 必须双周支付？月付联盟有什么隐性风险？'
- 'no': 2
  title: Offer 筛选实战演练
  contents:
  - 在 Awin 后台发现三个 Offer，请按筛选规则判断是否通过，并说明理由：
  - Offer A：知名电商平台，品牌词月搜索量 200 万，条款明确允许联盟竞价品牌词，EPC $0.12，月付。
  - Offer B：小众工具软件，品牌词月搜索量 5 万，AM 口头默许竞价，EPC $0.08，双周付。
  - Offer C：头部金融服务商，品牌词月搜索量 150 万，条款禁止品牌词但允许竞品词，EPC $0.03，双周付。
  - 回答问题：
  - '- 哪个 Offer 最优？次优？为何排除最差的？'
  - '- 如果 Offer A 改为双周付，它会成为首选吗？为什么？'
- 'no': 3
  title: 合规红线压力测试
  contents:
  - 你的账户组正常运行 3 个月，突然某核心 Offer 的 AM 发邮件通知：'检测到品牌词竞价违规，要求 24 小时内暂停相关广告活动，否则封号扣佣。'
  - 请设计应急预案：
  - 1. 即时动作（1 小时内）
  - 2. 短期调整（24 小时内）
  - 3. 中期策略（1 周内）
  - 回答问题：
  - '- 如何判断该 Offer 是''显性允许''转''禁止''，还是原本就是''默许''灰区？'
  - '- 账户资产隔离原则在这一刻如何保护你的整体业务？'
- 'no': 4
  title: 港币账户成本优势验算
  contents:
  - 假设汇率：1 USD = 7.8 HKD。
  - 同一品牌词，美元账户最高 CPC 设 $0.01，港币账户最高 CPC 设 HK$0.01。
  - 请计算：
  - 1. 港币账户实际美元成本是多少？
  - 2. 成本降低倍数是多少？
  - 3. 如果日预算 $100，美元账户可买约 10,000 次点击，港币账户约多少次？
  - 回答问题：
  - '- 为什么作者说''港币账户成本再降 7 倍，但与项目是否赚钱关系不大''？'
  - '- 港币账户开户难度大、汇率波动风险，实操中如何权衡？'
- 'no': 5
  title: Wise 同构案例拆解
  contents:
  - Wise 推荐计划：单笔佣金 £50，品牌词 'Wise/TransferWise'，作者出价 £0.01-£0.02。
  - 请分析：
  - 1. 该模式的 EPC 固定为多少？
  - 2. 为什么说'广告成本完全不决定是否赚钱，可以忽略不计'？
  - 3. 相比 Awin 联盟 Offer，Wise 官方推荐计划的核心优势在哪三点？
  - 回答问题：
  - '- 如果 Wise 突然降低推荐奖励到 £10，该模式还成立吗？临界点在哪里？'
  - '- 为什么作者强调''认知差距决定收益上限''？这个项目的认知门槛在哪里？'
