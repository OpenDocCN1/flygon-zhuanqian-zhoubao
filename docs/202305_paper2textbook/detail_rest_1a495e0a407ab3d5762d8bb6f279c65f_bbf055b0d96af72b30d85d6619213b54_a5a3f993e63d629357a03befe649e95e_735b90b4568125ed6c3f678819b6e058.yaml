learning_targets:
- 理解 Mediabuy 品牌词竞价的核心套利逻辑：利用品牌词近零 CPC 与联盟 EPC 的差价获利
- 掌握 Google Ads 账户准备、Awin 联盟选品、直链投放的三步标准化执行流程
- 掌握 Offer 筛选的四大硬指标：大体量品牌词、允许竞价、EPC>0.01、双周支付
- 掌握极低成本出价策略：最高 CPC 设 0.01 当地货币、港币账户进一步降本 7 倍
- 理解合规性边界与风控体系：品牌词授权光谱、账户资产隔离、熔断机制
- 建立实战数据验证思维：铁三角验证法（联盟后台+广告后台+到账单）、多账户多周期交叉验证
- 能独立跑通 Mediabuy 品牌词竞价的最小商业闭环，并具备规模化复制的判断力
