learning_targets:
- 理解消费力套利的核心逻辑与适用边界
- 掌握电影院选址法则与实地踩盘SOP的执行标准
- 掌握首年利润率公式与城市筛选四步判断法的量化决策流程
- 掌握极简装修交付标准与谈判签约组合拳的标准化动作库
- 理解无人值守3.0模式的系统架构与佛系运营的底层心理机制
- 能根据自身资源禀赋判断是否适合切入三四线实体创业赛道
concept_map:
- 平民实体创业标准化手册
- ├── 核心商业逻辑
- │   ├── 消费力套利  —— P001
- │   │   ├── 定义：三四线城市同价异成本的价格剪刀差
- │   │   ├── 核心公式：首年利润率 = (月卡价×座位数×85%×12)/(年租+软硬件成本)
- │   │   ├── 适用业态：非标准化、强体验、高频次的休闲/学习/社交类消费
- │   │   └── 典型验证：龙岩店首年255%/次年638%利润率、汕头vs佛山蓝海对标
- │   ├── 三四线城市实体创业确定性定理  —— P001
- │   └── 自习室人群分层与需求映射定理  —— P001
- ├── 选址决策体系
- │   ├── 电影院选址法则  —— P002
- │   │   ├── 唯一硬指标：有电影院开1公里内，无则Pass
- │   │   ├── 底层逻辑：成熟商业体选址大脑的免费复用
- │   │   └── 验证手段：交通全模拟(步行/电动/地铁/车)体感测算
- │   ├── 实地踩盘SOP  —— P002
- │   │   ├── 核心商圈筛选(电影院/麦肯/时尚业态)
- │   │   ├── 户型筛选(大平层/方正/5.5-6m纵深/高楼层/避噪)
- │   │   └── 物业利益绑定(佣金/红包/尊重/解决梯控门禁)
- │   └── 城市筛选模型  —— P006
- │       ├── 步骤1：人口>200万且人口/5万>现有店数
- │       ├── 步骤2：同省同量级城市横向对比(人口/经济/高中/星巴克)
- │       ├── 步骤3：核考研人数、高中数量
- │       └── 步骤4：查美团闭店率及同行运营水平
- ├── 空间交付体系
- │   ├── 极简装修交付标准  —— P003
- │   │   ├── 五固定包干制：工艺/材料/品牌/工期/报价
- │   │   ├── 5-7天极速交付流程
- │   │   ├── 标准化清单：地毯拼装/匚字椅/小米AX6000/全软硬件清单
- │   │   └── 结款比例：2:3:5或装完付费
- │   └── 谈判签约组合拳  —— P005
- │       ├── 看房话术：波澜不惊/装老手/只谈缺点
- │       ├── 砍价策略：极限砍价→抛半年付/月付筹码→换让价
- │       ├── 核心条款包：免租装修期/不涨租不卖房/配合证照/留开票权
- │       └── 物业博弈：佣金/红包/尊重绑定利益群体
- ├── 运营管理体系
- │   ├── 无人值守3.0模式  —— P004
- │   │   ├── 硬件层：小程序选座/开门/断电/监控语音/远程门锁
- │   │   ├── 组织层：会员制私域/小管家志愿者(课时换巡查)/酒店保洁(10元/天)
- │   │   ├── 策略层：2倍超卖/佛系运营/情感连接(照片墙/打卡榜/早晚打卡送课时)
- │   │   └── 零固定人力成本闭环
- │   ├── 佛系运营  —— P001
- │   │   ├── 容忍羊毛党造氛围/营造满座感
- │   │   ├── 情感连接：上岸照片墙/打卡排行榜/早晚打卡送课时
- │   │   └── 监控语音播报替代人工管控
- │   ├── 产品矩阵定价法  —— P001
- │   │   ├── 全价格带覆盖：次卡/小时卡/天/周/月/季/半年/年/固定/储值
- │   │   ├── 长期卡营销化命名(如必过冲刺卡)
- │   │   ├── 座位少则减短期卡筛选客群
- │   │   └── 定价向目标产品倾斜/规则由商家制定
- │   └── 私域裂变获客体系  —— P001
- │       ├── 全平台铺货(美团/大众/小红书/抖音本地生活)
- │       ├── 评论区人工干预/引导加微入群
- │       ├── 小管家招募(送课时/专属团单)
- │       └── 综合成本优势实现赢家通吃
- └── 实证验证体系
- ├── 龙岩店实盘回测：首年255%/次年638%利润率  —— P006
- ├── 汕头vs佛山蓝海对标验证  —— P006
- ├── 物业利益绑定降维打击：100元搞定垃圾清运/全系统配合  —— P005
- ├── 小管家志愿者替代保洁/酒店保洁10元/天  —— P004
- ├── 存量市场赢家通吃演进定理  —— P001
- └── 副业可行性与规模化临界点声明  —— P001
life_analogy:
- 想象开实体店像**在三四线城市用一线城市的价格菜单、三线城市的房租成本开一家「自助餐厅」**：
- '- **消费力套利** = 菜单定价参考北京上海(用户心理价位一致)，但食材采购、场地租金、服务员工资按老家县城算，中间的差价就是纯利润'
- '- **电影院选址法则** = 不用自己研究人流、选址，直接跟着「肯德基/麦当劳/电影院」这些自带选址大脑的巨头走，它们选哪个商圈，你就开在隔壁1公里内，省去踩点试错的学费'
- '- **首年利润率公式** = 开店前先算账：(客单价×翻台率×365)/(年房租+装修设备) = 投资回报率，算不明白不签合同，把「赌概率」变成「算确定性」'
- '- **极简装修标准** = 像点外卖套餐一样装修：固定菜单(工艺/材料/品牌)、固定送达时间(5-7天)、固定价格(包干无增项)、固定质量(标准化清单)，拒绝「厨师推荐、今日食材有变」的非标坑'
- '- **无人值守3.0** = 把餐厅变成「智能图书馆」：手机下单(小程序选座)、刷码开门(电子门锁)、到点自动清场(断电)、会员自治(志愿者换免费时长)、保洁外包给楼上酒店阿姨(10元/天)、超卖座位(借鉴健身房逻辑)、羊毛党反而造氛围'
- '- **谈判组合拳** = 租房谈判像买车：先装专家只挑缺点压预期，再砍到死价抛出「半年付/月付」现金流筹码换降价/免租/条款，最后塞进「不涨租/不卖房/配合证照」护身符，物业经理用一顿烟钱(100元)搞定整个利益链条'
summary:
- concept: 消费力套利
  desc: 三四线城市品质消费心理价位不变、成本显著更低的价格剪刀差，是小成本高确定性创业的战略锚点
- concept: 首年利润率公式
  desc: (月卡价×座位数×85%×12)/(年租+软硬件成本)，租房前即可测算盈利预期的量化决策工具
- concept: 电影院选址法则
  desc: 唯一硬指标：有电影院开1公里内，无则Pass，用成熟商业体选址大脑替代直觉降维打击选址失误
- concept: 城市筛选四步法
  desc: 人口/5万>现有店数 → 同省横向对比 → 考研高中数据 → 美团闭店率，租房前锁定盈利确定性
- concept: 极简装修交付标准
  desc: 五固定包干制(工艺/材料/品牌/工期/报价)，5-7天极速交付，将装修从非标工程标准化为固定套餐
- concept: 谈判签约组合拳
  desc: 波澜不惊看房→极限砍价→抛半年付筹码→争免租装修期→锁不涨租不卖房条款→物业利益绑定
- concept: 无人值守3.0模式
  desc: 小程序全流程线上化+会员制私域+志愿者替代保洁+2倍超卖+佛系运营，构建零人力运营闭环
- concept: 佛系运营
  desc: 容忍羊毛党造氛围、情感连接建立自律文化、监控语音替代人工管控，低控制高容错实现用户自治
- concept: 产品矩阵定价法
  desc: 全价格带覆盖+长期卡营销化命名+座位少减短期卡筛选客群+定价向目标产品倾斜
- concept: 私域裂变获客体系
  desc: 全平台铺货+评论区人工干预+引导加微入群+小管家招募(课时/团单激励)+综合成本优势赢家通吃
- concept: 存量市场赢家通吃演进定理
  desc: 早期同行推广帮教育用户，中期靠更低综合成本+互联网+私域+精细化运营建立效率护城河，最终赢家通吃
- concept: 龙岩店实盘回测
  desc: 50座/月卡500/年租10万：首年利润率255%，次年638%，验证公式有效性与复利确定性
- concept: 汕头vs佛山蓝海验证
  desc: 同量级城市(400万人口)，佛山100家vs汕头2家，经济/高中/星巴克/电影院相当，量化发现蓝海机会
- concept: 物业利益绑定降维打击
  desc: 装修垃圾100元搞定/全系统配合，验证位卑权重下利益绑定>对抗的社会学洞察与实操杠杆
exercises:
- 'no': 1
  title: 手算一家自习室的首年利润率
  contents:
  - 假设你在某三四线城市核心商圈(有电影院)看中一处房源：
  - 年租金：12万元（含免租装修期15天）
  - 可用面积：80平米，规划50个座位(含走廊/卫生间/前台)
  - 月卡拟定价：480元/月
  - 软硬件一次性投入：桌椅50套@120元、路由器2台@800元、智能门锁/开关系统3000元、小程序SaaS年费2000元、装修包干3.5万元、软装/文具/零食/应急包等5000元
  - 预估运营折损系数：85%（含空置/超卖抵消/请假/设备折旧）
  - 请计算：
  - 1. 全年房租+软硬件总成本 = ?
  - 2. 满房年收入(不打折) = ?
  - 3. 扣除85%折损后的首年实际收入 = ?
  - 4. 首年利润率 = ?
  - 5. 次年利润率(扣除软硬件折旧后) = ?
  - 回答问题：
  - '- 如果月卡价降至380元，利润率还能接受吗？临界价格是多少？'
  - '- 座位数增加到60个(更紧凑布局)，利润率如何变化？边际收益递减点在哪里？'
  - '- 为什么公式中用85%而非90%或80%？这个系数包含哪些隐性损耗？'
- 'no': 2
  title: 实地踩盘模拟决策：选址去留判断
  contents:
  - 你在某三线城市(人口280万，现有自习室3家)发现两个备选铺位，均在电影院1.2公里范围内(略超1公里红线)：
  - 铺位A：某老牌商场4楼，年租10万(月付/押一)，大平层无柱，纵深6米，同层有KTV/网吧，物业费含水电网，物业经理态度强硬拒绝装修垃圾外运协助，需自行雇车(约2000元/次)，梯控需刷卡，客户上楼麻烦
  - 铺位B：某新建写字楼3楼，年租13万(半年付/押一)，大平层有2根柱子，纵深5.5米，同层为教育培训/美甲/瑜伽业态聚集，物业费不含水电，物业经理同意装修垃圾免费清运、配合办证、提供2个免费车位、梯控可设访客模式，但要求签3年起租
  - 请基于「选址实地踩盘SOP」与「谈判签约组合拳」进行决策：
  - 1. 列出两铺位的核心优劣势对比表(含显性成本/隐性成本/流量质量/运营便利度/谈判空间)
  - 2. 铺位A虽便宜3万/年，但物业不配合、梯控不便、同层业态干扰大，如何量化这些隐性成本？是否可通过谈判化解？
  - 3. 铺位B贵3万/年，但物业全配合、同层业态协同、梯控友好、免费车位，这3万溢价的ROI如何测算？半年付现金流压力是否可承受？
  - 4. 两铺位均超电影院1公里红线(1.2km)，是否可破例？需补充哪些验证数据(如实测步行/骑行时长、竞品分布、人流热力图)才能决策？
  - 5. 若最终选择铺位B，设计谈判话术清单：如何用半年付换更多免租期？如何锁定3年不涨租/不卖房？如何把物业经理的口头承诺写入合同附件？
- 'no': 3
  title: 无人值守3.0系统设计与异常预案推演
  contents:
  - 你决定复制无人值守3.0模式开一家50座自习室，小程序SaaS已购买(含选座/开门/到点断电/会员/营销模块)，硬件(智能门锁/开关系统/监控/路由器)已安装调试完毕，开业前需完成以下系统配置与预案设计：
  - 1. 会员体系设计：设置3个会员等级(L1/L2/L3)，分别对应什么权益(时长折扣/选座优先/小管家资格/专属团单)？如何设计升级路径(累计时长/邀请好友/打卡天数)形成留存飞轮？
  - 2. 小管家招募与管理SOP：招募话术/入职培训清单(巡查频次/卫生标准/异常上报/语录话术)/考核奖惩(课时增减/专属团单/除名机制)/排班表设计(覆盖早8晚23核心时段)
  - 3. 超卖策略参数设定：2倍超卖(100张月卡/50座)下，如何设置高峰时段(早8-10/晚19-22)限位逻辑？如何处理「到店无座」投诉？退款/补偿/升级座位标准化话术是什么？
  - 4. 佛系运营边界界定：羊毛党占座超时30分钟/吃带味零食/大声接打电话/两人占一座，哪些行为属于「造氛围」可容忍，哪些属于「破坏体验」必须干预？干预手段仅限监控语音/小管家劝导/群内@，拒绝物理驱逐，如何设计分级干预话术库？
  - 5. 异常故障预案库(本地应急联系人/志愿者处理)：
  - '   - 停电/跳闸：门禁断电/路由断电/监控断电，恢复流程与用户通知话术'
  - '   - 智能门锁故障(卡死/掉线/电池耗尽)：远程开锁/临时密码/物理钥匙备用/用户安抚'
  - '   - 网络中断(运营商故障/路由器死机)：4G备用网卡/手机热点/离线开门码生成'
  - '   - 卫生突发(呕吐/洒饮料/厕所堵塞)：酒店保洁阿姨10元/天是否含应急处理？需额外约定什么响应时长/费用？'
  - '   - 消防/安检突击检查：证照摆放位置/消防器材检查/疏散指示标志/应急照明，小管家/应急联系人配合清单'
  - 6. 情感连接系统化运营：上岸照片墙征集/打卡排行榜更新频次/早晚打卡送课时规则/生日/考试关键节点关怀/老带新裂变海报模板，设计全年运营日历关键节点
