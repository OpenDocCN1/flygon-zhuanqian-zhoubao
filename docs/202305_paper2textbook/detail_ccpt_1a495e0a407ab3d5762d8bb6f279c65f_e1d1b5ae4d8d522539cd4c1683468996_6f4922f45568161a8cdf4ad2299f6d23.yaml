units:
- 'no': 1
  name: 复制爆款起号法 —— 让新号借用老号的爆款基因
  points:
  - '**为什么需要这个概念？**'
  - '- 新号冷启动面临无权重、无标签、内容方向不确定的三重困境'
  - '- 从零创作爆款成本高、周期长、成功率低，属于高风险赌博'
  - '- 平台算法偏好已验证的优质内容结构，重发爆款可规避选题/标题/封面/合规四大核心风险点'
  - '**核心定义**'
  - '- 直接搬运同领域头部/腰部账号历史爆款笔记（选题、标题、封面、结构），经微调后在新号发布'
  - '- 利用“小红书不怎么查重”及爆款基因跨账号可迁移特性，快速获取账号初始权重与垂直标签'
  - '- 起号期前5篇必须为非营销干货笔记，过早植入营销内容导致标签偏离'
  - '**关键性质**'
  - '- 爆款基因可迁移性：选题角度、标题钩子、封面设计、合规性四要素跨账号复用有效'
  - '- 平台查重宽松性：重发内容依然获得推荐，大概率复现爆款表现'
  - '- 标签保护期：新号前2天5篇纯干货建立垂直标签，是起号存活红线'
  - '- 横向复制性：该方法可标准化为SOP，支撑兼职团队/矩阵账号批量执行'
  - '**典型例子**'
  - '- 职称赛道：搜索“中级职称评审”高赞笔记，提取标题结构“后悔没早知道的XX潜规则”，替换地域/专业关键词发布，新号单篇获赞破千'
  - '- 兼职团队横向复制：核心账号产出SOP，兼职账号执行“复制爆款”标准动作，多账号覆盖关键词矩阵'
  - '**边界条件**'
  - '- 仅适用于起号期（前5篇）及矩阵化量产阶段，长期运营仍需原创内容建立IP护城河'
  - '- 必须规避营销性质爆款（含引流钩子），前期仅复制纯干货类爆款'
  - '- 依赖领域内存在可搬运的历史爆款库，冷门新赛道可能无素材可复制'
  - '- 账号主体需为真实用户行为（养号打标），裸号直接发布易判营销号'
  sources:
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: origin
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: improve
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: critique
  excerpts:
  - 👉先说结论，秘诀就是「复制爆款」。因为一篇笔记如果成为了爆款，那么它基本是规避了「选题、标题或封面不佳」和「笔记违规」的问题。
  - 真相是「小红书不怎么查重」，重发的笔记依然有流量，并且很大概率再次成为爆款。
  - 目前不仅应用于起号，同时也应用于兼职团队，横向复制。
  - 通常来说，至少前两天前五篇都不要复制营销性质的爆款，营销笔记与干货很好区别
- 'no': 2
  name: 养号-标签化机制 —— 让算法主动给贴上垂直标签
  points:
  - '**为什么需要这个概念？**'
  - '- 新号无历史行为数据，算法无法判定垂直领域，首批推荐流量池为泛娱乐大池，精准度极低'
  - '- 被动等待算法打标周期长且不可控，主动模拟真人行为可在2-3天内强制绑定垂直标签'
  - '- 规避“营销号”判定：纯发布内容无互动的账号极易被判定为营销号导致限流'
  - '**核心定义**'
  - '- 账号注册完善资料后，不发内容，先搜索核心业务关键词，大量点赞/收藏/评论领域内近期热门笔记'
  - '- 通过高频垂直互动行为，诱导推荐算法给账号打上精准领域标签，使首页推荐流变为“领域素材库”'
  - '- 同步完成：规避营销号判定 + 获取垂直标签 + 积累选题素材库 三重收益'
  - '**关键性质**'
  - '- 标签先于内容：账号初始标签决定首批推荐流量池精准度，直接影响后续内容冷启动表现'
  - '- 个性化推荐机制：平台根据阅读偏好打标推荐，主动互动垂直内容可反向训练算法'
  - '- 素材库副产出：养号过程浏览的高互动笔记即为后续“复制爆款”的优质素材来源'
  - '**典型例子**'
  - '- 职称赛道新号：搜索“中级职称”、“评审材料”、“职称论文”等核心词，连续3天每天互动50+篇同领域爆款笔记，第4天发布首篇复制爆款笔记即获精准推荐'
  - '- 同行“老刘”素材库：养号期发现同行持续发布各地通知文件，直接录入蓝海词素材库'
  - '**边界条件**'
  - '- 必须在发布首篇内容前完成，发布后再养号效果大打折扣'
  - '- 互动对象必须是领域内近期（7天内）高互动笔记，过时/低质内容无法打出精准标签'
  - '- 单日互动量建议50-100次，过低打标不牢，过高触发风控限流'
  - '- 真机/真网络/真实名环境为前提，模拟器/云手机环境打标无效'
  sources:
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: origin
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: improve
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: apply
  excerpts:
  - 我们在正常互动的过程中，最好先去搜索所做领域的关键词，并与热门笔记进行互动，因为平台是个性化推荐，会根据我们的阅读偏好打上标签，进行首页内容的推荐。
  - 如果我们多与领域热门笔记互动，那么当我们打开小红书时，首页推荐就不仅仅是当天的平台热门，也会给你推荐关注领域的近期热门，而这些内容有很多的好处，比如有的可以直接拿来当素材...
  - 一方面要规避掉被判营销账号的可能，另一方面要争取被打上正常账号的标签...
- 'no': 3
  name: AI伪原创工作流 —— 将创作转化为标准化Prompt工程
  points:
  - '**为什么需要这个概念？**'
  - '- 纯搬运长期不可持续，平台加大原创保护力度，需实现“借壳生蛋”的伪原创量产'
  - '- 人工改写效率低、质量不稳、难批量，必须将改写流程标准化为可复用的AI指令集'
  - '- 小红书风格强（Emoji、口语化、情绪价值），通用大模型零样本生成质量差，需少样本微调'
  - '**核心定义**'
  - '- 双阶段Prompt工程：第一阶段“语义理解对齐”（指令：阅读分析/回复‘已准备好’），第二阶段“风格化重写”（指令：小红书风格/Emoji/生动有趣/不改原意）'
  - '- 可扩展指令集：阐明/精简/举例/续写，基于爆款骨架生成差异化原创正文'
  - '- 输入端：爆款笔记文案/OCR识别图片文字；输出端：符合平台调性的伪原创文案'
  - '**关键性质**'
  - '- 语义对齐优先：第一阶段强制模型理解原文深层逻辑，防止二次创作偏离核心价值'
  - '- 风格化控制：显式指定Emoji密度、口语化程度、情绪关键词，复刻小红书原生调性'
  - '- 结构化复用：同一套Prompt可批量处理同领域不同选题，实现内容生产工业化'
  - '- 标题分离原则：拒绝AI生成标题，改用“数据驱动标题套用法”提取高点击结构'
  - '**典型例子**'
  - '- 职称赛道：输入竞品“后悔没早看的评审避坑指南”爆款文案，输出保留核心避坑点、增加本地政策细节、植入“宝子们”、“血泪教训”等口语词的伪原创文案'
  - '- 扩展指令应用：对核心步骤用“举例”指令生成具体案例段，用“精简”指令生成封面文案'
  - '**边界条件**'
  - '- 依赖高质量爆款素材库，无优质输入无优质输出（GIGO原则）'
  - '- ChatGPT上下文窗口限制，超长文案需分段处理并保持上下文连贯'
  - '- 平台算法迭代可能识别AI特征，需定期更新Prompt加入“拟人化修饰词”（如语气词、错别字模拟）'
  - '- 法律/医疗/金融等强合规领域，AI生成内容需人工核验关键条款准确性'
  sources:
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: origin
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: improve
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: apply
  excerpts:
  - 参考文案：接下来我将向你提供一段文案，请先阅读并分析，完成后只需要回复“已准备好”，并等待我的下一步指令。
  - 参考文案：请将这段文案，用小红书的风格，在不改变原意的前提下进行改写，要求有emoji表情，语言最好生动有趣（设置语言风格有助于提高伪原创质量）
  - 我通常还会用chatGPT的阐明/精简/举例的指令打造出一些纯原创的文案，用于正文。
  - 我也试过用chatGPT取标题，但效果并不满意，最后还是选择相信数据（最靠谱），提取了两个合适的标题...稍微替换关键词用于文案标题。
- 'no': 4
  name: 表格封面合集化 —— 零设计门槛的高点击封面范式
  points:
  - '**为什么需要这个概念？**'
  - '- 图文笔记封面决定点击率（CTR），专业设计成本高、周期长、依赖人才'
  - '- 碎片化知识点缺乏结构化呈现方式，用户认知负荷高、收藏率低'
  - '- 需要一种零设计技能、可批量生产、信息密度高、自带收藏属性的封面标准'
  - '**核心定义**'
  - '- 利用Excel/腾讯文档/飞书文档将领域碎片知识点整理为结构化表格（列：核心词/解读/避坑/操作步骤等）'
  - '- 截图表格作为笔记封面（首图）及正文主体图片，配合简短文案发布'
  - '- 封面即内容、内容即封面，实现“所见即所得”的高信息密度呈现'
  - '**关键性质**'
  - '- 零设计门槛：会做表格即可做封面，无需PS/Canva等专业工具'
  - '- 高信息密度：单张图承载10-20个知识点，满足用户“一图全览”心理'
  - '- 强收藏属性：表格类内容天然适合收藏转发，收藏率显著高于纯图/纯文笔记'
  - '- 算法友好：图文笔记权重高于纯文字，表格图片清晰度高利于OCR识别入库'
  - '- 易于迭代：修改单元格内容即可生成新版封面，支持A/B测试不同排版'
  - '**典型例子**'
  - '- “广东各地中级职称评审材料清单”表格封面：列=城市/材料/社保要求/论文要求/截止时间，单条笔记收藏破万'
  - '- “考公岗位筛选表”封面：列=部门/岗位/招录数/专业限制/竞争比，配合蓝海词“选调生岗位表”获精准搜索流量'
  - '**边界条件**'
  - '- 仅适用于知识密集型、标准化程度高的垂直领域（考证、职称、技能教程、对比测评）'
  - '- 表格列数建议≤7列，行数≤15行，超出需分页或拆分多条笔记，否则手机端字体过小影响阅读'
  - '- 必须配合“数据驱动标题套用法”，标题植入核心长尾词（如“XX地区/年份/版本”）'
  - '- 纯表格内容易被判定为“低质/非原创”，正文需补充300+字原创解读/避坑指南'
  sources:
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: origin
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: apply
  excerpts:
  - 用腾讯文档表格（其他同类软件也行）制作成合集类笔记的封面（最容易出爆款的封面之一），大多数图片类笔记都可以切换成这种风格去展示
  - 图片篇的爆款笔记，其实不需要有详细的正文内容也可以，简单总结一下内容就行。
- 'no': 5
  name: 小红书SEO蓝海词策略 —— 用布局式占坑截获精准搜索流量
  points:
  - '**为什么需要这个概念？**'
  - '- 推荐流量脉冲式衰减、不可控，小众高客单赛道用户决策周期长、依赖主动搜索'
  - '- 核心大词竞争激烈、头部垄断，新号无权重无法竞争首屏曝光'
  - '- 长尾蓝海词“搜索需求大、优质内容少”，易排名靠前且用户意图极强（高转化）'
  - '**核心定义**'
  - '- 蓝海词定义：目标人群会去搜索，但同行发过相关优质笔记很少的关键词'
  - '- 布局式SEO：放弃追求点赞/阅读等公域指标，核心目标“占坑”关键词排名，被搜索到并引发私信即成功'
  - '- 三步执行：挖掘蓝海词 → 生产高权重内容（复制爆款/AI改写/表格封面） → 矩阵号覆盖长尾词库'
  - '**关键性质**'
  - '- 搜索意图强度＞推荐兴趣强度：搜索用户明确需求，转化率远高于推荐流量'
  - '- 复利效应：优质SEO笔记可持续半年以上带来精准流量，权重随时间累积'
  - '- 精准度溢价：零互动（0赞0藏）笔记仍可获大量精准私信，公域指标不代表商业价值'
  - '- 矩阵放大性：单账号覆盖有限词库，矩阵号可实现区域/细分领域全词库覆盖'
  - '**典型例子**'
  - '- “老刘”通知布局法：同行发各地职称通知文件（公域数据差），模仿布局全省城市词库，日均私信稳定咨询“分享通知”'
  - '- 工程师职称零互动获客：某账号发“0赞0藏”蓝海词笔记，获大量用户私信“分享笔记”，验证搜索流量精准度'
  - '- 蓝海词挖掘实操：核心词“职称评审”→长尾“广东/2024/中级/材料/社保/论文”→工具批量下载各词下爆款→识别有搜索无优质内容词→优先生产'
  - '**边界条件**'
  - '- 仅适用于用户有明确主动搜索习惯的赛道（考证、职称、技能、高客单服务），娱乐/泛资讯类无效'
  - '- 依赖平台搜索功能权重分配机制，算法调整（如加大推荐权重）可能降低SEO价值'
  - '- 内容质量仍有底线：纯垃圾内容无法长期维持排名，需满足“专业度+完整度+时效性”最低门槛'
  - '- 词库维护成本高：需持续监控关键词排名变化、竞品新增内容、平台政策调整'
  sources:
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: origin
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: improve
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: improve
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: apply
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: apply
  excerpts:
  - 目标人群会去搜索，但没什么同行发过相关笔记的关键词，我称之为「有潜力的蓝海词」。
  - 当这样的蓝海词被搜索时，即使某个同行发过的笔记数据不是很好，但因为相关笔记实在是太少了，而它的笔记因为精准度高，还是会排在前面，吃掉大部分的精准流量。
  - 有个同行叫“老刘”，经常发广东各地的职称申报通知文件...有了小红书SEO思路后，不管数据好不好，都学他这么布局各个城市，现在每天都有一定的私信数量，是求分享通知文件的。
  - 我们做的是小众领域，且主要目的就是引流，所以为了覆盖到更多的目标人群，启动了「小红书SEO」的玩法...
- 'no': 6
  name: 表情包话术+分享笔记 —— 非文本形式对抗风控的引流组合拳
  points:
  - '**为什么需要这个概念？**'
  - '- 小红书严打私域引流：文本微信号/联系方式/引流关键词直接拦截，发图识别OCR同样违规'
  - '- 账号违规导致限流/封号，主号权重受损得不偿失，必须物理隔离引流风险'
  - '- 需要一种合规、低成本、可批量、抗风控迭代的引流技术方案'
  - '**核心定义**'
  - '- 表情包话术：将敏感引流文案（微信号/口令/钩子）制作为图片表情包，私信发送绕过文本检测'
  - '- 分享笔记功能：小号发布引流诱饵笔记（含联系方式图片/群二维码）→ 大号收藏 → 私信时“分享笔记”卡片传递'
  - '- 小号隔离大号收割：小号专职制作引流内容承担违规风险，大号正常运营仅做分发动作'
  - '**关键性质**'
  - '- 形式对抗原则：平台风控核心针对文本语义/直接图片OCR，表情包/分享卡片/群聊系统消息属于非标准检测路径'
  - '- 风险隔离：小号违规不影响大号权重，小号成本低（几元/个）可批量注册替换'
  - '- 合规边界：表情包内容需用隐晦词汇（如“薇”“V”“➕”），直接露号仍会触发图片识别违规'
  - '- 转化路径完整：私信触达 → 分享笔记卡片 → 用户点击查看大图/长按识别 → 加微信/进群'
  - '**典型例子**'
  - '- 实测对比：直接发引流图片→违规提醒；同内容做表情包+隐晦词→持续运行零违规'
  - '- 话术模板：“资料整理好了，打个招呼发你” → 发送表情包“薇：xxx_888” → 分享笔记“《2024职称资料合集》”'
  - '- 小号矩阵：10个小号轮流发布引流笔记/私信表情包，大号矩阵收藏分发，单日引流200+精准粉'
  - '**边界条件**'
  - '- 表情包制作需统一规范：尺寸/水印/隐晦词/二维码清晰度，避免因模糊导致用户无法识别流失'
  - '- “分享笔记”功能依赖互关关系，需预先建立大小号互关或引导用户关注小号'
  - '- 平台可能升级表情包/分享卡片内容识别能力，需持续监控违规率并迭代话术形式（如改用手写体/涂鸦风格）'
  - '- 私信发送前置检测：当日前几条私信长按无“引用/回复”选项即隐形限流，需停发等待恢复'
  sources:
