  name: 参数调优实证 —— 用脚本矩阵量化边际收益，拒绝玄学调参
  points:
  - '**为什么需要这个概念？**'
  - '- 参数空间巨大：采样器(20+)×步数(10-100)×CFG(1-20)×分辨率×提示词权重，暴力网格搜索计算量爆炸'
  - '- 社区充斥玄学经验："DDIM最快"、"Euler a最柔"、"50步以上才稳"、"CFG 7是黄金值"，缺乏实证支撑'
  - '- 不同模型/任务最优参数不同，盲目套用他人参数往往适得其反'
  - '**核心定义**'
  - '- X/Y/Z 脚本矩阵对比法：自动化网格化生成对比图，将多维参数离散化采样，肉眼/指标快速定位帕累托前沿'
  - '- 核心对比维度：采样器×步数(X/Y轴)、提示词增删(Prompt Matrix)、CFG/分辨率/重绘幅度(Z轴)'
  - '- 评估指标：主观画质打分(1-5分)、结构完整性(手指/五官/透视)、风格一致性、生成耗时、显存占用'
  - '**关键性质**'
  - '- 步数边际递减：20-25 步质量大幅跃升，25-30 步微弱提升，30 步后趋于饱和，低配首选 20-25 步'
  - '- 采样器趋同性：25 步时 DDIM/DPM++ 2M Karras/Euler a/UniPC 输出质量高度相似，差异仅在收敛速度/纹理细节'
  - '- 高速采样器优势：DDIM/UniPC/DPM++ 2M Karras 10-15 步即可出可用图，适合 Colab/低显存/实时交互场景'
  - '- 分辨率基准：512×512/512×768 为训练分辨率原生支持，直出生成结构最稳；高分依赖 Hires Fix/超分后处理'
  - '- CFG 饱和：5-9 区间效果稳定，>12 易烧图/伪影，<4 失控/跑偏，推荐 7 为通用默认值'
  - '**典型例子**'
  - '- 采样器×步数矩阵：X轴[10,15,20,25,30,40,50] Y轴[Euler a, DPM++ 2M Karras, DDIM, UniPC]
    → 生成 28 张对比图 → 直观确认 25步趋同、DDIM 15步已可用'
  - '- 提示词矩阵：Prompt `masterpiece, best quality, 1girl | solo | white hair | blue eyes`
    → 生成 16 张组合图 → 量化单词贡献度(如 white hair 贡献度最高)'
  - '- 低配用户定参 SOP：DDIM 采样器 + 20 步 + CFG 7 + 512×512 + 高清修复 1.5× + R-ESRGAN 4x 超分 =
    6G VRAM 可跑高质量流程'
  - '**边界条件**'
  - '- 矩阵生成耗时：28 张对比图约需 10-30 分钟(视显卡/采样器)，调优本身有时间成本，仅在换模型/换任务/追求极致时执行'
  - '- 主观评价偏差：肉眼打分受观察者审美/疲劳度影响，建议引入 CLIP Score/Aesthetic Score 等客观指标辅助'
  - '- 模型敏感性差异：动漫模型对步数/采样器不敏感(10步可用)；写实模型对步数/CFG/VAE 高度敏感，需分模型建立参数画像'
  - '- 版本迭代失效：SD 版本/插件/依赖库更新可能改变采样器行为/参数范围，参数画像需定期(月度)校准'
  sources:
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: origin
  - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
    role: apply
  excerpts:
  - 这里用到的就是脚本里的“X/Y/Z图表”... 在X轴类型里面选择“迭代步数”... 在Y轴类型里面选择“采用器”... 点击“生成” 就会生成这么一张大图
  - 我们就可以看到在不同的采用方法下，迭代步数为25的时候，生成出来的照片都差不多，这样比较下来，我们就可以选择自己更喜欢的采样方法和迭代步数了
  - 那我们就要用到最下面“脚本”里的“提示词矩阵”... 书写的格式：把需要进行对比的关键词放在最后，用“|”把关键词和前面的关键词分隔开
  - 通过X/Y/Z脚本矩阵对比验证：25步后质量边际递减、不同采样器25步趋同、512x512/512x768为显存友好基准、高分辨率修复为低配替代方案。
  - 基本开了高清修复四张图需要50秒左右
  - 我的显卡是3080ti基本开了高清修复四张图需要50秒左右
- 'no': 10
  name: AI 绘图商业化落地三大主场景 —— 产品设计、AI 模特、建筑分镜的标准化交付范式
  points:
  - '**为什么需要这个概念？**'
  - '- 技术落地最后一公里：会生图 ≠ 会做项目，缺乏 "业务流程拆解 + 标准化交付规格 + 客户验收标准" 的商业化闭环'
  - '- 三大场景需求确定、付费意愿强、标准化程度高，是普通人切入 AI 变现的最优切口'
  - '- 通用技能(文生图/图生图/ControlNet/LoRA)需重组为场景化 SOP，才能形成可复制、可定价、可外包的产品化能力'
  - '**核心定义**'
  - '- 产品设计：Canny/Lineart 提取草图线条 → ControlNet 保边 → Prompt 注入材质/光影/环境 → 生成渲染图 → 局部重绘微调细节
    → 超分出交付图'
  - '- AI 模特：ChilloutMix 底模 + 真人 LoRA(身份固定) + ControlNet OpenPose(姿势控制) + Inpainting(换装/换背景)
    → 批量生成试穿图/详情图'
  - '- 建筑/分镜：M-LSD 提取几何结构 → ControlNet 保结构 → 切换风格大模型 + 风格 LoRA + Prompt(日式/现代/赛博朋克)
    → 风格化重设计出图'
  - '**关键性质**'
  - '- 交付规格标准化：分辨率(2K/4K)、格式(PNG/JPG/PSD分层)、命名规范、交付包结构(主图/细节图/源文件/参数表)'
  - '- 迭代周期量化：产品设计 单品 30min、AI 模特 单款 10min、建筑方案 单视角 15min，含筛选/微调/超分全流程'
  - '- 定价锚点：单图 50-500 元/张、套餐 2000-20000 元/项目、月包 1-5 万/月(含无限修图/专属模型/优先通道)'
  - '- 质检清单：结构正确性(透视/比例/解剖)、风格一致性(色调/材质/光影)、细节完整性(无畸变/无水印/无伪影)、规格合规性(分辨率/格式/色彩空间)'
  - '**典型例子**'
  - '- 电商 AI 模特案例：服装商家提供平铺图/模特实拍图 → 训练/选用模特 LoRA → ControlNet OpenPose 批量套用爆款姿势 →
    Inpainting 无缝换装 → 日产 100 张主图/详情图 → 替代实拍节省 90% 成本'
  - '- 产品设计案例：工业设计师手绘草图 → Canny 提取线稿 → ControlNet + Prompt(材质/光影) → 10 分钟出 3 张渲染方案
    → 客户选定 → 局部重绘微调 → 4K 交付'
  - '- 建筑分镜案例：导演提供分镜草图/参考图 → M-LSD 锁结构 → 换风格模型(赛博朋克/赛博蒸汽) → 批量生成分镜概念图 → 剪映关键帧动态化 →
    导出演前可视化'
  - '**边界条件**'
  - '- 非标定制化程度高的项目(如概念艺术/插画/艺术创作)难以完全标准化，需保留 "人工介入微调" 缓冲环节'
  - '- 客户对 "AI 生成" 心理门槛仍存，交付时需强调 "AI 辅助设计" 而非 "AI 替代设计"，提供源文件/参数表建立专业信任'
  - '- 版权风险：生成内容若含可识别 IP 角色/品牌 Logo/画师风格，商用需授权，建议训练/使用自有/CC0/合法授权模型素材'
  - '- 硬件/算力成本隐性计入：本地部署折旧/电费、云端租赁费、人工筛选微调时薪，必须计入单图成本核算，避免 "赚了吆喝赔了里子"'
