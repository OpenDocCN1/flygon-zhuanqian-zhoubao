units:
- 'no': 1
  name: 胎教级入门范式 —— 让奶奶都能跑通 AI 绘图
  points:
  - '**为什么需要这个概念？**'
  - '- Stable Diffusion 原生部署涉及 Python 环境、Git、模型下载、依赖安装等极高技术门槛，劝退 90% 非技术小白'
  - '- 网络教程多以原理讲解为主（扩散模型、U-Net、CLIP），导致学习者 "还没画出第一张图就已放弃"'
  - '- 生态资源（大模型、LoRA、提示词、VAE）分散在 HuggingFace、Civitai、网盘，新手面临 "找不到、下不动、版本不对" 的三重打击'
  - '**核心定义**'
  - '- 一种 "预打包分发 + 案例驱动教学 + 资源一站式托底" 的降维教学体系'
  - '- 核心交付物：秋叶整合包（含运行时+依赖+WebUI）、预选大模型/LoRA/VAE、结构化提示词模板、实战案例库'
  - '- 核心流程：硬件自检 → 一键部署 → 界面认知 → 案例复现 → 资源复用，全程无需写代码、懂原理'
  - '**关键性质**'
  - '- 零配置启动：解压非 C 盘 → 运行启动器 → 显存对齐 → 一键启动 → 报错自动修复，消费级 N 卡电脑零报错率'
  - '- 认知负荷极低：跳过数学原理，把 "参数调节" 封装为 "填空题"（提示词五段式公式、万能负面词、采样器固定 25 步）'
  - '- 即学即用：每个知识点配套 "输入即得图" 的最小闭环案例（如 ControlNet 姿势迁移、Canny 线稿上色、局部重绘换装）'
  - '**典型例子**'
  - '- 秋叶整合包：B 站 100w+ 播放，成为中文社区 SD 入门事实标准，单机部署成功率接近 100%'
  - '- 吴东子万字长文：语雀 578 赞，评论区 "大写的牛逼"、"真滴牛"，验证 "胎教级" 教学模式有效性'
  - '- 云端兜底：本地显存不足/非 N 卡/Mac 用户，提供青椒云/Colab 等 GPU 云平台 "注册-开机-跑图-关机止损" 标准化 SOP'
  - '**边界条件**'
  - '- 硬件门槛：Win10/11、NVIDIA 显卡、≥8G 内存、≥4G VRAM（不满足需走云端方案）'
  - '- 网络依赖：首次启动需下载依赖包（约 2-4GB），断网环境不可用'
  - '- 版本锁定：整合包锁定特定 SD 版本、插件版本、Python 版本，后续手动更新极易冲突，建议 "以包代版、整体迭代"'
  - '- 显存碎片化：极端宽高比（如 9:16 竖屏）极易 OOM 或黑图，需配合高清修复/超分后处理规避'
  sources:
  - paper: docs/202305/20230516_021.md
    role: origin
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: improve
  excerpts:
  - 《耗时 80 小时！超详细的胎教级 Stable Diffusion 使用教程，看这一篇就够！》
  - 从手把手安装部署，到界面功能讲解，再到实战案例制作...让你不止是枯燥地学，而是学完立刻也能做出一样的图片出来！
  - 同时，无论是安装包，大模型，lora，关键词的文件都给大家打包好了，不用再自己这找找那找找
  - 很多人想学习stable diffusion，上网一搜，大多数教程都先告诉你SD的原理是什么... 但偏偏就是这一步就劝退了很多人继续学习
  - 这里我们用到的是B站秋叶分享的整合包，小白直接下载整合包可以避免很多困难
  - 选择解压到D盘或者E盘，小心C盘被占满！！
  - 在显存优化里，根据自己电脑的显存选择... 回到第一个一键启动，点击右下角的一键启动
  - 总结一下我们写关键词的公式：画质+主体+主体细节+人物服装+其他（背景、天气、构图等）
  - 新手小白可以直接抄！（文章最后有关键词链接，里面可以直接复制）
  - 万能负面词：(worst quality:2), (low quality:2), bad anatomy, bad hands, extra fingers,
    watermark...
  - ControlNet 统一入口：启用 → 上传参考图 → 预览预处理 → 切换预处理器/模型
  - 'OpenPose: 骨骼关键点精确复现姿态；Canny: 反转输出颜色严格遵循线稿轮廓；M-LSD: 几何线条保持室内结构'
  - 'VAE 通用推荐: vae-ft-mse-840000，修正灰蒙蒙色彩'
  - 后期超分分类：动漫用 R-ESRGAN 4x+ Anime6B，真人用 R-ESRGAN 4x+ 或 GFPGAN(人脸专用)
  - PNG Info 反推仅限 SD 原生图；Tagger 适用任意图片标签预测
- 'no': 2
  name: 云端免费算力白嫖 —— 零成本跑通 AI 绘图生产线
  points:
  - '**为什么需要这个概念？**'
  - '- 本地部署要求 N 卡 + 8G+ VRAM，硬件成本 3000+ 元，挡住大量学生、兼职者、轻量尝试者'
  - '- 即使有硬件，驱动、CUDA、Python 环境折腾耗时，"还没出图先修电脑"'
  - '- 单机算力有限，批量出图（抽卡机制需 30:1 筛选）极其缓慢，无法支撑商业化量产需求'
  - '**核心定义**'
  - '- 利用 Google Colab 免费 T4/K80 GPU、青椒云/腾讯云/RunPod 等低价云 GPU，远程运行 Stable Diffusion
    WebUI'
  - '- 核心技术栈：预配置 Notebook (camenduru/秋叶Colab版) + Civitai 模型在线下载 + Generate Forever
    自动化 + 多账号/多浏览器并行 + 代码块打包下载'
  - '- 实现 "零硬件成本、零环境配置、可编程、可批量、可无限扩展" 的 AI 绘图生产线'
  - '**关键性质**'
  - '- 单实例基准：Colab T4 约 30-60 秒/张，免费版日配额 3-6 小时，单账号日产 ~200-500 张'
  - '- 线性扩容：多浏览器（Chrome/Edge/Firefox）+ 多 Google 账号并行，1 机 5 开可达 900 张/小时'
  - '- 账号隔离：Colab 官方禁运行 SD 易封号，核心策略 "买小号跑、主号管、挂了换"，单号成本极低'
  - '- 模型获取零带宽：WebUI 内置 Civitai 选项卡，服务器直连下载 Checkpoint/LoRA，避免本地上传大文件'
  - '- 产出持久化：/content/outputs/ 按日期存储，会话存活期可预览，停止服务后打包下载'
  - '**典型例子**'
  - '- camenduru Notebook：GitHub 5k+ Star，Colab 一键部署 SD WebUI 事实标准，内置 Civitai 下载器'
  - '- 秋叶 Colab 版：国内镜像源加速，配合整合包逻辑，新手友好度更高'
  - '- 实战量产：健身产品推广素材批量生成、表情包/壁纸/电商图矩阵化出图'
  - '**边界条件**'
  - '- Colab 免费版不稳定：随机断连、人机验证、配额耗尽、版本迭代导致 Notebook 失效'
  - '- 显存上限：免费版 T4 16G VRAM，不支持超大分辨率/批量并发生成，大模型加载多 LoRA 易 OOM'
  - '- 合规风险：Google 明令禁止挖矿/训练/长时间高负载，SD 属灰色地带，主力账号严禁直接跑'
  - '- 网络延迟：WebUI 交互延迟 200-500ms，调参体验不如本地流畅'
  - '- 文件传输：单张图 1-2MB，百张打包下载需压缩，Colab 文件浏览器不支持批量下载，必须跑代码打包'
  sources:
  - paper: docs/202305/20230516_076.md
    role: origin
  - paper: docs/202305/Md2KdAjbDo0cdGxGMtncyb8CnLb.md
    role: improve
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: apply
  excerpts:
  - 本文介绍的方法，可以利用 Colab 和 Stable Diffusion 实现云端、免费、自动、批量、无限 AI 出图。
  - Stable Diffusion 在本地部署的门槛相对较高。首先需要强大的硬件...本文介绍的方法，可以利用 Colab...实现云端、免费...
  - 现在谷歌 colab 禁用 Stable diffusion 相关代码了，继续使用，可能会封禁 colab 功能，需要注意一下的～
  - 避免用自己账号，买号价格很低的，关键是渠道要靠谱
  - 1 个浏览器 1 分钟出 3 张图... 1 台电脑开 5 个浏览器同时跑，1 小时可以出 900 张图，够够的~
  - 登录google账户，通过以下链接，打开笔记，点击运行代码块...等待完成资源下载和安装，直到出现几个Public WebUI Colab URL
  - 点击Civitai选项卡... Content Type选择Checkpoint/Lora... 点击Get List...点击Download Model
  - 回到Colab界面，看到下载进度，等待出现Successful Downloaded
  - 在Generate按钮右键，选择Generate Forever，让程序自动出图
  - 图片存放路径在/content/stable-diffusion-webui/outputs/txt2img-images/出图日期
  - 点击停止运行Stable Duffusion WebUI代码块... 运行打包代码... 自动下载
  - 电脑安装多款浏览器，如Chrome、Edge、Firefox等... 每个浏览器登录不同的google账号，同时操作，批量出图
  - 也可使用指纹浏览器批量出图... 准备大量google账号... 等某个账户的gpu算力消耗完，则换号继续
  - AI绘图结果通常不能直接使用，大概30张中选1张能用的，因此需要大量出图，人工筛选。
  - 由于colab分配给每个账户的算力有限，无法不断出图。每个免费账户每天大概有3-6小时的gpu算力
- 'no': 3
  name: 核心三要素强绑定 —— 大模型定基因，LoRA 改特征，提示词控细节
  points:
  - '**为什么需要这个概念？**'
  - '- 新手常犯错误：真人大模型加二次元 LoRA、动漫模型写真人提示词，导致画面崩坏、风格撕裂、五官扭曲'
  - '- 参数空间极大（采样器×步数×CFG×分辨率×提示词×模型×LoRA），无结构化认知会陷入无尽调参地狱'
  - '- 缺乏 "复现" 能力：看到别人好图，不知其然，更不知所以然，无法稳定输出可控质量'
  - '**核心定义**'
  - '- 大模型：决定基因画风（真人/二次元/3D/盲盒），是起笔前必须锁定的核心资产，推荐 ChilloutMix(亚洲真人)、KoreanDollLike(二次元)、Realistic
    Vision(写实)'
  - '- LoRA：轻量微调模型（<200MB），固定特定特征（人物长相/动作/风格），需与大模型画风域强绑定（真人配真人，二次元配二次元），权重建议 ≤1.0'
  - '- 提示词：结构化控制生成细节，遵循 "质量词+主体+细节+服饰+环境" 五段式模板，配合权重语法 (词:数值) 微调，负面词使用万能模板抑制高频缺陷'
  - '**关键性质**'
  - '- 决定论层级：大模型 > LoRA > 提示词 > 采样器/步数/CFG/分辨率，上层定性，下层定量'
  - '- 复现三要素：同大模型 + 同LoRA组合权重 + 同Seed = 同构图，缺一不可（PNG Info/Tagger 辅助获取前两者）'
  - '- 参数边际收益：采样器 25 步后趋同，DDIM/DPM++ 2M Karras/Euler a 差异微乎其微；512×512/512×768 为显存友好基准'
  - '**典型例子**'
  - '- 真人小姐姐流程：ChilloutMix 大模型 + 真人 LoRA(如韩系/网红风) + 五段式提示词(8k/raw photo/skin texture)
    + 负面词(Deformed/ugly) + DPM++ 2M Karras 25步 512×768'
  - '- 二次元角色流程：KoreanDollLike 大模型 + 角色 LoRA(触发词:1girl) + 质量词(masterpiece/best quality)
    + 标签式提示词(white hair/blue eyes) + 负面词(lowres/bad anatomy)'
  - '- ControlNet 组合范式：产品设计=Canny+Prompt，AI模特=ChilloutMix+ControlNet(OpenPose)+Inpainting，建筑=Canny+建筑LoRA'
  - '**边界条件**'
  - '- 跨域禁忌：真人大模型绝不可加载二次元 LoRA，反之亦然，会导致潜空间分布错位，画面 "既不像人也不像画"'
  - '- LoRA 叠加上限：建议 ≤3 个，权重之和 ≤1.5，过多叠加导致特征冲突、训练目标稀释'
  - '- 提示词序列敏感：前置词权重隐性更高，核心特征词（主体、画风）必须前置，次要修饰词后置'
  - '- Seed 非万能：仅控制初始噪声模式（构图/大致轮廓），不控制细节（手指/纹理/光影），细节由提示词/模型/采样器决定'
  sources:
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: origin
  - paper: docs/202305/ZXvbdq7RGoKEeLxryxAckCtSnPf.md
    role: improve
  - paper: docs/202305/20230516_074.md
    role: apply
  excerpts:
  - 用stable diffusion可以把自己想象成一个画家，在起笔画画之前，我们要先确定我们画的是什么风格的画... 不同的模型就代表着不同的照片风格。
  - 假如现在我想生成一个真人AI小姐姐，那就选用chilloutmix的大模型
  - 你想生成真人模特，你在最开始用了真人的大模型，对应的我们的Lora也要选用真人模特，这样出来的照片效果才更好！
  - 简单来说，Lora可以固定我们照片的特征：人物特征、动作特征、还有照片风格
  - 我们的Lora是可以叠加使用的... 每个Lora后面都有数字，这是用来调整这个Lora的权重的，正常情况下是1，我们一般只会去降低权重
  - 总结一下我们写关键词的公式：画质+主体+主体细节+人物服装+其他（背景、天气、构图等）
  - 可以加权重... 1.直接用括号把关键词括起来... 2.（关键词:数值）
  - 新手小白可以直接抄！（文章最后有关键词链接，里面可以直接复制）万能负面词...
  - 只有当我们所有参数，包括随机数种子跟别人的照片都一样时，我们才能生成跟别人差不多一样的照片。
  - 要注意的就是，大模型是需要我们手动去换的！
  - 在X轴类型里面选择“迭代步数”... 在Y轴类型里面选择“采用器”... 点击“生成” 就会生成这么一张大图
  - 我们就可以看到在不同的采用方法下，迭代步数为25的时候，生成出来的照片都差不多
  - 辅助产品设计... 通过controlnet的canny模型+prompt生成
  - AI模特：石膏模特+实拍产品... 结合chilloutmix+controlnet+图生图inpaiting
  - AI建筑设计... 通过controlnet的canny模型+建筑lora模型
- 'no': 4
  name: ControlNet 多模态控制 —— 让 AI 听懂 "姿势、线稿、结构"
  points:
  - '**为什么需要这个概念？**'
  - '- 纯文生图不可控：同一提示词每次生成构图/姿势/构图全随机，无法满足 "指定动作、上色线稿、保持建筑结构" 等工业级需求'
  - '- 传统图生图/重绘幅度只能控制 "变多少"，不能控制 "变成什么样"，精细编辑能力极弱'
  - '- LoRA 只能固定风格/身份，无法控制空间几何结构（姿势、边缘、线条）'
  - '**核心定义**'
  - '- ControlNet：结构控制神经网络，通过预处理器提取参考图结构信息，注入 SD 生成过程，实现像素级可控'
  - '- 统一入口：启用 → 上传参考图 → 预览预处理结果 → 切换预处理器/模型三元组'
  - '- 三大核心模态：OpenPose(骨骼/姿势)、Canny(边缘/线稿)、M-LSD(直线/建筑结构)，覆盖 90% 可控生成场景'
  - '**关键性质**'
  - '- OpenPose：提取 18/25 关键点骨架，精确迁移姿势，配合大模型+LoRA 保持人脸身份，实现 "人脸不变、动作指定"'
  - '- Canny：边缘检测保边界，开启 "反转输出颜色"(白底黑线→黑底白线)，严格遵循线稿轮廓着色，细节丰富无越界'
  - '- M-LSD：提取几何直线(墙面/门窗/梁柱)，切换写实大模型+风格关键词，保持结构不变下实现风格化重设计(日式/现代/工业风)'
  - '- 可叠加：ControlNet 单元可多开（如 Unit0 OpenPose + Unit1 Canny），结构约束叠加'
  - '**典型例子**'
  - '- 姿势迁移：上传瑜伽动作参考图 → OpenPose → 生成同身份模特摆出同一动作，用于服装展示/动作教学'
  - '- 线稿上色：上传漫画线稿 → Canny+反转颜色 → 输入质量词+角色描述 → 一键上色，保线条、不渗色、层次丰富'
  - '- 室内重设计：上传毛坯房实拍 → M-LSD → 切换真实大模型+Prompt(日式/北欧/现代简约) → 保墙面门窗不动、换家具材质色调'
  - '**边界条件**'
  - '- 预处理器-模型强绑定：OpenPose 必配 openpose 模型，Canny 必配 canny 模型，混用无效或报错'
  - '- 分辨率敏感：ControlNet 训练基于 512×512，输入参考图过大需缩放，生成分辨率超 1024 易结构漂移'
  - '- 约束强度 Control Weight：默认 1.0，过高(>1.2)画面僵硬、伪影多；过低(<0.6)约束失效，需按任务微调'
  - '- 非万能：无法控制光影/材质/纹理/色彩等非几何属性，需配合提示词/LoRA/VAE 综合调节'
  sources:
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: origin
  - paper: docs/202305/ZXvbdq7RGoKEeLxryxAckCtSnPf.md
    role: improve
  - paper: docs/202305/20230516_074.md
    role: apply
  excerpts:
  - 简单来说就是可以用它控制照片的线条，比如人物的动作、建筑物的线条等
  - 在“预处理器”和“模型”里选择“openpose”，这就是用来让计算机识别人物姿势的
  - 点击这个“预览预处理结果”... 最后点击生成照片... 这样我们一张指定姿势的美女小姐姐就生成啦！
  - 点击“反转输出颜色”，4.在模型里面选择“canny”的模型... 关键词：最高质量，大师杰作等...
  - 就这样不管再复杂的线稿，在SD里面都可以很快速的上好颜色
  - 预处理器和模型都选“msld”，这是用来计算房屋线条的... 切换一个现实照片的大模型... 关键词：一个客厅
  - 这样出来的照片既保留了原来房子的构造，又可以看到新的房屋风格！
  - 结构控制用ControlNet，风格/身份固定用LoRA。产品设计用Canny+Prompt，AI模特用ChilloutMix+ControlNet+Inpainting，建筑设计用Canny+建筑LoRA
- 'no': 5
  name: 精细编辑技能包 —— 局部重绘换装、涂鸦重绘定色、高清修复救大图、超分后处理救细节
  points:
  - '**为什么需要这个概念？**'
  - '- 生成图常有局部崩坏：手指畸形、衣服穿帮、脸部塌陷、背景杂乱，整体重绘会破坏已完美的主体'
  - '- 低分辨率直出细节糊，高分辨率直出显存炸/结构崩，需要分阶段 "先生成结构、再补细节" 的工作流'
  - '- 最终交付素材需满足商业级画质（4K+、锐利、无伪影），原生输出达标率极低，必须后处理'
  - '**核心定义**'
  - '- 局部重绘：蒙版涂抹指定区域，仅对该区域按提示词重新生成，保持其余像素绝对不变，实现换装/换脸/修手指'
  - '- 涂鸦重绘：进阶局部重绘，蒙版区域手绘颜色草稿(指定袖子蓝/衣服粉/花纹黄)，结合提示词引导，实现像素级颜色可控'
  - '- 高清修复：生成两步走——先低分(512)出结构，再放大×2+重绘幅度 0.3-0.5 补细节，解决大分辨率崩坏/OOM'
  - '- 后期超分：生成后离线增强，动漫用 R-ESRGAN 4x+ Anime6B(线条锐化/色块平滑)，真人用 R-ESRGAN 4x+ 或 GFPGAN(人脸专用强度=1)'
  - '**关键性质**'
  - '- 重绘幅度守恒：幅度<0.5 微调纹理；0.6-0.8 风格迁移保结构(二次元换装黄金区)；>0.9 近似文生图'
  - '- 局部重绘蒙版边缘羽化 4-8px 避免硬边，蒙版覆盖略大于目标区域防漏生成'
  - '- 涂鸦重绘需配合高权重提示词(如 blue sleeves:1.3)强制颜色收敛，否则草稿颜色仅作参考易偏移'
  - '- GFPGAN 仅修复人脸，非人脸区域(发丝/衣物/背景)模糊度不改善，证实其为人脸域专用增强器'
  - '- R-ESRGAN 4x+ Anime6B 对二次元线条锐化/噪点去除显著优于通用模型，为动漫修复首选'
  - '**典型例子**'
  - '- 换装工作流：文生图出基础人台 → 局部重绘蒙版衣服区 → Prompt(white dress/floral pattern) → 重绘幅度 0.7
    → 得新装同人台'
  - '- 修手指工作流：放大局部 → 涂鸦重绘画 5 根手指草稿 → Prompt(perfect hands:1.4) → 重绘幅度 0.9 → 无缝融合'
  - '- 大图工作流：512×768 文生图 → 高清修复 2× → 1024×1536 细节重绘 → R-ESRGAN 4x → 4K 交付图'
  - '- 表情包修复：压缩伪影表情包 → GFPGAN 强度=1(不放大) → 面部清晰度恢复、伪影消除、表情神韵保留'
  - '**边界条件**'
  - '- 局部重绘无法改变大构图(姿势/视角/透视)，需配合 ControlNet/OpenPose 从源头控制'
  - '- 高清修复显存占用约 2-3× 基础生成，6G VRAM 以下慎开，建议改用 "先生成小图→超分放大" 替代'
  - '- 涂鸦重绘对草稿质量敏感，线条粗糙/颜色块过大易导致生成伪影，需基础美术功底或参考图辅助'
  - '- 超分模型不可互换：动漫模型跑真人会油画感/失真，真人模型跑动漫会线条模糊/色块溢出'
  sources:
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: origin
  excerpts:
  - 局部重绘蒙版涂抹指定区域仅对该区域重新生成保持其余不变实现换装换脸
  - 涂鸦重绘进阶允许手绘颜色草稿指定袖子蓝色衣服粉色花纹黄色结合提示词引导生成实现像素级颜色可控
  - 高分辨率修复两步生成先低分辨率出图再放大细节重绘解决大分辨率直出易崩坏显存不足需权衡显存开销
  - VAE修正模型自带色彩偏灰饱和度不足推荐通用vae-ft-mse-840000
  - 动漫图用R-ESRGAN 4x+ Anime6B实物真人图用R-ESRGAN 4x+或GFPGAN人脸专用
  - 实测GFPGAN强度=1可在不放大分辨率前提下显著恢复面部清晰度修复压缩伪影但非人脸区域模糊度不改善证实其为人脸域专用增强器
  - R-ESRGAN 4x+ Anime6B对二次元线条锐化色块平滑噪点去除优于通用模型为动漫图修复首选
  - 重绘幅度的意思就是你要改变你原来照片的程度... 当你的重绘幅度拉到1，这时候就相当于要完全改变你的照片
  - 这里如果大家是要生成二次元照片的，把重绘幅度拉到0.6~0.8就差不多了
  - 高分辨率修复：电脑配置好就可以用；电脑配置稍微差点的别开，否则照片无法生成
- 'no': 6
  name: LoRA 训练工业级 SOP —— 从数据洗净到配方复现的标准化流水线
  points:
  - '**为什么需要这个概念？**'
  - '- 训练 LoRA 被称为 "炼丹"，参数极多（分辨率/重复数/Dim/Alpha/LR/Batch/Epoch/Clip Skip/Bucket/精度），新手极易
    "炼废"'
  - '- 训练集质量决定成败，但缺乏标准化流程：图片从哪来？怎么裁？怎么打标？标签多少合适？触发词怎么设？'
  - '- 训练结果评估主观："看着像" 非科学标准，无法跨实验对比、无法复现他人成果、无法沉淀经验资产'
  - '**核心定义**'
  - '- 五步标准化工作流：训练集准备(筛选→裁剪→打标→减标) → 模型训练(参数配置) → 测试复盘(XYZ Grid+评估表) → 参数反推(Metadata)
    → 业务落地'
  - '- 核心创新：减标签将权重迁移至触发词(一词出图)、自动聚焦裁剪防主体丢失、WD14+Dataset Tag Editor 工具链'
  - '- 训练集双维标准：原图像素质量(高分/多角度/无瑕疵) + 标签精准度(结构化Danbooru标签/含触发词/删描述性标签)'
  - '**关键性质**'
  - '- 触发词机制：人为添加唯一标识符(如 shengcai)，配合减标签，删除描述性标签(发色/服装)后权重自动聚合至触发词，推理时仅需一词调用'
  - '- 训练分辨率=推理分辨率：512 训练推理 1024 必崩(多头/结构脑补)，必须匹配业务常用分辨率'
  - '- 数据集多样性>数量：角度/光照/场景覆盖度决定泛化能力，单一角度(仅半身)训练全身必崩'
  - '- 关键超参参考：Dim=Alpha=128, LR=1e-4(UNet)/5e-5(TE), Batch=2, Epoch=1-3, Steps~5000,
    Mixed Precision=bf16, Clip Skip=2'
  - '- 复盘量化：XYZ Grid(X=Epoch/Y=Weight)网格出图，肉眼打分记录收敛度/过拟合/灵活度，选取最优 Checkpoint'
  - '**典型例子**'
  - '- KoreanDollLike v1.0 复现：URPM底模、713×891分辨率、110图×100重复=11000步/Epoch、Dim128、LR1e-4、bf16、ClipSkip2、无Bucket/Flip/Aug'
  - '- 人物 LoRA 训练：收集 50-100 张高清多角度图 → 自动聚焦裁剪 512 → WD14 打标 → 添加触发词 → 批量减标(删 1girl/brown
    hair 等) → 仅保触发词 → 训练 → XYZ Grid 选权重 0.7-0.8'
  - '- 风格 LoRA 训练：收集 30-50 张风格统一图 → 裁剪打标 → 添加风格触发词 → 保留风格描述标签(不全删) → 训练 → 测试灵活度'
  - '**边界条件**'
  - '- 显存限制：训练 512 分辨率 Dim128 批次2 需 ≥8G VRAM；显存不足需降 Dim/分辨率/批次或用梯度累积'
  - '- 过拟合风险：Steps 过大/数据量过小/重复数过高 → 生成僵硬、创造力丧失，需监控 XYZ Grid 权重高处崩坏点'
  - '- 版权合规：训练数据若含受版权保护图像(画师风格/影视角色)，商用面临法律风险，建议自拍/合法授权/CC0 素材'
  - '- 底模兼容性：LoRA 绑定特定底模架构(SD1.5/SDXL/PD)，跨架构不可用，迁移需重训或转换工具'
  sources:
  - paper: docs/202305/ZXvbdq7RGoKEeLxryxAckCtSnPf.md
    role: origin
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: apply
  excerpts:
  - 训练集的质量直接影响到后面的模型训练，训练集的质量在我看来包含两部分，一个原图的质量，另一个是对图片的精准总结（即打标签tag）
  - 如果要训练lora模型，需要添加一个未来用于触发该lora模型的触发词，我这里在附加标签里添加了shegncai
  - 减少标签并不会导致模型在学习的时候不学习小姐姐的个人特征，而是会把这些删除的特征的权重全部加到前面的词汇里
  - 例如删除 short hair, brown hair... 这些tag后，这些tag的训练权重会自动加到shengcai这个排在标签序列前面的这个词里
  - 自动焦点裁切：这个意思是当图片比较大的时候，人物如果不在图片中心，开启这个时候会自动以人物为中心进行裁剪，不会把人物裁掉
  - 推荐打标工具：Waifu Diffusion 1.4 标签器stable-diffusion-webui-wd14-tagger... 感觉这个工具在生成文字说明标签时更精准，不会出现乱码的标签
  - 推荐减标工具：数据集标签编辑器stable-diffusion-webui-dataset-tag-editor... 选择batch edit captions-移除-frequency-descending...
    点击remove selected tags
  - a）生成xyz表：把本次训练的不同epoch模型放在x轴上，y轴设置不同的权重参数，用文生图把模型跑出来图片看看
  - 如果你在c站或者其他地方看到一个很喜欢的lora模型，你想知道怎么训练的... 打开lora模型，找到你喜欢的lora模型，点show metadata
  - '以KoreanDollLike v1.0版本为例，它的元数据如下... ss_sd_model_name: URPMChill.ckpt, ss_resolution:
    (713, 891), ss_network_dim: 128, ss_learning_rate: 0.0001...'
  - 和你使用文生图的的业务场景相关，例如你用512*512的图片训练了模型，但是使用的时候生成大于512的照片... 实测用515*512训练的模型生成1024宽度图片时，输入1girl可能会出现生成多个人
  - 图片角度丰富，训练人物lora模型，你提供一个人的正面、侧面、脸部特写、全身等多角度训练出的模型，在生成时效果更好
  - tips：当图片不够时，可以尝试复制该图片使用镜像翻转提供更多的图片，同理也可以复制同一张图片进行裁剪，不过不建议放太多这种图片，容易训练过拟合
- 'no': 7
  name: 模型全生命周期管理 —— 从获取、存放、鉴别到一键复现的资产库闭环
  points:
  - '**为什么需要这个概念？**'
  - '- 模型文件巨大(2-6GB/个)，下载慢、占空间、易丢失、版本混乱，无管理导致 "找不到模型、不知何用、重复下载"'
  - '- C 站模型海量(数万+)，良莠不齐，新手无筛选标准，下载回一堆 "垃圾模型" 浪费带宽与存储'
  - '- 看到好图想复现，却不知用的什么模型/LoRA/参数，PNG Info 失效(非原生图)、Tagger 不准，复现链路断裂'
  - '**核心定义**'
  - '- 标准化目录结构：models/Stable-diffusion(大模型)、models/Lora(LoRA)、models/VAE(VAE)、models/ControlNet(控制网)、embeddings(Embedding)'
  - '- 获取筛选：C 站按类型/排序/标签/NSFW 筛选 → 图片反推下载(点赞高/评论多/含生成参数) → 仅下载含触发词/预览图优质模型'
  - '- 鉴别工具：秋叶模型解析工具(拖拽 .safetensors/.ckpt 自动识别类型/元数据/预览图/触发词)，避免 "下载回来不知是啥"'
  - '- 复现链路：PNG Info(原生图元数据) → 分配参数 → 手动切大模型 → 生成；Tagger(任意图反推) → 获取标签 → 组合提示词 → 试错复现'
  - '**关键性质**'
  - '- 文件即资产：模型按用途分类存放(真人/二次元/风格/角色/通用)，命名规范 `类型_用途_触发词_版本.safetensors`'
  - '- 元数据即说明书：.safetensors 自含 ss_tag_frequency/ss_sd_model_hash/训练超参，秋叶工具一键读出，无需外部文档'
  - '- 复现成功率依赖模型本地化：C 站复现前提是本地已下载完全一致的 Checkpoint 与 LoRA，缺模型则复现失败'
  - '- 版本迭代管理：同一模型多版本(v1/v2/v3)共存，通过 XYZ Grid 横向对比选定主力版，旧版归档不删'
  - '**典型例子**'
  - '- C 站筛选实操：搜索 `chilloutmix` → 类型 Checkpoint → 排序 Most Reactions → 下载 v1/v2 对比
    → 选定主力 → 存放 models/Stable-diffusion/'
  - '- LoRA 批量获取：搜索 `korean doll likeness` → 类型 LoRA → 下载 v1.0/v2.0 → 存放 models/Lora/
    → 秋叶工具拖拽验证触发词 `kdl`'
  - '- 好图复现：见推特高赞 SD 图 → 右键保存 PNG → SD PNG Info 拖入 → 点击分配按钮 → 手动切换大模型 → 生成 "几乎一样"
    的结果'
  - '- 无元数据图复现：见 Pinterest 灵感图 → Tagger 反推标签 → 结合经验组装提示词 → 选匹配大模型/LoRA → 多次试错逼近'
  - '**边界条件**'
  - '- PNG Info 仅限 SD WebUI 原生导出且未压缩/转码的 PNG 图片，截图/微信传图/网页压缩均丢失元数据'
  - '- Tagger 反推标签准确率 ~80%，无法还原权重/Seed/采样器/CFG/ControlNet 等隐性参数，复现需大量试错'
  - '- 模型文件跨设备迁移需同步目录结构，相对路径引用(如 LoRA 加载路径)易断裂，建议便携版整盘拷贝'
  - '- 存储成本：主流大模型 2-6GB，LoRA 50-200MB，百模型库需 500GB+ 存储，建议 HDD 冷存 + SSD 热存分级'
  sources:
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: origin
  - paper: docs/202305/ZXvbdq7RGoKEeLxryxAckCtSnPf.md
    role: improve
  excerpts:
  - C站筛选下载→按类型存放目录→秋叶解析工具拖拽识别类型→PNG Info/Tagger反推参数→一键复现他人成果，构建资产库管理闭环。
  - 点击右上角的筛选按钮，在框框里面找到自己需要的模型类型 Checkpoint=大模型 LoRA=Lora... 点击右边的“Download”
  - 1.大模型... 2.Lora... 3.VAE... 这里的SD根目录就是大家在下载时，存放SD的那个文件夹
  - 把模型拖动到空白处... 接着就会自动弹出模型的信息，在模型种类里面就可以看到是什么模型啦！
  - 第一个就是“PNG图片信息”... 把照片导进去，右边就会自动弹出照片的信息
  - 有时候我们把照片导入进去之后，发现右边并没有照片生成的信息... 那我们就可以用后面这个“标签器（Tagger”）
  - 点击最下面的“Copy...Data”就可以复制图片的所有信息... 回到SD，粘贴到关键词的文本框，点击右边的按钮，这些信息就会自动分配... 要注意的就是，大模型是需要我们手动去换的！
  - 这样我们就可以生成出跟大神几乎一样的照片了！（电脑网络配置的不同，出来的照片有细微差别）
  - 'b）以KoreanDollLike v1.0版本为例，它的元数据如下，所有训练参数已经知道了... ss_dataset_dirs: {100_GiniS2:
    {n_repeats: 100, img_count: 110}}, ss_resolution: (713, 891), ss_network_dim:
    128, ss_learning_rate: 0.0001...'
- 'no': 8
  name: 工程化量产体系 —— Generate Forever + 多账号并行 + 打包下载，把 AI 绘图变成流水线
  points:
  - '**为什么需要这个概念？**'
  - '- AI 绘图强随机性：合格率 ~3%(30:1 抽卡)，单张手动生成、筛选、下载，效率极低，无法支撑商业化交付'
  - '- 单账号算力上限：Colab 免费版 3-6h/天，本地显卡 24h 也有上限，量产需突破单点算力瓶颈'
  - '- 文件获取痛点：Colab 文件浏览器不支持批量下载，本地输出目录分散按日期分文件夹，手动收集极其繁琐'
  - '**核心定义**'
  - '- 端到端自动化流水线：单实例无人值守(Generate Forever) → 多浏览器/指纹浏览器多账号并行 → 账号池轮换 → 代码块打包下载输出目录'
  - '- 核心指标：单实例吞吐(~3张/分钟)、并行度(N浏览器×M账号)、日产能(可达数万张)、筛选率(人工/自动化)'
  - '- 资源编排：账号池管理(低价购买/自建/轮换)、浏览器指纹隔离(防关联封禁)、任务队列(提示词批次/参数矩阵)、产出聚合(打包/去重/分类/重命名)'
  - '**关键性质**'
  - '- Generate Forever：WebUI 原生功能，右键 Generate 选择，前端轮询后端持续生成，无需人工干预，单会话可跑至配额耗尽/断连'
  - '- 多账号并行线性扩容：无账号数量上限，Chrome/Edge/Firefox/指纹浏览器各登一号，物理隔离规避风控，单机 5 开即 5× 算力'
  - '- 打包下载脚本：`tarfile + google.colab.files.download` 将 `/content/outputs/txt2img-images/YYYY-MM-DD`
    压缩下载，解决批量获取痛点'
  - '- 账号池经济性：Google 账号批发价极低(几元/个)，边际算力成本趋近零，比买显卡/租云 GPU 成本低 1-2 个数量级'
  - '**典型例子**'
  - '- 健身产品推广：预设 50 组提示词(动作/器材/场景) → 5 浏览器并行跑 Generate Forever → 1 小时 900 张 → 打包下载
    → 人工筛选 30 张精修 → 投放素材库'
  - '- 表情包矩阵：固定角色 LoRA + 50 表情提示词矩阵 → 多账号并行生成 5000 张 → Tagger 打标分类 → 批量上传微信表情开放平台'
  - '- 电商图批产：Canny+产品线稿 → ControlNet 固定结构 → 换背景/光影/材质 Prompt 矩阵 → 并行生成 200 张主图/详情图
    → 超分后处理 → 上架'
  - '**边界条件**'
  - '- 风控博弈：Google 持续升级反滥用(人机验证频率↑、配额↓、禁用 SD 代码检测↑)，账号池维护成本随时间上升'
  - '- 并行瓶颈：单机带宽/内存/CPU 限制并发浏览器数(通常≤10)，大规模需分布式/指纹浏览器集群/自建 GPU 服务器'
  - '- 筛选成本：自动化筛选(美学评分模型/CLIP相似度/NSFW检测)尚不成熟，核心筛选仍依赖人工，人工筛选上限 ~500 张/小时'
  - '- 合规红线：生成内容涉及真人深度伪造/版权角色/违禁内容平台封号风险极高，必须建立内容审核 SOP(自动+人工双层)'
  - '- 经济账：免费算力边际成本虽低，但人工筛选/账号维护/风控对抗的人力成本随规模线性增长，ROI 拐点通常在 日产 5000-10000 张'
