  - paper: docs/202305/20230516_074.md
    role: origin
  - paper: docs/202305/ZXvbdq7RGoKEeLxryxAckCtSnPf.md
    role: improve
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: apply
  excerpts:
  - 目前 stable diffusion 主流的应用方向有辅助设计（包括产品设计、建筑设计、海报设计）、AI 模特、分镜脚本等。
  - 辅助产品设计... 通过controlnet的canny模型+prompt生成
  - AI模特：石膏模特+实拍产品... 结合chilloutmix+controlnet+图生图inpaiting
  - AI建筑设计... 通过controlnet的canny模型+建筑lora模型
  - Stable Diffusion的训练还是存在一定门槛... 但是运用场景非常多，可以大幅度帮助各行业优化业务流，其中电商、设计行业有比较多的机会
  - 在模型里面选择“canny”的模型... 关键词：最高质量，大师杰作等... 1可爱女孩，五官精致，精致眼睛和嘴巴，银色长发，白皙的皮肤，水汪汪的大眼睛
  - 预处理器和模型都选“msld”，这是用来计算房屋线条的... 切换一个现实照片的大模型... 关键词：一个客厅
  - 修复二次元的照片就选“R-ESRGAN 4x+Anime68”，其他实物照片就选“R-ESRGAN 4x+”，其他放大器出来的效果都没有这两个好
