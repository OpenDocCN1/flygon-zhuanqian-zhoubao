learning_targets:
- 建立面对新事物“先接受、再内化、后实践”的绿灯思维，打破习惯性防卫的舒适区惯性
- 掌握试错成本控制原则，在承受范围内（如几十元买号、几千元入群）进行高频低成本试错积累经验
- 熟练运用双系统决策模型：用系统1（直觉）高速捕捉机会信号，用系统2（理性）分析验证可行性与ROI
- 理解信息差半衰期法则，掌握“发现速度×产出速度×分发速度”极致执行力转化信息差的方法
- 掌握破圈价值互换模型，遵循“了解目标-真诚领情-持续努力-及时反馈-完成目标”受助者协议，输出独特价值而非索取
- 建立有效提问协议：提问前穷尽自我搜索，单条消息包含完整背景、条件、预期目标，尊重他人注意力资源
- 掌握ChatGPT中文调教12步范式，用结构化中文指令替代代码实现大模型人设固化与稳定输出
- 能将隐性技能显性化为标准化教程，通过“首发稀缺性+社群分享+大佬背书+朋友圈种草”四步分发实现多渠道变现
concept_map:
- 认知重塑与行动力底层操作系统
- ├── 绿灯思维  —— P001, P002
- │   ├── 定义：先接受→再内化→再实践
- │   ├── 对立面：红灯思维（习惯性防卫）
- │   └── 核心作用：破圈前置条件、认知开关
- ├── 试错成本控制原则  —— P001, P002
- │   ├── 量化标准：大不了多吃几天泡面可恢复
- │   ├── 核心逻辑：非对称收益（上限无顶、下限可控）
- │   └── 边界：禁止借贷、不碰生存资产、设止损线
- ├── 双系统决策模型  —— P001, P002
- │   ├── 系统1（直觉）：高速捕捉机会信号
- │   ├── 系统2（理性）：分析验证可行性与ROI
- │   ├── 协同流程：感觉来了→记录→列清单分析→决定
- │   └── 理论基础：《认知觉醒》系统1/系统2理论
- ├── 信息差半衰期法则  —— P001, P002
- │   ├── 核心公式：收益 ∝ 发现速度 × 产出速度 × 分发速度
- │   ├── 半衰期：信息差商业价值减半所需时间
- │   └── 速度护城河：红利期执行速度>执行质量
- ├── 破圈价值互换模型  —— P001, P002
- │   ├── 本质：破认知圈=社交本质=价值互换
- │   ├── 路径：输出独特价值吸引同频者主动连接
- │   ├── 受助者协议：了解目标→真诚领情→持续努力→及时反馈→完成目标
- │   └── 效应：势力复利（如梁靠谱与醒醒/苏姐深度绑定）
- ├── 有效提问协议  —— P002
- │   ├── 前置：穷尽自我搜索（百度/教程/翻译/社群）
- │   ├── 格式：单条消息含完整背景/条件/目标/尝试方案/报错
- │   └── 原则：一条消息问清楚，不浪费专家分秒时间
- └── ChatGPT中文调教范式  —— P002
- '    ├── 核心创新：用结构化中文指令替代代码实现少样本微调'
- '    ├── 12步流程：引入背景→预设角色→输入案例→反馈学习→反馈优化→拆解教学→迭代模板→稳定输出'
- '    ├── 产出物：标准化Prompt模板+优化笔记+可复用调教SOP'
- '    └── 迁移性：可调教小红书/论文/视频脚本等任意人设风格'
life_analogy:
- 想象认知重塑是一次**大脑操作系统的OTA升级**：
- '- **绿灯思维** = 卸载自带的“防病毒软件”（习惯性防卫），安装“沙盒模式”（新事物先跑着看）'
- '- **试错成本控制** = 给沙盒设置“资源配额上限”（内存/CPU/磁盘），防止实验进程拖垮主系统（生活基本盘）'
- '- **双系统决策** = “快速启动器”（系统1直觉捕捉图标）+ “权限确认弹窗”（系统2理性核对路径）'
- '- **信息差半衰期** = “限时免费体验券”，过期作废，唯有“极速下单+极速安装+极速使用”才能赚到超额价值'
- '- **破圈价值互换** = “开源贡献代码”换“核心维护者邀请”，提交的PR（独特价值）质量决定能否Merge进上游主干（高阶圈层）'
- '- **有效提问协议** = 规范的“Issue模板”：复现步骤、环境信息、预期行为、实际报错，缺一不可'
- '- **ChatGPT调教范式** = 不写底层代码（Fine-tuning），而是写完美的“配置文件/系统提示词”，用声明式配置驱动模型行为'
- 就像运维工程师用基础设施即代码管理服务器集群，我们也要用标准化认知流程管理大脑这台最复杂的服务器。
summary:
- concept: 绿灯思维
  desc: 面对新事物第一反应‘先试试再说’，三步走：接受→内化→实践，打破基因里的习惯性防卫
- concept: 试错成本控制原则
  desc: 在承受范围内疯狂尝试，量化标准‘大不了多吃几天泡面可恢复’，非对称收益：上限无顶、下限可控
- concept: 双系统决策模型
  desc: 系统1（直觉）捕捉机会+系统2（理性）验证决策，流程：感觉→记录→列清单分析→决定做/不做
- concept: 信息差半衰期法则
  desc: 信息差商业价值随时间指数衰减，变现=发现速度×产出速度×分发速度，红利期速度护城河>质量护城河
- concept: 破圈价值互换模型
  desc: 破圈=破认知圈，社交=价值互换，输出独特价值吸引连接，受助者遵循五步协议建立势力复利
- concept: 有效提问协议
  desc: 提问前穷尽自查，单条消息含完整背景/条件/目标/尝试/报错，尊重他人注意力，倒逼自主解决问题
- concept: ChatGPT中文调教范式
  desc: 用结构化中文指令替代代码训练大模型，12步流程实现人设固化，产出可复用Prompt模板与教程资产
- concept: 教程产品化与分发裂变
  desc: 将隐性技能显性化为标准化教程，经首发稀缺+社群分享+大佬背书+朋友圈种草四步分发，衍生出版/星球/分销/训练营多渠道变现
exercises:
- 'no': 1
  title: 绿灯思维实战演练：24小时新工具极速上手
  contents:
  - 任务：在24小时内，从零开始掌握一个你从未用过的AI工具（如Midjourney、Runway、Claude、Notion AI等），并产出一份可交付的《新手避坑速查表》。
  - 步骤：
  - 1. 选工具：基于直觉（系统1）在10分钟内选定一个当前热门、有免费额度的工具。
  - 2. 设预算：设定试错成本上限（如0元、或≤20元），承诺超支即停止。
  - 3. 极速跑通：注册→登录→生成第一个满意结果→总结核心参数/提示词结构，全程计时。
  - 4. 产出物：输出一页纸PDF，含：核心功能、注册登录避坑、3个高频提示词模板、1个对标案例拆解。
  - 5. 分发验证：发到至少1个社群/朋友圈/公域平台，观察24小时互动数据。
  - 复盘问题：
  - '- 全流程耗时多少？哪个环节最慢？如何用RPA/模板优化？'
  - '- 试错成本实际几何？是否触发止损线？'
  - '- 产出物被收藏/转发/咨询次数？验证了‘信息差半衰期’的哪个速度环节？'
- 'no': 2
  title: 双系统决策日志：记录并拆解你的下一个‘冲动决定’
  contents:
  - 背景：未来一周内，你会面临一个‘想花钱/花时间尝试新事物’的决定（如报名课程、买工具会员、入局新赛道）。
  - 执行：
  - 1. 捕捉瞬间：冲动产生的那一刻，立即语音/文字记录：触发场景、核心冲动、预期收益、恐惧点。
  - 2. 理性拆解（系统2介入）：在2小时内完成清单分析——
  - '   - 成本清单：直接成本/机会成本/隐性成本（精力/学习曲线）'
  - '   - 收益清单：现金流/技能资产/人脉资产/信息差红利，分别估算概率与金额'
  - '   - 路径清单：最小可行性验证步骤（MVP）、止损线、复盘节点'
  - '   - 风控清单：最坏结果、是否违反‘不借贷/不碰生存资产’红线、Plan B'
  - 3. 决策输出：做 / 不做 / 缩小规模测试，并在日历设定复盘提醒。
  - 复盘问题：
  - '- 事后实际结果与理性预测偏差多大？直觉是否误判/漏判？'
  - '- ‘列清单’环节是否成为拖延借口？如何设定‘分析时限’强制决策？'
  - '- 能否将此清单模板固化为通用决策SOP，应用于后续所有决策？'
- 'no': 3
  title: 破圈价值输出实战：制作你的第一张‘破圈名片’
  contents:
  - 目标：基于你当前掌握的一项技能/经验/资源（哪怕是‘刚学会用ChatGPT写周报’），制作一份高质量、可直接传播的《单页实操指南》，并投喂给至少1个目标圈层。
  - 步骤：
  - 1. 选题定位：列出你‘知道但别人不知道’的3个具体知识点，选商业价值最高、最易标准化的1个。
  - 2. 标准化生产：用‘问题-方案-步骤-避坑-模板’五段式结构，2小时内产出单页PDF/长图/Notion页面。
  - 3. 价值互换投喂：
  - '   - 找到1个目标圈层（付费社群/行业大佬微信/专业论坛/对标账号评论区）'
  - '   - 遵循受助者协议：先了解对方近期目标/痛点 → 真诚分享‘这可能帮到你’ → 承诺根据反馈迭代 → 发送资料 → 3天内主动反馈使用效果。'
  - 4. 长尾运营：将该资料上传至个人知识库/公众号/小红书/知识星球，设为‘置顶/钩子’，观察两周长尾引流数据。
  - 复盘问题：
  - '- 对方是否回复/转发/建立连接？若无，是‘价值不独特’还是‘投喂姿势不对’？'
  - '- 该资料是否被二次传播？长尾流量成本（制作耗时/分发耗时）与收益（咨询/成交/粉丝）比例如何？'
  - '- 能否将此‘单页指南’批量化生产？建立‘选题→模板→产出→分发→迭代’的周度SOP？'
- 'no': 4
  title: ChatGPT中文调教迷你项目：训练一个‘专属文案助手’
  contents:
  - 目标：使用12步调教法，在2小时内训练一个能稳定输出你‘专属风格’（如：小红书种草风/公众号深度风/带货短视频脚本风）的GPT人设，并输出可复用的Prompt模板卡片。
  - 步骤：
  - 1. 收集种子案例：找3-5篇你极其欣赏、风格高度统一的目标风格爆款文案（必须是全文，非片段）。
  - 2. 执行12步调教：
  - '   - 步骤1-3：告诉GPT背景、角色、粘贴第1个完整案例。'
  - '   - 步骤4-6：反馈‘学习效果’、指出‘优化方向’、要求‘拆解教学’（输出该风格的结构公式/词汇表/节奏点）。'
  - '   - 步骤7-9：粘贴第2个案例验证→反馈优化拆解模板→记录优化笔记。'
  - '   - 步骤10-12：粘贴第3/4/5个案例回归测试→最终输出‘稳定版Prompt模板’（含系统提示词+Few-shot示例+负面约束）。'
  - 3. 压力测试：用模板生成5个新选题文案，人工打分（1-10分），均分<8分则回滚优化。
  - 4. 资产化：将最终模板存入Prompt管理库（Notion/Obsidian/飞书），标注适用场景/版本号/维护人。
  - 复盘问题：
  - '- 调教总耗时？种子案例质量对收敛速度影响多大？'
  - '- 最终模板在新选题上稳定性如何？是否存在‘幻觉’或‘风格漂移’？'
  - '- 该模板能否直接交给助理/实习生/外包使用？文档是否足够自解释？'
units:
- 'no': 1
  name: 绿灯思维 —— 让大脑对新事物说"先试试再说"
  points:
  - '**为什么需要这个概念？**'
  - '- 人类基因里自带"习惯性防卫"，遇到新事物本能抗拒，导致错失时代红利'
  - '- 面对 AI 等新工具，固有认知会阻挡机会捕捉，需要一套主动拥抱变化的认知操作系统'
  - '- 普通人缺乏资源背景，唯有打破舒适区、快速试错才能实现阶层跃迁'
  - '**核心定义**'
  - '- 面对新观点、新事物时，第一反应是："这很有趣，说不定对我有用，我先试试再说"'
  - '- 三步走：先接受（不抗拒）→ 再内化（变成自己的）→ 再实践（跑通闭环）'
  - '- 与"红灯思维"（习惯性防卫、待在舒适区）形成鲜明对立'
  - '**关键性质**'
  - '- 认知开关：决定能否进入高认知密度圈层，是破圈的前置条件'
  - '- 低门槛：不需要高智商、高学历，只需主动切换反应模式'
  - '- 复利性：一次思维切换，终身受益于所有新机遇的捕捉'
  - '**典型例子**'
  - '- 作者遇到 ChatGPT 热潮未犹豫，直接淘宝买号、进群、调教，两周变现 7000 元'
  - '- 对比同群女生：十天卡在注册、登录基础问题，反复索取教程答案，最终被踢出群'
  - '**边界条件**'
  - '- 并非盲目跟风：试错成本必须在承受范围内（如几十元买号、几千元入群），超出则换赛道'
  - '- 需配合"理性分析"兜底：直觉捕捉机会后，必须用逻辑验证可行性与 ROI'
  - '- 无行动力则无效：光想不做，绿灯思维只是空中楼阁'
  sources:
  - paper: docs/202305/20230516_019.md
    role: origin
  - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
    role: improve
  excerpts:
  - 拥有绿灯思维的人遇到新观点、新事物时的第一反应是这个观点、事物一定很有趣，说不定对我有用，我先试试再说。
  - 先接受，再内化，把知识变成自己的，再实践，这就是绿灯思维。
  - 其实在我们遇到与过去认知不一致的观点时，大部分普通人都会陷入习惯性防卫，这是我们人类基因里的记忆，只想要待在熟悉的舒适区。
  - 机会常常是在我们勇敢尝试的过程中找到的，请在承受范围内疯狂试错。
- 'no': 2
  name: 试错成本控制原则 —— 只赌得起输得起的筹码
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人创业最大障碍是恐惧失败，实则是未量化"承受范围"导致心理放大风险'
  - '- 资源匮乏者无法承担毁灭性打击，必须建立可量化的风险上限'
  - '- 高频低成本试错是积累经验、验证路径的唯一可行方式'
  - '**核心定义**'
  - '- 在资金、时间、精力可承受范围内进行疯狂尝试，单次损失不影响生活基本盘'
  - '- 量化标准："大不了多吃几天泡面，一两个月就能恢复正常生活"'
  - '- 核心逻辑：类比免疫系统，适度风险暴露是生存进化的必需条件'
  - '**关键性质**'
  - '- 非对称收益：上限无封顶（可能抓住风口），下限可控（仅损失几百元）'
  - '- 加速学习：低成本高频试错 → 快速获得真实反馈 → 修正认知 → 提高下次成功率'
  - '- 心理安全感：量化风险后，行动阻力大幅降低，克服"完美主义拖延症"'
  - '**典型例子**'
  - '- 作者淘宝花十几元买 ChatGPT 账号，选首月 50 元方案而非 140 元方案验证实用性'
  - '- 入群生财有术花 2000 元（两个月工资），但预判价值远超成本，属可控试错'
  - '- 训练营 3 天产出教程卖近 2000 元，虽交付不及格但回本并获得宝贵经验'
  - '**边界条件**'
  - '- 禁止借贷试错：必须用自有闲钱，严禁信用卡、网贷、借款承担风险'
  - '- 单次试错不可关联核心生存资产（房租、医疗、家庭开销）'
  - '- 需设置明确止损线：如"连续 3 次无正反馈则停止"或"累计亏损超预算 50% 则复盘"'
  sources:
  - paper: docs/202305/20230516_019.md
    role: origin
  - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
    role: improve
  excerpts:
  - 在试错成本内疯狂尝试。
  - 如果尝试新事物的试错成本超过你的承受能力，那就换一个。
  - 对于二十出头的我们，其实试错成本很低的，即使是几百块几千块，大不了多吃几天泡面，一两个月就能恢复正常生活。
  - 就跟生活在无菌环境里的婴儿难以在正常环境中存活一样，我们能够在充满病菌的环境生存就是因为我们从小就在接触病菌。
- 'no': 3
  name: 双系统决策模型 —— 直觉开路、理性护航
  points:
  - '**为什么需要这个概念？**'
  - '- 纯理性决策太慢，易陷入分析瘫痪，错失转瞬即逝的红利窗口'
  - '- 纯直觉决策易冲动、赌博，缺乏风控，导致本金归零'
  - '- 需要一套"快捕捉、慢验证"的标准化决策流程'
  - '**核心定义**'
  - '- 基于《认知觉醒》系统 1/系统 2 理论：系统 1（潜意识/直觉）高速捕捉机会信号 → 系统 2（逻辑/理性）分析验证可行性与 ROI'
  - '- 操作流程：感觉来了 → 记录下来 → 列清单分析（成本/收益/路径/风险） → 决定做/不做'
  - '**关键性质**'
  - '- 分工明确：系统 1 负责"发现"（穿透噪音、识别早期信号），系统 2 负责"决策"（风控、资源匹配、执行规划）'
  - '- 互为制衡：直觉防漏判、理性防误判，单靠任一系统均会导致系统性偏差'
  - '- 可训练：通过刻意练习（如每日复盘、记录直觉命中率）提升双系统协同效率'
  - '**典型例子**'
  - '- 作者直觉感到 ChatGPT 是大机会 → 理性分析：账号获取成本低、调教可学、变现路径清晰 → 决定 All in'
  - '- 对比被动提问者：只有系统 1 焦虑无系统 2 拆解，卡在基础环节十天不动'
  - '**边界条件**'
  - '- 直觉不可盲信：作者强调"感觉并非绝对正确，需要与理性相辅相成"'
  - '- 理性不可过度：陷入完美计划则违背"极速行动"原则，需设定分析时间上限（如 2 小时内必须出决策）'
  - '- 适用场景：不确定性高、时效性强的新赛道探索；成熟业务优化更依赖纯理性分析'
  sources:
  - paper: docs/202305/20230516_019.md
    role: origin
  - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
    role: improve
  excerpts:
  - 通过阅读《认知觉醒》，我了解到潜意识处理信息的速度非常快，我们每天产生的许多想法都来自潜意识的灵感。
  - 因此，我们应该学会倾听感觉，利用感觉去捕捉信息，然后用理性进行决策。
  - 但我们也要注意，感觉并非绝对正确，需要与理性相辅相成。
  - 靠感觉捕捉，靠理性分析。
- 'no': 4
  name: 信息差半衰期法则 —— 行动力即变现力
  points:
  - '**为什么需要这个概念？**'
  - '- 认知差距（信息差）本质是时间差，商业价值随时间指数级衰减'
  - '- 同一信息，早知道 24 小时变现路径与晚知道一周价值天壤之别'
  - '- 普通人往往"知道很多，做成很少"，核心缺口在"速度"而非"认知"'
  - '**核心定义**'
  - '- 信息差变现 = 发现速度 × 产出速度 × 分发速度，三个速度乘积决定收益上下限'
  - '- 半衰期：指信息差商业价值减半所需时间，AI 早期可能仅以天/小时计算'
  - '- 核心公式：收益 ∝ 1 / (反应延迟时间)'
  - '**关键性质**'
  - '- 速度护城河：在红利期，执行速度比执行质量更重要，"完美是完成的敌人"'
  - '- 可复制性：发现→产出→分发全流程标准化后，可复用于后续所有新工具/新赛道'
  - '- 复利效应：每次极速跑通闭环，都在积累"最小可行性产品"库与分发渠道资产'
  - '**典型例子**'
  - '- 刀姐：发现 ChatGPT 24 小时内写出交付手册、拉群招学员，抢占先发优势'
  - '- 作者：调教两小时出教程 → 社群分享 → 朋友圈裂变 → 出版/星球/分销五条变现路径并行'
  - '- 训练营：3 天产出 4 大场景教程，虽交付不及格但完成了"从 0 到 1"的商业闭环验证'
  - '**边界条件**'
  - '- 前提是方向大致正确：极速冲刺需建立在"双系统决策"初步验证通过的基础上'
  - '- 不能以速度为借口牺牲底线：合规、法律、道德红线不可触碰'
  - '- 仅适用红利期：成熟市场拼的是精细化运营与护城河，而非单纯速度'
  sources:
  - paper: docs/202305/20230516_019.md
    role: origin
  - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
    role: improve
  excerpts:
  - 后来复盘的时候我发现...刀姐说玩赚社群能够成功的原因没有别的，最大的优势就是她比别人快。
  - 发现chatGPT这个信息差后24小时内就写出了交付手册开始拉群招学员。
  - 所以信息差需要行动力才能发挥最大效用。行动胜于空谈，执行力使你遥不可及。
  - 不论是刀姐的玩赚社群、实体书，还是我编写的教程，成功的关键在于我们抓住了信息差并迅速行动。
- 'no': 5
  name: 破圈价值互换模型 —— 用独特价值换取高阶认知
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人渴望进入高阶圈层，却陷入"靠闲聊混熟"或"单向索取"的低效社交陷阱'
  - '- 圈层本质是认知同频共振，破圈唯一货币是"独特价值输出"'
  - '- 需要一套可复制的"受助者协议"，将单向帮助转化为双向长期价值共振'
  - '**核心定义**'
  - '- 破圈本质 = 破认知圈，社交本质 = 价值互换'
  - '- 进入高质量圈子的路径：输出独特价值（教程/数据/复盘/渠道）吸引同频者主动连接'
  - '- 受助者五步协议：了解目标 → 真诚领情 → 持续努力 → 及时反馈 → 完成对方目标'
  - '**关键性质**'
  - '- 非零和博弈：你的成长=对方投资的正反馈，形成"势力复利"（如梁靠谱与醒醒/苏姐深度绑定）'
  - '- 筛选机制：唯有输出价值才能吸引高质量贵人，闲聊只能吸引同层甚至更低层'
  - '- 资产化：一次高质量输出（如教程），可长尾吸引无数后续连接，边际成本趋零'
  - '**典型例子**'
  - '- 作者发教程 → 吸引黛色、刀姐等大佬主动连接 → 获出版邀约、训练营合伙、星球种子用户'
  - '- 评论区即时形成资源交换：王大弈求账号、钟伟森供渠道、作者留微信建连接'
  - '- 对比：被动提问女生十天只索取无输出、无反馈、无感谢，消耗他人耐心被踢出群'
  - '**边界条件**'
  - '- 价值必须真实且独特：泛泛而谈的"励志语录"、搬运的二手资料无破圈力'
  - '- 受助者协议需全程践行：缺任何一步（如不反馈、不完成目标）即破坏信任账户'
  - '- 非速成术：信任账户需长期存入，单次互动无法建立深度连接，需耐心复利'
  sources:
  - paper: docs/202305/20230516_019.md
    role: origin
  - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
    role: improve
  excerpts:
  - 破圈最终还是破的认知圈，认识一个人、进入一个圈子都是为了提升自己的认知。
  - 社交的本质就是价值互换，你用你独特的价值去换取其它圈子的认知价值。
  - 作为受助者，我们如何更好的反馈呢？首先，了解对方的目标...其次，真诚领情向前进...第三，不亚于任何人的努力...第四，及时反馈进度...最后是完成他的目标。
  - 圈子的优劣决定了你能够跳得多高、成长多快。
- 'no': 6
  name: ChatGPT 中文调教范式 —— 用自然语言训练 AI 如同训狗
  points:
  - '**为什么需要这个概念？**'
  - '- 官方 API 微调门槛高（需代码、算力、数据清洗），普通人无法触达'
  - '- 直接对话提示词不稳定，输出质量波动大，无法标准化交付'
  - '- 需要一套零代码、中文原生、可迭代、可复用的"少样本微调"替代方案'
  - '**核心定义**'
  - '- 将训练狗指令迁移至 LLM：引入背景 → 预设角色 → 输入完整案例 → 反馈学习效果 → 反馈优化 → 拆解教学 → 迭代优化模板 → 稳定输出'
  - '- 核心创新：用结构化中文指令替代代码，实现人设固化与风格稳定输出'
  - '- 产出物：标准化 Prompt 模板 + 优化笔记 + 可直接复用的调教 SOP'
  - '**关键性质**'
  - '- 低门槛：仅需会写中文、会复制粘贴，无需编程、无需算力、无需数据工程'
  - '- 高迁移：同一套范式可调教小红书风格、论文风格、视频脚本风格等任意人设'
  - '- 显性化隐性知识：将大模型能力"蒸馏"为可交付、可分销、可出版的标准化教程资产'
  - '**典型例子**'
  - '- 作者耗时 2 小时调教出稳定写小红书笔记的 GPT，并输出《ChatGPT 中文训练教程》'
  - '- 教程被刀姐选入实体书《人人都能玩赚 ChatGPT》出版（京东榜单第一），获高额稿费'
  - '- 成为知识星球核心钩子吸引几十人付费，作为账号分销诱饵在小红书成交二三十单'
  - '**边界条件**'
  - '- 依赖底模能力上限：无法突破基座模型的推理上下文、幻觉率等硬性限制'
  - '- 需持续维护：模型版本迭代（如 GPT-3.5→4.0）可能导致原有模板失效需重调'
  - '- 非万能钥匙：复杂逻辑推理、长链路代码生成等任务仍需代码级 Prompt Engineering 或 Fine-tuning'
  sources:
  - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
    role: origin
  excerpts:
  - 在《玩赚 ChatGPT》中，我们说过，GPT 就像一个情商智商都很高的小孩子，但它对人类的思维不太理解。因此，我们可以采用基于模仿的方法来帮助 GPT 学习。
  - 调教 GPT 的过程启发于我在家训练小狗指令的经历。
  - 1.引入背景 2.预设角色 3.预设指令（已淘汰） 4.输入完整案例 5.反馈学习效果 6.反馈优化 7.拆解教学 8.反馈学习效果 9.反馈优化拆解模板
    10.优化笔记 11.反馈优化学习效果 12.调教结果
  - 后来我又想，既然chatGPT是提供大量训练的语言模型，那能不能直接通过中文而不是代码去做这样一个训练...最终通过不懈努力还真让我写出来一份《chatGPT中文训练教程》
  - 实践了两个多小时，我终于可以让chatGPT稳定写出小红书笔记，并且可以对写的小红书笔记进行拆解优化。
- 'no': 7
  name: 有效提问协议 —— 尊重专家注意力的最小必要条件
  points:
  - '**为什么需要这个概念？**'
  - '- 低质量提问消耗公共知识资源，导致专家停止公开分享、社群氛围恶化'
  - '- 新手常犯：百度可查、教程已写、翻译即懂的问题还要人手把手教'
  - '- 建立提问门槛，能倒逼提问者养成"先自查、再提问"的自主解决问题习惯'
  - '**核心定义**'
  - '- 前置条件：提问前穷尽自我搜索（百度/官方文档/教程/翻译工具/社群搜索）'
  - '- 格式要求：单条消息包含完整背景、已知条件、预期目标、已尝试方案、具体报错信息'
  - '- 核心原则：一条消息问清楚，不让对方反问基本信息，不浪费专家分秒时间'
  - '**关键性质**'
  - '- 互惠性：高质量提问获得高质量回答，低质量提问被忽略甚至拉黑，构建良性生态'
  - '- 成长杠杆：强迫自己梳理问题全貌的过程，往往能自行解决 50% 以上问题'
  - '- 社交货币：懂提问的人被视为"靠谱、尊重人、有潜力"，更易获得核心资源倾斜'
  - '**典型例子**'
  - '- 反面教材：同群女生十天反复问教程里有答案、翻译即懂的基础问题，耗费作者数小时未获一句感谢，被群主踢出'
  - '- 正面范式：作者自主翻译教程、摸索登录方案、对比成本选低价方案、仅对关键卡点发帖求助'
  - '**边界条件**'
  - '- 适用于异步文本沟通场景（社群、私信、工单、论坛），实时语音通话可适当放宽'
  - '- 紧急生产故障、医疗急救等生命财产安全场景优先解决问题，事后补流程'
  - '- 对方明确表示"随时问、不用客气"时可简化，但建议保持职业习惯'
  sources:
  - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
    role: origin
  excerpts:
  - 首先，提问前想清楚自己有没有尽力去寻找答案，是不是只有问对方才能解决这个问题。不要拿一个百度一下就知道的问题或者对方提供的教程、资料里有答案的问题去浪费别人的时间精力。
  - 其次，提问的时候把问题的背景、条件等说清楚，能一条消息问清楚的就不要让回复两条消息。
