life_analogy:
- 想象这个项目是**在商场入口‘蹭’品牌专柜流量的‘导购员’**：
- '- **Google Ads** = 商场中央广场的广告位拍卖系统'
- '- **品牌词** = 想找‘耐克/苹果/戴森’专柜的顾客喊出的品牌名'
- '- **CPC 0.01** = 你只需付 1 分钱租金，就能在广场立块牌子写‘耐克专柜这边走’'
- '- **Awin 联盟链接** = 通往品牌官方授权收银台的‘专用通道’'
- '- **EPC > 0.01** = 每引来 1 位顾客，品牌方给你 5 分佣金'
- '- **套利** = 你花 1 分买流量，赚 5 分佣金，净赚 4 分，且顾客全是奔着品牌来的，成交率极高'
- 就像商场允许你在品牌专柜门口发传单，只要不挡道、不冒充官方，品牌方默许甚至欢迎（授权光谱），你就能长期躺赚‘导购费’。
summary:
- concept: Mediabuy Brand Bid
  desc: Google Ads 竞价品牌词直链联盟链接，利用 CPC≈0.01 与 EPC>0.01 差价套利
- concept: 品牌词近零成本定理
  desc: 品牌词相关性极高、竞争极低，质量得分满分导致实际 CPC 稳定在 0.01 当地货币
- concept: CPC/EPC 套利模型
  desc: 核心盈利公式：利润 = (EPC - CPC) × 点击量，前提 CPC < EPC，三组实盘 ROI 359%-496%
- concept: 商家品牌词授权光谱
  desc: 非全禁：显性允许/默许/仅禁自有词允许竞品词，操作空间取决于筛选能力
- concept: 标准化三步流程
  desc: 开 Google Ads 号 → 注册 Awin 筛选 Offer → 搜索广告直链联盟追踪链接
- concept: 极低成本出价策略
  desc: 手动 CPC 锁定 0.01，港币账户理论再降 7 倍成本 (0.01 HKD ≈ 0.0013 USD)
- concept: Offer 筛选四维硬指标
  desc: 大体量品牌词 + 允许竞价 + EPC 显著>0.01 + 双周付周期
- concept: Direct Linking 直链
  desc: 广告落地页直接用联盟追踪链接，无需建站、无需 Cloak，降低门槛与审核风险
- concept: 长期可行性/单人百万门槛
  desc: 十年存活验证结构性红利，三方博弈(商家/联盟/Google)平衡点稳固，单人年入百万‘非常轻松’
- concept: Wise 推荐计划同构验证
  desc: 品牌词 CPC £0.01-0.02 + 固定佣金 $50/单，单日佣金破万英镑，印证模式跨场景复用性
exercises:
- 'no': 1
  title: 手算一次套利账户盈亏
  contents:
  - 假设你运营一个美元计费的 Google Ads 账户，投放某 Awin Offer：
  - 1. 设置最高 CPC = $0.01，日预算 $20
  - 2. 该 Offer 历史 EPC = $0.045，转化率约 2%
  - 3. 当天实际花费 $18.50，获得点击 1,850 次
  - 请计算：
  - '- 当天联盟佣金收入预估'
  - '- 当天净利润与 ROI'
  - '- 若改用港币账户 (0.01 HKD ≈ 0.0013 USD)，在相同点击量下成本与利润变化'
  - 思考题：
  - '- 为什么 EPC 是历史平均值而非实时承诺？实时 EPC 低于 0.01 时会发生什么？'
  - '- 日预算 $20 为何设为‘止损线’而非‘目标消耗’？'
- 'no': 2
  title: Offer 筛选实战演练
  contents:
  - 打开 Awin（或模拟联盟后台），按以下四维硬指标筛选 5 个候选 Offer 并记录：
  - 1. 品牌词月搜索量 > 10 万 (用 Ahrefs/Semrush/Keyword Planner 验证)
  - 2. 联盟后台‘品牌竞价规则’字段：Allowed / Brand Bidding Allowed / Competitor Terms Allowed
  - 3. 30 天 EPC > $0.03 (留足 3 倍安全边际)
  - 4. 结算周期：Biweekly / Weekly (拒绝 Net-30/60)
  - 输出表格：Offer 名称 | 品牌词 | 月搜索量 | 竞价权限 | 30天EPC | 结算周期 | 申请链接
  - 思考题：
  - '- 为何‘竞品词允许’也是可接受的备选？流量精准度会有何差异？'
  - '- 季节性品牌 (如报税软件/黑五大促) 的 EPC 波动特征是什么？如何规避？'
- 'no': 3
  title: 账户基建与风控隔离设计
  contents:
  - 设计一个单人可操作的 ‘MCC 矩阵账户结构’ 草案：
  - 1. MCC 管理账户 (邮箱 A) → 下挂 3 个子账户 (不同货币/不同品类/不同风险等级)
  - 2. 每个子账户绑定独立 Wise/Payoneer 收款账户 (不同币种/不同主体)
  - 3. 制定 ‘Offer 监控预警 SOP’：EPC 连续 3 天跌破 $0.02 → 暂停投放 + 申请新 Offer
  - 4. 制定 ‘账户熔断机制’：单账户单日亏损 > $50 或 ROI < 150% → 自动停止脚本触发
  - 回答问题：
  - '- 为什么建议 ‘一账户一货币一品类’ 而非大杂烩？'
  - '- Google Ads 智能出价 (目标 CPA/最大化转化) 为何在本模式中必须关闭？'
  - '- 如何规避 ‘户死户/黑号/二手户’ 风控？开户渠道优先级排序是什么？'
units:
- 'no': 1
  name: 品牌词近零成本定理 —— 让广告费变成“捡漏”价
  points:
  - '**为什么需要这个概念？**'
  - '- 传统付费广告竞争激烈，CPC（单次点击成本）高企，利润空间被压缩'
  - '- 需要一种结构性的低成本流量获取渠道，实现确定性套利'
  - '- 品牌词因极高相关性、极低竞争，成为天然的“定价错误”区域'
  - '**核心定义**'
  - '- 在 Google Ads 中竞价商家自身的品牌关键词（Brand Keywords）'
  - '- 因质量得分极高（满分/接近满分）且通常无竞对竞价，实际 CPC 可稳定在 0.01 当地货币单位'
  - '- 广告落地页直接使用联盟追踪链接，无需建站'
  - '**关键性质**'
  - '- 数学模型：利润 = (EPC - CPC) × 点击量，核心条件 CPC < EPC'
  - '- 品牌词 CPC 可压至 0.01 以下，联盟 Offer EPC 极少低于 0.01，天然存在正向套利空间'
  - '- 三组实盘 ROI 均在 359%-496% 区间，验证模型稳健性'
  - '**典型例子**'
  - '- 账户组1：佣金 $5,715 / 花费 $1,220 / 净利 $4,495 / ROI 368%'
  - '- 账户组2：佣金 $7,218 / 花费 $1,210 / 净利 $6,008 / ROI 496%'
  - '- 账户组3：佣金 $3,988 / 花费 $867 / 净利 $3,121 / ROI 359%'
  - '**边界条件**'
  - '- 必须通过联盟审核，且商家允许品牌词竞价（存在授权光谱：显性允许/默许/仅禁自有品牌词）'
  - '- 依赖 Google Ads 政策稳定性与联盟结算信誉（推荐双周付 Awin）'
  - '- 港币账户虽理论可再降 7 倍成本，但无实投数据佐证，属理论推演'
  sources:
  - paper: docs/202305/M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  excerpts:
  - 因为你是出价品牌词，品牌词实际谷歌出价是无限接近于零，也是免费，所以只要你设置没问题，单价到0.01完全没有问题
  - 当你的CPC本身是0.01的单价的时候，基本上任何产品都会赚钱，很少见到有EPC低于0.01的广告联盟里的Offer。
  - 佣金收入：3403英镑+835欧元+369美元；汇率划算后，合计佣金收入：5715美元；广告成本：1220美元；利润：5715美元 – 1220美元 = 4495美元；回报率：ROI
    = 4495 ÷ 1220 = 368%
  - 佣金收入：4913英镑+685欧元+67美元；汇率换算后，合计佣收入：7218美元；广告成本：1210美元；利润：7218美元 – 1210美元 = 6008美元；回报率：ROI
    = 6008 ÷ 1210 = 496%
  - 佣金收入：3031英镑+37美元；汇率换算后，合计佣收入：3988美元；广告成本：867美元；利润：3988美元 – 867美元 = 3121美元；回报率：ROI
    = 3121 ÷ 867 = 359%
  - 这个项目可以做多久？我们从十几年前就这样玩，只是某些广告主以及广告联盟的合规团队要求比较严格而已。
  - 如果不追求极致，控制一个风险比，一年一百万人民币以上非常轻松。
- 'no': 2
  name: 商家品牌词授权光谱 —— 并非全禁，总有“漏网之鱼”可捞
  points:
  - '**为什么需要这个概念？**'
  - '- 品牌词竞价常被视为违规/侵权，劝退大量新手'
  - '- 需要澄清合规边界，将“违规风险”转化为“筛选门槛”'
  - '- 只有理解授权层级，才能在合规前提下规模化操作'
  - '**核心定义**'
  - '- 商家对联盟推广品牌词的态度分三层：显性允许（条款许可）、默许（不管不问）、仅禁止自有品牌词但允许竞品词'
  - '- 项目可行性建立在“总能找到允许竞价的大品牌 Offer”这一市场现实上'
  - '**关键性质**'
  - '- 非二元对立（允许/禁止），而是连续光谱，操作空间取决于筛选能力'
  - '- 竞品词竞价普遍被允许，是备选低风险切入点'
  - '- 需配合联盟后台的品牌竞价规则字段进行筛选'
  - '**典型例子**'
  - '- 素材作者长期操作未被封号，印证“存量博弈平衡点”长期存在'
  - '- 三组实盘账户均稳定跑量，侧面证明所选 Offer 处于允许/默许区间'
  - '**边界条件**'
  - '- 合规团队收紧会周期性清洗账户，需建立 Offer 备选库动态替换'
  - '- 严禁触碰明确禁止品牌词的商家（如大牌奢侈品、严控渠道的品牌）'
  - '- 账户层面需做好风险隔离（MCC 多账户结构），单号挂了不伤筋动骨'
  sources:
  - paper: docs/202305/M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  excerpts:
  - 国外有很多商家，允许你出价他们的品牌词，而且一定可以出价他们竞争对手的品牌词。
  - 此方法不是违规的吗？这句话对，也不对，
  - 这个项目可以做多久？我们从十几年前就这样玩，只是某些广告主以及广告联盟的合规团队要求比较严格而已。
- 'no': 3
  name: CPC/EPC 套利数学模型 —— 只要买得比卖得便宜，躺着也赚钱
  points:
  - '**为什么需要这个概念？**'
  - '- 将模糊的“赚差价”量化为可计算、可监控、可复制的数学公式'
  - '- 建立决策标准：不看品牌大小、不看行业，只看 CPC 与 EPC 关系'
  - '- 将主观判断剥离，实现标准化、自动化的投放决策'
  - '**核心定义**'
  - '- CPC (Cost Per Click)：Google Ads 实际扣费单价，品牌词可控至 0.01 当地货币'
  - '- EPC (Earnings Per Click)：联盟后台统计的每次点击平均佣金收益'
  - '- 盈利条件：CPC < EPC，利润率 = (EPC - CPC) / CPC'
  - '**关键性质**'
  - '- 边际安全性极高：CPC 固定在 0.01，EPC 很少跌破 0.01，几乎无亏损可能'
  - '- 规模化边际成本递减：单账户日耗百元级，利润千美元级，可通过 MCC 矩阵横向复制'
  - '- 汇率套利叠加：港币/日元等弱势货币账户可进一步压低美元计价 CPC'
  - '**典型例子**'
  - '- 实盘数据：三组账户 EPC 隐性约 $0.04-$0.06，CPC 固定 $0.01 级别，单次点击净赚 $0.03+'
  - '- 单日损益更新：单账户单日收入远超成本，CPC 0.01 条件下“任何产品都会赚钱”'
  - '**边界条件**'
  - '- EPC 具有时效性（联盟数据延迟、扣量、商家下线 Offer），需实时监控并止损'
  - '- 汇率波动影响港币账户实际成本，需锁定汇率或动态调整出价'
  - '- Google Ads 智能出价模式可能突破手动 CPC 上限，建议锁定手动出价策略'
  sources:
  - paper: docs/202305/M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  excerpts:
  - 利润：5715美元 – 1220美元 = 4495美元；回报率：ROI = 4495 ÷ 1220 = 368%
  - 利润：7218美元 – 1210美元 = 6008美元；回报率：ROI = 6008 ÷ 1210 = 496%
  - 利润：3988美元 – 867美元 = 3121美元；回报率：ROI = 3121 ÷ 867 = 359%
  - 当你的CPC本身是0.01的单价的时候，基本上任何产品都会赚钱，很少见到有EPC低于0.01的广告联盟里的Offer。
  - 如果你了解各个国家的汇率，这个0.01是当地货币的0.01，比如港币的0.01港币成本远小于美元的0.01美元。
  - 这里面如果是用港币账户，成本还可以降低至少七倍
- 'no': 4
  name: 标准化三步执行流程 —— 从开户到收钱的“最小闭环”
  points:
  - '**为什么需要这个概念？**'
  - '- 降低技术门槛：无需建站、无需 Cloak、无需复杂落地页搭建'
  - '- 标准化动作库：将项目拆解为可清单化、可外包、可复制的三步操作'
  - '- 快速验证：新手可在极短时间内跑通首单，建立正向反馈'
  - '**核心定义**'
  - '- 步骤1：准备 Google Ads 账户（个人开户或代理商开户，建议 MCC 结构）'
  - '- 步骤2：注册 Awin 等双周付联盟，筛选“大品牌词、允许竞价、EPC>0.01、双周付”Offer 并申请通过'
  - '- 步骤3：创建搜索广告系列，竞价品牌词/竞品词，最终网址直填联盟追踪链接'
  - '**关键性质**'
  - '- Direct Linking（直链投放）规避落地页审核与建站成本，是单人操作的关键'
  - '- Awin 双周付周期（14天回款）显著优于月付联盟，保障现金流安全'
  - '- 账户/联盟/收款（Wise/Payoneer）三位一体基建，一次搭建长期复用'
  - '**典型例子**'
  - '- 素材作者单人操作多账户，日常维护仅需监控数据、换 Offer、调预算'
  - '- 新手可复刻：买成品 Google Ads 号 + 注册 Awin + 照搬选品标准 = 即刻上手'
  - '**边界条件**'
  - '- Google Ads 账户质量参差不齐，需规避“户死户/黑号/二手户”，建议代理商开户或自养号'
  - '- Awin 审核门槛逐渐提高，需准备真实推广渠道说明（如社媒/SEO/邮件营销）'
  - '- 收款渠道（Wise/Payoneer）需提前实名、绑定银行卡、测试到账，避免赚了钱提不出来'
  sources:
  - paper: docs/202305/M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  excerpts:
  - 1，准备一个Google Ads的帐号，个人开户或者代理商开户均可。
  - 2，注册一个广告联盟的帐号，找到有大体量品牌词的广告。
  - 3，申请到广告利用Google Ads，出价他们的品牌词，但是广告链接是你自己的即可。
  - 广告联盟虽然有很多有信誉又好的广告联盟，我们一般用Biweekly支付的Awin广告联盟来说明。
  - 佣金收入：3403英镑+835欧元+369美元
- 'no': 5
  name: 极低成本出价策略 —— 用“分”买“元”的杠杆术
  points:
  - '**为什么需要这个概念？**'
  - '- CPC 是唯一可控变量，EPC 由市场决定，压低 CPC 即扩大利润空间'
  - '- 品牌词质量得分高，允许极低出价仍能获得展示（顶部位置）'
  - '- 货币单位差异提供额外套利维度（汇率杠杆）'
  - '**核心定义**'
  - '- 手动 CPC 出价策略，最高 CPC 设定为 0.01 当地货币单位'
  - '- 优先使用港币/日元/台币等弱势货币计费账户，折算美元成本再降 7-10 倍'
  - '- 关闭“优化转化/目标 CPA”等智能出价，防止系统自动抬高点击价格'
  - '**关键性质**'
  - '- 0.01 HKD ≈ 0.0013 USD，理论成本再降至少 7 倍（作者称“非常轻松”）'
  - '- 低出价不代表低流量：品牌词搜索量大、竞争少，0.01 仍能抢占大量曝光'
  - '- 成本控制红线：单日预算设定止损线（如 $20-$50/天/账户），防止异常消耗'
  - '**典型例子**'
  - '- 实盘账户日均花费 $10-$40 级别，却产出 $100+ 佣金，单日 ROI 动态维持 300%+'
  - '- 作者称“港币账户成本还可以降低至少七倍”，但未实操，属理论红利'
  - '**边界条件**'
  - '- 货币账户开户难度大（需海外实体/公司主体），个人开户通常只能开 USD/EUR 账户'
  - '- 汇率风险：若港币大幅升值，成本优势消失；需关注汇率趋势'
  - '- 极低出价可能触发“首页展示份额过低”预警，需监控展示量是否满足量级要求'
  sources:
  - paper: docs/202305/M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  excerpts:
  - 品牌词实际谷歌出价是无限接近于零，也是免费，所以只要你设置没问题，单价到0.01完全没有问题
  - 如果你了解各个国家的汇率，这个0.01是当地货币的0.01，比如港币的0.01港币成本远小于美元的0.01美元。
  - 这里面如果是用港币账户，成本还可以降低至少七倍，但是这些与这个项目是否赚钱关系不大，也没必要在本身比较低的项目成本上过度优化。
- 'no': 6
  name: Offer 筛选启发式规则 —— 只捡“肥美”果实，不碰“烂果子”
  points:
  - '**为什么需要这个概念？**'
  - '- 联盟内 Offer 成千上万，盲目申请浪费时间且易踩雷（扣量/不转化/禁止品牌词）'
  - '- 建立可量化的筛选清单，实现“筛选即止损”，提升单位时间产出比'
  - '- 将选品经验显性化，便于团队复制或后期自动化筛选'
  - '**核心定义**'
  - '- 硬指标1：品牌词月搜索量大（体量 = 流量上限 = 利润上限）'
  - '- 硬指标2：联盟后台明确允许品牌词竞价，或仅禁止自有品牌词（可竞竞品词）'
  - '- 硬指标3：EPC 显著高于 0.01 美元（建议 > $0.03，留足安全边际）'
  - '- 硬指标4：双周付/周付周期（现金流安全），拒绝月付/净30/净60 长账期'
  - '**关键性质**'
  - '- 筛选漏斗：体量筛选 → 权限筛选 → EPC 筛选 → 结算周期筛选 → 申请测试'
  - '- 竞品词作为备选：大品牌若禁自有词，转投其头部竞品词（流量精准度仅略低）'
  - '- 避坑红线：EPC 低于 $0.01、单周付/月付、明确禁止品牌词、虚拟/下载类高退单品类'
  - '**典型例子**'
  - '- 实盘三组 Offer 均为大品牌、多币种结算、EPC 隐性远高于 $0.01、双周付'
  - '- 作者拒绝透露具体 Offer 名称（“无法奉告”），印证核心资产是“筛选能力”而非“单个链接”'
  - '**边界条件**'
  - '- EPC 为历史平均值，不代表实时表现；新 Offer 无 EPC 数据需小额测试'
  - '- 商家可能随时修改推广条款（如突然禁品牌词），需建立 Offer 监控预警机制'
  - '- 季节性品牌（如税务软件、节日礼品）EPC 波动极大，非长期稳定标的'
  sources:
  - paper: docs/202305/M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  excerpts:
  - 找到有大体量品牌词的广告。
  - 国外有很多商家，允许你出价他们的品牌词，而且一定可以出价他们竞争对手的品牌词。
  - 很少见到有EPC低于0.01的广告联盟里的Offer。
  - 广告联盟虽然有很多有信誉又好的广告联盟，我们一般用Biweekly支付的Awin广告联盟来说明。
- 'no': 7
  name: 长期可行性与单人百万门槛 —— 十年长跑验证的“印钞机”
  points:
  - '**为什么需要这个概念？**'
  - '- 区分“短期漏洞/薅羊毛”与“长期商业模式”，确立投入产出比预期'
  - '- 定义项目上限：不靠运气、不靠灰产、可持续复利的单人业务天花板'
  - '- 建立信心：只要跑通流程、控制风险，百万年入非运气而是必然'
  - '**核心定义**'
  - '- 模式运行十余年，经历多轮政策收紧仍存活，属“结构性红利”而非“政策漏洞”'
  - '- 三方博弈平衡：商家需品牌流量、联盟需推广量、Google 需广告费，三方利益锁定模式存续'
  - '- 单人年净利 > 100 万 RMB 门槛：不追求极致规模、仅控制基础风险比即可达成'
  - '**关键性质**'
  - '- 反脆弱性：合规收紧反而清洗无序竞争者，提高门槛，利好专业化存量玩家'
  - '- 复利路径：账户资产（像素/历史数据/信用分）+ Offer 库 + 收款渠道 + SOP = 复利资产包'
  - '- 扩展性：同模式可横向复制至 Bing Ads、Yandex、Wise 推荐计划等同构场景'
  - '**典型例子**'
  - '- 作者亲测十年存活；Wise 推荐计划同构案例：品牌词 CPC £0.01-0.02，单笔佣金 $50，单日佣金破万英镑'
  - '- 实时后台快照 + 单日损益更新（2023.4.4）佐证“自动化印钞”非人工单次爆发'
  - '**边界条件**'
  - '- 单人操作上限受限于精力（监控账户/换 Offer/提现/汇率），规模化需组建小团队分工'
  - '- 地缘政治/制裁/支付通道断裂（如俄罗斯/伊朗相关品牌）属不可控黑天鹅风险'
  - '- 平台算法大版本更新（如 Google 引入 AI 概览/生成式搜索）可能改变品牌词流量分发逻辑'
  sources:
  - paper: docs/202305/M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
