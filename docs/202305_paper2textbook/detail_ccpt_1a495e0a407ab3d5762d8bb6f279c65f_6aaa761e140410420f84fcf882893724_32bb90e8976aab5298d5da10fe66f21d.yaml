units:
- 'no': 1
  name: 外部知识索引 —— 语雀文档链接汇总
  points:
  - '**为什么需要这个概念？**'
  - '- 素材库中存在部分仅包含外部链接、无实质文本内容的条目，需统一标识与管理'
  - '- 读者需要明确区分哪些章节可直接学习、哪些需自行跳转外部文档查阅'
  - '- 避免在教材正文中出现“空章节”导致学习体验割裂'
  - '**核心定义**'
  - '- 本单元不包含可直接教授的知识点，而是作为元数据索引存在'
  - '- 汇总素材库中所有仅含语雀文档外链、无正文内容的原始素材条目'
  - '- 为读者提供原始长文档的溯源入口，保证素材库的完整性与可追溯性'
  - '**关键性质**'
  - '- 非教学内容单元，属于教材编排层面的“导航/附录”功能模块'
  - '- 依赖外部平台（语雀）承载核心内容，链接失效即导致知识断链'
  - '- 内容不确定性高：链接标题可能与实际内容不符，需读者自行甄别'
  - '**典型例子**'
  - '- `docs/202305/20230516_043.md`：仅含链接，标题疑似为“海外平台”，指向投资/交易相关长文档'
  - '- `docs/202305/20230516_099.md`：含完整 URL `www.yuque.com/for_lazy/thfiu8/fc3rzl7ia8ury6x3`，标题“海外平台”'
  - '- `docs/202305/20230516_102.md`：仅含链接引用，标题未知，内容完全不可见'
  - '**边界条件**'
  - '- 仅适用于“素材整理/教材编排”阶段，不适用于“学员直接学习”阶段'
  - '- 无法提炼出任何可复用的方法论、模型、话术或工具 SOP'
  - '- 教材正式出版时，建议将此类条目移至“参考文献/延伸阅读”附录，不占正文章节编号'
  sources:
  - paper: docs/202305/20230516_043.md
    role: origin
  - paper: docs/202305/20230516_099.md
    role: origin
  - paper: docs/202305/20230516_102.md
    role: origin
  excerpts:
  - 该素材仅包含一个语雀文档的外部链接引用，未提供任何实质性的文本内容、核心概念、方法论、观点或案例数据，无法进行教材化提取与分析。
  - 外部链接：www.yuque.com/for_lazy/thfiu8/fc3rzl7ia8ury6x3，标题‘海外平台’，疑似包含海外投资或交易平台相关详细内容。
  - 该素材仅包含一个语雀文档的外部链接引用，未提供任何具体的文本内容、核心观点、方法论或案例数据，因此无法提取核心概念、方法、主张或发现。
