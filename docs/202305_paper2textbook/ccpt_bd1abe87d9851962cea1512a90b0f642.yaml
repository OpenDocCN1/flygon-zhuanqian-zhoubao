paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
desc: 该素材是一份面向零基础小白的 Stable Diffusion (SD) 实操教程，主打"奶奶都能听懂"的降维教学理念，跳过原理讲解直达落地操作。内容覆盖硬件配置检测、本地/云端部署、核心参数配置（大模型、提示词、LoRA、VAE、采样器等）、核心功能实战（文生图、图生图、局部重绘、ControlNet
  姿势控制/线稿上色/室内设计、高清修复）、模型获取与管理（C站使用、文件目录、模型识别）及效率工具（脚本对比、PNG Info/Tagger 反推提示词），并附带完整资源包下载链接，旨在实现"看这一篇就够"的快速入门闭环。
concepts:
- name: 大模型
  desc: SD 生成图片的基础风格决定器，不同模型对应不同画风（如真人、二次元、盲盒），是起笔前必须确定的核心资产。
  is_original: false
  excerpt:
  - 用stable diffusion可以把自己想象成一个画家，在起笔画画之前，我们要先确定我们画的是什么风格的画，是二次元动漫、三次元的现实照片、还是盲盒模型。因此，在我们确定了我们照片风格之后，我们就要去切换大模型，不同的模型就代表着不同的照片风格。
  - 假如现在我想生成一个真人AI小姐姐，那就选用chilloutmix的大模型
- name: 正面关键词
  desc: 描述期望画面包含内容的指令集，遵循"画质+主体+主体细节+人物服装+其他(背景/天气/构图)"的结构化公式，使用英文逗号分隔，支持权重语法调整关注度。
  is_original: false
  excerpt:
  - 总结一下我们写关键词的公式：画质+主体+主体细节+人物服装+其他（背景、天气、构图等）
  - 输入到SD就是这样的⬇
  - 可以加权重，那我们也可以减权重... 1.直接用括号把关键词括起来：（curly hair）... 2.（关键词:数值):（curly hair：1.3）
- name: 负面关键词
  desc: 描述期望画面排除内容的指令集（如畸形肢体、低画质、水印），用于规避常见生成缺陷，教程提供通用"万能负面词"可直接复用。
  is_original: false
  excerpt:
  - 当我们生成照片次数多了之后，渐渐的发现偶尔生成出来的照片多了几个手指，甚至会多了一只手... 那就是告诉SD，我不要那样的照片！
  - (worst quality:2), (low quality:2), (normal quality:2), lowres, ((monochrome)),
    ((grayscale)), bad anatomy,DeepNegative...
- name: LoRA
  desc: 轻量级微调模型，用于固定特定特征（人物长相、动作、风格），支持叠加使用与权重调节（建议 ≤1），需与大模型画风匹配以达到最佳效果。
  is_original: false
  excerpt:
  - 简单来说，Lora可以固定我们照片的特征：人物特征、动作特征、还有照片风格
  - 我们的Lora是可以叠加使用的... 每个Lora后面都有数字，这是用来调整这个Lora的权重的，正常情况下是1，我们一般只会去降低权重
- name: 随机数种子
  desc: 控制生成图片底层初始噪声模式的数值，决定画面基础轮廓与构图；值为 -1 时随机，固定 Seed 并配合其余参数一致可复现同一张图。
  is_original: false
  excerpt:
  - 随机数种子控制的是最底层的形状，就相当于我们画画最开始的线稿... 当随机数为“-1”的时候，SD就会随机给你的照片生成一个种子
  - 只有当我们所有参数，包括随机数种子跟别人的照片都一样时，我们才能生成跟别人差不多一样的照片。
- name: 重绘幅度
  desc: 图生图模式下控制原图保留与新生成内容比例的参数（0-1），值越大变化越大；二次元转绘建议 0.6-0.8，平衡相似度与风格迁移。
  is_original: false
  excerpt:
  - 重绘幅度的意思就是你要改变你原来照片的程度... 当你的重绘幅度拉到1，这时候就相当于要完全改变你的照片
  - 这里如果大家是要生成二次元照片的，把重绘幅度拉到0.6~0.8就差不多了
- name: 局部重绘
  desc: 在图生图中通过蒙版涂抹指定区域（如衣服、脸部），仅对该区域按提示词重新生成，保持其余画面不变，实现换装、换脸等精细编辑。
  is_original: false
  excerpt:
  - 这里用到的是图生图中局部重绘的功能... 点击右边的画笔可以调整大小，把人物衣服部分全部涂黑... 接着输入关键词... 点击生成就可以啦！
- name: 涂鸦重绘
  desc: 局部重绘的进阶形式，允许用户在蒙版区域手绘颜色草稿（如指定袖子蓝色、衣服粉色、花纹黄色），结合提示词引导生成，实现像素级颜色可控。
  is_original: false
  excerpt:
  - 那我们就可以用到一个新的功能——“涂鸦重绘”... 在右边调整画笔大小和颜色，然后就可以自己设计衣服的颜色啦
- name: ControlNet
  desc: 结构控制神经网络，通过预处理器提取参考图结构信息（OpenPose 骨骼、Canny 边缘、M-LSD 线条等），强制指导生成过程保持构图/姿势/线稿一致性。
  is_original: false
  excerpt:
  - 简单来说就是可以用它控制照片的线条，比如人物的动作、建筑物的线条等
  - 在“预处理器”和“模型”里选择“openpose”，这就是用来让计算机识别人物姿势的
  - 在模型里面选择“canny”的模型... 预处理器和模型都选“msld”，这是用来计算房屋线条的
- name: VAE
  desc: 变分自编码器，在 SD 中充当"滤镜/调色板"作用，修正模型自带色彩偏灰/饱和度不足问题，教程推荐通用 vae-ft-mse-840000。
  is_original: false
  excerpt:
  - 只要知道VAE的作用就是加滤镜和微调照片... 没加VAE的照片是灰蒙蒙的
  - 下面这个就是我比较常用的VAE
- name: 高分辨率修复
  desc: 生成阶段分两步：先低分辨率出图，再放大并细节重绘，解决大分辨率直接生成易崩坏、显存不足的问题，需权衡显存开销。
  is_original: false
  excerpt:
  - 高分辨率修复：电脑配置好就可以用；电脑配置稍微差点的别开，否则照片无法生成
- name: 后期处理/超分辨率
  desc: 针对已有图片的画质增强流程：动漫图用 R-ESRGAN 4x+ Anime6B，实物/真人图用 R-ESRGAN 4x+ 或 GFPGAN (人脸专用)，不改变原图语义。
  is_original: false
  excerpt:
  - 修复二次元的照片就选“R-ESRGAN 4x+Anime68”，其他实物照片就选“R-ESRGAN 4x+”... 这个是专门用来修复人脸的，把参数拉满（1）就行
- name: PNG Info / Tagger 反推
  desc: 从 PNG 图片元数据或视觉模型反推提示词、参数、模型信息的两种手段：PNG Info 仅限 SD 原生导出图片，Tagger 适用于任意图片进行标签预测。
  is_original: false
  excerpt:
  - 第一个就是“PNG图片信息”... 把照片导进去，右边就会自动弹出照片的信息
  - 有时候我们把照片导入进去之后，发现右边并没有照片生成的信息... 那我们就可以用后面这个“标签器（Tagger”）
methods:
- name: __overview__
  desc: 遵循"硬件排查 -> 环境部署 -> 核心三要素(模型/提示词/LoRA) -> 进阶控制(ControlNet/重绘) -> 画质增强 -> 资源获取与复现"的完整实操链路，以结构化模板、通用参数预设、可复用资源包降低认知负荷。
  excerpt:
  - 从手把手安装部署，到界面功能讲解，再到实战案例制作，到下载优质模型，每一步都有详细教程，并且用一个又一个的例子展示，让大家不止是枯燥地看，而是看完立刻也能做出一样的图片出来
  - 这篇文章就会带大家通过一个个案例，实际上手操作生成各种照片
- name: 本地一键部署法
  desc: 基于秋叶整合包的解压即用方案：下载主包+依赖包 -> 解压至非 C 盘 -> 安装依赖 -> 启动器配置显存优化(按专用 GPU 内存对齐) ->
    一键启动 -> 报错自动修复。
  excerpt:
  - 这里我们用到的是B站秋叶分享的整合包，小白直接下载整合包可以避免很多困难
  - 选择解压到D盘或者E盘，小心C盘被占满！！
  - 在显存优化里，根据自己电脑的显存选择（就是上面查看的专用GPU内存），自己电脑是多少就选多少
  - 如果在上面的页面出现了报错... 点击“疑难解答”，再点击右边的“开始扫描” 最后点击“修复”按钮
- name: 云端备选部署法
  desc: 针对低配/非 N 卡/ Mac 用户，使用青椒云等 GPU 云平台：注册实名 -> 新增 AIGC 尝鲜桌面 -> 启动器一键启动 SD -> 用后关机止损。
  excerpt:
  - 云平台就相当于我们远程控制别人配置更好的电脑，用别人电脑上的SD生成照片
  - 点击新增云桌面，想玩Stable Diffusion可以选“AIGC尝鲜”... 点击“开机”按钮... 点击“进入桌面”... 点击“A启动器.exe”...
    点击右下角的“一键启动”
  - 用完云平台之后，记得关机噢，不然会持续计费
- name: 提示词结构化模板法
  desc: 将正向提示词拆解为五段式模板：[质量词] + [主体] + [主体细节] + [服饰配饰] + [环境/构图/光影]，每段换行、以英文逗号结尾，配合权重语法
    (词:权重) 微调。
  excerpt:
  - 总结一下我们写关键词的公式：画质+主体+主体细节+人物服装+其他（背景、天气、构图等）
  - 推荐大家像我这样一行一行分开类型去写关键词，这样后面想要改词更好找
  - 给关键词加权重，加权重的方法有两种：1.直接用括号把关键词括起来... 2.（关键词:数值）
- name: ControlNet 多模态控制法
  desc: 统一入口（启用+上传参考图+预览预处理）下，通过切换预处理器/模型对实现三大核心场景：OpenPose 姿势迁移、Canny 线稿上色/保边、M-LSD
    室内结构保持。
  excerpt:
  - 1.点击空白的地方，上传我们需要指定的姿势的照片 2.点击“启用” 3.在“预处理器”和“模型”里选择“openpose”... 点击这个“预览预处理结果”
  - 3.点击“反转输出颜色” 4.在模型里面选择“canny”的模型
  - 3.预处理器和模型都选“msld”，这是用来计算房屋线条的
- name: 脚本矩阵对比法
  desc: 利用 SD 自带脚本功能自动化参数搜索：提示词矩阵对比单词增删效果 (关键词|对比词)；X/Y/Z 图表网格化对比采样器×步数等多维参数组合，直观筛选最优设置。
  excerpt:
  - 那我们就要用到最下面“脚本”里的“提示词矩阵”... 书写的格式：把需要进行对比的关键词放在最后，用“|”把关键词和前面的关键词分隔开
  - 这里用到的就是脚本里的“X/Y/Z图表”... 在X轴类型里面选择“迭代步数”... 在Y轴类型里面选择“采用器”... 点击“生成” 就会生成这么一张大图
- name: 模型全生命周期管理法
  desc: 覆盖获取(C站筛选/图片反推下载) -> 存放(按类型对应 models/Stable-diffusion, models/Lora, models/VAE
    目录) -> 鉴别(秋叶解析工具拖拽识别类型) 的标准化流程。
  excerpt:
  - 点击右上角的筛选按钮，在框框里面找到自己需要的模型类型 Checkpoint=大模型 LoRA=Lora... 点击右边的“Download”
  - 1.大模型... 2.Lora... 3.VAE... 这里的SD根目录就是大家在下载时，存放SD的那个文件夹
  - 把模型拖动到空白处... 接着就会自动弹出模型的信息，在模型种类里面就可以看到是什么模型啦！
theorems:
- name: 原理前置即劝退论
  desc: 教学 SD 时若强制前置扩散模型数学原理（U-Net、VAE、CLIP 交互等），会显著提升新手认知门槛导致流失；实操优先、原理按需、模板化降维是普及教学的最优路径。
  excerpt:
  - 很多人想学习stable diffusion，上网一搜，大多数教程都先告诉你SD的原理是什么... 但偏偏就是这一步就劝退了很多人继续学习
  - 大多数的我们只是要能够熟练使用SD，而不是要深入研究它... 我们的目的就是花更少的时间快速入门Stable Diffusion
- name: 模型-画风强绑定论
  desc: 大模型决定生成图片的基因画风（真人/二次元/3D等），LoRA 必须与大模型画风域对齐（真人模型配真人 LoRA，二次元模型配二次元 LoRA），跨域使用会导致画面崩坏或风格割裂。
  excerpt:
  - 你想生成真人模特，你在最开始用了真人的大模型，对应的我们的Lora也要选用真人模特，这样出来的照片效果才更好！
- name: 参数复现三要素论
  desc: 完整复现他人生成结果需同时满足：相同大模型、相同 LoRA 组合及权重、相同 Seed，缺一不可；PNG Info/Tagger 可辅助获取前两者，Seed
    需从图片元数据读取。
  excerpt:
  - 只有当我们所有参数，包括随机数种子跟别人的照片都一样时，我们才能生成跟别人差不多一样的照片。
  - 把全部信息粘贴到关键词的文本框中... 点击“生成”按钮下面的第一个小按钮，SD就会自动帮你把信息分配到合适的地方，用上一样的效果和模型... 要注意的就是，大模型是需要我们手动去换的！
- name: 重绘幅度守恒论
  desc: 图生图中重绘幅度与原图保真度呈负相关：幅度 <0.5 微调细节，0.6-0.8 风格迁移保结构（二次元/换装黄金区间），>0.9 近似文生图；需根据任务类型定点选择。
  excerpt:
  - 当你的重绘幅度拉到1，这时候就相当于要完全改变你的照片，生成出来的照片就跟原先的照片毫无关系了
  - 这里如果大家是要生成二次元照片的，把重绘幅度拉到0.6~0.8就差不多了
- name: 显存-分辨率权衡论
  desc: 基础分辨率 512×512/512×768 为显存友好型基准；高分辨率修复/超分后处理为显存不足时的替代方案；盲目追求 1024/2048 直出生成会导致
    OOM 或结构崩坏。
  excerpt:
  - 一般情况下：生成正方形的照片：宽度512*高度512，生成长方形的照片：宽度512*高度768
  - 电脑配置稍微差点的朋友们，千万别看网上设置成什么1024、2048，我们电脑跑不动哒！
  - 高分辨率修复：电脑配置好就可以用；电脑配置稍微差点的别开，否则照片无法生成
findings:
- name: 秋叶整合包部署成功率高
  desc: '[evidence] 素材实测记录：遵循「解压非C盘→安装依赖→启动器显存对齐→一键启动→报错自动修复」流程，可在满足硬件门槛（Win10/11、N卡、≥8G内存、≥4G
    VRAM）的消费级电脑上零报错启动 WebUI。'
  excerpt:
  - 双击启动器，等待更新... 点击左边第二个“高级选项”，在显存优化里，根据自己电脑的显存选择... 回到第一个一键启动，点击右下角的一键启动... 出现这个代码页面不用管，等一下就行了！SD的主界面会自动在网页上弹出来
  - 如果在上面的页面出现了报错，可以回到最开始的界面，在左边点击“疑难解答”，再点击右边的“开始扫描”，最后点击“修复”按钮
- name: 通用负面词有效抑制常见缺陷
  desc: '[evidence] 素材实测：使用文中提供的包含 worst quality、bad anatomy、bad hands、extra fingers、watermark
    等 60+ 标签的负面词模板，可显著降低多指、少指、畸形肢体、画质下降、水印残留等高频生成故障率。'
  excerpt:
  - 新手小白可以直接抄！（文章最后有关键词链接，里面可以直接复制）
  - (worst quality:2), (low quality:2), (normal quality:2), lowres, ((monochrome)),
    ((grayscale)), bad anatomy,DeepNegative, skin spots, acnes, skin blemishes,(fat:1.2),facing
    away, looking away,tilted head, lowres,bad anatomy,bad hands, missing fingers,extra
    digit, fewer digits,bad feet,poorly drawn hands,poorly drawn face,mutation,deformed,extra
    fingers,extra limbs,extra arms,extra legs,malformed limbs,fused fingers,too many
    fingers,long neck,cross-eyed,mutated hands,polar lowres,bad body,bad proportions,gross
    proportions,missing arms,missing legs,extra digit, extra arms, extra leg, extra
    foot,teethcroppe,signature, watermark, username,blurry,cropped,jpeg artifacts,text,error,
- name: ControlNet OpenPose 姿势迁移保真度高
  desc: '[evidence] 素材实测案例：使用 OpenPose 预处理器提取参考图骨骼关键点，配合 Canny/Lineart 等辅助可选，生成图在保持目标人物面部特征（由大模型+LoRA决定）的同时，精确复现参考图姿态（站姿、手势、坐姿），实现
    "人脸不变、动作指定"。'
  excerpt:
  - 比如，我现在想让左边照片的小姐姐摆出右边小姐姐的姿势,得到最右边的一张照片
  - 在“预处理器”和“模型”里选择“openpose”，这就是用来让计算机识别人物姿势的... 点击这个“预览预处理结果”... 最后点击生成照片... 这样我们一张指定姿势的美女小姐姐就生成啦！
- name: Canny 模型线稿上色保边界精准
  desc: '[evidence] 素材实测案例：上传纯线稿图，开启 "反转输出颜色"(白底黑线转黑底白线)，选用 Canny 模型，配合质量词+主体描述提示词，生成结果严格遵循线稿轮廓边界进行着色，细节丰富且无越界渗色。'
  excerpt:
  - 点击“反转输出颜色”，4.在模型里面选择“canny”的模型... 关键词：最高质量，大师杰作等... 1可爱女孩，五官精致，精致眼睛和嘴巴，银色长发，白皙的皮肤，水汪汪的大眼睛
  - 就这样不管再复杂的线稿，在SD里面都可以很快速的上好颜色
- name: M-LSD 室内结构保持重设计可行
  desc: '[evidence] 素材实测案例：上传室内实拍图，选用 M-LSD 预处理器/模型提取几何线条，切换写实大模型输入风格关键词（如"日式风格"、"现代简约")，生成结果在保持原房间墙面、门窗、梁柱结构不变的前提下，实现家具摆放、材质纹理、色调氛围的整体风格化重设计。'
  excerpt:
  - 预处理器和模型都选“msld”，这是用来计算房屋线条的... 切换一个现实照片的大模型... 关键词：一个客厅
  - 这样出来的照片既保留了原来房子的构造，又可以看到新的房屋风格！
- name: GFPGAN 真人人脸修复专用性强
  desc: '[evidence] 素材实测对比：后期处理中，针对真人照片/表情包，设置 Upscaler=None、GFPGAN 强度=1，可在不放大分辨率前提下显著恢复面部清晰度、修复压缩伪影，但非人脸区域（背景、衣物、发丝）模糊度不改善，证实其为人脸域专用增强器。'
  excerpt:
  - 这边放大器选择“无（None）”... 再往下看到这个“GFPGAN强度”，这个是专门用来修复人脸的，把参数拉满（1）就行
  - 这样我们的人脸就修复了，但是也只能修复脸的部分，除了脸其他的地方还是比较糊。
- name: R-ESRGAN 4x+ Anime6B 动漫超分最优
  desc: '[evidence] 素材实测结论：后期处理超分模型横向对比中，R-ESRGAN 4x+ Anime6B 对二次元/动漫图像的线条锐化、色块平滑、噪点去除效果优于
    RealESRGAN 4x+、SwinIR 等通用模型，为动漫图修复首选。'
  excerpt:
  - 修复二次元的照片就选“R-ESRGAN 4x+Anime68”，其他实物照片就选“R-ESRGAN 4x+”，其他放大器出来的效果都没有这两个好
- name: 脚本矩阵法可量化参数边际收益
  desc: '[evidence] 素材实测记录：使用 X/Y/Z 图表对比 Euler a/DPM++ 2M Karras/DDIM 三采样器在 20/25/30
    步下的出图质量，直观验证 "25 步后质量提升边际递减、不同采样器 25 步趋同" 结论，指导低配用户定参 25 步+高速采样器。'
  excerpt:
  - 在X轴类型里面选择“迭代步数”，右边的X轴值就输入需要进行比较的步数... 在Y轴类型里面选择“采用器”... 点击“生成” 就会生成这么一张大图
  - 我们就可以看到在不同的采用方法下，迭代步数为25的时候，生成出来的照片都差不多，这样比较下来，我们就可以选择自己更喜欢的采样方法和迭代步数了
- name: C站图片反推复现成功率依赖模型本地化
  desc: '[evidence] 素材实测流程：C 站图片详情页 Copy Data → SD 粘贴 → 点击分配按钮 → 手动切换大模型 → 生成，可得 "几乎一样"
    的结果；但文中明确注明 "电脑网络配置的不同，出来的照片有细微差别"，且前提是本地已下载完全一致的 Checkpoint 与 LoRA 文件。'
  excerpt:
  - 点击最下面的“Copy...Data”就可以复制图片的所有信息... 回到SD，粘贴到关键词的文本框，点击右边的按钮，这些信息就会自动分配... 要注意的就是，大模型是需要我们手动去换的！
  - 这样我们就可以生成出跟大神几乎一样的照片了！（电脑网络配置的不同，出来的照片有细微差别）
