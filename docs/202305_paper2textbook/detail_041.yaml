- │   │   ├── 两性号（女性热点/高粘性带货）
- │   │   ├── IP号（人设赚钱/高客单高信任）
- │   │   ├── 情绪号（情绪宣泄/内容为王）
- │   │   └── 成长号（思维认知/高价值高复购）
