  - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
    role: improve
  excerpts:
  - 资料是别人的，产品必须是自己的，如果没有，那就去打磨，但是不能不做！
  - 单纯的卖资料...这是最无脑的一种做法！资料+咨询...基本上对一个咨询客户也会有两个收入...后期你会有更大的这种产品去承接！
  - 要整理输入，也要重构输出，甚至通过资料整理培养自己某一方面的能力，打造自己的商业盈利系统！
  - 当用户在你这儿产生消费，产生知识付费之后，你们之间已经建立了一种潜意识的信任！
  - 实操，资料整理日均引私域 180+用户
  - 头条号...相对这个引流来说还是比较宽松的...私信会自动把微信号发给他，他加你的微信之后，安排一个助理去回复
  - 你一定要提前准备好，至少两个微信号...避免被加好友频繁导致用户加不进来...避免收款频繁导致钱到不了账
  - 基本上商业咨询费用我都是简单的收个200，结束后目前最低的都会给我包个88——120的红包...深度连接之后，后期你会有更大的这种产品去承接！
  - 4天投入日均2小时...私域引流700+用户（日均180+），资料付费转化率约60%，咨询转化30%且客单价200+红包88-120
  - 考虑三个要素：第1个，是不是你喜欢、擅长且未来要做的事儿当中的一部分...第2个，这个资料所带来的价值...第3个，通过你选择的资料整理，哪些新媒体渠道可以发挥的作用最大
