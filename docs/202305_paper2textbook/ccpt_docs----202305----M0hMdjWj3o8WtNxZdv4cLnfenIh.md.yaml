paper: docs/202305/M0hMdjWj3o8WtNxZdv4cLnfenIh.md
desc: 该素材介绍了一种名为“Mediabuy Brand Bid”（媒体购买品牌词竞价）的单人出海赚美元项目，核心逻辑是利用 Google Ads 搜索广告竞价商家品牌词（或竞品词），将流量直接导向联盟营销链接赚取佣金差价。素材通过三组真实账户数据验证了高
  ROI（359%-496%），详细阐述了项目操作的三步走原理（开户、选品、竞价品牌词）、低成本核心机制（品牌词 CPC 接近 0.01）、合规性边界（部分验收商家允许/竞品词普遍允许）及长期可行性。
concepts:
- name: Mediabuy Brand Bid (媒体购买品牌词竞价)
  desc: 素材核心提出的项目模式，指通过付费搜索广告竞价广告主的品牌关键词，直接跳转至联盟营销追踪链接，利用极低的品牌词点击单价与联盟佣金（EPC）之间的巨大差价获利。
  is_original: true
  excerpt:
  - Mediabuy Brand Bid
  - 通俗的理解就是付费流量购买，通过付费的方式购买流量来推广商家的链接，赚取佣金和流量费用支出中的利差。
  - 申请到广告利用Google Ads，出价他们的品牌词，但是广告链接是你自己的即可。
- name: Brand Bidding (品牌词竞价)
  desc: 该项目的核心操作手法，指在 Google Ads 中针对广告主自身的品牌名称或商标词进行竞价。素材强调品牌词因相关性极高、竞争极小，实际 CPC 可低至
    0.01 当地货币单位，是利润来源的关键。
  is_original: false
  excerpt:
  - 找到有大体量品牌词的广告。
  - 申请到广告利用Google Ads，出价他们的品牌词
  - 因为你是出价品牌词，品牌词实际谷歌出价是无限接近于零，也是免费，所以只要你设置没问题，单价到0.01完全没有问题
- name: CPC/EPC Arbitrage (CPC与EPC套利)
  desc: 项目盈利的底层数学模型：CPC (Cost Per Click) 为广告点击成本，EPC (Earnings Per Click) 为每次点击收益。素材指出品牌词
    CPC 可压至 0.01 以下，而联盟 Offer EPC 很少低于 0.01，因此只要 CPC < EPC 即可稳定盈利。
  is_original: true
  excerpt:
  - 当你的CPC本身是0.01的单价的时候，基本上任何产品都会赚钱，很少见到有EPC低于0.01的广告联盟里的Offer。
  - 利润：5715美元 – 1220美元 = 4495美元；回报率：ROI = 4495 ÷ 1220 = 368%
- name: Biweekly Payment / Awin Network (双周支付/万里汇网盟)
  desc: 素材指定的推荐联盟网络环节，Awin (Affiliate Window) 因其双周支付周期、信誉好、拥有大量大品牌广告主且允许品牌词竞价，被作为项目执行的标准基础设施。
  is_original: false
  excerpt:
  - 广告联盟虽然有很多有信誉又好的广告联盟，我们一般用Biweekly支付的Awin广告联盟来说明。
  - 佣金收入：3403英镑+835欧元+369美元
- name: Direct Linking (直接链接/直链投放)
  desc: 广告落地页策略，指 Google 广告的最终目标 URL 直接填写联盟营销追踪链接，无需自建落地页，降低了技术门槛和审核风险。
  is_original: false
  excerpt:
  - 申请到广告利用Google Ads，出价他们的品牌词，但是广告链接是你自己的即可。
methods:
- name: __overview__
  desc: Mediabuy Brand Bid 项目的标准化三步执行流程：1. 准备 Google Ads 账户（个人/代理开户）；2. 注册 Awin 等联盟账户，筛选大体量品牌词
    Offer 并申请通过；3. 在 Google Ads 中创建搜索广告活动，竞价品牌词/竞品词，广告链接直接使用联盟追踪链接。
  excerpt:
  - 1，准备一个Google Ads的帐号，个人开户或者代理商开户均可。
  - 2，注册一个广告联盟的帐号，找到有大体量品牌词的广告。
  - 3，申请到广告利用Google Ads，出价他们的品牌词，但是广告链接是你自己的即可。
- name: Low CPC Bidding Strategy (极低成本出价策略)
  desc: 利用品牌词质量得分高、竞争低的特性，将最高 CPC 出价设定在极低水平（如 0.01 当地货币），甚至利用港币等弱势货币账户进一步压低美元成本，实现流量成本最小化。
  excerpt:
  - 品牌词实际谷歌出价是无限接近于零，也是免费，所以只要你设置没问题，单价到0.01完全没有问题
  - 如果你了解各个国家的汇率，这个0.01是当地货币的0.01，比如港币的0.01港币成本远小于美元的0.01美元。
  - 这里面如果是用港币账户，成本还可以降低至少七倍
- name: Offer Selection Heuristics (Offer 筛选启发式规则)
  desc: 素材隐含的选品标准：优先选择拥有“大体量品牌词”、允许联盟竞价品牌词、EPC 显著高于 0.01 美元、且属于双周支付周期（现金流安全）的 Offer。
  excerpt:
  - 找到有大体量品牌词的广告。
  - 国外有很多商家，允许你出价他们的品牌词，而且一定可以出价他们竞争对手的品牌词。
  - 很少见到有EPC低于0.01的广告联盟里的Offer。
theorems:
- name: Brand Keyword Near-Zero Cost Theorem (品牌词近零成本定理)
  desc: 核心主张：在 Google Ads 中竞价广告主自身的品牌词，由于极高的相关性（质量得分满分/极高）且通常缺乏竞争对手竞价，实际点击成本 (CPC)
    可无限接近于 0（实操中稳定在 0.01 当地货币单位），这是项目高利润的物理基础。
  excerpt:
  - 因为你是出价品牌词，品牌词实际谷歌出价是无限接近于零，也是免费，所以只要你设置没问题，单价到0.01完全没有问题
- name: Merchant Brand Bidding Permission Spectrum (商家品牌词授权光谱)
  desc: 核心主张：并非所有商家都禁止品牌词竞价。存在显性允许（商家条款许可）、默许（不管）、仅禁止自有品牌词但允许竞品词三种层级。项目可行性建立在“总能找到允许竞价的大品牌
    Offer”这一市场现实之上。
  excerpt:
  - 国外有很多商家，允许你出价他们的品牌词，而且一定可以出价他们竞争对手的品牌词。
  - 此方法不是违规的吗？这句话对，也不对，
- name: Long-term Viability Claim (长期可行性断言)
  desc: 核心主张：该模式已运行十余年，非短期漏洞。虽受合规团队收紧影响，但只要商家需要品牌流量、联盟需要推广量、Google 需要广告收入，三方博弈下的平衡点将长期存在。
  excerpt:
  - 这个项目可以做多久？我们从十几年前就这样玩，只是某些广告主以及广告联盟的合规团队要求比较严格而已。
- name: Single Operator Million CNY Annual Profit Threshold (单人百万年收入门槛)
  desc: 核心主张：在不追求极致规模、仅控制基本风险比的前提下，单人操作该项目年净利润突破 100 万人民币“非常轻松”，定义了项目的上限与门槛。
  excerpt:
  - 这个项目可以赚多少钱？如果不追求极致，控制一个风险比，一年一百万人民币以上非常轻松。
findings:
- name: Account Group 1 Profit Evidence (账户组1盈利实证)
  desc: '[evidence] 素材提供的完整闭环数据：Awin 联盟后台佣金 5715 美元（含多币种汇总）对应 Google MCC 后台广告花费 1220
    美元，净利润 4495 美元，ROI 368%。数据包含具体货币明细及汇率换算说明，支撑项目高盈利能力的主张。'
  excerpt:
  - 佣金收入：3403英镑+835欧元+369美元；汇率划算后，合计佣金收入：5715美元；
  - 广告成本：1220美元；
  - 利润：5715美元 – 1220美元 = 4495美元；回报率：ROI = 4495 ÷ 1220 = 368%；
- name: Account Group 2 Profit Evidence (账户组2盈利实证)
  desc: '[evidence] 第二组验证数据：Awin 佣金 7218 美元，Google Ads 花费 1210 美元，净利润 6008 美元，ROI
    高达 496%。进一步佐证了模式的可复制性和高收益率。'
  excerpt:
  - 佣金收入：4913英镑+685欧元+67美元；汇率换算后，合计佣收入：7218美元；
  - 广告成本：1210美元；
  - 利润：7218美元 – 1210美元 = 6008美元；回报率：ROI = 6008 ÷ 1210 = 496%；
- name: Account Group 3 Profit Evidence (账户组3盈利实证)
  desc: '[evidence] 第三组验证数据：Awin 佣金 3988 美元，Google Ads 花费 867 美元，净利润 3121 美元，ROI 359%。三组数据
    ROI 均在 350%+，波动范围合理，增强了证据的统计显著性。'
  excerpt:
  - 佣金收入：3031英镑+37美元；汇率换算后，合计佣收入：3988美元；
  - 广告成本：867美元；
  - 利润：3988美元 – 867美元 = 3121美元；回报率：ROI = 3121 ÷ 867 = 359%；
- name: Real-time Dashboard Snapshot (实时后台快照佐证)
  desc: '[evidence] 素材附带 Google Ads 后台实时数据截图（两张），显示当日花费与转化价值对比，直观印证“Google Ads 自动帮你赚钱”的自动化运行状态，而非人工干预的一次性爆发。'
  excerpt:
  - 截取我的两个Google Ads的帐号当天情况：
  - 至于跑什么广告联盟里的什么Offer这里无法奉告。
- name: Single Day P&L Update (单日损益更新佐证)
  desc: '[evidence] 2023年4月4日更新的单日数据截图，展示单个 Google Ads 账户当日收入远超成本，且再次强调 CPC 0.01 条件下“任何产品都会赚钱”的边际安全性。'
  excerpt:
  - 2023年4月4日更新，还是稍微奉告，免得一些人不理解，当日收入，成本是其中上面一个Google Ads的：
  - 当你的CPC本身是0.01的单价的时候，基本上任何产品都会赚钱
- name: HKD Account Cost Advantage Claim (港币账户成本优势宣称)
  desc: '[claim] 作者宣称使用港币计费的 Google Ads 账户可将成本再降低至少 7 倍（因 0.01 HKD ≈ 0.0013 USD），但素材未提供港币账户的实际投放数据对比，属于理论推演而非实证发现。'
  excerpt:
  - 这里面如果是用港币账户，成本还可以降低至少七倍，但是这些与这个项目是否赚钱关系不大，也没必要在本身比较低的项目成本上过度优化。
