- 'no': 1
  name: 投资择时体系 —— 用单一核心指标穿越牛熊周期
  desc: 本章建立一套可复用的A股择时框架：摒弃宏观预测与情绪博弈，仅凭「股债性价比」这一锚定指标，结合技术趋势确认拐点，区分系统性与结构性行情，指导普通投资者仅在确定性最高的系统性底部重仓，其余时间小仓位生存。
  nodes:
  - 'no': 1
    name: 择时的本质：非预测，乃性价比轮动
    desc: 揭示择时不是猜顶底，而是基于股票长期风险溢价逻辑，在股债性价比极端区间进行大类资产配置轮动。
    role: motivation
    src:
    - paper: docs/202305/20230516_045.md
  - 'no': 2
    name: 核心锚定指标：股债性价比的定义与计算
    desc: 定义沪深300股债性价比 = (1/PE_TTM) / 十年国债收益率，长期在1.5-3.0区间波动，>3.0为买入区，<1.5为卖出区。
    role: definition
    src:
    - paper: docs/202305/20230516_045.md
  - 'no': 3
    name: 拐点确认辅助工具：技术分析仅用于高位验证
    desc: 技术分析（均线趋势）不预测，仅在估值已达极端区（接近1.5）时确认趋势反转（跌破支撑），解决“具体拐点数值不可知”问题。
    role: method
    src:
    - paper: docs/202305/20230516_045.md
  - 'no': 4
    name: 行情分类识别：系统性底部 vs 结构性底部
    desc: 用四大风格象限估值一致性判断：四风格均便宜=系统性底部（买什么都赚，适合普通人重仓）；风格分化=结构性底部（仅适合专业选手选品）。
    role: method
    src:
    - paper: docs/202305/20230516_045.md
  - 'no': 5
    name: 三大干扰因子清单：宏观、事件、情绪全忽略
    desc: 列举并论证为何突发事件/地缘、财政货币宏观数据、投资者情绪观察均不应作为择时依据，远期影响已定价于无风险利率。
    role: limitation
    src:
    - paper: docs/202305/20230516_045.md
  - 'no': 6
    name: 普通投资者生存法则：仅参与系统性行情
    desc: 历史年化<25%者，仅在股债性价比>3.0且四风格全便宜时重仓宽基/优质主动基金，其余时间小仓位或空仓，博取确定性贝塔收益。
    role: method
    src:
    - paper: docs/202305/20230516_045.md
  - 'no': 7
    name: 实战复盘证据：十年三次逃顶两次抄底
    desc: 作者实盘验证：2015/2018/2021成功逃顶，2015/2018/2019抄底切换赛道，择时准确率100%，连续十年正收益。
    role: experiment
    src:
    - paper: docs/202305/20230516_045.md
- 'no': 2
  name: 基金选品体系 —— 好公司、好经理、好体系的“三好”筛选法
  desc: 本章构建主动权益基金筛选的标准化流程：公司维度六大指标、经理维度三大硬指标、体系维度核心铁律（只买<50亿小规模），利用规模优势获取换仓灵活性、打新收益及迷你股超额收益。
  nodes:
  - 'no': 1
    name: 为什么必须买小规模基金：容量约束与超额收益源泉
    desc: 小规模基金（<50亿，最优<20亿）具备换仓摩擦成本低、享受打新超额收益、可参与迷你股交易三大结构性优势；大规模必然面临收益递减。
    role: motivation
    src:
    - paper: docs/202305/20230516_045.md
  - 'no': 2
    name: Step 1：筛选头部基金公司——六大维度定性评估
    desc: 管规模大、高管投研出身、人才梯队完善、口碑好、价值观长期主义、经理收入高；作者实测分层：强（景顺/易方达等）vs 大而不强（华夏/南方等）。
    role: method
    src:
    - paper: docs/202305/20230516_045.md
    - paper: docs/202305/20230516_045.md
  - 'no': 3
    name: Step 2：公司内部筛选好经理——三大硬指标
    desc: 长期业绩居前、投决委成员身份（核心决策层）、金牛奖得主（筛掉高波动赌风格经理，如蔡嵩松无金牛奖）。
    role: method
    src:
    - paper: docs/202305/20230516_045.md
    - paper: docs/202305/20230516_045.md
  - 'no': 4
    name: Step 3：好体系否决权——规模>50亿一律不买
    desc: 将规模上限设为核心否决项，而非参考项；最优标的<20亿，利用小规模结构性优势跑赢大盘。
    role: method
    src:
    - paper: docs/202305/20230516_045.md
- 'no': 3
  name: Web3 实战认知与方法论 —— 从摒弃偏见到落袋为安的完整闭环
  desc: 本章以 VMPX BRC20 Mint 实战为主线，拆解 Web3 高不确定性环境下的生存法则：认知破偏见、接入 Alpha 信息源、小步试错迭代、动态
    Gas 博弈、极端环境身心管理、CEX 上线前止盈纪律。
  nodes:
  - 'no': 1
    name: 核心认知跃迁：抛弃偏见去机会多的地方
    desc: 偏见是捕捉新赛道红利的最大拦路虎；必须强迫自己理解新事物（如 BRC20），前往流动性和热度最高的赛道试错，认知升级先于行动致胜。
    role: motivation
    src:
    - paper: docs/202305/20230516_044.md
    - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
  - 'no': 2
    name: 运气表面积与 Alpha 信息源：主动增加遭遇好运的概率
    desc: 保持好奇心扩大运气表面积；接入高质量社群（如七爷社群）获取已筛选的 Alpha 情报，利用他人筛选体系小步试错，机会总给行动者。
    role: method
    src:
    - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
  - 'no': 3
    name: 把鞋弄脏：亲身实操获取隐性知识
    desc: 岸边观望永远学不会；只有下场承担风险（忍受拥堵、卡顿、Gas波动），才能获得 Gas 拉满策略、Mint 进度与网络拥堵关系等隐性知识。
    role: method
    src:
    - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
  - 'no': 4
    name: BRC20 Mint 标准作业程序 (SOP) 与动态 Gas 博弈模型
    desc: 全流程 10 步：钱包准备→BTC获取与备用提币方案→平台选择→资料整理与 5-6 遍模拟→小额实战测试 Gas 底价→核心参数设定→开抢多渠道监控→拥堵期动态调
      Gas→尾部窗口期提高 Gas 锁定区块→打包确认转移。实战发现 Gas 存在动态生死线：拥堵峰值期 550 仍卡死，进度 99.6% 网络缓解时 800
      成功上车。
    role: method
    src:
    - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
  - 'no': 5
    name: 谣言套利与信息验证纪律：验证猜想、知行合一、不盲目追涨
    desc: 面对‘技术破解代币名称’谣言，通过链上数据观察（价格 0.1→0.02→0.08）和创始人辟谣验证虚假性；因平台权限限制（Unisat积分/OG
      PASS）未参与套利，体现纪律性。
    role: limitation
    src:
    - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
  - 'no': 6
    name: 极端环境身心管理与落袋为安纪律
    desc: 长时间高强度博弈中，通过娱乐缓解焦虑、保持生理机能、情绪稳定、外部支持维持决策力在线；浮盈 10 倍时警惕虚空价格、前端崩溃、挂单延迟，克服贪婪及时止盈离场。
    role: method
    src:
    - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
  - 'no': 7
    name: 实战收益验证与市场微观结构洞察
    desc: 成本 0.13，峰值 1.3（10倍），撰文时地板价 0.39（3倍）；验证 Gas 非线性阈值、谣言驱动价格畸变、CEX 上线预期与去中心化前端崩溃的套利窗口特征。
    role: experiment
    src:
    - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
