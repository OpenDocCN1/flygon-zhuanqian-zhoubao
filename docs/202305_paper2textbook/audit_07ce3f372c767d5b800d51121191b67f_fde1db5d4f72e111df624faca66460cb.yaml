- location: ch12.3
  claim: 影刀RPA仅需13次拖拽即可搭建完整流程
  reason: 素材中明确提到'13次拖拽'，但未详细列出这13个具体拖拽步骤的名称和顺序
- location: ch12.5
  claim: 影刀RPA构建文案自动化流程的标准节点序列包含6步原子操作
  reason: 素材中提到'读取-聚焦-发送-等待-抓取-写回'六步，但未明确每步对应的具体组件名称
- location: ch12.6
  claim: 通常监测'发送按钮变为停止生成按钮'的状态切换，或监测最新消息元素的'复制/重新生成'图标出现
  reason: 素材中提到'监测停止按钮消失/复制图标出现'，但未给出具体的DOM选择器或元素定位方法
- location: ch12.7
  claim: 作者案例：生财朋友圈发资源对接帖验证RPA需求 → 接单 → 3天速成影刀RPA（B站官方课） → 交付13拖拽方案 → 沉淀为标准化服务产品
  reason: 素材中提到'4月12号在生财朋友圈发了一条关于rpa的资源对接'和'B站有很多课程，比较推荐影刀rpa官方课程'，但未明确说明是'3天速成'以及'沉淀为标准化服务产品'的细节
- location: ch12.8
  claim: 自动化解决规模化（1到100）而非验证可行性（0到1）
  reason: 素材中明确提到'自动化，批量更多的是解决从1到100的问题而不是解决从0到1的问题'，该论断有素材支撑
- location: ch12.9
  claim: 组合工具年成本约几千元（含RPA授权），全功能SaaS年费常超万元且难定制
  reason: 素材中提到'算上时间成本，花钱是最便宜的方案'，但未给出具体的'几千元'和'超万元'的具体数字来源
