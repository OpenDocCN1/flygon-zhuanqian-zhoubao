  - 6.1.2 客服：
  - 6.1.2 开店：
  - 6.1.3 发货：
  - 6.1.4 数据平台：
theorems:
- name: 低门槛创业核心主张
  desc: 小红书无货源电商是普通人低成本创业的最优解：无需囤货压资金，保证金低至1000元，依靠信息差与执行力即可跑通商业闭环，三个月营收50万可复制。
  excerpt:
  - 我是如何通过小红书无货源电商三个月营收 50w+ 的？
  - 全程只讲实操，没有废话！！！
  - 资金门槛：...保证金：...垫付资金：...工具费用：
- name: 选品决定成败论
  desc: 选品是无货源模式的‘1’，内容与流量是‘0’。必须遵循‘市场验证优于主观臆断’原则，优先选择已在其他平台或同行处跑通数据的品，通过‘同行/爆款/热度词’三法交叉验证，规避‘自嗨式选品’风险。
  excerpt:
  - 二、选品篇 2.1 赛道选择：
  - 2.2 产品选择：
  - 2.2.1 同行选品法：
  - 2.2.2 电商爆款洗品法：
  - 2.2.3 热度词选品法：
- name: 内容生产工业化主张
  desc: 小红书内容生产必须去‘文艺化’，向‘工业化标准化’靠拢。封面决定点击率（六大法则），标题决定搜索流量（关键词公式），文案决定转化率（痛点+方案+引导），素材必须二创过审，拒绝纯搬运。
  excerpt:
  - 三、内容篇 3.1 素材-3.5 发布注意事项
  - 3.4 封面六大招法
  - 3.3 标题关键词组合
- name: 公私域联动增长飞轮
  desc: 公域流量（商城搜推/笔记搜推）获客成本高、留存低，必须构建私域沉淀体系。私域不仅承接复购提升LTV，更能反哺公域（老客首单好评/回购提升权重/种草笔记素材），形成‘公域引流->私域转化->公域权重提升->流量成本降低’的正向飞轮。
  excerpt:
  - 四、流量篇
  - 五、补充篇 5.1 私域：
  - 5.2 笔记维护：
- name: 合规生存底线论
  desc: 无货源模式本质上在平台规则边缘试探，长期主义必须以‘不触碰红线’为前提。虚假发货、侵权售假、诱导好评、违规引流、知识产权投诉是店铺永久封禁的五大死穴，避坑指南即生存指南。
  excerpt:
  - 六、避坑篇 6.1.1-6.1.4
  - 笔记/客服/开店/发货/数据平台 避坑细则
