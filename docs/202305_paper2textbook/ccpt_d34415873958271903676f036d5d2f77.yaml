methods:
- name: __overview__
  desc: 全链路标准化操作体系（SOP）：基础开店配置 -> 多源选品验证 -> 素材去重二创与封面标准化生产 -> 双引擎流量获取（商城货架+笔记种草） ->
    私域沉淀复购 -> 风控避坑。核心逻辑为‘低成本试错 + 数据驱动复制放大’。
  excerpt:
  - 本文将从基础-选品-货源-内容-流量-私域，这几个维度全方位的拆解
  - 全程只讲实操，没有废话！！！
- name: 资金门槛测算模型
  desc: 量化启动资金需求：保证金（1000-20000元视类目/店型）+ 垫付资金（首单回款周期约14天，需预估单量*客单价）+ 工具费用（选品/去水印/制图工具会员费）。
  excerpt:
  - 1.1 资金门槛：
  - 1.1.1 保证金：
  - 1.1.2 垫付资金：
  - 1.1.3 工具费用：
- name: 后台标准化配置清单
  desc: 店铺上线前的必选动作清单：信息公示合规化、运费宝强制开启、物流模板预设（含偏远地区）、资金账户绑定、客服自动回复/分流设置。
  excerpt:
  - 1.3 后台配置：
  - 1.3.1 信息公示：
  - 1.3.2 运费宝：
  - 1.3.3 物流配置：
  - 1.3.4 资金配置：
  - 1.3.5 客服配置：
- name: 商品上架标准化流程
  desc: 从选品定款 -> 货源对接（1688/义乌购/拼多多） -> SKU规划（颜色/尺码/组合） -> 价格设定（建议3-5倍毛利） -> 详情页搭建（主图/详情图/规格参数）
    -> 发布审核。
  excerpt:
  - 1.4 商品上架：
- name: 素材去重与二创生产流程
  desc: 素材获取（竞品笔记/供应商原图/同行视频） -> 去水印工具批量下载 -> 视频剪辑去重（调参数/镜像/调速/加滤镜/混剪） -> 图文排版（美图秀秀/醒图/可画）
    -> 合规性自检（无违禁词/水印/联系方式）。
  excerpt:
  - 3.1 素材：
  - 3.1.1 素材要求：
  - 3.1.2 素材处理：
- name: 文案采集与改写SOP
  desc: 收集优质笔记（搜关键词筛选高赞/近期爆款） -> 拆解文案结构（钩子/痛点/方案/引导） -> 伪原创改写（换词/换序/注入个人真实体验/植入长尾词）
    -> 植入商品卡片/店铺入口。
  excerpt:
  - 3.2 文案：
  - 3.2.1 如何收集优质笔记？
- name: 标题关键词组合公式
  desc: 核心词（大类目）+ 属性词（功能/材质/场景）+ 长尾词（人群/痛点/季节）+ 情绪词/数字/符号，字数控制在20字以内，兼顾搜索覆盖与推荐点击。
  excerpt:
  - 3.3 标题：
- name: 封面视觉化生产六步法
  desc: 基于‘封面六大视觉设计法则’的执行清单：1. 主体放大占比70%+；2. 对比色/互补色背景制造冲击；3. 高饱和度滤镜增强质感；4. 叠加高对比色块承载核心卖点文案；5.
    关键元素重复排列形成视觉节奏；6. 统一模板批量产出保持账号调性。
  excerpt:
  - 3.4 封面：
  - 3.4.1 第一招：放大 ... 3.4.6 第六招：重复排列
- name: 笔记发布与养号维护规范
  desc: 新号养期（3-5天正常浏览/点赞/收藏，不发广告） -> 定时发布（早9/中12/晚19-21高峰期） -> 发布后前30分钟人工互动催化 -> 数据监控（曝光/互动/转化）分层决策：炸裂加投薯条/薯店推广，一般维持，死笔记隐藏/删除重发。
  excerpt:
  - 3.5 笔记发布注意事项：
- name: 双引擎流量运营策略
  desc: 商城端：优化SKU/主图/标题/评价权重承接搜索流量，报名平台活动/设置营销工具（满减/优惠券）争取推荐流量；内容端：矩阵号布局长尾词SEO截流 +
    爆款笔记投流放大（薯条/薯店推广）获取推荐流量，形成‘种草-拔草’闭环。
  excerpt:
  - 4.1 商城诚推荐流量：
  - 4.2 商城诚搜索流量：
  - 4.3 笔记推荐流量：
  - 4.4 笔记搜索流量：
- name: 私域引流与转化话术
  desc: 合规引流路径：主页简介挂号/粉丝群/集福利 -> 私信自动回复/人工话术引导加微信 -> 朋友圈人设建设（真实/专业/福利） -> 社群/私聊精细化运营促复购/裂变。
  excerpt:
  - 5.1 私域：
- name: 全周期避坑检查清单
  desc: 系统性风控规避动作：笔记层面（规避违禁词/硬广/搬运过度/频次过高）；客服层面（响应率/纠纷率/承诺发货时效）；开店层面（资质过期/类目错选/品牌侵权）；发货层面（虚假发货/缺货/物流异常/单号复用）；数据平台层面（工具数据滞后/选品参考误差）。
  excerpt:
