  - 3.4.1 第一招：放大
  - 3.4.2 第二招：制造视觉冲击力
  - 3.4.3 第三招：色彩对比
  - 3.4.4 第四招：色彩饱和度
  - 3.4.5 第五招：增加色块
  - 3.4.6 第六招：重复排列
- name: 商城推荐流量/搜索流量
  desc: 小红书电商原生流量入口，商城推荐依赖‘人货场’算法匹配（千人千面），商城搜索依赖关键词精准匹配及商品权重（销量/转化/评价），是店铺稳定出单的核心公域流量来源。
  is_original: false
