paper: docs/202305/20230516_030.md
desc: 该素材是一篇关于小红书无货源电商模式的实操复盘文章，作者卧龙先生分享了其三个月实现营收50万+的完整操作体系，涵盖了店铺搭建基础、选品与货源策略、内容生产SOP（素材/文案/标题/封面六大技法）、多渠道流量获取逻辑（商城推荐/搜索、笔记推荐/搜索SEO）、私域转化及全流程避坑指南，核心主张在于通过标准化流程降低创业门槛，利用平台算法特性实现低成本起量。
concepts:
- name: 小红书无货源电商
  desc: 指不囤货、不发货，通过搬运/二次加工其他平台商品至小红书店铺，利用信息差赚取差价的电商模式，核心优势在于低资金门槛、无库存压力。
  is_original: false
  excerpt:
  - 今天就来拆解我是如何在三个月时间里通过小红书店铺变现 50w+。
  - 本文将从基础-选品-货源-内容-流量-私域，这几个维度全方位的拆解小红书无货源电商这个项目
- name: 五种店铺类型差异
  desc: 小红书平台支持个人店、个体店、企业店、旗舰店、专卖店五种类型，各类型在保证金、资质要求、类目准入、品牌保护权益上存在显著差异，新手建议从个人店起步。
  is_original: false
  excerpt:
  - 1.2.2 五种店铺的区别：
- name: 运费险/运费宝配置
  desc: 店铺后台必须开通的售后保障工具，用于覆盖退货运费风险，是无货源模式控制逆向物流成本的关键基础设施。
  is_original: false
  excerpt:
  - 1.3.2 运费宝：
- name: 同行选品法
  desc: 通过分析竞品店铺的畅销商品（销量、评价、上新频率）直接复制或微创新选品，是无货源模式最高效的选品捷径。
  is_original: false
  excerpt:
  - 2.2.1 同行选品法：
- name: 电商爆款洗品法
  desc: 从抖音、淘宝、拼多多等成熟电商平台挖掘已验证的爆款商品，搬运至小红书利用平台用户画像差异进行二次销售。
  is_original: false
  excerpt:
  - 2.2.2 电商爆款洗品法：
- name: 热度词选品法
  desc: 利用小红书搜索下拉框、榜单、专业数据工具（如千瓜、蝉妈妈）挖掘高搜索量、低竞争度的长尾关键词反推选品。
  is_original: false
  excerpt:
  - 2.2.3 热度词选品法：
- name: 封面六大视觉设计法则
  desc: 作者总结的提升笔记点击率（CTR）的标准化视觉制作方法论，包含：放大主体、制造视觉冲击、色彩对比、提高色彩饱和度、增加色块留白、重复排列构图。
  is_original: true
  excerpt:
