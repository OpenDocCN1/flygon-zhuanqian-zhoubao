life_analogy:
- 想象执行力是一场**马拉松比赛**，而非百米冲刺：
- '- **SOP标准化** = 统一的跑步姿势、呼吸节奏、配速标准（动作颗粒度可观测、可复制）'
- '- **全员全时段** = 无论刮风下雨、心情好坏，每天按时出现在跑道上（无例外、零折扣）'
- '- **穿越周期** = 坚持跑完全程42.195公里，而非前5公里冲刺后放弃（时间复利）'
- '- **执行惰性** = 身体想偷懒、想走捷径、想看风景的本能抗拒'
- '- **三大隐形坑** = 围观别人跑得快慢（凑热闹）、盲目跟风换鞋换姿势（随大流）、操心裁判公不公平（操他人心），导致自己跑偏、跑慢、甚至退赛'
- '- **笨功夫** = 每天枯燥地跑量、练核心、练配速，看似笨拙，实则是破世界纪录的唯一捷径'
- '- **执行复利** = 前10公里看不出差距，第30公里后，坚持标准动作的人开始甩开大部队，终点线前拉开不可追赶的身位'
- '- **主要矛盾原则** = 比赛中鞋带松了（致命问题）必须立刻蹲下系紧；腿酸（附随问题）坚持跑完全程自然缓解；裁判长相丑（慢性问题）接受无法改变，专注跑完全程。'
- 就像马拉松冠军从不靠‘聪明的策略’取胜，而是靠‘笨功夫’把简单的跑步动作重复到极致，执行力进化的本质，就是把正确的简单动作，彻底执行、长期坚持。
summary:
- concept: 执行力稀缺性定律
  desc: 知易行难，执行力而非认知是核心稀缺资源；执行力决定下限，认知决定上限
- concept: 彻底执行三重境界
  desc: SOP动作标准化 × 全员全时段覆盖 × 穿越周期长期主义 = 彻底执行
- concept: 执行惰性
  desc: 人性天然抗拒重复、枯燥、长期坚持标准化动作的心理机制
- concept: 三大隐形坑
  desc: 凑热闹、随大流、操他人心 —— 注意力被外部掠夺的三大黑洞
- concept: 注意力归属权
  desc: 注意力总量守恒，投入他人事务的每一分，等量减损自我成长
- concept: 笨功夫方法论
  desc: 海量案例拆解(1万/1000条) + 工程细节掌握 + 3-5年刻意练习 = 专家壁垒
- concept: 最短的路就是脚下的笨路
  desc: 看似繁琐的笨方法实则是达成专家成就的最短路径，捷径思维才是最长绕路
- concept: 执行复利
  desc: 彻底执行在时间维度累积的非线性收益：正向个人复利（出版邀约）、反向组织崩塌（古茗横幅）
- concept: 航海实战模型
  desc: 社群杠杆(手册/教练/榜单/伙伴) × 高频行动(日志/目标) × 利他分享(避坑/人脉) = 普通人0-1跃迁
- concept: 预售倒逼交付
  desc: 产品未成型即收款，用沉没成本与契约精神对抗完美主义拖延，强制跑通交付闭环
- concept: 分层变现阶梯
  desc: 从低客单引流品(0.27元)到高客单服务(399-1999元)的产品矩阵，最大化单用户生命周期价值
- concept: 主要矛盾原则
  desc: 识别并聚焦解决当前阶段关乎生存的核心问题，次要问题随主业自愈，慢性问题接受相对解决
- concept: 问题分层处理框架
  desc: 致命必解型(现金流)立即解决 → 附随自愈型(收入抱怨)随主业消失 → 慢性相对型(分配公平)接受相对公平
- concept: 业务发展掩盖问题论
  desc: 高速增长带来的增量红利，是化解存量博弈矛盾的最佳溶剂
- concept: 相对公平
  desc: 因人性高估自我贡献(总和>100%)，绝对公平不可达成，仅能建立客观标准达成相对合理
exercises:
- 'no': 1
  title: 个人执行力审计与SOP拆解
  contents:
  - 选择一个你想坚持但总失败的习惯（如早起阅读、每日运动、每日写作）：
  - 1. 将该习惯拆解为3-5个物理动作级的SOP步骤（如：前夜放手机床头→闹钟响即起床→喝水→打开书→读10分钟）
  - 2. 设定‘零容忍’执行标准：连续执行21天，中断即归零重来
  - 3. 记录每日执行情况：完成度、中断原因、耗时
  - 回答问题：
  - '- 哪个SOP步骤的‘执行阻力’最大？阻力源于能力不足还是惰性/三大坑？'
  - '- 如果将该习惯坚持5年，按复利逻辑预估会产生什么质变？'
- 'no': 2
  title: 注意力归属审计与三大坑诊断
  contents:
  - 连续3个工作日，每30分钟记录一次注意力投向（可用手机备忘录/时间追踪APP）：
  - 1. 分类标记：自我成长(技能/事业/健康) vs 他人事务(八卦/热搜/评价/无效社交)
  - 2. 统计每日‘三大坑’占用时长：凑热闹、随大流、操他人心
  - 3. 计算‘自我成长注意力占比’ = 自我成长时长 / 清醒时长
  - 回答问题：
  - '- 你的注意力归属权目前掌握在谁手中？'
  - '- 哪一个‘隐形坑’对你掠夺最严重？设计一条针对性的‘物理隔离’对策（如卸载APP、设置物理屏障、预置拒绝话术）。'
- 'no': 3
  title: 笨功夫训练营：单技能30天微刻意练习
  contents:
  - 选择一个与主业/副业强相关的微技能（如：短视频选题拆解、销售话术设计、AI提示词优化、Excel建模）：
  - 1. 设定量化指标：收集50个头部案例 → 结构化拆解建立规律库 → 产出10个标准化输出件
  - 2. 制定每日‘笨功夫’动作清单（如：每日拆解2条爆款、每日写3个提示词版本、每日复盘1个失败案例）
  - 3. 执行30天，每周日复盘：案例库规模、规律库迭代次数、输出件质量评分
  - 回答问题：
  - '- 30天后，你的‘下限’是否显著提升？能否超过同侪80%？'
  - '- 过程中遇到的最大‘工程细节’卡点是什么？如何攻克？'
- 'no': 4
  title: 当前阶段主要矛盾识别与资源聚焦演练
  contents:
  - 针对你正在操盘的项目/工作/副业：
  - 1. 列出当前所有感知到的问题（不少于10个）
  - 2. 按‘致命必解/附随自愈/慢性相对’三分法分类，并标注判断依据
  - 3. 识别唯一的‘主要矛盾’：不解决会导致系统崩溃/倒闭/彻底失败的那个
  - 4. 制定‘将军赶路不打小兔’的资源聚焦方案：将80%精力/预算/时间投入主要矛盾解决
  - 回答问题：
  - '- 哪些‘附随问题’你曾试图单独解决而分散了主力？'
  - '- 如何设计指标监控‘业务增长’是否真正掩盖/消解了次要矛盾？'
