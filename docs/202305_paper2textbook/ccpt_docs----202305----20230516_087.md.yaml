paper: docs/202305/20230516_087.md
desc: 该素材为一篇抖音养生号视频带货实操复盘贴的引流摘要，作者“微笑”分享其作为00后创业者在该赛道半年经验，核心宣称实现单月十万佣金，并承诺提供从0到1的毫无保留教学，引导读者跳转飞书文档查看完整干货内容。
concepts:
- name: 抖音养生号视频带货
  desc: 指在抖音平台运营垂直养生领域账号，通过发布短视频内容挂载橱窗商品实现变现的商业模式，是本素材的核心业务场景。
  is_original: false
  excerpt:
  - 抖音养生号:单月十万佣金复盘贴【从 0~1 实操教学】
  - 做抖音养生号半年了，今天与大家分享一下，4 月 月入十万的经验与教训
- name: 对标账号橱窗销量记录法
  desc: 作者在筛选对标账号时，记录其橱窗每日带货销量数字以评估账号商业价值和选品方向，而非仅关注粉丝量或点赞数。
  is_original: true
  excerpt:
  - 对标账号那里的数字，是我记录的橱窗销量 就是每天的带货销量，只是我没有写日期
methods:
- name: __overview__
  desc: 整体复盘教学方法论：基于个人半年实战经验，以“单月十万佣金”结果为锚点，拆解从账号搭建、对标分析、选品逻辑、内容生产到变现执行的全流程标准化操作手册（SOP），并承诺“跟着做也能赚到钱”的可复制性路径。
  excerpt:
  - 单月十万佣金复盘贴【从 0~1 实操教学】
  - 我会毫无保留的把自己的经验都分享出来，你跟着做也能赚到钱
  - 请移步飞书云文档 https://ka8a2qs38ja.feishu.cn/docx/ZbFEdhEwsoqaNnxXzRicjWQOnkd
theorems:
- name: 养生赛道新人可复制高收益主张
  desc: 核心主张：普通新人（00后、半年经验）通过标准化SOP操作抖音养生号，可在单月内实现十万佣金收益，且该路径具有强可复制性（‘跟着做也能赚到钱’）。
  excerpt:
  - 一位来自河南的 00 后创业者，做抖音养生号半年了...4 月 月入十万的经验与教训
  - 你跟着做也能赚到钱，希望看完后能对你有所帮助！
findings:
- name: 作者个人实战收益数据
  desc: '[claim] 作者宣称个人账号在2023年4月实现单月佣金收入十万元人民币。'
  excerpt:
  - 4 月 月入十万的经验与教训
  - 单月十万佣金复盘贴
- name: 社群认证与社交背书
  desc: '[evidence] 素材发布于“生财有术”社群（362赞），并获得包括社群大V“梁靠谱”、设计师阿鹏等核心成员的高度评价与认可，具备一定的社群信任背书。'
  excerpt:
