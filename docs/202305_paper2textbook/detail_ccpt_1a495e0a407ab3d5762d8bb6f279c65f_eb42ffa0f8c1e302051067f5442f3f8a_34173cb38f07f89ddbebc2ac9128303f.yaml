  - 我盯得指标只有一个，就是私域流量的增长。
  - 引流：找到用户最大痛点—结尾设置关键词钩子—引导公众号回复领取部分—加客服领取完整版资料。
  - 抖音蓝V的抗风险能力超乎你的想象... 我都被封2个号。
  - 抖音群我一般禁言... 引流就是自己转发卡片，不说任何的引导话术。用卡片跳转聪明人自己会过来找你
  - 一般知识博主的变现路径有3种，卖课程，卖咨询，卖圈子，我分别说下他们的优缺点吧。
