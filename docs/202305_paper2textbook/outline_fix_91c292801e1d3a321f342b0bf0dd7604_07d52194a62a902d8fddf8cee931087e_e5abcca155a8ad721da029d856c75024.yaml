- 'no': 1
  name: 生财有术 —— 社群杠杆加速普通人从0到1
  desc: 本章以生财有术社群为背景，拆解社群机制（航海、精华帖、贵人链接）如何成为新手跨越认知鸿沟、缩短试错周期、实现商业闭环的核心杠杆。
  nodes:
  - 'no': 1
    name: 小透明逆袭路径：从观望到行动的关键跃迁
    desc: 作者毛韩从2020年入群‘小透明’到2021年9月启动行动，耗时近一年；真正突破发生在‘开始行动’那一刻，航海仅是催化剂。
    role: motivation
    src:
    - paper: docs/202305/20230516_014.md
    - paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
  - 'no': 2
    name: 航海机制：强制执行的外部约束容器
    desc: 利用航海的‘截止节点、公开承诺、同伴监督、导师点评’四大机制，克服拖延，强制跑通最小商业闭环（0-1），赚到第一桶金。
    role: method
    src:
    - paper: docs/202305/20230516_014.md
    - paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
  - 'no': 3
    name: 精华帖逆向拆解法：带着问题去‘偷’成熟模块
    desc: 不盲目阅读，而是带着‘当前项目卡点’去精华帖拆解‘流量-产品-变现’三大模块，像搭积木一样组合新项目，实现‘以战代练’。
    role: method
    src:
    - paper: docs/202305/20230516_014.md
    - paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
  - 'no': 4
    name: 项目-人匹配筛选模型：新手筛选而非挑选
    desc: 基于‘认知范围内、资源可调动、执行难度可承受、周期可接受’近20项参数，动态筛选匹配当下能力的项目，附飞书工具表单可直接复用。
    role: method
    src:
    - paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
  - 'no': 5
    name: 贵人链接价值交换模型：让大佬投资产生强正反馈
    desc: 向上社交非单向索取，而是提供专业/情绪/渠道价值，使贵人投资获得正反馈（支棱、吃水不忘挖井人），形成势力复利。典型案例：梁靠谱与醒醒、苏姐的深度绑定。
    role: method
    src:
    - paper: docs/202305/20230516_016.md
  - 'no': 6
    name: 社群复利验证：一年从零到年入200万
    desc: 心理咨询师根源：依托生财‘好文章+对的人’，一年少走弯路，从一无所有到年入200万，印证社群杠杆加速论。
    role: experiment
    src:
    - paper: docs/202305/20230516_042.md
  - 'no': 7
    name: 公域陌生流量私域化闭环：闲鱼SEO霸屏实战
    desc: 利用闲鱼搜索规则，通过关键词布局、多账号矩阵发布商品/服务信息，占据搜索结果前排位置，实现精准流量被动获取，再引导至私域微信完成转化。
    role: method
    src:
    - paper: docs/202305/20230516_015.md
    - paper: docs/202305/E0aFdosjUobxU7xEQeCc7y8snyb.md
  - 'no': 8
    name: 引流即销售：用卖货套路做拉新，成交率50%+
    desc: 将引流环节标准化为销售流程：开场建立信任 -> 需求确认/痛点挖掘 -> 方案展示(钩子价值) -> 处理顾虑(安全/价格) -> 明确行动号召(引导加微信/下单)
      -> 成交后服务交付。7天实测：咨询300+ -> 加微81人(27%) -> 成交41人(50.6%)，平均成交耗时2.6小时。
    role: method
    src:
    - paper: docs/202305/20230516_015.md
    - paper: docs/202305/E0aFdosjUobxU7xEQeCc7y8snyb.md
- 'no': 2
  name: 认知重构 —— 知识付费创业者的底层操作系统升级
  desc: 本章聚焦芷蓝等头部玩家的核心心法，揭示知识付费赛道‘试错-筛选-放大’的认知逻辑，重塑创业者对产品、交付、流量、组织、客户的根本认知。
  nodes:
  - 'no': 1
    name: 创业失败必然论与低成本试错定律
    desc: 创业本质是概率游戏，失败是常态，知识付费边际成本趋近零，应‘多尝试、快失败、低成本、留存活下来的模式’。
    role: motivation
    src:
    - paper: docs/202305/20230516_041.md
  - 'no': 2
    name: 核心三件事与外包杠杆：只做阅读、构建体系、生产内容
    desc: 其余运营、交付、社群维护全外包，用钱买时间换体量放大，形成正向飞轮。
    role: method
    src:
    - paper: docs/202305/20230516_041.md
  - 'no': 3
    name: 暴力交付：交付本质是筛选优质用户，而非无限陪伴
    desc: 优质用户需求简单直接（结果/资源/流量），服务越重往往产品越弱、用户越差。‘永远没有最好的交付，只有更好的用户’。
    role: definition
    src:
    - paper: docs/202305/20230516_041.md
  - 'no': 4
    name: 选客户比服务客户重要：99%成功源于客户自我觉醒
    desc: 筛选‘正在觉醒/已觉醒’客户，稍加助力即成，积累成功案例构建势能吸引同类人。拒绝‘需监督执行’的低质客户。
    role: method
    src:
    - paper: docs/202305/20230516_041.md
  - 'no': 5
    name: 认知接口：旧瓶装新酒，降低用户理解门槛
    desc: 不教育新概念（成本极高），而在用户既有认知框架内植入新工具/新场景。如ChatGPT课不讲原理，只讲‘原流程不变，效率提升10倍’。
    role: method
    src:
    - paper: docs/202305/20230516_041.md
  - 'no': 6
    name: 动态定位：定位服务于变现，而非长期主义信仰
    desc: 判断项目赚钱 -> 定位服务项目 -> 赚钱后升级定位。马云、雷军、腾讯皆通过变更定位实现跃迁。
    role: method
    src:
    - paper: docs/202305/20230516_041.md
  - 'no': 7
    name: 组织进化三阶段：零件→设计者→带将者
    desc: 0-1做关键零件（勤奋），1-N做系统设计者（懒惰/买时间），规模化做带将者（搞定合伙人，合伙人制）。
    role: extension
    src:
    - paper: docs/202305/20230516_041.md
  - 'no': 8
    name: 实证：ChatGPT大师课借势单渠道预售60万+、全年预计300万
    desc: 借风口势+行业势（健身/医美/写作结合）+渠道势（小鹅通），验证借势造势与认知接口的威力。
    role: experiment
    src:
    - paper: docs/202305/20230516_041.md
  - 'no': 9
    name: 实证：朋友圈训练营停止→标准化课件+星球答疑，精力释放且营收不降
    desc: 月入10万的‘有价值垃圾’产品改造后，月销20+单维持营收，腾出精力服务高客单价用户。
    role: experiment
    src:
    - paper: docs/202305/20230516_041.md
- 'no': 3
  name: 闲鱼无货源 —— 从‘捡漏心理’到‘矩阵霸屏’的全周期实战体系
  desc: 本章整合远方、公子唯心、宅男、云端等多位头部玩家实战，构建闲鱼无货源从选品、建号、上架、引流、转化、矩阵放大到风控规避的完整标准化作业手册（SOP）。
  nodes:
  - 'no': 1
    name: 闲鱼核心用户心理：捡漏、占便宜
    desc: 选品、定价、文案、标题、图片均需围绕‘低价捡漏’心理设计（清仓、倒闭、批发价、最后几件），击中用户核心动机。
    role: motivation
    src:
    - paper: docs/202305/20230516_097.md
  - 'no': 2
    name: 反养号论：养号仅提升买家标签，不提升卖家权重
    desc: 权重核心=30天销量/点击率/收藏率/好评率/发布时间/售后/违规/二次访问。新号注册完善资料后直接上架，节省时间避免打错标签。
    role: definition
    src:
    - paper: docs/202305/20230516_097.md
  - 'no': 3
    name: 一机一卡一号与设备隔离：规避违规关联管控的生存底线
    desc: 同设备/网络下店铺违规关联受罚；避免使用曾卖过货的旧设备（历史污染导致流量受损），切记踩坑实证。
    role: method
    src:
    - paper: docs/202305/20230516_097.md
  - 'no': 4
    name: 垂直店铺专业度信任模型：单店单品类，榜单上榜皆垂直
    desc: 杂货铺难建立信任；垂直度提升专业感与信任度，配合真实人设（真人头像、专业简介）强化转化。
    role: method
    src:
    - paper: docs/202305/20230516_097.md
  - 'no': 5
    name: 三维选品法：榜单复制+蓝海挖掘+多渠道深度了解
    desc: 1) 复制榜单头部验证品；2) 挖掘‘买家多卖家少’小众蓝海（摩托配件/改装件）；3) 多多/淘宝/同行/抖音/百度深度了解产品细节。
    role: method
    src:
    - paper: docs/202305/20230516_097.md
  - 'no': 6
    name: 爆款上架八要素：围绕‘真实’与‘买家心理’的组合拳
    desc: 标题(高搜词+痛点钩子)、文案(稀缺紧迫)、主图(吸睛真实信息密)、详情图(代入感人设关联)、价格(新品低价引流后涨价)、地址(产地/一二线城市借流量)、标签(补词)、圈子(辅助曝光)。
    role: method
    src:
    - paper: docs/202305/20230516_097.md
  - 'no': 7
    name: 矩阵店铺霸屏策略：多账号占据搜索前排垄断流量
    desc: 7-8个店铺布局同一单品，占据搜索前5/前10多个位置，通过曝光数据预判具体哪个链接会爆单，实现‘必定有一个爆单’。
    role: method
    src:
    - paper: docs/202305/20230516_097.md
  - 'no': 8
    name: 创业粉引流闭环：低价虚拟课钩子→文件过大引导加微→5元/个批发变现→分销代理授权裂变
    desc: 几元钱筛选高意向创业粉，自动发货话术‘文件过大加微信领取’合规迁移私域，回收粉丝5元/个，授权账号免费7天/月费30元招代理滚雪球。
    role: method
    src:
    - paper: docs/202305/20230516_098.md
  - 'no': 9
    name: 见面交易转好评策略：规避虚拟商品发货违规、快速提权重
    desc: 利用‘见面交易’功能规避无物流单号违规，引导买家确认收货给好评，快速提升鱼力值/信用分降低封号概率。
    role: method
    src:
    - paper: docs/202305/20230516_098.md
  - 'no': 10
    name: 差评稀释与炼丹机制：利用评价上墙时间差挤落差评
    desc: 动员老顾客刷长文好评（3天确认收货+臭长好评）制造优质评价标杆；召唤客服(输入12345)投诉违规内容(辱骂/宗教/站外引流)删除差评。
    role: method
    src:
    - paper: docs/202305/20230516_105.md
  - 'no': 11
    name: 竞品销量反侧写体系：总销量追踪+咨询转化估算+未屏蔽同行采样
    desc: 针对闲鱼隐藏销量，追踪店铺总销量增量推算日单量，截图‘我想要’变化结合行业转化率反推，寻找未屏蔽同行校准。
    role: method
    src:
    - paper: docs/202305/20230516_105.md
  - 'no': 12
    name: 时间成本选品匹配模型：按可支配时间碎片度匹配品类
    desc: 重客服型(山地车)需长碎片时间，重运营型(马桶)需深度专注，重财务型(小百货)需标准化流程，重客服转化型(大百货)需高客单长跟进。无最优仅最适配。
    role: method
    src:
    - paper: docs/202305/20230516_105.md
  - 'no': 13
    name: 红海规模化策略：账号规模大时主动选红海标品建壁垒
    desc: 400+店铺蓝海容量不足，转战红海类目通过店群规模化运营建立壁垒。‘号多了蓝海也变红海’。
    role: extension
    src:
    - paper: docs/202305/20230516_105.md
  - 'no': 14
    name: 店铺权重双核心指标：转化率进攻 - 售后风险防御
    desc: 权重正向由‘咨询转单率’驱动，负向由‘退款率/小二介入率’拖累。‘养号/擦亮/签到’边缘动作收益极低。
    role: definition
    src:
    - paper: docs/202305/20230516_105.md
  - 'no': 15
    name: 规模化必然导向非核心城市：山东聊城/滨州低成本组建铁三角团队
    desc: 客服-运营-财务分工：客服组跟进高客单转化，运营组优化图文评价管绩效，财务组比价下单拦截异常。大城市人力成本结构不支撑重客服模式。
    role: extension
    src:
    - paper: docs/202305/20230516_105.md
  - 'no': 16
    name: 副业天花板定律：个人全职年入15-20万，有货源优势应切淘宝/拼多多
    desc: 闲鱼仅作创业跳板；具备核心货源优势者应直接切入天花板百万级平台，副业中位数月入1-2k，头部20%达3-5k。
    role: limitation
    src:
    - paper: docs/202305/20230516_105.md
  - 'no': 17
    name: 保姆级教程体系：12大章64小章覆盖全流程
    desc: 公子唯心深耕6年操盘几百家店铺，将实战经验总结为可复制的标准化操作指南，涵盖养号、选品、文案、发布、客服、发货、售后等全环节。
    role: method
    src:
    - paper: docs/202305/20230516_039.md
  - 'no': 18
    name: 二手书合规准入：出版物经营许可证办理避坑指南
    desc: 无证经营违规概率极高（扣20分下架封号），幸存者效应掩盖99%死亡率。代办个体户套餐1000-1500元包售后，接受地址异常概率事件，年审300元维持，闲鱼仅验证证照编号真伪不穿透核查地址。
    role: method
    src:
    - paper: docs/202305/20230516_038.md
  - 'no': 19
    name: 快团团推广大团长模式：卖铲子而非淘金子
    desc: 分享帮卖二维码抽取0.5%-2%销售额佣金，官方‘帮卖圈子/批量分享’功能支持一次申请200个大团长，配合快团团‘团品’载体化资源沉淀(一分钱拍单永久二维码+便于修改+刷团员销量解锁高阶资源)形成良性循环。
    role: method
    src:
    - paper: docs/202305/20230516_095.md
    - paper: docs/202305/HUSAdLZRCoBXiMxK0kFc99Qkndg.md
  - 'no': 20
    name: 矩阵打法速效公式：当天出单、七天爆单的标准化路径
    desc: 远方3年实操沉淀，主张‘找有货代发’供应链模式配合矩阵操作，打破‘莫名其妙出单、莫名其妙没单’的不确定性，实现新手快速起量。
    role: method
    src:
    - paper: docs/202305/20230516_037.md
- 'no': 4
  name: 小红书无货源电商 —— ‘三缺’红利期的低成本起量与SEO长尾复利
  desc: 本章基于卧龙、宅男两位百万实操者经验，系统拆解小红书店铺无货源从开店配置、选品验证、内容工业化生产、双引擎流量（商城+笔记）、私域沉淀到合规避坑的全链路SOP。
  nodes:
  - 'no': 1
    name: 三缺红利期判断：缺商家、缺产品、缺深度服务
    desc: 用户质量最高平台（2.6亿月活、70%女性、一二线城市），电商体系早期，先入场斩获超额红利，类比10年淘宝/16年抖音。
    role: motivation
    src:
    - paper: docs/202305/20230516_030.md
    - paper: docs/202305/AVx7dEXmpoRJazx3nH8cceBOnhd.md
  - 'no': 2
    name: 资金门槛测算：单店约3000-4000元启动
    desc: 保证金1000元+垫付资金2000-3000元(7-15天回款周期)+软件费60-200元/月，验证低资金门槛主张。
    role: definition
    src:
    - paper: docs/202305/20230516_030.md
    - paper: docs/202305/AVx7dEXmpoRJazx3nH8cceBOnhd.md
  - 'no': 3
    name: 三维交叉验证选品法：同行+电商爆款+热度词
    desc: 同行选品(站内销量高个人店)+电商爆款洗品(淘宝/拼多多/抖店榜单→小红书验证销量>500)+热度词选品(千瓜/蝉妈妈/禅小红查热词→站内搜验证)。三通道交叉验证提升成功率。
    role: method
    src:
    - paper: docs/202305/20230516_030.md
    - paper: docs/202305/AVx7dEXmpoRJazx3nH8cceBOnhd.md
  - 'no': 4
    name: 蓝海赛道比值模型：笔记数/互动量比值越小越蓝海
    desc: 利用千瓜数据导出赛道笔记总数与互动总量计算比值，比值小=供给稀缺需求旺盛，量化筛选蓝海赛道。
    role: method
    src:
    - paper: docs/202305/AVx7dEXmpoRJazx3nH8cceBOnhd.md
  - 'no': 5
    name: 内容生产工业化：去‘文艺化’向‘标准化’靠拢
    desc: 封面六大视觉法则(放大/冲击/对比/饱和度/色块/重复)决定CTR，标题关键词杂交组合公式决定搜索流量，文案‘真情实感>营销话术’吸引精准用户，素材四源二创去重(电商/短视频/站内/自拍)。
