  reason: 素材中该链接指向《25天成交一个海外独立站 B2B 客户...》文档，而非周报索引页或总目录。
- location: 85.4.2
  claim: 双层索引机制：期刊级索引为 `README.md`，专题级索引为文档标签。
  reason: 素材中未发现名为 `README.md` 的文档，索引页为语雀文档（如 `000.md`、`001.md`、`051.md` 等），非本地 Markdown
    文件。
- location: 85.4.4
  claim: 第 3 章聚合[快团团][私域分销]、第 19 章聚合[AI][SD][部署]、第 27 章聚合[视频号][投流][矩阵]
  reason: 素材为单期周报文档集合，不存在第 3/19/27 章等教材章节结构，属于教材编写规划而非周报现状。
- location: 85.5.4
  claim: 教材多个章节案例（如叁斤、漫漫、东哥、木子田）均源于社群成员航海实战复盘
  reason: 素材中虽有上述作者的实战分享，但未明确标注其为‘航海’项目产出，部分作者（如东哥）明确提到参加过视频号航海，但叁斤、漫漫、木子田文中未提‘航海’。
- location: 85.5.5
  claim: 第 26 章启示：‘社群核心价值非提供项目而是提供元认知异质知识库’
  reason: 素材中无第 26 章内容，该论述为教材编写者总结，非周报原文直接表述。
