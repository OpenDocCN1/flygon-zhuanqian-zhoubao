life_analogy:
- 想象视频号挂车投流是一场**精心设计的‘自动售货机’生意**：
- '- **选品** = 填充货架的商品：必须是高毛利、高需求、低差评的‘畅销款’，否则机器摆在那里也没人买'
- '- **混剪去重** = 给商品换包装：同样的‘货’（素材），换个‘外壳’（MD5/关键帧/调色）让查重机器（城管/安检）认不出是‘地摊货’，从而合法上架'
- '- **随心推** = 试运营期：新机器上线先不赚钱，投钱请人来买（买流量），目的是训练‘推荐算法’（店员）记住谁爱买这货（养模型）'
- '- **千川** = 规模化放量：模型练准了，开更多机器（计划），精准投放广告（人群包），用‘正反馈平衡负反馈’（补货+促销+装修）持续榨取利润'
- '- **ECPM** = 单位货架产出：平台只给‘单位时间赚钱最多’的机器（计划）黄金货架位（流量），不赚钱的直接撤机器'
- '- **角色扮演/场景立体化** = 店员话术与店面装修：再好的货，店员（主播/口播）不会吆喝、店面（背景）脏乱差，转化率必低'
- 就像开自动售货机，选品定生死，素材定上限，投流定规模，算法博弈定存活。
summary:
- concept: 短视频挂车投流
  desc: 视频号最稳定带货玩法：制作视频挂商品链接付费投流，具稳定/可复制/可放大/不废号四大优势，但属钱生钱项目有资金门槛
- concept: 选品四渠道三红线
  desc: 爆单秘籍/跟爆款/榜单/避坑四渠道筛选；避开高播强竞品/差评>6-8%/体验分<4.8三红线，选品决定上限
- concept: 混剪去重七步法
  desc: 针对MD5/关键帧/像素/音频查重机制，通过调参/特效/变速/镜像/贴纸/换BGM/调色七步技术处理实现过原创审核
- concept: ECPM竞价底层逻辑
  desc: ECPM=估算点击率×估算转化率×目标出价×1000；挂车视频核心看点击率/转化率/GPV/GPROI/人均观看时长/完播率
- concept: 随心推全生命周期
  desc: 测品期(智能/自动/24h/亏损养模)→优化期(ROI目标出价)→高峰期(手动/2h/1.2倍佣金/70%消耗降价5%)→过渡期(均价×佣金率反推千川)
- concept: 随心推反推千川
  desc: 用随心推跑出均价(总销售额/订单数)计算千川初始出价=均价×佣金率，过新手期(20单)后出价=初始出价/1.2
- concept: 千川冷启动标准动作
  desc: 搭建:莱卡定向>5亿/保守出价(佣金/1.2)/开成本保障→学习期:高价亏本+一键起量/高峰预热→稳定期:正负反馈平衡/规避创意挤压
- concept: 算法博弈正负反馈平衡律
  desc: 每个负反馈(降价)必配正反馈(加预算/延时长/换素材)，正≥负，避免向算法传递'不想跑了'信号导致模型衰退
- concept: 真人出镜角色扮演法
  desc: 设定具体沟通对象(给妈妈聊天/训斥学生/憋尿急说话)调整语气微表情，将创作者转化为演员增强真实感代入感
- concept: 场景立体化分级
  desc: 青铜(扁平书架压抑)→王者(墙角+绿植/暖光灯/摆件构造景深)，用最低成本制造高级感专业感
- concept: 书单四代形态进化
  desc: A4书单(2019极简)→笔记书单(2021笔记呈现)→讲座书单(2022权威人设)→划线书单(高光金句可视化)，核心逻辑大道至简低成本量产
- concept: 红利窗口期论
  desc: 内容形态早期靠自然流，后期必须投流维持；跟风不吃肉也能喝汤，关键在于尽早入场+配套投流能力
- concept: 爆款五种思维
  desc: 热点思维(蹭热度)/利他思维(给价值)/发散思维(一题多解)/创造性思维(差异化)/复盘思维(数据驱动迭代)
- concept: 六大底层传播逻辑
  desc: 选品、文案、拍摄、剪辑、投流、主播/人设——缺一不可，思维决定上限，逻辑决定下限
- concept: 官方出圈效应与前3秒法则
  desc: 人群出圈(大众化)/内容出圈(反差冲突)/形式出圈(新奇特)；前3秒留人，黄金前5秒阐述核心
- concept: 口播文案三板斧
  desc: A.抄抖音爆款图文转口播(规避非原创/爆率70%+) B.搬小红书笔记对着镜头读 C.蹭热榜/官方活动流量红利
exercises:
- 'no': 1
  title: 实战演练：从0到1跑通一个视频号挂车投流测品闭环
  contents:
  - 背景：你有一个新注册的视频号，预算500元测品资金，目标跑通0-1出单。
  - 任务1：选品实操
  - '  1. 打开视频号后台‘爆单秘籍’，筛选近7天佣金率>30%、带货销量>100单、体验分>4.8的商品，记录3个备选品。'
  - '  2. 在视频号搜索这3个商品关键词，找到点赞>1000的带货爆款视频，分析其选品逻辑与呈现形式。'
  - '  3. 查看这3个商品的差评率，若>6-8%直接剔除。'
  - 任务2：素材搬运与去重
  - '  1. 用采集工具下载对标爆款视频（优先口播类），导入剪映/去重软件。'
  - '  2. 执行七步去重：修改MD5(调参数)→加转场特效→变速(0.9x/1.1x)→镜像翻转→加贴纸/字幕遮挡关键帧→换BGM→调色(滤镜强度10-20)。'
  - '  3. 导出视频，上传视频号挂车发布，观察是否通过原创审核。'
  - 任务3：随心推测品投放
  - '  1. 新建计划：系统智能投放、自动出价、24小时、预算100元/条、无定向。'
  - '  2. 同时测3条素材（每条挂1-2个链接），观察6小时数据：花费、展现、点击、下单、ROI。'
  - '  3. 复盘判断：哪条素材‘能出单且ROI>0.8’？哪条‘花费>50元无转化’需关停？'
  - 任务4：数据反推与决策
  - '  1. 若有素材出单，计算：平均客单价=总销售额/订单数；千川初始出价=平均客单价×佣金率。'
  - '  2. 回答：为何测品期必须选‘系统智能投放’而非‘自定义定向’？为何投放时长建议24小时？'
  - '  3. 回答：若测品3条素材均无转化，是换素材、换品、还是加预算？依据是什么？'
- 'no': 2
  title: 算法博弈实战：千川计划从学习期到稳定期的参数调优推演
  contents:
  - 场景：某高客单价商品(客单价200元，佣金40%)，随心推测品跑出均价195元，ROI稳定1.3，准备进千川放量。
  - 任务1：计划搭建参数设定
  - '  1. 计算保守安全出价上限：佣金/1.2 = ? 元。'
  - '  2. 莱卡定向如何设置才能保证覆盖人群>5亿？若覆盖仅3亿，应放宽哪些定向标签？'
  - '  3. 是否开启‘成本保障/控成本投放’？为什么？'
  - 任务2：学习期操作推演
  - '  1. 学习期出价策略：起步出价设为保守出价的1.5-2倍，开启‘一键起量’2-6小时，目标跑够20单出新手期。'
  - '  2. 高峰期预热：早/中/晚高峰前半小时建计划，为何要提前预热？'
  - 任务3：稳定期博弈决策树
  - '  现象A：计划跑量3天，突然第4天不消耗了，余额充足、发货率正常。'
  - '  - 诊断核心原因：ECPM竞争力不足(点击率/转化率下降被同行挤压)。'
  - '  - 自救动作：①优化素材(换新钩子/换新素材) ②优化定向商品 ③智能放量。按优先级排序。'
  - '  现象B：高点击率(3%)但低转化率(0.5%)，ROI<1。'
  - '  - 诊断：价值塑造不到位 或 市场饱和。'
  - '  - 决策：直接换素材，不可降价死扛。为什么？'
  - '  现象C：转化率稳定，但想降价提高ROI。'
  - '  - 操作：降价5%的同时，必须做什么正反馈动作？(加预算/延时长/换优质素材三选一或组合)。'
- 'no': 3
  title: 内容制作实战：口播带货视频的‘角色扮演+场景立体化’标准化拍摄
  contents:
  - 任务：为一款‘中老年关节贴’产品，拍摄一条15秒口播带货视频。
  - 步骤1：文案结构拆解（黄金前5秒法则）
  - '  - 前3秒钩子(视觉/听觉/认知)设计：'
  - '  - 前5秒核心阐述(痛点+方案+产品)话术：'
  - '  - 中间干货/信任背书(成分/证书/案例)：'
  - '  - 结尾引导(点击左下角/限时优惠)：'
  - 步骤2：角色扮演指令设定
  - '  - 选择沟通对象：给妈妈聊天 / 训斥学生 / 憋尿急说话 / 其他：______'
  - '  - 该指令对应的语速/语气/微表情关键词：'
  - 步骤3：场景布置执行清单
  - '  - 拒绝扁平书架，寻找家中/办公室最佳墙角位置：______'
  - '  - 道具准备：绿植(是/无) 暖光灯/补光灯(是/无) 摆件/书籍装饰(是/无)'
  - '  - 景深测试：站在离墙角1.5米处，手机竖屏录制，背景虚化效果检查(主体清晰/背景虚化/有层次感)。'
  - 步骤4：工具辅助与拍摄
  - '  - 将文案导入剪映提词器，调整字号/滚动速度匹配语速。'
  - '  - 手机固定支架/手持稳定器，对着镜头按角色扮演指令录制3遍。'
  - 步骤5：剪辑检查项
  - '  - 前3秒是否有字幕/特效/音效强化钩子？'
  - '  - 画面切换/转场是否配合语气节奏？'
  - '  - 结尾是否加了‘点击左下角小黄车’引导手势/贴纸？'
  - 复盘问题：
  - '  - 对比‘对着镜头念稿版’vs‘角色扮演版’，完播率/平均观看时长差异预估多少？'
  - '  - 若无实体墙角/采光差，如何用虚拟背景/绿幕/补光灯替代实现王者级场景？'
- 'no': 4
  title: 形态迭代复盘：书单带货从A4到划线的四代进化与投流依赖性验证
  contents:
  - 任务：梳理某书单账号(或竞品账号)的内容形态演变史与投流节点。
  - 步骤1：形态识别与时间线标注
  - '  - 账号早期(首发-100条)主要形态：A4书单/笔记书单/讲座书单/划线书单/其他：______'
  - '  - 该形态期间是否投流？自然流最高单条播放/佣金：______'
  - '  - 形态迭代节点(约第几条/何时)切换为下一代形态：______'
  - '  - 切换原因：自然流量衰减/竞品投流/平台扶持新形态/主动求变：______'
  - 步骤2：投流依赖性验证实验
  - '  - 取当前主流形态(如划线书单)近10条视频，分为两组：'
  - '  - A组(5条)：不投流/仅自然流发布，记录7天播放/点击/转化。'
  - '  - B组(5条)：同素材/同文案，投随心推100元/条(系统智能/24h)，记录7天数据。'
  - '  - 对比：B组平均播放/转化/ROI 是否显著优于A组？验证‘不投流则无法起量’结论。'
  - 步骤3：跨平台形态迁移测试
  - '  - 将抖音验证过的爆款划线书单素材(文案/音频/封面)，迁移发布至视频号/快手。'
  - '  - 观察：是否仍具爆款潜质？需微调哪些要素(如封面尺寸/话题标签/发布时间)？'
  - 复盘问题：
  - '  - 为何‘大道至简’的形态生命周期最长？下一代形态会更简单还是更复杂？'
  - '  - 晚入场者只能喝汤，核心优势在于什么？如何判断当前形态红利期已结束？'
- 'no': 5
  title: 综合实战：短视频带货‘六大底层逻辑’自查与短板补强计划
  contents:
  - 对照‘选品、文案、拍摄、剪辑、投流、主播/人设’六大要素，对当前项目/账号进行打分(1-10分)与短板分析。
  - 自查表：
  - '  1. 选品(____分)：是否有标准化选品SOP(四渠道三红线)？近期测品出单率____%？'
  - '  2. 文案(____分)：是否有爆款文案库/模板？前3秒钩子/前5秒核心是否标准化？'
  - '  3. 拍摄(____分)：真人出镜是否用角色扮演法？场景是否王者级？设备/光影是否达标？'
  - '  4. 剪辑(____分)：是否有固定剪辑模板/转场/字幕/BGM/调色SOP？去重七步法是否肌肉记忆？'
  - '  5. 投流(____分)：随心推/千川全生命周期操作是否标准化？能否独立诊断不消耗/低转化/跑飞？'
  - '  6. 主播/人设(____分)：账号人设标签是否清晰(三词以内)？头像/简介/封面/内容是否统一人设？'
  - 短板补强计划（针对最低分项）：
  - '  - 目标项：______'
  - '  - 具体动作1(本周)：______'
  - '  - 具体动作2(本月)：______'
  - '  - 验证指标：______'
  - '  - 所需资源(课程/工具/同行/导师)：______'
  - 思考题：
  - '  - ‘思维决定上限，逻辑决定下限’，你的上限思维(五种思维)最弱项是哪个？如何刻意练习？'
  - '  - 若只能保留一个投流工具(随心推或千川)，你选哪个？理由是什么？'
units:
- 'no': 1
  name: 短视频挂车投流 —— 视频号带货的“钱生钱”稳健路径
  points:
  - '**为什么需要这个概念？**'
  - '- 自然流玩法极不稳定，作者亲测连续十几个账号被限流，账号资产极易报废'
  - '- 需要一种账号权重不受损、可长期复用、结果可复制放大的带货范式'
  - '- 普通人想通过付费流量跨越“0-1”鸿沟，但缺乏系统化的低成本验证路径'
  - '**核心定义**'
  - '- 短视频挂车投流：制作短视频挂载小店/精选联盟商品链接，通过视频号推广/微信豆付费投放获取流量并转化带货的完整商业闭环'
  - '- 核心特征：稳定、可复制、可放大、不废号（账号资产可长期沉淀）'
  - '- 本质属性：钱生钱项目，资金量决定收益天花板（钱多吃肉，钱少喝汤，没钱玩不了）'
  - '**关键性质**'
  - '- 双刃剑属性：操作难度/复杂度高于自然流，测品需真金白银，掌握方法前易亏损'
  - '- 新手友好度：掌握核心方法论后，新手可快速跑通0-1（作者耗时两月跑通）'
  - '- 规模上限：成熟团队可放大至月利润百万级，行业内月利润超百万团队不少于10个'
  - '**典型例子**'
  - '- 作者从自然流连续限流崩溃，转型投流两月跑通流程，实现稳定出单'
  - '- 行业头部团队通过该玩法实现月利润百万级规模化运营'
  - '**边界条件**'
  - '- 无资金垫付能力者不可入局（测品亏损、跑量烧钱均需现金流支撑）'
  - '- 无法承受“随心亏”心态压力者不可操作（测品期必亏、心态决定成败）'
  - '- 缺乏复杂SOP执行力者难以驾驭（选品、素材、投流、运营全链路标准化要求高）'
  sources:
  - paper: docs/202305/20230516_082.md
    role: origin
  - paper: docs/202305/20230516_086.md
    role: improve
  excerpts:
  - 目前视频号最稳定的带货玩法--短视频挂车投流
  - 开始研究挂车投流，测试了两个多月...流程跑通之后，真香！稳定、可复制、可放大。而且，不废号！！！
  - 缺点是...测品过程需要投钱，没掌握方法的话会亏钱；门槛高...钱生钱的项目，钱多吃肉，钱少喝汤，没钱玩不了。
  - 2 月份我还在做自然流，在被连续限流十几个账号后，彻底退出自然流玩法，开始研究挂车投流...
  - 光我知道的玩投流月利润超过 100w 的团队不少于 10 个。
- 'no': 2
  name: 选品四大实战渠道与三大避坑红线 —— 视频号带货选品的“生死线”
  points:
  - '**为什么需要这个概念？**'
  - '- 选品决定带货上限，选错品等于白干，新手最易在选品环节折戟'
  - '- 平台海量商品中，需一套可执行、可验证、可规避风险的标准化筛选决策树'
  - '- 避开“高播量强竞品、高差评、低体验分”三大隐形杀手，是存活前提'
  - '**核心定义**'
  - '- 选品四大渠道：① 爆单秘籍选品（平台官方工具）② 跟爆款视频反推选品 ③ 爆款商品榜单选品 ④ 规避选品误区'
  - '- 三大避坑红线：① 避开高播放量强竞品 ② 差评比 > 6-8% 直接 Pass ③ 体验分 < 4.8 直接 Pass'
  - '**关键性质**'
  - '- 官方数据源优先：爆单秘籍/榜单为平台一手数据，真实度高于第三方工具'
  - '- 竞品反推逻辑：爆款视频背后必有爆款商品，反向拆解可复用选品思路'
  - '- 动态避坑机制：差评率与体验分为动态指标，需实时监控而非一次性筛选'
  - '**典型例子**'
  - '- 使用爆单秘籍筛选近期高佣金、高转化商品作为首选测品池'
  - '- 发现竞品视频播放量大但挂车链接商品体验分仅4.5，果断放弃避坑'
  - '**边界条件**'
  - '- 仅依赖榜单选品易陷入红海厮杀，需结合差异化素材与投流策略构建壁垒'
  - '- 季节性/节日性商品（如羽绒服、湿巾）具有时效性，过期即失效，需提前布局'
  - '- 新品上架无历史数据时，需依赖供应链实力与素材测试验证，而非盲目跟风'
  sources:
  - paper: docs/202305/20230516_086.md
    role: origin
  excerpts:
  - 1、用 4 个爆单秘籍选品 2、跟爆款视频选品... 3、看爆款商品榜单选品... 4、选品误区...
  - 选品误区：避开高播放量强竞品... 差评比>6-8%... 体验分<4.8...
  - 选品决定上限，执行决定下限
- 'no': 3
  name: 混剪去重七步标准作业程序 —— 让搬运视频穿上“原创外衣”
  points:
  - '**为什么需要这个概念？**'
  - '- 直接搬运视频必被平台查重判定非原创，导致限流、不通过审核、账号降权'
  - '- 自己拍摄成本高、周期长、新手技术门槛高，混剪是低成本量产素材的唯一出路'
  - '- 需一套针对平台查重原理（MD5、关键帧、像素、音频）的标准化技术对抗SOP'
  - '**核心定义**'
  - '- 混剪去重七步法：针对抖音/视频号查重机制，制定的七步技术处理流程：调参数、加特效、变速、镜像、贴纸、换BGM、调色'
  - '- 核心目的：修改视频元数据与内容特征，欺骗算法判定为“原创”，通过审核并获取推荐'
  - '**关键性质**'
  - '- 对抗性进化：平台查重算法迭代，去重手段需同步升级（如从MD5进化到关键帧/像素指纹）'
  - '- 成本效率比：单条视频去重处理成本极低（分钟级），远低于原创拍摄成本'
  - '- 合规边界：仅解决“过审”问题，不解决“转化”问题，烂素材去重后依然烂'
  - '**典型例子**'
  - '- 从抖音/快手搬运竞品口播带货视频，经七步处理后发布视频号，通过原创审核并跑出ROI'
  - '- 使用剪映/专业去重软件批量处理：修改MD5、翻转画面、调整播放速度、叠加滤镜贴纸'
  - '**边界条件**'
  - '- 素材为王铁律：去重只能解决“原创度”问题，无法拯救“高点击低转化/价值塑造弱”的烂素材'
  - '- 版权风险：深度搬运同行素材存在被原作者举报下架风险，混剪不等于合法授权'
  - '- 平台打击升级：随着AI识别技术进步，简单七步去重将失效，需向二创/深度混剪进化'
  sources:
  - paper: docs/202305/20230516_086.md
    role: origin
  - paper: docs/202305/20230516_082.md
    role: apply
  excerpts:
  - 上有规则，下有对策，我们只要把视频改了，避开机器查到就行，以下 7 步操作，就可以把算法也搞懵逼！
  - 1、抖音查重原理... 2、去重技术... 以下 7 步操作...
  - 素材搬运消重SOP：抖音/快手搬运(优选口播)→采集软件解MD5→剪映/CR解搬运痕迹→消重软件解审核重复
- 'no': 4
  name: 螺旋算法/漏斗转化/ECPM竞价底层逻辑 —— 视频号投流的“数学底牌”
  points:
  - '**为什么需要这个概念？**'
  - '- 不懂底层分配逻辑，投流就是盲人摸象，无法通过数据反推优化动作'
  - '- 需理解为何挂车视频流量少、为何计划突然不消耗、为何高点击不转化'
  - '- 唯有掌握ECPM=估算点击率×估算转化率×目标出价×1000，才能主动博弈算法'
  - '**核心定义**'
  - '- 非挂车视频评判维度：完播率、点赞率、评论率、转发率、关注率、主页访问率'
  - '- 挂车视频评判维度：点击率、转化率、GPV、GPROI、人均观看时长、完播率'
  - '- ECPM公式：ECPM = 估算点击率 × 估算转化率 × 目标出价 × 1000（平台流量分配核心指标）'
  - '**关键性质**'
  - '- 挂车流量衰减机制：因增加商业化考核指标，权重分配更严苛，流量通常小于非挂车视频'
  - '- 竞争力动态重算：系统根据实时出单数据重算ECPM，点击/转化不理想则排名靠后被挤压'
  - '- 正负反馈平衡律：每个负反馈（降价）必须配套正反馈（加预算/换素材/延时长），否则算法判定“不想跑了”'
  - '**典型例子**'
  - '- 计划跑得好突然不消耗：排除余额/发货率后，核心是ECPM重算发现转化率不理想，被同行挤下去'
  - '- 高点击低转化素材：价值塑造不到位或市场饱和，投流只能放大优质素材，无法拯救烂素材'
  - '- 千川高峰期抢量：手动出价+2小时+1.2倍佣金起步，消耗70%降价5%迭代，平衡流速与利润'
  - '**边界条件**'
  - '- 算法黑箱：ECPM为估算值，非完全透明，仅能通过现象反推规律，不可迷信公式参数'
  - '- 素材生命周期：同一素材随投放时间衰减，创意挤压不可逆，需持续产出新素材接力'
  - '- 品素决定论(70/30)：品与素材贡献度超70%，投放技巧不超30%，90%问题根因指向品素'
  sources:
  - paper: docs/202305/20230516_086.md
    role: origin
  - paper: docs/202305/20230516_082.md
    role: improve
  excerpts:
  - A. 非挂车视频评判维度：完播率、点赞率、评论率、转发率、关注率、主页访问率
  - B. 挂车视频评判维度：点击率、转化率、GPV、GPROI、人均观看时长、完播率...
  - ECPM = 估算点击率 * 估算转化率 * 目标出价 * 1000
  - 这就回答了大家问的比较多的挂车流量少的原因... 提升商品点击率、转化率、GPV
  - 最大的可能就是你的计划竞争力不足，ECPM 值排名靠后... 系统就根据你的出单情况重新计算你的 ECPM 值
- 'no': 5
  name: 随心推全生命周期投放策略 —— 从“养模型”到“反推千川”的数据接力
  points:
  - '**为什么需要这个概念？**'
  - '- 随心推是视频号投流的“练兵场”，新手不懂分阶段操作极易亏损跑飞'
  - '- 需一套分阶段（测品/优化/高峰/过渡）的标准化投放SOP，实现数据资产积累与跨工具复用'
  - '- 核心痛点：测品期如何容忍亏损？高峰期如何抢量？数据如何反推千川出价？'
  - '**核心定义**'
  - '- 测品期：系统智能投放、自动出价、24小时、亏损容忍、堆数据养模型（信抖音机器比人懂用户）'
  - '- 优化期：ROI目标出价（不低于保本ROI），筛选稳定出单素材'
  - '- 高峰期：手动出价、2小时、1.2倍佣金起步、消耗70%降价5%迭代、寻找流速利润平衡点'
  - '- 过渡期：利用随心推跑出均价反推千川初始出价（均价×佣金率），过新手期(20单)后出价÷1.2'
  - '**关键性质**'
  - '- 时间价值模型：投放时长越长（24h），算法探索成本越低；时长短则单价高易跑飞'
  - '- 数据资产复用：随心推跑出的“平均客单价/转化率/ROI”可直接映射为千川放量参数'
  - '- 赔付兜底机制：达标条件（6赞/6关注/6单→更新4单）可触发平台赔付，实现“不太会亏钱”大额放量'
  - '**典型例子**'
  - '- 随心推跑出总销售额39921.20、订单591、均价67.55、佣金50%，反推千川初始出价33.78，过新手期降至28.15稳定跑量'
  - '- 高峰期实操：早/中/晚三波高峰建计划，1.2小时消耗70%则降价5%，直到既能消耗又盈利'
  - '**边界条件**'
  - '- 随心推非一本万利，行业绰号“随心亏”，无亏损心态与资金垫付能力不可玩'
  - '- 赔付机制有门槛（需达标），且仅覆盖部分空消耗，不能作为盈利核心依赖'
  - '- 智能投放依赖算法模型成熟度，新品类/冷门品类可能因样本不足导致模型失效'
  sources:
  - paper: docs/202305/20230516_086.md
    role: origin
  - paper: docs/202305/20230516_082.md
    role: apply
  excerpts:
  - 新手不要选“自定义定向投放”，你要相信，抖音机器，比你更懂抖音用户... 无脑选“系统智能投放”，自动出价，就 ok
  - 站在抖音的角度去想这个问题... 你给抖音的时间少了，算法要给你调用更多的服务器资源，所以帮你找客户的成本就变高了
  - 随心推新功能，直接投 Roi... 高峰期可以手动出价，2 小时，智能推荐，佣金的 1.2 倍开始测出价...
  - 如何利用随心推测千川出价？... 平均客单价=总销售额 ÷ 总订单数 ... 一般佣金多少直接出多少... 过了新手，立马改一个出价... 原有出价 ÷ 1.2
- 'no': 6
  name: 千川计划冷启动与算法博弈标准化动作 —— 让算法为你打工的“驯兽术”
  points:
  - '**为什么需要这个概念？**'
  - '- 千川是放量主战场，但门槛高、易跑飞、学习期易卡死，无标准化动作等于送钱给平台'
  - '- 需一套从搭建、学习期、稳定期到衰退期的全生命周期操作手册，将算法博弈显性化、流程化'
  - '- 核心矛盾：想要流量（正反馈）又要控成本（负反馈），如何在博弈中实现正反馈≥负反馈？'
  - '**核心定义**'
  - '- 搭建期：莱卡定向覆盖>5亿（底线）、保守出价(佣金÷1.2)、开启成本保障/控成本投放'
  - '- 学习期：高价亏本+一键起量(2-6小时)/高峰期前半小时预热，强行喂数据换模型成熟'
  - '- 稳定期：正负反馈平衡（降价必加预算/延长时长/换优质素材）、规避创意挤压（素材同质化）、素材同质化自查'
  - '- 博弈核心：每个操作都要让平台有益（ECPM最大化），不能让负反馈多于正反馈'
  - '**关键性质**'
  - '- 5亿人群红线：莱卡定向覆盖<5亿必放宽，防止模型收窄导致跑量困难或成本失控'
  - '- 保守出价安全线：出价≤佣金÷1.2（前提开成本保障），防跑飞的最后防线'
  - '- 一键起量杠杆：学习期利用工具强行跑量喂模型，以亏本换模型精准度，属战略性投入'
  - '**典型例子**'
  - '- 新计划搭建：自定义定向卡到覆盖刚好>5亿，出价设佣金/1.2，开成本保障，提交审核'
  - '- 学习期操作：出价拉高至1.5-2倍佣金，开一键起量2-6小时，配合高峰期预热，跑够20单出新手期'
  - '- 稳定期维护：发现转化率下降→降价5%（负反馈）的同时，加预算10%/换新素材/延时长2小时（正反馈）'
  - '**边界条件**'
  - '- ECPM竞争力不足会导致计划突然死掉：优化素材/优化定向商品/智能放量是唯一自救手段'
  - '- 素材同质化/创意挤压：同一素材多计划跑/同行跑同素材，会相互抢量导致成本飙升'
  - '- 账号权重上限：单账号承载计划数有限，规模化需矩阵账号分摊计划，避免单号权重透支'
  sources:
  - paper: docs/202305/20230516_086.md
    role: origin
  - paper: docs/202305/20230516_082.md
    role: apply
  excerpts:
  - 这些定向，也就是行业内叫的莱卡... 覆盖人群，不能低于 5 亿... 如果是保守的玩家... 出价 ≤ （佣金÷ 1.2 ）... 可前提是计划 成本保障生效中
