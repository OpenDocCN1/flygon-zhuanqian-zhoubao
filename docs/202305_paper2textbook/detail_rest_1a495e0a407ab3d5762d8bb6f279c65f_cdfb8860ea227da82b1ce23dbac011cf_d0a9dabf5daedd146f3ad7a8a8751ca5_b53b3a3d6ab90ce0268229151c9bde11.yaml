learning_targets:
- 理解PPT项目拆解IP、写作BOSS模式、抖音养生号三大知识付费/内容电商模式的核心逻辑与适用场景
- 掌握'前端公域引流-后端私域转化'商业闭环的标准化搭建流程（账号定位、爆款内容生产、钩子设计、朋友圈运营、咨询式成交）
- 熟练运用'对标拆解-像素级模仿-微创新'的内容生产方法论，以及'MVP先卖再做'的产品迭代策略
- 掌握多平台（抖音/小红书/闲鱼/拼多多/视频号）开店、合规引流、私域分层定价、团队化交付的实操SOP
- 建立'执行力>完美主义''赛道决定上限细节决定下限''私域是放大器公域是放大镜''利他思维作护城河'等底层认知模型
- 识别平台风控红线（虚拟类目限制、学术合规、315打压、混剪举报、无人直播灰产风险）与规避策略
concept_map:
- 知识付费与内容电商实战体系
- ├── PPT项目拆解IP模式（木子田案例）
- │   ├── 核心定位：刚需强、变现路径清、复购高、交付标准化
- │   ├── 冷启动：对标拆解建库 → 照搬微创新
- │   ├── 爆款四要素：统一封面大字报、黄金3秒钩子、BGM卡点、快节奏剪辑
- │   ├── 私域转化：工具型钩子(源文件/素材包) > 资料型钩子、朋友圈三段式(专业/生活/营销5:3:2)、咨询式成交五步法
- │   ├── 产品迭代：1对1陪跑打磨SOP/FAQ → 降维标品规模化
- │   └── 核心定律：执行力>完美主义、赛道定上限细节定下限、私域放大器公域放大镜、利他思维作护城河
- ├── 写作BOSS模式（饭饭案例）
- │   ├── 核心跃迁：写手(卖时间) → 老板(卖系统/获客渠道/供应链/风控)
- │   ├── 平台矩阵：闲鱼(高客单首选)/小红书(高净值)/拼多多(流量大易封)/淘宝(竞争烈)/抖音视频号
- │   ├── 合规引流库：拼多多发文件/截图、闲鱼电话/图片、小红书大小号联动、抖音粉丝群托管
- │   ├── 私域分层定价：物理隔离微信号(微信A高客单/微信B低客单)实现价格歧视利润差40%+
- │   ├── 客户分级：质量导向/救急应付/低价比价(过滤第三类)
- │   ├── 团队进化：外包同行 → 兼职写手 → 收费招募培训 → 整合上游成供给中心
- │   ├── AI降本：角色设定→大纲→分段写作→口语化润色→搜爆文反哺指令
- │   ├── 合规红线：禁接学术论文、315主动下架避险、垂直深耕建专家护城河
- │   └── 服务超预期：定金验收+拒绝一次性生意 → 复购70%+ LTV最大化
- └── 抖音养生号/中医号（微笑案例）
- '    ├── 核心逻辑：借中医大师势能 + 中老年精准粉 + 橱窗带货'
- '    ├── 三式起号：混剪/缅怀/图文经方(5天千粉最快)'
- '    ├── 选品双引擎：巨量百应榜单筛选(爆款视频/图书教育/作者等级0/近24h) + 对标日志追踪(20-30账号/日记录销量/高赞视频)'
- '    ├── 1:1像素级模仿三形态：混剪(音画一致+70%画中画)、实拍(逐镜头复刻)、真人出境替代(图文+音频/二创混剪避举报)'
- '    ├── 测品置换策略：新号无人直播测3天/日发5条 → 不爆换号/旧号转短视频 → 爆品验证后全矩阵切短视频跟品'
- '    ├── 核心心法：同行最好老师先抄后超、执行力与隐性资本(作息/习惯/读书)定上限、团队透明化鼓励单干再谈分成'
- '    └── 边界风险：混剪/无人直播属灰产生命周期短、对标日志依赖人力难自动化、真人出境模仿门槛高'
life_analogy:
- 把知识付费项目想象成**开一家'标准化连锁餐厅'**：
- '- **选品/赛道** = 选址(人流量/消费力/竞争度) —— PPT/写作/养生都是''黄金地段''刚需赛道'
- '- **对标拆解/像素级模仿** = 照抄''肯德基/麦当劳''的标准化操作手册(SOP) —— 从炸鸡温度到摆盘角度全复刻，先跑通再优化'
- '- **公域流量(抖音/小红书/闲鱼)** = 商场自带客流/广告位 —— 利用平台算法''放大镜''筛选精准食客'
- '- **私域(微信/朋友圈/社群)** = 会员体系/私房菜单 —— 高频触达、深度信任、高客单复购的''放大器'''
- '- **引流钩子(源文件/素材包/试吃装)** = 门口''免费试吃/送小礼品'' —— 低成本高感知价值，筛选付费意向'
- '- **咨询式成交/分层定价** = 店长根据食客穿着/点单推荐''套餐A/套餐B'' —— 同质服务不同画像差异化定价'
- '- **MVP先卖再做/陪跑打磨标品** = 先做''外卖测试款/限量尝鲜''收反馈 → 再上''正式菜单''规模化供应'
- '- **利他思维/服务超预期** = 海底捞式服务 —— 不是为了单次翻台率，而是为了让食客带全家再来、带朋友再来(LTV最大化)'
- 就像连锁餐厅：选对赛道(地段)是生死线，标准化SOP(手册)是复制基石，私域会员体系(放大器)是利润池，利他服务(护城河)才能穿越周期。
summary:
- concept: PPT项目拆解IP
  desc: 将复杂PPT拆解为可学步骤教程，打造抖音知识付费IP，通过前端引流后端变现实现47天16.7万变现
- concept: 前端引流-后端变现模型
  desc: 抖音公域获客筛选精准用户(放大镜)，微信私域高频触达深度信任最大化单客价值(放大器)
- concept: 对标拆解-像素级模仿
  desc: 寻找10-20个对标账号拆解爆款逻辑建库，1:1复刻选题/封面/文案/BGM/剪辑为基线再微创新
- concept: MVP思维/先卖再做
  desc: 课程未完善前先低价内测版/1对1陪跑售卖，用市场验证打磨SOP/FAQ再规模化交付降维打击
- concept: 写作BOSS模式
  desc: 从卖写作时间(写手)跃迁为卖获客渠道/转化体系/写手团队/AI工具的商业系统(老板)，年入50万+团队月入11万
- concept: 电商平台代写模式
  desc: 利用拼多多/闲鱼/小红书搜索流量获精准客户，合规引流至私域成交，规避平台虚拟类目限制与佣金
- concept: 私域分层定价体系
  desc: 按来源平台用户画像物理隔离微信号(微信A接高客单/微信B接低客单)，同质服务差异化定价利润差40%+
- concept: 回忆录代写赛道
  desc: 针对人生记录/家族传承刚需，客单1-2万+复购低推荐高，年增长10%蓝海，核心难点在获客非写作
- concept: 抖音养生号(中医号)
  desc: 借中医大师IP势能输出养生内容吸引中老年粉开橱窗带货，图文经方5天千粉最快
- concept: 巨量百应榜单+对标日志双引擎选品
  desc: 榜单筛选近24h作者等级0爆款视频锁定同行最新爆品，日志追踪20-30对标账号销量捕捉零延迟跟品信号
- concept: 1:1像素级模仿三形态
  desc: 混剪(音画一致+70%画中画)、实拍(逐镜头复刻)、真人出境替代(图文+音频/二创混剪避举报风险)
- concept: 无人直播测品-矩阵置换
  desc: 新号千粉上无人直播测3天/日发5条不爆换号，爆品验证后全矩阵切短视频跟品，以量博爆
- concept: 同行是最好老师先抄后超
  desc: 所有技术门槛均可通过模仿跨越，以已验证爆款为标准1:1复刻为基线熟练后再优化迭代
- concept: 执行力与隐性资本决定上限
  desc: 项目技术含量低核心竞争力在长期执行力，作息/习惯/读书等内功心法支撑身心状态是真正护城河
- concept: 利他思维/服务超预期作护城河
  desc: 真心帮用户解决问题而非割韭菜，定金验收+超预期交付获得口碑裂变高复购抗风险，单客下单10次+常态
exercises:
- 'no': 1
  title: PPT项目拆解IP冷启动实战推演
  contents:
  - 假设你决定从零开始做PPT项目拆解抖音号，请完成以下推演：
  - 1. 定位阶段：在抖音搜索'PPT教程/拆解/动画'，筛选10个粉丝1-5万、近期有爆款视频的对标账号，记录其：主页封面风格、最近3条爆款视频的选题/标题/前3秒钩子/BGM/变现路径(挂小程序/引流私域卖课/卖模板)。
  - 2. 起号阶段：基于对标数据，规划你前10条视频的选题表(含选题方向、预计封面大字报文案、核心痛点/结果)，并设定发布节奏(前3天日更3条/后续日更5条)。
  - 3. 钩子设计：对比'PPT电子书合集'、'PPT动画源文件包'、'配色表/字体包'、'拆解思维导图'四种钩子，分析哪种'即拿即用'感知价值最高、制作成本最低、最能筛选高意向付费用户？
  - 4. 私域转化：设计从'加微信'到'成交999元课程'的3条咨询式话术路径(分别针对：零基础小白/有一定基础想接单/企业内训需求)，包含诊断问题、锚定价值、展示案例、限时促单关键节点。
  - 回答问题：
  - '- 为什么统一封面风格(大字报+固定配色+头像)能将主页转粉率从个位数提升至10%+？'
  - '- ''先做1对1陪跑再降维标品''相比''直接录制标品课程''的核心优势是什么？'
- 'no': 2
  title: 写作BOSS模式多平台开店与合规引流压力测试
  contents:
  - 你计划在闲鱼、小红书、拼多多三个平台同步开设代写店铺，请针对每个平台完成：
  - 1. 开店配置清单：店铺类型选择(个人/个体/企业)、保证金预算、类目关键词布局、安全标题模板(规避违禁词/4万保证金陷阱)、详情页核心截图内容。
  - 2. 合规引流话术设计：针对各平台风控特性，编写3套'不违规留微信'标准化话术/图片方案(闲鱼：电话沟通/图片引流；小红书：大小号联动/评论区图片；拼多多：发文件诱导回联系方式/截图微信号)。
  - 3. 私域分层定价策略：设计微信A(承接闲鱼/小红书/淘宝高净值客户)与微信B(承接拼多多价格敏感客户)的报价表差异，同一份'5000字演讲稿'在两个微信上的报价差异合理区间是多少？如何通过朋友圈差异化运营支撑价格锚定？
  - 4. 客户分级筛选：新咨询客户发来'多少钱/能不能便宜/先发我看看'，如何用3个追问在5分钟内判断其属于'质量导向/救急应付/低价比价'哪一类，并给出对应处理策略？
  - 回答问题：
  - '- 为什么''严禁接学术论文''虽然流失40%咨询量，反而能保全店铺权重垂直度、账号长寿命与品牌专业度？'
  - '- ChatGPT辅助写作''角色设定→大纲→分段写作→口语化润色→搜爆文反哺''流程中，哪一步最能体现''非机械化复制''的核心价值？'
- 'no': 3
  title: 抖音养生号选品跟品与矩阵置换实战沙盘
  contents:
  - 模拟你运营5个养生号矩阵(均已千粉)的单日操作流程：
  - 1. 选品会议(每日早9点前)：登录巨量百应创意中心，按'爆款视频-图书教育-图书-作者等级0-近24小时'筛选条件，导出前20条带货视频数据(视频链接/商品/销量/佣金/点赞/对标账号)；同步记录你维护的20个对标账号橱窗销量日志(昨日销量/增量/近24h高赞视频)。
  - 2. 跨验证决策：将榜单商品与日志高赞商品交叉对比，圈出'双重验证'的爆品候选(如'面相书籍'同时出现在榜单TOP3和3个对标账号高赞视频中)。
  - 3. 1:1模仿执行：针对圈定爆品，分配5个账号按三形态分工模仿(2个混剪/2个实拍/1个图文+音频)，要求：混剪保证音画一致+70%画中画原创；实拍逐镜头复刻构图/光线/动作；图文版提取核心卖点文案配大师原音频。
  - 4. 测品置换操作：新起号A/B/C三号上无人直播(日发5条/测3天)，旧号1/2发短视频跟品；若新号A第2天出单，则B/C停止直播转短视频跟品，旧号1/2继续发；若3天均无单，A/B/C全部停播换新号，旧号1/2维持。
  - 5. 数据复盘看板：建立日度看板记录：测品数/出单品数/单品日佣/素材制作耗时/违规预警/账号权重变化。
  - 回答问题：
  - '- 为什么''对标账号橱窗销量日志追踪(人工日记录20-30账号)''这种笨方法，反而被月入5-10万大佬悄悄用且有效？'
  - '- 无人直播''新号权重期易起量''的底层逻辑是什么？平台风控收紧后该策略失效的信号有哪些？'
