desc: 该素材为一篇工具推广实战分享，作者开发并验证了一个基于巨量百应数据的选品神器，该工具集成了爆款视频筛选、选品决策及素材下载功能，旨在帮助用户零成本获取抖音爆款素材并快速变现，且已在视频号项目中得到金钱验证。
concepts:
- name: 巨量百应选品神器
  desc: 作者自主开发的工具，整合巨量百应数据源，集选品分析、爆款视频筛选、素材下载于一体，旨在替代第三方付费工具。
  is_original: true
  excerpt:
  - 我这里分享一个刚刚开发出来的工具，这个巨量百应工具已经在视频号上得到过金钱上验证。
  - 用的好从此不用购买第三方工具，就可以直接下载爆款素材，所谓选品+爆款素材集一身。
