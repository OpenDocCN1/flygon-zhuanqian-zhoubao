paper: docs/202305/SUMMARY.md
desc: 该素材为“龙哥赚钱周报”2023年5月期汇总目录，收录了生财有术社群内成员的实战复盘与方法论分享。核心覆盖认知升级（利他思维、执行力、个人IP）、AI工具变现（ChatGPT、MJ、SD自动化流程）、多平台流量运营（小红书、抖音、视频号、公众号、闲鱼、快团团、海外社媒）、具体项目拆解（无货源电商、知识付费、短剧CPS、二奢、B2B独立站、Web3）及心态建设。素材以“小航海”项目制训练营为载体，强调从0到1跑通闭环、标准化SOP复制放大、低成本试错及私域转化，展示了普通人利用互联网杠杆与AI工具实现副业增收至全职创业的完整路径图谱。
concepts:
- name: 生财小航海
  desc: 社群发起的项目制训练营模式，设定明确目标、时间节点与导师陪跑，强制成员在规定周期内跑通0-1商业闭环，是素材中大量案例的共同孵化器。
  is_original: true
  excerpt:
  - 新手小白如何借助生财小航海每月多赚 2 万元（附：小航海项目筛选模型）
  - 从 0 开始借助 ChatGPT 变现 7k 入生财经历分享
  - 如何利用生财航海每月多赚 2 万元？
- name: 不出镜个人IP
  desc: 不露脸、不拍摄真人视频，通过整理资料、AI生成内容、笔记类账号等形式建立个人品牌，实现高信任度转化与变现的低门槛路径。
  is_original: true
  excerpt:
  - 打造“不出镜”个人 IP，10 个月变现 7 位数的方法论
  - 打造“不出镜”个人IP，10个月变现7位数的方法论！
- name: 资料整理引流法
  desc: 通过整理高价值垂直领域资料（如考证、教程、资源包）作为钩子，在公域平台（小红书、抖音、公众号）引流至私域，再通过后端产品/服务变现的标准化流程。
  is_original: true
  excerpt:
  - 资料整理日均引私域 180+ 用户，最重要的是提供附加产品-解决问题的方案
  - 实操：资料整理日均引私域180+用户，但，最重要的是提供附加产品/解决问题的方案！
- name: AI内容自动化流水线
  desc: 结合ChatGPT（文本生成）、Midjourney/SD（图像生成）、RPA/自动化工具（如剪映、Coze、Make/Zapier），构建从选题、生产、发布到数据反馈的全自动化内容生产系统。
  is_original: true
  excerpt:
  - 通过 ChatGPT+RPA 13 次拖拽实现文案全流程自动化
  - 【短剧CPS】如何利用ChatGPT批量生产解说类短剧视频
  - 用AI搞钱|批量生成表情包引流变现（附实操教程）
  - 利用Colab和Stable Diffusion实现云端、免费、自动、批量、无限AI出图
- name: 平民开店/无货源电商模型
  desc: 无需囤货、供应链轻量化，利用平台流量红利（小红书店铺、闲鱼、快团团、抖音小店）通过选品、铺货、客服外包实现低风险电商变现。
  is_original: false
  excerpt:
  - 小红书无货源电商三个月营收 50 万经验分享
  - 闲鱼矩阵一套打法如何当天出单七天爆单
  - 1.8 万字保姆级闲鱼无货源，做闲鱼必看的超详细干货
  - 一个热衷搞钱的二胎全职妈妈，如何在一个月成为快团团 GMV 7W 的团长
- name: 利他思维
  desc: 在商业协作中，优先考虑为对方/用户创造价值、解决问题，而非单向索取。素材中被视为生财圈核心文化基因，也是高客单价、高复购业务的底层逻辑。
  is_original: false
  excerpt:
  - 来生财一年后我终于明白什么是“利他”
  - 资料整理日均引私域 180+ 用户，最重要的是提供附加产品-解决问题的方案
- name: 百年不改名，全域用同名
  desc: 个人IP建设的品牌一致性原则：在所有公域平台（抖音、小红书、微信、B站等）使用统一ID、头像、简介，降低用户认知成本，积累复利品牌资产。
  is_original: true
  excerpt:
  - 价值千万的个人 IP 策略-百年不改名，全域用同名
methods:
- name: __overview__
  desc: 素材整体方法论：以‘小航海’为训练场，遵循‘认知对齐 -> 赛道筛选 -> 标准化SOP执行 -> 低成本MVP验证 -> 复盘优化 -> 规模化放大’的闭环。核心战术为‘公域内容获客(SEO/算法推荐)
    -> 私域信任转化(朋友圈/社群/1v1) -> 后端高客单产品变现’，并大量辅以AI工具提效与矩阵号操作。
  excerpt:
  - 新手小白如何借助生财小航海每月多赚 2 万元（附：小航海项目筛选模型）
  - 如何打通公域平台陌生流量成交渠道
  - 解决真正的问题，而不是试图解决所有问题
  - 利用生财思维，我跑通了一个没见过的小项目，8 块钱成本一个月小赚 2w 多
- name: 小航海项目筛选模型
  desc: 筛选适合新手的项目标准：1.正向现金流快；2.无需复杂供应链/囤货；3.可标准化/SOP化；4.可借力AI工具提效；5.有明确的公域获客路径（搜索/推荐）；6.后端有高复购/高客单产品。
  excerpt:
  - 新手小白如何借助生财小航海每月多赚 2 万元（附：小航海项目筛选模型）
  - 如何利用生财航海每月多赚 2 万元？
- name: ChatGPT+RPA文案自动化13步法
  desc: 将文案创作拆解为13个结构化提示词节点（选题、大纲、钩子、正文、标题、标签等），配合RPA工具（如按键精灵、Auto.js、Coze工作流）实现批量生成、定时发布、数据回收的无人值守流程。
  excerpt:
  - 通过 ChatGPT+RPA 13 次拖拽实现文案全流程自动化
  - 通过ChatGPT+RPA 13次拖拽实现文案全流程自动化
- name: 小红书‘探照灯计划’/笔记引流SOP
  desc: 针对小红书平台机制的标准化操作：账号养号(设备/环境) -> 垂直领域选题(关键词挖掘) -> 封面/标题/正文/标签/评论区五要素优化 -> 诱饵设计(资料/群/号)
    -> 私域承接(主页/私信/群聊) -> 朋友圈运营/转化话术。
  excerpt:
  - 小红书探照灯计划，普通人有机会入局赚到钱的赛道真的来了
  - 小红书测试 2 个月的七点总结
  - 通过优化后端朋友圈和话术，实现小红书资料引流月入 5 万+的复盘
  - 小红书无货源电商三个月营收 50 万经验分享
- name: 视频号短视频挂车投流标准化打法
  desc: 视频号带货最稳定路径：选品(选品广场/榜单) -> 爆款视频二创/混剪(去重) -> 挂车 -> 千川/投流工具测款(ROI>1.2) -> 放量
    -> 矩阵号复制。强调‘赚钱的事多做十遍’的执行力。
  excerpt:
  - 从 0 到 1 全流程跑通，目前视频号最稳定的带货玩法--短视频挂车投流
  - 视频号还能做吗，三个月通过视频号赚 20W
  - 80 后生财圈友分享视频号带货经验，赚钱的事多做十遍
- name: 闲鱼矩阵霸屏/无货源SOP
  desc: 多店铺(7-10个)+ 选品(季节/蓝海/高客单) + 养号(实名/芝麻信用/发帖频次) + 批量发品(工具/手工) + 话术转化(自动回复/引导加微)
    + 供应链对接(一件代发/1688/拼多多) 的标准化运营体系。
  excerpt:
  - 闲鱼矩阵一套打法如何当天出单七天爆单
  - 1.8 万字保姆级闲鱼无货源，做闲鱼必看的超详细干货
  - 闲鱼 7 个店铺如何霸占前排达到月销千单
  - 4 年 400+ 店铺闲鱼运营经验—深度总结六问六答
- name: 海外独立站B2B冷启动流程
  desc: 0预算/低预算跑通海外B2B订单：细分Niche选品(工具/数据) -> 独立站搭建(Shopify/WP) -> 内容SEO/社媒矩阵(Ins/FB/LinkedIn/TikTok)获客
    -> 询盘跟进/报价/成交 -> 收款(Wise/Payoneer) -> 复购/转介绍。
  excerpt:
  - 25 天成交一个海外独立站 B2B 客户，入账$4551.7 美金，我做对了什么？
  - 7 天内从 0 到 1 利用 Instagram+Facebook 完成私域变现 2000 刀
- name: Stable Diffusion云端零成本批量出图方案
  desc: 利用Google Colab免费GPU资源，部署SD WebUI (A1111/ComfyUI)，配合模型下载脚本、API调用、定时任务，实现无需本地显卡、无限时长、可编程的批量AI绘图生产线，用于表情包、壁纸、电商图、IP形象生成。
  excerpt:
  - Stable Diffusion 使用教程，看这一篇就够了
  - Stable Diffusion 应用场景和模型训练
  - 《Stable Diffusion终极宝典》
  - 利用Colab和Stable Diffusion实现云端、免费、自动、批量、无限AI出图
theorems:
- name: 执行力 > 创意/认知
  desc: '[claim] 好主意很多，做下去的很少。认知突破的本质是在行动中获得反馈修正认知，而非空想。赚钱的核心是‘解决真正的问题，而不是试图解决所有问题’，并‘赚钱的事多做十遍’。'
  excerpt:
  - 《好主意很多，做下去的很少》
  - 《如何实现认知突破？》
  - 《解决真正的问题，而不是试图解决所有问题》
  - 80 后生财圈友分享视频号带货经验，赚钱的事多做十遍
- name: 个人IP是普通人最高杠杆的资产
  desc: '[claim] 个人IP具有‘百年不改名，全域用同名’的复利效应。出名是赚钱的代价，但也是获取信任、降低获客成本、实现被动收入的核心护城河。不出镜也能打造IP（资料号、工具号、笔记号）。'
  excerpt:
  - 《出名是赚钱的代价》
  - 价值千万的个人 IP 策略-百年不改名，全域用同名
  - 打造“不出镜”个人 IP，10 个月变现 7 位数的方法论
  - 32 万小红书博主的小红书涨粉变现之路复盘
- name: 私域是变现的‘提款机’，公域是‘蓄水池’
  desc: '[claim] 所有平台玩法最终归宿为‘公域引流 -> 私域沉淀 -> 朋友圈/社群运营 -> 高客单/高复购转化’。资料整理、钩子设计、后端话术、附加产品/服务是私域转化率的核心决定因素。'
  excerpt:
  - 《如何打通公域平台陌生流量成交渠道》
  - 资料整理日均引私域 180+ 用户，最重要的是提供附加产品-解决问题的方案
  - 通过优化后端朋友圈和话术，实现小红书资料引流月入 5 万+的复盘
  - 小红书虚拟项目赛道选择、转化思路的案例拆解及全方位实操经验分享
- name: AI是放大器而非救世主，核心竞争力在于‘提示词工程+业务流程拆解+自动化串联’
  desc: '[claim] 单纯会用ChatGPT/MJ不赚钱，必须将业务拆解为标准化SOP，注入Prompt工程，再用RPA/代码/低代码平台串联成自动化流水线，才能构建护城河。AI降低了‘从0到1’的技能门槛，但提高了‘从1到N’的标准化要求。'
  excerpt:
  - 从 0 开始借助 ChatGPT 变现 7k 入生财经历分享
  - 如何利用 AI 搞钱，MJ 批量生成表情包 - 快速涨粉
  - 通过 ChatGPT+RPA 13 次拖拽实现文案全流程自动化
  - 从 AI 四维预测说起 -- 把想法变成钱
- name: 承认无能与无知，是成长的起点
  desc: '[claim] 普通人逆袭的第一步是接纳自己‘无能、无知、无资源’的现实，放下体面，从最微小、最具体、最确定的正反馈动作做起（如抄作业、跟航海、卖资料），在实战中迭代认知。'
  excerpt:
  - 《承认自己的无能和无知》
  - 我是如何白手起家赚到第一个 1000 万？
  - 从年负债 19 万，到眼光敏锐投资年净收益近百万
  - 意外搞到 3 万块，不要全职自媒体
