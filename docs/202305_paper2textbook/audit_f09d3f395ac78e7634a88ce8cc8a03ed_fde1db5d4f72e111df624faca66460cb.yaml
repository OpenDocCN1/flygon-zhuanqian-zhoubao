unsupported_claims:
- location: 16.3 核心定义
  claim: 作者在《需求挖掘与产品化交付通用方法论》中指出，我们要做的就是建立一套标准化的“雷达-探针-瑞士军刀”操作流程。
  reason: 素材中未找到“雷达-探针-瑞士军刀”该表述，仅在16.1生活类比中由本章作者提出，非来源素材观点。
- location: 16.3 边界条件
  claim: 思考能力是核心壁垒：工具、平台、渠道皆为基建，门槛趋近零；自我设限（不专业、不会技术）是最大拦路虎
  reason: 素材中虽有“思考以及思考产生的创意，才是最可贵的”但未系统表述为“思考护城河论”或“自我设限是最大拦路虎”，属本章作者提炼升华。
- location: 16.4 核心定义
  claim: 评论区需求验证法的操作步骤：1. 进入短视频/内容平台搜索核心关键词 2. 深度分析高赞/高频评论内容 3. 重点捕捉三类强信号...
  reason: 素材中仅提及“搜索四维彩照，看相关内容的评论区都在说啥”“去看同行的评论区，是最能直接验证需求的”，未给出结构化操作步骤。
- location: 16.5 核心定义
  claim: 资源重组交付法包含四步动作：1. 拆解交付物本质 2. 识别核心技能缺口 3. 整合外部现成资源 4. 重组交付流程
  reason: 素材中仅呈现思考一、思考二的碎片化思考过程，未提炼为四步标准化方法论。
- location: 16.6 核心定义：基准案例法
  claim: AI提示词迭代优化法采用逆向思维，不追求“一条Prompt通吃”，而是“基准案例定标准、边界案例测稳健”
  reason: 素材中仅记录实操迭代过程（挑最差图垫图→加负面词→加修饰词→加结构词→回归测试），未提炼命名为“基准案例法”及其核心原则。
- location: 16.7 核心定义
  claim: 热点事件极速入场法全流程：1. 捕捉信号 2. 极速验证 3. 现学现卖 4. 多维变现
  reason: 素材中仅以碳中和项目为例说明流程，未抽象为标准化四步法定义。
- location: 16.8 核心定义
  claim: 非标服务标准化拆解法四步走：1. 需求拆解 2. 流程模块化 3. 关键节点外包/工具化 4. 质检SOP化
  reason: 素材中仅通过点歌、写作店、碳中和案例隐含该逻辑，未显性定义四步法。
- location: 16.9 多源对照表
  claim: 对比了四种主流需求验证流派的核心差异，数据来源为作者实战总结与行业通用认知综合，参考经典文献...
  reason: 素材中完全没有传统调研流、数据分析流、MVP实验流等对比内容，属本章作者综合构建。
- location: 16.10 设计中的取舍
  claim: 问卷调研存在严重的“说做差距”...评论区用户是在非被诱导、真实社交语境下自发表达...
  reason: 素材中未讨论问卷调研与评论区验证的对比优劣，属本章作者事后合理化阐述。
