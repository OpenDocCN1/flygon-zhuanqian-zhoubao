paper: docs/202305/20230516_006.md
desc: 该素材源自小马宋的《创业 46 条》第 16 条，核心观点主张创业者应摒弃理想主义中“打造完美公司”的幻想，承认公司由不完美的人组成、必然存在不可消除的缺陷与矛盾；经营策略应遵循“主要矛盾”原则，识别并聚焦解决当下阶段最关键、甚至危及生存的问题（如现金流），利用业务高速发展掩盖并消解次要问题，对无法彻底解决且非致命的问题（如分配公平感）接受“相对解决”即可，切忌面面俱到、试图解决所有问题。
concepts:
- name: 解决真正的问题
  desc: 指在企业经营中，识别并聚焦解决当前阶段主要矛盾、关乎生存或核心发展的关键问题，而非试图面面俱到解决所有表层矛盾。
  is_original: false
  excerpt:
  - 解决真正的问题，而不是试图解决所有问题
  - 经营公司，不能面面俱到，这根本不可行，你只能在某个阶段解决主要矛盾。
- name: 完美公司幻觉
  desc: 指创业者早期倾向于追求建立无缺陷、全方位完美的组织，但因人性本身的不完美（七情六欲、贪嗔痴慢疑）而注定无法实现。
  is_original: false
  excerpt:
  - 我曾经非常理想主义，创办公司的时候，想着要做一个完美公司。后来发现，这不可能。
  - 公司是由人组成的，而人又是不完美的...我自己也有缺陷，所以我的公司也不可能是一家完美的公司。
- name: 主要矛盾原则
  desc: 将毛泽东哲学思想中的‘主要矛盾’应用于企业管理，主张在特定阶段集中资源解决决定性问题，次要问题随主要问题解决而消失或暂时搁置。
  is_original: false
  excerpt:
  - 你只能在某个阶段解决主要矛盾。
  - 将军赶路，不打小兔，解决主要矛盾，其他的看情况再说。
- name: 问题分层处理框架
  desc: 将公司问题按紧迫性与可解决性分为三类：1. 致命且必解（如现金流）；2. 附随主要问题可自愈（如员工收入抱怨）；3. 非致命且不可彻底解决（如分配公平感），分别采取立刻解决、随主业解决、接受相对解决三种策略。
  is_original: true
  excerpt:
  - 公司的问题有很多种，有些问题解决，公司可能立刻就要关门了，那就要立刻解决...
  - 有些问题呢，可能随着主要问题的解决，它自动就会消失了...
  - 有些问题，你反正也解决不了，你不解决，它也不会把公司弄死，那你就不要追求解决它。
- name: 相对公平
  desc: 指在薪酬分配等利益调整中，无法达成绝对公平（因人性会高估自我贡献，总和超100%），仅能建立客观评价标准实现相对合理，管理者应接受抱怨的常态化存在。
  is_original: false
  excerpt:
  - 这个问题只能相对解决，不能绝对解决。因为人人都会有不公平的幻觉...
  - 公司能做到相对客观评价，有客观的分配标准，就好了，你不能彻底解决员工的抱怨问题。
- name: 业务发展掩盖问题论
  desc: 核心主张高速业务增长是解决内部矛盾的最佳良方，发展带来的增量红利可化解存量博弈的矛盾，符合评论区‘星陈’的总结。
  is_original: false
  excerpt:
  - 核心是让业务高速发展，这样可以掩盖掉很多问题，后面可以慢慢解决。
methods:
- name: __overview__
  desc: 基于‘主要矛盾原则’的动态问题分层决策法：首先诊断问题致命性与可解性，将问题分为‘立即解决（生存型）’、‘随主业自愈（附随型）’、‘接受相对解决（慢性型）’三类；集中资源攻克第一类，推进核心业务带动第二类消失，建立机制管控第三类预期。
  excerpt:
  - 经营公司，不能面面俱到，这根本不可行，你只能在某个阶段解决主要矛盾。
  - 公司的问题有很多种...那就要立刻解决...它自动就会消失了...你就不要追求解决它。
  - 将军赶路，不打小兔，解决主要矛盾，其他的看情况再说。
- name: 现金流急救法
  desc: 针对‘不解决即倒闭’类生存问题，不拘泥手段（贷款、新盈利项目等），单一目标导向快速恢复造血能力。
  excerpt:
  - 比如疫情期间许多线下店的现金流问题，公司业务不足的问题，那不管是贷款还是寻找新的盈利项目，都是要解决现金流问题。
- name: 客观分配标准建立法
  desc: 针对不可彻底解决的公平感问题，不追求‘零抱怨’，而是建立可量化、可复核的客观评价体系，将‘绝对公平’降维为‘相对客观’，管理预期而非消除抱怨。
  excerpt:
  - 公司能做到相对客观评价，有客观的分配标准，就好了，你不能彻底解决员工的抱怨问题。
theorems:
- name: 公司本质不完美定理
  desc: 公司由人组成，人具有不完美本性（七情六欲、贪嗔痴慢疑），因此公司必然不完美；追求‘完美公司’是违背本质的理想主义幻觉。
  excerpt:
  - 公司是由人组成的，而人又是不完美的，人有七情六欲，有贪嗔痴慢疑，公司每个层级的人，都有缺陷，我自己也有缺陷，所以我的公司也不可能是一家完美的公司。
- name: 面面俱到不可行定理
  desc: 企业资源有限、管理半径受限，试图同步解决所有问题会导致战略分散、资源稀释，最终核心矛盾未解而全盘皆错。
  excerpt:
  - 经营公司，不能面面俱到，这根本不可行，你只能在某个阶段解决主要矛盾。
- name: 主要矛盾决定生存定理
  desc: 在特定阶段，存在少数关键问题（如现金流断裂）若不解决将导致系统崩溃（倒闭），解决此主要矛盾是其他一切管理动作的前提条件。
  excerpt:
  - 有些问题解决，公司可能立刻就要关门了，那就要立刻解决，比如疫情期间许多线下店的现金流问题...那不管是贷款还是寻找新的盈利项目，都是要解决现金流问题。
- name: 次要矛盾随主业自愈定理
  desc: 大量表层问题（如员工收入不满）是核心能力不足（业务量小）的投射，解决主要矛盾（业务增长）带来增量资源，次要矛盾可不费单兵作战而自然消解。
  excerpt:
  - 比如员工抱怨公司收入下降，这个问题其实是公司业务能力不足的附带问题，当公司业务多了之后，员工的收入问题也就自动会消失了。
- name: 慢性矛盾不可根治定理
  desc: 源于人性缺陷（如分配公平感）的结构性矛盾，客观上无法绝对解决（贡献估算总和>100%），非致命且治理成本极高，最优策略是机制管控（相对公平）而非追求根治。
  excerpt:
  - 比如员工会抱怨分配不公平。这个问题只能相对解决，不能绝对解决。因为人人都会有不公平的幻觉...谁都觉得自己应该拿到更多。
  - 一个团队，你让每人估算自己的贡献百分比，最后加起来肯定是大于 100%。这是基本人性，你无法解决。
findings:
- name: 疫情期线下店现金流生存案例
  desc: '[evidence] 素材引用疫情期间线下店面临现金流断裂、业务不足的真实场景，验证了‘生存型问题必须立即不惜手段解决’的策略有效性。'
  excerpt:
  - 比如疫情期间许多线下店的现金流问题，公司业务不足的问题，那不管是贷款还是寻找新的盈利项目，都是要解决现金流问题。
- name: 员工收入抱怨随业务增长自愈案例
  desc: '[evidence] 素材观察到员工抱怨收入下降实为业务能力不足的投射，业务增长后抱怨自动消失，支撑‘次要矛盾随主要矛盾解决而自愈’的判断。'
  excerpt:
  - 比如员工抱怨公司收入下降，这个问题其实是公司业务能力不足的附带问题，当公司业务多了之后，员工的收入问题也就自动会消失了。
- name: 贡献估算超100%人性实验发现
  desc: '[evidence] 素材提出一个思想实验/常见现象：让团队成员估算自身贡献占比，总和必然大于100%，实证支撑‘绝对公平不可达成、相对公平为上限’的结论。'
  excerpt:
  - 一个团队，你让每人估算自己的贡献百分比，最后加起来肯定是大于 100%。这是基本人性，你无法解决。
- name: 业务高速发展掩盖问题的实战验证
  desc: '[claim] 评论区用户‘星陈’基于实战经验宣称：核心是让业务高速发展，可掩盖很多问题，后续再慢慢解决；这印证了作者‘解决主要矛盾’的战略价值。'
  excerpt:
  - 核心是让业务高速发展，这样可以掩盖掉很多问题，后面可以慢慢解决。
