learning_targets:
- 理解本章作为教材元数据索引模块的定位与功能，区分可直接学习的知识单元与需外部跳转的参考文献
- 掌握识别“空链接型素材”的特征，避免在教学设计中将其误判为可教学内容单元
- 了解外部知识依赖的风险（链接失效、内容不确定、版权受限）及教材编排中的规避策略
- 能根据素材内容完整度，制定“正文收录/附录引用/废弃处理”三级分流决策
concept_map:
- 外部知识索引模块
- ├── 素材识别特征
- │   ├── 仅含语雀外链，无实质文本    —— P001, P002, P003
- │   ├── 标题与内容可能不符          —— P002
- │   └── 无法提炼概念/方法/案例/主张  —— P001, P002, P003
- ├── 教材编排策略
- │   ├── 定位为“导航/附录”非教学正文  —— 核心定义
- │   ├── 建议移至“参考文献/延伸阅读”  —— 边界条件
- │   └── 不占正文章节编号              —— 边界条件
- └── 外部依赖风险
- ├── 链接失效导致知识断链            —— 关键性质
- ├── 内容不可见无法质量把控          —— 关键性质
- └── 版权/访问权限不可控              —— 关键性质
life_analogy:
- 想象这章是一本教科书末尾的**‘参考文献目录页’**：
- '- **正文章节** = 书里讲透的知识点（有定义、有案例、有练习）'
- '- **本章条目** = 文献列表里只写了‘详见外部链接’的参考文献'
- '- **语雀链接** = 图书馆索书号（只告诉你去哪找，书不在手里）'
- '- **风险** = 借阅证过期/书被借走/书名不对版 → 知识获取链路断裂'
- 就像写论文时‘参考文献’不能算正文字数，教材编排时‘外部索引’也不能算教学章节。
summary:
- concept: 外部知识索引单元
  desc: 教材编排层面的导航模块，汇总仅含外链无正文的素材，不承载可直接教学的知识点
- concept: 语雀文档外链
  desc: 依赖第三方平台承载核心内容，存在链接失效、内容不可见、版权受限等不可控风险
- concept: 素材分流决策
  desc: 依据内容完整度将素材分为：正文收录（完整）、附录引用（仅索引）、废弃处理（无效）三级
- concept: 教材完整性保障
  desc: 通过显性标识‘空链接型素材’，避免教学大纲出现‘空章节’，保证学习路径连贯性
- concept: 元数据溯源
  desc: 保留原始素材来源（文件名、链接、标题），确保教材编排过程的可追溯性与可审计性
exercises:
- 'no': 1
  title: 素材分流决策实战
  contents:
  - 给定以下三个原始素材条目，请判断各自应归入‘正文章节’、‘附录索引’还是‘废弃清理’：
  - 1. 素材A：包含完整的‘闲鱼无货源选品SOP’文本、案例数据、话术模板，共5000字。
  - 2. 素材B：仅有一行‘详见语雀文档：www.yuque.com/xxx/yyy’，标题‘海外投资指南’，无任何正文内容。
  - 3. 素材C：包含‘小红书引流方法论’的核心框架图（Mermaid代码）及关键步骤文字说明，共800字，但缺少实操案例。
  - 回答问题：
  - '- 素材B为何不能作为正文章节？其核心风险点有哪些？'
  - '- 素材C处于边界地带，若作为正文收录需补齐什么关键要素？'
  - '- 教材编排时，如何设计‘素材完整度评估清单’实现自动化分流？'
- 'no': 2
  title: 外部依赖风险压力测试
  contents:
  - 假设教材正式出版后，语雀平台调整权限策略，导致素材B、C对应的外链全部失效（404），请分析：
  - 1. 对已购买教材读者的学习体验造成何种具体影响？
  - 2. 对教材版权方（生财有术/龙哥）的品牌声誉构成何种风险？
  - 3. 若在编排阶段已将此类素材移至‘延伸阅读’附录并附带‘链接可能失效’免责声明，风险等级如何变化？
  - 回答问题：
  - '- 设计一套‘外链存活率监测机制’，包含检测频率、告警阈值、降级预案（如归档快照）。'
  - '- 论证‘自有内容（正文）> 可控外链（友站授权）> 不可控外链（公开文档）’的内容资产护城河层级。'
- 'no': 3
  title: 元数据标准化建模练习
  contents:
  - 请为本章所有‘外部索引型素材’设计一份结构化元数据表（JSON Schema），要求包含以下字段：
  - '- source_id (原始素材文件名，如 20230516_043.md)'
  - '- external_url (语雀文档完整URL)'
  - '- claimed_title (链接标注的标题，如‘海外平台’)'
  - '- content_visibility (内容可见性：none/summary/full)'
  - '- risk_level (风险等级：high/medium/low，依据：链接域名权威性、访问权限、历史稳定性)'
  - '- recommended_action (建议动作：archive_to_appendix / request_authorization / discard)'
  - '- last_verified_at (最后人工核验时间戳)'
  - 回答问题：
  - '- 如何利用此 Schema 自动生成教材末尾的‘参考文献’章节？'
  - '- 若引入‘内容可见性’为‘summary’的中间态（如语雀文档开放了目录但正文需权限），决策逻辑如何调整？'
units:
- 'no': 1
  name: 外部知识索引 —— 语雀文档链接汇总
  points:
  - '**为什么需要这个概念？**'
  - '- 素材库中存在部分仅包含外部链接、无实质文本内容的条目，需统一标识与管理'
  - '- 读者需要明确区分哪些章节可直接学习、哪些需自行跳转外部文档查阅'
  - '- 避免在教材正文中出现“空章节”导致学习体验割裂'
  - '**核心定义**'
  - '- 本单元不包含可直接教授的知识点，而是作为元数据索引存在'
  - '- 汇总素材库中所有仅含语雀文档外链、无正文内容的原始素材条目'
  - '- 为读者提供原始长文档的溯源入口，保证素材库的完整性与可追溯性'
  - '**关键性质**'
  - '- 非教学内容单元，属于教材编排层面的“导航/附录”功能模块'
  - '- 依赖外部平台（语雀）承载核心内容，链接失效即导致知识断链'
  - '- 内容不确定性高：链接标题可能与实际内容不符，需读者自行甄别'
  - '**典型例子**'
  - '- `docs/202305/20230516_043.md`：仅含链接，标题疑似为“海外平台”，指向投资/交易相关长文档'
  - '- `docs/202305/20230516_099.md`：含完整 URL `www.yuque.com/for_lazy/thfiu8/fc3rzl7ia8ury6x3`，标题“海外平台”'
  - '- `docs/202305/20230516_102.md`：仅含链接引用，标题未知，内容完全不可见'
  - '**边界条件**'
  - '- 仅适用于“素材整理/教材编排”阶段，不适用于“学员直接学习”阶段'
  - '- 无法提炼出任何可复用的方法论、模型、话术或工具 SOP'
  - '- 教材正式出版时，建议将此类条目移至“参考文献/延伸阅读”附录，不占正文章节编号'
  sources:
