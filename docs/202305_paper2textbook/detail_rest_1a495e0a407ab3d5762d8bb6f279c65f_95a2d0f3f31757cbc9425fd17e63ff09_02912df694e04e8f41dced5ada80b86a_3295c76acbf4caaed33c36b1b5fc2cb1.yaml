- ├── 核心认知
- │   ├── 减法启动思维 —— P002
- │   ├── 内容信任前置，广告仅作放大器 —— P003
- │   ├── 贸易顺差套利 —— P008
- │   └── 一个人即公司的最小闭环 —— P009
- ├── 基建架构
- │   ├── FB 企业户授权个人户抗封体系 —— P004
- │   ├── 账号/设备/网络/支付基建清单 —— P001, P002
- │   └── WhatsApp/INS 私域承接容器 —— P001
- ├── 流量获取
- │   ├── INS 专业号养号与素材搬运二创（小红书/抖音+ChatGPT翻译） —— P001, P003
- │   ├── FB 广告冷启动投放法（$20/天、消息目标、宽定向、视频素材） —— P005
- │   └── IG 引流进 WhatsApp 话术矩阵 —— P001
- ├── 转化成交
- │   ├── 代购/中间商人设 —— P001
- │   ├── 标准化私域成交话术（SPIN 简化版四步法） —— P006
- │   └── 多渠道收款与物流成本测算 —— P001, P008
- ├── 规模化放大
- │   ├── B 端客户挖掘与复购运营 —— P007
- │   └── 矩阵化账号与供应链议价升级 —— P004, P008
- └── 标准化执行总纲
- '    └── 7 天 0-1 执行总 SOP —— P010'
life_analogy:
- 想象跨境私域聊单像**开一家‘只接预约、不备库存’的高端定制裁缝铺**：
- '- **减法启动** = 不买布、不雇工、不租大店面，只租个橱窗（INS主页）挂几件样衣'
- '- **内容信任前置** = 橱窗里挂满‘成品细节图、客户试穿视频、面料科普’，路人看了才敢进门'
- '- **FB广告投放** = 在报纸投广告（付费流量）引人进橱窗，广告语只写‘源头定制、限量手工’'
- '- **代购人设** = 裁缝自称‘帮你找顶级面料厂、避坑劣质货’，而非‘卖衣服给你’'
- '- **SPIN四步话术** = 客人进门：1.展示面料工艺 2.问‘参加什么场合？’ 3.问‘预算多少？’ 4.现场打电话问厂家底价、报给客人含工费价'
- '- **B端挖掘** = 给常客做西装时发现他是采购经理，转而承接他公司 2000 套工装大单'
- '- **贸易顺差套利** = 面料从批发市场进价 50 元，定制西装卖 1000 元，中间差价覆盖房租广告还赚了'
- 就像裁缝铺不靠堆库存赚钱，而靠‘信任+信息差+灵活供应链’赚钱，跨境聊单也靠‘私域信任+中国供应链价格差+标准化话术’赚钱。
summary:
- concept: 跨境私域聊单模式
  desc: 无需囤货建站，用 IG/FB 广告引流至 WhatsApp，凭代购人设与 SPIN 话术高客单成交
- concept: 减法启动思维
  desc: 刻意砍掉备货、建站、复杂物流等前置条件，仅跑通‘获客-沟通-代发-收款’核心闭环
- concept: 内容信任前置
  desc: INS 先发 40+ 篇专业内容建立信任背书，再开广告；无内容直接投放转化极低
- concept: FB 企业户授权个人户
  desc: 核心资产（个人号、像素、私域好友）与风险资产（广告户、主页）隔离，挂了换主页秒复活
- concept: 低预算 FB 冷启动
  desc: $20/天、消息目标、宽定向、视频素材，单次有效对话成本 ≤$5
- concept: 代购/中间商人设
  desc: 非卖家身份，站在‘帮客户省钱/避坑’一方，消除对抗感，易成交 $100+ 高客单
- concept: SPIN 简化版四步法
  desc: 介绍品→问场景→问预算→现场 1688 比价报价，标准化、可复制、信任导向
- concept: B 端挖掘与复购
  desc: 从 C 端零售识别采购意向，转型批发大单，客单价指数级跃升，复购率极高
- concept: 贸易顺差套利
  desc: 利用 1688 批发价与欧美零售价的 5-20 倍剪刀差，私域信任溢价锁定利润
- concept: 7 天 0-1 SOP
  desc: Day1-2 基建选品，Day3-4 内容广告，Day5-7 聊单成交，标准化周计划可复制迁移
exercises:
- 'no': 1
  title: 设计你的‘一人跨境’最小启动清单
  contents:
  - 假设你要卖一款客单价 $150 的定制家居饰品，列出你需要准备的：
  - 1. 硬件设备清单（手机、电脑、网络环境等）
  - 2. 账号体系清单（FB 个人号/企业户/BM/像素、INS 专业号、WhatsApp 商业号）
  - 3. 支付与收款渠道（PayPal、Wise、USDT 等）
  - 4. 选品验证渠道（1688、Pinterest、竞品广告库）
  - 回答问题：
  - '- 哪一项是你目前最欠缺、获取难度最大的？为什么？'
  - '- 如果预算只有 $300，你会砍掉哪一项？如何替代？'
- 'no': 2
  title: 实操：INS 专业号 4 天内容填充计划
  contents:
  - 针对上述定制家居饰品，制定 Day 1-4 每日发布 10 条内容的选题表：
  - 1. 素材来源：从小红书/抖音搜索关键词，筛选 40 条高互动素材（图文/视频）
  - 2. 文案本地化：用 ChatGPT 将中文文案翻译为地道英文，要求保留‘手工/源头/定制/限量’等信任关键词
  - 3. 发布节奏：Reels 与图文比例、发布时段（欧美高峰期）、Highlights 分类规划
  - 回答问题：
  - '- 如何判断一条搬运素材是否‘高质量/高转化’？'
  - '- ChatGPT 翻译出‘机翻腔’如何人工快速修正？'
- 'no': 3
  title: 模拟一次私域聊单全过程
  contents:
  - 角色扮演：你是代购，客户在 WhatsApp 咨询‘定制logo太阳镜’，预算 $200。按 SPIN 四步法写出完整对话脚本：
  - 1. 介绍产品建立专业感（发什么视频/图？怎么讲工艺/材质？）
  - 2. 询问使用场景挖掘需求（问什么问题？如何引导说出痛点？）
  - 3. 询问预算锚定价格（如何自然问出预算？客户说‘不知道’怎么办？）
  - 4. 现场阿里巴巴比价报价收单（如何现场搜 1688？怎么报‘成本+服务费+运费’总价？）
  - 回答问题：
  - '- 客户最常见的 3 个异议是什么？每个异议的标准化回复话术是什么？'
  - '- 如何在聊单中自然植入‘二次推荐其他品类’的钩子？'
- 'no': 4
  title: 推演：从 C 端首单到 B 端批发的转化路径
  contents:
  - 假设一位客户买了 2 副定制太阳镜（$169/副），他在聊天中透露‘我们公司年会要采购 200 份礼品’。
  - 1. 你如何判断他是真实 B 端采购意向还是闲聊？关键信号有哪些？
  - 2. 设计从‘零售客户’到‘批发客户’的朋友圈分层运营策略（内容差异、发布频次、可见范围）
  - 3. 报批发价时，如何利用‘现场 1688 比价’话术同时保护零售价体系与利润率？
  - 回答问题：
  - '- B 端大单通常需要哪些供应链配合能力（打样、质检、包装、物流、报关）？你目前具备几项？'
  - '- 如果客户要求 ‘先寄样、满意再下大单’，你的风控底线与操作流程是什么？'
