  来源：[https://n28vbku1px.feishu.cn/docx/WzBCdY4A8omv2cxsneMcn1lJnEb](https://n28vbku1px.feishu.cn/docx/WzBCdY4A8omv2cxsneMcn1lJnEb)  hi，这里是文静的小红书IP全案100个，这篇复盘分享来自创业开线下美业店已经10年的镜子，去年才开始学习朋友圈和小红书，结果把朋友圈的文案内容，用小红书的技巧，复用到公域上  帮助她走通了：小红书有粉丝，私域有新流量，线下美业店，三域相结合的大结果  为什么我想先分享这个案例呢？是因为我知道很多实体店创业老板，每天都好忙。在有限的内容，有限的时间里，怎么把一条内容，超简单地复用得N多次，是我觉得最值得借鉴抄钞的！  接下来，一起来看看她的小红书IP全案  ![](img/71ac695dc26fe97458724467a13984cc.png)  #
  一、高价值定位  在玩赚的个人IP五步法有讲：定位一定要找到适合你的值钱的细'
docs/202305/YPhndkBKfocBV2xCfvucevIAn5y.md: '# 放弃高考，选择创业冒险，如今20岁月入6位数：我13岁到20岁的七年创业之旅  >
  来源：[https://nt29oth9w1.feishu.cn/docx/YPhndkBKfocBV2xCfvucevIAn5y](https://nt29oth9w1.feishu.cn/docx/YPhndkBKfocBV2xCfvucevIAn5y)  大家好，我是梦宸，04年的大一学生，来自河北廊坊，土生土长的小县城长大，出生平凡，但一直不甘平凡。  从2016年我只有13岁拿着1块钱启动资金开始网赚，到如今20岁大一学生月入六位数。  在这七年的创业时光，同龄人在放假打游戏追剧，而我在默默的搞钱。夜晚我可以一整宿在研究项目的新思路，经历过项目的失败，父母的反对，但是没办法呀，因为我的骨子里有一颗永不服输的心。  今天的这篇文章是想激励所有人，我们要努力赚钱，因为有钱可以治愈自卑，是我们心里最大的底气。  今年2023年我还是一名大一学生，我想要完成一个人去杭州的梦想，想要吹吹西湖边的晚风，晒晒灵隐寺的太阳，那当然我也如愿去到了杭州，也体验到了电商与自媒体之都的创业氛围  我想让父母提起我'
