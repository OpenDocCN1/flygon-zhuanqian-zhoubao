  (161 赞)《解决真正的问题，而不是试图解决所有问题》   作者： 小马宋   日期：2023-05-12   解决真正的问题，而不是试图解决所有问题——创业
  46 条之 16   我曾经非常理想主义，创办公司的时候，想着要做一个完美公司。后来发现，这不可能。   公司是由人组成的，而人又是不完美的，人有七情六欲，有贪嗔痴慢疑，公司每个层级的人，都有缺陷，我自己也有缺陷，所以我的公司也不可能是一家完美的公司。   所以经营公司，不能面面俱到，这根本不可行，你只能在某个阶段解决主要矛盾。   公司的问题有很多种，有些问题解决，公司可能立刻就要关门了，那就要立刻解决，比如疫情期间许多线下店的现金流问题，公司业务不足的问题，那不管是贷款还是寻找新的盈利项目，都是要解决现金流问题。   有些问题呢，可能随着主要'
