docs/202305/ZbFEdhEwsoqaNnxXzRicjWQOnkd.md: '# 抖音养生号:单月十万佣金复盘贴  > 来源：[https://ka8a2qs38ja.feishu.cn/docx/ZbFEdhEwsoqaNnxXzRicjWQOnkd](https://ka8a2qs38ja.feishu.cn/docx/ZbFEdhEwsoqaNnxXzRicjWQOnkd)  大家好，我是微笑，一位来自河南的00后创业者，做抖音养生号半年，今天跟大家分享我是如何一个月赚到10w佣金的。  ![](img/63864b16e77c8a6871f3a3762b80d518.png)  #
  项目介绍  抖音养生号也叫中医号，简单来说:就是混剪中医ip大师的视频，涨到1000粉丝，开通橱窗进行带货，  主要就是借势，借中医大师的势能来进行带货赚钱，  随着人口老龄化、疫情的出现，会有更多人愿意为健康花钱，养生这个需求也已经越来越年轻化了。  #
  我做养生号的经历  2022年9月底，我报名了郭晓文、"文哥"的养生号训练营，训练营结束后，我成功的赚回了学费【2400元】，第二个月我就月入过万，第三个月、月入十万，从那开始，我就一直深耕养生号这个领域、一直到现在。  '
