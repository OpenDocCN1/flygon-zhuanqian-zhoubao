  (239 赞)《好主意很多，做下去的很少》   作者： 小马宋   日期：2023-05-08   好主意很多，做下去的很少：创业 46 条之 15   经营一家企业，除了大方向走对了，剩下来的，就是做执行，执行的好，公司就会好，执行不彻底，生意就做不起来。   很多人可能对执行这件事不以为然，实际上很少有公司能把一件事做得很彻底，那些做得彻底的公司是值得尊敬的。   我们甚至在很多小事上，都不能做到完全彻底执行。比如每个项目小组每天花
  10 分钟开个早会，安排分配一天的工作，这件事能被彻底执行的，其实不多，人都有惰性，做着做着就懈怠了。   古茗奶茶有一年提出了一个年度目标，就是要让所有门店都能拉起横幅。拉横幅这件事难吗？其实不难，但让几千家门店都按时拉起横幅就很难，这就是企业的执行能力问题。   我们明明给门店设计'
