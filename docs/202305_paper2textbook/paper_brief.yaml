  (324 赞)《出名是赚钱的代价》   作者： 小马宋   日期：2023-05-11   出名是赚钱的代价   说一个很多人不太在意的观点。   前一阵子跟蔡钰老师闲聊，我说你应该做做短视频，你《蔡钰商业参考》里很多内容可以剪辑切片做成短视频分发。   蔡钰说你说的对，但我不会做，在我看来，出名就是赚钱的代价。我现在够了，不想再让名气再大，会带来很多麻烦。   剽悍一只猫，猫叔也有同样的观点，不过他的做法比较折中，他也做自媒体，但从不出镜，现实中也没人跟他合过影。有一次我们在东京拍排队吃一家网红店，我发的照片里有他背影，他打电话让我删了朋友圈。   同样的，我孩子的艺术指导老师是一个思想极其深刻的老师，我想请他做一期播客，他也礼貌地回绝了。他说：“我感觉干的越少越好，反正钱也够用了，学生多了也收不了。所以啥宣传都没做。过几年'
