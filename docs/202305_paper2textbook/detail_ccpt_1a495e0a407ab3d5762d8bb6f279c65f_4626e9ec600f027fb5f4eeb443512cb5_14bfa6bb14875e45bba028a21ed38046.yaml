units:
- 'no': 1
  name: 工具源于问题而非技术 —— 别让技术至上主义绑架产品方向
  points:
  - '**为什么需要这个概念？**'
  - '- 开发者容易陷入“技术至上”陷阱，以为有了技术就是产品'
  - '- 实际商业中，工具只是解决问题的手段之一，服务、流程优化同样可行'
  - '- 以问题为起点能避免造出没人用的“精美垃圾”，大幅降低试错成本'
  - '**核心定义**'
  - '- 任何工具的存在都是为了解决特定问题，解决方案不一定是软件'
  - '- 开发前必须明确：用户的真实痛点是什么？用软件解是否为最优解？'
  - '**关键性质**'
  - '- 问题导向：从“用户遇到什么困难”反推“需要什么功能”'
  - '- 非技术决定论：技术是实现手段，问题才是存在理由'
  - '- 成本约束敏感：MVP阶段必须在时间/人力/技术三重约束下做减法'
  - '**典型例子**'
  - '- 黑客马拉松中，作者发现内容营销痛点，未盲目开发CMS，而是聚焦“标题生成”单一功能'
  - '- 对比：许多开发者先学全栈、搭架构、做后台，最后发现没人需要'
  - '**边界条件**'
  - '- 当问题本身就是技术性极强时（如编译器、数据库内核），技术即问题'
  - '- 该原则不适用于纯技术基础设施建设，仅适用于面向业务用户的应用层工具'
  - '...'
  sources:
  - paper: docs/202305/20230516_062.md
    role: origin
  excerpts:
  - 明确问题，是第一步。任何工具的存在，都是为了解决问题。但解决方案，不一定是软件，还有服务，还有其他各个方式。别以为软件是万能的。
  - hackthon 是两天时间，所以我这边选择最重要的点，先去解决标题问题。
- 'no': 2
  name: 5 Whys 根因分析 —— 穿透表象痛点，直击软件可解的本质
  points:
  - '**为什么需要这个概念？**'
  - '- 用户反馈的通常是表层症状（如“内容没流量”），而非根本原因'
  - '- 直接解决表层症状会导致功能蔓延、偏离核心价值、资源浪费'
  - '- 只有找到软件能解决的“本”，才能界定清晰的MVP范围'
  - '**核心定义**'
  - '- 连续追问5次“为什么”，将用户感知的痛点（标）转化为根本原因（本）'
  - '- 判断标准：该根因是否可通过软件逻辑/自动化直接解决？'
  - '**关键性质**'
  - '- 层层递进：每一层“为什么”都基于上一层的回答'
  - '- 停止条件：找到可被软件/系统直接干预的关键环节'
  - '- 去伪存真：剥离用户主观臆断（如“我要更好看的编辑器”），保留客观约束（如“标题不符合算法规则”）'
  - '**典型例子**'
  - '- 现象：内容营销没流量 → 为什么？内容质量不够 → 为什么？标题不吸引人 → 为什么？不懂平台算法偏好 → 根因：缺乏符合算法规则的标题生成能力'
  - '- 最终定位：开发“AI营销标题生成器”而非“智能编辑器”'
  - '**边界条件**'
  - '- 当根因涉及不可控外部因素（如平台政策突变、宏观经济）时，软件无法直接解决'
  - '- 需结合领域知识，避免陷入无限递归或伪根因（如“因为用户懒”）'
  - '...'
  sources:
  - paper: docs/202305/20230516_062.md
    role: origin
  excerpts:
  - 利用 5 whys 法，反复问造成该问题的根本原因是什么，这是"本"。
  - hackthon 内容营销的问题，其根本原因是：虽然优质原创内容是必要的，但更重要的是需要制定符合各个内容平台推荐或搜索引擎流量规则的优秀标题、描述等等。
- 'no': 3
  name: MVP 算账决策 —— 在约束下只做最高优先级的事
  points:
  - '**为什么需要这个概念？**'
  - '- 资源永远有限（黑客马拉松仅2天、创业初期人手少、技术债高）'
  - '- 追求“功能完备”会导致交付无限延期、错过市场窗口、耗尽现金流'
  - '- 必须建立“在约束下最大化价值”的显性决策框架'
  - '**核心定义**'
  - '- MVP（最小可行性产品）：在时间/技术/人力成本约束下，仅解决最高优先级根因的最小功能集'
  - '- 算账：显性计算每个功能的开发成本（人天）、技术风险、预期收益，做取舍'
  - '**关键性质**'
  - '- 单一核心：每个版本只解决一个核心问题，拒绝“顺便加个”功能'
  - '- 快速验证：以最低成本跑通“问题-方案-用户-价值”闭环'
  - '- 可扔可改：代码/架构为验证服务，验证失败即丢弃，不沉没成本'
  - '**典型例子**'
  - '- 黑客马拉松2天：放弃“内容生成、发布管理、数据分析”，仅做“标题生成”'
  - '- 算账逻辑：标题是流量入口，影响面最广，开发难度中等，ROI最高'
  - '**边界条件**'
  - '- 核心功能若极其复杂（如自动驾驶感知），可能无法在极短周期内做出可用MVP'
  - '- 合规/安全类产品（医疗、金融）有底线功能集，不能过度精简'
  - '...'
  sources:
  - paper: docs/202305/20230516_062.md
    role: origin
  excerpts:
  - 这里就需要 MVP 思维和算账能力（包括技术成本、人力成本、时间成本等）
  - hackthon 是两天时间，所以我这边选择最重要的点，先去解决标题问题。
- 'no': 4
  name: 用户画像三维模型 —— 画像是找到用户的“藏宝图”
  points:
  - '**为什么需要这个概念？**'
  - '- 不知道用户是谁，就不知道去哪里找他们、说什么话、用什么渠道'
  - '- “所有人”是最差的用户画像，会导致营销预算打水漂、转化率极低'
  - '- 画像是渠道选择、文案撰写、产品设计的统一前置依据'
  - '**核心定义**'
  - '- 从三个维度构建立体画像：公司维度（B2B核心）、个人维度（共性特征）、互联网偏好（渠道分布）'
  - '- 公司维度：规模、行业、岗位、职责、挑战、采购流程'
  - '- 个人维度：年龄、学历、薪资、专业、工龄、兴趣、技能'
  - '- 互联网偏好：常用网站、社交媒体、工具软件、内容消费习惯'
  - '**关键性质**'
  - '- 决策前置：画像必须在选渠道、写文案、设功能之前完成'
  - '- 可验证：画像假设需通过访谈、数据、竞品分析不断校准'
  - '- 动态更新：随着产品迭代、市场变化，画像需定期修正'
  - '**典型例子**'
  - '- AI标题工具目标用户：内容运营/自媒体/营销人员 → 公司维度：中小企业、内容团队、有SEO/新媒体KPI；个人维度：25-35岁、大专以上、月薪8k-20k、焦虑流量；互联网偏好：小红书/公众号/知乎/抖音创作者后台、用剪映/Canva/ChatGPT'
  - '**边界条件**'
  - '- 早期画像常基于假设，需警惕“画像即真理”的教条主义'
  - '- 细分市场过小时（如仅10家潜在客户），画像价值低于直接逐个拜访'
  - '...'
  sources:
  - paper: docs/202305/20230516_062.md
    role: origin
  excerpts:
  - 用户画像特征包括以下： 1. 公司维度：公司规模、行业、地理位置、岗位、职责、岗位挑战、采购软件流程 2. 个人维度：年龄、教育水平、平均工资、毕业专业、工作年限、爱好兴趣、所属技能、
    3. 互联网偏好：网站平台偏好、社交媒体偏好、还用其他哪些互联网软件等等
  - 因为只有明确了用户画像特征，才能更好的做流量，做营销，做冷启动。用户在哪，我的产品在哪？就这句话，但你都不知道用户画像特征，你咋知道用户在哪呢？
- 'no': 5
  name: 竞品反向三步走选渠道 —— 站在巨人肩膀上抄近道
  points:
  - '**为什么需要这个概念？**'
  - '- 渠道太多（SEO、SEM、社媒、KOL、邮件、社群……），新团队无法全铺'
  - '- 盲目尝试成本极高，且易陷入“幸存者偏差”（只听成功案例）'
  - '- 竞品已用真金白银帮你测过渠道，直接分析其流量结构性价比最高'
  - '**核心定义**'
  - '- 三步走：1) 找到Niche垂直竞品 2) 用SimilarWeb/Ahrefs分析其流量渠道占比排序 3) 结合自身能力（技术/内容/资金/人力）匹配最优渠道'
  - '- 核心工具：SimilarWeb（网站流量来源）、Ahrefs（关键词/反链）、SEMrush'
  - '**关键性质**'
  - '- 证据基础：竞品流量数据是市场真实投票结果，非主观臆测'
  - '- 能力匹配：不是照抄竞品，而是选“竞品强且我也能打”的渠道'
  - '- 阶段性：冷启动期找“低成本、高精准、我能赢”的渠道；稳定期聚焦Top 3高效渠道规模化'
  - '**典型例子**'
  - '- 竞品流量：Direct 40%、Organic Search 30%、Referral 20%、Social 10% → 若我有内容团队，优先做SEO；若我擅长视频，切Social；若我有资源，谈Referral合作'
  - '- 素材中展示了SimilarWeb统计竞品流量渠道占比排序的具体操作界面'
  - '**边界条件**'
  - '- 竞品处于完全不同商业模式（如竞品靠品牌词、我靠长尾词）时，渠道不可直接迁移'
  - '- 新兴渠道（如新社交App）竞品可能尚未布局，需自行小额测试'
  - '- 工具数据有滞后性（通常月度更新），不适合捕捉极短期爆发机会'
  - '...'
  sources:
  - paper: docs/202305/20230516_062.md
    role: origin
  excerpts:
  - 如何通过竞品分析，确定用户对应营销渠道很简单。那如何确定合适你的流量渠道呢？三步走：
  - 1、找到 niched 竞品 ... 2、分析竞争对手的流量渠道 ... 3、选择合适你的流量渠道
  - 在进行竞争对手流量渠道分析时，需要统计每个竞品网站的流量渠道并进行排序。可以使用 similarweb 提供的功能进行统计，如下图所示。
- 'no': 6
  name: AI+SEO 标题生成方案 —— 用数据喂AI，产出既懂算法又懂人性的标题
  points:
  - '**为什么需要这个概念？**'
  - '- 纯AI生成标题往往“正确但平庸”，缺乏平台热门模式的数据支撑'
  - '- 纯SEO关键词堆砌标题“难读、不转化”，违背用户体验'
  - '- 需要一种“数据锚定+智能重组”的混合范式，兼顾分发与转化'
  - '**核心定义**'
  - '- 两步走：1) AI提取内容核心Topic + SEO平台检索高流量标题数据 2) AI二次生成兼顾高推荐(算法偏好)、高搜索(关键词覆盖)、高点击(人性诱饵)的营销标题'
  - '- 输入：内容全文/大纲 + 目标平台热门标题库/关键词库'
  - '- 输出：结构化标题候选集（含情绪词、数字、疑问句、痛点词等高转化要素）'
  - '**关键性质**'
  - '- 数据驱动创意：用真实高流量标题作为“种子”，规避AI幻觉'
  - '- 平台适配性：不同平台（小红书/公众号/抖音/知乎）算法偏好不同，需分平台训练/调优'
  - '- 可批量化：标准化Prompt + 规则引擎，支持百/千级标题批量产出'
  - '**典型例子**'
  - '- 黑客马拉松Demo：输入一篇“AI绘图教程”正文 → 提取Topic“新手入门/避坑/工具推荐” → 检索小红书高赞标题“小白必看/保姆级/从0到1”
    → 生成《小白保姆级避坑！AI绘图从0到1全流程，工具推荐附赠》'
  - '**边界条件**'
  - '- 依赖SEO平台数据质量，冷门领域/新平台数据不足时效果下降'
  - '- 标题只是“钩子”，内容质量不支撑会导致高跳出、低完读、账号权重受损'
  - '- 需持续迭代Prompt与规则，适配平台算法更新（如小红书打击标题党）'
  - '...'
  sources:
  - paper: docs/202305/20230516_062.md
    role: origin
  excerpts:
  - 其「AI 营销标题：高流量 & 高推荐 -> 高点击转化」解决方案：
  - ● 利用 AI 总结内容的 Topic + SEO 数据服务平台获取高流量相关标题
  - ● 通过 AI 技术再次生成高传播和高点击的标题
- 'no': 7
  name: 冷启动渠道阶段性策略 —— 前期求生存，后期求规模
  points:
  - '**为什么需要这个概念？**'
  - '- 同一渠道在不同阶段ROI截然不同，混淆阶段会导致资源错配'
  - '- 早期盲目追求规模化渠道（如大额广告）会烧光现金流'
  - '- 晚期仍用“捡漏”心态做冷启动渠道，会错失红利期、被竞品超越'
  - '**核心定义**'
  - '- 冷启动期：综合考虑自身能力与渠道匹配度，寻找“低成本、可控制、快速见效、能跑通闭环”的最优解'
  - '- 稳定期：聚焦Top 3-5个高效渠道，建立标准化SOP，投入资源规模化获客'
  - '**关键性质**'
  - '- 阶段判断标准：是否已跑通“获客-转化-交付-复购”完整闭环？单客获利模型是否为正？'
  - '- 渠道组合动态调整：冷启动常用“内容/社群/私域/SEO/冷启动广告”；稳定期转“品牌词广告/联盟/分销/大客户直销”'
  - '- 能力边界诚实：不做超出团队认知/技能/资金范围的渠道动作'
  - '**典型例子**'
  - '- 冷启动：创始人亲自在知乎/小红书答疑引流、发冷邮件、进社群做价值输出、跑小额广告测转化'
  - '- 稳定期：雇佣专职SEO/投手、建立分销体系、开品牌词广告、搭建销售团队'
  - '**边界条件**'
  - '- 产品周期极短（如节日应季品）可能没有“稳定期”，全程高强度冷启动'
  - '- 平台规则突变（如算法大更新、政策封杀）可能强制倒退回冷启动期'
  - '- 团队核心能力变更（如核心内容人员离职）需重新评估渠道匹配度'
  - '...'
  sources:
  - paper: docs/202305/20230516_062.md
    role: origin
  excerpts:
  - 在冷启动阶段，需要综合考虑自身能力和流量渠道，找到最合适的匹配方案。
  - 在稳定阶段，应选择最适合的 Top 几个渠道，以获得更多的用户。
- 'no': 8
  name: 营销底层逻辑三问 —— 谁、什么、哪里，缺一不可
  points:
  - '**为什么需要这个概念？**'
  - '- 很多团队只想“推广”，不想“卖给谁”、“卖什么”、“去哪卖”'
  - '- 三要素任一缺失：受众错=流量垃圾；产品错=留不住；渠道错=触达不到'
  - '- 这是所有营销动作的底层检查清单，防止战术忙碌掩盖战略懒惰'
  - '**核心定义**'
  - '- 营销成功 = 在正确的受众面前，展示正确的产品，通过正确的渠道'
  - '- 谁：目标客户画像（公司/个人/互联网偏好三维）'
  - '- 什么：解决其根因问题的MVP产品/服务，具备差异化价值主张'
  - '- 哪里：目标客户高频出现、信任度高、获客成本可接受的平台/场景'
  - '**关键性质**'
  - '- 强耦合：三要素必须基于同一假设体系推导，不能拼凑'
  - '- 优先级：谁 > 什么 > 哪里（搞错谁，后面全错）'
  - '- 可迁移：同一产品面对不同“谁”，需匹配不同“什么”（包装）和“哪里”（渠道）'
  - '**典型例子**'
  - '- AI标题工具：谁=焦虑流量的内容运营；什么=秒出爆款标题的在线工具；哪里=小红书/公众号/知乎/抖音创作者聚集地'
  - '- 反面：面向“所有人”推“功能全面的内容营销SaaS”，在“朋友圈/群发邮件”硬推'
  - '**边界条件**'
  - '- 早期“谁”常模糊，需用“广撒网、精筛选”快速验证，而非追求完美画像'
  - '- “什么”在PMF前会频繁变化，需建立快速迭代机制而非锁死路线图'
  - '...'
  sources:
  - paper: docs/202305/20230516_062.md
    role: origin
  excerpts:
  - 成功的营销，最关键的是在正确的受众（目标客户）面前展示正确的产品。
  - 谁是目标客户？在哪里找到他们？目标客户的定义，就是对你提供的产品或服务感兴趣的受众群体。
- 'no': 9
  name: 问题的标本区分 —— 不要给感冒开脑外科手术单
  points:
  - '**为什么需要这个概念？**'
  - '- 用户擅长描述感受（标），不擅长诊断本质（本）'
  - '- 照单全收用户需求会导致功能堆砌、核心价值稀释、维护成本爆炸'
  - '- 产品经理的核心价值在于“听懂标、找到本、做对事”'
  - '**核心定义**'
  - '- 标（表象/痛点）：用户主观感受到的困扰、抱怨、期望（如“我要更快的马”）'
  - '- 本（根因/需求）：经过分析挖掘的、可被系统性解决的核心矛盾（如“更高效的位移”）'
  - '- 区分方法：5 Whys根因分析 + 业务流程拆解 + 数据相关性验证'
  - '**关键性质**'
  - '- 标多本少：同一根因可衍生出大量表象痛点'
  - '- 标变本不变：平台/技术/形态变了，用户核心诉求常不变'
  - '- 解本治标：解决根因通常能批量消解表象痛点，反之则不能'
  - '**典型例子**'
  - '- 标：用户说“需要定时发布功能” → 本：需要“在用户活跃高峰自动触达” → 方案：智能选时发布而非单纯定时'
  - '- 素材案例：标=内容没流量/写得累；本=标题不符合算法规则 → 方案=AI标题生成器'
  - '**边界条件**'
  - '- 当用户显性需求即为核心价值时（如“我要个计算器算账”），标本合一，直接做'
  - '- 涉及用户隐私/伦理/合规的“标”，不能单纯用技术手段“解本”绕过'
  - '...'
