units:
- 'no': 1
  name: 消费力套利 —— 让三四线城市拥有「一线价格·三线成本」的价格剪刀差
  points:
  - '**为什么需要这个概念？**'
  - '- 一二线城市实体创业房租人工高、回本周期长、抗风险差，普通人难以承担'
  - '- 三四线城市居民对品质消费（瑞幸、台球、自习室）的心理价位与一二线基本持平，但房租、人工成本显著更低'
  - '- 这种「同价异成本」的错位，创造了小成本、高确定性、可复制的创业套利窗口'
  - '**核心定义**'
  - '- 消费力套利：利用三四线城市消费支付意愿接近一线、但运营成本远低于一线的结构性错位，以低成本（3-6万）换取高回报（首年ROI 200%+）的商业逻辑'
  - '- 核心公式：首年利润率 = (月卡价格 × 座位数 × 85% × 12) / (全年房租 + 软硬件总成本)'
  - '**关键性质**'
  - '- 决策前置性：租房前即可测算盈利预期，将创业从「赌概率」变为「算确定性」'
  - '- 成本结构极简：除房租外几乎无循环成本（无库存、无人工、水电网极低）'
  - '- 规模门槛低：30-50座位、3-6万投资即可启动，适合个人/副业/小团队'
  - '**典型例子**'
  - '- 龙岩店实测：50座、月卡500元、年租10万、软硬件成本含首年 → 首年利润率255%，次年利润率跃升至638%'
  - '- 汕头vs佛山对标：同量级城市（400万人口），佛山100家自习室，汕头仅2家，经济/高中/星巴克/电影院数量相当，汕头被判定为典型蓝海'
  - '**边界条件**'
  - '- 仅适用于非标准化、强体验、高频次的休闲/学习/社交类消费（咖啡、台球、自习室、麻辣烫等）'
  - '- 要求城市人口>200万，且满足「人口/5万 > 现有店数」的供需缺口测算'
  - '- 依赖电影院等成熟商业体选址能力，无电影院城市需额外验证商业聚合度'
  sources:
  - paper: docs/202305/20230516_054.md
    role: origin
  excerpts:
  - 我装逼地把它叫做，「消费力套利」，起因是做社会实践的过程中发现一个很有意思的现象，就是三四线城市的休闲娱乐，生活消费往往不输一二线，但是人工和场地成本却远低于一二线城市
  - 人们对所谓「品质生活」的判定有着相差无几的标准，三两好友去吃个宵夜大排档，在舟山和在宁波，都要两百多，一杯瑞幸在广州和在中山，打台球，上网一小时在厦门和在龙岩，人们的心理价位，并没有太大的差别
  - 首年利润率=（月卡价格 x 座位数 x85%x12）/（全年房租+软硬件总成本）
  - 这个公式牢牢记在心里，基本上还没租房，你就能知道今年要赚多少钱咯
  - 举个例子，龙岩，低估单价，多算了成本，超卖的和空置抵消，按运营水平中等，再打个八五折， 首年，50 个座位的店，按月卡 500 来算，5005012*85%=255000/100000=255%，
    首年之后，就是 5005012*85%=255000/40000=638%
  - 汕头 400 万人，佛山 400 万人，佛山 100 家自习室，汕头只有 2 家，两个城市经济差不多，高中数量差不多，电影院和星巴克的数量都差不多，那么，汕头，是不是机会？嗯嗯
- 'no': 2
  name: 电影院选址法则 —— 用「成熟商业体的选址大脑」替代自己的选址直觉
  points:
  - '**为什么需要这个概念？**'
  - '- 选址是实体店生死线，传统靠经验/直觉/中介推荐，失误率高、试错成本大'
  - '- 电影院是商业选址最顶级的「验证器」：其选址综合了人流、年轻客群、购买力、交通、商业成熟度'
  - '- 需要一个可执行、可验证、零成本的硬性选址标准，降维打击选址失误'
  - '**核心定义**'
  - '- 唯一硬指标：有电影院，只开在电影院周边1公里内；无电影院，则Pass（放弃该城市/商圈）'
  - '- 电影院代表：成熟商业聚合能力 + 年轻高消费客群聚集度 + 完善交通配套 + 黄金商圈确认'
  - '**关键性质**'
  - '- 排他性：不看商场、不看写字楼、不看学校，只看电影院，决策链条极短'
  - '- 可验证性：打开地图搜「电影院」即可完成初筛，无需实地跑断腿'
  - '- 抗周期性：电影院生存周期长，代表商圈长期价值，而非短期热点'
  - '**典型例子**'
  - '- 作者所有店均遵循此法则，龙岩店、汕头店选址均在电影院1公里范围内'
  - '- 反面教材：曾因中介推荐偏离电影院商圈选址，导致引流困难、运营举步维艰'
  - '**边界条件**'
  - '- 仅适用于面向年轻客群、依赖即时消费/社交属性的业态（自习室、咖啡、台球、麻辣烫等）'
  - '- 电影院必须为正常运营的主流影院（非即将倒闭/偏远/仅放映特殊题材）'
  - '- 1公里为物理距离，需结合「交通全模拟」验证实际到达便利度（步行/电动/地铁/车）'
  sources:
  - paper: docs/202305/20230516_054.md
    role: origin
  excerpts:
  - 唯一法则，有电影院，只开在电影院周边一公里内，无电影院则 pass
  - 用双脚丈量你的江山，步行绕圈，用体感去品这个商圈的氛围
  - 必须模拟自己是个来自习的选手，从附近小区不行来自习，电动车来自习...将心比心，模拟全过程
  - 物业好不好说话...要和物业一条心，物业这块啊，是位卑权重，人要的甚至不是钱，是尊重
- 'no': 3
  name: 极简装修交付标准 —— 让装修像买套餐一样标准化、固定价、固定期、固定质量
  points:
  - '**为什么需要这个概念？**'
  - '- 传统装修：增项多、工期长、质量不可控、垃圾清运扯皮、沟通成本极高，是创业最大坑之一'
  - '- 实体店核心竞争力在运营而非装修，装修只需「及格、耐用、标准、快」'
  - '- 需要将装修从「非标工程」转化为「标准化产品」，实现5-7天极速交付'
  - '**核心定义**'
  - '- 固定工艺、固定材料、固定品牌、固定工期、固定报价的「五固定」包干制'
  - '- 包工包料、包垃圾清运、包消防验收、包软硬件全套清单（含路由器、椅子、文具、零食、急救包）'
  - '- 结款比例：2:3:5（签约/进场/竣工）或装完付费，拒绝预付过多'
  - '**关键性质**'
  - '- 极速性：熟练团队5-7天完成全流程（硬装+软装+软硬件上架+网络调试+开业就绪）'
  - '- 可复制性：手绘/酷家乐出图 → 标准清单下单 → 熟练工人按SOP施工 → 验收交付，无需盯工地'
  - '- 确定性：规避增项、延期、偷工减料、垃圾堆积等传统装修90%的坑'
  - '**典型例子**'
  - '- 椅子统一采用「匚字型静音椅」：不刮地、不响、耐用、批量采购成本低'
  - '- 路由器统一「小米AX6000穿墙王」：1000元以下穿墙性能极佳，单店1-2台覆盖全场'
  - '- 地毯拼装化：单块可拆洗、可更换、运输便捷、施工无胶水污染'
  - '**边界条件**'
  - '- 适用于30-60平米、层高标准、水电基础完好的二次装修场景（非毛坯大改造）'
  - '- 要求当地有熟悉该SOP的施工队，或自带标准化施工团队'
  - '- 涉及消防/特种设备/承重墙改动等合规红线时，需单独走审批流程，不在标准包内'
  sources:
  - paper: docs/202305/20230516_054.md
    role: origin
  excerpts:
  - 固定的装修标准，工艺，工期，材料，品牌，材质，装修垃圾都包处理，包工包料，包干（无任何其他费用）
  - 熟练后我们 5-7 天可以装修完成一家店并投入运营
  - 椅子用那种匚字型的，静音小能手
  - 路由器，小米 ax6000 穿墙王，1000 块以下的极品
  - 手绘/酷家乐出图、包工包料包垃圾清运固定报价、地毯拼装化/椅子匚字型静音/小米AX6000穿墙王路由
- 'no': 4
  name: 无人值守3.0模式 —— 用「小程序+会员制+志愿者」构建零人力运营闭环
  points:
  - '**为什么需要这个概念？**'
  - '- 人力是实体店最大变成本（工资、社保、流失、管理、情绪），且招聘难、留人难'
  - '- 传统无人值守1.0（刷卡开门）、2.0（密码锁）仍需人工巡查、清洁、处理异常'
  - '- 需要一套「全流程线上化、异常自处理、卫生自治理、氛围自生成」的3.0系统'
  - '**核心定义**'
  - '- 硬件层：小程序选座/开门/到点断电/智能开关/监控语音播报/门锁远程管理'
  - '- 组织层：会员制私域群（高粘性、高信任）、招募「小管家」（送课时/专属团单换巡查卫生）、同楼层酒店保洁阿姨（10元/天带走垃圾）'
  - '- 策略层：超卖2倍（借鉴健身房逻辑）、佛系运营（容忍羊毛党造氛围）、情感连接（上岸照片墙/打卡榜/早晚打卡送课时）'
  - '**关键性质**'
  - '- 零固定人力成本：无店长、无收银、无保洁、无巡查员，仅需本地应急联系人处理微小概率故障（停电/跳闸/门锁故障）'
  - '- 自治闭环：用户即管理者，小管家从用户中来、到用户中去，利益绑定最紧密'
  - '- 体验反差：表面「佛系不管」，实则「系统严控、文化强渗透」，用户自律率极高'
  - '**典型例子**'
  - '- 小管家招募话术：「多问一嘴...来做我们的小管家吧，给你送课时，还有专属团单」'
  - '- 羊毛党策略：「我们巴不得这种人多点，营造气氛，人家还会觉得买3个小时可以学8个小时」'
  - '- 垃圾清运：同楼层酒店保洁阿姨10元/天带走，比专业保洁公司便宜90%'
  - '**边界条件**'
  - '- 依赖成熟的小程序系统（开门/断电/选座/支付/会员/营销一体化），需自建或购买成熟SaaS'
  - '- 适用于非固定座位、标准化程度高、用户自律性相对较强的场景（自习室、健身房、共享工位等）'
  - '- 需要种子用户群建立初期私域文化，冷启动期需创始人高频运营群氛围'
  sources:
  - paper: docs/202305/20230516_054.md
    role: origin
  excerpts:
  - 3.0 时代，无人值守自习室，全程线上安排，小程序安排座位，领取开门二维码，到点自动断电，会员群，无人值守，客户中选出打扫志愿者，用人力换自习时长，私域稳固
  - 终究，我们还是卖卡为主，和健身房一个逻辑，非固定座位，你可以两倍超卖，线上预约，无惧上座率
  - 佛系运营大法，不要害怕羊毛党，就让他们占便宜，谁能拒绝一家经常可以占便宜的店铺呢
  - 比如，考研上岸的照片墙，打卡签字排行榜，早来晚走送学时...是吧，这些套路，很得人心
  - 小管家的招募...来做我们的小管家吧，给你送课时，还有就是可以在美团团单上单独开一个小管家专用团单
  - 保洁阿姨基本能在同楼的酒店找到，便宜得很，10 元/天算高了，因为就是日常看一遍，带走垃圾袋
- 'no': 5
  name: 谈判签约组合拳 —— 把租房谈判变成「标准化动作库」而非临场发挥
  points:
  - '**为什么需要这个概念？**'
  - '- 租房是创业最大单笔固定成本锁定环节，谈得好坏直接决定利润空间、生存周期、抗风险能力'
  - '- 普通人谈判经验少、心态弱、易被房东/中介节奏带走，导致租贵、条款坑、后期扯皮'
  - '- 需要一套可背诵、可复用、覆盖全流程（看房/砍价/付款/免租/条款/博弈）的标准化话术库'
  - '**核心定义**'
  - '- 看房话术：「波澜不惊、装老手、只谈缺点、不谈优点」，建立专业人设压低预期'
  - '- 砍价策略：「尽情砍 → 砍死后抛筹码：半年付/月付/押一 → 换取进一步让价」'
  - '- 核心条款包：免租装修期、租期内不涨租不卖房、房东配合证照办理、留开票权作博弈筹码、偏好有钱强势房东抗衡物业'
  - '**关键性质**'
  - '- 心理博弈：用「半年付/月付」现金流诱惑置换「降价/免租/条款」长期权益'
  - '- 风险前置：将「卖房/涨租/不配合证照/物业刁难」等后期大概率风险，在合同期锁死'
  - '- 组合拳打法：单一条件谈不下来，组合「付款方式+租期+免租+条款」多维度组合拆解'
  - '**典型例子**'
  - '- 砍价实战：「大哥我半年付，能不能再少两百」；「您放空半个月，就能给我少两百每月了」'
  - '- 条款实战：「约定租期内别卖房，不涨租...整体框架是，得寸进尺」'
  - '- 物业博弈：「搞定了物业，就是搞定了一整个利益群体，包括保洁，水电工，保安，物业经理」'
  - '**边界条件**'
  - '- 核心前提：房东有出租意愿且决策权在手（非二房东/托管/产权纠纷房）'
  - '- 付款方式（半年付/月付）需自身现金流支撑，不可为谈价透支导致资金链断裂'
  - '- 物业利益绑定（佣金/红包/尊重）需在合规边界内，避免商业贿赂法律风险'
  sources:
  - paper: docs/202305/20230516_054.md
    role: origin
  excerpts:
  - 看房时候要波澜不惊，装老手，只谈缺点
  - 砍价，尽情砍，技巧，砍死后，来一句，大哥我半年付，能不能再少两百
  - 争取月付，押二的，争取押一...您放空半个月，就能给我少两百每月了
  - 约定租期内别卖房，不涨租...整体框架是，「得寸进尺」
  - 想当初，我二店装修，敲墙了啊，海量的装修垃圾，那个叫王燕楠的胖经理，颤巍巍的喊来了 4 个保安，一百块啊，就一百块，给我搞定了
  - 搞定了物业，就是搞定了一整个利益群体，包括保洁，水电工，保安，物业经理，相关人员在内的利益集团啊
- 'no': 6
  name: 城市筛选模型与实盘回测 —— 用「四步判断法」在租房前锁定盈利确定性
  points:
  - '**为什么需要这个概念？**'
  - '- 选错城市 = 所有努力归零，但大多数创业者凭感觉/老家/熟人选城市，无量化依据'
  - '- 需要一个「租房前即可执行、数据驱动、可跨城市对比」的标准化筛选模型'
  - '- 需要真实财务数据回测验证模型有效性，建立「算好账就能赚钱」的信心锚点'
  - '**核心定义**'
  - '- 四步筛选法：1) 人口>200万且满足 公式：人口/5万 > 现有店数；2) 对标同省相似城市（人口/经济/高中数/星巴克数）横向对比；3) 核考研人数、高中数量；4)
    查美团闭店率及同行运营水平'
  - '- 首年利润率公式：(月价×座位×85%×12)/(年租+软硬件) = 决策锚点'
  - '- 实盘验证：龙岩店首年255%/次年638%利润率、汕头vs佛山蓝海验证、物业100元搞定垃圾清运'
  - '**关键性质**'
  - '- 保守性：人口/5万 > 现有店数 为最保守算法，留足生存余量'
  - '- 横向对比：同省同量级城市对标（汕头vs佛山），消除宏观经济差异，聚焦供需缺口'
  - '- 微观验证：美团闭店率、同行评论维护/私域/推广意识，判断市场成熟度与竞争强度'
  - '**典型例子**'
  - '- 汕头蓝海发现：400万人口仅2家自习室，佛山同量级100家，星巴克/电影院/高中数相当 → 极大概率为蓝海'
  - '- 物业利益绑定：装修垃圾100元搞定，后续全系统配合，验证「位卑权重、利益绑定>对抗」'
  - '**边界条件**'
  - '- 模型假设：目标业态为自习室/同类休闲学习空间，其他业态需调整「人口/单店容量」系数'
  - '- 数据源依赖：美团/大众点评/百度地图/统计年鉴数据真实性与时效性'
  - '- 仅验证「不亏本/有机会」，不保证「必大赚」，执行力、运营细节、供应链仍为核心变量'
