- 'no': 4
  name: AI伪原创工作流 —— 把写作变成Prompt工程，人人可批量产出爆款
  points:
  - '**为什么需要这个概念？**'
  - '- 纯人工改写慢、质量不稳、难批量；纯AI生成易跑偏、无人味、平台判重'
  - '- 需要一个“结构化、可标准化、可批量、保合规”的内容生产流水线'
  - '**核心定义**'
  - '- 双阶段Prompt工程：阶段1“语义理解对齐”（指令：阅读分析/回复‘已准备好’）；阶段2“风格化重写”（指令：小红书风格/Emoji/生动/不改原意）'
  - '- 可扩展“阐明/精简/举例”指令生成原创正文，配合“数据驱动标题套用法”完成全链路产出'
  - '**关键性质**'
  - '- 标准化：将写作拆解为确定性指令序列，新手照抄即可上手'
  - '- 低成本：单条成本极低，支持日更10-20篇的矩阵量产需求'
  - '- 合规性：保留原意+风格化改写，大幅降低查重/违规风险'
  - '**典型例子**'
  - '- 爆款文案输入 -> ChatGPT回复“已准备好” -> 指令“小红书风格改写” -> 输出带Emoji/口语化文案 -> 套用高数据标题模板 ->
    发布'
  - '**边界条件**'
  - '- 必须两阶段分离，混合指令易导致风格跑偏或遗漏核心信息'
  - '- 核心观点/数据/案例必须人工核对，AI不负责事实准确性'
  - '- 标题坚决不用AI生成，改用“数据驱动标题套用法”'
  - '**素材溯源**'
  - '- 方法定义：素材中“ChatGPT双阶段改写Prompt工程”方法原文'
  - '- 标题策略互补：素材中“数据驱动标题套用法”方法论证AI起标题效果不佳'
  sources:
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
    role: origin
  excerpts:
  - 参考文案：接下来我将向你提供一段文案，请先阅读并分析，完成后只需要回复“已准备好”，并等待我的下一步指令。
  - 参考文案：请将这段文案，用小红书的风格，在不改变原意的前提下进行改写，要求有emoji表情，语言最好生动有趣（设置语言风格有助于提高伪原创质量）
  - 我通常还会用chatGPT的阐明/精简/举例的指令打造出一些纯原创的文案，用于正文。
  - 我也试过用chatGPT取标题，但效果并不满意，最后还是选择相信数据（最靠谱），提取了两个合适的标题...稍微替换关键词用于文案标题。
