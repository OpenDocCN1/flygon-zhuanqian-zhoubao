learning_targets:
- 理解棋牌游戏直播'打牌即内容'的低门槛赛道逻辑
- 掌握残局斗地主直播的悬念设计与流量自生长机制
- 学会用COS人设+场景搭建构建直播间差异化护城河
- 熟悉棋牌直播权限获取、底薪保障与公司合作模式
- 能搭建居家轻量化开播硬软环境并规避物理隔离风险
- 识别平台政策窗口期与红海化信号，制定动态竞争策略
