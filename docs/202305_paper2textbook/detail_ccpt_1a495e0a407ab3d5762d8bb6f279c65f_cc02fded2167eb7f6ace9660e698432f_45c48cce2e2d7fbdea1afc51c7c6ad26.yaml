units:
- 'no': 1
  name: ChatGPT+RPA协同自动化架构 —— 内容引擎与执行器模式
  points:
  - '**为什么需要这个概念？**'
  - '- 单纯会用ChatGPT不赚钱，必须将业务拆解为标准化SOP，注入Prompt工程，再用RPA串联成自动化流水线'
  - '- AI降低了‘从0到1’的技能门槛，但提高了‘从1到N’的标准化要求'
  - '- 长尾高频办公自动化需求（如文案批量生成）未被标准SaaS覆盖，需低代码组合方案'
  - '**核心定义**'
  - '- LLM负责内容生成（文案/代码/分析），RPA负责数据搬运、跨应用交互、流程编排'
  - '- 两者通过标准化接口（剪贴板/文件/API）解耦，形成‘内容引擎+执行器’协作模式'
  - '**关键性质**'
  - '- 解决‘从1到100’的规模化执行问题，而非验证可行性（0到1）问题'
  - '- 手动流程跑通（SOP先行）是自动化前提，工具在后'
  - '- 可视化拖拽开发（影刀RPA），13次拖拽即可构建端到端文案自动化流程'
  - '**典型例子**'
  - '- Excel数据准备→Prompt批量构建→网页交互自动化（含流式输出等待）→结果回填表格'
  - '- 影刀RPA关键节点：获取网页句柄→打开表格→循环遍历（读Prompt→发送→等待流式输出结束→抓取最后一条回复→写回表格）'
  - '**边界条件**'
  - '- 必须显式处理ChatGPT网页版流式输出的‘等待输入完毕’节点，否则抓取不完整回复'
  - '- 适用于高频、重复、规则固定的长尾场景，非标准化决策环节仍需人工介入'
  - '- 工具组合（热点宝选品+轻抖提取+超级写手生成+一帧秒创视频+RPA分发）成本效率优于单一大平台依赖'
  sources:
  - paper: docs/202305/20230516_070.md
    role: origin
  - paper: docs/202305/20230516_075.md
    role: improve
  - paper: docs/202305/IZx7dx2CSo9x23xioUFcNaHcnRd.md
    role: apply
  excerpts:
  - ChatGPT+RPA协同自动化架构：内容引擎+执行器模式
  - 影刀RPA关键节点编排：获取网页句柄→打开表格→循环遍历（读Prompt→聚焦输入框→发送→等待流式输出结束→抓取最后一条回复→写回表格）
  - 手动跑通是自动化前提定律：SOP先行，工具在后
  - 工具组合替代单一平台依赖：最佳实践链路拼装
  - 需求驱动学习与交付闭环：先验证需求再学技术
- 'no': 2
  name: 结构化提示词工程 —— 从万金油模板到卖点迁移范式
  points:
  - '**为什么需要这个概念？**'
  - '- 对话式零散提问效率低、结果不可控，无法支撑批量化、标准化生产'
  - '- 需要将‘会聊天’升级为‘写程序’：用结构化模板、权重语法、参数控制实现工程化复用'
  - '- 解决‘同质化查重’与‘卖点表达不精准’的核心痛点'
  - '**核心定义**'
  - '- 正向词五段式模板：[质量词+主体+细节+服饰+环境]，配合(词:权重)语法精准控制细节'
  - '- 负向词万能预设：覆盖90%人像/通用场景的畸变/水印/低质量抑制标签库'
  - '- 结构化卖点迁移Prompt：指令模型先分析种子文案‘卖点表达结构与人群画像’，再迁移至新商品，保持段落结构不变'
  - '**关键性质**'
  - '- Temperature差异化策略：带货文案0.3-0.7（保守连贯），创意文案0.9（发散），批量设定不同值生成多版本供筛选'
  - '- 提示词公式化/参数化：Excel CONCAT函数将固定指令模板与变量数据分离，实现数据与指令解耦的批量化Prompt工程'
  - '- ChatGPT中文调教12步法：基于模仿的少样本微调范式，用结构化中文指令替代代码实现人设固化'
  - '**典型例子**'
  - '- 种子文案‘连衣裙分享’结构迁移至‘西装阔腿裤’：保持身材参考→分套描述→卖点穿插→遮肉细节→色彩推荐→侧背展示→总结七段式结构'
  - '- Midjourney表情包Prompt：`a cute Husky dog, emoji, anthropomorphic style, Disney
    style, black strokes, different emotions, white background --niji 5 --style cute`'
  - '**边界条件**'
  - '- 结构化迁移仅适用于结构相对固定的带货/种草文案，非叙事类/深度逻辑类内容'
  - '- Temperature高值（>0.9）易产生幻觉，带货文案需严格限制在0.7以内'
  - '- 负向词库需随模型版本迭代维护，SDXL/Midjourney v6对部分负向词敏感度下降'
  sources:
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: origin
  - paper: docs/202305/FJ8HdrA04o2efNx7E1ZcVgehnSe.md
    role: apply
  - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
    role: improve
  - paper: docs/202305/20230516_075.md
    role: improve
  - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
    role: origin
  - paper: docs/202305/IZx7dx2CSo9x23xioUFcNaHcnRd.md
    role: apply
  excerpts:
  - 正向提示词五段式模板：质量词+主体+主体细节+服饰配饰+环境构图光影
  - 万能负向词模板含worst quality/bad anatomy/bad hands/extra fingers/watermark等60+标签
  - 结构化卖点迁移Prompt：指令模型先分析种子文案‘卖点表达结构与人群画像’，再迁移至新商品
  - Temperature差异化：带货文案0.3-0.7，创意文案0.9，批量设定不同值生成多版本供筛选
  - ChatGPT中文调教12步法：引入背景→预设角色→输入完整案例→反馈学习效果→反馈优化→拆解教学→迭代优化模板→稳定输出
  - Excel CONCAT函数批量生成结构化Prompt：`=CONCAT("写一篇","“",A2,"”的文章，标题+正文")`
- 'no': 3
  name: RPA端到端自动化闭环 —— 从可视化拖拽到批量化交付
  points:
  - '**为什么需要这个概念？**'
  - '- 人工复制粘贴、跨应用切换耗时且易错，成为规模化生产的瓶颈'
  - '- 专业开发成本高、周期长，业务人员需自主交付自动化方案（低代码/无代码）'
  - '- 自动化解决‘从1到100’的规模化复制，而非‘从0到1’的验证'
  - '**核心定义**'
  - '- 可视化拖拽式RPA开发：影刀RPA等工具提供预置组件（获取网页、循环、输入、等待、抓取、写回），类似积木搭建'
  - '- 标准化流程编排：获取网页句柄→打开数据源→循环遍历（读取Prompt→聚焦输入框→发送→等待生成完成→抓取最后一条回复→写回目标表）'
  - '- Excel数据驱动：CONCAT函数批量生成Prompt，数据与指令分离，支撑大规模参数化调用'
  - '**关键性质**'
  - '- 手动流程跑通是自动化前提（SOP先行，工具在后）'
  - '- 必须显式处理流式输出等待、弹窗拦截、元素定位失效等Web自动化特有异常'
  - '- 组合专用小工具（选品/提取/生成/视频/分发）构建最佳链路，优于单一平台依赖'
  - '**典型例子**'
  - '- 13次拖拽完成‘Excel读标题→ChatGPT生文→回填表格’全流程自动化构建'
  - '- 抖音带货全链路：热点宝选品→轻抖/RPA提取文案→超级写手批量改写→一帧秒创视频合成→RPA多平台分发→SEO关键词霸屏布局'
  - '**边界条件**'
  - '- 平台UI变更导致元素选择器失效，需维护选取器或采用OCR/图像识别兜底'
  - '- 高频操作触发平台风控（频率限制、验证码、设备指纹），需引入IP池/设备池/行为模拟对抗'
  - '- 非结构化数据（如长视频剪辑决策）难以完全RPA化，需保留人工审核节点'
  sources:
  - paper: docs/202305/20230516_070.md
    role: origin
  - paper: docs/202305/20230516_075.md
    role: theorem
  - paper: docs/202305/IZx7dx2CSo9x23xioUFcNaHcnRd.md
    role: apply
  - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
    role: improve
  excerpts:
  - 影刀RPA整体来说真心比较简单...过程中基本不用任何代码，有点类似小孩玩儿的编程机器人
  - 13次拖拽实现文案全流程自动化
  - 手动流程梳理清楚了，再利用通过RPA文案生成+视频制作+视频上传全部都批量自动化了
  - 自动化，批量更多的是解决从1到100的问题而不是解决从0到1的问题
  - 凡是可以用手动完成，且有一定规律的重复性操作，都可以用RPA来自动化实现。前提是手动流程跑通。
  - 本文用到的工具清单：1.抖音热点宝 2.total control 3.轻抖 4.uibot 5.chatgpt 6.temperature 7.webchatgpt
    8.一帧秒创
- 'no': 4
  name: AI内容自动化生产线全景图 —— 文本、图像、视频三位一体
  points:
  - '**为什么需要这个概念？**'
  - '- 单点工具（仅ChatGPT或仅SD）无法完成商业级内容闭环，需全链路工具链集成'
  - '- 从选题、生产、发布到数据反馈的全自动化系统，是‘从1到N’规模化的核心基建'
  - '- 覆盖短剧解说、表情包、数字人、SEO文章等多元变现场景'
  - '**核心定义**'
  - '- 文本层：ChatGPT/GPT-4（文案生成/改写/卖点迁移/标题优化）'
  - '- 图像层：Midjourney/SD（商品图/表情包/IP形象/小说推文插画），配合ControlNet/LoRA/Inpainting精细控制'
  - '- 视频层：剪映/CapCut/一帧秒创/万彩（图文成片/关键帧动画/智能匹配素材/批量替换真实素材）'
  - '- 编排层：RPA/Coze/Make/Zapier（定时触发/跨平台分发/数据回收/异常重试）'
  - '**关键性质**'
  - '- 低成本视频合成策略：不在意AI生成素材质量，后期剪映批量替换本地真实素材'
  - '- 关键帧动态化：剪映设置位置/缩放关键帧，使静态AI图产生镜头推拉摇移效果，消除PPT感'
  - '- 人物一致性锚定：无LoRA条件下，Prompt中强制固定核心外貌特征词（发色/瞳色/服饰）维持跨图连续性'
  - '- SEO霸屏布局：下拉词/相关搜索/大家都在搜系统性植入文案/描述/标签，配合RPA批量发布构建关键词覆盖矩阵'
  - '**典型例子**'
  - '- AI短剧解说/CPS：ChatGPT改写剧本+剪映自动剪辑+批量发布工具，单人日产50-100条，新手首月变现1.4万+'
  - '- AI表情包：MJ批量生成→Remove.bg抠图→改图宝压缩→稿定设计配字→微信平台上架→小红书教程引流私域→售课变现'
  - '- AI小说推文：文案拆解单句→SD公式化生图（DDIM/20-30步/高清修复）→配音情绪适配→剪映关键帧动态化→发布变现'
  - '**边界条件**'
  - '- 纯原创风格化路线：单条耗时8小时、无法矩阵、收益上限低，仅适合副业，全职需转向标准化矩阵操作'
  - '- 视频号/抖音/小红书平台风控差异大，素材去重、账号隔离、发布频控需分平台定制SOP'
  - '- 算力成本：本地部署需高配N卡（≥8G VRAM），云端部署（Colab/青椒云/RunPod）按时计费需ROI测算'
  sources:
  - paper: docs/202305/SUMMARY.md
    role: definition
  - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
    role: experiment
  - paper: docs/202305/FJ8HdrA04o2efNx7E1ZcVgehnSe.md
    role: apply
  - paper: docs/202305/20230516_075.md
    role: method
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: method
  excerpts:
  - 结合ChatGPT（文本生成）、Midjourney/SD（图像生成）、RPA/自动化工具（剪映、Coze、Make/Zapier），构建从选题、生产、发布到数据反馈的全自动化内容生产系统
  - AI短剧解说/CPS批量化实证：单人日产50-100条视频，抖音/快手/视频号多平台分发，新手首月变现1.4万+
  - 利用一帧妙创用文案一键制作视频，再替换自己的本地素材，不用在意一帧妙创生成的素材不好，后面剪映直接替换即可
  - 图片配上文字的末尾，往下拉一点再打上关键帧就能发现图片动起来了，不像ppt这么干吧
  - 只需要预设好人物的细节特征，比如我心动重启的女主统一关键词都是暗红色眼睛+黑色头发
  - 把搜索下拉词+相关搜索+大家都在搜的关键词 统统埋进视频的文案，详情描述，以及标签里
- 'no': 5
  name: AI赚钱第一性原理与避坑指南 —— 放大器而非救世主
  points:
  - '**为什么需要这个概念？**'
  - '- 市场充斥‘教你用ChatGPT赚钱’的伪课程，混淆工具技能与商业变现能力'
  - '- 普通人易陷入‘精神洁癖’过度打磨单条内容，忽视商业闭环验证与规模化复制'
  - '- 需建立正确认知：AI降低技能门槛，但提高标准化要求；执行力>完美主义'
  - '**核心定义**'
  - '- AI是放大器而非救世主：单纯会用工具不赚钱，必须将业务拆解为SOP，注入Prompt工程，串联自动化流水线'
  - '- 赛道分层生存法则：女频批量vs男频风格化vs短剧CPSvs解压素材，新手优先跑通闭环，再考虑风格化'
  - '- 执行力>完美主义：0-1阶段完成比完美重要，先发布再修正，用市场反馈倒逼升级'
  - '**关键性质**'
  - '- 信息差半衰期法则：发现速度×产出速度×分发速度的极致执行力才能在红利窗口完成变现'
  - '- 低成本验证优于完美策划：8元模板+废号+现有电脑<1100元成本跑通商业闭环，真实交易数据检验需求唯一标准'
  - '- 方法论资产>单个项目收益：内化像素级拆解/模仿/优化/复制方法论、识别流量密码嗅觉，可跨周期跨赛道复利'
  - '**典型例子**'
  - '- 作者阿讯：十几元买号→调教→写教程→办训练营→建星球→账号分销，两周变现7000元'
  - '- 视频定制项目：8元域名+800元电脑+300元企微认证≈1100元成本，单周期盈利<1个月赚2万+'
  - '- 风格化AI推文：单条8小时、难矩阵、收益不稳，最终放弃转向标准化矩阵操作'
  - '**边界条件**'
  - '- 平台风控红利期有窗口期不可对抗只能利用：快进快出榨取价值而非硬刚平台'
  - '- 形式大于内容：直播形式可迁移性（AE改文字→AI绘画/AI聊天/虚拟主播带货），核心降低主播技能门槛提高产出比'
  - '- 复购率是非标产品商业模式可行性核心指标：单价30元非标定制视频，无高复购LTV无法覆盖获客成本'
  - '- 个体户执照注册公众号可能存在推流受限风险，建议新手优先用个人身份证注册'
  sources:
  - paper: docs/202305/SUMMARY.md
    role: theorem
  - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
    role: origin
  - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
    role: limitation
  - paper: docs/202305/DGw1dYHSsohHu7x1AXhc4cQVnEN.md
    role: theorem
  - paper: docs/202305/20230516_081.md
    role: limitation
  excerpts:
  - AI赚钱第一性原理：放大器而非救世主，单纯会用ChatGPT/MJ不赚钱，必须将业务拆解为标准化SOP，注入Prompt工程，再用RPA/代码/低代码平台串联成自动化流水线
  - 机会常常是在我们勇敢尝试的过程中找到的，请在承受范围内疯狂试错
  - 利用好行动力才能抓住信息差，行动胜于空谈，执行力使你遥不可及
  - 优势：文案+内容100%纯原创，可挂中视频...代入感也是满分；劣势：视频制作时间过长...无法矩阵化操作，收入有限
  - 如果大家不和我一样有些对于作品的精神洁癖，不建议大家花这么久的时间做一条作品
  - 成本8元模板+800元电脑+300元/年企微认证≈1100元。不到一个月赚2万+，800元电脑第一场回本
  - 复购率是非标产品商业模式可行性核心指标...高复购证明‘情绪价值/社交货币’需求真实性与高频性
