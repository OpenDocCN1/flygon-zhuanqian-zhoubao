paper: docs/202305/IZx7dx2CSo9x23xioUFcNaHcnRd.md
desc: 该素材记录了一次基于真实用户需求的RPA自动化实战案例：利用Excel公式批量生成提示词，配合影刀RPA工具通过13次拖拽操作实现“从表格读取标题→发送至ChatGPT网页版→等待生成→抓取回复→回填表格”的文案创作全流程自动化，展示了低代码RPA结合大模型解决重复性办公痛点的完整落地路径。
concepts:
- name: ChatGPT+RPA协同自动化
  desc: 将大语言模型（ChatGPT）作为内容生产核心引擎，RPA作为自动化执行器（数据搬运、交互操作），两者结合实现业务流程端到端自动化的协作模式。
  is_original: false
  excerpt:
  - 通过ChatGPT+RPA 13次拖拽实现文案全流程自动化
  - 影刀获取网页、打开文案表格、循环提取文案标题、在chatgpt填写文案标题(过程中等待chatgpt输入完毕)、抓取最后一条回复
- name: 提示词公式化/参数化
  desc: 利用Excel CONCAT等公式，将固定指令模板与变量数据（如标题）分离，批量生成结构化Prompt，降低Prompt工程门槛并便于批量管理。
  is_original: true
  excerpt:
  - B列填写 =CONCAT("写一篇","“",A2,"”的文章，标题+正文")
- name: 可视化拖拽式RPA开发
  desc: 影刀RPA提供的无代码/低代码开发模式，通过拖拽预置组件（如获取网页、循环、输入、等待、抓取）快速搭建自动化流程，类似积木搭建。
  is_original: false
  excerpt:
  - 影刀rpa整体来说真心比较简单...过程中基本不用任何代码，有点类似小孩玩儿的编程机器人
  - 13次拖拽实现文案全流程自动化
- name: 网页版ChatGPT交互自动化难点：流式输出等待
  desc: 针对ChatGPT网页版流式逐字输出的特性，RPA流程必须包含“等待输入完毕”的显式逻辑，否则会抓取到不完整的回复。
  is_original: true
  excerpt:
  - 在chatgpt填写文案标题(过程中等待chatgpt输入完毕)、抓取最后一条回复
methods:
- name: __overview__
  desc: 端到端文案自动化流程：Excel数据准备与Prompt构建 -> 影刀RPA流程编排（打开资源/循环/交互/等待/抓取/写回） -> 执行监控。
  excerpt:
  - A列填入要写的文案标题 -> B列填写公式生成Prompt
  - 影刀获取网页、打开文案表格、循环提取文案标题、在chatgpt填写文案标题(过程中等待chatgpt输入完毕)、抓取最后一条回复
- name: Excel提示词批量生成法
  desc: 在Excel中利用CONCAT函数拼接固定指令前缀与A列变量标题，生成完整Prompt至B列，实现数据与指令分离的批量化Prompt工程。
  excerpt:
  - =CONCAT("写一篇","“",A2,"”的文章，标题+正文")
- name: 影刀RPA关键节点编排法
  desc: 核心步骤：1. 获取已打开的ChatGPT网页句柄；2. 打开/激活Excel表格；3. 循环遍历行：读取B列Prompt -> 聚焦ChatGPT输入框
    -> 发送内容 -> 关键等待节点（等待流式输出结束） -> 定位并抓取最后一条回复元素 -> 写回目标列/表。
  excerpt:
  - 影刀获取网页、打开文案表格、循环提取文案标题、在chatgpt填写文案标题(过程中等待chatgpt输入完毕)、抓取最后一条回复
  - 整体测试比较简单...过程中基本不用任何代码
theorems:
- name: 低代码RPA+大模型可快速落地长尾自动化需求
  desc: 对于高频、重复、规则固定但未被标准SaaS覆盖的“长尾办公场景”（如文案批量生成），普通业务人员可通过可视化RPA工具在极短时间（如几十分钟、十几次拖拽）内自主交付自动化方案，ROI极高。
  excerpt:
  - 影刀rpa整体来说真心比较简单...如果工作中有天天机械重复的某些动作（类似于日报表、数据抽取）完全可以通过RPA解放自己的双手。
  - 通过圈友的需求推动我学习rpa解决具体问题。
- name: 需求驱动学习与交付闭环
  desc: 先验证市场需求（发帖对接），再接单驱动技术学习（学RPA），最后交付解决方案，形成“需求-学习-交付”正向飞轮，降低技术学习的机会成本。
  excerpt:
  - 4月12号在生财发了一条关于rpa的资源对接，主要是2个目的：1、确定市场是不是有这个需求；2、通过圈友的需求推动我学习rpa解决具体问题。
findings:
- name: 案例实测：13次拖拽完成全流程自动化构建
  desc: '[evidence] 作者实测影刀RPA仅需13次拖拽操作即可完成从零到跑通“Excel读标题->ChatGPT生文->回填”的完整流程开发，验证了该工具极低的上手门槛。'
  excerpt:
  - 通过ChatGPT+RPA 13次拖拽实现文案全流程自动化
  - 整体代码过程实现比较简单...过程中基本不用任何代码
- name: 关键技术验证：必须显式处理流式输出等待
  desc: '[evidence] 实测中发现若无“等待ChatGPT输入完毕”步骤，RPA会提前抓取到不完整的流式输出文本；加入等待节点后可稳定抓取完整回复。'
  excerpt:
  - 在chatgpt填写文案标题(过程中等待chatgpt输入完毕)、抓取最后一条回复
- name: 用户痛点验证：手动复制粘贴耗时且易错
  desc: '[claim] 圈友反馈因需频繁在Excel、浏览器间切换手动复制标题、粘贴Prompt、等待、复制回复、粘贴回表格，极大浪费时间，存在真实自动化需求。'
  excerpt:
  - 需求是因为太忙，经常需要将文案标题重复粘贴到ChatGPT再将文案手动粘贴到表里，比较浪费时间。
- name: 工具生态观察：影刀提供官方分级教程降低学习曲线
  desc: '[evidence] 素材提及B站存在影刀官方初中高阶课程，说明工具厂商提供了完善的学习路径，支撑了作者“需求驱动速成”的可能性。'
  excerpt:
  - B站也有影刀官方的初中高阶课程
