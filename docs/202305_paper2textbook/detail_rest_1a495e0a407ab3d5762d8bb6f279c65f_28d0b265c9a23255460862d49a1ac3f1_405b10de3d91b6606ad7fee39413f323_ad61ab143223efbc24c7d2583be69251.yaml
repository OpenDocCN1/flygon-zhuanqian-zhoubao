learning_targets:
- 区分资料整理(PIM)、知识管理(PKM)与知识创作三个层级的本质差异
- 掌握克制收集四准则(有用、启发、新颖、私人)建立高信噪比知识库
- 熟练应用渐进式总结五层法(L1-L5)将碎片信息萃取为结构化知识与智慧
- 运用动态P.A.R.A组织系统实现笔记按行动紧迫度在Project/Area/Resource/Archive间流转
- 理解DIKW模型中Data/Information/Knowledge/Wisdom的层级跃迁逻辑
- 能根据知识价值密度决定笔记加工深度(丰俭由人)，避免完美主义瘫痪行动
concept_map:
- 知识创作系统
- ├── 核心分层论
- │   ├── PIM(资料整理) —— 信息层
- │   ├── PKM(知识管理) —— 知识层
- │   └── 知识创作 —— 智慧层
- ├── 输入端：克制收集四准则
- │   ├── 有用性(服务Project/Area) —— P001
- │   ├── 启发性(激发灵感火花) —— P001
- │   ├── 新颖性(香农惊讶度/信息增量) —— P001
- │   └── 私人性(独特经历/复盘/视角) —— P001
- ├── 加工端：渐进式总结五层法
- │   ├── L1 高亮标记(捕捉新颖信息) —— P002
- │   ├── L2 用自己话复述(内化/费曼内核) —— P002
- │   ├── L3 段落合并(结构化/逻辑关联) —— P002
- │   ├── L4 核心观点压缩(知识索引) —— P002
- │   └── L5 转化为提问(迁移应用/智慧层) —— P002
- ├── 组织端：动态P.A.R.A系统
- │   ├── Project(有截止日期的项目/最高优先级) —— P003
- │   ├── Area(长期责任领域/托底容器) —— P003
- │   ├── Resource(兴趣/参考资源/蓄水池) —— P003
- │   └── Archive(已完成/归档/冷存储) —— P003
- └── 理论基座：DIKW金字塔模型
- '    ├── Data(数据/原始记录)'
- '    ├── Information(信息/内容语义) —— P004'
- '    ├── Knowledge(知识/如何使用) —— P004'
- '    └── Wisdom(智慧/何时使用) —— P004'
life_analogy:
- 想象知识创作系统是一座**‘只造不囤’的精品加工厂**：
- '- **原料筛选(四准则)** = 进厂质检：只收‘订单需要(有用)‘、‘能改良工艺(启发)‘、‘稀缺新料(新颖)‘、‘自家秘方(私人)’四类原料，其余拒收'
- '- **渐进式总结(五层法)** = 分级加工车间：L1粗选 → L2精炼(内化) → L3组装(结构化) → L4压缩成半成品(核心观点) → L5定制成可直接发货的成品(可执行提问)'
- '- **P.A.R.A动态仓储** = 智能物流调度：急单(Project)原料直达产线；常备库存(Area)随时调拨；长尾原料(Resource)封存待用；完工订单(Archive)封箱入库'
- '- **DIKW质检标准** = 产品分级：原料(Data) → 半成品(Information) → 成品(Knowledge) → 定制方案(Wisdom)'
- 就像精品工厂‘不生产垃圾库存、不追求分类完美、只为当下订单极速交付’，知识系统也要‘克制收集、分级萃取、动态流转、服务创作’。
summary:
- concept: PIM/PKM/知识创作三层级
  desc: 资料整理=搬运信息；知识管理=加工信息；知识创作=输出原创成果，唯有创作实现知识增值
- concept: 克制收集四准则
  desc: 有用/启发/新颖/私人四重漏斗过滤，仅留存服务于创作决策的高密度素材，拒绝数字囤积症
- concept: 渐进式总结五层法
  desc: L1高亮→L2复述(内化分水岭)→L3合并(结构化)→L4压缩(索引)→L5提问(迁移)，可按价值密度丰俭由人
- concept: 动态P.A.R.A组织系统
  desc: Project(急单)→Area(托底)→Resource(蓄水池)→Archive(冷存)，笔记随行动流转，放在‘最快用到的地方’
- concept: DIKW模型
  desc: Data→Information(内容)→Knowledge(如何用)→Wisdom(何时用)，层级不可跨越，智慧依赖实战反馈沉淀
- concept: L2复述是内化分水岭
  desc: 跳过L2直接摘录仍是搬运工；必须强迫自己用自然语言重述，完成信息→知识的关键跃迁
- concept: 组织服务于行动而非分类
  desc: 笔记组织目的不是建立完美分类学，而是让笔记流向当下最需要的Project，解决‘只有体系无目标’
exercises:
- 'no': 1
  title: 四准则实战筛选
  contents:
  - 打开你最近收藏/转发的 10 条微信/推特/即刻信息：
  - 1. 对每条打标签：是否服务于当前具体 Project？能否说出 Project 名称？(有用性)
  - 2. 是否让你‘啊！原来如此’产生新视角？(启发性)
  - 3. 内容是否为网络随处可见的常识/二手观点？(新颖性/惊讶度)
  - 4. 是否包含你亲身经历、复盘或独特视角？(私人性)
  - 回答问题：
  - '- 有多少条同时通过‘有用性’和‘私人性’双重筛选？'
  - '- 因‘未来可能用到’而保存的，能否说出具体的 Project 或 Area 名称？'
  - '- 尝试删除所有未通过任一准则的条目，观察一周后是否产生焦虑或损失。'
- 'no': 2
  title: 单篇文章五层萃取演练
  contents:
  - 选取一篇你认为高价值的长文(>3000字)，执行完整五层流程：
  - 1. L1：用高亮笔/划线标记所有‘让你惊讶’的段落(不超过全文 20%)
  - 2. L2：对每个高亮段落，用**自己大白话**写一句话总结(禁复制原句)，计时不超过 20 分钟
  - 3. L3：将所有 L2 句子按逻辑合并为 1-2 个连贯段落，补充必要连接词
  - 4. L4：将 L3 压缩为**一句话**核心观点(≤50字)，写在笔记最顶端
  - 5. L5：将 L4 转化为一个**以‘我如何…’或‘何时…’开头的可行动提问**
  - 回答问题：
  - '- L2 阶段是否感到‘想偷懒直接复制’？强迫自己重述后，对概念理解是否加深？'
  - '- L5 提问是否能直接作为你下一个创作 Project 的起点？'
  - '- 若该文章价值一般，你会停在哪一层？为什么？'
- 'no': 3
  title: P.A.R.A 笔记大搬家
  contents:
  - 拿出你当前最常用的笔记软件/文件夹(不少于 100 条笔记)：
  - 1. 列出当前所有正在进行的、有明确截止日期的 Project(≤5个)，建立对应笔记本/标签
  - 2. 列出长期责任 Area(≤7个，如‘个人品牌/健康/财务/家庭’)，建立笔记本
  - 3. 将其余所有笔记按‘三步决策树’极速分流：
  - '   - 能直接用在某个 Project？→ 移入 Project'
  - '   - 属于某个 Area 长期关注？→ 移入 Area'
  - '   - 其余 → 统一扔进 Resource 总库(不再细分子文件夹)'
  - 4. 将已完成/废弃/过期的 Project 笔记批量移入 Archive
  - 回答问题：
  - '- 分流后，Project 笔记本里的笔记数量占比是多少？(健康系统应 >30%)'
  - '- 是否发现大量‘僵尸笔记’(>1年未打开)堆在 Resource/Archive？'
  - '- 下周新增笔记时，能否在 10 秒内完成‘Project→Area→Resource’判断并归档？'
- 'no': 4
  title: DIKW 层级标注实战
  contents:
  - 翻开你最近整理的一篇完整笔记(含 L1-L4 内容)：
  - 1. 用四色高亮/标签标注每个片段所在层级：
  - '   - 🟦 Data/Information：直接摘录、定义、数据、金句(‘是什么’)'
  - '   - 🟨 Knowledge：你用自己话写的步骤、方法论、逻辑关联(‘怎么用’)'
  - '   - 🟩 Wisdom：你基于实战得出的判断原则、避坑指南、决策规则(‘何时用/怎么选’)'
  - '   - 🟪 Meta：你的疑问、待验证假设、联想触发点(L5 提问归此)'
  - 2. 统计四色占比，计算 Knowledge+Wisdom 占比
  - 回答问题：
  - '- 你的笔记中 Information 占比是否超 60%？(超比例说明仍在搬运)'
  - '- 是否存在‘只有 Information 无 Knowledge’的伪笔记？如何补全？'
  - '- 尝试为一条纯 Information 片段补充 Knowledge 层描述(‘如何用’)，观察认知负荷变化。'
