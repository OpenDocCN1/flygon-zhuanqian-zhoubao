  excerpts:
  - 如果 12 月那次没有决定再尝试一次，没有坚持完整个航海，后面的结果和放大或许都不会发生。
  - 测出爆款手中缺少账号怎么办？我赶紧跑回去，用我妈妈的证件办了 5 个号...真的是给了我很大的支持。
  - 跑通流程，优化细节，多账号，流程化，赚钱的事多做十遍。
  - 只有全流程固化为可量化/可考核/可替换的SOP，才能实现矩阵横向复制，将个人经验转化为组织资产。
  - 矩阵核心价值非账号数量：而是流量内部循环最大化/大带小/单广位多账号售卖提高广告单价/运营SOP标准化复制降低边际成本/分散封号风险。
  - 直到 12 月 7 日那天销售额近 3800 元...单个账号累计订单 400 个，佣金 3000+ 元。
  - 目前父母账号合计佣金 20000+。
