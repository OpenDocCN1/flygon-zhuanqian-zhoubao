learning_targets:
- 掌握视频号银发女性用户画像与高客单选品逻辑
- 建立一证五号身份证合规矩阵模型与物理隔离硬件方案
- 执行测品-爆款-放大三阶段数据驱动决策标准化流程
- 实施爆款定制链接与SKU阶梯定价策略提升客单价
- 构建短视频引流+直播承接的分层转化模型
- 遵守店铺体验分风控红线与偏远地区不发货设置
- 建立供应链熔断机制：多店铺备选+即时催单+动态切换
- 将带货拆解为发视频/上架/看数据/管店铺/催发货五大标准动作实现SOP资产化
concept_map:
- 视频号短视频带货矩阵化体系
- ├── 用户画像与选品策略
- │   ├── 银发女性高客单画像：女性≥85%、50岁以上≥80%  —— P024
- │   └── 养生/保暖/家居等中老年高频刚需品类聚焦  —— P024
- ├── 账号矩阵合规与物理隔离
- │   ├── 一证五号身份证矩阵模型：主号管子号/同绑一卡/物理隔离分组  —— P024
- │   └── 安卓双开硬件方案：红米Note 11T/1机10号/编号台账/定期保号  —— P024
- ├── 三阶段数据驱动决策法
- │   ├── 测品期：多号测不同品/挂2-3链接/半天看流量  —— P024
- │   ├── 爆款期：出单即刻催发货/2天发货红线/监控退款率  —— P024
- │   └── 放大期：多号同发引流单店/定制链接/SKU/短视频+直播转化  —— P024
- ├── 爆款转化优化策略
- │   ├── 定制链接与SKU阶梯定价：专属链接/1份29.9-2份49.9/多规格组合  —— P024
- │   ├── 短视频引流+直播承接：短视频获流/直播提升转化/置顶位权重调序  —— P024
- │   └── 橱窗动态排序与长尾搭配：顶部2-3爆款/高客单高佣高销量长尾  —— P024
- ├── 风控红线与供应链熔断
- │   ├── 店铺体验分生存线：新店4.5分/4分隐形下架/合作门槛≥4.2分  —— P024
- │   ├── 偏远地区不发货设置规避物流纠纷  —— P024
- │   └── 供应链熔断机制：48小时发货红线/多店铺备选/即时催单/动态切换  —— P024
- ├── 执行力与组织放大杠杆
- │   ├── 航海机制外部约束：手册/教练/圈友/截止日期  —— P024
- │   ├── 家庭支持解锁身份证红利：单人5号→家庭20+号  —— P024
- │   └── 流程化标准化SOP：五大标准动作文档化/账号编号/硬件标配  —— P024
- └── 实战爆发案例与惨痛教训
- ├── 单账号爆发系列：羽绒服/湿巾/茶壶/养生茶/舅舅账号/父母账号  —— P024
- ├── 茶壶供应链失联：实发率1/3/切换5-6家仍损失数千佣金  —— P024
- ├── 店铺分<4分隐形惩罚：爆款下架/佣金归零  —— P024
- └── 账号管理物理解决：贴纸标记/电子表格/流水编号A1-A5  —— P024
life_analogy:
- 想象视频号带货矩阵化是一场**‘连锁便利店加盟’工程**：
- '- **选品** = 不用自己进货，去‘批发市场’(选品广场/榜单)挑已验证的‘畅销款’(高客单/高利润/高佣金)'
- '- **账号矩阵** = 用全家身份证(一证五号)开‘分店’，统一‘总部SOP’(标准动作/硬件标配/账号编号)，物理隔离(一机一号)防关联'
- '- **测品-爆款-放大** = ‘试营业→正式开业→连锁复制’：多店试菜单(测品)→出单即督导发货(爆款)→爆款统一装修/定制菜单/多店同推(放大)'
- '- **供应链熔断** = 建‘中央厨房备选库’：主供断货即切备供/48小时出餐红线/实时监控/动态切换，保‘爆款不断供’'
- '- **风控红线** = ‘卫生评分生存线’：店分<4分强制关店/偏远不送外卖/物流分不拖后腿'
- 就像开连锁加盟：总部统一选品/装修/SOP(矩阵标准化)，加盟商用自家证照(身份证矩阵)，中央厨房多备选防断供(供应链熔断)，卫生分数达标才能活(店铺体验分)，赚钱动作标准化复制N遍(SOP资产化)。
summary:
- concept: 视频号用户画像
  desc: 女性≥85%、50岁以上≥80%，核心流量池为中老年女性，决定选品聚焦养生/保暖/家居等高频刚需
- concept: 身份证矩阵合规模型
  desc: 基于微信一证五号规则，主号管子号、同绑一卡、物理隔离不同人员账号组，规避关联封禁
- concept: 物理隔离硬件方案
  desc: 安卓双开1机10号，红米Note 11T 8+128G(~1700元)，账号编号A1-A5+手写台账+定期拨号保号
- concept: 测品-爆款-放大三阶段
  desc: 多号测品半天看流量→出单即刻催发货(2天红线)→爆款多号同发定制链接/SKU/短视频引流+直播转化
- concept: 爆款定制链接与SKU阶梯价
  desc: 向商家定制专属链接可控主图/SKU/价格，采用1份29.9/2份49.9阶梯价及多规格组合提升客单价
- concept: 短视频引流+直播承接
  desc: 短视频低成本获公域流量爆发，直播间承接高意向流量提升转化，置顶位权重递减动态调序
- concept: 店铺体验分风控红线
  desc: 新店4.5分，<4分隐形下架，合作门槛≥4.2分，物流分易因偏远地区拉低需预设不发货区域
- concept: 供应链熔断机制
  desc: 48小时发货红线/多店铺备选/即时催单/动态切换，茶壶案例验证单一供应链依赖风险极高
- concept: 家庭支持身份证红利
  desc: 母亲克服晕车办卡解锁身份证红利，将单人5号上限突破为家庭20+号矩阵，是收益跃迁物理前提
- concept: 流程化标准化SOP
  desc: 将发视频/上架/看数据/管店铺/催发货五大动作标准化文档化，使‘赚钱的事多做十遍’成为可执行工程问题
- concept: 航海机制外部约束
  desc: 提供手册/教练演示/圈友互助/截止日期外部结构，将模糊意愿转化为确定性行动，12月坚持完周期迎来拐点
exercises:
- 'no': 1
  title: 视频号账号矩阵合规搭建实战推演
  contents:
  - 假设你拥有3位家庭成员身份证(父母+自己)，准备搭建视频号带货矩阵：
  - 1. 设计账号编号体系：按A/B/C三组分配主号/子号编号(A1-A5/B1-B5/C1-C5)，规划银行卡绑定策略(每组同绑一卡)
  - 2. 硬件采购清单：按安卓双开1机10号标准，计算所需红米Note 11T 8+128G手机数量/成本预算，设计手机背面贴纸标记与电子表格台账结构
  - 3. 养号与防关联SOP：制定新号注册后2-3天模拟真人行为细则、一机一号物理隔离操作规范、手机号半月一拨保号流程
  - 回答问题：
  - '- 为什么主号必须绑定运营者身份而非家人身份？子号授权逻辑是什么？'
  - '- 若某手机故障导致该组10个号需紧急迁移，如何在不触发风控前提下完成设备更换？'
  - '- 银行卡同绑一卡是否会触发支付风控？实测有无异常？'
- 'no': 2
  title: 测品-爆款-放大三阶段决策沙盘演练
  contents:
  - 场景：你已搭建20号矩阵，准备切入‘中老年养生茶’品类，请完成：
  - 1. 测品期方案：20号如何分配测不同款(每款挂2-3链接)？半天查看流量数据的标准化动作清单是什么？流量/点击/转化阈值如何设定判定‘通过测品’？
  - 2. 爆款期应急预案：某款养生茶次日出30单，立即执行‘催发货’标准动作(电话/留言/确认库存/发货时效)；若店铺失联/延迟发货，启动供应链熔断切换5-6家备选店铺的具体操作步骤与沟通话术
  - 3. 放大期矩阵协同：爆款验证后，20号如何同发同款引流单店？定制链接申请流程/SKU阶梯价设计(1份/2份/套装)/短视频置顶位轮换策略/直播间排班承接
  - 回答问题：
  - '- 为什么‘催发货’优先级高于‘发视频’？茶壶案例中供应链失联导致实发率1/3、损失数千佣金的根因是什么？'
  - '- 单品30条笔记无起色则切品的止损线，背后的概率博弈数学逻辑是什么？'
  - '- 置顶视频左1>中>右1权重递减特性，如何根据实时数据动态调序最大化流量利用率？'
- 'no': 3
  title: 店铺体验分风控与供应链熔断实战演练
  contents:
  - 1. 体验分监控日报表设计：包含商品分/服务分/物流分/DSR/违规记录/偏远地区退货率，预警阈值(商品分<4.5/物流分<4.6/综合<4.2)与应急预案(换链接/停推/设不发货区)
  - 2. 供应链档案库建立：为每个合作店铺建立档案(发货时效/库存同步方式/联系人/历史退款率/是否支持定制链接)，设定‘48小时发货红线’触发即时催单与动态切换条件
  - 3. 茶壶案例复盘：模拟爆款期(30+单)店铺失联导致实发率1/3，紧急切换5-6家备选仍因延迟/疫情退货损失数千佣金，输出‘单一供应链依赖风险评估报告’与‘多级备选+实时催单’改进方案
  - 回答问题：
  - '- 为什么新店初始4.5分却建议合作门槛≥4.2分？物流分为何最易因偏远地区拖后腿？'
  - '- 供应链熔断机制中，‘即时催单’与‘动态切换’的时间窗口分别是多少？如何量化‘催发货’的ROI？'
  - '- 当平台收紧规则(如0粉挂车取消/投放门槛提高)时，标准化SOP团队为何反而受益？'
units:
- 'no': 1
  name: 视频号用户画像与选品锚点 —— 银发女性高客单决定品类天花板
  points:
  - '**核心洞察**'
  - '- 视频号带货核心流量池：女性占比≥85%、50岁以上占比≥80%，这是平台算法与用户生态决定的结构性特征，不可逆转'
  - '- 用户画像直接决定选品边界：必须聚焦养生、保暖、家居等中老年高频刚需品类，偏离画像即浪费流量'
  - '- 高客单价(≥30元)、高佣金率(≥30%)是覆盖付费流量成本、实现ROI正向的硬性门槛'
  - '**关键性质**'
  - '- 画像稳定性强：视频号依托微信社交图谱，人群标签粘性远高于兴趣标签，一旦建立信任可跨品类复购(''一鱼多吃'')'
  - '- 非标品/高客单优势：中老年用户对‘真实/产地/人情’信任度高，适合非标高毛利产品(如农机/茶叶/养生茶)，无需专业直播话术'
  - '**典型案例**'
  - '- 东哥实测：羽绒服/湿巾/茶壶/养生茶/舅舅新品/父母账号，均为中老年高频刚需，验证画像选品有效性'
  - '- 橘子海案例：茶叶/农机等非标品，通过‘真心实意’展示产地实况+私域服务，实现高客单/高复购'
  - '**边界条件**'
  - '- 避开低龄粉丝品类(如男明星同款)：粉丝多为18岁以下无购买力，转化率极低'
  - '- 红海标品竞争：账号规模大时(400+店)蓝海容量不足，需转战红海通过店群规模化建壁垒'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  - paper: docs/202305/I8BLdIIfbobzkYxCLGBctYqbnae.md
    role: improve
  excerpts:
  - 视频号用户女性偏多，年龄偏大；如图 女性占 ≥85%，50 岁以上占比 ≥80%。
  - 针对视频号30+、二三线用户画像，绕过红海日用品聚焦农机刚需，利用线下渠道匮乏、价格不透明信息差销售高客单非标品
  - 在视频号上人群大于兴趣，我只要能卖掉a品类，就必然能卖掉同人群属性下的B品类
- 'no': 2
  name: 身份证矩阵合规与物理隔离硬件体系 —— 一证五号主号管子号，安卓双开单人管20号
  points:
  - '**核心定义**'
  - '- 一证五号合规模型：基于微信实名规则，主号(A1)绑定运营者管理子号(A2-A5)，5号同绑一张银行卡；A/B/C组不同人员账号物理隔离、不互绑，规避关联封禁'
  - '- 安卓双开硬件标准：1机10号，推荐红米Note 11T 8+128G(~1700元)保障流畅度；账号编号体系(A1-A5)+手写台账+定期拨号保号'
  - '**关键性质**'
  - '- 合规性即安全性：严格利用平台官方规则与功能边界操作(一证五号/同绑一卡/物理隔离)，实现‘100%安全’的账号存活'
  - '- 单人物理上限突破：家庭支持(如母亲克服晕车办卡)可解锁‘身份证红利’，将单人5号上限突破为家庭20+号矩阵，是收益万级向十万级跃迁的物理前提'
  - '- 低成本管理工程化：贴纸标记手机背面+电子表格台账+流水式编号A1-A5，经验证可支撑20+账号单人高效运营'
  - '**典型案例**'
  - '- 东哥实操：3部红米Note 11T支撑20+账号，母亲克服晕车去县城办卡、父亲办卡，父母账号合计佣金20000+'
  - '- 圈友反馈：6个号忘记手机对应，作者给出‘贴纸+台账+编号’组合拳低成本解决'
  - '**边界条件**'
  - '- 避免使用曾卖过货的旧设备(历史污染导致流量受损)，切记踩坑实证'
  - '- 电脑端/云手机/群控工具批量操作易触发风控，亲测‘目前都是手机发’、‘一机一号’为最优解'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  - paper: docs/202305/20230516_028.md
    role: improve
  excerpts:
  - 一个身份证可以办 5 个号...其中 A2 - A5 的运营者绑定为 A1...5 个号绑定同个银行卡。A，B，C 几个人的账号各自分开不要互绑，安全第一。
  - 安卓手机双开，一个手机可以登录 10 个号。建议买个好手机...红米 Note 11T 的 8+128G 价格 1700 元。
  - 把自己所有的账号进行编号，可以进一步提高效率，也方便管理...手机号每大半个月打下电话保证正常不停机。
  - 亲测运维规范：目前都是手机发、一机一号，规避了群控/云手机/电脑端批量操作触发的风控风险。
- 'no': 3
  name: 测品-爆款-放大三阶段数据驱动决策法 —— 概率博弈转确定性工程
  points:
  - '**核心逻辑**'
  - '- 阶段1测品：多账号测不同品，视频挂2-3链接，半天看流量；核心指标‘日测品数/素材数’，头部团队日测70-100品保证高频出爆品'
  - '- 阶段2爆款：出单后即刻电话/留言催发货(2天内发货红线)，监控退款率；单品30条笔记无起色则切品/注销号，实现快速试错止损'
  - '- 阶段3放大：发现爆款后多号同发同款引流单店，定制链接/SKU/短视频引流+直播转化，速战速决利益最大化'
  - '**关键性质**'
  - '- 数据驱动替代主观：半天看流量/出单即催发货/30条止损线，均为量化阈值而非凭感觉，将‘博概率’转化为大数定律确定性收益'
  - '- 供应链响应速度决定变现上限：48小时发货是物流分红线，延迟3-5天必引发退款；店铺沟通不畅会导致‘到手鸭子飞了’(茶壶案例损失数千佣金)'
  - '- 爆款定制链接解决决策瘫痪：SKU过多导致用户选择困难，定制专属链接可控主图/SKU/价格，阶梯价(1份29.9/2份49.9)提升客单价与转化率'
  - '**典型案例**'
  - '- 东哥茶壶案例：次日出30单，持续1.5月单账号6800元，但因供应链失联实发率1/3、切换5-6家备选仍损失数千佣金'
  - '- 养生茶案例：70+单佣金2300+，定制5 SKU阶梯价验证提客单；舅舅账号首日10万+播放、持续2月佣金12000+'
  - '**边界条件**'
  - '- 单号30条笔记止损线：博概率核心定律下，单账号方差极大，矩阵化(N账号×M内容)将概率转确定性，焦虑单号不爆是认知偏差'
  - '- 自然流高风险：连续十几个账号被限流彻底退出，投流具备稳定/可复制/可放大/不废号四大优势'
  sources:
  - paper: docs/202305/20230516_024.md
