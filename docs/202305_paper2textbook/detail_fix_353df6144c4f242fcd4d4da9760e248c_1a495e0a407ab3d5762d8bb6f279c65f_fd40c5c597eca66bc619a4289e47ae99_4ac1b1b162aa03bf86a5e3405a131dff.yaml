  excerpts:
  - 开始各账号测不同产品，发布视频时就要选择产品上架 2-3 个链接。至少每半天查看一下各账号流量。
  - 重点在出了 1-2 单后要立刻跟 2-3 家店铺留言及电话确认货源充足及发货速度问题...延迟 3-5 天发货很容易退款退单。
  - 发现爆款后多个账号测同款产品，短视频引流到橱窗同个店铺抓紧时间抢钱，打仗速战速决利益最大化。
  - 爆款产品让店铺定制链接，主图，SKU，详情页，价格等都可以修改，这样可以促进出单以及提升客单价。
  - 本质上和在抖音视频号没有什么区别，都是依赖于【博概率】...所以如果想提升爆的概率，就必须做矩阵。
  - 如果一个号单品你发了 30 个笔记以上，还没有什么进展，我建议就直接注销账号重新换品搞吧。
- 'no': 4
  name: 风控红线与供应链熔断机制 —— 4.2分生存线、48小时发货红线、多级备选动态切换
  points:
  - '**店铺体验分生存阈值**'
  - '- 新店初始4.5分，低于4分触发隐藏下架，合作门槛建议≥4.2分；物流分易因偏远地区发货纠纷拉低，必须预设不发货区域(港澳台/偏远省份)'
  - '- 实测验证：2-3款产品因合作店铺分数过低被平台下架/隐藏，爆款流量无法转化、佣金直接归零，证明‘店铺分≥4.2’为硬性准入指标'
  - '**供应链熔断三板斧**'
  - '- 多店铺备选：建立‘主供/备供1/备供2’三级档案(发货时效/库存同步/联系人/切换触发条件)，茶壶案例切换5-6家仍损失数千佣金，证明单一依赖风险极高'
  - '- 即时催单：出单后立刻电话/留言跟进发货时效，每天多次催促，东哥‘每天去店铺多账号下私信、留言、留下电话’'
  - '- 动态切换：发货延迟/退货率超标即启动切换，建立供应链响应速度SLA，将‘催发货’优先级设定高于‘发视频’'
  - '**橱窗运营优化**'
  - '- 顶部保留2-3个爆款供选择；叠加高客单(≥30元)/高佣(≥30%)/高销量(>100单)畅销品作为长尾，利用爆款流量溢出带动长尾成交'
  - '- 置顶视频3位权重递减(左1>中>右1)动态调序，配合橱窗活动标题‘关注头像商品橱窗下单’引导下单'
  - '**边界条件**'
  - '- 315等节点主动下架商品链接避险：平台集中打击虚拟类目，保全大店存活，风波过后再上架'
  - '- 个体户执照注册公众号推流受限：社群共识个体工商户营业执照注册公众号存在不给推流/效果差风险，建议新手优先用个人身份证注册'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  - paper: docs/202305/20230516_034.md
    role: improve
  - paper: docs/202305/AxQ8duaITowcrCx54hocWSy4nnb.md
    role: apply
  excerpts:
  - 现在视频号新开店铺的评分一般是 4.5 分...低于 4 分的店铺，很容易被平台隐藏下架...尽量选择店铺分数高（≥4.2 分），以及物流分数高的店铺进行合作。
  - 建议有店铺的小伙伴，在店铺后设置偏远地区/港澳台地区等不发货。
  - 出单了，千万要立刻跟店铺确认并跟踪发货时效问题。避免爆单后迟迟无法发货，最终需要售后处理等情况发生。
  - 我每天去这个店铺的多账号下私信、留言，留下电话却杳无音讯。最后这 30 多单仅发货了 1/3 ，到手的鸭子飞了。
  - 累计切换了 5-6 家店铺。而因为店铺联系不上，延迟发货，疫情退货等原因，我还是损失了几千元的佣金。
  - 橱窗里面根据出单情况产品排序。顶部爆款产品有 2-3 个供客户选择。另外橱窗里面再添加一些客单价≥30 元，佣金比率 ≥30%，销量过百的畅销品。
