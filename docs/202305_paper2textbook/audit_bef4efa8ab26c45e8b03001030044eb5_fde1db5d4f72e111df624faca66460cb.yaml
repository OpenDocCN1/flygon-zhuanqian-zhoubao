  claim: 认知清晰度 K(t) = ∫ L(τ)·D(τ) dτ 为核心公式推导
  reason: 素材中未找到该积分公式，仅为文字表述“通过学习不断加深认知”
- location: '2.4'
  claim: 行动坚定度 R 为认知清晰度 K 的分段函数，存在阈值 θ
