life_analogy:
- 想象视频号挂车投流是一场**精心设计的‘自动售货机’生意**：
- '- **选品** = 填充货架的商品：必须是高毛利、高需求、低差评的‘畅销款’，否则机器摆在那里也没人买'
- '- **混剪去重** = 给商品换包装：同样的‘货’（素材），换个‘外壳’（MD5/关键帧/调色）让查重机器（城管/安检）认不出是‘地摊货’，从而合法上架'
- '- **随心推** = 试运营期：新机器上线先不赚钱，投钱请人来买（买流量），目的是训练‘推荐算法’（店员）记住谁爱买这货（养模型）'
- '- **千川** = 规模化放量：模型练准了，开更多机器（计划），精准投放广告（人群包），用‘正反馈平衡负反馈’（补货+促销+装修）持续榨取利润'
- '- **ECPM** = 单位货架产出：平台只给‘单位时间赚钱最多’的机器（计划）黄金货架位（流量），不赚钱的直接撤机器'
- '- **角色扮演/场景立体化** = 店员话术与店面装修：再好的货，店员（主播/口播）不会吆喝、店面（背景）脏乱差，转化率必低'
- 就像开自动售货机，选品定生死，素材定上限，投流定规模，算法博弈定存活。
summary:
- concept: 短视频挂车投流
  desc: 视频号最稳定带货玩法：制作视频挂商品链接付费投流，具稳定/可复制/可放大/不废号四大优势，但属钱生钱项目有资金门槛
- concept: 选品四渠道三红线
  desc: 爆单秘籍/跟爆款/榜单/避坑四渠道筛选；避开高播强竞品/差评>6-8%/体验分<4.8三红线，选品决定上限
- concept: 混剪去重七步法
  desc: 针对MD5/关键帧/像素/音频查重机制，通过调参/特效/变速/镜像/贴纸/换BGM/调色七步技术处理实现过原创审核
- concept: ECPM竞价底层逻辑
  desc: ECPM=估算点击率×估算转化率×目标出价×1000；挂车视频核心看点击率/转化率/GPV/GPROI/人均观看时长/完播率
- concept: 随心推全生命周期
  desc: 测品期(智能/自动/24h/亏损养模)→优化期(ROI目标出价)→高峰期(手动/2h/1.2倍佣金/70%消耗降价5%)→过渡期(均价×佣金率反推千川)
- concept: 随心推反推千川
  desc: 用随心推跑出均价(总销售额/订单数)计算千川初始出价=均价×佣金率，过新手期(20单)后出价=初始出价/1.2
- concept: 千川冷启动标准动作
  desc: 搭建:莱卡定向>5亿/保守出价(佣金/1.2)/开成本保障→学习期:高价亏本+一键起量/高峰预热→稳定期:正负反馈平衡/规避创意挤压
- concept: 算法博弈正负反馈平衡律
  desc: 每个负反馈(降价)必配正反馈(加预算/延时长/换素材)，正≥负，避免向算法传递'不想跑了'信号导致模型衰退
- concept: 真人出镜角色扮演法
  desc: 设定具体沟通对象(给妈妈聊天/训斥学生/憋尿急说话)调整语气微表情，将创作者转化为演员增强真实感代入感
- concept: 场景立体化分级
  desc: 青铜(扁平书架压抑)→王者(墙角+绿植/暖光灯/摆件构造景深)，用最低成本制造高级感专业感
- concept: 书单四代形态进化
  desc: A4书单(2019极简)→笔记书单(2021笔记呈现)→讲座书单(2022权威人设)→划线书单(高光金句可视化)，核心逻辑大道至简低成本量产
- concept: 红利窗口期论
  desc: 内容形态早期靠自然流，后期必须投流维持；跟风不吃肉也能喝汤，关键在于尽早入场+配套投流能力
- concept: 爆款五种思维
  desc: 热点思维(蹭热度)/利他思维(给价值)/发散思维(一题多解)/创造性思维(差异化)/复盘思维(数据驱动迭代)
- concept: 六大底层传播逻辑
  desc: 选品、文案、拍摄、剪辑、投流、主播/人设——缺一不可，思维决定上限，逻辑决定下限
- concept: 官方出圈效应与前3秒法则
  desc: 人群出圈(大众化)/内容出圈(反差冲突)/形式出圈(新奇特)；前3秒留人，黄金前5秒阐述核心
- concept: 口播文案三板斧
  desc: A.抄抖音爆款图文转口播(规避非原创/爆率70%+) B.搬小红书笔记对着镜头读 C.蹭热榜/官方活动流量红利
exercises:
- 'no': 1
  title: 实战演练：从0到1跑通一个视频号挂车投流测品闭环
  contents:
  - 背景：你有一个新注册的视频号，预算500元测品资金，目标跑通0-1出单。
  - 任务1：选品实操
  - '  1. 打开视频号后台‘爆单秘籍’，筛选近7天佣金率>30%、带货销量>100单、体验分>4.8的商品，记录3个备选品。'
  - '  2. 在视频号搜索这3个商品关键词，找到点赞>1000的带货爆款视频，分析其选品逻辑与呈现形式。'
  - '  3. 查看这3个商品的差评率，若>6-8%直接剔除。'
  - 任务2：素材搬运与去重
  - '  1. 用采集工具下载对标爆款视频（优先口播类），导入剪映/去重软件。'
  - '  2. 执行七步去重：修改MD5(调参数)→加转场特效→变速(0.9x/1.1x)→镜像翻转→加贴纸/字幕遮挡关键帧→换BGM→调色(滤镜强度10-20)。'
  - '  3. 导出视频，上传视频号挂车发布，观察是否通过原创审核。'
  - 任务3：随心推测品投放
  - '  1. 新建计划：系统智能投放、自动出价、24小时、预算100元/条、无定向。'
  - '  2. 同时测3条素材（每条挂1-2个链接），观察6小时数据：花费、展现、点击、下单、ROI。'
  - '  3. 复盘判断：哪条素材‘能出单且ROI>0.8’？哪条‘花费>50元无转化’需关停？'
  - 任务4：数据反推与决策
  - '  1. 若有素材出单，计算：平均客单价=总销售额/订单数；千川初始出价=平均客单价×佣金率。'
  - '  2. 回答：为何测品期必须选‘系统智能投放’而非‘自定义定向’？为何投放时长建议24小时？'
  - '  3. 回答：若测品3条素材均无转化，是换素材、换品、还是加预算？依据是什么？'
- 'no': 2
  title: 算法博弈实战：千川计划从学习期到稳定期的参数调优推演
  contents:
  - 场景：某高客单价商品(客单价200元，佣金40%)，随心推测品跑出均价195元，ROI稳定1.3，准备进千川放量。
  - 任务1：计划搭建参数设定
  - '  1. 计算保守安全出价上限：佣金/1.2 = ? 元。'
  - '  2. 莱卡定向如何设置才能保证覆盖人群>5亿？若覆盖仅3亿，应放宽哪些定向标签？'
  - '  3. 是否开启‘成本保障/控成本投放’？为什么？'
  - 任务2：学习期操作推演
  - '  1. 学习期出价策略：起步出价设为保守出价的1.5-2倍，开启‘一键起量’2-6小时，目标跑够20单出新手期。'
  - '  2. 高峰期预热：早/中/晚高峰前半小时建计划，为何要提前预热？'
  - 任务3：稳定期博弈决策树
  - '  现象A：计划跑量3天，突然第4天不消耗了，余额充足、发货率正常。'
  - '  - 诊断核心原因：ECPM竞争力不足(点击率/转化率下降被同行挤压)。'
  - '  - 自救动作：①优化素材(换新钩子/换新素材) ②优化定向商品 ③智能放量。按优先级排序。'
  - '  现象B：高点击率(3%)但低转化率(0.5%)，ROI<1。'
  - '  - 诊断：价值塑造不到位 或 市场饱和。'
  - '  - 决策：直接换素材，不可降价死扛。为什么？'
  - '  现象C：转化率稳定，但想降价提高ROI。'
  - '  - 操作：降价5%的同时，必须做什么正反馈动作？(加预算/延时长/换优质素材三选一或组合)。'
- 'no': 3
  title: 内容制作实战：口播带货视频的‘角色扮演+场景立体化’标准化拍摄
  contents:
  - 任务：为一款‘中老年关节贴’产品，拍摄一条15秒口播带货视频。
  - 步骤1：文案结构拆解（黄金前5秒法则）
  - '  - 前3秒钩子(视觉/听觉/认知)设计：'
  - '  - 前5秒核心阐述(痛点+方案+产品)话术：'
  - '  - 中间干货/信任背书(成分/证书/案例)：'
  - '  - 结尾引导(点击左下角/限时优惠)：'
  - 步骤2：角色扮演指令设定
  - '  - 选择沟通对象：给妈妈聊天 / 训斥学生 / 憋尿急说话 / 其他：______'
  - '  - 该指令对应的语速/语气/微表情关键词：'
  - 步骤3：场景布置执行清单
  - '  - 拒绝扁平书架，寻找家中/办公室最佳墙角位置：______'
  - '  - 道具准备：绿植(是/无) 暖光灯/补光灯(是/无) 摆件/书籍装饰(是/无)'
  - '  - 景深测试：站在离墙角1.5米处，手机竖屏录制，背景虚化效果检查(主体清晰/背景虚化/有层次感)。'
  - 步骤4：工具辅助与拍摄
  - '  - 将文案导入剪映提词器，调整字号/滚动速度匹配语速。'
  - '  - 手机固定支架/手持稳定器，对着镜头按角色扮演指令录制3遍。'
  - 步骤5：剪辑检查项
  - '  - 前3秒是否有字幕/特效/音效强化钩子？'
  - '  - 画面切换/转场是否配合语气节奏？'
  - '  - 结尾是否加了‘点击左下角小黄车’引导手势/贴纸？'
  - 复盘问题：
  - '  - 对比‘对着镜头念稿版’vs‘角色扮演版’，完播率/平均观看时长差异预估多少？'
  - '  - 若无实体墙角/采光差，如何用虚拟背景/绿幕/补光灯替代实现王者级场景？'
- 'no': 4
  title: 形态迭代复盘：书单带货从A4到划线的四代进化与投流依赖性验证
  contents:
  - 任务：梳理某书单账号(或竞品账号)的内容形态演变史与投流节点。
  - 步骤1：形态识别与时间线标注
  - '  - 账号早期(首发-100条)主要形态：A4书单/笔记书单/讲座书单/划线书单/其他：______'
  - '  - 该形态期间是否投流？自然流最高单条播放/佣金：______'
  - '  - 形态迭代节点(约第几条/何时)切换为下一代形态：______'
  - '  - 切换原因：自然流量衰减/竞品投流/平台扶持新形态/主动求变：______'
  - 步骤2：投流依赖性验证实验
  - '  - 取当前主流形态(如划线书单)近10条视频，分为两组：'
  - '  - A组(5条)：不投流/仅自然流发布，记录7天播放/点击/转化。'
  - '  - B组(5条)：同素材/同文案，投随心推100元/条(系统智能/24h)，记录7天数据。'
  - '  - 对比：B组平均播放/转化/ROI 是否显著优于A组？验证‘不投流则无法起量’结论。'
  - 步骤3：跨平台形态迁移测试
  - '  - 将抖音验证过的爆款划线书单素材(文案/音频/封面)，迁移发布至视频号/快手。'
  - '  - 观察：是否仍具爆款潜质？需微调哪些要素(如封面尺寸/话题标签/发布时间)？'
  - 复盘问题：
  - '  - 为何‘大道至简’的形态生命周期最长？下一代形态会更简单还是更复杂？'
  - '  - 晚入场者只能喝汤，核心优势在于什么？如何判断当前形态红利期已结束？'
- 'no': 5
  title: 综合实战：短视频带货‘六大底层逻辑’自查与短板补强计划
  contents:
  - 对照‘选品、文案、拍摄、剪辑、投流、主播/人设’六大要素，对当前项目/账号进行打分(1-10分)与短板分析。
  - 自查表：
  - '  1. 选品(____分)：是否有标准化选品SOP(四渠道三红线)？近期测品出单率____%？'
  - '  2. 文案(____分)：是否有爆款文案库/模板？前3秒钩子/前5秒核心是否标准化？'
  - '  3. 拍摄(____分)：真人出镜是否用角色扮演法？场景是否王者级？设备/光影是否达标？'
