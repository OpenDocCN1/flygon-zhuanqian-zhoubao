      desc: 基于香农信息论（新颖性=惊讶度）与个人经验独特性，建立信息入库‘漏斗’：仅保留服务于当前/未来项目、能激发灵感、具有惊讶度、属于私人独特思考的素材，拒绝无差别囤积。
      role: method
      src:
      - paper: docs/202305/20230516_061.md
    - 'no': 3
      name: 渐进式总结五层法：信息→知识→智慧的标准化萃取
      desc: 引入 Tiago Forte 五层脚手架：L1 高亮标记 → L2 自语复述（内化） → L3 段落合并（结构化） → L4 核心观点压缩
        → L5 转化为提问（迁移/智慧）。按素材价值密度决定执行层级，兼顾深度与效率。
