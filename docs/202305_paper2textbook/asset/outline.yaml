      src:
      - paper: docs/202305/20230516_061.md
    - 'no': 4
      name: 动态 P.A.R.A 组织系统：让笔记流向‘最快用到之处’
      desc: 摒弃静态分类，采用‘项目→领域→资源→档案’四象限动态流转。决策树：服务当前截止日期项目→Project；服务长期责任领域→Area；其余→Resource；完成/废弃→Archive。组织服务于行动而非分类。
      role: method
      src:
