    - 'no': 2
      name: CPC/EPC 套利数学模型：只要 CPC < EPC 即稳赚
      desc: 品牌词 CPC 压至 0.01 以下，联盟 Offer EPC 极少低于 0.01，差价即利润；三组实盘：佣金 $5715/$7218/$3988
        对应花费 $1220/$1210/$867，净利 $4495/$6008/$3121。
