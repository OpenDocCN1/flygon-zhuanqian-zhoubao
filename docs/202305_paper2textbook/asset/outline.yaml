    desc: 本章对比两篇实战复盘，揭示资料整理的商业本质：资料是零边际成本的杠杆钩子，核心利润来自后端自有高附加值产品/服务体系。通过 MVP 思维跑通“选品-引流-私域-分层变现”最小闭环。
    nodes:
    - 'no': 1
      name: 资料整理的杠杆属性与商业定位
      desc: 基于纳瓦尔杠杆理论，界定资料整理为‘复制边际成本近零’的媒介产品，其核心价值不在于贩卖资料本身，而在于筛选精准付费用户、沉淀私域资产。
