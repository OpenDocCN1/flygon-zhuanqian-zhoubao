      desc: 花爷四波：入门教育/垂直应用/工具开发/多平台大厂。普通人应避开工具层（技术门槛/推广难/合规风险）与多平台层（大厂垄断），聚焦‘GPT+垂直业务’应用层，将AI能力嵌入成熟流程解决效率/流量痛点。
      role: theorem
