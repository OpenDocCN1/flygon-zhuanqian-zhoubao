      desc: 作者实测：基于该系统产出14篇精华帖、统筹2.4万订阅专栏。读者对比反馈：渐进式总结较卢曼卡片笔记法门槛更低、操作指引更强、更难陷入‘通篇搬运’陷阱。
      role: experiment
      src:
