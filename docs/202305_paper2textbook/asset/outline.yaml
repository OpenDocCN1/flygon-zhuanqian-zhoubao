      desc: 1. 准备 Google Ads 账户（个人/代理）；2. 注册 Awin 等双周支付联盟，筛选大体量品牌词/允许竞价/EPC 高的 Offer
        并申请通过；3. 创建搜索广告竞价品牌词/竞品词，最终 URL 直填联盟追踪链接（Direct Linking），无需建站。
      role: method
      src:
      - paper: docs/202305/M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    - 'no': 4
