  - 'no': 6
    name: Mediabuy 品牌词套利 —— 近零 CPC 与联盟佣金差价的单人美元项目
    desc: 本章揭示利用 Google Ads 竞价商家品牌词（CPC 近 0.01 当地货币）直链联盟追踪链接（Awin 双周支付）的套利模式：三组实盘账户
      ROI 359%-496%，核心在于品牌词质量得分极高且无竞争、商家授权光谱（显性允许/默许/允许竞品词）保障合规、港币账户可再降 7 倍成本、单人年入百万轻松达成。
    nodes:
    - 'no': 1
      name: 品牌词近零成本定理：质量得分满分、无竞争、CPC→0
      desc: 竞价广告主自身品牌词，相关性极高致质量得分满分，且通常无竞对竞价，实际 CPC 稳定在 0.01 当地货币，是项目高利润的物理基础。
