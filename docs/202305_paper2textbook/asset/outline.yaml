    name: 认知底座 —— 从“想赚钱”到“会赚钱”的思维重构
    desc: 本章拆解生财圈核心心法：利他思维、执行力优先、承认无知、个人IP复利。这是普通人跨越“认知鸿沟”，从打工思维转为商业思维的必修课。
    nodes:
    - 'no': 1
      name: 利他思维：商业协作的底层逻辑
      desc: 优先为用户/合作伙伴创造价值、解决问题，而非单向索取。这是高客单价、高复购业务的基石，也是生财圈文化的核心基因。
      role: motivation
      src:
      - paper: docs/202305/SUMMARY.md
      - paper: docs/202305/SUMMARY.md
    - 'no': 2
      name: 执行力 > 创意/认知：在行动中修正认知
      desc: 好主意很多，做下去的很少。认知突破的本质是在行动中获得反馈修正认知，而非空想。核心口诀：解决真正的问题，赚钱的事多做十遍。
      role: method
      src:
      - paper: docs/202305/SUMMARY.md
    - 'no': 3
      name: 承认无能与无知：成长的起点
      desc: 普通人逆袭第一步是接纳自己‘无能、无知、无资源’的现实，放下体面，从最微小、最具体、最确定的正反馈动作做起（如抄作业、跟航海、卖资料）。
      role: motivation
      src:
      - paper: docs/202305/SUMMARY.md
    - 'no': 4
      name: 个人IP复利策略：百年不改名，全域用同名
      desc: 个人IP是普通人最高杠杆的资产。统一ID、头像、简介降低用户认知成本，积累品牌复利。出名是赚钱的代价，也是获取信任、降低获客成本的护城河。不出镜也能打造IP（资料号、工具号、笔记号）。
      role: method
      src:
      - paper: docs/202305/SUMMARY.md
      - paper: docs/202305/SUMMARY.md
      - paper: docs/202305/SUMMARY.md
  - 'no': 2
