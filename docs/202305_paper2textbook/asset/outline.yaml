    - 'no': 8
      name: 全网SEO‘平台无关、流量为本’公理
      desc: SEO本质不绑定单一平台，用户在哪搜索就做哪里SEO：挖掘官方关键词→生产高匹配内容→获取站内搜索+外部搜索引擎双重流量。GPT作为通用内容生产力工具无缝适配所有平台。
      role: theorem
      src:
      - paper: docs/202305/20230516_072.md
  - 'no': 8
    name: 需求挖掘与产品化交付 —— 发现、验证、解决需求的通用三部曲
    desc: 本章提炼跨行业、跨周期的通用商业落地思维模型：从生活对话/数据/热点中发现需求→评论区/搜索指数/私信低成本验证真伪→拆解问题、组合现有工具资源（而非硬核自研）低成本解决→流量转化变现。通过‘AI四维预测宝宝长相’、‘碳中和知识付费’、‘为TA点歌’三大实战案例，演示底层逻辑的跨域复用与反脆弱性。
    nodes:
    - 'no': 1
      name: 需求三部曲：发现-验证-解决的通用商业落地模型
      desc: 发现：留心生活对话/数据/热点；验证：评论区高频提问/搜索指数/私信回复验真伪；解决：拆解问题→组合现有工具资源（资源重组交付法）逐步攻克。核心主张：项目不值钱，挖掘逻辑与思考能力才是持续变现源泉。
      role: method
      src:
      - paper: docs/202305/20230516_073.md
    - 'no': 2
      name: 评论区需求验证法：最直接、最低成本的真伪探测器
      desc: 进入短视频/内容平台搜索关键词，分析评论区高频提问（‘怎么做’、‘多少钱’）、情感表达（‘好想快点看到’）及寻求方案语义，判断需求强度与真伪。
      role: method
      src:
      - paper: docs/202305/20230516_073.md
    - 'no': 3
      name: 资源重组交付法：非标服务标准化拆解与供应链整合
      desc: 不会核心技能（弹唱/专业知识）时，拆解交付物本质（视频而非现场）→利用外部现成资源（唱吧素人音频/合作网络/公开资料）重组交付流程，实现个人能力与业务交付解耦、低成本规模化。
      role: method
      src:
      - paper: docs/202305/20230516_073.md
    - 'no': 4
      name: AI提示词迭代优化法：挑最难案例→垫图→找缺陷→加负面词/修饰词→回归测试
      desc: 针对生成式AI可控性不足，以最难案例为基准迭代Prompt：垫图生成→发现缺陷（皮肤坑洼/肤色不均/不似）→针对性加词→多案例回归→沉淀‘扛打的关键词组’。
      role: method
      src:
      - paper: docs/202305/20230516_073.md
    - 'no': 5
      name: 实证案例一：AI四维预测宝宝长相——评论区验证+Prompt迭代+B2B2C模式
      desc: 评论区‘有软件看长相么’精准验证需求→Prompt迭代解决技术难题→多平台获客→合作9家私立医院，建立稳定高客单B2B2C模式，证明‘不卷平台流量，依然有稳定高单价订单’。
      role: experiment
      src:
      - paper: docs/202305/20230516_073.md
    - 'no': 6
      name: 实证案例二：碳中和项目小白极速变现——3天输入+现学现卖+大白话框架化
      desc: 纯小白3天高强度学习→同步输出大白话/条理化/框架化内容→第3条视频500万播放→2个月变现100万+（资料包/证书/培训/资源对接），验证‘把复杂概念大白话化’即可满足大众入门需求，无需深度专业背景。
      role: experiment
      src:
      - paper: docs/202305/20230516_073.md
    - 'no': 7
      name: 实证案例三：为TA点歌零技能交付——招募合作者+剪辑素人音频双路径跑通
      desc: 不会弹唱，通过‘招募合作弹唱者’与‘剪辑唱吧素人音频’双路径跑通交付，订单接到手软，验证‘核心交付物是视频而非技能’，技能缺口可供应链整合填补。
      role: experiment
      src:
      - paper: docs/202305/20230516_073.md
    - 'no': 8
      name: 多项目组合运营的反脆弱性：单一项目周期短，思维模型跨域复用长
      desc: 连续操盘四维预测、碳中和、点歌、陪诊、数藏、鉴渣、相亲盲盒等无关项目均盈利；单项目（碳中和）因天花板停更但整体收益持续，积累‘只要出手，必有回响’底气，证明思维模型迁移能力强于单一业务护城河。
      role: experiment
      src:
      - paper: docs/202305/20230516_073.md
