  - 'no': 2
    name: 知识创作系统 —— 从“囤资料”到“生产知识资产”
    desc: 本章基于 DIKW 模型与 P.A.R.A 组织法，构建‘收集筛选→萃取内化→动态组织→创作输出’的个人知识生产线，解决‘收藏夹吃灰’与‘搬运工’困境，实现知识复利。
    nodes:
