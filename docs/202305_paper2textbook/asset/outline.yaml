      name: PIM/PKM/知识创作的三层级跃迁
      desc: 澄清资料整理（PIM，整理他人信息）、知识管理（PKM，加工自有信息）、知识创作（输出原创成果）的本质区别。只有建立以创作输出为导向的系统，才能避免低水平勤奋。
