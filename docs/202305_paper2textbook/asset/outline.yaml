      desc: 设计三层递进变现路径：低价资料（筛选付费意向/建立信任）→ 低价咨询（深度连接/挖掘需求/互惠红包）→ 高客单产品/训练营/资源对接（核心利润/复利上限）。
      role: method
      src:
      - paper: docs/202305/20230516_046.md
      - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
    - 'no': 4
