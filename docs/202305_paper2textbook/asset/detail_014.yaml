- 'no': 6
  name: LoRA训练标准化五步工作流 —— 从数据到复现的工业级SOP
  points:
  - '**为什么需要这个概念？**'
  - '- LoRA训练被视为“炼丹”，参数多、经验依赖强、不可复现、难以规模化'
  - '- 业务落地需稳定、可复现、可评估的模型产出，而非靠运气的单次成功'
  - '- 需要将训练全流程标准化为可执行、可考核、可迭代的SOP'
  - '**核心定义**'
  - '- 五步工作流：训练集准备(筛选/裁剪/打标/减标) → 模型训练 → 模型测试复盘(XYZ Grid+评估表) → 参数反推复现 → 业务落地应用'
  - '- 核心创新：减标签将权重迁移至触发词、自动聚焦裁剪、WD14打标+Dataset Tag Editor减标工具链'
  - '**关键性质**'
  - '- 训练集质量双维度：原图像素质量 + 标签精准度（结构化Danbooru标签优于自然语言）'
  - '- 触发词机制：人为添加唯一标识符(如shengcai)，推理时一词调用完整概念'
  - '- 标签权重迁移：删除描述性标签后，其权重自动聚合至触发词，实现“一词出图”'
  - '- 训练分辨率=推理分辨率：512训练生成1024易崩坏(多头/结构错)，分辨率域必须对齐'
  - '- Metadata反推：C站模型自带元数据可还原完整训练配方(底模/分辨率/Dim/LR/Epoch/数据集规模)'
  - '**典型例子**'
  - '- KoreanDollLike v1.0复现：URPMChill底模，(713,891)分辨率，110图x100重复，Dim=128, LR=1e-4,
    Epoch=1, Steps=5500, bf16, Clip Skip=2'
  - '- 自动聚焦裁剪：开启后以检测主体(人脸/人体)为中心裁剪512x512，解决主体偏心丢失问题'
  - '- XYZ Grid网格测试：X轴Epoch，Y轴Weight(0.4-1.0)，固定Prompt/Seed肉眼对比收敛度/过拟合/灵活性'
  - '**边界条件**'
  - '- 数据集多样性>数量：角度/场景/光照多样性比堆砌同质图更关键，单一角度训练泛化崩塌'
  - '- 镜像翻转/裁剪扩充数据易导致过拟合，建议少量使用或不使用'
  - '- 训练集图片不足时，优先找真实多角度素材，而非靠数据增强凑数'
  - '- 不同底模(如SD1.5/SDXL/Pony)训练的LoRA不互通，业务选型时需锁定底模生态'
  - '...'
  sources:
  - paper: docs/202305/ZXvbdq7RGoKEeLxryxAckCtSnPf.md
    role: origin
  excerpts:
  - 训练集的质量直接影响到后面的模型训练，训练集的质量在我看来包含两部分，一个原图的质量，另一个是对图片的精准总结（即打标签tag）
  - 如果要训练lora模型，需要添加一个未来用于触发该lora模型的触发词，我这里在附加标签里添加了shegncai
  - 减少标签并不会导致模型在学习的时候不学习小姐姐的个人特征，而是会把这些删除的特征的权重全部加到前面的词汇里。例如删除 short hair, brown hair...
    这些tag后，这些tag的训练权重会自动加到shengcai这个排在标签序列前面的这个词里
  - 自动焦点裁切：这个意思是当图片比较大的时候，人物如果不在图片中心，开启这个时候会自动以人物为中心进行裁剪，不会把人物裁掉
  - 推荐打标工具：Waifu Diffusion 1.4 标签器stable-diffusion-webui-wd14-tagger... 感觉这个工具在生成文字说明标签时更精准，不会出现乱码的标签
  - 推荐减标工具：数据集标签编辑器stable-diffusion-webui-dataset-tag-editor... 选择batch edit captions-移除-frequency-descending...
    选择和人物个人相关的标签... 点击remove selected tags就可以删除多余的标签完成批量减标了
  - a）生成xyz表：把本次训练的不同epoch模型放在x轴上，y轴设置不同的权重参数，用文生图把模型跑出来图片看看
  - 如果你在c站或者其他地方看到一个很喜欢的lora模型，你想知道怎么训练的... 现在都可以了，具体方法如下：打开lora模型，找到你喜欢的lora模型，点show
    metadata
  - '以KoreanDollLike v1.0版本为例，它的元数据如下，所有训练参数已经知道了... ss_sd_model_name: URPMChill.ckpt,
    ss_resolution: (713, 891), ss_num_train_images: 11000, ss_dataset_dirs: {100_GiniS2:
    {n_repeats: 100, img_count: 110}}, ss_network_dim: 128, ss_network_alpha: 128.0,
    ss_learning_rate: 0.0001, ss_text_encoder_lr: 5e-05, ss_epoch: 1, ss_max_train_steps:
    5500, ss_mixed_precision: bf16, ss_enable_bucket: False, ss_flip_aug: False, ss_color_aug:
    False, ss_clip_skip: 2'
  - 和你使用文生图的的业务场景相关，例如你用512*512的图片训练了模型，但是使用的时候生成大于512的照片（实测用515*512训练的模型生成1024宽度图片时，输入1girl可能会出现生成多个人）
