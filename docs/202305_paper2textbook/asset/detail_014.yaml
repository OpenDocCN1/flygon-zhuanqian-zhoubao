  name: Stable Diffusion三大应用分层 —— 辅助设计、AI模特、分镜脚本的场景化落地
  points:
  - '**为什么需要这个概念？**'
  - '- SD生态已成熟（WebUI/ControlNet/海量模型），非技术人员可直接通过界面操作生产'
  - '- 技术参数调试非业务价值，核心在于将能力封装进具体业务场景解决真问题'
  - '- 需要明确的应用分层指引，避免在底层技术内耗，直击商业落地'
  - '**核心定义**'
  - '- 辅助设计：产品设计(Canny+Prompt)、建筑设计(Canny+建筑LoRA)、海报设计'
  - '- AI模特：真人模特换装/换背景，流程=ChilloutMix大模型+ControlNet+Inpainting局部重绘'
  - '- 分镜脚本：影视/动画前期可视化，利用M-LSD/Canny+风格LoRA保持线条结构一致性'
  - '**关键性质**'
  - '- 零代码生产力：产品/设计/运营人员无需懂代码，通过WebUI/插件界面直接驾驭'
  - '- ControlNet+LoRA组合范式：结构控制用ControlNet(Canny/M-LSD/OpenPose)，风格/身份固定用LoRA'
  - '- 应用层切入最佳时机：模型层/工具层红海，应用层蓝海，将能力封装进垂直业务才是核心价值'
  - '**典型例子**'
  - '- 产品设计：上传草图/线稿，Canny提取边缘，Prompt注入材质/光影，批量出渲染图'
  - '- AI模特：拍摄实拍产品图，ControlNet锁定姿态/结构，Inpainting换模特/背景，成本降90%'
  - '- 建筑设计：输入CAD线稿，M-LSD提取几何结构，加载建筑LoRA，一键出不同风格效果图'
  - '**边界条件**'
  - '- 产品设计需高质量线稿输入，手绘草图噪声大需先清洗'
  - '- AI模特面部一致性依赖ChilloutMix等真人大模型底座，跨底模迁移效果打折'
  - '- 分镜脚本长序列一致性仍依赖Prompt工程与Seed固定，非完全可控'
  - '...'
