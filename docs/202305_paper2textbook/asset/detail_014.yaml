  name: 小红书“群聊中转+小号留痕”引流私域法 —— 规避风控的公私域连接器
  points:
  - '**为什么需要这个概念？**'
  - '- 小红书严打直接留联系方式（微信号/二维码），主号违规必封'
  - '- 公域粉丝归平台，流量不可控、触达率低、变现弱，必须沉淀至私域'
  - '- 需要一套合规、低风险、可裂变的标准化引流动作'
  - '**核心定义**'
  - '- 三步走策略：主号发笔记挂钩子(教程文档) → 评论区置顶小红书群聊链接 → 用户进群 → 小号在群内回复/置顶微信号/群二维码 → 用户加微信进私域群'
  - '- 文档末尾放微信群二维码，利用用户转发分享实现裂变传播'
  - '**关键性质**'
  - '- 风险隔离：主号不直接留联系方式，小号承担违规风险，主号权重安全'
  - '- 合规性：群聊链接为平台原生功能，不违规；小号群内留痕隐蔽性强'
  - '- 自传播性：文档被分享即带二维码，实现“用户帮你拉新”的裂变效果'
  - '**典型例子**'
  - '- 作者实战：教程文档作为钩子，评论区置顶群聊，小号留微信，成功引流36+精准客户至私域，转化售课/定制服务'
  - '- 同法复用：该引流模型已迁移至AI头像定制、资料包分发等多个虚拟产品项目'
  - '**边界条件**'
  - '- 小号需养号（实名/活跃/无违规记录），否则进群即被系统判定营销号限流'
  - '- 群聊人数上限500人，需及时分群或清理僵尸粉，维持群活跃度'
  - '- 私域运营能力（朋友圈建设/话术转化/服务交付）是变现的充分条件，仅引流不转化等于零'
  - '...'
