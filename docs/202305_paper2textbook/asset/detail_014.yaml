  - '**核心定义**'
  - '- 利用云GPU平台(Google Colab/青椒云/AutoDL/RunPod等)远程运行SD WebUI'
  - '- 核心工程项：镜像构建(预装模型/插件/依赖) → 实例启动 → 网络穿透(Grpc/SSH/端口映射) → 持久化存储(挂载网盘/对象存储) → 定时任务/自动关机止损'
  - '**关键性质**'
  - '- 零本地算力依赖：浏览器即终端，任何设备(平板/手机/Mac/低配PC)均可接入'
