unsupported_claims:
- location: '35.3'
  claim: 实测数据显示（P001、P003），“纯规则+载体”模式（无人设无场景）场均停留约2-3分钟、关注率<1%；“加人设”场均停留提升至5-8分钟、关注率3-5%；“再加场景”场均停留破10分钟、关注率>8%。
  reason: 素材P001和P003中未包含上述具体量化数据（场均停留、关注率），仅定性提及“人设提升停留与转化”及“头部投流后无特色没流量”，无实测数据支撑。
- location: '35.4'
  claim: 四步自生长链路的量化锚点（实测经验值，P002）：残局库≥50个/分3级难度 → 悬念钩子开口率≥60%（进房前30秒留人） → 弹幕互动率≥15%（在线人数/弹幕条数）
    → 即时反馈延迟<10秒 → 算法分发触发阈值：场观峰值≥500且平均停留≥8分钟。
  reason: 素材P002仅定性描述“互动高、停留高、做人气容易、不用出镜、无投流”，未给出上述具体量化指标与阈值。
- location: '35.5'
  claim: 边际成本趋零（服装道具几百元、场景一次性布置、话术零成本）
  reason: 素材P003提及“几百元道具把卧室变沉浸剧场”，未明确给出服装道具具体价格、场景布置成本及话术成本为零的论证。
- location: '35.6'
  claim: 底薪标准（如3000-5000元/月）、绩效指标（日播≥4小时、场观峰值≥500、无违规）、提成比例（流水30%-50%）
  reason: 素材P004仅提出“如何拿底薪，有什么要求”及“公司提供权限/链接/底薪/运营指导”，未披露具体底薪数额、KPI细则、分成比例等合同条款。
- location: '35.7'
