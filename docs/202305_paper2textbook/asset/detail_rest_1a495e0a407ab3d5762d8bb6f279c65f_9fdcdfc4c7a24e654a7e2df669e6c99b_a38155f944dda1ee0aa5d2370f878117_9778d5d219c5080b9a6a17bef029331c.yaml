life_analogy:
- 想象生财实战体系是一场**从徒步到造火箭的进化游戏**：
- '- **生财小航海** = **新手训练营**：教练(导师)制定路线图(SOP)、设关卡(节点)、组队友(同伴监督)、你必须在规定时间跑完第一圈(0-1闭环)，否则淘汰'
- '- **利他思维** = **经营一家老字号饭馆**：不想着宰客一次(单向索取)，而是研制招牌菜(创造价值)、记住老主顾口味(深度运营)、出事了主动赔偿极致售后(亏佣金保客户)，最终街坊邻里口口相传排队买单(信任复利)'
- '- **执行力优先** = **学游泳不能光看书**：认知是旱地上练的动作，执行力是下水喝呛水的过程，只有在水里(市场反馈)挣扎、调整姿势，才能真正会游泳'
- '- **个人IP** = **种一棵树**：百年不改名是树种固定，全域用同名是根系深扎，统一视觉锤是树干粗壮，一致人设是树冠辨识度，时间复利让大树遮天蔽日，路人乘凉(流量)自然来'
- '- **公私域协同** = **开水果店**：公域平台是路边摆摊吆喝(蓄水池获客)，私域微信是把常客拉进VIP群发新鲜水果短信(提款机变现)，钩子设计是免费试吃的切块，诱饵是会员卡积分，承接路径是收银台扫码，转化话术是老板娘记得你爱吃甜的推荐新上市蜜瓜'
- '- **AI流水线** = **盖房子用预制板+起重机**：会用ChatGPT只会砌一块砖(单点技能)，建流水线是设计图纸(业务拆解SOP)、定制预制板(结构化Prompt)、起重机吊装(RPA/自动化串联)，一天盖一栋楼(批量产出)'
- '- **无货源电商** = **开便利店不囤货**：小红书是精品店(选品验证+SEO长尾)，闲鱼是跳蚤市场(矩阵霸屏+捡漏心理)，视频号是社区团购(银发高客单+投流放大)，供应链是一件代发商家，你只赚信息差和运营差'
- '- **知识付费** = **开私塾收学费**：个人IP是先生的金字招牌(信任背书)，标准化交付是统一教材教案(SOP/模板)，持续内容输出是每日讲课打卡，选客户比服务客户重要=只收想读书觉醒的学生'
- '- **海外出海** = **去隔壁富人区收废品卖高价**：Mediabuy品牌词套利=帮大品牌挂广告赚佣金(CPC近零EPC为正)，独立站B2B=专业博客展示实力(内容为王)接大单，跨境私域=微信换WhatsApp、朋友圈换INS，汇率杠杆让同样努力赚7倍'
- '- **长尾非标赛道** = **开专科诊所而非综合医院**：二奢是鉴定奢侈品真假(资金周转杠杆)，手机壳是定制个性化保护壳，写作店铺是代写演讲稿回忆录，快手知识付费是卖缓解焦虑的安慰剂，解决具体小问题=精准切除病灶，不治大病也能活得滋润'
summary:
- concept: 生财小航海
  desc: 外部约束容器强制跑通0-1闭环的训练营模式：截止节点+公开承诺+同伴监督+导师点评
- concept: 利他思维
  desc: 商业协作底层操作系统：先给价值后收对价，信任源于交易循环，极致售后护信，视个人信誉如羽毛
- concept: 执行力优先论
  desc: 认知在行动中迭代：解决真正的问题，赚钱的事多做十遍，双系统决策，信息差半衰期法则
- concept: 承认无能与无知
  desc: 成长起点：接纳无能无知现实，放下体面，从最微小确定的正反馈动作做起(抄作业/跟航海/卖资料)
- concept: 个人IP复利策略
  desc: 百年不改名、全域用同名、统一视觉锤、一致人设标签，指数级网络效应，真实人设暴露弱点建立信任
- concept: 公私域协同模型
  desc: 公域蓄水池获客、私域提款机变现，核心四大动作：钩子设计、诱饵制作、承接路径、转化话术，引流即销售
- concept: AI内容自动化流水线
  desc: 从会用工具到建流水线：文本层(ChatGPT)、图像层(SD/MJ)、视频层(剪映)三位一体，标题即产品AI为流水线工人
- concept: 结构化Prompt工程
  desc: 五段式模板(质量词+主体+细节+服饰+环境)+权重语法+万金油正反向词预设，覆盖90%生成场景
- concept: ControlNet多模态控制
  desc: OpenPose姿势迁移、Canny线稿上色、M-LSD室内结构保持、Depth/Normal空间控制，实现像素级可控
- concept: LoRA训练标准化五步工作流
  desc: 数据准备(筛选/裁剪/打标/减标)→模型训练→XYZ Grid测试复盘→Metadata参数反推→业务落地，减标签将权重迁移至触发词
- concept: 工程化量产体系
  desc: Generate Forever无人值守→多账号并行突破算力上限→账号池轮换无限出图→代码块打包下载解决文件获取
- concept: 平民无货源电商模型
  desc: 供应链轻量化底层逻辑：小红书三缺红利+双引擎流量+SEO长尾，闲鱼捡漏心理+矩阵霸屏+反养号，视频号银发高客单+身份证矩阵+投流三阶段
- concept: 知识付费高客单复利路径
  desc: 个人IP信任背书+标准化交付产品(SOP/模板/社群)+持续内容输出，选客户比服务客户重要，暴力交付筛选优质用户
- concept: 海外Mediabuy品牌词套利
  desc: 品牌词近零成本定理(CPC→0.01)+CPC<EPC套利模型+商家授权光谱保障合规+港币账户再降7倍成本+单人年入百万
- concept: 独立站B2B冷启动
  desc: 内容为王技术为辅(Google SEO博客文章获精准流量)、留钩子成交法(预判需求主动提供测试文件)、账号资产与广告资产分离
- concept: 长尾非标赛道
  desc: 解决具体小问题即生意：二奢三分货盘+资金周转杠杆+轻重协同，手机壳定制，写作店铺蓝海细分，快手知识付费认知套利+短链路正反馈，多项目组合反脆弱
exercises:
- 'no': 1
  title: 设计你的第一个生财小航海项目
  contents:
  - 根据六大黄金标准筛选一个适合你的新手项目：
  - 1. 正向现金流快（首单周期≤14天）
  - 2. 无需复杂供应链/囤货
  - 3. 可标准化/SOP化（能写成操作手册）
  - 4. 可借力AI工具提效（文案/图片/视频/代码）
  - 5. 有明确的公域获客路径（搜索/推荐/广告）
  - 6. 后端有高复购/高客单产品（LTV≥300元）
  - ''
  - 回答问题：
  - '- 你选择的项目是什么？为什么符合这六条标准？'
  - '- 设定21天航海目标：第一周完成什么？第二周完成什么？第三周完成什么？'
  - '- 你的导师/同伴监督机制如何建立？（如：加入什么社群、找谁做问责伙伴）'
  - '- 预估启动成本上限（锁定在''多吃几天泡面可恢复''区间）'
- 'no': 2
  title: 搭建个人IP最小可行性系统
  contents:
  - 在3个主流平台（如小红书/抖音/视频号/公众号/微信）同步注册/修改账号：
  - 1. 统一ID：取一个能用一辈子的名字（拼音/英文/中文均可，建议全网唯一）
  - 2. 统一头像：真人照/卡通形象/Logo三选一，尺寸适配所有平台
  - 3. 统一简介：一句话标签(如'专注XX领域避坑指南')+核心价值+联系方式/钩子
  - 4. 统一视觉锤：封面配色/字体/排版风格固定模板
  - ''
  - 回答问题：
  - '- 你的个人IP走哪条路径？一技之长IP（深耕行业经验）还是资源整合IP（盘点公开信息）？'
  - '- 你的核心人设关键词是什么？（如：自律搞钱狂魔/考证避坑指南/副业实测官）'
  - '- 计划首周输出3条内容，每条内容的选题基于什么用户痛点？'
  - '- 如何建立''内容即筛选器''机制：用什么内容筛选什么样的精准用户？'
- 'no': 3
  title: 跑通AI内容自动化最小闭环
  contents:
  - 选择一个你熟悉的内容赛道（如：法律科普/考证干货/AI工具测评/副业拆解），完成：
  - 1. 标题库建设：人工收集该赛道近30天爆款标题50个，提炼共性结构(如'数字+痛点+结果'/'反直觉认知+实操步骤')
  - 2. 结构化Prompt设计：基于五段式模板写一条通用Prompt，包含角色设定、输出格式、风格要求、禁词、变量槽位
  - 3. 批量生成测试：用ChatGPT/Claude输入10个不同变量跑10篇内容，记录生成耗时、需人工修改比例、发布后数据
  - 4. 自动化串联尝试：用Coze/扣子/Dify/剪映/按键精灵任一工具，实现'关键词→生成内容→定时发布'单链路打通
  - ''
  - 回答问题：
  - '- 你的Prompt版本迭代了几次？核心改进点是什么？'
  - '- 单条内容从选题到发布的人工耗时压缩了多少？（对比全人工 vs AI+半自动 vs 全自动）'
  - '- 遇到的最大技术瓶颈是什么？（API限流/格式混乱/内容幻觉/平台风控）'
  - '- 这个流水线月产能估算多少条？边际成本多少？'
- 'no': 4
  title: 设计公私域协同引流转化路径
  contents:
  - 针对你的项目/产品，设计完整的公私域协同SOP：
  - 1. 公域平台选择：用户画像匹配度最高的1-2个平台是哪些？为什么？
  - 2. 钩子设计：制作一个高感知价值、低获取成本的诱饵（资料包/工具/模板/体验券/社群邀请）
  - 3. 承接路径：主页简介/置顶笔记/私信自动回复/评论区引导/群聊入口，设计无缝跳转微信链路
  - 4. 私域转化话术：编写首条欢迎语+分层异议处理(贵/免费/怕骗/试用)+成交引导(收款码/链接/二维码)
  - 5. 朋友圈运营节奏：专业展示/生活真实/营销转化/互动维护 四类内容的周发布计划表
  - ''
  - 回答问题：
  - '- 你的钩子成本多少？预估引流转化率（加微率）多少？'
  - '- 如何规避平台风控？（小号隔离/表情包话术/关键词触发/企微卡片等具体技术手段）'
  - '- 私域单客LTV预估多少？需要多少私域用户支撑月入1万/5万/10万目标？'
  - '- 如果公域流量突然断流，私域存量能维持变现多久？应急方案是什么？'
- 'no': 5
  title: 长尾非标赛道机会评估与MVP验证
  contents:
  - 从以下长尾赛道中选择1个，或自主发现1个细分需求，完成最小可行性验证：
  - 赛道备选：二奢鉴定转卖/手机壳定制/写回忆录演讲稿/快手知识付费/陪诊服务/鉴渣避坑/相亲盲盒/宠物殡葬/老年助餐/定制旅行规划
  - 验证步骤：
  - 1. 需求验证：在目标平台搜索核心词，分析前20条内容的评论区高频提问(怎么做/多少钱/求推荐)与购买意向信号
  - 2. 竞品逆向：找3个同赛道头部账号，像素级拆解其选品/文案/引流/交付/变现全链路，记录关键动作与数据
  - 3. MVP搭建：8元成本(域名/服务器/工具)或0成本(现有账号/免费工具)在7天内跑通'流量-转化-交付'首单
  - 4. 复盘决策：首单利润/耗时/复购潜力/扩展性评分，决定是否All in、迭代优化、或止损切换
  - ''
  - 回答问题：
  - '- 你的MVP成本实际多少？耗时几天出首单？首单利润多少？'
  - '- 这个赛道的''水土不服/人群匹配度''风险在哪里？如何通过素材调整解决？'
  - '- 核心交付流程能否标准化为SOP？哪些环节必须人工？哪些可外包/AI替代？'
  - '- 如果这个赛道6个月后红海化，你的迁移能力体现在哪里？（方法论/人脉/工具/认知/资金）'
