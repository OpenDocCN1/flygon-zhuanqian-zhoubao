learning_targets:
- 理解生财小航海模式如何通过外部约束容器强制跑通0-1商业闭环
- 掌握利他思维作为商业协作底层操作系统的核心逻辑与实操准则
- 建立执行力优先论：认知在行动中迭代，而非空想中升级的认知重构
- 掌握个人IP复利策略：百年不改名、全域用同名、统一视觉锤与一致人设标签
- 理解公私域协同模型：公域蓄水池获客、私域提款机变现的底层通道与四大关键动作
- 掌握AI内容自动化流水线：从'会用工具'到'建流水线'的范式跃迁与三位一体架构
- 理解平民无货源电商模型：小红书/闲鱼/视频号三大平台差异化打法与供应链轻量化逻辑
- 掌握知识付费/写作变现高客单复利路径：个人IP信任背书+标准化交付产品+持续内容输出
- 理解海外Mediabuy/独立站B2B模式：品牌词近零成本定理、内容为王、账号资产与广告资产分离
- 掌握长尾非标赛道拆解：解决具体小问题即生意的威力与多项目组合反脆弱性
