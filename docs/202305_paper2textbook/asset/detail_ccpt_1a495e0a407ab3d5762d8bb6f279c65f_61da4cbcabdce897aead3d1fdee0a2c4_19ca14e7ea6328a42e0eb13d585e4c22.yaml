units:
- 'no': 1
  name: AI标题预生成法 —— 让标题做产品，AI当流水线工人
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人写作最大痛点是“不会起标题、写不出爆款、产出慢”，导致变现无门'
  - '- 传统“AI帮我写标题”效果差，AI生成的标题往往平庸无奇，点击率低'
  - '- 需要一种“标题决定内容、AI执行填充”的反向生产流程，把人类擅长的“审美判断”和AI擅长的“批量填充”分离'
  - '**核心定义**'
  - '- 先由人工筛选高点击率标题/爆款标题库，再将标题作为Prompt指令输入AI（GPT-4.0）批量生成全文'
  - '- 实现“标题决定内容、AI执行填充”的反向生产流程，大幅降低写作门槛并保证爆款率'
  - '**关键性质**'
  - '- 标题质量决定文章上限（点击率/推荐量），AI只负责在标题框架内填充合格内容'
  - '- 人工把控标题库质量 + AI执行标准化生产，是普通人实现“低门槛、高产出、稳收益”的唯一可行路径'
  - '- 配合双GPT-4.0账号并行，单人30分钟可完成8篇1200字文章的生产、润色与发布'
  - '**典型例子**'
  - '- 月林实操：利用双GPT-4.0账号并行，配合标题预生成法与模板化流程，单人30分钟产出8篇法律爆款文，日均流量主收益300元，稳定运行6个月+'
  - '- 单篇阅读量破10W+，验证了“标题即产品”的商业逻辑'
  - '**边界条件**'
  - '- 依赖GPT-4.0模型能力，低版本模型可能无法稳定产出高质量长文'
  - '- 赛道需具备“高单价、高标准化、专业门槛高”特征（如法律、医疗、财经），泛娱乐赛道模板化难度大、单价低'
  - '- 需人工具备基本的“网感”与“标题审美”，完全不懂选题的小白仍难跑通'
  - '- 个体户执照注册公众号存在推流受限风险，建议新手用个人身份证注册'
  sources:
  - paper: docs/202305/20230516_081.md
    role: origin
  excerpts:
  - 新鲜出炉的 10W+，用 AI 标题指令预生成的篇幅 99%法律爆款文章。
  - 怎么用标题在 AI 预生成文章：一口气能写 8 篇 1200 字的文章，眼睛还不疼，脊椎也不痛。
  - 文章目录：1、写作平台收益单价 2、公众号选择法律领域的原因 3、每日收益呈现 4、爆款方法 5、选材方向 6、怎么人工起吸引力大的标题 7、怎么用标题在
    AI 预生成文章 8、法律文章套路模板
  - 怎么人工起吸引力大的标题：爆款方法常看常新
  - 法律文章套路模板：【真实案情引入】→【核心法条精准引用】→【法院判决结果还原】→【律师实操避坑建议】
  - 去年 12 月我就开始公众号写作，今年 2 月接触到 AI 写作，现在手握两个 AI（4.0）账号...每日阅读推荐流量稳定，赚取 300 元不等
  - '小姚 : 我想问一下...听说用个体工商户营业执照注册的公众号不给推流入池'
  - '晓崎 : 请问，用个体户执照公众号，和个人主体公众号，推流效果差异多少呢？'
- 'no': 2
  name: 法律赛道黄金洼地 —— 专业门槛高、模板化强、单价高的三重奏
  points:
  - '**为什么需要这个概念？**'
  - '- AI写作变现赛道众多，但大多陷入“单价低、同质化重、难出爆款”的红海'
  - '- 新手缺乏专业背景，无法驾驭高客单价赛道，也缺乏模板化能力规模化生产'
  - '- 需要一个“AI擅长、门槛高、单价高、可标准化”的赛道作为切入最优解'
  - '**核心定义**'
  - '- 法律内容具备三重属性：专业门槛高（AI擅长检索法条）、标准化程度高（适合模板化）、商业价值高（流量主单价高、广告主客单价高）'
  - '- 完美契合当前大模型能力边界，是新手切入AI写作变现的最优解'
  - '**关键性质**'
  - '- 文章结构固化为四段式模板：真实案情引入 → 核心法条精准引用 → 法院判决结果还原 → 律师实操避坑建议'
  - '- AI生成内容只需填充模板槽位，即可保证专业度与阅读完读率'
  - '- 推荐流量稳定，日收益300元不等，单价远超泛娱乐/情感赛道'
  - '**典型例子**'
  - '- 月林账号：运营6个月，接触AI写作3个月后推荐流量稳定，日收益300元不等，拥有10W+爆款记录'
  - '- 法律赛道广告主多为律所、法务服务，客单价高，流量主分成单价高'
  - '**边界条件**'
  - '- 要求内容必须合规、专业，不能出现法律常识性错误，否则信任度崩塌'
  - '- 依赖平台推荐算法分发，若平台调整法律类内容权重，收益会波动'
  - '- 需持续跟踪热点案例、法条更新，选题库需定期维护'
  - '- 非法律专业人士需建立“法条检索SOP”与“案例来源验证SOP”，防止AI幻觉'
  sources:
  - paper: docs/202305/20230516_081.md
    role: origin
  excerpts:
  - 公众号选择法律领域的原因
  - 每日阅读推荐流量稳定，赚取 300 元不等
  - 法律文章套路模板：【真实案情引入】→【核心法条精准引用】→【法院判决结果还原】→【律师实操避坑建议】
  - 新鲜出炉的 10W+，用 AI 标题指令预生成的篇幅 99%法律爆款文章。
  - 现在手握两个 AI（4.0）账号，左右开弓
- 'no': 3
  name: 双账号矩阵并行操作 —— 左右开弓，产能翻倍
  points:
  - '**为什么需要这个概念？**'
  - '- 单账号受限于GPT-4.0的调用频次限制、上下文窗口、单线程生产速度'
  - '- 单人想日产8篇以上高质量长文，单账号物理时间不够用'
  - '- 需要并行化生产架构，突破单账号瓶颈，实现产能跃升'
  - '**核心定义**'
  - '- 同时运营两个GPT-4.0账号，配合两个公众号账号，实现“左右开弓”的并行化内容生产与分发'
  - '- 单人日产8篇爆款文的物理基础'
  - '**关键性质**'
  - '- 生产端并行：两个AI账号同时接收不同标题指令，并行生成全文'
  - '- 分发端并行：两个公众号账号交替/同时发布，覆盖不同时间段流量池'
  - '- 成本可控：GPT-4.0 API/Plus账号成本远低于雇佣兼职编辑，且质量稳定'
  - '**典型例子**'
  - '- 月林实操：手握两个AI（4.0）账号，左右开弓，30分钟完成8篇1200字文章生产发布，物理疲劳度极低'
  - '**边界条件**'
  - '- 需解决多账号登录隔离、IP隔离、支付方式隔离等工程问题'
  - '- 两个公众号需差异化定位或错峰发布，避免自相残杀'
  - '- 账号主体建议用个人身份证注册，规避个体户执照推流受限风险'
  - '- 随着GPT-4o/5.0等模型升级，单账号吞吐量提升后，双账号必要性可能下降'
  sources:
  - paper: docs/202305/20230516_081.md
    role: origin
  excerpts:
  - 现在手握两个 AI（4.0）账号，左右开弓
  - 一口气能写 8 篇 1200 字的文章，眼睛还不疼，脊椎也不痛。
  - 在 30 分钟里用标题写出 8 篇公众号法律爆款文章
