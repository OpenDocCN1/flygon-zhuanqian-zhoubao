units:
- 'no': 1
  name: 周报文献溯源与版权声明 —— 确立教材素材的权威来源与引用规范
  points:
  - '**为什么需要这个概念？**'
  - '- 教材编写必须明确素材来源，保障内容权威性与版权合规'
  - '- 读者需了解核心知识体系的发源地，以便深度溯源与验证'
  - '- 社群付费内容转化为公开教材时，必须界定授权边界与引用规则'
  - '**核心定义**'
  - '- 《龙哥赚钱周报》为生财有术社群核心付费内容产出，由龙哥主理，语雀文档托管'
  - '- 更新频率：周更（2023年5月10日~5月16日为本期范围）'
  - '- 版权归属：生财有术社群/龙哥所有，转载需授权，严禁商业盗用'
  - '**关键性质**'
  - '- 素材为一手实战复盘合集，非理论推演，具有极强时效性与落地性'
  - '- 内容覆盖认知、AI、小红书、闲鱼、视频号、投资等全谱系商业实战'
  - '- 采用中括号分类标签体系（如[认知]、[AI]、[小红书]）构建检索索引'
  - '**典型例子**'
  - '- 本教材全书所有章节素材均溯源自该周报期刊内的30+篇实战分享文档'
  - '- 章节大纲的nodes.src字段直接指向周报内具体文档ID（如20230516_003.md）'
  - '**边界条件**'
  - '- 周报原文为社群付费内容，教材引用遵循“合理使用”原则，仅作教学拆解'
  - '- 读者若需获取完整原文语雀链接，需加入生财有术社群获得授权访问'
  - '- 部分文档仅含标题/链接无正文（如000/001/051/readme），教材以有内容文档为主'
  sources:
  - paper: docs/202305/20230516_000.md
    role: origin
  - paper: docs/202305/20230516_001.md
    role: origin
  - paper: docs/202305/20230516_051.md
    role: origin
  - paper: docs/202305/README.md
    role: origin
  excerpts:
  - 文档标题：龙哥赚钱周报 20230510~20230516
  - 来源链接：www.yuque.com/for_lazy/thfiu8/fc3rzl7ia8ury6x3
  - 更新频率：周更
  - 版权归属：生财有术/龙哥
  - 分类标识：[认知]、[AI]、[小红书]、[闲鱼]、[视频号]、[投资]等
  - 互动数据：点赞数、精华帖数量、评论图片
  - 社群入口：生财有术邀请二维码、小航海训练营报名入口
- 'no': 2
  name: 内容分类标识体系与检索导航 —— 破解海量实战素材的“找药方”难题
  points:
  - '**为什么需要这个概念？**'
  - '- 单期周报包含30+篇万字长文，无分类标签则无法快速定位所需知识'
  - '- 教材编写需按专题重组素材，依赖标准化分类体系完成跨文档知识聚合'
  - '- 读者自主学习时，需通过标签体系构建个人知识地图与检索路径'
  - '**核心定义**'
  - '- 中括号分类标签体系：在文档标题前添加[认知]、[AI]、[小红书]等标签，标识核心赛道/方法论'
  - '- 双层索引机制：周报层面README.md提供期刊级目录，文档层面标签提供专题级检索'
  - '- 标签维度覆盖：平台（小红书/抖音/视频号）、模式（无货源/投流/IP）、能力（认知/AI/投资）三大维度'
  - '**关键性质**'
  - '- 标签互斥性弱：单篇文档常含多标签（如[小红书][无货源][引流]），反映实战复合性'
  - '- 标签粒度适中：非单一战术标签（如[封面设计]），而是战役级标签，利于教材章节规划'
  - '- 社群共识标准：标签体系经社群长期运营沉淀，具备圈内通用语义一致性'
  - '**典型例子**'
  - '- 教材第3章“商业模式进化论”聚合所有[快团团]、[私域分销]标签文档'
  - '- 第19章“Stable Diffusion实操入门”聚合[AI]、[SD]、[部署]标签文档'
  - '- 第27章“视频号短视频带货矩阵化”聚合[视频号]、[投流]、[矩阵]标签文档'
  - '**边界条件**'
  - '- 标签为人工打标，存在主观性与遗漏，教材编写需结合文档全文语义二次归类'
  - '- 早期周报标签体系可能不完善，202305期已相对成熟稳定'
  - '- 标签检索仅解决“找到文档”，不解决“理解内容”，后续仍需精读萃取'
  sources:
  - paper: docs/202305/20230516_001.md
    role: origin
  - paper: docs/202305/20230516_051.md
    role: origin
  - paper: docs/202305/README.md
    role: origin
  excerpts:
  - 分类标识示例：[认知]普通人逆袭的底层操作系统、[AI]ChatGPT+RPA协同自动化架构
  - README.md提供期刊级目录索引功能，按章节汇总文档标题与链接
  - 标签体系覆盖：平台赛道、商业模式、核心能力、工具技术四大维度
  - 检索路径：周报目录→分类标签→文档标题→语雀链接→原文全文
- 'no': 3
  name: 社群互动数据与生态入口 —— 从“旁观者”到“参与者”的跃迁通道
  points:
  - '**为什么需要这个概念？**'
  - '- 教材知识最终指向实战，社群是验证、迭代、放大知识的核心场域'
  - '- 互动数据是内容质量与社群活跃度的客观代理指标，辅助判断学习投入ROI'
  - '- 读者完成教材学习后，需明确接入核心社群、参与航海训练的具体路径'
  - '**核心定义**'
  - '- 互动指标体系：点赞数（认可度）、精华帖数量（沉淀质量）、评论图片（实战讨论深度）'
  - '- 生态入口双通道：1) 生财有术社群邀请（付费年费制，核心知识库与人脉网络） 2) 小航海训练营（项目制陪跑，强制0-1闭环）'
  - '- 社群定位：非单纯内容订阅，而是“高质量人脉+成熟SOP+实战陪跑”的商业基建设施'
  - '**关键性质**'
  - '- 互动数据真实性高：基于语雀文档原生评论/点赞系统，难以刷量造假'
  - '- 精华帖机制：由社群运营/大V人工筛选，代表社群认可的最高质量实战复盘'
  - '- 入口门槛设计：付费筛选非共识者，保证社群信任基础与协作效率'
  - '**典型例子**'
  - '- 本教材多个章节案例（如叁斤、漫漫、东哥）均源于社群成员航海实战复盘'
  - '- 第26章“社群杠杆与个人IP资产化”系统拆解社群机制对个人成长的杠杆作用'
  - '- 素材中反复出现“亦仁加精”、“梁靠谱认可”等社群权威背书标识'
  - '**边界条件**'
  - '- 社群年费较高（数千元级），非必需入场条件，教材已提炼核心方法论可独立学习'
  - '- 小航海需按期报名，有名额与时间窗口限制，非随时可入'
  - '- 社群内部信息具有时效性，教材固化的是跨周期验证的底层逻辑而非即时战术'
  sources:
  - paper: docs/202305/20230516_051.md
    role: origin
  excerpts:
  - 互动数据：点赞数、精华帖数量、评论图片
  - 社群邀请二维码：生财有术核心社群入口
  - 小航海训练营：新手0-1跨越的标准化训练场
  - 权威背书案例：亦仁（版主）加精、金九渊（大佬）认可、Cooper方法论认可
