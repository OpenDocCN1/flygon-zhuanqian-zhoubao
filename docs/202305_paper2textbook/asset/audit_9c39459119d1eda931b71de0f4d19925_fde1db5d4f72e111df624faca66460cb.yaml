unsupported_claims:
- location: '20.3'
  claim: 复制爆款法将成功率从<10%提升至>80%
  reason: 素材中未找到支撑该具体量化数据的实测样本量或统计口径说明
- location: '20.3'
  claim: 小红书查重惩罚系数ε≈0.05-0.15
  reason: 素材中仅定性描述'不怎么查重'，未提供定量测评数据支撑具体数值区间
- location: '20.4'
  claim: 主动打标3天内首页垂直内容占比达85%，基于n=12新号样本实测
  reason: 素材中未提及该实测样本量、具体操作细节及统计口径，属作者团队经验估算
- location: '20.6'
  claim: SEO转化率15-30%，推荐流量转化率1-3%
  reason: 素材中仅定性描述'零互动笔记日均私信20+'等案例，未提供大样本漏斗转化率统计数据
- location: '20.6'
  claim: SEO留存周期180-365天，推荐流量留存1-7天
  reason: 素材中仅案例佐证'老刘长期稳定获客'，未提供系统性排名衰减曲线数据
- location: '20.10'
  claim: 表情包发送拦截率R≈0.15，基于连续30天/5小号/日发20条实测
  reason: 素材中仅定性描述'目前还没收到违规提醒'，未披露该实测样本量及统计口径
- location: '20.10'
  claim: 小号隔离系数=0.20
  reason: 素材中未提供账号分层风控量化建模依据，属经验拍估值
- location: '20.13'
  claim: 单人管控上限20号为质量拐点
  reason: 素材中标注'基于作者团队管理15个兼职账号实测临界点'，但未提供质量指标定义、漏报率统计及对照组数据
- location: '20.14'
  claim: 企业号显著提升抗风险能力
  reason: 素材中仅作者团队主观实测'申诉通过率显著更高'，缺乏平台白皮书、第三方测评或A/B测试定量对比数据
- location: '20.15'
  claim: 职称赛道地域护城河使非竞争性加盟成为可能
  reason: 素材中仅作者主观判断'广东公司只做省内'等定性论述，未提供跨区域获客成本对比、同城竞争强度等量化验证数据
