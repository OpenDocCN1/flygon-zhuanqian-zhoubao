life_analogy:
- 想象视频号挂车投流是一场**精密的‘自动售货机生意’**：
- '- **选品** = 选进货渠道、毛利>70%、自带流量的‘爆款零食’（高客单高利润）'
- '- **素材** = 贴在售货机上的‘高点击海报’（素材搬运去重SOP）'
- '- **1测** = 先摆1台机器投1000元测7天，卖不出去立马撤（验品止损）'
- '- **2测** = 能卖出去再加机器、调货道、测最佳补货价格（探价锁定参数）'
- '- **赔付机制** = 场地方承诺：‘机器摆满月没卖出，房租退一半’（平台兜底空消耗）'
- '- **关停公式** = 自己定规矩：‘单机日亏超利润1/3，立马撤机’（自律止损）'
- '- **矩阵组织** = 雇3个伙计每人管5台机，专人负责调价、看数据（3组1投手）'
- 就像连锁便利店用标准化SOP复制盈利模型，投流也要用‘品素决定论’和‘数据信仰’把赚钱变成工程。
summary:
- concept: 短视频挂车投流
  desc: 视频号带货最稳定模式：付费买量+算ROI+优化素材，具备稳定、可复制、可放大、不废号四大优势
- concept: 品素决定论(70/30)
  desc: 选品与素材决定70%+成败，投放技巧仅占30%，90%问题根因指向品与素材
- concept: 高客单选品标准
  desc: 利润率>70%、新奇特高溢价、排除黑五类功效品，SKU套装化(多件装+高低价排序)提升客单
- concept: 双阶段测品法
  desc: 1测(1000豆/6h)验品仅看能否出单；2测(2000豆/阶梯出价)探价锁定最优流速出价
- concept: 视频号赔付机制
  desc: 达标(6赞/6关注/6单→4单)后空消耗平台返还，高客单大额放量‘不太会亏钱’的安全气囊
- concept: 关停止损公式
  desc: 利润>100元按利润1/4-5元止损，<100元按利润1/3-5元止损，用关停空消耗提高整体ROI
- concept: 投放黄金时间窗
  desc: 测品上午9点前，放量晚12点建12h计划或凌晨4点建计划，匹配中老年用户活跃规律
- concept: 异常诊断决策树
  desc: 不过审查品/素材/营销；不消耗查重合度/竞争力/时段/出价/SKU；转化异常四象限对症换素材/降价/涨价
- concept: 矩阵化组织架构
  desc: 3-6人小组+人均5机15号+专职投手(3:1)，核心KPI=日测品数，头部日测70-100品
- concept: 物理隔离与执行力
  desc: 一机一号一网络规避关联，红米Note11T标配+贴纸标记+台账管理，长期主义执行力是核心护城河
exercises:
- 'no': 1
  title: 实战推演：新品测品全流程决策
  contents:
  - 场景：你选定一款利润率75%、客单价120元的家居新奇特产品，准备了3条不同风格的去重素材（好物分享/场景测评/痛点科普）。请设计完整的1测→2测→放量执行方案：
  - 1. 1测阶段：预算分配、出价设定、定向选择、判定通过/淘汰标准
  - 2. 1测跑出：素材A出单3单ROI1.5，素材B出单0单，素材C出单1单ROI0.8。如何决策？
  - 3. 2测阶段：针对通过素材如何搭建计划组（数量/出价阶梯/预算）？核心验证指标是什么？
  - 4. 2测结果：最优出价800时日消耗2000、ROI1.9，出价750时日消耗500、ROI2.2。放量期选哪个出价？为什么？
  - 5. 放量期：该品利润120元>100元，采用赔付策略还是关停策略？关停阈值如何计算？
- 'no': 2
  title: 异常诊断实战：计划不消耗/转化异常排查
  contents:
  - 某高客单产品（利润150元）进入放量期，搭建大额计划(出价800/日预算5000)，运行4小时后出现以下异常，请按决策树逐步排查并给出处理动作：
  - 异常1：计划显示‘审核通过’但消耗为0，展现量<100。
  - 异常2：消耗正常(已花2000)，但0单，点击率0.8%（行业均值1.5%），转化率0%。
  - 异常3：消耗3000，出单5单，但ROI仅1.1(目标1.8)，点击率2.0%，转化率1.2%。
  - 要求：对每个异常列出排查优先级(1/2/3...)、核心定性判断、具体执行动作(换素材/换品/改出价/加SKU/关停等)。
- 'no': 3
  title: 团队组建与规模化测算
  contents:
  - 你打算组建一个视频号投流团队，目标日测品数50个，单品需测3条素材(1测) + 5条计划(2测)。
  - 1. 按‘3-6人一组，人均5台手机15号，3组配1投手’标准，需要招聘多少执行人员、投手？需采购多少手机？预估硬件成本(红米Note 11T 1700元/台)？
  - 2. 若单人日均操作上限为‘发20条视频+上架5链接+催发货20单’，执行组人数是否合理？瓶颈在哪？
  - 3. 供应链端：爆发期要求48h发货，单日爆单200单时，客服催单频次、备选供应商数量、熔断触发条件如何设定？
  - 4. 账号管理：20+账号矩阵下，如何设计‘账号编号体系+物理标记+数字化台账’防止混乱？
