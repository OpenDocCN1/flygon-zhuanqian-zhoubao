life_analogy:
- 想象**生财小航海**是一个**'强制减重训练营'**：
- '- **导师** = 私教（给菜单、监督动作、纠正姿势）'
- '- **截止节点** = 称重日（必须交出结果，无法拖延）'
- '- **同伴监督** = 战友群（早起打卡、互相监督不偷吃）'
- '- **公开承诺** = 朋友圈宣言（违约丢面子，倒逼执行）'
- '- **标准化SOP** = 科学食谱+训练计划（照着做就能瘦，无需自己研发）'
- 就像减重不靠'懂理论'靠'强制执行'，商业0-1跨越也不靠'学课程'靠'跑通闭环'。
- ''
- 想象**个人IP**是一棵**'复利树'**：
- '- **统一ID/头像/简介** = 树种基因（决定上限与品种）'
- '- **持续产出内容** = 浇水施肥（前期无果、中期结果、后期丰收）'
- '- **百年不改名** = 不挖树换地（频繁改名=反复移栽，永无大树）'
- '- **私域沉淀** = 根系网络（看不见但决定抗风/吸水/结果能力）'
- '- **高客单产品** = 果实（有根有干，果实年年有、越来越甜）'
- 就像种树最好的时间是十年前，其次是现在，个人IP复利同样拒绝'频繁改名'这种'挖树换地'的自毁行为。
- ''
- 想象**公私域协同**是**'水库与水龙头'关系**：
- '- **公域平台** = 水库（水量大但不受控、蒸发快、归国家/平台管）'
- '- **引流钩子** = 取水管（资料/诱饵/活动，管径决定流量）'
- '- **私域微信/社群** = 蓄水池（水归自己、可长期储存、可反复取水）'
- '- **朋友圈/话术/产品** = 水龙头（开关控制、过滤杂质、决定出水质量与价格）'
- 就像农田灌溉不靠'盯着水库发呆'，靠'铺好管道、建好蓄水池、装好水龙头'，生意同理。
- ''
- 想象**AI自动化流水线**是**'中央厨房+外卖小哥'模式**：
- '- **业务拆解SOP** = 标准菜谱（把大厨经验拆解为流水线工序）'
- '- **Prompt工程** = 预制菜包（核心调料包，决定口味上限与标准度）'
- '- **RPA/自动化工具** = 外卖小哥+自动炒菜机（7x24小时不累、不抖、按单生产）'
- '- **人工** = 研发新菜/质检/处理异常单（高价值决策，非重复劳动）'
- 就像餐饮连锁化不靠'请更多大厨'，靠'标准菜谱+预制包+中央厨房+物流配送'，内容生产同理。
summary:
- concept: 生财小航海
  desc: 新手0-1跨越执行鸿沟的强制容器：截止节点+公开承诺+同伴监督+导师点评，产出标准化SOP与MVP验证
- concept: 个人IP复利策略
  desc: 百年不改名、全域同名构建品牌资产飞轮，统一视觉锤降低认知成本，私域沉淀为高客单转化杠杆
- concept: 公私域协同模型
  desc: 公域蓄水池(算法/SEO筛选精准用户)→私域提款机(朋友圈/社群深度信任高客单转化)，钩子-承接-转化四大标准化动作
- concept: 资料整理引流法
  desc: 垂直资料作零边际成本钩子，日均引私域180+，配合头条自动回复/双号风控基建实现规模化
- concept: AI自动化流水线
  desc: 核心公式=业务SOP+Prompt工程+RPA串联，ChatGPT+RPA 13步文案/SD云端零成本/短剧CPS批量化跑通商业化
- concept: 平民无货源电商
  desc: 供应链轻量化(一件代发)+矩阵霸屏(7-400+店)+设备隔离(一机一号一IP)，选品定上限/运营定下限
- concept: 视频号投流带货
  desc: 品素决定论(70/30)+分级测品(1测验品/2测探价)+止损公式+黄金时间窗+3组:1投手组织架构，ROI正向闭环稳定复现
- concept: 知识付费变现
  desc: 个人IP信任背书+标准化交付产品(SOP/模板/社群)+持续内容输出三要素，变现分层+暴力交付筛选+动态定位+组织进化三阶段
- concept: 海外高汇率杠杆
  desc: Mediabuy品牌词套利(CPC≈0.01/ROI 359-496%)+B2B独立站冷启动(内容SEO/留钩子)+超轻量化私域(减法启动/资产隔离/SPIN话术)
- concept: 资料整理商业模型
  desc: 引流载体(资料)与变现主体(产品)分离，分层漏斗(资料筛选→咨询建信→高客单转化)，付费即筛选/信任源于交换/能力建设循环
- concept: 生财通用方法论
  desc: 像素级拆解/逆向工程→像素级模仿(1:1复刻)→人群匹配度调整→废号资产化→流量密码迁移→方法论资产>单项目收益，低成本验证优于完美策划
- concept: 执行力优先定理
  desc: 认知突破源于行动反馈而非空想，解决真正问题，赚钱的事多做十遍，承认无能是成长起点
- concept: 利他思维
  desc: 商业协作底层逻辑：优先为用户/伙伴创造价值，高客单/高复购/高信任业务的基石
- concept: 平台风控窗口期
  desc: 红利期有窗口不可对抗只能利用，快进快出榨取价值而非硬刚平台(蓝V/保证金/开店)
exercises:
- 'no': 1
  title: 设计你的'最小可行性航海项目'
  contents:
  - 根据'小航海项目筛选六大标准'(快现金流/无囤货/可SOP/借力AI/有获客路径/高后端)，从你当前认知范围内挑选3个候选副业项目。
  - 为每个项目填写：预计启动成本、预计首单周期、核心SOP步骤数、公域获客渠道、后端高客单产品设想。
  - 回答问题：
  - '- 哪个项目最符合''低成本验证优于完美策划''原则？为什么？'
  - '- 如果只保留一个项目跑21天航海，你会选哪个？你的''公开承诺''内容是什么？'
  - '- 该项目的''像素级模仿''对标账号是谁？你要1:1复刻的三个核心动作是什么？'
- 'no': 2
  title: 搭建个人IP'品牌资产飞轮'蓝图
  contents:
  - 确定你的统一ID/头像/简介/视觉锤(配色/字体/排版模板)，并检查是否在小红书/抖音/视频号/公众号/微信全域一致。
  - 规划前30天内容日历：每天1条垂直内容(解决目标用户1个具体问题)，标注选题来源(评论区/私信/同行爆款/个人经历)。
  - 设计'引流钩子'(资料包/工具/清单/模板)与'后端产品阶梯'(低价资料→低价咨询/训练营→高客单体系课/服务)。
  - 回答问题：
  - '- 你的''不出镜IP''选择哪种形态(资料号/工具号/笔记号/虚拟形象)？核心差异化人设标签是什么？'
  - '- 如何用''暴露弱点/人性共通痛点''建立真实信任感(参考漫漫''功利/自卑/焦虑''暴露策略)？'
  - '- 前期''叫好不叫座''孤独期如何熬？设定何种''过程指标''(如日更/完成度/素材库积累)而非''结果指标''来正向激励？'
- 'no': 3
  title: 跑通一条'AI自动化内容生产线'最小闭环
  contents:
  - 选定一个你熟悉的内容赛道(如：行业资讯摘要/工具测评/书单摘录/英语学习/避坑指南)。
  - 拆解该赛道内容生产全流程为5-8个标准化节点(如：选题→大纲→钩子→正文→标题→标签→配图→发布)。
  - 为每个节点编写一个结构化Prompt(含角色/任务/输入格式/输出格式/约束条件/少样本示例)，并在ChatGPT中测试稳定输出。
  - 用Excel/Cortex/Coze/影刀RPA任选一工具，串联至少3个节点实现半自动化(如：Excel批量生成Prompt→复制到ChatGPT→人工复制结果→RPA定时发布)。
  - 回答问题：
  - '- 哪个节点目前AI输出质量最不稳定？如何通过''少样本示例''或''约束条件''固化？'
  - '- 手动跑通全流程需多少分钟？半自动化后预计缩短至多少？单人日产上限几条？'
  - '- 该流水线迁移到另一平台(如小红书→公众号/视频号)需修改哪些节点？核心Prompt复用率多少？'
- 'no': 4
  title: 推演一个'视频号短视频带货投流'测品计划
  contents:
  - 在视频号选品广场/巨量百应榜单/蝉妈妈/同行爆品中筛选3个符合'高客单>70%利润/新奇特/非黑五类'标准的商品。
  - 为每个商品寻找1-2条对标爆款视频(抖音/快手/视频号)，拆解其前3秒钩子/中间节奏/结尾CTA/混剪去重手法。
