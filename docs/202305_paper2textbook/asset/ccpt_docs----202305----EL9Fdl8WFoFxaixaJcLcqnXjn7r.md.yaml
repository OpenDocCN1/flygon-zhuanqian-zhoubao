paper: docs/202305/EL9Fdl8WFoFxaixaJcLcqnXjn7r.md
desc: 该素材系统梳理了短剧CPS（Cost Per Sale）推广项目的全流程操作指南，涵盖授权开通、素材获取、剪辑去重、多平台发布挂载及账号运营等核心环节。核心贡献在于提出了“虐-反转”剧情剪辑循环公式、ChatGPT辅助批量生产解说文案的标准化SOP（提取-改写-配音-剪辑）、全解说/半解说三种形式的差异化去重策略，以及基于“多发+上热门检测+评论维护”的账号冷启动与爆款复制方法论，旨在解决新手从0到1跑通流程并规模化放大的实操难题。
concepts:
- name: 短剧CPS
  desc: 短剧推广分销模式，推广者通过剪辑短剧精华片段发布至抖音/快手/视频号等平台并挂载小程序链接，用户付费充值观看全集后，推广者按比例获得分成收益。
  is_original: false
  excerpt:
  - 短剧CPS就是我们帮平台推广短剧，用户充了会员，我们就有相应的分成。
  - 不是发了视频就有收益，是一定要转化充值。
- name: 虐-反转循环剪辑公式
  desc: 核心剧情剪辑逻辑：以‘虐’（冲突/压抑）为起点，‘反转’（爽点/解压）为终点，构建情绪起伏循环（一虐一反转算一个循环），重复3-6次后在反转前戛然而止引导转化，删除非必要过渡剧情。
  is_original: true
  excerpt:
  - 剧情安排的主流思路：一虐一反转算一个循环，刺激观众情绪的起伏，最后在反转前停住，引导看后续。
  - 我们在剪辑时，就是不断重复循环【虐-反转】。
  - 那些非必要的过渡剧情，全部不要。如何判断非必要？删除这些剧情后，仍然看得懂...
- name: 解说类短剧三分类
  desc: 按解说与原声占比划分的三种制作形态：混剪（纯画面+音乐）、全解说（全程AI/真人配音解说，画面仅需场景对应）、半解说（解说与原声穿插，含‘解说-原声交替’与‘开头解说+后段原声’两种模式）。
  is_original: true
  excerpt:
  - 从形式来划分，短剧视频主要分为三大类：混剪、解说、半解说
  - 全解说...只要场景大致一致...不需要台词的一一对应
  - 半解说又分为两种。一种是解说-原声-解说-原声...另一种是开头解说1-2分钟——原声到底。
- name: ChatGPT解说文案生产SOP
  desc: 利用ChatGPT实现解说文案批量化、低门槛生产的标准化流程：提取字幕 -> ChatGPT改写（同义替换/改名/改数字/调序） -> 规避违规拦截（分段投喂/手动修改）
    -> AI配音 -> 剪映合成。
  is_original: true
  excerpt:
  - 第一步：用剪映或者轻抖等小程序提取文案。
  - 第二步：修改文案...复制字幕发送给chatgpt，等待回复。
  - 此时有两种解决方法：1、手动修改 2、分段投喂，违规那一段就手动修改。
  - 改名字称呼...改数字...改成语...同义句替换。
- name: 去重组合拳策略
  desc: 基于抽帧对比原理的多维度去重手段组合，核心原则为‘不影响观感’前提下组合使用4种以上手段：画面裁剪/镜像/扫光/加标题/重字幕/调顺序/插叙/混剪素材源，解说类自带去重属性。
  is_original: true
  excerpt:
  - 去重的关键就是让画面变得和别人不同，让系统检测不出来。
  - 去重主要围绕着改画面去做，主要会用到：1. 切割画面... 2. 镜像... 6. 加扫光
  - 一般建议是用4种，但同样是用4种去重方法，有的人就能过原创，有的人就过不了。
  - 如果是做解说类，不需要太多去重。本身解说就已经是很好的去重了。
- name: 账号冷启动与标签养成机制
  desc: 抖音判定‘新号’标准为无领域标签/低粉而非注册时间；冷启动核心动作为高频发布（日更2-4条）配合‘上热门检测’（多时段点击检测原创度）与评论区运营（全回复+置顶引导），以量博爆款概率并修正人群模型。
  is_original: true
  excerpt:
  - 注册很久，没发过视频的号算新号。注册很久，发过几百条视频但只有几百几千粉丝的号也算新号。因为没打上标签。
  - 上热门检测这一步很重要...过半小时，过两小时，过一天，都要点一点【上热门】
  - 播放量太低怎么办？...就是多发，一天发2-4条，坚持一周以上。
methods:
- name: __overview__
  desc: 短剧CPS项目全链路标准化操作方法论：授权开通（九州/九天等） -> 选剧策略（爆款复刻/新剧抢跑/男女频垂直） -> 剪辑制作（虐反转公式+去重组合拳）
    -> 解说升级（ChatGPT改写+AI配音+三分类形态） -> 多平台分发挂载（抖音/快手/视频号教程） -> 账号运营（高频发布+上热门检测+评论维护）
    -> 规模化复制（多号矩阵/带学员/自动化探索）。
  excerpt:
  - 整个项目的流程就是：[流程图]
  - 咱们生财的原则是，跑通一个项目流程，立马复制规模化放大，干就完了。
  - 难点在第二步。
- name: ChatGPT文案改写防违规技巧
  desc: 针对ChatGPT因敏感内容拒答的应对方案：1. 分段投喂法（将违规片段隔离手动修改，合规片段AI处理）；2. 同义重写规则库（人称替换：美女->女总裁、战神->兵王；数值放大：5块->500万；成语/句式变形）；3.
    人工兜底修改。
  excerpt:
  - ChatGPT不是所有文案都会帮你修改...会拒绝你。
  - 此时有两种解决方法：1、手动修改 2、分段投喂，违规那一段就手动修改。
  - 改名字称呼...改数字...改成语...同义句替换。
- name: 全解说批量化剪辑模板法
  desc: 全解说模式下的规模化生产技术路线：将单条视频按场景切分为A1-A4片段 -> 打乱重组/镜像/时轴微调/替换同场景素材 -> 套用字幕/裁剪/背景填充预设模板
    -> 一键生成多条差异化原创视频，核心优势为‘解说文案固定，画面素材可组合’。
  excerpt:
  - 一条视频剪出来后，我只需要换画面，就能生成一条新视频。
  - 把A场景切分为A1、A2、A3、A4，然后打乱顺序，随机组合...
  - 或者替换相同的场景...将A场景分段后，对A2、A4做镜像处理。
  - 换字幕字体、颜色、每个视频上下切边的宽度改变。这些可以做成模板...下次直接导入预设即可。
- name: 剪映字幕替换遮盖法
  desc: 剪辑实操技巧：生成新字幕时，采用‘白底黑字’样式直接覆盖原字幕区域，省去‘模糊蒙版’复杂操作步骤；若追求质感则用‘复合片段+模糊特效+蒙版’标准流程。注意修改二创时需先‘解除复合片段’避免工作量倍增。
  excerpt:
  - 字幕用白底黑字，直接把原字幕遮住，可以不用再做模糊特效，减少操作时间。
  - 制作模糊字幕效果时，先全选片段，然后新建复合片段...再复制一层，利用模糊特效+蒙版盖掉原字幕。
  - 特别注意！在改第二条、第三条视频时，要先解除复合片段...否则，工作量增加一倍。
theorems:
- name: 短剧CPS成功三要素定律
  desc: 短剧CPS项目成败取决于三个核心杠杆：选剧（决定上限/素材质量）、剪辑（决定爆款率/完播率）、账号（决定承接转化/权重），缺一不可，其中剪辑是难点也是核心壁垒。
  excerpt:
  - 短剧CPS的核心三要素：[图示：选剧、剪辑、账号]
  - 这个项目能不能赚到钱，一是取决于你的视频能否成为爆款，二是取决于转化高不高。能否成为爆款，关键是多发。
  - 流程很简单，难点在第二步。
- name: 爆款复刻优于原创创新论
  desc: 短视频领域‘火过的内容还会再火’是铁律；新手起步阶段必须模仿爆款（剪同款剧、同开头结尾、同节奏），而非自主原创，因为个人审美不代表大众喜好，头部大号亦在互相模仿。
  excerpt:
  - 火过的内容还会再火，这是做短视频的原则，任何时候，任何领域都适用。
  - 起步阶段别原创...自己的理解并不是代表大众喜欢。几十万粉丝的大号，都是在互相模仿文案，抄剧情。
  - 优先选低粉爆赞作品。
- name: 解说模式构建竞争壁垒论
  desc: 随着混剪大军入场，纯混剪红利消退，必须引入‘解说’建立护城河：解说能显著提升转化率（情绪调动）、增强去重通过率（音画分离重组）、提高制作门槛（文案+配音壁垒），是长期主义必经之路。
  excerpt:
  - 去抖音搜索时，我们会看到头部账号、爆款视频，大多都是加了解说的。所以想要长期做短剧推广，必须加解说。
  - 做解说至少有3点好处：1. 提高转化率。2. 竞争小...建立壁垒。3. 去重效果好。
- name: 合规红线与平台博弈论
  desc: 短剧内容天然带有‘毁三观/低俗/暴力’属性（90%存在此类情节），平台审核呈现‘双重标准’（头部账号容忍度高、星图任务审核严、小号零容忍）；长期生存策略为：剪辑规避敏感镜头/台词、解说模式稀释原声风险、以星图标准自我约束、趁早入场（预判监管收紧导致佣金下调/平台倒闭）。
  excerpt:
  - 短剧90%都有低俗、三观不正的情节。
  - 正常传视频挂小程序可能通过检测的视频，如果上星图，就可能审核不通过。星图要严格一样，所以最好平常发视频的标准都按星图的严格要求。
  - 目前好转化的剧，99%价值观非常不正确...早晚得被监管，那时会有一堆平台做不下去。平台做起来了，推广的佣金也会给得低。
findings:
- name: 单月实操收益验证
  desc: '[evidence] 作者实操一个月左右，通过批量运营5个账号（后因精力集中带学员减少更新），实现约1.4万元收益，验证了流程跑通可行性。'
  excerpt:
  - 一个月左右的时间，产出1.4w左右收益。
  - 批量开了五个号，结果一天更3个号对我来说就已经很痛苦了，所以后来就减少了，目前主要是带学员做。
- name: 老号冷启动优于新号实测
  desc: '[evidence] 同素材视频对比测试中，未打标签的老号（注册久但无内容/低粉）爆款效果优于新注册号，且能带动旧作播放量增长，印证‘标签权重>注册时间’判定逻辑。'
  excerpt:
  - 我用新号和老号都做了，结果同样的视频，老号爆的效果更好，还提升老视频的播放量。
  - 抖音官方的说法，只要粉丝基数少，没有打上标签的，不管你什么时候注册的...都算新号。
- name: 上热门检测对抗限流机制
  desc: '[evidence] 实操发现抖音原创检测非仅发布瞬间触发，播放量上涨过程中会持续抽查；定时多点击‘上热门’按钮主动触发检测，可及早发现限流并补救，是新手避免‘莫名其妙不涨粉’的关键动作。'
  excerpt:
  - 这个动作要做多次...过半小时，过两小时，过一天，都要点一点【上热门】，因为抖音的原创检测不是只在发视频时才做，只要播放量往上涨，随时都可能被检测出来原创度低，然后播放量就不涨了。
- name: 去重实操‘对比法’教学有效性
  desc: '[evidence] 作者建议新手下载两条肉眼相似视频导入剪映双轨道同步播放，通过观察轨道空白处差异（剪辑点/特效/裁剪）反推去重手法组合；实测‘做过一两次对比，就知道如何组合运用’，降低去重技能习得门槛。'
  excerpt:
  - 我建议大家都去找看起来相同的视频，去对比二者的差异之处！！！
  - 下载两条肉眼难看几乎一模一样的视频。放到剪映里，两个画面同时播放，然后对比找细节。
  - 不用做太多，做过一两次对比，你就知道如何组合运用去重手段。
- name: 新剧赛道为短剧CPS蓝海细分
  desc: '[claim] 作者主张‘做新剧就是做短剧CPS的蓝海领域’，理由为新剧缺乏参考视频需自主剪辑逻辑、竞争者少、可抢占首发流量红利，但剧集质量不稳定。'
  excerpt:
  - 如果说做短剧CPS是做短视频的蓝海领域，那么做新剧就是做短剧CPS的蓝海领域。
  - 新剧没什么可参考的视频，需要自己按自己的逻辑来剪...剧的质量也不稳定，但主要是抢先机。
- name: 持续高频发布对抗流量衰减
  desc: '[evidence] 针对‘爆款后播放量断崖式下跌’现象（系统未建立稳定人群模型），实测‘日更2-4条，坚持一周以上’可强行修正标签、重获推流，验证‘执行力/量级’是短视频项目核心变量。'
  excerpt:
  - 如果突然只有100-200的播放，那多半是账号没标签，推流不精准，找不到人群。
  - 怎么办呢？就是多发，一天发2-4条，坚持一周以上。
  - 做短视频项目，一定要有心理准备。不可能天天high。关键是执行力，靠量来搏上热门概率。
