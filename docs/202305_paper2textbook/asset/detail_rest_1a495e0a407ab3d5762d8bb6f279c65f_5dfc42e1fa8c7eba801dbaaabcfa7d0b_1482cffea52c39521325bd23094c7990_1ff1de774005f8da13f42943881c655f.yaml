learning_targets:
- 理解视频号银发女性用户画像对选品与素材的决定性影响
- 掌握身份证矩阵合规模型与物理隔离硬件方案的落地标准
- 熟练运用测品-爆款-放大三阶段数据驱动决策法跑通商业闭环
- 能设计爆款定制链接与SKU阶梯定价策略提升客单价
- 建立短视频引流+直播承接的分层转化模型与橱窗动态运营策略
- 识别店铺体验分风控红线与供应链熔断机制，规避隐形下架与发货坑
- 将带货全流程固化为五大标准动作SOP，实现流程化标准化复利
- 利用航海外部约束机制克服执行力波动，跑通0-1周期
concept_map:
- 视频号带货矩阵化实操
- ├── 用户画像与选品锚点
- │   └── 银发女性高客单决策（女性≥85%、50岁+≥80%）  —— P001
- ├── 账号矩阵合规基建
- │   ├── 身份证账号矩阵合规模型（一证五号/主子号/物理隔离）  —— P002
- │   └── 多账号物理隔离硬件方案（红米Note 11T/双开/台账管理）  —— P003
- ├── 核心运营决策闭环
- │   └── 测品-爆款-放大三阶段数据驱动决策法（小时/天/周级决策）  —— P004
- ├── 爆款放大战术组合
- │   ├── 爆款定制链接与SKU阶梯定价策略（专属链接/锚定/简化决策）  —— P005
- │   ├── 短视频引流+直播承接转化模型（分层/置顶权重/橱窗长尾）  —— P006
- │   └── 橱窗动态排序与长尾搭配运营法（顶部爆款+高客单高佣长尾）  —— P006
- ├── 风控红线与供应链生存律
- │   ├── 店铺体验分风控红线（4.2分准入/偏远不发货/物流分保护）  —— P007
- │   └── 供应链响应速度决定变现上限（熔断机制/多店备选/实发率监控）  —— P008
- └── 组织能力与执行力固化
- ├── 流程化标准化五大动作SOP（发视频/上架/看数据/管店铺/催发货）  —— P009
- └── 航海机制外部约束与正向激励（手册/教练/同伴/截止日期）  —— P010
life_analogy:
- 想象视频号带货矩阵是一场**精密的‘特种部队作战’**：
- '- **用户画像** = 情报侦察：搞清楚敌军（用户）是‘银发女性主力军’，就要打‘养生保暖家居’这仗，别拿‘潮牌美妆’去送死'
- '- **身份证矩阵** = 兵力编制：一证五号是编制上限，靠家庭成员身份证‘扩编’成20+小分队，物理隔离（一机一号）防‘连坐’'
- '- **测品-爆款-放大** = 侦察-歼灭-扩大战果：小分队撒出去‘测品’（侦察），发现主力（爆款）立即集中兵力‘放大’（歼灭），战果巩固靠‘供应链熔断’（后勤保障）'
- '- **定制链接/SKU阶梯** = 武器改装：标配枪（通用链接）不好用，要改‘专属狙击枪’（定制链接），配‘阶梯弹夹’（SKU阶梯价），一枪一个（客单价）'
- '- **短视频引流+直播承接** = 空地协同：短视频是‘空军轰炸’拉流量，直播是‘地面部队’啃硬骨头（转化），橱窗是‘补给线’承接溢出'
- '- **体验分红线/偏远不发货** = 红线纪律：店铺分<4.2分直接‘军法处置’（隐藏下架），偏远地区‘不派兵’（不发货）避免后勤拖垮主力'
- '- **五大标准动作SOP** = 操作条令：发视频、上架、看数据、管店铺、催发货——死记硬背、肌肉记忆，新兵（新人）拿来即用'
- '- **航海机制** = 军事训练营：有教官（教练）、有战友（圈友）、有截止日期（考核），把‘不想练’逼成‘练会了’，首单（首战告捷）建立信心'
summary:
- concept: 视频号用户画像
  desc: 女性占比≥85%、50岁以上占比≥80%，选品必须聚焦养生/保暖/家居等中老年刚需
- concept: 身份证账号矩阵合规模型
  desc: 基于一证五号规则，主号管子号、同绑一卡、家庭成员物理隔离，突破单人5号上限实现20+矩阵
- concept: 多账号物理隔离硬件方案
  desc: 红米Note 11T 8+128G标准化配置，安卓双开1机10号，编号台账管理，低成本高安全规避关联封禁
- concept: 测品-爆款-放大三阶段决策法
  desc: 测品半天看流量、爆款即刻催发货监控退款、放大多号同发定制链接短视频引流直播转化，快准狠数据闭环
- concept: 爆款定制链接与SKU阶梯定价
  desc: 向商家要专属链接控主图/SKU/价格，用‘1份29.9/2份49.9’阶梯价+3-5核心SKU消除决策瘫痪提客单
- concept: 短视频引流+直播承接模型
  desc: 短视频低成本获公域爆发、直播承接高意向深转化，置顶位左1>中>权重动态调序，橱窗顶部爆款+长尾承接溢出
- concept: 店铺体验分风控红线
  desc: 新店4.5分、<4分隐形下架、合作门槛≥4.2分，物流分最脆弱需预设偏远不发货区域物理隔离规避
- concept: 供应链熔断机制
  desc: 多店备选+即时催单+动态切换，实发率<80%即切，茶壶案例证明催发货优先级>发视频，单一供应链风险极高
- concept: 流程化标准化五大动作SOP
  desc: 发视频/上架/看数据/管店铺/催发货标准化、账号编号/硬件标配/文档化固化，将赚钱变工程问题而非赌博
- concept: 航海外部约束机制
  desc: 手册/教练/同伴/截止日期四大机制将模糊意愿转确定行动，仅完整跑完周期者触发爆发，中途退出归零
exercises:
- 'no': 1
  title: 实战推演：从0设计一个视频号带货矩阵启动方案
  contents:
  - 背景：你有一份兼职时间、1万元启动资金、家人支持可借用2个身份证，目标：3个月内跑通单账号月佣金破万。
  - 请完成以下推演：
  - 1. 基于银发女性画像，列出3个首测品类及选品渠道（参考爆单秘籍/榜单/反推）
  - 2. 设计账号矩阵架构：主号/子号分配、实名主体分配、手机设备采购清单（含预算）、编号体系规则
  - 3. 制定第一周测品SOP：每日发视频数/挂链接数/观测指标/止损标准（30条/无进展注销）
  - 4. 假设第3天某账号出单（茶壶类、客单价80元、佣金45%），写出阶段2（爆款期）的‘催发货/监控/定制链接’执行清单
  - 5. 列出该账号进入阶段3（放大期）的3个核心动作：多号同发策略、直播承接配置、橱窗长尾搭配规则
  - 思考题：
  - '- 若合作店铺体验分跌至4.1分，你的应急预案是什么？（涉及停推/换链/换店/申诉）'
  - '- 为什么‘催发货’优先级高于‘发视频’？结合茶壶案例实发率1/3、损失数千佣金分析'
  - '- 若平台升级风控要求人脸活体核验，身份证矩阵模型失效，你的Plan B是什么？'
- 'no': 2
  title: 复盘实战：手算一个爆款周期的关键指标与决策节点
  contents:
  - 案例：1月茶壶爆款——客单价80-200元、佣金45%、次日出30单、持续1.5月、单账号佣金6800元、但因供应链损失数千。
  - 请计算并判断：
  - 1. 单账号总GMV约多少？总佣金6800元对应佣金率45%，反推GMV。
  - 2. 若持续45天，日均单量约多少？日均佣金约多少？
  - 3. 供应链事故：实发率仅1/3，意味着多少订单未发货？按客单价140元估算，直接佣金损失约多少？
  - 4. 定制链接前后对比：未定制时SKU 10个、客单价100元；定制后5个SKU阶梯价、客单价提升至140元。转化率假设不变，客单价提升40%对月佣金影响几何？
  - 5. 体验分风控：若该店铺物流分因偏远发货从4.6跌至4.1，触发隐形下架，剩余20天爆款期流量归零，机会成本损失约多少？
  - 决策题：
  - '- 在第3天发现出单后，你会立即执行哪3个动作？（参考：电话催单/留言催单/申请定制链接/监控退款率/准备备选店铺）'
  - '- 什么信号触发你启动供应链熔断切换备选店？（实发率阈值/响应时效/体验分预警）'
- 'no': 3
  title: SOP设计：将‘短视频引流+直播承接’转化为可考核的标准作业程序
  contents:
  - 任务：为团队新人编写『爆款期短视频+直播联动SOP v1.0』，要求：可量化、可考核、可替换。
  - 请输出以下模块的标准动作：
  - 1. 短视频置顶管理：爆款视频置顶顺序规则（左1/中/右1权重）、调整频率、数据监控指标（播放/跳转/进直播间）、失效判定标准
  - 2. 直播间排品与话术：开场前30分钟预热品、主推爆款SKU阶梯价话术、长尾品承接顺序、下单引导关键动作（橱窗/链接/福袋）
  - 3. 橱窗动态运营：顶部2-3爆款固定位、长尾品筛选标准（高客单≥30/高佣≥30%/高销量>100单）、调整周期
  - 4. 数据复盘看板：短视频端（GPV/点击率/跳转率/ROI）、直播端（UV/停留/成交/客单/GPROI）、店铺端（体验分/实发率/退款率/DSR）
  - 5. 异常熔断机制：体验分<4.2立即停推、实发率<80%切店铺、直播违规预警、素材同质化查重阈值
  - 挑战题：
  - '- 如何用『正负反馈平衡律』指导直播间投流/留人操作？（如：降价必须配加时长/换品/加福袋）'
  - '- 新人执行该SOP首周，你设定的『及格线』核心指标是什么？（而非优秀线）'
