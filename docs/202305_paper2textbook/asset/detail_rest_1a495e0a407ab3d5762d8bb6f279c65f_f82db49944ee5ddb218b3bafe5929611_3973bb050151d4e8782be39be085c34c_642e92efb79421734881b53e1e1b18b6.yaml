life_analogy:
- 想象抖音养生号像**开一家‘不囤货、不装修、只挂别人招牌’的加盟便利店**：
- '- **选品** = 总部（巨量百应/对标账号）每天推送的‘今日必卖清单’'
- '- **素材** = 总部统一配发的‘标准海报/宣传视频’，你只需贴自家二维码'
- '- **对标销量记录** = 每天早晚巡店，记录隔壁同款店‘卖了多少件’，哪款动销快马上加货'
- '- **像素级模仿** = 连货架摆放角度、促销话术语速都按总部SOP『1:1复刻』'
- '- **矩阵置换** = 新开分店先用‘无人货柜’试卖3天，爆了再派人、铺货架、上大屏'
- 就像便利店加盟：总部（平台/头部玩家）已跑通『选品-陈列-促销』全链路，加盟商（新手）只需『照单全收、严守SOP、多开分店』即可复制利润模型。
summary:
- concept: 抖音养生号视频带货
  desc: 垂直赛道短视频挂车变现模式，无需直播/囤货，核心链路：对标选品→像素级模仿→矩阵测品→爆品放大
- concept: 对标账号橱窗销量记录法
  desc: 每日记录20-30个对标账号橱窗带货销量，用真实销量替代粉丝/点赞虚荣指标指导零延迟跟品
- concept: 巨量百应榜单选品
  desc: 千粉权限后筛选：爆款视频-图书教育-图书-作者等级0-近24小时，捕捉实时爆品信号
- concept: 三大带货形式像素级模仿
  desc: 混剪(音画一致+70%画中画)、实拍(逐镜头复刻)、图文经方(大师音频+经方图文)，相似度极致复现爆款概率
- concept: 无人直播测品-矩阵置换
  desc: 新号千粉上无人直播测3天/日发5条→不爆换号/转短视频→爆品验证后全矩阵跟品，以账号数量博起量概率
- concept: 品素决定论(70/30法则)
  desc: 品与素材贡献度超70%，投放技巧不超30%，90%疑难杂症根因指向品素，测品核心是验证品素组合
- concept: 执行力与隐性资本决定上限
  desc: 项目技术含量低，早睡早起/运动/读书等内功心法支撑身心状态是持续盈利真正护城河
- concept: 面相书籍跟品案例
  desc: 4月16日跟进对标1:1精细化拍摄当晚日佣破万，全矩阵连续日入过万，峰值日佣2万，验证SOP复现性
exercises:
- 'no': 1
  title: 建立你的对标账号监控表
  contents:
  - 任务：在抖音搜索‘养生/中医/食疗’关键词，筛选20个粉丝1-50万、近期有爆款视频、已开通橱窗的对标账号。
  - 1. 建立表格字段：账号名/主页链接/粉丝量/橱窗商品数/今日销量/近24h高赞视频链接/对应商品/备注。
  - 2. 连续记录3天每晚橱窗销量变化，标出销量增幅>30%的商品。
  - 3. 分析：这些爆品共性是什么？（价格带/品类/视频形式/钩子话术）
  - 思考题：为什么记录‘橱窗销量’比记录‘粉丝增长’更能指导选品？
- 'no': 2
  title: 像素级模仿一条爆款图文经方视频
  contents:
  - 任务：在对标账号中找一条点赞>1万的‘图文经方’视频（大师音频+方子图文）。
  - 1. 拆解：音频来源/文案结构/封面字体配色/字幕位置/背景音乐/BGM卡点时机/引导挂车话术。
  - 2. 复刻：用同音频/同文案结构/同封面风格/同剪辑节奏制作1条视频发布。
  - 3. 复盘：对比前3秒完播率、整体完播率、挂车点击率与原版差距在哪个环节？
  - 思考题：混剪存在原作者举报风险，长期如何向‘实拍/原创’过渡？关键动作是什么？
- 'no': 3
  title: 设计一个‘无人直播测品-矩阵置换’最小闭环实验
  contents:
  - 假设你有3个千粉养生号（A/B/C）和5个已验证爆款素材（素材1-5）。
  - 1. 制定3天测品计划：每号每天直播1场（2小时），轮播5个素材，记录每场：场观/停留/互动/成单/ROI。
  - 2. 制定置换规则：若某号某素材单场ROI>1.2，判定为‘爆品’，立即安排该号改发短视频挂车；其余2号短视频同步跟品该素材。
  - 3. 制定止损规则：连续3场直播ROI<0.5，该号废弃或换赛道。
  - 思考题：为什么‘新号直播权重期易起量’适合测品，但不适合长期运营？如何规避‘无人直播违规封号’风险？
