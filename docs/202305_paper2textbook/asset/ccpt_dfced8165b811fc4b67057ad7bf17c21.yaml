paper: docs/202305/ZXvbdq7RGoKEeLxryxAckCtSnPf.md
desc: 该素材为一份2023年4月线下分享会的纪要，主讲人沧海系统梳理了Stable Diffusion的应用场景（产品设计、AI模特、建筑设计、风格模型训练）及完整的LoRA模型训练工作流。核心贡献在于将模型训练拆解为“训练集准备（图片筛选/裁剪/打标/减标）、模型训练、测试复盘、参数反推”四大标准化步骤，并详细给出了WD14
  Tagger打标、Dataset Tag Editor批量减标、XYZ Grid测试评估等工具链的实操参数与避坑指南，且首创性提出“减标签将权重迁移至触发词”的训练机制解释及通过Metadata反推他人训练配方的方法。
concepts:
- name: 训练集质量双维度标准
  desc: 定义训练集质量由原图像素质量与标签精准度两个维度决定，是模型训练成败的基石。
  is_original: true
  excerpt:
  - 训练集的质量直接影响到后面的模型训练，训练集的质量在我看来包含两部分，一个原图的质量，另一个是对图片的精准总结（即打标签tag）
- name: 触发词
  desc: 在训练LoRA时人为添加的唯一标识符（如shengcai），用于推理阶段调用模型学到的特定概念（人物/风格），配合减标签机制实现一词出图。
  is_original: false
  excerpt:
  - 如果要训练lora模型，需要添加一个未来用于触发该lora模型的触发词，我这里在附加标签里添加了shegncai
- name: 标签权重迁移机制
  desc: 删除描述性标签（如发色、服装）后，其训练权重会自动聚合至序列前方的触发词上，使触发词隐含完整概念特征，从而简化推理提示词。
  is_original: true
  excerpt:
  - 减少标签并不会导致模型在学习的时候不学习小姐姐的个人特征，而是会把这些删除的特征的权重全部加到前面的词汇里。例如删除 short hair, brown hair...
    这些tag后，这些tag的训练权重会自动加到shengcai这个排在标签序列前面的这个词里
- name: 元数据反推
  desc: 利用Civitai等平台模型文件自带的Metadata（ss_network_dim, ss_learning_rate, ss_tag_frequency等），还原该模型的训练数据集规模、分辨率、超参数及底模信息。
  is_original: true
  excerpt:
  - 如果你在c站或者其他地方看到一个很喜欢的lora模型，你想知道怎么训练的... 现在都可以了，具体方法如下：打开lora模型，找到你喜欢的lora模型，点show
    metadata
- name: 训练复盘表
  desc: 结构化记录训练超参数、Epoch/权重下的生成效果（XYZ Grid）、主观评分及问题分析的表格工具，用于跨实验对比与经验沉淀。
  is_original: true
  excerpt:
  - 虽然开玩笑说训练模型是炼丹，但是我们还是得科学记录每词模型训练的变化... 目前我是使用以下方式记录的：a）生成xyz表... b）在本次生成的参数，以及xyz表肉眼查看评估结果一一填写进去
methods:
- name: __overview__
  desc: Stable Diffusion LoRA模型训练标准化五步工作流：训练集准备（图片筛选->裁剪->打标->减标）-> 模型训练 -> 模型测试复盘（XYZ
    Grid+评估表）-> 参数反推复现 -> 业务落地应用。
  excerpt:
  - 这里是我的模型训练的工作流，一共分为5步骤，接下来我会和大家介绍这里的细节
  - 一、训练集准备... 二、训练模型... 三、模型测试和复盘... 四、Lora模型仿训练参数
- name: 图片筛选与增强策略
  desc: 高分辨率原图获取 -> 多场景/多角度覆盖 -> 剔除瑕疵/多人/大差异图 -> 镜像翻转/裁剪扩充小样本（防过拟合）。
  excerpt:
  - a）图片分辨率高... b）图片样本丰富... c）筛掉不佳图片... tips：当图片不够时，可以尝试复制该图片使用镜像翻转提供更多的图片，同理也可以复制同一张图片进行裁剪，不过不建议放太多这种图片，容易训练过拟合
- name: 自动聚焦裁剪
  desc: 利用SD WebUI自带预处理功能，开启‘自动焦点裁切’，以检测到的主体（如人脸/人体）为中心裁剪至512x512，解决主体偏心导致丢失问题，兼顾显存与训练效率。
  excerpt:
  - 自动焦点裁切：这个意思是当图片比较大的时候，人物如果不在图片中心，开启这个时候会自动以人物为中心进行裁剪，不会把人物裁掉
- name: WD14 Tagger自动打标+人工校验
  desc: 部署stable-diffusion-webui-wd14-tagger插件，生成Danbooru风格的‘文字说明标签’（而非自然语言），精度更高、无乱码，人工核对后批量产出txt标注文件。
  excerpt:
  - 推荐打标工具：Waifu Diffusion 1.4 标签器stable-diffusion-webui-wd14-tagger... 感觉这个工具在生成文字说明标签时更精准，不会出现乱码的标签
- name: Dataset Tag Editor批量减标
  desc: 加载数据集 -> Batch Edit Captions -> Remove -> Frequency Descending排序 -> 勾选高频描述性标签（1girl,
    brown hair等）批量删除 -> 仅保留触发词，实现权重迁移。
  excerpt:
  - 推荐减标工具：数据集标签编辑器stable-diffusion-webui-dataset-tag-editor... 选择batch edit captions-移除-frequency-descending...
    选择和人物个人相关的标签... 点击remove selected tags就可以删除多余的标签完成批量减标了
- name: XYZ Grid网格测试法
  desc: X轴设置不同Epoch的Checkpoint，Y轴设置不同LoRA Weight（如0.4-1.0），固定Prompt/Seed生成网格图，肉眼对比收敛度、过拟合、灵活性，选取最优模型版本。
  excerpt:
  - a）生成xyz表：把本次训练的不同epoch模型放在x轴上，y轴设置不同的权重参数，用文生图把模型跑出来图片看看
- name: Metadata参数反推法
  desc: 在C站点击Show Metadata获取JSON -> 解析ss_dataset_dirs(n_repeats, img_count)、ss_resolution、ss_network_dim/alpha、ss_learning_rate、ss_epoch/max_train_steps、ss_sd_model_hash等字段，还原完整训练配方。
  excerpt:
  - 'b）以KoreanDollLike v1.0版本为例，它的元数据如下，所有训练参数已经知道了... ss_dataset_dirs: {100_GiniS2:
    {n_repeats: 100, img_count: 110}}, ss_resolution: (713, 891), ss_network_dim:
    128, ss_learning_rate: 0.0001...'
theorems:
- name: 训练分辨率与推理分辨率匹配原则
  desc: 训练图片分辨率（如512x512）应与推理时常用生成分辨率一致；若训练低分推理高分，模型未学习高分细节易‘脑补’导致结构崩坏（如生成多头）。
  excerpt:
  - 和你使用文生图的的业务场景相关，例如你用512*512的图片训练了模型，但是使用的时候生成大于512的照片（实测用515*512训练的模型生成1024宽度图片时，输入1girl可能会出现生成多个人），这个我猜测是模型没学到大于512的内容，在实际生成过程中模型会脑补空白的地方给重新执行了prompt
- name: 减标签等价于显式条件解耦
  desc: 通过删除显式描述标签，将其隐性特征编码压缩进触发词的嵌入空间，实现‘一词驱动全概念’的推理便利性，本质是标签共现统计先验在LoRA低秩矩阵中的隐式聚合。
  excerpt:
  - 减少标签并不会导致模型在学习的时候不学习小姐姐的个人特征，而是会把这些删除的特征的权重全部加到前面的词汇里... 这个时候当我们训练完人物lora模型时，直接输出shengcai作为prompt就很大概率会生成这个小姐姐了
- name: ControlNet+LoRA组合范式
  desc: 结构控制用ControlNet，风格/身份固定用LoRA。产品设计用Canny+Prompt，AI模特用ChilloutMix+ControlNet+Inpainting，建筑设计用Canny+建筑LoRA。
  excerpt:
  - 辅助产品设计... 通过controlnet的canny模型+prompt生成
  - AI模特：石膏模特+实拍产品... 结合chilloutmix+controlnet+图生图inpaiting
  - AI建筑设计... 通过controlnet的canny模型+建筑lora模型
- name: 数据集多样性>数量原则
  desc: 角度、场景、光照的多样性比单纯堆砌同质图片更关键；单一角度训练会导致模型泛化能力崩塌（如仅半身照训练无法生成全身）。
  excerpt:
  - 图片角度丰富，训练人物lora模型，你提供一个人的正面、侧面、脸部特写、全身等多角度训练出的模型，在生成时效果更好（例如你的prompt输入里fullbody，希望生成一个全身照片，假如你的训练用的照片一直都只有照片半身照或者脸部特写，那么AI随便脑补生成全身时可能会出现崩坏的图片）
findings:
- name: KoreanDollLike v1.0 训练配方复现
  desc: '[evidence] 通过Metadata分析，该模型使用URPMChill底模，分辨率(713,891)，110张图片x100重复=11000步/epoch，Dim=128,
    Alpha=128, LR=1e-4(UNet)/5e-5(TE)，Batch=2, Epoch=1, Steps=5500, Mixed Precision=bf16,
    Clip Skip=2, 无Bucket/Flip/Color Aug。'
  excerpt:
  - '以KoreanDollLike v1.0版本为例，它的元数据如下... ss_sd_model_name: URPMChill.ckpt, ss_resolution:
    (713, 891), ss_num_train_images: 11000, ss_dataset_dirs: {100_GiniS2: {n_repeats:
    100, img_count: 110}}, ss_network_dim: 128, ss_network_alpha: 128.0, ss_learning_rate:
    0.0001, ss_text_encoder_lr: 5e-05, ss_epoch: 1, ss_max_train_steps: 5500, ss_mixed_precision:
    bf16, ss_enable_bucket: False, ss_flip_aug: False, ss_color_aug: False, ss_clip_skip:
    2'
- name: WD14 Tagger优于早期自然语言标注器
  desc: '[evidence] 实测对比：WD14生成'' shengcai, 1girl, solo, realistic, looking at viewer,
    short hair, brown hair...'' 结构化Danbooru标签，优于早期工具生成的自然语言句子 ''a woman with red hair...''
    及其他工具产出的含乱码标签。'
  excerpt:
  - 可以看到生成的标签质量比上一个打标器生成的质量要好，另外如果要训练lora模型，需要添加一个未来用于触发该lora模型的触发词
- name: 512x512训练模型生成1024图像结构崩坏案例
  desc: '[evidence] 实测发现：512分辨率训练的模型，在1024宽度推理时输入''1girl''会生成多人物，印证了训练分辨率限制了模型的空间先验范围。'
  excerpt:
  - 实测用515*512训练的模型生成1024宽度图片时，输入1girl可能会出现生成多个人
- name: 镜像翻转/裁剪扩充数据导致过拟合风险
  desc: '[claim] 作者观察到大量使用镜像翻转或重复裁剪扩充的数据集，会导致模型训练过拟合，建议少量使用或不使用。'
  excerpt:
  - tips：当图片不够时，可以尝试复制该图片使用镜像翻转提供更多的图片，同理也可以复制同一张图片进行裁剪，不过不建议放太多这种图片，容易训练过拟合
- name: 电商/设计行业落地机会最大
  desc: '[claim] 基于业务接触判断，电商（AI模特换装）、设计（分镜/建筑出图）是当前SD商业化落地最成熟、需求最迫切的场景。'
  excerpt:
  - Stable Diffusion的训练还是存在一定门槛... 但是运用场景非常多，可以大幅度帮助各行业优化业务流，其中电商、设计行业有比较多的机会
