paper: docs/202305/20230516_075.md
desc: 该素材详细拆解了利用 ChatGPT 与 RPA（机器人流程自动化）实现抖音带货文案批量生产与视频自动化发布的全链路实操体系，核心流程包含：通过抖音热点宝与抖音筛选挖掘爆款带货文案模版、利用轻抖或
  RPA+飞书妙记批量提取文案、基于 ChatGPT 超级写手结合 Temperature 参数调节与结构化 Prompt 实现差异化改写、通过一帧秒创/万彩/剪映完成文案到视频的转化与素材替换、最终借助
  RPA 实现多平台批量上传与抖音 SEO 关键词霸屏布局，形成从选品、文案、视频到分发的闭环标准化作业流程。
concepts:
- name: ChatGPT 超级写手
  desc: 基于 UiBot 开发的 RPA 机器人，实现 ChatGPT 提示词的批量自动化调用与文案生成，解决原生 ChatGPT 网页版无法批量操作的痛点。
  is_original: true
  excerpt:
  - uibot chatgpt 超级写手机器人基于 uibot 开发完成
  - '[全自动，真批量——ChatGPT 超级写手机器人 1.0（带源码）（通用版）]'
- name: Temperature 差异化生成策略
  desc: 通过调节 ChatGPT 的 Temperature 参数（0.3-0.7/0.9）控制输出的确定性与创造性平衡，批量生成风格迥异的文案版本以规避查重与同质化。
  is_original: false
  excerpt:
  - temperature chatgpt 提问时加一个 temperature 输出效果立马不一样
  - 我们设定不同的 temperature 的值，得到不同的答案
  - 如果文案内容不满意...可以通过调节 temperature 的值来实现
- name: 结构化卖点迁移 Prompt
  desc: 一种标准化的提示词工程模版，要求模型先分析种子文案的卖点表达结构与人群画像，再将其迁移应用至新商品，保持文案结构不变实现‘套用模版’。
  is_original: true
  excerpt:
  - 请针对上述文本进行分析，学习商品卖点和使用人群的表达方式，并应用于以下商品来编写同样结构的文案
  - 模版：{大姑家微胖女生的不露腿连衣裙分享...} 商品：西装阔腿女裤 卖点：... 适用人群：...
- name: 抖音 SEO 霸屏布局
  desc: 将搜索下拉词、相关搜索、大家都在搜等长尾关键词系统性植入视频文案、详情描述及标签，配合 RPA 批量发布构建关键词覆盖矩阵，实现搜索流量截获。
  is_original: false
  excerpt:
  - 把搜索下拉词+相关搜索+大家都在搜的关键词 统统埋进视频的文案，详情描述，以及标签里
  - 无论用户搜索什么关键词，都能看到你的作品，实现抖音 SEO 霸屏的效果
- name: RPA 端到端自动化闭环
  desc: 将选品采集、文案生成、视频制作、多平台上传全流程通过 UiBot 等 RPA 工具串联，前提是手动流程跑通，实现从 1 到 100 的规模化复制。
  is_original: false
  excerpt:
  - 手动流程梳理清楚了，再利用通过 RPA 文案生成+视频制作+视频上传全部都批量自动化了
  - 凡是可以用手动完成，且有一定规律的重复性操作，都可以用 RPA 来自动化实现。前提是手动流程跑通。
methods:
- name: __overview__
  desc: 抖音带货内容批量化生产全流程方法论：爆款挖掘 -> 文案提取 -> AI 改写/重构 -> 视频合成 -> 自动分发 -> SEO 布局。
  excerpt:
  - 简版流程：通过抖音热点宝...提取出带货文案，然后用 chatgpt 直接改写...最后用一帧妙创一键生成视频...利用 RPA 文案生成+视频制作+视频上传全部都批量自动化了
  - 手动流程跑通 -> RPA 自动化
- name: 爆款带货文案模版挖掘法
  desc: 双渠道定位标准：仅收录‘明显带货性质’且‘机器人文字转语音’的视频。渠道一：热点宝‘种草热点总榜’近7天筛选带商品标签项；渠道二：热点宝‘上升热点榜’用大类目词搜索+抖音原生筛选‘最多点赞、半年内’。
  excerpt:
  - 选文案模板视频时，只有一个标准，要有明显的带货性质，最好是机器人文字转语音的视频
  - 热点宝有两个路径可以找带货文案 a.种草 b.热点
  - 抖音筛选：最多点赞，半年内
  - RPA 采集功能，将热点话题名称，视频链接，带货商品链接，都采集整理到 excel 表格
- name: 批量文案提取方案分级策略
  desc: 根据业务量级选择工具：0-1 阶段用轻抖（新用户30分钟/付费60元50小时）低成本试错；1-100 阶段用 RPA+飞书妙记零成本自动化批量提取。
  excerpt:
  - 轻抖 新用户送 30 分钟...即便付费...完全没有必要折腾，算上时间成本，花钱是最便宜的方案
  - RPA+飞书妙记的自动化免费方案...对于已经跑通项目全流程，200 个小时都不大够用的朋友
  - 自动化，批量更多的是解决从 1 到 100 的问题而不是解决从 0 到 1 的问题
- name: ChatGPT 批量改写与卖点重组方法
  desc: 结合‘超级写手’RPA工具，采用『高 Temperature 发散改写』生成多版本 + 『结构化卖点迁移 Prompt』重组新品文案，实现去重与定制化并行。
  excerpt:
  - 用 chatgpt 超级写手，批量改写，制作带货文案，这里我们设定不同的 temperature 的值，得到不同的答案
  - 请针对上述文本进行分析，学习商品卖点和使用人群的表达方式，并应用于以下商品来编写同样结构的文案
- name: 低成本视频合成与素材替换流
  desc: 利用一帧秒创/万彩/剪映‘图文成片’功能将文案转为 PPT 风格视频，核心策略是‘不在意生成素材质量，后期剪映批量替换本地真实素材’，规避 AI 选素材不准问题。
  excerpt:
  - 用一帧妙创用文案一键制作视频，再替换自己的本地素材，不用在意一帧妙创生成的素材不好，后面剪映直接替换即可
  - 视频直接用图片生成的 PPT 风格视频即可...手机剪映图文一键成片就行了
theorems:
- name: 手动跑通是自动化前提定律
  desc: 任何 RPA 自动化项目的成功前提是手动标准化流程（SOP）已跑通并验证可行；自动化解决的是规模化（1到100）而非验证可行性（0到1）的问题。
  excerpt:
  - 手动流程梳理清楚了，再利用通过 RPA...全部都批量自动化了
  - 自动化，批量更多的是解决从 1 到 100 的问题而不是解决从 0 到 1 的问题
  - 凡是可以用手动完成，且有一定规律的重复性操作，都可以用 RPA 来自动化实现。前提是手动流程跑通。
- name: 工具组合替代单一平台依赖论
  desc: 通过组合专用小工具（热点宝选品、轻抖提取、超级写手生成、一帧秒创视频、RPA 分发）构建最佳实践链路，成本与效率优于依赖单一大平台或全人工操作。
  excerpt:
  - 本文用到的工具清单：1.抖音热点宝 2.total control 3.轻抖 4.uibot 5.chatgpt 6.temperature 7.webchatgpt
    8.一帧秒创
  - 算上时间成本，花钱是最便宜的方案
- name: SEO 霸屏是存量竞争下的必选动作
  desc: 在内容同质化、AI 生产门槛降低的背景下，仅靠爆款文案不足以出单，必须通过系统性关键词布局（下拉词/相关搜索/大家都在搜）构建搜索护城河，利用竞争对手缺乏自动化布局能力的窗口期获取精准流量。
  excerpt:
  - 越写越感觉有了爆款文案也不一定能出单，上了 Chatgpt 和 RPA 自动化 还是有可能干不过对手或者同行 所以，这抖音 SEO 霸屏，必须上！
  - 你觉得，你的同行，会有这个能力做这样的操作和关键词布局？即便他有，即便他想，他人工手动，搞的过来？
findings:
- name: 热点宝‘种草榜’带货密度高于‘上升热点榜’
  desc: '[evidence] 实测对比发现：种草热点总榜中带商品标签的内容直接可用，数量充足；上升热点榜虽数据量大但带货内容需人工筛选，带货密度较低，但竞争相对较小（1万赞小热点也可上榜）。'
  excerpt:
  - 种草...有商品标签的热点就是我们要找的
  - 上升热点中的数据多一些，但带货的内容需要一个个去找，带货内容数量可能不如种草里多。不过，1w 赞的小热点也有上榜，不至于那么卷。
- name: Temperature 0.3-0.7 平衡带货文案合规性与多样性
  desc: '[claim] 作者引用 ChatGPT 自我建议：带货文案建议 Temperature 设定在 0.3-0.7 之间（倾向事实、连贯、保守），若需创意可设
    0.9。实操中通过设定不同值批量生成多版本供筛选。'
  excerpt:
  - chatgpt 中 temperature 的值到底设定多少合适，这个问题问 chatgpt 最合适不过了
  - 如果文案内容不满意...可以通过调节 temperature 的值来实现
- name: 结构化 Prompt 可精准复刻爆款文案‘骨架’
  desc: '[evidence] 实测案例显示：输入种子文案（连衣裙）与新商品卖点（西装阔腿裤），ChatGPT 能严格保持‘身材参考->分套描述->卖点穿插->遮肉细节->色彩推荐->侧背展示->总结’的段落结构，实现卖点无损迁移。'
  excerpt:
  - 模版：{大姑家微胖女生的不露腿连衣裙分享...}
  - 请针对上述文本进行分析...编写同样结构的文案
  - 商品：西装阔腿女裤 卖点：显瘦，显高... 适用人群：职业女性...
  - (配图显示生成结果符合预期结构)
- name: 云希配音可通过 Azure 免费白嫖替代付费中间商
  desc: '[evidence] 发现‘云希’为微软 Azure 免费配音角色，市面工具（如魔X工坊、一帧秒创会员）实为中间商收费（如月费88元），开发者可直接调用
    Azure TTS API 零成本获取同等音色。'
  excerpt:
  - 如果你不愿意为了用云希的配音每月付 88 块。那就麻烦一点注册一下微软 azure，云希是微软的免费配音角色，魔 X 工坊也只是个中间商。
- name: RPA 批量上传配合关键词稀释规避平台堆砌风控
  desc: '[claim] 作者主张：单视频不宜堆砌过多关键词防风控，但因 RPA 可无限量批量生产视频，可将关键词分散至海量视频矩阵中，以‘视频数量’换‘单视频关键词密度’，实现全覆盖且合规。'
  excerpt:
  - 为了防止后期出现关键词作弊或者堆砌处罚，一个视频不要堆太多关键词了
  - 反正通过 RPA 文案生成+视频制作+视频上传全部都批量自动化了，也无所谓一个视频内的关键词是多还是少了
  - 最后，用户无论搜索什么关键词，都是你的作品
