  desc: '[claim] 作者宣称使用该套打法在一个月内跑通流程并实现日引1000+创业粉的体量。'
  excerpt:
  - 我是怎么用这套打发一个月的时间内跑通并做到 日引上千创业粉的体量的！
- name: 粉丝回收定价基准
  desc: '[evidence] 素材披露了创业粉在私域批发市场的标准收购价为5元/个，确立了该模型的单粉变现上限与分销利润测算基准。'
  excerpt:
  - 五块钱一个我们回收
- name: 代理授权定价与留存模型
  desc: '[evidence] 素材披露代理授权采用‘免费试用7天 + 30元/月续费’的定价策略，降低代理准入门槛，通过低成本月费筛选长期执行者，保证账号矩阵活跃度。'
  excerpt:
  - 一个账号是免费一个号授权 7 天 后面 续费 30 天 30 块钱的
- name: 类目违规高风险实测
  desc: '[evidence] 评论区用户反馈‘选择辅导资料类目直接被判违规’，佐证虚拟资料发布面临严格类目审核，验证了‘见面交易’等规避手段的必要性。'
  excerpt:
  - 想问下发布教程的时候，咸鱼类目选择的是什么。有时候选择辅导资料直接被判违规
