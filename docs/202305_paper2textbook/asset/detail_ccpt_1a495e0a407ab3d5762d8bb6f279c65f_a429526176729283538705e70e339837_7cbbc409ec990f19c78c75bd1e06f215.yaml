    role: origin
  excerpts:
  - 因为文章图片较多，放在飞书文档了
  - 公开分享，禁止复制，可以这么设置
  - 详细 SOP 沉淀于飞书：账号搭建、素材来源、话术脚本、引流私域、交付流程、避坑指南
