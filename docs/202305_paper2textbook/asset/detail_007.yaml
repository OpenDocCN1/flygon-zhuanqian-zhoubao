- 'no': 4
  name: 信用价值变现与合伙人制杠杆 —— 把“信用分”变成“印钞机”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人缺本金、缺额度、缺渠道，但拥有“征信良好、人脉优质、纳税达标”的隐性资产'
  - '- 银行授信额度、亲友闲置账户、企业纳税资质均可转化为低成本融资工具'
  - '- 单打独斗规模受限，合伙人制能将边际成本降为零、实现规模化复制'
  - '**核心定义**'
  - '- 信用变现：征信/授信/人脉 → 低成本融资（抵押贷/经营贷/纳税贷） → 存贷套利/存款冲量'
  - '- 合伙人模型：出资方（提供账户/资金/粉丝）+ 出技术方（提供SOP/工具/运营）+ 出资源方（提供渠道/额度） → 收益分成、风险分摊'
  - '**关键性质**'
  - '- 无本万利：核心成本是“信用价值”而非自有本金，资金不出自有卡'
  - '- 规模化复制：百户代打可转债、多号淘宝客、团队存款套利，单人上限被打破'
  - '- 利益绑定：分成制（如对半分、28分成）天然对齐激励，解决代理问题'
  - '**典型例子**'
  - '- 可转债：整合100个亲友/企业账户代打，单户年均1000-2000元，年入6-10万，企业户破解2年/10万门槛'
  - '- 淘宝客：合伙人出微信号/资金，作者出机器人/运营，单号3000精准粉年利3-4万，封号风险共担'
  - '- 存款套利：对接行长考核任务，自有卡操作，高净值合伙人提供额度/资源，单日峰值10万利润'
  - '**边界条件**'
  - '- 合伙人筛选标准：靠谱（有交代/有回音/有落实）、理性消费、无不良嗜好、朋友圈层质量高'
  - '- 财务透明化：必须建立独立核算体系，杜绝资金池混用、账目不清（曾因外卖CPS合伙人挪用资金仅回本80%）'
  - '- 合规红线：严禁融资融券、严禁他人代管账户、严禁资金离开自有银行卡体系'
  sources:
  - paper: docs/202305/NsZwdMgSxovqfxxgJqFc5XtXntb.md
    role: origin
  excerpts:
  - 这个东西投资的是人脉投资，投资金额很难估算。最大的成本就是你的信用价值
  - 我自己备用了几百万放着，随时要用随时可以用
  - 像我，可以一下子搞出500万的银行额度。一年关键几天的净利润收益也有3万起
  - 小微信号合伙人出钱出微信号，我们出钱出人管。合作共赢
  - 100个户在代打，收益分一半，包括自己家里人户头
  - 他负责他的人脉圈子里提供和寻找匹配银行需求资源，我负责高端客户资源
- 'no': 5
  name: 流动性优先原则与三大致命坑 —— 资金链断了，神仙难救
  points:
  - '**为什么需要这个概念？**'
  - '- 历史惨案证明：融资融券爆仓、消息票梭哈、他人代管账户挪用，均源于放弃资金控制权'
  - '- 流动性是生存底线：宁可错过风口、赚少点，也要保证资金随时可赎回、自有卡可控'
  - '- 复利前提是“不死”，流动性优先是“不死”的硬性协议'
  - '**核心定义**'
  - '- 铁律：所有资金在自己名下银行卡内互转，不转给他人，不买不可速赎理财，随时可快速赎回'
  - '- 拒绝清单：融资融券（不可控账户）、消息票/内幕交易（无止损梭哈）、他人代管账户（财务不透明）'
  - '**关键性质**'
  - '- 绝对优先级：流动性 > 收益率 > 规模 > 速度'
  - '- 止损纪律：股票委托投资设“盈利50%作风险预算、5倍杠杆上限、15-20%强平线”'
  - '- 账户隔离：投资账户、生活账户、备用金账户物理隔离，防止挪用'
  - '**典型例子**'
  - '- 融资融券坑：亲戚账户被拿做接盘侠，100万资金说没就没，10万仅剩1万，彻底杜绝融资融券'
  - '- 消息票坑：兄弟听信‘中天金融’重组消息，融资300万梭哈，亏至60万成老赖'
  - '- 代管账户坑：淘宝达人/外卖CPS项目被合伙人挪用资金、平台扣量，30万投入仅回本80%'
  - '**边界条件**'
  - '- 即使是高信任合伙人（亲兄弟、发小），资金账户也不共享，仅通过分成结算'
  - '- 任何承诺“保本高收益、资金由我代管”的项目，直接判定为诈骗/高风险'
  - '- 备用金池：始终保留3-6个月家庭支出+核心项目周转金的绝对流动性储备'
  sources:
  - paper: docs/202305/NsZwdMgSxovqfxxgJqFc5XtXntb.md
    role: origin
  - paper: docs/202305/20230516_067.md
    role: improve
  excerpts:
  - 资金的流动性，这一条，一定要牢牢控制住。你可以不投资，但手头一定要有临时备用的资金
  - 所有的资金都是在自己名下银行卡内互转！不转给他人，不用买理财产品，随时可以快速赎回
  - 从此以后，怎么样都不碰融资融券
  - 我亲戚那个账户被拿过去做了接盘侠，一百多万的资金说没就没...10万就剩下1万块钱了。这是我最大的坑之一。从此以后，怎么样都不碰融资融券
  - 他自己借钱融资上杠杆，投资了三百多万...300多万现在只能下60多万...现在是负债累累几百万
  - 投资外卖CPS和影票CPS，前后投了30万，现在已回本80%...目测平台太坑，饿了么、美团吃相太难看
- 'no': 6
  name: 防守优先定理与双腿走路模型 —— 先筑“金钟罩”，再谈“拓疆土”
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数普通人处于：有房贷、有幼儿、积蓄有限、学历/职场资本未饱和的“防守期”'
  - '- 盲目裸辞创业/全职自媒体是“裸奔进攻”：放弃社保公积金、收入波动大、平台依赖度高、无劳动法保护'
  - '- 防守成本（保费/社保/时间）远低于进攻失败的恢复成本（职场断层/信用破产/家庭破裂）'
  - '**核心定义**'
  - '- 防守（主业/城池）：稳定现金流、五险一金、职场资历、学历背书、房产/家庭/健康存量资产'
  - '- 进攻（副业/拓土）：自媒体、投资、电商等额外收入，提供选项值与增量收益'
  - '- 金钟罩（保险四件套）：意外险（杠杆高）、重疾险（赔付收入损失）、医疗险（报销医疗费）、寿险（传承责任）'
  - '**关键性质**'
  - '- 阶段性：防守不是永不进攻，而是“等孩子大些、房贷还清、护城河建好”再发起进攻'
  - '- 叠加性：双腿走路（主业+副业）抗风险收益 > 单腿跳跃（全职创业）'
  - '- 认知门槛：能觉得“钱够用”、拒绝“出名是捷径”，是高阶认知稀缺品'
  - '**典型例子**'
  - '- 作者：主业月薪2万+公积金，副业公众号年入十多万，保费2万/年配齐四件套，社保未断缴，裸辞3个月后果断回职场'
  - '- 弟弟案例：大专/月薪15K/无保单，作者用“防守/城池”逻辑说服其买5700元重疾险，认知升级驱动防守行为'
  - '- 评论区共识：乾“别破釜沉舟”、叫我李同学“一切基础基于原来的稳定”、飞掌柜“先做好防守再寻找进攻”'
  - '**边界条件**'
  - '- 无房贷、无育儿责任、高学历/高技能、有风投/家庭托底者，可适当前置进攻'
  - '- 全职自媒体本质是“帮平台打工”：无社保公积金、工作量更大、算法依赖、政策风险自担'
  - '- 性格-资源匹配：防守型人格（资质平平、胆子不大、无强背景）强行进攻违背客观规律'
  sources:
  - paper: docs/202305/20230516_067.md
    role: origin
  - paper: docs/202305/NsZwdMgSxovqfxxgJqFc5XtXntb.md
    role: improve
  excerpts:
  - 防守比进攻重要！
  - 创业是进攻，打工是防守。选择创业就没有固定工资，创业赚得多，风险也更高。
  - GJ 给的保障只是基础的，它不能转换成你的金钟罩，但是保险可以。
  - 人生是一场长跑，在某个阶段因为什么事情暂时停下来了，有了金钟罩，在你想启程的时候，你可以继续启程的。
  - 毕业 10 年，我打下的江山有哪一些呢？一张大专的毕业证、一个家、一个小孩、在上海一套房、一个还算健康的身体和一个月薪两万的工作。这些都是我毕业 10 年来打下的江山。守住这些，才是我的当务之急。
  - 那你要配备哪几种保险呢？四种就够了：意外险，重疾险，寿险，医疗险。我家每年会花 2 万块在保险上。
  - 当面试官问我，你这三个月干什么去了？我就会说：我朋友开了一个自媒体公司，叫我过去帮忙...
  - 投资是很忌讳梭哈的，10次投资你9次成功，但只要一次失败，就会让你万劫不复，就像乐视的贾跃亭
