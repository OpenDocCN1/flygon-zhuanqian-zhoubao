life_analogy:
- 想象财富管理是一场**长跑比赛**：
- '- **记账** = 配速器/心率监测：实时掌握身体状态（财务状况），决定何时加速/减速'
- '- **三阶段风控** = 分段配速策略：起跑保体力（守收入）、中程控风险（守净资产20%）、冲刺求稳（标普配置）'
- '- **被动收入** = 补给站：持续提供能量胶（现金流），让你敢于冲刺高风险坡道（股票投资）'
- '- **信用杠杆/合伙人** = 借力跑：利用他人账户/额度/粉丝（顺风车/接力棒）放大单位步频产出'
- '- **流动性优先** = 穿自带水壶跑：拒绝沿途不明饮料（融资融券/他人代管），防止中毒退赛'
- '- **防守优先/双腿走路** = 穿护膝/护踝（保险/社保/主业）跑：护具虽重但能保膝盖（城池）不碎，副业是备用跑鞋'
- '- **少年创业七阶** = 青少年组冠军成长录：1元报名费起跑 → 碎片时间练基本功 → 抓住赛事红利期All-in → 混入专业队训练 → 完美复制冠军动作
  → 单人包揽全项目 → 伤病期果断转项'
summary:
- concept: 记账复盘体系
  desc: 财务导航仪：每笔有归属、每项目有账，支撑开源节流与项目级盈亏测算
- concept: 三阶段风险测算
  desc: 动态安全阀：一阶段守收入、二阶段守净资产20%+2倍杠杆、三阶段按标普配置搭台
- concept: 被动收入锚定
  desc: 心理安全垫：经纪佣金/淘宝客/转债/套利覆盖生活支出，让高风险投资亏得起、拿得住
- concept: 信用价值变现
  desc: 把征信/授信/人脉变印钞机：低成本融资→存贷套利/存款冲量，合伙人制实现规模化复制
- concept: 合伙人制杠杆
  desc: 出资/出技/出源三方分成：边际成本趋零、风险分摊、利益天然绑定
- concept: 流动性优先原则
  desc: 生存铁律：资金不出自有卡、随时可赎回、拒绝融资融券/消息票/他人代管，流动性>收益率
- concept: 三大致命坑
  desc: 融资融券爆仓、消息票梭哈、他人代管挪用——均源于放弃资金控制权
- concept: 防守优先定理
  desc: 有房贷/幼儿/积蓄有限阶段，防守（主业/社保/保险/城池）边际收益>进攻（裸辞创业）
- concept: 双腿走路模型
  desc: 主业防守+副业进攻：稳定现金流托底风险，副业提供增量与选项值，抗风险收益>单腿跳跃
- concept: 金钟罩（保险四件套）
  desc: 意外/重疾/寿险/医疗：将国家基础保障转化为个体高强度抗风险能力，降低试错沉没成本
- concept: 城池
  desc: 学历/房产/家庭/健康/主业收入：毕业10年积累的核心资产组合，守住才是当务之急
- concept: 四年财务跃迁曲线
  desc: 19年负债19万→20年22万→21年96万→22年93万→23年32万+，验证多渠道组合抗周期稳健性
- concept: 可复制性梯度
  desc: 套利/转债/经纪佣金(高) > 淘宝客(中，需运营) > 主观股票(低，不可复制)
- concept: 少年创业七阶
  desc: 1元启动→碎片时间资产化→平台红利窗口→向上社交→守破离模仿→单人全链路→风口果断转型
- concept: 试错成本递增定律
  desc: 初中<高中<大学<职场，大学专科两年是最后低成本试错窗口
- concept: 靠谱真诚积累商机
  desc: 执行力与信用是穷人逆袭唯一杠杆：说到做到赢得贵人提携与合伙人信任
- concept: 稳字当头/投资忌梭哈
  desc: 10次成功1次归零即万劫不复，预设最坏后果（祸不及家人），只做有沉淀的赛道
exercises:
- 'no': 1
  title: 三阶段风控红线实战推演
  contents:
  - 假设你当前年收入20万，净金融资产50万（不含自住房），无房贷，单身。
  - 1. 根据三阶段体系，你当前处于哪个阶段？最大可承受亏损额是多少？是否可引入杠杆？
  - 2. 若两年后净金融资产增至200万，年收入增至30万，阶段如何切换？红线如何变化？
  - 3. 若此时遇到一个"年化20%、需融资融券、资金托管他人账户"的项目，依据流动性优先原则，列出至少3条拒绝理由。
  - 回答问题：
  - '- 为什么二阶段杠杆上限设为2倍而非更高？'
  - '- 房产为何不计入流动净资产风控基数？'
- 'no': 2
  title: 被动收入锚定与心理账户构建
  contents:
  - 你月生活支出1.5万，主业月薪2万（扣社保后到手1.7万），目前无被动收入。
  - 1. 设计一个12个月的被动收入建设计划，目标：覆盖基本生活支出（1.5万/月），列出3个可执行的低门槛项目及预期时间线。
  - 2. 计算：被动收入达标前，你的高风险投资（如股票）最大仓位建议为主动收入的多少比例？达标后可提升至多少？
  - 3. 识别下列哪个伪装成"被动收入"的项目：A. 编写自动化脚本售卖 B. 信托理财产品 C. 需每日盯盘的网格交易 D. 版税收入
  - 回答问题：
  - '- 为什么淘宝客等平台依赖型收入不能作为永久锚点？'
  - '- 主观股票投资为何被定性为"伪被动收入"？'
- 'no': 3
  title: 防守优先定理的个人适配性自测
  contents:
  - 填写你的"城池清单"与"防守缺口表"：
  - 1. 核心资产（城池）：学历___ 房产___ 家庭责任___ 健康___ 主业月薪___ 社保年限___ 公积金余额___
  - 2. 防守缺口：商业保险(意外/重疾/医疗/寿)配置情况___ 是否有3-6个月支出备用金___ 是否有反诈骗认知体系___
  - 3. 进攻意愿测试：若裸辞全职做副业，你的现金流能维持几个月？期间社保/公积金如何解决？心理焦虑成本如何量化？
  - 4. 基于性格-资源匹配决策律，判断你是进攻型还是防守型人格？（参考：胆识/背景/资质/抗压性）
  - 回答问题：
  - '- 为什么作者认为全职自媒体本质是"帮平台打工"？'
  - '- 面试空窗期话术重构的核心逻辑是什么？如何应用到你的简历中？'
- 'no': 4
  title: 少年创业认知跃迁七阶的迁移应用
  contents:
  - 你今年28岁，主业程序员，想利用周末启动副业（AI工具开发/内容变现/跨境电商任选其一）。
  - 1. 对照七阶模型，你目前处于哪个认知阶梯？缺失哪些关键动作？
  - 2. 设计一个"虚拟业务冷启动四步法"的周末版执行计划（预算<100元，时间<20小时/周）。
  - 3. 识别你所选赛道当前是否处于"平台红利窗口期"？判断依据为何？（参考：规则松/流量廉/变现清晰）
  - 4. 制定"风口判断果断转型"的止损指标：连续多少周投入产出比<1:1触发转型？
  - 回答问题：
  - '- 为什么说"执行力大于资源"在资源受限环境下是核心变量？'
  - '- 如何避免陷入"沉没成本陷阱"而错过转型最佳期？'
units:
- 'no': 1
  name: 记账复盘体系 —— 让财务拥有“导航仪”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人往往不知道钱花哪了，更不知哪个项目赚钱、哪个亏钱'
  - '- 无数据支撑下的投资决策本质是赌博，极易梭哈导致万劫不复'
  - '- 只有掌握全貌，才能实现“开源节流”与“项目级盈亏测算”'
  - '**核心定义**'
  - '- 每日记录全账户流水（挖财APP等工具），分类覆盖生活、主业、各副业项目'
  - '- 形成自动报表，支持按项目/时间/类别的多维盈亏复盘'
  - '**关键性质**'
  - '- 基础设施属性：是多项目并行管理、三阶段风控、被动收入锚定的前置条件'
  - '- 复利杠杆：数据积累越久，决策边际收益越高（如识别淘宝客衰退周期）'
  - '- 低门槛高坚持：养成习惯约需1个月，之后边际成本极低'
  - '**典型例子**'
  - '- 作者2019年起坚持记账，从负债19万走到年净收益近百万，记账贯穿始终'
  - '- 通过项目级报表发现淘宝客利润年年下滑、四大行套利单季度爆发20万，从而动态调整资源分配'
  - '**边界条件**'
  - '- 仅记流水不分类、不复盘，等于没记，无法支撑决策'
  - '- 夫妻/家庭共同财务需统一记账口径，否则数据失真'
  - '- 工具只是载体，核心是“每笔有归属、每项目有账”的会计思维'
  sources:
  - paper: docs/202305/20230516_058.md
    role: origin
  - paper: docs/202305/NsZwdMgSxovqfxxgJqFc5XtXntb.md
    role: improve
  excerpts:
  - 特感谢我们教会我记账的朋友，是他让我学会了如何做流水账，让我能掌控我的财务，对盈利数据进行分析，引导我更好的投资
  - 我是从19年开始记账的。养成这个习惯花了一个月的时间。后面就很顺其自然的每天习惯记账了
  - 记账能让你很适合开源节流，让你有个清晰的知道在哪个项目比较赚钱，哪个地方多花钱
  - 每当你要去计算你每个项目赚多少钱或者花多少钱时，对照每个项目的前后出入逻辑就能测算出来
- 'no': 2
  name: 三阶段风险测算体系 —— 给资金配置“安全阀”
  points:
  - '**为什么需要这个概念？**'
  - '- 投资忌梭哈：10次成功1次归零即万劫不复，必须预设最坏后果'
  - '- 不同资产量级承受风险能力不同，静态止损线会导致要么过度保守、要么暴雷'
  - '- 普通人缺乏机构级风控模型，需要一套简单可执行的动态红线'
  - '**核心定义**'
  - '- 第一阶段（积累期）：最大亏损额 < 年收入（以人力资本兜底）'
  - '- 第二阶段（增长期）：最大亏损额 < 净资产20%，可引入2倍内杠杆'
  - '- 第三阶段（成熟期）：按标普资产配置标准搭建利他平台，实现钱生钱'
  - '**关键性质**'
  - '- 动态升级：随净资产增长自动切换阶段，而非固定比例'
  - '- 杠杆纪律：二阶段严控2倍内杠杆上限，三阶段去杠杆转配置'
  - '- 核心指标锚定：一阶段守收入、二阶段守净资产、三阶段守现金流'
  - '**典型例子**'
  - '- 作者早期以经纪人佣金（12-20万/年）为收入锚点，亏损上限锁定在年薪范围内'
  - '- 资产增长后，以净资产20%为红线操作股票委托投资，最大回撤未超15%'
  - '- 后期将四大行套利、可转债等确定性收益纳入类标普配置，年化稳健产出'
  - '**边界条件**'
  - '- 房产不计入流动净资产（变现慢、居住属性强），风控基数仅含金融资产'
  - '- 杠杆仅限“可控账户、可随时平仓、止损线硬性执行”的标准化交易'
  - '- 三阶段转型标志是“被动收入覆盖生活支出”且“拥有搭台整合资源能力”，非单纯金额阈值'
  sources:
  - paper: docs/202305/NsZwdMgSxovqfxxgJqFc5XtXntb.md
    role: origin
  - paper: docs/202305/20230516_067.md
    role: improve
  excerpts:
  - 第一阶段：测算可承受最大的风险系数：可能性最大亏损金额<平均月收入*12
  - 第二阶段：我的投资最大亏损金额=身家（不含房子）*20%...可以适当放一些杠杆上去，一半最好就2倍以内
  - 第三阶段了：最近听到一句话，穷人拆台、富人补台、智者搭台...第三阶段，我将按照标准普尔去投资了，然后就是要搭个利他型的平台
  - 所以一个成年人，你在工作之后，要做好三件事情：1、要防止被骗……2、要买社保，而且社保不要断……3、配备保险...GJ 给的保障只是基础的，它不能转换成你的金钟罩，但是保险可以。
- 'no': 3
  name: 被动收入锚定策略 —— 让高风险投资有“底气”
  points:
  - '**为什么需要这个概念？**'
  - '- 无现金流托底的投资极易因恐惧而止损过早、或因贪婪而梭哈不出'
  - '- 主业工资单一且不可控（裁员/降薪），需构建“睡后收入”对冲职业风险'
  - '- 被动收入是心理账户的“安全垫”，让风险投资真正做到“亏得起、拿得住”'
  - '**核心定义**'
  - '- 识别/构建：经纪佣金、淘宝客返利、可转债打新、银行套利等高确定性现金流'
  - '- 锚定逻辑：被动收入覆盖基本生活支出 → 心理底气 → 高风险仓位可独立决策'
  - '- 再投资导向：优先将主动收益转化为新的被动收入资产（如买车位收租）'
  - '**关键性质**'
  - '- 非劳动性：不直接出卖时间，边际成本趋近零（代码/资源/信用复用）'
  - '- 抗周期性：股市下跌时佣金/套利收益不减甚至逆势上扬，天然对冲'
  - '- 可规模化：通过合伙人制、工具化、供应链整合放大单位时间产出'
  - '**典型例子**'
  - '- 作者靠经纪人佣金（12-20万）支撑早期股票试错，后以淘宝客（50万/年）为核心底座放大可转债、套利规模'
  - '- 四大行套利：自有资金在官方APP操作，前后<10分钟，资金不出自有卡，年化50-60万极稳健'
  - '**边界条件**'
  - '- 淘宝客等平台依赖型收入有生命周期（作者实测年均下滑），不能作为永久锚点'
  - '- 被动收入建设初期极其耗时（如淘宝客裂变需养号、引流、防封），前期ROI极低'
  - '- 必须剔除“主观股票投资”伪被动收入：波动大、需专业能力、不可复制'
