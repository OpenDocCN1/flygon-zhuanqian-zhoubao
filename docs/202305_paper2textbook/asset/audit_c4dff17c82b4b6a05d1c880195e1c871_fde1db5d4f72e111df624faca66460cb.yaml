unsupported_claims:
- location: '63.11'
  claim: 作者十年战绩：三逃顶、两抄底、100%准确率、连续十年正收益
  reason: 素材中仅在P001/P007提及逃顶/抄底时间点，未提供完整十年逐年收益数据、最大回撤、夏普比率等量化验证指标，无法核实'连续十年正收益'与'准确率100%'的真实性
- location: '63.3'
  claim: 股债性价比长期在1.5-3.0区间波动，中位数约2.0，符合股票长期收益为债券2倍的经验规律
  reason: 素材P001仅引用美股200年经验，未提供A股沪深300股债性价比的完整历史回测数据（如近20年分位数分布、区间停留时长），'长期在1.5-3.0波动'属于作者单向陈述，缺乏统计样本支撑
- location: '63.9'
  claim: 好公司六维定性指标中'经理收入高'为公募界跳槽最终目的地
  reason: 素材P005仅列举'基金经理收入高'为指标，未披露薪酬数据来源、对比基准（如行业中位数）、或与经理留存率的相关性分析，属于定性断言无量化支撑
- location: '63.10'
  claim: 小规模基金打新超额收益年化可贡献0.5%-1%，大基金稀释至<0.05%
  reason: 素材P006给出具体收益占比数值，但未说明计算口径（是否扣除申购费/赎回费/税费）、样本期（牛市/熊市/震荡市）、或对比基准（如同类基金平均打新收益），数据来源不可考
- location: '63.7'
  claim: 宏观数据（M2、社融、GDP）远期影响已完全体现在十年国债收益率中
  reason: 素材P004为单向断言，未引用学术研究（如利率期限结构模型）、或实证分析（如宏观变量对十年期国债收益率的回归R方、显著性），'完全体现'属绝对化表述，忽略市场定价偏差、预期差等现实摩擦
