paper: docs/202305/20230516_058.md
desc: 该素材是一篇个人投资复盘分享文章，作者「老吴说投资」记录了从2019年负债19万到2020-2023年年净收益稳定在几十万至近百万的财务自由历程，核心在于通过记账掌控财务、感恩贵人指引、并行多渠道收入（股票经纪佣金、股票投资、淘宝客推广、可转债打新、四大行无风险套利）实现财富跃升，强调除股票投资外其他项目均具实操可复制性。
concepts:
- name: 记账复盘体系
  desc: 通过做流水账掌控个人财务状况，并对盈利数据进行分析以指导投资决策，是作者从负债走向盈利的基础工具。
  is_original: false
  excerpt:
  - 特感谢我们教会我记账的朋友，是他让我学会了如何做流水账，让我能掌控我的财务，对盈利数据进行分析，引导我更好的投资
- name: 多渠道被动收入组合
  desc: 构建股票经纪佣金、自营股票投资、淘宝客推广、可转债打新、银行无风险套利五大收入支柱，实现单一职业风险对冲与现金流稳健增长。
  is_original: true
  excerpt:
  - 1.股票经纪人年入 12-20 万
  - 2.股票收益年入 20 万
  - 3.淘宝客年入 50 万
  - 4.可转债打新收益年 6-10 万
  - 四大行无风险套利项目
- name: 四大行无风险套利
  desc: 利用四大行（或特定银行）的结构性产品、存贷利差或信用卡权益等规则漏洞，实现本金安全且收益确定的套利操作。
  is_original: true
  excerpt:
  - 特别感谢老胡，开启了四大行无风险套利项目。
  - 除了股票项目不鼓励外，其他均有实操性办法
- name: 贵人/导师引路机制
  desc: 强调在职业转型与投资认知升级关键节点，通过外部导师（叶总、股丰登、李总、老胡等）引入新赛道认知与实操方法论，缩短试错周期。
  is_original: false
  excerpt:
  - 特别感谢带我证券行业入行的叶总...特别感谢股丰登...特别感谢厦门斗猫网络李总...特别感谢老胡
methods:
- name: __overview__
  desc: 整体方法论为：建立记账基座 -> 入行证券积累本金与行业认知 -> 引入导师拓展副业赛道（淘宝客、可转债、银行套利） -> 组合化经营多渠道现金流
    -> 实现财务自由。
  excerpt:
  - 2019 年时我还是个负债 19 万的的金融民工，2020 年成功上岸。
  - 2019 年还负债 19 万，2020 年净收益 22 万，2021 年买了 24 万的车位后净收益 96 万，2022 年买了一个 38 万的车位后净收益
    93 万，2023 年截止目前为止净收益 32 万
  - 除了股票项目不鼓励外，其他均有实操性办法
- name: 淘宝客裂变推广模式
  desc: 依托厦门斗猫网络李总指引，利用淘宝联盟/淘宝客模式，通过社群裂变、私域流量运营获取高额推广佣金，年入50万核心支柱。
  excerpt:
  - 特别感谢厦门斗猫网络李总，开启了淘宝客投资之路。
  - 3.淘宝客年入 50 万
- name: 可转债打新策略
  desc: 参与可转债上市首日无风险套利或打新配售，利用债券下行保护与转股期权价值，年化获利6-10万，属低风险确定性收益来源。
  excerpt:
  - 4.可转债打新收益年 6-10 万
- name: 股票经纪人佣金反佣模式
  desc: 作为股票经纪人（金融民工）通过发展客户交易量赚取佣金分成，年入12-20万，为早期积累本金与建立投资人脉提供支持。
  excerpt:
  - 1.股票经纪人年入 12-20 万
theorems:
- name: 实操性副业优于主观交易
  desc: 作者核心主张：除主观股票投资（不鼓励模仿）外，淘宝客、可转债打新、银行套利等项目均有标准化、可复制的实操办法，是普通人实现财务跃升的可靠路径。
  excerpt:
  - 除了股票项目不鼓励外，其他均有实操性办法
- name: 靠谱真诚积累商机
  desc: 长期主义人格特质（靠谱、真诚）是获取贵人相助、识别商机并具备承接挑战能力的内在基础，而非单纯技术分析能力。
  excerpt:
  - 也感谢自己，是多年的沉淀，学会了靠谱、真诚，才让我在一个个际遇中发现了商机，也有准备迎接挑战。
- name: 财务自由阈标：年净收益百万级
  desc: 作者隐性定义的财务自由标准：扣除大额消费（如买车位）后，年净收益稳定达到90万+，且拥有抗周期的多元化现金流结构。
  excerpt:
  - 2021 年开始疫情期间，年净收益接近百万。
  - 2021 年买了 24 万的车位后净收益 96 万，2022 年买了一个 38 万的车位后净收益 93 万
findings:
- name: 四年财务跃迁曲线
  desc: '[evidence] 作者个人财务数据呈现指数级增长：2019年负债19万 -> 2020年净赚22万 -> 2021年净赚96万（含24万消费）
    -> 2022年净赚93万（含38万消费） -> 2023年前几月净赚32万。验证了多渠道组合模式的有效性。'
  excerpt:
  - 2019 年还负债 19 万，2020 年净收益 22 万，2021 年买了 24 万的车位后净收益 96 万，2022 年买了一个 38 万的车位后净收益
    93 万，2023 年截止目前为止净收益 32 万
- name: 收入结构稳健性验证
  desc: '[evidence] 单一年份（2021/2022）净收益超90万，且明确列示四大确定性收入来源（经纪佣金12-20W + 淘宝客50W + 可转债6-10W
    + 银行套利）合计远超股票自营收益（20W），印证“除股票外均有实操办法”的抗风险结构。'
  excerpt:
  - 1.股票经纪人年入 12-20 万
  - 2.股票收益年入 20 万
  - 3.淘宝客年入 50 万
  - 4.可转债打新收益年 6-10 万
  - 四大行无风险套利项目
- name: 佣金流水规模佐证
  desc: '[evidence] 评论区用户“云端”提到看到“佣金 1.13 千万”截图，侧面印证作者作为经纪人/淘宝客推广者的业务体量巨大，支撑其高收入真实性。'
  excerpt:
  - '云端 : 看到了佣金 1.13 千万，先膜拜后看文'
