paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
desc: 该素材是一篇关于AI生成小说推文视频的实战复盘与教程，作者分享了从0到1跑通项目但最终因制作周期过长、难以矩阵化放弃的全过程。核心内容包括：AI推文赛道的现状分析（女频批量化
  vs 男频风格化）、工具链选择（Stable Diffusion本地/云部署、C站模型、逗哥配音）、核心制作方法论“一句话一图公式”（主角+细节+动作+背景）、提示词工程模板（万金油正反向词）、剪映关键帧动态化技巧、以及人物一致性控制方案（固定外貌特征词）。文末总结了纯原创风格化路线“耗时长、难规模、收益不稳定”的劣势，对比解压素材矩阵路线“效率高、收益稳”，为新手提供避坑指南。
concepts:
- name: AI小说推文
  desc: 利用AI绘图工具将小说文案转化为图文/视频形式，发布于短视频平台引流至小说阅读平台赚取推广佣金的项目形态。
  is_original: false
  excerpt:
  - 小说推文是我第一个下场入局的项目
  - 通过SD生成二次元画风的作品来无缝衔接之前积累的粉丝
- name: 风格化AI推文
  desc: 区别于批量化搬运女频文章或解压素材，强调文案原创、画面风格统一、人物形象固定、高代入感的差异化制作路线。
  is_original: true
  excerpt:
  - 所以依然决然走上一条复制性没有这么强的风格化道路
  - 文案+内容100%纯原创，可挂中视频，自己在创作的时候非常有成就感，观看的时候代入感也是满分
- name: 一句话一图公式
  desc: 将文案拆解为单句，每句对应生成一张图片的核心制作逻辑，前30秒严格执行，后期可放宽为一段话一图。
  is_original: true
  excerpt:
  - 开头的素材一句话一张，30秒过后的素材可以一段话一张
  - 我的公式是：一个主角+面部服装细节描写+动作+背景
- name: 万金油提示词预设
  desc: 一套通用的正向词（画质增强）和反向词（避坑畸变），适用于大多数人像生成场景，降低新手调参门槛。
  is_original: false
  excerpt:
  - 正面词：super detail, award winning, best quality, 16k, UHD,A perfect and delicate
    face
  - 反面词：lowres, bad anatomy, bad hands, text,error, missing fngers,extra digt ,fewer
    digits,cropped, wort quality ,low quality,normal quality, jpeg artifacts,signature,watermark,
    username, blurry, bad feet
- name: 人物一致性锚定法
  desc: 在不使用LoRA/ControlNet训练的前提下，通过在所有提示词中强制固定核心外貌特征词（如发色、瞳色）来维持角色跨图一致性。
  is_original: true
  excerpt:
  - 只需要预设好人物的细节特征，比如我心动重启的女主统一关键词都是暗红色眼睛+黑色头发
  - 一般面部细节统一大家看着才会有连续性
- name: 关键帧动态化
  desc: 在剪映中通过设置位置/缩放关键帧，使静态AI图产生镜头推拉摇移效果，避免PPT感，增强视频流动性。
  is_original: false
  excerpt:
  - 图片配上文字的末尾，往下拉一点再打上关键帧就能发现图片动起来了，不像ppt这么干吧
methods:
- name: __overview__
  desc: 风格化AI推文全流程制作方法论：文案创作/改写 -> SD文生图（公式化提示词+万金油预设+高清修复） -> 配音合成 -> 剪映剪辑（4:3比例+关键帧动画+音效/BGM）
    -> 发布变现。
  excerpt:
  - 音效+BGM+画面=引以为傲的作品
  - 打开我们的SD界面，按照我的设置来调试... 等图片生成后我们同步打开剪映添加关键帧
- name: 文案视觉化拆解法
  desc: 将自然语言文案按‘主角+面部服装细节+动作+背景’四要素结构化拆解，再翻译为英文Prompt输入SD生成对应画面。
  excerpt:
  - “你曾经有一个喜欢了你三年的女孩”=一个美女+漂亮的脸+校服+脸红+在桌上托腮+教室
  - 通过翻译软件翻译成英文=A beautiful woman , beautiful face , school uniform ,blush , chin
    on the table , classroom
- name: SD参数配置方案
  desc: 针对推文制作的SD具体参数设置：采用DDIM采样器，迭代步数20-30，CFG Scale 7，分辨率512x768（竖屏），开启High-res
    Fix（高清修复）二次放大提升细节。
  excerpt:
  - 基本开了高清修复四张图需要50秒左右
  - 我的显卡是3080ti基本开了高清修复四张图需要50秒左右
- name: 配音情绪适配策略
  desc: 根据文案类型选择匹配的音色与情绪标签，爽文类严禁使用‘失望’等低能量情绪，推荐‘云浩宇’等张力感强的音色。
  excerpt:
  - 声音用的云浩宇（对标魔音工坊的魔云熙）
  - 注意，爽文千万别用失望的情绪，配出来的完全没法听
theorems:
- name: 赛道分层生存法则
  desc: 女频推文（知乎/最右）适合‘改开头+批量矩阵’，男频推文（番茄/QQ阅读）需‘提炼精华+高成本制作’，风格化路线虽原创但难规模化，解压素材路线虽低俗但高变现确定性。
  excerpt:
  - 女频知乎、最右等平台的文章只要改个开头，所以适合批量化矩阵化操作
  - QQ阅读，番茄等男频平台需要提取精华...内容产出成本很高
  - 一个人一天可以产出好几十条作品，虽然是解压素材，但是赚的盆满钵满，月入十万有手就行
- name: 纯原创风格化的商业悖论
  desc: 100%原创的风格化AI推文虽具备版权优势、中视频资格与高代入感，但单条制作耗时8小时导致无法矩阵化，收益上限低且波动大，不适合全职依靠，仅适合副业。
  excerpt:
  - 优势：文案+内容100%纯原创，可挂中视频...代入感也是满分
  - 劣势：视频制作时间过长...无法矩阵化操作，收入有限...全职养活自己感觉不大行，但是兼职副业特别香
- name: 新手避坑核心原则
  desc: 不要因‘精神洁癖’过度打磨单条视频；优先验证跑通商业闭环；若无效率提升手段（如自动化工作流），应放弃高耗时风格化路线，转向标准化矩阵操作。
  excerpt:
  - 如果大家不和我一样有些对于作品的精神洁癖，不建议大家花这么久的时间做一条作品
  - 可以参考上期航海高手分享里面王微笑大佬的方式...月入十万有手就行
findings:
- name: 单条视频制作耗时量化
  desc: '[evidence] 作者实测：单条4分钟视频，文案+画面制作需接近8小时（SD生图4-6小时+剪辑配音2小时），3080Ti显卡生成4张高清修复图需50秒。'
  excerpt:
  - 基本一条四分钟视频光制作部分得花个4-6个小时
  - 一段四分钟的视频文案+画面我需要接近8个小时才能搞定
- name: 爆款案例复盘：《缩小灾变》
  desc: '[evidence] 自创开头文案（夸张化设定）+ SD生成画面+配音，发布于抖音/快手，单条最高播放20万+，验证了‘高概念设定+视觉化冲击’的选题有效性。'
  excerpt:
  - 此处分享一条抖音61w大爆款视频...目测县城一套房首付有了
  - 建议大家都去搜下，就可以看到我的开头文案完全是自己编的，可能是截取了前十章的精华+夸张后的效果
- name: 人物一致性低成本方案有效性
  desc: '[evidence] 无需训练LoRA，仅通过Prompt中固定‘暗红色眼睛+黑色头发’等核心特征词，即可在系列作品中维持主角视觉连续性，满足推文连载需求。'
  excerpt:
  - 只需要预设好人物的细节特征，比如我心动重启的女主统一关键词都是暗红色眼睛+黑色头发
  - 一般面部细节统一大家看着才会有连续性
- name: 云部署SD降低硬件门槛验证
  desc: '[claim] 作者宣称：无本地高配显卡可通过腾讯云部署SD（秋叶整合包），实测可行，但未给出云端成本与速度对比数据。'
  excerpt:
  - 如果电脑配置不高，也可以云部署...全网最简单的stable diffusion腾讯云部署教程，没有显卡照样玩转AI绘画
