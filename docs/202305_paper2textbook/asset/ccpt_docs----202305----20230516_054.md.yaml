paper: docs/202305/20230516_054.md
desc: 该素材是一份详尽的《平民开店手册「一」》，作者杨涛基于半年开设十余家实体店（含无人自习室、麻辣烫、棋牌室等）且实现首月盈利的实战经验，系统拆解了「无人值守自习室」从选址、装修、签约、运营到盈利模型的全流程标准化方案。核心主张为「消费力套利」——利用三四线城市消费支付意愿接近一二线、但房租人工成本远低的错位，通过「算好账」的投资回报模型、极简装修标准、私域流量运营及佛系管理，实现小成本（3-6万）、高确定性（半年回本、首年ROI
  200%+）的实体创业闭环。
concepts:
- name: 消费力套利
  desc: 核心商业逻辑：三四线城市用户对品质生活的心理价位与一二线持平（如瑞幸咖啡、台球单价无差异），但房租、人工成本显著更低，由此产生的价格剪刀差即为套利空间。
  is_original: true
  excerpt:
  - 我开店的逻辑有很多，最重要的一条，我装逼地把它叫做，「消费力套利」，起因是做社会实践的过程中发现一个很有意思的现象，就是三四线城市的休闲娱乐，生活消费往往不输一二线，但是人工和场地成本却远低于一二线城市
  - 人们对所谓「品质生活」的判定有着相差无几的标准，三两好友去吃个宵夜大排档，在舟山和在宁波，都要两百多，一杯瑞幸在广州和在中山，打台球，上网一小时在厦门和在龙岩，人们的心理价位，并没有太大的差别
- name: 无人值守自习室 3.0 模式
  desc: 全流程线上化、无人值守的运营模式：小程序选座/开门/断电，会员制私域，引入打扫志愿者用人力换时长，实现零人工成本运营。
  is_original: true
  excerpt:
  - 3.0 时代，无人值守自习室，全程线上安排，小程序安排座位，领取开门二维码，到点自动断电，会员群，无人值守，客户中选出打扫志愿者，用人力换自习时长，私域稳固
- name: 首年利润率公式
  desc: 创业决策的第一序列量化模型：首年利润率 = (月卡价格 × 座位数 × 85% × 12) / (全年房租 + 软硬件总成本)。租房前即可测算盈利预期。
  is_original: true
  excerpt:
  - 首年利润率=（月卡价格 x 座位数 x85%x12）/（全年房租+软硬件总成本）
  - 这个公式牢牢记在心里，基本上还没租房，你就能知道今年要赚多少钱咯
- name: 电影院选址法则
  desc: 唯一硬性选址指标：只开在电影院周边一公里内；无电影院则放弃。电影院代表成熟商业聚合能力与年轻客群聚集度。
  is_original: true
  excerpt:
  - 唯一法则，有电影院，只开在电影院周边一公里内，无电影院则 pass
- name: 超卖策略
  desc: 借鉴健身房逻辑，非固定座位制下按 2 倍座位数售卖月卡/次卡，通过线上预约系统平峰填谷，规避上座率焦虑，最大化单位面积产出。
  is_original: false
  excerpt:
  - 终究，我们还是卖卡为主，和健身房一个逻辑，非固定座位，你可以两倍超卖，线上预约，无惧上座率
- name: 佛系运营
  desc: 低控制、高容错的运营哲学：允许羊毛党薅羊毛造氛围、允许超时占座、依靠志愿者自治、用走心小技巧（上岸照片墙、早晚打卡送课时）建立情感连接，而非严格管控。
  is_original: true
  excerpt:
  - 佛系运营大法
  - 不要害怕羊毛党，就让他们占便宜，谁能拒绝一家经常可以占便宜的店铺呢
  - 比如，考研上岸的照片墙，打卡签字排行榜，早来晚走送学时...是吧，这些套路，很得人心
- name: 回本思维
  desc: 三四线城市投资人/房东普遍存在的决策心理：半年回本即为优质项目，极具诱惑力，可反向利用该心理进行招商或谈判。
  is_original: true
  excerpt:
  - 三线以下的城市，普遍有个很好很淳朴的观念，叫做「回本思维」，半年回本的项目，极具诱惑，可以开展招商或者培训等
methods:
- name: __overview__
  desc: 平民开店标准化全流程方法论：以「消费力套利」为战略指导，以「算好账」为决策锚点，通过「电影院选址法则」+「极简装修标准」+「谈判谈租技巧包」+「无人值守
    3.0 系统搭建」+「全卡品产品矩阵」+「私域/本地生活获客」+「佛系运营」构建低成本、高确定性、可复制的实体店开业体系。
  excerpt:
  - 基本上投资 3-6 万...就可以开一家 1-2 年内平均回报率百分两百的自习室
  - 从选好位置开始算，平均 10-15 天，这段时间，下边四条线一起跑，a，执照与开业物料， b，采购桌椅... c，装修， d，注册各种互联网平台账号并上线
- name: 城市筛选模型
  desc: 四步判断目标城市是否适合开店：1. 人口>200万且满足 公式：人口/5万 > 现有店数；2. 对标同省相似城市（人口/经济/高中数/星巴克数）横向对比；3.
    核考研人数、高中数量；4. 查美团闭店率及同行运营水平（评论维护、私域、推广意识）。
  excerpt:
  - 满足下边第一条则基本不亏本，满足下边越多条，则越赚钱
  - 人口数/5 万＞已有店数，即可，这是最保守的算法
  - 汕头 400 万人，佛山 400 万人，佛山 100 家自习室，汕头只有 2 家...那么，汕头，是不是机会？
- name: 选址实地踩盘 SOP
  desc: 双脚丈量商圈：1. 核心商圈筛选（电影院1km、麦肯选址参考、时尚业态聚集）；2. 交通全模拟（车/电动/地铁/步行全链路体感）；3. 户型筛选（大平层、方正无柱、5.5-6m纵深、高楼层、避开餐饮噪音/违建）；4.
    物业利益绑定（佣金、红包、尊重、解决梯控门禁）。
  excerpt:
  - 用双脚丈量你的江山，步行绕圈，用体感去品这个商圈的氛围
  - 必须模拟自己是个来自习的选手，从附近小区不行来自习，电动车来自习...将心比心，模拟全过程
  - 物业好不好说话...要和物业一条心，物业这块啊，是位卑权重，人要的甚至不是钱，是尊重
- name: 谈判签约组合拳
  desc: 租房谈判标准化话术与条款：波澜不惊看房只谈缺点、极限砍价后抛出半年付/月付筹码、争取免租装修期、房东配合证照办理、约定不涨租不卖房、留开票权作博弈筹码、偏好有钱强势房东抗衡物业。
  excerpt:
  - 看房时候要波澜不惊，装老手，只谈缺点
  - 砍价，尽情砍，技巧，砍死后，来一句，大哥我半年付，能不能再少两百
  - 争取月付，押二的，争取押一...您放空半个月，就能给我少两百每月了
  - 约定租期内别卖房，不涨租...整体框架是，「得寸进尺」
- name: 极简装修交付标准
  desc: 5-7天极速交付规范：手绘/酷家乐出图、包工包料包垃圾清运固定报价、地毯拼装化/椅子匚字型静音/小米AX6000穿墙王路由、结款按2:3:5或装完付费、家电家具小物件标准化清单（含消防/医疗/文具/零食全覆盖）。
  excerpt:
  - 固定的装修标准，工艺，工期，材料，品牌，材质，装修垃圾都包处理，包工包料，包干（无任何其他费用）
  - 熟练后我们 5-7 天可以装修完成一家店并投入运营
  - 椅子用那种匚字型的，静音小能手
  - 路由器，小米 ax6000 穿墙王，1000 块以下的极品
- name: 产品矩阵定价法
  desc: 覆盖全价格带产品线（次卡/小时卡/天/周/月/季/半年/年卡/固定卡/储值卡），长期卡命名营销化（如「必过冲刺卡」），座位少则减少短期卡筛选客群，定价向目标产品倾斜，规则由商家制定拒绝众口难调。
  excerpt:
  - 产品多样性覆盖整个价格带...月卡，可以命名术一下，变为，「必过冲刺卡」
  - 如果你这家店座位数比较少 , 那你就减少短期卡的设置 , 尽量多设置长期卡 , 筛选客户
  - 定价要在你希望客户购买的产品上多倾斜 , 规则是有我们制定的 , 不是客户想怎样就怎样
- name: 私域裂变获客体系
  desc: 美团/大众/小红书/抖音本地生活全铺货，评论区人工干预（甜声/补偿/差评应对），全流程引导加微信入群，招募小管家（送课时/专属团单）低成本维护卫生秩序，利用同行推广通教育市场、存量厮杀中靠综合成本优势实现赢家通吃。
  excerpt:
  - 美团的流程是，通过美团或者电话，引导加微信，然后发小程序给他操作选位置，并建立联系
  - 小管家的招募...多问一嘴...来做我们的小管家吧，给你送课时
  - 本地生活是流量密码，用好小红书，大众点评，美团，抖音等
  - 我们通过更低的综合成本（软硬件和获客）+互联网+私域+精细化运营，确保整体效率保持领先
theorems:
- name: 三四线城市实体创业确定性定理
  desc: 在三四线城市，依托「消费力套利」窗口期，采用标准化小店模型（3-6万投资、30-50座、无人值守、半年回本），普通人可实现高确定性盈利；核心变量可控性强：房租固定、无库存损耗、人力成本趋零、获客渠道红利期。
  excerpt:
  - 基本上投资 3-6 万...就可以开一家 1-2 年内平均回报率百分两百的自习室（我们要的是更高的确定性）
  - 理论上，除房租外，几乎没有循环成本，整体半年回本，首年回报率 30%以上，次年回报率 100%
  - 从业者很多是应届毕业生，在校大学生，稚嫩的互联网人...而抗打的老牌实体人，他们看不懂这个行业，这就是错位杀，开起来，就赚钱
- name: 自习室人群分层与需求映射定理
  desc: 自习室客群非单一考研群体，而是七大分层：全职考研（气氛组/旺季6-12月）、兼职考证/考公（各有周期）、佛系逃避型（高频长时/高客单/情绪价值）、休闲娱乐型（打游戏/刷剧/午休）、高中生（转介绍强/寒暑假峰值/拒绝打折）、富裕女性（高频消费/高客单）。运营需针对性设计产品与氛围。
  excerpt:
  - 全职自习：考研人群...考研人群是自习室的吉祥物，因为太卷了...是自习室天然的气氛组
  - 兼职自习人员，根据各种考试的时间，各有各的内卷周期
  - 佛系自习人群...逃避社会，不敢面对工作...蹉跎一天，然后夜里回家，对自己和家人都有个交代
  - 高考人群...都是转介绍王者...千万别给他们便宜，给一个人便宜，哦豁，全校都知道了
  - 讲真，她们老有钱了，一天两杯奶茶，中途出去购物一下，回来刷剧，自习，打王者
- name: 存量市场赢家通吃演进定理
  desc: 新兴业态早期为增量市场，同行推广即帮教育用户；中期进入存量厮杀，依靠「更低综合成本+互联网+私域+精细化运营」建立效率护城河，最终赢家通吃、卷死劣质同行；先发者通过私域沉淀实现用户资产护城河。
  excerpt:
  - 一个未成熟的市场，未养成的用户习惯，是需要所有同行一起去教育和培养的，而我，总觉得同行每花出去的一份推广通，就是在帮我培养客户啊
  - 不客气的说，我们介入之前，不太抗打的同城同行都是在帮我们养客户，只要客户来过我们这一次，都会拖着之前的同学来的
  - 这事儿，某种意义上是存量厮杀，赢家通吃，最终会卷死，而，综上所述，我们通过更低的综合成本...确保整体效率保持领先，以期做大做强，做久做长
findings:
- name: 龙岩自习室实盘回测数据
  desc: '[evidence] 作者实测龙岩店（50座、月卡500元、年租金约10万、软硬件成本含首年）：首年收入25.5万（含85%折损），成本10万，首年利润率255%；次年无装修成本，利润率跃升至638%。验证了首年利润率公式有效性。'
  excerpt:
  - 举个例子，龙岩，低估单价，多算了成本，超卖的和空置抵消，按运营水平中等，再打个八五折， 首年，50 个座位的店，按月卡 500 来算，5005012*85%=255000/100000=255%，
    首年之后，就是 5005012*85%=255000/40000=638%
- name: 汕头vs佛山城市对标验证
  desc: '[evidence] 对比同省同量级城市：佛山400万人口有100家自习室，汕头同量级仅2家，且经济/高中/星巴克/电影院数量相当，推断汕头为典型蓝海机会城市，验证了「城市筛选模型」横向对比法有效性。'
  excerpt:
  - 汕头 400 万人，佛山 400 万人，佛山 100 家自习室，汕头只有 2 家，两个城市经济差不多，高中数量差不多，电影院和星巴克的数量都差不多，那么，汕头，是不是机会？嗯嗯
- name: 物业利益绑定降维打击案例
  desc: '[evidence] 作者二店装修产生大量垃圾，物业经理仅收100元即调动4保安搞定；后续装修、营业、应急均获物业系统（保洁/水电/保安/经理）全方位配合。验证「物业位卑权重、利益绑定>对抗」的社会学洞察。'
  excerpt:
  - 想当初，我二店装修，敲墙了啊，海量的装修垃圾，那个叫王燕楠的胖经理，颤巍巍的喊来了 4 个保安，一百块啊，就一百块，给我搞定了
  - 搞定了物业，就是搞定了一整个利益群体，包括保洁，水电工，保安，物业经理，相关人员在内的利益集团啊
- name: 佛系运营羊毛党造势效应
  desc: '[claim] 作者主张主动容忍羊毛党占便宜（超时不走、薅免费时长），认为其能营造满座氛围、吸引真付费用户、形成「买3小时学8小时」感知价值，且素质普遍高不易失控；未给出负面案例数据支撑。'
  excerpt:
  - 我们就算桌位断电了，对方还是可以不走的，我们巴不得这种人多点，营造气氛，人家还会觉得买 3 个小时可以学 8 个小时，我们无所谓的
  - 等到真的满座的时候...监控是有语音播报功能的...（放心啦，会来自习的，素质普遍高，没问题的）
- name: 小管家志愿者替代保洁员验证
  desc: '[evidence] 从会员中招募「小管家」（送课时/专属团单），承担日常巡查、卫生、秩序维护；配合同楼层酒店保洁阿姨（10元/天带走垃圾），实现零人工成本运营闭环。'
  excerpt:
  - 小管家的招募...来做我们的小管家吧，给你送课时，还有就是可以在美团团单上单独开一个小管家专用团单
  - 保洁阿姨基本能在同楼的酒店找到，便宜得很，10 元/天算高了，因为就是日常看一遍，带走垃圾袋
- name: 副业可行性与规模化临界点
  desc: '[claim] 作者宣称操作上可甩手（仅需本地应急联系人/志愿者处理微小概率故障），心态上可做副业赚钱，亦可主业做连锁占领城市；收益完全支持全职化。未披露多店管理协同成本数据。'
  excerpt:
  - 操作上来看，必须能，本身讲的就是无人值守自习室，全自动运营，只需当地有一个关系户...处理一些停电，跳闸，门锁故障等微小概率事件
  - 如果想开连锁，做大做强，占领某一个城市，那么它的收益也完全能支持你当主业做
