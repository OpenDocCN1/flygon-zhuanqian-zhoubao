- 'no': 4
  name: AI 内容自动化流水线 —— 从“会用工具”到“建流水线”的范式跃迁
  points:
  - '**为什么需要这个概念？**'
  - '- 单纯会用 ChatGPT/MJ/SD 不赚钱，AI 只是放大器而非救世主'
  - '- 核心竞争力在于：提示词工程 + 业务流程拆解 + 自动化串联（RPA/代码/低代码）'
  - '- AI 降低了“从 0 到 1”的技能门槛，但提高了“从 1 到 N”的标准化要求'
  - '**核心定义**'
  - '- 结合 ChatGPT（文本生成）、Midjourney/SD（图像生成）、RPA/自动化工具（剪映、Coze、Make/Zapier），构建从选题、生产、发布到数据反馈的全自动化内容生产系统'
  - '- 覆盖短剧解说、表情包、数字人、SEO 文章、电商图、IP 形象等场景'
  - '**关键性质**'
  - '- ChatGPT+RPA 文案自动化 13 步法：将创作拆解为 13 个结构化提示词节点（选题、大纲、钩子、正文、标题、标签等），配合 RPA 实现批量生成、定时发布、数据回收无人值守'
  - '- SD 云端零成本批量出图：利用 Google Colab 免费 GPU 部署 SD WebUI (A1111/ComfyUI)，配合模型下载脚本、API
    调用、定时任务，无需本地显卡、无限时长、可编程'
  - '- 结构化提示词模板法：五段式公式 [质量词+主体+细节+服饰+环境] + 权重语法 (词:权重) + 万金油正反向词预设'
  - '- Temperature 差异化策略：带货文案 0.3-0.7（保守连贯），创意文案 0.9（发散），批量设定不同值生成多版本供筛选'
  - '- 人物一致性锚定法：无 LoRA 条件下强制固定核心外貌特征词（发色/瞳色/服饰），维持跨图角色视觉连续性'
  - '**典型例子**'
  - '- 惟乔：短剧 CPS 解说模式，ChatGPT 写文案 + 剪映 TTS 配音 + 剪映模板智能剪辑，单人日更 10 条+，首月 1.4 万收益'
  - '- 月林：AI 公众号法律写作，人工筛选高点击标题库 → GPT-4.0 批量生成全文 → 双号并行，30 分钟产 8 篇，日均 300 元收益'
  - '- 作者：AI 表情包批量生成 → 微信开放平台上架（赞赏收益极低） → 教程钩子引流小红书群聊 → 小号留微信入私域 → 售课/定制/分销变现'
  - '**边界条件**'
  - '- 手动跑通是自动化前提：任何 RPA 项目成功前提是手动 SOP 已跑通验证可行；自动化解决规模化（1 到 100）而非验证可行性（0 到 1）'
  - '- 工具组合替代单一平台依赖：组合专用小工具（热点宝选品、轻抖提取、超级写手生成、一帧秒创视频、RPA 分发）构建最优链路'
  - '- 素材为王投流为辅：高点击低转化素材必换原则，投流只能放大优质素材无法拯救烂素材'
  - '- 平台风控红利期有窗口期：快进快出榨取价值（废号轮播）而非硬刚平台（蓝 V 认证/开小店交保证金）'
