  name: 海外 Mediabuy 与独立站 B2B —— 汇率杠杆下的单人美元项目
  points:
  - '**为什么需要这个概念？**'
  - '- 国内流量红见顶、竞争内卷，海外市场汇率杠杆（7 倍）、高客单价、低竞争强度形成结构性机会'
  - '- 单人/小团队缺乏外贸经验/英语/合规/收款渠道，需最小闭环验证路径'
  - '- 核心模式：联盟营销、品牌词竞价、独立站 B2B 询盘成交，均属轻资产、高利润、可复制'
  - '**核心定义**'
  - '- Mediabuy Brand Bid：利用 Google Ads 竞价商家品牌词（CPC 近 0.01 当地货币）直链联盟追踪链接，CPC<EPC 即稳赚，三组实盘
    ROI 359%-496%，港币账户成本再降 7 倍，单人年净利破百万“非常轻松”'
  - '- 独立站 B2B 冷启动：细分 Niche 选品 → 独立站搭建 → 内容 SEO/社媒矩阵获客 → 询盘跟进/报价/成交 → 收款 → 复购/转介绍，25
    天成交 $4551.7，100% 毛利'
  - '- 跨境私域最小闭环：IG+FB 广告引流 → WhatsApp 聊单 → 代购人设降低防备 → SPIN 简化版四步聊单 → B 端挖掘复购，7 天首单
    $2000+，有效对话成本 ≤$5'
  - '**关键性质**'
  - '- 品牌词近零成本定理：质量得分满分、无竞争、CPC→0，商家授权光谱三层级（显性允许/默许/允许竞品词），项目可行性建立在“总能找到允许竞价的大品牌 Offer”市场现实上'
  - '- 内容为王技术为辅：Google 算法已足够智能，唯有持续输出高质量专业博客文章是核心；外链建设/过度技术优化属低 ROI 行为'
  - '- FB 账号资产与广告资产分离：企业户授权个人户抗封体系，核心资产沉淀在个人号/WhatsApp/INS 私域好友，广告账户/主页视为可消耗耗材'
  - '- 代购/中间商人设：天然站在“帮客户省钱/避坑”一方，非卖家身份消除推销对抗感，更易成交高客单，成交后自然转型“全品类采购顾问”赚差价'
  - '- Wise 推荐计划同构验证：品牌词低价竞价赚取固定佣金，单日佣金破万英镑，即时结算、无扣量风险'
  - '**典型例子**'
  - '- M0hMdjWj3o8WtNxZdv4cLnfenIh：三组真实账户数据验证 ROI 359%-496%，模式运行十余年非短期漏洞'
  - '- VILid7sleoZ6puxkchxcRM9vn6g：25 天成交法国 B 端订单 $4551.7，留钩子成交法（预判需求主动提供测试文件）锁单'
  - '- Nt9IdI0b0okp1MxGKBacQtxSn3e：一人即公司（1 部手机+1 张 HK 卡+1 台电脑+1 套 FB 账号体系），减法启动无备货/建站/复杂物流'
  - '**边界条件**'
  - '- 门槛在于英语/工具/合规/收款渠道：Wise/Payoneer 实名、香港/美国银行卡、企业户授权体系是基建'
  - '- 平台风控：FB 广告账户易封需企业户授权隔离，Google Ads 需规避品牌词授权红线'
  - '- 物流成本参数：欧美正常单票物流费 $100-300 为定价提供关键成本锚点'
  - '- 品牌词竞价非全违规：需筛选允许竞价的大品牌 Offer，Awin 等联盟双周支付保障现金流安全'
