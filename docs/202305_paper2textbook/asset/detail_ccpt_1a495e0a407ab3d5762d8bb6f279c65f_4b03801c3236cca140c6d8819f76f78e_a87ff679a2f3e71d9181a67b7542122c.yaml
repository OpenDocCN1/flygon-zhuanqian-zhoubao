  excerpts:
  - 五大细分创新方向与养狗人群年龄红利：家政、睡眠、旅游、电商、宠物的百亿级蓝海
  - 披露养狗人均龄37岁、宠物狗3000万vs新生儿1000万的人口学红利，规划中老年养宠/家政/助眠/旅拍/电商全产业链切入点。
  - 我调研下来，养狗人平均年龄基本上比养猫人的平均年龄大 10 岁，养狗人的平均年龄在 37 岁左右...那么可想而知，中老年养宠物的人应该很多，其中我觉得应该养狗的更多。
  - 之前看的报告，全中国每年新生儿 1000 万左右，宠物猫五千万，宠物狗也三千万左右了。
  - 毕竟人年龄大了后更有钱和时间来为自己的兴趣买单！...书画类用户，每年要消费 2000 左右在笔墨纸砚和印章上。如果是艾灸方向涉及健康的，客单价更高。
