units:
- 'no': 1
  name: 生财小航海 —— 普通人0-1跨越的“强制执行容器”
  points:
  - '**为什么需要这个概念？**'
  - '- 大多数人陷入“知道很多道理，却过不好这一生”的执行鸿沟'
  - '- 缺乏外部约束导致拖延、完美主义、害怕试错，无法跑通商业闭环'
  - '- 需要一个低成本、高确定性的训练场，将模糊意愿转化为确定性行动'
  - '**核心定义**'
  - '- 社群发起的项目制训练营模式：设定明确目标、时间节点、导师陪跑、同伴监督'
  - '- 核心机制：截止节点倒逼交付 + 公开承诺产生社会压力 + 导师点评修正认知 + 复盘迭代固化经验'
  - '- 产出标准：跑通 0-1 最小商业闭环（有流量入口、有转化动作、有真实收款）'
  - '**关键性质**'
  - '- 强制性：利用外部结构（时间、规则、群体）对抗人性惰性'
  - '- 标准化：提供 SOP、选品库、话术库、工具包，降低“从0到1”的认知负荷'
  - '- 低风险：项目筛选模型保证“正向现金流快、无需囤货、可标准化、有公域获客路径、后端有高客单产品”'
  - '- 复利性：单周期产出可复用的 SOP、账号资产、私域用户、认知模型'
  - '**典型例子**'
  - '- 圈友 CBJhdD0dTokH8tx8HKYc1nJSnnc：跟随 AI 资料变现航海，应届生两周变现 7000 元，完成“加群→买号→调教→分销→写教程→办训练营→建星球→账号分销”全链路'
  - '- 圈友 Gn5NdifvBorUbdxvGl6ceQgXnpg：从“小透明”观望一年，参加航海后利用“精华帖逆向拆解法”组装项目，一年实现年入 200
    万'
  - '- 圈友 DGw1dYHSsohHu7x1AXhc4cQVnEN：投入 8 元域名成本，模仿竞品搭建视频定制站，一个月赚 2 万+，验证“低成本 MVP
    验证”有效性'
  - '**边界条件**'
  - '- 仅适用于“执行力不足、认知模糊、缺乏项目经验”的新手阶段，已跑通闭环的老手需转向“规模化放大”方法论'
  - '- 必须严格执行“项目筛选六大标准”，盲目跟随高门槛项目（如重供应链、长周期、高合规）会导致中途崩盘'
  - '- 航海是“外部约束容器”，核心价值在“跑通闭环”，而非“学会知识”；毕业后若无自律体系，极易回落'
