  name: 排版黄金参数标准 —— 阅读体验的‘工业化规格书’
  points:
  - '**为什么需要这个概念？**'
  - '- 排版混乱直接导致完读率暴跌、转发率归零、粉丝流失'
  - '- 缺乏统一标准导致协作混乱、品牌视觉无记忆点'
  - '- 移动端阅读场景对字号/行距/缩进极其敏感'
  - '**核心定义**'
  - '- 硬性参数：正文15号字、两端缩进8、字间距1、行间距1.75'
  - '- 结构五段式：封面统一风格 + 头图强IP + 标题分割标识 + 插图控节奏 + 底图引互动'
  - '- 色系统一：全文建立账号主题色，图片风格/配色/字体高度统一'
  - '**关键性质**'
  - '- 15号字兼顾阅读舒适度与单屏信息密度的黄金平衡点'
  - '- 行间距1.75消除移动端拥挤感，显著提升完读率'
  - '- 统一视觉风格 = 专业信任感 = 更高广告报价与转化率'
  - '**典型例子**'
  - '- 木子田PPT IP：统一封面大字报风格后主页转粉率从个位数提升至10%+'
  - '- 作者账号确立主题色后，粉丝形成‘看到这色系就知道是你’的品牌认知'
  - '**边界条件**'
  - '- 过度设计(花哨动效/多字体/乱配色)反而破坏阅读沉浸感'
  - '- 图片宽度必须适配微信编辑器自适应，避免两侧留白或溢出'
  - '- 代码块/长图/视频等特殊元素需单独制定排版规范'
