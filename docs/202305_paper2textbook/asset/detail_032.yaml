- 'no': 8
  name: 外部引流‘找车/上车’成本控制法 —— 付费投放的‘记账复盘’铁律
  points:
  - '**为什么需要这个概念？**'
  - '- 公域付费投放(小红书/抖音/知乎)成本不透明、效果波动大、易被坑'
  - '- 无记录无复盘 = 盲目烧钱，无法沉淀高ROI投放经验'
  - '- 必须建立‘找车(自找博主) > 上车(拼车)’的优先级执行原则'
  - '**核心定义**'
  - '- 建立引流记录表：记录单车成本、涨粉数、单粉成本、阅读带动比'
  - '- 找车优先：自找博主占首位宣传位、成本可控、数据真实'
  - '- 上车次之：拼车按位置分价、尾部位置性价比低、易遇‘刷量车’'
  - '- 数据复盘：筛选高ROI博主类型，建立‘白名单投放库’'
  - '**关键性质**'
  - '- 成本控制核心：单粉成本 = 核心KPI，而非单纯涨粉数'
  - '- 阅读带动比 = 引流带来的自然阅读增量 / 投放成本，衡量流量质量'
  - '- 执行纪律：每车必记、周复盘、月清洗低ROI渠道'
  - '**典型例子**'
  - '- 作者通过表格复盘发现：按百阅5-8元计价的征稿号性价比 > 一口价大号'
  - '- 同量级互推免费且精准，但前提是自身已有基础数据(阅读/粉丝)'
  - '**边界条件**'
  - '- 联合红包抽奖虽涨粉快但违规风险高、泛粉多、后续转化极低'
  - '- 社群/星球引流粉丝质量高但量少、运营成本高，不适合冷启动期'
  - '- 新号无数据无法互推，必须先跑通‘自找车’积累初始数据资产'
  sources:
  - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
    role: origin
  excerpts:
  - 引流记录是用来干嘛的？第一，我们找车、上车会产生一定费用，需要表格记录来控制我们的上车成本；第二，我们需要根据表格记录上车的效果，来根据数据分析上哪些类型的账号效果更好
  - 自己找“车”，相当于自己找博主，可以免费占据第一个宣传位。“上车”“找车”部分有号主圈自己的规则...几个号主一起到公域宣传的动作就是“上车”
- 'no': 9
  name: 社群分层运营体系 —— 私域流量的‘蓄水池/执行层/转化池’三层架构
  points:
  - '**为什么需要这个概念？**'
  - '- 将所有用户扔进一个大群 = 广告刷屏、有效信息沉底、信任崩塌、转化为零'
  - '- 不同深度用户需求完全不同：泛连接/协作执行/深度成长'
  - '- 必须按参与深度分层，实现分级运营、精准触达'
  - '**核心定义**'
  - '- L1 读者群：大容量、弱连接、蓄水池、日常通知/福利分发/氛围维护'
  - '- L2 任务/兼职群：中容量、强协作、外包执行层(征稿/改稿/排版/引流)'
  - '- L3 打卡/自律群：小容量、高粘性、高客单价转化前置池(课程/社群/咨询)'
  - '**关键性质**'
  - '- 用户可跨层流动：读者群活跃/产出 → 邀入任务群 → 成交高客单 → 升级打卡群'
  - '- 群规模与运营成本反比：大群靠规则自治，小群靠高频服务'
  - '- 每层群对应不同变现产品：读者群→广告/CPA，任务群→低价资料/工具，打卡群→高价课程/咨询'
  - '**典型例子**'
  - '- 作者建立‘任务兼职群’外包征稿/排版/引流，实现‘用钱买时间换体量’'
  - '- ‘打卡群’成员高频互动、高信任度，直接转化‘失重限期’式高客单课程'
  - '**边界条件**'
  - '- 规则先行原则：入群前必须设定准入门槛/发言规范/违规处罚/活动节奏'
  - '- 规则越细致，运营介入成本越低，混乱概率越小，信任感越强'
  - '- 严禁在读者群硬广推销，严禁任务群讨论无关闲聊，严禁打卡群灌水'
  sources:
  - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
    role: origin
  excerpts:
  - 1、读者群 2、任务兼职群 3、打卡群...我们做社群的目的就是为了拉近和粉丝的距离，提高粉丝粘性，或者让粉丝参与到公众号的运营中来
  - 社群运营最重要的，就是自己制定好社群规则，规则制定好了，就能少出现社群混乱的现象。
- 'no': 10
  name: 个人IP强标签 —— 让用户‘一提到X就想到你，一提到你就想到X’
  points:
  - '**为什么需要这个概念？**'
  - '- 无标签 = 无记忆点 = 无溢价 = 无复购 = 纯流量贩子'
  - '- 强标签是突破广告报价天花板、解锁高客单价变现的核心杠杆'
  - '- 只有‘可被瞬间联想的关键词’才能建立认知护城河'
  - '**核心定义**'
  - '- 基于账号定位提炼的核心人设关键词(如‘自律、搞钱狂魔’)'
  - '- 通过高频人设文输出建立：总述版画像(总) + 分项深度展开(分)'
  - '- 标准：一提到人想到特质，一提到特质想到人'
  - '**关键性质**'
  - '- 认知护城河：降低用户决策成本，直接提升广告溢价与产品转化率'
  - '- 内容生产指南针：所有内容围绕强标签展开，拒绝偏离定位的‘流量贪婪’'
  - '- 商业资产化：强标签账号可估值、可转让、可授权、可矩阵化复制'
  - '**典型例子**'
  - '- ‘失重限期’彩卉：强标签‘女性成长/自律/搞钱’，7w粉实现广告+课程双变现'
  - '- 对比‘某可复制情感号’：无强标签、纯引流、8w粉仅靠广告/CPA、变现上限封死'
  - '**边界条件**'
  - '- 标签必须真实源于创作者经历/优势，虚构人设必翻车(如‘假大款/假专家’)'
  - '- 早期内容垂直度要求极高：发非垂直内容(日常/染发)数据极差、算法打标偏移'
  - '- 强标签建立需长周期：作者建议‘总分结构’系统性输出人设文，而非零碎碎片'
  sources:
  - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
    role: origin
  excerpts:
  - 只要一提起你，就会让人想到这个强标签...你一提到这个人，就能想起他的特质，或者一提到这个特质，就能想到这个人，这就是我们打强标签的意义
  - 我们打造人设的一个思路：从总到分。首先有一篇对你个人特点进行概括的文章...再去抓取我们想要展示的鲜明特点，对应写针对特点的详细文章
- 'no': 11
  name: 变现四阶梯进阶定律 —— 公众号商业化的‘技能点依次点满’铁律
  points:
  - '**为什么需要这个概念？**'
  - '- 新手妄想跨级变现(如刚起号就想卖课)，必死无疑'
  - '- 不同阶段核心能力、资源需求、风险容错完全不同'
  - '- 必须明确当前所处阶段，集中资源攻克当阶段关键指标'
  - '**核心定义**'
  - '- L1：阅读200-300 → 接直投广告(引流即可，IP锦上添花)'
  - '- L2：日增100粉 → 接CPA广告(引流即可，IP锦上添花)'
  - '- L3：强IP → 分销他人产品赚佣金(需强IP，不可跨级)'
  - '- L4：强IP → 售卖自有课程/社群(需强IP，终局形态)'
  - '**关键性质**'
  - '- 阶梯锁死顺序：技能点必须依次点满，不可跳级(如L1直接上L3必翻车)'
  - '- 前两阶段(L1/L2)核心能力是‘引流’，IP仅为锦上添花'
  - '- 后两阶段(L3/L4)核心能力是‘IP/信任’，引流仅为前置条件'
  - '- IP强弱不影响L1/L2广告收入上限，但决定能否跨越至L3/L4'
  - '**典型例子**'
  - '- ‘某可复制情感号’：卡在L2，8w粉、千阅、月入四五位数，纯广告/CPA，无IP无法进阶'
  - '- ‘失重限期’：跨越L3/L4，7w粉、均阅1300+、广告0.5-0.7元/阅，解锁课程社群变现'
  - '**边界条件**'
  - '- L1/L2门槛低、上限低、抗风险弱(平台规则变动/广告主减预算即死)'
  - '- L3/L4门槛高(需强IP/标准化交付/售后体系)，但上限高、复利强、抗风险'
  - '- 判断‘强IP’标准：粉丝购买概率高(3000粉产30单 vs 1万粉产5单)'
  sources:
  - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
    role: origin
  excerpts:
