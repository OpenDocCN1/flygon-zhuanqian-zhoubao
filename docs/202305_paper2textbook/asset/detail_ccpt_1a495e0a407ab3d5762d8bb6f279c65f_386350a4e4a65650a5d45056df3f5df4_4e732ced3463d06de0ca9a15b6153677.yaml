  - 4.2 商城诚搜索流量：优化标题关键词/属性填写/类目精准/评价管理
  - 4.3 笔记推荐流量：矩阵号布局长尾词SEO截流+爆款笔记投流放大(薯条/薯店推广)获取推荐流量
  - 4.4 笔记搜索流量：关键词全链路植入(标题/封面水印/文案开头正文/话题标签≤5个)，搜索流量长尾复利>推荐脉冲
  - 搜索冷启动刷量战术：小号/亲友搜关键词->筛最新->定位笔记->全套互动行为
  - 双引擎流量策略：主攻笔记推荐/搜索，商城搜推为辅，形成‘种草-拔草’闭环
  - SEO长尾复利>推荐流量脉冲：搜索流量可持续半年以上，长期主义必须以SEO布局为核心
