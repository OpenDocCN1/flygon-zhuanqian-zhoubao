learning_targets:
- 掌握小红书复制爆款起号法的核心逻辑与实操标准
- 熟练执行养号-标签化机制，实现账号冷启动精准打标
- 能够完成对标账号业务路径拆解，逆向获取商业闭环模板
- 建立AI伪原创双阶段Prompt工作流，实现内容工业化量产
- 掌握表格封面合集化制作技巧，零设计门槛产出高点击封面
- 理解并执行小红书SEO蓝海词策略，布局长尾精准搜索流量
- 掌握表情包话术与互关拉群两套安全引流组合拳技术方案
- 建立矩阵化横向复制模型，将个人经验转化为组织级SOP资产
concept_map:
- 第20章：小红书职称赛道实战体系
- ├── 冷启动体系
- │   ├── 复制爆款起号法  —— 爆款基因可迁移定律 P001
- │   ├── 养号-标签化机制    —— 账号标签先于内容分发原则 P002
- │   ├── 对标账号业务路径拆解  —— 实战逆向工程 P003
- │   └── 前5篇非营销保护期红线  —— 起号存活率关键约束 P001
- ├── 内容量产体系
- │   ├── AI伪原创工作流  —— 双阶段Prompt工程 P004
- │   ├── 表格封面合集化  —— 零设计门槛高转化范式 P005
- │   ├── 数据驱动标题套用法  —— 拒绝AI生成标题 P004
- │   └── 素材库建设SOP  —— 爆款笔记挖掘与提取法 P001
- ├── 流量获取体系
- │   ├── 小红书SEO蓝海词策略  —— 小众赛道SEO高于推荐流量价值定理 P006
- │   ├── 布局式SEO执行战术  —— 无视数据只占坑 P006
- │   ├── 关键词全景梳理与挖掘  —— 三维交叉验证 P006
- │   └── 零互动笔记精准获客  —— 搜索流量商业价值验证 P006
- ├── 安全引流体系
- │   ├── 表情包话术规避违规  —— 引流风控对抗：形式大于内容原则 P007
