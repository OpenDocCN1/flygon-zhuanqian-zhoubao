learning_targets:
- 理解股债性价比作为单一核心择时指标的理论支撑与计算逻辑
- 掌握系统性行情与结构性行情的识别方法及其对仓位策略的指导意义
- 熟练运用“三好选基法”（好公司、好经理、好体系）完成主动权益基金的标准化筛选
- 建立择时干扰项清单，学会忽略宏观数据、突发事件与情绪观察对决策的干扰
- 确立普通投资者生存法则：仅在系统性底部重仓，其余时间小仓位或空仓，博取确定性贝塔收益
concept_map:
- 投资择时与选品体系
- ├── 核心择时指标：股债性价比
- │   ├── 定义：(1/PE_TTM) ÷ 十年国债收益率  —— P001
- │   ├── 区间：长期 1.5~3.0 波动  —— P001
- │   ├── 阈值：>3.0 买入区、<1.5 卖出区  —— P001
- │   └── 辅助确认：技术分析验证高位拐点  —— P001
- ├── 行情分类识别
- │   ├── 系统性底部/顶部：四风格估值一致性  —— P002
- │   ├── 结构性底部/顶部：四风格估值分化  —— P002
- │   └── 普通人策略：仅参与系统性行情  —— P005
- ├── 基金筛选漏斗：三好标准
- │   ├── 好公司：六维定性评估  —— P003
- │   ├── 好经理：三大硬指标（业绩/投决委/金牛奖）  —— P003
- │   └── 好体系：规模否决权（只买<50亿，最优<20亿）  —— P003
- ├── 认知减法：干扰项清单
- │   ├── 突发事件/地缘/外盘：事后调仓性价比低  —— P004
- │   ├── 宏观数据（财政/货币/M2/社融）：远期影响已定价于无风险利率  —— P004
- │   └── 情绪观察：样本小、不可量化、成功率无保障  —— P004
- └── 普通投资者生存法则
- '    ├── 判定标准：历史年化<25%  —— P005'
- '    ├── 执行铁律：仅系统性底部重仓  —— P005'
- '    ├── 仓位管理：满仓周期短、空仓周期长  —— P005'
- '    └── 产品选择：宽基/小规模主动基金  —— P005'
life_analogy:
- 想象投资像**在菜市场买菜**：
- '- **股债性价比** = **“菜价指数”**：告诉你现在的菜价（股票收益率）相对于大米价格（无风险收益率）是贵还是便宜'
- '- **>3.0（买入区）** = **“白菜价”**：全市场菜都便宜（系统性底部），闭眼买都不亏'
- '- **<1.5（卖出区）** = **“天价菜”**：全市场菜都贵（系统性顶部），赶紧卖手里囤的菜换现金'
- '- **1.5~3.0（常态区）** = **“正常菜价”**：有的菜贵有的便宜（结构性行情），挑便宜的买需要专业眼光（选风格），外行易买贵'
- '- **技术分析** = **“看菜贩子收摊不收摊”**：菜价已到天价但菜贩子还不收摊（趋势未破），再等等；收摊走人了（跌破趋势线），确认顶部立刻跑'
- '- **三好选基法** = **“选买菜达人帮你买”**：选有名气的大摊主（好公司）、拿过“最佳买手奖”的达人（好经理/金牛奖）、且手头订单不多、采购灵活的小团队（好体系/小规模）'
- '- **忽略宏观/新闻/情绪** = **“不看天气预报、不听大妈闲聊、不理会‘今天菜涨价了’的传言”**：这些只影响当天心情，不改变“菜价指数”反映的长期规律'
- 就像买菜要看“菜价指数”决定买不买、买多少，投资也要看“股债性价比”决定仓位，其余噪音全屏蔽。
summary:
- concept: 股债性价比
  desc: 核心择时锚：(1/PE_TTM)÷十年国债收益率，>3.0重仓，<1.5清仓，长期在1.5-3.0波动
- concept: 系统性底部
  desc: 四大风格象限估值同时处于历史低位，买什么都赚，普通人重仓良机
- concept: 结构性底部
  desc: 风格估值分化（如大盘便宜小盘贵），仅适合专业选手精准选品，普通人小仓位
- concept: 三好选基法
  desc: 好公司(六维)+好经理(三硬指标)+好体系(规模<50亿铁律)，小规模享换仓/打新/迷你股三大优势
- concept: 择时干扰项清单
  desc: 忽略突发事件(事后性价比低)、宏观数据(远期已定价于无风险利率)、情绪观察(样本小不可量化)
- concept: 技术分析辅助角色
  desc: 仅在估值极端区(接近1.5)确认趋势反转(跌破长周期均线)，解决顶部具体数值不可知问题
- concept: 普通投资者生存法则
  desc: 历史年化<25%者，仅等系统性底部(股债性价比>3.0且四风格全便宜)重仓宽基/优质主动基金，其余时间小仓位或空仓
- concept: 小规模基金超额收益源泉
  desc: 换仓摩擦成本低、独享打新超额收益、可参与流动性差的迷你股交易，规模扩大必然收益递减
- concept: 宏观数据无效论
  desc: 财政/货币/M2/社融仅影响日内波动，中长期影响已完全体现在十年国债收益率(股债性价比分母)中
- concept: 作者实盘复盘
  desc: 2015/2018/2021三逃顶、2015/2018/2019三抄底，择时准确率100%，连续十年正收益，验证体系有效性
exercises:
- 'no': 1
  title: 手算一次股债性价比与择时决策
  contents:
  - 给定某日沪深300 PE_TTM = 10.0，十年国债收益率 = 3.0%：
  - 1. 计算沪深300股债性价比
  - 2. 判断当前处于买入区(>3.0)、常态区(1.5-3.0)还是卖出区(<1.5)
  - 3. 若此时四大风格象限估值分位点分别为：大盘成长5%、大盘价值8%、小盘成长12%、小盘价值6%，判断是系统性底部还是结构性底部
  - 4. 根据普通投资者生存法则，给出仓位建议（重仓/小仓位/空仓）
  - 回答问题：
  - '- 为什么十年国债收益率上升会导致股债性价比下降？这对仓位意味着什么？'
  - '- 如果PE_TTM分子用的是预测盈利而非滚动盈利，指标会有什么风险？'
- 'no': 2
  title: 基金筛选实战演练
  contents:
  - 某基金公司旗下有基金经理A、B、C三人，数据如下：
  - 经理A：管理规模180亿，近3年业绩排名前10%，投决委成员，有1座金牛奖
  - 经理B：管理规模15亿，近3年业绩排名前5%，非投决委成员，有2座金牛奖
  - 经理C：管理规模8亿，近3年业绩排名前30%，投决委成员，无金牛奖
  - 公司整体：剔除货币基金管理规模行业前三，高管为投研出身，人才梯队完善，口碑良好，价值观长期主义
  - 任务：
  - 1. 判断该公司是否属于“好公司”
  - 2. 对三位经理分别应用“好经理”三硬指标打分（通过/不通过）
  - 3. 结合“好体系”规模铁律，筛选出符合“三好标准”可买入的基金
  - 回答问题：
  - '- 为什么经理A尽管业绩好、是投决委、有金牛奖，但其管理基金可能不在买入名单内？'
  - '- “不买>50亿基金”这条铁律，在牛市中是否会导致踏空优质大基金？如何权衡？'
- 'no': 3
  title: 干扰项识别与决策净化
  contents:
  - 场景：某周发生以下事件，请判断各事件是否应纳入择时决策模型，并说明理由：
  - 1. 美联储意外加息50BP，美股大跌3%，A股高开低走
  - 2. 央行公布当月M2同比增长11.5%，超预期0.5个百分点
  - 3. 雪球/股吧讨论热度激增，“牛市旗手”券商股连续涨停
  - 4. 沪深300股债性价比从2.8跌至1.48，且指数有效跌破250日均线
  - 5. 某大型基金公司旗舰基金经理离职
  - 任务：
  - '- 将上述事件分类为：核心择时信号 / 干扰项(忽略) / 选品风控信号'
  - '- 对于第4项，结合技术分析辅助确认规则，给出具体操作指令'
  - 回答问题：
  - '- 为什么“M2超预期”属于干扰项而“十年国债收益率突破4%”却是核心信号？'
  - '- 基金经理离职属于选品风控而非择时信号，其背后的逻辑是什么？'
