  excerpts:
  - 发现需求-解决问题-工具诞生-工具验证，详情请点击查看
  - 需求挖掘验证：星球高频提及‘巨量百应选品’+用户评论‘想下载视频’→购买竞品‘考古加’实测三大硬伤(无法直接下载/数据非一手/依赖第三方下载器)确立自研切入点
  - MVP手工验证：3月份手动搬运约10条视频至视频号实现出单(首单佣金3.43元)，验证商业闭环可行性
  - 工具上线实战：自用账号进入爆发期但后续展示‘最坏结果23.76元/结果可能0’，揭示单账号运营高不确定性
  - 私域模式复制实验：4.18招募小白统一供料(选品+素材)，最好记录当天发当天见效，但普遍‘最差结果0/小白自己选品难’，作者亲自每天分发素材(走QQ防压缩)，模式复制边际成本高标准化程度低
  - 工具即入场券，模式复制才是放大器：想赚更多钱，就去复制模式。
  - 账号权重/运营能力是同素材变现结果核心变量：同素材分发不同账号结果极大方差(当天见效vs 0收益)，素材必要条件，运营能力充分条件
