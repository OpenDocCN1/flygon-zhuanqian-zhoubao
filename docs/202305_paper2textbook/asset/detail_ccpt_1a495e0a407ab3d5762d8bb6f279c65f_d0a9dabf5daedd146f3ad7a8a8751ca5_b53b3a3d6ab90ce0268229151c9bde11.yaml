  - '**核心定义**'
  - '- 抖音养生号（中医号）：借助中医大师IP势能，混剪/二创输出养生内容吸引中老年粉，开橱窗带货变现'
  - '- 图文经方起号法：单张图片呈现经方/药方文本+大师讲课音频，利用中老年对“秘方”高关注度5天千粉'
