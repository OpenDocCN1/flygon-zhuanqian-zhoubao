units:
- 'no': 1
  name: PPT知识付费IP —— 从零基础到47天16.7万的可复制范式
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人缺乏原创内容生产能力，但拥有结构化整理与拆解能力'
  - '- PPT赛道具备刚需强、变现路径清晰、复购率高、交付标准化特征，是跨阶层优质赛道'
  - '- 需要一套从冷启动、内容生产、私域转化到产品迭代的标准化SOP，降低试错成本'
  - '**核心定义**'
  - '- PPT项目拆解IP：将优秀PPT作品拆解为动画/排版/配色等可学步骤，作为内容载体打造抖音知识付费个人品牌'
  - '- 前端引流-后端变现模型：抖音公域获客（前端），微信私域深度信任建设与高客单成交（后端）的商业闭环'
  - '- 人设信任资产：通过真实经历、价值观、朋友圈生活化运营积累的用户信任资本，是高客单成交核心杠杆'
  - '- MVP思维：课程未完善前先以低价内测版/1对1陪跑售卖，用市场验证打磨再规模化交付'
  - '**关键性质**'
  - '- 执行力>完美主义：0-1阶段完成比完美重要，先发布再修正，用市场反馈倒逼升级'
  - '- 赛道决定上限，细节决定下限：选对赛道是前提，封面统一性/前3秒完播率/钩子诱惑力等细节决定能否跑通闭环'
  - '- 私域是放大器，公域是放大镜：抖音筛选精准用户（放大镜），私域高频触达最大化单客价值（放大器）'
  - '- 利他思维是长期护城河：真心帮用户解决问题而非割韭菜，获得口碑裂变、高复购与抗风险能力'
  - '**典型例子**'
  - '- 木子田：生财有术新人，0粉起号，47天通过PPT拆解课程（299-999元）+1对1陪跑（2999/4999元）变现16.7万'
  - '- 单条爆款视频验证：发布约20条视频后，第21条“PPT动画拆解”播放10万+，引流300+精准粉直接成交数万'
  - '- 1对1陪跑打磨标品：高价陪跑服务种子用户，被逼解决奇葩问题中产出标准化课程大纲(SOP)和FAQ，再降维规模化'
  - '- 统一封面提升转粉：大字报风格+固定配色+作者头像，主页转粉率从个位数提升至10%+'
  - '- 工具型钩子胜出：源文件/模板/素材包/配色表等“即拿即用”钩子，加微率与成交率显著高于电子书/思维导图'
  - '**边界条件**'
  - '- 依赖抖音算法分发机制，平台规则变动可能影响流量获取稳定性'
  - '- 需要持续产出高质量拆解内容，对PPT专业度与审美有基础要求'
  - '- 私域运营强依赖个人精力与服务意识，规模化受限于人力边际成本'
  - '- 虚拟产品交付易引发“仅退款/白嫖”纠纷，需建立定金验收等风控机制'
  sources:
  - paper: docs/202305/20230516_085.md
    role: origin
  excerpts:
  - 分享我做了八个多月的 PPT 项目拆解的玩法心得
  - 教你怎么打造一个 PPT 项目拆解的抖音知识付费 ip 博主
  - 抖音做前端流量，私域做后端转化
  - 公域种草，私域收割
  - 朋友圈就是你的店面，也是你的人设
  - 打造专业、真实、有温度的人设
  - 课程还没做好，先卖再做
  - 先做 1 对 1 陪跑，打磨标品
  - 找对标账号，拆解爆款逻辑
  - 建立选题库、素材库、文案库
  - 照抄对标账号的爆款选题，然后微创新
  - 封面：统一风格，大字报，突出结果/痛点
  - 文案：黄金前三秒，干货步骤，引导评论
  - BGM：卡点，抖音热榜，匹配情绪
  - 剪辑：节奏快，关键步骤打码/标注
  - 设计引流钩子：PPT 模板、配色表、素材包、源文件
  - 抖音主页挂链接，粉丝群发福利，评论区置顶，私信自动回复
  - 朋友圈发什么：专业度展示、真实生活、营销转化
  - 打造专业、真实、有温度的人设
  - 不卖课，卖结果，卖确定性
  - 聊天话术：了解需求 -> 分析痛点 -> 给方案 -> 看案例 -> 促单
  - 先做起来，再做好
  - 不要想太多，先发视频，数据会告诉你答案
  - 选对赛道很重要，PPT 赛道刚需强、变现快
  - 细节决定成败：封面、前三秒、钩子、话术
  - 公域流量不稳定，私域才是资产
  - 抖音负责引流，微信负责成交和复购
  - 真心实意帮助别人，利他思维
  - 把学员当朋友，服务好每一个付费用户
  - 47 天变现 16.7W
  - 课程 299/599/999，陪跑 2999/4999
  - 发了 20 条视频，第 21 条爆了，播放 10 万+
  - 引流 300 多人，直接成交几万块
  - 先做 1 对 1 陪跑，把课程打磨成熟
  - 陪跑过程中整理出标准课程大纲和 FAQ
  - 统一封面风格，大字报，主页转粉率明显提升
  - 主页就是店面，封面就是招牌
  - 钩子要实用：源文件、模板、素材包、配色表
  - 思维导图、电子书转化率低，工具包转化率高
- 'no': 2
  name: 写作BOSS模式 —— 从写手到老板的规模化跃迁
  points:
  - '**为什么需要这个概念？**'
  - '- 单纯卖写作时间（写手模式）上限极低，手一伸碰到天花板'
  - '- 代写本质是生意而非写作，核心竞争力在于获客渠道、转化话术、供应链管理与风控'
  - '- 需要将个人技能转化为可复制、可规模化的商业系统（老板/运营模式）'
  - '**核心定义**'
  - '- 写作BOSS模式：搭建获客渠道+私域转化体系+写手团队+AI工具，从卖时间跃迁为卖系统/服务'
  - '- 电商平台代写模式：利用拼多多/淘宝/闲鱼/小红书搜索流量获取精准客户，话术引导至私域成交，规避平台虚拟类目限制'
  - '- 回忆录代写赛道：针对人生记录/家族传承刚需，客单价1-2万+，复购低推荐高，核心难点在获客而非写作'
  - '- 私域分层定价体系：按来源平台用户画像物理隔离微信账号（微信A接高客单/微信B接低客单），同质服务差异化定价，利润差40%+'
  - '- 合规引流话术库：针对各平台违规特性设计的“不违规留联系方式”标准化动作（发文件/截图/大小号联动/粉丝群托管）'
  - '- 三类客户分级策略：质量导向型(高溢价)/救急应付型(中溢价)/低价比价型(高维护低利润)，主张过滤第三类'
  - '**关键性质**'
  - '- 代写本质是生意而非写作：天花板不在文笔，而在商业系统构建能力'
  - '- 虚拟服务电商核心矛盾：流量精准度 vs 平台合规性，核心竞争力在于设计擦边球引流动作'
  - '- 非标服务定价锚定客户画像而非成本：同一稿件因客户来源不同支付意愿巨大差异，物理隔离微信实施价格歧视是利润最大化关键'
  - '- 合规红线：严禁学术论文，垂直深耕换取店铺权重垂直度、账号长寿命与品牌专业度'
  - '- 服务质量超预期是高复购(70%+)唯一护城河：拒绝一次性生意，定金验收机制建立安全感，单客下单10次以上为常态'
  - '**典型例子**'
  - '- 作者饭饭：从负债到团队月入11万，个人年入50万级，团队6人'
  - '- 回忆录单品验证：年遇2客即可年入5万+，市场年增长率约10%'
  - '- 平台梯队实测：闲鱼(低门槛高客单最爱)/小红书(高净值女生高客单)/拼多多(流量大但稿费低易封店)/抖音视频号(引流难)'
  - '- 315生存策略：严查期主动下架链接，风波过后再上架，保全两大店存活'
  - '- ChatGPT降本增效：角色设定->大纲->分段写作->口语化润色->搜爆文要素反哺指令，显著提升产出速度质量'
  - '- 白嫖/仅退款风险低概率：计入运营成本心态平和处理，不影响整体盈利模型'
  - '**边界条件**'
  - '- 电商平台规则频繁变动，引流话术有时效性，需持续迭代'
  - '- 写手团队管理存在质量波动与忠诚度风险，四阶段进化法需长期投入'
  - '- 学术代写等高风险品类虽需求大但合规红线不可触碰'
  - '- 非标服务交付依赖人工质检，规模化受限于管理半径'
  - '- 回忆录等高客单品类获客周期长，现金流不稳定，需组合低客单品类平衡'
  sources:
  - paper: docs/202305/G2Zwdm2H7ol8FYxHEn7c0H2dn3c.md
    role: origin
  excerpts:
  - 我们不能单独的充当写手，这样上限太低，手一伸就碰到天花板，把自己当做一个老板，建好桥梁，做好运营，赚更多的钱。
  - 第1阶段：找优质同行过度...第2阶段：制定规则，按你的需求来合作...第3阶段：高阶玩法，收费写手招募...第4阶段：成为渠道 打造优质团队
  - 基本玩法通过电商平台获取到精准客户咨询，然后双方交流、根据需求报价，多数都是私域对接付款，微信、支付宝或者银行卡付款的。
  - 两者相比之下我更推荐电商平台，来的客户更精准，转换难度非常低，客户进店就是两个结果，要么下单、要么走人
  - 回忆录是我们一个不错的一个营收点...预计该市场的年度增长率约为10%左右。
  - 回忆录不难，只要文笔不是太差基本都可以写，怎样找到客户才是最关键的。
  - 只要按照我的方法去做，一年遇见2个以上的客户，一年光回忆录方面收入5万以上还是很容易的.
  - 由于所做的每个平台的用户群体不一样，同样的产品也能做出非常不错的价格...我的方法是注册不同的微信，微信A用来承接闲鱼、小红书和淘宝的用户，微信B用来承接拼多多的用户。因为微信A的客户价格偏高，可以比微信B的利润高出40%,左右。
  - 这个步骤是最难的，也是很多人做不起来的关键，稍微违规容易店铺被限制。
  - '1.这边怎么跟您发文件呢？ 然后客户会回复你联系方式... 2.发送图片 在聊天窗口输入微信号: 然后截图发给客户'
  - 大小号引流（就是大号发作品，然后评论区用户咨询的时候@小号，通过小号发一个作品留联系方式）
  - 创建粉丝群聊。设置小号管理员，管理员在群里回复消息，消息中留联系方式。
  - 我们面临的客户分为三种：1.有质量需求的... 2.找你救急的... 3.想低价应付作业的。这部分客户我建议过滤，赚不到钱还能折磨人。
  - 新手建议做个人店：准备一台手机、一张电话卡、个人身份证、1000元保证金
  - 标题非常重要...错误的标题也会直接导致封店或者4w的保证金，这里我提供几个我们操作没问题和正在使用的标题
  - 拼多多商品发布如何避开4W保证金 这个方法目前知道的人并不多，不少人专门卖这个教程都收费上百元
  - 这里推荐的两个方法和专业话术：【平台规则一直在变，不能保证一直吃香】 1.这边怎么跟您发文件呢？ 2.发送图片...截图发给客户
  - 闲鱼开店属于非常简单的...低投入绝对的高回报，而且闲鱼上面做写作类目的竞争非常小。
  - 标题发布：闲鱼是一个很自由的平台...【1】写作、改稿、润色、演讲、降重、调整还有考编咨询、倾诉皆可。建筑学硕士，事业编在编...
  - 发布地：这里建议选择哪些自带流量和光环，发达一点的城市...客户会根据你的发布地址来推测你有没有能力做他的单子。
  - 闲鱼引流方法 【1】图片引流... 【2】电话沟通，让客户先拍下，然后打电话或者直接添加微信
  - 小红书发笔记 引流 微信谈单成交
  - 写作账号我的养号方法如下：每个小红书养号5-7天，每天养号3~4次，每次15分钟以上
  - 选题：这个板块是极其重要的，他取决于用户刷到你的视频之后会不会点赞？
  - 找素材：...最重要的一点就是看他的点赞量，评论，收藏。
  - 作图方法：1.用可画做... 2.用word文档做，做好点击打印（快捷键ctrl +P）截图即可
  - 大小号引流（就是大号发作品，然后评论区用户咨询的时候@小号，通过小号发一个作品留联系方式）
  - 一个优质的视频包括三个部分：【1】选题... 【2】视频...提高整个视频和播放的完播率... 【3】图片...决定刷到你的用户，会不会给你点赞和收藏以及评论
  - 抖音引流方法：1.创建粉丝群聊。设置小号管理员，管理员在群里回复消息，消息中留联系方式。 2.小号在评论区引导客户，小号改名为xx助手【大号助手】，相对安全一点。
  - '报价之前必问三个问题及话术: 1确定写作类型、主题、字数、交稿日期。 【1】你好，咱这边需要写什么呢？ 【2】需要写多少字呢？ 【3】什么时候需要呢？'
  - 【如果客户觉得贵】...先认可客户：相当于谈话的时候告诉了客户自己的门槛和标准，多数人心理都是，越贵的质量越好...顺势给他降价一点就可以...适当的做一个销售角色，可以把利润增加15%以上
  - 【如果客户担心被骗】 【1】 平台保障... 【2】先付定金...写作完成以后录屏视频源文件内容和查重报告给您验收没问题以后再付尾款。
  - 【1】现在设定你是xxx角色 【2】现在需要按“xxx'来写一篇文章，拟出大纲 【3】按大纲写作
  - 切忌机械化复制...把他当做一个工具来使用效果更好，chatGPT写出来的文章不能照搬使用，适当修改，将内容变得口语化一点。
  - 根据客户需求将指令详细化...网上搜索：自媒体招商账号爆文的一些相关内容...一系列的指令就可以用得上。
  - 强化质优意识...在你店里下单的东西一定要以满足他的需求为基础，然后超出他的期望为目标...回头率超70%
  - 第1阶段：找优质同行过度... 第2阶段：在开店的同时会不断有写手来应聘，制定规则... 第3阶段：高阶玩法，收费写手招募...极大的提高了自己内部团队的写作质量和写稿速度。
    第4阶段：成为渠道 打造优质团队、主动链接和洽谈哪些小商家和大学生校园团队
  - 我们不能单独的充当写手，这样上限太低，手一伸就碰到天花板，把自己当做一个老板，建好桥梁，做好运营，赚更多的钱。
  - 赚钱这件事本来就是不断的打破自己的认知然后重组思维，实操落地。
  - 两者相比之下我更推荐电商平台，来的客户更精准，转换难度非常低...社交平台相对交付过程漫长一点
  - 如何进行线下引导 这个步骤是最难的，也是很多人做不起来的关键，稍微违规容易店铺被限制。
  - 由于所做的每个平台的用户群体不一样，同样的产品也能做出非常不错的价格...微信A的客户价格偏高，可以比微信B的利润高出40%,左右。
  - 小红书平台的用户主要是以女性大学生和研究生为主，非常高质量，准确来说非常有钱~
  - 禁接学术类型单子...近40%,的回来咨询关于论文的，这里不建议去做、直接拒绝你会活的好好的...精准的选好赛道，然后放大，你会越来越富有
  - 借用@梁靠谱大大的一句话‘一厘米的宽度，一万米的深度’那你就是一个领域的专家
  - 做文章写作行业有一个大忌，切忌做一次性生意...做好质量、做好服务你会发现客户频频回头，我们有很多客户现在找我们下单不止于10次以上
  - 我们的微信号就像一个实体店甚至优于实体店...以满足他的需求为基础，然后超出他的期望为目标...回头率超70%
  - 目前这个项目旺季能给我带来一个月6w左右的收益，淡季3.5w左右
  - 目前的情况这个项目高峰期的时候能给团队每月带来11w左右的营收，淡季稳定在6w左右
  - 一年遇见2个以上的客户，一年光回忆录方面收入5万以上还是很容易的
  - 今年的315就是我的一波亏血状态，突然的一些封了好几个销量10w+的老店
  - 闲鱼...这是目前我最喜欢的一个平台，低投入绝对的高回报，而且闲鱼上面做写作类目的竞争非常小。
  - 小红书平台的用户主要是以女性大学生和研究生为主，非常高质量，准确来说非常有钱~
  - 拼多多...稿费水平偏低...错误的标题也会直接导致封店或者4w的保证金
  - 淘宝...竞争激烈：淘宝平台上的写作市场竞争激烈，是我写到的平台中竞争最激烈的。
  - 抖音...引流难度较大、流量分配不稳定...视频号...比抖音多一个优点，不用导流，可以直接加微信。
  - 电商平台打压期...今年315的时候大量同行店铺被封禁...我拜访了很多同行以后终于找到了避坑方法：在即将严查期间到来的时候下架店铺链接，严查期间过去了再上架产品，这个方法让我有幸存活了两个大店。
  - 简单输入指令写一篇介绍文章，全程写作不到10分钟便可以出初稿
  - 【1】现在设定你是xxx角色 【2】现在需要按“xxx'来写一篇文章，拟出大纲 【3】按大纲写作
  - 根据客户需求将指令详细化...网上搜索：自媒体招商账号爆文的一些相关内容...一系列的指令就可以用得上。
  - 被白嫖文章...你把文章发给客户以后他白嫖你，然后仅退款，这是会遇见的情况...不过很好的一个点，这类型的客户很少。
