    - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
  - 'no': 2
    name: 变现倒推定位法与引流变现双轮模型
    desc: 先确定变现方式(广告/分销/自有产品/引流池)再推导定位受众最后决定内容方向，避免为内容而内容；引流负责造势(数据好看冲阅读提报价)IP负责留量(筛选高信任粉丝提高转化率承接高客单)，先有流量IP才能变现无IP仅靠引流天花板低。
    role: method
