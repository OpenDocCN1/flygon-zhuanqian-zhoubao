    - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
  - 'no': 8
    name: 变现四阶梯进阶定律与广告报价双决定因子
    desc: L1阅读200-300接直投广告(引流即可IP锦上添花)→L2日增100粉接CPA广告(引流即可IP锦上添花)→L3强IP分销他人产品赚佣金(需强IP)→L4强IP售卖自有课程社群(需强IP)，技能点必须依次点满不可跨级；直投报价=f(阅读量/粉丝粘性购买力女性占比)CPA收入=f(外部引流涨粉量)，IP强弱不影响前两阶段上限但决定能否跨越至L3/L4。
    role: theorem
    src:
    - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
    - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
  - 'no': 9
    name: 留言功能迁移获取决策树与投入产出比判断
    desc: 个人号需先迁移至企业号再迁移入具留言权限老号(需专业机构操作有费用)；建议变现稳定后再开通，前提需满足有粉丝基数+有优质内容+有互动规则设计三条件。
    role: limitation
    src:
    - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
  - 'no': 10
    name: 作者账号广告变现实测数据与案例失重限期IP强化商业跃迁
    desc: 早期情感号粉丝不多阅读过千单价250-450元/月5-6条；转型IP号后阅读不高单价升至0.3-0.6元/阅验证IP强弱对溢价决定性影响；失重限期半年7w+粉均阅1300+单价0.5-0.7元/阅变现广告+课程社群，对比纯引流情感号8w粉千阅仅靠广告CPA，证明强IP虽粉丝基数小但能解锁高客单价产品变现3000粉产30单vs1万粉产5单效率差。
    role: experiment
    src:
    - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
    - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
  - 'no': 11
    name: 案例某可复制情感号纯引流模式天花板验证与广告避坑红线清单
    desc: 半年近8w粉千阅以上月入四五位数收入纯靠广告/CPA周CPA4000+内容以征稿为主IP弱，验证无IP重引流模式虽快速跑通L1/L2但粉丝粘性低变现上限封死在广告分成无法进阶高客单价；7类高风险广告类别(黑五类/易经迷信/下载理财APP/纯文案文档装文案/后台回复引流QQ群/抖音充值/大牌化妆品打折)均为圈内实测易导致封号违规投诉雷区。
    role: experiment
