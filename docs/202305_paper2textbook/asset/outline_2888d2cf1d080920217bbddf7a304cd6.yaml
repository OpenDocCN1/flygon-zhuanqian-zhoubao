    desc: 兼职函为对外投放广撒网钩子(含征稿/错别字/在看/转发低门槛任务)，征稿函为内部精筛选钩子(详细投稿规范稿费≥30元)，两者配合实现广撒网精筛选留存写手粉丝闭环；钩子性质决定引来粉丝质量画像。
    role: method
    src:
