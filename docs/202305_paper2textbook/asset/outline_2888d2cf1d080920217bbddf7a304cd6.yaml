  - 'no': 5
    name: 外部引流找车上车成本控制法与内部引流渠道效能排序
    desc: 建立引流记录表格记录单车成本/涨粉数/单粉成本/阅读带动比；找车(自找博主占首位成本低)>上车(拼车按位置分价)优先级执行，数据复盘筛选高ROI博主类型；实测性价比排序：同量级互推免费>付费单推征稿号按百阅5-8元>联合红包抽奖有违规风险，社群/星球引流质量高但量少成本高不适合冷启动。
    role: method
    src:
