    desc: 个人订阅号注册决策点：主体个人/类型订阅号/邮箱唯一/管理员实名绑定/名称头像微信号简介修改次数限制策略；后台四大分栏(原创白名单/自动回复三件套/自定义菜单/合集标签/用户画像/流量主/隐私设置/水印设置)必开项；排版规范：正文15号字两端缩进8字间距1行间距1.75，图文五段式结构色系统一。
    role: method
    src:
