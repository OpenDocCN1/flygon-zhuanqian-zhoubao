    - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
  - 'no': 6
    name: 社群分层运营体系与社群规则前置原则
    desc: 三层分层：读者群(大容量弱连接蓄水池)/任务兼职群(中容量强协作外包执行)/打卡自律群(小容量高粘性高客单转化前置池)；规则先行：入群前设定准入门槛/发言规范/违规处罚/活动节奏，规则越细致运营介入成本越低混乱概率越小粉丝参与感信任感越强。
    role: method
    src:
    - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
    - paper: docs/202305/VjTFdmoIhoOIuhx4wYUcc1XGn8g.md
  - 'no': 7
    name: 个人IP强标签打造思路与内容生产黄金节奏
    desc: 提炼可被瞬间联想的核心人设关键词(如自律搞钱狂魔)，总分结构输出人设文(总述版画像+分项深度展开)建立认知护城河；冷启动期1原创建IP信任+1征稿降成本存量+1转载白名单补频次蹭热度，周更2-3频次平衡质量成本算法活跃度。
    role: method
