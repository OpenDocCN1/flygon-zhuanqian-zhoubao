    desc: 卖课程(低边际成本一锤子买卖易挨骂)/卖咨询(高单价非标服务时间杠杆弱)/卖圈子(高复购资源聚合运营难易变冷群)三模式优劣势对比；私域日增200-500粉测算：卖社群500元/5%转化月入15-37.5万，卖课程2000元/2%转化月入24-60万，结论高客单课程现金流更优但需超值交付能力，社群不建议新手首选。
