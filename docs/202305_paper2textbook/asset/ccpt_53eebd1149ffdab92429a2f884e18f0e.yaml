paper: docs/202305/20230516_050.md
desc: 该素材由作者静水流深分享，核心内容是利用 Wise（国际支付平台）的自带推荐计划，通过 Google/Bing 搜索广告投放品牌关键词，以极低成本（单次点击成本
  0.01-0.02 英镑）获取高转化流量，赚取每笔 50 英镑的推荐佣金，实现单日佣金收入超一万英镑的“躺赚”模式。作者强调该模式依靠认知差距与执行力，广告成本可忽略不计，且
  Wise 信誉好、结算快，适合单人深耕操作。
concepts:
- name: Wise 推荐计划套利
  desc: 利用 Wise 平台自带的用户推荐奖励机制（每成功邀请一名符合条件用户奖励 50 英镑），结合搜索引擎品牌词竞价广告，以极低获客成本换取高额固定佣金的套利模式。
  is_original: true
  excerpt:
  - 个人用户推荐可以获得 50 英镑的佣金
  - 这样我们就可以用 Mediabuy 的方式，谷歌或者 Bing 购买相关关键词，赚取利差。
  - 因为 Wise 确实信誉好，我每天点 50 英镑点得手都累了，因为只要三个用户满足条件，这边立即显示可以取现 50 英镑
- name: 品牌词低价竞价策略
  desc: 针对 Wise 等高信誉品牌词，利用其高转化率特性，以极低出价（0.01-0.02 英镑/次）获取精准流量，使广告成本在佣金利润面前可忽略不计。
  is_original: true
  excerpt:
  - 其实一开始只需要出价 0.01 即可，后面因为我要放天量，成本上升到了 0.02。广告成本在这个项目里完全不决定你是否赚钱，因为可以忽略不计。
  - 因为是品牌相关词，所以转化率一定不会低。
- name: Media Buy（媒体采买）变现闭环
  desc: 将广告联盟推广与平台自带推荐计划结合，通过直接投放广告购买流量，绕过联盟漫长账期与潜在扣量风险，实现快速回款的变现闭环。
  is_original: false
  excerpt:
  - 在广告联盟里测试... 因为很多有争议的说，这种涉嫌违规的投放，可能广告主不给钱，其实我主要觉得账期长了，而且推荐佣金还高一些
  - 于是我每天邮件是这样的... 立即显示可以取现 50 英镑
methods:
- name: __overview__
  desc: 核心操作流程：1. 注册 Wise 获取专属推荐链接；2. 在 Google Ads / Bing Ads 创建搜索广告系列，定向 Wise 品牌关键词；3.
    设置极低出价（起步 0.01 英镑）获取低成本点击；4. 用户通过广告注册并完成首笔符合条件的转账；5. Wise 后台实时结算 50 英镑/单推荐奖励；6.
    放大投放量级实现日入万镑。
  excerpt:
  - 注册 Wise 获取推荐链接（隐含步骤）
  - 谷歌或者 Bing 购买相关关键词
  - 出价 0.01 即可... 放天量，成本上升到了 0.02
  - 只要三个用户满足条件，这边立即显示可以取现 50 英镑
  - 基本上每天上去看看报表就结束了，全部是谷歌帮你赚钱
theorems:
- name: 认知差距决定收益上限
  desc: 作者核心主张：该项目大多数人都知道，但没人敢大规模操作，根本原因在于认知差距——认知即预判结果的能力，敢于在确定性高的模型上重注并执行，是超越普通打工者收益的关键。
  excerpt:
  - 这个案例其实大多数人都知道，没人敢像我这样玩，这就是认知的差距。
  - 认知就是你可以预判结果，而结果几乎跟你预判一样。
  - 这块基本上只要有毅力深耕一年，至少比一般的上班要强很多
- name: 高信誉广告主自带推荐计划优于广告联盟
  desc: 核心判断：对于 Wise 这类信誉极高、自带高额推荐奖励的广告主，直接投放品牌词对接官方推荐计划，优于走广告联盟（CPA），优势在于结算即时、无扣量风险、佣金更高。
  excerpt:
  - 因为很多有争议的说，这种涉嫌违规的投放，可能广告主不给钱，其实我主要觉得账期长了，而且推荐佣金还高一些
  - 因为 Wise 确实信誉好，我每天点 50 英镑点得手都累了... 立即显示可以取现
findings:
- name: 单日万镑佣金实测数据
  desc: '[claim] 作者宣称通过该模式实现单日推荐佣金收入超过一万英镑。'
  excerpt:
  - 《通过 Wise 的推荐项目，每天躺赚一万英镑+》
  - 然后因为 Wise 确实信誉好，我每天点 50 英镑点得手都累了
  - 一天一万英镑，直接算下我每天跑多少广告费，点击次数
- name: 极低广告获客成本验证
  desc: '[evidence] 素材截图显示 Google Ads 后台数据：平均 CPC（单次点击成本）仅 0.01-0.02 英镑，验证了品牌词低价竞价的可行性。'
  excerpt:
  - 大家可以看看我花了多少钱，广告成本多低：(图片显示 Avg. CPC 0.01-0.02)
  - 其实一开始只需要出价 0.01 即可，后面因为我要放天量，成本上升到了 0.02
- name: 推荐奖励即时结算验证
  desc: '[evidence] 素材截图显示 Wise 后台推荐奖励页面：每 3 个合格用户即可提现 50 英镑，且状态显示“可取现”，验证了结算速度快、门槛低的特性。'
  excerpt:
  - 因为只要三个用户满足条件，这边立即显示可以取现 50 英镑 (图片 img/a20705d32a9db3f5c470f4f55482ebc4.png)
  - 我每天邮件是这样的 (图片 img/26222c889af1909a8a0fe603851d7771.png 显示大量推荐奖励邮件)
- name: 广告联盟对比测试结论
  desc: '[evidence] 作者此前在广告联盟测试 Wise 推广（图片 img/21fe924f8ae1e9fcf5c0744a8ad1aa0b.png），但因担心账期长、扣量风险及佣金较低，放弃联盟转投官方推荐计划。'
  excerpt:
  - 我之前在广告联盟里测试，一天的数据 (图片 img/21fe924f8ae1e9fcf5c0744a8ad1aa0b.png)
  - 因为很多有争议的说，这种涉嫌违规的投放，可能广告主不给钱，其实我主要觉得账期长了，而且推荐佣金还高一些
