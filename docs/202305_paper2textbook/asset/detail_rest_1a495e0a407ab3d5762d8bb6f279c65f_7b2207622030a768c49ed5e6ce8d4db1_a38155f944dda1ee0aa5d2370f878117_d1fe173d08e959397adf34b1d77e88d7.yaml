learning_targets:
- 理解生财有术社群‘小航海’项目制训练营的底层逻辑与执行闭环
- 掌握个人IP‘百年不改名、全域用同名’的品牌资产复利构建法
- 建立‘公域蓄水池、私域提款机’的全平台流量变现底层架构认知
- 拆解AI内容自动化流水线的三要素：业务SOP拆解、提示词工程、自动化工具串联
- 内化‘执行力>创意’、‘承认无能’、‘利他思维’三大认知底座，完成从打工思维到商业思维的跃迁
- 熟练应用‘资料整理引流法’与‘变现分层漏斗’构建零边际成本商业模型
- 能根据个人禀赋，从实战项目库（无货源电商、知识付费、海外B2B、短剧CPS、长尾赛道）中筛选匹配赛道并跑通MVP
concept_map:
- 生财有术核心方法论体系
- ├── 认知底座（心法层）
- │   ├── 执行力优先定律：赚钱的事多做十遍、解决真正的问题  —— P001, P005
- │   ├── 承认无能与无知：成长起点、认知校准三步法  —— P007
- │   ├── 利他思维：商业协作底层逻辑、贵人链接价值交换  —— P006
- │   └── 个人IP复利策略：百年不改名、全域同名、不出镜也能做IP  —— P002
- ├── 训练体系（践行层）
- │   └── 生财小航海：项目制训练营、六大筛选标准、MVP验证闭环  —— P001
- ├── 流量架构（底层通道层）
- │   ├── 公私域协同模型：公域获客→私域转化→高客单变现  —— P003
- │   ├── 资料整理引流法：低成本标准化钩子、日均引流180+  —— P008
- │   └── 变现分层漏斗：资料筛选→咨询信任→高客单复利  —— P008
- ├── AI生产力革命（工具杠杆层）
- │   ├── AI内容自动化流水线：文本/图像/视频三位一体  —— P004
- │   ├── ChatGPT+RPA 13步文案自动化法  —— P004
- │   ├── SD云端零成本批量出图（Colab/ComfyUI）  —— P004
- │   └── 核心公式：SOP拆解 + Prompt工程 + 自动化串联  —— P004
- └── 实战项目库（落地应用层）
- '    ├── 轻资产电商：小红书无货源/虚拟资料、视频号投流带货、闲鱼矩阵  —— P005'
- '    ├── 知识付费/IP变现：写作训练营、咨询社群、个人IP信任背书  —— P006'
- '    ├── 海外业务：独立站B2B冷启动、Mediabuy品牌词套利、跨境私域  —— P006'
- '    └── 长尾赛道：二奢、手机壳、短剧CPS、快团团、Web3 Mint  —— P006'
life_analogy:
- 想象生财有术的完整体系是一座**‘普通人逆袭的加油站’**：
- '- **认知底座** = **加油前的车检**：不检查引擎（执行力）、不排空后备箱垃圾（承认无能）、不校准导航（利他思维），车再好也跑不远'
- '- **小航海训练营** = **陪练教练**：给地图（SOP）、定里程碑（截止节点）、坐副驾纠偏（导师点评），强制你跑完全程0-1闭环'
- '- **个人IP** = **车牌品牌资产**：百年不改名，时间越久牌面越值钱，换个平台（全域同名）照样认得是你'
- '- **公私域流量** = **公路与私家车库**：公域是公共高速（流量大但不归你、随时限行），私域是自家车库（车停进去就是自己的资产，随时能开）'
- '- **AI自动化流水线** = **自动驾驶系统**：不懂开车（业务SOP）光买辅助驾驶（AI工具）必翻车；先把路线规划好（拆解流程），再挂自动挡（RPA串联）才能睡后收入'
- '- **实战项目库** = **加油站提供的不同标号燃料**：无货源电商（92号、易得）、知识付费（95号、高客单）、海外B2B（98号、汇率杠杆），按你的车况（个人禀赋）自选加注'
- 就像长途自驾：必须先修好车（认知）、跟教练跑几圈（航海）、挂好牌（IP）、规划公私路线（流量）、装上自动驾驶（AI）、选对油（项目），才能稳稳抵达财务自由终点。
summary:
- concept: 生财小航海
  desc: 普通人0-1跨越的标准化训练营：截止节点+公开承诺+同伴监督+导师点评，强制跑通商业闭环
- concept: 小航海项目筛选六标准
  desc: 正向现金流快、无复杂供应链、可标准化、可借力AI、有公域获客路径、后端高复购/高客单
- concept: 个人IP复利策略
  desc: 百年不改名、全域用同名，统一ID/头像/简介积累品牌资产，出名是赚钱的代价也是信任护城河
- concept: 公私域协同模型
  desc: 公域蓄水池（获客）→私域提款机（转化），核心动作：钩子设计、诱饵投放、承接话术、后端分层产品
- concept: 资料整理引流法
  desc: 零边际成本垂直资料作钩子，公域引流日均180+，核心利润在后端自有高附加值产品/服务
- concept: 变现分层漏斗
  desc: 三层递进：低价资料筛选付费意向 → 低价咨询建立信任/互惠 → 高客单产品/训练营核心利润
- concept: AI内容自动化流水线
  desc: SOP拆解 + Prompt工程 + RPA/低代码串联 = 可复制生产线，AI是放大器而非救世主
- concept: ChatGPT+RPA 13步法
  desc: 将文案拆解为13个结构化提示词节点，配合RPA实现批量生成、定时发布、数据回收无人值守
- concept: SD云端零成本批量出图
  desc: Google Colab免费GPU部署SD WebUI，配合脚本/API/定时任务，无需本地显卡实现无限批量出图
- concept: 执行力优先定律
  desc: 认知突破在行动中通过反馈修正，彻底执行三重境界：动作标准化、覆盖无死角、穿越周期
- concept: 承认无能与无知
  desc: 成长起点：接纳无能/无知/无资源现实，放下体面从微小确定动作做起（抄作业、跟航海、卖资料）
- concept: 利他思维
  desc: 商业本质是价值交换：优先为用户/伙伴创造价值，真诚是社交最大杀手锏，信任仅通过交易循环建立
- concept: 付费即筛选
  desc: 哪怕9.9元也完成双重验证（强兴趣+付费意识），免费用户无法判断付费潜力且易低估商业价值
- concept: 商业信任=价值交换
  desc: 信任非聊天聊出，而是通过‘交付价值-收取对价’循环建立；低价咨询是低风险信任启动器
- concept: 输入-重构-输出循环
  desc: 整理输入(学习/筛选)→重构输出(沉淀方法论/开发课程/服务)→打磨核心竞争力护城河，资料整理即学习
- concept: 实战项目库分层
  desc: 轻资产电商(小红书/视频号/闲鱼)→知识付费/IP变现→海外业务(独立站B2B/Mediabuy)→长尾赛道(二奢/手机壳/短剧CPS)
exercises:
- 'no': 1
  title: 设计你的‘小航海’首个MVP验证方案
  contents:
  - 1. 根据‘小航海项目筛选六标准’，从实战项目库中挑选1个最匹配你当下禀赋（资金/时间/技能/认知）的项目
  - 2. 拆解该项目的‘公域获客→私域转化→后端变现’最小闭环关键动作（不超过5步）
  - 3. 设定7天内的MVP验证指标：投入成本≤100元、产出≥1个真实付费订单/≥10个精准私域加微
  - 4. 列出可能导致验证失败的Top 3风险点及对应的止损/调整预案
  - 回答问题：
  - '- 为什么要求‘正向现金流快’是新手项目的首要筛选标准？'
  - '- 如果MVP验证失败，是换项目还是优化SOP？判断依据是什么？'
- 'no': 2
  title: 搭建个人IP‘百年不改名’的跨平台品牌资产包
  contents:
  - 1. 确定你的统一品牌ID（建议：真名/网名+领域关键词，如‘张三聊副业’），检查抖音/小红书/视频号/公众号/B站/微信是否均可注册/占用
  - 2. 设计统一视觉锤：头像（真人/虚拟形象/Logo）、封面配色方案（主色+辅助色）、简介话术模板（我是谁+帮谁+解决什么问题+信任背书+行动号召）
  - 3. 产出前3篇‘钩子内容’：针对目标用户最痛的问题，输出1篇长文/视频/笔记，同步分发至所有已占平台
  - 4. 建立『内容-引流-转化』周度复盘表：记录各平台发布量/阅读/引流加微/私域成交/客单价
  - 回答问题：
  - '- 为什么‘不出镜’（资料号/工具号/笔记号）同样能积累品牌信任资产？'
  - '- 当人设与变现产品冲突时（如人设‘佛系’但卖‘高强度训练营’），如何调整？'
- 'no': 3
  title: 跑通一条『AI+RPA』内容自动化微流水线
  contents:
  - 场景：每日从『即刻/小红书/抖音』热榜抓取Top 10话题 → ChatGPT按固定Prompt改写为『小红书爆款笔记/公众号标题/视频口播脚本』 → RPA定时发布至目标账号
  - 1. 选定1个细分赛道（如‘AI工具测评/副业避坑/考公资料’）设计通用的3段式Prompt模板（角色设定+输入变量+输出格式约束）
  - 2. 用Coze/扣子/按键精灵/Auto.js/腾讯RPA任选一工具，搭建『抓取→生成→发布』最简自动化流程（无需完美，跑通即可）
  - 3. 连续运行7天，记录：单日内容产出量、平均阅读/播放、引流私域量、人工干预次数
  - 4. 基于数据迭代Prompt与发布时间，形成v1.0标准化SOP文档
  - 回答问题：
  - '- 为什么说『业务未标准化前引入AI只会放大混乱』？请结合你的实操体会说明'
  - '- 提示词工程的核心护城河是『模板结构』还是『微调参数』？为什么？'
- 'no': 4
  title: 实操『资料整理引流→分层变现』最小闭环
  contents:
  - 1. 选定1个垂直细分领域（如『Notion模板/公考资料/英语启蒙/小红书运营SOP』），整理1份高质量『引流资料包』（PDF/网盘/工具箱），成本≤2小时
  - 2. 在小红书/抖音/公众号/闲鱼任选1平台，按『封面/标题/正文/评论区/主页』五要素优化发布3-5条引流笔记/视频，钩子指向『私信/评论领取资料』
  - 3. 私域侧准备：『欢迎语自动回复+朋友圈专业/生活/营销5:3:2布局+低价咨询话术(9.9-99元)+高客单产品大纲(299-2999元)』
  - 4. 连续运营14天，每日记录：引流加微数、资料领取率、咨询成交数/额、高客单成交数/额、单用户ARPU
  - 回答问题：
  - '- 为什么『资料是别人的（钩子），产品必须是自己的（本体）』？若无自有高客单产品，该模型还能跑通吗？'
  - '- 『付费即筛选』在低价咨询环节如何体现？红包复投模型（用户自发发红包88-120元）的心理机制是什么？'
- 'no': 5
  title: 复盘一位生财圈友的实战案例，提炼可迁移方法论
  contents:
  - 从素材中自选1个完整案例（如：CBJhdD0dTokH8tx8HKYc1nJSnnc应届生两周变现7k、DGw1dYHSsohHu7x1AXhc4cQVnEN
    8元成本月赚2w、I8BLdIIfbobzkYxCLGBctYqbnae视频号农机三个月20万、VILid7sleoZ6puxkchxcRM9vn6g海外独立站25天成交$4551）
  - 1. 用『认知对齐→赛道筛选→SOP执行→MVP验证→复盘优化→规模化』六阶段模型，还原其完整动作轨迹
  - 2. 标注关键节点的『异常值信号』（如：某条内容爆了、某渠道突然跑通、供应链崩了、账号被封）及其『应对决策』
  - 3. 抽取3个可跨项目复用的『底层动作/认知/工具』，写成『通用SOP卡片』
  - 回答问题：
  - '- 该案例中『执行力>创意』体现在哪个具体环节？如果换成完美主义者会发生什么？'
  - '- 『利他思维』如何在该案例的『选品/内容/服务/转化』各环节落地？'
