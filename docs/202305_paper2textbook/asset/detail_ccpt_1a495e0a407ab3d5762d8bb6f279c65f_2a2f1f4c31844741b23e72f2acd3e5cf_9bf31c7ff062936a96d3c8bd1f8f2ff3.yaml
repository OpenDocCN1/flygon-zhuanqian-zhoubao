units:
- 'no': 1
  name: 需求三部曲 —— 从生活细节中挖掘、验证并解决真需求的商业落地通法
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人创业常陷入“找不到项目”或“跟风工具/平台”的误区，导致试错成本高、成功率低'
  - '- 赚钱本质是解决用户真实需求，而非盲目跟风；项目本身不值钱，挖掘逻辑与思考能力才是持续变现源泉'
  - '- 缺乏一套通用、可复用的方法论，导致面对新赛道时无从下手，只能靠运气'
  - '**核心定义**'
  - '- 发现需求：从生活对话、数据报表、热点事件中捕捉用户痛点与渴望'
  - '- 验证需求：通过平台评论区高频提问、搜索指数、私信回复等低成本手段，辨别真伪需求'
  - '- 解决需求：将需求拆解为具体问题，通过思考组合现有工具/资源（而非硬核自研）逐步攻克'
  - '**关键性质**'
  - '- 通用性：适用于AI绘图、知识付费、服务类等跨行业、跨周期的各类商业项目'
  - '- 低成本：验证依赖公开数据（评论区、搜索指数），解决依赖资源重组，边际成本极低'
  - '- 迭代性：遵循“先跑通、再优化、后规模化”的MVP思维，容错率高'
  - '**典型例子**'
  - '- AI四维预测宝宝长相：从孕妈群聊天/评论区“想看长相”发现需求，搜索指数/评论区验证，AI提示词迭代+医院合作解决'
  - '- 碳中和知识付费：从政策热点发现需求，评论区“啥是碳中和/怎么赚钱”验证，3天速成输出大白话框架内容变现100万+'
  - '- 为TA点歌：从“表白需求”发现，评论区验证，不会弹唱通过招募合作者/剪辑唱吧素材重组交付'
  - '**边界条件**'
  - '- 需求必须真实且可付费：伪需求（如仅点赞不买单）会导致后续变现失效'
  - '- 解决方案需具备可交付性：核心交付物必须可标准化（如视频、文档），不可标准化的服务难以规模化'
  - '- 思考能力是核心壁垒：工具、平台、渠道皆为基建，门槛趋近零；自我设限（不专业、不会技术）是最大拦路虎'
  - '...'
  sources:
  - paper: docs/202305/20230516_073.md
    role: origin
  excerpts:
  - 总结一下：1、发现需求：需求无处不在...所以，多留心；2、验证需求：你发现的需求可能是个伪需求...所以，多搜索；3、解决需求：你能解决用户需求...所以，多思考。
  - AI 很强大，而且会更强大，但思考以及思考产生的创意，才是最可贵的，很难取代。
  - 项目都不值钱，想法才是值钱的，思考才是能让你持续赚钱的源泉。
  - 打开短视频平台...搜索 四维彩照，看相关内容的评论区都在说啥。正常情况下，去看同行的评论区，是最能直接验证需求的
  - 思考二：我就想自己做，不想合作，怎么办？那就分析下我们最终交付了啥？...到底，其实最终交付的是一个视频。
  - 1、特意挑了一张看起来就很不好还原的四维图，先垫图... 2、问题出现了，就解决问题，加上相关的关键词... 5、又尝试了其他的案例，出现不太像的问题，于是加上视角，以及五官细节的描述，还原度到位了。以上思考和实践，我们就有了扛打的关键词组。
- 'no': 2
  name: 评论区需求验证法 —— 用户真实声音的零成本探测雷达
  points:
  - '**为什么需要这个概念？**'
  - '- 主观臆断的需求往往是伪需求，导致产品无人问津、资源浪费'
  - '- 传统调研成本高、周期长、样本小，不适合个人/小团队快速验证'
  - '- 需要一种即时、真实、量化的验证手段，在投入生产前确认市场存在'
  - '**核心定义**'
  - '- 进入短视频/内容平台搜索核心关键词，深度分析高赞/高频评论内容'
  - '- 重点捕捉：高频提问（“怎么做”、“多少钱”)、情感表达（“好想要”)、寻求方案（“有软件吗”）'
  - '- 语义分析：区分“凑热闹”与“真购买意向”，以追问细节、表达付费意愿为强信号'
  - '**关键性质**'
  - '- 零成本：无需付费工具，仅需时间浏览公开评论区'
  - '- 高真实性：用户非被诱导，自发表达最真实痛点与渴望'
  - '- 可量化：高频词统计、提问占比、情感倾向均可数据化呈现'
  - '**典型例子**'
  - '- 四维预测项目：评论区出现“有软件可以看长相么（不能再好，相当精准了）”精准锁定付费意向'
  - '- 碳中和项目：评论区高频“碳中和是啥”、“怎么入行”、“考证有用么”验证入门级知识付费需求'
  - '- 点歌项目：评论区“想送女朋友”、“不会弹唱找人帮忙”验证定制化情感服务需求'
  - '**边界条件**'
  - '- 仅适用于已有内容沉淀的赛道：全新蓝海无评论区可参考，需结合搜索指数/测试投放'
  - '- 易受刷单/水军干扰：需结合账号权重、历史发言、语义逻辑综合判断真伪'
  - '- 只能验证“显性需求”：用户自己说不清、不知道的隐性需求（如乔布斯式创新）无法通过此法捕捉'
  - '...'
  sources:
  - paper: docs/202305/20230516_073.md
    role: origin
  excerpts:
  - 打开短视频平台...搜索 四维彩照，看相关内容的评论区都在说啥。正常情况下，去看同行的评论区，是最能直接验证需求的
  - 评论区大致如下：接四维一切顺利...有软件可以看长相么（不能再好，相当精准了）
  - 刷了很多视频，尤其是看评论区，高频的评论是‘碳中和是啥’...
  - 你能解决用户需求，且知道用户在哪，就大概率能赚到钱
- 'no': 3
  name: 资源重组交付法 —— 不会核心技能也能交付高价值服务的供应链整合术
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人常因“不会技术”、“不专业”、“无资质”自我设限，错失商机'
  - '- 传统交付模式强绑定个人核心技能，难以标准化、规模化、复制化'
  - '- 客户真正需要的是“结果/交付物”（如视频、报告、方案），而非“过程/技能”本身'
  - '**核心定义**'
  - '- 拆解交付物本质：将非标服务（如现场弹唱表白）拆解为标准化交付物（全程录屏视频）'
  - '- 识别核心技能缺口：弹唱技能、专业知识、鉴定能力等个人不具备的硬性能力'
  - '- 整合外部现成资源：唱吧/全民K歌素人音频库、合作弹唱者网络、公开资料整理、第三方专业机构'
  - '- 重组交付流程：个人负责流程设计、质检、客户沟通；外部资源负责核心技能环节'
  - '**关键性质**'
  - '- 解耦性：个人能力与业务交付解耦，个人专注流程把控与客户体验'
  - '- 低成本：利用边际成本近零的数字化资源（音频、模板、公开数据）替代高成本人力'
  - '- 可规模化：标准化交付物+外部供应链网络，突破个人时间/精力上限'
  - '**典型例子**'
  - '- 为TA点歌：不会弹唱，通过“招募合作弹唱者”+“剪辑唱吧素人音频”双路径跑通，订单接到手软'
  - '- 碳中和项目：不懂专业，通过“3天速成输入”+“大白话框架化输出”+“证书/培训资源对接”变现百万'
  - '- AI四维预测：不懂AI底层算法，通过“提示词迭代”+“医院渠道合作”构建B2B2C模式'
  - '**边界条件**'
  - '- 交付物必须可数字化/标准化：现场服务、强人际互动类业务难以完全重组'
  - '- 质量把控是生命线：外部资源质量不稳定需建立严格验收SOP（如音频质检、内容审核）'
  - '- 合规风险：虚拟资料版权、医疗/法律类资质外包、用户隐私保护需提前布局规避'
  - '...'
  sources:
  - paper: docs/202305/20230516_073.md
    role: origin
  excerpts:
  - 思考二：我就想自己做，不想合作，怎么办？那就分析下我们最终交付了啥？...到底，其实最终交付的是一个视频。剪视频还不简单么~ 那如何满足视频中演唱的内容？只需要有一段素人唱歌的音频即可，那上哪弄呢？唱吧，全民K歌就有啊
  - 思考一：我不会，但有人会，找会弹唱的人合作...多找几个，男女都找，各种音色的都要
  - 我是学财经的，碳中和我也才听说，也是个纯小白。那就现学呗...我花了3天时间高强度输入，同步输出了几条视频，发到第三条的时候，500万播放来了。这个号2个月内为我带来100多万利润
  - 以上，就是思考过程。有了解决方案，跑通流量，订单接到手软。
- 'no': 4
  name: AI提示词迭代优化法 —— 用最难案例倒逼出扛打的标准化指令集
  points:
  - '**为什么需要这个概念？**'
  - '- 生成式AI（如Midjourney/SD）可控性差、随机性强，直接出图难以稳定商用'
  - '- 通用提示词模板泛化能力弱，垂直场景下细节崩坏（多指、肤色异常、不似）导致废片率高'
  - '- 需要一套可复用、可沉淀、可标准化的Prompt工程方法，将AI从“盲盒”变“流水线”'
  - '**核心定义**'
  - '- 基准案例法：精心挑选最难、最具代表性的边界案例（如模糊四维图、特殊肤色、复杂构图）'
  - '- 垫图生成：上传基准图作为Image Prompt/ControlNet参考，结合初版提示词生成'
  - '- 缺陷清单化：系统记录每轮生成的具体问题（皮肤坑洼、肤色不均、瑕疵、五官不似、视角错误）'
  - '- 针对性加词：按缺陷类型添加负面词（去坑洼）、修饰词（肤色均匀）、结构词（五官细节、视角控制）'
  - '- 回归测试：用10-20个多风格/多难度案例跑测，无重大缺陷则定版，沉淀为“扛打关键词组”'
  - '**关键性质**'
  - '- 逆向思维：不追求“一条Prompt通吃”，而是“基准案例定标准、边界案例测稳健”'
  - '- 资产化：沉淀出的关键词组是可复用、可传承、可估值的核心数字资产'
  - '- 持续迭代：模型版本更新、新场景接入时，仅需在基准案例库上增量测试调优'
  - '**典型例子**'
  - '- 四维预测项目：从“垫图生成→皮肤坑洼加负面词→肤色不均加修饰词→不似加五官结构词→多案例回归”5轮迭代，得出稳定关键词组'
  - '- 可复用至：同类人像还原、老照片修复、虚拟试穿等所有“参考图生成高相似度人像”场景'
  - '**边界条件**'
  - '- 依赖特定模型版本：Midjourney V5/V6、SDXL等模型迭代后关键词权重失效需重测'
  - '- 仅解决“相似度/可控性”问题：无法解决AI原生缺陷（如文本生成、逻辑推理、长视频一致性）'
  - '- 需领域知识支撑：懂摄影光影、人像解剖、色彩理论者迭代效率远高于纯试错'
  - '...'
  sources:
  - paper: docs/202305/20230516_073.md
    role: origin
  excerpts:
  - 1、特意挑了一张看起来就很不好还原的四维图，先垫图... 2、问题出现了，就解决问题，加上相关的关键词，除去皮肤上的坑洼... 3、继续解决问题... 4、再加上关键词...
    5、又尝试了其他的案例，出现不太像的问题，于是加上视角，以及五官细节的描述，还原度到位了。
  - 以上思考和实践，我们就有了扛打的关键词组。
  - 怎么把四维彩超变成相似度较高的宝宝图片呢？
  - 特意挑了一张看起来就很不好还原的四维图，先垫图，用一套简单的关键词，让它生成中国长相的婴儿...
- 'no': 5
  name: 热点事件极速入场法 —— 蹭政策/热点红利的“现学现卖”变现范式
  points:
  - '**为什么需要这个概念？**'
  - '- 宏观政策/重大事件（如碳中和、ChatGPT发布）会引发全网指数暴涨，形成短周期、高确定性的流量红利窗口'
  - '- 传统“深耕赛道”反应太慢，错过红利期；盲目跟风又无核心壁垒，陷入同质化内卷'
  - '- 需要一套“快速捕捉→极速验证→现学现卖→多渠道变现”的标准化动作包'
  - '**核心定义**'
  - '- 捕捉信号：监测权威发布、热搜榜单、行业大会、指数工具（百度指数/微信指数/抖音创意中心）异动'
  - '- 极速验证：直奔评论区提取高频提问（“是什么”、“怎么赚钱”、“怎么入行”、“考证有用吗”），确认大众认知断层与付费意愿'
  - '- 现学现卖：3-7天高强度输入，同步输出“大白话、条理化、框架化”内容（视频/文档/直播），不求学术深度，只求认知门槛最低'
  - '- 多维变现：资料包（低客单引流）、证书合作（高客单分成）、企业培训（B端高复购）、资源对接（信息差佣金）'
  - '**关键性质**'
  - '- 时间窗口短：通常1-3个月红利期，过期即变常识，需极速执行'
  - '- 认知套利：利用“专业信息”与“大众认知”的时间差，赚认知门槛降低的钱'
  - '- 产品形态灵活：不绑定单一形式，视频、文档、社群、课程均可承载'
  - '**典型例子**'
  - '- 碳中和项目：大大讲话后指数暴涨→评论区“啥是碳中和/怎么赚钱”→3天速成输出→2个月变现100万+（资料包/证书/培训/资源对接）'
  - '- 可迁移至：双碳、元宇宙、ChatGPT应用、银发经济、低空经济等所有“政策驱动+认知断层”赛道'
  - '**边界条件**'
  - '- 仅适合“认知型/工具型/资源型”产品：重资产、重供应链、重研发业务无法极速跟进'
  - '- 合规红线：证书类需核实机构资质、财税类需规避非法代理、医疗类严禁无资质传播'
  - '- 红利期结束后需转型：单一热点项目生命周期短，必须持续挖掘新热点或沉淀为长期IP/私域资产'
  - '...'
  sources:
  - paper: docs/202305/20230516_073.md
    role: origin
  excerpts:
  - 2021年，在大大就碳中和发表讲话后，碳中和的全网指数暴涨...刷了很多视频，尤其是看评论区，高频的评论是‘碳中和是啥’...
  - 我花了3天时间高强度输入，同步输出了几条视频...这个号2个月内为我带来100多万利润
  - 现学现卖，将复杂专业信息转化为‘大白话、条理化、框架化’的内容产品
  - 资料包、证书合作、企业培训、资源对接
- 'no': 6
  name: 非标服务标准化拆解法 —— 将定制化服务拆解为可复制的标准化交付流水线
  points:
  - '**为什么需要这个概念？**'
  - '- 非标服务（定制视频、咨询方案、代写文案）高度依赖个人经验，难以复制、培训、规模化'
  - '- 客户需求看似千差万别，实则可拆解为有限的标准化模块组合'
  - '- 只有标准化，才能实现外包协作、质量把控、SOP沉淀、边际成本递减'
  - '**核心定义**'
  - '- 需求拆解：将用户模糊需求（如“帮我表白”）拆解为标准化交付物清单（视频文件、背景音乐、字幕特效、交付时间）'
  - '- 流程模块化：将交付流程切分为“需求确认→素材准备→核心制作→质检包装→交付售后”标准节点'
  - '- 关键节点外包/工具化：核心制作环节（弹唱、剪辑、写作、设计）通过外包网络/AI工具/模板库标准化解决'
  - '- 质检SOP化：建立可量化的验收标准（视频时长、清晰度、内容合规、交付格式），替代主观“觉得好”'
  - '**关键性质**'
  - '- 复制性：新人按SOP即可上手，不依赖资深专家经验'
  - '- 规模性：单人可并行管理多个订单，突破个人时间上限'
  - '- 资产化：SOP、模板库、供应商名单、质检清单均为可估值的组织资产'
  - '**典型例子**'
  - '- 为TA点歌：将“定制表白视频”拆解为“沟通需求→选歌/改词→对接弹唱素材→剪辑合成→发视频”5步SOP，单人日单量从<5提升至>50'
  - '- 写作店铺：将“代写文案”拆解为“沟通大纲→匹配写手→初稿交付→修改定稿”流程，配合写手分级体系实现年入50万+'
  - '- 碳中和培训：将“企业培训”拆解为“标准课件包+考核题库+证书对接”三件套，实现批量交付'
  - '**边界条件**'
  - '- 核心价值环节不可过度标准化：如高端咨询的“诊断洞察”、艺术创作的“审美判断”仍需专家把关'
