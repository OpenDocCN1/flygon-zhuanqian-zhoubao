life_analogy:
- 想象RPA+AI自动化是一个**智能工厂流水线**：
- '- **ChatGPT** = **首席设计师**：只负责根据需求单(Prompt)创作设计稿(内容)，不碰具体生产'
- '- **RPA机器人** = **自动化工人**：负责搬运原料(Excel数据)、送达设计师、等待设计完成、取回成品、整理归档'
- '- **Excel表格** = **原料仓库+成品仓库**：A列存原料(标题)，B列存加工单(Prompt)，C列收成品(文案)'
- '- **流式输出等待** = **质检工序**：必须等设计师画完最后一笔(生成结束)，工人才能拿走成品，不然拿到的是半成品'
- '- **手动跑通先行** = **试产验证**：流水线正式开工前，必须先由师傅手工走一遍全流程确认无误，再交给机器人量产'
- 就像工厂分离‘研发设计’与‘生产制造’一样，自动化核心是将‘内容生产’与‘流程执行’解耦，各司其职。
summary:
- concept: ChatGPT+RPA协同模式
  desc: LLM负责内容生成，RPA负责流程执行，标准化接口解耦协作
- concept: 提示词公式化/参数化
  desc: Excel CONCAT函数分离固定指令模板与变量数据，实现Prompt批量化管理
- concept: 可视化拖拽式RPA开发
  desc: 影刀RPA组件化封装，13次拖拽构建全流程，所见即所得降低门槛
- concept: 流式输出等待机制
  desc: 针对网页版ChatGPT逐字输出，显式等待生成完成标志(停止按钮消失/复制图标出现)再抓取
- concept: 需求驱动学习闭环
  desc: 发帖验证需求→接单驱动速成→交付沉淀SOP，形成正向飞轮降低学习成本
- concept: 手动跑通是自动化前提
  desc: SOP验证业务可行性(0→1)，RPA仅解决规模化复制(1→100)，不可本末倒置
- concept: 工具组合替代单一平台
  desc: 专用小工具拼装最优链路(选品/提取/生成/视频/分发)，成本效率优于大平台或全人工
- concept: RPA自学门槛低见效快
  desc: 影刀RPA等工具提供官方分级教程，业务人员可自学速成交付长尾自动化需求
exercises:
- 'no': 1
  title: 设计一个Excel提示词批量生成器
  contents:
  - 场景：需要为100个小红书笔记标题生成对应的爆款文案Prompt
  - 1. 在Excel A列填入100个标题(如：'普通人副业月入5000的3个路径')
  - 2. 设计B列公式，将固定指令模板与A列标题拼接
  - '   提示词模板参考：''请以小红书爆款风格，针对标题「{标题}」写一篇笔记，要求：前3秒钩子+干货步骤+引导互动，带Emoji、分段清晰'''
  - 3. 下拉填充B列，检查生成的Prompt结构是否统一
  - 回答问题：
  - '- 如果标题中包含引号，CONCAT公式会如何处理？如何规避？'
  - '- 如何将生成的B列Prompt批量导入RPA流程？'
  - '- 当Prompt模板需迭代升级时，如何实现全量更新而不改动数据源？'
- 'no': 2
  title: 影刀RPA流程设计：网页版ChatGPT自动化交互
  contents:
  - 任务：设计影刀RPA流程节点，实现‘读取Excel B列Prompt → 发送ChatGPT网页版 → 等待生成完成 → 抓取回复 → 写回C列’
  - 请按顺序列出关键组件及配置要点：
  - 1. 获取网页句柄：目标URL、浏览器类型
  - 2. 打开/激活Excel：文件路径、工作表名
  - 3. 循环遍历：起始行、结束行、步长
  - 4. 循环体内关键动作节点（按执行顺序）：
  - '   - 读取单元格：B列Prompt'
  - '   - 聚焦输入框：ChatGPT网页版输入框选择器'
  - '   - 发送内容：模拟键盘输入/粘贴'
  - '   - 【核心难点】等待生成完成：判定条件选择器(如''停止生成按钮消失''或''最后一条消息的复制图标出现'')、最大超时时间'
  - '   - 抓取文本：最后一条回复元素选择器、获取属性(innerText)'
  - '   - 写入单元格：C列、当前行'
  - 回答问题：
  - '- 为什么不能使用''固定等待N秒''替代''显式等待元素状态''？'
  - '- 如果ChatGPT网页版更新UI导致选择器失效，如何快速定位并修复？'
  - '- 如何处理生成超时、网络异常、内容违规拦截等异常分支？'
- 'no': 3
  title: 业务流程自动化可行性评估清单
  contents:
  - 某团队想用RPA自动化'每日从竞品公众号采集爆款标题 → ChatGPT改写 → 发布到自有矩阵号'的流程
  - 请基于'手动跑通是自动化前提'定律，设计评估清单判断该业务是否适合上RPA：
  - 1. 手动流程标准化度检查：
  - '   - 采集规则是否固定(关键词/账号/时间范围)？'
  - '   - 改写Prompt模板是否稳定？输出格式是否可校验？'
  - '   - 发布流程(登录/选封面/填标签/定时)是否完全标准化？'
  - 2. 异常处理覆盖度：
  - '   - 采集反爬/IP封禁如何处理？'
  - '   - ChatGPT输出不合格(字数/违规/风格偏差)如何重试？'
  - '   - 发布审核不通过/限流如何兜底？'
  - 3. ROI测算：
  - '   - 手动单次耗时 vs RPA开发维护成本(含选择器维护)'
  - '   - 日处理量级是否达到''1到100''规模化阈值？'
  - 4. 工具选型建议：
  - '   - 采集环节：RPA模拟 vs 官方API vs 第三方采集工具'
  - '   - 改写环节：网页版ChatGPT+RPA vs 官方API调用'
  - '   - 发布环节：RPA模拟 vs 官方开放平台接口'
  - 回答问题：
  - '- 哪个环节最不适合用RPA？为什么？'
  - '- 若手动流程尚未跑通(如改写质量不稳定)，强行上RPA会带来什么后果？'
  - '- 如何设计''最小可行性自动化''(MVP)分阶段落地？'
