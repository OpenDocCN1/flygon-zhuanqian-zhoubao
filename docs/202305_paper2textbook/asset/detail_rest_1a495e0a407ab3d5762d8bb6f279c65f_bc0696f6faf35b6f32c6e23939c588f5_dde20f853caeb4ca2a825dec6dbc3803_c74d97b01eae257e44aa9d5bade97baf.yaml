learning_targets:
- 理解OpenAI风控的核心判定逻辑与IP归属地风险分级
- 掌握DashiSIM多APN漫游方案获取美/欧/新原生IP的配置实操
- 掌握Ultra Mobile $3 PayGo实体卡结合WiFi Calling实现长期保号的完整流程
- 掌握华美银行Velo零门槛开户与Wise多币种电子卡两大真实金融身份支付方案的落地步骤
- 能够将网络-身份-支付三位一体基建复用至跨境业务全场景，构建长期复利资产
concept_map:
- ChatGPT Plus 长期稳定访问基建
- ├── 封号核心判定：IP归属地为第一风控维度
- │   ├── 亚洲IP高风险名单（台/日/港命中率40%）
- │   ├── 账号异常识别特征（无法加载历史/输入框发送失败）
- │   └── 账号养护三原则（拒亚洲IP/拒频繁换IP/拒一IP多号）
- ├── 网络层基建：DashiSIM多APN漫游获取美/欧/新原生IP
- │   ├── APN切换技术原理（us.dashi/eu.dashi/sg.dashi）
- │   ├── 国内漫游走中国移动5G直连（零月租/按需充值）
- │   ├── 单IP单号固定使用（物理隔离网络环境）
- │   └── 备选方案：CMLINK新加坡漫游卡（需海外办理激活）
- ├── 身份层基建：Ultra Mobile $3 PayGo实体卡+WiFi Calling长期保号
- │   ├── MVNO保号卡核心价值（低成本维持美号存活）
- │   ├── WiFi Calling漫游技术（境内无实体信号接收短信）
- │   ├── eSIM转移支持（释放物理卡槽）
- │   └── 自动扣费保号机制（绑定国内卡$5/月含税）
- ├── 支付层基建：真实金融身份 > 虚拟卡/临时接码
- │   ├── 方案A：华美银行Velo零门槛开真实美借记卡/信用卡（FDIC成员）
- │   ├── 方案B：Wise护照实名+$20入金即时生成电子借记卡（真实账单地址/CVV）
- │   ├── 虚拟卡共享BIN污染连坐风控（长期不可控）
- │   └── 真实账单地址与CVV的合规性优势
- └── 基建复用价值：跨境业务长期资产
- '    ├── 身份锚定复用（注册FB/推特/电报/ChatGPT等全场景）'
- '    ├── 收款通道复用（Wise多币种本地账户收USD/EUR/GBP/JPY）'
- '    ├── 信用资产积累（华美Velo申请真美信用卡建立FICO信用史）'
- '    └── 边际成本趋零（一次投入终身复用）'
life_analogy:
- 想象这套基建是**出海创业的“三件套身份证”**：
- '- **网络层（DashiSIM）** = **一张能随时切换‘美国/法国/新加坡’户籍的电子通行证**：不用跑腿换证，拨动开关（APN）即可变身当地原住民网络身份，彻底躲过‘亚洲户籍高风险’的查户口红线。'
- '- **身份层（Ultra Mobile）** = **一张长期有效、月租仅几十块钱的‘美国实体手机号身份证’**：插在手机里、开个WiFi Calling，躺在国内也能收美国短信验证码，比租接码平台靠谱百倍，还能注册全套海外账号。'
- '- **支付层（华美Velo/Wise）** = **一张真实的‘美国银行信用卡’+‘全球多币种收款账户’**：不是那种随时会被封的虚拟黑卡，而是受FDIC保险保护、能积累美国信用记录、能收全球客户款项的真金融身份。'
- 这三样东西组合在一起，解决ChatGPT Plus订阅只是‘顺带手’的事，真正价值是搭建起了你**跨境业务的永久基础设施**，一次投入，终身复用，边际成本趋零。
summary:
- concept: 封号核心判定：IP归属地为第一风控维度
  desc: OpenAI风控以地域画像为首要指标，亚洲IP（台/日/港）命中率约40%，账号属性非主导因素
- concept: 账号养护三原则
  desc: 拒绝亚洲IP、拒绝频繁换IP、拒绝一IP多号，构成网络层生存底线
- concept: DashiSIM多APN漫游方案
  desc: 一张实体卡通过切换APN(us.dashi/eu.dashi/sg.dashi)获取美/法/新原生IP，国内走移动5G，零月租按需充
- concept: Ultra Mobile $3 PayGo保号卡
  desc: MVNO实体卡+WiFi Calling漫游，绑定国内卡自动扣费$5/月，长期接收验证码，支持eSIM
- concept: 华美银行Velo零门槛开户
  desc: 无需护照/签证/美地址/预存款，远程开真实美借记卡/信用卡，FDIC成员资金安全
- concept: Wise多币种电子卡
  desc: 护照实名+$20入金即时生成含真实账单地址/CVV的电子卡，多币种本地收款账户一次开齐
- concept: 虚拟卡污染风险
  desc: 共享BIN卡段必然因他人违规连坐风控，专业人士坚决规避，长期不可控
- concept: 基建复用资产
  desc: 真实美银行账户+实体美手机号，可复用于海外账号注册、跨境收款、美信用史建立，边际成本趋零
exercises:
- 'no': 1
  title: 风控场景诊断与归因分析
  contents:
  - 场景：用户使用日本节点机场VPN登录ChatGPT Plus账号，提示“not available in your country”，随后切换至香港节点登录，提示“无法加载历史信息”。
  - 问题：
  - 1. 这两个报错分别代表网络层限制还是账号层面封禁？依据是什么？
  - 2. 根据‘封号核心判定’定律，为何切换香港节点反而导致账号被封？
  - 3. 若该用户改用DashiSIM设置APN为us.dashi，是否能恢复访问？原理是什么？
- 'no': 2
  title: 三位一体基建方案选型与成本测算
  contents:
  - 假设你是一名准备长期从事TikTok Shop美区跨境电商的创业者，需同时解决：店铺注册美号验证、广告投放扣费、美金收款结汇、ChatGPT Plus辅助运营四大需求。
  - 问题：
  - 1. 网络层：对比DashiSIM美IP方案与自建VPS/购买机场节点，从IP纯净度、风控通过率、长期维护成本三维度分析优劣。
  - 2. 身份层：Ultra Mobile $3 PayGo卡首年总成本约几元人民币？相比接码平台单次几元，长期持有10个海外账号注册需求下的边际成本如何计算？
  - 3. 支付层：华美Velo实体卡邮寄时效与Wise电子卡即时开通的差异，对‘广告投放扣费’这一高频刚需场景的影响？建议主用哪张卡？为何？
- 'no': 3
  title: 基建资产复用路径设计
  contents:
  - 已完成DashiSIM（美IP）、Ultra Mobile（美号）、华美Velo（美借记卡）、Wise（多币种账户）四件套部署。
  - 问题：
  - 1. 设计一套‘注册海外社媒矩阵账号（FB/Ins/Twitter/TikTok/Telegram）→ 养号 → 接入广告投放 → 收款结汇’的标准化SOP，标注每一步复用的基建组件。
  - 2. 华美Velo实体卡激活后，如何规划申请美国信用卡（如Amex/Chase）建立FICO信用史的路径？关键节点有哪些？
  - 3. Wise多币种账户收到美金后，如何通过‘换汇→提现国内银行卡’实现结汇？汇率损耗与时效如何估算？对比传统离岸账户/地下钱庄优劣。
