  - '**边界条件**'
  - '- 仅适用于“高不确定性、小团队、快速迭代”的0-1/1-10阶段，成熟期需转为周会/月会制'
  - '- 依赖核心决策者具备系统性思考与高效组织能力，无此类人才飞阅会易变成吐槽大会'
  - '- 会议纪要必须落笔成文、追踪执行，否则形同虚设'
