  name: 风控三重防线体系 —— 平台担保+本地鉴定+关系免检的假货防御纵深
  points:
  - '**为什么需要这个概念？**'
  - '- 二奢假货风险是行业生死线，单一验货手段（如仅靠验货宝）成本高、时效慢、赔付难'
  - '- 随业务规模扩大，假货概率必然上升，必须建立分层、分级、可量化的风控体系'
  - '**核心定义**'
  - '- 构建“平台担保+本地鉴定+关系免检”三层防假体系，配合“小绿牌”标准化流转'
  - '- 第1层：闲鱼验货宝（78元含赔），平台背书、标准化流程、适合标品/中小单'
  - '- 第2层：本地鉴定师（30元不包赔/90元包赔/软件辅助），灵活、可现场、适合非标/大单'
  - '- 第3层：深度绑定鉴定师关系（免费/优先），成本最低、时效最快、适合高频/核心供应链'
  - '**关键性质**'
  - '- 成本递减：单次验货成本从78元→90元→30元→0元，随业务规模与关系深度递减'
  - '- 时效递增：从平台流程（天级）→本地上门/寄送（小时级）→关系优先（分钟级）'
  - '- 信任跃迁：从“平台信任”→“专家信任”→“关系信任”，最终内化为“小绿牌”行业标准信任'
  - '**典型例子**'
  - '- 作者实操：前期全靠验货宝，后期建立本地鉴定师网络，最终与核心鉴定师深度绑定免费验货'
  - '- 供应链端：头部供应链自带小绿牌体系，作者团队通过鉴定师证书准入资产获得信任互认'
  - '- 前员工创业：中古团、找货团均依靠鉴定能力为核心竞争力，风控成本极低'
  - '**边界条件**'
  - '- 第3层关系免检仅限极高信任度的核心渠道，泛滥使用必遭背刺'
  - '- 验货宝/本地鉴定师仅能鉴定“真假”，无法鉴定“新旧/成色/配件完整度”，需自建成色把控SOP'
  - '- 随行业规范化，“小绿牌”可能演变为准入牌照，成本优势消失，需持续构建新护城河'
  - '...'
