  - '- 强制对齐认知、压缩试错周期，是早期小团队混沌中提取确定性的核心管理工具'
  - '**关键性质**'
  - '- 高频性：早期每天开会复盘，不断调整业务方向（如分人找货、分人卖货）'
  - '- 结构化：固定议程（复盘数据、对齐目标、决策分工、定责任人、设截止期）'
  - '- 决策导向：不讨论大方向，只解决当下阻塞问题，会议产出必须是可执行的行动清单'
  - '**典型例子**'
