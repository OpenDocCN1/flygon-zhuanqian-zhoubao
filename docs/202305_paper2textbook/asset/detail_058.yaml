  - '**核心定义**'
  - '- 根据货品属性匹配最优出货渠道：标品/高周转→闲鱼/得物/同行群批发/固定直播间长供；非标/高毛利→包展/私域高净值/定向直播间；积压/尾货→包展清仓/同行低收'
  - '- 核心原则：快进快出，资金不沉淀，动销率第一、利润率第二'
  - '**关键性质**'
  - '- 闲鱼/得物：标品流转最快、流程标准、适合批量走量，即使随意挂卖也有商家主动找你收'
  - '- 固定直播间长供：针对每个直播间画像定向备货，建立稳定供需关系，降低寻品成本'
  - '- 包展/私域高净值：非标高毛利品唯一出口，需现场看货/视频验货、依赖人际信任、单笔利润高但周转慢'
  - '- 尾货处理：包展现场清仓/同行低价收割，接受低价换现金流，绝不让库存过夜'
  - '**典型例子**'
  - '- 全新爆款：闲鱼/得物/同行群/固定直播间，15天物流+3天抛售，单件净利1000+'
  - '- 中古深库存：包展/私域高净值/定向直播间，月转300万2圈、月利60万'
  - '- 积压尾货：包展清仓/同行低收，亏本也要回笼资金'
  - '**边界条件**'
  - '- 要求对每个渠道的用户画像、价格容忍度、结算周期、退货率了如指掌'
  - '- 固定直播间长供模式需直播间端具备稳定流量与转化，否则会成烂尾供应链'
  - '- 包展/线下渠道受疫情/政策/季节性影响大，不可作为唯一依赖渠道'
  - '...'
