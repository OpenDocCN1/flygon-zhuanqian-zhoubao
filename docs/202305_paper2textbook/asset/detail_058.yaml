  name: 鉴定师证书准入资产 —— 小绿牌是正品流通的标准化信任货币
  points:
  - '**为什么需要这个概念？**'
  - '- 二奢核心痛点是假货风险，平台验货宝贵且赔付慢，自建鉴定团队成本高、信任度低'
  - '- 行业缺乏统一标准，“小绿牌”作为准入门槛与信任背书，能显著降低收货风控成本、提升货品流通效率'
  - '**核心定义**'
  - '- 将“鉴定师/养护师证书”视为行业核心准入门槛与信任背书资产'
  - '- 新人必须考证（7天脱产、2万学费），不仅为了技能，更为了建立“小绿牌”标准化信任体系'
  - '- 证书随行业规范化升值，是可积累、可复用的隐性资产'
  - '**关键性质**'
  - '- 信任货币：小绿牌=正品流通标准，持有者交易摩擦成本极低，非持有者每单需支付78元验货宝或90元本地鉴定费'
  - '- 风控分层：第1层闲鱼验货宝（78元含赔）→第2层本地鉴定师（30不包赔/90包赔）→第3层深度绑定鉴定师关系（免费/优先）'
  - '- 准入壁垒：证书获取难度随行业发展递增（考试更严、学费更高），早考早享受红利'
  - '**典型例子**'
  - '- 作者亲历：崩盘重组后依靠鉴定师证书体系快速建立信任，与头部供应链达成深度绑定'
  - '- 前员工创业：中古团、定向找货团均以鉴定能力为核心竞争力，月利十几万到60万'
  - '- 行业趋势：正品有流通价值，小绿牌是正品的标准，鉴定师培训费约2万、6天培训+1天考试'
  - '**边界条件**'
  - '- 证书仅解决“鉴定能力背书”，不解决“货源渠道、销售渠道、资金周转”等核心商业问题'
  - '- 适用于二奢、珠宝、名表等强鉴定需求行业；标品弱鉴定行业无此刚需'
  - '- 随着AI鉴定技术发展，人工鉴定师证书价值可能面临长期贬值风险'
