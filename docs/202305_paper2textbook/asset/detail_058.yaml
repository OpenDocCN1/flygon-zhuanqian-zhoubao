  - 重资产供应链的关键在于动销率，而动销率受到前端直播间需求和后端源头供应链的影响。
  - 我们找到了一家行业内的头部供应链以赋能直播 + 深度绑定的方式进行合作。
  - 重新明确了两位主播的不同路线...作为接下来几个月的复制模板，不断复制直播团队。
  - 中古深库存团...一个月资金转了 300 万，能转两圈...一个月有 60 万的利润。
- 'no': 5
  name: 同行社交裂变增长法 —— 同行即客户、即供应商、即情报源
  points:
  - '**为什么需要这个概念？**'
  - '- 二奢渠道极度分散、隐蔽，平台流量昂贵且不精准，传统广告获客成本极高'
  - '- 同行群体天然聚集了双向流量需求：既是买家也是卖家，也是最懂行情的情报源'
  - '**核心定义**'
  - '- 利用微信群、朋友圈、包展等同行社交网络，通过“建群-拉群-换群-输出价值”建立渠道护城河'
  - '- 核心逻辑：同行即客户、即供应商、即情报源，通过高频展示货盘（微商相册）和提供撮合服务，低成本获取双向流量'
  - '**关键性质**'
  - '- 避封SOP：养号1个月+单日加好友≤12人+换群间隔3小时/次≤10人+广告图≤3张/4小时+朋友圈日更100条详细描述词'
  - '- 价值交换：新人通过作者找到合作伙伴，作者获取行业眼睛与渠道影响力，形成正向飞轮'
  - '- 渠道分层：闲鱼/小红书引流加微→微信群/包展/LGE展会线下→奢当家SaaS/大型回收商/洗护平台/日本中古交易所/得物供货→个人卖家直收'
  - '**典型例子**'
  - '- 作者建60+同行群，成行业节点，新人通过他找伙伴，他通过他们了解行情'
  - '- 朋友圈日更100条详细描述词，因同行搜索朋友圈是找货第一步'
  - '- 微信生态避封参数实测有效，支撑低成本、高信任度的双向渠道建设'
  - '**边界条件**'
  - '- 仅适用于“同行高频互动、信息不对称大、信任成本高”的非标品行业'
  - '- 需投入大量时间维护社群、产出内容、做撮合服务，非一次性投入'
  - '- 微信生态规则收紧（加好友限制、群封禁）可能随时失效，需持续迭代避封SOP'
  - '...'
