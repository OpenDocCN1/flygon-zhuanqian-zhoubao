    role: origin
  excerpts:
  - 内容也很简单，很容易复制，于是我自己简单学习了下ps，就开始了。
  - 找了个兼职美工帮我批量做图片。保持日更频率后，一个月利润有2000。之后我开始复制了账号去放大
  - 账号合作报价从500降到300再到200，我终于意识到不能再继续了。于是我把20个账号缩减到3个，收益不好的全部卖掉，出售账号赚了2w+。
- 'no': 8
  name: 搬运混剪+佣金阈值筛选法 —— “不做内容，只搬运流量”
  points:
  - '**为什么需要这个概念？**'
  - '- 新手缺乏原创内容能力，但需快速验证“流量→变现”闭环'
  - '- 平台对搬运/混剪容忍度存在红利窗口期(早期宽松、后期收紧)'
  - '- 佣金率是决定“流量能否变现金”的核心变量，常被新手忽视'
  - '**核心定义**'
  - '- 素材源：跨平台(抖音/快手/小红书)搬运同赛道爆款视频/图文'
  - '- 去重处理：裁剪/镜像/调速/滤镜/混剪/加字幕/改MD5等技术手段通过平台查重'
  - '- 测品逻辑：发布测试流量 → 关注“播放量/点击率/出单量/佣金率”四大指标'
  - '- 佣金阈值：设定最低佣金比例(如>10%/单价>20元)，低佣金产品虽易出单但无利润，直接剔除'
  - '- 迭代优化：建立“高佣金+高转化+易搬运”选品库，持续复制放大'
  - '**关键性质**'
  - '- 低门槛：零原创能力要求，核心竞争力为“选品眼光+去重技术+测品速度”'
  - '- 高风险：平台算法升级/版权打击/原创保护政策收紧会导致流量瞬间归零'
  - '- 短周期：单账号/单品生命周期短(通常1-3个月)，需持续换号/换品/换平台'
  - '**典型例子**'
  - '- 作者多多视频：搬运抖音/快手/小红书视频 → 爆款视频日入200+ → 发现佣金率0.01-0.09元(亏本) → 筛选高佣金产品 → 小爆日入200+
    → 规则变更流量归零止损'
  - '- 视频号带货：搬运抖音/快手口播视频 → 剪映去重 → 随心推/千川投流测品 → 爆款定制链接/SKU阶梯定价 → 矩阵放大'
  - '**边界条件**'
  - '- 严禁搬运“强版权/强人设/强原创声明”内容(如头部博主原创/影视综艺/音乐)'
  - '- 去重技术需跟进平台算法迭代，静态去重方案(仅改MD5/镜像)半衰期极短'
  - '- 必须建立“佣金/利润/ROI”核算体系，单纯追求GMV/播放量/出单量是伪繁荣'
  sources:
  - paper: docs/202305/RaMIdAe9aoB1XcxwSRocx2mmnad.md
    role: origin
  excerpts:
  - 直接从抖音快手和小红书搬运视频到多多视频发布，很快也出了爆款视频。
  - 犯了个致命错误：没有留意佣金比例。那条爆款视频带来的佣金全部都是0.01元～0.09元……
  - 发现问题后，我开始找高佣金比例的产品，也小爆了几个视频，每天佣金收入有200多
- 'no': 9
  name: 注意力守恒与正反馈循环定律 —— 为什么“多做”反而“全不成”
  points:
  - '**为什么需要这个概念？**'
  - '- 直觉认为“多尝试几个项目总能成一个”，实则违背注意力稀缺性铁律'
  - '- 缺乏“正反馈阈值”概念，导致在低投入区间徘徊无法突破'
  - '- 需要数学化模型指导资源分配决策'
  - '**核心定义**'
  - '- 注意力守恒：单位时间内的高质量注意力总量固定(约3-4小时深度工作上限)'
  - '- 正反馈阈值：单项目必须投入超过临界注意力量(如连续2周日投2h+)，才能触发“出单/爆款/正向数据”正反馈'
  - '- 正反馈循环：正反馈 → 多巴胺/信心/动力 → 更多投入 → 更强正反馈 → 良性飞轮'
  - '- 分散陷阱：N个项目平分注意力 → 单项目投入<阈值 → 无正反馈 → 动力衰退 → 全部放弃'
  - '**关键性质**'
  - '- 非线性：注意力投入与收益呈S型曲线，阈值前收益≈0，阈值后指数增长'
  - '- 不可替代：无法用“碎片时间/低质量注意力”替代“深度工作注意力”'
  - '- 单一性：同一时间窗口内，仅能支撑1个核心项目突破阈值'
  - '**典型例子**'
  - '- 作者同时操作闲鱼/多多/视频号/资料号/头像号 → 单项目投入极低 → 总收益<1500元/半年'
  - '- 聚焦小红书后：单项目投入全部注意力 → 矩阵放大 → 峰值月入1w+ → IP变现课程2w+'
  - '**边界条件**'
  - '- “主业+副业”双轨制下，副业可用注意力更少，阈值更高，聚焦更关键'
  - '- 团队/外包可部分替代执行层注意力，但“决策/选品/策略”核心注意力不可外包'
  - '- 并行探索期(如前3个月)可并行测试3-5个项目，但必须设定“止损线/评估期”强制收敛'
  sources:
  - paper: docs/202305/RaMIdAe9aoB1XcxwSRocx2mmnad.md
    role: origin
  excerpts:
  - 理想很美好，现实情况是，只要你把注意力分散，那每一个你都干不好，拿不到正反馈，就没法坚持下去。
  - 这是我第二个至暗时刻，项目太多，反而丢了自己的目标。
- 'no': 10
  name: 主业关联性护城河论 —— 最好的副业，藏在主业里
  points:
