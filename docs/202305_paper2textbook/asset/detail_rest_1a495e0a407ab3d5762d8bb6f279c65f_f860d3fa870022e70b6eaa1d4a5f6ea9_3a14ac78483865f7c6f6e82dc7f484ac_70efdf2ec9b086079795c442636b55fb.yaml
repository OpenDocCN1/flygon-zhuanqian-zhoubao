learning_targets:
- 理解副业成长的三阶段模型及其背后的注意力守恒原理
- 掌握聚焦筛选五维决策标准的具体内涵与实操打分方法
- 了解个人IP杠杆化路径：从单一项目收益到零边际成本产品矩阵的跃迁
- 能利用高质量社群进行跨项目思维迁移与认知降维打击
- 能识别主业关联性护城河，避免裸奔式跨界创业
- 能建立引流文档资产化体系，实现私域信任前置与高客单转化
concept_map:
- 副业认知与项目筛选体系
- ├── 副业三阶段进化模型
- │   ├── 第一阶段：无项目焦虑期  —— 缺乏项目认知与安全感
- │   ├── 第二阶段：多项目迷茫期  —— 注意力分散、低于正反馈阈值、全军覆没
- │   └── 第三阶段：单赛道聚焦期  —— 五维筛选 All in、打造个人IP、实现复利
- ├── 聚焦筛选五维漏斗标准
- │   ├── 维度一：有过成绩  —— 已跑通最小商业闭环
- │   ├── 维度二：有独到方法论  —— 形成可复用SOP
- │   ├── 维度三：方法论可复制  —— 标准化、文档化、可外包
- │   ├── 维度四：与主业关联  —— 技能/资源/认知迁移、降维打击
- │   └── 维度五：个人喜好  —— 内驱力支撑穿越周期
- ├── 核心底层定律
- │   ├── 注意力守恒与正反馈循环定律  —— 单项目投入必须突破阈值
- │   ├── 主业关联性护城河论  —— 主业提供独到见解与低成本试错环境
- │   └── IP资产化优于项目收益论  —— 零边际成本产品矩阵抗周期
- ├── 社群杠杆与认知跃迁
- │   ├── 社群作为认知跃迁加速器  —— 提供元认知与异质知识库
- │   ├── 跨项目思维迁移SOP  —— 带着卡点读精华、提取模块、移植实操
- │   └── 社群增值型加入策略  —— 体验券→吸收→输出复盘→内化课程→寻合伙人
- └── 个人IP落地工程
- '    ├── 引流文档资产化  —— 资料库/问答集作为钩子筛选种子用户'
- '    ├── 公众号/朋友圈信任阵地  —— 长周期信任沉淀与人设构建'
- '    ├── 标准化课程/陪跑产品  —— 核心变现载体，边际成本趋零'
- '    └── 社群资源整合  —— 寻找合伙人、合作大号、放大IP含金量'
life_analogy:
- 想象副业探索是一场**‘寻找天命武器’的RPG游戏**：
- '- **第一阶段（无项目焦虑期）** = 新手村门口徘徊，看着装备库发呆，不敢下副本，一直喊‘什么武器强？什么副本肥？’'
- '- **第二阶段（多项目迷茫期）** = 同时练剑、练法、练弓、练隐身、练炼金，每天每样练10分钟，结果全是1级技能，打野怪全miss，经验值为0，最终删号重练'
- '- **第三阶段（单赛道聚焦期）** = 看攻略、问大佬、测手感，选定‘大剑’一条路，每天砍8小时，触发‘专精’被动，解锁连招，BOSS秒杀，获得神装（个人IP）'
- '- **五维筛选标准** = 武器图鉴筛选器：①实战砍过怪（有成绩）②有独门连招表（方法论）③连招表能教徒弟（可复制）④用主职业通用的力量/敏捷属性（主业关联）⑤真喜欢大剑的重击感（个人喜好）'
- '- **注意力守恒定律** = 你的‘精力条’只有100点，分给5个技能每个只得20点，永远点不满天赋树；全点一棵树，才能出大招'
- '- **个人IP杠杆化** = 把‘亲手砍怪’变成‘造剑谱、卖剑谱、开剑道馆’，睡觉时剑谱还在自动卖钱，徒弟帮你砍怪上贡'
- '- **社群杠杆** = 加入‘大剑宗师公会’，不用自己试毒吃招式，直接抄作业、偷师、组队打团本，还能招募得力干将'
summary:
- concept: 副业三阶段模型
  desc: 从无项目焦虑、多项目迷茫，到单赛道聚焦的必经进化路径
- concept: 聚焦筛选五维标准
  desc: 有过成绩、有独到方法论、方法论可复制、与主业关联、个人喜好 —— 缺一不可的漏斗式决策模型
- concept: 注意力守恒与正反馈循环定律
  desc: 注意力总量守恒，分散则单项目低于正反馈阈值必死；聚焦突破阈值才能建立正向飞轮
- concept: 主业关联性护城河
  desc: 最适合All in的副业必与主业技能/资源/认知重合，实现降维打击与低成本试错
- concept: 个人IP杠杆化
  desc: 将经验资产化为‘复制边际成本为零’的产品矩阵（文档/课程/咨询/社群），构建抗周期长期财富载体
- concept: 跨项目思维迁移
  desc: 从异质赛道（AI/电商/引流）抽象底层逻辑，移植至核心赛道，实现认知降维打击
- concept: 引流文档资产化
  desc: 将碎片经验标准化为PDF/文档钩子，低成本获客、信任前置、筛选高意向付费用户
- concept: 社群增值型加入策略
  desc: 体验券试水→吸收精华→输出复盘建人设（首帖争精）→内化课程→找合伙人，把社群变成杠杆而非避风港
exercises:
- 'no': 1
  title: 练习1：诊断你的副业阶段与注意力分配
  contents:
  - 1. 列出你过去半年尝试/正在操作的所有副业项目（包括‘想做但没动手’的）。
  - 2. 估算每个项目每周投入的有效深度工作时长（排除刷手机、看教程不实操的时间）。
  - 3. 对照‘正反馈阈值’自测：哪个项目已跑通‘流量→线索→成交’最小闭环？哪个项目连续2周无正反馈（无咨询/无出单）？
  - 4. 判断你当前处于三阶段中的哪一阶段？若在第二阶段，你的注意力是否过度分散？
  - 回答问题：
  - '- 如果砍掉除一个项目外的所有投入，你会选择保留哪个？理由是否符合五维标准？'
  - '- 你的‘正反馈阈值’大约在哪里？（如：发10篇笔记、加50个好友、出第一单）'
- 'no': 2
  title: 练习2：对候选项目执行五维筛选打分
  contents:
  - 1. 选取 3 个你最想 All in 的候选项目（或已在做的项目）。
  - 2. 对每个项目按 0-10 分打分：
  - '   - 有过成绩（0=纯设想，5=跑通闭环有收入，10=稳定正向现金流）'
  - '   - 独到方法论（0=全靠运气/硬干，5=有SOP文档，10=能教会小白稳定出单）'
  - '   - 可复制性（0=强依赖个人天赋/人脉，5=核心动作可外包，10=全流程标准化可规模化）'
  - '   - 主业关联（0=完全无关裸奔，5=复用部分通用技能，10=主业核心优势直接降维打击）'
  - '   - 个人喜好/抗挫力（0=纯为钱很痛苦，5=能接受枯燥期，10=即便不赚钱也想钻研）'
  - 3. 计算总分，仅保留总分≥40且无单项<6的项目。
  - 回答问题：
  - '- 被淘汰的项目，死在哪个维度？该维度短期内能补齐吗？'
  - '- 最高分项目，其‘独到方法论’具体是什么？能否写成一份《操作手册V1.0》？'
- 'no': 3
  title: 练习3：设计你的个人IP资产化最小闭环
  contents:
  - 假设你已确定核心赛道（如：小红书考公资料、闲鱼无货源选品、视频号养生带货），请设计：
  - 1. **引流文档（钩子）**：整理一份《XX避坑指南/资料库/工具合集/话术集》PDF，作为免费/低价钩子。
  - 2. **信任阵地**：公众号/朋友圈/社群三选一，规划前10条内容主题（专业干货:生活碎片:营销转化 ≈ 5:3:2）。
  - 3. **核心变现产品**：设计一个 299-999 元的标准化课程/陪跑/咨询服务，明确交付物清单（视频/文档/群/1v1次数/周期）。
  - 4. **社群迁移计划**：列出 3 个高质量付费社群/圈子，你打算从它们吸收哪 3 个可迁移模块？（如：选品逻辑、文案结构、转化话术、工具链）。
  - 回答问题：
  - '- 你的引流文档能否在‘不露脸、不直播、不投流’前提下，单靠SEO/推荐流量日引 20+ 精准粉？'
  - '- 核心产品的‘交付SOP’写好了吗？如果明天来 10 个付费用户，你能不亲自上阵、靠助理/文档/工具完成交付吗？'
