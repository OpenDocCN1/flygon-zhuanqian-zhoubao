  - 短剧 CPS 的核心三要素
  - 选剧是核心，选剧定生死
  - 剪辑要过原创，去重很重要
  - 发布要养号，一机一号最好
  - 剧情剪辑的基本公式：前 3 秒必须有冲突/悬念/高潮 -> 剧情铺垫 -> 高潮反转 -> 引导下小程序看全集
