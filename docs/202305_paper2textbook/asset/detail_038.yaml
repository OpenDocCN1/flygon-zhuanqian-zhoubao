learning_targets:
- 理解短剧CPS与小说推文的同构性及经验迁移逻辑
- 掌握解说模式如何将剪辑门槛转移为文案逻辑门槛并结合AI工具降维打击
- 熟练运用核心三要素筛选法（选剧定生死、剪辑保命、发布养权重）进行标准化决策
- 建立AI批量化生产流水线：从选题表、提示词库、配音预设到剪辑模板库的标准化资产库搭建
- 内化避坑检查清单，规避授权陷阱、账号环境污染、去重不彻底、数据盲目决策四大生存红线
- 验证‘行动先于完美计划’与‘选品决定上限、执行决定下限’两大底层定律的实战指导意义
concept_map:
- 短剧CPS实战体系
- ├── 核心认知
- │   ├── 同构迁移：小说推文经验 → 短剧CPS  —— P001
- │   ├── 行动先于完美计划  —— P001
- │   ├── 选品决定上限，执行决定下限  —— P001
- │   └── 蓝海期红利捕获窗口  —— P001
- ├── 切入模式
- │   ├── 解说模式：原创音频+二创剪辑  —— P002
- │   ├── 门槛转移：剪辑技巧 → 文案逻辑(AI可辅助)  —— P002
- │   └── 降维打击：新手护城河  —— P002
- ├── 标准化执行
- │   ├── 核心三要素筛选法  —— P003
- │   │   ├── 选剧维度：佣金/题材/素材  —— P003
- │   │   ├── 剪辑维度：公式/去重  —— P003
- │   │   └── 发布维度：养号/定时/SEO/置顶  —— P003
- │   ├── 剧情剪辑基本公式  —— P001
- │   │   ├── 前3秒钩子 → 铺垫 → 高潮反转 → CTA  —— P001
- │   └── AI批量化生产流水线  —— P004
- │       ├── 标准化资产库(选题/提示词/配音/模板/发布)  —— P004
- │       ├── 数据与指令解耦(CONCAT参数化Prompt)  —— P004
- │       ├── 模板化交付(固化封面/字幕/转场/BGM)  —— P004
- │       └── 端到端打通(RPA无人值守)  —— P004
- └── 风控红线
- ├── 授权辨别：官方/大服务商 only  —— P005
- ├── 账号环境：实名一机一号+养号3-5天  —— P005
- ├── 去重标准：MD5/镜像/调色/抽帧/贴纸/字幕/边框  —— P005
- └── 数据复盘：完播率/跳转率 → 优化钩子与CTA  —— P005
life_analogy:
- 想象短剧CPS是一场**‘剧本杀剧本推销大赛’**：
- '- **选剧** = 挑选一个自带悬念、反转、爽点的‘神级剧本’（选错剧本，再会演也没人买单）'
- '- **解说模式** = 你不演全本，只做**‘DM旁白’**：用原创声音把核心冲突、高潮反转讲清楚（不用练演技/剪辑节奏，只要逻辑清晰）'
- '- **AI工具** = 你的**‘智能剧本工厂’**：输入梗概 → 批量产出口语化旁白稿 → 一键合成配音 → 套用‘通关模板’出成品'
- '- **批量化流水线** = **‘流水线复制DM手册’**：选题表(剧本库) → 提示词库(话术库) → 配音预设(音色库) → 剪辑模板(场景库) → 发布清单(排期表)，单人日更10场'
- '- **避坑清单** = **‘剧本杀店生存法则’**：只拿正版授权(避法律雷) → 专用账号专用设备(避连坐封号) → 道具去重彻底(避被判抄袭) → 看复盘数据改剧本(避盲目硬撑)'
- 就像优秀DM靠‘好剧本+清晰旁白+标准化复盘’批量带新手飞，短剧CPS新手也靠‘选对剧+解说模式+AI流水线’低门槛跑出收益。
summary:
- concept: 短剧CPS
  desc: 剪辑短剧片段挂小程序链接分成佣金，蓝海期部分剧方给100%首充分成
- concept: 同构迁移
  desc: 小说推文的选品/剪辑/运营经验可直接复用到短剧CPS，大幅缩短学习曲线
- concept: 解说模式
  desc: 原创音频+二创剪辑，将‘剪辑节奏感’门槛转移为‘文案逻辑’门槛，AI可辅助，新手友好
- concept: 剧情剪辑基本公式
  desc: 前3秒钩子(冲突/悬念/高潮) → 剧情铺垫 → 高潮反转 → CTA引导下单，四段式结构化模板
- concept: 核心三要素筛选法
  desc: 选剧看佣金/题材/素材；剪辑执行公式+去重组合拳；发布一机一号+养号+定时+SEO+置顶
- concept: AI批量化生产流水线
  desc: 建立选题表/提示词库/配音预设/剪辑模板库/发布清单五大资产库，单条15-20分钟，单人日更10条+
- concept: 数据与指令解耦
  desc: Excel CONCAT函数将固定Prompt模板与变量数据分离，实现参数化批量生成
- concept: 模板化交付
  desc: 剪映模板固化封面/字幕/转场/BGM/CTA，仅替换剧情片段与解说音频两个变量
- concept: 授权辨别红线
  desc: 只认官方/头部大服务商，拒绝收费授权/二手授权/扣量陷阱
- concept: 账号环境红线
  desc: 实名一机一号核心是设备指纹隔离，新号刷同城/垂类3-5天建立精准标签
- concept: 去重组合拳
  desc: 镜像翻转+调色+抽帧+贴纸/字幕/边框，修改MD5且保持视觉无违和感
- concept: 数据驱动复盘
  desc: 完播率低优化前3秒钩子，跳转率低优化CTA话术/置顶评论，拒绝主观臆断
- concept: 行动先于完美计划
  desc: 认知不确定性高时，下场实操是获取真实反馈、打破自我设限的唯一路径
- concept: 蓝海期红利窗口
  desc: 平台/剧方给高佣金宽松审核的2-3个月窗口期，是普通人低成本试错的最佳入场时机
exercises:
- 'no': 1
  title: 短剧选剧实战演练
  contents:
  - 假设你有以下3部短剧备选资源，请按核心三要素筛选法评估并决定主推哪一部：
  - 剧A：佣金70%，题材‘豪门总裁复仇’(大女主爽文)，官方素材包齐全易获取
  - 剧B：佣金100%(首充)，题材‘抗战神剧’(小众受众)，素材需自行录屏且带水印
  - 剧C：佣金50%，题材‘中老年养生情感’(匹配视频号核心用户)，素材易获取但竞品极多
  - 回答问题：
  - '- 结合‘选剧定生死’定律，你会优先测试哪部剧？核心理由是什么？'
  - '- 如果决定矩阵测试，如何分配账号资源（如5个账号）进行A/B测试？'
  - '- 测试期(前3天)你会重点监控哪3个核心指标？阈值设定多少决定‘Pass或换素材’？'
- 'no': 2
  title: 解说文案Prompt工程化设计
  contents:
  - 请为ChatGPT设计一个结构化Prompt模板，输入：剧名、集数、核心冲突梗概(200字内)；输出：符合‘剧情剪辑基本公式’的口语化解说文案。要求：
  - 1. 必须包含：黄金前3秒钩子(悬念/反问/痛点) → 分集剧情推进(口语化/情绪词密集) → 高潮反转预告 → 强CTA引导(话术可替换变量)
  - 2. 使用权重标记(如：[钩子:1.2] [情绪词:1.1])控制生成侧重
  - 3. 预留变量槽位：{剧名} {集数} {核心冲突} {CTA话术}
  - 回答问题：
  - '- 如何建立‘抽检-修正Prompt-回归测试’质检机制，防止AI幻觉导致剧情错误？'
  - '- 当同一模板批量生成50条文案后，平台判定‘模板化内容’限流，你会如何快速迭代模板库？'
- 'no': 3
  title: 批量化流水线成本与收益测算
  contents:
  - 假设单条视频制作耗时：导入素材2分钟、AI生成文案1分钟、合成配音1分钟、剪映出片3分钟、发布排期1分钟，共8分钟/条。
  - 某团队配置：1人负责选剧/素材(日产20剧)、1人负责文案/配音(并行)、1人负责剪辑/发布(并行)，工作日8小时。
  - 回答问题：
  - '- 理论单日最大产能(条)是多少？瓶颈环节在哪里？'
  - '- 若引入RPA实现‘发布排期’全自动化(耗时0分钟)，且剪辑效率提升至2分钟/条(模板优化)，新产能几何？边际收益率多少？'
  - '- 结合‘一机一号’硬件成本(红米Note 11T约1700元/台，一机双开10号)，测算10账号矩阵的硬件折旧成本(按年摊销)占日产出成本比例。'
  - '- 当账号数扩展至50个时，设备管理/IP隔离/登录维护的运维成本如何量化？临界点在哪里？'
- 'no': 4
  title: 避坑清单压力测试与迭代
  contents:
  - 模拟以下风险场景，请结合避坑检查清单制定应急预案：
  - 场景1：合作服务商突然下架某爆款剧集，且佣金结算延迟15天未到账(授权辨别失效)
  - 场景2：主力账号组(5号)因同一WiFi下登录被判关联违规，流量瞬间归零(账号环境失效)
  - 场景3：去重模板(镜像+调色)被平台算法识别特征指纹，新发视频连续3条‘原创度不通过’(去重标准失效)
  - 场景4：某账号连续7天完播率>30%但跳转率<0.5%，优化CTA话术/置顶评论/小程序卡片位置后仍无改善(数据复盘失灵)
  - 回答问题：
  - '- 每个场景的‘止损动作’与‘复盘溯源动作’分别是什么？'
  - '- 如何将应急预案固化为SOP文档，纳入团队周度演练？'
  - '- 平台算法迭代导致清单失效时，建立何种‘情报监测-清单更新’闭环机制？'
units:
- 'no': 1
  name: 短剧CPS —— 借用小说推文经验跨界捕获蓝海红利
  points:
  - '**为什么需要这个概念？**'
  - '- 传统视频带货门槛高，需自建供应链、直播团队、投流技术'
  - '- 新手缺乏选品、剪辑、运营经验，试错成本高、周期长'
  - '- 短剧CPS利用“内容分发变现”模式，与小说推文同构，可直接迁移经验'
  - '- 蓝海期平台/剧方给高佣金(100%首充分成)和宽松审核，是普通人低成本试错的稀缺窗口'
  - '**核心定义**'
  - '- 短剧CPS：推广者剪辑短剧片段挂载小程序链接，用户充值观看后按比例分成佣金'
  - '- 蓝海期特征：部分剧方提供100%首充分成，审核宽松，红利窗口期约2-3个月'
  - '- 同构迁移：小说推文的选品逻辑、剪辑套路、账号运营经验可直接复用到短剧CPS'
  - '**关键性质**'
  - '- 选品决定上限(剧集自带流量属性定生死)，执行决定下限(剪辑/文案/发布定存活)'
  - '- 解说模式降维打击：将“剪辑技巧门槛”转移为“文案逻辑门槛”，配合AI工具大幅降低新手入门门槛'
  - '- 行动先于完美计划：认知不确定性高时，下场实操是获取真实反馈、打破自我设限的唯一路径'
  - '- AI批量化生产：建立“选题表→文案提示词库→配音预设→剪辑模板库→发布清单”标准化资产库，单条压缩至15-20分钟'
  - '**典型例子**'
  - '- 作者惟乔：生财社群普通成员，零视频背景，迁移小说推文经验，首月(2023年3月)实操短剧CPS收益1.4万元'
  - '- 解说类视频制作流程：选爆款剧→ChatGPT按公式生成分集解说文案→剪映TTS/外部工具配音→剪映智能匹配/手动切点配片段→套模板出片'
  - '- 批量化流水线：批量导入素材→批量喂AI生成10条文案→批量合成语音→剪映一键成片/模板批量替换→多账号矩阵定时发布，单人日更10条+'
  - '**边界条件**'
  - '- 授权陷阱高发：只认准官方/大服务商授权，警惕“收费授权”“二手授权”“扣量”陷阱'
  - '- 账号环境要求：实名一机一号为宜，新号需刷同城/垂类3-5天养号再发，避免被标记搬运'
  - '- 去重标准严格：MD5修改、镜像翻转、调色、抽帧、加贴纸/字幕/边框，必须过原创检测'
  - '- 数据复盘导向：数据差优先优化前3秒钩子和CTA引导，关注完播率、点赞转发、跳转率'
  - '- 一机一号非绝对硬性约束：平台风控存在灰度空间，设备指纹隔离核心而非物理设备绝对隔离'
  sources:
  - paper: docs/202305/20230516_084.md
    role: origin
  excerpts:
  - 接触这个项目，也是因为之前做过小说推文，刚了解就发现，这两个项目的相通之处，又正处在蓝海期，有的剧居然给到 100%的佣金
  - 加入生财学到的第一点就是，先别想太多，下场最重要。
  - 短剧 CPS 的核心三要素：选剧是核心，选剧定生死；剪辑要过原创，去重很重要；发布要养号，一机一号最好
  - 剧情剪辑的基本公式：前 3 秒必须有冲突/悬念/高潮 -> 剧情铺垫 -> 高潮反转 -> 引导下小程序看全集
  - 没有创作经验，如何上手解说类短剧视频？解说类视频不需要太强的剪辑节奏感，只要把剧情讲清楚即可，文案用 ChatGPT 写，配音用剪映/软件，剪辑用剪映模板/智能剪辑
  - 如何批量产生解说类短剧视频？建立素材库、文案库、模板库，流程化作业，单人日更 10 条+
  - 新手有哪些容易踩的坑？授权别交学费，认准官方渠道；一机一号，新号要养号；去重要做彻底，不然限流；数据不好看完播率和引导
  - 在生财里看了很多精华贴，非常有帮助，所以我也来分享一下我的操作经验。
  - 最近操作短剧 CPS 项目，有一点点小小的收益，3 月收益 1.4w+。不多，但是有一个好的起步。
  - '惟乔 : 最好是一机一号，也没限得那么死'
- 'no': 2
  name: 解说模式 —— 将“剪辑技巧门槛”转移为“AI可辅助的文案逻辑门槛”
  points:
  - '**为什么需要这个概念？**'
  - '- 纯混剪模式极易被平台判定搬运、限流，且要求极强的剪辑节奏感，新手难以驾驭'
  - '- 新手缺乏创作经验，无法通过“节奏感”把控视频留存，导致完播率低、不出单'
  - '- 解说模式通过“原创音频+二创剪辑”更易通过平台原创校验，天然具备防搬运属性'
  - '**核心定义**'
  - '- 解说类短剧视频：由创作者录制或AI生成旁白解说，配合剧情片段剪辑而成，核心在于“把剧情讲清楚”而非“剪得炫酷”'
  - '- 门槛转移：将核心能力要求从“剪辑技巧(需经验/天赋)”转移为“文案逻辑(可标准化/AI辅助)”'
  - '**关键性质**'
  - '- 低门槛：不需要太强的剪辑节奏感，只要剧情逻辑清晰即可'
  - '- 高原创度：原创音频+二创画面，极大概率通过平台原创/搬运检测'
  - '- AI友好：文案生成可用ChatGPT按公式批量产出，配音可用剪映TTS/外部工具自动化，剪辑可用模板/智能剪辑标准化'
  - '- 可批量：单条制作压缩至15-20分钟，单人日更10条+成为可能'
  - '**典型例子**'
  - '- 新手4步走SOP：1.选爆款/高佣剧 2.ChatGPT按公式生成分集解说文案(输入梗概输出口语化脚本) 3.剪映文本朗读/外部TTS生成音频 4.导入剪映智能匹配素材/手动按文案切点配片段，套模板出片'
  - '- 文案Prompt设计：输入剧情梗概，输出符合“黄金前3秒钩子+剧情铺垫+高潮反转+引导CTA”结构的口语化解说稿'
  - '**边界条件**'
  - '- 文案质量是核心：解说内容若平铺直叙、无钩子、无情绪起伏，依然完播率低、不转化'
  - '- 素材获取难度：部分热门剧集素材受版权保护难获取，或素材质量差(水印/低清)影响成片效果'
  - '- 配音自然度：TTS合成音在情绪表达、语气停顿上仍不如真人，可能影响用户代入感'
  - '- 平台政策风险：若平台收紧对“解说类二创”的判定标准(如要求真人出镜/实拍占比)，该模式失效'
  sources:
