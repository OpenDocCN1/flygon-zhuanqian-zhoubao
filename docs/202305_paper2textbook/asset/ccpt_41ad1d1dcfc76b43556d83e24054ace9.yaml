paper: docs/202305/20230516_071.md
desc: 该素材为一篇关于AI小说推文项目的0-1实操经验分享帖，作者以“超级个体”视角复盘了从付费学习、实操跑通到最终决定放弃的全过程，核心观点认为小说推文的核心竞争力在于文案而非AI生成画面，并指出该赛道适合作为副业难以支撑主业，同时引发了评论区关于AI绘画自动化流程、模型选择及收益预期的深度技术讨论。
concepts:
- name: 超级个体
  desc: 指具备独立变现能力、能通过单人或极小团队运作项目实现商业闭环的个体创业者形态。
  is_original: false
  excerpt:
  - 我是刚开始尝试自由职业成为超级个体的 凌空
- name: 小说推文
  desc: 一种通过短视频平台推广网络小说片段，引导用户下载阅读APP或充值阅读，从而获取CPS分成收益的内容变现模式。
  is_original: false
  excerpt:
  - 小说推文是我第一个下场入局的项目
  - 小说推文的核心是文案，其次才是画面
- name: AI推文自动化流水线
  desc: 指利用代码将小说文本自动分割、调用LLM生成绘图Prompt、调用Stable Diffusion批量生图、合成视频添加特效的全链路自动化制作体系。
  is_original: true
  excerpt:
  - 通过代码自动化提升效率。目前已经实现把小说分割成多个片段，调用 chatgpt 将片段生成 prompt，调用 sd 生成图片。正在研究将图片合成视频并自动添加横移效果。
- name: 文案为王
  desc: 核心主张：在小说推文业务中，吸引用户留存与转化的关键因素是文案（钩子、剧情节奏），AI生成的视频画面质量仅为次要辅助因素。
  is_original: true
  excerpt:
  - 小说推文的核心是文案，其次才是画面，真的，文案为王。
methods:
- name: __overview__
  desc: 作者的项目复盘与决策方法论：低成本试错（付费陪跑） -> 快速跑通0-1 -> 阶段性复盘 -> 果断止损放弃 -> 无保留经验外溢。
  excerpt:
  - 网上报了两个推文项目的陪跑 199+299,算是对这个赛道有所经验可以来分享。
  - 实践三个月后我决定从入门到放弃，但是大家可以借鉴一下我的项目操作经验
- name: AI推文自动化制作法
  desc: 评论区提及的技术实现路径：文本分割 -> ChatGPT生成Prompt -> Stable Diffusion生图 -> 视频合成与后期特效（横移）。
  excerpt:
  - 把小说分割成多个片段，调用 chatgpt 将片段生成 prompt，调用 sd 生成图片。正在研究将图片合成视频并自动添加横移效果。
- name: 模型优化策略
  desc: 针对SD生成人像效果不佳（如手部崩坏）的解决方案：更换底模（如Dark模型）、使用Embedding插件、优化负面Prompt。
  excerpt:
  - sd 虽然加了负面 prompt 和 embedding 插件，但是手还是画不好。我用的 everything 模型... 你试试看用 dark 的模型，画人更好看
theorems:
- name: 推文收益天花板判断
  desc: 该赛道适合作为副业（月入千元级），但难以支撑主业全职投入，存在明显的规模化收益瓶颈。
  excerpt:
  - 一个人两三个号随便副业做做一个月千把块没问题 当成主业有点困难
  - 看你想赚多少钱，副业还是可以做的
- name: 内容生产核心要素优先级
  desc: 在AI辅助的内容生产中，上层叙事结构（文案/剧本）的权重显著高于底层像素生成能力（绘图模型/参数调优)。
  excerpt:
  - 小说推文的核心是文案，其次才是画面，真的，文案为王。
- name: 付费学习的边际效用递减
  desc: 低价付费社群/陪跑主要价值在于提供标准化SOP和入门门槛，核心竞争力仍需依靠自主实践与迭代，而非依赖项目方持续赋能。
  excerpt:
  - 网上报了两个推文项目的陪跑 199+299,算是对这个赛道有所经验可以来分享。 四舍五入等于省掉五百块。
findings:
- name: 自动化流程耗时与质量的权衡现状
  desc: '[evidence] 评论区实践者反馈：首条10分钟视频耗时7-8小时，画面质量难以匹敌人工精修；预估全流程自动化跑通后可压缩至1-2小时/条，但需解决Prompt工程与模型效果瓶颈。'
  excerpt:
  - 这样我第一个十分钟的视频也花了七八个小时（画面和大佬的没法比），但是我觉得如果整个流程都能自动化跑通，不追求极致的话一两个小时就能出一个视频。
- name: 新账号冷启动播放量低迷
  desc: '[evidence] 实测数据：首条视频播放量仅100+，验证了赛道内流量获取的不确定性与新号冷启动难度。'
  excerpt:
  - 就是不知道现在的收益如何，我第一个视频才一百多播放…
- name: SD模型在特定任务上的性能差异
  desc: '[evidence] Everything模型在生成人像手部细节上表现不佳；经社区验证，Dark模型在人物生成质量上优于Everything模型。'
  excerpt:
  - sd 虽然加了负面 prompt 和 embedding 插件，但是手还是画不好。我用的 everything 模型... 你试试看用 dark 的模型，画人更好看
- name: 赛道拥挤度与新人生存空间
  desc: '[claim] 评论区共识：赛道参与者极多（"太多人玩这个了")，免费教程泛滥（"学费都不要了")，单人小白入局面临激烈竞争与流量分发挤压。'
  excerpt:
  - 太多人玩这个了 小白一个人还能玩吗
  - 推文收益如何啊？看好多人在做，现在学费都不要了
