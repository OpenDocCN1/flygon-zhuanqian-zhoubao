learning_targets:
- 理解小红书无货源电商模式的底层逻辑与红利窗口期判断
- 掌握五步选品法（定位-选品-定品-测品-优品）的标准化决策漏斗与三通道交叉验证实操
- 熟练应用内容生产工业化SOP：封面六大视觉法则、标题关键词公式、文案结构化模板、素材二创标准
- 构建双引擎流量策略：商城货架搜推与笔记种草搜推的种草拔草闭环，以及SEO长尾复利布局
- 建立私域沉淀与高客单转化体系：资料钩子引流、分层话术成交、朋友圈信任资产构建、变现分层漏斗设计
- 建立全周期避坑与合规生存底线：五大风控红线、退货地址隔离、账号物理隔离、店铺体验分生存线
- 实现矩阵化复制放大与组织化运营：身份证合规矩阵、物理隔离硬件方案、标准化SOP资产化、供应链熔断机制
concept_map:
