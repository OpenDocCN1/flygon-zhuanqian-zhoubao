- │   ├── 无货源一件代发模式（低门槛/合规/长期资产）  —— P001
- │   ├── 2023年风口红利期论（规则不完善/免费流量/信任机制强）  —— P001
- │   ├── 女性高客单类目聚焦论（70%女性/90/00后主力/高频刚需）  —— P001
- │   └── 批量量产优于精品深耕论（概率博弈/标准化SOP极压产出）  —— P001
- ├── 店铺搭建与基础配置
