  name: 日出10单供应链主动上门临界点 —— 从‘找货’到‘被找’的杠杆翻转
  points:
  - '**为什么需要这个概念？**'
  - '- 无货源模式核心痛点：利润薄(中间商差价)、物流慢(代发层层转单)、售后难(推诿扯皮)'
  - '- 量级达标前，供应链话语权在对方；量级达标后，话语权瞬间反转'
  - '- 识别临界点，可指导测品/放量/谈判节奏，避免过早/过晚动作'
  - '**核心定义**'
  - '- 观测指标：大件/高客单商品，通过拼多多/1688一件代发，日单量稳定≥10单'
  - '- 触发机制：上游工厂/一级分销商通过后台销量监控/渠道情报发现‘稳定大客户’，主动联系对接源头发货'
  - '- 价值跃迁：利润率提升10-20%、发货时效缩短50%、售后直对厂家、可定制包装/规格/SKU'
  - '**关键性质**'
  - '- 物理门槛：大件商品运费占比高，源头发货省运费即是核心利益驱动力'
  - '- 信任信号：日出10单证明‘选品对、素材稳、转化强、退货低’，是供应链最爱的优质客户画像'
  - '- 可复制性：同一供应商体系内，不同品类/不同店铺均适用此临界点法则'
  - '**典型例子**'
  - '- 作者农机类目：前期拼多多代发日出3-5单，利润30%但物流慢；稳定日出10单后，厂家主动联系源头发货，利润升至45%、次日达'
  - '- 后续切入果树苗木/养生茶品类，复用‘先代发测款→日出10单→谈源头’标准化流程'
  - '**边界条件**'
  - '- 仅适用于大件/高客单/高复购/供应链集中度高(产业带明显)的品类'
  - '- 需具备‘垫资发货/承担退货风险’的现金流与抗压能力，资金链紧绷者慎用'
  - '- 临界点非绝对：季节性品类(如取暖器)可能日出5单即触发，滞销品日出20单无人理'
  sources:
  - paper: docs/202305/I8BLdIIfbobzkYxCLGBctYqbnae.md
    role: origin
  - paper: docs/202305/I8BLdIIfbobzkYxCLGBctYqbnae.md
    role: apply
  excerpts:
  - 大件的商品只要你能下单10件，肯定会有老板主动来联系你。
  - 我又去拼多多找，也没找到一样的，最后找了一个外观最相似的产品，也有一个合理的利润。前期不用担心商品，就手动拼多多一件代发。
  - 如果需要软件自动代发可以用鲸吞代发，可以避免平台给用户发送拼多多消息。
