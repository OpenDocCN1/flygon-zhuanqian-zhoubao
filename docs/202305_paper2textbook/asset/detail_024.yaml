- 'no': 7
  name: 版权投诉利益共生谈判 —— 把‘侵权危机’谈成‘分销合同’
  points:
  - '**为什么需要这个概念？**'
  - '- 搬运IP素材必面临版权投诉风险，硬抗封号、删视频损失权重、服软丧失素材库'
  - '- 单平台深耕IP的达人常面临变现瓶颈(仅靠星图/直播)，缺乏跨平台分销渠道'
  - '- 将‘对抗’转为‘合作’，实现‘素材方出内容+运营方出渠道’双赢'
  - '**核心定义**'
  - '- 分类处理：恶意投诉(律师函/起诉)→ 立即删除、道歉、赔偿、换素材；主动沟通型(电话/私信协商)→ 认错+利益分成谈判'
  - '- 谈判话术：承认错误事实 → 说明带货数据/流量价值 → 提议‘授权搬运+带货分成(佣金/纯利分成)’ → 承诺标注原作者/挂原作者主页 → 达成口头/书面协议'
  - '- 关系升级：从‘侵权方’转为‘分销合伙人’，获取独家/首发素材权，建立稳定供应链'
  - '**关键性质**'
  - '- 成功率高：达人本身缺变现渠道，分成模式符合其利益最大化'
  - '- 成本可控：佣金分成属可变成本，仅在出单时发生，无固定支出'
  - '- 建立护城河：独家素材授权形成内容壁垒，竞争对手无法直接复制'
  - '**典型例子**'
  - '- 作者快手爆款视频被原作者电话投诉，谈判后默许继续发并合作带货，作者帮其卖货分成'
  - '- 达人仅做抖音单平台，作者提供视频号/快手/小红书全网分销渠道，双赢'
  - '**边界条件**'
  - '- 仅适用于个人/小团队原创作者，大机构/MCN签约达人谈判成本极高、流程长'
  - '- 需具备真实带货数据证明分销价值，纯搬运不带货无谈判筹码'
  - '- 法律底线：谈判失败时必须立即下架，不可存侥幸心理对抗平台判罚'
  sources:
  - paper: docs/202305/I8BLdIIfbobzkYxCLGBctYqbnae.md
    role: origin
  - paper: docs/202305/I8BLdIIfbobzkYxCLGBctYqbnae.md
    role: improve
  excerpts:
  - 一种原创作者主动联系，这种情况就主动去沟通，先承认自身的错误事实，再摆事实讲道理，尽量把利益最大化。
  - 后来在沟通之下算是默认了可以继续发，然后我带他们的货。这种作者只做一个平台的情况...如果有个人愿意给他卖货，这样大家也都能赚钱。
  - 我这个作品发快手爆了之后也被原创作者刷到，主动打电话联系我，要求删除停止侵权，后来在沟通之下算是默认了可以继续发，然后我带他们的货。
- 'no': 8
  name: 视频号人群>兴趣，同人群跨品类复购定律 —— 一鱼多吃的‘人群资产’逻辑
  points:
  - '**为什么需要这个概念？**'
  - '- 传统电商思维聚焦‘品类/兴趣’，忽视视频号社交属性强、算法基于社交图谱的特殊性'
  - '- 单品类生命周期短、天花板低，跨品类复购是提升LTV(生命周期价值)关键'
  - '- 农村中老年群体购买渠道单一、信任迁移快，一旦建立信任即可全品类收割'
  - '**核心定义**'
  - '- 核心判断：视频号上‘人群大于兴趣’，用户标签粘性源于社交关系而非内容偏好'
  - '- 操作路径：深耕单一人群画像(如50+农村男性) → 爆款品类A(农机)建立信任 → 引入同人群品类B(苗木/养生茶/保暖/日用) → 复用私域信任快速转化'
  - '- 信任锚点：能加微信即高信任；首单成交即强信任；售后兜底即终身信任'
  - '**关键性质**'
  - '- 转化效率极高：同人群新品无需重新建立信任，直接复用‘官方/规格图/售后’转化模版'
  - '- 选品范围无界：只要符合‘农村刚需、线下难买、线上价格优、非标高利’均可切入'
  - '- 抗风险强：单品类被限流/供应链断供，其他品类兜底，账号资产不归零'
  - '**典型例子**'
  - '- 农机(客单600+)建立信任 → 推果树苗木(客单30-50、复购高) → 推养生茶/保暖内衣/杀虫灯'
  - '- 私域3000好友，农机卖1100单，后续果树/养生品仅发朋友圈/单聊即成交，无需重新引流'
  - '**边界条件**'
  - '- 仅限视频号/私域等强社交信任传导环境，抖音/快手等兴趣算法平台不适用'
  - '- 需建立极强售后体系：一单售后搞砸，全品类信任崩塌'
  - '- 供应链管理复杂度随品类增加指数级上升，需ERP/订单系统支撑'
  sources:
  - paper: docs/202305/I8BLdIIfbobzkYxCLGBctYqbnae.md
    role: origin
  - paper: docs/202305/I8BLdIIfbobzkYxCLGBctYqbnae.md
    role: improve
  excerpts:
  - 在视频号上人群大于兴趣，我只要能卖掉a品类，就必然能卖掉同人群属性下的B品类。
  - 能加你的微信本身就是一种非常大的信任...你能卖给他农机设备，是不是也能卖果木苗木，他们购买渠道非常单一的。
  - 积累了三个月，私域只有三千多个好友，但就是这3000多个好友，三个月时间一个单价600+的商品卖了1100件，利润30%左右。
- 'no': 9
  name: 个人创业‘做减法’生存法则 —— 减掉‘痛苦且不赚钱’的标准动作
  points:
  - '**为什么需要这个概念？**'
  - '- 创业教育过度推崇‘直播/重运营/专业拍摄/建团队’等高门槛标准动作'
  - '- 个人/微型团队资源有限，硬上标准动作导致心理内耗大、现金流断裂、放弃项目'
  - '- 只有跑通0-1、建立细分护城河，才能避免‘项目制创业’看天吃饭'
  - '**核心定义**'
  - '- 核心原则：避开高运营成本、高技能门槛、高心理内耗的动作，选择‘不直播、不开店、不原创(初期)、不囤货’最小阻力路径'
  - '- 判断标准：如果某动作让你‘心理痛苦且赚不到钱’，坚决不做；只做‘跑通0-1必需、边际成本低、可标准化复制’的事'
  - '- 阶段策略：0-1期极致减法(搬运/代发/无店/无播) → 1-N期选择性加法(原创/自建供应链/私域团队/矩阵号)'
  - '**关键性质**'
  - '- 生存导向：现金流为王，不赚钱的事不做，不擅长的事外包/工具/搬运替代'
  - '- 心理可持续：只做顺应天性、正反馈快的事，避免‘坚持’成为负担'
  - '- 护城河建设：减法不是偷懒，是为核心竞争力(选品眼光/私域运营/供应链整合)腾出资源'
  - '**典型例子**'
  - '- 作者放弃直播(痛苦、成本高)、放弃小店(押金、考核)、放弃原创拍摄(不会、累)，专注‘搬运素材+私域成交+供应链谈判’三件核心事'
  - '- 从‘项目制’(搬运农机→搬运苗木→搬运养生茶)转向‘领域深耕’(农村下沉全品类供应链整合+私域IP资产)'
  - '**边界条件**'
  - '- 减法不等于低质：内容/服务/产品质量必须过合格线，减的是‘形式主义动作’'
  - '- 平台规则变化可能强制要求‘加法’(如强制开店/实名/保证金)，需动态调整'
  - '- 规模化阶段(月利10万+)必须补齐被减掉的能力(原创/团队/供应链)，否则天花板极低'
