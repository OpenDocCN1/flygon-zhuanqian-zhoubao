- 'no': 1
  name: 认知底座 —— 从“想赚钱”到“会赚钱”的思维重构
  desc: 本章拆解生财圈核心心法：利他思维、执行力优先、承认无知、个人IP复利。这是普通人跨越“认知鸿沟”，从打工思维转为商业思维的必修课。
  nodes:
  - 'no': 1
    name: 利他思维：商业协作的底层逻辑
    desc: 优先为用户/合作伙伴创造价值、解决问题，而非单向索取。这是高客单价、高复购业务的基石，也是生财圈文化的核心基因。
    role: motivation
    src:
    - paper: docs/202305/SUMMARY.md
    - paper: docs/202305/SUMMARY.md
  - 'no': 2
    name: 执行力 > 创意/认知：在行动中修正认知
    desc: 好主意很多，做下去的很少。认知突破的本质是在行动中获得反馈修正认知，而非空想。核心口诀：解决真正的问题，赚钱的事多做十遍。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 3
    name: 承认无能与无知：成长的起点
    desc: 普通人逆袭第一步是接纳自己‘无能、无知、无资源’的现实，放下体面，从最微小、最具体、最确定的正反馈动作做起（如抄作业、跟航海、卖资料）。
    role: motivation
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 4
    name: 个人IP复利策略：百年不改名，全域用同名
    desc: 个人IP是普通人最高杠杆的资产。统一ID、头像、简介降低用户认知成本，积累品牌复利。出名是赚钱的代价，也是获取信任、降低获客成本的护城河。不出镜也能打造IP（资料号、工具号、笔记号）。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
    - paper: docs/202305/SUMMARY.md
    - paper: docs/202305/SUMMARY.md
- 'no': 2
  name: 训练体系 —— 生财“小航海”项目制训练营模型
  desc: 本章深度解析‘小航海’作为新手0-1跨越的标准化训练场：目标设定、导师陪跑、SOP抄作业、MVP验证、复盘迭代。这是素材中大量成功案例的共同孵化器。
  nodes:
  - 'no': 1
    name: 小航海模式定义：强制跑通商业闭环的训练营
    desc: 社群发起的项目制训练营模式，设定明确目标、时间节点与导师陪跑，强制成员在规定周期内跑通0-1商业闭环，解决‘知道却做不到’的执行鸿沟。
    role: definition
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 2
    name: 小航海项目筛选模型：新手避坑的六大黄金标准
    desc: 筛选适合新手的项目标准：1.正向现金流快；2.无需复杂供应链/囤货；3.可标准化/SOP化；4.可借力AI工具提效；5.有明确的公域获客路径；6.后端有高复购/高客单产品。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 3
    name: 新手0-1变现典型路径与实证数据
    desc: 多位圈友通过参与‘AI资料变现’、‘ChatGPT账号注册/Plus代充’、‘小红书资料引流’等低门槛航海，在1-3个月内实现月入3k-2w+突破，验证了‘跟着航海抄作业’的有效性。
    role: experiment
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 4
    name: 标准化SOP执行闭环：从认知对齐到规模化放大
    desc: 整体方法论闭环：认知对齐 -> 赛道筛选 -> 标准化SOP执行 -> 低成本MVP验证 -> 复盘优化 -> 规模化放大。核心战术：公域内容获客
      -> 私域信任转化 -> 后端高客单产品变现。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
- 'no': 3
  name: 流量底层架构 —— 公域蓄水池与私域提款机的底层通道
  desc: 本章建立全平台通用的流量变现底层模型：公域（小红书/抖音/视频号/公众号/闲鱼/海外社媒）获客 -> 私域（微信/社群）沉淀 -> 朋友圈/社群运营
    -> 高客单/高复购转化。拆解‘钩子设计、诱饵、承接、话术’四大关键动作。
  nodes:
  - 'no': 1
    name: 公私域协同模型：蓄水池与提款机
    desc: 所有平台玩法最终归宿：公域引流 -> 私域沉淀 -> 朋友圈/社群运营 -> 高客单/高复购转化。资料整理、钩子设计、后端话术、附加产品/服务是私域转化率的核心决定因素。
    role: definition
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 2
    name: 资料整理引流法：低成本获客的标准化钩子
    desc: 通过整理高价值垂直领域资料（考证、教程、资源包）作为钩子，在公域平台引流至私域，再通过后端产品/服务变现的标准化流程。实测日均引私域180+用户。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
    - paper: docs/202305/SUMMARY.md
  - 'no': 3
    name: 小红书‘探照灯计划’/笔记引流SOP：从养号到转化的全链路
    desc: 针对小红书平台机制的标准化操作：账号养号(设备/环境) -> 垂直领域选题(关键词挖掘) -> 封面/标题/正文/标签/评论区五要素优化 ->
      诱饵设计(资料/群/号) -> 私域承接(主页/私信/群聊) -> 朋友圈运营/转化话术。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 4
    name: 多平台矩阵运营：一份内容多平台分发的杠杆
    desc: 覆盖小红书、抖音、视频号、公众号、闲鱼、快团团、海外社媒（Ins/FB/LinkedIn/TikTok）的矩阵号操作策略，实现一鱼多吃，降低单平台算法风险。
    role: extension
    src:
    - paper: docs/202305/SUMMARY.md
    - paper: docs/202305/SUMMARY.md
- 'no': 4
  name: AI生产力革命 —— 从‘会用工具’到‘建流水线’的自动化范式
  desc: 本章揭示AI赚钱的本质：AI是放大器而非救世主。核心竞争力在于‘提示词工程+业务流程拆解+自动化串联’。详细拆解ChatGPT+RPA 13步文案自动化法、SD云端零成本批量出图、AI短剧批量剪辑等可复制的自动化生产线。
  nodes:
  - 'no': 1
    name: AI赚钱第一性原理：放大器而非救世主
    desc: 单纯会用ChatGPT/MJ不赚钱，必须将业务拆解为标准化SOP，注入Prompt工程，再用RPA/代码/低代码平台串联成自动化流水线。AI降低了‘从0到1’的技能门槛，但提高了‘从1到N’的标准化要求。
    role: motivation
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 2
    name: ChatGPT+RPA文案自动化13步法：从选题到发布的无人值守
    desc: 将文案创作拆解为13个结构化提示词节点（选题、大纲、钩子、正文、标题、标签等），配合RPA工具（按键精灵、Auto.js、Coze工作流）实现批量生成、定时发布、数据回收的无人值守流程。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 3
    name: Stable Diffusion云端零成本批量出图方案
    desc: 利用Google Colab免费GPU资源，部署SD WebUI (A1111/ComfyUI)，配合模型下载脚本、API调用、定时任务，实现无需本地显卡、无限时长、可编程的批量AI绘图生产线，用于表情包、壁纸、电商图、IP形象生成。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 4
    name: AI内容自动化流水线全景图：文本、图像、视频三位一体
    desc: 结合ChatGPT（文本生成）、Midjourney/SD（图像生成）、RPA/自动化工具（剪映、Coze、Make/Zapier），构建从选题、生产、发布到数据反馈的全自动化内容生产系统。覆盖短剧解说、表情包、数字人、SEO文章等场景。
    role: definition
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 5
    name: AI短剧解说/CPS批量化实证：单人日产50-100条
    desc: 利用ChatGPT改写剧本+剪映/CapCut自动剪辑+批量发布工具，单人日产50-100条视频，抖音/快手/视频号多平台分发，新手首月变现1.4万+，验证了‘内容标准化+工具杠杆’的可行性。
    role: experiment
    src:
    - paper: docs/202305/SUMMARY.md
- 'no': 5
  name: 实战项目库（上） —— 轻资产电商与内容变现标准化打法
  desc: 本章收录经过实战验证的轻资产电商模型：小红书无货源/虚拟资料、视频号短视频带货投流、闲鱼矩阵无货源。均具备‘低门槛、可标准化、确定性强、可矩阵放大’特征，附带完整SOP与实证数据。
  nodes:
  - 'no': 1
    name: 平民开店/无货源电商模型：供应链轻量化的底层逻辑
    desc: 无需囤货、供应链轻量化，利用平台流量红利（小红书店铺、闲鱼、快团团、抖音小店）通过选品、铺货、客服外包实现低风险电商变现。核心优势：试错成本低、可快速复制。
    role: definition
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 2
    name: 小红书无货源/虚拟资料：单店月纯利30-50万的复现路径
    desc: 单账号日引100-180+精准粉，后端转化客单价99-2999元，月纯利30万-50万可复现。关键在于选品(考公/考证/职称/育儿/创业)、封面标题点击率、私域话术转化率。虚拟资料边际成本为零，利润率极高。
    role: experiment
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 3
    name: 视频号短视频挂车投流标准化打法：ROI正向闭环的稳定模型
    desc: 选品(选品广场/榜单) -> 爆款视频二创/混剪(去重) -> 挂车 -> 千川/投流工具测款(ROI>1.2) -> 放量 -> 矩阵号复制。新号冷启动3-7天，单日投放百元级测款，单账号月佣金10万-20万可稳定复现。核心壁垒：去重剪辑能力与选品判力。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
    - paper: docs/202305/SUMMARY.md
  - 'no': 4
    name: 闲鱼矩阵霸屏/无货源SOP：确定性收益的工程化拆解
    desc: 多店铺(7-10个)+ 选品(季节/蓝海/高客单) + 养号(实名/芝麻信用/发帖频次) + 批量发品(工具/手工) + 话术转化(自动回复/引导加微)
      + 供应链对接(一件代发/1688/拼多多)。单店日出单5-20单，月销千单/店可达成。核心解决：设备环境、供应链稳定性、账号权重三大工程问题。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
    - paper: docs/202305/SUMMARY.md
- 'no': 6
  name: 实战项目库（下） —— 知识付费、海外业务与长尾赛道拆解
  desc: 本章覆盖高客单价知识付费/写作变现、海外独立站B2B/Mediabuy高汇率杠杆项目、二奢/手机壳/写作店铺等非标长尾赛道。展示‘解决具体小问题’即生意的长尾需求威力，以及个人IP与标准化交付结合的高利润模式。
  nodes:
  - 'no': 1
    name: 知识付费/写作变现：个人IP信任背书下的高客单复利路径
    desc: 通过公众号/小红书/快手引流，售卖99-9999元写作训练营/社群/咨询/模板，实现年入百万/月入5万+。核心三要素：个人IP信任背书 + 标准化交付产品(SOP/模板/社群)
      + 持续内容输出。边际成本趋近零，复利效应强。
    role: experiment
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 2
    name: 海外独立站B2B冷启动流程：0预算跑通高利润外贸单
    desc: 细分Niche选品(工具/数据) -> 独立站搭建(Shopify/WP) -> 内容SEO/社媒矩阵(Ins/FB/LinkedIn/TikTok)获客
      -> 询盘跟进/报价/成交 -> 收款(Wise/Payoneer) -> 复购/转介绍。验证单人/小团队月入$2000-$10000+，汇率杠杆显著。门槛在于英语/工具/合规/收款渠道。
    role: method
    src:
    - paper: docs/202305/SUMMARY.md
    - paper: docs/202305/SUMMARY.md
  - 'no': 3
    name: 海外Mediabuy/Brand Bid：单人出海的联盟营销与竞价实战
    desc: 利用SEO/社媒/广告投放，跑通海外联盟营销、Brand Bid竞价，月入$2000+。适合单人操作，核心在于流量购买ROI把控与合规收款渠道搭建。
    role: experiment
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 4
    name: 长尾非标赛道拆解：二奢、手机壳、写作店铺的‘小而美’生意
    desc: 记录多个非主流赛道实操：二奢奢侈品鉴定/转卖年入300万+；手机壳定制/无货源月入1万+；写作店铺(代写/改简历/文案)年入50万+；快手知识付费保姆级教程。证明‘解决具体小问题’即可生意，长尾需求巨大，竞争较小。
    role: experiment
    src:
    - paper: docs/202305/SUMMARY.md
  - 'no': 5
    name: 快团团团长模式：私域社交电商的极致转化
    desc: 一个热衷搞钱的二胎全职妈妈，如何在一个月成为快团团 GMV 7W 的团长。依托微信群/朋友圈强关系链，选品+预热+开团+复购的高频次运营节奏，客单价低但复购率极高，适合宝妈/社群运营者。
    role: experiment
    src:
    - paper: docs/202305/SUMMARY.md
