    role: apply
  excerpts:
  - 执行力稀缺性定律：为什么道理都懂却过不好这一生
  - 彻底执行的定义与三重境界：SOP标准化、全员全时段、穿越周期
  - ‘笨功夫’方法论：海量案例拆解、工程细节掌握、3-5年长周期刻意练习
  - 执行复利验证：个人每日分享获出版邀约、古茗横幅规模化崩塌反面教材
  - 航海实战复盘：996程序员21天从零到变现
  - 平民实体创业标准化手册：消费力套利、首年利润率公式、龙岩店实盘回测
  - 财富跃迁与风险防守体系：五大被动收入支柱、防守优先定理、四年跃迁曲线
- 'no': 3
  name: 认知重塑底座 —— 利他、承认无知、个人IP复利的操作系统升级
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人逆袭卡在“想赚钱”到“会赚钱”的认知鸿沟，而非技能鸿沟'
  - '- 混沌源于认知不清而非环境复杂，必须主动“制造清晰”而非被动等待'
  - '- 身居高位者易患“全能幻觉”(镜像神经元衰退+运气归因于能力)，需主动校准'
  - '**核心定义**'
  - '- 利他思维：商业协作底层逻辑，优先为用户/合作伙伴创造价值，而非单向索取'
  - '- 承认无能三步法：承认无知 → 听取建议 → 知进退(识破归因偏差)'
  - '- 个人IP复利：百年不改名、全域用同名，统一ID/头像/简介降低认知成本积累品牌资产'
  - '- 认知-行动耦合律：认知清晰度 → 行动坚定度 → 高耗能执行(穿越周期)'
  - '**关键性质**'
  - '- 认知黑洞与决策力：否决即关上认知大门，需“鸡屎里找鸡蛋”吸收优质信息'
  - '- 三阶段决策模型：乐观构想 → 悲观计划 → 乐观实行'
  - '- 元认知微操作：选择前停留几秒激活理智脑、情绪外化书写、三维语言重塑思维'
  - '- 身心底层升级：冥想增厚灰质、运动后1-2小时黄金窗口强化神经元'
  - '**典型例子**'
  - '- 芷蓝认知重构：创业失败必然论、暴力交付(筛选用户非陪伴)、认知接口(旧瓶装新酒)、动态定位(服务于变现)'
  - '- 漫漫IP打造：半年涨粉20万年变现40万，暴露弱点建立真实人设，垂直于用户而非内容'
  - '- 巴菲特12大特质与作者周计划表：孤独独立、兴趣驱动、大量阅读、复盘等习惯即时内化'
  - '**边界条件**'
  - '- “钱够用”是高阶认知稀缺品，大多数人无法达到名利分离的觉醒层级'
  - '- 个人IP虽高杠杆，但“出名是赚钱的代价”(隐私/安全/舆论风险)，需量力而行'
  - '- 冥想/运动等身心升级需长期坚持，短期无显性ROI，易被功利主义者放弃'
  sources:
