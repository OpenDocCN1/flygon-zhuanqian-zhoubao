- 'no': 9
  name: 投资与财富管理体系 —— 股债性价比择时、基金三好筛选、三阶段风控
  points:
  - '**为什么需要这个概念？**'
  - '- 普通投资者缺乏可复用择时框架，靠宏观预测/情绪博弈必然失败'
  - '- 基金选品无标准，追涨杀跌买在高位，需建立‘好公司、好经理、好体系’筛选法'
  - '- 财富跃迁需防守优先：记账复盘+三阶段风控+保险四件套+双腿走路模型'
  - '**核心定义**'
  - '- 股债性价比择时：沪深300股债性价比 = (1/PE_TTM) / 十年国债收益率，长期1.5-3.0波动，>3.0买入区，<1.5卖出区，技术分析仅验证拐点'
  - '- 行情分类识别：四大风格象限估值一致性判断，四风格全便宜=系统性底部(普通人重仓)，风格分化=结构性底部(专业选手选品)'
  - '- 基金三好筛选：Step1筛头部公司(管规模大/高管投研出身/人才梯队/口碑好/长期主义/经理收入高) → Step2筛好经理(长期业绩前/投决委成员/金牛奖)
    → Step3好体系否决权(规模>50亿一律不买，最优<20亿)'
  - '- 三阶段风控模型：一阶段守收入(年亏损上限) → 二阶段守净资产(20%上限/引入2倍杠杆) → 三阶段标普配置搭台(利他平台钱生钱)'
  - '**关键性质**'
  - '- 三大干扰因子全忽略：宏观/事件/情绪均不作为择时依据，远期影响已定价于无风险利率'
  - '- 容量约束与超额收益：小规模基金享换仓摩擦成本低/打新超额收益/迷你股交易三大结构性优势，大规模必然收益递减'
  - '- 五大被动收入支柱：经纪佣金/超短线委托/淘宝客裂变/可转债百户代打/四大行存款套利，像素级拆解SOP'
  - '- 信用价值变现与合伙人制：出资/出技术/出资源三方分工，利用他人账户/额度/粉丝规模化放大，边际成本趋零'
  - '- 流动性优先铁律：资金不出自有卡、随时可赎回、拒绝融资融券，三大惨案(10万亏至1万/300万亏至60万/30万仅回本80%)刻印风控底线'
  - '**典型例子**'
  - '- 作者实盘十年三次逃顶两次抄底：2015/2018/2021逃顶，2015/2018/2019抄底切换赛道，择时准确率100%，连续十年正收益'
  - '- 老吴四年跃迁：负债19万→年净96万，指数级增长曲线验证实操性项目抗周期稳健性'
  - '- 梦宸少年创业七阶：1元启动→碎片时间资产化→平台红利窗口捕捉→向上社交→抄袭模仿超越→单人全链路→风口判断果断转型'
  - '**边界条件**'
  - '- 仅适用于A股/宽基指数/主动权益基金，不适用于个股投机/杠杆交易/另类资产'
  - '- 历史年化<25%者仅参与系统性行情，结构性行情需专业选品能力普通人不可为'
  - '- 保险四件套(重疾/医疗/寿险/意外)+社保不断缴是防守前提，无此底座不谈进攻'
