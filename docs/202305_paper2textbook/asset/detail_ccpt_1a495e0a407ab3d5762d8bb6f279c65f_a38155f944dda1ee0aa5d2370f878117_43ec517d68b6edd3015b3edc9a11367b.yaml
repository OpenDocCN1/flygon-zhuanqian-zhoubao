units:
- 'no': 1
  name: 生财小航海 —— 普通人跨越“知行鸿沟”的外部约束容器
  points:
  - '**为什么需要这个概念？**'
  - '- 大多数人懂道理却过不好这一生，核心缺口在于执行力而非认知'
  - '- 独自摸索极易陷入“看得懂、学不会、做不成”的死循环'
  - '- 需要一个强制跑通商业闭环、提供及时反馈的标准化训练场'
  - '**核心定义**'
  - '- 社群发起的项目制训练营模式，设定明确目标、时间节点与导师陪跑'
  - '- 核心机制：截止节点、公开承诺、同伴监督、导师点评四位一体'
  - '- 目的：强制成员在规定周期内跑通0-1商业闭环，赚到第一桶金'
  - '**关键性质**'
  - '- 低门槛筛选：仅适配正向现金流快、无需囤货、可标准化、可借力AI、有公域获客路径、后端有高客单/复购产品的项目'
  - '- 以战代练：不讲大道理，只发手册、看演示、跟作业、交作业'
  - '- 复利复用：一次参与，终身受用标准化SOP与思维模型'
  - '**典型例子**'
  - '- CBJhdD0dTokH8tx8HKYc1nJSnnc：应届生跟航海两周变现7000元（AI账号注册/Plus代充）'
  - '- Gn5NdifvBorUbdxvGl6ceQgXnpg：心理咨询师根源一年从零到年入200万（知识付费）'
  - '- DGw1dYHSsohHu7x1AXhc4cQVnEN：利用生财思维8元成本一个月小赚2万（视频定制）'
  - '**边界条件**'
  - '- 仅解决“0到1”跑通闭环问题，不解决“1到N”规模化放大问题'
  - '- 依赖社群外部约束，缺乏自律者退出社群后极易复发拖延症'
  - '- 项目筛选模型随平台红利周期变化，需动态更新而非一劳永逸'
  sources:
