  - 从 0 开始借助 ChatGPT 变现 7k 入生财经历分享
  - 如何利用生财航海每月多赚 2 万元？
  - 小航海模式定义：强制跑通商业闭环的训练营
  - 小航海项目筛选模型：新手避坑的六大黄金标准
- 'no': 2
  name: 执行力进化论 —— 从“战略幻觉”到“笨功夫复利”的范式跃迁
  points:
  - '**为什么需要这个概念？**'
  - '- 认知廉价，执行稀缺：减肥成功率1/200、餐厅SOP落地率<1%'
  - '- “知易行难”源于人性贪婪、懒惰、恐惧，而非方法论缺失'
  - '- 只有“彻底执行”简单正确的动作，才能穿越周期获得复利收益'
  - '**核心定义**'
  - '- 彻底执行三重境界：动作颗粒度标准化(SOP)、执行覆盖面无死角(全员全时段)、时间维度长期主义(穿越周期)'
  - '- 笨功夫方法论：拒绝捷径，海量案例拆解(如收集1万家门头)、工程细节掌握、3-5年刻意练习'
  - '- 执行复利验证：正向案例(作者每日分享获出版邀约)、反向教材(古茗拉横幅规模化崩塌)'
  - '**关键性质**'
  - '- 注意力守恒：注意力被“他人掠夺”(凑热闹、随大流、操他人心)是执行力的隐性成本'
  - '- 主要矛盾原则：识别致命/附随/慢性三类问题，聚焦现金流等主要矛盾，用增长掩盖次要矛盾'
  - '- 防守优先：有房贷/幼儿/积蓄有限阶段，“主业防守+副业进攻”边际收益高于裸辞创业'
  - '**典型例子**'
  - '- 巴菲航海日志：996程序员21天从零到变现(社群杠杆×高频行动×利他分享)'
  - '- 龙岩自习室：首年利润率255%、次年638%，验证消费力套利与首年利润率公式'
  - '- 老吴财富跃迁：负债19万到年净96万，五大被动收入支柱(经纪/淘客/可转债/存款套利/委托)'
  - '**边界条件**'
  - '- 单一项目生命周期短(如碳中和项目因天花板停更)，必须靠思维模型跨域复用实现反脆弱'
  - '- 执行力无法替代方向正确性：错误方向上勤奋执行=加速死亡'
  - '- 组织执行力存在边界：古茗案例证明规模化后SOP极难落地，需接受相对公平而非完美'
  sources:
  - paper: docs/202305/20230516_003.md
    role: origin
  - paper: docs/202305/20230516_009.md
    role: improve
  - paper: docs/202305/20230516_007.md
