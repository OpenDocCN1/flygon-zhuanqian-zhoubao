  name: 平民实体创业标准化手册 —— 消费力套利与首年利润率公式的量化决策
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人创业缺乏量化决策工具，靠感觉选址/谈判/装修导致高失败率'
  - '- 三四线城市存在“同价异成本”价格剪刀差：品质消费心理价位不变、成本显著更低'
  - '- 需要租房前即可测算盈利预期的标准化开店体系，将创业变成工程问题'
  - '**核心定义**'
  - '- 消费力套利：瑞幸/台球/自习室在三四线与一二线‘同价异成本’的套利窗口，小成本高确定性战略锚点'
  - '- 首年利润率公式：(月价×座位×85%×12)/(年租+软硬件)，配套人口/现有店数/对标城市/考研高中/美团闭店率四步城市筛选法'
  - '- 电影院选址铁律：有电影院开1公里内，无则Pass；交通全模拟、户型筛选、物业佣金红包利益绑定'
  - '- 无人值守3.0模式：小程序选座/开门/断电、会员制私域、2倍超卖、志愿者替代保洁、容忍羊毛党造势的零人力运营闭环'
  - '**关键性质**'
  - '- 谈判签约组合拳：波澜不惊看房→极限砍价→半年付筹码→免租装修期→不涨租不卖房，5-7天极速开业'
  - '- 极简装修交付标准：固定工艺/材料/品牌/工期的装修包干制，工程化流程'
  - '- 实盘回测验证：龙岩店首年255%/次年638%利润率，汕头vs佛山蓝海验证，物业100元搞定垃圾清运'
  - '**典型例子**'
  - '- 作者半年开十余店实战复盘，提炼全流程标准化开店体系'
  - '- 首年利润率公式实测有效，汕头同省对标发现蓝海市场'
  - '- 物业案例证明‘位卑权重’的利益绑定杠杆：小利润换大合作'
  - '**边界条件**'
  - '- 仅适用于标准化程度高、非标品属性弱的品类(自习室/台球/咖啡/共享办公)'
  - '- 依赖电影院作为商业成熟度硬指标，无电影院城市需寻找替代锚点(大型商超/肯德基/高校)'
  - '- 无人值守模式对治安/消防/设备故障有隐性要求，非绝对零运维'
  - '- 公式假设85%座位利用率，实际受季节/考试周/疫情波动大，需留安全边际'
