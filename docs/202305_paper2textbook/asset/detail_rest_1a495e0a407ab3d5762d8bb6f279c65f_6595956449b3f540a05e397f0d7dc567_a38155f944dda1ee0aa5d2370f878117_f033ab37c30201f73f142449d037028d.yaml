life_analogy:
- 把生财小航海想象成**驾校的‘强制练车周期’**：
- '- **学员（普通人）** = 知道交通规则（道理都懂），但从未上路（执行力为零）'
- '- **教练（导师/陪跑）** = 不教新规则，只强制你按SOP练倒库、侧方停（标准化动作）'
- '- **考试截止日期（航海节点）** = 倒逼你在规定周内完成‘上路-考试-拿证’最小闭环'
- '- **陪练群（同伴监督）** = 大家都在练，你不练就会掉队（社会压力）'
- '- **驾照（商业闭环跑通）** = 不是终点，而是‘允许你独自上路规模化’的入场券'
- ''
- 把公私域协同想象成**‘水库-水龙头’系统**：
- '- **公域平台（小红书/抖音/视频号）** = **水库（蓄水池）**：水量大（流量大），但水归国家（平台），且会蒸发（算法衰减）、泄洪（限流封号）'
- '- **私域（微信/社群/朋友圈）** = **自家水缸（提款机）**：水量小，但水是自己的（用户资产），随时能拧开水龙头用（高频触达/高转化）'
- '- **钩子/诱饵/承接/话术** = **引水管/过滤器/水龙头/阀门**：决定能不能把水库的水、干净地、可控地、持续地引入自家水缸'
- '- **核心铁律**：没有水库（公域引流），水缸干涸；没有水缸（私域沉淀），水库泄洪白流。必须‘双轮驱动’。'
- ''
- 把AI自动化流水线想象成**‘中央厨房预制菜工厂’**：
- '- **SOP拆解** = **标准化菜谱（13道工序：选题-大纲-钩子-正文-标题-标签...）**：把‘大厨凭手艺炒菜’变成‘流水线按步骤组装’'
- '- **Prompt工程** = **预制调料包（结构化模板/权重语法/少样本微调）**：保证每道菜口味稳定、可复制、可规模化'
- '- **RPA/自动化串联** = **传送带/机械臂（Excel批量Prompt→网页交互→回填数据）**：解放大厨双手，实现7×24小时无人值守出餐'
- '- **人机分工**：人负责‘研发新菜谱、调配料包、处理异常、优化流程’；机器负责‘按菜谱组装、搬运食材、守时间、抗重复’。'
summary:
- concept: 生财小航海
  desc: 普通人0-1跨越的‘强制执行容器’：截止节点+公开承诺+同伴监督+导师点评，强制跑通最小商业闭环，筛选标准为正向现金流快、无囤货、可SOP、可AI提效、有公域获客路径、后端有高客单
- concept: 利他思维
  desc: 商业协作底层协议：优先为用户/合作伙伴创造价值（专业/情绪/渠道），而非单向索取；可量化为成交率/复购率/客单价/LTV，适用于选品/内容/服务/合伙全链路
- concept: 个人IP复利策略
  desc: 百年不改名、全域用同名，统一ID/头像/简介降低认知成本积累品牌复利；双路径：一技之长IP+资源整合IP；不出镜9种形式均可百万粉；核心公式=共性+特性=信任降维
- concept: 公私域协同模型
  desc: 公域作蓄水池（曝光/筛选/引流），私域作提款机（沉淀/信任/高客单高复购转化）；连接四件套：钩子设计→诱饵投放→承接路径→转化话术；后端决定上限，平台无关流量为本
- concept: AI内容自动化流水线
  desc: 三位一体：ChatGPT(文本)+Midjourney/SD(图像)+自动化工具(视频/分发/数据)；核心建设：业务拆解SOP→注入Prompt工程(模板/微调/参数)→RPA/代码串联流水线；手动跑通是前提
- concept: 执行力>创意/认知
  desc: 赚钱的事多做十遍；执行三要素=标准化动作(SOP)×高频次(日更/日测)×长周期(3-5年)；认知突破本质=行动中获反馈修正认知；低成本试错锁定风险区间积累确定性
- concept: 承认无能与无知
  desc: 成长冷启动键：认知校准三步法(承认无知→听取建议→知进退)+归因校准(成功归运气/平台/贵人，失败归认知/执行/资源)+元认知训练(停留几秒/写作复盘/三维语言重塑)
exercises:
- 'no': 1
  title: 小航海项目筛选实战演练
  contents:
  - 假设你是一名全职上班族（日均可支配碎片时间2小时、启动资金3000元、擅长整理文档、无供应链资源、无英语优势），请对以下3个候选项目按‘小航海六大筛选标准’逐项打分（1-5分）并决策：
  - 项目A：小红书虚拟资料引流（考公/考证/职称资料包）→ 私域售卖99-299元训练营
  - 项目B：视频号短视频带货投流（选品/混剪/千川测款/放量）
  - 项目C：海外独立站B2B（Shopify建站/SEO内容/询盘跟进/英文邮件/收款Wise）
  - ''
  - 回答问题：
  - '- 哪个项目综合得分最高？核心加分项与减分项是什么？'
  - '- 若你额外拥有‘稳定的1688一件代发供应链’，项目排名会如何变化？'
  - '- 为什么‘正向现金流快’被列为第一筛选标准？违背它会导致什么后果？'
- 'no': 2
  title: 公私域钩子-承接-转化链路设计
  contents:
  - 针对‘AI提示词模板库’这一虚拟产品，设计完整的公私域协同链路：
  - 1. 公域平台选择：在小红书/抖音/视频号/公众号中选定主阵地1个、辅助阵地1个，说明理由（用户画像/算法机制/引流宽松度）
  - 2. 钩子设计：设计3个不同形式的‘诱饵’（如：PDF清单/Notion模板/视频教程/工具包），标注制作成本与感知价值
  - 3. 承接路径：设计从公域内容到私域加微信的3步动作（如：评论区关键词→主页简介→私信自动回复），并标注每步预估流失率
  - 4. 转化话术：编写私域首条欢迎语、异议处理（贵/免费/怕被骗）、价值锚定（对比同行/展示案例/限时优惠）的标准化SOP
  - ''
  - 回答问题：
  - '- 为什么‘资料是别人的，产品必须是自己的’？若把钩子资料直接作为主力收费产品会发生什么？'
  - '- 如何用‘引流即销售’思维重构上述第3步承接路径？'
- 'no': 3
  title: AI文案自动化流水线最小闭环搭建
  contents:
  - 目标：利用 ChatGPT + 免费RPA工具（如按键精灵/Auto.js/Coze免费版），搭建‘从选题到发布’的日产10条小红书笔记自动化流程。
  - 请按以下步骤拆解并标注关键决策点：
  - 1. SOP拆解：将‘写小红书爆款笔记’拆解为几个原子动作？（提示：参考13步法）
  - 2. Prompt模板化：针对第1步‘选题’与第3步‘钩子/标题’，编写结构化Prompt模板（含变量槽位、权重语法、正反向词）
  - 3. 数据源准备：建立一个Excel表，包含哪些列（字段）以支撑Prompt批量填充？
  - 4. RPA流程编排：画出‘读取Excel→调用ChatGPT→获取回复→回填Excel→定时发布’的流程图伪代码
  - 5. 异常处理：当ChatGPT输出格式错误/网络超时/平台发布失败时，RPA应如何捕获并重试/报警？
  - ''
  - 回答问题：
  - '- 为什么说‘手动跑通是自动化前提’？如果SOP第2步‘大纲生成’人工做不稳定，自动化会放大什么后果？'
  - '- 该流水线的边际成本结构是怎样的？规模化至日产100条时，主要瓶颈会转移到哪里？'
- 'no': 4
  title: 执行力复利验证：从‘知道’到‘做到’的量化追踪
  contents:
  - 选择一个你想长期坚持的‘赚钱微动作’（如：每日发1条小红书笔记/每日测1个视频号选品/每日整理1份行业资料/每日复盘记账），执行连续21天并记录：
  - 1. 标准化SOP：把该动作拆解为最多5个原子步骤，制作成Checklist
  - 2. 执行数据：每天记录‘开始时间/耗时/产出量/异常阻碍/情绪评分(1-10)’
  - 3. 周复盘：第7/14/21天计算‘执行率(实际天数/计划天数)×平均产出质量分’，绘制趋势图
  - 4. 迭代优化：针对阻碍最高的1个环节，设计1个‘降低阻力’的微调整（如：前置准备/环境设计/工具替代/奖惩机制）
  - ''
  - 回答问题：
  - '- 第21天的执行阻力比第1天下降了多少？主要归因于‘动作肌肉记忆’还是‘正反馈驱动’？'
  - '- 如果中断3天再继续，执行率曲线会呈现什么形状？这说明了执行力复利的什么特性？'
  - '- 对照‘古茗横幅规模化崩塌’反面教材，个人执行力复利的‘组织边界’在哪里？'
- 'no': 5
  title: 认知校准实战：承认无能的‘停留几秒’训练
  contents:
  - 连续7天，每天记录3次‘冲动决策前的停留’练习：
  - 场景示例：看到‘暴利项目广告’想立即付费学习、收到客户刁钻投诉想立即情绪化回复、看到同行爆款想立即全盘照抄不加思考。
  - 记录模板：
  - '- 触发事件：__________'
  - '- 系统1冲动反应：__________（如：马上买/骂回去/直接抄）'
  - '- 停留5秒后，系统2理性分析：__________（成本/收益/风险/长期影响/是否符合主业关联性）'
  - '- 最终决策：__________'
  - '- 事后复盘（24小时后）：实际结果与理性预测偏差______%'
  - ''
  - 回答问题：
  - '- 7天后，你的‘冲动决策拦截率’(停留后改变决策/总冲动次数)达到多少？'
  - '- 哪类场景最难‘停留’？是因为‘损失厌恶’、‘从众心理’还是‘稀缺性诱导’？'
  - '- 结合‘镜像神经元衰退’理论，为什么身居高位/有过小成绩的人更难‘承认无能’？如何设计‘强制谦卑机制’？'
