exercises:
- 'no': 1
  title: 设计你的‘小航海’项目筛选清单
  contents:
  - 假设你想在未来3个月内启动一个副业项目，请依据‘小航海项目筛选六大黄金标准’设计一份自查清单：
  - 1. 正向现金流有多快？（预计首单周期：___天）
  - 2. 是否涉及复杂供应链/囤货？（是/否，若是则PASS）
  - 3. 核心流程能否拆解为标准化SOP？（列出关键3-5个标准动作：___）
  - 4. 能否借力AI工具提效？（具体工具与环节：___）
  - 5. 公域获客路径是否明确？（搜索/推荐/投流/私域裂变，主渠道：___）
  - 6. 后端是否有高复购/高客单产品规划？（产品形态/价格带：___）
  - 回答问题：
  - '- 若某指标不达标，是选择‘换赛道’还是‘补能力’？决策依据是什么？'
  - '- 如何用‘飞书工具表单’将此清单固化为可复用的筛选模型？'
- 'no': 2
  title: 拆解一个‘不出镜IP’的像素级模仿SOP
  contents:
  - 在小红书/抖音/视频号搜索你感兴趣的垂直领域，找到3个‘粉丝1-2万、近期有单条爆款、非头部大V’的‘低粉爆款’账号：
  - 1. 账号主页四件套（昵称/头像/简介/背景图）像素级拆解：核心关键词/视觉风格/信任背书/行动指令是什么？
  - 2. 爆款笔记/视频结构复刻：封面大字报文案/标题钩子/正文段落结构/BGM节奏/剪辑转场/评论区引导话术
  - 3. 引流钩子设计：诱饵形式（资料/群/号/小程序）/ 植入位置/话术脚本/私域承接路径
  - 4. 将上述拆解整理为‘像素级模仿SOP清单’，包含：选题表/封面模板/文案结构/剪辑节奏表/发布清单/引流话术库
  - 回答问题：
  - '- 为何起号初期要避开头部大V，专找‘低粉爆款’模仿？'
  - '- ‘形式大于内容’在不出镜IP中如何体现？给出一个跨品类迁移的例子（如：AE改文字直播形式迁移至AI绘画/AI聊天/虚拟主播带货）。'
- 'no': 3
  title: 搭建一条‘资料引流→私域分层转化’的最小闭环
  contents:
  - 选择一个你熟悉的垂直领域（如：考公/育儿/职场技能/AI工具/跨境电商），完成以下动作：
  - 1. 选品验证：用‘淘上红’法在淘宝/拼多多/抖音搜索核心词，筛选直通车成交笔数>100、搜索人气高的虚拟资料/实物单品；再在小红书搜索下拉词/笔记量/竞品点赞/评论区求资源三维交叉验证。
  - 2. 制作钩子：整理一份高感知价值、低获取成本的‘资料包’（如：思维导图/工具合集/避坑指南/模板），设计封面/标题/钩子文案。
  - 3. 公域分发：在小红书/抖音/公众号其中一个平台发布3-5条引流笔记/视频，植入‘评论/私信关键词领取’钩子。
  - 4. 私域承接与分层：建立‘资料群’（自动进群发资料）→ 筛选付费用户进‘咨询群’（9.9-99元资料/低价咨询）→ 邀请高意向进‘核心群’（高客单产品/服务）。
  - 5. 话术执行：编写‘付费筛选→咨询式成交→红包复投→高客单推荐’四步标准话术，实测转化率。
  - 回答问题：
  - '- 为何说‘资料是别人的，产品必须是自己的’？若混淆二者会陷入什么红海？'
  - '- 如何用‘白嫖用户分层运营’策略处理拒绝付费的用户？边际成本与未来转化概率如何权衡？'
- 'no': 4
  title: 手工跑通一条‘ChatGPT+RPA文案自动化’微流程
  contents:
  - 不写代码，利用Coze/扣子/影刀RPA/按键精灵等低代码工具，完成一个‘选题→大纲→标题→正文→标签→定时发布’的微闭环：
  - 1. 在Coze搭建一个Bot：配置6个技能节点（选题生成/大纲生成/标题生成/正文生成/标签生成/格式化输出），每个节点使用结构化Prompt（角色/任务/输入/输出格式/约束/少样本）。
  - 2. 在影刀RPA/按键精灵录制流程：打开目标平台后台 → 循环调用Bot API获取内容 → 填入编辑器 → 点击发布/定时 → 记录链接到Excel。
  - 3. 测试跑通3-5条内容，记录：单条耗时/通过率/人工干预次数/数据表现（阅读/互动）。
  - 回答问题：
  - '- 为何强调‘手动跑通是自动化前提’？若SOP未跑通直接上RPA会发生什么？'
  - '- Temperature参数在带货文案(0.3-0.7)与创意文案(0.9)中的差异化设定原理是什么？如何批量设定不同值生成多版本供筛选？'
- 'no': 5
  title: 对标拆解一个‘长尾非标赛道’的商业模式画布
  contents:
  - 从‘二奢/手机壳定制/写作店铺/快手知识付费’中选择一个，完成商业模式画布九宫格拆解：
  - 1. 客户细分：目标用户画像（年龄/性别/地域/收入/痛点/觉醒度）
  - 2. 价值主张：解决的具体小问题是什么？核心差异化优势（价格/服务/信任/效率）？
  - 3. 渠道通路：公域获客平台/内容形式/私域承接路径/转化场景
  - 4. 客户关系：自动化/人工服务/社群运营/个人IP信任背书/超预期服务
  - 5. 收入来源：主产品价格/客单价/复购率/LTV/边际成本结构
  - 6. 核心资源：供应链/技能/工具/账号矩阵/私域流量池/信任背书（如鉴定师证书）
  - 7. 关键业务：选品/内容生产/引流/转化/交付/售后/供应链管理/风控
  - 8. 重要合作：上游供应商/平台官方/同行联盟/工具方/支付渠道/物流商
  - 9. 成本结构：固定成本/变动成本/获客成本(CAC)/运营成本/合规成本/试错成本
  - 回答问题：
  - '- 该赛道的‘反脆弱性’体现在哪里？（如：二奢前员工拆分小团队人均效能更高/方法论迁移能力强于单一业务护城河）'
  - '- 若平台风控收紧/供应链断供/流量红利消退，该模式的‘最小生存单元’是什么？如何快速切换？'
