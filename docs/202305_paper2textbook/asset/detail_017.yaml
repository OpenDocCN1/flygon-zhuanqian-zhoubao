learning_targets:
- 理解OpenAI风控的核心判定逻辑与IP归属地风险分级
- 掌握DashiSIM多APN漫游方案获取美/欧/新原生IP的配置实操
- 掌握Ultra Mobile $3 PayGo实体卡结合WiFi Calling实现长期保号的完整流程
- 掌握华美银行Velo零门槛开户与Wise多币种电子卡两大真实金融身份支付方案的落地步骤
- 能够将网络-身份-支付三位一体基建复用至跨境业务全场景，构建长期复利资产
concept_map:
- ChatGPT Plus 长期稳定访问基建
- ├── 封号核心判定：IP归属地为第一风控维度
- │   ├── 亚洲IP高风险名单（台/日/港命中率40%）
- │   ├── 账号异常识别特征（无法加载历史/输入框发送失败）
- │   └── 账号养护三原则（拒亚洲IP/拒频繁换IP/拒一IP多号）
- ├── 网络层基建：DashiSIM多APN漫游获取美/欧/新原生IP
- │   ├── APN切换技术原理（us.dashi/eu.dashi/sg.dashi）
- │   ├── 国内漫游走中国移动5G直连（零月租/按需充值）
- │   ├── 单IP单号固定使用（物理隔离网络环境）
- │   └── 备选方案：CMLINK新加坡漫游卡（需海外办理激活）
- ├── 身份层基建：Ultra Mobile $3 PayGo实体卡+WiFi Calling长期保号
- │   ├── MVNO保号卡核心价值（低成本维持美号存活）
- │   ├── WiFi Calling漫游技术（境内无实体信号接收短信）
- │   ├── eSIM转移支持（释放物理卡槽）
- │   └── 自动扣费保号机制（绑定国内卡$5/月含税）
- ├── 支付层基建：真实金融身份 > 虚拟卡/临时接码
- │   ├── 方案A：华美银行Velo零门槛开真实美借记卡/信用卡（FDIC成员）
- │   ├── 方案B：Wise护照实名+$20入金即时生成电子借记卡（真实账单地址/CVV）
- │   ├── 虚拟卡共享BIN污染连坐风控（长期不可控）
- │   └── 真实账单地址与CVV的合规性优势
- └── 基建复用价值：跨境业务长期资产
- '    ├── 身份锚定复用（注册FB/推特/电报/ChatGPT等全场景）'
- '    ├── 收款通道复用（Wise多币种本地账户收USD/EUR/GBP/JPY）'
- '    ├── 信用资产积累（华美Velo申请真美信用卡建立FICO信用史）'
- '    └── 边际成本趋零（一次投入终身复用）'
life_analogy:
- 想象这套基建是**出海创业的“三件套身份证”**：
- '- **网络层（DashiSIM）** = **一张能随时切换‘美国/法国/新加坡’户籍的电子通行证**：不用跑腿换证，拨动开关（APN）即可变身当地原住民网络身份，彻底躲过‘亚洲户籍高风险’的查户口红线。'
- '- **身份层（Ultra Mobile）** = **一张长期有效、月租仅几十块钱的‘美国实体手机号身份证’**：插在手机里、开个WiFi Calling，躺在国内也能收美国短信验证码，比租接码平台靠谱百倍，还能注册全套海外账号。'
- '- **支付层（华美Velo/Wise）** = **一张真实的‘美国银行信用卡’+‘全球多币种收款账户’**：不是那种随时会被封的虚拟黑卡，而是受FDIC保险保护、能积累美国信用记录、能收全球客户款项的真金融身份。'
- 这三样东西组合在一起，解决ChatGPT Plus订阅只是‘顺带手’的事，真正价值是搭建起了你**跨境业务的永久基础设施**，一次投入，终身复用，边际成本趋零。
summary:
- concept: 封号核心判定：IP归属地为第一风控维度
  desc: OpenAI风控以地域画像为首要指标，亚洲IP（台/日/港）命中率约40%，账号属性非主导因素
- concept: 账号养护三原则
  desc: 拒绝亚洲IP、拒绝频繁换IP、拒绝一IP多号，构成网络层生存底线
- concept: DashiSIM多APN漫游方案
  desc: 一张实体卡通过切换APN(us.dashi/eu.dashi/sg.dashi)获取美/法/新原生IP，国内走移动5G，零月租按需充
- concept: Ultra Mobile $3 PayGo保号卡
  desc: MVNO实体卡+WiFi Calling漫游，绑定国内卡自动扣费$5/月，长期接收验证码，支持eSIM
- concept: 华美银行Velo零门槛开户
  desc: 无需护照/签证/美地址/预存款，远程开真实美借记卡/信用卡，FDIC成员资金安全
- concept: Wise多币种电子卡
  desc: 护照实名+$20入金即时生成含真实账单地址/CVV的电子卡，多币种本地收款账户一次开齐
- concept: 虚拟卡污染风险
  desc: 共享BIN卡段必然因他人违规连坐风控，专业人士坚决规避，长期不可控
- concept: 基建复用资产
  desc: 真实美银行账户+实体美手机号，可复用于海外账号注册、跨境收款、美信用史建立，边际成本趋零
exercises:
- 'no': 1
  title: 风控场景诊断与归因分析
  contents:
  - 场景：用户使用日本节点机场VPN登录ChatGPT Plus账号，提示“not available in your country”，随后切换至香港节点登录，提示“无法加载历史信息”。
  - 问题：
  - 1. 这两个报错分别代表网络层限制还是账号层面封禁？依据是什么？
  - 2. 根据‘封号核心判定’定律，为何切换香港节点反而导致账号被封？
  - 3. 若该用户改用DashiSIM设置APN为us.dashi，是否能恢复访问？原理是什么？
- 'no': 2
  title: 三位一体基建方案选型与成本测算
  contents:
  - 假设你是一名准备长期从事TikTok Shop美区跨境电商的创业者，需同时解决：店铺注册美号验证、广告投放扣费、美金收款结汇、ChatGPT Plus辅助运营四大需求。
  - 问题：
  - 1. 网络层：对比DashiSIM美IP方案与自建VPS/购买机场节点，从IP纯净度、风控通过率、长期维护成本三维度分析优劣。
  - 2. 身份层：Ultra Mobile $3 PayGo卡首年总成本约几元人民币？相比接码平台单次几元，长期持有10个海外账号注册需求下的边际成本如何计算？
  - 3. 支付层：华美Velo实体卡邮寄时效与Wise电子卡即时开通的差异，对‘广告投放扣费’这一高频刚需场景的影响？建议主用哪张卡？为何？
- 'no': 3
  title: 基建资产复用路径设计
  contents:
  - 已完成DashiSIM（美IP）、Ultra Mobile（美号）、华美Velo（美借记卡）、Wise（多币种账户）四件套部署。
  - 问题：
  - 1. 设计一套‘注册海外社媒矩阵账号（FB/Ins/Twitter/TikTok/Telegram）→ 养号 → 接入广告投放 → 收款结汇’的标准化SOP，标注每一步复用的基建组件。
  - 2. 华美Velo实体卡激活后，如何规划申请美国信用卡（如Amex/Chase）建立FICO信用史的路径？关键节点有哪些？
  - 3. Wise多币种账户收到美金后，如何通过‘换汇→提现国内银行卡’实现结汇？汇率损耗与时效如何估算？对比传统离岸账户/地下钱庄优劣。
units:
- 'no': 1
  name: 封号核心判定：IP归属地为第一风控维度
  points:
  - '**为什么需要这个概念？**'
  - '- OpenAI 2023年3月大规模封号事件中，亚洲IP（台/日/港）命中率高达40%'
  - '- 账号注册时间、Plus会员状态、行为模式均非主导因素，地域画像才是核心风控指标'
  - '- 必须从网络层源头解决IP归属地问题，而非依赖账号层面的申诉补救'
  - '**核心定义**'
  - '- 封号核心判定定律：OpenAI风控系统以IP归属地地域画像为第一维度，亚洲IP为重灾区'
  - '- 亚洲IP高风险名单：台湾、日本、香港三地IP封号命中率目测约40%'
  - '- 账号异常识别：无法加载历史/输入框无法发送=账号被封；not available=网络/IP限制'
  - '**关键性质**'
  - '- 地域画像优先于账号画像：IP地址决定生死，而非账号本身的信誉积累'
  - '- 预防大于补救：申诉邮件成功率未知，基建合规性是唯一确定性路径'
  - '- 三大生存铁律：拒绝亚洲IP、拒绝频繁换IP、拒绝一IP多号'
  - '**典型例子**'
  - '- 2023年3月31日后，大量使用台湾/日本/香港节点的用户账号批量失效，而欧美原生IP账号存活'
  - '- 同一账号切换至非亚洲原生IP后恢复正常，切回亚洲IP再次受限'
  - '**边界条件**'
  - '- 仅针对OpenAI/ChatGPT等特定高风控服务，不代表所有海外服务同等标准'
  - '- 企业级专线/原生住宅IP成本高昂，个人/小团队需权衡成本收益'
  - '- 平台风控策略可能迭代，需持续关注IP信誉维度变化'
  sources:
  - paper: docs/202305/TSZBdBfynoBINux2htWcefrtnHc.md
    role: origin
  excerpts:
  - 从3月31日开始OpenAI大规模封号，而且主要集中在亚洲地区，特别是ip地址在台湾、日本、香港三地的，命中率目测40%。新注册的账号、Plus也不好使了。
  - 如果你登陆的时候出现“提示无法加载历史信息”或“输入框输入内容无法发送”，账号可能被封。其他情况报错，比如“not available in your……”等，则不一定是账户的问题。
  - 第一，不要使用亚洲IP。第二，近期不要频繁更换IP。第三，同一个IP不要登录多个账号。
- 'no': 2
  name: 网络层基建：DashiSIM多APN漫游获取美/欧/新原生IP
  points:
  - '**为什么需要这个概念？**'
  - '- 必须规避亚洲IP高风险区，但自建节点/机场IP极易被识别为代理/机房IP'
  - '- 需要零月租、按需充值、长期可用、速度快的原生住宅/移动IP方案'
  - '- 传统VPN/机场IP共享度高、IP质量不可控、频繁换IP触发风控'
  - '**核心定义**'
  - '- APN切换技术：通过修改手机接入点名称(APN)实现同一张物理SIM卡切换不同国家网关出口'
  - '- DashiSIM方案：一张实体卡支持us.dashi(美)、eu.dashi(法/欧)、sg.dashi(新)三套APN配置'
  - '- 原生IP获取：国内漫游直连中国移动5G网络，出口为对应国家原生住宅/移动IP'
  - '**关键性质**'
  - '- 零月租按需充值：无保号压力，随用随充，长期持有成本极低'
  - '- 单IP单号固定使用：物理隔离网络环境，彻底规避一IP多号与频繁换IP风险'
  - '- 速度稳定：走中国移动5G直连，延迟低、带宽足、适合长时间交互'
  - '**典型例子**'
  - '- 设置APN为us.dashi获取美国原生IP，配合ChatGPT Plus长期稳定访问'
  - '- 设置APN为eu.dashi获取法国原生IP，适配欧洲区业务场景'
  - '- 设置APN为sg.dashi获取新加坡原生IP，作为备选低延迟方案'
  - '**边界条件**'
  - '- 需支持APN设置的设备(手机/随身WiFi/Cat6/路由器)，纯软件客户端无法使用'
  - '- 漫游依赖中国移动国际通道，极端网络管制环境下可能受限'
  - '- 欧洲IP实测为法国IP，非德国/荷兰等热门节点，部分需特定国家IP场景需验证'
  sources:
  - paper: docs/202305/TSZBdBfynoBINux2htWcefrtnHc.md
    role: origin
  excerpts:
  - 可提供三个国家和地区的IP地址：美国、欧洲、新加坡（通过设置不同的APN来实现IP地址切换，目前欧洲IP实测出来是法国IP）
  - 在中国漫游直接是中国移动的5G信号，速度非常快
  - 可长期持有，不需要充值保号/保卡，零月租。随时可以通过充值来再次激活使用。
  - 选择不同的APN，可以切换不一样的国家的原生IP
- 'no': 3
  name: 身份层基建：Ultra Mobile $3 PayGo实体卡+WiFi Calling长期保号
  points:
  - '**为什么需要这个概念？**'
  - '- ChatGPT账号注册/登录/找回均需美国手机号接码，虚拟号/接码平台极易失效被风控'
  - '- 需要长期持有、低成本、实体SIM卡、支持境外漫游接收短信的美国号码'
  - '- 传统实体卡漫游费高昂、保号麻烦、不支持WiFi Calling无法在境内接码'
  - '**核心定义**'
  - '- MVNO保号卡：移动虚拟网络运营商提供的低成本套餐，核心价值是极低维持成本保持美国实体号存活'
  - '- Ultra Mobile $3 PayGo：月租$3含100分/100条/100MB，基于T-Mobile网络'
  - '- WiFi Calling漫游：无实体基站信号下通过WiFi接入运营商核心网，实现境内收发短信/接打电话'
  - '**关键性质**'
  - '- 实体卡实名合规：物理SIM卡实名注册，号码真实有效，通过OpenAI实名验证'
  - '- 长期自动保号：绑定国内银行卡自动扣费$5/月(含税)，无需人工干预'
  - '- eSIM支持：实体卡激活后可转eSIM写入手机eSIM槽位，释放物理卡槽'
  - '**典型例子**'
  - '- 淘宝/闲鱼购买实体卡(~200元) -> 官网激活$3套餐 -> 开启WiFi Calling -> 绑定国内卡自动扣费 -> 长期接收ChatGPT验证码'
  - '- 同一号码同时用于注册Facebook/推特/电报/ChatGPT等多海外服务'
  - '**边界条件**'
  - '- 首年成本约200元(卡费)+$60(月租税费)约400元，后续仅月租成本'
  - '- 需支持WiFi Calling的手机(绝大多数iPhone/安卓旗舰支持，部分定制机不支持)'
  - '- 仅适用于接收验证码/保号场景，不适合大流量上网(仅100MB漫游流量)'
  sources:
  - paper: docs/202305/TSZBdBfynoBINux2htWcefrtnHc.md
    role: origin
  excerpts:
  - 淘宝或者咸鱼去搜索 UltraMobile 这个关键词
  - 月租 $3，包含 100 分钟通话 + 100 条短信 + 100 MB 美国国内流量
  - 支持漫游 WiFi Calling，支持漫游 WiFi Calling over Cellular Data
  - 可在网站或者 app 上绑定银行卡后每月自动充值，最小金额为 $5。有税费，所以每次银行卡扣款金额会超过 $5，支持中国大陆卡
- 'no': 4
  name: 支付层基建：真实金融身份 > 虚拟卡/临时接码
  points:
  - '**为什么需要这个概念？**'
  - '- ChatGPT Plus订阅需绑定国际信用卡，国内双币卡/虚拟卡成功率极低且极易触发风控'
  - '- 共享BIN虚拟卡(Nobepay/Vvacard等)必然因他人违规导致卡段污染连坐封禁'
  - '- 需要真实美国银行账户、真实账单地址、可长期自动扣款的合规支付方案'
  - '**核心定义**'
  - '- 零门槛开户：华美银行Velo无需护照/签证/美号/美地址/预存款即可远程开真实美借记卡/信用卡'
  - '- Wise多币种电子卡：护照实名+$20入金即时生成电子借记卡(真实账单地址/CVV/完整卡号)'
  - '- 真实金融身份：拥有FDIC存款保险的真实银行账户，而非共享卡段的虚拟预付卡'
  - '**关键性质**'
  - '- 华美Velo：FDIC成员银行资金安全，实体卡邮寄/虚拟卡即用，可后续申请真美信用卡建立信用史'
  - '- Wise电子卡：一次KYC获取美/英/欧/日等多国本地账户，多币种收款兑换，余额充足即可持续续费'
  - '- 虚拟卡污染风险：共享卡段必然连坐，专业人士坚决不用，长期不可控'
  - '**典型例子**'
  - '- Velo开户：Google Play下载App -> 提交身份证/自拍 -> 审核通过 -> 获虚拟卡即时付ChatGPT Plus -> 实体卡后续邮寄'
  - '- Wise开户：邀请链接注册 -> 护照实名 -> 入金$20激活 -> 复制电子卡信息填入ChatGPT支付页 -> 自动续费'
  - '**边界条件**'
  - '- Velo需通过Google Play下载官方App，国内应用商店可能无法获取'
  - '- Wise需护照实名认证，无护照用户无法使用'
  - '- 两者均需少量启动资金(Velo无预存款要求，Wise需$20入金激活)'
  sources:
  - paper: docs/202305/TSZBdBfynoBINux2htWcefrtnHc.md
    role: origin
  excerpts:
  - 办理零门槛：1、无需护照；2、无需美国签证；3、无需美国电话号码；4、无需美国地址；5、无需预存款；
  - 电子卡的所有信息，账单地址，卡号，卡主姓名还有CVV 有效期都是真实有效的，按上面复制粘贴即可使用，只要你的Wise里有钱，就可以一直付账。
  - 我们的专业人士一般不用这种虚拟卡，因为容易被别人玩坏，影响自己。
  - 华美是美国纳斯达克的上市公司... 也是FDIC的成员，所以有存款保险制度
