units:
- 'no': 1
  name: Mediabuy品牌词竞价 —— 用近零CPC撬动联盟佣金杠杆
  points:
  - '**为什么需要这个概念？**'
  - '- 传统联盟营销依赖SEO/内容自然流量，周期长、不稳定、难放大'
  - '- 广告联盟账期长、存在扣量风险、佣金相对较低'
  - '- 需要一种可控、即时结算、高ROI的付费流量变现闭环'
  - '**核心定义**'
  - '- 利用Google Ads竞价商家品牌词（或竞品词），广告链接直接指向联盟追踪链接'
  - '- 核心公式：利润 = (EPC - CPC) × 点击量，前提是 CPC < EPC'
  - '- 品牌词因相关性极高、竞争极小，实际CPC可压至0.01当地货币单位'
  - '**关键性质**'
  - '- 质量得分满分：品牌词与广告主官网完美匹配，Google给予最高质量分'
  - '- 无竞争护城河：商家通常不竞价自己品牌词，竞争对手受合规限制不敢竞'
  - '- 即时结算优势：对接官方推荐计划/双周付联盟，规避联盟长账期与扣量'
  - '- 货币套利空间：港币账户0.01 HKD ≈ 0.0013 USD，成本再降7倍'
  - '**典型例子**'
  - '- 账户组1：佣金$5715 / 花费$1220 / 净利$4495 / ROI 368%'
  - '- 账户组2：佣金$7218 / 花费$1210 / 净利$6008 / ROI 496%'
  - '- 账户组3：佣金$3988 / 花费$867 / 净利$3121 / ROI 359%'
  - '- Wise推荐计划同构案例：品牌词CPC £0.01-0.02 / 单笔佣金£50 / 日佣破万镑'
  - '**边界条件**'
  - '- 必须筛选“允许品牌词竞价”的Offer（显性允许/默许/允许竞品词三层光谱）'
  - '- 依赖Google Ads政策与商家合规团队博弈平衡，非永久漏洞'
  - '- 需解决海外收款、Google开户、联盟审核等基建门槛'
  - '- 单人操作上限受限于精力与风控，规模化需团队化标准化流程'
  sources:
  - paper: M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  - paper: 20230516_050.md
    role: improve
  excerpts:
  - 'Mediabuy Brand Bid: 通俗的理解就是付费流量购买，通过付费的方式购买流量来推广商家的链接，赚取佣金和流量费用支出中的利差。'
  - 申请到广告利用Google Ads，出价他们的品牌词，但是广告链接是你自己的即可。
  - 因为你是出价品牌词，品牌词实际谷歌出价是无限接近于零，也是免费，所以只要你设置没问题，单价到0.01完全没有问题
  - 当你的CPC本身是0.01的单价的时候，基本上任何产品都会赚钱，很少见到有EPC低于0.01的广告联盟里的Offer。
  - 佣金收入：3403英镑+835欧元+369美元；汇率划算后，合计佣金收入：5715美元；广告成本：1220美元；利润：4495美元；回报率：ROI = 368%
  - 佣金收入：4913英镑+685欧元+67美元；合计佣收入：7218美元；广告成本：1210美元；利润：6008美元；回报率：ROI = 496%
  - 佣金收入：3031英镑+37美元；合计佣收入：3988美元；广告成本：867美元；利润：3121美元；回报率：ROI = 359%
  - 个人用户推荐可以获得 50 英镑的佣金，这样我们就可以用 Mediabuy 的方式，谷歌或者 Bing 购买相关关键词，赚取利差。
  - 因为 Wise 确实信誉好，我每天点 50 英镑点得手都累了，因为只要三个用户满足条件，这边立即显示可以取现 50 英镑
  - 国外有很多商家，允许你出价他们的品牌词，而且一定可以出价他们竞争对手的品牌词。此方法不是违规的吗？这句话对，也不对，
  - 这个项目可以做多久？我们从十几年前就这样玩，只是某些广告主以及广告联盟的合规团队要求比较严格而已。
  - 如果不追求极致，控制一个风险比，一年一百万人民币以上非常轻松。
  - 这里面如果是用港币账户，成本还可以降低至少七倍
- 'no': 2
  name: 三步标准化执行流程 —— 从开户到直链投放的最小闭环
  points:
  - '**为什么需要这个概念？**'
  - '- 降低技术门槛：无需建站、搭建落地页、配置复杂追踪'
  - '- 规避审核风险：直链联盟链接减少Google Ads拒登概率'
  - '- 可复制性强：标准化SOP让新手能快速跑通0-1'
  - '**核心定义**'
  - '- 步骤1：准备Google Ads账户（个人开户或代理商开户均可）'
  - '- 步骤2：注册Awin等双周支付联盟，筛选大体量品牌词Offer并申请通过'
  - '- 步骤3：创建搜索广告活动，竞价品牌词/竞品词，最终URL直填联盟追踪链接'
  - '**关键性质**'
  - '- Direct Linking策略：广告落地页直接用联盟链接，省去建站成本与维护'
  - '- Awin联盟优势：双周支付、大品牌多、允许品牌词竞价、信誉好'
  - '- 账户体系分离：个人号/代理号、MCC管理、多币种账户（港币/美元）'
  - '**典型例子**'
  - '- 实操中三组账户均采用此流程，无一例外实现350%+ ROI'
  - '- Wise案例同样适用：注册Wise推荐链接 → Google/Bing Ads竞品牌词 → 直链推荐链接'
  - '**边界条件**'
  - '- Google Ads账户质量决定存活周期，需养号或购买老号/代理户'
  - '- 联盟Offer申请需通过审核，新号通过率低，需包装资质或找渠道'
  - '- 直链模式无法植入自有追踪代码，数据分析依赖联盟后台与Google Ads转化'
  sources:
  - paper: M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  - paper: 20230516_050.md
    role: apply
  excerpts:
  - 1，准备一个Google Ads的帐号，个人开户或者代理商开户均可。
  - 2，注册一个广告联盟的帐号，找到有大体量品牌词的广告。
  - 3，申请到广告利用Google Ads，出价他们的品牌词，但是广告链接是你自己的即可。
  - 广告联盟虽然有很多有信誉又好的广告联盟，我们一般用Biweekly支付的Awin广告联盟来说明。
  - 注册 Wise 获取推荐链接（隐含步骤），谷歌或者 Bing 购买相关关键词，出价 0.01 即可...
  - 申请到广告利用Google Ads，出价他们的品牌词，但是广告链接是你自己的即可。
- 'no': 3
  name: Offer筛选启发式规则 —— 只捡确定性高的钱
  points:
  - '**为什么需要这个概念？**'
  - '- 联盟Offer数以万计，盲目测试极其浪费时间和广告费'
  - '- 品牌词竞价合规性差异大，选错Offer直接导致封号或佣金不结算'
  - '- 需要一套快速筛选高胜率标的的标准化清单'
  - '**核心定义**'
  - '- 硬指标1：大体量品牌词（搜索量大、品牌知名度高、天然流量池深）'
  - '- 硬指标2：允许竞价品牌词/竞品词（读TOS条款、咨询AM、测试小额验证）'
  - '- 硬指标3：EPC显著 > $0.01（留足利润缓冲，规避波动亏损）'
  - '- 硬指标4：双周支付周期（现金流安全，降低平台跑路/拖欠风险）'
  - '**关键性质**'
  - '- 品牌词量级决定流量上限：小众品牌词搜索量不足，无法放量'
  - '- 合规光谱判断：显性允许>默许>仅允许竞品词，优先级递减'
  - '- EPC波动容忍度：EPC越高，抗CPC上涨/汇率波动能力越强'
  - '- 支付周期即风控：月付/季付联盟资金占用成本高，双周付为准入线'
  - '**典型例子**'
  - '- Awin网盟中筛选大品牌（如知名SaaS、电商平台、金融服务商）'
  - '- Wise自带推荐计划：品牌词Wise/TransferWise，EPC固定£50/单，转化率极高'
  - '- 竞品词策略：竞价竞争对手品牌词，合规风险更低，流量更精准'
  - '**边界条件**'
  - '- 热门大牌Offer竞争激烈，联盟审核极严，新手极难通过申请'
  - '- 商家合规政策随时收紧，需建立Offer监控预警机制'
  - '- 汇率波动影响跨币种账户实际ROI，需做汇率套利或锁汇'
  sources:
  - paper: M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  - paper: 20230516_050.md
    role: apply
  excerpts:
  - 找到有大体量品牌词的广告。
  - 国外有很多商家，允许你出价他们的品牌词，而且一定可以出价他们竞争对手的品牌词。
  - 很少见到有EPC低于0.01的广告联盟里的Offer。
  - 广告联盟虽然有很多有信誉又好的广告联盟，我们一般用Biweekly支付的Awin广告联盟来说明。
  - 佣金收入：3403英镑+835欧元+369美元
  - 因为很多有争议的说，这种涉嫌违规的投放，可能广告主不给钱，其实我主要觉得账期长了，而且推荐佣金还高一些
  - 因为 Wise 确实信誉好... 立即显示可以取现 50 英镑
- 'no': 4
  name: 极低成本出价策略 —— 让流量成本趋近于零
  points:
  - '**为什么需要这个概念？**'
  - '- CPC是项目唯一显性成本，压低CPC直接等于提高净利率'
  - '- 品牌词天然具备低CPC基因，但出价策略决定能否吃到红利'
  - '- 汇率差异提供额外套利空间，是单人放大规模的关键杠杆'
  - '**核心定义**'
  - '- 最高CPC设为0.01当地货币单位（USD/HKD/EUR等）'
  - '- 利用港币账户：0.01 HKD ≈ 0.0013 USD，成本再降7倍以上'
  - '- 智能出价模式：目标转化费用/最大化点击，辅以极低上限控制'
  - '**关键性质**'
  - '- 质量得分杠杆：品牌词QS满分→实际CPC远低于出价上限'
  - '- 竞价底价机制：Google允许的最低出价即0.01，触底即止损'
  - '- 预算控制：日预算设定兜底，防止异常流量烧光本金'
  - '- 投放时段：24小时全天候，品牌词搜索无明显时段性波动'
  - '**典型例子**'
  - '- 实测三组账户平均CPC均在$0.01-$0.02区间'
  - '- 港币账户理论推演：日花费$100等效港币账户仅需$15成本'
  - '- Wise案例：起步出价£0.01，放量后仅涨至£0.02，成本可忽略不计'
  - '**边界条件**'
  - '- 出价过低可能导致展现份额不足，需平衡CPC与展现量'
  - '- 港币账户开户难度大、汇率风险需自担、Google政策可能收紧'
  - '- 单账户日预算上限限制放量，规模化需多账户矩阵/MCC管理'
  sources:
  - paper: M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  - paper: 20230516_050.md
    role: apply
  excerpts:
  - 品牌词实际谷歌出价是无限接近于零，也是免费，所以只要你设置没问题，单价到0.01完全没有问题
  - 如果你了解各个国家的汇率，这个0.01是当地货币的0.01，比如港币的0.01港币成本远小于美元的0.01美元。
  - 这里面如果是用港币账户，成本还可以降低至少七倍，但是这些与这个项目是否赚钱关系不大，也没必要在本身比较低的项目成本上过度优化。
  - 其实一开始只需要出价 0.01 即可，后面因为我要放天量，成本上升到了 0.02。广告成本在这个项目里完全不决定你是否赚钱，因为可以忽略不计。
  - 当你的CPC本身是0.01的单价的时候，基本上任何产品都会赚钱
- 'no': 5
  name: 合规性边界与风险控制 —— 在灰度地带安全生存
  points:
  - '**为什么需要这个概念？**'
  - '- 品牌词竞价处于商家合规、联盟条款、Google政策三重夹缝'
  - '- 违规后果：Google封号、联盟扣佣/封号、商家投诉法律追责'
  - '- 必须建立合规红线与熔断机制，实现长期可持续操作'
  - '**核心定义**'
  - '- 合规光谱三层级：显性允许(白名单) > 默许(灰名单) > 仅允许竞品词(红线内)'
  - '- 红线：严禁竞价明确禁止品牌词的商家，严禁伪装官方/欺诈性文案'
  - '- 熔断机制：单账户日亏损上限、单Offer异常监控、账户健康度定期体检'
  - '**关键性质**'
  - '- 商家需求决定存续：商家需要品牌流量、联盟要推广量、Google要广告费，三方博弈平衡点长期存在'
  - '- 合规收紧周期性：大促/敏感期合规收紧，平时相对宽松，需动态调整'
  - '- 账户资产隔离：广告账户/联盟账户/收款账户三分离，单点失效不伤筋动骨'
  - '**典型例子**'
  - '- 作者操作十余年未被封杀，印证‘平衡点长期存在’'
  - '- Wise推荐计划官方默许品牌词投放，实名操作零封号'
  - '- 遇合规收紧期：暂停违规Offer、切换竞品词、降低日预算观望'
  - '**边界条件**'
  - '- 无法完全规避政策突变风险（如Google全面禁品牌词竞价）'
  - '- 单人操作难以应对规模化合规审计，团队化需法务/合规专岗'
  - '- 收款渠道（Wise/Payoneer/银行）合规收紧可能导致资金冻结'
