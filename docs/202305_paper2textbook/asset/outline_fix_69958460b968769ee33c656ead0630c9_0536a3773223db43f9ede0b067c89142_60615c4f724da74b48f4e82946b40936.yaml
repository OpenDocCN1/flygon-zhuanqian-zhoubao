- 'no': 1
  name: 资料整理商业模型 —— 从“卖资料赚小钱”到“筛选用户造大钱”
  desc: 本章对比两篇实战复盘，揭示资料整理的商业本质：资料是零边际成本的杠杆钩子，核心利润来自后端自有高附加值产品/服务体系。通过 MVP 思维跑通“选品-引流-私域-分层变现”最小闭环。
  nodes:
  - 'no': 1
    name: 资料整理的杠杆属性与商业定位
    desc: 基于纳瓦尔杠杆理论，界定资料整理为‘复制边际成本近零’的媒介产品，其核心价值不在于贩卖资料本身，而在于筛选精准付费用户、沉淀私域资产。
    role: motivation
    src:
    - paper: docs/202305/20230516_046.md
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
  - 'no': 2
    name: 引流载体与变现主体分离原则
    desc: 确立‘资料是别人的（钩子），产品必须是自己的（本体）’的底层逻辑。混淆二者会陷入低利润红海；分离二者才能构建高客单价、复利增长的商业模型。
    role: definition
    src:
    - paper: docs/202305/20230516_046.md
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
  - 'no': 3
    name: 变现分层漏斗设计：资料→咨询→高客单体系
    desc: 设计三层递进变现路径：低价资料（筛选付费意向/建立信任）→ 低价咨询（深度连接/挖掘需求/互惠红包）→ 高客单产品/训练营/资源对接（核心利润/复利上限）。
    role: method
    src:
    - paper: docs/202305/20230516_046.md
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
  - 'no': 4
    name: 最小可行性商业闭环（MVP）跑通实操
    desc: 以最快速度验证‘选品定位→渠道操作→私域承接→变现分层’全链路，通过数据复盘（引流量、转化率、客单价、LTV）决定是否加大投入。
    role: method
    src:
    - paper: docs/202305/20230516_046.md
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
  - 'no': 5
    name: 实战数据复盘与避坑指南
    desc: 4天实测：日均投入2小时，日均引流180+，资料付费转化60%，咨询二次转化30%，单用户ARPU超200元。总结头条号自动回复引流机制、私域双号风控、免费引流低质等关键经验。
    role: experiment
    src:
    - paper: docs/202305/20230516_046.md
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
- 'no': 2
  name: 知识创作系统 —— 从“囤资料”到“生产知识资产”
  desc: 本章基于 DIKW 模型与 P.A.R.A 组织法，构建‘收集筛选→萃取内化→动态组织→创作输出’的个人知识生产线，解决‘收藏夹吃灰’与‘搬运工’困境，实现知识复利。
  nodes:
  - 'no': 1
    name: PIM/PKM/知识创作的三层级跃迁
    desc: 澄清资料整理（PIM，整理他人信息）、知识管理（PKM，加工自有信息）、知识创作（输出原创成果）的本质区别。只有建立以创作输出为导向的系统，才能避免低水平勤奋。
    role: definition
    src:
    - paper: docs/202305/20230516_061.md
  - 'no': 2
    name: 克制收集四准则：有用、启发、新颖、私人
    desc: 基于香农信息论（新颖性=惊讶度）与个人经验独特性，建立信息入库‘漏斗’：仅保留服务于当前/未来项目、能激发灵感、具有惊讶度、属于私人独特思考的素材，拒绝无差别囤积。
    role: method
    src:
    - paper: docs/202305/20230516_061.md
  - 'no': 3
    name: 渐进式总结五层法：信息→知识→智慧的标准化萃取
    desc: 引入 Tiago Forte 五层脚手架：L1 高亮标记 → L2 自语复述（内化） → L3 段落合并（结构化） → L4 核心观点压缩 →
      L5 转化为提问（迁移/智慧）。按素材价值密度决定执行层级，兼顾深度与效率。
    role: method
    src:
    - paper: docs/202305/20230516_061.md
  - 'no': 4
    name: 动态 P.A.R.A 组织系统：让笔记流向‘最快用到之处’
    desc: 摒弃静态分类，采用‘项目→领域→资源→档案’四象限动态流转。决策树：服务当前截止日期项目→Project；服务长期责任领域→Area；其余→Resource；完成/废弃→Archive。组织服务于行动而非分类。
    role: method
    src:
    - paper: docs/202305/20230516_061.md
  - 'no': 5
    name: 知识创作系统的实战验证与对比分析
    desc: 作者实测：基于该系统产出14篇精华帖、统筹2.4万订阅专栏。读者对比反馈：渐进式总结较卢曼卡片笔记法门槛更低、操作指引更强、更难陷入‘通篇搬运’陷阱。
    role: experiment
    src:
    - paper: docs/202305/20230516_061.md
- 'no': 3
  name: 付费即筛选，信任源于交换 —— 私域成交的心理学与话术
  desc: 本章深度拆解‘付费验证意向→低价咨询建立信任→互惠红包强化连接→高客单转化’的心理机制与标准化话术，将私域运营从‘加好友’升级为‘设计交易路径’。
  nodes:
  - 'no': 1
    name: 付费筛选双重验证：兴趣强度与付费意识
    desc: 用户哪怕支付 9.9 元，即完成两重筛选：验证对该垂直领域的强兴趣、验证具备知识付费意识。免费用户无法判断付费潜力，且易低估资料商业价值。
    role: motivation
    src:
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
  - 'no': 2
    name: 商业信任仅通过价值交换建立
    desc: 信任不是聊天聊出来的，而是通过‘交付价值-收取对价’的交易循环建立。低价咨询（如200元）是低风险的信任启动器，而非单纯赚取咨询费。
    role: definition
    src:
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
  - 'no': 3
    name: 咨询式成交标准化话术与红包复投模型
    desc: SOP：收取低价咨询费→专业解决问题→引导用户自发发红包（88-120元，互惠心理/沉没成本）→ 基于消费能力画像推荐高客单产品。实测 99%
      用户发红包，30% 转化高客单。
    role: method
    src:
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
  - 'no': 4
    name: 私域运营风控与规模化基建
    desc: 双号分流加好友（规避频率限制）、支付宝/多渠道分离收款（规避风控冻结）、助理接待标准化 SOP，为规模化引流提供基础设施保障。
    role: extension
    src:
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
- 'no': 4
  name: 垂直赛道产品化案例库与选品决策框架
  desc: 本章沉淀典型‘资料引流+自有服务变现’的组合模式，提供选品三要素决策法，指导读者根据个人禀赋、用户商业价值、渠道匹配度选择最适合的赛道切入。
  nodes:
  - 'no': 1
    name: 典型垂直场景产品化组合模式库
    desc: 高中资料→高考志愿填报咨询；英语资料→英语训练营；阅读资料→读书营/社群；商业资料/天涯神贴→商业咨询/高客单课程/资源对接。展示‘踏脚石理论’的多元落地范式。
    role: experiment
    src:
    - paper: docs/202305/20230516_046.md
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
  - 'no': 2
    name: 选品三要素决策法：兴趣/商业价值/渠道匹配
    desc: 决策框架：1）是否符合个人喜好、擅长及长期规划；2）资料背后用户群体的商业价值可延展性（能否开发高客单后端）；3）目标用户活跃度与渠道流量分发机制的匹配度。
    role: method
    src:
    - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
  - 'no': 3
    name: 输入-重构-输出能力建设循环
    desc: 资料整理不应止步于搬运，而应形成‘整理输入（学习/筛选）→ 重构输出（沉淀方法论/开发课程/服务）→ 打磨能力/产品体系’的正向飞轮，构建个人核心竞争力护城河。
    role: extension
    src:
    - paper: docs/202305/20230516_046.md
- 'no': 5
  name: 生财技能导航图谱 —— 核心技能清单与学习路径索引
  desc: 本章汇总生财有术社区核心技能库全景，提供技能分类导航与学习路径索引，作为读者按需检索、系统化构建个人商业能力树的总目录。
  nodes:
  - 'no': 1
    name: 生财技能库全景分类与检索入口
    desc: 记录生财有术社区沉淀的核心技能清单文档标题与链接，覆盖流量获取、产品变现、私域运营、知识管理、投资理财等核心板块，作为全书知识体系的外部延伸索引。
    role: definition
    src:
    - paper: docs/202305/20230516_012.md
    - paper: docs/202305/20230516_060.md
