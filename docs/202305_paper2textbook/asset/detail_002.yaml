- 'no': 3
  name: 承认无能是进阶前提 —— 身居高位的“脑损伤”、全能幻觉与归因校准法
  points:
  - '**为什么需要这个概念？**'
  - '- 管理者/创业者身处高位极易产生“全能幻觉”，误把运气归因于能力'
  - '- 长期高位会生理性导致“镜像神经元减少、共情下降”（脑损伤），加剧认知盲区'
  - '- 不承认无能就听不进建议、不知进退，导致决策失误甚至组织崩塌'
  - '**核心定义**'
  - '- 身居高位的脑损伤：长期处于高权力职位导致镜像神经元减少、共情能力下降的神经生理机制'
  - '- 全能幻觉：管理者误将运气、风口归因于自身决策正确、勤奋聪明，认为自己无所不能、无所不知'
  - '- 归因校准法：将成功归因从“内部归因”（能力、努力）显性校准为“外部归因”（风口、运气），打破幻觉'
  - '- 认知无知的悖论：识别自身无知的前提是拥有相当程度的认知能力（不知者无畏）'
  - '**关键性质**'
  - '- 生理基础：权力物理重塑大脑结构，非比喻而是生物学事实'
  - '- 系统性偏差：成功归因内部化是普遍规律，需刻意对抗'
  - '- 动态平衡：既要“承认无知”保持空杯，又要“防范忽悠”保留验证机制（看人看事验证法）'
  - '**典型例子**'
  - '- 小马宋创业46条第13条：老板常觉得自己伟光正，实则是赶上风口+运气好'
  - '- 评论区共识：“越成功越难发现盲区”、“认识自己难，认识不足更难”'
  - '**边界条件**'
  - '- 盲目承认无能且无判断力＝被专业人士忽悠（需“看做没做、做得如何”验证）'
  - '- 低认知者无法识别自身无知，陷入双重诅咒'
  - '- 古语“自知之明”虽通俗，实操难度极高，需配合具体工具（归因校准、知行合一验证）'
  sources:
  - paper: docs/202305/20230516_055.md
    role: origin
  - paper: docs/202305/M5lpdRp7OoHZAYxuDiicgGtSnpg.md
    role: improve
  excerpts:
  - 这个学术上有个概念，叫身居高位产生的脑损伤，做高管做老板久了，他的镜像神经元会减少，共情能力会下降。
  - 做老板的人，常常会产生一种幻觉，觉得自己伟光正，什么都能，什么都懂……其实有的时候，你发了财不过就是赶上了风口，又因为运气好……但我们自己往往会觉得是因为自己决策正确，勤奋努力，聪明决定。
  - 但这个死结在于，要认识的自己的无知，往往需要相当程度的认知能力。
  - 所以看一个人不要只听他说，还要看他做没做，以及做得如何。
- 'no': 4
  name: 认知黑洞与决策力 —— 抛开评判心、吸收优质信息、乐观构想-悲观计划-乐观实行
  points:
  - '**为什么需要这个概念？**'
  - '- 人生拼的是决策能力（选择最优解），而非运气'
  - '- “否决即关上认知大门”会形成认知黑洞，导致吸收优质信息能力丧失'
  - '- 一切大亏钱源于认知缺陷（黑洞），必须修补黑洞提升决策确定性'
  - '**核心定义**'
  - '- 认知黑洞：因评判心/否决心导致的认知吸收能力缺失区，一旦否决一事，就关上了该事所有相关认知的大门'
  - '- 决策力：在不确定性中识别最优解的能力，核心源于吸收优质信息的能力'
  - '- 三阶段决策模型：乐观构想（感性设定愿景） → 悲观计划（理性规避风险） → 乐观实行（感性执行落地）'
  - '- 鸡屎里找鸡蛋：信息源混杂优劣时，抛开评判，仅提取对决策有用的高价值信息（鸡蛋），摒弃无用部分（鸡屎）'
  - '**关键性质**'
  - '- 否决成本极高：一次情绪化否决可能永久切断一个认知领域的学习通道'
  - '- 理性局限：理性仅信已知、排斥未知，必须引入感性补全决策闭环'
  - '- 吸收力可训练：通过“抛开评判心”、“停留几秒激活元认知”等微操作可物理重塑大脑决策回路'
  - '**典型例子**'
  - '- 比高：“人所有亏的大钱，都是认知缺陷导致的”，通过“抛开评判心”从混杂信息中提炼决策养分'
  - '- 作者：面对烦心事通过“写作复盘”外化情绪，利用理智接管肉身，化解焦虑恢复掌控感'
  - '**边界条件**'
  - '- 非盲目接受一切信息，核心是“对决策有用”这一实用主义筛选标准'
  - '- 三阶段决策模型中“悲观计划”必须基于真实风险评估，非杞人忧天'
  - '- 元认知激活需“强制停留几秒”，违背本能惯性，初期执行阻力大'
  sources:
  - paper: docs/202305/20230516_056.md
    role: origin
  - paper: docs/202305/M5lpdRp7OoHZAYxuDiicgGtSnpg.md
    role: improve
  excerpts:
  - 选择比努力重要，其实是决策的意思，人往上走，其实拼的是决策能力。
  - 当你否决一件事时，就等同于关上了这件事所有相关的认知的大门，这会成为一个认知黑洞。
  - 人所有亏的大钱，都是认知缺陷导致的。
  - 优质信息怎么找，要先抛开评判心... 你不要评判我，你只要从我今天的内容中，找优质的信息，对你有用的，那些对你没用的，摒弃就行。
  - 因此，按照乐观构想（感性）、悲观计划（理性）、乐观实行（感性）的路径，就可以巧妙地避开理性思维的局限。
- 'no': 5
  name: 元认知训练 —— 停留几秒激活理智脑、写作复盘疏解情绪、三维语言重塑思维
  points:
  - '**为什么需要这个概念？**'
  - '- 大脑默认走“系统1”（快思考/本能/惯性），导致重复低级错误、情绪失控、思维僵化'
  - '- 元认知（感受自己在想什么）是激活“系统2”（慢思考/理智/逻辑）的开关'
  - '- 仅靠“懂道理”无效，必须通过生理层面的微操作重塑大脑决策回路'
  - '**核心定义**'
  - '- 元认知：感受自己在想什么、在思考什么的能力，是情绪控制、多视角思考的核心机制'
  - '- 停留几秒法：面对选择时强制停留几秒，启动元认知审视思维，打破本能默认选择'
  - '- 写作复盘法：情绪失控时通过书写将内心情绪外化，利用理智掌控肉身，使情绪平缓'
  - '- 三维语言重塑：强制输出积极/和善/开放语言，禁用消极/刻薄/绝对语言，通过语言重塑思维进而影响行为与结果'
  - '**关键性质**'
  - '- 生理可塑性：微操作（停留、书写、说话）可物理改变大脑神经回路（神经可塑性）'
  - '- 即时生效：每次执行即刻生效，无需等待长期积累'
  - '- 复利叠加：三套微操作相互强化，形成“元认知→情绪稳定→语言积极→思维开放”正向飞轮'
  - '**典型例子**'
  - '- 作者：“每当遇到需要选择的情况，先停留几秒思考，就有可能激活理智脑，做出不一样的选择”'
  - '- 作者：“假如碰到烦心事，通过写作复盘疏解，写下来就发现没什么大不了，理智把控全局”'
  - '- 作者：“无论遇到什么，说积极/和善/开放的话，避免被坏情绪侵蚀”'
  - '**边界条件**'
  - '- 停留几秒≠拖延症，是极短时间的强制认知介入'
  - '- 写作复盘≠日记流水账，核心是“挖掘深层原因、制定改进措施”'
  - '- 三维语言≠毒鸡汤/强行乐观，是基于“态度-行为-结果”因果链的理性选择'
  - '- 需配合“痛苦即成长信号”心态，将不适转化为升级动力'
  sources:
  - paper: docs/202305/M5lpdRp7OoHZAYxuDiicgGtSnpg.md
    role: origin
  - paper: docs/202305/20230516_056.md
    role: improve
  excerpts:
  - 每当遇到需要选择的情况时，你要是能先停留几秒思考一下，就有可能激活自己的理智脑，启用元认知来审视当前的思维，然后做出不一样的选择。
  - 假如真的碰到一件烦心事，可以通过写作复盘来疏解自己的烦心事，当你写下来的时候，你会发现也没什么大不了的，利用理智将内心的情绪“写下来”，情绪就会平缓下来，而你的理智就能够把控肉身、掌控全局。
  - 注意你自己的语言，语言会影响你的思维：无论遇到什么事情，说积极的话，不说消极的话；无论遇到什么人物，说和善的话，不说刻薄的话；无论遇到什么问题，说开放的话，不说绝对的话。
  - 痛苦哪里是什么坏事，它其实是上天给我们的成长信号与提示！
