- 'no': 4
  name: AI提示词迭代优化法 —— 用最难案例倒逼出扛打的标准化指令集
  points:
  - '**为什么需要这个概念？**'
  - '- 生成式AI（如Midjourney/SD）可控性差、随机性强，直接出图难以稳定商用'
  - '- 通用提示词模板泛化能力弱，垂直场景下细节崩坏（多指、肤色异常、不似）导致废片率高'
  - '- 需要一套可复用、可沉淀、可标准化的Prompt工程方法，将AI从“盲盒”变“流水线”'
  - '**核心定义**'
  - '- 基准案例法：精心挑选最难、最具代表性的边界案例（如模糊四维图、特殊肤色、复杂构图）'
  - '- 垫图生成：上传基准图作为Image Prompt/ControlNet参考，结合初版提示词生成'
  - '- 缺陷清单化：系统记录每轮生成的具体问题（皮肤坑洼、肤色不均、瑕疵、五官不似、视角错误）'
  - '- 针对性加词：按缺陷类型添加负面词（去坑洼）、修饰词（肤色均匀）、结构词（五官细节、视角控制）'
  - '- 回归测试：用10-20个多风格/多难度案例跑测，无重大缺陷则定版，沉淀为“扛打关键词组”'
  - '**关键性质**'
  - '- 逆向思维：不追求“一条Prompt通吃”，而是“基准案例定标准、边界案例测稳健”'
  - '- 资产化：沉淀出的关键词组是可复用、可传承、可估值的核心数字资产'
  - '- 持续迭代：模型版本更新、新场景接入时，仅需在基准案例库上增量测试调优'
  - '**典型例子**'
  - '- 四维预测项目：从“垫图生成→皮肤坑洼加负面词→肤色不均加修饰词→不似加五官结构词→多案例回归”5轮迭代，得出稳定关键词组'
  - '- 可复用至：同类人像还原、老照片修复、虚拟试穿等所有“参考图生成高相似度人像”场景'
  - '**边界条件**'
  - '- 依赖特定模型版本：Midjourney V5/V6、SDXL等模型迭代后关键词权重失效需重测'
  - '- 仅解决“相似度/可控性”问题：无法解决AI原生缺陷（如文本生成、逻辑推理、长视频一致性）'
  - '- 需领域知识支撑：懂摄影光影、人像解剖、色彩理论者迭代效率远高于纯试错'
  - '...'
  sources:
  - paper: docs/202305/20230516_073.md
    role: origin
  excerpts:
  - 1、特意挑了一张看起来就很不好还原的四维图，先垫图... 2、问题出现了，就解决问题，加上相关的关键词，除去皮肤上的坑洼... 3、继续解决问题... 4、再加上关键词...
    5、又尝试了其他的案例，出现不太像的问题，于是加上视角，以及五官细节的描述，还原度到位了。
  - 以上思考和实践，我们就有了扛打的关键词组。
  - 怎么把四维彩超变成相似度较高的宝宝图片呢？
  - 特意挑了一张看起来就很不好还原的四维图，先垫图，用一套简单的关键词，让它生成中国长相的婴儿...
- 'no': 5
  name: 热点事件极速入场法 —— 蹭政策/热点红利的“现学现卖”变现范式
  points:
  - '**为什么需要这个概念？**'
  - '- 宏观政策/重大事件（如碳中和、ChatGPT发布）会引发全网指数暴涨，形成短周期、高确定性的流量红利窗口'
  - '- 传统“深耕赛道”反应太慢，错过红利期；盲目跟风又无核心壁垒，陷入同质化内卷'
  - '- 需要一套“快速捕捉→极速验证→现学现卖→多渠道变现”的标准化动作包'
  - '**核心定义**'
  - '- 捕捉信号：监测权威发布、热搜榜单、行业大会、指数工具（百度指数/微信指数/抖音创意中心）异动'
  - '- 极速验证：直奔评论区提取高频提问（“是什么”、“怎么赚钱”、“怎么入行”、“考证有用吗”），确认大众认知断层与付费意愿'
  - '- 现学现卖：3-7天高强度输入，同步输出“大白话、条理化、框架化”内容（视频/文档/直播），不求学术深度，只求认知门槛最低'
  - '- 多维变现：资料包（低客单引流）、证书合作（高客单分成）、企业培训（B端高复购）、资源对接（信息差佣金）'
  - '**关键性质**'
  - '- 时间窗口短：通常1-3个月红利期，过期即变常识，需极速执行'
  - '- 认知套利：利用“专业信息”与“大众认知”的时间差，赚认知门槛降低的钱'
  - '- 产品形态灵活：不绑定单一形式，视频、文档、社群、课程均可承载'
  - '**典型例子**'
  - '- 碳中和项目：大大讲话后指数暴涨→评论区“啥是碳中和/怎么赚钱”→3天速成输出→2个月变现100万+（资料包/证书/培训/资源对接）'
