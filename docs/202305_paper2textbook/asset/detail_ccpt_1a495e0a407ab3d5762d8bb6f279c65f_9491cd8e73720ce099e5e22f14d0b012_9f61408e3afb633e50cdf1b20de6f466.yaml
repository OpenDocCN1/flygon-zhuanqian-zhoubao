units:
- 'no': 1
  name: 快手知识付费闭环 —— 公域直转无私域的短链路变现模型
  points:
  - '**为什么需要这个概念？**'
  - '- 传统知识付费需建私域、做朋友圈、搞转化，链路长、易劝退新手'
  - '- 新手因私域运营不善、封号风控、不会转化极易放弃'
  - '- 需要一条''发视频-挂链接-自动成交''的极简闭环跑通0-1'
  - '**核心定义**'
  - '- 在快手平台内通过短视频/直播直接挂载第三方课程平台(如易知课堂)小程序链接'
  - '- 核心特征：无需引流私域、无需营业执照资质、操作步骤极少、正反馈周期短(1-3天出单)'
  - '- 实现公域流量直接转化变现的完整商业路径'
  - '**关键性质**'
  - '- 闭环短：省去私域沉淀、朋友圈运营、人工销售等重环节'
  - '- 门槛低：无需授课资质、无需囤货发货、仅需199元押金(万粉免)'
  - '- 反馈快：运气好1-3天出单，快速建立新手信心'
  - '- 矩阵化：可批量注册账号、多号多赛道并行测试'
  - '**典型例子**'
  - '- 作者操盘8个账号覆盖4个类目，第25天达成稳定副业收益'
  - '- 办公软件赛道：红海但无头部IP，小白照抄对标仍可''喝汤'''
  - '- 编程教学赛道：公众号红海内容搬运至快手因搜索需求未满足而''吃肉'''
  - '**边界条件**'
  - '- 平台规则收紧可能导致小程序挂载受限或封号'
  - '- 课程内容同质化严重，长期依赖''编造销量评论''不可持续'
  - '- 单价极低(9.9-99元)，需大量出单才能规模化，受限于流量上限'
  - '- 核心竞争力在于''混剪去重技术''与''选品判力''，非课程内容本身'
  sources:
  - paper: docs/202305/Dy8mdu2JUoyQYRx2UnocHwOinaf.md
    role: origin
  excerpts:
  - 快手知识付费，说白了在快手上卖课，首先选好你要卖什么课（赛道），然后通过发视频带货或直播带货的方式卖课。
  - 他的优势是：操作步骤少...不需要资质...闭环路径短（发出去之后自动成交等收钱，不用引流到私域，营造朋友圈等）...正反馈很快（运气好的话1-3天就能出单）
  - 他最核心的优势就是不需要授课资质门槛，想卖啥课卖啥课，并且课程销量和评论都可以自己编。
  - 注册到最后会出现让交199押金的部分（易知不需要资质，与此相对的就需要押金，当然如果账号超过1万粉丝的话是不需要押金的）
- 'no': 2
  name: 双维度蓝红海判定法 —— 打破“人多即红海”的需求供给匹配模型
  points:
  - '**为什么需要这个概念？**'
  - '- 传统认知误区：认为竞争对手多就是红海，竞争对手少就是蓝海'
  - '- 实际痛点：很多‘没人做’的赛道是因为‘没人搜’(伪需求)；很多‘人挤人’的赛道因需求巨大仍有缺口(真蓝海)'
  - '- 需要一套量化、动态的赛道筛选决策框架指导新手选品'
  - '**核心定义**'
  - '- 维度一·需求缺口法：搜索量大但内容产出不足=蓝海(需求>供给)；搜索量小但内容泛滥=红海(供给>需求)'
  - '- 维度二·ROI法：投入精力/金钱成本低但产出比高(ROI高)=蓝海；投入高产出低=红海'
  - '- 两维度交叉验证，拒绝单一维度误判'
  - '**关键性质**'
  - '- 动态性：随平台算法、用户需求、竞品入场实时变化，需持续监测'
  - '- 相对性：蓝海非绝对无人，而是‘供给暂时无法满足需求’的窗口期'
  - '- 可操作性：提供具体验证动作(搜关键词看视频数/搜索量、算ROI)'
  - '**典型例子**'
  - '- 办公软件赛道：表面红海(Up主多)，实则内容同质化严重、用户痛点未被精准解决，小白照抄仍有边际机会'
  - '- 编程教学赛道：公众号红海，搬运至快手因用户画像不同、搜索需求未被满足而成蓝海'
  - '- 海外短视频+工具课：利用‘擦边冲动’引流、‘安装焦虑’变现，近2-3个月兴起的小蓝海'
  - '**边界条件**'
  - '- 仅适用于‘搜索流量’与‘推荐流量’并存的内容电商平台'
  - '- 依赖平台数据透明度(搜索量、视频数)，数据不公开平台失效'
  - '- ROI计算需含隐性成本(时间、账号损耗、违规风险)，仅算显性成本易误判'
  - '- 窗口期短：一旦头部玩家涌入、平台打击，蓝海极速变红海'
  sources:
  - paper: docs/202305/Dy8mdu2JUoyQYRx2UnocHwOinaf.md
    role: origin
  excerpts:
  - 这个赛道是否搜索量很大，而总产出的内容不够多？如果是，那么就是蓝海。
  - 这个赛道是否投入的精力/金钱成本很低，但ROI很高？如果是，那么就是蓝海。
  - 用这两个方式去区分，你会发现有些你以为是很红海的赛道 ，其实没那么红海...这几十几百个Up主的内容产出根本满足不了搜索的人群们，那这可能就是蓝海赛道。
  - 又或者你以为你找到了没啥人做的蓝海赛道 ，就三四个UP在搞，但其实压根都没啥人搜索这个赛道，这压根都不是真实赛道（需求）
- 'no': 3
  name: 赛道双维度分类矩阵 —— 竞争程度×流量来源的战略地图
  points:
  - '**为什么需要这个概念？**'
  - '- 同一赛道(如红海)因流量来源不同(推荐/搜索)，打法截然不同'
  - '- 新手资源有限，无法同时铺开推荐流量(需量大)与搜索流量(需精)'
  - '- 需要一张地图，根据自身资源(内容产能/SEO能力/资金)选对象限'
  - '**核心定义**'
  - '- 纵轴：竞争程度(红海/小蓝海/蓝海)——由双维度蓝红海判定法得出'
  - '- 横轴：流量来源(自然流推荐/搜索词主动搜索)——由平台分发机制决定'
  - '- 四大象限对应四类打法：红海推荐流=量堆/红海搜索流=SEO精打磨/蓝海推荐流=抢首发/蓝海搜索流=长尾词布局'
  - '**关键性质**'
  - '- 指导性：告诉不同阶段玩家‘在哪里’用‘什么招’'
  - '- 互补性：推荐流爆发快但不稳、搜索流起效慢但长尾，组合可平滑收益曲线'
  - '- 迁移性：账号权重/内容素材可在象限间迁移(如红海推荐流积累权重后转搜索流)'
  - '**典型例子**'
  - '- 红海推荐流(办公软件)→ 千篇一律无人直播、靠账号矩阵量堆出单'
  - '- 红海搜索流(考证资料)→ 精准长尾词SEO、内容深度打磨、靠精准流量高转化'
  - '- 小蓝海推荐流(AI绘画教程)→ 抢首发红利、内容新颖度为核心竞争力'
  - '- 蓝海搜索流(冷门语言学习)→ 布局长尾词、内容垂直度极高、长期复利'
  - '**边界条件**'
  - '- 平台算法迭代可能改变流量来源分布(如快手加大搜索权重)'
  - '- 赛道竞争程度随时间单向恶化(蓝海→小蓝海→红海)，需动态调仓'
  - '- 玩家能力边界：擅长内容生产的走推荐流、擅长结构化思维的走搜索流，强行跨象限胜率低'
  sources:
  - paper: docs/202305/Dy8mdu2JUoyQYRx2UnocHwOinaf.md
    role: origin
  excerpts:
  - 根据赛道的竞争程度分类，可以分为三类：红海赛道...小蓝海赛道...蓝海赛道
  - 根据流量来源方式，可以分为两类：自然流推荐...搜索词/主动搜索进入
  - 红海赛道，竞争大，流量大...自然流推荐流量为主的打法，就是要量大...搜索流量为主的打法，就是要精。
- 'no': 4
  name: 红海细分定位法 —— 在用户心智中寻找未被占据的净土
  points:
  - '**为什么需要这个概念？**'
  - '- 红海赛道头部垄断、流量昂贵、转化低，新手硬刚必死'
  - '- 但完全避开红海会错过巨大确定性需求(如办公软件、英语学习)'
  - '- 需要在红海内部‘极致细分’，用差异化定位降维打击'
  - '**核心定义**'
  - '- 在红海大类目下，按‘人群属性/使用场景/痛点细节’层层向下钻取'
  - '- 标准路径：大类目 → 细分学科/人群 → 具体年级/身材 → 细分痛点/场景'
  - '- 目标：在用户心智中占据一个‘唯一/首选’位置，而非‘众多替代品之一’'
  - '**关键性质**'
  - '- 降维打击：用专业度/垂直度碾压泛泛之谈的宽泛竞品'
  - '- 成本可控：细分越极致，内容生产标准化程度越高、竞品越少、流量越精准'
  - '- 可迭代：跑通最细分赛道后，可向上游扩展品类(如五年级英语→全小学英语)'
  - '**典型例子**'
  - '- 小学教材(红海) → 小学英语 → 五年级英语 → 五年级英语单词速记法(细分净土)'
  - '- 女装(红海) → 微胖女装 → 162cm微胖 → 梨形身材微胖穿搭(精准人群标签)'
  - '- 编程教学 → Python入门 → 非科班转行Python → 30岁非科班转行Python面试题库'
  - '**边界条件**'
  - '- 细分过度导致总搜索量过小(月搜<100)，商业化空间不足'
  - '- 细分赛道易被平台判定为‘低质/垃圾内容’限流，需内容深度背书'
  - '- 头部玩家随时可用资源优势下沉绞杀(如大V开设子账号专攻细分)'
  - '- 要求创作者具备该细分领域真实专业度，否则内容无深度、信任感为零'
  sources:
  - paper: docs/202305/Dy8mdu2JUoyQYRx2UnocHwOinaf.md
    role: origin
  excerpts:
  - 红海中的细分，就是要你在红海中找到自己的独特定位，能在用户心智空间中找到一片未被占据的净土，然后你住进去。
  - 别人都卖小学教材...你去专门做小学英语教材...专门做小学五年级英语教材...继续细分。
  - 很多在公众号玩烂的东西都可以搬到快手上，你会发现竟然还能喝到汤甚至吃到肉。
- 'no': 5
  name: 课程焦虑贩卖论与冲动消费变现模型 —— 卖的不是知识是情绪安慰剂
  points:
  - '**为什么需要这个概念？**'
  - '- 传统认知：课程内容质量决定销量 → 投入大量精力打磨课程、录制高清视频'
  - '- 现实残酷：后台完播率<10%，用户‘买买意思意思’，极少真学'
  - '- 反转本质：用户付费是为了‘缓解焦虑/获得上进的虚假满足’，而非习得技能'
  - '**核心定义**'
  - '- 课程焦虑贩卖论：知识付费商品本质是贩卖‘缓解焦虑/获得上进心虚假满足’的情绪价值'
  - '- 冲动消费变现模型：诱饵内容(擦边/工具焦虑/致富焦虑)激发冲动 + 低价工具课(即时可得/低决策成本)承接冲动 = 即时购买'
  - '- 课程内容可标准化/外包/甚至搬运，核心竞争力在‘包装度’(销量/评论/标题/封面)'
  - '**关键性质**'
  - '- 非理性决策：用户购买系1系统(直觉/冲动)主导，非2系统(理性分析)'
  - '- 低客单价(9.9-99元)是关键：决策成本低于‘思考一下’的机会成本'
  - '- 内容即诱饵，课程即解药：视频/直播只负责筛选‘有焦虑’人群，课程负责‘安慰’'
  - '- 可规模化：情绪价值标准化生产成本极低，易批量复制'
  - '**典型例子**'
  - '- 海外短视频赛道：发TikTok擦边视频(诱饵) + 挂TikTok安装教学课(解药)，纯冲动消费'
  - '- 办公软件赛道：发‘一招搞定XX’短视频(职场焦虑诱饵) + 挂9.9元速成课(安慰剂)'
  - '- 编程教学：发‘程序员年薪百万’焦虑视频 + 挂‘零基础转行大礼包’'
  - '**边界条件**'
  - '- 伦理红线：纯贩卖焦虑、课程无实质内容属‘割韭菜’，长期毁IP、触平台打击'
  - '- 平台风控：虚假销量/评论、诱导分享、擦边引流均为违规高危动作'
  - '- 客单价天花板低：情绪价值难支撑高客单(>299元)，高客单需真交付/真服务'
  - '- 生命周期短：用户觉醒后复购率极低，需不断换新诱饵/新赛道，非长期资产'
  sources:
  - paper: docs/202305/Dy8mdu2JUoyQYRx2UnocHwOinaf.md
    role: origin
  excerpts:
  - 首先记住你买课卖的是能缓解人们想要学习课程的心态，而不是课程内容本身。人们通过买课缓解了他的内心焦虑/想学习的冲动/或者是给自己一种上进的舒服感觉。
  - 我卖了这么多课后台看总完播率不超过10%，大家都是买买意思意思，没几个真会学的
  - 海外短视频...就是发海外tiktok的擦边视频然后挂课，课程内容是tiktok安装教学，教你怎么自己去看海外短视频。
  - 说白了就是运用人的擦边冲动心理，冲动消费。因为走的是美女擦边的盘子，所以盘子其实很大
  - 课程销量和课程评论都是可以自己编造的，这部分别忘了搞。
- 'no': 6
  name: 短链路正反馈生存法则 —— 新手跨越‘认知-行动’鸿沟的物理引擎
  points:
  - '**为什么需要这个概念？**'
  - '- 新手最大死因：项目未跑通闭环(0-1)就因‘没正反馈’焦虑切换项目，陷入‘频繁换赛道-永远不出单’死循环'
  - '- 认知鸿沟：知道‘要坚持’但身体不听使唤，需外部物理机制强制输出结果'
  - '- 必须筛选‘闭环最短+正反馈最快’的项目作为新手入场标的'
  - '**核心定义**'
  - '- 闭环最短：少私域(无封号风险)、少资质(无审核门槛)、少步骤(无复杂决策)'
  - '- 正反馈最快：1-3天出单，用真金白银验证‘我能行’，建立自信心锚点'
  - '- 止损线：强制执行‘至少跑一个月’再复盘，屏蔽短期波动干扰'
  - '**关键性质**'
  - '- 心理机制：多巴胺奖赏回路，正反馈→多巴胺→动力→行动→更多正反馈'
  - '- 认知重构：在行动中修正认知，而非空想中完美认知，认知是行动的副产品'
  - '- 筛选标准：项目筛选第一性原理=闭环短度×反馈速度，而非市场天花板大小'
  - '**典型例子**'
  - '- 快手知识付费：无私域、无资质、1-3天出单，作者带训样本最快当天出单、最长6天'
  - '- 闲鱼无货源：发品挂链接、聊天成交、几天出单，无需建店装修、囤货发货'
  - '- AI资料变现：整理资料发笔记、自动回复引流、私域成交，首周即可见款'
  - '**边界条件**'
  - '- 仅适用于‘0-1冷启动期’，跑通后必须向‘长链路/高客单/品牌化’进阶'
  - '- 短链路项目通常客单价低、护城河浅、易被平台规则/竞品复制击穿'
  - '- 过度依赖‘快反馈’会养成‘功利/短视’习惯，抗挫折能力反而下降'
  - '- 必须区分‘正反馈’(真实出单)与‘假反馈’(点赞/播放/私信)，后者不产生现金流'
  sources:
  - paper: docs/202305/Dy8mdu2JUoyQYRx2UnocHwOinaf.md
    role: origin
  excerpts:
  - 对于小白来说少一个步骤就少很多坑，单一个私域封号就能把很多小白封的怀疑人生
  - 正反馈很快（运气好的话1-3天就能出单，能让小白快速挣到第一块钱）
  - 无论什么项目至少你上手跑一个月再去看他到底盈利状况如何，如果看别人当天就出单，自己两三天都不出的就直接删快手换项目了，那这种你大概率是做什么都不会出单的
  - 快手这个项目一天出单也有可能，前3-6天都不出单（目前我带的人里最长的也持续了6天没出单）也有可能
- 'no': 7
  name: 视频混剪去重技术栈与无人直播自动化体系 —— 低成本规避查重的工程化组合拳
  points:
  - '**为什么需要这个概念？**'
  - '- 平台查重机制严厉：直接搬运必判违规/限流/封号'
  - '- 原创内容生产成本高、门槛高、产出慢，新手无法承担'
  - '- 需要一套‘低成本、可标准化、可批量’的技术方案实现‘伪原创’量产'
  - '**核心定义**'
  - '- 混剪去重技术栈：多视频改码率拼接 + 画中画叠加 + 掐头去尾/变速/遮挡/调色 + 实拍屏幕录制(绝对去重但观感差)'
  - '- 首发搬运策略：搬运国外新视频(3天内发布)，利用时差规避指纹库收录，获平台原创标签'
  - '- 无人直播自动化：播放课程录播/引导视频 + 语音定时唤醒引导点击小程序 + 投流视频导流，利用‘不挂车挂小程序不封号’规则红利'
  - '**关键性质**'
  - '- 分层防御：基础去重(剪辑技巧)过机审 + 首发策略过人审/原创标签 + 无人直播过转化'
  - '- 标准化/可外包：全流程可拆解为SOP，交给兼职/外包/工具批量执行'
  - '- 成本极低：剪映/CapCut免费版+淘宝几块钱无人直播软件+免费下载器'
  - '- 迭代快：平台升级查重，仅需调整参数/换素材源，核心框架不变'
  - '**典型例子**'
  - '- 办公软件赛道：千篇一律无人直播，素材源自同行/抖音/国外，混剪后批量分发'
  - '- 海外短视频赛道：油管/TikTok一键下载最新视频(3天内) → 简单剪辑 → 直接发布挂课'
  - '- 编程教学赛道：搬运B站/公众号技术教程 → 切片混剪 → 挂载对应语言入门课'
  - '**边界条件**'
  - '- 平台算法持续升级：MD5/关键帧/语义/音频多模态查重，单一去重手段失效快'
  - '- 版权风险：搬运国内头部创作者内容易被投诉/申诉/扣分/封号，首选国外/长尾素材'
  - '- 账号权重影响去重通过率：新号/低权重号去重门槛更高，需养号/矩阵稀释风险'
  - '- 观感体验下限：过度去重(如实拍屏幕)导致画质差、水印多、用户体验差、转化低'
  sources:
  - paper: docs/202305/Dy8mdu2JUoyQYRx2UnocHwOinaf.md
    role: origin
  excerpts:
  - 常见的去重技术有：把多个视频改码率拼接在一起、视频加上画中画技术、掐头去尾 改速率 加遮挡 调色
  - 最狠的去重：你直接拿A手机播放视频，拿B手机摄像头录A手机 可以说绝对不会被判重
  - 直接去国外视频网站 油管 tiktok找最新发布的与你赛道主题相同的视频，最好是三天内发布的...你可以通过一键下载Tiktok/油管视频这个链接把视频下载下来直接当做你的内容发出去
  - 快手现在不挂车的话，这是单纯挂小程序（也就是挂课）基本上无人直播是不封号的
  - 直播内容可以直接就是你课程的录播（为了转化你要在里面加语音 引导人买课什么的）
  - 具体无人直播的操作方式，淘宝上直接花几块钱买一下，连带教程和软件什么的都有
- 'no': 8
  name: 利他链接复利论与内容即诱饵/课程即解药模型 —— 社交资产与转化底层逻辑的双重重构
  points:
  - '**为什么需要这个概念？**'
  - '- 传统认知：内容是价值本体、好内容自带流量、信任靠聊天建立'
  - '- 现实悖论：优质内容易被复制/盗版，聊天建信任效率极低、不可规模化'
  - '- 需重构：社交核心资产是‘人与人链接’；转化核心逻辑是‘诱饵-解药’而非‘价值-交换’'
  - '**核心定义**'
  - '- 利他链接复利论：社群核心资产是‘人与人的链接’而非可复制信息。通过‘毫不私藏的利他分享’(掏心掏肺)建立信任连接，获取不可窃取的高阶人脉(贵人/合伙人/同路人)。真诚是社交最大杀手锏。'
  - '- 内容即诱饵/课程即解药模型：短视频/直播内容=筛选‘有焦虑/有冲动’人群的诱饵；课程=缓解焦虑的安慰剂。转化率=诱饵精准度 × 安慰剂包装度(销量/评论造假)。'
  - '**关键性质**'
  - '- 资产不可窃取性：内容可被盗版，但人脉链接/信任关系/隐性知识不可复制'
  - '- 信任建立机制：信任非聊天产生，而是‘交付价值-收取对价’交易循环中建立'
  - '- 转化率杠杆：优化诱饵(标题/封面/前2秒/痛点击中)与包装(销量/评论/权威背书)比优化课程内容ROI高得多'
  - '- 利他即利己：公开分享SOP/避坑/数据 → 吸引同频人 → 形成势能 → 获得更高阶资源/合作'
  - '**典型例子**'
  - '- 作者在生财社群发帖复盘 → 获得版主加精/大佬点评/圈友关注 → 链接高阶玩家 → 获得新赛道Alpha情报'
  - '- 课程销量/评论自编 → 提升转化率 → 赚到钱 → 反哺优化素材/投流 → 规模化放大'
  - '- 免费分享‘快手知识付费全套SOP’ → 建立‘实战派’人设 → 吸引付费咨询/合伙提议'
  - '**边界条件**'
  - '- 利他前提：必须有真才实学/真实数据/真实案例，空谈大道理的‘伪利他’会被识破反噬'
  - '- 诱饵-解药模型伦理争议：长期依赖焦虑贩卖/虚假包装毁个人IP信用，平台严打虚假营销'
  - '- 仅适用于‘低客单价/标品/冲动型’决策场景，高客单/非标/服务型需真交付建信任'
  - '- 社群链接需‘高频互动/价值交换’维护，单向输出无回应的链接会衰减归零'
  sources:
  - paper: docs/202305/Dy8mdu2JUoyQYRx2UnocHwOinaf.md
    role: origin
  excerpts:
  - 生财的内容可以被复制被盗版，但是通过发帖交流、航海行动、以及各种互动中所链接到的人脉，没办法被窃取。
  - 大大方方的分享，是一种高效的链接方式。真诚是社交中最大的杀手锏...把心把肺都掏出来...这就是我的全部了
  - 光搬运视频还不行，别忘了咱们核心是卖课，咱们要给课程引流。可以在视频中加一些小尖头指向左下角告诉他记得关注左下角课程链接
  - 首先记住你买课卖的是能缓解人们想要学习课程的心态，而不是课程内容本身。
  - 课程销量和课程评论都是可以自己编造的，这部分别忘了搞。
- 'no': 9
  name: 平台认知套利定理 —— 众人眼中的‘劣质平台’实为新手红利洼地
  points:
  - '**为什么需要这个概念？**'
  - '- 主流创业者避之不及：快手流量低、用户low、单价低、不体面'
  - '- 新手痛点：抖音/视频号/小红书红海厮杀、门槛高、易劝退'
  - '- 认知套利：大家的偏见制造了供给真空，先入场者独享低竞争红利'
  - '**核心定义**'
  - '- 主流偏见(流量低/用户low/单价低)导致创业者集体忽视该平台'
  - '- 实际情况：竞争强度显著低于主流平台、知识付费闭环成熟、用户付费意愿被低估'
  - '- 结构性红利窗口：认知偏见消失前(平台生态成熟/大厂入场/头部垄断前)的时间差'
  - '**关键性质**'
  - '- 反直觉：越是被主流鄙视的平台/赛道/人群，往往藏着最大的确定性机会'
  - '- 时间窗口：认知套利随认知扩散而消失，必须‘下场实操’而非‘围观分析’'
  - '- 迁移性：该定理适用于所有‘主流偏见导致供给不足’的平台/赛道/渠道'
  - '**典型例子**'
  - '- 快手知识付费：作者团队实操‘非常被低估的赛道’，月入几千-过万副业门槛极低'
  - '- 拼多多早期：被淘宝商家鄙视‘假货/低价/三四线’，实则捕获下沉市场红利'
  - '- 闲鱼无货源：被电商人鄙视‘二手/杂乱/无品牌’，实则是低成本测品最优平台'
  - '**边界条件**'
  - '- 偏见必须是‘认知偏差’而非‘客观事实’(如平台真违规/真无流量/真不付费则不可入)'
  - '- 需具备‘快速验证/快速迭代/快速撤退’能力，否则窗口期过后沦为炮灰'
  - '- 套利收益随认知扩散指数级衰减，核心优势是‘时间差’而非‘技术差’'
  - '- 进入后需建立真实护城河(供应链/品牌/IP/数据)，否则认知红利消失即裸奔'
  sources:
  - paper: docs/202305/Dy8mdu2JUoyQYRx2UnocHwOinaf.md
    role: origin
  excerpts:
  - 快手这个平台大家从生财里应该很少听过...但快手很少有人提及，其一是因为快手与上述的平台相比确实流量没他们高...其次就是快手给人一种用户群体low，撑不起高单价的感觉。
  - 但也正因为如此，据我所知有非常多的人在快手上不断闷声发大财，而我们团队操作下来，发现快手确实是一个非常被低估的赛道
