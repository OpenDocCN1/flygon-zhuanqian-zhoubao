learning_targets:
- 理解需求三部曲（发现-验证-解决）的通用商业落地逻辑
- 掌握评论区需求验证法的实操步骤与语义分析技巧
- 了解资源重组交付法如何将非标服务标准化、低成本化
- 掌握AI提示词迭代优化法（基准案例法）构建稳定可控的生成指令集
- 理解热点事件极速入场法（现学现卖）的捕捉-验证-变现全流程
- 掌握非标服务标准化拆解法，将定制化服务转化为可复制SOP流水线
- 建立思考护城河认知：在工具平民化时代，深度思考能力是核心壁垒
- 掌握跨界复用底层逻辑：一套思维模型横扫多赛道的复利范式
concept_map:
- 需求挖掘与产品化交付通用方法论
- ├── 核心模型：需求三部曲
- │   ├── 发现需求 —— 生活对话/数据报表/热点事件中捕捉痛点
- │   ├── 验证需求 —— 评论区高频提问/搜索指数/私信回复辨别真伪
- │   └── 解决需求 —— 拆解问题→组合现有工具资源（资源重组交付法）逐步攻克
- ├── 关键验证工具
- │   └── 评论区需求验证法 —— 零成本探测用户真实付费意向与痛点语义
- ├── 核心交付策略
- │   ├── 资源重组交付法 —— 拆解交付物本质+整合外部现成资源（音频库/合作网络/公开资料）解耦个人技能与业务交付
- │   ├── AI提示词迭代优化法 —— 基准案例法（挑最难案例→垫图→找缺陷→加负面词/修饰词→回归测试）沉淀扛打关键词组
- │   ├── 热点事件极速入场法 —— 捕捉政策/热点红利→评论区极速验证→3-7天现学现卖输出大白话框架内容→多维变现（资料包/证书/培训/资源对接）
- │   └── 非标服务标准化拆解法 —— 需求拆解为标准化交付物清单→流程模块化→关键节点外包/工具化→质检SOP化
- ├── 底层认知壁垒
- │   ├── 思考护城河论 —— 工具/平台门槛趋零，核心竞争力在于问题定义/拆解/资源组合的深度思考能力
- │   └── 跨界复用底层逻辑论 —— 识别不同项目同构性→提炼通用方法论模块→新项目套用框架仅替换领域变量，实现能力跨域复利
- └── 实证案例库
- '    ├── AI四维预测宝宝长相（评论区验证+Prompt迭代+B2B2C模式）'
- '    ├── 碳中和知识付费（热点极速入场+现学现卖+大白话框架化）'
- '    ├── 为TA点歌服务（零技能交付+资源重组双路径）'
- '    └── 多项目组合反脆弱性验证（7个无关项目均盈利，思维模型跨域复用）'
life_analogy:
- 想象你是一名**城市猎人**，手里没有枪（不懂核心技术），但有一本**《需求生存手册》**：
- '- **需求三部曲** = 你的**雷达-探针-瑞士军刀**三件套：'
- '  - **发现需求（雷达）**：在街头巷尾（生活对话）、卫星图（数据报表）、突发新闻（热点）中扫描‘猎物’踪迹'
- '  - **验证需求（探针）**：潜伏在猎物聚集地（评论区），听它们嘀咕‘想吃肉’、‘哪有卖’、‘多少钱’，确认真饿假饿'
- '  - **解决需求（瑞士军刀）**：自己不会烹饪（不懂技术），但能组合现成食材（唱吧音频）、雇佣大厨（合作弹唱者）、用餐盒打包（剪辑视频），端上一顿‘成品大餐’'
- '- **AI提示词迭代** = **调教猎犬**：挑最难搞的猎物（最差四维图）试训，跑偏了（皮肤坑洼）就加绳索（负面词），咬人了（肤色不均）套嘴套（修饰词），直到十次十中（回归测试），得到一条‘扛打’的猎犬（关键词组）'
- '- **热点极速入场** = **赶集赶趟**：听说隔壁村来了神医（政策/热点），村民围着问‘啥病能治’（评论区提问），你三天速成《神医妙方大白话版》（框架化内容），卖方子、卖药引、卖挂号号（多维变现），趁热度散去前收割一波'
- '- **思考护城河** = **猎人经验值**：弓箭（AI工具）、陷阱（平台规则）人人都能买，唯有‘读懂兽性、懂风向、知地形’的思考经验，让你换把新弓、换个新森林，依然‘出手必有回响’'
summary:
- concept: 需求三部曲
  desc: 发现-验证-解决：通用商业落地闭环，项目不值钱，挖掘逻辑与思考能力才是持续变现源泉
- concept: 评论区需求验证法
  desc: 零成本探测用户真实付费意向：高频提问（怎么做/多少钱）、情感表达（好想要）、寻求方案（有软件吗）
- concept: 资源重组交付法
  desc: 拆解交付物本质（视频而非现场技能）→整合外部资源（唱吧音频/合作网络）→实现个人能力与业务交付解耦
- concept: AI提示词迭代优化法
  desc: 基准案例法：挑最难案例垫图→发现缺陷→针对性加负面词/修饰词/结构词→多案例回归→沉淀扛打关键词组
- concept: 热点事件极速入场法
  desc: 捕捉政策/热点指数暴涨→评论区提取高频提问（是什么/怎么赚钱）→3-7天现学现卖输出大白话框架内容→多渠道变现
- concept: 非标服务标准化拆解法
  desc: 需求拆解为标准化交付物清单→流程模块化→关键节点外包/工具化→质检SOP化，实现可复制、可规模、可资产化
- concept: 思考护城河论
  desc: 工具/平台皆基建门槛趋零，核心壁垒在于问题定义/拆解/资源组合的深度思考能力，自我设限是最大拦路虎
- concept: 跨界复用底层逻辑论
  desc: 识别项目同构性→提炼通用方法论模块→新项目套用框架仅替换领域变量，实现‘分属不同行业，实为同一件事’的跨域复利
exercises:
- 'no': 1
  title: 练习1：评论区需求验证实战
  contents:
  - 选定一个你感兴趣的细分赛道（如：AI老照片修复、考公资料整理、宠物训练教程），在抖音/小红书/视频号搜索核心关键词，找到点赞前10的相关笔记/视频：
  - 1. 记录评论区高频提问TOP5（如‘怎么操作’、‘多少钱’、‘有教程吗’）
  - 2. 统计表达付费意愿的评论占比（如‘想买’、‘多少钱买’、‘V我’）
  - 3. 识别3个‘伪需求’信号（如单纯点赞、转发、无实质追问）
  - 4. 基于真实需求，写出该赛道的‘最小可行性交付物’清单（如：一份PDF教程、一个视频演示、一套提示词）
  - 回答问题：
  - '- 如果评论区全是‘感谢分享’‘学到了’，没有追问细节，说明什么？'
  - '- 如何区分‘水军刷单评论’与‘真实用户需求’？'
- 'no': 2
  title: 练习2：资源重组交付方案设计
  contents:
  - 假设你想做‘定制儿童绘本’生意（用户提供孩子照片/特征，生成主角是孩子的绘本故事视频），但你不会画画、不会写故事、不会剪辑：
  - 1. 拆解核心交付物：用户最终拿到手的是什么？（提示：不是‘绘画服务’而是______）
  - 2. 识别核心技能缺口：画画、写故事、剪辑、配音
  - 3. 为每个缺口设计‘外部资源整合方案’（如：AI绘图工具、ChatGPT写故事、剪映模板、TTS配音、兼职插画师群、素材网站）
  - 4. 设计标准化交付流程SOP（5-7步），明确你亲自做的环节（质检/沟通）与外包/工具化的环节
  - 回答问题：
  - '- 如果AI生成的绘本角色一致性很差（每页长相不一样），如何用‘资源重组’思路低成本解决？'
  - '- 当订单量从日单5单增至50单时，哪个环节最先成为瓶颈？如何标准化破局？'
- 'no': 3
  title: 练习3：AI提示词迭代优化（基准案例法）
  contents:
  - 任务：用Midjourney/SD生成‘统一风格的IP形象三视图’（正面/侧面/背面），要求角色五官一致、服饰细节不变：
  - 1. 选定1个最难的基准案例（如：复杂发型+花纹服饰+特殊肤色的角色设定图）
  - 2. 写初版Prompt生成，记录3个主要缺陷（如：侧面脸型崩坏、服饰花纹断裂、背面视角错误）
  - 3. 针对每个缺陷添加对应控制词（如：--cw权重、ControlNet OpenPose、负面词：asymmetry, broken pattern）
  - 4. 用5个不同角色设定图回归测试，统计‘三视图一致性合格率’
  - 5. 迭代至合格率≥80%，输出最终‘扛打关键词组’模板
  - 回答问题：
  - '- 为什么要用‘最难案例’做基准，而不是‘平均案例’？'
  - '- 模型版本更新（如MJ V6→V7）后，原关键词组失效，如何用最低成本完成迁移适配？'
- 'no': 4
  title: 练习4：热点事件极速入场推演
  contents:
  - 假设今日发布重大利好政策：‘国家大力支持银发经济，鼓励开发适老化智能产品与服务’：
  - 1. 立即去抖音/小红书/微信指数搜‘银发经济’‘适老化’，截取过去24小时指数走势图
  - 2. 进入相关高赞视频评论区，提取高频用户提问TOP10（如：‘啥是银发经济’‘适老化手机怎么选’‘给老妈买啥好’）
  - 3. 设计‘3天现学现卖’内容生产计划：每天输出3条‘大白话/框架化’视频/图文，标题直接对应高频提问
  - 4. 规划4层变现产品矩阵：引流款（9.9元适老化选品清单）→ 信任款（99元适老化产品避坑指南）→ 核心款（499元子女陪伴指导课）→ 高客单（2999元机构适老化改造咨询/资源对接）
  - 回答问题：
  - '- 为什么要用‘大白话/框架化’而非‘专业深度分析’？'
  - '- 红利期预计1-3个月，如何在热度消退前完成‘私域沉淀→后端转化’闭环？'
- 'no': 5
  title: 练习5：跨界复用思维模型迁移
  contents:
  - 回顾你过去半年接触的3个不同项目/副业尝试（哪怕失败的）：
  - 1. 用‘需求三部曲’复盘每个项目：当时是如何‘发现-验证-解决’需求的？哪个环节做得最烂？
  - 2. 抽象出可复用的‘标准动作模块’（如：评论区验证SOP、AI迭代SOP、资源重组清单、热点捕捉雷达）
  - 3. 设想一个全新赛道（如：AI数字人直播带货、出海独立站、低空经济周边），尝试仅用上述模块拼装出该赛道的‘0-1启动清单’
  - 4. 标注清单中哪些是‘通用模块’（直接复用），哪些需要‘领域知识注入’（需重新学习/找人）
  - 回答问题：
  - '- 为什么说‘思考模型跨域复用能力强于单一业务护城河’？结合你的复盘谈理解'
  - '- 如何避免‘拿着锤子找钉子’（生搬硬套模型而忽视赛道差异）？'
