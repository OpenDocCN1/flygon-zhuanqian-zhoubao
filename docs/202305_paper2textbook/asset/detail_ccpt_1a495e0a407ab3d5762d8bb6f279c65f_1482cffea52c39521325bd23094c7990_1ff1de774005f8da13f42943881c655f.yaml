units:
- 'no': 1
  name: 视频号用户画像 —— 银发女性高客单决策
  points:
  - '**为什么需要这个概念？**'
  - '- 视频号带货核心流量池特征极其鲜明，不了解画像等于瞎选品、瞎投流'
  - '- 银发女性群体具有高客单价、高复购、决策快的特质，是变现主力军'
  - '**核心定义**'
  - '- 视频号带货用户：女性占比≥85%、50岁以上占比≥80%'
  - '- 核心需求：养生、保暖、家居等中老年高频刚需品类'
  - '**关键性质**'
  - '- 画像决定选品：必须聚焦中老年刚需，避开年轻化、标品化赛道'
  - '- 画像决定素材：真实、朴素、利他、大字版式更易建立信任'
  - '**典型例子**'
  - '- 羽绒服/湿巾/茶壶/养生茶等冬季高客单品在视频号单账号月佣破万'
  - '**边界条件**'
  - '- 该画像为视频号生态特有，不可直接迁移至抖音/快手/小红书'
  - '- 随平台用户结构变化（如年轻化运营），画像边界会动态漂移'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  excerpts:
  - 视频号带货核心流量池特征：女性占比≥85%、50岁以上占比≥80%，决定选品必须聚焦养生、保暖、家居等中老年高频刚需品类。
- 'no': 2
  name: 身份证账号矩阵合规模型 —— 一证五号的物理隔离术
  points:
  - '**为什么需要这个概念？**'
  - '- 视频号实名制严格（一证五号），单人上限5个号，规模化受限于主体资源'
  - '- 多账号关联风控是矩阵玩法最大死穴，需合规隔离规避连坐封禁'
  - '**核心定义**'
  - '- 基于微信实名规则设计的账号隔离与授权体系：主号(A1)绑定运营者管理子号(A2-A5)'
  - '- 同绑一张银行卡，物理隔离不同人员账号组(A/B/C组)，实现20+账号合规矩阵'
  - '**关键性质**'
  - '- 合规性：利用平台规则漏洞（家庭成员身份证）而非对抗规则（群控/云手机）'
  - '- 物理隔离：一机一号、实名不重复、网络环境隔离，规避设备指纹关联'
  - '**典型例子**'
  - '- 作者母亲克服晕车去县城办卡，解锁家庭矩阵20+账号，月佣从万级跃迁十万级'
  - '**边界条件**'
  - '- 依赖家庭成员配合度，独居/家人不支持者无法复制'
  - '- 平台若升级风控（如人脸活体核验、资金流向穿透），模型失效风险高'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  excerpts:
  - 基于微信实名规则(一证五号)设计的账号隔离与授权体系：主号(A1)绑定运营者管理子号(A2-A5)，同绑一张银行卡，物理隔离不同人员账号组(A/B/C组)，规避关联封禁风险。
  - 账号矩阵扩张受限于实名主体(身份证/银行卡)，家人的理解与配合(如母亲克服晕车去县城办卡)能解锁‘身份证红利’，将单人上限(5号)突破为家庭矩阵(20+号)，是收益从万级向十万级跃迁的物理前提。
- 'no': 3
  name: 多账号物理隔离与集中管理硬件方案 —— 红米Note 11T 标准化配置
  points:
  - '**为什么需要这个概念？**'
  - '- 20+账号单人运营面临设备采购、账号对应、防封保号的工程化难题'
  - '- 安卓双开(1机10号)是性价比最高的物理隔离方案，需标准化硬件规格'
  - '**核心定义**'
  - '- 推荐机型：红米Note 11T 8+128G(~1700元)，保障双开流畅不卡顿'
  - '- 管理体系：账号编号体系(A1-A5)+ 笔记本手写台账 + 定期拨打电话保号'
  - '**关键性质**'
  - '- 低成本：单设备成本<2000元，20台设备<4万，ROI远高于云手机/群控'
  - '- 高安全：物理隔离规避设备指纹/网络IP关联，无封号案例'
  - '- 可复制：标准化配置单、编号规则、台账模板，新人拿来即用'
  - '**典型例子**'
  - '- 作者单人运营20+账号，通过贴纸标记手机背面+电子表格台账解决‘忘记哪个手机是哪个号’的管理混乱'
  - '**边界条件**'
  - '- 安卓系统版本更新可能影响双开稳定性，需锁定系统版本/关闭自动更新'
  - '- 手机物理损坏/丢失导致账号资产损失，需建立备用机池'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  excerpts:
  - 单人运营20+账号的硬件基建：安卓手机双开(1机10号)，推荐红米Note 11T 8+128G(~1700元)保障流畅度；账号编号体系(A1-A5)+笔记本手写台账+定期拨打电话保号，实现低成本、高安全的矩阵管理。
  - 圈友反馈‘6个号忘记哪个手机是哪个号’，作者给出‘贴纸标记手机背面+电子表格台账+流水式编号A1-A5’的组合拳管理法，经实践验证可支撑20+账号单人高效运营。
- 'no': 4
  name: 测品-爆款-放大三阶段数据驱动决策法
  points:
  - '**为什么需要这个概念？**'
  - '- 带货充满不确定性，凭感觉选品/投流必死，需用数据建立确定性决策闭环'
  - '- 三阶段分别对应‘找品’、‘验品’、‘放量’三个不同目标，动作与指标完全不同'
  - '**核心定义**'
  - '- 阶段1(测品)：多账号测不同品，视频挂2-3链接，半天看流量/点击/转化'
  - '- 阶段2(爆款)：出单后即刻电话/留言催发货(2天内发货红线)，监控退款率/体验分'
  - '- 阶段3(放大)：发现爆款后，多号同发同款引流单店，定制链接/SKU，短视频引流+直播转化'
  - '**关键性质**'
  - '- 快：测品周期以小时计，爆款确认以天计，放大以周计'
  - '- 准：单一指标决策(测品看ROI、爆款看发货率、放大看GPV/利润)'
  - '- 狠：不达标即切品/注销号/换店，零情绪内耗'
  - '**典型例子**'
  - '- 12月羽绒服/湿巾：单账号400单、佣金3000+，持续月底'
  - '- 1月茶壶：80-200元、佣金45%，次日出30单，持续1.5月、单账号6800元'
  - '**边界条件**'
  - '- 依赖供应链响应速度，发货慢/断货会导致爆款期错过'
  - '- 平台风控政策突变(如体验分阈值调整)可能中断放大节奏'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  excerpts:
  - 阶段1：多账号测不同品，视频挂2-3链接，半天看流量；阶段2：出单后即刻电话/留言催发货(2天内发货红线)，监控退款率；阶段3：发现爆款后，多号同发同款引流单店，定制链接/SKU，短视频引流+直播转化，速战速决。
  - 素材记录了5个具体爆款周期的实证数据：1)12月羽绒服/湿巾：单账号400单、佣金3000+，持续月底；2)1月茶壶：80-200元、佣金45%，次日出30单，后持续1.5月、单账号6800元(但因供应链损失数千)；3)3月养生茶：70+单、佣金2300+，定制5
    SKU阶梯价验证提客单；4)2月舅舅账号：首日10万+播放、销售额8800，持续2月、佣金12000+；5)父母账号合计佣金20000+。
- 'no': 5
  name: 爆款定制链接与SKU阶梯定价策略 —— 解决决策瘫痪提客单
  points:
  - '**为什么需要这个概念？**'
  - '- 爆款期流量极其宝贵，标品链接SKU过多/价格单一导致用户决策瘫痪、客单价低'
  - '- 普通商家后台操作权限有限，需定制链接掌控主图/SKU/详情/价格'
  - '**核心定义**'
  - '- 向商家定制专属链接：主图/SKU/详情/价格可控，绕过通用链接限制'
  - '- 阶梯定价策略：''1份29.9，2份49.9'' + 多规格组合(单罐/多罐/套装)'
  - '**关键性质**'
  - '- 提升客单价：利用锚定效应引导多件购买，养生茶案例验证客单显著提升'
  - '- 简化决策：将SKU压缩至3-5个核心组合，消除选择瘫痪'
  - '- 独家性：定制链接仅自己推，避免同行跟卖分流流量'
  - '**典型例子**'
  - '- 3月养生茶：定制5 SKU阶梯价，70+单、佣金2300+，验证提客单有效性'
  - '**边界条件**'
  - '- 需商家配合度高(中小工厂/源头商家)，大品牌/平台自营不可定制'
  - '- 定制链接审核周期可能错过爆款初期黄金窗口，需提前布局'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  excerpts:
  - 针对爆款商品向商家定制专属链接(主图/SKU/详情/价格可控)，采用‘1份29.9，2份49.9’阶梯价及多规格组合(单罐/多罐/套装)提升客单价与转化率，解决SKU过多导致的决策瘫痪。
  - 3月养生茶：70+单、佣金2300+，定制5 SKU阶梯价验证提客单。
- 'no': 6
  name: 短视频引流+直播承接转化模型 —— 公私域流量分层运营
  points:
  - '**为什么需要这个概念？**'
  - '- 单一短视频或直播流量天花板低，需构建‘短视频获客+直播收割’双轮驱动模型'
  - '- 视频号算法特性：短视频爆发力强但留存弱，直播转化率高但冷启动难'
  - '**核心定义**'
  - '- 短视频：低成本获取公域流量爆发，挂车/置顶引导进直播间'
  - '- 直播间：承接高意向流量提升转化率，利用置顶位权重递减(左1>中>右1)动态调序'
  - '**关键性质**'
  - '- 分层互补：短视频负责‘广撒网’，直播负责‘深转化’，流量闭环'
  - '- 置顶运营：爆款视频利用3个置顶位权重差异(左1最高)动态调整顺序'
  - '- 橱窗配合：橱窗顶部保留2-3爆款+高客单/高佣/高销量长尾品承接溢出流量'
  - '**典型例子**'
  - '- 舅舅账号：首日10万+播放、销售额8800，配合直播持续2月、佣金12000+'
  - '**边界条件**'
  - '- 需具备直播能力(话术/场景/排品/运营)，纯短视频玩家转型门槛高'
  - '- 直播间违规风险高(敏感词/引导/承诺)，需专人实时监控'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  excerpts:
  - 流量分层运营策略：短视频负责低成本获取公域流量爆发，直播间承接高意向流量提升转化率；爆款视频利用3个置顶位(左1>中>右1)权重递减特性动态调序，配合橱窗活动标题引导下单。
  - 橱窗顶部保留2-3个爆款供选择；叠加高客单(≥30元)、高佣(≥30%)、高销量(>100单)的畅销品作为长尾补充，利用爆款流量溢出带动长尾成交，最大化单用户价值。
- 'no': 7
  name: 店铺体验分风控红线 —— 4.2分准入线与偏远不发货策略
  points:
  - '**为什么需要这个概念？**'
  - '- 视频号店铺体验分(商品/服务/物流)是生存命线，低于阈值直接隐藏下架'
  - '- 物流分最易因偏远地区发货纠纷(超时/破损/拒收)被拖垮，隐形杀手'
  - '**核心定义**'
  - '- 新店初始4.5分，低于4分触发平台隐形惩罚(下架/限流/隐藏)，合作门槛建议≥4.2分'
  - '- 偏远地区不发货设置：后台预设不发货区域(新疆/西藏/海外等)，规避物流纠纷'
  - '**关键性质**'
  - '- 一票否决：单款爆品因店铺分低被下架，流量瞬间归零，佣金直接清零'
  - '- 物流分最脆弱：偏远单量少但投诉率高，边际成本极高，必须物理隔离'
  - '- 动态监控：需建立店铺分日监控机制，跌破4.2立即停推/换链接/换店'
  - '**典型例子**'
  - '- 作者亲历2-3款产品因合作店铺分数过低被平台下架/隐藏，爆款流量无法转化、佣金归零'
  - '**边界条件**'
  - '- 不发货区域设置过多会流失真实订单，需平衡风控与业绩(建议仅设一级偏远省份)'
  - '- 平台算法调整权重(如物流分权重提升)会改变红线判定标准'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  excerpts:
  - 视频号店铺三大体验分(商品/服务/物流)生存阈值：新店初始4.5分，低于4分触发隐藏下架，合作门槛建议≥4.2分。物流分易因偏远地区发货纠纷拉低，需预设不发货区域规避。
  - 作者亲历2-3款产品因合作店铺分数过低被平台下架/隐藏，导致爆款流量无法转化、佣金直接归零。验证了‘店铺分≥4.2’为硬性准入指标，且物流分易因偏远地区发货纠纷被拖累。
- 'no': 8
  name: 供应链响应速度决定爆款变现上限 —— 熔断机制与多店备选
  points:
  - '**为什么需要这个概念？**'
  - '- 爆发期内发货时效是核心变量：48小时内发货是物流分红线，延迟必引发退款'
  - '- 单一供应链依赖风险极高：店铺失联/拒发/疫情管控会导致‘到手鸭子飞了’'
  - '**核心定义**'
  - '- 供应链熔断机制：多店铺备选 + 即时催单(电话/留言/私信) + 动态切换(实发率<80%即切)'
  - '- 核心指标：实发率(实际发货单/付款单)、发货时效(小时)、响应时效(分钟)'
  - '**关键性质**'
  - '- 催发货优先级 > 发视频：茶壶案例因店铺失联实发率仅1/3，损失数千佣金'
  - '- 多店备选：至少2-3家同款源头店铺，建立‘主力+备选+兜底’三级供应链'
  - '- 实时监控：爆款期每小时追单，发现延迟立即介入，不等平台扣分'
  - '**典型例子**'
  - '- 茶壶爆款期(30+单)因店铺失联导致实发率仅1/3，虽紧急切换5-6家备选，仍因发货延迟/疫情退货造成数千元佣金损失'
  - '**边界条件**'
  - '- 非标品/定制品/大件商品供应链不可控因素多，熔断机制效果打折'
  - '- 极端外部环境(疫情封控/自然灾害/物流瘫痪)下熔断机制失效'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  excerpts:
  - 爆发期内，发货时效是核心变量：48小时内发货是物流分红线，延迟3-5天必引发退款；店铺沟通不畅(私信/电话无回应)会导致‘到手鸭子飞了’(案例中损失数千佣金)。必须建立‘多店铺备选+即时催单+动态切换’的供应链熔断机制。
  - 茶壶爆款期(30+单)因店铺失联导致实发率仅1/3，虽紧急切换5-6家备选店铺，仍因发货延迟、疫情退货造成数千元佣金实发损失。证明‘催发货’优先级高于‘发视频’，且单一供应链依赖风险极高。
- 'no': 9
  name: 流程化标准化是收益复利唯一路径 —— 五大标准动作SOP
  points:
  - '**为什么需要这个概念？**'
  - '- 带货看似靠运气/爆款，实则是工程问题；唯有将非标动作标准化，才能复制放大'
  - '- 普通人抗干扰性差，无SOP必陷入‘发视频-看数据-发呆-焦虑’低效循环'
  - '**核心定义**'
  - '- 五大标准动作：发视频、上架、看数据、管店铺、催发货'
  - '- 标准化要素：账号编号体系(A1-A5)、硬件标配(红米Note 11T)、SOP文档化(飞书/腾讯文档)'
  - '**关键性质**'
  - '- 可执行：将‘赚钱的事多做十遍’转化为清单式操作，新人拿来即用'
  - '- 可考核：每个动作有标准/时限/产出/验收，便于团队管理与外包'
  - '- 可迭代：复盘数据→修正SOP→固化新版本，形成组织进化飞轮'
  - '**典型例子**'
  - '- 作者从兼职到全职、单号到20+矩阵、累计收益4万+，全靠流程化标准化'
  - '**边界条件**'
  - '- SOP仅解决‘执行层’确定性，不解决‘策略层’(选品/投流/素材)不确定性'
  - '- 过度标准化可能扼杀创新(如素材创新/话术突围)，需保留10%实验预算'
  sources:
  - paper: docs/202305/20230516_024.md
    role: origin
  excerpts:
  - 将带货拆解为‘发视频、上架、看数据、管店铺、催发货’五大标准动作，通过账号编号、硬件标配、SOP文档化，使‘赚钱的事多做十遍’成为可执行的工程问题，而非依赖运气的赌博。
  - 在不确定性极强的带货初期，唯有完成完整航海周期、耐过‘无数据’焦虑期、持续复盘迭代，才能触发概率性的爆发节点；方向确定后，需在同一项目多次参加航海，借力群体动能突破。
