paper: docs/202305/20230516_064.md
desc: 该素材记录了作者曹超峰基于"生财有术"社群思维训练，利用商业逆向工程方法，从零发现、拆解并跑通一个名为"视频定制"的冷门小项目全过程，核心在于以极低成本（8元）验证陌生赛道可行性，实现月入2万+的案例复盘。
concepts:
- name: 商业逆向工程
  desc: 一种面对陌生项目时的通用验证方法论：先通过现象发现商机，再拆解竞品全链路（选品/流量/转化/交付），最后以最小成本快速模仿试错，而非原创发明。
  is_original: false
  excerpt:
  - 碰到陌生的项目我应当如何去尝试，当然在我心里我给了它一个高大上的名字来安慰自己，那就是商业的逆向工程。
  - 我是如何发现这个项目以及逆向拆解并模仿的经历
- name: 视频定制项目
  desc: 素材中跑通的具体业务形态，指为用户定制制作特定主题（如生日、纪念日、表白等）的短视频产品，属于非标虚拟服务，边际成本极低。
  is_original: true
  excerpt:
  - 我把这个项目叫做视频定制
  - 8 块钱成本一个月小赚 2w 多
- name: 最小可行性验证 (MVP思维隐性体现)
  desc: 仅投入8元（域名/服务器/工具成本）即启动项目测试，不追求完美系统，先跑通"流量-转化-交付"闭环，验证需求真实性。
  is_original: false
  excerpt:
  - 8 块钱成本
  - 主要想验证一遍：碰到陌生的项目我应当如何去尝试
methods:
- name: __overview__
  desc: 生财思维指导下的商业逆向工程标准化流程：1. 现象观察与项目发现（刷短视频/直播发现异常场观） -> 2. 竞品全链路拆解（对标账号分析：选题、文案、挂载、引流、交付）
    -> 3. 低成本模仿搭建（工具准备、素材获取、发布测试） -> 4. 数据反馈与迭代（场观数据监控、转化率优化、规模化复制）。
  excerpt:
  - 我是如何发现这个项目以及逆向拆解并模仿的经历
  - 利用在生财有术学到的知识，跑通了一个没见过的小项目
  - 验证一遍：碰到陌生的项目我应当如何去尝试
theorems:
- name: 生财思维可迁移性
  desc: 在社群学习的抽象商业思维模型（如逆向工程、MVP验证），能迁移应用至具体陌生业务场景，指导实战跑通项目。
  excerpt:
  - 利用生财思维，我跑通了一个没见过的小项目
  - 利用在生财有术学到的知识，跑通了一个没见过的小项目
- name: 陌生赛道优于红海竞争
  desc: 主动寻找并验证竞争不激烈的冷门赛道（蓝海），比在成熟红海中拼存量更容易获得正反馈与生存空间。
  excerpt:
  - 也许我能及时发现一些竞争不是那么激烈的赛道
- name: 执行力是知识变现的关键杠杆
  desc: 相同认知下，敢于"先做再改"、忍受不确定性并快速行动的执行力，是将理论转化为现金流的核心差异因子。
  excerpt:
  - 我先前也刷到了，没你执行力哈哈
  - 主要被他的场观吓到了，所以尝试了一下
findings:
- name: 单项目低成本高回报验证结果
  desc: '[evidence] 作者实测投入约8元成本（推测为域名/基础工具费），运营一个月实现营收2万+，验证了"视频定制"需求真实存在且变现路径跑通。'
  excerpt:
  - 8 块钱成本一个月小赚 2w 多
  - 虽然变现不多，但说实话我还是很高兴的
- name: 场观数据作为选品/切入信号的有效性
  desc: '[claim] 作者声称通过观察竞品直播间/视频的"场观"（在线人数/播放量）异常高企，判断出该赛道有隐性需求，从而决定切入。'
  excerpt:
  - 主要被他的场观吓到了，所以尝试了一下
- name: 飞书文档承载详细复盘SOP
  desc: '[evidence] 完整的逆向拆解细节（账号搭建、素材来源、话术脚本、引流私域、交付流程、避坑指南）均沉淀在飞书文档中，公开分享但禁止复制。'
  excerpt:
  - 因为文章图片较多，放在飞书文档了
  - 公开分享，禁止复制，可以这么设置
