  - 很幸运，我吸引到了数千个主动链接我的粉丝，他们愿意无条件相信我为我的知识付费...目前他们中的一部分已经成为了我自己的团队成员
  - 从数据焦虑到忠于自己...做内心想做的内容...记录我当下每一天的学习、工作、思想、认知
