  excerpts:
  - 多多视频这个项目让我第一次感受到，一个优秀圈子和一个优秀老师对第一次接触副业的人来说有多重要。
  - 看完之后感觉我之前做的东西实在太弱鸡了，有太多东西需要完善
  - 生财有术太多这样的大佬了，所以我要吸收大佬们的成功经验，再去撬动我的第三杠杆。
  - 我发了第一篇帖子：《全行业通用：小红书引流逻辑和套路拆解》，反应还不错，很多圈友认可，也成功让很多圈友知道我是做小红书项目的
  - 我不是可以把其他项目的思路迁移到小红书吗？还可以把小红书的思路分享出来给其他副业的圈友参考
  - 心理咨询师根源：依托生财‘好文章+对的人’，一年少走弯路，从一无所有到年入200万，印证社群杠杆加速论。
- 'no': 5
  name: 注意力守恒与正反馈循环定律 —— 为什么‘贪多嚼不烂’必死无疑
  points:
  - '**为什么需要这个概念？**'
  - '- 揭示多项目并行失败的底层物理机制：非‘能力不足’，而是‘资源稀释’导致单项目无法触发正反馈'
  - '- 为‘聚焦’提供第一性原理支撑，克服新手‘不放心、想多试几个’的损失厌恶心理'
  - '- 建立‘正反馈阈值’概念：任何项目从0到1都需要最小投入量，低于该阈值则必死'
  - '**核心定义**'
  - '- 注意力守恒：个体单位时间内的高质量注意力总量固定，分配给N个项目，单项目得1/N，必低于临界值'
  - '- 正反馈阈值：项目从‘不确定’变为‘确定’所需的最小投入动作量/时长/资金量；低于此值，大脑判定‘不行’并停止分泌多巴胺'
  - '- 正反馈循环：投入→微小成果→正向激励→增加投入→更大成果→强正向激励→锁定赛道→All in'
  - '**关键性质**'
  - '- 非线性跃迁：正反馈不是线性累积，而是阈值型爆发；99分不及格，100分起飞，中间无平滑过渡'
  - '- 机会成本放大：分散注意力不仅导致当前项目失败，更丧失了‘深度钻研单一项目建立护城河’的时间窗口'
  - '- 心理机制：无正反馈 → 焦虑/自我怀疑 → 降低投入/切换项目 → 更无正反馈 → 习得性无助 → 放弃副业'
  - '**典型例子**'
  - '- 叁斤第二阶段：同时推进小红书矩阵/闲鱼/多多视频/视频号/资料号/头像号，6个项目每天各花30分钟，单项目投入远低于‘跑通闭环’阈值，6个月总收入<1500元'
  - '- 对比第三阶段：All in 小红书IP，每天投入4-6小时深度运营/研发课程/打磨文档，两周内推出课程收入2万+'
  - '**边界条件**'
  - '- ‘正反馈阈值’随赛道不同而异：内容IP型（写作/短视频）阈值高、周期长（需百篇内容/千粉）；工具/电商型阈值低、周期短（需几单/几百流量）'
  - '- 并行边界：若有成熟SOP+外包团队+充足资金，可并行多项目（此时注意力瓶颈被组织能力打破），但新手不具备'
  - '- 止损红线：单项目连续2周无正反馈（无流量/无咨询/无出单），且已执行标准SOP，必须止损或换赛道，不得硬扛'
  - '...'
