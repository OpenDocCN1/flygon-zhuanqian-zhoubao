    role: critique
  excerpts:
  - 棋牌直播不存在投流，主要是稳定直播，有特色的直播内容
  - 目前比如西游记，三国之类的直播间做这个的多
  - 我看他们现在都有投流，要不然没特色没流量
  - 是的，目前就是这类的棋盘直播间比较火
