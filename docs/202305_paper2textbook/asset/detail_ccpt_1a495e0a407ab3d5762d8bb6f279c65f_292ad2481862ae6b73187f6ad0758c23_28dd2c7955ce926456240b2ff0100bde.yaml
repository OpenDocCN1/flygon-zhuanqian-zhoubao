units:
- 'no': 1
  name: 生财技能导航图谱 —— 核心技能清单与学习路径索引
  points:
  - '**为什么需要这个概念？**'
  - '- 生财有术社区沉淀了海量实战经验，但分散在各个周报、精华帖中，缺乏系统性的总目录'
  - '- 学习者面临"不知道学什么"、"不知道从哪学起"、"不知道技能间联系"的三大困境'
  - '- 需要一张全景地图，将零散技能点串联成可检索、可规划的能力树'
  - '**核心定义**'
  - '- 生财技能导航图谱是对社区核心技能库的结构化分类汇总，提供技能分类导航与学习路径索引'
  - '- 覆盖流量获取、产品变现、私域运营、知识管理、投资理财等核心板块'
  - '- 作为全书知识体系的外部延伸索引，指引读者按需检索、系统化构建个人商业能力树'
  - '**关键性质**'
  - '- 索引性：不直接教授技能，而是提供"去哪里找"、"先学什么后学什么"的导航功能'
  - '- 结构化：将平铺直叙的技能列表组织为分类清晰、层级分明的知识地图'
  - '- 动态更新：随社区新实战案例沉淀持续扩充，保持与前沿打法同步'
  - '**典型例子**'
  - '- 新手想做小红书引流，通过图谱定位到"流量获取-小红书-笔记SEO/钩子设计/私域承接"完整学习路径'
  - '- 老手想拓展海外业务，通过图谱快速锁定"海外业务-独立站B2B/Mediabuy-选品/建站/收款/合规"能力模块'
  - '**边界条件**'
  - '- 仅提供链接索引，不包含具体技能教学内容，需跳转原文档学习'
  - '- 依赖语雀文档外部链接有效性，若链接失效将导致检索中断'
  - '- 分类体系基于社区现有沉淀，可能不覆盖极新赛道或极冷门技能'
  sources:
  - paper: docs/202305/20230516_012.md
    role: origin
  - paper: docs/202305/20230516_060.md
    role: origin
  excerpts:
  - 记录生财有术社区沉淀的核心技能清单文档标题与链接，覆盖流量获取、产品变现、私域运营、知识管理、投资理财等核心板块，作为全书知识体系的外部延伸索引。
  - 该素材仅提供了一个语雀文档的外部链接（标题为“生财技能”），正文内容为空，无任何可供分析的文本、概念、方法或案例，因此无法提取核心内容。
