units:
- 'no': 1
  name: 官方数据唯一真理原则 —— 拒绝预估，直连搜索日志
  points:
  - '**为什么需要这个概念？**'
  - '- 第三方工具（5118、站长工具）数据是预估或接口聚合，存在长尾词覆盖盲区和数值偏差'
  - '- 关键词决策若依赖不准数据，会导致选错方向、浪费内容生产成本'
  - '- 只有平台官方后台（百度关键词规划师、微信指数、抖音创意中心）直连全量搜索日志，能反映真实用户搜索体量'
  - '**核心定义**'
  - '- SEO选词决策的唯一权威依据 = 平台官方后台提供的关键词流量指数数据'
  - '- 第三方工具数据仅供参考，不可作为核心决策依据'
  - '**关键性质**'
  - '- 权威性：数据源头直连搜索日志，无采样偏差'
  - '- 完备性：覆盖全量长尾词，无“查不到”的盲区'
  - '- 决策分离：搜索框下拉词=需求词（定性，知其然），官方指数=流量词（定量，知其多少）'
  - '**典型例子**'
  - '- 实操中发现部分指数工具“很多词都查不到”，导致长尾挖掘不全'
  - '- 先用下拉框找需求方向，再用官方工具核实流量大小决定是否布局'
  - '**边界条件**'
  - '- 新上线平台暂无官方工具时，可暂用第三方辅助，但需标注“预估”属性'
  - '- 官方工具权限受限（如百度需开推广户）时，可结合搜索建议词+竞品反推作为过渡方案'
  - '...'
  sources:
  - paper: docs/202305/20230516_072.md
    role: origin
  excerpts:
  - 核心就是优先找官方平台的数据！
  - 为什么我们首先要用平台官方的关键词数据做做参考，因为很多第三方平台的数据其实也是预估或者找的一些接口，还有一些指数工具很多词都查不到，所以要用官方的。
  - 搜索框下拉只能知道用户需求词，但词的流量多少才是我们要选哪个词做的关键。
- 'no': 2
  name: GPT+SEO垂直结合 —— 让AI成为内容流水线工人
  points:
  - '**为什么需要这个概念？**'
  - '- SEO最大瓶颈是内容规模化生产成本高、人力不足'
  - '- 传统写作依赖人工，产能上限低，无法覆盖长尾词矩阵'
  - '- GPT解决“写什么、怎么写”的规模化生产问题，RPA解决“怎么发”的执行问题'
  - '**核心定义**'
  - '- GPTSEO = 官方关键词库(输入) → GPT按Prompt批量生成平台调性内容(处理) → RPA模拟人工自动发布(执行) → 平台收录获取精准搜索流量(产出)'
  - '- 核心逻辑：用AI弥补内容产能缺口，用自动化弥补执行缺口，用SEO策略兜底流量质量'
  - '**关键性质**'
  - '- 平台无关性：同一套流水线适配百家号、公众号、网站群、知乎、小红书等所有有搜索框的平台'
  - '- 低成本规模化：单人可日产百篇合规内容，实现7×24小时无人值守'
  - '- 质量可控：通过Prompt工程固定内容结构（标题/正文/图片建议/关键词布局），保证SEO基础达标'
  - '**典型例子**'
  - '- 百家号品牌推广：GPT按关键词生成内容 → 影刀RPA自动发布 → 获取百度搜索流量'
  - '- 谷歌SEO站群：GPT生成英文EEAT内容 → RPA发布百个站点 → 收录率达60% → 联盟变现'
  - '- 2B售前辅助：GPT生成访谈提纲/行业报告/方案初稿 → 销售会前预习 → 提升专业度信任度'
  - '**边界条件**'
  - '- 纯垃圾内容无法通过平台质量评估（谷歌收录率60%说明仍有40%被判定低质）'
  - '- 需人工把控关键词库质量与Prompt模板，GPT只负责框架内填充，不负责选题决策'
  - '- 工具开发赛道（封装GPT做SaaS）存在技术门槛、推广难、合规风险，非技术背景者不建议切入'
  - '...'
  sources:
  - paper: docs/202305/20230516_072.md
    role: origin
  excerpts:
  - 所谓应用的需求，这也是白杨 SEO 正在做的，与 SEO 这个垂直相结合。
  - GPT+RPA（机器自动化）+百家号，主要能过让 GPT 根据提前找好的关键词或者 GPT 生成的关键词，然后再来生成的内容。再然后用 RPA（小白推荐用影刀
    RPA）来自动模拟人操作流程发布到百家号上，再来进行推广。目前主要用于品牌推广。
  - GTP+RPA+SEO+网站，这个是一个技术大牛小哥老王的分享... 现在主要是在研究谷歌 SEO 网站。主要运用 GPT 的内容直接用 PRA 发布在网站上，好的网站目前谷歌收录率
    60%。目前主要用于先把网站流量做起来。
  - GPT+售前或售后服务，简单就是用 GPT 来写 2B 企业的专业的访谈稿大纲或者主要内容。给潜在 2B 客户感觉专业，加深好感。
  - GPT+推广文章。用 GPT 来生成文案，用第三方发布工具 发布在第三方各自媒体平台，主要用于做第三方平台站内流量或者百度关键词搜索占位结果流量。
- 'no': 3
  name: 应用层最大公约数定理 —— 普通人只能赚垂直应用的钱
  points:
  - '**为什么需要这个概念？**'
  - '- ChatGPT红利分四波：入门教育、垂直应用、工具开发、多平台大厂'
  - '- 普通人无技术背景做工具层：门槛高、推广难、有合规风险'
  - '- 普通人做多平台层：大厂垄断，无生存空间'
  - '- 入门教育层：信息差红利短、天花板低、不可持续'
  - '**核心定义**'
  - '- 普通人GPT变现主战场 = 垂直应用层（GPT + 具体成熟业务流程）'
  - '- 核心任务：将GPT能力嵌入现有业务（SEO、销售、运营、设计等），解决“效率提升”或“流量获取”核心痛点'
  - '**关键性质**'
  - '- 可持续性：业务流程成熟，AI仅作增强器，非颠覆者，抗风险强'
  - '- 门槛适中：懂业务+会Prompt+懂自动化串联即可，无需写代码'
  - '- 护城河深：业务知经验+Prompt工程+自动化流水线=组合式壁垒，难被单纯复制'
  - '**典型例子**'
  - '- 白杨SEO：十年SEO经验 + GPT内容生产 + RPA自动发布 = GPTSEO服务/教学'
  - '- 2B销售：不懂行业也能用GPT生成专业访谈提纲/方案，弥补知识广度不足'
  - '- 站群玩家：不懂英文也能用GPT生成EEAT内容，配合技术跑谷歌SEO'
  - '**边界条件**'
  - '- 必须有“原本业务”作为载体，纯靠GPT无业务场景无法变现'
  - '- 业务流程未标准化前，引入GPT只会制造更多混乱'
  - '- 合规红线：医疗/法律/金融等强监管领域，GPT生成内容需专业人工复核，不可全自动'
  - '...'
  sources:
  - paper: docs/202305/20230516_072.md
    role: origin
  excerpts:
  - 星球里花爷说，ChatGPT 有四波机会，分别是【入门上手的需求】、【应用的需求】、【工具的需求】、【多平台的需求】。除了多平台...前三个说都有机会。
  - GPT 入门需求，是教育用户，也可以叫信息差的钱。而 GPT 工具的需求，你不懂技术你赚不了，即使你懂技术，你的工具推广不出去，也不那么容易赚钱的。还有，工具还有一个
    ZC 风险，懂得人懂。
  - 真正在 GPT 的机会，我觉得是 GPT 应用的机会。因为一直专注 SEO 及全网 SEO 十多年了，所以我想到与 GPT 结合做了 GPTSEO，那你是不是与你的行业可以结合做个产品？只要能提高工作效率，或者能为你搞流量，那么你就有可能赚到更多钱。
- 'no': 4
  name: 全网SEO平台无关公理 —— 用户搜哪里，我们就做哪里的SEO
  points:
  - '**为什么需要这个概念？**'
  - '- 传统认知将SEO等同于“百度SEO”或“谷歌SEO”，忽视了微信搜一搜、抖音搜索、小红书搜索、知乎搜索等平台内搜索流量'
  - '- 各平台算法虽异，但核心逻辑同构：关键词匹配 + 内容质量 + 账号权重'
  - '- GPT作为通用内容生产力，可无缝适配所有平台的内容生产环节'
  - '**核心定义**'
  - '- SEO本质 = 挖掘平台官方关键词 → 生产高匹配内容 → 获取站内搜索流量 + 站外搜索引擎排名流量'
  - '- 平台只是流量容器，流量为本，平台无关'
  - '**关键性质**'
  - '- 统一性：关键词研究、内容生产、发布优化、数据复盘四步法跨平台通用'
  - '- 复利性：搜索流量长尾效应强，内容沉淀为资产，半年以上持续带来精准客户'
  - '- 组合性：可同时布局多平台矩阵（公众号+百家号+知乎+小红书+网站群），单次内容生产多次分发变现'
  - '**典型例子**'
  - '- 公众号写作 → 获取微信搜一搜流量'
  - '- 百家号/网站文章 → 获取百度搜索流量'
  - '- 知乎回答/小红书笔记 → 获取站内搜索+百度/搜狗搜索占位流量'
  - '- 第三方平台发布软文 → 借平台域名权重快速霸屏关键词搜索结果页'
  - '**边界条件**'
  - '- 各平台规则差异大（如微信严控引流、百度重原创、小红书重图文垂直），需针对性调整Prompt与发布策略'
  - '- 推荐流量（信息流分发）非SEO范畴，SEO仅解决“搜索流量”确定性获取'
  - '- 平台规则变更（如算法更新）可能导致已布局内容失效，需建立内容巡检与更新机制'
  - '...'
  sources:
  - paper: docs/202305/20230516_072.md
    role: origin
  excerpts:
  - 不管做哪个平台的 SEO，除了了解该平台规则以外，最最重要的就是找对这个平台上的用户搜索用的关键词！
  - 主要用在以下方面：1、公众号写作...获取微信搜一搜流量。 2、网站文章、百家号文章...获取百度上的搜索流量。 3、知乎回答、小红书笔记...
  - GPT+推广文章...主要用于做第三方平台站内流量或者百度关键词搜索占位结果流量。
- 'no': 5
  name: 知乎/小红书精准选题反向挖掘法 —— 搜索需求导向 > 推荐算法导向
  points:
  - '**为什么需要这个概念？**'
  - '- 平台推荐选题（热榜/热门话题）竞争极大、生命周期短、流量泛不精准'
  - '- 搜索流量用户意图明确、转化率高、长尾复利长'
  - '- 需要一套标准化方法从海量问题中筛选出“有搜索量、有排名潜力、竞争度可控”的精准选题'
  - '**核心定义**'
  - '- 选题SOP：核心词 → 知乎创作中心/5118工具搜索 → 筛选长尾精准问题 → GPT生成高质量回答/笔记 → 布局长尾关键词'
  - '- 放弃“蹭热点”，转向“占搜索坑位”'
  - '**关键性质**'
  - '- 精准性：每一条内容都对应明确的用户搜索需求，无无效产出'
  - '- 可复制性：流程标准化后，新手可按SOP批量产出合格SEO内容'
  - '- 资产性：内容沉淀为长尾关键词排名资产，随时间增值'
  - '**典型例子**'
  - '- 白杨小号实操：用关键词在知乎创作中心/5118筛选问题 → GPT生成回答 → 成功获取精准搜索流量'
  - '- 小红书笔记：同理用关键词挖掘笔记主题，而非跟随平台推荐话题'
  - '**边界条件**'
  - '- 适用于“有人搜、有答案、有转化”的知识/服务/产品类赛道，不适用于纯娱乐/泛资讯类依靠推荐算法爆发的内容'
  - '- 需配合账号权重建设（垂直度、活跃度、互动率），新号冷启动期需辅以互动催化'
  - '- 关键词工具（5118等）数据仍有滞后，需结合平台实时下拉框/联想词做实时校准'
  - '...'
  sources:
  - paper: docs/202305/20230516_072.md
    role: origin
  excerpts:
  - 白杨其中一个小号，就用 GPT 来解答知乎上的问题。有人问问题怎么选？因为我是做精准搜索流量，所以我的问题都是用关键词去搜的（在知乎创作里搜或用 5118
    筛选），而不是用推荐的问题。
