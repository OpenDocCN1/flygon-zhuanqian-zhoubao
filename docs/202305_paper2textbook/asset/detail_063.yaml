learning_targets:
- 理解择时的本质是基于股债性价比的大类资产轮动，而非预测顶底
- 掌握沪深300股债性价比的计算方法、区间界定（1.5-3.0）与实操阈值
- 学会识别系统性行情与结构性行情，理解普通投资者仅参与系统性行情的生存法则
- 掌握技术分析在择时体系中的辅助定位：仅用于高位拐点确认（跌破趋势）
- 建立择时干扰项否定清单：屏蔽突发事件、宏观数据、情绪观察三大噪音
- 掌握“三好选基”筛选体系：好公司（六维定性）、好经理（三硬指标）、好体系（小规模铁律<50亿）
- 理解小规模基金三大结构性优势：换仓灵活、打新超额收益、迷你股交易权
- 建立基金筛选三步走执行流程：筛公司→筛经理→筛体系（一票否决制）
- 内化普通投资者生存法则：年化<25%者仅在系统性底部重仓，其余时间小仓位
- 通过作者十年实盘复盘（三逃顶、两抄底、连续十年正收益）验证体系有效性
concept_map:
- 投资择时与选品体系
- ├── 择时核心模型
- │   ├── 股债性价比 —— P001、P008
- │   │   ├── 定义：(1/PE_TTM) / 十年国债收益率
- │   │   ├── 区间：长期1.5-3.0波动
- │   │   ├── 阈值：>3.0买入区、<1.5卖出区
- │   │   └── 理论：股票长期风险溢价约为债券2倍
- │   ├── 系统性vs结构性行情识别 —— P002、P007
- │   │   ├── 系统性底部：四风格全便宜（2012底、2019初）
- │   │   ├── 系统性顶部：四风格全贵（2015顶、2018顶）
- │   │   ├── 结构性行情：风格分化（2016、2021、2022）
- │   │   └── 普通人铁律：仅参与系统性行情
- │   ├── 技术分析辅助定位论 —— P003
- │   │   ├── 仅用于高位拐点确认
- │   │   ├── 条件：股债性价比接近1.5时
- │   │   ├── 信号：价格跌破长周期均线/趋势支撑
- │   │   └── 禁用：常态区频繁高抛低吸
- │   └── 三大择时干扰项清单 —— P004
- │       ├── 突发事件/地缘/外盘（事后调整性价比低）
- │       ├── 财政货币/宏观数据（已定价于国债收益率）
- │       └── 投资者情绪观察（样本小、不可量化）
- ├── 选品核心体系
- │   ├── 三好选基标准 —— P005、P008
- │   │   ├── 好公司（六维）：规模、高管、梯队、口碑、价值观、薪酬
- │   │   ├── 好经理（三硬）：长期业绩、投决委、金牛奖
- │   │   └── 好体系（铁律）：只买<50亿，最优<20亿
- │   ├── 小规模基金超额收益源泉论 —— P006
- │   │   ├── 换仓摩擦成本低
- │   │   ├── 打新超额收益占比高
- │   │   └── 迷你股交易权
- │   └── 基金筛选三步走法 —— P008
- │       ├── Step1：筛公司（定性白名单）
- │       ├── Step2：筛经理（量化核心名单）
- │       └── Step3：筛体系（规模一票否决）
- └── 生存法则与实证验证
- '    ├── 普通投资者生存法则 —— P007'
- '    │   ├── 承认能力圈：年化<25%仅做系统性贝塔'
- '    │   ├── 标的：宽基/三好筛选的小规模主动基金'
- '    │   └── 心法：耐寂寞、守底线、低决策频次'
- '    └── 实战复盘证据 —— P001、P007'
- '        ├── 作者十年战绩：三逃顶、两抄底、100%准确率、连续十年正收益'
- '        ├── 股债性价比历史回测有效性'
- '        ├── 关键节点系统性/结构性特征验证'
- '        └── 头部分层与硬指标有效性观察'
life_analogy:
- 想象投资择时像**‘买房决策’**一样理性：
- '- **股债性价比** = **‘房价租金比’**：告诉你当前买房（买股）相对于存银行/买国债（租房/债券）是否划算'
- '- **>3.0区间** = **‘租金极高覆盖房贷、房价极低’**：铁定要买（重仓），安全边际极高'
- '- **<1.5区间** = **‘房价虚高、租金覆盖不了利息’**：坚决卖房（清仓），哪怕还能涨一点也不贪'
- '- **系统性底部** = **‘全城房价都便宜、学区/地段/新房全便宜’**：闭眼买哪套都赚'
- '- **结构性底部** = **‘只有远郊便宜、核心区还贵’**：除非你是选房专家（专业选手），否则别碰'
- '- **技术分析** = **‘看成交量/挂牌量拐点’**：只有在房价已极高（估值<1.5）时，看成交量萎缩确认顶部再卖'
- '- **三大干扰项** = **‘邻居说要涨/新闻说利好/专家预测’**统统屏蔽，只看核心比价指标'
- 就像买房不看大师预测只看租售比，投资也不猜顶底只看股债性价比。
summary:
- concept: 股债性价比
  desc: 核心择时指标：(1/PE_TTM)/十年国债收益率，长期1.5-3.0波动，>3.0买入<1.5卖出
- concept: 系统性底部
  desc: 四大风格象限估值同时处于历史低位（全便宜），普通人重仓买入宽基/优质主动基金的黄金窗口
- concept: 结构性行情
  desc: 四大风格估值分化（如大盘便宜小盘贵），仅适合专业选手，普通人极易选错风格跑输基准
- concept: 技术分析辅助定位
  desc: 仅在股债性价比接近1.5高位区时，用价格跌破长周期均线确认顶部拐点，解决具体卖点不可知问题
- concept: 三大择时干扰项
  desc: 突发事件/地缘/外盘、财政货币/宏观数据、投资者情绪观察 —— 全部屏蔽，不作为仓位调整依据
- concept: 三好选基标准
  desc: 好公司(六维定性)/好经理(三硬指标：长期业绩/投决委/金牛奖)/好体系(核心铁律：只买<50亿小规模基金)
- concept: 小规模基金优势
  desc: 换仓摩擦成本低、享受打新超额收益、可参与迷你股交易 —— 规模是主动管理的原罪
- concept: 基金筛选三步走
  desc: 漏斗式筛选：筛公司定上限→筛经理定核心→筛体系一票否决规模>50亿
- concept: 普通投资者生存法则
  desc: 历史年化<25%者：仅在系统性底部(股债性价比>3.0且四风格全便宜)重仓，其余时间小仓位/空仓
- concept: 作者实盘验证
  desc: 2015/2018/2021三次逃顶，2015/2018/2019两次抄底，择时准确率100%，连续十年正收益
exercises:
- 'no': 1
  title: 手算股债性价比与区间判断
  contents:
  - 给定：沪深300 PE_TTM = 10倍，十年国债收益率 = 3%
  - 1. 计算股票收益率 (E/P) = 1/PE
  - 2. 计算股债性价比 = 股票收益率 / 国债收益率
  - 3. 判断当前处于何种区间：买入区(>3.0)、常态区(1.5-3.0)、卖出区(<1.5)
  - 回答问题：
  - '- 如果国债收益率升至4%，PE不变，性价比会如何变化？对应何种操作？'
  - '- 为什么用十年国债收益率而非一年期存款利率作为分母？'
- 'no': 2
  title: 识别系统性 vs 结构性行情（模拟决策）
  contents:
  - 场景A：四大风格指数PE百分位分别为：大盘成长15%、大盘价值10%、小盘成长20%、小盘价值12%，股债性价比=3.2
  - 场景B：四大风格指数PE百分位分别为：大盘成长80%、大盘价值25%、小盘成长85%、小盘价值30%，股债性价比=3.1
  - 任务：
  - 1. 分别判断场景A和B属于系统性底部还是结构性底部
  - 2. 假设你是历史年化15%的普通投资者，在场景A和B中各应采取何种仓位策略？
  - 3. 为什么场景B中即使股债性价比>3.0，普通人也不建议重仓？
- 'no': 3
  title: 基金筛选三步走实操演练
  contents:
  - 假设你从天天基金导出某头部公司旗下10只权益类基金数据：
  - 基金代码 | 经理 | 任职回报排名(同类) | 是否投决委 | 金牛奖数 | 基金规模(亿)
  - 001 | 张三 | 5/200 | 是 | 2 | 18
  - 002 | 李四 | 50/200 | 否 | 0 | 35
  - 003 | 王五 | 30/200 | 是 | 1 | 60
  - 004 | 赵六 | 10/200 | 否 | 0 | 15
  - 005 | 钱七 | 8/200 | 是 | 3 | 22
  - 任务：
  - 1. Step3（体系筛选）：直接剔除规模>50亿的基金，剩余几只？
  - 2. Step2（经理筛选）：在剩余基金中，筛选满足‘投决委成员’且‘金牛奖≥1’的经理管理的基金，剩余几只？
  - 3. Step1（公司筛选）：若该公司高管非投研出身、人才梯队断层、近年负面新闻多，即使基金通过Step2/3，你是否仍买入？为什么？
  - 4. 为什么规模18亿的基金比规模60亿的基金更具结构性优势？（从换仓、打新、迷你股三方面解释）
- 'no': 4
  title: 择时干扰项识别与屏蔽练习
  contents:
  - 以下哪些信息属于‘择时干扰项’，应被屏蔽？哪些属于‘择时核心输入’？请判断并说明理由：
  - 1. 央行今日宣布降准0.25个百分点
  - 2. 沪深300股债性价比从2.8跌至1.45，且指数跌破250日线
  - 3. 俄乌冲突升级，美股期货大跌3%
  - 4. 雪球大V‘林园’最新持仓曝光，重仓消费股
  - 5. 十年国债收益率从2.8%升至3.2%，导致股债性价比进入<1.5区间
  - 6. 身边同事讨论股票人数明显增多，大家都在说‘今年要大涨’
  - 7. 四大风格指数估值百分位均降至历史10%分位以下，股债性价比达3.5
  - 任务：分类标记（核心输入/干扰项），并简述核心判断逻辑
- 'no': 5
  title: 普通投资者生存法则压力测试
  contents:
  - 假设你历史年化收益18%（<25%门槛），当前处于2021年3月类似的结构性行情：
  - '- 股债性价比=2.0（常态区偏低）'
  - '- 大盘成长PE百分位85%（贵），大盘价值PE百分位15%（便宜）'
  - '- 你的账户重仓某只小盘成长基金（规模80亿，经理非投决委、无金牛奖），近三月涨幅40%'
  - 任务：
  - 1. 根据‘普通投资者生存法则’，你此时应采取何种操作？（继续持有/减仓/清仓/换仓）
  - 2. 分析该基金违反了‘三好标准’中的哪几条？
  - 3. 如果你不卖，后续面临哪两大核心风险？（风格轮动风险 + 基金规模/经理风险）
  - 4. 为什么‘承认平庸、只做系统性行情’比‘试图在结构性行情跑赢大盘’更难执行？
units:
- 'no': 1
  name: 股债性价比 —— 用一把尺子量尽牛熊
  points:
  - '**为什么需要这个概念？**'
  - '- 投资者常陷入“猜顶底”的预测陷阱，或被宏观新闻、情绪干扰导致频繁交易'
  - '- 需要一个理论支撑坚实、可量化、长周期有效的核心指标来指导大类资产配置'
  - '- 传统估值指标（如单纯PE）忽略了无风险利率变化，无法横向比较股债吸引力'
  - '**核心定义**'
  - '- 沪深300股债性价比 = (1 / 沪深300 PE_TTM) / 十年国债收益率'
  - '- 本质是股票收益率（PE倒数）与无风险收益率（国债）的比率，反映股票相对债券的风险溢价合理性'
  - '**关键性质**'
  - '- 长期均值回归：历史长期在 1.5 - 3.0 区间波动，符合股票长期收益约为债券2倍的经验规律'
  - '- 区间界定明确：> 3.0 为极度低估（买入/重仓区），< 1.5 为极度高估（卖出/清仓区），中间为常态波动区'
  - '- 非预测工具：不预测具体拐点数值（顶部可能是1.5、1.6或1.7），只识别“极端区间”'
  - '**典型例子**'
  - '- 2012年底、2019年初：指标 > 3.0，四大风格全便宜，系统性底部，买什么都赚'
  - '- 2015年6月、2018年2月：指标 < 1.5，四大风格全贵，系统性顶部，清仓保命'
  - '- 2022年4月/10月：指标再次 > 3.0，但属结构性底部（大盘成长贵，其余便宜），仅适合小仓位或专业选手'
  - '**边界条件**'
  - '- 仅适用于大类资产配置（股 vs 债）与系统性行情判断，不指导个股/单只基金选择'
  - '- 顶部具体数值不可预知，需结合技术分析（跌破长周期均线）确认拐点'
  - '- 结构性行情（风格分化）下指标失真，水平有限者（年化<25%）应规避，仅参与系统性行情'
  - '...'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 关键因子只有一项：股债性价比
  - 沪深 300 股债性价比= （1/沪深 300 PE）/十年国债收益率
  - 沪深 300 股债性价比长期在 1.5-3.0 之间运行。
  - 过去十几年，如果在该指标 3.0 附近买入股票/基金，在 1.5 附近卖出，你就是大赢家
  - 该项指标是有理论支撑的——股票相比债券有风险溢价。美国过去 200 年的经验，股票的年化收益，就是长期债券的 2 倍左右。
  - A 股有在股债性价比 1.5 的时候拐头向下，也有时候是 1.6、1.7。顶部的股债性价比具体数据，我们没有办法提前预知。
  - 结合技术分析的判断，股票性价比低的时候跌破趋势，就有很强的指导意义。
- 'no': 2
  name: 系统性 vs 结构性行情识别 —— 判断能不能“闭眼买”
  points:
  - '**为什么需要这个概念？**'
  - '- 股债性价比到达买入区（>3.0）时，市场可能是“全便宜”也可能是“结构性分化”，直接决定能否重仓'
  - '- 普通投资者在结构性行情中极易选错风格跑输基准，甚至亏损'
  - '- 需要一个简单可执行的判断框架，区分“全市场机会”与“结构性机会”'
  - '**核心定义**'
  - '- 系统性底部：大盘成长、大盘价值、小盘成长、小盘价值四大风格象限估值**同时**处于历史低位（全便宜）'
  - '- 系统性顶部：四大风格象限估值**同时**处于历史高位（全贵）'
  - '- 结构性底部/顶部：四大风格估值**分化**，如大盘便宜小盘贵，或成长贵价值便宜'
  - '**关键性质**'
  - '- 系统性底部胜率极高：买宽基/优质主动基金大概率赚大钱，适合普通人重仓'
  - '- 系统性顶部风险极大：指数跌破趋势时清仓是最优解，无需犹豫'
  - '- 结构性行情仅适合专业选手：需精准选中市场热点风格，否则极易跑输保本理财'
  - '**典型例子**'
  - '- 2012年底、2019年初：典型系统性底部，四风格全便宜，闭眼买沪深300/中证500均大赚'
  - '- 2015年6月、2018年2月：典型系统性顶部，全贵且利率高（十年国债>4%），坚决清仓'
  - '- 2016年3月：结构性底部，大盘股便宜小盘股贵，随后两年属于大盘股行情，小盘无缘'
  - '- 2021年3月/2022年：结构性顶/底，大盘成长贵/价值便宜，市场撕裂，难判断'
  - '**边界条件**'
  - '- 要求能获取四大风格指数的实时估值数据（PE百分位等）'
  - '- 历史年化收益 < 25% 的投资者，应将“仅参与系统性行情”作为铁律'
  - '- 结构性行情中，即使判断正确方向，若未买到热点风格，也可能跑输基准'
  - '...'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 2012 年底是一次典型的系统性底部——所有股票都很便宜。不管买什么类型的基金，大概率都能赚大钱。
  - 2015 年 6 月，是一个典型的系统性顶部——所有股票都很贵...指数跌破趋势的话，清仓是最好的办法。
  - 2016 年 3 月份，则属于一个结构性底部——大盘股估值已经非常便宜，但小盘股估值仍然偏贵。2016-2017 年是属于大盘股的行情，与小盘股无缘。
  - 2021 年 3 月份比较难判断...大盘成长股估值很高，价值股、小盘股估值很便宜，市场是撕裂的。
  - 目前我们还和 2016 年类似，处在一个结构性的底部。
  - 我认为，如果是水平有限（历史年化低于 25%）的投资者，不妨等 A 股系统性底部时，再大举买入，其余时间只值得小仓位参与。
- 'no': 3
  name: 技术分析辅助定位论 —— 让均线给拐点“盖章”
  points:
  - '**为什么需要这个概念？**'
  - '- 股债性价比只能识别“极端区间”，无法给出具体的“今天卖/明天买”的精确时点'
  - '- 顶部区域（性价比1.5-1.7）可能持续数月，过早清仓错失上涨，过晚清仓回撤巨大'
  - '- 需要一个客观、机械的触发机制，在估值已极高时确认趋势反转'
  - '**核心定义**'
  - '- 技术分析在择时体系中**仅作辅助**，核心作用是：当股债性价比已达极端高估区（接近1.5）时，用“价格跌破长周期趋势线/关键均线”确认顶部成立'
  - '- 底部区域（>3.0）通常不依赖技术指标确认，因估值安全边际足够高，可分批建仓'
  - '**关键性质**'
  - '- 解决“具体拐点数值不可知”问题：不预测顶到底是1.5还是1.6，只等趋势破位'
  - '- 非完全有效市场下的有效工具：A股散户多、政策影响大，趋势跟踪有一定胜率'
  - '- 严格区分主次：估值是“弹药”，技术是“扳机”，无弹药（估值不高）时扣扳机无用'
  - '**典型例子**'
  - '- 2015年6月、2018年2月：性价比已<1.5，指数跌破半年线/年线，技术确认顶部，执行清仓'
  - '- 2021年2-3月：性价比低位+技术破位，成功逃顶避开后续大跌'
  - '**边界条件**'
  - '- 严禁在估值常态区（1.5-3.0）单纯用技术指标频繁高抛低吸，会被震荡磨损'
  - '- 技术指标参数需固化（如60周线、250日线），不可主观调整参数曲线拟合'
  - '- 仅用于高位确认，不用于低位确认（低位用估值安全边际即可）'
  - '...'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 技术分析，主要是在高位，判断拐点时候用的。
  - A 股有在股债性价比 1.5 的时候拐头向下，也有时候是 1.6、1.7。顶部的股债性价比具体数据，我们没有办法提前预知。
  - 结合技术分析的判断，股票性价比低的时候跌破趋势，就有很强的指导意义。
  - 要保持高的择时胜率，得先弄明白：我们做的不是猜测、赌博，而是基于资产的性价比，做大类资产轮动。
- 'no': 4
  name: 三大择时干扰项清单 —— 刻意屏蔽的噪音
  points:
  - '**为什么需要这个概念？**'
  - '- 投资者极易被突发新闻、宏观数据、周围情绪绑架决策，导致在错误时间错误交易'
  - '- 需要建立“否定清单”，明确哪些信息在择时体系中应被彻底忽略，减少认知负荷'
  - '- 这是“知行合一”的关键：知道什么不重要，比知道什么重要更难、更关键'
  - '**核心定义**'
  - '- 干扰项①：突发性事件/地缘政治/外盘波动（疫情、战争、美股暴跌）'
  - '- 干扰项②：财政/货币政策及宏观数据（LPR、MLF、M2、社融、GDP）'
  - '- 干扰项③：投资者情绪观察（身边讨论股票人数、雪球/股吧热度）'
  - '**关键性质**'
  - '- 事件驱动滞后性：事件发生时股市已跌大半，事后调仓性价比极低'
  - '- 宏观数据已定价：远期影响完全体现在十年国债收益率中，股债性价比分母已隐含'
  - '- 情绪观察不可量化：样本极小、主观性强、无统计显著性，成功率无保障'
  - '**典型例子**'
  - '- 疫情爆发/俄乌冲突：属于干扰项①，发生时市场已反应，不应作为调仓依据'
  - '- 降准/降息/LPR下调/M2超预期：属于干扰项②，仅影响日内情绪，中长期看债券收益率'
  - '- 雪球大V看多/身边朋友炒股赚钱：属于干扰项③，幸存者偏差严重，常是顶部信号'
  - '**边界条件**'
  - '- 并非这些信息毫无价值，而是它们**不属于择时决策体系的输入变量**'
  - '- 事件/宏观可用于基本面研究、行业配置，但不指导“大仓位调整”'
  - '- 情绪观察可作反向参考（极度狂热时警惕），但不可作为正向买入理由'
  - '...'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 非关键因素包括三类：
  - ①突发性事件（如疫情）、地缘政治、外盘（港美股）波动 仅影响短期的行情，事件一发生，股市就已经跌了一大半，此时再做仓位调整，性价比太低
  - ②财政政策、中期货币政策（如 LPR、MLF）、宏观经济数据（M2、社融数据） 这类因素，可能仅能影响大盘日内的走势，直接忽略。远期的影响，已经体现在十年国债收益率里
  - ③投资者情绪观察（如周边人讨论股票的人数、xueqiu/股吧评论内容） 样本太小、无法定量分析，也没办法保证很高的成功率，应该忽略
- 'no': 5
  name: 三好选基标准 —— 好公司、好经理、好体系
  points:
  - '**为什么需要这个概念？**'
  - '- 市场上基金数量庞大，质量参差不齐，散户缺乏专业筛选能力'
  - '- 过去业绩不代表未来，单纯追高买入“冠军基金”往往买在高位'
  - '- 需要一套标准化、可复制、重定性轻量化的筛选流程'
  - '**核心定义**'
  - '- 好公司（六维）：管规模大(剔除货基)、高管出身投研、人才梯队完善(老中青)、口碑好/负面少、价值观长期主义、经理收入高(留住人才)'
  - '- 好经理（三硬指标）：长期业绩居前、投决委成员(核心决策层)、金牛奖得主(筛掉高波动赌风格)'
  - '- 好体系（核心铁律）：**只买小规模基金**，拒绝 > 50亿，最优 < 20亿'
  - '**关键性质**'
  - '- 公司层面定上限：选错公司，再好的经理也难发挥（平台资源、风控、文化制约）'
  - '- 经理层面定核心：投决委成员代表公司最高投研水平；金牛奖考核风险调整后收益，天然克制“赌风格”'
  - '- 体层面定生死：规模是主动管理的“原罪”，小规模享有换仓灵活、打新收益、迷你股超额收益三大结构性优势'
  - '**典型例子**'
  - '- 强公司名单：景顺长城、易方达、富国、中欧、交银施罗德、华安（作者观察）'
  - '- 大而不强名单：华夏、南方、博时、广发、汇添富、鹏华、天弘（有规模无质量）'
  - '- 蔡嵩松案例：短期业绩炸裂、波动极大，但无金牛奖，被三硬指标自动筛掉'
  - '**边界条件**'
  - '- 公司分层基于作者主观观察，非官方权威排名，需自行验证更新'
  - '- “小规模”定义随市场发展变化，核心逻辑是“未达容量上限”而非绝对数字'
  - '- 该体系仅适用于主动权益类基金，不适用于指数基金、债基、量化基金'
  - '...'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 构建优质的基金组合，我推崇“三好”标准——好公司、好经理、好体系
  - 一、好公司...1. 剔除货币基金后的管理规模大 2. 公司高管是高水平基金经理出身 3. 老中青各代，优秀经理层出不穷 4. 口碑好、负面新闻少 5. 公司价值观偏向于长期投资
    6. 基金经理收入高
  - 二、好经理...最简单粗暴的——选择长期业绩居前的基金经理...① 看基金经理是否是公司投资决策委员会成员...② 金牛奖数量。
  - 三、好体系...投资权益类基金，只需做到一步，就领先了别人大半个身位——只买小规模基金。
  - 我的原则，是不买超过 50 亿规模的基金，最好是 20 亿以下的。
  - 大规模基金公司里，给我留下好印象的公司有：景顺长城、易方达、富国、中欧、交银施罗德、华安
  - 大而不强，有规模没质量的公司：华夏、南方、博时、广发、汇添富、鹏华、天弘
  - 【投决会】成员，就是公司的大佬们，可以对其他基金经理的操作进行审查、指导，投资水平必然是比较高的。
  - 得过金牛奖的基金经理至少水平都不差。多座金牛奖得主，都是业内大腕。短期赌风格、净值波动大的经理，比如蔡嵩松，就拿不到金牛奖。
- 'no': 6
  name: 小规模基金超额收益源泉论 —— 规模是主动管理的原罪
  points:
  - '**为什么需要这个概念？**'
  - '- 直觉上觉得“大基金更安全、资源更多”，实则是主动管理最大的误区'
  - '- 需要从微观交易机制层面揭示：为什么规模越大、超额收益越难'
  - '- 为“只买<50亿”这一铁律提供不可辩驳的底层逻辑支撑'
  - '**核心定义**'
  - '- 小规模基金（<50亿，最优<20亿）拥有三大结构性优势：'
  - '  1. 换仓摩擦成本低：买卖冲击成本随规模线性放大，小基金可无痕建仓撤退'
  - '  2. 打新股超额收益：打新收益率固定，规模小则占净值比重大，规模大则稀释至无'
  - '  3. 迷你股交易权：流动性差的小微盘股只能小资金参与，往往蕴含定价偏差机会'
  - '**关键性质**'
  - '- 容量约束铁律：优秀策略均有容量上限，规模扩大必然面临收益递减（买大盘股降低弹性、买小盘股推高成本）'
  - '- 反向淘汰机制：业绩好→规模暴增→换仓变难、打新稀释、被迫抱团大盘股→业绩回撤→赎回→规模缩小'
  - '- 买入大规模基金 = 买入“过去的辉煌”，无法复制历史高收益'
  - '**典型例子**'
  - '- 规模从几亿做到百亿的基金，往往风格漂移从灵活选股变成抱团核心资产，超额收益消失'
  - '- 打新收益：规模1亿基金年化贡献0.5%-1%，规模100亿基金贡献不足0.05%'
  - '**边界条件**'
  - '- 仅针对主动选股型权益基金，指数增强/量化中性策略容量远大于50亿'
  - '- “最优<20亿”非绝对红线，核心看“未显著超过策略容量上限”'
  - '- 新发基金虽小但无历史记录，需结合经理过往管理产品业绩综合判断'
  - '...'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 规模越小的基金，基金经理在交易换仓的时候，摩擦成本越小。小规模的基金还有额外的打新股超额收益。也能参与一些迷你股的交易。
  - 理想的权益类基金，就是优秀基金经理管理的小规模产品。
  - 我们在它大放异彩、规模迅速扩大的时候买入，必定没办法取得和以前一样的业绩。
  - 投资权益类基金，只需做到一步，就领先了别人大半个身位——只买小规模基金。
- 'no': 7
  name: 普通投资者生存法则 —— 只赚“系统性”的钱
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数散户（年化<25%）不具备在结构性行情中选风格、选赛道、选基金的能力'
  - '- 试图在结构性行情中“跑赢大盘”往往导致频繁换仓、追涨杀跌、心态崩盘'
  - '- 需要一套“承认平庸、守住确定性”的生存策略，而非“追求卓越、博取超额”的致富幻想'
  - '**核心定义**'
  - '- 铁律：历史年化 < 25% 的投资者，**仅在系统性底部（股债性价比>3.0 且 四风格全便宜）重仓**，其余时间小仓位或空仓'
  - '- 标的：宽基指数基金（沪深300/中证500/中证1000）或 通过“三好标准”筛选出的小规模优质主动基金'
  - '- 目标：博取确定性最高的“系统性贝塔收益”，放弃“结构性阿尔法收益”'
  - '**关键性质**'
  - '- 承认能力圈：结构性行情需“双重预判”（判断风格轮动+判断基金经理能跟上），难度指数级上升'
  - '- 降低决策频次：几年才一次系统性底部，其余时间“少动为贵”，规避手续费与错误决策'
  - '- 心理建设：耐得住寂寞（结构性牛市中看别人赚钱）、守得住底线（系统性顶部敢清仓）'
  - '**典型例子**'
  - '- 2016-2017年大盘价值牛市：持有小盘成长基金的散户跑输理财，持有宽基的散户跑赢通胀'
  - '- 2020-2021年核心资产牛市：重仓新能源/医药主题基金的散户在2021年顶部被套'
  - '- 作者实盘：十年三次逃顶、两次抄底、三次切换赛道，仅参与系统性大行情，连续十年正收益'
  - '**边界条件**'
  - '- 适用于“以投资为副业、追求长期复利、厌恶大回撤”的普通人'
  - '- 职业基金经理、量化团队、顶级游资不适用，他们以捕捉结构性机会为生'
  - '- 需定期计算自身历史年化，诚实面对“水平有限”的现实，不因一时运气自大'
  - '...'
  sources:
  - paper: docs/202305/20230516_045.md
    role: origin
  excerpts:
  - 我认为，如果是水平有限（历史年化低于 25%）的投资者，不妨等 A 股系统性底部时，再大举买入，其余时间只值得小仓位参与。
  - 就算是抓准了结构性底部，股票或者基金没买到市场热点，很有可能也会跑输私募 xueqiu 产品，甚至保本理财产品。
  - 依靠一套稳定的择时交易体系，我在 2015 年 6 月、2018 年 2 月、2021 年 2-3 月份成功逃顶，并于 2015 年 9 月、2018 年底再次进入市场。2021
    年 3 月切换赛道。到目前为止，我择时的准确率是 100%。
  - CFA 持证人，2013 年入市 A 股投资，连续十年取得正收益。
