paper: docs/202305/20230516_044.md
desc: 该素材为一篇关于 Web3 领域 BRC20 协议下 VMPX 项目抢购实战的复盘文章引用，作者瓜藤以过来人视角分享其摒弃偏见后的首次实战经历，核心在于展示一种可复用的
  Web3 机会发现与执行思维框架，而非单纯的项目技术分析或投资建议。
concepts:
- name: Web3 认知偏见摒弃
  desc: 指投资者在面对新赛道（如 BRC20）时，主动打破固有认知框架（如对比特币生态的传统看法），以开放心态重新评估机会的心理过程。
  is_original: true
  excerpt:
  - '5 月 8 号凌晨三点冲 #VMPX 也是因为最近摒弃了一些偏见后的第一次实战'
- name: Web3 可复用思维框架
  desc: 一种跨越具体项目细节、专注于机会识别逻辑、执行时机把控及复盘总结方法论的通用思维模型，旨在帮助实战者在不同周期中复制成功经验。
  is_original: true
  excerpt:
  - 文章里面关于 Web3 里面的思考和框架可复用
- name: BRC20 协议实战
  desc: 基于比特币区块链上的 BRC-20 代币标准进行的链上交互、铸造或交易操作实践，是本文复盘的具体业务场景。
  is_original: false
  excerpt:
  - Web3 新赛道：BRC20 项目 VMPX 抢购复盘
methods:
- name: __overview__
  desc: 作者采用“实战复盘+框架抽象”的方法论：以具体的 VMPX 抢购实战为载体，剥离项目特有细节，提炼出可在 Web3 不同赛道、不同时期复用的认知重构与决策执行框架。
  excerpt:
  - 文章里面关于 Web3 里面的思考和框架可复用
  - '5 月 8 号凌晨三点冲 #VMPX 也是因为最近摒弃了一些偏见后的第一次实战'
theorems:
- name: 认知升级先于行动致胜
  desc: 在 Web3 高不确定性环境中，打破认知偏见、更新心智模型（摒弃偏见）是捕捉新赛道红利（如 BRC20）的必要前提，行动是认知变现的结果而非起因。
  excerpt:
  - '5 月 8 号凌晨三点冲 #VMPX 也是因为最近摒弃了一些偏见后的第一次实战'
- name: 框架价值大于单次收益
  desc: 单次投机收益具有偶然性，但从实战中抽象出的‘思考和框架’具有确定性的长期复利价值，是穿越周期的核心竞争力。
  excerpt:
  - 文章里面关于 Web3 里面的思考和框架可复用
  - 自认为对自己有价值，希望对你也会有用
findings:
- name: VMPX 抢购实战验证框架有效性
  desc: '[claim] 作者宣称于 5 月 8 日凌晨三点参与 VMPX 抢购并获得正向收益/体验，验证了‘摒弃偏见+框架指导’的实战有效性。'
  excerpt:
  - '5 月 8 号凌晨三点冲 #VMPX 也是因为最近摒弃了一些偏见后的第一次实战，自认为对自己有价值'
- name: 详细复盘内容托管于外部飞书文档
  desc: '[evidence] 素材本身不包含具体的铸造参数、Gas 费策略、收益率数据等复盘细节，所有详细实战数据与步骤均跳转至飞书文档查看。'
  excerpt:
