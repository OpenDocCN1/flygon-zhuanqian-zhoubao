learning_targets:
- 理解生财思维作为普通人逆袭底层操作系统的核心逻辑
- 掌握异常值发现、像素级拆解/逆向工程、像素级模仿、水土不服调整、废号资产化、低成本验证、平台风控窗口期利用、形式可迁移性、复购率指标、方法论资产沉淀等10大核心认知工具
- 能够将生财思维迁移应用至新赛道（如AI虚拟主播、海外Mediabuy、资料整理等），实现跨周期跨赛道复利
- 建立'先跑通、再优化、后放大'的MVP思维范式，用极低成本验证商业闭环可行性
- 识别平台风控红利窗口期特征，制定'快进快出'而非'硬刚平台'的生存策略
