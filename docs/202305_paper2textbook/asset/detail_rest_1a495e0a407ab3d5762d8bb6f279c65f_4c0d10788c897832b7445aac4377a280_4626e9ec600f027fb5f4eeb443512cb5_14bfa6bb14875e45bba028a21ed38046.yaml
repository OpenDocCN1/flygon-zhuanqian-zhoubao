life_analogy:
- 想象你是一名**急诊科医生**，面对满屋子喊疼的病人（用户痛点/标）：
- '- **5 Whys** = 你的**分诊问诊手册**：病人喊''胃疼''，你追问5层发现是''阑尾炎穿孔''(根因/本)，而不是开止痛药(治标)'
- '- **MVP算账** = **黄金抢救时间**：只有2小时(黑客松48h)手术窗口，必须切掉坏死组织(核心功能)，没空做整形美容(非核心功能)'
- '- **用户画像** = **精准输血档案**：血型(公司维度)、过敏史(个人维度)、过往输血记录(互联网偏好)，输错血型(渠道错)直接致死'
- '- **竞品反向** = **研读前人手术录像**：别人切阑尾用单孔腹腔镜(SEO渠道)成功率95%，你非要发明新刀具(盲目创新)，概率极低'
- '- **冷启动vs稳定期** = **急诊抢救 vs 康复理疗**：ICU里只盯命悬一线(跑通闭环)；出ICU后才精细调养(规模化渠道)'
- 就像医生不因'有了达芬奇手术机器人'(技术)就给所有人做手术，开发者也不该因'会写代码'就造产品——**诊断先于手术，问题先于工具**。
summary:
- concept: 工具源于问题而非技术
  desc: 方案不一定是软件，开发前必须锚定真实痛点
- concept: 5 Whys 根因分析
  desc: 连续追问5次将表层痛点(标)转化为可被软件解决的根因(本)
- concept: MVP 算账决策
  desc: 在三重约束下仅做最高优先级功能，跑通闭环优于功能完备
- concept: 用户画像三维模型
  desc: 公司/个人/互联网偏好三维构建，是渠道选择的前置藏宝图
- concept: 竞品反向三步走选渠道
  desc: 找Niche竞品→分析流量渠道占比→匹配自身能力选最优解
- concept: AI+SEO 标题生成方案
  desc: AI提取Topic+SEO高流量数据→AI二次生成兼顾算法与人性的标题
- concept: 冷启动渠道阶段性策略
  desc: 早期求生存(低成本/可控/快见效)；晚期求规模(聚焦Top3高效渠道)
- concept: 营销底层逻辑三问
  desc: 正确受众+正确产品+正确渠道，谁>什么>哪里，强耦合缺一不可
- concept: 问题的标本区分
  desc: 标=用户主观抱怨；本=经分析可系统性解决的核心矛盾；解本治标
- concept: 黑客马拉松实战验证
  desc: 48小时极限压力测试，验证六步法可执行性，产出AI标题生成器Demo
exercises:
- 'no': 1
  title: 练习1：为你的副业项目做一次5 Whys根因手术
  contents:
  - 选定一个你正在做或想做的项目（如：卖AI提示词、做短视频带货、开发小工具）：
  - 1. 写下用户最直观的3个抱怨/痛点（标）
  - 2. 对每个痛点连续追问5次“为什么”，直到找到可被系统/软件/流程直接干预的根因（本）
  - 3. 判断：这个根因是否适合用软件解决？还是服务/文档/社群更优？
  - 4. 基于根因，写出你的MVP核心功能清单（不超过3项）
  - 回答问题：
  - '- 如果不做5 Whys直接按痛点开发，会造出什么‘精美垃圾’？'
  - '- 你的MVP能否在2周内跑通‘问题-方案-用户-价值’闭环？'
- 'no': 2
  title: 练习2：竞品反向渠道复盘实战
  contents:
  - 找到你所在赛道的3-5个头部竞品（要有独立站/公众号/小红书主页等可分析主体）：
  - 1. 用SimilarWeb/Ahrefs/蝉妈妈等工具导出其流量渠道占比（Direct/Organic Search/Social/Referral/Paid等）
  - 2. 制作表格：竞品 | Top 3渠道 | 占比 | 你的团队能力匹配度(1-5分)
  - 3. 圈出‘高占比+高匹配’的渠道作为冷启动主攻方向
  - 4. 写出该渠道的前3周具体执行SOP（如SEO：选词→写文→发布→收录→复盘）
  - 回答问题：
  - '- 为什么竞品强的渠道你不一定能打？举一个‘能力不匹配’的反例'
  - '- 冷启动期为何不能同时铺开Top 5渠道？资源稀释的边际成本怎么算？'
- 'no': 3
  title: 练习3：设计一个'AI+数据'的混合生成Prompt
  contents:
  - 场景：你要为‘小红书避坑指南’类内容批量生成高点击标题：
  - 1. 先人工收集该赛道近期100篇爆款笔记标题，提取高频结构/情绪词/数字/钩子
  - 2. 设计两阶段Prompt：
  - '   - 第一阶段：输入正文 → 输出核心Topic标签（如：#避坑 #省钱 #新手）'
  - '   - 第二阶段：输入Topic标签 + 爆款标题库样本 → 输出10个候选标题'
  - 3. 实测：用3篇历史普通笔记正文跑Prompt，对比生成标题 vs 原标题的预估CTR
  - 回答问题：
  - '- 纯AI生成标题为何常‘正确但平庸’？数据锚定解决了什么问题？'
  - '- 当平台算法更新打击‘标题党’时，你的Prompt规则引擎该如何快速迭代？'
- 'no': 4
  title: 练习4：冷启动vs稳定期渠道动作清单对标
  contents:
  - 以你当前项目为例，填写下表（若未跑通闭环，按预判填写）：
  - '| 阶段 | 核心目标 | 主攻渠道(≤3) | 单周执行动作 | 关键指标 | 停止/转阶段条件 |'
  - '|------|----------|----------------|----------------|----------|------------------|'
  - '| 冷启动 | 跑通闭环 | 1.  2.  3. |  | CAC/转化率/回本周期 | 连续2周单客利润>0 |'
  - '| 稳定期 | 规模化   | 1.  2.  3. |  | ROAS/LTV/获客量 | CAC回升>20%时优化 |'
  - 回答问题：
  - '- 你的项目目前处于哪个阶段？证据是什么？'
  - '- 冷启动期若用‘稳定期’的大额广告/分销渠道，现金流能撑几周？'
