units:
- 'no': 1
  name: 生财航海 —— 新手跨越执行鸿沟的外部约束容器
  points:
  - '**为什么需要这个概念？**'
  - '- 新手加入社群后常陷入“观望-学习-不行动”的小透明陷阱，近一年零收益'
  - '- 认知过剩但执力不足，缺乏强制跑通0-1闭环的外部驱动力'
  - '- 单纯靠自律极难突破舒适区，需要结构化的训练机制'
  - '**核心定义**'
  - '- 生财有术社群内部的目标导向、有期限、有监督、有复盘的集体行动训练营机制'
  - '- 核心四大机制：截止节点、公开承诺、同伴监督、导师点评'
  - '**关键性质**'
  - '- 强制执行：将模糊意愿转化为确定性行动，解决“知道却做不到”'
  - '- 低成本试错：在容错框架内跑通最小商业闭环，赚到第一桶金'
  - '- 标准化产出：沉淀SOP、复盘文档，为后续放大奠定基础'
  - '**典型例子**'
  - '- 毛韩：从2020年入群小透明，经航海训练9月启动行动，月净收益达2万且保持20%月增长'
  - '- 根源：心理咨询师借航海+社群资源，一年从零到年入200万'
  - '**边界条件**'
  - '- 航海仅是催化剂，真正突破源于“开始行动”那一刻的主观决心'
  - '- 仅适用于0-1跑通闭环阶段，不直接解决1-N规模化放大问题'
  - '- 效果强依赖导师质量与同伴圈层，需主动链接高质量贵人'
  - '...'
  sources:
  - paper: docs/202305/20230516_014.md
    role: origin
  - paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
    role: improve
  - paper: docs/202305/20230516_042.md
    role: apply
  excerpts:
  - 从 2020 年加入生财的小透明，到 2021 年 9 月份开始行动，再到如今跑通一个项目，并每月净收益约 2w 块。而且每月还保持着近 20%的增长率
  - 如何借助小航海赚到第一笔钱？
  - 借助本次小航海的时机，写下这篇文章是我对这段经历的复盘
  - 因为生财有术大量的好文章，大量对的人，让我这一年少走了很多弯路，这一年来也有一些不错的思路、做法、以及成绩。
  - 9 年传统行业 1 年时间，从一无所有，到年入 200 万
- 'no': 2
  name: 精华帖逆向拆解法 —— 带着问题去“偷”成熟模块
  points:
  - '**为什么需要这个概念？**'
  - '- 新手盲目阅读大量精华帖，陷入“收藏夹吃灰、低水平勤奋”陷阱'
  - '- 缺乏结构化拆解框架，无法将他人经验转化为可复用的行动模块'
  - '- 需要一种“以战代练”的学习范式，直接对接当前项目卡点'
  - '**核心定义**'
  - '- 将商业项目拆解为“流量-产品-变现”三大核心模块'
  - '- 带着“当前项目卡点”去精华帖中寻找同类项目的关键动作、避坑指南、资源清单'
  - '- 像搭积木一样组合模块，快速生成新项目雏形'
  - '**关键性质**'
  - '- 模块化复用：一篇帖子拆解得3个模块，N篇得3N模块，新项目即为模块重组'
  - '- 流量形态三分类：关键词流量、关系链流量、算法推荐流量，掌握一类举一反三'
  - '- 目的导向：不为学习而学习，为解决当下卡点而拆解'
  - '**典型例子**'
  - '- 毛韩拆解“外卖差评删除+小红书SEO”帖子，得流量模块(SEO)、产品模块(差评删服务)、变现模块(服务费/软件费)'
  - '- 随后迁移至抖音SEO、快手SEO、微信搜一搜、知乎等同形态平台垄断流量'
  - '**边界条件**'
  - '- 前提是已有具体项目或明确卡点，无项目带着拆解易陷入“伪勤奋”'
  - '- 模块拆解质量取决于精华帖源头真实性，需甄别幸存者偏差'
  - '- 仅解决“知什么”，不解决“怎么做”的执行细节，需结合SOP落地'
  - '...'
  sources:
  - paper: docs/202305/20230516_014.md
    role: origin
  - paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
    role: improve
  excerpts:
  - 阅读精华帖的目的是什么？
  - 既然每个项目都符合这个模型，那么如何引流、如何搭建产品、如何设置变现方式其实就是最基本的武器。
  - 当我们拆解完两篇帖子后，会得到共计 6 个模块。当我们要去做其他项目时，其实只需要把这几个模块拼在一起，就能得到一个新的模式。
  - 它们分别属于不同的三种形式：1. 关键词——通过关键词链接到用户。2. 关系链——通过关系链链接到用户。3. 算法推荐——让算法将自己推荐给目标用户。
- 'no': 3
  name: 新手项目筛选模型 —— 筛选匹配度而非挑选优质项目
  points:
  - '**为什么需要这个概念？**'
  - '- 新手盲目套用大佬“挑选”标准（市场大、上限高），导致无项目可做'
  - '- 缺乏量化决策工具，凭感觉选项目，易陷入资源不匹配、执行难度超载'
  - '- 需要一套基于个人能力资源边界的动态筛选决策模型'
  - '**核心定义**'
  - '- 含近20项参数（风险、收益、附加价值、市场、能力、时间、成本、个人匹配度等）的决策表格'
  - '- 核心逻辑：新手决策模式为“筛选匹配度”而非大佬的“挑选优质”'
  - '- 四步筛选法：筛原则红线 → 筛能力硬约束 → 筛收益反馈周期 → 筛市场周期渗透'
  - '**关键性质**'
  - '- 动态可调：参数权重可根据个人认知修改，支持飞书多维表格在线复制使用'
  - '- 红线否决制：违法、违规、违背价值观等一票否决'
  - '- 匹配度优先：一个匹配度高的小项目优于匹配度低的大项目'
  - '**典型例子**'
  - '- 毛韩初始条件(周期10年/成本<1万/时间<2h/无资源需求/月内见款)匹配0项目'
  - '- 仅将“持续周期”放宽至1年，即匹配出“小红书资料引流”、“闲鱼无货源”等可执行项目'
  - '- 工具化交付：飞书多维表格支持“创建副本”自用、修改参数、新增维度'
  - '**边界条件**'
  - '- 模型参数基于个人主观认知，存在认知盲区导致误判风险'
  - '- 无法预测黑天鹅事件(平台政策突变、供应链断裂)对项目存活的影响'
  - '- 筛选只是概率提升，不等于必然成功，仍需MVP验证'
  - '...'
  sources:
  - paper: docs/202305/20230516_014.md
    role: origin
  - paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
    role: improve
  excerpts:
  - 如何筛选要报名哪个航海项目？
  - 老师们判断项目的标准其实和新手不太一样...我们新手更应该关注自己的能力和资源和项目是否匹配。
  - 模型很简单，其实只是一系列参数组成的表格，目前覆盖了近 20 项参数。
  - 用电脑打开筛选模型：https://wchekk4hs9.feishu.cn/base/TpsBbwxhYaplTWsUGmpc6k6QnXc
  - 如果一个项目都没有过滤到，那么你需要考虑三个问题...
- 'no': 4
  name: 最小可行性行动启动法 —— 在行动中修正认知
  points:
  - '**为什么需要这个概念？**'
  - '- 新手陷入“完美主义拖延”：想把账号养好再发、想把SOP写全再干'
  - '- 缺乏低成本验证闭环的行动范式，导致迟迟无法获得市场真实反馈'
  - '- 需要一种“先跑通、再优化、后放大”的最小行动闭环'
  - '**核心定义**'
  - '- 克服完美主义拖延：注册账号→发布内容→无流量想获流→有流无转化优转化'
  - '- 遇阻即用福格行为模型(B=MAP)诊断：动机(是否想做)、能力(是否太难/不会)、触发(是否忘记/无提醒)'
  - '- 外包/工具/提醒对症下药，最小成本跑通商业闭环'
  - '**关键性质**'
  - '- 行动先于认知：认知突破的本质是在行动中获得反馈修正认知'
  - '- 低成本试错：电销首日打13通成交1单，前期外包同行单价50元赚首笔200+'
  - '- 正向飞轮：有反馈才有动力，有动力才有行动，形成正向循环'
  - '**典型例子**'
  - '- 外卖差评删除项目：电销3天跑通 → 外包同行 → 自购软件月入2000 → 全职电销月入1万 → 引入小红书SEO月入1.8万→2.25万'
  - '- 小红书账号仅1个、近7天发2篇笔记，却占据搜索Top20中5席，日均引流5+商家'
  - '**边界条件**'
  - '- 仅适用于低边际成本、可快速迭代的轻资产项目(虚拟服务、内容引流等)'
  - '- 重资产、长周期、强合规项目(实体店、医疗、金融)不适用'
  - '- 福格模型诊断依赖自我觉察力弱者易误判卡点性质'
  - '...'
  sources:
  - paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
    role: origin
  - paper: docs/202305/20230516_014.md
    role: apply
  excerpts:
  - 比如你要做淘宝蓝海，别管其他的，先注册个店铺、随便上传个商品；
  - 然后你会发现，怎么没流量呢？接下来就是想办法获取流量； 之后会发现，怎么有浏览但没转化呢？那就想办法优化转化率
  - 简单点讲，福格行为模型=动机 x 能力 x 触发物。当你遇到挫折、或者行为与预期不符的情况时，可以通过这个模型来分析一下自己为什么没做到。
  - 第一天我打 13 个电话，就有一个商家表示要合作...第二天我打约 50 个电话，有 2 个商家表示要合作...第三天...加了 20 个好友，有 1 个商家咨询的。
- 'no': 5
  name: 项目增长模型与业务迁移五维路径 —— 从极值化到第二增长曲线
  points:
  - '**为什么需要这个概念？**'
  - '- 跨通0-1后，面临“如何放大”的困境：盲目加人、砸钱投流、乱开品类'
  - '- 缺乏量化拆解业务指标的工具，无法精准定位增长瓶颈环节'
  - '- 单一项目天花板有限，需利用已积累资产开辟第二增长曲线'
  - '**核心定义**'
  - '- 增长模型：将商业项目用乘法公式代表(如收益=客单价×支付率×咨询率×添加率×触达率×私信率×阅读量)，层层拆解至可操作变量'
  - '- 业务迁移五维路径：同用户上下游延伸、异用户同业务复制、变卖流量(广告)、卖影响力(加盟/代理)、卖模式(培训)'
  - '**关键性质**'
  - '- 两步走放大论：第一步现有框架内推极值(矩阵、投放、流程优化)；第二步利用资产迁移开新曲线'
  - '- 指标拆解可递归：阅读量可继续拆解为推荐量+关键词流量×点击率×覆盖词数×帖子数×账号数×人数'
  - '- 积累复利>现金流：早期优化积累价值(技能、资源、人脉、杠杆产品)，积累具有跨周期迁移性'
  - '**典型例子**'
  - '- 外卖差评项目：优化私信回复速度提升添加率、矩阵号增加账号数提升源头流量'
  - '- 积累3万+外卖商家私域流量、200+合作客户，规划扩展外卖运营、电商差评等上下游业务'
  - '- 打螺丝换项目=换厂打螺丝(纯现金流无积累) vs 技术员换项目=技能迁移(积累复利)'
  - '**边界条件**'
  - '- 增长模型假设变量相对独立，实际存在强耦合(如提高客单价可能降低支付率)'
  - '- 业务迁移需核心资产可复用(流量可迁移、产品可标准化)，强人身依附业务难迁移'
  - '- 第二增长曲线启动时机难把握：过早分心、过晚错失窗口'
  - '...'
  sources:
  - paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
    role: origin
  - paper: docs/202305/20230516_014.md
    role: apply
  excerpts:
  - 通常情况下，一个项目有两种放大方法：1. 业务本身... 2. 其他业务...
  - 放大一个项目业务本身的收益，就是将每一个环节的转化率都提到最高，同时将最源头的流量提到最高即可。
  - 阅读量 = 推荐阅读量 + 单个关键词流量 x 点击率 x 单篇帖子覆盖关键词数量 x 单账号帖子数量 x 人均账号数 x 客服人数
  - 我总结出以下几个方式：1. 业务迁移：针对同一类型用户增加上下游其他业务... 2. 针对不同类型用户做同样业务... 3. 变卖流量... 4. 卖影响力...
    5. 培训...
  - 积累能让我步入下一个阶层，但收益不能。钱只能判断我现在有钱，积累才是让我未来更加值钱的。
- 'no': 6
  name: 公域陌生流量私域化闭环 —— 用销售套路做引流
  points:
  - '**为什么需要这个概念？**'
  - '- 传统运营过度依赖熟人裂变(朋友圈/社群)，忽视公域平台巨大增量红利'
  - '- 公域引流常陷入“有流量无流程、无法转化”困境，缺乏标准化成交SOP'
  - '- 需要将成熟销售话术体系移植到引流环节，实现陌生流量高转化'
  - '**核心定义**'
  - '- 在闲鱼等公域平台通过SEO霸屏、多账号矩阵获取精准搜索流量'
  - '- 引入“天龙八部”销售话术(聆听、探询、产品介绍、支持、举证、解说、反引、成交)标准化承接'
  - '- 价格锚定筛选：双价制(礼品卡价vs战队价)劝退比价党，聚焦高意向用户'
  - '**关键性质**'
  - '- 精准搜索流量>泛推荐流量：搜索“生财礼品卡”用户已处决策期，转化效率极高'
  - '- 拉新本质是销售非营销：1v1深度沟通解决疑虑、匹配需求、提供确定性陪伴'
  - '- 个人实战积累是最高级销售素材：过往项目经验是解答疑虑、建立权威的核心杠杆'
  - '**典型例子**'
  - '- 小怪兽418拉新实战：7天咨询300+ → 加微81人(27%) → 成交41单(微信转化50.6%)，平均2.6小时成交'
  - '- 电话沟通显著优于文字：语气判断意向、主导节奏、快速建立信任'
  - '- 隐形资产促单：展示龙珠持有量、航海推荐笔记、实战课程赠送，精准击中痛点'
  - '**边界条件**'
  - '- 依赖平台搜索规则稳定性，算法调整可能导致流量断崖式下跌'
  - '- 高强度1v1沟通难规模化，需后续标准化话术、引入助理分流'
  - '- 价格锚定溢价能力取决于差异化服务真实价值(战队陪伴、IP背书、赠课)'
  - '...'
  sources:
  - paper: docs/202305/20230516_015.md
    role: origin
  - paper: docs/202305/E0aFdosjUobxU7xEQeCc7y8snyb.md
    role: improve
  excerpts:
  - 我通过在咸鱼上做 SEO，霸屏，多账户上架引流拉新，我用销售产品的套路，引道私域进行闭环成交。
  - 时间跨度：7 天 闲鱼咨询量：300+（多号操作未去重） 转换微信好友数量：81 个【27%加微信转换】 成功转换成交数量：41 个【50.6%微信好友转换】
    最短成交时间：15 分钟 平均成交时间：2.6 小时
  - 我把销售的天龙八部，聆听，探询，产品介绍，支持，举证，解说，反引，成交 选取部分适合我的内容整理实操
  - 宝，礼品卡 XXX，战队渠道 1965，宝我更建议你选 1965
  - 项目千万变，销售逻辑不会变
- 'no': 7
  name: 盖洛普才干主题商业化应用 —— 知其为、知何不可为、知如何做得更好
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人不了解天赋主题，导致“优势没发挥、阴暗面拉满”、选错赛道、内耗严重'
  - '- 缺乏基于才干的场景化决策框架，无法在商业场景中精准启动优势、压制劣势'
  - '- 需要一套可操作的“才干-场景-SOP”映射体系'
  - '**核心定义**'
  - '- CliftonStrengths 34项才干主题(影响力、执行力、战略思维、关系建立)作为自我认知与商业决策底层操作系统'
  - '- 核心主张：知其为(知道才干名)、知其所以为(知原理)、知何不可为(知阴暗面)、知如何做得更好(知开发路径)'
  - '- 才干阴暗面与正向开发：统率变霸道→克制为领导力；取悦变虚伪→开发为共情力'
  - '**关键性质**'
  - '- 场景化组合拳：销售场启动个别/统率/取悦/成就；主业启动沟通/永远解释原则；社群启动统率立规/影响力批量转化'
  - '- 正反馈驱动人生：只在才干获持续正反馈场景(医生/销售/顾问)长久发挥，强行进克制场景双输'
  - '- 时间管理三阶段：切块时间(加法/累) → 砍非盈利/外包(减法) → 资源置换协同(乘法/网格化) → 筛选客户圈子(护情绪)'
  - '**典型例子**'
  - '- 梁靠谱：体制内医生→年入百万副业IP/生财拉新冠军，团队创造历史最佳拉新成绩'
  - '- 独创成交五步法(建立联系→同步信息→挖掘需求Why+反问→解决顾虑→达成成交)成交七位数订单，圈友复制当年买房'
  - '- 用户情绪三步法(描述感受启动理性脑→定位成因→给目标引导行动)适用大人小孩/客服/亲密关系'
  - '**边界条件**'
  - '- 才干测试工具需付费(CliftonStrengths官方约$50)，存在获取门槛'
  - '- 才干开发需长期刻意练习(如沟通才干从惜字如金转永远解释原则)，非速成'
  - '- 高影响力低和谐人群特有生存法则(认账、边界感、提升实力降低心气)，不具备普适性'
  - '...'
