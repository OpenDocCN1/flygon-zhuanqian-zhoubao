paper: docs/202305/20230516_045.md
desc: 该素材系统阐述了一套针对A股市场的“择时+选品”投资方法论。核心主张是：择时应基于“股债性价比”这一单一关键因子（辅以技术分析），而非猜测或宏观数据；选品应遵循“好公司、好经理、好体系”三标准，核心战术为“只买小规模（<50亿）主动权益基金”。作者依据十年实盘复盘（逃顶2015/2018/2021，抄底2015/2018/2019），区分了系统性与结构性行情，提出水平有限者宜等系统性底部大举买入，其余时间小仓位参与。
concepts:
- name: 股债性价比
  desc: 素材核心择时指标，定义为指数PE倒数与十年国债收益率之比（沪深300股债性价比 = (1/沪深300 PE) / 十年国债收益率），长期在1.5-3.0区间波动，>3.0为买入区，<1.5为卖出区，体现股票相对于债券的风险溢价合理性。
  is_original: false
  excerpt:
  - 关键因子只有一项：股债性价比
  - 股债性价比=指数 PE 倒数/十年国债收益率
  - 沪深 300 股债性价比= （1/沪深 300 PE）/十年国债收益率
  - 沪深 300 股债性价比长期在 1.5-3.0 之间运行。
  - 该项指标是有理论支撑的——股票相比债券有风险溢价。
- name: 系统性顶底与结构性顶底
  desc: 基于四大风格象限（大盘成长/价值、小盘成长/价值）估值一致性判断的市场状态分类。系统性底部指四风格估值均处历史低位（如2012年底、2019年初），买什么都赚；系统性顶部指四风格均高估（如2015年6月、2018年2月），需清仓；结构性底部/顶部指风格估值分化（如2016年大盘便宜小盘贵，2021年3月大盘成长贵价值便宜），仅适合高水平投资者参与。
  is_original: true
  excerpt:
  - 2012 年底是一次典型的系统性底部——所有股票都很便宜。
  - 2015 年 6 月，是一个典型的系统性顶部——所有股票都很贵。
  - 2016 年 3 月份，则属于一个结构性底部——大盘股估值已经非常便宜，但小盘股估值仍然偏贵。
  - 2021 年 3 月份比较难判断...大盘成长股估值很高，价值股、小盘股估值很便宜，市场是撕裂的。
  - 目前我们还和 2016 年类似，处在一个结构性的底部。
- name: 三好选基标准
  desc: 构建优质基金组合的筛选框架：好公司（规模大、高管出身投研、梯队完善、价值观长期主义）、好经理（长期业绩居前、投决委成员、金牛奖得主）、好体系（核心原则：只买小规模基金，拒绝>50亿，最好<20亿，利用规模优势获取换仓灵活性、打新收益及迷你股机会）。
  is_original: true
  excerpt:
  - 构建优质的基金组合，我推崇“三好”标准——好公司、好经理、好体系
  - 我所认为的顶级基金公司是什么样？...1. 剔除货币基金后的管理规模大 2. 公司高管是高水平基金经理出身...
  - 最简单粗暴的——选择长期业绩居前的基金经理...看基金经理是否是公司投资决策委员会成员...金牛奖数量。
  - 投资权益类基金，只需做到一步，就领先了别人大半个身位——只买小规模基金。
  - 我的原则，是不买超过 50 亿规模的基金，最好是 20 亿以下的。
- name: 非关键因素（择时干扰项）
  desc: 作者归纳的三类应被忽略的择时干扰因素：1. 突发性事件/地缘政治/外盘波动（事后调整性价比太低）；2. 财政/货币政策及宏观数据（仅影响日内，远期影响已体现在十年国债收益率）；3.
    投资者情绪观察（样本小、无法定量、成功率无保障）。
  is_original: true
  excerpt:
  - 非关键因素包括三类：
  - ①突发性事件（如疫情）、地缘政治、外盘（港美股）波动 仅影响短期的行情，事件一发生，股市就已经跌了一大半，此时再做仓位调整，性价比太低
  - ②财政政策、中期货币政策（如 LPR、MLF）、宏观经济数据（M2、社融数据） 这类因素，可能仅能影响大盘日内的走势，直接忽略。远期的影响，已经体现在十年国债收益率里
  - ③投资者情绪观察（如周边人讨论股票的人数、xueqiu/股吧评论内容） 样本太小、无法定量分析，也没办法保证很高的成功率，应该忽略
methods:
- name: __overview__
  desc: A股投资双轮驱动方法论：择时端采用“单一关键因子（股债性价比）+ 技术分析辅助判断拐点 + 系统性/结构性行情识别”模型；选品端采用“三好标准（好公司/好经理/好体系）+
    小规模铁律（<50亿）”筛选体系。执行策略为：水平有限者仅在系统性底部（股债性价比>3.0且四风格均便宜）重仓，其余时间小仓位或空仓。
  excerpt:
  - 择时的周期必然是比较长的。几年才会遇上一次调整仓位的机会。
  - 结合技术分析的判断，股票性价比低的时候跌破趋势，就有很强的指导意义。
  - 我们不光要看沪深 300 股债性价比，也要看大盘成长/大盘价值/小盘成长/小盘价值四风格象限的估值，才能比较精准地把握结构性行情。
  - 如果是水平有限（历史年化低于 25%）的投资者，不妨等 A 股系统性底部时，再大举买入，其余时间只值得小仓位参与。
  - 构建优质的基金组合，我推崇“三好”标准——好公司、好经理、好体系
- name: 股债性价比择时模型
  desc: 核心择时执行模型：计算沪深300股债性价比 = (1/PE_TTM) / 十年国债收益率。阈值设定：>3.0 为极度低估（买入/重仓区），1.5-3.0
    为常态波动区，<1.5 为极度高估（卖出/清仓区）。辅助规则：当指标处于低位区（接近1.5）且价格跌破长周期均线（趋势支撑失效）时，确认顶部信号执行清仓；指标处于高位区（>3.0）时结合系统性底部特征（四风格估值均低）建仓。
  excerpt:
  - 沪深 300 股债性价比长期在 1.5-3.0 之间运行。
  - 过去十几年，如果在该指标 3.0 附近买入股票/基金，在 1.5 附近卖出，你就是大赢家
  - A 股有在股债性价比 1.5 的时候拐头向下，也有时候是 1.6、1.7。顶部的股债性价比具体数据，我们没有办法提前预知。
  - 结合技术分析的判断，股票性价比低的时候跌破趋势，就有很强的指导意义。
- name: 基金筛选三步走法
  desc: 选品执行流程：Step1 筛选头部基金公司（六大维度：管规模、高管背景、人才梯队、口碑、价值观、经理收入）；Step2 公司内部筛选好经理（三硬指标：长期业绩排名、投决委成员身份、金牛奖数量）；Step3
    好体系过滤（核心否决权：规模>50亿一律否决，最优<20亿，利用小规模优势获取超额收益）。
  excerpt:
  - 一、好公司...1. 剔除货币基金后的管理规模大 2. 公司高管是高水平基金经理出身 3. 老中青各代，优秀经理层出不穷 4. 口碑好、负面新闻少 5. 公司价值观偏向于长期投资
    6. 基金经理收入高
  - 二、好经理...最简单粗暴的——选择长期业绩居前的基金经理...① 看基金经理是否是公司投资决策委员会成员...② 金牛奖数量。
  - 三、好体系...投资权益类基金，只需做到一步，就领先了别人大半个身位——只买小规模基金。
  - 我的原则，是不买超过 50 亿规模的基金，最好是 20 亿以下的。
theorems:
- name: 择时本质论：择时非预测，乃大类资产性价比轮动
  desc: 择时的本质不是猜测顶底或赌博，而是基于股票与债券的长期风险溢价逻辑，通过股债性价比这一核心指标，在极端估值区间进行大类资产配置轮动。周期长、频次低，追求长期复利而非短期博弈。
  excerpt:
  - 要保持高的择时胜率，得先弄明白：我们做的不是猜测、赌博，而是基于资产的性价比，做大类资产轮动。
  - 所以，择时的周期必然是比较长的。几年才会遇上一次调整仓位的机会。
  - 该项指标是有理论支撑的——股票相比债券有风险溢价。美国过去 200 年的经验，股票的年化收益，就是长期债券的 2 倍左右。
- name: 宏观数据无效论：远期宏观影响已定价于无风险利率
  desc: 财政政策、中期货币政策、M2/社融等宏观数据，仅影响日内走势，对中长期择时无效，因为其远期影响已完全体现在十年国债收益率（无风险利率）中，股债性价比分母已隐含该信息。
  excerpt:
  - ②财政政策、中期货币政策（如 LPR、MLF）、宏观经济数据（M2、社融数据） 这类因素，可能仅能影响大盘日内的走势，直接忽略。远期的影响，已经体现在十年国债收益率里
- name: 技术分析辅助定位论：技术指标仅用于高位拐点确认
  desc: 技术分析（均线趋势）在非完全有效市场中仅作为辅助工具，核心作用是估值已达极端区域（股债性价比接近1.5）时，确认趋势反转（跌破支撑）的时点，解决“具体拐点数值不可知”的问题。
  excerpt:
  - 技术分析，主要是在高位，判断拐点时候用的。
  - A 股有在股债性价比 1.5 的时候拐头向下，也有时候是 1.6、1.7。顶部的股债性价比具体数据，我们没有办法提前预知。
  - 结合技术分析的判断，股票性价比低的时候跌破趋势，就有很强的指导意义。
- name: 小规模基金超额收益源泉论
  desc: 小规模基金（<50亿，最优<20亿）具备结构性优势：1. 换仓摩擦成本低；2. 享受打新股超额收益；3. 可参与流动性差的迷你股交易。基金规模扩大后必然面临收益递减（容量约束），买入大规模基金无法复制历史高收益。
  excerpt:
  - 规模越小的基金，基金经理在交易换仓的时候，摩擦成本越小。小规模的基金还有额外的打新股超额收益。也能参与一些迷你股的交易。
  - 理想的权益类基金，就是优秀基金经理管理的小规模产品。
  - 我们在它大放异彩、规模迅速扩大的时候买入，必定没办法取得和以前一样的业绩。
- name: 普通投资者生存法则：仅参与系统性行情
  desc: 对于历史年化低于25%的投资者，结构性行情（风格分化）极难把握，且选品若非市场热点极易跑输基准。最优策略：仅在系统性底部（股债性价比>3.0且四风格全便宜）重仓买入宽基或优质主动基金，其余时间（结构性底部、震荡市、顶部区域）保持小仓位或空仓，以博取确定性最高的系统性贝塔收益。
  excerpt:
  - 我认为，如果是水平有限（历史年化低于 25%）的投资者，不妨等 A 股系统性底部时，再大举买入，其余时间只值得小仓位参与。
  - 就算是抓准了结构性底部，股票或者基金没买到市场热点，很有可能也会跑输私募 xueqiu 产品，甚至保本理财产品。
findings:
- name: 作者十年实盘择时复盘战绩
  desc: '[claim] 作者宣称依靠该体系在2015年6月、2018年2月、2021年2-3月成功逃顶，2015年9月、2018年底再次入场，2021年3月切换赛道，择时准确率100%，连续十年正收益。'
  excerpt:
  - 依靠一套稳定的择时交易体系，我在 2015 年 6 月、2018 年 2 月、2021 年 2-3 月份成功逃顶，并于 2015 年 9 月、2018 年底再次进入市场。2021
    年 3 月切换赛道。到目前为止，我择时的准确率是 100%。
  - CFA 持证人，2013 年入市 A 股投资，连续十年取得正收益。
- name: 股债性价比历史有效性回测
  desc: '[evidence] 素材引用图表数据显示：过去十几年，沪深300股债性价比在3.0附近买入、1.5附近卖出，可获得显著超额收益，指标长期在1.5-3.0区间运行符合股债风险溢价逻辑（美股200年股票收益约为债券2倍）。'
  excerpt:
  - 过去十几年，如果在该指标 3.0 附近买入股票/基金，在 1.5 附近卖出，你就是大赢家
  - 沪深 300 股债性价比长期在 1.5-3.0 之间运行。
  - 美国过去 200 年的经验，股票的年化收益，就是长期债券的 2 倍左右。
- name: 历史关键节点系统性/结构性特征验证
  desc: '[evidence] 素材列举2012底、2015顶、2016结构性底、2018顶、2019底、2021撕裂、2022结构性底等节点，验证四风格估值一致性判断与股债性价比指标的配合有效性：系统性底部（全便宜）胜率极高，系统性顶部（全贵+利率高）清仓有效，结构性行情仅适合专业选手。'
  excerpt:
  - 2012 年底是一次典型的系统性底部——所有股票都很便宜...不管买什么类型的基金，大概率都能赚大钱。
  - 2015 年 6 月，是一个典型的系统性顶部——所有股票都很贵...指数跌破趋势的话，清仓是最好的办法。
  - 2016 年 3 月份，则属于一个结构性底部...2016-2017 年是属于大盘股的行情，与小盘股无缘。
  - 2018 年 2 月份又是一个系统性的顶部，所有股票都不便宜、市场利率还很高！（十年国债收益率突破 4%）
  - 2022 年 4 月和 10 月，沪深 300 股债性价比再一次达到 3.0 以上。但这回...局部高估的是大盘成长股。所以，目前我们还和 2016 年类似，处在一个结构性的底部。
- name: 头部基金公司分层观察
  desc: '[claim] 作者基于行业观察将大型基金公司分为“强”（景顺、易方达、富国、中欧、交银施罗德、华安）与“大而不强”（华夏、南方、博时、广发、汇添富、鹏华、天弹）两类，判断依据为六大维度定性评估。'
  excerpt:
  - 大规模基金公司里，给我留下好印象的公司有：景顺长城、易方达、富国、中欧、交银施罗德、华安
  - 大而不强，有规模没质量的公司：华夏、南方、博时、广发、汇添富、鹏华、天弘
- name: 投决委成员与金牛奖作为经理筛选硬指标的有效性
  desc: '[claim] 作者主张投决委成员代表公司核心投研决策层，水平必然较高；金牛奖评选客观公正、考虑波动率，能有效筛掉短期赌风格、高波动经理（如蔡嵩松无金牛奖），多座金牛奖得主为业内大腕。'
  excerpt:
  - 【投决会】成员，就是公司的大佬们，可以对其他基金经理的操作进行审查、指导，投资水平必然是比较高的。
  - 得过金牛奖的基金经理至少水平都不差。多座金牛奖得主，都是业内大腕。
  - 短期赌风格、净值波动大的经理，比如蔡嵩松，就拿不到金牛奖。
