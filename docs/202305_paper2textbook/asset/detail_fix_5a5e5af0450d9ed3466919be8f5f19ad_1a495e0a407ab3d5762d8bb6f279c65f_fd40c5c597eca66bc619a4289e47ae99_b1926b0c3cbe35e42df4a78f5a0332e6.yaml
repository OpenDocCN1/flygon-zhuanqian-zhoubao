life_analogy:
- 想象视频号挂车投流是一场**精密的‘自动售货机生意’**：
- '- **选品** = 选进货渠道、毛利>70%、自带流量的‘爆款零食’（高客单高利润）'
- '- **素材** = 贴在售货机上的‘高点击海报’（素材搬运去重SOP）'
- '- **1测** = 先摆1台机器投1000元测7天，卖不出去立马撤（验品止损）'
- '- **2测** = 能卖出去再加机器、调货道、测最佳补货价格（探价锁定参数）'
- '- **赔付机制** = 场地方承诺：‘机器摆满月没卖出，房租退一半’（平台兜底空消耗）'
- '- **关停公式** = 自己定规矩：‘单机日亏超利润1/3，立马撤机’（自律止损）'
- '- **矩阵组织** = 雇3个伙计每人管5台机，专人负责调价、看数据（3组1投手）'
- 就像连锁便利店用标准化SOP复制盈利模型，投流也要用‘品素决定论’和‘数据信仰’把赚钱变成工程。
summary:
- concept: 短视频挂车投流
  desc: 视频号带货最稳定模式：付费买量+算ROI+优化素材，具备稳定、可复制、可放大、不废号四大优势
- concept: 品素决定论(70/30)
  desc: 选品与素材决定70%+成败，投放技巧仅占30%，90%问题根因指向品与素材
- concept: 高客单选品标准
  desc: 利润率>70%、新奇特高溢价、排除黑五类功效品，SKU套装化(多件装+高低价排序)提升客单
- concept: 双阶段测品法
  desc: 1测(1000豆/6h)验品仅看能否出单；2测(2000豆/阶梯出价)探价锁定最优流速出价
- concept: 视频号赔付机制
  desc: 达标(6赞/6关注/6单→4单)后空消耗平台返还，高客单大额放量‘不太会亏钱’的安全气囊
- concept: 关停止损公式
  desc: 利润>100元按利润1/4-5元止损，<100元按利润1/3-5元止损，用关停空消耗提高整体ROI
- concept: 投放黄金时间窗
  desc: 测品上午9点前，放量晚12点建12h计划或凌晨4点建计划，匹配中老年用户活跃规律
- concept: 异常诊断决策树
  desc: 不过审查品/素材/营销；不消耗查重合度/竞争力/时段/出价/SKU；转化异常四象限对症换素材/降价/涨价
- concept: 矩阵化组织架构
  desc: 3-6人小组+人均5机15号+专职投手(3:1)，核心KPI=日测品数，头部日测70-100品
- concept: 物理隔离与执行力
  desc: 一机一号一网络规避关联，红米Note11T标配+贴纸标记+台账管理，长期主义执行力是核心护城河
- concept: 供应链熔断与体验分
  desc: 48h发货红线+多店铺备选+即时催单+动态切换，体验分<4.2分不合作、<4分隐形下架，偏远地区设不发货
exercises:
- 'no': 1
  title: 实战推演：新品测品全流程决策
  contents:
  - 场景：你选定一款利润率75%、客单价120元的家居新奇特产品，准备了3条不同风格的去重素材（好物分享/场景测评/痛点科普）。请设计完整的1测→2测→放量执行方案：
  - 1. 1测阶段：预算分配、出价设定、定向选择、判定通过/淘汰标准
  - 2. 1测跑出：素材A出单3单ROI1.5，素材B出单0单，素材C出单1单ROI0.8。如何决策？
  - 3. 2测阶段：针对通过素材如何搭建计划组（数量/出价阶梯/预算）？核心验证指标是什么？
  - 4. 2测结果：最优出价800时日消耗2000、ROI1.9，出价750时日消耗500、ROI2.2。放量期选哪个出价？为什么？
  - 5. 放量期：该品利润120元>100元，采用赔付策略还是关停策略？关停阈值如何计算？
- 'no': 2
  title: 异常诊断实战：计划不消耗/转化异常排查
  contents:
  - 某高客单产品（利润150元）进入放量期，搭建大额计划(出价800/日预算5000)，运行4小时后出现以下异常，请按决策树逐步排查并给出处理动作：
  - 异常1：计划显示‘审核通过’但消耗为0，展现量<100。
  - 异常2：消耗正常(已花2000)，但0单，点击率0.8%（行业均值1.5%），转化率0%。
  - 异常3：消耗3000，出单5单，但ROI仅1.1(目标1.8)，点击率2.0%，转化率1.2%。
  - 要求：对每个异常列出排查优先级(1/2/3...)、核心定性判断、具体执行动作(换素材/换品/改出价/加SKU/关停等)。
- 'no': 3
  title: 团队组建与规模化测算
  contents:
  - 你打算组建一个视频号投流团队，目标日测品数50个，单品需测3条素材(1测) + 5条计划(2测)。
  - 1. 按‘3-6人一组，人均5台手机15号，3组配1投手’标准，需要招聘多少执行人员、投手？需采购多少手机？预估硬件成本(红米Note 11T 1700元/台)？
  - 2. 若单人日均操作上限为‘发20条视频+上架5链接+催发货20单’，执行组人数是否合理？瓶颈在哪？
  - 3. 供应链端：爆发期要求48h发货，单日爆单200单时，客服催单频次、备选供应商数量、熔断触发条件如何设定？
  - 4. 账号管理：20+账号矩阵下，如何设计‘账号编号体系+物理标记+数字化台账’防止混乱？
- 'no': 4
  title: 账号合规与隔离实操
  contents:
  - 场景：团队持有5张身份证，每证开5号，计划运营25个账号矩阵。
  - 1. 设计账号编号体系(A1-E5)，明确主号/子号授权关系与资金归集路径。
  - 2. 硬件采购清单：红米Note 11T 5台(主力)+备用2台，如何配置双开/多开实现1机10号？
  - 3. 物理隔离执行标准：一机一号一网络(或严格多开隔离)，WiFi/数据流量如何分配？
  - 4. 台账管理：设计Excel台账字段(编号/手机/号/密码/绑卡/状态/保号日期)，保号周期与话术如何制定？
units:
- 'no': 1
  name: 短视频挂车投流 —— 让带货拥有“可复制的钱生钱模型”
  points:
  - '**为什么需要这个概念？**'
  - '- 自然流玩法极其不稳定，作者实测连续十几个账号被限流，账号资产极易报废'
  - '- 免费流量依赖算法推荐，不可控、不可复制、难放大，新手极难跑通0-1'
  - '- 需要一套‘花钱买流量、算ROI、优化素材’的标准化闭环，实现确定性收益'
  - '**核心定义**'
  - '- 核心模式：制作/搬运短视频挂载商品链接（挂车） -> 付费投放（微信豆/视频号推广）获取流量 -> 转化带货变现'
  - '- 本质属性：付费广告投放模式（钱生钱），需真金白银垫资测品，资金量决定收益上限'
  - '- 核心优势：稳定、可复制、可放大、不废号（账号权重长期沉淀），穿越平台周期的‘终极赛道’'
  - '**关键性质**'
  - '- 品素决定论（70/30法则）：选品与素材贡献度>70%，投放技巧<30%，90%问题根因指向品与素材'
  - '- 数据信仰原则：不相信感觉，只相信数据；测品不达标果断Pass或换素材，严禁主观执念'
  - '- 门槛提升红利论：平台收紧政策（0粉挂车取消、投放门槛提高、赔付标准调整）实为利好，清洗无序竞争者，护城河加深'
  - '- 分层操盘逻辑：高客单走‘大额+卡赔付’（不关停、靠平台兜底）；低客单走‘小额叠投+勤关停’（执行止损公式）'
  - '**典型例子**'
  - '- 新号冷启动曲线：3月注册新号，首月测品磨合销售3万+，遭遇315流量波动，大促后稳定日销2000+，次月放量单月销售8万+，净利30%，ROI稳定1.8-2.0'
  - '- 头部团队规模基准：月利润超100万团队不少于10个，日测品量70-100个，验证‘测品量=爆品量=收益上限’'
  - '- 低客单价突破：后期实测‘低客单也跑起来了’，配合‘出价2倍预算’新规及关停策略，实现全品类覆盖'
  - '**边界条件**'
  - '- 资金门槛高：测品需投钱，没掌握方法易亏损，钱多吃肉、钱少喝汤、没钱玩不了'
  - '- 操作复杂度高：需掌握选品、搬运去重、投流搭建、数据复盘全链路SOP，作者耗时2个月、连续20天凌晨4点起床才跑通'
  - '- 合规风险：黑五类、功效品过不了审/不消耗，平台规则迭代（如赔付标准从6单改4单）需即时适配'
  - '- 依赖供应链：高客单要求利润率>70%，需SKU套装化提升客单，供应链不稳直接导致发货纠纷拉低体验分'
  sources:
  - paper: docs/202305/20230516_082.md
    role: origin
  - paper: docs/202305/AxQ8duaITowcrCx54hocWSy4nnb.md
    role: improve
  excerpts:
  - 目前视频号最稳定的带货玩法--短视频挂车投流...流程跑通之后，真香！稳定、可复制、可放大。而且，不废号！！！
  - 品和素材的重要性占爆品要素的70%以上，投放技巧占比不超过30%。在我们测试过程中遇到的90%问题...都是品和素材导致的。
  - 做投流不要相信感觉，而要相信数据。
  - 5月16号之后0粉挂车功能将取消，门槛提高了，好事...投放金额必须是出价2倍...支付roi正在内测...赔付标准有调整...好事
  - 下面截图是3月5号注册的新号，测试方法一个月，陆陆续续卖了3w+...过完315流量恢复...4月份小放量，卖8w+，净利润30%...
  - 光我知道的玩投流月利润超过100w的团队不少于10个...头部团队，每天测70-100个品。
- 'no': 2
  name: 高客单高利润选品标准 —— 用“利润率>70%”筛选能扛得住流量成本的品
  points:
  - '**为什么需要这个概念？**'
  - '- 付费流量成本高昂，低利润品无法覆盖投流成本，导致ROI为负'
  - '- 自然流时代选品逻辑（走量、薄利）在投流模式下完全失效'
  - '- 需要硬性指标快速筛选‘能跑得动付费流量’的商品'
  - '**核心定义**'
  - '- 硬性指标：商品利润率必须>70%（扣除成本后），主打新奇特、高溢价属性'
  - '- 禁入红线：黑五类、功效品等审核难、转化低、易违规品类坚决不碰'
  - '- 后期演进：方法论成熟后，配合‘小额叠投+勤关停’策略，可拓展至低客单价品类'
  - '**关键性质**'
  - '- 利润率是覆盖CPC/CPM成本的物理基础，利润率<70%几乎必亏'
  - '- 高客单天然筛选中老年/女性高净值人群，匹配视频号核心用户画像（女性≥85%、50岁以上≥80%）'
  - '- SKU套装化是提升客单价的必杀技：单品改多件装（2件/3件）、价格高到低排序、必须保留低价SKU承接千展消耗'
  - '**典型例子**'
  - '- 床单案例：原仅有一件装SKU，添加两件装、三件装后，大部分用户选择多件装，客单价与利润双提升'
  - '- 面相书籍案例：跟进对标爆品1:1精细化拍摄，当晚日佣破万，全矩阵跟品连续日入过万，峰值日佣2万'
  - '**边界条件**'
  - '- 新团队建议先‘跟投同行爆品’跑通流程拿正反馈，再自测选品，避免主观判断失误'
  - '- 选品三维法：拼多多榜单（地域重合度高）+ 蝉妈妈等数据平台 + 同行爆品跟投（爆率最高）'
  - '- 需建立‘多店铺备选+即时催单+动态切换’供应链熔断机制，防止爆发期发货延迟导致体验分崩盘'
  sources:
  - paper: docs/202305/AxQ8duaITowcrCx54hocWSy4nnb.md
    role: origin
  - paper: docs/202305/20230516_082.md
    role: improve
  excerpts:
  - 目前主要是做高客单，要求利润率在70%以上，不然很难覆盖投流成本，所以选品主打新奇特、高溢价。但是黑五类和功效品做不了，过不了审，过了也不消耗。
  - sku套装化，提升利润。例如，床单原sku只有一件装，添加两件装，三件装...大部分用户会选择两件装和三件装。sku排序，价格按从高到低展示，也能提高转化率。sku套装化，必须要有低价sku承接千展和消耗。
  - 多多选品，多多榜单内的产品具有时下热门性...多多用户的地域分布也和视频号有重合，有很强的参考性...追同行爆品，目前比较好的选品思路，爆率极高，建议小团队用这个方法...
- 'no': 3
  name: 双阶段测品法（1测/2测） —— 用“最小成本验品”锁定“最大概率爆品”
  points:
  - '**为什么需要这个概念？**'
  - '- 盲目放量极易亏损，必须建立‘漏斗式’筛选机制，用小成本试错换大概率确定性'
  - '- 传统‘一测定乾坤’无法区分‘能不能出单’与‘能不能放量’两个不同维度的问题'
  - '- 需要标准化的参数设定（预算、时长、出价、定向），消除主观随意性'
  - '**核心定义**'
  - '- 1测（验品期）：1000豆预算、6小时、出价900、无定向。仅验证‘能否出单及ROI’。不达标直接Pass或换素材，不纠结'
  - '- 2测（探价期）：2000豆预算、搭建4-10条计划、出价阶梯降50（850/800/750/700）。核心验证‘最优流速出价’及‘能否放量’，为放量期锁定核心参数'
  - '- 判定标准：1测看有无单和ROI；2测看消耗速度、ROI稳定性、放量潜力'
  - '**关键性质**'
  - '- 1测是‘生死筛选’：不能出单的品直接淘汰，不浪费后续资源'
  - '- 2测是‘参数标定’：通过出价阶梯测试，找到‘消耗流速最快且ROI达标’的黄金出价，避免放量期出价过高亏损或过低不消耗'
  - '- 严格止损：1测不出单即停，2测不能放量即停，坚决不补单、不强行优化烂素材'
  - '**典型例子**'
  - '- 作者团队实操：日测70-100品，通过大量1测快速筛选出‘能跑’的品，再用2测精准锁定出价，保证每周甚至每天都有爆品出现'
  - '- 实测案例：某品1测能出单但ROI不够 -> 2测调整价格/出价探价 -> 确认可放量 -> 放量期单日销售破万'
  - '**边界条件**'
  - '- 必须配合‘素材搬运消重SOP’同步执行：同品测多条不同类型素材（好物分享/科普/测评），优选有讲解口播类素材'
  - '- 测品环节严禁人工干预数据（如刷单），污染模型会导致后续放量定向失准'
  - '- 新团队切入建议：前期主攻‘同行爆品跟投’，利用已验证素材降低1测通过率风险，先跑通投流流程'
  sources:
  - paper: docs/202305/AxQ8duaITowcrCx54hocWSy4nnb.md
    role: origin
  excerpts:
  - '### 1测: 1000豆，6小时，出价900，其他都不选，看是否出单以及roi。能出单，但是roi不够，调整价格进行二测；不能出单，直接pass...'
  - '### 2测: 2000豆，搭建4-10条计划，出价比一测依次降低50豆，850、800、750、700，看roi、消耗、测合适流速的出价。主要测试能否放量，不能放量的品没意义。'
  - 这个玩法的核心是多测品和素材，一天测7个品和70个品赚的肯定不一样多...头部团队，每天测70-100个品。
- 'no': 4
  name: 视频号赔付机制与关停止损公式 —— 让投流拥有“安全气囊与刹车系统”
  points:
  - '**为什么需要这个概念？**'
  - '- 付费投流本质是概率博弈，单计划极易‘空消耗不出单’，无保护机制会导致本金快速归零'
  - '- 需要平台层面的兜底规则（赔付）和操作者层面的纪律规则（关停）双重保险'
  - '- 将‘亏损’转化为‘可控成本’，实现‘不太会亏钱’的心理安全感与资金安全'
  - '**核心定义**'
  - '- 赔付机制（平台给的安全气囊）：达标条件为‘6点赞、6关注、6单’（后调整为4单），达到标准后的空消耗部分平台返还。适用于高客单大额放量，实现‘不关停、卡赔付、提高ROI’'
  - '- 关停止损公式（自己给的刹车系统）：利润>100元时，消耗达(利润/4 - 5)未出单关停；利润<100元时，消耗达(利润/3 - 5)未出单关停。核心逻辑：用关停的空消耗提高整体ROI'
  - '- 适用分层：高客单走赔付策略（大额不关停）；低客单走关停策略（小额叠投、勤关停）'
  - '**关键性质**'
  - '- 赔付实测有效：作者实测两条100元计划均卡上赔付（新旧标准均生效），验证大额放量‘不太会亏钱’的可行性'
  - '- 关停公式源于工程化思维：将‘止损点’数学化、标准化，消除‘再等等吧’的侥幸心理'
  - '- 赔付标准动态变化（6单->4单）需即时跟进，属于平台规则红利窗口，早用早享受'
  - '**典型例子**'
  - '- 高客单案例：大额计划开跑，前期不出单正常消耗，触发赔付条件后平台返还空消耗部分，整体ROI从1.2拉升至1.8+'
  - '- 低客单案例：利润50元商品，按公式消耗至(50/3-5)≈11.6元未出单即关停，避免单计划亏损50元本金'
  - '**边界条件**'
  - '- 赔付非万能：仅覆盖‘空消耗’部分，若素材/品极烂导致有消耗有单但亏损，赔付无法覆盖'
  - '- 关停公式参数（1/3、1/4、减5元）为经验值，需根据实际行业转化率微调，不可教条套用'
  - '- 低客单‘小额叠投’需极高运营频次（勤盯计划），人力成本高，适合已有成熟团队/SOP的组织'
  sources:
  - paper: docs/202305/AxQ8duaITowcrCx54hocWSy4nnb.md
    role: origin
  excerpts:
  - 大额放量(适用于高客单)不需要关停，用卡赔付提高roi，赔付标准是6点赞6关注6单，达到这个标准空消耗的部分都会给赔付，不太会亏钱
  - 补充：...赔付标准有调整，从6单变成了4单，有两条100块钱的计划都卡上了赔付
  - 关停空消耗，产品利润高于100的，计划消耗到，利润的四分之一减5元，不出单关停计划；产品利润低于100的，三分之一减5元，不出单关停。
  - 小额叠投(适用于低客单)，要勤盯计划，用关停空消耗提高roi。
- 'no': 5
  name: 投放异常诊断决策树 —— 让“问题”变成“标准动作清单”
  points:
  - '**为什么需要这个概念？**'
  - '- 投流过程中‘不过审、不消耗、转化低’是高频异常，靠经验拍脑袋解决效率低、易遗漏'
  - '- 需要结构化的排查路径，将运营经验沉淀为新手可执行的SOP，实现团队复制'
  - '- 快速定位根因（品/素材/账户/出价/时间），对症下药，避免在错误方向上优化'
  - '**核心定义**'
  - '- 不过审：定性三大原因 -> 品原因（违规品类/资质）、素材原因（搬运痕迹/违规画面）、营销原因（诱导/承诺）。对策：换品/重剪素材/改文案'
  - '- 不消耗：五维排查 -> 素材重合度高(换素材/新号) -> 品竞争力低(换品/涨价) -> 投放时段错(调黄金窗) -> 出价低(拉满二测出价) ->
    无低价SKU承接(加SKU)'
  - '- 转化/ROI异常：四象限对策 -> 低点击高转化=品牛素材烂(换素材) -> 高点击低转化=素材牛品烂/贵(降价/换品) -> 有转化无利润=利润薄(涨价/套装SKU)
    -> 低点击低转化=彻底扑街(关停换品)'
  - '**关键性质**'
  - '- 遵循‘品素决定论’：90%异常根因指向品与素材，投放技巧（出价/定向/时间）仅解决10%边际问题'
  - '- 执行纪律：发现异常先‘定性’，再‘对症’，严禁‘不改素材强行加预算’、‘不换品强行改出价’'
  - '- 效率优先：不过审3分钟内驳回多为素材/营销问题，品问题需申诉；不消耗优先查素材重合度（最常见）'
  - '**典型例子**'
  - '- 实操案例：计划不消耗 -> 排查发现素材MD5重合度过高 -> 更换消重软件/重剪素材 -> 即刻起量消耗正常'
  - '- 实操案例：高点击低转化 -> 核对落地页价格高于同行 -> 调整SKU套装化/降价 -> ROI回正'
  - '**边界条件**'
  - '- 平台风控规则动态变化（如营销性质判定收紧），决策树需同步迭代维护'
  - '- 部分‘不消耗’归因于平台流量池波动（如大促、节假日），需结合大盘数据判断，非单一账户问题'
  - '- 需配合‘投放黄金时间窗’（测品上午9点前、放量晚12点/凌晨4点）执行，时段错误会导致误判素材/品质量'
  sources:
  - paper: docs/202305/AxQ8duaITowcrCx54hocWSy4nnb.md
    role: origin
  excerpts:
  - '### 投放过程遇到的问题: 1. 计划不过审，找出不过审原因...一般3分钟内驳回...是因为品的原因...其他原因多数因为素材搬运...还有营销性质重...
    2. 计划不消耗，分析原因...素材重合度高、产品竞争力低、投放时间段影响、出价太低、有没有低价sku承接消耗等等... 3. 转化低或roi低，低点击高转化，是品牛逼素材不行，赶紧换素材；高点击低转化，是素材牛逼品不行，降价；有转化没利润，涨价。'
- 'no': 6
  name: 矩阵化测品组织架构 —— 用“人海战术”博取“确定性收益”
  points:
  - '**为什么需要这个概念？**'
  - '- 单账号测品量有限，方差极大，无法触发大数定律，收益极不稳定'
  - '- 视频号投流‘日测品数’是核心KPI，头部团队日测70-100品，单人/单号根本跑不动'
  - '- 需要标准化的组织单元（人/机/号/投手比），将‘测品’工程化、流水线化'
  - '**核心定义**'
  - '- 基础作战单元：3-6人一组，人均5台安卓手机，微信多开支撑15个账号，实现批量测品/素材并行'
  - '- 专职投手配比：3个执行组配1名专职投手，执行组只管‘发视频、上架、催发货’，投手只管‘建计划、改出价、看数据’，职责解耦'
  - '- 核心指标：日测品数/素材数。头部团队日测70-100品，保证高频出爆品，验证‘测品量=爆品量=收益上限’'
  - '**关键性质**'
  - '- 物理隔离是生存底线：一机一号一网络（或严格多开隔离），规避关联封禁，账号编号体系（A1-A5）+手写台账+定期拨打电话保号'
  - '- 执行力是唯一护城河：技术含量低，核心竞争力在于‘赚钱的事多做十遍’的长期主义执行力（早睡早起、运动、读书支撑身心状态）'
  - '- 供应链响应速度决定变现上限：48小时发货红线，店铺沟通不畅会导致‘到手鸭子飞了’，需建立多备选+即时催单+动态切换熔断机制'
  - '**典型例子**'
  - '- 东哥案例：从兼职到全职、单号到20+账号矩阵，累计收益4万+。依托‘一证五号’合规模型、安卓双开物理隔离、红米Note 11T标配硬件，单人运营20+号'
  - '- 家庭支持解锁规模：母亲克服晕车去县城办卡，解锁‘身份证红利’，将单人上限(5号)突破为家庭矩阵(20+号)，是收益跃迁物理前提'
  - '**边界条件**'
  - '- 管理复杂度随账号数指数级上升：需贴纸标记手机、电子表格台账、流水式编号，否则极易‘忘记哪个手机是哪个号’'
  - '- 非核心城市（如山东聊城/滨州）低成本组建‘客服-运营-财务’铁三角团队，大城市人力成本不支撑重运营模式'
  - '- 规模化必然导向红海标品：400+店铺时蓝海容量不足，需通过店群规模建立壁垒，而非死磕蓝海选品'
  sources:
  - paper: docs/202305/AxQ8duaITowcrCx54hocWSy4nnb.md
    role: origin
  excerpts:
  - 以团队为例，3-6人为一组，每人准备5台安卓手机，每台手机微信多开，可支持15个帐号...每三个组安排一名投手...核心是多测品和素材...头部团队，每天测70-100个品。
  - 单人运营20+账号的硬件基建：安卓手机双开(1机10号)，推荐红米Note 11T 8+128G(~1700元)...账号编号体系(A1-A5)+笔记本手写台账+定期拨打电话保号。
  - 执行力与隐性资本(作息/习惯/读书)决定上限：项目技术含量低，核心竞争力在于长期主义执行力。
