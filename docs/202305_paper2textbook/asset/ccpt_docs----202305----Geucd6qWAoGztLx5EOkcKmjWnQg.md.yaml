paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
desc: 该素材是一篇Web3实战复盘文章，作者「瓜藤」详细记录了其在2023年5月参与BRC20新赛道项目VMPX抢购（Mint）的全过程。文章核心在于分享一套「抓住机会」的实战方法论：从认知层面的「抛弃偏见、拥抱运气、保持好奇」到执行层面的「寻找优质信息源（Alpha）、小步试错、快速迭代、备用方案预案、实战中动态调整Gas策略、极端环境下的心态与体力管理」。素材通过第一人称视角，真实还原了高拥堵链上交易中的技术细节（如Unisat操作、Gas费博弈、网络拥堵应对）、信息博弈（谣言辨别、创始人推特监控）及心理博弈（FOMO、耐心等待、止盈纪律），最终实现约10倍收益并强调落袋为安，是一份极具教学价值的链上实战案例。
concepts:
- name: 运气表面积
  desc: 指通过保持积极好奇心、扩展视野、心态豁达等主观行为，增加遭遇好运机会的概率。作者引用《天赋与运气：随机性在成功与失败中的作用》研究，认为虽不能改变运气本身，但可改变「运气的运气」，即提高单位时间内的运气值。
  is_original: false
  excerpt:
  - 你不能改变运气，但是可以改变运气的运气
  - 保持积极好奇心、扩展视野、心态豁达，遇事多想好的一面，少想坏的一面，好运气就会多一点。
- name: 抛弃偏见去机会多的地方
  desc: 作者总结的核心行动准则。指出偏见（如2021年因偏见错过NFT）是阻碍捕捉机会的主要原因，必须强迫自己去理解新事物（如BRC20），前往流动性和热度最高的赛道（Web3）进行试错。
  is_original: true
  excerpt:
  - 答案是：抛掉偏见去机会多的地方
  - 这次看到 BRC20 我就强迫自己去了解。
- name: Alpha 信息源
  desc: Web3行业内指高质量、早期、可执行的投资情报或内幕消息。作者强调寻找优质信息源（如七爷社群）、加入其筛选体系，利用他人筛选后的优质信息进行小步试错。
  is_original: false
  excerpt:
  - 在 Web3 ，这种消息叫 Alpha ，机会总给那些愿意行动起来的人。
  - 昨天看到七爷在群里转发 VMPX 的相关消息...因为我之前在 XEN 里面喝了点汤，所以就很重视。
- name: 把鞋弄脏
  desc: 指亲身下场实操、承担风险、体验细节的过程。相对「站在岸边指点评价」，只有真正投身其中（忍受网络拥堵、界面卡顿、Gas波动）才能获得隐性知识（如Gas拉满策略、Mint进度与网络拥堵的关系）。
  is_original: true
  excerpt:
  - 把鞋弄脏，遇到机会的时候，站在岸边指点评价总是容易的，真正投身其中才能感受风浪，风浪越大，鱼越贵。
- name: Gas 拉满策略
  desc: 在比特币网络极度拥堵、区块空间极度稀缺的Mint时刻，通过设置远高于市场平均水平的Gas费（如从550调整至800+），确保交易被矿工优先打包的核心博弈策略。作者通过小额试错验证「Gas给底则鸡飞蛋打」，最终确立此原则。
  is_original: true
  excerpt:
  - 基于以上实操，给下一步抢 VMPX 定了个操作原则：gas 拉满抢！
  - 我第一批冲了10张，把gas 翻翻，调到了550...后来...gas 已经飙到了600多...直到mint进度到了 99.6%...我把gas 调到了800，终于...赶上了末班车
- name: 谣言套利与信息验证
  desc: 在项目前期信息不对称阶段，市场出现「技术人才破解代币名称、抢跑Mint」等谣言导致衍生币种价格波动。作者通过观察链上数据（价格从0.1跌至0.02再涨至0.08）和创始人辟谣推特，验证谣言虚假性，并因平台权限限制（Unisat积分/OC
    PASS）未参与套利，体现了「验证猜想、知行合一、不盲目追涨」的纪律。
  is_original: true
  excerpt:
  - 有人开始转发一群技术人才破解了这个项目的代币名称...创始人后面又发文辟谣
  - 我想验证我的猜想，果然...后来留在创始人推特space 听了听...主要目的还是想看热度
- name: 极端环境下的身心管理
  desc: 指在长时间高强度链上博弈（凌晨3点至次日10点）中，通过观看剧集缓解焦虑、保持生理机能（躺沙发休息）、情绪稳定（不因页面503崩溃放弃）、外部支持（女友陪伴带来好运气）等手段，维持决策能力在线、不掉队、最终捕捉尾部机会的综合素质。
  is_original: true
  excerpt:
  - 战役打到这个份上，好身体和好心态的重要性就体现出来了...我打开了前段时间攒的剧《漫长的季节》，边看边刷新 mint 页面。
  - 边跟我女朋友视频边等待打包（此处郑重感谢我女朋友给我带来好运气）
- name: 落袋为安纪律
  desc: 在浮盈高达10倍（成本0.13 -> 价格1.3）且CEX（芝麻开门）即将上线引发二波行情预期时，作者警惕「虚空价格」「前端崩溃」「挂单显示延迟」等风险，强调必须及时止盈离场，克服贪婪（别上头），将纸面富贵转化为真实利润。
  is_original: true
  excerpt:
  - 落袋为安很重要！别上头！
  - 平台前端已崩溃，交易页面一直在维护...地板价格在0.39左右，也就是抢购成本的3倍左右，圈子里面这种虚空价格也很正常，坑也很多
methods:
- name: __overview__
  desc: 作者构建的一套完整的Web3链上实战闭环方法论：认知重构（运气观/偏见观） -> 信息获取（Alpha源/社群筛选） -> 预演与试错（资料整理/模拟操作/小额实战）
    -> 策略制定（Gas拉满/备用提币方案） -> 实战执行（信息监控/动态调参/身心管理） -> 审慎离场（验证谣言/CEX上线预期/止盈纪律）。
  excerpt:
  - 抛掉偏见去机会多的地方
  - 寻找优质信息源，加入他们，用他们筛选出来的优质信息，小步试错，快速迭代
  - 大概了解了它的原理和操作平台流程玩法，准备好钱包和 BTC 就开始模拟了；模拟了五六遍...开始实操...定了个操作原则：gas 拉满抢！
  - 边看边刷新 mint 页面...把gas 调到了800，终于...赶上了末班车
  - 落袋为安很重要！别上头！
- name: BRC20 Mint 实战标准作业程序 (SOP)
  desc: 针对BRC20代币Mint的具体技术操作流程：1. 钱包准备；2. BTC获取与提币（含备用交易所方案应对拥堵）；3. Mint平台选择；4. 资料整理与流程模拟（反复演练5-6遍）；5.
    小额实战测试（测试Gas底价失效边界）；6. 核心参数设定；7. 开抢时刻多渠道信息监控；8. 拥堵期动态调Gas与页面刷新策略；9. 尾部低拥堵窗口期提高Gas锁定区块；10.
    打包确认与资产安全转移。
  excerpt:
  - 从九点多知道这个消息后开始寻找各个社群整理出来的关于 BRC20 的各种资料，大概了解了它的原理和操作平台流程玩法，准备好钱包和 BTC 就开始模拟了
  - 安安还暂停了大约1个小时的提币，立马启动备用方案，用OK提
  - 对着教程开始反复模拟（很重要，要不断模拟测试问题）；模拟了五六遍后觉得没大问题时，开始实操
  - 找了几个mint 进度 80%——90%的项目 ，走了几遍流程...才理解了教程里面说的 gas 给底的话，很可能鸡飞蛋打。
  - 倒计时页面点击进去后直接跳到创始人推特...三点十分的时候，创始人发了推文
  - 直到mint进度到了 99.6%...我把gas 调到了800，终于...顺利地看着有我的包的区块从待打包的红色状态跳到打包完成的蓝色状态
- name: 动态 Gas 博弈模型
  desc: 一种基于实时网络拥堵度、Mint进度、竞争对手行为预判的Gas定价动态调整方法。核心逻辑：前期拥堵极高时Gas需远超估算（550->600+仍不够）；中期死守等待；后期进度>99%且网络拥堵缓解时，适度提高Gas（800）抢夺最后区块空间。避免了「前期Gas不足交易卡死」与「后期Gas过高不必要损耗」的双重风险。
  excerpt:
  - 开始前我看到数据平台的gas 才250多，所以我第一批冲了10张，把gas 翻翻，调到了550...等着平台确认我的订单一直在倒计时...再去看gas 已经飙到了600多
  - 直到mint进度到了 99.6%，此时已经是早晨九点半左右了，网络没有那么拥堵了，我把gas 调到了800，终于...赶上了末班车
theorems:
- name: 机会捕获公式：认知破偏见 × 信息源质量 × 实战执行力 × 心态抗压力 = 结果
  desc: 作者隐性提出的核心主张：在高不确定性、高波动率的Web3市场中，单一维度的优势不足以致胜。必须完成从「唯心/唯物逻辑自洽」到「抛弃偏见拥抱新赛道」的认知跃迁，接入高质量Alpha信息网络，通过「把鞋弄脏」的实战积累隐性知识（如Gas策略），并在极端压力下保持身心在线，四者缺一不可，方能将运气转化为确定性收益。
  excerpt:
  - 你相信什么才能做到什么，不管唯物还是唯心，希望你也能找到自己做事的逻辑。
  - 答案是：抛掉偏见去机会多的地方
  - 机会总给那些愿意行动起来的人。
  - 把鞋弄脏...风浪越大，鱼越贵。
  - 战役打到这个份上，好身体和好心态的重要性就体现出来了
- name: Web3 生存法则：98% 项目是骗局，核心竞争力在于出入场时机
  desc: 作者基于两个周期经验提炼的残酷真相：Web3项目绝大多数归零，项目基本面分析边际效用递减，唯一的核心技术是「时机选择」——早一步发现Alpha、早一步完成Mint、早一步在流动性枯竭前离场。这将投资本质从「价值发现」转移为「流动性博弈与速度竞赛」。
  excerpt:
  - Web3 圈有98% 的项目都是骗人的！！！所以考验的是出入场时机。
- name: 小步试错、快速迭代优于完美计划
  desc: 在信息不全、环境剧变的链上环境中，完整的事前计划不可行。作者主张：快速获取资料 -> 即时模拟演练 -> 小额实战验证关键假设 -> 形成原则 ->
    全力执行。这种「OODA循环」式的敏捷方法论优于传统的详尽规划。
  excerpt:
  - 寻找优质信息源...小步试错，快速迭代
  - 大概了解了...就开始模拟了；模拟了五六遍后觉得没大问题时，开始实操...才理解了...gas 给底的话，很可能鸡飞蛋打。基于以上实操，给下一步抢 VMPX
    定了个操作原则
findings:
- name: VMPX Mint 实战收益与验证
  desc: '[evidence] 作者投入成本约为Mint价0.13/枚（含Gas），共Mint成功2包（具体数量未透露），后续市场价格峰值达到1.3（约10倍涨幅），撰文时地板价回落至0.39（约3倍收益）。验证了「Gas拉满策略」在极端拥堵下的有效性，以及「尾部进度窗口期」的操作可行性。'
  excerpt:
  - 看到价格涨到了0.8左右，后来逐渐涨到了1.3，约10倍涨幅
  - 地板价格在0.39左右，也就是抢购成本的3倍左右
  - 两个包都打完了，顺利地看着有我的包的区块从待打包的红色状态跳到打包完成的蓝色状态
- name: 谣言驱动的短期价格畸变现象
  desc: '[evidence] 观察到「技术破解代币名称」谣言发布后，相关误导性代币价格从Mint价0.1暴跌至0.02，后因热度对撞反弹至0.08，稳定在0.04。揭示了BRC20早期市场极度缺乏流动性、信息极度不对称、情绪驱动价格、Unisat测试版权限机制（积分/OG
    PASS）隔离散户参与套利的市场微观结构特征。'
  excerpt:
  - 我赶紧跑去看他们抢跑的那个币种，应声下跌到0.02，据说他们的mint价是0.1...最高冲到0.08，截止发文，稳定在0.04
  - unisat 平台的交易市场是测试版本，所以目前只给有20积分或者有OG PASS 的人才能交易
- name: Gas 费与 Mint 成功率的非线性阈值关系
  desc: '[evidence] 实战发现：Gas 250（市场均价）-> 必败；Gas 550（2倍均价）-> 交易卡死待打包，最终失败；Gas 800（进度99.6%、网络缓解时）->
    成功打包。证明在区块空间极度稀缺时，Gas价格存在「生死线」阈值，且该阈值随Mint进度和网络拥堵度动态变化，静态策略必死，动态调整必活。'
  excerpt:
  - 开始前我看到数据平台的gas 才250多，所以我第一批冲了10张，把gas 翻翻，调到了550...就是不跳出下一步...gas 已经飙到了600多
  - 直到mint进度到了 99.6%...网络没有那么拥堵了，我把gas 调到了800，终于...赶上了末班车
- name: CEX 上线预期与去中心化交易前端崩溃的套利窗口
  desc: '[claim] 作者宣称：芝麻开门（Gate.io）宣布上线VMPX通常预示热度峰值，将引发二波拉盘；但去中心化交易前端崩溃、挂单延迟显示导致「虚空价格」，无法有效落袋。建议在CEX开放充值前或开放即刻市价卖出，而非贪恋高点。'
  excerpt:
  - 明天，也就是9号11:00，芝麻开门会上 VMPX ，一般来说，这种 CEX 抢上，是因为热度，那么，怎么落袋为安就又是另一门学问了。
  - 平台前端已崩溃，交易页面一直在维护...上午挂单的订单开始陆续显示出来...这种虚空价格也很正常，坑也很多，所以，落袋为安很重要！别上头！
