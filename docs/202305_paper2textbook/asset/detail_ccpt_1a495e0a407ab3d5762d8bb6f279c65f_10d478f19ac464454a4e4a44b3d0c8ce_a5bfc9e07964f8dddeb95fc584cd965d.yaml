units:
- 'no': 1
  name: 短剧CPS —— 借用小说推文经验跨界捕获蓝海红利
  points:
  - '**为什么需要这个概念？**'
  - '- 传统视频带货门槛高，需自建供应链、直播团队、投流技术'
  - '- 新手缺乏选品、剪辑、运营经验，试错成本高、周期长'
  - '- 短剧CPS利用“内容分发变现”模式，与小说推文同构，可直接迁移经验'
  - '- 蓝海期平台/剧方给高佣金(100%首充分成)和宽松审核，是普通人低成本试错的稀缺窗口'
  - '**核心定义**'
  - '- 短剧CPS：推广者剪辑短剧片段挂载小程序链接，用户充值观看后按比例分成佣金'
  - '- 蓝海期特征：部分剧方提供100%首充分成，审核宽松，红利窗口期约2-3个月'
  - '- 同构迁移：小说推文的选品逻辑、剪辑套路、账号运营经验可直接复用到短剧CPS'
  - '**关键性质**'
  - '- 选品决定上限(剧集自带流量属性定生死)，执行决定下限(剪辑/文案/发布定存活)'
  - '- 解说模式降维打击：将“剪辑技巧门槛”转移为“文案逻辑门槛”，配合AI工具大幅降低新手入门门槛'
  - '- 行动先于完美计划：认知不确定性高时，下场实操是获取真实反馈、打破自我设限的唯一路径'
  - '- AI批量化生产：建立“选题表→文案提示词库→配音预设→剪辑模板库→发布清单”标准化资产库，单条压缩至15-20分钟'
  - '**典型例子**'
  - '- 作者惟乔：生财社群普通成员，零视频背景，迁移小说推文经验，首月(2023年3月)实操短剧CPS收益1.4万元'
  - '- 解说类视频制作流程：选爆款剧→ChatGPT按公式生成分集解说文案→剪映TTS/外部工具配音→剪映智能匹配/手动切点配片段→套模板出片'
  - '- 批量化流水线：批量导入素材→批量喂AI生成10条文案→批量合成语音→剪映一键成片/模板批量替换→多账号矩阵定时发布，单人日更10条+'
  - '**边界条件**'
  - '- 授权陷阱高发：只认准官方/大服务商授权，警惕“收费授权”“二手授权”“扣量”陷阱'
  - '- 账号环境要求：实名一机一号为宜，新号需刷同城/垂类3-5天养号再发，避免被标记搬运'
  - '- 去重标准严格：MD5修改、镜像翻转、调色、抽帧、加贴纸/字幕/边框，必须过原创检测'
  - '- 数据复盘导向：数据差优先优化前3秒钩子和CTA引导，关注完播率、点赞转发、跳转率'
  - '- 一机一号非绝对硬性约束：平台风控存在灰度空间，设备指纹隔离核心而非物理设备绝对隔离'
  sources:
  - paper: docs/202305/20230516_084.md
    role: origin
  excerpts:
  - 接触这个项目，也是因为之前做过小说推文，刚了解就发现，这两个项目的相通之处，又正处在蓝海期，有的剧居然给到 100%的佣金
  - 加入生财学到的第一点就是，先别想太多，下场最重要。
  - 短剧 CPS 的核心三要素：选剧是核心，选剧定生死；剪辑要过原创，去重很重要；发布要养号，一机一号最好
  - 剧情剪辑的基本公式：前 3 秒必须有冲突/悬念/高潮 -> 剧情铺垫 -> 高潮反转 -> 引导下小程序看全集
  - 没有创作经验，如何上手解说类短剧视频？解说类视频不需要太强的剪辑节奏感，只要把剧情讲清楚即可，文案用 ChatGPT 写，配音用剪映/软件，剪辑用剪映模板/智能剪辑
  - 如何批量产生解说类短剧视频？建立素材库、文案库、模板库，流程化作业，单人日更 10 条+
  - 新手有哪些容易踩的坑？授权别交学费，认准官方渠道；一机一号，新号要养号；去重要做彻底，不然限流；数据不好看完播率和引导
  - 在生财里看了很多精华贴，非常有帮助，所以我也来分享一下我的操作经验。
  - 最近操作短剧 CPS 项目，有一点点小小的收益，3 月收益 1.4w+。不多，但是有一个好的起步。
  - '惟乔 : 最好是一机一号，也没限得那么死'
- 'no': 2
  name: 解说模式 —— 将“剪辑技巧门槛”转移为“AI可辅助的文案逻辑门槛”
  points:
  - '**为什么需要这个概念？**'
  - '- 纯混剪模式极易被平台判定搬运、限流，且要求极强的剪辑节奏感，新手难以驾驭'
  - '- 新手缺乏创作经验，无法通过“节奏感”把控视频留存，导致完播率低、不出单'
  - '- 解说模式通过“原创音频+二创剪辑”更易通过平台原创校验，天然具备防搬运属性'
  - '**核心定义**'
  - '- 解说类短剧视频：由创作者录制或AI生成旁白解说，配合剧情片段剪辑而成，核心在于“把剧情讲清楚”而非“剪得炫酷”'
  - '- 门槛转移：将核心能力要求从“剪辑技巧(需经验/天赋)”转移为“文案逻辑(可标准化/AI辅助)”'
  - '**关键性质**'
  - '- 低门槛：不需要太强的剪辑节奏感，只要剧情逻辑清晰即可'
  - '- 高原创度：原创音频+二创画面，极大概率通过平台原创/搬运检测'
  - '- AI友好：文案生成可用ChatGPT按公式批量产出，配音可用剪映TTS/外部工具自动化，剪辑可用模板/智能剪辑标准化'
  - '- 可批量：单条制作压缩至15-20分钟，单人日更10条+成为可能'
  - '**典型例子**'
  - '- 新手4步走SOP：1.选爆款/高佣剧 2.ChatGPT按公式生成分集解说文案(输入梗概输出口语化脚本) 3.剪映文本朗读/外部TTS生成音频 4.导入剪映智能匹配素材/手动按文案切点配片段，套模板出片'
  - '- 文案Prompt设计：输入剧情梗概，输出符合“黄金前3秒钩子+剧情铺垫+高潮反转+引导CTA”结构的口语化解说稿'
  - '**边界条件**'
  - '- 文案质量是核心：解说内容若平铺直叙、无钩子、无情绪起伏，依然完播率低、不转化'
  - '- 素材获取难度：部分热门剧集素材受版权保护难获取，或素材质量差(水印/低清)影响成片效果'
  - '- 配音自然度：TTS合成音在情绪表达、语气停顿上仍不如真人，可能影响用户代入感'
  - '- 平台政策风险：若平台收紧对“解说类二创”的判定标准(如要求真人出镜/实拍占比)，该模式失效'
  sources:
  - paper: docs/202305/20230516_084.md
    role: origin
  excerpts:
  - 没有创作经验，如何上手解说类短剧视频？
  - 解说类视频不需要太强的剪辑节奏感，只要把剧情讲清楚即可
  - 文案用 ChatGPT 写，配音用剪映/软件，剪辑用剪映模板/智能剪辑
  - 没有创作经验，如何上手解说类短剧视频？
  - 解说类视频不需要太强的剪辑节奏感，只要把剧情讲清楚即可
  - 选爆款剧/高佣剧；用 ChatGPT 按‘公式’生成分集解说文案（输入剧情梗概输出口语化脚本）；用剪映‘文本朗读’或外部 TTS 工具生成音频；将音频导入剪映，用‘智能匹配素材’或手动按文案切点配剧情片段，套用模板出片
- 'no': 3
  name: 核心三要素筛选法 —— 选剧定生死、剪辑保命、发布养权重
  points:
  - '**为什么需要这个概念？**'
  - '- 短剧CPS看似简单，实则新手在选剧、剪辑、发布三个环节均极易踩坑导致账号废号或不出单'
  - '- 需要一套标准化的执行清单，将经验固化为可检查、可考核、可复制的动作标准'
  - '**核心定义**'
  - '- 选剧维度：佣金比例(优先高佣/独家) > 题材受众匹配度(大女主/爽文/反转/老年赛道) > 素材获取难易度'
  - '- 剪辑维度：执行“剧情剪辑基本公式”(前3秒钩子+铺垫+高潮反转+CTA) + 彻底去重处理(镜像/调色/抽帧/特效/贴纸/字幕/边框)'
  - '- 发布维度：一机一号实名养号 + 新号刷同城垂类3-5天 + 定时发布 + 关键词SEO布局 + 置顶评论引导'
  - '**关键性质**'
  - '- 选品定生死：剧集自带的题材、节奏、爽点决定了账号流量天花板，选错剧后续动作再标准也白费'
  - '- 剪辑保命：过原创是生存底线，去重必须“做彻底”，否则限流即死'
  - '- 发布养权重：账号标签精准度决定推流人群质量，养号是冷启动必经仪式'
  - '- 数据驱动迭代：数据不好看完播率和引导(CTA)，用数据倒逼内容升级而非主观臆断'
  - '**典型例子**'
  - '- 选剧实操：优先找“佣金高、独家、题材匹配中老年/女性爽文赛道、素材易获取”的剧集'
  - '- 去重实操：剪映里镜像翻转、调色、抽帧、加特效/贴纸/字幕/边框组合拳，确保MD5值改变且视觉无违和感'
  - '- 养号实操：新号前3-5天只刷同城/垂类内容，不发视频，建立精准标签后再发布'
  - '**边界条件**'
  - '- 佣金高≠好推：部分高佣剧题材小众、素材少、受众窄，推广难度大，需综合评估'
  - '- 去重过度伤内容：过度调色/抽帧可能破坏剧情连贯性、降低观看体验，得不偿失'
  - '- 一机一号成本高：矩阵化运营时，物理设备成本随账号数线性增长，需权衡ROI'
  - '- 平台算法迭代：选品逻辑、去重标准、养号时长均随平台风控升级而变化，需持续更新SOP'
  sources:
  - paper: docs/202305/20230516_084.md
    role: origin
  excerpts:
  - 短剧 CPS 的核心三要素
  - 选剧是核心，选剧定生死
  - 剪辑要过原创，去重很重要
  - 发布要养号，一机一号最好
  - 剧情剪辑的基本公式：前 3 秒必须有冲突/悬念/高潮 -> 剧情铺垫 -> 高潮反转 -> 引导下小程序看全集
  - 新手有哪些容易踩的坑？
  - 授权别交学费，认准官方渠道
  - 一机一号，新号要养号
  - 去重要做彻底，不然限流
  - 数据不好看完播率和引导
- 'no': 4
  name: AI批量化生产流水线 —— 从“手工作坊”到“工业化标准件”
  points:
  - '**为什么需要这个概念？**'
  - '- 单条视频手工制作耗时1-2小时，无法支撑矩阵化、规模化运营，收益上限被时间锁死'
  - '- 手工制作质量不稳定，文案风格、配音语气、剪辑节奏随心情波动，难以复制爆款'
  - '- 需要将“选题、文案、配音、剪辑、发布”拆解为标准化模块，建立可复用的资产库'
  - '**核心定义**'
  - '- 标准化资产库：选题表(选剧记录/佣金/素材链接) + 文案提示词库(通用Prompt/爆款结构模板) + 配音预设(TTS音色/语速/停顿参数) +
    剪辑模板库(封面/转场/BGM/字体/CTA样式) + 发布清单(标题/标签/定时/置顶话术)'
  - '- 流水线节拍：批量导入素材 → 批量喂AI生成文案 → 批量合成语音 → 剪映一键成片/模板批量替换 → 多账号矩阵定时发布，单条15-20分钟，单人日更10条+'
  - '**关键性质**'
  - '- 数据与指令解耦：Excel/CONCAT函数将固定指令模板与变量数据(剧名/集数/卖点)分离，实现Prompt参数化批量生成'
  - '- 模板化交付：剪映模板固化“封面样式、字幕动画、转场节奏、BGM卡点、结尾引导”，仅替换“剧情片段+解说音频”两个变量'
  - '- 复用即护城河：沉淀下来的提示词库、模板库、素材库是核心资产，人员流动不影响产能'
  - '- 端到端打通：配合RPA/自动化工具可实现从选题到发布的无人值守闭环'
  - '**典型例子**'
  - '- 文案批量：Excel建立选题表(A列剧名、B列集数、C列核心冲突)，CONCAT拼接Prompt批量喂给ChatGPT，导出文案库'
  - '- 配音批量：剪映“文本朗读”批量导入文案库，统一预设音色/语速，一键导出音频文件夹'
  - '- 剪辑批量：剪映“智能剪辑/模板”导入音频+素材文件夹，自动匹配时长/节奏，批量出片'
  - '- 发布批量：RPA/多账号管理工具读取发布清单，定时分发至矩阵账号'
  - '**边界条件**'
  - '- 模板同质化风险：大量使用同一模板易被平台识别为“模板化内容”限流，需定期迭代模板库(换BGM/转场/字体/封面风格)'
  - '- AI幻觉/逻辑断层：ChatGPT生成文案可能出现剧情错误、人称混乱、口语化不足，需建立“抽检-修正Prompt-回归测试”质检机制'
  - '- 素材版权风险：批量下载/存储短剧素材涉版权风险，需确保素材来源合规(官方授权素材包/自录屏)'
  - '- 账号管理复杂度：矩阵账号增多时，设备管理、IP隔离、登录状态维护、发布排期冲突等运维成本指数级上升'
  sources:
  - paper: docs/202305/20230516_084.md
    role: origin
  excerpts:
  - 如何批量产生解说类短剧视频？
  - 建立素材库、文案库、模板库，流程化作业，单人日更 10 条+
  - 利用 ChatGPT 写解说文案，利用剪映/配音软件生成音频，利用剪映模板/智能剪辑快速成片
- 'no': 5
  name: 避坑检查清单 —— 将隐性经验显性化为生存红线
  points:
  - '**为什么需要这个概念？**'
  - '- 新手缺乏风控意识，极易在授权、账号环境、去重、数据复盘四个维度踩坑导致资金/时间/账号三重损失'
  - '- 将散落在经验中的风险点提炼为标准化清单，降低决策认知负荷，实现“拿来即用、对照即安”'
  - '**核心定义**'
  - '- 授权辨别：只认准官方/大服务商授权，警惕“收费授权”“二手授权”“扣量”三大陷阱'
  - '- 账号环境：实名一机一号(核心设备指纹隔离) + 新号刷同城/垂类3-5天养号 + 避免使用有违规历史的旧设备'
  - '- 去重标准：MD5修改 + 镜像翻转 + 调色 + 抽帧 + 加贴纸/字幕/边框，组合拳确保过原创检测'
  - '- 数据复盘：关注完播率/点赞转发/跳转率，数据差优先优化前3秒钩子和CTA引导'
  - '**关键性质**'
  - '- 授权是生死线：授权渠道不正规 = 佣金结算无保障/随时被下架/法律风险自担'
  - '- 环境是底线：设备/网络/实名关联导致的连坐封号，是矩阵化运营最大的系统性风险'
  - '- 去重是门槛：不过原创 = 0流量 = 0收益，去重质量直接决定账号生存周期'
  - '- 数据是罗盘：不看数据盲目坚持 = 赌博，数据复盘是低成本试错的唯一科学方法'
  - '**典型例子**'
  - '- 授权避坑：拒绝“交学费拿授权”“代理商二手转授权”，直接对接平台官方/头部服务商(如巨量星图/快手磁力聚星官方渠道)'
  - '- 环境搭建：红米Note 11T 8+128G(~1700元)作为标配机型，一机双开10号，账号编号A1-A5贴纸标记+电子表格台账管理'
  - '- 去重实操：剪映里“镜像”(水平翻转)+“调色”(对比度/饱和度微调)+“抽帧”(每秒删1-2帧)+“贴纸/字幕/边框”遮挡关键特征点'
  - '- 复盘动作：完播率<20% → 优化前3秒钩子(换更强冲突/悬念)；跳转率<1% → 优化CTA话术/置顶评论引导/小程序卡片位置'
  - '**边界条件**'
  - '- 平台风控动态升级：去重手段/养号时长/授权政策随平台算法迭代失效，清单需每月迭代'
  - '- 设备指纹技术对抗：平台检测维度从MAC/IP升级到电池温度/传感器噪声/安装列表，物理隔离成本持续上升'
  - '- 官方渠道门槛高：头部服务商常要求最低GMV/粉丝量/保证金，新手可能无资格对接，存在“想对接对接不上”的窘境'
  - '- 数据延迟/抽样偏差：后台数据非实时、抽样统计，小样本期复盘决策可能误判，需积累足量样本(建议>1000播放)再决策'
  sources:
  - paper: docs/202305/20230516_084.md
    role: origin
  excerpts:
