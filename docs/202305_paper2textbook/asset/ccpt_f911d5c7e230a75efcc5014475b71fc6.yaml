paper: docs/202305/20230516_021.md
desc: 该素材为一篇关于 Stable Diffusion (SD) 的高赞入门教程推荐帖，作者吴东子整理了耗时80小时的“胎教级”万字长文，旨在提供从环境安装部署、WebUI界面功能详解、实战案例制作到优质模型（Checkpoint/LoRA）及提示词资源下载的一站式学习路径，并配套打包提供安装包与资源文件，降低新手入门门槛。
concepts:
- name: 胎教级教程
  desc: 指极其详细、面向零基础小白、手把手分步骤操作、旨在消除所有认知与操作障碍的入门教学体系。
  is_original: true
  excerpt:
  - 《耗时 80 小时！超详细的胎教级 Stable Diffusion 使用教程，看这一篇就够！》
  - 从手把手安装部署，到界面功能讲解，再到实战案例制作...让你不止是枯燥地学，而是学完立刻也能做出一样的图片出来！
- name: 一站式资源包
  desc: 教程配套提供的集成安装包、基础大模型、LoRA模型、提示词文件等预打包资源，解决新手“找不到资源、下载困难、版本不匹配”的工程化落地难题。
  is_original: true
  excerpt:
  - 同时，无论是安装包，大模型，lora，关键词的文件都给大家打包好了，不用再自己这找找那找找
- name: 即学即用实战闭环
  desc: 教程设计理念，强调通过一个个具体案例驱动学习，而非枯燥的参数理论堆砌，确保学习者完成教程即具备独立生图能力。
  is_original: true
  excerpt:
  - 并且用一个又一个的例子展示，让你不止是枯燥地学，而是学完立刻也能做出一样的图片出来！
methods:
- name: __overview__
  desc: 教程整体方法论：采用“环境部署 -> 界面认知 -> 实战案例 -> 资源获取”的线性递进式教学流程，配合“资源预打包分发”降低工程门槛，以“案例驱动”替代“参数讲解”建立认知闭环。
  excerpt:
  - 从手把手安装部署，到界面功能讲解，再到实战案例制作，到下载优质模型，每一步都有详细教程
  - 并且用一个又一个的例子展示...希望能做到让大家学 SD，看这一篇就够！
theorems:
- name: SD入门核心痛点三要素
  desc: Stable Diffusion 新手入门的核心障碍在于：1. 环境部署与硬件兼容性的技术门槛；2. 模型、LoRA、提示词等生态资源的获取与筛选成本；3.
    从参数理论到生成可用图像的认知鸿沟。本教程主张通过“预打包分发+案例驱动教学”同时解决这三大痛点。
  excerpt:
  - 从手把手安装部署，到界面功能讲解，再到实战案例制作，到下载优质模型
  - 不用再自己这找找那找找，希望能做到让大家学 SD，看这一篇就够！
findings:
- name: 教程社区认可度验证
  desc: '[evidence] 该教程在语雀平台获得 578 赞，评论区用户普遍给予“大写的牛逼”、“真滴牛”、“收藏学习”等高度正面反馈，证明该“胎教级+资源包+案例驱动”的教学模式有效满足了当时社区新手的迫切需求。'
  excerpt:
  - (精华帖)(578 赞)
  - '评论区：GEWO.GUO🌪 : 大写的牛逼 ... 红烧电饭煲 : 真滴牛我的哥'
- name: 典型新手故障案例：竖屏比例黑图问题
  desc: '[claim] 评论区用户‘欢乐马’反馈在云平台显存充足情况下，设置宽高比 9:16 (竖屏) 会出现黑图，提示该教程或基础 SD 流程在极端宽高比生成时存在潜在兼容性或显存碎片化问题，且非单纯显存不足所致。'
  excerpt:
  - '欢乐马 : 请教下大佬，宽高比设置成 9：16 比例就会出黑图，是哪里的问题啊（用的云平台，显存也够）谢谢'
