  reason: 素材中仅提到'做这个项目需要什么设备？'，未提供具体硬件配置、推流参数及实测结果。
- location: '18.6'
  claim: 多账号轮播：同一设备切换账号直播(需实名隔离)，实现「一人多号、全天候覆盖」，单设备产出最大化【P026】。
  reason: 素材中完全未提及多账号轮播操作。
