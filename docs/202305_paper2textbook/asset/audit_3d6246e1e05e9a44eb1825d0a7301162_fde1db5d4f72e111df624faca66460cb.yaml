unsupported_claims:
- location: '18.3'
  claim: 作者观察：抖音棋牌直播「不存在投流」现象，优质内容均靠自然流分发，验证算法扶持期红利【P026】。
  reason: 素材中明确提到'我看他们现在都有投流，要不然没特色没流量...是的，目前就是这类的棋盘直播间比较火'，与'不存在投流'直接矛盾。
- location: '18.3'
  claim: 残局主播实测：不露脸、仅展示牌桌+手部操作+语音解说，场观稳定数千、互动率极高、日涨粉百级【P026】。
  reason: 素材中未提及具体场观数千、日涨粉百级等量化数据，仅泛泛提及'普通人都可以做...做人气非常容易'。
- location: '18.4'
  claim: 作者推荐：猪八戒人设+稻草堆场景，话术「俺老猪今天心情好，谁能赢俺这关」，观众代入感极强，单场人气破万【P026】。
  reason: 素材中虽提及猪八戒人设和话术示例，但未提及'单场人气破万'等具体效果数据。
- location: '18.4'
  claim: 容嬷嬷人设+冷宫场景，话术「这哪里是残局，分明是要你们命的局」，反差萌极强，女性观众高留存【P026】。
  reason: 素材中仅列举容嬷嬷作为COS角色示例，未提及冷宫场景、具体话术及女性观众高留存数据。
- location: '18.5'
  claim: 作者公司模式：提供权限+链接+底薪，主播负责内容生产+直播执行，双方按约定分成(如55/45或64/36)【P026】。
  reason: 素材中仅确认'可以在家自己播吗，挂载您公司的链接变现 -> 可以的'，未提及底薪金额、分成比例等具体商业条款。
- location: '18.5'
  claim: 考核细则：「有效直播天数≥25天/月、单场时长≥2小时、峰值场观≥500、无违规记录」达标发放全额底薪【P026】。
  reason: 素材中仅提到'如何拿底薪，有什么要求？'，未给出具体考核指标数值。
- location: '18.6'
