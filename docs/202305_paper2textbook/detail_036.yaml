    away, looking away,tilted head...
  - 你想生成真人模特，你在最开始用了真人的大模型，对应的我们的Lora也要选用真人模特，这样出来的照片效果才更好！
- 'no': 2
  name: 随机数种子 —— 控制生成底层构图的“DNA密码”
  points:
  - '**为什么需要这个概念？**'
  - '- 同一组参数每次生成图片都不同，无法复现满意结果'
  - '- 需要一个确定性锚点，让“运气好一次”变成“永远能复现”'
  - '- 也是参数复现三要素（大模型、LoRA、Seed）中唯一不可见、需从元数据读取的变量'
  - '**核心定义**'
  - '- Seed 控制初始噪声模式，决定画面最底层的轮廓、构图、空间布局'
  - '- 值为 -1 时随机生成；固定为具体数值时，配合其余参数完全一致，可 1:1 复现同一张图'
  - '**关键性质**'
  - '- Seed 仅控制底层形状，不控制风格、五官、衣服等高层语义（那些由大模型+LoRA+提示词决定）'
  - '- 微调 Seed（如 +1/-1）可在保持大体构图不变的前提下，产生细微变化（微调表情、手势）'
  - '**典型例子**'
  - '- 看到别人分享的好看图，复制其 Seed、提示词、模型、LoRA，自己也能生成几乎一样的图'
  - '- 批量生成同构图时，固定提示词+模型，只遍历 Seed（如 1000-1100），快速筛选最佳构图'
  - '**边界条件**'
  - '- 必须同时满足：相同大模型、相同 LoRA 组合及权重、相同 Seed，缺一不可'
  - '- PNG Info 只能读取 SD 原生导出图片的 Seed；非原生图需用 Tagger 反推，但 Tagger 无法提取 Seed'
  - '- 不同版本 SD、不同后端（如 ComfyUI vs WebUI）、不同硬件精度，同 Seed 可能出图不同'
  - '...'
  sources:
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: origin
  excerpts:
  - 随机数种子控制的是最底层的形状，就相当于我们画画最开始的线稿... 当随机数为“-1”的时候，SD就会随机给你的照片生成一个种子
  - 只有当我们所有参数，包括随机数种子跟别人的照片都一样时，我们才能生成跟别人差不多一样的照片。
  - 把全部信息粘贴到关键词的文本框中... 点击“生成”按钮下面的第一个小按钮，SD就会自动帮你把信息分配到合适的地方... 要注意的就是，大模型是需要我们手动去换的！
