  name: 参数复现三要素与 PNG Info/Tagger 反推 —— “复制作业”的标准化动作
  points:
  - '**为什么需要这个概念？**'
  - '- 看到别人发的好看图想复现，却不知其用了什么模型、LoRA、提示词、Seed'
  - '- 手动对参数极易遗漏或输错，需要自动化提取与一键填入的标准化流程'
  - '- 也是验证“参数复现三要素论”（同模型+同LoRA+同Seed=同结果）的实操手段'
  - '**核心定义**'
  - '- PNG Info：读取 SD 原生导出 PNG 图片元数据中嵌入的完整生成参数（提示词、Seed、模型名、步数等）'
  - '- Tagger（WD14/DeepDanbooru）：视觉标签模型，对任意图片预测标签，反推近似提示词，不依赖元数据'
  - '- 复现动作：粘贴参数 → 点击分配按钮（图标为文档带箭头） → 手动切换大模型 → 生成'
  - '**关键性质**'
  - '- PNG Info 仅限 SD WebUI 原生导出且未二次编辑的图片；截图、转发压缩、其它软件保存均会丢失元数据'
  - '- Tagger 适用于任意图片（网图、微信图、真实照片），但只能预测语义标签，无法提取 Seed、模型名、步数等参数'
  - '- 复现成功率取决于本地是否已下载完全一致的 Checkpoint 与 LoRA 文件（文件名、哈希值均需一致）'
  - '**典型例子**'
  - '- C 站大神分享图：点击“Copy Data” → SD 粘贴 → 点击分配 → 手动换同名大模型 → 生成 “几乎一样” 的图'
  - '- 微信群友发一张无元数据图：拖入 Tagger → 得到标签列表 → 手动组装提示词 → 选相近大模型 → 迁移风格重绘'
  - '**边界条件**'
  - '- 即使参数全同，不同硬件（N卡/AMD卡/M卡）、不同精度、不同后端实现，输出仍有细微像素级差异'
  - '- 依赖特定版本插件（如 xformers、特定采样器实现）的参数，在无插件环境下复现会失败'
  - '- 商业项目中建议自建“参数资产库”：按项目存 JSON（含模型哈希、LoRA哈希、完整参数），而非依赖图片元数据'
  - '...'
