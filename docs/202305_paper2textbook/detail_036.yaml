  name: 教学范式：实操优先、原理按需、模板化降维 —— 让奶奶都能学会的 SD 入门法
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数 SD 教程前置扩散模型数学原理（U-Net、VAE、CLIP、去噪过程），新手看不懂、不想懂、直接关页'
  - '- 学习者真实诉求是“快速出图、解决具体问题”，而非“成为 AI 算法工程师”'
  - '- 需要一套以“案例驱动、模板复用、资源包兜底”为核心的降维教学范式'
  - '**核心定义**'
  - '- 实操优先：先跑通“文生图→图生图→ControlNet→高清修复”核心流程，产出第一张满意图，建立信心'
  - '- 原理按需：卡在某步（如 ControlNet 不生效）时，再补对应原理（预处理器作用、ControlNet 注入层机制）'
  - '- 模板化降维：提示词五段式公式、万能负面词、ControlNet 三大模式速查表、参数预设表，直接复用不背诵'
  - '**关键性质**'
  - '- 认知负荷最小化：隐藏采样器原理、VAE 数学定义、注意力机制细节，仅保留“选哪个、怎么调、什么效果”'
  - '- 资源包兜底：提供模型/LoRA/提示词/工作流一键下载包，解决“去哪找、下不来、不会装”三大资源痛点'
  - '- 容错设计：秋叶包自带疑难解答一键修复、报错日志可视化、常见坑位（C盘空间、显存对齐、代理设置）预置方案'
  - '**典型例子**'
  - '- 传统教程：第 1 章 扩散模型原理（30 页公式） → 第 2 章 环境搭建（易报错） → 第 3 章 参数详解（枯燥） → 第 4 章 实战（已劝退
    80%）'
  - '- 本教程：第 1 节 5分钟部署 → 第 2 节 10分钟出第一张真人图 → 第 3 节 15分钟玩转 ControlNet 换动作 → 第 4 节 按需查阅原理'
  - '**边界条件**'
  - '- 该范式适用于“应用层用户”，不适用于“模型微调/插件开发/算法研究”岗位培养'
  - '- 进阶阶段（如训练 LoRA、开发 ControlNet 新预处理器、优化采样器）必须补齐数学与工程原理'
  - '- 教学资源包需定期更新（模型迭代、插件兼容、WebUI 版本变更），否则“开箱即用”会变“开箱即坏”'
