  - 点击右边的画笔可以调整大小，把人物衣服部分全部涂黑... 接着输入关键词... 点击生成就可以啦！
  - 那我们就可以用到一个新的功能——“涂鸦重绘”... 在右边调整画笔大小和颜色，然后就可以自己设计衣服的颜色啦
- 'no': 5
  name: VAE 与高分辨率修复 —— 给灰蒙蒙的图加滤镜、破解显存瓶颈出大图
  points:
  - '**为什么需要这个概念？**'
  - '- 部分大模型（如 ChilloutMix）自带色彩偏灰、饱和度低，直出图“灰蒙蒙”不讨喜'
  - '- 直接生成 1024x1024 以上大图极易 OOM 或结构崩坏（双头、崩坏肢体）'
  - '- 需要轻量级后处理模块（VAE）与两阶段生成策略（高清修复）解决画质与显存矛盾'
  - '**核心定义**'
  - '- VAE（变分自编码器）：充当“滤镜/调色板”，修正模型解码端的色彩偏移，推荐通用 vae-ft-mse-840000'
  - '- 高分辨率修复：两阶段生成——先低分辨率（512/768）出图构图，再放大并细节重绘（Denoising 0.3-0.5），得高清大图'
  - '**关键性质**'
  - '- VAE 仅影响色彩/对比度/饱和度，不改变画面内容、构图、五官'
  - '- 高清修复的“重绘幅度”（Denoising Strength）建议 0.3-0.5：太低无增强、太高崩坏结构'
  - '- 放大算法推荐：Latent（潜空间，快）/ R-ESRGAN 4x（像素空间，细节更好但慢）'
  - '**典型例子**'
  - '- 未加 VAE：肤色灰暗、天空发白；加载 vae-ft-mse-840000 后：肤色通透、天空湛蓝、对比度大幅提升'
  - '- 4GB 显存生成 1024x1536 竖图：关闭高清修复→OOM/崩坏；开启高清修复（512→1024，Denoising 0.4）→成功出图且细节锐利'
  - '**边界条件**'
  - '- VAE 文件放入 models/VAE 目录，WebUI 设置中指定或选“Automatic”自动匹配'
  - '- 高清修复会显著增加生成耗时（约 1.5-2 倍），批量生成时需权衡效率'
  - '- 低显存（≤6GB）建议：基础分辨率 512x768 + 高清修复 2x + Latent 放大，避免 R-ESRGAN 显存溢出'
  - '...'
  sources:
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: origin
  excerpts:
  - 只要知道VAE的作用就是加滤镜和微调照片... 没加VAE的照片是灰蒙蒙的
  - 下面这个就是我比较常用的VAE
  - 高分辨率修复：电脑配置好就可以用；电脑配置稍微差点的别开，否则照片无法生成
  - 一般情况下：生成正方形的照片：宽度512*高度512，生成长方形的照片：宽度512*高度768
