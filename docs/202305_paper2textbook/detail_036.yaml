  name: 脚本矩阵对比法 —— 用“自动化暴力测试”量化参数边际收益
  points:
  - '**为什么需要这个概念？**'
  - '- 采样器、步数、CFG、分辨率等参数组合爆炸，手动逐个测试不可行'
