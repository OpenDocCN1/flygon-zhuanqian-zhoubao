  name: 模型全生命周期管理 —— 从 C 站找模型到本地落盘、鉴别、复现的闭环
  points:
  - '**为什么需要这个概念？**'
  - '- 模型文件分散在 C 站、HuggingFace、网盘、群文件，下载后不知放哪、是什么类型、怎么用'
  - '- 缺乏标准化管理会导致：重复下载、目录错放报错、版本冲突、找不到对应 LoRA'
  - '- 建立“获取→存放→鉴别→复用”闭环，是从“白嫖用户”进阶为“模型资产管理者”的关键'
  - '**核心定义**'
  - '- 获取：C 站筛选（按类型 Checkpoint/LoRA/VAE/ControlNet）→ 图片反推下载 → 网盘/直链下载'
  - '- 存放：严格按类型落盘 —— models/Stable-diffusion(大模型) / models/Lora / models/VAE / models/ControlNet
    / embeddings(Textual Inversion)'
  - '- 鉴别：秋叶启动器自带“模型分析工具”，拖拽 .safetensors/.ckpt 文件，自动识别类型、基模、触发词、预览图'
  - '- 复用：PNG Info/Tagger 反推参数 → 一键分配 → 手动确认大模型 → 生成'
  - '**关键性质**'
  - '- 文件名即资产名：建议重命名为 “类型_画风_版本_触发词.safetensors”（如 Lora_ChilloutMix_v1_ohwx.safetensors）'
  - '- 版本管理：同一模型不同版本（如 v1/v2/v3、fp16/fp32）需共存，目录建议加版本后缀'
  - '- 元数据完整性：下载时优先选 .safetensors 格式（含元数据、安全），避免 .ckpt（可能含恶意代码、无元数据）'
  - '**典型例子**'
  - '- 看到 C 站一张喜欢的真人图：Copy Data → 本地粘贴分配 → 发现缺 LoRA “koreanDollLikeness” → C 站搜名下载
    → 放入 models/Lora → 刷新 → 生成成功'
  - '- 群友发来一个不知名 .safetensors：拖入秋叶分析工具 → 显示“LoRA、基模 SD1.5、触发词<lora:flat2:-1>、预览图是扁平风格”
    → 重命名归档 → 实战可用'
  - '**边界条件**'
  - '- SD1.5 与 SDXL 模型目录完全隔离，不可混放（WebUI 通过子目录或启动参数区分）'
  - '- LoRA 训练基模不匹配（如 SD1.5 LoRA 用在 SDXL）会报错或出图极其崩坏'
  - '- 模型文件数量 >200 个时，WebUI 启动变慢、下拉列表卡顿，建议建立“常用/备用/归档”三级软链接目录管理'
