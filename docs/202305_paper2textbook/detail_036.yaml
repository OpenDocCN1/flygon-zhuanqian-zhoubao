  name: 后期超分与人脸修复 —— 事后诸葛亮的画质补救站
  points:
  - '**为什么需要这个概念？**'
  - '- 生成阶段受限于显存/参数，输出图常有噪点、压缩伪影、人脸模糊等缺陷'
  - '- 重新生成成本高且不可控，后期处理可在不改变语义前提下“救活”废图'
  - '- 不同画风（动漫/真人）需匹配专用超分模型，通用模型会抹平线条或画出伪影'
  - '**核心定义**'
  - '- 超分辨率：对已有图片放大并增强细节，动漫用 R-ESRGAN 4x+ Anime6B，真人用 R-ESRGAN 4x+'
  - '- GFPGAN：人脸专用增强器，不放大分辨率（Upscaler=None），仅恢复面部清晰度、修复压缩伪影'
  - '**关键性质**'
  - '- R-ESRGAN 4x+ Anime6B 对二次元线条锐化、色块平滑、噪点去除效果显著优于通用模型'
  - '- GFPGAN 强度=1 时效果最强，但仅作用于人脸区域，背景/衣物/发丝模糊不改善'
  - '- 后期处理不占用生成时显存，可在生成后离线批量处理，适合流水线作业'
  - '**典型例子**'
  - '- 生成的二次元插画线条毛糙：用 R-ESRGAN 4x+ Anime6B 4x 放大，得 4K 级锐利线条、平滑色块'
  - '- 表情包人脸压缩模糊：Upscaler=None + GFPGAN 强度=1，得清晰五官、不改变表情、背景保持原大小'
  - '- 真人写真皮肤噪点重：R-ESRGAN 4x+ 2x 放大 + 后期轻度降噪，得保真肤质的高清大图'
  - '**边界条件**'
  - '- 超分倍数建议 ≤4x，过大倍数会引入幻觉细节（如原本没有的纹理）'
  - '- GFPGAN 无法修复极大角度侧脸、遮挡严重、分辨率极低（<64px）的人脸'
  - '- 后期处理无法修正生成阶段的结构性错误（如多指、透视错误），只能锦上添花不能雪中送炭'
  - '...'
  sources:
