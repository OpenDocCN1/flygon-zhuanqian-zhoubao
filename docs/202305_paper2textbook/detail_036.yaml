  name: ControlNet 多模态控制 —— 让 AI 听懂“姿势、线稿、结构”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统文生图无法精确控制人物动作、建筑结构、线稿着色边界'
  - '- 图生图重绘幅度是模糊的概率控制，ControlNet 是像素级的确定性控制'
  - '- 是将 AI 绘图从“灵感工具”升级为“生产力工具”的关键技术'
  - '**核心定义**'
  - '- 通过预处理器从参考图提取结构信息（骨骼点、边缘线、直线几何），强制指导生成过程'
  - '- 统一交互：启用 → 上传参考图 → 预览预处理结果 → 切换预处理器/模型 → 生成'
  - '- 三大核心模式：OpenPose（姿势迁移）、Canny（线稿上色/保边）、M-LSD（室内结构保持）'
  - '**关键性质**'
  - '- OpenPose：精确复现参考图人体姿态（站/坐/手势），配合大模型+LoRA保持人脸不变'
  - '- Canny：开启“反转输出颜色”（白底黑线→黑底白线），严格遵循线稿轮廓着色，无越界渗色'
  - '- M-LSD：提取室内几何线条（墙/门/窗/梁），切换写实大模型+风格词，实现结构不变、风格化重设计'
  - '**典型例子**'
  - '- 让左边小姐姐摆出右边参考图的瑜伽姿势：上传参考图选 OpenPose，生成图动作一致、人脸保持'
  - '- 给漫画线稿上色：上传线稿开启反色选 Canny，输入“赛博朋克风格”，得精准着色成品图'
  - '- 室内设计方案出图：上传毛坯房实拍选 M-LSD，输入“日式风格/现代简约”，得保留结构的风格化效果图'
  - '**边界条件**'
  - '- ControlNet 需额外下载模型文件（放入 models/ControlNet 目录），显存占用约 +1-2GB'
  - '- 参考图分辨率建议 ≥512px，过小导致预处理器提取特征不准'
  - '- 多 ControlNet 叠加时，权重之和建议 ≤1.5，避免结构过度约束导致画面僵硬'
  - '...'
  sources:
