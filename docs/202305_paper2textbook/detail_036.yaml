  name: 局部重绘与涂鸦重绘 —— 像素级的“换装、换脸、改颜色”
  points:
  - '**为什么需要这个概念？**'
  - '- 整图重绘会破坏满意的部分（如人脸、背景），只想改局部（衣服、发色、手部）'
  - '- 传统抠图+合成费时费力且边缘不自然，SD 原生蒙版重绘能无缝融合光影材质'
  - '- 涂鸦重绘进一步解决“指定颜色”难题，实现从“语义控制”到“像素控制”的跨越'
  - '**核心定义**'
  - '- 局部重绘：在图生图中蒙版涂抹指定区域，仅对该区域按提示词重新生成，其余像素锁死不变'
  - '- 涂鸦重绘：在蒙版区域手绘颜色草稿（如袖子蓝、衣服粉、花纹黄），结合提示词引导生成，实现像素级颜色可控'
  - '**关键性质**'
  - '- 蒙版边缘羽化（Blur）建议 4-8px，避免生成边缘出现明显割裂感'
  - '- 重绘幅度对局部重绘同样适用：0.6-0.8 平衡原结构保留与新内容融合'
  - '- 涂鸦重绘中，手绘草稿只需大致块面颜色，无需精细笔触，SD 会自动补全材质细节'
  - '**典型例子**'
  - '- 换装：蒙版涂抹衣服区域，提示词写“红色礼服、蕾丝边、露肩”，生成无缝换装效果'
  - '- 换脸/修手：蒙版涂抹脸部/手部，提示词写“精致五官/完美手部”，配合 ADetailer 插件效果更强'
  - '- 指定配色：涂鸦重绘中给袖子涂蓝、裙子涂粉、花纹涂黄，提示词写“蓝白配色连衣裙”，得精准配色成图'
  - '**边界条件**'
  - '- 蒙版过小（<32px）会导致生成模糊；过大接近整图则退化为普通图生图'
  - '- 涂鸦重绘的颜色引导对大模型有依赖：真人模型下涂“绿色”可能长出苔藓而非绿布料'
  - '- 手部修复仍是高难度，建议结合 ControlNet Depth + 专用手部 LoRA + 多次重绘筛选'
  - '...'
