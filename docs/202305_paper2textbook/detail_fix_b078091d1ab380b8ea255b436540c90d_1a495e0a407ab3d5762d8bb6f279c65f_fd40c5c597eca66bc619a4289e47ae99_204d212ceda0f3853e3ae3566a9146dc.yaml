- 'no': 6
  name: 视频号短视频带货投流 —— ROI正向闭环的确定性打法
  points:
  - '**为什么需要这个概念？**'
  - '- 自然流极不稳定：连续限流、账号易报废、无法复制放大'
  - '- 付费投流（短视频挂车+千川/随心推）具备稳定、可复制、可放大、不废号四大优势'
  - '- 需要一套从选品、素材、测品、放量到矩阵复制的标准化操盘体系'
  - '**核心定义**'
  - '- 核心链路：选品（广场/榜单/同行跟投） → 爆款视频二创混剪去重 → 挂车 → 分级测品（1测验品/2测探价） → ROI达标放量 → 矩阵号复制'
  - '- 品素决定论(70/30)：品与素材贡献度超70%，投放技巧不超30%，90%问题根因指向品素'
  - '- 组织架构：3-6人小组+人均5台安卓机+专职投手（3组:1投手），核心指标“日测品数/素材数”'
  - '**关键性质**'
  - '- 高客单高利润标准：利润率>70%、新奇特高溢价、SKU套装化（多件装+价格锚定）'
  - '- 测品止损公式：利润>100元时消耗达利润/4-5未出单关停；利润<100元时消耗达利润/3-5关停'
  - '- 黄金时间窗：测品上午9点前；放量晚上12点建12h计划或凌晨4点建计划效果最佳'
  - '**典型例子**'
  - '- 东哥：兼职到全职，单号到20+矩阵，累计收益4万+，羽绒服/茶壶/养生茶多个单品爆发验证路径'
  - '- 头部团队：月利润超100万不少于10个，日测70-100品，印证“测品量=爆品量=收益上限”'
  - '- 微笑：抖音养生号半年经验，单月十万佣金，对标账号橱窗销量日志追踪零延迟跟进爆品'
  - '**边界条件**'
  - '- 供应链响应速度决定爆款变现上限：48小时发货红线、店铺沟通不畅导致“到手鸭子飞了”'
  - '- 店铺体验分风控红线：新店初始4.5分，<4分触发隐藏下架，合作门槛≥4.2分，偏远地区预设不发货'
  - '- 平台门槛提升（0粉挂车取消、投放门槛提高、赔付标准调整）实为利好，清洗无序竞争者'
