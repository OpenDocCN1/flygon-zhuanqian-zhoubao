paper: docs/202305/20230516_086.md
desc: 该素材为抖音短视频带货实操者猎音狮（豪叔）的复盘总结，系统记录了其从0粉丝到300万粉丝、月入从3千到10万的全过程。核心内容分为三大板块：第一章详解四大起号模式（手写、混剪、校园一角、口播）及爆款视频制作的五种思维与六大底层逻辑；第二章复盘书单带货的四次形态迭代（A4书单、笔记书单、讲座书单、划线书单）及真人出镜的语言、场景、布光实操技巧；第三章深度拆解选品四大渠道与避坑指南，并对比详解随心推（稳健测品、ROI出价、高峰期抢量、反推千川出价）与千川（莱卡定向5亿覆盖、保守出价公式、一键起量、算法博弈正负反馈）两大投放工具的实战策略与心法。
concepts:
- name: 完播率倒挂
  desc: 指视频时极短（如7秒）但用户平均观看时长远超视频时长（如14秒），导致完播率超过100%（如200%），从而触发算法强推荐的现象。
  is_original: false
  excerpt:
  - 此类视频控制在 4-7s，由于时间短，文字内容多，容易提高完播率，比如视频 7s，进来的人看完视频平均花费 14s，完播率就是 200%
- name: 混剪去重七步法
  desc: 针对抖音查重机制（MD5、关键帧、像素、音频指纹等）制定的七步技术处理流程，旨在通过修改视频元数据与内容特征实现过原创审核。
  is_original: true
  excerpt:
  - 上有规则，下有对策，我们只要把视频改了，避开机器查到就行，以下 7 步操作，就可以把算法也搞懵逼！
- name: 螺旋算法/漏斗转化/叠加推荐
  desc: 抖音流量分发的底层机制模型。非挂车视频看完播、点赞、评论、转发、关注、主页访问；挂车视频额外看点击率、转化率、GPV、GPROI、人均观看时长，ECPM
    = 估算点击率 * 估算转化率 * 目标出价 * 1000。
  is_original: false
  excerpt:
  - A. 非挂车视频评判维度：完播率、点赞率、评论率、转发率、关注率、主页访问率
  - B. 挂车视频评判维度：点击率、转化率、GPV、GPROI、人均观看时长、完播率...
  - ECPM = 估算点击率 * 估算转化率 * 目标出价 * 1000
- name: 挂车流量衰减机制
  desc: 挂车视频因增加了点击率、转化率等商业化考核指标，权重分配更严苛，导致流量通常小于非挂车视频；需通过提升商品点击率、转化率、GPV来反哺流量。
  is_original: true
  excerpt:
  - 这就回答了大家问的比较多的挂车流量少的原因。那么挂车视频如何增加流量呢？如下：提升商品点击率、转化率、GPV
- name: 爆款视频五种思维
  desc: 制作百万播放视频的核心心法体系：热点思维（蹭热度）、利他思维（给价值）、发散思维（一题多解）、创造性思维（差异化）、复盘思维（数据驱动迭代）。
  is_original: true
  excerpt:
  - A、热点思维 B、利他思维 C、发散思维 D、创造性思维 E、复盘思维
- name: 爆款带货短视频六大底层传播逻辑
  desc: 支撑带货视频传播的核心要素：选品、文案、拍摄、剪辑、投流、主播/人设，缺一不可。
  is_original: true
  excerpt:
  - 爆款带货短视频具有传播性的六大底层逻辑：选品、文案、拍摄、剪辑、投流、主播/人设
- name: 抖音官方出圈效应
  desc: 官方建议的突破圈层方法：人群出圈（大众化表达）、内容出圈（反差/冲突）、形式出圈（新奇特呈现），并强调前3秒留人、黄金前5秒阐述核心。
  is_original: false
  excerpt:
  - A、出圈效应：人群出圈、内容出圈、形式出圈
  - B、如何让用户感兴趣：前3秒留人，黄金前5秒直接阐述核心重点
- name: 书单带货形态进化史
  desc: 书单带货内容形式的四代迭代：A4书单(2019，极简丢书) -> 笔记书单(2021，笔记呈现) -> 讲座书单(2022，权威人设) -> 划线书单(2019-至今，高光金句可视化)，核心逻辑均为'大道至简、低成本量产'。
  is_original: true
  excerpt:
  - 第一节、A4 书单（2019 年）... 第二节、笔记书单（2021）... 第三节、讲座书单（2022 年）... 第四节、划线书单（2019——至今都可以玩）
- name: 真人出镜角色扮演法
  desc: 真人口播非对着镜头念稿，而是设定具体沟通对象（如给妈妈聊天、训斥学生、憋尿急说话）调整语气语速微表情，将创作者转化为演员以增强真实感与代入感。
  is_original: true
  excerpt:
  - A、录制给家长看的视频：想象成自己再跟妈妈聊天。
  - B、录制给学生看的视频：想象成学生犯错了，你把他叫来办公室，跟他谈心。
  - C、录制气氛紧张的视频：想象自己想上厕所，很憋很憋，就想赶快说完去上厕所。
- name: 场景立体化分级
  desc: 直播/拍摄背景的层次划分：青铜（扁平书架压抑）、王者（墙角+绿植/暖光灯/摆件构造景深与立体感），主张利用墙角构图替代平铺书架。
  is_original: true
  excerpt:
  - 青铜：场景扁平化，后面一排书架... 王者：会找一个墙角，再稍微放点 绿植、暖光灯、摆件 作为背景稍微装饰一下，使空间瞬间变得有层次感，人物主体更立体。
- name: 选品四大实战渠道
  desc: 爆单秘籍选品、跟爆款视频反推选品、爆款商品榜单选品、规避选品误区（避开高播量强竞品、差评比>6-8%、体验分<4.8）。
  is_original: true
  excerpt:
  - 1、用 4 个爆单秘籍选品 2、跟爆款视频选品... 3、看爆款商品榜单选品... 4、选品误区...
- name: 随心推“系统智能投放”信仰
  desc: 主张新手放弃自定义定向，完全信任抖音算法模型（‘抖音机器比你更懂用户’），无脑选系统智能投放、自动出价、最长时长（24小时），让算法慢工出细活探索人群。
  is_original: true
  excerpt:
  - 新手不要选“自定义定向投放”，你要相信，抖音机器，比你更懂抖音用户，更懂抖音人群... 你就无脑选“系统智能投放”，自动出价，就 ok
- name: 随心推时间价值模型
  desc: 投放时长越长（24小时），算法探索成本越低（类比给找人更多时间可走路不打车）；时长短则算法需调用更多服务器资源抢量，单价高易跑飞。
  is_original: true
  excerpt:
  - 站在抖音的角度去想这个问题... 你给抖音的时间少了，算法要给你调用更多的服务器资源，所以帮你找客户的成本就变高了
- name: 随心推反推千川出价公式
  desc: 利用随心推跑出的稳定数据（平均客单价=总销售额/总订单数）计算千川初始出价：初始出价=平均客单价*佣金率（过新手期）；过新手期(20单)后出价=初始出价/1.2，后续动态微调。
  is_original: true
  excerpt:
  - 计算公式：平均客单价=总销售额 ÷ 总订单数 ... 一般佣金多少直接出多少... 过了新手，立马改一个出价，计算公式：原有出价 ÷ 1.2
- name: 千川莱卡定向5亿底线
  desc: 千川自定义定向（莱卡）操作的红线：覆盖人群数不得低于5亿，低于则需放宽定向，防止模型收窄导致跑量困难或成本失控。
  is_original: true
  excerpt:
  - 这些定向，也就是行业内叫的莱卡，不管你是怎么卡的，卡完后，你要注意你的是它的覆盖人群，不能低于 5 亿。卡的时候，如果低于 5 亿了，能放开的放开。
- name: 千川保守安全出价公式
  desc: 为防跑飞设定的保守出价上限：出价 ≤ (佣金 ÷ 1.2)，前提是开启‘成本保障/控成本投放’模式。
  is_original: true
  excerpt:
  - 如果是保守的玩家，担心计划跑飞，出价 ≤ （佣金÷ 1.2 ）是相对安全的... 可前提是计划 成本保障生效中 （控成本投放）。
- name: 算法博弈正负反馈平衡律
  desc: 操作千川计划时，每一个负反馈（如降价）必须配套正反馈（如加预算、延长时长、换优质素材），确保正反馈≥负反馈，避免向算法传递‘不想跑了’的信号导致模型衰退。
  is_original: true
  excerpt:
  - A、正反馈＞负反馈... 有了一个压价（负反馈），你就要有一个加大预算（正反馈）... 不能让负反馈比正反馈多。不然就是告诉机器，这个计划你不想跑了。
methods:
- name: __overview__
  desc: 素材整体方法论为：'低成本内容起号验证（手写/混剪/口播） -> 爆款内容结构化复制（五种思维/六大逻辑/官方技巧） -> 带货形态快速迭代（书单四代/真人出镜标准化）
    -> 选品数据化筛选（四渠道/三避坑） -> 分级投放体系（随心推测品养模型/反推千川 -> 千川放量博弈算法）' 的全链路闭环实操体系。
  excerpt:
  - 目录：第一章、起号那些事儿... 第二章、曲折的“变现”路... 第三章、当“流量”爱上“金钱”...
  - 既是文案、摄影、剪辑、投手，同时也是运营，所以熟悉整个闭环
- name: 手写起号标准化流程
  desc: 赛道选择（职场/情感/教育） -> 文案准备（高密度文字） -> 拍摄控制（4-7秒） -> 发布利用完播率倒挂机制获取推荐。
  excerpt:
  - 此类视频控制在 4-7s，由于时间短，文字内容多，容易提高完播率... 此种模式适合职场（手写辞职信等）；情感（手写情书...）；教育（手写学生作文...）
- name: 混剪去重标准作业程序 (SOP)
  desc: 1.理解查重原理(MD5/关键帧/像素/音频) 2.执行七步去重操作(调参/加特效/变速/镜像/加贴纸/换背景音乐/调色等) 3.发布后监控螺旋算法指标(非挂车看互动/挂车看转化/GPV/ROI)。
  excerpt:
  - 1、抖音查重原理... 2、去重技术... 以下 7 步操作... 3、补充：螺旋算法，漏斗转化，叠加推荐
- name: 口播文案低成本获取法
  desc: A. 抄袭抖音爆款图文转口播（规避视频非原创判罚，属伪原创安全区） B. 搬运小红书同类目爆款笔记对着镜头读（爆率70%+） C. 蹭热榜/官方活动页流量红利。
  excerpt:
  - A、抖音里有很爆的图文... 你可以直接拿来读一遍发，爆率 70%以上。 B、小红书找笔记... 拿来对着镜头巴拉巴拉读一遍，爆率也很高。
- name: 真人出镜标准化制作规范
  desc: 语言层：角色扮演法（设定对象调语气） -> 场景层：墙角立体化布景（拒绝扁平书架） -> 光影层：自然光优先/室内少打光 -> 工具层：剪映提词器替代硬件提词器。
  excerpt:
  - 1、语言表达... 赠送 3 个“角色扮演”小技巧... 2、场景布置... 青铜/王者... 3、布光... 4、工具：剪映的“提词器”
- name: 随心推全生命周期投放策略
  desc: 测品期：系统智能投放/自动出价/24小时/亏损容忍/堆数据养模型 -> 优化期：ROI目标出价(不低于保本ROI) -> 高峰期：手动出价/2小时/1.2倍佣金起步/消耗70%降价5%迭代
    -> 过渡期：数据反推千川出价(均价*佣金率/1.2)。
  excerpt:
  - 2、随心推如何建计划？... 你就无脑选“系统智能投放”... 3、随心推新功能，直接投 Roi... 4、随心推如何在高峰期抢量？... 5、如何利用随心推测千川出价？
- name: 千川计划冷启动与放量标准化动作
  desc: 搭建：自定义定向(莱卡)覆盖>5亿/保守出价(佣金/1.2)/开成本保障 -> 学习期：高价(亏本)+一键起量(2-6h)/高峰期前半小时预热 ->
    稳定期：正负反馈平衡(降价必加预算/换素材)/规避素材同质化/创意挤压。
  excerpt:
  - 2、千川搭建基本知识... 覆盖人群，不能低于 5 亿... 3、如何出价不会跑飞？... 4、如何高峰期抢量？... 用好工具“一键起量”... 5、计划如何快速通过学习期？...
    6、如何与算法“博弈”？
theorems:
- name: 信息差变现定律
  desc: 核心主张：真正能赚钱的项目往往大道至简，仅需关键一两句点拨（信息差）即可实现跨越式收益；晚知道一天，就晚赚一天钱。
  excerpt:
  - 都说真传一句话，假传万卷书，真正能赚钱的项目，都是大道至简，几句话的事情，有可能大佬透露两个字，一个字，你就能轻松赚个几 w！甚至几十 w！
  - 从那以后，我就深深体会到了信息差是有多么的值钱。
- name: 内容形态迭代红利窗口期
  desc: 核心主张：每种带货内容形态（A4书单、笔记书单、划线书单等）都有红利期，早期靠自然流量即可爆单，后期必须依赖投流（随心推/千川）维持；跟风不吃肉但能喝汤，关键在于尽早入场并配套投流能力。
  excerpt:
  - 那时候可把我羡慕坏了，我知道的时候，玩的人多了，所以赚了几千块钱... 划线书单... 因为别人花钱投流了，你没投，就这么简单
  - 跟风不吃肉，也能喝点汤。
- name: 投流本质是‘人民币玩家’的概率游戏
  desc: 核心主张：投流（随心推/千川）本质是用金钱购买概率与数据，测品必亏（随心亏），心态决定成败；不贪快、控成本、堆素材、信算法、懂博弈，是长期盈利的唯一路径。
  excerpt:
  - 随心推不是一本万利，行业内她有一个绰号叫“随心亏”，没有亏的心态，你就玩不好随心推... 所以，玩随心推，不要在乎一单两单的亏盈
  - 绝大部分人不赚钱的原因就两个字，贪快... 你可以投流，但是把价格控制住，只在利润边缘出价... 坚持一个月，你会收到意想不到的惊喜！
- name: 算法是最大的‘打工仔’——信任与博弈并存
  desc: 核心主张：抖音算法模型比人工定向更懂用户（随心推主张智能投放）；但千川放量阶段需人工介入博弈（正负反馈平衡、规避创意挤压），核心是让平台赚钱（ECPM最大化）从而分得流量。
  excerpt:
  - 你要相信，抖音机器，比你更懂抖音用户，更懂抖音人群。
  - A、正反馈＞负反馈... 假如你是平台，你也是想赚这笔投流的钱的。所以，你的每一个操作，都要让平台有益。
- name: 素材为王，投流为辅——转化率是核心杠杆
  desc: 核心主张：一切不转化的素材，点击率、完播率再高都没用，必须换素材；投流只能放大优质素材的效果，无法拯救烂素材；长期主义靠持续产出符合市场审美的创意素材。
  excerpt:
  - 完全没必要直接换素材，一切不转化的素材，点击率、完播率再高都没用！
  - 说到底，还是内容为王！想要爆单，就要多拍视频，测试出符合市场审美与要求的视频，放量投放！
findings:
- name: 手写起号实测完播率倒挂案例
  desc: '[evidence] 作者实操情感号、教育号手写视频，通过4-7秒视频长度配合高密度文字，实现用户平均观看时长约为视频时长2倍（7秒视频看14秒），完播率达200%，成功触发系统大推流。'
  excerpt:
  - eg1：情感号手写起号（案例节选本人实操）... eg2：教育号手写起号（案例节选本人实操）... 比如视频 7s，进来的人看完视频平均花费 14s，完播率就是
    200%
- name: A4书单同行单视频赚佣50万案例
  desc: '[claim] 作者引用同行案例：2019年A4书单模式巅峰期，单条视频佣金可达50万，印证了早期红利期内容形态极简即可高变现。'
  excerpt:
  - 有同行用这种视频，一个视频就赚 50w 佣金！
- name: 笔记书单自然流实操案例
  desc: '[evidence] 作者2021年实操笔记书单模式，依靠自然流量（未投流）即可跑出爆款视频，验证了该形态在当时的内容红利期有效性。'
  excerpt:
  - eg：笔记书单（素材本人实操，自然流）
- name: 划线书单投流依赖性验证
  desc: '[evidence] 作者观察到划线书单模式虽操作简单（大道至简），但当前阶段（2023年）若不投流（随心推/千川）则无法起量，印证了内容红利期结束后必须依赖付费流量的结论。'
  excerpt:
  - 别人能火，你为什么火不了？因为别人花钱投流了，你没投，就这么简单，至于怎么投流，后面第三章的第一、第二节我会具体分享！
- name: 随心推高峰期手动出价抢量实测策略
  desc: '[evidence] 作者实测高峰期（早/中/晚高峰）使用手动出价、2小时时长、智能推荐、起步出价1.2倍佣金，若1.2小时消耗70%则降价5%迭代，找到能消耗又盈利的平衡点，实现批量放量。'
  excerpt:
  - 高峰期可以手动出价，2 小时，智能推荐，佣金的 1.2 倍开始测出价... 如果能消耗，用时 1.2 小时就能消耗 70%，就降低 5%出价，直到测到既能消耗，又盈利的出价
- name: 随心推数据反推千川出价实测有效
  desc: '[evidence] 作者实操通过随心推跑出数据（如总销售额39921.20，订单591，均价67.55，佣金50%），按公式计算千川初始出价33.78（过新手期），20单后降至28.15稳定跑量，验证了跨工具数据复用的可行性。'
  excerpt:
  - 假设这个数据是我用随心推跑的... 平均客单价，代入公式，得，39921.20 ÷ 591 = 67.55 ... 就出67.55x50%=33.78 ...
    过了新手，立马改一个出价... 33.78 ÷ 1.2 = 28.15
- name: 千川计划ECPM竞争力不足导致突然不消耗
  desc: '[evidence] 作者总结实战现象：计划跑得好突然不消耗，排除余额/发货率问题后，核心原因是系统根据出单数据重算ECPM，发现点击率/转化率不理想，排名靠后流量被同行抢走。解决方案为智能放量/优化素材/优化定向商品提升ECPM。'
  excerpt:
  - 最大的可能就是你的计划竞争力不足，ECPM 值排名靠后，系统就不给你流量了... 系统就根据你的出单情况重新计算你的 ECPM 值，发现你的点击率、转化率并不理想，排在同行后面了
- name: 高点击低转化素材必换原则验证
  desc: '[evidence] 作者实战发现：点击率极高但不出单的素材，原因通常是价值塑造不到位（用户心理价位<实际价）或市场饱和（用户已购买同类品）。结论：此类素材无需纠结，直接更换，不可继续投钱测试。'
  excerpt:
  - 一种是视频内容对产品的价值塑造不到位... 第二种原因是最近这个品推的人比较多... 遇到这样的视频素材应该怎么办呢？... 完全没必要直接换素材
