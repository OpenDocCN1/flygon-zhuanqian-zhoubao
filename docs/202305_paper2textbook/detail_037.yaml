- │   └── 10W+爆款复现率验证  —— P001
- └── 规避红线与风控
- '    ├── 个体户执照注册推流受限风险  —— P001'
- '    ├── 内容合规与专业度底线（防AI幻觉）  —— P002'
- '    └── 平台算法调整对垂类流量权重的影响  —— P002'
life_analogy:
- 想象AI写作变现是一家**标准化预制菜中央厨房**：
- '- **人工筛选标题库** = **研发总监设计的爆款菜单**（决定上限，标题即产品）'
- '- **GPT-4.0双账号并行** = **两条自动化生产流水线**（左右开弓，批量产出）'
- '- **法律文章四段式模板** = **标准化半成品料包**（案情/法条/判决/建议，只需组装）'
- '- **AI按标题生成全文** = **流水线工人按菜单把料包做成成品菜**（执行填充，不负责创新）'
- '- **公众号双号分发** = **两个品牌门店同时上架**（覆盖不同时段客流）'
- 就像肯德基不靠大厨现炒靠标准化流水线复制爆款，AI写作变现的核心是‘人类设计菜单（标题）+ 标准化料包（模板）+ AI流水线（生成）’。
summary:
- concept: AI标题预生成法
  desc: 先人工筛选高点击标题库，再将标题作为Prompt指令输入AI批量生成全文，实现标题决定内容、AI执行填充的反向生产流程
- concept: 标题即产品、AI仅为流水线工人定律
  desc: 标题质量决定文章上限（点击率/推荐量），AI只负责在标题框架内填充合格内容，人工把控标题库是核心杠杆
- concept: 法律赛道黄金洼地
  desc: 具备专业门槛高（AI擅长检索法条）、标准化程度高（适合模板化）、商业价值高（流量主单价高）三重属性，完美契合大模型能力边界
- concept: 法律文章四段式模板
  desc: 真实案情引入 → 核心法条精准引用 → 法院判决结果还原 → 律师实操避坑建议，AI只需填充槽位保证专业度与完读率
- concept: 双GPT-4.0账号矩阵并行
  desc: 两个AI账号并行生成、两个公众号账号并行分发，单人30分钟产出8篇1200字爆款文的物理基础
- concept: 个体户执照注册推流受限
  desc: 社群共识验证：个体工商户执照注册公众号存在不给推流入池或推流效果差风险，新手建议用个人身份证注册
exercises:
- 'no': 1
  title: 练习1：手工打磨一个高CTR法律标题并设计AI生成Prompt
  contents:
  - 任务：选取一个近期热点法律案例（如‘职场隐形加班维权’、‘网购假一赔三实操’、‘离婚隐匿财产追责’）
  - 1. 拆解该领域过往10W+爆款标题的共性结构（蹭热点/制造反差/痛点关键词）
  - 2. 手工创作3个候选标题，标注每个标题使用的‘三要素’组合
  - 3. 选出最优标题，设计喂给GPT-4.0的完整Prompt指令（含角色设定、四段式模板槽位、字数要求、口语化润色要求）
  - 4. 实测对比：用同一标题分别让GPT-3.5和GPT-4.0生成，对比专业度、完读率、法条引用准确性差异
  - 回答问题：
  - '- 为什么说‘标题即产品’？若标题平庸，AI生成再完美能否挽回点击率？'
  - '- 法律赛道模板化的核心边界在哪里？哪些环节绝不能交给AI幻觉？'
- 'no': 2
  title: 练习2：搭建最小化双账号并行生产验证闭环
  contents:
  - 任务：在资源受限条件下（仅1个GPT-4.0账号/1个公众号），设计低成本验证方案
  - 1. 单账号模式下，如何通过‘时间切片’模拟双号并行？（如早8点/晚8点各产出4篇）
  - 2. 建立最小化选题库：收集同赛道头部账号近30天爆款标题20个，去重归类建立标题标签库
  - 3. 制定7天冲刺计划：每日产出2篇（而非8篇），记录从选题到发布的实际耗时、阅读量、流量主收益
  - 4. 复盘数据：计算单篇ROI（收益/人工耗时），判断是否值得升级双号矩阵
  - 回答问题：
  - '- 单账号瓶颈主要在‘生成速度’还是‘分发流量池’？如何用数据验证？'
  - '- 若个体户执照主体已注册，如何低成本测试‘推流受限’假设？'
- 'no': 3
  title: 练习3：跨赛道迁移——将‘标题预生成+模板化’复用到非法律领域
  contents:
  - 任务：选择一个‘专业门槛高、可模板化、单价高’的新赛道（如：医疗科普/税务筹划/留学申请/心理咨询/编程教程）
  - 1. 验证该赛道是否符合‘黄金洼地’三重属性：列举AI擅长检索的专业知识库、固化的内容结构模板、高客单价广告主/付费产品
  - 2. 设计该赛道的‘N段式套路模板’（参考法律四段式），明确每段的AI生成槽位与人工校验点
  - 3. 产出5个该赛道的高CTR种子标题，用标题预生成法跑通1篇完整文章发布
  - 4. 对比法律赛道：该赛道的模板化难度、AI幻觉风险、变现周期有何差异？
  - 回答问题：
  - '- 什么样的赛道适合‘标题预生成法’？什么样的赛道不适合？（给出判断清单）'
  - '- 如何用‘认知接口’理论（旧瓶装新酒）降低新赛道用户理解门槛？'
units:
- 'no': 1
  name: AI标题预生成法 —— 让标题做产品，AI当流水线工人
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人写作最大痛点是“不会起标题、写不出爆款、产出慢”，导致变现无门'
  - '- 传统“AI帮我写标题”效果差，AI生成的标题往往平庸无奇，点击率低'
  - '- 需要一种“标题决定内容、AI执行填充”的反向生产流程，把人类擅长的“审美判断”和AI擅长的“批量填充”分离'
  - '**核心定义**'
  - '- 先由人工筛选高点击率标题/爆款标题库，再将标题作为Prompt指令输入AI（GPT-4.0）批量生成全文'
  - '- 实现“标题决定内容、AI执行填充”的反向生产流程，大幅降低写作门槛并保证爆款率'
  - '**关键性质**'
  - '- 标题质量决定文章上限（点击率/推荐量），AI只负责在标题框架内填充合格内容'
  - '- 人工把控标题库质量 + AI执行标准化生产，是普通人实现“低门槛、高产出、稳收益”的唯一可行路径'
  - '- 配合双GPT-4.0账号并行，单人30分钟可完成8篇1200字文章的生产、润色与发布'
  - '**典型例子**'
  - '- 月林实操：利用双GPT-4.0账号并行，配合标题预生成法与模板化流程，单人30分钟产出8篇法律爆款文，日均流量主收益300元，稳定运行6个月+'
  - '- 单篇阅读量破10W+，验证了“标题即产品”的商业逻辑'
  - '**边界条件**'
  - '- 依赖GPT-4.0模型能力，低版本模型可能无法稳定产出高质量长文'
  - '- 赛道需具备“高单价、高标准化、专业门槛高”特征（如法律、医疗、财经），泛娱乐赛道模板化难度大、单价低'
  - '- 需人工具备基本的“网感”与“标题审美”，完全不懂选题的小白仍难跑通'
  - '- 个体户执照注册公众号存在推流受限风险，建议新手用个人身份证注册'
  sources:
  - paper: docs/202305/20230516_081.md
    role: origin
  excerpts:
  - 新鲜出炉的 10W+，用 AI 标题指令预生成的篇幅 99%法律爆款文章。
  - 怎么用标题在 AI 预生成文章：一口气能写 8 篇 1200 字的文章，眼睛还不疼，脊椎也不痛。
  - 文章目录：1、写作平台收益单价 2、公众号选择法律领域的原因 3、每日收益呈现 4、爆款方法 5、选材方向 6、怎么人工起吸引力大的标题 7、怎么用标题在
    AI 预生成文章 8、法律文章套路模板
  - 怎么人工起吸引力大的标题：爆款方法常看常新
  - 法律文章套路模板：【真实案情引入】→【核心法条精准引用】→【法院判决结果还原】→【律师实操避坑建议】
  - 去年 12 月我就开始公众号写作，今年 2 月接触到 AI 写作，现在手握两个 AI（4.0）账号...每日阅读推荐流量稳定，赚取 300 元不等
  - '小姚 : 我想问一下...听说用个体工商户营业执照注册的公众号不给推流入池'
  - '晓崎 : 请问，用个体户执照公众号，和个人主体公众号，推流效果差异多少呢？'
- 'no': 2
  name: 法律赛道黄金洼地 —— 专业门槛高、模板化强、单价高的三重奏
  points:
  - '**为什么需要这个概念？**'
  - '- AI写作变现赛道众多，但大多陷入“单价低、同质化重、难出爆款”的红海'
  - '- 新手缺乏专业背景，无法驾驭高客单价赛道，也缺乏模板化能力规模化生产'
  - '- 需要一个“AI擅长、门槛高、单价高、可标准化”的赛道作为切入最优解'
  - '**核心定义**'
  - '- 法律内容具备三重属性：专业门槛高（AI擅长检索法条）、标准化程度高（适合模板化）、商业价值高（流量主单价高、广告主客单价高）'
  - '- 完美契合当前大模型能力边界，是新手切入AI写作变现的最优解'
  - '**关键性质**'
  - '- 文章结构固化为四段式模板：真实案情引入 → 核心法条精准引用 → 法院判决结果还原 → 律师实操避坑建议'
  - '- AI生成内容只需填充模板槽位，即可保证专业度与阅读完读率'
  - '- 推荐流量稳定，日收益300元不等，单价远超泛娱乐/情感赛道'
  - '**典型例子**'
  - '- 月林账号：运营6个月，接触AI写作3个月后推荐流量稳定，日收益300元不等，拥有10W+爆款记录'
  - '- 法律赛道广告主多为律所、法务服务，客单价高，流量主分成单价高'
  - '**边界条件**'
  - '- 要求内容必须合规、专业，不能出现法律常识性错误，否则信任度崩塌'
  - '- 依赖平台推荐算法分发，若平台调整法律类内容权重，收益会波动'
  - '- 需持续跟踪热点案例、法条更新，选题库需定期维护'
  - '- 非法律专业人士需建立“法条检索SOP”与“案例来源验证SOP”，防止AI幻觉'
