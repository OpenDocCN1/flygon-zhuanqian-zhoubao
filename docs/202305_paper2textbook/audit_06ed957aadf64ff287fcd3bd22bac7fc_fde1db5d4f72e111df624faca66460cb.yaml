unsupported_claims:
- location: '10.3'
  claim: 影刀RPA 13次拖拽实现文案全流程自动化
  reason: 素材中提到影刀RPA操作简单、13次拖拽完成流程，但未给出具体的13个组件名称及其配置参数的完整清单
- location: '10.4'
  claim: ChatGPT中文调教12步法可替代代码实现人设固化
  reason: 素材P001仅列出12步骤标题，未提供各步骤的具体Prompt话术、预期输出示例及验证方法
- location: '10.4'
  claim: 万能负向词模板含60+标签覆盖90%场景
  reason: 素材P002列举的负向词仅有worst quality/bad anatomy/bad hands/extra fingers/watermark等5个示例，未给出完整60+标签清单及覆盖率测试数据
- location: '10.5'
  claim: Excel CONCAT函数批量生成Prompt实现数据指令解耦
  reason: 素材P003仅给出=CONCAT("写一篇","“",A2,"”的文章，标题+正文")单一公式示例，未说明变量列设计、多变量组合、异常值处理等工程化细节
- location: '10.6'
  claim: 一帧秒创生成视频后剪映批量替换本地素材可规避AI选素不准
  reason: 素材P002仅提到'后面剪映直接替换即可'，未给出批量替换的具体操作步骤、素材命名规范、时间轴对齐方法及效率数据
- location: '10.6'
  claim: 关键帧动态化可消除PPT感提升完播率
  reason: 素材P005仅描述'图片配上文字的末尾，往下拉一点再打上关键帧就能发现图片动起来了'，未提供关键帧参数设置、完播率对比数据、A/B测试结果
- location: '10.6'
  claim: Prompt固定核心外貌特征词可维持人物一致性
  reason: 素材P005仅给出'暗红色眼睛+黑色头发'单一案例，未说明特征词选择原则、不同模型版本的兼容性测试、长序列生成的漂移量测评
- location: '10.6'
  claim: SEO霸屏布局通过下拉词/相关搜索系统性植入+RPA批量发布构建关键词覆盖矩阵
  reason: 素材P002仅提出概念，未给出关键词挖掘工具、去重逻辑、植入密度阈值、账号矩阵规模、收录率及流量转化数据
- location: '10.9'
  claim: 手动跑通是自动化前提定律：SOP先行工具在后
  reason: 素材P002、P003虽多次提及该原则，但未定义'手动跑通'的验收标准（如成功率阈值、异常分支覆盖率）、SOP文档结构模板、从人工SOP到RPA流程的映射规范
