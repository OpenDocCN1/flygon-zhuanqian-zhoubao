units:
- 'no': 1
  name: 生财小航海 —— 普通人跨越“知行鸿沟”的强制执行容器
  points:
  - '**为什么需要这个概念？**'
  - '- 大部分人知道赚钱道理却做不到，核心缺口在于执行力而非认知'
  - '- 缺乏外部约束容易陷入拖延、完美主义、频繁切项目的死循环'
  - '- 需要一个低成本、有导师、有节点、有同伴监督的标准化训练场'
  - '**核心定义**'
  - '- 社群发起的项目制训练营模式，设定明确目标、时间节点与导师陪跑'
  - '- 强制成员在规定周期（通常21天/1个月）内跑通0-1商业闭环'
  - '- 核心机制：截止节点、公开承诺、同伴监督、导师点评四位一体'
  - '**关键性质**'
  - '- 解决“知道却做不到”的执行鸿沟，而非传授新知识'
  - '- 筛选标准严格：正向现金流快、无需囤货、可SOP化、可借力AI、有公域获客路径、后端有高客单/复购产品'
  - '- 产出标准化SOP与MVP验证结果，而非完美商业计划书'
  - '**典型例子**'
  - '- CBJhdD0dTokH8tx8HKYc1nJSnnc：应届生跟航海两周变现7000元，跑通闲鱼虚拟资料全流程'
  - '- Gn5NdifvBorUbdxvGl6ceQgXnpg：心理咨询师跟航海一年从零到年入200万'
  - '- DGw1dYHSsohHu7x1AXhc4cQVnEN：用8元成本跑通陌生赛道月入2万+'
  - '**边界条件**'
  - '- 仅适用于0-1冷启动阶段，不解决1-N规模化运营问题'
  - '- 依赖社群组织能力与导师质量，非自发式学习可替代'
  - '- 项目筛选模型需动态更新，过期赛道（如早期ChatGPT注册）失效快'
  sources:
  - paper: docs/202305/SUMMARY.md
    role: origin
  - paper: docs/202305/20230516_014.md
    role: improve
  - paper: docs/202305/Gn5NdifvBorUbdxvGl6ceQgXnpg.md
    role: apply
  excerpts:
  - 新手小白如何借助生财小航海每月多赚 2 万元（附：小航海项目筛选模型）
  - 从 0 开始借助 ChatGPT 变现 7k 入生财经历分享
  - 如何利用生财航海每月多赚 2 万元？
  - 心理咨询师根源：依托生财‘好文章+对的人’，一年少走弯路，从一无所有到年入200万
- 'no': 2
  name: 个人IP复利策略 —— 百年不改名，全域用同名的品牌资产飞轮
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人缺乏信任背书，获客成本高、转化率低、抗风险弱'
  - '- 频繁改名、跨平台ID不一致导致品牌资产归零、复利中断'
  - '- 需要一个可跨周期、跨平台、边际成本趋零的核心杠杆资产'
  - '**核心定义**'
  - '- 统一ID、头像、简介、风格，在所有公域平台（抖音、小红书、微信、B站等）保持一致'
  - '- 核心口号：百年不改名，全域用同名；出名是赚钱的代价，也是获取信任的护城河'
  - '- 不出镜也能打造IP：资料号、工具号、笔记号、虚拟形象号均可'
  - '**关键性质**'
  - '- 复利效应：时间×一致性=品牌资产指数级增长，降低用户认知成本'
  - '- 信任转化：个人IP背书下的高客单产品（咨询/课程/社群）转化率远超无IP账号'
  - '- 资产属性：可估值、可转让、可授权、可矩阵化放大的数字化资产'
  - '**典型例子**'
  - '- 粥左罗：12年3000+篇内容织就影响力网络，全域同名策略验证复利威力'
  - '- 漫漫：半年涨粉20万年变现40万，暴露弱点建立真实人设，慢即是快'
  - '- 木子田：PPT赛道47天变现16.7万，统一封面大字报风格将主页转粉率从个位数提至10%+'
  - '**边界条件**'
  - '- 前期需忍受“叫好不叫座”的孤独期，拒绝短期流量诱惑（如蹭热点改名）'
  - '- 必须配合“利他思维”持续产出有价值内容，空壳IP无复利'
  - '- 涉及隐私/安全风险时，需物理隔离（小号引流、大号收割）而非实名硬刚'
  sources:
  - paper: docs/202305/SUMMARY.md
    role: origin
  - paper: docs/202305/20230516_057.md
    role: improve
  - paper: docs/202305/WX87d3F4SoVZLHxDNGzcDDVRn6R.md
    role: apply
  - paper: docs/202305/20230516_085.md
    role: apply
  excerpts:
  - 价值千万的个人 IP 策略-百年不改名，全域用同名
  - 打造“不出镜”个人 IP，10 个月变现 7 位数的方法论
  - 知识博主小红书半年涨粉20万IP打造实操复盘（生财版）
  - PPT知识付费IP变现 —— 47天16.7万的‘对标拆解+私域精细化’可复制范式
- 'no': 3
  name: 公私域协同模型 —— 蓄水池与提款机的底层通道
  points:
  - '**为什么需要这个概念？**'
  - '- 公域流量归平台、脉冲式衰减、不可控，单靠公域变现天花板极低'
  - '- 私域流量归自己、长尾复利、高信任、可反复触达，是变现的核心阵地'
  - '- 缺乏标准化“钩子-承接-转化”链路，公域流量无法沉淀为私域资产'
  - '**核心定义**'
  - '- 所有平台玩法最终归宿：公域引流（蓄水池） → 私域沉淀 → 朋友圈/社群运营 → 高客单/高复购转化（提款机）'
  - '- 核心四大动作：钩子设计（资料/诱饵）、诱饵投放（笔记/视频/直播）、私域承接（主页/私信/群聊/企微）、后端转化（话术/产品/服务）'
  - '- 资料整理、钩子设计、后端话术、附加产品/服务是私域转化率的核心决定因素'
  - '**关键性质**'
  - '- 流向单向：公域只负责“筛选精准用户”，私域负责“深度信任与高客单转化”'
  - '- 杠杆放大：一份垂直资料（零边际成本）可无限复售、跨平台分发、长期引流'
  - '- 闭环标准：公域内容KPI看“精准获客量”而非“爆款阅读量”'
  - '**典型例子**'
  - '- 三恒：资料整理日均引私域180+用户，后端匹配高考咨询/英语训练营/读书营实现月入5万+'
  - '- 漫漫：小红书半年涨粉20万，广告40万/年+知识付费10万/2月，私域沉淀高价值合伙人'
  - '- 橘子海：视频号+小红书同步分发素材，放弃直播/小店，三个月私域成交20万'
  - '**边界条件**'
  - '- 微信生态内引流（视频号→公众号/个人号）转化率最高，跨平台引流（抖音/小红书→微信）需规避风控'
  - '- 私域运营无标准化话术/SOP/分层体系，流量池即“死水池”，无法变现'
  - '- 违规引流（硬广、诱导、高频加好友）导致封号，资产归零，需“合规钩子+小号隔离”'
  sources:
  - paper: docs/202305/SUMMARY.md
    role: origin
  - paper: docs/202305/20230516_046.md
    role: improve
  - paper: docs/202305/BzIfdvAQloqLImxjEhKcERAXn5f.md
    role: apply
  - paper: docs/202305/I8BLdIIfbobzkYxCLGBctYqbnae.md
    role: apply
  excerpts:
  - 资料整理日均引私域 180+ 用户，最重要的是提供附加产品-解决问题的方案
  - 通过优化后端朋友圈和话术，实现小红书资料引流月入 5 万+的复盘
  - 视频号还能做吗，三个月通过视频号赚 20W
  - 知识博主小红书半年涨粉20万IP打造实操复盘（生财版）
- 'no': 4
  name: AI自动化流水线 —— 从“会用工具”到“建流水线”的生产力范式跃迁
  points:
  - '**为什么需要这个概念？**'
  - '- 单纯会用ChatGPT/MJ/SD不赚钱，AI是放大器而非救世主'
  - '- 业务流程未拆解为标准化SOP，无法注入Prompt工程，更无法串联自动化'
  - '- 核心竞争力已从“技能门槛（0到1）”转移到“标准化能力（1到N）”'
  - '**核心定义**'
  - '- 结合ChatGPT（文本）、Midjourney/SD（图像）、RPA/低代码（剪映/Coze/Make/Zapier/影刀）'
  - '- 构建：选题挖掘 → Prompt工程化 → 批量生成 → 自动发布 → 数据回收 → 迭代优化的全自动化内容生产系统'
  - '- 核心公式：AI赚钱 = 业务拆解SOP + 提示词工程 + 自动化串联'
  - '**关键性质**'
  - '- 降本增效：单人日产50-100条短剧解说视频、批量生成表情包/电商图/SEO文章'
  - '- 确定性：参数化Prompt+Excel批量生成+RPA定时执行，消除人为波动'
  - '- 复用性：同一套流水线跨平台（抖音/快手/视频号/小红书/海外社媒）分发'
  - '**典型例子**'
  - '- 13步文案自动化：选题/大纲/钩子/正文/标题/标签13个结构化节点，RPA无人值守跑通'
  - '- SD云端零成本：Colab免费GPU部署WebUI+模型下载脚本+API调用+定时任务，无限时长批量出图'
  - '- 短剧CPS批量化：ChatGPT改写剧本+剪映智能剪辑+批量发布，新手首月变现1.4万+'
  - '**边界条件**'
  - '- 业务未跑通手动SOP前，上自动化工具只会放大混乱（手动跑通是自动化前提）'
  - '- 平台风控升级（查重、限流、封号）需持续迭代去重/合规策略，非一劳永逸'
  - '- 核心Prompt/模型/账号为核心资产，需物理隔离与权限管控，防止核心能力外泄'
  sources:
  - paper: docs/202305/SUMMARY.md
    role: origin
  - paper: docs/202305/20230516_070.md
    role: improve
  - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    role: apply
  - paper: docs/202305/20230516_084.md
    role: apply
  excerpts:
  - 通过 ChatGPT+RPA 13 次拖拽实现文案全流程自动化
  - 利用Colab和Stable Diffusion实现云端、免费、自动、批量、无限AI出图
  - 【短剧CPS】如何利用ChatGPT批量生产解说类短剧视频
  - 新手用生财的方法做短剧 CPS，一个月 1.4w+收益
- 'no': 5
  name: 平民无货源电商模型 —— 供应链轻量化的低风险创业范式
  points:
  - '**为什么需要这个概念？**'
  - '- 传统电商需囤货、压资金、承担库存风险，普通人试错成本过高'
  - '- 平台流量红利期（小红书/闲鱼/快团团/视频号）允许无货源/一件代发模式存活'
  - '- 需要一套可标准化、可矩阵放大、确定性强的电商操作手册'
  - '**核心定义**'
  - '- 无需囤货，利用1688/拼多多/淘宝/快团团等供应链一件代发'
  - '- 核心流程：选品验证 → 多店铺矩阵铺货 → 素材二创去重 → 私域引流承接 → 供应链对接履约'
  - '- 关键指标：选品决定上限，运营决定下限；设备环境隔离（一机一号一IP）是生存底线'
  - '**关键性质**'
  - '- 低门槛：单店启动资金3-4千元（保证金+垫付+工具费），个人店/个体店批量注册'
  - '- 可复制：标准化SOP覆盖选品/发品/客服/发货/售后，单店日出单5-20单可稳定复现'
  - '- 矩阵化：7-400+店铺霸屏搜索前排，单品多链接布局捕捉概率性爆发'
  - '**典型例子**'
  - '- 小红书无货源：卧龙/宅男实测三个月营收50万（营业额），单店稳态日销5000-8000元'
  - '- 闲鱼矩阵：远方/公子唯心4年400+店铺，单店月销千单，7店霸屏前排月销千单'
  - '- 快团团团长：二胎宝妈零资源首月GMV 7万+，私域信任转化复购率极高'
  - '**边界条件**'
  - '- 供应链不稳定（发货慢/退货率高/假货）会直接导致店铺体验分崩盘（<4.2分隐形下架）'
  - '- 平台规则收紧（如闲鱼隐藏销量、小红书打击无货源）需动态调整合规策略'
  - '- 纯无货源模式天花板低（利润薄、无品牌资产），长期需转型“自有品牌/私域高客单”'
  sources:
