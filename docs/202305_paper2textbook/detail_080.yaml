- 'no': 2
  name: 个人IP复利策略 —— 百年不改名，全域用同名
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人缺乏信任背书，获客成本高、转化率低，单次交易无复利'
  - '- 频繁改名、换号、分散运营导致品牌资产归零，无法积累长期资产'
  - '- 认知“出名是赚钱的代价”而非目的，主动选择建立可复利的品牌资产'
  - '**核心定义**'
  - '- 在所有公域平台（抖音、小红书、微信、B站等）使用统一ID、头像、简介'
  - '- 降低用户认知成本，积累品牌复利，形成“名字=信任背书”的资产护城河'
  - '- 不出镜也能打造IP：资料号、工具号、笔记号、虚拟形象均可承载品牌'
  - '**关键性质**'
  - '- 网络效应：时间×唯一名字=指数级影响力网络（粥左罗12年3000+篇内容验证）'
  - '- 信任迁移：统一IP降低陌生人决策成本，实现“认准名字直接下单”'
  - '- 资产化：将经验沉淀为课程、咨询、社群、文档等边际成本为零的数字产品矩阵'
  - '**典型例子**'
  - '- 粥左罗：12年全网同名，3000+篇内容织就影响力网络，出版邀约主动上门'
  - '- 漫漫：半年涨粉20万年变现40万，主动暴露弱点建立真实人设，忠于自我吸引高价值合伙人'
  - '- 不讲李：不出镜PPT拆解IP，10个月7位数变现，统一封面风格将主页转粉率从个位数提升至10%+'
  - '**边界条件**'
  - '- 必须经得起时间考验，短期投机者无法享受复利红利'
  - '- 内容质量与人设一致性是前提，人设崩塌品牌资产瞬间归零'
