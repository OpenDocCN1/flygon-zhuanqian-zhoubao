  name: 执行力优先定律 —— 赚钱的事多做十遍
  points:
  - '**为什么需要这个概念？**'
  - '- 好主意很多，做下去的很少，认知鸿沟只能在行动中通过反馈修正'
  - '- 执行力而非认知是核心稀缺资源：减肥1/200成功率、餐厅SOP落地率<1%跨域数据证明'
  - '- “知易行难”的人性根源：注意力被他人掠夺（凑热闹、随大流、操他人心三大黑洞）'
  - '**核心定义**'
  - '- 彻底执行三重境界：动作颗粒度标准化(SOP)、执行覆盖面无死角(全员全时段)、时间维度长期主义(穿越周期)'
  - '- “笨功夫”方法论：海量案例拆解、工程细节掌握、3-5年长周期刻意练习，拒绝捷径思维'
  - '- 执行复利非线性：个人每日分享获出版邀约、古茗横幅规模化崩塌反面教材'
  - '**关键性质**'
  - '- 注意力守恒与正反馈循环：注意力为稀缺资源，分散操作导致单项目投入低于正反馈阈值，唯有聚焦突破阈值建立增长飞轮'
  - '- 航海机制外部约束：截止节点+公开承诺+同伴监督+导师点评，将模糊意愿转化为确定性行动'
  - '- 标准化SOP是规模化前提：将“发视频、上架、看数据、管店铺、催发货”固化为标准动作，使赚钱的事可重复执行十遍'
  - '**典型例子**'
  - '- 东哥视频号带货：从兼职到全职、单号到20+矩阵，累计收益4万+，流程化标准化是收益复利唯一路径'
  - '- 木子田PPT IP：0基础47天变现16.7万，对标拆解建库+爆款四要素制作+私域钩子设计+朋友圈三段式+咨询式成交，执行力>完美主义'
  - '- 古茗案例：早期拉横幅/每日分享/早会彻底执行有效，规模化后SOP失效、执行变形导致崩塌'
  - '**边界条件**'
  - '- 方向错误时执行力越强亏损越大，需先跑通0-1验证方向再All in'
  - '- 执行力需建立在标准化SOP之上，而非盲目蛮干'
  - '- 个人精力有限，必须通过矩阵化/团队化/工具化突破单人物理上限'
