life_analogy:
- 想象副业成长像**登山探险**：
- '- **无项目期** = 山脚下望山兴叹，焦虑安全感缺失，买遍装备却不出发'
- '- **多项目期** = 同时攀登五座山峰，体力分散在每座山脚徘徊，从未登顶过任何一座'
- '- **聚焦期** = 选定唯一主峰(五维筛选)，集中全力攻顶，建立大本营(IP资产)可反复往返'
- '- **注意力** = 登山体力，守恒且有限，分散投入必然全军覆没，聚焦突破方能登顶'
- '- **主业关联** = 自带高原适应体质与向导经验，降低试错死亡率'
- '- **IP资产** = 山顶建成的永久基站(课程/文档/社群)，边际成本为零可无限接待后来者'
- '- **社群** = 登山协会，提供地图(元认知)、装备(异质知识库)、向导(大佬)，但攀登仍靠自己'
- 就像登山必须一座座攻克、建立永久基站，副业也要聚焦单赛道、资产化经验，才能实现复利跃迁。
summary:
- concept: 副业三阶段模型
  desc: 无项目焦虑→多项目迷茫→单赛道聚焦，注意力守恒决定分散必败、聚焦必成
- concept: 聚焦筛选五维标准
  desc: 成绩、方法论、可复制、主业关联、喜好——漏斗式过滤锁定唯一赛道
- concept: 个人IP杠杆化
  desc: 基于纳瓦尔第三种杠杆，将经验资产化为课程/文档/社群等零边际成本产品矩阵
- concept: 跨项目思维迁移
  desc: 从AI/引流/电商等成熟赛道抽象底层逻辑，迁移应用于核心赛道实现降维打击
- concept: 引流文档资产化
  desc: 将碎片经验标准化为PDF钩子，一次制作终身分发，筛选高意向用户沉淀私域信任
- concept: 社群增值型策略
  desc: 体验券试水→带着问题吸收→高质量输出建立人设→内化课程体系→寻找合伙人合作
- concept: 矩阵号批量化运营
  desc: 标准化SOP+物理隔离规模化捕捉红利，设定止损红线动态进退，资产变现体面退出
- concept: 注意力守恒定律
  desc: 单位时间深度注意力固定，单项目必须突破正反馈阈值建立飞轮，分散操作收益趋零
- concept: 主业关联性护城河
  desc: 技能/资源/认知/信任/试错场五大复用维度，主业是副业最低成本最高壁垒的起手牌
- concept: IP资产化优于项目收益
  desc: 项目收益线性受限，IP资产指数复利：抗周期、规模化、组合化，估值溢价10-50倍
- concept: 社群认知加速器
  desc: 付费买元认知非项目，异质知识库实现降维打击，加速打工者向操盘手身份跃迁
exercises:
- 'no': 1
  title: 副业阶段自诊与五维筛选实操
  contents:
  - 1. 列出你近一年尝试/关注过的所有副业项目（≥3个）
  - 2. 对每个项目标注：当前处于哪个阶段（无项目/多项目/聚焦）
  - 3. 针对最想坚持的项目，按五维标准打分（1-5分）：
  - '   - 有过成绩（有真实正向现金流闭环）'
  - '   - 有独到方法论（非搬运，有自己总结SOP）'
  - '   - 方法论可复制（能教给他人/写成文档）'
  - '   - 与主业关联（复用技能/资源/认知/信任/试错场）'
  - '   - 个人喜好（抗拒枯燥程度）'
  - 4. 总分<20分的项目直接淘汰，最高分项目作为聚焦目标
  - 回答问题：
  - '- 你的注意力目前分散在几个项目上？单项目日均投入多少深度工作时间？'
  - '- 是否存在“主业技能可迁移但未利用”的情况？列出3个可复用的主业资产'
- 'no': 2
  title: 个人IP资产包设计与引流文档制作
  contents:
  - 1. 梳理你在聚焦赛道的完整实战经验，拆解为：
  - '   - 核心方法论（3-5个关键SOP/模型）'
  - '   - 高频避坑指南（10个以上）'
  - '   - 工具/渠道/资源清单'
  - '   - 典型案例/数据复盘'
  - 2. 设计一份“引流文档”大纲（PDF/飞书文档）：
  - '   - 标题：含痛点词+结果承诺（如《小红书从0到1避坑指南：3天起号日引100+精准粉》）'
  - '   - 目录：按新手路径排序（认知→选品→起号→内容→变现）'
  - '   - 核心干货：选取1-2个最高价值SOP完整展示'
  - '   - 信任锚点：真实收益截图/学员反馈/对标账号拆解'
  - '   - 行动号召：引导加微信领取完整版/进群/咨询'
  - 3. 制定文档分发计划：公域内容挂载位置、发布频次、引导话术
  - 回答问题：
  - '- 文档中哪部分内容是“独家/稀缺/实操/避坑”的核心稀缺性？'
  - '- 如何防止文档内容过期失效？设定迭代更新周期与机制'
- 'no': 3
  title: 社群认知迁移与首帖加精实战
  contents:
  - 1. 选择一个高质量付费社群（如生财有术/知识星球），完成：
  - '   - 带着“当前项目最大卡点”搜索精华帖/航海日志'
  - '   - 提取3个可迁移模块：流量模型/转化话术/SOP框架/选品逻辑'
  - '   - 本地化改造：结合核心赛道特性调整参数/话术/流程'
  - 2. 撰写一篇“首帖级”复盘输出（≥3000字）：
  - '   - 标题：含方法论标签+具体结果（如《全行业通用：小红书引流逻辑与套路拆解》）'
  - '   - 结构：背景痛点→核心逻辑→标准化流程→实证数据→避坑指南→迁移建议'
  - '   - 要求：真实数据支撑、可直接执行、含反思与边界条件'
  - 3. 发布至社群并追踪：阅读数、点赞/收藏、精华/加精、私域引流量、合作意向
  - 回答问题：
  - '- 你从社群吸收的“元认知”是什么？如何改变了你的决策方式？'
  - '- 首帖发布后，如何将“被动认可”转化为“主动连接”（合伙人/客户/资源）？'
- 'no': 4
  title: 矩阵号止损与资产变现决策推演
  contents:
  - 假设你运营小红书好物分享矩阵号（当前10个账号），近期数据：
  - '- 单价从500元跌至300元，预测下月跌至200元'
  - '- 违规率从2%升至8%，平台加大营销号打击'
  - '- 单号日均维护成本：2小时人工/50元外包'
  - '- 闲置账号（粉丝1000-5000、有权重）市场收购价：300-800元/个'
  - 请制定决策方案：
  - 1. 设定止损红线：单价/ROI/违规率三大指标的具体阈值
  - 2. 计算：继续维持10号 vs 缩减至3核心号+出售7闲置号 的月度损益对比
  - 3. 设计账号出售SOP：清洗数据/交接话术/交易担保/资金到账确认
  - 4. 规划保留核心号的IP化转型路径：引流文档→私域→高客单课程
  - 回答问题：
  - '- 何种平台政策变化会触发你“全线撤退而非缩减”？'
  - '- 如何确保出售账号不违规、不关联、不损害核心号权重？'
