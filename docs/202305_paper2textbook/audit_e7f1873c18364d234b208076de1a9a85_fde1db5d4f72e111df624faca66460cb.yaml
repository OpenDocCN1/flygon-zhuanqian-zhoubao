unsupported_claims:
- location: '83.3'
  claim: 核心机制：截止节点倒逼执行 + 公开承诺增加沉没成本 + 同伴监督提供社会压力 + 导师点评修正认知偏差
  reason: 素材中未找到该四大机制的明确定义
- location: '83.4'
  claim: 执行准则：内容即诱饵/课程即解药（筛选有焦虑人群→缓解焦虑）、资料是踏脚石/产品必须是自己的（引流载体与变现主体分离）、极致售后护信法（亏佣金保客户、售后即营销）
  reason: 素材中未找到该执行准则的完整表述
- location: '83.5'
  claim: 核心口诀：解决真正的问题，赚钱的事多做十遍。运作机制：认知对齐 → 赛道筛选 → 标准化SOP执行 → 低成本MVP验证 → 复盘优化 → 规模化放大（全程以执行力贯穿）
  reason: 素材中未找到该完整运作机制描述
- location: '83.6'
  claim: 三大核心资产：唯一名字资产（能用一辈子就是好名字）、统一视觉锤（头像/封面风格/配色）、一致人设标签（核心关键词如'自律搞钱狂魔'）
  reason: 素材中未找到该三大核心资产的明确定义
- location: '83.7'
  claim: 核心四大动作：钩子设计（诱饵）、诱饵制作（资料/群/号）、承接路径（主页/私信/群聊/企微）、转化话术（朋友圈运营/1v1成交/分层漏斗）
  reason: 素材中未找到该四大动作的明确定义
- location: '83.8'
  claim: 三位一体架构：文本层（ChatGPT标题预生成法+法律文章四段式模板+双账号矩阵并行）、图像层（SD结构化提示词模板+ControlNet多模态控制+LoRA训练五步工作流）、视频层（ChatGPT改写剧本+剪映智能剪辑+批量发布工具）
  reason: 素材中未找到该三位一体架构的完整定义
- location: '83.9'
  claim: 三大核心平台差异化打法：小红书、闲鱼、视频号
  reason: 素材中未找到该三大平台差异化打法的明确定义
- location: '83.10'
  claim: 三大核心要素：1) 个人IP信任背书（真实人设/暴露弱点/专业展示）；2) 标准化交付产品（SOP/模板/社群/陪跑）；3) 持续内容输出（选题>内容，爆款选题库+写作SOP工业化生产）
  reason: 素材中未找到该三大核心要素的完整定义
