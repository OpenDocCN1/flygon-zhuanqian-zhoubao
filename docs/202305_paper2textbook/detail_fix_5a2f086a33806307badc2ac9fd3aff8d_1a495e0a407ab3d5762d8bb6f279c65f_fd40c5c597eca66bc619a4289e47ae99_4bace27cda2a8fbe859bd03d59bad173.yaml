life_analogy:
- 想象 Mediabuy 品牌词竞价是**在品牌官方旗舰店门口发传单赚佣金**：
- '- **品牌词** = 想进旗舰店买货的精准顾客搜索入口'
- '- **Google Ads 竞价** = 你在门口支个小摊位（成本极低，因为品牌方默许/无人竞争）'
- '- **联盟追踪链接** = 你手里的专属推荐码/二维码'
- '- **EPC - CPC** = 顾客扫码买货你赚的佣金减去摊位费（正向差价即利润）'
- '- **Awin 双周付** = 结账快、信誉好、不赖账的财务公司'
- 就像守在品牌流量必经之路，用近乎零成本的摊位，把官方原本免费的自然流量‘合法截胡’变现。
- Wise 案例如同**在银行官方 App 门口推荐开户**：
- '- 官方自带推荐奖励（£50/单），无需走联盟审核'
- '- 品牌词竞价成本 £0.01-0.02，转化率极高'
- '- 广告成本可忽略不计，日入万镑靠执行力与认知差距'
summary:
- concept: Mediabuy Brand Bid
  desc: 付费竞价品牌词直链联盟链接，吃 CPC 与 EPC 差价
- concept: 品牌词近零成本定理
  desc: 品牌词相关性极高、无竞争，实际 CPC 稳定在 0.01 当地货币
- concept: CPC/EPC 套利模型
  desc: 只要 CPC < EPC 即稳赚，实测 ROI 359%-496%
- concept: 三步执行流程
  desc: 开户→选 Offer→直链投放，无需建站，Direct Linking 降维打击
- concept: Offer 筛选四指标
  desc: 大品牌词、允许竞价、EPC>0.01、双周付，只捡确定性高的钱
- concept: 极低出价策略
  desc: 最高 CPC 设 0.01，港币账户再降 7 倍，成本趋近于零
- concept: 合规授权光谱
  desc: 显性允许>默许>仅允许竞品词，总能找到合规大品牌
- concept: 账户资产隔离
  desc: 广告户/联盟户/收款户三分离，单点失效不伤筋动骨
- concept: 铁三角验证法
  desc: 联盟佣金单+广告花费单+到账单三单对账，拒绝幸存者偏差
- concept: 长期可行性断言
  desc: 十余年存续，三方博弈平衡点稳定，单人年入百万轻松达成
- concept: Wise 推荐计划套利
  desc: 官方自带推荐奖励£50/单，品牌词 CPC £0.01-0.02，即时结算、无扣量
- concept: 认知差距决定收益上限
  desc: 大多数人都知道，但没人敢大规模操作，根本原因在于认知差距
exercises:
- 'no': 1
  title: 手算一次套利账单
  contents:
  - 某账户推广某 SaaS 产品品牌词，数据如下：
  - 联盟后台显示：点击量 12,500，佣金收入 $3,750（含汇率换算）
  - Google Ads 后台显示：花费 $850，展现量 450,000，点击率 2.78%
  - 请计算：
  - 1. EPC（每次点击收益）
  - 2. CPC（每次点击成本）
  - 3. ROI（投资回报率）
  - 4. 利润率
  - 回答问题：
  - '- 如果该品牌词 CPC 突然涨到 $0.05，EPC 不变，项目还能做吗？为什么？'
  - '- 为什么要求 Offer 必须双周支付？月付联盟有什么隐性风险？'
- 'no': 2
  title: Offer 筛选实战演练
  contents:
  - 在 Awin 后台发现三个 Offer，请按筛选规则判断是否通过，并说明理由：
  - Offer A：知名电商平台，品牌词月搜索量 200 万，条款明确允许联盟竞价品牌词，EPC $0.12，月付。
  - Offer B：小众工具软件，品牌词月搜索量 5 万，AM 口头默许竞价，EPC $0.08，双周付。
  - Offer C：头部金融服务商，品牌词月搜索量 150 万，条款禁止品牌词但允许竞品词，EPC $0.03，双周付。
  - 回答问题：
  - '- 哪个 Offer 最优？次优？为何排除最差的？'
  - '- 如果 Offer A 改为双周付，它会成为首选吗？为什么？'
- 'no': 3
  title: 合规红线压力测试
  contents:
  - 你的账户组正常运行 3 个月，突然某核心 Offer 的 AM 发邮件通知：'检测到品牌词竞价违规，要求 24 小时内暂停相关广告活动，否则封号扣佣。'
  - 请设计应急预案：
  - 1. 即时动作（1 小时内）
  - 2. 短期调整（24 小时内）
  - 3. 中期策略（1 周内）
  - 回答问题：
  - '- 如何判断该 Offer 是''显性允许''转''禁止''，还是原本就是''默许''灰区？'
  - '- 账户资产隔离原则在这一刻如何保护你的整体业务？'
- 'no': 4
  title: 港币账户成本优势验算
  contents:
  - 假设汇率：1 USD = 7.8 HKD。
  - 同一品牌词，美元账户最高 CPC 设 $0.01，港币账户最高 CPC 设 HK$0.01。
  - 请计算：
  - 1. 港币账户实际美元成本是多少？
  - 2. 成本降低倍数是多少？
  - 3. 如果日预算 $100，美元账户可买约 10,000 次点击，港币账户约多少次？
  - 回答问题：
  - '- 为什么作者说''港币账户成本再降 7 倍，但与项目是否赚钱关系不大''？'
  - '- 港币账户开户难度大、汇率波动风险，实操中如何权衡？'
- 'no': 5
  title: Wise 同构案例拆解
  contents:
  - Wise 推荐计划：单笔佣金 £50，品牌词 'Wise/TransferWise'，作者出价 £0.01-£0.02。
  - 请分析：
  - 1. 该模式的 EPC 固定为多少？
  - 2. 为什么说'广告成本完全不决定是否赚钱，可以忽略不计'？
  - 3. 相比 Awin 联盟 Offer，Wise 官方推荐计划的核心优势在哪三点？
  - 回答问题：
  - '- 如果 Wise 突然降低推荐奖励到 £10，该模式还成立吗？临界点在哪里？'
  - '- 为什么作者强调''认知差距决定收益上限''？这个项目的认知门槛在哪里？'
units:
- 'no': 1
  name: Mediabuy品牌词竞价 —— 用近零CPC撬动联盟佣金杠杆
  points:
  - '**为什么需要这个概念？**'
  - '- 传统联盟营销依赖SEO/内容自然流量，周期长、不稳定、难放大'
  - '- 广告联盟账期长、存在扣量风险、佣金相对较低'
  - '- 需要一种可控、即时结算、高ROI的付费流量变现闭环'
  - '**核心定义**'
  - '- 利用Google Ads竞价商家品牌词（或竞品词），广告链接直接指向联盟追踪链接'
  - '- 核心公式：利润 = (EPC - CPC) × 点击量，前提是 CPC < EPC'
  - '- 品牌词因相关性极高、竞争极小，实际CPC可压至0.01当地货币单位'
  - '**关键性质**'
  - '- 质量得分满分：品牌词与广告主官网完美匹配，Google给予最高质量分'
  - '- 无竞争护城河：商家通常不竞价自己品牌词，竞争对手受合规限制不敢竞'
  - '- 即时结算优势：对接官方推荐计划/双周付联盟，规避联盟长账期与扣量'
  - '- 货币套利空间：港币账户0.01 HKD ≈ 0.0013 USD，成本再降7倍'
  - '**典型例子**'
  - '- 账户组1：佣金$5715 / 花费$1220 / 净利$4495 / ROI 368%'
  - '- 账户组2：佣金$7218 / 花费$1210 / 净利$6008 / ROI 496%'
  - '- 账户组3：佣金$3988 / 花费$867 / 净利$3121 / ROI 359%'
  - '- Wise推荐计划同构案例：品牌词CPC £0.01-0.02 / 单笔佣金£50 / 日佣破万镑'
  - '**边界条件**'
  - '- 必须筛选“允许品牌词竞价”的Offer（显性允许/默许/允许竞品词三层光谱）'
  - '- 依赖Google Ads政策与商家合规团队博弈平衡，非永久漏洞'
  - '- 需解决海外收款、Google开户、联盟审核等基建门槛'
  - '- 单人操作上限受限于精力与风控，规模化需团队化标准化流程'
  sources:
  - paper: M0hMdjWj3o8WtNxZdv4cLnfenIh.md
    role: origin
  - paper: 20230516_050.md
    role: improve
  excerpts:
  - 'Mediabuy Brand Bid: 通俗的理解就是付费流量购买，通过付费的方式购买流量来推广商家的链接，赚取佣金和流量费用支出中的利差。'
  - 申请到广告利用Google Ads，出价他们的品牌词，但是广告链接是你自己的即可。
  - 因为你是出价品牌词，品牌词实际谷歌出价是无限接近于零，也是免费，所以只要你设置没问题，单价到0.01完全没有问题
  - 当你的CPC本身是0.01的单价的时候，基本上任何产品都会赚钱，很少见到有EPC低于0.01的广告联盟里的Offer。
  - 佣金收入：3403英镑+835欧元+369美元；汇率划算后，合计佣金收入：5715美元；广告成本：1220美元；利润：4495美元；回报率：ROI = 368%
  - 佣金收入：4913英镑+685欧元+67美元；合计佣收入：7218美元；广告成本：1210美元；利润：6008美元；回报率：ROI = 496%
  - 佣金收入：3031英镑+37美元；合计佣收入：3988美元；广告成本：867美元；利润：3121美元；回报率：ROI = 359%
  - 个人用户推荐可以获得 50 英镑的佣金，这样我们就可以用 Mediabuy 的方式，谷歌或者 Bing 购买相关关键词，赚取利差。
  - 因为 Wise 确实信誉好，我每天点 50 英镑点得手都累了，因为只要三个用户满足条件，这边立即显示可以取现 50 英镑
  - 国外有很多商家，允许你出价他们的品牌词，而且一定可以出价他们竞争对手的品牌词。此方法不是违规的吗？这句话对，也不对，
  - 这个项目可以做多久？我们从十几年前就这样玩，只是某些广告主以及广告联盟的合规团队要求比较严格而已。
  - 如果不追求极致，控制一个风险比，一年一百万人民币以上非常轻松。
  - 这里面如果是用港币账户，成本还可以降低至少七倍
- 'no': 2
  name: 三步标准化执行流程 —— 从开户到直链投放的最小闭环
  points:
  - '**为什么需要这个概念？**'
  - '- 降低技术门槛：无需建站、搭建落地页、配置复杂追踪'
  - '- 规避审核风险：直链联盟链接减少Google Ads拒登概率'
  - '- 可复制性强：标准化SOP让新手能快速跑通0-1'
  - '**核心定义**'
  - '- 步骤1：准备Google Ads账户（个人开户或代理商开户均可）'
  - '- 步骤2：注册Awin等双周支付联盟，筛选大体量品牌词Offer并申请通过'
  - '- 步骤3：创建搜索广告活动，竞价品牌词/竞品词，最终URL直填联盟追踪链接'
  - '**关键性质**'
  - '- Direct Linking策略：广告落地页直接用联盟链接，省去建站成本与维护'
  - '- Awin联盟优势：双周支付、大品牌多、允许品牌词竞价、信誉好'
  - '- 账户体系分离：个人号/代理号、MCC管理、多币种账户（港币/美元）'
  - '**典型例子**'
  - '- 实操中三组账户均采用此流程，无一例外实现350%+ ROI'
  - '- Wise案例同样适用：注册Wise推荐链接 → Google/Bing Ads竞品牌词 → 直链推荐链接'
  - '**边界条件**'
  - '- Google Ads账户质量决定存活周期，需养号或购买老号/代理户'
  - '- 联盟Offer申请需通过审核，新号通过率低，需包装资质或找渠道'
  - '- 直链模式无法植入自有追踪代码，数据分析依赖联盟后台与Google Ads转化'
