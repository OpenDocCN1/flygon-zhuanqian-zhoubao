  - '- 商家需求决定存续：商家需要品牌流量、联盟要推广量、Google要广告费，三方博弈平衡点长期存在'
  - '- 合规收紧周期性：大促/敏感期合规收紧，平时相对宽松，需动态调整'
  - '- 账户资产隔离：广告账户/联盟账户/收款账户三分离，单点失效不伤筋动骨'
