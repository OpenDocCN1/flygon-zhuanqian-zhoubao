paper: docs/202305/20230516_073.md
desc: 该素材由作者甜瓜基于个人实操经验总结，提出了一套从零开始挖掘并落地商业项目的通用思维模型——「发现需求、验证需求、解决需求」三部曲。核心主张是：赚钱的本质是通过深度思考解决用户真实需求，而非盲目跟风工具或平台；项目本身不值钱，背后的挖掘逻辑与思考能力才是持续变现的源泉。文中通过「AI四维预测宝宝长相」「碳中和知识付费」「为TA点歌服务」三个详实案例，拆解了如何从生活细节/热点事件中捕捉需求、利用评论区/搜索指数低成本验证需求、以及通过拆解问题、组合现有工具/资源（而非硬核自研）来低成本解决需求的完整路径。
concepts:
- name: AI四维预测
  desc: 利用生成式AI（如Midjourney）将模糊的四维彩超影像还原为高相似度的宝宝面部照片，满足孕妈及家庭对未出生婴儿长相的好奇与情感需求。
  is_original: true
  excerpt:
  - 要是有技术可以通过彩超预测宝宝长相，还原度相似度都不错，但是得花点钱，想不想体验？
  - 怎么把四维彩超变成相似度较高的宝宝图片呢？
  - 特意挑了一张看起来就很不好还原的四维图，先垫图，用一套简单的关键词，让它生成中国长相的婴儿...
- name: 需求三部曲
  desc: 作者提炼的通用商业落地方法论，包含三个环节：1.发现需求（从生活对话、数据、热点中捕捉）；2.验证需求（通过平台评论区、搜索指数、私信回复验证真伪）；3.解决需求（将需求拆解为具体问题，通过思考组合现有资源/工具逐步攻克）。
  is_original: true
  excerpt:
  - 总结一下：1、发现需求：需求无处不在...所以，多留心；2、验证需求：你发现的需求可能是个伪需求...所以，多搜索；3、解决需求：你能解决用户需求...所以，多思考。
- name: 评论区需求验证法
  desc: 一种低成本验证市场需求真实性的方法：直接进入短视频/内容平台相关关键词的评论区，分析高频提问、情感表达（如‘怎么做’、‘多少钱’、‘好想快点看到’）及寻求解决方案的语义，判断需求强度与真伪。
  is_original: false
  excerpt:
  - 打开短视频平台...搜索 四维彩照，看相关内容的评论区都在说啥。正常情况下，去看同行的评论区，是最能直接验证需求的
  - 评论区大致如下：接四维一切顺利...有软件可以看长相么（不能再好，相当精准了）
- name: 思考护城河
  desc: 作者强调的核心竞争力：在AI工具普及、流量渠道透明的背景下，‘思考以及思考产生的创意’才是最可贵、难以被替代的护城河。项目可复制，但挖掘项目的思维模式不可复制。
  is_original: true
  excerpt:
  - AI 很强大，而且会更强大，但思考以及思考产生的创意，才是最可贵的，很难取代。
  - 项目都不值钱，想法才是值钱的，思考才是能让你持续赚钱的源泉。
  - 比起运营数据和算法，更重要的是运营人性和本能。
- name: 资源重组交付法
  desc: 在不具备核心技能（如不会弹唱、不懂专业领域知识）时，通过拆解交付物本质（如‘视频’而非‘现场弹唱’），利用外部现成资源（唱吧素人音频、合作弹唱者、公开资料整理）重组交付流程，实现低成本、可规模化的服务交付。
  is_original: true
  excerpt:
  - 思考二：我就想自己做，不想合作，怎么办？那就分析下我们最终交付了啥？...到底，其实最终交付的是一个视频。
  - 那如何满足视频中演唱的内容？只需要有一段素人唱歌的音频即可，那上哪弄呢？唱吧，全民K歌就有啊
methods:
- name: __overview__
  desc: 全文贯穿的核心方法论：以‘需求三部曲’为主线，辅以‘评论区验证法’与‘问题拆解-资源重组’的执行策略，形成从洞察到变现的闭环。
  excerpt:
  - 发现了需求，验证了需求，解决了需求。接下来就是大家熟悉的，搞流量，做转化，赚钱了。
  - 带上这个思路，我们来串联一下其他实操过的项目。
- name: AI提示词迭代优化法
  desc: 针对生成式AI图像可控性不足的问题，采用‘挑选最难案例为基准 -> 垫图生成 -> 发现缺陷（皮肤坑洼、肤色不均、瑕疵、不似） -> 针对性添加负面词/修饰词/结构词
    -> 多案例回归测试’的迭代流程，最终沉淀出‘扛打的关键词组’。
  excerpt:
  - 1、特意挑了一张看起来就很不好还原的四维图，先垫图... 2、问题出现了，就解决问题，加上相关的关键词，除去皮肤上的坑洼... 3、继续解决问题... 4、再加上关键词...
    5、又尝试了其他的案例，出现不太像的问题，于是加上视角，以及五官细节的描述，还原度到位了。
  - 以上思考和实践，我们就有了扛打的关键词组。
- name: 热点事件极速入场法
  desc: 捕捉宏观政策/热点事件（如碳中和讲话）引发的全网指数暴涨 -> 通过评论区提取高频用户提问（‘是什么’、‘怎么赚钱’、‘怎么入行’） -> 现学现卖，将复杂专业信息转化为‘大白话、条理化、框架化’的内容产品
    -> 多渠道变现（资料包、证书、培训、资源对接）。
  excerpt:
  - 2021年，在大大就碳中和发表讲话后，碳中和的全网指数暴涨...刷了很多视频，尤其是看评论区，高频的评论是‘碳中和是啥’...
  - 我花了3天时间高强度输入，同步输出了几条视频...这个号2个月内为我带来100多万利润
- name: 非标服务标准化拆解法
  desc: 将非标准化的服务需求（如‘帮用户打电话表白+弹唱’）拆解为标准化交付物（‘全程录屏视频’），进而将核心难点（弹唱技能）外包或替代为可控资源（素人音频库、合作网络），实现个人能力与业务交付的解耦。
  excerpt:
  - 思考一：我不会，但有人会，找会弹唱的人合作...多找几个，男女都找，各种音色的都要
  - 思考二：...到底，其实最终交付的是一个视频。剪视频还不简单么~ 那如何满足视频中演唱的内容？只需要有一段素人唱歌的音频即可
theorems:
- name: 需求即财富入口定律
  desc: '[claim] 核心主张：需求无处不在（生活对话、数据、热点），需求背后就是金钱。只要能发现真需求、验证真需求、解决真需求，并知道用户在哪里，就大概率能赚到钱。'
  excerpt:
  - 需求无处不在，可能就在生活对话中，可能藏在海量数据里，可能埋在新闻热点下
  - 你能解决用户需求，且知道用户在哪，就大概率能赚到钱
  - 人性背后，尽是需求，需求背后，金钱不眠
- name: 思考优于工具/平台定律
  desc: '[claim] 核心主张：工具（AI）、平台（抖音/小红书）皆为基建，门槛趋近于零。真正的壁垒在于‘思考’——即如何定义问题、拆解问题、组合资源。自我设限（如‘不专业’、‘不会技术’）是阻碍行动的根源，而非能力不足。'
  excerpt:
  - AI 很强大，而且会更强大，但思考以及思考产生的创意，才是最可贵的，很难取代。
  - 很多人看到了需求...但是没做...而是自我设限了。其实，真的需要那么专业么？其实，就是欠缺思考。
  - 比找项目更重要的是，学习项目背后的逻辑和思考
- name: 跨界复用底层逻辑论
  desc: '[claim] 核心主张：看似不同行业的项目（四维预测、碳中和、点歌、陪诊、鉴渣），底层逻辑完全互通。掌握了‘发现-验证-解决’的思维模型，即可在不同赛道间快速迁移、复用能力，实现‘虽然分属不同行业，但对于我而言，其实是同一件事’。'
  excerpt:
  - 我做的大多数事，底层都是通的，虽然分属不同行业，但对于我而言，其实是同一件事。
  - 当你拥有了这样的能力，你能挖掘到很多有意思且赚钱的事情，并把想法变成钱。
findings:
- name: 四维预测项目商业化验证成功
  desc: '[evidence] 通过评论区关键词‘有软件可以看长相么’精准验证需求；通过AI提示词迭代解决技术难题；最终通过多平台流量获客，合作机构达9家（私立医院为主），建立起稳定且高客单价的B2B2C商业模式，证明‘不卷平台流量，依然有大量稳定订单’。'
  excerpt:
  - 评论区大致如下：...有软件可以看长相么（不能再好，相当精准了）
  - 我们通过各平台，吸引到的合作机构有9家了，私立医院为主，即便不卷平台，依然有大量稳定且单价更高的订单。
- name: 碳中和项目小白极速变现案例
  desc: '[evidence] 作者作为财经专业但碳中和‘纯小白’，仅用3天高强度学习输入、同步内容输出，第3条视频即获500万播放，该账号‘碳中和瓜哥’2个月变现100万+（资料包、证书合作、企业培训、资源对接），验证了‘把复杂概念大白话、信息条理化、知识框架化’即可满足大众入门需求，无需深度专业背景。'
  excerpt:
  - 我是学财经的，碳中和我也才听说，也是个纯小白。那就现学呗...
  - 我花了3天时间高强度输入，同步输出了几条视频，发到第三条的时候，500万播放来了。这个号2个月内为我带来100多万利润
- name: 为TA点歌项目零技能交付验证
  desc: '[evidence] 作者不会弹唱，通过‘招募合作弹唱者’与‘剪辑唱吧素人音频’两条路径均跑通交付流程，实现‘订单接到手软’，验证了‘资源重组交付法’的有效性：核心交付物是‘视频’而非‘技能’，技能缺口可通过供应链整合填补。'
  excerpt:
  - 思考一：我不会，但有人会，找会弹唱的人合作...思考二：...到底，其实最终交付的是一个视频...上哪弄呢？唱吧，全民K歌就有啊
  - 以上，就是思考过程。有了解决方案，跑通流量，订单接到手软。
- name: 多项目组合运营的反脆弱性验证
  desc: '[evidence] 作者连续操盘四维预测、碳中和、点歌、陪诊师培训、数藏、鉴渣、相亲盲盒等多个生命周期短、行业无关的项目，均实现盈利。数据支撑：单一项目（如碳中和）因专业天花板停更，但整体收益持续，且积累了‘只要出手，必有回响’的底气，证明思维模型的跨域复用能力强于单一业务护城河。'
  excerpt:
  - 我用这套思维模式，还做成了很多赚钱的方向。比如，陪诊师培训，数藏，鉴渣，相亲盲盒等等
  - 这些经历给我的沉淀是...大量的实践给我的底气：只要出手，必有回响。
