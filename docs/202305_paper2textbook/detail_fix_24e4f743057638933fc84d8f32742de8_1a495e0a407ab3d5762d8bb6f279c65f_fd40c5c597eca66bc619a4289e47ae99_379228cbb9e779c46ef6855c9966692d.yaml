  name: 居家轻量化创业可行性与电脑开播技术标准化
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人创业受限于『资金/场地/人员/供应链』四大硬性成本，需一套『零库存、零场地、零员工、低资金』的轻量化模型'
  - '- 直播技术门槛(推流/采集/编码/声卡)劝退大量非技术背景新手，需『傻瓜式』标准化操作手册'
  - '- 需要验证『居家+电脑+MCN』三要素是否能跑通商业闭环，形成可复制的『最小可行性创业单元』'
  - '**核心定义**'
  - '- 居家轻量化创业：依托MCN提供权限/链接/底薪，个人仅需『一台电脑+一个角落+一根网线』即可启动，固定成本<2000元'
  - '- 电脑开播标准流程：PC端推流软件(OBS/直播伴侣)→ 游戏窗口采集 → 音频接入(游戏音/麦克风) → 场景布局(游戏画面/人设摄像头/弹幕/计时器)
    → 推流参数配置 → 启动直播'
  - '- 硬件最低配：CPU i5-10400/显卡GTX1650/内存16G/固态512G/上行带宽≥20Mbps，总成本约3000-4000元'
  - '**关键性质**'
  - '- 物理隔离即安全：居家环境天然规避『工位监控/同事打扰/通勤成本』，主播状态更松弛自然，利于长时长高频次直播'
  - '- 参数固化即复制：推流码率/分辨率/帧率/编码器/服务器地址等参数一经调优即可固化为模板，新主播『导入即用』'
  - '- 故障自愈清单：掉帧→降码率/关滤镜；掉线→双网口/手机热点备用；声卡炸→驱动重装/换声卡；绿幕锯齿→调光/距离'
  - '**典型例子**'
  - '- 作者实测：一台3000元组装机+OBS+斗地主客户端，配置上述参数，稳定推流1080P/60fps，零掉帧、零违规、零投诉'
  - '- 多账号轮播：同一设备切换账号直播(需实名隔离)，实现『一人多号、全天候覆盖』，单设备产出最大化'
  - '**边界条件**'
  - '- 电力/网络稳定性为生命线，需配备UPS/双宽带/4G备网，规避『断播即违规』平台惩罚'
  - '- 居家环境噪音控制(家人/装修/楼下)需物理隔音或错峰直播，维护音频质量'
  - '- 长期久坐健康风险(颈椎/腰/视力/血栓)需强制『每小时站立5分钟/投屏引导运动』机制'
