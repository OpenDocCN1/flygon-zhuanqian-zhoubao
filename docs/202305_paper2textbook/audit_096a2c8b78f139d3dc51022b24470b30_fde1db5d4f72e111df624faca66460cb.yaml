unsupported_claims:
- location: '34.3'
  claim: 公式推导逻辑：微博的分发机制是“社交图谱+订阅制”，新号无社交关系链、无历史权重，内容质量再高也无分发入口（内容质量=0 时增长=0）。但有了内容质量作为基数（门槛），每增加一分外部强分发（大V转发/官方扶持/热点流量），都能以乘法级放大增长。
  reason: 素材中未找到该公式的详细推导过程与数学论证，仅为作者基于经验总结的定性模型。
- location: '34.5'
  claim: 公式推导逻辑：分子端，“你能提供的价值”包括显性（金钱/资源/渠道）与隐性（身份背书/情绪价值/内容整理/信息差），乘以“对方感知度”（能否在评论区/私信前50字被看到），决定“吸引力”；分母端，“对方时间成本”（大V日均处理互动上限）乘以“信任门槛”（陌生人防御心理），决定“阻力”。
  reason: 素材中未给出该公式的量化定义与推导，仅为概念性阐述。
- location: '34.8'
  claim: 复用三层：1. 观点层（核心洞察/反常识认知） 2. 表达层（金句/段子/比喻/故事） 3. 结构层（分析框架/写作模版/选题方向）
  reason: 素材中提到“思考永远在这里...其中经典语句也可以反复利用”，但未明确划分为上述三层结构体系。
- location: '34.10'
  claim: 合格标准：- 观点独特性（非人云亦云/反常识/深度洞察） - 情绪穿透力（引发愤怒/共鸣/恐惧/希望/释然） - 结构完整性（有背景/有冲突/有观点/有金句/有行动指南）
  reason: 素材中列举了追热点的“不该做”四点，但未将上述三项明确定义为“合格标准”。
- location: '34.11'
  claim: 粉丝分层：精准付费粉（高意向/高复购/高 LTV）> 垂类泛粉（有兴趣/低意向）> 泛娱乐粉（无兴趣/仅娱乐/羊毛党）
  reason: 素材中对比了带货博主粉丝与抽奖博主粉丝的质量差异，但未给出上述三层分层的标准定义。
