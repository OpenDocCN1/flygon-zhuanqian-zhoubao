  excerpts:
  - 秘诀就是「复制爆款」...真相是「小红书不怎么查重」，重发的笔记依然有流量
  - 我们在正常互动的过程中，最好先去搜索所做领域的关键词，并与热门笔记进行互动
  - 「拆解」并「学习模仿」同行业务路径 具体做法是走一遍他们的业务流程
  - 通常来说，至少前两天前五篇都不要复制营销性质的爆款
  - 如果账号前期笔记普遍低于100个阅读量，通常是养号没做好，可以断更几天，再快速起号，依然可行
