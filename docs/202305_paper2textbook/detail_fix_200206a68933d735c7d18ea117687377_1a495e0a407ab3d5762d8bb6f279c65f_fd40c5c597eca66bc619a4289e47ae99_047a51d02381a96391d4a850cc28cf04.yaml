- 'no': 3
  name: 快速起号标准化动作包 —— 养号、对标、保护期、冷启动修复
  points:
  - '**为什么需要这个概念？**'
  - '- 新号无标签、无权重、无信任，盲目发内容极大概率『沉底』、甚至触发营销号判定导致账号废弃'
  - '- 起号期（前3-5天）是账号标签形成的关键窗口，动作标准化程度直接决定后续流量上限'
  - '- 对标账号业务路径逆向工程能以最低成本获取成熟商业闭环模板，避免『重复造轮子』'
  - '**核心定义**'
  - '- 养号-标签化机制：模拟真人行为（搜索核心词/互动热门笔记）诱导算法打上垂直领域标签，使首页推荐流变为领域素材库'
  - '- 对标账号业务路径拆解：完整走一遍竞品『评论引导-私信话术-引流落地页』全流程，逆向工程其商业闭环设计'
  - '- 前5篇非营销内容保护期：新号前2天前5篇必须为纯干货，过早植入营销笔记导致标签偏离权重受损'
  - '- 老号冷启动修复：前期阅读<100的『废号』经断更+重新养号+复制爆款流程可恢复权重，账号权重非不可逆'
  - '**关键性质**'
  - '- 算法顺应性：主动打标签比被动等待效率高得多，直接决定首批推荐流量池精准度'
  - '- 商业闭环复用：对标拆解得到的『引流钩子/承接容器/转化话术』可直接移植，节省从0设计成本'
  - '- 容错机制：老号修复可行性验证了『账号权重可逆』，降低试错沉没成本心理压力'
  - '**典型例子**'
  - '- 职称赛道实测：新号养号2-3天→复制爆款起号→前5篇纯干货→第3天引流笔记上架，单日引流50+'
  - '- 老号修复案例：阅读量<100的账号断更3天→重新养号→复制爆款→恢复正常推荐'
  - '**边界条件**'
  - '- 対标对象必须是『近期起号、有单条爆款、粉丝1-2万』的『低粉爆款』账号，头部大号不具备参考性'
  - '- 前5篇保护期为硬性红线，实测过早植入营销笔记导致账号标签偏离、权重受损、起号失败'
  - '- 养号行为必须『垂直、真实、高频』，泛娱乐互动会打错标签（如刷美女视频导致账号被打『颜值』标签）'
  sources:
  - paper: docs/202305/RhRywNqifi3wjGkc4MacUiwXnxc.md
