learning_targets:
- 理解PPT项目拆解IP的商业模式与核心优势
- 掌握对标拆解法与爆款视频四要素制作法的标准化SOP
- 学会设计高转化私域引流钩子与朋友圈三段式运营体系
- 掌握高客单价咨询式成交话术与MVP先卖再做的产品迭代逻辑
- 建立私域放大器/公域放大镜的流量资产化模型与利他思维长期主义护城河
- 确立执行力大于完美主义、赛道选择决定上限内容细节决定下限的实战认知
concept_map:
- PPT知识付费IP实战体系
- ├── 核心商业模式
- │   ├── PPT项目拆解IP          —— P001
- │   ├── 前端引流-后端变现模型  —— P001
- │   └── 人设信任资产            —— P001
- ├── 内容生产标准化体系
- │   ├── 对标拆解法(像素级模仿) —— P001, P014
- │   ├── 爆款视频四要素制作法    —— P001, P014
- │   │   ├── 封面：统一大字报风格+固定配色
- │   │   ├── 文案：黄金前3秒钩子+干货步骤+引导互动
- │   │   ├── BGM：卡点+热榜+情绪匹配
- │   │   └── 剪辑：节奏快+关键帧标注+去水印调色
- │   └── MVP思维先卖再做        —— P001, P005
- ├── 私域精细化运营体系
- │   ├── 私域引流钩子设计法      —— P001, P025
- │   │   └── 核心钩子：源文件/素材包/配色表/拆解教程
- │   ├── 朋友圈三段式运营法      —— P001, P025, P015
- │   │   ├── 专业展示(50%)：作品/学员反馈/干货
- │   │   ├── 生活真实(30%)：家庭/成长/踩坑
- │   │   └── 营销转化(20%)：预售/限时/名额
- │   └── 高客单价咨询式成交话术  —— P001, P013
- │       └── 五步法：诊断/揭示/方案/案例/锚定
- ├── 底层流量与信任模型
- │   ├── 私域放大器/公域放大镜   —— P001, P002, P027
- │   └── 利他思维护城河          —— P001, P007, P031
- └── 核心实战认知定律
- ├── 执行力>完美主义           —— P001, P001, P001
- └── 赛道定上限/细节定下限     —— P001, P001, P001
life_analogy:
- 想象打造PPT知识付费IP像**开一家『标准化中央厨房+品牌连锁门店』的餐饮生意**：
- '- **对标拆解法** = 去同城爆款餐厅『偷师』：拆解爆款菜谱(选题)、摆盘标准(封面)、烹饪步骤SOP(文案/剪辑)、背景音乐(BGM) → 建立中央厨房标准菜单库'
- '- **爆款视频四要素** = **中央厨房出品标准**：统一招牌菜包装(封面)、前菜必上桌快(前3秒钩子)、主菜分步讲解(干货步骤)、用餐节奏配乐(BGM卡点)、厨房出品无瑕疵(剪辑标准)'
- '- **私域引流钩子** = **免费试吃券/秘制调料包**：高感知价值(觉得值钱)、低边际成本(中央厨房批量复制)、即拿即用(回家能用) → 精准筛选『爱做饭/愿付费』的高意向食客进微信群'
- '- **朋友圈三段式** = **门店装修与店长日记**：专业展示=后厨透明/食材展示/奖牌墙(50%)、生活真实=店长家庭聚餐/踩坑避雷/价值观(30%)、营销转化=限时特价/会员充值/名额有限(20%)'
- '- **咨询式成交** = **私房菜定制服务**：先问口味/过敏/预算(诊断) → 指出外面饭馆卫生差/配料表造假风险(揭示痛点) → 推荐定制食谱/上门私厨(方案)
  → 展示邻居老王定制后全家大赞(案例) → 今日下单送价值199元调料包(限时锚定)'
- '- **MVP先卖再做** = **众筹预售制**：菜单研发未完，先发朋友圈众筹『首批尝鲜官』收定金 → 根据反馈调整口味/分量 → 正式推出标准套餐规模化复制'
- '- **私域放大器/公域放大镜** = **美团大众点评(放大镜)筛选附近爱吃川菜的人 + 微信社群/会员卡(放大器)高频触达复购裂变**'
- '- **利他思维** = **食材坚持产地直采/拒绝预制菜/变味包退** → 口碑裂变带来『食客自发安利』比广告更管用'
- '- **执行力>完美主义** = **先开门营业再调菜单**，数据(退菜率/复购率/翻台率)会告诉你答案'
- '- **赛道定上限/细节定下限** = **选对『川菜』这个大赛道(刚需/高频/标准化)决定天花板；火候/刀工/调料比例/摆盘/服务话术等微观细节决定能不能活下来、赚多少钱**'
summary:
- concept: PPT项目拆解IP
  desc: 将复杂PPT技能拆解为可复制标准动作，打造抖音知识付费个人品牌
- concept: 对标拆解法
  desc: 像素级模仿头部爆款逻辑建库(素材/选题/文案)，照搬微创新最短跑通冷启动
- concept: 爆款视频四要素
  desc: 封面(统一大字报)/文案(黄金3秒钩子)/BGM(卡点热榜)/剪辑(节奏快标注)工业化SOP
- concept: 私域引流钩子
  desc: 高感知价值+低边际成本+即拿即用的工具包(源文件/素材/配色)精准筛选高意向用户
- concept: 朋友圈三段式
  desc: 专业展示50%/生活真实30%/营销转化20%构建信任闭环，朋友圈即店面即人设
- concept: 咨询式成交话术
  desc: 五步法(诊断/揭示/方案/案例/锚定)卖确定性不卖课程，解决信任/价值/紧迫三大异议
- concept: MVP先卖再做
  desc: 课程未完善先卖陪跑/内测版，用市场真实反馈打磨SOP/FAQ再降维规模化交付
- concept: 私域放大器/公域放大镜
  desc: 公域算法筛选精准意向(放大镜)，私域高频触达深化信任最大化LTV(放大器)，互补共生
- concept: 利他思维护城河
  desc: 真心帮用户解决问题(免费答疑/赠送源文件/迭代免费)获得口碑裂变高复购抗周期
- concept: 执行力>完美主义
  desc: 在不确定性中小步快跑试错，先发布再修正，外部约束(航海/截止日期)转化模糊意愿为确定行动
- concept: 赛道选择决定上限/内容细节决定下限
  desc: 好赛道四特征(刚需/变现清晰/高复购/可标准化)定天花板；封面/钩子/话术/选品等像素级细节定生死线
exercises:
- 'no': 1
  title: 对标账号拆解与选题库建设实战
  contents:
  - 任务：选定一个垂直赛道(如PPT/Excel/Notion/AI绘图)，在抖音/小红书搜索Top 10头部/腰部账号
  - 1. 建立对标账号档案表：账号名/粉丝量/近30天爆款视频链接/爆款视频共性标签(选题角度/封面风格/文案结构/BGM类型/变现路径)
  - 2. 提炼『选题库』：从爆款视频中抽取可复用的选题模版(如『从0到1教会XX』/『避坑指南：XX』/『效率提升XX倍』)，至少产出20个可直接执行的选题
  - 3. 复盘问题：
  - '   - 为什么这些选题能爆？是蹭热点、解刚需、造反差还是强人设？'
  - '   - 你的资源禀赋(技能/经验/素材)能支撑哪些选题的『微创新』？'
  - '   - 如何建立『素材库』与『文案库』支撑批量化生产？'
- 'no': 2
  title: 爆款视频四要素制作与AB测试
  contents:
  - 任务：基于练习1的选题，制作3条同选题不同包装的视频进行AB测试
  - 1. 封面测试：制作3版封面(大字报痛点版/大字报结果版/对比反差版)，其他要素保持一致，发布后记录主页转粉率与视频CTR
  - 2. 文案钩子测试：前3秒分别用『冲突开场』/『利益诱饵』/『反直觉认知』三种钩子，记录3秒完播率与5秒完播率
  - 3. BGM与剪辑节奏测试：分别用『卡点快节奏』/『舒缓讲解节奏』/『无BGM纯人声』，记录完播率与互动率
  - 4. 复盘问题：
  - '   - 哪个组合的『完播率×互动率×转粉率』综合得分最高？'
  - '   - 如何将获胜组合固化为『像素级SOP』？(如：封面字体/大小/位置/配色值、前3秒话术模版、BGM前5秒切点时间轴、剪辑转场特效预设)'
  - '   - 单人按该SOP日产能上限是多少条？瓶颈在哪个环节？'
- 'no': 3
  title: 私域引流钩子设计与转化漏斗搭建
  contents:
  - 任务：为你的垂直赛道设计3款不同类型的引流钩子，并在公域内容中植入测试
  - 1. 钩子设计：
  - '   - 工具包型：模板/源文件/素材包/配色表/清单/速查表(即拿即用)'
  - '   - 资源包型：书单/工具合集/渠道名录/避坑指南/话术脚本(整理型)'
  - '   - 服务体验型：免费诊断/方案大纲/试听课/社群体验卡/1v1咨询名额(服务型)'
  - 2. 分发路径部署：抖音主页简介/粉丝群公告/评论区置顶/私信自动回复/视频结尾口播/合集封面
  - 3. 数据追踪表(每日记录)：曝光量/点击钩子人数/加微人数/通过率/朋友圈阅读/咨询人数/成交人数/客单价
  - 4. 复盘问题：
  - '   - 哪种钩子类型的『加微通过率 × 后续咨询率 × 成交率』综合ROI最高？'
  - '   - 钩子兑现流程是否『即拿即用』？用户拿到手能否3分钟内产生『哇塞这也太值了』的感知？'
  - '   - 私域承接话术是否配套？从加微欢迎语 -> 发钩子 -> 朋友圈引导 -> 咨询诊断 -> 成交促单，每个节点有标准话术吗？'
- 'no': 4
  title: 高客单价咨询式成交话术演练与MVP预售验证
  contents:
  - 任务：设计你的高客单产品(≥999元)的咨询式成交话术脚本，并进行MVP预售测试
  - 1. 话术脚本设计(五步法填空)：
  - '   - 诊断：『请问您目前在[赛道]方面处于什么阶段？最大的卡点是？』'
  - '   - 揭示：『这个卡点如果不解决，会导致[具体后果/损失]...』'
  - '   - 方案：『我的[产品名]专门解决这个问题，核心是[独特方法论]，不同于市面上[同类产品]的[差异点]』'
  - '   - 案例：『和您情况相似的[学员画像]，通过[关键动作]在[时间周期]达成了[具体结果]』'
  - '   - 锚定：『目前[价格]可入，名额/福利截止到[时间]，报名即赠[高价值钩子]』'
  - 2. MVP预售执行：
  - '   - 产出『内测版/陪跑版』招募贴(含：交付内容/时间/价格/名额/退款承诺/报名方式)'
  - '   - 在私域/社群/公域发布，目标：3天内收集≥5个有效意向/成交≥1单'
  - '   - 交付过程：记录用户真实问题/卡点/反馈，打磨SOP与FAQ库'
  - 3. 复盘问题：
  - '   - 预售转化率多少？用户核心异议集中在信任/价值/紧迫哪一类？如何预判话术优化？'
  - '   - 交付中遇到的『奇葩问题』是否覆盖了80%的边缘案例？FAQ库是否完善？'
  - '   - 陪跑/内测用户的NPS(推荐度)如何？是否愿意转介绍/复购/做种子合伙人？'
- 'no': 5
  title: 朋友圈三段式运营与人设信任资产建设
  contents:
  - 任务：规划并执行14天朋友圈三段式运营计划，建设人设信任资产
  - 1. 内容日历规划(14天×3条=42条素材储备)：
  - '   - 专业展示(21条)：作品案例/学员反馈截图/干货知识卡片/行业观点/数据复盘/工具推荐/避坑指南'
  - '   - 生活真实(13条)：工作日常/家庭碎片/读书笔记/运动打卡/踩坑复盘/价值观输出/情绪碎片'
  - '   - 营销转化(8条)：课程预告/限时福利/名额倒计时/成交截图/学员成果/复购反馈/裂变海报/置顶钩子'
  - 2. 执行标准：
  - '   - 固定发布时间：早9:00(专业/生活) / 中12:30(生活/营销) / 晚20:30(专业/营销)'
  - '   - 置顶核心产品/钩子/客户见证，分组可见精准触达(如：未成交组/已成交组/高意向组)'
  - '   - 评论区主动互动：每条必回/提问引导/赠送小礼物'
  - 3. 数据追踪：每日记录朋友圈阅读量/互动量/私信咨询量/加微好友量/成交线索量
  - 4. 复盘问题：
  - '   - 哪类内容(专业/生活/营销)的『阅读量/互动率/私信转化率』最高？'
  - '   - 5:3:2比例是否适合你的赛道？需否动态调整(如新号前期专业:生活:营销=7:2:1)？'
  - '   - 你的『人设关键词』(如：靠谱/专业/真实/有温度/硬核)是否被精准传递？用户如何评价你？'
