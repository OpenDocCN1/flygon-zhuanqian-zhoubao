units:
- 'no': 1
  name: 认知破偏见 —— 把偏见当作发现新赛道的‘反向指标’
  points:
  - '**为什么需要这个概念？**'
  - '- 新赛道（如 BRC20）初期往往伴随认知冲突，固有经验会变成‘认知拦路虎’，导致错过红利期（作者因偏见错过 2021 年 NFT）'
  - '- 偏见的本质是‘用旧地图找新大陆’，必须主动打破才能进入高流动性赛道'
  - '**核心定义**'
  - '- 抛弃偏见：强迫自己去理解新事物，前往流动性和热度最高的赛道试错，而非用旧框架评判新事物'
  - '- 认知升级先于行动致胜：心智模型更新是捕捉机会的必要前提，行动是认知变现的结果'
  - '**关键性质**'
  - '- 反直觉：人本能地厌恶不确定性，偏见是大脑的‘省力模式’，打破它需要刻意练习'
  - '- 可迁移：思维框架比单次收益更有价值，可复用到不同周期、不同赛道'
  - '**典型例子**'
  - '- 作者 2021 年因‘比特币只能存储价值’的偏见错过 NFT；2023 年强迫自己研究 BRC20，凌晨三点实战 VMPX，验证框架有效性'
  - '**边界条件**'
  - '- 仅适用于‘高不确定性、高波动率’的新兴赛道，成熟市场需基本面分析'
  - '- 必须配合‘小步试错’与‘风控纪律’，否则易变为盲目冲动'
  sources:
  - paper: docs/202305/20230516_044.md
    role: origin
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: improve
  excerpts:
  - '5 月 8 号凌晨三点冲 #VMPX 也是因为最近摒弃了一些偏见后的第一次实战'
  - 答案是：抛掉偏见去机会多的地方
  - 这次看到 BRC20 我就强迫自己去了解。
  - 文章里面关于 Web3 里面的思考和框架可复用
- 'no': 2
  name: 运气表面积 —— 主动增加遭遇‘好运’的概率面
  points:
  - '**为什么需要这个概念？**'
  - '- Web3 机会稍纵即逝，纯靠等待‘运气降临’胜率极低'
  - '- 需要一套可量化、可执行的‘制造运气’方法论，替代被动祈祷'
  - '**核心定义**'
  - '- 运气表面积：通过保持好奇心、扩展视野、心态豁达、多想好的一面等主观行为，主动增加单位时间内遭遇高质量机会的概率'
  - '- 核心公式：你不能改变运气，但可以改变‘运气的运气’（引用《天赋与运气》研究）'
  - '**关键性质**'
  - '- 可积累：阅读、社交、实操每一次‘把鞋弄脏’都在扩大表面积'
  - '- 非线性：微小的认知/行动改变，可能引发指数级的机会捕获'
  - '**典型例子**'
  - '- 作者加入‘七爷社群’获取 Alpha 信息源，利用他人筛选体系小步试错，最终捕捉 VMPX 机会'
  - '**边界条件**'
  - '- 不等于盲目乐观，必须配合‘信息验证纪律’与‘风控止损’'
  - '- 表面积大只能增加‘撞大运’概率，能否‘接住运气’取决于实战执行力'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 你不能改变运气，但是可以改变运气的运气
  - 保持积极好奇心、扩展视野、心态豁达，遇事多想好的一面，少想坏的一面，好运气就会多一点。
  - 在 Web3 ，这种消息叫 Alpha ，机会总给那些愿意行动起来的人。
- 'no': 3
  name: Alpha 信息源 —— 接入‘已被筛选过的高质量情报网络’
  points:
  - '**为什么需要这个概念？**'
  - '- Web3 信息过载、噪音极大，个人筛选成本极高、易被割韭菜'
  - '- 需要借力‘他人的筛选体系’，实现信息获取的杠杆效应'
  - '**核心定义**'
  - '- Alpha：Web3 行业内指高质量、早期、可执行的投资情报'
  - '- Alpha 信息源：具备筛选能力、愿分享早期情报的社群/大佬/渠道（如七爷社群）'
  - '**关键性质**'
  - '- 信任传递：基于过往验证（如作者曾在 XEN 喝汤）建立的信任链'
  - '- 时效性强：Alpha 衰减极快，必须‘小步试错、快速迭代’'
  - '**典型例子**'
  - '- 作者重视七爷转发的 VMPX 消息，因之前在 XEN 项目中跟随该源获益，完成信任闭环'
  - '**边界条件**'
  - '- 严禁盲目跟单，必须‘验证猜想、知行合一’（如作者验证‘破解代币名称’谣言后放弃套利）'
  - '- 权限门槛：部分 Alpha 需平台资质（Unisat 积分/OG PASS）才能参与，需提前布局'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 在 Web3 ，这种消息叫 Alpha ，机会总给那些愿意行动起来的人。
  - 昨天看到七爷在群里转发 VMPX 的相关消息...因为我之前在 XEN 里面喝了点汤，所以就很重视。
  - 验证猜想、知行合一、不盲目追涨
- 'no': 4
  name: 把鞋弄脏 —— 亲身下场才能获得的‘隐性知识护城河’
  points:
  - '**为什么需要这个概念？**'
  - '- 岸边观望永远学不会链上实战的‘生死细节’（Gas 博弈、网络拥堵应对、界面卡顿）'
  - '- 显性知识（教程）只占 20%，隐性知识（手感、节奏、直觉）决定 80% 成败'
  - '**核心定义**'
  - '- 把鞋弄脏：指亲身承担风险、体验细节、忍受痛苦（网络拥堵、Gas 波动、熬夜）的全过程实操'
  - '- 隐性知识：如 Gas 存在动态生死线、Mint 进度与网络拥堵的非线性关系、前端崩溃时的操作备选方案'
  - '**关键性质**'
  - '- 不可复制粘贴：只能通过‘小额实战测试 → 总结原则 → 全力执行’的 OODA 循环内化'
  - '- 复利增长：每次实战都在为下一次积累‘肌肉记忆’'
  - '**典型例子**'
  - '- 作者模拟 5-6 遍后小额实战测试 Gas 底价，发现‘Gas 给底则鸡飞蛋打’，确立‘Gas 拉满’核心原则，最终在 99.6% 进度调高 Gas
    至 800 上车'
  - '**边界条件**'
  - '- 成本可控：仅用‘能承受损失的小额资金’弄脏鞋，而非梭哈'
  - '- 必须复盘：不复盘的实战只是‘交学费’，不是‘把鞋弄脏’'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 把鞋弄脏，遇到机会的时候，站在岸边指点评价总是容易的，真正投身其中才能感受风浪，风浪越大，鱼越贵。
  - 对着教程开始反复模拟（很重要，要不断模拟测试问题）；模拟了五六遍后觉得没大问题时，开始实操
  - 找了几个 mint 进度 80%——90% 的项目 ，走了几遍流程...才理解了教程里面说的 gas 给底的话，很可能鸡飞蛋打。
  - 基于以上实操，给下一步抢 VMPX 定了个操作原则：gas 拉满抢！
  - 直到 mint 进度到了 99.6%...我把 gas 调到了 800，终于...赶上了末班车
- 'no': 5
  name: 动态 Gas 博弈 —— 在区块空间拍卖中寻找‘生死线’的动态平衡术
  points:
  - '**为什么需要这个概念？**'
  - '- BRC20 Mint 本质是‘区块空间拍卖’，静态 Gas 策略在拥堵度剧变时必死'
  - '- 需要一套随网络拥堵度、Mint 进度、竞争对手行为动态调整的定价模型'
  - '**核心定义**'
  - '- 动态 Gas 博弈模型：基于实时拥堵度、进度、预判竞争对手的 Gas 定价动态调整方法'
  - '- 核心逻辑：前期极度拥堵→Gas 需远超均价（550 仍卡死）；中期死守；后期进度>99%且网络缓解→适度提高 Gas（800）抢末班车'
  - '**关键性质**'
  - '- 非线性阈值：Gas 250（均价）→必败；550（2倍）→卡死；800（尾部窗口）→成功，存在‘生死线’'
  - '- 信息不对称利用：监控创始人推特、Mempool 状态、进度条，比对手快半拍决策'
  - '**典型例子**'
  - '- VMPX 实战：开盘 Gas 250→作者调 550 卡死；进度 99.6% 网络缓解→调 800 成功打包，验证动态策略有效性'
  - '**边界条件**'
  - '- 仅适用于‘短时高拥堵、固定总量’的 Mint 场景，不适用于持续交易'
  - '- 需极强的实时监控能力与心理素质（凌晨 3 点至 10 点持续在线）'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 开始前我看到数据平台的 gas 才 250 多，所以我第一批冲了 10 张，把 gas 翻翻，调到了 550...就是不跳出下一步...再去看 gas 已经飙到了
    600 多
  - 直到 mint 进度到了 99.6%...网络没有那么拥堵了，我把 gas 调到了 800，终于...赶上了末班车
  - Gas 费与 Mint 成功率的非线性阈值关系
- 'no': 6
  name: 谣言套利与信息验证纪律 —— 在‘虚假信息制造的价格畸变’中守住底线
  points:
  - '**为什么需要这个概念？**'
  - '- Web3 早期市场极度缺乏流动性、信息不对称，谣言能制造短期暴利诱惑（价格 0.1→0.02→0.08）'
  - '- 缺乏验证纪律极易‘接飞刀’或‘追高被套’'
  - '**核心定义**'
  - '- 谣言套利：利用市场对虚假信息的情绪化反应，在价格畸变中低买高卖'
  - '- 信息验证纪律：验证猜想 → 链上数据印证 → 权威源辟谣 → 知行合一 → 不盲目追涨'
  - '**关键性质**'
  - '- 纪律>技术：作者具备 Unisat 交易技术，但因权限限制（积分/OG PASS）及验证为谣言，果断放弃，体现‘知行合一’'
  - '- 反脆弱：不参与不理解的套利，比参与并赚到钱更安全'
  - '**典型例子**'
  - '- ‘技术破解代币名称’谣言导致衍生币暴跌反弹，作者观察链上数据+创始人辟谣推特验证虚假，放弃参与'
  - '**边界条件**'
  - '- 仅适用于‘信息极度不对称、无监管’的早期市场，成熟市场谣言成本高、套利窗口短'
  - '- 必须有独立验证渠道（链上数据、创始人官方渠道），否则无法辨真伪'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 有人开始转发一群技术人才破解了这个项目的代币名称...创始人后面又发文辟谣
  - 我想验证我的猜想，果然...后来留在创始人推特 space 听了听...主要目的还是想看热度
  - unisat 平台的交易市场是测试版本，所以目前只给有 20 积分或者有 OG PASS 的人才能交易
  - 应声下跌到 0.02...最高冲到 0.08，截止发文，稳定在 0.04
- 'no': 7
  name: 极端环境身心管理 —— 让决策力在‘熬夜、拥堵、暴涨暴跌’中不掉线
  points:
  - '**为什么需要这个概念？**'
  - '- 链上实战常持续数小时至数天（凌晨 3 点至次日 10 点），生理极限与心理压力（FOMO、界面崩溃、资金波动）会导致决策失真'
  - '- 好策略若无好身心执行 = 0，身心管理是执行力的‘硬件基座’'
  - '**核心定义**'
  - '- 极端环境身心管理：通过娱乐缓解焦虑（看剧）、保持生理机能（躺沙发休息）、情绪稳定（不因 503 放弃）、外部支持（伴侣陪伴）维持决策力在线'
  - '- 核心心法：风浪越大，鱼越贵；越混乱时越要稳住'
  - '**关键性质**'
  - '- 非技术性但决定性：技术再好，崩溃时手抖点错 Gas 也归零'
  - '- 可训练：平时的冥想、运动、作息规律，是实战时的‘心理体能储备’'
  - '**典型例子**'
  - '- 作者边看《漫长的季节》边刷新 Mint 页面，边视频陪女友边等待打包，最终熬到 99.6% 尾部窗口上车'
  - '**边界条件**'
  - '- 不能用‘硬扛’替代‘风控’：若策略本身有缺陷，好心态只会让你‘坚定地亏光’'
  - '- 需设定‘强制休息/止损线’，防止疲劳决策'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 战役打到这个份上，好身体和好心态的重要性就体现出来了...我打开了前段时间攒的剧《漫长的季节》，边看边刷新 mint 页面。
  - 边跟我女朋友视频边等待打包（此处郑重感谢我女朋友给我带来好运气）
  - 好身体和好心态
- 'no': 8
  name: 落袋为安纪律 —— 克服‘贪婪上头’将纸面富贵变成真钱的出场仪式
  points:
  - '**为什么需要这个概念？**'
  - '- 浮盈 10 倍时，人性本能贪恋‘更高’，但 CEX 上线常伴随前端崩溃、挂单延迟、虚空价格，导致无法落袋'
  - '- 缺乏出场纪律是‘赚了指数亏了钱’的核心原因'
  - '**核心定义**'
  - '- 落袋为安纪律：在浮盈高位、CEX 上线预期下，警惕‘虚空价格/前端崩溃/挂单延迟’，克服贪婪，及时市价卖出离场'
  - '- 核心口诀：别上头！落袋为安很重要！'
  - '**关键性质**'
  - '- 反人性：需在最兴奋时做最冷静的事（卖出）'
  - '- 系统化：需预设‘止盈触发条件’（如 CEX 开放充值即市价清仓），而非临场凭感觉'
  - '**典型例子**'
  - '- VMPX 峰值 1.3（10 倍），作者警惕芝麻开门上线引发前端崩溃与虚空价格，撰文时地板价 0.39（3 倍），强调及时止盈'
  - '**边界条件**'
  - '- 仅适用于‘极高波动、流动性依赖中心化交易所’的早期项目，蓝筹资产可长持有'
  - '- 需提前规划‘出金通道’（交易所账号、KYC、提币白名单），否则有币卖不出'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 落袋为安很重要！别上头！
  - 明天，也就是 9 号 11:00，芝麻开门会上 VMPX ，一般来说，这种 CEX 抢上，是因为热度，那么，怎么落袋为安就又是另一门学问了。
  - 平台前端已崩溃，交易页面一直在维护...上午挂单的订单开始陆续显示出来...这种虚空价格也很正常，坑也很多
- 'no': 9
  name: BRC20 Mint 实战 SOP —— 从‘零认知’到‘上车’的标准化 10 步作业程序
  points:
  - '**为什么需要这个概念？**'
  - '- 链上操作环节多、容错率低、时效性强，无 SOP 极易漏步、错参数、错时机'
  - '- 标准化流程能将‘个人经验’转化为‘可复制资产’，降低下次试错成本'
  - '**核心定义**'
  - '- BRC20 Mint SOP：覆盖钱包准备、BTC 获取/备用提币、平台选择、资料整理与模拟、小额测试、参数设定、开抢监控、动态调 Gas、尾部锁定、打包确认转移的
    10 步标准化作业程序'
  - '**关键性质**'
  - '- 重‘模拟’轻‘实操’：模拟 5-6 遍，小额测试验证假设，再全力执行'
  - '- 重‘备用方案’：安安暂停提币→立马启动 OK 提币，预案救命'
  - '- 重‘信息监控’：倒计时页→创始人推特→多渠道确认开抢时刻'
  - '**典型例子**'
  - '- 作者完整执行该 SOP：模拟 5-6 遍 → 小额测 Gas → 定原则 → 监控推特开抢 → 动态调 Gas → 尾部进度 99.6% 调 800
    成功上车'
  - '**边界条件**'
  - '- SOP 需随工具迭代更新（如 Unisat 版本更新、新平台出现）'
  - '- 核心参数（Gas 倍数、进度阈值）需根据具体项目拥堵预期微调，不可生搬硬套'
  sources:
  - paper: docs/202305/Geucd6qWAoGztLx5EOkcKmjWnQg.md
    role: origin
  excerpts:
  - 从九点多知道这个消息后开始寻找各个社群整理出来的关于 BRC20 的各种资料，大概了解了它的原理和操作平台流程玩法，准备好钱包和 BTC 就开始模拟了
  - 安安还暂停了大约 1 个小时的提币，立马启动备用方案，用 OK 提
  - 对着教程开始反复模拟（很重要，要不断模拟测试问题）；模拟了五六遍后觉得没大问题时，开始实操
  - 倒计时页面点击进去后直接跳到创始人推特...三点十分的时候，创始人发了推文
  - 直到 mint 进度到了 99.6%...我把 gas 调到了 800，终于...顺利地看着有我的包的区块从待打包的红色状态跳到打包完成的蓝色状态
- 'no': 10
