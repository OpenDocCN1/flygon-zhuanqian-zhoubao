learning_targets:
- 理解生财技能导航图谱作为全书知识体系外部延伸索引的定位与功能
- 掌握生财有术社区核心技能库的全景分类体系（流量获取、产品变现、私域运营、知识管理、投资理财等核心板块）
- 学会利用技能导航图谱进行按需检索与个人商业能力树的系统化规划路径设计
- 明确技能导航图谱的边界条件：仅提供链接索引不含教学内容、依赖外部语雀文档链接有效性
concept_map:
- 生财技能导航图谱
- ├── 核心定位
- │   ├── 全书知识体系外部延伸索引  —— P001
- │   ├── 技能分类导航与学习路径索引  —— P001
- │   └── 按需检索与能力树构建总目录  —— P001
- ├── 覆盖板块
- │   ├── 流量获取技能  —— P001
- │   ├── 产品变现技能  —— P001
- │   ├── 私域运营技能  —— P001
- │   ├── 知识管理技能  —— P001
- │   └── 投资理财技能  —— P001
- ├── 关键性质
- │   ├── 索引性：提供"去哪里找"导航  —— P001
- │   ├── 结构化：分类清晰层级分明  —— P001
- │   └── 动态更新：随社区沉淀持续扩充  —— P001
- ├── 典型使用场景
