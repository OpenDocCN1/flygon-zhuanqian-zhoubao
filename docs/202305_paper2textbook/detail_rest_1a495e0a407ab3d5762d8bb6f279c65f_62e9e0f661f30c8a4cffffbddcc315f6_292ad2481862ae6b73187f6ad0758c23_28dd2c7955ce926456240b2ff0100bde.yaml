- '    ├── 仅提供链接索引不含教学内容  —— P001'
- '    ├── 依赖语雀文档外部链接有效性  —— P001'
- '    └── 分类体系基于现有沉淀可能不覆盖新赛道  —— P001'
life_analogy:
- 想象生财技能导航图谱是一张**大型商场的《楼层导览图》**：
- '- **技能板块** = 商场的不同楼层（流量获取层、变现层、私域层...）'
- '- **具体技能** = 各楼层的专柜/品牌（小红书SEO、闲鱼无货源、知识付费...）'
- '- **学习路径索引** = 导览图上的「推荐逛法路线」（新手入门线、进阶提升线、专项突破线）'
- '- **外部语雀链接** = 专柜的「详细介绍二维码/位置指引」——图谱本身不卖货（不教技能），只负责告诉你去哪个专柜买什么、怎么走最快'
- 就像逛商场前先看导览图能避免迷路、精准直达目标，学习生财技能前先看导航图谱能避免盲目收藏、系统化规划成长路径。
summary:
- concept: 生财技能导航图谱
  desc: 生财有术社区核心技能库的结构化分类汇总，提供技能分类导航与学习路径索引，作为全书知识体系的外部延伸索引
- concept: 核心板块覆盖
  desc: 流量获取、产品变现、私域运营、知识管理、投资理财五大核心商业能力板块
- concept: 索引性导航功能
  desc: 不直接教授技能，而是提供"去哪里找"、"先学什么后学什么"的导航指引，解决"不知道学什么/从哪学起"的困境
- concept: 结构化分类体系
  desc: 将平铺直叙的技能列表组织为分类清晰、层级分明的知识地图，支持按需检索与系统化能力树构建
- concept: 动态更新机制
  desc: 随社区新实战案例沉淀持续扩充，保持与前沿打法同步
- concept: 边界条件限制
  desc: 仅提供链接索引不含教学内容；依赖外部语雀文档链接有效性；分类体系基于现有沉淀可能不覆盖极新/极冷门赛道
exercises:
- 'no': 1
  title: 技能导航实战：定位你的下一个学习目标
  contents:
  - 假设你是一名已跑通小红书引流（日引50+私域）但后端转化乏力（客单价<100元、复购率<5%）的实操者：
  - 1. 打开生财技能导航图谱（语雀文档链接），在「私域运营」板块下寻找能解决「低客单价/低复购」的具体技能模块
  - 2. 记录该模块对应的精华帖/周报篇目编号
  - 3. 规划一条「本周学习-下周实操-下下周复盘」的3周行动计划
  - 回答问题：
  - '- 该技能模块的核心SOP包含哪几个关键动作？'
  - '- 如何将其与你现有的小红书前端流量打通形成闭环？'
- 'no': 2
  title: 能力树诊断：发现你的技能短板
  contents:
  - 基于生财技能导航图谱的五大核心板块（流量获取、产品变现、私域运营、知识管理、投资理财）：
  - 1. 为每个板块自我打分（1-10分，10分为精通可教他人）
  - 2. 识别得分最低的2个板块作为「短板领域」
  - 3. 在图谱中为每个短板领域挑选1个「高ROI入门技能」作为下月攻克目标
  - 回答问题：
  - '- 为什么这2个短板领域最制约你当前的商业进展？'
  - '- 选定的入门技能具备什么样的「低门槛、快反馈、可复用」特征？'
- 'no': 3
  title: 导航图谱迭代：设计你的专属技能地图
  contents:
  - 参考生财技能导航图谱的分类逻辑，结合你的主业/副业实战经历：
  - 1. 梳理你已掌握的所有商业技能，按「获客-转化-交付-复购-管理」全链路分类
  - 2. 标注每个技能的「熟练度（入门/熟练/精通）」「实战验证项目」「可迁移场景」
  - 3. 绘制一张你的「个人商业技能导航图谱 v1.0」（思维导图/表格/文档均可）
  - 回答问题：
  - '- 你的技能地图与生财官方图谱最大的结构差异在哪里？原因是什么？'
  - '- 计划每季度更新一次，设定什么触发条件会让你新增/删除/调整技能节点？'
