    desc: 提供通用正向词（画质/细节/人脸）与负向词（畸变/水印/低质量）模板，覆盖90%人像/通用生成场景，大幅降低新手调参门槛。
    role: definition
    src:
    - paper: docs/202305/HYrZdLBMRorB0qxKqFFcQ075nWf.md
    - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
  - 'no': 3
    name: Temperature差异化生成策略：控制确定性与创造性平衡
    desc: 带货文案建议0.3-0.7（保守连贯），创意文案设0.9（发散）；批量设定不同值生成多版本供筛选，规避查重与同质化。
    role: method
    src:
    - paper: docs/202305/20230516_075.md
  - 'no': 4
