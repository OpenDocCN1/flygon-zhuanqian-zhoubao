    src:
    - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
  - 'no': 6
    name: 有效提问协议：尊重他人注意力资源
    desc: 提问前穷尽自我搜索；单条消息包含完整背景、条件、预期目标，避免多轮往返浪费专家时间。
