- 'no': 1
  name: 认知重塑与行动力 —— 普通人逆袭的底层操作系统
  desc: 本章从认知心理学与实战复盘视角出发，拆解普通人如何通过建立“绿灯思维”、控制试错成本、双系统决策与极致行动力，打破阶层固化，在AI浪潮中实现从0到1的跃迁。
  nodes:
  - 'no': 1
    name: 绿灯思维：拥抱变化的认知开关
    desc: 对比“红灯思维”（习惯性防卫），建立面对新事物“先接受、再内化、后实践”的认知反射弧，打破舒适区惯性。
