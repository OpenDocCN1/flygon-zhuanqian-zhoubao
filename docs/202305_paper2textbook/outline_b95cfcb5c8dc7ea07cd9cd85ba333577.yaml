    desc: 指令模型先分析种子文案‘卖点表达结构与人群画像’，再迁移至新商品，保持段落结构不变实现‘套用模版’式改写。
    role: method
    src:
    - paper: docs/202305/20230516_075.md
  - 'no': 5
    name: ChatGPT中文调教12步法：基于模仿的少样本微调范式
    desc: 将训练狗指令迁移至LLM：引入背景→预设角色→输入完整案例→反馈学习效果→反馈优化→拆解教学→迭代优化模板→稳定输出，用结构化中文指令替代代码实现人设固化。
