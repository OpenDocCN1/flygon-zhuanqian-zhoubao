    name: 官方平台关键词数据优先原则：拒绝第三方预估，直连搜索日志
    desc: 百度关键词规划师、微信指数、抖音创意中心等官方后台数据为唯一决策依据；第三方工具（5118/站长工具）仅供参考，存在长尾覆盖盲区与数值偏差。
