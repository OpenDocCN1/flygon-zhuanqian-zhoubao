    desc: 设定资金/时间上限（如几十元买号、2K入群），将风险锁定在“多吃几天泡面可恢复”的区间，通过高频低成本试错积累确定性。
    role: method
    src:
    - paper: docs/202305/20230516_019.md
    - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
  - 'no': 3
    name: 双系统决策模型：直觉捕捉+理性验证
    desc: 基于《认知觉醒》理论，用系统1（潜意识）高速捕捉机会信号，用系统2（逻辑）分析可行性与ROI，克服犹豫与盲目。
    role: method
    src:
    - paper: docs/202305/20230516_019.md
    - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
  - 'no': 4
