- 'no': 5
  name: AI 视频内容生产线 —— 从小说推文到短剧CPS的标准化制造
  desc: 本章对标短视频平台算法机制，拆解AI小说推文、短剧CPS两大主流赛道的全流程SOP：选题/授权→文案提取/改写→AI绘图/剪辑→配音/特效→多平台分发→SEO霸屏/账号矩阵运营，并给出‘风格化原创’与‘矩阵化搬运’两条路线的ROI对比与避坑指南。
  nodes:
  - 'no': 1
    name: 赛道分层生存法则：女频批量 vs 男频风格化 vs 短剧CPS vs 解压素材
    desc: 女频（知乎/最右）适合改开头+批量矩阵；男频（番茄/QQ阅读）需提炼精华+高成本制作；短剧CPS核心三要素（选剧/剪辑/账号）；解压素材虽低俗但高变现确定性。新手建议优先跑通闭环，再考虑风格化。
    role: theorem
    src:
    - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
    - paper: docs/202305/EL9Fdl8WFoFxaixaJcLcqnXjn7r.md
  - 'no': 2
    name: AI小说推文‘一句话一图’公式化制作流程
    desc: 文案拆解为单句→结构化Prompt（主角+细节+动作+背景）→SD批量生图（DDIM/20-30步/高清修复）→配音情绪适配（爽文禁用低能量音色）→剪映关键帧动态化（推拉摇移消除PPT感）→发布变现。
    role: method
    src:
    - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
  - 'no': 3
    name: 短剧CPS‘虐-反转’循环剪辑公式与三分类解说形态
    desc: 核心剧情逻辑：一虐一反转刺激情绪起伏，3-6循环后反转前戛然而止引导转化；混剪/全解说/半解说三形态差异化去重，全解说模板法实现画面组合爆破式量产。
    role: method
    src:
    - paper: docs/202305/EL9Fdl8WFoFxaixaJcLcqnXjn7r.md
  - 'no': 4
    name: ChatGPT辅助解说文案生产SOP：提取-改写-防违规-配音-合成
    desc: 提取字幕→ChatGPT改写（同义替换/改名/改数字/调序）→分段投喂规避违规拦截→AI配音→剪映合成，标准化解决文案生产瓶颈与合规风险。
    role: method
    src:
    - paper: docs/202305/EL9Fdl8WFoFxaixaJcLcqnXjn7r.md
  - 'no': 5
    name: 去重组合拳与抖音SEO霸屏：构建流量护城河
    desc: 去重：裁剪/镜像/扫光/加标题/重字幕/调顺序/插叙/混剪素材组合4种以上；SEO：下拉词/相关搜索/大家都在搜系统性植入文案/描述/标签，配合RPA批量发布构建关键词覆盖矩阵。
    role: method
    src:
    - paper: docs/202305/EL9Fdl8WFoFxaixaJcLcqnXjn7r.md
    - paper: docs/202305/20230516_075.md
  - 'no': 6
    name: 账号冷启动与标签养成：高频发布+上热门检测+评论维护
    desc: 新号判定标准为‘无领域标签’而非注册时间；日更2-4条、多时段点击‘上热门’对抗持续抽查、全回复评论+置顶引导，以量博爆款概率并修正人群模型。
    role: method
    src:
    - paper: docs/202305/EL9Fdl8WFoFxaixaJcLcqnXjn7r.md
  - 'no': 7
    name: 实证对比：风格化原创（8小时/条、难矩阵）vs 矩阵化搬运（量大、收益稳）
    desc: 风格化路线：100%原创、可挂中视频、代入感强，但单条耗时8小时、无法矩阵、收益上限低；矩阵路线：日产几十条、月入十万可复制。新手避坑原则：优先验证闭环，无自动化工作流勿碰高耗时路线。
    role: experiment
    src:
    - paper: docs/202305/R2wRd6dN2oUtkOx9I3WcLHAOnzc.md
    - paper: docs/202305/EL9Fdl8WFoFxaixaJcLcqnXjn7r.md
