    src:
    - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
  - 'no': 6
    name: 提示词公式化/参数化：Excel批量生成结构化Prompt
    desc: 利用CONCAT函数将固定指令模板与变量数据分离，实现数据与指令解耦的批量化Prompt工程，配合RPA实现端到端自动化。
    role: method
    src:
    - paper: docs/202305/IZx7dx2CSo9x23xioUFcNaHcnRd.md
  - 'no': 7
    name: 人物一致性锚定法：无LoRA条件下的角色固定方案
    desc: 在所有Prompt中强制固定核心外貌特征词（如发色、瞳色、服饰），无需训练即可维持跨图角色视觉连续性，满足连载/系列化需求。
    role: method
    src:
