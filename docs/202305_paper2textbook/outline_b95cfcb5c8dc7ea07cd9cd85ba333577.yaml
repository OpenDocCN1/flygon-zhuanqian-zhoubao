    desc: 输入端关键词库（人工筛选/GPT扩展）→处理端GPT按Prompt批量生成平台调性内容→执行端RPA（影刀）模拟人工登录/编辑/发布/定时→产出端平台收录获取流量，实现7x24h无人值守。
