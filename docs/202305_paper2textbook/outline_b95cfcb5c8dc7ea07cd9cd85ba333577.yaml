- 'no': 2
  name: 提示词工程与模型调教 —— 让AI听懂人话并稳定产出
  desc: 本章系统讲解从结构化提示词模板、参数控制策略，到“调教”大模型形成稳定人设/风格的完整方法论，解决“会用工具”到“驾驭工具”的核心鸿沟。
  nodes:
  - 'no': 1
    name: 结构化提示词模板法：五段式公式与权重语法
    desc: 将Prompt拆解为[质量词+主体+细节+服饰+环境]结构化模板，配合(词:权重)语法精准控制生成细节，实现复杂意图的标准化表达。
