    src:
    - paper: docs/202305/CBJhdD0dTokH8tx8HKYc1nJSnnc.md
  - 'no': 7
    name: 实证：应届生两周变现7000元的完整复盘
    desc: 从加群、买号、调教、分销、写教程、办训练营、建星球、账号分销的全时间线复盘，验证上述认知模型的实战有效性。
