paper: 20230905_70.md（未来5年互联网造就新个体）
desc: 该素材提出未来5年互联网将造就一批'新个体'，其典型存在状态为'一人公司+数字游民'，即在无固定办公地点、无雇佣员工的情况下，借助互联网实现一人即公司、拥有稳定可持续商业模式，且多数从业者年收入可达几十万至300万元。
concepts:
- name: 新个体
  desc: 该概念指由互联网赋能、以单一个体为基本经营单元的新型经济主体，其区别于传统个体户或自由职业者，具备公司化运营能力与规模化收入潜力。
  is_original: true
  excerpt:
  - 未来5年互联网造就一批新个体。
- name: 一人公司
  desc: 该概念指以单一个体构成完整商业闭环的经营形态，无雇佣员工、无固定办公地点，但具备稳定可持续的商业模式。
  is_original: true
  excerpt:
  - 一个人就是一家公司，无固定办公地点、无雇佣员工、有较为稳定可持续的模式
- name: 数字游民
  desc: 该概念指依托互联网技术实现地理自由、工作地点不受实体办公室束缚的职业人群，是新个体的典型存在状态之一。
  is_original: true
  excerpt:
  - 典型存在状态是一人公司+数字游民。
methods:
- name: __overview__
  desc: 素材以趋势前瞻的方式，通过定义典型状态（一人公司+数字游民）和量化收入区间（几十万到300W）来刻画'新个体'这一互联网经济新形态。
  excerpt:
  - 典型存在状态是一人公司+数字游民。一个人就是一家公司，无固定办公地点、无雇佣员工、有较为稳定可持续的模式，大部分人一年可收入几十万到300W。
theorems:
- name: 互联网造就新个体趋势论
  desc: 该核心主张认为未来5年内，互联网将系统性造就一批'新个体'，其存在形态为一人公司与数字游民的结合。
  excerpt:
  - 未来5年互联网造就一批新个体。
- name: 新个体高收入可持续论
  desc: 该核心主张认为新个体具备稳定可持续的商业模式，且大多数人年收入可达几十万至300万元。
  excerpt:
  - 有较为稳定可持续的模式，大部分人一年可收入几十万到300W。
findings:
- name: 新个体收入区间发现
  desc: '[claim] 素材宣称大部分新个体年收入在几十万到300W之间；[evidence] 素材未提供具体统计样本或数据支撑，仅为趋势性断言。'
  excerpt:
  - 大部分人一年可收入几十万到300W。
- name: 新个体经营特征发现
  desc: '[claim] 素材宣称新个体无固定办公地点、无雇佣员工；[evidence] 素材以典型状态描述呈现，未提供案例或实证数据佐证。'
  excerpt:
  - 无固定办公地点、无雇佣员工、有较为稳定可持续的模式
