    function:
      arguments: '{"fname": "教科书.md", "text": "# AI 新个体：普通人如何借 AI 实现内容创富\n\n> 从认知升维到实战变现的完整指南\n>\n>
        本书根据\"龙哥赚钱周报\"2023 年 9 月生财有术社区精华内容整理改编，融合认知方法论、AI 提示词工程、平台变现案例与执行落地策略。\n\n##
        前言：为什么写这本书\n\n互联网正在造就一批\"新个体\"——一人公司 + 数字游民，一个人就是一家公司，年收入从几十万到 300 万。这批新个体的核心资产不是固定资产，而是**认知**与**用
        AI 武装起来的内容生产力**。\n\n本书围绕一条主线展开：AI 时代，个体如何借助内容生产力实现低成本创富。全书按四段式展开——**认知（信）→
        工具（能）→ 案例（干）→ 行动（得）**，从建立 AI 新个体认知，到掌握提示词与 AI 工具，再到通过平台业务实现真实增长，最终形成可复制的行动与变现体系。\n\n每条知识点都标注了来源素材（P001
        等），可回溯到原始文章。\n\n---\n\n# 第一部分 认知底层与知识体系构建\n\n## 第 1 章 信息素养——从信息垃圾场到认知过滤器\n\n###
        学习目标\n- 理解信息垃圾论核心主张\n- 掌握信息价值悖论\n- 了解免费信息经济学\n\n### 1.1 生活类比：自助餐厅里的信息晚餐\n想象你走进一家巨大的自助餐厅，上百个餐台摆满了各式菜肴。但绝大多数菜只是摆盘精美、营养价值极低的预制食品。角落里免费的试吃小样不要钱，但分量小、口味大众，目的是把你吸引到付费的定制套餐上。这就是你今天面对的信息世界。你的任务不是吃更多，而是学会分辨什么值得入口——这就是信息素养的起点。\n\n###
        1.2 信息垃圾论：你身边99%的信息都毫无价值\n> [P001, p.1] \"99%信息是垃圾\" ——《信息垃圾论》\n\n假设你刷十分钟社交媒体，问自己：有多少信息改变了你的认知、决策或行动？大概率是零。这就是信息垃圾论：互联网上99%的信息是垃圾，它们占据注意力却不给回报。垃圾信息具有**普遍性**（数量占绝对优势）和**隐蔽性**（包装精美难以识别）。\n\n这两条性质共同指向一个结论：**你需要的不是更多信息，而是一个过滤器**。你的认知过滤器应主动拦截无关信息，只让高质量信息进入大脑。\n\n###
        1.3 信息价值悖论：信息本身不值钱，有用信息值钱\n> [P001, p.2] \"有用信息一直值钱，整合就能收钱\" ——《信息价值的悖论》\n\n免费的是信息，贵的是\"有用\"。原始信息像铁矿——储量丰富、价格低廉。从原始信息到\"能用的信息\"，隔着一整套筛选、验证、整合、提炼流程。信息的价值从\"占有\"转移到\"加工\"：谁能把公开信息转化为有用的判断，谁就拥有价值。\n\n$$\n\\text{信息价值}
        = \\frac{\\text{有用性}}{\\text{获取成本}} \\times \\text{排他性}\n$$\n\n### 1.4 免费信息经济学：免费是世上最贵的东西\n>
        [P001, p.3] \"免费信息是钩子\" ——《免费信息经济学》\n\n免费是钩子。超市在门口摆试吃台，不是为了让你免费吃饱，而是为了让你进店买正装。你虽没付钱，但付的是**注意力**和**行为数据**。免费信息不是礼物，而是营销的起点。\n\n###
        1.5 本章小结\n本章建立信息素养底层框架：识别垃圾（信息垃圾论）、判断价值（信息价值悖论）、理解动机（免费信息经济学）。\n\n---\n\n##
        第 2 章 认知升级——打破\"高认知穷人\"的伪命题\n\n### 学习目标\n- 理解\"高认知穷人\"伪概念本质\n- 掌握认知多维模型\n-
        学会聚焦式深度认知法\n\n### 2.1 生活类比：冰山一角\n结果是露出水面的冰尖，认知是水下庞大的冰体。冰尖是冰体的自然延伸——如果一个人说\"我认知很高但就是没结果\"，这本身就矛盾。真正的高认知必然伴随结果浮出水面。\n\n###
        2.2 \"高认知穷人\"是一个伪命题\n> [P002] \"不存在高认知穷人\" ——《聊聊高认知穷人》（粥左罗）\n\n表面的认知是能复述概念（\"知道\"），实质的认知是能用概念解决问题并产出结果（\"做到\"）。\"高认知穷人\"混淆了这两个层次。真正的高认知经过结果检验。\n\n**结果验证性**：认知有效性
        = f(深度, 广度, 具体度, 实战度)。认知闭环 = 认知→行动→结果→反馈→认知升级。若长期无结果，说明认知闭环断裂。\n\n### 2.3
        认知多维模型\n> [P002] \"认知有多个维度\"\n\n认知由**深度**（触达本质）、**广度**（跨领域）、**具体度**（落地细节）、**实战度**（真实执行）四维度构成。四维度相乘：\n\n$$\n\\text{认知产出}
        = \\text{深度} \\times \\text{广度} \\times \\text{具体度} \\times \\text{实战度}\n$$\n\n任何一个维度为零，整体产出即为零。提升短板比拉长长板更具杠杆效应。\n\n###
        2.4 聚焦式深度认知法\n> [P002] \"专注想赚钱的领域\"\n\n在选定领域单点打穿，用结果倒逼认知迭代。先有深度，再谈广度。\n\n###
        2.5 认知边界与适配\n> [P002] \"认知必须与资源匹配\"\n\n认知有效性受资源约束，存在资源下限阈值。认知须与资金、时间、人脉、体力匹配才能落地。\n\n###
        2.6 本章小结\n本章拆解\"高认知穷人\"伪命题（认知须由结果验证），引入认知多维模型（四维相乘），学习聚焦式深度认知法与认知边界适配。\n\n---\n\n##
        第 3 章 知识体系建设——从\"玄学试错\"到\"科学模式\"\n\n### 学习目标\n- 对比科学模式与玄学模式\n- 掌握知识体系本质\n-
        学会从案例到假设\n\n### 3.1 生活类比\n到一个陌生城市完成任务。玄学模式是出门碰运气，走错就退回来重走。科学模式是先买地图，标出起点终点，规划路线。知识体系就是这张地图，先画地图再行军。\n\n###
        3.2 科学模式与玄学模式\n> [P003] \"科学模式先建知识体系\" ——《什么样的知识体系对赚钱有意义》（徐宿）\n\n玄学模式不做前期调研，直接尝试，成功归运气，失败归运气差。科学模式先问：参与方是谁？因果是什么？我在哪？回答清楚就画出了地图。科学模式把试错成本分摊在行动前的思考期，经验可复利累积。\n\n###
        3.3 知识体系本质\n> [P003] \"核心是世界观与方法论\"\n\n知识体系是一张**因果网络**：知识体系 = (C, R)，C 是概念节点，R
        是因果边。价值不在于节点多少，而在于多少条边——能否从 A 推导到 B。世界观解释世界，方法论改造世界，**价值交换**是底层原理。\n\n###
        3.4 从案例到假设\n> [P003] \"一切都是假设\"\n\n案例经裁剪、因果归属未必可靠、产生于特定条件。正确姿势：把案例视为待验证命题，提取因果主张，对照因果网络，小范围验证，验证通过才纳入体系。未经处理的信息会带来\"知道感错觉\"的负面状态。\n\n###
        3.5 底层能力提炼\n> [P003] \"掌握100个思维模型\" —— 查理·芒格\n\n知识体系不在于量，而在提炼底层能力。找最根本因果，以不变应万变，知识相通。用塔尖的底层原理推导各种应用，而非背诵每个应用。\n\n###
        3.6 本章小结\n本章从玄学试错切换到科学模式：先画地图，知识体系是因果网络，案例是待验证假设，提炼底层能力以不变应万变。\n\n---\n\n##
        第 4 章 新个体经济——把认知势能转化为收入价值\n\n### 学习目标\n- 理解新个体概念\n- 掌握新个体收入结构\n\n### 4.1 生活类比\n一个人开了一家只有一名员工的餐厅：既是厨师、又是服务员、还是收银员。一人公司就是新个体经济的起点。\n\n###
        4.2 新个体的觉醒\n> [P004] \"一人公司数字游民\" ——《未来5年互联网造就新个体》（亦仁收藏夹）\n\n**一人公司** = 以个人为最小商业单元，无雇佣员工，无固定办公地点，依靠数字工具完成价值交付。这是组织小型化趋势的终点。一人公司要求个体同时具备市场洞察力、产品化能力、获客能力、交付维护能力。\n\n###
        4.3 新个体的收入结构\n> [P004] \"年入几十万到300W\"\n\n年收入区间下限高于普通工薪，上限不亚于中小企业主。支撑的是地点自由、组织自由、定价自由三重红利。\n\n###
        4.4 认知变现的闭环\n> [P004] \"信息筛选认知深化\"\n\n**信息筛选 → 认知深化 → 知识体系 → 新个体应用**的认知变现闭环。信息本身不值钱，值钱的是经过你认知加工后的判断。\n\n###
        4.5 本章小结\n理解一人公司与数字游民合流而成的新个体，认知变现闭环四步：信息筛选→认知深化→知识体系→新个体应用。\n\n---\n\n# 第二部分
        AI 提示词工程与智能协作\n\n## 第 5 章 提示词工程基础——学会与模型对话\n\n### 学习目标\n- 理解提示词工程价值\n- 掌握官方六大策略\n\n###
        5.1 生活类比\n提示词之于大语言模型，正如钥匙之于门锁。同样的模型，模糊问题得到平庸回答，清晰指令激发深层能力。**问对问题比回答问题更重要**。\n\n###
        5.2 为什么需要提示词工程\n> [P001] \"AI降低普通人创作门槛\"\n\n$$\n\\text{Output} = f_\\theta(\\text{Prompt})\n$$\n\n模型参数固定，唯一可变的变量是
        Prompt。提升输出质量的全部杠杆集中在设计 Prompt。\n\n### 5.3 官方六大最佳实践\n> [P001] \"编写清晰指令\" ——
        基于 OpenAI 官方提示词最佳实践\n\nOpenAI 六大策略：\n1. **编写清晰指令**：设定角色、对象、受众、重点、长度约束\n2.
        **提供参考文本**：把范文塞进提示词，少让模型猜\n3. **分解复杂任务**：拆为多个简单子任务，分而治之\n4. **给予思考时间**：要求逐步思考（思维链）\n5.
        **使用外部工具**：精确计算、实时检索用工具\n6. **系统测试**：建立测试集评估鲁棒性\n\n### 5.4 结构化 Prompt\n> [P001]
        \"高效可控\" ——《结构化 Prompt》\n\n结构化 Prompt 用格式约束行为，四个关键节：**角色**、**背景**、**任务**、**输出格式**。条件越多输出确定性越高。\n\n###
        5.5 参数流提问\n> [P001] \"参数流结构化\" ——《玩转 Claude》\n\n把提示词关键变量提取为参数，模板函数化。固定骨架，只改参数值，像调用函数。批量多风格生成尤其有效。\n\n###
        5.6 本章小结\n学会与模型对话：提示词决定输出上限，掌握六大策略、结构化 Prompt、参数流提问。\n\n---\n\n## 第 6 章 进阶提示技巧——从\"会问\"到\"问得好\"\n\n###
        学习目标\n- 掌握 Few-shot 学习\n- 学会 BRTR 写作指令\n\n### 6.1 生活类比\n主管给出几份优秀周报说\"照这个格式写\"，你立刻有方向。Few-shot
        就是给模型几个模范生例子，让它照猫画虎归纳规律。\n\n### 6.2 Few-shot 学习\n> [P001] \"按分类构建数据集\"\n\nFew-shot
        结构：任务声明 + 示范样本 + 待处理输入。构建高质量示例：覆盖全部分类、示例代表性强、格式一致。**多 GPT 分工**：将复杂任务拆解为子任务，每环用
        Few-shot 约束。\n\n### 6.3 BRTR 写作指令原则\n> [P001] \"BRTR原则\" ——《GPT写作指令进阶》\n\nBRTR
        = **B**ackground（背景）+ **R**ole（角色）+ **T**ask（任务）+ **R**equirement（要求）。四维度消除歧义，把写作隐性知识变成显性指令。\n\n###
        6.4 业务逻辑优先\n> [P001] \"业务逻辑为前提\" ——《看清业务逻辑，别让GPT成为美丽废物》\n\n提示词不是万能药。先明确业务目标、受众、边界，再写提示词，避免\"美丽废物\"。\n\n###
        6.5 本章小结\n从会问到问得好：Few-shot 照猫画虎，BRTR 结构化指令，业务逻辑优先。\n\n---\n\n# 第三部分 多平台流量获取与变现闭环设计\n\n##
        第 7 章 流量变现的底层逻辑——从\"阅读量\"到\"收益\"的距离\n\n### 学习目标\n- 理解收益与流量的距离\n\n### 7.1 生活类比\n阅读量是车流量，收益是收费站收入。车流如织，如果收费站位置不佳、收费规则不合理，收入也可能惨淡。\n\n###
        7.2 数据驱动的收益优化\n> [P007] \"在阅读量不变下提升收益\" ——《三大招，公众号流量主收益提升10倍》\n\n$$\n\\text{收益}
        = \\text{阅读量} \\times \\text{广告单价} \\times \\text{点击率}\n$$\n\n当阅读量增长遇瓶颈时，可提升广告单价和点击率。\n\n###
        7.3 流量主收益优化方法\n> [P007] \"流量主收益优化方法\"\n\n三步：观察后台数据诊断问题、调整广告位位置与样式、优化内容相关性。内容相关性直接提升点击率和广告单价。\n\n###
        7.4 本章小结\n从阅读量到收益的距离：收益公式三杠杆，数据驱动优化，广告位与内容相关性。\n\n---\n\n## 第 8 章 平台化变现模式——从单点尝试到系统闭环\n\n###
        学习目标\n- 理解小红书店群\n- 掌握闲鱼引流闭环\n\n### 8.1 生活类比\n店群像连锁快餐：流程拆成标准化操作手册，复制到第二家第三家门店。你不需要顶级大厨，只需把系统搭好、流程跑通。\n\n###
        8.2 小红书店群商业模式\n> [P012] \"整治无货后高层次玩法\" ——《小红书店群》\n\n店群核心是把开店从手艺活变流水线。模块化三块：选品模块、上架模块、运营模块。模块化降低的不是资金门槛而是人员门槛。闭环飞轮：店越多积累数据经验越多，新店启动越快。\n\n###
        8.3 店群适用边界\n> [P012] \"平台会整治无货\"\n\n无货源模式（一件代发）会被平台识别整治。低门槛和低风险不可兼得。高层次玩法用真实货权、稳定供应链支撑扩张，比例性比速度更重要。\n\n###
        8.4 闲鱼引流闭环\n> [P012] \"四个月1.5W粉变现25W\" ——《闲鱼引流创业粉》\n\n闭环：闲鱼免费流量→引流私域→价值输出建立信任→高客单转化。前端免费引流、后端高客单变现的双层漏斗。\n\n###
        8.5 知识博主闭环系统\n> [P009] \"内容流量私域产品\" ——《知识博主流量变现闭环》\n\n内容→流量→私域→产品→转化五步。内容不只是引流工具，是信任的载体。可复制的
        0-1 框架：你卖的产品本身就是创业过程的产物。\n\n### 8.6 本章小结\n三条平台化变现路径：小红书店群靠规模，闲鱼闭环靠信任深度，知识博主靠内容资产。共性：先建闭环再系统化复制。\n\n---\n\n##
        第 9 章 个人 IP 的系统化构建——把内容做成生意\n\n### 学习目标\n- 理解知识博主变现闭环\n\n### 9.1 生活类比\n个人
        IP 像品牌店：内容是橱窗，公域流量是进店，私域是复购，产品是成交。\n\n### 9.2 知识博主变现闭环\n> [P009] \"内容流量私域产品\"\n\n闭环四模块：内容产出、公域流量获取、私域沉淀、产品转化。流量非终点而是私域的起点，私域信任决定转化效率与客单价。\n\n###
        9.3 从单点内容到闭环\n> [P009] \"钩子引流私域培育产品收割\"\n\n三步：钩子内容引流、私域信任培育、产品设计收割。分步转化，由浅入深。\n\n###
        9.4 新世代商业生态\n> [P017] \"小众圈层语言\" ——《窥见10后世界》\n\n新一代用圈层语言重新定义内容消费。IP 变现调整：融入圈层语境、承认圈层边界、共创内容价值。构建\"圈层成员-共建者\"的平等关系。\n\n###
        9.5 本章小结\n把内容做成生意：内容-流量-私域-产品闭环，从单点内容到闭环设计，新世代圈层生态。\n\n---\n\n# 第四部分 项目实操与执行落地策略\n\n##
        第 10 章 利润猎手的入场卷——从信息差到细分需求\n\n### 学习目标\n- 理解红海入场决策\n- 掌握信息差套利\n\n### 10.1
        生活类比\n信息差像套利：同一件商品不同市场价格不同，低买高卖赚差价。信息、认知、资源、服务能力的落差就是利润空间。\n\n### 10.2 红海市场的入场决策\n>
        [P014] \"选址定生死\" ——《奶茶店到底挣不挣钱》\n\n选址决定你面前是鲨鱼还是小鱼。三层：选址定生死、规避正面竞争、差异化生存空间。在竞争稀疏但需求真实的区域选择足够小的切口。\n\n###
        10.3 信息差套利模式\n> [P011] \"站外推广赚信息差\" ——《转型站外推广服务商》\n\n信息差套利本质是供需、认知、资源三方面不对等。\n\n$$\n\\text{利润}
        = \\text{信息差} \\times \\text{套利次数} \\times \\text{杠杆系数}\n$$\n\n中间商是信息枢纽，站在供需两端把信息不对称变成利润。\n\n###
        10.4 需求验证方法论\n> [P015] \"1000个MRR案例\" ——《海外工具MRR案例》\n\n与其猜需求是否存在，不如找大量真实存在的小案例验证。收集大量小案例观察共同特征。小案例比大报告更可靠，避免自嗨。\n\n###
        10.5 本章小结\n从信息差到细分需求：红海入场决策选址定生死，信息差套利，需求验证方法论。\n\n---\n\n## 第 11 章 执行的智慧——把\"最优\"让位于\"可行\"\n\n###
        学习目标\n- 理解约束下可执行\n- 掌握项目生命周期\n\n### 11.1 生活类比\n约束下执行像拼图：无法选择碎片的样子，任务是在现有碎片约束下拼出完整的图。可落地方案比最优方案更值得投入。\n\n###
        11.2 约束下的可执行原则\n> [P005] \"约束条件下最可落地方案\" ——《能做得更好为啥我不做》\n\n预算有上限、时间有期限、团队技能有边界。**可执行是前提，最优是目标**。在边界内找到最快启动、最稳落地的方案。\n\n###
        11.3 项目生命周期适配策略\n> [P006] \"信息差红利期成熟期\" ——《分阶段的搞钱攻略》\n\n红利期靠信息差快速占领市场，成熟期靠相对实力差异化竞争。策略
        = f(阶段特征, 团队实力)。没有适合所有场景的策略，策略只在合适场景下发挥威力。\n\n### 11.4 SOP 化执行\n> [P006] \"视频剪辑SOP\"\n\nSOP
        化把非标准工作拆成标准流程，用模板批量生产稳定输出。提高下限，让新人也能产出及格作品。\n\n### 11.5 本章小结\n执行的智慧：约束下可执行优于最优，生命周期适配策略，SOP
        化执行。\n\n---\n\n## 第 12 章 财富阶梯进阶——从掘金新手到生态玩家\n\n### 学习目标\n- 理解利润迁移\n- 掌握第二曲线策略\n\n###
        12.1 生活类比\n执行者是搬砖工，靠出卖体力时间换钱；架构师是盖楼者，拥有整栋楼的价值。楼会老化，楼层租金会下降——这就是生命周期。\n\n###
        12.2 生命周期与利润迁移\n> [P006] \"利润生命周期迁移\" ——《分阶段的搞钱攻略》\n\n红利期→快速收割（利润率高竞争少），成熟期→及时转型（利润率降竞争加剧），衰退期→退出或重构。顺势而为，在每个阶段做该阶段最正确的事。\n\n###
        12.3 从执行者到架构师\n> [P011] \"执行者架构师\"\n\n执行者 = 卖时间 + 卖精力（线性收入有天花板）。架构师 = 建系统
        + 卖体系（指数收入可复制）。跃迁路径：流程化 SOP→系统化产品→放权。\n\n### 12.4 组合拳策略与第二曲线\n> [P006] \"组合拳策略\"\n\n组合拳
        = 信息差 + SOP 系统化 + 生命周期管理。第二曲线 = f(组合拳, 相邻领域扩展)。在第一条曲线成熟期中后段启动探索。\n\n### 12.5
        本章小结\n财富阶梯：利润生命周期迁移，执行者到架构师维度升级，组合拳打出第二曲线。\n\n---\n\n# 第五部分 AI 商业化赋能与新个体生态展望\n\n##
        第 13 章 AIGC 商业逻辑——从技术新奇到利润转化\n\n### 学习目标\n- 理解转化率核心指标\n- 掌握妙鸭相机案例\n\n### 13.1
        生活类比\nAIGC 转化率像漏斗：100 人看到菜单，50 人点单，30 人觉得好吃，10 人发朋友圈。技术团队沉浸在生成效果有多惊艳，商业上要紧的是从惊艳到付费的转化率。\n\n###
        13.2 转化率核心指标\n> [P007] \"AIGC核心是转化率\" ——《AIGC商业化的13个非共识认知》（黄钊）\n\n$$\n\\text{转化率}
        = \\frac{\\text{付费用户数}}{\\text{接触产品用户数}}\n$$\n\n转化率不等于使用率；转化率是利润属性；转化率是北极星指标。效率竞争是军备竞赛，转化率竞争是定位与运营。\n\n###
        13.3 行业 know-how 壁垒\n> [P007] \"行业know-how\"\n\n$$ \\text{护城河强度} = \\frac{\\text{行业深度认知}}{\\text{技术通用性}}
        $$\n\n技术趋于通用时护城河下降；行业深度认知不可替代时壁垒仍在。情感 AI 是低枝果实。技术优势是暂时的，行业认知是持久的。\n\n### 13.4
        To 人 To AI 范式\n> [P007] \"按服务对象划分\"\n\n未来市场按服务对象是人还是 AI 划分。To 人产品重视留存体验，To
        AI 产品重视稳定性成本。对标通信 IT 行业的 M2M 演进。\n\n### 13.5 妙鸭相机案例：商业化前置\n> [P007] \"多模态工作流商业化前置\"
        ——《万字解析妙鸭相机》\n\n商业化前置：研发阶段先把定价、目标用户、付费链路设计好。三层成功要素：精准定位（女性写真）、商业化前置（定价 9.9
        元）、AI 产品运营（种草裂变）。商业化不是产品完成后的附属品，而是产品设计的第一性原理。\n\n### 13.6 本章小结\nAIGC 商业逻辑：转化率是北极星，行业
        know-how 是护城河，To 人 To AI 划分，妙鸭相机商业化前置。\n\n---\n\n# 附录 A 术语对照表\n\n| 术语 | 别名
        | 首次出现 |\n|------|------|---------|\n| 认知成长 | 认知提升 | 第1章 |\n| 聚焦式深度认知法 | 深度认知
        | 第2章 |\n| 知识体系 | 知识框架 | 第3章 |\n| 科学模式 / 玄学模式 | 因果网络做事 | 第3章 |\n| 案例不是事实 |
        一切皆假设 | 第3章 |\n| 信息差 | 信息不对称 | 第3章 |\n| 场景适配定理 | 阶段策略 | 第12章 |\n| 提示词工程 |
        Prompt工程 | 第5章 |\n| 结构化Prompt | 结构化提示词 | 第5章 |\n| Few-shot | 少样本学习 | 第6章 |\n|
        思维链 | CoT | 第5章 |\n| BRTR | — | 第6章 |\n| 转化率（利润属性） | 北极星指标 | 第13章 |\n| 行业know-how
        | 行业深度认知 | 第13章 |\n| 情感AI | 低枝果实 | 第13章 |\n| To人/ToAI | 面向人/面向AI | 第13章 |\n|
        一人公司 | solo company | 第4章 |\n| 数字游民 | digital nomad | 第4章 |\n| 内容-流量-私域-产品
        | 变现闭环 | 第8章 |\n| 收益公式 | 阅读量×单价×点击率 | 第7章 |\n| 信息差套利 | 信息套利 | 第10章 |\n| 无货源整治
        | 平台合规 | 第8章 |\n| 商业化前置 | 先定价再研发 | 第13章 |\n| 选址定生死 | 位置决定成败 | 第10章 |\n| 第二曲线
        | 相邻领域扩展 | 第12章 |\n| MRR | 月度经常性收入 | 第10章 |\n\n---\n\n# 附录 B 全书资料来源\n\n本书内容源自以下原始素材（生财有术社区
        2023 年 9 月精华帖）：\n\n- P001 信息素养相关：《互联网上99%的信息都是垃圾信息》《提示词官方最佳实践》等\n- P002 《聊聊高认知穷人》\n-
        P003 《什么样的知识体系对赚钱有意义》\n- P004 《未来5年互联网造就新个体》\n- P005 《能做得更好为啥我不做》\n- P006
        《分阶段的搞钱攻略》《原创视频剪辑步骤》\n- P007 《AIGC商业化的13个非共识认知》《万亿解析妙鸭相机》\n- P009 《知识博主流量变现闭环系统》\n-
        P011 《转型做站外推广服务商》\n- P012 《小红书店群》《闲鱼引流创业粉》\n- P014 《奶茶店到底挣不挣钱》\n- P015 《海外工具MRR案例》\n-
        P017 《窥见10后世界》\n\n> 说明：个别素材正文存放于外部链接（语雀/飞书），本书取其公开披露的核心观点与操作方法进行教学化整理。原始观点版权归原作者所有。"}'
