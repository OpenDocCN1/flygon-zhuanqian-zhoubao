  content: "{\n  \"paper\": \"20230905_02.md（聊聊高认知穷人）\",\n  \"desc\": \"该素材由粥左罗撰写，核心论点是否认'高认知穷人'这一概念的存在，主张只存在'看似高认知的穷人'。素材指出多数人的高认知来自听书、读书、课程的复制，并未经过深刻理解与实践检验。作者提出认知具有深度、广度、具体度、细节度、实战度等多维度属性，并强调赚钱能力取决于认知深度，而高认知本身是'把事情做成'的结果，需要通过实践与现实反复碰撞，将他人的一句话认知转化为自己的深度认知。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"高认知穷人\",\n      \"desc\": \"作者所批判的伪概念，指那些看似拥有高认知却在现实中未能获得对应经济回报的人；作者认为该说法不成立，因为真正的认知必然伴随现实结果。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"不存在高认知穷人，只存在看似高认知的穷人。\"\
    ,\n        \"多数人观点认知来自听书读课复制，并未深刻理解。\"\n      ]\n    },\n    {\n      \"name\"\
