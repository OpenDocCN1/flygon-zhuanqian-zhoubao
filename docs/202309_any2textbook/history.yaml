        差异化定位\n区别于单纯 AI 工具教程或内容营销书，本书以\"新个体\"身份重构，融合非共识认知、IP 打造与可复制案例，强调\"用 AI 武装个人商业体\"的路径。\n\n##
        推荐书名\n- 主书名：AI 新个体：普通人如何借 AI 实现内容创富\n- 副标题：从认知升维到实战变现的完整指南\n- 备选1：新个体来了：AI
        时代的内容生产力革命\n- 备选2：AI 创富方法论：从提示词到年入百万\n\n## 结构逻辑（信→能→干→得）\n1. 建立 AI 新个体认知（信）\n2.
        掌握提示词与 AI 工具（能）\n3. 通过各平台业务实现真实增长（干）\n4. 形成可复制的行动与变现体系（得）\n\n## 目录草案\n1. 认知篇：AI
        新个体——告别高认知穷人\n2. 认知篇：10 后世界与 AI 赋能的生产力革命\n3. 工具篇：提示词原则与官方最佳实践\n4. 工具篇：结构化
        Prompt 与参数流 Claude 深度用法\n5. 工具篇：AIGC 非共识与 GPT 写作指令进阶\n6. 案例篇：内容创业——知识博主闭环与公众号流量主\n7.
        案例篇：电商与副业——小红书店铺/闲鱼引流/站外推广\n8. 案例篇：妙鸭相机解析与 MRR 订阅制收入\n9. 行动篇：分阶段搞钱攻略与 AI 变现业务设计\n10.
        行动篇：构建个人知识体系与持续执行力系统\n\n## 保留 / 合并 / 排除原则\n- **保留**（常青方法论与结构性洞察）：高认知穷人、知识体系、分阶段搞钱攻略、提示词官方最佳实践、结构化
        Prompt、AIGC 13 个非共识、妙鸭相机解析、知识博主闭环、小红书店铺、MRR 案例、新个体。\n- **合并重写**：多个平台运营案例（公众号流量主、闲鱼引流、站外推广、小红书店铺）合并为\"案例篇\"；多个提示词物料合并为\"工具篇\"统一整理原则与模板；时效性强的视频号玩法降级为补充案例。\n-
        **删除**：纯索引类内容。\n\n## 需要补写\n- 每章行动清单 / 思考题\n- 案例的通用方法论拆解（从特例到通则）\n- 工具更新与选择建议\n-
        平台合规与 AI 内容监管的风险提示\n- 完整的行动落地指南\n\n## 下一步产物\n《AI 新个体：普通人如何借 AI 实现内容创富》全书初稿（教科书.md）"}'
