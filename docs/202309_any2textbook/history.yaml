        "experiment", "src": [{"paper": "20230912_24.md"}]}]}], "bodies": ["# 第 1
        章 信息素养——从信息垃圾场到认知过滤器\n\n## 学习目标\n\n- 理解信息垃圾论核心主张\n- 掌握信息价值悖论\n- 了解免费信息经济学\n\n##
        1.1 生活类比：自助餐厅里的信息晚餐\n\n想象你走进一家巨大的自助餐厅，上百个餐台摆满了各式菜肴。但绝大多数菜只是摆盘精美、营养价值极低的预制食品。你要在这片丰盛得令人窒息的海洋中，找到真正符合自己口味的招牌菜。角落里免费的试吃小样不要钱，但分量小、口味大众，目的是把你吸引到付费的定制套餐上。\n\n这就是你今天面对的信息世界。互联网就是那家自助餐厅，绝大多数是营养匮乏的食品。你的任务不是吃更多，而是学会分辨什么值得入口——这就是信息素养的起点。\n\n##
        1.3 信息垃圾论：你身边99%的信息都毫无价值\n\n> [P001, p.1] \"99%信息是垃圾\"\n\n假设你刷十分钟社交媒体，问自己：有多少信息改变了你的认知、决策或行动？大概率是零。这就是信息垃圾论：互联网上99%的信息是垃圾，它们占据注意力却不给回报。垃圾信息具有普遍性（数量占绝对优势）和隐蔽性（包装精美难以识别）。\n\n这两条性质共同指向一个结论：你需要的不是更多信息，而是一个过滤器。你的认知过滤器应主动拦截无关信息，只让高质量信息进入大脑。\n\n##
        1.4 信息价值悖论：信息本身不值钱，有用信息值钱\n\n> [P001, p.2] \"有用信息一直值钱，整合就能收钱\"\n\n免费的是信息，贵的是有用。原始信息像铁矿——储量丰富、价格低廉。从原始信息到能用信息，隔着一整套筛选、验证、整合、提炼流程。信息的价值从占有转移到加工：谁能把公开信息转化为有用的判断，谁就拥有价值。\n\n##
        1.5 免费信息经济学：免费是世上最贵的东西\n\n> [P001, p.3] \"免费信息是钩子\"\n\n免费是钩子。你虽没付钱，但付的是注意力和行为数据。免费信息不是礼物，而是营销的起点。当免费内容开始影响你的时间分配、决策逻辑时，它就是商品。\n\n##
        1.9 本章小结\n\n本章建立信息素养底层框架：识别垃圾（信息垃圾论）、判断价值（信息价值悖论）、理解动机（免费信息经济学）。", "# 第 2
        章 认知升级——打破高认知穷人的伪命题\n\n## 学习目标\n\n- 理解高认知穷人伪概念本质\n- 掌握认知多维模型\n- 学会聚焦式深度认知法\n\n##
        2.1 生活类比：冰山一角\n\n结果是露出水面的冰尖，认知是水下庞大的冰体。冰尖是冰体的自然延伸——如果一个人说我认知很高但就是没结果，这本身就矛盾。真正的高认知必然伴随结果浮出水面。\n\n##
        2.3 高认知穷人是一个伪命题\n\n> [20230905_02.md] \"不存在高认知穷人\"\n\n表面的认知是能复述概念（知道），实质的认知是能用概念解决问题并产出结果（做到）。高认知穷人混淆了这两个层次。真正的高认知经过结果检验。\n\n**结果验证性**：认知有效性
        = f(深度, 广度, 具体度, 实战度)。认知闭环 = 认知→行动→结果→反馈→认知升级。若长期无结果，说明认知闭环断裂。\n\n## 2.4 认知多维模型\n\n>
        [20230905_02.md] \"认知有多个维度\"\n\n认知由深度（触达本质）、广度（跨领域）、具体度（落地细节）、实战度（真实执行）四维度构成。四维度相乘：认知产出
        = 深度 × 广度 × 具体度 × 实战度。任何一个维度为零，整体产出即为零。提升短板比拉长长板更具杠杆。\n\n## 2.5 聚焦式深度认知法\n\n>
        [20230905_02.md] \"专注想赚钱的领域\"\n\n在选定领域单点打穿，用结果倒逼认知迭代。先有深度，再谈广度。\n\n## 2.6
        认知边界与适配\n\n> [20230905_02.md] \"认知必须与资源匹配\"\n\n认知有效性受资源约束，存在资源下限阈值。认知须与资金、时间、人脉、体力匹配才能落地。\n\n##
        2.9 本章小结\n\n本章拆解高认知穷人伪命题，引入认知多维模型，学习聚焦式深度认知法与认知边界适配。", "# 第三章 知识体系建设——从玄学试错到科学模式\n\n##
        学习目标\n\n- 对比科学模式与玄学模式\n- 掌握知识体系本质\n- 学会从案例到假设\n\n## 3.1 生活类比\n\n到一个陌生城市完成任务。玄学模式是出门碰运气，走错就退回来重走。科学模式是先买地图，标出起点终点，规划路线。知识体系就是这张地图，先画地图再行军。\n\n##
        3.3 科学模式与玄学模式\n\n> [P001, p.1] \"科学模式先建知识体系\"\n\n玄学模式不做前期调研，直接尝试，成功归运气，失败归运气差。科学模式先问：参与方是谁？因果是什么？我在哪？回答清楚就画出了地图。科学模式把试错成本分摊在行动前的思考期，经验可复利累积。\n\n##
        3.4 知识体系本质\n\n> [P001, p.2] \"核心是世界观与方法论\"\n\n知识体系是一张因果网络：知识体系 = (C, R)，C是概念节点，R是因果边。价值不在于节点多少，而在于多少条边——能否从A推导到B。世界观解释世界，方法论改造世界，价值交换是底层原理。\n\n##
        3.5 从案例到假设\n\n> [P001, p.3] \"一切都是假设\"\n\n案例经裁剪、因果归属未必可靠、产生于特定条件。正确姿势：把案例视为待验证命题，提取因果主张，对照因果网络，小范围验证，验证通过才纳入体系。未经处理的信息会带来负面状态——知道感错觉。\n\n##
        3.6 底层能力提炼\n\n> [P001, p.4] \"掌握100个思维模型\"\n\n知识体系不在于量，而在提炼底层能力。找最根本因果，以不变应万变，知识相通。用塔尖的底层原理推导各种应用，而非背诵每个应用。\n\n##
        3.10 本章小结\n\n本章从玄学试错切换到科学模式：先画地图，知识体系是因果网络，案例是待验证假设，提炼底层能力以不变应万变。", "# 第 4
        章 新个体经济——把认知势能转化为收入价值\n\n## 学习目标\n\n- 理解新个体概念\n- 掌握新个体收入结构\n\n## 4.1 生活类比\n\n一个人开了一家只有一名员工的餐厅：既是厨师、又是服务员、还是收银员。一人公司就是新个体经济的起点。\n\n##
        4.3 新个体的觉醒\n\n> [20230905_70.md] \"一人公司数字游民\"\n\n一人公司 = 以个人为最小商业单元，无雇佣员工，无固定办公地点，依靠数字工具完成价值交付。这是组织小型化趋势的终点。一人公司要求个体同时具备市场洞察力、产品化能力、获客能力、交付维护能力。\n\n##
        4.4 新个体的收入结构\n\n> [20230905_70.md] \"年入几十万到300W\"\n\n年收入区间下限高于普通工薪，上限不亚于中小企业主。支撑的是地点自由、组织自由、定价自由三重红利。\n\n##
        4.5 认知变现的闭环\n\n> [20230905_70.md] \"信息筛选认知深化\"\n\n信息筛选→认知深化→知识体系→新个体应用的认知变现闭环。信息本身不值钱，值钱的是经过你认知加工后的判断。\n\n##
        4.9 本章小结\n\n理解一人公司与数字游民合流而成的新个体，认知变现闭环四步：信息筛选→认知深化→知识体系→新个体应用。", "# 第 5 章
        提示词工程基础——学会与模型对话\n\n## 学习目标\n\n- 理解提示词工程价值\n- 掌握官方六大策略\n\n## 5.1 生活类比\n\n提示词之于大语言模型，正如钥匙之于门锁。同样的模型，模糊问题得到平庸回答，清晰指令激发深层能力。问对问题比回答问题更重要。\n\n##
        5.3 为什么需要提示词工程\n\n> [P001] \"AI降低普通人创作门槛\"\n\n输出 = f_θ(Prompt)。模型参数固定，唯一可变变量是Prompt。提升输出质量的全部杠杆集中在设计Prompt。\n\n##
        5.4 官方六大最佳实践\n\n> [P001] \"编写清晰指令\"\n\nOpenAI六大策略：①编写清晰指令（设定角色对象受众长度）②提供参考文本（少让模型猜）③分解复杂任务（分而治之）④给予思考时间（逐步思考）⑤使用外部工具（调计算器搜索）⑥系统测试（建立测试集评估鲁棒性）。\n\n##
        5.5 结构化Prompt\n\n> [P001] \"高效可控\"\n\n结构化Prompt用格式约束行为：角色、背景、任务、输出格式四节。条件越多输出确定性越高。\n\n##
        5.6 参数流提问\n\n> [P001] \"参数流结构化\"\n\n把提示词关键变量提取为参数，模板函数化。固定骨架，只改参数值，像函数调用。批量多风格生成尤其有效。\n\n##
        5.9 本章小结\n\n学会与模型对话：提示词决定输出上限，掌握六大策略、结构化Prompt、参数流提问。", "# 第 6 章 进阶提示技巧——从会问到问得好\n\n##
        学习目标\n\n- 掌握Few-shot学习\n- 学会BRTR写作指令\n\n## 6.1 生活类比\n\n主管给出几份优秀周报说照这个格式写，你立刻有方向。Few-shot就是给模型几个模范生例子，让它照猫画虎归纳规律。\n\n##
        6.3 Few-shot学习\n\n> [20230920_27.md] \"按分类构建数据集\"\n\nFew-shot结构：任务声明 + 示范样本
        + 待处理输入。构建高质量示例：覆盖全部分类、示例代表性强、格式一致。多GPT分工：将复杂任务拆解为子任务，每环用Few-shot约束。\n\n##
        6.4 BRTR写作指令原则\n\n> [20230926_19.md] \"BRTR原则\"\n\nBRTR = Background（背景）+
        Role（角色）+ Task（任务）+ Requirement（要求）。四维度消除歧义，把写作隐性知识变成显性指令。\n\n## 6.5 业务逻辑优先\n\n>
        [20230920_29.md] \"业务逻辑为前提\"\n\n提示词不是万能药。先明确业务目标、受众、边界，再写提示词，避免美丽废物。\n\n##
        6.8 本章小结\n\n从会问到问得好：Few-shot照猫画虎，BRTR结构化指令，业务逻辑优先。", "# 第 7 章 流量变现的底层逻辑——从阅读量到收益的距离\n\n##
        学习目标\n\n- 理解收益与流量的距离\n\n## 7.1 生活类比\n\n阅读量是车流量，收益是收费站收入。车流如织，如果收费站位置不佳、收费规则不合理，收入也可能惨淡。\n\n##
        7.3 数据驱动的收益优化\n\n> [P001, p.5] \"在阅读量不变下提升收益\"\n\n收益公式：收益 = 阅读量 × 广告单价 × 点击率。当阅读量增长遇瓶颈时，可提升广告单价和点击率。\n\n##
        7.4 流量主收益优化方法\n\n> [P001, p.5] \"流量主收益优化方法\"\n\n三步：观察后台数据诊断问题、调整广告位位置与样式、优化内容相关性。内容相关性直接提升点击率和广告单价。\n\n##
        7.8 本章小结\n\n从阅读量到收益的距离：收益公式三杠杆，数据驱动优化，广告位与内容相关性。", "# 第 8 章 平台化变现模式——从单点尝试到系统闭环\n\n##
        学习目标\n\n- 理解小红书店群\n- 掌握闲鱼引流闭环\n\n## 8.1 生活类比\n\n店群像连锁快餐：流程拆成标准化操作手册，复制到第二家第三家门店。你不需要顶级大厨，只需把系统搭好、流程跑通。\n\n##
        8.3 小红书店群商业模式\n\n> [P001, p.1] \"整治无货后高层次玩法\"\n\n店群核心是把开店从手艺活变流水线。模块化三块：选品模块、上架模块、运营模块。模块化降低的不是资金门槛而是人员门槛。闭环飞轮：店越多积累数据经验越多，新店启动越快。\n\n##
        8.4 店群适用边界\n\n> [P001, p.2] \"平台会整治无货\"\n\n无货源模式（一件代发）会被平台识别整治。低门槛和低风险不可兼得。高层次玩法用真实货权、稳定供应链支撑扩张，比例性比速度更重要。\n\n##
        8.5 闲鱼引流闭环\n\n> [P002, p.1] \"四个月1.5W粉变现25W\"\n\n闭环：闲鱼免费流量→引流私域→价值输出建立信任→高客单转化。前端免费引流、后端高客单变现的双层漏斗。\n\n##
        8.6 知识博主闭环系统\n\n> [P003, p.1] \"内容流量私域产品\"\n\n内容→流量→私域→产品→转化五步。内容不只是引流工具，是信任的载体。可复制的0-1框架：你卖的产品本身就是创业过程的产物。\n\n##
        8.10 本章小结\n\n三条平台化变现路径：小红书店群靠规模，闲鱼闭环靠信任深度，知识博主靠内容资产。共性：先建闭环再系统化复制。", "# 第
        9 章 个人IP的系统化构建——把内容做成生意\n\n## 学习目标\n\n- 理解知识博主变现闭环\n\n## 9.2 生活类比\n\n个人IP像品牌店：内容是橱窗，公域流量是进店，私域是复购，产品是成交。\n\n##
        9.4 知识博主变现闭环\n\n> [P001, p.1] \"内容流量私域产品\"\n\n闭环四模块：内容产出、公域流量获取、私域沉淀、产品转化。流量非终点而是私域的起点，私域信任决定转化效率与客单价。\n\n##
        9.5 从单点内容到闭环\n\n> [P001] \"钩子引流私域培育产品收割\"\n\n三步：钩子内容引流、私域信任培育、产品设计收割。分步转化，由浅入深。\n\n##
        9.6 新世代商业生态\n\n> [P002, p.2] \"小众圈层语言\"\n\n新一代用圈层语言重新定义内容消费。IP变现调整：融入圈层语境、承认圈层边界、共创内容价值。构建圈层成员-共建者的平等关系。\n\n##
        9.10 本章小结\n\n把内容做成生意：内容-流量-私域-产品闭环，从单点内容到闭环设计，新世代圈层生态。", "# 第 10 章 利润猎手的入场卷——从信息差到细分需求\n\n##
        学习目标\n\n- 理解红海入场决策\n- 掌握信息差套利\n\n## 10.1 生活类比\n\n信息差像套利：同一件商品不同市场价格不同，低买高卖赚差价。信息、认知、资源、服务能力的落差就是利润空间。\n\n##
        10.3 红海市场的入场决策\n\n> [P006, p.1] \"选址定生死\"\n\n选址决定你面前是鲨鱼还是小鱼。三层：选址定生死、规避正面竞争、差异化生存空间。在竞争稀疏但需求真实的区域选择足够小的切口。\n\n##
        10.4 信息差套利模式\n\n> [P005, p.3] \"站外推广赚信息差\"\n\n信息差套利本质是供需、认知、资源三方面不对等。利润 =
        信息差 × 套利次数 × 杠杆系数。中间商是信息枢纽，站在供需两端把信息不对称变成利润。\n\n## 10.5 需求验证方法论\n\n> [P004,
        p.2] \"1000个MRR案例\"\n\n与其猜需求是否存在，不如找大量真实存在的小案例验证。收集大量小案例观察共同特征。小案例比大报告更可靠，避免自嗨。\n\n##
        10.9 本章小结\n\n从信息差到细分需求：红海入场决策选址定生死，信息差套利，需求验证方法论。", "# 第 11 章 执行的智慧——把最优让位于可行\n\n##
        学习目标\n\n- 理解约束下可执行\n- 掌握项目生命周期\n\n## 11.1 生活类比\n\n约束下执行像拼图：无法选择碎片的样子，任务是在现有碎片约束下拼出完整的图。可落地方案比最优方案更值得投入。\n\n##
        11.3 约束下的可执行原则\n\n> [P001, p.5] \"约束条件下最可落地方案\"\n\n可行解 = {s ∈ S | s 满足全部约束C}。可执行是前提，最优是目标。预算有上限、时间有期限、团队技能有边界。\n\n##
        11.4 项目生命周期适配策略\n\n> [P001, p.6] \"信息差红利期成熟期\"\n\n红利期靠信息差快速占领市场，成熟期靠相对实力差异化竞争。阶段策略
        = f(阶段特征, 团队实力)。\n\n## 11.5 SOP化执行\n\n> [P001, p.7] \"视频剪辑SOP\"\n\nSOP化把非标准工作拆成标准流程，用模板批量生产稳定输出。提高下限，让新人也能产出及格作品。\n\n##
        11.9 本章小结\n\n执行的智慧：约束下可执行优于最优，生命周期适配策略，SOP化执行。", "# 第 12 章 财富阶梯进阶——从掘金新手到生态玩家\n\n##
        学习目标\n\n- 理解利润迁移\n\n## 12.1 生活类比\n\n执行者是搬砖工，靠出卖体力时间换钱；架构师是盖楼者，拥有整栋楼的价值。楼会老化，楼层的租金会下降——这就是生命周期。\n\n##
        12.3 生命周期与利润迁移\n\n> [P006, p.1] \"利润生命周期迁移\"\n\n红利期→快速收割（利润率高竞争少），成熟期→及时转型（利润率降竞争加剧），衰退期→退出或重构。顺势而为，在每个阶段做该阶段最正确的事。\n\n##
        12.4 从执行者到架构师\n\n> [P015, p.1] \"执行者架构师\"\n\n执行者 = 卖时间 + 卖精力（线性收入有天花板）。架构师
        = 建系统 + 卖体系（指数收入可复制）。跃迁路径：流程化SOP→系统化产品→放权。\n\n## 12.5 组合拳策略与第二曲线\n\n> [P006,
        p.2] \"组合拳策略\"\n\n组合拳 = 信息差 + SOP系统化 + 生命周期管理。第二曲线 = f(组合拳, 相邻领域扩展)。在第一条曲线成熟期中后段启动探索。\n\n##
        12.9 本章小结\n\n财富阶梯：利润生命周期迁移，执行者到架构师维度升级，组合拳打出第二曲线。", "# 第 13 章 AIGC 商业逻辑——从技术新奇到利润转化\n\n##
        学习目标\n\n- 理解转化率核心指标\n- 掌握妙鸭相机案例\n\n## 13.1 生活类比\n\nAIGC转化率像漏斗：100人看到菜单，50人点单，30人觉得好吃，10人发朋友圈。技术团队沉浸在生成效果有多惊艳，商业上要紧的是从惊艳到付费的转化率。\n\n##
        13.3 转化率核心指标\n\n> [P001] \"AIGC核心是转化率\"\n\n转化率 = 付费用户数/接触产品用户数。转化率不等于使用率；转化率是利润属性；转化率是北极星指标。效率竞争是军备竞赛，转化率竞争是定位与运营。\n\n##
        13.4 行业know-how壁垒\n\n> [P001] \"行业know-how\"\n\n护城河强度 = 行业深度认知/技术通用性。技术趋于通用时护城河下降；行业深度认知不可替代时壁垒仍在。情感AI是低枝果实。技术优势是暂时的，行业认知是持久的。\n\n##
        13.5 To人ToAI范式\n\n> [P001] \"按服务对象划分\"\n\n未来市场按服务对象是人还是AI划分。To人产品重视留存体验，ToAI产品重视稳定性成本。对标通信IT行业的M2M演进。\n\n##
        13.6 妙鸭相机案例\n\n> [P001] \"多模态工作流商业化前置\"\n\n商业化前置：研发阶段先把定价、目标用户、付费链路设计好。三层成功要素：精准定位（女性写真）、商业化前置（定价9.9元）、AI产品运营（种草裂变）。商业化不是产品完成后的附属品，而是产品设计的第一性原理。\n\n##
        13.11 本章小结\n\nAIGC商业逻辑：转化率是北极星，行业know-how是护城河，To人ToAI划分，妙鸭相机商业化前置。"]}'
