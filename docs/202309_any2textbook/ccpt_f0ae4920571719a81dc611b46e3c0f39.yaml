paper: 20230905_06.md（新手必看：分阶段的搞钱攻略）
desc: 该素材通过挖金矿的比喻，将网络项目/搞钱机会的演变划分为信息差、红利衰减、红利早期运气、稳定期四个阶段场景，并针对每个阶段的特征给出差异化的参与策略，最终得出'没有普适策略，策略需适配场景'的核心结论。
concepts:
- name: 信息差红利
  desc: 指项目处于红利期时，因为大多数人不了解或不会做而产生的低门槛、高回报的赚钱机会。
  is_original: true
  excerpt:
  - 用挖金矿比喻解释项目从红利期到成熟期的阶段与应对策略。
  - 场景一信息差：门槛低开采难度低回报丰厚的钱是信息差的钱。
- name: 红利衰减
  desc: 指由于平台规则的明确化和培训/行业媒介的传播，信息差被快速抹平，导致红利逐渐消失的阶段。
  is_original: true
  excerpt:
  - 场景二信息差红利衰减：山神（平台）和卖信息差的人（培训/行业媒介）加速抹平信息差。
- name: 相对实力
  desc: 指当项目进入稳定期后，竞争中起决定性作用的不再是绝对能力，而是在特定领域内相对于他人的长板和优势。
  is_original: true
  excerpt:
  - 场景四稳定期：门槛提高，需要相对实力而非绝对实力，找到自己擅长的武器。
- name: SOP化规模复制
  desc: 指在红利期早期，实力较弱的参与者通过将操作方法标准流程化，并进行规模复制来获取收益的策略。
  is_original: true
  excerpt:
  - 场景三红利早期运气：实力强者等试水，实力弱者SOP化规模复制，无业游民拼运气。
methods:
- name: __overview__
  desc: 以挖金矿为隐喻框架，将项目生命周期划分为四个阶段场景，并为每个场景提出对应的差异化应对策略。
  excerpt:
  - 用挖金矿比喻解释项目从红利期到成熟期的阶段与应对策略。
  - 场景一信息差：门槛低开采难度低回报丰厚的钱是信息差的钱。
  - 场景二信息差红利衰减：山神（平台）和卖信息差的人（培训/行业媒介）加速抹平信息差。
  - 场景三红利早期运气：实力强者等试水，实力弱者SOP化规模复制，无业游民拼运气。
  - 场景四稳定期：门槛提高，需要相对实力而非绝对实力，找到自己擅长的武器。
theorems:
- name: 场景适配定理
  desc: 不存在适用于所有场景的通用策略，任何策略都只有在与其匹配的特定场景下才能发挥最大威力。
  excerpt:
  - 核心结论：没有适合所有场景的策略，策略只有在合适的场景下才能发挥威力。
- name: 信息差阶段特征定理
  desc: 项目红利的本质是信息差，此时门槛低、开采难度低、回报丰厚。
  excerpt:
  - 场景一信息差：门槛低开采难度低回报丰厚的钱是信息差的钱。
- name: 红利衰减机制定理
  desc: 信息差不会自然消失，而是被平台（山神）和信息贩卖者（培训/行业媒介）两股力量加速抹平。
  excerpt:
  - 场景二信息差红利衰减：山神（平台）和卖信息差的人（培训/行业媒介）加速抹平信息差。
- name: 实力-策略匹配定理
  desc: 在红利早期，策略需与参与者实力匹配：强者等待试水、弱者标准化复制、无业者拼运气。
  excerpt:
  - 场景三红利早期运气：实力强者等试水，实力弱者SOP化规模复制，无业游民拼运气。
- name: 稳定期门槛定理
  desc: 当项目进入稳定期，竞争门槛提高，决定性因素从绝对实力转变为相对实力，需找到自身擅长的武器。
  excerpt:
  - 场景四稳定期：门槛提高，需要相对实力而非绝对实力，找到自己擅长的武器。
findings:
- name: 阶段划分结论
  desc: '[claim] 素材主张项目演进可划分为信息差、红利衰减、红利早期运气、稳定期四个阶段，每个阶段特征与适用策略不同。'
  excerpt:
  - 场景一信息差：门槛低开采难度低回报丰厚的钱是信息差的钱。
  - 场景二信息差红利衰减：山神（平台）和卖信息差的人（培训/行业媒介）加速抹平信息差。
  - 场景三红利早期运气：实力强者等试水，实力弱者SOP化规模复制，无业游民拼运气。
  - 场景四稳定期：门槛提高，需要相对实力而非绝对实力，找到自己擅长的武器。
- name: 无普适策略结论
  desc: '[claim] 素材断言不存在适合所有场景的万能策略，策略的效果高度依赖其所处的具体场景。'
  excerpt:
  - 核心结论：没有适合所有场景的策略，策略只有在合适的场景下才能发挥威力。
