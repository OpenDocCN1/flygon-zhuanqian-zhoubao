best_shape: book
book_worthiness: worth
conclusion_type: ready
one_line_judgment: 这批素材具备成书基础，建议以“AI新个体创富”为主线，按认知-工具-案例-行动四段式重构为系统书稿。
recommended_shape: book
shape_reason: 素材已具备认知方法论、提示词实操、平台案例三条主线，且内容厚度足以支撑8-10章的结构化书籍；且已有近27篇筛选保留内容，主题集中度、核心命题清晰度、内容厚度与互补性均达3分以上，具备成书基础。
not_recommended_shapes:
- handbook
- kb
not_recommended_reasons:
- 手册类（handbook）要求极致的即查即用操作指引，素材中认知与案例类内容占比较高，适配度不足
- 知识库类（kb）适合碎片化快速检索，但本书需承载完整的认知升级与行动体系叙事，线性结构更符合主题表达
if_force_book_need: 若坚持要成书，需补足：①案例的通用方法论拆解；②AI工具的时效性说明与替代方案；③各平台玩法间的共性与迁移规律；④完整的行动落地指南章节
core_proposition: AI时代，个体如何借助内容生产力实现低成本创富，成为真正的新个体。
target_reader: 职场白领、自由职业者、自媒体从业者及想借助AI提升收入的内容创作者
reader_problem: 如何从认知、工具、实战、变现四个层面系统掌握AI赋能的内容创业方法，避免被信息差和平台变化淘汰
differentiation: 区别于单纯AI工具教程或内容营销书，本书以“新个体”身份重构，融合非共识认知（如AIGC 13个非共识）、IP打造与可复制案例，强调“用AI武装个人商业体”的路径
recommended_title: AI新个体：普通人如何借AI实现内容创富
subtitle: 从认知升维到实战变现的完整指南
alt_title_1: 新个体来了：AI时代的内容生产力革命
alt_title_2: AI创富方法论：从提示词到年入百万
shape_description: 一本以认知篇、工具篇、案例篇、行动篇四大部分构成的实战型创业方法论书籍，约10章篇幅，兼顾启发思考与落地执行
structure_logic: 遵循“信→能→干→得”的递进逻辑，从建立AI新个体认知（信），到掌握提示词与AI工具（能），再到通过各平台业务实现真实增长（干），最终形成可复制的行动与变现体系（得）
toc_draft:
