- 案例的方法论拆解（从特例到通则）
- 工具更新与选择建议，降低时效性风险
- 风险提示（如平台合规、AI内容监管）
- 完整的行动落地指南（每月执行计划）
retain_principles: 保留常青（不依赖特定版本号或平台规则）的方法论、认知框架和结构性洞察；删除纯索引类、极碎片信息类内容；合并同主题复用素材；补写工具迭代说明与行动指南
steps:
- 第一步：确定主命题与大纲骨架，做好认知篇和工具篇的素材拼接与概念统一
- 第二步：集中重写案例篇，将平台玩法转化为可迁移的方法论并补写行动篇
- 第三步：全稿润色核对，补充行动清单与工具时新说明，打磨标题与副标题
risks:
- AI工具迭代极快，具体功能演示部分可能快速过时
- 平台玩法案例时效性强，需弱化特定程序细节并强调整体方法论
- 作者背景与案例原创性需作者确认，避免案例雷同或不可核验
- 市场已有较多AI写作/创业类书籍，需突出“新个体”差异化定位
