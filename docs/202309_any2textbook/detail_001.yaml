learning_targets:
- 理解信息垃圾论的核心主张及其对认知过载的缓解意义
- 掌握信息价值悖论：区分信息本身与有用信息，理解价值来源
- 了解免费信息经济学中'钩子模型'的运作机制与隐性成本
- 能运用价值分层标准初步判断信息的可用性
- 能识别免费信息背后的商业逻辑，规避信息陷阱
- 能基于信息整合与筛选原则，构建个人的信息获取策略
