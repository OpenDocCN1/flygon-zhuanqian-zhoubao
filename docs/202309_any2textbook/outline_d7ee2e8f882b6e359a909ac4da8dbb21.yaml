- 'no': 1
  name: 利润猎手的入场卷 —— 从信息差到细分需求
  desc: 本章通过奶茶店选址、站外推广等真实案例，揭示小成本创业的底层逻辑：避开红海、赚取信息差、发现细分需求。
  nodes:
  - 'no': 1
    name: 红海市场的入场决策
    desc: 以'选址定生死'为切入点，说明在竞争激烈的成熟市场中，入场策略的核心是规避正面竞争，寻找差异化生存空间。
    role: motivation
    src:
    - paper: 20230905_60.md
  - 'no': 2
    name: 信息差套利模式
    desc: 通过'站外推广服务商赚信息差'的案例，定义信息差商业模式：利用供需双方认知或资源的不对等获取利润。
    role: definition
    src:
    - paper: 20230905_55.md
  - 'no': 3
    name: 需求验证方法论
    desc: 以'1000个MRR案例集采'为例，讲解如何通过收集和分析大量小规模成功案例来验证细分市场的真实需求与可行性。
    role: method
    src:
    - paper: 20230905_54.md
  - 'no': 4
    name: 从案例到决策：多维信息交叉验证
    desc: 综合奶茶店线下实体决策与服务商模式，演示如何将不同行业的案例进行横向对比，提炼出共性规律以支撑商业决策。
    role: experiment
    src:
    - paper: 20230905_60.md
    - paper: 20230905_55.md
- 'no': 2
  name: 执行的智慧 —— 把'最优'让位于'可行'
  desc: 本章聚焦'约束条件下可执行'这一核心方法论，结合项目生命周期与SOP化执行，教你如何在限制中寻找最优解。
  nodes:
  - 'no': 1
    name: 约束下的可执行原则
    desc: 提出核心命题：在资源、时间和环境等约束下，'最可落地'的方案往往优于理论上的'最优'方案。
    role: motivation
    src:
    - paper: 20230905_11.md
  - 'no': 2
    name: 项目生命周期适配策略
    desc: 定义项目从'信息差红利期'到'成熟期'的不同阶段特征，阐述不同阶段应采用不同竞争与合作策略。
    role: definition
    src:
    - paper: 20230905_06.md
  - 'no': 3
    name: SOP化执行与模板化生产
    desc: 以'视频剪辑SOP'为实例，讲解如何将非标准化的创造性工作拆解为标准化流程，通过模板批量生产以提升效率。
    role: method
    src:
    - paper: 20230905_15.md
  - 'no': 4
    name: 案例分析：剪辑SOP的效率验证
    desc: 以'批量制作高原创视频'的产出作为案例，验证SOP化执行在保证质量的同时大幅提升产出效率的实际效果。
    role: experiment
    src:
    - paper: 20230905_15.md
  - 'no': 5
    name: 从约束到流程的落地框架
    desc: 综合'约束可执行'与'SOP化'，提出一个从识别约束、拆解流程到模板化执行的通用落地思维框架，形成思维闭环。
    role: extension
    src:
    - paper: 20230905_11.md
    - paper: 20230905_15.md
- 'no': 3
  name: 财富阶梯进阶 —— 从掘金新手到生态玩家
  desc: 本章作为全书升华，引导读者跳出单一项目思维，从生命周期和模式演进的角度，规划可持续的财富增长路径。
  nodes:
  - 'no': 1
    name: 生命周期与利润迁移
    desc: 指出任何项目的利润来源会随生命周期推移而改变，需要在红利期快速收割，在成熟期及时转型。
    role: motivation
    src:
    - paper: 20230905_06.md
  - 'no': 2
    name: 高阶模式：从执行者到架构师
    desc: 总结全书案例，对比'执行者'（如剪辑师）与'架构师'（如服务商）的盈利逻辑，引出提升商业维度的必要性。
    role: limitation
    src:
    - paper: 20230905_15.md
    - paper: 20230905_55.md
  - 'no': 3
    name: 组合拳策略与第二曲线
    desc: 探讨如何将信息差、SOP化与生命周期管理结合，在同一领域或相邻领域开辟第二增长曲线。
    role: extension
    src:
    - paper: 20230905_06.md
    - paper: 20230905_55.md
    - paper: 20230905_11.md
