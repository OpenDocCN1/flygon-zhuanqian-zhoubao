- 'no': 1
  name: 流量变现的底层逻辑 —— 从“阅读量”到“收益”的距离
  desc: 本章以公众号流量主为起点，拆解“流量”与“收益”之间的关键变量，理解在阅读量不变的前提下，如何通过数据洞察与广告位优化实现收益跃升，建立流量变现的系统化思维。
  nodes:
  - 'no': 1
    name: 数据驱动的收益优化：读懂后台指标
    desc: 以公众号流量主的后台数据为切入口，引出'收益 = 阅读量 × 广告单价 × 点击率'的朴素公式，说明'在阅读量不变下提升收益'的核心在于对广告位、内容匹配度等细节指标的精细化运营。
    role: motivation
    src:
    - paper: 20230905_35.md
  - 'no': 2
    name: 流量主收益优化方法
    desc: 系统阐述通过观察后台数据（如曝光量、点击率、单价波动）来调整广告位的位置、样式与内容相关性的方法，将'提升收益'从模糊的经验直觉转化为可执行的量化操作清单。
    role: method
    src:
    - paper: 20230905_35.md
- 'no': 2
  name: 平台化变现模式 —— 从“单点尝试”到“系统闭环”
  desc: 本章横跨小红书与闲鱼两大生态，对比'店群矩阵'与'引流闭环'两种已验证的系统化变现打法，提炼出从单点操作升级为可复制、可扩张的模块化商业系统的共性密码。
  nodes:
  - 'no': 1
    name: 小红书店群商业模式：模块化的力量
    desc: 以小红书店铺为例，展示'系统化、模块化降低门槛'的玩法。区别于单店运营，店群模式通过将选品、上架、客服等环节标准化，使普通人也能通过流程复用放大收益，是典型的方法论升级。
    role: method
    src:
    - paper: 20230905_42.md
  - 'no': 2
    name: 店群模式的适用边界
    desc: 指出店群模式并非万能。素材中提到平台会'整治无货'，这意味着该玩法对货源、供应链和合规性的要求极高。本知识点点明该模式的脆弱性，告诫学习者不能盲目复制。
    role: limitation
    src:
    - paper: 20230905_42.md
  - 'no': 3
    name: 闲鱼引流闭环：从流量到学费的转化路径
    desc: 以'四个月1.5W粉变现25W'为标杆案例，拆解引流与培训结合的商业模式。重点分析如何将前端免费/低价的流量，通过后端培训产品实现高客单价转化，完成商业闭环。
    role: experiment
    src:
    - paper: 20230905_50.md
- 'no': 3
  name: 个人IP的系统化构建 —— 把“内容”做成“生意”
  desc: 本章从公众号、小红书、闲鱼的具象玩法回到个人IP的本质，结合知识博主与新世代商业观察，揭示从内容生产到商业变现的完整系统设计蓝图，并探讨下一代消费者的圈层特征。
  nodes:
  - 'no': 1
    name: 知识博主的变现闭环系统
    desc: 提出'内容-流量-私域-产品'的转化路径设计，将零散的'写文章'或'拍视频'行为，重构为一条层层递进的变现流水线。这是对前面具体平台打法的抽象与升维，具备通用指导意义。
    role: definition
    src:
    - paper: 20230905_37.md
  - 'no': 2
    name: 从单点内容到闭环系统：设计要点
    desc: 基于'流量到变现闭环系统'的理念，讲授如何利用钩子内容引流、利用私域做信任培育、利用产品设计完成收割，并强调各环节间数据反馈与迭代的重要性。
    role: method
    src:
    - paper: 20230905_37.md
  - 'no': 3
    name: 新世代商业生态：圈层与语境
    desc: 延伸视角至'10后'（Z世代）的商业观察。通过对'小众圈层语言创造新场景'和'Z世代商业新物种'的解读，揭示未来IP变现面对的用户已发生根本性变化，启发学习者思考既有闭环模式如何在新生代语境下迭代。
    role: extension
    src:
    - paper: 20230905_10.md
  - 'no': 4
    name: 案例总览：从新手到导师的进阶图谱
    desc: 将学习过的小红书店群、闲鱼引流、知识博主闭环进行横向对比分析，通过四象限图（流量获取难易 vs 客单价高低）定位各玩法位置，帮助学习者根据自身资源选择适配的变现路径。
    role: proof
    src:
    - paper: 20230905_35.md
    - paper: 20230905_42.md
    - paper: 20230905_50.md
    - paper: 20230905_37.md
