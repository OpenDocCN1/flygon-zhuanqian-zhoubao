best_shape: book
reason: 素材整体围绕'AI时代个体创富与内容生产力'这一稳定母题展开，且明显分为三条可支撑完整章节体系的主线：一是'AI认知与提示词方法论'（如ChatGPT最佳实践、结构化Prompt、业务逻辑），二是'内容创业与变现路径'（如高认知穷人、知识体系、分阶段搞钱攻略、流量变现闭环、各类案例），三是'平台运营与实战操作'（如公众号、小红书店铺、闲鱼引流等）。三条主线间互有支撑，足以构成6-10章且具备可持续扩写的结构性书籍内容；同时有大量深度原创判断（如非共识认知、能力与认知不匹配的反思），厚度与思想性都满足成书门槛。
not_recommended_shapes:
- handbook
- kb
not_recommended_reasons:
- 素材虽有流程/清单类内容（如原创视频剪辑步骤、公众号流量主提升），但整体以认知论述与案例复盘为主，流程操作类占比不足，无法构建完整的工具化手册体系。
- 素材虽多主题，但29篇保留内容高度聚焦于'AI赋能下的个体创富'这一核心主题，内部逻辑清晰，主题间不零散割裂，无需用知识库做持续维护的检索型交付，反而成书的结构化输出更契合其体系化深度。
if_force_book_need: 若强行推进成书，需重点补充以下三块：一、增加'AI工具实操进阶'的系统性章节（当前提示词内容偏方法论层，对模型选择、参数调优、工作流搭建等实操环节覆盖不足）；二、补充'风险与失败案例'对照章节（现有素材以正向变现故事为主，缺少对奶茶店亏损、转型Gap期等反面素材的必要复盘，以提升书籍的判断力厚度）；三、构建'阶段穿越'的时间轴叙事（素材时序为2023年9月集中产出，需要按'认知觉醒→能力构建→第一桶金→规模化放大→第二曲线'重新编排章节递进，而非按时间堆叠），并统一更新各平台的时效性数据与AI工具版本信息，消除写作时点对常青性的侵蚀。
