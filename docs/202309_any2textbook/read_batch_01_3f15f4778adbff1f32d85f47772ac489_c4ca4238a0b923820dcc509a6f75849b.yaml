- file_path: docs/202309/20230905_06.md
  title: 新手必看：分阶段的搞钱攻略
  summary: 作者用‘挖金矿’的比喻，将一个项目从红利期到成熟期的不同阶段进行分析，阐述了不同阶段的特点、挑战及对应的博弈策略（如信息差、批量矩阵、精细化运营等）。
  core_question: 一个项目从红利期到成熟期，不同阶段的核心逻辑和应对策略分别是什么？
  key_judgment: ‘没有适合所有场景的策略’，应识别项目所处阶段并采取差异化竞争策略——红利期靠信息差，早期靠批量试错，成熟期靠精细化相对优势。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 与其他文章观点重复
  screening_conclusion: retain
  reason: 用比喻将项目生命周期拆解得非常直观且逻辑严谨，为读者提供清晰的决策框架，可作为书中指导章节。
- file_path: docs/202309/20230905_07.md
  title: 互联网上百分之99的信息都是垃圾信息
  summary: 作者强调互联网上绝大多数信息为垃圾信息，信息获取应转向精准、垂直、高效的工具与圈子，并提及了两种通过整理信息获利的案例。
  core_question: 在信息过载时代，如何高效获得有价值信息并利用信息差获利？
  key_judgment: 广泛注意力的商业时代已过，小众、垂直、被精选过的信息价值将持续走高；获取高质量信息的门槛也在提升，付费与圈子成为主流选择。
  depth: high
  suggested_destination: chapter
