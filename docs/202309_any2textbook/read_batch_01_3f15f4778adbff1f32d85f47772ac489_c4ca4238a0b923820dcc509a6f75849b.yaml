- file_path: docs/202309/20230905_02.md
  title: 聊聊高认知穷人
  summary: 作者从个人观察出发，批判‘高认知穷人’说法，提出许多看似高认知的人实则认知不深，根本不存在高认知穷人，并进一步阐述认知深度、广度与专注对赚钱的决定作用。
  core_question: 为什么很多人‘道理都懂’却赚不到钱，是否真的存在高认知穷人？
  key_judgment: 不存在‘高认知穷人’，多数人只是停留在浅层认知；认知需要靠实战验证与深度内化，聚焦赚钱领域深耕才是关键。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 重复
  screening_conclusion: retain
  reason: 文章观点鲜明，逻辑严密，对‘认知与赚钱’关系提出了反常识的深刻判断，且案例贴近现实，具有较高认知提升价值，适合作为章节展开。
