  title: 什么样的知识体系对于赚钱是有意义的
  summary: 作者以小红书5天涨粉7000案例，提出区别于‘玄学模式’的‘科学模式’，强调围绕具体项目建立以世界观和方法论为核心的知识体系，并探讨了因果层、案例与知识体系的边界。
