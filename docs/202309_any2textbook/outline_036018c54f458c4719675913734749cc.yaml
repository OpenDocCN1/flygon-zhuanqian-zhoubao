- 'no': 1
  name: 信息素养 —— 从“信息垃圾场”到“认知过滤器”
  desc: 本章直面互联网信息爆炸的现实，帮助你建立信息判断与筛选的底层框架，理解“信息差”背后的逻辑。
  nodes:
  - 'no': 1
    name: 信息爆炸的残酷现实
    desc: 用“垃圾场”类比互联网，理解99%信息为噪音的客观环境，这是所有信息处理策略的前提。
    role: motivation
    src:
    - paper: 20230905_07.md
  - 'no': 2
    name: 信息的价值分层
    desc: 区分“信息”与“知识”，定义“有用信息”的本质——能够解决具体问题、驱动行动并产生商业价值的信息。
    role: definition
    src:
    - paper: 20230905_07.md
  - 'no': 3
    name: 免费信息经济学
    desc: 理解免费信息的真实角色是“钩子”而非资产，剖析信息变现的常见路径：整合、筛选与定向输送。
    role: method
    src:
    - paper: 20230905_07.md
- 'no': 2
  name: 认知升级 —— 打破“高认知穷人”的伪命题
  desc: 本章切入认知的本质结构，拆解“高认知”的真实含义，引导你建立以结果为导向的认知评价体系。
  nodes:
  - 'no': 1
    name: 伪概念解构：“高认知穷人”
    desc: 论证“高认知穷人”是一个逻辑陷阱，用“结果验证认知”的标准，澄清认知的真实价值定义。
    role: motivation
    src:
    - paper: 20230905_02.md
  - 'no': 2
    name: 认知的结构化定义
    desc: 建立认知的多维模型：深度（看穿本质）、广度（跨界连接）、具体度（场景落地）、实战度（行动验证）。
    role: definition
    src:
    - paper: 20230905_02.md
  - 'no': 3
    name: 聚焦式深度认知法
    desc: 给出可操作的方法：在赚钱/核心目标领域单点突破，用结果倒逼认知深化，而非浅尝辄止。
    role: method
    src:
    - paper: 20230905_02.md
  - 'no': 4
    name: 认知的边界与陷阱
    desc: 指出认知再高也可能失效的局限条件，强调认知必须适配资源和卡位，警惕“知道却做不到”的落差。
    role: limitation
    src:
    - paper: 20230905_02.md
- 'no': 3
  name: 知识体系建设 —— 从“玄学试错”到“科学模式”
  desc: 本章对比科学模式与玄学模式，教你搭建属于自己的知识体系——研究因果关系，掌握底层思维模型。
  nodes:
  - 'no': 1
    name: 科学模式 vs 玄学模式
    desc: 用“先画地图再行军”类比，强调做事前先建立知识体系框架的必要性。
    role: motivation
    src:
    - paper: 20230905_04.md
  - 'no': 2
    name: 知识体系的本质
    desc: 定义知识体系为“因果关系的网络”，核心构成是世界观（解释世界）与方法论（改造世界）。
    role: definition
    src:
    - paper: 20230905_04.md
  - 'no': 3
    name: 从案例到假设
    desc: 教授处理他人经验的方法：他人的案例不是事实，要将其降格为“假设”，置入自己的体系验证。
    role: method
    src:
    - paper: 20230905_04.md
  - 'no': 4
    name: 底层能力的提炼
    desc: 提供“以不变应万变”的进阶策略：掌握核心思维模型（如100个关键模型），构建跨领域解决问题的通用能力。
    role: extension
    src:
    - paper: 20230905_04.md
- 'no': 4
  name: 新个体经济 —— 把“认知势能”转化为“收入价值”
  desc: 本章将前序认知框架落地到职业与商业场景，解读一人公司、数字游民等新个体模式的变现逻辑与内在要求。
  nodes:
  - 'no': 1
    name: 新个体的崛起
    desc: 定义“一人公司+数字游民”的新职业形态，理解组织小型化与个人变现能力增强的时代趋势。
    role: motivation
    src:
    - paper: 20230905_70.md
  - 'no': 2
    name: 新个体的收入结构
    desc: 用“知识工作者线上小生意”的类比，说明年收入几十万到300万的可能区间与对应能力的量级。
    role: definition
    src:
    - paper: 20230905_70.md
  - 'no': 3
    name: 认知变现的闭环
    desc: 串联全教程逻辑：信息筛选 → 认知深化 → 知识体系构建 → 新个体模式应用，形成完整的认知变现闭环（总复习）。
    role: extension
    src:
    - paper: 20230905_02.md
    - paper: 20230905_04.md
    - paper: 20230905_07.md
    - paper: 20230905_70.md
