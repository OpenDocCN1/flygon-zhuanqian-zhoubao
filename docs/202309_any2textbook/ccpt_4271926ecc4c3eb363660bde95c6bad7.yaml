paper: 20230905_02.md（聊聊高认知穷人）
desc: 该素材由粥左罗撰写，核心论点是否认'高认知穷人'这一概念的存在，主张只存在'看似高认知的穷人'。素材指出多数人的高认知来自听书、读书、课程的复制，并未经过深刻理解与实践检验。作者提出认知具有深度、广度、具体度、细节度、实战度等多维度属性，并强调赚钱能力取决于认知深度，而高认知本身是'把事情做成'的结果，需要通过实践与现实反复碰撞，将他人的一句话认知转化为自己的深度认知。
concepts:
- name: 高认知穷人
  desc: 作者所批判的伪概念，指那些看似拥有高认知却在现实中未能获得对应经济回报的人；作者认为该说法不成立，因为真正的认知必然伴随现实结果。
  is_original: true
  excerpt:
  - 不存在高认知穷人，只存在看似高认知的穷人。
  - 多数人观点认知来自听书读课复制，并未深刻理解。
- name: 认知的多维度属性
  desc: 认知不是一个单维度的'有或无'概念，而是包含深度、广度、具体度、细节度、实战度等多个维度的立体结构。
  is_original: true
  excerpt:
  - 认知有深度、广度、具体度、细节度、实战度等多维度。
- name: 自己的一万字以内的认知
  desc: 指通过实践与现实反复碰撞后，将他人一句话的高认知转化为独具个人理解与细节的深度认知，是认知内化的标志。
  is_original: true
  excerpt:
  - 你学到的高认知是别人的，要通过实践和现实反复碰撞把一句话高认知变成有一万字以内的自己的认知。
methods:
- name: __overview__
  desc: 素材整体采用批判性论证与正向主张相结合的方法：先否定流行的'高认知穷人'概念，再从认知的本质属性出发提出替代性解释，最后给出实践导向的行动路径。
  excerpt:
  - 核心论点：不存在高认知穷人，只存在看似高认知的穷人。
  - 多数人观点认知来自听书读课复制，并未深刻理解。
- name: 聚焦式深度认知法
  desc: 作者提出的方法论：在想要赚钱的特定领域集中投入，将该方面的认知做到足够深的程度，而非追求浅尝辄止的广泛涉猎。
  excerpt:
  - 你想在哪个方面赚钱就专注在哪，努力在那个方面做到足够深的认知。
- name: 实践碰撞内化法
  desc: 将外部获得的高认知（他人总结的一句话）通过实践与现实的反复冲突、检验，转化为具有个人深度的万字认知，实现认知的内化与实战化。
  excerpt:
  - 你学到的高认知是别人的，要通过实践和现实反复碰撞把一句话高认知变成有一万字以内的自己的认知。
  - 高认知都是结果，是你把一件事做成做好形成的。
theorems:
- name: 认知结果论
  desc: 高认知不是先于行动的天赋或积累，而是实践的副产品——是'把一件事做成做好'之后自然形成的状态。
  excerpt:
  - 高认知都是结果，是你把一件事做成做好形成的。
- name: 认知深度决定赚钱能力
  desc: 赚钱能力与认知深度成正比，认知的深度是决定一个人能否在相应领域获得经济回报的根本因素。
  excerpt:
  - 认知的深度决定赚钱能力。
- name: 伪认知否认论
  desc: '''高认知穷人''之所以看似存在，实则是这些人仅拥有复制来的浅层认知，并非真正的认知，因此该概念在逻辑上不成立。'
  excerpt:
  - 不存在高认知穷人，只存在看似高认知的穷人。
  - 多数人观点认知来自听书读课复制，并未深刻理解。
findings:
- name: 多数人认知来源的局限性
  desc: '[claim] 素材宣称多数人的观点认知来自于听书、读课和复制，缺乏深刻理解，因而呈现出''虚假高认知''的表象。该结论为作者观点阐述，素材未提供具体数据支撑。'
  excerpt:
  - 多数人观点认知来自听书读课复制，并未深刻理解。
- name: 认知与现实的因果方向
  desc: '[claim] 素材主张认知是''做成事''的结果而非前提，即现实实践在前、高认知在后。该主张以断言形式提出，属于理念阐述而非实证发现。'
  excerpt:
  - 高认知都是结果，是你把一件事做成做好形成的。
