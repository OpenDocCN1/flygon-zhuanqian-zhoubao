paper: 20230905_04.md（什么样的知识体系对于赚钱是有意义的）
desc: 该素材提出一个以“科学模式”为核心的做事方法论，主张赚小钱和做出基本成绩可以通过科学100%实现，核心在于建立基于价值交换因果关系的知识体系。素材强调知识体系是用来用的而非看的，一切皆为假设，案例并非事实，呼吁关注最根本的因果和以不变应万变的底层能力，并援引查理·芒格“掌握100个思维模型”作为佐证。
concepts:
- name: 知识体系
  desc: 该概念指在做事前建立的、研究清楚知识之间关系的体系，是基于价值交换的因果关系，核心聚焦世界观和方法论。
  is_original: true
  excerpt:
  - 知识体系核心框架聚焦世界观和方法论，本质是研究清楚知识之间的关系。
  - 科学模式是在做事前先建立项目的知识体系，基于价值交换的因果关系。
- name: 玄学模式与科学模式
  desc: 该概念呈现两种做事方式：玄学模式与科学模式，其中科学模式是在做事前先建立项目的知识体系，基于价值交换的因果关系。
  is_original: true
  excerpt:
  - 呈现玄学模式和科学模式两种做事方式。
  - 科学模式是在做事前先建立项目的知识体系，基于价值交换的因果关系。
- name: 案例不是事实
  desc: 该概念指出他人的成功案例对自身而言不是事实，只是案例，不应直接等同于可复制的经验。
  is_original: true
  excerpt:
  - 案例不是事实，作者的成功案例对你是案例。
- name: 一切都是假设
  desc: 该概念强调所有认知和前提都应被视为假设，而非确定不移的真理。
  is_original: true
  excerpt:
  - 一切都是假设。
- name: 知识体系是用来用的不是用来看的
  desc: 该概念强调知识体系的价值在于实际应用，而非仅作为展示或收藏。
  is_original: true
  excerpt:
  - 知识体系是用来用的不是用来看的。
- name: 最根本的因果与底层能力
  desc: 该概念指人不需要记太多东西，而应寻找最根本的因果以及以不变应万变的底层能力。
  is_original: true
  excerpt:
  - 人不需要记太多东西，要找最根本的因果和以不变应万变的底层能力。
methods:
- name: __overview__
  desc: 该方法论整体上以“科学模式”为核心，强调在做事前建立知识体系，基于价值交换的因果关系，并将一切视为假设，以应用为导向。
  excerpt:
  - 核心论点：赚小钱和做出基本成绩可以通过科学100%实现。
  - 科学模式是在做事前先建立项目的知识体系，基于价值交换的因果关系。
  - 知识体系是用来用的不是用来看的。
  - 一切都是假设。
theorems:
- name: 科学做事可达100%成绩
  desc: 核心主张：赚小钱和做出基本成绩可以通过科学的方式100%实现，而不依赖玄学或偶然。
  excerpt:
  - 赚小钱和做出基本成绩可以通过科学100%实现。
- name: 知识体系本质是关系研究
  desc: 核心主张：知识体系的核心框架聚焦世界观和方法论，本质是研究清楚知识之间的关系。
  excerpt:
  - 知识体系核心框架聚焦世界观和方法论，本质是研究清楚知识之间的关系。
- name: 100个思维模型即可
  desc: 核心主张（援引）：一个人一辈子只需要掌握大约100个思维模型，即可应对问题。
  excerpt:
  - 查理芒格：一个人一辈子只需要掌握大约100个思维模型。
findings:
- name: 科学模式优于玄学模式
  desc: '[claim] 作者宣称科学模式（做事前建立知识体系）是更有效的做事方式，可100%实现小目标。'
  excerpt:
  - 呈现玄学模式和科学模式两种做事方式。
  - 科学模式是在做事前先建立项目的知识体系，基于价值交换的因果关系。
- name: 案例不可直接复制
  desc: '[claim] 作者宣称他人成功案例对自身只是案例而非事实，不应直接视为可复制的经验。'
  excerpt:
  - 案例不是事实，作者的成功案例对你是案例。
- name: 信息取舍原则
  desc: '[claim] 作者宣称人无需记忆过多信息，应聚焦最根本的因果与底层能力，实现以不变应万变。'
  excerpt:
  - 人不需要记太多东西，要找最根本的因果和以不变应万变的底层能力。
