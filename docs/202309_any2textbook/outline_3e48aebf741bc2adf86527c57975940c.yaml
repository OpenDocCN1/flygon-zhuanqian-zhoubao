- 'no': 1
  name: AIGC 商业逻辑 —— 从“技术新奇”到“利润转化”
  desc: 本章从商业本质出发，剖析 AIGC 产品的核心指标与行业壁垒，帮助你建立从技术到商业的完整认知框架。
  nodes:
  - 'no': 1
    name: 转化率：AIGC 的核心北极星指标
    desc: 用“漏斗”类比理解：AIGC 产品的成败不在于生成效果多炫，而在于每一步到最终付费的转化效率
    role: motivation
    src:
    - paper: 20230912_24.md
  - 'no': 2
    name: 转化率的利润属性
    desc: 转化率并非单纯的用户行为指标，而是直接绑定利润属性的商业度量，是衡量 AIGC 产品健康度的核心定义
    role: definition
    src:
    - paper: 20230912_24.md
  - 'no': 3
    name: 行业 know-how：AIGC 的隐性壁垒
    desc: 技术模型只能提供通用能力，真正的瓶颈在于对垂直行业深度认知的掌握——这决定了产品能否触及“低垂果实”
    role: limitation
    src:
    - paper: 20230912_24.md
  - 'no': 4
    name: 从 To 人到 ToAI：市场划分的范式转移
    desc: 以通信与 IT 行业的历史演变为类比，未来商业将按服务对象重新划分——面向人的产品与面向 AI 的产品将分道扬镳
