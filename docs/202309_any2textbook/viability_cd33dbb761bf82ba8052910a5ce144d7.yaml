dimensions:
- name: 主题集中度
  score: 3
  evidence: 素材围绕“AI时代下的个体成长与变现”展开，分为认知觉醒（高认知穷人、知识体系、信息垃圾、执行力）、AI工具与提示词（官方最佳实践、解读、结构化Prompt）、AI商业案例（妙鸭相机、AIGC13个非共识、公众号流量主、小红书店铺、奶茶店、站外推广等）三条线索。有主线但旁支较多，可收束为一条“AI时代个体认知升级与商业机会”的主线。
- name: 核心命题清晰度
  score: 4
  evidence: 素材隐含鲜明主张是“AI时代普通人可借助认知升级与AI工具实现个人价值重塑与商业变现”。标题如“新个体”、“AI赋能”、“分阶段搞钱攻略”都在回应这一主张，方向清晰，但需在书名和导论中提炼为该主张的一句话，如《AI新个体：认知升级与变现路径》。
- name: 目标读者清晰度
  score: 3
  evidence: 目标读者指向“希望利用AI提升效率、寻找副业或自主创业的职场人、自由职业者”这一群体。但部分素材（如妙鸭相机解析、公众号流量主）更偏向实操案例，需取舍聚焦于“AI工具应用与变现”读者，可将纯平台运营内容降为案例附录。
- name: 内容厚度与互补性
  score: 4
  evidence: 内容互补性强：认知类（高认知穷人、知识体系）打底，工具类（提示词最佳实践、结构化Prompt）提供技能，案例类（妙鸭相机、小红书店铺、新个体）提供实例，形成“认知-技能-案例”的章节体系雏形。存在少量重复（提示词最佳实践与解读），但总体可整合成4-5部分的结构。
- name: 区分度与新颖性
  score: 4
  evidence: 素材有个性经验（AIGC13个非共识、妙鸭相机解析、知识博主闭环），并融合AI工具与商业案例，区别于泛AI科普书。但部分内容（提示词最佳实践）同质化风险中，需以“个人实践+批判视角”重构以提升新颖性。
- name: 时效风险
  score: 3
  evidence: 认知类与AI方法论（知识体系、高认知穷人、新个体）常青；但AI工具具体实践（提示词最佳实践、妙鸭相机解析、公众号流量主）依赖特定工具与平台热点，需剥离时效性细节，提炼普适原则，如“工具迭代下的不变能力”。
- name: 可持续扩写空间
  score: 4
  evidence: 素材接近24篇，足以构成一本约12-15万字的书稿骨架，可直接扩展为4部分：认知篇、工具篇、案例篇、行动篇，每篇可自然补充新案例与练习。但需补写“行动指南”与“常见误区”章节以增强体系感。
total_score: 25
conclusion: potential
recommended_shape: book
alternative_path: 建议先以“AI新个体：认知升级与变现路径”为主题，将素材重写为系统书稿，结构为：①认知觉醒——破解高认知穷人陷阱；②AI工具力——提示词与工作流；③机会地图——从副业到创业的路径；④行动引擎——执行力与复盘。
next_steps:
- 提炼核心命题为“AI时代，普通人如何通过认知升级掌握工具并找到变现路径”，写入书名与导论。
- 按“认知篇-工具篇-案例篇-行动篇”重构大纲，将提示词最佳实践与解读合并为“工具篇”的一章。
- 将妙鸭相机解析、公众号流量主、小红书店铺等案例改写为“案例篇”的方法论版块，剥离即时数据与平台细节。
- 补写“行动指南”章节（含30天启动计划、常见误区与复盘模板），增强可实践性。
- 重写部分素材为第一人称叙事，保留个性经验（如AIGC13个非共识），提升区分度与可读性。
