life_analogy:
- 想象决策过程是一场**池塘垂钓**：
- '- **常识** = 你看得见的"水深水浅"，老渔民都知道哪里鱼多'
- '- **捡烟蒂误区** = 只在廉价的小水洼里死磕，还觉得便宜就一定有好货'
- '- **少而精的决策** = 一辈子只钓几条大鱼，而不是频繁换钩、见鱼就撒'
- '- **知行合一** = 不只看鱼漂，而是要像老渔民一样把"鱼汛规律"变成肌肉记忆'
- '- **理性与道德的边界** = 即使禁渔期鱼再多也不下网，因为规则护住了长期的渔场'
- 就像真正的高手从不靠运气，而是靠选择正确的渔场、在对的时机出手，并把规矩刻进骨子里——这是你错过的"常识"中最强的一环。
summary:
- concept: 常识
  desc: 看似简单却常被违背的、基于真实世界运行规律的显性知识，是决策的第一层护城河
- concept: 捡烟蒂式投资误区
  desc: 只追逐价格便宜而忽略标的质量，是误把"便宜"当"价值"的典型错误
- concept: 少而精的决策观
  desc: 大部分财富来自极少数高质量决策，等待好机会比频繁行动更重要
- concept: 知行合一
  desc: 知晓正确道理后严格遵循执行，把简单正确原则变成习惯性行为
- concept: 理性与道德的边界
  desc: 理性负责"能不能"，道德负责"该不该"，二者互补构筑长期决策护城河
- concept: 人性心理与成功幻觉
  desc: 商业决策必须基于真实人性，警惕自我美化的成功幻觉
- concept: 三大过滤标准
  desc: 以信息过载为背景，用三大标准过滤出值得深挖的候选项目
- concept: 五维深度评估法
  desc: 对项目从五个维度进行系统化深度评估，避免只看表面
- concept: First One / Only One / Number One
  desc: 产品定位的三个层次：先发、唯一、第一，构成产品的差异化护城河
- concept: 付费本质
  desc: 付费的真实动机，是产品可做性与品类无关的根本依据
- concept: 内容即流量
  desc: 在流量稀缺时代，内容本身就是获取注意力的核心钩子
- concept: 用户心理钩子
  desc: 通过设计内容引发用户心理反应，驱动自发传播与转化
- concept: 定位四问与轻量化产品
  desc: 通过四问明确定位，用最轻的产品快速验证市场需求
- concept: 续费率北极星指标
  desc: 续费率是衡量知识付费闭环是否成立的最关键指标
- concept: 个人IP与视觉锤
  desc: 个人IP是信任载体，视觉锤是让人记住你的最小记忆单位
- concept: 三维驱动增长与专注度定律
  desc: 个人IP增长依赖三维驱动，专注度决定增长天花板
- concept: AI超级个体
  desc: 以AI为杠杆，一人公司实现千倍效率放大的新职业形态
- concept: SOP化系统构建
  desc: 将关键业务标准化为SOP，是AI超级个体可复制的基石
- concept: 六步求助法
  desc: 主动、有策略地求助，是让贵人看见你的核心方法论
- concept: 苦劳陷阱
  desc: 只靠卖苦力、无效勤奋，是违背常识的典型误区之一
exercises:
- 'no': 1
  title: 识别你身边的"钓鱼第一原则"
  contents:
  - 回顾你最近做过的一个重大决策（学业、职业或投资）：
  - 1. 列出该决策所依赖的"池塘"（赛道/领域/市场）
  - 2. 评估这个池塘是否真的"有鱼"（真实需求、长期趋势）
  - 3. 识别是否存在"捡烟蒂"倾向——是否只因"便宜"或"门槛低"就选它
  - 4. 写出你如何用少而精的决策观重新审视该选择：
  - '   - 这个决策符合"在有鱼的地方钓鱼"吗？'
  - '   - 你能等多久？等待的成本是什么？'
  - '   - 若等待，你的"判断力"是否足够支撑你认出好机会？'
  - 请给出你的结论和理由，不少于300字。
- 'no': 2
  title: 三步带货图文 vs 心理钩子拆解
  contents:
  - 选取一个你最近刷到的带货图文或短视频：
  - 1. 拆解它的三步结构：
  - '   - 第一步用了什么内容引起注意？'
  - '   - 第二步如何制造需求/痛点共鸣？'
  - '   - 第三步的转化钩子是什么？'
  - 2. 分析其"用户心理钩子"：
  - '   - 是恐惧驱动？贪婪驱动？还是从众驱动？'
  - '   - 这个钩子对你的实际吸引力有多大？为什么？'
  - 3. 如果让你重新设计这个内容，你会改动哪个环节来提升转化率？
  - 请在纸上画出你的拆解与再设计方案。
- 'no': 3
  title: 知识付费闭环沙盘推演
  contents:
  - 假设你要做一个"AI绘画入门"知识付费产品，目标年营收150万：
  - 1. 用定位四问写出你的定位：
  - '   - 为谁？解决什么问题？'
  - '   - 为什么是你？为什么是现在？'
  - 2. 设计轻量化产品矩阵：
  - '   - 引流产品（9.9元）'
  - '   - 核心产品（199-499元）'
  - '   - 高端产品（2000元+）'
  - 3. 画出产品阶梯递进路径，标出每一步的目标转化率
  - 4. 设定你的续费率北极星指标：
  - '   - 你计划第一季度的续费率是多少？'
  - '   - 如果续费率低于预期，你如何调整产品而非增加流量？'
  - 提交你的商业模式画布。
- 'no': 4
  title: 个人IP定位与视觉锤设计
  contents:
  - 假设你要打造一个"极简理财"个人IP，目标年入100万：
  - 1. 写出你的赛道选择与差异化理由：
  - '   - 这个赛道为什么适合你？'
  - '   - 你和Top3博主的核心差异是什么？'
  - 2. 设计你的视觉锤：
  - '   - 一个独特的视觉符号（如：一个红色存钱罐）'
  - '   - 一句可被记住的slogan（如："省钱不如养鹅"）'
  - 3. 制定多平台矩阵与日更计划：
  - '   - 选择3个平台，说明各自的定位'
- 'no': 5
  title: 沙盘模拟：AI超级个体SOP化
  contents:
  - 假设你要做一个AI数字人直播带货项目：
  - 1. 拆解你的核心业务流程（从内容生成到订单转化）
  - 2. 为每个环节设计SOP模板：
  - '   - 内容生产脚本SOP'
  - '   - 直播运营SOP'
  - '   - 用户私域承接SOP'
  - 3. 标注哪些环节可以用AI工具放大效率：
  - '   - 内容生成/剪辑/客服/数据分析分别用哪些AI工具'
  - 4. 评估：你的AI超级个体模型能否做到"一人干三人的活"？
  - '   - 列出效率瓶颈和可外包环节'
  - '   - 思考团队组建的时机与方式'
  - 提交你的AI超级个体SOP框架图。
- 'no': 6
  title: 六步求助法与贵人识别实操
  contents:
  - 回想你最近一次"需要帮助却未能开口"的经历：
  - 1. 应用六步求助法重新设计你的求助策略：
  - '   - 第一步：明确你真正需要的帮助是什么'
  - '   - 第二步：找到最合适的"贵人"'
  - '   - 第三步：如何让他愿意帮你（你能提供什么价值）'
  - '   - 第四步：如何开口（话术演练）'
  - '   - 第五步：如何执行并反馈'
  - '   - 第六步：如何后续维护关系'
  - 2. 识别你过去是否陷入"苦劳陷阱"：
  - '   - 你有没有一直在用自己的苦劳等待被看见？'
  - 3. 写出一份你认为"值得帮"的人设清单：
  - '   - 如果你是贵人，你会帮什么样的人？'
  - 提交你的求助演练设计。
- 'no': 7
  title: 项目筛金术：用五维评估法筛出你的下一个项目
  contents:
  - 列出你手头正在考虑的3个项目：
  - 1. 先用三大过滤标准做初筛（不符合任一条件的直接淘汰）
  - 2. 对通过初筛的项目进行五维深度评估：
  - '   - 需求真实性'
  - '   - 竞争格局'
  - '   - 盈利模式'
  - '   - 规模化潜力'
  - '   - 自身匹配度'
  - 3. 对每个维度打分（1-10分）并加权计算总分
  - 4. 写出最终结论：
  - '   - 你的结论是什么？'
  - '   - 你认为五维评估法最大的盲区在哪里？'
  - '   - 你如何弥补？'
  - 提交你的评估表格及分析。
- 'no': 8
  title: 产品三个一评估法实战应用
  contents:
  - 选取你熟悉的3个产品（如：微信、抖音、ChatGPT）：
  - 1. 用三个一标准逐个评估：
  - '   - First One：它是该品类先行者吗？'
  - '   - Only One：它在用户心智中是唯一的吗？'
  - '   - Number One：它现在是品类第一吗？'
  - 2. 分析：
  - '   - 它的付费本质是什么？（用户为什么愿意掏钱）'
  - '   - 它的可做性与品类有关吗？为什么？'
  - 3. 对照你身边失败的产品：
  - '   - 它违背了三个一中哪一条？'
  - 4. 思考：如果一个产品在三个一中仅占一条，它还能成功吗？
  - 提交你的对比分析表。
units:
- 'no': 1
  name: 常识 —— 被忽略的显学
  points:
  - '**为什么需要这个概念？**'
  - '- 人们常常把复杂等同于高级，把简单误认为肤浅'
  - '- 投资与决策中大量失败源于违背最基本的常识'
  - '- 常识之所以被忽略，是因为它太朴素，不构成谈资'
  - '**核心定义**'
  - '- 常识即是基于真实世界运行规律的、看似简单却经常被违背的显性知识'
  - '- 表现为"在有鱼的地方钓鱼"这类朴素而根本的判断准则'
  - '**关键性质**'
  - '- 朴素性：一句话即可表达，无需复杂理论包装'
  - '- 不可违背性：违背常识必然付出代价，只是时间问题'
  - '- 非神秘性：并非晦涩的专业知识，而是人人听说、却少人践行'
  - '**典型例子**'
  - '- 钓鱼要想有收货，就要选在有鱼的池塘，而不是在鱼少的地方苦钓'
  - '- 做生意要想成功，就要选择有真实需求的赛道，而不是逆势硬熬'
  - '**边界条件**'
  - '- 常识不等于庸俗的随大流，它依然需要真实世界规律来支撑'
  - '- 常识的"朴素"只是一种表达形态，不代表逻辑上的平庸'
  - '- 当环境极度扭曲（如泡沫期）时，常识可能会在短期内失灵'
  sources:
  - paper: 20231205_03_芒格人生智慧
    role: origin
  excerpts:
  - '"在有鱼的地方钓鱼"'
  - 常识：看似简单却常被违背的、基于真实世界规律的知识
- 'no': 2
  name: 捡烟蒂式投资的误区 —— 便宜就是王道吗？
  points:
  - '**为什么需要这个概念？**'
  - '- 传统格雷厄姆式"捡烟蒂"投资主张买便宜货，但对质量缺乏考量'
  - '- 只追逐价格便宜而忽略企业质地，是违背常识的典型误区'
  - '- 需要以此案例来展示"常识"在投资决策中的具体应用'
  - '**核心定义**'
  - '- 捡烟蒂式投资是指只关注价格低估、而忽略标的本身质量的投机型策略'
  - '- 其误区在于：将"便宜"误当作"价值"，选择了错误的水域'
  - '**关键性质**'
  - '- 表面吸引力：低价给人一种安全感和确定性'
  - '- 内在陷阱：便宜可能因为生意本身差，是价值毁灭而非低估'
  - '- 违背常识：在没有鱼的地方撒再多的网也不会丰收'
  - '**典型例子**'
