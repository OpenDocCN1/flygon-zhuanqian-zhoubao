learning_targets:
- 理解常识作为被忽略的显学，在决策中的基础地位
- 掌握捡烟蒂式投资误区的本质，区分价格与价值
- 学会以少而精的决策观看待机会，掌握等待的艺术
- 理解知行合一的实践有效性，形成习惯性的执行能力
- 能在具体决策中运用三大过滤标准筛选机会
- 掌握五维深度评估法，并对候选项目进行系统性评估
- 清晰界定 First One、Only One、Number One 三种产品定位
- 理解付费本质与产品可做性，掌握三个一评估法的实操应用
- 掌握三步带货图文制作法与用户心理钩子的设计
- 建立流量稀缺视角，理解内容自带流量的钩子思维
- 掌握定位四问与轻量化产品设计，搭建产品阶梯递进策略
- 深刻理解续费率是验证知识付费闭环的北极星指标
- 把握个人IP的定义，掌握视觉锤与多平台矩阵日更策略
- 能以三维驱动模型理解个人IP增长，识别专注度定律的边界
- 理解AI超级个体的本质及其千倍杠杆效应
- 掌握SOP化系统构建与AI赋能指数放大的方法
- 学会六步求助法，识别并规避苦劳陷阱
- 掌握从知到行断裂的成因，完成知行合一的习惯锻造
- 厘清理性与道德的边界，构建完整决策框架与护城河
- 理解产品商业闭环的局限性，掌握小而美模式的适用边界
