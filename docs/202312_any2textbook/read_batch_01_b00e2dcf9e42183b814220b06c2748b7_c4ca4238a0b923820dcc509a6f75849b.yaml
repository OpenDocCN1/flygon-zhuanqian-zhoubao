- file_path: docs/202312/20231212_06.md
  title: 顺着人性做生意，逆着人性修自己
  summary: 以商业观察视角，引出'顺着人性做生意、逆着人性修自己'的观点，并用多个商业案例（知识付费、餐饮、理财）论证人性在商业决策中的根本性作用。
  core_question: 在商业和创业中，人性起到何种作用？如何正确看待和利用人性？
  key_judgment: 商业成功的底层逻辑是顺应人性（如贪多求快），而个人成长和坚持则需逆人性（如专注、自律）。洞察并顺势而为是分析商业问题的重要思路。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 口语化
  screening_conclusion: retain
  reason: 文章揭示了商业分析的双重路径（理性与感性），并从人性视角提出了富有深度的商业洞察，可作为'商业思维'或'底层逻辑'相关章节的开篇或核心论述。
