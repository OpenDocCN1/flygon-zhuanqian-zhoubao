- file_path: docs/202312/20231212_09.md
  title: 给知识 IP 的 25 条超实用建议
  summary: 作者 Andrew 分享了 25 条针对知识 IP 的知识管理实用技巧，旨在解决知识 IP 在内容输出、效率提升和商业价值变现中的常见问题，每条技巧解决一个具体问题，并提供了详细的飞书文档链接。
  core_question: 知识 IP 如何通过有效的知识管理提升内容输出效率、流量获取和变现能力？
  key_judgment: 知识管理是知识 IP 解决‘茶壶煮饺子’困境（学得多但输出难）的核心工具，通过系统化的知识管理，IP 能更高效地利用已有内容资产，实现商业价值放大。
  depth: high
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 格式预处理
  - 重复
  screening_conclusion: retain
  reason: 文章由 25 条具体可操作的建议构成，结构清晰，内容扎实（1.8w 字），且直击知识 IP 的核心痛点（知识管理与内容输出），具备高参考价值和实操指导意义，适合作为系统化知识管理章节的素材。
- file_path: docs/202312/20231212_21.md
  title: 要学 AI，先学搜索
  summary: 作者杨昌提出学习 AI 的首要前提是掌握高效的搜索能力，并推荐了一款 B 站高播放量的搜索教程，结合自身经验分享了搜索引擎选择、搜索语法使用和信息源筛选的三个层次方法论。
  core_question: 在 AI 时代，个人如何通过提升搜索能力以获得更高质量的信息和学习效率？
  key_judgment: 高效的搜索能力是学习 AI 和新领域的基础，其核心在于选择正确的信息源（如谷歌>公众号>短视频>百度）、掌握高级搜索语法（如 intitle,
    intext），并遵循‘从一手源头获取信息’的原则，这比直接提问更能体现专业性和尊重。
  depth: medium
  suggested_destination: handbook_entry
  possible_shape: handbook
  risks:
  - 时效性
  - 重复
  screening_conclusion: retain
  reason: 文章提供了一个非常实用且可复制的方法论，尤其是对信息源优先级和搜索语法的讲解，对于信息搜集类内容具有很高的实操价值。虽未深入 AI 本身，但作为‘搜索’这一基础技能的指导，是很好的工具型素材。
- file_path: docs/202312/20231212_22.md
  title: AI 时代超级个体的 10 倍、100 倍、1000 倍成长路径，到底在哪里
  summary: 作者 hanniman 基于其 AI 产品经理背景，分享了 AI 时代个人成长的认知框架，提出了超级个体实现 10 倍、100 倍、1000
    倍成长的具体路径，并指出了 AI 应用中的常见认知误区。
  core_question: 在 AI 时代，个人（特别是超级个体）如何突破职业瓶颈，找到 10 倍、100 倍乃至 1000 倍的成长路径？
  key_judgment: AI 时代的超级个体成长路径有明确递进关系：先构建 SOP 化系统（10倍），再组建团队（100倍），最后用 AI 赋能前两者（1000倍）。跳过前两步直接追求
    AI 放大是不现实的，因为第三步对认知深度的要求极高。
  depth: high
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 口语化
  - 时效性
  screening_conclusion: retain
  reason: 文章提出了具有强创新性和启发性的观点（如‘圈层踩踏’、‘AI 制动器’等），并给出了清晰的成长路径模型。虽然是从直播中提炼，但逻辑完整，认知密度高，非常适合作为探讨
    AI 与个人成长关系的章节核心素材。
- file_path: docs/202312/20231219_03.md
  title: 不妨挣快钱，不妨短期主义
  summary: 作者小马宋通过对话引出对‘长期主义’和‘短期主义’的辩证思考，认为当个人目标本质是赚更多钱时，长期主义并非唯一正确选择，短期主义同样可取，关键在于认清自身处境和目标。
  core_question: 在个人职业和事业发展中，长期主义和短期主义究竟该如何选择？
  key_judgment: 长期主义与短期主义的选择不应受外界话语绑架，而是取决于个人的核心目标、实际处境和宏观环境判断。如果目标是赚更多钱，短期主义（如尽快变现）是理性的；长期主义更适合已有财务基础且有其他追求（如公司长期存在）的人。
  depth: medium
  suggested_destination: kb_entry
  possible_shape: kb
  risks:
  - 重复
  - 口语化
  screening_conclusion: retain
  reason: 文章对一个常见的商业/职业话题提出了有价值的反主流视角，有助于破除‘长期主义=政治正确’的迷思，引发深层思考。观点清晰，逻辑自洽，适合作为知识库中‘认知与决策’主题下的一个观点条目。
- file_path: docs/202312/20231219_04.md
  title: 大厂高管创业为什么失败率也很高？
  summary: 作者小马宋总结了 9 点大厂高管创业失败率高的原因，核心论点是大厂高管的成功经验、能力和环境与创业所需的‘江湖能力’极不匹配，导致其难以适应创业的高压和不确定性。
  core_question: 为什么具备能力、资源、经验的大厂高管在创业时失败率依然很高？
  key_judgment: 大厂高管创业失败的核心原因在于‘能力错配’：其技能高度依赖大厂平台（如带200人团队的经验），缺乏实体/知识付费领域的操盘能力，且严重低估了创业决策的风险和压力（大厂决策损失有底线，创业损失无底线）。
  depth: medium
  suggested_destination: handbook_entry
  possible_shape: handbook
  risks:
  - 重复
  screening_conclusion: retain
  reason: 文章通过对比（如鲁智深与武松）和具体分析，系统性地拆解了一个普遍现象背后的深层原因，对职场人士具有警示和参考价值。虽属思辨内容，但结构清晰，观点明确，适合作为职业发展相关主题的优质素材。
- file_path: docs/202312/20231219_20.md
  title: 腰部的创造者，最容易受 AI 影响
  summary: 作者杨昌反驳了‘腰部创造者最易受AI影响’的观点，认为在推荐算法和生成式 AI 的赋能下，腰部创作者反而因 AI 获得更多独创性和被看见的机会，有望成为细分领域的头部。
  core_question: 在 AI 时代，腰部创作者（中腰部内容创造者）的处境是受到冲击还是获得机遇？
  key_judgment: 腰部创作者因 AI 而受益：推荐算法让有特定价值的腰部内容能被精准匹配；生成式 AI 既能帮助其检验独创性，又能通过辅助筛选优质内容，让更多‘金子’被看到。AI
    带来的不是单纯‘强者恒强’，而是细分品类的繁荣和腰部创作者的大量涌现。
  depth: high
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 口语化
  screening_conclusion: retain
  reason: 文章提出了一个鲜明的反共识观点，并通过逻辑推理（反驳二维贪吃蛇思维）和案例（抖音创作者、AI 筛选）进行论证，内容有张力，角度新颖。对理解 AI
    对创作者生态的影响提供了重要补充视角，适合作为探讨 AI 与个人崛起关系的章节素材。
- file_path: docs/202312/20231226_08.md
  title: 在抖音帮工厂招焊工，一个人头赚 1700 块
  summary: 作者‘特立独行的猫’详细分享了其团队在抖音等平台通过短视频和直播为工厂招聘焊工的劳务中介项目，完整拆解了前端流量获取、中端客服转化、后端工厂资源交付的全链路操作流程及盈利模式。
  core_question: 在抖音等平台做工厂焊工招聘（劳务中介）这个项目具体是怎么运作的？如何实现月入 3 万+？
  key_judgment: 劳务中介虽被视为低端行业，但却是闷声发财的典型。其成功关键在于‘招聘能力+转化能力+工厂资源’三者的平衡。短视频（实地探厂）是获客核心，数据化客服管理是转化关键，与诚信的一手单公司合作是交付保障，同时需警惕洗人、封号等产业链风险。
  depth: high
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 时效性
  - 重复
  screening_conclusion: retain
  reason: 这是一篇极为详尽和真实的项目实操案例（精华帖），覆盖了从行业背景、操作流程、变现模式到风险规避的全链路细节，数据具体，场景真实，对了解和复制类似冷门细分项目具有极高的指导价值。
