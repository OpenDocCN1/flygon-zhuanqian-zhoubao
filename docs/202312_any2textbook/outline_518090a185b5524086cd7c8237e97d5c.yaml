- 'no': 1
  name: 个人IP与百万变现 —— 把“自己”做成一家公司
  desc: 本章从个人品牌建设的底层逻辑出发，带你理解如何选择赛道、建立信任、设计交付，最终实现100万利润的实操路径。
  nodes:
  - 'no': 1
    name: 为什么需要个人IP
    desc: 用“信任资产”类比理解：在信息过载时代，个人IP是降低用户决策成本、实现商业变现的核心资产
    role: motivation
    src:
    - paper: 20231226_24_个人IP一百万
  - 'no': 2
    name: 什么是个人IP
    desc: 定义个人IP：通过持续内容输出，在特定领域建立专业化认知与信任，进而转化为可货币化的个人品牌资产
    role: definition
    src:
    - paper: 20231226_24_个人IP一百万
  - 'no': 3
    name: 选择适合自己的方向
    desc: 提出“匹配资源优于追逐趋势”的选赛道原则，强调聚焦自身优势而非盲目跟风
    role: method
    src:
    - paper: 20231226_24_个人IP一百万
  - 'no': 4
    name: 三维驱动增长定理
    desc: 个人IP的变现增长由方向选择、变现体系、内容策略三核共同驱动，缺一不可
    role: proof
    src:
    - paper: 20231226_24_个人IP一百万
  - 'no': 5
    name: 打造视觉锤：建立心智记忆点
    desc: 通过统一而有辨识度的视觉符号，让内容在用户心智中形成高度可识别的锚点
    role: method
    src:
    - paper: 20231226_24_个人IP一百万
  - 'no': 6
    name: 内容策略：多平台矩阵放大与日更
    desc: 通过跨平台分发与高频日更，实现流量叠加与信任的持续积累
    role: method
    src:
    - paper: 20231226_24_个人IP一百万
  - 'no': 7
    name: 变现体系：轻交付与客户筛选
    desc: 设计标准化、流程化的轻量交付产品，结合付费门槛（先买后退）筛选高意愿客户
    role: method
    src:
    - paper: 20231226_24_个人IP一百万
  - 'no': 8
    name: 成功案例：一年100万的运营拆解
    desc: 以实际运营数据（100万利润/15万粉丝/2万私域）验证方法论有效性
    role: experiment
    src:
    - paper: 20231226_24_个人IP一百万
  - 'no': 9
    name: 专注度定律：注意力即货币
    desc: 个人IP变现遵循“专注度在哪里，钱就在哪里”的非线性收益规律
    role: extension
    src:
    - paper: 20231226_24_个人IP一百万
- 'no': 2
  name: AI超级个体路径 —— 从一人公司到千倍杠杆
  desc: 本章聚焦AI时代个体能力放大的递进路径，解释为何盲目追求AI是陷阱，而系统化建设才是指数级成长的基石。
  nodes:
  - 'no': 1
    name: 从个人IP到AI超级个体
    desc: 用“能力杠杆”类比引入：AI时代个体可通过结构化放大实现10倍到1000倍的产出跃迁
    role: motivation
    src:
    - paper: 20231212_22_AI超级个体路径
  - 'no': 2
    name: 什么是AI超级个体
    desc: 定义AI超级个体：通过系统化、团队化与AI赋能三重叠加，实现个体产出指数级放大的新型工作模式
    role: definition
    src:
    - paper: 20231212_22_AI超级个体路径
  - 'no': 3
    name: 第一阶段：SOP化系统构建
    desc: 将个人能力标准化、流程化为SOP，实现“一个人做出一支队伍的产出”，达成10倍成长
    role: method
    src:
    - paper: 20231212_22_AI超级个体路径
  - 'no': 4
    name: 第二阶段：团队组建与杠杆
    desc: 在SOP基础上组建团队，从执行者升级为团队负责人，利用组织杠杆实现100倍成长
    role: method
    src:
    - paper: 20231212_22_AI超级个体路径
  - 'no': 5
    name: 第三阶段：AI赋能指数放大
    desc: 在系统与团队均成熟后，叠加AI工具实现指数级放大，达到1000倍成长
    role: method
    src:
    - paper: 20231212_22_AI超级个体路径
  - 'no': 6
    name: 成长顺序不可颠倒
    desc: 递进式成长定理：必须先SOP化、再团队化、最后AI赋能，跳过任何一步都将导致系统性坍塌或无效投入
    role: proof
    src:
    - paper: 20231212_22_AI超级个体路径
  - 'no': 7
    name: 反面案例：圈层踩踏现象
    desc: 揭示盲目追求AI放大、忽略前两阶段建设的常见误区，导致内卷与无效产出
    role: limitation
    src:
    - paper: 20231212_22_AI超级个体路径
  - 'no': 8
    name: 从AI超级个体到IP变现的整合
    desc: 将本章递进路径与前章个人IP方法论结合，形成完整的一人公司商业闭环落地策略
    role: extension
    src:
    - paper: 20231226_24_个人IP一百万
    - paper: 20231212_22_AI超级个体路径
