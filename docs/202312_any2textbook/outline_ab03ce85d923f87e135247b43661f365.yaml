- 'no': 1
  name: 项目筛金术 —— 从“什么都想做”到“专精深耕”
  desc: 本章面向新手，讲解如何在海量机会中筛选出值得投入的项目，核心是掌握一套从“过滤”到“深挖”的方法论，避免精力浪费。
  nodes:
  - 'no': 1
    name: 为什么需要筛选：信息过载下的决策困境
    desc: 用“淘金热”类比：机会遍地但陷阱重重，直接行动往往导致低效与失败，必须先建立筛选意识。
    role: motivation
    src:
    - paper: 20231205_11_项目筛金术
  - 'no': 2
    name: 三大过滤标准：合法性、长期性、单人可操作性
    desc: 定义项目筛选的硬性门槛，任一不满足即放弃，确保项目在法律安全、可持续且初期可独立启动。
    role: definition
    src:
    - paper: 20231205_11_项目筛金术
  - 'no': 3
    name: 单人可操作性的深层含义：从“单人”到“批量复制自己”
    desc: 解释为何“单人可操作”是关键：它为初期验证和后续团队组建提供基础，是“批量复制自己”的前提。
    role: motivation
    src:
    - paper: 20231205_11_项目筛金术
  - 'no': 4
    name: 五维深度评估法：矩阵性、盈利方式、切入时机、兴趣匹配、拓展性
    desc: 通过五个问题对通过过滤的项目进行深度体检，评估其规模化潜力、商业模式、时机与个人适配度。
    role: method
    src:
    - paper: 20231205_11_项目筛金术
  - 'no': 5
    name: 先过滤后深挖原则与实操演示
    desc: 展示如何将一个想法按照“三大过滤”和“五维评估”顺序执行，形成理性决策的完整流程。
    role: experiment
    src:
    - paper: 20231205_11_项目筛金术
  - 'no': 6
    name: 方法论的局限与适用边界
    desc: 讨论该框架在快速变化领域或依赖团队协作的项目中可能失效的场景，提醒读者避免教条化应用。
    role: limitation
    src:
    - paper: 20231205_11_项目筛金术
- 'no': 2
  name: 产品三个一 —— 让产品“一出生就赢在起跑线”
  desc: 本章聚焦产品选择与评估，提出“先发、唯一、第一”的三角判断标准，帮助你识别具有高潜力的产品，并理解用户付费的本质。
  nodes:
  - 'no': 1
    name: 从项目到产品：评估重心的转移
    desc: 承接上章的项目筛选，引出产品层面的独特判据——三个一特性，阐述其独立于品类的价值。
    role: motivation
    src:
    - paper: 20231212_05_产品三个一
  - 'no': 2
    name: First One：先发优势与井喷流量
    desc: 定义第一个推出产品的概念，并解释其如何通过时间差获取初始用户和流量红利。
    role: definition
    src:
    - paper: 20231212_05_产品三个一
  - 'no': 3
    name: Only One：唯一解决方案的护城河
    desc: 定义在特定时间窗口内成为唯一解决方案的概念，强调其带来的独家竞争优势和溢价能力。
    role: definition
    src:
    - paper: 20231212_05_产品三个一
  - 'no': 4
    name: Number One：品类第一的信任与议价权
    desc: 定义成为品类第一的概念，解释其如何汇聚最大流量信任，并转化为市场议价权。
    role: definition
    src:
    - paper: 20231212_05_产品三个一
  - 'no': 5
    name: 产品可做性与品类无关的定理
    desc: 提出‘产品好坏取决于三个一特性而非品类’的核心判断，引导读者跳出品类思维。
    role: proof
    src:
    - paper: 20231212_05_产品三个一
  - 'no': 6
    name: 付费的本质：购买“问题被解决”的结果
    desc: 揭示用户付费逻辑，产品只是载体，真正被购买的是结果，这决定了产品设计的核心方向。
    role: definition
    src:
    - paper: 20231212_05_产品三个一
  - 'no': 7
    name: 三个一特性评估法的应用与拓展
    desc: 结合案例演示如何用三个一标准评估产品，并探讨当产品难以获得任一特性时的替代策略与思考。
    role: extension
    src:
    - paper: 20231212_05_产品三个一
