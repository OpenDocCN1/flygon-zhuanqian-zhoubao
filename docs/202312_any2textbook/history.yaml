    function:
      arguments: '{"paper_name": "20231205_23_带货图文方法论", "paper": "如何做出高效的带货图文，只需 3
        步，10 分钟就学会\n作者：张集慧\n抖音从23年年初开始推图文带货，相比视频，图文的维度更少，很多产品就是2-3张图搭配文字，就能做出很不错的转化。图文操作的难度更低，对新人更容易上手。\n第一招，出奇制胜。核心是\"先搞定流量，再去选品\"。在物资过剩时代，流量比产品更稀缺，因此应反向操作：先在小红书等平台寻找异常、高赞的流量内容作为素材，再巧妙嫁接产品，而非先选品再做内容。\n内容自带流量是前提，转化靠构建用户心理钩子（如猎奇、焦虑、炫耀）。案例：找自带流量的猎奇/反差内容，再嫁接产品，通过内容钩子（剧情、焦虑）引导转化。比如鱼胶、床照、清肺、五指毛桃等案例，拆解了具体操作和变现结果。\n做带货图文的3步：先搜找自带流量的素材，再嫁接产品，最后用内容钩子驱动转化。案例：10w播放、3000+佣金。\n核心观点：物料过剩时代，流量比产品更稀缺，应先搞定流量（找自带流量内容）再去选品（嫁接产品），这与传统先选品后内容的思路相反。"}'
