  content: "{\n  \"docs/202312/20231205_03.md\": \"# 他活了 99 岁，人生正确率几乎 100%  > 原文：[`www.yuque.com/for_lazy/thfiu8/kcgnegze6k17eg8s`](https://www.yuque.com/for_lazy/thfiu8/kcgnegze6k17eg8s)\
    \  ## (精华帖)(419 赞)他活了 99 岁，人生正确率几乎 100%  作者： 小马宋  日期：2023-11-29  他活了 99 岁，人生正确率几乎\
    \ 100%  我本人对投资这件事，算是十窍通了九窍：一窍不通。  但我对芒格一直很非常喜欢，甚至超过了巴菲特，因为芒格的智慧，可以适用在任何领域和行业。\
    \  芒格是比巴菲特大 6 岁，早年做气象观察员，后来是洛杉矶地区最受欢迎的律师之一。  如果他能安心做律师并经营自己的律所，虽然可能会成为历史上最著名的律师或者是知名的律所创办人，但我会很可惜，因为芒格作为投资人之后给世人的启示会更有意义。\
    \  应该说，是芒格纠正了巴菲特过去“捡烟蒂”式的投资方式，让他关注真正有价值的企业并长期持有来获利。  2008 年，在芒格的介绍下，巴菲特投资了中国的比亚迪。巴菲特在比亚迪这\"\
    ,\n  \"docs/202312/20231205_04.md\": \"# 真心建议所有想搞钱的年轻人，都去读读查理芒格的《穷查理宝典》  > 原文：[`www.yuque.com/for_lazy/thfiu8/nyq47xfmw1rkp2q7`](https://www.yuque.com/for_lazy/thfiu8/nyq47xfmw1rkp2q7)\
    \  ## (46 赞)真心建议所有想搞钱的年轻人，都去读读查理芒格的《穷查理宝典》  作者： 掌柜丨湖北丨传统转型  日期：2023-11-29  你好，我是摸鱼掌柜。\
    \  投资界的大佬，查理芒格去世。  某种意义上，我是他的学生，他的**《穷查理宝典》**这本书，对我的启发非常大。  书中很多知识，不仅帮我获得了财富，也少走了许多人生弯路。整理了一些改变我命运的格言，分享给各位。\
    \  ## **01、**  > 这个世界上能获得财富的方式非常多，可以靠体力，可以靠脑力，还可以靠复利。 >  > 但无论哪一种，都离不开一个逻辑：**想要获取财富，你必须先找到能交易的地方去，也就是你要有能找到好打猎的地方才是本事。**\
    \ >  > 无论是谁，到了好打猎的地方，都能打到更多东西。 >  > 为什么我们鼓励年轻人\",\n  \"docs/202312/20231205_05.md\"\
    : \"# 为什么没遇到贵人？因为你根本就不会求助  > 原文：[`www.yuque.com/for_lazy/thfiu8/efntg9n2su7ay1fe`](https://www.yuque.com/for_lazy/thfiu8/efntg9n2su7ay1fe)\
    \  ## (37 赞)为什么没遇到贵人？因为你根本就不会求助  作者： 赵卿久  日期：2023-11-30  哈喽，生财有术的友友们好，我先自我介绍哈，我是卿久，97\
    \ 年中文系，运营两个公众号，慕卿久与未来可期的小赵，全职自媒体 3 年，粉丝 18w+。  擅长公众号运营和打造个人 IP、搭建自己的付费产品和私域运营，如今通过自媒体成功变现\
    \ 60w+，目前月入 4w+。  现在是机会主义时代，也许很多人离成功都只差一个机会，也许你只需要一个贵人，就能提携你平步青云。  但道理大家都懂，具体到现实里，我们该如何向人求助，把大佬变成自己的贵人呢？今天我们具体来聊聊方法\
    \  **✅1、保持真诚与礼貌**  求助代表我们需要最大程度地信任对方。所以，我们一定要在求助时，保持真诚与礼貌，以尊重对方。  你需要提前翻阅对方的公众号、朋\"\
    ,\n  \"docs/202312/20231205_11.md\": \"# 新人如何判断一个项目自己能不能做？  > 原文：[`www.yuque.com/for_lazy/thfiu8/xgy98gxdggz9gg6f`](https://www.yuque.com/for_lazy/thfiu8/xgy98gxdggz9gg6f)\
    \  ## (52 赞)新人如何判断一个项目自己能不能做？  作者： 苗子¹  日期：2023-11-27  信息越来越透明，大家每天都会刷到很多日入过万，月入十万，甚至百万的文章，就问一句：你焦虑吗？\
    \  同理，和我上一篇文章一样 [`t.zsxq.com/14HiVIhT0`](https://t.zsxq.com/14HiVIhT0)  我将会用最简单的大白话，最实用的几个种方法去详细讲解，如何选择一个适合自己的项目，这也是我自己常用的方法（经供参考）\
    \  **首先选择项目过滤一下**，只要没有达到以下三个要求，直接 Pas 掉：  1，项目合法吗？  2，项目长期吗？  3，单人能做吗？  前两点很简单，做合法公民，做长期主义者。\
    \  第三点个人觉得非常重要，因为我就是这样不断地去批量复制“自己”，才组建了一个小十人团队的工作\",\n  \"docs/202312/20231205_23.md\"\
    : \"# 如何做出高效的带货图文，只需 3 步，10 分钟就学会  > 原文：[`www.yuque.com/for_lazy/thfiu8/xqp2pldg348mayui`](https://www.yuque.com/for_lazy/thfiu8/xqp2pldg348mayui)\
    \  ## (135 赞)如何做出高效的带货图文，只需 3 步，10 分钟就学会  作者： 张集慧  日期：2023-11-29  这篇文章是[《账号如何快速涨粉过\
