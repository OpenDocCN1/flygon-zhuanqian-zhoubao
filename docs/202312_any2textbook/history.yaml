  content: "{\n  \"paper\": \"20231205_23_带货图文方法论\",\n  \"desc\": \"该素材提出了一套面向带货图文的高效制作方法论，主张在物质过剩时代应'先搞定流量，再去选品'，即先寻找自带流量的内容素材（尤其在小红书等平台），再巧妙嫁接产品，并通过用户心理钩子（猎奇、焦虑、炫耀等）驱动转化，共三步即可制作出高效带货图文。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"出奇制胜（流量优先选品策略）\",\n      \"desc\"\
