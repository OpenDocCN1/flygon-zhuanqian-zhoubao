    function:
      arguments: '{"paper_name": "20231212_22_AI超级个体路径", "paper": "AI 时代超级个体的 10 倍、100
        倍、1000 倍成长路径\n作者：hanniman\n大家好，我是黄钊hanniman，11年AI背景，现\"AI产品经理大本营\"创建者，前腾讯PM。\n部分认知点包括：\n1、AI导致的风险，可能不是潮水，而是飓风，很多人会被卷得非...\n2、AI时代的超级个体成长路径有明确递进关系：先构建SOP化系统（10倍），再组建团队（100倍），最后用AI赋能前两者（1000倍）。跳过前两步直接追求AI放大是不现实的，因为第三步对认知深度的要求极高。\nAI时代超级个体的成长逻辑：\n-
        10倍：把个人能力SOP化、系统化，一个人做出一支队伍的产出。\n- 100倍：组建团队，从超级个体升级为团队负责人，实现规模化和杠杆。\n- 1000倍：用AI赋能前两步，实现指数级放大，但这需要极高的认知深度和判断力。\n\"圈层踩踏\"、\"AI制动器\"等概念揭示了AI时代的独特现象：盲目追求AI放大而忽略系统建设和团队协作，会导致\"圈层踩踏\"式的无效内卷。\n核心观点：AI时代超级个体的成长路径有明确递进关系：先构建SOP化系统（10倍），再组建团队（100倍），最后用AI赋能前两者（1000倍）。跳过前两步直接追求AI放大不现实。"}'
