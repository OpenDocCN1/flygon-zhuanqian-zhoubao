    \    {\n      \"name\": \"案例佐证法\",\n      \"desc\": \"作者采用的具体叙述方法：以芒格生命中的多个关键决策与长期行为作为证据，支撑对其人生哲学的概括。该方法通过具体的时间跨度（如50年读《巴伦周刊》）与金额（如赚8000万美元、600亿人民币回报）来增强说服力，使抽象的'耐心''常识'等原则获得经验支撑。\"\
    ,\n      \"excerpt\": [\n        \"读《巴伦周刊》读了50年，只找到了一个投资机会，通过这个机会赚了8000万美元。\"\
    ,\n        \"2008年芒格介绍下巴菲特投资比亚迪，赚到600亿人民币回报。\"\n      ]\n    }\n  ],\n  \"theorems\"\
    : [\n    {\n      \"name\": \"钓鱼第一原则\",\n      \"desc\": \"核心主张：做事的根本原则是选择正确的方向与场所——'在有鱼的地方钓鱼'，同时不能忘记这个第一原则。该主张以钓鱼类比投资与经营：菜好吃顾客才会来，然而很多人违背这个简单的经营原则。其要旨在于：正确的前提条件决定结果的成败。\"\
    ,\n      \"excerpt\": [\n        \"名言：'钓鱼有两个重要原则，第一是要在有鱼的地方钓鱼，第二是不要忘记第一条原则。'菜好吃顾客才会来，这个道理很简单，可很多人就一定要违背这种经营原则。\"\
    \n      ]\n    },\n    {\n      \"name\": \"少而精的决策观\",\n      \"desc\": \"核心主张：我们一生获得的大部分财富，本质上取决于极少数几个关键决策，其余时间都应当用于等待真正时机出现，而非频繁行动。芒格以50年读《巴伦周刊》只找到一个机会作为例证，强调'无敌的耐心'与克制出手的价值。\"\
    ,\n      \"excerpt\": [\n        \"本质上，我们一生获得的大部分财富，取决于很少的几个决策，其余时间都是在等待机会。\"\
    ,\n        \"读《巴伦周刊》读了50年，只找到了一个投资机会，通过这个机会赚了8000万美元。耐心等待，真正时机出现才出手。\"\n     \
    \ ]\n    },\n    {\n      \"name\": \"理性至上与道德约束\",\n      \"desc\": \"核心主张：投资与决策应以理性为依据，不以个人情绪和好恶判断标的（大多数失败的投资是意气用事）；同时，须坚守高道德要求，'宁愿亏自己，不愿亏他人'，永远对世界抱有善意。这一主张将理性与道德并置，作为个体决策的双重基石。\"\
    ,\n      \"excerpt\": [\n        \"芒格极尊重理性，不以个人情绪和好恶判断投资标的。大多数失败的投资是意气用事。\",\n\
    \        \"芒格有很高的道德要求，宁愿亏自己，不愿亏他人，永远对世界抱有善意。他对真实世界认识清醒，能说出'提高售价，然后用能获得的高利润去行贿'这样洞明世事的话。\"\
    \n      ]\n    }\n  ],\n  \"findings\": [\n    {\n      \"name\": \"知行合一的实践有效性\"\
    ,\n      \"desc\": \"[claim] 素材宣称：严格遵循简单正确道理比掌握复杂道理更能带来人生成功，关键在于'做'而非'知'。这一结论是素材的核心主张，由芒格'活了99岁，人生正确率几乎100%'的人生概括所支撑。\"\
    ,\n      \"excerpt\": [\n        \"芒格是一个讲普通道理，绝对严格去做的人。他活了99岁，人生正确率几乎100%。\",\n\
    \        \"学了很多道理依然过不好一生，因为没按照这些绝对正确的道理去做事。\"\n      ]\n    },\n    {\n      \"\
    name\": \"长期耐心与单一机会的回报\",\n      \"desc\": \"[evidence] 素材以数据事例支撑：芒格读《巴伦周刊》50年仅发现一个投资机会，该项投资赚得8000万美元；此外，2008年芒格介绍巴菲特投资比亚迪，获得600亿人民币回报。这些案例共同佐证了'少而精决策\
    \ + 长期耐心'的实践价值。\",\n      \"excerpt\": [\n        \"读《巴伦周刊》读了50年，只找到了一个投资机会，通过这个机会赚了8000万美元。\"\
    ,\n        \"2008年芒格介绍下巴菲特投资比亚迪，赚到600亿人民币回报。\"\n      ]\n    }\n  ]\n}"
- role: tool
