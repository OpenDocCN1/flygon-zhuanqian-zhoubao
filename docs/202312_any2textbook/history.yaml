        100%\n作者：小马宋\n芒格是比巴菲特大6岁，早年做气象观察员，后来是洛杉矶地区最受欢迎的律师之一。芒格纠正了巴菲特过去\"捡烟蒂\"式的投资方式，让他关注真正有价值的企业并长期持有。2008年芒格介绍下巴菲特投资比亚迪，赚到600亿人民币回报。芒格的个人思考与观点文集集合成《穷查理宝典》。\n芒格讲的内容难能可贵，他讲那些很简单的道理。名言：\"钓鱼有两个重要原则，第一是要在有鱼的地方钓鱼，第二是不要忘记第一条原则。\"菜好吃顾客才会来，这个道理很简单，可很多人就一定要违背这种经营原则。芒格以常识判断问题，但\"所谓常识，通常就是别人不知道的知识\"。\n芒格有很高的道德要求，宁愿亏自己，不愿亏他人，永远对世界抱有善意。他对真实世界认识清醒，能说出\"提高售价，然后用能获得的高利润去行贿\"这样洞明世事的话。\n芒格对个人财富不慎关注，有无敌的耐心。读《巴伦周刊》读了50年，只找到了一个投资机会，通过这个机会赚了8000万美元。耐心等待，真正时机出现才出手。本质上，我们一生获得的大部分财富，取决于很少的几个决策，其余时间都是在等待机会。\n芒格极尊重理性，不以个人情绪和好恶判断投资标的。大多数失败的投资是意气用事。学了很多道理依然过不好一生，因为没按照这些绝对正确的道理去做事。芒格是一个讲普通道理，绝对严格去做的人。他活了99岁，人生正确率几乎100%。\n核心观点：成功不在于知道多少复杂道理，而在能否将简单正确道理严格践行，做到知行合一。"}'
