    \  ## (37 赞)90%人玩小红书引流的认知误区  作者： 艾小飞  日期：2023-12-01  【90%人玩小红书引流的认知误区】  大家好，我叫艾小飞，擅长小红书引流。\
    \  在很多人的认知里，认为不管是卖什么产品，都要先把人全部引到微信后，再去考虑怎么赚钱  在这里我想问下，你曾有过这样的想法吗？你认为这样的做法合理吗？\
    \  接下来我会结合身边的案例和自己的想法，给你们分享下如何正确的在小红书引流  感兴趣的圈友，请看飞书文档：[`nivut760ftk.feishu.cn/docx/PLUedZ6nuohf8DxAGuQcCmUgnwg?from=from_copylink`](https://nivut760ftk.feishu.cn/docx/PLUedZ6nuohf8DxAGuQcCmUgnwg?from=from_\"\
    ,\n  \"docs/202312/20231205_59.md\": \"# 小赛道知识付费，我如何从 0 到 150 万-年  > 原文：[`www.yuque.com/for_lazy/thfiu8/amgwfaa6ooiqohqe`](https://www.yuque.com/for_lazy/thfiu8/amgwfaa6ooiqohqe)\
    \  ## (25 赞)小赛道知识付费，我如何从 0 到 150 万-年  作者： 戴明  日期：2023-12-01  ### 01 被用户推着走的创业者\
    \  大家好，我是生财有术航海家俱乐部的成员，拿到亦仁微天使投资的男人：王戴明，今天给大家分享一下我的创业故事和思考。  从 2022 年元旦辞职算起，作为个体创业者，我已经创业\
    \ 2 年。  这 2 年，每年净利润不到 200 万，其中知识付费带来的净利润每年约为 150 万（还有一些广告、软文等业务）。  说起我的创业，其实非常具有偶然性。\
    \  2020 年我在企业负责 IT 工作，因为无聊，注册了一个公众号，并且尝试写了几篇 SaaS 产品经理的文章，结果被一些自媒体自发转载，带来了大量粉丝。\
    \  到我 2022 年辞职创业的时候，我的公众号已经有 6 万粉丝，在\",\n  \"docs/202312/20231212_05.md\": \"\
    # 什么产品好做？三个一  > 原文：[`www.yuque.com/for_lazy/thfiu8/sz0dey7vy5z347ye`](https://www.yuque.com/for_lazy/thfiu8/sz0dey7vy5z347ye)\
    \  ## (精华帖)(227 赞)什么产品好做？三个一  作者： 刘小排  日期：2023-12-07  大家好啊，我是刘小排。今天向大家分享另一个我做产品的心法。\
    \  最近有生财有术的圈友问我：小排老师，什么品类的产品比较好推呢？  其实，这个问题问错了。产品好不好推、好不好做，跟品类没有太大关系。任何一个品类，都有少量好做好推的产品，和大量不好做不好推的产品。\
    \  好做的、好推的产品，有一些共同特征——它一定具备“三个一”特性中的至少一个： **要么 First One，要么 Only One，要么 Number\
    \ One**。  1.  First One， 是指这个产品在时间上是第一个推出的。在十倍速变化的领域，这样的产品有先发优势，往往会获得井喷一样的启动流量。\
    \  2.  Only One，是指这个产品在一个时间窗口内是某个特定问题唯一\",\n  \"docs/202312/20231212_06.md\":\
    \ \"# 顺着人性做生意，逆着人性修自己  > 原文：[`www.yuque.com/for_lazy/thfiu8/dtvqlingf63tc6oq`](https://www.yuque.com/for_lazy/thfiu8/dtvqlingf63tc6oq)\
    \  ## (120 赞)顺着人性做生意，逆着人性修自己  作者： 小马宋  日期：2023-12-07  顺着人性做生意，逆着人性修自己  昨天听老范跟周百见聊天的一期播客，说起知识付费这个领域。\
    \  周百见最早因为喷知识付费博主而成名，后来自己也成为知识付费的博主。  她说有些知识付费博主也不是没料，但是如果只讲干货，其实没法卖得很好。  所以今天知识付费的主流不是叫你成功，而是建立你会成功的幻觉。（我说的仅限商业领域）\
    \  因为教人成功太难了，是逆人性的，因为人只想发财，却不想付出太多。让人觉得自己能成功，是很容易的，因为人人都想发财。  人性贪多求快，又特别喜欢简单的成功法门，幻想一招致胜。\
    \  几年前全民创业大潮的时候，我接待过一些创业者，他们想做沙拉，健康餐。我说健康餐和沙拉肯定是做不大的。  因为大家就不喜欢，虽然追求健康，\",\n \
