        《如何找到商机并快速赚到钱》（仅外链无独立内容）\n- 《手把手教你空手套白狼》（法律风险）\n\n## 需补写内容（to_supplement）\n1.
        方法论通用框架（如项目筛选五步法的通用化表达）\n2. 章节间过渡与全书逻辑串联段落\n3. AI时代成长路径的纵深论述（当前仅框架性提出）\n4.
        常见坑与风险规避专章（综合多篇散点内容）\n5. 每章结尾行动清单与自检问题\n6. 系统性变现路径对比（对标多个案例形成方法树）\n\n## 写作方式与转化步骤\n-
        写作方式：案例驱动写法，每章\"先抛问题→精讲方法论→案例验证→实操清单收尾\"\n- 建议先起草：第7章（小赛道知识付费）、第8章（个人IP赚100万）、第4章（产品价值论）\n-
        风险提示：平台工具细节时效风险；哲理与实操的预期冲突；避免说教感\n"}'
