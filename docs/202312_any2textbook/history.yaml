  content: "{\n  \"paper\": \"20231212_22_AI超级个体路径\",\n  \"desc\": \"该素材由黄钊hanniman（11年AI背景、前腾讯PM、'AI产品经理大本营'创建者）提出，主张AI时代的个人成长应遵循明确递进的三阶段路径：先通过SOP化将个人能力系统化实现10倍产出，再组建团队形成规模化和杠杆实现100倍，最后用AI赋能前两者实现指数级的1000倍放大。素材强调跳过前两步直接追求AI放大是不现实的，因为第三步对认知深度要求极高，并引入'圈层踩踏''AI制动器'等概念揭示AI时代的独特内卷现象，同时指出AI带来的风险可能并非渐进式的潮水而是飓风式的冲击。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"AI超级个体\",\n      \"desc\": \"指在AI时代能够通过系统化、团队化和AI赋能实现个人产出指数级放大的个体，其成长遵循10倍→100倍→1000倍的递进路径。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"AI时代的超级个体成长路径有明确递进关系：先构建SOP化系统（10倍），再组建团队（100倍），最后用AI赋能前两者（1000倍）。\"\
    ,\n        \"AI时代超级个体的成长逻辑：10倍：把个人能力SOP化、系统化，一个人做出一支队伍的产出。100倍：组建团队，从超级个体升级为团队负责人。1000倍：用AI赋能前两步，实现指数级放大。\"\
    \n      ]\n    },\n    {\n      \"name\": \"圈层踩踏\",\n      \"desc\": \"AI时代的独特现象，指盲目追求AI放大而忽略系统建设和团队协作，导致无效内卷。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"'圈层踩踏'、'AI制动器'等概念揭示了AI时代的独特现象：盲目追求AI放大而忽略系统建设和团队协作，会导致'圈层踩踏'式的无效内卷。\"\
    \n      ]\n    },\n    {\n      \"name\": \"AI制动器\",\n      \"desc\": \"与圈层踩踏并列提出的AI时代独特现象概念，揭示AI放大过程中可能存在的制约因素。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"'圈层踩踏'、'AI制动器'等概念揭示了AI时代的独特现象。\"\
    \n      ]\n    }\n  ],\n  \"methods\": [\n    {\n      \"name\": \"__overview__\"\
    ,\n      \"desc\": \"该素材的整体方法论是提出一种个人成长的递进式路径模型，即先内部系统化、再外部团队化、最后用AI智能赋能的三个阶段，强调顺序不可跳跃。\"\
    ,\n      \"excerpt\": [\n        \"AI时代的超级个体成长路径有明确递进关系：先构建SOP化系统（10倍），再组建团队（100倍），最后用AI赋能前两者（1000倍）。\"\
    ,\n        \"跳过前两步直接追求AI放大是不现实的，因为第三步对认知深度的要求极高。\"\n      ]\n    },\n    {\n \
    \     \"name\": \"SOP化系统构建\",\n      \"desc\": \"将个人能力标准化、流程化、系统化，使单个人能输出一支队伍的产能，实现10倍成长。\"\
    ,\n      \"excerpt\": [\n        \"10倍：把个人能力SOP化、系统化，一个人做出一支队伍的产出。\"\n      ]\n\
