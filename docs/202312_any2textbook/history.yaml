    function:
      arguments: '{"paper_name": "20231205_11_项目筛金术", "paper": "新人如何判断一个项目自己能不能做？\n作者：苗子\n信息越来越透明，大家每天都会刷到很多日入过万，月入十万的文章，你焦虑吗？我将用最简单的大白话，最实用的几个方法去详细讲解，如何选择一个适合自己的项目，这也是我自己常用的方法。\n首先选择项目过滤一下。只要没有达到以下三个要求，直接Pas掉：\n1，项目合法吗？\n2，项目长期吗？\n3，单人能做吗？\n前两点很简单，做合法公民，做长期主义者。第三点个人觉得非常重要，因为我就是这样不断地去批量复制\"自己\"，才组建了一个小十人团队的工作室。\n其次，五个维度深挖判断这个项目到底适不适合自己：\n1，这个项目是矩阵性的吗？即是否可以规模化复制？\n2，如何赚钱？赚钱的方式是否清晰可复制？\n3，这个项目切入时机合适吗？现在是不是做它的好时候？\n4，项目与自己的兴趣、能力匹配吗？\n5，项目未来是否有拓展性？能不能延伸出更多玩法？\n核心：项目选择不应受他人盈利数据干扰，而应基于合法性、长期性、单人可操作性的过滤标准，并结合矩阵需求、盈利方式、切入时机、个人兴趣、项目拓展性五步进行理性评估。"}'
