    function:
      arguments: '{"paper_name": "20231226_24_个人IP一百万", "paper": "做个人IP第一年，赚到100万利润，我的经验与心得\n作者：云飞\n去年6月21日开始发第一条视频，截止今年6月底，刚好一年时间100万利润，平均一条视频带来2740元的收益，全网15万粉丝，2万私域。\n我是1800套房的包租公，去年发了一篇帖子把包租这门生意讲透取得精华得到龙珠，进入航海家俱乐部，在生财学到很多东西，这一年时间深耕我的包租IP。\n做个人IP的核心是找到\"适合\"自己的方向（而非仅追\"趋势\"），并以正确的变现体系（轻交付、流程化）和内容策略（视觉锤、大胆引流、持续日更）驱动增长；同时深刻领悟\"专注度在哪里，钱就在哪里\"。\n我提炼的经验包括：定位要找人设差异化，内容要有视觉锤，变现要轻交付流程化，通过多平台矩阵放大，用\"先买后退\"筛选客户，持续日更建立信任。\n核心观点：做个人IP的核心是找到适合自己的方向而非追趋势，以正确变现体系（轻交付、流程化）和内容策略（视觉锤、大胆引流、持续日更）驱动增长。"}'
