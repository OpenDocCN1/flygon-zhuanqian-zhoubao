    \n      ]\n    },\n    {\n      \"name\": \"内容自带流量\",\n      \"desc\": \"指内容本身具备吸引流量的属性，是转化的前提；转化则依靠构建用户心理钩子（如猎奇、焦虑、炫耀）来实现。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"内容自带流量是前提，转化靠构建用户心理钩子（如猎奇、焦虑、炫耀）。\"\
