    ,\n        \"通过内容钩子（剧情、焦虑）引导转化。\"\n      ]\n    }\n  ],\n  \"methods\": [\n  \
    \  {\n      \"name\": \"__overview__\",\n      \"desc\": \"高效带货图文的整体方法论：3步制作流程——先搜找自带流量的素材，再嫁接产品，最后用内容钩子驱动转化。\"\
    ,\n      \"excerpt\": [\n        \"做带货图文的3步：先搜找自带流量的素材，再嫁接产品，最后用内容钩子驱动转化。\"\n\
    \      ]\n    },\n    {\n      \"name\": \"三步带货图文制作法\",\n      \"desc\": \"具体操作流程：第一步搜索并找到自带流量的内容素材（如在小红书等平台找异常高赞内容）；第二步将产品嫁接进该内容；第三步利用内容钩子（剧情、焦虑等）驱动用户转化。\"\
    ,\n      \"excerpt\": [\n        \"只需 3 步，10 分钟就学会\",\n        \"做带货图文的3步：先搜找自带流量的素材，再嫁接产品，最后用内容钩子驱动转化。\"\
    ,\n        \"先在小红书等平台寻找异常、高赞的流量内容作为素材，再巧妙嫁接产品\"\n      ]\n    },\n    {\n    \
    \  \"name\": \"反向选品策略（先流量后选品）\",\n      \"desc\": \"颠覆传统'先选品后内容'的顺序，在过剩时代先锁定自带流量的内容方向，再反向选择匹配的产品进行嫁接。\"\
    ,\n      \"excerpt\": [\n        \"核心是'先搞定流量，再去选品'。在物资过剩时代，流量比产品更稀缺，因此应反向操作。\"\
    ,\n        \"这与传统先选品后内容的思路相反。\"\n      ]\n    }\n  ],\n  \"theorems\": [\n   \
    \ {\n      \"name\": \"流量稀缺优先论\",\n      \"desc\": \"核心主张：在物资过剩时代，流量比产品更稀缺，因此做带货图文应先解决流量问题（找自带流量的素材），再选品（嫁接产品），与传统先选品后做内容的思路相反。\"\
    ,\n      \"excerpt\": [\n        \"核心观点：物料过剩时代，流量比产品更稀缺，应先搞定流量（找自带流量内容）再去选品（嫁接产品），这与传统先选品后内容的思路相反。\"\
    ,\n        \"在物资过剩时代，流量比产品更稀缺\"\n      ]\n    },\n    {\n      \"name\": \"内容先于转化原则\"\
    ,\n      \"desc\": \"内容自带流量是转化的前提，转化成功依赖在内容中构建心理钩子。\",\n      \"excerpt\": [\n\
    \        \"内容自带流量是前提，转化靠构建用户心理钩子（如猎奇、焦虑、炫耀）。\"\n      ]\n    }\n  ],\n  \"findings\"\
    : [\n    {\n      \"name\": \"图文带货低门槛更易上手\",\n      \"desc\": \"[claim] 图文相比视频维度更少、操作难度更低，对新人更容易上手，且不少产品仅用2-3张图配文字即可获得不错转化；该结论来自作者对抖音图文带货的观察判断，非系统实验数据。\"\
