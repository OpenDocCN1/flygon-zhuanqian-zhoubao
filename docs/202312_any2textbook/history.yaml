    ,\n      \"excerpt\": [\n        \"案例：找自带流量的猎奇/反差内容，再嫁接产品，通过内容钩子（剧情、焦虑）引导转化。比如鱼胶、床照、清肺、五指毛桃等案例，拆解了具体操作和变现结果。\"\
    ,\n        \"案例：10w播放、3000+佣金。\"\n      ]\n    }\n  ]\n}"
