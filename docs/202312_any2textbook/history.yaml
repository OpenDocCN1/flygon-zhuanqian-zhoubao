    \  高管创业按说能力，资源，经验都有，为什么也很难成功呢？我觉得大概有以下几个原因。  1、 适合大厂高管创业的时机已经过了。如果是 10 年前，还是有许多做\
    \ APP 或者做网络创业的机会，而做这类创业，也是大厂高管们最擅长、最熟悉的领域。但是今天这个门已经被关上了，大部分高管创业，只能被迫转向餐饮、快消或者知识付费等领域，而这是他们不擅长的。\
    \  2、 实体创业和互联网创业需要两种截然不同的能力，而过去高管们熟悉的工作都是在互联网，一旦到了实体行业，他们就\",\n  \"docs/202312/20231226_24.md\"\
