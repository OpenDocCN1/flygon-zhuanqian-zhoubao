    ,\n  \"docs/202312/20231219_03.md\": \"# 不妨挣快钱，不妨短期主义  > 原文：[`www.yuque.com/for_lazy/thfiu8/gy18coplyt8fd97f`](https://www.yuque.com/for_lazy/thfiu8/gy18coplyt8fd97f)\
    \  ## (88 赞)不妨挣快钱，不妨短期主义  作者： 小马宋  日期：2023-12-11  不妨挣快钱，不妨短期主义  周末听小宇宙播客《面基》的最新一期，是主持人跟嘉宾杨天楠的对话。\
    \  其中谈到长期主义的时候，很有同感。从我个人角度来说，我今天偏向长期主义，但我其实并不反对短期。  因为每个人都不同，每个事都不一样。  比如说到自媒体这件事。我经历过论坛，博客，豆瓣，开心，微博，公号，短视频这么多平台，会很清楚地知道，每个平台的红利期并不长。\
    \  而且从事实上看，很少有人能穿越平台持续网红。  当你知道自己只能红几年的时候，你最理性的选择是什么？就是尽快把钱都挣了。  有些职业，有些事业，注定了就是短期的，就是青春饭，比如篮球的职业运动员，35\
    \ 岁以后就很难再打球了，那最佳选择就是把能够挣到的钱就先挣到。  当然人对宏观环境的判断\",\n  \"docs/202312/20231219_04.md\"\
