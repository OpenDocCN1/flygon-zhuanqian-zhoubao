  content: "{\n  \"paper\": \"20231212_06_人性商业学\",\n  \"desc\": \"该素材由小马宋提出'顺着人性做生意，逆着人性修自己'这一商业与个人成长的双轨框架，指出知识付费的实质是贩卖'成功幻觉'而非真实成功，并结合人性贪多求快、追求简单捷径、及时满足、爱炫耀与怕失去等心理特点，主张在商业设计上顺应人性、在个人修炼上对抗人性，两条路径互补方能持续成长。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"成功幻觉\",\n      \"desc\": \"指知识付费产品的核心并非真正教人成功，而是通过迎合人性弱点制造'我即将成功'的错觉，因为真实成功是逆人性的、难以实现的。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"知识付费的主流不是叫你成功，而是建立你会成功的幻觉（仅限商业领域）。因为教人成功太难了，是逆人性的，因为人只想发财，却不想付出太多。让人觉得自己能成功，是很容易的，因为人人都想发财。\"\
    \n      ]\n    },\n    {\n      \"name\": \"人性心理特点\",\n      \"desc\": \"素材归纳出贪多求快、幻想一招致胜、追求及时满足、爱炫耀与怕失去等关键心理特征，作为商业设计与营销的着力点。\"\
    ,\n      \"is_original\": false,\n      \"excerpt\": [\n        \"人性贪多求快，又特别喜欢简单的成功法门，幻想一招致胜。人性喜欢确定性，愿意为延迟满足付出，但更多人想要及时满足。\"\
    ,\n        \"顺着人性去做生意：抓住人贪多求快、想要捷径、追求及时满足、爱炫耀、怕失去等心理特点设计产品和营销。\"\n      ]\n  \
    \  },\n    {\n      \"name\": \"顺逆双轨路径\",\n      \"desc\": \"指商业上顺应人性与个人成长上逆反人性两条互补路径，二者结合方能既做好生意又持续成长。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"生意上的顺势而为与个人成长上的逆势而为是两条互补路径：懂人性才能做好生意，逆人性才能持续成长。\"\
    \n      ]\n    }\n  ],\n  \"methods\": [\n    {\n      \"name\": \"__overview__\"\
    ,\n      \"desc\": \"整体方法论为'商业顺人性 + 成长逆人性'的双轨策略：在产品与营销设计中主动利用人性弱点（贪多求快、走捷径、及时满足、炫耀、怕失去），同时在个人修炼上反其道而行（专注、自律、延迟满足、长期坚持）。\"\
    ,\n      \"excerpt\": [\n        \"顺着人性去做生意：抓住人贪多求快、想要捷径、追求及时满足、爱炫耀、怕失去等心理特点设计产品和营销。\"\
    ,\n        \"逆着人性修自己：专注、自律、延迟满足、长期坚持。\",\n        \"生意上的顺势而为与个人成长上的逆势而为是两条互补路径：懂人性才能做好生意，逆人性才能持续成长。\"\
    \n      ]\n    }\n  ],\n  \"theorems\": [\n    {\n      \"name\": \"成功幻觉定理\",\n\
    \      \"desc\": \"知识付费商业模式的本质是建立'你会成功'的幻觉而非传授真实成功，因为教人成功逆人性而制造幻觉顺人性。\",\n   \
    \   \"excerpt\": [\n        \"知识付费的主流不是叫你成功，而是建立你会成功的幻觉（仅限商业领域）。因为教人成功太难了，是逆人性的，因为人只想发财，却不想付出太多。\"\
    \n      ]\n    },\n    {\n      \"name\": \"顺逆互补定理\",\n      \"desc\": \"顺应人性利于商业经营，逆反人性利于个人成长，二者互补缺一不可：外顺人性以成事，内逆人性以修身。\"\
    ,\n      \"excerpt\": [\n        \"生意上的顺势而为与个人成长上的逆势而为是两条互补路径：懂人性才能做好生意，逆人性才能持续成长。\"\
    \n      ]\n    }\n  ],\n  \"findings\": [\n    {\n      \"name\": \"人性激励偏好发现\"\
    ,\n      \"desc\": \"[claim] 素材宣称多数人偏好及时满足而只有少数人愿意为延迟满足付出，这一人性倾向是商业顺应与个人逆行的分野所在。\"\
    ,\n      \"excerpt\": [\n        \"人性喜欢确定性，愿意为延迟满足付出，但更多人想要及时满足。\"\n      ]\n\
    \    },\n    {\n      \"name\": \"商业与成长路径划分\",\n      \"desc\": \"[claim] 素材断言商业上应当顺应人性设计，个人成长上则须逆人性自律坚持，两类行动方向相反却相互补充。\"\
    ,\n      \"excerpt\": [\n        \"顺着人性去做生意：抓住人贪多求快、想要捷径、追求及时满足、爱炫耀、怕失去等心理特点设计产品和营销。\"\
    ,\n        \"逆着人性修自己：专注、自律、延迟满足、长期坚持。\"\n      ]\n    }\n  ]\n}"
