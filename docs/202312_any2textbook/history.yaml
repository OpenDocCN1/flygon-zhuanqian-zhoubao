        |\n| 可持续扩写空间 | 4/5 | 可支撑半本书骨架，需补写约40% |\n| **总分** | **27/35** | **potential（潜在可行）**
        |\n\n## 核心命题\n普通人如何顺应人性做商业、逆着人性修自己，在AI时代通过内容与项目实现个体商业化。\n\n## 目标读者与痛点\n- 目标读者：准备或刚开始做副业/个人IP的新手，及小成本个体创业者（年营收目标10-150万区间）\n-
        读者问题：面对海量项目信息不知如何筛选，缺乏从0到1构建变现体系的方法，对\"流量-选品-产品-变现\"链路缺乏系统认知\n\n## 差异化\n市面上同类书多讲流量技巧，本书以\"人性规律\"为底层视角、\"先流量再选品\"为独特方法论，辅以150万/100万真实变现案例，兼具哲理深度与实操颗粒度。\n\n##
        本书结构逻辑（\"道法术势\"四层递进）\n1. 先立\"顺人性做生意\"的认知总纲\n2. 再讲项目/产品/流量/变现四大技法模块\n3. 用两个全链路案例做实证验证\n4.
        最后补风险与AI时代进阶路径\n\n## 目录草案\n1. 第1章 认知觉醒：为什么懂很多道理依然过不好一生\n2. 第2章 人性商业学：顺着人性做生意，逆着人性修自己\n3.
        第3章 项目筛金术：新人如何判断一个项目能不能做\n4. 第4章 产品价值论：什么产品好做——先发、唯一、第一\n5. 第5章 流量实操：如何做出高效的带货图文\n6.
        第6章 变现体系：定位四问与低转高模型\n7. 第7章 案例实证：小赛道知识付费从0到150万\n8. 第8章 案例实证：做个人IP第一年赚100万\n9.
        第9章 风险护栏：常见坑、法律边界与项目死因\n10. 第10章 AI时代：超级个体的指数成长路径\n\n## 素材处理\n### 保留（to_retain）\n-
        《他活了99岁，人生正确率几乎100%》《顺着人性做生意逆着人性修自己》《新人如何判断一个项目能不能做》《什么产品好做？三个一》《AI时代超级个体的成长路径》《在抖音帮工厂招焊工》《小赛道知识付费从0到150万》《做个人IP第一年赚100万》《如何做出高效的带货图文》\n\n###
