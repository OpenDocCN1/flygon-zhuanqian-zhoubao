screening_principles: 一、保留核心命题与高价值内容：凡能提炼出独立、稳定的判断或观点，且可发展为章节、书籍或课程的素材优先保留；二、降权框架有效但内容单薄者：有框架价值但正文仅为摘要或过度依赖外链、需要重写后补充细节的素材，降为案例或附录；三、排除无独立信息价值或高风险内容：正文无实质内容、核心观点依赖外链、依赖特定时效规则漏洞且存在法律道德风险的素材一律排除，以避免稀释主线并确保内容合规。
