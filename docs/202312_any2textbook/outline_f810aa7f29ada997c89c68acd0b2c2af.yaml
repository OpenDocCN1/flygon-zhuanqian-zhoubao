- 'no': 1
  name: 主动求助的艺术 —— 让贵人“看见”你
  desc: 本章从“贵人相助”这一人际杠杆出发，拆解如何用系统性方法将偶然的机遇转化为必然的进阶。通过具体方法论与底层逻辑的双重讲解，帮助你建立起“值得被帮助”的个人品牌。
  nodes:
  - 'no': 1
    name: 贵人是什么 —— 人生电梯的按钮
    desc: 用“电梯”类比理解：贵人不是替你爬楼的人，而是帮你按下直达按钮的那个人。概念上厘清贵人的本质与边界，避免把求助误解为依附。
    role: motivation
    src:
    - paper: 20231205_05_贵人求助
  - 'no': 2
    name: 什么叫“值得帮” —— 价值交换的底层逻辑
    desc: 提出核心定义：求助的本质不是索取，而是构建一种对等交换关系。你展现的价值决定你吸引贵人的层级，这是全书方法论的基石。
    role: definition
    src:
    - paper: 20231205_05_贵人求助
  - 'no': 3
    name: 六步求助法 —— 从“开口”到“闭环”
    desc: 给出可复制的行动框架：真诚礼貌、展现价值、具体化问题、给予回馈、积极跟进、提供情绪价值。每一步都配有针对性的操作说明与注意事项。
    role: method
    src:
    - paper: 20231205_05_贵人求助
  - 'no': 4
    name: 贵人不是等来的 —— 主动性的必然性
    desc: 通过论证“贵人支持非靠运气”这一命题，揭示所有看似偶然的提携背后都有主动设计的痕迹。这一结论将前三个知识点串联为整体，并引出个人主动性的核心地位。
    role: proof
    src:
    - paper: 20231205_05_贵人求助
  - 'no': 5
    name: “苦劳”陷阱 —— 为什么努力不等于被看见
    desc: 反思性讨论：仅仅埋头苦干而不懂价值呈现与主动沟通，往往会被埋没。这一局限提醒读者在应用六步法时要避免陷入自我感动的误区。
    role: limitation
    src:
    - paper: 20231205_03_芒格人生智慧
- 'no': 2
  name: 知行合一 —— 把道理变成“肌肉记忆”
  desc: 本章承接前章的求助方法论，指出所有方法论的最终归宿是执行。以芒格的哲学为纲，讲解为何“知道”与“做到”之间的鸿沟才是决定人生高度的分水岭，为全书收束出行动纲领。
  nodes:
  - 'no': 1
    name: 为什么懂那么多道理还是不够 —— 从“知”到“行”的断裂
    desc: 以“知道很多道理却过不好一生”的普遍困惑切入，揭示大多数人的真正问题不在于认知不足，而在于知道与执行之间的断裂。为引入芒格哲学制造动机。
    role: motivation
    src:
    - paper: 20231205_03_芒格人生智慧
  - 'no': 2
    name: 知行合一 —— 芒格哲学的终极定义
    desc: 严格定义芒格意义上的知行合一：知晓正确道理后绝对严格地遵循执行。区别于空谈“知道”，强调行为层面的绝对刚性，是本书核心概念的落脚点。
    role: definition
    src:
    - paper: 20231205_03_芒格人生智慧
  - 'no': 3
    name: 把“六步法”锻造成习惯 —— 知行合一的具体应用
    desc: 示范如何将第一章的价值交换方法论纳入知行合一的执行框架：不是“知道”六步法，而是像芒格那样在每一次求助中严格落地。实现方法论的升维。
    role: extension
    src:
    - paper: 20231205_05_贵人求助
    - paper: 20231205_03_芒格人生智慧
  - 'no': 4
    name: 从“知道”到“做到”的毕业礼
    desc: 收束全书：以芒格的知行合一作为最终检验标准——任何方法、任何道理，唯有化为日复一日的行动才真正属于你。这是本书希望留下的最后一个钩子。
    role: experiment
    src:
    - paper: 20231205_03_芒格人生智慧
