paper: 20231205_03_芒格人生智慧
desc: 该素材以芒格的人生与投资哲学为对象，提炼出其核心观点：成功不在于知道多少复杂道理，而在能否将简单正确的道理严格践行，做到知行合一。素材通过芒格的几个关键人生与投资案例（如纠正巴菲特'捡烟蒂'式投资、投资比亚迪、读50年《巴伦周刊》只为一个机会）以及他的处世原则（常识判断、高道德要求、无敌耐心、极尊重理性），说明知行合一与严格践行简单正确道理的重要性。
concepts:
- name: 捡烟蒂式投资
  desc: 巴菲特早年采用的、芒格所纠正的一种低质投资方式，即买入价格极低但价值有限的企业股票，如同在烟蒂中寻找可吸的最后一口。该概念在素材中作为被否定的旧范式出现，用以衬托芒格'关注真正有价值的企业并长期持有'的新主张。
  is_original: false
  excerpt:
  - 芒格纠正了巴菲特过去'捡烟蒂'式的投资方式，让他关注真正有价值的企业并长期持有。
- name: 常识
  desc: 芒格用以判断问题的基础原则，指那些看似简单却常被人违背的、基于真实世界规律的知识。芒格认为'所谓常识，通常就是别人不知道的知识'，并用'在有鱼的地方钓鱼'这一类比说明其本质。该概念是素材对芒格思维方式的原创性提炼，体现了'简单道理'在素材语境中的核心地位。
  is_original: true
  excerpt:
  - 芒格讲的内容难能可贵，他讲那些很简单的道理。名言：'钓鱼有两个重要原则，第一是要在有鱼的地方钓鱼，第二是不要忘记第一条原则。'
  - 芒格以常识判断问题，但'所谓常识，通常就是别人不知道的知识'。
- name: 知行合一
  desc: 芒格哲学的核心概念，强调知晓正确道理后必须严格遵循并执行。素材指出'学了很多道理依然过不好一生'的根源在于未按这些绝对正确的道理去做事，而芒格之所以人生正确率几乎100%，正因为他是一个'讲普通道理，绝对严格去做的人'。此概念是素材对芒格成功秘诀的原创性概括。
  is_original: true
  excerpt:
  - 核心观点：成功不在于知道多少复杂道理，而在能否将简单正确道理严格践行，做到知行合一。
  - 芒格是一个讲普通道理，绝对严格去做的人。
methods:
- name: __overview__
  desc: 素材整体的方法论结构：通过芒格的人生叙事（早年经历、纠正巴菲特、投资比亚迪）引出其处世原则（常识、道德、耐心、理性），再以多个具体案例（读《巴伦周刊》50年、提高售价去行贿等）佐证这些原则，最终归结为'知行合一'的核心主张。该方法论体现了一种'案例驱动、由事及理'的传记式说理路径。
  excerpt:
  - 芒格是比巴菲特大6岁，早年做气象观察员，后来是洛杉矶地区最受欢迎的律师之一。芒格纠正了巴菲特过去'捡烟蒂'式的投资方式，让他关注真正有价值的企业并长期持有。2008年芒格介绍下巴菲特投资比亚迪，赚到600亿人民币回报。
  - 芒格的核心观点：成功不在于知道多少复杂道理，而在能否将简单正确道理严格践行，做到知行合一。
- name: 案例佐证法
  desc: 作者采用的具体叙述方法：以芒格生命中的多个关键决策与长期行为作为证据，支撑对其人生哲学的概括。该方法通过具体的时间跨度（如50年读《巴伦周刊》）与金额（如赚8000万美元、600亿人民币回报）来增强说服力，使抽象的'耐心''常识'等原则获得经验支撑。
  excerpt:
  - 读《巴伦周刊》读了50年，只找到了一个投资机会，通过这个机会赚了8000万美元。
  - 2008年芒格介绍下巴菲特投资比亚迪，赚到600亿人民币回报。
theorems:
- name: 钓鱼第一原则
  desc: 核心主张：做事的根本原则是选择正确的方向与场所——'在有鱼的地方钓鱼'，同时不能忘记这个第一原则。该主张以钓鱼类比投资与经营：菜好吃顾客才会来，然而很多人违背这个简单的经营原则。其要旨在于：正确的前提条件决定结果的成败。
  excerpt:
  - 名言：'钓鱼有两个重要原则，第一是要在有鱼的地方钓鱼，第二是不要忘记第一条原则。'菜好吃顾客才会来，这个道理很简单，可很多人就一定要违背这种经营原则。
- name: 少而精的决策观
  desc: 核心主张：我们一生获得的大部分财富，本质上取决于极少数几个关键决策，其余时间都应当用于等待真正时机出现，而非频繁行动。芒格以50年读《巴伦周刊》只找到一个机会作为例证，强调'无敌的耐心'与克制出手的价值。
  excerpt:
  - 本质上，我们一生获得的大部分财富，取决于很少的几个决策，其余时间都是在等待机会。
  - 读《巴伦周刊》读了50年，只找到了一个投资机会，通过这个机会赚了8000万美元。耐心等待，真正时机出现才出手。
- name: 理性至上与道德约束
  desc: 核心主张：投资与决策应以理性为依据，不以个人情绪和好恶判断标的（大多数失败的投资是意气用事）；同时，须坚守高道德要求，'宁愿亏自己，不愿亏他人'，永远对世界抱有善意。这一主张将理性与道德并置，作为个体决策的双重基石。
  excerpt:
  - 芒格极尊重理性，不以个人情绪和好恶判断投资标的。大多数失败的投资是意气用事。
  - 芒格有很高的道德要求，宁愿亏自己，不愿亏他人，永远对世界抱有善意。他对真实世界认识清醒，能说出'提高售价，然后用能获得的高利润去行贿'这样洞明世事的话。
findings:
- name: 知行合一的实践有效性
  desc: '[claim] 素材宣称：严格遵循简单正确道理比掌握复杂道理更能带来人生成功，关键在于''做''而非''知''。这一结论是素材的核心主张，由芒格''活了99岁，人生正确率几乎100%''的人生概括所支撑。'
  excerpt:
  - 芒格是一个讲普通道理，绝对严格去做的人。他活了99岁，人生正确率几乎100%。
  - 学了很多道理依然过不好一生，因为没按照这些绝对正确的道理去做事。
- name: 长期耐心与单一机会的回报
  desc: '[evidence] 素材以数据事例支撑：芒格读《巴伦周刊》50年仅发现一个投资机会，该项投资赚得8000万美元；此外，2008年芒格介绍巴菲特投资比亚迪，获得600亿人民币回报。这些案例共同佐证了''少而精决策
    + 长期耐心''的实践价值。'
  excerpt:
  - 读《巴伦周刊》读了50年，只找到了一个投资机会，通过这个机会赚了8000万美元。
  - 2008年芒格介绍下巴菲特投资比亚迪，赚到600亿人民币回报。
