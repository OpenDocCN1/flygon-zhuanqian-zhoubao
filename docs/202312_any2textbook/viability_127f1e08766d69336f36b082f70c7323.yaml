- 将抖音图文、焊工招聘等案例升级为'方法论的场景化验证'，弱化具体平台与时间点，提炼可迁移的通用逻辑。
- 规划补写计划：新增'常见的坑与风险'章节，并扩展每个案例的决策细节、数据与复盘，增加血肉感。
