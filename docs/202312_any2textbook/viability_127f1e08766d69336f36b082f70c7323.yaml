- name: 时效风险
  score: 3
  evidence: 人性、商业本质内容常青，但'抖音图文带货''AI工具应用'等部分依赖当前平台与工具生态，存在时效淘汰风险，需弱化版本依赖。
- name: 可持续扩写空间
  score: 4
  evidence: 9篇保留素材可支撑'入门-选品-创作-变现-成长'约半本书的骨架，但需补齐更多案例细节与章节间过渡内容（约补写40%）。
