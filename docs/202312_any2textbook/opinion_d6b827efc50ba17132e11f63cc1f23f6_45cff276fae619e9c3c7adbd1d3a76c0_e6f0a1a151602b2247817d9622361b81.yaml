best_shape: book
book_worthiness: worth
conclusion_type: ready
one_line_judgment: 这套素材具备完整认知-方法-案例体系，可直接孵化为一本面向个体创业者的高区分度商业实践书，但需补写约40%深化内容。
recommended_shape: book
shape_reason: 素材已形成'人性商业认知→项目/产品筛选→IP变现实操'的递进闭环，9篇高价值内容（4-5分深度）可支撑章节骨架，具备成书所需的认知密度与案例厚度。
not_recommended_shapes:
- series
- kb
- course
not_recommended_reasons:
- 主题形成母题化递进结构，拆成系列会破坏整体论证力量
- 知识库形态会稀释'顺人性做生意'的核心命题聚焦优势
- 纯课程形态无法承载已有的人物哲理与人性洞察类深度内容
if_force_book_need: 需补充方法论通用框架、章节间过渡逻辑、AI成长路径纵深论述、常见坑与风险规避、读者行动清单等5类内容
core_proposition: 普通人如何顺应人性做商业、逆着人性修自己，在AI时代通过内容与项目实现个体商业化
target_reader: 准备或刚开始做副业/个人IP的新手，及小成本个体创业者（年营收目标10-150万区间）
reader_problem: 面对海量项目信息不知如何筛选，缺乏从0到1构建变现体系的方法，对'流量-选品-产品-变现'链路缺乏系统认知
differentiation: 市面上同类书多讲流量技巧，本书以'人性规律'为底层视角、'先流量再选品'为独特方法论，辅以150万/100万真实变现案例，兼具哲理深度与实操颗粒度
recommended_title: 顺着人性赚钱
subtitle: 普通人的AI时代个体商业化实战手册
alt_title_1: 逆着人性成长：个体创业者的商业实践指南
alt_title_2: 人性商业学：从小白到年入百万的实操路径
shape_description: 单本约12万字商业实践指南，结构为'心法（认知）-技法（方法）-实证（案例）-护法（风险规避）'的完整闭环体系
structure_logic: 以'道法术势'四层递进：先立'顺人性做生意'的认知总纲，再讲项目/产品/流量/变现四大技法模块，用两个全链路案例做实证验证，最后补风险与AI时代进阶路径
toc_draft:
- 第1章 认知觉醒：为什么懂很多道理依然过不好一生
- 第2章 人性商业学：顺着人性做生意，逆着人性修自己
- 第3章 项目筛金术：新人如何判断一个项目能不能做
- 第4章 产品价值论：什么产品好做——先发、唯一、第一
- 第5章 流量实操：如何做出高效的带货图文
- 第6章 变现体系：定位四问与低转高模型
- 第7章 案例实证：小赛道知识付费从0到150万
- 第8章 案例实证：做个人IP第一年赚100万
- 第9章 风险护栏：常见坑、法律边界与项目死因
- 第10章 AI时代：超级个体的指数成长路径
to_retain:
- 《他活了99岁，人生正确率几乎100%》作为开篇哲理钩子
- 《顺着人性做生意逆着人性修自己》作为核心命题章节
- 《新人如何判断一个项目能不能做》作为方法论章节
- 《什么产品好做？三个一》作为产品标准章节
- 《AI时代超级个体的成长路径》作为进阶章节
- 《在抖音帮工厂招焊工》《小赛道知识付费从0到150万》《做个人IP第一年赚100万》作为案例章节
- 《如何做出高效的带货图文》作为流量方法论章节
to_delete:
- 《如何找到商机并快速赚到钱》（仅外链无独立内容）
- 《手把手教你空手套白狼》（法律风险）
to_merge_rewrite:
- 《自媒体新人如何利用阅读写作基本盘》降为手册附录条目，内容单薄需合并进其他章节
to_supplement:
- 方法论通用框架（如项目筛选五步法的通用化表达）
- 章节间过渡与全书逻辑串联段落
- AI时代成长路径的纵深论述（当前仅框架性提出）
- 常见坑与风险规避专章（综合多篇散点内容）
- 每章结尾行动清单与自检问题
- 系统性变现路径对比（对标多个案例形成方法树）
retain_principles: 保留具备方法论或哲理深度的高价值内容（深度≥medium），降权单薄框架内容，排除无独立价值与法律风险内容，并将散点素材按认知-方法-案例-进阶四层归位
steps:
- 第一步：3天内凝练核心命题为主标语'顺着人性赚钱'，向作者确认全书写法视角（第一人称实操 vs 第三人称案例）
- 第二步：1周内完成全书大纲细化，明确每章字数为8000-12000字，标注已有素材（约60%）与需补写内容（约40%）
- 第三步：2周内先完成案例章节（素材最充分）与核心方法论章节，再补写过渡与护法章节，形成12万字初稿
risks:
- 平台工具细节时效风险较高，需在书中强调底层逻辑而非具体操作参数
- 作者可能面临'既要哲理深度又要实操颗粒度'的读者预期冲突，需明确读者定位
- 人性主题与商业实操结合需避免说教感，保持案例代入式写作
next_product: 结构细化的章节大纲（含字数分配、已有素材映射表、补写清单、写作顺序建议）
default_output_file: 全书初稿.md
writing_approach: 案例驱动写法：每章先抛核心问题→精讲方法论→用真实案例验证→实操清单收尾，方法论与案例交替呈现避免干瘪
will_split: false
