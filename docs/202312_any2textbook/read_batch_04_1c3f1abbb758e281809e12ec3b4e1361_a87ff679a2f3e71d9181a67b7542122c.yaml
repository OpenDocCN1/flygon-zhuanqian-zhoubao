- file_path: docs/202312/20231205_16.md
  title: 创业前期得了抑郁症，我是如何自我救赎的？
  summary: 作者以亲身经历讲述在互联网个人创业前期因高压、自我逼迫患上轻度抑郁，并通过规律运动（跑步+鸡汤）、规划债务获得一年半的试错缓冲期、以及躬身入局接受慢反馈这三个具体决策完成自我救赎的过程。
  core_question: 个人创业者在高压、无正反馈的初期阶段，如何通过具体可执行的行动策略走出抑郁和自我怀疑的情绪困境？
  key_judgment: 创业初期抑郁的核心诱因是过度的自我逼迫和缺乏反馈，解决之道不是单纯心态调节，而是通过降低生存压力（财务规划）、身体释放（运动）和调整行动节奏（接受慢反馈）来重构一个可持续的创业启动状态。
  depth: medium
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 时效性
  - 口语化
  - 格式预处理
  screening_conclusion: retain
  reason: 提供了一个罕见的、真实的一手创业心理危机案例，其给出的'财务缓冲+身体调节+行动节奏'结构化自救框架具有普遍借鉴价值，适合作为创业者心理建设或心态管理主题下的核心章节。但需注意内容是基于个人经验，需防范鸡汤化和经验主义风险，并可能通过引证专业心理学内容增强深度。
- file_path: docs/202312/20231205_51.md
  title: 自媒体新人，如何利用阅读写作基本盘，撬动百万收益
  summary: 作者理白（医生+自媒体人）针对自媒体新人入局时的信息过载和焦虑，提出基于写作、阅读、人生三个基本盘（各含加法/减法/乘法、深度/广度/迁移、圈子/品牌/稳态三个要素）的框架。全文详尽内容存于飞书文档链接，开篇仅为摘要和引言。
  core_question: 自媒体新人如何在信息过载和焦虑中，通过构建写作、阅读、人生三个层面的基本盘能力来有序发展并获得收益？
  key_judgment: 新人在纷繁复杂的自媒体赛道中，关键不在于追逐碎片化技巧，而在于系统性地构建写作（做加法尝试、减法聚焦、乘法放大）、阅读（提升深度、广度、迁移能力）和人生（提升圈子、品牌、稳态认知）三个基本盘，以此作为长期增长的底座。
  depth: low
  suggested_destination: handbook_entry
  possible_shape: handbook
  risks:
  - 重复
  - 格式预处理
  - 其他（内容不完整，仅提纲）
  screening_conclusion: demote
  reason: 提出的'三个基本盘+九要素'框架具有系统性价值，但当前素材仅为摘要和目录链接，核心内容未能直接进库，导致可用深度不足。建议按降级处理，保留该框架标题作为全书章节的导引或基础框架模板，若需要深入内容则需链接记录原文。同时，该框架与'个人IP打造'等常见主题有一定重复。
- file_path: docs/202312/20231212_17.md
  title: 一个没有任何背景没有资源的小老板，是如何在90%创业失败率中活下来
  summary: 作者阿may以草根创业者身份，在创业6周年之际，系统总结了其在无背景无资源的条件下于高失败率中存活的心得，以及创业过程中踩过的变现、股权、战略选择、财富增长等各类坑。文章详细内容存于飞书文档链接，开篇为摘要和引言。
  core_question: 一个没有任何背景和资源的草根创业者，如何在高达90%的创业失败率中生存下来，并规避常见的变现、股权和战略陷阱？
  key_judgment: 草根创业者的生存之道在于向内求，基于'我喜欢、我擅长、很美好'的原则去选择和深耕；并需要主动学习或规避创业中常见的变现、股权等具体陷阱，以经验换存活率。
  depth: low
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 格式预处理
  - 其他（核心内容在外部链接，存续不确定）
  screening_conclusion: demote
  reason: 作者作为11篇精华帖的作者，其关于创业避坑的系统性总结具有高潜在价值，但当前入库文本仅为摘要和引言，真正的核心'创业避坑心得'未收录。大量干货取决于外部链接，存在内容不完整和链接失效风险。因此降级处理，作为可能的主题来源进行标记，后续需收集完整版本再评估。
- file_path: docs/202312/20231219_14.md
  title: 进入生财1个月，我是怎样被割韭菜的
  summary: 一位进入生财社群一个月的新手小白，因选择了一个不负责任的声音克隆服务商，被割了599元。文章详细记录了他被骗的经过和维权失败的遭遇，并提醒社群成员（尤其是新人）警惕常见割韭菜套路，捂紧钱包。
  core_question: 在知识付费社群中，新人小白如何识别并避免被不靠谱的服务商和'割韭菜'项目欺骗？
  key_judgment: 在当前社群生态中，以项目分享名义进行引流的帖子里，大部分都带有付费教学的目的。新人需要对任何可能涉及交易的推荐保持警惕，捂紧钱包，同时要勇于合理维权。
  depth: low
  suggested_destination: case
  possible_shape: kb
  risks:
  - 时效性
  - 口语化
  - 重复
  - 其他（单一案例，结论发散）
  screening_conclusion: demote
  reason: 该素材是典型的社群内部避坑实录，讲诉了具体的一次骗局和维权过程。但其价值更多是警示性案例，而非系统性方法论。由于案例的细节（具体服务商、价格）时效性强，且内容偏口语化、单一叙事，不具备广泛的理论指导性。适合降级作为知识库中的风险警示案例或注释，而非全书的主要章节材料。
- file_path: docs/202312/20231226_24.md
  title: 做个人IP第一年，赚到100万利润，我的经验与心得
  summary: 作者云飞（包租公）详细复盘了自己从传统行业转型做个人IP，在无经验情况下从0到1，第一年赚取100万利润的全过程，内容涵盖起号定位、变现体系拆解、变现全流程、爆款视频方法论等十余条实操心得。
  core_question: 一个缺乏自媒体经验的小白，如何通过找准定位（个人IP）和一套有效的方法论，在一年内实现利润百万的从0到1的增长？
  key_judgment: 做个人IP的核心是找到'适合'自己的方向（而非仅追'趋势'），并以正确的变现体系（轻交付、流程化）和内容策略（视觉锤、大胆引流、持续日更）驱动增长；同时深刻领悟'专注度在哪里，钱就在哪里'。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 重复
  - 格式预处理
  screening_conclusion: retain
  reason: 这是一份极其详尽且高质量的一手实操复盘，不仅是经验罗列，还深度拆解了从定位、内容、变现到流程的完整闭环体系，如'先买后退'筛选客户、'多平台矩阵'策略、'视觉锤'运用等均具有很高的可迁移性和方法论价值。可作为'个人IP打造'主题下的核心章节或案例深度研究材料。
- file_path: docs/202312/20231226_33.md
  title: 一个素人做IP写小作文，108营销方法论
  summary: 作者领飞为新人小白提供了一套以'先拼数量，再保质量'为原则的内容营销破局方法论，核心是通过多账号、多平台矩阵、借助AI工具等进行批量内容生产，并提出了通过策划'108系列'主题（如108个XX案例）来做IP和实现变现的策略。
  core_question: 对于IP和专业能力处于弱势的素人小白，如何在内容极度内卷的平台环境中破局、获取流量并建立变现体系？
  key_judgment: 素人破局的关键在于'批量效应'：不要水滴石穿，要大雨倾盆。通过多账号、多平台矩阵博取概率，并通过模块化的'108方法论'（系列化内容、结构化输出）建立可持续的执行方向和变现钩子，最终实现农村包围城市的整合赢利。
  depth: medium
  suggested_destination: course_unit
  possible_shape: course
  risks:
  - 时效性
  - 重复
  - 口语化
  - 其他（观点有争议）
  screening_conclusion: retain
  reason: 内容聚焦于一个细分但硬核的策略——'批量生产+108系列'，这是市场上对'内容为王'论调的有效补充，对于切入'素人破局'或'内容生产策略'主题的章节具有实操指导意义。其关于矩阵、工具应用和模块化内容的观点非常具体，适合作为独立课程单元或运营手册章节。但需注意其'批量搬运'的思路可能存在商业道德和平台违规争议，引入时需要审慎看待。
