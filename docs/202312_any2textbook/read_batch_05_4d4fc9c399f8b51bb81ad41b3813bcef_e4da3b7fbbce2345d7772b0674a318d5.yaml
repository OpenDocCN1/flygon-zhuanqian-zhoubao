- file_path: docs/202312/20231205_23.md
  title: 如何做出高效的带货图文，只需 3 步，10 分钟就学会
  summary: 作者提出了一套与传统选品思路相反的带货图文制作方法：先找到自带流量的素材（如猎奇、反差内容），再嫁接产品，通过内容钩子（如剧情、焦虑）引导转化，并用鱼胶、床照、清肺、五指毛桃等案例拆解了具体操作和变现结果。
  core_question: 在图文带货中，如何通过内容策略而非产品策略脱颖而出，实现高效流量获取和转化？
  key_judgment: 核心洞察是‘先搞定流量，再去选品’：在物资过剩时代，流量比产品更稀缺，因此应反向操作，先在小红书等平台寻找异常、高赞的流量内容作为素材，再巧妙嫁接产品，而非先选品再做内容。内容自带流量是前提，转化靠构建用户心理钩子（如猎奇、焦虑、炫耀）。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 重复
  - 时效性
  - 格式预处理
  screening_conclusion: retain
  reason: 内容完整度高，包含清晰的3步方法论和4个详实案例（含具体数据如10w播放、3000+佣金），且提供了‘反向选品’这一区别于常规的独特视角，对图文带货领域有较强的可操作性指导，适合作为方法论章节的骨干素材。
- file_path: docs/202312/20231205_33.md
  title: 从月入 7k 到 7w，通过朋友圈美学我一手握技能，一手变现翻倍
  summary: 作者白羊分享了通过投资自己学习‘朋友圈美学’技能，从大厂月入7k的打工状态，转型为线上自由创业者并实现收入翻倍的个人经历。文末附有飞书链接和评论区资源对接信息。
  core_question: 普通人如何通过掌握一项‘朋友圈美学’类的细分技能，实现从打工到自由职业的收入跃迁？
  key_judgment: 全文核心是个人IP与技能变现的励志叙述，但关键观点被外链飞书文档承载。自身判断是：投资自己、掌握一项市场需要的细分美学技能（如朋友圈排版/视觉），是逃离打工困境、实现副业变现的有效路径，且‘朋友圈美学’是微信生态中可见的垂直需求。
  depth: low
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 格式预处理
  - 内容不完整
  - 口语化
  screening_conclusion: demote
  reason: 正文极度精简，核心的方法论和数据（如如何从7k到7w）很可能都在外部飞书链接中，当前素材仅剩故事框架和引流线索。其内容价值不完整，但案例类型（技能变现）仍可留作补充性案例或素材线索，故降级处理而非完全排除。
- file_path: docs/202312/20231205_59.md
  title: 小赛道知识付费，我如何从 0 到 150 万-年
  summary: 作者戴明以SaaS产品经理垂直赛道为例，完整复盘了个人IP从公众号起家、建立私域、推出知识星球（399/年）、再到开发高价训练营（3000元）的变现路径，并总结了关于定位、迭代、资源积累和平台化的思考。
  core_question: 在垂直‘小赛道’中，个体创业者如何从0到1建立IP并实现每年150万的知识付费收入？
  key_judgment: 核心价值在于‘小而美’的个体商业模式闭环：通过反复回答‘用户是谁、需求是什么、方案是什么、为何选我’的定位四问，打造IP；用‘轻量化产品（如知识星球）’降低启动门槛，以‘续费率’为北极星指标倒逼产品迭代；最后通过‘低转高’（训练营）提升客单价，并强调‘先完成再完美’的迭代心态和建立高管粉丝资源池的竞争力。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 重复
  screening_conclusion: retain
  reason: 该文是少见的从0到150万年收入的高完整度、结构化复盘。不仅覆盖了从IP定位、私域承接、产品设计到高价转化的全链路，还提供了具体数据（续费率从30%到50%）和失败经验（第一个训练营的教训），对搭建‘个体知识付费/IP变现’章节极富价值，且自带清晰的思考框架。
- file_path: docs/202312/20231212_52.md
  title: 教海外华人炒房，一门课带来 200W 的营收
  summary: 作者生哥复盘了面向海外华人（北美为主）售卖美国房地产投资课程的完整商业模式，从选品策略（聚焦土地投资、折扣房源等细分）、课程包装（生造‘TSI’新词）、到YouTube广告获客（ROI
    3.0）、自动化‘假直播’销售漏斗（转化率3-5%），直至二次转化（邮件营销、打包销售、3万美元1对1教练）。
  core_question: 如何面向海外华人小众市场，通过YouTube广告和自动化销售体系，将知识付费课程做到600万美金的营收规模？
  key_judgment: 核心观点是：海外虚拟产品有信息差红利，垂直细分比‘高大上’内容更有付费价值（房地产销售课卖$1000 vs 普通销售课$200）；产品设计要营造独特性（生造名词防比价）和强结果导向（如‘现金流系统’）；获客不靠内容靠广告，且通过‘预录假直播+漏斗自动化’极大降低人力并标准化销售，是一套可复制的系统化打法。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 重复
  screening_conclusion: retain
  reason: 极其详尽的海外知识付费落地手册，不仅给出结论，还附有具体的转化路径选择、21条直播卖课规则、邮件营销分层逻辑和定价策略。虽然‘YouTube假直播’手法在国内有合规风险，但其产品包装、价值感知、销售漏斗设计对任何知识付费场景有普适借鉴意义，适合作为高价值案例章的核心素材。
- file_path: docs/202312/20231212_56.md
  title: 借数字人的东风，小众需求十天变现上万
  summary: 作者beartao分享了自己深耕‘AI声音克隆’和‘AI美女图片’两个小众方向，在数字人爆火的10月份，通过对接大客户（借数字人东风），在十天左右实现了声音克隆项目变现上万元，并提供了飞书直播文档和RVC（实时声音克隆）模型训练教程链接。
  core_question: 普通人如何抓住‘数字人’等技术风口，将AI声音克隆的小众技术需求快速变现？
  key_judgment: 核心判断是‘借东风’：技术本身（声音克隆）是小众需求，但在数字人爆火的大势下，底层的声音需求暴涨。文本判断是：深耕技术细节（附RVC教程），并在风口来临时迅速对接大客户，即可实现短期利润突破（10天变现上万）。这是典型的踩中‘时代红利’的微型案例。
  depth: medium
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 格式预处理
  - 内容不完整
  screening_conclusion: demote
  reason: 素材正文提供了明确的变现路径（借数字人东风+AI声音克隆）和结果验证，但核心操作细节全部外链至飞书文档。作为独立章节素材过窄，更契合‘风口/红利变现’类的案例补充，因其时效性强且依赖工具，适合作为短线案例或知识库（kb_entry）收录。
- file_path: docs/202312/20231219_27.md
  title: 视频号变老特效玩法，电脑小白上手 3 天卖了 3w+ 附教程
  summary: 作者旋子分享了在视频号用AI‘变老特效’生成中老年短视频带货的玩法，声称即使是纯电脑小白的宝妈主播也能上手，3天卖出3万多，并承诺提供保姆级教程（保姆级教程链接被外置）。
  core_question: 视频号平台上利用‘变老特效’这类AI工具生成短视频，如何进行电商变现？
  key_judgment: 其核心价值在于强调‘低门槛’和‘红利期’：玩法简单（特效生成），不依赖剪辑技能，适合视频号当下的中老年用户流量红利。判断是：在平台红利期，先用偏门易懂的工具玩法（如变老特效）迅速获取流量并变现，边赚边积累经验，即使玩法过气也完成了资金和技能积累。
  depth: medium
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 时效性
  - 格式预处理
  - 口语化
  screening_conclusion: demote
  reason: 素材本身是引流帖性质，详细的保姆级教程存在外部文档中，导致当前文本只有玩法和结果的概述（‘矩阵化操作’、‘变现数据’均无详细拆解）。作为独立内容深度不足，但作为‘通过AI工具进入视频号变现’的可行性案例，可降级为案例库或知识库条目。
