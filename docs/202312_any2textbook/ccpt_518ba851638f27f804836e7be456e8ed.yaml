paper: 20231212_05_产品三个一
desc: 该素材提出了判断一款产品是否好做、好推的'三个一'标准（First One / Only One / Number One），主张产品的可做性与品类无关，而取决于其是否具备'先发、唯一、第一'三个特性中的至少一个，并由此建立爆发性流量与护城河。
concepts:
- name: First One（先发）
  desc: 指产品在时间上第一个推出，在十倍速变化的领域具有先发优势，往往获得井喷式的启动流量。
  is_original: true
  excerpt:
  - First One：是指这个产品在时间上是第一个推出的。在十倍速变化的领域，这样的产品有先发优势，往往会获得井喷一样的启动流量。
- name: Only One（唯一）
  desc: 指产品在一个时间窗口内是某个特定问题唯一的解决方案，用户没有其他选择，只能选它，形成独家竞争优势。
  is_original: true
  excerpt:
  - Only One：是指这个产品在一个时间窗口内是某个特定问题唯一的解决方案。用户没有其他选择，只能选它，形成独家竞争优势。
- name: Number One（第一）
  desc: 指产品在一个品类里做到第一名，成为品类第一就能获得最大的流量、信任和议价权。
  is_original: true
  excerpt:
  - Number One：是指这个产品在一个品类里做到第一名。成为品类第一，就能获得最大的流量、信任和议价权。
methods:
- name: __overview__
  desc: 一种以'三个一'（First One/Only One/Number One）为判据的产品可行性评估方法：在选品时不必纠结品类，而应考察产品是否具备至少一个'三个一'特性，以此判断它是否好做、好推。
  excerpt:
  - 好做的、好推的产品，有一些共同特征——它一定具备'三个一'特性中的至少一个：要么 First One，要么 Only One，要么 Number One。
theorems:
- name: 产品可做性与品类无关，取决于'三个一'特性
  desc: 核心主张：产品好不好做、好不好推，跟品类没有太大关系；其关键取决于是否具备'先发、唯一、第一'三个一特性中的至少一个，这是获得爆发性流量和建立护城河的核心。
  excerpt:
  - 产品好不好推、好不好做，跟品类没有太大关系。任何一个品类，都有少量好做好推的产品，和大量不好做不好推的产品。
  - 好做的、好推的产品，有一些共同特征——它一定具备'三个一'特性中的至少一个：要么 First One，要么 Only One，要么 Number One。
  - 核心观点：产品好不好做与品类无关，关键在于产品具备'先发、唯一、第一'三个一特性中的至少一个，这是获得爆发性流量和建立护城河的核心。
- name: 用户付费购买的是'问题被解决'的结果
  desc: 核心主张：用户付费买的不是产品本身，而是'我的问题被解决了'的结果。
  excerpt:
  - 用户付费买的不是产品本身，而是'我的问题被解决了'的结果。
findings:
- name: 选品问题常见误区
  desc: '[claim] 原文宣称：圈友提问''什么品类的产品比较好推''本身问错了方向，因为品类并非决定产品好做与否的因素。此为作者观点陈述，素材未提供统计或实验数据支撑。'
  excerpt:
  - 最近有生财有术的圈友问我：小排老师，什么品类的产品比较好推呢？其实，这个问题问错了。
- name: '''三个一''特性的利益结果'
  desc: '[claim] 原文宣称：具备''三个一''特性中的至少一个，将分别带来井喷式启动流量（First One）、独家竞争优势（Only One）、最大流量与信任及议价权（Number
    One），并共同构成护城河。此为观点性结论，素材未提供案例数据支撑。'
  excerpt:
  - First One：...往往会获得井喷一样的启动流量。
  - Only One：...形成独家竞争优势。
  - Number One：...就能获得最大的流量、信任和议价权。
