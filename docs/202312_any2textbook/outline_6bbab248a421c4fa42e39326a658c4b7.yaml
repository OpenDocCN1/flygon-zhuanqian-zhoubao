- 'no': 1
  name: 内容即流量 —— 从“选品思维”到“钩子思维”
  desc: 本章从流量稀缺性和用户心理两个维度，带你理解为什么在物质过剩时代，内容本身才是转化的第一生产力。
  nodes:
  - 'no': 1
    name: 流量稀缺优先论
    desc: 用“淘金热里卖铲子”类比：当产品供给过剩时，流量比产品更稀缺，先搞定流量再选品才能破局。
    role: motivation
    src:
    - paper: 20231205_23_带货图文方法论
  - 'no': 2
    name: 内容自带流量：转化之前先有注意力
    desc: 定义内容自带流量的属性：内容本身要能吸引眼球，否则后续转化无从谈起。这是“内容先于转化原则”的基石。
    role: definition
    src:
    - paper: 20231205_23_带货图文方法论
  - 'no': 3
    name: 三步带货图文制作法
    desc: 具体操作方法：先搜索自带流量的素材，再将产品无缝嫁接进去，最后用心理钩子驱动转化。
    role: method
    src:
    - paper: 20231205_23_带货图文方法论
  - 'no': 4
    name: 用户心理钩子：猎奇、焦虑与炫耀
    desc: 剖析驱动用户点击和购买的三种底层心理机制，理解钩子如何精准触发用户行动。
    role: method
    src:
    - paper: 20231205_23_带货图文方法论
  - 'no': 5
    name: 低门槛优势：为什么图文优于视频
    desc: 对比图文与视频的创作维度，揭示图文对新手更友好的原因，降低内容生产的心智负担。
    role: experiment
    src:
    - paper: 20231205_23_带货图文方法论
- 'no': 2
  name: 知识付费闭环 —— 从小而美到150万的商业飞轮
  desc: 本章拆解一个从0到150万的知识付费案例，带你掌握个体商业模式的四大支柱：定位、产品、指标、转化。
  nodes:
  - 'no': 1
    name: 定位四问：先回答“我是谁”
    desc: 用“人生说明书”类比：反复回答用户是谁、需求、方案、为何选我四个问题，才能打造出清晰的个人IP定位。
    role: motivation
    src:
    - paper: 20231205_59_知识付费150万
  - 'no': 2
    name: 轻量化产品：降低启动门槛
    desc: 定义轻量化产品：用低价低门槛的入门产品快速启动市场，验证需求的同时积累种子用户。
    role: definition
    src:
    - paper: 20231205_59_知识付费150万
  - 'no': 3
    name: 产品阶梯递进策略
    desc: 从低价入门到高价训练营的递进式设计，用“爬楼梯”类比说明如何逐步提升用户价值感与客单价。
    role: method
    src:
    - paper: 20231205_59_知识付费150万
  - 'no': 4
    name: 以续费率作为北极星指标
    desc: 证明续费率作为核心经营指标的价值：从30%到50%的提升，如何倒逼产品迭代与服务优化。
    role: experiment
    src:
    - paper: 20231205_59_知识付费150万
  - 'no': 5
    name: 低转高：从信任到高客单价的跨越
    desc: 解释低转高的销售逻辑：先通过低价产品建立信任，再向高价训练营转化，实现客单价跃升。
    role: method
    src:
    - paper: 20231205_59_知识付费150万
  - 'no': 6
    name: 小而美商业闭环：四大支柱的协同
    desc: 整合定位四问→轻量化产品→续费率迭代→低转高为完整闭环，揭示单体商业模式如何形成飞轮效应。
    role: limitation
    src:
    - paper: 20231205_59_知识付费150万
