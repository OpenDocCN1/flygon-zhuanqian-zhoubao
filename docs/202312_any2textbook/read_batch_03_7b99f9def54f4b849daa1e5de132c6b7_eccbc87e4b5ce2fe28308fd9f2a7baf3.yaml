- file_path: docs/202312/20231205_19.md
  title: 公众号爆文写作场景下如何使用 GPTs？
  summary: 作者 Dai 分享了利用 GPTs（定制版 ChatGPT）结合对标公众号历史文章知识库，进行公众号爆文批量生成的实操流程，包括数据导出、指令设定和内容生成三个核心步骤，并指出其效果和效率优于
    GPT4 微调。
  core_question: 如何利用 GPTs 的定制化和知识库功能，提升公众号爆文写作的效率与效果？
  key_judgment: GPTs 的价值不在于技术门槛，而在于将“高质量垂直领域知识库”与“一次性定制的任务指令”结合，从而在特定写作场景下取得比通用大模型更优的结果，且无需复杂的微调过程。
  depth: medium
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 口语化
  screening_conclusion: retain
  reason: 内容提供了清晰的GPTs在具体写作场景下的应用框架（数据-指令-生成），结构完整，观点明确，是AI写作工作流主题下的有效素材，但需注意平台功能迭代带来的时效性问题。
- file_path: docs/202312/20231205_20.md
  title: 收入 100 万+的 GPT 文章项目拆解及复盘
  summary: 作者星泽分享了一个年收入超100万的GPT代写文章项目的拆解与复盘，核心观点是项目本质是信息差和执行差，通过GPT降低写作打包成本，并以飞书链接形式详细讲解了项目潜力、持久性、操作方法和引流方式。
  core_question: 以GPT为核心工具的代写文章项目，其商业模式为何能带来高额收入？其操作流程和引流玩法是怎样的？
  key_judgment: 该项目的成功并非单纯依赖GPT技术，而是源于对特定客户群体（如学生）的“信息差”和对行动力的“执行差”的精准把握，揭示了AI工具在商业化服务中的本质应用逻辑。
  depth: low
  suggested_destination: case
  possible_shape: course
  risks:
  - 格式预处理
  - 重复
  - 时效性
  screening_conclusion: demote
  reason: 核心干货内容全部外链至飞书，原帖仅为摘要和营销铺垫，信息完整性不足。虽点明了项目本质，但缺乏具体方法论支撑，不宜作为核心章节，但可作为商业案例或课程引子保留。
- file_path: docs/202312/20231219_07.md
  title: 影刀 RPA+ChatGPT 教程，公众号爆文提效
  summary: 作者伟豪分享了通过影刀RPA结合ChatGPT实现公众号爆文的自动化批量写作，并通过飞书链接提供了保姆级教程，展示了从0基础到月入6万+的实操路径。
  core_question: 如何将影刀RPA视为自动化操作桥梁，与ChatGPT结合，实现公众号爆文的批量高效生产？
  key_judgment: AI写作提效的关键在于“流程自动化”与“内容生成”的结合。RPA解决了重复性操作问题（如素材整理、发布），ChatGPT解决内容生产问题，两者结合才能实现真正的批量化提效，而非单点优化。
  depth: low
  suggested_destination: course_unit
  possible_shape: course
  risks:
  - 格式预处理
  - 时效性
  screening_conclusion: retain
  reason: 尽管具体教程内容在飞书，但帖文明确提出了RPA+ChatGPT的自动化写作架构思路，这种工具组合在AI工作流主题下具有案例价值和学习要点，可作为课程中的工具链单元素材。
- file_path: docs/202312/20231212_25.md
  title: 稳扎稳打，视频号带货收益 100w+的打怪升级之路
  summary: 作者肖肖分享了自己从2022年7月入局视频号带货，从0起步做到300w+业绩、100w+收益的完整经历，复盘了从新手到航海教练的打法升级路径，并强调团队化是可持续发展的方向。
  core_question: 在视频号带货赛道，如何通过打法的不断升级和从0到1的坚持，实现百万以上的稳定收益？
  key_judgment: 视频号带货的成功是一个“打怪升级”的长期过程，核心在于持续迭代玩法（从短视频到直播）并深刻理解“超级个体是团队化的基石”，即先跑通单点，再谋求规模化。
  depth: medium
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  screening_conclusion: retain
  reason: 这是一篇典型的实战复盘长文，虽然核心细节外链，但帖内完整描述了项目的时间线、关键里程碑和核心认知（超级个体与团队关系），对视频号带货主题具有框架性指导意义，适合作为章节案例。
