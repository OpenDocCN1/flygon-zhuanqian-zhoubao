- 'no': 1
  name: 芒格人生智慧 —— 从“捡烟蒂”到“知行合一”
  desc: 本章以查理·芒格的人生哲学为核心，拆解其投资与决策背后的底层逻辑。我们将从“常识”出发，理解“少而精”的决策观，并探讨“知行合一”为何是普通人最难跨越的一道坎。
  nodes:
  - 'no': 1
    name: 常识：被忽略的“显学”
    desc: 用“在有鱼的地方钓鱼”类比切入：常识并非复杂理论，而是基于真实世界规律、却常被违背的简单道理。理解常识的本质是理解芒格一切决策的基石。
    role: motivation
    src:
    - paper: 20231205_03_芒格人生智慧
  - 'no': 2
    name: 捡烟蒂式投资的误区
    desc: 定义什么是“捡烟蒂”，并解释其缺陷：买入价格极低但价值有限的企业，虽然便宜却难以带来长期复利。芒格对此的纠正是理解大机会的关键转折点。
    role: definition
    src:
    - paper: 20231205_03_芒格人生智慧
  - 'no': 3
    name: 少而精的决策观：等待的艺术
    desc: 芒格用50年读《巴伦周刊》只找到一档投资机会的案例，揭示“少而精”的本质：大部分财富来自极少数关键决策，其余时间用于等待。
    role: method
    src:
    - paper: 20231205_03_芒格人生智慧
  - 'no': 4
    name: 知行合一的实践有效性
    desc: 芒格证明了“知道”和“做到”之间的鸿沟。核心发现：严格遵循简单正确道理，远比掌握复杂道理更重要。
    role: experiment
    src:
    - paper: 20231205_03_芒格人生智慧
  - 'no': 5
    name: 理性与道德的边界
    desc: 芒格不仅强调用理性压制情绪，还强调道德约束。延伸思考：当理性和道德冲突时，芒格的哲学如何自洽？
    role: extension
    src:
    - paper: 20231205_03_芒格人生智慧
- 'no': 2
  name: 人性商业学 —— 顺着人性做生意，逆着人性修自己
  desc: 本章解构商业与个人成长中的人性密码。通过“成功幻觉”这一犀利概念，揭示知识付费行业的本质，并给出“顺逆双轨”这一互补性方法论。
  nodes:
  - 'no': 1
    name: 人性心理特点的诊断
    desc: 贪多求快、幻想一招致胜、追求及时满足、爱炫耀怕失去。这些底层心理是理解后续一切商业逻辑的前提。
    role: motivation
    src:
    - paper: 20231212_06_人性商业学
  - 'no': 2
    name: 成功幻觉定理
    desc: 定义知识付费的本质：不是教你成功，而是制造“你会成功”的幻觉。因为教人成功是逆人性的，而制造幻觉是顺人性的。
    role: definition
    src:
    - paper: 20231212_06_人性商业学
  - 'no': 3
    name: 顺逆双轨策略
    desc: 提出核心方法论：对外（商业）顺应人性，对内（成长）逆反人性。两者不是对立，而是互补，构成完整的人生经营策略。
    role: method
    src:
    - paper: 20231212_06_人性商业学
  - 'no': 4
    name: 人性激励偏好实验
    desc: 观察结论：多数人偏好及时满足，少数人愿意为延迟满足付出。这一发现解释了为什么“逆人性成长”者稀缺而珍贵。
    role: experiment
    src:
    - paper: 20231212_06_人性商业学
  - 'no': 5
    name: 成功幻觉的双刃剑效应
    desc: 指出“成功幻觉”商业模式的潜在局限与伦理困境：它顺应人性却能带来商业成功，但对购买者真实成长几乎无益。
    role: limitation
    src:
    - paper: 20231212_06_人性商业学
