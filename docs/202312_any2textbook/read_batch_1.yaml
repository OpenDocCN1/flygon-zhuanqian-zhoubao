- core_question: 为什么懂得很多道理却依然过不好一生？真正的成功智慧是什么？
  depth: medium
  file_path: docs/202312/20231205_03.md
  key_judgment: 成功不在于知道多少复杂的道理，而在于能否将简单的、正确的道理（如友善、耐心、理性、不干蠢事）严格践行，做到知行合一。
  possible_shape: book
  reason: 文章通过芒格个案，提炼出'大道至简、知行合一'的普适性商业与人生哲理，可作为章首引言或核心章节的素材。
  screening_conclusion: retain
  suggested_destination: chapter
  summary: 以查理·芒格为案例，阐述其人生智慧在于坚持运用简单朴素的道理，并严格践行，揭示了知易行难的底层逻辑。
  title: 他活了 99 岁，人生正确率几乎 100%
- core_question: 如何有效向他人求助，从而获得贵人相助？
  depth: medium
  file_path: docs/202312/20231205_05.md
  key_judgment: 获得贵人帮助并非靠运气，而是需要掌握一套包含真诚礼貌、展现自我价值、具体化问题、给予回馈、积极跟进和提供情绪价值的系统性'求助'方法。
  possible_shape: handbook
  reason: 内容属于可操作的个人成长方法论，适合收录为知识库词条或手册条目。
  screening_conclusion: retain
  suggested_destination: kb_entry
  summary: 作者基于个人自媒体成功经验，分享了六条向他人求助、将大佬发展为贵人的具体方法论，强调真诚、价值交换与主动反馈。
  title: 为什么没遇到贵人？因为你根本就不会求助
- core_question: 对于副业新手，如何筛选出适合自己的赚钱项目？
  depth: high
  file_path: docs/202312/20231205_11.md
  key_judgment: 项目选择不应受他人盈利数据干扰，而应基于'合法性、长期性、单人可操作性'的过滤标准，并结合矩阵需求、盈利方式、切入时机、个人兴趣和项目拓展性五步进行理性评估。
  possible_shape: booklet
  reason: 提供了从0到1的项目决策框架，逻辑清晰且具有很强的实操指导性。
  screening_conclusion: retain
  suggested_destination: chapter
  summary: 为项目新人提供一套系统的项目筛选逻辑，包括前期硬性过滤标准和五步判断流程，以降低试错成本和风险。
  title: 新人如何判断一个项目自己能不能做？
- core_question: 如何判断一个产品是否值得做？
  depth: high
  file_path: docs/202312/20231212_05.md
  key_judgment: 产品好做与品类无关，关键在于产品需具备'三个一'（先发、唯一、第一）中的至少一个特性，这是获得爆发性流量和建立护城河的核心。
  possible_shape: course
  reason: 提出了一个高度凝练且富有洞察力的产品选择模型，理论与案例结合紧密。
  screening_conclusion: retain
  suggested_destination: chapter
  summary: 提出产品选择的核心判断标准——'三个一'（First One, Only One, Number One），并辅以多个案例进行分析。
  title: 什么产品好做？三个一
- core_question: 在商业和创业中，人性起到何种作用？
  depth: high
  file_path: docs/202312/20231212_06.md
  key_judgment: 商业成功的底层逻辑是顺应人性（如贪多求快），而个人成长和坚持则需逆人性（如专注、自律）。洞察并顺势而为是分析商业问题的重要思路。
  possible_shape: book
  reason: 文章揭示了商业分析的双重路径，从人性视角提出了富有深度的商业洞察。
  screening_conclusion: retain
  suggested_destination: chapter
  summary: 以商业观察视角，引出'顺着人性做生意、逆着人性修自己'的观点，并用多个商业案例论证人性在商业决策中的根本性作用。
  title: 顺着人性做生意，逆着人性修自己
