paper: 20231205_11_项目筛金术
desc: 该素材面向想要开展网络项目（尤其是自媒体/工作室类）的新人，提出了一套简洁、实操性的‘项目筛选/评估’方法。素材主张在评估项目时，应先通过‘合法性、长期性、单人可操作性’三大硬性标准进行初步过滤，随后再用‘矩阵性、盈利方式、切入时机、个人匹配度、拓展性’五个维度进行深度判断，以避免被市场上夸张的盈利数据等外界噪音干扰，从而理性地评估并选择适合自己的项目。
concepts:
- name: 项目筛金术
  desc: 作者提出的一套带有修辞色彩的项目筛选与深度评估框架，由‘三大过滤标准’与‘五个评估维度’构成，强调用结构化流程对抗外界数据噪音。
  is_original: true
  excerpt:
  - 首先选择项目过滤一下。只要没有达到以下三个要求，直接Pas掉
  - 其次，五个维度深挖判断这个项目到底适不适合自己
- name: 单人可操作性
  desc: 评估项目的一个核心过滤标准，指项目初期可以由单个人独立启动和运行，作者认为这是实现‘批量复制自己’从而组建团队的前提。
  is_original: false
  excerpt:
  - 第三点个人觉得非常重要，因为我就是这样不断地去批量复制"自己"，才组建了一个小十人团队的工作室。
- name: 矩阵性（项目可规模化复制性）
  desc: 评估项目是否具备规模化复制的潜质，是作者提出的五维深度判断中首要考量的一点，用以判断项目能否放大。
  is_original: false
  excerpt:
  - 这个项目是矩阵性的吗？即是否可以规模化复制？
methods:
- name: __overview__
  desc: 整体方法论是‘先过滤后深挖’的两阶段评估法。第一阶段用三个硬性标准（合法、长期、单人能做）对项目进行快速筛选；第二阶段通过五个维度（矩阵性、赚钱方式、时机、兴趣匹配、拓展性）对通过初筛的项目进行深入评估，从而得出该项目是否适合个人的结论。
  excerpt:
  - 首先选择项目过滤一下。只要没有达到以下三个要求，直接Pas掉：1，项目合法吗？2，项目长期吗？3，单人能做吗？
  - 其次，五个维度深挖判断这个项目到底适不适合自己：1，这个项目是矩阵性的吗？2，如何赚钱？3，这个项目切入时机合适吗？4，项目与自己的兴趣、能力匹配吗？5，项目未来是否有拓展性？
- name: 三大过滤标准
  desc: 该方法用于项目的初步筛选，包含‘合法性’‘长期性’‘单人可操作性’三个硬性指标，任何一项不满足则直接放弃（Pas掉）。
  excerpt:
  - 1，项目合法吗？2，项目长期吗？3，单人能做吗？
  - 前两点很简单，做合法公民，做长期主义者。第三点个人觉得非常重要
- name: 五维深度评估法
  desc: 该方法用于对通过初筛的项目进行全方位的深入考查，通过询问‘矩阵性、盈利方式、切入时机、兴趣匹配、拓展性’五个问题来评估项目与个人的契合度。
  excerpt:
  - 1，这个项目是矩阵性的吗？即是否可以规模化复制？
  - 2，如何赚钱？赚钱的方式是否清晰可复制？
  - 3，这个项目切入时机合适吗？现在是不是做它的好时候？
  - 4，项目与自己的兴趣、能力匹配吗？
  - 5，项目未来是否有拓展性？能不能延伸出更多玩法？
theorems:
- name: ‘先过滤后深挖’的项目决策原则
  desc: 核心主张是：项目选择不应受他人盈利数据等外部信息干扰，而应依据‘合法性、长期性、单人可操作性’的硬性过滤标准先行筛除，再结合‘矩阵需求、盈利方式、切入时机、个人兴趣、项目拓展性’五个维度进行理性、系统的评估，最终做出决策。
  excerpt:
  - 核心：项目选择不应受他人盈利数据干扰，而应基于合法性、长期性、单人可操作性的过滤标准，并结合矩阵需求、盈利方式、切入时机、个人兴趣、项目拓展性五步进行理性评估。
findings:
- name: 欠缺判断方法的焦虑现象（表述性观察）
  desc: '[claim] 素材提出：因信息透明，人们每天看到大量夸张的日入过万、月入十万数据，这会引起新手焦虑；并暗示该焦虑正是由于缺乏系统的项目筛选方法所致（作者据此提供方法）。此结论为素材的引子，缺乏数据支撑。'
  excerpt:
  - 信息越来越透明，大家每天都会刷到很多日入过万，月入十万的文章，你焦虑吗？我将用最简单的大白话，最实用的几个方法去详细讲解，如何选择一个适合自己的项目
- name: ‘过滤标准’与‘团队组建’的实践关系（个人经验观察）
  desc: '[claim] 作者基于个人经验宣称：坚持‘单人可操作性’的过滤标准，是实现‘批量复制自己’进而组建更大团队和工作室的基础（作者自述由此组建了约十人团队）。该结论源于作者的自述经验，未提供可验证数据。'
  excerpt:
  - 第三点个人觉得非常重要，因为我就是这样不断地去批量复制"自己"，才组建了一个小十人团队的工作室。
