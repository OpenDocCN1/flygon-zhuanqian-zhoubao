units:
- 'no': 1
  name: 浏览器指纹 —— 网站识别用户的“无形身份证”
  points:
  - '**为什么需要这个概念？**'
  - '- 网站需要在用户未登录、禁用 Cookie 时仍能追踪识别设备'
  - '- 传统 Cookie 易被清除/屏蔽，指纹技术更隐蔽、持久'
  - '- 多账号运营若指纹相同，极易被平台判定关联导致封号'
  - '**核心定义**'
  - '- 通过浏览器配置信息（UA、时区、语言、分辨率、Canvas、WebGL 等）生成的唯一标识串'
  - '- 原理类似人类指纹：仅凭浏览器“长相”即可区分不同用户/设备'
  - '**关键性质**'
  - '- 无状态性：不依赖本地存储，用户无法通过清理缓存消除'
  - '- 组合唯一性：单一属性重复率高，但组合后极大概率唯一'
  - '- 跨会话稳定：同一设备/浏览器版本下，指纹短期内基本不变'
  - '**典型例子**'
  - '- 广告联盟无 Cookie 精准投放、反欺诈系统识别刷单机、风控系统拦截批量注册'
  - '- 你用同一浏览器登录两个淘宝号，平台通过 Canvas 指纹秒判关联'
  - '**边界条件**'
  - '- 无头浏览器/自动化工具（Selenium/Puppeteer）指纹特征明显，极易被识别'
  - '- 浏览器版本升级、显卡驱动更新可能导致 Canvas/WebGL 指纹漂移'
  - '- 纯指纹隔离无法对抗行为建模、硬件指纹（MAC/电池/蓝牙）等深层风控'
  sources:
  - paper: docs/202303/20230328_016.md
    role: origin
  excerpts:
  - 浏览器指纹是一项技术，它能够通过浏览器的各种配置和设置（浏览器指纹辨识的信息可以是 UA、时区、地理位置、IP 或者是使用的语言）来识别用户的浏览器，从而区分不同的用户。
  - 就像我们手上的指纹一样，浏览器指纹也具有辨识度，只不过它只能辨别浏览器。
- 'no': 2
  name: 指纹浏览器 —— 单机跑百号的“克隆分身术”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通浏览器无法修改底层指纹，多开账号必然关联'
  - '- 购买大量物理设备成本极高、管理混乱、无法团队协作'
  - '- 需要在单台电脑上创建“物理隔离级”的虚拟浏览器环境'
  - '**核心定义**'
  - '- 能在单机同时运行多个相互隔离、指纹可自定义的虚拟浏览器实例'
  - '- 账号凭据（Cookie/LocalStorage）保存在环境内，支持跨设备/跨人员同步协作'
  - '**关键性质**'
  - '- 环境级隔离：进程、缓存、指纹、存储全链路物理分离'
  - '- 指纹可定制：UA、分辨率、时区、WebGL、Canvas 噪声等全维度可改'
  - '- 团队协作性：环境配置云端同步，成员无需共享密码即可登录操作'
  - '**典型例子**'
  - '- Adspower/Hubstudio/比特/悦互联：主流四大指纹浏览器横评核心体验趋同'
  - '- 运营 100 个 FB 账号：仅需 1 台电脑 + 1 个指纹浏览器 + 100 个环境 + 100 个 IP'
  - '**边界条件**'
  - '- 紫鸟浏览器因合规限制无法访问 FB/Google 等境外受限平台，仅适配亚马逊等合规电商'
  - '- 自动化 API、内核类型（Chromium/Firefox）、团队席位数是选型核心差异点'
  - '- 指纹浏览器仅解决“环境隔离”，不解决“IP隔离”与“行为模拟”，防关联仍需组合拳'
  sources:
  - paper: docs/202303/20230328_016.md
    role: origin
  excerpts:
  - 指纹浏览器是能够同时开出多个浏览器环境，并且自定义修改浏览器的指纹信息，这样就可以在同一设备上使用多个账号，而不用担心被账号的关联问题了。
  - 同时指纹浏览器还有个很大的用处就是能用来做团队协作：一个浏览器环境是可以多人在不同电脑上同时打开，而账号信息可以直接保存在浏览器环境内。
  - 但是紫鸟浏览器也有个很明显的问题，因为政策原因，是不能上 Facebook、谷歌等国内禁止的平台。
- 'no': 3
  name: 账号隔离三要素 —— 防关联的“铁三角”基建
  points:
  - '**为什么需要这个概念？**'
  - '- 仅隔离指纹/仅换 IP/仅分账号均会导致关联穿透'
  - '- 平台风控是多维交叉验证，单点防御必破'
  - '- 需建立标准化“最小可行性防关联基建清单”'
  - '**核心定义**'
  - '- 独立浏览器指纹环境 + 独立 IP 地址 + 独立账号凭据，三者缺一不可'
  - '- 对应解决：设备指纹识别、网络层身份关联、凭据泄露关联三大风控维度'
  - '**关键性质**'
  - '- 必要性：三要素是防关联的“入场券”，不具备任一项直接裸奔'
  - '- 非充分性：具备三要素≠绝对安全，仍需对抗行为建模/硬件指纹/业务逻辑关联'
  - '- 正交性：三要素相互独立，指纹浏览器管环境，代理 IP 管网络，账号管凭据'
  - '**典型例子**'
  - '- 标准化 SOP：Adspower 创建 100 环境 → IProyal 开 100 条动态住宅 IP → 一一绑定 → 导入账号密码'
  - '- 团队协作：主管分配环境权限给运营，运营打开即用，不知密码、不动 IP、不改指纹'
  - '**边界条件**'
  - '- 平台风控策略动态升级（如 TikTok 新增硬件指纹检测），三要素可能瞬间失效'
  - '- 同一环境登录不同平台账号（FB+IG）安全，因平台间数据不互通'
  - '- 行为异常（登录频率/操作节奏/发布内容高度相似）仍会触发关联封号'
  sources:
  - paper: docs/202303/20230328_016.md
    role: origin
  excerpts:
  - 解决方案就是我们要把同个平台的不同账号做好隔离，用不同的浏览器+不同的 IP（IP 可以简单理解为一条宽带网络）来实现账号隔离。
  - 每一个账号分配在一个单独的浏览器环境下，每一个浏览器环境再分配一个单独使用的 IP，那么简单来说，这些账号就是互相隔离的了
- 'no': 4
  name: IP质量分级体系 —— 手机IP>住宅IP>服务器IP的“真假贵贱”
  points:
  - '**为什么需要这个概念？**'
  - '- IP 是账号的“网络身份证”，质量直接决定账号存活率'
  - '- 市面 IP 服务商鱼龙混杂，“静态住宅”多为机房 IP 伪装'
  - '- 需建立量化甄别标准，避免花高价买到“毒 IP”烧号'
  - '**核心定义**'
  - '- 按真实性与抗风控能力分级：手机 IP (4G/5G 基站) > 住宅 IP (家庭宽带) > 服务器 IP (机房/数据中心)'
  - '- 价格与安全性正相关：手机 IP 最贵最稀缺，服务器 IP 最便宜最易风控'
  - '**关键性质**'
  - '- ISP 名称辨别：Scamalytics 查询显示云厂商名=服务器 IP；显示电信运营商名=住宅 IP'
  - '- 垃圾值参考：评估 IP 历史污染度（代理概率/黑名单记录），值越高风险越大'
  - '- 动态>静态：动态住宅 IP 符合真实 DHCP 拨号特征，安全性高于伪静态住宅 IP'
  - '**典型例子**'
  - '- 某 IP 查询显示 ISP 为“深圳市腾讯电脑系统有限公司” → 判定为服务器 IP（机房）'
  - '- 某 IP 查询显示 ISP 为香港某宽带网络公司 → 判定为住宅 IP（真实家庭宽带）'
  - '**边界条件**'
  - '- 真正的静态住宅 IP 需向运营商申请专线，价格极高（千元/月级）且极度稀缺'
  - '- 网站数据仅作辅助参考，最终以实测目标平台登录/发帖/养号通过率为准'
  - '- 同一服务商不同 IP 段质量差异巨大，需批量抽样测试而非盲信品牌'
  sources:
  - paper: docs/202303/20230328_016.md
    role: origin
  excerpts:
  - 简单总结，IP 的安全性（就是不容易引起风控的可能性）排行是：手机 IP>住宅 IP>服务器 IP
  - 动态住宅 IP 的安全可靠性是要高于静态住宅 IP 的。因为动态住宅 IP 就是家庭宽带 IP。在实际的使用中，更加的安全。
  - 用这个网址查询：https://scamalytics.com/IP 输入 IP，点击查询，如果是服务器 IP，ISP Name 一般会显示服务商的名字
- 'no': 5
  name: 动态住宅IP粘性会话 —— 既要“真实漂移”又要“登录稳定”
  points:
  - '**为什么需要这个概念？**'
  - '- 纯动态 IP 每请求换 IP，触发平台异地登录风控/验证码轰炸'
  - '- 纯静态 IP 易被标记为机房/代理，且单 IP 成本高'
  - '- 需要一种“短期固定、长期漂移”的折中方案'
  - '**核心定义**'
  - '- 动态 IP 服务商提供的会话保持机制：设定时长（如 24h）内分配固定 IP，过期自动更换'
  - '- 兼顾真实住宅环境（IP 会变）与账号登录稳定性（单次会话 IP 不变）'
  - '**关键性质**'
  - '- 单环境专属：一组代理信息仅对应一个浏览器环境，生成 N 组供 N 环境用'
  - '- 地理位置锁定：IP 仅在固定城市/州范围内漂移，符合真实用户移动轨迹'
  - '- 按量付费：流量计费，不用不收费，单 G 流量可供 10 环境轮换，边际成本极低'
  - '**典型例子**'
  - '- IProyal/rola-ip：配置粘性会话 24h，生成 10 组代理串口，分别填入 Hubstudio 10 个环境'
  - '- 养号/注册/高价值低频账号：用动态住宅 IP，安全成本双优'
  - '**边界条件**'
  - '- IP 池有限循环复用，不同环境存在概率复用同一 IP，但平台通常容忍同城 IP 复用'
  - '- 部分服务商屏蔽特定站点（如 IProyal 无法访问 FB），选型需实测目标平台可达性'
  - '- 本地网络未开全局代理会导致代理检测通过但浏览器打不开站点，需开启本地“梯子”分流'
  sources:
  - paper: docs/202303/20230328_016.md
    role: origin
  excerpts:
  - 这里我们一般选粘性 IP。意思是一个 IP 分配给我们之后，一般在 24h 之内，这个 IP 是不会变动的。
  - 默认是帮我们生成了十组的信息，这十组的信息就可以分别用在十个浏览器环境里面。
  - 有的 IP 服务商会屏蔽某些特定的网站，比如用 IProayl 这个服务商的 IP，就打不开 Facebook。
- 'no': 6
  name: 静态服务器IP部署方案 —— 高流量低风控的“包月专线”
  points:
  - '**为什么需要这个概念？**'
  - '- 发帖/聊天/成熟店铺运营流量巨大，动态住宅 IP 按流量计费成本不可控'
  - '- 云服务器固定公网 IP 月付几十元不限流量，性价比极高'
  - '- 适配亚马逊成熟店铺、社媒养号等低风控高频场景'
  - '**核心定义**'
  - '- 基于阿里云/腾讯云海外 VPS（CentOS 最低配）固定公网 IP + SSH 隧道代理模式'
  - '- 在指纹浏览器（如 Adspower）选择 SSH 代理模式，填入公网 IP/root/密码即可'
  - '**关键性质**'
  - '- 成本固定：包月不限流量，边际成本趋近零'
  - '- 部署极简：购买服务器→开放端口→指纹浏览器配置 SSH→连通测试→保存，全程 <10 分钟'
  - '- 纯净度中等：ISP 显示云厂商名，平台识别为机房 IP，仅适合低风控业务'
  - '**典型例子**'
  - '- 阿里云美西服务器 1核1G 1M 带宽月付 ~50 元，配置 50 个 Adspower 环境跑亚马逊店铺日常运营'
  - '- 社媒矩阵发帖聊天号：统一走服务器 IP，单号日发 50 条零压力'
  - '**边界条件**'
  - '- 绝不可用于高风控平台注册/养号/核心大号，极易触发机房 IP 风控'
  - '- 服务器重启/换 IP 需同步更新所有环境配置，运维成本随规模线性增长'
  - '- SSH 隧道稳定性依赖服务器网络质量，国内访问海外 VPS 易丢包/高延迟'
  sources:
  - paper: docs/202303/20230328_016.md
    role: origin
  excerpts:
  - 最简单的方式就是购买一个云服务器，然后给每个浏览器环境配一个云服务器的 ip 就行。
  - 下面我们以 adspower 这个指纹浏览器软件和阿里云的美国服务器来具体实操怎么使用。
  - 选择 SSH 的代理模式。我们刚才搜集的三个数据按照下面的方式填写：公网 ip、服务器账号、服务器密码。
  - 点击右侧的“检查代理”。如果显示测试成功，那么点击保存即可。
- 'no': 7
  name: 动态住宅IP部署方案 —— 高风控核心号的“私人专线”
  points:
  - '**为什么需要这个概念？**'
  - '- 注册/养号/核心大号风控极严，服务器 IP 直接秒挂'
  - '- 手机 IP 成本太高，动态住宅 IP 成本可控且纯净度高'
  - '- 粘性会话解决“频繁换 IP 触发验证”的稳定性痛点'
  - '**核心定义**'
  - '- 基于流量计费动态住宅代理池 + 指纹浏览器原生代理设置 + 粘性会话 24h'
  - '- 适合高风控注册、养号、低频高价值账号，按量付费极致降本'
  - '**关键性质**'
  - '- 真实性强：ISP 显示家宽运营商，Scamalytics 判定为住宅 IP，通过率极高'
  - '- 配置自动化：粘贴代理字符串自动解析主机/端口/账号/密码，零手工录入'
  - '- 资源弹性：按需生成 N 组代理，单 G 流量支撑 10 环境轮换，闲置零成本'
  - '**典型例子**'
  - '- Hubstudio + IProyal/rola-ip：粘性 24h，HTTP/SOCKS5 双协议，实测 FB/TikTok 注册通过率 90%+'
  - '- 核心大号/客户账号：仅登录操作用动态住宅 IP，日均成本 <0.5 元'
  - '**边界条件**'
  - '- 高频大流量业务（发帖/直播/爬虫）禁用，流量费会爆炸'
  - '- 代理检测通过但打不开站点 → 本地未开全局代理分流，开本地梯子即解决'
  - '- 服务商屏蔽差异大：IProyal 屏蔽 FB 需换 rola-ip，选型必实测目标平台'
  sources:
  - paper: docs/202303/20230328_016.md
    role: origin
  excerpts:
  - 进入代理设置这里...选择“按动态 IP 规则使用”...我们需要先进入 IProyal，选择轮转住宅代理（就是动态住宅 IP 的意思）。
  - 这里我们一般选粘性 IP...然后这里选 24 时。意思就是一个 IP 分配给我们之后，一般在 24h 之内，这个 IP 是不会变动的。
  - 直接粘贴在代理主机那一栏里面，系统会帮我们自动填写到四个空格里面...点击检查代理。这样就成功了。
- 'no': 8
  name: 业务分层IP配置策略 —— 给每个账号配对的“鞋子”
  points:
  - '**为什么需要这个概念？**'
  - '- 所有账号统一用一种 IP：要么成本爆炸，要么风控暴雷'
  - '- 账号价值、操作频次、平台风控等级差异巨大，需分层匹配资源'
  - '- 实现“安全账号用好 IP、流量账号用便宜 IP、废号不用 IP”的资源最优化'
  - '**核心定义**'
  - '- 高频大流量（发帖/聊天/成熟电商店铺） → 静态服务器 IP（包月不限流）'
  - '- 高价值/高风控/低频（注册/养号/核心大号/客户账号） → 动态住宅 IP（按量付费）'
  - '- 跨平台账号（FB+IG）可共享环境/IP，因平台间数据不互通，降低环境创建成本'
  - '**关键性质**'
  - '- 成本效率最优：将 IP 成本从“固定成本”转为“边际成本随业务价值波动”'
  - '- 安全隔离性：不同层级 IP 池物理隔离，避免低价值账号污染高价值账号 IP 信誉'
  - '- 运维标准化：建立“账号分级→IP派单→监控通过率→异常熔断”全流程 SOP'
  - '**典型例子**'
  - '- 100 号矩阵：80 个发帖号走 2 台云服务器 IP（月固定 100 元），20 个核心号走动态住宅 IP（月浮动 200 元），总成本 300 元/月'
  - '- 同一环境跑 FB+IG 双平台：省 1 个环境创建成本，省 1 个 IP 成本，安全无关联'
  - '**边界条件**'
  - '- 平台风控升级可能导致原“低风控”业务瞬间变“高风控”，需建立 IP 定期巡检机制'
  - '- 团队协作时需严格权限隔离：运营只见环境，不见 IP 配置、不见账号密码'
  - '- 账号价值随运营阶段变化（如养号成功转核心号），需支持 IP 平滑迁移不换环境'
  sources:
  - paper: docs/202303/20230328_016.md
    role: origin
  excerpts:
  - 发帖，聊天的社交账号用服务器 IP，因为发帖聊天会消耗比较多的流量，用动态 IP 太贵，服务器 IP 是包月付费不限流量的，会比较划算。
  - 那些不常用的账号，或者特别重要的账号用动态住宅 IP，因为是按流量付费，不用就不收费，更划算也更安全。
  - 我有一个 facebook 账号，一个 Instagram 账号，我可以用同一个浏览器环境，同一个 IP 同时登陆吗？当然可以，因为平台不一样。
- 'no': 9
  name: 防关联必要非充分定理 —— 基建达标≠绝对安全
  points:
  - '**为什么需要这个概念？**'
  - '- 运营易陷入“做完环境/IP隔离就万事大吉”的幸存者偏差'
  - '- 平台风控是动态博弈，今天的充分条件明天可能变必要条件'
  - '- 需建立“持续对抗”而非“一次配置”的安全运营心智'
  - '**核心定义**'
  - '- 指纹隔离+IP隔离是防关联的必要非充分条件'
  - '- 还需结合：行为模拟（操作节奏/间隔）、硬件指纹（MAC/电池/蓝牙）、Cookie 管理、业务逻辑差异化'
  - '**关键性质**'
  - '- 动态博弈性：平台风控策略周级迭代，静态配置必然滞后失效'
  - '- 系统工程性：防关联=基建(三要素)+行为(人设/节奏)+内容(差异化)+应急(熔断/申诉)'
  - '- 归因模糊性：账号挂了往往不知是指纹/IP/行为/内容哪个维度触发，需全链路排查'
  - '**典型例子**'
  - '- 环境/IP完美，但 5 个账号同一时间段发相似内容 → 行为关联封号'
  - '- 环境/IP完美，但账号关联同一手机号/邮箱/收款码 → 凭据关联封号'
  - '- 环境/IP完美，但硬件指纹（电池电量/蓝牙列表）相同 → 硬件关联封号'
  - '**边界条件**'
  - '- 小规模/低价值账号可接受“必要条件达标即上”，成本收益比最高'
  - '- 核心高价值账号必须部署“充分条件集合”：独立设备/独立宽带/独立人设/独立内容'
  - '- 无法通过技术手段 100% 规避平台策略风险，最终兜底是“分散化布局+快速复活能力”'
  sources:
  - paper: docs/202303/20230328_016.md
    role: origin
  excerpts:
  - 在进行下一步的前，有必要说明一下：不同的平台对于安全风控的强弱是不一样的，不是说做好环境和 ip 隔离就一定能防止账号关联，只是说如果想实现账号隔离的目的，那么这就是最基本的要求。
