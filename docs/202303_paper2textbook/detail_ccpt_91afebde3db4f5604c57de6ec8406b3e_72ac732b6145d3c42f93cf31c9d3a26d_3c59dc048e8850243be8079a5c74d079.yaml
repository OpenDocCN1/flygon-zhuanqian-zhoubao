  name: Prompt分级体系与混合模式 —— 从“特定指令”到“结构化混合”的进阶路径
  points:
  - '**为什么需要这个概念？**'
  - '- 新手直接用“特定指令”聊天，输出泛泛无结构，体验差易放弃工具'
  - '- 单一模式(指令/示例/代理)均有短板：指令呆板、示例依赖范例质量、代理缺乏人设细节'
  - '- 需要一套结构化的进阶路径，将Prompt工程从“玄学”变为“可复制的工程”'
  - '**核心定义**'
  - '- 四大基础模式：1.特定指令(确认知晓) 2.指令模板(平台风格规范) 3.示例模式(Few-shot模仿爆款) 4.代理模式(Role-Play角色扮演)'
  - '- 进阶混合模式：指令模板(结构) + 特定指令(素材) + 示例模式(范例) + 代理模式(人设) 四位一体'
  - '- 小红书标准化结构：开头(痛点/情景/人设/方法/诱导) + 中间(1-5知识点重点讲1-2) + 结尾(提关注/强人设/引主页) + 标签(热门自打)'
  - '**关键性质**'
  - '- 质量阶梯显著：同主题“推荐ChatGPT写简历”对比，混合模式输出质量碾压单一模式(结构规范+内容详实+人设鲜明+可读性最强)'
  - '- 学习即模仿：示例模式(提供高质量范例)优于指令模板(编写详尽规则)，模仿隐性知识习得效果优于显性规则遵循'
  - '- 核心价值非标转标：ChatGPT最大价值在于将非结构化素材转化为平台规范的标准化输出，指令模板是最直接体现'
  - '**典型例子**'
  - '- 专家评估验证：匿名教练对混合模式生成内容给70-80分(合格博主水准)'
  - '- LinkedIn+ChatGPT求职实战：JD→生成简历/CL→搜在职员工简历参考，单份简历压缩至半小时，海投效率提升1倍+'
  - '- 人设注入代理：普通代理“站在博主角度” vs 升级版“扮演积极活泼22岁小姐姐，有趣/积极/活泼语气”'
  - '**边界条件**'
  - '- 提问质量决定留存：好提问获正向反馈持续探索，差提问得负面体验弃工具，是跨越“尝鲜期”关键分水岭'
  - '- 思考不可外包：AI定位为“脚手架”助跨越不及格→合格鸿沟，选题/逻辑/人设等核心思考必须人类保留'
  - '- 工作流嵌入深度×领域专业度=核心竞争力：HR筛选简历/求职者模拟面试等场景深度融入AI，形成独家SOP护城河'
  sources:
  - paper: docs/202303/TQMkd13LIos5sexxqWZcBHMUnif.md
    role: origin
  excerpts:
  - 输入的Prompt提示关键词，可以归类为4种常见的基础模式：分别是：特定指令、指令模板、示例模式、代理模式
  - 混合模式通常是为了完成一个复杂任务，同时使用多种基础模式的组合
  - 一篇小红书笔记主要包括4个部分：开头：痛点引入+情景描述+人设+方法介绍+点赞诱导...
  - 使用ChatGPT创作的小红书爆款笔记不一定能爆，但是最关键的是它能帮助你把自身原来不及格的小红书笔记，快速提升到一个合格博主的创作水平
  - 内容可以外包，思考终究还是自己的
  - 如果你有意识地把AI工具应用到自己的工作流程中...让自己在某个工作流程中，成为最会使用AI的那个人，你就不用担心会有被AI替代的那天
  - 指令模板很好用，但是ChatGPT给出的结果...标准不会错，但也代表着呆板没有创新
  - 真正的学习，绝不是坐在那里听PPT，而是看看周围的人在做什么，然后你去模仿他
