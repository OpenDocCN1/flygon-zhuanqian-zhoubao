units:
- 'no': 1
  name: 社群赋能加速成长 —— 从“圈外小白”到“全职Builder”的跃迁路径
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人切入Web3等新赛道面临认知门槛高、信息杂乱、试错成本大的困境'
  - '- 单打独斗易陷入“伪认知”陷阱，缺乏系统性框架与实战验证'
  - '- 需要一个低门槛、高杠杆的路径快速建立行业认知并变现'
  - '**核心定义**'
  - '- 优质付费社群提供的“前辈指引+结构化实战训练+人脉网络”三位一体赋能体系'
  - '- 核心路径：进圈层获认知 → 参加航海跑流程 → 全职投入建组织 → 实战验证收获益'
  - '**关键性质**'
  - '- 认知建立的“加速器”：将分散的碎片信息整合为系统认知框架'
  - '- 试错成本的“缓冲器”：通过前辈经验规避坑点，缩短探索周期'
  - '- 商业变现的“放大器”：提供项目线索、合伙人、流量渠道等稀缺资源'
  - '**典型例子**'
  - '- 作者KangKang：入圈3年 → 参加Web3入门航海(2月) → 全职Web3建立Crypto Alpha → 3周内团队实现7位数收益(ARB空投)'
  - '- 评论区验证：成员普遍认同“生财是捷径”“航海是实战闭环”'
  - '**边界条件**'
  - '- 社群质量参差不齐，需筛选具备“头部前辈+结构化课程+实战导向”三要素的高质量社群'
  - '- 赋能仅提供杠杆，执行力与复盘迭代能力仍为个人核心变量，无法外包'
  - '- 过度依赖社群易形成“巨婴心态”，需保持“自我为最高信用资产”的主体性'
  sources:
  - paper: docs/202303/20230328_041.md
    role: origin
  excerpts:
  - 没有生财，我也很难在生财 Web3 前辈的指引下，快速的建立对行业的框架、系统认知、以及未来全职进入 Web3
  - 参加了 Web3 入门｜2 月航海
  - 目前全职 Web3，Crypto Alpha 创始人
  - 月底，3 月 22、3 月 23，就收获了期待的本年度的团队 7 位数的收益
  - '刘嘉仁 : 撸到了 arb 的空投吧，遗憾错过了 8 位数的收益'
- 'no': 2
  name: 认知闭塞与信息差红利 —— 核心圈层与大众认知的“时间差套利”
  points:
  - '**为什么需要这个概念？**'
  - '- 核心圈层（北上广/头部创业者）普遍高估大众对前沿技术（如大模型）的认知普及度'
  - '- 这种“幸存者偏差”导致下沉市场巨大的认知鸿沟被忽视，实则是巨大的商业蓝海'
  - '- 认知时间差是普通人通过普及教育、工具教学实现变现的核心机会窗口'
  - '**核心定义**'
  - '- 国内认知闭塞：核心圈层误判大众普及度，忽视下沉市场认知鸿沟'
  - '- 信息差红利：利用“国外科技圈共识 → 国内核心圈认知 → 大众普及”的时间窗口，提供基础认知、工具使用、提示词教学等服务'
  - '**关键性质**'
  - '- 非对称性：核心圈层已达成共识（如GPT-3年干掉程序员、GPT联网反向诱导人类），大众仍处认知空白期'
  - '- 滞后性：GPT-4级能力2022年10月已小圈层内测，公众认知爆发滞后5个月'
  - '- 可变现性：基础普及教育在下沉市场存在极大信息差生意，门槛低、需求大、复购强'
  - '**典型例子**'
  - '- “三年干掉程序员”海外共识 vs 国内仍在争论AI能否写代码'
  - '- GPT联网后“反向诱导人类协作”被低估，实为智能体雏形'
  - '- 文心一言被舆论嘲讽“低能”，实则针对中文语境/合规深度优化，本土化价值被低估'
  - '**边界条件**'
  - '- 信息差具有时效性，随技术普及（如提示工程师职业化）红利窗口会关闭'
  - '- 仅传递信息不够，需结合“实战验证”将信息转化为确定性方法论'
  - '- 核心圈层认知也会滞后（如低估应用层风向切变风险），不可盲目跟随'
  sources:
  - paper: docs/202303/20230328_046.md
    role: origin
  excerpts:
  - 国内信息太闭塞，国外科技圈早就全面跟上
  - 我们生活在北上广，有信息的幸存者偏差
  - Gpt 的聪明被大多数人低估了，联网后，gpt 已经会自己从社交媒体诱导人类帮他干活了
  - 号称三年要干掉程序员行业，自己很多基础的岗位被取代就是分分钟
  - 文心一言不低能，被大众低估了，大家都只知道吃瓜，但其实它能做的事情也很多，而且我们在国内的人反而更需要关注文心一言
  - 一些基础的普及教育，在下沉市场仍然存在很大的信息差生意
  - 'Vicent : gpt-4 是去年出来了，刘晨昊 : 不是，意思是去年就有它的低阶版本了'
- 'no': 3
  name: 人工+智能爆文框架 —— 10分钟产出10W+的标准化SOP
  points:
  - '**为什么需要这个概念？**'
  - '- 传统内容创作面临“原创度低、效率不高、情绪价值缺失”三大痛点'
  - '- 纯AI生成内容程式化、缺乏人情味，原创度仅60%难过平台风控'
  - '- 纯人工创作效率低、不稳定，难以支撑矩阵化、规模化运营'
  - '**核心定义**'
  - '- 三步协作流：1. 人工决策选题标题(占50%权重，1分钟) → 2. ChatGPT生成正文(执行层，1分钟) → 3. 人工注入情绪价值(打磨层，5分钟：加引文、衔接、升华)'
  - '- 核心公式：选题决策权重(50%) + AI执行效率 + 情绪价值注入 = 高原创度(70%+)爆文'
  - '**关键性质**'
  - '- 分工明确：人类负责“选择大于努力”的决策与“人性洞察”的情绪，AI负责标准化执行'
  - '- 原创度跃升：从基础60%提升至70%+，轻松通过平台原创校验'
  - '- 效率极致：单篇耗时≤10分钟，支撑矩阵化、公司化放大'
  - '**典型例子**'
  - '- 作者袁永兵：新号5篇10W+，单篇广告收益数千元，10分钟/篇'
  - '- 情绪价值注入前后对比：AI生成“首先、其次、最后”程式化结构 → 人工优化后具备起承转合、引文金句、结尾升华'
  - '**边界条件**'
  - '- 选题标题质量是上限：AI无法替代“选择大于努力”的决策层，需建立爆文库/榜单监控机制'
  - '- 合规风险高：AI生成情感类故事易触发“网络清朗行动”风控(编造故事/失真内容)，需隐匿账号信息、优化真实性'
  - '- 非万能公式：适用于知识分享、干货类内容，强叙事/深度报道类仍需人类主导'
  sources:
  - paper: docs/202303/20230328_126.md
    role: origin
  excerpts:
  - 搭了一个人工+智能爆文框架，总共 3 步：1、选题+标题，占 50%，做内容就是做选题，所谓选择大于努力 2、正文 3、情绪价值
  - 选题+标题用时 1 分钟左右...经过 ChatGPT 1 分钟左右输出...再用 5 分钟...总共用时不超过 10 分钟
  - 这时候原创度大概在 60%左右...再测原创度，已经高达 70%以上，主流平台都能轻松过关
  - 现在这个号的文章篇篇都是 ChatGPT 写的，目前有 5 篇文章的阅读量到达 10w+了，也有了一定的变现
  - 总感觉，这样编出来的故事，容易让人举报...网信办再次开展网络清朗行动，打击的就是失真内容
- 'no': 4
  name: 躬身入局与认知迭代闭环 —— 行为倒推认知的长期主义生存法则
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者易陷入“雇佣军模式”：花钱雇人做未亲自跑通的项目，导致失控亏损'
  - '- 认知调整极难（作者40岁仍在调整），单纯“学知识/看报告”形成“伪认知”(一说都会，一做都错)'
  - '- 需要一套通过“行动→反馈→认知升级”的正向飞轮机制'
  - '**核心定义**'
  - '- 躬身入局：项目必须亲自跑通才能交付团队，拒绝雇佣军模式'
  - '- 认知迭代闭环：通过“如果我是对的早就不是现在这样”自我对话打破伪认知 → 行为改变(不看报告/刻意练标题/隐匿账号) → 倒推认知升级 → 形成正向飞轮'
  - '**关键性质**'
  - '- 认知滞后于行为：直接调整认知极难，但行为改变可倒推认知跃迁'
  - '- 实战是唯一试金石：付费社群、航海实战提供“弄脏手”的机会，将隐性知识显性化'
  - '- 长期主义前提：公众号爆文需持续执行100天-1年，穿越周期获复利，急功近利是放弃主因'
  - '**典型例子**'
  - '- 作者：前三次起号铩羽而归 → 付费社群系统学习+航海实战 → 行为改变(每日抄标题/隐匿账号/搭建私有API) → 认知重构(选题为王/情绪价值/躬身入局)
    → 单号跑通 → 公司化矩阵化放大'
  - '- 付费社群ROI验证：年投10万+，获ChatGPT稳定接口、刀姐调教提示词、精华帖方法论，认知套利极高'
  - '**边界条件**'
  - '- 需具备“空杯心态”与“100%照单全收”的执行力，抗拒/打折执行将失效'
  - '- 仅适用于可标准化、可复制的项目模式，非标高认知服务仍依赖个人核心能力'
  - '- 平台规则变化(如推荐算法收敛/风控收紧)可能失效，需持续迭代SOP'
  sources:
  - paper: docs/202303/20230328_126.md
    role: origin
  excerpts:
  - 凡是没有经过自己手亲自跑通的项目，再也不敢放手去让所谓的“雇佣军”去做主了
  - 这里最难的是思维的调整，太难了...以至于我在 40 岁的当下，我仍然在调整
  - 你看，随着我的行为的改变，也能倒推出认知上的提高，都是相互作用的
  - 公众号爆文写作...先从持续做这件事一百天开始，一年开始
  - 每年累计超过十万元...回报是显而易见的，除了极大地弥补了自己在认知差、信息差上面的差距
- 'no': 5
  name: ChatGPT插件生态爆发 —— 从“聊天机器人”到“智能操作系统”的范式跃迁
  points:
  - '**为什么需要这个概念？**'
  - '- ChatGPT原有“知识截止+无法联网+被动响应”三大硬伤，限制商业化落地'
  - '- 开发者缺乏标准化接入外部工具/数据的通道，应用开发处于原始阶段'
  - '- 需要一个开放生态机制，将大模型推向平台化拐点'
  - '**核心定义**'
  - '- ChatGPT Plugins：OpenAI开放的标准化扩展机制，赋予模型联网、代码执行、第三方工具调用能力'
  - '- AI Agent生态雏形：大模型作为“智能操作系统”，通过插件连接万物，完成复杂任务'
  - '**关键性质**'
  - '- 范式跃迁：从封闭“聊天机器人”转向开放“智能操作系统/平台”'
  - '- 先发红利：首批入驻开发者将获流量/品牌/数据复利，社群开发者即时动员抢占'
  - '- 能力质变：联网后GPT具备“反向诱导人类协作”主动性智能，标志智能体雏形出现'
  - '**典型例子**'
  - '- 2023.3.24 OpenAI发布插件功能，星球社群程序员即时列队集合(8人极速响应)'
  - '- 成员行为：抢先申请内测资质、寻求带队协作(“出发，带我一个”)、组队开发'
  - '**边界条件**'
  - '- 初期为邀请制/申请制，获取开发者资质是前置门槛'
  - '- 官方Plugins与第三方浏览器插件完全不同，后者面临被原生能力替代风险'
  - '- 插件生态早期尚未爆发，API全面开放后将涌现海量Mini Tool/Mini SaaS'
  sources:
  - paper: docs/202303/20230328_130.md
    role: origin
  - paper: docs/202303/A27Md68WVox13FxPZFeczOVgnKc.md
    role: improve
  excerpts:
  - ChatGPT 王炸更新宣布推出插件功能，赋予 ChatGPT 联网的功能
  - 请星球的程序员评论区列队集合，准备出发
  - '大白白 : 出发, shijinzhan : 来了, Charliex : 来啦, Holly 软件开发 : 出发'
  - '有霸夫 : 先申请, 学长刚蝈 : 出发，带我一个'
  - 新的插件 Plugins 波澜壮阔，我后续再写下一篇
- 'no': 6
  name: ChatGPT SEO与类SEO机会 —— 搜索即精准、精准即高转化
  points:
  - '**为什么需要这个概念？**'
  - '- 传统SEO依赖关键词匹配，流量精准度受限于搜索引擎算法'
  - '- 抖音“兴趣推荐+搜索”模式虽强但意图不如搜索/对话显性'
  - '- ChatGPT插件开放后，“搜索/对话”成为核心交互，蕴含极高商业转化潜力'
  - '**核心定义**'
  - '- ChatGPT SEO：基于ChatGPT“搜索/对话”核心交互模式产生的精准流量获取与商业转化红利'
  - '- 升级版抖音：ChatGPT凭借纯搜索/对话交互，具备更强个性化推荐能力与用户信任基础'
  - '- 类SEO：黑盒逆向工程，研读期刊/实测Prompt总结NLP规则，反向设计输入策略影响模型输出(品牌露出/推荐)'
  - '**关键性质**'
  - '- 搜索即精准：显性意图交互天然带来精准流量，转化率远超兴趣推荐'
  - '- 信任是商业起点：长期依赖/使用产生的信任感，是后续商业变现(SEO/推荐/交易)基础设施'
  - '- 传统SEO可迁移：联网爬虫兼容策略下，传统SEO体系(内容质量/关键词/外链)可直接迁移生效'
  - '**典型例子**'
  - '- 作者云飞：本地部署GPT-3.5，将工作流拆解为Prompt逐个训练，已成个人助理'
  - '- 交互模式对标：抖音(滑动/点赞/评论/搜索+兴趣推荐) vs ChatGPT(纯搜索/对话+高意图精准度)'
  - '**边界条件**'
  - '- 隐私与商业化矛盾：个性化推荐需访问隐私数据(购物历史等)，将引发信任危机'
  - '- 黑盒不确定性：模型参数/训练数据不公开，需持续研读期刊/实测Prompt逆向推导NLP规则'
  - '- 插件生态重构渠道：从“人找货”变“货找人”，商家可获深度用户数据制定策略'
  sources:
  - paper: docs/202303/20230328_132.md
    role: origin
  - paper: docs/202303/IkKOdu4oloVj41xpQ60c333qnoh.md
    role: improve
  excerpts:
  - ChatGPT 和用户的交互行为目前主要就是？搜索！搜索！搜索！！！
  - 搜索意味着精准，精准意味着高转化，顺着互联网流量的逻辑，大家就知道后续了
  - 相比而言，我认为它是升级版的抖音/TikTok，具有更强的个性化推荐能力
  - 依赖的结果就是对平台产生信任，而信任是商业的开始
  - 就是把我工作中常需要跟文字打交道的一些工作梳理出来，然后逐个梳理出流程，转化成 prompt 格式，逐个就训练啊
- 'no': 7
  name: 浏览器插件增强范式与Prompt即产品 —— 零门槛构建Mini Tool/Mini SaaS
  points:
  - '**为什么需要这个概念？**'
  - '- ChatGPT官方仅提供网页版，原生体验存在不足(无模板市场、无搜索同步、无场景原生嵌入)'
  - '- 非技术用户无法直接调用API，开发者面临“面向Google编程”低效痛点'
  - '- 需要一个零迁移成本、贴合用户习惯的产品形态快速验证需求'
  - '**核心定义**'
  - '- 浏览器插件增强范式：利用插件对网页版ChatGPT做体验升级，站在巨人肩膀上做增量创新'
  - '- 四大产品形态：提示词集成类(AIPRM)、文本处理类(ChatGPT Writer)、效率工具类(ChatGPT for Google)、业务赋能类(Shulex
    VOC/ChatGPT for Amazon)'
  - '- Prompt即产品范式：单条Prompt=Mini Tool，一组Prompts=Mini SaaS，核心竞争力从代码转移至Prompt工程'
  - '**关键性质**'
  - '- 最佳早期载体：网页增强能力天然贴合使用场景，零迁移成本，验证需求/积累用户/跑通商业最优'
  - '- 交互创新：触发模式(始终/问号/手动)平衡响应速度与成本/干扰，将控制权交还用户'
  - '- 场景原生嵌入：切入Gmail/Notion/Amazon原生输入框，实现“选中-指令-回填”闭环，无需上下文切换'
  - '- NLP能力平权：大模型消解垂直SaaS长尾建模瓶颈，实现全品类覆盖、秒出结果、体验跃迁'
  - '**典型例子**'
  - '- AIPRM：Prompt模板市场嵌入原生界面，精选Prompt限付费版($20/月)，60万+安装量验证付费意愿'
  - '- ChatGPT for Google：搜索侧边栏同步答案，触发模式控制调用，开源策略获100万+用户'
  - '- ChatGPT Writer：贴合Gmail写信框，场景原生嵌入驱动30万用户增长'
