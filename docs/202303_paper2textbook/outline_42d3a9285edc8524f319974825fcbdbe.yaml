    desc: 在抖音/小红书/视频号通过内容/直播/钩子获客，沉淀至微信私域完成高客单转化、复购裂变，流量尽头是微信私域。
    role: method
    src:
    - paper: docs/202303/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf.md
    - paper: docs/202303/Qb1ldkXAkoQSbpxr6M8cWibDnXg.md
  - 'no': 3
