- 'no': 3
  name: 流量获取与私域变现 —— 公域引流、私域沉淀、内容生产三板斧
  desc: 本章系统梳理流量生意底层逻辑：公域引流+私域变现闭环、内容生产“抄-杂交-原创”三阶跃迁、六大流量方法论×三渠道矩阵、IP崛起三阶段、私域管理五步法，构建从0到1的流量变现全链路。
  nodes:
  - 'no': 1
    name: 生意本质即流量定理
    desc: 所有好生意本质都是流量生意，商业闭环为流量→转化→成交→交付→复购/留存→新客增长，流量是启动飞轮唯一钥匙。
