- 'no': 4
  name: 实体门店与同城服务 —— 选址、转化、信任、爆品、私域留量
  desc: 本章聚焦线下门店与同城服务实操：选址定终身但好地址≠好生意，转化率是核心护城河；买客户思维付费引流、100+触点布局、超级爆品引流、营销日历体系化、私域留量>流量、老板亲自抓引流成交、全员引流与资产归属管理。
  nodes:
  - 'no': 1
    name: 选址只是入场券，转化才是赢利点
    desc: 选址解决被看见概率，非被购买确定性；门店盈利关键在于进店率、转化率精细化运营。
    role: motivation
    src:
    - paper: docs/202303/20230328_153.md
  - 'no': 2
    name: 转化率护城河：倒逼全链路升级
    desc: 高转化率能倒逼产品/服务/团队全方位进步，支撑高客单引流策略，形成降维打击竞争壁垒。
    role: proof
    src:
    - paper: docs/202303/20230328_154.md
  - 'no': 3
    name: 引流前提定律：无转化，不引流
    desc: 前端引流有效性完全取决于后端转化体系成熟度；转化率未达标盲目引流等同放大亏损。
    role: definition
    src:
    - paper: docs/202303/20230328_154.md
  - 'no': 4
    name: 买客户思维：付费引流ROI正向即加码
    desc: 将引流成本视为投资，计算ROI，正向盈利即持续加大付费投放，打破免费引流执念，实现流量规模化可控化。
    role: method
    src:
    - paper: docs/202303/20230328_154.md
  - 'no': 5
    name: 引流触点布局：里里外外最少100条鱼竿
    desc: 门店内外物理空间密集设置带钩子(行动理由)的引流入口(收银台/厕所/海报/周边500-1000米异业联盟/社群/社区)，构建全方位获客网络。
    role: method
    src:
    - paper: docs/202303/20230328_154.md
  - 'no': 6
    name: 超级爆品引流法：核心招牌产品即最佳引流品
    desc: 摒弃廉价赠品，打磨门店核心招牌产品(爆品)作为引流品，极致性价比吸引精准客群，连带销售实现利润转化。
    role: method
    src:
    - paper: docs/202303/20230328_154.md
  - 'no': 7
    name: 营销日历体系：年/季/月/周提前规划
    desc: 按维度提前规划活动节奏(常规/节日/大促/随机/会员日)，确保每周有活动、有备无患，避免临时起意执行失效。
    role: method
    src:
    - paper: docs/202303/20230328_154.md
  - 'no': 8
    name: 私人订制引流方案：精准而非数量
    desc: 基于门店目标、基础、竞争环境、转化路径量身定制，反对盲目跟风抄袭，追求精准而非数量，方案同质化是客源同质化与恶性价格战根源。
    role: method
    src:
    - paper: docs/202303/20230328_154.md
  - 'no': 9
    name: 留量大于流量：私域沉淀飞轮
    desc: 核心稀缺资源非外部流量，而是将进店客户沉淀私域，标签化运营、朋友圈营销、激励裂变挖掘老客复购转介绍，建立可持续增长飞轮。
    role: method
    src:
    - paper: docs/202303/20230328_154.md
  - 'no': 10
    name: 老板亲自抓引流成交：时刻干离钱最近的事
    desc: 老板必须作为核心销售亲自掌握执行引流/成交/转化/复购全链路，拒绝外包拓客团队或全权委托员工，确保方案精准度与客户资产掌控权。
    role: method
    src:
    - paper: docs/202303/20230328_154.md
  - 'no': 11
    name: 全员引流与私域资产归属：绩效挂钩+专属手机隔离
    desc: 建立全员引流责任制，绩效挂钩引流指标；老板配专属工作手机/微信给员工，法律协议锁定客户资源归属，防员工离职带走资产。
    role: method
    src:
    - paper: docs/202303/20230328_154.md
  - 'no': 12
    name: 门头转化滑滑梯模型：曝光-信任-下单
    desc: 门头设计为系统工程：180度灯光灯箱矩阵最大化曝光→身份+承诺+价值观显性化建立信任→显性优惠+会员二维码双重互惠驱动进店。
    role: method
    src:
    - paper: docs/202303/QdPkd1IM2orhqFxaAXCcM6fynsc.md
  - 'no': 13
    name: 注意力抢夺成本核算：微小投入撬动流量
    desc: 单灯箱投入500-800元+日电费5元，按日增1客利润10元测算160天回本，无灯箱年损失3650元利润，论证抢夺注意商业合理性。
    role: experiment
    src:
    - paper: docs/202303/QdPkd1IM2orhqFxaAXCcM6fynsc.md
  - 'no': 14
    name: 信任显性化定律：信任必须写在门头上
    desc: 信任不依赖进店体验或口述，而通过身份标识、风险承诺、价值观三大类文本/视觉符号显性化陈列门头，实现一眼知信、降低决策门槛。
    role: definition
    src:
    - paper: docs/202303/QdPkd1IM2orhqFxaAXCcM6fynsc.md
  - 'no': 15
    name: 存量位置增值论：好位置不如好门头运营
    desc: 即使偏僻内巷、竞争对手占优位置，通过门头系统化运营仍可实现转化率反超，精细化运营优于盲目追求新流量新位置。
    role: proof
    src:
    - paper: docs/202303/QdPkd1IM2orhqFxaAXCcM6fynsc.md
- 'no': 5
  name: 电商与跨境出海 —— 平台算法、选品、供应链、站外推广、品牌化
  desc: 本章覆盖亚马逊精细化流量识别、闲鱼二手书非标品运营、小红书种草引流、独立站/Etsy注册运营、站外推广三大价值与自助平台模式、TikTok/跨境工具站航海实战，揭示从盲目烧广告到精细化匹配、从单一平台到多渠道品牌化的进阶路径。
  nodes:
  - 'no': 1
    name: 亚马逊运营核心矛盾转移：流量获取难→流量识别与匹配难
    desc: 过去核心矛盾是流量获取难，当前核心矛盾是流量识别与匹配难；赚钱取决于对消费者行为数据理解深度与执行精细度，而非单纯资本投入。
    role: motivation
    src:
    - paper: docs/202303/20230328_083.md
  - 'no': 2
    name: 关键词五维分级体系
    desc: 按相关度与订单规模划分五类：高度相关大词/中词、弱相关大词、看似相关实则无关、完全无关，为精细化广告投放与Listing优化基础框架。
    role: definition
    src:
    - paper: docs/202303/20230328_083.md
  - 'no': 3
    name: 竞品蹭流策略：低客单+组合购买习惯品类
    desc: 放弃对抗头部核心大词，优化Listing使算法识别为高相关竞品，共享竞品详情页关联推荐免费流量，零广告日出百单。
    role: method
    src:
    - paper: docs/202303/20230328_083.md
  - 'no': 4
    name: 产品-流量渠道匹配度：属性决定战略
    desc: 标品/低价/高频走搜索+关联流量；非标/高价/强视觉/强社交走网红内容/品牌流量。违背铁律强行跑搜索广告必亏损。
    role: proof
    src:
    - paper: docs/202303/20230328_083.md
  - 'no': 5
    name: 电商六步成交公式：Credibility+USP+User Benefit+Question Killer+Social Proof+Lure(CTA)
    desc: 覆盖信任建立、差异化价值、用户收益、异议处理、社会背书、行动召唤六环节的通用转化框架，适用图片/视频/文案/直播所有触点。
    role: method
    src:
    - paper: docs/202303/20230328_083.md
  - 'no': 6
    name: 闲鱼二手书非标品：笨功夫优于技术流
    desc: 人工精选图片、手动上架、人工养号(点想要/控价格)显著提升点击转化，优于批量采集/软件铺货；真实感与从众心理是转化核心。
    role: method
    src:
    - paper: docs/202303/20230328_086.md
  - 'no': 7
    name: 小白创业销售优先于供应链公理
    desc: 产品过剩时代，小白核心稀缺能力是销售/获客而非供应链/货源；销售端跑通后供应链反向寻找销售端；倒置优先级是伪勤奋与逃避困难。
    role: proof
    src:
    - paper: docs/202303/20230328_086.md
  - 'no': 8
    name: 社区工作室轻量化组织模型
    desc: 小区低租金场地雇佣兼职大学生按件结算，操作30-50账号矩阵，标准化SOP规模化复制，固定成本极低，利润率远超实体仓库模式。
    role: method
    src:
    - paper: docs/202303/20230328_086.md
  - 'no': 9
    name: 小红书种草引流：用户故事+经验分享双模板
    desc: 用户故事模板(背景-困难-贵人/秘籍-成功)爆款率超20%；经验分享模板(人设+心得)侧重专业干货；主人公必须是用户非品牌。
    role: method
    src:
    - paper: docs/202303/HZ2RdrAmXoYDl5xT3l2c8wD8nPg.md
  - 'no': 10
    name: 关键词流量分层策略：高/中/尾部差异化投放
    desc: 按搜索热度分层匹配内容类型：高热投原创故事/经验，中等混投，尾部投营销/修改笔记，最大化流量覆盖面。
    role: method
    src:
    - paper: docs/202303/HZ2RdrAmXoYDl5xT3l2c8wD8nPg.md
  - 'no': 11
    name: 修改笔记策略：低成本收割长尾流量
    desc: 修改历史爆款笔记植入品牌信息，借助长尾流量(发布一年后互动增70%)获取曝光，贡献超50%总流量，性价比最高。
    role: method
    src:
    - paper: docs/202303/HZ2RdrAmXoYDl5xT3l2c8wD8nPg.md
  - 'no': 12
    name: 尾部达人高性价比投放：1万粉以下/300元以内
    desc: 放弃大博主(关注流量仅占1%)，主攻尾部达人，靠优质内容获推荐流量(占比99%)，极低成本规模化铺量。
    role: method
    src:
    - paper: docs/202303/HZ2RdrAmXoYDl5xT3l2c8wD8nPg.md
  - 'no': 13
    name: 站外推广三大核心价值：辅助运营/清库存/打造品牌
    desc: 激活链接/配合秒杀/出单索评/维护排名/稀释退货率/绑定FBT/直接盈利；对比Outlet/线下收库存优势清库存；应对广告成本高企建立自带流量品牌护城河。
    role: definition
    src:
    - paper: docs/202303/20230328_085.md
  - 'no': 14
    name: 自助式站外推广平台模式：资源透明化/标准化/SaaS化
    desc: 将数百FB群组/Deal站资源标准化透明化，卖家自主选品类/粉丝量/价格/时间下单，批量采购压低单价(30万粉群低至9.9元)，解决找资源难/时差沟通累/单次采购贵/资源重叠/数据不透明痛点。
    role: method
    src:
    - paper: docs/202303/20230328_085.md
  - 'no': 15
    name: Etsy注册全流程SOP与欺诈分值模型
    desc: 11步标准化注册作业；多维加权打分系统，资料真实度/IP纯净度/卡段重复率/产品合规度/运营异常度计入分值，超临界值触发封店；全维度向真实正常用户逼近才能压低欺诈分。
    role: method
    src:
    - paper: docs/202303/20230328_174.md
  - 'no': 16
    name: 新手入场劝退定理：无海外真实人脉预期收益为负
    desc: 无可信海外人脉(真实身份/地址/银行卡/电脑/IP)的国内新手，因资料重复率高/环境模拟成本大/风控不可控，入场Etsy预期收益为负，建议直接放弃。
    role: limitation
    src:
    - paper: docs/202303/20230328_174.md
- 'no': 6
  name: 垂类深耕与非标服务 —— 知识付费、陪诊、同城相亲、家庭教育、成人用品外卖
  desc: 本章深度剖析五大垂直赛道的非标服务变现模型：知识IP本质是陪伴者、高客单价非标服务门槛护城河、陪诊从卖体力进化到卖资源/渠道、同城相亲信任>流量服务>营销、家庭教育三圈定位与场景化优势、成人用品即时配送解决临时隐私痛点，揭示深度服务构建护城河的通用规律。
  nodes:
  - 'no': 1
    name: 知识IP本质：从知道到做到的陪伴者
    desc: 核心价值不在于知识本身(书/PPT可替代)，而在于帮助客户消化知识、落地实操、获得真实改变；必须提供陪伴/指导/情感链接/人设信任支撑高客单价。
    role: definition
    src:
    - paper: docs/202303/20230328_161.md
  - 'no': 2
    name: 高客单价非标服务门槛护城河理论
    desc: 进入门槛低但做高客单价门槛高，核心壁垒在于持续迭代产品能力与解决非标个性化实际问题能力结合；大咖不做陪伴/价格高，低价课无服务，中间存在巨大市场真空。
    role: proof
    src:
    - paper: docs/202303/20230328_161.md
  - 'no': 3
    name: 教育付费决策痛点滞后性原理
    desc: 教育结果在未来导致痛点感知滞后：问题未严重痛点不足付费意愿低；问题严重即时反馈弱解决周期长。高客单客群仅来自高认知前置投资者与痛苦极致求救者。
    role: motivation
    src:
    - paper: docs/202303/20230328_161.md
  - 'no': 4
    name: 信任资产复利原则
    desc: 私域高成交核心基础是长期累积信任资产：线下服务信任/社群分享信任/朋友圈持续输出信任；信任建设需时间但一旦形成支撑高客单快速成交(最快20分钟)且抗周期性强。
    role: proof
    src:
    - paper: docs/202303/20230328_161.md
  - 'no': 5
    name: 三圈交叉定位法+场景化优势验证
    desc: 热爱/优势/市场需求三圈交集定赛道；将抽象优势置于具体业务场景验证转化，形成可支撑交付的核心能力清单而非通用简历标签。
    role: method
    src:
    - paper: docs/202303/20230328_161.md
  - 'no': 6
    name: 家长分层模型与差异化产品设计
    desc: 按学习方式/付费意识/问题紧迫度分三类：自助解决型(低付费)、系统学习型(中客单)、深度陪伴型(高客单)；锁定目标客群设计系统课程+高频陪伴指导+无期限服务的高客单产品。
    role: method
    src:
    - paper: docs/202303/20230328_161.md
  - 'no': 7
    name: 免费咨询转化六步法+公开课漏斗设计
    desc: 高客单标准化销售话术：现状了解→时间跨度确认→关键事件唤起痛点→自我努力复盘暴露缺口→植入案例放大痛点→二选一推动自我说服；公开课三段式：场景代入→思维局限拆解→品牌故事案例展示→赠测评工具→引导转化。
    role: method
    src:
    - paper: docs/202303/20230328_161.md
  - 'no': 8
    name: 陪诊从业者成长三阶段：卖体力→卖专业/流量→卖资源/渠道
    desc: 一阶段自己跑单挂号收入上限低；二阶段试管陪诊/派单分成/教学/加盟建立杠杆；三阶段绿通/院内制剂/药械进院/海外就医/基因检测构建护城河。
    role: extension
    src:
    - paper: docs/202303/ScDWdhjkHolKzAxyHpjclEDsnMg.md
  - 'no': 9
    name: 护城河产品：试管陪诊高频长周期强依赖
    desc: 单周期需陪诊15次，高频次、长周期、强依赖特性支撑高客单价、高留存，是核心竞争壁垒。
    role: definition
    src:
    - paper: docs/202303/ScDWdhjkHolKzAxyHpjclEDsnMg.md
  - 'no': 10
    name: 医疗资源整合变现：绿通/院内制剂/私立海外就医/基因检测
    desc: 基于医院科室资源/医生关系/院外机构合作，将获取难的医疗资源转化为可介绍可分成商业产品；绿通费5000-20000元压缩等待期；海外就医返佣实收8-20%。
    role: method
    src:
    - paper: docs/202303/ScDWdhjkHolKzAxyHpjclEDsnMg.md
  - 'no': 11
    name: 同城相亲核心壁垒：信任>流量，服务>营销
    desc: 本质是私域服务业，长期生存不依赖流量红利，核心壁垒：线下高频活动构建物理信任锚点、高情商红娘提供不可标准化深度情感交付、时间复利下客户转介绍网络。
    role: proof
    src:
    - paper: docs/202303/20230328_155.md
  - 'no': 12
    name: 三层产品阶梯：活动解决信任→互动群筛选→一对一红娘核心利润
    desc: 入门级线下活动解决信任(不以盈利为目的)；互动型线上群维持活跃筛选；一对一高客单(几千至几万)为核心利润来源，形成完整商业闭环。
    role: method
    src:
    - paper: docs/202303/20230328_155.md
  - 'no': 13
    name: 付费流量降维打击：毛利率~100%决定投流上限
    desc: 同城相亲无实体成本、高客单、极高毛利，同城付费投流(抖加/信息流)可行且具降维打击优势；同行多不投/不敢投，精准获客成本百元级远低于客户LTV。
    role: method
    src:
    - paper: docs/202303/20230328_155.md
  - 'no': 14
    name: 成人用品即时配送模式：外卖平台解决临时/隐私/即时痛点
    desc: 利用美团/饿了么作流量入口交易闭环，骑手30-60分钟送达替代电商3-5天物流及线下尴尬感；夜场/酒吧/酒店/大学城周边为核心选址变量。
    role: definition
    src:
    - paper: docs/202303/20230328_081.md
  - 'no': 15
    name: 轻资产夫妻店模型：<5万投入/10平米/两人倒班
    desc: 家庭/夫妻/宝妈核心劳动力，场地在家/车库10平米，两人白夜倒班接单装货，低风险、高现金流、可复制微型创业单元，单店月纯利3.9-6万。
    role: method
    src:
    - paper: docs/202303/20230328_081.md
  - 'no': 16
    name: 竞品SKU复刻与错位定价：同品微降价+物理隔离
    desc: 抓取头部竞品高销量SKU清单，复制核心品类结构，同品微降价+选址物理隔离策略，快速获平台算法推荐流量，规避正面价格战。
    role: method
    src:
    - paper: docs/202303/20230328_081.md
- 'no': 7
  name: 选品与供应链 —— 刚需高频、源头把控、动态定价、分级售后
  desc: 本章提炼跨品类选品通用标准(刚需/高频/高粘性/高客单)及供应链实操方法论：源头现采模式、动态成本定价、分级售后包装体系、OEM合作放大器、京东令牌价供应链、茶叶榨香工艺与锚定高价SKU策略。
  nodes:
  - 'no': 1
    name: 刚需/高频/高粘性产品优先论
    desc: 选品核心标准：刚需(奶粉/考证/祛斑)>高频复购>低退货率(祛斑30% vs 服饰高退货)>高客单利润空间；产品属性决定商业模式上限。
    role: definition
    src:
    - paper: docs/202303/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf.md
  - 'no': 2
    name: 源头现采模式：用户昨天下单今天采集最新鲜货当天发出
    desc: 利用一级批发市场地理优势，零库存极致鲜度供应链；每日跑市场询价现场试吃选品自主打包发货，价格比零售低20%以上且品质可控。
    role: method
    src:
    - paper: docs/202303/20230328_156.md
  - 'no': 3
    name: 水果选品与定价三原则：好货抢跑/应季待熟/动态成本定价
    desc: 每日早市现采发现好货即买即卖错过不补；按口感成熟度而非日历上架；每日跟踪一级市场价格波动实时调整售价，宁缺毋滥不卖次品。
    role: method
    src:
    - paper: docs/202303/20230328_156.md
  - 'no': 4
    name: 分级售后包装体系：源头/物流/售后全链路降损
    desc: 源头自采把控拒绝久放果；物流差异化包装SOP(何果多包层/垫纸/配冰袋)；售后快团团红包秒赔降低沟通成本促进复购。
    role: method
    src:
    - paper: docs/202303/20230328_156.md
  - 'no': 5
    name: OEM合作放大器：供应链标准化与渠道裂变分离
    desc: 教育机构构建标准化证书/课程供应链(选品/录制/技术/教务/证书下发)，通过OEM招募渠道合伙人承担获客成本，自身聚焦供应链交付，营收700万→1500万/年。
    role: method
    src:
    - paper: docs/202303/20230328_021.md
    - paper: docs/202303/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf.md
  - 'no': 6
    name: 京东令牌价供应链：线下加盟商内部进货价差套利
    desc: 加盟商内部账户享受进货价(令牌价)远低于前台价(如电视前台16999 vs 令牌价8999)；区域保护政策导致不同地区价格差异；京东自营物流+品牌安装+官方售后消除信任顾虑。
    role: experiment
    src:
    - paper: docs/202303/20230328_074.md
  - 'no': 7
    name: 代理裂变模式：主方供给供应链/报价/售后兜底，代理负责前端获客
    desc: 不直接面向C端零售，招募代理提供供应链支持，互利共赢行稳致远；从个人单干到110人团队年营业额300万，计划扩至500人。
    role: method
    src:
    - paper: docs/202303/20230328_074.md
  - 'no': 8
    name: 茶叶榨香工艺与锚定高价SKU策略
    desc: 标准炒茶基础上增加1-2道工序(榨香)提升香气兼顾重量诚实度；店铺上架极高客单价非主销品(狮峰龙井4500元/斤)作价格锚点，降低主推款心理支付门槛。
    role: method
    src:
    - paper: docs/202303/20230328_136.md
  - 'no': 9
    name: 好女婿/丈母娘茶园人设：真实姻亲关系自带信任背书
    desc: 打造好女婿帮丈母娘卖茶朴实人设，自带自家茶园/无农药/源头直发信任背书，消解微商标签信任危机；手机随手拍实景构建茶农本分感。
    role: method
    src:
    - paper: docs/202303/20230328_136.md
- 'no': 8
  name: 组织与人才 —— 管理三阶层、人才三层次、价值观优先、合伙人性格相融
  desc: 本章系统梳理组织进化路径：自我管理→团队管理→组织管理(间接管理)三阶层；使用者/探索者/造物者三层次人才模型，招聘核心招参与者；价值观=1能力=0筛选公式；合伙人选性格相融而非互补/相似；捧千里马/消灭耗子/清理老白兔人才盘点法。
  nodes:
  - 'no': 1
    name: 管理三阶层：直接管理→间接管理进阶
    desc: 自我管理(直接)→团队管理(直接)→组织管理(间接，给不认识的人定制度发工资)，管理能力进阶路径。
    role: definition
    src:
    - paper: docs/202303/20230328_004.md
  - 'no': 2
    name: 人才三层次模型：招参与者而非使用者
    desc: 按认知深度分使用者(观察者)、探索者(思考者)、造物者(参与者)；招聘核心原则招参与者，造物者视角能主动发现问题并解决。
    role: method
    src:
    - paper: docs/202303/20230328_004.md
  - 'no': 3
    name: 价值观优先原则：价值观=1，能力=0
    desc: 人才筛选公式：价值观不合能力再强风险越大，因能力可培养但价值观难改；价值观越吻合风险越低。
    role: method
    src:
    - paper: docs/202303/20230328_004.md
  - 'no': 4
    name: 合伙人选择性格相融法：宽容理解差异
    desc: 拒绝单纯互补或相似，主张性格相融(宽容理解差异)，核心指向认知宽容度；最大矛盾是你怎么这么对我，最大和解是他就是这个德行。
    role: method
    src:
    - paper: docs/202303/20230328_004.md
  - 'no': 5
    name: 人才盘点：捧千里马/消灭耗子/清理老白兔
    desc: 提高坏流失率降低好流失率，分类处理核心骨干/有害分子/平庸占坑者。
    role: method
    src:
    - paper: docs/202303/20230328_004.md
  - 'no': 6
    name: 招聘快慢法则：招人要慢开人要快
    desc: 管理者对员工一丁点不满员工即可感知，延迟解聘仅增加沉没成本与组织毒性；一旦不想用应第一时间开掉。
    role: method
    src:
    - paper: docs/202303/20230328_004.md
  - 'no': 7
    name: 管理底线即员工行为底线定理
    desc: 员工会不断试探管理底线直到突破，管理者容忍度决定团队纪律下线。
    role: proof
    src:
    - paper: docs/202303/20230328_004.md
- 'no': 9
  name: 股权与顾问模式 —— 动态公平、记账法、咨询即尽调、市场价锚定
  desc: 本章解决早期公司股权分配与顾问介入痛点：动态公平性机制应对投入度变化、顾问记账法(按市场价记账→利润线触发现金/折股结算→里程碑跟投)实现风险共担利益绑定、深度运营参与即高质量尽调复刻贝恩模式、辅助工种市场价现金清算预防股权敲诈。
  nodes:
  - 'no': 1
    name: 股权分配动态公平性：非常态一次性切分
    desc: 建立机制应对合伙人投入度/人生阶段/资源贡献随时间变化，核心锁定关键人、平衡短期生存与长期激励。
    role: definition
    src:
    - paper: docs/202303/20230328_006.md
  - 'no': 2
    name: 顾问记账法三阶段：记账→利润线结算→里程碑跟投
    desc: 阶段一按市场报价记账确认价值；阶段二设定利润触发线盈利后现金或折股结算分担风险；阶段三约定业绩里程碑享有跟投权深度绑定信息优势转化为投资优势。
    role: method
    src:
    - paper: docs/202303/20230328_006.md
  - 'no': 3
    name: 咨询即尽调、投资即落地：贝恩模式同构
    desc: 顾问深度参与运营(相当CEO/COO)过程本质是高质量尽调，掌握真实数据后决策投资，极大降低信息不对称与被坑风险，复刻贝恩战略咨询+主权投资一体化逻辑。
    role: proof
    src:
    - paper: docs/202303/20230328_006.md
  - 'no': 4
    name: 辅助工种市场价锚定：现金结算+合同留痕
    desc: 非核心半白嫖工种以市场价付费签协议留证，切断低成本投入换高股权预期套利路径，将隐性股权成本显性化为财务成本。
    role: method
    src:
    - paper: docs/202303/20230328_006.md
  - 'no': 5
    name: 早期合伙核心矛盾：贡献度动态度量与静态股权固化冲突
    desc: 合伙人技能稀缺度/投入度随时间变化，静态分股必然导致后续扯皮；解决之道在于建立动态调整机制(期权池/分期授予/业绩触发)而非寻求完美初始切分。
    role: limitation
    src:
    - paper: docs/202303/20230328_006.md
- 'no': 10
  name: Web3与新技术红利 —— 五大差框架、周期择时、AI赋能、类SEO布局
  desc: 本章前瞻Web3与AI新赛道：普通人变现五大差框架(信息/认知/执行/资源/权力差)、熊市入局优先论、Web2经验迁移论、ChatGPT升级版个性化推荐平台与类SEO黑盒逆向工程、AI模特商业化红海蓝海悖论与共生共存定律、先发入局窗口期理论。
  nodes:
  - 'no': 1
    name: Web3变现五大差叠加：信息差/认知差/执行差/资源差/权力差
    desc: 普通人从0到1变现本质是主动构建或利用五维非对称优势，而非单纯资金投机；信息差三步走(魔法上网→可靠信息源→克服英文恐惧)；执行差三位一体(工具/逻辑/安全)。
    role: definition
    src:
    - paper: docs/202303/20230328_049.md
  - 'no': 2
    name: Web3重塑权力结构：抹掉旧权力差+建立新权力差
    desc: 本质价值在于抹掉中心化准入/审查/垄断旧权力差，建立去中心化身份/治理权/声誉/资产主权新权力差，普通人应主动参与后者成为新秩序受益者。
    role: extension
    src:
    - paper: docs/202303/20230328_049.md
  - 'no': 3
    name: 熊市入局优先论：噪音少/竞争弱/估值低/团队专注建设
    desc: 熊市更适合普通人低成本试错、深度学习、积累核心资源(人脉/技能/筹码)，为牛市收割奠基。
    role: method
    src:
    - paper: docs/202303/20230328_049.md
  - 'no': 4
    name: Web2经验迁移论：教书/电商/设计技能无缝迁移Web3运营/投研/社区/发行
    desc: 作者亲历证明Web2核心技能可无缝迁移Web3岗位，是普通人转型核心杠杆。
    role: experiment
    src:
    - paper: docs/202303/20230328_049.md
  - 'no': 5
    name: ChatGPT是升级版个性化推荐平台：搜索/对话单一高意图交互
    desc: 基于纯搜索/对话交互模式，具备比抖音/TikTok更强个性化推荐能力和商业转化潜力；信任源于依赖，依赖源于不可替代性。
    role: motivation
    src:
    - paper: docs/202303/IkKOdu4oloVj41xpQ60c333qnoh.md
  - 'no': 6
    name: 类SEO：逆向推导GPT自然语言处理规则与过滤机制
    desc: 区别于传统SEO，核心在于黑盒逆向工程：研读期刊/实测Prompt响应模式，总结NLP规则与过滤机制，反向设计输入策略影响模型输出(品牌露出/推荐)。
    role: method
    src:
    - paper: docs/202303/IkKOdu4oloVj41xpQ60c333qnoh.md
  - 'no': 7
    name: AI模特商业化红海蓝海悖论：从业者多但商业落地者极少
    desc: 表面红海实则蓝海，核心壁垒在于技术稳定性与商业交付能力结合而非单纯模型调用；100+博主仅1-2家达商业摄影级应用标准。
    role: limitation
    src:
    - paper: docs/202303/XrPAdRpZKomTgrxPZ3Ac1Ejonso.md
  - 'no': 8
    name: AI模特商用门槛：95-100%版型准确率+真人感审美
    desc: 服装版型必须与实物95-100%一致任何偏差不可交付需PS兜底；审美需符合电商真假难辨真人感而非CG假人感，模特选型光影氛围决定转化率。
    role: definition
    src:
    - paper: docs/202303/XrPAdRpZKomTgrxPZ3Ac1Ejonso.md
  - 'no': 9
    name: AI模特技术双路线：全量训练vs换脸替身
    desc: 路线一8-20张服装图训练LoRA/3D虚拟建模效果理想但耗时耗力高；路线二不训练衣物模型直接换脸低成本但姿势受限操作空间小。
    role: method
    src:
    - paper: docs/202303/XrPAdRpZKomTgrxPZ3Ac1Ejonso.md
  - 'no': 10
    name: AI模特与传统摄影共生共存定律
    desc: AI覆盖标准化SKU(基础款)；传统摄影覆盖高精度/高细节品类(珠宝/高定/美妆)及实拍心智需求，长期共生关系。
    role: proof
    src:
    - paper: docs/202303/XrPAdRpZKomTgrxPZ3Ac1Ejonso.md
  - 'no': 11
    name: 先发入局窗口期：技术跨越商用门槛未普及标准化
    desc: 当前最佳入局时间：技术已达商用门槛但未普及标准化，竞争者多停留玩票阶段；延后入局面临红海价格战且丧失客户资源积累与技术迭代红利。
    role: motivation
    src:
    - paper: docs/202303/XrPAdRpZKomTgrxPZ3Ac1Ejonso.md
- 'no': 11
  name: 游戏与虚拟经济变现 —— 现象级MMO红利窗口、需求挖掘四维、代练分级、私域终极容器
  desc: 本章以逆水寒手游为核心案例，拆解现象级MMORPG变现全图谱：公测前3-6个月红利窗口、需求挖掘四维法(时间/技能/社交/资源)、代练分级交付体系、游戏内经济套利模型、内容型流量矩阵、卖水理论(服务商优先)、赛季制无束缚交易红利放大器、私域为游戏变现终极容器。
  nodes:
  - 'no': 1
    name: 现象级MMO变现窗口期：公测前3-6个月黄金期
    desc: 海量流量涌入、玩家认知差大、付费意愿最强、机制未成熟，普通人入场最佳机会；越早入场吃到红利越多。
    role: motivation
    src:
    - paper: docs/202303/20230328_168.md
    - paper: docs/202303/OZ53d6t4vovziPxkUyZc8qrNnjc.md
  - 'no': 2
    name: 需求挖掘四维法：痛点映射商业产品
    desc: 从时间成本(卖代练/代肝)、技能门槛(卖攻略/插件/成品号)、社交情绪(卖陪玩/车队/公会服务)、资源稀缺(卖搬砖教程/交易渠道/避坑指南)四维度系统拆解玩家痛点。
    role: method
    src:
    - paper: docs/202303/20230328_168.md
  - 'no': 3
    name: 卖水理论：服务商优先于淘金者
    desc: 高风险红利期直接参与资源竞争承担波动与封号风险；为竞争者提供稳定工具/服务/信息/流量(卖水/卖铲子)获确定性现金流和平台级红利。
    role: proof
    src:
    - paper: docs/202303/20230328_168.md
    - paper: docs/202303/OZ53d6t4vovziPxkUyZc8qrNnjc.md
  - 'no': 4
    name: 代练/托管分层体系：基础日常→精英托管→大号打造顾问
    desc: 基础包月几百元靠量；精英月薪几千需精通机制零红点；大号打造顾问参与充值决策冲榜规划高客单高粘性；零红点交付标准建立信任。
    role: method
    src:
    - paper: docs/202303/OZ53d6t4vovziPxkUyZc8qrNnjc.md
  - 'no': 5
    name: 搬砖工作室多开脚本套利：金价衰减规律与双渠道博弈
    desc: 多开器+脚本突破单账号上限规模化产出；官方藏宝阁(价低安全慢)vs线下私下交易(溢价30-100%秒到账大额回头客但高风控/诈骗风险)；核心竞争力在账号批量注册渠道与反风控技术。
    role: method
    src:
    - paper: docs/202303/OZ53d6t4vovziPxkUyZc8qrNnjc.md
  - 'no': 6
    name: 教学主播IP化运营：看号引流→教学建权威→文档/社群收费→高客单服务转化
    desc: 内测抢跑构建知识库→直播看号低门槛高频互动引流+教学讲解建权威→文档/社群变现(办卡/付费群/收徒)→筛选高净值用户转化托管/打造单；必须从单纯看号向教学IP转型延长生命周期。
    role: method
    src:
    - paper: docs/202303/OZ53d6t4vovziPxkUyZc8qrNnjc.md
  - 'no': 7
    name: 赛事操盘：圈子联盟垄断资源操控比赛进程
    desc: 超越单纯代打技术，组建高端圈子垄断优质大号资源，操控比赛进程(安排友商让分/包揽名额)最大化赛事奖金收益；作者天刀手游两赛季实操收入40万+验证高杠杆可复制性。
    role: experiment
    src:
    - paper: docs/202303/OZ53d6t4vovziPxkUyZc8qrNnjc.md
  - 'no': 8
    name: 私域是游戏变现终极容器：公域仅作钩子与漏斗
    desc: 游戏内/公域规则限制强流量不可控难承载高客单复杂服务；所有高客单非标服务(托管/打造/代打/赛事/定制设计)必须沉淀微信私域完成信任构建/需求确认/收款交付/售后维权/复购裂变全链路。
    role: definition
    src:
    - paper: docs/202303/OZ53d6t4vovziPxkUyZc8qrNnjc.md
  - 'no': 9
    name: 非标服务标准化交付是规模化前提
    desc: 游戏服务天然非标，实现规模化关键在于建立SOP：代练定零红点标准、代打定段位/胜场/时长标准、指挥定复盘/战术库/执行力标准、设计定出图速度/修改次数/格式标准，标准化才能复制人员批量接单品牌化溢价。
    role: method
    src:
    - paper: docs/202303/OZ53d6t4vovziPxkUyZc8qrNnjc.md
- 'no': 12
  name: 混圈与向上社交 —— 等价交换、付费筛选、价值锚定输出、核心圈层不可买
  desc: 本章重新定义混圈本质：基于等价交换的价值连接而非单向索取；付费入场筛选高意愿人群、持续输出价值(整理/解答/创作)建立人设反向吸引大佬、免费打工人/资料整理/长曝光三步连接大佬、核心圈层邀请制不可买只能通过价值输出被邀请进入、先表达者红利定律。
  nodes:
  - 'no': 1
    name: 等价交换原则：世界不变原则
    desc: 混圈必须付出(金钱/内容/劳务)获得相应回报(信息/人脉/机会)；优秀的人优秀的内容永远双向奔赴。
    role: definition
    src:
    - paper: docs/202303/20230328_015.md
  - 'no': 2
    name: 付费筛选机制：金钱门槛过滤低质量成员
    desc: 利用金钱门槛留存高意愿高执行力人群降低信任建立成本，是进入核心圈层最高效入场券；付费用户更易被记住。
    role: method
    src:
    - paper: docs/202303/20230328_015.md
  - 'no': 3
    name: 价值锚定输出：整理资料/解答问题/优质内容/复盘手册
    desc: 持续产出有形价值产物锚定专业人设，反向吸引大佬关注与商业机会；优化稿单价3000-10000+；输出足够优质可加入大佬私人群。
    role: method
    src:
    - paper: docs/202303/20230328_015.md
  - 'no': 4
    name: 三步连接大佬战术：免费劳务+资料整理+长曝光
    desc: 零成本博取大佬信任：群友问问题转发大佬过往分享、合并转发大佬群消息、收集整合资料长曝光刷存在感，长期坚持多数提问可快速得答案。
    role: method
    src:
    - paper: docs/202303/20230328_015.md
  - 'no': 5
    name: 核心圈层不可买论：真核心圈子邀请制
    desc: 真核心圈子具有邀请制属性无法用金钱直接购买，只能通过持续价值输出被邀请进入；付费圈仅为外围筛选层。
    role: proof
    src:
    - paper: docs/202303/20230328_015.md
  - 'no': 6
    name: 先表达者红利定律：主动优先持续表达占据注意力与信任红利
    desc: 自媒体互联网环境下，主动优先持续表达者天然占据注意力红利与信任红利，更易获得商业机会与核心人脉。
    role: proof
    src:
    - paper: docs/202303/20230328_015.md
  - 'no': 7
    name: 混圈必经三阶段：信息获取→筛选沉淀→价值共创
    desc: 新手必经：广撒网不辨真伪→隐退无用圈明确目的→双向输出深度连接变现。
    role: extension
    src:
    - paper: docs/202303/20230328_015.md
- 'no': 13
  name: 个人IP与内容变现 —— 表达者红利、视觉钩子、朋友圈专栏化、低成本高杠杆
