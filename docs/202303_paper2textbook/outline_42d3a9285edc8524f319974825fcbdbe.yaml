- 'no': 1
  name: 认知重塑与商业思维 —— 从打工惯性到老板心法
  desc: 本章剖析普通人创业的核心认知障碍：打工人惯性、责任外包心理、确定性幻觉，并确立知识付费“避坑工具”定位、项目分层匹配能力圈、执行力内驱力建设等底层心法。
  nodes:
  - 'no': 1
    name: 打工人惯性与内驱力缺失
    desc: 长期职场形成的依赖外部制度驱动执行的思维模式，创业需建立内驱力，从被推着走变为自己摸路。
    role: motivation
    src:
    - paper: docs/202303/20230328_162.md
  - 'no': 2
    name: 知识付费责任外包心理
    desc: 付费用户错误将赚钱责任转嫁给知识提供者，索要标准化SOP、要求必然成功，实为逃避自我担责。
    role: limitation
    src:
    - paper: docs/202303/20230328_162.md
  - 'no': 3
    name: 知识付费本质：避坑工具而非致富门票
    desc: 知识付费核心价值在于缩短试错周期、跑通标准化流程、规避致命坑点，不承担执行责任、不保证成功。
    role: definition
    src:
    - paper: docs/202303/20230328_162.md
  - 'no': 4
    name: 项目分层模型：初/中/高级匹配能力圈
    desc: 项目按认知要求、周期、天花板分三级：初级蓝海电商（执行出结果）、中级短视频直播（需网感）、高级个人IP（需沉淀），需匹配自身能力圈选级。
    role: method
    src:
    - paper: docs/202303/20230328_162.md
  - 'no': 5
    name: 认知匹配决策法：自我盘点+项目对标
    desc: 选项目前先盘点自身优劣势、能力边界，再分析项目出单周期、琐碎度、天花板、核心能力，双向匹配决策。
    role: method
    src:
    - paper: docs/202303/20230328_162.md
  - 'no': 6
    name: 创业成功责任内归律
    desc: 赚钱概率与承担责任程度正相关，将选项目、执行、结果全链路责任内化为自我认知问题，成功率才显著提升。
    role: proof
    src:
    - paper: docs/202303/20230328_162.md
  - 'no': 7
    name: 高质量社群价值提取清单
    desc: 定义社群四大核心价值：前沿信息差、高质量同伴样本、组织化实战训练、高密度周报筛选，将模糊学习转化为可衡量ROI预期。
    role: method
    src:
    - paper: docs/202303/20230328_162.md
  - 'no': 8
    name: 作者创业四阶段实证轨迹
    desc: 融资败光→贪快亏损→承认平凡深耕二手书年利润百万→有基本盘谋求高天花板，验证匹配能力圈+深耕执行=正向结果。
    role: experiment
    src:
    - paper: docs/202303/20230328_162.md
