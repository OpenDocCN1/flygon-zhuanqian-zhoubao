- 'no': 16
  name: 投资与理财认知 —— 黄金消费投资二元论、纸黄金优于实物、品牌不创造价值、长期避险增值
  desc: 本章面向理财小白，系统阐述黄金消费(首饰)与投资(实物/纸黄金)核心区别：价值仅取决于纯度与重量与品牌无关；首饰溢价源于工艺费；纸黄金(ETF/基金)因手续费低/可灵活加减仓/无保管费更适合普通人波段操作长期配置；2016-2023黄金价格近乎翻倍年化约10.4%跑赢银行理财。
  nodes:
  - 'no': 1
    name: 黄金消费与投资二元论：完全两个概念不可混淆
    desc: 装饰消费属性(首饰)vs保值增值投资属性(金条/纸黄金)；定价逻辑/成本结构/流动性截然不同；买首饰不等于投资。
    role: definition
    src:
    - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
  - 'no': 2
    name: 黄金价值锚定纯度论：品牌不创造黄金价值
    desc: 内在价值完全由纯度(含金量)决定，与品牌溢价无关；AU999(千足金99.9%)为市场主流流通规格；含金量≥99.6%称24K金。
    role: proof
    src:
    - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
  - 'no': 3
    name: 单克价格比价法：总价÷克重横向比价剔除溢价
    desc: 同等纯度规格下换算单克价格进行横向比价，还原黄金真实价值，规避一口价陷阱。
    role: method
    src:
    - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
  - 'no': 4
    name: 纸黄金优于实物黄金普通人投资适配性定理
    desc: 纸黄金因零保管费/极低手续费(万0.5%-万1%最低0.1元)/高流动性/可灵活加减仓，综合收益率与操作体验优于实物黄金(一次性买入被套无法操作/年保管费300元)。
    role: proof
    src:
    - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
  - 'no': 5
    name: 纸黄金波段加减仓操作法：低点加仓高点减仓
    desc: 利用纸黄金低成本高流动性特点，下跌趋势分批加仓摊低成本(如2021年3月低点加仓)，上涨趋势分批减仓锁定利润，实现同期正收益对比实物买在高点等待2.5年回本无收益。
    role: method
    src:
    - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
  - 'no': 6
    name: 长期避险增值属性：2016-2023价格近乎翻倍年化10.4%
    desc: 黄金作为避险资产7年价格几乎翻倍，显著跑赢同期普通银行理财收益(通常2-4%)，适合普通人作为资产配置防御性底仓。
    role: experiment
    src:
    - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
