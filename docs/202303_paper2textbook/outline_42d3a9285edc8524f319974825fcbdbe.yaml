- 'no': 14
  name: 风险识别与合规底线 —— 组织信息过滤、平台规则敬畏、法律红线、心理安全感
  desc: 本章揭示创业过程中的隐性风险与合规红线：组织中普遍存在的单向透明信息过滤导致管理者成最后一个知情者、平台成熟期必须敬畏规则而非寻求技术漏洞、二手书经营风险不在有无证而在有无违禁书、医疗服务灰色地带需筛选合作机构真实性合法性、陪诊师职业倦怠源于共情过载需建立心理屏蔽机制。
  nodes:
  - 'no': 1
    name: 组织信息过滤：权力不对等导致真话缺失
    desc: 员工基于利益规避/面子维护/权力不对等不敢向上传递真实负面信息；管理者仅接收过滤好消息对基层矛盾一无所知；袁世凯假报纸误判局势83天倒台为极端佐证。
    role: motivation
    src:
    - paper: docs/202303/20230328_003.md
  - 'no': 2
    name: 管理盲区：不主动构建获取真相机制必成最后知情者
    desc: 仅依赖正式汇报渠道必然成为组织中最后一个知晓核心问题的人；需跳级汇报/多层级交叉验证、识别语言潜台词(未痛快答应即拒绝)、建立心理安全感。
    role: limitation
    src:
    - paper: docs/202303/20230328_003.md
  - 'no': 3
    name: 平台规则敬畏机制：成熟平台存量博弈阶段严守规则
    desc: 暴力玩法(批量铺货/软件采集)必封号；只有充分遵守平台规则才可能赚到钱；笨功夫(手动精细化运营)优于技术流。
    role: limitation
    src:
    - paper: docs/202303/20230328_086.md
  - 'no': 4
    name: 二手书合规红线：年售5万以下免证，核心风险在卖违禁书
    desc: 年销售额5万元以下无需出版物经营许可证；被查处根本原因是卖了不该卖的书而非单纯无证经营；多平台分散流水可规避监管阈值。
    role: limitation
    src:
    - paper: docs/202303/20230328_169.md
  - 'no': 5
    name: 医疗服务合规性生存底线：甄别机构真实性合法性
    desc: 医疗灰色地带运营必须建立项目筛选机制，规避黄牛挂号/非法行医/回扣贿赂等法律红线，合规是业务长期存续前提。
    role: limitation
    src:
    - paper: docs/202303/ScDWdhjkHolKzAxyHpjclEDsnMg.md
  - 'no': 6
    name: 陪诊师职业倦怠源于共情过载：需建立心理屏蔽机制
    desc: 核心风险非体力透支而是长期吸收患者负面情绪导致能量场污染；必须通过物理隔离(符咒/心理建设)构建边界感。
    role: limitation
    src:
    - paper: docs/202303/20230328_173.md
  - 'no': 7
    name: 银行套利风控：四大行资金自有卡闭环+利息承保
    desc: 资金全程在自己名下卡内流转不涉及第三方；仅操作工农中建邮储等国有大行；利息有承保；小银行存在入坑风险。
    role: limitation
    src:
    - paper: docs/202303/20230328_166.md
