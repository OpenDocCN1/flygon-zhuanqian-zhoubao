    desc: 初期直接抄袭爆款，中期杂交重组多源素材，后期沉淀原创方法论；配合素材库积累实现捡钱式变现。
    role: method
    src:
    - paper: docs/202303/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf.md
  - 'no': 4
    name: 流量获取六大方法论+三渠道矩阵
    desc: 6大战术(留诱饵/钩子/共情/量变质/打磨IP/做好后端)×3渠道(音频/视频/图文)=可落地组合拳；内容即诱饵，价值决定流量成本。
    role: method
    src:
    - paper: docs/202303/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf.md
  - 'no': 5
    name: IP崛起三阶段：自说→他说→传说
    desc: 个人品牌成长规律：自我输出→他人传播背书→品牌资产化自传播；视频>图文、出镜>不出镜、真人建立信任加速转化。
    role: extension
    src:
    - paper: docs/202303/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf.md
  - 'no': 6
