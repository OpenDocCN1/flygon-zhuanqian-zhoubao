paper: docs/202303/20230328_107.md
desc: 该素材为视频号带货航海实战复盘，记录了作者从搬运(BY)被限流、原创实拍不可行，转而探索混剪路径，并最终构建 "剪映 + 达芬奇 Resolve + 影刀
  RPA" 自动化混剪生产线的全过程。核心在于利用达芬奇 "场景剪切探测器" 实现素材自动分割与去重预处理（调色、变换），结合剪映模板化合成（旁白、字幕、打乱顺序），并通过
  RPA 串联跨软件操作、实现容错与定时批量运行，将日产能从 <10 条提升至稳定批量，单条视频最高实现 4000 播放转化 4 单。
concepts:
- name: 混剪生产线
  desc: 将混剪制作拆解为标准化的「备料（达芬奇分割/去重/调色）→ 炒菜（剪映模板化合成/打乱/配音）→ 打包（RPA 自动化流程调度/容错/发布）」三大工业化阶段，实现从人工手工到自动化流水线的转变。
  is_original: true
  excerpt:
  - 就像齐杰大佬说过的，要备好料才能做好菜。以上的操作只是为了备料，还有主要的炒菜的一步。
  - 一、首先就是文件夹的创建...二、达芬奇的场景剪切探测器...三、这一步算是主要去重的...四、正常导出的素材片段是按照视频顺序排序的，这样不利于我们剪辑，毕竟我们的目的是打乱
- name: 场景剪切探测器去重法
  desc: 利用 DaVinci Resolve 自带的 Scene Cut Detection 功能，将长视频自动切分为独立镜头片段，配合随机打乱顺序、几何变换（缩放/位置/旋转/翻转）、统一调色参数、裁剪模糊背景等手段，实现素材层面的深度去重。
  is_original: true
  excerpt:
  - 利用达芬奇的场景剪切探测器对场景进行了自动分割...好物的场景基本都是各种切换，哪怕驴唇不对马嘴，这个视频也不违和呀。
  - 进入剪辑面板，进行缩放、位置、旋转角度、翻转处理。再进入调色面板，在校色轮处，调一个不错的参数...然后每一个片段同步这个参数即可。
  - 为了增加去重效果，我一般会对视频再上下裁剪一刀，然后再给个模糊背景，这样既能去重，又能去原字幕。
- name: 跨软件 RPA 编排
  desc: 利用影刀 RPA 打通达芬奇（无批量 API/快捷键支持）、剪映（模板化合成）、文件系统（文件夹流转/重命名/打乱）及外部工具（微软 TTS、GPT
    改写、哼哼猫下载）的操作壁垒，构建端到端无人值守流程，并引入“运行前恢复初始状态”机制解决异常容错。
  is_original: true
  excerpt:
  - 达芬奇里有些板块的元素不能识别，只能用鼠标按照位置自动点击，所以我在剪辑夹里放了一个中转原始素材夹...流程开始，会将原始素材夹的第一个文件夹移动到原素材夹，处理后再讲这个文件夹转移到已处理原始素材夹
  - 又花了半个晚上做容错，直接在流程开始来一个恢复初始状态的流程，自此算是可以稳定产出了。
  - 将他们做成了一个流程，这样终于省事了。
- name: 文件夹流转标准化
  desc: 设计 5 大核心文件夹（原始素材、已处理素材、账号目录、账号发布、剪辑工作区）及子文件夹结构，作为 RPA 流程的数据总线，实现素材下载、预处理、达芬奇处理、剪映合成、成品归档的物理隔离与自动流转。
  is_original: true
  excerpt:
  - 在桌面或者指定盘创建 5 个文件夹，分别是原始素材夹，已处理原素材夹，账号目录夹(每个账号的登陆浏览器在里面)，账号发布夹(每个账号要发布的视频在里面)，剪辑夹(里面又有素材片段夹，字幕夹，原素材夹)。
  - 流程开始，会将原始素材夹的第一个文件夹移动到原素材夹，处理后再讲这个文件夹转移到已处理原始素材夹
methods:
- name: __overview__
  desc: 「备料-炒菜-打包」三阶段自动化混剪法：1. 备料阶段：RPA 驱动剪映统一视频规格/提取字幕 → 文件夹流转 → RPA 驱动达芬奇场景切割/几何变换/统一调色/批量导出
    → 片段随机重命名打乱。2. 炒菜阶段：人工/GPT 生成多版本文案/标题 → TTS 合成多音色旁白 → 剪映导入模板/素材/旁白/字幕预设 → 粗对齐/裁剪/模糊背景
    → 批量导出成品。3. 打包阶段：RPA 统一调度上述全流程，含异常恢复/定时运行/多账号分发。
  excerpt:
  - 需要实现哪些操作：1、需要对视频场景进行分割 2、需要对分割后的场景进行镜像、缩放、位置变换、滤镜等处理 3、需要提取原视频的文案进行调整 4、需要提取原视频的标题进行调整
  - 第一步、打开备料文件(字幕夹),找到合适的旁白文案...第二步、打开标题文件...第三步、打开剪映，导入刚才的旁白，导入切割好的片段文件夹，将以上两个文件夹以及提前准备好的文字预设直接拖入时间线...导出备用了。
  - 又用了一天的时间将他们做成了一个流程...又花了半个晚上做容错，直接在流程开始来一个恢复初始状态的流程
- name: 达芬奇批量场景切割与去重预设
  desc: 媒体面板右键素材→场景剪切探测器→添加剪切点→加入媒体池 → 剪辑面板批量设置缩放/位置/旋转/翻转关键帧 → 调色面板创建统一节点/参数 → 中键/右键应用等级/同步参数至所有片段
    → 交付面板设置渲染预设（单独剪辑/文件名含片段号） → 添加渲染队列 → 开始渲染。
  excerpt:
  - 在达芬奇的第一个面板，也就是媒体面板，进行场景剪切操作，将剪切过的片段添加到媒体池，直到所有的视频都处理完。
  - 进入剪辑面板，进行缩放、位置、旋转角度、翻转处理。再进入调色面板，在校色轮处，调一个不错的参数(可以咨询 GPT)，然后每一个片段同步这个参数即可。
  - 最后进入导出面板，渲染导出即可完成。
- name: RPA 容错机制：启动即重置
  desc: 在 RPA 主流程入口前置「环境重置子流程」：关闭残留进程、清空中转文件夹、将已处理/待处理文件夹归位、删除临时生成文件、重置剪映/达芬奇窗口状态，确保每次运行均从确定性初始状态开始，规避上次崩溃留下的脏数据导致连锁失败。
  excerpt:
  - 由于一直没有做容错处理...一旦出现报错，还需要手动去将文件调回达到固定位置，再删除一些已经命名的文件...终于忍受不了，又花了半个晚上做容错，直接在流程开始来一个恢复初始状态的流程，自此算是可以稳定产出了。
- name: 剪映模板化合成法
  desc: 预置：文字预设（字体/动画/位置）、画幅/背景模板（模糊背景/裁剪遮罩）。运行时：导入旁白音频（多音色版本）+ 打乱顺序的素材片段文件夹 + 字幕文件
    → 拖入轨道 → 按旁白波形粗剪对齐 1-2 处关键点 → 套用文字预设自动匹配字幕 → 一键套用画幅模板（上下裁剪+模糊背景去原字幕） → 批量导出。
  excerpt:
  - 将以上两个文件夹以及提前准备好的文字预设直接拖入时间线，对着旁白大概调整下片段，能够有一两处对上旁白就行了...导出备用了。
  - 为了增加去重效果，我一般会对视频再上下裁剪一刀，然后再给个模糊背景，这样既能去重，又能去原字幕。
theorems:
- name: 搬运(BY)生存周期极短，混剪是低门槛长期主义必经之路
  desc: 实测纯搬运账号存活 2-4 天即被判定“内容质量低”需补原创，实拍成本过高，唯有二创混剪能平衡通过率、成本与规模化潜力。
  excerpt:
  - 航海第 2 天...紧接着就被限制了...自此第一号：卒。
  - 航海第 4 天...说我账号内容质量低，让我发 10 个原创来证实我的能力，自此第二个号：虽未死，但已无能力再战。
  - 终于对 BY 产生了怀疑...那就只剩二剪和混剪这条路了...终于在第三天让我爆了个视频，爆了 10 万的播放，卖了 20 多单...我觉得混剪的方式是对的，只是效率未免太低了
- name: 达芬奇场景切割+随机打乱+几何变换+统一调色 = 混剪去重核心公式
  desc: 场景级切割打破原视频语义连贯性，随机打乱重组构建新叙事，几何变换(缩放/位移/旋转/翻转)改变特征指纹，统一调色统一视觉风格掩盖拼接痕迹，四者叠加实现平台算法层面的“原创”判定通过。
  excerpt:
  - 好物的场景基本都是各种切换，哪怕驴唇不对马嘴，这个视频也不违和呀。
  - 进入剪辑面板，进行缩放、位置、旋转角度、翻转处理。再进入调色面板，在校色轮处，调一个不错的参数...然后每一个片段同步这个参数即可。
  - 正常导出的素材片段是按照视频顺序排序的，这样不利于我们剪辑，毕竟我们的目的是打乱，可以用流程对素材片段进行随机抽取重命名，达到打乱效果。
- name: RPA 价值不在“替人点鼠标”，而在“跨异构软件编排确定性流程”
  desc: 剪映/达芬奇均无开放 API，RPA 通过模拟键鼠+图像识别+文件系统中转，串联“下载→预处理→切割→去重→合成→发布”全链路，并引入状态机式容错，将不可靠的手工串联转化为可复用、可扩展、可监控的工业级生产线。
  excerpt:
  - 达芬奇里有些板块的元素不能识别，只能用鼠标按照位置自动点击，所以我在剪辑夹里放了一个中转原始素材夹...
  - 把 RPA 利用到剪辑上这个想法愈发强烈...决定彻底改变下，哪怕视频不发了。
  - 又用了一天的时间将他们做成了一个流程...做容错，直接在流程开始来一个恢复初始状态的流程，自此算是可以稳定产出了。
findings:
- name: 单账号日产 10 条混剪视频的手工极限验证
  desc: '[evidence] 作者亲测：早 9 点至晚 11-12 点全天手工混剪，仅产出 <10 条视频，且极度疲劳无法兼顾多账号运营，直接倒逼自动化需求产生。'
  excerpt:
  - 当时为了达到每天能够剪辑出 10 条视频，从早上 9 点剪辑到晚上十一二点，也没有达到 10 条...每天搞一个账号都要累的不行，连救那个半死不活的号的精力都没有。
- name: 自动化生产线上线后单条视频最高转化率实测
  desc: '[evidence] 自动化流程稳定运行后（航海第 21 天），实测单条视频 4000 播放产出 4 单带货订单（转化率 0.1%），验证“混剪+自动化”模型商业可行性。'
  excerpt:
  - 发现今天发的视频，4000 播放出了 4 单，算是最高的一次转化比了
- name: 达芬奇批量处理不同分辨率视频易崩溃的工程坑位
  desc: '[evidence] 实测达芬奇场景切割批量处理多规格素材会崩溃，必须前置 RPA 驱动剪映统一转码/重命名（去空格）预处理，方能稳定运行。'
  excerpt:
  - 达芬奇的场景剪切探测器，不知道是我电脑配置的原因还是什么原因，进行批量处理不同分辨率的视频时会崩溃，所以就要对下载的视频进行二次处理...这一步就是利用 RPA
    在剪映里处理了
- name: 剪映“上下裁剪+模糊背景”双重去重/去字幕实测有效
  desc: '[evidence] 实操发现：原视频字幕多在底部，达芬奇预处理下移画面 → 剪映上下裁剪切除顶部黑边与底部字幕 → 填充模糊背景补齐画幅，同时实现去水印/字幕与画面特征指纹改变双重效果。'
  excerpt:
  - 一般原视频字幕在下方，用达芬奇的时候，要把视频往下移动多一点，在剪映里上下来一刀就既看不到上面的黑边，也看不到下面的字幕了。
  - 为了增加去重效果，我一般会对视频再上下裁剪一刀，然后再给个模糊背景，这样既能去重，又能去原字幕。
- name: RPA 未做容错前，单次报错需人工耗时 20-30 分钟恢复环境
  desc: '[claim] 作者陈述：早期无容错机制时，任一节点报错需手动搬运文件夹、删除重命名文件、重置软件状态，极大抵消自动化收益；加入“启动即重置”后实现无人值守稳定产出。'
  excerpt:
  - 由于一直没有做容错处理...一旦出现报错，还需要手动去将文件调回达到固定位置，再删除一些已经命名的文件，这无形又麻烦了...直接在流程开始来一个恢复初始状态的流程，自此算是可以稳定产出了。
