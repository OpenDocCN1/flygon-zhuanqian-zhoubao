paper: docs/202303/20230328_006.md
desc: 该素材通过作者海程介绍朋友Shiver的创业合伙分股难题，以及资深顾问Max给出的系统性解决方案，核心阐述了早期公司股权分配的公平性原则、咨询顾问介入初创企业的“记账法”创新模式，并揭示了该模式与贝恩“咨询+投资”一体化商业逻辑的同构性，为解决小公司付不起高额顾问费、顾问不愿纯占股打工、双方边界模糊等痛点提供了实操范式。
concepts:
- name: 股权分配的动态公平性
  desc: 股权分配不应是静态的一次性切分，而需建立机制应对合伙人投入度、人生阶段、资源贡献随时间变化的动态调整，核心是锁定关键人、平衡短期生存与长期激励。
  is_original: false
  excerpt:
  - 有的合伙人已经出来了，有的合伙人还在公司，怎么样出资保证公平
  - 三个合伙人因为人生阶段不一样，生活压力很不一样，要不要现在发工资
  - 公司运营机制如何在短期收益不高的情况下，保证中长期的发展，并且可以很好的锁定关键人员
- name: 顾问介入的记账法
  desc: 顾问不直接收固定费用或纯占股，而是按市场价为服务‘记账’，设置利润门槛，公司盈利达标后再以现金或折股偿还，并在达标后约定投资权，实现风险共担与利益绑定。
  is_original: true
  excerpt:
  - 日常服务时按照报价记着账
  - 设置一条利润线，如果公司死了，也就不用给了
  - 如果超过这条利润线，按照现金或者折算成股份
  - 还能约定好，进一步达到某个业绩指标，能够投一部分钱进去
- name: 辅助性工种的市场价锚定原则
  desc: 对于非核心、半白嫖的辅助工种，应以市场价支付现金并签协议留痕，避免因低价/免费服务产生的‘贡献度虚高’而引发后续股权纠纷。
  is_original: false
  excerpt:
  - 应该以市场价为锚定点去付钱，同时需要签协议留作证据
  - 防止出现这样的情况'我帮 Shiver 用 3 万出了一个市面上 7 万的稿子，我做了这么大贡献，不应该拿他几个点的股份么'
- name: 咨询即尽调、投资即落地
  desc: 顾问在早期深度参与运营（相当于CEO/COO）的过程本质上是高质量的尽职调查，掌握真实数据后再决策投资，极大降低了信息不对称和‘被坑’风险，复刻了贝恩‘战略咨询+主权投资’的一体化商业逻辑。
  is_original: true
  excerpt:
  - Max 往往帮公司完成早期框架构建和运营，相当于干了 CEO 和 COO 的活，所以他能看到真实的数据指标
  - 所以在达到某个业绩指标时的投钱节点，被坑的概率非常低
  - 这和贝恩的套路特别像，为什么 MBB 里贝恩除了做战略咨询，其实还有一块很大的业务是做贝恩投资？
methods:
- name: __overview__
  desc: 基于具体业务场景的复盘与类比推演法：通过实战案例（Shiver合伙分股）引入问题，邀请领域专家（Max）给出定制化方案，再将微观方案上升为宏观商业模式（贝恩模式类比），形成可复用的方法论框架。
  excerpt:
  - Shiver 再把怎么分股权的事儿又提了一遍... Max 每一个问题都结合具体情境，聊的妥妥当当
  - 我突然一下反应过来，这和贝恩的套路特别像... Max 往往帮公司完成早期框架构建和运营... 所以在达到某个业绩指标时的投钱节点，被坑的概率非常低
- name: 合伙人分层动态股权设计法
  desc: 针对全职/兼职、出资/出力、不同生活压力的合伙人，设计‘工资+期权/股权’的动态组合包，通过运营机制锁定关键人，而非简单的静态注册股分配。（文中为商业机密未展开细节）
  excerpt:
  - 1）和 2）其实是一个问题，公司运营机制如何在短期收益不高的情况下，保证中长期的发展，并且可以很好的锁定关键人员；这一段因为涉及商业机密，不太方便写
- name: 顾问服务记账-转股/现金-跟投三阶段法
  desc: 阶段一：按市场报价记账（确认价值）；阶段二：设定利润触发线，盈利后按现金或折股结算（分担风险、延迟满足）；阶段三：约定业绩里程碑，顾问享有跟投权（深度绑定、信息优势转化为投资优势）。
  excerpt:
  - 日常服务时按照报价记着账
  - 设置一条利润线，如果公司死了，也就不用给了
  - 如果超过这条利润线，按照现金或者折算成股份
  - 还能约定好，进一步达到某个业绩指标，能够投一部分钱进去
- name: 非核心人力成本市场化清算法
  desc: 辅助性工种坚持市场价现金结算+合同固证，切断‘低成本投入换高股权预期’的套利路径，将隐性股权成本显性化为财务成本。
  excerpt:
  - 应该以市场价为锚定点去付钱，同时需要签协议留作证据
  - 防止出现这样的情况'我帮 Shiver 用 3 万出了一个市面上 7 万的稿子，我做了这么大贡献，不应该拿他几个点的股份么'
theorems:
- name: 早期合伙的核心矛盾是贡献度度量的动态性与静态股权的固化性冲突
  desc: 合伙人技能稀缺度、投入度随时间变化，静态分股必然导致后续扯皮；解决之道在于建立动态调整机制（如期权池、分期授予、业绩触发）而非寻求完美的初始切分。
  excerpt:
  - 贡献度随着时间的变化，需要不断调整/扯皮，还可能一开始会错误估计对方的技能稀缺度和投入度，需要大量投入在人际关系上
  - 合伙除了要投钱，还需要投入时间和专业技能，玩不好的话，按我的话说就是“花钱找工作”
- name: 咨询顾问介入早期公司的最优模式是‘服务记账+利润分享+里程碑跟投’
  desc: 该模式解决了小公司现金流约束、顾问风险收益不对称、双方情绪/时间边界模糊三大痛点，将顾问从‘外包打工者’转化为‘准合伙人/准投资人’，实现利益深度绑定。
  excerpt:
  - 你要直接收固定一个月几万把，小公司又出不起
  - 你要是占个股把，那最后不就变成“花钱找工作”么
  - 边界很难画的很清楚，你是非常难控制自己情绪损耗/时间/钱的投入的
  - Max 给出了一个我觉得很有创意的方法：记账... 如果超过这条利润线，按照现金或者折算成股份... 进一步达到某个业绩指标，能够投一部分钱进去
- name: 深度运营参与是早期投资最高质量的尽职调查
  desc: 顾问通过承担CEO/COO职能深度介入运营，获取的内部真实数据远超常规财务尽调，使得后续投资决策基于信息优势而非外部猜测，复刻了贝恩‘咨询引领投资’的核心商业逻辑。
  excerpt:
  - 因为贝恩咨询的咨询过程相当于做了很严密的尽调，这个时候贝恩资本来投资，逻辑就非常的顺
  - Max 往往帮公司完成早期框架构建和运营，相当于干了 CEO 和 COO 的活，所以他能看到真实的数据指标
  - 所以在达到某个业绩指标时的投钱节点，被坑的概率非常低
findings:
- name: 工业细分领域具备超高毛利特征
  desc: '[evidence] 作者实地考察朋友Shiver的工业仪表细分创业项目，确认其毛利率远超认知范围内的所有生意，验证了‘细分赛道、技术壁垒、高毛利’的商业模式可行性。'
  excerpt:
  - 生意是好生意，这些工业细分领域的毛利实在是远远超出我之前听过的所有生意
- name: 专家网络的精准匹配能显著提升咨询介入效果
  desc: '[evidence] 作者引入擅长工业领域专业服务、销售管理的Max与Shiver会面，双方开场十分钟即因领域熟悉度高而‘聊High’，并高效产出分股方案，证明了‘懂行的顾问’对‘不懂市场的技术创始人’的边际价值极高。'
  excerpt:
  - 后来他们开场十分钟以后，因为 Max 很熟我同学的领域，所以他们就聊 High 了
  - Max 每一个问题都结合具体情境，聊的妥妥当当
- name: 记账法隐性包含期权定价与风险控制机制
  desc: '[claim] 作者宣称该记账法类似贝恩模式，能规避‘花钱找工作’风险，实现顾问利益最大化；[evidence] 素材数据支撑：通过‘利润线’设定下行保护（公司死掉债务归零），通过‘折股/跟投’捕获上行收益，结构上等同于顾问持有公司的看涨期权且行权价由利润门槛决定，且因深度运营掌握信息优势，行权决策质量远高于外部投资人。'
  excerpt:
  - 设置一条利润线，如果公司死了，也就不用给了
  - 如果超过这条利润线，按照现金或者折算成股份
  - 进一步达到某个业绩指标，能够投一部分钱进去
  - 被坑的概率非常低
- name: 市场价现金清算能有效预防辅助人员的股权敲诈
  desc: '[evidence] Max方案针对‘3万买7万服务’后反悔索要股权的典型案例，提出市场价付费+留痕合同，将隐性股权承诺转为显性债务关系，从源头切断道德风险。'
  excerpt:
  - 防止出现这样的情况'我帮 Shiver 用 3 万出了一个市面上 7 万的稿子，我做了这么大贡献，不应该拿他几个点的股份么'
  - 应该以市场价为锚定点去付钱，同时需要签协议留作证据
