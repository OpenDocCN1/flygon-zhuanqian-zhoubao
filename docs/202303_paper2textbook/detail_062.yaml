  excerpts:
  - 黄金的价值，其实跟品牌是完全没有关系的，不是说大品牌的黄金，就一定是好的，小品牌的黄金就不好。
  - 黄金的质量高不高只跟它的纯度有关... 目前我国标准的黄金成色分为：AU9999、AU9995、AU999、AU995这几种。
  - AU999也就是我们经常说的千足金，含金量是在99.9%，是市面上最多见流通最广泛的黄金。
- 'no': 3
  name: 单克价格比价法 —— 用除法穿透所有营销迷雾
  points:
  - '**为什么需要这个概念？**'
  - '- 商家报“总价/一口价/克价+工费”多维混淆定价，让普通人无法横向比较'
  - '- “一口价”不标克重、“固定工费”掩盖高单克成本、“赠送工费”实则抬高金价，陷阱层层叠叠'
  - '- 统一换算成“单克总成本(含工费)”，是唯一能穿透所有营销话术、还原真实价值的标准尺子'
  - '**核心定义**'
  - '- 单克价格 = 实付总金额 ÷ 实际黄金克重(含工费/手续费/运费等所有成本)'
  - '- 仅在同等纯度规格(如均为 AU999)下具有横向可比性'
  - '**关键性质**'
  - '- 去伪存真：自动剔除品牌溢价、营销话术、包装成本，直击黄金金属本价值'
  - '- 适用全场景：首饰选购、金条投资、旧金置换、回收变现，统一比价基准'
  - '- 决策阈值：投资端单克成本 - 国际金价 ≤ 16 元/克(正规渠道合理溢价)；消费端单克成本 - 国际金价 ≤ 50 元/克(可接受工艺溢价)'
  - '**典型例子**'
  - '- 陷阱破解：A 店“古法金手镯 一口价 8888 元”，B 店“足金手镯 450 元/克 + 80 元/克工费 共 20 克”。算单克：A 店实称 15
    克 → 592 元/克；B 店 530 元/克。国际金价 410 元/克，B 店溢价 120 元/克更划算'
  - '- 置换避坑：旧金换新扣除 30% 损耗费+20%工费，算单克发现新金单克成本比直接买新金还高，不如卖旧买新'
  - '**边界条件**'
  - '- 克重极小(如 1-2 克)首饰，工费占比极高(单克成本可达金价 2-3 倍)，单克比价法仍有效但决策逻辑应转为“买喜欢/买设计”而非“比成本”'
  - '- 古法/硬金/5G/5D 等新工艺首饰，工艺费合理性无外部基准，单克比价只能判断“贵不贵”，难判断“值不值”'
  sources:
  - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    role: origin
  excerpts:
  - 因此在同等规格下，换算出1g黄金多少钱，才是具有对比价值的。
  - 同样的一个生肖挂件都是AU999，一家店卖3000元，一家店卖5500元... 前者只有5g，后者却有10g呢。是不是明显后面一家店的黄金更划算？
  - 黄金的溢价主要集中在工艺成本上，也就是我们常说的为设计买单。
- 'no': 4
  name: 纸黄金优于实物黄金的普通人投资适配性定理 —— 让黄金像股票一样灵活
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人买实物金条面临“一次性买入、被套无法补仓、年付 300 元保管费、变现跑银行排队验火”四重痛点'
  - '- 纸黄金(黄金 ETF/基金)完美解决上述痛点，却因“非实物/看不见摸不着”心理障碍被长期忽视'
  - '- 确立纸黄金“更适合普通人”的地位，能帮助大多数人用更低成本、更灵活方式配置黄金资产'
  - '**核心定义**'
  - '- 纸黄金：非实物黄金投资，通过证券账户/银行 APP 买卖黄金 ETF(如 518880)、黄金基金、账户黄金'
  - '- 核心优势三角：零保管费 + 极低手续费(万 0.5%-万 1%，最低 0.1 元) + T+0/T+1 高流动性 + 支持分批加减仓'
  - '**关键性质**'
  - '- 成本优势量化：实物年持有成本 = 300 元保管费 + 买卖点差 10-16 元/克；纸黄金年持有成本 = 0 保管费 + 手续费约 0.5-1 元/万元'
  - '- 操作灵活性：实物“一次性建仓、被套干瞪眼”；纸黄金“分批建仓、低点加仓、高点减仓、网格交易”样样行'
  - '- 价格趋同性：纸黄金净值/价格与实物黄金、国际金价长期高度正相关(相关系数 > 0.99)，不跟踪误差'
  - '**典型例子**'
  - '- 2020 年 8 月高点(约 400 元/克)买入：实物金条持有至 2023 年 3 月回本，中间 2.5 年零收益、还倒贴 900 元保管费；纸黄金
    ETF 在 2021 年 3 月低点(约 340 元/克)加仓摊低成本，2023 年突破新高已获 15%+ 正收益'
  - '- 小额定投：月薪 1 万，每月拿 2000 元定投黄金 ETF，单笔手续费 0.1 元，10 年累计投入 24 万，享受复利与波段收益，实物金条根本买不起/存不下'
  - '**边界条件**'
  - '- 极端灾难场景(战争/金融体系崩溃/账户冻结)下，纸黄金面临对手方风险/系统性风险，实物黄金在手才是终极避险，但此类概率极低'
  - '- 券商/银行渠道差异大：部分银行“账户黄金”点差高达 0.8-1.5 元/克、不支持 T+0，需甄别低成本渠道(券商 ETF/优质基金)'
  - '- 老年/非数字化人群操作证券账户有门槛，实物金条/银行柜台账户黄金可能是唯一可及渠道'
  sources:
  - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    role: origin
  excerpts:
  - 纸黄金投资，也可以理解为“非实物性黄金投资”... 可以直接在网上下载银行app操作，也可以开个人证券账户购买黄金衍生品。
  - 手续费也会更低，以黄金etf... 为例... 通常手续费为万分之1%，我这边券商合作渠道可拿到最低手续费仅万分之0.5%（每次最低交易手续费仅0.1元）
  - 纸黄金并不存在保管费用... 在最低的位置，我们可以做1-2次加仓的操作，中途也可以根据上涨幅度做减仓
  - 从2020年8月开始，黄金etf开始下跌... 假如我们是在2020年7月到8月买了实物黄金... 如果我们是买的纸黄金的话... 经过低点的加仓操作后，会拥有更多的盈利。
