learning_targets:
- 区分黄金消费属性与投资属性，避免把首饰当资产买
- 掌握单克价格比价法，穿透品牌溢价与一口价陷阱
- 理解纸黄金（ETF/基金）相对实物黄金的成本与灵活性优势
- 会根据资金量、操作习惯、风险偏好选择实物金条、纸黄金ETF或黄金首饰
- 建立黄金作为资产配置“定海神针”的长期主义认知：5%-15%底仓、波段操作、避险增值
- 掌握黄金首饰选购三步法（认纯度、算单克、按克重决策）与纸黄金波段加减仓SOP
- 识别黄金投资常见避坑点：一口价、高工费、非正规渠道、混淆消费投资、过度择时
concept_map:
- 黄金投资与消费认知体系
- ├── 核心定律
- │   ├── 黄金消费投资二元论 —— P001
- │   ├── 黄金价值锚定纯度论 —— P002
- │   ├── 品牌不创造黄金价值定理 —— P001
- │   ├── 首饰非投资定理 —— P001
- │   └── 纸黄金优于实物黄金普通人投资适配性定理 —— P004
- ├── 实操方法论
- │   ├── 单克价格比价法 —— P003
- │   ├── 黄金首饰选购三步法 —— P006
- │   ├── 纸黄金波段加减仓操作法 —— P006
- │   └── 四笔钱/100-年龄资产配置模型（引用第7章第4节）
- ├── 成本结构拆解
- │   ├── 首饰工艺溢价（设计费/品牌费/渠道费） —— P001
- │   ├── 实物黄金持有成本（保管费300元/年+点差10-16元/克） —— P001
- │   └── 纸黄金持有成本（手续费万0.5%-万1%/最低0.1元+零保管费） —— P004
- ├── 价格趋同与周期规律
- │   ├── 黄金价格三位一体趋同论（实物/纸黄金/首饰金料） —— P001
- │   ├── 长期增值实证：2016-2023年近乎翻倍/年化10.4% —— P005
- │   ├── 2020-2023周期复盘：实物被套2.5年 vs 纸黄金波段正收益 —— P004
- │   └── 避险属性：黑天鹅/通胀/美元贬值时逆势上涨/与股债负相关 —— P005
- └── 避坑指南与边界条件
- '    ├── 黄金投资避坑指南：不买一口价/不买高工费/不买非正规/不混淆消费投资 —— P001'
- '    ├── 纸黄金适用边界：极端灾难场景对手方风险/小额资金手续费率高/弱心态不适用 —— P004'
- '    └── 首饰选购边界：古董/大师/镶钻脱离金价模型/轻克重重设计轻成本 —— P003'
life_analogy:
- 想象黄金投资是**买菜 vs 买菜刀**的区别：
- '- **黄金首饰（消费）** = **买一盘精致的“红烧肉”**：你付钱买的是厨师的手艺（工艺费）、餐厅的环境（品牌溢价）、以及食材本身（金价）。吃完就没了，想变现只能把剩下的骨头（回收金料）按市场价卖给收废油的，亏大发了。'
- '- **实物金条（投资-笨重版）** = **买一箱冻猪肉囤冰柜**：肉是实实在在的（纯度/重量），按斤买按斤卖，价格透明。但得买大冰柜（保管费300元/年），想卖还得解冻切块找买家（流动性差、验火折损），一次性买太多价格高了还得硬扛。'
- '- **纸黄金ETF（投资-灵活版）** = **买“猪肉期货/基金份额”**：不用买冰柜（零保管费），手机点一点就能买卖（T+0/T+1，手续费极低），想吃肉（变现）秒到账。还能分批买：今天肉便宜多买点（低点加仓），明天贵了卖一部分锁定利润（高点减仓）。肉价涨跌（国际金价）和你手里的份额价值严格同步。'
- '**核心启示**：普通人家里没大冰柜（资金量小/不想操心保管），也没专业屠夫刀（鉴定/变现能力），买“猪肉份额”（纸黄金）才是性价比最高、最灵活的囤肉方式。只有真要过年摆盘面子（婚嫁/送礼），才去买那盘好看但贵得离谱的“红烧肉”（首饰），且清楚那是“吃/送”，不是“囤”。'
summary:
- concept: 黄金消费投资二元论
  desc: 买首饰=消费（溢价高、流动性差），买金条/纸黄金=投资（价格透明、流动性强），两者定价逻辑、成本结构、流动性截然不同，不可混淆
- concept: 黄金价值锚定纯度论
  desc: 黄金内在价值仅由纯度（含金量）与重量决定，与品牌无关；AU999(99.9%)为主流流通规格，识别钢印是核心
- concept: 单克价格比价法
  desc: 总价÷克重=单克成本，同等纯度下横向比价，穿透品牌溢价/一口价/工费陷阱，还原黄金真实价值
- concept: 首饰工艺溢价
  desc: 首饰价格=金料价值+工艺费/设计费/品牌费/渠道费；轻克重重设计轻成本，重克重死磕单克成本
- concept: 实物黄金投资
  desc: 贴近国际金价、无工艺溢价，适合3-5年+长线持有，但流动性差、年保管费~300元、一次性建仓无法灵活加减仓
- concept: 纸黄金投资(ETF/基金)
  desc: 非实物黄金，手续费极低(万0.5%-万1%/最低0.1元)、零保管费、T+0/T+1高流动性、支持分批加减仓，更适合普通人波段操作与长期配置
- concept: 纸黄金优于实物黄金普通人投资适配性定理
  desc: 纸黄金以零保管费、极低手续费、高流动性、灵活加减仓四大优势，解决实物黄金被套干瞪眼、保管贵、变现难痛点，综合收益率与体验更优
- concept: 黄金价格三位一体趋同论
  desc: 实物黄金、纸黄金、首饰金料部分价格核心驱动均为国际金价，长期高度相关趋同变动
- concept: 黄金长期避险增值属性
  desc: 2016-2023年7年价格近乎翻倍(年化~10.4%)，显著跑赢银行理财(2-4%)；危机/通胀/美元贬值时逆势上涨，与股债负相关，是资产配置防御性底仓(建议5%-15%)
- concept: 2020-2023周期复盘实证
  desc: 实物买高点(2020.8)待2.5年回本零收益；纸黄金低点(2021.3)加仓、高点减仓实现同期正收益，验证灵活操作优势
- concept: 黄金首饰选购三步法
  desc: ①认纯度标识(AU999/9999) ②算单克价(总价/克重横向比价) ③按克重决策(轻克重<10g买喜欢/重克重>20g比单克成本)
- concept: 纸黄金波段加减仓操作法
  desc: ①选低成本渠道(券商518880/优质基金) ②定基准仓位(资产5%-10%) ③设波段区间(宏观/技术结合) ④执行纪律(分批/定量/止盈止损/禁满仓梭哈)
- concept: 黄金投资避坑指南
  desc: 不买一口价(克重不透明)、不买极高工费、不买非正规渠道、严格区分消费属性首饰与投资属性金条/纸黄金、警惕主观择时陷阱
exercises:
- 'no': 1
  title: 实战比价：算出真正的“单克价格”
  contents:
  - 场景：你想买一条 AU999 足金项链，预算 5000 元。对比三家店的报价：
  - A 店（大品牌）：一口价 5280 元，导购说“品牌保真、终身免费清洗”，未标克重。你偷偷问了库存，实称 10.2 克。
  - B 店（普通金店）：标价 460 元/克 + 工费 80 元/克，你挑了款 11.5 克的。
  - C 店（网络品牌）：直播间喊“克价 430 元，包工费、包运费”，你下单 12 克，到手实称 11.8 克（含扣子/链扣损耗）。
  - 问题：
  - 1. 计算三家店的单克总成本（含所有费用）。假设当日国际金价/上海金基准价为 410 元/克。
  - 2. 哪家最划算？节省了多少“冤枉钱”？
  - 3. 如果你是送女朋友（轻克重、重颜值），会怎么选？如果是自己投资囤货（重克重、重成本），会怎么选？
  - 4. 为什么“大品牌终身免费清洗”在投资视角下毫无价值？
- 'no': 2
  title: 纸黄金 vs 实物黄金：一笔账算清“灵活性溢价”
  contents:
  - 假设：2020 年 8 月初，国际金价/黄金 ETF(518880)价格约 400 元/克（对应）。你有 5 万元资金想配置黄金。
  - 方案一（实物金条）：在四大行买入 AU9999 金条，单克成本 410 元（含 10 元/克手续费），共买入 ~121.95 克。银行代管，年保管费 300
    元。之后不再操作，死拿着。
  - 方案二（纸黄金 ETF）：开券商账户买 518880，手续费万 0.5%（最低 0.1 元）。首次买入 3 万元（~7500 份/约 75 克等价）。
  - 后续走势（简化版）：
  - '- 2021 年 3 月低点：价格跌至 340 元/克。方案二补仓 1 万元（~29.4 克等价）。'
  - '- 2022 年 3 月：价格回升至 390 元/克。方案二减仓 1 万元（卖出约 25.6 克等价），锁定利润。'
  - '- 2023 年 3 月底：价格突破新高 430 元/克。'
  - 问题：
  - 1. 计算方案一在 2023 年 3 月底的：持有市值、累计保管费、未实现盈亏、年化收益率（IRR 简算）。
  - 2. 计算方案二在 2023 年 3 月底的：剩余份额市值、累计手续费、已实现盈亏+未实现盈亏、年化收益率（XIRR 简算）。
  - 3. 核心差异在哪？为什么方案二能在“买在高点”前提下实现正收益？
  - 4. 如果 2020 年 8 月你买的是银行“账户黄金”（点差 1 元/克、不支持 T+0、无保管费），结果会更接近哪一方案？为什么？
- 'no': 3
  title: 资产配置压力测试：黄金底仓能否救命？
  contents:
  - 构建两个家庭金融资产组合（总资产 100 万），模拟 2022 年“股债双杀”极端行情：
  - 组合 A（无黄金）：60% 沪深 300 指数基金 + 40% 长期国债基金。
  - 组合 B（含黄金底仓）：50% 沪深 300 + 30% 长期国债 + 10% 黄金 ETF(518880)，每季度再平衡一次。
  - 2022 年关键数据（近似）：沪深 300 跌约 -22%，长期国债跌约 -5%，黄金 ETF(人民币计价)涨约 +8%。
  - 问题：
  - 1. 计算两组合 2022 年全年收益率与最大回撤。
  - 2. 如果 2023 年一季度沪深 300 反弹 +10%，黄金微跌 -2%，再平衡后组合 B 的仓位如何变化？这种“卖涨买跌”强制纪律的价值是什么？
  - 3. 为什么建议黄金配置 5%-15% 而非 30%+？结合“黄金长期年化 10%+ 低于权益 12-15%”与“无息资产机会成本”解释。
  - 4. 如果你是 2022 年底因恐慌想清仓股票全买黄金，会发生什么？（提示：追涨杀跌、放弃再平衡纪律、错过 2023 反弹）
- 'no': 4
  title: 避坑演练：识别黄金店常见“话术陷阱”
  contents:
  - 请判断下列导购话术的真伪与隐形成本，并给出反驳/应对话术：
  - 1. “小姐姐，我们这是一口价，不按克卖，但工艺绝对值这个价！买回去就是传家宝，增值快！”
  - 2. “我们这古法金/5G金/硬金，工艺费贵是因为技术含量高，硬度高不怕变形，回收也按克重收，不亏！”
  - 3. “黄金都涨价了，您买我们大品牌（周大福/老凤祥）最保值，小店金子成色不敢保证，回收还得找我们！”
  - 4. “实物金条麻烦，您直接买我们银行‘账户黄金/累积金’，随时买卖、没保管费、还能实物提取，比券商 ETF 方便多了！”
  - 5. “金价马上要涨到 500 元/克了（地缘/通胀/央行买金），现在不上车就晚了，建议您梭哈’all in’黄金！”
  - 要求：引用本章“纯度论/单克比价法/成本结构/纸黄金优势/避坑指南/择时风险”等概念逐条拆解。
units:
- 'no': 1
  name: 黄金消费与投资二元论 —— 别把“戴在身上”当成“放在账上”
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数普通人混淆“买首饰”与“买黄金”，以为买了金镯子就是投资，其实前者是消费，后者才是资产配置'
  - '- 搞不清目的会导致：消费时按投资标准苛责工艺费，投资时按消费心态买一口价、忽视流动性成本'
  - '- 只有分清两个赛道，才能在正确的规则里做正确的决策，避免“消费型投资”或“投资型消费”的双重亏损'
  - '**核心定义**'
  - '- 黄金消费：购买首饰/工艺品，核心满足审美/装饰/社交需求，价格=国际金价×克重+品牌溢价+高额工艺费+渠道成本，回收折损大，流动性差'
  - '- 黄金投资：购买金条/金豆/纸黄金(ETF/基金)，核心追求保值增值/避险配置，价格紧贴国际金价，成本透明(仅点差/手续费/管理费)，流动性强，支持灵活加减仓'
  - '**关键性质**'
  - '- 定价逻辑正交：消费端定价权在商家(品牌/设计/渠道)，投资端定价权在市场(国际金价/供需)'
  - '- 成本结构对立：消费端溢价高且不可逆(工艺费沉没)，投资端成本低且可控(手续费万0.5%、无保管费)'
  - '- 流动性天壤之别：消费端变现需找回收商、验火折损、价格打骨折；投资端T+0/T+1秒级到账、价格公开透明'
  - '**典型例子**'
  - '- 消费陷阱：花 5500 元买某福 5g 生肖挂件(AU999)，单克 1100 元，实则国际金价仅 400 元/克，溢价 175%，回收仅按 400
    元/克，亏损 60%+'
  - '- 投资正解：同等资金买黄金 ETF(518880)，手续费 0.1 元/笔，无保管费，随时可卖，2021 年 3 月低点加仓，2023 年突破新高已获正收益'
  - '**边界条件**'
  - '- 极少数古董级/大师级/限量版首饰具备艺术品属性，可能跑赢金价，但需专业鉴定能力，非普通人可为'
  - '- 婚嫁/送礼等刚性社交场景下，首饰消费不可避免，此时应承认消费属性，按“喜欢度/预算”决策，而非“投资回报”'
  sources:
  - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    role: origin
  excerpts:
  - 你是怕黄金一再涨价，想去买一个黄金手链，黄金首饰，作为装饰品... 还是说，你目前看好黄金的价值，想买“黄金”作为投资产品。这完全是两个概念，大家一定要分清楚。
  - 不要去某某生，某某福买了条黄金项链，黄金手镯就觉得自己在投资，那肯定不是这样子的。
  - 黄金的价值，其实跟品牌是完全没有关系的... 只跟它的纯度有关
- 'no': 2
  name: 黄金价值锚定纯度论 —— 只认成色，不认Logo
  points:
  - '**为什么需要这个概念？**'
  - '- 商家利用品牌光环将“纯度相同”的黄金卖出天价，普通人误以为大牌黄金更纯、更保值'
  - '- 导致同等克重下多付 30%-100% 品牌溢价，回收时却按同一国际金价结算，隐形亏损巨大'
  - '- 建立“纯度=价值”锚点，能让购买决策回归理性比价，省下冤枉钱'
  - '**核心定义**'
  - '- 黄金内在价值 = 纯度(含金量) × 重量，与品牌、工艺、渠道无关'
  - '- 国标分级：AU9999(万足金, 99.99%) > AU9995 > AU999(千足金, 99.9%, 主流流通规格) > AU995'
  - '- 含金量 ≥ 99.6% 统称 24K 金；18K 金含金量 75%，非纯金投资标的'
  - '**关键性质**'
  - '- 标准化大宗商品属性：同等纯度黄金在物理化学性质上完全同质，无差异化护城河'
  - '- 品牌溢价仅覆盖设计/服务/营销/渠道成本，不计入黄金金属价值，变现时无法收回'
  - '- 识别唯一硬指标：钢印/标签上的“AU999”“AU9999”“足金 999”等国标标识'
  - '**典型例子**'
  - '- 同为 AU999 足金手镯：周大福标价 500 元/克(含工艺费)，普通金店 430 元/克，回收商统一按国际金价 410 元/克收，前者买入即亏 90
    元/克，后者仅亏 20 元/克'
  - '- 投资金条：四大行/正规金店售出的“中国黄金/银行品牌”金条，均为 AU999/9999，单克价格紧贴上海金交所实时金价 + 少量手续费(约 10-16
    元/克)，无品牌溢价'
  - '**边界条件**'
  - '- K 金(如 18K/22K)含金量<99.6%，镶嵌钻石/工艺复杂，定价完全脱离金价，属首饰消费范畴，不可作投资标的'
  - '- 非正规渠道(无钢印/标签模糊/私人回收)存在掺杂/偷克重风险，纯度无法验证时“纯度论”失效，必须走正规渠道'
  sources:
  - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
