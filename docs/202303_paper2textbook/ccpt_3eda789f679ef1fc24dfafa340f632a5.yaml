paper: docs/202303/KfrYdaWSTobevfxC0NscSPzxnMe.md
desc: 该素材由AI绘画实践者饼公子撰写，系统阐述了从“随机出图”到“随心定制”的Midjourney提示词工程核心方法论。作者提出“主体+环境+后缀”三段式基础公式，并通过扇子定制、UI界面设计、Logo/产品/美甲等商业案例，详细演示了“认知对象结构->多维度描述标签化->组合控制变量->垫图辅助迭代”的完整工作流，强调通过结构化关键词控制变量、利用垫图解决模型认知偏差，实现商业级定制化出图与变现。
concepts:
- name: 随机出图 vs 随心定制
  desc: 区分AI绘画两种核心模式：随机指仅给定主体留空白让AI自由发挥（控制量少、变量多）；随心指对主体、环境、风格等全维度详细描述以限制生成方向（控制量大、变量少），主张从随机起步逐步走向随心。
  is_original: true
  excerpt:
  - 所谓随机，就是留下【空白】让AI去帮你填满，所谓随心，就是用【详细描述】补充画面。
  - 随机，意味着控制量少，变量多...而随心就是将你脑海中想要的那个画面，对各方面都进行【描述】，或者是对你需要的AI绘画的出图方向进行限制。
- name: 三段式提示词公式
  desc: 作者原创的基础提示词结构：主体（画面主要部分：人物、建筑等）+ 环境（背景：光影、场景等）+ 后缀（画风、艺术家、光影、视角、质量词等，不固定在最后），用于提升出图成功率。
  is_original: true
  excerpt:
  - 我自己的公式，依旧是简单的三段式：主体+环境+后缀 （有时也可省略）
  - 主体讲的是画面中的主要部分...环境讲的是画面中的背景...后缀其实很多时候并不是放在最后面，只是我这样描述会理解的简单一些，包括了画风限定词、艺术家、光影、视角等等。
- name: 对象结构化认知
  desc: 在绘制特定物品前，需先拆解其物理结构（骨架、扇面）、分类（折扇/团扇）、材质（竹/纸/瓷）、工艺（手绘/剪纸）、使用场景等领域知识，作为关键词词库的来源。
  is_original: true
  excerpt:
  - 从头开始，认识扇子...通常由若干根骨架和覆盖骨架的扇面组成...
  - 根据在百度、ChatGPT中得到的提示内容，可以从以下的几个方面着手：1）外观 2）类型 3）材质 4）制作工艺 5）使用场景
- name: 垫图/图生图迭代
  desc: 当纯文本提示词无法准确传达复杂结构（如中式团扇形制）时，上传参考图（源自淘宝/阿里巴巴实物图）建立基础框架，再结合文本提示词进行逐步微调，解决模型认知偏差。
  is_original: false
  excerpt:
  - 于是我就选择了【垫图】这个功能，上传一个参考图，让整个画面和我想要的图关联起来。把基础框架和样式弄出来...再根据得到的图，去结合客户的需求，进行一步步调整。
- name: 商业定制化工作流
  desc: 将AI绘图能力转化为商业价值的路径：AI出图草图 -> 吸引定制需求/卖图 -> 对接1688供应链落地实物 -> 交付定制产品（婚庆伴手礼、请帖、周边等）。
  is_original: true
  excerpt:
  - 项目思路：结婚...年轻人对“定制”专属自己的物品比较情有独钟。
  - 具体操作：通过AI出图，对标婚庆赛道...去吸引这部分人群接定制单，或者只出图卖图，或者去找1688商家合作出定制的实物
methods:
- name: __overview__
  desc: 素材整体方法论：领域知识检索 -> 结构化标签体系构建 -> 三段式公式填充 -> 组合控制变量生成 -> 垫图修正结构偏差 -> 迭代优化 ->
    商业化落地。
  excerpt:
  - 首先要做的事情，就是——从头开始，认识扇子...有了提示之后，我们就可以开始来进行接下来的绘画了。
  - 综合总结一下可得到定式：【扇子类型】，【外观】，【材质】，【光影】，【设定（艺术风格等）】，【颜色】，【环境】，【质量词】
  - 由【随机】到【随心】，运用AI快速出草图，快速试错进行调整。
- name: 多维度标签化描述法
  desc: 将客观对象属性拆解为正交的标签维度（类型、外观、材质、工艺、场景），每个维度准备候选词库，通过排列组合生成精准提示词。
  excerpt:
  - 可以从以下的几个方面着手：1）外观... 2）类型... 3）材质... 4）制作工艺... 5）使用场景...
  - 比如我想要【青色折扇】【丝绸质地】【手工制作】【舞蹈扇子】那就写下来关键词：cyan folding fan，silk texture，handmade，dance
    fan
- name: 组合控制变量法
  desc: 在生成过程中，保持核心主体不变，单次仅调整一个或一组相关维度（如仅换材质、仅换光影、仅加特效），对比输出差异，精准定位最优参数组合。
  excerpt:
  - 总得来说，是要让画面跟随你的想法去变动，你要做的就是一个简单的选择——控制变量
  - 效果并不是那么好怎么办？添加一些光影，然后再增加一些环境词和后缀词...再来一点点变化，让图案变得有趣起来，扇子正在燃烧怎么样？
- name: 垫图辅助结构锚定法
  desc: 针对模型对特定文化/结构对象（如团扇）理解偏差，使用实物参考图作为Image Prompt锚定基础形制，再叠加文本提示词进行细节定制，解决“词不达意”问题。
  excerpt:
  - 是不是因为MJ工具，现在并不能很好的理解中文团扇的意思，得不到比较好的基础图？于是我就选择了【垫图】这个功能，上传一个参考图...把基础框架和样式弄出来
- name: UI/图标设计提示词模板化
  desc: 针对UI设计场景，将三段式公式细化为：【UI界面选择】，【主体特性】，【具体描述】，【色彩/环境/流派设定】，【风格】，【画质提升词】；图标设计为：【图标设计类型选择】，【具体描述】，【颜色/流派/风格设定】，【画质提升词】。
  excerpt:
  - 整理一下得到以下的定式：【UI界面选择】，【主体特性】，【具体描述】，【色彩/环境/流派设定】，【风格】，【画质提升词】
  - 依旧是根据公式略改一下，【图标设计类型选择】，【具体描述】，【颜色/流派/风格设定】，【画质提升词】
theorems:
- name: 结构化提示词确定性主张
  desc: AI绘画出图质量与可控性正相关于提示词的结构化程度；通过“主体+环境+后缀”三段式及领域细分标签显式约束生成空间，可显著提升商业级出图成功率。
  excerpt:
  - 要想画出一幅你想要的画面，核心内容还是“写好关键词”。
  - 当然并不是只有定式能才能出好看的图，只是有定式或者公式能提升你出好看的图的概率。
- name: 认知差距需外部知识弥补主张
  desc: 模型对特定文化载体（如中式团扇）存在先验认知偏差，单纯文本提示词难以纠正；必须引入外部知识（百度/ChatGPT）构建词库，并结合垫图提供视觉先验，才能实现精准定制。
  excerpt:
  - 如果你不知道扇子的种类/特性的话，可以求助万能的度娘和大家正在玩的ChatGPT
  - 是不是因为MJ工具，现在并不能很好的理解中文团扇的意思，得不到比较好的基础图？于是我就选择了【垫图】这个功能
- name: AI赋能传统产业定制化商业模式主张
  desc: AI绘画工具可重塑“设计-生产-销售”链路：设计端从人工绘图转为AI快速试错出草图，生产端对接柔性供应链（1688），销售端切中年轻群体“定制化仪式感”需求，实现低门槛商业变现。
  excerpt:
  - 项目思路：结婚...现在的年轻人对“定制”专属自己的物品比较情有独钟。
  - 通过AI出图，对标婚庆赛道...去吸引这部分人群接定制单，或者只出图卖图，或者去找1688商家合作出定制的实物
- name: 通用视觉设计迁移性主张
  desc: 基于结构化提示词的方法论具有跨领域迁移性，同一套“主体-属性-环境-质量”分析框架可直接复用于UI、Logo、产品、美甲、头像、贴纸等一切视觉感官类设计场景。
  excerpt:
  - 我觉得未来只要是涉及视觉感官类的，都可以用到。比如：1）LOGO设计... 2）概念包装、产品设计... 3）美甲... 4）头像壁纸... 5）周边贴纸
findings:
- name: 单词歧义导致生成偏离案例
  desc: '[evidence] 输入单词 ''FAN'' 单独生成，模型输出现代工业品‘电风扇’而非传统‘扇子’，证明单一主体词存在语义歧义，必须添加限定词（如
    folding fan, round fan）消歧。'
  excerpt:
  - 因为FAN还有电风扇的意思，midjourney根据这个词就出了这个图。如何让midjourney理解，你要的是“扇子”而不是现代工业品的电风扇呢？加上你的限定词与修饰词，让它变化！
- name: 纯文本提示词难控复杂结构案例
  desc: '[evidence] 针对‘喜庆红色团扇、镂空、金色花朵、金属光泽、珍珠、流苏、长扇柄’的详细文本提示词，连续两次生成均未能准确呈现‘团扇’形制与‘长扇柄’细节，证明复杂结构对象单靠文本难以精准控制。'
  excerpt:
  - 和我想要的差别也太大了吧？而且很多特征都明显不对...特征还是不够明显，词语不能被识别
- name: 垫图修正结构偏差有效性验证
  desc: '[evidence] 引入淘宝实物团扇图作为垫图后，生成结果迅速锚定正确的团扇基础框架（圆形扇面、扇柄结构），后续叠加文本提示词可精准控制装饰细节（镂空、珍珠、流苏），验证了“图生图+文本”混合模式的有效性。'
  excerpt:
  - 把基础框架和样式弄出来，（垫图的原图哪里找?淘宝、阿里巴巴一大堆）再根据得到的图，去结合客户的需求，进行一步步调整。
  - 由【随机】到【随心】，运用AI快速出草图，快速试错进行调整。
- name: UI设计模板迁移实测有效
  desc: '[evidence] 使用 ‘Ui Design system, IOS, Dashboard, Automobile industry, cool
    Porsche 911, minimalism, blue, vector graphics, HD, 8K’ 等结构化提示词，成功生成符合iOS设计规范、含毛玻璃材质、特定配色的Dashboard界面；修改参数为
    ‘Website, Crude oil industry, Material design, Pink, 3D’ 亦能生成对应风格界面，验证模板复用性。'
  excerpt:
  - 可以看出上述图片有了一定的效果...界面我想要个毛玻璃效果，我再来调整一下...换个其他的界面和行业试试看...加个3D看看效果
- name: 图标设计风格一致性验证
  desc: '[evidence] 使用 ‘website icon design, Wheel shape, Morandi Blue, vector graphics,
    clear, ground glass, HD, 8K’ 及 ‘apple icon, isometric 3d, color, holographic,
    Minimalism, white background, 8k, HD’ 生成的图标组，风格统一、材质质感（磨砂玻璃/全息/矢量）准确呈现，证明结构化提示词在小尺寸图标设计上的可控性。'
  excerpt:
  - 依旧是根据公式略改一下...网站图标设计，车轮形状，莫兰迪蓝，矢量图形，清晰，磨砂玻璃，高清，8K
  - 再做一个3D的看看~ 苹果图标，等角三维，彩色，全息，极简主义，白色背景，8k，HD
