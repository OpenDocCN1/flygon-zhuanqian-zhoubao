- └── 放大策略：Default/Light/Beta/Max/Niji/Remaster  —— P002
life_analogy:
- 想象AI绘画是一个**定制西装的全流程**：
- '- **随机出图** = 走进裁缝店只说‘给我做件衣服’，裁缝随机拿料、随机剪裁、随机缝制，出来可能是西装、睡衣或雨衣'
- '- **随心定制** = 你提供：**主体**（西装/衬衫/大衣）、**环境**（商务/婚礼/户外）、**后缀**（英伦风/修身版/羊毛面料/纳扣/手工缝制/大师剪裁）'
- '- **三段式公式** = 标准化量体单：体型数据(主体) + 穿着场景(环境) + 工艺规格单(后缀)'
- '- **多维标签库** = 面料库(材质)、版型库(外观)、工艺库(制作工艺)、配色库(色彩)、配件库(参数)按需点单'
- '- **组合控制变量** = 试装环节：每次只改一处（如仅换领型、仅调袖长、仅换面料），精准定位最优方案'
- '- **垫图锚定** = 带一件旧西装/参考图给裁缝：‘版型照这个来，面料换那个，细节按我说的’'
- '- **参数决策表** = 裁缝工艺手册：什么面料配什么针脚密度(参数兼容性)，什么版型适合什么场合(模型选择)'
- '- **商业模板** = 成衣系列标准化SOP：商务系列/休闲系列/礼服系列各有固定工艺单，新客户来了套模板改尺寸即可交付'
- 就像高级定制需要‘量体-选料-定版-试装-交付’标准化流程，AI绘画商业化也需要结构化提示词工程体系。
summary:
- concept: 随机出图 vs 随心定制
  desc: AI绘画两大核心模式：留空白自由发挥 vs 全维度限定生成空间
- concept: 三段式提示词公式
  desc: 主体(核心对象)+环境(背景光影)+后缀(风格/参数/质量词)通用组装架构
- concept: 多维标签化描述
  desc: 将对象属性拆解为正交维度标签库(类型/材质/工艺/场景等)，点单式拼装替代造句
- concept: 组合控制变量法
  desc: 锁定主体框架，单轮仅调整一个维度(光影/材质/参数)，对比差异精准归因
- concept: 垫图/图生图锚定
  desc: 上传参考图提供结构先验锚定骨架，文本控制皮肤细节，解决词不达意
- concept: Prompt本质=限定词
  desc: 每个词收缩生成空间，未限定维度模型随机填充，高质量输出源于主动限定更多维度
- concept: Seed确定性机制
  desc: V4/V5/Niji下相同Prompt+Seed+参数=完全一致图像，支撑复现与单变量实验
- concept: 商业设计场景化模板
  desc: UI/图标/Logo/产品/美甲等领域专用槽位模板，固化技术参数与领域术语
- concept: AI绘画资源四层工具链
  desc: 灵感检索(OpenArt/Lexica)→词法构建(Promptomania)→风格定向(WeirdWonderfulAI)→本地化(AI画廊/词图/LiblibAI)
- concept: Midjourney参数全景
  desc: 结构控制(--ar/--chaos/--seed)审美控制(--stylize/--quality)功能控制(--tile/--video/--no)模型选择(--v/--niji)
- concept: 兼容性决策表
  desc: 模型版本决定参数可用性与范围(如--video仅V1-V3/Test)，避开无效调参陷阱
- concept: 分辨率放大策略
  desc: Default/Light/Beta/Max/Niji/Remaster六路径差异化选择，适配人脸/细节/动漫等题材
- concept: 商业定制化工作流
  desc: AI草图→吸引定制/卖图→对接1688柔性供应链→交付实物定制产品(婚庆/周边/礼品)
- concept: 认知差距外部弥补
  desc: 模型长尾知识盲区需百度/ChatGPT构建词库+垫图提供视觉先验双重补全
- concept: 通用视觉设计迁移性
  desc: 同一结构化分析框架跨UI/图标/产品/美甲等视觉领域复用，仅需替换领域词汇表
exercises:
- 'no': 1
  title: 三段式提示词拆解与重组实战
  contents:
  - 给定目标：生成一张‘莫兰迪色系、磨砂玻璃质感、iOS风格、车载中控仪表盘界面，含速度/里程/油耗三个核心仪表，深色模式，8K分辨率’。
  - 任务：
  - 1. 按‘主体+环境+后缀’三段式拆解上述需求，填入对应槽位
  - 2. 从多维标签库（界面类型/风格/材质/色彩/质量词/参数）中选词补全，输出标准Midjourney Prompt
  - 3. 对比两版Prompt：仅用自然语言描述 vs 结构化标签拼装，分析Token数差异与语义精准度差异
  - 思考题：
  - '- 为什么UI设计模板要单独列出‘界面选择’槽位，而不归入主体？'
  - '- 当需求改为‘安卓Auto风格、高对比度、强光下可读’时，仅需修改哪几个槥位？'
- 'no': 2
  title: 组合控制变量法：单因素迭代优化
  contents:
  - 基础Prompt：`cyan folding fan, silk texture, handmade, dance fan, stage lighting,
    dark background, volumetric lighting, 8k, masterpiece --ar 3:4 --v 5 --stylize
    250 --seed 12345`
  - 任务：设计4轮单变量迭代实验，每轮仅调整一个维度，记录预期效果差异：
  - 1. 第1轮：仅替换材质词（silk texture → bamboo / porcelain / gold foil / glass），预测光影与质感变化
  - 2. 第2轮：仅替换环境光影词（stage lighting, dark background → natural sunlight, garden / neon
    lights, cyberpunk street / studio lighting, gradient background），预测氛围迁移
  - 3. 第3轮：仅添加特效词（无 → burning particles / frozen ice crystals / blooming flowers /
    dissolving sand），预测叙事张力变化
  - 4. 第4轮：仅调整 --stylize 参数（250 → 50 / 500 / 750 / 1000），预测艺术度与提示词遵循度曲线
  - 思考题：
  - '- 为什么固定 --seed 12345 是单变量法的前提？若不固定 Seed 会发生什么？'
  - '- 材质 × 光影 存在交互效应时（如金属材质需强反光环境），单变量法可能遗漏最优组合，如何补救？'
- 'no': 3
  title: 垫图结构锚定：解决复杂文化载体生成偏差
  contents:
  - 场景：需要生成‘宋式点翠凤冠，十二花钿，珍珠垂帘，金丝编织，螺钿嵌饰，博物馆级文物摄影，灯光聚焦，纯黑背景’。
  - 任务：
  - 1. 先用纯文本 Prompt 直接生成 4 张图，观察结构性错误（如冠体比例、垂帘物理、嵌工艺细节）
  - 2. 在淘宝/博物馆官网/考古报告找 3 张高清实物参考图（正视图/侧视图/细节图），作为 Image Prompt 垫图
  - 3. 设计混合模式 Prompt：`[Image URL 1] [Image URL 2] --iw 0.5 --no text,watermark,blur,low
    quality,modern --ar 3:4 --v 5 --stylize 200` + 文本细节词
  - 4. 对比垫图前后生成结果的结构准确率、细节还原度、审美一致性
  - 思考题：
  - '- --iw 权重设为多少合适？过高（>1）与过低（<0.1）分别会导致什么后果？'
  - '- 参考图若包含展柜玻璃反光/标尺/标签等干扰元素，会如何误导模型？如何预处理规避？'
  - '- 该方法能否迁移至‘清式龙袍纹样’、‘唐三彩马’等其他文物复原场景？关键迁移条件是什么？'
- 'no': 4
  title: 商业模板迁移：从UI设计到图标族生成
  contents:
  - 已有 UI 模板：`[UI界面选择], [主体特性], [具体描述], [色彩/环境/流派设定], [风格], [画质提升词]`
  - 任务：
  - 1. 将 UI 模板改造为‘品牌Logo设计模板’，定义 6 个槽位及各槽位候选标签库（如：Logo类型/品牌属性/视觉隐喻/构图结构/色彩策略/风格流派/技术规格）
  - 2. 用新模板生成 3 组差异化 Logo 族：
  - '   - 组A：新中式茶饮品牌，极简线条，负空间构图，朱砂红+留白，矢量输出'
  - '   - 组B：硬核科技芯片公司，等角3D，电路纹理隐喻，电光蓝+深空灰，可动效扩展'
  - '   - 组C：儿童研学文旅IP，手绘水彩，吉祥物主视觉，莫兰迪多巴胺配色，周边延展性强'
  - 3. 对比三组生成结果的商业可用度：矢量化友好度、小尺寸识别度、多场景延展性
  - 思考题：
  - '- Logo模板为何不需要‘环境’槽位？什么场景下需引入‘应用场景展示’作为后缀？'
  - '- 如何在模板中固化‘矢量输出/无文字/纯色背景/安全区留白’等工程化约束？'
- 'no': 5
  title: 参数兼容性决策表实战查阅
  contents:
  - 场景：需生成以下 4 类图像，请查阅参数-模型兼容性矩阵，为每类选择最优模型版本与核心参数组合：
  - 1. 无缝纹理素材：要求可平铺、分辨率≥2048px、风格为威廉·莫里斯花卉纹样
  - 2. 动漫角色三视图：要求角色一致性极高、含正侧后三面、线稿风格、透明背景
  - 3. 照片级产品渲染图：要求材质物理真实（SSS/次表面散射/菲涅尔反射）、8K、景深可控
  - 4. 创意概念分镜视频：需生成 4 秒演变过程、从种子发芽到开花、定格动画风格
  - 任务：填表决策：
  - '| 场景 | 推荐模型 | 核心参数组合 | 关键兼容性约束 | 备选方案 |'
  - '|------|------------|----------------|------------------|----------|'
  - '| 无缝纹理 |          |                |                  |          |'
  - '| 动漫三视图 |          |                |                  |          |'
  - '| 产品渲染 |          |                |                  |          |'
  - '| 分镜视频 |          |                |                  |          |'
  - 思考题：
  - '- 为什么 --tile 不支持 V4/Niji？V5 如何实现无缝纹理的原生高分辨率输出？'
  - '- --video 参数仅支持早期模型，若在 V5/Niji 需求动态视频，当前可行路径有哪些？（提示：外部工具/帧插值/ControlNet）'
  - '- 动漫三视图为何首选 --niji 5 而非 --v 5 + 动漫关键词？一致性机制有何本质差异？'
