  name: 业务分层IP配置策略 —— 给每个账号配对的“鞋子”
  points:
  - '**为什么需要这个概念？**'
  - '- 所有账号统一用一种 IP：要么成本爆炸，要么风控暴雷'
  - '- 账号价值、操作频次、平台风控等级差异巨大，需分层匹配资源'
  - '- 实现“安全账号用好 IP、流量账号用便宜 IP、废号不用 IP”的资源最优化'
  - '**核心定义**'
  - '- 高频大流量（发帖/聊天/成熟电商店铺） → 静态服务器 IP（包月不限流）'
  - '- 高价值/高风控/低频（注册/养号/核心大号/客户账号） → 动态住宅 IP（按量付费）'
  - '- 跨平台账号（FB+IG）可共享环境/IP，因平台间数据不互通，降低环境创建成本'
  - '**关键性质**'
  - '- 成本效率最优：将 IP 成本从“固定成本”转为“边际成本随业务价值波动”'
  - '- 安全隔离性：不同层级 IP 池物理隔离，避免低价值账号污染高价值账号 IP 信誉'
  - '- 运维标准化：建立“账号分级→IP派单→监控通过率→异常熔断”全流程 SOP'
  - '**典型例子**'
  - '- 100 号矩阵：80 个发帖号走 2 台云服务器 IP（月固定 100 元），20 个核心号走动态住宅 IP（月浮动 200 元），总成本 300 元/月'
  - '- 同一环境跑 FB+IG 双平台：省 1 个环境创建成本，省 1 个 IP 成本，安全无关联'
  - '**边界条件**'
  - '- 平台风控升级可能导致原“低风控”业务瞬间变“高风控”，需建立 IP 定期巡检机制'
  - '- 团队协作时需严格权限隔离：运营只见环境，不见 IP 配置、不见账号密码'
  - '- 账号价值随运营阶段变化（如养号成功转核心号），需支持 IP 平滑迁移不换环境'
  sources:
  - paper: docs/202303/20230328_016.md
    role: origin
  excerpts:
  - 发帖，聊天的社交账号用服务器 IP，因为发帖聊天会消耗比较多的流量，用动态 IP 太贵，服务器 IP 是包月付费不限流量的，会比较划算。
  - 那些不常用的账号，或者特别重要的账号用动态住宅 IP，因为是按流量付费，不用就不收费，更划算也更安全。
  - 我有一个 facebook 账号，一个 Instagram 账号，我可以用同一个浏览器环境，同一个 IP 同时登陆吗？当然可以，因为平台不一样。
