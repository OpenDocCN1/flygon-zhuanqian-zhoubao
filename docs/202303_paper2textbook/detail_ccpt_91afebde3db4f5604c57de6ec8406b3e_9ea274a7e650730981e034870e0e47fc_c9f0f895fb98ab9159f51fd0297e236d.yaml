units:
- 'no': 1
  name: 做事难题必然性 —— 承认“坑”是路的一部分
  points:
  - '**为什么需要这个概念？**'
  - '- 很多新手幻想找到“无坑指南”或“避坑地图”，试图绕过困难直接拿结果'
  - '- 现实是：只要在推进事务，就会持续遭遇新难题，且事业规模越大、难题等级越高'
  - '- 甚至存在根本无解的结构性难题（如平台风控、宏观环境变化），逃避无用，唯有直面'
  - '**核心定义**'
  - '- 做事难题必然性：推进事务过程中，难题持续涌现、规模正相关、部分无解的客观规律'
  - '- 核心变量：事务规模（正相关）、难题可解性（部分为零）、心理预期（常被低估）'
  - '**关键性质**'
  - '- 常态化：难题非异常状态，而是执行过程的标配'
  - '- 规模正相关：想做大事，必遭大难题；不想遭难题，只能做小事甚至不做'
  - '- 部分无解：存在系统性风险（如平台封号），无法通过技术手段规避，只能通过策略对冲'
  - '**典型例子**'
  - '- 生财有术新一期拉新：预约群达6000+人规模，看似胜利在望，实则触发微信风控导致群全封、核心账号永封、损失数万好友'
  - '- 元气森林创始人坦言：创业者都没硬壁垒，会持续被打，唯一的壁垒是比对手更能扛'
  - '**边界条件**'
  - '- 仅适用于“主动推进事务”的主体，躺平者不产生新难题（但面临被淘汰的大难题）'
  - '- 无解难题的比例随系统复杂度上升（如依赖平台生态、涉及重监管行业）'
  - '- 认知该规律不等于拥有解题能力，仅是心智建设的前置条件'
  sources:
  - paper: docs/202303/20230328_033.md
    role: origin
  - paper: docs/202303/20230328_036.md
    role: improve
  excerpts:
  - 只要在做事，就会不停的遇到新的难题，事情做的越大，要解决的难题就越大，好多问题甚至是无解的。
  - 结果昨天触发微信风控，群都被封了。昨天鱼丸也被莫名其妙永封了好几个号，失去了几万个好友。
  - 没有脆弱没有纠结没有内耗，干就完了，继续前进。
  - 长期来看，其实很难存在小而美的生意模式的，因为你小你压根也不赚什么钱，你最后会放弃；你不做大呢其实你会一直被人干，只要你想做这个事儿，你就必须逼自己不断的成长
  - 元气森林创始人最近发的视频号火了，大概讲的就是创业者其实都没什么壁垒，你会持续被打，你唯一的壁垒就是你比你对手能扛。现在你遇到的所有困难，也是你竞争对手之后也会遇到的事，当你克服了那些你认为克服不了的问题，你就有了壁垒了
- 'no': 2
  name: 私域资产归属权 —— 你的私域其实是“租来的”
  points:
  - '**为什么需要这个概念？**'
  - '- 运营者习惯称微信群、好友、账号为“我的私域资产”，产生控制权错觉'
  - '- 忽视了底层基础设施（微信）掌握在平台手中，规则变更、风控触发时，资产瞬间归零'
  - '- 必须在认知层面确立“使用权≠所有权”，才能在架构层面做去中心化备份与风险对冲'
  - '**核心定义**'
  - '- 私域资产归属风险：建立在中心化平台（微信/抖音/小红书）之上的流量池（群、好友、账号、数据），所有权与最终控制权归平台，运营者仅拥有阶段性、可撤销的使用权'
  - '**关键性质**'
  - '- 不可抗力：平台风控不讲情面、不通知、不可申诉、不可逆'
  - '- 资产脆弱性：单点故障导致全盘崩塌（如核心号被封、总群被封）'
  - '- 迁移成本高：好友关系链、群组织结构、历史信任沉淀难以在新账号/新平台低成本复现'
  - '**典型例子**'
  - '- 亦仁团队拉新群6000+人被封、核心运营号“鱼丸”多号永封、数万好友归零'
  - '- 评论区成员“盐铁”呼吁：有没有方法导出微信好友，找回未来的生财大军（反映资产被锁定的无力感）'
  - '**边界条件**'
  - '- 企业微信/视频号等官方工具虽提供部分数据导出能力，但核心社交图谱仍受管控'
  - '- 去中心化协议（如Nostr、Lens）理论上解决归属权，但当前用户迁移成本极高、生态未成熟'
  - '- 合规经营可降低触发概率，但无法消除平台单方面修改规则导致的系统性风险'
  sources:
  - paper: docs/202303/20230328_033.md
    role: origin
  excerpts:
  - 结果昨天触发微信风控，群都被封了。
  - 昨天鱼丸也被莫名其妙永封了好几个号，失去了几万个好友。
  - '盐铁 : 有没有方法可以导出微信好友，找回咱未来的生财大军！'
- 'no': 3
  name: 零内耗行动力 —— 情绪不解决问题，行动才能
  points:
  - '**为什么需要这个概念？**'
  - '- 面对群被封、号被封、损失数万好友等重大挫折，人类本能反应是脆弱（自我怀疑）、纠结（反复复盘）、内耗（情绪消耗）'
  - '- 这些情绪反应零产出，反而延误了止损、复盘、重启的黄金时间窗口'
  - '- 必须建立“接受现实 → 调整策略 → 立即执行”的条件反射，将心理能量100%转化为行动能量'
  - '**核心定义**'
  - '- 零内耗行动力：面对不可控重大挫折时，不产生脆弱/纠结/内耗等负面情绪消耗，立即接受既定事实，将认知带宽全部释放给“下一步怎么干”的执行特质'
  - '**关键性质**'
  - '- 接纳现实：不问“为什么是我”，只认“已经发生了”'
  - '- 切割情绪：将情绪处理时间压缩至极限（分钟级），甚至直接带着情绪干活'
  - '- 行动导向：唯一关注点是“当前资源下，能做的最优动作是什么”'
  - '**典型例子**'
  - '- 亦仁面对拉新群全封、核心号全封：“没有脆弱没有纠结没有内耗，干就完了，继续前进”'
  - '- 团队协作层面：成员“六妹”见证团队“完全没有内耗，没有沮丧，只有办法和行动”'
  - '**边界条件**'
  - '- 非逃避复盘：事后必须复盘技术原因（如拉新动作触发风控阈值），但复盘与情绪内耗是两码事'
  - '- 非盲目蛮干：行动基于对现状的理性评估（剩余账号、可用渠道、时间窗口），非情绪化冲锋'
  - '- 需要长期心智训练支撑：平时练习“小挫折零内耗”，关键时刻才能“大挫折不崩塌”'
  sources:
  - paper: docs/202303/20230328_033.md
    role: origin
  excerpts:
  - 没有脆弱没有纠结没有内耗，干就完了，继续前进。
  - '六妹 : 一起参与其中，团队完全没有内耗，没有沮丧，只有办法和行动'
- 'no': 4
  name: 极限压力测试式复盘 —— 在自我怀疑中提炼底层逻辑
  points:
  - '**为什么需要这个概念？**'
  - '- 创业/做事过程中，认知重构往往发生在“至暗时刻”（收入归零、被平台打压、遭恶意攻击、自我彻底怀疑）'
  - '- 舒适区的复盘只能产出“正确的废话”，唯有极限压力下的诚实记录与思辨，能提炼出可迁移的底层逻辑'
  - '- 需要一套方法论：将主观痛苦客观化、将个案经验普遍化、将模糊感受结构化'
  - '**核心定义**'
  - '- 极限压力测试式复盘法：第一人称记录真实创业节点（离职/限流/投诉/收入归零）的心理轨迹，引入同行对标与权威观点印证，在自我怀疑与释怀的张力中完成认知重构（无中间值/壁垒本质/动机重构）'
  - '**关键性质**'
  - '- 真实性：记录丑陋、软弱、动摇、甚至想放弃的真实念头，不美化、不事后诸葛亮'
  - '- 对标性：引入同阶段同行（如90后社群创业者焦虑出海）、头部大V（40w粉付出代价）、权威观点（元气森林创始人）作为外部坐标系'
  - '- 辩证性：在“怀疑初衷→认知规律→观察同行痛苦→引入权威重构→确立使命锚点”的张力中完成跃迁'
  - '**典型例子**'
  - '- 刘晨昊复盘：因职场PUA离职→小红书限流收入断崖→怀疑初衷想放弃→聊天得知“半山腰”理论→对标头部大V痛苦质疑目标→引入元气森林创始人“抗压=壁垒”观点→释怀确立“使命情怀”锚点→得出“我们喜欢的是克服困难后的自己”'
  - '**边界条件**'
  - '- 仅适用于已投入实战、遭遇实质性挫折的主体，旁观者无法触发同等认知强度'
  - '- 需具备基础认知储备（如知晓“半山腰”、“Always Day 1”等概念），否则极限压力只会导致崩溃而非重构'
  - '- 复盘产出的底层逻辑需在后续实战中反复验证，否则仅是事后合理化的叙事'
  sources:
  - paper: docs/202303/20230328_036.md
    role: origin
  excerpts:
  - 今年 2 月初我做了一个自己的社群...3 月初开始，整个小红书账号被限流...收入自然也是断崖式的下跌
  - 今天中午和一个科技公司的创始人聊天...今天我们社群里还聊到了一个同样的 90 后社群创业者...上周我的社群请来了小红书 40w 粉丝的直播带货大 v
  - 元气森林创始人最近发的视频号火了...然后我就释怀了
  - 创业这件事情，好像没有中间值，你要么不做，要做就要 all in
  - 我们普通人能做的创业项目其实是没有壁垒的，出来后被抄袭被打压一定是正常的
  - 其实创业者还是需要一些使命情怀愿景的，因为只有这些虚无缥缈的东西才会支撑你度过一个又一个至暗时刻
  - 我们也许喜欢的都不是钱，是那个克服一个又一个困难的自己吧
- 'no': 5
  name: 创业无中间值 —— 要么不做，要么 All in
  points:
  - '**为什么需要这个概念？**'
  - '- 很多新手幻想“小而美”、“兼职创业”、“赚点零花钱就收手”，追求舒适区中间值'
  - '- 现实是：创业一旦启动，即进入“Always Day 1”模式，每天被迫解决新问题、不断迭代自我，不存在稳态'
  - '- 认清“无中间值”，能让人在启动前校准预期，启动后拒绝幻想“歇会儿”，只能全力以赴'
  - '**核心定义**'
  - '- 创业状态二元论：创业不存在舒适的中间状态，要么不做（零投入、零风险、零收益），要么 All in（全身心投入、持续迭代、被迫成长）'
  - '**关键性质**'
  - '- 强制进化：平台算法迭代、竞争对手进化、用户需求升级，倒逼创业者必须同步进化，停滞即退场'
  - '- 双向挤压：半山腰阶段，比你小的嫉妒攻击、比你大的降维打击，不做大就只能死'
  - '- 无兼职选项：兼职/半退休是伪命题，要么不做，要做就要 all in'
  - '**典型例子**'
  - '- 刘晨昊：起初只想做小生意赚稳定钱，发现“一旦创业，真的就是 always day 1，每天都必须被迫不断解决新的问题、不断迭代自己”'
  - '- 头部大V（40w粉）：为增长陷入焦虑、疯狂输出、做线下活动、甚至想出海洗海外市场，付出远超想象'
  - '**边界条件**'
  - '- 适用于平台型、个人IP型、高不确定性创业模式；重资产、强牌照、强监管的传统实体生意可能存在相对稳态'
  - '- “All in”非指盲目拼命，指“核心精力、决策权重、资源优先级”全倾斜，而非物理时间的24小时工作'
  - '- 启动前必须评估：我是否接受“未来3-5年无舒适期、持续高强度解题”？不接受则不建议启动'
  sources:
  - paper: docs/202303/20230328_036.md
    role: origin
  excerpts:
  - 创业这件事情，好像没有中间值，你要么不做，要做就要 all in
  - 他说他起初也就想做个小生意...结果会发现一旦创业，真的就是 always day 1，每天都必须被迫不断解决新的问题、不断迭代自己
  - 长期来看，其实很难存在小而美的生意模式的，因为你小你压根也不赚什么钱，你最后会放弃；你不做大呢其实你会一直被人干，只要你想做这个事儿，你就必须逼自己不断的成长
- 'no': 6
  name: 抗压持久力壁垒 —— 比对手多活一天，就是赢
  points:
  - '**为什么需要这个概念？**'
  - '- 普通创业者缺乏专利、技术、品牌、资金等传统护城河，面对抄袭、打压、平台收割显得赤裸裸'
  - '- 传统壁垒理论导致新手陷入“找壁垒”焦虑，实则在高不确定性环境下，唯一可控、可积累、不可复制的壁垒是生存韧性'
  - '- 将“壁垒”重新定义为“抗压持久力”，能极大降低新手认知负担，聚焦核心变量：活下来、扛过去'
  - '**核心定义**'
  - '- 抗压持久力壁垒：对于无硬核护城河的普通创业者，核心壁垒不是“拥有什么稀缺资源”，而是“比竞争对手更早、更狠地克服同类困难”所形成的生存韧性与经验资产'
  - '**关键性质**'
  - '- 对称性：你遇到的困难，竞争对手迟早也会遇到；你先克服、克服得更彻底，就是建立壁垒'
  - '- 累积性：每克服一个“自认为克服不了”的难题，壁垒厚度+1，形成复利'
  - '- 唯一性：无法购买、无法复制、无法外包，只能亲身经历、亲自扛过'
  - '**典型例子**'
  - '- 元气森林创始人：创业者都没壁垒，会持续被打，唯一壁垒是比对手能扛；克服那些你认为克服不了的问题，你就有壁垒了'
  - '- 刘晨昊：人生在世，主打一个比谁活的更久，比谁更能抗下去'
  - '**边界条件**'
  - '- 非盲目硬抗：需结合“止损试错机制”（如单账号100条无果切换项目），在战略方向正确的前提下战术灵活抗压'
  - '- 非自我感动：抗压的终点是“克服困难后形成的新能力/新资源/新认知”，而非单纯熬时间'
  - '- 需配合“使命情怀”锚点：纯靠意志力抗压会枯竭，唯有使命/情怀提供无限续航动力'
  sources:
  - paper: docs/202303/20230328_036.md
    role: origin
  excerpts:
  - 元气森林创始人最近发的视频号火了，大概讲的就是创业者其实都没什么壁垒，你会持续被打，你唯一的壁垒就是你比你对手能扛。现在你遇到的所有困难，也是你竞争对手之后也会遇到的事，当你克服了那些你认为克服不了的问题，你就有了壁垒了
  - 我们普通人能做的创业项目其实是没有壁垒的，出来后被抄袭被打压一定是正常的
  - 人生在世，主打一个比谁活的更久，比谁更能抗下去
- 'no': 7
  name: 使命情怀锚点 —— 穿越至暗时刻的无限续航燃料
  points:
  - '**为什么需要这个概念？**'
  - '- 金钱动力具有边际效用递减、高非货币成本（掉发、失眠、焦虑）、在至暗时刻易失效的特点'
  - '- 创业周期长、波动大，需要一种虚无缥缈但功能极强的内在锚点，支撑穿越一个个“至暗时刻”'
  - '- 使命/情怀/愿景虽不可触摸，但具备无限续航力，是长期主义者的核心燃料'
  - '**核心定义**'
  - '- 使命情怀锚点：超越金钱层面的、具有超越性意义的内在驱动力（使命/情怀/愿景/价值观），在金钱边际效用递减、非货币成本高企的至暗时刻，提供无限续航动力，支撑创业者持续克服困难、形成层层壁垒'
  - '**关键性质**'
  - '- 反脆弱：越是艰难时刻，使命感越能激发潜能（金钱动力相反）'
  - '- 长周期：支撑5-10年甚至更长周期的坚持，而非短期冲刺'
  - '- 筛选性：能被使命驱动的人，天然具备长期主义特质，更易熬过周期'
  - '**典型例子**'
  - '- 刘晨昊：起初觉得使命情怀“无聊甚至无病呻吟”，至暗时刻才发现“只有这些虚无缥缈的东西才会支撑你度过一个又一个至暗时刻”'
  - '- 从“给1000万让我干啥干啥”转变为“先问代价/吃苦/掉发/失眠”，实证金钱动力在高压下的边际替代率上升'
  - '**边界条件**'
  - '- 非空谈情怀：使命必须转化为具体的“帮谁、解决什么问题、创造什么价值”，否则是自我感动'
  - '- 非排斥赚钱：赚钱是验证价值、维持生存、复投资源的必要手段，使命决定方向，赚钱保障续航'
  - '- 需真实信仰：伪装的使命在至暗时刻会瞬间崩塌，只能源于真实的认知与体验'
  sources:
  - paper: docs/202303/20230328_036.md
    role: origin
  excerpts:
  - 其实创业者还是需要一些使命情怀愿景的，因为只有这些虚无缥缈的东西才会支撑你度过一个又一个至暗时刻，克服一个又一个困难，最后形成你自己的一层又一层壁垒
  - 我起初看到这个题目时我觉得无聊甚至无病呻吟...但是站在当下这个节点，我确实觉得我会先问一句：需要我具体付出多大代价？吃多少苦？掉多少头发？一夜不眠多少次？
  - 我们也许喜欢的都不是钱，是那个克服一个又一个困难的自己吧
