paper: docs/202303/20230328_018.md
desc: 该素材为生财有术星球《风向标》专栏第八期航海教练阿丰的开场介绍帖，主要确立了作者作为多平台（公众号、小红书、快手、抖音）爆款内容创作者的实战资质，并引导读者跳转至语雀文档查看完整版《如何寻找风向标》教程，评论区补充了链接在星球App内的正确打开方式。
concepts:
- name: 风向标
  desc: 生财有术社区专栏/项目名称，指代一套寻找内容选题、捕捉流量趋势的方法论体系，也是本次航海活动的核心主题。
  is_original: true
  excerpt:
  - 《如何寻找风向标》
  - 2023 年 2 月风向标航海教练
  - 在这次航海上分享了一点关于风向标的心得
- name: 航海教练
  desc: 生财有术社区特有角色，指在‘航海’（实战训练营）活动中带领学员实操、答疑、复盘的资深从业者。
  is_original: true
  excerpt:
  - 2023 年 2 月风向标航海教练（好像第八次做航海教练了）
- name: 多平台爆款验证
  desc: 作者用于证明其方法论有效性的核心背书，即同一套方法论能在微信公众号、小红书、快手、抖音四大主流内容平台均产出高流量内容（10万+至千万+量级）。
  is_original: true
  excerpt:
  - 公众号单条推文阅读过万，小红书多条笔记浏览量 10 万➕，快手多条视频百万➕，抖音多条视频千万➕
methods:
- name: __overview__
  desc: 素材整体采用‘实战背书引流 + 外部文档承载详情 + 社区工具辅助阅读’的教学交付方法：先在社区帖建立人设与成果信任，再通过语雀链接沉淀系统化教程，最后利用星球App原生功能解决跨平台阅读限制。
  excerpt:
  - 有过一点小成绩...公众号单条推文阅读过万...
  - 分享了一点关于风向标的心得
  - https://i.shengcaiyoushu.com/docx/ILFsdUrR1oUAVGxDpHCctq6AnPg
  - 你现在再在星球 App 里打开试试看，可以看到啦
theorems:
- name: 跨平台内容复用的普适性主张
  desc: 核心主张：掌握‘寻找风向标’的底层逻辑/方法论，可实现一套选题策略在图文（公众号、小红书）与短视频（快手、抖音）等不同形态、不同算法平台上的通杀，实现流量的规模化复制。
  excerpt:
  - 公众号单条推文阅读过万，小红书多条笔记浏览量 10 万➕，快手多条视频百万➕，抖音多条视频千万➕
  - 在这次航海上分享了一点关于风向标的心得
findings:
- name: 星球App链接兼容性发现
  desc: '[evidence] 评论区实测发现：生财星球内发布的语雀/外部文档链接，在星球App原生环境中可正常打开阅读，但在微信外部浏览器或直接点击可能受限（提示需在微信打开或跳转精华帖），需指导用户使用正确客户端入口。'
  excerpt:
  - 为什么我点了就跳转到生财网站精华帖了
  - 看不到。提示要到微信打开
  - 你现在再在星球 App 里打开试试看，可以看到啦
- name: 教练迭代经验积累
  desc: '[claim] 作者宣称已连续第八次担任航海教练，暗示其教学方法论经历过多轮实战迭代与学员反馈验证，具备成熟的教学交付体系。'
  excerpt:
  - 好像第八次做航海教练了，哈哈哈
