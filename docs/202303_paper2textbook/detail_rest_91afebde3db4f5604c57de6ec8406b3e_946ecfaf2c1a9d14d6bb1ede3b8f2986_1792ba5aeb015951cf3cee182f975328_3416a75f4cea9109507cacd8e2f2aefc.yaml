learning_targets:
- 理解百度竞价冷门项目的核心逻辑：用同行长期投放验证市场盈利性
- 掌握选品三要素与三步选品法，能独立完成需求端、供给端、流量端的三维产品验证
- 熟练应用低价/高价产品差异化测品模型，设定并执行止损线与扩量阈值
- 掌握账户基建‘减法’原则，能搭建手动控制预算/地域/时段/否词的精准投放账户结构
- 能设计高客单价私域落地页‘信任-恐慌-干货-实景-钩子’五段式转化结构
- 建立平台算法黑箱认知，明确可控参数与不可控边界，制定分层优化策略
- 内化投放决策优先级金字塔，按选品>落地页>策略>关键词的层级分配运营精力
- 掌握跨平台投放策略复用框架，实现百度/巨量/聚光账户结构同构与核心逻辑零迁移成本复用
- 重构试错成本认知，将试错成本视为获取确定性认知的杠杆工具而非门槛
- 能将投放思维外延至达人合作，执行‘低试错-可控-快放大’的KOL投放模型
concept_map:
- 百度竞价冷门蓝海项目实操体系
- ├── 核心验证定律
- │   ├── 同行长期投放=市场盈利铁律  —— P001
- │   ├── 选品三要素：利润覆盖广告/价格不透明/能打过同行  —— P002
- │   └── 投放层级决策优先级金字塔：选品>落地页>策略>关键词  —— P007
- ├── 选品标准化流程
- │   ├── 三渠道挖掘法：淘宝搜索/商家店铺/5118长尾词  —— P002
- │   ├── 三维验证模型：淘宝销量验需求/百度投放验盈利/关键词规划师验天花板  —— P002
- │   └── 干品止损机制：不达标果断砍掉  —— P002
- ├── 差异化测品模型
- │   ├── 低价产品：单品ROI/搜索词/刷量清洗，亏损300元止损  —— P003
- │   ├── 高价产品：加粉成本3倍预算测试，达标(转化15%/利润2000/加粉50)触发全维扩量  —— P003
- │   └── 免费搜索词策略：初期否词规避，后期放开测试边际收益  —— P003
- ├── 账户基建与投放执行
- │   ├── 减法原则：关闭所有自动扩流功能，手动控制预算/地域/时段/否词  —— P004
- │   ├── 分层搭建SOP：计划/单元/创意/关键词四层标准化命名与配置  —— P004
- │   ├── 地域时段溢价倍数叠加机制  —— P004
- │   └── 创意数量策略：≥4-5条让平台竞价选择降低CPC  —— P004
- ├── 私域转化承接
- │   └── 高客单落地页五段式：信任-恐慌-干货-实景-钩子  —— P005
- ├── 算法认知与决策边界
- │   ├── 平台算法黑箱：单一操作触发整体重分配，非线性因果  —— P006
- │   ├── 历史经验失效：算法迭代导致过往策略失效  —— P006
- │   └── 有限可控：仅控结构/预算/出价/否词/创意，接受流量分配为黑箱输出  —— P006
- ├── 跨平台复用框架
- │   ├── 账户结构同构映射：计划/单元/创意/关键词/定向一一对应  —— P008
- │   ├── 核心策略通用：建策略-投预算-赚钱续投/不赚钱调换/砍掉重来  —— P008
- │   └── 流量五大杠杆通则：地域/时段/词量/出价/限制  —— P008
- ├── 认知重构与外延应用
- │   ├── 试错成本即杠杆：可承受范围内无限买确定性(投放/认知/生活)  —— P009
- │   └── 达人投放外延模型：小/腰部达人低试错→风格筛选可控→同款铺货快放大  —— P010
life_analogy:
- 想象百度竞价投放像**在陌生城市开一家‘精准找客’的路边摊**：
- '- **同行长期投放** = 对面摊位天天排长队、干了三年没倒闭 → 证明这条街有真食客、这生意真能赚钱'
- '- **选品三要素** = 卖‘成本低、价格模糊、手艺强过对面’的菜（如秘制酱料、特色小吃），而非透明定价的矿泉水'
- '- **账户减法原则** = 开业前把‘自动推销机器人、强制捆绑套餐’全关了，自己守着收银台、选食客、定价格、拒赖皮顾客'
- '- **低价/高价测品** = 新菜上市：便宜小吃亏30元就撤（止损）；贵菜预算300元试卖，成本≤100元、利润≥200元、转化≥15%则全店推、多开分店（扩量）'
- '- **落地页五段式** = 顾客上前3秒：老板亮招牌/晒奖状(信任) → ‘再不吃这波食材就没了’(恐慌) → 现炒展示刀工(干货) → 墙上贴满好评/后厨透明(实景)
  → ‘扫码加群送张50元券，发1领券’(钩子)'
- '- **算法黑箱** = 城管/交警/天气/对面新开大酒楼 → 你无法控制路人流总量与结构，只能管好自家‘菜品/价格/服务/卫生/营业时间’'
- '- **优先级金字塔** = 想赚钱：先选对‘卖什么菜’(选品) > 再练好‘这道菜味道/出餐速度’(落地页) > 再定‘几点开门/雇几个服务员’(策略) >
  最后才纠结‘盘子买蓝的还是白的’(关键词/创意)'
- '- **试错成本重构** = 试新菜亏的钱，不是‘亏损’，而是买‘这菜这街卖不卖得动’的确定性情报；买得起情报、买得快、买得准，才能活下来开连锁'
summary:
- concept: 同行长期投放=市场盈利铁律
  desc: 竞品持续投放半年以上证明赛道盈利，自身不盈利归因于运营执行而非赛道伪命题
- concept: 选品三要素
  desc: 利润覆盖广告成本、价格相对不透明、落地页与销售能力能打过现有同行
- concept: 三步选品法
  desc: 选品(淘宝/店铺/5118) → 验品(销量/投放/搜索量) → 干品(止损砍掉)
- concept: 低价/高价差异化测品
  desc: 低价看ROI止损300元；高价看加粉成本3倍预算测试，达标触发全维扩量
- concept: 账户减法原则
  desc: 关闭智能匹配/ocpc/自动出价等扩流功能，手动控制预算地域时段否词
- concept: 地域时段溢价倍数叠加
  desc: 基础出价×地域倍数×时段倍数=实际最高出价，精准拿高质量流量
- concept: 创意数量策略
  desc: 单元≥4-5条创意让平台按人群匹配最优，质量度提升降低CPC
- concept: 高客单落地页五段式
  desc: 信任建立 → 恐慌造迫切 → 干货证专业 → 实景证源头 → 低阻力CTA
- concept: 平台算法黑箱认知
  desc: 单一操作触发整体重分配非线性因果，算法迭代致历史经验失效，仅控显性参数
- concept: 投放决策优先级金字塔
  desc: 选品(一票否决) > 落地页(杠杆) > 策略架构(骨架) > 关键词创意细节(皮毛)
- concept: 跨平台账户结构同构
  desc: 百度/巨量/聚光计划单元创意关键词一一对应，核心策略与流量杠杆通用
- concept: 试错成本即杠杆
  desc: 可承受范围内试错成本是获取确定性认知的购买成本，复利效应极强
- concept: 达人投放低试错模型
  desc: 小/腰部达人低成本试错 → 不同风格控制流量方向 → 筛选合适风格同款铺货放大
exercises:
- 'no': 1
  title: 三维产品验证实战演练
  contents:
  - 假设你想在百度投放‘家用小型制氧机’这一产品，请完成三维验证：
  - 1. 需求端验证：去淘宝搜索‘制氧机’，筛选销量前3的店铺，记录其月销量、评价数、核心卖点（如静音/便携/医用级），判断市场存量与用户痛点。
  - 2. 供给端验证：在百度搜索‘制氧机’，连续观察7天以上，记录长期出现在前3位推广位的竞品域名，确认是否有同行持续投放半年以上。
  - 3. 流量端验证：使用百度关键词规划师（或5118）查询‘家用制氧机’、‘制氧机哪个牌子好’、‘制氧机价格’等核心词及长尾词的周搜索量，计算总搜索量天花板。
  - 回答问题：
  - '- 若核心词周搜索量仅200次，长尾词合计800次，该产品是否值得投放？为什么？'
  - '- 若淘宝月销万单，但百度无同行长期投放，可能是什么原因？如何决策？'
- 'no': 2
  title: 账户基建与低价产品止损模拟
  contents:
  - 场景：你已开通百度推广账户，准备投放‘虚拟资料：公考面试真题解析’（客单价99元，纯利润约90元）。
  - 1. 账户搭建：按‘减法原则’列出需关闭的4项自动扩流功能，及需手动设置的4大控制杠杆（预算/地域/时段/否词）。
  - 2. 计划/单元命名：按‘产品-地域-时段’维度命名计划，按‘核心词/长尾词/竞品词’命名单元。
  - 3. 创意撰写：撰写3条不同卖点创意（如‘真题还原度高’/‘含答题技巧’/‘赠面试礼包’），配图建议。
  - 4. 止损执行：投放第3天，账户数据：消费280元，对话12个，加微信8个，成交1单(99元)，搜索词报告含‘免费/百度网盘/破解版’等非商业意图词。
  - '   - 计算当前ROI与单次加粉成本，是否触发300元止损线？'
  - '   - 列出需立即加入的计划/单元级否词清单。'
  - '   - 决策：继续优化/暂停/砍掉产品，说明理由。'
- 'no': 3
  title: 高价产品扩量决策与落地页诊断
  contents:
  - 场景：投放‘高端定制玉石挂件’（客单价5000元，利润2500元），预设加粉成本承受上限200元。测试投放3倍预算(600元)后，数据：消耗580元，加粉3个(成本193元/个)，咨询深度高，后端转化1单(5000元)。
  - 1. 判断是否触发扩量阈值（加粉成本≤承受1/3？转化率≥15%？单利润≥2000？），列出扩量具体动作（加词/放匹配/加价/上同类/多开户）。
  - 2. 该产品落地页现为通用电商详情页，请按‘信任-恐慌-干货-实景-钩子’五段式重构页面结构，标注每段核心素材来源（如：信任段放大师30年证书/非遗传承人身份）。
  - 3. 跨平台复用：若将该模型复用到巨量引擎，账户结构如何映射？核心策略‘建策略-投预算-赚钱续投/不赚钱调换/砍掉重来’在巨量上如何执行？流量五大杠杆（地域/时段/词量/出价/限制）如何配置以获精准流量？
- 'no': 4
  title: 算法黑箱应对与试错成本重构案例分析
  contents:
  - 案例：某运营者投放‘定制西服’，周一否掉一个疑似刷量词‘西服定制多少钱’，周二发现原本稳定出单的核心词‘高端西服定制’流量骤降80%，成交归零。运营者陷入‘删词导致流量崩’的归因陷阱，连夜加回该词、加预算、改出价，周三流量未恢复反而跑飞预算亏损2000元。
  - 1. 用‘平台算法黑箱认知’解释：为何单一否词操作触发整体流量重分配？为何‘加回/加价’无法挽回？
  - 2. 正确应对流程：当核心词流量异常波动时，应按周/月维度看整体ROI，而非单日单词；可控动作清单是什么？
  - 3. 试错成本重构：该运营者亏损2000元，若视为‘买确定性’，买到了什么确定性？如何将此次教训沉淀为SOP避免重复？
  - 4. 生活决策迁移：某创业者犹豫是否花3000元报名‘投放实战训练营’，担心‘学不会/骗钱’。用‘试错成本即杠杆’视角分析：可承受范围内，该笔支出的潜在复利收益与机会成本对比如何？
