paper: docs/202303/20230328_062.md
desc: 该素材为作者晓飞在2023年3月撰写的短剧推广实战复盘帖，详细记录了其联合学校影视专业学生、采用“自购硬件+学生兼职运营”模式批量运营300个抖音/快手账号进行短剧CPS推广的全过程。核心内容涵盖：前期投入成本结构（手机、卡、人力）、薪酬体系迭代历程（分成制→计件制→底薪+计件+分成）、规避平台风控与原创度难题的实操痛点、代理商模式避坑指南、以及平台分成政策对比（抖音星图vs快手直分）。最终数据显示：投入约10.2万，一个月流水77万，分成到手约60万，但作者强调属于高强度管理的“辛苦钱”，并揭示了批量化运营中人员流失率高、管理复杂度大的现实困境。
concepts:
- name: 短剧CPS推广矩阵化运营
  desc: 指通过大量账号（矩阵）批量分发短剧切片视频，引导用户充值观看全集，按分成比例获取收益的商业模式。素材中表现为自建300号矩阵，而非依赖招募外部代理。
  is_original: false
  excerpt:
  - 300 个号，目前抖音充值流水有 45 万，快手充值流水有 32 万，然后抖音 75%分成到手 33 万多，快手 90%分成 30 万多，也就是差不多干一个月赚
    60 万，300 号
  - 我跟我朋友一起合作的！... 300 个号就是我自己出钱搞手机，手机卡，然后跟在做的学生一起批量做号
- name: 产教融合式兼职模式
  desc: 利用高校影视后期专业学生低成本、高技能特征，将短剧剪辑发布作为实训兼职，形成‘校企合作’降维打击外包市场的用工结构。
  is_original: true
  excerpt:
  - 一开始是把影视后期专业的学生，都推广下，愿意来做就做，结果从 200 多人，最后剩下 60 多人，在到目前稳定 30 人
  - 感觉这种有产教结合的资源学校还是可以做的！毕竟你剪辑短剧可以练习剪辑技巧，软件操作技巧效率
  - 这个系统管理后台就是学生给做的，因为他们觉得好管理
- name: 三阶薪酬迭代体系
  desc: 针对兼职人员动力不足、管理失控、收益波动大等问题，经历‘纯分成→计件制→底薪+计件+超额分成’三阶段演进的薪酬设计，核心在于用底薪覆盖设备成本，用计件保底产出，用分成激励爆款。
  is_original: true
  excerpt:
  - 我们从一开始按分成---到按条---到底薪---底薪条数分成三个一起。为什么会这么折腾了，两点：管理问题和收益问题
  - 底薪 1 千，就是一开始他们提供的号，我这边不提供手机跟号... 剩下就是你剪辑一条视频我给 1 块钱... 你的视频播放量爆了，这就是精品视频，按照 3
    块钱一条计算！如果有充值给 5-10%
- name: 短剧原创度洗稿难题
  desc: 指短剧切片二创过程中，因素材同质化严重，AI自动剪辑工具无法通过平台原创检测，导致搬运限流、封号，人工二创成本高、效率低、爆款概率不可控的核心技术瓶颈。
  is_original: false
  excerpt:
  - 很难洗原创，那种 ai 自动剪辑软件搞这个视频很难。爆款模板抄袭搬运根本就是运气成分。
  - 直接搬运的，抖音快手限流，封号，有点废号
- name: 代理商模式信息差收割
  desc: 揭示短剧招商代理模式中，服务商掌握后台数据与结算权，通过‘充值流水不透明’、‘零成本拉新收割’、‘头部代理带动裂变’三大机制收割下级代理利润的灰产逻辑。
  is_original: true
  excerpt:
  - 充值流水跟分成有信息差，对于代理来讲
  - 代理赚不赚钱，反正他不亏钱，可以一直拉新人，补充新鲜血液。
  - 一个代理赚钱，他就可以赚更多钱！他也没有其他成本，最多社群发点资料，偶尔管理，开直播讲解下！
methods:
- name: __overview__
  desc: 自建账号矩阵+校内兼职团队+自研管理后台的全链路自运营闭环。核心步骤：1.低成本采购二手硬件(手机/卡)建立物理基建；2.校内招募专业匹配度高的学生团队，经历自然淘汰形成稳定编制；3.迭代薪酬体系对齐激励与管理；4.人工二创规避风控，批量发布投放；5.自研后台实现多账号数据聚合与人效管理。
  excerpt:
  - 二手手机：华为 mate20 6+64 450 元*60 个... 手机卡：300 张卡... 这一下子就花了 102000 元
  - 从 200 多人，最后剩下 60 多人，在到目前稳定 30 人
  - 底薪条数分成三个一起
  - 这个系统管理后台就是学生给做的，因为他们觉得好管理
  - 抖音快手在三月就把短剧开放到全部达人... 新号都可以接到这种任务了
- name: 平台分成策略对标法
  desc: 通过对比抖音(星图/非星图)、快手(直分/服务商)不同入口、不同剧方(九州/容量等)的分成比例与结算规则，选择ROI最高的渠道组合。素材中最终采用抖音星图高分成(60%-80%)与快手直分(70%/60%)并行策略。
  excerpt:
  - 抖音上是九州的 26%，如果是星图去看是 60%-80%... 快手直接分成 70%，没有任何服务费 九州的剧是 60%，快手直接分成
- name: 学生兼职动态筛选机制
  desc: 利用‘大漏斗入口(专业班全员推广)→高强度试错(实操筛选)→薪酬结构锁定(底薪+绩效)→技能沉淀复用(开发管理工具)’的四步法，以极低成本筛选出高执行力、可复用的核心运营团队。
  excerpt:
  - 一开始是把影视后期专业的学生，都推广下，愿意来做就做，结果从 200 多人，最后剩下 60 多人，在到目前稳定 30 人
  - 底薪 1 千... 剩下就是你剪辑一条视频我给 1 块钱... 爆了... 3 块钱一条... 充值给 5-10%
  - 这个系统管理后台就是学生给做的
theorems:
- name: 短剧矩阵运营‘重运营轻技术’定律
  desc: 短剧CPS推广的核心壁垒不在于剪辑技术(门槛低、可外包/校内解决)，而在于账号矩阵的物理基建成本控制、人员管理体系设计、平台风控规则博弈及分成渠道信息差获取能力。技术工具(AI剪辑)反而因原创度检测失效。
  excerpt:
  - 主要原因就是：短剧前期收益不稳定，运气成分太高，而且很容易劝退。
  - 很难洗原创，那种 ai 自动剪辑软件搞这个视频很难。
  - 管理问题和收益问题，这个就不写了！很复杂！
  - 这个赚的也是辛苦钱... 很累，没有我做影视工作室这活好！
- name: 代理商模式‘零边际成本收割’原理
  desc: 服务商因掌握数据与结算权，边际成本趋近于零，通过‘信息差定价’与‘无限拉新’模式，将风险全部转嫁给代理，自身稳赚不赔。代理层越深，信息损耗越大，底层代理必亏。
  excerpt:
  - 你看别人招代理，只要代理赚钱了，他就赚钱，分成很低，而且数据他自己掌控，给你他自己的后台展示！这里面可操作空间就很大！
  - 充值流水跟分成有信息差... 代理赚不赚钱，反正他不亏钱，可以一直拉新人... 一个代理赚钱，他就可以赚更多钱！他也没有其他成本
- name: 高校产教融合‘降维打击’商业逻辑
  desc: 将商业项目嵌入专业教学实训，利用学生‘时间成本低、技能匹配度高、抗风险能力强、工具开发能力强’的特征，可将外包成本压缩至市场价1/10以内，并解决管理工具定制化需求。
  excerpt:
  - 他们自己在 b 站，闲鱼这些上面接个剪辑视频... 一条都 10 块钱起步... 底薪 1 千... 剩下就是你剪辑一条视频我给 1 块钱
  - 这个系统管理后台就是学生给做的，因为他们觉得好管理！
  - 感觉这种有产教结合的资源学校还是可以做的！毕竟你剪辑短剧可以练习剪辑技巧
findings:
- name: 单月矩阵运营财务模型验证
  desc: '[evidence] 实测数据：总投入10.2万(手机2.7万+人力底薪3万+话费4.5万)，300号矩阵运营39天，抖音流水45万(分成75%→33.75万)，快手流水32万(分成90%→28.8万)，分成到手约62.55万，毛利约52.35万，单号月均产出约1745元。但隐性成本(管理精力、号损耗、结算周期5-10号)极高，作者定性为‘辛苦钱’。'
  excerpt:
  - 前期支出费用... 这一下子就花了 102000 元
  - 目前抖音充值流水有 45 万，快手充值流水有 32 万，然后抖音 75%分成到手 33 万多，快手 90%分成 30 万多，也就是差不多干一个月赚 60 万
  - 这个是 5-10 号结算。其实学生动手能力还是很厉害的！... 中途还浪费了很多号
- name: 人员自然淘汰率与稳定编制规律
  desc: '[evidence] 影视后期专业学生从200+意向报名→60+实际入职→30人稳定编制，淘汰率超85%。核心原因：收益预期落差(市场价10元/条
    vs 内部1元/条)、工作强度超预期(日更压力)、收益波动大(依赖爆款概率)。验证了‘低门槛任务高管理成本’的悖论。'
  excerpt:
  - 一开始是把影视后期专业的学生，都推广下，愿意来做就做，结果从 200 多人，最后剩下 60 多人，在到目前稳定 30 人
  - 他们自己在 b 站，闲鱼这些上面接个剪辑视频... 一条都 10 块钱起步，没得法，然后就重新来商量
- name: AI剪辑工具在短剧二创中的失效实证
  desc: '[evidence] 实测‘AI自动剪辑软件’无法通过抖音/快手原创度检测，导致限流封号；‘爆款模板抄袭’纯属运气，不可复制。迫使团队回归人工二创，大幅推高单条产出成本与管理难度。'
  excerpt:
  - 很难洗原创，那种 ai 自动剪辑软件搞这个视频很难。爆款模板抄袭搬运根本就是运气成分。
  - 直接搬运的，抖音快手限流，封号，有点废号
- name: 平台开放政策红利期窗口期验证
  desc: '[evidence] 2023年3月抖音/快手向全量达人开放短剧CPS权限(新号即可接任务)，且星图/直分高分成通道(抖音60%-80%、快手60%-70%)无服务费，确认了‘去中介化、自建号直连’的可行性窗口期。'
  excerpt:
  - 抖音快手在三月就把短剧开放到全部达人，就是你注册新号也能接到短剧 cps 推广
  - 抖音上是九州的 26%，如果是星图去看是 60%-80%... 快手直接分成 70%，没有任何服务费
- name: 自研管理后台对规模化运营的必要性
  desc: '[evidence] 300号规模下，人工管理失效，学生主动开发管理后台解决‘视频分发、数据聚合、薪资核算’问题，证明矩阵运营规模超过临界点(约50-100号)后，必须配套数字化管理工具，否则管理成本指数级上升。'
  excerpt:
  - 这个系统管理后台就是学生给做的，因为他们觉得好管理！
  - 管理问题和收益问题，这个就不写了！很复杂！
