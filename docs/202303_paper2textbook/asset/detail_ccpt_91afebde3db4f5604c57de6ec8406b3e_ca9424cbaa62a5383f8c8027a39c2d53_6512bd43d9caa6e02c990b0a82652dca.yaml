units:
- 'no': 1
  name: ChatGPT账号注册 —— 打通使用大模型的“第一公里”
  points:
  - '**为什么需要这个概念？**'
  - '- 国内用户无法直接访问OpenAI官网，网络环境是硬性门槛'
  - '- 注册需要海外手机号接码，国内/港澳号码及虚拟号均不支持'
  - '- 缺乏图文级避坑指南，用户易在节点、接码、支付三环节卡住'
  - '**核心定义**'
  - '- 指国内用户通过搭建海外网络环境、获取海外手机号、完成邮箱验证，自助注册ChatGPT账号的标准化操作流程'
  - '- 包含网络环境准备、账号注册验证、避坑指南三大模块'
  - '**关键性质**'
  - '- 非技术门槛：无需编程基础，普通用户按图操作即可完成'
  - '- 环境强依赖：节点IP纯净度(未被标记)直接决定注册成功率与账号存活周期'
  - '- 号码一次性：接码平台号码复用率高易失败，需筛选运营久、口碑好的服务商'
  - '**典型例子**'
  - '- 作者实测：选运营时间久的节点服务商，配合一次性实体卡接码，单次通过率显著提升'
  - '- 评论区用户反馈：按教程操作“马上用起来”，解决了“梯子怎么解决”的核心痛点'
  - '**边界条件**'
  - '- 飞书/语雀等国内平台对含“翻墙/注册”关键词教程限流，需通过附件/私密分享'
  - '- Stripe支付风控极严，注册成功≠能开通Plus，支付环节需单独解决(虚拟信用卡/礼品卡/代充)'
  - '- 账号共享/频繁切换节点易触发封禁，注册后需遵守“一人一号一IP”养号原则'
  - '**素材溯源**'
  - '- docs/202303/20230328_125.md (origin): 提供注册全流程SOP、节点选择原则、避坑清单、用户需求验证'
  - '- docs/202303/20230328_126.md (improve): 提供私有API中转方案，解决注册后“用不好/不稳定”的生产环境问题'
  sources:
  - paper: docs/202303/20230328_125.md
    role: origin
  - paper: docs/202303/20230328_126.md
    role: improve
  excerpts:
  - 一步一图，详细写了一下注册和充值的过程，争取一文就能让你自己搞定账号和会员
  - 选一个运营时间久一点的就行
  - 顺便，我加了一些自己在使用中踩过的坑，虽然学费交的不多，但能帮大家少交一点是一点
  - 访问的人太多了，触发飞书审核，被禁止分享了，没办法，附件附上吧
  - 直到 3 月 1 日，官方公布 Openai 开放接口...在社群里看到一位朋友发的链接，不用翻墙，就能使用...联系到开发朋友，也就有了属于我自己的 ChatGPT
    链接
- 'no': 2
  name: ChatGPT Plus订阅 —— 解锁GPT-4的“支付突围战”
  points:
  - '**为什么需要这个概念？**'
  - '- Plus会员提供GPT-4模型、优先访问、更快响应，是生产力跃迁的关键'
  - '- 国内无国际信用卡，Stripe风控拦截非原生IP、账单地址不匹配等支付壁垒极高'
  - '- 淘宝代充/共享账号风险大(封号/隐私泄露/不稳定)，自助开通是长期稳妥之计'
  - '**核心定义**'
  - '- 指国内用户通过虚拟信用卡(Depay/NobePay等)、美区Apple ID礼品卡、或可靠代充渠道，解决Stripe支付验证，自助开通ChatGPT
    Plus订阅的完整路径'
  - '**关键性质**'
  - '- IP与账单地址必须一致：代理IP归属地需与虚拟卡账单地址匹配(如均为美国同州)'
  - '- 原生住宅IP优先：数据中心IP极大概率触发Stripe拒付，需使用原生住宅代理'
  - '- 虚拟卡开卡费+月费成本约$20/月+手续费，边际成本可控'
  - '**典型例子**'
  - '- 作者实测：Depay虚拟卡 + 美国原生住宅IP节点 + 账单地址填写卡对应地址，成功开通Plus'
  - '- 评论区用户：此前淘宝买号/共享号频繁掉线，自助开通后稳定可控'
  - '**边界条件**'
  - '- OpenAI/Stripe风控规则动态收紧，今日可用方案明日可能失效，需持续关注社群最新实测反馈'
  - '- 虚拟信用卡平台自身有跑路/冻结风险，建议小额充值、按月付费、不囤大额余额'
  - '- 官方政策变更(如取消Plus/调整价格/新增支付方式)会瞬间失效现有教程'
  - '**素材溯源**'
  - '- docs/202303/20230328_125.md (origin): 定义Plus价值、支付壁垒、避坑核心(IP/地址/卡)、用户刚需反馈'
  - '- docs/202303/20230328_126.md (improve): 提供私有API中转方案作为Plan B，绕过官方Plus订阅直接调用GPT-4
    API'
  sources:
  - paper: docs/202303/20230328_125.md
    role: origin
  - paper: docs/202303/20230328_126.md
    role: improve
  excerpts:
  - 《ChatGPT 和 Plus 会员的注册和充值，超详细教程以及避坑指南》
  - 想体验下 Plus 会员的
  - 顺便，我加了一些自己在使用中踩过的坑
  - 会者不难，我不懂技术，找朋友解决，每个月半个人工的费用，包维护，很合适
- 'no': 3
  name: Midjourney零基础入门 —— 用Discord当画笔，1分钟出图
  points:
  - '**为什么需要这个概念？**'
  - '- MJ无独立网页端，必须通过Discord交互，新用户对“频道/指令/按钮”陌生，上手有认知门槛'
  - '- 新手频道消息刷新极快，生成结果极易淹没，找不到图是典型劝退点'
  - '- 网上教程碎片化、版本旧(未覆盖U/V按钮、/imagine交互细节)，缺乏标准化SOP'
  - '**核心定义**'
  - '- 指用户完成Discord注册授权、加入MJ服务器、定位新手频道、输入/imagine指令与英文提示词、使用U/V按钮优化、定位保存大图的标准化首次使用全流程'
  - '**关键性质**'
  - '- 零参数门槛：不加修饰词也能随机生成高质量图片，极大降低心理负担'
  - '- 公开观摩学习：新手频道可见他人提示词与生成结果，是零成本最佳词汇积累场'
  - '- 跨平台同步：电脑端/手机端Discord客户端数据互通，随时随地可用'
  - '- 交互原子单元：/imagine(生成) + U1-U4(放大细化) + V1-V4(变化重绘) 构成核心操作闭环'
  - '**典型例子**'
  - '- 素材实测案例：新账号“灰栗子”输入“A rustic little house, Miyazaki style”，1分钟生成4张缩略图，点U3输出高清大图，全流程打通'
  - '- 定位技巧：点击右侧“提及列表”用户名，一键跳转至自己生成位置，解决消息淹没痛点'
  - '**边界条件**'
  - '- 免费试用额度有限(约25张)，后续需订阅付费($10/月基础套餐)'
  - '- 必须用英文提示词，中文输入效果不可控，非英语用户有语言门槛'
  - '- Discord在国内需代理访问，网络环境是前置硬性依赖'
  - '- 生成图片版权归用户(付费会员)，但MJ保留推广使用权，商用需遵守服务条款'
  - '**素材溯源**'
  - '- docs/202303/ATzUdYFxCo8QtbxMAIaceDJmnQc.md (origin): 提供全流程SOP、核心概念定义、交互细节、实测验证案例、定位技巧'
  sources:
  - paper: docs/202303/ATzUdYFxCo8QtbxMAIaceDJmnQc.md
    role: origin
  excerpts:
  - Midjourney 是一个前端通过discord聊天软件进行外显交互的AI绘图网站，因此在使用的过程中，会需要一个discord的账号
  - 找到 “ newbies - XX ” 频道，点击进入（每个人的数字不一样）
  - 在这里，你就可以看到别人出的图片以及别人出的描述词
  - 在聊天框打一个 “ / ” 字符，选择出现的 /imagine ... 输入描述词 ... 按回车
  - 按钮U：在对应图片的基础上细化，出一张大图 ... 比如我们觉得第三张图更像我们想要的，点一下 U3 按钮 即可
  - 按钮V：在对应图片的基础上再变化出4张新图
  - 加载到100%时，会在最新的聊天记录里出现，需要你回去找（找不到就上下翻找）
  - 实在找不到，就在搜索栏搜索 ... 点你的名字 ... 在右边提及你的部分，点击文字部分，左边就会跳转至你出图的界面
  - 真正的1分钟出图，在不加任何修饰语的情况下，也会随机生成非常好看的图片
- 'no': 4
  name: API私有化中转 —— 让大模型像本地工具一样稳定好用
  points:
  - '**为什么需要这个概念？**'
  - '- 官网直连需翻墙、频繁掉线、限流严重，无法支撑商业化生产环境稳定性要求'
  - '- 淘宝买号/海外代注册/共享Key普遍不稳定、不售后、隐私风险高、且无法批量管理'
  - '- 企业/团队需统一计费、权限隔离、日志审计、模型路由等官方平台不提供的管理能力'
  - '**核心定义**'
  - '- 指通过自建或社群对接的代理服务器，转发OpenAI API请求，实现无需翻墙、高并发、负载均衡、密钥管理、模型路由(自动切换GPT-3.5/GPT-4)的私有化接入方案'
  - '**关键性质**'
  - '- 非官方托管：数据经第三方中转，需信任服务商或自建，敏感数据建议脱敏或走自建方案'
  - '- 成本结构：通常按Token量计费(溢价10%-30%)或包月制(如半人力成本/月含维护)，边际成本随量增降低'
  - '- 兼容性：完全兼容OpenAI SDK格式，仅需修改Base URL和Key即可无缝迁移现有代码/应用'
  - '- 扩展性：可集成限流熔断、敏感词过滤、成本预警、多模型降级策略等工程化治理能力'
  - '**典型例子**'
  - '- 作者实战：自注册/淘宝/海外代注册均失败 -> 社群对接开发者搭建私有中转 -> 月成本约半人力、包维护、稳定支撑公众号矩阵日产5篇10W+生产'
  - '- 方案对比：自建(技术门槛高/运维累) vs 社群共享中转(性价比高/依赖信任) vs 企业级网关(功能全/成本高)'
  - '**边界条件**'
  - '- 违反OpenAI TOS风险：中转服务本身处灰色地带，官方可能封禁代理IP池，导致服务中断'
  - '- 数据合规红线：涉及用户隐私/商业机密数据严禁走第三方中转，必须自建或走Azure OpenAI/官方企业版'
  - '- 模型版本滞后：中转层可能不及时支持最新模型(如GPT-4o发布初期)，需确认服务商更新SLA'
  - '**素材溯源**'
  - '- docs/202303/20230328_126.md (origin): 详细记录自建/买号/代注册/社群中转四种方案对比、私有中转搭建实录、成本效益分析'
  - '- docs/202303/20230328_043.md (improve): 提供Fine-Tuning微调技术路线，私有中转可进一步支持微调模型部署与推理'
  sources:
  - paper: docs/202303/20230328_126.md
    role: origin
  - paper: docs/202303/20230328_043.md
    role: improve
  excerpts:
  - 自己注册了 1 个，废掉；某宝买了 1 个...不好用；让国外的朋友注册 2 个...效果不佳...
  - 直到 3 月 1 日，官方公布 Openai 开放接口...在社群里看到一位朋友发的链接，不用翻墙，就能使用...联系到开发朋友，也就有了属于我自己的 ChatGPT
    链接。
  - 会者不难，我不懂技术，找朋友解决，每个月半个人工的费用，包维护，很合适
  - 简单使用 GPT API Key 进行 Fine tunes 训练
  - 掌握 OpenAI API 的使用方法等
