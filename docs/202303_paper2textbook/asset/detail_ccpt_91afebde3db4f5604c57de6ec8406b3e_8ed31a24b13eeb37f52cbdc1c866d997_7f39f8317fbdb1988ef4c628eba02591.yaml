units:
- 'no': 1
  name: 黄金消费与投资二元论 —— 别把“戴在身上”当成“放在账上”
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数普通人混淆“买首饰”与“买黄金”，以为买了金镯子就是投资，其实前者是消费，后者才是资产配置'
  - '- 搞不清目的会导致：消费时按投资标准苛责工艺费，投资时按消费心态买一口价、忽视流动性成本'
  - '- 只有分清两个赛道，才能在正确的规则里做正确的决策，避免“消费型投资”或“投资型消费”的双重亏损'
  - '**核心定义**'
  - '- 黄金消费：购买首饰/工艺品，核心满足审美/装饰/社交需求，价格=国际金价×克重+品牌溢价+高额工艺费+渠道成本，回收折损大，流动性差'
  - '- 黄金投资：购买金条/金豆/纸黄金(ETF/基金)，核心追求保值增值/避险配置，价格紧贴国际金价，成本透明(仅点差/手续费/管理费)，流动性强，支持灵活加减仓'
  - '**关键性质**'
  - '- 定价逻辑正交：消费端定价权在商家(品牌/设计/渠道)，投资端定价权在市场(国际金价/供需)'
  - '- 成本结构对立：消费端溢价高且不可逆(工艺费沉没)，投资端成本低且可控(手续费万0.5%、无保管费)'
  - '- 流动性天壤之别：消费端变现需找回收商、验火折损、价格打骨折；投资端T+0/T+1秒级到账、价格公开透明'
  - '**典型例子**'
  - '- 消费陷阱：花 5500 元买某福 5g 生肖挂件(AU999)，单克 1100 元，实则国际金价仅 400 元/克，溢价 175%，回收仅按 400
    元/克，亏损 60%+'
  - '- 投资正解：同等资金买黄金 ETF(518880)，手续费 0.1 元/笔，无保管费，随时可卖，2021 年 3 月低点加仓，2023 年突破新高已获正收益'
  - '**边界条件**'
  - '- 极少数古董级/大师级/限量版首饰具备艺术品属性，可能跑赢金价，但需专业鉴定能力，非普通人可为'
  - '- 婚嫁/送礼等刚性社交场景下，首饰消费不可避免，此时应承认消费属性，按“喜欢度/预算”决策，而非“投资回报”'
  sources:
  - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    role: origin
  excerpts:
  - 你是怕黄金一再涨价，想去买一个黄金手链，黄金首饰，作为装饰品... 还是说，你目前看好黄金的价值，想买“黄金”作为投资产品。这完全是两个概念，大家一定要分清楚。
  - 不要去某某生，某某福买了条黄金项链，黄金手镯就觉得自己在投资，那肯定不是这样子的。
  - 黄金的价值，其实跟品牌是完全没有关系的... 只跟它的纯度有关
- 'no': 2
  name: 黄金价值锚定纯度论 —— 只认成色，不认Logo
  points:
  - '**为什么需要这个概念？**'
  - '- 商家利用品牌光环将“纯度相同”的黄金卖出天价，普通人误以为大牌黄金更纯、更保值'
  - '- 导致同等克重下多付 30%-100% 品牌溢价，回收时却按同一国际金价结算，隐形亏损巨大'
  - '- 建立“纯度=价值”锚点，能让购买决策回归理性比价，省下冤枉钱'
  - '**核心定义**'
  - '- 黄金内在价值 = 纯度(含金量) × 重量，与品牌、工艺、渠道无关'
  - '- 国标分级：AU9999(万足金, 99.99%) > AU9995 > AU999(千足金, 99.9%, 主流流通规格) > AU995'
  - '- 含金量 ≥ 99.6% 统称 24K 金；18K 金含金量 75%，非纯金投资标的'
  - '**关键性质**'
  - '- 标准化大宗商品属性：同等纯度黄金在物理化学性质上完全同质，无差异化护城河'
  - '- 品牌溢价仅覆盖设计/服务/营销/渠道成本，不计入黄金金属价值，变现时无法收回'
  - '- 识别唯一硬指标：钢印/标签上的“AU999”“AU9999”“足金 999”等国标标识'
  - '**典型例子**'
  - '- 同为 AU999 足金手镯：周大福标价 500 元/克(含工艺费)，普通金店 430 元/克，回收商统一按国际金价 410 元/克收，前者买入即亏 90
    元/克，后者仅亏 20 元/克'
  - '- 投资金条：四大行/正规金店售出的“中国黄金/银行品牌”金条，均为 AU999/9999，单克价格紧贴上海金交所实时金价 + 少量手续费(约 10-16
    元/克)，无品牌溢价'
  - '**边界条件**'
  - '- K 金(如 18K/22K)含金量<99.6%，镶嵌钻石/工艺复杂，定价完全脱离金价，属首饰消费范畴，不可作投资标的'
  - '- 非正规渠道(无钢印/标签模糊/私人回收)存在掺杂/偷克重风险，纯度无法验证时“纯度论”失效，必须走正规渠道'
  sources:
  - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    role: origin
  excerpts:
  - 黄金的价值，其实跟品牌是完全没有关系的，不是说大品牌的黄金，就一定是好的，小品牌的黄金就不好。
  - 黄金的质量高不高只跟它的纯度有关... 目前我国标准的黄金成色分为：AU9999、AU9995、AU999、AU995这几种。
  - AU999也就是我们经常说的千足金，含金量是在99.9%，是市面上最多见流通最广泛的黄金。
- 'no': 3
  name: 单克价格比价法 —— 用除法穿透所有营销迷雾
  points:
  - '**为什么需要这个概念？**'
  - '- 商家报“总价/一口价/克价+工费”多维混淆定价，让普通人无法横向比较'
  - '- “一口价”不标克重、“固定工费”掩盖高单克成本、“赠送工费”实则抬高金价，陷阱层层叠叠'
  - '- 统一换算成“单克总成本(含工费)”，是唯一能穿透所有营销话术、还原真实价值的标准尺子'
  - '**核心定义**'
  - '- 单克价格 = 实付总金额 ÷ 实际黄金克重(含工费/手续费/运费等所有成本)'
  - '- 仅在同等纯度规格(如均为 AU999)下具有横向可比性'
  - '**关键性质**'
  - '- 去伪存真：自动剔除品牌溢价、营销话术、包装成本，直击黄金金属本价值'
  - '- 适用全场景：首饰选购、金条投资、旧金置换、回收变现，统一比价基准'
  - '- 决策阈值：投资端单克成本 - 国际金价 ≤ 16 元/克(正规渠道合理溢价)；消费端单克成本 - 国际金价 ≤ 50 元/克(可接受工艺溢价)'
  - '**典型例子**'
  - '- 陷阱破解：A 店“古法金手镯 一口价 8888 元”，B 店“足金手镯 450 元/克 + 80 元/克工费 共 20 克”。算单克：A 店实称 15
    克 → 592 元/克；B 店 530 元/克。国际金价 410 元/克，B 店溢价 120 元/克更划算'
  - '- 置换避坑：旧金换新扣除 30% 损耗费+20%工费，算单克发现新金单克成本比直接买新金还高，不如卖旧买新'
  - '**边界条件**'
  - '- 克重极小(如 1-2 克)首饰，工费占比极高(单克成本可达金价 2-3 倍)，单克比价法仍有效但决策逻辑应转为“买喜欢/买设计”而非“比成本”'
  - '- 古法/硬金/5G/5D 等新工艺首饰，工艺费合理性无外部基准，单克比价只能判断“贵不贵”，难判断“值不值”'
  sources:
  - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    role: origin
  excerpts:
  - 因此在同等规格下，换算出1g黄金多少钱，才是具有对比价值的。
  - 同样的一个生肖挂件都是AU999，一家店卖3000元，一家店卖5500元... 前者只有5g，后者却有10g呢。是不是明显后面一家店的黄金更划算？
  - 黄金的溢价主要集中在工艺成本上，也就是我们常说的为设计买单。
- 'no': 4
  name: 纸黄金优于实物黄金的普通人投资适配性定理 —— 让黄金像股票一样灵活
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人买实物金条面临“一次性买入、被套无法补仓、年付 300 元保管费、变现跑银行排队验火”四重痛点'
  - '- 纸黄金(黄金 ETF/基金)完美解决上述痛点，却因“非实物/看不见摸不着”心理障碍被长期忽视'
  - '- 确立纸黄金“更适合普通人”的地位，能帮助大多数人用更低成本、更灵活方式配置黄金资产'
  - '**核心定义**'
  - '- 纸黄金：非实物黄金投资，通过证券账户/银行 APP 买卖黄金 ETF(如 518880)、黄金基金、账户黄金'
  - '- 核心优势三角：零保管费 + 极低手续费(万 0.5%-万 1%，最低 0.1 元) + T+0/T+1 高流动性 + 支持分批加减仓'
  - '**关键性质**'
  - '- 成本优势量化：实物年持有成本 = 300 元保管费 + 买卖点差 10-16 元/克；纸黄金年持有成本 = 0 保管费 + 手续费约 0.5-1 元/万元'
  - '- 操作灵活性：实物“一次性建仓、被套干瞪眼”；纸黄金“分批建仓、低点加仓、高点减仓、网格交易”样样行'
  - '- 价格趋同性：纸黄金净值/价格与实物黄金、国际金价长期高度正相关(相关系数 > 0.99)，不跟踪误差'
  - '**典型例子**'
  - '- 2020 年 8 月高点(约 400 元/克)买入：实物金条持有至 2023 年 3 月回本，中间 2.5 年零收益、还倒贴 900 元保管费；纸黄金
    ETF 在 2021 年 3 月低点(约 340 元/克)加仓摊低成本，2023 年突破新高已获 15%+ 正收益'
  - '- 小额定投：月薪 1 万，每月拿 2000 元定投黄金 ETF，单笔手续费 0.1 元，10 年累计投入 24 万，享受复利与波段收益，实物金条根本买不起/存不下'
  - '**边界条件**'
  - '- 极端灾难场景(战争/金融体系崩溃/账户冻结)下，纸黄金面临对手方风险/系统性风险，实物黄金在手才是终极避险，但此类概率极低'
  - '- 券商/银行渠道差异大：部分银行“账户黄金”点差高达 0.8-1.5 元/克、不支持 T+0，需甄别低成本渠道(券商 ETF/优质基金)'
  - '- 老年/非数字化人群操作证券账户有门槛，实物金条/银行柜台账户黄金可能是唯一可及渠道'
  sources:
  - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    role: origin
  excerpts:
  - 纸黄金投资，也可以理解为“非实物性黄金投资”... 可以直接在网上下载银行app操作，也可以开个人证券账户购买黄金衍生品。
  - 手续费也会更低，以黄金etf... 为例... 通常手续费为万分之1%，我这边券商合作渠道可拿到最低手续费仅万分之0.5%（每次最低交易手续费仅0.1元）
  - 纸黄金并不存在保管费用... 在最低的位置，我们可以做1-2次加仓的操作，中途也可以根据上涨幅度做减仓
  - 从2020年8月开始，黄金etf开始下跌... 假如我们是在2020年7月到8月买了实物黄金... 如果我们是买的纸黄金的话... 经过低点的加仓操作后，会拥有更多的盈利。
- 'no': 5
  name: 黄金长期避险增值属性 —— 资产配置的“定海神针”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人配置资产要么全仓股票/基金(波动大、回撤痛)、要么全存银行(跑不赢通胀)，缺乏“防守型资产”'
  - '- 黄金作为唯一“非信用货币/硬通货”，在黑天鹅/通胀/货币贬值时逆势上涨，是组合的天然稳定器'
  - '- 认清其长期正收益+负相关特性，才敢在平时“闲钱买黄金”、危机时“黄金救命”'
  - '**核心定义**'
  - '- 黄金长期增值：2016-2023 年 7 年价格近乎翻倍(涨幅 ~100%)，年化收益 ~10.4%，显著跑赢同期银行理财(2-4%)'
  - '- 避险属性：地缘冲突/金融危机/美元贬值/通胀飙升时，黄金往往反向上涨，与股债呈负/低相关'
  - '- 配置建议：家庭金融资产 5%-15% 配置黄金(纸黄金为主)，作为“保底仓/防守仓”，平时不动、危机时用'
  - '**关键性质**'
  - '- 硬通货属性：全球通用、无违约风险、不可超发、历经数千年保值，是终极信用锚点'
  - '- 无息资产机会成本：持有黄金放弃利息/股息收益，机会成本 = 无风险利率，利率高时黄金承压、利率低时黄金受益'
  - '- 波动率中等：年化波动 15%-20%，低于股票(30%+)、高于债券(5%)，适合作为组合稳定器而非进攻矛'
  - '**典型例子**'
  - '- 2020 年 3 月疫情冲击：股市暴跌 30%+，黄金先跌后涨，一个月收复失地并创新高，对冲了组合回撤'
  - '- 2022 年俄乌冲突+美联储加息：股债双杀，黄金以人民币计价全年正收益，成为少数“绿色”资产'
  - '- 家庭实操：某圈友 2018 年起每月定投黄金 ETF 1000 元，至 2023 年累计投入 6 万，市值 9 万+，年化 12%+，全程无焦虑、无操作、睡后收入'
  - '**边界条件**'
  - '- 黄金不产生现金流，长期横盘/下跌周期(如 2011-2015 年)可能长达 3-5 年，需极强持有耐心，不适合短期投机'
  - '- 高通胀+高利率并存(如 1980 年)时，黄金实际收益可能为负，不能迷信“通胀利好黄金”单因子'
  - '- 分配比例过高(>20%)会拖累组合长期收益，因黄金长期年化(10%+)低于权益资产(12-15%)，只能作配角'
  sources:
  - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    role: origin
  excerpts:
  - 黄金自2016年以来，到今年2023年，7年时间价格上几乎翻了一倍，比起普通的银行理财，还是非常有吸引力的。
  - 从大的投资角度来讲... 黄金作为避险性投资，仍旧具有一定价值
  - 从短期三个月到一年来看的话，黄金的价格仍然有一定上涨空间... 一旦发生国际的一些纷争，或者美元贬值的话... 黄金的价格提升空间会扩大。
- 'no': 6
  name: 黄金首饰选购三步法 & 纸黄金波段操作法 —— 从“被宰”到“自主决策”的实操 SOP
  points:
  - '**为什么需要这个概念？**'
  - '- 知道道理不等于会操作，普通人进金店/开 APP 仍会被导购/界面带节奏，需要标准化动作清单'
  - '- 首饰买贵了心疼、买假了糟心、置换亏了不甘心；纸黄金不会操作、怕被套、不知何时买卖，痛点全在“执行层”'
  - '- 将专家隐性经验显性化为“三步法/波段法”，让小白也能像老手一样完成高质量决策'
  - '**核心定义**'
  - '- 黄金首饰选购三步法：① 认准纯度标识(找 AU999/AU9999 国标钢印，无印不买) → ② 算单克价(总价÷克重，横向比价，剔除溢价) → ③
    按克重决策(轻克重<10g 买喜欢设计、重克重>20g 死磕单克成本)'
  - '- 纸黄金波段加减仓操作法：① 选低成本渠道(券商买 518880/优质黄金基金，手续费万 0.5%) → ② 定基准仓位(资产 5%-10% 作为底仓长期持有)
    → ③ 设波段区间(结合宏观/技术，如 2021 年 3 月低点加仓、2023 年高点减仓) → ④ 执行纪律(分批/定量/止盈止损，严禁满仓梭哈/死扛不止损)'
  - '**关键性质**'
  - '- 首饰三步法的本质：把“感性消费”拆解为“理性比价(步骤 1-2)”+“感性满足(步骤 3)”，两不耽误'
  - '- 纸黄金波段法的本质：把“主观预测”约束在“纪律框架”里，用“分批/低买高卖”对抗“人性弱点(追涨杀跌/重仓不止损)”'
  - '- 两套 SOP 共享同一认知基座：纯度论/单克比价/成本优势/趋同性'
  - '**典型例子**'
  - '- 首饰实操：准备 2 万买金镯子 → 步骤 1 只看 AU999/9999 → 步骤 2 扫 3 家店单克价分别 520/480/460 元(金价 410)
    → 步骤 3 镯子 30g 属重克重，果断选 460 元/克那家，省 1800 元工费，买到同款更重镯子'
  - '- 纸黄金实操：证券账户 5 万底仓 518880(均价 380) → 2023 年 1 月回调至 390 加仓 1 万 → 3 月突破 420 减仓 1
    万锁定利润 → 底仓继续持有吃长期避险红利，全程手续费 < 50 元'
  - '**边界条件**'
  - '- 首饰三步法不适用：古董/非遗/大师定制/镶钻款，定价逻辑已脱离“金价+工费”模型，需专业鉴定'
  - '- 纸黄金波段法不适用：极端单边暴涨暴跌(如 2013 年金价腰斩)、账户资金量太小(手续费最低 0.1 元导致小额分批成本率高)、无法承受 20%+ 回撤心理承受力弱者'
  - '- 两套 SOP 严禁混用：首饰不用波段法(工费沉没无法高抛低吸)，纸黄金不用首饰三步法(无纯度/克重/工费概念)'
  sources:
  - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    role: origin
  excerpts:
  - 大家如果要选购黄金的首饰，一定要看它的黄金含量是多少！只要是正规店铺的黄金，都会有相应的标识。
  - 因此在同等规格下，换算出1g黄金多少钱，才是具有对比价值的。
  - 如果克数并不是很多的话，那么建议大家不要太在意几十块的差价，主要买款式上自己喜欢中意的。
  - 如果我们是买的纸黄金的话，在最低的位置，我们可以做1-2次加仓的操作，中途也可以根据上涨幅度做减仓，那么即便同样买在2020年的最高点，但是经过低点的加仓操作后，会拥有更多的盈利。
  - 纸黄金并不存在保管费用，如果是从证券账户上购买，通常手续费为万分之1%... 可拿到最低手续费仅万分之0.5%
