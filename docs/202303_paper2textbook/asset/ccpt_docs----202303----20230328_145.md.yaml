paper: docs/202303/20230328_145.md
desc: 该素材为生财有术社群精华帖共读环节的开场引导帖，作者胖猫介绍其4年社群经历及抖音资料号副业变现6位数的背景，旨在分享该项目的实操细节与思考，并附上了飞书文档外部链接作为核心内容载体。
concepts:
- name: 抖音资料号
  desc: 一种在抖音平台通过发布资料类内容吸引流量并实现变现的项目模式，为作者核心分享主题。
  is_original: false
  excerpt:
  - 去年开始做抖音资料号项目，变现 6 位数。
  - 为大家分享抖音资料号的一些实操细节和思考
- name: 生财有术
  desc: 作者所在的付费社群名称，提供航海、精华帖共读等实战学习机制。
