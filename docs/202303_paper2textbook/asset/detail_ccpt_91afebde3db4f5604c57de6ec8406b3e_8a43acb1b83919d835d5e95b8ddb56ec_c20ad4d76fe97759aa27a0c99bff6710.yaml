units:
- 'no': 1
  name: 调教精度 —— 让大模型从“会聊天”变成“能干活”
  points:
  - '**为什么需要这个概念？**'
  - '- ChatGPT 等大模型使用门槛极低，人人都能对话，但能否真正落地生产、替代人力，取决于输出质量是否达标'
  - '- 同一个模型，新手用它写废文，高手用它做生产力，核心差距不在模型而在“调教”水平'
  - '- 企业级应用中，图文业务团队从 11 人缩减至 4 人的实战证明：调教精度直接决定人效跃迁'
  - '**核心定义**'
  - '- 调教精度：指通过精细化提示工程，将通用大模型的输出质量、逻辑性、专业度提升至可直接投入生产环节标准的过程与结果度量'
  - '- 核心公式：生产力转化 = 模型基础能力 × 调教精度'
  - '**关键性质**'
  - '- 杠杆性：极低边际成本（几句指令）撬动巨大产出差异（人效倍增）'
  - '- 非线性：微小的指令结构调整（如换成专业术语）可能导致输出质量阶跃式提升'
  - '- 可迁移：同一套调教方法论可复用到写作、编程、数据分析、客服等多个业务场景'
  - '**典型例子**'
  - '- 作者公司图文业务：引入本地部署 ChatGPT 机器人 + 高精度调教，团队规模缩减 63%，产出不降反增'
  - '- 代码理解场景：Python 计算列表偶数和，结构化代码逻辑让模型秒懂，自然语言描述反而易歧义'
  - '**边界条件**'
  - '- 无法突破模型知识截止与幻觉上限：调教只能榨干现有能力，不能赋予模型没有的知识'
  - '- 依赖用户双重前提：提问意识（能清晰表达需求）+ 领域知识结构（能判断对错），缺一不可'
  - '- 过度调教边际收益递减：Prompt 越长不等于效果越好，库内概念精简优于自然语言堆砌'
  sources:
  - paper: docs/202303/20230328_120.md
    role: origin
  - paper: docs/202303/SFnzdD0LqoM8kIxGVsrcAlRhn1d.md
    role: improve
  - paper: docs/202303/TQMkd13LIos5sexxqWZcBHMUnif.md
    role: apply
  excerpts:
  - 我认为在 ChatGPT 使用门槛不断降低的情况下，决定能否将其转化为真正生产力的决定因素就是“调教精度”。
  - 原先需要 11 个人负责的图文业务降到现在的 4 个人负责。
  - 使用ChatGPT创作的小红书爆款笔记不一定能爆，但是最关键的是它能帮助你把自身原来不及格的小红书笔记，快速提升到一个合格博主的创作水平。
- 'no': 2
  name: 三板斧 —— 给 AI 装上“计算机大脑、专业词典、英文母语”三件套
  points:
  - '**为什么需要这个概念？**'
  - '- 自然语言天然模糊、多义、歧义多，大模型虽能懂人话，但处理结构化逻辑、垂直领域知识、英文语料时准确度显著更高'
  - '- 普通用户习惯用大白话、中文、碎片化指令，导致模型“听不清、懂不透、做不对”，三板斧是从“聊天”进化为“编程式指令”的最低认知门槛'
  - '**核心定义**'
  - '- 三板斧：ChatGPT 提示工程的三大底层认知法则——计算机语言逻辑 > 自然语言逻辑、专业语言 > 通俗自然语言、英文 > 中文'
  - '**关键性质**'
  - '- 计算机语言逻辑：无歧义、结构严谨（如 Markdown、JSON、伪代码、步骤分解、条件判断），符合模型训练分布，推理更稳健'
  - '- 专业语言：垂直领域标准术语（如“文本重写”替代“伪原创”、“价格波动”替代“涨跌”），精准激活模型深层参数知识'
  - '- 英文优势：模型核心训练语料为英文，英文 Prompt 直达参数、减少转换损耗、Token 效率更高、输出更稳定'
  - '**典型例子**'
  - '- 伪原创指令：自然语言“保持意思不变换词” < 库内概念“文本重写”'
  - '- 股票描述：自然语言“价格上涨下跌” < 专业术语“价格波动” < 结构化专业描述'
  - '- 天气查询：模糊问“今天天气咋样” < 结构化提供“城市+日期”获得精准回答'
  - '**边界条件**'
  - '- 专业术语需配合适度自然语言修饰，否则输出生硬、可读性差'
  - '- 非英语母语者强行全英文交互可能增加自身认知负荷，建议关键指令英文化、上下文中文化混用'
  - '- 计算机逻辑描述不等于写代码，Markdown 结构化、分步骤指令即可，门槛极低'
  sources:
  - paper: docs/202303/20230328_120.md
    role: origin
  - paper: docs/202303/SFnzdD0LqoM8kIxGVsrcAlRhn1d.md
    role: improve
  excerpts:
  - 它们分别是：1. 它能识别自然语言逻辑的描述，但它更擅长识别计算机语言逻辑的描述；2. 它能识别自然语言，但它更擅长专业语言；3. 它能识别中文，但它更擅长英文。
  - 最终，结果质量的好坏、精准度很大程度上取决于这几个“更”。
  - 与自然语言不同，计算机语言非常精确，没有模糊的含义和多义性。因此，ChatGPT 在处理计算机语言的逻辑描述方面，比处理自然语言更加得心应手。
- 'no': 3
  name: IPO 模型与精准调教模型 —— 给 Prompt 装上“编程式骨架”与“乐高式组件”
  points:
  - '**为什么需要这个概念？**'
  - '- 自然语言指令极其松散，模型极易跑偏、幻觉、格式错乱，急需结构化骨架约束输入输出'
  - '- 复杂任务单一指令无法覆盖，需要像搭乐高一样从标准组件库（角色、任务、格式、风格、受众……）按需组装高阶 Prompt'
  - '**核心定义**'
  - '- IPO 模型：借鉴编程 Input-Process-Output，将 Prompt 拆解为【背景】【输入数据】【指令】【输出指示】四大强制模块，消除歧义'
  - '- 精准调教模型：7 大要素库——[上下文/背景] [角色] [动词/任务对象] [输出与长度] [数据来源] [写作风格] [目标受众]，按需排列组合'
  - '**关键性质**'
  - '- IPO 强制结构化：四模块缺一不可，把“对话”变成“编程调用”，指令遵循率质变'
  - '- 精准调教模块化：不需每次集齐 7 要素，按任务复杂度取舍，新手用 3 个、专家用 7 个'
  - '- 双模互补：IPO 管全局骨架，精准调教管细节配置，组合使用覆盖 90%+ 场景'
  - '**典型例子**'
  - '- 小红书笔记创作：IPO 定结构（开头/中间/结尾/标签），精准调教注人设（22 岁活泼小姐姐）+ 示例模仿，输出质量从“呆板”跃升为“合格博主水准”'
  - '- 简历生成：背景（JD 原文）→ 输入（个人经历）→ 指令（STAR 法则）→ 输出（Markdown 表格），半小时搞定海投版简历'
  - '**边界条件**'
  - '- 简单任务（如翻译、摘要）用 IPO 反而繁琐，直接用库内概念“翻译/摘要”即可'
  - '- 过度结构化可能压制模型创造性发挥，开放性写作任务需保留“自由发挥”缓冲区'
  - '- 模块组装需懂“平台规则”与“爆款范式”，否则搭出的 Prompt 是“标准化的垃圾”'
  sources:
  - paper: docs/202303/SFnzdD0LqoM8kIxGVsrcAlRhn1d.md
    role: origin
  - paper: docs/202303/TQMkd13LIos5sexxqWZcBHMUnif.md
    role: apply
  excerpts:
  - 经 IPO 处理后，一个完整的 prompt 应该包括下面内容：背景、输入数据、指令、输出指示。
  - 我认为一个实用的 Prompt 应该又以下几个部分构成：1. [上下文/背景信息] 2. [角色] 3. [动词][任务和对象] 4. [输出与长度] 5.
    输出可以包括相关的[数据和内容来源] 6. 写作的[风格] 7. 内容主要针对的[目标人群/受众]
  - 以上使用ChatGPT创作小红书的五种模式，对应着不同的熟练度，也是对各位拿着铲子淘金人的水平要求
- 'no': 4
  name: 库内概念调教法 —— 用模型“自带词汇”替代“冗长人话”
  points:
  - '**为什么需要这个概念？**'
  - '- 自然语言描述同一功能往往冗长、模糊、Token 消耗大，且模型理解概率低'
  - '- 模型训练语料中已固化大量标准功能术语（如“文本重写、摘要生成、情感分析、代码生成……”），直接调用这些“内置函数”精准高效'
  - '- 打破“描述越详细越好”的误区：指令精简优于堆砌，库内概念是压缩指令的最高压缩算法'
  - '**核心定义**'
  - '- 库内概念调教：利用模型内部已固化的 13 类标准功能词汇（文本重写、摘要生成、关键词提取、情感分析、代码生成、代码解释、翻译、扩写、续写、润色、大纲生成、标题生成、格式转换）替代自然语言长描述'
  - '**关键性质**'
  - '- 零样本即精准：无需 Few-shot 示例，一句话触达模型深层能力'
  - '- Token 极致节省：几个词替代几百字自然语言，成本降 90%+'
  - '- 可发现性：用户常不知功能“学名”，需建立“通俗需求→库内概念”对照表（如伪原创→文本重写）'
  - '**典型例子**'
  - '- 伪原创：自然语言 200 字描述 → 库内概念“请做文本重写处理”'
  - '- 代码注释：自然语言“帮我加注释” → 库内概念“代码解释”输出逐行注释'
  - '- 会议纪要：自然语言“总结重点” → 库内概念“摘要生成+关键词提取”输出结构化纪要'
  - '**边界条件**'
  - '- 仅覆盖通用高频功能，超长文本处理、多步推理、极度垂直领域任务仍需组合 IPO/精准调教模型'
  - '- 模型版本迭代可能新增/变更库内概念，需持续实测更新对照表'
  - '- 滥用库内概念忽略上下文会导致“断章取义”，必须在 IPO 背景模块中提供充足语境'
  sources:
  - paper: docs/202303/SFnzdD0LqoM8kIxGVsrcAlRhn1d.md
    role: origin
  - paper: docs/202303/TQMkd13LIos5sexxqWZcBHMUnif.md
    role: apply
  excerpts:
  - 用它库里已经存在的概念和词汇去调教它，事半功倍！
  - 如果你想针对某篇文章做伪原创，那你不要写‘伪原创或者请保持文本意思不变，逻辑不变，换其中的一些多义词...’的描述，因为这个功能在它的库中叫‘文本重写’，你直接说‘请针对我输入的文本做文本重写处理’
  - ChatGPT最大的价值是将输入的非标数据变成标准化数据，指令模板是ChatGPT价值最直接的特征体现。
- 'no': 5
  name: RLHF 式交互反馈与逆向生成优化 —— 把“对话”变成“训练”，把“结果”变成“提示词”
  points:
  - '**为什么需要这个概念？**'
  - '- 大模型极难一次给出完美答案，多轮对话是常态，但大多数用户只会“重新问一遍”，不知如何在上下文中引导模型自我修正'
  - '- 反向生成：手里有现成的优秀范例/期望输出，想反推最优 Prompt，而非从零摸索，这是专家级 Prompt 工程的核心技能'
  - '**核心定义**'
  - '- RLHF 式交互反馈：将人类偏好反馈内化为交互习惯——负向反馈即时纠偏（停住→指出错误→给修正方向）、正向反馈固化优质模式（夸奖/点赞），利用上下文窗口实现推理期对齐'
  - '- 逆向生成优化五步法：①明确期望输出 ②提炼关键词概念 ③构建明确问题 ④优化精简问题 ⑤复杂问题分解为子问题逐步询问'
  - '**关键性质**'
  - '- 即时生效：每次反馈立刻影响下一轮输出，无需微调权重，利用上下文学习机制'
  - '- 正负对称：光骂不夸模型会“自卑”输出保守；光夸不骂模型会“飘”不纠错，需正负结合'
  - '- 逆向生成将“Prompt 编写”转化为“需求分析”，从结果倒推原因，成功率远高于正向试错'
  - '**典型例子**'
  - '- 纠偏实战：模型输出营销文案过于夸张 → 反馈“去掉夸张词汇，专业客观些” → 下轮输出即符合品牌调性'
  - '- 反向生成：看到爆款小红书标题 → 提炼“反差+悬念+数字”概念 → 构建“帮我写 10 个同款标题” → 优化为“结合我产品卖点写” → 分步生成'
  - '**边界条件**'
  - '- 上下文窗口有限：长对话中早期反馈会被遗忘，需定期“复述规则”或开启新会话'
  - '- 逆向生成要求用户具备领域审美/判断力，无法辨别好坏输出则无法提炼关键概念'
  - '- 正向反馈勿滥用：对低质量输出盲目点赞会强化错误模式，污染上下文'
  sources:
  - paper: docs/202303/SFnzdD0LqoM8kIxGVsrcAlRhn1d.md
    role: origin
  excerpts:
  - 一般它没法一次就给你非常满意的答案，所以整个过程中就需要你不断的给它反馈，告诉它你是怎么看待它给出的答案的。
  - 如果输出的内容不符合心意，就及时停住，告诉它你不喜欢它的答案，你希望它怎么改进。
  - ①确定预期输出...②提炼关键词和概念...③构建问题...④优化问题...⑤分步询问...
- 'no': 6
  name: 提示词分级体系与平台化应用 —— 从“指令新手”到“混合模式专家”的进阶阶梯
  points:
  - '**为什么需要这个概念？**'
  - '- Prompt 能力非二元（会/不会），而是分级跃迁：特定指令→指令模板→示例模式→代理模式→人设注入代理→混合模式，每级对应更高输出上限'
  - '- 不同平台（小红书、公众号、知乎……）风格规范不同，需将分级体系落地为平台化 SOP，让团队新人也能快速上手标准化产出'
  - '**核心定义**'
  - "- 五大基础模式 + 一种进阶模式：\n  1. 特定指令：仅确认知晓任务\n  2. 指令模板：显式定义平台风格规范（结构/Emoji/标签）\n  3.\
    \ 示例模式：Few-shot 喂入爆款范例模仿\n  4. 代理模式：指定角色身份（如小红书博主）\n  5. 人设注入代理：叠加具体人设画像（年龄/性格/语气/偏好）\n\
    \  6. 混合模式：结构模板+素材+范例+人设 四位一体组合"
  - '**关键性质**'
  - '- 质量单调递增：混合模式输出在结构规范性、内容详实度、人设辨识度、可读性上全维度碾压单一模式'
  - '- 门槛递进：新手只需会指令模板即可产出“及格”内容；专家用混合模式冲刺“爆款”概率'
  - '- 思考不可外包：选题、逻辑、人设定位属于创作者核心决策，AI 仅承接执行层（措辞/排版/润色/结构化）'
  - '**典型例子**'
  - '- 同主题“推荐用 ChatGPT 写简历”对比：特定指令（废话）< 指令模板（有格式无神魂）< 示例模式（有神魂无细节）< 人设注入代理（强 IP 感）<
    混合模式（教练打 70-80 分，达合格博主水准）'
  - '- LinkedIn+ChatGPT 海投简历：半小时/份，效率提升 1 倍+，验证职场场景落地价值'
  - '**边界条件**'
  - '- 混合模式 Prompt 极长，Token 成本高、上下文占用大，简单任务用低级模式性价比更高'
  - '- 示例模式依赖高质量范例库，无范例库时退化为指令模板'
  - '- 人设注入若与平台调性冲突（如严肃财经号注入“卖萌人设”）会翻车，需先做账号定位再注入人设'
  sources:
  - paper: docs/202303/TQMkd13LIos5sexxqWZcBHMUnif.md
    role: origin
  excerpts:
  - 输入的Prompt提示关键词，可以归类为4种常见的基础模式：分别是：特定指令、指令模板、示例模式、代理模式。除了上面的4种基础模式外，在实际使用ChatGPT过程中，我们更多使用的是另一种模式—混合模式。
  - 在小红书航IP实战群中，我私下向一位不愿意透露姓名的教练请教...当这位教练对我使用ChatGPT创作的内容给到了70-80分的评价时，我觉得ChatGPT在小红书的内容创作上会有非常大的价值和应用空间。
  - 内容可以外包，思考终究还是自己的。
- 'no': 7
  name: 用户双重前提：提问意识与知识结构 —— AI 只是脚手架，人才是大楼
  points:
  - '**为什么需要这个概念？**'
  - '- 打破“AI 全能论”幻觉：同一个模型，专家用出专家级成果，小白用出小白级废文，差异不在模型而在人'
  - '- 明确人机分工边界：AI 负责执行、检索、结构化、润色；人负责决策、判断、创新、担责，思考不可外包'
  - '- 指明个人成长方向：练提问意识（搜索力/系统思维/元认知/执行力）+ 筑知识结构（垂直领域专业度），是 AI 时代不可替代的核心竞争力'
  - '**核心定义**'
  - '- 提问意识：清晰表达需求、提供充足上下文、筛选关键信息、构建结构化问题的能力（对应“提问质量-能力同构定律”）'
  - '- 知识结构：垂直领域专业储备，支撑判断模型输出真伪、评估质量优劣、提出深度追问、规避幻觉陷阱'
  - '**关键性质**'
  - '- 短板效应：提问意识与知识结构取最小值决定 AI 使用上限，缺一不可'
  - '- 复利正相关：提问意识随实战复盘累积；知识结构随领域深耕沉淀，二者长期复利、互为因果'
  - '- 职场映射：HR 用 AI 筛简历、求职者用 AI 模拟面试、创作者用 AI 产内容，本质都是“工作流嵌入深度 × 领域专业度”'
  - '**典型例子**'
  - '- 天气查询：模糊问“咋样”得模糊答；结构化给“城市+日期”得精准答，提问意识直接决定输出质量'
  - '- 专家 vs 小白：同用“文本重写”，专家能判断语义是否保真、逻辑是否通顺；小白只能信或不信，无法驾驭'
  - '**边界条件**'
  - '- 通用大模型能力持续跃迁（如 GPT-4o 推理增强），可能降低对提问意识的依赖，但知识结构作为“判断力”永不贬值'
  - '- 低门槛工具（如内置 Prompt 模板的 SaaS）可屏蔽提问意识门槛，但天花板极低，无法应对非标任务'
  - '- 领域知识结构获取周期长（年级），短期突击只能练提问意识，长期护城河必须靠专业度积累'
