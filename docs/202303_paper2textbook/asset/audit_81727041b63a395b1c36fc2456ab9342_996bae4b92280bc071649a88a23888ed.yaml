unsupported_claims:
- location: '63.3'
  claim: 落差感-冲动-失误因果链
  reason: 素材P001中描述了落差感和冲动决策，但未明确给出'落差感-冲动-失误'三阶段因果链的命名与结构化表述；素材P008虽提到'落差感'、'盲目付费、频繁切项、执行遇挫即弃'，但未形成显性因果链模型。
- location: '63.3'
  claim: 长期主义执行公理公式：创业成果 = (认知上限 - 预期偏差) × 执行持久度
  reason: 素材P001、P008均未出现该数学公式及'预期偏差操作化测量'等量化细节，属于教材编写时的二次结构化产出。
- location: '63.9'
  claim: ChatGPT Prompt 转 XMind 标准流
  reason: 素材P007仅提到'用 ChatGPT 制作 xmind 的贴子'、'整理为 XMind 可识别的 Markdown 大纲格式'，未给出具体 Prompt
    模板与参数设置。
- location: '63.9'
  claim: 工具链迭代史：手工 → 幕布/知犀 → 石墨 → ChatGPT+XMind
  reason: 素材P007评论区仅提及'幕布被联想收购后不更新了'、'用的知犀'、'石墨协作'、'ChatGPT+XMind'，未形成官方认定的迭代史时间线。
- location: '63.10'
  claim: 核心语录体系（金钱管道论/条件式幸福陷阱/时间复利坚持/微动吉先见/心量扩容/行动三部曲/反馈导向撞击世界/幻想与决心置换律）
  reason: 素材P009壁纸图片与评论区仅出现'主动举手才会被看见''抛开对金钱的幻想 坚定攻克困难的决心''未来一年连睡觉都是浪费时间'等碎片化语录，未形成系统化的八条核心语录体系及标准定义。
- location: '63.11'
  claim: 分段式议程设计法（7时段甘特图）、记录员制度、末班车兜底预警机制
  reason: 素材P009给出了活动前/中/后清单与议程时间表，但'7时段甘特图'为教材编排的可视化重构，'记录员制度'仅一句'安排了一个记录员'，'末班车兜底预警机制'为公告列表与活动中提醒的合称，非素材原有标准化术语。
