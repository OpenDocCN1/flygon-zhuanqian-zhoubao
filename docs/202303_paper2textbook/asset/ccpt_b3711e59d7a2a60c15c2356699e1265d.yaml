paper: docs/202303/20230328_127.md
desc: 该素材为常常在生财有术航海实战群内的分享记录，主要介绍如何结合 ChatGPT 提升小红书创作者的内容创作效率。核心内容包括：分享者基于百万粉丝实操经验与深度提示词研究背景，提出解决“拿到账号不会提问”及“创作笔记不会提问”两大核心问题，梳理了五种
  ChatGPT 提示关键词优化思路，并以小红书笔记创作为例给出具体实操案例；同时更新了近期关于 ChatGPT 结合 AI 绘画、弥补个人技能短板等新的使用思考。
concepts:
- name: ChatGPT+小红书创作增效体系
  desc: 将大语言模型能力与小红书平台内容生产流程深度结合，覆盖选题、文案、排版、互动等全链路，实现创作效率指数级提升的方法论体系。
  is_original: true
  excerpt:
  - 如何结合 ChatGPT 的使用，帮助小红书的创作者们提高创作效率
  - 一个是我擅长的平台，一个是我熟练地技能，ChatGPT+小红书究竟能够做到什么
- name: 五种提示关键词优化思路
  desc: 针对‘拿到账号不知道如何提问’的痛点，提炼的五类核心提示词工程模式，用于快速找到优化 Prompt 的切入点。
  is_original: true
  excerpt:
  - 好不容易拿到 ChatGPT 账号，不知道如何提问？这五种 ChatGPT 提示关键词可以快速帮你找到优化提示的思路
- name: 提示词艺术实践库
  desc: 分享者翻译国外提示词艺术书籍并整理的 88 个实践案例小册子，构成的可复用 Prompt 资产库。
  is_original: true
  excerpt:
  - 翻译过一本国外的提示词艺术书籍，也做了一份 88 个实践案例的小册子，积累了比较丰富的 ChatGPT 实用经验
- name: AI 协作补齐短板
  desc: 利用 AI 工具（如 ChatGPT 辅助阅读英文技术文档、编写代码）弥补个人在语言、编程等硬技能上的不足，从而发挥原有领域优势。
  is_original: false
  excerpt:
  - AI 更方便普通人补齐自己的短板，比如我不会英语和代码现在在利用 chatgpt 看一些 stable diffusion 的相关资料
methods:
- name: __overview__
  desc: 基于‘平台实战经验+提示词工程能力’双重背景，采用‘问题导向+案例驱动’的方法论：先定义创作痛点（不会提问、创作无路径），再给出通用提示词优化框架（五种关键词），最后落地到具体业务场景（小红书笔记创作案例）并外推至跨模态协作（AI绘画）。
  excerpt:
  - 本次分享主要解决 2 个问题，顺带更新最近一些新的 ChatGPT 使用思考： （1）好不容易拿到 ChatGPT 账号，不知道如何提问？这五种 ChatGPT
    提示关键词可以快速帮你找到优化提示的思路； （2）创作小红书笔记，不知道如何提问，文章中以小红书笔记创作为例，给你具体使用案例。 （3）新的 ChatGPT
    使用思考。
- name: 小红书笔记创作实战提示词工程
  desc: 将小红书爆款笔记结构（标题钩子、开头金句、干货分点、结尾互动、标签布局）拆解为结构化 Prompt 指令，通过少样本或角色设定引导 ChatGPT
    批量产出符合平台调性的高质量初稿。
  excerpt:
  - 创作小红书笔记，不知道如何提问，文章中以小红书笔记创作为例，给你具体使用案例
  - 分享正文因为包含较多的 ChatGPT 实践过程图示，所以将文档放在了飞书中
theorems:
- name: 领域经验与 Prompt 能力的复利效应
  desc: 只有深度理解业务平台规则（小红书运营）且掌握提示词工程（Prompt Engineering）的人，才能发挥 ChatGPT 最大价值；单纯懂技术不懂业务，或懂业务不懂提问，均难以产出高质量内容。
  excerpt:
  - 一是我是小红书 IP 航海实战群的领队...在笔记创作方面有比较丰富的经验； 二是从 12 月份以来我就一直在探索 ChatGPT 的新技术应用...积累了比较丰富的
    ChatGPT 实用经验。一个是我擅长的平台，一个是我熟练地技能
- name: AI 工具的核心价值在于‘补短板’而非单纯‘洗稿’
  desc: 生成式 AI 的高级用法不是低成本复制内容（洗稿），而是作为能力延伸工具，帮助创作者跨越语言、代码、绘画等技能壁垒，聚焦核心优势领域创新。
  excerpt:
  - AI 绘图结合 chatgpt 应该可以更轻松的洗稿吧。 但是我觉得 ai 更方便普通人补齐自己的短板...觉得应该怎么利用 ai 发挥自己的优势才是重点。
findings:
- name: 小红书百万粉丝实战验证
  desc: '[evidence] 分享者在 2022 年 10 月航海实战中，通过 100 天运营实现账号涨粉 14 万+，验证了其小红书内容创作方法论的有效性。'
  excerpt:
  - 通过 100 天，实现账号涨粉 14 万+的成绩，在笔记创作方面有比较丰富的经验
- name: 飞书文档承载完整实操案例库
  desc: '[claim] 完整的 ChatGPT 实践过程图示、具体提示词案例及输出结果已整理至飞书文档，包含小红书笔记创作的具体使用案例。'
  excerpt:
  - 分享正文因为包含较多的 ChatGPT 实践过程图示，所以将文档放在了飞书中，为了更好地阅读体验，请诸位移步飞书文档阅读： https://aogot4f9us.feishu.cn/docx/TQMkd13LIos5sexxqWZcBHMUnif
- name: 社群高认可度背书
  desc: '[evidence] 该分享在生财有术 21 天航海中获得 62 赞及团队高度认可，表明该方法论在创作者群体中具有实战参考价值。'
  excerpt:
  - (62 赞)《如何结合 ChatGPT 帮助小红书的创作者们提高创作效率》
  - 感谢生财团队和船友们的支持，对这次分享给出了较高的认可评价
