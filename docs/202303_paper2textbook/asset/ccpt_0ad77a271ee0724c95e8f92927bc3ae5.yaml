paper: docs/202303/20230328_030.md
desc: 该素材记录了用户“蒸蒸”于2023年3月25日参加杭州全国见面会后，从会议内容中提炼总结出的二十句金句，并将其制作成二十张手机壁纸图片分享至社区，旨在传递会议核心精神与激励性观点，引发社区成员积极互动与使用。
concepts:
- name: 杭州全国见面会
  desc: 素材核心内容来源的线下活动，用户于2023年3月25日参与，会议内容被提炼为二十句核心语录。
  is_original: false
  excerpt:
  - 25 号参加了杭州全国见面会
- name: 二十句话壁纸
  desc: 用户基于会议内容提炼的二十句核心语录，配合视觉设计制作成的手机壁纸图片集，用于传播与个人激励。
  is_original: true
  excerpt:
  - 从会议中提炼了二十句话 做了二十张壁纸
  - 希望大家喜欢～
- name: 知识提炼与视觉化分享
  desc: 指将线下活动的听觉/文字信息，通过总结提炼转化为简短金句，再结合视觉设计制作成易于传播、保存的壁纸格式，实现知识二次加工与社区分享的方法论。
  is_original: true
  excerpt:
  - 从会议中提炼了二十句话 做了二十张壁纸 希望大家喜欢～
methods:
- name: __overview__
  desc: 参会记录 -> 核心内容提炼（二十句话） -> 视觉设计制作（壁纸） -> 社区发布分享 -> 根据反馈迭代更新。
  excerpt:
  - 25 号参加了杭州全国见面会 从会议中提炼了二十句话 做了二十张壁纸 希望大家喜欢～
  - 有需要的可以评论补充 我会更新～
- name: 会议金句提炼法
  desc: 从长时长、大信息量的会议实录中，筛选、提炼出具有高信息密度、高传播价值、强激励性的核心语录（本素材为20句）。
  excerpt:
  - 从会议中提炼了二十句话
- name: 文档协作外链引用法
  desc: 利用飞书文档（feishu.cn/docx）托管完整高清壁纸素材或详细笔记，在社区发布预览图与摘要，引导用户跳转获取原件。
  excerpt:
  - https://n23kv6bn85.feishu.cn/docx/VEF1dwgsRoVRcIxbDRCcRYvWnKf
- name: 社区驱动迭代更新机制
  desc: 发布者在社区征集需求与反馈，根据评论区用户意见（如补充内容、修正错误）对壁纸内容进行持续更新维护。
  excerpt:
  - 有需要的可以评论补充 我会更新～
theorems:
- name: 主动输出促进内化与传播
  desc: 通过主动整理会议笔记并制作成壁纸这一‘有形产出’，能加深参会者对内容的理解内化，同时通过分享惠及未参会者，实现知识价值最大化。
  excerpt:
  - 25 号参加了杭州全国见面会 从会议中提炼了二十句话 做了二十张壁纸 希望大家喜欢～
- name: 碎片化载体适配碎片化阅读
  desc: 将系统性会议内容拆解为独立的‘二十句话’，并适配手机壁纸这一高频触达的碎片化载体，降低用户获取和复习核心观点的认知门槛与时间成本。
  excerpt:
  - 从会议中提炼了二十句话 做了二十张壁纸
findings:
- name: 社区需求验证与正向反馈
  desc: '[evidence] 评论区多位用户（劲猫、Mr. Lucky、正宇、小夏有办法、華仔）明确表示‘现在就换’、‘好棒！马上就换’、‘感谢分享’，验证了该壁纸集的实用性与受欢迎度。'
  excerpt:
  - '劲猫 : 现在就换'
  - 'Mr. Lucky : 主动举手，才会被看见[强][强]'
  - '正宇 : 需要，多更新！ 正宇 : 现就换！'
  - '小夏有办法 : 好棒！马上就换！'
  - '華仔 : 现在就换，感谢分享'
- name: 用户互动补充内容方向
  desc: '[claim] 评论用户 Mr. Lucky 提出‘主动举手，才会被看见’，疑为会议中另一重要金句或个人感悟，暗示原有二十句话可能遗漏该核心观点，印证了作者‘评论补充、持续更新’机制的必要性。'
  excerpt:
  - 'Mr. Lucky : 主动举手，才会被看见[强][强]'
- name: 原始素材托管于飞书文档
  desc: '[evidence] 作者提供了飞书文档链接（https://n23kv6bn85.feishu.cn/docx/VEF1dwgsRoVRcIxbDRCcRYvWnKf）作为完整壁纸素材或详细笔记的存储与分发源，社区图片为预览图。'
  excerpt:
  - https://n23kv6bn85.feishu.cn/docx/VEF1dwgsRoVRcIxbDRCcRYvWnKf
