unsupported_claims:
- location: '34.3'
  claim: 刘晨昊用亲身经历证明：一个'还不算什么影响力'的普通人，通过小红书单月变现 8w+。
  reason: 素材中提到单月变现 8w+，但未提供具体变现构成（如社群、咨询、广告等占比）及持续性证明，仅凭单月数据不足以支撑'稳定变现'论断。
- location: '34.4'
  claim: 小红书就是标题党，标题取的好，成功了 99%，毫不夸张说这一点。
  reason: 素材中仅为刘晨昊个人主观感受，缺乏平台官方数据或第三方实证研究支撑'99%'这一量化比例。
- location: '34.5'
  claim: 做自媒体做得好的，观察下来都是生活特别不如意的...如果你现在过得不太顺利，放宽心，也许这就是你的创作养料
  reason: 素材中仅基于刘晨昊个人观察及个例（自己职场顺利时抖音探索慢、崩塌期小红书速出道），样本量极小，未控制幸存者偏差，无法推广为普遍规律。
- location: '34.6'
  claim: 破圈内容不可失守底线：泛内容必须关联核心人设...纯蹭热点会模糊标签
  reason: 素材中未提供'纯蹭热点导致标签模糊'的反面教材案例或数据验证，仅为经验之谈。
- location: '34.7'
  claim: 支点能力需随行业迭代更新（如引入AI工具升级调研效率），否则会过期。
  reason: 素材中未提及AI工具升级调研效率的具体案例或操作细节，属于教材作者主观推演。
- location: '34.8'
  claim: 用户投射型IP...决策链路极短（最快20分钟成交）
  reason: 素材中未提供'20分钟成交'的具体交易记录、用户访谈或转化漏斗数据佐证。
- location: '34.9'
  claim: 首期50%转化率(100人进群50人付费)证明产品市场契合度(PMF)
  reason: 素材中未说明这100人来源（是否全为精准粉丝）、付费后留存率、复购率等关键PMF指标，仅凭首期转化率不足以证明PMF。
- location: '34.10'
  claim: 你只需要比用户那些废物朋友们有见地一点点，你就显得很牛逼了
  reason: 素材中该论断为刘晨昊主观比喻，未给出'废物朋友'的定量定义、对照实验数据或心理学理论支撑。
- location: '34.11'
  claim: 公私域转化率随规模递减：早期种子用户转化率高(50%)，规模扩大后稳态下降(20%)，不可线性外推。
  reason: 素材中仅给出两个阶段点位数据，缺乏中间规模梯度下的转化率曲线数据，'不可线性外推'为作者主观判断。
- location: '34.12'
  claim: 万粉级卖录播课仅200+付费、收入几万、ROI极低，印证矩阵判断准确。
  reason: 素材中未披露该'万粉级账号'的具体领域、课程定价、推广投入、完课率等关键变量，单一案例不足以推翻'录播课模式'普适性。
- location: '34.13'
  claim: 老号日通过好友 < 200，>200必封
  reason: 素材中为刘晨昊个人经验总结，未引用微信官方规则文档或第三方大规模测试数据，'必封'属绝对化表述风险极高。
- location: '34.14'
  claim: 抖音2个月练网感 → 小红书第2天出道(普通人需1-3个月)，压缩80%试错周期
  reason: 素材中'普通人需1-3个月'无来源标注，'压缩80%'为作者根据两个时间点粗略计算，未扣除内容适配成本、平台规则学习成本等变量。
