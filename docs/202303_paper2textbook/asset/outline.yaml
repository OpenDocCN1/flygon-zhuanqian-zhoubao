  - 'no': 11
    name: 组织管理与人才体系 —— 从“圣母心留人”到“业务导向设计与流程喂养AI化员工”
    desc: 本章提炼创业期组织建设核心方法论：业务导向组织设计(架构服务业务目标非迁就人员/拒绝圣母心/人岗不匹配果断调整)、剥洋葱面试法/成就型动机识别(层层追问验证真实性/筛选信愿景图成长而非图钱的人/面试tips:原公司成就感事件/平时爱干什么)、流程喂养/AI化员工模型(核心业务拆解标准化问题库与SOP/像喂AI一样喂料给员工/让普通人按流程产出70-80分稳定结果/不追求100分)、人岗匹配大于激励机制(人是1机制是0/老板时间花在找成就型人才)、服务业规模化铁律(标准化前置/人才后置/创始人先显性化隐性知识再招低成本执行层)、大客户销售分级漏斗(圈层渗透→存量激活KYC面谈→用户分层A类创始人亲服/B类团队标准化/C类剥离自动化→成长型IP锚定溢价)。
    nodes:
    - 'no': 1
      name: 业务导向组织设计与拒绝圣母心
      desc: 组织架构必须服务于业务目标，而非迁就现有人员；拒绝‘圣母心’硬留不合适的人，依据业务阶段匹配岗位，人岗不匹配果断调整；人才分层运营(核心/执行/淘汰)，把适当的人放适当位置。
