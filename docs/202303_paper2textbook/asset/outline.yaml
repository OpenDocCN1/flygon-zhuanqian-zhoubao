    - 'no': 10
      name: 纸黄金投资(黄金ETF/场内基金)：非实物价格同步波动手续费极低无保管费T+0/T+1灵活交易支持分批建仓
      desc: 可在银行APP或券商账户交易黄金ETF衍生品，价格与实物黄金同步波动，手续费极低万0.5%-万1%最低0.1元，无保管费T+0/T+1灵活交易支持分批建仓加减仓操作。
      role: definition
      src:
      - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    - 'no': 11
      name: 黄金价格三位一体趋同论：实物/纸黄金/首饰金料部分价格核心驱动均为国际金价
      desc: 实物黄金纸黄金黄金首饰金料部分价格核心驱动因素均为国际金价，三者价格走势长期高度相关趋同变动。
      role: proof
      src:
      - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    - 'no': 12
      name: 2020-2023黄金周期复盘实证：实物买高点待2.5年回本纸黄金低点加仓同期正收益
      desc: 基于图表数据验证2020年8月高点回落至2021年3月低点随后震荡上行至2023年突破新高；实物黄金买高点需等待约2.5年回本无收益；纸黄金低点加仓上涨减仓实现同期正收益。
      role: experiment
      src:
      - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
    - 'no': 13
      name: 纸黄金成本优势量化：券商渠道ETF手续费万分之0.5%单笔最低0.1元vs实物保管费年300元
      desc: 券商渠道黄金ETF手续费可低至万分之0.5%单笔最低0.1元，实物黄金银行保管费约300元/年，量化证明纸黄金持有成本绝对优势。
      role: experiment
