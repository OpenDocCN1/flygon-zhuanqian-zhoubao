    - 'no': 4
      name: AI辅助MVP三步法：从构思到验证
      desc: 1. 构思：用ChatGPT进行市场调研、痛点挖掘、方案生成；2. 落地：用GPT API/插件/代码解释器快速产出原型；3. 验证：小额投流/发布内容测试转化，跑通闭环后再决定是否投入RPA/团队放大。
      role: method
      src:
