    desc: 本章以“石痴鸡血石”账号为例，详细记录从0到1、自然流起号到付费投流突破、手播转真人出镜打造场景差异化、引入拍卖玩法提升成交率的六个进化阶段，核心主张小众非标品依靠“极低成本起步+实打实福利+千川精准投流+拍卖建立信任+场景人设升级”实现持续稳定变现。
    nodes:
    - 'no': 1
      name: 鸡血石非标品属性：每枚印章唯一需独立讲解定价
      desc: 留人难、成交频次低，但具备一物一价、遇有缘人高客单成交、送礼属性强特点；基地报白质检机制（青田石雕基地出具证书）解决买家信任痛点。
      role: definition
      src:
      - paper: docs/202303/20230328_144.md
    - 'no': 2
      name: 低成本手播冷启动与福利留人起号法
      desc: 一台手机两盏灯极低设备成本开播；每场送3枚昌化石印章(单成本200-300元)配合抖币福袋，实打实成本换取自然流量权重提升、精准人群标签、种子忠实粉丝池，坚持6个月日均福利成本600-900元。
      role: method
      src:
      - paper: docs/202303/20230328_144.md
    - 'no': 3
      name: 冷启动期自然流量红利验证：次日成交4000元、场观峰值3000+、平均在线30+
      desc: 复用父辈旧号零投流纯平播，连续多日成交数千至上万，持续半年享受自然流量红利，验证小众类目+非标品+基地背书可跑通冷启动。
      role: experiment
      src:
      - paper: docs/202303/20230328_144.md
    - 'no': 4
      name: 流量瓶颈期千川投流救活直播间：日预算~1000元、极速推+达人相似
      desc: 自然流量衰退(场观3000→1000+、在线30→10+、连续10天不出单)引入千川，配合原有模型恢复日销1-5万稳定出单；蝉妈妈/精选联盟筛选文玩垂类达人投达人相似计划引入精准人群。
      role: method
      src:
      - paper: docs/202303/20230328_144.md
    - 'no': 5
      name: 拍卖无托真拍+讲品双轨节奏：薄利引流+高利收割
      desc: 前半场拍卖中低客单品(~1000元)秒拍秒付无托真拍拉高在线/停留/互动建立信任；后半场讲解高客单非标品(几万至几十万)利用信任转化大单；复购率显著高于同行，22年9月达抖音石雕类目第一。
      role: method
      src:
      - paper: docs/202303/20230328_144.md
    - 'no': 6
      name: 人货场进化论：手播→真人出镜/摄像机/实体店场景升级
      desc: 核心要素随阶段协同迭代：增强主播人设、打造新直播场景形成差异化吸引眼球增加停留增大成交几率；在有成本预算/一定成果前提下敢于做出改变。
      role: theorem
      src:
      - paper: docs/202303/20230328_144.md
    - 'no': 7
      name: 私域高客单成交闭环：父亲微信一对一深度服务+线下实体店验货
      desc: 3人团队无主动私域运营靠客户主动添加，父亲微信成交高客单复购累计超百万；杭州临安实体艺术馆强化信任促成当面大额交易，线上引流/线下成交/私域复购三位一体。
      role: extension
      src:
      - paper: docs/202303/20230328_144.md
    - 'no': 8
      name: 综合利润率30%与资源门槛真实边界：父辈几十年矿源积累不可复制
      desc: 核心护城河为原产地矿源积累(政策封矿)及专家级选品定价权；新人入局门槛极高，建议有类似资源(寿山石/青田石/奇石)者尝试，否则难跨越“货”的壁垒。
      role: limitation
      src:
      - paper: docs/202303/20230328_144.md
    - 'no': 9
      name: 先开播再完美执行优先原则：勤奋度是平台核心考核指标
      desc: 不应陷入设备/场地/完美话术过度准备，以最低成本立即开播，实战中每播一场积累一场经验快速迭代人货场，行动力大于筹备度。
      role: motivation
      src:
      - paper: docs/202303/20230328_144.md
  - 'no': 16
    name: 短剧CPS低门槛高复制模式 —— 搬运去重+矩阵号批量、爆款产出比2:1、止损试错机制
    desc: 本章基于清欢（20230328_146）与MwIYdeZNio8bWUxAEGCcOhO2nlc两位作者实战，系统拆解短剧CPS推广“授权获取→二创剪辑去重→模块化复用→矩阵号高频发布→卡点式剧情结构→悬念驱动付费”的全流程SOP，验证小白月入过万蓝海项目的可行性边界。
