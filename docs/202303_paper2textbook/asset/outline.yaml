    - 'no': 14
      name: 长期收益率对比：7年近乎翻倍年化10.4%显著跑赢银行理财2-4%
      desc: 2016-2023年7年黄金价格几乎翻倍约100%涨幅年化约10.4%，显著跑赢同期普通银行理财收益通常2-4%。
      role: experiment
