  - 'no': 12
    name: 服务设计微观洞察 —— 好的服务让客户“下意识选择它”
    desc: 本章通过公交车上老人因首选座位1号缺扶手且惯用手被占用导致借力失败，被迫转向就近有扶手座位2号的微观观察，揭示服务设计最高境界：通过物理环境微细节(扶手位置/动线设计)适配用户特定约束下(单手/震动/台阶)的本能反应，使用户无需思考即完成最优交互。核心发现：扶手位置与惯用手匹配度决定上座成败、动态环境下‘就近原则’优于‘偏好原则’的行为切换机制、台阶高度与扶手缺失叠加形成隐性服务门槛。
    nodes:
    - 'no': 1
      name: 下意识选择与环境约束下的借力路径
      desc: 用户在特定情境约束(车辆震动/双手被占/时间压力)下，无需刻意思考，仅凭环境物理线索(扶手可得性/距离)自动完成最优行为决策；良好服务设计需预判并适配用户自然借力习惯(身体支撑点与发力路径匹配度)。
      role: definition
      src:
      - paper: docs/202303/20230328_096.md
    - 'no': 2
      name: 微观服务触点与好的服务让客户下意识选择它定理
      desc: 微小物理设施细节(座位扶手/台阶高度)在特定情境下直接决定体验成败；服务设计最高境界非显性指引，而是通过微细节适配用户本能反应，使用户无需思考即完成最优交互。
      role: theorem
      src:
      - paper: docs/202303/20230328_096.md
    - 'no': 3
      name: 情境化行为观察与多维约束交叉分析法
      desc: 捕捉异常行为(计划选1号→实际坐2号)视为设计缺陷信号；现场取证座位物理属性/用户身体状态/环境动态约束，三维交叉定位关键决策变量(扶手可得性与惯用手匹配)；行为偏差捕捉+多维约束交叉分析反向推导物理认知机制。
      role: method
      src:
      - paper: docs/202303/20230328_096.md
    - 'no': 4
      name: 扶手位置/惯用手匹配度决定上座成功率与动态环境行为切换实证
      desc: 实测：老人单手提袋→1号扶手同侧导致借力力学失效上座失败；2号扶手适配可用手且最近→支撑成功上座；初始有偏好(1号)但动态约束(启动晃动/时间窗口)触发‘被动就近选择’：首选物理不可行时，不再找最优偏好，选‘当前可行且最近’方案。
      role: experiment
      src:
      - paper: docs/202303/20230328_096.md
    - 'no': 5
      name: 台阶高度与扶手缺失叠加形成隐性服务门槛
      desc: 座位存在‘小阶梯’需‘迈步上抬’，结合启动车辆不稳定性，对老年群体构成体力门槛；扶手缺失将门槛从‘可跨越’变‘不可跨越’，微小设施缺陷在特定人群/情境下被放大为服务失败根因。
      role: finding
      src:
      - paper: docs/202303/20230328_096.md
