  - 'no': 14
    name: 风向标精选周刊：AIGC工具落地与平台红利捕捉实战合集
    desc: 本章汇总2023年3月20-23日生财有术『风向标精选』周刊核心内容：AIGC一条龙工作流(ChatGPT+MJ/SD+视频/语音工具全自动化内容生产)、AI数字人直播(HeyGen/SadTalker/自研模型7x24无人直播)、AI套壳/Prompt工程变现(垂直场景封装/贩卖指令集)、认知差反向引流(文心一言智障图吐槽获流)、平台原生工具闭环(小风车/视频号切片/原创授权/商品卡/直播分屏)、虚拟资源矩阵变现(壁纸/笔刷/模板/资料零边际成本复售)、小红书零粉图文冷启动、抖音低门槛直播模型、视频号直播切片+高客单知识付费、闲鱼1元虚拟资料引流、AI课程分销为确定性最高卖铲人生意、宠物+AI垂直赛道高转化、寺庙/玄学/情绪价值赛道结合AI/直播工具爆发式增长。核心方法论：工具组合拳+平台红利捕捉+认知套利，私域为所有公域玩法终局归宿。
    nodes:
    - 'no': 1
      name: AIGC工具落地核心是『场景化组合』而非『单点技术』
      desc: 单一AI工具商业价值有限，必须将LLM(文本/逻辑)+Diffusion(图像/视频)+RAG/微调(垂直知识)+自动化脚本(工作流)针对具体商业场景(电商主图/短视频批量/数字人直播/代问服务)组合封装，才能形成可交付/可复制/可规模化的产品化能力。
      role: theorem
      src:
      - paper: docs/202303/MZqUdSJumoQZwtxLCatcDJ1snze.md
    - 'no': 2
      name: 流量红利本质：平台新功能与用户新认知的时差套利
      desc: 平台新功能初期流量扶持/竞争少/规则宽松；用户对新技术认知不全/好奇心强/支付意愿高；最先构建『功能+认知』打法者吃最大红利。
      role: theorem
      src:
      - paper: docs/202303/MZqUdSJumoQZwtxLCatcDJ1snze.md
    - 'no': 3
      name: 私域是所有公域玩法的终局归宿
      desc: 无论小红书引流/抖音小风车/视频号切片/闲鱼低价引流/朋友圈投流，最终目的均为沉淀至微信个人号/社群/企业微信，通过高频触达/信任建立/复购转化实现LTV最大化，公域仅为『引流前端』。
      role: theorem
      src:
      - paper: docs/202303/MZqUdSJumoQZwtxLCatcDJ1snze.md
    - 'no': 4
      name: AI课程/工具分销：当前确定性最高『卖铲人』生意
      desc: 多独立案例(网易官方/视频号个人号/社群分销体系)验证『AI焦虑+刚需技能』模型下虚拟课程极高复购率与利润率，交付成本趋近零。
      role: experiment
      src:
      - paper: docs/202303/MZqUdSJumoQZwtxLCatcDJ1snze.md
    - 'no': 5
      name: 小红书『宠物+AI』赛道验证垂直细分高转化潜力
      desc: 宠物主付费意愿强/决策链路短/复购高；AI绘画(LoRA/ControlNet)完美解决『宠物写真』定制化/非标/低成本痛点，形成『引流图(AI生成)→私域定制(单价可控)→实物周边(服装/画像)』完整链路。
      role: experiment
      src:
      - paper: docs/202303/MZqUdSJumoQZwtxLCatcDJ1snze.md
    - 'no': 6
      name: 视频号『语音直播+高客单课程』跑通非标服务标品化交付
      desc: 语音直播门槛极低(不露脸/场景简单)配合视频号助手切片分发，将『婚姻/情感/人性』高咨询门槛非标服务打包为99元标准化录播/直播课，实现『单次咨询几百元→课程99元无限售』规模化跃迁，利用平台算法解决信任建立与获客成本难题。
      role: experiment
      src:
      - paper: docs/202303/MZqUdSJumoQZwtxLCatcDJ1snze.md
    - 'no': 7
      name: 『寺庙/玄学/情绪价值』赛道结合AI/直播工具呈现爆发式增长
      desc: 年轻群体焦虑驱动下，低成本满足『求心理安慰/社交货币/打卡拍照』需求产品(答案之书/签文/寺庙攻略/数字人算命)极易病毒传播，结合数字人直播/短视频矩阵可实现7x24小时自动化收割情绪价值变现。
      role: experiment
      src:
      - paper: docs/202303/MZqUdSJumoQZwtxLCatcDJ1snze.md
  - 'no': 15
    name: 商业周报与专栏索引体系 —— 从“龙哥赚钱周报”到“知识资产目录化管理”
    desc: 本章剖析生财有术社群核心交付物‘龙哥赚钱周报’的编排逻辑：以语雀文档为载体，采用分类标签(中括号)结构化组织、引用社交互动数据(点赞/精华/评论图)增强可信度、版权声明控制传播范围。揭示付费社群内容运营的稀缺性驱动价值主张与社交背书增强可信度机制，同时指出文档结构完整性缺失(仅为目录索引)与核心内容依赖外部链接(语雀)存在失效风险的隐患。
