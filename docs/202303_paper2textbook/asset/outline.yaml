    - 'no': 16
      name: 黄金投资避坑指南：不买一口价/不买工艺费极高/不买非正规渠道/不混淆消费与投资
      desc: 避坑核心：拒绝一口价黄金(克重不透明)、拒绝工艺费极高产品、拒绝非正规渠道购买、严格区分消费属性首饰与投资属性金条纸黄金。
      role: limitation
      src:
