- 'no': 0
  chapters:
  - 'no': 1
    name: 商业认知重构 —— 从“赚钱有罪”到“利他即赚钱”
    desc: 本章旨在拆解阻碍个体商业成功的核心心理障碍，通过重构交易的价值创造本质，建立‘赚钱即利他’的底层商业范式，并确立个体为赚钱结果的唯一责任主体。
    nodes:
    - 'no': 1
      name: 赚钱心理障碍的成因与危害
      desc: 剖析‘赚别人钱不好意思’的道德负罪感如何导致不敢报价、不敢推销、不敢规模化，成为商业变现的核心拦路虎。
      role: motivation
      src:
      - paper: docs/202303/20230328_008.md
      - paper: docs/202303/20230328_032.md
    - 'no': 2
      name: 交易价值正和博弈与‘商业利他定理’
      desc: 从主观价值理论出发，证明合法交易必然是双向价值创造：买方感知价值>价格，卖方价格>成本，因此盈利过程即帮人过程。
      role: definition
      src:
      - paper: docs/202303/20230328_008.md
    - 'no': 3
      name: 赚钱主体性：工具/管道观与‘六经注我’
      desc: 确立‘赚钱是自己的事’，将社群、课程、平台降维为‘工具/管道’而非‘彼岸’，主张通过自我悟透（六经注我）实现认知内化与所有权归属。
      role: method
      src:
      - paper: docs/202303/20230328_032.md
    - 'no': 4
      name: 认知重构实操：用户筛选与价值匹配
      desc: 不追求普度众生，而通过筛选‘值得帮’、‘适合’的用户，确保双方价值感知匹配，实现高效利他与商业正向循环。
      role: method
      src:
      - paper: docs/202303/20230328_008.md
      - paper: docs/202303/20230328_012.md
  - 'no': 2
    name: 提问与沟通技术 —— 让他人愿意为你思考
    desc: 本章系统拆解‘好问题’的三大标准与构建方法，揭示提问质量与个人能力的同构关系，传授选择题式提问法，将提问从‘索取’升级为‘讨论’，构建高效的认知协作与社交杠杆。
    nodes:
    - 'no': 1
      name: 低质量提问的典型模式与代价
      desc: 识别‘上下文缺失型’、‘模糊决策型’等蠢问题特征，揭示其暴露提问者懒惰、缺乏诚意、系统思维缺失，导致零回应或无效回应。
      role: motivation
      src:
      - paper: docs/202303/20230328_009.md
    - 'no': 2
      name: 好问题的三大标准与‘提问质量-能力同构定律’
      desc: 定义‘不可搜索、充足背景、讨论姿态’三大标准，论证提问质量直接折射搜索力、系统思维、元认知与执行力，是高绩效人群的核心特征。
      role: definition
      src:
      - paper: docs/202303/20230328_009.md
    - 'no': 3
      name: 选择题式提问法：背景建模与方案预置
      desc: 实操指南：通过‘搜索验证->语境建模（情境/概念/尝试/目标/约束）->方案预置（选择题形式）’三步法，降低回答者认知负荷，传递诚意与努力信号。
      role: method
      src:
      - paper: docs/202303/20230328_009.md
  - 'no': 3
    name: 长期主义与复利思维 —— 坚持即稀缺，时间做朋友
    desc: 本章对比‘机会主义’与‘长期主义’的本质差异，揭示注意力获取的时间门槛定律，论证业务模式对专注的倒逼作用，提供从被动专注转向主动专注的心法与验证案例。
    nodes:
    - 'no': 1
      name: 机会主义陷阱与‘无沉淀’的代价
      desc: 剖析频繁切换赛道‘快速赚钱但无积累’的负向循环，揭示敏锐度无法替代定力，短期现金流无法兑换长期壁垒。
      role: motivation
      src:
      - paper: docs/202303/20230328_011.md
    - 'no': 2
      name: 注意力获取的时间门槛定律：坚持即稀缺
      desc: 核心金句解读：真正的关注源于‘过了这么久你居然还在那里’，时间维度是验证价值的核心变量，初期曝光是噪音，长期存续是信号。
      role: definition
      src:
      - paper: docs/202303/20230328_011.md
    - 'no': 3
      name: 业务模式决定专注可行性：从被动专注到主动专注
      desc: 揭示‘不能轻易撂挑子’的高退出成本业务（如社群）如何客观倒逼长期主义，并完成从‘被逼着专注’到‘主动选择专注’的心理与战略转型。
      role: method
      src:
      - paper: docs/202303/20230328_011.md
    - 'no': 4
      name: 抗压持久力：普通创业者的唯一核心壁垒
      desc: 引入元气森林创始人观点：无技术护城河时，唯一壁垒是‘比对手更能扛、活得更久’；克服自认为克服不了的困难，即构建了壁垒。
      role: extension
      src:
      - paper: docs/202303/20230328_036.md
  - 'no': 4
    name: 创业心法与成长动力 —— 过程即奖赏，使命穿越周期
    desc: 本章深入创业者内心世界，解构‘小而美’生存幻觉，确立‘Always Day 1’的二元状态论，重新定义赚钱与成长的辩证关系，确立‘使命情怀’为穿越至暗时刻的锚点，最终指向‘克服困难后的自己’这一终极动机。
    nodes:
    - 'no': 1
      name: 不存在‘小而美’的稳态：创业生存铁律
      desc: 论证低规模=低抗风险=必放弃；不扩张=持续被打压。生存倒逼必须持续进化做大，不存在舒适区中间值。
      role: motivation
      src:
      - paper: docs/202303/20230328_036.md
    - 'no': 2
      name: 创业状态二元论：要么不做，要么 All in (Always Day 1)
      desc: 一旦启动即进入持续迭代模式，每天被迫解决新问题、不断迭代自我，中间值不存在，兼职/半退休是伪命题。
      role: definition
      src:
      - paper: docs/202303/20230328_036.md
    - 'no': 3
      name: 赚钱与成长的辩证统一：目的即手段，过程即目的
      desc: 重构关系：赚钱是驱动进化的手段，成长（对抗不确定性的能力迭代）才是目的；第一桶金核心价值在于建立‘我也能行’的自我效能感。
      role: definition
      src:
      - paper: docs/202303/20230328_012.md
    - 'no': 4
      name: 非竞争性生存状态与‘过程本身就是奖赏’
      desc: 超越社会比较框架（无竞争感/危机感/嫉妒/自卑/骄傲），以‘独特、有趣、全神贯注、利他’为内在坐标，接纳全谱系体验（含痛苦崩溃），实现奖赏即时化与内置化。
      role: method
      src:
      - paper: docs/202303/20230328_010.md
    - 'no': 5
      name: 激情驱动耐力模型与使命情怀锚点
      desc: 意志力有限易耗竭，唯有‘不挣钱也甘愿做’的激情能穿越死亡谷；金钱边际效用递减，虚无缥缈的使命/情怀具备无限续航力，支撑层层壁垒形成。
      role: method
      src:
      - paper: docs/202303/20230328_012.md
      - paper: docs/202303/20230328_036.md
    - 'no': 6
      name: 人生无常与臣服当下：接纳困难作为礼物
      desc: 认知‘无常’为常态，通过‘瞅了瞅’具象化创伤将恐惧转化为可应对对象，聚焦‘从创伤走出来的自己’提取力量感，实现‘臣服当下，一切最好安排’的心力转化。
      role: extension
      src:
      - paper: docs/202303/20230328_012.md
      - paper: docs/202303/20230328_113.md
  - 'no': 5
    name: 个人商业变现体系 —— 定价、收钱、见识与天赋匹配
    desc: 本章构建从‘不敢收钱’到‘越卖越贵’的完整变现闭环：以天赋优势区匹配业务核心动作降低执行阻力，通过高维见识锚定打破认知天花板，在价值共振中发现被需求定义的价格，确立收费即责任与保护的契约精神。
    nodes:
    - 'no': 1
      name: 天赋优势区：零意志力成本的执行引擎
      desc: 识别‘无需意志力即可日常高频执行’的行为模式（如社交、写作），将其映射为业务核心动作（如销售、内容营销），实现高绩效低阻力执行。
      role: method
      src:
      - paper: docs/202303/20230328_012.md
    - 'no': 2
      name: 价值共振定价观：价格源于外部需求的‘发现’
      desc: 价值非自我定义，而通过高频、多元客户碰撞被‘需要’而确立；提供者视角的‘小菜一碟’与需方‘改变命运’的价值鸿沟即定价空间与底气来源。
      role: definition
      src:
      - paper: docs/202303/20230328_012.md
    - 'no': 3
      name: 见识溢价效应：格局由见识上限决定
      desc: 高价格信心源于亲眼目睹高阶商业模式/定价锚点；主动付费购买见识（认知更高阶案例）是打破认知天花板、实现格局跃迁的最短路径。
      role: method
      src:
      - paper: docs/202303/20230328_012.md
    - 'no': 4
      name: 收费边界设定协议：收钱即责任与保护
      desc: 打破‘收钱=不好意思’心理卡点：收费建立责任契约倒逼专业交付，同时防止‘白嫖’导致心理内耗，建立标准化收费流程与话术管理预期。
      role: method
      src:
      - paper: docs/202303/20230328_012.md
    - 'no': 5
      name: 阶段性权重分配策略：起步重信心、稳定重成长、富足重筛选
      desc: 动态调整‘赚钱权重’与‘成长权重’：起步期重赚钱建立信心，稳定期重成长追求自我实现，富足期重筛选只赚对的钱拒绝反噬。
      role: extension
      src:
      - paper: docs/202303/20230328_012.md
  - 'no': 6
    name: 欲望即货币 —— 设计驱动行为的微观经济模型
    desc: 本章提出‘欲望即货币’本体论，构建‘葫芦岛’家庭微观经济模型，通过发行货币（锚定欲望）、设定分级工资规则（政策性倾向）、垄断欲望渠道（强力管理）构建闭环，揭示该模型在家庭教育、企业管理、商业平台、游戏设计、国家治理中的普适性与财富转化套利原理。
    nodes:
    - 'no': 1
      name: 核心本体论：欲望是行为唯一能量源与货币内在面值
      desc: 论证外部强加作用力（说教/棍棒/恐惧）不可持续，唯有内生欲望驱动长久习惯；货币力量源于绑定的欲望，万物皆可为货币。
      role: definition
      src:
      - paper: docs/202303/20230328_094.md
    - 'no': 2
      name: 葫芦岛家庭经济模型三步法：发行-工资-垄断
      desc: 实操闭环：1.发行货币（积赞卡片，仪式感/防伪/记账）；2.分级工资规则（12项任务、难度定价、政策性倾向引导结构）；3.强力管理（物理切断非法满足渠道、打击‘0元购’），确立合法劳动换货币唯一通道。
      role: method
      src:
      - paper: docs/202303/20230328_094.md
    - 'no': 3
      name: 货币机制普适性：从家庭到国家、游戏、商业平台的跨域验证
      desc: 验证模型适用于一切有生命系统：国家治理（产业政策）、企业管理（激励）、游戏设计（虚拟经济让人上瘾）、商业平台（货币化用户欲望驱动免费劳动变现纸钞）、动物训练（香蕉/小鱼/荣誉奖章）。
      role: extension
      src:
      - paper: docs/202303/20230328_094.md
  - 'no': 7
    name: 体制内副业突围 —— 以生活为切入点，以IP为杠杆，以合规为底线
    desc: 本章基于体制内幼教工作者实战复盘，提炼‘合规底线×生活兴趣×持久行动×开放分享×心理建设’的破圈自洽公式，详细拆解免费社群转付费、咨询阶梯定价、熟人屏蔽分组、每日复盘坚持、跨圈层主动暴露、航海跟随试错等可复制微操作方法论。
    nodes:
    - 'no': 1
      name: 体制内副业合规底线：硬约束下的生存空间
      desc: 确立‘不触碰红线、不利用职务资源、不经手熟人生意’三条红线，将工作范围内咨询设为免费，物理隔离副业与主业利益冲突，为副业合法合规生存筑基。
      role: definition
      src:
      - paper: docs/202303/20230328_114.md
    - 'no': 2
      name: 下班后8小时变现论：生活兴趣作为天然解耦切入点
      desc: 主张从装修、育儿、健身、美食等生活领域切入：人人具备体验感、易产出真实内容、与本职工作天然正交无利益冲突，领导无法干涉，心理包袱最小。
      role: motivation
      src:
      - paper: docs/202303/20230328_114.md
    - 'no': 3
      name: 熟人屏蔽分组法：消除‘不敢发朋友圈’的心理物理双重隔离
      desc: 微信好友仅分‘看广告/不看广告’两组，犹豫者归入不可见组，发副业内容仅勾选可见组，物理隔离熟人视线，心理卸下包袱，实现隐形分发。
      role: method
      src:
      - paper: docs/202303/20230328_114.md
    - 'no': 4
      name: 免费社群向付费社群转型模型与咨询阶梯定价法
      desc: 低风险验证路径：免费积累信任内容 -> 付费门槛筛选高意向（99/年起步） -> 内容迭代服务升级逐步提价；咨询定价迭代：免费->红包随意->199/h->999/3h标准化包，验证支付意愿锚定价值倒逼专业化。
      role: method
      src:
      - paper: docs/202303/20230328_114.md
    - 'no': 5
      name: 每日复盘坚持法与跨圈层主动暴露：零成本获取顶流背书
      desc: 承诺日更（少20字多2000字）不断更600+天，利用时间复利积累真实轨迹吸引同频人群及大佬围观背书；主动向目标圈层大佬展示成果（高质量评论/私信分享/毛遂自荐）利用价值交换换取背书流量认知对齐。
      role: method
      src:
      - paper: docs/202303/20230328_114.md
    - 'no': 6
      name: 航海跟随试错法：新手低成本跑通0-1积累可迁移核心技能
      desc: 利用社群航海/陪跑营机制，低成本跟随成熟项目实操（TikTok/知乎好物/小红书），不求单次大赚，只求跑通流程、积累网感/剪辑/写作等可迁移核心竞争力。
      role: method
      src:
      - paper: docs/202303/20230328_114.md
  - 'no': 8
    name: 自我关怀与关系重构 —— 无Gap也能深度成长，去滤镜看清人心
    desc: 本章提出‘Self-Caring Year’范式：无需职业间歇期，通过基础技能锚定、高价值议题聚焦、作品化产出、全维体检创伤疗愈、关系去滤镜化分层边界五大维度系统性投入，实现‘脱胎换骨’级蜕变。
    nodes:
    - 'no': 1
      name: Self-Caring Year五步法：技能-议题-作品-身心-关系飞轮
      desc: 结构化实践：1.核心基础技能锚定（面向人的写作）；2.高价值议题聚焦（内向者发展、AI）；3.基于技能的作品化产出（精华帖/专栏/开源）；4.全维体检与创伤疗愈（心理咨询+童年再叙事）；5.关系去滤镜化审视与分层边界管理。
      role: method
      src:
      - paper: docs/202303/20230328_113.md
    - 'no': 2
      name: 童年创伤再叙事疗法：解开防御、拓宽认知、回收天赋
      desc: 在专业框架下系统梳理童年关键事件 -> 识别卡住的防御模式 -> 重新叙事解开防御 -> 拓宽认知模式 -> 回收被忽视的天赋优势，完成创伤整合与人格重构。
      role: method
      src:
      - paper: docs/202303/20230328_113.md
    - 'no': 3
      name: 关系去滤镜化与分层边界：基于人格发展的双向匹配
      desc: 剥离血缘/地缘/校缘标签，在‘现实人生与人格发展’维度客观观察个体，三分类决策：双向奔赴（深投入）、需边界（限距离）、有毒（即切断），建立成熟成人关系观。
      role: method
      src:
      - paper: docs/202303/20230328_113.md
  - 'no': 9
    name: 实战复盘与风控应对 —— 无脆弱、无纠结、无内耗，干就完了
    desc: 本章聚焦高不确定性环境下的生存哲学：承认难题常态化与平台风控不可控，建立零内耗心智模型，通过极限压力测试式复盘提炼底层逻辑，在挫折中保持行动力持续前进。
    nodes:
    - 'no': 1
      name: 做事难题必然性与私域资产归属风险
      desc: 认知：做事必遇难题、规模越大难题越大、甚至存在无解难题；私域流量（群/好友/账号）所有权归平台，随时面临被收回风险。
      role: motivation
      src:
      - paper: docs/202303/20230328_033.md
    - 'no': 2
      name: 零内耗行动力：面对挫折的‘干就完了’心法
      desc: 面对群被封、号被封、损失数万好友等重大挫折，不产生脆弱/纠结/内耗，立即接受现实、调整策略、继续前进；团队层面体现为‘完全没有内耗，只有办法和行动’。
      role: method
      src:
      - paper: docs/202303/20230328_033.md
    - 'no': 3
      name: 极限压力测试式复盘法：在自我怀疑中提炼底层逻辑
