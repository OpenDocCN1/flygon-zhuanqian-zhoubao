      desc: 开幕雷击(开头5-10秒冲突)→中间矛盾冲突(N个故事合并节奏紧凑)→结局悬念(高潮/反转处掐断引导充值)；爆款剧拆解为固定开头池/结尾池/N个中间片段池组合排列快速生产10-20条差异化视频。
