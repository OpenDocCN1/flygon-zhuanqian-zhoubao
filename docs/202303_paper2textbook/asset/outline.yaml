    - 'no': 15
      name: 短期择时主观判断：地缘纷争美元贬值预期支撑3月13-17日相对合理买入参考点
      desc: 基于宏观面地缘纷争美元贬值预期及技术面上涨趋势已确立主观判断，预测短期3个月-1年黄金仍有上涨空间，建议关注3月13-17日价格作相对合理买入参考点。
      role: limitation
      src:
