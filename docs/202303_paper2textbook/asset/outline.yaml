- 'no': 4
  chapters:
  - 'no': 1
    name: 见面会/线下聚会 —— 从“听大佬吹牛”到“精准链接高手”
    desc: 本章系统拆解线下商业见面会的全生命周期运营体系：从组局者的精准邀约、沉浸式场域构建、过程控制SOP，到参会者的心态重构、最小阻力社交战术、复盘输出变现闭环。揭示‘免费最贵、付费筛选’、‘手机隔离即专注’、‘小局深度大于大局广度’等反直觉铁律，助你将单次见面会转化为可复制的高ROI社交投资。
    nodes:
    - 'no': 1
      name: 见面会的双刃剑效应与幸存者偏差
      desc: 见面会提供高维认知与情绪价值，但易因幸存者偏差导致新手盲目乐观、频繁切换项目、陷入‘低谷期’；核心对策是‘抬头望天（输入认知）、低头赶路（深耕执行）’双轨分离。
      role: motivation
      src:
      - paper: docs/202303/20230328_028.md
      - paper: docs/202303/Bz45d66zRorMbMx7jzVcbSXIncf.md
    - 'no': 2
      name: 组局者SOP：精准邀约与付费筛选机制
      desc: 通过‘主题钩子+鸽子费(打卡退)+定位费(预付场地)’三重过滤，配合‘全员私聊建立心理契约+精细化导航指引’，将到场率提升至90%+，解决‘到不齐、迟到、不专注’核心痛点。
      role: method
      src:
      - paper: docs/202303/20230328_111.md
    - 'no': 3
      name: 沉浸式场域构建：五感布置与手机隔离协议
      desc: 横幅/举牌/香薰/茶点/纸笔‘五大件’调动五感建立仪式感；‘投票表决+组局者带头+定时休息’软性强制收缴手机，配合‘单一发声规则(嘘声制止)’与‘沙漏计时(5/15/30分钟)’物理保障深度专注。
      role: method
      src:
      - paper: docs/202303/20230328_111.md
    - 'no': 4
      name: 三段式流程设计：破冰-分享-私董会模型
      desc: Step1 模板化自我介绍+刮刮卡破冰(1h)；Step2 投票选题+PPT主题分享(1.5h)；Step3 私董会协作模型：单人15分钟阐述难题→全员轮询献策→组局者教练复盘(指南针/镜子/催化剂/教练四步骤)，单案产出10份定制方案文档。
      role: method
      src:
      - paper: docs/202303/20230328_111.md
    - 'no': 5
      name: 善后转化闭环：现场拍照黄金期与阶梯式产品设计
      desc: 在‘主题分享后、私董会前’人员齐全、获得感最强时抢拍合影发圈；设计‘参会费抵扣3位数产品’与‘参会费膨胀为定金的4位数产品’双档位，配合‘仅此一次’稀缺话术实现现场高转化。
      role: method
      src:
      - paper: docs/202303/20230328_111.md
    - 'no': 6
      name: 普通社恐者参会生存战术：任务锚定与最小阻力路径
      desc: 赛前设定三层KPI(拿龙珠/拿碎片/点赞100)将焦虑转化为任务；赛中‘找角落-开飞书文档-扫码进群-记笔记-扫码加微信’标准化动作包；赛后‘复盘即社交货币’反向吸引被动连接。
      role: method
      src:
      - paper: docs/202303/20230328_115.md
      - paper: docs/202303/AYqUdsawJocJctxI07qc3svTnfg.md
    - 'no': 7
      name: 动机重构：普通性即参会资格与刺激-改变延迟机制
      desc: 反驳‘有资源才配去’：正是因为‘一无所有、社恐普通’才更需参会寻找生活刺激、接近美好生成自信；目标设为‘寻找刺激’而非‘寻求改变’，高密度优质刺激积累至阈值自然触发内生改变。
      role: motivation
      src:
      - paper: docs/202303/AYqUdsawJocJctxI07qc3svTnfg.md
    - 'no': 8
      name: 小规模局效能最大化与最小创业式观察学习
      desc: 4-8人小局保证深度交互、真诚开放、全员参与感，边际收益高于大型局；将参会视为‘最小创业’，观察主持控场、组织流程、互动模式获取隐性组织经验，从微小成功积累自信。
      role: experiment
      src:
      - paper: docs/202303/AYqUdsawJocJctxI07qc3svTnfg.md
    - 'no': 9
      name: 社群标准化同城见面会复盘模板
      desc: 覆盖活动前(场地/人员/交通/公告/预设7大分享主题)、中(分段式议程/记录员/时间把控黄金法则/全员点菜/合影口号/末班车预警)、后(整理记录/收集反馈/致谢)及不足提升(破冰游戏/拍照/主线把控/提前了解背景)的全生命周期标准化操作手册。
      role: method
      src:
      - paper: docs/202303/20230328_099.md
    - 'no': 10
      name: 见面会速记志愿者的高杠杆个人品牌运营
      desc: 利用石墨文档实时协作记录+ChatGPT秒级生成XMind思维导图，实现‘嘉宾话音落、思维导图同步完成’；以‘自我记录+分享+被动引流’闭环，低成本建立专业人设、获取精准私域流量。
      role: experiment
      src:
      - paper: docs/202303/20230328_026.md
    - 'no': 11
      name: 见面会金句提炼与视觉化传播
      desc: 参会者从会议内容提炼核心语录制作壁纸分享，采用飞书文档托管原件、社区发布预览图引导跳转、根据评论反馈迭代更新，验证主动输出促进内化、碎片化载体适配碎片化阅读的双重效用。
      role: method
      src:
      - paper: docs/202303/20230328_030.md
    - 'no': 12
      name: 全国见面会PPT语录壁纸化与社群文化共识构建
      desc: 官方提炼见面会PPT精华制成品牌色壁纸作为日常自省工具，核心覆盖金钱管道论、行动主义三部曲、长期主义心法、心理建设、成长策略；用户共创补充印证‘官方核心+用户共创’内容生产模式。
      role: finding
      src:
      - paper: docs/202303/VEF1dwgsRoVRcIxbDRCcRYvWnKf.md
  - 'no': 2
    name: 知识管理与个人效能 —— 从“囤积焦虑”到“内化进化”
    desc: 本章确立‘使用方便、解决问题’的实用主义知识管理范式，反对工具洁癖与形式主义。提供‘问题导向输入→多维标签组织→分阶段沉淀→定期规整断舍离→实践输出内化’的完整方法论，并配套‘杂学箱缓冲’、‘长文精华提炼’、‘音频转文本’、‘群聊转发聚合’、‘桌面分区可视化’等5大微操作技巧，最终指向‘知识整理即自我进化，让人过得更好’的终极价值。
    nodes:
    - 'no': 1
      name: 实用主义原则：知识管理的唯一标准是‘好用’
      desc: 整理不是为了好看、满足虚荣或追求All in one，而是为了‘使用方便’；工具不重要，解决什么问题才重要；敢于断舍离，容忍系统不完美(多工具协作)、历史包袱(分批迁移)、暂时混乱(杂学箱)。
      role: definition
      src:
      - paper: docs/202303/20230328_023.md
    - 'no': 2
      name: 主观归属与问题导向输入法
      desc: 资料归档位置不由来源(工作/学习)决定，而由个人当前知识结构与认知需求决定；以‘当前面临的具体问题’为锚点去收集知识，而非被动等待灵感，确保知识库与行动强关联。
      role: method
      src:
      - paper: docs/202303/20230328_023.md
    - 'no': 3
      name: 本源概念优先与分阶段学科沉淀
      desc: 面对时效性强的海量资料，优先提炼核心本源概念(树干树枝)而非收集表层信息(叶子)；单一学科按初阶/进阶/高阶/实践四维分层记录，匹配认知负荷。理论与实操融合存储，勿分离。
      role: method
      src:
      - paper: docs/202303/20230328_023.md
    - 'no': 4
      name: 多工具协作生态与标签关联多维归类
      desc: 摒弃单一工具洁癖：飞书/Notion沉淀、flomo随记、云盘存大文件；一份资料隶属多类时打多标签或建双向链接关联多文件夹，支持多维检索。
      role: method
      src:
      - paper: docs/202303/20230328_023.md
    - 'no': 5
      name: 定期规整与断舍离机制：帕累托迁移策略
      desc: 周/月节奏整理杂学箱、合并标签、清理低价值资料；历史遗留数据采用‘新资料统一平台+旧资料按优先级分批迁移(50%低优先级就地封存)+平时用时搬运’策略，随时间推移高价值自动浮现、边角料自然沉底。
      role: method
      src:
      - paper: docs/202303/20230328_023.md
    - 'no': 6
      name: 内化转化闭环：整理≠掌握，需经回顾-记忆-实践-输出
      desc: 知识所有权转移必须经历‘回顾、记忆、实践、输出’四阶段；知识管理过程即自我进化过程，终极目的是‘让人过得更好’。长文仅存核心总结+原文链接，平衡密度与效率。
      role: definition
      src:
      - paper: docs/202303/20230328_023.md
    - 'no': 7
      name: 音频/群聊/桌面等碎片信息的结构化捕获流
      desc: 听书/播客：手机录音→飞书妙记转文本→入库；群聊：建专用转发群→每日固定频次集中处理；桌面：分区壁纸工具预设框架→高频文件先安放→其余按图索骥。
      role: method
      src:
      - paper: docs/202303/20230328_023.md
    - 'no': 8
      name: 参考架构不可照搬与囤积不等于拥有的认知偏差
      desc: 只能参考他人架构不可照搬，只有自己最清楚需要什么信息；不整理会导致重复收集，虚假‘拥有感’阻碍真实内化；定期规整能强制更新认知、合并同类项。
      role: limitation
      src:
      - paper: docs/202303/20230328_023.md
  - 'no': 3
    name: 时间管理与习惯养成 —— 从“碎片技巧”到“原则驱动的长期迭代”
    desc: 本章对比‘直接套用技巧’与‘原则先行’两条路径，主张受达里奥《原则》启发：先立核心原则(单位时间产出最大化)，再经10年+实践迭代自然涌现简单有效的体系。配套‘21天定律-持续航海’高强度训练营模式，通过‘全手册精读+高手复盘+全勤打卡+多渠道强制输出’将外部约束转化为内驱习惯，治愈精神内耗，实现过程目标(打满卡)对结果目标(变现)的反向保护。
    nodes:
    - 'no': 1
      name: 原则先行的时间管理范式 vs 知行差距
      desc: 受《原则》影响：先建立核心原则(时间不可再生，单位产出决定成败)，再在原则基础上逐步构建优化实践，10年长周期迭代自然涌现‘简单而有效’体系；区别于学习大量‘正确但空泛’理论导致的知行差距。
      role: definition
      src:
