    - 'no': 5
      name: 沉浸式预剪辑法：通看剧情建立心智模型是高爆款率核心原因
      desc: 剪辑前花1-2小时完整通看剧情梗概，精准定位情绪点(愤怒/吃惊/暧昧/争执/雷人/狗血/误会)保证叙事连贯，作者认为这是其爆款率高的核心原因之一。
