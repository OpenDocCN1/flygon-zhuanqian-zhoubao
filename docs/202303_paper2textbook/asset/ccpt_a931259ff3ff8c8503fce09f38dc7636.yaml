paper: docs/202303/20230328_133.md
desc: 该素材为三林在2023年3月分享的关于ChatGPT第三方浏览器插件生态的观察报告，梳理了提示语模板类与效率工具类两大类产品形态，阐述了浏览器插件作为网页端增强形态的产品合理性，并提炼了五大核心认知：从面向Google编程转向面向ChatGPT编程、Prompt作为核心密码与财富密码、单句Prompt等同Mini
  Tool与一套Prompts等同Mini SaaS的产品范式、业务场景赋能思维，以及基于原生体验与内容安全考量的出海创业建议。
concepts:
- name: 浏览器插件增强范式
  desc: 指利用浏览器插件对ChatGPT官方网页版进行体验增强的产品形态，贴合用户现有使用习惯，弥补原生产品不足，属于站在巨人肩膀上的增量创新。
  is_original: false
  excerpt:
  - 因为 ChatGPT 官方是一个网页版，浏览器插件是对网页的 Enhance，在用户熟悉的场景下做的体验升级，贴合用户习惯，乐于使用。这弥补了原生产品的不足，相当于站在巨人肩膀上做事。
- name: 提示语模板类插件
  desc: 以预设高质量Prompt为核心功能的浏览器插件产品类别，帮助用户降低提示词编写门槛，快速获得专业输出。
  is_original: false
  excerpt:
  - 本文提到了十来款浏览器插件，包括两大类：提示语模板类，和效率工具类（附图）
- name: 效率工具类插件
  desc: 集成特定工作流（如总结、翻译、代码辅助等）的浏览器插件产品类别，通过封装Prompt与上下文交互提升特定场景下的生产效率。
  is_original: false
  excerpt:
  - 本文提到了十来款浏览器插件，包括两大类：提示语模板类，和效率工具类（附图）
- name: Prompt即密码/财富密码
  desc: 将Prompt（提示词）视为驱动ChatGPT这一‘魔法百宝箱’的核心钥匙，掌握高质量Prompt即掌握了流量入口与商业变现能力。
  is_original: true
  excerpt:
  - ChatGPT 是魔法百宝箱，密码就是 Prompts，这是流量密码，也是财富密码。
- name: Prompt即产品范式
  desc: 一种极简产品定义范式：单条优质Prompt等价于一个微型工具，一组系统化Prompts等价于一个微型SaaS产品，强调产品构建的核心在于Prompt工程而非重代码开发。
  is_original: true
  excerpt:
  - 一句 Prompt 等于一个 Mini tool，一套 Prompts 等于一个 Mini SAAS
- name: 面向ChatGPT编程
  desc: 开发者工作范式的根本转变：不再主要通过搜索引擎检索代码片段，而是直接通过自然语言Prompt指令大模型生成、重构、解释代码。
  is_original: true
  excerpt:
  - 从面向 Google 编程，到面向 ChatGPT 编程；相信开发者圈友们感受很深。
methods:
- name: __overview__
  desc: 采用生态观察法与产品复盘法，通过收集十余款第三方Chrome插件样本，按功能分类（提示语模板类/效率工具类），分析其产品定位与交互体验，归纳提炼底层产品逻辑与创业认知。
  excerpt:
  - 我来分享一些围绕 ChatGPT 而做的第三方浏览器插件产品，他们是如何做的产品定位和一些体验思考。
  - 本文提到了十来款浏览器插件，包括两大类：提示语模板类，和效率工具类（附图）
  - 总结，我从这些产品里我学到的认知：
theorems:
- name: 浏览器插件为大模型应用最佳切入形态论
  desc: 在大模型官方仅提供网页版的早期阶段，浏览器插件因其原生增强属性、零迁移成本、贴合用户习惯，是第三方开发者介入生态、构建增量价值的最优产品形态。
  excerpt:
  - 为什么说浏览器插件是一个合适的产品形态？因为 ChatGPT 官方是一个网页版，浏览器插件是对网页的 Enhance，在用户熟悉的场景下做的体验升级，贴合用户习惯，乐于使用。这弥补了原生产品的不足，相当于站在巨人肩膀上做事。
- name: Prompt工程即产品构建核心论
  desc: 在大模型能力开放的背景下，应用层产品的核心竞争力从代码实现转移至Prompt工程设计，产品形态可定义为Prompt的组合与封装。
  excerpt:
  - ChatGPT 是魔法百宝箱，密码就是 Prompts，这是流量密码，也是财富密码。
  - 一句 Prompt 等于一个 Mini tool，一套 Prompts 等于一个 Mini SAAS
- name: 开发者范式迁移论
  desc: 大模型的出现引发了开发者核心工作流的根本性迁移，核心技能从‘检索与拼装’转向‘意图表达与验证’。
  excerpt:
  - 从面向 Google 编程，到面向 ChatGPT 编程；相信开发者圈友们感受很深。
- name: 出海创业必要性论
  desc: 受限于国内原生体验访问限制、内容安全合规要求及支付体系差异，基于ChatGPT生态的创业项目应优先面向海外市场（出海）以获取更优的生存与发展空间。
  excerpt:
  - 鉴于原生体验、内容安全，建议创业者们出海，这也是我们做英文工具站的意义。
findings:
- name: 早期生态产品分类现状
  desc: '[evidence] 通过对十余款第三方插件的观察，发现早期ChatGPT浏览器插件生态主要聚集在‘提示语模板类’与‘效率工具类’两大品类，验证了应用层初期以Prompt封装与工作流嵌入为主的产品演进路径。'
  excerpt:
  - 本文提到了十来款浏览器插件，包括两大类：提示语模板类，和效率工具类（附图）
- name: 官方Plugins与第三方插件形态区分
  desc: '[claim] 作者明确区分了第三方浏览器插件与OpenAI官方开放的Plugins能力，指出两者为完全不同的技术形态与生态层级，官方Plugins将引发更大波澜（波澜壮阔），暗示第三方浏览器插件可能面临被官方原生能力替代或重塑的风险。'
  excerpt:
  - 注：这里的「插件」不是今天凌晨 ChatGPT 开放的插件能力 Plugins ，而是指以 Chrome 为主的浏览器插件。 新的插件 Plugins 波澜壮阔，我后续再写下一篇。
