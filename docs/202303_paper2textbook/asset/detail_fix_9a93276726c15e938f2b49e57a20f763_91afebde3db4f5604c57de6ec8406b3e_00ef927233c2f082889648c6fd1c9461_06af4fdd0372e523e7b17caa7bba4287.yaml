  - '- 持续航海：以21天为最小周期单元，连续多期（作者11期）复利累积，将外部约束转化为内驱习惯的长期主义策略'
  - '- 21天定律：心理学习惯养成理论，作为航海周期设计的底层逻辑，单次养成升级为长期人生策略'
