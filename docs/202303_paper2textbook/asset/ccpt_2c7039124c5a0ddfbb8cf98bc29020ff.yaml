paper: docs/202303/20230328_017.md
desc: 该素材是一篇关于提升“搜商”（搜索解决问题能力）的短文，作者Jerry提出搜商由搜索心法（搜什么）、搜索渠道（去哪搜）、搜索技术（怎么搜）三大核心构成，主张通过提升搜索技能获取知识广度，配合资料整理获得知识深度，从而在信息超载时代高效解决问题。
concepts:
- name: 搜商
  desc: 定义为通过搜索技能解决问题的能力，是信息超载时代个人获取知识宽度、站在前人智慧肩膀上解决问题的核心竞争力。
  is_original: true
  excerpt:
  - 搜商就是通过搜索技能解决问题的能力。
  - 搜索使人类第一次可以最大程度的站在无数前辈智慧的基础上去解决问题。
- name: 搜商三大核心
  desc: 构成搜商的三个维度：搜索心法（确定搜什么）、搜索渠道（确定去哪搜）、搜索技术（确定怎么搜），对应评论区总结的‘搜什么、去哪搜、怎么搜’。
  is_original: true
  excerpt:
  - 搜商有三个核心:搜索心法、搜索渠道和搜索技术。
- name: 资料整理与搜索技能的互补关系
  desc: 资料整理提供知识的逻辑与深度，搜索技能提供知识的宽度，两者结合构建完整知识体系。
  is_original: true
  excerpt:
  - 资料整理可以让你拥有知识的逻辑与深度，搜索技能可以让你拥有足够的知识宽度。
methods:
- name: __overview__
  desc: 提升搜商的整体方法论，包含掌握搜索心法、拓展搜索渠道、精进搜索技术三个层面，旨在通过系统性提升搜索效率实现时间复利。
  excerpt:
  - 搜商有三个核心:搜索心法、搜索渠道和搜索技术。
  - 如果我们能够提升一下搜索的效率，长远来看，每天给我们节省的时间复利也是不小滴。
theorems:
- name: 搜索是站在巨人肩膀上的最高效路径
  desc: '[claim] 搜索使人类首次能最大程度站在无数前辈智慧基础上解决问题，是知识获取的杠杆。'
  excerpt:
  - 搜索使人类第一次可以最大程度的站在无数前辈智慧的基础上去解决问题。
- name: 搜索效率提升具有时间复利效应
  desc: '[claim] 每日微小的搜索效率提升，长期积累将产生显著的时间复利收益。'
  excerpt:
  - 如果我们能够提升一下搜索的效率，长远来看，每天给我们节省的时间复利也是不小滴。
findings: []
