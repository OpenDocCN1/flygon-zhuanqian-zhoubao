  name: 小步快跑MVP模型 —— 用70分内容抢占先发红利
  points:
  - '**为什么需要这个概念？**'
  - '- 完美主义导致迟迟不发布，错失热点时间窗口与平台算法红利'
  - '- 早期无成熟产品、无标准SOP，预设完整产品属于伪需求'
  - '- 需要一种‘以市场验证代替主观臆断’的低成本试错机制'
  - '**核心定义**'
  - '- 核心主张：速度 > 质量（早期），先用70分及格内容跑通‘流量-产品-变现’最小闭环'
  - '- 产品动态生成：不预设完整产品，先跑流量，根据用户咨询‘现场制造’最小变现单元（如围观群），再反向沉淀标准化产品'
  - '- 验证标准：能否在极短周期（如3天）内完成获客→转化→交付→收款全链路'
  - '**关键性质**'
  - '- 热点驱动：针对时效性强的红利窗口（如ChatGPT爆发期），先发优势决定流量上限'
  - '- 信任变现：早期无产品时，IP信任是核心支付担保，‘粉丝信任你，卖空气都行’'
  - '- 迭代进化：以市场数据为导向，在正向反馈中持续优化产品形态与交付标准'
  - '**典型例子**'
  - '- 作者3天：账号改造→AI生成口播文案→全平台分发→私域引流50人→围观群成交10单'
  - '- 视频数据起来后‘顺带推出’围观群，无完整产品/话术仍成交，验证信任溢价'
  - '**边界条件**'
  - '- 仅适用于高不确定性、低试错成本、强时效性的早期探索阶段'
  - '- 70分非偷工减料，而是‘核心价值到位、非核心可简’的工程化取舍'
  - '- 后期必须迭代为标准化SOP，长期依赖‘卖过程’不可规模化'
  sources:
  - paper: docs/202303/RebJdOMkCo0VY4x24IYcgjxpnue.md
    role: origin
  - paper: docs/202303/20230328_110.md
    role: apply
  excerpts:
  - 当时的判断是速度的重要性高于质量
  - 先跑起来再说...接下来第三步也是最关键的，就是如何去执行并为付费的会员持续提供服务
  - 自己拍摄和剪辑花了2个小时左右，觉得差不多达到了70分的水平，我就没有再纠结了。然后各个平台开始分发...
  - 第一天视频数据起来以后，有人咨询我的时候，我就顺带推出了围观群这个第一个不算产品的产品
  - 直到这个时候我还是没有一个完整的产品或者服务...陆续就有粉丝付费围观我的整个过程了
  - 当粉丝信任你的时候，哪怕你什么都没有，哪怕“卖空气”都行
  - 通过 3 天的时间吸粉 1400+，引流私域 50 人，在没有具体产品的情况下，成交转化 10 人完成变现 MVP
