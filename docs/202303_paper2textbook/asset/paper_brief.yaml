docs/202303/BOnrd0uMWoINRrx9BcCcJEh5nRg.md: '# 零基础也能批量产出高质量带货视频，超强视频批量剪辑软件！  > 来源：[https://bh5pm72xfy.feishu.cn/docx/BOnrd0uMWoINRrx9BcCcJEh5nRg](https://bh5pm72xfy.feishu.cn/docx/BOnrd0uMWoINRrx9BcCcJEh5nRg)  #
  前言  ## 个人简单介绍  圈内一般都叫我“铲哥”，认识我的朋友应该都知道，我之前是做视频批量剪辑软件的，并带领一些学员做出不错的成绩。  下面这几款软件，相信很多圈友应该都用过，铲子哥的称呼也是由此而来，寓意：为掘金者提供铲子  ![](img/18d986d9cbff327565a9fd407c7d1e83.png)  ##
  批量剪辑软件的优势  大多数的人做带货，第一想法就是做搬运，但是现在各个平台的查重系统都相当强大，与其天天去研究各个平台的查重规则和平台去对抗，我们不如直接批量做原创视频。  无论做任何平台，做不起来的无非就一种情况，那就是发的内容太少了，妄‮靠想‬三五个作品‮立就‬竿见影，那多少有点痴心妄想。  你花了一整天的时间才做了几个视频'
docs/202303/Bz45d66zRorMbMx7jzVcbSXIncf.md: '# 【新人参加见面会后必读】如何正确利用见面会获得的信息？  > 来源：[https://y2mt3o47i3.feishu.cn/docx/Bz45d66zRorMbMx7jzVcbSXIncf](https://y2mt3o47i3.feishu.cn/docx/Bz45d66zRorMbMx7jzVcbSXIncf)  大家好，我是郭晓文，江湖人称最懂新手的男人。  也是写过9篇精华帖的三届老生财圈友。  还是参加过四次生财有术线下见面会，接下来大概率还会一直参加的男人。  *
  * *  我本来很想和大家分享一下我这次参加见面会的收获。  但，这两天脑海里，浮现出自己还是创业小白时，参加见面会后，没能正确的利用从见面会上获得的信息，然后踩了大坑的经历。  并且，同样的坑，好几个当时一起参加的小伙伴，都相继踩了。  今天，就和大家分享一下我当时的经历。  简单来说，就是：  「当时第一次参加见面会后，我和几个小伙伴跟打了鸡血一般，觉得未来可期，觉得自己仿佛能改变世界。  但结果却是，回来后都经历了好几个月的低谷期。」  如果你也是这样的状态，希望，今天的分享，能帮大家正确的看待见面'
docs/202303/GhbsdeUAeo0lWdxwqcecdwx0nuh.md: '# 通过ChatGPT，帮我在知乎上自动卖货  > 来源：[https://aqoyanyhfa.feishu.cn/docx/GhbsdeUAeo0lWdxwqcecdwx0nuh](https://aqoyanyhfa.feishu.cn/docx/GhbsdeUAeo0lWdxwqcecdwx0nuh)  #
