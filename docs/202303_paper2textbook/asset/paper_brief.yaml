docs/202303/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf.md: '# 进生财8个月，翻遍了所有的精华帖，盘点拆解生财的赚钱方法！  > 来源：[https://yqqb1l50gj.feishu.cn/docx/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf](https://yqqb1l50gj.feishu.cn/docx/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf)  大家好，我是杨洋。从2014年起就在做一件事，医药圈职业教育培训，从业务做到招商经理，再到公司合伙人，最终因为公司业务线下滑离开这个行业。  去年7月份加入生财。在教育培训这行业里边，基本上把成人学历的模式和会遇到的坑都了解，独立策划了健康管理师证书项目，从证书立项，到分发代理，收学员资料上报，完成报名，拿到证书的整个环节均有参与。有证书项目上的问题可以随时交流。  同时教育培训行业网课项目，从课程录制，到技术搭建，小程序，APP制作，课程分销模式的搭建，代理合作招商模式，OEM招商逻辑，出品自己的网课品牌整个流程及具体实操办法都可以交流。  我们的网课搭建从18年做了OEM模式合作，18年营业额700万，19年营业额1200万，20年营业额1500万。而这个'
docs/202303/ODcddHpnqoogiuxw7WqcMbv1nJb.md: '# 在这个追求效率的时代，我推荐你试试「双拼」  > 来源：[https://yqst.feishu.cn/docx/ODcddHpnqoogiuxw7WqcMbv1nJb](https://yqst.feishu.cn/docx/ODcddHpnqoogiuxw7WqcMbv1nJb)  「
  输入法也可以更有效率吗？」  输入法在云猫心目中只是基本的输入工具，只要会拼音就会打字。  大部分输入法也都这种实现方式：  安装完成就能开始打字，虽然简单方便，但跟「高效」还是有一段距离。  当云猫听说在基础不过的打字能使用「双拼」提高效率的时候，疑问在脑中出现：  「双拼」如何提升效率？是否上手很麻烦？有什么输入软件可以支持？  ##
  一、 简化的敲击次数，让效率有提升  双拼输入法比起全拼输入法的优势，在于「敲击次数」上。  和全拼相比，双拼把一个字的「声母」和「韵母」拆分开来；  把每个字的声母韵母分别对应到一个特定的按键上；  使得所有字的拼音只需要「敲击两个字母」就能达到全拼的效果。  ![](img/5cfd64e2bce82c6201f3b199b7c3fd1d.png)  如上'
docs/202303/OZ53d6t4vovziPxkUyZc8qrNnjc.md: '# 如何从现象级mmorpg类游戏中挖掘变现机会  > 来源：[https://fgsd3oxjki.feishu.cn/docx/OZ53d6t4vovziPxkUyZc8qrNnjc](https://fgsd3oxjki.feishu.cn/docx/OZ53d6t4vovziPxkUyZc8qrNnjc)  大家好，我是姚麻。好久没有在生财分享啦，寻思着马上杭州见面会了，高低也得刷刷存在感。  索性今天就跟大家简单聊一下，当市面上出现了现象级mmorpg（大型多人在线角色扮演类）游戏，以即将公测的逆水寒手游为例，看看有哪些切入点可以去做变现。  先跟不怎么玩游戏的圈友解释一下，所谓mmorpg游戏，可以理解为就是【玩一个角色，打怪、升级、升属性的养成之路，可以和其他玩家交流、下副本、PK等等】。  从最初的魔兽世界、问道、征途、天龙八部，到后面的天涯明月刀、剑灵、九阴真经、龙之谷、逆水寒等等，这些都算是mmorpg类型。  熟一点的朋友都知道，我人生的第一桶金，就是大学时期玩天涯明月刀（端游）来的，20年出手游的时候，又整了小几十个。  而到了6月30号的时候，逆水寒的手游会开'
docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md: '# 0基础理财小白、普通人如何投资（买）黄金  > 来源：[https://orzymotr6n.feishu.cn/docx/PCa9dFWnconYupxUf7bcAxghnwc](https://orzymotr6n.feishu.cn/docx/PCa9dFWnconYupxUf7bcAxghnwc)  首先呢，大家一定要明确自己买黄金的目的。你是怕黄金一再涨价，想去买一个黄金手链，黄金首饰，作为装饰品，送给自己或者是亲人伴侣。还是说，你目前看好黄金的价值，想买“黄金”作为投资产品。这完全是两个概念，大家一定要分清楚。  ![](img/5b6da9e3677b18953e525df99c37d502.png)  不要去某某生，某某福买了条黄金项链，黄金手镯就觉得自己在投资，那肯定不是这样子的。  当然你也可以既做黄金的投资，也买黄金的饰品，毕竟黄金的首饰相比其他珠宝保值效果还是非常好的，而且这几年，黄金的外观也越来越时尚。大家还是比较喜欢的。  好了，那么回归正题。我先说，黄金的首饰，大家要怎么买？  很多人一听到怎么买黄金首饰，第一反应肯定是想到去知名的旗舰店买。但是有时候'
