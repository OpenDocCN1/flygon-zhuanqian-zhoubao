  据说袁世凯要复辟前，他身边的人每天都给他看报纸，每份报纸对他都是赞美之词，拥护他称帝。结果袁大头一上台，很快就引发各方面的反对，形成了护国运动，登基 83 天后被迫撤销帝制，仓皇下台，后很快死于河南安阳。
  其实身边的人，每天给他看的都是假新闻，假报纸。 当然我觉得员工和老板的关系不太可能像袁世凯的君臣关系，这有点过于刺激了，不过能与老板掏心掏肺的员工，也并不是太多。不光是老板和下属之间，即使同僚之间，也不可能都说真话。这就造成一个问题，老板可能不知道员工都在想啥。很可能下面闹开锅了，老板还不知道。
  这就需要你努力了解公司的'
