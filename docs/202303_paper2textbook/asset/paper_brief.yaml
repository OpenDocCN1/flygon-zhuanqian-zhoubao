docs/202303/AYqUdsawJocJctxI07qc3svTnfg.md: '# 最普通社恐女生如何无负担参加生财见面会  > 来源：[https://ug7xugb19s.feishu.cn/docx/AYqUdsawJocJctxI07qc3svTnfg](https://ug7xugb19s.feishu.cn/docx/AYqUdsawJocJctxI07qc3svTnfg)  这是一篇相对来得比较迟的作业，周六参加完见面会，现在才提交作业。  这么晚提交是有原因的。  也许我的这个分享对生财的大多数人都没有帮助，因为他们已经过了这个阶段，站在高山的顶端。所以，大佬如果你不小心点开了，没关系，直接滑到底部点个赞就好了，内容可以绕过的。  我就在想，有没有还有人和我一样，一样可能连山脚都还没达到的人，如果恰好，你是，那么我认为这个复盘还是值得一看的。  越分享越幸运，但我又想，总不能只是写一些口水话吧，总要问问龙珠吧，没有龙珠也要问问碎片吧？  所以，我就直说吧，我写这个是有
