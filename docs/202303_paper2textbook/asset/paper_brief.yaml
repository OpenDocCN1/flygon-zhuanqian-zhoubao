  (38 赞)《如何在领英开发客户？》   作者： 队长   日期：2023-03-20   如何在领英开发客户？(领英用户大部分都是老板和职场人，用户价值比较高)   大家好，我是队长，目前经营两家小公司，一家传统外贸，一家亚马逊，是一个带着自媒体基因的外贸人,目前在领英接到的订单每年大致在三百来万美金，包括返单和新开发的客户下单，不要觉得三百万美金很多，这是销售额而已，给中间商和零售商供货，这个业绩也就一般，不过对于我们小公司来说还不错   最初接触领英的时候，我只是把它当成寻找客户买手和对应邮箱的工具，只要知道公司名，就可以在领英上毫不费力的知道这个客户的人事架构，也就是外贸人最喜欢的买手信息，知道了买手的名字，再结合已知的域名信息和其他人的邮箱格式，可以轻松推断出买手的邮箱，那么就可以套用传统外贸那一套开发这个客户了'
