docs/202303/AoT0dlRipo0RN6xDSo3cdckpnyf.md: '# 我是如何用一枚二维码引爆IP流量的？——艺术二维码  > 来源：[https://tgxl0sxo7f.feishu.cn/docx/AoT0dlRipo0RN6xDSo3cdckpnyf](https://tgxl0sxo7f.feishu.cn/docx/AoT0dlRipo0RN6xDSo3cdckpnyf)  大家好我是吉果，一个插画师，生财透明人。最近新增加了一个标签，艺术二维码设计师。  增加这个标签的起因是我整理图片翻出了以前给自己设计的艺术二维码，当天的朋友圈不知道发什么，就把艺术二维码的图片发出去了。  然后这张艺术二维码，让我见识到了什么叫著名圈友梁靠谱的影响力，什么叫表达者红利，什么叫一键引流，什么叫圈层的重要性，什么叫我被大佬加微信的慌张。  一个小小的二维码，也能玩出花样帮助引流。  本文除了介绍艺术二维码的引流功能，也会分析购买使用艺术二维码的优缺点。因为这也是我在做艺术二维码经历中的真实感受，分享给大家做个参考。  ##
