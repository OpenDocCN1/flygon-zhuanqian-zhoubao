  (33 赞)《以经济学方式解决家庭教育难题为例，欲望是一切目标的货币》   作者： 南侠 1987   日期：2023-03-21   家庭教育，自古以来就是是超级难题，即便权势遮天的帝王将相、千亿资产的巨富豪门，也都对此很头疼痛苦，因儿女不成器而导致很快就败光家产，甚至满门抄斩、王朝覆灭，古今中外都有无数事例。   就拿现今来说吧，事业很成功但家庭教育失败，轻则事业无法传承、职业世家后继无人，中则下一代难免阶层跌落家道中落，毕生心血建立起来的事业毁于一旦，还有许多父母像李刚、李双江、成龙、张国立那样被坑爹，终生蒙羞抬不起头，甚至像令
  ji 画那样因儿女导致整个庞大家族、派系覆灭。   好的家庭教育，最差也能让小孩成为开朗活泼、习惯优良的优秀青年，一般的也可以成为把事业发扬光大、让家族更上'
