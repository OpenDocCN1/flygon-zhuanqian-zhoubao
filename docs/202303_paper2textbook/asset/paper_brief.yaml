docs/202303/MwIYdeZNio8bWUxAEGCcOhO2nlc.md: '# 短剧cps，小白也能月入过万的蓝海项目  > 来源：[https://g6oie6h368.feishu.cn/docx/MwIYdeZNio8bWUxAEGCcOhO2nlc](https://g6oie6h368.feishu.cn/docx/MwIYdeZNio8bWUxAEGCcOhO2nlc)  大家好，我是清欢~  最近在做短剧cps项目，目前做了将近1个月，变现1w＋。  发了40多个视频，爆了十几个，视频发布比和爆款产出比将近2:1，  也就是说基本上发2-3个视频，就有一个爆款产生。  秉着越分享越幸运的原则，今天来分享一下我的实操经验，  希望对想入局的小伙伴有些启发。  ###
