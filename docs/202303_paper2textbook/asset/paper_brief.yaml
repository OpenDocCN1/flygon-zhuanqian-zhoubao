docs/202303/HZ2RdrAmXoYDl5xT3l2c8wD8nPg.md: '# 从投放亏损500w，到深耕小红书内容营销以20w撬动30w流量增长，我是如何做的？  >
  来源：[https://ffssdmg6oi.feishu.cn/docx/HZ2RdrAmXoYDl5xT3l2c8wD8nPg](https://ffssdmg6oi.feishu.cn/docx/HZ2RdrAmXoYDl5xT3l2c8wD8nPg)  大家好，我是祥哥，目前在做品牌内容营销。之前在字节做整合营销，后来独立在创业公司做增长负责人，搭建了小红书、抖音、知乎的内容获客体系。这是此前关于知乎的精华帖  直入正题，这篇文章主要讲讲小红书的内容获客：我是如何在公司做品牌活动亏损500w的情况下，通过内容营销获客，在小红书用20W元获客30W人，帮助公司摸索出了一条正确的增长之路。我也因此晋升、工资翻倍、获得6位数期权、8个月年终奖，这段经历既是公司发展的转折，也是我个人收入大幅提高的开始，希望能对大家有一些启发。  老样子，先看下我上一家公司（产品是的一个招聘APP）当时的内容营销数据：2月投放279个小红书博主，花费4.7w元，互动量59w，获客7.2w，平均获客成本0.65元'
