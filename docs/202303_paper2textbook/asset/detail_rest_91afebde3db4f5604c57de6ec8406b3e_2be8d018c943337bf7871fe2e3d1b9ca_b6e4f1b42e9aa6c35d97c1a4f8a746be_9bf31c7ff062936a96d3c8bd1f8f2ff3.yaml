learning_targets:
- 掌握最小模型调试思维，将复杂爬虫/自动化任务拆解为可验证的微步骤
- 理解结构化需求总结在AI协作开发中的固化、迁移与反向约束作用
- 精通Class双维定位法，破解动态网页选择器失效难题
- 会设计分页级事务性保存机制，赋予长任务断点续爬与零数据丢失能力
- 内化对话式编程范式，实现非程序员“自然语言即接口”的工程级开发
- 构建反爬纵深防御体系，整合应用层、传输层、会话层三位一体防护
- 灵活运用二级页面穿透提取法，绕过列表页反爬直击详情页数据源
- 搭建半定制RPA架构，以“触发-处理-存储-交付”四阶段组装AI业务闭环
- 运用风向标拆解串联法，从信息噪音中通过四阶漏斗挖掘高确定性产品创意
- 驾驭GPT全能副驾模式，在单一Chat会话中完成全栈MVP半天级交付
- 建立Prompt迭代闭环与异常驱动修正机制，让AI协作开发拥有自动纠偏能力
- 践行验证优于实现原则，以最低成本验证“目标群体×核心需求”匹配
- 组装工具组合杠杆，以GPT为大脑、SaaS为手脚构建超级个体生产力体系
