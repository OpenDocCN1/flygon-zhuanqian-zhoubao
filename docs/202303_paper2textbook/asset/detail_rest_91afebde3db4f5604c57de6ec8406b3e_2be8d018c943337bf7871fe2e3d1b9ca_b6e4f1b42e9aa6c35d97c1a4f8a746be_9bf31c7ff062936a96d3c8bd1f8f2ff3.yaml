life_analogy:
- 想象AI协作开发是一场**‘指挥家带领乐团排练新曲’**：
- '- **最小模型调试** = 先让每个声部单独练对旋律（单元素），再分组合奏（单页），最后全团联排（全量)'
- '- **结构化需求总结** = 总谱：记录每个声部的调性、速度、力度标记，换指挥也能按原貌演出'
- '- **Class双维定位** = 既看乐谱上的音符（Class值），又确认演奏位置（标签/层级），防止走调'
- '- **分页级事务保存** = 每排练完一个乐章就录制存档（落盘），中途断电也不怕白练'
- '- **对话式编程** = 指挥家用自然语言‘大提琴第二小节稍慢’，乐手（AI）自动翻译成指法动作'
- '- **反爬纵深防御** = 排练厅三重安检：证件核验（应用层UA）、安检门（传输层代理）、行为分析（会话层节奏）'
- '- **二级页面穿透** = 总谱模糊不清时，直接去找独奏家（详情页）要最标准的演奏版本'
- '- **半定制RPA** = 积木搭建舞台：触发器（开场信号）→ AI大脑（编曲）→ 存储（录音）→ 交付（发行），无需盖新剧院'
- '- **风向标拆解串联** = 听百场音乐会（泛刷）→ 自己试唱几句（实操）→ 盯着金曲奖名单（中标）→ 把爵士乐、电子乐、说唱拼成新风格（串联）'
- '- **GPT全能副驾** = 一位全能制作人：既能写词（PM）、编曲（Dev）、设计封面（Designer）、联系媒体（运营），你只需拍板决策'
- '- **Prompt迭代闭环** = 彩排录音→发现跑调（报错）→ 标注修正（反馈）→ 重录验收，直到完美'
- '- **验证优于实现** = 先在街头卖唱（MVP验证需求），观众掏钱再回去录专辑（重开发)'
- '- **工具组合杠杆** = 指挥家（GPT大脑）+ 乐器/录音棚/发行商（SaaS手脚）= 一个人就能出专辑的超级个体'
summary:
- concept: 最小模型调试思维
  desc: 将复杂工程拆解为单元素→多元素→单页→多页→全量的五级渐进验证链路
- concept: 结构化需求总结
  desc: 将AI协作隐性决策显性化为包含HTML特征、存储规则、反爬策略的结构化文档，实现无损交接
- concept: Class双维定位法
  desc: 同时锚定HTML标签名与Class值，并通过DOM树层级关系定位，破解动态哈希Class失效
- concept: 分页级事务性保存
  desc: 以页为事务单元即时落盘，配合断点续爬与指数退避，实现长任务零数据丢失
- concept: 对话式编程范式
  desc: 人类任产品经理/架构师/测试，AI任程序员/调试/文档，自然语言驱动工程级开发
- concept: 反爬纵深防御体系
  desc: 应用层(动态UA)+传输层(代理IP)+会话层(随机延迟/断点续爬)三层解耦纵深防护
- concept: 二级页面穿透提取法
  desc: 放弃列表页直接提取，改为解析详情页URL逐个访问，利用详情页结构稳定性规避反爬
- concept: 半定制RPA架构
  desc: 触发(表单)→处理(API)→存储(表格)→交付(通讯)四阶段标准化节点，零代码搭建AI业务闭环
- concept: 风向标拆解串联法
  desc: 泛刷建敏感度→实操验偏好→聚焦领域中标→拆解共性串联特点规划产品的四阶漏斗
- concept: GPT全能副驾模式
  desc: 单一Chat会话中GPT连续扮演PM/文案/设计/开发/运营，配合SaaS工具链半天交付全栈MVP
- concept: Prompt迭代闭环与异常驱动修正
  desc: 报错全文反馈→结构分析→定点修复→回归验证的标准化循环，配合需求总结固化上下文
- concept: 验证优于实现原则
  desc: 早期仅验证目标群体与核心需求匹配，人工/No-code跑通再重构，避免过早技术投入
- concept: 工具组合杠杆定理
  desc: GPT(智力中枢)+ SaaS工具组合(执行手脚) = 超级个体，核心竞争力在于工具生态选型编排能力
exercises:
- 'no': 1
  title: 最小模型调试实战：从单元素到全量爬取
  contents:
  - 目标：爬取某电商网站商品列表页（含分页）的商品名、价格、销量
  - 1. 打开浏览器开发者工具，定位第1个商品的名称元素，记录其标签名与Class值
  - 2. 编写Prompt让GPT仅提取该单一元素，运行验证输出是否正确
  - 3. 扩展至提取前3个商品的名称、价格、销量三个字段，对比HTML结构差异
  - 4. 实现单页全量提取，处理广告位、空值等异常结构
  - 5. 加入翻页逻辑，爬取前5页数据
  - 回答问题：
  - '- 若第3步发现价格字段Class为哈希值且每页不同，如何修改定位策略？'
  - '- 为何不建议初版代码直接实现‘爬取全站所有商品’？'
- 'no': 2
  title: 结构化需求总结与Prompt迭代闭环演练
  contents:
  - 基于练习1最终跑通的代码：
  - 1. 向GPT发送：'根据最新完整代码，总结我的需求，要求准确详细，尤其是HTML选择器、反爬策略、异常处理、存储格式、运行环境'
  - 2. 对比生成的结构化需求文档与你实际调试过程，是否遗漏关键决策（如某次改用详情页穿透、某次加入代理IP）？
  - 3. 故意制造一个错误（如修改Class值为错误字符串），运行获取报错Traceback
  - 4. 将报错全文+当前代码发给GPT，提示：‘出现以下错误，先分析原因再更新代码’，观察修复是否精准
  - 5. 连续迭代3轮不同类型错误（选择器错、翻页逻辑错、编码错误），记录GPT是否重复犯同类错误
  - 回答问题：
  - '- 结构化需求总结中哪些字段对‘二次开发/换模型/换人’最关键？'
  - '- 当GPT给出的修复方案无效时，人类应如何介入打破循环？'
- 'no': 3
  title: 半定制RPA业务闭环搭建：从表单到自动交付
  contents:
  - 场景：用户填写Google Form提交‘小红书爆款标题生成’需求（输入：核心关键词、目标人群、风格偏好），系统自动调用ChatGPT生成5个标题，写回Google
    Sheets并邮件通知用户
  - 1. 在Make/Zapier中创建工作流：Google Forms监控新提交 → OpenAI模块（配置System Prompt含变量占位、User Prompt映射表单字段、Max
    Tokens=200、Temperature=0.8） → Google Sheets追加行（含时间戳、输入参数、生成结果） → Gmail发送邮件（HTML格式化结果）
  - 2. 测试全流程：提交3组不同参数，验证Sheets记录完整、邮件无乱码、Token消耗在预算内
  - 3. 迁移场景：将‘生成标题’替换为‘生成SEO文章大纲’/‘翻译跨境电商Listing’/‘生成周报初稿’，仅修改Prompt模板与表单字段
  - 回答问题：
  - '- 免费版Make/Zapier的任务数/工作流数限制如何影响商业化规模？如何低成本突破？'
  - '- 用户数据流经Forms、Make、OpenAI、Sheets、Gmail五个平台，若涉及隐私合规（如医疗/金融），该架构有哪些硬伤？如何改造？'
- 'no': 4
  title: 风向标拆解串联与极速MVP验证
  contents:
  - 1. 打开‘生财有术’风向标/即刻/小红书/推特，泛刷30分钟，收集含‘AI+垂直场景’的5条高赞信息
  - 2. 对每条信息微操作验证：注册体验/跑通Demo/写Prompt测效果，标记‘我能做/爱做/有市场’三维度
  - 3. 筛选近期被标记‘中标’/高互动的同类信息3条，提取共性要素（如：IP授权+零门槛交互+情感价值+社交传播）
  - 4. 串联组合出1个新产品创意，定义MVP范围（销售前端/信息收集/交付后端）
  - 5. 选用Gumroad+Typeform+Zapier+OpenAI组合，在半天内搭建可跑通收款交付的MVP
  - 回答问题：
  - '- 为何要求‘实操验证偏好’必须在‘聚焦中标’之前？若顺序颠倒会发生什么？'
  - '- MVP上线后，如何用最低成本验证‘用户真实支付意愿’而非‘点赞/收藏’？'
- 'no': 5
  title: 反爬纵深防御与二级页面穿透综合实战
  contents:
  - 目标：爬取某动态加载网站（如知乎回答/小红书笔记/抖音评论）前50页核心数据
  - 1. 分析列表页：是否存在虚拟滚动/懒加载/数据加密？尝试直接提取，记录失败模式（缺失字段、截断、报错）
  - 2. 实施二级页面穿透：解析列表页获取详情页URL列表，编写详情页提取逻辑（Class双维定位），对比数据完整性
  - 3. 配置三层防御：fake_useragent动态UA + 住宅代理IP池(10条/分钟) + 请求前1-3秒随机延迟 + 页级事务保存(Excel多Sheet)
    + 断点续爬(记录最大成功页码) + 指数退避重试(最大10次)
  - 4. 运行至完成或中断，若中断检查已落盘Sheet数量与数据质量
  - 5. 编写合并脚本将多Sheet整理为单文件
  - 回答问题：
  - '- 若详情页同样需登录/有图形验证码/采用GraphQL加密接口，穿透法失效，此时应转向何种技术路线？'
  - '- 请求量放大N倍（列表页1次+详情页N次）导致代理IP成本激增，如何在不降低数据量前提下优化成本？'
