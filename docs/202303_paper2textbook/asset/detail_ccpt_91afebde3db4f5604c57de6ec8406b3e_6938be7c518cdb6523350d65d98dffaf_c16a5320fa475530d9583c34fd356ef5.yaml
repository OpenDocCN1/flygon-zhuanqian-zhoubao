  - paper: docs/202303/20230328_068.md
    role: apply
  excerpts:
  - 总结：内容电商的重点还是在于内容，不断的提升自己的文案能力和创作能力不管你在做哪个平台都是加分项，然后流程化矩阵化才能在自己积累财富的同时增长技能见识。
  - 每天复盘记录数据优化文案和选款是一个非常好的习惯随缘无上进心不容易做起来。
  - 少研究什么爆款起店什么日出百单踏踏实实的每天选款找素材发内容是最实在的也能积累更多实战经验。
  - 不用太纠结货源，直接在电商平台多比较多找几个商家大胆问就行了，非要找到高质量的好货黄花菜都凉了。
  - 利用内容数据工具找到对标爆款账号，分析爆文笔记的标题、内容、数据，找出能够爆文的共性然后进行模仿创作。
  - 对标爆款笔记是普通人做出成绩最好的捷径。
