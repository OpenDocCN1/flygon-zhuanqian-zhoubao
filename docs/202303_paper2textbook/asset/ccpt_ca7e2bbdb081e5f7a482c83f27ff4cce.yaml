paper: docs/202303/20230328_049.md
desc: 该素材为《普通人进入 web3 的 20 种从 0 到 1 的变现方式》的上篇大纲与导读，系统阐述了普通人切入 Web3 变现的五大核心优势维度（信息差、认知差、执行差、资源差、权力差）、入局的六步走方法论、人群适配性分析、市场周期择时策略（牛熊市差异化决策）及渠道选择注意事项，并附带作者从传统行业转型
  Web3 的实战履历背书，旨在为 Web2 用户提供认知重构与实操落地的完整框架。
concepts:
- name: Web3 变现五大差
  desc: 作者原创提出的普通人在 Web3 领域建立竞争优势的五个核心维度框架，涵盖信息获取、认知处理、执行落地、资源整合、权力博弈，构成从 0 到 1 变现的底层逻辑闭环。
  is_original: true
  excerpt:
  - 1-1：信息差
  - 1-2：认知差
  - 1-3：执行差
  - 1-4：资源差
  - 1-5：权力差
- name: 魔法上网
  desc: 指突破网络访问限制以获取 Web3 一手信息的技术手段，是构建信息差的物理基础设施与前置条件。
  is_original: false
  excerpt:
  - 1-1-1：魔法上网
- name: 可靠信息源
  desc: 指在 Web3 高噪音环境中筛选出的高信噪比、可验证的优质信息渠道（如核心开发者推特、官方治理论坛、链上数据工具），是克服信息不对称的关键。
  is_original: false
  excerpt:
  - 1-1-2：找到可靠信息源
- name: 执行三要素
  desc: 将执行力拆解为工具（效率放大器）、逻辑（决策框架）、安全（风控底线）三个层面，强调执行力非单一意志力而是系统工程。
  is_original: true
  excerpt:
  - 1-3-1：执行工具
  - 1-3-2：执行逻辑
  - 1-3-3：执行安全
- name: 资源差三维度
  desc: 将 Web3 语境下的资源优势具体化为人脉（信任网络/Alpha获取）、团队（协作杠杆）、资金（本金/Gas/保证金）三大要素。
  is_original: true
  excerpt:
  - 1-4-1：人脉
  - 1-4-1：团队
  - 1-4-3：资金
- name: 权力差双向操作
  desc: 原创提出的权力博弈策略：'抹掉权力差'指利用区块链去中心化特性降低准入门槛；'建立权力差'指通过早期参与、治理投票、流动性提供等构建新的影响力护城河。
  is_original: true
  excerpt:
  - 1-5-1：抹掉权力差
  - 1-5-2：建立权力差
- name: 普通人入局 Web3 六步法
  desc: 作者提炼的从零开始进入 Web3 的标准化动作分解流程（具体步骤见下篇/飞书文档），属于核心方法论框架。
  is_original: true
  excerpt:
  - 3.1：普通人入局 web3 的 6 步
- name: 牛熊市差异化决策
  desc: 针对牛市（高波动、高叙事、重流动性/短线）与熊市（低波动、重基本面/建设、重积累/长线）两种市场状态提出的截然不同的投资/变现策略框架。
  is_original: false
  excerpt:
  - 3.2.1 牛市和熊市的特点
  - 3.2.2 牛市和熊市不同的投资决策
methods:
- name: __overview__
  desc: 素材整体采用 'Why-Who-When-Where-What&How' 五维结构化教学法，由宏观认知（Why）倒推微观实操（What&How），结合作者亲历案例背书，构建从认知重塑到变现落地的完整教学路径。
  excerpt:
  - 文章目录如下：
  - '# 1、Why（普通人为什么选 web3 变现）'
  - '# 2、Who（普通人入局 Web3 的方式？）'
  - '# 3、When（普通人何时入局 web3？）'
  - '# 4、Where（普通人什么渠道入局 web3？）'
  - '# 5、What & How（web3 变现方式大全-下篇）'
- name: 信息差构建法
  desc: 三步走构建信息优势：物理层突破（魔法上网）-> 来源层筛选（可靠信息源）-> 认知层消除障碍（克服英文恐惧），形成获取一手 Alpha 信息的闭环。
  excerpt:
  - 1-1-1：魔法上网
  - 1-1-2：找到可靠信息源
  - 1-1-3：克服自己对英文的恐惧
- name: 认知差建立法
  desc: 双环认知加工模型：输入端筛选信息（去噪/辨真伪）-> 处理端消化信息（建模/内化/形成独立判断），将原始数据转化为可决策的认知资产。
  excerpt:
  - 1-2-1：筛选信息
  - 1-2-2：消化消息
- name: 执行差落地法
  desc: 工具-逻辑-安全三位一体执行体系：工具提升效率（脚本/插件/钱包管理），逻辑指导决策（标准化SOP/止盈止损规则），安全兜底风控（多签/硬件钱包/防钓鱼），解决'知易行难'。
  excerpt:
  - 1-3-1：执行工具
  - 1-3-2：执行逻辑
  - 1-3-3：执行安全
- name: 周期择时策略法
  desc: 基于市场周期（牛/熊）特征识别，动态调整策略：牛市侧重叙事跟踪、流动性管理、短周期套利；熊市侧重基本面深研、技术建设参与、低成本积累筹码/资源。
  excerpt:
  - 3.2.1 牛市和熊市的特点
  - 3.2.2 牛市和熊市不同的投资决策
theorems:
- name: 普通人 Web3 变现核心公式：五大差叠加
  desc: 核心主张：普通人在 Web3 实现从 0 到 1 变现，本质是通过主动构建或利用 '信息差、认知差、执行差、资源差、权力差' 五个维度的非对称优势，而非单纯依赖资金投机。
  excerpt:
  - 1、Why（普通人为什么选 web3 变现）
  - '## 1-1：信息差 ... ## 1-2：认知差 ... ## 1-3：执行差 ... ## 1-4：资源差 ... ## 1-5：权力差'
- name: Web3 重塑权力结构论
  desc: 核心主张：Web3 的本质价值在于 '抹掉旧权力差（中心化准入/审查/垄断）' 与 '建立新权力差（去中心化身份/治理权/声誉/资产主权）' 的双重过程，普通人应主动参与后者成为新秩序的受益者。
  excerpt:
  - '## 1-5：权力差'
  - '#### 1-5-1：抹掉权力差'
  - '#### 1-5-2：建立权力差'
- name: 熊市入局优先论
  desc: 关键观点：熊市因噪音少、竞争弱、项目估值低、核心团队专注建设，更适合普通人低成本试错、深度学习、积累核心资源（人脉/技能/筹码），为牛市收割奠基。
  excerpt:
  - '## 3.2：普通人入局 web3 是熊市还是牛市更合适？'
  - 3.2.1 牛市和熊市的特点
  - 3.2.2 牛市和熊市不同的投资决策
- name: Web2 经验迁移论
  desc: 核心主张：作者亲历证明，教书（内容/教育）、电商（运营/流量/供应链）、设计（产品/品牌/用户体验）等 Web2 核心技能可无缝迁移至 Web3 运营、投研、社区建设、项目发行等岗位，是普通人转型的核心杠杆。
  excerpt:
  - 个人介绍：
  - 第 1 阶段：2003 年~2010 年（教书育人）
  - 第 2 阶段：2010 年~2013 年（电商卖货）
  - 第 3 阶段：2013 年~2018 年（电商设计）
  - 第 4 阶段：2018 年~至今（web3 领域）
  - 参透了币圈的运营逻辑和做市逻辑...组建了一个专业的 web3 运营团队
findings:
- name: 作者全周期实战验证案例
  desc: '[evidence] 作者从 2018 年投研入场，经历挖矿（BTC/ETH 自营 1000 方矿场，政策风险导致 2021 年关停）、DeFi/公私募投资（矿机产币价值最大化）、NFT/元宇宙运营（河里人项目
    0-1 组建运营团队）三大周期主流赛道，验证了 ''五大差'' 与 ''周期择时'' 方法论的有效性。'
  excerpt:
  - 2018 年初进入币圈投研阶段...18 年正式确认进入挖矿领域【专挖 BTC 和 ETH】并开始自营自己的 1000 方矿场，效益非常不错。
  - 2021 年 6 月 20 号一纸文件，无奈只能关停自己的矿场
  - 2020 年进入公/私募和 DEFI 领域...寻找到了一些靠谱的 TOKEN 公/私募项目和 DEFI 项目做了投资，收益也不错
  - 2021 年初开始研究 NFT 领域...进入国风元宇宙项目--河里人，从 0 到 1 招聘并组建了一个专业的 web3 运营团队。担任运营总监一直到 2023
    年 2 月
- name: 政策风险对中心化物理基建的毁灭性打击
  desc: '[evidence] 2021 年 6 月中国监管政策导致作者自营 1000 方矿场被迫关停，证明了依赖物理实体、中心化地理位置的商业模式在 Web3
    语境下存在极高的主权政策风险，侧面印证了 ''去中心化/权力差抹平'' 的必要性。'
  excerpt:
  - 2021 年 6 月 20 号一纸文件，无奈只能关停自己的矿场，中国挖矿算力中心的时代也宣告结束。
- name: Web2 运营能力在 Web3 项目冷启动中的决定性作用
  desc: '[evidence] 作者凭借 Web2 电商运营/设计经验，在河里人 NFT 项目中实现 ''从 0 到 1 招聘并组建专业 web3 运营团队''，担任运营总监超一年，证明成熟的
    Web2 运营方法论（用户分层、社群裂变、内容矩阵、活动节奏）对 Web3 项目冷启动具有降维打击效果。'
  excerpt:
  - 2021 年初开始研究 NFT 领域，并在 21 年 12 月进入国风元宇宙项目--河里人，从 0 到 1 招聘并组建了一个专业的 web3 运营团队。担任运营总监一直到
    2023 年 2 月。
- name: 下篇 20 种变现方式谱系预告
  desc: '[claim] 作者承诺下篇将系统详解 20 种 Web3 变现实操，覆盖参与方式、赚钱逻辑、变现难度、潜在风险、收益预期五大维度，形成配套完整的
    ''变现百科全书''。'
  excerpt:
  - '### 下篇预告：讲述 web3 领域中从 0 到 1 变现的 20 种实操，详解每种实操的：参与方式，赚钱逻辑，变现难度，潜在风险，收益。'
