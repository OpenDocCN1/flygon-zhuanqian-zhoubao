unsupported_claims:
- location: 7.3 边界条件-平台政策变动
  claim: 抖音/视频号对体制内身份认证收紧时，需评估实名认证对主业的暴露风险，必要时用家人名义开号
  reason: 素材中未提及平台实名认证政策收紧或家人名义开号的具体案例与操作细节
- location: 7.3 边界条件-规模化临界点
  claim: 当副业收入超主业、团队扩张需办证照时，合规边界从'个人行为'升级为'经营主体资质'，需重新审视底线
  reason: 素材中未涉及副业规模化至注册公司、办证照阶段的合规处理实例
- location: 7.4 边界条件-内容枯竭期
  claim: 单一生活场景（如装修）有周期性结束，需提前布局下一生活赛道（如装修后的收纳、软装、二胎育儿）实现接力
  reason: 素材中仅提到土豆妈从装修切入，未提及其后续赛道布局或内容枯竭应对实例
- location: 7.5 边界条件-微信规则上限
  claim: 单个标签上限约200人，需定期清理僵尸粉或建立多级标签（看广告1、看广告2）
  reason: 素材中未提及微信标签人数上限及多级标签操作细节
- location: 7.6 边界条件-平台封群风险
  claim: 微信群超100人需实名、超500人不可扩、敏感词触发封禁，需建立'群裂变+私域沉淀+邮件/公众号触达'多通道备份
  reason: 素材中未提及微信群规模限制、敏感词封禁及多通道备份具体方案
- location: 7.6 边界条件-法务合规
  claim: 虚拟服务类商品需明确'服务期限、范围、标准、退费规则'，规避'预付式消费'监管风险
  reason: 素材中未涉及付费社群的法律合规条款设计与监管规避细节
- location: 7.7 边界条件-服务标准化前提
  claim: 仅适用于'问题相对标准、流程可SOP化、结果可预期'的咨询领域；高度非标、强依赖专家直觉的领域慎用
  reason: 素材中仅展示房产装修咨询标准化案例，未论证其他领域适用边界
- location: 7.7 边界条件-个人精力上限
  claim: 单人高价咨询上限约20-30单/月，突破需引入'初级顾问执行+资深顾问把关'分级模型，或转型为'训练营/课程/社群'杠杆模式
  reason: 素材中未提及咨询业务规模化瓶颈及团队化转型路径
- location: 7.7 边界条件-平台规则限制
  claim: 微信个人收款单笔上限、年度上限；高客单需引导企业转账/个体户收款码/小程序订单，规避风控
  reason: 素材中未提及大额收款的具体风控规避操作
- location: 7.8 边界条件-内容合规底线
  claim: 严禁泄露主业机密、涉政言论、隐私信息、未经验证的传闻，复盘内容需脱敏处理
  reason: 素材中未展示复盘内容脱敏的具体标准与操作示例
- location: 7.8 边界条件-效率临界点
  claim: 单条复盘耗时>30分钟容易导致坚持困难，建议建立'语音输入→AI整理→定时发布'半自动化流程，压缩至5-10分钟
  reason: 素材中未提及AI辅助复盘流程及耗时控制实测数据
- location: 7.9 边界条件-价值门槛
  claim: 自身必须有'跑通闭环的实战案例、系统化的方法论沉淀、独特的数据/视角'，空手套白狼会被拉黑
  reason: 素材中未量化'跑通闭环'的具体标准，未给出被拒案例反面教材
- location: 7.10 边界条件-甄别航海质量
  claim: 警惕'无SOP、无教练、无复盘、只发鸡血、教练自己没跑通项目'的坑爹航海，入营前必看教练实战数据、往期船友反馈、SOP样章
  reason: 素材中未提供甄别航海质量的具体检查清单或避坑案例
- location: 7.10 边界条件-及时止损
  claim: 单项目航海执行2周仍无正反馈（0粉、0咨询、0单），果断切换下一航海
  reason: 素材中浅色喵案例虽提及生病切换工具，但未明确2周止损标准的通用适用性
- location: 7.11 多源对照-分歧
  claim: 关于'主业身份是否露脸'、'免费社群运营时长'、'咨询定价上限'存在分歧观点
  reason: 素材中仅为土豆妈单一案例视角，未包含医生IP、律师IP、AI赛道、高客单咨询等其他从业者的实战对比数据
