  name: 直播间分级回答与插队变现 —— 供需不匹配时的“价格机制”设计
  points:
  - '**为什么需要这个概念？**'
  - '- 直播间流量爆发时，ChatGPT回答速度 << 观众提问速度，大量问题无人回复'
  - '- 全免费回答会吸引大量低意向/白嫖用户，稀释高价值用户体验'
  - '- 需要一套“筛选高意向+变现情绪价值”的自动化机制'
