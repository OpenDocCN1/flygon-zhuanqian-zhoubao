- 'no': 3
  name: 企业微信自动化引流闭环 —— 无人值守的“视频号→企微→微信”链路
  points:
  - '**为什么需要这个概念？**'
  - '- 人工回复私信/加好友效率极低，无法承接爆发期流量洪峰'
  - '- 企微单日加好友上限低（触发风控后限制3-10天），需矩阵分流'
  - '- 客户来源不同（扫码/搜索/广告），统一话术转化率极低'
  - '**核心定义**'
  - '- 注册企微→认证(300元/年，解锁5万好友)→绑定视频号→开通微信客服→配置机器人知识库(关键词/相似问法)→设置客服欢迎语(引导加企微)→设置企微欢迎语(挂在线文档+引导加个人微信)'
  - '- 实现“视频号→微信客服→企业微信→个人微信”全自动无人值守引流'
  - '**关键性质**'
  - '- 分层承接：视频号承担流量入口，企微承担筛选/分流/抗风控，个人微信承担深度转化'
  - '- 差异化触达：扫码进来的已看欢迎语，发“问题指南”；搜索进来的未看，发“完整欢迎语”'
  - '- 抗风控：多备企微号养号轮换，单号触发限制自动切换备用号'
  - '**典型例子**'
  - '- 作者搭建该链路后，单日引流数百人零人工值守，企微消息太多时直接不回、主回个人微信'
  - '- 客服欢迎语植入“点我添加客服微信”关键词回复，自动触发引流动作'
  - '**边界条件**'
  - '- 必须有营业执照认证企微，纯个人号无法实现'
  - '- 企微加好友频控阈值非公开（与账号权重相关），需实测摸索'
  - '- 微信客服机器人知识库需持续维护，否则回复不相关导致用户流失'
  - '...'
  sources:
  - paper: docs/202303/PEaud24YioXVx3xe09rcXJVMnjb.md
