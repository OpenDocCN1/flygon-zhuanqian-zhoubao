paper: docs/202303/20230328_009.md
desc: 该素材基于李笑来的观点，系统阐述了“好问题”的三大核心标准：不可通过简单搜索获得答案、具备充足的背景信息与情境界定、提问姿态为讨论而非单纯索取（建议采用选择题式提问并附带自主思考方案）。文章指出提问质量折射提问者能力与诚意，高质量提问是高绩效人群的典型特征。
concepts:
- name: 好问题
  desc: 指无法通过简单搜索得到答案、包含充足背景信息与情境界定、且提问姿态为讨论而非单纯索取（常采用选择题形式并附带自主思考方案）的提问。它是提问者思考深度、做事诚意与解决问题能力的外在投射。
  is_original: false
  excerpt:
  - 李笑来总结过，好问题的三个标准
  - 这个问题一定无法通过简单的搜索就得到答案
  - 这个问题有充足的背景信息支撑
  - 一个好问题不会是纯粹的索取。一个好的提问者所秉持的姿态更接近与“讨论”，而非“索取”
- name: 低质量提问/蠢问题
  desc: 指可通过搜索引擎即时解决、缺乏背景信息与情境界定（如‘大城市还是小城市’）、姿态为纯粹索取且提问者未投入思考成本的提问。此类问题暴露提问者懒惰、怕麻烦、缺乏诚意。
  is_original: false
  excerpt:
  - 这个在哪里？这个怎么买？这个多少钱？
  - 能够提出这种问题的人，一定是个怕麻烦的懒人
  - 比如“应该去大城市工作？还是去小城市工作？”这种问题的答案只能有一个，那就是看情况
  - 大家只不过讨厌被问到蠢问题，因为这显得提问者毫无诚意
- name: 选择题式提问法
  desc: 一种高质量提问策略：提问者先自主提出两种或多种备选解决方案，再请教回答者判断优劣或补充新方案。该方法将开放式问题转化为半结构化决策问题，显著降低回答者认知负荷，体现提问者诚意。
  is_original: false
  excerpt:
  - 他会用选择题的方式提问，而非简单的开放式
  - 比如“我对 xxx 有些疑问，现在想出了两种解决方法，一是 xxx，二是 xxx，老师觉得哪个方法可行？老师还有没有其他更好的方法？”
methods:
- name: __overview__
  desc: “好问题”构建三步法：1. 搜索验证：确认问题无法通过检索引擎直接得解；2. 语境建模：投入时间分析问题发生情境、涉及概念、已尝试方案，明确界定约束边界；3.
    方案预置：将提问转化为选择题，附带自主思考的备选方案，邀请回答者参与讨论而非单向索取。
  excerpt:
  - 首先，这个问题一定无法通过简单的搜索就得到答案
  - 其次，这个问题有充足的背景信息支撑……把问题定义的非常清楚，问题发生在什么样的情境下，涉及到什么样的概念，尝试过的解决方法等等
  - 最后，一个好问题不会是纯粹的索取……他会用选择题的方式提问，而非简单的开放式
- name: 背景信息界定清单
  desc: 构建充足背景信息的实操清单：问题发生情境、涉及核心概念、已尝试解决方法、期望达成目标、关键约束条件。用于将模糊问题（如‘去大城市还是小城市’）转化为可决策的具体问题。
  excerpt:
  - 做足功课的学霸会把问题定义的非常清楚，问题发生在什么样的情境下，涉及到什么样的概念，尝试过的解决方法等等
  - 要把问题的背景信息限定好，这需要投入大量的时间对问题进行分析
theorems:
- name: 提问质量-能力同构定律
  desc: 提问的质量直接折射提问者的核心能力维度：搜索/自学能力（是否怕麻烦）、系统思维能力（是否能界定语境）、元认知与执行力（是否预置方案）。高质量提问者必然是高绩效人群（学霸/优秀员工）。
  excerpt:
  - 提问本身就能看出你的能力
  - 成为学霸的第一步就是不怕麻烦
  - 如果你碰到一个能提出高质量问题的学生，基本上可以判定他的成绩一定不会差
- name: 提问诚信互惠原则
  desc: 提问是双向互惠的社交契约：提问者投入的思考成本（搜索、建模、预置方案）决定了回答者愿意投入的认知资源。纯索取式提问因零成本导致零回应；选择题式提问因前置劳动换来高质量回应。
  excerpt:
  - 连提问者自己都不重视的事情，还怎么能要求其他人重视呢？
  - 这样的提问方式会让回答者感受到你为这个问题所做的努力，以及你对于这个问题的思考
  - 大家只不过讨厌被问到蠢问题，因为这显得提问者毫无诚意
findings:
- name: 典型低质量提问模式：上下文缺失型
  desc: '[evidence] 作者抖音后台高频私信‘这个在哪里/怎么买/多少钱’，提问者默认回答者知晓其观看的具体视频上下文，实则信息严重不对称，导致问题无法被理解与作答。'
  excerpt:
  - 我能猜到这人为什么会有这样的问题，可能是他看了我的一条视频……但他问问题就只从自己的角度发问，以为他心里想的，别人都知道，其实我根本不知道他在问什么
- name: 模糊决策型提问的必然无效性
  desc: '[evidence] ‘大城市还是小城市’此类未界定个人条件（专业、家庭、风险偏好等）的开放式决策问题，唯一标准答案只能是‘看情况’，回答者无法提供有效建议，提问者也无法获得可执行信息。'
  excerpt:
  - 比如“应该去大城市工作？还是去小城市工作？”这种问题的答案只能有一个，那就是看情况
- name: 选择题式提问的社交杠杆效应
  desc: '[claim] 采用‘自主思考两个方案+请教优劣’的选择题式提问，能显著提升回答意愿与回答质量，因为该方式向回答者传递了‘我已投入成本、我尊重你时间、我们在平等讨论’的强信号。'
  excerpt:
  - 这样的提问方式会让回答者感受到你为这个问题所做的努力，以及你对于这个问题的思考。其实没有多少人讨厌被问问题，大家只不过讨厌被问到蠢问题
- name: 拒绝自助检索者的负面反馈案例
  desc: '[evidence] 评论区案例：大四女生询问考研科目与分数线，被建议自行百度目标院校信息后反而拉黑建议者。印证‘怕麻烦的懒人’抗拒前置搜索成本，甚至对引导其自主解决问题者产生敌意。'
  excerpt:
  - 有个女生问我考什么科目，分数线之类的。我让她去百度上找她自己想报考的学校的情况，然后她把我拉黑了
