learning_targets:
- 理解客户筛选机制的底层逻辑：从防御性防白嫖转向进攻性识别真需求
- 掌握五步标准化筛选流程（问题澄清→快速评估→提供免费资源→引导付费咨询→探讨预算）并能落地执行
- 学会运用真需求识别五维模型（针对性、态度、认知度、主动性、紧迫性）量化判断客户质量
- 掌握价值锚定三大话术（提问式引导、主动价值挖掘、强调投资回报）实现价格后置、价值前置
- 建立信任前置资产库（专业背景、量化案例、客户评价），实现咨询前完成信任铺垫
- 内化情绪管理与边界防御心法（预设包容性、重构关系定位、课题分离），构建商业礼貌的内功体系
concept_map:
- 客户筛选商业体系
- ├── 核心定律
- │   ├── Skin in the Game（利益绑定原则）  —— P001
- │   ├── 边际成本为零的免费产品  —— P001
- │   ├── 能力圈匹配性  —— P001
- │   ├── 开门做生意基础解释成本  —— P001
- │   └── 价格讨论必须后置于价值确认后  —— P001
