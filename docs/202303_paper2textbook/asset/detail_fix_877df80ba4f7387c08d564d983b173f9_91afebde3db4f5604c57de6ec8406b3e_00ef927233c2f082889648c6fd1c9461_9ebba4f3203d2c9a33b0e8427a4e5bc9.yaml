  - paper: docs/202303/20230328_038.md
    role: origin
  excerpts:
  - 1、提问式引导：通过提出一系列问题，让他深入思考自己的需求、目标和期望。例如："你希望通过咨询实现什么目标？" "你具体遇到了什么问题？" "你想要改变的是什么？"
  - 2、主动价值挖掘：在了解对方需求的基础上，帮助他发现潜在的价值点。例如："如果你解决了这个问题，会对你的生活或工作产生怎样的积极影响？甚至之多少钱？"
  - 3、强调投资回报：强调通过付费咨询所带来的长期回报……例如："通过我的专业指导，你可以更快地实现目标，避免可能的错误，节省 xx 时间和 xx 钱。"
  - 在推荐付费咨询或者产品的时候，可以事先问一下对方「这个问题如果解决能给你带来多大的好处？」，你既要让他意识到问题解决后的价值，也要了解他是否真的愿意为此投资。最后才是提供产品或者咨询服务。
- 'no': 5
  name: 信任前置资产库 —— “未战先胜”的信任战略储备
  points:
  - '**为什么需要这个概念？**'
  - '- 咨询现场现场建信任，成本高、周期长、易被打断、依赖个人表现波动'
  - '- 陌生人咨询时，信任度决定了是否愿意付费、付费额度、决策速度'
  - '- 将信任建设“前置”到内容分发阶段，实现“未问询时已完成信任铺垫”'
  - '**核心定义**'
  - '- 三大核心资产：1. 专业背景展示（学历/证书/从业年限/头衔） 2. 可量化成功案例库（具体数字/场景/前后对比） 3. 客户评价体系（真实截图/视频/转账记录/第三方平台评价）'
  - '- 部署渠道：公众号/朋友圈/个人IP主页/社群置顶/付费课程交付物/私域欢迎语'
  - '**关键性质**'
  - '- 信任资产具有“复利属性”：一次产出，长期复用，边际成本趋近零'
  - '- 量化案例>定性描述：具体数字（如“20分钟成交”“提分30分”“省50万”）比形容词（专业/靠谱/厉害）信服力强百倍'
  - '- 可作为“筛选机制”的自动过滤器：信任度低者自动流失，高者自动靠近'
  - '**典型例子**'
  - '- 家庭教育IP：朋友圈持续发“学员从厌学到考上重点高中”案例（量化）+ 家长锦旗截图（评价）+ 教育规划师证书（背景） → 潜在客户加微信前已看完10篇案例
    → 咨询时直接问“12800怎么付”而非“你靠谱吗”'
  - '**边界条件**'
  - '- 必须真实、可验证，造假一旦被识破将引发信任崩塌，边际损失远超收益'
  - '- 需持续更新迭代，过期案例（如3年前数据）会降低当下说服力'
  - '- 无法替代“服务交付期”的信任维护，仅解决“成交前”的信任建立问题'
