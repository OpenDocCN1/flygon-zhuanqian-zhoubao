learning_targets:
- 理解好问题的三大核心标准：不可搜索、充足背景、讨论姿态
- 识别低质量提问的典型模式（上下文缺失型、模糊决策型）及其暴露的深层心理特征
- 掌握选择题式提问法的三步标准化流程：搜索验证 -> 语境建模 -> 方案预置
- 理解提问质量与个人核心能力（搜索力、系统思维、元认知、执行力）的同构映射关系
- 能将模糊开放式问题转化为结构化选择题，降低回答者认知负荷，提升回应质量与社交互惠效率
concept_map:
- 提问与沟通技术
- ├── 核心标准：好问题的三大定律
- │   ├── 不可搜索性  —— P002 答案无法通过检索引擎直接获得，需经人类经验与判断
- │   ├── 充足背景性  —— P002 包含情境、概念、尝试、目标、约束五要素，界定可决策的具体问题
- │   └── 讨论姿态/选择题式  —— P002, P003 提问者预置方案，邀请评判优劣，而非单向索取
- ├── 反面教材：低质量提问模式
- │   ├── 上下文缺失型  —— P002 默认对方共享视角，实则信息孤岛（如'这个在哪买'）
- │   ├── 模糊决策型  —— P002 未界定约束条件，答案退化为'看情况'（如'大城市还是小城市'）
- │   └── 纯索取姿态  —— P002 零思考成本投入，暴露懒惰、缺乏诚意、系统思维缺失
- ├── 核心方法：选择题式提问法
- │   ├── 搜索验证  —— P003 确认问题不可搜索，前置自学成本
- │   ├── 语境建模  —— P003 情境/概念/尝试/目标/约束五要素结构化界定问题全貌
- │   ├── 方案预置  —— P003 自主产出≥2个经思考的备选方案，转化为选择题抛出
- │   └── 邀请评判  —— P003 请教优劣或补充新思路，形成认知协作闭环
- └── 底层逻辑：提问质量-能力同构定律
- '    ├── 搜索力/自学力 ≡ 不可搜索标准  —— P004'
- '    ├── 系统思维力 ≡ 充足背景标准  —— P004'
- '    ├── 元认知/执行力 ≡ 讨论姿态标准  —— P004'
- '    └── 互惠原则：提问者前置思考成本 ⇄ 回答者投入认知资源  —— P002, P003'
life_analogy:
- 想象提问是一场**去专科医生那里‘精准挂号+自带病历+预设方案’的就诊过程**：
- '- **不可搜索** = 你的症状百度查不出确切病因（非常识性发烧感冒），必须靠医生经验判断'
- '- **充足背景** = 你自带完整病历：发病情境（情境）、既往史/过敏原（概念）、自行服药记录（尝试）、想达到的康复标准（目标）、不能打针/不能请假（约束）'
- '- **讨论姿态/选择题** = 你不问‘医生我怎么办？’，而说：‘医生，我查了资料觉得可能是A方案（吃药观察）或B方案（做微创），考虑到我下周要考试（约束），您觉得哪个更稳妥？还有没有方案C？’'
- '- **医生（回答者）** = 只需评判你的A/B方案利弊或补充C方案，认知负荷极低，极愿意配合，甚至主动帮你挂最好的专家号'
- 就像聪明的病人懂得‘帮医生帮自己’，高质量提问者懂得‘帮回答者帮提问者’。
summary:
- concept: 好问题三大标准
  desc: 不可搜索 + 充足背景 + 讨论姿态（选择题式），是提问者思考深度与诚意的外在投射
- concept: 低质量提问/蠢问题
  desc: 可搜索 + 缺背景 + 纯索取，暴露提问者懒惰、怕麻烦、缺乏系统思维，导致零回应或被隐性屏蔽
- concept: 选择题式提问法
  desc: 搜索验证 -> 语境建模（情境/概念/尝试/目标/约束） -> 方案预置（≥2个备选） -> 邀请评判，降低回答者认知负荷的社交杠杆
- concept: 提问质量-能力同构定律
  desc: 提问质量 ≡ 搜索力 × 系统思维 × 元认知 × 执行力，高质量提问是高绩效人群的必要特征
- concept: 提问诚信互惠原则
  desc: 提问者前置思考成本（定金）决定回答者投入认知资源，纯索取零成本必然零回应
- concept: 背景信息界定清单
  desc: 问题发生情境、涉及核心概念、已尝试方法、期望目标、关键约束——将模糊问题转化为可决策具体问题的实操工具
exercises:
- 'no': 1
  title: 蠢问题改造实战：从“索取”到“讨论”
  contents:
  - 以下是三个典型的低质量提问，请分别应用“选择题式提问法”三步法（搜索验证 -> 语境建模 -> 方案预置）将其重写为高质量提问：
  - 1. 场景：想做抖音带货，问大佬：‘抖音带货怎么选品？’
  - 2. 场景：职场三年想转行，问前辈：‘我该不该辞职考公/考证/创业？’
  - 3. 场景：学习Python入门，问群里：‘Python怎么学？有什么书推荐吗？’
  - 回答要求：
  - '- 每个重写版必须包含：核心约束条件、已尝试/排除的方案、2-3个自主思考的备选方案、邀请评判的话术'
  - '- 标注每个版本中对应的‘情境、概念、尝试、目标、约束’五要素'
- 'no': 2
  title: 提问质量自诊断：你的提问暴露了什么能力短板？
  contents:
  - 回顾近期你在社群、工作群、向导师请教的 3 个真实提问（或模拟即将要问的问题），按以下维度打分（1-5分）：
  - 1. 不可搜索性：答案是否真无法通过百度/ChatGPT/知乎在 5 分钟内获得？
  - 2. 背景充足度：是否包含了情境、概念、尝试、目标、约束五要素？
  - 3. 讨论姿态：是否预置了 ≥2 个备选方案并邀请评判，而非单向问‘怎么办’？
  - 自我复盘问题：
  - '- 哪个维度得分最低？该维度对应的核心能力（搜索力/系统思维/元认知/执行力）是否为你的长期短板？'
  - '- 若把最低分维度提升 1 分，需要你在提问前多投入多少分钟的‘前置思考成本’？'
  - '- 设计一个‘提问前置清单’便签，贴在显示器边，强制下次提问前打卡'
- 'no': 3
  title: 实战演练：向高认知者发起一次高质量连接
  contents:
  - 目标：在本周内，向一位你敬佩的行业前辈/大佬（微信好友、星球大咖、博主等）发起一次真实的高质量提问/请教。
  - 执行步骤：
  - 1. 选定一个真实困扰你的、不可搜索的具体决策/难题。
  - 2. 花 20 分钟完成‘背景信息界定清单’（情境/概念/尝试/目标/约束）。
  - 3. 自主构思 2-3 个可行性不同的备选方案，分析各自优劣。
  - 4. 按选择题式话术发送：【背景】+【困境】+【方案A优劣】+【方案B优劣】+【约束】+【请教：倾向哪个？有无方案C？】。
  - 5. 记录对方回应时间、回应长度、建议质量、是否引发后续深度对话。
  - 复盘记录：
  - '- 对比以往‘随意提问’的回应差异，量化‘前置思考成本’与‘回应质量’的正相关性。'
  - '- 若对方未回应，复盘：是方案伪思考？背景仍模糊？还是对方匹配度不够（非领域专家）？'
  - '- 将此次提问全文存档，作为你‘提问能力作品集’的第一件展品。'
