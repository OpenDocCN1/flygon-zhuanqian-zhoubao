  - 1、动怒说明我们没有做好事先准备，觉得别人的行为可能让我们的利益受损……那就在事先设计好自己的服务流程和话术去提高包容性。
  - 2、把每一次沟通看成是匹配过程，寻找筛选合适的人的过程，而不是别人一定欠我们什么。开门做生意，有些基础的解释成本必须要承担，线下开饭店你也得允许别人进来免费看看菜单不是。
  - 3、你的态度就是你的框架，学会课题分离。我有我的原则和流程，你有你的无知和手生，当你触碰我的原则，那我就用事先设计好的应对方法和你隔离……
  - 礼貌就是：我尊重你表达和寻求帮助的权利，但同时我有我的流程和立场，如果你也尊重且恰好有需求，那就共同完成一段生命体验，如果缘分没到，先擦肩而过。
