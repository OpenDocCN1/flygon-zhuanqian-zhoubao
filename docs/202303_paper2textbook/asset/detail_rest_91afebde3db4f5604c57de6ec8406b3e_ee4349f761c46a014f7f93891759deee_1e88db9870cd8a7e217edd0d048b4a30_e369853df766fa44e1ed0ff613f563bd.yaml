learning_targets:
- 理解个人IP在私域电商冷启动中的信任构建机制
- 掌握小红书店铺与快团团公私域联动的完整变现闭环设计
- 熟悉供应链‘三步验货法’及自担赔付兜底的风控实操体系
- 掌握熟人高频复购信任模型的核心要素与服务体系设计
- 能运用‘趋势×擅长×累积’公式评估创业项目的适配度
- 掌握快团团私域电商不同阶段的量化运营基准指标
- 理解公域引流作为必修硬技能的战略定位与执行方法
- 能设计客户全生命周期服务体系将交易升级为情感连接
concept_map:
- 私域社交电商体系
- ├── 核心信任引擎
- │   ├── 个人IP驱动选品（真实人设建立初始信任） —— P001
- │   ├── 熟人高频复购信任模型（真心服务深化连接） —— P004
- │   └── 供应链三步验货法（亲测背书+自担赔付） —— P003
- ├── 公私域双轮驱动模型
- │   ├── 公域端：小红书/抖音种草引流（必修硬技能） —— P008
- │   ├── 私域端：快团团/社群/朋友圈高频复购（LTV最大化） —— P002
- │   └── 联动闭环：内容引流→店铺首单→私域留存→裂变复购 —— P002
- ├── 运营阶段量化基准
- │   ├── 入门期（0-3月）：私域500-2000人/月销1-5万 —— P006
- │   ├── 成长期（3-12月）：私域5000-2万/月销10-50万 —— P006
- │   └── 成熟期（1年+）：私域10万+/月销200万/利润率20% —— P006
- ├── 创业决策适配性法则
- │   ├── 成功概率 = 趋势适配度 × 自身擅长度 × 累积效应强度 —— P005
- │   ├── 避坑：硬核技术/纯公域流量/无累积赛道 —— P005
- │   └── 优选：私域社交电商/垂类知识付费/同城服务整合 —— P005
- └── 客户全生命周期服务体系
- '    ├── 基础层：售后兜底/退换货无忧 —— P007'
- '    ├── 增值层：会员福利/专属折扣/生日权益 —— P007'
- '    └── 精神层：读书会/专业咨询/情绪陪伴/圈层社交 —— P007'
life_analogy:
- 想象私域社交电商是一场**‘自家院子里的邻里集市’**：
- '- **个人IP** = 院子主人‘老张’的‘金字招牌’（大家都知道老张为自家娃挑东西最讲究）'
- '- **快团团** = 老张搭在院里的‘团购摊位’（邻里熟人凑单、免运费、比超市鲜）'
- '- **三步验货法** = 老张自己先买三份尝尝、全家人轮流试吃、坏了自己先垫钱退给邻居'
- '- **真心服务** = 老张不光卖菜，还帮邻居带娃、修家电、办读书会（非标服务筑情感护城河）'
- '- **公域引流** = 老张在村口大喇叭/微信群里吆喝‘今儿新到的有机苹果，欢迎尝鲜’（技能化、常态化）'
- '- **趋势适配** = 选‘卖生鲜/日用’这种高频刚需，不搞‘卖量子计算机’这种村里没人懂的生意'
- 就像老张靠‘人品好、货真价实、服务周、常吆喝’把院子经营成全村最旺的集市，私域电商也靠‘真人设、真亲测、真服务、懂公域’跑通商业闭环。
summary:
- concept: 个人IP驱动选品
  desc: 以真实人生经历+垂直专业身份绑定叙事，反向定义选品，信任转化率显著高于商业广告
- concept: 公私域联动变现模型
  desc: 小红书店铺承接公域首单建信任，快团团沉淀私域高频复购裂变，流量复用率高、利润结构最优
- concept: 供应链三步验货法
  desc: 新供货商试单3款→全品亲测制→自担赔付兜底，前置验证成本远低于事后信任修复成本
- concept: 熟人高频复购信任模型
  desc: 好产品(亲测背书)+真心服务(非标增值)=初始信任+深度连接，构建细水长流复购飞轮
- concept: 创业趋势适配性法则
  desc: 成功概率=趋势适配度×自身擅长度×累积效应强度，避开高门槛/长周期/无累积赛道
- concept: 快团团量化运营基准
  desc: 入门期私域500-2000人/月销1-5万，成熟期私域10万+/月销200万/利润率20%，单品类天花板低需拓品
- concept: 公域引流必修硬技能
  desc: 私域有天花板，公域无上限；公域运营是可训练硬技能，需列入战略规划与日常KPI
- concept: 客户全生命周期服务体系
  desc: 基础层(售后)→增值层(福利)→精神层(陪伴)，将交易升级为情感连接，构建非标服务护城河
exercises:
- 'no': 1
  title: 设计你的个人IP人设卡
  contents:
  - 假设你要在小红书开店卖母婴产品，请完成：
  - 1. 写出你的‘核心人设故事’（如：为孩子做玩具的玩具设计师妈妈），要求包含：真实身份标签+具体初心事件+垂直专业能力
  - 2. 列出该人设天然关联的3个选品方向，并说明每个方向的‘信任背书逻辑’
  - 3. 识别该人设的2个潜在风险边界（如：造假暴露/精力半径限制），并设计对应规避措施
  - 回答问题：
  - '- 为什么‘真实性’是人设IP的生命线？一旦翻车如何挽回？'
  - '- 人设IP如何剥离为品牌IP实现规模化？'
- 'no': 2
  title: 推演公私域联动单客经济账
  contents:
  - 已知：小红书店铺获客成本(CAC) 30元/单，首单利润 -10元（亏本引流）；快团团私域复购周期 30天/次，客单利润 25元，年复购率 80%，留存周期
    2年。
  - 1. 计算单客全生命周期价值(LTV)与投入产出比(ROI)
  - 2. 若公域获客成本上涨至 50元/单，首单亏损扩大至 -20元，模型是否仍可行？临界点在哪里？
  - 3. 设计3个‘公域内容→私域钩子’的具体转化路径（如：笔记评论区‘扣1领避坑指南’→加微信→进快团团群）
  - 回答问题：
  - '- 为什么说‘公域薄利引流、私域厚利复购’是底层利润逻辑？'
  - '- 如何通过‘选品反哺’利用公域数据指导私域备货？'
- 'no': 3
  title: 供应链风控实战演练
  contents:
  - 场景：你新上架一款进口母婴辅食，供货商报价有优势但无合作历史。请按‘三步验货法’设计执行清单：
  - 1. 步骤一·试单验证：买哪3款？测哪3个核心指标（物流/包装/售后）？合格线在哪里？
  - 2. 步骤二·全品亲测：团队谁参与？测评维度表如何设计？‘无亲测不推荐’如何落地执行？
  - 3. 步骤三·赔付兜底机制：单单赔付上限设多少？虚假发货/延迟发货/质量问题分别怎么赔？事后如何向供应商追偿？
  - 回答问题：
  - '- SKU超过200款时，如何将‘全品亲测’降级为‘分级抽检’而不失控？'
  - '- 供应商知晓‘亲测制’后可能作弊（如只发样品好货），如何识别与防范？'
- 'no': 4
  title: 评估某创业项目的趋势适配度
  contents:
  - 项目：开发一款‘AI生成儿童绘本’的SaaS工具，面向宝妈群体，订阅制收费。
  - 请用‘趋势适配度×自身擅长度×累积效应强度’三维打分（1-10分）并论证：
  - 1. 趋势适配度：是否顺应‘去中心化信任/AI赋能/私域累积’大趋势？是否处于红利期还是泡沫期？
  - 2. 自身擅长度：假设你是‘全职宝妈+幼教从业者+零代码基础’，优势在哪？短板如何补？
  - 3. 累积效应强度：用户/数据/品牌/SOP是否随时间复利？是否存在单品类天花板？
  - 回答问题：
  - '- 该项目属于‘硬核技术赛道’还是‘工具赋能赛道’？边界在哪里？'
  - '- 若评分总分<20分，你会劝退还是建议微创新切入？如何微创新？'
- 'no': 5
  title: 设计客户全生命周期服务日历（季度版）
  contents:
  - 针对一个‘私域母婴社群’（100人规模，月销3000元利润基准），请设计一季度服务日历：
  - 1. 基础层：售后响应SLA（分钟级/小时级）、退换货话术模板、异常订单兜底流程
  - 2. 增值层：会员日主题/福利/玩法（每月1次）、专属折扣/生日权益发放机制
  - 3. 精神层：读书会选书/频次/主持人、专业咨询主题/专家邀约、情绪陪伴互动话题
  - 4. 量化考核：每项服务的投入成本(时间/金钱)、预期产出(复购率提升/转介绍数/满意度NPS)
  - 回答问题：
  - '- 如何防止‘过度服务’透支创始人精力？服务边界如何设定？'
  - '- 非标服务规模化的核心矛盾是什么？分级服务体系如何设计？'
