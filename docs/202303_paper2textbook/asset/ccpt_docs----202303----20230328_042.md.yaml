paper: docs/202303/20230328_042.md
desc: 该素材分享了作者利用 ChatGPT (GPT-4) 结合“航海手册”爆文方法论，从零开始运营公众号，7天内实现单篇阅读量10W+、收益1000+的实战复盘。核心内容包含一个标准化的6步AI协作写作流程（调教风格、选题、大纲、分段详写、人工润色合并、标题优化）及5条关键心得，强调“人机协作”而非“全自动生成”，揭示了GPT-4在中文情感赛道的商业化可行性及操作细节。
concepts:
- name: AI协作写作流程
  desc: 一种将AI作为核心生产力工具、人类作为导演与质检员的标准化内容生产范式，包含风格调教、选题、大纲、分段详写、合并润色、标题生成六个环节。
  is_original: true
  excerpt:
  - 写作流程分为 6 个步骤：1. 调教写作风格，一次调教后可长期使用。 2. 选题。 3. 写大纲。 4. 详写各部分内容。 5. 合并内容，人工润色。 6.
    写标题。
- name: 风格调教
  desc: 通过将爆文模板、开屏雷击等方法论文档及范文一次性喂入上下文窗口，完成模型写作风格的长期定向微调。
  is_original: true
  excerpt:
  - 从航海手册中找出⌈爆文模板⌋、⌈开屏雷击⌋这些内容，一股脑的都给 ChatGPT 喂进去。还可以在公众号上找几篇文章作为范文喂进去，让 ChatGPT 学习。
- name: 选题逆向工程
  desc: 以已验证的爆款文章为种子，提取核心情节输入AI生成多个变体选题，再经人工筛选修改，实现选题素材的无限复用与创新。
  is_original: true
  excerpt:
  - 从公众号上找一篇爆过的文章，提取情节喂给 ChatGPT。以此作为选题案例，让 ChatGPT 生成多个选项...用了这个方法，从此再也不用自己编故事了，题材取之不尽。
- name: 分段详写策略
  desc: 避免一次性生成全文，而是按大纲逐节生成，并对每节施加字数限制、重点描写要求等细粒度指令控制输出质量。
  is_original: true
  excerpt:
  - 可以提出需要重点描写的内容、字数限制和其它要求。
- name: 人机分工比 (4:6 法则)
  desc: 全流程耗时人工占40%、AI占60%；文字层面AI完成80%以上（生成），人工主攻20%（删减冗余、衔接润色、标题决策）。
  is_original: true
  excerpt:
  - 一篇文章从构思到发布，耗时约 1~2 小时...一篇文章人工占 40%，ChatGPT 占 60%。人工包括：选题、设定情节、调整润色 ChatGPT 生成的文章，写标题，上传发布。具体到文字部分，ChatGPT
    可以完成 80%以上，人工主要是删除多余的内容。
methods:
- name: __overview__
  desc: 基于 GPT-4 的公众号情感赛道爆文标准化生产 SOP（标准作业程序），核心在于“方法论文档预喂养+分步骨架化生成+人工兜底润色”。
  excerpt:
  - 写作流程分为 6 个步骤：1. 调教写作风格... 2. 选题... 3. 写大纲... 4. 详写各部分内容... 5. 合并内容，人工润色... 6.
    写标题。
- name: 风格调教 Prompt 工程
  desc: 将结构化方法论（爆文模板、开屏雷击）与少样本范文（Few-shot）混合注入 System Prompt 或首轮对话，建立长期有效的写作人设。
  excerpt:
  - 从航海手册中找出⌈爆文模板⌋、⌈开屏雷击⌋这些内容，一股脑的都给 ChatGPT 喂进去。还可以在公众号上找几篇文章作为范文喂进去，让 ChatGPT 学习。
- name: 迭代式选题生成法
  desc: 输入爆款种子情节 -> AI生成多选项 -> 人工提出具体修改意见 -> AI再生成 -> 循环至满意 -> 人工终审定稿。
  excerpt:
  - 提取情节喂给 ChatGPT。以此作为选题案例，让 ChatGPT 生成多个选项。觉得不满意就提出具体修改要求，然后继续生成，直到出现相对满意的选题。再经人工对选题进行修改，最终确定选题。
- name: 大纲驱动分段生成法
  desc: 先由AI产出大纲并经人工确认，再逐节点发送详写指令（含字数、侧重点），最后拼接合并，解决长文生成的连贯性与失控问题。
  excerpt:
  - 让 ChatGPT 根据选题写大纲。同样，不满意就让它改，改到满意为止。
  - 可以提出需要重点描写的内容、字数限制和其它要求。
  - 人工修改润色必不可少，ChatGPT 不能保证每个部分衔接的非常好，经常会有多余的内容。
- name: 标题人工主导+AI辅思法
  desc: 核心标题由人工基于经验直觉创作，AI仅作为提供备选灵感的辅助角色，承认当前模型在“标题党”层面的短板。
  excerpt:
  - 人工起一个吸引人的标题。尝试过 ChatGPT 直接生成标题，但不是太满意。可以让 ChatGPT 起几个提供灵感。如何让 ChatGPT 生成一个好标题，我还在调教中。
theorems:
- name: GPT-4 质量阈值定律
  desc: 在中文公众号情感写作场景下，GPT-4 达到了商业化可用的质量阈值，而 GPT-3.5 无法胜任，模型能力是成败的硬性门槛。
  excerpt:
  - 一定要用 GPT-4。相比 3.5 提升很多，除了速度。
- name: 反全自动化生产原则
  desc: 追求全自动批量生成会导致内容质量崩塌，高质量内容生产必须保留人类在选题决策、逻辑把关、审美润色、标题创意等关键节点的介入。
  excerpt:
  - 不要想文章全部由 ChatGPT 自动写，或批量生成，那样质量不会太高。
- name: 推理速度瓶颈制约论
  desc: 当前生产效率的主要瓶颈在于模型推理速度（GPT-4 慢）及网络稳定性，而非提示词工程或流程设计，白天创作效率显著高于夜间。
  excerpt:
  - 一篇文章从构思到发布，耗时约 1~2 小时。主要是因为 GPT-4 速度太慢，我本人长时间处于待机状态。最好不要晚上写，速度比白天慢很多，还经常出现网络问题。
findings:
- name: 零基础冷启动商业化验证
  desc: '[evidence] 新账号从0开始，连续发文7天，第7篇情感文实现单篇阅读量 100,000+，流量主单篇收益 1000+，验证了“AI+航海手册方法论”在情感赛道的冷启动可行性。'
  excerpt:
  - 公众号从 0 开始，自 3 月 18 日起，每天发一篇情感文，全是用 ChatGPT 写的。3 月 24 日发的第 7 篇文章，单篇阅读量 10W+，单篇收益
    1000+。
- name: 情感赛道题材无限复用验证
  desc: '[evidence] 通过“选题逆向工程”方法，成功解决了情感号“编故事”难、素材枯竭的痛点，实现了选题素材的可持续供给。'
  excerpt:
  - 用了这个方法，从此再也不用自己编故事了，题材取之不尽。
- name: 上下文窗口容量实测
  desc: '[evidence] 单次对话上下文窗口可无压力容纳约 1500 字的全文爆款范文作为 Few-shot 样本输入，支持长文本风格迁移。'
  excerpt:
  - 一般情况下，一篇爆文 1500 字，粘贴进去没问题。
- name: AI生成内容典型缺陷画像
  desc: '[evidence] 实战中发现AI分段生成内容普遍存在“段落间衔接生硬”、“冗余废话多”两大通病，需人工专项清洗。'
  excerpt:
  - ChatGPT 不能保证每个部分衔接的非常好，经常会有多余的内容。
  - 具体到文字部分，ChatGPT 可以完成 80%以上，人工主要是删除多余的内容。
