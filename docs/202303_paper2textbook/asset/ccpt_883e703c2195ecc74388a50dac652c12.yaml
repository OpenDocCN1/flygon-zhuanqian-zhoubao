paper: docs/202303/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf.md
desc: 该素材由生财有术社群成员杨洋整理，基于8个月社群学习及5次航海实战经验，系统拆解了10个典型赚钱案例（含AI绘画材料包、抖音奶粉、机票代理、祛斑直播、公考培训、代运营、小红书无货源、私域引流等）及流量获客底层逻辑。核心主张为：所有生意本质是流量生意，普通人致富路径为「研究-模仿-超越」标杆案例，掌握「赚钱逻辑=利润×单价×转化率×曝光」公式，通过「公域引流+私域变现」闭环实现变现，强调内容生产（抄/杂交/原创）与长期主义复利思维。
concepts:
- name: 研究-模仿-超越 (RMS模型)
  desc: 素材核心方法论，指通过拆解竞品痛点/流量来源/盈利模式进行研究，像素级复制执行细节，再在模仿基础上创新突破的闭环学习路径。
  is_original: true
  excerpt:
  - 营销最好的方法：找竞争对手的足迹，然后复制。最聪明的做法是，做别人做过的东西，学习最佳案例，然后再超越。
  - 【研究 模仿 超越】通过挖掘出痛点研究市场上解决这种痛点的对手 查清楚对手的注册时间、收录情况、以及最重要的是他的主要流量是怎么来的、盈利情况接下来就是模仿
    模仿 模仿 学会取舍，在模仿的路途中创新
- name: 赚钱逻辑公式
  desc: 量化生意模型的核心公式：目标收入 = 利润 × 单价 × 转化率(5%) × 曝光人数，用于拆解案例可行性及设定执行指标。
  is_original: false
  excerpt:
  - 赚钱逻辑是什么?(目标收入=利润*单价*转化率5%*曝光人数,)
- name: 公域引流+私域变现闭环
  desc: 主流变现模型：在公域平台(抖音/小红书/视频号)通过内容/直播/钩子获客，沉淀至微信私域(社群/个人号/朋友圈)完成高客单价转化、复购及裂变。
  is_original: false
  excerpt:
  - 公域引流+私域变现，已经成为了当下最容易成单的模式，未来也会存在；
  - 免费领全套胎教音乐为诱饵，吸引粉丝进群，设置钩子“加好友进孕妈福利群/羊毛群” 进入私域。
  - 流量的尽头是微信私域
- name: 四频共振/五频共振流量模型
  desc: 直播间流量放大模型：免费流量+付费流量+短视频流量+产品流量（四频共振）或扩展为视频号五步法（矩阵测品→直播升级→付费占比提升→私域积累→产品裂变）。
  is_original: true
  excerpt:
  - 先有人（免费流量+付费流量+短视频流量+产品流量）四频共振
  - 视频号引流的五频共振：第一步...矩阵测品...第二步...直播升级...第三步...付费流量...第四步...私域积累...第五步...产品裂变
- name: 代运营全链路交付体系
  desc: 将代运营拆解为流量端(建站/引流/品宣)、营销端、转化端(私域/供应链/物流)三模块，并定义四大交付模式(招商裂变/知识付费/创始人IP/垂类引流)及转化关键动作(电话邀约/沙龙/逼单)。
  is_original: true
  excerpt:
  - 代运营： 服务外包行业的板块...流量端：建站建店...营销端： 引流，做推广，品宣...转化端：客户转化和私域供应链，仓储和物流
  - 代运营交付： ①招商裂变 ②知识付费 ③创始人IP ④垂类引流
  - 【代运营转化的关键点，是电话联系邀约，见面才有成交率】
- name: 内容生产三阶跃迁 (抄-杂交-原创)
  desc: 内容创作进阶路径：初期直接抄袭爆款，中期杂交重组多源素材，后期沉淀原创方法论；配合素材库积累实现“捡钱式”变现。
  is_original: true
  excerpt:
  - 怎么做内容？ 1. 抄 2. 杂交 3. 原创
  - 卖点锁定了，跟卖点有关的素材都收集起来。收集的素材多了，赚钱就是捡钱，捡钱就是赚钱。
- name: 停留模型与成交模型
  desc: 直播间算法底层逻辑：停留时长决定推流速度(停留模型)，成交密度决定推流模型(成交模型)；通过引流品(9.9元)拉停留、爆品(299元)打成交模型、利润品赚钱的排品策略。
  is_original: true
  excerpt:
  - 停留模型决定了推流速度，成交模型决定了推流模型。拉高在线人数来实现直播间在线人数增多。----憋单
  - 排品： 引流9.9元，爆品（利润品）299元，正价附属（修复液）99元，正价附属品（点斑水）59.8.
- name: OEM合作模式
  desc: 教育培训行业特有的供应链协作模式：品牌方提供课程内容/品牌，合作方负责招生/销售，双方分成；素材作者通过该模式实现营收从700万到1500万增长。
  is_original: false
  excerpt:
  - 我们的网课搭建从18年做了OEM模式合作，18年营业额700万，19年营业额1200万，20年营业额1500万。而这个业绩的来源仅仅是新增了OEM 的合作方案。
methods:
- name: __overview__
  desc: 素材整体方法论：基于社群高质量案例库，采用「结构化拆解框架(为什么拆解/赚钱逻辑/客户付费理由/产品推广/营销方法/执行原则)」逐个拆解10个实战案例，提炼跨案例的通用规律(流量获取/私域运营/内容生产/直播模型)，形成可迁移的赚钱方法论体系。
  excerpt:
  - 接下来就把这两天拆解的赚钱逻辑奉献给大家。把包裹在厚厚内容下的骨架展现给大家。
  - 1.  为什么拆解？（能操作，利润高，项目优点） 2.  赚钱逻辑是什么?... 3.  客户为什么付费？... 4.  搞定产品和推广... 5.  营销最好的方法...
    6.  在效率和质量上，先保证优质，在固提高效率。 7.  【研究 模仿 超越】...
- name: 案例拆解七步框架
  desc: 统一的案例分析模板：①拆解理由(可操作性/利润/优势) ②赚钱逻辑(公式化拆解) ③付费动机(内容/工具/服务/刚需/痛点) ④产品与推广(供应链/引流钩子/渠道/私域运营)
    ⑤营销核心方法(竞品复制/RMS) ⑥执行原则(质量先行/取舍创新) ⑦RMS落地步骤。
  excerpt:
  - '### 一、案例拆解实操办法----原文转自@亦仁... 1. 为什么拆解？... 2. 赚钱逻辑是什么?... 3. 客户为什么付费？... 4. 搞定产品和推广...
    5. 营销最好的方法... 6. 在效率和质量上... 7. 【研究 模仿 超越】...'
- name: AI赋能内容电商生产线
  desc: 结合ChatGPT/AI绘画工具，实现选品设计(AI生成刺绣图)→内容生产(ChatGPT写文案)→多平台分发(小红书/抖音)→私域转化的低成本高效流程。
  excerpt:
  - 先通过AI绘画，画出好看想要的刺绣图，展示在小红书上，进行引流。
  - 进行AI刺绣绘画设计发布小红书，用ChatGPT生成文案进行销售。同时开启私域。
  - 参加了ChatGPT+AI绘画航海，摸透了ChatGPT+数字人的直播模式
- name: 小红书无货源像素级模仿法
  desc: 小红书电商冷启动标准动作：选品(跨平台爆款/热点周边/垂类单品)→开店垂直账号→对标账号像素级模仿(一帧一帧比对图片/文案/布局)→长尾关键词布局→持续复制放大。
  excerpt:
  - 查找对标账号像素级模仿，一帧一帧的比对，一模一样的图片展示引发流量。持续去做。
  - 选品技巧：1.其他平台火过的 2.热点周边... 3.细分垂直领域... 4.热门赛道...
  - 布局长尾关键词，得到持续的流量
- name: 视频号矩阵测品-裂变五步法
  desc: 视频号从0到1的标准化SOP：Step1 低成本矩阵搬运测品(30-60号)；Step2 筛选优质号升级直播间(主播/话术/场景)；Step3 引入付费流量提升占比；Step4
    私域沉淀解决冷启动与复购；Step5 产品裂变设计(转发送券)实现自传播。
  excerpt:
  - 视频号引流的五频共振：第一步，做大批量的账号（30-60），靠低成本的搬运视频模式...第二步...直播间的升级...第三步，恒久稳定的付费流量...第四步，做微信私域的积累...第五步，做产品升级，让用户转发...实现裂变。
- name: 直播间排品与模型矫正操盘法
  desc: 直播带货标准化运营动作：设计引流品/爆品/利润品/附属品价格梯队；前期吃自然流+短视频流；中控配合水军憋单拉停留模型；第七场起投随心推(200元)打成交模型；矫正精准人群标签拓宽流量池。
  excerpt:
  - 排品： 引流9.9元，爆品（利润品）299元，正价附属（修复液）99元，正价附属品（点斑水）59.8.
  - 第七场的时候开始付费，投小店随心推，基本上200元就够了。前期吃自然流，以短视频+自然流为主。
  - 自然流量直播间...如果还想做好这个品就需要拓宽人群，投千川是可以拓人群的。
- name: 流量获取六大方法论+三渠道矩阵
  desc: 流量实操通则：6大战术(留诱饵/留钩子/共情/量变质/打磨个人IP/做好后端) × 3大渠道(音频/视频/图文) = 可落地的流量获取组合拳；核心心法：内容即诱饵，价值决定流量成本，长期主义对抗不确定性。
  excerpt:
  - 获得流量有用的几句话！6个方法论：1. 留好诱饵... 2. 留好钩子... 3. 共情... 4. 量变质... 5. 持续的打磨自己... 6. 做好后端服务...
  - 3个渠道：音频：喜马拉雅 视频：抖音、快手、视频号、哔哩哔哩，小红书 文章：知乎、公众号
  - 做好六个方法论+3个渠道，搞不来流量就没天理了。
- name: 代运营方案分层销售法
  desc: 根据服务深度分层定价：前端代运营(仅流量端)给案例手册+口头思路，以案例/经历/成果建立信任；全案代运营(前后端全链路)需输出详细落地方案，收策划费/定金设门槛，用专业度筛选优质客户。
  excerpt:
  - 三、客户要方案怎么办？ 只作流量端的前端代运营：给案例手册+口头思路。【案例牛+经历牛+成果牛】 前端后端都做的全案代运营：细节多...需要收策划费或者定金来做门槛。
    我的诚意是把方案做好，你的诚意是出一部分定金。
theorems:
- name: 生意本质即流量定理
  desc: 所有好生意本质都是流量生意，商业闭环为：流量→转化→成交→交付→复购/留存→新客增长；流量是启动飞轮的唯一钥匙，无流量则无生意。
  excerpt:
  - 所有的好生意都是流量生意 流量--转化--成交--交付---复购，老客户留存，新客户增长。这就是一个好生意的来源。 那在这些环节中，最重要的就是流量问题。打开流量，拉新是所有生意变好的开始。
- name: 红利期捕捉与迁移定律
  desc: 平台红利周期约1-2年出现一次(邮箱/百度/淘公/拼多多/美团/视频号/小红书)；核心能力非单一平台技巧，而是「敏锐嗅觉+快速执行力+方法迁移能力」；看到详细教程分享时红利已过，方法论可迁移至下一流量池。
  excerpt:
  - 这样的机会，每一两年就会出现一次，需要的就是速度和执行力。 现在就是视频号和小红书两个大平台。
  - 等你看到别人分享出来详细的内容的时候，说明这个事已经提高门槛或者已经过时了。但是他们的方法是可以迁移到下一个流量池的。
- name: 流量价值分层三阶论
  desc: 流量变现层级递进：L1 空手套白狼(卖别人货,红利过走人) → L2 平台稳健生意(自有产品+平台规则,寄生生存) → L3 伟大公司(流量沉淀自有平台,口碑裂变,建立护城河)；建议追求L2/L3。
  excerpt:
  - 如何最大化流量的价值？ 1. 空手套白狼...等红利期过去，啥也没留下... 2. 平台上的稳健生意... 3. 伟大的公司...把流量好过来，按到自己的平台上。
- name: 内容价值决定流量成本定律
  desc: 内容是撬动流量唯一杠杆；优质内容标准动态演进(取决于用户审美进步速率)；内容生产能力越强，流量获取成本越低；火过的内容重复拍10遍仍有效，需储备10000选题库与100条爆款库。
  excerpt:
  - 内容永远是撬动流量最好的杠杆，好内容没有标准，取决于用户审美的进步速率。
  - 产生优质内容跟平台换流量，产生内容的能力决定了流量成本的高低。
  - 稳定的输出爆款，就要提前准备10000条行业选题，100条爆过的。
- name: 私域为王·渠道即管道论
  desc: 渠道本质是连接品牌与消费者的管道(实体门店/微信裂变/短视频IP)；流量尽头必然是微信私域；私域管理五步法(培育/激活/转化/关怀/复购)是生意长期主义的基石；最简单成交方式是做客户引领者。
  excerpt:
  - 渠道的意义就在于人家想买的时候就能够买到你...渠道就是联通品牌和消费者之间的管道。
  - 流量的尽头是微信私域
  - 私域管理：培育，激活，转化，关怀，复购
  - 最简单的成交方式是做客户的引领者
- name: IP崛起三阶段论
  desc: 个人品牌成长规律：自说(自我输出) → 他说(他人传播/背书) → 传说(品牌资产化/自传播)；IP火的核心是信任，视频>图文、出镜>不出镜、真人建立信任加速转化。
  excerpt:
  - ip崛起的三个阶段：自说，他说，传说
  - 视频比图文效率高，出镜比不出镜信任高，信任是转化的关键，这个是IP火的原因
- name: 刚需/高频/高粘性产品优先论
  desc: 选品核心标准：刚需(奶粉/考证/祛斑) > 高频复购 > 低退货率(祛斑30% vs 服饰高退货) > 高客单价利润空间；产品属性决定商业模式上限(知识付费长周期高利润/实物电商供应链壁垒)。
  excerpt:
  - 奶粉是硬通产品，只要有孩子出生就要喝奶粉。属于刚需产品。
  - 祛斑属于小蓝海，综合退货率30%左右，比较低，产品粘性强，适合做私域。
  - 公考...教育付费的高利润硬刚需...知识付费变现模式...制作时间比较长，适合长期做。
findings:
- name: 教育培训OEM模式验证营收跃迁
  desc: '[evidence] 作者亲历案例：引入OEM合作模式前后，公司营收从18年700万→19年1200万→20年1500万，单一业务模式创新实现年复合增长率超46%，验证供应链协作对教育培训业务的杠杆作用。'
  excerpt:
  - 我们的网课搭建从18年做了OEM模式合作，18年营业额700万，19年营业额1200万，20年营业额1500万。而这个业绩的来源仅仅是新增了OEM 的合作方案。
- name: AI绘画材料包小红书冷启动实测
  desc: '[claim] 案例@清华宣称：单价168元材料包利润率60%+，通过AI生成刺绣图→小红书引流→快团团成交→工厂供货→达人直播培训收费，构建“卖材料+收学费+赚差价”三重收入模型，操作简单好落地。'
  excerpt:
  - 一份材料包卖168，中间的利润至少有60%左右...教会别人卖材料包还能收学费+直播训练营费用+中间差价
  - 先通过AI绘画，画出好看想要的刺绣图，展示在小红书上，进行引流。与工厂合作生产刺绣材料，培养自己的达人，进行电商平台售卖。
- name: 抖音奶粉私域高复购模型实测数据
  desc: '[claim] 案例@生财笔记宣称：胎教音乐引流日引100+宝妈，月销8000箱奶粉，净利85万/6个月；四大引流手法(视频挂价/直播音乐/黑科技加群/朋友圈运营)配合代理分级(499/988/2888)实现裂变。'
  excerpt:
  - 6个月婴儿奶粉，获得85万利润。
  - 每天引流100+宝妈到微信，一个月能卖8000箱。高复购，高利润。
  - 推广方法一...二...三...四... 变现方法：一：做社群淘客。二：招代理变现。499门槛费...988代理...2888合伙人...
- name: 祛斑直播间低成本冷启动实测
  desc: '[claim] 案例@卓斯基宣称：5000元保证金+2水军号+200元随心推即可启动；排品策略(9.9引流/299爆品/99/59.8附属)配合憋单话术，利用停留/成交模型获自然流，退货率仅30%远低行业均值，适合私域沉淀。'
  excerpt:
  - 开通抖音小店，交5000的保证金，两个水军号，投抖币，投流操作。
  - 排品： 引流9.9元，爆品（利润品）299元... 第七场的时候开始付费，投小店随心推，基本上200元就够了。
  - 祛斑属于小蓝海，综合退货率30%左右，比较低，产品粘性强，适合做私域。
- name: 小红书无货源像素级模仿获流验证
  desc: '[claim] 案例@曜文宣称：小红书电商扶持期，无货源模式通过“对标账号像素级模仿(一帧一帧比对)”+长尾关键词布局+垂直账号垂类发内容，可低成本获取精准搜索流量与推荐流量，选品策略可复制跨平台爆款。'
  excerpt:
  - 查找对标账号像素级模仿，一帧一帧的比对，一模一样的图片展示引发流量。持续去做。
  - 提高笔记曝光，1.首页推荐 2.关键词搜索... 布局长尾关键词，得到持续的流量
  - 选品技巧：1.其他平台火过的 2.热点周边...
- name: 公域内容引流私域转化实测比率
  desc: '[evidence] 案例@小野实测：利用公众号文案改编小红书内容，吸粉600人，引流私域1000-2000人(引流率超100%，含社群裂变)；采用“释放价值留一半存一半”策略，配合社群标签精准推送，验证公私域联动高效性。'
  excerpt:
  - 利用写公众号的文案能力优势，在小红书上进行分享...吸粉600人，引流私域1000-2000人。（释放价值，留一半存一半）
  - 建立社群，引流到本地孕产妇交流群，引流500+ 微信私域打标签，精准推送消息。
- name: 流量获取‘抄-杂交-原创’内容生产验证
  desc: '[evidence] 作者及社群多案例验证：所有流量源于优质内容，优质内容即解决问题；建立卖点素材库→抄爆款→杂交重组→原创输出，可将内容生产转化为确定性“捡钱”流程；火过内容重拍10遍仍有效，选题库储备量(1万)决定爆款稳定产出。'
  excerpt:
  - 怎么做内容？ 1. 抄 2. 杂交 3. 原创... 卖点锁定了，跟卖点有关的素材都收集起来。收集的素材多了，赚钱就是捡钱，捡钱就是赚钱。
  - 火过的内容还会在火，重复拍10遍打底
  - 稳定的输出爆款，就要提前准备10000条行业选题，100条爆过的。
- name: 代运营前端/全案分层成交实测
  desc: '[evidence] 作者实战总结：前端代运营仅需“案例牛+经历牛+成果牛”三牛建立信任即可成交；全案代运营必须输出详细落地方案(预算/策划/人力/周期)，收取策划费/定金设门槛筛选客户，核心转化动作为“电话邀约→见面/沙龙→高频逼单”，见面成交率最高。'
  excerpt:
  - 只作流量端的前端代运营：给案例手册+口头思路。【案例牛+经历牛+成果牛】
  - 前端后端都做的全案代运营：细节多，没有方案很难讲清楚...需要收策划费或者定金来做门槛。
  - 【代运营转化的关键点，是电话联系邀约，见面才有成交率】
