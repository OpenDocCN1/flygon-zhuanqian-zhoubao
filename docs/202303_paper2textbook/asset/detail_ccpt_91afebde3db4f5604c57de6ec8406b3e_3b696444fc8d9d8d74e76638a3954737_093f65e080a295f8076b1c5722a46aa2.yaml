units:
- 'no': 1
  name: 组织信息过滤 —— 权力不对等下的真话缺失定律
  points:
  - '**为什么需要这个概念？**'
  - '- 管理者往往误以为自己掌握全局，实则是最后一个知道公司出问题的人'
  - '- 员工基于利益规避、面子维护、权力不对等，不敢向上传递真实负面信息'
  - '- 正式汇报渠道系统性失真，导致决策建立在虚假繁荣之上'
  - '**核心定义**'
  - '- 组织层级结构导致信息在上传下达中被筛选、修饰、隐瞒的现象'
  - '- 下级面临“说真话风险高、说假话成本低”的博弈结构，必然导致上级接收信息系统性失真'
  - '**关键性质**'
  - '- 单向透明：老板对下透明，下对老板不透明'
  - '- 普遍性：不限于老板-下属，同僚之间也不可能全说真话'
  - '- 隐蔽性：员工给出社会通用借口（如读书、换行业）掩盖真实不满'
  - '**典型例子**'
  - '- 袁世凯称帝前身边人造假报纸歌功颂德，83天后被迫撤销帝制'
  - '- 离职面谈：员工说“想读书/换赛道”，实则因对公司不满碍于面子不敢直说'
  - '- 评论区员工实证：说真话先得罪直系领导等着穿小鞋，老板衡量得失后装作看不到'
  - '**边界条件**'
  - '- 仅靠正式汇报渠道必成最后知情者，必须主动构建获取真相机制'
  - '- 心理安全感缺失时，任何激励机制都无法打通真话通道'
  - '- 适用于一切权力不对等的组织关系（企业、政府、军队等）'
  sources:
  - paper: docs/202303/20230328_003.md
    role: origin
  excerpts:
  - 员工不会完全说真话，你要努力了解公司的真相
  - 你的下属，你下属的下属，可能反馈的信息都不同，因为每个人都是站在自己的立场说问题的
  - 一个自己辞职的员工，你问他为什么离开公司，他可能会说想要读一个书，或者去别的行业看看，但很可能背后的原因是，他对公司有些方面很不满。但他碍于面子，也不会直说
  - 据说来袁世凯要复辟前...每份报纸对他都是赞美之词...登基83天后被迫撤销帝制
  - 无数次经历告诉我，如果我跟老板说真话，先把我的直系领导（安全总监）给得罪了...有时候不是不说，而是不能说，说了就等着被穿小鞋吧（评论区 双平）
  - 老板都是很聪明的有时候不是看不到，而是衡量各方面的得失后，装作看不到（评论区 双平）
- 'no': 2
  name: 管理盲区与认知滞后 —— 不主动破局必成瞎子
  points:
  - '**为什么需要这个概念？**'
  - '- 管理者身处信息金字塔顶端，仅接收过滤后的“好消息”'
  - '- 基层矛盾、员工真实诉求被层层拦截，管理者对真实运行状态一无所知'
  - '- 认知滞后具有必然性：不主动构建真相机制，仅靠正式汇报必成最后知情者'
  - '**核心定义**'
  - '- 管理者因信息过滤导致的认知偏差状态：自以为无事实则危机四伏'
  - '- 核心悖论：权力越大、层级越高，越容易成为信息孤岛'
  - '**关键性质**'
  - '- 滞后性：很可能下面闹开锅了，老板还不知道'
  - '- 系统性：源于组织结构而非个别员工素质'
  - '- 破坏性：决策建立在虚假数据上，导致战略性失误'
  - '**典型例子**'
  - '- 袁世凯假报纸案：每天看赞美之词，误判民心民意，83天帝制崩溃'
  - '- 离职面谈失真：员工给社会通用借口，隐瞒对管理层/文化/薪酬的真实不满'
  - '- 员工视角：说真话易得罪直系领导遭穿小鞋，老板装作看不到形成默契'
  - '**边界条件**'
  - '- 必须跳出单一汇报渠道，建立多层级交叉验证机制'
  - '- 需训练识别语言潜台词能力（如：没有痛快答应即拒绝）'
  - '- 创业前就应知道“做老板是个很难的活”，需有心理准备'
  sources:
  - paper: docs/202303/20230328_003.md
    role: origin
  excerpts:
  - 有些老板会天真地以为，自己没啥问题，其实他有可能是最后一个知道公司出问题的人
  - 袁世凯...身边的人每天给他看的都是假新闻，假报纸...登基83天后被迫撤销帝制
  - 我常常说：一个人没有痛快的答应，通常就是拒绝的意思。但还是有很多人参不透这层意思
  - 很可能下面闹开锅了，老板还不知道
  - 做老板是个很难的活，你在创业前就应该知道
- 'no': 3
  name: 获取真相三板斧 —— 跳级汇报、潜台词识别、心理安全感
  points:
  - '**为什么需要这个概念？**'
  - '- 单一汇报渠道必然失真，必须打破信息茧房主动获取真相'
  - '- 管理者无法直接消除权力不对等，只能通过方法论对冲其副作用'
  - '- 真相获取是管理者的核心生存技能，关乎决策质量与组织存亡'
  - '**核心定义**'
  - '- 一套主动打破组织信息过滤、拼凑真实运行状态的方法论组合'
  - '- 包含：跳级汇报/多层级交叉验证、非显性拒绝信号识别、建立心理安全感'
  - '**关键性质**'
  - '- 主动性：不能等真相上报，要亲自下沉去挖'
  - '- 交叉验证：对比不同立场（下属、下属的下属、同僚）信息差异拼凑真相'
  - '- 解码能力：识别“拖延/模糊/找借口”即为非显性拒绝'
  - '**典型例子**'
  - '- 跳级汇报：直接了解“下属的下属”反馈，对比一级汇报差异'
  - '- 潜台词识别：员工说“再考虑一下/有点难/下周再说”实为拒绝'
  - '- 心理安全感：只罚结果不罚报告问题，鼓励暴露坏消息'
  - '**边界条件**'
  - '- 方法论只能缓解无法根治，权力结构决定信息过滤本质属性'
  - '- 过度跳级可能破坏中层权威，需把握频次与方式'
  - '- 心理安全感建设需长期一致性，一次报复性惩罚即可摧毁'
  sources:
  - paper: docs/202303/20230328_003.md
    role: origin
  excerpts:
  - 这就需要你努力了解公司的真相，你的下属，你下属的下属，可能反馈的信息都不同
  - 这不仅仅需要你及时关注公司发生的事情，也要能看出其他人讲话的诚意
  - 我常常说：一个人没有痛快的答应，通常就是拒绝的意思
  - 对员工来说，说真话是一件有风险的事情，谁知道老板听了以后会怎么想？（评论区 丹娜）
- 'no': 4
  name: 闲鱼二手书“笨功夫”优于技术流 —— 真实感与从众心理转化律
  points:
  - '**为什么需要这个概念？**'
  - '- 新手迷信采集软件/ERP批量铺货，实则系统性丧失转化核心要素'
  - '- 非标品交易中，买家决策依赖“实拍图真实度”建立信任、“想要数/热门榜”触发从众'
  - '- 技术流导致图片质量差、基础数据为零、定价刚性，转化率极低'
  - '**核心定义**'
  - '- 在闲鱼二手书等非标C2C场景，人工精选图片、手动上架、人工养号（点想要、控价格、聊天回复）显著优于自动化工具'
  - '- “笨功夫”本质是对商品真实感的还原与社交证据的主动构建'
  - '**关键性质**'
  - '- 真实感：实拍图展示真实品相、瑕疵，建立买家信任'
  - '- 从众心理：前期低价引流积累“想要/销量/热门榜”，触发后续买家跟随'
  - '- 定价弹性：人工可前期压低价格引流，有数据后再慢慢涨价；软件铺货刚性定价无法调整'
  - '**典型例子**'
  - '- 老瞿团队/小嵩团队：找大学生精选图片手动上书，存活并规模化'
  - '- 同期技术流群体：采集软件批量铺货，普遍未拿到结果甚至因违规封号退出'
  - '- 买家决策模拟：4个同款书中，有实拍图+热门榜（选项2）与低价+有想要数（选项4）获点击，无数据高价选项被直接淘汰'
  - '**边界条件**'
  - '- 仅适用于非标品（二手书、旧物）等需要信任背书的交易场景'
  - '- 标准品（3C数码、标准化消费品）可能更适合自动化铺货'
  - '- 需配合标准化SOP（选品标准、拍照规范、话术库）规模化复制，不能纯靠人海战术'
  sources:
  - paper: docs/202303/20230328_086.md
    role: origin
  excerpts:
  - 他也都是一本本手动上书的，我们工作室也是全部找大学生，精选图片上书的，而同时期开始，那些一开始就各种技术手段的人，都没有拿到太大的结果。
  - 选择 2 的理由，就是实拍图真实，而且还是热门榜，一般人都会有从众心理；选择 4 的理由，就是价格便宜，至少还有几个想要
  - 系统采集上架的图书：1、质量基本上跟手动的存在较大的差距；2、批量铺货的人...根本没有心情给一些商品稍微做点数据...3、更不可能在前期把价格压低...
  - 市面上很多大佬...训练营，一个月下来，出单率不到 50%，月入过万的概率小于 10%。
- 'no': 5
  name: 小白创业“销售优先于供应链”公理 —— 货源陷阱与伪行动识别
  points:
  - '**为什么需要这个概念？**'
  - '- 新手将90%精力投入“找货源/选品/仓储”，实为逃避“搞流量/卖产品”核心难点'
  - '- 产品过剩时代，货源非稀缺资源；销售端跑通后，供应链会反向寻找销售端'
  - '- “找货源”提供虚假成就感，掩盖“不敢面对销售额”的恐惧，是典型伪勤奋'
  - '**核心定义**'
  - '- 创业初期核心稀缺能力是“销售/获客”，而非“供应链/货源”'
  - '- 货源陷阱：以寻找货源为借口麻痹自己，逃避业绩压力的心理防御机制'
  - '**关键性质**'
  - '- 优先级倒置：重供应链轻销售 = 逃避困难 + 伪勤奋'
  - '- 流量端聚焦：有限精力100%投入获取流量与转化销售（优化标题/图片/价格/文案、主动引流、客服促单）'
  - '- 零库存运营：利用无货源/一件代发模式，彻底外包仓储物流后端'
  - '**典型例子**'
  - '- 咨询者高频提问：“上架500本书一个月能赚多少？”“做几个号月入过万？”——责任外归，索要确定性承诺'
  - '- 老瞿实证：1000平米实体仓库利润 < 小区工作室30号无货源模式利润'
  - '- 圈友案例：仅凭一篇风向标文章（无操作流程），执行落地副业月入大几千，证明执行力>信息差'
  - '**边界条件**'
  - '- 适用于轻资产、低门槛、流量驱动的创业项目（电商、内容、服务等）'
  - '- 重资产、强供应链壁垒行业（制造、医药、硬科技）不适用'
  - '- 销售端跑通前，任何供应链投入都是沉没成本'
  sources:
  - paper: docs/202303/20230328_086.md
    role: origin
  excerpts:
  - 今天是一个产品过剩的时代，对于小白来说，货源没有任何意义，把仅有的精力花在搞流量上，花在卖产品上，只要你能卖出去，什么产品都会求着你。
  - 其实一个很重要的点是他不敢面对销售额，通过找货源来麻痹自己，去逃避业绩压力，找到了还挺有成就感，关键呢，还是卖不出去。
  - 我 1000 平米的二手仓库，还不如我在小区开个工作室做 30 个闲鱼帐号卖二手书无货源赚的多，很讽刺吧，实体是投入又大，又累，成本又高，利润又低。
  - 赚钱是教不会的，但是可以学会的，如果一个项目都是确定性的，那还有谁打工，还有谁去搬砖。
- 'no': 6
  name: 确定性陷阱与责任内归律 —— 成年人没有包赚的生意
  points:
  - '**为什么需要这个概念？**'
  - '- 新手渴望“跟着干包赚”“确定入场时机”“标准化SOP必出结果”，本质是责任外包'
  - '- 任何承诺确定性收益的项目/导师均不可信，成年人创业本质是在不确定性中试错学会赚钱'
  - '- 索要确定性即放弃了企业家应承担的风险溢价权利，注定被收割'
  - '**核心定义**'
  - '- 确定性陷阱：将“能否赚钱”、“何时入场”、“跟谁干包赚”等决策责任完全外包给他人的心理陷阱'
  - '- 责任内归律：赚钱概率与承担责任程度正相关，将选项目、执行、结果全链路责任内化为自我认知问题，成功率才显著提升'
  - '**关键性质**'
  - '- 无确定性：世界上没有人能逼你赚钱，别人也凭什么去逼你赚钱'
  - '- 试错本质：成年人创业=在不确定性中通过试错学会赚钱，而非执行确定性指令'
  - '- 心智重塑：从“索要承诺”转向“接受不确定、主动试错、快速迭代”'
  - '**典型例子**'
  - '- 典型提问：“我上架500本书一个月能赚多少？”“现在做二手书来不及了？”“跟着你干确定能赚钱吗？”'
  - '- 训练营数据：月费大几千，出单率<50%，月入过万概率<10% —— 低估难度导致高放弃率'
  - '- 圈友正向案例：仅凭一篇简单文章（无操作流程），靠执行力落地月入大几千'
  - '**边界条件**'
  - '- 知识付费本质是“避坑工具”而非“致富门票”，核心价值在于缩短试错周期、规避致命坑点'
  - '- 项目分层模型：初/中/高级需匹配能力圈，盲目跟风高阶项目必死'
  - '- 认知匹配决策法：先盘点自身优劣势/能力边界，再分析项目出单周期/琐碎度/天花板/核心能力，双向匹配决策'
  sources:
  - paper: docs/202303/20230328_086.md
    role: origin
  - paper: docs/202303/20230328_162.md
    role: improve
  excerpts:
  - 赚钱是教不会的，但是可以学会的，如果一个项目都是确定性的，那还有谁打工，还有谁去搬砖，这个世界上没有人能逼你赚钱。
  - 请问当你是一个成年人以后，别人用什么可以逼你赚钱？别人又凭什么去逼你赚钱？
  - 市面上很多大佬...训练营，一个月大几 K 的费用，一个月下来，出单率不到 50%，月入过万的概率小于 10%。
  - 单凭一篇文章，就做到了副业月入大几 K，感觉执行力如此到位的人，其实做什么项目都能赚到钱。
  - 知识付费本质：避坑工具而非致富门票，核心价值在于缩短试错周期、跑通标准化流程、规避致命坑点，不承担执行责任、不保证成功。
- 'no': 7
  name: 轻资产工作室模型 —— 社区工作室的低成本规模化复制
  points:
  - '**为什么需要这个概念？**'
  - '- 实体仓库模式：高房租、高人力、高库存压力、低利润率，小白必死'
  - '- 需要一种固定成本极低、可快速复制、利润率高的组织形态支撑批量运营'
  - '- 闲鱼等平台账号矩阵运营需标准化SOP与低成本劳动力配合'
  - '**核心定义**'
  - '- 在小区/低租金场地建立工作室，雇佣兼职大学生按件/按单结算'
  - '- 操作30-50个账号矩阵，通过标准化SOP实现规模化复制'
  - '- 无高额房租、无库存压力，利润率远超实体仓库模式'
  - '**关键性质**'
  - '- 低固定成本：租金低、人力外包按件结算、无库存资金占用'
  - '- 高周转：账号矩阵+标准化SOP实现规模化产出'
  - '- 可复制性：SOP标准化后可快速复制到新社区/新城市'
  - '**典型例子**'
  - '- 老瞿案例：小区工作室30个闲鱼号卖二手书，利润超1000平米实体仓库'
  - '- 大学生兼职：按件结算，操作账号矩阵，标准化SOP执行'
  - '- 计划复制：将二手书类目通过流水线方式在小区工作室实现年入百万利润'
  - '**边界条件**'
  - '- 依赖成熟的标准化SOP（选品、拍照、上架、定价、客服、发货全流程）'
  - '- 需要稳定的兼职劳动力供给（大学生群体为最佳）'
  - '- 适用于非标品、高客单、需真实感建立信任的交易场景'
  - '- 管理半径有限，单工作室账号数建议30-50个，超额需分裂新工作室'
  sources:
  - paper: docs/202303/20230328_086.md
    role: origin
  excerpts:
  - 在小区开个工作室做 30 个闲鱼帐号卖二手书无货源赚的多
  - 实体是投入又大，又累，成本又高，利润又低。
  - 前期还是玩点轻。
  - 下一次给大家分享《怎么将二手书这么小的类目，通过流水线的方式，在小区开个工作室实现年入百万利润》
- 'no': 8
  name: 平台规则敬畏机制 —— 成熟期存量博弈的生存底线
  points:
  - '**为什么需要这个概念？**'
  - '- 成熟平台存量博弈阶段，暴力玩法（批量铺货/软件采集）必封号'
  - '- 新手常因缺乏敬畏之心，用技术手段挑战平台规则，导致账号损失沉没成本'
  - '- 只有充分遵守平台规则，平台才可能让你赚到钱'
  - '**核心定义**'
  - '- 在成熟平台运营，必须严守反作弊、反垃圾信息等规则作为生存前提'
  - '- 敬畏规则非道德说教，而是基于平台算法机制的理性生存策略'
  - '**关键性质**'
  - '- 强制性：违规必封，概率趋近100%'
  - '- 动态性：平台规则持续收紧，历史经验快速失效'
  - '- 笨功夫优势：手动精细化运营合规且转化高，技术流暴力玩法违规且转化低'
  - '**典型例子**'
  - '- 批量铺货案例：找软件一天铺货，几本违禁书+重复铺货处罚，直接封号7天'
  - '- 同期对比：手动精细化运营者存活规模化，技术流批量铺货群体全军覆没'
  - '- 训练营印证：大佬带教一个月，出单率<50%，月入过万<10%，印证合规难度'
  - '**边界条件**'
  - '- 红利期（平台早期）规则宽松，暴力玩法可能有效；成熟期必须转型合规'
  - '- 合规非“守着规则等死”，而是在规则框架内寻找笨功夫的极致优化空间'
  - '- 跨平台运营需针对性研究各平台差异化规则，不可一套打法走天下'
  sources:
  - paper: docs/202303/20230328_086.md
    role: origin
  excerpts:
  - 我越发觉得，现在一些成熟的平台都在打击暴力的玩法，我们只有充分遵守平台的规则，他才可能让你赚到钱。
  - 找个软件，批量铺货，一天下来几本违禁书，几个重复铺货的处罚后，直接封号 7 天。
  - 他也都是一本本手动上书的，我们工作室也是全部找大学生，精选图片上书的，而同时期开始，那些一开始就各种技术手段的人，都没有拿到太大的结果。
  - 市面上很多大佬...训练营，一个月大几 K 的费用，一个月下来，出单率不到 50%，月入过万的概率小于 10%。
- 'no': 9
  name: 陪诊行业变现分层模型 —— 从卖体力到卖资源的四阶跃迁
  points:
  - '**为什么需要这个概念？**'
  - '- 陪诊师易陷入“跑腿挂号”低客单价劳动密集型陷阱，月入上限约9000元'
  - '- 必须看清行业变现全景图，规划从基础劳务向资源整合的进化路径'
  - '- 核心护城河不在“陪同”本身，而在“信息差”与“资源获取能力”的产品化'
  - '**核心定义**'
  - '- 陪诊变现按劳动密集度与资源稀缺度分四层：基础劳务层、专业服务层、流量分发层、核心资源整合层'
  - '- 本质是将医疗服务非标准化流程（挂号难、流程复杂、资源稀缺）标准化为可定价产品'
  - '**关键性质**'
  - '- 第一阶段“卖体力”：自己跑单挂号，一线城市半天300元，日均1单，天花板极低'
  - '- 第二阶段“卖专业/卖流量”：试管陪诊（15次/周期高粘性）、派单分成（3:7）、教学、加盟，建立杠杆'
  - '- 第三阶段“卖资源/卖渠道”：绿通（5000-20000元买时间）、院内制剂、药械进院、私立/海外就医、基因检测，构建护城河'
  - '- 合规底线：必须甄别机构真实性合法性，规避黄牛挂号/非法行医/回扣贿赂红线'
  - '**典型例子**'
  - '- 试管陪诊：作者跟进11个周期，单周期15次陪诊，验证高频/长周期/强依赖护城河属性'
  - '- 院内制剂：单条抖音视频（开胃醒脾饮）收益2万+且持续复购，打通公域获客-私域成交-高频复购闭环'
  - '- 绿通服务：中山一附院手术排队2月未果，绿通费5000-2万解决入院，患者支付意愿极高'
  - '- 海外就医：中美日英癌症5年生存率差（中国40.5% vs 美国67.1%）作锚点，佣金8-20%实收'
  - '**边界条件**'
  - '- 核心竞争力在于医院科室资源/医生关系/院外机构合作的深度与广度'
  - '- 抖音自然流量获客：垂直医疗内容（院内制剂科普/就医攻略）获精准流量，行业禁投DOU+'
  - '- 派单分成模型：头部负责流量获取与筛选，派单给同行履约按3:7分成，突破单人服务上限'
  - '- 必须建立项目筛选机制，规避法律红线，合规是长期存续前提'
  sources:
  - paper: docs/202303/20230328_173.md
    role: origin
  - paper: docs/202303/ScDWdhjkHolKzAxyHpjclEDsnMg.md
    role: improve
  excerpts:
  - 一线城市半天收费标准是300元。我目前的最高记录是跑5单...平均下来一天一单左右。
  - 试管婴儿一个周期需要去医院15次左右，我目前跟了11个周期
  - 获取流量后转派给同行分成，自己得3成，接单者分7成。
  - 试管陪诊是行业的“护城河产品”。做试管婴儿很多人不懂得流程，有人指导会节省很多时间，交通费，住宿费。
  - 简单来说就是花钱买时间，大医院的话等一个床位做手术要1-2个月。走绿通一般能在7天内安排入院，快的话2-3天。绿通费用在5000-20000不等。
  - 我爆过一个中医院制剂的视频(开胃醒脾饮)，收益2Ｗ＋，现在还不断有复购的。
  - 有熟悉的医院科室资源，可以介绍药品及医疗器械进院分润。介绍客户海外就医...返实收金额的8-20%。
  - 在做的过程中会有各种各样的人来找你谈合作，要自己筛选判断合作项目机构的真实性及合法性。
  - 个人感觉接触多了整个人会很多负能量，玄学上说的是病气...可以佩戴符咒
- 'no': 10
  name: 陪诊师职业倦怠本质 —— 共情过载与心理屏蔽机制
  points:
  - '**为什么需要这个概念？**'
  - '- 陪诊师长期接触病患群体，核心风险非体力透支而是心理能量消耗与负面情绪传染'
  - '- “病气/负能量”积累已成行业共知隐性门槛，甚至衍生出佩戴符咒等非标准化应对'
  - '- 必须从科学（能量场/共情过载）与玄学（符咒/物理隔离）双维度建立边界感'
  - '**核心定义**'
  - '- 职业倦怠源于“共情过载”而非劳动强度：长期吸收患者负面情绪导致能量场污染'
  - '- 需通过物理隔离（符咒/心理建设/边界感训练）构建心理屏蔽机制'
  - '**关键性质**'
  - '- 隐蔽性：不像体力疲劳可休息恢复，心理污染累积隐蔽且难逆转'
  - '- 普遍性：评论区多位从业者/观察者共识确认，属行业共知风险'
  - '- 非标准化应对：目前无成熟心理干预体系，从业者自发探索符咒、冥想、物理隔离等手段'
  - '**典型例子**'
  - '- 评论区实证：“个人感觉接触多了整个人会很多负能量，玄学上说的是病气”'
  - '- “人生病就是负能量在身上的，科学讲就是能量场，有益能量和有害能量”'
  - '- “可以佩戴符咒！在玄学来讲，人生病就是负能量在身上的”'
  - '- 作者自述：广州医疗中心近一年跑医院经验，深刻体会职业心理风险'
  - '**边界条件**'
  - '- 心理屏蔽机制建设需专业指导，单纯靠符咒等玄学手段可能产生依赖'
  - '- 建议引入专业心理督导/同伴互助/轮岗休息等制度化应对方案'
  - '- 该风险是陪诊行业从“卖体力”向“卖资源”进化过程中必须跨越的隐性门槛'
  sources:
  - paper: docs/202303/20230328_173.md
    role: origin
  - paper: docs/202303/ScDWdhjkHolKzAxyHpjclEDsnMg.md
    role: improve
  excerpts:
  - 个人感觉接触多了整个人会很多负能量，玄学上说的是病气
  - 因为很多生病的人，身上给人的感觉都是不一样的
  - 可以佩戴符咒！在玄学来讲，人生病就是负能量在身上的
