paper: docs/202303/20230328_004.md
desc: 该素材整理自《商业设计》特训营课程精华，系统梳理了100条商业设计思维，涵盖战略创新、组织管理、业务增长三大核心维度。核心主张是“所有商业都是设计出来的”，业务成败取决于创始人认知深度与商业体系的科学构建。内容强调认知迁移、标准化与体系化、阶段性战略匹配、人才分层与价值观优先，并给出大量平台运营、组织演进、商业模式判断的实战法则。
concepts:
- name: 商业设计
  desc: 核心理念，指业务成败、赚钱上限从创业第一天起就由创始人认知与战略设计决定，而非运气或单纯执行结果。
  is_original: true
  excerpt:
  - 所有的商业都是设计出来的，一个业务能不能赚钱，最多能赚到多少钱，从业务生长出来的第一天就已经确定了。
- name: 创始人认知瓶颈
  desc: 创始人对业务理解的深度是业务成功率的决定性变量，认知边界即业务边界。
  is_original: true
  excerpt:
  - 一个业务能不能成，取决于创始人对这个业务的理解，创始人理解的越深，成功的机率就越高。创始人的认知是这个业务最大的瓶颈。
- name: 认知迁移能力
  desc: 比学习能力更关键的核心竞争力，指将成熟能力体系迁移至新赛道/新模式的能力（如头条图文分发迁移至抖音视频分发）。
  is_original: true
  excerpt:
  - 比学习能力更重要的是迁移能力，头条到抖音，其实是图文分发能力到视频分发能力的迁移。
- name: 三类业务形态
  desc: 将所有业务划分为改造型（提效）、替代型（线上化）、创造型（新物种/新职业）三种本质形态。
  is_original: true
  excerpt:
  - 所有的业务只有三种形态：改造型：就是改善原有行业里某个环节的效率...替代型：就是把线下的东西往线上搬...创造型：创造了新的服务、产品或发现新的商业模式...
- name: 第二曲线判据
  desc: 判断业务是否具备成为第二曲线潜力的三硬性指标：利润过亿有商业模式、处于市场经济而非监管经济、一曲线经历过大规模营销驱动。
  is_original: true
  excerpt:
  - 第二曲线的边界：一是有商业模式，利润过百万的叫生意、千万的叫买卖、过亿的才叫有商业模式；二是符合市场经济，而不是监管经济...三是企业在第一曲线中经历过营销驱动...
- name: 组织能力溢出
  desc: 企业内生第二曲线的核心来源，公式为：组织迁移能力 + 大规模需求溢出。
  is_original: true
  excerpt:
  - 组织能力溢出=组织迁移能力+大规模需求溢出。
- name: 人才三层次模型
  desc: 按认知深度将人才分为使用者（观察者）、探索者（思考者）、造物者（参与者），招聘核心原则为“招参与者”。
  is_original: true
  excerpt:
  - 人才分为三个层次，第一层是使用者视角...第二层是探索者视角...第三层是造物者视角...招聘人才一定要招参与者。
- name: 价值观优先原则
  desc: 人才筛选公式：价值观=1，能力=0。价值观不合能力再强风险越大，因能力可培养但价值观难改。
  is_original: true
  excerpt:
  - 对于公司人才，价值观是 1，能力是 0，价值观越吻合，风险就会越低，因为能力是可以培养的。
- name: 管理三阶层
  desc: 管理能力进阶路径：自我管理（直接）→ 团队管理（直接）→ 组织管理（间接，给不认识的人定制度、发工资）。
  is_original: false
  excerpt:
  - 管理能力提升的 3 个阶段：自我管理能力、团队管理能力、组织管理能力。自我管理能力和团队管理能力都属于直接管理，组织管理能力属于间接管理...
- name: 金字塔客户选择策略
  desc: 业务选型优先金字塔顶端（培优模式，高客单价、高服务）、次选底端（补差模式、规模化），严禁选中间层（无规模又无利润）。
  is_original: true
  excerpt:
  - 在选择业务和客户时，优先选择金字塔顶端生意，培优模式（好未来、京东），其次选择金字塔底端生意，补差模式（拼多多），中间的一定不要选择...
- name: 标准化分层
  desc: 标准化分为易解的软件/系统标准化与难解的人的标准化，后者是规模化关键瓶颈。
  is_original: true
  excerpt:
  - 大部分人理解的标准化都是软件或系统的标准化，但最难的是人的标准化。
- name: 知识内化五层次
  desc: 通过刻意练习形成独特知识体系的路径：收集整理 → 利他/亲社会 → 关键词提炼 → 场景感/情绪/故事化 → 迁移延展。
  is_original: true
  excerpt:
  - 通过刻意练习，形成自己的独特知识体系的五个层次：第一层收集整理...第二层利他...第三层关键词...第四层场景感、情绪...迁移...
- name: 商业模式本质
  desc: 商业模式本质是经营方式，创新商业模式即创新经营方式；互联网时代商业模式清晰度取决于用户停留时长。
  is_original: true
  excerpt:
  - 商业模式的本质是经营方式，创新商业模式就是创新经营方式。
  - 互联网时代，商业模式取决于用户在你平台上的停留时间，停留时间越长，商业模式越清晰。
methods:
- name: __overview__
  desc: 全书方法论：以‘认知决定边界、体系决定上限、标准化决定规模’为主线，通过战略创新定方向、组织管理建体系、业务增长跑数字，构建0-1-100商业闭环。
  excerpt:
  - 《商业设计》特训营会通过战略创新、组织管理、业务增长，三个方面为同学建立完整的商业体系。
- name: 阶段性战略匹配法
  desc: 根据竞争阶段（早期/中期/后期）与业务形态（直播等）动态调整核心竞争要素：早期比产品/技术，中期比渠道/获客效率，后期比战略/组织。
  excerpt:
  - 竞争早期产品为王，比的是谁的技术领先，竞争中期渠道、营销为王，比的是谁的获客效率高，竞争后期战略、组织为王，比的是谁战略和组织强。
  - 直播业务第一阶段拼流量，第二阶段拼供应链，第三阶段拼品牌。
- name: 经营策略四选二法
  desc: 企业经营策略仅四种（广度、深度、高度、速度），每阶段聚焦最多两种，避免贪多嚼不烂。
  excerpt:
  - 一个企业的经营策略只有 4 种，广度、深度、高度、速度，每个阶段同时最多选 2 种。
- name: 目标对齐六遍法
  desc: 业务目标下达需反复沟通至少6遍，经历‘不可能→有意思→可能→可试→应该能→肯定能’的团队心理建设过程。
  excerpt:
  - 定业务目标一定要反复跟团队过，至少过 6 遍，过第 1 遍，大家会觉得肯定不可能完成...过第 6 遍：大家才会肯定可以完成。
- name: 人才盘点‘捧千里马、消灭耗子、清理老白兔’法
  desc: 提高坏流失率、降低好流失率，分类处理核心骨干、有害分子、平庸占坑者。
  excerpt:
  - 公司人才盘点要提高坏流失率，降低好流失率。捧千里马，消灭耗子，清理老白兔。
- name: 合伙人选择‘性格相融’法
  desc: 拒绝单纯互补或相似，主张‘性格相融’（宽容理解差异），核心指向是认知宽容度。
  excerpt:
  - 找合伙人一定要找性格相融的，而不是互补和相似的...最大的矛盾就是你怎么这么对我，最大的和解是他就是这个德行。
- name: 流量获取阶段法则
  desc: 互联网平台流量获取分两阶段：阶段一靠模仿+平台扶持（冷启动），阶段二靠规模化或付费投放（规模化）。
  excerpt:
  - 互联网平台获取流量法则，第一阶段：模仿+平台扶持；第二阶段：规模化或付费投放。
- name: 平台算法认知与内容策略
  desc: 认清平台算法智商上限（如小红书8-12岁），内容策略遵循‘前期模仿爆款对标，后期输出干货’；知乎等平台需工具挖掘‘高流量低回答’蓝海。
  excerpt:
  - 小红书平台的底层是算法，全球最牛的算法的智商目前只有 8-12 岁...小红书起号，账号没起来之前专注模仿，等到账号起来了，再输出自己的干货内容。
  - 知乎平台 90%以上的回答是没有流量的，需要用工具找到流量高，回答少的问答...
- name: 直播‘坐商’运营法
  desc: 直播本质是坐商逻辑：通过长时长、高频次稳定性建立平台信任，获取确定性流量。
  excerpt:
  - 直播业务的底层逻辑是坐商的逻辑，平台不认识你是谁，平台只能通过你的直播的时长和直播频次的稳定性来判断你靠不靠谱...
- name: 公众号投放ROI策略
  desc: 从低报价到高报价、从竞对未投放账号切入、以月度ROI>1为考核单位。
  excerpt:
  - 公众号投放策略：从低报价到高报价投放顺序；从近 6 个月竞争对手未投放过的公众号开始投放；以月/ROI>1 为考核单位。
- name: 产品效果外化‘高认知、反常识、可量化’法
  desc: 产品效果外化需满足：用户高认知（懂价值）、反常识（超预期）、外化到行动（有场景、可感知、可量化）。
  excerpt:
  - 产品效果外化要让用户高认知和反常识，并且效果外化要外化到行动上，有场景、可感知、可量化。
- name: 新业务孵化‘老人做新事、新人做老事’法
  desc: 传统业务孵化线上新业务：新业务负责人用互联网人才，配线下熟悉副手；收购业务原老大调入集团，实现资源支持、验证健康度、人员晋升、集团管控过渡。
  excerpt:
  - 老人做新事，新人做老事！
  - 传统业务发展线上新业务时，创新线上业务老大一定要用互联网背景人才，再给他配一个线下业务熟悉的副手。
  - 收购业务后，原业务老大一定要调到集团...
- name: 用户洞察‘信嘴不信腿’法
  desc: 洞察真实需求看行为数据（腿）而非口头反馈（嘴），真需求表现为具体场景痛点（如‘去年衣服穿不上’）。
  excerpt:
  - 洞察人性背后的诉求，找到增长爆破点，不要相信用户的嘴，要相信用户的腿...真正要减肥的会说，我去年的衣服/裤子穿不到了。
theorems:
- name: 商业即设计定理
  desc: 业务成败与上限在Day 1即由创始人认知与战略设计锁定，后续执行只能在设定边界内优化。
  excerpt:
  - 所有的商业都是设计出来的，一个业务能不能赚钱，最多能赚到多少钱，从业务生长出来的第一天就已经确定了。
- name: 认知变现定理
  desc: 信息差→认知差→选择差→命运差，商业本质是认知变现，认知边界即财富边界。
  excerpt:
  - 信息差决定了认知差，认知影响选择，选择改变命运！
- name: 阶段不可跨越定理
  desc: 企业/个人发展阶段不可跨越（野蛮生长→投资入场→监管经济；内容→运营→体系→营销→数据），只能通过付费向高认知者学习缩短痛苦周期。
  excerpt:
  - 企业发展过程中的每个阶段都需要创始人亲身经历一遍...阶段不可以跨越，但可以缩短，找到周围认知最高的人，花钱学习，缩短痛的时间！
  - 从个人发展到公司再到集团，需要经历内容驱动—运营驱动—体系驱动—营销驱动—数据驱动。
  - 一个行业的发展规律，基本会遵循野蛮生长—投资入场—国家监管，从市场经济转到监管经济。
- name: 零和/非零和博弈战略定理
  desc: 行业上升期为非零和博弈（无战略也能涨），存量期为零和博弈（必须有竞争战略），战略必要性由行业周期决定。
  excerpt:
  - 行业处于上升期，非零和博弈，不管企业有没有竞争战略，都能实现业绩增长！行业规模或整体经济增长放缓，零和博弈，一定要有竞争战略！
- name: 平台博弈定理
  desc: 弱者依附平台（弱则靠平台），强者自建平台（强则造平台）；技术/算法服务于人则模式清晰，人服务于技术则模式模糊。
  excerpt:
  - 弱则靠平台，强则造平台。
  - 技术、算法、平台服务于人，商业模式很清晰，人服务于技术、算法、平台，商业模式不清晰。
- name: 标品/非标品定价权定理
  desc: 交易型电商卖标品（理性比价、无定价权），内容型电商卖非标品（感性评估、有定价权），可通过SKU组合将标品非标化获取定价权。
  excerpt:
  - 交易型电商卖的是标品，用户上来就比价看差评，理性评估，没有定价权；内容型电商卖的是非标品，没有差评，只能看好评，感性评估，有定价权。可以通过不同 SKU 组合，成为非标品，变的有定价权。
- name: 战略决定组织定理
  desc: 组织必须跟随战略调整，以旧组织执行新战略必败；战略调整完毕后需同步调整组织架构与人岗匹配。
  excerpt:
  - 战略决定组织，组织跟随战略，战略调整完，相应的组织和人也要进行调整，有太多的企业试图以旧的组织结构实施新的战略。
- name: 管理底线即员工行为底线定理
  desc: 员工会不断试探管理底线直到突破，管理者容忍度决定团队纪律下限。
  excerpt:
  - 员工的行为底线就是管理者的管理底线，员工和小孩一样，他在不断试探管理者的底线，直到突破管理者的最后一条底线。
- name: 农业经济周期定理
  desc: 一切业务发展遵循春种秋收、夏耘冬藏的自然周期律，违背周期强行催熟必反噬。
  excerpt:
  - 所有业务发展都需要遵循农业经济的规律，春种秋收夏耘冬藏。
- name: 商业社会化临界点定理
  desc: 商业体量达一定规模后超越纯商业范畴，必须承担社会责任与社会影响。
  excerpt:
  - 当商业体量大到一定规模就不是单纯的商业了，必须考虑社会责任和社会影响。
findings:
- name: 大学生重塑行业模式验证案
  desc: '[evidence] 好未来（教培）、链家（房产中介）通过大量招募大学生标准化重塑行业，验证了‘大部分行业可通过招大学生重新做一遍’的模式可行性。'
  excerpt:
  - 大部分的行业都可以通过招大学生重新做一遍，这个模式在教培行业（如：好未来）、房产中介（如：链家）已经验证了。
- name: 第二曲线寻找时机反常识发现
  desc: '[evidence] 绝大多数企业在衰退期才找第二曲线（已无力回天），正确时机应在第一曲线发展最好（资源充沛、组织能力溢出）时提前布局。'
  excerpt:
  - 从企业创新的角度，找第二曲线一定要在企业发展最好的时间段，但往往大部分企业在衰退的时候才想起来找第二曲线。
- name: 内部培训失效根因发现
  desc: '[evidence] 企业内训无效核心原因非内容质量，而是‘只有赋能系统（教），没有赋权系统（用）’，学以致用闭环未打通。'
  excerpt:
  - 企业内部培训没有效果，是因为只有赋能系统，而没有赋权系统。
- name: 免费/付费流量确定性差异发现
  desc: '[evidence] 免费流量本质不确定（需工程化规模化对冲），付费流量相对确定（核心拼ROI效率），新手应选商业化/专业化程度低平台博免费流量，求确定性则选高商业化平台买付费流量。'
  excerpt:
  - 免费流量都是不确定的，需要规模化、工程化，付费流量相对确定，拼的是花钱的效率。
  - 在选择流量平台时，新手应该尽量选择商业化程度低，专业化程度低的平台...如果需要花钱买确定性，就要尽量选择商业化程度高，专业化程度高的平台。
- name: 小红书去重算法窗口期发现
  desc: '[claim] 素材宣称小红书目前无去重算法，模仿窗口期仅剩半年，建议抓紧模仿起号。'
  excerpt:
  - 小红书平台目前还没有上去重算法，窗口期可能只有半年。
- name: 招聘快慢法则验证
  desc: '[evidence] ‘招人要慢、开人要快’：管理者对员工一丁点不满员工即可感知，延迟解聊仅增加沉没成本与组织毒性。'
  excerpt:
  - 招人要慢，开人要快，你对员工有一丁点不满的时候，其实她/他是能感受得到的，如果你不想用她/他，就应该第一时间开了她/他，别让沉没成本越来越大。
- name: 创始人专业度陷阱发现
  desc: '[evidence] 创始人越专业越易犯‘以专业为中心而非用户为中心’的错误，导致产品自嗨、脱离市场需求。'
  excerpt:
  - 要以用户为中心，而不是以你的专业为中心，创始人越专业，越容易犯错。
- name: 服务客户资源整合视角发现
  desc: '[evidence] 服务本质非‘卖现有能力’而是‘问客户需求、调动一切资源解决问题’，定义了服务型业务的外向型资源整合能力。'
  excerpt:
  - 服务客户的时候，不是你有什么，而是客户需要什么？你能调动什么资源？能帮到客户什么？
- name: 转介绍触发机制发现
  desc: '[evidence] 用户不会主动转介绍，必须同时满足：超预期产品/服务 + 准备好转发物料（降低行动成本）。'
  excerpt:
  - 用户不会主动转介绍，一定是你提供了超预期的产品或服务，而且还帮她/他准备好了物料。
- name: 业务停滞3-6月判定法则
  desc: '[evidence] 业务3-6个月无实质进展，大概率是战略方向错误而非执行不力，需果断止损调向。'
  excerpt:
  - 一个业务如果 3-6 个月没有进展，大多数情况下是方向错了。
