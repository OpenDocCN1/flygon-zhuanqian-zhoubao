paper: docs/202303/doxcnXIOtkZmPJLb1izKrreOuMg.md
desc: 该素材是一份关于利用RPA（机器人流程自动化）工具UIBot Creator实现亚马逊店铺批量自动发布Posts的实操教程，涵盖了前置条件准备、软件安装配置、RPA流程搭建的15步详细操作、图片素材批量获取方法及亚马逊Posts发布规范注意事项，旨在帮助卖家以低成本获取站内免费流量。
concepts:
- name: AMZON POSTS 自动化发布
  desc: 利用RPA工具模拟人工操作，实现亚马逊品牌注册卖家后台Posts的批量、定时、无人值守自动发布，替代人工重复性劳动。
  is_original: false
  excerpt:
  - 我一直在鼓捣RPA自动发AMZON POST的事情，首先是获取大量图片，其次是把上传帖子的流程捋顺，最后是不断测试看程序可优化的点。
  - 我在写文章的此刻，已经整理好两个店铺的流程，程序在自动化批量发布POST了。
- name: RPA杠杆思维
  desc: 将代码、软件、程序视为杠杆工具，核心价值在于解放双手、复制时间，而非单纯的技术实现。
  is_original: true
  excerpt:
  - 代码，软件，程序本质上是杠杆，不仅解放你的双手，还能复制你的时间。
  - 君子性非异也，善假于物也。
- name: 免费流量获取策略
  desc: 在站内付费广告成本高昂、早期评论人关闭、Vine计划昂贵的背景下，利用亚马逊Posts这一免费且小众的官方工具获取站内流量。
  is_original: false
  excerpt:
  - 现在广告的付费流量那么昂贵，POST是完全免费且小众的一个工具。
  - 我们作为商家，站内可做的动作真心不多...于是太多人在广告投放上烧钱。
- name: 场景化素材库
  desc: 不拘泥于自有产品实拍图，而是通过搜索无版权图库，按目标受众画像（如教师、司机、护士、父母等）及使用场景关键词批量下载通用场景图作为Posts素材。
  is_original: true
  excerpt:
  - 方法很简单，你不需要完全去真正拍摄或者修图所售产品，只需要找到产品同类的场景，以及对应的受众即可。
  - 比如我在《蓝海产品方法论》当中所讲的几大人群：教师，司机，护士，父母等等。
methods:
- name: __overview__
  desc: 基于UIBot Creator的可视化流程编排，结合Chrome插件批量获图，通过‘手动跑通一次设置路径 -> 录制/导入代码 -> 容错机制配置
    -> 循环串联流程块 -> 观察调试’的全流程RPA实施方法论。
  excerpt:
  - RPA自动上传POST代码：https://blbze7axys.feishu.cn/docx/doxcnidpwNGvhrnrk7aiDGTVUSf
  - 第五步，复制代码到空白处，选用4.0版本，有多重容错机制
  - 第十二步，鼠标左键长按...拉出来一条线到下一个流程块...第十三步...拉出来一条线到上面的流程块（形成循环）
- name: UIBot Creator 可视化流程搭建
  desc: 使用UIBot Creator的可视化模式，通过导入源代码、配置图片上传文件夹路径、串联流程块形成闭环循环，实现Posts发布流程的自动化编排。
  excerpt:
  - 第三步，点击箭头所指和红框圈住的笔框，第四步，点击右上方可视化按钮，第五步，复制代码到空白处，选用4.0版本，有多重容错机制
  - 第六步，点击源代码...第七步，尝试手动上传一次AMZON POST，目的是设置好图片上传文件夹
  - 第十二步...第十三步...形成循环
- name: ImageAssistant 批量采图工作流
  desc: 利用Chrome插件Image Assistant，在无版权图片网站按关键词搜索后，通过‘提取本页图片 -> 筛选类型/大小 -> 全选 -> 自动下载’的标准化动作，快速建立素材库。
  excerpt:
  - 批量下载图片的插件...ImageAssistant...里面的两个功能对图片类型和大小的筛选很实用。
  - 第五步，点击提取本页图片...第六步，依次按照顺序，点击图中红框...第七步，点击全选和下载选中...第八步，依次点击自动下载和继续下载
- name: 延时随机化防封策略
  desc: 在RPA循环中设置固定延时（如200,000毫秒即约2分钟/条），模拟人工发布频率，规避平台风控，替代复杂的定时发布策略。
  excerpt:
  - 最开始我是打算设置定时发布策略的，但是后面核算下，这个真的很麻烦，还不如超级简单的，直接延时即可...我是设置了两分钟，也就是200000毫秒延后。
theorems:
- name: RPA降维打击人工成本
  desc: 对于高重复、低决策的运营动作（如发Posts、发售后邮件），RPA自动化的边际成本趋近于零，远低于人工或外包成本，是中小卖家应对内卷的核心竞争力。
  excerpt:
  - 几年前刚毕业还在深圳的时候，我是用按键精灵，批量自动发布售后邮件，当时几千封发送的单调动作，真是让人觉得生无可恋。
  - 如果你不懂RPA，那大概率要花费挺多时间研究，所以不建议来看也可能看不懂。
- name: Posts是当前亚马逊最优免费流量入口
  desc: 在站内免费流量入口收敛（评论关闭、Vine贵、早期评论人无）的现状下，Posts作为品牌注册卖家专属的免费内容分发工具，是性价比最高的流量补位手段。
  excerpt:
  - 现在广告的付费流量那么昂贵，POST是完全免费且小众的一个工具。
  - 早期评论人已经关闭，免费赠送样品早就没了，AMZ VINE又那么昂贵，来领取的人还少
- name: 素材来源场景化 > 产品实拍
  desc: Posts素材的核心是‘受众场景共鸣’而非‘产品细节展示’，利用无版权图库按人群标签检索的通用场景图，比自行拍摄产品图更高效且转化相关性强。
  excerpt:
  - 你不需要完全去真正拍摄或者修图所售产品，只需要找到产品同类的场景，以及对应的受众即可。
  - 其实这个也是潮汕牛肉丸的抖音策略，批量发布产品相关视频，反正只要有免费流量，就出现你的产品链接就好，受众尽可能精准。
findings:
- name: 单条Posts人工耗时基准
  desc: '[claim] 拓跋勇（勇哥）人工发布单条Posts耗时约2-3分钟。'
  excerpt:
  - 今天在拓跋勇群里，勇哥向我确认了，他差不多两三分钟发个帖子
- name: RPA实测可稳定跑通多店铺
  desc: '[evidence] 作者已在两个店铺上成功部署并运行该RPA流程，实现批量自动发布。'
  excerpt:
  - 我在写文章的此刻，已经整理好两个店铺的流程，程序在自动化批量发布POST了。
- name: 紫鸟浏览器不兼容RPA
  desc: '[claim] 经沟通确认，紫鸟浏览器因推自有服务，禁止/不支持第三方RPA工具运行。'
  excerpt:
  - 备注：经过沟通，紫鸟浏览器，不可使用RPA，因为他们在推自己的服务。
- name: UIBot 4.0版本代码具备多重容错
  desc: '[claim] 作者提供的RPA代码为4.0版本，内置多重容错机制，提高了流程运行的稳健性。'
  excerpt:
  - 第五步，复制代码到空白处，选用4.0版本，有多重容错机制
- name: 环境差异是RPA落地最大变数
  desc: '[evidence] 作者强调每台电脑浏览器缩放、分辨率、文件路径均不同，必须人工跑通一次并调试，无法做到开箱即用。'
  excerpt:
  - 最后一步，如果出现任何问题，请录屏，或者最好联系我远程协助处理，因为每天电脑的浏览器和软件都不相同。
  - 电脑浏览器页面需要看得到上传按钮，如果看不到请调整到75%缩放
