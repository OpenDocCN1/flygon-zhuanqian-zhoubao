paper: docs/202303/20230328_166.md
desc: 该素材详细披露了一个利用银行行长月末、季度末冲击揽储考核指标（MIS/任务额）而产生的短期资金拆借需求，通过个人配合开立二类卡/电子户存入大额资金（通常为一日通知存款或协议存款），赚取远超市场利率的“拆借利息差价”的无风险套利操作全流程。文章从机会挖掘、项目缘起、背景逻辑、具体银行操作步骤（工、农、中、建、邮储）、实操资金验证（单日百万级收益案例）到风控总结，系统阐述了该灰色地带业务的运作模式、资金安全边际（资金不出自有卡）、定价机制及准入门槛。
concepts:
- name: 银行行长揽储考核指标缺口
  desc: 银行网点行长为完成监管或上级行下达的存款规模/增量考核任务（MIS），在月末、季度末、年末出现的短期资金缺口，是套利机会的根本来源。
  is_original: false
  excerpt:
  - 其实每个银行行长后面都有一定的揽储等任务额，考核任务直接关系到自己的指标，所以通常在月末，他们都会尽量完成自己的任务指标，如果有任务额没法完成的话他们就会在圈内同行之间拆借，支付一定的拆借利息。
  - 近几年，整体疫情的影响，在加上国家设置一人一个银行一张一类的设定标准，导致很多银行的行长要引流存款完成时，变得很麻烦。
- name: 二类卡/电子户关联一类卡通道
  desc: 银行内部科技系统开发的合规工具，允许客户在非柜面/线上通过输入员工工号开立二类卡或电子户并关联自身一类卡，实现资金在自有账户间闭环流转，规避了‘一人一户’限制与代操作风险。
  is_original: true
  excerpt:
  - 所以银行系统科技就设置了一个二类卡关联一类卡的方法，只需要输入银行的工作人员编号，就能产生一个新的卡号，然后再从银行主卡转入自己的二类卡，任务结束了再从二类卡转入一类卡后就可以销户。
  - 整个流程操作只有用户本人自己银行卡之间互相转账，不存在代操作，款转他人账户等问题，资金安全有保证，无风险。
- name: 隔夜/超短期拆借利息差价
  desc: 资金方将自有闲置资金按约定利率（如日化万分之1.1~1.2，年化约40%+）存入银行一日通知存款/协议存款，银行端通过内部拆借或考核指标达成获利，双方分享远超市场利率（如活期0.25%、理财2.2%）的超额收益。
  is_original: true
  excerpt:
  - 这个拆借通常是短期的，一天或者两天，通常都是在月末。
  - 预先的价格是一千万 1 天 1 万多块钱... 这边是 1000 万一天 11000 元（兜底）。差价十来倍。
  - 我们以一亿一天 11 万的价格确定了合作。
- name: 自有账户资金闭环
  desc: 全程资金仅在资金方本人名下的一类卡与二类卡/电子户之间转账，不经过第三方账户、不授权他人代操作，是宣称‘无风险’的核心物理隔离机制。
  is_original: true
  excerpt:
  - 所有的资金交易都是自己操作，在自己的卡里完成，资金也可随时取出。
  - 整个流程操作只有用户本人自己银行卡之间互相转账，不存在代操作，款转他人账户等问题，资金安全有保证，无风险。
methods:
- name: __overview__
  desc: 利用银行行长考核指标缺口，通过银行内部‘二类卡关联一类卡’技术通道，在月末/季度末将自有大额资金存入指定银行一日通知存款/协议存款，赚取超高拆借利息差价，资金全程自有账户闭流转。
  excerpt:
  - 项目名称：银行隔天大额存款拆借无风险套利项目
  - 操作流程：...银行系统科技就设置了一个二类卡关联一类卡的方法... 整个流程操作只有用户本人自己银行卡之间互相转账...
  - 工行存款办法：存款-通知存款-一天通知-输入代码，输入金额，到期日点一下选择明日... 农行存款办法：我的账户-开通电子户-输入他行卡-填写信息跟开户网点代码-绑定账户换绑成农行主卡-转入-第二天转出
- name: 工商银行一日通知存款操作法
  desc: 通过手机银行APP路径：存款->通知存款->一天通知->输入员工代码/金额->到期日选明日->存款保存，实现资金隔夜计息。
  excerpt:
  - 工行存款办法：存款-通知存款-一天通知-输入代码，输入金额，到期日点一下选择明日-下一步-存款保存-查看我的存款
- name: 农业银行电子户开户绑定法
  desc: 通过手机银行APP路径：我的账户->开通电子户->输入他行卡信息及开户网点代码->绑定账户换绑为本行主卡->转入资金->次日期满转出销户。
  excerpt:
  - 农行存款办法：我的账户-开通电子户-输入他行卡-填写信息跟开户网点代码-绑定账户换绑成农行主卡-转入-第二天转出（转出后可以销户）
- name: 资金方-渠道方-银行端三方定价与结算模型
  desc: 渠道方（银行内部人/资源方）报出保底价格（如日息1.2‰），资金方承接并垫资，季度末价格上涨部分按约定分成（如五五分成或锁定季度价），资金T+1日结息归还，渠道方垫资担保。
  excerpt:
  - 渠道给我保底 1 万 2 的价格确认，后面价格涨的部分再一半分我或者我跟她们确定好价格，按季度末价格配合我，二选一。
  - 后面的事情就是他们资金提前一天出来了，也开好了电子户，资金转入他们账上的电子户。过了季度底到 1 号，渠道把尾款给我，我资金也打给他们了。中间差价 6 万就来了。
theorems:
- name: 核心主张：该业务模式构成‘无风险套利’
  desc: 基于资金不出自有卡、操作主体为国有大型银行（工农中建邮）、期限极短（隔夜/1-2天）、款项由银行端/渠道方次日现结等要素，宣称该业务不存在本金损失风险、信用风险及操作风险。
  excerpt:
  - 不过，这也不需要担心有任何风险，所有的资金交易都是自己操作，在自己的卡里完成，资金也可随时取出。
  - 做的全部都是工行、建行、农行、邮储、中行这些国有大型银行，所有的资金交易都是自己操作，自己在自己的卡里完成，资金无风险。
  - 要真发生万一。你也就损失理财利息。没赚这种差额嘛。
- name: 核心主张：长期可持续性与稳定需求
  desc: 基于银行考核机制（MIS）的刚性、‘一人一类卡’监管长期存在、行长冲指标的周期性规律，判断该套利空间长期存在且具备可操作性。
  excerpt:
  - 经过这些时间的观察，这些银行的需求一直都是很持续的，目前看，长期还是极具可操作性的。
  - 平常一些日常资金、月末、季度末都有。就看价格你能不能接受。
- name: 核心主张：准入门槛为大额自有资金（百万级起步）
  desc: 由于银行端操作成本、单笔开户限额及利息计算基数，单笔通常要求100万起步，单日收益千万级资金可赚10万+，属于大资金专属玩法。
  excerpt:
  - 比如想要 1 天赚 10 W ，那就需要千万的资金投入。
  - 缺点是什么？答：需要的资金要求较大，通常都是 100W 起，太小没有意义，所以对自有资金有一定要求。
findings:
- name: 案例：自有资金500万操作月度理财+季度末冲量收益验证
  desc: '[evidence] 作者自有资金500万，先做一个月年化4%理财（差价2%），收益约8200元；季度末最后一天配合1000万过夜资金（日息1.2‰），收益12000元；合计盈利2万元，验证了平时理财+节点冲量的复合收益模型。'
  excerpt:
  - 时间长点的我们还有可以做一个年化 4% 的理财利息（ + 0.25% 银行活期利息，当时银行理财利息 2.2% 左右，所以差价 2% ），做了一个月。
  - 刚好做衔接季度末最后一天的过夜资金... 预先的价格是一千万 1 天 1 万多块钱... 那么我一个月相当于收益到我手上时，差价就有 500 万（自有）*
    2 % / 12 = 8200 + 季度 1000 万 * 0.0012 =12000 元... 总的盈利 2 万。
- name: 案例：对接公司股东3亿资金季度末单日收益6万元
  desc: '[evidence] 对接公司股东闲置资金3亿（实际配合1亿），按日息1.1‰保底、涨价五五分成模式，季度末实际价格上涨，单笔交易中间差价获利6万元，验证了大额资金单日高收益及分成模式有效性。'
  excerpt:
  - 公司几个人账上合起来有 3 个亿... 我们以一亿一天 11 万的价格确定了合作。然后渠道和我开始确认。因为季度末需求量肯定大，渠道给我保底 1 万 2 的价格确认，后面价格涨的部分再一半分我...
    后面还真的涨了价格... 中间差价 6 万就来了。这是最大一笔。
- name: 案例：炒股朋友闲置资金配合日均+月末赚2万+
  desc: '[evidence] 对接炒股朋友闲置几千万资金，配合日均存款及月末冲量，额外获利2万+，印证了除季度末外，月度考核节点亦存在稳定需求。'
  excerpt:
  - 其他的朋友有资金的最后几天也联系我，有个炒股的朋友闲置资金也有几千万，也配合了我一些（日均 + 月末）。也赚了 2 万多块钱。
- name: 发现：小银行存在‘入坑’风险，大银行资金安全有承保
  desc: '[claim] 评论区用户反馈小银行存在风险案例，作者强调仅操作四大行及邮储，并称利息有‘承保’，暗示大行信用风险极低但小银行可能存在兑付隐患。'
  excerpt:
  - '风不停 : 小银行的话慎重，我有朋友入坑的'
  - '老胡 : 四大行，资金都在自己卡里，不存在本来损失那些，对于利息的话，是有承保。'
