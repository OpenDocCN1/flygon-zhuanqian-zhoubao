learning_targets:
- 理解周报导航索引在知识管理中的定位与作用
- 掌握如何利用总目录进行二维检索（按周、按板块）定位核心素材
- 识别索引页空心化与外链依赖带来的知识资产风险
- 能够基于导航索引构建个人知识地图的模块边界
concept_map:
- 周报导航索引
- ├── 总目录结构
- │   ├── 时间维度：四周划分（3.6-3.12 / 3.13-3.19 / 3.20-3.26 / 3.27-4.2）  —— P001
- │   ├── 板块维度：五大板块（AI工具、跨平台运营、私域流量、电商变现、个人成长）  —— P001
- │   └── 元数据字段：标题、分类、来源链接  —— P001
- ├── 单期索引
- │   └── 第4周周报标题记录（20230328-20230404）  —— P002
- ├── 核心功能
- │   ├── 导航定位：连接宏观结构与微观节点  —— P001
- │   ├── 边界界定：定义素材库覆盖范围与模块划分  —— P001
- │   └── 检索入口：作为教材编排与读者查阅的总入口  —— P001
- └── 结构性缺陷
- '    ├── 索引页空心化：无实质正文，仅含标题与链接  —— P001, P002'
- '    └── 外链依赖风险：核心内容寄宿语雀，链接失效即知识永久流失  —— P001, P002'
life_analogy:
- 想象周报导航索引是一张**大型商场的『总楼层指引牌』**：
- '- **四周时间轴** = 商场的 **4层楼**（每层对应一周）'
- '- **五大板块** = 每层楼的 **5个专区**（AI工具区、跨平台运营区、私域流量区、电商变现区、个人成长区）'
- '- **标题与链接** = 每个专区门口的 **『品牌名+箭头』**，告诉你『这卖什么、往哪走』'
- '- **语雀外链** = 实际的 **货架/柜台**，货（核心内容）不在指引牌上，而在柜台里'
- 就像逛商场先看指引牌定位楼层专区，再去柜台拿货；指引牌丢了或柜台搬家（链接失效），你就买不到东西（获取不到知识)。
summary:
- concept: 周报总目录
  desc: 2023年3月刊四周精华帖的结构化索引，覆盖五大板块，是素材库的总检索入口
- concept: 单期索引
  desc: 第4周周报标题与链接记录，为深度研读提供定位锚点
- concept: 导航性
  desc: 提供按周、按板块的二维检索路径，连接宏观结构与微观节点
- concept: 元数据属性
  desc: 仅记录标题、分类、来源链接，不包含实质正文内容
- concept: 索引页空心化
  desc: 核心内容寄宿于外部语雀文档，索引页本身无实质教学内容
- concept: 外链依赖风险
  desc: 语雀链接一旦失效，将导致知识资产永久不可达
exercises:
- 'no': 1
  title: 构建个人周报检索路径
  contents:
  - 场景：你想研究『AI数字人直播』相关实战案例。
  - 1. 打开《龙哥赚钱周报》2023年3月刊总目录（README.md）
  - 2. 定位到哪一周、哪个板块最可能包含该主题？
  - 3. 记录该板块下的具体精华帖标题。
  - 回答问题：
  - '- 如果总目录中该板块的链接失效，你将如何尝试找回内容？'
  - '- 为什么说『总目录是地图，不是领土』？'
- 'no': 2
  title: 诊断索引页空心化风险
  contents:
  - 对比 docs/202303/README.md 与 docs/202303/20230328_000.md 两个素材文件：
  - 1. 统计两个文件中包含的实质正文段落数（非标题、非链接）。
  - 2. 识别它们共同指向的外部存储平台。
  - 回答问题：
  - '- 若该平台停止服务，本教材第6章『周报导航与元数据索引』的所有核心内容将发生什么？'
  - '- 作为教材编辑，你会建议采取什么归档策略规避该风险？'
- 'no': 3
  title: 设计改进版导航索引原型
  contents:
  - 基于现有总目录的缺陷，设计一个『增强版导航索引』的字段结构（用表格或列表描述），要求新增字段能解决：
  - 1. 内容摘要缺失（无法快速判断是否值得点开）
  - 2. 链接失效后无法追溯（无本地备份标识）
  - 3. 板块内文章关联度不可见（无法看出系列/进阶关系）
  - 列出至少5个新增字段及其说明。
