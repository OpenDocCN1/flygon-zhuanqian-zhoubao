    desc: 可投放产品必须同时满足：单品利润>获客成本+履约成本；价格体系不透明便于溢价；落地页/销售流程/供应链具备超越现有同行能力。典型品类：虚拟资料/滋补品/玉石/檀香/机械/无牌电子产品。
