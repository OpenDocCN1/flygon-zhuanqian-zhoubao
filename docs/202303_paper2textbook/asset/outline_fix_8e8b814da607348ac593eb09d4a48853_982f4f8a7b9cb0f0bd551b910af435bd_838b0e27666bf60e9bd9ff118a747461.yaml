    desc: 朋友圈高频曝光真实订单/评价零推销，利用高复购特性锁定LTV；有赞分销功能构建代理体系，低成本获客服务网络。
    role: method
    src:
    - paper: docs/202303/20230328_059.md
  - 'no': 7
