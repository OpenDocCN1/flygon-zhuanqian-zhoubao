    desc: 小团队标准化SOP维持全网日更10-20条高频产出，单条素材多平台横向分发、多形态纵向复用（长视频切短、直播切片、回放做无人）。
    role: method
    src:
    - paper: docs/202303/20230328_059.md
  - 'no': 5
