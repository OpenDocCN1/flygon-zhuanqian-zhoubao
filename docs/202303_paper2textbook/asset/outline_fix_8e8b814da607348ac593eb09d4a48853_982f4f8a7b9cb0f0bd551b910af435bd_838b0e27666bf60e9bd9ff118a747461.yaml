    desc: 需满足素材资产化+标准化SOP+付费流量托底三条件；实测机油/清洗剂类目因平台政策（危化品资质）无法大规模付费推广，导致自然流量天花板无法突破，单月利润卡在10W+。
    role: limitation
    src:
    - paper: docs/202303/20230328_059.md
