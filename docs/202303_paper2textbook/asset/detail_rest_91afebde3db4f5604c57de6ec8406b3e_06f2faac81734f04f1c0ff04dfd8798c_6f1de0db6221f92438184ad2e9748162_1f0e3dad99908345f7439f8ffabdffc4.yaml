life_analogy:
- 想象招聘平台是一个**巨大的‘项目超市’**，而招聘广告是**货架上的‘价签’**：
- '- **持续挂着‘招聘’价签的商品** = 已被市场验证‘好卖/赚钱’的成熟项目（否则老板早撤柜台了）'
- '- **你以‘求职者’身份进场试吃/询价** = 低成本、合规、高意向地获取核心配方（供应链/利润/打法）'
- '- **ChatGPT是你的‘随身翻译官+谈判专家’** = 听不懂行业黑话？它秒回专业参数；不会写简历？它生成高转化话术'
- '- **RPA是你的‘分身术+搬运工’** = 帮你同时跑遍全国500家分店（批量投递/采集）、搬运情报、记账建档，你只管决策'
- '- **幼儿园打小朋友** = 别去和‘沃尔玛/山姆’（头部大厂/红海标品）抢生意，去隔壁‘夫妻小卖部’（线下非标服务）教他们用微信收款、发抖音引流，你的‘基础操作’在对方眼里是‘黑科技’'
- 就像逛超市时，货架上长期补货的商品必是畅销款；你不必自己研发新品，只需拿着‘求职者’的通行证，去成熟摊位‘取经’、‘拿货’、‘拉客户群’，再用‘分身术’复制到下一个城市。
summary:
- concept: 招聘即项目验证信号
  desc: 持续高频招聘背后必为项目盈利稳定或隐性获客，是普通人寻找确定性机会的最佳雷达
- concept: 反向猎头/海选模式
  desc: 以求职者身份多账号投递，让项目/合作主动找上门，ChatGPT兜底专业知识实现零门槛跨界调研
- concept: 项目库-人才库-流量库三位一体
  desc: 一次招聘动作同时沉淀：项目模型库、人才储备库、高意向流量库，构建单人公司完整商业闭环
- concept: ChatGPT+RPA自动化协作流程
  desc: 左脑ChatGPT管思考（文案/知识/话术），右脑RPA管跑腿（采集/分发/管理），人类仅管决策
- concept: 幼儿园打小朋友蓝海思维
  desc: 选择不懂互联网的线下小微个体赛道（门窗/家电维修/同城服务），用基础运营技能实现降维打击
- concept: 先手动跑通再自动化原则
  desc: 业务流程必须先人工完整跑通验证盈利，再引入RPA替代标准化环节，避免自动化地做错事
- concept: 招聘流量隐性属性
  desc: 长期招聘往往非真招人：保险招客户、大V招粉丝/流量，识别隐性属性可避坑并反推商业模式
- concept: 工具杠杆放大人类判断力
  desc: ChatGPT破认知边界，RPA破执行带宽，人类聚焦决策与非常规沟通，实现单人公司规模化运作
- concept: 五维项目筛选法
  desc: 操作难度低、顺应平台规则、绿色合规、可批量复制、周期利润正，五维达标再决策投入
- concept: 门窗项目实战验证
  desc: 线下小夫妻店不懂抖音，发作品获客对接厂家发货，月询盘30-60、高客单高利润，验证蓝海可行性
exercises:
- 'no': 1
  title: 实战演练：BOSS直聘『海选』目标赛道
  contents:
  - 任务：选择一个你感兴趣但不熟悉的线下服务赛道（如：管道疏通、家电清洗、上门按摩、宠物上门喂养），在BOSS直聘完成一次『反向猎头』微型测试。
  - 步骤1：准备2-3份差异化简历（如：懂抖音获客的销售 / 懂技术的店长 / 想学手艺的小白），投递该城市前20个相关招聘。
  - 步骤2：记录HR/老板主动沟通的数量、回复速度、是否发送微信/电话、透露了哪些核心信息（合作模式/供应链/利润/痛点）。
  - 步骤3：遇到专业问题（如：疏通机型号选择/清洗药水配比/按摩手法流程），用ChatGPT实时生成专业回复继续对话。
  - 步骤4：复盘：哪家透露的『项目模型』最清晰？哪个老板最愿意合作？你是否摸清了『获客-履约-分成』全链路？
  - 回答问题：
  - '- 如果10家回复，只有1家发微信给详细政策，这说明什么？'
  - '- ChatGPT回复的专业话术，对方能否识破？如何规避『AI味』过重导致信任崩塌？'
  - '- 此赛道是否符合『幼儿园打小朋友』特征？竞争对手是否『不懂互联网、线下小夫妻、画面low』？'
- 'no': 2
  title: 拆解招聘JD：从『职位描述』反推『商业模式画布』
  contents:
  - 任务：收集某细分赛道（如：同城家政/门窗安装/代理记账/成人用品外卖）的20条高频招聘JD（职位描述），用ChatGPT批量结构化拆解。
  - Prompt参考：【角色：资深商业分析师】请分析以下20个JD，提取共性字段：1.核心业务动作 2.获客渠道暗示 3.供应链/履约模式 4.薪资结构推算利润率
    5.隐性招聘目的判断（真招人/招客户/招流量）。输出Markdown表格。
  - 步骤1：用RPA/手工采集JD文本（含公司名、薪资、职责、要求、福利）。
  - 步骤2：喂给ChatGPT生成『赛道商业模式共性报告』。
  - 步骤3：人工验证：报告中『获客靠抖音/私域』是否属实？『厂家直发/一件代发』是否可落地？
  - 回答问题：
  - '- JD中『底薪3000+高提成』vs『纯提成/合伙人制』分别暗示了什么样的现金流结构？'
  - '- 如何从『要求：熟悉抖音/视频号/私域运营』反推同行已进入数字化阶段，新人切入点应在哪里？'
  - '- 发现某公司『年薪20万招运营总监』却长期挂着不撤，结合『幼儿园打小朋友』判断：是真缺人，还是借招聘做品牌曝光？'
- 'no': 3
  title: 设计最小化RPA+ChatGPT自动化闭环原型
  contents:
  - 任务：针对上一练习筛选出的『最优项目』，设计一套『非程序员可落地』的RPA+ChatGPT自动化流程原型（无需写代码，画流程图/写伪代码/列清单均可）。
  - 场景：每日自动采集该赛道新发招聘JD -> ChatGPT提取『新出现的获客渠道/新品类/新合作政策』 -> 推送至你的飞书/微信 -> 你只需一点点确认『是否跟进』
    -> 确认后自动生成求职简历/招聘文案 -> RPA批量投放/发布。
  - 清单设计：
  - 1. RPA端（影刀/按键精灵/Automa）：触发条件、采集字段、去重逻辑、投放动作、异常处理（验证码/频控/页面变更）。
  - 2. ChatGPT端：System Prompt设计（行业术语库/竞品情报库/话术红线）、变量映射（JD片段->简历亮点）、输出格式约束（JSON/Markdown）。
  - 3. 人工决策节点：审核队列UI（飞书多维表格/Notion/Excel）、确认按钮触发下游RPA。
  - 4. 知识飞轮：新话术/新报价/新避坑指南 -> 自动写入ChatGPT专属知识库（RAG/长文本喂养）。
  - 回答问题：
  - '- 环境差异（浏览器缩放/分辨率/文件路径）是RPA落地最大变数，如何用『人工跑通一次再自动化』原则设计标准化环境SOP？'
  - '- 紫鸟浏览器不兼容第三方RPA，若目标平台强制需紫鸟（如亚马逊后台），该流程如何迁移/替代？'
  - '- 单条JD采集到推送完成，人工决策耗时<30秒，全自动化耗时<2分钟，边际成本趋近零。若日处理500条，相当于替代多少人工工时？ROI如何量化？'
- 'no': 4
  title: 『幼儿园打小朋友』赛道筛选与验证清单
  contents:
  - 任务：列出你所在城市5个符合『幼儿园打小朋友』特征的线下非标服务赛道，并按五维筛选法打分（满分50分），选最高分赛道制定『首周手动跑通』计划。
  - 候选赛道示例：上门收纳整理、老年人陪诊/陪聊、宠物上门美容/医疗、家电维修/清洗、定制家具/门窗安装、同城相亲服务、成人用品即时配送、二手奢侈品上门回收。
  - 五维打分表（每维1-10分）：
  - 1. 操作难度：是否『傻瓜化复制粘贴』可上手？（如：发作品/加微信/转单给师傅）
  - 2. 平台规则：是否顺应平台鼓励？（如：视频号扶持同城/小红书扶持家居/抖音扶持生活服务）
  - 3. 绿色合规：无证照准入壁垒、无法律红线、无平台封杀风险。
  - 4. 可批量化：是否可多账号矩阵/多城市复制/模拟器多开/RPA替代？
  - 5. 周期利润：单客利润>200元、复购率>30%、回本周期<4周、长期主义可做。
  - 首周手动跑通计划模板：
  - Day1-2：注册3-5个平台账号（抖音/视频号/小红书/咸鱼/BOSS），完善人设主页。
  - Day3-4：产出10条『对标爆款翻拍/ChatGPT生成文案』内容，定时发布。
  - Day5-6：私域引流（主页挂链/私信钩子/评论区截流），加满20个精准意向客户/师傅。
  - Day7：成交/派单至少1单，复盘『获客成本/转化率/履约难点/利润实测』，决定是否投入RPA/团队放大。
  - 回答问题：
  - '- 为何要求『销售优先于供应链』？若Day7前搞不定厂家/师傅资源，是否应先跑通『发内容-引流-收线索』再补供应链？'
  - '- 『六十分即冲』在选赛道时如何应用？总分40分但『周期利润』满分10分的赛道，能否启动？'
  - '- 如何用『信息差与执行力护城河』理论，预判该赛道3个月后是否会涌入竞争者？你的护城河在哪里？'
