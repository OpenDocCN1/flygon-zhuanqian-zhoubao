paper: docs/202303/TQMkd13LIos5sexxqWZcBHMUnif.md
desc: 该素材系统阐述了利用ChatGPT进行小红书笔记创作的五大提示词模式（特定指令、指令模板、示例模式、代理模式、混合模式），通过“推荐使用ChatGPT制作简历”这一统一主题的对比案例，详细演示了从基础到进阶的Prompt工程实战技巧，并总结了AI工具赋能内容创作的核心价值：将不及格内容快速提升至合格水平，同时强调思考不可外包，结合职场场景延伸论述了AI时代个人核心竞争力的构建路径。
concepts:
- name: Prompt提示关键词分级体系
  desc: 将ChatGPT的提示词按能力要求和结构复杂度分为四种基础模式（特定指令、指令模板、示例模式、代理模式）及一种进阶混合模式，对应用户从新手到专家的熟练度阶梯。
  is_original: true
  excerpt:
  - 输入的Prompt提示关键词，可以归类为4种常见的基础模式：分别是：特定指令、指令模板、示例模式、代理模式。
  - 除了上面的4种基础模式外，在实际使用ChatGPT过程中，我们更多使用的是另一种模式—混合模式。
  - 以上使用ChatGPT创作小红书的五种模式，对应着不同的熟练度，也是对各位拿着铲子淘金人的水平要求
- name: 小红书笔记标准化结构
  desc: 定义了高质量小红书笔记的四段式结构模板：开头（痛点引入+情景描述+人设+方法介绍+点赞诱导）、中间（1-5个知识点，重点讲解核心1-2个）、结尾（提高关注率、人设强化、引导主页）、标签（热门标签自打）。
  is_original: true
  excerpt:
  - '一篇小红书笔记主要包括4个部分：

    开头：痛点引入+情景描述+人设+方法介绍+点赞诱导

    中间：讲知识点，范围控制在1~5个，如果是5个重点讲其中的两个，如果是3个重点讲其中1个，有重点，效果会更好。

    结尾提高关注率

    说明我是常常，常常写的内容是一个系列来，欢迎大家点击主页查看更多精彩内容

    最后，给笔记打上热门标签（自己打标签，选择热度高的）'
- name: 人设注入式代理模式
  desc: 代理模式的进阶形态，不仅指定角色身份，还需注入具体的人设属性（如年龄、性格、语气风格、内容偏好），使输出内容符合创作者独特的IP调性，而非泛泛的角色扮演。
  is_original: true
  excerpt:
  - 普通的代理模式...是直接站在小红书博主角色的角度进行创作的，但是不同的博主本身也有着各自的人设...更为高级的代理模式使用方法是，结合自身的人设定位，将人设的形象具体化，使用人设的语气和风格来进行创作。
  - 请你扮演积极活泼、喜欢推荐物品的22岁小姐姐，以有趣、积极、 活泼的语气...
- name: AI内容创作‘及格线’理论
  desc: 提出ChatGPT核心价值非在于直接生成爆款，而在于将创作者的‘不及格’内容快速提升至‘合格博主’水平，作为能力建设的脚手架，而非替代思考的捷径。
  is_original: true
  excerpt:
  - 使用ChatGPT创作的小红书爆款笔记不一定能爆，但是最关键的是它能帮助你把自身原来不及格的小红书笔记，快速提升到一个合格博主的创作水平，帮助你快速提升小红书笔记的写作能力。这才是最关键的。
  - 内容可以外包，思考终究还是自己的。
- name: 工作流AI化生存法则
  desc: 在AI浪潮下，普通人的核心竞争力在于‘有意识地把AI工具应用到自己的工作流程中，不断优化、打磨，让自己在某个工作流程中，成为最会使用AI的那个人’，从而规避被替代风险。
  is_original: true
  excerpt:
  - 如果你和我一样只是一个普通人，那么无论你在哪一个岗位，只要你有意识地把AI工具应用到自己的工作流程中，不断优化，打磨，让自己在某个工作流程中，成为最会使用AI的那个人，你就不用担心会有被AI替代的那天。
methods:
- name: __overview__
  desc: 基于Prompt分级体系的小红书创作全流程方法论：从明确平台风格规则（指令模板）出发，引入爆款范例对齐（示例模式），注入个人IP人设（代理模式升级版），最终通过结构化指令+范例+人设的混合模式实现高质量内容的标准化批量产出。
  excerpt:
  - 关键词：小红书的写作风格是一个很吸引人的标题，每段文字都加了emoji，并且在最后加上一些与内容相关的标签。
  - 我们可以直接把自己寻找到的优秀笔记，以示例的形式，展示给ChatGPT，请它模仿�记...
  - 请你扮演积极活泼、喜欢推荐物品的22岁小姐姐，以有趣、积极、 活泼的语气...
  - 请以上面的内容结构，按照开头、中间、结尾、最后四个部分创作，将下面的内容（素材）优化成一篇小红书笔记。
- name: 指令模板法
  desc: 通过显式定义目标平台的文体规范（标题、Emoji、标签、结构）作为系统指令，约束模型输出格式，实现非结构化素材到平台规范内容的标准化转换。
  excerpt:
  - 关键词：小红书的写作风格是一个很吸引人的标题，每段文字都加了emoji，并且在最后加上一些与内容相关的标签。请用小红书的写作风格，以“推荐使用ChatGPT写求职简历“为主题”写一篇小红书笔记。
  - ChatGPT最大的价值是将输入的非标数据变成标准化数据，指令模板是ChatGPT价值最直接的特征体现。
- name: 示例模式法
  desc: 采用Few-shot学习范式，将高质量爆款笔记作为示例输入Prompt，引导模型模仿其文体、结构、语气进行创作，解决纯指令模板下‘呆板无创新’的问题。
  excerpt:
  - 示例模式下，就是让ChatGPT去有意识的模仿我们想要的答案...我们可以直接把自己寻找到的优秀笔记，以示例的形式，展示给ChatGPT，请它模仿笔记...
  - 这种模式需要小红书笔记创作者，对小红书的爆款笔记有一定的了解，能够找到适合自己对标的爆款笔记。
- name: 人设注入代理法
  desc: 在Role-Play基础上，叠加具体的人设画像（年龄、性格、语气、内容偏好）与平台风格指令，使模型输出具备创作者独特的IP辨识度，而非通用角色风格。
  excerpt:
  - 请你扮演积极活泼、喜欢推荐物品的22岁小姐姐，以有趣、积极、 活泼的语气，用小红书的写作风格，以“推荐使用ChatGPT写求职简历”为主题，写一篇小红书笔记...
  - 结合自身的人设定位，将人设的形象具体化，使用人设的语气和风格来进行创作。
- name: 结构化混合模式法
  desc: 将‘平台结构模板（指令模板）+ 原始素材（特定指令）+ 爆款范例（示例模式）+ 人设指令（代理模式)’组合为复合Prompt，针对复杂创作任务实现结构、内容、风格、人设的多维度精准控制。
  excerpt:
  - 混合模式通常是为了完成一个复杂任务，同时使用多种基础模式的组合。
  - 5.1 指令模板：一篇小红书笔记主要包括4个部分... 5.2 特定指令：请以上面的内容结构...将下面的内容（素材）优化成一篇小红书笔记。
  - 如果你觉得还不够，还可以在指令模式、特定模板的基础上，叠加代理模式...
theorems:
- name: 提问质量决定AI使用留存定律
  desc: 好的提问能让用户获得正向反馈从而持续探索，差的提问导致负面体验进而放弃工具；Prompt质量是用户能否跨越‘尝鲜期’进入‘深度应用期’的关键分水岭。
  excerpt:
  - 一个好的提问决定了这个人是否能够长时间使用ChatGPT。
  - 好的提问，会让ChatGPT直接给出你想要的答案，让你直呼“牛X...我一定要探索”...不好的提问，会让ChatGPT搞不清楚状况，让你觉得ChatGPT被吹嘘过度...从此放在一边。
- name: ChatGPT核心价值：非标转标准
  desc: ChatGPT的最大价值不在于‘创造’，而在于‘转化’——将用户输入的非结构化、非标准化数据（想法、素材、口语）转化为符合特定平台规范、结构化的标准化输出。
  excerpt:
  - ChatGPT最大的价值是将输入的非标数据变成标准化数据，指令模板是ChatGPT价值最直接的特征体现。
- name: 学习即模仿：示例优于指令
  desc: 对于追求高质量、个性化的创作任务，提供高质量范例（示例模式）优于编写详尽规则（指令模板），因为模型通过模仿隐性知识的习得效果优于显性规则的遵循。
  excerpt:
  - 指令模板很好用，但是ChatGPT给出的结果...标准不会错，但也代表着呆板没有创新。
  - 真正的学习，绝不是坐在那里听PPT，而是看看周围的人在做什么，然后你去模仿他。
  - 在这种模式下创作，ChatGPT给出的答案，相对来说效果更好。
- name: AI辅助创作‘脚手架’定位论
  desc: AI工具定位为能力建设的脚手架：帮助创作者跨越‘不及格’到‘合格’的鸿沟，而非包办‘爆款’；创作者需保留核心思考（选题、逻辑、人设），仅将执行层（措辞、排版、润色）外包给AI。
  excerpt:
  - 使用ChatGPT创作的小红书爆款笔记不一定能爆，但是最关键的是它能帮助你把自身原来不及格的小红书笔记，快速提升到一个合格博主的创作水平...
  - 内容可以外包，思考终究还是自己的。
  - 这些淘金知识（基础淘金知识），才是未来每个行业从业者真正的核心竞争力。
- name: 工作流嵌入式AI竞争力模型
  desc: 个人抗风险能力 = 领域专业度 × AI工具嵌入工作流的深度。唯有将AI工具深度融入特定工作流节点（如HR筛选简历、求职者模拟面试），形成‘人机协同’的独家SOP，才能构建不可替代的护城河。
  excerpt:
  - 只要你有意识地把AI工具应用到自己的工作流程中，不断优化，打磨，让自己在某个工作流程中，成为最会使用AI的那个人，你就不用担心会有被AI替代的那天。
  - 作为公司人事岗的一名HR...让ChatGPT给出你一些面试的重点...作为一个将要面试公司岗位的面试者...让ChatGPT扮演你的角色，你来模仿面试官进行提问...
findings:
- name: 五种模式输出质量阶梯实证
  desc: '[evidence] 以同一主题‘推荐使用ChatGPT制作简历’为对照组，素材展示了从特定指令（仅确认知晓平台）、指令模板（具备平台风格但泛泛）、示例模式（贴近爆款结构与语气）、代理模式（具备角色感）、人设注入代理模式（强IP辨识度）、混合模式（结构规范+内容详实+人设鲜明+可读性最强）的输出质量显著跃升。'
  excerpt:
  - 特定指令：...真正的价值远远没有被发挥。
  - 指令模板：...是不是明显要比特定指令下的内容更为具有小红书的风格？
  - 示例模式：...ChatGPT给出的答案，相对来说效果更好。
  - 代理模式：得到的结果会是下图...
  - 代理模式升级版：...使用人设的语气和风格来进行创作。
  - 混合模式：大家对比下，是不是要比原来的小红书爆款笔记阅读体验更好。
- name: 专家评估验证：混合模式达合格博主水准
  desc: '[claim] 作者私下请教对创作要求极高的匿名教练评估，其使用混合模式生成的内容获得70-80分评价，佐证了该方法论能将内容推至‘合格博主’水平。'
  excerpt:
  - 在小红书航IP实战群中，我私下向一位不愿意透露姓名的教练请教...当这位教练对我使用ChatGPT创作的内容给到了70-80分的评价时，我觉得ChatGPT在小红书的内容创作上会有非常大的价值和应用空间。
- name: LinkedIn+ChatGPT求职实战案例验证
  desc: '[evidence] 素材引用的一篇真实小红书爆款笔记素材，详细记录了‘LinkedIn找JD -> ChatGPT生成简历/CL -> 搜索在职员工简历参考’的完整SOP，实测可将单份简历制作时间压缩至半小时，海投效率提升1倍以上，验证了AI赋能职场具体场景的可行性。'
  excerpt:
  - 素材：很多毕业生到了毕业季才想起来写简历...现在有了LinkedIn 加 ChatGPT,半小时就能搞定你的简历和cover letter...
  - 步骤1：去LinkedIn 找到相关工作申请...步骤3：打开Chat GPT, 对话框输入 帮我写一段关于以下工作要求的简历...
  - 如果你是海投简历找入门级工作，ChatGPT已经能满足你的所有需求了，只需稍加修改格式，你投简历的效率就能高出至少一倍以上。
