  name: 刚需/高频/高粘性产品优先论
  points:
  - '**为什么需要这个概念？**'
  - '- 选品是创业成败的「一票否决」项，产品属性决定商业模式上限与运营难度'
  - '- 该定律为选品提供可量化的决策标准，规避「好看但不赚钱」的陷阱'
  - '- 核心逻辑：产品属性（刚需/高频/粘性/客单价）决定商业模式可行性边界'
  - '**核心定义**'
  - '- 刚需：奶粉/考证/祛斑等生命/职业刚性需求，无替代性、决策快、抗周期'
  - '- 高频：复购周期短（日/周/月），用户习惯养成、LTV高、现金流稳定'
  - '- 高粘性：低退货率（祛斑30% vs 服饰高退货）、强依赖、转化率高'
  - '- 高客单价：利润空间覆盖获客成本，支撑付费流量与私域运营投入'
  - '**关键性质**'
  - '- 产品属性决定商业模式上限：知识付费长周期高利润/实物电商供应链壁垒'
  - '- 祛斑类：小蓝海、退货率30%左右、粘性强、适合私域沉淀'
  - '- 公考/教育：高利润硬刚需、制作周期长、适合长期主义'
  - '**典型例子**'
  - '- 奶粉：硬通产品，有孩子出生就要喝，属于刚需'
  - '- 祛斑：综合退货率30%左右，比较低，产品粘性强，适合做私域'
  - '- 公考/教育付费：高利润硬刚需、知识付费变现模式、制作时间长'
  - '**边界条件**'
  - '- 仅适用于以产品为核心杠杆的商业模式，纯流量/纯技术模式另论'
  - '- 刚需不等于高利润，需匹配转化能力与供应链把控'
  sources:
  - paper: docs/202303/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf.md
    role: origin
  excerpts:
  - 奶粉是硬通产品，只要有孩子出生就要喝奶粉。属于刚需产品。
  - 祛斑属于小蓝海，综合退货率30%左右，比较低，产品粘性强，适合做私域。
  - 公考...教育付费的高利润硬刚需...知识付费变现模式...制作时间比较长，适合长期做。
