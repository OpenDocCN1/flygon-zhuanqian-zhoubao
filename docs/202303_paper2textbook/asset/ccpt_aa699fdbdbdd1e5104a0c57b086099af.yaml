paper: docs/202303/20230328_119.md
desc: 该素材为一篇经验分享类技术文章，作者以Python零基础小白身份，复盘利用ChatGPT辅助编写爬虫代码、定位网页元素及合并Excel文件的全过程，核心在于展示"人机协作"模式下，非程序员如何通过结构化提示词工程、迭代式调试与异常反馈机制，驱动大语言模型生成可落地生产代码的实战方法论。
concepts:
- name: 小白驱动开发
  desc: 指非专业程序员（仅懂基础语法）作为主导者，通过自然语言向AI提出需求、反馈报错、引导修改，从而完成完整软件工程任务的开发范式。
  is_original: true
  excerpt:
  - 懂一点基础元素和 For、IF 等常见语句，进阶的基本不懂，自己写基本什么都写不出来那种小白水平。
  - 不停地捣鼓 ChatGPT，让它帮我写了一段 Python 代码，成功爬取到自己想要的数据。
- name: Prompt 迭代闭环
  desc: 将Prompt视为动态演进的工程产物，经历"初版提问 -> 报错反馈 -> 补全上下文 -> 完善约束 -> 定稿复用"的全生命周期管理过程。
  is_original: true
  excerpt:
  - 文章大纲如下：... 三、Prompt 梳理 3.1 聊天问题梳理 3.2 Prompt 完善 3.3 需求总结
- name: 异常驱动修正
  desc: 利用代码运行报错信息（Traceback）作为核心反馈信号，直接喂给LLM进行定向修复，替代传统调试中的人工读码分析环节。
  is_original: false
  excerpt:
  - 如何调教 ChatGPT 并实现抓取？
  - 3.1 聊天问题梳理
methods:
- name: __overview__
  desc: 基于"需求拆解-上下文注入-报错迭代-模板沉淀"四阶段的ChatGPT协作开发标准流程。
  excerpt:
  - 一、为什么让 ChatGPT 帮忙写爬虫？
  - 二、如何调教 ChatGPT 并实现抓取？
  - 三、Prompt 梳理 3.1 聊天问题梳理 3.2 Prompt 完善 3.3 需求总结
  - 四、复盘总结
- name: HTML结构定位与选择器提取法
  desc: 指导小白使用浏览器开发者工具（F12）定位目标数据的Class标签与层级结构，将结构化HTML片段作为上下文喂给ChatGPT，解决LLM无法直接访问实时网页DOM的物理限制。
  excerpt:
  - 如何在网页中定位&提取 Class 的标签和值
- name: 增量式上下文构建法
  desc: 不一次性给出所有需求，而是先跑通单一核心功能（如单页爬取），再逐步追加分页、反爬应对、数据清洗、存储格式等复杂约束，降低单轮推理复杂度。
  excerpt:
  - 3.1 聊天问题梳理
  - 3.2 Prompt 完善
- name: 报错全文反馈法
  desc: 将Python终端完整的Traceback报错堆栈直接复制粘贴给ChatGPT，附带当前代码版本，要求定点修复，实现无需看懂代码即可调试的自动化修正。
  excerpt:
  - 3.1 聊天问题梳理
theorems:
- name: 自然语言即编程接口假说
  desc: 对于明确边界的工程任务（爬虫、文件处理），自然语言配合结构化上下文（HTML片段、报错日志、文件样例）可完全替代编程语言作为开发接口，降低编程门槛至"会描述问题"即可。
  excerpt:
  - 读完这篇文章，至少可以让你学会以下几个技能：1. 如何让 ChatGPT 帮你写爬虫 ...
  - 相信也有情况跟我类似的朋友有此需求，希望能对大家有所启发。
- name: 人机分工重构定律
  desc: 在AI辅助编程中，人类核心职能从"编写语法"转移为"任务拆解、上下文准备（选择器/样例/报错）、验收测试、迭代决策"，AI承担"语法实现、库选型、样板代码生成、错误修复"。
  excerpt:
  - 先简单介绍一下自己的 Python 水平... 因此，基于本次实现过程做一个复盘和分享
  - 如何调教 ChatGPT 并实现抓取？
- name: Prompt工程即需求工程论
  desc: 高质量Prompt的本质是完整的软件需求规格说明书，包含角色设定、输入输出格式、异常处理规则、边界约束，Prompt完善过程即需求澄清与确认过程。
  excerpt:
  - 三、Prompt 梳理 3.1 聊天问题梳理 3.2 Prompt 完善 3.3 需求总结
findings:
- name: 零基础可落地生产级爬虫
  desc: '[claim] 作者声称仅凭基础语法知识，在两天半内通过ChatGPT完成了可用于生产的爬虫开发（含分页、反爬、数据存储）。'
  excerpt:
  - 这次前后花了两天半... 成功爬取到自己想要的数据。
- name: ChatGPT擅长单文件脚本而非工程架构
  desc: '[evidence] 素材隐含发现：全流程聚焦于单脚本生成与Excel合并等独立任务，未涉及项目结构设计、模块解耦、单元测试等软件工程层面，暗示LLM当前更适合"脚本级"而非"系统级"开发辅助。'
  excerpt:
  - 让它帮我写了一段 Python 代码
  - 如何让 ChatGPT 帮你合并多个表头相同的 Excel 文件
- name: 飞书文档权限管理不可控性
  desc: '[evidence] 评论区多用户反馈飞书链接无权限访问，作者多次回复"已调整"，揭示外部文档链接作为知识载体在分发时效性与权限稳定性上的缺陷。'
  excerpt:
  - 飞书阅读怎么提示我没有权限..
  - 已调整，不知道怎么被关闭了。
  - 已调整
- name: 小白调试核心痛点是"看不懂报错"与"不会提问"
  desc: '[evidence] 文章大纲设置"如何调教"、"Prompt梳理"、"定位Class标签"等章节，反向印证非程序员在AI协作中的核心障碍在于：无法解读异常堆栈、不知如何提供精准上下文（HTML结构）、缺乏将模糊需求转化为确定性Prompt的能力。'
  excerpt:
  - 文章大纲如下：... 二、如何调教 ChatGPT 并实现抓取？ 三、Prompt 梳理... 3.1 聊天问题梳理
