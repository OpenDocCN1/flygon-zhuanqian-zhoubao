units:
- 'no': 1
  name: 龙哥赚钱周报 —— 付费社群核心交付物的索引与分发
  points:
  - '**为什么需要这个概念？**'
  - '- 付费社群需要核心交付物维持会员留存与付费价值感知'
  - '- 需要将分散的高质量内容（风向标）结构化汇总，降低成员获取成本'
  - '- 需通过版权控制构建稀缺性，防止核心资产流失贬值'
  - '**核心定义**'
  - '- 定义：持续更新的付费社群核心交付物，承载“龙哥风向标”核心内容的周度汇总载体'
  - '- 形式：基于语雀文档，采用固定链接归档，分类标签（中括号）结构化组织'
  - '- 特征：引用社交互动数据（点赞/精华/评论图）增强可信度，版权声明控制传播范围'
  - '**关键性质**'
  - '- 周期性：每周更新，形成固定预期与节奏感'
  - '- 索引性：本体为目录索引，核心实质内容寄宿于外部语雀文档链接'
  - '- 稀缺性：通过“请勿外流、防止失效”版权声明构建付费壁垒'
  - '**典型例子**'
  - '- 2023年3月刊总目录：汇总四周精华帖标题与分类，覆盖AI工具、跨平台运营、私域流量、电商变现、个人成长五大板块'
  - '- 第4周周报标题记录：提供单期报告文档标题与来源链接，作为深度研读定位锚点'
  - '**边界条件**'
  - '- 内容完整性依赖外部链接：若语雀链接失效，索引页将变为空心化壳，核心知识资产永久流失'
  - '- 仅作检索入口：素材本身不包含具体商业案例、方法论实操细节，无法直接用于教学案例拆解'
  - '- 版权执行依赖信任：无技术级DRM手段，仅靠社群契约与“防止失效”心理威慑'
  sources:
  - paper: docs/202303/20230328_001.md
    role: origin
  excerpts:
  - '# 🍔230405 龙哥赚钱周报'
