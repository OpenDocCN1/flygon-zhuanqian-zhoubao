unsupported_claims:
- location: '69.7'
  claim: 作者亲测：投资年限短时直接买投顾产品，把择时选股外包给机构，规避了“买错基金、错过行情、恐慌止损”三大人性弱点。这是“认知边界内的最优解”。
  reason: 素材中未找到作者亲测投顾产品的具体收益数据、持有周期或对比基准，仅见作者自述“个人投的是投顾类产品”，缺乏实证支撑“最优解”结论。
- location: '69.6'
  claim: 35%是“可执行且有效”的平衡点，作者明确表示“后续逐步调高到50%”。
  reason: 素材中仅出现“目标≥35%”“后续逐步调高到50%”表述，未给出35%为何为平衡点的量化推导或历史回测数据，属经验主张而非实证结论。
- location: '69.8'
  claim: 现低阻力体系：支付宝自动记账→鲨鱼记账一键同步→晚10点打开APP确认分类30秒→周日看折线图调整预算，坚持1000+天。
  reason: 素材评论区仅有用户自述“坚持1138天”“用两个月养成习惯”，未见作者本人1000+天坚持的直接证据，系引用用户评论作佐证。
- location: '69.9'
  claim: 净资产曲线向上穿越关键节点（10万/50万/100万）时，产生强烈成就感，对抗当下消费诱惑。
  reason: 素材中未提及具体净资产节点数值及心理机制描述，属教材层面的教学性假设，非素材实证内容。
- location: '69.10'
  claim: 行动触发阈值：跑道<3个月→生存模式；3-6个月→缓冲模式；>12个月→发展模式。
  reason: 素材原文仅给出生存跑道公式与“跑道长短决定行动模式”定性描述，未划分上述具体月数阈值，系教材二次加工产出。
- location: '69.11'
  claim: 打工占可支配精力34.7%，理财仅需0.7%时间(10分钟/天)，撬动34.7%精力产出的财富。
  reason: 素材中“34.7%”源于“250/360*50%”估算，“0.7%”源于“10分钟/1440分钟”，两者均为作者粗略估算，非实测数据。
- location: '69.11'
  claim: 年均获益2000-5000元，相当于免费加薪。
  reason: 素材中未出现信用卡权益年均收益量化数据，属教材经验性估算。
- location: '69.12'
  claim: 普通人若储蓄率稳定35%+投资年化6%+复利，约需15-20年完成全程跃迁。
  reason: 素材未给出该推算依据与参数设定，属教材推演性结论，非素材直接主张。
