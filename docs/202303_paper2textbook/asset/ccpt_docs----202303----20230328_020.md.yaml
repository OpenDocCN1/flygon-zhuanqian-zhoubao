paper: docs/202303/20230328_020.md
desc: 该素材为生财有术社群内部分享文章的引用导语，作者“非洲水手”凭借操盘10位数美金预算、日消耗6位数流水等头部出海从业者资历建立权威性，核心旨在引导读者跳转至飞书文档查看完整的《关于出海工具产品营销推广经验分享》实战干货，重点覆盖移动端App买量、创意素材生产、Web3用户增长及英文工具站航海实战等出海变现路径。
concepts:
- name: 出海老兵权威背书
  desc: 作者通过量化过往战绩（预算规模、流水规模、创意量级、发行产品数）建立个人IP信任状，作为分享内容专业度的背书锚点。
  is_original: true
  excerpt:
  - 操盘过 10 位数美金预算，日消耗 6 位数流水，创意过 5 位数素材，发行过 3 位数产品的出海老兵
- name: 生财有术航海实战体系
  desc: 社群组织的结构化实战训练营模式，以‘英文工具站’为具体赛道，聚合380名学员进行海外市场赛道玩法与实操的协同探索。
  is_original: true
  excerpt:
  - 刚刚结束的 3 月生财《英文工具站》航海实战中，我很荣幸和 380 名优秀船友一起探索了诸多海外市场赛道的玩法和实操
- name: Web3海外用户增长
  desc: 作者当前职业定位，将传统移动出海买量经验迁移至Web3领域，代表出赛道从工具/游戏向加密原生应用的扩展。
  is_original: false
  excerpt:
  - 目前在一家头部 Web3 负责海外用户增长
methods:
- name: __overview__
  desc: 采用‘权威背书引入 + 社群实战背景铺垫 + 核心内容外链跳转’的分发策略，利用飞书文档承载长文本详细方法论（买量模型、创意生产SOP、工具站SEO等），评论区沉淀高意向线索。
  excerpt:
  - 篇幅较长，请大家移步飞书查看全文：海外平台 https://i.shengcaiyoushu.com/docx/MbPSdzV5OobKXuxP5QucgzXCndb
theorems:
- name: 实战经验优于理论教学
  desc: 核心主张：只有深度参与大预算实操（买量、创意、发行）并见证学员变现结果的经验分享，才能为出海从业者提供有效的思维碰撞与避坑指南。
  excerpt:
  - 因为一直在移动出海圈子，我的分享会主要以 App 为主，希望能给大家带来一些不一样的思维碰撞。
  - 见证了一大批优秀圈友在生财发现了新机会，挖掘出了第一桶金并不断放大。
- name: 工具与游戏买量方法论通用性
  desc: 核心主张：工具类产品与游戏产品在买量底层逻辑（创意测试、素材迭代、ROI模型）上具有高度可迁移性，掌握通用买量方法论可横向拓展赛道。
  excerpt:
  - 多年来一直深耕工具和游戏产品的买量
findings:
- name: 社群成员高变现验证
  desc: '[claim] 作者宣称见证大批圈友在生财社群发现机会、挖掘第一桶金并放大，验证了‘航海实战’教学模式的有效性。'
  excerpt:
  - 见证了一大批优秀圈友在生财发现了新机会，挖掘出了第一桶金并不断放大。
- name: 头部从业者稀缺性引发强社交需求
  desc: '[evidence] 评论区出现‘求好友位代查AppAnnie Pro’、‘请问还可以帮忙代查询’等高价值数据工具协作请求，印证头部从业者掌握的付费工具账号与数据解读能力是新入局者最稀缺的资源。'
  excerpt:
  - '时代一粒沙 : 一看到 appannie pro，顿时觉得水手大佬好牛逼，求好友位代查，v: arkilis'
  - '动次打次🙈🙈 : 您好 请问还可以帮忙代查询吗？'
- name: 英文工具站赛道验证完成
  desc: '[claim] 3月航海实战已结束，380名船友完成‘靠岸’（指完成变现闭环或关键节点），表明该赛道在当期已跑通标准化SOP。'
  excerpt:
  - 刚刚结束的 3 月生财《英文工具站》航海实战中... 恭喜靠岸
