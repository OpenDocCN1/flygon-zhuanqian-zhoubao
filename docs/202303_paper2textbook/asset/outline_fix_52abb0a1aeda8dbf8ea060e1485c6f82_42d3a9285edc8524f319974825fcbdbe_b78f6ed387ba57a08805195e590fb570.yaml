    desc: 同等纯度规格下换算单克价格进行横向比价，还原黄金真实价值，规避一口价陷阱。
    role: method
    src:
    - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
  - 'no': 4
    name: 纸黄金优于实物黄金普通人投资适配性定理
    desc: 纸黄金因零保管费/极低手续费(万0.5%-万1%最低0.1元)/高流动性/可灵活加减仓，综合收益率与操作体验优于实物黄金(一次性买入被套无法操作/年保管费300元)。
    role: proof
    src:
    - paper: docs/202303/PCa9dFWnconYupxUf7bcAxghnwc.md
  - 'no': 5
