learning_targets:
- 理解体制内副业的核心合规边界与红线定义
- 掌握以生活兴趣为切入点解耦主业风险的选题策略
- 学会使用微信分组功能消除熟人社交心理包袱
- 掌握免费社群向付费社群转型的标准化迭代路径
- 理解咨询服务阶梯定价法：从免费验证到标准化高价包的进化逻辑
- 掌握每日复盘坚持法构建个人IP的时间复利机制
- 学会跨圈层主动暴露法通过价值交换获取顶流背书
- 掌握航海跟随试错法低成本跑通0-1积累可迁移核心技能
concept_map:
- 体制内副业突围体系
- ├── 合规底线（生存基石）
- │   ├── 不触碰单位明文红线（直播带货/资金交易）
- │   ├── 不利用职务便利/资源获利
- │   └── 不经手熟人/利益相关方生意（工作范围内免费）
- ├── 切入点策略（天然解耦）
- │   └── 下班后8小时变现论：生活兴趣（装修/育儿/健身/民宿）⊥ 本职工作
- ├── 心理障碍破解（物理隔离）
- │   └── 熟人屏蔽分组法：【看广告】/【不看广告】二元标签，犹豫者默认不可见
- ├── 变现模型迭代（信任飞轮）
- │   ├── 免费社群向付费社群转型：积累(1.5年)→门槛(99/年)→迭代(399/年+999咨询)
- │   └── 咨询阶梯定价法：免费→红包→199/h→999/3h标准化包（卖结果非卖时间）
- ├── 个人IP构建（时间复利）
- │   └── 每日复盘坚持法：600+天不断更，少20字多2000字，吸引大佬背书
- ├── 圈层破圈杠杆（价值交换）
- │   └── 跨圈层主动暴露：高质量评论+私信分享+毛遂自荐 → 顶流背书/精准客户
- └── 新手训练范式（低成本试错）
- └── 航海跟随试错法：低学费跟随成熟SOP实操，不求单次大赚，求跑通流程/积累网感/可迁移技能
life_analogy:
- 想象体制内副业突围是一场**‘带着镣铐跳舞’的马拉松**：
- '- **合规底线** = 跑道边的**红线护栏**：踩线即取消资格（丢饭碗），但护栏内你可以任意奔跑、甚至冲刺'
- '- **生活兴趣切入** = **穿自己的跑鞋跑**：不用穿单位发的皮鞋（职务资源），鞋合不合脚（擅不擅长）自己最清楚，领导管不着'
- '- **熟人屏蔽分组** = **给观众区装单向玻璃**：你能看见想看你的人（目标客群），熟人领导看不见你，你也就不心虚了'
- '- **免费转付费社群** = **先请邻居免费试吃烤串（免费群）**，确认好吃再挂牌收费（付费群），食客自己掏钱买单，理直气壮'
- '- **咨询阶梯定价** = **理发店定价进化**：免费剪→随意给钱→标价199→推出‘洗剪吹护理套餐999元’（标准化服务包），客户觉得划算你轻松'
- '- **每日复盘坚持** = **在朋友圈晒每日跑步打卡**：第1天没人理，第600天马拉松冠军（大佬）主动点赞邀请组队，坚持本身就是金牌'
- '- **跨圈层主动暴露** = **赛道边大喊‘教练，我这招呼吸法能省力’**：不求签名合影，给专业建议，教练反手把你推上大屏'
- '- **航海跟随试错** = **报名‘陪跑训练营’**：教练领跑、配配速员（SOP）、有补给站（社群），不求破世界纪录，只求学会跑完全程、练就心肺功能'
summary:
- concept: 体制内副业合规底线
  desc: 不触红线、不借职务、不经手熟人生意，工作范围内咨询免费，为副业生存筑基
- concept: 下班后8小时变现论
  desc: 以装修、育儿、民宿等生活兴趣为切入点，与主业天然正交，零包袱、强信任、易变现
- concept: 熟人屏蔽分组法
  desc: 微信好友仅分【看广告】/【不看广告】两组，发副业内容仅勾选可见组，物理隔离熟人视线，心理卸下包袱
- concept: 免费社群向付费社群转型模型
  desc: 免费积累信任内容(1.5年)→付费门槛筛选高意向(99/年起步)→内容迭代服务升级逐步提价(399/年+咨询)
- concept: 咨询阶梯定价法
  desc: 免费→红包随意→199/h→999/3h标准化包(含诊断/方案/清单/追问)，验证支付意愿锚定价值倒逼专业化
- concept: 每日复盘坚持法
  desc: 承诺日更(少20字多2000字)不断更600+天，利用时间复利积累真实轨迹吸引大佬背书与精准付费用户
- concept: 跨圈层主动暴露法
  desc: 高质量评论+私信分享经验+毛遂自荐提供价值，利用价值交换撬动顶流背书、流量与认知对齐
- concept: 航海跟随试错法
  desc: 低成本跟随社群成熟项目实操(TikTok/知乎好物/小红书)，不求单次大赚，只求跑通流程积累可迁移核心技能(网感/剪辑/写作/选品)
- concept: 体制内破圈自洽公式
  desc: 副业成功 = 合规底线(硬约束) × 生活兴趣(软切入) × 持久行动(核心变量) × 开放分享(放大器) × 心理建设(内核)
- concept: 坚持即稀缺定律
  desc: 在体制内环境中，坚持做一件超出常态的事(日更600天)本身即稀缺品牌资产，自动穿透圈层吸引顶流关注
- concept: 分享即变现法则
  desc: 将过程/经验/教训公开化、内容化，隐性经验转显性资产(流量/信任/咨询单/社群费)，财富流向跟随影响力流向
- concept: 零成本试错容错率公理
  desc: 主业兜底下试错成本仅为业余时间，损失趋近零，应大胆先动手再完善，小步快跑验证商业闭环
exercises:
- 'no': 1
  title: 体制内副业合规自查清单设计
  contents:
  - 假设你是一名公立医院医生/公立学校教师/事业单位行政人员（三选一），请列出：
  - 1. 你所在单位/行业明文禁止的副业行为红线至少3条
  - 2. 你可能无意中利用的职务资源/便利/信息至少2类
  - 3. 你的‘熟人/利益相关方’圈层画像（同事/家长/患者/供应商等），如何物理隔离副业触达？
  - 4. 基于以上，你能开展的3个‘天然正交’生活兴趣副业方向及理由
- 'no': 2
  title: 免费社群冷启动30天执行计划
  contents:
  - 选择一个你熟悉的生活领域（如：二手房装修避坑/科学育儿/家庭健身/美食探店），设计：
  - 1. 社群定位一句话Slogan（含目标人群+核心价值+差异化标签）
  - 2. 前30天内容产出日历：每天1条什么形式的干货（图文/语音/视频/文档）？解决什么具体痛点？
  - 3. 入群欢迎语话术（含：群规/福利领取/自我介绍/引导互动）
  - 4. 第30天向付费转型的决策判断指标：群人数/活跃度/内容沉淀量/用户付费意愿测试结果
- 'no': 3
  title: 咨询服务阶梯定价模拟推演
  contents:
  - 以你擅长的一个垂直领域（如：留学规划/职场面试/理财配置/装修设计）为例：
  - 1. 设计Lv.0免费体验版：提供什么？限制几名？如何收集案例与好评？
  - 2. 设计Lv.1红包随意版：如何引导‘不想白嫖’的用户付费？话术模板？
  - 3. 设计Lv.2低价试水版(199/h)与Lv.3标准化高价包(999/3h)的核心差异：交付物/服务流程/客户感知价值
  - 4. 计算：若Lv.3成交率为20%，月服务上限10单，月收入多少？扣除时间成本后时薪是否高于主业？
- 'no': 4
  title: 每日复盘坚持与跨圈层暴露实战周计划
  contents:
  - 制定一个为期7天的‘每日复盘+主动暴露’执行表：
  - 1. 每日复盘模板：固定3个问题（今日核心进展/最大教训/明日最关键动作），承诺字数不限但必须发布
  - 2. 筛选3-5位目标圈层大佬（认知高1-2级/业务相关/有互动习惯），记录其近期关注话题
  - 3. 每日针对1位大佬执行：高质量评论(>100字含数据/反直觉观点) 或 私信分享(附实用文档/避坑清单)
  - 4. 记录反馈：大佬回复/点赞/转发/加好友/无反应，周末复盘调整下周目标大佬名单
- 'no': 5
  title: 航海项目甄选与止损决策模拟
  contents:
  - 在生财有术/玩赚星球等社群浏览近期3个招募中的‘航海/陪跑营’项目（如：视频号带货/TikTok变现/小红书IP/知乎好物/AI工具变现），请对每个项目填表甄别：
  - 1. 教练实战数据：近3个月单账号/团队GMV/利润/ROI截图是否公开？
  - 2. SOP完备度：是否有《选品表/发布日历/话术库/去重参数/投流模板》等可直接执行的文档样章？
  - 3. 陪跑形式：教练亲自带/助教带/仅发文档？每周复盘频次？群内优秀船友案例？
  - 4. 止损线设定：若执行2周‘0粉/0咨询/0单’，或发现教练自己没在跑，你的退出决策触发条件是什么？
  - 5. 技能迁移清单：该航海能让你练就哪3项通用核心技能（如：选品逻辑/剪辑节奏/私域转化话术）？
