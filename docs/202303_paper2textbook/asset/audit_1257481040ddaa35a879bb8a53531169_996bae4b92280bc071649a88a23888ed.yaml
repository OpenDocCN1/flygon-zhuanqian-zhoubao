unsupported_claims:
- location: '28.8'
  claim: 无人直播：我们每天基本都会真人直播，素材不缺，把直播回放作为无人直播的视频素材，播放 2 个小时左右也能达到正常直播的效果...目前这么操作还没有收到过违规通知。
  reason: 素材中未找到支撑'无人直播播放2小时达到正常直播效果'及'目前无违规通知'的量化数据或官方政策依据，仅为作者单方面陈述。
- location: '28.8'
  claim: 短视频带货：自营产品的，把直播回放，稍加处理，每天发布用来带货；合作产品的，哪个视频带货数据好，就参考哪个，1:1 复制拍摄，一次拍摄，反复混剪。
  reason: 素材中未找到'1:1复制拍摄'、'反复混剪'的具体操作SOP、去重参数及合规性验证记录，仅为经验描述。
- location: '28.10'
  claim: 私域高复购转化公式：零骚扰 + 真实社会化证明 + 产品即时体验 = 高LTV
  reason: 素材中虽有'不做主动推销，让用户自己决定买不买'等描述，但缺乏'高LTV'的量化定义、统计周期、样本量等实证数据支撑。
- location: '28.11'
  claim: 用好一招：自用省钱，分享赚钱！产品好、利润足，借助有赞分销员和分销商功能，构建代理分销体系，和更多人一起做好服务和变现。
  reason: 素材中未提供分销体系的具体佣金结算周期、分销商留存率、GMV贡献占比等关键运营指标。
- location: '28.14'
  claim: 标杆账号‘小阿兰修车’验证：实体汽修厂+真人IP+本地生活=最强变现闭环
  reason: 素材中仅提供该账号的定性描述（'邻家修车小妹'、'内容复用持续爆款'、'带货能力强悍'），缺乏其GMV、利润率、ROI、投流规模等量化验证数据。
