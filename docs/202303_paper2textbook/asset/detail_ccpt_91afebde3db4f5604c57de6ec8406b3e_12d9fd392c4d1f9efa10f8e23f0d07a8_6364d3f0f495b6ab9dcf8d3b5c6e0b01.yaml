units:
- 'no': 1
  name: 爆款标题拆解重组法 —— 让标题长出“爆款基因”
  points:
  - '**为什么需要这个概念？**'
  - '- 小白凭感觉写标题极易踩坑，点开率低、推荐少'
  - '- 爆款标题背后有固定结构，掌握结构即可批量复制成功'
  - '- 普通人最高效的路径是“拆解验证过的爆款”而非“凭空创新”'
  - '**核心定义**'
  - '- 爆款标题 = 主体（精准人群）+ 事件（周期/热点/节点）+ 强调点（痛点/痒点/难点形容词）'
  - '- 通过替换同义词、调整语序，将爆款标题转化为可复用的“标题模具”'
  - '**关键性质**'
  - '- 主体词决定流量精准度：主体是大学生，点开者99%是大学生，互动率天然高'
  - '- 事件词决定时效性：蹭周期节点（如开学、考试周）自带流量红利'
  - '- 强调词决定点击欲：贴心、必备、避坑、残酷真相等词直击用户心理缺口'
  - '**典型例子**'
  - '- 原标题：主体：大学生 事件：开学 强调点：开学所需物资 → 改写：大学生开学必备清单，这几样东西最容易忘！'
  - '- 原标题：主体：学姐 事件：大学期间赚钱 强调点：小钱/避坑 → 改写：学姐建议：大学生想赚零花钱，这几条避坑指南请收好'
  - '**边界条件**'
  - '- 仅拆解标题不结合账号粉丝画像，易导致“标题对但内容不对”冷启动失败'
  - '- 机械套用不微创新（如不替换同义词、不调整语序），会被判定低质或同质化'
  - '...'
  sources:
  - paper: docs/202303/20230328_068.md
    role: origin
  excerpts:
  - 主体：大学生 事件：开学 强调点：开学所需物资——换成常用说法：开学要准备的东西（这个‘东西’怎么样？形容词：详细、贴心、必备、容易忘记、不能忘记、必须）
  - 主体：大学生（建议是给大学生、学弟学妹的，而不是标题里的学姐） 事件：大学期间赚钱 强调点：小钱（大多数大学生只是需要赚点零花钱） 学姐建议（过来人的建议）
  - 利用内容数据工具找到对标爆款账号，分析爆文笔记的标题、内容、数据，找出能够爆文的共性然后进行模仿创作。
  - 对标爆款笔记是普通人做出成绩最好的捷径。
- 'no': 2
  name: 自我参照效应选题定律 —— 只写“与用户有关”的事
  points:
  - '**为什么需要这个概念？**'
  - '- 创作者易陷入“自我表达”陷阱，写用户不关心的内容'
  - '- 用户只关注与自己强相关的信息（心理学‘自我参照效应’）'
  - '- 精准定义受众画像（主体词），是获取精准流量、高互动率的前置条件'
  - '**核心定义**'
  - '- 选题必须精准锁定受众画像：横向（职业/身份）+ 纵向（学历/年级/专业/阶段）'
  - '- 标题与内容的“主体词”必须直指目标人群，实现“谁看谁有感”'
  - '**关键性质**'
  - '- 主体词越精准，流量越精准，互动率（赞/评/藏）越高，算法推荐权重越大'
  - '- 泛泛而谈“大家都适用”的选题，往往无人买单，因为无人觉得“在说我”'
  - '**典型例子**'
  - '- 好选题：给大学生的英语四级避坑指南（主体=大学生，事件=四级，强调=避坑）'
  - '- 坏选题：如何高效学习英语（主体模糊，无精准人群锚定，点击意愿弱）'
  - '**边界条件**'
  - '- 仅有精准主体词但内容质量低/无实用价值，仍无法留住用户、获取复购'
  - '- 账号存量粉丝画像与新选题主体不匹配时，需先做“账号画像复盘”再选题'
  - '...'
  sources:
  - paper: docs/202303/20230328_068.md
    role: origin
  excerpts:
  - 在心理学上，有一个‘自我参照效应’，意思是人们往往只会关注与自己有关的事情，把握住这一点其实选题大有可为。
  - 主体：能够精准的获取流量，主体是大学生，那么点开笔记的 99% 都是大学生，受众精准用户就更容易对笔记做出点赞、评论、收藏的行为
  - 主体词精准获取流量提升互动率；接手存量账号需分析历史高赞笔记反推粉丝偏好，新内容符合阅读习惯激活首传播层。
- 'no': 3
  name: 账号历史粉丝画像复盘 —— 接手存量号的“破冰钥匙”
  points:
  - '**为什么需要这个概念？**'
  - '- 接手/运营存量账号时，无视历史粉丝偏好是冷启动失败的首因'
  - '- 粉丝是被历史高赞内容“筛选”而来的，其阅读习惯已固化'
  - '- 新内容必须符合粉丝既有认知框架，才能激活“首传播层”获得初始流量'
  - '**核心定义**'
  - '- 通过分析账号历史高赞笔记主题/形式/关键词，反推粉丝核心兴趣图谱'
  - '- 新选题/新内容必须与该画像高度重合，实现“粉丝预期”与“内容供给”对齐'
  - '**关键性质**'
  - '- 忽视画像复盘，选题再热、标题再好，也会因“非粉丝所需”而沉底'
  - '- 画像复盘是选题筛选的“第一关卡”，不通过此关，后续动作皆无效'
  - '**典型例子**'
  - '- 实战教训：账号历史高赞集中在“英语四级、大学忠告”，首篇选“大学生开学准备”虽是热词但不符画像，仅获个位数赞'
  - '- 修正后：选题锚定“英语四级/大学生存建议”，配合关键词布局，连产万赞爆款'
  - '**边界条件**'
  - '- 新注册号（0粉）无历史画像，可直接按赛道标准画像选题，无需复盘'
  - '- 若需转型赛道，需通过“夹带私货/渐进式切换”慢慢迁移粉丝画像，不可突变'
  - '...'
  sources:
  - paper: docs/202303/20230328_068.md
    role: origin
  excerpts:
  - 该账号之前发的内容，高赞集中在 英语四级、大学忠告、建议、残酷真相 这几篇笔记，粉丝大多数由高赞笔记转化而来，他们更关注这些
  - 第一次找的选题以及内容，明显不符合该账号粉丝的阅读习惯。
  - 接手存量账号需分析历史高赞笔记反推粉丝偏好，新内容符合阅读习惯激活首传播层。
- 'no': 4
  name: 三线选题筛选模型 —— 让选题同时过“时效、热度、可复制”三关
  points:
  - '**为什么需要这个概念？**'
  - '- 选题靠灵感极不稳定，靠蹭大热点易违规或掉粉，靠抄大V难复制'
  - '- 需要一套标准化筛选逻辑，确保每个选题都具备爆款潜质'
  - '- 将“拍脑袋决定选题”升级为“三维坐标锁定选题”'
  - '**核心定义**'
  - '- 时间线：选题素材必须来自近 30 天 / 近 7 天 新发布的高赞笔记，保证时效性'
  - '- 事件线：选题必须符合当下热点周期/节点（如开学季、考试周、毕业季），自带流量势能'
  - '- 对标线：参考对象必须是“低粉素人爆文”而非“大V官方号”，保证动作可复制、门槛可及'
  - '**关键性质**'
  - '- 三线缺一不可：无时间线=过时；无事件线=无势能；无对标线=学不会、做不动'
  - '- 灰豚数据“热词榜/达人榜/笔记详情”是执行三线筛选的核心工具链'
  - '**典型例子**'
  - '- 近 7 天热词榜出现“英语四级”（事件线） → 筛选近 30 天赞数高的低粉笔记（时间线+对标线） → 提取其标题结构/关键词/封面风格 → 微创新发布'
  - '**边界条件**'
  - '- 赛道冷门、无近期热词/爆文时，可放宽时间线至 60/90 天，但必须保留对标线'
  - '- 蓝海新赛道无对标账号时，可跨平台（抖音/知乎/小红书）寻找同质化对标'
  - '...'
  sources:
  - paper: docs/202303/20230328_068.md
    role: origin
  excerpts:
  - 时间线、事件线、对标线都需要考虑到。
  - 即标题和关键词在灰豚数据上查找，近 30 天、近 7 天按照赞数由高到低排序，最好参考低粉爆文笔记，进行对标模仿
  - 灰豚数据里面的达人分类顺序，是按照小红书的流量和热度来分的... 点击某篇笔记标题就可以查看笔记涵盖热词。
- 'no': 5
  name: 关键词三次高频布局原则 —— 让算法“听懂”你的笔记
  points:
  - '**为什么需要这个概念？**'
  - '- 算法不“读”内容，只“数”关键词频次与分布'
  - '- 关键词出现太少，系统识别不出主题，无法匹配搜索/推荐流量'
  - '- 关键词堆砌过多，会被判定营销/作弊，导致限流'
  - '**核心定义**'
  - '- 核心关键词（热词/标签词）需在“标题、正文小文案、图片内容”三大区域累计出现 ≥ 3 次'
  - '- 标题必带 1 次，正文开头/结尾/评论置顶各 1 次，封面图/正文配图文字叠加 1 次'
  - '**关键性质**'
  - '- 搜索流量精准度高、转化率高、生命周期长，是商业变现核心流量来源'
  - '- 关键词频次达标会触发平台“提炼重要信息提升曝光”官方提示，进入加速通道'
  - '- 关键词布局是“搜索流量主导论”落地的核心动作'
  - '**典型例子**'
  - '- 优化前：搜索流量仅 1%，数据极差；优化后：标题/文案/图片三处布局核心词“英语四级/避坑/资料”，搜索流量跃升至 61%，获万赞'
  - '**边界条件**'
  - '- 关键词必须是用户真实搜索的“热词/标签词”，非自造生词'
  - '- 布局需自然融入语句/画面，生硬堆砌会触发反作弊机制'
  - '- 长尾词/衍生词可辅助布局，但核心词频次必须达标'
  - '...'
  sources:
  - paper: docs/202303/20230328_068.md
    role: origin
  excerpts:
  - 把笔记涵盖热词在文案中提上 3 遍，这样做主要是为了获得搜索流量。
  - 关键词在内容、标题、小文案三部分加起来至少提及三次。
  - 笔记涵盖的热词在标题、文案、图片内容中，提到不少于三次，更能获得搜索流量
  - 其中有一篇关于过英语四级的万赞笔记，搜索流量在 61%，并且也被提示了‘在笔记标题及正文中，提炼笔记重要信息，有机会提升笔记的曝光量’。
- 'no': 6
  name: 赞藏比与阅赞比双指标爆款预判体系 —— 用数据提前“预知”爆款
  points:
  - '**为什么需要这个概念？**'
  - '- 发布后不知好坏，等数据出来再改已错过黄金推流期'
  - '- 需要实时监控的“先行指标”，在发布早期（前 1-3 小时）预判爆款潜力'
  - '- 将主观“觉得这篇会火”量化为客观可验证的数学阈值'
  - '**核心定义**'
  - '- 赞藏比 ≥ 2 : 1.4 → 判定万赞稳定性（收藏权重高=实用价值强=持续推流）'
  - '- 阅赞比（小眼睛/点赞）6-8 : 1 → 判定超级爆款潜力（普通高赞约 10:1）'
  - '- 评论权重最高（评论 > 收藏 > 赞），需主动运营评论区撬动流量池层级'
  - '**关键性质**'
  - '- 赞藏比反映“实用价值/留存意愿”，决定推流持久度'
  - '- 阅赞比反映“点击转化率/内容吸引力”，决定爆发上限'
  - '- 评论区运营（引导提问/号主回复/置顶优质评论）是提升权重的最高杠杆'
  - '**典型例子**'
  - '- 万赞笔记赞藏比稳定在 2:1.4 以上，持续获得推荐流量'
  - '- 超级爆款阅赞比达 6:1 甚至更低，说明极强的“标题/封面-内容”转化力'
  - '**边界条件**'
  - '- 仅适用于教育/知识/干货类赛道，娱乐/颜值/情感赛道指标体系不同'
  - '- 新号前几篇笔记数据基数小，指标波动大，需积累 10+ 篇样本后再参考'
  - '- 指标异常（如赞高藏低、阅高赞低）需结合内容形式具体诊断，不可死套公式'
  - '...'
  sources:
  - paper: docs/202303/20230328_068.md
    role: origin
  excerpts:
  - 从赞藏来看，一篇笔记能够到 2：1.4 以上，万赞就会很稳定，会有持续不断的推荐。
  - 从小眼睛和点赞来看，普通的高赞回答，小眼睛和点赞比例在 10：1，但是超级爆款比例 6-8:1。
  - 对于教育学习领域来说，赞和藏，更像是一个情绪价值和一个实用价值的区分。
  - 按照小红书的权重来算，评论＞收藏＞赞，因此还要做的一件事就是：一定要在文案和内容中，引导读者评论，同时号主，也要在评论区多评论，多互动。
- 'no': 7
  name: 长尾标签冷启动策略 —— 新号避开“红海”抢“蓝海”
  points:
  - '**为什么需要这个概念？**'
  - '- 新号/低权重号蹭大标签（如#大学生 1亿+关注）极难被收录，流量归零'
  - '- 大标签竞争激烈，算法优先分发高权重账号，新号无胜算'
  - '- 长尾小标签竞争弱、垂直度高、易收录，是新号冷启动的“隐形入口”'
  - '**核心定义**'
  - '- 大标签定垂直领域（如#大学生），小标签抢收录入口（如#大一新生避坑指南/#高数期末复习）'
  - '- 优先选择“关注人数少但垂直度高、与内容强相关”的长尾标签组合（3-5个）'
  - '- 待笔记被小标签收录、获取初始精准流量、权重上涨后，再逐步争取大标签收录'
  - '**关键性质**'
  - '- 小标签收录门槛低，易触发“标签页推荐”+“搜索流量”双重曝光'
  - '- 长尾标签用户意图极强（搜#高数期末复习的必是要考高数的大一/大二），精准度极高'
  - '- 标签体系是小红书内容分发的底层骨架，运营标签即运营流量分发逻辑'
  - '**典型例子**'
  - '- 新号发“英语四级”笔记，不加#大学英语四级（大标签），改加#英语四级裸考逆袭 #大二英语四级备考 #四级听力提分技巧（长尾标签），快速被收录获赞'
  - '**边界条件**'
  - '- 标签必须与内容强相关，挂无关热门标签会被判定违规/低质'
  - '- 单篇笔记标签数建议 3-5 个（1个大标签定赛道 + 2-4个长尾标签抢流量）'
  - '- 账号权重提升后，需主动“换大标签”，否则长期困在长尾流量池无法破圈'
  - '...'
  sources:
  - paper: docs/202303/20230328_068.md
    role: origin
  excerpts:
  - 新号权重低，笔记不容易被大的标签收录。但我们可以把它做的更好：如果选择小标签，就更容易被收录，收录后就会推荐给关注该标签的人以及获取到搜索流量
  - 大标签定垂直领域，小标签更加精准易被收录，再加上好的选题和内容，就能够获得到更多的流量。
  - 由此联想到了知乎，在知乎写回答如果是一个新号，就不建议回答关注人数上万的问题
- 'no': 8
  name: 搜索流量主导论 —— 做“被搜到”比“被推到”更赚钱
  points:
  - '**为什么需要这个概念？**'
  - '- 推荐流量（被动分发）不可控、波动大、泛粉多、转化低'
  - '- 搜索流量（主动需求）用户意图强、精准度高、转化率高、生命周期长（长尾效应）'
  - '- 商业变现（引流私域/卖课/带货）的核心是“精准获客”，搜索流量ROI远超推荐流量'
  - '**核心定义**'
  - '- 通过“关键词三次布局 + 长尾标签冷启动 + 精准主体词”系统性获取搜索流量'
  - '- 目标：将账号搜索流量占比从个位数（如 1%）提升至主导地位（如 61% 甚至 80%+）'
  - '- 搜索流量增长 → 互动率提升 → 反哺推荐流量 → 形成“搜推联动”正向飞轮'
  - '**关键性质**'
  - '- 搜索流量是“确定性流量”：只要关键词排名在前，就持续有用户主动点进来'
  - '- 热词即关键词即标签，三位一体，布局热词=布局关键词=布局标签'
  - '- 教育/技能/工具/攻略等强需求赛道，搜索流量价值最高'
  - '**典型例子**'
  - '- 万赞笔记“英语四级避坑指南”搜索流量占比 61%，长尾关键词“四级听力/作文/翻译技巧”持续带来每日稳定增粉'
  - '- 对比：早期两篇笔记搜索流量仅 1%，靠推荐流量偶尔爆一下，随后迅速衰退'
  - '**边界条件**'
  - '- 纯娱乐/颜值/情绪类内容，搜索需求弱，推荐流量仍为主力，不可强行搜索化'
  - '- 新号无权重时，关键词排名靠后，搜索流量极少，需先靠长尾标签/推荐流量积累权重'
  - '- 平台算法调整可能改变搜/推权重，需持续监控数据调整策略'
