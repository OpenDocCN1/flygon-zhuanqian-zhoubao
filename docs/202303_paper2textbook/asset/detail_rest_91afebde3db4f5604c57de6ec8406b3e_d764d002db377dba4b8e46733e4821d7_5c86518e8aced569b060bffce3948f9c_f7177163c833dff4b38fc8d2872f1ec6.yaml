learning_targets:
- 理解本地生活服务资源整合商的轻资产中介模式核心逻辑
- 掌握师傅分级分成模型中城市能级差异化定价与绩效考核机制
- 掌握咸鱼矩阵号地毯式发布法的账号搭建、地域覆盖、低价引流SKU及素材去重标准化流程
- 理解公域低价引流+私域高客单转化模型的流量分层与信任跃迁机制
- 掌握供给端三级采集体系（地图搜索、平台挖掘、采集系统）的效率跃迁路径
- 理解信息差与执行力构成的复利型护城河及其边界条件
- 掌握城市能级决定分成比例的市场定价规律与供给端利益绑定原则
- 能识别单人两月纯利30万案例的隐性投入、止损线与可复制性边界
concept_map:
- 本地生活服务资源整合变现
- ├── 核心角色定位
- │   └── 服务资源整合商（连接器而非生产者）  —— P001
- ├── 供给端体系
- │   ├── 师傅资源三级采集体系（地图/平台/采集系统）  —— P005
- │   ├── 师傅分级分成模型（城市能级+绩效考核双维度）  —— P002
- │   └── 师傅管理SOP（建档/派单/奖惩/保修）  —— P002
- ├── 需求端体系
- │   ├── 咸鱼矩阵号地毯式发布法（账号矩阵/地域/时间/素材/标题）  —— P003
- │   ├── 低价引流SKU策略（9.9/19.9元诱饵+咨询客服话术）  —— P003, P004
- │   └── 标准化话术库与自动回复体系  —— P004
- ├── 转化闭环
- │   └── 公域低价引流+私域高客单转化模型（公域获量/私域提质/信任跃迁）  —— P004
- ├── 放大杠杆
- │   ├── 招聘平台借力裂变法（BOSS直聘招兼职借号发布）  —— P003
- │   └── 兼职裂变/账号矩阵突破实名上限  —— P003
- ├── 核心护城河
- │   └── 信息差与执行力护城河（渠道信息差×标准化执行力×持续迭代）  —— P006
- ├── 定价规律
- │   └── 城市能级决定分成比例（一线五五/二线四六/三线三七）  —— P007
- └── 实证与边界
- '    ├── 单人两月纯利30万实证案例（隐性投入/关键节点/止损线）  —— P008'
- '    ├── 咸鱼账号规模化运营边界（发布上限/实名上限/突破路径）  —— P008'
- '    ├── 地图采集系统效率跃迁验证  —— P008'
- '    └── 赛道红利窗口与合规风险预警  —— P008'
life_analogy:
- 想象你是一个**“外卖平台区域运营总监”**，但你不雇骑手、不做饭：
- '- **师傅** = 分散在城市各处的“外卖骑手/商家”，有手艺缺订单'
- '- **咸鱼矩阵号** = 你在写字楼、小区门口铺满的“海量传单/广告牌”（地毯式覆盖、低价引流）'
- '- **9.9元诱饵SKU** = “新用户首单9.9元”的诱饵，只为让用户打开App、点进店'
- '- **私域微信** = 你的“专属客服群/会员体系”，承接咨询、报真实价格、建信任、促复购'
- '- **分成模型** = 按城市房租/人工成本给骑手分账：北上广五五分、三四线三七分，还要月考核（准时率/好评率/投诉率），表现好多派单、分成高'
- '- **采集系统** = “一键爬取全城骑手信息”的超级雷达，替代人工逐个扫楼'
- '- **执行力护城河** = 竞品也有骑手、也有传单，但你“发传单更密、回单更快、处理投诉更狠、迭代SOP更勤”，时间拉长形成护城河'
- 就像外卖平台不做饭只做连接与调度，本地服务整合商也不修空调只整合师傅与流量。
summary:
- concept: 服务资源整合商
  desc: 不生产服务，整合闲置师傅资源对接线上流量，赚取中介差价与管理溢价
- concept: 刚需高频本地服务
  desc: 空调/管道/热水器等强刚需、高频、标准化、决策链路短的上门服务品类
- concept: 师傅分级分成模型
  desc: 城市能级定基准（一线五五/二线四六/三线三七）+ 绩效考核定浮动（四维指标月度打分/优汰）
- concept: 咸鱼矩阵号地毯式发布法
  desc: 账号矩阵(实名6号+亲友+Pro版)×地域最小单位(区/县)×高峰时段(12点/19点)×低价诱饵SKU(9.9元)+长尾词标题×去重素材
- concept: 低价引流SKU策略
  desc: 公域发9.9/19.9元诱饵获曝光咨询，文案注明'具体价格咨询客服'规避风控，私域按真实报价成交
- concept: 公域低价引流+私域高客单转化模型
  desc: 公域承担获客成本(低价引流)，私域承担利润率(高客单/复购/转介绍)，实现信任跃迁与商业闭环
- concept: 供给端三级采集体系
  desc: L1地图搜索(冷启动)→L2平台挖掘(58同城等)→L3采集系统(规模期一键导出)，效率跃迁100倍+
- concept: 招聘平台借力裂变法
  desc: BOSS直聘招兼职借用他人咸鱼账号发布，提供话术培训按利润分成，零成本突破单人发布上限
- concept: 信息差与执行力护城河
  desc: 非公开渠道信息差(采集系统/竞品反查/话术库) × 标准化SOP执行力(矩阵搭建/考核/迭代) × 持续时长 = 复利型壁垒
- concept: 城市能级决定分成比例
  desc: 分成比例由城市运营成本指数、师傅替代机会成本、平台边际贡献率博弈形成的市场均衡价，强行偏离供给端崩塌
- concept: 实证案例与边界条件
  desc: 单人两月纯利30万(隐性投入:采集系统/设备/话术打磨/试单成本)，止损线(7天零咨询弃号/15天日单<5撤城)，赛道红利期1-3年
exercises:
- 'no': 1
  title: 设计一个城市的师傅分成方案
  contents:
  - 假设你要在『某二线省会城市』切入『空调移机/维修』业务，该城市平均客单价300元，师傅日均接单上限3单，房租/社保/广告等平台单单摊销成本约80元。
  - 1. 参考『一线五五、二线四六、三线三七』规律，设定基础分成比例；计算平台与师傅单单毛利。
  - 2. 设计月度绩效考核四维指标（接单数、上门效率、投诉率、满意度）的量化评分标准及对应的分成浮动幅度（如±5%）。
  - 3. 列出『私单拉黑』的监测手段与『售后保修』的前置对接条款要点。
  - 回答问题：
  - '- 如果该城市突遭极端高温天气，师傅供给紧张导致平台单量下跌，你会如何临时调整分成/补贴策略？'
  - '- 为什么三线城市必须给师傅七成分成？如果强行五五分会发生什么？'
- 'no': 2
  title: 规划一个咸鱼账号矩阵冷启动计划
  contents:
  - 目标：在『江西赣州』推广『疏通管道』服务，单人实名上限6个咸鱼号，预算购买2台备用手机、办理4张流量卡。
  - 1. 账号养成期（前3天）：人设定义、芝麻信用授权、浏览同城同行内容、不发布商品。
  - 2. 发布矩阵设计：按『区/县』最小行政单位覆盖，赣州共18个区县，每个账号发几个商品？如何分配？Pro版邀请策略？
  - 3. 素材与标题SOP：去淘宝采集素材→美图秀秀去重(裁剪/滤镜/水印)→标题塞满长尾词(上门/疏通/马桶/下水道/高压清洗/赣州/章贡区等)→定价9.9元诱饵SKU+文案『具体价格咨询客服』。
  - 4. 发布节奏：每日中午12点、晚7点各发布一次，单日总发布量上限控制在多少避免风控？
  - 回答问题：
  - '- 咸鱼严禁『微信/vx/电话』等引流字眼，设计3个『引导用户主动问联系方式』的话术变体。'
  - '- 如果账号连续7天零咨询，按止损线弃号重来，如何快速复盘是『选品/标题/价格/账号权重/区域需求』哪个环节出问题？'
- 'no': 3
  title: 搭建供给端师傅采集与管理最小闭环
  contents:
  - 从0到1建立『家电清洗』品类的师傅资源池，目标首月入池50名有效师傅。
  - 1. L1地图采集：高德地图搜『家电清洗/空调清洗』，人工录入门店/师傅电话，预估单日新增量？
  - 2. L2平台挖掘：58同城/鱼泡网筛选『个人师傅/小团队』，避开『公司/中介』号，识别关键词特征？
  - 3. L3采集系统引入时机：当日均人工新增<20且业务需求>50单/日时，评估采集系统ROI（系统费用/清洗成本/入池转化率）。
  - 4. 入池验证三步法：视频面试(看工具/证件) → 实地试单(平台垫付/观察态度/技术/耗材) → 签协议(分成/保修/保险/私单拉黑)。
  - 5. 派单标准化模板设计：微信群命名规则、派单字段(姓名/电话/地址/项目/金额/备注)、接单确认/到达/完工/客户验收四状态流转。
  - 回答问题：
  - '- 核心师傅(技术顶尖/有独家渠道)往往不在公开渠道，除采集系统外，还有哪2条获取路径？'
  - '- 采集系统导出数据重复率/失效率高，设计『号码验证/去重/标签』三步清洗流程。'
- 'no': 4
  title: 复盘『单人两月纯利30万』案例的真实ROI与可复制性
  contents:
  - 基于素材披露的信息，还原该案例的真实财务模型与隐性投入：
  - 1. 显性收入：假设第2个月日均50单，客单价300元，平台分成40%，月流水45万，毛利18万。
  - 2. 隐性成本清单：采集系统费用(3000元/年) → 摊销250元/月；账号矩阵设备/流量(2手机+6流量卡) → 约500元/月；话术库打磨(2周兼职客服)
    → 3000元；师傅试单/磨合亏损(首月日均5单亏损/持平) → 约1万；客服人工/兼职成本 → 6000元/月。
  - 3. 计算：第1月净利润 = ?，第2月净利润 = ?，两个月累计净利 = ?，是否接近『纯利30万』？差距在哪？
  - 4. 关键节点验证：第1周跑通首单 → 第2周日稳单 → 第1月回本 → 第2月放大(矩阵号+兼职裂变)。你的模型能跑通这些节点吗？
  - 回答问题：
  - '- 该模式现金流极佳(客户T+0付款、师傅周结/月结)，但『师傅垫资上门』风险如何对冲？'
  - '- 圈友迁移『宠物洗护』半年未跑通，核心失败原因可能是『非标/强人设/高投诉/客单价低/复购周期长/平台风控严』中的哪几项？如何预判新赛道可行性？'
