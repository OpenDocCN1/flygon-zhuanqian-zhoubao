paper: docs/202303/20230328_132.md
desc: 该素材由创业者云飞发布，基于ChatGPT开放插件功能，提出ChatGPT将催生大量SEO机会的核心观点。作者通过对比抖音/TikTok的“兴趣推荐+用户搜索”模式，论证ChatGPT以“搜索/对话”为核心交互的精准流量特性，将其定义为具有更强个性化推荐能力的“升级版抖音”，并结合个人实践分享了将工作流转化为Prompt进行本地部署训练个人助理的方法。
concepts:
- name: ChatGPT SEO机会
  desc: 指ChatGPT开放插件后，基于其“搜索/对话”核心交互模式产生的精准流量获取与商业转化红利，类似于传统搜索引擎优化但在个性化推荐维度更强。
  is_original: true
  excerpt:
  - 我认为将会出现更多的“类 SEO”机会
  - ChatGPT 和用户的交互行为目前主要就是？搜索！搜索！搜索！！！
  - 搜索意味着精准，精准意味着高转化
- name: 升级版抖音/TikTok
  desc: 作者对ChatGPT插件生态的定位隐喻，强调其相比抖音“兴趣推荐+搜索”的双引擎模式，ChatGPT凭借对话式搜索具备更强的个性化推荐能力与用户信任基础。
  is_original: true
  excerpt:
  - 相比而言，我认为它是升级版的抖音/TikTok，具有更强的个性化推荐能力。
  - 依赖的结果就是对平台产生信任，而信任是商业的开始。
- name: Prompt工程化训练
  desc: 将个人工作流程梳理、标准化并转化为结构化Prompt，通过持续迭代训练大模型成为领域专用个人助理的方法论。
  is_original: true
  excerpt:
  - 就是把我工作中常需要跟文字打交道的一些工作梳理出来，然后逐个梳理出流程，转化成 prompt 格式，逐个就训练啊。
methods:
- name: __overview__
  desc: 基于平台交互逻辑对比（抖音 vs ChatGPT）推演商业机会，结合个人工作流Prompt化实践验证模型微调路径。
  excerpt:
  - 抖音/TikTok 算其中一家，它通过“兴趣推荐”和“用户搜索”来实现了很强的个性化推荐。
  - ChatGPT 和用户的交互行为目前主要就是？搜索！搜索！搜索！！！
  - 把我工作中常需要跟文字打交道的一些工作梳理出来，然后逐个梳理出流程，转化成 prompt 格式，逐个就训练啊。
- name: 个人助理本地部署训练法
  desc: 针对无编程基础用户利用网页对话框调教，有基础用户本地部署GPT-3.5模型，通过Prompt工程化流程构建垂直领域个人助理。
  excerpt:
  - 我都是在本地部署的，如果没有编程基础的话，你可以在网页对话框里边调教。
  - 3.5 啊
  - 转化成 prompt 格式，逐个就训练啊。
theorems:
- name: 搜索即精准，精准即高转化
  desc: 核心商业主张：ChatGPT的核心交互是搜索/对话，这种显性意图交互天然带来精准流量，顺应互联网流量逻辑必然产生高商业转化价值。
  excerpt:
  - ChatGPT 和用户的交互行为目前主要就是？搜索！搜索！搜索！！！
  - 搜索意味着精准，精准意味着高转化，顺着互联网流量的逻辑，大家就知道后续了。
- name: 信任是商业的起点
  desc: 评论区张老师观点被作者认可：模型长期依赖/使用产生的信任感，是后续商业变现（如SEO、推荐、交易）的基础设施。
  excerpt:
  - 依赖的结果就是对平台产生信任，而信任是商业的开始。
findings:
- name: GPT-3.5本地部署可行性验证
  desc: '[evidence] 作者亲测在本地部署GPT-3.5模型（而非GPT-3）并成功通过Prompt工程化训练出个人助理，证明了轻量化部署路径的可行性。'
  excerpt:
  - 'D. : 本地部署？gpt-3 模型本地部署？'
  - '创业者-云飞 : 3.5 啊'
  - 我都是在本地部署的...逐个就训练啊。
- name: 工作流Prompt化训练有效性
  desc: '[claim] 作者宣称通过将工作拆解为流程并转化为Prompt逐个训练，已成功将模型训练为个人助理。'
  excerpt:
  - 经过训练，它现在已经成为我的个人助理。
  - 就是把我工作中常需要跟文字打交道的一些工作梳理出来，然后逐个梳理出流程，转化成 prompt 格式，逐个就训练啊。
