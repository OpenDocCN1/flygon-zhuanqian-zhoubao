paper: docs/202303/20230328_128.md
desc: 该素材是一份面向跨境电商从业者的 ChatGPT 应用实操指南 v1.0，作者“希声”以提示词工程为核心方法，系统梳理了 9 个高频业务场景（谷歌/Facebook
  广告投放、社媒内容运营、Quora 问答营销、SEO 文章框架、亚马逊 Listing 优化、客服邮件营销、智能客服知识库构建、选品与产品规划）的标准化提示词模板，并附带实测输出截图，旨在通过角色设定、任务拆解、格式约束与约束条件注入，将通用大模型能力快速落地为可直接生产的电商文案与决策辅助成果。
concepts:
- name: 跨境电商提示词模板库
  desc: 针对跨境电商 9 大核心业务场景预设的、包含角色定义、任务指令、输出约束的结构化提示词集合，实现了从通用 AI 对话到专业业务产出的标准化复用。
  is_original: true
  excerpt:
  - 现在你是一名谷歌广告的编写人员...
  - 现在你是一名 facebook 广告的编写人员...
  - 现在你是一名社媒运营人员...
  - 现在你是一名文字工作者...
  - 现在你是一名亚马逊的电商运营...
  - 现在你是一名客服人员...
  - 现在你是一名客服...
  - 现在你是一名网站的运营负责人员...
- name: 角色扮演式提示词设计范式
  desc: 通过 '现在你是一名 [专业角色]' 设定专家人设，结合具体平台规则与业务目标约束，引导模型输出符合专业标准的垂直领域内容。
  is_original: false
  excerpt:
  - 现在你是一名谷歌广告的编写人员
  - 现在你是一名 facebook 广告的编写人员
  - 现在你是一名社媒运营人员
  - 现在你是一名文字工作者
  - 现在你是一名亚马逊的电商运营
  - 现在你是一名客服人员
  - 现在你是一名客服
  - 现在你是一名网站的运营负责人员
- name: 结构化输出约束
  desc: 在提示词中显式规定输出语言、字数限制、格式规范（如标题/描述分离、带话题标签、大小标题结构、独特卖点数量、折扣策略、回复话术风格、报告结构），保证模型输出可直接投入生产使用。
  is_original: true
  excerpt:
  - 用英文输出你的答案。广告的标题和广告描述的字数等要符合谷歌的标准。
  - 用英文输出你的答案。贴文最后要带上该产品的的相关关键词，用#关键词# 这种格式输出。适当带有 emoji 图案。
  - 用英文输出你的答案。字数在 800 字以上。文章结构清晰，要有大小标题。
  - 想出 5 个独一无二的卖点，要在产品描述中提现出来。
  - 为客户提供一个合理的折扣。
  - 你不需要解释，提问，要像一名客服一样直接回答问题。你要安抚客户让客户感受到温暖，并在适当的时机推销我们的 xx 产品。
  - 用中文输出你的答案。告诉我在夏天要推出什么样的产品...写一份产品开发和推广的计划表。
methods:
- name: __overview__
  desc: 采用『场景拆解 → 角色设定 → 任务指令 → 约束条件 → 少样本/零样本生成』的提示词工程标准化流程，构建跨境电商全链路 AI 应用工作流。
  excerpt:
  - 提示词：现在你是一名 [角色]，你需要为 [目标] 写 [产出物]。要求是：1. [语言/格式] 2. [平台规范/业务规则] 3. [质量/风格要求]
  - 配套提供了每个场景下 ChatGPT 实际生成结果的截图作为效果验证。
- name: 广告文案生成标准化法
  desc: 针对 Google Ads 与 Facebook Ads 不同平台字符限制与风格差异，设定专职文案角色，约束输出标题/描述数量、字符上限、语言及转化导向话术，批量产出合规广告素材。
  excerpt:
  - 提示词：现在你是一名谷歌广告的编写人员...写 10 条谷歌广告标题和谷歌广告描述...符合谷歌的标准...引人入胜，让人有下单的欲望。
  - 提示词：现在你是一名 facebook 广告的编写人员...写 10 条 facebook 广告标题和广告描述...符合 facebook 的标准...引人入胜，让人有下单的欲望。
- name: 社媒内容运营自动化法
  desc: 设定社媒运营人员角色，结合平台特性（Instagram）要求输出带 Emoji、话题标签、营销钩子的原生风格贴文，实现内容批量产出与 SEO 标签布局同步进行。
  excerpt:
  - 提示词：现在你是一名社媒运营人员...写 5 条在 Instagram 上推广的帖子...带上该产品的的相关关键词，用#关键词# 这种格式输出...适当带有
    emoji 图案。
- name: 长文深度内容生成法
  desc: 针对 Quora 问答及 SEO 文章场景，设定文字工作者角色，通过字数下限、结构化大纲（大小标题）、方法论/数据/过程要素要求，生成具备权威性与搜索友好的长文本内容。
  excerpt:
  - 提示词：现在你是一名文字工作者...为“xxxx”这个问题编写答案...字数在 800 字以上...文章结构清晰，要有大小标题。
  - 提示词：现在你是一名文字工作者...以“xxxx”这个为主题写出一篇文章的大纲...要有方法论，有数据，有发展过程。
- name: 电商 Listing 差异化卖点提炼法
  desc: 设定亚马逊运营角色，强制要求模型挖掘并输出 5 个独一无二的卖点并融入描述，解决同质化竞争中差异化卖点提炼难的问题。
  excerpt:
  - 提示词：现在你是一名亚马逊的电商运营...写出一篇适用于亚马逊平台的产品描述...想出 5 个独一无二的卖点，要在产品描述中提现出来。
- name: 客户全生命周期邮件/会话话术生成法
  desc: 针对复购刺激邮件与即时通讯客服场景，分别设定营销型客服与服务型销售角色，注入折扣策略、情绪安抚、软性推销等心理战术约束，生成高转化沟通话术。
  excerpt:
  - 提示词：现在你是一名客服人员...写一封刺激客户再次购买...提供一个合理的折扣。
  - 提示词：现在你是一名客服...直接回答问题...安抚客户让客户感受到温暖，并在适当的时机推销我们的 xx 产品。
- name: 选品与产品规划决策辅助法
  desc: 设定运营负责人角色，输入现有品类与季节性节点，输出选品建议与结构化计划表（含开发/推广节点），将大模型作为战略分析师辅助决策。
  excerpt:
  - 提示词：现在你是一名网站的运营负责人员...主营产品是 xxx，夏天马上要到了...告诉我在夏天要推出什么样的产品...写一份产品开发和推广的计划表。
theorems:
- name: 提示词即生产力：标准化 Prompt 可将通用 LLM 瞬间转化为垂直领域专家
  desc: 通过显式的角色定义、任务拆解、格式约束与业务规则注入，无需微调即可让 ChatGPT 输出达到初级/中级运营水平的专业成果，大幅降低跨境电商内容生产门槛。
  excerpt:
  - 这是一篇随性写的文章...作为第一个版本先发布...想到哪写到哪
  - 评论区：Cora：我也是用它来帮忙写谷歌广告语 秋刀鱼哥：有用...Adam：居然还会选品，6 永哥：很棒！
- name: 跨境电商核心痛点皆可通过『角色+约束』模式逐个击破
  desc: 跨境电商涉及的广告投放、内容营销、转化文案、客户服务、供应链决策等高频环节，均可抽象为『特定角色 + 明确交付物 + 硬性约束』的提示词结构，实现全链路
    AI 赋能。
  excerpt:
  - 涵盖：谷歌广告、FB广告、Instagram贴文、Quora回答、文章大纲、亚马逊Listing、复购邮件、客服知识库、选品规划 9 大场景。
- name: 输出约束决定生产可用性：硬性指标（字数、格式、规范）是 Prompt 落地的关键
  desc: 仅有角色和任务不够，必须显式约束平台字符限制、数据结构、语言风格、营销钩子等硬性指标，输出结果才能从『可阅读』变为『可直接投放/发布』的生产级资产。
  excerpt:
  - 要求：符合谷歌/Facebook 标准、字数 800+、#标签#格式、5个独特卖点、合理折扣、计划表格式等。
findings:
