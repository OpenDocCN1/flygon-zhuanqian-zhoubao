paper: docs/202303/20230328_097.md
desc: 该素材为一篇社交媒体分享帖，作者赫男记录了跟随一位投资超百亿（累计投资30亿美元）的资深投资人（涉及理想汽车、小i机器人等知名项目）学习的10条财富心法，旨在传递顶层投资认知与财富增长的核心方法论。
concepts:
- name: 百亿级投资人财富心法
  desc: 指处于财富金字塔顶层、管理规模超百亿的投资人在长期实践中总结出的关于财富积累、认知升级、决策判断等方面的核心认知体系与行动指南。
  is_original: true
  excerpt:
  - 机缘巧合下跟随标题中的牛人学习：20 年间投资 30 亿美元，国内知晓度高的企业如理想汽车、小 i 机器人等，还有一些海外企业。
  - 前段时间听了老师关于财富的分享，整理出 10 条心法
methods:
- name: __overview__
  desc: 通过近距离跟随顶级投资人（LP/G视角）进行隐性知识显性化提炼，将老师饭局分享的碎片化经验系统化整理为结构化的10条心法清单。
  excerpt:
  - 机缘巧合下跟随标题中的牛人学习...
  - 前段时间听了老师关于财富的分享，整理出 10 条心法，全文 3600 字。
theorems:
- name: 顶层投资认知可迁移性主张
  desc: 主张通过复盘和学习超百亿级投资人的实战心法（如投资理想汽车、小i机器人等标志性案例背后的决策逻辑），普通投资者可跨越认知鸿沟，实现财富认知的阶跃式提升。
  excerpt:
  - 20 年间投资 30 亿美元，国内知晓度高的企业如理想汽车、小 i 机器人等...
  - 期待向圈友们多多学习，多多交流
findings:
- name: 案例验证：标杆项目投资复盘
  desc: '[claim] 该投资人在20年间累计投资30亿美元，并成功捕捉理想汽车、小i机器人等独角兽项目。[evidence] 素材通过列举具体知名投资标的（理想汽车、小i机器人）作为投资人能力圈与心法有效性的背书，但未在当前文本中披露具体的投资决策过程、入场时点、收益倍数或心法具体应用细节。'
  excerpt:
  - 20 年间投资 30 亿美元，国内知晓度高的企业如理想汽车、小 i 机器人等，还有一些海外企业。
- name: 社群反馈：认知门槛与实践价值
  desc: '[evidence] 评论区反馈显示，该类顶层心法内容存在理解门槛（''现在还看不懂，比较年轻''），但被高阶读者认可为高价值稀缺内容（''非常有收获，还得常看常悟''、''最有价值的投资就是投资自己''），印证了该类隐性知识显性化传播的必要性与受众分层特征。'
  excerpt:
  - '罗松萍 : 现在还看不懂，比较年轻 罗松萍 : 很多东西我还要好好学'
  - '公子枫  : 感谢分享，非常有收获，还得常看常悟[强]'
  - '大鹏 : 最有价值的投资就是投资自己[强]'
