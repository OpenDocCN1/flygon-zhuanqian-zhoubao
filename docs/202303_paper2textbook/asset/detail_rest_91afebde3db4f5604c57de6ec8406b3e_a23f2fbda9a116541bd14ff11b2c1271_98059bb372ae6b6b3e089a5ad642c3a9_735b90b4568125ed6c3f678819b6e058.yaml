life_analogy:
- 想象AIGC商业落地是一场**工业化造车**：
- '- **单点技术** = 只造发动机、只造轮胎、只造车身（ChatGPT/MJ/SD单独使用）'
- '- **场景化组合** = 将发动机+变速箱+底盘+车身+电子系统按**具体车型**（SUV/轿车/卡车）装配成整车（电商主图/短视频/数字人直播/代问服务）'
- '- **平台新功能** = 新修好的高速公路（小风车/切片工具/商品卡）'
- '- **用户新认知** = 还没开过车的司机（对AI充满好奇/恐惧/猎奇）'
- '- **时差套利** = 在高速公路通车初期、司机还不会开车时，第一个跑运输、收过路费、卖汽车的人'
- '- **私域** = 自己的4S店/维修站/加油站，客户进来了就是自己的资产，不受高速公路限行/收费影响'
- 就像造车不能只造零件，做AIGC也不能只会单一工具；要组装成针对具体场景的完整产品，在新基建（平台功能）红利期，面对新司机（用户认知）收割第一波红利，最终把车主留在自己的服务体系里。
summary:
- concept: 场景化组合
  desc: AIGC落地核心：LLM+Diffusion+RAG/微调+自动化脚本针对具体场景封装
- concept: 时差套利
  desc: 流量红利本质：平台新功能扶持期与用户认知空白期重叠的窗口期
- concept: 丑/笨/假即流量
  desc: 早期AI技术缺陷产生反差感/喜感/猎奇感，比完美内容更易传播
- concept: 私域终局归宿
  desc: 所有公域玩法最终沉淀至微信生态，通过高频触达/信任建立/复购实现LTV最大化
- concept: AIGC一条龙工作流
  desc: ChatGPT+MJ/SD+视频生成+语音合成串联，实现内容生产全链路自动化
- concept: AI数字人直播
  desc: 虚拟形象替代真人7x24直播，降低人力成本解决主播稀缺
- concept: AI套壳/Prompt变现
  desc: 基于大模型API封装垂直应用或贩卖高质量指令集，赚取信息差与集成优势
- concept: 虚拟资源矩阵
  desc: 壁纸/笔刷/模板/资料零边际成本，矩阵号分发引流私域或平台交易组件复售
- concept: 认知差反向引流
  desc: 利用大众对新技术刻板印象制造冲突内容（吐槽/对比/整蛊）获高互动流量
- concept: 平台原生工具闭环
  desc: 利用小风车/切片/原创授权/商品卡/分屏等官方功能构建合规获客-转化闭环
- concept: 小红书零粉冷启动
  desc: 去IP化，用标品虚拟资源+爆款标题模版直接挂载商品链接实现0粉开卖
- concept: 抖音低门槛直播
  desc: 数字人无人直播/服务型直播/低客单品/玩偶服绕过专业主播/供应链门槛
- concept: 视频号切片+知识付费
  desc: 长直播一键切片分发获流，高客单非标服务打包为99元标准化课程无限售
- concept: 闲鱼1元引流
  desc: 利用搜索意图精准用户，虚拟资料零成本复制，1元建信任连接转化高客单后端
exercises:
- 'no': 1
  title: 设计一个垂直场景的AIGC组合工作流
  contents:
  - 选择一个具体商业场景（如：宠物写真定制、简历优化服务、电商主图批量生产、知识付费课程制作）：
  - 1. 拆解该场景的完整业务流程（获客、生产、交付、转化）
  - 2. 标注每个环节适用的AI工具（LLM/Diffusion/RAG/自动化脚本/语音/视频）
  - 3. 设计工具间的数据流转接口（Prompt模板、参数设置、输出格式标准）
  - 4. 识别必须保留人工介入的关键质检节点
  - 回答问题：
  - '- 该工作流的核心护城河在于哪个环节？（提示词工程/垂直数据/工作流集成/用户习惯）'
  - '- 若平台推出原生功能替代你的某个环节，如何快速迁移/升级？'
- 'no': 2
  title: 捕捉一次平台红利窗口期的实战推演
  contents:
  - 假设某平台（如视频号/小红书/抖音/TikTok）刚上线一个新功能（如：AI生图工具/虚拟试衣间/本地生活团购/付费订阅）：
  - 1. 分析该功能的平台侧红利：流量扶持力度、竞争密度、规则宽松度、数据打通程度
  - 2. 分析用户侧认知红利：用户对该功能的认知水平、好奇心强度、支付意愿、传播动机
  - 3. 设计「功能+认知」组合打法：内容形式、引流路径、变现产品、私域承接
  - 4. 制定退出/转型预案：红利消退的信号指标、后续转型方向
  - 回答问题：
  - '- 如何在功能上线第1周完成从0到1的MVP测试？'
  - '- 团队决策链条过长如何通过「小步快跑」机制抢占窗口？'
- 'no': 3
  title: 策划一场「认知差反向引流」内容实验
  contents:
  - 选定一个处于早期阶段的AI工具/新技术（如：Sora视频生成/音乐生成AI/3D生成AI/代码生成AI）：
  - 1. 调研大众对该技术的主流刻板印象/认知偏差（如：生成视频物理规律错误/音乐无旋律感/代码有Bug）
  - 2. 设计3种冲突感内容脚本：吐槽型/对比型/整蛊型
  - 3. 规划发布节奏：首发平台、发布时间、互动引导话术、私域钩子设计
  - 4. 设定转化指标：完播率、互动率、引流率、私域转化率
  - 回答问题：
  - '- 如何把控「吐槽」的度，避免平台判定为恶意贬低/品牌方法律风险？'
  - '- 技术迭代极快，如何在认知差消失前完成私域资产的最大化沉淀？'
- 'no': 4
  title: 构建「公域引流-私域转化」全链路SOP设计
  contents:
  - 针对一个高客单价非标服务（如：留学咨询/家装设计/企业合规/高端陪诊）：
  - 1. 设计公域获客钩子：刚需低价实体品/虚拟资料/免费诊断/工具体验
  - 2. 选择公域平台与原生工具：小红书笔记/抖音小风车/视频号切片/闲鱼低价/直播间互动
  - 3. 设计私域信任建立流程：欢迎语/朋友圈专栏/社群运营/内容库预制/1v1咨询话术
  - 4. 设计分层转化产品矩阵：引流款(0-99元)/信任款(199-999元)/核心款(2999元+)/续费/转介绍机制
  - 回答问题：
  - '- 如何用「内容库预制」解决创始人IP依赖与多平台分发焦虑？'
  - '- 付费流投产比1:1即放量的前提条件是什么？如何快速验证？'
