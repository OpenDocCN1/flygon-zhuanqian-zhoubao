units:
- 'no': 1
  name: 业务导向组织设计 —— 让架构服务业绩而非迁就人情
  points:
  - '**为什么需要这个概念？**'
  - '- 创业初期常因“圣母心”留用不合适的人，导致组织架构畸形服务于特定员工而非业务目标'
  - '- 业务阶段变化快，人员能力跟不上，若不按业务重构架构，必然拖累业绩'
  - '- 核心矛盾：业务目标明确但人岗不匹配，激励机制（0）无法弥补人岗错位（人非1）的损耗'
  - '**核心定义**'
  - '- 组织架构必须服务于当前业务目标与里程碑，而非迁就现有人员的舒适区'
  - '- 拒绝“圣母心”硬留不合适的人，依据业务阶段匹配岗位，人岗不匹配果断调整'
  - '- 人才分层运营：核心层（信愿景、扛大旗）、执行层（按SOP拿结果）、淘汰层（不匹配快清理）'
  - '**关键性质**'
  - '- 动态性：随业务阶段（0-1/1-10/10-100）持续调整岗位JD与编制'
  - '- 结果导向：以业务产出为唯一标准检验组织设计合理性'
  - '- 成本敏感：创业早期核心资源稀缺，人岗匹配是最高性价比的杠杆'
  - '**典型例子**'
  - '- 小冯妮儿见面会复盘：从“为了团队调整业务”转为“围绕业务打造团队”，按保险业务发展阶段重新定岗招聘'
  - '- 小马宋公司：因出差多导致沟通缺位，员工问题积压，最终承认“几十个员工都不能畅快沟通是我的失职”，意识到管理者必须主动适配组织沟通机制'
  - '**边界条件**'
  - '- 非大企业成熟期适用：大厂有完善HR体系可容忍一定冗余，创业公司容错率极低'
  - '- 需创始人具备“业务第一性原理”拆解能力，否则无法输出清晰JD'
  - '- 调整幅度过大时需注意劳动法合规与雇主品牌维护，避免陷入仲裁泥潭'
  - '...'
  sources:
  - paper: docs/202303/20230328_027.md
    role: origin
  - paper: docs/202303/20230328_095.md
    role: improve
  excerpts:
  - 不要为了团队去调整业务，而是围绕业务打造更合适的团队。
  - 不要有圣母心去硬拔团队，团队人才培养也要分层运营，把适当的人放在适当的位置上。
  - 人才是一切的核心，人是 1 ，各种奖惩激励机制是 0，创业公司老板把时间要花在找到成就型人才上。
  - 公司的运营，就是不断矫枉过正的过程，公司问题是永远存在的，不是存在这种问题，就是存在那种问题，公司就是在不断解决问题和诞生新的问题中不断发展的。
  - 不存在完美的公司，一切‘完美人设’均为抽象理想，落地即偏差。
- 'no': 2
  name: 流程喂养/AI化员工模型 —— 用SOP让普通人稳定产出70分
  points:
  - '**为什么需要这个概念？**'
  - '- 创业公司招不到、留不住、养不起“100分超级员工”，高估主观能动性是典型误区'
  - '- 核心业务依赖少数明星员工，人一走业务瘫痪，缺乏标准化复制能力'
  - '- 非标服务想规模化，必须将创始人隐性知识显性化为标准问题库/SOP/内容库'
  - '**核心定义**'
  - '- 将核心业务拆解为标准化问题库与SOP流程，像“喂养AI”一样“喂料”给员工'
  - '- 让普通人按流程操作即可产出70-80分稳定结果，不追求100分完美'
  - '- 核心公式：标准问题库 + SOP手册 + 喂料式培训 = 可复制的交付体系'
  - '**关键性质**'
  - '- 去人依赖化：降低对个人天赋/经验/状态的依赖，提升组织确定性'
  - '- 迭代友好：SOP是活文档，随业务复盘持续升级，而非一劳永逸的死规范'
  - '- 低成本放大：边际复制成本趋近零，支撑矩阵化/规模化扩张'
  - '**典型例子**'
  - '- 内容工业化生产线：创始人花半个月穷尽客户全旅程高频问题，产出“大而全内容库”（文档/视频/音频），后续分发/剪辑/二创全外包，实现“降低对IP依赖”'
  - '- 保险销售话术库：将KYC访谈、异议处理、转化逻辑全SOP化，新人入职“按图索骥”即可开单'
  - '**边界条件**'
  - '- 仅适用于“高重复、低决策、可标准化”的执行层岗位（销售/运营/客服/剪辑）'
  - '- 核心决策层/战略层/创新层不可套用此模型，需保留主观能动性空间'
  - '- SOP若长期不迭代会变成“束缚手脚的绳索”，需建立季度/半年复盘更新机制'
  - '...'
  sources:
  - paper: docs/202303/20230328_027.md
    role: origin
  excerpts:
  - 把问题标准化流程化，给团队伙伴喂够足够的「料」，让他们像 AI 一样去学习，用流程和标准问题去培训团队，而不要高估员工的主观能动性。
  - 不要追求 100 分的员工，而是让员工根据流程做到 70 分。
  - 客户关心的问题可以穷尽，不管是核心问题还是周边问题...都可以 SOP 化。
  - 花半个月的时间自己做一个大而全的内容库，这样不同平台的分发、编辑、二创都可以由别人完成，降低对 IP 的依赖。
  - 服务业规模化铁律：标准化前置，人才后置。
- 'no': 3
  name: 剥洋葱面试法/成就型动机识别 —— 透过层层追问看透人性
  points:
  - '**为什么需要这个概念？**'
  - '- 简历包装、面试背诵题库普遍化，常规面试极难辨别真实能力与动机'
  - '- 创业高不确定性环境下，“金钱型动机”员工抗压性差、易跳槽、“成就型动机”才是核心筛选标准'
  - '- 招错一人成本极高：工资沉没+管理内耗+业务延误+团队士气受损'
  - '**核心定义**'
  - '- 面试采用“剥洋葱”层层追问（STAR原则：情境/任务/行动/结果），问得越深造假难度指数级上升'
  - '- 核心识别维度：成就型动机（信愿景、图成长、享受攻克难关）vs 金钱型动机（算得失、求稳重、避风险）'
  - '- 两大金钥匙提问：“原公司做过什么有成就感的事？” “平时喜欢干什么事？”'
  - '**关键性质**'
  - '- 验证真实性：细节经得起推敲的经历才是真实战，模糊/推卸/夸大即为造假信号'
  - '- 预测抗压性：成就型动机源于内驱力，外部环境恶化时动力不衰反增'
  - '- 文化同频：信愿景的人天然认同长期主义文化，减少管理摩擦成本'
  - '**典型例子**'
  - '- 小冯妮儿招聘实操：用剥洋葱法筛选核心运营/销售岗，重点考察“复盘某次失败项目的完整思考路径”而非结果'
  - '- 对比案例：面试者A谈“带团队冲榜单拿第一”的过程细节闪闪发光；面试者B只谈“负责日常运营”，追问细节语焉不详 → 果断选A'
  - '**边界条件**'
  - '- 面试官自身需具备业务纵深，否则无法追问到关键细节层，建议创始人亲自面核心岗'
  - '- 过度深挖可能冒犯高段位候选人，需把控节奏与尊重度，展现专业而非刁难'
  - '- 成就型动机≠不要钱，薪资仍需具备市场竞争力，动机是筛选维度而非定价依据'
  - '...'
  sources:
  - paper: docs/202303/20230328_027.md
    role: origin
  excerpts:
  - 选人用剥洋葱的方式持续追问，问的越深，对方造假难度越高。
  - 找成就型动机的人是创业公司的必走之路，找那些相信公司愿景和未来预期的人。金钱型动机的人创业公司用不起。
  - 面试小 tips:原公司里做过什么有成就感的事情？平时喜欢干什么事？
  - 人才是一切的核心，人是 1 ，各种奖惩激励机制是 0。
- 'no': 4
  name: KYC思维/知你客户 —— 从“推产品”转为“懂客户”
  points:
  - '**为什么需要这个概念？**'
  - '- 高客单价非标服务（保险/咨询/高端定制）无法靠“比参数/比价格”成交，客户买的是“被懂、被信任、被设计方案”'
  - '- 传统产品思维导致销售陷入“讲功能、比条款、拼价格”红海，严重依赖运气与人品'
  - '- 大客户决策周期长、利益相关方多，不深度诊断真实需求与资产全貌，根本无法精准击中痛点'
  - '**核心定义**'
  - '- KYC（Know Your Customer）：销售从“推产品”转为“懂客户”，通过深度面谈访谈挖掘客户真实风险需求、资产全貌、决策链路'
  - '- 核心动作：找已投保/意向高净值客户面谈（大客户面谈大于一切），建立信任护城河，而非单纯比拼产品条款'
  - '- 成交逻辑：专业诊断(KYC) → 方案定制 → 长期陪伴 → LTV最大化'
  - '**关键性质**'
  - '- 咨询式销售：卖的不是标品而是“专业判断力”与“资源整合力”，门槛高溢价高'
  - '- 信任前置：面谈本身即最高级营销，客户感受到“懂我”比“产品好”更具说服力'
  - '- 分层服务：A类高净值创始人亲服、B类团队标准化、C类剥离自动化，资源精准匹配价值'
  - '**典型例子**'
  - '- 保险大客户开发：不讲条款，改问“家族传承怎么规划？” “企业股权架构下一代怎么接班？” → 掘出真实痛点 → 定制方案 → 单保费百万级成交'
  - '- 同城相亲业务：红娘不推会员套餐，改做“情感诊断+匹配策略”，客单价从几千升至几万，复购转介绍成主流'
  - '**边界条件**'
  - '- 仅适用于高客单价、长决策链路、强信任依赖的非标服务/高端消费品'
  - '- 销售团队需具备基础专业度（财税/法务/心理/行业知识），否则无法支撑深度诊断对话'
  - '- 标准化低客单产品（如9.9元课程/日用百货）不适用，成本结构不匹配'
  - '...'
  sources:
  - paper: docs/202303/20230328_027.md
    role: origin
  excerpts:
  - 把 KYC 思维而不是产品思维贯彻给团队，逐步打造高端团队。
  - 找已经投保的潜在大客户去面谈，大客户面谈大于一切。
  - 用户分层，逐步剥离低端用户，用团队去做售后。不同用户给到不同的服务...
  - 打造成长型 IP，要么现在买我的服务，要么以后用更高的溢价买我的服务。
- 'no': 5
  name: 内容库预制/去IP依赖化运营 —— 让创始人从“内容苦力”变“内容架构师”
  points:
  - '**为什么需要这个概念？**'
  - '- 创始人亲自写文案/拍视频/做剪辑是典型“低杠杆高耗时”，精力被低价值执行吞噬，无暇战略思考'
  - '- 个人IP输出不稳定（有情绪/有状态/有瓶颈），业务增长不应绑定创始人内容产出波动'
  - '- 多平台分发（抖音/小红书/视频号/公众号/私域）若无标准化素材库，重复造轮子效率极低'
  - '**核心定义**'
  - '- 创始人前置投入半个月，穷尽客户全旅程高频问题（核心+周边），集中产出“大而全内容库”（标准答案/话术/案例/FAQ）'
  - '- 后续多平台分发、剪辑、排版、SEO、回复等执行层动作全拆解外包/分给初级运营，创始人只管架构与迭代'
  - '- 核心转变：从“内容生产者”→“内容架构师”，从“人治”→“法治/流治”'
  - '**关键性质**'
  - '- 一次性高投入，长期低边际成本：内容库建设期累，建成后边际复制成本趋近零'
  - '- 解耦人与业务：创始人可随时抽身战略层，业务不因“人没空/状态差”停摆'
  - '- 资产化沉淀：内容库本身是企业核心无形资产，估值计入品牌护城河'
  - '**典型例子**'
  - '- 小冯妮儿实操：半个月搭建保险咨询全知识库（几百个标准问答+话术+案例），后续抖音/小红书/视频号/知乎/私域同步分发，单条内容N次复用，团队分工明确'
  - '- 书单号矩阵：标准化选题库+文案库+素材库+剪辑模板，单人日产200条，完全不依赖创始人人设'
  - '**边界条件**'
  - '- 仅适用于“知识可结构化、问题可穷尽、答案可标准化”的业务（教培/咨询/工具/标准化服务）'
  - '- 个性化强/强人设/强情感连接的业务（如个人IP课程/心理咨询/高端定制）核心环节不可全库化'
  - '- 内容库若缺乏“季度/半年迭代机制”，半年即过期，变成“僵尸文档库”反害业务'
  - '...'
  sources:
  - paper: docs/202303/20230328_027.md
    role: origin
  excerpts:
  - 客户关心的问题可以穷尽，不管是核心问题还是周边问题...都可以 SOP 化。
  - 花半个月的时间自己做一个大而全的内容库，这样不同平台的分发、编辑、二创都可以由别人完成，降低对 IP 的依赖。
  - 打破了我内容产出和多平台运作的焦虑，终于了解了哪些核心的自己做，哪些是可以切分出去。
  - 服务业规模化铁律：标准化前置，人才后置。
- 'no': 6
  name: 公司人设与现实偏差 —— 接纳不完美，拥抱动态矫正
  points:
  - '**为什么需要这个概念？**'
  - '- 创始人爱在朋友圈/公众号秀“完美文化”，导致求职者入职后因“具体同事/上司/客户/执行偏差”与预期不符产生巨大落差'
  - '- 理想化人设一旦破裂，雇主品牌信任度崩塌，招聘成本飙升、核心人才流失、内部士气受挫'
  - '- 管理者常陷入“知行合一”自我苛责或“甩锅执行层”误区，无法客观看待偏差本质'
  - '**核心定义**'
  - '- 公司人设：对外宣传的理想化组织形象（价值观/文化/机制/愿景）'
  - '- 公司现实：员工入职后体验的具体执行层面（具体同事/具体上司/具体客户/具体流程/具体冲突）'
  - '- 偏差本质：抽象理想具象化执行时，个体差异/知行落差/管理盲区导致的结构性必然落差'
  - '**关键性质**'
  - '- 必然性：不存在完美公司，偏差是常态而非异常，追求“零偏差”即追求“死公司”'
  - '- 动态性：偏差随业务阶段/人员更替/外部环境持续演化，核心任务是“管理偏差”而非“消灭偏差”'
  - '- 矫正机制：公司运营本质 = 不断矫枉过正 = 解决旧问题 → 诞生新问题 → 再解决 → 再诞生...'
  - '**典型例子**'
  - '- 小马宋公司：因高频输出理想文化，应聘者入职发现“并非完美”而失望；作者因出差多导致沟通缺位，问题积压，最终释然“接纳不完美，持续迭代”'
  - '- 某独角兽公司：对外宣扬“扁平/透明/无KPI”，实则内部派系林立/向上汇报变形/核心指标造假，入职半年核心骨干集体出走'
  - '**边界条件**'
  - '- 偏差可接受范围：核心价值观不背叛、底线红线不触碰、关键承诺兑现率>80%'
  - '- 红线偏差：人设宣传“从不加班”实则“强制996”；宣传“绝对公平”实则“裙带关系横行” → 此类属欺诈，必死'
  - '- 管理者沟通缺位会放大偏差：小马宋承认“出差多导致沟通少、问题未重视”是失职，主动沟通是压缩偏差的关键杠杆'
  - '...'
  sources:
  - paper: docs/202303/20230328_095.md
    role: origin
  - paper: docs/202303/20230328_027.md
    role: improve
  excerpts:
  - 很多人觉得这家公司是一家完美的公司...进入公司后，可能会发现，公司和我描述的并不一样，于是会很失望。
  - 公司的运营，就是不断矫枉过正的过程，公司问题是永远存在的，不是存在这种问题，就是存在那种问题，公司就是在不断解决问题和诞生新的问题中不断发展的。
  - 以我这么多年的职场经历和咨询经历，也不可能存在什么完美公司，我们公司当然也不是，只是我想尽量做得好一些罢了。
  - 最近因为出差较多，和同事们的沟通和交流就少，结果发现同事们很多问题我没有重视，这是我的失职。
- 'no': 7
  name: 高客单价获客公式 —— 刚需钩子+付费流+私域信任+KYC服务
  points:
  - '**为什么需要这个概念？**'
  - '- 高客单价非标产品（保险/高端咨询/定制服务）直接投流转化率极低、获客成本极高、信任建立周期极长'
  - '- 免费流量不精准、不可控、周期长，无法支撑高客单业务的现金流与规模化需求'
  - '- 缺乏系统化获客模型，导致要么“不敢投流”，要么“投流亏死”，要么“靠运气吃饭”'
  - '**核心定义**'
  - '- 公式四要素：刚需钩子（前端羊头引流）+ 付费流（放大器验证放大）+ 私域信任（变现池沉淀）+ KYC服务（留存器深度转化）'
  - '- 刚需钩子：设计/采购目标客群高频刚需实体品（如日历/体检/工具/资料包），以电商SKU逻辑做“羊头”'
  - '- 付费流策略：千川/DOU+测款，首单ROI≥1:1即“通投拉满”，一转私域、二转纯利'
  - '- 私域+KYC：公域流量全量导入微信生态，通过专业诊断(KYC)而非推销成交，建立长期信任锚定LTV'
  - '**关键性质**'
  - '- 非标服务标品化：将非标服务包装为标准化前端产品，降低决策门槛，筛选精准人群'
  - '- 付费流倒逼精细化：花自己钱买流量，天然倒逼优化落地页/话术/转化路径，比免费流运营严谨得多'
  - '- 复利飞轮：私域沉淀→高频触达→信任叠加→复购/转介绍→LTV指数级增长→反哺付费流预算'
  - '**典型例子**'
  - '- 保险业务：送“家庭资产配置日历”（刚需钩子）→ 抖音投流回本（付费流）→ 企微沉淀（私域）→ KYC面谈诊断资产/传承需求 → 百万保单成交（高客单）→
    续费/转介绍（复利）'
  - '- 同城相亲：9.9元“脱单测评/线下局”（钩子）→ 信息流投流（付费流）→ 微信群/红娘1v1（私域）→ 情感诊断+定制方案（KYC）→ 万级会员成交'
  - '**边界条件**'
  - '- 前端钩子必须与后端高客单业务“同人群、强关联”，否则引来羊毛党导致ROI崩盘'
  - '- 付费流需具备“首单回本”能力，纯品牌曝光/长周期品牌建设不适用此模型'
  - '- 私域运营需配备专业服务团队（红娘/顾问/规划师），无服务交付能力私域即“死池”'
  - '...'
  sources:
  - paper: docs/202303/20230328_027.md
    role: origin
  excerpts:
  - 围绕目标人群挂钩的电商爆品去选品，科学的「挂羊头卖狗肉」。
  - 保险不是一个刚需，是不是可以用一个更刚需的需求吸引目标客群？
  - 付费流比免费流更香，投产比只要能达到一比一，通投拉满一转转化到私域，二转都是纯利。
  - 把 KYC 思维而不是产品思维贯彻给团队...打造成长型 IP，要么现在买我的服务，要么以后用更高的溢价买我的服务。
- 'no': 8
  name: 同模型连麦引流法 —— 借同行精准池低成本涨粉
  points:
  - '**为什么需要这个概念？**'
  - '- 公域流量越来越贵、越来越泛、越来越难转化，冷启动期账号权重低更难分到优质流量'
  - '- 寻找“粉丝画像高度重合”的同行/上下游直播间，其粉丝天然精准、信任迁移成本极低'
  - '- 官方投流（千川/DOU+）单次成本高且需持续投入，连麦引流边际成本趋近零且可复用'
  - '**核心定义**'
  - '- 寻找粉丝画像重合度>80%的直播间（同行/上下游/互补品类），发起连麦合作'
  - '- 标准化动作包：连麦互推 → 互相回关 → 开播时拉精准粉进直播间 → 连麦中送资料/福利留人'
  - '- 核心逻辑：借力同行已建立的精准粉丝池，通过“社交互惠”实现低成本冷启动与权重提升'
  - '**关键性质**'
  - '- 精准度高：同模型粉丝天然匹配目标客群，转化率远高于广撒网投流'
  - '- 成本极低：除人力协调成本外，零现金流出，适合现金流紧张的早期创业者'
  - '- 可复制放大：建立“连麦合伙人名单”，常态化排期，形成稳定的精准引流渠道'
  - '**典型例子**'
  - '- 小冯妮儿实操：找“高净值家庭/企业主/财务自由”画像重合的财经/保险/家族办公室直播间连麦，单场连麦涨精准粉500+，直播间权重显著提升'
  - '- 知识付费赛道：同题材课程主理人连麦互推“免费领资料/听公开课”，双方私域单日增粉1000+'
  - '**边界条件**'
  - '- 需对方账号权重/粉丝活跃度/合作意愿三者达标，僵尸号/刷量号/独大心态者均不可合作'
  - '- 连麦内容需设计“双赢话术/互补福利”，单方面索取会被拉黑、拉入黑名单、平台限流'
  - '- 仅作冷启动/权重辅助/种子用户来源，长期增长仍需核心内容/产品/投流体系支撑'
  - '...'
  sources:
