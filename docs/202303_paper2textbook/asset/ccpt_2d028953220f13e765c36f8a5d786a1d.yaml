paper: docs/202303/20230328_041.md
desc: 该素材为一篇社群分享帖的元数据页面，记录了作者 KangKang 在生财有术社群「Web3 入门｜2 月航海」实战中的分享链接及背景介绍，核心内容为作者从圈外小白到全职
  Web3 Builder 的成长路径复盘，及其通过参与社群学习实现团队 7 位数收益的案例背书，但具体方法论、核心概念及操作细节均未在本文中展开，需跳转原文链接获取。
concepts:
- name: Web3 入门航海实战
  desc: 生财有术社群组织的结构化 Web3 入门实战训练营，作为作者系统建立行业认知的关键路径。
  is_original: false
  excerpt:
  - 我参加了 Web3 入门｜2 月航海
  - 在生财 Web3 前辈的指引下，快速的建立对行业的框架、系统认知
- name: Crypto Alpha
  desc: 作者创立的 Web3 投研组织/品牌，标志着其完成从学习者到专业从业者的身份转型。
  is_original: true
  excerpt:
  - Crypto Alpha 创始人
methods:
- name: __overview__
  desc: 作者隐性的成长方法论：依托高质量社群（生财有术）获取前辈指引 -> 参与结构化实战训练（航海）建立系统认知 -> 全职投入并创立专业组织 -> 通过实战验证（空投/投资）获取高额收益。
  excerpt:
  - 没有生财，我也很难在生财 Web3 前辈的指引下，快速的建立对行业的框架、系统认知、以及未来全职进入 Web3
  - 参加了 Web3 入门｜2 月航海
  - 目前全职 Web3，Crypto Alpha 创始人
theorems:
- name: 社群赋能加速成长论
  desc: 优质付费社群提供的前辈指引、结构化实战训练和人脉网络，是普通人低门槛、快速切入 Web3 行业并实现商业化变现的核心杠杆。
  excerpt:
  - 感谢生财这个平台，没有生财，我也很难在生财 Web3 前辈的指引下，快速的建立对行业的框架、系统认知、以及未来全职进入 Web3
- name: 实战复盘确定性收益论
  desc: Web3 领域的高额收益（如空投）并非纯粹运气，而是建立在系统认知建立、长期冲浪积累和实战验证基础上的确定性结果。
  excerpt:
  - 成长之路是没有捷径的，踩了很多坑后，摸索出了一条属于自己的 Web3 探索之路
  - 月底，3 月 22、3 月 23，就收获了期待的本年度的团队 7 位数的收益
findings:
- name: 个人成长里程碑验证
  desc: '[evidence] 作者从入圈小白（3年前）经生财航海实战训练（2月），3周内实现团队 7 位数收益（3月22-23日），验证了该路径的可行性。'
  excerpt:
  - 入圈 3 年（生财和 Web3 都是 3 年）
  - 参加了 Web3 入门｜2 月航海
  - 3 月 22、3 月 23，就收获了期待的本年度的团队 7 位数的收益
- name: ARB 空投收益案例
  desc: '[claim] 评论区推测且作者未否认的主要收益来源为 Arbitrum (ARB) 空投，且因时间差遗憾错过更高收益（8位数）。'
  excerpt:
  - '刘嘉仁 : 撸到了 arb 的空投吧'
  - 遗憾错过了 8 位数的收益
