- 'no': 2
  name: 组合创新 —— 让创业变成“搭积木”
  points:
  - '**为什么需要这个概念？**'
  - '- 原创发明门槛高、周期长、失败率极高，不适合普通人低成本试错'
  - '- 成熟工具、平台、模式已验证可行，重新组装边际成本极低'
  - '- AI时代单点技术商业价值有限，唯有场景化组合才能形成可交付产品'
  - '**核心定义**'
  - '- 非原创式发明，而是将成熟技术工具（ChatGPT、Midjourney、RPA）、成熟流量平台（小红书、视频号、抖音）与成熟商业模式（无货源电商、知识付费、CPS分佣）重新组装'
  - '- 快速生成新变现路径，核心公式：成熟工具 × 成熟平台 × 成熟模式 = 新机会'
  - '**关键性质**'
  - '- 低门槛：不需从0发明技术，只需会用API、会剪辑、会搭建RPA流程'
  - '- 高确定性：各模块均经市场验证，组合失败率显著低于原创'
  - '- 可迭代：单模块升级（如GPT-3.5→GPT-4）即可整体跃迁'
  - '- 复利化：积累的组合库可快速响应新风向标，形成‘组合创新飞轮’'
  - '**典型例子**'
  - '- 小红书研报账号：付费研报内容源 + 稿定设计模板 + 群聊引流渠道 + ArtStation素材库 = 3周5000粉、引流600+'
  - '- AI模特商拍：ControlNet/OpenPose/LoRA + PS修图 + 电商摄影需求 = 7天变现'
  - '- ChatGPT写公众号爆文：GPT-4 + 爆文拆解Prompt + 剪映排版 + 矩阵分发 = 7天10W+'
  - '- RPA自动卖货：ChatGPT API + 影刀RPA + 指纹浏览器 + 知乎/亚马逊/BOSS直聘接口 = 非程序员自动化生产线'
  - '**边界条件**'
  - '- 组合非堆砌：需深度理解各模块接口与约束（如API调用限制、平台风控规则、工具输出质量）'
  - '- 核心环节不可外包：提示词工程、业务流程拆解、异常处理逻辑需自行掌握'
  - '- 避免‘工具中毒’：工具服务于业务闭环，不要为了用新工具而强行套用'
  - '...'
  sources:
