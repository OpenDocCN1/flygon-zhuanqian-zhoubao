- 'no': 5
  name: 私域沉淀 —— 让流量变成“资产”
  points:
  - '**为什么需要这个概念？**'
  - '- 公域流量租赁属性强：算法变、规则变、账号封，流量随时归零，无资产积累'
  - '- 高客单价、长决策周期、非标服务项目，公域直接转化率极低，信任建立成本高'
  - '- 只有沉淀至微信生态（个人号/社群/企微），才能实现高频触达、深度信任、复购裂变、LTV最大化'
  - '**核心定义**'
  - '- 将公域流量（视频号、小红书、抖音、知乎、百家号等）通过钩子（资料包、社群、表白墙、陪诊服务、低价引流品等）引入微信生态'
  - '- 构建高信任、高复购、可长期运营的用户资产池，是几乎所有高客单价或长周期项目的最终归宿'
  - '**关键性质**'
  - '- 信任前置：通过内容/人设/案例/服务在公域建立初步信任，私域承接后深化'
  - '- 高频触达：朋友圈/社群/私聊/视频号直播，零成本高频触达用户'
  - '- 精细运营：标签分层（意向/成交/高净值）、分级服务（免费资料/低价课/高价咨询/陪伴服务）、全生命周期LTV设计'
  - '- 可迁移性：微信生态相对封闭稳定，用户关系链随个人迁移，不受单平台规则剥离'
  - '**典型例子**'
  - '- 孕晚期妈妈：视频号10天涨粉1000+ → 发二维码图片降维引流 → 私域预售课程变现'
  - '- 小红书社群变现：0元建群 → 利他输出建信任 → 499元社群单月8万+ → 阶梯产品（咨询/训练营/录播课）'
  - '- 闲鱼虚拟资料：1元引流加微信 → 私域转化高客单代办/咨询/淘客返利'
  - '- 视频号切片：长直播切片分发公域 → 直播间承接99元高客单课程 → 私域复购高价咨询'
  - '**边界条件**'
  - '- 引流动作合规性：严守平台规则（小红书不截流、视频号用企微客服、抖音用小风车/蓝V组件），违规引流导致账号废号得不偿失'
  - '- 承接能力匹配：引流量级必须与私域承接能力（客服人力、SOP完备度、产品交付力）匹配，否则流量浪费且损信任'
  - '- 避免‘私域即微商’：核心是利他服务与信任积累，而非刷屏硬广、无差别群发，后者必死于用户厌恶与封号'
