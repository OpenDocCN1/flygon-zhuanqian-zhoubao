  name: MVP思维 —— 让验证走在投入前面
  points:
  - '**为什么需要这个概念？**'
  - '- 传统创业易陷入‘完美主义陷阱’：投入大量资源后才发现无人买单'
  - '- 资源有限时，必须用最小成本验证‘有人愿为价值付费’这一核心假设'
  - '- 只有跑通‘获客-转化-交付’闭环，后续的批量放大、工具接入、团队组建才有意义'
  - '**核心定义**'
  - '- 最小可行性产品思维：不追求完美，先用最低成本（时间、金钱）跑通完整商业闭环'
  - '- 验证核心指标：能否获客？能否转化？能否交付？单位经济模型是否为正？'
  - '- 验证通过后，再决定是否投入RPA、团队、广告预算进行规模化放大'
  - '**关键性质**'
  - '- 速度优先：从构思到首单的时间压缩至天/周级（如3天、7天）'
  - '- 成本可控：单次试错成本设定止损线（如几百元、几天时间）'
  - '- 闭环导向：必须包含完整的‘流量→转化→交付’链路，不可只做内容不带货、只引流不转化'
  - '- 数据驱动：以市场反馈（点击、咨询、下单、复购）为唯一决策依据'
  - '**典型例子**'
  - '- AI模特项目：失业3个月，7天搭建工作流、跑通首单、建立交付SOP'
  - '- 小红书研报号：3周内完成账号搭建、内容生产、私域引流、首单变现'
  - '- 知乎好物自动化：先人工跑通选品→出稿→发布→出单，再引入RPA批量化'
  - '- 闲鱼二手书：先单店单品手动上架验证出单，再注册6张执照开18店矩阵化'
  - '**边界条件**'
  - '- MVP不等于简陋：核心体验必须达标（如图片识别率、交付时效、售后响应），不可用‘是MVP’掩盖产品硬伤'
  - '- 验证周期有上限：设定明确止损线（如连续100条无单、投入300元无ROI），避免沉没成本陷阱'
  - '- 区分验证阶段与放大阶段：验证期用人工/半自动，放大期才上RPA/团队/投流，切勿混淆'
  - '...'
