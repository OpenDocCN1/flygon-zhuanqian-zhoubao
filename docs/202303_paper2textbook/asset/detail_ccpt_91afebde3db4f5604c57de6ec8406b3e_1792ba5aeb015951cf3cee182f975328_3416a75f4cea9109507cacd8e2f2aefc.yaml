  excerpts:
  - （1）选品重于投放 （2）投放页面重于投放策略 （3）投放策略重于关键词以及搜索词 （4）创意尽量多
  - 创意多了，平台的选择就会更多...相对来说点击价格也会降低
  - 创意数量多寡直接影响平台评分与点击单价：4-5条创意允许平台按人群匹配最优创意质量度提升降低CPC；单条创意平台强制展现需高出价。
- 'no': 8
  name: 跨平台投放策略复用框架 —— 百度/巨量/聚光账户结构同构，一套方法论打天下
  points:
  - '**为什么需要这个概念？**'
  - '- 多平台投放是规模化必经之路，但每个平台术语不同（计划/广告组/单元），新手极易‘词不达意’、重复造轮子'
  - '- 底层逻辑同构：均为‘层级结构+竞价机制+定向标签+创意素材+转化归因’，只需建立映射表即可复用'
  - '- 核心策略‘建策略-投预算-赚钱续投/不赚钱调换/砍掉重来’跨平台通用'
  - '**核心定义**'
  - '- 结构映射表：'
  - '  百度：计划 → 单元 → 创意 → 关键词'
  - '  巨量：广告组 → 计划 → 创意 → 关键词'
  - '  聚光：计划 → 单元 → 创意 → 关键词 → 定向'
  - '- 流量五大杠杆通则：地域越广/时段越全/词品越多/出价越高/限制越少 → 流量越多越杂；反之则精准可控'
  - '**关键性质**'
  - '- 核心逻辑复用：选品验证模型（淘宝销量+同行投放+关键词量）、测品止损/扩量阈值、账户减法原则、落地页结构、优化节奏'
  - '- 差异化适配：各平台用户画像/审核标准/流量分发机制不同，创意素材/落地页话术/定向标签需微调'
  - '- 工具观：‘工具能让我赚钱就行，不需要懂原理，会用就行’—— 把平台当‘流量自动贩卖机’用'
  - '**典型例子**'
  - '- 作者实操：百度跑通模型后，直接复用到巨量引擎/小红书聚光，账户结构一一对应搭建，核心逻辑零迁移成本'
  - '- 截图验证：巨量‘广告组/计划/创意/关键词’ 完美对应 百度‘计划/单元/创意/关键词’'
  - '**边界条件**'
  - '- 仅适用于‘搜索/表单/咨询类’线索获客模式；电商直投ROI/直播间投流/品牌广告模型不同'
  - '- 平台政策红利期不同：如抖音本地生活扩张期宽容无人直播，成熟期严打；需动态判断窗口期'
  - '- 账户主体资质/行业资质/开户门槛不同，需提前合规准备，避免‘模型跑通却开不了户’'
  - '...'
