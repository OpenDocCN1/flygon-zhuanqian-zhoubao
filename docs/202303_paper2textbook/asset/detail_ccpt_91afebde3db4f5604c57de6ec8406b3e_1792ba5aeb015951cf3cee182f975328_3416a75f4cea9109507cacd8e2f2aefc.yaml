  - 广告组--百度的计划 计划--百度的单元 创意---百度的创意 关键词---百度的关键词
  - 本质上是一样的，计划，单元，创意，关键词...工具，能让我赚钱就行，我不需要懂，会用就行了
  - ① 投放地域，越多，流量越多 ② 投放时段，越全，流量越高 ③ 投放的词，产品...越多流量越多 ④ 出价越高，流量越多 ⑤ 限制越少，流量越多，也越杂 反之亦然
- 'no': 9
  name: 试错成本认知重构 —— 把‘门槛’变‘杠杆’，在可承受范围内无限买确定性
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人视‘试错成本’为畏途，导致‘不敢测、测不够、测不快’，错过红利窗口期'
  - '- 认知升级、投放测品、生活决策本质同构：小成本买反馈、快反馈定决策、大放大赢收益'
  - '- 需要建立‘试错预算制’：预留可承受资金/时间，批量并行小赌注，而非单点重注'
  - '**核心定义**'
  - '- 试错成本 = 获取确定性认知的购买成本，而非‘亏损’'
  - '- 核心公式：在可承受范围内（如单品300元、月预算5000元），无限投入认知/知识付费/投放测试'
  - '- 复利效应：知识付费复利最强（一次学习、终身复用）、投放测品次之（模型可复用）、生活决策再次（情绪价值）'
  - '**关键性质**'
  - '- 投放端：单品止损300元 = 买一张‘该品类在百度跑不通’的确定性门票'
  - '- 认知端：付费进社群/买课/找顾问 = 买‘避坑地图/捷径/高维认知’，年化复利远超理财'
  - '- 生活端：送花维持关系/买时间/买体验 = 买‘情绪价值/信任资产/机会成本降低’'
  - '- 反向操作：因怕亏300元不测品 → 永远不知哪品赚钱 → 长期机会成本损失>>300元'
  - '**典型例子**'
  - '- 作者认知投入：付费进生财有术社群、跟投放大佬学、买工具/买数据/买咨询，年化回报率>>金融产品'
  - '- 投放实测：几十个产品测一遍，亏几万广告费，跑通1-2个蓝海品，年净利30万+，ROI极高'
  - '- 生活决策：送花换情绪价值，维持核心关系，避免决策失误损失，性价比极高'
  - '**边界条件**'
  - '- 必须‘可承受’：超出认知/资金承受范围的试错 = 赌博，非杠杆（如借贷投放、全仓梭哈）'
  - '- 必须‘有反馈’：无数据回流/无复盘沉淀/无标准化记录的试错 = 盲目烧钱，非买确定性'
  - '- 必须‘可复用’：单次试错产出的模型/SOP/认知能否迁移至下一项目/下一平台/下一决策'
  - '...'
  sources:
  - paper: docs/202303/20230328_172.md
    role: origin
  excerpts:
  - 最后希望大家不要把自己能够承受范围内的试错成本，当成门槛
  - 我在我可以承受范围内的关于知识，认知方面花钱是无限花...复利的效果非常强大
  - 试错成本是获取确定性认知、加速复利增长的杠杆工具；适用于投放测品/认知付费/生活决策(送花换情绪价值)。
- 'no': 10
  name: 达人投放‘低试错-可控-快放大’模型 —— 把投放思维外延至KOL合作
  points:
  - '**为什么需要这个概念？**'
  - '- 品牌方找头部KOL动辄几万十几万，一旦翻车/不转化=巨额沉没成本，且难以复盘归因'
  - '- 达人投放本质同搜索广告：买流量、看转化、算ROI，完全可以套用‘测品-验品-扩量’标准化流程'
  - '- 需要一套‘低成本试错、流量可控、快速放大’的达人合作SOP'
  - '**核心定义**'
  - '- 三阶段：'
  - '  ① 低试错：找小/腰部达人（百元/千元级），便宜=试错成本低'
  - '  ② 可控：不同风格达人=不同流量方向，投放后看数据筛选‘合适风格’'
  - '  ③ 快放大：筛选出合适风格后，批量找同风格达人铺货，规模化复制'
  - '- 核心指标：CPM（千次曝光成本）、CPC（点击成本）、加粉成本、私域转化率、ROI'
  - '**关键性质**'
  - '- 反向筛选：不看粉丝量看‘风格标签’（如‘宝妈测评风’/‘专业硬核风’/‘剧情种草风’），风格匹配>粉丝量'
  - '- 标准化交付：给达人统一‘话术框架/产品卖点/钩子设计/转化路径’，而非‘随便拍’'
  - '- 数据穿透：UTM参数/专属链接/私域进群码/优惠码，穿透归因至单达人/单视频/单计划'
  - '**典型例子**'
  - '- 作者外延：找10个小达人各投500元 → 筛选出2个‘专业硬核风’ROI>1 → 批量找50个同风格达人铺货 → 月销百万'
  - '- 避坑：拒绝‘一口价包结果’、拒绝‘不给数据/不挂链接/不配合归因’的达人/MCN'
  - '**边界条件**'
  - '- 仅适用于‘有标准化私域成交体系’的高客单/服务类产品；低客单标品走电商分佣/小店随心推更高效'
  - '- 需建立‘达人素材库/报价表/历史数据/合作SOP’资产包，否则规模化时管理成本爆炸'
  - '- 合规红线：医疗/金融/教育等强监管行业达人投放需资质审核，切勿踩线'
  - '...'
  sources:
