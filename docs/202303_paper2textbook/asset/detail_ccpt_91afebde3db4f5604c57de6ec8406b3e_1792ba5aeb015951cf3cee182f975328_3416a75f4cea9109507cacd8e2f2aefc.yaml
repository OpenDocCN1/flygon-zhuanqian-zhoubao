units:
- 'no': 1
  name: 同行长期投放=市场盈利铁律 —— 用竞争对手的钱验证你的商业模型
  points:
  - '**为什么需要这个概念？**'
  - '- 新手选品最怕‘选错赛道’，陷入‘有流量无转化’或‘转化不覆盖广告成本’的死循环'
  - '- 自己测品成本高、周期长、风险大，且缺乏判断标准'
  - '- 市场上已有玩家持续投放，意味着‘需求真、模型跑通、利润正’，是最低成本的验证信号'
  - '**核心定义**'
  - '- 判据：某平台有竞品持续投放广告超半年至一年'
  - '- 推论：该赛道必然存在盈利空间；若自己不盈利，归因于运营执行而非赛道伪命题'
  - '- 口诀：有同行在投放，长期投放的，就不可能不赚钱'
  - '**关键性质**'
  - '- 反向筛选器：倒逼自己从‘找项目’转向‘找同行’，再‘抄作业、优执行’'
  - '- 容错率高：只要跑通‘选品-验品-投放-私域成交’标准动作，概率极大'
  - '- 适用边界：仅适用于搜索广告（人找货、意图强），不适用于信息流（货找人、易烧钱）'
  - '**典型例子**'
  - '- 作者团队：盯着百度长期投放的虚拟资料、滋补品、玉石、机械等品类，年净利30万+'
  - '- 反例：作者曾尝试信息流广告，无长期投放同行参照，烧钱无果后果断放弃'
  - '**边界条件**'
  - '- 仅适用于‘价格不透明、利润覆盖广告成本、同行可打赢’的三要素满足品类'
  - '- 需具备基础投放技能（账户搭建、否词、落地页），纯小白需先补课或跟航海'
  - '- 平台算法迭代快，历史经验会失效，需持续‘小步快跑、验证迭代’'
  - '...'
  sources:
  - paper: docs/202303/20230328_172.md
    role: origin
  excerpts:
  - 有同行在投放，记住这句话，有人长期投放的，它就不可能不赚钱
  - 无论什么项目，如果有一个人一直在做，半年，一年都在做，那这个项目就不可能不赚钱，如果不赚钱就是自己不赚钱
  - 我做的就是这个，也尝试过信息流，不赚钱也就没继续学
- 'no': 2
  name: 选品三要素与三步选品法 —— 只卖‘能打赢、利润厚、价格迷’的产品
  points:
  - '**为什么需要这个概念？**'
  - '- 选品是竞价生意的‘一票否决’项，选错赛道，后续所有投放优化都是零乘以任何数'
  - '- 新手易陷入‘喜欢什么卖什么’或‘看热度卖什么’的主观陷阱'
  - '- 需要一套可标准化、可外包、可复用的‘选品-验品-干品’工业化流程'
  - '**核心定义**'
  - '- 三要素：①单品利润 > 获客成本+履约成本 ②价格体系相对不透明 ③落地页/销售/供应链能打过现有同行'
  - '- 三步法：选品（淘宝/店铺/5118三渠道挖掘）→ 验品（淘宝销量验需求、百度投放验盈利、关键词规划师验天花板）→ 干品（测品不达标果断砍掉）'
  - '**关键性质**'
  - '- 需求端看淘宝：购买人数证明市场存量，评论区挖痛点、卖点'
  - '- 供给端看百度：同行投放半年+证明变现可行，蝉妈妈/米尔等工具可查历史投放'
  - '- 天花板看关键词规划师：周搜索量决定收入上限（二胡80/周 vs 人参7900/周 = 天壤之别）'
  - '- 典型品类：虚拟资料、滋补品、玉石、檀香、机械、无牌电子产品等价格不透明品'
  - '**典型例子**'
  - '- 作者实操：二胡教程周搜80次，人参周搜7900次，直接放弃二胡、主攻人参类高搜品'
  - '- 验品实测：淘宝搜‘教程/黑科技/野生/加盟’挖品，进店挖关联SKU，5118导长尾词反推产品'
  - '**边界条件**'
  - '- 必须同时满足三要素，缺一不可（如利润薄、价格透明、打不过同行均直接PASS）'
  - '- 低价/高价产品验证标准不同，不能一刀切（低价看ROI止损300，高价看加粉成本3倍预算测试）'
  - '- 避开‘刚需伪命题’：如教育培训类虽刚需但周期长、投诉多、合规难，作者列为避坑区'
  - '...'
  sources:
  - paper: docs/202303/20230328_172.md
    role: origin
  excerpts:
  - 选品本质上肯定是要有利润的产品，因为我们有广告费，需要用利润覆盖广告费和成本，这也是为什么选择价格不透明的产品，方便加价。
  - 一定要保证，自己能打得过同行，这样才能保证能抢到流量变现的顺畅度，才能保证赚钱
  - ① 淘宝购买人数（证明这个产品有需求） ③ 百度有人长期投放（证明在百度上能赚钱） ③ 百度关键词规划师里搜索量（这个代表有人在百度找这个产品）
  - 这个数据就决定了，我们能赚多少钱
- 'no': 3
  name: 低价/高价差异化测品模型 —— 用‘止损线’和‘扩量阈值’把风险关在门外
  points:
  - '**为什么需要这个概念？**'
  - '- 测品是烧钱买数据，无标准化止损线极易‘赌徒心理’导致单账户亏损累计过万'
  - '- 低价产品决策快、ROI即时可见；高价产品周期长、依赖加粉成本与后端转化，指标体系完全不同'
  - '- 需要量化的‘红绿灯’指令，让执行层无需思考即可执行‘留/砍/扩’决策'
  - '**核心定义**'
  - '- 低价产品：看单品ROI、关键词/搜索词/刷量清洗，**单品亏损超300元且无刷量问题直接砍掉**'
  - '- 高价产品：预设承受加粉成本，**投3倍预算测试**；实测加粉成本≤承受成本1/3、转化率≥15%、单利润≥2000元 → 触发全维度扩量（加词、放匹配、加价、上同类、多开户）'
  - '**关键性质**'
  - '- 低价止损纪律：账户里‘几十个赔钱产品’均执行300元止损线清理，保住本金跑赢概率'
  - '- 高价扩量逻辑：预设加粉200元，实测50元即进入下一轮；400元直接放弃；达标后‘不惜一切代价抢流量’'
  - '- 免费搜索词策略：初期建议否词规避风险，跑通模型后可放开测试边际收益（实测‘免费’词也能成单）'
  - '**典型例子**'
  - '- 低价实测：投二胡教程消费200元，单一词消费180、免费词消费150、疑似刷量词消费198，优化后仍亏→直接停止'
  - '- 高价模型：利润2000/单、转化15%、加粉50元时，执行‘加词、放匹配、加价、上同类产品、多开户抢流量’'
  - '**边界条件**'
  - '- 止损线非绝对真理，需根据产品利润率、转化周期动态调整，核心是‘设定止损线并严守’'
  - '- 高价产品前置条件：必须有成熟私域成交体系（落地页+销售话术+交付SOP），否则前端跑通也变现不了'
  - '- 严禁‘不设止损、不看数据、凭感觉加预算’的赌博式操作'
  - '...'
  sources:
  - paper: docs/202303/20230328_172.md
    role: origin
  excerpts:
  - 低价：投放一单的利润，还不赚钱，并且去看关键词，搜索词，无刷量，就可以删掉...一般词没问题赔钱超过 300 我就干掉了
  - 高价：先定好自己能承受的加粉成本，然后投放 3 倍的加粉成本...利润 2000/ 每单，转化率 15%，加粉成本 50/ 每粉，那就，加词，放匹配，加价，上同类产品，多开户抢流量，各种扩量
  - 实际上，经过我的测试，免费这个词还是可以出单的
  - 刚开始还是建议把这类词否掉的，因为不确定后面赚钱可以再测试，否掉之后，还可以放开。
- 'no': 4
  name: 账户基建‘减法’原则 —— 关掉所有‘自动’功能，把流量控制权拿回自己手里
  points:
  - '**为什么需要这个概念？**'
  - '- 平台默认开启‘智能匹配、oCPC、自动出价、自动定向’等扩流功能，本质是‘帮你花钱、帮平台赚钱’'
  - '- 新手账户无历史数据、无转化模型，开自动=盲人骑瞎马，极易跑飞预算、买到垃圾流量'
  - '- 需要‘最小流量原则’：从最精准、最可控的流量起步，跑通模型再逐步放宽'
  - '**核心定义**'
  - '- 拿到账户第一件事：把能扩大流量的功能全部关掉'
  - '- 核心动作：关智能匹配、关oCPC、关自动出价、关自动定向，改‘手动点击出价’'
  - '- 手动控制四大杠杆：预算（防跑飞）、地域（精准投放）、时段（高转化时段溢价）、否词（切垃圾流量）'
  - '**关键性质**'
  - '- 计划层：按产品/地域/时段命名、设预算、改点击出价、设地域/时段溢价（倍数相乘）、加计划否词'
  - '- 单元层：同维度命名、关所有‘自动’、填主域名品牌名、加单元否词'
  - '- 创意层：每单元≥2条（建议4-5条），抄同行优质创意、配图、挂落地页链接'
  - '- 关键词层：手动出价设上限、匹配模式控宽窄（精准/短语/广泛）、上传生效'
  - '**典型例子**'
  - '- 作者实操：基础出价2元，地域溢价1.5倍、时段溢价1.5倍叠加，实际最高出价=2×1.5×1.5=4.5元，精准拿高质量流量'
  - '- 创意数量实测：4-5条创意让平台按人群匹配最优，质量度提升→点击单价下降；单条创意平台强制展现需高出价'
  - '**边界条件**'
  - '- 仅适用于搜索广告‘人找货’模式；信息流/展示广告需算法探索，不可全盘套用'
  - '- 账户跑稳后（有稳定转化模型），可尝试开启oCPC等智能工具放量，但需设置目标转化成本保护'
  - '- 否词需每日维护：搜索词报告中‘免费/教程/视频/怎么’等非商业意图词及时否掉'
  - '...'
  sources:
  - paper: docs/202303/20230328_172.md
    role: origin
  excerpts:
  - 拿到账户第一件事，把能扩大流量的，先全部关掉
  - 出价后面这个框看清楚：都是什么自动，就是百度想给你玩点花样，干掉它
  - 要注意的是，倍数相乘，如果我设定的价格是 2 块，客户是新疆石河子的在周二 8 点钟点击这个广告，我可以接受的最高价格就是：2*1.5*1.5=4.5
  - 建议最少添加两条创意...我一般都写个 4-5 条...相对来说点击价格也会降低
- 'no': 5
  name: 高客单私域落地页‘信任-恐慌-干货-实景-钩子’五段式结构
  points:
  - '**为什么需要这个概念？**'
  - '- 百度竞价流量贵、精准，但用户进页面3秒决定留走，转化率直接决定获客成本（CAC）生死'
  - '- 高客单价产品（如几百上千元）决策链路长、信任门槛高，普通电商详情页完全不够用'
  - '- 需要一套‘销售漏斗逻辑+极致减少操作步骤’的标准化页面结构，可复用、可测试、可迭代'
  - '**核心定义**'
  - '- 五段式：Header(人物/故事/简介建信任) → Pain Point(恐慌/痛点造迫切) → Authority(干货证专业) → Social
    Proof(客户反馈/采摘实景证源头) → CTA(一键复制微信号+优惠钩子+引导话术)'
  - '- 核心原则：尽量少给用户增加步骤，每一步都可能让用户不再加微信'
  - '**关键性质**'
  - '- 信任锚点：真人出镜/真实故事/资质证书/从业年限，解决‘你是谁凭什么信你’'
  - '- 恐慌营销：放大痛点后果（如‘不治疗会恶化’‘错过红利年入百万’），制造紧迫感'
  - '- 专业干货：展示核心方法论/独家技术/标准化流程，证明‘你懂行、能解决’'
  - '- 实景背书：客户聊天记录截图/发货现场/基地实拍，比文字承诺强100倍'
  - '- 低阻力CTA：一键复制微信号+‘领取XX优惠/资料’钩子+‘发送数字1领取’话术，傻瓜化操作'
  - '**典型例子**'
  - '- 作者落地页：个人故事建人设 → 行业痛点造恐慌 → 核心干货证专业 → 客户反馈/采摘视频证源头 → 底部大号微信号+‘加微信领优惠’'
  - '- 实测：极致简化操作步骤后，加粉成本从200元降至50元，直接触发高价产品扩量阈值'
  - '**边界条件**'
  - '- 仅适用于‘高客单、非标品、需私域成交’的产品；标品/低客单走电商直购链路更高效'
  - '- 页面加载速度、移动端适配、微信号防屏蔽（用小号/企微/链接跳转）是技术底线'
  - '- 需配合‘销售话术SOP’：加微信后如何诊断、报价、异议处理、成交、交付，否则流量进来也漏光'
  - '...'
  sources:
  - paper: docs/202303/20230328_172.md
    role: origin
  excerpts:
  - 这个页面的关键点：人物，故事，简介，恐慌，干货，客户反馈，采摘实景，加微信领取优惠
  - 就是说，尽量少的给用户增加步骤，每一步都有可能让用户不再加我
  - 页面的关键点：人物，故事，简介，恐慌，干货，客户反馈，采摘实景，加微信领取优惠
- 'no': 6
  name: 平台算法黑箱认知与有限可控边界 —— 敬畏算法，只做可控动作
  points:
  - '**为什么需要这个概念？**'
  - '- 运营易陷入‘删了个词就涨了/加了个词就跌了’的因果归因陷阱，导致迷信玄学操作'
  - '- 算法是‘整体建模、动态分配’，单一操作触发全局重算，结果非线性、不可复现'
  - '- 认清‘不可控’边界，才能聚焦‘可控’动作（结构/预算/出价/否词/创意），避免内耗'
  - '**核心定义**'
  - '- 黑箱机制：投放操作 → 平台算法判断意图 → 整体重新分配流量 → 结果输出'
  - '- 可控参数：账户结构搭建、日预算上限、关键词最高出价、否定关键词、创意数量质量'
  - '- 不可控变量：流量分配权重、质量度评分逻辑、竞争对手实时策略、算法版本迭代'
  - '**关键性质**'
  - '- 非线性因果：删一个亏钱词，可能导致整体流量结构变化，原本赚钱的词也跟着没量了'
  - '- 历史经验失效：算法持续迭代，去年有效的账户结构/出价策略今年可能变毒药'
  - '- 只能‘逐步优化’：在可控范围内小步试错、快速反馈、放大成功、砍掉失败'
  - '**典型例子**'
  - '- 作者亲历：删掉一个疑似刷量词，本意省钱，结果平台整体调整导致原本正常词流量骤减'
  - '- 策略：不纠结单一操作得失，看周/月维度账户整体ROI，结构性调整优于战术性微调'
  - '**边界条件**'
  - '- 不等于‘躺平不管’：该加预算加、该否词否、该换创意换，但预期管理要兜底‘算法有波动’'
  - '- 需建立‘数据看板+周复盘’机制，用统计规律对抗单次波动噪音'
  - '- 跨平台同理：巨量/聚光/百度算法本质相同，皆为黑箱，核心策略可复用但参数需重测'
  - '...'
  sources:
  - paper: docs/202303/20230328_172.md
    role: origin
  excerpts:
  - 是因为我删了这个词后，平台感觉到我有什么意思，整体调整的结果
  - 平台的算法在不断迭代的，不能以极长的以往的经验去判断整体调整
  - 我们的投放并不是我们能完全掌控的，只能在可掌控范围内，逐步优化
- 'no': 7
  name: 投放决策优先级金字塔 —— 选品>落地页>策略>关键词，别在皮毛上耗尽精力
  points:
  - '**为什么需要这个概念？**'
  - '- 运营80%精力常耗费在‘改出价、加否词、换创意、调匹配’等战术细节上，却忽视决定生死的战略层'
  - '- 资源有限（时间/精力/预算），必须按杠杆率分配：动一分战略，赢十分战术'
  - '- 需要一张‘决策地图’，告诉团队：此时此地，最该做的那件事是什么'
  - '**核心定义**'
  - '- 优先级排序（指数级递减）：'
  - '  L1 选品赛道（一票否决：利润/透明度/可打赢性）'
  - '  L2 落地页转化率（杠杆：同流量下，转化率翻倍=利润翻倍）'
  - '  L3 账户策略架构（骨架：计划/单元划分维度、预算分配、地域时段策略）'
  - '  L4 关键词/搜索词/创意细节（皮毛：增删改查、出价微调、匹配模式切换）'
  - '- 创意特例：创意数量属L3策略层，≥4-5条让平台竞价选择→降低CPC'
  - '**关键性质**'
  - '- 向下兼容：L1选错，L2/L3/L4做满分也是零；L2烂，L3/L4再精妙获客成本也覆盖不了利润'
  - '- 向上穿透：L4数据（搜索词报告/创意点击率）反哺L3策略调整，L3验证数据反哺L2页面优化，L2转化数据反哺L1选品决策'
  - '- 避坑指南：见到‘账户亏损’先查L1产品利润/ L2页面转化，最后才查L4关键词出价'
  - '**典型例子**'
  - '- 作者团队：测几十个产品（L1筛选）→ 统一落地页模板快速验证（L2）→ 固定账户结构模板（L3）→ 批量跑词/否词（L4）'
  - '- 创意实测：单条创意CPC高、4-5条创意CPC低，验证‘创意多给平台选择权’理论'
  - '**边界条件**'
  - '- 仅适用于‘搜索广告+私域成交’模型；品牌广告/信息流/直播带货优先级不同'
  - '- 早期探索期（0-1）以L1/L2验证为主，跑通后进入L3/L4精细化放量期'
  - '- 团队分工建议：老板/合伙人管L1/L2，投放专员管L3/L4，严禁越界内耗'
  - '...'
