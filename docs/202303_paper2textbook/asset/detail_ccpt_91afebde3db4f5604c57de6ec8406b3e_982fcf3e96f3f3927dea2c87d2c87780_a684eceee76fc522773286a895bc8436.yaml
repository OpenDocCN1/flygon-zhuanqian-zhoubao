units:
- 'no': 1
  name: 股权分配的动态公平性 —— 拒绝一次性切蛋糕，建立随时间调整的机制
  points:
  - '**为什么需要这个概念？**'
  - '- 合伙人人生阶段不同（有的全职、有的兼职、有的还在职），生活压力与投入度差异巨大'
  - '- 静态股权切分无法应对贡献度随时间变化的动态性，必然导致后续扯皮、撕逼甚至公司解散'
  - '- 早期公司现金流紧张，无法支付高额工资，需用长期激励平衡短期生存'
  - '**核心定义**'
  - '- 股权分配非一次性静态切分，而是建立动态调整机制，随合伙人投入度、资源贡献、人生阶段变化而调整'
  - '- 核心目标：锁定关键人、平衡短期生存与长期激励、解决‘花钱找工作’的伪合伙风险'
  - '**关键性质**'
  - '- 动态性：贡献度随时间变化，需配套期权池、分期授予、业绩触发等机制'
  - '- 非零和：非简单切分存量，而是通过机制设计做大增量、锁定核心人'
  - '- 反脆弱：允许合伙人退出、调整，而非绑死在初始协议上'
  - '**典型例子**'
  - '- Shiver 创业团队：三合伙人因人生阶段不同（全职/兼职/在职）、生活压力不一、出资出力比例异，陷入‘怎么分股公平’的死循环'
  - '- 解决方案：设计‘工资+期权/股权’动态组合包，通过运营机制锁定关键人而非静态注册股分配（具体方案涉及商业机密未公开）'
  - '**边界条件**'
  - '- 仅适用于早期团队未定型、贡献度高度不确定的阶段'
  - '- 需核心合伙人具备契约精神与长期主义共识，否则机制易被钻空子'
  - '- 涉及法律注册股变更时，需同步修订工商登记与股东协议，成本较高'
  sources:
  - paper: docs/202303/20230328_006.md
    role: origin
  excerpts:
  - 有的合伙人已经出来了，有的合伙人还在公司，怎么样出资保证公平
  - 三个合伙人因为人生阶段不一样，生活压力很不一样，要不要现在发工资
  - 公司运营机制如何在短期收益不高的情况下，保证中长期的发展，并且可以很好的锁定关键人员
  - 贡献度随着时间的变化，需要不断调整/扯皮，还可能一开始会错误估计对方的技能稀缺度和投入度
- 'no': 2
  name: 顾问记账法 —— 像银行记账一样记服务，盈利再算账，做大再投钱
  points:
  - '**为什么需要这个概念？**'
  - '- 小公司付不起高额固定顾问费，顾问又不愿纯拿股‘打工’或承担无限风险'
  - '- 传统‘固定费用’模式现金流压力大，‘纯占股’模式边界模糊易导致顾问情绪/时间/金钱投入失控'
  - '- 需要一种机制：前期无现金压力、中后期风险共担、利益深度绑定、信息优势转化为投资优势'
  - '**核心定义**'
  - '- 顾问按市场报价为服务‘记账’（不收现金），设定利润触发线'
  - '- 公司未盈利/倒闭则账务作废（下行保护）；盈利超线则按现金或折股偿还（捕获上行）'
  - '- 达成业绩里程碑后，顾问享有跟投权（信息优势转化为投资优势）'
  - '**关键性质**'
  - '- 三阶段递进：记账确认价值 → 利润线分担风险 → 里程碑跟投绑定未来'
  - '- 期权结构本质：等同于顾问持有公司看涨期权，行权价由利润门槛决定，深度运营带来信息优势提高行权决策质量'
  - '- 贝恩模式同构：咨询过程即高质量尽调，投资决策基于内部真实数据而非外部猜测'
  - '**典型例子**'
  - '- Max 帮 Shiver 完成早期框架构建与运营（相当 CEO/COO），日常按报价记账，设定利润线，盈利后折股/现金结算，业绩达标后跟投'
  - '- 该模式解决了：小公司现金流约束、顾问风险收益不对称、双方情绪与时间边界模糊三大痛点'
  - '**边界条件**'
  - '- 要求顾问具备深度运营能力（能干 CEO/COO 活），而非单纯战略建议'
  - '- 仅适用于早期现金流紧张、但业务模式相对清晰、有望在可预见周期内盈利的项目'
  - '- 需双方高度信任，且顾问愿意承担‘公司死掉账务归零’的下行风险'
  sources:
  - paper: docs/202303/20230328_006.md
    role: origin
  excerpts:
  - 日常服务时按照报价记着账
  - 设置一条利润线，如果公司死了，也就不用给了
  - 如果超过这条利润线，按照现金或者折算成股份
  - 还能约定好，进一步达到某个业绩指标，能够投一部分钱进去
  - Max 往往帮公司完成早期框架构建和运营，相当于干了 CEO 和 COO 的活，所以他能看到真实的数据指标
  - 所以在达到某个业绩指标时的投钱节点，被坑的概率非常低
  - 这和贝恩的套路特别像，为什么 MBB 里贝恩除了做战略咨询，其实还有一块很大的业务是做贝恩投资？
- 'no': 3
  name: 非核心人力市场价锚定 —— 砍掉‘低价换股’幻觉，用合同把隐性成本显性化
  points:
  - '**为什么需要这个概念？**'
  - '- 辅助性工种（设计、文案、跑腿等）常以‘低价/免费’换取股权预期，事后因贡献度认定不清引发股权纠纷'
  - '- 创始人因现金流不足倾向‘画大饼’，辅助人员因信息不对称高估贡献值，双方隐性契约不匹配'
  - '- 需从源头切断‘低成本投入博高股权’的道德风险与套利路径'
  - '**核心定义**'
  - '- 非核心、半白嫖工种，必须以市场价支付现金并签署正规合同留痕'
  - '- 将隐性股权承诺转化为显性债务关系（应付账款），杜绝事后‘我贡献这么大凭什么不给股份’的敲诈'
  - '**关键性质**'
  - '- 显性化：现金支付+合同固证，成本计入财务报表，不占股权池'
  - '- 公平性：市场价为锚，双方交易即时结清，无隐性期权、无后续纠葛'
  - '- 边界清晰：核心合伙人走‘记账法/动态股权’，辅助工种走‘市场价现金清算’，两套体系互不干扰'
  - '**典型例子**'
  - '- Max 方案明确警示：防止‘我帮 Shiver 用 3 万出了个市面 7 万的稿子，凭什么不给几个点股份’的典型道德风险案例'
  - '- 执行：按 7 万市场价付款、签采购合同、开发票、记应付账款，事后绝无股权话语权'
  - '**边界条件**'
  - '- 仅适用于可替代性强、贡献度可外部定价的标准化/半标准化工种'
  - '- 核心合伙人、深度运营顾问、关键技术骨干不适用此法，须走长期绑定机制'
  - '- 公司极早期现金流极其枯竭时，可暂记‘应付账款’而非即时付现，但必须承诺市场价、签合同、设还款期限'
  sources:
  - paper: docs/202303/20230328_006.md
    role: origin
  excerpts:
  - 应该以市场价为锚定点去付钱，同时需要签协议留作证据
  - 防止出现这样的情况'我帮 Shiver 用 3 万出了一个市面上 7 万的稿子，我做了这么大贡献，不应该拿他几个点的股份么'
  - 非核心半白嫖工种以市场价付费签协议留证，切断低成本投入换高股权预期套利路径，将隐性股权成本显性化为财务成本
- 'no': 4
  name: 咨询即尽调、投资即落地 —— 像贝恩一样，先干活拿数据，再投钱不被坑
  points:
  - '**为什么需要这个概念？**'
  - '- 外部投资人因信息不对称极易‘被坑’（财务造假、业务虚高、团队吹牛）'
  - '- 传统尽调（看报表、访谈、查法律）只能看到表层数据，无法触达真实运营指标与团队执行力'
  - '- 顾问若能深度介入运营，掌握一手数据，投资决策质量将质变'
  - '**核心定义**'
  - '- 顾问在早期深度参与运营（承担 CEO/COO 职能）的过程，本质上是最高质量的尽职调查'
  - '- 掌握真实数据指标、团队作战能力、业务模型跑通情况后，再在业绩里程碑节点决策投资'
  - '- 复刻贝恩‘战略咨询引领主权投资’的一体化商业逻辑：咨询费覆盖尽调成本，投资收益捕获上行空间'
  - '**关键性质**'
  - '- 信息优势不对称：深度运营者掌握‘真实数据指标’，外部投资人只能看‘PPT/报表’'
  - '- 决策质量跃迁：投资节点由‘信任/判断’转为‘数据/事实’，被坑概率极低'
  - '- 利益三重绑定：服务费（记账）+ 股权（折股）+ 投资（跟投），顾问从‘外包’变‘准合伙人/准投资人’'
  - '**典型例子**'
  - '- Max 深度介入 Shiver 运营，看到真实数据，后续跟投决策基于内部信息而非外部猜测'
  - '- 贝恩咨询：咨询项目即严密尽调，咨询团队掌握核心数据后，贝恩资本介入投资，逻辑极其顺畅'
  - '**边界条件**'
  - '- 要求顾问具备全链路运营实战能力（能替创始人干活），而非仅有战略/财务/法务单点技能'
  - '- 仅适用于早期、重运营、模式可验证的 ToB/硬科技/产业互联网等项目，不适用于纯金融套利/概念炒作类'
  - '- 顾问需承担‘干活不收费、公司倒闭血本无归’的时间成本与机会成本风险'
  sources:
  - paper: docs/202303/20230328_006.md
    role: origin
  excerpts:
  - Max 往往帮公司完成早期框架构建和运营，相当于干了 CEO 和 COO 的活，所以他能看到真实的数据指标
  - 所以在达到某个业绩指标时的投钱节点，被坑的概率非常低
  - 这和贝恩的套路特别像，为什么 MBB 里贝恩除了做战略咨询，其实还有一块很大的业务是做贝恩投资？
  - 因为贝恩咨询的咨询过程相当于做了很严密的尽调，这个时候贝恩资本来投资，逻辑就非常的顺
