units:
- 'no': 1
  name: 理财入门索引页 —— 知识地图的空心化占位符
  points:
  - '**为什么需要这个概念？**'
  - '- 社群知识体系庞大，需要结构性分类入口（如“理财入门”）帮助用户快速定位模块边界'
  - '- 早期知识沉淀策略以“链接分发”为主，索引页承担导航骨架功能，是构建完整知识地图的必要环节'
  - '**核心定义**'
  - '- 索引页：仅包含标题与外部链接（语雀文档），无实质正文内容的结构性占位页面'
  - '- 空心化：核心知识资产寄宿于外部平台，本地仅保留入口元数据，形成“壳在本地、肉在云端”形态'
  - '**关键性质**'
  - '- 零内容可读性：打开素材无法直接获取任何理财知识点、方法论或案例'
  - '- 强依赖外链：知识获取路径强制跳转第三方平台，体验割裂'
  - '- 结构性锚点价值：虽无内容，但其存在标识了“理财”作为独立知识模块的边界，为教材章节划分提供目录依据'
  - '**典型例子**'
  - '- 素材 `docs/202303/20230328_157.md`：标题为“理财入门”，内容仅为一行语雀外链，无任何正文'
  - '- 同类素材：`20230328_089.md`（亦仁专访）、`20230328_025.md`（见面会复盘）均为同模式索引页'
  - '**边界条件**'
  - '- 外链失效风险：语雀文档迁移、权限变更、平台倒闭均会导致知识资产永久不可达'
  - '- 无法离线/本地化检索：脱离网络环境或外部平台限制访问时，该索引页失去全部实用价值'
  - '- 教材编写障碍：无法从素材中直接提炼 `points`、`excerpts`，必须人工介入外部链接补全，违背“素材自洽”原则'
  sources:
  - paper: docs/202303/20230328_157.md
    role: origin
  excerpts:
  - 该素材(docs/202303/20230328_157.md)仅为索引入口，核心内容寄宿于外部语雀文档，存在链接失效风险。
  - 素材仅含标题‘理财入门’及语雀外链，无实质正文内容，作为理财知识模块的结构性占位索引。
