learning_targets:
- 理解生财有术社群知识体系的四大支柱模块结构（认知、技能、心态、微信）及其协同关系
- 识别当前素材呈现的‘索引页空心化’与‘外链依赖’知识管理隐患，掌握溯源语雀文档的必要性
- 区分‘认知层’（懂什么/为什么）、‘技能层’（怎么做/标准化）、‘心态层’（心理建设/长期主义）、‘微信层’（私域基建/生态规则）的功能边界
- 建立‘知识地图思维’：以结构性锚点导航碎片化信息，而非陷入细节堆砌
- 具备评估社群知识资产风险的能力：链接失效、版本迭代、内容缺失对教学与实战的影响
concept_map:
- 生财有术知识体系四大支柱
- ├── 生财认知 (P001、P005)
- │   ├── 定位：底层逻辑抽象与实战规律归纳
- │   ├── 性质：结构性锚点、索引页空心化、外链依赖
- │   └── 边界：不含具体模型，需溯源语雀
- ├── 生财技能 (P002、P006)
- │   ├── 定位：可复制、可标准化的实战操作手册集
- │   ├── 性质：可标准化、组合创新载体、索引页空心化
- │   └── 边界：有效期短、易工具中毒、需溯源语雀
- ├── 生财心态 (P003、P007)
- │   ├── 定位：穿越周期的心理基建与反脆弱内核
- │   ├── 性质：认知行动桥梁、反脆弱机制、索引页空心化
- │   └── 边界：不直接变现、防鸡汤陷阱、需溯源语雀
- └── 微信专题 (P004)
- '    ├── 定位：私域流量操作系统的底层基建与生态规则'
- '    ├── 性质：基建属性、生态闭环、索引页空心化'
- '    └── 边界：规则黑箱、合规收紧、需溯源语雀'
life_analogy:
- 想象生财有术社群知识体系是一座**四层摩天大楼**：
- '- **生财认知 = 建筑蓝图与地基**：决定大楼盖多高、抗不抗震（底层逻辑），但你手里只有『见蓝图处前台领取』的索引卡（空心索引），真图纸锁在语雀保险柜里。'
- '- **生财技能 = 标准化预制构件**：钢筋、混凝土、门窗模块（SOP/工具/脚本），拿来就能拼装『组合创新』，但构件有保质期（平台规则变），且图纸目录卡也是空的。'
- '- **生财心态 = 施工队的精神面貌与安全规范**：决定能不能熬过风雨、不偷工减料、坚持长期主义（过程即奖赏），但安全手册也是索引卡一张。'
- '- **微信专题 = 大楼的水电燃气地下管网**：不直接创造楼层面积（业务增量），但断水断电大楼即废（账号归零），管网图纸同样在语雀保险柜。'
- '**核心启示**：别光盯着手里的四张『索引卡』发呆，必须跑趟语雀保险柜（溯源原文档），把蓝图、构件清单、安全手册、管网图全调出来，才能真盖楼（做项目)。'
summary:
- concept: 生财认知
  desc: 社群知识体系『认知层』入口，索引页空心化，核心内容寄宿语雀，结构性锚点区别于技能/心态层
- concept: 生财技能
  desc: 可标准化实战操作手册集，组合创新积木，索引页空心化，有效期短易工具中毒
- concept: 生财心态
  desc: 心理基建与反脆弱内核，连接认知与行动，索引页空心化，防鸡汤陷阱需配合项目落地
- concept: 微信专题
  desc: 私域流量基建与生态规则，决定业务上限生存周期，规则黑箱合规收紧，索引页空心化
- concept: 索引页空心化
  desc: 素材仅存标题外链，核心内容外置语雀，存在链接失效导致知识资产永久流失风险
- concept: 外链依赖
  desc: 早期知识沉淀以链接分发为主、本地归档为辅，策略缺陷导致教学与实战均需溯源
- concept: 四支柱协同
  desc: 认知定方向、技能给杠杆、心态保持久、微信筑基建，缺一不可形成完整变现闭环
exercises:
- 'no': 1
  title: 溯源实战：补全四大支柱的核心清单
  contents:
  - 任务：分别访问细纲概念解析中引用的 7 个语雀外链（或模拟该过程），为每个支柱提炼至少 3 条核心子概念/方法/心法/工具。
  - 生财认知（docs/202303/20230328_007.md、091.md）：
  - '  - 核心子概念 1：'
  - '  - 核心子概念 2：'
  - '  - 核心子概念 3：'
  - 生财技能（docs/202303/20230328_013.md、102.md）：
  - '  - 核心技能/工具/SOP 1：'
  - '  - 核心技能/工具/SOP 2：'
  - '  - 核心技能/工具/SOP 3：'
  - 生财心态（docs/202303/20230328_031.md、112.md）：
  - '  - 核心心法/模型 1：'
  - '  - 核心心法/模型 2：'
  - '  - 核心心法/模型 3：'
  - 微信专题（docs/202303/20230328_053.md）：
  - '  - 核心工具/策略/红线 1：'
  - '  - 核心工具/策略/红线 2：'
  - '  - 核心工具/策略/红线 3：'
  - 回答问题：
  - '- 若语雀链接失效，你会通过哪些渠道（社群内部搜索、圈友分享、公开网络等）尝试恢复核心内容？'
  - '- 如何设计一套‘本地归档+版本管理’机制，彻底解决‘索引页空心化’与‘外链依赖’风险？'
- 'no': 2
  title: 四支柱协同诊断：拆解一个真实项目的支撑结构
  contents:
  - 选择一个你熟悉的副业/创业项目（如：小红书无货源、视频号带货、知识付费社群、本地生活服务等）。
  - 按下表维度拆解，若某支柱缺失/薄弱，标注风险等级（高/中/低）并给出补强动作：
  - '| 支柱 | 项目中的具体体现 | 当前强度(1-5) | 缺失风险 | 补强动作 |'
  - '|------|-------------------|----------------|----------|----------|'
  - '| 生财认知 | 如：确立‘赚钱即利他’选品逻辑 | | | |'
  - '| 生财技能 | 如：掌握‘剪映批量混剪SOP’、‘选品测款表’ | | | |'
  - '| 生财心态 | 如：执行‘21天打卡’、用‘炸弹思维’抗拖延 | | | |'
  - '| 微信专题 | 如：搭建‘视频号→企微→个人号’引流链路、配置指纹浏览器矩阵 | | | |'
  - 回答问题：
  - '- 哪个支柱是该项目的‘最短板’（木桶效应）？为何往往被忽视？'
  - '- 若只能投入有限精力强化一项，你会选哪个？理由是什么？'
- 'no': 3
  title: 知识资产风控演练：应对‘语雀链接失效’灾难场景
  contents:
  - 场景：某天生财有术社群所有语雀文档链接因平台政策变更/账号异常/网络故障全线失效，仅剩本地这 7 个空心索引页。
  - 请设计 72 小时应急恢复预案：
  - 1. 第 1 小时：确认损失范围、启动备用方案、分工协作
  - '   - 损失清单：'
  - '   - 备用内容源：'
  - '   - 分工表：'
  - 2. 第 24 小时：核心高频内容恢复优先级排序
  - '   - P0（必须恢复）：'
  - '   - P1（尽快恢复）：'
  - '   - P2（可延后）：'
  - 3. 第 72 小时：建立长效本地化知识库架构
  - '   - 存储方案（本地/NAS/云盘/私有化部署）：'
  - '   - 目录结构（映射四大支柱+项目实战）：'
  - '   - 更新机制（定期同步/增量备份/版本控制）：'
  - '   - 检索工具（全文搜索/标签/知识图谱）：'
  - 回答问题：
  - '- 这次演练揭示了你当前个人知识管理体系的哪三个致命漏洞？'
  - '- ‘索引页空心化’在平时看似无害，为何在灾难时刻会变成‘致命伤’？'
