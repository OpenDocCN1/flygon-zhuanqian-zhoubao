  name: 私域归宿论 —— 公域流量的终点是微信生态
  points:
  - '**为什么需要这个概念？**'
  - '- 公域流量(抖音/小红书/视频号/B站/知乎)具有“算法不可控、用户不属于你、获客成本递增、随时限流”的本质属性'
  - '- 高客单价/非标服务/长周期决策/复购型业务，无法在公域直接成交，必须沉淀私域建立信任'
  - '- 微信生态(个人号/社群/企微/视频号/公众号/小程序)是唯一支持高频触达、深度沟通、支付闭环、裂变增长的成熟体系'
  - '**核心定义**'
  - '- 所有公域玩法(内容引流/直播挂载/小风车/切片/低价虚拟品/朋友圈投流)的最终目的，均为沉淀至微信个人号/社群/企业微信'
  - '- 私域运营核心动作：高频触达(朋友圈/群发/群公告) + 信任建立(专业人设/案例/背书) + 复购转化(课程/服务/实物/会员/分销) = LTV最大化'
  - '- 公域仅为“引流前端/漏斗入口”，私域才是“变现主场/资产沉淀/护城河所在”'
  - '**关键性质**'
  - '- 全渠道汇聚：无论流量来自哪个平台，终点统一指向微信生态，形成“多源入口、单一池、分层运营”模型'
  - '- 资产确权性：微信好友/社群/企微联系人属于账号主体资产(虽有封号风险)，而公域粉丝属平台资产随时收回'
  - '- 复利周期长：私域用户生命周期可达年级，复购率/推荐率/客单价随信任积累指数级增长，公域单次转化为主'
