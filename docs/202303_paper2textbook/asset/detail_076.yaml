  - '**核心定义**'
  - '- 利用大众对新事物的刻板印象/认知偏差(如“文心一言生成图像质量差/智障”)，制造冲突感内容获取高互动流量'
  - '- 核心打法：逆向思维 -> 吐槽/对比/整蛊生成内容 -> 高互动/涨粉快 -> 引流私域/挂载变现'
