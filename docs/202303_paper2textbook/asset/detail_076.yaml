  name: AI套壳/Prompt工程变现 —— 卖铲人比淘金人更确定
  points:
  - '**为什么需要这个概念？**'
  - '- 大模型API能力强但“裸奔”不可用：缺乏垂直知识、无交互界面、不会部署、合规风险高'
  - '- 终端用户（卖家/运营/学生）只有“焦虑”和“需求”，没有技术能力直接调用API'
  - '- 信息差红利期短，谁能率先封装好用的“垂直场景应用”或“高质量指令集”，谁就能收割第一波利润'
  - '**核心定义**'
  - '- 基于GPT-3.5/4、Claude等API，封装Chrome插件/微信小程序/网站/Cursor编辑器等垂直场景应用'
  - '- 或贩卖高质量Prompt/指令集（如ChatGPT Shortcut、亚马逊插件Shulex、500条提示词合集）'
  - '- 核心逻辑：信息差(知道怎么用) + 集成优势(帮用户配好环境/参数/流程) = 付费意愿'
