paper: docs/202303/20230328_045.md
desc: 该素材为饼公子在生财有术社区分享的《AI绘画，从随机出图到随心定制》主题分享的引言部分，核心观点强调写好关键词是实现AI绘画可控生成的核心，并宣布将结合定制商单实战经验，系统分享关键词编写方法论与定制化思路，旨在帮助学习者从随机出图进阶到随心定制。
concepts:
- name: 随机出图
  desc: 指缺乏有效提示词控制下，AI绘画模型生成结果不可预测、不可复现的初级使用状态。
  is_original: false
  excerpt:
  - 如何让 AI 绘画，从随机出图到随心定制
- name: 随心定制
  desc: 指通过精准编写关键词（Prompt）及掌握定制化流程，使AI绘画输出完全符合创作者意图、可商业化交付的高阶使用状态。
  is_original: true
  excerpt:
  - 如何让 AI 绘画，从随机出图到随心定制
  - 希望能用 AI 绘画，画出心中所想，创造出属于自己的世界
- name: 关键词工程
  desc: 素材核心方法论的载体，指通过结构化编写提示词来控制AI生成图像内容、风格、细节的核心技能，是连接随机出图与随心定制的关键桥梁。
  is_original: true
  excerpt:
  - 要想画出一幅你想要的画面，核心内容还是“写好关键词”
  - 我将以“如何写好关键词”结合定制商单为例，聊一聊我的想法和思路
- name: 定制商单
  desc: 指基于客户具体需求，利用AI绘画技术进行定制化创作并交付变现的商业场景，素材将其作为实战案例背景。
  is_original: false
  excerpt:
  - 结合定制商单为例
methods:
- name: __overview__
  desc: 素材整体方法论框架：以‘写好关键词’为核心技术手段，结合‘定制商单’实战场景，构建从随机生成到可控定制的完整教学路径。
  excerpt:
  - 我将以“如何写好关键词”结合定制商单为例，聊一聊我的想法和思路
theorems:
- name: 关键词决定论
  desc: 核心主张：在当前AI绘画技术范式下，输出结果的可控性与质量上限主要取决于提示词（关键词）的编写质量，而非模型本身的随机性。
  excerpt:
  - 相信大家已经知道，要想画出一幅你想要的画面，核心内容还是“写好关键词”
- name: 实战倒推学习法
  desc: 核心主张：学习AI绘画不应局限于理论参数，而应通过‘定制商单’等真实商业需求场景倒推关键词编写技巧，实现技能的快速落地与变现。
  excerpt:
  - 我将以“如何写好关键词”结合定制商单为例，聊一聊我的想法和思路
