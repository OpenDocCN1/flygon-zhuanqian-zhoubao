units:
- 'no': 1
  name: 同城水果团购 —— 公域种草+私域信任+源头供应链的轻资产闭环
  points:
  - '**为什么需要这个概念？**'
  - '- 传统水果店/超市存在中间商层层加价、鲜度不可控、选品被动的痛点'
  - '- 微商依赖熟人关系天花板低，社区团购受区域限制想象空间小'
  - '- 普通人缺乏资金/经验/场地，需要零门槛、高复购、可规模化的创业模型'
  - '**核心定义**'
  - '- 公域（小红书）引流 → 私域（微信群/快团团）成交 → 源头（新发地一级批发）现采发货'
  - '- 三位一体：流量端数据化选题/多路径引流、产品端零库存现采/动态定价/分级售后、转化端移木建信/SOP化群运营'
  - '**关键性质**'
  - '- 刚需高频强复购：水果人人吃、消耗快、非旺季月复购率仍超38%，用户养成习惯后形成‘静默下单’'
  - '- 价格锚定优势：一级市场直发省去中间商+无店面成本，价格比水果店低20%+（如粑粑柑7.6vs12元/斤）'
  - '- 供应链为核心护城河：掌握源头货源与定价话语权，可规避行业坑（如阿克苏苹果两层礼盒套路），量大后锁定成本优势'
  - '- 红利期窗口：小红书用户高速增长期创作者稀缺，算法友好0粉可上热门，用户画像与消费主力高度重合'
  - '**典型例子**'
  - '- 新手40天实战：建3个团购群，单日交易额破9000+，最快单日建群200人出5单，协助朋友周建群300人'
  - '- 0粉账号通过爬虫选题法产出1.5万赞爆款，一周引流建群300人'
  - '- 宝妈群体在拍照引流/群运营/信任建立上综合优势显著，是最适配人群画像'
  - '**边界条件**'
  - '- 前期靠‘刷脸’拿低价不可持久，供应链规模化需量大才能锁定成本优势'
  - '- 极端行情（进价>售价）需‘宁缺毋滥、亏本退款’强化品质人设，而非发次品维持交易'
  - '- 必须亲自做C端验证模型（建群/卖货/售后）理解团长痛点，建立SOP后再赋能B端放大'
  - '- 仅适用有源头供应链优势或能整合一级货源的场景，纯倒手无护城河'
  sources:
  - paper: docs/202303/20230328_156.md
    role: origin
  excerpts:
  - 同城水果团购是通过在公域平台发布内容（特别是小红书），引流到微信内售卖。
  - 用户昨天下单，今天采集最新鲜的货，当天发出。
  - 我们每天 6 点多到市场，发现好吃的水果，我们会先买下来。然后发起团购卖出去。
  - 价格变动是一级市场传导到二级市场、三级市场，再到水果店。我们每天会跑一级市场询问价格，根据市场情况随时调整售卖价格。
  - 真诚的目的是什么？为了获取信任。如何快速获取信任？「移木建信」
  - 通过一个小的承诺，并快速实现承诺，让大家觉得你是言而有信之人。
  - 通过爬虫快速筛选出最新、有效的模版/选题，然后去模仿超越。用这种方式我爆了非常多的内容。
  - 单日最高交易额破 9000+
  - 40 天从 0 到 1 建立起 3 个水果团购群
  - 现在非水果旺季，用户月复购率仍在38%
  - 下面是我 0 粉账号做到了 1.5 万赞。
  - 粑粑柑（我们 7.6 元/斤，水果店 12 元/斤，连锁超市 9.68 元/斤）
  - 小台芒（我们价格 9.7 元/斤，超市 11.68 元/斤）
  - 伦晚（我们 6.65 元/斤，超市 9.98 元/斤）
  - 做了之后发现，宝妈做更有优势，不论是拍照引流、微信群运营等等，比男同胞有太多优势。
  - 做 C 端目的是为了知道团长是怎么干的，才能更好服务他们。
  - 我把控供应链，做好文案、卖点、素材，而你只需要负责引流、积累自己的私域、维护自己的客户。
  - 极端情况出现进价比售价高... 我对产品宁缺毋滥，宁可不卖，也不会卖出质量差的水果。
- 'no': 2
  name: Etsy注册与运营 —— 全维度模拟真实人设的概率博弈
  points:
  - '**为什么需要这个概念？**'
  - '- Etsy风控极严，单一合规（如真实产品）无法抵消多维违规（虚拟卡、服务器IP、重复资料）'
  - '- 国内卖家缺乏海外真实人脉（身份/地址/银行卡/电脑/IP），资料重复率高、环境模拟成本大'
  - '- 购买店铺/资料极高概率因重复导致关联封店，维权无门'
  - '**核心定义**'
  - '- 欺诈分值模型：资料真实度/IP纯净度/卡段重复率/产品合规度/运营异常度多维加权打分，超临界值即封店'
  - '- 全维度向‘真实正常用户’无限逼近：真实海外身份+纯净动态住宅IP+指纹浏览器环境+小众卡段虚拟卡/收款卡+伪原创手工图片+验证器双重认证'
  - '**关键性质**'
  - '- 概率论本质：风控非单一因素决定，唯有全维度降低欺诈分至安全阈值以下'
  - '- 产品合规主观性：‘手工/原创’定义权在审核人员主观判断，唯一策略是‘自我拍摄制作全过程’构建证据链'
  - '- 生命周期分级审核：首单/3-4单/10单/30单/百单/千单等节点阶梯式复审，30单前为高危期'
  - '- Plaid验证壁垒：美区强制Plaid验证，主流虚拟收款账户（万里汇/PingPong等）均无法通过，美区注册近乎不可行'
  - '- 收款账户‘以真换虚’：初期用亲戚真实海外银行卡过验证，店铺稳定（>30单）后切换虚拟收款账户平衡安全与便利'
  - '**典型例子**'
  - '- 注册全流程11步SOP：检测IP货币一致性→邮箱注册→Sell on Etsy向导→设置店铺信息→上传伪原创产品（主图含制作过程）→填写身份地址→配置虚拟收款→上传证件→绑定虚拟信用卡→配置验证器2FA→保存备用码'
  - '- 网图伪原创元数据重构：下载网图→改英文文件名→Magicexif写入EXIF（相机型号/拍摄参数/GPS）→上传作主图，配制作视频备存申诉'
  - '- 邮件申诉标准化：后台Contact Support→Email appeal→实情陈述+附件上传制作视频→监控邮箱7-14天→未回复追加二次申诉'
  - '- 新店静默养号7天：注册完成完全不动放置7天，未暂停再装修上品，显著降低初审暂停率'
  - '**边界条件**'
  - '- 无海外可信人脉的国内新手预期收益为负，建议直接放弃'
  - '- 香港公司注册港店成功率低且不稳定，不建议专门注册公司尝试'
  - '- 前期运营红线：日上新≤3款、注册时上传产品尽量不动、前30单严禁刷单/大幅调价/批量打折/超期发货/回复超时'
  - '- 申诉成功仅重置当前风控状态，不免除后续分级审核'
  sources:
  - paper: docs/202303/20230328_174.md
    role: origin
  excerpts:
  - Etsy 平台这套欺诈值打分系统是怎么计算的，我们永远无法得知，但是我们能做的就是在每一个细节上面，越接近一个“正常人”，努力降低这个分数，那么店铺就会越稳定。
  - 最稳定的办法就是一切模拟正常人的行为...让这位亲戚在澳大利亚开一台电脑...用这个亲戚的驾照照片...银行卡...信用卡去注册店铺...用远程操控的方式操作这台电脑。
  - 店铺注册有六个要点：1.干净的 IP；2.模拟当地的电脑环境；3.真实的资料；4.干净的付款卡；5.干净的收款卡；6.“原创”产品的图片。
  - 新店创建完成后，我们一般什么都不操作，放置 7 天，7 天后如果一切正常，那么就可以开始店铺装修，上传产品等正常操作。
  - 注意，不是我们自己判断产品是否符合标准，最重要的是要拍得让他知道我们的产品是符合标准的。
  - 那么最简单的办法就是能把产品的制作过程拍下来，然后作为主图。同时，最好保留一份产品制作视频，有利于后期触发审核时申诉。
  - 如果使用的是网图（网络上找的图片），注意要修改图片的名称，并使用工具修改或者增加图片的元数据。图片元数据修改工具可以用 Magicexif。
  - 建议注册 Etsy 店铺时使用动态住宅 IP...因为这样的 IP 是最干净的。
  - 同时注意，使用 IP 前，先检查 IP 是否属于目标国家，并且可以用这个网站（scamalytics.com/ip）看 IP 的垃圾值是否过高，绿色提示最好，黄色一般，红色直接不要用。
  - 使用前一定要查卡头，卡头必须和注册国家一致。比如注册的是美国店，那么卡头也必须是美国的。
  - 使用这个链接（bincheck.io），输入虚拟卡号的前 6 位查询是属于哪个国家的。
  - 美区的 Etsy 因为需要过 plaid 验证，所以暂时没有好的方案来收款。
  - 现在不建议注册美国地区的 Etsy，会触发 plaid 验证，而市面上的虚拟收款账户暂时基本都无法通过 plaid 验证。
  - 使用指纹浏览器软件，建议使用 adspower 或者 Hubstudio。
  - 不建议使用手机短信的方式来验证，因为如果你用的是国外手机号，忘记续费的话，就收不到短信，会导致店铺无法登录。
  - 验证器软件是在手机上的，如果手机丢失，或者恢复出厂设置了，那么数据也会丢失，无法恢复。所以建议也要把验证时的二维码截图保存下来。
  - 或者也可以使用这个软件：enpass，是个密码管理软件，也支持保存这种一次性验证码，可以绑定云盘...
  - 风控是一个概率问题，不是简单的“是”或者“不是”的问题。有条件就尽量接近真实，如果没条件就要接受有被封的可能性，没人能肯定这么做是封还是不封。
  - 第一，这是个很主观的定义，因为我们都不是 Etsy 审核人员，所以我们怎么认为并不重要，重要是 Etsy 审核人员怎么认为。
  - 一般来说，店铺出了 30 单之后，就是比较稳定了。
  - 即使申诉成功，并不意味着你的店铺就可以一劳永逸了。Etsy 会在店铺出首单，三四单，十单，三十单，百单，甚至千单左右都会再次审核。
  - 解决方案就是：可以在店铺开下来并运营一段时间后，把收款卡改为虚拟收款卡，比如万里汇这一类的，那就能解决税费...和收款...的问题。
  - 我的回答是：不建议。原因如下：1.使用国内资料是无法注册 Etsy 的。2.即使你有国外的资料，那么也无法保证注册成功。3.即使注册成功了，因为这个平台极高的风控，店铺依然很容易被暂停甚至封店。
  - 如果你没有海外的朋友，那么就不要开始了。因为一旦开始，你就要进入开店，封店的恶性循环之中，最后疲惫地放弃这个平台，精力和金钱都损失，何必呢？
- 'no': 3
  name: 小程序多端矩阵 —— 关键词即流量、零边际成本躺赚的工具型产品模型
  points:
  - '**为什么需要这个概念？**'
  - '- 独立站/公众号依赖SEO/推荐算法获客成本高、不稳定，工具类产品需求稳定但分散在各平台搜索入口'
  - '- 单平台流量有上限且规则多变，需多平台分发规避单点风险、最大化搜索流量收割'
  - '- 非技术/弱技术创业者需要低维护、可复用、高杠杆的‘睡后收入’载体'
  - '**核心定义**'
  - '- uni-app一次开发多端发布（微信/支付宝/百度/QQ/快手/字节/H5），账号矩阵规避单平台限额（如支付宝单号限10应用）'
  - '- 关键词即流量：工具名/服务直达嵌入长尾高搜索指数词，依托平台内部搜索分发实现‘搜即得、用即走’免费精准流量'
  - '- 评级飞轮：支付宝C/B/A/S级评级决定关键词数量（C级5个/S级20个+特别加权）与流量分发，运营动作（创建服务/品牌认证/繁星计划）提升评级形成正向循环'
  - '**关键性质**'
  - '- 平台付费意愿差异：支付宝用户心智‘要花钱’付费率8-15%无iOS限制，微信仅4-6%受限iOS虚拟支付，百度/快手/字节限制虚拟支付或强制流量主'
  - '- 零边际成本躺赚：高频刚需非内容消耗型，需求稳定受宏观影响小，uni-app多端复用后维护成本极低（客服周<2h），单次开发换长周期复利'
  - '- 首单付费验证正向循环：赚到第一块钱/获首个付费用户是验证真需求唯一试金石，首单激励支撑长期迭代扩大矩阵'
  - '- 合规是生存底线：涉及UGC图文处理类必须接入平台指定内容审核接口（微信/支付宝/百度/QQ均强制），否则必因违规投诉或巡检下架'
  - '- 平台红利窗口期差异：支付宝黄金期（付费强/评级透明/客服友好）、百度深坑（2000元押金锁死现金流）、QQ仅前两周红利期（占后续半年流量半数）、字节/快手收紧下架风险高'
  - '**典型例子**'
  - '- 作者全平台汇总：3个支付账号（2支付宝+1微信）月睡后收入稳定4000+，年化约5万，十几款工具矩阵验证商业闭环'
  - '- 支付宝付费转化率8-15%显著高于微信4-6%，且无iOS支付限制'
  - '- 百度2000元押金导致单应用年收入<2000元时提现额为0，实测对长尾开发者极度不友好'
  - '- QQ前两周流量≈后续半年自然流量总和，确认红利期幅度巨大但无持续运营机制'
  - '- 微信生活号资质复用：十几款小程序省认证费约1.5万+，打通union_id用户体系'
  - '- 年综合运营成本≤5000元（含注册公司/代记账/服务器/数据库/企业网银），零基础学习20h/首应用开发20h/熟练后单应用5h'
  - '- 微信开发者工具调试效率碾压其他端：体验最佳/工具链完善，支付宝‘不能传图片’/百度兼容性差/QQ生态不全'
  - '**边界条件**'
  - '- 仅适用高频刚需、非内容消耗型、标准化程度高的工具类产品（如图片压缩/格式转换/水印去除）'
  - '- 需具备基础开发能力或学习意愿（零基础20小时上手uni-app），纯小白存在学习曲线陡峭风险'
  - '- 推广获客是独立小程序变现主要瓶颈，开发容易推广难，需依托平台搜索流量而非自带流量'
  - '- 百度押金/字节下架等平台规则变动风险高，需集中资源深耕支付宝+微信、浅度布局QQ红利期'
  sources:
  - paper: docs/202303/L8sxdC6wYorZO1xVgNbc39L4nvf.md
    role: origin
  excerpts:
  - 利用业余时间，开发了十几款小程序，累计10万+用户，变现5万+
  - 因为每个支付宝账号只能创建10个小程序，所以需要多个支付宝账号怼量
  - 使用uniapp开发一次即可，uniapp还有插件市场，插件可以直接导入使用。对了，他还可以直接发布h5。
  - 基本每个工具，就是一个关键词。
  - 小程序的名字，自带流量，取名字很关键。
  - 服务直达
  - 设置搜索关键词...关键词设置的个数跟小程序的评级有关系
  - 敲黑板：这个很重要，一定要创建一个 “小程序服务”，在搜索关键词时，这个权重很大。
  - 从数据上看，支付宝的付费比例在8% -15%左右；微信付费比例在4%-6%左右；
  - 非官方分析：支付宝给人的印象，就是要花钱的，所以付费比例更高；
  - 支付：无限制，安卓、ios都可以发起支付。（估计以后会有变化）
  - 支付：只能对安卓进行虚拟产品支付，IOS不能发起支付，只能走流量变现，重要！！
  - 关键词设置的个数跟小程序的评级有关系。比如刚上架时，是C级，那么最多只能设置5个关键词。 B级10个，C级15个，S级20个
  - 小程序的评级越高，给的流量越多，S级还有特别加权。
  - 大坑：新开的支付商户号，必需预留2000的退款押金，也就是小程序的收入在2000块以内，是不会给你提现的，官方给的留有是：为了避免退款失败，需要自己预留账户余额，但是设置的时候，这个余额，不能低于2000！
  - 特点：小程序商家有红利期；刚上架的前两周，会给推荐一波流量。具体到什么程度呢？就是前两周的流量，可能是你后面半年的流量。
  - QQ支付，就是个套壳，真的只是个壳。
  - 微信平台建议创建生活号，可以复用生活号的资质，注册最多50个小程序，免去很大一部分认证费用，每次300。
