life_analogy:
- 想象营业执照年报是**企业的‘年度体检+成绩单公示’**：
- '- **法定体检窗口（1.1-6.30）** = 每年固定的体检月，过期不补检'
- '- **经营异常名录** = 体检报告未按时交，被标记‘异常’挂号'
- '- **严重违法失信名单（黑名单）** = 连续3年不交报告，直接吊销‘健康证’，拉入黑名单'
- '- **多部门联合惩戒** = 黑名单一出，银行拒贷（查征信）、出入境拦截（查黑名单）、招投标拒标（查资格）、法人任职受限（查档案）'
- '- **自主网上年报SOP** = 官方提供的‘免费自助体检通道’，按步骤点点鼠标10分钟搞定'
- '- **第三方代理收费100元** = 黄牛倒号挂号费，明明免费自助挂号却哄你花冤枉钱'
- '- **截图留档** = 体检完自己留存一份电子报告单，防医院系统丢数据赖你‘没体检’'
- 就像个人不按时体检、不拿报告单会耽误治疗甚至影响保单理赔，企业不年报、不留档会触发信用破产的连环核爆。
summary:
- concept: 营业执照年度报告（年报）
  desc: 市场主体法定年度公示义务，每年6月30日前完成，个体户同责
- concept: 经营异常名录
  desc: 年报逾期初级惩戒，信用‘黄牌’预警，3年内可补报移出
- concept: 严重违法失信企业名单（黑名单）
  desc: 异常名录满3年未履行义务自动转入，触发多部门联合惩戒，信用‘死刑’
- concept: 年报逾期处罚升级链条
  desc: 未报→异常名录→3年→黑名单→多维限制（融资/出行/招投/任职）→信用破产
- concept: 自主网上年报SOP
  desc: gsxt.gov.cn官网：选地域→登录→填年度报告→填联系人/网店/股东/资产→公示→截图留档
- concept: 年报关键填报项自查法
  desc: 从业人数含本人≥1；资产状况个体户可填0/估算；网店信息如实勾选有无
- concept: 地址异常风险
  desc: 虚假/借用/购买地址遇现场核查（下户看点）失败，直接列异常需变更地址解除
- concept: 系统留档截图
  desc: 政府公示系统存稳定性风险，公示确认页截图为唯一自证证据，可找管理员纠错
- concept: 自主年报成本优势
  desc: 操作标准化门槛低，零成本自主完成，替代100元/次第三方代理‘智商税’
- concept: 个体户零申报合规性存疑
  desc: 连续3年零申报易被判‘僵尸企业’触发重点监管，年报金额≠纳税申报，写金额不直接扣税但需口径一致
exercises:
- 'no': 1
  title: 模拟年报全流程实操演练
  contents:
  - 场景：你是一家‘广东省’注册的个体户经营者，无实体网店，无雇员，无标准资产负债表，需完成2023年度年报。
  - 任务：
  - 1. 打开国家企业信用信息公示系统（gsxt.gov.cn），选择地域为广东省
  - 2. 登录/注册账号，进入‘年度报告填写’界面
  - 3. 填报‘联系人信息’（自己手机/邮箱）
  - 4. 填报‘网站或网店信息’：勾选‘否’
  - 5. 填报‘从业人数’：填 1（含法人自身）
  - 6. 填报‘资产状况’：填 0 或按实际经营资产估算填报
  - 7. 点击‘预览并公示’ → ‘确认公示’
  - 8. 对最终公示成功页面进行全屏截图，重命名为‘2023年度年报公示截图_营业执照注册号_日期’保存
  - 回答问题：
  - '- 若系统提示‘该年度已年报’，但你未操作，如何凭截图向市监局申诉？'
  - '- 为什么‘从业人数’至少为1而不能填0？若填0会触发什么风控规则？'
  - '- 个体户无会计报表，资产状况填‘0’与‘估算金额’在监管审查中有何本质区别？'
- 'no': 2
  title: 年报逾期风险推演与止损决策
  contents:
  - 案例：某公司法人因疏忽，2020、2021、2022连续三年未年报，2023年3月发现异常。
  - 任务：
  - 1. 绘制该企业从‘正常’到‘信用破产’的处罚升级时间轴，标注关键节点（列入异常名录日期、转入黑名单临界点、多部门联合惩戒生效日）
  - 2. 分析：法人此时想注册新公司、申请房贷、出境旅游、参加政府采购投标，分别会遇到什么具体阻碍？
  - 3. 制定止损方案：当前（2023年3月）还能否通过补报年报+申请移出异常名录阻断黑名单转入？具体操作路径是什么？
  - 回答问题：
  - '- 为什么‘3年’是处罚升级的硬性临界点？背后的行政法逻辑是什么？'
  - '- 若企业地址早已变更但未工商变更登记，补报年报时填新地址还是旧地址？会触发什么后果？'
  - '- 黑名单移出程序为何‘复杂、周期长、极难完全消除负面影响’？'
- 'no': 3
  title: 年报填报避坑自测题（判断正误并说明理由）
  contents:
  - 1. 【 】个体户年报‘营业收入’填0，连续三年填0会直接导致营业执照被吊销。
  - 2. 【 】年报填报的‘资产状况’必须严格按照会计准则编制的资产负债表数据填写，个体户无报表则必须聘请代账会计填报。
  - 3. 【 】‘从业人数’仅指雇佣的员工数量，不包含经营者/法定代表人本人。
  - 4. 【 】企业无网店，年报‘网站或网店信息’模块可直接跳过不填。
  - 5. 【 】年报完成后，系统跳出‘公示成功’提示即可关闭页面，无需截图留档。
  - 6. 【 】第三方代理机构收费100元/年代报服务，属于必要合规成本，建议小微企业购买以规避操作风险。
  - 7. 【 】使用虚拟注册地址（地址挂靠）的企业，年报时填挂靠地址即可，无需担心‘下户看点’核查。
  - 8. 【 】年报数据（如营业收入）与税务纳税申报数据口径必须一致，但年报填报本身不直接产生纳税义务。
  - 回答要求：逐条判断正误，并引用素材中的核心定义、边界条件或实证发现作为依据说明理由。
