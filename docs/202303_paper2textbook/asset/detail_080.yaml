learning_targets:
- 理解星探模式与自营IP模式的核心差异及适用边界
- 掌握业务属性同构效应的识别与诊断方法
- 掌握低谷期介入策略建立深度商业信任的实操路径
- 能通过角色分离决策法明确自身定位（决策vs执行）
- 建立'出去看看-落地闭环'的强制转化机制
- 践行'付费融入-主动输出'的社群成长飞轮模型
