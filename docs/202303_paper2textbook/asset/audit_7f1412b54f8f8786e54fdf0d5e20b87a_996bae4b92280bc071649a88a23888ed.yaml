unsupported_claims:
- location: ch56.3.3
  claim: 单纯资金投机不属于五大差范畴，不具备可持续性与抗风险性
  reason: 素材[P049]中未明确界定'单纯资金投机'的定义，也未直接论述其不属于五大差范畴，仅隐含在'传统买币投机模式风险极高'表述中
- location: ch56.3.3
  claim: 认知差建立需大量高密度输入（量变引发质变），迷茫根因常为勤奋未达标
  reason: 素材[P049]未提及'量变引发质变'或'勤奋未达标'等表述，该论断属于全书推演而非素材直述
- location: ch56.4.2
  claim: ChatGPT联网插件模式下，传统SEO体系可直接迁移生效
  reason: 素材[P_IkKO]仅表述'也有一种可能就是联网后...原先搜索引擎SEO那一套能继续奏效'，属推测而非验证结论
- location: ch56.5.2
  claim: 边际成本不可能归零的核心原因是PS修正环节需要人类审美判断
  reason: 素材[P_XrPA]虽陈述'边际成本不可能到0'及'PS兜底'，但未明确论证'人类审美判断'为核心不可替代原因
