unsupported_claims:
- location: 59.4 关键推导：信息点覆盖原则的量化执行
  claim: 识别率 = f(定位点完整度, 对齐点完整度, 版本信息完整度, 数据码字完整度, 纠错等级冗余度) 及五个模块的详细定义与公式建模
  reason: 素材原文未给出公式细节，仅提及“信息点覆盖原则” 与“一两个点的绘制错误，就会导致二维码的不识别”。该量化模型为基于 ISO/IEC 18004:2015
    标准的理论推导，属于教材编写时的补充扩展，非素材直接支撑。
- location: 59.8 从业者稀缺性注
  claim: 市场上会制作原创艺术二维码的设计师数量极少，大概只有几千人
  reason: 该“几千人”估值为作者基于行业圈层观察的主观判断，缺乏第三方行业报告或招聘平台数据佐证。建议后续研究引用 BOSS直聘/脉脉/猎聘等平台相关岗位发布量，或行业白皮书数据进行交叉验证。
