unsupported_claims:
- location: '1.3'
  claim: 素材中提炼了四大支柱原则，构成了实用主义的骨架
  reason: 素材中仅为张达达的《30个知识管理技巧》一文，未明确提炼"四大支柱原则"，系全书作者综合归纳
- location: '1.4'
  claim: 问题导向输入法（来源：《知识管理实战笔记》）
  reason: 素材中张达达技巧10提到"看看你现在遇到什么问题，那么围绕着这个问题去寻找知识"，但未系统阐述"梳理当下问题清单、拆解卡脖子子问题、定向收集、即时入库、动态降级"完整流程
- location: '1.5'
  claim: 本源概念优先（来源：《知识管理实战笔记》）
  reason: 素材中张达达技巧11提到"把本源概念搞懂，放到知识库中即可，有点像种树，不要关注叶子，而是要看树干和树枝"，但未给出提示词工程/知识管理/流量获取/电商选品四大领域的本源与表层对照表
- location: '1.6'
  claim: 多工具协作生态（来源：《知识管理实战笔记》）
  reason: 素材中张达达技巧12提到"不要纠结于用一种工具，而是多个工具结合不同的用处"，但未给出核心库/随手记/大文件仓/阅读标注/自动化中转五大功能定位及推荐工具表
- location: '1.7'
  claim: 标签与双向链接多维归类（来源：《知识管理实战笔记》）
  reason: 素材中张达达技巧2、8、22提到标签用法，但未阐述MOC索引页动态聚合、受控词表建设、网状关联结构等系统性内容
- location: '1.8'
  claim: 帕累托迁移策略（来源：《知识管理实战笔记》）
  reason: 素材中张达达技巧19完整引用了该策略原文，但"约50%内容不用动"、"20%核心资料产生80%价值"等量化结论系全书作者推演
- location: '1.9'
  claim: 知识内化闭环四阶段（来源：《知识管理实战笔记》）
  reason: 素材中张达达技巧16提到"只有通过回顾、记忆、实践、输出才能慢慢转化成你自己的知识"，但未展开RPA自动化学习闭环、分级内化策略、速查手册外包工具型知识等实操细节
- location: '1.10'
  claim: 碎片信息结构化捕获流四大流水线（来源：《知识管理实战笔记》）
  reason: 素材中张达达技巧21、23、24提到群聊转发群、听书录音转文字、Flomo记随想，但未系统构建音频/群聊/灵感/网页四大流水线的标准化SOP、工具推荐清单、元数据自带机制
- location: '1.11'
  claim: 长文精华提炼存储法操作模板（来源：《知识管理实战笔记》）
  reason: 素材中张达达技巧25提到"挑一个对你最有启发的，总结以下再放进去，长文可以放个链接"，但未给出核心观点/原文定位/感悟迁移/来源链接四要素模板
- location: '1.12'
  claim: 分阶段学科沉淀四层融合存储（来源：《知识管理实战笔记》）
  reason: 素材中张达达技巧15提到"要从初阶、进阶、高阶分阶段进行学习和记录，还有实践"，但未细化各阶段内容侧重、存储形式、认知负荷曲线匹配等设计
- location: '1.12'
  claim: 理论实践融合存储（来源：《知识管理实战笔记》）
  reason: 素材中张达达技巧4完整引用原文，但RPA防封策略节点下理论原理/实操参数/踩坑案例/迁移建议四维融合结构系全书作者构造
