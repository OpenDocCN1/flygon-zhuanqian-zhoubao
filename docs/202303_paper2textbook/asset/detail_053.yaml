  name: 京东令牌价供应链 —— 用“内部进货价”撬动“零售价差”的套利模型
  points:
  - '**为什么需要这个概念？**'
  - '- 家电代下项目利润空间完全依赖于“令牌价（进货价）< 前台零售价”的价格剪刀差'
  - '- 普通消费者无法直接享受线下加盟商的内部进货价，存在信息不对称套利空间'
  - '- 需要稳定、全品类、可查询的令牌价渠道作为业务核心护城河'
  - '**核心定义**'
  - '- 京东线下加盟商（实体店主）专享的内部进货价格体系，通常为前台价的50%-70%'
  - '- 如TCL 85Q10G电视：前台价16999元，令牌价8999元，代下报价9999元，单笔毛利1000元'
  - '- 价格受品牌区域保护政策影响，不同地区令牌价不同，需按收货地址匹配查价'
  - '**关键性质**'
  - '- 供应链决定下限：稳定低价全品类的令牌价渠道是业务生存根本（解决“有货卖、有利润”）'
  - '- 官方履约建信任：京东自营物流+品牌方安装+400官方售后+正规发票，消除“非正规渠道”信任顾虑'
  - '- 团队裂变决定上限：从个人单干到110人团队、年营收300万，靠代理模式放大而非单干'
  - '**典型例子**'
  - '- TCL 85Q10G电视单品套利：前台价16999 vs 令牌价8999，代下售价9999，毛利1000元/单'
  - '- 作者路径：599元拜师学渠道→闲鱼零成本引流→组建代理团队→年营收300万'
  - '**边界条件**'
  - '- 政策风险极高：本质抢夺京东线下加盟店与线上自营生意，京东大概率收紧政策堵漏'
  - '- 令牌价不稳定：政策常变动、区域保护导致价格差异、需实时查价系统维护'
  - '- 重资产倾向：高客单价家电涉及售后、安装、物流复杂度，非纯轻资产模式'
  sources:
  - paper: docs/202303/20230328_074.md
    role: origin
  excerpts:
  - 加盟了京东线下实体店的店主往往会有一个内部账户享受京东家电的进货价，也就是行内人士所说的令牌价。
  - 京东自营前台官方价格是 16999，而我们下单所需要金额只需要 8999，相当于前台价格的 1/2。
  - 供应链源头决定下限，团队裂变决定上限
  - 官方履约体系是信任转化的关键锚点
- 'no': 3
  name: 私域高客单非标品模型 —— 以“信任溢价”覆盖“价格敏感度”
  points:
  - '**为什么需要这个概念？**'
  - '- 农产品/茶叶等非标品无统一定价、无绝对头部品牌，用户决策依赖信任而非比价'
  - '- 微商/电商渠道信任成本高，私域熟人/强关系链天然具备信任转化优势'
  - '- 需要一套“选品-人设-锚定-分销”组合拳打通私域高客单成交闭环'
  - '**核心定义**'
  - '- 选品四维筛选：①掌握核心产地一手货源 ②无统一定价/无头部品牌 ③非标品依赖信任转化 ④高复购/强社交属性'
  - '- 人设锚定信任：打造“好女婿/丈母娘茶园”等真实姻亲关系人设，自带源头/无农药/直发背书'
  - '- 价格锚定策略：上架极高价SKU（狮峰龙井4500元/斤）做对比，降低主推款（1200/800元）心理门槛'
  - '- 极简SKU对抗选择悖论：只卖单一优良品种（龙井43）+两级等级（头采/二采），拒绝雨前茶/白茶干扰'
  - '**关键性质**'
  - '- 信任溢价>价格敏感：真实人设+源头溯源+工艺透明构建信任，覆盖用户对“贵/假/陈”的恐惧'
  - '- 工艺差异化护城河：榨香工艺（多1-2道工序提香降水分）实现“更拢更细更干”，兼顾重量诚实度'
  - '- 强关系分销>弱关系带货：大公司员工内部群（高信任/精准人群）ROI远超大博主公域推广'
  - '- 真实感内容生产：手机随手拍实景+口语化文案+承认不足（如不卖手工茶），构建“茶农本分感”'
  - '**典型例子**'
  - '- 春茶预售20天卖20万+，月入40万；头采成本700-800元/斤，零售1200元，毛利33%-50%'
  - '- 新昌越州龙井：年产量占全国30%-40%，茶机研发领先1-2代，机炒品质稳定性>西湖手工表演'
  - '**边界条件**'
  - '- 供应链不可控：必须掌握核心产地一手货源，否则无法兑现“源头直发/品质保真”承诺'
  - '- 人设不可复制：好女婿/丈母娘人设依赖真实姻亲关系，非通用模板可复制'
  - '- 平台生态锁定：微信小商店/个人号/群为主阵地，快团团等三方工具信任感较弱'
  - '- 行业造假红线：水分增重/陈茶冒新/品种掺假/产地造假四大坑，买家无鉴别能力只能信人'
  sources:
  - paper: docs/202303/20230328_136.md
    role: origin
  excerpts:
  - 非标农产品私域成交核心 = 信任溢价 > 价格敏感度
  - 选择悖论在私域高客单价中的负向放大效应
  - 私域分销‘强关系内部群’效率远超‘弱关系公域大V’
  - 茶叶行业‘水分/陈茶/品种/产地’四大隐性造假铁律
  - 我的店铺里上架了狮峰龙井（4500 一斤），不是为了卖，是为了做对比，感受的我的茶叶的性价比
  - 图片尽量用自己拍的图，不要做效果，手机拍的就行，给人感觉实在，诚实，做出茶农的本分感
- 'no': 4
  name: 同城水果团购模式 —— “源头现采+移木建信+爬虫选题”三位一体轻资产闭环
  points:
  - '**为什么需要这个概念？**'
  - '- 水果具备刚需/高频/强复购属性，天然适合私域团购，但普通人缺乏供应链与流量入口'
  - '- 微商依赖熟人、社区团购受地域限制，需要一种低门槛、大想象空间、高复购的新模式'
  - '- 小红书0粉友好、用户画像匹配、图文门槛低，是新手最佳公域流量入口'
  - '**核心定义**'
  - '- 公域种草（小红书爬虫选题+多路径引流）→ 私域成交（微信群/快团团）→ 源头履约（新发地一级批发市场现采现发）'
  - '- 移木建信：设定小承诺（群满xx人发红包）并快速兑现，以“言而有信”行为建立陌生人信任基础'
  - '- 源头现采：用户昨天下单→今天早市现采最鲜货→当天发出，零库存、价格比零售低20%+'
  - '- 爬虫选题法：采集低粉高互动爆款笔记→提取模版要素→1:1复刻超越，稳定制造爆款'
  - '**关键性质**'
  - '- 刚需高频强复购：非旺季月复购率38%，用户养成“静默下单”习惯，信任积累带来复利'
  - '- 一级批发源头是核心护城河：掌握定价话语权、规避行业坑（如阿克苏苹果礼盒套路）、量大才能锁成本'
  - '- C端验证→B端放大：亲自做C端理解团长痛点/验证选品/获反馈，建SOP后赋能B端团长规模化扩张'
  - '- 宁缺毋滥强信任：进价>售价时亏本退款/不发次货，短期损失换长期“品质把关人”人设与高信任资产'
  - '**典型例子**'
  - '- 新手40天：建3群、单日破9000元、最快日建群200人出5单、0粉号最高1.5万赞、月复购38%'
  - '- 价格锚定：粑粑柑团购7.6元 vs 水果店12元/超市9.68元；小台芒9.7元 vs 11.68元；至少低20%'
  - '- 宝妈优势：拍照引流（审美/耐心）、群运营（共情/碎片时间）、信任建立综合表现优于男性'
  - '**边界条件**'
  - '- 供应链依赖强：无一级批发市场地缘优势/亲属资源，极难复制“现采现发+价格优势”'
  - '- 非标品损耗高：物流包装SOP（分层/垫纸/冰袋）、售后秒赔为标配，运营重度高'
  - '- 平台红利窗口期：小红书扶持期约1-2年，红利过后流量成本上升，方法论需迁移'
  sources:
  - paper: docs/202303/20230328_156.md
    role: origin
  excerpts:
  - 水果赛道具备‘刚需+高频+强复购’的私域最优属性
  - 一级批发市场源头供应链是核心护城河
  - 小红书‘0粉爆款’红利期是普通人流量突围的最佳窗口
  - 先做C端验证模型，再做B端规模化供应链
  - 移木建信：通过一个小的承诺，并快速实现承诺，让大家觉得你是言而有信之人
  - 进价高于售价时‘亏本退款/不发货’反而强化信任资产
- 'no': 5
  name: 研究-模仿-超越（RMS模型） —— 普通人低成本跨越认知鸿沟的标准化学习路径
  points:
  - '**为什么需要这个概念？**'
  - '- 面对海量商业案例，新手无从下手、易陷入“学了不会、做了不成”的知行差距'
  - '- 需要一套结构化、可复用的拆解框架，将他人成功经验转化为自己的可执行SOP'
  - '- 核心主张：营销最好的方法是找竞对足迹复制，最聪明做法是做过的事、学最佳案例、再超越'
  - '**核心定义**'
  - '- 研究：挖掘痛点→查清对手注册时间/收录/流量来源/盈利模式/商业模式要素'
  - '- 模仿：像素级复制执行细节（一帧一帧比对图片/文案/布局/话术/排品），学会取舍'
  - '- 超越：在模仿基础上创新突破，结合自身资源禀赋形成差异化优势'
  - '**关键性质**'
  - '- 结构化拆解框架：七步模板（拆解理由/赚钱逻辑/付费动机/产品推广/营销方法/执行原则/RMS落地）'
  - '- 赚钱逻辑公式化：目标收入 = 利润 × 单价 × 转化率(5%) × 曝光人数，量化拆解可行性'
  - '- 跨案例迁移：提炼通用规律（流量获取/私域运营/内容生产/直播模型）形成方法论体系'
  - '- 内容生产三阶跃迁：抄（直接抄爆款）→ 杂交（多源重组）→ 原创（沉淀方法论），配合素材库实现“捡钱式”变现'
  - '**典型例子**'
  - '- 小红书无货源：对标账号像素级模仿+长尾词布局+垂直账号，低成本获精准流量'
  - '- 视频号矩阵：30-60号搬运测品→直播升级→付费流量→私域积累→产品裂变五步法'
  - '- 直播排品：引流9.9/爆品299/利润品/附属品价格梯队+憋单拉停留模型+随心推打成交模型'
  - '**边界条件**'
  - '- 红利期迁移律：平台红利周期1-2年，看到详细教程时红利已过，核心能力在于“嗅觉+执行+迁移”'
  - '- 幸存者偏差：仅拆解成功案例忽略失败教训，需结合“五维筛选法”（难度/规则/合规/批量/周期）验证'
  - '- 执行力前置：RMS非知识获取终点，而是行动起点；六十分即冲，最优解成本高且需配得上资格'
  sources:
  - paper: docs/202303/NQrwdjKZ4oOEFpxGD1Hcjc9wnwf.md
    role: origin
  - paper: docs/202303/20230328_021.md
    role: improve
  excerpts:
  - 营销最好的方法：找竞争对手的足迹，然后复制。最聪明的做法是，做别人做过的东西，学习最佳案例，然后再超越。
  - 【研究 模仿 超越】通过挖掘出痛点研究市场上解决这种痛点的对手 查清楚对手的注册时间、收录情况、以及最重要的是他的主要流量是怎么来的、盈利情况接下来就是模仿
    模仿 模仿 学会取舍，在模仿的路途中创新
  - 赚钱逻辑是什么?(目标收入=利润*单价*转化率5%*曝光人数,)
  - 怎么做内容？ 1. 抄 2. 杂交 3. 原创... 卖点锁定了，跟卖点有关的素材都收集起来。收集的素材多了，赚钱就是捡钱，捡钱就是赚钱。
  - 市面上培训课程培训的内容都涵盖在了生财里边...当你把生财的内容研究明白了，自此再也不被割韭菜！
