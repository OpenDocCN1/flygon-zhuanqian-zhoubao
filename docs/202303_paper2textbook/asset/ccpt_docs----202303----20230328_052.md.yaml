paper: docs/202303/20230328_052.md
desc: 该素材是一份详尽的 Midjourney AI 绘画实操手册，系统梳理了从核心操作、付费订阅、Prompt 编写结构与技巧、Blend 图像融合、模型版本选择与分辨率放大策略、全量命令与参数详解（含
  --ar, --chaos, --seed, --stylize, --tile, --video 等）、进阶图生图权重控制、Remix 修图模式、多重提示词权重与负向提示词语法，至免费获取算力的评分机制。作者结合官方文档翻译与大量实战经验、对比图示例，构建了覆盖新手入门到高手查漏补缺的完整知识体系，并倡导通过社区协作持续迭代内容。
concepts:
- name: Prompt 组成三要素
  desc: 定义了 Midjourney 高级提示词的标准结构：Image Prompts（图像参考链接）+ Prompt Text（文本描述）+ Parameters（末尾参数），是控制生成结果的核心范式。
  is_original: false
  excerpt:
  - 更高级的提示词可以包括一个或多个图像 url、多个文本短语和一个或多个参数
  - Image Prompts：（图生图，垫图，都是指这个，可以加入多个图
  - Prompt Text 要生成的图像的文本描述。
  - Parameters 参数改变图像生成的方式。参数放在提示符的末尾。
- name: Remix 重混模式
  desc: 一种实验性功能，允许在变体生成、放大或模型切换时保留原图构图结构，并弹窗修改 Prompt 或参数，实现‘构图固定、内容迭代’的精细化控制。
  is_original: true
  excerpt:
  - 使用 Remix 模式更改提示符、参数、模型版本或其他参数。Remix 将采用初始图像的一般组成，并将其用作新 Job 的一部分。
  - Remix 可以帮助改变图像的设置或光影，演变主题，或实现棘手的构图。
  - 涉及 V1，V2，V3，V4，以及 Make Variations 的按钮，都会先跳出一个文本框，在原有文本的基础上作修改
- name: 多重提示词权重语法
  desc: '利用双冒号 :: 分隔独立概念，并支持在 :: 后添加数值权重（整数或小数）控制各概念影响力，甚至支持负权重实现元素去除，是精细化语义控制的核心语法。'
  is_original: false
  excerpt:
  - 'Midjourney Bot 可以使用 :: 作为分隔符，分别考虑两个或多个独立的概念。'
  - '当使用双冒号 :: 将提示符分隔为不同的部分时，可以在双冒号后立即添加一个数字，以分配提示符该部分的相对重要性。'
  - 不想要的元素，可以去除 通过将权重调为负数实现
- name: Seed 确定性生成机制
  desc: 种子值决定初始噪声场。V4/V5/Niji 模型下，相同 Prompt + 相同 Seed + 相同参数可生成完全一致的图像（确定性）；旧模型仅生成相似图像。Sameseed
    可使初始网格四图共享同一噪声场。
  is_original: false
  excerpt:
  - 模型版本 4、5 和 niji 中使用相同的“prompt + seed + 参数”将生成相同的图像。
  - 模型版本 1、2、3、test 和 testp是不确定的，将产生相似的，不相同的图像。
  - --sameseed 种子值创建一个大的随机噪声场，应用于初始网格中的所有图像。
- name: 图像权重
  desc: 参数 --iw 控制图生图中参考图 URL 对生成结果的影响力大小，默认 0.25，数值越大参考图结构/风格保留越强，是早期模型（V3/Test/Testp）实现图文平衡的关键杠杆。
  is_original: false
  excerpt:
  - 早期的 Midjourney 模型版本可以使用图像权重参数 --iw 来调整图像 url
  - --iw 0.25 是默认值，可变范围为 -10000 ~ 10000
  - 数值越大，则意味着上传的图像会有更大的影响。
methods:
- name: __overview__
  desc: 采用‘官方文档深度解读 + 实战经验补全 + 多版本横向对比图示 + 参数兼容性矩阵表’的编写方法论，将零散的 Discord 指令、参数、模型差异系统化为可检索、可落地的教学手册。
  excerpt:
  - 这是一份基础教程，译自官方手册，加以我自己的经验补充。
  - 全文有一万七千字，上百张示意图。一份文章，完整度超过市面上千元的课程。
  - 不同模型，与可使用的参数，以及参数可变范围一览表
- name: Prompt 结构化编写法
  desc: 将模糊的自然语言描述拆解为：主题、媒介、环境、灯光、颜色、情绪、构图七大维度限定词，并建议使用具体数量词、精确同义词、语义分组（括号/连字符）替代冗长句子，最大化单词影响力。
  excerpt:
  - 一个反常规的思路：描述词不是描述词，而是限定词，你所限定的内容，由 Midjourney 理解并体会表达。
  - 主题：person, animal, character, location, object, etc. 媒介：photo, painting, illustration...
    环境：indoors, outdoors... 灯光：soft, ambient... 颜色：vibrant, muted... 情绪：Sedate, calm...
    构图：Portrait, headshot...
  - 具体的数量词，而非含糊的量词 ‘three cats’（3 只猫）要比‘cats’（猫们）效果更具象
- name: 模型-参数兼容性决策表
  desc: 建立模型版本（V1-V5, Niji, Test, Testp）与可用参数（--ar, --chaos, --seed, --video, --iw
    等）、参数取值范围、默认值的映射矩阵，指导用户根据目标风格快速选择正确模型与参数组合，避免无效尝试。
  excerpt:
  - v4 模型默认参数，以及参数可变范围
  - v5 模型默认参数，以及参数可变范围
  - 不同模型，与可使用的参数，以及参数可变范围一览表
  - 左边一列，是初始生成的影响参数... 右边一列，是影响变化的影响参数... Remix 修改的适用范围也在这里
- name: 分辨率放大策略选择法
  desc: 针对不同模型版本与画面内容（人脸/光滑面 vs 细节丰富），提供 Default U、Light Upscale (--uplight)、Beta
    Upscale (--upbeta)、Upscale to Max、Niji Upscale (--upanime)、Remaster 六种放大路径的差异化选择指南。
  excerpt:
  - 默认的 U 增加分辨率... 平滑地增加细节
  - Light Upscale 少量细节与纹理的放大（也可用于减少细节的使用）
  - Beta Upscale 没有太多额外的细节，比较适合面部和光滑表面的放大。
  - Niji 模型默认的 U... 经过优化，可以很好地使用插图和动漫风格
  - Remaster 将使用 --test 和 --creative 参数将原始图像的组成和更新的 --test 模型的一致性混合
- name: 历史任务复现与迭代流程
  desc: 通过 Job ID（从个人主页、图片链接、文件名、Discord 邮箱表情四大渠道获取）配合 /show 命令调取历史任务，结合 Remix 模式或
    V/U 按钮进行二次创作，解决‘图多找不到、无法续做’的工程化痛点。
  excerpt:
  - 关键在于找到你的历史图片的 Job_ID 一长串的字符
  - 4.4.1 从个人主页寻找 4.4.2 从图片链接寻找 4.4.3 从文件名寻找 4.4.4 用 Discord 的 emoji 表情找
  - 这个功能，可以让你找到你的历史生成图片，然后继续进行后续处理
theorems:
- name: 行动先于完美：低门槛启动即变现
  desc: 作者通过‘航海分享’实践证明：将工具教程标准化、模板化（一键转发/微改），配合社区激励（正反馈、红包），能让零基础新手在极短时间内完成从学习到首单变现的闭环，验证了‘行动起来，就会有好事发生’的商业化路径。
  excerpt:
  - 为了进一步降低圈友们行动的卡点，我将当天分享的全部内容授权给了所有航海的伙伴，用于下场变现。
  - 所有伙伴无论有没有基础，都可以通过一键转发或者小小修改的方式，获得第一桶金。
  - 很多圈友当天变现，拿到了正反馈... 《1 年没赚回门票，2 月航海我赚了 5 倍》
- name: Prompt 本质是‘限定’而非‘描述’
  desc: 核心观点：Prompt 的每个词都是在收缩生成空间的‘限定词’；未被限定的维度模型将‘自由发挥’（随机性大）。因此高质量输出的关键在于主动限定更多维度（媒介、光影、构图等），而非堆砌形容词。
  excerpt:
  - 一个反常规的思路：描述词不是描述词，而是限定词，你所限定的内容，由 Midjourney 理解并体会表达。你所不限定的，它将自由发挥。
  - 自由发挥的内容可能很好，也可能很差，所以，如果你已经有比较好的细节想法，多想一想，把它描述出来
- name: 参数组合需遵循模型兼容性边界
  desc: 并非所有参数在所有模型生效。如 --video 仅限 V1-V3/Test/Testp；--tile 不支持 V4/Niji/Test/Testp；--iw
    仅早期模型支持；Remix 修改参数需在模型允许的‘影响范围’内。忽视边界会导致参数失效或报错。
  excerpt:
  - 视频目前，只在模型版本 1，2，3，test，和 testp 中有用
  - --tile 适用于模型版本 1，2，3 和 5
  - 参数之间必须要能契合搭配，数值在可变范围区间之内。参照之前的参数模型匹配表
  - 在对应影响范围内的参数才能工作
- name: 社区协作式知识迭代模型
  desc: 主张将教程作为开放基础设施：读者在评论区按章节编号补充经验/纠错，作者精选置顶链接，实现‘人人贡献、版版受益’的复利增长，对抗 AI 工具迭代过快导致的单一文档快速过期问题。
  excerpt:
  - 任何文章中对你有所启发的小片段，都可以写一下你在使用过程中的经验心得。
  - 任何你觉得还能补充的地方，都可以写点补充，@我，并写上对应的章节编号。
  - 随着学习的伙伴越来越多，这篇文章也会越来越丰富，直到成为市面上独一无二，最大、最全、最有用的 Midjourney 实用手册！
findings:
- name: V5 模型在自然语言理解与照片级真实感上的质变
  desc: '[evidence] 文中通过大量对比图（如 3.1.1、6.1.2.2）展示：V5 具备极高一致性、原生支持更大分辨率、能精准理解自然语言长句、生成照片级真实材质（皮肤纹理、光影物理），且图生图时更忠实于参考图结构，较
    V4 的‘艺术风格化’倾向有本质飞跃。'
  excerpt:
  - --v 5 模型，该模型具有非常高的一致性，擅长解释自然语言提示，具有更高的分辨率
  - v5 模型的素材融合... 在结构、配色、构成上，都会更接近图片
- name: Chaos 参数控制‘探索-利用’权衡的实证规律
  desc: '[evidence] 通过 ‘watermelon owl hybrid’ 固定 Prompt、从 Chaos 0 到 100 的逐级对比图（5.3.1-5.3.3）实证：低值（0-10）输出高度收敛、构图相似；中值（25-50）引入构图/色调变体；高值（>80）产生极度抽象、碎片化、甚至语义崩解的图像，验证了其控制初始网格多样性的核心机制。'
  excerpt:
  - 高 chaos 值将产生更多不寻常和意想不到的结果和组成。低 chaos 值具有更可靠、可重复的结果。
  - 5.3.1 低 chaos 数值演示... 5.3.2 高 chaos 数值演示... 5.3.3 超高 chaos 数值演示
- name: Stylize 参数在 V4 与 V5 中呈现‘反向’美学曲线
  desc: '[evidence] 对比图显示：V4 下 --s 从 0 到 1000 画面由‘简笔画/草稿感’逐渐变为‘高饱和、强构图、重艺术加工’的精美插画；V5
    下 --s 提升反而使画面从‘照片级写实’退化为‘绘画感、模糊、失真’，提示 V5 默认审美已内化，过度风格化反损真实感。'
  excerpt:
  - 低风格化值生成的图像与提示符紧密匹配，但不太具有艺术性。高风格化值创建的图像非常艺术，但与提示符联系较少。
  - 5.7.2 风格参数在 v4 模型的效果演示... 5.7.3 风格参数在 v5 模型的效果演示
- name: Quality 参数非‘越高越好’，需按题材匹配
  desc: '[evidence] V4 松林测试与 V5 牡丹测试（5.4.1-5.4.2）显示：--q 2 虽细节最多，但建筑/植物纹理可能过度渲染显脏；--q
    0.25 抽象手势感更强；结论：建筑/写实需高质量，抽象/草图宜低质量，需实测选优。'
  excerpt:
  - 高质量的设置并不总是更好。有时候，低质量的设置可以产生更好的效果，这取决于你想要创建的图像。
  - 低质量的设置可能是最好的手势抽象表现。高质量的值可以改善建筑图像的表现，这与细节有关。
  - 5.4.1 v4 版本的木森林测试... 5.4.2 v5 版本的牡丹花测试
- name: 评分机制可将边际成本降为零的运营发现
  desc: '[claim] 作者宣称通过官网 Ranking 页面每日评选喜爱图片，前 1000 名可得 1 小时免费 Fast GPU 时间，实测收到 Bot
    赠送消息，证明存在一条‘零成本获取算力’的长期白嫖路径。'
  excerpt:
  - 每天，排名前 1000 的图像评分者可以获得一小时的免费 Fast 模式时间。
  - 如果你是当天的最高评分者之一，当你获得小时数时，就能收到来自 Midjourney Bot 机器人的赠送时长消息。
  - Web 评分入口：https://www.midjourney.com/app/ranking/
