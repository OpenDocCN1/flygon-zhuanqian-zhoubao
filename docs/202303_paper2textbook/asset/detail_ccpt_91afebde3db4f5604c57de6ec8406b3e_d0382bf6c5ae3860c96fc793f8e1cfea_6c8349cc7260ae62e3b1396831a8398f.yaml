  - 开启认证舞蹈博主，增加账号的权重同时继续深入了解视频号的运营技巧，和视频号小店的入驻流程，为后期开启直播教学和带货做准备
  - 按生理节点倒推业务节奏：孕晚期→上线课程1.0(现金流+需求调研)；待产/月子期→被动交付+收集反馈；月子后→迭代2.0+开直播+开小店(规模化)
- 'no': 10
  name: 垂直技能型素人成功公式 —— 四个确定性动作的乘积，任一为零结果为零
  points:
  - '**为什么需要这个概念？**'
  - '- 素人创业易陷入「靠运气出爆款」「靠天赋做IP」「靠熬夜出成绩」的赌徒心理'
  - '- 将成功拆解为可控、可复制、可检验的四个确定性动作，把「概率游戏」变成「工程建设」'
  - '- 公式化思维便于复盘定位断点：不出单=信任没建立/量级不够/转化路径断/产品没验证'
  - '**核心定义**'
  - '- 垂直技能型素人成功公式 = 专业人设信任背书 × 高频内容曝光量 × 低门槛私域转化路径 × MVP快速变现'
  - '- 专业人设信任背书：头衔/证书/经历/案例/真实感，解决「凭什么信你」'
  - '- 高频内容曝光量：日更/双更/批量产/评论互动/蹭热点，解决「谁知道你」'
  - '- 低门槛私域转化路径：适配用户画像的引流动作/话术/钩子/承接，解决「怎么加你」'
  - '- MVP快速变现：预售/低价体验/首发价/分期付，解决「为何付钱」'
  - '**关键性质**'
  - '- 乘法模型：任一环节为0（如从不引流/从不更新/无专业背书/免费送），结果必为0'
  - '- 可量化考核：信任背书=资质数/案例数；曝光量=日更天数/总播放量；转化路径=私信回复率/加微率/成交率；MVP=预售金额/首批用户数'
  - '- 正向飞轮：变现收入→投流/升级设备/招助理→提升曝光/转化/交付→更高收入'
  - '**典型例子**'
  - '- 叁叁：教师资质+孕妈身份（信任）× 10天日更+对比封面（曝光）× 话术+二维码（转化）× 预售课程1.0（变现）= 1000+精准粉+种子用户+现金流'
  - '- 刘晨昊：投行背景+赚钱案例（信任）× 反差选题+标题82法则（曝光）× 朋友圈IP+社群钩子（转化）× 社群预售499元（变现）= 单月8万+'
  - '- 李诚团队：航海教练背书+实操数据（信任）× 矩阵号日更+切片分发（曝光）× 企微名片+小风车（转化）× 训练营/咨询/带货（变现）= 月销200万+'
  - '**边界条件**'
  - '- 仅适用于「垂直技能/知识付费/服务型/高客单非标品」赛道，标品电商/泛娱乐/游戏/工具类模型不同'
  - '- 「专业人设」不可造假，一旦翻车信任崩塌不可逆（如假证书/假案例/人设崩塌）'
  - '- 「高频更新」不可以「质量差」为借口偷懒，底线是「不违规/不水贴/有完整结构」'
  sources:
  - paper: docs/202303/ZvLLdhX11oD4Lyxby36ct8GfnXe.md
    role: origin
  excerpts:
  - 一个账号如果无法变现，哪怕数据再漂亮，也是一堆垃圾！
  - 保持更新频率，不管之前的内容数据怎么样，都不要影响你接下来的更新节奏，用数量去对抗质量！
  - 垂直技能型素人视频号成功公式 = 专业人设信任背书 × 高频内容曝光量 × 低门槛私域转化路径 × 最小可行性产品（MVP）快速变现
  - 任何事情做到先完成再完美，没有人一上来就可以做到100分
