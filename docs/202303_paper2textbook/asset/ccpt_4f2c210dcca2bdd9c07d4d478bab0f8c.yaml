paper: docs/202303/20230328_134.md
desc: 该素材为可达Koda在生财有术社区分享的《如何在web3领域寻找我们的机会？》演讲/文章的元数据页面，包含作者背景、分享主题缘起、核心洞察（AI提升生产力背景下生产关系变革是普通人机会）、社区互动评论及文档访问链接，但正文内容因链接失效或权限问题未在当前素材中呈现。
concepts:
- name: 生产关系变革机会
  desc: 指在AI技术大幅提升生产力的宏观背景下，社会生产关系（如组织形式、协作模式、价值分配机制）发生周期性重构，这一过程为普通个体提供了参与红利获取的窗口期。
  is_original: false
  excerpt:
  - 在 AI 使得生产力指数提升的背景下，可能生产关系周而复始的变革是普通人更容易抓住的机会。
- name: Web3活跃人群
  desc: 作者定义的核心Web3参与者群体，特指懂公链技术、深度研究项目、实际参与项目建设或治理的人群，显性排除单纯在中心化交易所炒币的人群，国内规模预估约1万人。
  is_original: true
  excerpt:
  - 国内 web3 活跃人群 1 万左右吧。我说的 web3 活跃人群的定义是懂公链，研究项目，参与项目的。不包含交易所人群。
- name: 区块链金融统摄视角
  desc: 作者认为当前Web3细分赛道（DeFi、GameFi、NFT、DAO等）本质上均属于区块链金融范畴，因人群基数小、重叠度高，不必过度区分垂直领域。
  is_original: true
  excerpt:
  - 我觉得人已经这么少了，不大用分了，概括来说都是区块链金融的。
methods:
- name: __overview__
  desc: 基于个人创业实战与投资经验的复盘迭代法：以3个月为周期，对比前后认知变化，提炼可复用的机会识别框架，并在社区进行公开分享验证。
  excerpt:
  - 3 个月前，我第一次在 web3 主题航海中进行《我们在 web3 的赚钱机会》主题分享。3 个月后，我自己在这个赛道中有了新的成长和认知迭代，也拿到了一些小结果...再次受到邀请，分享了《如何在
    web3 领域寻找我们的机会？》
theorems:
- name: 技术红利向关系红利转移
  desc: 当AI等通用技术使基础生产力大幅跃升时，单纯的技术优势边际收益递减，基于新生产力重塑的生产关系（DAO、代币经济学、贡献度量化等）成为普通人切入Web3的最优路径。
  excerpt:
  - 在 AI 使得生产力指数提升的背景下，可能生产关系周而复始的变革是普通人更容易抓住的机会。
- name: 小圈层深耕优于赛道分散
  desc: 鉴于国内Web3核心活跃人群仅约1万且高度重叠，资源应集中于建立跨项目的深度连接与信任网络，而非试图在细分垂直赛道间寻找蓝海。
  excerpt:
  - 国内 web3 活跃人群 1 万左右吧... 我觉得人已经这么少了，不大用分了，概括来说都是区块链金融的。
findings:
- name: 作者个人成果验证
  desc: '[claim] 作者声称在前次分享后的3个月内，通过实践获得了‘新的成长和认知迭代’及‘一些小结果’，并受邀二次分享。'
  excerpt:
  - 3 个月后，我自己在这个赛道中有了新的成长和认知迭代，也拿到了一些小结果，很荣幸再次受到 的邀请，分享了《如何在 web3 领域寻找我们的机会？》
- name: 文档可访问性故障
  desc: '[evidence] 多位社区用户反馈原文链接无法打开或报错，表明素材分发渠道（语雀/生财有术文档链接）存在权限限制或链路失效问题，导致核心内容无法直接获取。'
  excerpt:
  - '时光 : 全文点不进去呢[捂脸]'
  - '银河空空 : 点开报错'
  - '张静伟@生财有术 : 你再试试？我这边没啥问题'
