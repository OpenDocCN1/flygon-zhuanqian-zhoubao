units:
- 'no': 1
  name: 周报导航索引 —— 从“碎片素材”到“知识地图入口”
  points:
  - '**为什么需要这个概念？**'
  - '- 素材库庞杂，学习者缺乏全景视野，无法快速定位核心内容'
  - '- 缺乏统一的检索入口，导致知识碎片化、孤岛化，难以形成体系认知'
  - '- 需要一个“总目录”作为教材的导航仪，连接宏观结构与微观节点'
  - '**核心定义**'
  - '- 《龙哥赚钱周报》2023年3月刊总目录：汇总四周（3.6-3.12、3.13-3.19、3.20-3.26、3.27-4.2）所有精华帖标题与分类的结构化索引文档'
  - '- 覆盖AI工具、跨平台运营、私域流量、电商变现、个人成长五大板块，作为本教材素材库的总检索入口'
  - '**关键性质**'
  - '- 导航性：提供按周、按板块的二维检索路径'
  - '- 元数据属性：不包含实质正文，仅记录标题、分类、来源链接'
  - '- 结构锚点：定义了教材素材库的边界与模块划分'
  - '**典型例子**'
  - '- 读者想研究“AI工具落地”，通过总目录定位到第3周“AIGC工具落地与平台红利捕捉”板块，再反查对应素材文档'
  - '- 教材编排时，依据总目录的五大板块划分章节模块，保证内容覆盖无遗漏'
  - '**边界条件**'
  - '- 仅作为索引与导航工具，不承载具体方法论、案例细节或数据论证'
  - '- 依赖外部语雀文档链接，若链接失效将导致实质内容不可达'
  - '- 无法替代对原文的深度阅读与提炼，仅是“通往知识的地图”而非“知识本身”'
  sources:
  - paper: docs/202303/README.md
    role: origin
  - paper: docs/202303/20230328_000.md
    role: origin
  excerpts:
  - 汇总2023年3月四周（3.6-3.12、3.13-3.19、3.20-3.26、3.27-4.2）所有精华帖标题与分类，覆盖AI工具、跨平台运营、私域流量、电商变现、个人成长五大板块，作为本教材素材库的总检索入口。
  - 记录第4期周报《龙哥赚钱周报 20230328-20230404》的文档标题与来源链接，为后续深度研读该期全文提供定位锚点。
