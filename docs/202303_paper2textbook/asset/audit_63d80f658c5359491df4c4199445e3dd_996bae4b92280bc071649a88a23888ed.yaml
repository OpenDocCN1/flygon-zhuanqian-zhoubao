unsupported_claims:
- location: '16.11'
  claim: GPT 全能副驾模式在单一会话中连续扮演 PM/文案/设计/开发/运营五大角色，配合 SaaS 工具链半天交付全栈 MVP。
  reason: 素材 P010 确认了 GPT 扮演多角色与 SaaS 工具链集成，但未明确提及 '半天交付全栈 MVP' 的具体时间承诺；素材 P001/P005
    侧重工程调试，非产品化交付。
- location: '16.13'
  claim: 验证优于实现原则主张早期用人工/No-code 跑通闭环，绝不写代码，仅当规模化触发条件时再投入开发重构。
  reason: 素材 P010 提到 '前期用户少的时候，可以完全人工来把交付流程搞定' 与 '验证优于实现'，但未明确 '绝不写代码' 及 '仅当规模化触发条件时再投入开发'
    的绝对化表述。
- location: '16.15'
  claim: 工具组合杠杆定理中 GPT 作为大脑、SaaS 为手脚，核心竞争力在于工具生态选型编排能力。
  reason: 素材 P008/P010 共识工具组合杠杆，但 '核心竞争力在于工具生态选型编排能力' 为本章综合提炼，素材中无直接原文支撑该确切表述。
