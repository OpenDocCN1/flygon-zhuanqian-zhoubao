paper: docs/202303/20230328_174.md
desc: 该素材是一份针对中国卖家的 Etsy 平台注册与运营全流程实操指南，核心主张是 Etsy 风控极严、门槛极高，新手若无海外真实人脉资源（真实身份、环境、IP、银行卡）不建议入场。内容系统梳理了注册所需的八大类核心资料准备细节（含虚拟信用卡选卡、收款账户避坑、产品图片元数据伪装、IP纯净度检测、指纹浏览器配置），提供了从账号注册到店铺开设、上品、填写身份/收付款/证件、双重验证的完整图文操作流程，深度解析了风控底层逻辑（欺诈分值模型），并给出了避免封店的17条运营守则、申诉流程及话术模板，最后指出发货物流与指纹浏览器进阶用法为后续专题。
concepts:
- name: Etsy欺诈分值模型
  desc: 素材核心理论模型，将平台风控抽象为多维度加权打分系统，资料真实度、IP纯净度、卡段重复率、产品合规度、运营行为异常度均计入分值，超过临界值（如假设的60分）即触发暂停/封店，解释了为何同类违规操作有的店存活有的封店。
  is_original: true
  excerpt:
  - Etsy 平台这套欺诈值打分系统是怎么计算的，我们永远无法得知，但是我们能做的就是在每一个细节上面，越接近一个“正常人”，努力降低这个分数，那么店铺就会越稳定。
  - 我们可以先假设这样一个情况：Etsy 对于欺诈值的临界点分数是 60 分（超过 60 分就封店）。A 店铺是用真实资料注册的，但是付款和收款用的都是虚拟卡，Etsy
    对于 A 店铺的欺诈值打分是 50 分...而有一个真实美国的 Etsy 店铺 B，Etsy 对这个 B 店铺的欺诈值打分可能是 10 分...
- name: “伪原创”产品图片标准
  desc: Etsy 要求手工/原创属性，但审核主观性强。素材重新定义“原创”：非平台收录图片即可，核心策略是通过拍摄制作过程视频/图片作为主图、修改网图元数据及文件名（使用
    Magicexif 工具）使图片在元数据层面呈现“原创”特征，以通过算法及人工审核。
  is_original: true
  excerpt:
  - 注意，不是我们自己判断产品是否符合标准，最重要的是要拍得让他知道我们的产品是符合标准的。
  - 那么最简单的办法就是能把产品的制作过程拍下来，然后作为主图。同时，最好保留一份产品制作视频，有利于后期触发审核时申诉。
  - 如果使用的是网图（网络上找的图片），注意要修改图片的名称，并使用工具修改或者增加图片的元数据。图片元数据修改工具可以用 Magicexif。
- name: 动态住宅 IP 养号策略
  desc: 注册期使用动态住宅 IP（真实家庭宽带 IP，纯净度高、用户少），店铺稳定后可切换固定 IP 降低成本。需配合 scamalytics.com 检测
    IP 欺诈分（绿色优先），避免服务器 IP（云厂商 IP）因重复率高导致关联封店。
  is_original: false
  excerpt:
  - 建议注册 Etsy 店铺时使用动态住宅 IP（不了解什么是动态住宅 IP？可以看文末的链接），因为这样的 IP 是最干净的。
  - 同时注意，使用 IP 前，先检查 IP 是否属于目标国家，并且可以用这个网站（scamalytics.com/ip）看 IP 的垃圾值是否过高，绿色提示最好，黄色一般，红色直接不要用。
- name: 虚拟信用卡 BIN 码归属地校验
  desc: 虚拟卡开卡前必须通过 bincheck.io 查询卡头前 6 位，确保发卡国家与注册店铺国家一致（如美店必须用美卡头），规避因卡段国家不符触发风控。
  is_original: false
  excerpt:
  - 使用前一定要查卡头，卡头必须和注册国家一致。比如注册的是美国店，那么卡头也必须是美国的。
  - 使用这个链接（bincheck.io），输入虚拟卡号的前 6 位查询是属于哪个国家的。
- name: Plaid 验证壁垒
  desc: Etsy 美国站强制接入 Plaid 银行验证机制，市面主流虚拟收款账户（万里汇、PingPong 等）普遍无法通过，导致美区店铺注册成功率极低，建议规避美区改注册其他国家站点。
  is_original: true
  excerpt:
  - 美区的 Etsy 因为需要过 plaid 验证，所以暂时没有好的方案来收款。
  - 现在不建议注册美国地区的 Etsy，会触发 plaid 验证，而市面上的虚拟收款账户暂时基本都无法通过 plaid 验证。
- name: 指纹浏览器环境隔离
  desc: 使用 AdsPower 或 Hubstudio 等指纹浏览器模拟真实设备指纹，解决国内运营模拟海外电脑环境的核心痛点，配合独立 IP 实现多账号物理隔离，防止浏览器指纹关联导致封店。
  is_original: false
  excerpt:
  - 使用指纹浏览器软件，建议使用 adspower 或者 Hubstudio。
  - 对于第二点，可以用指纹浏览器解决。
- name: 验证器软件双重保险机制
  desc: 强制使用 Google/Microsoft Authenticator 替代短信验证，防止国外号码欠费失联；同时建议截图保存二维码或使用 Enpass
    云同步密码管理器备份密钥，防手机丢失/重置导致 2FA 无法恢复锁死账号。
  is_original: true
  excerpt:
  - 不建议使用手机短信的方式来验证，因为如果你用的是国外手机号，忘记续费的话，就收不到短信，会导致店铺无法登录。
  - 验证器软件是在手机上的，如果手机丢失，或者恢复出厂设置了，那么数据也会丢失，无法恢复。所以建议也要把验证时的二维码截图保存下来。
  - 或者也可以使用这个软件：enpass，是个密码管理软件，也支持保存这种一次性验证码，可以绑定云盘...
methods:
- name: __overview__
  desc: 全链路‘真实人设模拟’注册法：以欺诈分值模型为指导，通过‘真实海外身份资料+纯净动态住宅IP+指纹浏览器环境+小众卡段虚拟卡/收款卡+伪原创手工产品图片+验证器双重认证’六维一体化配置，模拟本地真实卖家行为完成注册，并配合‘新店静默养号7天+分级申诉机制’应对风控审核。
  excerpt:
  - 最稳定的办法就是一切模拟正常人的行为...让这位亲戚在澳大利亚开一台电脑...用这个亲戚的驾照照片...银行卡...信用卡去注册店铺...用远程操控的方式操作这台电脑。
  - 店铺注册有六个要点：1.干净的 IP；2.模拟当地的电脑环境；3.真实的资料；4.干净的付款卡；5.干净的收款卡；6.“原创”产品的图片。
  - 新店创建完成后，我们一般什么都不操作，放置 7 天，7 天后如果一切正常，那么就可以开始店铺装修...
- name: Etsy注册全流程标准化操作SOP
  desc: 11步可执行注册作业：①检测IP/货币一致性→②邮箱注册验证→③进入Sell on Etsy向导→④设置语言/国家/货币/店名→⑤上传伪原创产品（主图含制作过程、填Tag、设处理时间）→⑥填写个人身份/地址（小到大格式）→⑦配置虚拟收款账户→⑧上传证件→⑨绑定虚拟信用卡付款→⑩配置验证器2FA→⑪保存备用码。
  excerpt:
  - 打开网址：www.etsy.com 首先，滑到底部看国家和货币是否和要注册的国家地区一致...
  - 邮箱，FirstName，店铺密码，输入，然后点击注册...登录邮箱...点击确认账号...
  - 点击右上角的头像，选择“Sell on Etsy”...填写店铺信息...上传产品...填写个人/公司资料...填写收款账号...上传证件资料...填写付款账号...选择验证方式...
- name: 网图伪原创元数据重构法
  desc: 针对无法自产图片场景：下载网图→修改文件名为英文无中文→使用 Magicexif 工具写入/修改 EXIF 元数据（相机型号、拍摄参数、GPS 坐标等）→上传作为主图，配合制作过程视频备存应对申诉审核。
  excerpt:
  - 如果使用的是网图（网络上找的图片），注意要修改图片的名称，并使用工具修改或者增加图片的元数据。
  - 图片元数据修改工具可以用 Magicexif。网上下载下来的图片的元数据一般是空白的，修改之后就会有数据。
- name: 邮件申诉标准化流程
  desc: 暂停/封店后标准动作：后台点击 Contact Etsy Support → 选择 Email appeal → 勾选确认框 → 实情陈述运营情况
    → 附件上传制作过程视频（新店暂停时关键证据）→ 发送 → 监控注册邮箱 7-14 天等待自动回复与人工审核结果 → 未回复可追加二次申诉。
  excerpt:
  - 首先，点击联系 Etsy 支持...选择邮件申诉...进入申诉页面，第一个框先打勾。然后开始写我们的申诉内容...如果是新店被暂停，那么在附件的地方，可以选择上传产品的手工制作视频...
  - 申诉之后，Etsy 会给你发送一封自动邮件...过几天之后就会再发一封审核结果的邮件。Etsy 现在回复邮件的时间越来越慢，7-14 都有可能。
theorems:
- name: 新手入场劝退定理
  desc: 无海外可信人脉（提供真实身份、地址、银行卡、电脑、IP）的国内新手，因资料重复率高、环境模拟成本大、风控不可控，入场 Etsy 预期收益为负，建议直接放弃。
  excerpt:
  - 我的回答是：不建议。原因如下：1.使用国内资料是无法注册 Etsy 的。2.即使你有国外的资料，那么也无法保证注册成功。3.即使注册成功了，因为这个平台极高的风控，店铺依然很容易被暂停甚至封店。
  - 如果你没有海外的朋友，那么就不要开始了。因为一旦开始，你就要进入开店，封店的恶性循环之中，最后疲惫地放弃这个平台，精力和金钱都损失，何必呢？
- name: 风控概率论本质定理
  desc: Etsy 封店非单一因素决定，而是多维欺诈分值累积的概率事件。单一合规（如真实产品）无法抵消多维违规（如虚拟卡、服务器IP），唯有全维度向‘真实正常用户’无限逼近，才能将欺诈分压低至安全阈值以下。
  excerpt:
  - 风控是一个概率问题，不是简单的“是”或者“不是”的问题。有条件就尽量接近真实，如果没条件就要接受有被封的可能性，没人能肯定这么做是封还是不封。
  - 以上这些问题，都可以用一个答案来回答：越接近真实的情况，你开店的成功率就越高。
- name: 产品合规主观性定理
  desc: Etsy ‘手工/原创’ 定义权在平台审核人员主观判断，非客观标准。卖家无法通过自我判断保证合规，唯一策略是‘自我拍摄制作全过程’构建不可辩驳的证据链，配合视频留存应对不可预测的定期抽查。
  excerpt:
  - 第一，这是个很主观的定义，因为我们都不是 Etsy 审核人员，所以我们怎么认为并不重要，重要是 Etsy 审核人员怎么认为。
  - 第二，我们要做的就是，能自己拍图就自己拍图。不要盗用平台上的图片，不要直接搬运淘宝 1688 等图片，如果要搬运，至少要二次修改。
- name: 店铺生命周期分级审核定理
  desc: 店铺非一次性通过即永久安全，而是面临首单、3-4单、10单、30单、百单、千单等关键节点的阶梯式复审。30单前为高危期，前期上品、运营动作需极度保守，申诉成功仅重置当前风控状态，不免除后续审核。
  excerpt:
  - 一般来说，店铺出了 30 单之后，就是比较稳定了。
  - 即使申诉成功，并不意味着你的店铺就可以一劳永逸了。Etsy 会在店铺出首单，三四单，十单，三十单，百单，甚至千单左右都会再次审核。
- name: 收款账户‘以真换虚’迁移策略
  desc: 注册初期使用亲戚真实海外银行卡（信任度最高）通过收款验证，店铺稳定（>30单）后再切换为虚拟收款账户（万里汇等）解决回款效率与税务问题，平衡安全性与运营便利性。
  excerpt:
  - 解决方案就是：可以在店铺开下来并运营一段时间后，把收款卡改为虚拟收款卡，比如万里汇这一类的，那就能解决税费...和收款...的问题。
findings:
- name: 美区店铺 Plaid 验证导致注册近乎不可行
  desc: '[evidence] 素材作者及社群大量测试反馈：Etsy 美国站强制 Plaid 验证，主流虚拟收款服务商（万里汇、连连、PingPong、空中云汇、光子易）均无法通过，导致美区店铺注册成功率极低，建议规避。'
  excerpt:
  - 美区的 Etsy 因为需要过 plaid 验证，所以暂时没有好的方案来收款。
  - 现在不建议注册美国地区的 Etsy，会触发 plaid 验证，而市面上的虚拟收款账户暂时基本都无法通过 plaid 验证。
- name: 香港公司注册香港站成功率低且不稳定
  desc: '[evidence] 多人实测：中国护照开港店失败；香港公司营业执照注册港店‘有的成功，有的失败，失败居多’，不建议专门注册公司尝试。'
  excerpt:
  - 我自己测试用中国护照开港店是不行的。但对于中国人开的香港公司...测试结果是：有一定的概率能成功。多位朋友测试过了，有的成功，有的失败，失败居多。
- name: 购买店铺/资料极高概率因重复导致封店
  desc: '[evidence] 作者观察及社群反馈：买卖资料/店铺存在‘一份资料卖多人’或‘店铺转手后封店’现象，资料重复导致关联封店，买家无法区分是资料问题还是操作问题，维权无门。'
  excerpt:
  - 买资料最大的问题是，你永远不知道卖家会把一份资料卖给多少人，而拿着重复的资料去注册店铺，肯定是很容易出问题的。
  - 买店铺同理...后期被封了到底是资料问题还是操作问题，就没办法说得清。
- name: 新店静默养号7天显著降低初期暂停率
  desc: '[claim] 作者经验总结：新店注册完成后完全不动放置7天，若未被暂停再开始装修上品，可有效规避注册即触发的初审风控，是提高存活率的低成本策略。'
  excerpt:
  - 新店创建完成后，我们一般什么都不操作，放置 7 天，7 天后如果一切正常，那么就可以开始店铺装修，上传产品等正常操作。
- name: 邮件申诉成功率高于客服工单申诉
  desc: '[claim] 作者实战经验：遇到店铺暂停，通过后台 Contact Support 走邮件申诉渠道，成功概率高于提交客服工单；申诉内容长短不影响结果，关键在于附件提供制作视频等实锤证据。'
  excerpt:
  - 如果店铺被暂停，建议使用邮件申诉，成功的概率比客服提交申诉的概率要高一些。
  - 申诉的内容我们就如实填写自己的情况，申诉内容的长短并不会直接影响最终判定结果。如果是新店被暂停，那么在附件的地方，可以选择上传产品的手工制作视频...
- name: 前期上品数量日限3款、前30单不改动Listing为保命准则
  desc: '[claim] 作者总结的运营红线：新店每日上新≤3个；注册时上传的产品后续尽量不动；出单前30单为高危期，严禁刷单、大幅调价、批量打折、超期发货、回复超时，违者极大概率触发复审封店。'
  excerpt:
  - 新店每日产品上架数量最好不超过 3 个。
  - 新店注册时上传的产品最好不要做任何改动。
  - 一般来说，店铺出了 30 单之后，就是比较稳定了。
