learning_targets:
- 识别素材库中“索引占位类”素材的结构特征与局限性
- 理解“索引页空心化”与“外链依赖”对知识资产安全性的威胁
- 掌握在教材编写与知识管理中区分“结构性锚点”与“实质性内容”的判别标准
- 建立针对空心化索引素材的“标记-回溯-补全”规范化处理流程
concept_map:
- 见面会复盘索引占位素材
- ├── 形态特征
- │   ├── 仅含标题 “【见面会复盘】” —— P001
- │   ├── 仅含语雀外链 —— P001
- │   └── 无正文/观点/方法论/案例数据 —— P001
- ├── 核心属性
- │   ├── 空心化（索引页不承载知识点） —— P001
- │   ├── 外链依赖（知识资产寄宿第三方平台） —— P001
- │   └── 结构性锚点（标识知识体系模块边界） —— P001
- ├── 潜在风险
- │   ├── 链接失效导致知识永久丢失 —— P001
- │   └── 无法直接用于教材正文撰写 —— P001
- └── 应对策略
- '    ├── 标记为 “待补全素材” —— P001'
- '    ├── 通过外部链接回溯获取实质内容 —— P001'
- '    └── 推行 “本地归档” 替代 “链接分发” 策略 —— P001'
life_analogy:
- 想象这份素材是图书馆目录系统中的**一张空白索引卡**：
- '- **标题** = 书名“见面会复盘”'
- '- **语雀链接** = 卡片上写着“本书存放于别馆第 3 排”'
- '- **空心化** = 卡片本身没有摘要、目录、作者简介，甚至没有 ISBN'
- '- **外链依赖** = 只有跑去别馆，才能看到书的真身；若别馆搬迁或失火，这张卡就彻底成了废纸'
- '- **结构性锚点** = 尽管是空卡，它至少告诉你：馆藏体系里 *有* “见面会复盘” 这个分类'
- 就像图书馆必须定期‘回溯实体书、在本馆复印存档’一样，知识管理也必须‘回溯外链、本地落盘’，才能把空心索引变成真资产。
summary:
- concept: 索引占位类素材
  desc: 仅含标题与外链、无实质正文的结构性占位文件
- concept: 空心化
  desc: 索引页本身不承载任何知识点、方法论、案例或数据
- concept: 外链依赖
  desc: 核心知识资产完全寄宿于第三方平台（语雀），链接失效即资产归零
- concept: 结构性锚点
  desc: 虽无内容，但标识了社群知识体系中“线下活动复盘”模块的边界位置
- concept: 标记-回溯-补全流程
  desc: 教材编写时标记“待补全”，通过外链回溯获取实质内容后再落盘使用
- concept: 本地归档策略
  desc: 以‘本地存储’为主、‘外链分发’为辅，规避第三方平台失效风险
exercises:
- 'no': 1
  title: 空心化索引排查实战
  contents:
  - 给定素材库 50 个 .md 文件，其中 12 个疑似为“仅标题+外链”结构：
  - 1. 编写脚本/人工检查，识别出所有“正文字符数 < 50 且包含外链”的文件
  - 2. 将其标记为 “INDEX_PLACEHOLDER” 并导出清单
  - 3. 对清单中每个外链发起 HTTP HEAD 请求，记录 404/403/重定向等异常状态
  - 回答问题：
  - '- 若 3 个外链已失效，如何在不联系原作者的前提下尝试找回内容？'
  - '- 如何设计一套“定期巡检+自动归档”机制，杜绝未来再出现空心化索引？'
- 'no': 2
  title: 知识资产风险量化评估
  contents:
  - 假设社群现有 200 篇核心素材，其中 30% 为外链依赖型，语雀平台年链接失效率约 5%：
  - 1. 计算未来 3 年内预期丢失的知识节点数
  - 2. 若单节点重建成本（回溯/重写/重新采访）约 4 小时，估算总风险暴露工时
  - 回答问题：
  - '- 投入多少工时建设“本地全量归档系统”能使 ROI > 1？'
  - '- 哪些类型的节点（风向标/航海日志/复盘/专访）优先级最高？为什么？'
- 'no': 3
  title: 教材编写中的素材分级决策
  contents:
  - 某章节引用了 8 份素材，经核查：3 份实质内容完整，2 份为空心化索引（含本文“见面会复盘”），3 份为部分配图缺失：
  - 1. 设计三级素材可用性等级（L1 可直接引用 / L2 需回溯补全 / L3 需重造或放弃）
  - 2. 给出本章的素材分级表与后续动作清单
  - 回答问题：
  - '- 如何在保证教材进度的前提下，并行启动 L2 素材的回溯任务？'
  - '- 若 L2 素材回溯失败，章节大纲该如何“降级重写”而不破坏逻辑闭环？'
units:
- 'no': 1
  name: 见面会复盘索引页 —— 知识管理的“空心化”边界
  points:
  - '**为什么需要这个概念？**'
  - '- 识别素材库中存在的“只有标题和外链、没有正文内容”的索引型素材'
  - '- 区分“结构性占位索引”与“实质性内容素材”，避免在教材编写中误用空壳素材'
  - '- 揭示早期知识管理以“链接分发”为主、缺乏“本地归档”的策略缺陷'
  - '**核心定义**'
  - '- 该素材为‘见面会复盘’专题的结构性占位索引，仅含标题与语雀外链'
  - '- 核心内容寄宿于外部语雀文档，本地无实质正文存储'
  - '**关键性质**'
  - '- 空心化：索引页本身不承载任何知识点、方法论、案例或数据'
  - '- 外链依赖：知识资产完全依赖第三方平台（语雀）的链接有效性'
  - '- 结构性锚点：虽无内容，但标识了社群知识体系中“线下活动复盘”模块的边界位置'
  - '**典型例子**'
  - '- 素材 ID：docs/202303/20230328_025.md'
  - '- 表现形式：标题“【见面会复盘】”+ 语雀文档超链接'
  - '- 使用场景：作为教材大纲第 1 章第 21 节的节点来源，仅提供分类入口'
  - '**边界条件**'
  - '- 无法直接用于“概念解析”正文撰写，缺乏可引用的论据、金句、数据或步骤'
  - '- 若外部链接失效（语雀文档删除/迁移/权限变更），该知识节点将永久丢失'
  - '- 教材编写时需标记为“待补全素材”，需通过外部链接回溯获取实质内容后方可使用'
  - '...'
  sources:
  - paper: docs/202303/20230328_025.md
    role: origin
  excerpts:
  - 该素材仅包含一个标题“【见面会复盘】”和一个语雀文档链接，缺乏具体的正文内容、观点阐述、方法论描述或案例数据，因此无法提取核心概念、方法、主张或发现。
  - 素材分类：索引占位类；核心内容寄宿于外部语雀文档，存在链接失效风险。
