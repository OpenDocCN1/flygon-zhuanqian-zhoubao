units:
- 'no': 1
  name: 星探模式 —— 让团队从“演员”变身“伯乐”
  points:
  - '**为什么需要这个概念？**'
  - '- 并非所有团队都擅长内容生产和IP人设打造，强行自营IP易导致资源错配'
  - '- 头部IP稀缺且培养周期长，自主孵化风险高、试错成本大'
  - '- 擅长资源整合、识人用人的团队，通过搭台子找戏班子能发挥更大杠杆'
  - '**核心定义**'
  - '- 企业不自营IP，而是专注发掘、筛选具备深度阅历且适合做IP的人才'
  - '- 核心动作：在目标IP人才事业低谷期介入，建立合作关系'
  - '- 本质是“伯乐”而非“千里马”，以资源整合能力换取IP的内容生产能力'
  - '**关键性质**'
  - '- 反直觉：主动寻找“低谷期”而非“高光期”切入'
  - '- 信任前置：通过雪中送炭建立深度绑定，而非锦上添花'
  - '- 轻资产：不承担内容生产重资产，专注人才识别与资源赋能'
  - '**典型例子**'
  - '- 抖音400万粉商业IP操盘手团队：不自制内容，专做星探发掘有阅历的人，在其低谷期介入合作'
  - '- 作者公司对比：擅长短平快项目，强行自营IP导致团队焦虑浮躁，验证模式错配的反面教材'
  - '**边界条件**'
  - '- 前提：目标人选必须“真有阅历、有深度”，空心IP无法承载星探模式'
  - '- 团队核心能力需为：人才识别力、资源整合力、关键节点解决问题的能力'
  - '- 若团队核心优势是内容生产与运营节奏把控，则应选择自营模式而非星探模式'
  - '...'
  sources:
  - paper: docs/202303/20230328_092.md
    role: origin
  excerpts:
  - 有的人擅长自己做自媒体，做自己的 ip。而有的人更适合搭台子找戏班子。比如今天见面的团队就是擅长当“星探”，去寻找那些适合做 ip 的人，前提是真的有阅历。并且要掌握时机，在此
    ip 低谷期伸入。
  - 怎么绑定合作关系，更多的是你是擅长为对方去服务的，给对方提供价值的。当然第一点在对方低谷期入手，已经很大程度建立了信任。加之后期 ip 遇到问题，动用人脉关系网给予解决。其实就是在每个关键节点给很到位的帮助。
  - 前几天饭局见了抖音 400 万粉丝商业 IP 操盘手 五个多小时的思维碰撞... 比如今天见面的团队就是擅长当“星探”，去寻找那些适合做 ip 的人...
- 'no': 2
  name: 业务属性同构效应 —— 老板选赛道，决定团队性格
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常只关注业务赚不赚钱，忽视业务模式对组织文化的深层塑造作用'
  - '- 团队普遍焦虑、浮躁、短视，往往不是招人错了，而是业务属性“选错了”'
  - '- 需要一个诊断工具，从业务底层逻辑反推组织症状的根因'
  - '**核心定义**'
  - '- 公司领头人所选业务项目的属性（短平快 vs 长期主义），会投射并塑造全员心理状态与行为模式'
  - '- 业务属性通过领导者行为示范、激励机制、考核导向，强制重塑组织成员的时间偏好与焦虑水平'
  - '**关键性质**'
  - '- 传导性：老板的时间偏好（短期/长期）经由管理动作无损传导给一线员工'
  - '- 强制性：非个人意志可对抗，除非更换业务模式或离职'
  - '- 双向性：长周期业务倒逼团队沉稳、复利思维；短周期业务催生浮躁、收割心态'
  - '**典型例子**'
  - '- 作者公司实证：操盘“短平快”项目，团队普遍浮躁焦虑，收一波看下一波，项目间隙集体恐慌'
  - '- 头部IP操盘手团队：采用“星探模式”属长周期布局，团队状态相对稳定，验证正向同构'
  - '**边界条件**'
  - '- 仅适用于“老板强势主导业务方向”的中小微组织，大型成熟企业有惯性缓冲'
  - '- 业务属性非唯一决定因素，领导者个人修养、管理机制可做微调，但难逆转大势'
  - '- 需警惕“伪长期主义”：嘴上长期主义，行为短期考核，同构效应以行为为准'
  - '...'
  sources:
  - paper: docs/202303/20230328_092.md
    role: origin
  excerpts:
  - 公司领头人以什么属性的项目运营，这群公司上班的人都会跟项目属性很贴合。例如，做短平快的项目的人，基本是收一波就要看下一波。属性很浮躁很焦虑，那么大概率在这个公司上班的人都很浮躁...
    所以老板选业务类型也要注意业务属性会影响自己，以及公司所有人的属性。
  - 以我们公司自身经验来说... 做短平快的项目的人，基本是收一波就要看下一波。属性很浮躁很焦虑，那么大概率在这个公司上班的人都很浮躁... 一旦一个短平快过去了，集体焦虑。
- 'no': 3
  name: 低谷期介入策略 —— 雪中送炭才是最高级的商业绑定
  points:
  - '**为什么需要这个概念？**'
  - '- 商业合作初期缺乏信任，常规谈判易陷入博弈与防备，绑定成本高'
  - '- 头部人才/IP常被资源追逐，锦上添花的合作无法建立排他性关系'
  - '- 需要一套低成本、高粘性、可复制的深度绑定方法论'
  - '**核心定义**'
  - '- 在合作对象（IP/人才）处于事业低谷期、资源匮乏、心理脆弱时，主动介入提供实质性帮助'
  - '- 以“服务者”姿态而非“投资者”姿态切入，通过关键节点的持续赋能，换取长期信任与合作优先权'
  - '**关键性质**'
  - '- 逆周期：反直觉操作，竞争者在高光期涌入，你在低谷期切入，竞争维度降维'
  - '- 信任杠杆：低谷期帮助的边际信任价值远超高光期，且极难被后续竞争者替代'
  - '- 服务导向：绑定核心在于“擅长为对方服务、提供价值”，而非单纯输送资源'
  - '**典型例子**'
  - '- 星探团队操盘手：在IP低谷期伸入，后续IP遇问题动用人脉网解决，每个关键节点给到位帮助，深度绑定关系'
  - '- 作者复盘：第一点在对方低谷期入手，已经很大程度建立了信任'
  - '**边界条件**'
  - '- 需具备“动用人脉解决关键问题”的硬实力，空手套白狼式介入会被识破反噬'
  - '- 仅适用于“有潜力、有阅历、暂时低谷”的优质标的，烂泥扶不上墙无效'
  - '- 需长期主义心态：低谷期介入回报周期长，短期功利者无法坚持'
  - '...'
  sources:
  - paper: docs/202303/20230328_092.md
    role: origin
  excerpts:
  - 并且要掌握时机，在此 ip 低谷期伸入。当然第一点在对方低谷期入手，已经很大程度建立了信任。加之后期 ip 遇到问题，动用人脉关系网给予解决。其实就是在每个关键节点给很到位的帮助。
  - 前几天饭局见了抖音 400 万粉丝商业 IP 操盘手... 比如今天见面的团队就是擅长当“星探”，去寻找那些适合做 ip 的人，前提是真的有阅历。并且要掌握时机，在此
    ip 低谷期伸入。
- 'no': 4
  name: 角色分离决策法 —— 搞清你是“将军”还是“士兵”
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常身兼决策与执行双重角色，导致战略视野被战术琐事吞噬'
  - '- 团队成员不清自身定位，决策层爱插手执行、执行层爱发表战略意见，效能低下'
  - '- 需要一把手术刀，切开角色模糊地带，落实责权对等'
  - '**核心定义**'
  - '- 要求个体明确界分：核心竞争力在于战略决策（做选择、定方向、配资源）还是战术执行（攻细节、跑流程、出结果）'
  - '- 基于定位进行人岗匹配：决策型人才配战略岗，执行型人才配作战岗，严禁错位'
  - '**关键性质**'
  - '- 互斥性：同一时间、同一维度，人无法同时高质量完成决策与执行，主次必须分明'
  - '- 匹配性：业务阶段决定角色需求，0-1需决策力，1-N需执行力，N-N需系统力'
  - '- 认知性：需通过复盘过往“成就感事件”反推天然角色倾向，而非主观臆断'
  - '**典型例子**'
  - '- 素材金句：“分清楚自己适合做决策，还是适合做执行”'
  - '- 作者自证：从只会“出去看看”（决策层爱好）到强迫自己“首发发言落地”（执行层动作），实现角色校准'
  - '**边界条件**'
  - '- 早期创业者常需“决策执行一体”，但需有意识区分时间块：上午做决策、下午做执行'
  - '- 纯决策者若完全脱离一线，易陷入“战略虚假感”，需建立定期下沉机制'
  - '- 角色非固化标签，随能力成长与业务阶段动态迁移，需半年一复盘'
  - '...'
  sources:
  - paper: docs/202303/20230328_092.md
    role: origin
  excerpts:
  - 分清楚自己适合做决策，还是适合做执行。
  - 以我们公司自身经验来说，最好的就是出去看看，回来后要落地。光享受出去看看的那种快乐，没有执行力和落地，与其说享受，不如说是浪费，让自己愈发膨胀
- 'no': 5
  name: 出去看看-落地闭环法 —— 认知不落地，等于白长见识
  points:
  - '**为什么需要这个概念？**'
  - '- 创业群体普遍热衷“考察、学习、开眼界”，却极少有人能将见闻转化为业务增量'
  - '- “见识焦虑”驱动大量低质量输入，制造虚假成长感，实则是逃避执行的伪装'
  - '- 需要一套强制机制，将外部输入强绑定至内部落地动作'
  - '**核心定义**'
  - '- 外部学习考察（出去看看）必须在规定时间内转化为内部执行动作（落地）'
  - '- 单纯的感官刺激、认知膨胀、社交快乐，若无落地动作承接，定性为“浪费”而非“投资”'
  - '- 闭环三要素：看什么（带问题去）→ 怎么用（拆解动作）→ 谁负责（落实人名）'
  - '**关键性质**'
  - '- 强制性：将“落地”设为“出去看看”的必要前置条件，无落地预案不批差旅'
  - '- 具象化：拒绝“开阔眼界”模糊目标，要求输出“可执行的SOP/决策清单/避坑指南”'
  - '- 及时性：归来48小时内完成复盘与方案输出，超时则判定本次考察无效'
  - '**典型例子**'
  - '- 作者公司反面教材：团队出去考察仅享受快乐，回归无落地，导致虚假膨胀、业务零增长'
  - '- 正向应用：作者付费入群后，针对“新人不敢发言”痛点，立即执行“首发发言”动作，完成闭环'
  - '**边界条件**'
  - '- 考察对象须为“可验证、可拆解、可迁移”的成熟案例，避免考察“概念型/预研型”项目'
  - '- 落地不等于全盘照搬，核心是“组合创新”：取其精华，结合自身资源禀赋改造'
  - '- 落地成果需可量化：新增客户数、转化率提升、成本下降、SOP产出等硬指标'
  - '...'
  sources:
  - paper: docs/202303/20230328_092.md
    role: origin
  excerpts:
  - 以我们公司自身经验来说，最好的就是出去看看，回来后要落地。光享受出去看看的那种快乐，没有执行力和落地，与其说享受，不如说是浪费，让自己愈发膨胀
  - 多出去看看，交流学习。这点儿挺重要。（以我们公司自身经验来说，最好的就是出去看看，回来后要落地。光享受出去看看的那种快乐，没有执行力和落地，与其说享受，不如说是浪费，让自己愈发膨胀）
- 'no': 6
  name: 付费融入-主动输出成长模型 —— 用真金白银买入场券，用真刀真枪练内功
  points:
  - '**为什么需要这个概念？**'
  - '- 免费社群信息噪音大、信任度低、边缘人易潜水，免费心态导致“拿来主义”'
  - '- 付费仅是物理入场，化学融入需“主动输出”打破心理防御与社交隐形墙'
  - '- 需要一套标准化路径，将“付费-融入-输出-成长”串联为正向飞轮'
  - '**核心定义**'
  - '- 步骤1：付费筛选高质量信息渠道与高净值同伴圈层（物理融入）'
  - '- 步骤2：强迫自己克服“新人不敢发言/怕丢脸/怕说错”心理，进行公开思考分享（化学融入）'
  - '- 步骤3：持续输出倒逼输入升级，输出吸引同频连接，形成“输入-输出-连接-成长”复利循环'
  - '**关键性质**'
  - '- 门槛筛选：付费成本本身即过滤低意愿者，保证圈层基础信任度与信息密度'
  - '- 输出倒逼：公开表达倒逼深度思考、逻辑自洽、资料整理，是认知升级最快捷径'
  - '- 连接杠杆：优质输出自带传播属性，反向吸引高阶人脉、商机、资源主动上门'
  - '**典型例子**'
  - '- 作者实证：付费加入生财有术后，针对亦仁提到的“新人不好意思发言”，强迫自己首发，获大量点赞互动，实现心理突破与融入'
  - '- 评论区反馈：圈友点赞、握手、肯定，验证“主动输出”即时正向反馈机制'
  - '**边界条件**'
  - '- 付费对象须为“高信息密度、高信任度、高执行力”社群，避免付费买到“割韭菜”课程'
  - '- 输出内容须为“复盘/方法论/实战记录/避坑指南”等高价值干货，拒绝情绪宣泄/水贴'
  - '- 需建立“最小输出单元”：如每周一篇复盘、每天一条洞察，用仪式感对抗拖延症'
  - '...'
  sources:
  - paper: docs/202303/20230328_092.md
    role: origin
  excerpts:
  - 通过付费找到优质多元的信息渠道，让自己融入进去... 通过各种渠道把自己的思考分享出去。再结合昨天看见亦仁老师说过一些新人入圈后不好意思发言，今天我就选择第一次发言。勇于突破[胜利]融入、迸发。
  - '评论区： 芷蓝 : 有启发 ... Hope : 666 啊 ... 星月 : 杨总厉害'
  - 今天我就选择第一次发言。勇于突破[胜利]融入、迸发。
