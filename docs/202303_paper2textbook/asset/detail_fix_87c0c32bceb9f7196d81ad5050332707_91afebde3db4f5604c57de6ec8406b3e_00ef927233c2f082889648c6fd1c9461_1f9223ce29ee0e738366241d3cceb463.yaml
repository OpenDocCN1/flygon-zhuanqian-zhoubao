  name: 二手书合规红线 —— 年售5万免证，核心风险在违禁书
  points:
  - '**为什么需要这个概念？**'
  - '- 二手书经营者常恐惧“无证经营”处罚，实则监管核心查的是书的内容而非资质'
  - '- 明确免证门槛与真实风险点，可大幅降低合规焦虑与运营成本'
  - '**核心定义**'
  - '- 年销售额5万元以下无需出版物经营许可证；被查处根本原因是卖了不该卖的书'
  - '- 多平台分散流水可规避监管阈值，单平台流水不超5万即免证'
  - '**关键性质**'
  - '- 合规边界清晰：证照合规≠经营合规，书目合规才是核心'
  - '- 规避策略可行：多平台铺货（闲鱼/小红书/抖音/视频号）天然分散单平台流水'
  - '- 选品审核SOP：上架前必查版本/印数/品相/内容合规性，建立敏感词库拦截'
  - '**典型例子**'
  - '- 评论区实证：个体户开第二家店法人认证提示证件已被认证，揭示平台规则对同一主体多店的限制'
  - '- 实操建议：不同主体注册、不同平台分发、SKU分散上架，构建合规护城河'
  - '**边界条件**'
  - '- 仅适用于二手图书等出版物经营场景'
  - '- 年销售额超5万仍需办证，但核心风控仍在书目内容而非证照本身'
  - '- 免证不等于无序，仍需建立选品合规SOP与敏感词库'
  sources:
  - paper: docs/202303/20230328_169.md
    role: origin
  excerpts:
  - 年销售额在 5 万以下不需要... 你们看到的因为没有出版物经营许可证被查大都是因为卖了不该卖的书，如此而已。
  - 如果多平台的话，每个平台卖几万是不是也很省事。再说在平台引流，微信卖不也很好吗？
