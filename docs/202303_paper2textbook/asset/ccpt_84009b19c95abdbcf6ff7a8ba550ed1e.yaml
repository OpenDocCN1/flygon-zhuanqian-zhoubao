paper: docs/202303/20230328_148.md
desc: 该素材是一篇短剧推广项目的阶段性复盘总结，作者思蒙记录了从单人实操到带领220人团队实现月GMV破20万的全过程。核心内容包括：通过保证金/学费制筛选高执行力学员、建立标准化SOP与陪跑体系实现90%出单率、总结'不赚钱者的共性特征（执行力缺失/抗挫折低/依赖心理）'，并阐述个人创业需'聚焦自身优势领域深度挖掘而非盲目追逐风口'的核心认知。素材详细披露了项目收益分布数据、陪跑运营实操细节及作者从打工者向创业者思维转型的心路历程。
concepts:
- name: 保证金筛选机制
  desc: 通过收取可退还保证金（后转为学费制）筛选高意愿、高执行力学员，利用沉没成本倒逼执行，同时保护运营方精力不被低质量学员消耗的准入体系。
  is_original: false
  excerpt:
  - 因为我之前是保证金模式，只要爆单就把钱给大家退了
  - 后来改成学费的，就算是收益啦
  - 在后来要加入陪跑的人中，我也拒掉很多类似下面这种的...我不想赚这个钱吗？我很想。但我更要赚负责任的钱，赚长线的钱。
- name: 陪跑服务体系 (SOP+社群运营+情绪价值)
  desc: 标准化操作手册(SOP)与高频社群答疑、数据统计、情绪疏导相结合的全流程陪跑服务模式，核心在于'利他'与'真诚'降低新人试错成本。
  is_original: false
  excerpt:
  - 所以这段时间我真是一天只睡，5，6 个小时，有时候半夜都在给大家回消息
  - 帮大家排难解惑，做做后勤等辅助工作的效果
  - 生财口号的魅力：1. 【利他是最大的利己】 2. 【真诚是最有效的套路】
- name: 短剧推广项目红利期特征
  desc: 项目处于早期市场教育阶段，具备'门槛低、上限高、单账号易出单、批量复制易放大、官方授权佣金优势'的窗口期特征。
  is_original: true
  excerpt:
  - 总体来讲，这个项目目前还处于早期，赚钱确实算是比较容易的。
  - 后来也拿到了短剧官方直接给的授权，佣金也比原来的渠道稍高一点。
  - 单账号赚钱容易，但是要赚大钱可能需要一点运气，不过批量复制很容易
- name: 非执行型学员画像
  desc: 表现为'进群不发视频即退群'、'坚持3天无收益即放弃'、'索要操作细节但不实操'、'缺乏自主性强依赖心理'等典型特征的群体，是陪跑项目低转化的核心原因。
  is_original: true
  excerpt:
  - 有的人做了几天可能连视频还没发，就来找我说不做了。
  - 难道是看见别人进群 2 天就挣了几百块，自己都坚持 3 天了还看不到收益，太委屈自己了？
  - 遗憾没有讲怎么操作呀，什么时候开船呀？
- name: 1米宽1万米深聚焦法则
  desc: 普通人创业应避开头部玩家构建的宽护城河，在垂直细分领域(1米宽)结合过往积累(神功)建立极深竞争壁垒(1万米深)，通过深度聚焦放大微小优势。
  is_original: true
  excerpt:
  - 可能大佬们的护城河，是几万米深，几万米宽。我们做不到几万米宽，可以做到 1m 宽，1 万米深，把大佬们看不上的小缝先填住了。
  - 借助自己领域内的小风口，深度聚焦，逐渐放大。
  - 之前在做游戏时积累的短视频认知，就是我这次做短剧项目的“神功”。
methods:
- name: __overview__
  desc: 短剧推广项目从0到1的标准化复制方法论：选品测款->素材剪辑去重->矩阵账号分发->爆款复投放大->官方授权提佣->陪跑变现闭环。
  excerpt:
  - 从第一笔 19 块钱，到现在的月入 3W+
  - 单账号赚钱容易...批量复制很容易，尤其有项目经验的人。简直上手就是捡钱。
  - 拿到了短剧官方直接给的授权，佣金也比原来的渠道稍高一点。
- name: 陪跑营运营SOP
  desc: 包含前期筛选(保证金/学费)、入群引导(发SOP/强制打卡)、过程管理(日更收益榜/难点攻坚/情绪安抚)、后期转化(学员裂变/官方资源对接)的标准化运营流程。
  excerpt:
  - 所以这段时间我真是一天只睡，5，6 个小时，有时候半夜都在给大家回消息。
  - 后来和一个朋友聊过以后，我也慢慢看开了，有的人真是你再怎么想都带不动，那不如把精力放在更愿意学习和出力的人身上。
  - 我在后来要加入陪跑的人中，我也拒掉很多类似下面这种的...
- name: 数据驱动的项目筛选模型
  desc: 用'单账号中位数收益'、'出单率(85%+)'、'200元+达成率(53%)'、'万元级大佬占比(5人/220人)'等量化指标评估项目可行性与陪跑效果，指导决策。
  excerpt:
  - 单账号的中位数收益基本在大几百到 1，2 千的。
  - 拿到收益的，85%以上；拿到 200 元以上的，目前 53%...拿到 1 万元以上的，5 个人
  - 这个项目确实很简单，容易上手，容易出结果，这是最大的原因
theorems:
- name: 执行力筛选大于教学质量定律
  desc: 在低门槛项目中，学员成果主要取决于入场筛选机制(保证金/学费)过滤掉的非执行型人群比例，而非教学内容本身的优劣；运营者核心价值是'排难解惑'而非'手把手喂饭'。
  excerpt:
  - 群内很多人都小伙伴都拿到了结果，是我的能力影响的吗？完全不是。首先是因为这个项目确实很简单...再就是虽然我一开始是免费的，但通过保证金机制，筛选掉了一部分人。
  - 最后才有我这 1% 的因素，帮大家排难解惑，做做后勤等辅助工作的效果。
- name: 风口捕捉能力源于长期积累而非运气论
  desc: 看似抓住风口的暴利，实则是'长期积累(神功/资源) x 窗口期机会'的乘积；普通人应承认能力圈边界，深耕已有优势领域(短视频认知)而非盲目跨界追热点(ChatGPT)。
  excerpt:
  - 明面上看，他们是抓住了风口；实际上，是他们可能早就练就了各种神功，积累了各种资源，只差这一次机会了。
  - 我在 chatGPT 这里，连猪都不配当。
  - 不去羡慕别人，专心练好自己的独门绝技，未来可能也会有一片天地。
- name: 利他长期主义商业伦理
  desc: 拒绝收割低概率成功者的'快钱'，通过筛选机制确保'学员赚钱->运营者收钱'的正向反馈循环，以'负责任的长线钱'替代'一次性收割的短线钱'，建立品牌护城河。
  excerpt:
  - 你没挣到钱，就算我不收钱，你也不会觉得我付出了什么...你挣到钱了，就算我收了钱，你也会觉得值，觉得高兴，这样咱俩都开心。
  - 我更要赚负责任的钱，赚长线的钱。
  - 利他是最大的利己、真诚是最有效的套路
findings:
- name: 陪跑营收益分布实证数据
  desc: '[evidence] 基于220人样本的实测数据：出单率85%以上、200元+达成率53%、1000元+达成率24%、万元级大佬5人(2.3%)，验证了''项目易上手但头部集中''的长尾分布特征。'
  excerpt:
  - 拿到结果的有 90%，...拿到收益的，85%以上；
  - 拿到 200 元以上的，目前 53%（因为不断有新进的）；
  - 拿到 1000 元以上的，24% ... 拿到 1 万元以上的，5 个人
- name: 头部学员增长曲线案例
  desc: '[evidence] 头部学员案例：双账号操作，首月破万，次月(3月19日)已破万，展示了''单账号稳定+矩阵复制''的可复制路径，且获得官方授权后佣金提升确认了项目正规化进程。'
  excerpt:
  - 这个小伙伴应该算是群里收益的头部，做了不到 2 个月，2 个账号加起来，连续每月都过万
  - 这个月（3 月）的收入，我和她聊的时候，是 19 号，这个月破万也是必然的。
  - 后来也拿到了短剧官方直接给的授权，佣金也比原来的渠道稍高一点。
- name: 非执行型学员流失行为模式
  desc: '[evidence] 观测到典型流失路径：进群->未发视频/发布<3条->3天无正反馈->情绪崩溃退群/甩锅运营；且此类人群在高质量社群(生财)中亦存同样比例，证明是人性弱点而非项目/教学问题。'
  excerpt:
  - 有的人做了几天可能连视频还没发，就来找我说不做了。
  - 难道是看见别人进群 2 天就挣了几百块，自己都坚持 3 天了还看不到收益，太委屈自己了？
  - 连生财里这么高质量的人群，航海打卡这种相对简单的要求，都始终有一部分人完不成。
- name: 作者个人商业化验证路径
  desc: '[evidence] 作者从月薪3000打工者->自由职业者->项目实操月入1万+->陪跑变现4万+(含退保证金)->官方授权渠道商的完整进化链条，印证了''实操验证->标准化复制->教学变现->资源整合''的个体商业成长模型。'
  excerpt:
  - 从第一笔 19 块钱，到现在的月入 3W+
  - 项目【收益】，1 万+ ... 陪跑【收款】，4 万+
  - 而且因为生财，我也从月薪 3000，转变为一个自由职业者，慢慢的往创业思维去进化成长的人。
- name: 社群运营边际效应递减规律
  desc: '[claim] 作者宣称通过极致服务(日睡5-6小时、半夜回消息)试图达成100%出单率，但最终认知到''带不动不愿学习的人''，被迫引入筛选机制拒绝低质量客源，证明标准化交付无法解决个体执行力差异，边际投入产出比急剧下降。'
  excerpt:
  - 所以这段时间我真是一天只睡，5，6 个小时，有时候半夜都在给大家回消息。
  - 但现实很快把我打了脸。
  - 后来和一个朋友聊过以后，我也慢慢看开了，有的人真是你再怎么想都带不动，那不如把精力放在更愿意学习和出力的人身上。
