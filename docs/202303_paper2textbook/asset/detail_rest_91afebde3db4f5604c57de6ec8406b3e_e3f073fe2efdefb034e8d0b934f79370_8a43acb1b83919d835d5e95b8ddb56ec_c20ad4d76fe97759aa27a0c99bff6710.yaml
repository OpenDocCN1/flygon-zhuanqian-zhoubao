life_analogy:
- 想象Prompt工程是**给超级实习生（ChatGPT）写工作指令单**：
- '- **三板斧 = 给实习生配三件神器**：结构化逻辑图（计算机语言）、行业专业词典（专业语言）、英文母语环境（英文优势）'
- '- **IPO模型 = 标准化工作单模板**：背景交代、输入素材、操作步骤、交付标准，四缺一不可'
- '- **精准调教模型 = 乐高组件库**：角色、任务、格式、风格、受众……按需拼装，新手拼3块，专家拼7块'
- '- **库内概念 = 调用实习生脑中的‘内置技能’**：说‘文本重写’比‘保持意思换个说法’精准百倍、省时九成'
- '- **RLHF反馈 = 当场指正/点赞**：“这段太夸张，专业点” → 下一版即改；“这版不错” → 固化风格'
- '- **逆向生成 = 给成品看工艺**：手里有爆款笔记 → 拆解结构/人设/钩子 → 反推指令单 → 批量复制'
- '- **分级体系 = 实习生成长阶梯**：只会听懂‘干活’(特定指令) → 懂规范(模板) → 会模仿榜样(示例) → 有角色感(代理) → 有鲜活人设(人设注入)
  → 能独当一面交付成品(混合模式)'
- '- **用户双重前提 = 你自己的基本功**：提问意识=能不能讲清活；知识结构=能不能验收活。实习生再强，指挥官糊涂也白搭。'
summary:
- concept: 调教精度
  desc: 决定ChatGPT能否从‘会聊天’变成‘能干活’的核心杠杆，企业图文团队11人缩减至4人的实战证明
- concept: 三板斧
  desc: 底层认知铁律：计算机逻辑>自然语言、专业术语>通俗表达、英文>中文，结果质量取决于这几个‘更’
- concept: IPO模型
  desc: 借鉴编程Input-Process-Output，将Prompt拆解为背景、输入、指令、输出四强制模块，把对话变编程调用
- concept: 精准调教模型
  desc: 7大要素库（背景/角色/动词任务/输出格式/数据源/风格/受众）乐高式组装，按需取舍覆盖90%场景
- concept: 库内概念调教
  desc: 用模型内置标准词汇（文本重写/摘要生成/代码解释等13类）替代冗长自然语言，Token省90%+、精准度质变
- concept: RLHF式交互反馈
  desc: 将人类偏好内化为交互习惯：即时负向纠偏+正向固化，利用上下文学习机制实现推理期对齐
- concept: 逆向生成优化
  desc: 从期望输出反推Prompt五步法：明确输出→提炼概念→构建问题→优化问题→分步询问，专家级核心技能
- concept: 提示词分级体系
  desc: 六级质量阶梯：特定指令→指令模板→示例模式→代理模式→人设注入代理→混合模式，混合模式达合格博主水准(70-80分)
- concept: 平台化混合模式SOP
  desc: 结构模板+爆款范例+人设指令+原始素材四位一体，小红书/公众号/知乎等平台差异化落地
- concept: 用户双重前提
  desc: 提问意识（清晰表达/筛选信息）+ 知识结构（判断真伪/评估质量）= AI使用上限，短板效应，缺一不可
- concept: 工作流嵌入式AI竞争力
  desc: 领域专业度 × AI工具嵌入深度 = 个人不可替代护城河，HR筛简历/求职者模拟面试/创作者产内容同构
exercises:
- 'no': 1
  title: 三板斧改写实战
  contents:
  - 场景：需要ChatGPT帮你‘把一段口语化的产品介绍改写成专业的商业计划书语言’。
  - 任务1：用自然语言写一版指令（故意写得模糊、通俗）。
  - 任务2：应用三板斧改写：① 用Markdown/伪代码结构化逻辑 ② 替换为专业术语（如‘痛点’→‘用户核心需求’，‘卖点’→‘核心价值主张’） ③ 关键指令英文化。
  - 任务3：对比两版输出的专业度、结构规范性、可用性差异。
  - 思考题：为什么专业术语必须配合‘适度自然语言修饰’？全专业术语会有什么副作用？
- 'no': 2
  title: IPO+精准调教组装练习
  contents:
  - 目标：让ChatGPT生成一篇‘小红书风格’的‘AI工具避坑指南’笔记。
  - 步骤1：搭建IPO骨架——填写背景（目标平台/受众/目的）、输入（核心避坑点素材）、指令（四段式结构/Emoji/标签要求）、输出指示（Markdown格式/字数范围）。
  - 步骤2：从精准调教7要素库中选取3-5个补充细节（如：角色=资深测评博主、风格=犀利干货、受众=想入坑AI的小白）。
  - 步骤3：组装完整Prompt并测试输出。
  - 步骤4：引入1篇爆款范例（示例模式）+ 注入人设（22岁犀利大姐姐），升级为混合模式，再次测试。
  - 对比问题：混合模式相比纯IPO版，在‘人设辨识度’、‘平台规范度’、‘内容详实度’三维度具体提升在哪里？
- 'no': 3
  title: 库内概念替代与RLHF纠偏实战
  contents:
  - 素材：一段300字的‘某新款耳机用户真实使用体验’原文。
  - 任务1：用自然语言长指令（>100字）让ChatGPT‘提取核心卖点、摘要、情感倾向、生成标题’。记录Token消耗与输出质量。
  - 任务2：改用库内概念指令：‘请对输入文本分别做：关键词提取、摘要生成、情感分析、标题生成’。记录Token消耗与输出质量。
  - 任务3：针对任务2的输出，故意挑一个不满意的点（如标题不够吸睛），实施RLHF负向反馈：‘标题太平，用反差+悬念+数字重写5个’。观察即时纠偏效果。
  - 任务4：对满意的输出给予正向反馈：‘这版标题风格很对，后续都按这个风格’。再生成1个新标题，验证风格固化。
  - 复盘问题：库内概念为何能大幅压缩Token？上下文窗口有限时，RLHF反馈会‘遗忘’早期指令，如何缓解？
- 'no': 4
  title: 逆向生成：从爆款反推Prompt
  contents:
  - 给定：一篇真实的小红书万赞爆款笔记（含标题、封面文案、正文结构、人设语气、标签）。
  - 步骤1：明确期望输出——逐段标注该笔记的‘结构骨架’、‘核心钩子’、‘人设关键词’、‘素材来源类型’。
  - 步骤2：提炼关键词概念——将观察到的特征转化为Prompt可执行的指令词（如‘开头3秒钩子’→‘痛点场景化+悬念留白’）。
  - 步骤3：构建问题——组装为‘请帮我写一个同款结构的Prompt，要求包含IPO骨架+人设注入+示例模仿’。
  - 步骤4：优化精简问题——删减冗余、替换为库内概念、英文化关键指令。
  - 步骤5：分步询问——先让ChatGPT输出Prompt骨架，再追加‘补充示例模仿段落’，再追加‘增加平台合规性检查清单’。
  - 验证：用反推出的Prompt让ChatGPT处理新素材，输出是否具备‘同款爆款感’？
- 'no': 5
  title: 双重前提自测：你的提问意识与知识结构在哪级？
  contents:
  - 测试场景：让ChatGPT‘帮我分析某细分行业（如宠物智能硬件）的商业机会’。
  - 维度A·提问意识自测：
  - 1. 你能否一次性给出：目标受众、决策场景、已有数据源、期望输出格式（表格/PPT/报告）、约束条件（字数/保密/引用规范）？
  - 2. 若首轮输出偏泛，你能否在3轮对话内通过结构化追问（而非‘再详细点’）逼近专业深度？
  - 维度B·知识结构自测：
  - 1. 你能判断模型给出的‘市场规模数据’是否为幻觉？知道去哪个权威渠道核实？
  - 2. 你能识别模型‘SWOT分析’中的逻辑漏洞（如机会与优势混淆）？
  - 3. 你能基于行业认知提出‘深度追问’（如‘剔除头部品牌后，腰部玩家的真实毛利结构是怎样的？’）？
  - 评级：双维均强=专家级驾驭者；提问强知识弱=易被幻觉误导；知识强提问弱=得不到想要答案；双弱=放弃使用者。
  - 行动：针对短板，本周完成1次‘结构化提问刻意练习’或阅读1篇行业深度报告补齐知识结构。
