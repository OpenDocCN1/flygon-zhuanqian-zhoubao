paper: docs/202303/W9bkdxL8Iouy7PxPFBMcSP9qnLh.md
desc: 该素材记录了一位Python零基础小白利用GPT-4通过对话式编程，成功攻克CoinMarketCap网站反爬机制，实现9000+加密货币数据（名称、简称、详情链接）全量爬取并自动保存至Excel的完整实战复盘。核心贡献在于总结出一套“最小模型调试+结构化Prompt迭代+异常兜底保存”的AI协作开发范式，详细拆解了从环境配置、Class定位、反爬对抗（动态UA、延迟、断点续爬）到多文件合并的全流程关键节点与避坑指南。
concepts:
- name: 最小模型调试思维
  desc: 一种将复杂爬虫任务拆解为单元素提取、多元素提取、单页提取、多页提取、全量提取的渐进式验证策略，降低调试复杂度，快速定位选择器与逻辑错误。
  is_original: true
  excerpt:
  - 实践了最小模型调试思维，先提取某一个元素的几个数据，再2个/3个元素，然后迭代到整页/多页/全部数据
- name: 结构化需求总结
  desc: 在多轮对话调试结束后，要求AI输出包含目标字段HTML特征（标签、Class、属性）、存储规则、反爬策略、异常处理、库版本约束在内的完整结构化需求文档，用于固化成果、迁移复用或二次开发。
  is_original: true
  excerpt:
  - 根据最新的完整代码，总结一下我的需求，要求准确详细，尤其是Class的所有信息
  - 您需要爬取CoinMarketCap网站前90页的加密货币数据...这些数据对应的HTML class特征如下...爬取过程中需遵循以下要求...
- name: Class双维定位法
  desc: 针对动态网页Class名哈希化、结构嵌套复杂的特点，提出必须同时精准获取HTML标签名与Class值两个维度信息，并通过浏览器开发工具元素面板层层穿透定位的实操方法论。
  is_original: true
  excerpt:
  - 发现Class有两项信息：标签和值，都要求完全准确
  - 在「标签」方面，普通网页里的Class 前面的标签是 div，代码里也默认用这个标签，但提取失败的数据标签是其它的；在「值」方面，也需要多次尝试和确认
- name: 分页级事务性保存
  desc: 将爬虫任务划分为以‘页’为单位的独立事务，每爬取完一页即写入Excel独立Sheet并持久化，配合断点续爬机制，解决长任务中断导致数据全量丢失的风险。
  is_original: true
  excerpt:
  - 每爬取一页数据，将其保存到一个Excel文件的单独sheet中
  - 每提取一页数据，就在Excel 中新建一个 sheet 进行保存，防止抓取到中间时报错一个数据都没保存
- name: 对话式编程
  desc: 非程序员通过自然语言与LLM交互，以‘角色设定->需求陈述->报错反馈->结构分析->代码迭代’为核心循环，完成从零到一的工程级代码生成与调试的新型开发范式。
  is_original: false
  excerpt:
  - 你是一名专业Python 的程序员，可以帮我抓取一个网站的数据吗
  - 出现了以下错误代码，先帮我分析再更新代码
  - 帮我分析可能的原因和解决方案，并更新代码
methods:
- name: __overview__
  desc: 基于GPT-4的对话式爬虫开发全流程方法论：环境就绪 -> 角色预设与结构化首令 -> 最小模型单元验证 -> 错误驱动的结构分析与选择器修正 ->
    反爬策略分层注入 -> 分页事务持久化与断点续爬 -> 结构化需求总结固化 -> 后处理自动化（合并文件）。
  excerpt:
  - 1. 你是一名专业Python 的程序员... 2. 我会发给你一个网址... 3. 网址...需要提取的字段... 4. 出现了以下错误代码，先帮我分析再更新代码
    5. 我发现有两个问题...先帮我分析可能的原因和解决方案... 6. 我分析了网页结构...帮我分析并更新全部代码 ... 10. 我需要提取网站中1-91的数据...
    11. 根据最新的完整代码，总结一下我的需求
- name: 动态User-Agent池伪装
  desc: 利用fake_useragent库在每次请求前动态生成随机User-Agent，模拟真实用户浏览器指纹，对抗网站基于UA的基础反爬识别。
  excerpt:
  - 每次抓取数据前随机生成一个请求头，可以进一步降低反爬识别
  - 在每次请求之前，自动更新User-Agent，使用fake_useragent库生成一个全新的User-Agent
- name: 请求频率控制与节点切换
  desc: 在详情页请求前引入1-3秒随机延迟，降低QPS触发风控；配合代理IP节点切换，缓解IP维度的频率限制。
  excerpt:
  - 在爬取每个加密货币详细信息前，加入1-3秒的延迟，降低请求频率
  - 后面还切换了节点（请求频繁的问题最后也没有完全解决）
- name: 断点续爬与指数退避重试
  desc: 捕获网络/HTTP异常时，自动保存已爬数据，记录成功页码，重试机制设置上限（如100次），从失败页恢复执行，保证长任务鲁棒性。
  excerpt:
  - 遇到错误（需确认只有请求频繁的问题）自动重新运行程序，并从上一次成功提取的下一页开始提取，重试次数设置为 100，可以实现了一次性完成所需数据的提取
- name: 二级页面穿透提取法
  desc: 当列表页数据因前端渲染、加密或结构混淆难以全量提取时，改为解析列表页获取详情页URL，逐个访问详情页提取结构化数据，规避列表页反爬与数据不全问题。
  excerpt:
  - 一级页面无法全量获取...于是决定先调整思路，尝试每一个二级页面去获取，重新获取有效Class 信息更新代码后，成功获取到想要的信息
  - 我准备调整提取思路，从每个代币的详细页面进行提取
- name: PyCharm集成终端环境管理
  desc: 针对小白用户系统环境变量配置缺失导致pip安装失败的问题，指定使用PyCharm内置终端（自动激活项目虚拟环境/Anaconda环境）进行依赖安装，消除路径与权限干扰。
  excerpt:
  - 无法安装 Python 库：作为一名标准的小白，一开始在电脑的「终端」里是没安装成功的（应该是目录没对），进一步“调教”GPT之后，通过直接在Pycharm的「终端」才安装成功
- name: 多Excel文件自动化合并
  desc: 针对分页保存产生的大量单Sheet Excel文件，编写独立脚本利用pandas/openpyxl按表头合并为单一文件，解决人工合并效率低、易出错问题。
  excerpt:
  - 因为按上面提到的第2点进行完善后，会生成90个Excel文件，手动合并这些表格太废手了，新建了一个「Chat」，继续帮我写代码
theorems:
- name: AI协作开发中‘人做决策、AI做实现、人做验收’的分工铁律
  desc: 非专业开发者驾驭LLM编程的核心在于：人负责拆解业务目标、提供结构化上下文（HTML结构、报错堆栈、业务规则）、判断方向正确性；AI负责语法实现、库调用、修补逻辑；人必须具备最小阅读代码与运行调试能力，不能完全甩手。
  excerpt:
  - 代码出错时，最好加上「分析原因」的Prompt，这样有助于提供下一条有效准确的Prompt
  - 亲身体验并领教了ChatGPT的厉害，有问题一定不是它的，多在自己身上找问题
- name: 结构化上下文注入决定生成代码上限
  desc: 向LLM提供的上下文若包含：确切目标URL、具体样本数据（如第1/2/3条真实值）、精准HTML选择器（标签+Class+属性）、运行环境约束、预期输出格式、异常处理规则，则生成代码可用率显著提升；反之则陷入‘猜测-试错’死循环。
  excerpt:
  - 网址：https://coinmarketcap.com/ ，需要提取的字段：代币名称、代币简称和代币名称的链接，在该网页的第1个代币名称是Bitcoin，其代币简称是BTC...
  - 我分析了网页结构，代币名称和代币简称的class代码如下： Bitcoin ， BTC ，帮我分析并更新全部代码
  - 根据最新的完整代码，总结一下我的需求，要求准确详细，尤其是Class的所有信息
- name: 反爬对抗需构建‘应用层+传输层+会话层’纵深防御体系
  desc: 单一反爬手段（仅延迟或仅换UA）极易失效，生产级爬虫必须组合：应用层（动态UA、Referer、Cookie维持）、传输层（代理IP池、TLS指纹伪装）、会话层（随机延迟、人类行为模拟、断点续爬熔断）三层防护。
  excerpt:
  - 在此基础上，我希望考虑两点优化：1、避免请求频繁；2、尽量模拟真实用户
  - 每次抓取数据前随机生成一个请求头... 在爬取每个加密货币详细信息前，加入1-3秒的延迟... 后面还切换了节点... 遇到错误自动重新运行程序，并从上一次成功提取的下一页开始提取
findings:
- name: 列表页选择器失效与数据截断
  desc: '[evidence] 初版代码仅基于列表页提取，导致前10条数据缺失（结构差异）、简称字段全空（Class错误）、仅获取前100条中的90条（翻页/懒加载逻辑缺失），经验证一级页面DOM结构复杂且存在动态渲染差异，直接提取不可靠。'
  excerpt:
  - 只获取了后面90个代币名称，前面10个没有获取到，2、代币简称没有任何数据
  - 提取的数据是我想要的效果，但是只有前10个，这个页面应该有100个代币
- name: 二级详情页结构稳定性优于列表页
  desc: '[evidence] 切换至遍历详情页策略后，通过定位详情页固定Class（全名: sc-1d5226ca-1, 简称: nameSymbol）成功获取全量单页数据，验证了详情页DOM结构相对稳定、数据完整、反爬强度相对较低的特性。'
  excerpt:
  - 调整提取思路，从每个代币的详细页面进行提取... 代币名称和代币简称的class代码如下： Bitcoin BTC... 很好，我已经得到一整页我需要的所有数据了
- name: 分页事务保存+断点续爬实现长任务零数据丢失
  desc: '[evidence] 实测在触发反爬频繁报错（约爬取6页后中断）场景下，引入‘页级保存+重试恢复’机制后，单次运行成功完成90页（9000+条）全量数据采集，生成90个Sheet文件，后经合并脚本整理为单文件，验证了方案工程可用性。'
  excerpt:
  - 在成功提取 6 页数据后...又报错提示请求频繁了，已经提取的 6 页数据页没有保存，于是又让GPT每提取一页数据，就在Excel 中新建一个 sheet
    进行保存
  - 遇到错误...自动重新运行程序，并从上一次成功提取的下一页开始提取，重试次数设置为 100，可以实现了一次性完成所需数据的提取，效果图如下
- name: 动态Class名（哈希化）需运行时动态获取而非硬编码
  desc: '[claim] 素材中提及详情页Class如''sc-1d5226ca-1''疑为CSS-in-JS生成的哈希值，可能随部署版本变更失效。作者未验证长期稳定性，仅在本次会话周期内有效。生产环境需引入选择器自动发现或语义化定位（如data-testid、ARIA属性）降低维护成本。'
  excerpt:
  - 加密货币全名...其class特征为"sc-1d5226ca-1"
  - 加密货币简称...其class特征为"nameSymbol"
- name: PyCharm终端解决小白依赖安装环境隔离难题
  desc: '[evidence] 对比系统终端安装失败（环境变量/路径/权限问题），PyCharm项目终端自动绑定解释器环境，实测可一键安装requests/beautifulsoup4/openpyxl/fake_useragent等依赖，是非专业开发者的最佳实践入口。'
  excerpt:
  - 无法安装 Python 库：作为一名标准的小白，一开始在电脑的「终端」里是没安装成功的...通过直接在Pycharm的「终端」才安装成功
