- name: Automa 部署网络依赖性验证
  desc: '[evidence] 评论区用户反馈无法下载安装 Automa，作者确认为网络环境问题（需科学上网），揭示了该工具链在国内部署的隐性门槛。'
  excerpt:
  - '乐活派 : Automa 怎么加载呀，为什么我一直下载不到浏览器中'
  - '大胡子 : 最可能就是你的网络不是科学的'
