  name: RPA自动化 —— 给非程序员装上"数字员工"
  points:
  - '**为什么需要这个概念？**'
  - '- 高重复、低决策的运营动作（发帖、回邮件、采集数据、分发内容）消耗大量人力，边际成本高'
  - '- 程序员稀缺昂贵，非技术人员无法编写代码自动化，RPA填补了"想自动化但不会代码"的鸿沟'
  - '- 素材定律："RPA降维打击人工成本：对于高重复、低决策的运营动作，RPA自动化的边际成本趋近于零"'
  - '**核心定义**'
  - '- 机器人流程自动化：通过可视化拖拽或录制操作，模拟人工在浏览器/客户端/UI界面的键鼠操作，实现跨系统、跨平台的业务流程自动化'
  - '- 素材架构：影刀RPA/按键精灵/指纹浏览器做"手脚"，ChatGPT API/提示词工程做"大脑"，对接平台API/模拟人工操作做"接口"'
  - '**关键性质**'
  - '- 非侵入式：无需对方系统开放API，直接操作前端界面，适配性极强'
  - '- 低门槛：UIBot Creator可视化模式、影刀RPA拖拉拽，非程序员可上手'
  - '- 可组合：可串联浏览器操作、API调用、文件读写、OCR识别、AI推理等多种能力'
  - '**典型例子**'
  - '- 亚马逊Posts：UIBot 15步流程自动化发布，两店铺稳定跑通，单条人工2-3分钟→RPA边际成本近零'
  - '- 知乎好物：Automa插件遍历草稿箱调用ChatGPT填充回答，人工二次润色发布'
  - '- BOSS直聘：RPA批量发布职位/沟通简历 + ChatGPT生成文案/应对面试，单人公司规模化运作'
  - '- 社媒矩阵：蚁小二一键多平台分发，解决多账号运营效率'
  - '**边界条件**'
  - '- 环境差异是最大变数：浏览器缩放、分辨率、文件路径、网络延迟均需人工跑通一次调试'
  - '- 平台反爬升级：紫鸟浏览器禁止第三方RPA、验证码/风控策略变更需持续维护容错机制'
  - '- 核心原则：先人工跑通验证盈利模型，再引入RPA替代标准化环节，不可为了自动化而自动化'
  - '...'
