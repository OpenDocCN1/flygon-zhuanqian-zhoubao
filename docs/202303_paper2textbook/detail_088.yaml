  name: 长期主义复利论 —— 时间是验证价值的核心变量
  points:
  - '**为什么需要这个概念？**'
  - '- 机会主义频繁切换赛道导致"快速赚钱但无积累"，敏锐度无法替代定力'
  - '- 真正的关注源于"过了这么久你居然还在那里"，初期曝光是噪音，长期存续是信号'
