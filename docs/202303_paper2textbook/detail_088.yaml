  - '- 抗压持久力："普通创业者的唯一核心壁垒是比对手更能扛、活得更久"（元气森林创始人观点）'
  - '- 激情驱动耐力：意志力有限易耗竭，唯有"不挣钱也甘愿做"的激情/使命能穿越死亡谷'
