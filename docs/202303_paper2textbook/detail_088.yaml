- 'no': 12
  name: 场景化素材库 —— 受众共鸣大于产品实拍
  points:
  - '**为什么需要这个概念？**'
  - '- 传统电商思维执着于产品实拍/修图，成本高、周期长、转化不一定好'
  - '- 素材反直觉发现："Posts素材的核心是''受众场景共鸣''而非''产品细节展示''"'
  - '- 无版权图库按人群标签检索的通用场景图，比自行拍摄产品图更高效且转化相关性强'
  - '**核心定义**'
  - '- 不拘泥于自有产品实拍图，而是通过搜索无版权图库，按目标受众画像（教师、司机、护士、父母等）及使用场景关键词批量下载通用场景图作为营销素材'
  - '- 核心逻辑：用户买的是"自己在场景中使用产品的美好预期"，而非产品参数本身'
  - '**关键性质**'
  - '- 成本极低：无版权图库免费/低成本，配合ImageAssistant批量采图插件，素材获取边际成本近零'
  - '- 效率极高：搜索关键词 → 筛选类型/大小 → 全选下载，标准化动作可RPA自动化'
  - '- 转化相关性强：场景图天然承载受众痛点/渴望，引发"这就是我要的生活"共鸣，点击率/转化率更高'
  - '**典型例子**'
  - '- 亚马逊Posts：教师/司机/护士/父母等人群标签场景图，配合产品链接，免费获取精准流量'
  - '- 潮汕牛肉丸抖音策略：批量发布产品相关视频，反正只要有免费流量，就出现产品链接，受众尽可能精准'
  - '- 小红书无货源：醒图改尺寸/滤镜/镜像二创 + 剪映模板套用，素材聚合→二创→套用标准化流水线'
  - '**边界条件**'
  - '- 非标品/高客单/强视觉品类（珠宝、高定、美妆）仍需专业实拍，场景化素材适用于标品/低客单/弱视觉品类'
  - '- 素材需二创规避版权/去重：镜像、调色、裁剪、滤镜、特效、变速等组合处理'
  - '- 平台原创度算法升级需持续迭代去重策略，AI生成素材（Midjourney/Stable Diffusion）成新选项'
  - '...'
  sources:
