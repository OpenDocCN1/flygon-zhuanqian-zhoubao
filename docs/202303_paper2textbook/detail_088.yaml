  name: 私域沉淀 —— 让流量变成可复利的资产
  points:
  - '**为什么需要这个概念？**'
  - '- 公域流量成本递增、不可控、平台规则变动风险高，且难以承载高客单价复杂服务'
  - '- 素材反复强调："流量尽头是微信私域"、"私域为所有公域玩法终局归宿"'
  - '- 高客单价非标服务（咨询、陪诊、定制、高端课程）必须在私域完成信任构建与交付'
  - '**核心定义**'
  - '- 将公域流量（视频号、小红书、抖音、知乎、百家号等）通过钩子（资料包、社群、表白墙、陪诊服务等）引入微信个人号/社群/企微，构建高信任、高复购、可长期运营的用户资产'
  - '- 私域不是终点，而是高LTV（生命周期价值）变现的放大器'
  - '**关键性质**'
  - '- 信任复利：长期累积信任资产支撑高客单快速成交（最快20分钟成交高客单）'
  - '- 可控性：不受平台算法波动影响，用户资产归属自我（需解决账号归属法律协议）'
  - '- 多元变现：同一私域池可承载知识付费、实物电商、服务咨询、分销佣金等多业务线'
  - '**典型例子**'
  - '- 孕晚期妈妈：视频号10天涨粉1000+引流私域，预售课程验证需求'
