- 'no': 7
  name: 赚钱即利他定律 —— 商业本质的底层重构
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人普遍存在"赚别人钱不好意思"的道德负罪感，导致不敢报价、不敢推销、不敢规模化'
  - '- 误将商业视为零和博弈，忽视交易双方均获益的价值创造本质'
  - '- 素材核心金句："商业本质是价值交换，赚钱的核心路径是帮别人解决问题（省钱、省时、赚钱、爽感、安全感）"'
  - '**核心定义**'
  - '- 合法交易必然是双向价值创造：买方感知价值>价格，卖方价格>成本，因此盈利过程即帮人过程'
  - '- 利他越深（解决核心痛点）、覆盖人群越广、频次越高，赚钱越容易、越持久'
  - '**关键性质**'
  - '- 主观价值理论支撑：价值源于用户主观感知而非成本，价格是价值分配的坐标'
  - '- 筛选机制：不追求普度众生，而通过筛选"值得帮"、"适合"的用户，确保双方价值感知匹配'
  - '- 正向循环：真正利他 → 用户获益 → 口碑传播/复购 → 更多利他机会 → 更多收益'
  - '**典型例子**'
  - '- 知识付费：核心价值在于缩短试错周期、跑通标准化流程、规避致命坑点（避坑工具而非致富门票）'
  - '- 陪诊服务：从卖体力进化到卖资源/渠道（绿通/院内制剂/海外就医），深度解决就医难题'
  - '- 同城相亲：信任>流量，服务>营销，三层产品阶梯（活动解决信任→互动群筛选→一对一红娘核心利润）'
  - '- 成人用品即时配送：解决临时/隐私/即时痛点，夜场/酒店/大学城周边核心选址'
  - '**边界条件**'
  - '- 利他不等于无偿：收费建立责任契约倒逼专业交付，同时防止"白嫖"导致心理内耗'
  - '- 必须具备领域专业知识甄别AI幻觉/控制服务质量："懂行才能把AI当实习生使"'
  - '- 避免"巨婴陷阱"：纯付费不参与/纯索取不付出均无法建立真实连接，需等价交换'
  - '...'
