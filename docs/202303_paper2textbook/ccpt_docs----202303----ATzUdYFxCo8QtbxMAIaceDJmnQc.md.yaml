paper: docs/202303/ATzUdYFxCo8QtbxMAIaceDJmnQc.md
desc: 该素材是一份面向零基础用户的 Midjourney 入门操作手册，详细记录了从前期准备（谷歌账号、网络环境）、Discord 账号注册与授权、加入 Midjourney
  服务器、定位新手频道，到使用 `/imagine` 指令生成图片、通过 U/V 按钮进行放大与变化、以及查找生成记录的完整标准化操作流程（SOP），旨在帮助用户在
  1 分钟内完成首张 AI 绘图作品的生成。
concepts:
- name: Discord 交互前端
  desc: Midjourney 采用 Discord 聊天软件作为前端交互界面，用户通过聊天频道输入指令、查看生成进度及结果，而非传统的独立 Web 网页应用界面。
  is_original: false
  excerpt:
  - Midjourney 是一个前端通过discord聊天软件进行外显交互的AI绘图网站，因此在使用的过程中，会需要一个discord的账号
- name: 新手频道
  desc: Discord 服务器中供新用户试用、观察他人出图及进行自己出图操作的公共聊天频道，命名格式为 'newbies-XX'。
  is_original: true
  excerpt:
  - 找到 “ newbies - XX ” 频道，点击进入（每个人的数字不一定相同）
  - 在这里，你就可以看到别人出的图片以及别人出的描述词
- name: U 按钮 (Upscale/放大细化)
  desc: 针对生成的 4 张缩略图中第 N 张，基于该图进行细化并输出单张高分辨率大图的操作按钮（U1-U4）。
  is_original: true
  excerpt:
  - 按钮U：在对应图片的基础上细化，出一张大图
  - 比如我们觉得第三张图更像我们想要的，点一下 U3 按钮 即可 会在第三张图的基础上细化，出大图
- name: V 按钮 (Variation/变化重绘)
  desc: 针对生成的 4 张缩略图中第 N 张，基于该图的构图与风格再生成 4 张新的变体缩略图的操作按钮（V1-V4）。
  is_original: true
  excerpt:
  - 按钮V：在对应图片的基础上再变化出4张新图
- name: /imagine 指令
  desc: Midjourney 核心生成指令，在 Discord 聊天框输入 '/' 触发斜杠命令菜单后选择或输入，用于提交提示词启动图像生成任务。
  is_original: true
  excerpt:
  - 在聊天框打一个 “ / ” 字符，选择出现的 /imagine
  - 接着就可以在这里输入描述词了
- name: 提示词
  desc: 用户输入的英文自然语言描述，指导 AI 生成特定内容、风格、构图的图像。素材强调需用英文输入。
  is_original: false
  excerpt:
  - 输入 “ A rustic little house, Miyazaki style ”
  - 打字结束后按回车，即可在聊天栏出图
methods:
- name: __overview__
  desc: Midjourney 零基础标准化首次使用全流程：准备环境 -> 注册/登录 Discord -> 授权加入 Midjourney 服务器 -> 定位新手频道
    -> 输入 /imagine 指令与提示词 -> 等待生成 4 张缩略图 -> 使用 U/V 按钮进行后续优化 -> 定位并保存最终大图。
  excerpt:
  - 前期准备：① 一个能使用的谷歌账号 ② 可以访问外网
  - ① 点击按钮 ... 接受邀请 ... 进入 discord 界面
  - ③ 左边频道栏 ... 点一下小帆船图标 ... ⑤ 找到 “ newbies - XX ” 频道
  - ⑦ 在聊天框打一个 “ / ” 字符，选择出现的 /imagine ... 输入描述词 ... 按回车
  - ⑧ ... 点一下 U3 按钮 即可 会在第三张图的基础上细化，出大图
- name: 生成结果定位法
  desc: 针对新手频道消息刷新极快导致自己生成的图片难以找到的问题，提供三种定位策略：1. 上下翻动聊天记录；2. 使用搜索栏搜索关键词；3. 点击右侧提及列表中自己的用户名跳转至生成位置。
  excerpt:
  - 加载到100%时，会在最新的聊天记录里出现，需要你回去找（找不到就上下翻找）
  - 实在找不到，就在搜索栏搜索 ... 点你的名字 ... 在右边提及你的部分，点击文字部分，左边就会跳转至你出图的界面
- name: 跨平台复用法
  desc: 二次使用时，无需重复注册授权流程，直接在已登录的 Discord 客户端（电脑端或手机端 App）中找到小帆船图标进入服务器，定位新手频道继续使用
    /imagine 指令出图。
  excerpt:
  - 直接到你的 discord 账户里找小帆船即可
  - 手机端 下载 discord，找到 “ newbies - XX ” 频道，在聊天框打一个 “ /i ” 字符，选择出现的 /imagine 后续操作同电脑端
theorems:
- name: 零门槛极速出图主张
  desc: Midjourney 具备显著的易用性优势：操作流程极其简单（无需复杂参数配置）、出图速度快（约 1 分钟生成 4 张图）、跨平台支持（电脑/手机）、且即使不添加复杂修饰词也能随机生成高质量精美图片。
  excerpt:
  - 它的显著特点是使用过程更简单，出图更精致更绚丽，出图速度快，电脑、手机端都可以使用。
  - 真正的1分钟出图，在不加任何修饰语的情况下，也会随机生成非常好看的图片，操作界面也很友好。
- name: 公共频道观摩学习主张
  desc: 新手频道的公开性（可见他人提示词及生成结果）是降低学习门槛、积累提示词词汇量的核心机制，建议新用户通过观摩他人案例快速上手。
  excerpt:
  - 在这里，你就可以看到别人出的图片以及别人出的描述词
  - 手册使用说明：本文旨在向你展示 AI 绘图的入门场景，帮助你更好地打好基础和补充相关词汇量。
findings:
- name: 首图生成验证案例
  desc: '[evidence] 使用新注册账号 ''灰栗子'' 在新手频道输入提示词 ''A rustic little house, Miyazaki style''，成功在约
    1 分钟内生成 4 张缩略图，并通过 U3 按钮成功输出单张高清大图，验证了全流程 SOP 的有效性与 ''1分钟出图'' 的时效承诺。'
  excerpt:
  - （新申请了一个叫做灰栗子的账号，专门用来演示）
  - 输入 “ A rustic little house, Miyazaki style ” ... 打字结束后按回车，即可在聊天栏出图
  - 会慢慢出4张图，大约1分钟左右出完 ... 加载到100%时，会在最新的聊天记录里出现
  - 比如我们觉得第三张图更像我们想要的，点一下 U3 按钮 即可 会在第三张图的基础上细化，出大图
- name: 新手频道消息淹没痛点
  desc: '[evidence] 实测发现新手频道消息刷新极快，生成完成的图片极易被他人消息覆盖导致用户找不到自己的生成结果，必须依赖搜索或 ''@提及''
    列表才能高效定位。'
  excerpt:
  - 加载到100%时，会在最新的聊天记录里出现，需要你回去找（找不到就上下翻找）
  - 实在找不到，就在搜索栏搜索 ... 点你的名字 ... 在右边提及你的部分，点击文字部分，左边就会跳转至你出图的界面
