paper: docs/202303/20230328_120.md
desc: 该素材分享了作者基于调教 200 多个 ChatGPT 模型的实战经验，核心主张“调教精度”是决定 ChatGPT 能否转化为真正生产力的关键因素，并提出了“三板斧”核心方法论：即模型虽能识别自然语言/中文，但更擅长计算机语言逻辑、专业语言及英文。文章承诺分为两部分，第一部分详解三板斧，第二部分提供
  6 个可直接使用的调教方法，但当前素材仅包含第一部分的理论框架引入。
concepts:
- name: 调教精度
  desc: 指通过精细化的提示工程手段，将通用大语言模型的输出质量、逻辑性及专业度提升至可直接投入生产应用标准的过程与结果度量。
  is_original: true
  excerpt:
  - 我认为在 ChatGPT 使用门槛不断降低的情况下，决定能否将其转化为真正生产力的决定因素就是“调教精度”。
- name: 三板斧
  desc: 作者总结的 ChatGPT 核心提示工程三大原则：1. 计算机语言逻辑优于自然语言逻辑；2. 专业语言优于自然语言；3. 英文优于中文。
  is_original: true
  excerpt:
  - 它们分别是：1.它能识别自然语言逻辑的描述，但它更擅长识别计算机语言逻辑的描述；2.它能识别自然语言，但它更擅长专业语言；3.它能识别中文，但它更擅长英文；
- name: 计算机语言逻辑描述
  desc: 使用类代码、结构化标记（如 Markdown、JSON、伪代码）或严格逻辑指令（如步骤分解、条件判断）替代模糊自然语言指令，以提升模型推理准确性。
  is_original: false
  excerpt:
  - 它能识别自然语言逻辑的描述，但它更擅长识别计算机语言逻辑的描述
- name: 专业语言
  desc: 在特定垂直领域任务中，使用该领域标准术语、范式及专业框架进行提示，而非通俗大白话，以激发模型深层领域知识。
  is_original: false
  excerpt:
  - 它能识别自然语言，但它更擅长专业语言
- name: 英文提示优势
  desc: 基于模型训练语料分布特性，使用英文提示词通常能获得比中文更高质量、更稳定、Token 消耗更低的输出结果。
  is_original: false
  excerpt:
  - 它能识别中文，但它更擅长英文
methods:
- name: __overview__
  desc: 整体方法论框架：确立“调教精度”为核心目标，遵循“三板斧”三大原则（计算机逻辑、专业语言、英文优先），指导后续 6 个具体调教方法的落地执行。
  excerpt:
  - 本文整体结构分为 2 部分，第一部分：三板斧的详细解释和使用方法，第二部分：6 个可以直接使用的调教方法。
  - 最终，结果质量的好坏、精准度很大程度上取决于这几个“更”。
theorems:
- name: 生产力转化决定因子定理
  desc: 在大模型使用门槛普降的背景下，模型能否成为真正生产力的关键不再是“会不会用”，而是“调教精度”的高低。
  excerpt:
  - 我认为在 ChatGPT 使用门槛不断降低的情况下，决定能否将其转化为真正生产力的决定因素就是“调教精度”。
- name: 三板斧效能定理
  desc: ChatGPT 输出结果的质量与精准度，主要取决于提示词在三个维度的“更”：逻辑描述的计算机化程度、语言的专业化程度、交互语言的英文化程度。
  excerpt:
  - 最终，结果质量的好坏、精准度很大程度上取决于这几个“更”。
- name: 模型语言偏好假设
  desc: ChatGPT 虽具备多语言及自然语言理解能力，但其深层推理、指令遵循及知识激活能力在计算机语言、专业术语及英文语境下表现显著优于自然语言、通俗语及中文语境。
  excerpt:
  - 它能识别自然语言逻辑的描述，但它更擅长识别计算机语言逻辑的描述；它能识别自然语言，但它更擅长专业语言；它能识别中文，但它更擅长英文
findings:
- name: 实战规模验证
  desc: '[claim] 作者基于近 4 个月时间、调教 200 多个模型的大规模实战样本，总结出上述方法论。'
  excerpt:
  - 从去年 12 月布局 ChatGPT 的应用到现在已经将近快 4 个多月了。
  - 经验：调教 200 多个 ChatGPT 模型后的经验分享
