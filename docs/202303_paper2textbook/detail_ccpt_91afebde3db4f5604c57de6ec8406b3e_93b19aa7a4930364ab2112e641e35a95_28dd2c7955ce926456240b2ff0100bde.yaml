units:
- 'no': 1
  name: 生财认知 —— 社群核心知识体系的入口索引
  points:
  - '**为什么需要这个概念？**'
  - '- 社群内部沉淀了大量碎片化的实战经验与认知模型，缺乏统一的结构化入口'
  - '- 学习者面对海量信息无从下手，需要一个『知识地图』快速定位核心版块'
  - '**核心定义**'
  - '- 『生财认知』是生财有术社群核心知识体系的四大支柱模块之一（另三为：生财技能、生财心态、微信专题）'
  - '- 本质是社群对外部商业世界的底层逻辑抽象与内部实战规律的归纳总结'
  - '**关键性质**'
  - '- 结构性锚点：标识了社群知识体系的『认知层』边界，区别于『技能层』与『心态层』'
  - '- 索引页空心化：当前素材仅存标题与外链，核心内容寄宿于语雀外部文档，存在链接失效导致知识资产永久流失的风险'
  - '- 外链依赖：反映社群早期知识沉淀以『链接分发』为主、 『本地归档』为辅的策略缺陷'
  - '**典型例子**'
  - '- 素材 docs/202303/20230328_007.md 与 docs/202303/20230328_091.md 均为『生财认知』索引页，标题相同但指向不同语雀文档，暗示认知模块可能包含多个子专题或版本迭代'
  - '**边界条件**'
  - '- 仅作为结构性入口存在，不包含具体认知模型（如『赚钱即利他』、『壁垒决定收益』等）的实质内容'
  - '- 无法直接用于教学正文写作，必须溯源至语雀原文档方可获取核心论点'
  - '- 需配合『生财技能』『生财心态』三模块共同构成完整知识地图骨架'
  sources:
  - paper: docs/202303/20230328_007.md
    role: origin
  - paper: docs/202303/20230328_091.md
    role: origin
  excerpts:
  - 生财认知
  - 原文链接：https://www.yuque.com/for_lazy/thfiu8/xxxxxx (具体链接因素材为空心索引页，以实际语雀文档为准)
- 'no': 2
  name: 生财技能 —— 可复制、可标准化的实战操作手册集
  points:
  - '**为什么需要这个概念？**'
  - '- 认知只解决『懂什么』，技能解决『怎么做』，是变现的直接杠杆'
  - '- 社群强调『SOP复制放大论』，需将零散战术沉淀为标准化技能库'
  - '**核心定义**'
  - '- 『生财技能』是生财有术社群知识体系四大支柱模块之一，聚焦于具体的操作方法论、工具使用、流程SOP、执行战术'
  - '- 涵盖：AI工具调教、RPA自动化搭建、跨平台内容生产、选品测款、私域运营、直播话术等可量化、可迁移的硬技能'
  - '**关键性质**'
  - '- 可标准化：核心主张『君子性非异也，善假于物也』，将技能封装为工具、脚本、模板、清单，降低对个人天赋的依赖'
  - '- 组合创新载体：技能模块是『组合创新』的积木单元（如 ChatGPT + RPA + 指纹浏览器 = 自动化获客线）'
  - '- 索引页空心化：素材 docs/202303/20230328_013.md 与 docs/202303/20230328_102.md 仅为标题与外链，核心技能清单寄宿于语雀文档'
  - '**典型例子**'
  - '- 『UIBot Creator可视化流程搭建实操』（15步详细指南）'
  - '- 『ImageAssistant批量采图工作流』（标准化动作序列）'
  - '- 『双拼输入法：一下午入门、一月精通的终身效率复利』'
  - '**边界条件**'
  - '- 技能有效期受平台规则迭代、工具版本更新影响大，需持续迭代维护'
  - '- 仅掌握技能而无『生财认知』指导方向、无『生财心态』支撑长期主义，易陷入『工具中毒』与『战术勤奋战略懒惰』'
  - '- 当前素材无法直接提取具体技能清单，需溯源语雀文档'
  sources:
  - paper: docs/202303/20230328_013.md
    role: origin
  - paper: docs/202303/20230328_102.md
    role: origin
  excerpts:
  - 【生财技能】
  - 原文链接：https://www.yuque.com/for_lazy/thfiu8/xxxxx (需溯源语雀获取完整技能清单与SOP细则)
- 'no': 3
  name: 生财心态 —— 穿越周期的心理基建与反脆弱内核
  points:
  - '**为什么需要这个概念？**'
  - '- 创业/副业过程中面临巨大的不确定性、挫折感、孤独感与认知冲突，技能与认知不足以支撑长期行动'
  - '- 需要一套处理『恐惧、焦虑、迷茫、嫉妒、虚荣』等负面情绪的内功心法，将外部波动转化为内部成长燃料'
  - '**核心定义**'
  - '- 『生财心态』是生财有术社群知识体系四大支柱模块之一，聚焦于心理建设、认知重塑、习惯养成、长期主义践行'
  - '- 核心主张：过程即奖赏、失败常态化、首个正反馈确立信心、耐心克制恐惧、21天定律重塑习惯'
  - '**关键性质**'
  - '- 认知与行动的桥梁：心态决定能否『相信才能看见』→『看见即相信』→『六十分即冲』完成行动闭环'
  - '- 反脆弱机制：通过『航海打卡』『公开输出』『复盘沉淀』构建微型确定性系统，对抗外部混沌'
  - '- 索引页空心化：素材 docs/202303/20230328_031.md 与 docs/202303/20230328_112.md 仅为标题与外链，核心心法体系寄宿于语雀文档'
  - '**典型例子**'
  - '- 『21天定律：打破创业孤独内耗的最小可行性周期』'
  - '- 『执行力四驱模型：目标驱动+持续执行+自我激励+圈层正反馈』'
  - '- 『炸弹思维：极限压力测试激发潜在执行力』'
  - '- 『新生五阶段规律：认知冲突→信任危机→迷茫试错→逃避退出→焦虑回流』'
  - '**边界条件**'
  - '- 心法无法直接变现，必须结合具体项目（认知）与执行动作（技能）才能产生化学反应'
  - '- 易陷入『心灵鸡汤』陷阱，需警惕将『心态好』等同于『结果好』的幸存者偏差'
  - '- 当前素材仅为索引，具体心法细节需溯源语雀文档'
  sources:
  - paper: docs/202303/20230328_031.md
    role: origin
  - paper: docs/202303/20230328_112.md
    role: origin
  excerpts:
  - 【生财心态】
  - 原文链接：https://www.yuque.com/for_lazy/thfiu8/xxxxx (需溯源语雀获取完整心法体系与心理建设工具包)
- 'no': 4
  name: 微信专题 —— 私域流量操作系统的底层基建与生态规则
  points:
  - '**为什么需要这个概念？**'
  - '- 微信生态（个人号、企微、群、视频号、小程序、支付）是几乎所有中国本土商业变现的『最终归宿』'
  - '- 平台规则隐晦、风控不可控、功能迭代快，缺乏系统性认知极易触碰红线导致账号资产归零'
  - '**核心定义**'
  - '- 『微信』专题是生财有术社群知识体系四大支柱模块中的专项专题，专门解决私域流量的『引、留、转、裂』全链路技术与策略问题'
  - '- 覆盖：防封养号、指纹浏览器/IP隔离、企微搭建、视频号直播切片、小程序矩阵、支付合规、私域SOP等'
  - '**关键性质**'
  - '- 基建属性：不直接产生业务增量，但决定业务上限与生存周期（如『指纹浏览器+IP隔离』是矩阵账号运营的必要非充分条件）'
  - '- 生态闭环：微信内部各能力（视频号引流→企微沉淀→群运营→小程序支付）强绑定，跨平台（抖音/小红书）引流微信是核心动作'
  - '- 索引页空心化：素材 docs/202303/20230328_053.md 仅为标题与外链，核心生态图谱与防坑指南寄宿于语雀文档'
  - '**典型例子**'
  - '- 『指纹浏览器与代理IP防关联体系』（静态服务器IP vs 动态住宅IP 部署方案对比）'
  - '- 『视频号私域自动化引流闭环：视频号→微信客服→企业微信→个人微信无人值守全链路』'
  - '- 『小程序多端矩阵：uni-app一次开发多端分发，年成本≤5000元』'
  - '**边界条件**'
  - '- 微信规则属于『黑箱』，所有技巧均为经验性总结，无官方文档背书，存在随时失效风险'
  - '- 合规红线收紧趋势下，『技术破解』路径走窄，『内容/服务/信任』合规路径成主流'
  - '- 当前素材仅为索引，具体防封参数、运营SOP、工具配置需溯源语雀文档'
  sources:
  - paper: docs/202303/20230328_053.md
    role: origin
  excerpts:
  - 【微信】
  - 原文链接：www.yuque.com/for_lazy/thfiu8/ewhp4bru34kzbq23 (需溯源语雀获取完整微信生态操作地图与合规红线清单)
