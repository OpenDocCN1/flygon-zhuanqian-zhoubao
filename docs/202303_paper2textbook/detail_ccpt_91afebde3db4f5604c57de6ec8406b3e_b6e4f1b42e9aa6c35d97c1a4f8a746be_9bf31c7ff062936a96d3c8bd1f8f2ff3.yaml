  - paper: docs/202303/Zl9zdlsffoXMOIxIk9Ac0sIenje.md
    role: apply
  excerpts:
  - 你是一名专业Python 的程序员，可以帮我抓取一个网站的数据吗
  - 出现了以下错误代码，先帮我分析再更新代码
  - 帮我分析可能的原因和解决方案，并更新代码
  - 根据最新的完整代码，总结一下我的需求，要求准确详细，尤其是Class的所有信息
  - 一个项目一个chat：之前我都是遇见了一个问题，就开一个chat。在实操中也发现，它的上下文理解的连续性很好...就不需要再额外地垫很多信息，它也能结合上下文去回答你的问题了。
  - 如何调教 ChatGPT 并实现抓取？
  - 3.1 聊天问题梳理 3.2 Prompt 完善 3.3 需求总结
- 'no': 6
  name: 反爬纵深防御体系 —— 应用层+传输层+会话层三位一体的生存法则
  points:
  - '**为什么需要这个概念？**'
  - '- 单一反爬手段（仅延迟、仅换 UA、仅换 IP）极易被识别穿透，导致任务中断、账号封禁、IP 拉黑'
  - '- 素材实战中：仅加延迟 -> 触发频控；加延迟+换 UA -> 仍触发频控；加延迟+换 UA+切代理节点 -> 仍不稳定；最终引入“分页事务保存+断点续爬+指数退避”才在会话层实现鲁棒性'
  - '- 非程序员不懂网络协议、TLS 指纹、浏览器指纹，需一套“可理解、可配置、可组装”的防御清单'
  - '**核心定义**'
  - "- 构建三层纵深防御体系：\n  1. 应用层：动态 User-Agent（fake_useragent）、Referer 伪造、Cookie 维持、请求头随机化\n\
    \  2. 传输层：代理 IP 池（住宅/数据中心）、TLS 指纹伪装、连接复用控制\n  3. 会话层：随机延迟（1-3s/指数退避）、人类行为模拟（鼠标轨迹/点击间隔）、分页事务性保存、断点续爬熔断机制"
  - '**关键性质**'
  - '- 分层解耦：每层解决不同维度的识别特征，单层失效不导致整体崩溃'
  - '- 成本递增：应用层成本最低（库调用），传输层中等（买代理），会话层最高（时间成本、逻辑复杂度）'
  - '- 鲁棒性 = 最弱环节：若会话层无断点续爬，前两层再强也无法防止“中断即全丢”'
  - '**典型例子**'
  - '- 素材实战组合拳：`fake_useragent` 动态 UA + `1-3秒随机延迟` + `代理节点切换` + `每页建 Sheet 落盘` + `异常捕获重试
    100 次`，最终实现 90 页全量无损采集'
  - '**边界条件**'
  - '- 面对 WAF（Web应用防火墙）、行为分析型反爬（如 Cloudflare、DataDome）、图像/滑块验证码，该体系仍显无力，需引入无头浏览器、验证码打码平台、浏览器指纹伪装等重武器'
  - '- 代理 IP 质量、成本、稳定性是传输层核心变量，免费代理不可用于生产环境'
  - '...'
  sources:
