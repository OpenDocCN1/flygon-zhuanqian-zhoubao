- 'no': 7
  name: 二级页面穿透提取法 —— 绕过列表页反爬直击详情页数据源
  points:
  - '**为什么需要这个概念？**'
  - '- 列表页常采用虚拟滚动、懒加载、前端渲染、数据加密、DOM 结构混淆等手段，导致直接提取极其困难（素材中前 10 条缺失、简称全空、仅 90 条）'
  - '- 详情页通常为服务端渲染（SSR）、结构固定、数据完整、反爬强度相对较低，是更优的数据源入口'
  - '- 非程序员不会写复杂的列表页解析逻辑，但会“点详情页链接”，该方法将“人会的操作”转化为“爬虫逻辑”'
  - '**核心定义**'
  - "- 策略转换：放弃在列表页直接提取目标字段，改为：\n  1. 列表页仅提取“详情页 URL 列表”\n  2. 遍历详情页 URL，逐个访问并提取结构化目标数据\n\
    \  3. 聚合所有详情页数据为最终结果集"
  - '- 核心前提：列表页能稳定获取详情页入口链接（通常为 `<a href>` 且结构固定）'
  - '**关键性质**'
  - '- 降维打击：将“解析复杂列表页”降级为“提取简单链接”，利用详情页结构稳定性规避列表页反爬'
  - '- 请求量放大：N 个目标需 N+1 次请求（1次列表 + N次详情），需配合会话层防御（延迟、代理、断点续爬）控制成本与风险'
  - '- 数据完整性高：详情页通常包含列表页无法展示的完整字段（如完整描述、多图、参数表）'
  - '**典型例子**'
  - '- 素材实战：列表页提取失败后，切换至“遍历详情页”策略，定位 `h1.sc-1d5226ca-1` 和 `span.nameSymbol`，单页 100
    条全量获取，最终 90 页全胜'
  - '**边界条件**'
  - '- 若详情页同样采用强反爬（加密、动态渲染、需登录），该方法失效'
  - '- 请求量放大 N 倍，目标站点若有严格 IP 限流，需配备大规模代理池，成本显著上升'
  - '- 不适用于“仅需列表页汇总字段、不需详情” 的轻量任务，属于过度设计'
  - '...'
