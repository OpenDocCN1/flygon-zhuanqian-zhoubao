units:
- 'no': 1
  name: 最小模型调试思维 —— 让复杂工程拆解为可验证的微步骤
  points:
  - '**为什么需要这个概念？**'
  - '- 非程序员面对完整爬虫/自动化需求时，代码量大、逻辑深、反爬多，一次性让 AI 生成全量代码极易失败'
  - '- 传统编程教学强调“先设计再编码”，但 AI 协作模式下，人类不具备架构设计能力，需通过“跑通最小单元 -> 逐层叠加”的方式降低认知负荷'
  - '- 素材中作者从“提取单个元素”开始，迭代至“全量 9000+ 数据”，验证了该思维对小白的必要性'
  - '**核心定义**'
  - '- 将复杂工程任务拆解为：单元素提取 → 多元素提取 → 单页提取 → 多页提取 → 全量提取 的五级渐进验证链路'
  - '- 每一级只解决一个核心问题（如选择器定位、翻页逻辑、反爬对抗），跑通后再进入下一级'
  - '**关键性质**'
  - '- 容错性强：单级失败不影响已验证的上一级成果'
  - '- 反馈快：单元素/单页级别运行耗时极短，能在分钟级获得正反馈'
  - '- 可迁移：该拆解逻辑适用于爬虫、自动化测试、数据清洗等所有“批量处理”型工程任务'
  - '**典型例子**'
  - '- 素材实战：CoinMarketCap 爬虫开发，先搞定“提取第 1 个币的名称和简称”，再解决“前 10 个缺失”，再解决“翻页只抓 90 条”，最后解决“反爬中断与数据丢失”'
  - '**边界条件**'
  - '- 仅适用于“目标明确、可分步验证”的工程任务，不适用于需整体架构设计的系统级开发（如微服务拆分、高并发架构）'
  - '- 要求人类具备“运行代码、看懂报错、定位 HTML 结构”的最低执行能力'
  - '...'
  sources:
  - paper: docs/202303/W9bkdxL8Iouy7PxPFBMcSP9qnLh.md
    role: origin
  excerpts:
  - 实践了最小模型调试思维，先提取某一个元素的几个数据，再2个/3个元素，然后迭代到整页/多页/全部数据
  - 只获取了后面90个代币名称，前面10个没有获取到，2、代币简称没有任何数据
  - 提取的数据是我想要的效果，但是只有前10个，这个页面应该有100个代币
  - 调整提取思路，从每个代币的详细页面进行提取... 代币名称和代币简称的class代码如下： Bitcoin BTC... 很好，我已经得到一整页我需要的所有数据了
  - 在成功提取 6 页数据后...又报错提示请求频繁了，已经提取的 6 页数据页没有保存，于是又让GPT每提取一页数据，就在Excel 中新建一个 sheet
    进行保存
  - 遇到错误...自动重新运行程序，并从上一次成功提取的下一页开始提取，重试次数设置为 100，可以实现了一次性完成所需数据的提取
- 'no': 2
  name: 结构化需求总结 —— 将 AI 协作成果固化为可复用的工程规格书
  points:
  - '**为什么需要这个概念？**'
  - '- AI 协作开发中，上下文窗口有限，长对话易丢失关键决策细节（选择器、参数、异常规则）'
  - '- 非程序员无法阅读完整代码进行维护，需一份“自然语言版需求文档”作为验收标准与二次开发蓝本'
  - '- 素材中作者在最后要求 GPT “根据最新完整代码，总结我的需求，要求准确详细，尤其是 Class 的所有信息”，即为生成该总结'
  - '**核心定义**'
  - '- 在多轮调试结束后，要求 AI 输出包含：目标 URL、目标字段、样本真实值、HTML 选择器特征（标签+Class+属性）、存储规则、反爬策略、异常处理规则、库版本约束、运行环境要求的结构化文档'
  - '- 本质是软件工程中“需求规格说明书 (SRS)”的轻量化、自然语言化版本'
  - '**关键性质**'
  - '- 固化成果：将隐性在对话历史中的工程决策显性化，防止上下文截断导致的知识丢失'
  - '- 迁移复用：同一需求总结可直接喂给新会话/新模型/新人类开发者，实现“无损交接”'
  - '- 反向约束：倒逼人类在调试阶段就必须提供精准上下文（HTML片段、报错堆栈），否则无法生成高质量总结'
  - '**典型例子**'
  - "- 素材实战输出的结构化需求总结（节选）：\n  - 目标：爬取 CoinMarketCap 前 90 页加密货币数据\n  - 字段：名称、简称、详情链接\n\
    \  - HTML Class 特征：全名 class=\"sc-1d5226ca-1\"，简称 class=\"nameSymbol\"\n  - 反爬策略：动态\
    \ UA、1-3秒随机延迟、代理IP切换、分页事务保存、指数退避重试\n  - 输出：每页一个 Sheet，最终合并为单文件"
  - '**边界条件**'
  - '- 依赖于调试过程的“充分暴露细节”，若调试中大量使用模糊指令（如“帮我优化一下”），生成的总结将失真'
  - '- 无法替代代码本身，仅作为“人类可读、AI 可执行”的中间表示'
  - '...'
  sources:
  - paper: docs/202303/W9bkdxL8Iouy7PxPFBMcSP9qnLh.md
    role: origin
  excerpts:
  - 根据最新的完整代码，总结一下我的需求，要求准确详细，尤其是Class的所有信息
  - 您需要爬取CoinMarketCap网站前90页的加密货币数据...这些数据对应的HTML class特征如下...爬取过程中需遵循以下要求...
  - 网址：https://coinmarketcap.com/ ，需要提取的字段：代币名称、代币简称和代币名称的链接，在该网页的第1个代币名称是Bitcoin，其代币简称是BTC...
  - 我分析了网页结构，代币名称和代币简称的class代码如下： Bitcoin ， BTC ，帮我分析并更新全部代码
- 'no': 3
  name: Class 双维定位法 —— 破解动态网页选择器失效的精准锚定术
  points:
  - '**为什么需要这个概念？**'
  - '- 现代前端框架（React/Vue/CSS-in-JS）生成的 Class 名多为哈希值（如 `sc-1d5226ca-1`），极不稳定，传统“复制 Class
    名”法极易失效'
  - '- 列表页因虚拟滚动、懒加载、广告插入导致 DOM 结构频繁变动，单纯靠 Class 值定位极其脆弱'
  - '- 素材中作者发现“Class 有两项信息：标签和值，都要求完全准确”，并通过“元素面板层层穿透”解决了详情页定位难题'
  - '**核心定义**'
  - '- 定位任意网页元素时，必须同时获取并验证两个维度：HTML 标签名（如 `div`、`span`、`h1`）与 Class 属性值（如 `nameSymbol`）'
  - '- 并通过浏览器开发者工具“元素面板”层层展开父节点，确认该元素在 DOM 树中的相对稳定位置（如：第 2 个 `tr` 下的第 1 个 `td` 下的
    `span`）'
  - '**关键性质**'
  - '- 标签名相对稳定：语义化标签（`h1`、`table`、`a`）极少变动，可作为一级锚点'
  - '- Class 值需运行时确认：哈希化 Class 需在每次调试/运行时通过开发者工具获取当前有效值，不可硬编码'
  - '- 结构路径 > 单一选择器：基于“父子兄层级关系”的 XPath/CSS Path 比单一 Class 选择器鲁棒性高得多'
  - '**典型例子**'
  - '- 素材实战：列表页 `div` 标签+哈希 Class 导致前 10 条缺失、简称全空；切换至详情页，定位 `h1.sc-1d5226ca-1`（全名）和
    `span.nameSymbol`（简称），结构稳定、全量获取'
  - '**边界条件**'
  - '- 若目标网站采用 Shadow DOM、Canvas 渲染或严重加密混淆，该方法失效，需转向无头浏览器/图像识别/协议逆向'
  - '- 需人类具备“打开 F12、找到 Elements 面板、会点击元素审查”的基础操作技能'
  - '...'
  sources:
  - paper: docs/202303/W9bkdxL8Iouy7PxPFBMcSP9qnLh.md
    role: origin
  excerpts:
  - 发现Class有两项信息：标签和值，都要求完全准确
  - 在「标签」方面，普通网页里的Class 前面的标签是 div，代码里也默认用这个标签，但提取失败的数据标签是其它的；在「值」方面，也需要多次尝试和确认
  - 一级页面无法全量获取...于是决定先调整思路，尝试每一个二级页面去获取，重新获取有效Class 信息更新代码后，成功获取到想要的信息
  - 我准备调整提取思路，从每个代币的详细页面进行提取
  - 代币名称和代币简称的class代码如下： Bitcoin ， BTC ，帮我分析并更新全部代码
  - 很好，我已经得到一整页我需要的所有数据了
- 'no': 4
  name: 分页级事务性保存 —— 让长任务拥有“存档点”与“断点续爬”能力
  points:
  - '**为什么需要这个概念？**'
  - '- 爬虫/批量任务耗时长（素材中 90 页需数小时），中途遭遇反爬、断网、服务器重启、内存溢出等异常概率极高'
  - '- 默认“内存累积 -> 最后一次性写入”模式，一次中断导致前功尽弃，素材中作者前 6 页数据因未保存而全丢，痛定思痛引入此机制'
  - '- 非程序员不懂数据库事务、Checkpoint 机制，需将“页”这一业务天然边界映射为“事务边界”'
  - '**核心定义**'
  - '- 以“页”为最小事务单元：每爬取完一页数据，立即写入 Excel 独立 Sheet 并持久化落盘'
  - '- 记录“已成功完成的最大页码”作为断点续爬的恢复起点'
  - '- 配合“指数退避重试”（如最多重试 100 次），在异常恢复后自动从失败页继续执行'
  - '**关键性质**'
  - '- 零数据丢失：已落盘的页级数据物理隔离，后续异常不影响历史成果'
  - '- 可观测性强：Excel 多 Sheet 结构天然可视化进度，人类可随时打开查看“已跑到第几页”'
  - '- 成本极低：利用 `openpyxl`/`pandas` 追加写入 Sheet，无需引入数据库、Redis 等中间件'
  - '**典型例子**'
  - '- 素材实战：引入“每页建 Sheet + 断点续爬”后，单次运行成功完成 90 页（9000+ 条）全量采集，生成 90 个 Sheet 文件，后经合并脚本整理为单文件'
  - '**边界条件**'
  - '- 仅适用于“按页/按批次”天然分段的任务；流式、增量、实时任务需引入 WAL/消息队列等专业组件'
  - '- Excel 单文件 Sheet 数上限（约 65535）与文件体积限制，超大规模任务需分文件存储'
  - '...'
  sources:
  - paper: docs/202303/W9bkdxL8Iouy7PxPFBMcSP9qnLh.md
    role: origin
  excerpts:
  - 每爬取一页数据，将其保存到一个Excel文件的单独sheet中
  - 每提取一页数据，就在Excel 中新建一个 sheet 进行保存，防止抓取到中间时报错一个数据都没保存
  - 在成功提取 6 页数据后...又报错提示请求频繁了，已经提取的 6 页数据页没有保存，于是又让GPT每提取一页数据，就在Excel 中新建一个 sheet
    进行保存
  - 遇到错误（需确认只有请求频繁的问题）自动重新运行程序，并从上一次成功提取的下一页开始提取，重试次数设置为 100，可以实现了一次性完成所需数据的提取，效果图如下
- 'no': 5
  name: 对话式编程范式 —— 非程序员的“自然语言即接口”开发新范式
  points:
  - '**为什么需要这个概念？**'
  - '- 传统编程要求人类掌握语法、数据结构、算法、框架、部署，门槛极高，绝大多数领域专家被挡在门外'
  - '- LLM 将“编程接口”从 Python/Java 等形式语言降维为自然语言，但非程序员仍不会“提问”，导致生成代码不可用'
  - '- 素材总结出一套标准化对话循环：角色预设 -> 结构化首令 -> 报错反馈 -> 结构分析 -> 代码迭代 -> 需求总结，使小白也能驾驭 GPT-4
    完成工程级开发'
  - '**核心定义**'
  - '- 人类作为“产品经理+架构师+测试工程师”，通过自然语言驱动 AI 完成“程序员+调试员+文档员”工作'
  - "- 标准对话循环 6 步：\n  1. 角色设定：`你是一名专业 Python 程序员...`\n  2. 结构化首令：目标 URL、目标字段、样本真实值、输出格式\n\
    \  3. 报错全文反馈：复制完整 Traceback + 当前代码版本\n  4. 结构分析追问：`帮我分析可能的原因和解决方案，并更新代码`\n  5.\
    \ 上下文注入：喂入 HTML 片段、选择器、业务规则\n  6. 需求总结固化：生成结构化需求文档"
  - '**关键性质**'
  - '- 分工铁律：人做决策（拆解目标、判断方向、验收结果），AI 做实现（语法、库调用、修补逻辑）'
  - '- 上下文工程即项目管理：单一 Chat 会话维护长上下文，等价于建立了项目级“共享知识库”与“状态记忆”'
  - '- 门槛重构：编程门槛从“会写语法”降为“会描述问题、会跑代码、会看报错、会找 Class”'
  - '**典型例子**'
  - '- 素材全流程：从环境配置、Class 定位、反爬对抗、分页存储到文件合并，全程零手写代码，仅通过上述对话循环完成'
  - '**边界条件**'
  - '- 目前仅适用于“单文件/单脚本/边界清晰”的脚本级工程任务，不适用于需模块解耦、单元测试、CI/CD、多服务协作的系统级工程'
  - '- 人类必须具备“运行脚本、阅读基础报错、操作浏览器开发者工具”的最低执行素养，纯小白（不会安装 Python、不会打开终端）仍无法起步'
  - '...'
  sources:
