  - '- 创业早期最大风险是“做没人要的产品”，而非“技术不够完美”'
  - '- 非技术创始人极易陷入“过早优化”陷阱：纠结域名、服务器、架构、代码规范、CI/CD，耗尽时间窗口却未验证需求'
  - '- 素材明确主张：呈现形式（Landing Page、人工服务、No-code工具）应服务于最低成本验证，避免过早投入重开发成本'
  - '**核心定义**'
  - '- 产品早期核心目标唯一：验证“目标群体”与“核心需求”的匹配度'
  - '- 验证手段分级：人工服务（Concierge MVP）> 组合式 SaaS/No-code（Wizard of Oz MVP）> 简易代码原型 > 完整工程实现'
  - '- 决策准则：若人工/工具组合能跑通闭环，绝不写代码；仅当规模化/边际成本/体验上限触及天花板时，再投入开发重构'
  - '**关键性质**'
  - '- 成本倒置：人工/工具组合看似“笨重”，实则边际成本极低（无开发投入），且能最快触达用户获取真实支付信号'
  - '- 学习速度最大化：每个验证周期（想法 -> 落地 -> 测试 -> 反馈）压缩至小时/天级，而非周/月级'
  - '- 避免沉没成本绑定：无代码/低代码方案易弃易改，代码一旦写下即产生“维护/重构”心理包袱，阻碍果断 pivot'
  - '**典型例子**'
  - '- 素材“名人来信”：Gumroad(支付分发) + Typeform(信息收集) + Zapier+OpenAI(自动化交付) 三件套，0 固定成本、0
    代码、半天上线，验证“用户愿为 AI 生成名人信付费”核心假设'
  - '**边界条件**'
  - '- 仅适用于“需求不确定性高、交付可标准化、SaaS工具链覆盖完备”的早期验证阶段'
  - '- 若核心价值依赖“极致性能/极致体验/私有算法/硬核技术壁垒”（如实时语音翻译、自动驾驶、高频交易），验证即需核心技术实现，无法走捷径'
  - '- 验证通过后，规模化阶段往往仍需重写代码（技术债偿还），需预留重构预算与周期'
  - '...'
