  name: 半定制 RPA 架构 —— 非程序员的“搭积木式” AI 业务闭环构建术
  points:
  - '**为什么需要这个概念？**'
  - '- 传统 RPA（UiPath/Automation Anywhere）学习曲线陡峭、授权昂贵、部署繁重，非技术人员望而却步'
  - '- 纯代码开发门槛更高，维护成本大'
  - '- 素材提出“半定制 RPA”：利用 Make/Zapier/IFTTT 等无代码平台，以“表单触发 -> AI 处理 -> 存储/交付”四阶段标准化节点，像搭积木一样拖拉拽组装端到端自动化业务流'
  - '**核心定义**'
  - "- 核心四阶段工作流：\n  1. 触发层：Google Forms / Typeform / Webhook / 定时器\n  2. 处理层：ChatGPT\
    \ API / 其他 LLM API（Prompt 变量映射、Max Tokens/Temperature 控制）\n  3. 存储层：Google Sheets\
    \ / Notion / Airtable / Excel\n  4. 交付层：Email / WhatsApp / Slack / HTTP 回调 / 智能硬件"
  - '- “半定制”意指：流程骨架标准化（四阶段固定），业务逻辑定制化（Prompt、字段映射、分支判断由用户配置）'
  - '**关键性质**'
  - '- 零代码门槛：全程可视化配置，核心技能为“业务流拆解”与“工具配置”而非“写代码”'
  - '- 工具栈免费/低成本：Google 套件免费，Make 免费版 2 个工作流/月，OpenAI API 按量付费（极低）'
  - '- 场景化迁移强：同一架构可横向迁移至起名、SEO、Listing、社媒矩阵、RSS 加工、社群助理等 10+ 高频场景'
  - '**典型例子**'
  - '- 素材“AI 自动起名”服务：用户填 Google 表单 -> Make 监控新提交 -> 调用 ChatGPT (text-davinci-003)
    生成建议 -> 写回 Google Sheets -> 发邮件/短信给用户，全程零人工'
  - '**边界条件**'
  - '- 无代码平台表达能力有限：复杂分支、循环、状态机、并发控制难以实现，遇到复杂逻辑仍需转代码'
  - '- 依赖第三方 SaaS 稳定性：Make/Zapier 故障、API 限流、账号封禁均会导致业务中断，无自主可控能力'
  - '- 数据隐私风险：用户数据流经表单平台、自动化平台、AI API、存储平台、通讯平台，合规敏感场景需自建方案'
  - '...'
  sources:
  - paper: docs/202303/KVYSdKgmIoQxCLxdIkrcKW0Snze.md
    role: origin
  - paper: docs/202303/20230328_121.md
    role: improve
  excerpts:
  - 相当于一个半定制的RPA。
  - 为什么不说RPA，也不说编程? 因为RPA对于大部分圈友来说，还是有门槛的，更不要说编程了。
  - 一句话说明白，就是自动采集需求，通过ChatGPT API 传送给 ChatGPT，ChatGPT加工后，输出结果，利用自动化工具进行回复/存储/发布...
  - 示例的工作流：1、使用表单采集用户提供的文字内容，并使用表格存储 2、ChatGPT 处理文字信息，按需求进行加工 3、加工的信息存储到表格 4、通过邮件或短信交付给客户
  - 我们就像搭积木一样，直接拖拉点击操作就可以了。
  - 自动化是 ChatGPT 商业应用的另一条腿
  - 工具基本免费。
