  name: GPT 全能副驾模式 —— 单一 Chat 会话驱动全栈 MVP 半天级交付
  points:
  - '**为什么需要这个概念？**'
  - '- 传统开发需协调 PM、设计、前端、后端、运营、法务等多角色，沟通成本高、周期长、非技术创始人无法驾驭'
  - '- 素材发现：GPT-4 在单一上下文中具备极强的角色扮演连贯性，可连续扮演 PM/文案/设计师/开发/运营，配合 Gumroad/Typeform/Zapier/OpenAI
    等 SaaS 工具链，实现零代码半天级全闭环交付'
  - '- 解决了“非技术创始人有创意无法落地、找外包贵且不可控、找合伙人难”的核心痛点'
  - '**核心定义**'
  - "- 在单一 Chat 会话中，人类作为“创始人/决策者”，GPT 作为“全能副驾”，按需切换角色完成全栈任务：\n  - PM：需求拆解、MVP 范围界定、工具选型建议\n\
    \  - 文案：命名头脑风暴、定价策略、Landing Page 文案框架/模块撰写/润色整合（4步法）\n  - 设计师：封面设计方案（文案/配色/布局/AI绘画Prompt）、Figma\
    \ 操作实时指导\n  - 开发：Zapier/Make 配置教程、OpenAI API 参数、Prompt 工程代码自主生成\n  - 运营：分销裂变设计、邮件模板、上线清单"
  - '- 核心前提：维持单一长上下文（一个项目一个 Chat），避免跨会话同步信息损耗'
  - '**关键性质**'
  - '- 角色流动性：无需开启新会话，直接自然语言指令“请扮演产品设计师...”“现在切换到开发模式...”即可无缝切换'
  - '- 自我编程能力：GPT 能根据业务需求自主编写结构化的 System Prompt 与 User Prompt 模板（含变量占位），并指导填入 API
    参数，实现“AI 给 AI 写 Prompt”'
  - '- 工具组合杠杆：GPT(智力中枢) + SaaS工具(执行手脚) 组合，工具间集成能力（Zapier 连接 Typeform/OpenAI/Email）放大杠杆效应'
  - '**典型例子**'
  - '- 素材“名人来信”实战：从灵感触发 -> Gumroad落地页 -> Typeform表单 -> Zapier+OpenAI自动化交付，全链路半天闭环，Prompt调试1-2天，落地执行半天'
  - '**边界条件**'
  - '- 上下文窗口限制：极长项目会超出上下文窗口，导致早期决策遗忘，需定期“需求总结”压缩上下文'
  - '- GPT 无法直接操作浏览器/服务器/域名/DNS/支付商户号，人类必须作为“执行手”完成实体世界操作（点击部署、配置 DNS、实名认证）'
  - '- 仅适用于“标准化 SaaS 工具链可覆盖”的标准 MVP 形态，涉及复杂业务逻辑、非标算法、硬件交互的项目仍需人类代码介入'
