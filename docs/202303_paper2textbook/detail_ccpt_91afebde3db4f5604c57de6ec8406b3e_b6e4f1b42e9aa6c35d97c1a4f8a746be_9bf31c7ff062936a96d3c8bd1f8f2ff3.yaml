  name: Prompt 迭代闭环与异常驱动修正 —— 让 AI 协作开发拥有“自动纠偏”能力
  points:
  - '**为什么需要这个概念？**'
  - '- AI 生成代码首轮通过率低，且错误类型多样（选择器错、逻辑漏洞、库版本不兼容、环境变量缺失），人工逐行阅读代码修 Bug 对小白不现实'
  - '- 素材建立“报错全文反馈 -> 结构分析 -> 定点修复 -> 回归验证”的标准化迭代闭环，将调试从“读代码”降维为“贴报错、提要求、跑验证”'
  - '- 同时引入“需求总结固化”机制，将每轮迭代的成果沉淀为结构化上下文，防止长对话上下文丢失导致的反复摇摆'
  - '**核心定义**'
  - "- 标准迭代循环 4 步：\n  1. 执行运行：在 PyCharm 终端运行当前版本代码\n  2. 异常捕获：复制完整 Traceback 报错堆栈\n\
    \  3. 结构化反馈：`出现了以下错误代码，先帮我分析再更新代码` + 粘贴报错 + 粘贴当前代码\n  4. 定点修复与验收：GPT 输出修复代码 ->\
    \ 人类再次运行 -> 循环直至通过\n- 里程碑固化：每跑通一大阶段（单页、翻页、反爬、全量），执行`根据最新的完整代码，总结一下我的需求`生成结构化需求文档，作为后续迭代的锚定基准"
  - '**关键性质**'
  - '- 非程序员可执行：无需看懂代码逻辑，只需会“跑脚本、复制报错、粘贴对话”'
  - '- 上下文累积优势：同一会话中，GPT 能看到完整的“报错-修复”历史，避免重复犯同类错误（如反复用错同一个 Class）'
  - '- 需求文档作为“契约”：后续新需求/新模型/新人类接手时，以结构化需求文档为准，避免口头描述的模糊与偏差'
  - '**典型例子**'
  - '- 素材全程：从“只获取后 90 条” -> “前 10 条缺失/简称全空” -> “翻页仅 90 条” -> “反爬中断 6 页丢数据” -> “详情页穿透”
    -> “分页事务保存+断点续爬” -> “合并 90 个 Sheet”，每一步均通过报错反馈闭环推进'
  - '**边界条件**'
  - '- 若报错信息被截断/加密/无堆栈（如某些编译错误、加密混淆代码运行报错），反馈闭环失效'
  - '- GPT 修复能力有上限：涉及底层协议、复杂并发、内存泄漏、C 扩展模块 Bug 等深层问题，GPT 往往给出错误或无效修复方案'
  - '- 迭代轮数过多（>20轮）会导致上下文污染、指令漂移，需定期“需求总结”重置上下文'
  - '...'
