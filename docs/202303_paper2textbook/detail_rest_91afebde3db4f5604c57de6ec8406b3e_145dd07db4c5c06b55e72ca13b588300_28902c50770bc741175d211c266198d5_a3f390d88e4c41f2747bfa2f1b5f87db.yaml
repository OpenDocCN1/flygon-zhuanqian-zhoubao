life_analogy:
- 想象个人理财是一场**‘身体健康管理’工程**：
- '- **资产负债表** = **年度体检报告**：告诉你当下肝脏脂肪含量（负债率）、肌肉量（优质资产）、内脏脂肪（不良资产）具体是多少，不看报告永远不知道自己‘亚健康’在哪'
- '- **现金流量表** = **每日饮食/运动记录**：今天摄入多少卡路里（收入）、消耗多少（支出），赤字还是盈余，决定你明天是胖还是瘦'
- '- **储蓄率35%** = **基础代谢率保护线**：低于这条线，身体就会分解肌肉供能（被迫借贷/变现资产），长期必垮'
- '- **四笔钱/100-年龄法** = **营养师配的‘终身食谱’**：年轻多吃蛋白质练肌肉（权益资产），年纪大多吃粗粮护血管（固收资产），维生素（保险）、零食钱（备用金）终身必备'
- '- **低阻力记账** = **自动同步的智能手环**：不用手输、不纠结一次吃多一口薯片（完成比完美重要）、每晚自动生成报表，坚持靠‘降低阻力’而非‘加强自律’'
- '- **月度复盘** = **月度复诊调方**：看趋势图（折线图）调食谱（预算），不是为了责备自己上周末火锅吃多了，而是下周少点两道菜'
- '- **生存跑道** = **‘失业后能撑几个月’的体脂储备**：算清楚这笔账，面对裁员（疾病）才不慌，敢于换赛道（手术/康复）'
- '- **财务自由四阶** = **从‘亚健康’到‘马拉松完赛体能’的进阶地图**：先治病（还消费债）→ 练体能（攒种子钱/配资产）→ 赛前备战（现金流覆盖债务）→
  终身跑者（被动收入覆盖生活）'
summary:
- concept: 黄金消费投资二元论
  desc: 首饰=消费品(含工艺费/品牌溢价/变现折损大) vs 投资品=金融资产(紧贴金价/低成本/高流动性)，完全两套逻辑不可混淆
- concept: 纸黄金优势
  desc: 手续费万0.5%/零保管费/T+0灵活交易/支持分批加减仓，综合体验与收益率显著优于实物金条(保管费300元/年+不可分批操作)
- concept: 个人财务三表模型
  desc: 移植企业财务逻辑：资产负债表看存量(富不富)、现金流量表看增量(活不活)、支出分类账看结构(漏在哪)，统一目标锚定‘高产低债’
- concept: 储蓄率35%基准线
  desc: 支出控制的核心硬指标：月可支配上限=收入×(1-35%)，强制储蓄优先，弹性支出为主控制抓手，大额支出提前分摊储备
- concept: 资产配置双模型
  desc: 四笔钱框架(保本40/投资30/保险20/备用10)解决功能分层，100-年龄法(权益占比=100-年龄)解决生命周期动态调仓，两者互补可执行
- concept: 低阻力记账体系
  desc: 统一账户(仅支付宝)+固定节点(晚10点/周日)+趁手工具(鲨鱼记账)+拒绝自我批判(完成>完美)，将日均耗时压缩<5分钟实现1000+天坚持
- concept: 月度双表复盘机制
  desc: 双表同步更新→净资产/收入/支出三线折线图可视化→核对储蓄率vs35%→超支分类溯源→下月策略决策(避免/压缩/调目标/增收)，形成数据决策闭环
- concept: 焦虑具体化定理/生存跑道
  desc: 焦虑=问题不聚焦+答案不清晰；生存跑道(月)=流动资产/月必要支出，将职场恐惧量化为可管理数学指标，跑道长短决定行动模式(生存/缓冲/发展)
- concept: 隐性福利挖掘
  desc: 四金体系/个税专项扣除/公积金提取/人才补贴/信用卡权益属于‘已赚未取’收入，主动学政策成本极低(小时级)收益确定性高(万级/年)
- concept: 财务自由四阶跃迁
  desc: 无产无债(建账/储蓄/清债)→避无产有债(雪球还债/备用金)→有产有债(优化结构/储蓄率>35%/现金流覆盖债)→高产低债(被动收入≥支出/时间自由)，核心驱动力仅储蓄率+资产结构
exercises:
- 'no': 1
  title: 手算一次黄金投资成本对比
  contents:
  - 假设你有 50,000 元资金想配置黄金，国际金价 450 元/克，某品牌金手镯售价 580 元/克(含工艺费)，黄金 ETF(518880)佣金万 0.5，银行实物金条买入价
    455 元/克、卖出价 448 元/克，年保管费 300 元：
  - 1. 买品牌金手镯能得多少克黄金？回收时按 450 元/克算，瞬间亏损多少？亏损率多少？
  - 2. 买银行实物金条能得多少克？持有 3 年总成本(买卖点差+保管费)多少？年化成本率多少？
  - 3. 买黄金 ETF 能得多少份？单次买卖成本多少？持有 3 年总成本多少？
  - 4. 若金价 3 年后涨至 550 元/克，三种方式的最终净收益分别是多少？
  - 回答问题：
  - '- 为什么说‘买首饰不等于投资’？请用算出来的数据说话。'
  - '- 什么情况下实物金条优于纸黄金？(提示：极端场景)'
- 'no': 2
  title: 搭建你的个人财务三表 MVP 版
  contents:
  - 打开 Excel 新建三个 Sheet：
  - Sheet1『资产负债表』：左侧列资产(现金/理财/股票/公积金/车/房/其他)，右侧列负债(信用卡/花呗/借呗/车贷/房贷/其他)，底部自动算净资产=资产-负债
  - Sheet2『现金流量表』：上半部列收入(工资/副业/理财/红包/退税)，下半部列支出(固定房租房贷/弹性餐饮社交/大额旅游医疗/还债)，底部算年盈余
  - Sheet3『支出分类账』：建立月度固定支出表(12 行)、月度弹性支出表(含预算列/实际列/差异列)、年度大额支出表(项目/预算/月均分摊/已存金额)
  - 填入你上个月的真实数据(没有则估算)，完成后观察：
  - 1. 你的净资产是正还是负？属于四象限中的哪一类？
  - 2. 上月储蓄率(盈余/收入)是多少？达标 35% 了吗？
  - 3. 哪一项弹性支出超支最多？下月预算怎么调？
  - 回答问题：
  - '- 如果不追溯历史数据，仅从本月开始记账，三表数据会有什么缺失？如何补齐？'
  - '- 房贷本金部分应计入‘负债偿还’还是‘储蓄/投资’？为什么？'
- 'no': 3
  title: 设计你的专属资产配置方案
  contents:
  - 假设你 30 岁，年收入 20 万，税后月入 1.3 万，月必要支出 6000 元(含房租 3000)，流动资产 8 万，无消费债，有房贷(不计入储蓄率分母)，风险偏好中等(亏损
    15% 能睡得着)：
  - 1. 计算你的生存跑道(月)；判断当前处于‘生存/缓冲/发展’哪个模式？
  - 2. 按四笔钱框架，将现有 8 万流动资产按 40/30/20/10 分配，写出具体品种(如：保本 3.2 万买储蓄国债/大额存单...)
  - 3. 按 100-年龄法，权益类占比 70%，固收类 30%。结合四笔钱中的‘投资钱 30%’，你的权益类资产具体配多少？选哪 2-3 只宽基指数基金？
  - 4. 保险钱 20% 预算 1.6 万，你需要配置哪些险种？重疾险保额建议多少？
  - 5. 设定下月储蓄率目标(≥35%)，倒推月度弹性支出上限是多少？
  - 回答问题：
  - '- 如果你明年要结婚/买房，大额支出 20 万，今年的年度大额支出表怎么拆？会对月度弹性预算造成什么挤压？'
  - '- 为什么作者建议投资年限短的小白直接买‘投顾产品/FOF/养老目标基金’而非自己定投指数基金？'
- 'no': 4
  title: 低阻力记账体系压力测试
  contents:
  - 连续执行 7 天以下流程，记录每日耗时与心理感受：
  - 'Day 1: 整理钱包/包/抽屉，将所有现金/卡/码归拢，决定『唯一支出账户』(如支付宝)，其他账户停用或仅收不付'
  - 'Day 2: 下载『鲨鱼记账』/『钱迹』/『随手记』任一 APP，开通自动记账权限(支付宝/微信/银行短信)，设置『每晚 22:00 记账提醒』'
  - 'Day 3-7: 每晚 22:00 打开 APP，确认/修正自动识别的分类(不超 30 秒)，现金支出手输『现金-大类』金额(不细分)，周日额外花 5 分钟看周报折线图'
  - 记录表格：
  - '| 日期 | 耗时(秒) | 自动识别准确率 | 现金漏记笔数 | 心理感受(焦虑/轻松/成就/厌烦) | 是否产生自我批判 |'
  - 回答问题：
  - '- 哪一天最想放弃？原因是什么？如何用『完成比完美重要』化解？'
  - '- 共同财务家庭(伴侣/父母)如何建立『家庭记账规则』避免数据割裂？'
  - '- 如果 APP 自动记账突然失效(如权限被收回)，你的备用方案是什么？'
- 'no': 5
  title: 月度复盘实战演练
  contents:
  - 假设已连续记账 2 个月，数据如下：
  - 月度现金流量表：
  - '| 项目 | 1 月预算 | 1 月实际 | 2 月预算 | 2 月实际 |'
  - '| 收入 | 15000 | 15200 | 15000 | 14800 |'
  - '| 固定支出 | 6000 | 6000 | 6000 | 6000 |'
  - '| 弹性支出 | 3750 | 4500 | 3750 | 5200 |'
  - '| 年度大额分摊 | 1500 | 1500 | 1500 | 1500 |'
  - '| 储蓄/投资 | 3750 | 3200 | 3750 | 2100 |'
  - '| 储蓄率 | 25% | 21% | 25% | 14% |'
  - 资产负债表变化：净资产 1 月初 50,000 → 2 月末 56,400
  - 请完成月度复盘会议纪要(模板)：
  - 1. 关键指标看板：实际储蓄率 vs 目标 35%，缺口多少？净资产增量多少？
  - 2. 超支溯源：弹性支出超支明细(餐饮/社交/服饰/电子)各多少？核心原因？
  - 3. 下月策略决策(必须可执行、可量化)：
  - '   - 避免型动作(如：取消某聚会/卸载外卖 APP)：'
  - '   - 压缩型动作(如：单次餐饮上限 80 元/改聚餐为居家)：'
  - '   - 调低目标型(如：下月储蓄率目标调为 20%，原因：考证报名费 3000 元)：'
  - '   - 增收型动作(如：接 1 个周末兼职/出闲置 2 件)：'
  - 4. 下月预算表(含调整后的弹性限额)
  - 回答问题：
  - '- 为什么作者强调『允许单月不达标，但必须产出原因分析+改进动作』？'
  - '- 如果连续 3 个月储蓄率<20%，是调低目标还是查找结构性问题？如何判断？'
