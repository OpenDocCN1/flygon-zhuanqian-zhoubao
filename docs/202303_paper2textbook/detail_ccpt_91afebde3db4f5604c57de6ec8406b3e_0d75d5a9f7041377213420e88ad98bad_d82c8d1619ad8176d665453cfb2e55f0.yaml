units:
- 'no': 1
  name: 组织信息过滤 —— 权力不对等导致的真话缺失
  points:
  - '**为什么需要这个概念？**'
  - '- 管理者处于信息金字塔顶端，却往往是最后一个知道公司出问题的人'
  - '- 员工基于利益保护、面子顾虑、权力不对等，系统性隐瞒负面真相'
  - '- 信息失真导致决策失误，甚至引发组织灾难（如袁世凯83天倒台）'
  - '**核心定义**'
  - '- 指组织层级结构导致信息在上传下达中被筛选、修饰、隐瞒的现象'
  - '- 下级面临“说真话风险高、说假话成本低”的博弈结构，导致上级接收信息系统性失真'
  - '**关键性质**'
  - '- 普遍性：不限于老板-下属，同级间也存在；'
  - '- 隐蔽性：员工给出社会通用借口（如“想读书”）掩盖真实不满；'
  - '- 破坏性：管理者仅接收过滤后的“好消息”，对基层矛盾一无所知'
  - '**典型例子**'
  - '- 袁世凯称帝前身边人每天看假报纸/假新闻，误判局势，登基83天被迫撤销帝制'
  - '- 离职面谈：员工说“想换行业/读书”，实则对公司不满但碍于面子不敢直说'
  - '- 评论区员工实证：说真话先得罪直系领导、等着被穿小鞋；老板常装作看不到'
  - '**边界条件**'
  - '- 仅靠正式汇报渠道（单一渠道）必成最后知情者'
  - '- 必须主动构建获取真相机制（跳级汇报、交叉验证、识别潜台词）才能打破'
  - '- 心理安全感缺失时，任何制度设计都无法强迫员工说真话'
  sources:
  - paper: docs/202303/20230328_003.md
    role: origin
  excerpts:
  - 员工不会完全说真话，你要努力了解公司的真相
  - 你的下属，你下属的下属，可能反馈的信息都不同，因为每个人都是站在自己的立场说问题的
  - 据说来袁世凯要复辟前...每份报纸对他都是赞美之词...登基83天后被迫撤销帝制
  - 我常常说：一个人没有痛快的答应，通常就是拒绝的意思
  - 无数次经历告诉我，如果我跟老板说真话，先把我的直系领导给得罪了...有时候不是不说，而是不能说（评论区 双平）
- 'no': 2
  name: 管理盲区与真相获取 —— 打破单一渠道的交叉验证法
  points:
  - '**为什么需要这个概念？**'
  - '- 管理者仅依赖正式汇报，必然成为组织中最后一个知晓核心问题的人'
  - '- 权力不对等导致下级不敢说真话，上级听不到真话'
  - '- 必须主动打破信息茧房，建立多维度的真相拼图机制'
  - '**核心定义**'
  - '- 管理盲区：管理者因处于信息金字塔顶端，仅接收过滤后的“好消息”，对基层真实矛盾一无所知的认知偏差状态'
  - '- 真相获取机制：通过跳级汇报、多层级交叉验证、语言潜台词识别、建立心理安全感等组合手段主动拼凑真相'
  - '**关键性质**'
  - '- 主动性：真相不会自动上浮，必须管理者主动去“挖”'
  - '- 交叉性：需对比“不同立场人”（下属、下属的下属、同僚）的反馈差异'
  - '- 解码性：需识别“未痛快答应即拒绝”等非显性信号'
  - '**典型例子**'
  - '- 跳级汇报：直接询问“下属的下属”真实感受，对比一线与中层反馈差异'
  - '- 潜台词识别：员工回复“再看看/下周再说/有点难”实为委婉拒绝'
  - '- 离职真相：通过非正式渠道（如同事侧写）获知员工真实离职原因是薪资/氛围而非“读书”'
  - '**边界条件**'
  - '- 无法通过制度强制“说真话”，只能通过降低说真话成本（心理安全感）诱导'
  - '- 管理者自身认知偏见（如确认偏误）会过滤掉不符合预期的真相'
  - '- 交叉验证成本高，仅适用于核心岗位/关键节点，不可全员全时覆盖'
  sources:
  - paper: docs/202303/20230328_003.md
    role: origin
  - paper: docs/202303/20230328_004.md
    role: improve
  excerpts:
  - 有些老板会天真地以为，自己没啥问题，其实他有可能是最后一个知道公司出问题的人
  - 你的下属，你下属的下属，可能反馈的信息都不同，因为每个人都是站在自己的立场说问题的
  - 我常常说：一个人没有痛快的答应，通常就是拒绝的意思
  - 管理者不应仅依赖直接下属汇报，而应主动跨越层级获取信息，对比不同立场信息差异以拼凑真相
  - 通过观察对方回应的及时性/确定性/热情度判断真实意图：缺乏痛快答应的回应本质即为拒绝
- 'no': 3
  name: 商业即设计 —— 认知决定边界，体系决定上限
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常误以为靠努力/运气/执行就能成功，忽视顶层设计的决定性作用'
  - '- 业务成败、赚钱上限从Day 1就由创始人认知与战略设计锁定'
  - '- 认知边界即业务边界，创始人理解越深，成功概率越高'
  - '**核心定义**'
  - '- 商业设计：指业务能不能赚钱、最多能赚多少钱，从业务生长第一天就已确定的顶层逻辑'
  - '- 核心公式：认知决定边界 → 体系决定上限 → 标准化决定规模'
  - '**关键性质**'
  - '- 先发性：设计在先、执行在后，以旧组织执行新战略必败'
  - '- 迁移性：核心竞争力非学习能力，而是认知迁移能力（如头条图文分发→抖音视频分发）'
  - '- 分层性：业务仅三种形态——改造型（提效）、替代型（线上化）、创造型（新物种）'
  - '**典型例子**'
  - '- 好未来/链家：招大学生标准化重塑行业，验证“大部分行业可招大学生重新做一遍”'
  - '- 头条到抖音：并非单纯学习短视频，而是将“图文分发能力”迁移为“视频分发能力”'
  - '- 二手书电商：属“替代型”（线下搬线上），核心矛盾从“找货”转移到“流量识别与匹配”'
  - '**边界条件**'
  - '- 阶段不可跨越：野蛮生长→投资入场→监管经济；内容→运营→体系→营销→数据驱动'
  - '- 只能通过付费向高认知者学习缩短痛苦周期，不能跳过阶段'
  - '- 创始人越专业越易犯“以专业为中心而非用户为中心”错误，导致产品自嗨'
  sources:
  - paper: docs/202303/20230328_004.md
    role: origin
  excerpts:
  - 所有的商业都是设计出来的，一个业务能不能赚钱，最多能赚到多少钱，从业务生长出来的第一天就已经确定了
  - 一个业务能不能成，取决于创始人对这个业务的理解，创始人的认知是这个业务最大的瓶颈
  - 比学习能力更重要的是迁移能力，头条到抖音，其实是图文分发能力到视频分发能力的迁移
  - 所有的业务只有三种形态：改造型、替代型、创造型
  - 从企业创新角度，找第二曲线一定要在企业发展最好的时间段，但往往大部分企业在衰退的时候才想起来找第二曲线
- 'no': 4
  name: 人才三层次与价值观优先 —— 招参与者而非使用者
  points:
  - '**为什么需要这个概念？**'
  - '- 早期核心资源稀缺，激励机制（0）无法弥补人岗不匹配（人非1）的损耗'
  - '- 能力可培养，价值观难改；价值观不合能力再强风险越大'
  - '- 必须建立科学的人才识别、分层、盘点体系，避免“圣母心”留错人'
  - '**核心定义**'
  - '- 人才三层次：使用者（观察者/执行既定动作）→ 探索者（思考者/能优化流程）→ 造物者（参与者/主动发现并解决问题）'
  - '- 招聘铁律：招参与者（造物者），人才筛选公式：价值观=1，能力=0'
  - '**关键性质**'
  - '- 人岗匹配 > 激励机制：人是1，机制是0，优先投入时间找成就型动机且能力匹配的核心人才'
  - '- 分层运营：核心骨干（捧千里马）、有害分子（消灭耗子）、平庸占坑者（清理老白兔）'
  - '- 合伙人选“性格相融”（宽容理解差异），而非单纯互补或相似'
  - '**典型例子**'
  - '- 面试剥洋葱法：层层追问STAR细节验证真实性，造假难度随深度指数上升'
  - '- 成就型动机识别：问“原公司做过什么有成就感的事？平时喜欢干什么？”筛选信愿景/图成长者'
  - '- 内训失效根因：只有赋能系统（教），无赋权系统（用），学以致用闭环未打通'
  - '**边界条件**'
  - '- 招人要慢、开人要快：管理者对员工一丁点不满员工即可感知，延迟解聘仅增加沉没成本与组织毒性'
  - '- 管理底线即员工行为底线：员工会不断试探底线直到突破，容忍度决定团队纪律下限'
  - '- 标准化分层：软件/系统标准化易解，人的标准化最难，是规模化关键瓶颈'
  sources:
  - paper: docs/202303/20230328_004.md
    role: origin
  excerpts:
  - 人才分为三个层次，第一层是使用者视角...第二层是探索者视角...第三层是造物者视角...招聘人才一定要招参与者
  - 对于公司人才，价值观是 1，能力是 0，价值观越吻合，风险就会越低，因为能力是可以培养的
  - 创业生存第一性：人岗匹配大于激励机制，人是1，机制是0
  - 公司人才盘点要提高坏流失率，降低好流失率。捧千里马，消灭耗子，清理老白兔
  - 找合伙人一定要找性格相融的，而不是互补和相似的...最大的矛盾就是你怎么这么对我，最大的和解是他就是这个德行
  - 企业内部培训没有效果，是因为只有赋能系统，而没有赋权系统
- 'no': 5
  name: 阶段性战略匹配与经营策略四选二 —— 避免贪多嚼不烂
  points:
  - '**为什么需要这个概念？**'
  - '- 不同发展阶段核心竞争要素完全不同，错位投入资源必败'
  - '- 企业经营策略仅四种（广度/深度/高度/速度），每阶段最多选两种'
  - '- 目标下达需反复沟通6遍，完成团队从“不可能”到“肯定能”的心理建设'
  - '**核心定义**'
  - '- 阶段性战略匹配：早期比产品/技术，中期比渠道/获客效率，后期比战略/组织'
  - '- 经营策略四选二：广度、深度、高度、速度，每阶段聚焦最多两种'
  - '- 目标对齐六遍法：不可能 → 有意思 → 可能 → 可试 → 应该能 → 肯定能'
  - '**关键性质**'
  - '- 动态性：直播业务一阶段拼流量、二阶段拼供应链、三阶段拼品牌'
  - '- 聚焦性：避免“贪多嚼不烂”，资源集中在当阶段决定性要素上'
  - '- 心理建设：目标对齐非一次性宣讲，而是反复打磨团队共识的过程'
  - '**典型例子**'
  - '- 早期创业：不拼品牌/组织，只拼产品能不能跑通、技术领不领先'
  - '- 成熟期：不拼流量技巧，拼供应链护城河、组织战略协同能力'
  - '- 新业务孵化：老人做新事（配互联网人才+线下副手）、新人做老事（收购业务原老大调入集团）'
  - '**边界条件**'
  - '- 零和/非零和博弈决定战略必要性：上升期非零和（无战略也涨），存量期零和（必须有战略）'
  - '- 农业经济周期律：春种秋收夏耘冬藏，违背周期强行催熟必反噬'
  - '- 商业社会化临界点：体量达规模后超越纯商业，必须担社会责任'
  sources:
  - paper: docs/202303/20230328_004.md
    role: origin
  excerpts:
  - 竞争早期产品为王，比的是谁的技术领先，竞争中期渠道、营销为王，比的是谁的获客效率高，竞争后期战略、组织为王，比的是谁战略和组织强
  - 直播业务第一阶段拼流量，第二阶段拼供应链，第三阶段拼品牌
  - 一个企业的经营策略只有 4 种，广度、深度、高度、速度，每个阶段同时最多选 2 种
  - 定业务目标一定要反复跟团队过，至少过 6 遍...过第 6 遍：大家才会肯定可以完成
  - 行业处于上升期，非零和博弈，不管企业有没有竞争战略，都能实现业绩增长！行业规模或整体经济增长放缓，零和博弈，一定要有竞争战略！
  - 所有业务发展都需要遵循农业经济的规律，春种秋收夏耘冬藏
- 'no': 6
  name: 商业模式本质与定价权 —— 经营方式创新与标品非标化
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常混淆商业模式与盈利模式，忽视用户停留时长决定模式清晰度'
  - '- 交易型电商卖标品无定价权（用户理性比价），内容型卖非标品有定价权（用户感性评估）'
  - '- 必须通过SKU组合将标品非标化，获取定价权与溢价空间'
  - '**核心定义**'
  - '- 商业模式本质是经营方式，创新商业模式即创新经营方式'
  - '- 互联网时代商业模式清晰度取决于用户在平台停留时间，停留越长模式越清晰'
  - '- 标品/非标品定价权定理：理性比价vs感性评估，决定定价权归属'
  - '**关键性质**'
  - '- 外向性：服务本质非“卖现有能力”而是“问客户需求、调动一切资源解决问题”'
  - '- 组合性：通过不同SKU组合将标品非标化，变“非标品”获取定价权'
  - '- 平台博弈：弱则靠平台，强则造平台；技术服务于人则模式清晰'
  - '**典型例子**'
  - '- 交易型电商：用户上来比价看差评，理性评估，无定价权'
  - '- 内容型电商：无差评只看好评，感性评估，有定价权'
  - '- 服务型业务：不问“我有什么”，而问“客户需要什么、我能调动什么资源、能帮到什么”'
  - '**边界条件**'
  - '- 战略决定组织：组织必须跟随战略调整，以旧组织执行新战略必败'
  - '- 免费流量本质不确定（需工程化规模化对冲），付费流量相对确定（拼ROI效率）'
  - '- 小红书去重算法窗口期仅剩半年（素材宣称），模仿起号需抓紧'
  sources:
  - paper: docs/202303/20230328_004.md
    role: origin
  excerpts:
  - 商业模式的本质是经营方式，创新商业模式就是创新经营方式
  - 互联网时代，商业模式取决于用户在你平台上的停留时间，停留时间越长，商业模式越清晰
  - 交易型电商卖的是标品，用户上来就比价看差评，理性评估，没有定价权；内容型电商卖的是非标品，没有差评，只能看好评，感性评估，有定价权
  - 弱则靠平台，强则造平台。技术、算法、平台服务于人，商业模式很清晰，人服务于技术、算法、平台，商业模式不清晰
  - 服务客户的时候，不是你有什么，而是客户需要什么？你能调动什么资源？能帮到客户什么？
  - 免费流量都是不确定的，需要规模化、工程化，付费流量相对确定，拼的是花钱的效率
- 'no': 7
  name: 用户洞察与产品外化 —— 信腿不信嘴、高认知反常识可量化
  points:
  - '**为什么需要这个概念？**'
  - '- 用户口头说“想要”≠真需求，真需求表现为具体行为痛点（如“去年衣服穿不上”）'
  - '- 产品效果外化必须满足：用户高认知（懂价值）、反常识（超预期）、外化到行动（有场景、可感知、可量化）'
  - '- 转介绍不会自动发生，需同时满足：超预期产品/服务 + 准备好转发物料（降低行动成本）'
  - '**核心定义**'
  - '- 用户洞察“信腿不信嘴”法：看行为数据（腿）而非口头反馈（嘴）'
  - '- 产品效果外化三要素：高认知 + 反常识 + 可量化外化到行动'
  - '- 转介绍触发机制：超预期体验 + 低行动成本物料准备'
  - '**关键性质**'
  - '- 场景化：真需求总在具体场景中显现，而非抽象问卷中'
  - '- 反常识：产品必须超出用户预期（如“本以为很难，结果三步搞定”）'
  - '- 物料化：用户懒得组织语言，必须帮ta准备好可直接转发的文案/图片/链接'
  - '**典型例子**'
  - '- 减肥需求：嘴上说“我想减肥”不可信；腿上表现为“去年衣服穿不上”才是真需求'
  - '- 产品外化：不讲“我们用了最新AI技术”，而讲“帮你把3小时的工作缩短到10分钟，点击即得结果”'
  - '- 转介绍：不仅服务超预期，还给客户准备好“发给朋友的推荐话术+二维码海报”'
  - '**边界条件**'
  - '- 业务停滞3-6个月大概率是战略方向错而非执行不力，需果断止损调向'
  - '- 用户洞察需结合数据验证，单凭访谈极易陷入“用户说要更快的马”陷阱'
  - '- 产品外化的“高认知”门槛：用户必须具备一定专业知识才能懂价值，否则需先科普'
