units:
- 'no': 1
  name: 打工人惯性 —— 从被推着走到自己摸路
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人入职场久了，习惯了被KPI、领导、薪资这套制度推着走'
  - '- 一旦创业，没人管你、没标准流程，内驱力不足会直接卡死在起步阶段'
  - '- 这是从打工思维转型商业思维的第一道坎，不跨过去后面的方法论都落不了地'
  - '**核心定义**'
  - '- 打工人惯性：长期职场形成的依赖外部制度驱动执行的思维模式'
  - '- 表现为：缺乏内驱力、自律性差、习惯将赚钱责任外包、遇到困难等人给答案'
  - '**关键性质**'
  - '- 思维路径依赖：把“被安排工作”误认为是“工作能力”'
  - '- 责任外包倾向：潜意识希望花钱买“必赚方案”，规避自主决策风险'
  - '- 执行力假象：职场执行力≠创业执行力，前者是被动响应，后者是主动摸路'
  - '**典型例子**'
  - '- 职场里领导定好KPI你只管冲，创业时没人告诉你今天该干啥，你得自己拆解目标、找流量、搞转化'
  - '- 很多人在社群里问：“你能不能告诉我做二手书要发多少商品才能稳定月入过万？”——这就是典型的想要标准答案、拒绝自主摸索'
  - '**边界条件**'
  - '- 该惯性非人品问题，而是长期环境塑造的神经回路，打破它需要刻意练习和高强度实战环境（如航海训练营）'
  - '- 即使是高管出身，只要没经历过“从0到1摸路”的完整过程，创业初期依然会犯晕'
  - '...'
  sources:
  - paper: docs/202303/20230328_162.md
    role: origin
  excerpts:
  - 作为打工人的时间太长了，所以渐渐已经失去了搞钱的能力。
  - 你上班的第一天，你就清楚了自己的岗位职责是什么...你是被一套制度推着往前走的。
  - 什么是自己做项目？就是在什么也没有和赚到钱之间，需要你自己去摸清一条路出来...你需要的是很强的内驱力。
- 'no': 2
  name: 知识付费责任外包 —— 买课不等于买结果
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数付费用户潜意识把“交钱”等同于“把赚钱责任转移给老师”'
  - '- 导致不执行、执行不彻底、一遇挫折怪教程烂、要求退款或骂人'
  - '- 这是阻碍普通人通过知识付费实现变现的核心心理拦路虎'
  - '**核心定义**'
  - '- 责任外包心理：付费用户错误地认为支付费用即购买了“赚钱保证”，将项目失败的风险与执行责任完全转嫁给知识提供者'
  - '- 典型话术：“我按教程做了为什么没流量？”“教程承诺的结果没达到，退钱”'
  - '**关键性质**'
  - '- 认知错位：把“避坑工具”当成“致富门票”'
  - '- 情绪防御：用怪罪外部来掩盖自己执行力不足、认知不够的事实'
  - '- 反馈失真：因为不承认是自己选项目/执行的问题，无法从失败中复盘迭代'
  - '**典型例子**'
  - '- 花几百块进群，不看风向标、不参加航海、不复盘，三个月后发帖：“这群骗人的，没赚到钱”'
  - '- 要求老师给标准化SOP：选品表、发布时间、话术模板全要现成的，稍有变动就不知所措'
  - '**边界条件**'
  - '- 知识提供者有义务提供“跑通流程、避开大坑”的标准化交付，但无义务为学员的“执行力、认知差、运气”兜底'
  - '- 真正的高手付费是为了“买时间、买确定性、买人脉”，从不指望老师包赚钱'
  - '...'
  sources:
  - paper: docs/202303/20230328_162.md
    role: origin
  excerpts:
  - 总把赚钱这件事的责任寄托在别人身上
  - 以为知识付费付了几百块以后，就把赚钱的责任寄托在别人身上，其实这就是人性，大家都不愿意自己承担责任，都不愿意承认自己不行。
  - 你让我发的视频或者做的事情我都做了，为什么还是没有流量？你能告诉我做二手书项目要发布多少商品，我才能稳定月入过万吗？
- 'no': 3
  name: 知识付费本质定理：避坑工具而非致富门票
  points:
  - '**为什么需要这个概念？**'
  - '- 纠正用户预期，防止“花小钱买大梦”导致的心理落差和信任崩塌'
  - '- 明确知识付费的边界：只负责“缩短试错、跑通流程、避开致命坑”，不负责“保结果、包赚钱、代执行”'
  - '- 帮助提供者建立合理的服务边界，避免无限售后消耗'
  - '**核心定义**'
  - '- 知识付费 = 避坑工具：用别人的经验帮你少走1-2个月弯路，帮你跑通标准化流程，让你少踩致命坑，仅此而已'
  - '- 核心价值：时间杠杆（买前人的试错时间）、认知杠杆（买前人的模式识别）、规避沉没成本（不走弯路不放弃好项目）'
  - '**关键性质**'
  - '- 非标准化交付：同一份教程，执行力强的月入万，执行力弱的零收入，这是常态'
  - '- 认知门槛：教程只能给“知其然”，知其所以然需要学员在实战中自己悟'
  - '- 反脆弱属性：好的知识付费产品，是让你在不确定性中建立确定性的最小行动闭环'
  - '**典型例子**'
  - '- 二手书项目教程：教你选品、上架、发货、客服全流程，但能不能日发50单、能不能处理差评、能不能坚持3个月，教程管不了'
  - '- 航海训练营：给手册、给教练、给陪跑、给社群，但能不能打卡、能不能发帖、能不能复盘，全靠自己'
  - '**边界条件**'
  - '- 如果教程连基础流程都没跑通、全是理论废话、核心数据造假，那不是“避坑工具”而是“挖坑工具”，需维权'
  - '- 对于认知极低、执行极弱的小白，即使有完美教程，成功率依然极低，建议先从“执行即结果”的初级项目练手'
  - '...'
  sources:
  - paper: docs/202303/20230328_162.md
    role: origin
  excerpts:
  - 知识付费的意义仅仅是用别人的经验帮你少走 1-2 个月弯路，帮你跑通流程，让你少踩坑，仅此而已。
  - 走弯路最大的问题不仅是浪费时间，而且会让你放弃一个还不错的项目。
  - 项目是你自己选择的，赚不到钱都是你自己的认知问题，不要花了几百块钱，就把赚钱的希望寄托在别人身上。
- 'no': 4
  name: 项目分层模型 —— 初中高三级匹配能力圈
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人选项目常犯两种错：要么好高骛远选高阶项目（如零基础做IP），要么盲目跟风不看自身匹配度'
  - '- 项目客观存在难度分级，人主观存在能力边界，匹配才能正向反馈，错位必死'
  - '- 为创业者提供一张“项目难度地图”，让选项目前先“照镜子”'
  - '**核心定义**'
  - '- 初级项目（蓝海电商/闲鱼二手书等）：执行即结果，出单快(1-3天)，琐碎重，天花板低(月1-2万)，核心考验执行力'
  - '- 中级项目（短视频/直播带货）：需网感，起号周期长(1-2个月不赚钱)，不琐碎，天花板高(爆款几十万利润)，核心考验内容感+抗挫力'
  - '- 高级项目（个人IP/知识付费/社群）：需深度沉淀，周期最长，天花板最高(年入百万轻松)，核心考验专业度+信任资产+长期主义'
  - '**关键性质**'
  - '- 阶梯性：建议小白从初级做起，赚到第一桶金、练就执行力、建立正向反馈，再向上跃迁'
  - '- 互斥性：能力圈在初级，强行做高级，必死无疑；能力圈在高级，降维打初级，机会成本太高'
  - '- 动态性：能力圈会随实战扩大，项目层级也会随平台红利变化，需动态匹配'
  - '**典型例子**'
  - '- 作者自己：融资败光(无认知裸奔) → 贪快亏损(选错赛道) → 深耕二手书(匹配初级能力圈，年利润百万) → 谋求高天花板(向中高级跃迁)'
  - '- 社群里很多小白：上来就报名几万块的IP训练营，连公众号都没写过，三个月退群骂娘'
  - '**边界条件**'
  - '- 分层非绝对，同一项目不同玩法可能跨层级（如二手书做精品化、品牌化可进阶中级）'
  - '- 核心判断标准：看“出单周期、琐碎度、天花板、核心能力要求”四维指标，对号入座'
  - '...'
  sources:
  - paper: docs/202303/20230328_162.md
    role: origin
  excerpts:
  - 项目是分层级的，我觉得项目分几个层级：
  - 1、初级，蓝海电商，执行就有结果（比如我做的闲鱼二手书这种小项目）
  - 2、中级，短视频、直播，需要网感，起号周期长，但天花板高
  - 3、高级，个人 IP，需要一定的沉淀，年入百万比较轻松
  - 你只有充分的认知到自己的能力，做对应层级的项目才能更容易拿到结果
- 'no': 5
  name: 认知匹配决策法 —— 自我盘点+项目对标
  points:
  - '**为什么需要这个概念？**'
  - '- 选项目不是看“别人赚钱多”，而是看“我能不能赚到钱”'
  - '- 绝大多数人只有“想赚钱”的冲动，没有“盘点自己、分析项目”的理性过程'
  - '- 提供一套标准化决策动作，把主观冲动变成客观匹配'
  - '**核心定义**'
  - '- 两步走：第一步自我盘点（优势/劣势/能力边界/可投入时间精力/资金/人脉）；第二步项目对标（出单周期/运营琐碎度/利润天花板/扩大模式/核心能力要求）'
  - '- 取交集：自我资源禀赋 ∩ 项目关键要求 = 匹配度，匹配度高则入局'
  - '**关键性质**'
  - '- 反直觉：往往“看起来最美、赚钱最快”的项目，对新手要求最高，匹配度最低'
  - '- 动态校准：项目做着做着发现不匹配（如太琐碎、天花板太低），及时止损切换，不恋战'
  - '- 机会成本视角：选项目本质是分配稀缺时间/精力/资金，选错一个项目=错过N个匹配项目'
  - '**典型例子**'
  - '- 作者对比二手书 vs 短视频带货：二手书出单快但琐碎天花板低，短视频周期长但天花板高，根据自己“有基本盘、想找高天花板”决定转型'
  - '- 一个全职宝妈，碎片时间多、擅长沟通、不擅长技术，匹配“闲鱼卖货/社群运营”，不匹配“短视频剪辑/代码开发”'
  - '**边界条件**'
  - '- 自我盘点容易高估自己（邓宁-克鲁格效应），建议找懂行的人或社群教练帮忙“照镜子”'
  - '- 项目情报要获取一手实操数据（如风向标、航海日志），别信招商广告和大V吹牛'
  - '...'
  sources:
  - paper: docs/202303/20230328_162.md
    role: origin
  excerpts:
  - 不要人云亦云，也不要听大佬吹牛逼，你要提升认知，自己去分析一个项目的优势是什么，劣势是什么，需要什么样的能力，再看看自己的能力，能不能进行匹配。
  - 二手书项目：出单快，1-3 天出单很正常，但琐碎，天花板低...短视频带货：起号周期长...但天花板高
- 'no': 6
  name: 创业成功责任内归律 —— 赚钱概率与承担责任程度正相关
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人失败了怪环境、怪平台、怪教程、怪运气，唯独不怪自己认知不够、执行不到位'
  - '- 只有把“选项目、执行、结果”全链路责任揽到自己身上，才能驱动真正的复盘迭代和认知升级'
  - '- 这是从“韭菜心态”进阶“玩家心态”的分水岭'
  - '**核心定义**'
  - '- 责任内归：项目是你自己选的，执行是你自己干的，结果好坏由你承担，赚不到钱都是你自己的认知问题'
  - '- 公式：赚钱概率 ∝ 承担责任程度（含认知责任、执行责任、结果责任）'
  - '**关键性质**'
  - '- 去受害者化：不再把自己定位为“被收割的韭菜”，而是“正在试错的玩家”'
  - '- 动力切换：从“希望别人给我保证”切换为“我要通过试错找到确定性”'
  - '- 复利效应：每一次自我归因的复盘，都在增加认知资产，降低下一次试错成本'
  - '**典型例子**'
  - '- 反面教材：“身上只有5万，能不能推荐一个一定能让我今年赚100万的项目？”——典型的责任外包、想买确定性'
  - '- 正面教材：作者创业第3阶段“承认自己的平凡，扎根二手书”，不怪环境、不怪项目，全盘接责，结果年利润百万'
  - '**边界条件**'
  - '- 责任内归 ≠ 自我攻击，不是陷入“我太烂了”的情绪内耗，而是客观归因“认知这里有盲区、执行这里没到位”'
  - '- 客观环境确实有坑（如平台封号、供应链断供），责任内归是指“应对环境变化的预案、Plan B、抗风险能力”由自己负责'
  - '...'
  sources:
  - paper: docs/202303/20230328_162.md
    role: origin
  excerpts:
  - 一个人只有自己去承担责任以后，赚到钱的概率才会高很多。
  - 项目是你自己选择的，赚不到钱都是你自己的认知问题。
  - 身上只有 5 万，能不能推荐一个一定能让自己今年赚到 100 万的项目（反面案例）
- 'no': 7
  name: 社群价值提取清单 —— 把模糊学习变成可衡量ROI
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人进付费社群像进图书馆：到处逛、啥都看、最后啥也没拿走、还觉得“学到了”'
  - '- 社群核心资产是隐性的（信息差、人脉、实战训练、高密度周报），不建立提取清单极易浪费会费和时间'
  - '- 将社群价值显性化、结构化、可量化，倒逼自己高频高质量参与'
  - '**核心定义**'
  - '- 社群四大核心价值：①前沿信息差（比外面早1年知道趋势/项目）；②高质量同伴样本（观察10万创业者在做什么、怎么做）；③组织化实战训练（航海/训练营/打卡/复盘）；④高密度周报筛选（每周定时获得高信噪比商业洞察）'
  - '- 提取标准：每项价值都要有具体获取动作、频次、输出物'
  - '**关键性质**'
  - '- 主动性：价值不会自动送达，必须通过“提问、打卡、发帖、复盘、私信、组局”主动攫取'
  - '- 复利性：单次获取价值低，持续高频参与半年以上，信息差+人脉+认知会发生质变'
  - '- 筛选力：周报/风向标/航海日志海量信息中，能否快速筛选出适合自己的，是核心能力'
  - '**典型例子**'
  - '- 作者续费时的心理YY清单：亦仁要给我提供前沿线报、组织10万创业者分享项目、每月组织实战、每周准时周报，这才是把社群当工具用'
  - '- 高手用法：每天看风向标→周末复盘航海日志→月度对标同行项目→季度组局见核心圈友→年度沉淀方法论'
  - '**边界条件**'
  - '- 低质量社群（全是广告、水群、无实战、无组织）没有提取价值，及时止损退群'
  - '- 自己不执行、不输出、不复盘，进再好的社群也是“旁观者”，无法触发化学反应'
  - '...'
  sources:
  - paper: docs/202303/20230328_162.md
    role: origin
  excerpts:
  - 我今年续费时候的心理 YY 活动是这样的：...亦仁，今年给你 2000 块钱预算，你要做到下面几个事情：
  - 1、给我提供一年的最前沿创业项目信息和线报，至少比其他人领先 1 年；
  - 2、帮我组织 10W 个创业者...让他们分享下目前都在做些什么项目；
  - 3、每月组织下项目实战...；4、每周一定要准时给我提供一下周报...
- 'no': 8
  name: 能力圈-项目层级匹配律 —— 小白做IP必死，执行强做电商必活
  points:
  - '**为什么需要这个概念？**'
  - '- 直接揭示创业失败的核心结构性原因：人-项目错位'
  - '- 为“新手做什么项目”提供了最硬核的判断标尺，替代主观臆断和跟风'
  - '- 解释了为什么同样的项目、同样的教程，有人赚钱有人亏钱'
  - '**核心定义**'
  - '- 创业项目存在客观难度分级（初/中/高），创业者认知能力决定可驾驭上限'
  - '- 匹配律：能力圈在哪一层，就做哪一层的项目；强行跨层=自杀，降维打击=浪费'
  - '- 跨迁逻辑：通过初级项目练执行、赚钱、建信心、攒资源，再向中级跃迁；以此类推'
  - '**关键性质**'
  - '- 硬约束：认知不到位、执行不到位，给再好的高阶项目教程也跑不通'
  - '- 保护机制：初级项目容错率高、正向反馈快，是新手建立“成功惯性”的保护区'
  - '- 天花板意识：每层级都有天花板，到达天花板不主动升维=躺平等死'
  - '**典型例子**'
  - '- “一个小白，上来就做IP，参加各种高大上的IP训练营，能拿到结果就怪了”'
  - '- 作者二手书项目单人极限：月利润1-2万天花板，突破需转工作室模式，这是初级项目的客观边界'
  - '**边界条件**'
  - '- 例外情况：极少数天赋异禀者可跨级（如天生网感极强、自带流量、有特殊资源），但不可复制、不可教学'
  - '- 判断自己在哪层，最准的方法不是想、不是测，而是“去跑一个最低成本MVP”，用结果说话'
  - '...'
  sources:
  - paper: docs/202303/20230328_162.md
    role: origin
  excerpts:
  - 你只有充分的认知到自己的能力，做对应层级的项目才能更容易拿到结果，一个小白，上来就做 IP，参加各种高大上的 IP 训练营，能拿到结果就怪了。
  - 初级，蓝海电商，执行就有结果...中级，短视频、直播...高级，个人 IP
  - 二手书项目：出单快，1-3 天出单很正常，但琐碎，天花板低，一个人努力点每月 1-2W 利润基本上差不多了，继续放大就要工作室模式了。
- 'no': 9
  name: 作者创业四阶段实证轨迹 —— 从败光百万到年入百万的跃迁证据链
  points:
  - '**为什么需要这个概念？**'
  - '- 用真实血淋淋的数据验证上述所有理论：打工人惯性害死人、责任外包害死人、匹配能力圈才能活、分层跃迁才能大'
  - '- 为普通创业者提供一个可参照、可复刻的“从0到1再到N”的真实样本'
  - '- 证明“承认平凡、深耕执行、长期主义”不是鸡汤，是生存铁律'
  - '**核心定义**'
  - '- 四阶段实证链：'
  - '  1. 融资100万/估值千万/6月败光 → 验证“有钱无认知、无内驱力必死”'
  - '  2. 贪快尝试拉新撸货/3月亏20万 → 验证“贪快/无深耕/不匹配能力圈必亏”'
  - '  3. 承认平凡/深耕二手书/2年年利润100-200万 → 验证“匹配初级能力圈+极致执行=正向结果”'
  - '  4. 有基本盘/谋求高天花板方向 → 验证“分层模型跃迁逻辑：打稳地基再盖高楼”'
  - '**关键性质**'
  - '- 非幸存者偏差：作者主动暴露失败细节（败光细节、亏损项目），反幸存者偏差，可信度极高'
  - '- 可迁移性：每个阶段的关键动作（止损、承认平凡、选对项目、死磕执行、复盘迭代）都是普通人可复制的'
  - '- 时间复利：前两阶段看似“亏钱”，实为“交学费买认知”，后两阶段复利爆发'
  - '**典型例子**'
  - '- 阶段1：拿着融资的钱招人、租办公室、搞品牌，自己不懂业务细节，纯当甩手掌柜，6月烧光'
  - '- 阶段3：自己选品、自己拍图、自己发货、自己客服、自己复盘，日更50单，坚持2年，年入百万'
  - '**边界条件**'
  - '- 作者有过高管经历、有融资能力、有基础商业常识，起点高于绝大多数纯小白，但核心规律通用'
  - '- 二手书赛道当时处于蓝海红利期，当前竞争加剧，天花板可能更低，需结合当下环境判断'
  - '...'
  sources:
  - paper: docs/202303/20230328_162.md
    role: origin
  excerpts:
  - 创业第 1 阶段：融资 100 万，给了 10%股份，靠梦想估值千万，6 个月就全部败光了，卒；
  - 创业第 2 阶段：疯狂想赚快钱，尝试了各种项目，拉新、撸货等等，3 个月花了 20 万学费，醒了；
  - 创业第 3 阶段：承认自己的平凡，扎根二手书，2 年了，拿到了小结果，利润一年 100-200 个；
  - 创业第 4 阶段：有了二手书基本盘，如今在重新开始思考，想找一个天花板更高的方向。
- 'no': 10
  name: 生财社群新人心理五阶段规律 —— 认知重构必经的痛苦期
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数进高质量社群的新人都会经历这五阶段，不知情者会在阶段3-4退群、骂骗局、自我放弃'
  - '- 明确这是“认知升级的戒断反应”，而非“社群没用”，能坚持熬过痛苦期'
  - '- 为社群运营者提供预期管理工具：提前告知新人“你会经历这些”，降低流失率'
  - '**核心定义**'
  - '- 五阶段：①看不懂/认知冲突（文章太长、概念太陌生、大佬太厉害）→ ②怀疑吹牛/信任危机（年入百万千万、不吹牛会死啊） → ③迷茫试错/执行无果（不知道做什么、试了几天赚不到钱、骗鬼啊）
    → ④卸载退出/逃避（卸载APP、什么玩意） → ⑤焦虑回流/寻找项目（重新打开、继续找项目）'
  - '- 核心洞察：阶段1-2是认知门槛，阶段3是执行门槛，阶段4是心理门槛，阶段5是真正开始成长的起点'
  - '**关键性质**'
  - '- 必经性：除非你认知碾压社群、或执行力极强直接跑通项目，否则无法跳过'
  - '- 痛苦源：外部高阶认知冲击内部低阶认知，产生认知失调；外部高强度执行冲击内部惰性，产生行动瘫痪'
  - '- 分水岭：能否在阶段4“卸载退出”时强迫自己重新打开、进入阶段5，决定能否受益于社群'
  - '**典型例子**'
  - '- 作者自己：第一年看不懂、怀疑吹牛、迷茫试错、想退群，第二年熬过来了，开始参加航海、打卡、复盘，第三年拿到结果'
  - '- 圈友“浅色喵”：从零发帖透明人 → 主动答疑志愿者 → 朋友圈广撒网验证需求 → 建立付费社群分成模式 → 2月航海变现1.9万+'
  - '**边界条件**'
  - '- 该规律基于生财有术社群观察，适用于“高质量、高门槛、强实战、强认知”的付费成长型社群'
  - '- 低质量社群（全鸡汤、全广告、无实战）可能没有阶段1-2，直接让你舒服地停留在原地，更可怕'
  - '...'
  sources:
  - paper: docs/202303/20230328_162.md
    role: origin
  excerpts:
  - 加入生财的第一年，其实很多人都会有以下感受：
  - 1、看不懂，一篇篇文章长的跟论文似的...
  - 2、这个年入百万，那个年入千万，不吹牛逼会死啊；
  - 3、越看越迷茫，不知道自己做什么好，试了几天，根本赚不到钱，骗鬼啊；
  - 4、卸载知识星球，什么玩意；
  - 5、焦虑了，重新打开生财有术，继续找找项目。
