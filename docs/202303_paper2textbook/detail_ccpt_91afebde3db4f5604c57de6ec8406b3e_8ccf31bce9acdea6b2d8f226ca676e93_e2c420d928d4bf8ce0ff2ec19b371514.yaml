units:
- 'no': 1
  name: 营业执照年报 —— 企业生存的“年度体检单”
  points:
  - '**为什么需要这个概念？**'
  - '- 国家强制要求市场主体每年公示经营状况，是合法经营的“准生证”'
  - '- 逾期不报会触发级联惩罚：经营异常名录 → 严重违法失信名单 → 多部门联合惩戒（贷款、出行、招投标、任职资格全受限）'
  - '- 个体户同属监管范围，不做等同于主动“信用破产”'
  - '**核心定义**'
  - '- 营业执照年度报告（年报）：原称“年检”，指企业、个体户等市场主体在每年6月30日前向登记机关报送上一年度经营情况并向社会公示的制度'
  - '- 经营异常名录：企业未按时履行年报义务，由市场监管部门列入的异常经营状态名单，是信用惩戒的初级阶段'
  - '- 严重违法失信企业名单（黑名单）：列入经营异常名录满3年仍未履行义务，将面临信贷、投资、出行、招投标、任职资格等多维度联合惩戒'
  - '**关键性质**'
  - '- 强制性：所有市场主体（含个体户）均须履行，无豁免权'
  - '- 时效性：每年1月1日-6月30日为法定报送窗口，逾期即违规'
  - '- 累积性：处罚随时间升级，3年是从“异常”到“黑名单”的临界点'
  - '- 穿透性：企业列入黑名单，法定代表人、负责人个人注册新公司、任职资格、出入境同步受限'
  - '**典型例子**'
  - '- 评论区用户遭遇第三方公司电话推销年报服务，收费100元/次，实则官网自助操作零成本即可完成'
  - '- 个体户连续3年年报金额填0，担心“影响信用”又怕“写金额要扣税”，反映小微主体对填报标准的认知盲区'
  - '**边界条件**'
  - '- 地址异常风险：使用虚假、购买、借用地址注册，遇监管现场核查（下户看点）无法通过，将直接导致地址异常并列入经营异常名录，后续需变更地址才能解除'
  - '- 系统稳定性风险：政府公示系统存在故障概率，必须截图留档自证，否则凭空被判定“未年报”无力回天'
  - '- 填报口径模糊区：个体户无标准资产负债表，资产状况可填0或估算；从业人数含法人自身（至少为1）；网店信息须如实勾选（有填无否）'
  sources:
  - paper: docs/202303/20230328_005.md
    role: origin
  excerpts:
  - 营业执照是每年的 6 月底之前做上一年的营业执照年检（也可以叫工商年检）
  - 注意：个体户也是需要年检的哦！
  - 企业未按时进行年报的，将被市监部门列入经营异常名录；若满 3 年企业还未移出的，将被列入严重违法失信企业名单
  - 被列入严重违法失信名单后，企业将不能贷款、投资、出入境、参与招投标、政府采购等，严重影响个人发展
  - 被列入严重违法失信名单后，企业法人等在进行注册新公司、经营、从业任职资格等将被限制
  - 尤其是你的地址不是自己的，是买的、借的等等，被列入异常名录后，工商管理员可能会要下户看点，假如你买的是虚假地址，后续可能还要去变更经营地址
  - 话不多说，上步骤 https://www.gsxt.gov.cn/index.html ... 步骤5：点击'预览并公示' -> '确认公示'，最后最好再截个图留档，免得因为系统问题判定你没有年检
  - 大成冲冲冲：这几天有第三方公司打电话给我，要我做审核，收费 100，这不就省下来了嘛~
  - general：请教一下，个体户每年的年报，金额都写 0 有影响吗，我听说连续 3 年都写 0 有影响。如果写一点金额不会扣税吧
- 'no': 2
  name: 自主网上年报SOP —— 零成本替代第三方代理的“标准动作包”
  points:
  - '**为什么需要这个概念？**'
  - '- 官方渠道（国家企业信用信息公示系统）提供免费自助入口，第三方代理收费100元/属于“智商税”'
  - '- 操作流程高度标准化，无需专业财务知识，按步骤点击即可完成，门槛极低'
  - '- 自主操作可即时确认状态、留存证据，规避代理延误、系统故障导致的误判风险'
  - '**核心定义**'
  - '- 国家企业信用信息公示系统网上年报全流程：官网定位地域 → 登录/注册账号 → 选择“年度报告填写” → 填报联系人/网站网店/股东出资/资产状况等模块
    → 预览并公示 → 确认公示 → 截图留档'
  - '**关键性质**'
  - '- 全链路可视化：每一步均有页面截图引导，所见即所得'
  - '- 关键节点可控：联系人、网店、资产状况等高频报错项均可自主修正'
  - '- 证据可自证：最终公示页面截图具备法律效力，可用于向监管部门申诉纠错'
  - '**典型例子**'
  - '- 作者实操演示：广东省地域选择 → 账号登录 → 填报联系人信息、网站或网店信息、股东及出资信息、资产状况信息 → 提交公示 → 截图留档，全程约10分钟'
  - '- 评论区用户按教程操作后反馈：“这不就省下来了嘛”，验证了零成本自助闭环的可行性'
  - '**边界条件**'
  - '- 账号前置条件：需完成实名注册/登录，无账号无法进入填报界面'
  - '- 数据真实性底线：网店/网站信息须如实勾选，虚假公示属违法行为'
  - '- 系统兼容性：建议使用电脑端浏览器操作，移动端适配可能存在交互异常'
  - '- 个体户简化豁免：无资产负债表的个体户，资产状况可填0或估算，不强制要求专业报表'
  sources:
  - paper: docs/202303/20230328_005.md
    role: origin
  excerpts:
  - 步骤1：选择地域（如广东省）
  - 步骤2：登录/注册账号
  - 步骤3：点击'年度报告填写'
  - 步骤4：填写联系人信息、网站或网店信息、股东及出资信息、资产状况信息等
  - 步骤5：点击'预览并公示' -> '确认公示'
  - 最后最好再截个图留档，免得因为系统问题判定你没有年检，可以拿着图找管理员
  - 大成冲冲冲：这几天有第三方公司打电话给我，要我做审核，收费 100，这不就省下来了嘛~
- 'no': 3
  name: 年报逾期处罚升级链条 —— 从“行政警告”到“信用死刑”的级联机制
  points:
  - '**为什么需要这个概念？**'
  - '- 多数经营者低估逾期后果，认为只是“罚款了事”，实则是多维度生存权剥夺的起点'
  - '- 理解升级链条能建立“敬畏截止线”心理，倒逼按时履行义务，避免因疏忽酿成不可逆后果'
  - '- 揭示行政处罚的时间累积效应与跨部门穿透力，是商业合规管理的必修课'
  - '**核心定义**'
  - '- 年报逾期处罚升级链条：未按时年报 → 列入经营异常名录 → 持续3年未移出 → 列入严重违法失信企业名单 → 触发多部门联合惩戒（融资、出行、招投标、任职资格限制）
    → 信用破产'
  - '**关键性质**'
  - '- 阶梯性：分“异常名录（初级）”与“黑名单（终级）”两级，中间有3年缓冲期'
  - '- 穿透性：惩戒穿透企业法人人格，波及股东、高管个人信用与权利'
  - '- 不可逆性：一旦列入黑名单，移出程序复杂、周期长，实务中极难完全消除负面影响'
  - '**典型例子**'
  - '- 企业因年报逾期被列入异常名录，3年后转入黑名单，法定代表人申请房贷被拒、出境旅游被拦截、参与政府采购投标被拒、注册新公司被驳回'
  - '- 评论区用户因忽视年报，后续需花费数倍成本通过法律途径申诉恢复信用'
  - '**边界条件**'
  - '- 3年临界点：列入异常名录后，若在3年内补报并申请移出，可阻断升级；超3年自动转入黑名单，无人工干预余地'
  - '- 多部门联动：发改委、法院、海关、税务、公安、外汇局等30+部门共享黑名单数据，实现“一处失信、处处受限”'
  - '- 个体户同责：个体户经营者同样适用该链条，经营者个人信用直接受损'
  sources:
  - paper: docs/202303/20230328_005.md
    role: origin
  excerpts:
  - 1.企业未按时进行年报的，将被市监部门列入经营异常名录；若满 3 年企业还未移出的，将被列入严重违法失信企业名单；
  - 2.被列入严重违法失信名单后，企业将不能贷款、投资、出入境、参与招投标、政府采购等，严重影响个人发展；
  - 3.被列入严重违法失信名单后，企业法人等在进行注册新公司、经营、从业任职资格等将被限制；
  - 4.被列入严重违法失信名单后，在企业与他人合作时信用将会遭到质疑，严重影响公司的长远发展。
- 'no': 4
  name: 年报关键填报项自查法 —— 个体户/小微企业的“避坑速查表”
  points:
  - '**为什么需要这个概念？**'
  - '- 官方系统无标准填报模板，个体户、小微企业面对“资产状况”、“从业人数”、“网店信息”等字段常陷入“乱填、不填、瞎填”三大误区'
  - '- 填报错误可能导致数据失真，引发监管预警、税务稽查关联风险，或因虚假公示承担法律责任'
  - '- 掌握核心字段填报逻辑，能以最低认知成本实现合规闭环'
  - '**核心定义**'
  - '- 从业人数：包含法定代表人/经营者自身在内的实际从业总人数，个体户至少为1（含本人）'
  - '- 资产状况：个体户无标准资产负债表时，可填0或按实际经营资产估算填报，不强制要求专业会计报表'
  - '- 网店/网站信息：如实勾选“否”（无网店）或填报真实店铺链接（有网店），严禁虚假勾选或隐瞒'
  - '**关键性质**'
  - '- 实质过形式：监管关注数据真实性而非形式完美，宁可填0/估算，不可编造虚假财务数据'
  - '- 自证留痕：填报前保留经营记账凭证、网店后台截图等佐证材料，备查时可自证合规'
  - '- 动态更新：年报为年度快照，当年发生重大变更（地址、股东、网店）需同步更新，避免新旧数据冲突'
  - '**典型例子**'
  - '- 评论区用户提问：“个体户每年年报金额都写0有影响吗？连续3年写0有影响吗？写一点金额会扣税吗？”——典型的“零申报焦虑”与“纳税认知偏差”共存案例'
  - '- 作者隐含指导：从业人数含法人；资产状况可简化；网店信息须真实勾选'
  - '**边界条件**'
  - '- 纳税申报与年报分离：年报填报营业收入≠纳税申报，写金额不直接触发扣税，但需与税务申报口径逻辑一致'
  - '- 连续零申报预警：连续3年营业收入填0、无从业人员变动、无资产积累，极易被判定为“僵尸企业”触发重点监管'
  - '- 地址异常联动：年报填报地址与登记地址不一致，或无法联系到经营者，将直接触发地址异常核查流程'
  sources:
  - paper: docs/202303/20230328_005.md
    role: origin
  excerpts:
  - 个体户每年的年报，金额都写 0 有影响吗...如果写一点金额不会扣税吧（评论区提问）
  - 请问下是否有网站或网店？要真实勾选吗（评论区提问）
  - 作者隐含回复：从业人数包含法人；资产状况无明确模板可简化；网店信息须真实勾选
  - 最后最好再截个图留档，免得因为系统问题判定你没有年检，可以拿着图找管理员
