units:
- 'no': 1
  name: 评论区需求词库 —— 用户显性需求变身商机雷达
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人不知道做什么项目赚钱，盲目跟风易被收割'
  - '- 传统选品靠猜，缺乏真实用户需求支撑'
  - '- 需要一个低成本、高确定性的选品切入点'
  - '**核心定义**'
  - '- 从小红书笔记评论区提取的用户显性需求关键词结构化集合'
  - '- 覆盖四大变现类型：求链接(实体产品)、怎么学(虚拟产品)、怎么收费(线上服务)、怎么加入(线下服务)'
  - '**关键性质**'
  - '- 直接反映用户真实付费意愿与痛点'
  - '- 可通过千瓜等工具批量导出、清洗、分类建库'
  - '- 是挖掘赚钱项目的起点与核心线索'
  - '**典型例子**'
  - '- 求图/跟团/怎么领等评论关键词，直接对应商机满满的笔记'
  - '- 通过“求链接”找到服装营销笔记，通过“怎么加入”找到线下饭局营销笔记'
  - '**边界条件**'
  - '- 评论区需求词仅为线索，需追溯笔记验证商业模式可行性'
  - '- 依赖平台开放评论数据，若平台限制评论可见则失效'
  - '...'
  sources:
  - paper: docs/202303/20230328_151.md
    role: origin
  excerpts:
  - 评论区里的关键词，是用户留下的需求。
  - 【求图】【跟团】【怎么领】这些评论区里直白的需求表达，对应的不就是商机满满的笔记。
  - 评论区的需求词特点，正好涵盖了全部赚钱项目类型，为我们挖掘大量项目，在客观上提供了实现的可能。
  - 一顿操作猛如虎，构建起了评论区需求词库。
- 'no': 2
  name: 风向标项目库 —— 高质量种子池解决冷启动
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人无从下手找第一个可验证的赚钱项目'
  - '- 盲目搜索效率低，难以区分真假项目'
  - '- 需要一个经过筛选、可追溯的高质量初始样本集'
  - '**核心定义**'
  - '- 生财有术社区整理的2000多条中标风向标数据，含200多条小红书项目'
  - '- 每一条都是经过验证的赚钱项目，且易追溯评论区获取需求词'
  - '**关键性质**'
  - '- 解决冷启动找种子笔记难题'
  - '- 来源可信，由社群团队汇总分类'
  - '- 兼具项目验证与需求词提取双重功能'
  - '**典型例子**'
  - '- 从风向标库中取出“资料引流”类项目，追溯评论区得到“求资料”需求词'
  - '**边界条件**'
  - '- 风向标项目公开时第一波红利已过，仅适合作种子而非直接跟风'
  - '- 需配合社群权限获取，非公开资源'
  - '...'
  sources:
  - paper: docs/202303/20230328_151.md
    role: origin
  excerpts:
  - 生财团队汇总并且分类了 2000 多条中标的风向标，其中小红书有 200 多条。
  - 这里的每一条，都是一个赚钱项目，并且也比较容易追到评论区，取得需求词。
- 'no': 3
  name: 产品项目词库 —— 从杂乱线索到结构化作战地图
  points:
  - '**为什么需要这个概念？**'
  - '- 挖掘出的海量关键词杂乱无序，难以直接指导行动'
  - '- 需要将分散的产品线索整理为可检索、可迭代的知识资产'
  - '- 为后续批量检索、验证、复盘提供标准化索引'
  - '**核心定义**'
  - '- 通过挖掘流程输出的结构化成果'
  - '- 包含实体产品、虚拟产品、线上服务、线下服务四大类别下的数百个细分关键词'
  - '**关键性质**'
  - '- 可直接用于小红书检索定位具体赚钱项目'
  - '- 动态迭代：挖掘新项目持续补充入库'
  - '- 连接“需求词”与“具体项目”的桥梁'
  - '**典型例子**'
  - '- 词库包含：花植艺、壁纸、公益赠书、交友活动、门挂材料包、考证资料等'
  - '- 词库链接：https://lvcj32c4z9.feishu.cn/docx/GivVdS3L5otoTMxtObVcHIsJnIh'
  - '**边界条件**'
  - '- 词库本身不等于赚钱，需配合四维验证模型落地'
  - '- 关键词时效性随平台趋势变化，需定期更新维护'
  - '...'
  sources:
  - paper: docs/202303/20230328_151.md
    role: origin
  excerpts:
  - 索性把两大类四小项都一起挖了，整理成了这个产品项目词库。
  - 这就是一条好鱼了，但，这鱼怎么吃？我们取产品词库里的花植艺、壁纸、公益赠书、交友活动...来分析。
  - 词库链接：https://lvcj32c4z9.feishu.cn/docx/GivVdS3L5otoTMxtObVcHIsJnIh
- 'no': 4
  name: 异常值账号 —— 反常规操作藏着高阶玩法
  points:
  - '**为什么需要这个概念？**'
  - '- 常规账号运营模式同质化严重，难以建立差异化优势'
  - '- 高权重账号敢于冒险的操作，往往经过深思熟虑，含金量高'
  - '- 通过观察“异类”能发现被主流忽视的蓝海打法'
  - '**核心定义**'
  - '- 在精细挖掘阶段发现的反常规认知的账号'
  - '- 特征：高粉丝量账号冒风险做资料引流、超长周期坚持的早期入局账号'
  - '**关键性质**'
  - '- 通过深度复盘其运营策略提炼可复制的高阶玩法'
  - '- 需人工翻阅账号全量笔记，分析内容结构、引流路径、变现组合拳'
  - '- 属于微观精细挖掘的核心手段'
  - '**典型例子**'
  - '- 12万粉账号：真人出镜讲化学(建立IP信任)混搭资料笔记(引流/变现)，规避纯资料号废号风险'
  - '- 14万粉早期账号：三重变现组合拳(接广+引流公众号赚广告费+网盘拉新返佣)'
  - '**边界条件**'
  - '- 异常值可能是幸存者偏差，需验证其可复制性'
  - '- 高权重账号的特权操作（如挂公众号链接）普通账号无法直接模仿'
  - '- 耗时极大，需人工逐条翻阅复盘，难以规模化'
  - '...'
  sources:
  - paper: docs/202303/20230328_151.md
    role: origin
  excerpts:
  - 竟然有大几万、十万的账号，在玩资料引流。要知道，这可是废号的操作，真舍得？
  - 她的账号内容，实现了个人 IP 和资料号的结合...一石二鸟，骚操作不就这么通过异常值，挖掘出来了。
  - 这一石三鸟，比上面的博主会玩。
- 'no': 5
  name: 品类拓展法 —— 从已知关键词挖掘未知蓝海
  points:
  - '**为什么需要这个概念？**'
  - '- 只盯着已知赛道会陷入红海厮杀'
  - '- 需要系统性方法从单一产品词向关联赛道辐射'
  - '- 单纯靠直觉联想覆盖面窄、遗漏多'
  - '**核心定义**'
  - '- 在标题批量分析阶段，从已知产品关键词挖掘未知细分赛道的核心方法'
  - '- 包含直接拓展和间接拓展两条路径'
  - '**关键性质**'
  - '- 直接拓展：投喂标题/标签给ChatGPT提炼产品并拓展品类，再回小红书验证'
  - '- 间接拓展：利用外部垂类导航站(如桔梗上网导航)获取全量关键词，反哺小红书检索'
  - '- 宏观批量分析的核心手段，配合维度筛选、数据清洗使用'
  - '**典型例子**'
  - '- 直接拓展：输入“资料引流”标题让GPT拓展出“考研资料”、“公考资料”等细分品类'
  - '- 间接拓展：从桔梗导航“考试”分类挖出MPA、公共英语、司法考试等关键词，在小红书验证发现资料引流风生水起但种子数据未覆盖'
  - '**边界条件**'
  - '- 直接拓展依赖GPT知识库边界，可能产生幻觉需验证'
  - '- 间接拓展需找到高质量垂类导航站，覆盖面受限于导航站完整度'
  - '- 拓展出的赛道仍需四维验证模型确认可行性'
  - '...'
  sources:
  - paper: docs/202303/20230328_151.md
    role: origin
  excerpts:
  - 品类拓展，又分为直接拓展和间接拓展。
  - ①直接拓展：这里，用到 chatGTP，思路是通过标题，分析它可能的产品，检索相关笔记，模仿内容引流...以品类，倒推细分赛道。
  - ②间接拓展：当我们发现职业考试这条赛道时...会不会有人想要考证，但是不知道有哪些证可以考？...做了一个网页，把全部可以考的证，都放在上面。
- 'no': 6
  name: 异常值挖掘法 —— 深度复盘反常规账号提炼核心打法
  points:
  - '**为什么需要这个概念？**'
  - '- 批量分析只能看清赛道全貌，看不透单个项目的操盘细节'
  - '- 头部账号的核心打法往往隐藏在非标准化操作中'
  - '- 需要微观手术刀式的深度挖掘手段'
  - '**核心定义**'
  - '- 在笔记精细挖掘阶段，关注数据分布中的异常点'
  - '- 通过人工翻阅账号全量笔记复盘其内容结构、引流路径、变现组合拳'
  - '- 提炼出降低风险、提升转化的高阶运营模式'
  - '**关键性质**'
  - '- 微观精细挖掘的核心手段，与宏观批量分析互补'
  - '- 关注点：高权重账号执行高风险动作、超长周期坚持账号'
  - '- 产出：可复制的运营模式(如IP+资料混搭、多元变现组合拳)'
  - '**典型例子**'
  - '- 12万粉账号翻到底400条笔记，发现“IP+资料”混搭模式：真人出镜建信任+资料引流变现'
  - '- 14万粉账号发现三重变现：接广+引流公众号赚广告费+网盘拉新返佣'
  - '**边界条件**'
  - '- 极度耗时(需人工翻阅全量笔记)，仅适合重点账号深挖'
  - '- 发现的模式可能含幸存者偏差，需小规模测试验证'
  - '- 要求挖掘者具备较强的业务洞察力，否则易看不懂、学不会'
  - '...'
  sources:
  - paper: docs/202303/20230328_151.md
    role: origin
  excerpts:
  - 怎么精细挖掘，我利用的是异常值。
  - 竟然有大几万、十万的账号，在玩资料引流...于是，我进入了这个 12w 粉的账号主页，她真是变态，更了 400 条，我更变态，账号翻到底。
  - 也给了我们启发，做 IP，可以混搭少量资料笔记，实现引流，做资料号，可以发干货内容，提升权重。
- 'no': 7
  name: 四维项目验证模型 —— 落地性评估的标准化体检表
  points:
  - '**为什么需要这个概念？**'
  - '- 挖掘出大量项目后，不知道哪个值得做、怎么做、能赚多少'
  - '- 主观判断易受情绪干扰，缺乏客观评估标准'
  - '- 需要一个结构化框架快速过滤伪需求、烂项目'
  - '**核心定义**'
  - '- 将挖掘到的具体项目进行落地性评估的标准化框架'
  - '- 四维度：产品服务(卖什么) → 变现模式(怎么卖/流程) → 赚钱思路(底层逻辑/可复制性) → 收益评估(量级/单价/ROI)'
  - '**关键性质**'
  - '- 标准化、结构化、可迭代'
  - '- 逻辑递进：先看有什么卖，再看怎么卖，再懂为什么赚钱，最后算赚多少'
  - '- 可作为项目决策的“通关文牒”'
  - '**典型例子**'
  - '- 门挂材料包案例：产品服务=DIY材料包；变现模式=中间商赚差价；赚钱思路=利用信息差；收益评估=单品卖3万多'
  - '**边界条件**'
  - '- 评估结果依赖数据真实性，若源头数据造假则结论失效'
  - '- 无法预测平台政策突变带来的系统性风险'
  - '- 仅适用于已有雏形项目，不适用于从0到1的创新验证'
  - '...'
  sources:
  - paper: docs/202303/20230328_151.md
    role: origin
  excerpts:
  - 用【产品服务】【变现模式】【赚钱思路】【收益评估】的思路来分析。
  - 产品服务：门挂材料包。变现模式：主打的就是 DIY...赚钱思路：做个中间商赚差价。收益评估：这个单品就卖了 3w 多。
- 'no': 8
  name: 需求词即商机入口论 —— 评论区显性需求覆盖四大变现类型
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人找项目靠猜，缺乏确定性线索'
  - '- 需要一个理论支撑，证明评论区关键词挖掘的普适性与必要性'
  - '**核心定义**'
  - '- 小红书评论区的显性需求词天然覆盖实体产品、虚拟产品、线上服务、线下服务四大变现类型'
  - '- 是发现低调赚钱项目的最高效线索'
  - '**关键性质**'
  - '- 映射关系：求链接→实体产品、怎么学→虚拟产品、怎么收费→线上服务、怎么加入→线下服务'
  - '- 客观存在，不依赖主观臆断'
  - '- 为全流程挖掘提供理论基石'
  - '**典型例子**'
  - '- 图一：通过“求链接”找到属实体产品服装营销笔记'
  - '- 图四：通过“怎么加入”找到线下服务的线下饭局营销笔记'
  - '**边界条件**'
  - '- 仅适用于评论区开放、用户真实表达需求的平台'
  - '- 需甄别真实需求与刷单/水军评论'
  - '- 需求词是入口，非终点，后续仍需验证商业模式'
  - '...'
  sources:
  - paper: docs/202303/20230328_151.md
    role: origin
  excerpts:
  - 评论区的需求词特点，正好涵盖了全部赚钱项目类型，为我们挖掘大量项目，在客观上提供了实现的可能。
  - 图一：通过“求链接”，可以找到属实体产品服装营销笔记...图四：通过“怎么加入”，可以找到线下服务的线下饭局营销笔记。
- 'no': 9
  name: 信息差时效性与选择权悖论 —— 掌握渔夺回选择权
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人看到风向标就跟风做，结果吃剩饭、背风险'
  - '- 不理解信息公开滞后于红利期的本质规律'
  - '- 缺乏自主挖掘能力，选择权被他人掌握'
  - '**核心定义**'
  - '- 当赚钱项目被公开分享时，第一波红利已过'
  - '- 盲目跟风意味着选择权被剥夺'
  - '- 唯有掌握自主挖掘方法(渔)，才能在千百选项中匹配适合自身的项目，夺回选择权'
  - '**关键性质**'
  - '- 揭示信息传播的时间差本质'
  - '- 将“给鱼”升级为“授渔”的核心动机'
  - '- 认知层面的防御机制，防止被收割'
  - '**典型例子**'
  - '- 作者把方法和项目都分享出来，把渔和鱼都给出来，让选择权回到读者手上'
  - '**边界条件**'
  - '- 掌握方法不等于必然赚钱，执行力、资源匹配度等变量仍起决定作用'
  - '- 部分极强时效性红利(如平台补贴期)即便有方法也可能来不及布局'
  - '...'
  sources:
  - paper: docs/202303/20230328_151.md
    role: origin
  excerpts:
  - 当别人把赚钱项目分享出来的时候，你已经错过第一波红利了，更重要的是，当别人告诉你什么赚钱你就去做的时候，你的选择权其实已经被没收了。
  - 我真心希望，大家都拥有挖掘项目的能力，在千百条选择中，遇见最适合自己的项目...这一次，我把方法和项目都分享出来，把渔和鱼都给出来，让选择权都回到你们手上。
- 'no': 10
  name: 宏观批量与微观精细互补论 —— 看全貌更要看本质
  points:
  - '**为什么需要这个概念？**'
  - '- 单一维度分析要么快但不透、要么透但不全'
  - '- 实战中易陷入“只见树木不见森林”或“只见森林不见树木”'
  - '- 需要一套组合拳方法论覆盖广度与深度'
  - '**核心定义**'
  - '- 单纯批量分析快但缺细节，单纯精细挖掘深但面窄'
  - '- 必须结合：宏观用数据清洗、维度筛选、品类拓展看全貌；微观用异常值深挖看本质'
  - '- 二者结合才能全面看清赛道格局与隐藏玩法'
  - '**关键性质**'
  - '- 方法论层面的互补原则'
  - '- 宏观：笔记形式/账号属性/笔记类型基础分析 + 品类拓展'
  - '- 微观：异常值账号全量笔记复盘 + 高阶模式提炼'
  - '- 执行节奏：先宏观筛选赛道，再微观深挖标杆'
  - '**典型例子**'
