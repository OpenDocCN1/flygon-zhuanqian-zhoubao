units:
- 'no': 1
  name: 短剧CPS推广 —— 版权授权+二创剪辑的低门槛分成变现
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人想做短视频带货，但苦于不会拍摄、不敢露脸、没货源、没供应链'
  - '- 传统电商需要选品、囤货、发货、售后，门槛高、风险大、周期长'
  - '- 需要一种无需实名、无需原创拍摄、无需发货售后、即学即用的变现路径'
  - '**核心定义**'
  - '- 获得短剧平台官方授权，将长剧剪辑成短视频发布抖音/快手，挂载小程序链接'
  - '- 用户点击链接充值看后续剧集，推广者按单次销售获取约50%佣金分成'
  - '- 属于内容分发变现赛道，核心动作是“剪辑高潮片段+卡点留悬念+引导充值”'
  - '**关键性质**'
  - '- 零门槛：不需实名认证、不需原创能力、不需囤货发货、仅需会剪映电脑'
  - '- 高杠杆：单条视频制作≤20分钟，单号日更1-3条，矩阵号可线性放大收益'
  - '- 确定性强：爆款产出比近2:1（发2-3条出1个爆款），几百播放即可出单'
  - '- 蓝海期特征：巨量算数显示“内容分低、搜索分高、供不应求、持续增长”'
  - '**典型例子**'
  - '- 作者清欢：近1个月发40余条视频，爆款十几个，变现1万+，日均投入3小时'
  - '- 作者实操：3个账号矩阵，20天充值2万+，单账号日更1条即稳定产出爆款'
  - '- 团队验证：坚持执行的小伙伴基本都拿到结果，适合零基础小白兼职操作'
  - '**边界条件**'
  - '- 必须获得官方授权渠道，私自剪辑发布极大概率侵权封号'
  - '- 视频剧情不能连贯完整，必须在高潮处掐断留悬念，否则用户无充值动力'
  - '- 单账号累计发100条无单需止损换项目，避免沉没成本陷阱'
  - '- 平台风控收紧期（原创度算法升级）可能导致搬运去重失效，需动态调整去重参数'
  sources:
  - paper: docs/202303/20230328_146.md
    role: origin
  - paper: docs/202303/MwIYdeZNio8bWUxAEGCcOhO2nlc.md
    role: improve
  excerpts:
  - 短剧cps，小白也能月入过万的蓝海项目
  - 最近在做短剧 cps 项目，目前做了将近 1 个月，变现 1w＋
  - 发了 40 多个视频，爆了十几个，视频发布比和爆款产出比将近 2:1
  - 一开始原创，现在只做搬运。一个作品最多 20min 就能做完
  - 短剧就是有专门的团队，把一些热门小说拍成电视剧...我们赚的就是付费佣金，佣金在50%左右
  - 我们剪辑属于二创剪辑，需要自己再加工，剧情一般剪辑到高潮部分就卡住，拿捏住用户好奇的心理，引导他们去小程序看后续
  - 由于短剧推广需要二创，不能发完整的剧集，需要我们再次剪辑并适当去重
  - 重点：开幕雷击，结局悬念，中间矛盾冲突
  - 去重步骤：...添加多个滤镜，贴纸和特效...对画面进行自由剪裁...选择画面模糊...调整视频速度...在视频上方再覆盖一层新的视频
  - 视频发布第二天，看收益后台竟然已经充值了49元，但是当时我的视频播放量才600多！
  - 去巨量算数搜索验证，数据如下：内容分低，搜索分高，供不应求，并持续增长，说明了什么，说明了这是妥妥的蓝海期啊！
  - 如果我发够 100 个作品之后，还一单都没有出。就换新项目。
- 'no': 2
  name: 沉浸式预剪辑法 —— 通看剧情建立心智模型是高爆款率核心
  points:
  - '**为什么需要这个概念？**'
  - '- 很多新手剪辑只会机械拼接片段，导致剧情零碎、逻辑不通、用户看不懂'
  - '- 不懂剧情走向，就无法精准定位“愤怒、吃惊、暧昧、争执、雷人、狗血、误会”等情绪点'
  - '- 剪辑技术再好，不懂内容逻辑，产出的视频也是“废片”，转化率极低'
  - '**核心定义**'
  - '- 视频导入剪映前，先花1-2小时完整通看短剧梗概，建立全局剧情心智模型'
  - '- 在脑海中预演：哪里是高潮？哪里适合卡点？哪里能引发强烈情绪共鸣？'
  - '- 剪辑时按预设情绪点精准切片，保证叙事连贯性与情绪张力'
  - '**关键性质**'
  - '- 磨刀不误砍柴工：前置1-2小时投入，换取后续剪辑效率与质量的指数级提升'
  - '- 核心竞争力：作者认为这是其“剪辑技术不太好，但爆款率却相对较高”的核心原因'
  - '- 可迁移性：该方法适用于所有影视解说、短剧推广、小说推文等内容赛道'
  - '**典型例子**'
  - '- 作者实操：每部剧剪辑前必看1-2小时剧情，精准拿捏“高潮/反转/紧张氛围”卡点位置'
  - '- 对比：不看剧情直接剪辑者，视频逻辑混乱，完播率低、转化差、易被判搬运'
  - '**边界条件**'
  - '- 仅适用于有完整剧情脉络的短剧/影视素材，不适用于纯素材混剪类视频'
  - '- 需要投入前置时间成本，不适合“完全不想动脑子、只想机械操作”的执行者'
  - '- 随AI视频理解能力提升，未来可能被“AI通看剧情+自动生成剪辑脚本”替代'
  sources:
  - paper: docs/202303/MwIYdeZNio8bWUxAEGCcOhO2nlc.md
    role: origin
  excerpts:
  - 视频导入剪映后我们先花1-2个小时大致看一下剧情，磨刀不误砍柴工，如果自己都不知道剧情发生了什么，很难剪辑出吸引人的视频，因为剧情会很零碎，这个应该也是我虽然剪辑视频技术不太好，但爆款率却相对较高的原因之一了。
- 'no': 3
  name: 卡点式剧情结构与模块化复用 —— 开幕雷击+中间冲突+结局悬念的爆款公式
  points:
  - '**为什么需要这个概念？**'
  - '- 短剧用户付费动力源于“好奇心缺口”，完整剧情会杀死付费欲望'
  - '- 随意剪辑无结构，要么开头无钩子留不住人，要么结尾无悬念不转化'
  - '- 单部剧素材有限，如何从1部剧高效产出10-20条差异化视频是效率核心'
  - '**核心定义**'
  - '- 视频三段式结构：开幕雷击（前5-10秒暴力冲突/暗示台词） → 中间矛盾冲突（N个高潮片段非连贯拼接，节奏紧凑） → 结局悬念（高潮/反转处强行掐断，引导充值）'
  - '- 模块化复用：将1个爆款视频拆解为“固定开头池、固定结尾池、N个中间片段池”，组合排列快速生产差异化视频'
  - '**关键性质**'
  - '- 开头决定完播：前3秒必须有冲突画面或暗示台词，暴力、争吵、背叛等强刺激优先'
  - '- 中间决定节奏：去除废话铺垫，只保留矛盾冲突核心段落，多故事并行拼接'
  - '- 结尾决定转化：必须在“最想知道后续”的瞬间戛然而止，配合评论区图片引导'
  - '- 复用倍增：单部剧可产出10-20条视频，剧情不连贯避免用户看完就不充值'
  - '**典型例子**'
  - '- 作者操作：参考点赞成千上万的爆款视频开头结尾，1:1模仿结构套用新素材'
  - '- 实测：爆款视频开头多为“暴力冲突/出轨对峙/身份反转”，结尾多为“刀架脖子上/离婚协议甩脸上/真相即将揭开”'
  - '**边界条件**'
  - '- 仅适用于短剧/小说推文等强剧情类内容，不适用于知识付费、口播、带货等赛道'
  - '- 过度使用同一开头/结尾模板会被平台判定“低质量内容”限流，需定期更新素材库'
  - '- 中间片段池需保持一定数量（建议≥5个），否则组合出的视频重复度过高触发查重'
  sources:
  - paper: docs/202303/MwIYdeZNio8bWUxAEGCcOhO2nlc.md
    role: origin
  - paper: docs/202303/20230328_146.md
    role: apply
  excerpts:
  - 重点：开幕雷击，结局悬念，中间矛盾冲突。
  - 开头：5-10秒 暗示性的台词，暴力冲突的画面... 中间：矛盾冲突 N个故事合并...去除多余画面...节奏紧凑... 结尾：留悬念，在剧情「高潮、反转、紧张氛围」处掐断，引导充值
  - 方法2：第一次剪辑完成一个视频后，直接把视频分开头，中间1，中间2，中间n ...结尾，利用快捷键i,o导出...后面再剪辑基本上不用再添加新的剧情了，可以通过，增加，减少，调整，调换不同剧情的视频片段或者顺序等，做到快速产出
  - 视频播放量高，转化低是什么原因...4、本身剪辑逻辑的问题，把观众想看的全部都剪进视频了，结尾没有悬念，用户充值欲望不强。
- 'no': 4
  name: 标准化去重流水线SOP —— 以最低成本通过原创度审核的动作序列
  points:
  - '**为什么需要这个概念？**'
  - '- 平台原创度查重越来越严，直接搬运必被限流/封号'
  - '- 复杂的后期特效耗时长、门槛高，新手不会AE/PR只会剪映'
  - '- 需要一套“仅用剪映、可标准化、可批量、过审率高”的去重最小动作集'
  - '**核心定义**'
  - '- 7步去重标准动作序列：合成复合片段 → 叠加多滤镜/贴纸/特效调参 → 自由裁剪保留主体 → 画面模糊填充黑边 → 变速1.1x-1.3x → 覆盖静音素材层
    → 导出1080p最低码率'
  - '- 核心原理：通过画面结构微调（裁剪/模糊/变速）+ 像素级干扰（滤镜/贴纸/覆盖层）+ 编码参数变化（最低码率），改变视频MD5与特征指纹'
  - '**关键性质**'
  - '- 工具极简：全流程仅需剪映专业版（免费），零代码、零插件、零外部软件'
  - '- 参数固化：变速范围1.1-1.3x、码率最低、分辨率1080p，无需每次纠结调参'
  - '- 批量友好：动作序列固定，极易制作成剪映“草稿模板”或RPA自动化脚本'
  - '- 成本极低：单条视频去重处理耗时≤5分钟，配合预剪辑总耗时≤20分钟'
  - '**典型例子**'
  - '- 作者实测：该流水线稳定通过抖音/快手原创度审核，支撑矩阵号日更9条高频运转'
  - '- 避坑指南：画面模糊强度不可过高（影响观感）、覆盖层视频必须静音（避免音频指纹查重）'
  - '**边界条件**'
  - '- 仅对抗“画面指纹/MD5”层面的查重，无法对抗“语义/剧情/音频”层面的深度查重'
  - '- 素材源若为平台热门爆款（已被千人去重），去重难度指数级上升，建议选“近期上升期/长尾流量”素材'
  - '- 算法迭代后可能新增“动作轨迹/光流”检测，需持续测试调整参数（如变速范围扩大到0.9-1.5x）'
  sources:
  - paper: docs/202303/MwIYdeZNio8bWUxAEGCcOhO2nlc.md
    role: origin
  excerpts:
  - 去重步骤：...鼠标右键选择复合片段，将视频合成一段...添加多个滤镜，贴纸和特效，并调整参数...对画面进行自由剪裁，保留带字幕和人物主题部分...选择画面模糊...调整视频速度，加速1.1x-1.3x...在视频上方再覆盖一层新的视频，静音并调整参数...导出参数：分辨率1080p,
    码率选择最低。
- 'no': 5
  name: 低播放高转化蓝海论 —— 几百播放即出单的供需错配红利
  points:
  - '**为什么需要这个概念？**'
  - '- 传统认知：播放量=流量=变现，播放低就赚不到钱'
  - '- 短剧CPS打破认知：播放600即充值49元，几千播基本出单，转化率极其惊人'
  - '- 需要理论工具判断：这是昙花一现的漏洞，还是可持续的赛道红利？'
  - '**核心定义**'
  - '- 核心判断依据：内容分低、搜索分高、供不应求、持续增长（巨量算数四维验证）'
  - '- 本质：用户主动搜索剧名/关键词观看，意图极强（搜索分高）；优质剪辑内容稀缺（内容分低/供不应求），平台被迫分发低粉/低播账号'
  - '- 结论：处于红利期的蓝海项目，适合小白低成本切入'
  - '**关键性质**'
  - '- 反直觉指标：不看播放量看搜索量，不看粉丝看转化率，不看完播率看充值率'
  - '- 红利窗口：随入局者增多，内容分上升、搜索分下降、供需平衡，红利必然消退'
  - '- 核心护城河：不是剪辑技术，而是“选剧眼光+卡点能力+矩阵执行力”的组合'
  - '**典型例子**'
  - '- 作者验证：视频播放600即出单，巨量算数数据印证蓝海判断'
  - '- 同行印证：很多小伙伴“大多都是几千播基本就能出单”'
  - '**边界条件**'
  - '- 仅限短剧CPS等“强搜索意图+高付费转化”的特殊品类，不可推广至带货/广告等依赖推荐流的赛道'
  - '- 平台若上线“短剧专区/原创保护/付费预览”功能，将彻底改变流量分发逻辑，红利瞬间终结'
  - '- 素材源若版权收紧（平台回收授权/独家签约头部MCN），小白将失去合法素材来源'
  sources:
  - paper: docs/202303/MwIYdeZNio8bWUxAEGCcOhO2nlc.md
    role: origin
  - paper: docs/202303/20230328_146.md
    role: apply
  excerpts:
  - 视频发布第二天，看收益后台竟然已经充值了49元，但是当时我的视频播放量才600多！...很多一起做短剧的小伙伴也大多都是几千播基本就能出单。
  - 去巨量算数搜索验证，数据如下：内容分低，搜索分高，供不应求，并持续增长，说明了什么，说明了这是妥妥的蓝海期啊！
  - 目前是项目红利期，市场空间很大，操作难度基本为零，零基础小白也可轻松上手
- 'no': 6
  name: 矩阵号运营与止损机制 —— 用概率对抗不确定性的规模化生存法则
  points:
  - '**为什么需要这个概念？**'
  - '- 单账号流量极不稳定：前3-5个视频通常不高，易劝退新手；单账号封号/限流风险不可控'
  - '- 单账号产能有上限：日更1-3条，无法通过单号规模化放大收益'
  - '- 需要一套“批量注册/养号 → 同步分发 → 数据监控 → 动态止损”的标准化运营体系'
  - '**核心定义**'
  - '- 矩阵号体系：单人操作3-5个账号，单号日更1-3条，总日产9-15条，物理隔离设备/网络/账号'
  - '- 养号标准：新号注册后静默2-3天（刷同类短剧/点赞/评论），建立垂直标签再发布'
  - '- 止损铁律：单账号累计发100条作品无任何订单，判定赛道/账号/执行失效，果断换项目'
  - '- 账号成本规避：抖音旧号淘宝10元换绑解绑重注册（规避7天注销期）；快手旧号注销当天重注'
  - '**关键性质**'
  - '- 概率放大：单号爆款率2:1，3号矩阵日产9条，月产270条，数学期望月产90+爆款，收益确定性大增'
  - '- 成本控制：账号获取成本≤10元/个，时间成本日均3小时，边际成本趋近零'
  - '- 风险隔离：单号违规/封号不波及其他号，单号止损不影响整体项目推进'
  - '**典型例子**'
  - '- 作者实操：3个号矩阵，日更9条，20天充值2万+，单号日更1条即稳定产出'
  - '- 规避注销期：淘宝10元解绑旧号重注册，快手当天注销重注，解决“授权需新号vs注销周期长”矛盾'
  - '**边界条件**'
  - '- 矩阵规模受限于“实名额度/设备数量/人力精力”，单人极限约5-10号，再大需组建团队分工'
  - '- 平台若推出“同主体关联账号限流”策略（如同一身份证名下多号限流），矩阵模式将失效'
  - '- 止损线100条需根据赛道周期调整：周期短的赛道可降至50条，周期长的可宽至200条'
  sources:
  - paper: docs/202303/20230328_146.md
    role: origin
  - paper: docs/202303/MwIYdeZNio8bWUxAEGCcOhO2nlc.md
    role: improve
  excerpts:
  - 我目前做了 3 个号...一个号一天发三个作品，三个号就是 9 个作品。一天顶多三个小时，肯定能做完。
  - 如果我发够 100 个作品之后，还一单都没有出。就换新项目。
