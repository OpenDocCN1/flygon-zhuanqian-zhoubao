  - '- 内训失效根因：只有赋能系统（教），无赋权系统（用），学以致用闭环未打通'
  - '**边界条件**'
  - '- 招人要慢、开人要快：管理者对员工一丁点不满员工即可感知，延迟解聘仅增加沉没成本与组织毒性'
  - '- 管理底线即员工行为底线：员工会不断试探底线直到突破，容忍度决定团队纪律下限'
