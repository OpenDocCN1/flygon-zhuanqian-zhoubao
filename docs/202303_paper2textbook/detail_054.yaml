learning_targets:
- 理解组织信息过滤的成因与管理者认知盲区的必然性
- 掌握打破单一汇报渠道、通过跳级汇报与多层级交叉验证获取真相的方法
- 掌握识别语言潜台词（如‘未痛快答应即拒绝’）的非显性信号解码技巧
- 理解商业即设计的核心逻辑：认知决定边界、体系决定上限、标准化决定规模
- 掌握阶段性战略匹配法：早期比产品、中期比渠道、后期比战略组织
- 掌握经营策略四选二与目标对齐六遍法，避免贪多嚼不烂
- 理解人才三层次模型与价值观优先原则：招参与者、价值观=1能力=0
- 掌握人岗匹配大于激励机制、捧千里马消灭耗子清理老白兔的人才盘点法
- 理解零和/非零和博弈决定战略必要性、农业经济周期律与商业社会化临界点
- 掌握标品/非标品定价权定理与通过SKU组合获取定价权的方法
- 掌握用户洞察‘信腿不信嘴’法与产品效果外化‘高认知、反常识、可量化’三要素
- 理解转介绍触发机制：超预期体验+准备好转发物料
concept_map:
- 组织管理与商业设计核心体系
- ├── 组织信息获取与真相机制
- │   ├── 组织信息过滤 —— P001
- │   ├── 管理盲区与认知滞后 —— P002
- │   ├── 权力不对等导致真话缺失定律 —— P001
- │   ├── 语言潜台词识别：未痛快答应即拒绝 —— P002
- │   ├── 跳级汇报/多层级交叉验证法 —— P002
- │   └── 心理安全感建设与离职真相挖掘 —— P001
- ├── 商业设计顶层逻辑
- │   ├── 商业即设计定理：认知决定边界/体系决定上限/标准化决定规模 —— P003
- │   ├── 创始人认知瓶颈与迁移能力 > 学习能力 —— P003
- │   ├── 三类业务形态：改造型/替代型/创造型 —— P003
- │   ├── 阶段不可跨越定理：野蛮生长→投资入场→监管经济 —— P003
- │   ├── 第二曲线判据与组织能力溢出公式 —— P003
- │   └── 正确寻找第二曲线时机：第一曲线最好时而非衰退期 —— P003
- ├── 组织管理与人才体系
- │   ├── 管理三阶层：自我/团队/组织管理(直接→间接) —— P004
- │   ├── 人才三层次：使用者→探索者→造物者(招参与者) —— P004
- │   ├── 价值观优先原则：价值观=1/能力=0 —— P004
- │   ├── 人岗匹配 > 激励机制：人是1/机制是0 —— P004
- │   ├── 捧千里马/消灭耗子/清理老白兔人才盘点 —— P004
- │   ├── 合伙人性格相融法：宽容理解差异 —— P004
- │   ├── 招人要慢开人要快与管理底线即员工行为底线 —— P004
- │   ├── 内训失效根因：只有赋能系统无赋权系统 —— P004
- │   └── 标准化分层：软件易/人难是规模化瓶颈 —— P004
- ├── 阶段性战略与经营策略
- │   ├── 阶段性战略匹配：早期比产品/中期比渠道/后期比战略组织 —— P005
- │   ├── 直播业务三阶段：拼流量→拼供应链→拼品牌 —— P005
- │   ├── 经营策略四选二：广度/深度/高度/速度每阶段选二 —— P005
- │   ├── 目标对齐六遍法：不可能→有意思→可能→可试→应该能→肯定能 —— P005
- │   ├── 新业务孵化：老人做新事(配互联网人才)/新人做老事(收购原老大) —— P005
- │   ├── 零和/非零和博弈决定战略必要性：上升期非零和/存量期零和 —— P005
- │   ├── 农业经济周期律：春种秋收夏耘冬藏违背必反噬 —— P005
- │   └── 商业社会化临界点：体量达规模需担社会责任 —— P005
- ├── 商业模式与定价权
- │   ├── 商业模式本质是经营方式：用户停留时长决定清晰度 —— P006
- │   ├── 平台博弈定理：弱则靠平台/强则造平台 —— P006
- │   ├── 标品/非标品定价权定理：理性比价无权/感性评估有权 —— P006
- │   ├── SKU组合非标化获取定价权 —— P006
- │   ├── 战略决定组织：以旧组织执行新战略必败 —— P006
- │   ├── 免费流量不确定需工程化/付费流量相对确定拼ROI —— P006
- │   └── 小红书去重算法窗口期仅剩半年(素材宣称) —— P006
- └── 用户洞察与产品外化
- '    ├── 用户洞察信腿不信嘴：看行为数据而非口头反馈 —— P007'
- '    ├── 产品效果外化三要素：高认知/反常识/可量化外化到行动 —— P007'
- '    ├── 转介绍触发机制：超预期体验+准备好转发物料降低行动成本 —— P007'
- '    ├── 服务本质外向型：问客户需求/调动资源解决问题而非卖现有能力 —— P007'
- '    └── 业务停滞3-6月判定：方向错而非执行不力果断止损 —— P007'
life_analogy:
- 想象组织管理是一场**‘破案游戏’**：
- '- **管理者** = 只能通过汇报材料了解案情的**局长**'
- '- **中层汇报** = 只报喜不报忧、为了业绩包装真相的**分局长**'
- '- **一线员工** = 知道真凶是谁但怕担责不敢作证的**知情群众**'
- '- **信息过滤** = 层层加码的‘好消息’滤镜，让局长看到的全是‘治安大好’的假报告'
- '- **跳级汇报/交叉验证** = 局长私下微服出访、分别询问派出所民警、社区大妈、出租车司机，**拼凑出真实拼图**'
- '- **语言潜台词** = 嫌疑人说‘我再考虑考虑’、‘下次吧’，老刑警一听就知：**这是拒绝**'
- 就像破案不能只听汇报，管理也不能只信单一渠道；必须主动打破信息茧房，通过多维交叉、读懂弦外之音，才能拼凑出组织的真实面貌。
summary:
- concept: 组织信息过滤
  desc: 权力不对等导致下级说真话风险高、说假话成本低，上级接收信息系统性失真
- concept: 管理盲区
  desc: 仅依赖正式汇报渠道的管理者，必然成为组织中最后一个知晓核心问题的人
- concept: 跳级汇报/交叉验证
  desc: 主动跨越层级获取信息，对比不同立场反馈差异以拼凑真相的核心手段
- concept: 语言潜台词识别
  desc: ‘未痛快答应即拒绝’：通过及时性/确定性/热情度解码非显性拒绝信号
- concept: 商业即设计
  desc: 业务成败上限从Day 1即由创始人认知与战略设计锁定，执行只能在边界内优化
- concept: 认知迁移能力
  desc: 比学习能力更关键：将成熟能力体系迁移至新赛道(如图文分发→视频分发)
- concept: 三类业务形态
  desc: 改造型(提效)、替代型(线上化)、创造型(新物种)，决定竞争逻辑与护城河
- concept: 阶段性战略匹配
  desc: 早期比产品/技术，中期比渠道/获客效率，后期比战略/组织；错位投入必败
- concept: 经营策略四选二
  desc: 广度/深度/高度/速度四种策略每阶段最多选两种，避免贪多嚼不烂
- concept: 目标对齐六遍法
  desc: 目标下达需反复沟通6遍，完成团队从‘不可能’到‘肯定能’的心理建设
- concept: 人才三层次与价值观优先
  desc: 使用者→探索者→造物者(招参与者)；价值观=1能力=0，价值观难改能力可培养
- concept: 人岗匹配大于激励
  desc: 人是1机制是0，早期核心资源稀缺时激励无法弥补人岗不匹配损耗
- concept: 零和/非零和博弈
  desc: 上升期非零和(无战略也涨)，存量期零和(必须有战略)，战略必要性由周期决定
- concept: 标品/非标品定价权
  desc: 交易型卖标品理性比价无定价权；内容型卖非标品感性评估有定价权；可通过SKU组合非标化
- concept: 用户洞察信腿不信嘴
  desc: 真需求表现为具体行为痛点(如‘去年衣服穿不上’)，而非口头说‘我想减肥’
- concept: 产品效果外化三要素
  desc: 高认知(懂价值)+反常识(超预期)+可量化外化到行动(有场景/可感知/可量化)
- concept: 转介绍触发机制
  desc: 超预期产品/服务 + 准备好转发物料(降低行动成本) = 用户主动转介绍
exercises:
- 'no': 1
  title: 诊断你的组织信息链路
  contents:
  - 回顾最近一次业务重大失误或延误：
  - 1. 事前是否有下级通过正式渠道预警？为何预警未到达决策层？
  - 2. 事后复盘时，一线员工是否早知风险？为何未上报？
  - 3. 你是否有‘跳级汇报’机制？上次直接询问‘下属的下属’真实感受是什么时候？
  - 4. 列出3个你常听到的‘非痛快答应’回应(如‘再看看/有点难/下周再说’)，它们真实意图是什么？
  - 回答问题：
  - '- 如果明天发生类似危机，你能在2小时内通过非正式渠道获取真相吗？如何做？'
  - '- 如何降低员工‘说真话’的风险成本？设计一条具体措施。'
- 'no': 2
  title: 为你的业务做一次‘商业设计’体检
  contents:
  - 针对你正在做或计划做的业务：
  - 1. 判断其属于三类业务形态中的哪一类？(改造型/替代型/创造型) 核心竞争要素是什么？
  - 2. 当前处于哪个竞争阶段？(早期/中期/后期) 核心投入是否匹配该阶段要素？(产品vs渠道vs组织)
  - 3. 列出你正在并行的经营策略，是否超过‘四选二’限制？需砍掉哪些？
  - 4. 你的产品/服务是标品还是非标品？用户是理性比价还是感性评估？是否有定价权？
  - 5. 能否通过SKU组合将标品非标化？设计一个组合方案。
  - 回答问题：
  - '- 创始人认知边界在哪里？是否已成为业务最大瓶颈？'
  - '- 如果业务停滞3个月，你会先查方向还是查执行？依据是什么？'
- 'no': 3
  title: 人才筛选与盘点实战演练
  contents:
  - 针对你的核心团队(或计划招募的团队)：
  - 1. 将现有成员按‘使用者/探索者/造物者’三层次分类，造物者占比多少？
  - 2. 设计3个‘剥洋葱’面试追问，用于验证候选人‘成就型动机’(信愿景/图成长)而非‘金钱型动机’。
  - 3. 执行‘捧千里马/消灭耗子/清理老白兔’盘点：谁是必须捧的核心骨干？谁是必须清理的平庸占坑者？谁是隐性有害分子？
  - 4. 你的合伙人/核心合作者是否‘性格相融’？最大的矛盾点是什么？最大的和解是什么？
  - 回答问题：
  - '- 为什么‘招人要慢、开人要快’违背直觉却是生存铁律？'
  - '- 如果只有赋能系统(培训)没有赋权系统(实战授权)，内训必然失效，你的组织是否存在此问题？如何打通？'
- 'no': 4
  title: 用户洞察与产品外化话术重写
  contents:
  - 选择一个你熟悉的产品/服务：
  - 1. 采用‘信腿不信嘴’法：观察目标用户的真实行为数据(而非问卷)，提炼3个具体场景痛点(如‘去年衣服穿不上’)。
  - 2. 重写产品介绍，必须同时包含三要素：
  - '   - 高认知：用一句专业但可懂的话点出核心价值'
  - '   - 反常识：对比传统方案，强调‘本以为XX，结果OO’的超预期体验'
  - '   - 可量化外化：给出具体场景、可感知、可量化的结果承诺(如‘3小时缩至10分钟，点击即得’)'
  - 3. 设计一套‘转发物料包’：包含推荐话术、海报图、二维码链接，将用户转介绍行动成本降至最低。
  - 回答问题：
  - '- 为什么‘帮客户准备好转发物料’比‘服务做得好’更能触发转介绍？'
  - '- 你的产品外化是否触达了用户的‘高认知’门槛？如果用户不懂专业术语，如何先科普再外化？'
units:
- 'no': 1
  name: 组织信息过滤 —— 权力不对等导致的真话缺失
  points:
  - '**为什么需要这个概念？**'
  - '- 管理者处于信息金字塔顶端，却往往是最后一个知道公司出问题的人'
  - '- 员工基于利益保护、面子顾虑、权力不对等，系统性隐瞒负面真相'
  - '- 信息失真导致决策失误，甚至引发组织灾难（如袁世凯83天倒台）'
  - '**核心定义**'
  - '- 指组织层级结构导致信息在上传下达中被筛选、修饰、隐瞒的现象'
  - '- 下级面临“说真话风险高、说假话成本低”的博弈结构，导致上级接收信息系统性失真'
  - '**关键性质**'
  - '- 普遍性：不限于老板-下属，同级间也存在；'
  - '- 隐蔽性：员工给出社会通用借口（如“想读书”）掩盖真实不满；'
  - '- 破坏性：管理者仅接收过滤后的“好消息”，对基层矛盾一无所知'
  - '**典型例子**'
  - '- 袁世凯称帝前身边人每天看假报纸/假新闻，误判局势，登基83天被迫撤销帝制'
  - '- 离职面谈：员工说“想换行业/读书”，实则对公司不满但碍于面子不敢直说'
  - '- 评论区员工实证：说真话先得罪直系领导、等着被穿小鞋；老板常装作看不到'
  - '**边界条件**'
  - '- 仅靠正式汇报渠道（单一渠道）必成最后知情者'
  - '- 必须主动构建获取真相机制（跳级汇报、交叉验证、识别潜台词）才能打破'
  - '- 心理安全感缺失时，任何制度设计都无法强迫员工说真话'
  sources:
  - paper: docs/202303/20230328_003.md
    role: origin
  excerpts:
  - 员工不会完全说真话，你要努力了解公司的真相
  - 你的下属，你下属的下属，可能反馈的信息都不同，因为每个人都是站在自己的立场说问题的
  - 据说来袁世凯要复辟前...每份报纸对他都是赞美之词...登基83天后被迫撤销帝制
  - 我常常说：一个人没有痛快的答应，通常就是拒绝的意思
  - 无数次经历告诉我，如果我跟老板说真话，先把我的直系领导给得罪了...有时候不是不说，而是不能说（评论区 双平）
- 'no': 2
  name: 管理盲区与真相获取 —— 打破单一渠道的交叉验证法
  points:
  - '**为什么需要这个概念？**'
  - '- 管理者仅依赖正式汇报，必然成为组织中最后一个知晓核心问题的人'
  - '- 权力不对等导致下级不敢说真话，上级听不到真话'
  - '- 必须主动打破信息茧房，建立多维度的真相拼图机制'
  - '**核心定义**'
  - '- 管理盲区：管理者因处于信息金字塔顶端，仅接收过滤后的“好消息”，对基层真实矛盾一无所知的认知偏差状态'
  - '- 真相获取机制：通过跳级汇报、多层级交叉验证、语言潜台词识别、建立心理安全感等组合手段主动拼凑真相'
  - '**关键性质**'
  - '- 主动性：真相不会自动上浮，必须管理者主动去“挖”'
  - '- 交叉性：需对比“不同立场人”（下属、下属的下属、同僚）的反馈差异'
  - '- 解码性：需识别“未痛快答应即拒绝”等非显性信号'
  - '**典型例子**'
  - '- 跳级汇报：直接询问“下属的下属”真实感受，对比一线与中层反馈差异'
  - '- 潜台词识别：员工回复“再看看/下周再说/有点难”实为委婉拒绝'
  - '- 离职真相：通过非正式渠道（如同事侧写）获知员工真实离职原因是薪资/氛围而非“读书”'
  - '**边界条件**'
  - '- 无法通过制度强制“说真话”，只能通过降低说真话成本（心理安全感）诱导'
  - '- 管理者自身认知偏见（如确认偏误）会过滤掉不符合预期的真相'
  - '- 交叉验证成本高，仅适用于核心岗位/关键节点，不可全员全时覆盖'
  sources:
  - paper: docs/202303/20230328_003.md
    role: origin
  - paper: docs/202303/20230328_004.md
    role: improve
  excerpts:
  - 有些老板会天真地以为，自己没啥问题，其实他有可能是最后一个知道公司出问题的人
  - 你的下属，你下属的下属，可能反馈的信息都不同，因为每个人都是站在自己的立场说问题的
  - 我常常说：一个人没有痛快的答应，通常就是拒绝的意思
  - 管理者不应仅依赖直接下属汇报，而应主动跨越层级获取信息，对比不同立场信息差异以拼凑真相
  - 通过观察对方回应的及时性/确定性/热情度判断真实意图：缺乏痛快答应的回应本质即为拒绝
