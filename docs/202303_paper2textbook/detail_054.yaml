  - 企业内部培训没有效果，是因为只有赋能系统，而没有赋权系统
- 'no': 5
  name: 阶段性战略匹配与经营策略四选二 —— 避免贪多嚼不烂
  points:
  - '**为什么需要这个概念？**'
  - '- 不同发展阶段核心竞争要素完全不同，错位投入资源必败'
  - '- 企业经营策略仅四种（广度/深度/高度/速度），每阶段最多选两种'
  - '- 目标下达需反复沟通6遍，完成团队从“不可能”到“肯定能”的心理建设'
  - '**核心定义**'
  - '- 阶段性战略匹配：早期比产品/技术，中期比渠道/获客效率，后期比战略/组织'
  - '- 经营策略四选二：广度、深度、高度、速度，每阶段聚焦最多两种'
  - '- 目标对齐六遍法：不可能 → 有意思 → 可能 → 可试 → 应该能 → 肯定能'
  - '**关键性质**'
  - '- 动态性：直播业务一阶段拼流量、二阶段拼供应链、三阶段拼品牌'
  - '- 聚焦性：避免“贪多嚼不烂”，资源集中在当阶段决定性要素上'
  - '- 心理建设：目标对齐非一次性宣讲，而是反复打磨团队共识的过程'
  - '**典型例子**'
  - '- 早期创业：不拼品牌/组织，只拼产品能不能跑通、技术领不领先'
  - '- 成熟期：不拼流量技巧，拼供应链护城河、组织战略协同能力'
  - '- 新业务孵化：老人做新事（配互联网人才+线下副手）、新人做老事（收购业务原老大调入集团）'
  - '**边界条件**'
  - '- 零和/非零和博弈决定战略必要性：上升期非零和（无战略也涨），存量期零和（必须有战略）'
  - '- 农业经济周期律：春种秋收夏耘冬藏，违背周期强行催熟必反噬'
  - '- 商业社会化临界点：体量达规模后超越纯商业，必须担社会责任'
  sources:
  - paper: docs/202303/20230328_004.md
    role: origin
  excerpts:
  - 竞争早期产品为王，比的是谁的技术领先，竞争中期渠道、营销为王，比的是谁的获客效率高，竞争后期战略、组织为王，比的是谁战略和组织强
  - 直播业务第一阶段拼流量，第二阶段拼供应链，第三阶段拼品牌
  - 一个企业的经营策略只有 4 种，广度、深度、高度、速度，每个阶段同时最多选 2 种
  - 定业务目标一定要反复跟团队过，至少过 6 遍...过第 6 遍：大家才会肯定可以完成
  - 行业处于上升期，非零和博弈，不管企业有没有竞争战略，都能实现业绩增长！行业规模或整体经济增长放缓，零和博弈，一定要有竞争战略！
  - 所有业务发展都需要遵循农业经济的规律，春种秋收夏耘冬藏
- 'no': 6
  name: 商业模式本质与定价权 —— 经营方式创新与标品非标化
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常混淆商业模式与盈利模式，忽视用户停留时长决定模式清晰度'
  - '- 交易型电商卖标品无定价权（用户理性比价），内容型卖非标品有定价权（用户感性评估）'
  - '- 必须通过SKU组合将标品非标化，获取定价权与溢价空间'
  - '**核心定义**'
  - '- 商业模式本质是经营方式，创新商业模式即创新经营方式'
  - '- 互联网时代商业模式清晰度取决于用户在平台停留时间，停留越长模式越清晰'
  - '- 标品/非标品定价权定理：理性比价vs感性评估，决定定价权归属'
  - '**关键性质**'
  - '- 外向性：服务本质非“卖现有能力”而是“问客户需求、调动一切资源解决问题”'
  - '- 组合性：通过不同SKU组合将标品非标化，变“非标品”获取定价权'
  - '- 平台博弈：弱则靠平台，强则造平台；技术服务于人则模式清晰'
  - '**典型例子**'
  - '- 交易型电商：用户上来比价看差评，理性评估，无定价权'
  - '- 内容型电商：无差评只看好评，感性评估，有定价权'
  - '- 服务型业务：不问“我有什么”，而问“客户需要什么、我能调动什么资源、能帮到什么”'
  - '**边界条件**'
  - '- 战略决定组织：组织必须跟随战略调整，以旧组织执行新战略必败'
  - '- 免费流量本质不确定（需工程化规模化对冲），付费流量相对确定（拼ROI效率）'
  - '- 小红书去重算法窗口期仅剩半年（素材宣称），模仿起号需抓紧'
  sources:
  - paper: docs/202303/20230328_004.md
    role: origin
  excerpts:
  - 商业模式的本质是经营方式，创新商业模式就是创新经营方式
  - 互联网时代，商业模式取决于用户在你平台上的停留时间，停留时间越长，商业模式越清晰
  - 交易型电商卖的是标品，用户上来就比价看差评，理性评估，没有定价权；内容型电商卖的是非标品，没有差评，只能看好评，感性评估，有定价权
  - 弱则靠平台，强则造平台。技术、算法、平台服务于人，商业模式很清晰，人服务于技术、算法、平台，商业模式不清晰
  - 服务客户的时候，不是你有什么，而是客户需要什么？你能调动什么资源？能帮到客户什么？
  - 免费流量都是不确定的，需要规模化、工程化，付费流量相对确定，拼的是花钱的效率
- 'no': 7
  name: 用户洞察与产品外化 —— 信腿不信嘴、高认知反常识可量化
  points:
  - '**为什么需要这个概念？**'
  - '- 用户口头说“想要”≠真需求，真需求表现为具体行为痛点（如“去年衣服穿不上”）'
  - '- 产品效果外化必须满足：用户高认知（懂价值）、反常识（超预期）、外化到行动（有场景、可感知、可量化）'
  - '- 转介绍不会自动发生，需同时满足：超预期产品/服务 + 准备好转发物料（降低行动成本）'
  - '**核心定义**'
  - '- 用户洞察“信腿不信嘴”法：看行为数据（腿）而非口头反馈（嘴）'
  - '- 产品效果外化三要素：高认知 + 反常识 + 可量化外化到行动'
  - '- 转介绍触发机制：超预期体验 + 低行动成本物料准备'
  - '**关键性质**'
  - '- 场景化：真需求总在具体场景中显现，而非抽象问卷中'
  - '- 反常识：产品必须超出用户预期（如“本以为很难，结果三步搞定”）'
  - '- 物料化：用户懒得组织语言，必须帮ta准备好可直接转发的文案/图片/链接'
  - '**典型例子**'
  - '- 减肥需求：嘴上说“我想减肥”不可信；腿上表现为“去年衣服穿不上”才是真需求'
  - '- 产品外化：不讲“我们用了最新AI技术”，而讲“帮你把3小时的工作缩短到10分钟，点击即得结果”'
  - '- 转介绍：不仅服务超预期，还给客户准备好“发给朋友的推荐话术+二维码海报”'
  - '**边界条件**'
  - '- 业务停滞3-6个月大概率是战略方向错而非执行不力，需果断止损调向'
  - '- 用户洞察需结合数据验证，单凭访谈极易陷入“用户说要更快的马”陷阱'
  - '- 产品外化的“高认知”门槛：用户必须具备一定专业知识才能懂价值，否则需先科普'
  sources:
  - paper: docs/202303/20230328_004.md
    role: origin
  excerpts:
  - 洞察人性背后的诉求，找到增长爆破点，不要相信用户的嘴，要相信用户的腿...真正要减肥的会说，我去年的衣服/裤子穿不到了
  - 产品效果外化要让用户高认知和反常识，并且效果外化要外化到行动上，有场景、可感知、可量化
  - 用户不会主动转介绍，一定是你提供了超预期的产品或服务，而且还帮她/他准备好了物料
  - 一个业务如果 3-6 个月没有进展，大多数情况下是方向错了
