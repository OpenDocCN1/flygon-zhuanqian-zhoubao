paper: docs/202303/20230328_061.md
desc: 该素材系统阐述了抖音AR特效道具创作者（特效师）的商业生态、制作全流程、核心工具链（PS/AE/C4D+Effect Creator）及AI赋能的素材高效生产方法（Midjourney生成2D素材、照片建模生成3D模型、AI多视角生成结合照片建模的创新组合拳），并量化了收益门槛（10人使用即有奖励、单特效上线几日达百元级）与官方激励政策（大赛奖金10万），揭示了该新兴赛道的低门槛、高激励、技术迭代快的商业特征。
concepts:
- name: 抖音特效师生态
  desc: 指以抖音开放平台（Effect House/Effect Creator）为基础设施，特效师创作道具、用户拍摄使用、平台分发激励形成的商业闭环。包含创作工具、审核发布机制、流量分发（原创面板/热门专区）及现金激励体系。
  is_original: false
  excerpt:
  - 那些抖音上万收益和百万使用量的 AR 特效道具是怎么做的？
  - 抖音方愈加重视这一群体，针对特效师推出了多个扶持政策。比如...获得大师奖和人气奖的特效师均可获得 10 万元。
  - 我是在抖音上当特效师，就是在抖音特效开放抖音中制作自己的原创特效作品，然后再上传审核...特效的投稿量越多，特效师的现金奖励也就越多。
- name: Effect Creator 工作流
  desc: 抖音官方提供的AR特效合成与导出工具链，连接美术素材制作（PS/AE/C4D）与最终上架发布（特效君APP），是特效师标准化生产管线的核心环节。
  is_original: false
  excerpt:
  - 我主要是用 PS 和 AE、C4D 等一些软件设计图案和模型，然后通过抖音旗下的 Effect Creator 合成特效，最后导出上传到特效君 APP 上
- name: AI赋能特效素材生产
  desc: 利用生成式AI（Midjourney）替代传统手绘生成2D素材，利用照片建模（云端重建）替代传统手工建模生成3D模型，并探索AI生成多视角图片驱动照片建模的组合范式，大幅降低美术门槛与制作周期。
  is_original: true
  excerpt:
  - 大家可以用目前比较流行 Midjourney AI 绘画等来制作 2D 素材
  - 我这边是通过云端地球来直接照片建模的，只需要提供不同方向多角度的照片就可以生成模型
  - 因为技能和技能之间的联系，是形成差异化很好的方式，所以 AI 绘画+照片建模是不是会有更多的可能性？大家通过 AI 绘画出多角度图片，再进行照片建模，这样就能生成独一无二的模型
- name: 特效商业化指标体系
  desc: 衡量特效道具商业价值的核心量化指标，包括使用人数门槛（10人）、基础收益预期（上线几日达3位数/百元级）、高阶成就（万收益/百万使用量）及平台赛事奖金（10万）。
  is_original: true
  excerpt:
  - 那些抖音上万收益和百万使用量的 AR 特效道具
  - 一般而言，一个特效，只要有 10 个人用，就有一笔奖励，我每个制作的特效，一般上线几天后，可以达到 3 位数的收益。
  - 获得大师奖和人气奖的特效师均可获得 10 万元。
methods:
- name: __overview__
  desc: 抖音AR特效道具全生命周期制作方法论：选品定向 -> 美术素材生产(传统/AI/照片建模) -> Effect Creator合成调试 -> 特效君APP上传审核
    -> 发布运营(蹭热点/明星效应) -> 收益结算。
  excerpt:
  - 选择一个自己擅长的分类，制作相应的特效发布。
  - 我主要是用 PS 和 AE、C4D 等一些软件设计图案和模型，然后通过抖音旗下的 Effect Creator 合成特效，最后导出上传到特效君 APP 上
  - 明星的加入也使得不少道具成为短时间内的潮流...极大提高了用户参与拍摄同款的热情。
- name: Midjourney 2D素材生成标准化流程 (7步法)
  desc: 将Midjourney融入特效素材管线的标准化操作规程：注册账户 -> 选定素材类型(插图/矢量) -> 选定风格(手绘/卡通/写实) -> 上传参考图(图生图)
    -> 补充场景/特征提示词 -> 迭代调参(颜色/线条/阴影) -> 导出入库。
  excerpt:
  - 1.访问 Midjourney AI 的网站，并创建一个账户。
  - 2.选择要制作的 2D 素材类型，例如插图、矢量图形等。
  - 3.选择适合你的项目的样式...手绘、卡通、现实等等。
  - 4.上传你想要转化的素材，例如照片、草图等等。
  - 5.对于一些类型的素材，Midjourney AI 可能会需要更多的信息...
  - 6.运行 Midjourney AI 的算法，并根据你的需要进行微调...调整颜色、线条粗细、阴影等参数...
  - 7.完成后，你可以将结果下载或导出到你的项目中使用。
- name: 照片建模/云端重建标准流程 (7步法)
  desc: 将多视角照片转为可用三维模型的标准化技术流程：多角度采集 -> 图像预处理(裁剪/色调) -> 点云重建(立体匹配/结构光) -> 表面重建(三角剖分)
    -> 纹理映射 -> 渲染优化 -> 云端一键生成(作者实践工具：云端地球)。
  excerpt:
  - 1.建模照片通常指将现实中的照片或者图片转化为计算机可识别的三维模型。
  - 2.搜集照片：收集多张照片，最好是从不同角度和位置拍摄的...
  - 3 图像预处理：对照片进行预处理，以去除任何噪声或其他干扰因素...
  - 4.创建点云：将处理后的图像转换为三维点云...立体匹配和结构光扫描等...
  - 5.创建表面模型：将点云转换为表面模型，这可以使用三角剖分算法等方法来实现。
  - 6.纹理映射：将照片的颜色信息应用于表面模型...
  - 7.渲染和优化...
  - 8.我这边是通过云端地球来直接照片建模的，只需要提供不同方向多角度的照片就可以生成模型
- name: AI多视角生成 + 照片建模组合范式
  desc: 创新性素材生产方法：利用Midjourney通过提示词控制生成同一对象的多角度/多视图2D图片，再喂入照片建模管线重建三维模型，实现‘零建模基础’获取独一无二3D资产。
  excerpt:
  - 因为技能和技能之间的联系，是形成差异化很好的方式，所以 AI 绘画+照片建模是不是会有更多的可能性？
  - 大家通过 AI 绘画出多角度图片，再进行照片建模，这样就能生成独一无二的模型
theorems:
- name: 低门槛高激励的创作者经济模型
  desc: 抖音AR特效赛道呈现‘零美术基础可入场(AI兜底) -> 官方工具链标准化 -> 审核即分发 -> 10人使用即触发收益 -> 头部百万量级/万收益
    -> 平台大赛百万奖金’的阶梯式正向激励模型，极大降低了创作者变现门槛。
  excerpt:
  - 制作特效，最好是要有一定的美术基础，当然没有美术基础也可以去做，后面会讲到用 AI 绘画来制作素材，照片建模来制作模型...
  - 一般而言，一个特效，只要有 10 个人用，就有一笔奖励，我每个制作的特效，一般上线几天后，可以达到 3 位数的收益。
  - 抖音方愈加重视这一群体，针对特效师推出了多个扶持政策...获得大师奖和人气奖的特效师均可获得 10 万元。
- name: 明星/网红效应驱动特效爆发的传播规律
  desc: 头部KOL/明星使用特定道具拍摄 -> 引发粉丝模仿潮(UGC爆发) -> 道具进入热门专区 -> 获得全域自然流量 -> 使用量指数级增长 ->
    收益最大化。选品需紧跟明星热点或自带强社交传播属性。
  excerpt:
  - 明星的加入也使得不少道具成为短时间内的潮流，从李现的哪吒特效、Angelababy 的在逃公主等都吸引了许多粉丝纷纷模仿拍视频，极大提高了用户参与拍摄同款的热情。
  - 如果该特效审核通过后...使用量不错，甚至会出现在热门专区中，这样就会有更多的人使用，收益也会更高。
- name: 技能组合差异化竞争策略
  desc: 在特效师群体同质化竞争加剧时，掌握‘AI绘画(2D生成)+ 照片建模(3D重建)+ 传统工业软件(PS/AE/C4D精修)’的复合技能栈，特别是‘AI生成多视角驱动照片建模’的独创流程，可构建难以复制的差异化护城河。
  excerpt:
  - 因为技能和技能之间的联系，是形成差异化很好的方式，所以 AI 绘画+照片建模是不是会有更多的可能性？
  - 大家通过 AI 绘画出多角度图片，再进行照片建模，这样就能生成独一无二的模型
findings:
- name: 单特效基础收益验证
  desc: '[evidence] 作者实测：单个特效道具上线几日内，仅凭基础激励政策(10人使用即有奖)即可实现3位数(百元级)收益，验证了长尾特效的商业可行性。'
  excerpt:
  - 一般而言，一个特效，只要有 10 个人用，就有一笔奖励，我每个制作的特效，一般上线几天后，可以达到 3 位数的收益。
- name: 头部特效商业天花板验证
  desc: '[claim] 素材标题及开篇确立的行业标杆：存在单个特效道具达成‘万收益’与‘百万使用量’的头部案例，定义了赛道上限。'
  excerpt:
  - 那些抖音上万收益和百万使用量的 AR 特效道具是怎么做的？
- name: 平台官方赛事高额奖金验证
  desc: '[evidence] 抖音官方举办道具设计大赛，设置大师奖/人气奖单项奖金10万元，确认为最高等级的变现路径之一。'
  excerpt:
  - 在之前抖音道具设计大赛中设置高额现金奖励，获得大师奖和人气奖的特效师均可获得 10 万元。
- name: AI+照片建模组合技术可行性预判
  desc: '[claim] 作者基于技能迁移经验提出假设：AI绘图生成多视角图片作为照片建模输入，技术路径打通可生成‘独一无二’模型，但文中未展示该组合流程的实测成品案例与效果图。'
  excerpt:
  - 因为技能和技能之间的联系，是形成差异化很好的方式，所以 AI 绘画+照片建模是不是会有更多的可能性？
  - 大家通过 AI 绘画出多角度图片，再进行照片建模，这样就能生成独一无二的模型
- name: 云端照片建模工具实测可用性
  desc: '[evidence] 作者实测‘云端地球’工具，验证了‘上传多角度照片 -> 云端自动生成模型’的轻量化建模路径可行，大幅降低了本地算力与技术门槛。'
