  - '- 朋友圈早中晚2-3条真实感悟替代硬广截图，利用“废物朋友对比效应”建立权威感'
  - '**边界条件**'
  - '- 新号养号/老号日通过<200/朋友圈频次控制/拒绝微商式刷屏'
  - '- 违规限流导致公域流量截断→私域新增锐减→社群收入下降，倒逼探索抖音矩阵分散风险'
  - '- 录播课在腰部账号(万粉级)效率极低，适合20万+头部账号'
  - '...'
  sources:
