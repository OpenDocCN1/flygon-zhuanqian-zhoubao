  name: 领英开发客户四账号矩阵与信任前置成交后置定律
  points:
  - '**为什么需要这个概念？**'
  - '- 传统“主动出击找客户”效率低、易沦为备胎、信任建立成本高'
  - '- 需要一套“打造IP吸引客户上门→信任前置成交后置”的标准化运营体系'
  - '**核心定义**'
  - '- 四账号矩阵：设计师号（展示包装创新）、验货员号（强化质检标准）、业务号（针对性发布产品）、老板号（输出商业认知汇聚流量转化）'
  - '- Plan B供应商策略：不挑战现有供应商，先占据备选位置，待现有供应商出问题时自然切入'
  - '- 二度人脉裂变：与一度好友深度互动触发算法推荐其二度好友（同行），以“老朋友的朋友”身份天然跨越陌生信任门槛'
  - '**关键性质**'
  - '- 内容营销四要素：真实+专业建立信任，干货+迷人产品吸引客户'
  - '- 账号冷启动：新号先积累10-20条高质量动态再添加客户，提高通过率与共鸣概率'
  - '- 针对性诱饵投放：业务号针对重点开发客户兴趣点定制发布，作为诱饵吸引主动关注'
  - '**典型例子**'
  - '- 认知型内容单点爆破：发布《小贸易公司如何发展》短文，直接撕开破口使作者成为该客户供应商之一'
  - '- 评论互动引发二度好友主动询盘：持续在客户A动态下深度互动导致A的同行B主动找上门合作'
  - '- 作者年均三百万美金订单业绩验证方法论有效性'
  - '**边界条件**'
  - '- 仅适用于B2B高客单价、长决策周期场景，不适用于低客单价快消品'
  - '- 需持续投入“经常使用、经常研究”才能掌握，非一劳永逸'
  - '- 合规风险：领英算法调整可能影响推荐机制，需动态调整策略'
  - '...'
  sources:
  - paper: docs/202303/20230328_103.md
    role: origin
  excerpts:
  - '为了更好运营，我设计了一个架构，用四个账号来操作: 1. 是设计师的号... 2. 是验货员的号... 3. 是业务的号... 4. 是我自己的号...'
  - 对于有稳定供应链的客户，最好的办法是先做 Plan B，再找机会切入，只要他知道你是做什么的，并且一直在身边以朋友的心态维护，那么他的 Plan A 一出问题，立刻会想到你
  - 领英会主动推荐出 A 客户的人脉给我，也就是 A 的同行 B，顺理成章，A 的同行那里也会显示我是 A 的朋友，那么我去添加 B，并且谈生意，是不是事半功倍？跨越了陌生供应商的这一步，而是以
    A 的朋友出现在同行 B 的视线里
  - 所以想让客户产生信任感，两个办法：真实+专业 想让客户被吸引，两个办法：干货+迷人的产品
  - 初期要先丰富这几个账号，最好是更新到每个账号有 10 到 20 条动态，看起来稍微有点内容，再去添加客户，成功率高很多
