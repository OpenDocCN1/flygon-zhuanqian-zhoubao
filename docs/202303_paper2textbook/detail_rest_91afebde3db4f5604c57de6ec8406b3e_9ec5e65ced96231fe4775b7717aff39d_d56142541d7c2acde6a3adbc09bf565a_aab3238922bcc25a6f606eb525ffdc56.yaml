learning_targets:
- 掌握GPT-4协作写作6步标准化流程，实现公众号情感赛道10分钟产出高原创度爆文
- 理解'发号施令'范式核心：将ChatGPT定位为执行型助理而非知识型专家，建立项目方法论先行的AI使用心法
- 掌握'备料-炒菜-打包'三阶段自动化混剪生产线搭建方法，利用达芬奇+剪映+RPA实现日产能从<10条提升至稳定批量
- 理解'人工+智能'爆文框架：选题决策权重50%+AI执行+情绪价值人工注入，原创度从60%提升至70%+
- 掌握小红书笔记Prompt分级体系：从特定指令到混合模式的进阶路径，实现非标素材到平台规范内容的标准化转化
- 掌握跨境电商9大场景Prompt模板库构建：角色+约束让通用模型秒变垂直专家，输出可直接投放的生产级文案
- 理解视频号ChatGPT赛道10天速成模型：自动化引流闭环+分级直播变现+双机隔离架构，公私域联动实现高ROI变现
- 掌握RPA+AI自动化生产线搭建全流程：RPA做手脚、GPT做大脑、接口对平台，非程序员构建数字员工替代高重复低决策劳动
