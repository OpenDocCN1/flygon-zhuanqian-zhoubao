- │   ├── 跨平台素材搬运去重（A平台→B平台）  —— P003
- │   ├── 抖音素材下载工具链（轻抖/Apowersoft）  —— P003
- │   ├── 剪映六步去重制作法（镜头/调速/镜像/滤镜/特效/调节）  —— P003
- │   └── 模板化批量生产SOP（时长/音频/参数/文案/发布）  —— P006
