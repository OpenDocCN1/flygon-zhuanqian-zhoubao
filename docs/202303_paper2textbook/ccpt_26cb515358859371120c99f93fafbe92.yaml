paper: docs/202303/20230328_046.md
desc: 该素材记录了作者与一位资深科技创业者（“大哥”）的深度对话，核心在于揭示国内认知存在严重滞后与信息闭塞：国外科技圈已预判大模型将在三年内颠覆程序员行业，GPT
  的智能水平（如联网后能反向诱导人类协作）及战略价值（超越元宇宙成为未来 3-5 年核心风口）被普遍低估；文心一言虽被舆论嘲讽实则能力被低估，国内用户更应关注其本土化应用价值。对话进一步推演出“提示工程/调教师”将成新职业、基础
  AI 普及教育存在巨大下沉市场信息差红利，并感悟到无论技术如何迭代，掌握流量与自媒体影响力者始终处于稀缺地位。
concepts:
- name: 国内认知闭塞与信息幸存者偏差
  desc: 指北上广等核心圈层人群因身处信息高地，误判大众对 AI 前沿认知的普及度，忽视下沉市场存在巨大认知鸿沟，导致对 AI 普及教育市场需求的低估。
  is_original: true
  excerpt:
  - 国内信息太闭塞，国外科技圈早就全面跟上
  - 我们生活在北上广，有信息的幸存者偏差，这也是有一定道理的
- name: GPT 反向诱导人类协作能力
  desc: 指大模型联网后具备的主动性智能：不再被动响应，而是能主动利用社交媒体等外部工具，反向引导、诱导人类为其完成任务，标志着智能体雏形的出现。
  is_original: true
  excerpt:
  - Gpt 的聪明被大多数人低估了，尤其是国内的人，举例：联网后，gpt 已经会自己从社交媒体诱导人类帮他干活了
- name: 提示工程师/调教师职业化
  desc: 预测因大模型能力释放依赖高质量提示词，未来几个月将催生专门的调教课程、书籍及认证培训体系，形成新的职业赛道。
  is_original: true
  excerpt:
  - 可以预见到未来几个月就会有调教课程，书籍，调教师培训出来
- name: 文心一言的本土化战略价值
  desc: 主张文心一言非外界评价的“低能”，而是针对中文语境、国内合规及应用生态深度优化的模型，国内开发者与用户更应关注其落地可用性而非单纯跑分对标。
  is_original: true
  excerpt:
  - 文心一言不低能，被大众低估了，大家都只知道吃瓜，但其实它能做的事情也很多，而且我们在国内的人反而更需要关注文心一言
- name: 流量与个人品牌的技术周期不变性
  desc: 核心主张：技术范式虽快速迭代（如从元宇宙到大模型），但解决“流量获取”与“信任分发”能力的人始终是稀缺资源，自媒体运营是穿越周期的核心护城河。
  is_original: true
  excerpt:
  - 不管科技怎么变，能解决流量问题的人，永远属于稀缺的
  - 自媒体没有终点，every day is new day
methods:
- name: __overview__
  desc: 基于深度访谈与第一手认知复盘的定性研究方法：通过与头部创业者的非结构化深度对话获取一手前沿判断，结合自身投资与自媒体实战经验进行反思性总结，提炼认知套利机会。
  excerpt:
  - 昨天中午 1 个多小时电话和在上海认识的大哥以及一个科技圈的创始人聊天
  - 他有几个认知我记录一下，也想听听大家的看法
  - 这也让我深度感觉到...
theorems:
- name: 大模型将在 3 年内重塑程序员职业生态
  desc: '[claim] 国外科技圈共识认为：大模型将在三年内彻底改变软件开发范式，大量基础编码岗位将被自动化取代，程序员行业面临结构性缩减。'
  excerpt:
  - 号称三年要干掉程序员行业，自己很多基础的岗位被取代就是分分钟
- name: 大模型是未来 3-5 年唯一确定性超级风口
  desc: '[claim] 相比元宇宙等概念，大模型具备即时落地、生产力工具属性强、商业化路径清晰等特征，是未来 3-5 年创业投资必须 All-in 的核心方向。'
  excerpt:
  - Gpt 是未来三五年最值得关注的方向，什么元宇宙都没他牛逼，必须要跟上这个风口
- name: 应用层开发面临“风向切变”极速迭代风险
  desc: '[claim] 底层模型能力迭代速度（月级/周级）远超应用开发周期，导致基于现有模型能力开发的应用极易被下一版模型原生能力覆盖或市场风向突变而失效。'
  excerpt:
  - 他觉得世界变化太快了，快到他刚开发一款基于 gpt 的应用，市场风向就变了
- name: AI 普及教育存在巨大下沉市场信息差红利
  desc: '[claim] 核心圈层认知与大众认知存在时间差，针对非技术背景下沉人群的 AI 基础认知、工具使用、提示词教学存在巨大商业变现空间。'
  excerpt:
  - 一些基础的普及教育，在下沉市场仍然存在很大的信息差生意
findings:
- name: GPT-4 级模型能力的早期内测时间线
  desc: '[evidence] 评论区证言佐证：GPT-4 级别的核心能力在 2022 年 10 月前已在小圈层内测/使用，距离公众认知爆发（2023 年
    3 月）存在约 5 个月的“认知暗区”。'
  excerpt:
  - 'Vicent : gpt-4 是去年出来了'
  - '刘晨昊 : 不是，意思是去年就有它的低阶版本了'
- name: AI 与元宇宙的底层/应用层关系共识
  desc: '[evidence] 专家评论确认：大模型被公认为元宇宙等上层数字应用的“底层操作系统/智能引擎”，二者非替代关系而是赋能关系。'
  excerpt:
  - '张老师 | 张导师 : ai 是元宇宙的底层应用，元宇宙是各种数字和物理世界应用的整合体'
  - '刘晨昊 : 没错～'
- name: 创业者焦虑驱动的联合创始人招募实况
  desc: '[evidence] 实录展示：面对技术极速迭代带来的生存焦虑，头部创业者倾向于通过授予联合创始人头衔、绑定流量资源（自媒体影响力）来对抗不确定性，印证“流量即稀缺资源”论断。'
  excerpt:
  - 反正现在授权你成为我们 xx 智能 cofounder，你快去自媒体宣传你自己，你不仅做过投资战略自媒体，你现在还有新的身份就是科技公司 cofounder
