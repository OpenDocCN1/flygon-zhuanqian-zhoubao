unsupported_claims:
- location: ch4.5.1
  claim: 价值共振定价公式：价格 = 价值 = 外部需求发现的'被需要'程度 ≠ 自我成本加成
  reason: 素材中未给出公式化表述，仅为概念阐述
- location: ch4.5.2
  claim: 收费边界设定协议包含四个步骤：1.建立标准化收费流程与话术 2.将'不收费=不负责/自损'内化为原则 3.通过显性契约管理客户预期 4.保护提供者心力，筛选高意向客户
  reason: 素材中未明确列出四步协议，仅阐述收费即责任与保护的概念
- location: ch4.5.3
  claim: 见识溢价效应指出高价格信心源于亲眼目睹高阶商业模式/定价锚点
  reason: 素材中小冯妮儿案例印证此观点，但未系统表述为'见识溢价效应'及其作用机制
- location: ch4.6.1
  claim: 天赋优势区识别与映射流程图包含5个节点：日常行为模式回溯→识别核心天赋模式→业务核心动作拆解→天赋-业务映射匹配→零意志力执行引擎启动
  reason: 素材中未给出结构化流程图，仅阐述概念与小冯妮儿案例
- location: ch4.7.1
  claim: 创伤具象化方法（瞅了瞅法）包含六个步骤
  reason: 素材中杨昌仅描述'走进瞅了瞅'的体验，未列出六步标准化操作
- location: ch4.8.1
  claim: 童年创伤再叙事疗法实操包含五个阶段：事件梳理→防御识别→叙事重写→认知拓宽→天赋回收
  reason: 素材中杨昌仅概括'重走童年路、解开防御、拓宽认知、捡回天赋'，未细化为五阶段结构化流程
- location: ch4.9.1
  claim: 关系三分类决策模型包含判定标准、执行策略、能量流向三维度，并给出具体评分标准（≥4分/2-3分/≤1分）
  reason: 素材中杨昌仅描述'双向奔赴/立边界/切断'三类及执行动作，未给出量化评分标准
