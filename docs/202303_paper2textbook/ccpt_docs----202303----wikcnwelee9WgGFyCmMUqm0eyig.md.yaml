paper: docs/202303/wikcnwelee9WgGFyCmMUqm0eyig.md
desc: 该素材深度解析了数字人直播的技术原理、主流方案对比（高价无限量方案 vs 低价限量方案）、实操落地方法（含绿幕真人替代低成本方案），并结合本地生活与带货两大场景实测数据，揭示了核销率低、佣金薄、违规风险高等核心痛点，最终给出“小白不建议入局、有经验者可低成本试错”的审慎建议。
concepts:
- name: 数字人直播
  desc: 利用AI技术将预录制音频/文本驱动虚拟形象进行24小时无人直播的模式，核心优势为解决出镜障碍、实现日不落直播、规避真人管理成本。
  is_original: false
  excerpt:
  - 简单来说，数字人我们可以理解为一个AI主播：我们自己写话术，然后由AI数字人自然地表达出来。
  - 相比真人直播，数字人的直播的优势很明显：数字人不会累，完全可以实现24小时日不落无人直播；AI的形象和气质都不错，免去了挑选和管理主播的麻烦；最重要的，出镜障碍卡住了80%的电商人进入直播行业
- name: 硅语方案
  desc: 文中提及的市面主流高价数字人技术方案，支持不限时长生成、关键词智能回复、真人形象定制及实时直播，月费5500元（定制版8000元/月）。
  is_original: false
  excerpt:
  - 目前市面上最主流的数字人解决方案名为硅语，据说刘润的数字人就是采用了他们的家技术
  - 价格很高，要5500/月，如果根据真人形象来定制，要8000/月
- name: 绿幕自制数字人
  desc: 雇佣真人主播在绿幕前按话术录制视频，经抠图后循环播放，以极低成本达到媲美甚至超越AI数字人的直播效果，同时缓解违规风险。
  is_original: true
  excerpt:
  - 我们可以雇佣一个临时的专业主播...在绿幕背景下，用话术空播20分钟-1小时，录制出来一个纯净的绿幕主播视频。这样，这个视频抠掉绿幕以后，就是一个“自制数字人”了
  - 这样的直播间效果其实是很好的，虽然也有一个真人主播，但是对这个主播的要求近乎为0，而且可以有效的缓解违规问题。
- name: 本地生活核销率陷阱
  desc: 本地生活直播表面GMV高但实际收益低，核心原因在于核销率普遍低（10%-50%）且佣金率极低（1%-5%），导致单间实际佣金收入微薄。
  is_original: true
  excerpt:
  - 现阶段本地生活最大的问题是：核销率和佣金太低！
  - 假设我们做了10w的GMV，按照30%的核销率计算，只有3w的有效GMV，再乘以5%的佣金，最后的实际佣金只有1500。
methods:
- name: __overview__
  desc: 数字人直播标准搭建全流程：录制语音/输入文本 -> 数字人软件生成视频 -> 添加绿幕背景 -> 直播伴侣窗口采集+抠图合成背景 -> 推流开播。
  excerpt:
  - 1. 录制一段语音；2. 将语音导入到软件中，选择喜欢的主播，软件会根据你选择的人物形象和语音，自动生成一段虚拟主播念这段话术的视频；3. 使用软件为上述视频添加绿幕背景，方便抠图；4.
    在直播助手中，直接添加“窗口采集”，将软件中生成的数字人视频导入进直播伴侣，绿幕抠图，添加背景图片或者视频
- name: 方案选型决策矩阵
  desc: 基于价格周期、视频时长、真人定制、智能回复、多平台支持、实时直播六个维度对比两大主流方案，核心结论：无经验者优先尝试999/年低价方案验证模型。
  excerpt:
  - 做了一个两种方案的对比表...价格周期：每月 vs 每年；视频时长：不限 vs 60分钟；是否支持真人定制：支持 vs 不支持；是否支持智能回复：支持 vs
    不支持
  - 所以，如果做本地生活直播，从性价比角度来说，还是更推荐先尝试999/年的方案起步的。
- name: 带货违规规避三板斧
  desc: 针对数字人带货视频循环被查重导致违规的核心痛点，提出三层递进解决方案：升级高阶数字人生成非重复视频、真人+数字人混播打破循环、人工后期剪辑去重处理。
  excerpt:
  - 数字人直播会违规的核心原因就是视频循环被查重。那么想解决这个问题，有几个方案：
  - 1. 使用更高级的数字人版本...可以制作长时间不重复的视频；2. 真人+数字人组合...让视频“不循环”；3. 人工将循环的视频进行重新的剪切组合...大大降低违规概率。
theorems:
- name: 平台红利窗口期理论
  desc: 抖音本地生活处于跑马圈地扩张期，平台对数字人/无人直播采取宽容策略（睁一只眼闭一只眼），是数字人直播当前最佳落地场景，但窗口期随监管收紧将关闭。
  excerpt:
  - 大家都知道，今年抖音在力推本地生活，前期要大量的跑马圈地，所以目前对这种形式的“无人直播”是睁一只眼闭一只眼的状态
  - 现阶段抖音的本地生活直播间，确实是非常适合使用数字人来进行直播的。无需过分关心违规问题，也是容易拿到一些成绩的。
- name: 数字人直播投入产出比临界点判断
  desc: 受限于单数字人仅能支撑单直播间、核销率低、佣金薄等硬性约束，数字人直播不具备规模化复制杠杆，入局必须通过ROI测算验证正向现金流。
  excerpt:
  - 因为同一时间，每个数字人只能支持一个直播间来开播，所以，想做本地生活直播，一定要计算好投入产出比再入局。
  - 不要被大数字所欺骗。
- name: 新手劝退与老手试错分层策略
  desc: 鉴于技术未成熟（无法真实演示商品、随机应变弱）、费用高昂、违规风险不可控，建议无直播经验小白暂不入局；有无人直播经验者可利用现有技术栈低成本试错迭代。
  excerpt:
  - 数字人直播目前还处在初级阶段，效果不错，但是由于平台的现状和高昂的费用，导致目前处在一个比较“鸡肋”的状态，如果是没有直播经验的小白，我个人并不建议现在入局。
  - 但是之前有无人直播的经验同学...还是建议试一试的。
findings:
- name: 数字人带货转化实测数据
  desc: '[evidence] 实测案例显示：仅投放随心推（未用千川），数字人带货直播间即可跑出可观转化数据，证明数字人带货在技术细节优化到位的前提下商业模型可行。'
  excerpt:
  - 昨天群里的小伙伴找到一个数字人带货的直播间后，给他投了一笔随心推，测试了一下数字人主播的转化效果。
  - 可以看到，没有用千川，只是使用了随心推，就拿到了不错的数据。从这个数据至少证明了，数字人带货是可行的
- name: 本地生活细分品类核销率分层
  desc: '[evidence] 实测数据支撑：本地餐饮核销率最高（40%-50%），连锁餐饮/生活娱乐次之（~30%），旅游最低（~10%），直接决定了不同品类的实际收益上限。'
  excerpt:
  - 其中，本地餐饮核销率是最高的，在40%~50%之间，连锁餐饮和生活娱乐的核销率也就在30%左右的水平，旅游的核销率在10%。
- name: 两大主流方案成本性能比差异
  desc: '[evidence] 对比表实测：5500元/月方案提供无限时长、智能回复、真人定制、实时生成；999元/年方案仅支持60分钟素材、无智能回复、无定制，两者价格相差55倍，功能边界清晰。'
  excerpt:
  - 了解了一下之后，做了一个两种方案的对比表...价格周期 每月 vs 每年；视频时长 不限 vs 60分钟；是否支持智能回复 可以设置关键词回复 vs 不支持
  - 两种方案的价格，差了55倍。
- name: 绿幕真人替代方案有效性验证
  desc: '[evidence] 实地观察案例：某直播间左侧真人主播、右侧绿幕抠图录播主播同框，后者预录音频可展示商品，效果优于部分配数字人且主播要求近乎为零，有效缓解违规。'
  excerpt:
  - 仔细看不难发现，左边的主播是真人主播，右边的主播就是使用绿幕抠出来的主播，而且提前录好了声音，还能展示商品。
  - 这样的直播间效果其实是很好的...对这个主播的要求近乎为0，而且可以有效的缓解违规问题。
