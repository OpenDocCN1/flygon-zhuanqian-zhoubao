paper: docs/202303/20230328_048.md
desc: 该素材为一篇生财有术航海实战分享文章的元数据记录，作者子布以技术视角总结了币圈（加密货币领域）的赚钱机会，核心涉及MEV（最大可提取价值）套利、自动化交易策略、节点优化等技术变现路径，并附带社区评论中的风险提示与门槛分析。
concepts:
- name: MEV (最大可提取价值)
  desc: 区块链区块生产过程中，通过重排序、插入或审查交易所能提取的最大价值，是文中核心讨论的技术套利对象。
  is_original: false
  excerpt:
  - MEV 交易是有策略的，但是网上的策略几乎全部都是偷币的
- name: 恶意MEV策略/钓鱼策略
  desc: 网络公开的MEV策略代码多包含后门或恶意逻辑，诱导用户连接钱包导致资产被盗，属于币圈特有的安全黑产概念。
  is_original: true
  excerpt:
  - 网上的策略几乎全部都是偷币的，千万不要拿钱包链接去测试
- name: 魔改节点
  desc: 修改区块链客户端节点源码以优化交易打包速度、抢跑交易顺序的技术手段，属于MEV竞争的高阶基础设施层面。
  is_original: true
  excerpt:
  - 还有一种魔改节点代码，可以提高打包速度
methods:
- name: __overview__
  desc: 作者子布采用‘技术视角拆解币圈赚钱机会’的整体方法论，结合实战经验系统梳理MEV、自动化套利、节点优化等技术变现路径。
  excerpt:
  - 从技术的角度看币圈的一些赚钱机会
  - 在刚结束的航海实战中...跟大家分享了从技术的角度看币圈的一些赚钱机会
- name: 自动化套利/MEV Bot策略
  desc: 编写自动化脚本监听链上内存池，捕捉套利机会并通过Gas竞价抢夺打包优先权，是文中提到的核心技术实现手段。
  excerpt:
  - 凡是涉及自动化套利的，都是卷的飞起，要么是拼机器算力，要么是拼手续费
- name: 节点代码魔改与优化
  desc: 通过修改Geth/Erigon等客户端源码，定制化交易池排序、区块构建逻辑，降低延迟抢占区块空间，属于MEV竞争的‘核武器’级方法。
  excerpt:
  - 还有一种魔改节点代码，可以提高打包速度
theorems:
- name: MEV公开策略不可信定律
  desc: 公开网络上的MEV策略代码极大概率为恶意钓鱼代码（偷币），普通开发者直接使用钱包测试会导致资产损失，必须极度警惕。
  excerpt:
  - MEV 交易是有策略的，但是网上的策略几乎全部都是偷币的，千万不要拿钱包链接去测试
- name: 自动化套利红海竞争定律
  desc: 自动化套利赛道已陷入极度内卷，核心竞争力在于硬件算力（低延迟服务器/协地）和Gas费博弈，边际收益趋近于零，仅适合顶级玩家/大佬参与。
  excerpt:
  - 凡是涉及自动化套利的，都是卷的飞起，要么是拼机器算力，要么是拼手续费，这种是大佬才玩得起
- name: 基础设施层竞争升级趋势
  desc: MEV竞争已从应用层策略上升至基础设施层（节点代码魔改、区块构建者），掌握底层打包逻辑控制权是获取超额收益的关键护城河。
  excerpt:
  - 还有一种魔改节点代码，可以提高打包速度
findings:
- name: 社区对Web3技术交流的强烈需求
  desc: '[evidence] 评论区多位用户主动询问生财有术内部Web3交流群及渠道，表明技术出身人群对高质量币圈技术变现社群有强付费/加入意愿。'
  excerpt:
  - 咱生财有没有 Web3 的群之类的，大家还能在哪儿交流？
  - 同求
- name: 内容分享受官方认可且具参考价值
  desc: '[evidence] 文章获53赞，且被生财有术官方邀请在‘航海实战’环节分享，社区KOL（老瞿Qu）点赞背书，验证了内容质量与实战有效性。'
  excerpt:
  - (53 赞)
  - 很荣幸的收到小霸王的邀请，跟大家分享
  - 这个总结很赞👍
