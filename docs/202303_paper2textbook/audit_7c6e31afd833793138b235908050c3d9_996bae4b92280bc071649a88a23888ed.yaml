unsupported_claims:
- location: ch43.3
  claim: 视频号违规处罚不可逆，权重永久受损、仅能注销重来
  reason: P001中提到'违规处罚具有不可逆性...无法像抖音快手通过养号恢复，仅能换绑或注销重来'，但未提供官方文档或更大样本验证此机制的绝对性，属于经验总结而非平台公开规则
- location: ch43.5
  claim: 三大指数交叉验证可覆盖全网需求，同向共振时选品确定性最高
  reason: P001、P003仅提出工具建议，未提供实证数据证明三指数同向共振与选品成功率的正相关性，属于方法论倡导而非验证结论
- location: ch43.6
  claim: 视频导流直播流量转化率最高，投流仅作锦上添花
  reason: P001、P004基于作者团队经验陈述，缺乏跨账号、跨品类的量化对比数据支撑'转化率最高'的绝对化判断
- location: ch43.8
  claim: 视频号同品可定价抖音1-3倍仍具性价比
  reason: P001、P006仅给出护肤品、定制品个案，未覆盖标品/3C等强比价品类，'1-3倍'区间缺乏大样本统计支撑
- location: ch43.9
  claim: 英文育儿书单号模式账号存活周期长、不易违规
  reason: P007为单账号复盘（1年2号），样本量极小，且'伪原创'判定依赖平台算法主观认定，存在政策收紧风险，未提及版权合规的法律风险边界
