  desc: 本章面向毕业3年内职场新人，提供‘心态量化焦虑→基建三表模型→执行储蓄率控支增收→复盘月度双表→认知升级’全流程操作体系。核心工具：个人收支资产负债模型(资产负债表/现金流量表/四象限分类)、35%储蓄率基准线(不含房贷)、生存跑道(流动资产/月支出=抗风险月数)、四笔钱框架(保本40%/投资30%/保险20%/备用10%)、100-年龄动态配置法、低阻力记账体系(统一账户/固定节点/趁手工具/拒绝自我批判/完成比完美重要)、月度双表复盘机制(折线图可视化/超支分析/策略调整)、支出分类预算法(固定/弹性/年度大额)、四金体系/个税/公积金/信用卡权益等隐性收入挖掘。
