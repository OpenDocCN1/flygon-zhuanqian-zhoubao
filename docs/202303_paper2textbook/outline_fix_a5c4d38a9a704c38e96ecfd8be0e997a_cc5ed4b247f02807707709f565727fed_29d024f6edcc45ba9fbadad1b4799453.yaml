- 'no': 19
  name: 抖音百万粉IP操盘手深度复盘五大感悟 —— 从“星探模式”到“业务属性同构效应”
  desc: 本章记录作者与抖音400万粉商业IP操盘手五小时深度交流后的复盘：IP运营模式选择(自营vs星探)、合作绑定策略(低谷期介入+关键节点服务)、角色定位(决策vs执行)、业务属性对组织文化的同构性影响、‘出去看看’需配合落地执行。同时结合生财社群理念阐述付费获取优质信息与主动输出突破舒适区的实践路径。
  nodes:
  - 'no': 1
    name: 星探模式与低谷期介入策略
    desc: 企业不自营IP，专注发掘有深度阅历人才并在其低谷期介入建立合作；雪中送炭建立信任基石，后续动用人脉解决关键问题、关键节点给到位帮助深度绑定关系。
    role: theorem
    src:
    - paper: docs/202303/20230328_092.md
  - 'no': 2
    name: 业务属性同构效应与角色分离决策法
    desc: 老板选业务属性(短平快vs长期主义)投射塑造全员心理状态与行为模式，形成组织文化同构性；个体须明确核心竞争力在于战略决策还是战术执行，避免角色错位。
    role: theorem
    src:
    - paper: docs/202303/20230328_092.md
  - 'no': 3
    name: 出去看看-落地闭环法与付费融入-主动输出成长模型
    desc: 外部学习考察必须转化内部执行落地，单纯‘开眼界’无落地是浪费且易滋生虚假膨胀；付费入群仅完成物理融入，唯有克服心理抗力公开表达分享，才能实现化学融入触发复利增长。
    role: method
    src:
    - paper: docs/202303/20230328_092.md
  - 'no': 4
    name: 头部IP操盘手验证星探模式与短平快业务导致组织焦虑实证
    desc: 抖音400万粉操盘手团队采用星探模式成功运作；作者自家公司经验印证：短平快项目导致团队普遍浮躁焦虑、项目间隙集体恐慌。
    role: experiment
    src:
    - paper: docs/202303/20230328_092.md
  - 'no': 5
    name: 纯学习不落地导致认知膨胀与首次发言突破心理障碍的自证案例
    desc: 作者公司过往‘出去看看’仅停留感官刺激导致虚假膨胀未获增长；付费加入生财后强迫自己首发，获得社群正向互动，验证‘主动输出破圈’即时有效性。
    role: finding
    src:
    - paper: docs/202303/20230328_092.md
- 'no': 20
  name: 全国见面会PPT语录壁纸化与社群文化共识构建 —— 从“金钱管道论”到“幻想与决心的置换律”
  desc: 本章源自生财有术全国见面会PPT精华整理，提炼20+1条经典语录制成品牌色壁纸作为从业者日常自省工具。核心围绕财富认知重塑(金钱即能量/管道论)、行动主义方法论(躬身入局/主动举手/亲身实践)、长期主义心法(坚持即筛选/微动吉先见)、心理建设(允许快乐/拒绝条件式生活/拥抱碰壁)以及成长策略(发挥优势/扩大心量)。验证了社群文化建设中‘金句提炼-视觉载体化-日常高频触达’强化群体认同的有效路径，以及‘官方核心内容+用户高阶共创’内容生产模式。
  nodes:
  - 'no': 1
    name: 金钱管道论与条件式幸福陷阱
    desc: 金钱是流动能量，个体是管道，核心任务保持通畅；抛弃‘只有达到条件才能好好生活’预设，当下即允许感受快乐。
    role: theorem
    src:
    - paper: docs/202303/VEF1dwgsRoVRcIxbDRCcRYvWnKf.md
  - 'no': 2
    name: 时间复利下的坚持筛选机制与微动吉先见
    desc: 市场关注源于长周期存活验证，‘还在那里’即核心竞争力；引用周易智慧，在微小趋势萌芽阶段敏锐捕捉并行动，以微小持续迭代换取确定性优势。
    role: theorem
    src:
    - paper: docs/202303/VEF1dwgsRoVRcIxbDRCcRYvWnKf.md
  - 'no': 3
    name: 行动主义三部曲：躬身入局/主动举手/亲身实践
    desc: 拒绝旁观者视角，深度参与业务细节承担脏活累活；打破被动等待，主动进入他人视野获取机会；断言认知/学习/观察均无法直接产生金钱，唯有亲身实践完成知行合一变现。
    role: method
    src:
    - paper: docs/202303/VEF1dwgsRoVRcIxbDRCcRYvWnKf.md
  - 'no': 4
    name: 心理建设与成长策略：开放试错/发挥优势/拒绝幻想拥抱决心
    desc: 以开放心态接纳不确定性，高频低成本试错识别核心优势并放大；将行动结果统一视为‘反馈’消除失败恐惧；扩大金钱承接心量与格局；圈友共创补充：抛开对金钱幻想坚定攻克困难决心，二者互斥决定成败。
    role: method
    src:
    - paper: docs/202303/VEF1dwgsRoVRcIxbDRCcRYvWnKf.md
  - 'no': 5
    name: 社群文化共识壁纸化现象与用户共创增补机制
    desc: 线下见面会PPT语录制成统一品牌色壁纸广泛传播，印证‘金句提炼-视觉载体化-日常高频触达’强化群体认同降低认知负荷；文末用户共创高赞语录验证‘官方核心+用户共创’模式拓展内容边界增强归属感。
    role: finding
    src:
    - paper: docs/202303/VEF1dwgsRoVRcIxbDRCcRYvWnKf.md
  - 'no': 6
    name: 极端时间投入幸存者叙事风险提示
    desc: 圈友补充‘未来一年连睡觉都是浪费时间’宣称极端时间投入为成功必要条件，但无数据支撑普适性，可能诱发幸存者偏差与健康风险，需辩证看待。
    role: limitation
    src:
    - paper: docs/202303/VEF1dwgsRoVRcIxbDRCcRYvWnKf.md
