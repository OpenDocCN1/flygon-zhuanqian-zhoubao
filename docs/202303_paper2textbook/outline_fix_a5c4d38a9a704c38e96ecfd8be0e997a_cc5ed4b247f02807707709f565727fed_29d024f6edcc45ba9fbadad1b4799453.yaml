    desc: 模板类：便宜/免费但重复率高/无专属元素/识别性不稳定无售后(喜欢的样式不识别只能换样式)；原创类：专属/高识别/承载IP价值；行业停滞：1.传播载体弱(无法承载大面积文案劝退小商家)
      2.设计师缺营销能力 3.历史需求错位(大品牌时代尝鲜无系统案例/个人IP兴起时早期设计师已流失) 4.平台生态割裂。
    role: limitation
