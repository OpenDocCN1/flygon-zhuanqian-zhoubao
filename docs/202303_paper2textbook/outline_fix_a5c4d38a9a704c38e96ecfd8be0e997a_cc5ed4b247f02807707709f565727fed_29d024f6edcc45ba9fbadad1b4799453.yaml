  name: 艺术二维码与视觉锤营销 —— 从“一张二维码”到“连锁引流商业闭环”
  desc: 本章以吉果一张个人艺术二维码引发连锁商业转化为案例，系统拆解艺术二维码的定义、时效性约束(仅适用永久原始码)、信息点覆盖原则(视觉重构保识别)、分级定价模型(两位数至五位数/3万元)、迭代测试保识别法、圈层定向营销策略(锚定知识付费/自媒体IP圈层)，揭示‘社交货币属性+身份锚定属性’触发‘好奇-验证-连接’三级引流链条(KOL粉丝加KOL→大佬加设计师→意向客户下单)，论证IP审美溢价定理(定价锚定IP商业价值而非制作成本)与跨平台生态割裂定律(微信生态内流通/线下可用/抖音小红书受限)。
  nodes:
  - 'no': 1
