  name: 服务设计微观洞察 —— 好的服务让客户“下意识选择它”
  desc: 本章通过公交车上老人因首选座位1号缺扶手且惯用手被占用导致借力失败，被迫转向就近有扶手座位2号的微观观察，揭示服务设计最高境界：通过物理环境微细节(扶手位置/动线设计)适配用户特定约束下(单手/震动/台阶)的本能反应，使用户无需思考即完成最优交互。核心发现：扶手位置与惯用手匹配度决定上座成败、动态环境下‘就近原则’优于‘偏好原则’的行为切换机制、台阶高度与扶手缺失叠加形成隐性服务门槛。
