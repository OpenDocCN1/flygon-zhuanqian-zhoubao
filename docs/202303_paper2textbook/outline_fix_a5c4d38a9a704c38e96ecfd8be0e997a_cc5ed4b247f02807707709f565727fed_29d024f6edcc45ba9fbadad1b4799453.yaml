  - 'no': 2
    name: 分级定价模型与迭代测试保识别法
    desc: 按复杂度/原创元素/IP信息密度/衍生应用分五梯队：基础换色/单一元素(两位数)、3-5原创图案(三位数)、明确专属图案+大量信息/配海报(1-5千)、毕加索/2.5D/含设计理念(五位数/最高3万)；制作流程：AI矢量软件逐层绘制→每加一元素即跨设备/交互实测→定位失败微调→循环至全通过，将可识别性作为硬约束嵌入创作全程。
