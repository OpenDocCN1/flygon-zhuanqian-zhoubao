    desc: 定价锚点不在制作成本而在承载的IP商业价值与稀缺性：大IP愿为差异化视觉资产付溢价(边际收益远超成本)，普通用户仅付模板成本；商业效用受限于平台壁垒：微信二维码不可跨平台引流(抖音/小红书判违规)，仅限微信生态内及线下物理场景，限制商业模式规模化复制。
