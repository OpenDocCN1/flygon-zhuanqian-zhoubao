units:
- 'no': 1
  name: 自我迭代底层思维层级 —— 改变大于思考大于学习
  points:
  - '**为什么需要这个概念？**'
  - '- 大多数人陷入“学习-思考-不行动”的伪勤奋陷阱，知识无法转化为结果'
  - '- 创业/项目中，认知识别与落地能力比项目本身优劣更重要'
  - '- 面对不确定性，唯有通过“改变（行动）”获取真实反馈，才能驱动“思考（复盘）”与“学习（输入）”的正向循环'
  - '**核心定义**'
  - '- 个体成长的三个层级及优先级：改变（行动/落地）> 思考（复盘/认知）> 学习（输入/知识）'
  - '- 以明确目标驱动的“改变”为起点，而非沉迷于被动“学习”'
  - '**关键性质**'
  - '- 顺序不可逆：先行动，再复盘，最后补课；颠倒顺序导致知行分离'
  - '- 目标导向：改变必须由明确目标驱动，非盲目折腾'
  - '- 认知与落地决定论：能否把握好项目赚到钱，取决于自身的认知、识别能力和落地能力'
  - '**典型例子**'
  - '- 合伙人零新媒体背景，All in抖音3个月、12条视频做到30万粉、均百万播放，验证“改变>思考>学习”在陌生领域的极速迁移有效性'
  - '- 作者（阿里背景高认知者）亲测：同主题下，自己“主题式学习（看完-思考-行动）”脱节，合伙人“微循环（学一遍-落一遍）”学完即会'
  - '**边界条件**'
  - '- 改变非盲目行动，需有明确目标与动机，否则是无效折腾'
  - '- 学习仍是必要输入，但必须服务于落地，作为“改变”的弹药而非终点'
  - '- 适用于高不确定性、需快速试错的创业/新业务场景；成熟期大公司可能更需“思考>改变”'
  sources:
  - paper: docs/202303/20230328_147.md
    role: origin
  excerpts:
  - 他高速迭代的底层思维是：改变 > 思考 > 学习
  - 明确目标，明确改变动机，而不是沉迷于学习，了解一堆知识和信息无法自拔。
  - 我个人认为能把握住好项目，并且赚到钱，更重要的是我们自身的认知，识别能力和落地能力。
  - 迭代速度更快的原因是在于，当我们更多还在主题式学习的过程中，他拆分成更细的颗粒度。
  - 当主题下的顶尖高手的内容全部学习完，他已经掌握了这项技能。
- 'no': 2
  name: 向有结果的人学习 —— 空杯心态与100%照单全收
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人学习常打折扣：理解了不等于会做、听进去不等于照做、执行中常夹杂主观改良'
  - '- 认知高反而更难“空杯”，易陷入“我懂了”而不“照做”的傲慢陷阱'
  - '- 最短路径是直接复制成功者的完整方法论，在执行中内化而非理解后再执行'
  - '**核心定义**'
  - '- 筛选出能做出更好结果的标杆人物，建立完全信任（空杯心态），对标其方法进行100%照单全收的落地执行'
  - '- 先去改变（执行），改变的过程中再去思考（复盘内化）'
  - '**关键性质**'
  - '- 信任前置：核心门槛非理解能力，而是“真正相信并落到行动上”的信任度与执行力'
  - '- 零改良：执行初期严禁引入主观判断修改标杆动作，避免破坏因果链条'
  - '- 反向内化：认知升级发生在“改变”过程中，而非“改变”之前'
  - '**典型例子**'
  - '- 合伙人付费跟随多位顶尖高手，每学一遍即全盘落地一遍，主题下所有高手内容学完已掌握技能'
  - '- 作者自述：作为高认知者，“听话照做、空杯心态”极难践行，卡点在于信任与执行而非理解'
  - '**边界条件**'
  - '- 标杆筛选必须严格：对方需有确凿结果、能力更强、路径可复制，否则是盲目跟风'
  - '- 适用于“0-1学习期/陌生领域切入期”；成熟期需逐步过渡到“组合创新/自主迭代”'
  - '- 非盲从：复盘阶段需保留批判性思维，提炼底层逻辑而非教条主义'
  sources:
  - paper: docs/202303/20230328_147.md
    role: origin
  excerpts:
  - 【向有结果的人学习】并不是一句空话，而是当你觉得这个人比你优秀强大能做出更好结果的时候，完全选择听话照做，对着对方的方法完全落地，先去改变，改变的过程中再去思考。
  - 真正能听进去多少吸收多少，是真的需要相信照做，落到行动上的。
  - 第一，听话照做、空杯心态看起来简单，其实对我来说很难，真正能听进去多少吸收多少，是真的需要相信照做，落到行动上的。
- 'no': 3
  name: 主题下微循环迭代法 —— 学一遍落一遍的指数级习得
  points:
  - '**为什么需要这个概念？**'
  - '- 传统“主题式学习（系统看完-思考-行动）”颗粒度太粗，导致认知与行动脱节、迭代周期过长'
  - '- 面对新业务/新技能，常人“学得多、做得少”，高手“学一点、做一点、改变一点”'
  - '- 同等时间内，微循环完成的“改变”次数呈指数级领先，形成系统性认知更快'
  - '**核心定义**'
  - '- 将宏大主题拆解为细颗粒度“学习-落地”微循环：单一主题下找多位顶尖高手，针对每位执行“付费学习-即刻落地-复盘改变”多轮迭代'
  - '- 非线性学习：不等全学完再做，而是学一轮、落一轮、变一轮'
  - '**关键性质**'
  - '- 颗粒度决定速度：细颗粒度微循环 vs 粗颗粒度主题式学习，前者迭代速度指数级更快'
  - '- 多专家并行：同一主题找多位高手，吸收不同视角最佳实践，综合内化形成自己的体系'
  - '- 以果导因：由“想要的结果”倒推“该学谁、学什么”，避免无效输入'
  - '**典型例子**'
  - '- 合伙人抖音起号：定主题->找多位高手->单轮：付费学单个高手法->即刻全盘落地->产出反馈->复盘改变->切换下一位->多轮迭代->综合内化成系统认知'
  - '- 作者对比实测：自己“主题式”导致知行脱节；合伙人“微循环”学完即会，验证习得效率显著优势'
  - '**边界条件**'
  - '- 需具备“向有结果的人学习”的空杯心态与执行力为前提'
  - '- 适用于技能习得、新业务切入等“可拆解、可模仿、有标杆”的场景'
  - '- 非碎片化学习：每轮微循环必须包含完整的“学-落-改”闭环，不可只学不落'
  sources:
  - paper: docs/202303/20230328_147.md
    role: origin
  excerpts:
  - 迭代速度更快的原因是在于，当我们更多还在主题式学习的过程中，他拆分成更细的颗粒度。
  - 在一主题下找到行业特别牛的人付费（多个人），学习-落地，学习-落地，这样主题下向多个有结果的人多次学习落地的过程中，得到了一遍又一遍的改变，逐渐对于一个新主题形成了系统的认知。
  - 当主题下的顶尖高手的内容全部学习完，他已经掌握了这项技能。
  - 而我个人对比他的思维方式...我会先看一遍主题相关的内容，然后去思考，大于行动。而非像他主题下，每学习一遍，落地一遍。
- 'no': 4
  name: 力量感驱动执行力体系 —— 微习惯积累自我效能感
  points:
  - '**为什么需要这个概念？**'
  - '- 创业充满未知难题，认知缺口导致“未知无从下手”的恐惧，引发拖延焦虑（人性趋利避害选简单事）'
  - '- 意志力有限不可靠，需建立“想做就一定能做到”的自我效能感作为核心驱动力'
  - '- 通过微小胜利积累的“力量感”，能对抗高难度任务的心理阻力，实现从“被推着走”到“自己摸路”'
  - '**核心定义**'
  - '- 力量感：源于“想做就一定能做到”的自我效能感，由连续完成微小难事积累自信而得'
  - '- 微习惯闭环：设定极低门槛、高频次的微小任务 -> 承诺不间断执行 -> 积累“小事做成”胜利体验 -> 强化自信 -> 迁移至高难度任务'
  - '**关键性质**'
  - '- 动作微小化：任务门槛极低（吃维生素、每日写作、戒烟），核心是“不间断”而非“量大”'
  - '- 正向循环：微小成功 -> 自信/成就感 -> 底气处理难事 -> 更多成功 -> 更强力量感'
  - '- 任务拆解123456法：将模糊大难题拆解为有序、具体、可执行的步骤清单，填补认知缺口，化解拖延焦虑'
  - '**典型例子**'
  - '- 合伙人每日吃维生素、戒烟、写作思考梳理，从不间断，通过微习惯积累力量感支撑创业高强度执行'
  - '- 面对未知难题时，用“123456法”拆解步骤，有章法、可复盘、可迭代，不再恐慌回避'
  - '**边界条件**'
  - '- 微习惯非目的本身，是训练“执行肌肉”的手段，最终要迁移至核心业务难题'
  - '- 需配合“优化信息源”与“真正的调研”，避免“盲目自信”导致低质执行'
  - '- 适合高不确定性、高心理阻力的创业早期；成熟期更依赖系统化SOP与团队机制'
  sources:
  - paper: docs/202303/20230328_147.md
    role: origin
  excerpts:
  - 而力量感的来源是源于当你想要做什么，就一定能做到。通过一件又一件的小事做成，从而获得自信，获得成就感，比如每天吃维生素、戒烟、每天通过写作来思考梳理，从不间断。
  - 通常是因为遇到这件事儿以前没有处理过，对事情没有完整的认知，有一种未知的无从下手的感觉，总想回避难题。
  - 人性会优先去选择去做简单容易可以立刻解决的事情。
  - 那这个时候就要去把事情做分解，把一个难题拆解开，分解步骤，然后有明确的提示 123456。这样有章法，可复盘迭代。
- 'no': 5
  name: 信息源质量优化与真正的调研 —— 决策精度的双引擎
  points:
  - '**为什么需要这个概念？**'
  - '- 落地速度的核心决定因素是输入信息的信噪比，低质信息导致认知偏差与行动低效'
  - '- 主观臆断、道听途说无法支撑精准判断，必须掌握“挖掘高质量信息”的方法论'
  - '- 信息过载时代，筛选源头比处理信息更关键，决定了认知的上限'
  - '**核心定义**'
  - '- 信息源质量优化：谨慎筛选信息来源（行业大佬交流、啃经典书、一手数据），持续提升输入信噪比'
  - '- 真正的调研：挖掘高质量信息的核心方法论，一种需持续刻意练习的关键能力，替代主观臆断支撑精准判断'
  - '**关键性质**'
  - '- 源头>处理：直接对接一手信息（大佬/经典/原始数据）优于二手转述，信息损耗最小'
  - '- 刻意练习：调研非天赋而是技能，需像练肌肉一样持续训练“如何提问、如何验证、如何综合”'
  - '- 精准判断力公式：谨慎做对选择（信息源优化+刻意练习调研） × 日积月累的时间复利'
  - '**典型例子**'
  - '- 合伙人重视时间效率分配，知晓轻重缓急，集中攻克关键能力项，通过优化信息源与刻意练习调研，锻炼“有能力想清楚、有能力做得到”'
  - '- 作者建议：要去和行业大佬交流、啃经典书，谨慎选择信息源，学会如何做“真正的调研”'
  - '**边界条件**'
  - '- 信息源优化有成本（时间/金钱/社交资本），需按决策重要性分配投入'
  - '- 调研能力有学习曲线，初期效率低，需耐心坚持刻意练习'
  - '- 非完全替代实战：高质量信息服务于落地，最终仍需在“改变”中验证真伪'
  sources:
  - paper: docs/202303/20230328_147.md
    role: origin
  excerpts:
  - 1、你的信息质量究竟有多高，那为什么要去和行业大佬交流，为什么要啃经典书？谨慎地选择信息源，就是不断去优化信息源的质量
  - 2、如何挖掘高质量的信息，是需要持续刻意练习，比如学会如何做【真正的调研】
  - 重视时间效率的分配，知道如何去分辨轻重缓急，也着重去分析需要培养的能力项，有哪些是比较重要的，去集中专注攻克难题。「谨慎」地做「对」选择，剩下就是日积月累产生的差异。
  - 我们不断地锻炼「有能力想清楚，有能力做得到。」最终做出「精准的判断和选择」。高手在细节的磨炼，水滴石穿。
- 'no': 6
  name: 组合创新起号法 —— 成熟要素重组而非原创生产
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人误以为起号需“原创内容/原创模式”，门槛极高、失败率极大'
  - '- 太阳底下无新事，所有爆款均可拆解为可迁移要素，重组即可创新'
  - '- 降低创新门槛与试错成本，提高成功概率，实现“低成本、可复制、快见效”'
  - '**核心定义**'
  - '- 非原创生产，而是将现有成熟内容要素（报告来源、高颜值素材库、设计工具、发布节奏、运营钩子）重新拆解组合'
  - '- 核心公式：成熟内容源 + 成熟视觉源 + 成熟工具链 + 成熟运营钩子 = 差异化IP'
  - '**关键性质**'
  - '- 普适性：所有平台均可组合创新，小红书/抖音/视频号等通用'
  - '- 变现先行：账号启动前必须锁定高客单/高利润变现路径，内容生产倒推自变现模型'
  - '- 细分切入：避开头部“大而全”存量竞争，选垂直细分赛道建立专业度/垂直度/频次优势'
  - '- 标准化流水线：报告获取/素材下载/模板套用/定时发布固化为SOP，压缩单条生产耗时'
  - '**典型例子**'
  - '- 田不脱小红书研报号：慧博获报告(零成本) + ArtStation下载酷炫素材(批量) + 稿定设计做模板(改图改字) = “每天一份元宇宙报告”，日均10分钟、3周5000粉、引流600+'
  - '- 首篇即爆款(赞藏200+)，群聊两个满员(1000+)，3周接多个商务合作(现金/NFT)'
  - '**边界条件**'
  - '- 要素必须成熟可得：内容源稳定、素材库可版权/合规、工具链易上手'
  - '- 赛道需有变现可行性：元宇宙因“概念虚、难变现”被放弃，印证变现先行原则'
  - '- 非无脑拼凑：需“像素级拆解”提取关键成功因子，而非表层模仿'
  sources:
  - paper: docs/202303/20230328_170.md
    role: origin
  - paper: docs/202303/UzSUdLrruodXSAxMlRtc0PSsnLb.md
    role: improve
  excerpts:
  - 所有的平台都可以进行组合创新，太阳底下没有新鲜事，小红书以及其他平台的爆款文章，我们都可以按照上面的思路进行拆解，然后再进行元素的组合。
  - 我们要做的事情分别是找到报告来源、找到炫酷的图片、制作封面模板。
  - 第一点，做账号前最好就规划好变现模式，高客单与高利润的优先选择。
  - 由于对手做了很久，又大而全。于是自己决定做一个细分的账号，选了当时较火的元宇宙。
  - 每天工作时长10分钟左右，第一篇文章就成了爆款，3周达到了5000粉...按照这个起号思路，完全可以做到低成本和可复制的快速起号。
- 'no': 7
  name: 像素级拆解与项目库 —— 从模糊学习到结构化复制
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人看案例只看热闹（“这账号不错”）、不看门道（“为什么好、好在哪”）'
  - '- 缺乏结构化拆解框架，无法提取可迁移的关键成功因子，导致模仿变形、效果大打折扣'
  - '- 信息获取量与质量决定输出上限，需建立个人“案例库/项目库”作为核心竞争力护城河'
  - '**核心定义**'
  - '- 像素级拆解：对标杆账号进行极细致维度拆解（价值逻辑/视觉呈现/选题策略/互动机制），提取可迁移关键因子'
  - '- 项目库：系统性记录、收集跨平台可复制/有特色账号案例的知识库，用于筛选对标、拓宽认知、辅助决策'
  - '**关键性质**'
  - '- 维度固化：拆解维度标准化（如：价值逻辑是什么？视觉哪里吸睛？选题为何新？互动怎么设计？）'
  - '- 量级积累：操千曲而后晓声，通过大量案例积累培养选题嗅觉、拆解能力与组合直觉'
  - '- 复利效应：案例库是核心护城河，信息获取量质量决定输出上限，随时间复利增长'
  - '**典型例子**'
  - '- 田不脱拆解对标账号：1.报告提供价值(求分享) 2.封面好看吸睛(同类丑封面数据差) 3.选题蹭热点(国潮/新能源/露营) -> 提取核心要素重组'
  - '- 作者建立OneNote项目库记录100+项目(类比生财风向标)，筛选赛道/对标账号/拓宽认知'
  - '**边界条件**'
  - '- 拆解非抄袭：提取底层逻辑与结构，而非表层文案/排版'
  - '- 项目库需定期清理更新，避免变成“数字垃圾箱”'
  - '- 需配合“组合创新”落地：拆解是为了重组，不重组则无价值'
  sources:
  - paper: docs/202303/UzSUdLrruodXSAxMlRtc0PSsnLb.md
    role: origin
  excerpts:
  - 分析这个账号的成功之处：1、报告是可以提供价值，大家乐于去‘求分享’。 2、封面好看，吸睛。有同类型的账号，封面不好看的，数据也不行。 3、选题新颖，国潮、新能源、露营都是当下最火的选题。
  - 于是自己做了一个项目库，把观察到一些可复制或者有特色的账号都记录到onenote，里面大部分都是小红书和抖音平台的案例，总共记录了100多个项目。（现在看起来有点像生财的风向标）
  - 我建议也搭建属于自己的项目库，把自己感兴趣的账号都记录一下，信息的获取量决定输出的质量。
  - 操千曲而后晓声，多看别人成功的案例，在别人成功案例的基础上进行创新，可以让我们更容易成功。
- 'no': 8
  name: 标准化内容生产流水线与私域引流闭环 —— 低维护高产出的SOP化
  points:
  - '**为什么需要这个概念？**'
  - '- 内容生产若无标准化，极易因耗时过长、质量波动、依赖灵感而中断，无法持续'
  - '- 公域流量不稳定，必须建立“公域获客-私域沉淀-转化变现”的自有闭环'
  - '- 引流机制需预埋：等流量来了再想引流，早已流失大量红利'
  - '**核心定义**'
  - '- 标准化内容生产流水线：将报告获取、素材下载、模板套用、定时发布固化为SOP，压缩单条生产耗时至极致(如10分钟)'
  - '- 私域引流闭环：利用平台原生功能(群聊公告/水印/私信)设计低运维引流路径，配合“免费增值模型”(水印版引流+去水印版付费+商务合作)实现多元变现'
  - '**关键性质**'
  - '- 效率极致：前期批量准备素材库/模板，日常仅“改图改字”，实现视觉一致性与极致效率平衡'
  - '- 引流预埋：账号启动即设置引流钩子(群公告/水印/私域入口)，而非事后补救'
  - '- 免费增值：水印版免费传播获流量/涨粉，去水印版付费变现，商务合作(广告/NFT)第三收入'
  - '**典型例子**'
  - '- 研报号：慧博零成本获报告 -> ArtStation批量建素材池 -> 稿定设计预制模板 -> 日均10分钟出稿 -> 群满设公告引流公众号 -> 水印双重变现(传播涨粉+去水印付费+商务)'
  - '- 教训：群聊满员(1000+)后才设公告引流，导致早期大量流量流失，仅引流600+，揭示“引流机制需预埋”关键性'
  - '**边界条件**'
  - '- 适用于“内容可标准化、素材可批量、模板可复用”的垂直资料/资讯类账号'
  - '- 非标服务/强人设账号难完全SOP化，需保留创意弹性空间'
  - '- 平台规则变动(如群聊上限/私信限制)可能失效引流路径，需持续适配'
  sources:
  - paper: docs/202303/UzSUdLrruodXSAxMlRtc0PSsnLb.md
    role: origin
  excerpts:
  - 每天工作时长10分钟左右，第一篇文章就成了爆款，3周达到了5000粉...定稿以后，每天只需要改下图和字即可。
  - 前期多下载一些，后面每天下载一个也足够了。
  - 因为很多人都来要报告，都加个人微信太累了，所以直接在群公告里，引流到公众号。
  - 这些报告，我都打了公众号的水印，一是可以通过用户的二次传播来增加关注，二是可以出售不加水印的报告。
  - 这个账号当时接到了好几个商务合作，有的会给到费用，有的给到nft。
  - 这个操作已经比较晚了，所以浪费了很多流量，后来引流到私域600+
- 'no': 9
  name: 家电上门服务资源整合 —— 刚需赛道的轻资产中介模式
  points:
  - '**为什么需要这个概念？**'
  - '- 传统创业需自建团队/租门店/买设备，固定成本高、启动慢、风险大'
  - '- 家电上门服务(移机/维修/清洗/疏通/热水器)具备强刚需、高频次、标准化高、决策链路短特征，极适合资源整合'
  - '- 通过整合分散闲置师傅资源，对接集中客户需求，赚取中介差价，实现轻资产/快速启动/高现金流'
  - '**核心定义**'
  - '- 服务资源整合商：不直接提供技术服务，扮演“中间商/组织者”，整合线下师傅与线上流量，赚取信息差与管理溢价'
  - '- 轻资产中介模式：无需雇佣正式员工/购买设备/租赁门店，仅负责流量获取、客户对接、师傅调度、质量把控'
  - '**关键性质**'
  - '- 供给端利益绑定优先：必须让利于师傅(分成向师傅倾斜)、建立严格奖惩与售后保修机制，保证“接单-上门-服务-收款”链路闭环，避免砸招牌/私单/甩单'
  - '- 城市能级决定分成比例：一线五五/二线四六/三线三七(师傅占大头)，反映不同城市师傅议价能力与生存成本客观差异'
  - '- 公域低价引流+私域高客单转化：咸鱼发9.9/19.9元诱饵SKU获曝光咨询，微信专业人设/话术/信任背书成交几百元高客单并复购'
  - '- 执行力与耐心是成败关键：模式虽简单可复制，但成功取决于能否沉下心做师傅筛选/客户沟通/异常处理等“脏活累活”'
  - '**典型例子**'
  - '- 蓝狐身边案例：操作2个月纯利30万+，验证单人/小团队可跑通'
  - '- 供给端：地图/58同城/采集系统三级采集师傅 -> 微信群建档(地区+行业+名字) -> 标准化派单模板 -> 绩效考核动态分级分成/优汰'
  - '- 需求端：咸鱼矩阵号(实名6号+亲友+Pro版=300-3000槽位) -> 省市区县地毯式发布 -> 中午12点/晚7点高峰发 -> 长尾词塞满标题
    -> 低价引流SKU -> 话术库/自动回复转化 -> 私域沉淀信任闭环'
  - '- 裂变放大：招聘平台发兼职招募借用他人咸鱼账号发布，零成本突破单人发布上限'
  - '**边界条件**'
  - '- 核心壁垒非“会操作”(易复制)，而是“信息差(师傅渠道/获客话术) + 强执行力体系(矩阵/裂变/话术标准化)”'
  - '- 依赖平台规则(咸鱼发布限制/算法偏好)与师傅供给稳定性，平台打击/师傅流失为主要风险'
  - '- 可迁移至宠物洗护/开锁换锁等同类“刚需+标准化+非品牌化”本地服务赛道'
  sources:
  - paper: docs/202303/20230328_170.md
    role: origin
  - paper: docs/202303/LSvldmb3QojJhSx1yk3cytnAn0f.md
    role: improve
  excerpts:
  - 通过资源整合服务，有人两个月纯利 30 万+
  - 像空调移机，空调拆装，空调维修，疏通管道，热水器清洗等等，这些服务都是非常刚需的。
  - 一线城市，五五分，一线城市费用高，竞争大，五五分双方都愿意；二线城市，四六分，师傅拿六成...三线城市，三七分，师傅拿七成，因为费用相对于偏低
  - 价格可以采取低价方式，比如9.9元，19.9元这样，这样的好处，可以增加曝光，但是要在文案中写明，具体价格咨询客服
  - 打造私域流量很重要，让客户加到微信，只要我们服务好，专业性强，客户有需求第一还是会找到我们，还会转介绍
  - 直接打开地图来，搜一下相关行业...上面都会有相关师傅的联系方式
  - 有专门的客户资源采集系统，可以一键采集全国的师傅联系方式，还可以导出表格
  - 素材可以去tao宝，搜集一下图片和文案...用简单的作图软件进行处理...不怕检测抄袭
  - 标题要尽量填满，需要包含一些关键词...尽量全面一些，增加曝光率
  - 发布商品，要按照每个省、市、区/县这样分别发布，最小单位是区/县
  - 我们要选择中午十二点和晚上七点左右发布
  - 利用他们的空闲时间，也在咸鱼上发布...给他们一定的利润分成...相当于借用了他们的咸鱼号，达到了双赢的局面
  - 提前整好话术，对于我们的效率和转化率能有大大的提升
  - 难道老板自己不会操作吗？我们去做还有市场吗？...只要我们话术好，会沟通，懂yin流，懂信息差，执行力强，这都是我们的优势所在
