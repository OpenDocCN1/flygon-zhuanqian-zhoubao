units:
- 'no': 1
  name: 鸡血石非标品直播 —— 小众赛道的信任构建与玩法进化
  points:
  - '**为什么需要这个概念？**'
  - '- 小众非标品（如鸡血石印章）每一枚唯一、难定价，导致直播间留人难、成交频次低'
  - '- 高客单价非标品面临严重的信任危机：买家怕买假、怕定价不透明、不敢下单'
  - '- 传统标品直播话术、选品逻辑完全失效，需要一套适配非标属性的运营方法论'
  - '**核心定义**'
  - '- 非标品直播核心模型：基地报白建信任（证书背书）+ 福利留人积累种子用户 + 拍卖玩法建信任 + 千川精准投流破瓶颈 + 人货场协同迭代（手播→真人/实体店）+
    私域/实体闭环高客单复购'
  - '- 核心公式：信任资产累积 × 玩法适配度 × 场景迭代速度 = 非标品变现能力'
  - '**关键性质**'
  - '- 信任前置性：无基地证书/实体店/专家背书，高客单非标品无法成交'
  - '- 玩法适配性：拍卖机制（无托真拍）完美匹配非标品‘一物一价’属性，以‘薄利引流’换‘高利收割’'
  - '- 迭代必要性：人货场（主播/选品/场景）必须随阶段协同进化，静态配置必死'
  - '- 资源壁垒性：核心护城河非技术/运营，而是不可复制的上游矿源积累与专家级定价权'
  - '**典型例子**'
  - '- “石痴鸡血石”账号：复用旧号零投流冷启动，半年享受自然流量红利，日均场观3000+、在线30+'
  - '- 福利留人：单场送3枚昌化石印章（成本600-900元/天），坚持6个月积累首批忠实粉丝与精准人群模型'
  - '- 千川小预算破局：日投1000元（极速推+达人相似），配合原有模型恢复日销1-5万稳定出单'
  - '- 拍卖+讲品双轨：前半场拍卖~1000元中低客单品建信任/拉人气，后半场讲几万至几十万高货转化利润，复购率显著高于同行，做到石雕类目第一'
  - '- 私域/实体闭环：3人团队靠父亲微信一对一成交百万高货，杭州实体店提供实物验货场景，线上引流-私域服务-线下成交三位一体'
  - '**边界条件**'
  - '- 综合利润率仅30%左右，非暴利赛道，核心成本在获客与选品专业度'
  - '- 新人入局门槛极高：需具备原产地矿源资源（政策封矿不可复制）及专家级鉴定定价能力，否则难跨越‘货’的壁垒'
  - '- 非标品选品定价权掌握在供应链源头，主播/运营难复制，必须建立‘专家把控货+主播传文化+运营保履约’分工体系'
  - '- 平台风控趋严：基地质检收紧、违规不可逆，合规是生存底线'
  sources:
  - paper: docs/202303/20230328_144.md
    role: origin
  excerpts:
  - 鸡血石印章属于非标品，每一枚印章也都是非标品，都需要做独立的讲解介绍。
  - 我们一致决定是不设托，这样才会有客户愿意出价，愿意经常来出价……有舍才有得，格局要放大。
  - 直播就是人货场，我们也是尽力在完善，还有很多进步的空间。增强了主播的人设……打造新的直播场景，与同行之间形成差异化，会更加吸引用户的眼球，增加停留时长，增大成交几率。
  - 大家一开始做直播带货不用想着要多少多少专业的直播设备，我们就是两盏灯，一台手机，在一个不到 15 平米的小房间里就开始直播了。
  - 做直播就尽早去开播，不要到了开播还犹犹豫豫，做太多准备也不好，走出第一步先，每播一场积累一场的经验。
  - 鸡血石是属于蓝海的，我们综合利润来说，是 30% 左右，没有想象中那么高。就门槛来说还是比较高的，因为鸡血石是我们当地的矿产资源，政策原因封矿好多年了，之前是父辈线下做这个生意几十年了，有这个资源积累。
  - 难度最大在于选品，鸡血石是非标品，每一枚印章有每一枚的价……选品及售卖价格全是经父亲把控的。
