  name: 私域引流风控SOP —— 账号安全与引流效率的动态平衡
  points:
  - '**为什么需要这个概念？**'
  - '- 激进引流导致账号封禁是私域运营最大隐性成本（作者一个月爆2个号）'
  - '- 平台规则持续收紧，旧玩法(硬广/二维码/诱导)失效加速'
  - '- 需要一套标准化、可执行、可迭代的风控操作手册保护核心资产'
  - '**核心定义**'
  - '- 私域引流风控SOP：涵盖养号规范、加人频次控制、发圈频次/内容规范、针对不同账号类型的差异化策略'
  - '- 核心原则：账号安全 > 引流速度。一个号仅有2-3次机会，珍惜私域资产'
  - '**关键性质**'
  - '- 分级管理：新号(运动/红包/视频养号3-7天) vs 老号(日通过<200、早中晚2-3条朋友圈)'
  - '- 内容合规：拒绝微商式截图/硬广/刷屏；仅发真实感悟/避坑/认知/钩子资料'
  - '- 工具化沉淀：将经验固化为《个人微信养号SOP》《朋友圈运营SOP》，团队新人可直接执行'
  - '**典型例子**'
  - '- 刘晨昊教训：“之前引流微信号爆了2个...大家可以小心一点～...还有个人微信养号sop”'
  - '- 实测数据：老号日通过>200必封；朋友圈>5条/天被折叠/屏蔽；硬广截图投诉率极高'
  - '**边界条件**'
  - '- 平台规则动态变：需持续更新SOP(如视频号/小红书新规则)，过期SOP反成陷阱'
  - '- 效率与安全博弈：严格风控降低引流速度，需通过矩阵号(多号轮换)弥补单号上限'
  - '- 最终归宿：私域流量不等于私域资产。账号可封，但“用户关系/信任/方法论”需沉淀至飞书/语雀/本地文档实现资产永续'
  sources:
  - paper: docs/202303/20230328_065.md
    role: origin
  - paper: docs/202303/K4zfd2djsoEAdWxTaXrceSf9nLf.md
    role: improve
  excerpts:
  - 之前引流微信号爆了 2 个。现在平台的规则都更严格了，大家可以小心一点～...还有个人微信养号 sop
  - 新号，请务必养号...不想和我一样一个月被封两个号
  - 老号（一年以上）：一天也不宜通过超200个好友，会被封
  - 频次：早中晚各2-3条已经够了，多了真的烦
- 'no': 12
  name: 跨平台迁移复利论 —— 能力迁移比账号迁移更核心
  points:
  - '**为什么需要这个概念？**'
  - '- 账号是平台租赁资产，随时被收回；能力是个人所有资产，跨平台永久生效'
  - '- 新手常纠结“在哪个平台”，忽视“练什么能力”，导致平台更换时归零'
  - '- 单平台红利期短(1-2年)，跨平台能力迁移是长期生存唯一解'
  - '**核心定义**'
  - '- 跨平台迁移复利：在平台A练就的核心能力(网感/选题/文案/转化/运营)，迁移至平台B后实现降维打击、极速起号'
  - '- 核心可迁移能力清单：网感(标题/封面/节奏) > 选题方法论 > 文案结构化SOP > 私域转化体系 > 商业模式设计'
  - '**关键性质**'
  - '- 时间压缩：抖音2个月练网感 → 小红书第2天出道(普通人需1-3个月)，压缩80%试错周期'
  - '- 降维打击：成熟方法论对抗新平台红利期，形成“成熟打法打幼稚平台”的不对称优势'
  - '- 资产剥离：账号数据归平台，但“方法论/模板/素材库/SOP/私域用户”归个人，换平台不换库'
  - '**典型例子**'
  - '- 刘晨昊：抖音探索2个月(未起号但练就网感) → 小红书入局第2篇笔记爆款出道 → 同套方法论后复用至抖音矩阵/视频号'
  - '- 验证：“我觉得这个和我前半年在抖音折腾了2个月是分不开的...网感，就是靠练”'
  - '**边界条件**'
  - '- 平台差异性适配：核心能力迁移，但表现形式需适配平台调性(小红书重标题/封面/图文，抖音重前3秒/口播/视频)'
  - '- 算法周期差异：小红书长尾流量长(月级)，抖音爆发短(日级)，运营节奏与变现节奏需同步调整'
  - '- 非自动迁移：需主动进行“平台拆解-方法论抽象-本地化适配-小规模测试-放大”，不可盲目搬运'
  sources:
  - paper: docs/202303/20230328_065.md
    role: origin
  - paper: docs/202303/K4zfd2djsoEAdWxTaXrceSf9nLf.md
    role: improve
  excerpts:
  - 我觉得这个和我前半年在抖音折腾了 2 个月是分不开的...网感，就是靠练
  - 重点做抖音，小红书佛系搬运...小红书矩阵，这个这两天才开始探索
  - 账号只是管道，能力才是资产。账号没了，能力还在，换个号、换个平台，继续干。
