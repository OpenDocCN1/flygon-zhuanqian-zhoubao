units:
- 'no': 1
  name: 怀旧赛道账号标签化定位 —— 让算法精准找到“同龄人”
  points:
  - '**为什么需要这个概念？**'
  - '- 视频号用户年龄层偏大（以80/90后为主），若账号无垂直标签，算法无法精准分发给情怀共鸣人群'
  - '- 昵称、签名、头像是算法识别账号属性、用户判断是否关注的第一视觉入口，直接决定冷启动能否‘破圈’'
  - '- 泛泛账号易陷入大杂烩流量池，完播率低、标签乱，后续带货/卖号转化极差'
  - '**核心定义**'
  - '- 通过昵称植入核心关键词（如‘80后童年怀旧’）、签名输出情怀Slogan（‘你的青春，我的回忆’）、头像使用复古风格图片，三位一体锁定目标人群画像'
  - '- 让账号一眼看清‘我是谁、服务谁、什么调性’，建立垂直领域的专业信任感'
  - '**关键性质**'
  - '- 算法友好：关键词型昵称利于搜索召回与兴趣标签打标'
  - '- 用户低认知成本：3秒内完成‘是我的菜’判断，提升主页转粉率'
  - '- 赛道护城河：垂直标签一旦跑通，同赛道后来者难以分流存量粉丝'
  - '**典型例子**'
  - '- 昵称：‘80后童年怀旧时光’；签名：‘你的青春，我的回忆，致 70-80-90 后’；头像：像素风/老照片风自制图'
  - '- 对标账号‘80后童年时光机’同模式运营，持续稳定输出'
  - '**边界条件**'
  - '- 仅适用于视频号等社交属性强、用户年龄结构偏大的平台；抖音/快手若无差异化内容，仅靠标签难破圈'
  - '- 头像/昵称若频繁更换会导致标签重置，前期必须固化'
  sources:
  - paper: docs/202303/20230328_057.md
    role: origin
  excerpts:
  - 昵称：80 后童年怀旧、80 后怀旧时光、80 后童年怀旧时光
  - 签名：你的青春，我的回忆，致 70-80-90 后
  - 头像：以这个形式去作图，也可以直接拿来用，建议自己改下
  - 因为视频号的年龄段比较符合这类粉丝群体。
  - 我相信圈友们很多都是农村走出来的，面对这样的视频场景都是比较感兴趣的...因为这个确实是怀念小时候的那种心理哈。
- 'no': 2
  name: 一机一卡一号注册环境 —— 给账号办一张‘真实身份证’
  points:
  - '**为什么需要这个概念？**'
  - '- 平台风控系统通过设备指纹、IP环境、SIM卡信息识别营销号/批量注册号，WiFi环境、一机多号是触发限流/封号的高危红线'
  - '- 新号无历史权重，环境‘不干净’直接导致零播放、标签打不上、养号白费力'
  - '- 实体卡副卡模式成本低（月租约10-20元）、流量共享、实名合规，是批量操作的最优解'
  - '**核心定义**'
  - '- 物理层面：一台手机（备用机/旧手机）、一张实名副卡（4G/5G流量）、一个微信号/视频号，三者强绑定'
  - '- 网络层面：全程禁用WiFi，仅使用蜂窝数据注册、养号、发布、运营，保证IP为真实基站IP'
  - '**关键性质**'
  - '- 合规性：实名制副卡规避虚拟号码段/接码平台被平台拉黑风险'
  - '- 稳定性：基站IP动态变化符合真人使用轨迹，不易被判定为机房流量'
  - '- 隔离性：物理设备隔离杜绝关联封号，单号挂了不牵连矩阵'
  - '**典型例子**'
  - '- 去营业厅办理主卡副卡，主卡放主力机，副卡插备用机（几百元二手安卓机即可），月租10-20元流量共享'
  - '- 注册全程飞行模式开关切换IP，注册后持续用该设备+该卡运营'
  - '**边界条件**'
  - '- 旧号迁移：已有老号建议隐藏历史视频重新养号，而非强行注销（注销需解绑商店、分数≥60、一年限3次）'
  - '- 团队协作：多人操作需建立‘设备-卡-号’台账，严禁混用设备或热点共享网络'
  sources:
  - paper: docs/202303/20230328_057.md
    role: origin
  excerpts:
  - 要一机一卡一号，要在 4G/5G 环境下注册微信，以及运营视频号，不要在 WiFi 环境下注册和运营哈！
  - 用 WiFi 注册，有可能会导致账号流量减少、限流、风控。
  - 推荐用实名注册的卡...去营业厅说注册个副卡，和主卡流量通用。
  - 老账号里的视频，我给你这个处理建议：可以隐藏视频，但不要删除，删除会降权
- 'no': 3
  name: 跨平台素材搬运去重 —— 把‘别人的素材’变成‘我的原创’
  points:
  - '**为什么需要这个概念？**'
  - '- 怀旧赛道素材极难自制（需实地拍摄/道具/演员），跨平台搬运（抖音→视频号）是低成本获取高质量素材的唯一路径'
  - '- 平台有‘同源搬运’检测机制（MD5/指纹/关键帧对比），直发必判违规限流，必须经过‘去重’重构视频指纹'
  - '- 去重非破坏画质，而是通过结构打乱、参数微调让算法判定为‘新内容’，同时保留人类观感的怀旧质感'
  - '**核心定义**'
  - '- 源头：抖音搜‘80后怀旧/童年回忆’等关键词，筛选高赞/高完播爆款视频'
  - '- 工具链：手机端‘轻抖去水印’小程序 / 电脑端 Apowersoft 视频下载王（获取无水印原始素材）'
  - '- 去重六步法（剪映）：镜头重组打乱序→调速（0.9/1.1倍）→镜像翻转→黑白复古滤镜→噪点特效叠加→调节参数（对比度/饱和度/锐化+10/20）'
  - '**关键性质**'
  - '- 算法欺骗性：MD5值、关键帧序列、色彩直方图全变，通过原创检测'
  - '- 观感保真度：黑白滤镜+噪点反而强化‘怀旧/复古’质感，用户体验不降反升'
  - '- 标准化可复制：参数固定化（调速值/滤镜名/特效名/调节数值），新手可直接套用无需审美判断'
  - '**典型例子**'
  - '- 原视频：连贯叙事、原声、彩色；去重后：镜头乱序、变速、镜像、黑白噪点、复古黄字抬头文案、模板BGM'
  - '- 前3秒必放最强镜头（如糖人吹制特写/弹弓射击瞬间）做钩子'
  - '**边界条件**'
  - '- 严禁搬运视频号同平台内容（极易被原作者投诉/算法识别），坚持 A平台(抖音)→B平台(视频号) 单向搬运'
  - '- 素材需避开显著水印/Logo/人脸特征（如知名博主出镜），规避肖像权/版权投诉风险'
  - '- 该方法属‘伪原创’灰色地带，平台算法升级（如引入语义理解去重）可能失效，需持续迭代手法'
  sources:
  - paper: docs/202303/20230328_057.md
    role: origin
  excerpts:
  - 基本上，找素材我们主要以抖音上的为主，不建议你在视频号上找素材...以防万一，我们就 A 平台拷贝 B 平台。
  - 把视频剪成一个一个的镜头...完全打乱顺序...调到 1.1、0.9...调镜像...黑白滤镜...复古特效...调对比度 10、饱和度 10，锐化 20
  - 打开抖音，搜索关键词“80 后怀旧”...点一下右下角的箭头，有一个复制链接...去微信里面搜索小程序轻抖去水印
  - PC 端：Apowersoft 视频下载王...打开这个软件，复制链接下载视频即可...点击侦测，输入网址...点击下载
- 'no': 4
  name: 视频号流量梯队爬坡模型 —— 破解‘从0到1万’的阶跃密码
  points:
  - '**为什么需要这个概念？**'
  - '- 新号发视频只有几十播放是常态，不知梯队机制易误判为‘内容不行’而放弃，心态崩盘是最大死因'
  - '- 视频号核心考核指标是‘平均观看时长’而非完播率，不知此道会错误优化方向（如盲目追求15秒完播而忽略36秒深度）'
  - '- 理解分级机制才能制定阶段性运营策略：前期拼‘留人’，中期拼‘互动’，后期拼‘稳定’'
  - '**核心定义**'
  - '- 冷启动流量池分级：L1(几十~100) → L2(500) → L3(3000) → L4(5000) → L5(1万+) → L6(10万+)'
  - '- 核心指标：用户平均观看时长（核心）、完播率（次核心）、互动率（辅助）'
  - '- 爬坡周期：单视频 7-15 天观察期，账号层面需连续 1-3 个月日更积累权重'
  - '**关键性质**'
  - '- 阶梯非线性：突破每个梯队需内容质量跃迁，非单纯堆量可得'
  - '- 标签固化：前 5 条视频日均破 500 即完成垂直标签打标，后续流量基线抬高'
  - '- 容错机制：单条不及格（<500）不影响账号权重，但连续 3 条不及格会降权'
  - '**典型例子**'
  - '- 实战账号：前 2 条几百播→第 3 条破 500→第 7 天触发原创任务→第 23 天单条 4.5 万→稳定三条万播'
  - '- 关键节点：平均观看时长超 8 秒（36 秒视频约 22% 完播率）即大概率破 500 梯队'
  - '**边界条件**'
  - '- 仅适用视频号算法（2023 年初版本），抖音/快手核心指标为完播率+互动权重，不可套用'
  - '- 违规/断更/删视频会导致梯队瞬间跌落至 L1 甚至权重清零，不可逆'
  sources:
  - paper: docs/202303/20230328_057.md
    role: origin
  excerpts:
  - 最开始的时候，发布视频后，大概是几十人，不到 100 的播放。然后想爬梯子一样往上爬。
  - 到了第二个梯队是 500 播放，第三个梯队是 3000 左右，然后第四个梯队到了 5000，第五个梯队到 1 万...
  - 这里有一个关键数据，用户平均观看时长。这是视频号判定一条视频质量的核心数据，不是大家以为的完播率，也不是点赞或评论这些数据。
  - 视频发布周期 7-15 天，看下这段期间的播放量如何，是否都过 500...前 5 天每天过 500 说明作品质量还不错
- 'no': 5
  name: 小号矩阵冷启动互刷机制 —— 用‘假人’骗过‘真算法’
  points:
  - '**为什么需要这个概念？**'
  - '- 零粉新号发视频无自然流量，算法无初始互动数据无法判定质量，陷入‘无数据→无分发→无数据’死循环'
  - '- 真人互动成本高、不可控，小号矩阵可标准化、批量化、低成本模拟‘优质用户行为’启动冷启动'
  - '- 评论区高质量互动能二次吸引真人停留评论，形成‘算法推流→真人互动→再推流’正向飞轮'
  - '**核心定义**'
  - '- 小号来源：自注册/低价购买的微信小号（实名/养号/有头像签名），建议准备 10-20 个'
  - '- 执行动作（SOP）：主号发布后 30 分钟内，小号依次完成——完播视频→点赞→写‘共鸣型’评论（非刷‘666’）→收藏→转发到朋友圈/群'
  - '- 评论话术库：预设 20-30 条‘引发回忆/共鸣/提问’文案（如‘小时候这样偷吃甘蔗被抓过吗？’），轮换使用'
  - '**关键性质**'
  - '- 行为真实性：模拟真人操作路径（停留时长/点击轨迹/输入间隔），规避批量操作特征值'
  - '- 权重传递：小号自身需养号（日刷同赛道 10 分钟），具备基础权重，互动才有效'
  - '- 成本可控：边际成本约 0.5-1 元/条（含设备折旧/流量/人工），远低于投流/找大V互推'
  - '**典型例子**'
  - '- 作者自述：每条视频发布后，动员团队/亲友小号进去‘完播+点赞+设计评论+转发’，前 5 条视频借此全部破 500'
  - '- 评论区真人跟帖率显著高于无小号托管期，验证‘互动引互动’效应'
  - '**边界条件**'
  - '- 严禁使用群控/脚本自动化批量操作（极易封号），必须人工或半自动（如群控只发指令、人工执行）'
  - '- 小号不可直接发广告/留微信，仅做互动，违规会连累主号关联封禁'
  - '- 仅适用冷启动期（前 50 条/前 1 个月），账号权重稳定后应逐步停止，转向自然运营'
  sources:
  - paper: docs/202303/20230328_057.md
    role: origin
  excerpts:
  - 大号发了作品，用小号进去完播一下播放，然后再点赞，评论、 收藏、转发。
  - 小号评论的时候也不是瞎写的，最好设计一个很吸引人的评论...例如，小时候这样的生活，你还记得吗？
  - 每天养号 1 小时...搜下 80 后怀旧等关键词，看看同行的视频，这个等于活跃账号权重
- 'no': 6
  name: 模板化批量生产SOP —— 让剪辑像‘拧螺丝’一样标准化
  points:
  - '**为什么需要这个概念？**'
  - '- 怀旧赛道依赖量级取胜（日更 2-3 条、月更 60-90 条），非标准化剪辑人均日产 <5 条，无法支撑矩阵化放大'
  - '- 创作灵感/审美判断不可复制，唯有将‘时长/音频/滤镜/特效/调色/文案/发布时间’全部参数固化，才能实现‘人人可做、件件合格’'
  - '- 模板化可将单条制作耗时从 30 分钟压缩至 5-10 分钟，边际成本趋近零'
  - '**核心定义**'
  - '- 视频结构模板：固定 36 秒总时长 = 3 秒钩子镜头 + 25 秒核心镜头组（5-8 个镜头×3-5秒） + 3 秒结尾/引导 + 5 秒缓冲'
  - '- 音频库：3 套固定模板（A:纯音乐 8-10秒/B:带歌词 20秒+/C:带歌词 30秒+），按素材时长匹配'
  - '- 剪映参数表：调速(0.9/1.1 随机)、镜像(全开)、滤镜(牛皮纸/江浙沪黑白)、特效(黑色噪点/荧幕噪点)、调节(对比度10/饱和度10/锐化20)'
  - '- 文案模板：画中画黑色背景+复古黄色字体+钩子标题（如‘敢不敢发朋友圈？’）'
  - '- 发布节奏：早 8:00 / 中 12:30 / 晚 19:00 定时发布，日更 2-3 条'
  - '**关键性质**'
  - '- 确定性产出：去审美依赖，新手跟着参数表操作即可出合格片'
  - '- 风格统一性：粉丝形成‘肌肉记忆’式观看习惯，强化账号辨识度'
  - '- 可规模化：单人可管 3-5 个账号，团队可复制出 10+ 账号矩阵'
  - '**典型例子**'
  - '- 作者团队：统一参数表分发给剪辑人员，人均日产 10-15 条，支撑 5 个账号同步运营'
  - '- 爆款视频《童年零食大赏》严格按模板：36秒、牛皮纸滤镜、B音频、黄字标题、中午发布，播放 4.5 万'
  - '**边界条件**'
  - '- 模板需每季度迭代（换滤镜/音频/文案风格），防止用户审美疲劳、算法识别为‘低质量批量内容’'
  - '- 素材若含彩色关键信息（如红领巾/绿皮火车），强制黑白滤镜会丢失语义，需建立‘例外规则’保留原色'
  - '- 音频版权：必须使用剪映商用库/自购版权/原创录制，避免侵权扣分'
  sources:
  - paper: docs/202303/20230328_057.md
    role: origin
  excerpts:
  - 建议可以统一一下，给视频形式模板化，如背景音乐，时长，文字（字体，行距，字间距，排列，描边等），滤镜，转场等。这样可以加快视频剪辑速度。
  - 现在主要是找了三个音频...一个没有歌词的，适用于 8-10 秒左右的视频；另外两个带歌词的，适用于 20 秒以上的视频。
  - 一般我是早上上班前发一条，中午吃饭时发一条...一天发三条
  - 把视频剪成一个一个的镜头...完全打乱顺序...前三个镜头一定是所有镜头中最好的
  - 调到 1.1、0.9 都可以...镜像一定要做，每个镜头都去调一下
  - 黑白滤镜，黑白里分为牛皮纸、江浙沪等滤镜...特效是黑色噪点、荧幕噪点
  - 调对比度 10、饱和度 10，锐化 20...音频导入剪映方法...做抬头文字...用比较偏复古的黄色
- 'no': 7
  name: 账号连续性中断不可逆损伤论 —— 断更即‘死号’
  points:
  - '**为什么需要这个概念？**'
  - '- 创业团队易因疾病/事务/情绪断更，视频号算法对‘长周期不活跃’极度敏感，20 天不发 = 权重归零，甚至永久不可恢复'
  - '- 认知偏差：误以为‘内容好迟早火’，实则‘不在场’算法直接回收标签，重来比养老号更难'
  - '- 连续性是权重复利的基础，任何借口断更都是在烧掉前期沉没成本'
  - '**核心定义**'
  - '- 红线：账号运营期间，严禁出现连续 ≥7 天无发布/无登录/无互动，极限红线 14 天'
  - '- 熔断机制：团队核心成员感染/出差/离职，必须提前安排‘代班人’接力发布（只发合格模板片，不求爆款只求在场）'
  - '- 恢复策略：若已断更 14-30 天，不删旧作、不隐藏、不买流，按‘新号养号流程’重新刷垂直度 7-14 天，等权重恢复再按节奏发布'
  - '**关键性质**'
  - '- 不可逆性：案例中断更 20 天后，账号彻底无流量，同期坚持更新的对标账号‘80后童年时光机’已做大'
  - '- 权重记忆：算法对‘持续出现’的账号有长期记忆奖励，对‘消失’账号有永久惩罚'
  - '- 心理锚点：将‘发视频’设为每日必做任务（如刷牙），而非‘有空就干’的选修课'
  - '**典型例子**'
  - '- 作者团队：因集体感染新冠停更 20 余天，账号流量直接归零，后续恢复更新无流量，被迫弃号'
  - '- 对标账号：同期‘80后童年时光机’坚持日更，粉丝破万、稳定变现，反向验证连续性价值'
  - '**边界条件**'
  - '- 仅针对‘成长期/冷启动期’账号；成熟大号（10万粉+、高权重）断更 1-2 周可恢复，但仍会掉粉/降权'
  - '- 春节/重大节假日平台有‘保护期’机制，但不可赌概率，建议预存素材定时发布'
  sources:
