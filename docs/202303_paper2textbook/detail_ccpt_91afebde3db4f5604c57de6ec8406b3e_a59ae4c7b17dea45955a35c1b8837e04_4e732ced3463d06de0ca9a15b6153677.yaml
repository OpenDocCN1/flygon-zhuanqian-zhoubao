    role: origin
  excerpts:
  - 后来基本上不给流量了，就是因为有二十多天的空白期...基本上如果更新完整个 12 月份，这个号很容易成大号去变现。
  - 后来没有坚持做下去，主要原因是那个月我们工作室的人都阳了，导致那个月大家都集体罢工回家养病去了。
  - 发完之后，没流量，不要隐藏重新发...按照标准化，正常发，等 7-15 天，看整体数据
- 'no': 8
  name: 卖号变现ROI优于带货论 —— 怀旧粉‘卖身’比‘卖货’香
  points:
  - '**为什么需要这个概念？**'
  - '- 怀旧粉属‘泛娱乐/情怀’属性，购买意图弱、客单价低（辣条/玩具 9.9-29.9元）、退货率高，带货 ROI 极低'
  - '- 成品账号（万粉/垂直标签/高权重）有明确买家（MCN/品牌方/想入局新手），市场行价透明（800-1000元/万粉），变现确定性强'
  - '- 副业操盘手时间/精力有限，卖号可快速回笼现金流、验证模型、复投下一轮，现金流周期从‘月/季’缩短至‘周’'
  - '**核心定义**'
  - '- 卖号标准：粉丝≥1万、垂直度≥90%（均为怀旧内容）、近 10 条视频平均播放≥5000、无违规记录、绑定可解绑手机/邮箱'
  - '- 交易流程：平台（A5/鱼爪/私域群）挂单 → 买家验号（截图后台数据/直播验号） → 中介担保/分期付款 → 解绑实名/手机/邮箱 → 交接完成'
  - '- 定价锚点：万粉 800-1000 元；5 万粉 4000-5000 元；10 万粉 8000-12000 元（均为怀旧垂类行情）'
  - '**关键性质**'
  - '- 资产属性：账号是可交易的数字资产，生产周期 1-3 个月，ROI 可达 300%-500%（含人工/设备/流量成本）'
  - '- 确定性：带货受选品/客服/物流/退货不确定性影响大；卖号仅受账号数据影响，变现标准化'
  - '- 复利入口：卖号所得资金可直接投入下一批账号矩阵（买设备/买流量/雇人），滚动放大'
  - '**典型例子**'
  - '- 作者实战：团队主攻‘起号→养号→卖号’，单号周期 30-45 天，批量操作 5-10 号/轮，月现金流 5000-10000 元/人'
  - '- 评论区验证：网友‘豆豆’询价万粉行价，作者回复‘800-1000 左右’，印证市场流动性'
  - '**边界条件**'
  - '- 仅适用‘垂直标签强、粉丝画像清、无带货属性’的账号；若已挂小黄车/做过广告，账号商业价值重构，定价逻辑变'
  - '- 平台政策风险：微信官方禁止买卖账号，交易需走线下/私域担保，存在找回/封号纠纷风险，须签协议/分期付款规避'
  - '- 赛道天花板：怀旧赛道总盘子有限，万粉账号供给增多会压低行价，需持续开发新细分（如‘90后动画’/‘00后玩具’）维持溢价'
  sources:
  - paper: docs/202303/20230328_057.md
    role: origin
  excerpts:
  - 我们变现方式其实主要还是带货为主...其实更多的我们还是起号卖号了，这个变现效果比较明显
  - '卖号的话，万粉一般多价位呢 黄岛主 : 800-1000 左右'
  - 10.21 注册账号... 10.23 开始每天发布 2 个视频 前 2 条视频浏览量比较低...后面就基本都超过 500
  - 11.05 收到平台的原创发表任务... 11.13 成功完成任务，获得 1000 流量奖励，也是这个视频当天上万浏览量，现在有 4.5 万浏览量。
  - 11.20 共有三条视频上万，分别是 2.1 万，2.4 万和 4.5 万。 最终过 10W+起号成功~
