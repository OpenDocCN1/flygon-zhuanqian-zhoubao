life_analogy:
- 想象抖音AR特效师生态是一个**‘数字贴纸工厂+超级分销商场’**：
- '- **特效师** = 设计贴纸图案的**独立设计师**'
- '- **Effect Creator** = 将设计稿转印成标准贴纸的**印刷机**'
- '- **特效君APP** = 把贴纸上架到货架的**入驻申请单**'
- '- **抖音算法** = 根据顾客喜好把贴纸推到**显眼货架/热门专区**的**超级导购员**'
- '- **10人使用奖励** = 每卖出一张贴纸就有**底薪提成**'
- '- **明星带货** = **顶流网红**自带贴纸拍视频，粉丝疯狂模仿，**瞬间清空库存**'
- '- **AI绘画/照片建模** = **神笔马良/3D扫描仪**，不会画画、不会建模也能批量生产**独家款贴纸**'
- '- **技能组合护城河** = 别人只会**买现成贴纸卖**，你拥有**印刷机+神笔+扫描仪**，能**自主研发独家爆款**'
- 就像商场导购员会把热销贴纸摆在显眼处，抖音算法也会把高使用量特效推向全域流量池。
summary:
- concept: 抖音AR特效师生态
  desc: 以开放平台为基建，连接素材制作、工具合成、发布审核、流量分发与现金激励的完整商业闭环
- concept: Effect Creator工作流
  desc: 官方标准化合成导出工具链，是连接美术素材与上架发布的核心桥梁，保证兼容性与通过率
- concept: AI赋能特效素材生产
  desc: Midjourney生成2D素材+云端照片建模生成3D模型，大幅降低美术门槛与制作周期
- concept: AI多视角驱动照片建模
  desc: 用AI生成多视角一致性图片喂入照片建模管线，实现零建模基础产出独一无二3D资产的创新组合范式
- concept: 特效商业化指标体系
  desc: 10人使用触发奖励、上线几日达百元基础收益、头部万收益/百万使用量、赛事单项10万的阶梯量化标准
- concept: 明星/网红效应传播规律
  desc: KOL使用→粉丝模仿UGC爆发→进热门专区→获全域流量→使用量指数级增长→收益最大化的选品杠杆
- concept: 技能组合差异化竞争
  desc: 掌握AI绘画+照片建模+传统软件精修的复合栈，独创AI多视角驱动建模流程构建难以复制的护城河
- concept: Midjourney 2D生成7步法
  desc: 注册→选类型→选风格→图生图→补全提示词→调参迭代→导出入库的标准化素材管线操作规程
- concept: 照片建模/云端重建流程
  desc: 多角度采集→预处理→点云重建→表面重建→纹理映射→渲染优化→云端一键生成的标准化技术流程
- concept: 单特效基础收益验证
  desc: 作者实测：单特效上线几日即达3位数收益，验证长尾特效商业可行性
- concept: 云端照片建模工具可用性
  desc: 实测‘云端地球’：上传多角度照片即可云端自动生成模型，大幅降低本地算力与技术门槛
exercises:
- 'no': 1
  title: 设计一个可落地的特效选品方案
  contents:
  - 背景：你是一名零美术基础的新手特效师，拥有Midjourney会员与云端地球工具账号。
  - 任务：
  - 1. 选定一个近期热门的明星/网红热点或自带社交传播属性的主题（如情侣互动、心理测试、节日变装），说明选择理由。
  - 2. 设计该特效的核心视觉元素（2D贴纸/3D模型/动效），并规划用Midjourney生成2D素材的提示词关键词（风格/构图/元素）。
  - 3. 若涉及3D模型，描述如何用云端地球完成照片建模（拍摄要求/上传流程/预期产出）。
  - 4. 规划上架后的冷启动动作：如何在前72小时内达成‘10人使用’门槛触发基础奖励？
  - 5. 预估该特效的生命周期收益区间（基础奖励/长尾累积/进热门专区的上限），并标注关键不确定性变量。
  - 回答问题：
  - '- 如果该热点在24小时内退热，你的制作上架流程能否跟上？如何通过标准化SOP压缩周期？'
  - '- 同质化竞争下，你的‘技能组合’（AI+建模+精修）体现在哪个环节形成了差异化壁垒？'
- 'no': 2
  title: 复刻‘AI多视角驱动照片建模’组合流程最小验证
  contents:
  - 目标：验证‘Midjourney生成多视角图→喂入照片建模→得独一无二3D模型’的技术可行性与效率。
  - 步骤：
  - 1. 选定一个简单几何/卡通风格对象（如‘Q版机器人’‘几何水晶’），用Midjourney通过提示词控制生成前/后/左/右/俯/仰 6 视角图，要求风格一致、特征固定。
  - 2. 将6张图上传至云端地球（或同类照片建模工具），观察重建成功率、模型完整度、纹理贴图质量、几何错误（如伪影/漏面）。
  - 3. 对比：同一对象用传统手工建模（Blender/C4D基础操作）耗时 vs 组合流程耗时。
  - 4. 将重建模型导入Effect Creator，挂载简单动效（旋转/缩放），导出测试包在特效君APP预览，检查是否符合发布规范。
  - 记录指标：
  - '- Midjourney出图成功率（几轮得到可用6视角）'
  - '- 照片建模重建成功/失败及失败原因'
  - '- 端到端总耗时'
  - '- 最终模型在Effect Creator中的表现（面数/贴图/动效兼容性）'
  - 回答问题：
  - '- AI生成多视角一致性控制（角色特征漂移/光影不一致）是否为主要瓶颈？如何用ControlNet/参考图缓解？'
  - '- 该组合流程对比外包建模（淘宝/自由职业者）在成本/周期/版权/迭代灵活性上优劣如何？'
- 'no': 3
  title: 构建个人特效师‘技能组合护城河’进阶路线图
  contents:
  - 现状：你已跑通1-2个特效上架变现基础流程，月收益几百元，主要靠蹭热点单一品类。
  - 任务：设计未来6个月的技能迭代与作品集建设计划，目标是构建‘难以复制的差异化竞争优势’。
  - 1. 技能矩阵自查：在 PS/AE/C4D精修、Midjourney/SD可控生成、照片建模/NeRF/3DGS重建、Effect Creator交互逻辑配置
    四维度打分（1-10分），标注短板。
  - 2. 定制学习冲刺：每月攻克一个短板工具/技术点，输出1个‘技术验证型特效’（非上架，仅验证技术点），积累可复用组件库。
  - 3. 组合创新专项：第3个月起，尝试‘AI多视角+照片建模’或‘SD ControlNet控制动效序列帧’等组合流程，产出1-2个‘独家技术路线特效’上架。
  - 4. 选品策略升级：从‘纯蹭明星热点’转向‘自带社交传播属性的长尾系列’（如：一套‘情绪化表达’系列/‘职业身份梗’系列），建立个人IP标签。
  - 5. 数据复盘仪表盘：建立表格追踪每个特效的‘投产比=（累计收益）/（制作耗时+推广成本）’，识别高ROI技术路线与选品方向。
  - 回答问题：
  - '- 哪个技能维度的边际收益递减最快？为何？'
  - '- 如何判断某个‘组合技术路线’是否真正形成了护城河，而非‘伪创新’？'
  - '- 当平台推出官方AI生成工具（如抖音自研文生特效），你的护城河会如何迁移/进化？'
