- │   ├── 步骤1：工具采集拆解（后羿采101标题+灰豚挖热词/对标）
- │   ├── 步骤2：账号画像复盘（反推粉丝偏好/定核心赛道）
- │   ├── 步骤3：三线筛选选题（近30/7天+热点节点+低粉素人对标）
- │   ├── 步骤4：内容标准化生产（关键词3次布局+长尾标签组合+评论钩子）
