    role: origin
  excerpts:
  - 把笔记涵盖热词在文案中提上 3 遍，这样做主要是为了获得搜索流量。
  - 关键词在内容、标题、小文案三部分加起来至少提及三次。
  - 笔记涵盖的热词在标题、文案、图片内容中，提到不少于三次，更能获得搜索流量
