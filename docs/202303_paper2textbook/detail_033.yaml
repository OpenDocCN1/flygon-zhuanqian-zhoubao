- │   ├── 自我参照效应选题定律 —— P002
- │   ├── 爆文生产 = 数据工具降维打击 + 认知拆解重组 —— P001
- │   ├── 精准流量 > 泛流量，搜索流量 > 推荐流量 —— P002
- │   ├── 账号权重与标签体量需适配（长尾起号定律） —— P003
- │   └── 互动权重排序：评论 > 收藏 > 赞 —— P004
- ├── 标准化操作方法
- │   ├── 爆款标题三要素拆解重组法（主体+事件+强调点） —— P001
- │   ├── 账号历史粉丝画像复盘（激活首传播层） —— P001
- │   ├── 三线选题筛选模型（时间线/事件线/对标线） —— P001
- │   ├── 关键词三次高频布局原则（标题/正文/图片≥3次） —— P001
- │   ├── 长尾标签冷启动策略（大标签定垂直+小标签抢收录） —— P001
- │   ├── 赞藏比/阅赞比双指标爆款预判体系（2:1.4 / 6-8:1） —— P001
- │   └── 评论区主动运营引导法（文案引导+号主回复+置顶优质） —— P002
- ├── 工具链与数据源
- │   ├── 后羿采集器（标题/数据批量采集→Excel/飞书表格清洗） —— P001
