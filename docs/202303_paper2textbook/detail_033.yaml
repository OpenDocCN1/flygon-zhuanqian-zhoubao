- 'no': 6
  name: 赞藏比与阅赞比双指标爆款预判体系 —— 用数据提前“预知”爆款
  points:
  - '**为什么需要这个概念？**'
  - '- 发布后不知好坏，等数据出来再改已错过黄金推流期'
  - '- 需要实时监控的“先行指标”，在发布早期（前 1-3 小时）预判爆款潜力'
  - '- 将主观“觉得这篇会火”量化为客观可验证的数学阈值'
  - '**核心定义**'
  - '- 赞藏比 ≥ 2 : 1.4 → 判定万赞稳定性（收藏权重高=实用价值强=持续推流）'
  - '- 阅赞比（小眼睛/点赞）6-8 : 1 → 判定超级爆款潜力（普通高赞约 10:1）'
  - '- 评论权重最高（评论 > 收藏 > 赞），需主动运营评论区撬动流量池层级'
  - '**关键性质**'
  - '- 赞藏比反映“实用价值/留存意愿”，决定推流持久度'
  - '- 阅赞比反映“点击转化率/内容吸引力”，决定爆发上限'
  - '- 评论区运营（引导提问/号主回复/置顶优质评论）是提升权重的最高杠杆'
  - '**典型例子**'
  - '- 万赞笔记赞藏比稳定在 2:1.4 以上，持续获得推荐流量'
  - '- 超级爆款阅赞比达 6:1 甚至更低，说明极强的“标题/封面-内容”转化力'
  - '**边界条件**'
  - '- 仅适用于教育/知识/干货类赛道，娱乐/颜值/情感赛道指标体系不同'
  - '- 新号前几篇笔记数据基数小，指标波动大，需积累 10+ 篇样本后再参考'
  - '- 指标异常（如赞高藏低、阅高赞低）需结合内容形式具体诊断，不可死套公式'
  - '...'
  sources:
  - paper: docs/202303/20230328_068.md
    role: origin
  excerpts:
  - 从赞藏来看，一篇笔记能够到 2：1.4 以上，万赞就会很稳定，会有持续不断的推荐。
  - 从小眼睛和点赞来看，普通的高赞回答，小眼睛和点赞比例在 10：1，但是超级爆款比例 6-8:1。
  - 对于教育学习领域来说，赞和藏，更像是一个情绪价值和一个实用价值的区分。
  - 按照小红书的权重来算，评论＞收藏＞赞，因此还要做的一件事就是：一定要在文案和内容中，引导读者评论，同时号主，也要在评论区多评论，多互动。
- 'no': 7
  name: 长尾标签冷启动策略 —— 新号避开“红海”抢“蓝海”
  points:
  - '**为什么需要这个概念？**'
  - '- 新号/低权重号蹭大标签（如#大学生 1亿+关注）极难被收录，流量归零'
  - '- 大标签竞争激烈，算法优先分发高权重账号，新号无胜算'
  - '- 长尾小标签竞争弱、垂直度高、易收录，是新号冷启动的“隐形入口”'
  - '**核心定义**'
  - '- 大标签定垂直领域（如#大学生），小标签抢收录入口（如#大一新生避坑指南/#高数期末复习）'
  - '- 优先选择“关注人数少但垂直度高、与内容强相关”的长尾标签组合（3-5个）'
  - '- 待笔记被小标签收录、获取初始精准流量、权重上涨后，再逐步争取大标签收录'
  - '**关键性质**'
  - '- 小标签收录门槛低，易触发“标签页推荐”+“搜索流量”双重曝光'
  - '- 长尾标签用户意图极强（搜#高数期末复习的必是要考高数的大一/大二），精准度极高'
  - '- 标签体系是小红书内容分发的底层骨架，运营标签即运营流量分发逻辑'
  - '**典型例子**'
  - '- 新号发“英语四级”笔记，不加#大学英语四级（大标签），改加#英语四级裸考逆袭 #大二英语四级备考 #四级听力提分技巧（长尾标签），快速被收录获赞'
  - '**边界条件**'
  - '- 标签必须与内容强相关，挂无关热门标签会被判定违规/低质'
  - '- 单篇笔记标签数建议 3-5 个（1个大标签定赛道 + 2-4个长尾标签抢流量）'
  - '- 账号权重提升后，需主动“换大标签”，否则长期困在长尾流量池无法破圈'
  - '...'
  sources:
  - paper: docs/202303/20230328_068.md
    role: origin
  excerpts:
  - 新号权重低，笔记不容易被大的标签收录。但我们可以把它做的更好：如果选择小标签，就更容易被收录，收录后就会推荐给关注该标签的人以及获取到搜索流量
  - 大标签定垂直领域，小标签更加精准易被收录，再加上好的选题和内容，就能够获得到更多的流量。
  - 由此联想到了知乎，在知乎写回答如果是一个新号，就不建议回答关注人数上万的问题
