paper: docs/202303/20230328_131.md
desc: 该素材是一篇面向对 AIGC 浪潮感到焦虑但不知如何切入的普通人的实操指南，核心主张是通过结合自身工作痛点‘先用起来’，将 AI 降维为生产力工具，并展示了从单点需求（AI
  生成课件）衍生出工具开发、服务外包、教程变现三大商业路径，最终通过付费/免费流量实现商业闭环的完整方法论。
concepts:
- name: AI 焦虑与搭车困境
  desc: 指个体在重大技术浪潮（如 AIGC）来临时，因认知不足或缺乏切入点，面对巨大机遇却无法参与而产生的心理焦虑状态。
  is_original: false
  excerpt:
  - 面对 AIGC 这一波浪潮，很多人都有点焦虑：面对宝山，却无处下啃！
  - 一方面为无数钱途兴奋；另一方面却为自己无法搭上车而感到深深地焦虑。
- name: 人机分工本质：人定‘做什么’，AI 负责‘怎么做’
  desc: 核心协作范式，主张人类的核心优势在于需求定义、意图判断和业务决策（做什么），而 AI 仅作为执行工具负责具体实现路径（怎么做）。
  is_original: true
  excerpt:
  - 不要和 AI 拼怎么做，我们（人）的优势在于：做什么。理解了这一点，AI 再厉害也只能是你的工具。
- name: Prompt 护城河
  desc: 指在特定垂直场景下，通过大量实战迭代打磨出的高质量提示词，能显著提升 AI 输出质量，从而形成个人或团队的核心竞争壁垒。
  is_original: true
  excerpt:
  - GPT 提示词 prompt 是大有学问的，好的 prompt 和差的 prompt 的成果天壤之别，这个 prompt 就是你的壁垒，护城河！这个 prompt
    是熟能生巧的东西！
- name: 需求模板化
  desc: 指在服务外包模式中，通过与客户多次迭代沟通，将模糊需求标准化为结构化、可复用的需求模板，以提升 AI 协作效率和交付质量。
  is_original: true
  excerpt:
  - 怎么跟你客户确定需求（多次迭代打磨出最优最简洁的需求模板）
- name: 保姆级教程变现
  desc: 将个人学习使用 AI 解决特定问题的全过程，制作成高颗粒度、低门槛的图文/视频教程进行知识付费变现的模式。
  is_original: false
  excerpt:
  - 你把你学习用 AI 做课件的整个过程，做成一个保姆级的教程（就是那种很多截图，每一步都详详细细的），然后你卖教程！
- name: 私域成交闭环
  desc: 通过公域平台内容引流（留钩子），将潜在客户导入私域流量池（微信等），完成信任建立与最终交易转化的标准商业流程。
  is_original: false
  excerpt:
  - 这些内容都留下钩子……把客户引入私域——成交！
methods:
- name: __overview__
  desc: ‘痛点切入-工具内化-路径裂变-流量闭环’四阶段实操方法论：从自身真实工作痛点出发，先实现 AI 工具落地；内化为个人核心技能；裂变为工具/服务/教程三大变现路径；最后通过公私域流量运营实现商业变现。
  excerpt:
  - 我的建议是：结合你的实际工作需求，把这个 AI 工具先用起来！
  - 你自己学会怎么做，等你能顺利使用 AI 做课件的时候，'AI 辅助生成课件'这个能力至少有三个变现的途径……
  - 找流量有两种方式：1、付费买流量…… 2、为各个流量平台做内容，免费引流……把客户引入私域——成交！
- name: 痛点驱动的 AI 接入法
  desc: 拒绝泛泛学习，强制绑定具体高频痛点场景（如老师做课件），倒逼自己在实战中掌握 AI 用法，实现‘学以致用’的冷启动。
  excerpt:
  - 结合你的实际工作需求，把这个 AI 工具先用起来！
  - 我问他：你现在最希望 AI 能帮你做什么？他说 AI 能帮做课件……那这个需求就是'AI 辅助生成课件'。那我就建议他：那你先用 AI 帮你做课件。
- name: 单技能三维变现裂变法
  desc: 针对掌握的单一 AI 技能（如生成课件），系统性拆解为：SaaS 工具开发（技术门槛低，解决‘不会用’人群）、Prompt 服务外包（劳动密集型，核心靠
    Prompt 与需求模板）、知识付费教程（经验沉淀，边际成本零）三条并行路径。
  excerpt:
  - 1、你开发一个工具，‘AI 辅助生成课件’的工具……
  - 2、如果你觉得无法做出一个工具，那么你就自己帮别人做课件啊……
  - 3、你把你学习用 AI 做课件的整个过程，做成一个保姆级的教程……然后你卖教程！
- name: 双轨流量获客体系
  desc: 构建付费广告（竞价/信息流）与免费内容营销（短视频/图文/问答）双引擎，核心策略是内容留‘钩子’（制造认知缺口）引导至私域完成高客单价转化。
  excerpt:
  - 找流量有两种方式：1、付费买流量…… 2、为各个流量平台做内容，免费引流……
  - 这些内容都留下钩子（比如省略步骤，让人‘一看就会一学就废’的那种，人家有需求但看不懂自然来找你），把客户引入私域——成交！
theorems:
- name: AIGC 红利捕获核心定律：工具平权下，变现关键在于‘场景定义’与‘流量运营’而非技术本身
  desc: AI 技术门槛快速下降（平权），普通人无法在模型层竞争，红利窗口期属于能发现具体场景、定义标准化需求、并懂得获客变现的人。
  excerpt:
  - 经过这么一折腾，当你真的做成生意的时候，突然发现天地一片宽，真的是无物不可卖啊，AI 嘛也就是一个工具而已……
  - 不要和 AI 拼怎么做，我们（人）的优势在于：做什么。
- name: 认知差即商机定律：‘你不会注册 ChatGPT，但我会’ 就是可变现的服务门槛
  desc: 在技术普及早期，认知门槛（注册、基础用法、Prompt 技巧）本身就是服务的核心价值来源，无需等待技术成熟即可变现。
  excerpt:
  - 他问：大家都会用 chatgpt 了，会有人用吗？我就问他：你不学你会用吗？现在还无数人连注册 chatgpt 都还搞不定。
- name: Prompt 即核心资产定律：垂直领域的高质量 Prompt 是不可复制的护城河
  desc: 通用大模型能力同质化，垂直场景下的 Prompt 工程结合领域经验，构成了个人/小团队最核心的护城河，且具有‘熟能生巧’的经验积累特性。
  excerpt:
  - 好的 prompt 和差的 prompt 的成果天壤之别，这个 prompt 就是你的壁垒，护城河！这个 prompt 是熟能生巧的东西！
findings:
- name: 老师做课件场景的 AI 落地验证
  desc: '[evidence] 作者朋友（教师）真实痛点验证：AI 介入前做课件耗时久、质量差、形成拖延症；接入 AI 后可实现单日产出从 1 份提升至 20
    份，效率提升 20 倍，且解决了情绪内耗问题。'
  excerpt:
  - 他说 AI 能帮做课件（每次为这个东西耗费无数时间还做不好，都形成拖延症了，严重影响情绪）。
  - 以前没有 AI 辅助，也许你一天顶多能做一个课件，现在有了 AI 一天能做 20 个！
- name: ChatGPT 注册门槛的市场存量验证
  desc: '[evidence] 作者通过反问朋友‘你不学你会用吗？现在还无数人连注册 chatgpt 都还搞不定’，佐证了早期技术普及阶段，基础操作门槛（注册、网络环境）构成了巨大的‘不会用’人群，验证了工具/服务/教程的市场需求真实存在。'
  excerpt:
  - 我问他：你不学你会用吗？现在还无数人连注册 chatgpt 都还搞不定。
- name: 内容营销‘钩子设计’的转化机制验证
  desc: '[claim] 作者宣称通过‘省略步骤，让人一看就会一学就废’的内容设计，能精准筛选有需求但无能力执行的高意向客户，引入私域成交率极高。'
  excerpt:
  - 这些内容都留下钩子（比如省略步骤，让人‘一看就会一学就废’的那种，人家有需求但看不懂自然来找你），把客户引入私域——成交！
