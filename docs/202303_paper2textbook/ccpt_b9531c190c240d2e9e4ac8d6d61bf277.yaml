paper: docs/202303/20230328_011.md
desc: 该素材通过作者亦仁七年坚持运营社群的亲身经历，引用航海家俱乐部成员李晨的核心金句，阐述了“长期主义”与“坚持即稀缺”的核心观点：真正的关注与认可源于长时间跨度后的持续存在，而非初期的曝光；同时反思“机会主义”频繁切换赛道只能获得短期利益，无法形成沉淀与积累，并以自身追随某博主多年未断更为例，佐证该法则对个人成长同样适用。
concepts:
- name: 坚持即稀缺/时间复利效应
  desc: 指个体或组织在特定赛道长期持续投入、拒绝频繁切换，从而积累深度信任、品牌资产与不可复制的竞争壁垒的现象。素材中将其表述为“发现过了这么久你居然还在那里”，强调时间维度是验证价值的核心变量。
  is_original: false
  excerpt:
  - “人们真正注意到你的时候，不是第一眼看到你站在那里，而是发现过了这么久你居然还在那里。”
  - 做了社群这种不能轻易撂挑子的事，连续七年，从被逼着要去专注，到主动选择去专注...结果大概率是不停的切换下一个，除了快速赚到一些钱，没有沉淀和积累
- name: 机会主义陷阱
  desc: 指个体因过度敏锐于外部机会、缺乏定力而频繁切换业务赛道的行为模式。素材指出此模式虽能‘快速赚到一些钱’，但导致‘没有沉淀和积累’，陷入‘不停的找新项目’的负向循环。
  is_original: false
  excerpt:
  - 以我对机会的追逐能力和兴趣，很可能每个月都会看到更好的机会并投入进去，结果大概率是不停的切换下一个，除了快速赚到一些钱，没有沉淀和积累，然后继续不停的找新项目。
- name: 被动专注向主动专注的转化
  desc: 描述创业者/经营者心理演变的阶段：初期因业务性质（如社群‘不能轻易撂挑子’）被迫坚持（被动专注），后因看到长期价值而内化为主动选择的战略定力（主动专注）。
  is_original: true
  excerpt:
  - 连续七年，从被逼着要去专注，到主动选择去专注
methods:
- name: __overview__
  desc: 素材采用“核心金句提炼 + 创始人自传式反思 + 同类案例印证”三层结构的说服方法论：先抛出高认知密度的金句建立主题，再用自身七年社群经营的得失对比（反面教材：机会主义
    vs 正面教材：长期主义）展开论证，最后引入个人作为用户视角的追随案例形成闭环。
  excerpt:
  - '其中 说了一句：

    “人们真正注意到你的时候，不是第一眼看到你站在那里，而是发现过了这么久你居然还在那里。”'
  - 我觉得很庆幸的是，做了社群这种不能轻易撂挑子的事，连续七年...
  - 想到自己一件小事，19 年更新了一个星球...星球还没断更，现在想想也难得
theorems:
- name: 注意力获取的时间门槛定律
  desc: 核心主张：外界对个体/品牌的真实高质量关注（注意力），存在一个时间门槛，仅在持续存在时间超出外界预期（‘过了这么久’）且状态未中断（‘居然还在那里’）时才会被触发。初期曝光仅是噪音，长期存续才是信号。
  excerpt:
  - “人们真正注意到你的时候，不是第一眼看到你站在那里，而是发现过了这么久你居然还在那里。”
- name: 长期主义优于机会主义的积累论断言
  desc: 核心主张：在不确定性高的商业环境中，选择单一赛道深耕（长期主义）形成的‘沉淀和积累’，其长期复利价值显著高于凭借敏锐度频繁捕捉风口切换赛道（机会主义）所得的短期现金流总和。
  excerpt:
  - 结果大概率是不停的切换下一个，除了快速赚到一些钱，没有沉淀和积累，然后继续不停的找新项目。
- name: 业务模式决定专注可行性
  desc: 核心主张：业务模式的特性（如社群‘不能轻易撂挑子’的高退出成本/高信任维护成本）会客观倒逼经营者形成长期主义行为，即‘赛道自选人’，而非单纯依赖创始人意志力。
  excerpt:
  - 做了社群这种不能轻易撂挑子的事，连续七年，从被逼着要去专注，到主动选择去专注
findings:
- name: 金句引发的强共鸣现象
  desc: '[evidence] 评论区用户（大灰狼、MAGGIE✞、鱼、唐杰、陈真、繁星、Roy、书情小跟班）集体表达强烈情感共鸣，其中用户Roy自述‘辞职创业这么多年一直不被人理解...希望今年能开花结果’，印证该金句精准击中长期主义践行者的心理痛点与确定性需求。'
  excerpt:
  - '评论区：

    大灰狼 : 确实如此

    MAGGIE✞ : 学习了👍

    鱼 : 必须点赞👍

    唐杰(Jason) : 这句话真好，也送给我自己

    陈真 : 感悟三连

    繁星 : 善变是人的天性。要做有积累的事

    Roy : 李晨说的这句话看了特别想哭，辞职创业这么多年一直不被人理解，被家里人排挤受尽嘲讽白眼。希望今年能开花结果，对得起自己这些年的不甘心

    书情小跟班 : 挺有感触...'
  - '其中 说了一句：

    “人们真正注意到你的时候，不是第一眼看到你站在那里，而是发现过了这么久你居然还在那里。”'
- name: 用户侧长期主义践行的自我验证案例
  desc: '[evidence] 作者自身作为用户，持续关注某博主从19年至今（跨度约4年），公众号‘几乎每天都看’，星球‘一路更新’且‘还没断更’，亲身验证了‘居然还在那里’对粉丝信任形成的决定性作用，形成‘星球内容不是我原创就复制粘贴...一路跟随’的高粘性关系。'
  excerpt:
  - '想到自己一件小事，19 年更新了一个星球，星球内容不是我原创就复制粘贴，那位博主在我低谷给了我指导，一路跟随，他的公众号文章几乎每天都看，星球也一路更新。

    “人们真正注意到你的时候，不是第一眼看到你站在那里，而是发现过了这么久你居然还在那里。”这句话也适用自己吧。星球还没断更，现在想想也难得'
- name: 社群业务七年存续的存量事实
  desc: '[evidence] 作者主导的社群业务已连续运营七年，且实现了从‘被逼着专注’到‘主动选择专注’的心理与战略转型，存活下来并形成了作者引以为傲的核心资产，佐证了‘不能轻易撂挑子’的业务模式对长期主义的正向强化作用。'
  excerpt:
  - 我觉得很庆幸的是，做了社群这种不能轻易撂挑子的事，连续七年，从被逼着要去专注，到主动选择去专注
