paper: docs/202303/20230328_153.md
desc: 该素材为一篇线下门店运营实战经验分享文章，作者通过自身两次选址失败的教训（选址错误、选址正确但客户不进店），引出核心痛点：好地址不等于好生意，门店转化才是关键。文中引用飞书文档详细拆解了“激发兴趣、转化信任、促成下单”的提升门店转化全流程方法论。
concepts:
- name: 选址定终身
  desc: 行业通俗法则，指门店选址决定业务成败的核心地位，素材中作为背景认知被引用并进一步被挑战。
  is_original: false
  excerpt:
  - 都说线下门店选址定终身
- name: 好地址≠好生意
  desc: 作者基于实战总结的核心认知反转：重金买到好位置（好地址）并不自动带来客流进店（好生意），需通过运营手段解决进店转化。
  is_original: true
  excerpt:
  - 重金砸下去买了一个好位置，但客户就是不进店
  - 二亏选址选好了，但客户愣是不进店
- name: 门店转化闭环
  desc: 素材核心拆解对象，指从路人看到门店、产生兴趣、建立信任、最终进店下单的完整转化路径。
  is_original: true
  excerpt:
  - 帮助大伙看到一些【提升门店转化】的拆解
  - 激发兴趣转化信任，立刻下单
methods:
- name: __overview__
  desc: 提升门店转化的三阶段实战方法论：通过外部形象激发兴趣、通过体验/沟通转化信任、通过促单动作达成下单，形成完整进店转化链路。
  excerpt:
  - 激发兴趣转化信任，立刻下单
  - 帮助大伙看到一些【提升门店转化】的拆解
theorems:
- name: 选址只是入场券，转化才是赢利点
  desc: 核心主张：选址解决的是‘被看见’的概率问题（流量入口），而非‘被购买’的确定性问题；门店盈利的关键杠杆在于对进店率、转化率的精细化运营。
  excerpt:
  - 重金砸下去买了一个好位置，但客户就是不进店，咋办？
  - 我自己就曾经吃了两大亏：一亏选址选错了；二亏选址选好了，但客户愣是不进店
findings:
- name: 作者双重选址失败实证案例
  desc: '[evidence] 作者亲历两次创业亏损验证了‘好地址不等于自动进店’：第一亏选址错误导致无流量；第二亏选址正确（好位置）但因缺乏转化手段导致客流不进店，直接证明选址与经营是两套独立能力体系。'
  excerpt:
  - 我自己就曾经吃了两大亏：一亏选址选错了，哭；二亏选址选好了，但客户愣是不进店，再哭。
- name: 飞书文档拆解转化全流程
  desc: '[claim] 原文宣称飞书文档中包含‘激发兴趣转化信任，立刻下单’的完整拆解方法论，可作为门店提升转化的实操指南。'
  excerpt:
  - https://h24wtd3rug.feishu.cn/docx/QdPkd1IM2orhqFxaAXCcM6fynsc?from=from_copylink
  - 激发兴趣转化信任，立刻下单学到了
