units:
- 'no': 1
  name: 知乎好物自动化闭环 —— 让AI当实习生、RPA当搬运工、人工做质检
  points:
  - '**为什么需要这个概念？**'
  - '- 知乎好物推荐的核心瓶颈在于内容创作产能，每一篇回答都是一次曝光机会，人力写作效率低、难持续'
  - '- 纯人工模式下想规模化极难，必须引入自动化手段解决“写什么”、“怎么写”、“去哪发”、“点哪里”的全流程问题'
  - '- 完全自动化发布极易触发平台风控封号，需要人工把关质量与合规，形成“AI生成+RPA执行+人工兜底”铁三角'
  - '**核心定义**'
  - '- 最小可行性自动化商业循环：选题入草稿箱 → RPA调用ChatGPT批量生成草稿 → 人工复核润色发布 → 产生收益'
  - '- 三大分工：ChatGPT解决脑力问题（内容生成）、RPA解决体力问题（流程自动化）、人工解决质量问题（事实核查与风控）'
  - '**关键性质**'
  - '- 半自动化而非全自动：RPA停留在“发布前确认态”，不直接提交，保留人工最后一道关卡'
  - '- 草稿箱作为缓冲池：人工预筛选适合AI回答的问题存入，规避AI幻觉导致的低质内容污染账号'
  - '- 规模化前提：大力出奇迹，单条内容边际收益低，唯有批量堆量才能累积流量变现'
  - '**典型例子**'
  - '- 程序员“大胡子”副业实操：账号仅8级、2000粉，3月通过该闭环跑通变现，晒出收益截图验证'
  - '- 红酒/啤酒垂类：利用ChatGPT生成品牌清单、单品深度挖掘、吸睛标题开头，配合固定营销尾巴引流至爆款文章'
  - '**边界条件**'
  - '- 必须具备垂直领域知识甄别AI幻觉：外文品牌翻译、具体奖项易瞎编，不懂行无法驾驭'
  - '- 网络环境要求：RPA工具（如Automa）依赖浏览器插件商店，需科学上网才能安装使用'
  - '- 非暴富捷径：仅能满足副业确定性收益需求，无法带来指数级爆富'
  - '...'
  sources:
  - paper: docs/202303/20230328_123.md
    role: origin
  - paper: docs/202303/GhbsdeUAeo0lWdxwqcecdwx0nuh.md
    role: improve
  excerpts:
  - 我的做法是：挑选出自己觉得适合 chatgpt 回答的问题，存到草稿箱，然后 rpa 机器人自己挨个去回答即可，当然 rpa 机器人不会真正的提交，还是需要人工再次确认，加以润色才能发表。
  - 其实知乎好物的瓶颈就是创作，大力出奇迹，每一篇文章或回答接触用户就是一次曝光机会。
  - 如果说chatgpt是解决脑力问题，那么RPA就是解决劳动力的实际操作问题
  - 目前发现chatgpt推荐好物，问它中国的品牌，回答的会比较清楚，但国外品牌就有很多回答不了，特别是翻译的中文品牌名经常搞错。
  - 参考同行爆款文章，然后拿过来让chatgpt帮你改写。改写之后基本逻辑都正确了，而且避免了抄袭。
  - 下面是 3 月份收益 ![](img/a3fc07dfa637ece9e61e808cdde664e4.png) ![](img/6561b695e1c1429ba1ae1bd99ea69295.png)
- 'no': 2
  name: 间接引流式回答 —— 用泛流量蓄水池浇灌爆款转化池
  points:
  - '**为什么需要这个概念？**'
  - '- 直接发好物文章竞争大、对账号权重要求高、转化路径长'
  - '- 高流量泛问题竞争小、易获曝光，但购物意图弱，直接带货转化差'
  - '- 需要一种低成本“流量漏斗”：用AI批量占领长尾入口，再导流至高转化核心内容'
  - '**核心定义**'
  - '- 标准化结构：[ChatGPT生成泛知识回答正文] + [固定营销尾巴（引流文案+目标文章链接)]'
  - '- 核心逻辑：泛流量回答做“蓄水池”，爆款好物文做“转化池”，中间用固定尾巴连通'
  - '**关键性质**'
  - '- 流量分级利用：不追求单条回答直接带货，追求全链路流量归因与转化最大化'
  - '- 批量化优势：单条泛回答成本极低，可大规模铺设长尾关键词构建流量护城河'
  - '- 用户群体同源性：回答泛问题的用户画像与目标好物文章读高度重合，导流精准'
  - '**典型例子**'
  - '- 回答“啤酒怎么选”、“红酒醒酒器有必要买吗”等泛问题，文末挂载《双十一囤酒清单》爆款文章链接'
  - '- 固定尾巴话术：“整理了份避坑指南/选品清单，点击查看全文”'
  - '**边界条件**'
  - '- 尾巴不能太硬广：需包装成“资料分享/避坑指南”等利他形式，否则易被平台判定引流违规'
  - '- 目标爆款文章必须真材实料：引流来的用户若发现内容空泛，信任瞬间崩塌，后续不复点击'
  - '- 仅适用于内容型平台（知乎/小红书/公众号），不适用于纯货架电商（淘宝/拼多多/抖音小店）'
  - '...'
  sources:
  - paper: docs/202303/GhbsdeUAeo0lWdxwqcecdwx0nuh.md
    role: origin
  excerpts:
  - 那就是通过chatgpt回答一些高流量的泛回答，此类回答一般竞争较小，但购物意愿度一般...写此类回答的目的当然也是为了引流...引流到我的爆款好物推荐文章
  - chatgpt的回答+固定尾巴（文案+链接）
  - 看下面这个回答就能一目了然
- 'no': 3
  name: 好物清单分级生成Prompt —— 从宽泛筛选到单品深挖再到结构化成文
  points:
  - '**为什么需要这个概念？**'
  - '- 一次性让AI写完整推荐文，幻觉率高、逻辑散、卖点不准，不可用'
  - '- 需要将复杂创作任务拆解为可验证、可迭代的原子步骤，逐层把控质量'
  - '- 不同层级Prompt对AI能力要求不同：列表类易、事实类难、文案类中'
  - '**核心定义**'
  - '- 三层递进策略：'
  - '  1. 宽泛清单生成：让AI列品牌池（注意：中文品牌准、外文品牌易翻车，需人工甄别）'
  - '  2. 单品深度挖掘：针对单一产品追问特色、奖项、核心卖点、差异化理由，修正幻觉'
  - '  3. 结构化成文辅助：生成吸睛标题、高转化开头、全文大纲框架，最后由人工组装润色'
  - '**关键性质**'
  - '- 人工介入点前置：在清单阶段就要用领域知识筛掉外文品牌错误，防止错误放大'
  - '- Prompt颗粒度越细，输出可控性越强：问“范佳乐获得过几次奖项”比问“写推荐理由”准得多'
  - '- 复用性高：同一垂类下，这套Prompt模板可复用于不同SKU，边际成本趋近零'
  - '**典型例子**'
  - '- 啤酒垂类实操：先问“国内精酿啤酒品牌有哪些”→ 再问“范佳乐白啤特色/奖项/卖点”→ 最后问“给啤酒文章写吸睛开头/全文框架”'
  - '- 提问词库积累：介绍特色、查奖项、写开头、写全文、优化标题，形成标准化提问清单'
  - '**边界条件**'
  - '- 无法替代人工实测体验：AI只能复述公开信息，无法给出真实口感/使用感受，深度评测仍需人工'
  - '- 外文品牌/冷门品类幻觉率极高：非核心标品类目建议人工主导、AI辅助，不可反向依赖'
  - '- 平台算法偏好真实体验：纯AI生成无实拍图/无真实细节的内容，权重通常低于实测内容'
  - '...'
  sources:
  - paper: docs/202303/GhbsdeUAeo0lWdxwqcecdwx0nuh.md
    role: origin
  excerpts:
  - 目前发现chatgpt推荐好物，问它中国的品牌，回答的会比较清楚，但国外品牌就有很多回答不了，特别是翻译的中文品牌名经常搞错。
  - 由于上述清单中，可能有一些回答的很笼统，于是我们需要细化或强化推荐理由，那么我们可以单独问chatgpt该品牌
  - 我们再看下，让它给刚才的啤酒文章写一个非常具有吸引力的开头
  - 以下是我用过的一些特色推荐理由的提问词：1、介绍一下范佳乐白啤的特色 2、范佳乐白啤获得过几次奖项... 3、给啤酒文章写一个非常具有吸引力的开头 4、写一篇推荐啤酒的文章...
- 'no': 4
  name: 竞品爆款改写法 —— 低成本规避查重的内容复用手段
  points:
  - '**为什么需要这个概念？**'
  - '- 新手不会写Prompt、没有素材库、不懂选题，面对空白编辑器无从下手'
  - '- 同领域已有爆款文章证明了选题、结构、卖点的市场有效性，直接复用成功要素概率最高'
  - '- 直接搬运会被判重限流，需要“洗稿”但保留核心逻辑的技术手段'
  - '**核心定义**'
  - '- 输入：同行爆款文章全文/片段 → 指令：帮我改写/重写/优化 → 输出：逻辑正确、非抄袭的新文案'
  - '- 无需复杂Prompt工程，利用大模型强语义理解与重组能力，一键完成去重与逻辑重构'
  - '**关键性质**'
  - '- 门槛极低：不会写Prompt也能用，只需会复制粘贴发送“帮我改写”'
  - '- 保留核心卖点：改写非原创，是对已验证成功结构的“借壳生子”，转化率基线有保障'
  - '- 规避查重实测有效：作者实测改写后通过平台原创性检测，未判定抄袭'
  - '**典型例子**'
  - '- 作者将自己旧文输入ChatGPT改写，生成新文案，逻辑通顺、核心卖点保留，晒图验证'
  - '- 可批量操作：采集竞品Top50爆款标题+正文，循环改写，快速填充内容库'
  - '**边界条件**'
  - '- 仅适用于“知识/经验/推荐”类软文，不适用于强时效性新闻、强专业性技术文档、强个人IP色彩内容'
  - '- 核心数据/具体案例/个人真实经历无法通过改写获得，必须人工注入'
  - '- 长期依赖改写会导致账号内容同质化，缺乏差异化人设，需配比原创内容维护账号调性'
  - '...'
  sources:
  - paper: docs/202303/GhbsdeUAeo0lWdxwqcecdwx0nuh.md
    role: origin
  excerpts:
  - 参考同行爆款文章，然后拿过来让chatgpt帮你改写。
  - 下面这个是改写我之前创作的文案，重新生成了一个新的文案，改写之后基本逻辑都正确了，而且避免了抄袭。
  - '![](img/62c309dacc5e4b64ce3dfca12186f398.png)'
- 'no': 5
  name: AI幻觉甄别与领域知识护城河 —— 懂行才能把AI当实习生使
  points:
  - '**为什么需要这个概念？**'
  - '- ChatGPT在外文品牌翻译、具体奖项数据、冷门品类事实上严重瞎编（幻觉）'
  - '- 盲信AI输出发布会导致账号发布错误内容，破坏专业人设，降低用户信任与转化'
  - '- 平台算法打击低质内容，AI幻觉制造的垃圾内容会拖垮账号权重'
  - '**核心定义**'
  - '- 领域知识是驾驭AI变现的前置条件：只有懂行的人能判断AI输出的真伪，将其作为“实习生”高效使唤'
  - '- 甄别维度：中文品牌/热门标品→AI可信度高；外文品牌/长尾非标/具体数据→AI可信度低，必核'
  - '**关键性质**'
  - '- 认知门槛即变现门槛：不懂行业无法甄别幻觉，也就无法商业化应用AI，形成天然护城河'
  - '- AI擅长“形式/结构/文案润色”，不擅长“事实/数据/真实体验”，分工必须清晰'
  - '- 知识密度决定AI利用率：知识储备越丰富，能委托给AI的任务比例越高，杠杆率越高'
  - '**典型例子**'
  - '- 询问“范佳乐白啤产地/中文名”AI答错（说是德国实为比利时、译名搞错），但问“特色/奖项/卖点”回答详实可用'
  - '- 中国精酿品牌清单AI答准，国外品牌清单AI翻车，验证“中文语料充分、外文语料稀缺”导致认知不对称'
  - '**边界条件**'
  - '- 非领域专家不可盲目复制：看到别人用AI赚钱，自己不懂行业硬上，必死于幻觉'
  - '- 随模型迭代幻觉率会下降但不会归零：事实核查永远是人工不可外包的最后一环'
  - '- 极新/极冷门领域无公开语料训练，AI完全不可用，必须人工原创'
  - '...'
  sources:
  - paper: docs/202303/GhbsdeUAeo0lWdxwqcecdwx0nuh.md
    role: origin
  - paper: docs/202303/20230328_123.md
    role: critique
  excerpts:
  - 比较适合你已经了解某一行业产品，这样才知道ChatGPT是像认真回答的，而不是瞎编的。
  - 目前发现chatgpt推荐好物，问它中国的品牌，回答的会比较清楚，但国外品牌就有很多回答不了，特别是翻译的中文品牌名经常搞错。
  - 下面这个国外品牌虽然地域回答错了，但是推荐理由还是很详细的，可以直接使用
- 'no': 6
  name: RPA+草稿箱半自动化发布流 —— 以草稿箱为缓冲，以人工确认为闸门
  points:
  - '**为什么需要这个概念？**'
  - '- 完全自动化发布（含点击发布按钮）极易触发平台反作弊风控，导致封号/限流'
  - '- 纯人工发布效率低，无法支撑“大力出奇迹”所需的批量产出量级'
  - '- 需要一种“刹车机制”：自动化跑到发布前一步停下，人工快速扫眼确认再点发布'
  - '**核心定义**'
  - '- 标准化动作流：1. 人工筛选问题存草稿箱 → 2. RPA遍历草稿箱调用ChatGPT填充回答 → 3. RPA停留在“发布前确认态” → 4. 人工二次润色确认
    → 5. 人工点击发布'
  - '- 草稿箱双重作用：既是RPA任务队列，又是人工选题质检关卡'
  - '**关键性质**'
  - '- 效率与安全平衡点：将90%重复劳动（打字、排版、切换页面）交给RPA，保留10%核心决策（内容质量、合规风险）给人工'
  - '- 单账号日产能跃升：从人工日更几条提升至几十条，支撑矩阵号运营'
  - '- 工具选型关键：基于浏览器插件的轻量级RPA（如Automa）门槛最低，适合个人开发者'
  - '**典型例子**'
  - '- Automa插件操作知乎网页端：录制一次“打开草稿→调用AI→填充内容→停在发布按钮”动作，循环执行'
  - '- 作者实测：配合该流程，3月知乎好物收益稳定产出，验证流程跑通'
  - '**边界条件**'
  - '- 平台前端改版会导致RPA选择器失效，需维护更新脚本，非一次配置永久受益'
  - '- 多账号矩阵运营时，需配合指纹浏览器/独立IP环境，防关联封号'
  - '- 人工确认环节若偷懒不看直接点发布，等同于全自动，失去风控意义'
  - '...'
  sources:
