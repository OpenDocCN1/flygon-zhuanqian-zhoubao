learning_targets:
- 理解视频号平台对垂直技能型素人冷启动的独特适配性
- 掌握对标账号四维分析法快速建立选题库与封面SOP
- 熟练应用账号三件套设计公式完成信任背书与转化闭环
- 掌握批量拍摄-异步剪辑-定时发布的受限创作者生产工作流
- 掌握评论区全托管运营法实现算法加速与需求挖掘双重价值
- 理解中老年用户私域引流低门槛适配原则与双轨SOP设计
- 掌握先完成再完美的MVP迭代策略与生命周期节奏控制表
- 能运用垂直技能型素人成功公式进行全链路自检与复盘
concept_map:
- 视频号垂直赛道冷启动与私域变现体系
- ├── 平台适配性认知
- │   ├── 视频号素人入场适配性  —— P001
- │   │   ├── 社交裂变属性强（熟人链传播）
- │   │   ├── 私域闭环短（一键跳微信/企微）
- │   │   └── 用户画像匹配（中老年/女性/高复购）
- │   └── 垂直技能型素人成功公式  —— P010
- │       ├── 专业人设信任背书（头衔/证书/案例）
- │       ├── 高频内容曝光量（日更/批量/互动）
- │       ├── 低门槛私域转化路径（适配话术/二维码）
- │       └── MVP快速变现（预售/低价/分期）
- ├── 前期筹备与定位
- │   ├── 对标账号四维分析法  —— P002
- │   │   ├── 内容数据表现（高赞/高播主题归纳）
- │   │   ├── 私域引流动作（话术/钩子/路径拆解）
- │   │   ├── 变现路径闭环（产品/价格/交付模式）
- │   │   └── 封面设计规律（对比类/反差感/CTR优化）
- │   └── 账号三件套设计公式  —— P003
- │       ├── 名称=行业+名字（SEO/认知降维）
- │       ├── 头像=专业场景/证书/气质（视觉信任）
- │       └── 简介=身份标签+量化背书+私域钩子（落地页）
- ├── 内容生产与运营体系
- │   ├── 批量拍摄-异步剪辑-定时发布  —— P004
- │   │   ├── 选题前置（半个月库/标准化机位灯光）
- │   │   ├── 生产解耦（拍摄需状态/剪辑用碎片）
- │   │   └── 定时投放（固定频次/固定时间点）
- │   ├── 评论区全托管运营法  —— P005
- │   │   ├── 全量回复（算法权重/专业信任）
- │   │   ├── 标题设钩（扣1领教程/引导动作）
- │   │   └── 需求挖掘（高频问/吐槽=选题库）
- │   └── 生命周期规划与变现节奏控制表  —— P009
- │       ├── 生理节点倒推业务节奏（孕晚期/月子/复工）
- │       ├── 阶段单一核心目标（极度聚焦）
- │       └── 空窗期资产积累（认证/话术/素材库）
- ├── 私域引流与转化闭环
- │   ├── 中老年用户私域引流低门槛适配原则  —— P006
- │   │   ├── 二维码图片直发（相册识别/扫一扫）
- │   │   ├── 话术+二维码双轨兜底（分级处理）
- │   │   └── 来源打标精准承接（标签→产品匹配）
- │   └── 私信话术+二维码双轨引流SOP  —— P008
- │       ├── 话术结构（共情+专业+钩子+指令）
- │       ├── 意向分级（高意向人工/低意向自动）
- │       └── 数据闭环（来源/等级/加微/成交周复盘）
- └── 产品迭代与变现验证
- '    ├── 先完成再完美的MVP迭代策略  —— P007'
- '    │   ├── 预售/MVP验证真需求（现金流=唯一真理）'
- '    │   ├── 交付倒逼成长（截止日期强迫产出）'
- '    │   └── 版本迭代显性化（1.0→2.0终身免费升级）'
