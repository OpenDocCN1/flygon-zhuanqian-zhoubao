paper: docs/202303/20230328_014.md
desc: 该素材为作者 Erik 分享其历时 10 多年打磨的时间管理方法论概述，核心主张受瑞·达里奥《原则》启发，采用“先立原则、后建实践、持续迭代”路径，形成一套简单而有效的时间管理体系，并已在生财有术社区进行详细分享。
concepts:
- name: 原则先行的时间管理范式
  desc: 一种以建立核心原则为起点，在此基础上逐步构建、优化具体实践操作的时间管理建设路径，区别于直接套用通用技巧的碎片化学习模式。
  is_original: true
  excerpt:
  - 受瑞·达里奥的《原则》影响，先建立原则，再在原则的基础上去逐步建立和优化实践
- name: 时间管理知行差距
  desc: 指个体虽掌握大量‘正确’的时间管理理论，但因理论空泛、缺乏个性化落地体系，导致难以在实际工作生活中有效执行的普遍现象。
  is_original: false
  excerpt:
  - 我们每个人都学了太多“正确的”时间管理理论，但往往空泛而很难落地。
methods:
- name: __overview__
  desc: 作者基于达里奥《原则》方法论，经过 10 多年实践迭代形成的完整时间管理方法论框架，包含原则建立、实践构建、持续优化三个核心阶段，已整理为飞书文档对外公开。
  excerpt:
  - 我从 10 多年前就开始思考“如何建立一个高效生活与工作的时间管理模式”。受瑞·达里奥的《原则》影响，先建立原则，再在原则的基础上去逐步建立和优化实践，多年过去，慢慢的形成了一套简单而有效的时间管理方法论。
  - 在 2 月的航海中，分享了这套原则与实践。承蒙生财团队厚爱，受邀同步发到星球，请大家移步飞书观看详情
theorems:
- name: 简单有效源于原则驱动的长期迭代
  desc: 真正简单且有效的时间管理方法论，并非源于学习更多技巧，而是源于确立核心原则后，通过长周期（10年+）的实践检验与持续优化自然涌现。
  excerpt:
  - 先建立原则，再在原则的基础上去逐步建立和优化实践，多年过去，慢慢的形成了一套简单而有效的时间管理方法论。
- name: 时间管理的核心价值在于单位产出最大化
  desc: 时间管理的本质动因是物理时间不可再生，通过管理提升单位时间内的效率与产出，是个人及创业者必须重视的核心杠杆。
  excerpt:
  - 每天的时间就这么多，单位时间内的效率决定产出。
findings:
- name: 方法论已通过社区实战验证并公开发布
  desc: '[evidence] 该方法论已在“生财有术”社区的“航海”项目中进行过分享，并获官方团队邀请整理为飞书文档公开发布，说明其具备一定的实战参考价值与社区认可度。'
  excerpt:
  - 在 2 月的航海中，分享了这套原则与实践。承蒙生财团队厚爱，受邀同步发到星球，请大家移步飞书观看详情
