units:
- 'no': 1
  name: 艺术二维码 —— 让黑白方块进化成IP视觉锤
  points:
  - '**为什么需要这个概念？**'
  - '- 传统二维码单调丑陋，难以承载个人IP的品牌辨识度与审美价值'
  - '- 自媒体时代流量昂贵，每一个独特视觉点都可能成为吸引流量的关键钩子'
  - '- 普通模板二维码重复率高、识别性无售后保障，无法满足商业IP差异化包装需求'
  - '**核心定义**'
  - '- 将二维码的黑色方块模块替换为个性化图案、插画、文字或2.5D形态'
  - '- 在保持扫码/长按识别功能完好的前提下，实现审美升级与IP专属化表达'
  - '- 核心技术原理：通过线条、图像合理覆盖关键信息点，保证跨系统（iOS/Android/鸿蒙）兼容识别'
  - '**关键性质**'
  - '- 时效性硬约束：仅适用永久有效原始码，临时码或使用‘换个样式’导致底码变更即失效'
  - '- 识别性是硬门槛：一两个信息点绘制错误即导致不识别，需全过程迭代测试保识别'
  - '- 双重属性：兼具‘社交货币属性’（新奇独特引发炫耀分享）与‘身份锚定属性’（专属元素强化IP辨识）'
  - '**典型例子**'
  - '- 吉果个人艺术二维码发朋友圈 → 吸引头部KOL梁靠谱定制 → KOL展示引发三级引流链条：粉丝加KOL、大佬加设计师、甲方下单定制'
  - '- 价格梯队：基础换色两位数、3-5原创图案三位数、专属图案+海报1-5千、毕加索/2.5D风格五位数（最高3万）'
  - '**边界条件**'
  - '- 无法跨平台流通：微信二维码发抖音/小红书会被判违规，仅限微信生态内及线下物理场景使用'
  - '- 传播载体弱：无法承载大面积文案，劝退急于展示产品的小商家'
  - '- 从业者稀缺：市场上会做原创艺术二维码的设计师仅几千人，教学变现潜力大但推广难'
  - '...'
  sources:
  - paper: docs/202303/AoT0dlRipo0RN6xDSo3cdckpnyf.md
    role: origin
  excerpts:
  - 艺术二维码就是把二维码的小黑方块，换成图案、文字、小插画、2.5D图案等等形式，让它不再是单调的黑色块。在保有基本信息的基础上，变的更好看和独特。
  - 艺术二维码的价值来自于它承载的IP价值和创意价值。它不仅仅是一个身份识别的图案，还是一件包含设计艺术价值在内的艺术产品。
  - 【有时效限制的二维码不可以！】原因在于，原创的艺术二维码本身设计需要时间，如果7天后用于做设计的原始二维码失效了，那么甲方爸爸可以和设计师一起哭了。
  - 艺术二维码的设计原理并不难，关键点就在于信息点的覆盖。用线条、图像合理覆盖，保证信息可识别。一个完美的艺术二维码，必须让你扫也扫的出来，长按也能按的出来。安卓鸿蒙的能识别，IOS也得能识别。
  - 当天的朋友圈不知道发什么，就把艺术二维码的图片发出去了。然后这张艺术二维码，让我见识到了什么叫著名圈友梁靠谱的影响力...专属于梁靠谱的艺术二维码出炉...来加靠谱好友的人数已经堆满一屏幕...突然很多大佬来加我...最后...有两位甲方爸爸下单了。
  - 设计一款二维码付出很多，但是无法跨平台使用。例如微信的二维码不能发到小红书或者抖音。会被判定引流。微信生态内可以使用，视频号能够发微信艺术二维码的视频。
- 'no': 2
  name: 迭代测试保识别法 —— 把‘能不能扫出来’做成创作全程的硬约束
  points:
  - '**为什么需要这个概念？**'
  - '- 艺术二维码核心价值在于‘能识别’，一旦失效即造成甲乙双方时间金钱双重损失'
  - '- 视觉元素每增加一层，识别风险叠加，传统‘画完再测’返工成本极高'
  - '- 跨设备（iOS/Android/鸿蒙）、跨交互（扫一扫/长按）兼容性需全覆盖验证'
  - '**核心定义**'
  - '- 在AI矢量软件中逐层绘制元素 → 每增加一个视觉元素即进行跨设备/跨交互实测 → 定位识别失败点 → 微调信息点覆盖 → 循环直至全通过'
  - '- 将‘可识别性’作为硬性约束条件嵌入创作全过程，而非事后验收指标'
  - '**关键性质**'
  - '- 增量式验证：每加一个花/草/线条即测一次，发现问题即时微调，避免最后推倒重来'
  - '- 全维度覆盖：必须同时通过‘扫一扫’、‘长按识别’、‘安卓/鸿蒙/iOS’三大系统测试'
  - '- 耗时瓶颈：识别性测试是制作周期的核心耗时环节（顶级定制耗时可达一个月）'
  - '**典型例子**'
  - '- 作者与梁靠谱二维码制作周期5-7天，核心时间消耗在反复测试识别上'
  - '- 毕加索风格需1-2周，2.5D风格更久，复杂度与测试轮次正相关'
  - '**边界条件**'
  - '- 依赖设计师经验与直觉判断‘信息点覆盖边界’，缺乏量化自动化检测工具'
  - '- 模板二维码因缺乏针对性测试与售后，常出现‘喜欢的样式不识别，只能换样式’的不可用风险'
  - '...'
  sources:
  - paper: docs/202303/AoT0dlRipo0RN6xDSo3cdckpnyf.md
    role: origin
  excerpts:
  - 所以为了保证识别性，在绘制的过程中，要不断地测试。简单来说，我加了一个花，二维码扫的出来吗？测一下。再加个草呢？再测测。
  - 一个完美的艺术二维码，必须让你扫也扫的出来，长按也能按的出来。安卓鸿蒙的能识别，IOS也得能识别。
  - 根据设计要求，图案内容的复杂程度，设计周期从几个小时到一个月不等。
  - 而且可识别性不稳定，没人给你售后。喜欢的样式如果不识别，只能换个样式。
- 'no': 3
  name: 圈层定向营销策略 —— 精准锚定‘懂流量、有预算、重差异’的自媒体IP
  points:
  - '**为什么需要这个概念？**'
  - '- 艺术二维码高客单价、审美上层、非刚需，大众营销转化极低、获客成本高'
  - '- 知识付费/自媒体IP圈层：付费能力强、极度在意差异化包装、深谙流量价值，天然匹配'
  - '- 将产品从‘装饰品’重新定义为‘引流工具’与‘身份勋章’，提升客户支付意愿'
  - '**核心定义**'
  - '- 放弃大众普及营销，精准锚定‘知识付费/自媒体IP’目标圈层'
  - '- 利用头部KOL在私域/社群展示触达，激活‘社交货币’与‘身份锚定’双重属性'
  - '- 通过‘专属定制’制造稀缺性，引发目标圈层从众竞逐与商业转化'
  - '**关键性质**'
  - '- 零广告投放：靠高质量作品钩子 + 弱关系网络强节点（KOL）放大 + 圈层裂变'
  - '- 三级引流链条：KOL展示 → 粉丝加KOL/大佬加设计师/精准意向客户下单'
  - '- 定价锚定IP商业价值而非制作成本：大IP愿付溢价（边际收益远超成本），普通用户仅付模板费'
  - '**典型例子**'
  - '- 吉果发朋友圈 → 梁靠谱定制 → 星球/群展示 → 几分钟好友申请爆满 → 多位行业大佬主动加微 → 2单成交'
  - '- 定价模型：两位数（基础）到三万元（顶级），价格锚点在于IP商业价值与稀缺性'
  - '**边界条件**'
  - '- 目标圈层极窄：仅限‘自媒体IP/知识付费’等高客单、重品牌、懂流量的群体'
  - '- 平台生态割裂限制规模化：无法跨平台引流，商业模式难以在微信生态外复制'
  - '- 设计师普遍缺乏营销能力，导致好产品滞销，行业发展长期停滞'
  - '...'
  sources:
  - paper: docs/202303/AoT0dlRipo0RN6xDSo3cdckpnyf.md
    role: origin
  excerpts:
  - 艺术二维码的原创性，导致价格并不亲民...属于最上层的需求...不是所有人都能接受。
  - 在知识付费领域、自媒体IP领域，大家更注重自己的差异性和账号的审美包装。定位和圈层对了，结果也就对了。
  - 自媒体时代，流量最贵。每一个独特的点，都可能成为你吸引流量的奇招。
  - 此时第一波引流功能+表达者红利出现了...第二波引流功能出现了：在靠谱展示出艺术二维码的几分钟内，来加靠谱好友的人数已经堆满一屏幕。第三波引流功能出现了：突然很多大佬来加我...
  - 艺术二维码的价值来自于它承载的IP价值和创意价值...普通人只是为了好看和独特，一两千买个图片，他是不愿意的。但自媒体IP需要引流，尤其是那些全方位包装自己的大IP更需要引流。
- 'no': 4
  name: 艺术二维码分级定价模型 —— 让价格锚定IP价值而非制作工时
  points:
  - '**为什么需要这个概念？**'
  - '- 设计师常按工时定价导致低估商业价值，买家按‘买张图’心理压价，双方认知错位'
  - '- 需要一套标准化价格体系，将复杂度、原创度、IP信息密度、衍生应用量化为可报价梯队'
  - '- 解决‘普通用户嫌贵、大IP嫌便宜’的定价悖论，实现价值定价而非成本定价'
  - '**核心定义**'
  - '- 依据设计复杂度、原创元素数量、IP专属信息密度、衍生应用范围划分五大梯队'
  - '- 梯队1：基础换色/单一元素替换（两位数，几小时）'
  - '- 梯队2：3-5个原创图案覆盖信息点（三位数，5-7天）'
  - '- 梯队3：明确专属图案+大量个人信息/配合海报设计（1-2千/3-5千）'
  - '- 梯队4：毕加索风格/含设计理念（五位数，1-2周）'
  - '- 梯队5：2.5D高难度风格/顶级定制（五位数，最高3万，一个月）'
  - '**关键性质**'
  - '- 价格-周期-复杂度强正相关：识别性测试轮次随复杂度指数级上升，成核心耗时瓶颈'
  - '- IP审美溢价：定价锚点在于承载的IP商业价值与稀缺性，大IP边际收益远超成本'
  - '- 模板 vs 原创：模板两位数但重复率高、无售后；原创承载IP资产、高识别、可溯源'
  - '**典型例子**'
  - '- 吉果个人二维码：含专属信息+海报级设计，定价1-2千，周期5-7天'
  - '- 梁靠谱定制版：触发三级引流链条，验证高客单价产品的商业杠杆效应'
  - '**边界条件**'
  - '- 学习门槛高：需掌握AI矢量软件+设计思维+识别性测试经验，从业者仅几千人'
  - '- 交付风险大：一旦原始码失效或客户改需求，前期沉没成本极高（无法复用底码）'
  - '- 跨平台受限：仅微信生态可用，无法成为全域流量入口，限制商业规模化上限'
  - '...'
  sources:
  - paper: docs/202303/AoT0dlRipo0RN6xDSo3cdckpnyf.md
    role: origin
  excerpts:
  - 例如最简单的换个颜色，或用非常简单且单一的元素替换全部黑方块，可以便宜到两位数。
  - 用3-5个原创图案覆盖信息点的艺术二维码价格在三位数。
  - 而像我个人的艺术二维码...能在二维码的图案中有明确的图案以及能放入大量的个人专属信息的艺术二维码，就已经来到1-2千元。
  - 还有包含设计理念和颜色的艺术二维码、2.5D绘画的艺术二维码，价格可以达到五位数。目前听说过的最贵的艺术二维码，大概3万元左右。
  - 根据设计要求，图案内容的复杂程度，设计周期从几个小时到一个月不等。
  - 艺术二维码的价值来自于它承载的IP价值和创意价值...设计师是在有限的空间内，绘制了一幅有丰富想象力的图画。
