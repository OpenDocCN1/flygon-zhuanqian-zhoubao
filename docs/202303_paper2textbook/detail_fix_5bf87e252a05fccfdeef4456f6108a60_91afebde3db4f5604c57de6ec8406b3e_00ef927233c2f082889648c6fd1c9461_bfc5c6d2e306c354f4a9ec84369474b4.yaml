  name: 跨境电商Prompt模板库 —— 角色+约束，让通用模型秒变垂直专家
  points:
  - '**为什么需要这个概念？**'
  - '- 跨境电商涉及广告投放、内容营销、Listing优化、客服邮件、选品规划等9大高频场景，通用对话无法满足专业规范要求'
  - '- 各平台有硬性规范(字符限制/格式/标签/卖点数量)，仅有角色任务不够，必须显式约束硬性指标'
  - '- 非技术人员无法微调模型，需零样本/少样本Prompt工程即插即用'
  - '**核心定义**'
  - '- 9大场景标准化模板：Google/FB广告、Instagram运营、Quora问答、SEO大纲、Amazon Listing、复购邮件、客服话术、选品规划'
  - '- 统一结构：角色设定(现在你是一名[专业角色])+任务指令+硬性约束(语言/字数/格式/平台规范/卖点数量/折扣策略/回复风格)'
  - '**关键性质**'
  - '- 提示词即生产力：标准化Prompt将通用LLM瞬间转化为垂直领域中初级运营水平专家'
  - '- 输出约束决定生产可用性：硬性指标(字数、格式、规范)是从“可阅读”变“可直接投放”的关键'
  - '- 核心痛点皆可击破：跨境电商高频环节均可抽象为“特定角色+明确交付物+硬性约束”结构'
  - '**典型例子**'
  - '- Google Ads生成10组标题/描述：符合字符限制、含“Premium Quality/Free Shipping”等合规文案'
  - '- Amazon Listing强制输出5个独特卖点并融入描述，而非简单罗列，符合A9算法转化逻辑'
  - '- 客服话术：先安抚情绪→再解决问题→最后自然植入推销，兼顾服务与销售'
  - '**边界条件**'
  - '- 模版为v1.0版本，需根据实测反馈持续迭代优化'
  - '- 战略决策(选品方向/预算分配)不可外包，AI仅作分析师辅助输出结构化计划表'
  - '- 模型知识截止与幻觉：最新平台政策/实时汇率等时效性信息不可信'
  - '**核心口诀**'
  - '- 角色定专业，约束定规范，任务定产出，九大场景全覆盖；输出能直接投放，才是好Prompt'
  sources:
  - paper: docs/202303/20230328_128.md
    role: origin
  excerpts:
  - 提示词：现在你是一名谷歌广告的编写人员...写 10 条谷歌广告标题和谷歌广告描述...符合谷歌的标准...引人入胜，让人有下单的欲望。
  - 提示词：现在你是一名亚马逊的电商运营...想出 5 个独一无二的卖点，要在产品描述中提现出来。
  - 提示词：现在你是一名客服...直接回答问题...安抚客户让客户感受到温暖，并在适当的时机推销我们的 xx 产品。
  - 要求：符合谷歌/Facebook 标准、字数 800+、#标签#格式、5个独特卖点、合理折扣、计划表格式等。
  - 'Cora : 我也是用它来帮忙写谷歌广告语 秋刀鱼哥 : 有用 ... Adam : 居然还会选品，6 永哥 : 很棒！'
