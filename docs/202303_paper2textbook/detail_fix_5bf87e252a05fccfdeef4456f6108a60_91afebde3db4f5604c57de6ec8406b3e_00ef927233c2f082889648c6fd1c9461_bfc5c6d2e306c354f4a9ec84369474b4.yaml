- 'no': 1
  name: GPT-4协作写作流程 —— 让AI当执笔，人当导演
  points:
  - '**为什么需要这个概念？**'
  - '- 公众号情感赛道需要持续高频产出爆文，但人工全流程创作耗时长、素材易枯竭、情绪价值难把控'
  - '- GPT-3.5等早期模型中文写作质量不达标，无法直接商用'
  - '- 追求全自动化批量生成会导致内容质量崩塌，缺乏人性化细节'
  - '**核心定义**'
  - '- 标准化6步协作范式：风格调教→选题逆向工程→大纲确认→分段详写→人工润色合并→标题人工决策'
  - '- 核心原则：AI负责80%文字生产（执行层），人负责20%关键决策与打磨（导演层）'
  - '**关键性质**'
  - '- 人机分工比固化为 4:6（人工耗时占比：AI耗时占比）'
  - '- 文字层面AI完成80%+生成，人工主攻删减冗余、衔接润色、标题决策'
  - '- 必须使用GPT-4模型，GPT-3.5无法达到商业化质量阈值'
  - '**典型例子**'
  - '- 零基础新号7天产出10W+爆文：第1-6天积累权重，第7天情感文单篇阅读10W+、收益1000+'
  - '- 选题逆向工程：输入爆款情节“相亲对象嫌我穷”，AI生成10个变体选题，人工筛选定稿“月薪3000相亲被嫌弃，半年后我买下整栋楼”'
  - '**边界条件**'
  - '- 模型推理速度是核心瓶颈：白天创作效率显著高于夜间，单篇耗时1-2小时主要卡在等待生成'
  - '- 上下文窗口限制：单次对话仅能容纳约1500字全文作为Few-shot样本'
  - '- AI生成内容通病：段落衔接生硬、冗余废话多，必须经人工专项清洗'
  - '- 合规风险红线：编造情感故事极易触发“网络清朗行动”风控，需隐匿账号信息、优化真实性'
  - '**核心口诀**'
  - '- 选题标题人工决（50%权重），正文AI秒出（执行层），情绪价值人工注（升华层），原创度从60%冲70%+'
  sources:
  - paper: docs/202303/20230328_042.md
    role: origin
  excerpts:
  - 写作流程分为 6 个步骤：1. 调教写作风格，一次调教后可长期使用。 2. 选题。 3. 写大纲。 4. 详写各部分内容。 5. 合并内容，人工润色。 6.
    写标题。
  - 一篇文章从构思到发布，耗时约 1~2 小时...一篇文章人工占 40%，ChatGPT 占 60%。具体到文字部分，ChatGPT 可以完成 80%以上，人工主要是删除多余的内容。
  - 一定要用 GPT-4。相比 3.5 提升很多，除了速度。
  - 不要想文章全部由 ChatGPT 自动写，或批量生成，那样质量不会太高。
  - 公众号从 0 开始，自 3 月 18 日起，每天发一篇情感文，全是用 ChatGPT 写的。3 月 24 日发的第 7 篇文章，单篇阅读量 10W+，单篇收益
    1000+。
  - 用了这个方法，从此再也不用自己编故事了，题材取之不尽。
  - ChatGPT 不能保证每个部分衔接的非常好，经常会有多余的内容。
  - 总感觉，这样编出来的故事，容易让人举报...网信办再次开展网络清朗行动，打击的就是这种失真内容。
- 'no': 2
  name: 发号施令范式 —— 别把AI当专家问，当助理使
  points:
  - '**为什么需要这个概念？**'
  - '- 多数用户将ChatGPT当“全知专家”提问，得到套路化、知识截止、一本正经胡说八道的无效回答'
  - '- 真实业务场景中，用户已知目标与流程，仅缺执行手，需AI精准完成指定动作而非提供建议'
  - '- 跨语言视频制作中，翻译与配音时长错位是核心痛点，传统工具无法解决，需指令AI长度对齐'
  - '**核心定义**'
  - '- 范式转换：从“提问模式”（学生问老师）转为“指令模式”（老板使助理）'
  - '- 核心动作：明确目标→拆解难点→下达结构化指令→串联工具链自动化'
  - '**关键性质**'
  - '- ChatGPT知识截止2021年、会幻觉编造、回答模式套路化（总分总），不可作为决策依据'
  - '- 必须先有成熟项目方法论（知晓做什么、怎么做、变现闭环），AI仅解决拆解后的执行难点'
  - '- 少样本风格微调：连续投喂特定风格文案，利用上下文学习能力固化人设'
  - '**典型例子**'
  - '- TikTok影视解说自动化：剪映提字幕→ChatGPT长度对齐翻译→D-ID生成数字人→剪辑合成，单条从2小时压缩至3分钟，效率提升40倍'
  - '- 文案风格训练：投喂10条“毒舌解说”文案，AI即可模仿该风格批量产出新脚本'
  - '**边界条件**'
  - '- 无项目方法论时指令无效：不知“要做什么”则无法“发号施令”'
  - '- 知识型决策不可外包：选品、定价、赛道选择等战略决策必须人工把关'
  - '- 模型幻觉风险：涉及事实性查询（如最新政策、具体数据）时输出不可信'
  - '**核心口诀**'
  - '- 知目标、懂流程、拆难点、发指令、串工具、跑闭环；AI是执行手，人是决策脑'
  sources:
  - paper: docs/202303/20230328_044.md
    role: origin
  excerpts:
  - 这两句话看似类似，其实不一样，第一句话是你并不知道答案，你想通过提问，获得答案，就好像学生问老师...而第二句话，更像是一个助理或者手下，你已经知道了你想要的结果，你只是需要有人去完成它。
  - 答案就是，我们要学会向它发号施令，做它的主人，而不是做他的学生。
  - 放到 tiktok 变现，我们首先要有项目方法论，换句话说，就是你要知道要做什么项目，这个项目的是怎么实操的，项目要点在哪里，以及我们变现的整个闭环和路径。之后把难点拆解，逐一的扔给
    chatgpt 去给我们完成。
  - 可以看到，翻译出来的内容，和原文的长度基本是一致的。
  - 整个视频搞完，新手慢一点的可能最少也要 2 小时以上了。上面的整个过程，在 3 分钟之内就能完成。
  - chatgpt 并不是万能和无所不知的...当你向 chatgpt 提问的时候，他的回答有很明显的几个特征。1、套路化...2、知识储备有限...而且它对不知道的事情还会编故事胡说八道。
- 'no': 3
  name: 批量剪辑自动化生产线 —— 备料、炒菜、打包三阶段工业化
  points:
  - '**为什么需要这个概念？**'
  - '- 短视频带货核心瓶颈在于视频生产效率：手工混剪日产<10条、极度疲劳、无法支撑矩阵化运营'
  - '- 纯搬运(BY)账号存活仅2-4天即被限流，实拍成本过高，二创混剪是长期主义必经之路'
  - '- 达芬奇/剪映等专业软件无开放API，跨软件流程靠人工串联效率低、易出错、不可复用'
  - '**核心定义**'
  - '- “备料-炒菜-打包”三阶段自动化法：达芬奇场景切割/去重预处理(备料)→剪映模板化合成/配音/字幕(炒菜)→RPA跨软件编排/容错/定时分发(打包)'
  - '- 文件夹流转标准化：5大核心文件夹作为数据总线，实现素材物理隔离与自动流转'
  - '**关键性质**'
  - '- 混剪去重核心公式：场景切割+随机打乱+几何变换(缩放/位移/旋转/翻转)+统一调色'
  - '- RPA核心价值非“替人点鼠标”，而在“跨异构软件编排确定性流程”+“启动即重置”容错机制'
  - '- 音画同步机制：带货模式下依据配音时长自动匹配抽取素材，解决传统混剪音画不同步'
  - '**典型例子**'
  - '- 自动化上线后实测：单条视频4000播放产出4单带货订单(转化率0.1%)，日产能从<10条提升至稳定批量'
  - '- 素材预处理SOP：剪映统一转码/重命名→达芬奇场景切割/几何变换/调色同步→随机重命名打乱顺序'
  - '**边界条件**'
  - '- 达芬奇批量处理多规格素材易崩溃，必须前置RPA驱动剪映统一预处理'
  - '- 剪映“上下裁剪+模糊背景”双重去重/去字幕实测有效，但需人工预置模板参数'
  - '- 环境差异(浏览器缩放、分辨率、文件路径)是RPA落地最大变数，必须人工跑通一次并调试'
  - '- 未做容错前，单次报错需人工耗时20-30分钟恢复环境，极大抵消自动化收益'
  - '**核心口诀**'
  - '- 备料达芬奇(切割去重调色)，炒菜剪映(模板配音字幕)，打包RPA(编排容错分发)，文件夹流转做数据总线'
  sources:
  - paper: docs/202303/20230328_107.md
    role: origin
  - paper: docs/202303/BOnrd0uMWoINRrx9BcCcJEh5nRg.md
    role: improve
  excerpts:
  - 利用达芬奇的场景剪切探测器对场景进行了自动分割...进入剪辑面板，进行缩放、位置、旋转角度、翻转处理。再进入调色面板，在校色轮处，调一个不错的参数...然后每一个片段同步这个参数即可。
  - 正常导出的素材片段是按照视频顺序排序的，这样不利于我们剪辑，毕竟我们的目的是打乱，可以用流程对素材片段进行随机抽取重命名，达到打乱效果。
  - 又花了半个晚上做容错，直接在流程开始来一个恢复初始状态的流程，自此算是可以稳定产出了。
  - 将他们做成了一个流程，这样终于省事了。
  - 内容创作核心：合适的文案+合适的素材+合适的配音+合适的背景音乐=高质量原创视频
  - 软件会随机抽取文案目录中的一个文案，然后从抽取到的文案中，随机抽取一行文本合成配音，最后根据配音时长来抽取场景视频。
  - 达芬奇的场景剪切探测器，不知道是我电脑配置的原因还是什么原因，进行批量处理不同分辨率的视频时会崩溃，所以就要对下载的视频进行二次处理...
- 'no': 4
  name: 人工+智能爆文框架 —— 选题决策权重50%，AI执行，人工注入情绪价值
  points:
  - '**为什么需要这个概念？**'
  - '- AI生成内容“标准化、程式化、缺乏人情味”(原创度仅60%)，无法适配公众号社交传播属性'
  - '- 选题标题决定文章上限(占50%权重)，但人工全流程写作耗时长、素材枯竭'
  - '- 平台推荐算法红利窗口期(公众号引入系统推荐)要求高原创度、高情绪价值内容'
  - '**核心定义**'
  - '- 三步协作法：人工选题标题(1分钟，决策层)→AI生成正文(1分钟，执行层)→人工注入情绪价值(5分钟，打磨层：引文/衔接/升华)'
  - '- 总耗时≤10分钟，原创度从60%提升至70%+，通过主流平台原创校验'
  - '**关键性质**'
  - '- 选题决策权重论：做内容就是做选题，选择大于努力，需建立爆文库与榜单监控机制'
  - '- 情绪价值注入机制：针对AI“首先、其次、然后”机械结构，人工添加人性化细节'
  - '- 刻意练习选题标题：每日抄写爆文榜单三段式标题一页A4，持续一个月内化为直觉'
  - '**典型例子**'
  - '- 实测新号产出5篇10W+文章：单篇生产≤10分钟，单篇广告收益数千元，验证商业可行性'
  - '- 公司化矩阵化放大：单号跑通后上人复制SOP，预期规模化收入'
  - '**边界条件**'
  - '- AI内容合规风险高：编造情感故事极易触发风控(限流/违规/封号)，被迫隐匿账号信息'
  - '- 写作是长期累积：需持续执行100天-1年，心态急功近利是放弃核心原因'
  - '- 认知迭代靠行为倒推：通过“不看报告、刻意练标题、隐匿账号”等行为改变倒推认知升级'
  - '**核心口诀**'
  - '- 选题标题人工拿捏(1分)，正文AI秒出(1分)，情绪价值人工注(5分)，十分钟出爆文，原创度破70%'
  sources:
  - paper: docs/202303/20230328_126.md
    role: origin
  excerpts:
  - 搭了一个人工+智能爆文框架，总共 3 步：1、选题+标题，占 50%，做内容就是做选题，所谓选择大于努力 2、正文 3、情绪价值 这就是我这边的人工+智能（ChatGPT）爆文框架，人工来做
    1 和 3；ChatGPT 写 2。
  - 选题、标题用时 1 分钟左右...经过 ChatGPT 1 分钟左右输出...再用 5 分钟，也就是经过第 3 步的优化...总共用时不超过 10 分钟
  - 这时候原创度大概在 60%左右。再用 5 分钟...这时候再测原创度，已经高达 70%以上，主流平台都能轻松过关。
  - 公众号爆文写作，这个事情，其实是一个长期累积的事情，就先从持续做这件事一百天开始，一年开始...
  - 总感觉，这样编出来的故事，容易让人举报...最新消息，网信办再次开展网络清朗行动，打击的就是这种失真内容。
