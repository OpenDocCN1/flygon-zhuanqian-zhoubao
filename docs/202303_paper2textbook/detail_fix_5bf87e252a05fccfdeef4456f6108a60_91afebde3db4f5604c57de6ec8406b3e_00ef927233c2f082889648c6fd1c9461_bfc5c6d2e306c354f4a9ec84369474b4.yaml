  name: 小红书笔记Prompt分级体系 —— 从特定指令到混合模式的进阶路径
  points:
  - '**为什么需要这个概念？**'
  - '- 新手拿到ChatGPT账号不知如何提问，随意提问导致输出泛泛、呆板、无平台调性'
  - '- 小红书笔记有严格四段式结构规范(开头/中间/结尾/标签)，非结构化素材需标准化转化'
  - '- 个人IP人设差异化需注入模型，而非泛泛角色扮演'
  - '**核心定义**'
  - '- 五大提示词模式阶梯：特定指令(确认知晓)→指令模板(平台风格)→示例模式(Few-shot模仿)→代理模式(角色扮演)→人设注入代理(强IP辨识)→混合模式(结构+范例+人设+素材)'
  - '- 小红书标准化结构：开头(痛点+情景+人设+方法+诱导)→中间(1-5知识点重讲核心)→结尾(提关注+强人设+引主页)→标签(自打热门)'
  - '**关键性质**'
  - '- ChatGPT核心价值=非标转标准：将非结构化素材转化为符合平台规范的结构化输出'
  - '- 学习即模仿：示例模式优于指令模板，模型通过模仿隐性知识效果优于显性规则遵循'
  - '- AI定位脚手架：帮助跨越“不及格→合格”鸿沟，非包办“爆款”；思考不可外包(选题/逻辑/人设)'
  - '- 工作流嵌入式竞争力：领域专业度×AI嵌入深度，成为“某工作流最会用AI的人”构建护城河'
  - '**典型例子**'
  - '- 统一主题“推荐用ChatGPT做简历”对比：混合模式输出结构规范+内容详实+人设鲜明+可读性最强，获专家70-80分评价'
  - '- LinkedIn+ChatGPT求职实战：单份简历制作压缩至半小时，海投效率提升1倍+'
  - '**边界条件**'
  - '- 提问质量决定留存：好提问获正向反馈持续探索，差提问得负面体验放弃工具'
  - '- 必须懂业务平台规则+提示词工程双重背景，单纯懂技术或单纯懂业务均难产出高质量内容'
  - '- 好提问三标准：不可搜索、充足背景、讨论姿态，直接折射搜索力、系统思维、元认知'
  - '**核心口诀**'
  - '- 指令定风格，示例对结构，人设赋灵魂，混合模式打组合；AI渡及格线，思考自己扛'
  sources:
  - paper: docs/202303/TQMkd13LIos5sexxqWZcBHMUnif.md
    role: origin
  - paper: docs/202303/20230328_127.md
    role: apply
  excerpts:
  - 输入的Prompt提示关键词，可以归类为4种常见的基础模式：分别是：特定指令、指令模板、示例模式、代理模式。除了上面的4种基础模式外，在实际使用ChatGPT过程中，我们更多使用的是另一种模式—混合模式。
  - 一篇小红书笔记主要包括4个部分：开头：痛点引入+情景描述+人设+方法介绍+点赞诱导 中间：讲知识点...结尾提高关注率...最后，给笔记打上热门标签。
  - 请你扮演积极活泼、喜欢推荐物品的22岁小姐姐，以有趣、积极、 活泼的语气...
  - 使用ChatGPT创作的小红书爆款笔记不一定能爆，但是最关键的是它能帮助你把自身原来不及格的小红书笔记，快速提升到一个合格博主的创作水平...内容可以外包，思考终究还是自己的。
  - 只要你有意识地把AI工具应用到自己的工作流程中，不断优化，打磨，让自己在某个工作流程中，成为最会使用AI的那个人，你就不用担心会有被AI替代的那天。
