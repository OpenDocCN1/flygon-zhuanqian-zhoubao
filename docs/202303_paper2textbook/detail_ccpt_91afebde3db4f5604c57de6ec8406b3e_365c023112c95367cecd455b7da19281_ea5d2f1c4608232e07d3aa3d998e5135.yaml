units:
- 'no': 1
  name: 时间管理原则先行论 —— 从“碎片技巧”到“体系迭代”
  points:
  - '**为什么需要这个概念？**'
  - '- 我们学了太多“正确”的时间管理理论，但往往空泛而很难落地，形成严重的知行差距'
  - '- 物理时间不可再生，单位时间内的效率决定产出，必须建立个性化体系而非套用通用模板'
  - '- 直接套用技巧导致“碎片化学习”，无法应对复杂多变的现实工作生活场景'
  - '**核心定义**'
  - '- 原则先行范式：先建立核心原则（如时间不可再生、单位产出最大化），再在原则基础上逐步构建、优化具体实践操作'
  - '- 区别于“技巧先行”模式：后者是直接学习大量通用技巧，缺乏底层逻辑支撑，导致知行分离'
  - '**关键性质**'
  - '- 长周期迭代性：真正简单有效的体系，源于确立原则后10年+的实践检验与持续优化自然涌现，非一日速成'
  - '- 个性化适配性：实践必须建立在个人核心原则之上，才能解决“正确但空泛”的落地难题'
  - '- 杠杆放大效应：时间管理的核心价值在于提升单位时间产出，是个人及创业者必须重视的核心杠杆'
  - '**典型例子**'
  - '- 瑞·达里奥《原则》方法论迁移：作者受其启发，用10多年打磨出一套“简单而有效”的个人时间管理方法论'
  - '- 生财有术社区验证：该方法论已在“航海”项目中分享，获官方邀请整理为飞书文档公开发布，具备实战参考价值'
  - '**边界条件**'
  - '- 需具备长期主义心态：无法在短期内速成，必须接受“先立原则、后见效果”的延迟满足'
  - '- 原则建立需基于自我认知：盲目抄袭他人原则无效，只有自己最清楚需要什么、适合什么'
  - '- 实践优化需真实场景检验：脱离具体业务与生活场景的“空中楼阁”原则无法迭代出有效体系'
  - '...'
  sources:
  - paper: docs/202303/20230328_014.md
    role: origin
  excerpts:
  - 受瑞·达里奥的《原则》影响，先建立原则，再在原则的基础上去逐步建立和优化实践，多年过去，慢慢的形成了一套简单而有效的时间管理方法论。
  - 我们每个人都学了太多“正确”的时间管理理论，但往往空泛而很难落地。
  - 每天的时间就这么多，单位时间内的效率决定产出。
  - 在 2 月的航海中，分享了这套原则与实践。承蒙生财团队厚爱，受邀同步发到星球，请大家移步飞书观看详情
- 'no': 2
  name: 搜商 —— 信息过载时代的核心竞争力
  points:
  - '**为什么需要这个概念？**'
  - '- 信息超载时代，知识获取的瓶颈不在于“缺信息”，而在于“不会搜、搜不准、搜得慢”'
  - '- 资料整理只能提供知识的逻辑与深度，搜索技能提供知识的宽度，两者互补才能构建完整知识体系'
  - '- 提升搜索效率具有日复利效应，长期积累将产生显著的时间红利'
  - '**核心定义**'
  - '- 搜商 = 搜索心法（搜什么）+ 搜索渠道（去哪搜）+ 搜索技术（怎么搜）'
  - '- 定义为：通过搜索技能解决问题的能力，是站在前人智慧肩膀上高效解决问题的核心竞争力'
  - '**关键性质**'
  - '- 三维结构性：缺一不可，心法定方向、渠道定来源、技术定效率'
  - '- 杠杆放大性：搜索使人类首次能最大程度站在无数前辈智慧基础上解决问题，是知识获取的最高杠杆'
  - '- 复利累积性：每日微小的效率提升，长期积累产生显著时间复利收益'
  - '**典型例子**'
  - '- 评论区总结的“搜什么、去哪搜、怎么搜”三步法，被作者认可为搜商的通俗化表达'
  - '- 资料整理（深度/逻辑）+ 搜索技能（广度）= 完整知识体系的互补模型'
  - '**边界条件**'
  - '- 搜商不等于“百度一下”，需建立垂直领域的专业渠道库与检索语法体系'
  - '- 无法替代深度思考：搜索提供素材与线索，判断与决策仍需人脑完成'
  - '- 渠道时效性：平台算法、收录规则变化快，渠道库需持续维护更新'
  - '...'
  sources:
  - paper: docs/202303/20230328_017.md
    role: origin
  excerpts:
  - 搜商就是通过搜索技能解决问题的能力。
  - 搜索使人类第一次可以最大程度的站在无数前辈智慧的基础上去解决问题。
  - 搜商有三个核心:搜索心法、搜索渠道和搜索技术。
  - 资料整理可以让你拥有知识的逻辑与深度，搜索技能可以让你拥有足够的知识宽度。
  - 如果我们能够提升一下搜索的效率，长远来看，每天给我们节省的时间复利也是不小滴。
- 'no': 3
  name: 双拼输入法 —— 终身受益的效率复利投资
  points:
  - '**为什么需要这个概念？**'
  - '- 未来几年甚至十几年都将花费大量时间在打字上，全拼平均3-6次敲击/字是巨大的隐性时间成本'
  - '- 双拼将单字编码压缩至固定2次敲击，在物理层面实现显著效率跃升，属于高ROI的“生财之路”'
  - '- 输入法作为最高频工具，其微小效率提升在长周期内将积累为巨大的时间成本节约'
  - '**核心定义**'
  - '- 双拼：将汉字拼音的声母与韵母分别映射至单个按键，使每字固定仅需两次敲击即可完成输入的编码方案'
  - '- 小鹤双拼：主推方案，具备全平台原生兼容、不占用标点键、零声母规则符合拼音直觉三大工程优势'
  - '**关键性质**'
  - '- 效率决定性：单字敲击次数从全拼均值3-6次压缩至理论最小值2次，是物理层面的硬性提升'
  - '- 复利投资属性：一次性时间投资（<1个月），终身受益且无废弃风险，年化复利收益极高'
  - '- 工程适配性：需选型全平台兼容、规避移动端标点键位缺失、零声母规则符合直觉的方案（小鹤双拼最优）'
  - '- 引擎可靠性优先：输入法核心引擎不产生不可纠正的智能纠错Bug（如讯飞）优于词库丰富但有顽固Bug的输入法（如搜狗）'
  - '**典型例子**'
  - '- 敲击量化对比：“张程”全拼10次 vs 双拼4次，节省60%敲击动作'
  - '- 学习路径实测：“一下午”记键位、“一至两周”基本熟悉、“一至两月”完全熟练，熟练后稳定60-80字/分钟'
  - '- 沉浸式切换法：彻底禁用全拼、环境沉浸（桌面/聊天背景贴键位表）、社交预期管理（告知适应期慢可发语音）'
  - '- 打歌词练习法：利用歌词押韵特性（韵母高频重复）进行高频韵母键位专项肌肉记忆训练'
  - '**边界条件**'
  - '- 智能联想短板：双拼相比全拼在“智能联想/整句输入”能力上存在短板，可能影响极速连贯输入场景'
  - '- 适应期痛苦：肌肉记忆重写需强制沉浸，混用全拼会导致冲突并极大概率放弃，需心理预期管理'
  - '- 非唯一最优解：五笔（专业录入）、语音输入（特定场景）等替代方案存在，选择取决于用户场景与认知偏好'
  - '- RIME生态配置门槛：需具备基础技术能力部署配置文件、同步跨平台配置，小白用户可能面临折腾成本'
  - '...'
  sources:
  - paper: docs/202303/20230328_105.md
    role: origin
  - paper: docs/202303/ODcddHpnqoogiuxw7WqcMbv1nJb.md
    role: improve
  excerpts:
  - 简化的敲击次数，让效率有提升
  - 未来几年甚至十几年你都花较多的时间在打字上。如果不提升效率，会浪费多少时间在单纯打字上面？
  - 双拼把一个字的「声母」和「韵母」拆分开来；把每个字的声母韵母分别对应到一个特定的按键上；使得所有字的拼音只需要「敲击两个字母」就能达到全拼的效果。
  - 相比起全拼，每个词可以「节省 2-6」次的敲击次数，可以让输入更节省时间。
  - 在众多双拼方案中，云猫比较推荐「小鹤双拼」
  - 所以现在的小鹤双拼达成了「全平台兼容」
  - 小鹤双拼将零声母字的「第一个字母」定义为韵母的首字母。「昂」拼写则为「ah」，「啊」拼写为「aa」，更符合拼音的直觉，也降低上手的难度。
  - 讯飞输入法是云猫比较推荐的输入法。在拼写方面没有自作聪明的现象，只是词库有点少...支持「双键位」模式
  - 搜狗输入法最大的问题是「自作聪明」...不管你是把工资这个候选字置顶，或者把红子删除掉都无济于事。
  - 基本「一下午」就能记住大部分的键位，「一至两周」基本熟悉，「一至两月」完全熟练。
  - 云猫在学习双拼时，使用的是郝海龙老师推荐的「打歌词」方法。
  - 如果现在花不到一个月的零散时间投资到双拼上，未来打出的每一个字都会节省一点时间；那么我们把视角拉到以年为单位的时间下；可以看到积少成多，这一点点的时间投资，将带来非常可观的收益。
  - 双拼输入法你学会了，绝对是一项用了就回不去的「真香」技能。
  - 'Fan : 我花了半个月从全拼换到双拼'
  - '春风王锐 : 同样用的 BlueSky 开发的双拼练习网站，同时推荐一个测试打字速度的网站： https://dazi.kukuw.com/'
  - 'Mr.拾捌 : 我用鼠须管习惯了'
  - '成都老张 : 推荐五笔输入法（比如我现在正在用的搜狗五笔）'
  - '林叔 : 电脑端输入法也可以语音输入了呢'
  - '苏明波 : 好巧，最近刚换双拼，可惜双拼不能智能联想，不然可以更快'
- 'no': 4
  name: 持续航海 —— 用“微型确定性系统”治愈精神内耗
  points:
  - '**为什么需要这个概念？**'
  - '- 精神内耗本质是缺乏确定性正反馈，单纯心理疏导无效，需构建“微型确定性系统”'
  - '- 单次21天训练营无法解决根本性人生困境（变现/成长/连接），唯有持续复利累积才能开启新起点'
  - '- 结果目标（赚钱/引流）不可控，过程目标（打满卡）可控，聚焦过程反获超预期心理能量'
  - '**核心定义**'
  - '- 航海：生财有术社区发起的21天高强度训练营，含手册学习、每日打卡、群内分享、同城聚会等机制'
  - '- 持续航海：以21天为最小周期单元，连续多期（作者11期）复利累积，将外部约束转化为内驱习惯的长期主义策略'
  - '- 21天定律：心理学习惯养成理论，作为航海周期设计的底层逻辑，单次养成升级为长期人生策略'
  - '**关键性质**'
  - '- 正向反馈环治愈内耗：高频打卡、社群见证、导师点评构建“微型确定性系统”，是治愈内耗的最优解'
  - '- 过程目标优于结果目标：将“打满卡21天”设为核心目标，屏蔽不可控结果，反获长期复利与心理跃迁'
  - '- 三重收获维度之外的深层需求：表层为结果/成长/连接导向，深层为通过结构化训练重塑自我效能感'
  - '- 复利累积性：单次航海解决不了根本问题，N次航海复利才是通往成功的秘诀'
  - '**典型例子**'
  - '- 作者量化成果单：11期航海、211次打卡、2240里程、10套手册精读、100+高手分享复盘、10篇公开输出、1次线下聚会'
  - '- 标准化动作包：全手册精读 + 高手分享深度复盘（单期100+次） + 全勤打卡 + 多渠道强制输出（群内1次/星球3次/公众号6次） + 线下同城连接'
  - '- 心理跃迁实证：虽未获显性流量变现，但从“焦虑内耗”跃迁至“新起点”，获得长期主义的确定性感'
  - '**边界条件**'
  - '- 需高强度执行力支撑：211次打卡、100+次复盘、10篇深度输出，对时间精力要求极高，非人人可复制'
  - '- 依赖社群基础设施：需有成熟社群提供手册、教练、志愿者、圈友共战等外部约束与正反馈环境'
  - '- 非替代专业心理治疗：针对“缺乏正反馈导致的内耗”有效，严重心理障碍仍需专业医疗干预'
  - '- 幸存者偏差风险：仅展示成功案例，未统计中途放弃者比例，实际完成率可能远低于预期'
  - '...'
  sources:
  - paper: docs/202303/20230328_116.md
    role: origin
  excerpts:
  - 总共参加 11 个航海，10 个航海项目打满卡 21 天*10=210 次卡，1 个同城航海聚会打卡 1 次，航海 2240 里（精选 13 次）。
  - 21 天内学完 10 个航海项目所有的航海手册学习，并学习 100 余次群中高手分享。
  - 群中分享 1 次，知识星球分享 3 次，公众号分享 6 次。
  - 为了找到一个平台，一个圈子，吸取正能量，得到志同道合的人的正反馈，治愈我的精神内耗。
  - 有人想通过航海拿到结果（引到流量，赚到钱）；有人想从航海学习成长...；也有人想从航海链接人...当然我这三方面目的都有，但并非我想从航海中最想得到的。
  - 这便是我在生财这个平台下参加航海，并通过 21 天定律最想得到的。
  - 没有什么是 1 次航海解决不了，如果不行，那就 11 次。持续航海，才是通往成功的秘诀！
  - 通往成功的彼岸并非一早一夕能做到的，也并非这短暂的 21 天就能解决的，但至少这 21 天的航海让我人生迈入了一个新的起点。
  - 也许这次航海我没有引到很多流量，也没有赚到钱...但至少这 21 天的航海让我人生迈入了一个新的起点。
  - '评论区：太迟 : 先赞后看 少儿探索科学实验室 : 神人 shijinzhan : 太强了 高杰 : 时间管理大师[强]...'
