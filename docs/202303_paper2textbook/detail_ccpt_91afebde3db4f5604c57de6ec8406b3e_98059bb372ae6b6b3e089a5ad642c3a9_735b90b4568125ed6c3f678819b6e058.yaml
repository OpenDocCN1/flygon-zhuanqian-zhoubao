  name: AI套壳/Prompt工程变现
  points:
  - '**为什么需要这个概念？**'
  - '- 大模型能力强但通用性强、垂直场景落地弱，用户不会用/不想学提示词'
  - '- 开发原生AI应用门槛高、周期长、成本大'
  - '- 需要低门槛、快速交付、可规模化复制的中间层商业模式'
  - '**核心定义**'
  - '- 基于大模型API（GPT-3.5/4、Claude）封装垂直场景应用（Chrome插件、微信小程序、网站、Cursor编辑器）'
  - '- 或贩卖高质量Prompt/指令集，通过信息差和集成优势快速变现'
  - '**关键性质**'
  - '- 轻量级：无需训练模型，仅做应用层封装与Prompt工程'
  - '- 垂直化：针对特定场景（亚马逊选品、公众号写作、代码生成、简历优化）深度适配'
  - '- 信息差变现：用户为"不用学提示词/不用魔法上网/不用注册账号"付费'
  - '**典型例子**'
  - '- Shulex：针对亚马逊卖家开发的Chrome插件，集成ChatGPT做Listing优化/竞品分析'
  - '- ChatGPT Shortcut：分类整理的Prompt指令表，帮助用户快速调用专业提示词'
  - '- Cursor编辑器：内置GPT-4的代码编辑器，支持自动写代码/智能问答'
  - '- SteamShip：提供GPT-4免费接口调用的开发平台'
  - '**边界条件**'
  - '- 官方原生功能迭代快（如GPTs、插件商店、联网搜索）易降维打击套壳应用'
  - '- 核心护城河不在Prompt本身（易复制），而在垂直数据/工作流集成/用户习惯迁移成本'
  - '- 需处理API稳定性、成本控制、内容合规、用户隐私等工程化问题'
