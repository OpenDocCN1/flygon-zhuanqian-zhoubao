  - '- 仅适用于可标准化教学/咨询类服务（情感、职业、技能、认知），强定制服务难标品化'
  - '- 切片分发依赖直播内容质量，无优质长内容无法产出高转化切片'
  - '- 视频号用户画像偏中老年/女性/高客单，选品需匹配人群特征'
