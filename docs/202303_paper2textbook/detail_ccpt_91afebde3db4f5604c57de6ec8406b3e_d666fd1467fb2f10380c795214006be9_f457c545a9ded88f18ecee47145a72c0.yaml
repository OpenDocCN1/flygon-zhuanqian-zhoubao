    role: origin
  - paper: docs/202303/20230328_155.md
    role: apply
  excerpts:
  - 我一直坚持认为：任何的门店缺的不是“流量”，而是“留量”
  - 从赚钱的角度来说，老客户的复购和转介绍是最有价值的
  - 老客户都没有维护好，一个劲的去引流新客户，这是本末倒置了！
  - 老板一定要自己给员工配套专属的手机和专属的微信，给他们任务，让她们把客户都沉淀到手机来。
  - 记得给员工手机和微信号时，一定要签订基本的协议
- 'no': 9
  name: 老板亲自抓引流成交 —— 只有离钱最近的事，才配得上老板的时间
  points:
  - '**为什么需要这个概念？**'
  - '- 许多老板甩手掌柜：引流外包拓客团队、成交交给销售、转化靠课程顾问、复购靠教务，自己躲幕后看报表'
  - '- 外包团队不懂业务本质、不负结果责任、靠堆量赚服务费，员工无主人翁意识、推诿扯皮、离职带走客户'
  - '- 只有老板亲自下场，才能听到真实客户声音、发现转化卡点、打磨核心话术、掌握客户资产控制权'
  - '**核心定义**'
  - '- 老板亲自抓引流成交：老板作为核心销售，亲自掌握并执行引流、成交、转化、复购全链路，拒绝外包或全权委托'
  - '- 核心原则：时刻干离钱最近的事；引流、成交、转化、复购等事情只有你自己来！'
  - '**关键性质**'
  - '- 方案精准度：老板最懂产品/客户/转化路径，亲自抓才能确保方案落地不走样'
  - '- 客户资产掌控权：老板直接连接核心客户，建立个人信任锚点，非员工可替代'
  - '- 组织信号：老板亲自冲锋，团队才会跟进执行、重视细节、形成战斗力'
  - '**典型例子**'
  - '- 少儿阅读机构：100学员却养2课程顾问+1主管+1教务+1执行校长，月入不够发工资，老板一年亏掉一套房，根因：老板不亲自抓引流成交'
  - '- 咨询案例：只有老板亲自抓引流、亲自抓成交转化、亲自抓客户服务和复购的门店，生意才会日渐兴隆发达'
  - '- 同城相亲：作者从20+人团队精简至5人，核心动作：老板亲自带头高情商服务、亲自管核心客户、亲自定产品方向'
  - '**边界条件**'
  - '- 适用于中小微门店/服务业（规模<50人），大型连锁需建立“区域合伙人/店长制”下沉老板角色'
  - '- 老板亲自抓不等于老板包揽一切执行细节，核心是“把关关键节点、定标准、抓典型、带头干”'
  - '- 需配合“全员引流责任制”，老板做领头雁，员工做执行兵，形成上下同欲者胜'
  - '...'
