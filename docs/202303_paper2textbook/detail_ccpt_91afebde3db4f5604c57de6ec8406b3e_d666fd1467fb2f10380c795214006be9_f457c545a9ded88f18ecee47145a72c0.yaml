units:
- 'no': 1
  name: 选址只是入场券，转化才是赢利点 —— 别让好位置变成摆设
  points:
  - '**为什么需要这个概念？**'
  - '- 许多老板误以为选好位置（好地址）就等于生意好，实则位置只解决“被看见”的概率，不解决“被购买”的必然性'
  - '- 作者亲历双重惨痛教训：一亏选址选错无流量，二亏选址选对却无人进店，证明选址与经营是两套独立能力体系'
  - '- 只有搞定“进店率”和“转化率”，好位置才能变现，否则重金买下的好铺位就是高昂的摆设'
  - '**核心定义**'
  - '- 选址定终身是行业共识，但“选址只是入场券，转化才是赢利点”才是生存法则'
  - '- 门店转化闭环：路人曝光 → 激发兴趣 → 转化信任 → 立刻下单，缺一不可'
  - '**关键性质**'
  - '- 转化率是核心杠杆：高转化率能倒逼产品、服务、团队全链路升级，形成降维打击竞争壁垒'
  - '- 引流前提定律：无转化，不引流；转化率未达标盲目引流等同于放大亏损'
  - '- 付费引流最优定律：在转化合格前提下，付费引流因可量化ROI、可规模化，优于免费引流'
  - '**典型例子**'
  - '- 少儿美术机构A/B对比：同招100人，A转化60%收入30万，B转化35%收入16.5万，利润差13.5万；A敢打“198元12次课+送教材”组合拳，B跟进则亏死'
  - '- 摄影机构雇拓客团队引流10万人送相册，业务团队接待筛选成本极高，转化率“低到怀疑人生”'
  - '- 厦门沙茶面店“吃完摇骰子摇666免单”，极低成本引爆排队，验证单一目标+娱乐性活动设计有效性'
  - '**边界条件**'
  - '- 仅适用于已具备基础转化接待体系的门店，转化率极低时切勿投入引流资源'
  - '- 付费引流需精准核算ROI，包含隐性时间成本、机会成本、空置成本，不可只算广告费'
  - '- 爆品引流法要求爆品必须是核心招牌、高复购、高口碑产品，而非廉价赠品'
  - '...'
  sources:
  - paper: docs/202303/20230328_153.md
    role: origin
  - paper: docs/202303/20230328_154.md
    role: improve
  - paper: docs/202303/QdPkd1IM2orhqFxaAXCcM6fynsc.md
    role: apply
  excerpts:
  - 我自己就曾经吃了两大亏：一亏选址选错了，哭；二亏选址选好了，但客户愣是不进店，再哭。
  - 如果你的转化率做的很差劲，那么你多拼命去引流都无济于事，甚至你会进入一个怪区，引流越狠，亏损越狠。
  - 整个总结，我们可以用陈勇老师的公式：激发兴趣-建立信任-立即下单。
  - 假设一条街上相隔 50 米，有两个少儿美术机构...A 机构每次做批量转化的转化率都能达到 60%，另外一家B 机构只能做到常规的 35%！
  - 这个剁椒鱼头只要 9.9 元/份，每天限量供应 150 份！与其不断的去策划各种不相关的引流品，倒不如直接用心打磨一个超级爆品
- 'no': 2
  name: 买客户思维 —— 把引流当投资，ROI正向就无限加码
  points:
  - '**为什么需要这个概念？**'
  - '- 传统老板痴迷“免费引流”，实则隐性成本（时间、人力、空置、机会）极高且不可控'
  - '- 引流本质是买卖：花钱买精准客户进店，只要算清投入产出比（ROI）为正，就应无限加大投放'
  - '- 打破“舍不得花钱”心魔，建立“所有好的客户本质上都是买回来的”商业本能'
  - '**核心定义**'
  - '- 买客户思维：将付费引流视为投资，公式为（引流带来利润 - 引流成本）> 0 即持续加码'
  - '- 包含投放广告、进付费圈子、异业合作、付费引流品等一切可量化的获客手段'
  - '**关键性质**'
  - '- 可量化、可规模化、可复制：付费渠道数据透明，跑通模型后可快速横向复制放大'
  - '- 竞争门槛高：不敢/不愿付费的竞争对手自动出局，形成天然护城河'
  - '- 速度快：免费引流靠运气和时间，付费引流靠确定性和杠杆'
  - '**典型例子**'
  - '- 仁材药店“药”字灯箱：投入500-800元+日电费5元，日增1客利润10元，160天回本，年净增利润3650元，微小投入撬动注意力'
  - '- 同城相亲行业：毛利近100%，同城付费投流（抖加/信息流）百元级获客成本远低于客户LTV，同行不敢投形成降维打击'
  - '- 作者建议：能用付费的就用付费，直接在抖音/小红书投放引流，效果更快更好，只要ROI正向'
  - '**边界条件**'
  - '- 前提是后端转化体系成熟（转化率达标），否则付费引流等于烧钱'
  - '- 需建立精细的数据追踪体系（UTM/邀请码/专属链接），精准核算单渠道ROI'
  - '- 免费引流并非完全弃用，但在商业化成熟期，付费引流是主力、免费是辅助'
  - '...'
  sources:
  - paper: docs/202303/20230328_154.md
    role: origin
  - paper: docs/202303/20230328_155.md
    role: apply
  - paper: docs/202303/QdPkd1IM2orhqFxaAXCcM6fynsc.md
    role: apply
  excerpts:
  - 把“付费引流”当成一笔投资去看待，例如你花了 1000 元去做投放，引流来的人最终有 1500 元的利润，那么你就可以加大这笔投入了，这就是最简单的换算思维，也称之为：买客户思维。
  - 相亲行业毛利百分之百，怎么投都投的起。这个行业同城团队类型的很少有人投付费，降维打击。
  - 算一笔账，一个‘药’字灯箱预计500-800元，24小时亮灯，每天电费5元。每一天争取一位客户，利润10元，160天后成本回收...如果没有这个灯箱，每天利润损失10元，一年下来，损失的费用达3650元。
  - 所有好的客户本质上都是买回来的
  - 就算你是做免费的引流，但是你花在引流的时间成本，机会成本，员工工资成本，店铺的空置成本等只会更大！
- 'no': 3
  name: 转化滑滑梯模型 —— 让客户像坐滑梯一样自然滑入店内下单
  points:
  - '**为什么需要这个概念？**'
  - '- 门店转化非单一环节，而是连贯系统工程：注意力缺失则后续全断裂，信任缺失则促单无效，互惠缺失则动力不足'
  - '- 传统门头设计重美观轻功能，实则每个物理组件都应承载明确转化功能（曝光/信任/促单）'
  - '- 需要一个可视化、可执行、可复制的门店转化物理空间设计标准'
  - '**核心定义**'
  - '- 转化滑滑梯模型：门头设计为系统工程，客户如同坐滑梯般自然完成 曝光(180度灯光灯箱矩阵) → 信任(身份+承诺+价值观显性化) → 下单(显性优惠+会员二维码双重互惠)
    全过程'
  - '- 映射陈勇《超级转化率》公式：激发兴趣 → 建立信任 → 立即下单'
  - '**关键性质**'
  - '- 转化首因律：注意力是转化必要前提，必须通过物理手段最大化“被看见”概率'
  - '- 信任显性化定律：信任不靠口述靠“写”在门头上（身份锚定/风险承诺/价值观），实现一眼知信'
  - '- 互惠触发原则：促单动作需建立在兴趣与信任之上，且举手可及（二维码/显眼告示）'
  - '- 双重属性组件：单一物理组件（如会员灯箱）可同时承载激发兴趣与互惠促单双重功能'
  - '**典型例子**'
  - '- 仁材药店：拐角“药”字灯箱+竞对旁50米外超大灯箱构建立体曝光；老字号身份+三大承诺（退货/比价/服务）+价值观建立信任；黄色优惠告示+会员福利灯箱双轨促单'
  - '- 竞品门头对照：无优惠、无承诺、无信任建设，呈“裸奔”状态，同地段同人流下转化全军覆没'
  - '**边界条件**'
  - '- 适用于实体门店、同城服务等强依赖物理空间转化的业务'
  - '- 需配合店内接待流程（进店后的转化承接），门头只负责“引进来”，店内负责“留下来”'
  - '- 存量位置增值论：即使偏僻内巷、竞争对手占优位置，精细化门头运营仍可反超转化率'
  - '...'
  sources:
  - paper: docs/202303/QdPkd1IM2orhqFxaAXCcM6fynsc.md
    role: origin
  - paper: docs/202303/20230328_154.md
    role: improve
  excerpts:
  - 整个店面的门头做了大量的灯箱，但每个灯箱都有明确的功能，从曝光到转化形成了一个滑滑梯，让客户就像坐滑梯，自然的滑到店内，然后下单。
  - 转化的第一步：让他们先注意到我们，看向我们。是的，就是这么简单，但是我们做到最大限度的让客户注意到我们吗？
  - 信任的元素可以写出来，让客户一眼就能知道，别一味要等待客户尝试你的产品听你口述才能知道，既降低客户决策成本，还赢得客户信任。
  - 整个总结，我们可以用陈勇老师的公式：激发兴趣-建立信任-立即下单。
  - 以上某些地方其实具备双重属性的，例如会员信息灯箱，既可以激发兴趣，还可以产生互惠促进下单。
- 'no': 4
  name: 超级爆品引流法 —— 用招牌菜当鱼饵，精准收割同频客群
  points:
  - '**为什么需要这个概念？**'
  - '- 传统引流靠送柴米油盐、玩具等廉价赠品，吸引的是羊毛党，转化极低、成本高、品牌受损'
  - '- 门店最核心、口碑最好、复购最高的招牌产品（爆品），天然具备最高吸引力与精准筛选力'
  - '- 以爆品为引流品，同步实现“引流获客+品牌建立+连带销售”三合一，性价比极高'
  - '**核心定义**'
  - '- 爆品即最佳引流品定律：打磨核心招牌产品为引流品，设置极致性价比（成本价/微利价）+严格限量，制造稀缺感与话题性'
  - '- 引流品≠赠品，引流品是利润转化的入口，而非单纯成本中心'
  - '**关键性质**'
  - '- 精准筛选：爱吃剁椒鱼头的才会为9.9元排队，天然过滤非目标客群'
  - '- 连带转化：引流品亏本/微利，靠连带销售（如顺带带走面包、饮料）实现整单盈利'
  - '- 品牌资产沉淀：爆品引流同时强化品牌核心认知，而非稀释品牌价值'
  - '**典型例子**'
  - '- 湖南菜馆“剁椒鱼头9.9元/份，每日限量150份”，引爆进店流量，超半数客人顺带带走其他面包/菜品'
  - '- 面包店“9.9元/5个”限量爆品，客流排队，连带带走高毛利饮料、沙拉'
  - '- 作者断言：“我发现他们最牛逼的引流品就是他们门店的爆品！”'
  - '**边界条件**'
  - '- 爆品必须具备极高性价比感知（价格锚定远低于心理预期）且品质过硬，否则砸招牌'
  - '- 限量供应是核心机制，不限量则无稀缺感、无话题性、成本失控'
  - '- 仅适用于有明星单品、可标准化复制的餐饮/零售/服务门店，非标定制类需谨慎'
  - '...'
  sources:
  - paper: docs/202303/20230328_154.md
    role: origin
  excerpts:
  - 我发现他们最牛逼的引流品就是他们门店的爆品！
  - 这个剁椒鱼头只要 9.9 元/份，每天限量供应 150 份！
  - 与其不断的去策划各种不相关的引流品，倒不如直接用心打磨一个超级爆品，这个爆品就可以把你所有客户全部都吸引过来！
  - 9.9 元/5 个，超划算又好吃！10 个中有超过一半的都会顺便带走几个其他面包
- 'no': 5
  name: 引流触点布局 —— 里里外外布下100+条带钩子的鱼竿
  points:
  - '**为什么需要这个概念？**'
  - '- 单一引流入口极其脆弱，流量来源单一、转化路径易断裂、抗风险能力为零'
  - '- 客户在门店内外物理空间的每一个停留点（收银台、厕所、海报、周边社区、异业联盟），都是潜在触点'
  - '- 必须构建全方位、多层级、高密度的引流触点网络，将“被动等客”转为“主动撒网”'
  - '**核心定义**'
  - '- 引流触点布局：在门店内部（收银台/桌子/菜单/门头/海报/休息区/过道/背景墙/厕所等）与外部（周边500-1000米异业联盟/社群/社区）密集设置不少于100个带“钩子”（行动理由）的引流入口'
  - '- 钩子=添加理由：如“扫码送资料/领优惠/进群/抽奖”，严禁无理由的“姜太公钓鱼”式海报'
  - '**关键性质**'
  - '- 全覆盖：物理空间无死角，客户视线/动线所至皆有引流入口'
  - '- 高相关：钩子设计紧扣目标客群痛点/爽点/利益点，非泛泛而谈'
  - '- 标准化可复制：形成SOP，新店开业即可快速部署触点网络'
  - '**典型例子**'
  - '- 门店内：收银台放“扫码领试听课”，厕所贴“扫码进妈妈群领绘本”，菜单印“加微信送教案”'
  - '- 门店外：周边幼儿园/小学/母婴店异业联盟互换引流，社区业主群发“周末免费体验课”海报'
  - '- 作者要求：“围绕你门店的里里外外最少布置 100 条鱼竿”'
  - '**边界条件**'
  - '- 触点数量非越多越好，而是“够用就好”，需匹配后端接待/转化/服务能力，避免咨询量爆发导致服务崩塌'
  - '- 每个钩子需测试转化率，低转化钩子需及时替换，避免形成视觉盲区'
  - '- 外部触点需维护异业关系（利益绑定/定期走访/送烟酒/请客），非一次性铺设即永久有效'
  - '...'
  sources:
  - paper: docs/202303/20230328_154.md
    role: origin
  excerpts:
  - 围绕你门店的里里外外最少布置 100 条鱼竿
  - 门店内部：收银台、桌子、菜单、门头、海报、休息区、过道走廊、背景墙、厕所、洗手间等等都可以。
  - 你所有做的引流海报，必须要有钩子，也就是添加你的理由！千万不要做那种“姜太公钓鱼”的海报
  - 你可以可以借鉴别人的思路，不要抄袭别人的方案。客源同质化最大的根源就在于方案的同质化！
- 'no': 6
  name: 营销日历体系 —— 用体系化节奏对抗临时起意的混乱
  points:
  - '**为什么需要这个概念？**'
  - '- 多数门店活动靠拍脑门、蹭热点、临时起意，执行仓促、物料不备、团队不齐、复盘缺失，ROI极低'
  - '- 营销非单次事件，而是有节奏的系统工程：年/季/月/周四级节奏，常规/节日/大促/随机/会员日五类活动'
  - '- 提前规划才能从容筹备，确保每周有活动、有备无患、持续制造进店理由'
  - '**核心定义**'
  - '- 营销日历体系：按维度提前规划全年活动节奏，包含常规活动、节日活动、门店大促、随机活动、会员日等，做到每周有活动、有备无患'
  - '- 核心原则：4月活动3月筹备，大活动提前1-2个月备料/练兵/预热'
  - '**关键性质**'
  - '- 确定性：将营销从“不确定的灵感”转为“确定的排程”，团队心智稳定、执行有序'
  - '- 累积性：长期坚持形成“周周有活动、月月有大促、年年有节奏”的品牌心智，客户形成预期性进店习惯'
  - '- 可迭代：每次活动复盘数据（引流量/转化率/客单价/ROI），沉淀为下一周期优化依据'
  - '**典型例子**'
  - '- 作者建议：“你需要提前把今年/每个季度/每月/每周的活动都提前安排好！做到每周都要有活动”'
  - '- 单一目标活动设计法：一次只实现1目标、针对1类人，如“护士子女免费学”、“6月生孩子半价”、“XX社群专属”、“摇骰子666免单”'
  - '**边界条件**'
  - '- 需配合“私人订制引流方案”，日历是骨架，方案是血肉，不可生搬硬套他人日历'
  - '- 活动频次不可过密导致团队疲劳、客户麻木，需平衡“高频触达”与“稀缺感”'
  - '- 随机活动预留缓冲，应对突发热点/竞品动作/库存压力等非预期机会'
  - '...'
  sources:
  - paper: docs/202303/20230328_154.md
    role: origin
  excerpts:
  - 你需要提前把今年/每个季度/每月/每周的活动都提前安排好！做到每周都要有活动
  - 只要你做好营销日历，那么你 4 月份要做的活动，你从 3 月份就开始筹备了
  - 比较有效的活动规则是 1 次只实现 1 个目标，一次只针对一类人
  - 每次吃完面后，有一次摇骰子的机会，摇出 666 就免单！
- 'no': 7
  name: 私人订制引流方案 —— 拒绝盲目跟风，只做适合自己的精准动作
  points:
  - '**为什么需要这个概念？**'
  - '- 市场充斥“万能引流方案”、“最新玩法”，老板盲目抄袭导致方案同质化、客源同质化、陷入恶性价格战'
  - '- 每家门店的目标、基础、竞争环境、转化路径、资源禀赋完全不同，通用方案必然失效'
  - '- 唯有基于自身现状量身定制，在过往成功经验基础上迭代优化，才能追求精准而非数量'
  - '**核心定义**'
  - '- 私人订制引流方案：基于门店当下目标、基础、竞争环境及转化路径量身定制的引流策略，反对盲目跟风抄袭“新鲜方案”'
  - '- 核心口诀：引流方案要私人订制，借鉴思路不抄袭方案，追求精准不追求数量'
  - '**关键性质**'
  - '- 差异化：方案差异化决定客源差异化，避免同质化恶性竞争'
  - '- 进化论：方案非一成不变，需随门店阶段、竞争格局、资源变化持续迭代'
  - '- 老板亲定：核心方案老板必须亲自把关/亲自执行/亲自复盘，不可外包'
  - '**典型例子**'
  - '- 少儿培训机构抄袭“大场面送礼品抽奖”引流羊毛党，亏得一塌糊涂；而定制“骰子免单/特定人群专属”低成本精准引流'
  - '- 同城相亲：小红书/微博布局女性账号（资料卡片/活动现场/街头采访/红娘口播），抖音/快手布局男性账号，分平台分性别精准获客'
  - '**边界条件**'
  - '- 前提是老板深度了解自身业务数据（转化率/客单价/复购率/流失原因），无数据不订制'
  - '- 订制不等于封闭，需持续对标标杆、吸收新知，但吸收后必须“消化吸收再排泄”成自身方案'
  - '- 初创期可适度模仿验证，但必须快速转向订制化，否则永远做跟随者'
  - '...'
  sources:
  - paper: docs/202303/20230328_154.md
    role: origin
  - paper: docs/202303/20230328_155.md
    role: apply
  excerpts:
  - 你的引流方案一定要私人订制，要根据当下的引流目标，门店的基础，周围的竞争等，结合你的转化路径进行私人订制引流方案
  - 引流的数量绝对不是多多益善，而是够用就好！
  - 客源同质化最大的根源就在于方案的同质化！恶性的价格战竞争就是由此而来了
  - 小红书微博：高质量女性客户——女性占比百分之 90 抖音快手：男性客户——男生占比百分之 80
- 'no': 8
  name: 留量大于流量 —— 私域沉淀才是门店的永久护城河
  points:
  - '**为什么需要这个概念？**'
  - '- 外部流量（平台/广告/路人）是暂时的、不可控的、租来的；私域留量（沉淀客户关系）是永久的、可控的、自己的'
  - '- 老客户复购率高、转介绍成本低、信任基础牢，是利润主力；新客户获取成本高、转化周期长、流失率高'
  - '- 许多老板本末倒置：老客户没维护好，拼命引流新客户，导致“前门进、后门出”'
  - '**核心定义**'
  - '- 留量大于流量：核心稀缺资源非外部流量，而是将进店/路过客户沉淀至自有私域（老板/企业名下手机微信），通过标签化运营、朋友圈营销、激励裂变挖掘老客复购与转介绍价值'
  - '- 私域资产归属：老板配备专属工作手机/微信给员工，法律协议锁定客户资源归属，防员工离职带走资产'
  - '**关键性质**'
  - '- 资产化：沉淀在自有载体中的标签化客户关系网，是可估值、可交易、可传承的核心资产'
  - '- 飞轮效应：老客复购 → 转介绍 → 新客进来 → 变老客 → 复购转介绍，形成可持续增长飞轮'
  - '- 抗风险：平台算法变/广告涨价/竞品抢流，私域留量基本盘不受影响，现金流安全垫'
  - '**典型例子**'
  - '- 同城相亲：小助手账号累计2万+好友，聊天记录百GB级，通过“资料授权机制”（征得同意再给微信）+“小助手账号资产化管理”构建高信任私域池'
  - '- 实体门店：全员引流责任制+专属手机隔离，绩效挂钩引流指标，老板掌握客户资产所有权'
  - '- 作者警示：“员工又不是你儿子，终有一天会离职的，到时候他带着几百个上千个客户就跑了”'
  - '**边界条件**'
  - '- 私域运营需长期投入（朋友圈日更/社群运营/客户关怀），非建群发广告即可'
  - '- 需建立分层运营体系（新客/活跃/沉睡/流失/大客户），差异化触达策略'
  - '- 物理隔离（专属手机/微信）+ 法律协议（归属条款）+ 管理机制（交接SOP/数据备份）三位一体，缺一不可'
  - '...'
  sources:
