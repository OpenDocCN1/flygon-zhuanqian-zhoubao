- 'no': 10
  name: 全员引流与私域资产归属 —— 让每个员工成为引流兵，让每个客户归属老板
  points:
  - '**为什么需要这个概念？**'
  - '- 单靠老板引流瓶颈极大，全员（导购/教师/技师/前台/保洁）皆是触点，人人引流才能释放组织最大获客能量'
  - '- 员工离职高发期，无资产隔离机制则客户随人走，门店血本无归；必须物理隔离（专属手机/微信）+ 法律锁定（归属协议）'
  - '- 引流无责任制 = 无人引流；绩效不挂钩引流指标 = 引流是口号'
  - '**核心定义**'
  - '- 全员引流责任制：建立全员引流责任，绩效与引流指标（加微信数/进群数/成交转化数）硬挂钩'
  - '- 私域资产归属隔离：老板自掏腰包配专属工作手机/微信号给员工，签订协议约定客户资源归公司所有，员工离职交接账号不带走好友'
  - '**关键性质**'
  - '- 激励对齐：员工引流有奖（现金/提成/晋升），不引流有罚（扣绩效/影响晋升），利益驱动行为'
  - '- 资产安全：物理隔离（手机/号归公司）+ 法律固化（协议/保密/竞业）+ 管理兜底（交接SOP/定期备份/违规追责）'
  - '- 可复制：新员工入职即领专属手机/号，按SOP执行引流动作，快速上手，规模化复制无压力'
  - '**典型例子**'
  - '- 实体门店：老板给每个员工配专属手机微信，引流任务挂绩效，离职交接账号密码，客户留存门店'
  - '- 同城相亲：小助手岗位高流失（平均半年），单号百GB聊天记录迁移极难，作者通过专属手机+账号资产化管理+高薪招高情商长留存者缓解痛点'
  - '**边界条件**'
  - '- 专属手机/微信成本需计入运营预算（作者小助手工资7-10k+手机成本），ROI需覆盖'
  - '- 需建立聊天记录定期云备份/导出机制，防手机损坏/丢失导致数据灭失'
  - '- 法律协议需专业起草（保密条款/竞业限制/违约赔偿/管辖法院），口头约定无效'
  - '...'
