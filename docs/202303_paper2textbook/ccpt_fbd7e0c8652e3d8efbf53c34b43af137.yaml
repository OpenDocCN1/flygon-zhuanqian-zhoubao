paper: docs/202303/20230328_033.md
desc: 该素材为亦仁在生财有术社群运营实战中记录的一则短文，核心阐述了"做事必遇难题、难题随规模放大、甚至存在无解难题"的认知，并以拉新群被封、账号被封为具体案例，主张面对不可控风险与重大挫折时应保持"无脆弱、无纠结、无内耗，干就完了"的强心智与行动力，展现了创业者/运营者在高不确定性环境下的生存哲学与实战心法。
concepts:
- name: 做事难题必然性
  desc: 指出只要在推进事情，就会持续遭遇新难题，且事情规模越大、面临的难题越大，甚至存在根本无解的难题，这是做事的客观规律而非异常状态。
  is_original: true
  excerpt:
  - 只要在做事，就会不停的遇到新的难题，事情做的越大，要解决的难题就越大，好多问题甚至是无解的。
- name: 平台风控不可控风险
  desc: 指依托微信等第三方平台进行私域运营、社群裂变时，因平台规则变更或风控策略触发，导致社群被封、账号被封、好友资产归零等不可抗力风险事件。
  is_original: false
  excerpt:
  - 结果昨天触发微信风控，群都被封了。
  - 昨天鱼丸也被莫名其妙永封了好几个号，失去了几万个好友。
- name: 零内耗行动力
  desc: 面对巨大挫折与无解难题时，不产生脆弱、纠结、内耗等负面情绪内耗，而是立即接受现实、调整策略、继续前进的执行力特质。
  is_original: true
  excerpt:
  - 没有脆弱没有纠结没有内耗，干就完了，继续前进。
methods:
- name: __overview__
  desc: 亦仁面对社群运营重大挫折（拉新群被封、核心账号被封）的实战应对方法论：认知难题常态化 -> 承认平台风控不可控 -> 杜绝情绪内耗 -> 立即执行"干就完了/继续前进"。
  excerpt:
  - 只要在做事，就会不停的遇到新的难题...
  - 结果昨天触发微信风控，群都被封了。
  - 昨天鱼丸也被莫名其妙永封了好几个号，失去了几万个好友。
  - 没有脆弱没有纠结没有内耗，干就完了，继续前进。
theorems:
- name: 创业/做事的核心是解决难题而非逃避难题
  desc: 做事的本质是不断解决难题，难题规模随事业规模正相关，部分难题无解，因此核心竞争力在于面对无解难题时的心理韧性与持续行动能力，而非寻求完美避坑指南。
  excerpt:
  - 只要在做事，就会不停的遇到新的难题，事情做的越大，要解决的难题就越大，好多问题甚至是无解的。
  - 有时候就特别佩马云这样的大佬，得克服了多少巨大的困难，才走到今天这一步。
  - 没有脆弱没有纠结没有内耗，干就完了，继续前进。
- name: 私域流量资产归属于平台而非个人
  desc: 建立在微信等中心化平台之上的私域流量（群、好友、账号）所有权与控制权最终掌握在平台手中，运营者仅拥有使用权，随时面临被收回（封号、封群）的风险。
  excerpt:
  - 结果昨天触发微信风控，群都被封了。
  - 昨天鱼丸也被莫名其妙永封了好几个号，失去了几万个好友。
findings:
- name: 生财有术新一期拉新规模与风控触发实况
  desc: '[evidence] 素材记录了生财有术新一期拉新活动预约群达6000+人规模，但随后触发微信风控导致群被封，核心运营账号（鱼丸）多个被永久封禁、损失数万好友的具体数据事实。'
  excerpt:
  - 最近在帮生财有术新一期拉新，花了很长时间预约群里面有 6000 多个人了，结果昨天触发微信风控，群都被封了。
  - 昨天鱼丸也被莫名其妙永封了好几个号，失去了几万个好友。
- name: 团队零内耗协作模式验证
  desc: '[claim] 评论区成员"六妹"宣称团队在危机中表现出"完全没有内耗，没有沮丧，只有办法和行动"的协作状态，印证了亦仁倡导的零内耗文化在团队层面的落地效果。'
  excerpt:
  - '六妹 : 一起参与其中，团队完全没有内耗，没有沮丧，只有办法和行动'
- name: 微信风控下的资产挽回需求
  desc: '[claim] 评论区成员"盐铁"提出"有没有方法可以导出微信好友，找回咱未来的生财大军"，反映出私域资产被封后，运营者对数据资产导出、好友关系迁移的强烈刚需与无力感。'
  excerpt:
  - '盐铁 : 有没有方法可以导出微信好友，找回咱未来的生财大军！'
