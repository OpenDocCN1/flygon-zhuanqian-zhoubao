life_analogy:
- 想象服务设计是一位**隐形的舞伴**：
- '- **用户** = 蒙着眼、提着重物、站在晃动地板上的舞者'
- '- **环境物理线索（扶手/台阶/动线）** = 舞伴在关键节拍伸出的、恰到好处的手'
- '- **下意识选择** = 舞者无需思考、凭本能抓住那只手、完成下一个动作'
- '- **显性引导（标识/语音/教程）** = 边上有人喊口令、举牌子‘把手伸这儿’'
- '- **微观触点缺失** = 关键时刻舞伴的手缩回了、或伸到了够不着的位置'
- 就像顶级舞伴从不教你跳舞、只在你即将失衡时把支撑点放在你本能伸手的轨迹上，最好的服务设计也不是教用户怎么用，而是把‘怎么用’设计进物理环境的肌理里。
summary:
- concept: 下意识选择
  desc: 用户在约束下零认知负荷、凭环境线索自动完成的最优决策
- concept: 环境约束下的借力路径
  desc: 用户受限身体在动态环境中寻找的支撑点与发力路径匹配度，三要素：可用肢体、支撑点位置、动力传递链路
- concept: 微观服务触点
  desc: 决定体验成败的微小物理细节（扶手、台阶、门把手等），具有不可见性、杠杆放大效应、组合爆炸性
- concept: 情境化行为观察法
  desc: 现场捕捉行为偏差→多维约束交叉分析→归因推导设计原则，核心三步法
- concept: 好的服务让客户下意识选择它定理
  desc: 服务设计最高境界：通过环境微细节适配用户本能反应，使用户无需思考即完成最优交互
- concept: 扶手-惯用手匹配度
  desc: 扶手空间位置与用户可用发力肢体的力学匹配程度，二元性强（匹配=可用/不匹配=不可用），可量化为距离/高度/角度/力矩
- concept: 动态环境下‘就近原则’优于‘偏好原则’
  desc: 首选方案物理不可行时，用户自动触发‘当前可行且最近’的备选方案，非妥协而是生存本能的满意决策
- concept: 台阶与扶手缺失叠加的隐性门槛
  desc: 微小缺陷组合在特定人群/情境下非线性跃迁为绝对壁垒（0→1质变），单项合格≠组合合格
exercises:
- 'no': 1
  title: 现场行为偏差捕捉与三维归因实战
  contents:
  - 选择一个你熟悉的公共服务场景（如医院挂号大厅、地铁换乘通道、超市收银台、APP注册流程），进行 30 分钟隐蔽观察，记录：
  - 1. 发现至少 3 个‘计划行为→实际行为’的偏差案例（如：用户走向 A 通道→返身走 B 通道；用户点击‘注册’→放弃转向‘微信登录’）
  - 2. 对每个偏差案例，同步记录三维约束证据：
  - '   - 环境物理属性（空间布局、设施参数、标识系统）'
  - '   - 用户身体状态（携带物品、肢体受限、年龄/体能特征）'
  - '   - 情境动态约束（人流密度、时间压力、设备运行状态、光线/噪音）'
  - 3. 交叉分析定位关键决策变量，提炼 1 条可迁移的微观触点优化原则
  - 回答问题：
  - '- 为什么单纯询问用户‘为什么选这里’往往得不到真实原因？'
  - '- 如何判断一个微观触点是‘锦上添花’还是‘生死攸关’的决定性杠杆？'
- 'no': 2
  title: 扶手-惯用手匹配度工程化测试设计
  contents:
  - 针对某具体座椅/扶手系统（如公交车、地铁、办公椅、病床护栏），设计一套‘动态借力匹配度’测试方案：
  - 1. 定义测试人群画像：覆盖左右手惯用、不同身高百分位、单手/双手受限、老年/康复等关键分层
  - 2. 设定动态情境参数：车辆启动加速度、侧向晃动幅度、上座时间窗口、地面摩擦系数
  - 3. 确定量化指标与合格阈值：
  - '   - 扶手-手横向距离 ≤ ? cm'
  - '   - 扶手垂直高度差（相对坐高） ∈ [? , ?] cm'
  - '   - 最大有效发力力矩 ≥ ? N·m（对抗惯性力需求）'
  - '   - 单手盲操作成功率 ≥ ?%'
  - 4. 设计‘组合失效’测试用例：台阶高度 × 扶手缺失 × 单手受限 × 动态晃动
  - 回答问题：
  - '- 静态‘够得着’与动态‘借得上力’的本质区别是什么？如何在实验室低成本模拟动态约束？'
  - '- 左撇子约 10%，通用设计应提供对称方案还是可调节方案？决策依据是什么？'
- 'no': 3
  title: ‘好的服务让客户下意识选择它’定理的跨域迁移练习
  contents:
  - 选取以下任一数字产品/服务场景，应用该定理重新审视并重构 3 个关键微观触点：
  - 场景 A：移动端 APP 的‘首次授权弹窗’与‘隐私设置入口’
  - 场景 B：智能家居‘回家模式’的传感器触发逻辑与手动兜底开关
  - 场景 C：线上课程‘学习进度提醒’的推送时机、文案、落地页跳转
  - 重构要求（每个触点）：
  - 1. 识别用户在该触点面临的‘三重约束’：认知带宽、身体/操作便利性、情境时间压力
  - 2. 诊断现有设计是否存在‘显性引导过度’或‘隐性线索缺失/错位’
  - 3. 给出‘零认知负荷、最小身体负荷’的重构方案（调整位置/时机/文案/默认值/交互路径）
  - 4. 定义可观测的‘下意识选择发生率’指标（如：授权通过率、模式自动触发率、课程续学率）
  - 回答问题：
  - '- 数字界面的‘物理环境’等价物是什么？其稳定性与物理环境有何本质不同？'
  - '- 关键不可逆操作（删除、支付、隐私授权）为何不能适用‘下意识选择’？边界在哪里？'
