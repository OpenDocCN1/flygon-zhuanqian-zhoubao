life_analogy:
- 想象普通人创富如同**在荒野中建立一条可持续的补给线**：
- '- **风向标** = 经验丰富的向导留下的脚印与标记，告诉你哪里有水、哪里有猎物、哪条路最安全'
- '- **组合创新** = 不用自己冶炼铁矿造刀，而是拿成熟的瑞士军刀（工具）、成熟的地图（平台）、成熟的狩猎陷阱设计（模式）组装成你的生存套件'
- '- **MVP思维** = 先用树枝草绳搭个简易庇护所（最小闭环）能避风雨、过一夜，验证这地方能住人，再盖木屋、砖房'
- '- **批量思维** = 不押注单一陷阱，而是按标准化图纸批量布设陷阱网（矩阵），用概率统计保证总有收获，单个失效不伤大局'
- '- **RPA自动化** = 训练几只聪明的猎犬（数字员工）帮你巡陷阱、拎猎物、守营地，你只负责决策在哪里设陷阱、怎么改良陷阱'
- '- **私域沉淀** = 在营地旁挖窖、建仓、养畜（用户资产），把流动的猎物（公域流量）变成囤积的粮草（私域信任与复购），不管外面风雪怎么变，仓里有粮心不慌'
- '- **赚钱即利他** = 你帮部落解决吃饭、安全、工具问题（利他），部落自然给你份额、地位、保护（赚钱），利他越深、覆盖越广，你在部落地位越稳'
- '- **认知变现差** = 同样是荒野，新手只见树木，老猎人见兽径、见水源、见季节规律；差距不在体力在认知，买老猎人地图（进社群）、跟老猎人打几次猎（实战MVP）、自己画地图总结（复盘沉淀）最快缩小差距'
- '- **过程即奖赏** = 别盯着‘能不能猎到大獠牙’（结果）发愁，盯着‘今天陷阱改良了没’、‘今天猎犬训顺了没’、‘今天地图画准了没’（过程），每天睡前清单打钩，焦虑自然消失，大獠牙迟早是你的'
- '- **长期主义** = 荒野生存不是冲刺赛，是耐力赛。人们真正敬佩你时，是发现过了这么久你居然还在那里、还在改良陷阱、还在画地图、还在训猎犬。时间是朋友，存续是信号'
- '- **创富公式** = （向导情报+套件组装）×（陷阱网+猎犬）×（窖仓+部落声望）× 时间。核心变量是你‘每天改良陷阱的速度’与‘每次复盘总结的深度’，而非初始背包里有多少干粮'
summary:
- concept: 风向标
  desc: 行业头部玩家/账号/产品/平台功能等预示趋势的标杆，通过监控其动作降低决策不确定性
- concept: 组合创新
  desc: 将成熟工具、平台、模式重新组装生成新变现路径，核心公式：成熟工具×成熟平台×成熟模式=新机会
- concept: MVP思维
  desc: 最低成本跑通获客-转化-交付闭环验证需求，设定止损线避免沉没成本，验证通过后再规模化投入
- concept: 批量思维
  desc: 用标准化SOP与概率统计对抗单点不确定性，通过矩阵化、工具杠杆实现单人日产200条、18店群规模
- concept: 私域沉淀
  desc: 将公域流量通过合规钩子引入微信生态，构建高信任、高复购、可长期运营的用户资产，是高客单/长周期项目最终归宿
- concept: RPA自动化
  desc: 非程序员的数字员工：影刀/按键精灵/指纹浏览器做手脚，ChatGPT API做大脑，平台API做接口，边际成本趋近零
- concept: 赚钱即利他定律
  desc: 商业本质是价值交换：买方感知价值>价格，卖方价格>成本，双向获益。利他深度×广度×频次=商业价值总量
- concept: 认知变现差
  desc: 同一信息/工具/趋势，认知高者已变现，认知低者还在围观。缩小路径：进社群、买复盘、跑MVP、沉淀方法论
- concept: 过程即奖赏原则
  desc: 聚焦过程（学技能、做内容、搭系统、解难题）的确定性成长，结果作为副产品自然到来，内驱力对抗结果焦虑
- concept: 长期主义复利论
  desc: 坚持做难但正确的事（建IP、沉淀私域、练硬技能、做资源整合），存续即信号，时间做朋友，唯一壁垒是比对手更能扛
- concept: 普通人低门槛创富公式
  desc: （风向标洞察+组合创新MVP）×（批量执行/工具杠杆）×（私域沉淀/品牌复利）×时间。核心变量：执行力与复盘迭代速度
exercises:
- 'no': 1
  title: 风向标拆解与MVP设计实战
  contents:
  - 选定一个你感兴趣的细分赛道（如：小红书考公资料、视频号中医养生、抖音AI绘图教程）：
  - 1. 列出该赛道 Top 5 的风向标账号/产品/玩家
  - 2. 对每个风向标拆解：流量从哪来？转化路径怎么设计？产品结构/定价/交付如何？
  - 3. 基于拆解结果，设计一个组合创新 MVP：用什么工具？发什么平台？用什么商业模式？
  - 4. 制定 7 天验证计划：每天具体动作、预算上限、止损线（如连续 3 天无咨询/投入 200 元无产出即停）、成功判定标准（首单/10 咨询/ROI>1）
  - 回答问题：
  - '- 为什么要监控风向标的‘核心动作’而非‘结果数据’？'
  - '- 组合创新中，哪个模块（工具/平台/模式）最难替代？为什么？'
  - '- MVP 阶段为何坚决不用 RPA/团队/投流？'
- 'no': 2
  title: 批量思维 SOP 标准化与私域引流路径设计
  contents:
  - 假设你已跑通一个单账号日产 10 条视频、周出 2 单的‘短视频带货’最小闭环：
  - 1. 将该闭环拆解为标准化 SOP 文档，包含：选品标准、文案模版、剪辑参数、发布时间、话术库、售后流程，要求‘新人拿到文档 1 小时内能上手操作’
  - 2. 设计账号矩阵扩张方案：从 1 号扩至 10 号，解决环境隔离（指纹浏览器/手机卡）、素材去重（达芬奇/剪映参数）、分发自动化（影刀 RPA/蚁小二）、数据汇总（飞书多维表格）四大工程问题
  - 3. 设计私域引流全链路：公域钩子设计（如‘评论 666 送选品表’）→ 引流动作（主页/粉丝群/私信/小风车/企微客服）→ 承接话术（欢迎语/标签打标/分层服务）→
    复购体系（低价课/高价咨询/陪伴服务/分销裂变）
  - 回答问题：
  - '- SOP 中哪些环节‘标准化收益最高’？哪些环节‘必须保留人工判断’？'
  - '- 矩阵扩张到第 5 个账号时，通常会遇到什么管理瓶颈？如何预防？'
  - '- 私域引流中，如何平衡‘引流动作合规性’与‘引流效率’？'
- 'no': 3
  title: RPA+AI 自动化生产线搭建最小闭环
  contents:
  - 选择一个高频重复运营场景（如：知乎好物自动回答、亚马逊 POST 自动发布、BOSS 直聘批量投递/发布岗位、小红书批量发笔记）：
  - 1. 梳理人工操作全流程，标注每一步的：操作对象、输入数据、判断逻辑、输出结果、异常分支
  - 2. 划分‘手脚’（RPA：影刀/按键精灵/UIBot/Automa）与‘大脑’（AI：ChatGPT API/提示词工程/本地模型）边界：确定性流程归 RPA，非确定性生成/判断归
    AI
  - 3. 搭建最小可运行 Demo：单账号、单任务、单循环跑通，包含：环境准备（指纹浏览器/独立 IP）、登录态维护、核心流程编排、延时随机化防封、异常捕获重试/告警、执行日志记录
  - 4. 计算 ROI：人工单次耗时/成本 vs RPA 单次耗时/成本（含开发调试摊销），预估多少执行次数回本
  - 回答问题：
  - '- 为什么说‘环境一致性是 RPA 生死线’？列举 3 个最常见的环境差异导致的失败案例'
  - '- AI ‘大脑’输出不可控（幻觉/格式错误）时，RPA ‘手脚’层该如何设计容错？'
  - '- 平台 UI 更新/反爬升级导致 RPA 失效，维护成本何时会超过人工成本？如何建立定期评估机制？'
- 'no': 4
  title: 认知跃迁复盘与创富公式自测
  contents:
  - 基于‘普通人低门槛创富公式’对自己过去 6 个月的副业/创业尝试进行复盘：
  - 公式 = （风向标洞察 + 组合创新 MVP） × （批量执行/工具杠杆） × （私域沉淀/品牌复利） × 时间
  - 1. 给每个乘法项打分（0-1 分，0 表示完全缺失，1 表示成熟运行），计算综合得分
  - 2. 找出得分最低的 1-2 项作为‘短板’，制定未来 3 个月的针对性提升计划（含具体动作、里程碑、考核指标）
  - 3. 记录过去 6 个月的‘认知变现差’缩小轨迹：进了哪些社群？买了哪些复盘/课程？跑通了哪些 MVP？沉淀了哪些方法论/SOP？
  - 4. 评估‘过程即奖赏’落实度：是否设定了过程目标（如日更/周复盘/月迭代）？是否因结果焦虑（涨粉慢/不出单）而中断执行？如何用‘打卡/复盘/公开输出’将过程显性化为资产？
  - 回答问题：
  - '- 公式为乘法而非加法，意味着什么？如果某项为 0，其他项再强结果为何为 0？'
  - '- 如何区分‘认知储备’与‘认知资产’？你的笔记/收藏/课程有多少转化为了可执行的 SOP/案例库/人脉？'
  - '- 长期主义与‘死磕错误方向’的边界在哪里？设计一个‘每 3-6 月战略复盘止损清单’'
