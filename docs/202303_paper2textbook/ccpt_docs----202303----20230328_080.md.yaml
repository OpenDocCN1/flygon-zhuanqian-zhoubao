paper: docs/202303/20230328_080.md
desc: 该素材为生财有术社群2月美团电商航海实战教练刘家齐的项目复盘分享导语，核心介绍了作者从美团8年销售运营管理经验到创业转型的背景，确立了其在美团电商实操、团队管理（招聘、SOP、过程把控、薪酬设计）及项目0-1/1-10复制放大方面的实战权威性，旨在帮助学员判断项目可行性。
concepts:
- name: 美团电商航海实战
  desc: 生财有术社群组织的为期一个月的美团电商实战训练营项目，旨在通过实操指导学员入局美团电商。
  is_original: false
  excerpt:
  - 在刚刚结束的 2 月生财美团电商航海实战中
- name: 项目 1-10 复制放大
  desc: 指将已跑通的商业模式（1）进行标准化、规模化复制扩张至更大规模（10）的过程，涉及SOP梳理、团队管理等核心动作。
  is_original: true
  excerpt:
  - 助力大家在项目 1-10 的复制放大
methods:
- name: __overview__
  desc: 基于教练实战经验的复盘分享法，通过公开过往大厂管理经验与创业实战数据建立权威背书，进而输出项目可行性判断框架，指导学员知生意知自己。
  excerpt:
  - 过往在美团有八年的销售运营管理经验，管理带宽在 110 人左右
  - 一年零五个月从公司管理到“个体户”再到公司组建
  - 大家可以结合分享根据自己的情况判断项目的可行性，知生意知自己
theorems:
- name: 实战经验决定指导有效性
  desc: 只有具备大厂核心业务管理经验与完整创业周期实操经验（从管理者到个体户再到组建公司）的教练，才能有效指导学员完成项目0-1验证及1-10复制放大。
  excerpt:
  - 过往在美团有八年的销售运营管理经验，管理带宽在 110 人左右
  - 一年零五个月从公司管理到“个体户”再到公司组建
  - 助力大家在项目 1-10 的复制放大
- name: 知生意知自己是项目决策核心
  desc: 学员判断项目可行性的前提是结合教练分享的实战认知，对标自身资源禀赋与能力圈，做到知悉生意模式与知悉自身条件的双重确认。
  excerpt:
  - 大家可以结合分享根据自己的情况判断项目的可行性，知生意知自己
findings:
- name: 教练背景画像验证
  desc: '[evidence] 素材证实教练刘家齐具备美团8年销售运营管理经验（管理带宽110人）及1年5个月完整创业周期经验（公司管理-个体户-再组建公司），具备覆盖招聘、SOP、过程把控、薪酬设计的全链路管理能力。'
  excerpt:
  - 过往在美团有八年的销售运营管理经验，管理带宽在 110 人左右
  - 一年零五个月从公司管理到“个体户”再到公司组建
  - 大家关于招聘、SOP 梳理、过程把控、薪酬设计等公司管理方面的问题咱们也可以多多交流
- name: 航海实战已结束
  desc: '[evidence] 2月生财美团电商航海实战已于分享发布前结束，教练基于该实战周期产出认知分享。'
  excerpt:
  - 在刚刚结束的 2 月生财美团电商航海实战中
