paper: docs/202303/20230328_021.md
desc: 该素材为作者杨洋基于个人从业经历（医药职业教育培训、OEM合作模式）及加入“生财有术”社群后的复盘总结，核心在于揭示成人教育培训行业中“证书项目全流程运营”与“OEM招商模式”作为核心赚钱杠杆的实操逻辑，并主张通过深度拆解成熟社群（如生财）的商业模式骨架，实现避坑、快速落地与变现。
concepts:
- name: 证书项目全生命周期运营
  desc: 指从证书立项、分发代理、收集学员资料上报、完成报名到拿证的完整闭环流程，是成人职业教育培训的标准化交付模型。
  is_original: false
  excerpt:
  - 独立策划了健康管理师证书项目，从证书立项，到分发代理，收学员资料上报，完成报名，拿到证书的整个环节均有参与。
- name: OEM招商模式
  desc: 教育培训机构将自建课程体系、技术平台（小程序/APP）、运营体系打包输出给合作方（代理商），由合作方负责招生，机构负责教务与证书，双方分成的合作模式。
  is_original: false
  excerpt:
  - 网课项目...课程分销模式的搭建，代理合作招商模式，OEM 招商逻辑，出品自己的网课品牌整个流程及具体实操办法
  - 我们的网课搭建从 18 年做了 OEM 模式合作，18 年营业额 700 万，19 年营业额 1200 万，20 年营业额 1500 万。而这个业绩的来源仅仅是新增了
    OEM 的合作方案。
- name: 商业模式骨架拆解
  desc: 剥离表层营销话术与内容包装，提取成熟商业案例（如生财有术）的底层赚钱逻辑、流量获取、产品分层、转化交付等核心结构要素。
  is_original: true
  excerpt:
  - 在不断的拆解生财的生财模式的时候，更是发现了大宝藏...把包裹在厚厚内容下的骨架展现给大家。
- name: 反韭菜/去伪存真思维
  desc: 通过系统性学习和拆解成熟商业社群的核心逻辑，建立独立判断力，识别市面上培训课程的共性套路，从而避免重复付费踩坑（被割韭菜）。
  is_original: true
  excerpt:
  - 市面上培训课程培训的内容都涵盖在了生财里边，如果不想在做韭菜，那就好好的把生财里边的内容仔细琢磨研究透彻，当你把生财的内容研究明白了，自此再也不被割韭菜！
methods:
- name: __overview__
  desc: 作者基于‘实战复盘+社群拆解+模型迁移’的三位一体方法论：以个人过往项目实操数据为信用背书，以加入头部社群参与航海实战获取前沿玩法（如AI数字人直播），以结构化拆解社群商业模式骨架指导新项目选品与落地。
  excerpt:
  - 从 2014 年起就在做一件事，医药圈职业教育培训...最终因为公司业务线下滑离开这个行业。
  - 去年 7 月份加入生财...参加了 5 次航海，尤其 2 月份的航海收益最大，参加了 ChatGPT+AI 绘画航海，摸透了 ChatGPT+数字人的直播模式，还遇到了现在项目的合作伙伴
  - 在不断的拆解生财的生财模式的时候，更是发现了大宝藏...把包裹在厚厚内容下的骨架展现给大家。
- name: OEM合作放大器
  desc: 在具备标准化课程产品、技术交付平台（小程序/APP）、教务运营SOP的前提下，通过招募渠道合伙人（代理商）承担获客成本，自身聚焦供应链与交付，实现营收规模跃迁（700万->1500万/年）的具体执行方法。
  excerpt:
  - 教育培训行业网课项目，从课程录制，到技术搭建，小程序，APP 制作，课程分销模式的搭建，代理合作招商模式，OEM 招商逻辑，出品自己的网课品牌整个流程及具体实操办法
  - 我们的网课搭建从 18 年做了 OEM 模式合作，18 年营业额 700 万，19 年营业额 1200 万，20 年营业额 1500 万。而这个业绩的来源仅仅是新增了
    OEM 的合作方案。
- name: 航海式实战复盘法
  desc: 利用社群组织的限时、主题化、带作业反馈的‘航海’训练营机制，快速验证新技术（ChatGPT/AI绘画/数字人）的商业化落地路径，同时沉淀高信任度合作伙伴关系。
  excerpt:
  - 从进入生财开始，到现在参加了 5 次航海，尤其 2 月份的航海收益最大，参加了 ChatGPT+AI 绘画航海，摸透了 ChatGPT+数字人的直播模式，还遇到了现在项目的合作伙伴
theorems:
- name: 成人教育培训的核心杠杆在于‘供应链标准化’与‘渠道裂变’的分离
  desc: 教育机构的核心竞争力不应是单打独斗的获客，而应构建标准化的‘证书/课程供应链’（选品、录制、技术、教务、证书下发），通过OEM模式释放渠道端的获客能力，实现业绩指数级增长。
  excerpt:
  - 我们的网课搭建从 18 年做了 OEM 模式合作，18 年营业额 700 万，19 年营业额 1200 万，20 年营业额 1500 万。而这个业绩的来源仅仅是新增了
    OEM 的合作方案。
  - 教育培训行业网课项目，从课程录制，到技术搭建...OEM 招商逻辑，出品自己的网课品牌整个流程及具体实操办法
- name: 头部付费社群是行业‘通用商业教科书’，拆解其模式优于购买零散课程
  desc: 成熟商业社群（如生财有术）沉淀了跨行业的通用赚钱模型（流量、产品、转化、交付），市面上售卖的单点培训课程多为其子集；系统拆解社群底层逻辑可建立‘元认知’，实现一劳永逸的避坑与选赛道。
  excerpt:
  - 市面上培训课程培训的内容都涵盖在了生财里边，如果不想在做韭菜，那就好好的把生财里边的内容仔细琢磨研究透彻，当你把生财的内容研究明白了，自此再也不被割韭菜！
  - 在不断的拆解生财的生财模式的时候，更是发现了大宝藏，把包裹在厚厚内容下的骨架展现给大家。
- name: 新技术红利期的捕捉路径 = 头部社群实战训练营（航海）+ 高频迭代 + 合伙人筛选
  desc: 面对ChatGPT/AI数字人等新技术浪潮，普通个体难以独自完成从技术理解到商业闭环的跨越；最优路径是付费进入头部社群的垂直训练营，利用强制节奏与同伴压力快速跑通MVP，并在此过程中筛选可靠合伙人。
  excerpt:
  - 参加了 5 次航海，尤其 2 月份的航海收益最大，参加了 ChatGPT+AI 绘画航海，摸透了 ChatGPT+数字人的直播模式，还遇到了现在项目的合作伙伴
findings:
- name: OEM模式引入前后的业绩跃迁证据
  desc: '[evidence] 作者亲历公司引入OEM合作模式前后三年营收数据：2018年700万 -> 2019年1200万 -> 2020年1500万，且明确归因于‘仅仅是新增了OEM的合作方案’，验证了该模式在职教赛道的放大效应。'
  excerpt:
  - 我们的网课搭建从 18 年做了 OEM 模式合作，18 年营业额 700 万，19 年营业额 1200 万，20 年营业额 1500 万。而这个业绩的来源仅仅是新增了
    OEM 的合作方案。
- name: 生财有术社群内容覆盖面的实测结论
  desc: '[claim] 作者宣称经过拆解验证，‘市面上培训课程培训的内容都涵盖在了生财里边’，认为研究透生财即可覆盖市面主流付费课程知识点，实现去韭菜化。'
  excerpt:
  - 市面上培训课程培训的内容都涵盖在了生财里边，如果不想在做韭菜，那就好好的把生财里边的内容仔细琢磨研究透彻，当你把生财的内容研究明白了，自此再也不被割韭菜！
- name: 航海训练营对新技术变现与社交资本的双重收益
  desc: '[evidence] 作者参加5次航海，特别是ChatGPT+AI绘画航海，直接产出两大成果：1. 掌握‘ChatGPT+数字人直播’这一具体商业化落地模式；2.
    筛选并锁定了当前新项目的核心合作伙伴。'
  excerpt:
  - 参加了 5 次航海，尤其 2 月份的航海收益最大，参加了 ChatGPT+AI 绘画航海，摸透了 ChatGPT+数字人的直播模式，还遇到了现在项目的合作伙伴
