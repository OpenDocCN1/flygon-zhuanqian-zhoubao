paper: docs/202303/20230328_096.md
desc: 该素材通过记录公交车上一位老人因车辆启动导致首选座位（1号）缺乏便捷扶手而无法顺利坐下，被迫转向具备扶手的就近座位（2号）的微观观察，揭示了“好的服务是会让客户下意识的选择它”这一核心主张：优秀的服务设计应通过环境线索（如扶手位置）无感引导用户行为，降低认知与体力负荷，使用户在特定情境下自然而然地做出最优选择。
concepts:
- name: 下意识选择
  desc: 指用户在特定情境约束（如车辆震动、双手被占、时间压力）下，无需刻意思考、权衡利弊，仅凭环境物理线索（如扶手可得性、距离远近）即可自动完成的最优行为决策。
  is_original: true
  excerpt:
  - 好的服务是会让客户下意识的选择它
  - 因此成为老人下意识的选择
- name: 环境约束下的借力路径
  desc: 指用户在物理受限环境（如启动中的公交）中，为完成动作（如上座）而寻找的身体支撑点与发力路径的匹配度。良好的服务设计需预判并适配用户的自然借力习惯。
  is_original: true
  excerpt:
  - 在启动的车辆里不好发力，需要借用工具帮助自己迈上那个小阶梯
  - 首选的“1”号并没有明显的扶手，由于自己手拎袋子，“1”号座位的座位扶手与自己可借力手同方向，导致借力不好借
- name: 微观服务触点
  desc: 指服务系统中微小的、常被忽视的物理设施细节（如座位旁的扶手、台阶高度），它们在特定使用情境下直接决定用户体验的成败，是“下意识选择”发生的物理载体。
  is_original: true
  excerpt:
  - “2”号旁有扶手而“3”号旁没扶手（图 4 是对比图）
  - 观察到座位都有一个小阶梯，需要迈步上抬才能上到座位上（图 6）
methods:
- name: __overview__
  desc: 情境化行为观察与归因推导法：在真实服务场景中捕捉异常行为（换座），通过多维度现场取证（座位物理属性、用户身体状态、环境动态约束），反向推导行为发生的物理与认知机制，进而提炼服务设计原则。
  excerpt:
  - 回到现场，我看了几个点，然后从中推导或许能推测这现象发生背后的理由。
  - 1.老人首次选择的座位【回到“3”号去对比“2”号】有以下不同... 2.老人背着单边包，手拎白色塑料袋... 3.观察到座位都有一个小阶梯... 结合 1.2.3
    点推导...
- name: 行为偏差捕捉
  desc: 关注用户‘计划行为’（走向1号座位）与‘实际行为’（坐上2号座位）的偏差，将偏差视为服务设计缺陷的信号而非用户随机性。
  excerpt:
  - 本来是选择我对面的前排“1”号位，都已经走过去准备坐上去了，但在公交启动的情况下选择回来我这边的“2”号座位
  - 为什么在已选择且要准备坐上去的时候，突然改变选择的座位？
- name: 多维约束交叉分析
  desc: 将环境物理约束（台阶、扶手分布）、用户身体约束（单边包、手提袋占用双手、老年人发力困难）、情境动态约束（车辆启动晃动、时间紧迫）三维交叉，定位关键决策变量（扶手可得性与惯用手匹配）。
  excerpt:
  - 结合 1.2.3 点推导，老人可能在选择 1 号转换 2 号的理由有可能是...
  - 需要借用工具帮助自己迈上那个小阶梯，但是首选的“1”号并没有明显的扶手，由于自己手拎袋子，“1”号座位的座位扶手与自己可借力手同方向，导致借力不好借
theorems:
- name: 好的服务是会让客户下意识的选择它
  desc: 服务设计的最高境界不是提供显性的指引或选项，而是通过物理环境的微细节（如扶手位置、动线设计）适配用户在特定约束下的本能反应，使用户无需思考即可完成最优交互。
  excerpt:
  - 好的服务是会让客户下意识的选择它
  - 一场公交上老人临时的换座，让我看到了非常有趣知识，更让我想起一句话“好的服务是会让客户下意识的选择”
- name: 服务细节的容错性决定下意识选择的发生率
  desc: 当服务触点（扶手）满足用户在极端约束（单手、震动、台阶）下的生理刚需时，用户会下意识选择该触点；反之，微小的细节缺失（无扶手/扶手位置反人因）会打断行为流，迫使用户进行高认知负荷的补救性决策。
  excerpt:
  - 在启动的车辆里不好发力，需要借用工具帮助自己迈上那个小阶梯，但是首选的“1”号并没有明显的扶手... 一时间没能上座。在这期间，行驶的公交让老人被动的选择就近座位，因为我隔壁的“2”号位具备扶手又是最近的距离，因此成为老人下意识的选择。
findings:
- name: 扶手位置与惯用手匹配度对上座成功率的决定性影响
  desc: '[evidence] 素材通过现场观察发现：老人手提袋子导致单手可用，首选座位1号扶手位置与可用手同侧导致借力力学结构失效（无法跨身体借力），直接造成上座失败；而2号座位扶手位置适配可用手，且距离最近，支撑了成功上座。'
  excerpt:
  - 老人背着单边包，手拎白色塑料袋（图 5）
  - 首选的“1”号并没有明显的扶手，由于自己手拎袋子，“1”号座位的座位扶手与自己可借力手同方向，导致借力不好借，一时间没能上座。
  - 因为我隔壁的“2”号位具备扶手又是最近的距离，因此成为老人下意识的选择。
- name: 动态环境下‘就近原则’优于‘偏好原则’的行为切换机制
  desc: '[evidence] 观察到老人初始有明确偏好（选择1号），但环境动态约束（车辆启动晃动、上座时间窗口压缩）触发了‘被动就近选择’机制：当首选方案在物理上不可行时，用户不再寻找最优偏好，而是选择‘当前可行且最近’的方案（2号座位）。'
  excerpt:
  - 本来是选择我对面的前排“1”号位，都已经走过去准备坐上去了，但在公交启动的情况下选择回来我这边的“2”号座位
  - 在这期间，行驶的公交让老人被动的选择就近座位，因为我隔壁的“2”号位具备扶手又是最近的距离，因此成为老人下意识的选择。
- name: 台阶高度与扶手缺失叠加形成的隐性服务门槛
  desc: '[evidence] 素材记录了座位存在‘小阶梯’（图6），需‘迈步上抬’；结合启动车辆的不稳定性，该台阶对老年群体构成体力门槛。扶手的缺失将此门槛从‘可跨越’变为‘不可跨越’，揭示了微小设施缺陷在特定人群/情境下被放大为服务失败根因的现象。'
  excerpt:
  - 观察到座位都有一个小阶梯，需要迈步上抬才能上到座位上（图 6）
  - 在启动的车辆里不好发力，需要借用工具帮助自己迈上那个小阶梯
