paper: docs/202303/20230328_172.md
desc: 该素材系统阐述了基于百度竞价推广的“冷门/蓝海项目”实操方法论，核心逻辑为：通过选品验证筛选出利润空间大、同行竞争弱、价格不透明的产品；以低成本开户（2400元）测试投放，利用搜索广告“精准获客”引流至私域微信成交；建立“测品-验品-投放-优化-复投”的闭环体系。素材详细拆解了账户搭建（计划/单元/创意/关键词/否词）、落地页转化设计、跨平台投放策略复用（巨量/聚光）及避坑指南，强调“选品重于投放、页面重于策略、策略重于关键词”的层级优先级，并将投放思维延伸至认知升级与生活决策。
concepts:
- name: 百度竞价冷门/蓝海项目
  desc: 通过百度搜索广告投放，寻找价格不透明、同行竞争弱、利润率高的冷门产品，以付费流量获客并在私域成交的商业模式。
  is_original: false
  excerpt:
  - 百度竞价冷门项目，是通过从百度上找到一些蓝海产品，通过投放广告获取流量，卖出产品的
  - 找到百度上正在投放广告的产品中自己能打得过的同行，自己开个户去投放广告，截取流量来卖这款产品
- name: 搜索广告 vs 信息流广告
  desc: 区分‘人找货’（搜索广告，意图强、精准度高）与‘货找人’（信息流广告）两种投放模式，作者主攻搜索广告。
  is_original: false
  excerpt:
  - 信息流：货找人，搜索广告：人找货，搜索广告是最精准的广告。
  - 我做的就是这个，也尝试过信息流，不赚钱也就没继续学
- name: 长期投放即盈利验证
  desc: 核心判断逻辑：若有同行在某平台持续长期（半年、一年）投放广告，则该项目必然盈利；不盈利则是自身运营问题。
  is_original: true
  excerpt:
  - 有同行在投放，记住这句话，有人长期投放的，它就不可能不赚钱
  - 无论什么项目，如果有一个人一直在做，半年，一年都在做，那这个项目就不可能不赚钱，如果不赚钱就是自己不赚钱
- name: 价格不透明产品
  desc: 选品核心标准：价格相对不透明，便于加价获取利润空间覆盖广告成本。典型品类包括虚拟资料、滋补品、玉石、檀香、机械、无牌电子产品等。
  is_original: false
  excerpt:
  - 价格透明是相对的，没有绝对透明或者不透明。我们找的也都是相对不透明的产品
  - 例如：虚拟资料，滋补品，玉石，檀香，机械，无牌电子产品等等
- name: 三步选品法（选品-验品-干品）
  desc: 选品流程标准化：①选品（淘宝搜索/商家店铺/5118长尾词挖掘三种渠道）；②验品（淘宝销量验证需求、百度长期投放验证盈利、关键词规划师验证搜索量）；③干品（测品不达标果断砍掉）。
  is_original: true
  excerpt:
  - 同时我也把选品分成 3 个小结：①选品 ②验证产品 ③干掉产品
  - 行内的两句话：①万物皆可投 ②百度不倒，竞价到老
- name: 低价/高价产品差异化测品模型
  desc: 针对不同客单价产品设定差异化测试标准：低价产品看单品ROI、关键词/搜索词/刷量清洗，亏损300元止损；高价产品看加粉成本承受力（3倍预算测试）、同行转化流程可复制性、自身转化率达标（如利润2000/单、转化15%、加粉50元则扩量）。
  is_original: true
  excerpt:
  - 低价：投放一单的利润，还不赚钱，并且去看关键词，搜索词，无刷量，就可以删掉...一般词没问题赔钱超过 300 我就干掉了
  - 高价：先定好自己能承受的加粉成本，然后投放 3 倍的加粉成本...利润 2000/ 每单，转化率 15%，加粉成本 50/ 每粉，那就，加词，放匹配，加价，上同类产品，多开户抢流量，各种扩量
- name: 账户基建‘减法’原则
  desc: 账户搭建初期遵循‘最小流量原则’：关闭所有扩流功能（智能匹配、ocpc等），关闭自动出价，手动控制预算/地域/时段/否词，规避平台算法‘坑钱’风险。
  is_original: true
  excerpt:
  - 拿到账户第一件事，把能扩大流量的，先全部关掉
  - 出价后面这个框看清楚：都是什么自动，就是百度想给你玩点花样，干掉它
- name: 落地页‘信任-恐慌-干货-实景-钩子’转化结构
  desc: 高客单价产品落地页标准化结构：人物故事建立人设信任 -> 恐惧营销制造紧迫感 -> 干货展示专业度 -> 客户反馈/采摘实景证明源头优势 -> 低阻力加微信钩子（一键复制微信号+引导话术）。
  is_original: true
  excerpt:
  - 这个页面的关键点：人物，故事，简介，恐慌，干货，客户反馈，采摘实景，加微信领取优惠
  - 就是说，尽量少的给用户增加步骤，每一步都有可能让用户不再加我
- name: 平台算法黑箱认知
  desc: 投放操作（增删词、改出价）触发平台算法整体重新分配流量，效果变化非单一操作直接因果，且算法持续迭代，投放者只能在可控范围内逐步优化，不可完全掌控。
  is_original: true
  excerpt:
  - 我们的投放，和用户之间，是有一个平台算法的，就是调动投放策略，平台对你的调动做出判断，再分配给不同的用户
  - 是因为我删了这个词后，平台感觉到我有什么意思，整体调整的结果...平台的算法在不断迭代的，不能以极长的以往的经验去判断整体调整
- name: 流量控制五大杠杆通则
  desc: 跨平台通用的流量控制逻辑：地域越广/时段越全/词品越多/出价越高/限制越少 → 流量越多越杂；反之则精准可控。
  is_original: false
  excerpt:
  - ① 投放地域，越多，流量越多 ② 投放时段，越全，流量越高 ③ 投放的词，产品...越多流量越多 ④ 出价越高，流量越多 ⑤ 限制越少，流量越多，也越杂 反之亦然
- name: 达人投放‘低试错-可控-快放大’模型
  desc: 将投放概念外延至达人合作：找小/腰部达人降低试错成本，利用不同风格控制流量方向，筛选合适风格后同款达人铺货快速放大。
  is_original: true
  excerpt:
  - 找小达人，或者腰部达人，他们便宜----试错成本够低 每个博主风格不同----流量方向可控 一但找到合适的，同风格达人，快速铺铺货----可以快速放大
- name: 投放决策优先级金字塔
  desc: 避坑核心原则，按重要性排序：选品 > 落地页 > 投放策略(计划/单元) > 关键词/搜索词/创意数量。强调创意多给平台选择权降低点击成本。
  is_original: true
  excerpt:
  - （1）选品重于投放 （2）投放页面重于投放策略 （3）投放策略重于关键词以及搜索词 （4）创意尽量多
- name: 试错成本认知重构
  desc: 将‘试错成本’从门槛重构为工具：在可承受范围内无限投入认知/知识付费（复利效应），并将投放思维（低成本试错、快速反馈、放大成功）应用于生活决策（如送花维持关系）。
  is_original: true
  excerpt:
  - 最后希望大家不要把自己能够承受范围内的试错成本，当成门槛
  - 我在我可以承受范围内的关于知识，认知方面花钱是无限花...复利的效果非常强大
methods:
- name: __overview__
  desc: 百度竞价冷门项目全流程标准化操作手册（SOP）：选品挖掘(3渠道) → 产品验证(3维度) → 低/高价差异化测品 → 账户基建(减法原则) → 分层投放策略(计划/单元/创意/关键词/否词)
    → 私域落地页转化结构 → 数据驱动优化扩量 → 跨平台策略复用 → 达人投放外延。
  excerpt:
  - 六个步骤：1、找到一款自己能打得过的产品 2、一个可以正常投放百度账户... 3、准备一个承接流量的微信号 4、把这款产品通过百度账户投放广告... 5、在微信上把产品卖出去
    6、赚的钱复投到广告中
  - 选品分成 3 个小结：①选品 ②验证产品 ③干掉产品
- name: 三渠道选品挖掘法
  desc: ①淘宝搜索法：按品类关键词(教程/黑科技/野生/加盟)搜竞品及同店关联品；②商家店铺法：深挖单品商家其他关联SKU；③5118长尾词挖掘法：工具批量导出长尾需求词反推产品。
  excerpt:
  - 一共有 3 种选品方法 ① 淘宝搜索 ② 商家店铺 ③ 5118 长尾词
  - 去搜索特定的关键词教程，课程，资料等...特定的关键词：黑科技，机器，风水工具等等...特定关键词：野生，天然，机器，培训班，加盟等
- name: 三维产品验证模型
  desc: 需求端：淘宝购买人数证明市场存量；供给端：百度同行长期投放(半年+)证明变现可行性；流量端：关键词规划师周搜索量测算天花板（如二胡80/周 vs 人参7900/周决定收入上限）。
  excerpt:
  - ① 淘宝购买人数（证明这个产品有需求） ③ 百度有人长期投放（证明在百度上能赚钱） ③ 百度关键词规划师里搜索量（这个代表有人在百度找这个产品）
  - 这个数据就决定了，我们能赚多少钱
- name: 账户分层搭建SOP
  desc: 计划层：按产品/地域/时段划分维度命名，设预算防跑飞，改点击出价模式，设时段地域溢价(倍数相乘)，加计划否词。单元层：同计划维度命名，关闭自动出价/自动定向/智能匹配等‘自动’功能，填主域名品牌名，加单元否词。创意层：每单元≥2条(建议4-5条)，抄同行优质创意，配图落地页链接。关键词层：手动出价设上限，匹配模式控宽窄(精准/短语/广泛)，上传生效。
  excerpt:
  - 从计划开始分，到单元，创意，关键词
  - 计划名称 按照什么维度划分就写什么...预算 一定要设置预算...出价模式 平台默认出价模式为是增强，我们要换成点击...否词 意思是，搜索什么词，不要展现我的广告...创意
    建议最少添加两条创意...关键词 匹配方式就是限定我们投放词可以匹配出来的搜索词的宽度...出价 就是，我们愿意为这个词出的最高价格
- name: 高客单私域落地页设计法
  desc: 遵循销售漏斗逻辑设计单页：Header(人物/故事/简介建信任) → Pain Point(恐慌/痛点造迫切) → Authority(干货证专业)
    → Social Proof(客户反馈/实景证源头) → CTA(一键复制微信号+优惠钩子+引导话术)，极致减少用户操作步骤。
  excerpt:
  - 页面的关键点：人物，故事，简介，恐慌，干货，客户反馈，采摘实景，加微信领取优惠
  - 就是说，尽量少的给用户增加步骤，每一步都有可能让用户不再加我
- name: 跨平台投放策略复用框架
  desc: 识别各平台(巨量/聚光/百度)账户结构同构性：计划/单元/创意/关键词/定向对应关系；核心策略‘建策略-投预算-赚钱续投/不赚钱调换/砍掉重来’通用；流量杠杆五大通则(地域/时段/词量/出价/限制)通用。
  excerpt:
  - 广告组--百度的计划 计划--百度的单元 创意---百度的创意 关键词---百度的关键词
  - 本质上是一样的，计划，单元，创意，关键词...工具，能让我赚钱就行，我不需要懂，会用就行了
theorems:
- name: 同行长期投放=市场盈利铁律
  desc: 若某平台有竞争对手持续投放广告超过半年至一年，该赛道必然存在盈利空间；自身不盈利归因于运营执行而非赛道伪命题。
  excerpt:
  - 有同行在投放，记住这句话，有人长期投放的，它就不可能不赚钱
  - 无论什么项目，如果有一个人一直在做，半年，一年都在做，那这个项目就不可能不赚钱，如果不赚钱就是自己不赚钱
- name: 选品三要素：利润覆盖广告、价格不透明、能打过同行
  desc: 可投放产品必须同时满足：①单品利润>获客成本+履约成本；②价格体系不透明便于溢价；③落地页/销售流程/供应链具备超越现有同行的能力。
  excerpt:
  - 选品本质上肯定是要有利润的产品，因为我们有广告费，需要用利润覆盖广告费和成本，这也是为什么选择价格不透明的产品，方便加价。
  - 一定要保证，自己能打得过同行，这样才能保证能抢到流量变现的顺畅度，才能保证赚钱
- name: 投放层级决策优先级定律
  desc: 优化投放效果时，决策影响力呈指数级递减：选品赛道选择(一票否决) > 落地页转化率(杠杆) > 账户策略架构(骨架) > 关键词/搜索词/创意细节(皮毛)。创意数量多寡直接影响平台评分与点击单价。
  excerpt:
  - （1）选品重于投放 （2）投放页面重于投放策略 （3）投放策略重于关键词以及搜索词 （4）创意尽量多...创意多了，平台的选择就会更多...相对来说点击价格也会降低
- name: 平台算法不可控与有限可控边界
  desc: 单一操作(删词/加词)触发算法整体重新建模，结果非线性因果；算法持续迭代导致历史经验失效。投放者只能控制‘结构搭建/预算/出价/否词/创意’等显性参数，接受‘流量分配’为黑箱输出。
  excerpt:
  - 是因为我删了这个词后，平台感觉到我有什么意思，整体调整的结果
  - 平台的算法在不断迭代的，不能以极长的以往的经验去判断整体调整...我们的投放并不是我们能完全掌控的，只能在可掌控范围内，逐步优化
- name: 试错成本即杠杆而非门槛
  desc: 在可承受风险范围内，试错成本是获取确定性认知、加速复利增长的杠杆工具。适用于投放测品(小额多品测试)、认知付费(知识复利)、生活决策(送花换情绪价值)。
  excerpt:
  - 最后希望大家不要把自己能够承受范围内的试错成本，当成门槛
  - 我在我可以承受范围内的关于知识，认知方面花钱是无限花...复利的效果非常强大
findings:
- name: 二胡教程周搜索量仅80次，人参周搜索量7900次，直接决定收入天花板差异
  desc: '[evidence] 百度关键词规划师数据显示：二胡教程周搜索量80，人参周搜索量7900(日均1100+)，搜索量量级差异直接决定了该产品潜在流量上限与可变现规模。'
  excerpt:
  - 比如：二胡教程，周搜索量 80，就代表平均一周搜有 80 次搜索
  - 咱们再看下人参，这相当于一周搜索 7900 次，平均每天 1100 多次搜索。这个数据就决定了，我们能赚多少钱
- name: 低价产品测品止损线：单品亏损超300元且无刷量问题直接砍掉
  desc: '[evidence] 作者实战数据支撑：投放二胡教程消费200元，单一关键词消费180元、免费搜索词消费150元、疑似刷量词消费198元，经否词/删词优化后仍不盈利则直接停止。账户截图显示几十个赔钱产品均执行此标准清理。'
  excerpt:
  - 一般词没问题赔钱超过 300 我就干掉了
  - 最下面有几十个产品都是非常赔钱的
- name: 高价产品扩量阈值：加粉成本≤承受成本1/3、转化率≥15%、单利润≥2000元
  desc: '[claim] 作者设定的高价产品盈利模型：预设加粉成本200元/个，实测50元则进入下一轮；利润2000元/单、转化15%、加粉50元时，触发‘加词、放匹配、加价、上同类、多开户’全维度扩量动作。'
  excerpt:
  - 如果预算是 200/1 个微信，投出来是 50，可以继续向下一步测试，投出来 400，那就可以直接放弃了
  - 利润 2000/ 每单，转化率 15%，加粉成本 50/ 每粉 那就，加词，放匹配，加价，上同类产品，多开户抢流量，各种扩量
- name: 免费搜索词否词策略：初期建议否掉，后期可测试放开
  desc: '[evidence] 实测数据显示‘免费’搜索词也能成单，但初期不确定性大建议先否词规避风险，跑通模型后可放开测试边际收益。'
  excerpt:
  - 实际上，经过我的测试，免费这个词还是可以出单的
  - 刚开始还是建议把这类词否掉的，因为不确定后面赚钱可以再测试，否掉之后，还可以放开。
