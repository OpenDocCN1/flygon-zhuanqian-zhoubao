  name: AI绘画资源导航与工具链分层 —— 别在造轮子上浪费生命
  points:
  - '**为什么需要这个概念？**'
  - '- AI 绘画工具链极其碎片化：检索站、构建器、艺术家库、模型托管、部署平台几十上百家，新手极易迷路、重复造轮子'
  - '- 工具迭代极快（周更/日更），单点教程极快过期，需建立“工具地图”而非“工具教程”，掌握分层逻辑实现快速定位'
  - '- 优质资源被分散在 Discord、Reddit、GitHub、飞书、Notion 等闭环社区，需整理为开放可检索的导航图'
  - '**核心定义**'
  - '- 四层工具链分层模型：'
  - '  1. 灵感检索层：OpenArt、Lexica、Arthub、KREA、AI画廊（海量案例+关键词/图片反搜）'
  - '  2. 词法构建层：Promptomania、MidJourney Prompt Helper、AI画廊生成器（结构化表单→标准化 Prompt）'
  - '  3. 风格定向层：WeirdWonderfulAI（艺术家风格实验库）、Civitai（模型/LoRA 风格微调库）'
  - '  4. 本地化执行层：中文站点（词图、LiblibAI）、垂类站点（女性头像/动漫/建筑专用库）'
  - '**关键性质**'
  - '- 功能互补非替代：检索站解决“画什么/参考什么”，构建器解决“怎么写/语法对”，风格库解决“调什么味”，本地化解决“中文语义/垂类素材”'
  - '- 开放生态优先：优质站点倾向开放数据（千万级案例）、开放接口（多模型支持）、开源代码（KREA），拒绝封闭收费墙'
  - '- 社区协作对抗过期：引入点赞/收藏/分组/评论/版本号机制，让用户在使用中持续修正、补全工具库信息'
  - '**典型例子**'
  - '- 全流程实战：在 OpenArt 搜“cyberpunk necklace”找灵感 → 用 Promptomania 填表生成 MJ 标准 Prompt
    → 查 WeirdWonderfulAI 确认“Syd Mead”风格效果 → 去 LiblibAI 下载专用 LoRA/模型 → 本地部署跑批量'
  - '- 资源清单：OpenArt(多模型聚合) → Arthub(分类浏览) → Lexica(SD专精) → Promptomania(结构化生成) → KREA(开源+收藏)
    → AI画廊(中文+多模型生成器) → WeirdWonderfulAI(艺术家风格) → 词图(中文关键词) → LiblibAI(模型托管) → Civitai(LoRA社区)'
  - '**边界条件**'
  - '- 国内访问限制：OpenArt、Lexica、Civitai 等核心站点需科学上网，增加使用门槛，需准备镜像/代理/本地化替代方案'
  - '- 数据滞后性：检索站收录滞后于模型迭代（如 V6 发布后案例库需数周更新），最新风格需自行实测或去 Discord 官方频道抓取'
  - '- 版权合规：部分站点案例来源不明（可能含未授权艺术家风格/私有模型输出），商用前需核实素材版权状态'
