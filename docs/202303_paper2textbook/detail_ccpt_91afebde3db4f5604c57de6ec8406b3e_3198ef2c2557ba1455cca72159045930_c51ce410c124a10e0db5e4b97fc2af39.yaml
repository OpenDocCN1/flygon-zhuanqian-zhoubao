units:
- 'no': 1
  name: AI绘画核心范式转换 —— 从“随机盲盒”到“随心定制”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统 AI 绘画像开盲盒，输入简单词条，结果不可控、不可复现，无法满足商业交付需求'
  - '- 只有掌握结构化提示词，才能将 AI 从“灵感玩具”变为“生产力工具”，实现商业变现'
  - '- 素材中饼公子明确指出：要想画出想要的画面，核心还是“写好关键词”'
  - '**核心定义**'
  - '- 随机出图：仅给定主体词，留空白让 AI 自由发挥，控制量少、变量多、结果不可预期'
  - '- 随心定制：对主体、环境、风格、光影等全维度详细描述，限定生成空间，控制量大、变量少、结果可预期'
  - '- 本质区别：提示词是“限定词”而非“描述词”，每个词都在收缩生成空间，未限定维度模型将随机填充'
  - '**关键性质**'
  - '- 确定性正相关于结构化程度：提示词维度越完备（主体/环境/后缀/参数），输出可控性越强'
  - '- 认知边界显性化：必须知晓绘制对象的物理结构、分类、材质、工艺等领域知识，才能写出精准限定词'
  - '- 模型先验偏差：对特定文化载体（如中式团扇）存在认知偏差，单纯文本难纠正，需垫图辅助'
  - '**典型例子**'
  - '- 输入单词 ''FAN'' 生成“电风扇”而非“手扇”，证明单一主体词歧义需限定词消歧'
  - '- 详细描述“红色团扇、镂空、金色花朵”仍生成错误形制，证明复杂结构单靠文本失效'
  - '- 引入淘宝实物团扇图作为垫图，瞬间锚定正确框架，后续叠加文本精准控制细节'
  - '**边界条件**'
  - '- 仅适用于当前主流扩散模型（Midjourney V4/V5、SD 等）范式，未来模型若具备更强语义理解可能降低结构化依赖'
  - '- 垫图功能依赖平台支持 Image Prompt，且参考图质量、版权需自行把控'
  - '- 高度结构化提示词会增加编写成本，简单场景下“随机模式”性价比可能更高'
  sources:
  - paper: docs/202303/20230328_045.md
    role: origin
  - paper: docs/202303/20230328_052.md
    role: improve
  - paper: docs/202303/KfrYdaWSTobevfxC0NscSPzxnMe.md
    role: origin
  excerpts:
  - 要想画出一幅你想要的画面，核心内容还是“写好关键词”
  - 所谓随机，就是留下【空白】让AI去帮你填满，所谓随心，就是用【详细描述】补充画面。
  - 一个反常规的思路：描述词不是描述词，而是限定词，你所限定的内容，由 Midjourney 理解并体会表达。你所不限定的，它将自由发挥。
  - 我自己的公式，依旧是简单的三段式：主体+环境+后缀 （有时也可省略）
  - 首先要做的事情，就是——从头开始，认识扇子...通常由若干根骨架和覆盖骨架的扇面组成...
  - 是不是因为MJ工具，现在并不能很好的理解中文团扇的意思，得不到比较好的基础图？于是我就选择了【垫图】这个功能，上传一个参考图，让整个画面和我想要的图关联起来。把基础框架和样式弄出来...再根据得到的图，去结合客户的需求，进行一步步调整。
  - 因为FAN还有电风扇的意思，midjourney根据这个词就出了这个图。如何让midjourney理解，你要的是“扇子”而不是现代工业品的电风扇呢？加上你的限定词与修饰词，让它变化！
- 'no': 2
  name: 三段式提示词公式 —— AI绘画的“通用组装说明书”
  points:
  - '**为什么需要这个概念？**'
  - '- 自然语言描述松散、歧义大，AI 难以精准理解意图，导致反复返工'
  - '- 缺乏标准结构，新手不知从何写起，老手难以复用经验、协作迭代'
  - '- 需要一个低门槛、高上限、可迁移的通用框架，将“玄学调参”变为“工程填空”'
  - '**核心定义**'
  - '- 公式：主体 + 环境 + 后缀'
  - '- 主体：画面核心对象（人物、建筑、产品等），含类型、外观、材质、工艺等细分标签'
  - '- 环境：背景、光影、场景、色彩氛围等空间上下文'
  - '- 后缀：画风、艺术家、视角、质量词、模型参数（--ar, --v, --stylize 等），不固定在最后'
  - '**关键性质**'
  - '- 正交解耦：三段式各司其职，修改某段不影响其他段语义，利于控制变量法调试'
  - '- 可扩展性：可向下细化为 7-10 个维度标签库（类型/外观/材质/工艺/场景/光影/色彩/风格/质量/参数），向上兼容 MJ/SD/DALL·E 等多模型语法'
  - '- 认知脚手架：倒逼创作者在下笔前完成对象结构化拆解（如扇子=骨架+扇面+折叠/非折叠）'
  - '**典型例子**'
  - '- 扇子定制：主体=青色折扇/丝绸/手工/舞蹈扇；环境=舞台聚光灯/深色背景；后缀=8K/大师级/流体光影'
  - '- UI 设计模板：【UI界面选择】，【主体特性】，【具体描述】，【色彩/环境/流派设定】，【风格】，【画质提升词】'
  - '- 图标设计模板：【图标设计类型选择】，【具体描述】，【颜色/流派/风格设定】，【画质提升词】'
  - '**边界条件**'
  - '- 非万能公式：复杂场景（多主体交互、特定叙事镜头）需引入 Image Prompt、多重提示词权重（::）、负向提示词等高级语法'
  - '- 后缀段极易“词汇堆砌”导致语义冲突，需遵循“少即是美”原则，优先保留高权重词（艺术家、渲染引擎、质量词）'
  - '- 不同模型版本对后缀参数支持不同（如 --video 仅 V1-V3/Test/Testp 支持），需查阅兼容性矩阵'
  sources:
  - paper: docs/202303/KfrYdaWSTobevfxC0NscSPzxnMe.md
    role: origin
  - paper: docs/202303/20230328_052.md
    role: improve
  excerpts:
  - 我自己的公式，依旧是简单的三段式：主体+环境+后缀 （有时也可省略）
  - 主体讲的是画面中的主要部分...环境讲的是画面中的背景...后缀其实很多时候并不是放在最后面，只是我这样描述会理解的简单一些，包括了画风限定词、艺术家、光影、视角等等。
  - 可以从以下的几个方面着手：1）外观... 2）类型... 3）材质... 4）制作工艺... 5）使用场景...
  - 比如我想要【青色折扇】【丝绸质地】【手工制作】【舞蹈扇子】那就写下来关键词：cyan folding fan，silk texture，handmade，dance
    fan
  - 整理一下得到以下的定式：【UI界面选择】，【主体特性】，【具体描述】，【色彩/环境/流派设定】，【风格】，【画质提升词】
  - 依旧是根据公式略改一下，【图标设计类型选择】，【具体描述】，【颜色/流派/风格设定】，【画质提升词】
- 'no': 3
  name: 多维标签化描述法 —— 给 AI 装上“结构化滤镜”
  points:
  - '**为什么需要这个概念？**'
  - '- 大脑思维是网状发散的，直接写成句子喂给 AI，语序、修饰关系会干扰模型注意力机制'
  - '- 同一属性（如材质）有十几种叫法（丝绸/真丝/silk/satin），需统一映射为模型训练语料中的高频 Token'
  - '- 缺乏标签库，每次写词都在“现查现用”，效率低且术语不标准，难以沉淀资产'
  - '**核心定义**'
  - '- 将绘制对象属性拆解为正交维度标签库：类型、外观、材质、工艺、场景、光影、色彩、风格、质量、参数'
  - '- 每个维度建立候选词表（如材质：silk texture / porcelain / bamboo / gold foil / glass）'
  - '- 写提示词 = 从各维度词表中“点单”拼装，而非“现炒”造句'
  - '**关键性质**'
  - '- Token 效率最大化：模型按 Token 处理，精准标签（silk texture）比自然语句（用丝绸做的）占用更少上下文、语义更准'
  - '- 组合爆炸可控：N 个维度 × M 个候选词 = N^M 种组合，覆盖长尾需求，单次仅激活 1 条路径'
  - '- 知识资产化：标签库可跨项目、跨人员复用，沉淀为团队/个人的“提示词资产包”'
  - '**典型例子**'
  - '- 扇子项目标签库：类型(folding fan/round fan/palm leaf fan) → 外观(carved/hollow/lacquer)
    → 材质(bamboo/silk/paper/porcelain) → 工艺(hand-painted/embroidery/laser-cut) → 场景(wedding/dance/gift)'
  - '- UI 设计标签：界面(Dashboard/Mobile App/Landing Page) → 风格(Neumorphism/Glassmorphism/Material
    Design) → 色彩(Morandi/Dopamine/Corporate Blue)'
  - '**边界条件**'
  - '- 标签粒度过细会导致维度爆炸、组合难选，建议维持 8-12 个一级维度，二级标签每维 20-50 个'
  - '- 部分抽象概念（如“高级感”、“治愈系”）难以直接标签化，需拆解为具象视觉要素（留白大/低饱和/柔光/圆角）'
  - '- 模型版本迭代会改变 Token 权重（V5 比 V4 更吃自然语言），标签库需定期回归测试、版本化维护'
  sources:
  - paper: docs/202303/KfrYdaWSTobevfxC0NscSPzxnMe.md
    role: origin
  - paper: docs/202303/20230328_052.md
    role: improve
  excerpts:
  - 可以从以下的几个方面着手：1）外观... 2）类型... 3）材质... 4）制作工艺... 5）使用场景...
  - 比如我想要【青色折扇】【丝绸质地】【手工制作】【舞蹈扇子】那就写下来关键词：cyan folding fan，silk texture，handmade，dance
    fan
  - 综合总结一下可得到定式：【扇子类型】，【外观】，【材质】，【光影】，【设定（艺术风格等）】，【颜色】，【环境】，【质量词】
  - 利用模型训练语料中固化的标准功能术语（如文本重写、摘要生成、情感分析、代码生成等13类）精简指令，显著提升指令遵循准确率与Token效率。
  - 主题：person, animal, character, location, object, etc. 媒介：photo, painting, illustration...
    环境：indoors, outdoors... 灯光：soft, ambient... 颜色：vibrant, muted... 情绪：Sedate, calm...
    构图：Portrait, headshot...
- 'no': 4
  name: 组合控制变量法 —— 单次只调一个旋钮
  points:
  - '**为什么需要这个概念？**'
  - '- AI 绘画生成涉及数十个变量（主体、光影、材质、参数等），一次改多处无法归因哪个变量导致了好/坏'
  - '- 传统“全量重写提示词”像盲人摸象，效率极低，且容易破坏已有的良好效果'
  - '- 需要借鉴科学实验的“单因素变量法”，建立可复现的调优路径'
  - '**核心定义**'
  - '- 策略：锁定核心主体与基础框架，每轮迭代仅调整一个维度（如仅换材质、仅换光影、仅加特效、仅调 --stylize）'
  - '- 记录：保存每轮 Seed、Prompt、参数、输出图，建立“变量-效果”对照表'
  - '- 判读：对比差异图，确认该变量对画面的具体影响方向与强度，决定保留/回滚/继续微调'
  - '**关键性质**'
  - '- 低认知负荷：人类工作记忆只能处理 3-4 个变量，单变量法符合认知规律'
  - '- 可复现性：固定 Seed + 单变量 = 确定性复现，便于团队协作、跨模型迁移、教学演示'
  - '- 效率杠杆：配合 --seed 固定噪声场，单次出 4 张对比图，一次实验覆盖 4 个候选值'
  - '**典型例子**'
  - '- 扇子项目实战：基础图定好 → 第1轮仅加光影词(volumetric lighting/rim light) → 第2轮仅加环境词(stage/dark
    bg) → 第3轮仅加特效词(burning/particles/sparks) → 第4轮仅调 --stylize 50→250→750'
  - '- 参数实测：固定 Prompt，逐级测试 --chaos 0/10/25/50/100 观察多样性变化；测试 --stylize 0/250/500/750/1000
    观察艺术度曲线'
  - '**边界条件**'
  - '- 变量间存在交互效应（如材质×光影），单变量法可能遗漏最优组合，终局需做正交实验或网格搜索'
  - '- 依赖固定 Seed 机制，仅适用于 V4/V5/Niji 等确定性模型，旧模型（V1-V3）同 Seed 结果不完全一致'
  - '- 仅适用于“微调优化”阶段，初期“探索阶段”需大幅度变更主体/构图，不受单变量约束'
  sources:
  - paper: docs/202303/KfrYdaWSTobevfxC0NscSPzxnMe.md
    role: origin
  - paper: docs/202303/20230328_052.md
    role: apply
  excerpts:
  - 总得来说，是要让画面跟随你的想法去变动，你要做的就是一个简单的选择——控制变量
  - 效果并不是那么好怎么办？添加一些光影，然后再增加一些环境词和后缀词...再来一点点变化，让图案变得有趣起来，扇子正在燃烧怎么样？
  - 高 chaos 值将产生更多不寻常和意想不到的结果和组成。低 chaos 值具有更可靠、可重复的结果。
  - 低风格化值生成的图像与提示符紧密匹配，但不太具有艺术性。高风格化值创建的图像非常艺术，但与提示符联系较少。
  - 模型版本 4、5 和 niji 中使用相同的“prompt + seed + 参数”将生成相同的图像。
- 'no': 5
  name: 垫图/图生图结构锚定 —— 解决“词不达意”的外挂显存
  points:
  - '**为什么需要这个概念？**'
  - '- 文本提示词受限于语言表达上限，难以精准描述复杂空间结构（如中式团扇的骨架层级、扇面弧度、扇柄连接方式）'
  - '- 模型训练数据中特定文化/小众物体样本不足，存在先验认知偏差（把团扇画成折扇、把电风扇当手扇）'
  - '- 纯文本“死磕”极其耗时且成功率低，需引入视觉先验作为硬约束'
  - '**核心定义**'
  - '- 垫图：上传参考图（实物高清图/结构线稿/3D 渲染图）作为 Image Prompt，提供基础形制、空间关系、材质肌理的视觉先验'
  - '- 混合模式：Image Prompt（锚定结构）+ 文本 Prompt（控制细节/风格/色彩）+ 参数（--iw 权重/--no 负向）'
  - '- 工作流：找实物图(淘宝/1688/Pinterest) → 垫图出基础框架 → 文本微调细节 → 局部重绘/Remix 修饰 → 最终定稿'
  - '**关键性质**'
  - '- 结构解耦：垫图管“骨架/比例/透视”，文本管“皮肤/服饰/妆容”，互不干扰，修改细节不崩结构'
  - '- 认知托底：解决模型“长尾知识盲区”，无需训练 LoRA 即可低成本适配新物体'
  - '- 版权合规：参考图最好用自拍/采购/CC0 素材，规避侵权风险；垫图仅作结构参考，输出图像素级差异大，通常不构成衍生品'
  - '**典型例子**'
  - '- 团扇案例：纯文本连续两次失败 → 上传淘宝团扇实物图垫图 → 瞬间得到正确圆形扇面+扇柄结构 → 叠加“镂空/珍珠/流苏/燃烧”文本精准落地'
  - '- 产品设计：上传竞品/草图垫图锚定比例包络 → 文本控制“材质/配色/场景”快速出方案图'
  - '- IP 形象一致性：用角色三视图垫图 + 文本控制动作/表情/服装，实现多角度、多姿势角色一致性生成'
  - '**边界条件**'
  - '- 垫图权重 --iw 需精细调节：过高导致输出“翻版”参考图，失去创新性；过低则结构锚定失效，建议从默认 0.25 起调'
  - '- 参考图质量直接决定上限：模糊/遮挡/透视畸变的垫图会误导模型，需高清、正交视角、背景纯净'
  - '- 仅适用于支持 Image Prompt 的模型/平台（MJ 全版本、SD ControlNet、DALL·E 3 等），纯文本模型无法使用'
  sources:
  - paper: docs/202303/KfrYdaWSTobevfxC0NscSPzxnMe.md
    role: origin
  - paper: docs/202303/20230328_052.md
    role: improve
  excerpts:
  - 是不是因为MJ工具，现在并不能很好的理解中文团扇的意思，得不到比较好的基础图？于是我就选择了【垫图】这个功能，上传一个参考图，让整个画面和我想要的图关联起来。把基础框架和样式弄出来...再根据得到的图，去结合客户的需求，进行一步步调整。
  - 早期的 Midjourney 模型版本可以使用图像权重参数 --iw 来调整图像 url... 数值越大，则意味着上传的图像会有更大的影响。
  - 和我想要的差别也太大了吧？而且很多特征都明显不对...特征还是不够明显，词语不能被识别
  - 把基础框架和样式弄出来，（垫图的原图哪里找?淘宝、阿里巴巴一大堆）再根据得到的图，去结合客户的需求，进行一步步调整。
  - 由【随机】到【随心】，运用AI快速出草图，快速试错进行调整。
- 'no': 6
  name: 商业设计场景化模板 —— 让方法论“拿来即用”
  points:
  - '**为什么需要这个概念？**'
  - '- 通用方法论（三段式/标签库/控制变量）落地到具体业务仍有“最后一公里”认知 gap，新手不知如何映射'
  - '- 不同设计领域（UI/Logo/图标/产品/美甲）关注维度、术语规范、审美标准差异大，需领域化适配'
  - '- 标准化模板能将单次实战经验沉淀为可复用资产，支撑团队协作、教学交付、批量生产'
  - '**核心定义**'
  - '- UI 界面模板：【UI界面选择】，【主体特性】，【具体描述】，【色彩/环境/流派设定】，【风格】，【画质提升词】'
  - '- 图标设计模板：【图标设计类型选择】，【具体描述】，【颜色/流派/风格设定】，【画质提升词】'
  - '- 可扩展至：Logo、概念包装、产品设计、美甲、头像壁纸、周边贴纸等一切视觉感官类设计场景'
  - '**关键性质**'
  - '- 领域语法对齐：模板槽位直接对应该领域标准交付规范（如 UI 必含“界面类型/交互态”，图标必含“风格族/等角/线性/面性”）'
  - '- 约束前置：将技术参数（--ar 9:16/--v 5/--stylize 250/--no text,watermark）固化在模板中，防止新手遗漏'
  - '- 迁移复用性：同一套“结构化分析框架”跨领域通用，仅需替换领域词汇表即可快速迁移'
  - '**典型例子**'
  - '- UI 实战：`Ui Design system, IOS, Dashboard, Automobile industry, cool Porsche
    911, minimalism, blue, vector graphics, HD, 8K` → 生成符合 iOS 规范、含毛玻璃材质的车机仪表盘'
  - '- 图标实战：`website icon design, Wheel shape, Morandi Blue, vector graphics, clear,
    ground glass, HD, 8K` → 生成统一莫兰迪色系、磨砂玻璃质感的车轮图标族'
  - '- 美甲迁移：主体=指甲/手部特写，环境=柔光/渐变背景，后缀=宏观镜头/凝胶质感/闪片/高清微距'
  - '**边界条件**'
  - '- 模板非“万能公式”，复杂项目仍需结合垫图、ControlNet、局部重绘等高级工作流'
  - '- 领域知识壁垒：使用者仍需懂该领域基础术语与审美标准（如不知何为“毛玻璃质感/等角投影/莫兰迪色系”，模板槽位也填不对）'
  - '- 平台/模型迭代会失效：MJ V6 发布后语法、参数、审美偏好可能大幅变化，模板需版本化维护'
