  name: Midjourney 参数全景与兼容性决策表 —— 避开“无效调参”的坑
  points:
  - '**为什么需要这个概念？**'
  - '- MJ 拥有 20+ 参数（--ar/--chaos/--seed/--stylize/--tile/--video/--iw/--no/--quality
    等），新手易陷入“参数大杂烩”盲目试错'
  - '- 参数间存在强依赖与互斥：模型版本决定参数可用性，参数组合决定生成策略，不知边界等于瞎调'
  - '- 需要一张“参数-模型-范围-默认值-作用”的决策表，做到有的放矢、查阅即用'
  - '**核心定义**'
  - '- 核心参数簇：'
  - '  结构控制：--ar(宽高比)、--chaos(多样性)、--seed/--sameseed(确定性)、--iw(图像权重)'
  - '  审美控制：--stylize(艺术度)、--quality(渲染质量)、--style raw(降低默认审美)'
  - '  功能控制：--tile(无缝纹理)、--video(生成视频)、--no(负向提示)、--repeat(批量数)'
  - '  模型选择：--v 1/2/3/4/5/niji/test/testp、--niji 5(动漫特化)'
  - '- 兼容性矩阵：每个模型版本仅支持参数子集，参数取值范围随版本变化'
  - '**关键性质**'
  - '- 决策表用法：先定目标风格/用途 → 选模型版本 → 查该版本支持参数表 → 设参数组合 → 验证效果'
  - '- 版本分化显著：V4 默认 --stylize 100、支持 --chaos 0-100；V5 默认 --stylize 100、原生高分辨率、更吃自然语言；Niji
    专攻动漫、专用 --upanime 放大'
  - '- 参数交互：--chaos 高值配合 --stylize 低值可得“创意但不失控”；--iw 高值锁结构需配合低 --chaos 保稳定'
  - '**典型例子**'
  - '- 追求照片级真实：--v 5 --style raw --stylize 50 --quality 2 --ar 16:9'
  - '- 追求艺术插画：--v 5 --stylize 750 --chaos 30 --ar 3:4'
  - '- 动漫角色三视图：--niji 5 --ar 1:1 --chaos 10 --stylize 250'
  - '- 无缝纹理素材：--v 5 --tile --ar 1:1'
  - '- 复现历史佳作：固定 --seed 12345 --sameseed 67890 复用噪声场'
  - '**边界条件**'
  - '- 参数失效不报错：MJ 对不支持的参数通常静默忽略（如 V4 用 --video 无报错但不生成视频），极易误判为“参数没用”'
  - '- 版本迭代破坏兼容：V6 发布后参数体系可能重构（如 --stylize 范围变更、新增 --weird 等），决策表需同步更新'
  - '- 隐性参数：部分参数未在官方文档公开（如早期 --hd、--sameas），仅靠社区挖掘，决策表难以穷尽'
  sources:
