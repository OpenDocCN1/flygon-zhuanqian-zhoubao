learning_targets:
- 理解早期公司股权分配的核心矛盾：贡献度动态变化与静态股权固化的冲突
- 掌握顾问记账法的三阶段设计逻辑：记账确认价值、利润线分担风险、里程碑跟投绑定未来
- 了解非核心人力市场价锚定原则：用现金清算切断隐性股权承诺，将隐性成本显性化
- 能运用‘咨询即尽调、投资即落地’模式，通过深度运营获取信息优势降低投资决策风险
- 能识别‘花钱找工作’伪合伙陷阱，设计动态调整机制锁定关键人平衡短长期利益
concept_map:
- 股权与顾问模式
- ├── 核心矛盾
- │   ├── 贡献度动态性 vs 静态股权固化性  —— P006
- │   └── 现金流约束 vs 长期激励需求     —— P006
- ├── 合伙人分层动态股权
- │   ├── 核心合伙人：工资+期权/股权动态组合包  —— P006
- │   └── 机制设计：期权池、分期授予、业绩触发  —— P006
- ├── 顾问记账法三阶段
- │   ├── 阶段一：按市场价记账确认价值  —— P006
- │   ├── 阶段二：设定利润触发线分担风险  —— P006
- │   └── 阶段三：业绩里程碑跟投绑定未来  —— P006
- ├── 非核心人力成本清算
- │   ├── 市场价现金结算+合同留痕  —— P006
- │   └── 切断低成本换高股权套利路径  —— P006
- └── 咨询即尽调/投资即落地
- '    ├── 深度运营=高质量尽调  —— P006'
- '    ├── 信息优势转化为投资优势  —— P006'
- '    └── 贝恩模式同构验证  —— P006'
life_analogy:
- 想象创业合伙像**合租房装修分摊账单**：
- '- **静态分股** = 进门第一天按房间大小一次性分摊所有装修费，以后谁住谁走、谁用谁修都不再调整，必吵架'
- '- **动态公平性** = 建立‘记账本’：前期垫资的记大头，后期住的人按月分摊水电网，退房时按实际居住天数结算押金'
- '- **顾问记账法** = 请装修设计师不收设计费，改‘记账’：装修烂尾/跑路设计师认栽（下行保护）；装修增值出租赚了钱，设计师按比例分红或折股（捕获上行）；后续二次装修设计师优先跟投（信息优势）'
- '- **市场价锚定** = 请搬运工/保洁阿姨按市场价给现金签收条，绝不承诺‘装修好看了分你一间房’，切断事后讨价还价'
summary:
- concept: 股权分配动态公平性
  desc: 拒绝一次性切蛋糕，建立随贡献度/人生阶段调整的动态机制，核心锁定关键人
- concept: 顾问记账法三阶段
  desc: 记账确认价值→利润线分担风险→里程碑跟投绑定未来，结构等同顾问持有公司看涨期权
- concept: 非核心人力市场价锚定
  desc: 辅助工种按市场价现金结算签合同，切断‘低价换股’幻觉，将隐性股权成本显性化为财务成本
- concept: 咨询即尽调、投资即落地
  desc: 深度运营参与=最高质量尽调，掌握真实数据后再投资，复刻贝恩‘咨询引领投资’一体化逻辑
- concept: 早期合伙核心矛盾
  desc: 贡献度度量的动态性与静态股权固化性冲突，解决之道在于动态调整机制而非完美初始切分
- concept: 专家网络精准匹配
  desc: 懂行顾问对不懂市场技术创始人边际价值极高，领域熟悉度决定咨询介入效果
exercises:
- 'no': 1
  title: 设计合伙人动态股权协议框架
  contents:
  - 场景：三位合伙人A（全职、不拿工资、出技术）、B（兼职、拿半薪、出资源）、C（在职、不出力、出资金），预计12个月后盈利。
  - 1. 设计‘工资+期权’动态组合包：如何设定全职/兼职/在职的薪资替代值与期权授予比例？
  - 2. 设定业绩触发条件：营收/利润/融资三类里程碑如何分期释放期权？
  - 3. 退出机制：合伙人B第8个月因故全职离职，已授予期权如何回购/稀释？
  - 回答问题：
  - '- 为什么不能直接按‘出资/出力/出资源’比例静态切分注册股？'
  - '- 期权池规模建议设为总股本的10%-20%，这个比例如何推导？'
- 'no': 2
  title: 顾问记账法财务建模演练
  contents:
  - 场景：顾问为早期项目提供COO级运营服务，市场报价2万/月，项目预计6个月盈利，月利润增速20%。
  - 1. 记账阶段（前6个月）：累计记账金额如何计算？是否含利息/溢价？
  - 2. 利润触发线设定：建议设为‘月利润>5万’还是‘累计利润>10万’？区别在哪？
  - 3. 折股估值：盈利达标时，记账金额折股采用‘上轮融资估值’还是‘净利润倍数估值’？
  - 4. 跟投权条款：业绩里程碑设为‘年营收1000万’还是‘连续3月盈利’？顾问跟投比例如何确定？
  - 回答问题：
  - '- 为什么说该模式结构上等同于顾问持有公司看涨期权？行权价由什么决定？'
  - '- 顾问深度运营带来的‘信息优势’如何量化转化为‘投资决策质量提升’？'
- 'no': 3
  title: 识别并化解‘低价换股’陷阱实战
  contents:
  - 场景：UI设计师小王主动提出‘帮你做全套品牌设计（市价5万）只收1万，剩4万折股份’，创始人现金流紧张倾向答应。
  - 1. 按‘市场价锚定原则’拆解：这笔交易的隐性估值是多少？对创始人股权稀释影响几何？
  - 2. 执行‘现金清算法’：如何用合同条款锁定‘市价5万、实付5万（分期/应付账款）、零股权’？
  - 3. 若小王坚持‘不收现金只拿股’，创始人如何礼貌拒绝并提供替代方案（如期权期权池额度/现金分期/资源置换）？
  - 回答问题：
  - '- 为什么说‘非核心人力市场价清算’是切断道德风险的源头手段？'
  - '- 核心合伙人走‘记账法’、辅助工种走‘市场价清算’，两套体系边界如何界定？'
