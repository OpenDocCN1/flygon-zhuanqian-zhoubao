units:
- 'no': 1
  name: 招聘即项目验证信号 —— 用别人的招聘广告做市场调研
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人找项目容易陷入“听大佬吹牛”或“跟风烂项目”的坑，公域分享的项目往往已过红利期'
  - '- 需要一个经过市场实战验证、且竞争对手多为普通人的可靠项目来源'
  - '- 传统调研成本高、周期长、样本少，招聘平台提供了现成的、海量的、结构化的商业信号'
  - '**核心定义**'
  - '- 核心公理：每一个持续招聘需求的背后，都是一个大概率稳定赚钱的项目'
  - '- 识别标准：长期、高频、不急于成交入职的招聘信息 = 项目盈利稳定需扩张，或招聘本身即低成本获客手段'
  - '- 信号分层：显性信号（招人干活） vs 隐性信号（招客户、招粉丝、刷搜索曝光）'
  - '**关键性质**'
  - '- 反向筛选：被普通人验证过的项目，同为普通人的你拿到结果的概率相对更大'
  - '- 信息差红利：线下小微个体项目（如门窗）同行多不懂互联网，属于“幼儿园打小朋友”式降维打击赛道'
  - '- 防内卷机制：招聘平台信息非公开分享，见光死概率低，自带护城河'
  - '**典型例子**'
  - '- 保险公司天天招月月招年年招，招的不是员工，是精准客户（高客单、高转化、高复购）'
  - '- 大V天天发招聘，招的不是员工，是粉丝、搜索点击和浏览量（低成本获流）'
  - '- 门窗行业：BOSS直聘发现同行多为线下小夫妻店，不懂抖音/互联网，发作品获客 -> 对接厂家发货，月询盘30-60个，客单价高利润实在'
  - '**边界条件**'
  - '- 仅适用于“持续、高频、长期”的招聘信息，一次性/短期招聘噪音大需过滤'
  - '- 需具备基本的判断力区分“招人干活”还是“借招聘行别的事”'
  - '- 线上标品/红海品类（如9.9包邮）不适用，核心优势在非标、高客单、线下重服务的蓝海赛道'
  - '...'
  sources:
  - paper: docs/202303/20230328_047.md
    role: origin
  excerpts:
  - 每一个招聘需求的背后，都是一个项目，每一个持续招聘需求的背后，都是一个大概率稳定赚钱的项目。
  - 被普通人验证过的，同为普通人的你拿到结果的概率相对更大。
  - 保险公司天天招月月招年年招，他招的是求职者吗？不，他招的是客户！！！
  - 有的大 V 天天找月月招年年招，他招的是员工吗？不，他招的是粉丝！！！他招的是搜索，点击和浏览！！！
  - 通过 boss 直聘，找到了一个门窗的项目，先发作品，再直接抖音找门窗厂家处理订单，批发零售都可以接。
  - 单个账户的咨询不多，一个月差不多 30 到 60 个询盘，好在封阳台的客单价还可以，利润也比 9 块 9 包邮日出百单来的实在一些。
  - 选择门窗的原因是发现同行很多都是线下小门面的小夫妻，压根就不懂什么互联网或者抖音，甚至门窗厂家的画面也都比较 low
- 'no': 2
  name: 反向猎头/海选模式 —— 从“你找项目”变成“项目找你”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统求职/找项目是单向投递，效率低、被动、信息不对称严重'
  - '- 普通人缺乏主动挖掘项目的资源和能力，但拥有“投简历”的低门槛动作能力'
  - '- 需要一种将“求职”动作转化为“筛选项目”杠杆的方法论'
  - '**核心定义**'
  - '- 操作：用3-5个账号挂出差异化简历，以求职者身份大规模投递目标行业岗位'
  - '- 机制：利用平台算法让HR/老板主动沟通，反向获取项目细节、合作模式、供应链信息'
  - '- 核心杠杆：ChatGPT实时兜底专业知识盲区（行业术语、面试话术、技术参数），实现“完全不懂的行业也能聊”'
  - '**关键性质**'
  - '- 主动权反转：不再是你求人家，是人家求你（或双向奔赴），心态从卑微变平等'
  - '- 批量筛选：海投即海选，用数量换质量，用概率对抗单点不确定性'
  - '- 低成本试错：仅需账号和时间成本，无需房租、人力、货源压力，即可实地调研核心商业机密'
  - '**典型例子**'
  - '- 作者以求职者身份投递门窗厂家/安装岗，HR主动加微信发详细合作政策、厂家报价、安装规范'
  - '- 利用ChatGPT应对“系统窗型材壁厚国家标准”、“断桥铝氮气检测流程”等专业提问，实时生成专业回复'
  - '- 最终筛选出：发抖音获客 -> 对接厂家发货（批发/零售）的轻资产合作模式'
  - '**边界条件**'
  - '- 需准备3-5个成熟账号（实名、有简历完整度），新号权重低易限流'
  - '- 简历需设计差异化定位（如：懂抖音运营的销售、懂安装的店长），避免千篇一律被系统判重'
  - '- 仅适用于需要“招人”的项目方，纯代理/加盟骗局（只收钱不招人）会被自动过滤'
  - '...'
  sources:
  - paper: docs/202303/20230328_047.md
    role: origin
  excerpts:
  - 当你用 3,5 个账号，挂出 3,5 个 BOSS 直聘简历之后，那就不是你找项目了，是项目送上门来找你。
  - 你像海选一样去查看这些项目，哪些是你能胜任的，上班或者合作都是不错的选择。
  - 完全不懂的行业，被问问题，回答不上来怎么办？ chatgpt！！！
  - chatgpt！！！ 你像海选一样去查看这些项目，哪些是你能胜任的，上班或者合作都是不错的选择。
- 'no': 3
  name: 项目库-人才库-流量库三位一体 —— 一次招聘动作，三重资产沉淀
  points:
  - '**为什么需要这个概念？**'
  - '- 单一动作（发招聘/投简历）产出单一价值（招到人/找到活）ROI太低'
  - '- 普通人创业缺项目、缺人、缺流量，需一套动作同时解决三大核心短板'
  - '- 传统渠道获取这三类资源成本极高（猎头费、广告费、时间成本）'
  - '**核心定义**'
  - '- 项目库：通过分析JD（职位描述）、与老板聊天，提炼同行商业模式、供应链、利润结构、推广打法'
  - '- 人才库：收集求职者简历、微信、技能标签，为未来组建团队/外包/合伙储备种子选手'
  - '- 流量库：直接获取求职者/HR的手机号、微信号，意图明确（求职/招聘/合作），获客成本远低于公域广告'
  - '**关键性质**'
  - '- 协同增效：项目库指引方向，人才库支撑交付，流量库解决获客，形成单人公司完整商业闭环'
  - '- 数据资产化：所有沟通记录、简历、JD均结构化沉淀，成为可复用、可估值的核心资产'
  - '- 平台套利：利用BOSS直聘的招聘匹配算法，以“招聘/求职”名义合规获取高意向商业连接'
  - '**典型例子**'
  - '- 发布招聘：收到200+简历 -> 筛选5个懂抖音运营的人才入库 -> 分析3家竞品JD总结出“发作品找厂家”模型入项目库 -> 顺手加了50个求职者微信入流量库'
  - '- 投递简历：收到20+老板主动沟通 -> 套出2个厂家直供价格体系 -> 加10个老板微信谈合作分成'
  - '**边界条件**'
  - '- 必须引入RPA实现批量采集/分发/记录，纯人工无法支撑三库同步建设的数据量'
  - '- 需建立标准化标签体系（行业/模式/阶段/意向度），否则数据堆积变垃圾堆'
  - '- 合规底线：仅获取公开简历信息及主动提供的联系方式，严禁爬虫破解、购买数据、骚扰用户'
  - '...'
  sources:
  - paper: docs/202303/20230328_047.md
    role: origin
  excerpts:
  - 项目库+人才库+流量库 搞定！
  - 手机号，微信号都直接拿到了，没有哪个平台比性价比这更高了，说 boss 直聘是流量库一点也不过分。
  - 用 RPA 采集招聘信息和求职者信息，再通过 chatgpt 整合生成出招聘文案以及求职简历，再用 RPA 批量发布到全国。
- 'no': 4
  name: ChatGPT+RPA自动化协作流程 —— 左脑ChatGPT管思考，右脑RPA管跑腿
  points:
  - '**为什么需要这个概念？**'
  - '- 单人运营面临“认知边界窄”（不懂行业知识）和“执行带宽窄”（号少、手慢、易累）双重瓶颈'
  - '- 传统外包/雇佣成本高、沟通慢、质量难控、忠诚度低'
  - '- 需要一套“非程序员可落地、边际成本趋近零、可7x24小时运行”的数字员工体系'
  - '**核心定义**'
  - '- 分工协作模型：RPA负责“手脚”（数据采集、账号管理、批量发布沟通、表格录入），ChatGPT负责“大脑”（招聘文案、简历优化、面试话术、行业知识速查、数据清洗）'
  - '- 人类定位：仅负责“决策大脑”（项目筛选、核心谈判、非常规沟通、战略复盘）'
  - '- 协作链路：RPA采集原始数据 -> ChatGPT结构化生成内容 -> RPA批量分发执行 -> 人类审核决策 -> 结果回写知识库'
  - '**关键性质**'
  - '- 认知边界打破：完全不懂的行业，被问专业问题，ChatGPT秒级生成专业回复，实现“零门槛跨界调研”'
  - '- 执行规模跃迁：单人可同时运营全国多城市、多账号、多岗位矩阵，日处理量超百人团队'
  - '- 知识飞轮：每次沟通产生的新知识（话术、报价、避坑指南）即时喂回ChatGPT训练专属Bot，越用越懂'
  - '**典型例子**'
  - '- 门窗项目：RPA采集全国500个门窗招聘JD -> ChatGPT提炼共性：抖音获客+厂家直发+高客单 -> 生成标准化招聘文案/求职简历 -> RPA批量投放
    -> 获得核心供应链联系方式'
  - '- 面试实战：老板问“系统窗五金件品牌区别”，ChatGPT秒回“霍普/丝吉利/吉屋/国内二线品牌对比表”，对方认为你是行家直接发合作政策'
  - '**边界条件**'
  - '- 必须先人工跑通完整业务流程（手动发布、手动聊天、手动记录），验证盈利模型后再引入自动化，否则是“自动化地做错事”'
  - '- ChatGPT需配合“库内概念调教法”（喂入行业专业术语库、竞品情报库），裸用通用模型幻觉率高、不可靠'
  - '- RPA脚本需具备容错机制（验证码、IP切换、界面变更、频率限制），否则极易中断导致账号封禁'
  - '...'
  sources:
  - paper: docs/202303/20230328_047.md
    role: origin
  excerpts:
  - 用 RPA 采集招聘信息和求职者信息，再通过 chatgpt 整合生成出招聘文案以及求职简历，再用 RPA 批量发布到全国。
  - 完全不懂的行业，被问问题，回答不上来怎么办？ chatgpt！！！
  - 项目库+人才库+流量库 搞定！
  - 自动化是最后一步，先跑完手动流程，再来想自动化的需求
- 'no': 5
  name: 幼儿园打小朋友蓝海思维 —— 避开大佬厮杀，专捡普通人捡漏的钱
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人容易盯着大佬玩的高大上赛道（AI大模型、跨境大卖、直播带货头部），入场即被收割'
  - '- 红海赛道规则透明、竞争充分、利润被压榨至薄利，新人无生存空间'
  - '- 需要一套“识别弱竞争、强需求、可复制”赛道的筛选坐标系'
  - '**核心定义**'
  - '- 核心策略：选择不懂互联网运营、线下小微个体为主的传统行业（如门窗、家电维修、同城服务）'
  - '- 竞争对手画像：线下小门面小夫妻、压根不懂抖音/互联网、画面low、不会做内容、不会投流、不会私域'
  - '- 切入动作：用最基础的互联网技能（发作品、做矩阵、挂小程序、建私域）实现降维打击'
  - '**关键性质**'
  - '- 信息差变现：你的“基础操作”（剪映剪视频、发抖音、加微信、转介绍）在对手眼里是“高技术/不敢做/不会做”'
  - '- 客单价护城河：非标服务/大件商品（门窗、定制柜、装修）单客利润高，天然过滤“9.9包邮”式价格战'
  - '- 供应链现成：厂家急需销路，愿意配合“零库存、一件代发、售后包赔”，你只管流量和信任'
  - '**典型例子**'
  - '- 门窗案例：同行不懂抖音，作者发几条施工视频/避坑指南 -> 精准获客 -> 对接本地厂家发货 -> 月入稳定超打工收入'
  - '- 家电维修（蓝狐案例）：师傅只会修不会推，作者用咸鱼矩阵+地推获客 -> 派单给师傅37/46/55分成 -> 两月纯利30万'
  - '- 同城相亲：红娘只会线下聚会不会线上引流，作者用四类账号矩阵+付费投流 -> 高毛利(~100%)降维打击'
  - '**边界条件**'
  - '- 必须是“服务/非标/重信任/重交付”品类，标品/低价/重物流品类（服装、3C、日化）大厂已布局无机会'
  - '- 需具备基本的“销售/获客”能力，纯技术/纯运营/纯产品思维者无法闭环（小白创业销售优先于供应链公理）'
  - '- 规模化天花板受限于线下服务半径/师傅管理上限/非标交付标准化难度，难成亿级大生意，适合“小而美”高利润生存'
  - '...'
  sources:
  - paper: docs/202303/20230328_047.md
    role: origin
  excerpts:
  - 非常符合从盗坤那学到的蓝海思维，选择幼儿园的小朋友来打。
  - 同行很多都是线下小门面的小夫妻，压根就不懂什么互联网或者抖音
  - 先跑完手动流程，再来想自动化的需求
  - 通过 boss 直聘，找到了一个门窗的项目，先发作品，再直接抖音找门窗厂家处理订单，批发零售都可以接。
