units:
- 'no': 1
  name: 见面会复盘索引页 —— 知识管理的“空心化”边界
  points:
  - '**为什么需要这个概念？**'
  - '- 识别素材库中存在的“只有标题和外链、没有正文内容”的索引型素材'
  - '- 区分“结构性占位索引”与“实质性内容素材”，避免在教材编写中误用空壳素材'
  - '- 揭示早期知识管理以“链接分发”为主、缺乏“本地归档”的策略缺陷'
  - '**核心定义**'
  - '- 该素材为‘见面会复盘’专题的结构性占位索引，仅含标题与语雀外链'
  - '- 核心内容寄宿于外部语雀文档，本地无实质正文存储'
  - '**关键性质**'
  - '- 空心化：索引页本身不承载任何知识点、方法论、案例或数据'
  - '- 外链依赖：知识资产完全依赖第三方平台（语雀）的链接有效性'
  - '- 结构性锚点：虽无内容，但标识了社群知识体系中“线下活动复盘”模块的边界位置'
  - '**典型例子**'
  - '- 素材 ID：docs/202303/20230328_025.md'
  - '- 表现形式：标题“【见面会复盘】”+ 语雀文档超链接'
  - '- 使用场景：作为教材大纲第 1 章第 21 节的节点来源，仅提供分类入口'
  - '**边界条件**'
  - '- 无法直接用于“概念解析”正文撰写，缺乏可引用的论据、金句、数据或步骤'
  - '- 若外部链接失效（语雀文档删除/迁移/权限变更），该知识节点将永久丢失'
  - '- 教材编写时需标记为“待补全素材”，需通过外部链接回溯获取实质内容后方可使用'
  - '...'
  sources:
  - paper: docs/202303/20230328_025.md
    role: origin
  excerpts:
  - 该素材仅包含一个标题“【见面会复盘】”和一个语雀文档链接，缺乏具体的正文内容、观点阐述、方法论描述或案例数据，因此无法提取核心概念、方法、主张或发现。
  - 素材分类：索引占位类；核心内容寄宿于外部语雀文档，存在链接失效风险。
