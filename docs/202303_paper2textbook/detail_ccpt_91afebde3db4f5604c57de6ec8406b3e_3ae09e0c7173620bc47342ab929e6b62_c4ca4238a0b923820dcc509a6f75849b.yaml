units:
- 'no': 1
  name: 好问题的三大标准 —— 让提问从“索取”进化为“讨论”
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数提问者陷入“纯索取”陷阱：不搜索、不提供背景、不思考方案，导致零回应或无效回应'
  - '- 提问质量直接折射一个人的搜索力、系统思维、元认知与执行力，是高绩效人群的核心特征'
  - '- 掌握“好问题”标准，能将提问从消耗社交信用的“索取”，转化为积累社交资本的“讨论”'
  - '**核心定义**'
  - '- 好问题 = 不可搜索 + 充足背景 + 讨论姿态（选择题式）'
  - '- 不可搜索：答案无法通过检索引擎直接获得，需经人类经验与判断'
  - '- 充足背景：包含情境、概念、尝试方案、目标、约束五要素，将模糊问题界定为可决策的具体问题'
  - '- 讨论姿态：提问者预置两个以上备选方案，邀请回答者评判优劣或补充新思路，而非单向索取'
  - '**关键性质**'
  - '- 同构性：提问质量 ≡ 提问者核心能力（搜索力 × 系统思维 × 元认知 × 执行力）'
  - '- 互惠性：提问者前置的思考成本（搜索/建模/预置方案）决定回答者愿意投入的认知资源'
  - '- 筛选性：高质量提问天然筛选出高意愿、高能力的回答者，过滤无效社交噪音'
  - '**典型例子**'
  - '- 蠢问题：“这个在哪里买？多少钱？”（默认对方知晓上下文，实则信息严重不对称）'
  - '- 模糊决策：“去大城市还是小城市？”（未界定个人条件，唯一答案只能是“看情况”）'
  - '- 好问题：“我想在杭州做新媒体运营，已对比过方案A（入职大厂）和方案B（跟博主做副业），受限于家庭需周末双休，老师觉得哪个更可行？有没有方案C？”'
  - '**边界条件**'
  - '- 事实性检索类问题（如“今天汇率多少”）不适用，直接搜索效率最高'
  - '- 极度紧急/生死攸关场景下，允许跳过“预置方案”直接求救'
  - '- 回答者若缺乏领域知识，即使好问题也难获高质量回答，需匹配“懂行的人”'
  - '...'
  sources:
  - paper: docs/202303/20230328_009.md
    role: origin
  excerpts:
  - 李笑来总结过，好问题的三个标准：第一，这个问题一定无法通过简单的搜索就得到答案；第二，这个问题有充足的背景信息支撑；第三，一个好问题不会是纯粹的索取。一个好的提问者所秉持的姿态更接近与“讨论”，而非“索取”。
  - 他会用选择题的方式提问，而非简单的开放式，比如“我对 xxx 有些疑问，现在想出了两种解决方法，一是 xxx，二是 xxx，老师觉得哪个方法可行？老师还有没有其他更好的方法？”
  - 提问本身就能看出你的能力……成为学霸的第一步就是不怕麻烦……如果你碰到一个能提出高质量问题的学生，基本上可以判定他的成绩一定不会差。
  - 连提问者自己都不重视的事情，还怎么能要求其他人重视呢？
  - 做足功课的学霸会把问题定义的非常清楚，问题发生在什么样的情境下，涉及到什么样的概念，尝试过的解决方法等等
  - 有个女生问我考什么科目，分数线之类的。我让她去百度上找她自己想报考的学校的情况，然后她把我拉黑了
- 'no': 2
  name: 低质量提问的典型模式与代价 —— 识别“蠢问题”避免社交破产
  points:
  - '**为什么需要这个概念？**'
  - '- 识别低质量提问模式，是避免自己成为“懒人/怕麻烦者”标签的前置条件'
  - '- 理解“蠢问题”暴露的深层心理（懒惰、缺乏诚意、系统思维缺失），可反向审视自身思维盲区'
  - '- 明白“零成本提问”导致“零回应”的社交铁律，停止无效社交消耗'
  - '**核心定义**'
  - '- 低质量提问 = 可搜索 + 缺背景 + 纯索取'
  - '- 典型模式一：上下文缺失型（如“这个在哪里/怎么买”），提问者默认对方共享其视角，实则信息孤岛'
  - '- 典型模式二：模糊决策型（如“大城市还是小城市”），未界定约束条件，答案退化为“看情况”'
  - '**关键性质**'
  - '- 暴露性：此类问题本质是提问者“怕麻烦、不诚意、缺乏系统思维”的行为投射'
  - '- 排斥性：回答者天然排斥“蠢问题”，因为这显得提问者毫无诚意，消耗回答者善意'
  - '- 传染性：长期提问低质量问题者，会被高质量圈层隐性屏蔽，陷入信息获取恶性循环'
  - '**典型例子**'
  - '- 抖音后台高频私信：“这个在哪里？这个怎么买？这个多少钱？”（作者根本不知道对方看了哪条视频）'
  - '- 职业咨询：“我该不该辞职创业？”（未提供行业、积蓄、家庭支持、风险偏好等任何背景）'
  - '- 考研咨询案例：大四女生询问考研科目分数线，被建议自行百度后拉黑建议者，印证“怕麻烦者”抗拒前置成本'
  - '**边界条件**'
  - '- 新手期允许存在“笨问题”，但必须通过“被教导后改进”完成迭代，固化为模式则是能力缺陷'
  - '- 情感宣泄/寻求陪伴类提问不适用此标准，需区分“解决问题提问”与“情感连接提问”'
  - '...'
  sources:
  - paper: docs/202303/20230328_009.md
    role: origin
  excerpts:
  - 这个在哪里？这个怎么买？这个多少钱？……我能猜到这人为什么会有这样的问题，可能是他看了我的一条视频……但他问问题就只从自己的角度发问，以为他心里想的，别人都知道，其实我根本不知道他在问什么
  - 比如“应该去大城市工作？还是去小城市工作？”这种问题的答案只能有一个，那就是看情况
  - 能够提出这种问题的人，一定是个怕麻烦的懒人
  - 大家只不过讨厌被问到蠢问题，因为这显得提问者毫无诚意
  - 有个女生问我考什么科目，分数线之类的。我让她去百度上找她自己想报考的学校的情况，然后她把我拉黑了
- 'no': 3
  name: 选择题式提问法 —— 降低回答者认知负荷的“社交杠杆”
  points:
  - '**为什么需要这个概念？**'
  - '- 开放式提问（如“怎么办？”）让回答者承担全部认知负荷（界定问题、生成方案、评判优劣），极易被拒答或敷衍'
  - '- 选择题式提问将“生成方案”环节前置给提问者，回答者只需“评判优劣”，认知负荷降维，回应意愿显著提升'
  - '- 该方法传递“诚意+努力+尊重”三重强信号，是普通人链接高认知者的最高性价比动作'
  - '**核心定义**'
  - '- 选择题式提问 = 搜索验证 → 语境建模（情境/概念/尝试/目标/约束） → 方案预置（≥2个备选） → 邀请评判'
  - '- 三步法标准动作：1. 确认不可搜索；2. 投入时间界定问题全貌；3. 自主产出备选方案，转化为选择题抛出'
  - '**关键性质**'
  - '- 认知分工：提问者负责“发散/生成”，回答者负责“收敛/评判”，符合人类认知协作规律'
  - '- 信任锚定：预置方案即“定金”，证明提问者已投入沉没成本，回答者安全感大增'
  - '- 迭代性：回答者给出评判后，提问者可追问细节，形成“提问-评判-追问-再评判”的螺旋上升闭环'
  - '**典型例子**'
  - '- 标准话术：“老师，我想在XX方向做项目，目前想到两条路：一是XXX（优缺点），二是XXX（优缺点），受限于预算/时间XXX，老师觉得哪条更可行？还有没有我没想到的第三条路？”'
  - '- 对比：问“Python怎么学？” vs 问“已刷完《自动化》前5章、每天仅1小时、目标做爬虫，老师建议接着刷书还是直接找项目练手？还有没有更合适的路线？”'
  - '**边界条件**'
  - '- 备选方案必须是“经思考的”，而非随意编造的“伪选项”，否则暴露更严重的不诚意'
  - '- 方案数量建议2-3个，过多反增认知负荷，过少（仅1个）退化为确认题'
  - '- 仅适用于“寻求建议/决策/方案”类问题，不适用于“事实核查/情感倾诉/闲聊”场景'
  - '...'
  sources:
  - paper: docs/202303/20230328_009.md
    role: origin
  excerpts:
  - 首先，这个问题一定无法通过简单的搜索就得到答案
  - 其次，这个问题有充足的背景信息支撑……把问题定义的非常清楚，问题发生在什么样的情境下，涉及到什么样的概念，尝试过的解决方法等等
  - 最后，一个好问题不会是纯粹的索取……他会用选择题的方式提问，而非简单的开放式
  - 这样的提问方式会让回答者感受到你为这个问题所做的努力，以及你对于这个问题的思考
  - 成为学霸的第一步就是不怕麻烦
- 'no': 4
  name: 提问质量-能力同构定律 —— 你的提问水平，就是你的能力水平
  points:
  - '**为什么需要这个概念？**'
  - '- 打破“提问是软技能、能力是硬实力”的割裂认知，确立提问质量是核心能力的“外在投射/试金石”'
  - '- 为个人成长提供可观测、可练习、可量化的抓手：练提问 = 练搜索力 + 练系统思维 + 练元认知 + 练执行力'
  - '- 解释为什么高绩效人群（学霸、优秀员工、大佬）天然擅长提问，而非“聪明才提问”'
  - '**核心定义**'
  - '- 提问质量 ≡ 搜索/自学能力（不怕麻烦） × 系统思维能力（界定语境/拆解问题） × 元认知与执行力（预置方案/闭环验证）'
  - '- 四大能力映射：搜索力→不可搜索标准；系统思维→充足背景标准；元认知/执行力→讨论姿态/选择题标准'
  - '**关键性质**'
  - '- 单向推导：高质量提问 ⇒ 必为高绩效人群（必要条件）'
  - '- 反向不成立：高绩效人群偶尔也会问烂问题（如跨领域、极度疲劳时），但概率极低且能快速纠偏'
  - '- 可迁移性：提问训练迁移至汇报工作、写方案、谈判、做产品等一切“定义问题-给方案”场景'
  - '**典型例子**'
  - '- 学霸提问：“这道题我用A法算到第三步卡住了，B法觉得循环论证，目标是求极值，约束是不等式，老师看哪步错了？还是该换思路？”'
  - '- 优秀员工汇报：“项目延期风险，方案一砍需求保工期（影响收入），方案二申请资源（需跨部门协调），方案三分期交付（需客户同意），建议走方案三，已预沟通客户倾向同意，请领导拍板”'
  - '**边界条件**'
  - '- 该定律适用于“知识工作/认知协作”场景，不适用于纯体力/标准化流程执行岗位'
  - '- 文化语境差异：高权力距离文化中，选择题式提问可能被解读为“越俎代庖”，需调整为“请示+备选”话术'
  - '- 认知负荷极高时（如危机时刻），允许退化为“只报问题+后果”，事后必须补全复盘闭环'
  - '...'
