dimensions:
- name: 主题集中度
  score: 3
  evidence: 素材横跨社群运营、内容产品、AI应用、自由职业、就医、营销心理学等多个领域，虽然多数围绕'普通人赚钱/知识变现'的大主题，但分支明显，有主线但多旁支。
- name: 核心命题清晰度
  score: 4
  evidence: 存在一个反复出现的主张：'普通个体可通过生财思维、标准化方法论与信息差，系统性地建立可持续的赚钱能力'。方向清晰，但需进一步提炼为更鲜明的一句话主张。
- name: 目标读者清晰度
  score: 4
  evidence: 素材大量针对'想搞副业/转型/做知识付费的普通上班族或小创业者'，回应性强。但部分素材（如重大疾病就医、企业股权管理）的目标读者与主线读者有偏离，需取舍。
- name: 内容厚度与互补性
  score: 3
  evidence: 有相当的厚度，如社群起盘、知识萃取、AI做课、私域成交等可形成章节体系。但存在明显重复（多个'技巧清单'类素材）和断层（就医/企业管理等与赚钱主线衔接弱）。
- name: 区分度与新颖性
  score: 4
  evidence: 拥有独特视角，如'生财思维 vs 创业思维'、'信息差不等于割韭菜'、'山寨生财难成功'等反直觉认知。表达有个性且有深度反思，区别于纯资讯综述。
- name: 时效风险
  score: 3
  evidence: 部分核心内容（如赚钱心法、心态调整、写作框架）可常青；但较多素材依赖特定工具（ChatGPT、快团团、视频号）或当下热点（AI创业），存在时效风险。
- name: 可持续扩写空间
  score: 3
  evidence: 有多篇深度方法论（如社群起盘、内容产品、AI商业化）可支撑多个章节，但整体素材约为半本书的量，且需要大量重组、补写案例和逻辑串联才能成书。
total_score: 24
conclusion: potential
recommended_shape: book
alternative_path: 先制作《普通人赚钱方法论白皮书》电子手册或付费专栏，验证市场反馈后再集结成书
next_steps:
- 主题收束：聚焦'普通个体如何系统化构建赚钱能力'，剔除就医、企业管理等旁支内容或降级为延伸阅读附录。
- 重写整合：以'从思维转变（生财思维）→ 系统方法论（内容产品/写作框架）→ 实战路径（私域/视频号/AI）'为主线重组现有素材。
- 提炼核心命题：凝练'成功赚钱不是靠零散技巧，而是靠可复制的系统与差异化壁垒'为一句话主张。
- 补写更新：针对时效性较强的AI工具类素材，补充2024-2025年的最新案例与工具版本，降低过时风险。
