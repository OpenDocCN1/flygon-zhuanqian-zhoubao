- 'no': 1
  name: 内容产品化 —— 把知识做成可持续迭代的资产
  desc: 本章从“内容即产品”的视角切入，建立内容开发的基本心智模型：将单次的知识输出转化为具备生命周期、可迭代、可生长的产品实体，并引出后续做课与写作的结构化基础。
  nodes:
  - 'no': 1
    name: 从内容到产品：为什么要产品化
    desc: 以“知识不是一次性消耗品，而是可迭代生长的产品实体”作为动机，对比传统内容输出与产品化运营的差异，建立内容资产的长期价值意识。
    role: motivation
    src:
    - paper: 20230808_04_内容产品
  - 'no': 2
    name: 内容产品的定义与核心特征
    desc: 正式定义“内容产品”概念，明确其“可迭代、可生长”的本质属性，区别于一次性内容交付。
    role: definition
    src:
    - paper: 20230808_04_内容产品
  - 'no': 3
    name: 知识萃取：从业务环节到单篇知识
    desc: 讲解知识萃取方法：如何从全域业务环节中筛选出核心环节，进而提炼出高价值单篇知识点，完成从隐性经验到显性知识的第一步。
    role: method
    src:
    - paper: 20230808_04_内容产品
  - 'no': 4
    name: 012N标准化结构：全域到单点的收敛与发散
    desc: 引入原创的“012N标准化结构”框架——从全域（0）收敛到单点（1），再建立模型（2），最终发散出N个解法，形成内容体系化的核心骨架。
    role: method
    src:
    - paper: 20230808_04_内容产品
  - 'no': 5
    name: 聚焦与发散：内容生长的动力学原理
    desc: 论证“聚焦-发散原理”：内容品质的稳定性与多样性来源于全域→单点→N解法的循环演进，并阐释该原理在产品成长周期中的表现。
    role: proof
    src:
    - paper: 20230808_04_内容产品
  - 'no': 6
    name: 品控流程：多重审核保障品质一致性
    desc: 介绍内容产品化的品控机制：通过多重审核流程对内容进行质量把关，保证输出品质的稳定性，支撑产品化规模的扩展。
    role: method
    src:
    - paper: 20230808_04_内容产品
  - 'no': 7
    name: 内容产品生长定理：稳定性的来源
    desc: 提炼“内容产品生长定理”：品质的长期稳定不来自一次性完美交付，而来自持续迭代的结构化生长机制。
    role: proof
    src:
    - paper: 20230808_04_内容产品
- 'no': 2
  name: 闪电做课法 —— AI 时代的内容生产线
  desc: 本章将内容产品方法论落地到具体场景：以AI辅助知识付费课程制作，讲解从定位到上架的完整六步做课流程，并引入可复用的首课设计模板。
  nodes:
  - 'no': 1
    name: 为什么要用 AI 做课：降本增效的动机
    desc: 从传统做课周期长、成本高的痛点出发，引出AI辅助做课的动机：借助大模型能力将开发周期压缩至“闪电”级别，实现知识快速产品化。
    role: motivation
    src:
    - paper: BqBud_AI做课
  - 'no': 2
    name: 闪电做课法的定义与适用范围
    desc: 正式定义“闪电做课法”：以AI+知识付费结合为手段的快速课程生产方法论，适用于知识付费、企业培训、个人IP等多元场景。
    role: definition
    src:
    - paper: BqBud_AI做课
  - 'no': 3
    name: 六步做课法：从定位到上架的完整链路
    desc: 系统拆解做课全流程六步：定位→标题→大纲→磨课→录课→上架，每一步明确输入输出与AI介入方式，形成可执行的标准化流水线。
    role: method
    src:
    - paper: BqBud_AI做课
  - 'no': 4
    name: 首课 7 步法：单模块内容的标准制造
    desc: 聚焦单节课（首课）的精细化生产：按7步完成单课内容打磨，确保用户在第一节课中获得完整价值体验，为转化率与完课率奠基。
    role: method
    src:
    - paper: BqBud_AI做课
- 'no': 3
  name: 写作框架 —— 让内容结构会说话
  desc: 本章回归内容的结构基因：梳理8种常见写作框架，重点解剖“干货三件套”等结构化工具，教你如何在写作与课程开发中搭建清晰、有说服力的内容骨架。
  nodes:
  - 'no': 1
    name: 为什么需要写作框架：结构化表达的力量
    desc: 从受众认知负担与信息传播效率切入，说明写作框架为何成为内容结构化的核心工具，建立“先结构后内容”的写作意识。
    role: motivation
    src:
    - paper: 20230808_19_写作框架
  - 'no': 2
    name: 写作框架的定义与种类概览
    desc: 定义“写作框架”概念，并概览8种常见框架的类型、适用场景与表达效果，形成框架选择的完整地图。
    role: definition
    src:
    - paper: 20230808_19_写作框架
  - 'no': 3
    name: 干货三件套：是什么—为什么—怎么做
    desc: 重点拆解最通用且高效的“干货三件套”框架：分别讲解“是什么（定义）—为什么（理由）—怎么做（操作）”三段式的组合逻辑与写作要领。
    role: method
    src:
    - paper: 20230808_19_写作框架
  - 'no': 4
    name: 框架选用与组合策略
    desc: 根据内容类型、受众水平与传播目标，给出框架选用与组合的决策建议，提升单一知识点的表达层次与说服力。
    role: extension
    src:
    - paper: 20230808_19_写作框架
