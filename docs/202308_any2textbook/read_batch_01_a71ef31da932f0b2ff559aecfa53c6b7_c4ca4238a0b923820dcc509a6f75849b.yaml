- file_path: docs/202308/20230815_14.md
  title: 从卖 40 块的 GPT 账号到 250 人的线下大课我做对了什么？
  summary: Bittle.白先生复盘了自己在AI热潮中从低价卖GPT账号起步，通过微创新、颗粒度营销、主动展现价值、着眼长期价值与坚定发心，最终做到250人线下大课的操盘经验。
  core_question: 在快速变化的风口赛道（如AI）中，个人如何从低附加值产品一步步升级到高价值、大规模的知识付费业务？
  key_judgment: 个人在风口赛道做产品的关键操盘原则：坚持"人无我有、人有我优"的微创新；注重颗粒度营销（产品命名、海报、课程框架都要精细设计）；"被看见是一种能力"，要主动创造时机提供价值；在生存之外要着眼"赚以后的钱"；最终靠坚定的发心（帮用户解决问题）支撑长期发展。
  depth: medium
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 内容个人色彩浓厚，路径不可直接复制
  - 部分数据未具体化
  - 涉及AI风口，时效性中等
  screening_conclusion: retain
