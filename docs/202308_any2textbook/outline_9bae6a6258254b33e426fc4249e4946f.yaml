- 'no': 1
  name: 生财思维 —— 在确定与不确定之间做选择
  desc: 本章从生财与创业的二元框架出发，带你区分“确定有解”与“探索未知”两种思维路径，并确立全书的方法论基石。
  nodes:
  - 'no': 1
    name: 生财思维与创业思维
    desc: 用“解题”与“探路”类比：生财思维是在已有跑通闭环的领域破解成功模式，创业思维是在结果不确定的情境下探索方向
    role: motivation
    src:
    - paper: 20230829_03_生财思维
  - 'no': 2
    name: 确定有解优先原则
    desc: 面对多个选项时，优先选择确定有解的路径，降低试错成本，提高成功率
    role: method
    src:
    - paper: 20230829_03_生财思维
  - 'no': 3
    name: 生财思维的适用范围与局限
    desc: 明确该方法适用于已有成功案例的领域，不适用于完全未知的新赛道，为新事物探索留出空间
    role: limitation
    src:
    - paper: 20230829_03_生财思维
- 'no': 2
  name: 冷启动起盘 —— 从0到1的五步法
  desc: 本章拆解从0到1起盘的核心五步：预期管理、价值信念、商业心理、定位匹配与对外曝光，并强调产品是“长出来的”而非“规划出来的”。
  nodes:
  - 'no': 1
    name: 五步冷启动复盘法
    desc: 以预期管理、价值信念、商业心理、定位匹配、对外曝光五步为核心框架，系统复盘点从0到1的冷启动过程
    role: method
    src:
    - paper: 20230808_03_生财起盘
  - 'no': 2
    name: 低预期起盘与价值坚定
    desc: 早期不设高预期，允许产品自然生长；同时对自身提供的价值保持坚定信念，二者缺一不可
    role: motivation
    src:
    - paper: 20230808_03_生财起盘
  - 'no': 3
    name: 定位匹配：社会共识与个人优势
    desc: 定位需结合社会共识与个人优势，确保方向既有市场空间又有自身壁垒
    role: method
    src:
    - paper: 20230808_03_生财起盘
  - 'no': 4
    name: 长出来的而非规划出来的
    desc: 产品形态在实践中逐步显现，而非预先完全设计好；应保持灵活性，让用户反馈参与塑形
    role: proof
    src:
    - paper: 20230808_03_生财起盘
- 'no': 3
  name: 知识付费心法 —— 从用户筛选到IP势能
  desc: 本章聚焦知识付费的完整心法：从用户筛选、势能打造、定位法则到营销闭环，并强调标准化先于团队扩张的节奏把控。
  nodes:
  - 'no': 1
    name: 用户筛选器与势能
    desc: 采用“先筛选后服务”策略，并通过对外展示形成可感知的虚拟势能，吸引高质量用户
    role: motivation
    src:
    - paper: 20230808_05_知识付费心法
  - 'no': 2
    name: 定位3+1法则
    desc: 从闭环→技能→兴趣出发，再结合迎合市场，完成完整的定位推导
    role: method
    src:
    - paper: 20230808_05_知识付费心法
  - 'no': 3
    name: 40字营销法
    desc: 选对方向、进对圈子、错位竞争、IP放大、轻松成交、案例收集、复盘增势、提升单价、反复循环，形成营销闭环
    role: method
    src:
    - paper: 20230808_05_知识付费心法
  - 'no': 4
    name: 引流文章三要素
    desc: 引流文章需包含成绩、经历、可复制经验三个要素，形成信任与转化的完整链路
    role: method
    src:
    - paper: 20230808_05_知识付费心法
  - 'no': 5
    name: 标准化可复制前不组建团队
    desc: 在营销流程标准化之前，不应过早组建团队，否则容易陷入管理失序
    role: limitation
    src:
    - paper: 20230808_05_知识付费心法
  - 'no': 6
    name: 模仿需模仿基因
    desc: 模仿他人成功时，不只模仿表象，还要识别并掌握核心成功基因
    role: extension
    src:
    - paper: 20230808_05_知识付费心法
- 'no': 4
  name: 成功节奏管理 —— 警惕年少成名的暗面
  desc: 本章跳脱“如何更快成功”的常规叙事，反向审视突然成功带来的系统性风险，强调稳步成长的重要性。
  nodes:
  - 'no': 1
    name: 突发成功风险
    desc: 当成功来得太突然且缺乏足够的驾驭能力时，容易因经验与资源不足而快速失败
    role: limitation
    src:
    - paper: 20230808_13_警惕年少成名
  - 'no': 2
    name: 稳步成长的经营策略
    desc: 刻意控制增长速度，让产品、团队与个人认知同步发展，避免因能力断层导致崩盘
    role: extension
    src:
    - paper: 20230808_03_生财起盘
    - paper: 20230808_13_警惕年少成名
