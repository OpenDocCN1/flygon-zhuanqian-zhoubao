screening_principles: 本次筛选核心依据四条原则：一、优先保留能承载系统方法论或深度认知的素材，特别是创始人/一线从业者的一手复盘、结构化可操作的方法论（如打造内容产品、AI做课、写作框架等），这些可作为核心章节或知识库条目；二、对工具性、技巧清单类素材（如微信成交技巧、知识管理经验、心理定价等），虽然单篇深度有限，但因高频刚需且可转化为常青的手册或课程条目，予以保留，不作降权；三、对明显依赖时效性红利或核心内容依赖外链的素材（如公众号流量主套利、AI绘画社群短期红利、外链型预测模型），降为案例或附录使用，不进入正文主干；四、本批素材与主线关联强、未发现明显重复或信息陈旧无法改写的情况，故无素材被排除。
