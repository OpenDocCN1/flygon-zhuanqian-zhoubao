    ,\n        \"第五类：适合长期直播的。\",\n        \"第六类：能高频率更新且流量还不错的。\",\n        \"第七类：不依赖单一平台的。\"\
    ,\n        \"第八类：可延伸至线下变现的。\"\n      ]\n    },\n    {\n      \"name\": \"变现能力差异\"\
