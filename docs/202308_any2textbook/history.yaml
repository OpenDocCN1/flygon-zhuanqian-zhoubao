        11.2 概念地图\n\n```\n提示词定义 → 7大技巧 → 场景应用 → 能力边界\n```\n\n## 11.3 提示词工程与编写技巧\n\n【出处：E4xfd_ChatGPT实战】\"提示词是高效使用ChatGPT的关键\"\n\n提示词工程本质上是\"需求说明书\"。七个核心技巧：\n\n```\n1.
        清晰明确：直接说明你要什么\n2. 提供上下文：给足背景信息\n3. 使用完整句子：避免碎片化指令\n4. 避免歧义：用限定词锁定含义\n5. 使用关键词：突出核心诉求\n6.
        分阶段提问：将复杂任务拆解为多个步骤\n7. 重复关键信息：重要约束条件在提示词中多次强调\n```\n\n| 原则 | 不好的提示词 | 好的提示词
        |\n|------|-------------|-----------|\n| 清晰明确 | \"写点东西\" | \"写一段200字产品介绍，重点突出续航能力\"
        |\n| 提供上下文 | \"帮我翻译\" | \"把这封商务邮件翻译成日语，语气正式礼貌\" |\n| 完整句子 | \"总结\" | \"用3句话总结这篇文章核心观点，点明作者立场\"
        |\n| 避免歧义 | \"写个方案\" | \"为我的咖啡店写一份周末促销方案，预算500元以内\" |\n| 分阶段 | \"帮我写作\" |
        \"先列大纲，再写引言，最后扩写成全文\" |\n\n七条技巧并非孤立，而是共同构成一套完整提示词编写方法论。技巧一二是地基，三四是结构，五六七是优化层。\n\n##
        11.4 场景化应用方法\n\n【出处：E4xfd_ChatGPT实战】\"ChatGPT广泛应用于各种场景\"\n\n| 场景 | 核心诉求 |
        提示词示例片段 |\n|------|---------|--------------|\n| 评论客服 | 快速、礼貌、有温度 | \"回复这条投诉，语气诚恳，先道歉再给方案\"
        |\n| 营销策划 | 创意、差异化、可落地 | \"为奶茶店设计夏季营销方案，含3个创意点\" |\n| 内容运营 | 高频、稳定、符合调性 |
        \"用轻松幽默语气写一篇关于职场压力的短文\" |\n| 辅助办公 | 效率、规范、准确 | \"把会议记录整理成结构化摘要，标注决策项\" |\n|
        数据分析 | 洞察、归纳、可视化建议 | \"分析这组销售数据趋势，指出异常点\" |\n\n不同场景因诉求不同，各技巧权重会有所差异。成熟的 AI
        使用者在简单任务上保持轻量交互，在复杂任务上花时间打磨提示词——\"按需投入\"是最高效的使用方式。\n\n## 11.5 GPT 能力概览与边界\n\n【出处：E4xfd_ChatGPT实战】GPT-4
        的能力与边界是一体两面。\n\n**能力概览：**\n- **识图能力**：支持图像输入，理解图片、图表、数据可视化\n- **长文本处理**：支持更长上下文窗口，可一次处理整本书级别\n-
        **高级推理**：在逻辑推理、数学求解、代码生成等多步思考任务上表现显著提升\n\n**能力边界：**\n\n```\n1. 知识截止于2021年9月，超出时限的信息可能缺失或过时\n2.
        偶尔会生成错误信息（幻觉），需要用户验证\n3. 没有真实世界感知，无法感知用户所处情境\n4. 不具备真正\"理解\"，只是在做概率预测\n```\n\n理解能力边界的目的是成为更聪明的使用者：**知道它能做什么，敢于托付任务；知道它不能做什么，不会盲目信任**。\n\n##
        11.6 设计中的取舍\n\n**为什么需要提示词工程？为什么不直接用自然对话？** 自然对话当然能用，但效果不稳定。提示词工程把\"模糊的自然对话\"升级为\"精准的需求表达\"——增加表达成本，换来稳定符合预期的输出。代价是时间与学习成本，收益在复杂任务上体现。因此成熟的使用者会\"按需投入\"：简单任务轻量交互，复杂任务打磨提示词。\n\n**为什么依赖用户的提示词质量而不让
        AI 自主追问？** 主动追问会增加交互轮次降低响应速度；用户提示词模糊时 AI 的猜测时常令人失望。折中方案：在提示词中明确要求 AI\"需要更多信息时先向我提问再回答\"。\n\n##
        11.7 动手练习\n\n1. 用七个技巧分别改写你日常工作中的一个模糊提示词，观察输出质量差异\n2. 选取熟悉的工作场景，设计三组不同质量提示词对比效果\n3.
        设计一个\"能力边界测试集\"：近期新闻、虚构事实、逻辑陷阱三类问题\n\n## 11.8 本章小结\n\n本章学习了 ChatGPT 的实战应用：提示词工程的七个核心技巧；五个场景（评论客服、营销策划、内容运营、辅助办公、数据分析）的应用方法；GPT-4
