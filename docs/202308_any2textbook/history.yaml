    function:
      arguments: '{"paper": "月薪4000离职后，参加生财有术航海变现4W+，我做对了什么？\n\n作者：冰水煮青蛙\n\n1. 打工人的终点是个体户\n月薪4000，负债几万，还被迫离职。离职第一个月只赚到1000多元。五一前给自己定下目标：月入过万，否则就去送外卖或工地搬砖。\n\n2.
        专注一个项目\n决定专注视频号带货，不贪多。通过模仿对标、选择合适品、与商家合作，逐步拿到结果。\n\n3. 模仿爆款快速获取正反馈\n新手要靠模仿爆款快速拿到正反馈，而不是从零创新。\n\n4.
        选品策略\n选择适合自己人群的品，需要考虑供应链、利润等。\n\n5. 与商家建立合作\n靠谱和真诚是长期合作的基石。主动与商家联系，谈合作方案。\n\n6.
        真实案例\n3个月从0到4W+变现，验证了专注、模仿、选品、合作四步法。\n\n关键经验：\n- 不贪多，专注一个项目\n- 模仿爆款拿正反馈\n-
        选对品+与商家合作\n- 靠谱和真诚是长期合作的基石", "paper_name": "20230822_14_视频号带货从0到1"}'
