      arguments: '{"append": true, "fname": "教科书.md", "text": "\n---\n\n# 第 6 章 写作框架——让内容结构会说话\n\n##
        学习目标\n\n- 理解写作框架在内容生产中的核心作用\n- 掌握干货三件套等核心框架\n- 学会框架选用与组合策略\n- 建立结构化表达意识\n\n##
        6.1 生活类比\n\n写作框架就像建筑施工图纸——在动笔之前，你首先要确定结构，再填充内容。建筑师拿到一块地皮不会立刻堆砌砖瓦，而是先绘制蓝图：哪里是承重墙，哪里是门窗。写作也一样。框架就是那个帮你\"先搭骨架、后填血肉\"的工具，它决定了读者先看到什么、后看到什么，也决定了信息以怎样的逻辑顺序进入对方的脑海。\n\n##
        6.2 概念地图\n\n```\n写作框架：结构预设 + 内容填充\n    ├── 干货三件套：是什么→为什么→怎么做\n    ├── 其他框架：金字塔式、时间线式等\n    └──
        框架选用与组合\n```\n\n## 6.3 为什么要写作框架\n\n【出处：20230808_19】\"写作中常见的8种框架\"\n\n我们为什么需要框架？从三个角度理解：\n\n**第一，降低受众认知负担。**
        没有框架的文章，读者大脑需同时理解内容、推断逻辑、识别重点、建立联系，消耗大量认知资源。框架让读者从\"理清结构\"中解放出来，专注\"理解内容\"。\n\n**第二，结构化表达的力量。**
        当演讲者说\"我将从三个方面展开\"，你的大脑会自动建立\"三栏文件夹\"，把信息分别归入。这种预建的心理结构提升信息接收和记忆效率。\n\n**第三，先结构后内容的意识。**
        许多写作者最大的误区是一上来直接写正文，写到一半发现逻辑混乱。框架先行意味着动笔前已决定主线、板块和衔接。\n\n## 6.4 干货三件套\n\n【出处：20230808_19】\"是什么为什么怎么做\"\n\n**是什么（What）**：定义你要讲的东西，让读者明确\"我们谈论的是同一个事物\"。\n**为什么（Why）**：解释原因和动机，说服读者\"这个问题值得花时间了解\"。\n**怎么做（How）**：给出方法和步骤，让读者\"带着答案离开\"。\n\n```\n1.
        是什么 → 给出定义和特征，让读者锁定对象\n2. 为什么 → 给出理由和动机，让读者产生认同\n3. 怎么做 → 给出步骤和技巧，让读者获得方法\n```\n\n例子：写一篇关于\"番茄工作法\"的教程——是什么（25分钟专注加5分钟休息的循环）；为什么（专注力有限，强行长时间工作降低效率）；怎么做（设定计时器，专注单一任务，响铃休息）。主要靠逻辑递进把一件事讲得清清楚楚。这就是干货三件套的威力。\n\n##
        6.5 框架的种类与选择——8 种常见框架\n\n【出处：20230808_19】\"框架是写作结构化的核心工具\"\n\n| 框架类型 | 适用场景
        | 核心特点 |\n|----------|---------|---------|\n| 干货三件套 | 教程、说明文 | 是什么→为什么→怎么做
        |\n| 金字塔式 | 汇报、新闻 | 结论先行，论据在后 |\n| 时间线式 | 回顾、传记、复盘 | 按时间顺序推进 |\n| 问题-解决式 |
        方案文档、案例 | 提出问题给解决方案 |\n| 对比对照式 | 产品评测 | 展现差异辅助决策 |\n| 清单列表式 | 操作手册 | 逐条列点方便查阅
        |\n| 故事叙事式 | 品牌宣传、软文 | 情节推进情感驱动 |\n| 因果论证式 | 论文、观点文章 | 先因后果严谨推理 |\n\n**根据内容类型选用。**
        写给技术团队看用金字塔式；写给普通用户用故事叙事式；写操作手册用清单列表式。\n\n**框架组合提升表达层次。** 高手不拘泥单一框架，常组合嵌套使用。框架选择本质是\"效率与深度\"之间的权衡，用组合对冲单一框架的局限。\n\n##
        6.6 设计中的取舍\n\n**为什么不把所有信息塞进一种\"万能框架\"？** 因为读者需求多元。有人需快速获取结论（金字塔式），有人需理解来龙去脉（时间线式），有人需情感共鸣（故事叙事式）。框架选择是在\"效率\"和\"深度\"间做交换——清单效率最高但难传深层逻辑，故事情感最深但信息密度低。\n\n##
        6.7 动手练习\n\n1. 把你正在读的这一章结构拆开，看看用了哪几种框架，如何组合\n2. 用干货三件套重写一篇你最近的生产内容\n\n## 6.8
        本章小结\n\n本章学习了写作框架的核心价值与应用：理解写作框架能降低认知负担、让结构化表达成为可能、形成\"先结构后内容\"意识；拆解干货三件套（是什么、为什么、怎么做）；概览8种常见框架及其适用场景；讨论框架的选用与组合策略。\n\n|
        概念 | 解释 |\n|------|------|\n| 写作框架 | 内容是结构化的核心工具 |\n| 干货三件套 | 是什么为什么怎么做的三段式
        |\n| 框架组合 | 根据内容类型和受众目标选用组合 |\n\n**下一章预告：** 从认知篇和内容篇转向实操——从项目思维到个体户，开启自由职业之路。\n"}'
      name: tool_write_workspace_text
    type: function
