  content: "{\n  \"paper\": \"20230808_04_打造内容产品的关键\",\n  \"desc\": \"该素材以《得到品控手册》为案例，阐述了打造内容产品的关键方法论：聚焦核心业务环节进行知识萃取，并通过‘012N标准化结构’（全域聚焦到单一知识点、沉淀模型与场景、发展N个解法）将隐性经验转化为可复用、可迭代的内容产品，同时强调品控流程与持续生长理念。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"内容产品\",\n      \"desc\": \"将知识或经验视为一个可迭代、可生长、面向特定绩效目标的产品实体，而非一次性静态文件。\"\
    ,\n      \"is_original\": false,\n      \"excerpt\": [\n        \"核心理念：品控手册是一个'内容产品'而非一个'文件'，它必须持续迭代、不断生长。\"\
    \n      ]\n    },\n    {\n      \"name\": \"知识萃取\",\n      \"desc\": \"从海量业务环节中筛选出最能影响产品结果的单一核心环节，并围绕其提炼高质量单篇知识的过程。\"\
    ,\n      \"is_original\": false,\n      \"excerpt\": [\n        \"知识萃取的核心：聚焦核心业务环节。从上千个环节中，找到最核心、最能影响产品结果的环节。\"\
    ,\n        \"我们要做的工作是：给出高质量的单篇知识。\"\n      ]\n    },\n    {\n      \"name\": \"\
    012N标准化结构\",\n      \"desc\": \"一种将全域知识逐步聚焦为单一知识点、再沉淀为模型与场景、最终发散出N个具体解法的标准化组织框架。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"'0'全域，'1'聚焦，'2'模型，'N'解法。\"\
    ,\n        \"0-1：从全域知识聚焦到单一知识点\",\n        \"1-2：围绕这个知识点，沉淀出它的本质、模型和场景\",\n  \
    \      \"2-N：基于模型和场景，发展出N个具体解法\"\n      ]\n    }\n  ],\n  \"methods\": [\n   \
    \ {\n      \"name\": \"__overview__\",\n      \"desc\": \"以绩效为导向、依场景为用、因发展而变的制作流程：定位目标-聚焦萃取-标准化结构化-多环节品控-持续迭代发布。\"\
    ,\n      \"excerpt\": [\n        \"《得到品控手册》是一本写给'得到'员工自己使用的工作指南。\",\n        \"\
    手册中的内容都是为绩效而写，依场景而用，因发展而变。\"\n      ]\n    },\n    {\n      \"name\": \"聚焦核心业务环节萃取法\"\
    ,\n      \"desc\": \"从上千个业务环节中筛选出最核心、最能影响产品结果的单一环节，并在此环节上产出高质量单篇知识。\",\n     \
    \ \"excerpt\": [\n        \"从上千个环节中，找到最核心、最能影响产品结果的环节。\",\n        \"给出高质量的单篇知识。\"\
    \n      ]\n    },\n    {\n      \"name\": \"品控流程（多重审核机制）\",\n      \"desc\": \"\
    通过总编室多重审核保证品质稳定，每个单篇知识强制走完选题-撰写-审核-发布-迭代的完整闭环。\",\n      \"excerpt\": [\n    \
    \    \"总编室的多重审核机制保证品质稳定。\",\n        \"每一个单篇知识都要经过选题-撰写-审核-发布-迭代的完整流程。\"\n   \
    \   ]\n    }\n  ],\n  \"theorems\": [\n    {\n      \"name\": \"内容产品生长定理\",\n\
    \      \"desc\": \"内容品质的稳定性并非来自一次性终稿，而来自持续迭代的生长机制；只有当内容被视作产品而非文件时，才能真正沉淀出可复用的知识资产。\"\
    ,\n      \"excerpt\": [\n        \"核心理念：品控手册是一个'内容产品'而非一个'文件'，它必须持续迭代、不断生长。\"\n\
    \      ]\n    },\n    {\n      \"name\": \"绩效导向原则\",\n      \"desc\": \"内容产品的价值锚点是绩效结果，一切内容都应为实际工作绩效服务，脱离绩效的知识不构成有效产品。\"\
    ,\n      \"excerpt\": [\n        \"手册中的内容都是为绩效而写，依场景而用，因发展而变。\"\n      ]\n   \
    \ },\n    {\n      \"name\": \"聚焦-发散原理（0→1→2→N）\",\n      \"desc\": \"知识从全域（0）收敛到单一要点（1），再升华出本质模型（2），最终繁衍出N个场景化解法；聚焦是优化的前提，发散是复用的途径。\"\
    ,\n      \"excerpt\": [\n        \"0-1：从全域知识聚焦到单一知识点\",\n        \"1-2：围绕这个知识点，沉淀出它的本质、模型和场景\"\
    ,\n        \"2-N：基于模型和场景，发展出N个具体解法\"\n      ]\n    }\n  ],\n  \"findings\": [\n\
    \    {\n      \"name\": \"《得到品控手册》的产品化实证\",\n      \"desc\": \"[evidence] 由素材本身作为案例支撑：手册既是品控心得，又是一个完整内容产品，其效用体现在它被实际用于员工工作指南并帮助稳定产出单篇知识。\"\
    ,\n      \"excerpt\": [\n        \"《得到品控手册》既是得到的品控心得，本身也是个完整的内容产品。\",\n      \
    \  \"是一本写给'得到'员工自己使用的工作指南。\"\n      ]\n    }\n  ]\n}"
