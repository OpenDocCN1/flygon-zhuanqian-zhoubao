  content: "{\n  \"paper\": \"20230808_05_知识付费创业心法\",\n  \"desc\": \"本文素材是知识付费创业者芷蓝分享的'精选心法'系列（51-75条），以清单体形式给出了私域与公域运营、IP打造、模仿创新、产品体系搭建、咨询交付等方面的25条实操经验与经营原则，核心主张包括'先筛选后服务''定位3+1法则''模仿成功基因而非表象'等，并涉及知识付费行业的资产观与变现模式判断。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"用户筛选器\",\n      \"desc\": \"用自身生态位去制作一个筛选用户逻辑，实现'先筛选，后服务'的私域经营原则。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"想在私域赚到1000万以上，就要明白'先筛选，后服务'这个逻辑，用自己的生态位去制作一个用户筛选器。\"\
    \n      ]\n    },\n    {\n      \"name\": \"势能\",\n      \"desc\": \"通过持续对外展示当前与未来在做的事，在朋友圈形成可被感知的虚拟能量，进而促进产品成交。\"\
    ,\n      \"is_original\": false,\n      \"excerpt\": [\n        \"势能这个东西是虚的，但却可以人感知到。你有了势能，你的产品就有人买了。\"\
    \n      ]\n    },\n    {\n      \"name\": \"定位3+1法则\",\n      \"desc\": \"知识付费创业定位依次考虑：跑通的闭环、可被包装成产品的技能、自己喜欢的兴趣。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"定位3+1法则：首先考虑跑通的闭环，其次考虑可被包装成产品的技能，最后才是自己喜欢的。\"\
    \n      ]\n    },\n    {\n      \"name\": \"动态好友价值逻辑\",\n      \"desc\": \"微信号从普通好友发展为付费用户，并持续转变为动态付费用户的成长逻辑。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"建立动态的好友价值逻辑，一个微信号变成1万个付费用户再变成动态付费用户。\"\
    \n      ]\n    },\n    {\n      \"name\": \"流动性资产\",\n      \"desc\": \"在知识付费行业中，把手里的现金转化为可投资的个人势能，再用流动性资产变成数倍现金。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"学会把手里的现金变成流动性的资产，再把这种资产变成几倍的现金。对知识付费行业，流动性资产是一个可投资的个人势能。\"\
    \n      ]\n    }\n  ],\n  \"methods\": [\n    {\n      \"name\": \"40个字营销方法\"\
    ,\n      \"desc\": \"一套完整的知识付费营销流程：选对方向、进对圈子、错位竞争、IP放大、轻松成交、案例收集、复盘增势、提升单价、反复循环。\"\
    ,\n      \"excerpt\": [\n        \"40个字营销方法：选对方向，进对圈子，错位竞争，IP放大，轻松成交，案例收集，复盘增势，提升单价，反复循环。\"\
    \n      ]\n    },\n    {\n      \"name\": \"引流文章三要素\",\n      \"desc\": \"撰写引流文章必须包含成绩、经历（英雄之旅）、可复制的经验（实操步骤）三个要素。\"\
    ,\n      \"excerpt\": [\n        \"写引流文章，至少写出3个要素：成绩、经历、可复制的经验。第一是成绩，第二是经历（英雄之旅），第三是可复制的经验（引流得给用户一个实操步骤）。\"\
    \n      ]\n    },\n    {\n      \"name\": \"红海模仿突破路径\",\n      \"desc\": \"普通人在红海细分赛道模仿同行赚钱，突破点在于赚到第一块钱后优化和复制自己的流程。\"\
    ,\n      \"excerpt\": [\n        \"普通人在红海里找一个细分赛道，然后去模仿同行才是知识付费创业者赚钱最稳妥的方式。突破点在于模仿成功赚到第一块钱后，要优化和复制自己的流程。\"\
    \n      ]\n    },\n    {\n      \"name\": \"训练营上学场景还原法\",\n      \"desc\": \"\
    训练营交付要还原上学场景：老师讲课、举手回答、提交作业、阶段总结。\",\n      \"excerpt\": [\n        \"训练营要做好，需要还原上学场景：老师讲课、举手回答、提交作业、阶段总结。\"\
    \n      ]\n    },\n    {\n      \"name\": \"合伙人业务联合服务法\",\n      \"desc\": \"\
    通过合伙人业务联合完成服务流程，本质是用更低价格采购别人的优质服务。\",\n      \"excerpt\": [\n        \"做咨询服务，可以通过合伙人业务联合完成服务流程，本质是用更低价格采购别人优质服务。\"\
    \n      ]\n    }\n  ],\n  \"theorems\": [\n    {\n      \"name\": \"标准化可复制前不组建团队\"\
    ,\n      \"desc\": \"在营销流程未达到标准化、可复制之前，不应过早组建团队，做IP需接受'鱼与熊掌不可兼得'。\",\n      \"\
    excerpt\": [\n        \"在你的营销流程不具备标准化、可复制性之前，不要过早去尝试组建团队。做IP你就得明白：鱼与熊掌不可兼得。\"\n\
    \      ]\n    },\n    {\n      \"name\": \"知识付费是轻资产但非零资产创业\",\n      \"desc\"\
    : \"知识付费属于轻资产创业，但内容的创造过程仍需资金支持，并非零资产创业。\",\n      \"excerpt\": [\n        \"做自媒体知识付费，是轻资产创业，但不是0资产创业。内容是创造出来的，这个创造过程也需要资金支持。\"\
    \n      ]\n    },\n    {\n      \"name\": \"模仿需模仿基因而非表象\",\n      \"desc\": \"\
    模仿失败的根源在于不知道对方的成功基因，只模仿表象而忽视核心成功要素；模仿还须涵盖个人行为轨迹。\",\n      \"excerpt\": [\n  \
    \      \"模仿会失败是因为你不知道对方的成功基因是什么。只模仿表象，不知道核心成功要素。\",\n        \"模仿时不能光模仿内容、输出体系、引流路径，还要模仿个人行为轨迹。\"\
    \n      ]\n    },\n    {\n      \"name\": \"先粗旷创新后精致优化\",\n      \"desc\": \"\
    创业第一阶段要追求速度和粗旷玩法，避免'平庸的精致'，即先做'粗旷的创新'。\",\n      \"excerpt\": [\n        \"不做'平庸的精致'而是'粗旷的创新'。第一阶段一定是速度，一定是那个粗旷的玩法。\"\
    \n      ]\n    },\n    {\n      \"name\": \"咨询交付以行动步骤为最满\",\n      \"desc\": \"\
    咨询交付中用户最满意的永远是明确的行动步骤。\",\n      \"excerpt\": [\n        \"咨询交付用户最满意的永远是行动步骤。'接下来你要1234这几步曲走'。\"\
    \n      ]\n    },\n    {\n      \"name\": \"后期变现模式转向知识库或会员\",\n      \"desc\"\
    : \"知识付费玩到后期最好的变现模式是微商那套，把产品变成一个知识库或付费会员。\",\n      \"excerpt\": [\n        \"\
    知识付费玩到后期最好的变现模式是微商那一套，把产品变成一个知识库或付费会员。\"\n      ]\n    },\n    {\n      \"name\"\
    : \"服务大多数而非每个需求\",\n      \"desc\": \"要肯定用户提出的需求，但不代表满足每个需求，服务对象是大多数用户。\",\n \
    \     \"excerpt\": [\n        \"要肯定用户提出的需求，但不代表满足每个需求。你服务的是大多数。\"\n      ]\n \
    \   }\n  ],\n  \"findings\": [\n    {\n      \"name\": \"赚钱与兴趣并非一回事\",\n     \
    \ \"desc\": \"[claim] 赚自己能赚的钱与干自己喜欢的事不是一回事，因此定位应先看闭环与可包装技能，最后才是兴趣。\",\n      \"\
    excerpt\": [\n        \"赚自己能赚的钱，和干自己喜欢干的事情，真的不是一回事。定位3+1法则：首先考虑跑通的闭环，其次考虑可被包装成产品的技能，最后才是自己喜欢的。\"\
    \n      ]\n    },\n    {\n      \"name\": \"私域公域适配性判断\",\n      \"desc\": \"[claim]\
    \ 有团队+有展现力的人适合做公域；独立个体且不善于表达的人更适合一开始就做私域；私域玩个性+价值，公域看数据。\",\n      \"excerpt\"\
    : [\n        \"私域玩的是个性+价值，公域要会看数据。有团队+有展现力的人适合做公域；独立个体且不善于表达的人，更适合一开始就做私域。\"\n\
    \      ]\n    },\n    {\n      \"name\": \"商业案例整理是新手的0到1路径\",\n      \"desc\"\
    : \"[claim] 如果没有资源也不擅长技能，做某行业的商业案例整理是新手从0~1最好的路径。\",\n      \"excerpt\": [\n \
    \       \"如果没有资源也不擅长技能，可以做某行业的商业案例整理，这是新手从0~1最好的路径。\"\n      ]\n    },\n    {\n\
    \      \"name\": \"技能包装进高端行业增值效应\",\n      \"desc\": \"[claim] 把基础的技能包装进高端服务行业里，技能就更值钱了。\"\
    ,\n      \"excerpt\": [\n        \"把基础的技能包装进高端服务行业里，技能就更值钱了。\"\n      ]\n    },\n\
    \    {\n      \"name\": \"白嫖内容可助传播\",\n      \"desc\": \"[claim] 被别人白嫖不可怕，只要不浪费时间和精力，白嫖者也可以帮助传播内容。\"\
    ,\n      \"excerpt\": [\n        \"被别人白嫖不可怕，只要不浪费你的时间和精力。白嫖你内容的人也可以帮助你传播。\"\n\
    \      ]\n    },\n    {\n      \"name\": \"产品体系渐进式构建原则\",\n      \"desc\": \"\
    [claim] 产品体系是一步步做出来的，1个产品就卖1个产品，并想尽一切办法卖爆。\",\n      \"excerpt\": [\n        \"\
    产品体系是一步步做出来的。1个产品就卖1个产品，想尽一切办法卖爆。\"\n      ]\n    },\n    {\n      \"name\": \"\
    内容付费强化记忆与价值获取\",\n      \"desc\": \"[claim] 主动为有价值的内容付费，可以从内容中获取更多价值并牢牢记住。\",\n\
    \      \"excerpt\": [\n        \"主动为有价值的内容付费，可以从内容中获取更多价值，并且牢牢记住他。\"\n      ]\n\
    \    },\n    {\n      \"name\": \"与超级个体合作的三个维度\",\n      \"desc\": \"[claim] 与超级个体的合作分为产品（产品库）、搞事情（提升势能）、流量（价值回流）三个维度。\"\
    ,\n      \"excerpt\": [\n        \"和超级个体的合作分3个维度：产品（产品库）、搞事情（提升势能）、流量（价值回流）。\"\
    \n      ]\n    },\n    {\n      \"name\": \"持续可承受的营销方式优先\",\n      \"desc\": \"\
    [claim] 找到适合自己的节奏和营销方式很重要，应持续做能让自己持续且不那么痛苦的方式。\",\n      \"excerpt\": [\n    \
    \    \"找到自己的节奏和适合自己的营销方式很重要，持续做能让自己持续做且不那么痛苦的方式。\"\n      ]\n    }\n  ]\n}"
