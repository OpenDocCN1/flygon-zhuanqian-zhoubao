      arguments: '{"paper_name": "20230808_04_打造内容产品的关键", "paper": "《得到品控手册》既是得到的品控心得，本身也是个完整的内容产品。\n一、品控手册的定位\n《得到品控手册》是一本写给\"得到\"员工自己使用的工作指南。手册中的内容都是为绩效而写，依场景而用，因发展而变。\n二、聚焦核心业务环节做知识萃取\n我们要做的工作是：给出高质量的单篇知识。\n知识萃取的核心：聚焦核心业务环节。从上千个环节中，找到最核心、最能影响产品结果的环节。\n三、012N标准化结构\n\"0\"全域，\"1\"聚焦，\"2\"模型，\"N\"解法。具体来说：\n0-1：从全域知识聚焦到单一知识点\n1-2：围绕这个知识点，沉淀出它的本质、模型和场景\n2-N：基于模型和场景，发展出N个具体解法\n四、品控流程\n总编室的多重审核机制保证品质稳定。每一个单篇知识都要经过选题-撰写-审核-发布-迭代的完整流程。\n核心理念：品控手册是一个\"内容产品\"而非一个\"文件\"，它必须持续迭代、不断生长。"}'
