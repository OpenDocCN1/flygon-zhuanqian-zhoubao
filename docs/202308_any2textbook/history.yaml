  content: "{\n  \"docs/202308/20230808_03.md\": \"# 生财是怎么从 0 到 1 做起来的？  > 原文：[`www.yuque.com/for_lazy/thfiu8/sqxv8uzp75dfd251`](https://www.yuque.com/for_lazy/thfiu8/sqxv8uzp75dfd251)\
    \    ## (精华帖)(429 赞)生财是怎么从 0 到 1 做起来的？   日期：2023-08-04   提问：   从一个纯纯的职场人，到创业者，我越来越觉得从\
    \ 0 到 1 这条路实在是太漫长了，比想象中要困难很多。 但是网上我们能看到的那些大佬，应该都在我们不知道的时候完成了从 0 到 1 的积累。   所以就突然特别好奇，像生财这样的超级厉害超级成熟的社群，是怎么从\
    \ 0 到 1 做起来的。   这是一个赚钱人的交流社群，那一开始没有人的时候，是怎么破冰的呢？   以我目前的认知，完全不知道如果要我来做的话，我该怎么开始。\
    \   不知道亦仁大大是否能分享下当时从 0 到 1 的起盘过程，想领悟一下高手究竟是怎么想的，怎么做的。   回答   1.  随手干起来，没有高预期 \
    \  生财有术是长出来的，不是规划出来的。  \",\n  \"docs/202308/20230808_04.md\": \"# 打造一个内容产品的关键是什么？——以《得到品控手册\
    \ 9.0》为例  > 原文：[`www.yuque.com/for_lazy/thfiu8/exxtfgvdya1p2sg8`](https://www.yuque.com/for_lazy/thfiu8/exxtfgvdya1p2sg8)\
    \    ## (精华帖)(347 赞)打造一个内容产品的关键是什么？——以《得到品控手册 9.0》为例   作者： 马想   日期：2023-08-04\
    \   大家好，我是得到 COO 马想，负责得到的运营工作，同时也负责得到的商学及各线下校区高研院业务，在生财有术也能看到一些高研院校友的身影。   前几天生财团队邀请我来生财星球做个分享，怎么打造好一个内容。我请“得到总编室团队”整理一下，以《得到品控手册\
    \ 9.0》为例子，分享我们在打造《得到品控手册》中，会遇到的一些阶段和考虑因素。   《得到品控手册》既是得到的品控心得，本身也是个完整的内容产品。  \
    \ ### 一、品控手册的定位   《得到品控手册》是一本写给“得到”员工自己使用的工作指南。手册中的内容都是为绩效而写，依场景而用，因发展而变。 \",\n\
    \  \"docs/202308/20230808_05.md\": \"# 1 年 500 万+利润，知识付费创业心法（51-75）  > 原文：[`www.yuque.com/for_lazy/thfiu8/dqq4iaepo1zx9kw6`](https://www.yuque.com/for_lazy/thfiu8/dqq4iaepo1zx9kw6)\
    \    ## (精华帖)(223 赞)1 年 500 万+利润，知识付费创业心法（51-75）   作者： 芷蓝   日期：2023-08-02   之前写了\
    \ 1-50 的系列，我看 800 多个赞了，最近这 2 个月又尝试了一些新的玩法，有了一些新的感悟和心得，和大家聊聊，希望能够帮助到大家。   https://t.zsxq.com/10OPAktiW（1-50\
    \ 系列）   51、想在私域赚到 1000 万以上，就要明白“先筛选，后服务”这个逻辑，用自己的生态位去制作一个用户筛选器。   分享给大家我这几年做私域沉淀下来的\
    \ 40 个字的营销方法：选对方向，进对圈子，错位竞争，IP 放大，轻松成交，案例收集，复盘增势，提升单价，反复循环。   52、在你的营销流程不具备标准化、可复制性之前，不要过早去尝\"\
    ,\n  \"docs/202308/20230808_06.md\": \"# 从 0 到 1 快团团做到了高客单榜全国第一，我的 7 个提高项目成功率的方法论。\
    \  > 原文：[`www.yuque.com/for_lazy/thfiu8/dpn57hpdfycz35vk`](https://www.yuque.com/for_lazy/thfiu8/dpn57hpdfycz35vk)\
    \    ## (精华帖)(174 赞)从 0 到 1 快团团做到了高客单榜全国第一，我的 7 个提高项目成功率的方法论。   作者： 苏铁   日期：2023-08-02\
    \   大家好，我是苏铁。96 年创业者。大一开始做互联网，8 年的时间，现在团队 100 人＋，快团团年 GMV1.2 亿，全国排名前 30，快团团高客单价转化最好的团队，高客单榜全国\
    \ TOP1，欢迎有志同道合的朋友来找我交流。   公司从去年一直在测试各种各样的新项目，包括身边朋友也做了非常多项目，有成功的，也有失败的，从我的角度来讲讲怎么样能够提高项目的成功率，也算对自己这段时间的一个复盘。有个已知条件：从去年开始。我很少自己下场做项目了，只是负责找到合适的人，合适的项目就开启了一个新的项目，这里就不讨论老板\"\
    ,\n  \"docs/202308/20230808_08.md\": \"# 如何从 0-1 完成自由职业转型，实现月入 20W+  > 原文：[`www.yuque.com/for_lazy/thfiu8/lyak7oigu909947i`](https://www.yuque.com/for_lazy/thfiu8/lyak7oigu909947i)\
    \    ## (精华帖)(100 赞)如何从 0-1 完成自由职业转型，实现月入 20W+   作者： 老瞿 Qu   日期：2023-08-04   大家好，我是老瞿\
    \ Qu，生财有术最懂二手书的男人。今天我将用我职场工作 8 年+自由职业 2 年的全部经验，跟大家聊聊如何从 0-1 完成自由职业转型。   先说说当下正在拿到业绩的项目：\
    \   1、小区有一个小工作室，夫妻店，做闲鱼二手书项目，目前运营帐号 30+，平均月利润 10W+，已经持续一年多了。   2、2023 年开始尝试做二手书的知识付费，目前付费会员\
    \ 500+，合伙人 20 个，平均月利润 10W+，已经持续 6 个月。   个人感觉当下的状态还挺舒服的，我现在深深地觉得打工人的终点是个体户，而一个个体户最好的状态，就是在小区开个小工作室，然后\"\
    ,\n  \"docs/202308/20230808_13.md\": \"# 警惕：年少成名、一夜暴富与开业就火  > 原文：[`www.yuque.com/for_lazy/thfiu8/yt1ad3baim75zz8o`](https://www.yuque.com/for_lazy/thfiu8/yt1ad3baim75zz8o)\
    \    ## (110 赞)警惕：年少成名、一夜暴富与开业就火   作者： 小马宋   日期：2023-07-31   警惕：年少成名、一夜暴富与开业就火\
    \   李叫兽跟我聊天的时候，曾经讲过自己的体会，他说有两件事很可怕，一个是年少成名，一个是一夜暴富。然而不幸的是，这两件事他自己都赶上了。好在他善于反思，勤于思考，没有被这两件事侵噬。\
    \   当然，这两件可能是所有人梦寐以求的，因为看起来实在太诱人了。 有人统计过美国中过乐透大奖的人，如果他原来就是个穷人，那么大部分都会在几年之后回到贫穷状态，更不幸的可能会染上各种恶习，反倒更加悲惨。\
    \   如果今天突然给你 1 亿现金，绝大部分人并不具备拥有并使用 1 亿现金的经验和能力，而且当你拥有 1 亿现金的时候，那些觊觎这些钱的人，会突然出现。你也没有能力识别是赚钱机会还是投资陷阱。\
    \ \",\n  \"docs/202308/20230808_19.md\": \"# 8 种常见框架，高效完成写作  > 原文：[`www.yuque.com/for_lazy/thfiu8/wgupunog5xvwfyfn`](https://www.yuque.com/for_lazy/thfiu8/wgupunog5xvwfyfn)\
    \    ## (精华帖)(312 赞)8 种常见框架，高效完成写作   作者： 粥左罗   日期：2023-08-05   【粥左罗：一看就会、一用就废的“8\
    \ 种常见框架，高效完成写作”】   大家好我是粥左罗，又来写作真干货了，这节课我们讲讲写作中常见的 8 种框架。   大道至简，一看就会，一用就废…… 但多用几遍就真会了。\
    \   一、干货三件套   what——why——how 是什么——为什么——怎么做   任何时候写干货文章、写课程，都可以用到，是什么，写定义，为什么写原因，怎么做写方法。\
    \   我写过一篇《30 岁，比起财务自由，我更渴望社交自由》   第一部分：有一种自由，叫社交自由（写是什么）   第二部分：垃圾社交，越社越焦（写为什么）\
    \   第三部分：如何才能相对社交自由？（写怎么做）   我要写一个讲写作的干货《个人\",\n  \"docs/202308/20230822_14.md\"\
    : \"# 月薪 4000 离职后，参加生财有术航海变现 4W+，我做对了什么？  > 原文：[`www.yuque.com/for_lazy/thfiu8/fnep6k7mvyn2pc48`](https://www.yuque.com/for_lazy/thfiu8/fnep6k7mvyn2pc48)\
    \    ## (精华帖)(429 赞)月薪 4000 离职后，参加生财有术航海变现 4W+，我做对了什么？   作者： 冰水煮青蛙   日期：2023-08-18\
    \   月薪 4000，负债几万，还被迫离职，你会怎么办？放弃还是拼搏？   大家好，我是冰水煮青蛙，来自五线养老型城市，在今年年初，这些沉重的关键词正重压了在我身上时，我选择了赌上一次。\
    \   曾有新公司的邀约近在眼前，但我选择了成为一名自由职业者，寄希望于居家办公带给我的新生活。但真正的创业之路比我想象的还要坎坷，离职的第一个月，只赚到了\
    \ 1000 多元。每个月收入微薄，压力和焦虑如影随形。   五一前，我给自己定了一个目标：月入过万。否则，我就去送外卖或工地搬砖。可时间在流逝，而希望却遥不可及。每次看到别人的成功故事，我总会问自己：\"\
    ,\n  \"docs/202308/20230822_19.md\": \"# 关于拖延症的一些想法，以及相应的解决办法  > 原文：[`www.yuque.com/for_lazy/thfiu8/gqpbue5iep8d6ohx`](https://www.yuque.com/for_lazy/thfiu8/gqpbue5iep8d6ohx)\
    \    ## (68 赞)关于拖延症的一些想法，以及相应的解决办法   作者： LosAnky   日期：2023-08-14   大家好，我是 5 月个人优势挖掘航海的优势教练上淇。\
    \   咱生财都是特别有行动力的圈友，好多人都出了成果，但确实也经常收到圈友提问，明明知道某些项目可以赚钱，我也想赚钱，为什么一直拖延动不起来呢？   今天想聊聊关于拖延症的一些想法，以及相应的解决办法。\
    \   目标、动力、路径、方法、资源，这是战胜拖延的 5 个维度，也是拖延的 5 个根因。   一、先说说目标   目标不是欲望，而是内在真正的渴望。  \
    \ 那它俩怎么区分？   很简单，欲望就是我想赚更多的钱，有更高的地位，掌握更多的权力，可以更好地吃喝玩乐，穷奢极欲，让别人羡慕自己，主打一个“利己”，希望得到更多；\
    \   而渴望则是我想赚更多的\",\n  \"docs/202308/20230822_40.md\": \"# 小红书爆文率 70%，一篇人设文涨粉 1w\
    \ 的爆文公式  > 原文：[`www.yuque.com/for_lazy/thfiu8/zdgdnoddlq912dnm`](https://www.yuque.com/for_lazy/thfiu8/zdgdnoddlq912dnm)\
    \    ## (125 赞)小红书爆文率 70%，一篇人设文涨粉 1w 的爆文公式   作者： 漫漫 mansi   日期：2023-08-14   今天的内容又爆了，（发布一小时小眼睛\
    \ 7000+点赞 330 就是爆的预兆，估计能上万）   果然我做内容只要想爆就能爆。   ![](img/10f822d5721ff81399ebbec8f715594b.png)\
    \    我偶尔会不刻意去做爆款，而是做一些能加强粉丝粘性的内容，但是为了维护数据稳定，一周至少要做几篇爆款保证我流量和数据的稳定   ![](img/2c0b8709bc17ab7cf3d46c48cee9543f.png)\
    \    我流量来源，首页推荐高达 82%。我的很多选题都变成了爆款选题，很多博主模仿借鉴。![](img/d24db4661\",\n  \"docs/202308/20230829_03.md\"\
    : \"# 在生财选项目做生意赚钱，和外面的创业，最大的不同是什么？  > 原文：[`www.yuque.com/for_lazy/thfiu8/bin3n0w9mhsqug2d`](https://www.yuque.com/for_lazy/thfiu8/bin3n0w9mhsqug2d)\
    \  ## (精华帖)(349 赞)在生财选项目做生意赚钱，和外面的创业，最大的不同是什么？  作者： 亦仁  日期：2023-08-24  在生财选项目做生意赚钱，和外面的创业，最大的不同是什么？\
    \  前者是确定有解，后者是不确定有没有解。  前者已经有大量的跑通和闭环，大量的人已经赚到钱了，我们要做的是去“破解”而已，这难度是比后者至少要小一个数量级。\
    \  而对于后者，最难的是，你不知道前方有没有路，大量的精力和资源在寻找方向上。  这就像，研发 chatgpt 可能只有 openai 可以搞定，但 chatgpt\
    \ 出来后，大量的国内公司看到确定有解后，投入资源去跟进和复制即可，无非是快慢而已。  如果区分一下思维方式，将前者表达成生财思维，将后者表达成创业思维，那么大量的圈友的思维方式其实都是创业思维，因\"\
    ,\n  \"docs/202308/20230829_09.md\": \"# 未来只有这八类 up 主，才能真正赚到钱  > 原文：[`www.yuque.com/for_lazy/thfiu8/wbon5pg5lcthq9qd`](https://www.yuque.com/for_lazy/thfiu8/wbon5pg5lcthq9qd)\
    \  ## (59 赞)未来只有这八类 up 主，才能真正赚到钱  作者： 书情小跟班  日期：2023-08-21  前言：不是我原创，内容已经原作者（小五哥）授权\
    \  自媒体门槛极低，是个人都可以试试。  加上自媒体确实具有打工一族所奢望的自由，不用打卡，不用看老板的脸色，想去旅游说走就走。自媒体如果做好了，有稳定的现金流，确实日子还是比较滋润的。\
    \  所以虽然不像以前那样遍地都是钱了，这个身份依旧具有极大的吸引力。  门槛低意味着竞争激烈，蛋糕总共就那么大，肯定不会分到每个人头上。  前仆后继加入自媒体大军的，真正能够挣钱并持续挣钱的并不多。\
    \  这里面大部分没有折腾起足够的水花，即粉丝、播放量等数据远不足以实现商业化。  还有相当比例的，看着数据不错，粉丝几十上百万，也偶有播放量很高的爆款作品。但收入可能连普通上班族都不\"\
    \n}"
