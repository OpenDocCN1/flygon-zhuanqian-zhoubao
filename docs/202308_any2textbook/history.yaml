      arguments: '{"body": "# 第 0 章 生财思维：在确定与不确定之间做选择\n\n## 学习目标\n\n- 理解生财思维与创业思维的本质区别\n-
        掌握确定有解优先原则的决策准则\n- 了解生财思维的适用范围与局限\n\n## 0.1 生活类比\n\n想象你在一个陌生的城市里寻找一家餐厅。生财思维的做法是打开手机地图，搜索\"附近评分最高的餐厅\"，然后看着别人留下的评价和导航路线，沿着已经有人走过的路到达目的地。而创业思维则是走出城区，来到一片没有人标记过的荒野，手里没有地图，只能凭借星空和直觉判断方向。这两种心态，正是我们在\"用已有方法赚钱\"和\"去探索未知的赚钱方式\"之间做选择时的真实写照。\n\n##
        0.3 生财思维vs创业思维——解题与探路的分岔口\n\n> [20230829_03_生财思维] \"大量的人已经赚到钱了，我们要做的是去破解而已\"\n\n这句话道出了生财思维的灵魂。前提是：这条路上已经有人走通了。你要做的不是创造一条新路，而是把别人走过的路复盘一遍，找出赚钱的因果链条，然后复制执行。\n\n我们再看它的对立面——创业思维。素材中这样描述：在不明确是否有人能成功的情况下进行探索。\n\n|
        维度 | 生财思维 | 创业思维 |\n|------|---------|---------|\n| 起点 | 已有成功案例 | 空白地带 |\n|
        目标 | 破解成功模式 | 探索方向 |\n| 确定性 | 确定有解 | 不确定有解 |\n\n## 0.4 生财思维的核心定义与分解\n\n**定义**：在已有跑通闭环领域，通过破解成功模式来获得确定收益的思维方式。可以拆成三个要素：\n\n-
        已有跑通闭环的领域\n- 破解成功模式（逆向工程）\n- 获得确定收益\n\n## 0.5 确定有解优先原则\n\n**定义：** 在多个可选机会中，优先选择那些已被验证有解的路径。\n\n在资源有限的条件下，先吃确定性的果实，再用剩余资源去探索未知。这条原则成立的前提是\"存在已验证的成功案例\"。\n\n##
        0.6 生财思维的边界\n\n生财思维高度依赖场域成熟度：场域越成熟，确定性越高；场域越新，确定性越低。在未有成功案例的未知地带，此方法会失效。\n\n##
        0.7 动手练习\n\n- 列出你所在行业的3个成功案例，尝试拆解其商业模式闭环\n- 将\"大量的人已经赚到钱了，我们要做的是去破解而已\"改写为你自己的决策准则\n\n##
        0.8 本章小结\n\n本章学习了生财思维与创业思维的本质区别，掌握了确定有解优先原则，深入拆解了生财思维的三个要素，明确了生财思维的适用范围与局限。",
        "detail": {"no": 0, "learning_targets": ["理解生财思维与创业思维的本质区别", "掌握确定有解优先原则的决策准则",
        "了解生财思维的适用范围与局限"], "concept_map": ["生财思维vs创业思维：解题vs探路"], "life_analogy": ["跟随已探明的地图vs闯入未标记的荒野"],
        "summary": [{"concept": "生财思维", "desc": "在已有成功案例领域破解成功模式的思维"}], "exercises":
