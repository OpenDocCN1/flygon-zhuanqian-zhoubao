    ,\n  \"concepts\": [\n    {\n      \"name\": \"八类可盈利 Up 主分类\",\n      \"desc\"\
    : \"该概念将可持续盈利的创作者划分为八类：头部成本控制、垂直近商业、方便卖货、适合增值内容、适合长期直播、高频更新、多平台分发、可线下变现。\",\n\
