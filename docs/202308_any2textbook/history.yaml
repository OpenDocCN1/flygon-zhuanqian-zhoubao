    \ \"no\": 4,\n      \"title\": \"辨析'有解'的两个陷阱\",\n      \"contents\": [\n     \
    \   \"确定有解优先原则有两个常见误区，请各举一个生活中的例子并辨析：\",\n        \"陷阱一：'有解' = '我必能成功'\",\n  \
    \      \"- 辨析：路径被验证可行，但不等于个体执行必然成功，还需要什么条件？\",\n        \"陷阱二：'曾经有解' = '现在有解'\"\
    ,\n        \"- 辨析：很多领域'成功案例'存在，但可能已因政策、技术、市场变化而失效，如何判断一个'解'是否仍然有效？\",\n      \
    \  \"最终思考：结合生财思维的边界条件，你认为'确定有解优先原则'最大的风险是什么？如何对冲这个风险？\"\n      ]\n    }\n  ],\n\
    \  \"units\": [\n    {\n      \"no\": 1,\n      \"name\": \"生财思维 vs 创业思维 —— 解题与探路的分岔口\"\
    ,\n      \"points\": [\n        \"**为什么需要这个概念？**\",\n        \"- 面对财富目标时，不同的人会本能地走向不同的路径\"\
    ,\n        \"- 有人看到的是“别人已经做成了什么”，有人看到的是“我要开辟什么”\",\n        \"- 这两种出发点导致完全不同的时间投入、风险承受和成功概率，因此必须首先区分\"\
    ,\n        \"**核心定义**\",\n        \"- 生财思维：在已有大量成功案例、闭环已被验证的领域中，通过破解成功模式来赚钱的思维\"\
    ,\n        \"- 创业思维：在结果高度不确定、甚至不知道问题是否有解的情境下，探索全新方向的思维\",\n        \"- 一句话区分：前者是“破解已有答案”，后者是“寻找未知答案”\"\
    ,\n        \"**关键性质**\",\n        \"- 生财思维从“已有成功”出发，以破解模式为路径；创业思维从“空白地带”出发，以探索试错为路径\"\
    ,\n        \"- 生财思维具备确定性优势：路径已被验证，风险可控；创业思维具备突破性优势：一旦成功，回报巨大\",\n        \"- 两者并非对立，而是同一人可在不同阶段切换的两种认知模式\"\
    ,\n        \"**典型例子**\",\n        \"- 一个普通人发现身边有人靠摆小吃摊月入过万，于是研究其选址、品类、定价策略并复制——这是生财思维\"\
    ,\n        \"- 一个工程师辞掉工作，试图发明一种全新的交通方式，无人知道是否可行——这是创业思维\",\n        \"**边界条件**\"\
    ,\n        \"- 如果某个领域表面上有人赚钱，但实际靠的是垄断资源或不可复制的运气，则不属于“可破解的生财”范围\",\n        \"\
    - 如果创业思维面对的问题已被验证有解，则其“探索”成分已失去意义，应转为生财思维\",\n        \"- 生财思维不适用于尚未出现任何成功案例的全新领域\"\
    \n      ],\n      \"sources\": [\n        {\n          \"paper\": \"20230829_03_生财思维\"\
    ,\n          \"role\": \"origin\"\n        }\n      ],\n      \"excerpts\": [\n\
    \        \"在已有跑通闭环领域破解成功模式的思维\",\n        \"在结果不确定情境下探索方向的思维\"\n      ]\n    },\n\
    \    {\n      \"no\": 2,\n      \"name\": \"确定有解优先原则 —— 做题先选会做的\",\n      \"points\"\
