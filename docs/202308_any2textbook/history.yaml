        实战——从提示词到内容生产线\n\n## 学习目标\n\n- 理解提示词工程在 AI 使用中的核心作用\n- 掌握提示词编写的 7 个技巧\n- 学会场景化应用
        ChatGPT 的方法\n- 理解 AI 的能力概览与边界\n\n## 11.1 生活类比\n\n提示词就像导演给演员的指令：如果导演只说\"演得好一点\"，演员只能靠猜；但如果导演说\"在这场戏里你是一个刚失去亲人的中年人，你要在窗前沉默三十秒，然后缓慢转过身，用颤抖的声音说出台词\"，演员就能精准演好。ChatGPT
