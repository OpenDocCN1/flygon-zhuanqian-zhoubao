        对自己提供的价值非常坚定\n成甲老师说过：我们如何成功？短期靠策略，中期靠战略，长期靠做个好人。\n我的理解是，如果你觉得自己做的事情对别人非常有价值，心怀真诚利他之心，那么就说明路大概对了，坚持走下去就行。\n3.
