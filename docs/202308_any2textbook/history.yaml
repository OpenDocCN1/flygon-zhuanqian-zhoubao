  content: '"# 1 年 500 万+利润，知识付费创业心法（51-75）\n\n> 原文：[`www.yuque.com/for_lazy/thfiu8/dqq4iaepo1zx9kw6`](https://www.yuque.com/for_lazy/thfiu8/dqq4iaepo1zx9kw6)\n\n\n\n##
    (精华帖)(223 赞)1 年 500 万+利润，知识付费创业心法（51-75） \n\n作者： 芷蓝 \n\n日期：2023-08-02 \n\n之前写了
    1-50 的系列，我看 800 多个赞了，最近这 2 个月又尝试了一些新的玩法，有了一些新的感悟和心得，和大家聊聊，希望能够帮助到大家。 \n\nhttps://t.zsxq.com/10OPAktiW（1-50
    系列） \n\n51、想在私域赚到 1000 万以上，就要明白“先筛选，后服务”这个逻辑，用自己的生态位去制作一个用户筛选器。 \n\n分享给大家我这几年做私域沉淀下来的
    40 个字的营销方法：选对方向，进对圈子，错位竞争，IP 放大，轻松成交，案例收集，复盘增势，提升单价，反复循环。 \n\n52、在你的营销流程不具备标准化、可复制性之前，不要过早去尝试组建团队。我特别理解想组建团队的人，因为我也非常渴望，外人看着有面子，自己当老板指挥下面的人干活，也不累。
    \n\n但是，尤其是做只是付费创业的超级个体，大部分都不具备服务流程化的条件，因为咱们的核心是靠 IP，靠 IP 卖的高客单价产品，那么用户奔着你的 IP
    来的，想要的就是非标准化服务，低客单价的会员，你可以用团队服务，但是高客单价的咨询，必须要自己上。 \n\n做 IP 你就得明白：鱼与熊掌不可兼得。 \n\n你组建团队，发工资租办公室是次要的，更多的成本，是管理和培训成本，这个会让你极其内耗。
    \n\n我的方法是，发展合伙人或者与自己的学员去合作。这 2 个身份，你们的沟通成本更小，彼此熟悉业务体系，合作起来更顺畅，而且随时可取消合作，随时可建立合作，更加灵活。
    \n\n53、朋友圈真的要学会给自己造势，你要把自己当前在做的事情，未来准备做的事情，和这辈子想一致做下去的事情都写出来。 \n\n在我看来，势能这个东西是虚的，但却可以人感知到，怎么才能感知到呢？那就是迎接一个个挑战，然后搞定一个个困难，就好像高考一样，考之前你多努力别人都感觉不到，最后你考了
    600 多分，人家一下就明白你多努力了，你就有势能了，你的高考复习笔记都能卖出去。 \n\n做知识付费也一样，你得告诉大家今年你要做几件大事，然后把做成功的都展示出来，难度可以设置低一点，但是连续的小成功也是一种势能。
    \n\n势能起来了，你的产品就有人买了。 \n\n54、写引流文章，如果你想让用户看完加你微信，然后购买你的产品，至少要写出以下 3 个要素。 \n\n第一个是成绩，赚到钱就写钱，赚不到钱就写做过什么普通人没做过的事，如果这
    2 个都没有，就没必要引流，你也引流不来。 \n\n第二是经历，你的成就不可能是凭空出现，肯定是从一个想法到实践，到困难，到痛苦想放弃，最后咬牙坚持最后成功。
    \n\n基本就是好莱坞英雄之旅的套路，但不一定把所有细节都写出来，简单来说就是写故事，写自己的故事，写自己做一件事很难但是最后成功了的故事。 \n\n第三是可复制的经验，这个很重要，也是很多人忽略的，写了自己很牛，也写了自己的人生经历，很煽情，很上情绪，但是就没了。
    \n\n虽然情绪价值也是价值，但是你的目的是引流啊，引流就得设计钩子，钩子和卖点是 2 回事，你最后得给用户一个实操步骤，可复制的流程，然后用一个文档吸引他过来加你微信啊。
    \n\n55、赚自己能赚的钱，和干自己喜欢干的事情，真的不是一回事。 \n\n听着有点拗口，我来解释一下。我非常赞同第一个，赚自己能赚的钱，意味着你知道自己的能力半径和成交边界在哪里，找到适合自己成交，适合自己服务，喜欢自己的人，是一种本事。
    \n\n相同的产品，服务不同的人，结果一定是不一样的，有人拍手叫好，有人背地骂你还举报你。 \n\n之前我就说过，我们做知识付费，做个人 IP，不是为了改变谁，而是找到谁，找到那个能被你能量和认知影响的人。
    \n\n但是，一心干自己喜欢干的事情，很多时候真不赚钱，不赚钱的原因在于你没有迎合市场的胃口。 \n\n我有个定位 3+1 法则，那个【1】就是迎合市场，没有这个
    1，前面的 3 都没有意义。 \n\n【3】代表的是一个递进关系，首先考虑跑通的闭环，其次考虑可被包装成产品的技能，最后才是自己喜欢的。 \n\n万不得已，才做喜欢的事情，而且还得是被市场认可。
    \n\n你看我，其实并不喜欢发朋友圈，但是发朋友圈真的能给我赚很多钱，所以我就得干。 \n\n说个秘密，我更喜欢在日记本上写流水账，就是记录每天毫无意识的小事情，包括吃了啥饭，跟谁吵架了，揍我儿子了，但是这个别人不喜欢看，不会给你钱啊。
    \n\n所以我还是得去朋友圈写营销玩法，写我的情绪，晒成绩晒认知，没办法，喜欢干的不一定能赚钱。 \n\n56、普通人很难找到创业蓝海，承认这点吧，就算被你看到或者识别到，你能做的就是卖信息差，而不是进去深耕，因为蓝海意味着没得可模仿，不能模仿意味着试错成本非常高，可能需要团队➕资金的支持。
    \n\n所以，在红海里找一个细分赛道，然后去模仿同行才是知识付费创业者赚钱最稳妥的方式。 \n\n真正的突破点在于，当你模仿成功赚到第一块钱的时候，你要怎么去优化和复制自己的流程。
    \n\n而我的经验就是 3 个步骤： \n\n（1）提炼萃取自己的成功经验变成知识付费产品，然后进行销售 \n\n（2）把自己的学员变成渠道，帮助你裂变或者成为你的代理（类似于卖货渠道，比如闲鱼学员可以帮你分销供应链）
    \n\n（3）做圈子，吸纳同行进来，做流量联盟或者一起赚中下游的钱 \n\n57、做私域好？还是做公域好？还是公域私域一起做好？ \n\n这个问题其实很好回答，业务还嫌大吗？当然是公域➕私域最好了，主要是你的成本问题。从我的观察来看，私域和公域完全是
    2 套逻辑。 \n\n私域玩的是个性➕价值，不迎合，找到喜欢你的人，为你高频次➕大剂量付费；公域就不一样了，要会看数据，懂的平台需要什么是首位，然后是用户喜欢啥，一上来就扔干货，或者扔自己以为的干货，一定做不起来。
    \n\n博眼球，有话题性，追对热点，蹭对流量，你还得有展现能力，才能够通过直播和短视频变现。 \n\n我觉得，有团队➕有展现力的人适合去做公域，卖自己的一份时间，然后通过内容平台放大，卖自己的产品。
    \n\n独立合体且不善于表达的人，其实更适合一开始就做私域，花点钱多混几个圈子，在圈子内输出价值，通过自己的产品实现小圈子内的传播，赚到第一桶金的概率要比做公域要大。
    \n\n但重点是，你得舍得投资➕混对圈子➕搞定自己的产品，这是关键。 \n\n58、做自媒体知识付费，是轻资产创业，但不是 0 资产创业。为什么有的人做不出内容？你可以想一下，如果你辞职之后选择每天在家宅着，什么事情都不做，你当然写不出东西来。
    \n\n你看看古代诗人写的诗，疑是银河落九天，那也都是李白去旅游的过程中写的。 \n\n做自媒体没有内容怎么办？那就花钱去创造内容，花钱去旅游，花钱去学习一个技能，花钱去和别人交朋友，参加各种圈子的活动。
    \n\n你有了这些事件，自然就会给自己反馈，然后就可以分享到自己的社交平台上了。 \n\n所以说内容是创造出来的，这个创造的过程，也是需要资金支持的。 \n\n不要真觉得一分钱不花就可以做自媒体，普通人做不普通的事，这个不普通的事儿，就是投资。
    \n\n59、当你在自己的定位下找到了要模仿的人时，你不能光去模仿他的内容，输出体系，还有引流路径，你还要去模仿他的个人行为轨迹。 \n\n什么叫做个人行为轨迹？就是说他从自己开始创业或者说开始做自媒体后，哪个时间节点都做了什么事情，这个你必须去看。
    \n\n我举个例子，你比如说，你可以去看某个人的朋友圈，去翻他之前的所有发圈记录，或者说去看他知识星球的用户轨迹。 \n\n他是从什么时候开始在朋友圈卖产品的？在卖之前他都做了什么事情？他是不是参加了什么圈子的活动，然后做了演讲才积累到第
    1 批用户的？他是不是做了一次分享之后，才引流了圈子内的用户的？ \n\n这个就是行为轨迹，代表了他整个创业过程中的必要动作。 \n\n看行为轨迹，这个事情很巧妙，聪明的人永远知道在关键时刻要做什么事情。
    \n\n不聪明的人只会一味的使劲，就是使不对地方。 \n\n60、如果你真的什么资源也没有，或者说不擅长任何技能，还想通过做自媒体赚钱的话，那我非常建议你就做某一个行业的商业案例整理，这个是我看到的，新手从
    0~1 最好的路径。 \n\n垂直行业商业案例的整理是很多做自媒体人都需要的内容，但却是一个，比较花时间的事，所以本质上你就是在出售自己的时间来换取价值。
    \n\n如果能在这个过程中，把一些你想去抱大腿的圈主的商业案例放进去，然后帮助他们主动去推广宣传，你将会得到自己的第 1 个势能。 \n\n借势而起永远是最好的方法。
    \n\n61、学会把手里的现金变成流动性的资产，再把这种资产，变成几倍的现金。 \n\n对于知识付费行业，什么是流动性的资产？我的答案是一个可投资的个人势能。
    \n\n我现在就喜欢去观察那种正在成长中的自媒体博主，一旦发现他们的个人失能，以及个人技能处于一种爆发，或者说，即将爆发的状态，马上给他帮助，给他赋能。 \n\n一旦对方爆发，将会给我反馈源源不断的精准流量。
    \n\n62、我们要把基础的技能包装进高端的服务行业里，比如说你擅长 ai 绘画，但是如果小红书上你就一直在展示你的绘画方法，分享指令词等绘画技巧，那么虽然你能够吸引到用户，但大多数人都是过来给你转笔小钱，让你帮他绘画的。
    \n\n但是如果你能够用 ai 绘画技能去做装修设计图，去做朋友圈营销素材，去做特定行业的品牌 logo 素材图，那你就可以跟相关行业的人一起合作去交付大客户，这样你的技能也就更值钱了。
    \n\n63、被别人白嫖不可怕，只要不浪费到你的时间和精力就行。你的内容注定只被 10%的认可和购买，90%的人都是来白嫖的，但是白嫖你内容的人也可以帮助你传播，所以无需过于防范，表面上过的去就行，如果处心积虑的去对付这些人，你就会错过去服务有价值的用户的机会。
    \n\n64、说一个我做朋友圈营销的心得，你一定要建立动态的好友价值逻辑，一个微信可以容纳 1 万个用户，如果你能把它变成 1 万个付费用户，然后再让它循环变成
    1 万个动态付费用户，我觉得赚到 5,000 万以上是没有问题的。 \n\n什么叫做动态付费用户？这个动态分为两层含义，第 1 层是你的产品要动态，第 2
    层是你的好友位要动态。 \n\n产品要动态说的是你要不断的去创造新产品，然后来淘汰那些购买过你之前付费产品，却从来不跟你发生互动的人。 \n\n什么叫做好友动态？就是跟你发生互动的人，你就持续跟他建立关联，和利益关系，不和你发生互动的人就要先删除掉，然后他想过来跟你再次有利益关系建立情绪链接的时候，你再加他回来。
    \n\n这样你的好友位永远是动态的，你的收入也是永远动态提升的，然后你会发现那些能够保持几年甚至 10 年以上跟你发生情绪和利益关系链接的人是可以终身维护的。
    \n\n65、产品体系，这个体系是一步步做出来的，我非常不建议超级个体在没有团队的时候，一上来就做好几个产品，这会极大影响你的精力，增加交付成本，并且不利于在短期内积累自己的势能。
    \n\n1 个产品，就卖 1 个产品，想尽一切办法把这个产品卖爆，然后你这个产品的销量数据就是变成了你的价值背书，你的势能就增长了，链接你的人更多了，你再去开发第二个和第三个产品，形成一个体系。
    \n\n做知识付费得有滚雪球的逻辑，你得借助重力把雪球放大，而不是在坡顶就费劲造个大雪球。 \n\n66、关于做咨询服务，我自己在后期一般都会通过合伙人的业务来联合完成服务流程，其本质就是你用更低的价格去采购别人的优质服务，然后来完成对自己用户的交付。
    \n\n当然，别人愿意跟你合作是有原因的，比如说对方的势能暂时不强，且需要客户的成功案例作为自己的背书，这就为你们的合作奠定了基础。 \n\n记住，每个人都有从
    0-1 这个阶段，但这不代表这个人的能力差，如果你能找到他们，就可以用更低的价格去购买他们的服务。 \n\n67、做付费社群这么长时间，用户越来越多，我就明白一个道理：你要肯定用户提出的需求，因为这些都是用户在体验之后真实存在的。
    \n\n但这不代表你要满足每个用户提出的需求。永远记住你服务的是大多数，一个产品如果满足所有人的需求，它肯定卖不出去，甚至它不会存在的。 \n\n只有满足一部分用户的需求，你才能通过这款产品赚到钱，你才能不断的去优化这个产品的体验。
    \n\n68、为什么有的人模仿会失败，因为你不知道对方的基因是什么。举例子，你看到一个视频号或者抖音号发布的都是质量比较粗糙的内容，还不如自己做的，但是人家的视频数量很多，粉丝数也很多。
    \n\n这时有些人就产生了错觉，以为只要像他一样粗糙且大量的生产内容也会成功，但也许你不知道别人的基因其实是矩阵投流，又或许是软件批量混剪。 \n\n你只模仿了表象，却不知道对方的核心成功要素是什么，最后不成功，反而搞得很焦虑。
    \n\n新手靠模仿起步，这是没错的，但模仿一定搞清楚对方的成功基因，这个基因模仿起来的成本，决定着你要不要去执行这个动作。 \n\n69、关于训练营这种产品，如果你想做好，就需要还原我们上学时代的的学习场景。
    \n\n（1）老师讲课：社群或者直播平台就好像教室的黑板，老师讲学生听，这是单向的输出。 \n\n（2）举手回答：老师当场讲完，用户提出问题，老师答疑，做到巩固➕理解学到的知识。
    \n\n（3）提交作业：光有学和问还不行，需要让学生打卡，把当天学习到的内容应用到实践上去，也可以理解为社会大课堂。 \n\n（4）阶段总结：一个学期过去了，我们要沉淀总结我们学到了什么，以及应用的怎么样，如何改进。
    \n\n以上 4 个场景做到了，这个训练营的交付基本不会有问题，当然这其中需要很多老师和课代表的协作，这也是为什么我说超级个体最好不要做训练营，想做好太累了，毕竟是带着一帮人去学习和实践。
    \n\n这个钱不好赚，不如卖课程，你可以把时间花在寻找愿意买你课程的人身上。 \n\n70、我觉得之所以自己能够在知识付费这个行业赚到第 1 桶金，得益于一个逻辑，就是不做“平庸的精致”而是“粗旷的创新”。
    \n\n当初做社群最早的卖点就是“拆课”，这是我某天晚上想出来的方法，也算是我的第一个产品转折点，抓住了用户的核心需求。 \n\n用了拆课的模式把付费社群干到
    2000 人以后，我发现增长陷入困境，正好那个时候我关注到“一周进步”这个公众号，于是我搞了一个“一周行动”用 7 天的时间来带着社群里的小伙伴去实践，社群用户又开始增长，到了
    3500 人后，我觉得 7 天时间的正反馈不够，于是升级到 21 天的玩赚行动营。 \n\n紧接着，我又开始用一个朋友圈训练营➕付费社群的权益，放大出了玩赚合伙人这个产品，又进入了一个增长区间。
    \n\n现在回顾自己的路径，我发现当你想到一个新的玩法时，千万不要被精致的细节所拖累，你看我当初做的那些海报，真的很难看，但事实证明用户更看重的是权益和玩法，最后才会看你的细节。
    \n\n你说海报精致有没有用？当然有用，细节决定成败，但是注重细节这是商业创新后的第二个阶段要做的事情。 \n\n第一个阶段一定是速度，一定是那个粗旷的玩法，你慢了一步，用户看到别人在玩了，你的产品就没有吸引力了。
    \n\n现在我看到很多人在模仿玩赚做合伙人模式，权益和玩法没问题，唯一的问题就是：慢了。 \n\n慢了，核心强技能人脉资源就被抢走了，慢了，你的广告就可能在帮别人打（瓜子二手车的广告后，其他二手车基本都是在给瓜子打，提到二手车，你第一个反应就是瓜子，这个就是心智占领），慢了你的商业逻辑就仿佛在抄袭，虽然抄袭没错。
    \n\n所以，创新的时候放弃细节，拿到种子用户了，你再弥补细节，一点都不晚，我刚开始做合伙人的产品时，甚至不知道用户付款后应该做什么，可以说现在的交付流程和逻辑，是第一批合伙人给我的，所以我要感谢第一批支持我的合伙人小伙伴。
    \n\n谢谢。 \n\n71、如果你读了一篇文章，这篇文章对你有益，或者说引发了你的深度思考，那么无论这篇文章的作者是否有设置收费，我都建议你向他发红包，并不是尊重知识，尊重别人的时间价值这么简单。
    \n\n当你主动选择为有价值的内容付费时，你就可以从这个内容中获取更多的价值，并且牢牢的记住他。 \n\n当然，这个动作如果能够养成习惯，后面也会为你带来更有价值的人脉资源。
    \n\n72、和超级个体之间的合作，可以分为 3 个维度。 \n\n第 1 个是产品上，我更建议打造产品库的模式，比如说你自己有 3 套课程，对方有 3 套课程，你们加起来就是
    6 套，各自搞一个付费会员，把产品当作权益融合进去，给到用户更多的价值感。 \n\n第 2 个是搞事情，很多人觉得身边某些人突然就变得牛了，为什么呢？其实就是通过
    1-2 个大事件，提升了自己的势能，让更多人知道他了，大家都说认识他，他就编织了一个人脉网，网越大势能就越强，你的产品就会被更多人知道，产品价格也会随着你的势能增强，卖的更贵。
    \n\n超级个体合作搞事情有 3 个法宝，隔空喊话➕快闪社群➕嘉宾互邀，当然这个合作要建立在你们阶段相同的情况下，即时所谓的门当户对，否则谁也不愿意把自己的势能平分给对方。
    \n\n第 3 个就是流量上，注意我这里说流量并不是简单的互推流量，互推是没有增量的，真正的增量在于你们 2 个服务流量的不同生命阶段，用户的需求是有阶段的，但是超级个体的团队力量较弱，这时就可以通过合伙人的合作来一期挖掘。
    \n\n我称这个行为叫做：价值回流。 \n\n你帮助用户搞定了起号，你的合伙人帮他搞定了产品，用户成长过程中会带回来新的价值，还能继续购买你的服务。 \n\n73、懂得人都明白，知识付费玩到后期，最好的商业变现模式应该是微商的那一套，只不过把曾经的减肥美妆产品变成了一个知识库或者说一个付费会员而已。
    \n\n如果你能想明白这一层，就知道如何做一款赋能➕使用➕赚钱的知识付费产品了，这 3 个要素也是产品的最终形态。 \n\n我现在依然在探索微商的商业模式，这里面其实有很多值得我们学习的东西，比如说团队内「自产自销」以及线下链接人脉和打通产品供应链合作商。
    \n\n74、我最近更新了自己的合伙人咨询交付流程，之前模式为用户提供个人 IP 商业定位、数据支持、流量支持和产品支持。 \n\n现在我把第 2 个「数据支持」优化了一下，因为我发现做商业咨询这件事，用户要的其实并不是数据，数据可以通过购买付费工具来获取，而用户真正想要的，是对于这个数据的一个分析逻辑和分析结果。
    \n\n就是你不能光给用户对标数据，或者说爆款话题表格，你要告诉用户，通过你的观察，你适合模仿谁，为什么适合模仿他，以及模仿他的第一步是什么。 \n\n咨询交付，用户最满意的永远是行动步骤，“接下来你要
    1234 这几步曲走，走到哪一步有什么结果发给我，我来给你分析和矫正。” \n\n当然数据也值钱，但是我们不经不是大公司，样本数量少，其实可参考度也不高，最值钱的还是你的个人经历➕判断。
    \n\n75、找到自己的节奏和适合自己的营销方式很重要，这比具体的营销细节还重要，比如我就不擅长直播，也不擅长短视频，不是没尝试过，尝试了，就是不适合，那就没办法，回归到文字输出➕关键人物的合作这个方向上来。
    \n\n无论是做内容引流，还是做产品交付，初期都是不断的试错，一直找到某种方法能够让自己持续去做，而且没那么痛苦就对了。 \n\n说实话，我一点都不累，因为当前的这种方法特别适合我，线上不做裂变不刷屏，线下不做大会不准备，持续写内容给关键人物赋能做辅助，然后链接来自各个方向的流量和产品做中台，挺好。
    \n\n评论区： \n\n叁斤 : 先赞后看 坏脾气的小可爱 : 学到了很多，谢谢芷蓝姐。 胖大魔 : 这是准备再次迭代了[奸笑] 荣生 : 抢占先机，很好[强]
    芷蓝 : 感谢认可 大鱼 : 芷蓝出品，必属精品[强][强][强] 亦仁 : 感谢分享，已加精华。 书情小跟班 : 学习了，含金量很大，受教 \n\n![](img/894d30a529e7c37bcd3392323c99941c.png)  "'
- role: tool
  tool_call_id: call_b8cfda871a204decb9669d06
  content: '"# 做项目坚持还是放弃？\n\n> 原文：[`www.yuque.com/for_lazy/thfiu8/ep54nl7mz6euypt3`](https://www.yuque.com/for_lazy/thfiu8/ep54nl7mz6euypt3)\n\n\n\n##
    (精华帖)(326 赞)做项目坚持还是放弃？ \n\n日期：2023-08-08 \n\n提问： \n\n亦仁老板好，被一个问题困扰了很久，是关于做项目坚持还是放弃的。
    \n\n生财里面有很多可以跟着做的项目，假设我在做小红书电商带货，一个月过去了也没有变现，哪怕是优质数据的作品也没有出现。那么是该继续坚持，还是放弃换其他项目。
    \n\n还是说做项目之前需要设定目标和规定时间，如果没达到就直接放弃吗？ \n\n回答 \n\n你有没有在那个项目里看见那些“不过如此”的人也赚到钱了？ \n\n如果有，那就不要轻易换项目，项目闭环没问题，说明还不足的是自己解决问题的经验和能力。
    \n\n虽说要鼓励大家要发挥优势、发挥天赋，但跑通从 0 到 1 赚到第一桶金这个事情，拼执行力就够，不需要天赋。 \n\n但是感觉自己确实在某个问题上被卡住了怎么办？
    \n\n红包大法好。 \n\n在生财，找人发 200 块钱的红包提问，就能解决大部分问题。 \n\n当然，过程中很多红包发出去也未必能解决问题，但发的多了，一些核心卡点就会找到关键解法，跨过去，就是一片新的天地。
    \n\n评论区： \n\n书豪 : 💪💪💪先赚到第一块钱 逐鹿 : 再差的项目也有赚钱的，只不过自己的能力不够，赚不到那么多 白日梦 : 这个回答好干 暖安
    : 做笔记：不要轻易换赛道，从 0~1 持续执行，不用靠天赋，能挣到钱基本没问题。遇到卡点发红包，问问题，能解决大多数问题。 胖大魔 : 同城聚会大法也可以[奸笑]
    周彦充 : 变现没那么简单，找对标，抄，抄，抄，红包确实好使，哈哈 喵图灵 : 这是普通人发自内心的提问，我感同身受，早期我也有过这个迷茫，但是我喜欢死磕，有些项目磕过去了，有些在半路实在爬不起来了，其实做事本身，尤其是互联网做事，能不能成不在事情本身，而在执行的人，一件事是否拿到反馈的核心是，你对完成这件事所需要掌握的能力或者技能是否足够精通，足够精通绝对不可能拿不到结果，其实身处其中的人，如果能静下心好好想一个问题，“我需要学习什么技能来完成这件事”，然后拆分开来一个一个找资源，破局就是时间问题，项目的选择只是决定了时间成本的高低，和最终收益的大小而已，核心还是人。
    谦墨 : 找好的导师可以少走无数弯路，花钱就是省钱。 撸起袖子加油干[奋斗][奋斗] \n\n![](img/894d30a529e7c37bcd3392323c99941c.png)  "'
- role: tool
  tool_call_id: call_75b70e089fec47ee8d1a5428
  content: '"# 我是如何用chatgpt做了一套课，单月卖课1300+单（变现52w）\n\n> 来源：[https://b16xnqwk20.feishu.cn/docx/BqBudZKt2o2JIJx1s6YcBOhknge](https://b16xnqwk20.feishu.cn/docx/BqBudZKt2o2JIJx1s6YcBOhknge)\n\n全文6600字\n\n推荐用时：6min\n\n首先很感谢大家支持，有机会能在生财分享，然后之前在大航海里面分享过三次。7月底还在星球给各位圈友，分享了关于30天私域卖课60W是什么体验\n\n时隔半个月，又输出一篇《我用chatgpt做了一套课，单月卖了1300单的黄金复盘》\n\n下面是抖音的销量（800+）单，还有一部分（500+）是小鹅通私域成交的\n\n![](img/360d455c1d1f957b8320147a2918e2f7.png)\n\n我是宋老师（账号叫宋老师帮你做课），
    全网粉丝10w+，多个矩阵号。很多抖音、小红书做知识付费的小伙伴可能知道我，我花了近1年的时间，从0-1成长为做课卖课赛道的头部博主。\n\n简短的自我介绍一下，便于大家快速知道我的价值\n\n我的四个标签：\n\n1.目前自媒体头部的做课&卖课博主→流量能力\n\n2.原来的新东方总监，最高记录同步管理80w学生社群→教学能力\n\n3.6000多位知识博主的老师→成绩\n\n4.很多百万博主背后做课的男人\n\n未来写书的人会越来越少，做课的人会越来越多，同样是社交名片，动态的会比静态的前景更大。\n\n如果你是小白知识博主，要用
    AI 快速完成 0- 1\n\n如果你是中部知识博主，要用 AI 快速提效，干掉同行\n\n如果你是头部知识博主，要用 AI 翻新产品，迭代优化\n\n今天我分享的主题主要有以下这么几个版块：\n\n1.【道】为什么年入百万的人一定要做课？\n\n2.【法】如何7天用Chatgpt做一门爆款课\n\n3.【术】我是如何通过AI与做课结合，破局进蓝海\n\n4.【器】提高做课效率的6个超级工具\n\n作者：宋老师私域操盘手\n\n忠仁老师：zzr-994\n\n#
    一、为什么年入百万的人要做课？哪些是不起眼但很赚钱的赛道？\n\n## 1.为什么年入百万的人要做课？\n\n知识博主无非两种人，要么是教人赚钱，面向B端；要么是教人技能，面向C端。\n\n其实这已经把所有的人包含了\n\n总的来说，知识博主面对的，就是有学习需求的人，只要你有痛点，有人能帮你解决，这个就是市场\n\n那为什么普通人要做知识付费？\n\n我认为原因有3\n\n###
    第一个：成本低，利润高\n\n透露一个数据，目前知识付费卖课的平均净利润在71%。。。。。注意是净利润，而且如果你没团队，这个值会更恐怖\n\n目前没有看到过哪个项目，比知识付费的利润大，做的好，一场咨询大几千，做的差一门课程也是99\n\n【边际成本思维】你花10天搞出一套课，可以持续得卖，我之前得一门做课的课，一年卖了3000+单\n\n【升单思维】一套课作为引流课，30%升单你的高价课，效益翻番\n\n【分销思维】
    知识付费界的安利模式，张琦的课、周文强的课，几百位老师做分销\n\n### 第二个：人群广\n\n假如说你只做教人做抖音，月活8亿，3亿是短视频输出者，也就是3亿的人想在抖音赚钱，他们就是你的目标人群\n\n视频号月活6亿\n\n小红书3亿\n\n抖音8亿\n\n加起来17亿！！！任何一个小的市场放在这自媒体人群都会无限大\n\n###
    第三个：风险小\n\n做任何的事情，你7天不干都会惩罚你，但知识付费不会，即使你7天不拍短视频，也会有流量，可以卖课\n\n你花一个月的时间教人做项目，没有做出来。要么就是你的方法有问题，要么就是ip的问题。最多可能面临着一条差评或者退费，对你的损失已经是最小了\n\n现在除了做知识博主，知识付费外。没有哪个赛道能有这么大的优势了，\n\n据统计，截至2023年6月，学浪已经有56000门在售的课程，这只是知识付费课程的一个平台。可想而知，线上课已经是大势所趋。\n\n既然知识付费的变现能力极强，那么想做知识博主的人，就需要有产品，有自己的课程，才能有变现。\n\n其实大部分的普通人想赚到第一桶金，并不是很费力。一套课程一劳永逸\n\n算一个账，如果你想赚100w\n\n499（引流课）*500单=249500\n\n5000（利润课）*110单=550000\n\n20000（高客单）*10单=200000\n\n总计249500+550000+200000=999500\n\n只要你有引流的课程，后续可以持续升单，就有无限可能\n\n具体的私域升单打法，可以参考这篇📕30天私域卖课60W是什么体验\n\n感兴趣的老师可以看下\n\n##
    2.哪些是不起眼但很赚钱的赛道？\n\n我在卖课行业深耕多年，发现有几个行业看起来不起眼，但是他的品类的销量和利润特别高，\n\n目前对知识付费而言“低粉高变现的类目”有这么几个，特别说明，这里并没有大家所常见到的“抖音运营”“电商运营”“英语”这种版块，理论上来讲，这些版块并不是在抖音很赚钱\n\n我罗列了目前“单讲师最赚钱的几个小品类”供参考，看看哪些你能做？\n\n###
    第一个：乐器类\n\n乐器类的我有很多学员颠覆了我的三观，尤其是越普通的乐器往往能变现不少，而且人群大，\n\n![](img/198cb57727a78a5637045698a0c8f8af.png)\n\n比如吉他、钢琴，这些品类卖的特别好而且人很少\n\n我知道变现比较好的团队都不大，升单全都是在线上不做线下，知识付费类如果是做直播间，说实话的确是超级个体的逻辑，对人效会很高，主要依托老师本人的内容能力以及行业在抖音平台的红利杠杆。\n\n比如说这个南宁的赵老师，她没有团队，就她和她老公两个人，干了一年总计变现了3200w，她跟我聊说，她去年不知道为什么，突然一下就卖了好几百万，就很奇怪，你说生气不生气，这就是小众品类的风口红利，所以别再盯着透透糖和李一舟了，有些老师的卖课能力其实比他们强很多\n\n赛道的选择，永远大于努力\n\n![](img/34997d319b4feba017fb29da3d006c7f.png)\n\n###
    第二个：口才类\n\n很多人觉得口才是个很常识的赛道了，但是我觉得这个赛道有很大的潜力，我们有个深度合作的IP案例叫云边口才，他俩找我的时候也是疫情期间，两口子隔离在家没事干，妻子是当地县城电台的主持人，当时偶尔直播做了2w多粉丝，问我怎么变现，\n\n最早他俩想做少儿口才课，被我劝阻了，原因很简单，\n\n1.  家长一般都带着孩子去线下上口才课\n\n1.  少儿口才我们分析了一下数据，并不太好\n\n1.  他妻子的演讲很有感染力\n\n所以，我更加建议他们去做了“成人口才”结果他们15天变现了16w，这个赛道红利很大，之后我们又跑出了小红书IP小哈聊沟通，也是在小红书讲口才课，变现也很好\n\n![](img/5eeefbf1859a77542aed9c3556d7e1ff.png)\n\n![](img/1494f4162229609a4c54912220b67a82.png)\n\n所以，定位人群很重要\n\n###
    第三个：造价&建工电气\n\n这种是有一定技术壁垒的，比如财税，造价，电建，土木这些，跟工程和企业经营相关的，容易收大单，比如这个中天电建的老师是我的学员，1w多粉丝卖课卖了100多万\n\n还有这个造价之家也是学员，卖了61w的课\n\n![](img/fff870711dcd870d8eccd32eb724daa0.png)\n\n小众高收入，也是知识付费的一条变现核心之路\n\n还有很多看起来不起眼但实际很赚钱的课程品类\n\n比如说：\n\n这个教戒烟的林老师，20多万粉卖了102万\n\n![](img/fea92b4bade28d62fd028adb81095513.png)\n\n这个喜悦之路老师教产后妈妈长高的课，24w粉也变现了100万\n\n![](img/3a6c10a691109a77d44efb8684ccca2f.png)\n\n教谈恋爱的课，27w粉，变现了244万\n\n![](img/10d3809dc1e1038076a0ae741276ee28.png)\n\n我列了个不起眼但是很赚钱的课程选题表，大家可以看下，如果有做家庭教育的老师我们还深度研究过这个品类里面有哪些不起眼很赚钱的定位，也可以有时间再具体讨论\n\n![](img/6d2a45a711d224d4a8d656d35b7b3d21.png)\n\n#
    二 、如何AI与做课相结合\n\n我总结的闪电做课法\n\n原理很简单，六步轻松解决\n\n定位→标题→大纲→磨课→录课→上架\n\n有很多老师做不出课的原因在于备课慢，或者不会写大纲，或者不会做
    PPT 等等问题都被这套方法解决了。这个方法就是AI+知识付费，其实就是 ChatGPT 自动帮你出课。无论是你肚子里没货，还是说你不会写大纲，或者说你压根不会写课稿，或者不会做PPT，不会做详情图，这一套方法都能帮你在
    7 天的时间快速把做课的一些基础配置弄好。\n\n## 第一步：定位\n\n因为有时候你开始的选择错了，后面的变现就会很艰难，定位选的好，变现也比较快。\n\n实不相瞒，我的号60个粉丝的时候就已经变现了6000元了。所以加速了我后期的进度。\n\n给一个通用的定位公式：提供xx元的xx课程或服务，解决xx人群的xx需求。\n\n只要把每一个痛点确定好，那么你的定位一定是精准的。即便不精准，也可以通过找对标课程，进行拆解优化。\n\n大家千万不要只做一套课，因为一套课的利润和销量太少了。我举个例子，假设你一套课400块钱，全网卖了1000份。那不过是40万，但是你有后端的高价产品，利润可能是100w\n\n基本的产品模型是3套课程\n\n引流款课程\n\n利润课课程\n\n高价款产品\n\n用AI结合，第一步就是给他你的身份，假如你是情感专家，做一套课程，教别人向上社交。可以教恋爱技巧。他会帮你分析定位\n\n这些都是用AI辅助做的定位，已经能给做课的老师很好的思路了，再加上对标数据，做出的课程怎么愁不好卖呢？\n\n![](img/338a4c1f72e4e89a1442f836ac022919.png)\n\n![](img/19de933831260d22e89ee4738936cc5b.png)\n\n![](img/db0eac5aa7fc8d421b85d8b76c98fcf7.png)\n\n刚开始我们可能分析痛点比较难，其实有一个很简单的办法，就是找对标，分析我们的同行。\n\n同行就是最好的老师\n\n往往好的课程定位不是拍脑袋想出来的，是用数据分析出来的。\n\n每次我都会利用独家软件对学浪内部课程数据进行数据分析，课程定位、定价、内容、售价、销量，全部一次搞定\n\n如果你有这个行业定位的模糊，我可以帮你看一下。我有全网的数据\n\n看定价----要看行业的平均定价，根据我们的数据，一般引流课不会超过599，不然公域很难卖\n\n看对标----参考对标的痛点、卖点、标题、甚至是详情页的文案。他们能卖出去，证明已经在这个赛道成功了\n\n看课数----一般是超过20节的课都不好卖，同时完课率也会低，你想想上学45分钟都很难认真听讲，几十节的课会有人听完吗\n\n看销量----有了销量才能确定是不是蓝海赛道，而不是一个伪蓝海赛道，压根不会有人买\n\n![](img/f5150bdfa2f45368da3b967feb933155.png)\n\n![](img/f8addd3d4e4c97d08cfa6c88375737c3.png)\n\n##
    第二步：标题\n\n一个好的课程名字太重要了。✅\n\n不光是引发好奇，还能增加销量。同时名字设置这里也有一些技巧需要大家去思考\n\n起名字，不要自嗨，\n\n多去思考用户想听什么，用户常搜什么，如果你无法占据销量优势，那么就一定要去占搜索词优势\n\n比如我的《AI闪电做课法》，简单精炼，但是又有seo\n\n好的课程标题要包含两部分\n\na、陈述课程知识概要\n\nb、添加课程核心卖点\n\n通过正确的提问方式，就是可以出现下面这些优质的标题，我相信一定比大多数人写的标题更吸引人\n\n这已经大大提高生产力了\n\n大健康的课程，女性成长的课程，还有唱歌的课程，用AI都可以轻松的写出来爆款的大纲\n\n![](img/8acf4223a95609c8b51000ce551123b2.png)\n\n![](img/16606377e558f31fddff032e72679c7a.png)\n\n![](img/7ebf25501f906c5422e1aa1107d2cc6f.png)\n\n##
    第三步，课程大纲\n\n课程的大纲主要是为了保证课程内容顺序不会混乱，课程整体逻辑清晰。同时线上课程的课程大纲，不同于书本，要有一定的保证成分，也就是爆款标题的格式\n\n好的大纲出来是成功的一半\n\n有两点建议\n\n1.不要太专业，晦涩难懂的大纲很难吸引人。\n\n2.不要自嗨，要多考虑用户的需求，假如他就是想学雪梨老师哪种录课形式，我就专门有一节课，雪梨老师的录课样式教学\n\n不得不说，AI在大纲编写方面，实力很强。只要给他提出要求，或者是仿照的模板都可以帮你拆解，几秒钟就写出大纲\n\n下面就是随便一个口令就写出的大纲，还能继续优化，效果还是很惊人的\n\nAI写的好，是因为提示词好\n\n更多的提问口令，可以找我链接，安排\n\n![](img/805b1747c8b9b72b37cb15daaad6163c.png)\n\n![](img/04a4eaa58fc7fd5a6214801881f8659c.png)\n\n前面三步，可能一个小时轻松搞定了，都不需要你敲字，做选择题就好。\n\n可以分享下课程大纲的口令，感兴趣的老师都可以亲自试试.\n\n还有更多口令，可以私下找我\n\n![](img/13c7de8c5c6134e1b8068e64fefdac02.png)\n\n##
    第四步，写正课和试听课\n\n这部分试听课很关键，我还提出了一个黄金法则，首课7步法。\n\n![](img/18a0ef8133f4712e1da99bc9c9f192a4.png)\n\n按照这个模式做，轻松写出百万爆款试听课，讲试听课的时候，我还会用直播加餐课，也是训练营中的一环设计\n\n其实最开始我对于Gpt写试听课，还是很不自信的，试听课太重要了。试听课决定你的卖课率\n\n但是当我把Chatgpt调教测试了300多次，最终得到的口令，我可以说它解决了90%老师写课难得问题。它写的试听课稿，在我的4000多位学员中是中上等的水平\n\n我们的老师都是用的这套模板写的试听课，已经卖课几百万了\n\nhttp://s.xlb-growth.com/0Sfcm\n\n![](img/1b4d6b4350bd410d1c8e6b483799aa1e.png)\n\n![](img/4ddd1ddd8e91aca7d781607046ba8f32.png)\n\n正课就更简单了，我们手敲输出2000字可能要一小时，但让ai写也就3分钟。我们再调整下内容，增加自己的干货。一篇几千字的正课稿就轻松搞定了\n\n![](img/d4e56e3021f436e80cbe3d4bf450eab0.png)\n\n##
    第五步，录课\n\n这个就比较简单了，找一个专业的人教，或者给你一个视频教程快速的录出来\n\n录课的教程，录课需要的工具我都有，需要的可以安排\n\n先完成再完美\n\n有些老师录课几百遍，拖延1个月，就是不满意，迟迟不卖课，错过了最好的时机\n\n所以既然有内容了，就尽快录，先变现再优化，是一点问题没有的\n\n##
    第六步，上架\n\n现在主流的课程，都是上架学浪，这是抖音的亲孩子。唯一就是审核严格一点，按照教程一般都没问题\n\n要么就是私域用小鹅通、荔枝微课交付，都还不错\n\n总计我们计算了，一般能跟着学，10天一定可以做出课程的\n\n![](img/1153fdbee20de1762f8c81da2293c6b7.png)\n\n![](img/5f620903181f38dab8334b49c1223b94.png)\n\n![](img/4b1034da5b89a36b26d40368145a3d68.png)\n\n这是一些我们的学员，感兴趣的老师可以看下\n\nhttp://s.xlb-growth.com/0Sfcm\n\n当然也建议每一个做课卖课的老师，都可以做一个H5，有老师咨询的时候可以发给他，要远比文字展示的效果好\n\n优化一个环节，做课效率提升50%，多卖课10w\n\n下面是部分老师成功做课卖课的截图👇\n\n![](img/b7452d5dac76622607d264286db10ce4.png)\n\n![](img/25225fdc657f2c44109787ab6ffb4046.png)\n\n![](img/2768993cf04797c59d8f0cb688f5e289.png)\n\n![](img/d976d3a34afde994df3143eb4bc0c426.png)\n\n![](img/7474029ffb4ab5284e93e07f04196f48.png)\n\n![](img/d9e793d095fbd4496b4f456bbdeb44d7.png)\n\n#
    三、我是如何通过ai与做课结合，破局进蓝海\n\n## 1.抖音不让卖课了，究竟是 “危” or “机”\n\n卖课的老师都应该经历了一次洗礼，就是4月初的抖音不让卖课的事件。说小不小，说大不大，就是苹果和抖音出现摩擦，为了分钱，下架了所有的知识付费课程。\n\n![](img/b873bdb52cc2a3139689eed17e5d4ea8.png)\n\n那几天全网的老师都在想办法，不然一天可能要损失几十万或百万。当时的市场情绪就很不稳定，我是教人做知识付费，最受影响的也是我们。\n\n卖课的老师当时都很焦虑。同样我的课程也遇到了瓶颈，一年的时间公域和私域卖3000份的课，突然没有任何销量了，停滞不前。\n\n这是一次卖课“危险”\n\n既然有危险了，也是热点，利用这波势能，火了几条视频，引流2000多人。\n\n危机出现的时候，“危”的背后一定是“机”。\n\n不让卖课这件事一定会渡过，抖音不会放过知识付费这么大的赛道。但是对于我们来说，新产品一定是打破僵局的一把利器。\n\n两三天出了解决方案之后，我第一手掌握到“解决方案”，利用信息差，又为课程带动了一些销量。但是远远不够的，很多人其实焦虑，情绪不稳，可能都要放弃这件事了。\n\n当时就一个信念，要么打破僵局，进入下一个做课2.0阶段，要么解散。还好，危后有机，Chatgpt帮我7天做出一套课。\n\n所以我开始研究Chatgpt和做课结合，让它能帮助写大纲，写课稿，还有详情页的文案，还有最让人头疼的PPT，全部都能搞定\n\n![](img/bb899314e2e5cc08b4a1b2860f33d76a.png)\n\n##
    2.我用Chatgpt做课的，黄金复盘\n\n我也在生财有个习惯，就是每天必刷风向标，今年的二三月，已经有很多朋友在Ai领域取得了成功。\n\n当时感到前所未有的机遇到了，AI+行业还没有人做，或者是非常少的人在做\n\n这个表格大家应该都不陌生\n\n![](img/4129019a05fde21ce31dcb577f4d869b.png)\n\n我与AI做课，源于一次失眠，四月的某一天可能我失眠了，失眠的原因就是都很多，有可能是工作压力\n\n当天很多人跟我讲GPT，包括月变现千万的神话也在我耳边传开了，很早就知道
    GPT 这个事了。当时，我仍然坚信与许多老师一样，认为AI无法取代我们凭借智力从事的付费知识工作。\n\n后来现实给我很大的一巴掌，我那天一宿没睡，凌晨 2
    点，爬起来，决定以一套课程为试验，看它看看能不能搞成，因为我自己制作课程很迅速。若GPT能胜过我，证明它能被大家复制。所以当天我想了一个点子，我要切一个完全对我来说未知的领域，我要看看它能不能按照未知领域给我出来一套课。\n\n我只知道做课的方法，但我根本就不知道未知领域里面的内容是什么。然后我就找了个选题，女性情感课，教女性如何找到高富帅的白马王子。\n\n刚刚也讲了五个环节，第一个课程定位，让他分析人群、定位、卖点，在课程大纲里面，梳理标题，起个好的名字。\n\n![](img/f51b682c020cb6594720f54c773cc182.png)\n\n![](img/6c78704ca52ef754aa4840791a54edf1.png)\n\n当晚比较贪心，要能写稿子，这事真的是给我造福了，很多老师都快速的把稿子写出来了，那这个完课率多高。\n\n当时用了我常用的首课7步法提了要求，没想到它真的写出来了\n\n![](img/d87b79f4b6f2b921f8e45bba11b53df5.png)\n\n![](img/06440ebcd8f88ce5e4fd1a8c5cfbadf1.png)\n\n然后接下来录课上架，我这个东西肯定他替代不了你，所以我也没考虑\n\n然后最后课程包装，我在想他能不能帮很多老师写那个详情页文案，因为很多老师他其实没有干过销售和营销型工作，都不知道那个文案怎么写能勾住人，所以很多老师对于写这种详情图包装课程的文案，发售信都不会写，所以我再想想他能不能写这个文案\n\n当时很贪心，想了几个点子让他去测试PPT，就是我已当时已经听说过了，他能够帮人写短视频的选题，还能帮人写短视频的文案，还能帮人编朋友圈，我也想测试测试，这是我大概当时的一个核心逻辑。\n\n![](img/5a91a72901cc37ba794e4f9390e215d6.png)\n\n测试了一宿，情感赛道的内容，帮我写的70%都可以了，自己改改应该没什么问题了。\n\n那一夜，彻夜无眠，但是没有一点疲惫，我找到了破局点\n\n第二天，到公司就和小伙伴沟通，用ai有利有弊，一方面肯定冲击自己的《做好课的课》，一方面就是涉及翻X，这也是有风险的。\n\n争论两三小时，最终投票决定，用AI结合做课，做一次破局。\n\n我们有优势，团队平均年龄24岁，AI对我们来说，接受程度还是相对轻松的。\n\n决定之后就开干，打磨课程框架，优化每一步骤的提问口令prompt，增加了文案、朋友圈的加餐内容\n\n录课，上架，轻车熟路。\n\n真正做到了Chatgpt帮我7天做出一套课\n\n一边写课录课，一边准备发售\n\n当时有一个节点，就是五一假期，我们要赶在假期前打一场胜仗，一个月的精心筹备，只为这一场发售。\n\n【AI做课】还是有它的不确定性，所以我们决定\n\n优先从几千位老生开始，两天时间，拉了两个200人的老生发售群。当晚一场直播转化率近60%，当晚收入近10w\n\n![](img/0f7d4f01679a3da6a41ec563088465f0.png)\n\n悬了半个月的心，当晚终于放下了，一颗大石头落地了。具体的发售细节，篇幅有限，不做过多复盘。这个以后有机会和大家再分享。只要是有产品，一定要做发售\n\n![](img/5793f9299e6662096be5b10db9620c64.png)\n\n当晚剪辑的小伙伴熬夜通宵把课程上架，完成交付。我们对上架应该是全网最清楚的，很多K12、国学的，都是可以上架的，有需要的可以私下沟通\n\n![](img/a7f94c4836deaa7cc63a6ec2c2017c9d.png)\n\n#
    四、提高做课效率的6个超级工具\n\n## 1.chatgpt\n\n这是今年最大的一匹黑马了，用在做课上，效率翻倍。刚刚已经介绍了一部分，不做过多赘述。\n\n只要用对提问方法，你就能获得好的回答，总有好答案，在等待一个好提问\n\n##
    2.闪击ppt、wpsAI\n\n这个也是今年的新产品，两个做PPT的ai工具反响都很不错。有的是给标题就能出ppt，有的根据格式内容，自动生成ppt\n\n![](img/0f86b88a8b79aa271edfa54261d93a27.png)\n\n##
    3.飞书妙计\n\n这是我最常用也是最推荐老师使用的，每次录课写课稿，通过语音转文字，要比键盘打字快很多，而且口语化，很多老师就是课稿或者短视频都缺少口语化，显得很专业\n\n或者是做直播的老师都有拆解同行直播间的习惯，也用这个工具，视频转文字，YYDS\n\n同时做社群或者训练营的老师，会有群分享，也推荐使用，几分钟就
    输出\n\n![](img/e2abdddccc835fd01e0ebd34a936e12c.png)\n\n## 4.直播伴侣\n\n这应该是录课的扛把子了，很多直播的老师都在用，现在逐渐替代OBS。一方面就是操作简单，还有美颜。另一方面，复杂的内容，录课外框，或者直播贴片都适用\n\n远比其他录课工具，效果好\n\n![](img/2b8aed271e86a3c5c92e222909614f2b.png)\n\n##
    5.剪映\n\n做短视频的老师应该都知道，这个工具应用到做课还有妙用。就是你手机可以直接录人像，通过剪映后期合成带有录课外框的。ppt还能设置动画，操作也很简单。字节出的这两个工具很棒\n\n![](img/b5efc9575a6fa08f4acd78b94cc313fa.png)\n\n##
    5.录课样式\n\n给大家分享几种高级的录课样式，还给大家准备了更多的录课外框\n\n需要的老师可以链接，圈友免费安排\n\nhttps://fkwcd.cn/v/2u83vZ3b/?slv=1&sid=lvbt&v=oosnVwjsA-np9rDGEzS7lHJD9PVI&from=singlemessage\n\n![](img/f6bc199ba633fd85c345392b7b6a6532.png)\n\n![](img/1ee92aff965f290397acb35135e91311.png)\n\n![](img/4ed555989b08ab05185f15ddbbb47d80.png)\n\n![](img/42d234603ff18ced7d6cab5860b10b99.png)\n\n![](img/346e1e5edd7ba3f31a9aaeb7aff05dc4.png)\n\n![](img/3893848b18a9f3f46b729a49408e6f45.png)\n\n##
    6.Xmind\n\n应该很多老师用过思维导图，制作课程大纲的时候，设计课程的时候，比较好用，思路清晰\n\n![](img/9a4649d54aa64a222311485ecc5feb41.png)\n\n同时还有个演说功能，也是可以用在录课上，省去了做PPT的时间\n\n#
    写在最后\n\n好了，今天的分享就到这，无论你是企业老板还是个人博主，其实我觉得知识付费都是一门极低成本，极高收入的好事，这个行业的利润在75%以上，老板可以做课程，输出你的产品或者管理思维，用课来征服合作伙伴\n\n个人博主可以做课程增加收入，提高粉丝粘性和后端合作\n\n如果你是小白知识博主，要用
