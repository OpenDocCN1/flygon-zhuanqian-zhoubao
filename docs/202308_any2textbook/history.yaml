  content: '"# 00 后大厂产品 AI 创业半年，最后靠卖课变现几十万\n\n> 原文：[`www.yuque.com/for_lazy/thfiu8/nof7ux8gyx5r3g9h`](https://www.yuque.com/for_lazy/thfiu8/nof7ux8gyx5r3g9h)\n\n##
    (精华帖)(98 赞)00 后大厂产品 AI 创业半年，最后靠卖课变现几十万\n\n作者： 佰色\n\n日期：2023-08-23\n\n《00 后大厂产品
    AI 创业半年，最后靠卖课变现几十万》\n算上兼职创业，不知不觉已经在 AI 赛道折腾半年了，也没拿到什么大结果\n这次主要复盘分享我摸爬滚打的经历和对 AI
    的思考吧\n\n很久没写文，可能比较水，请大家见谅\n[`aboqbe7f4x.feishu.cn/docx/LECJdCGXjoSRM4xJ0socERjmnMb?from=from_copylink`](https://aboqbe7f4x.feishu.cn/docx/LECJdCGXjoSRM4xJ0socERjmnMb?from=from_copylink)\n\n*
    * *\n\n评论区：\n\n老张唠 AI : 加微信合作\n佰色 : 私聊～\nNickW : 期待持续输出抖音如何引流卖课变现的干货\n胖大魔 : 复盘写的挺好\n胖大魔
    : 来探索家吧\n亦仁 : 很强，要不要来我这？\n\n上次我邀请来我这的小伙子，现在已经成为领域头部，一年利润快 8 位数了。\n亦仁 : 感谢分享，已加精华。\n刘小排
    : 喜欢\n\n![](img/1c37d505930596d12a88ab23e11aa07a.png)\n\n* * *"'
- role: tool
  tool_call_id: call_2d669be2d1214025ac9337b3
  content: '"# 直播带货降维餐饮招商，如何用标准化矩阵号实现月利润 50w+\n\n> 原文：[`www.yuque.com/for_lazy/thfiu8/aos35hsxw68gm0e1`](https://www.yuque.com/for_lazy/thfiu8/aos35hsxw68gm0e1)\n\n##
    (44 赞)直播带货降维餐饮招商，如何用标准化矩阵号实现月利润 50w+\n\n作者： 隔壁老胡\n\n日期：2023-08-21\n\n大家好，我是老胡，一个直播带货老鸟\n\n做抖音电商
    5 年，几乎经历了抖音的整个周期\n\n最高年的 GMV3 个亿，单场销售额 500w+、类目榜 1-10 几乎全部占过\n\n但 2022 年整体复盘，发现公司这几年似乎循环在一个怪圈，过山车一样起起伏伏，约了身边所有做直播电商的朋友咨询，发现
    90%公司和我们情况一样。\n\n于是，做了一轮又一轮反思和尽调，穿越淘宝的周期看，这似乎是必然现象，毅然关闭了将近 2000 方的公司，重新上路。\n\n赛道如何选择？\n\n投资回报比多少？\n\n核心团队需要什么条件？\n\n这是首先要思考的三个问题\n\n先说赛道选择\n\n创业十年，选择赛道的唯一条件：增速最快的现象/平台是哪些！围绕增长选择方向，大概率是错不了。\n\n数据看，增速最快的是公司倒闭率。围绕这个可以产生哪些商机？\n\n继续分析，同步增长的肯定是失业率，而失业人群普遍集中到
    35+，这类人的特性：有家庭、有老人、有存款。需求很明确：赚钱！\n\n赚钱的方式选择不外乎两个：1、目前炒的最火的直播带货/短视频带货  2、门槛最低的小餐饮\n\n初心来说，自己都感觉水深的事儿，即时市场再大，也不会轻易教别人，尽最大努力做良心生意，所以，方案
    1  pass\n\n然后就是小餐饮了，投资不大，利润高，经过一个月调研，市场体量比想象中大很多，主要需求有两个\n\n1、最好没有太高的技术含量，上手快\n\n2、不用去现场、线上就能学会\n\n根据市场的需求，我们最终确定了几个品，基本上以卤制品和含预制菜供应链的品为切入口\n\n再看投资回报比\n\n选择节点的第一原则：站位！\n\n如果一个生意，做不到进可攻，退可守的位置，不要轻易开始，失败率太高！\n\n根据站位和投资回报两个原则，最终选定方向：知识付费。边际成本几乎为
    0。\n\n再根据之前调研反馈，以线上知识付费为主战场！\n\n于是，sku 出来了。第一，在线配方课。第二，私域直播课\n\n然后，核心团队需要具备的条件\n\n选择合作伙伴同样有一个原则：和行业头部合作，少走弯路。\n\n当然，后面也证明了这是个正确选择。同样也拉高了这个赛道的门槛。也正因为这道门槛，形成了一个闭环商业模型。\n\n剩下的就是团队的填充了，运营、主播、中台老三样，说实话，热门期的行业，越核心职位，水越深，与其花时间找人，干脆，老子全部亲自上！！！\n\n做
    MCN 和直播带货出身，最擅长的是内容和直播间套路，搞完课程和直播素材（前期是野路子，后面逐步优化原创），憋单玩法测试，果然奏效，新号第三天卖了 4000
    多，这 TMD 可是纯利，第一次尝到这么高利润的甜头。\n\n这个时候，补充主播、中台两个职位，运营是饭碗，一时半会不能放手\n\n但好景不长，新的问题又出现：单账号的流量非常大，但在线销售额的上限有限，最多也就
    1w 出头。\n\n好的是，这个赛道选品几乎没啥变化，借着这个优势，流量深度就有时间研究了，既然单账号上限有限，能不能搞成标准化、矩阵化，继续从带货视角研究，果然可行，标准化场景+一套起号话术+一套稳流量话术，OK，小白也可以在
    3 天内出业绩了。\n\n标准化、低上限、好复制，妥妥的一个培训加 100 倍杠杆模型！！！\n\n既然搞培训，又需要思考两个问题：\n\n1、是否能保证学员可以赚到钱？
       根据内部大量的小白实测，基本没问题了\n\n2、是在做增量，还是在卷自己？\n\n综合分析：素材端—有门槛（盗素材的大多数是同行，没有二转能力）、私域二转—有门槛（有流量的没老师、有老的不懂流量）、线下加盟—有门槛（夫妻店很难做大量标准化交付），三重门槛相加，果断闭环增量！\n\n于是，由选品+流量黑匣子+私域+品牌的一个小闭环形成了。\n\n再看发展，每个平台都在推进本地生活，说明本地生活的潜力值不低于电商，需要怎么结合？\n\n我们内部流量+学员流量可以产生大量的数据，例如：地区、性别、年龄、消费金额等等，这样一来，又可以通过数据反导+分公司模型洗本地生活流量，同时指挥品牌方在数据高爆地区招商。\n\n深一脚、浅一脚，踉踉跄跄半年，做了这一点点事情，和大家分享分享，希望大家可以给出宝贵意见和建议，感谢大家！\n\n*
    * *\n\n评论区：\n\n可可 : 求大佬 V 信。\n隔壁老胡 : xiangbei3456\n\n![](img/1c37d505930596d12a88ab23e11aa07a.png)\n\n*
    * *"'
