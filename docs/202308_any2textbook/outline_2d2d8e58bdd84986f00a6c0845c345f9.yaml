- 'no': 1
  name: AI商业化 —— 从“技术炫技”到“产品落地”
  desc: 本章从商业本质出发，带你理解AI技术如何跨越技术至上的陷阱，走向以产品和需求为导向的可持续商业化路径。
  nodes:
  - 'no': 1
    name: 技术工具论：技术只是实现需求的工具
    desc: 用“锤子与钉子”的类比引入：拥有先进的技术（锤子）并不等于成功，关键是找到需要解决的痛点（钉子）。核心论点——技术本身不是目的，而是满足用户需求的手段。
    role: motivation
    src:
    - paper: IC4Ww_AI商业化
  - 'no': 2
    name: 需求优先定理：技术是工具，需求才是王道
    desc: 正式定义商业化成功的首要准则：挖掘并满足真实用户需求（王道），技术仅仅是实现这一目标的工具。这是AI产品从实验室走向市场的第一步。
    role: definition
    src:
    - paper: IC4Ww_AI商业化
  - 'no': 3
    name: 产品力核心论：打造以核心需求为靶心的产品
    desc: 具体方法：将“需求优先定理”落地为产品力。强调产品力是核心，技术是辅助；产品需要精准定义并解决用户最关键的问题，而非堆砌炫技功能。
    role: method
    src:
    - paper: IC4Ww_AI商业化
  - 'no': 4
    name: 持续盈利原则：AI商业化的生存底线
    desc: 商业闭环的构建：AI项目不能仅停留在技术演示，必须建立可持续的盈利模式。同时，需要认清商业浪潮的周期性，具备耐心等待和跨越低谷的长期主义心态。
    role: method
    src:
    - paper: IC4Ww_AI商业化
  - 'no': 5
    name: 泡沫与陷阱：警惕“技术自嗨”的商业局限
    desc: 反面案例警示：如果忽视产品力与盈利原则，过度追求技术参数或短期风口，极易陷入“技术自嗨”的陷阱，最终导致商业化失败。这是对核心原则的边界验证。
    role: limitation
    src:
    - paper: IC4Ww_AI商业化
- 'no': 2
  name: 拖延症 —— 从“自我对抗”到“行为设计”
  desc: 本章基于心理与行为分析，拆解拖延症背后的五维根因，并提供一套清晰的“三步法”行动指南，教你如何科学地战胜拖延。
  nodes:
  - 'no': 1
    name: 为什么你会拖延：从五个维度审视问题
    desc: 用“病灶检查”类比：在开药方前，先对拖延症进行系统性诊断。提出拖延并非单一原因，而是由五个关键维度（如任务性质、情绪、环境等）共同作用的结果。
    role: motivation
    src:
    - paper: 20230822_19_拖延症
  - 'no': 2
    name: 拖延五维根因模型：系统性拆解病灶
    desc: 正式定义“拖延五维根因”：从五个维度全面拆解导致拖延的深层原因。该模型作为理解个体拖延症的结构化诊断工具，为后续干预奠定基础。
    role: definition
    src:
    - paper: 20230822_19_拖延症
  - 'no': 3
    name: 拖延应对三步法：从诊断到行动的实施策略
    desc: 针对五维根因的应对方案：提供清晰的三步行动策略（诊断根因、制定对应措施、执行与反馈）。强调这是一套可落地、可复制的行为干预机制，用于打破拖延循环。
    role: method
    src:
    - paper: 20230822_19_拖延症
  - 'no': 4
    name: 从根因到对策：三步法的实战推演
    desc: 案例分析：通过一个典型的工作/学习场景，逐步演示如何利用“五维根因”进行诊断，并套用“三步法”制定反拖延计划，展示理论在真实情境下的应用效果。
    role: experiment
    src:
    - paper: 20230822_19_拖延症
  - 'no': 5
    name: 拖延克星的局限：为什么三步法并非万能
    desc: 边界探讨：分析三步法在面对严重心理障碍（如抑郁、焦虑）或极端环境干扰时的失效情况。指出该方法适用于行为层面的自我管理，不能替代临床心理治疗。
    role: limitation
    src:
    - paper: 20230822_19_拖延症
