paper: 20231128_05 读书笔记六法
desc: 该素材提出了一套以'产出文章'为导向的读书笔记方法论，主张读书笔记不应是知识的简单抄录，而应带着写作目的、新媒体思维、场景故事感与'翻译'意识去记录和迁移书中内容，从而将一本书读成多篇文章；其核心观点是读书最重要的在于思考，笔记是思考的体现，并强调不必读完一本书即可快速成文。
concepts:
- name: 带着写文章的目的去记笔记
  desc: 在读书时预先设定写作目标，边读边标注书中内容在未来文章中的用途（如作为开头或引用），使笔记直接服务于文章产出。
  is_original: false
  excerpt:
  - 1带着写文章的目的去记笔记（读书时明确安排书中内容，标注这段可作为开头、这句可引用）
- name: 带着新媒体写作思维去记笔记
  desc: 记笔记前先想清文章用途，具备领域意识，并用'是什么—为什么—怎么办'的公式拆解书籍框架，使笔记适配新媒体文章的常见结构。
  is_original: false
  excerpt:
  - 2带着新媒体写作思维去记笔记（写前想清楚文章用来干嘛，有领域意识，用是什么为什么怎么办公式拆解书框架）
- name: 带着场景感故事思维去记笔记
  desc: 记笔记时举一反三，把书中观点结合生活场景迁移到自身领域，使抽象观点具象化为可叙事的素材。
  is_original: false
  excerpt:
  - 3带着场景感故事思维去记笔记（举一反三，结合生活场景把书中观点迁移到自身领域）
- name: 用书中的总结做笔记拓展一个故事
  desc: 以书中作者总结为基点，采用总分总的写法，将作者结论消化后关联身边的实际例子，扩展成一个完整故事。
  is_original: false
  excerpt:
  - 4用书中的总结做笔记拓展一个故事（总分总写法，把作者结论消化关联身边例子）
- name: 把握好'素材的迁移替换'
  desc: 将书中的例子替换为本国或身边的例子，实现素材的本土化再造，从而扩写为一篇文章。
  is_original: false
  excerpt:
  - 6如何替换书中的例子为你文章所用（书上的例子替换成本国/身边例子，扩展出文章）
- name: 笔记是思考的体现
  desc: 读书最重要的在于思考，笔记的本质是思考过程与结果的载体，而非单纯的内容摘录。
  is_original: true
  excerpt:
  - 核心观点：读书最重要的是思考，笔记是思考的体现。
methods:
- name: 读书笔记六法
  desc: 一套完整的读书笔记操作体系，包含六个具体技法：目的导向笔记、新媒体思维笔记、场景故事笔记、总结拓展故事、观点翻译笔记与例子替换技法。
  excerpt:
  - 6个读书笔记的方法，让你读完一本书写出N篇文章，作者二丫吖。6个方法：1带着写文章的目的去记笔记……2带着新媒体写作思维去记笔记……3带着场景感故事思维去记笔记……4用书中的总结做笔记拓展一个故事……5借用书中观点要学会翻译，将翻译后语句当重要笔记……6如何替换书中的例子为你文章所用……
- name: __overview__
  desc: 整体方法论为'目的驱动—领域拆解—场景迁移—故事拓展—观点翻译—素材替换'，形成从读书到成文的完整闭环，强调以写促读、读以致写。
  excerpt:
  - 带着目的去读，你是用来写文章的，就带领域意识去寻找选题，能否拓展到其他领域，举一反三想到什么就记录下来。当笔记足够形成框架就立马出文。
- name: 观点翻译法
  desc: 将书中观点用自己语言重新翻译表达，并将翻译后的语句作为重要笔记保存，此类语句可直接用作文章小标题。
  excerpt:
  - 5借用书中观点要学会翻译，将翻译后语句当重要笔记（原文翻译成自己语言可作文章小标题）
- name: 框架触发快速成文法
  desc: 不以读完书为成文前提，当笔记积累到足以形成文章框架时立即开始写作，实现高效阅读与快速出文。
  excerpt:
  - 当笔记足够形成框架就立马出文。……高效阅读快速出文，不需读完一整本书（看书看到一半有思路就先写一篇文章）。
theorems:
- name: 一本书可以产出N篇文章
  desc: 借助六种读书笔记方法，同一本书的内容可以被不同维度地记录、迁移和改写，从而支撑多篇文章的产出，而非仅产出一篇读书笔记。
  excerpt:
  - 6个读书笔记的方法，让你读完一本书写出N篇文章
- name: 读书的关键在于思考而非读完
  desc: 读书最重要的价值在于思考，笔记是思考的体现形式；阅读不应以'读完'为终点，而应以便于思考与产出为目的。
  excerpt:
  - 核心观点：读书最重要的是思考，笔记是思考的体现。……高效阅读快速出文，不需读完一整本书。
findings:
- name: 《终身成长》的多领域选题迁移案例
  desc: '[evidence] 以《终身成长》为案例，该方法可拓展出育儿、职场、情感等不同领域的选题，证明同一本书的内容可被跨领域迁移使用。'
  excerpt:
  - 示例：读《终身成长》写出育儿、职场、情感领域选题。
- name: 非完整阅读快速成文
  desc: '[claim] 作者宣称高效阅读与快速出文无需读完一整本书，只要看书到一半产生思路即可先写一篇文章。'
  excerpt:
  - 高效阅读快速出文，不需读完一整本书（看书看到一半有思路就先写一篇文章）。
