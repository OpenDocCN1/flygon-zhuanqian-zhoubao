dimensions:
- name: 主题集中度
  score: 2
  evidence: 素材横跨AI办公、个人成长、时间管理、电商运营、IP变现、广告理论等多个互不隶属的主题，虽有'成长与变现'暗线，但分支明显，难以自然汇聚为一条清晰主线。
- name: 核心命题清晰度
  score: 2
  evidence: 既有方法论类（时间管理、PPT），也有心理类（道歉），还有商业复盘类（狂朝控股、Ozon），缺乏一句话可概括的统一主张，表现为话题堆叠而非单一命题。
- name: 目标读者清晰度
  score: 2
  evidence: 部分指向职场人（时间管理、道歉），部分指向电商创业者（选品、Ozon），部分指向知识IP（定位、变现），读者画像分散，需大幅取舍才能聚焦。
- name: 内容厚度与互补性
  score: 3
  evidence: 单篇深度普遍较高（多数标为high），但篇际间互动薄弱，可勉强按'个人成长-方法工具-商业变现'勉强拼成一条逻辑，重复与断层并存（如两篇时间管理、多篇电商）。
- name: 区分度与新颖性
  score: 3
  evidence: 部分素材有鲜明个人视角（如道歉心理学、十年复盘、品效合一新解），但整体仍偏'经验分享+方法总结'，缺乏贯穿全书的独特分析框架或原创理论标识。
- name: 时效风险
  score: 2
  evidence: 多篇强依赖特定平台或当下热点（Ozon、小红书、闲鱼、AI工具），时间管理、道歉等篇目的常青性尚可，但整体平台操作类内容占比高，时效消耗快。
- name: 可持续扩写空间
  score: 3
  evidence: 单篇素材已较完整（可支撑章节），约可拼出半本书的体量，但需大量串接改写与补齐'成长-变现'的桥梁章节，且存在明显素材缺口（如IP与电商如何互哺）。
total_score: 17
conclusion: not_recommended
recommended_shape: booklet
alternative_path: 不建议作为单本书推进。建议将素材重新拆组为多本薄册或精品课程包，例如：①《高效能个人成长手册》（时间管理+道歉+优势定位+读书笔记）②《电商与IP变现实战拆解》（选品、Ozon、闲鱼、小红书、IP变现）③《商业认知与思维工具》（咨询方法论、品效合一、营销案例）。每本控制在5-8万字的'轻图书'或'深度手册'，既保留素材深度，又规避跨题散乱。
next_steps:
- 重新切分素材为2-3个高内聚子主题组，放弃强行统一成一本书的尝试。
- 为每个子主题组各确定一条一句话核心主张（如'用方法论对抗混乱'），并据此重写导论与各章衔接段。
- 将依赖平台的强时效素材（Ozon、闲鱼、小红书、AI工具）集中编入对应的实战手册分册，并标注'平台政策可能变动，以方法论为准'。
- 优先搭建'个人成长'组（集中度最高），补齐读者画像（建议锁定25-35岁职场人），先出一本小书验证市场再铺开其余分册。
