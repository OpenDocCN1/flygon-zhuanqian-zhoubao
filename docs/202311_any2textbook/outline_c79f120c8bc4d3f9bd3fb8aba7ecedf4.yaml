- 'no': 1
  name: 自我完善与沟通 —— 从“道歉难”到“信任链接”
  desc: 本章从人际沟通中最难的道歉场景切入，揭示自我完善的本质，进而延伸到通过内容输出建立信任与影响力的方法。
  nodes:
  - 'no': 1
    name: 道歉为什么这么难
    desc: 用“心理障碍清单”类比理解：道歉的七个心理难点如同七道关卡，阻碍我们迈出修复关系的第一步。
    role: motivation
    src:
    - paper: 20231107_12 道歉心理学
  - 'no': 2
    name: 道歉的本质是完善自己
    desc: 重新定义道歉：它不是示弱或损失，而是完善自我人格的主动行为，是个人成长的一部分。
    role: definition
    src:
    - paper: 20231107_12 道歉心理学
  - 'no': 3
    name: 道歉十法
    desc: 一套可操作的行动指南：直接具体认错、说明弥补行动、不求原谅等十条方法论，让道歉从“心理难关”变为“实践技能”。
    role: method
    src:
    - paper: 20231107_12 道歉心理学
  - 'no': 4
    name: 危机公关的真诚力量
    desc: 以刘润案例为样本，展示真诚、具体的道歉（删评论、真人出镜）如何在公开危机中发挥有效作用。
    role: experiment
    src:
    - paper: 20231107_12 道歉心理学
  - 'no': 5
    name: 从道歉到信任：内容输出力
    desc: 将沟通能力升级：通过持续输出内容，跨越时空建立信任、链接贵人，这是一种可培育的“超能力”。
    role: extension
    src:
    - paper: 20231107_08 内容输出力
  - 'no': 6
    name: 信任的跨时空建立理论
    desc: 解释内容输出为何能建立信任：语言带来的启迪引发共鸣、思考与行为改变，从而让未曾谋面之人产生信任。
    role: proof
    src:
    - paper: 20231107_08 内容输出力
  - 'no': 7
    name: 铁杆粉丝与超级节点理论
    desc: 量化信任的价值：只需1000个（甚至100个）铁杆粉丝的信任即可支撑事业；高层次认同者可成为“超级节点”，带来指数级增长。
    role: extension
    src:
    - paper: 20231107_08 内容输出力
  - 'no': 8
    name: 小微闭环：输出力的起点
    desc: 提供最小可行练习回路：每天读书10分钟、输出100字，以“微习惯”启动内容输出的能力培育。
    role: method
    src:
    - paper: 20231107_08 内容输出力
- 'no': 2
  name: 时间管理 —— 从“五星功夫”到“日计划落地”
  desc: 本章从宏观的时间管理心法（五星功夫）到微观的日计划制定法，构建一套从认知到执行的时间管理体系。
  nodes:
  - 'no': 1
    name: 衡量是增长的前提
    desc: 引用德鲁克名言，点出时间管理的起点：如果不能衡量时间，就无法增长效率。建立“衡量时间”的元认知。
    role: motivation
    src:
    - paper: 20231107_64 时间管理五星功夫
  - 'no': 2
    name: 五星功夫：时间管理全景图
    desc: 用“武功修炼”类比全景框架：衡量时间、要事第一、周密计划、保持状态、有效复盘，五方面缺一不可。
    role: definition
    src:
    - paper: 20231107_64 时间管理五星功夫
  - 'no': 3
    name: 体内计时器：时间衡量训练法
    desc: 介绍摒弃情绪、用无区别心对待每件事，通过预测、感觉、测量、复盘的循环训练，在体内培养准确的时间感知。
    role: method
    src:
    - paper: 20231107_64 时间管理五星功夫
  - 'no': 4
    name: 收益成本风险评估法
    desc: 用收益、成本、风险三维度量化评估待办事项，辅助“要事第一”的决策。
    role: method
    src:
    - paper: 20231107_64 时间管理五星功夫
  - 'no': 5
    name: WOOP状态调节法
    desc: 用“愿望-结果-障碍-计划”四步模型调节执行状态，配合“如果-那么”计划应对阻碍，保持巅峰状态。
    role: method
    src:
    - paper: 20231107_64 时间管理五星功夫
  - 'no': 6
    name: 清空大脑与4D工作法
    desc: 从“收集箱”到4D分类（Delay、Do it now、Do not do it、Delegate），将脑内待办外部化，降低认知负担。
    role: method
    src:
    - paper: 20231128_03 日计划制定法
  - 'no': 7
    name: 日计划三步法
    desc: 用“衣柜整理”类比：收集清空→4D整理分类→挑选列入日计划，并安排时间，形成完整的日计划流程。
    role: method
    src:
    - paper: 20231128_03 日计划制定法
  - 'no': 8
    name: 让重要的事情变紧急
    desc: 解释人类偏好处理紧急事务的天性，提出给重要事项设定deadline，使其“紧急化”，从而确保执行。
    role: definition
    src:
    - paper: 20231128_03 日计划制定法
  - 'no': 9
    name: 清单与计划分野及弹性容量原则
    desc: 辨析清单（仅事件维度）与计划（事件+时间维度）的区别；强调日计划应保留弹性容量（每项1-2小时，预留盈余），避免过载。
    role: limitation
    src:
    - paper: 20231128_03 日计划制定法
- 'no': 3
  name: 个人优势与定位 —— 从“天赋识别”到“价值变现”
  desc: 本章从个人优势的本质出发，讲解如何定位、构建商业闭环，并释放内容输出力的杠杆效应。
  nodes:
  - 'no': 1
    name: 定位：优势决定位置
    desc: 用“生态位”类比：个人优势决定了你在事业、社会、团队中的位置，进而决定能否赚钱，这就是定位的本质。
    role: motivation
    src:
    - paper: 20231107_66 找准个人优势
  - 'no': 2
    name: 赚钱=提供价值
    desc: 揭示变现的底层逻辑：赚钱与提供价值划等号，只能通过自己擅长的事情来提供价值。
    role: definition
    src:
    - paper: 20231107_66 找准个人优势
  - 'no': 3
    name: 盖洛普才干四分类
    desc: 介绍盖洛普的四大才干类别：战略思维、影响力、关系建立、执行力，并对应到商业闭环中的不同分工。
    role: definition
    src:
    - paper: 20231107_66 找准个人优势
  - 'no': 4
    name: 盖洛普才干分类定位法
    desc: 使用盖洛普四象限判断自己在商业闭环（产品、渠道、流量、成交、交付）中最能创造价值的环节，完成初步定位。
    role: method
    src:
    - paper: 20231107_66 找准个人优势
  - 'no': 5
    name: 实践优于想找：定位是试错出来的
    desc: 反驳“先想清楚再行动”的误区，强调定位不是“找到”的，而是通过实践和试错“长”出来的。
    role: limitation
    src:
    - paper: 20231107_66 找准个人优势
  - 'no': 6
    name: 技能外包与核心掌握策略
    desc: 提供定位后的资源配置原则：普通技能（如社群运营、海报剪辑）可外包，核心稀缺技能（如咨询、流量、成交、内容）必须亲自掌握。
    role: method
    src:
    - paper: 20231107_66 找准个人优势
  - 'no': 7
    name: 市场缺卖者不缺产品
    desc: 点明销售与成交能力在商业闭环中的关键地位，作为定位与能力建设的补充洞察。
    role: extension
    src:
    - paper: 20231107_66 找准个人优势
  - 'no': 8
    name: 真实真诚输出法
    desc: 作为内容输出的核心秘诀：以真实与真诚面对受众，能打开人心中的“保险箱”，提升信任与影响力。
    role: method
    src:
    - paper: 20231107_08 内容输出力
- 'no': 4
  name: 内容生产方法论 —— 从“读书笔记”到“高效成文”
  desc: 本章聚焦内容生产的具体技法，以读书笔记六法为核心，打通“输入-思考-输出”的完整链路。
  nodes:
  - 'no': 1
    name: 读书关键在思考而非读完
    desc: 打破“读完一本书”的执念，指出读书最重要的价值在于思考，笔记是思考过程的体现而非摘录。
    role: motivation
    src:
    - paper: 20231128_05 读书笔记六法
  - 'no': 2
    name: 带着写文章的目的去记笔记
    desc: 以“写作目标”为导航：读书时预先设定文章目标，边读边标注书中的内容在未来文章中的用途（开头、引用等）。
    role: method
    src:
    - paper: 20231128_05 读书笔记六法
  - 'no': 3
    name: 读书笔记六法
    desc: 系统介绍六个技法：目的导向、新媒体思维、场景故事、总结拓展、观点翻译、例子替换，将读书笔记从“摘抄”升级为“创作素材库”。
    role: method
    src:
    - paper: 20231128_05 读书笔记六法
  - 'no': 4
    name: 观点翻译法
    desc: 详解六法之一：将书中观点用自己的语言重译保存，翻译后的语句可直接用作文章小标题，形成个人化表达。
    role: method
    src:
    - paper: 20231128_05 读书笔记六法
  - 'no': 5
    name: 框架触发快速成文法
    desc: 不以读完书为成文前提：当笔记足够形成框架时立即开始写作，实现高效阅读和快速出文。
    role: method
    src:
    - paper: 20231128_05 读书笔记六法
  - 'no': 6
    name: 一本书可产出N篇文章
    desc: 展示笔记方法论的杠杆效应：通过不同维度的记录、迁移和改写，同本书可支撑多篇文章的产出。
    role: extension
    src:
    - paper: 20231128_05 读书笔记六法
  - 'no': 7
    name: 《终身成长》多领域迁移案例
    desc: 以实际案例佐证：读《终身成长》可拓展出育儿、职场、情感等多个领域的选题，验证笔记六法的跨领域可迁移性。
    role: experiment
    src:
    - paper: 20231128_05 读书笔记六法
- 'no': 5
  name: 问题解决与咨询方法论 —— 从“四步法”到“结构化思维”
  desc: 本章将咨询行业的问题解决框架（界定、拆解、执行、复盘）转化为通用思维工具，并介绍议题树、假说驱动等核心技术。
  nodes:
  - 'no': 1
    name: 咨询四步法：问题解决的总框架
    desc: 用“导航系统”类比：界定问题、拆解问题、执行解决、总结复盘四个阶段构成完整路径，且步骤可跳跃、非线性。
    role: definition
    src:
    - paper: 20231114_08 咨询方法论四步法
  - 'no': 2
    name: 方法论非线性原则
    desc: 强调四步法并非强制流程：所有步骤均可根据熟悉度与情境自由跳跃，避免被理论框架束缚。
    role: limitation
    src:
    - paper: 20231114_08 咨询方法论四步法
  - 'no': 3
    name: Issue Tree（议题树）
    desc: 用“树状分解图”类比：将大问题逐层拆解为互不重叠且穷尽的小议题，拆出的可执行小Todo可直接落地，与PDCA本质等同。
    role: method
    src:
    - paper: 20231114_08 咨询方法论四步法
  - 'no': 4
    name: Hypo-Driven（假说驱动）
    desc: 先提出假设再逐一验证的高效策略，并明确其适用前提：对事物有相当熟悉度时应用更顺。
    role: method
    src:
    - paper: 20231114_08 咨询方法论四步法
  - 'no': 5
    name: 假说驱动适用性边界
    desc: 对陌生问题强行套用假说驱动反而降低效率，必须基于问题熟悉度判断是否适用。
    role: limitation
    src:
    - paper: 20231114_08 咨询方法论四步法
  - 'no': 6
    name: Bottom Up拆解法
    desc: 从具体事实细节自下而上归纳议题的方法，对不熟悉的事物更友好，优于对新手不友好的Top Down法。
    role: method
    src:
    - paper: 20231114_08 咨询方法论四步法
  - 'no': 7
    name: Scope与Standard区别
    desc: 厘清关键概念：Scope约等于实现问题的手段，Standard是手段达成后的考核指标，二者不可混淆。
    role: definition
    src:
    - paper: 20231114_08 咨询方法论四步法
  - 'no': 8
    name: 逻辑驱动与试错双轨
    desc: 面对问题时两条路：要么依赖业务逻辑推演，要么直接试错；创意本身价值不高，验证才是关键。
    role: extension
    src:
    - paper: 20231114_08 咨询方法论四步法
