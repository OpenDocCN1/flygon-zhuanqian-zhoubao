    function:
      arguments: '{"paper": "如何深度思考？咨询公司解决问题的四步通用解法，作者海程（前咨询顾问）。以《掌控工作》一书（文翰所著）为基础，通过代入\"肩颈不舒服\"案例探讨咨询方法论。书的四大章节：界定问题/拆解问题/执行解决/总结复盘。核心观点：1）所有步骤都是可以跳的，无论是熟悉专业术语还是制定工作计划，不要被理论框住；2）Hypo-driven（假说驱动）在熟悉某件事的前提下应用更顺，不需要强行套用；3）Issue
        Tree（议题树）拆出的一些小Todo可以直接执行，不用等到最后。关键概念：问题树Issue Tree、假说驱动Hypo-Driven、MECE原则、SMART、BCG矩阵（明星/奶牛/问题业务/瘦狗业务）、PDCA、重要紧急+投入量分析矩阵。重要观点：界定问题环节剖析问题本质时，填格子硬凑字数是常见问题；Standard和Scope差别（Scope≈手段，Standard是手段达成的考核指标）；Risk定义（超预期时间或新意外都是风险）。拆解问题时Bottom
        Up更适合不熟悉的事物，主流Top Down对新手不友好。创意大多廉价，业务逻辑是大多数场景成立的关键；要么靠逻辑要么靠试错。执行解决环节，简单的case拆解问题时就完成大部分分析了。总结复盘环节，Issue
        Tree和PDCA基本是一件事。战略定义：短中长期目标+实现目标的手段。启示：学习任何理论模型需要有预期，反反复复乃至上线大雷都很常见，不存在在真空中丝滑运行的工具。",
        "paper_name": "20231114_08 咨询方法论四步法"}'
      name: tool_ext_concepts
    type: function
