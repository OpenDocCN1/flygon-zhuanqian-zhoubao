      arguments: '{"paper_name": "20231107_64 时间管理五星功夫", "paper": "时间管理的底层思维和操作方法，作者康妮姐。20年经验提出的\"五星功夫\"时间管理方法：衡量时间、要事第一、周密计划、保持状态、有效复盘五个要点。德鲁克说：一样东西如果你不能衡量它，你就不能增长它。要增长时间首先要衡量时间。衡量时间不是数秒，而是体内随时自带计时器，能准确预估时间、不会因为重要事觉得费时就拒绝、不会因为不重要事觉得就一会儿就随意开始。衡量时间的训练：摒弃情绪用无区别的心对待每件事；有意尝试预测、感觉、测量、复盘时间。要事第一就是永远把重要的事优先，需要拉长周期把现在的事嵌到周计划月计划年计划人生计划思考。要做的所有事情可以用收益、成本、风险公式衡量。周全计划：起点是现在，终点是deadline前两天；预估每个动作包括plan
        B；预估动作时长；做MVP先校验跑通不铺开太大（制造业小试中试试生产量产）；根据MVP调整；确定涉及的人和物。保持状态：状态是当下所有精力体力情绪的集合。找到自己的临界点。可做状态练习（初级：想象最喜欢的事；进阶：想象工作已完成；高阶：WOOP模型——愿望W、结果O、障碍O、计划P，制定\"如果…那么…\"计划）。有效复盘三要点：复盘计划是否周密、复盘时间衡量能力、复盘要事第一原则。总结：我们每个人都是一台被写好程序的机器，掌控人生首先要知道自己是怎么反应的，然后改写内置程序。"}'
