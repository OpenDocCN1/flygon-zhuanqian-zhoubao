    ,\n        \"- 若无法精确感知时间，就无法有效衡量和分配时间，「衡量时间」便无从谈起\",\n        \"- 体内计时器训练法能够培养精准的时间感知能力，为时间管理打下基础\"\
    ,\n        \"**核心定义**\",\n        \"- 体内计时器是一种通过「预测→感觉→测量→复盘」循环来训练时间感知的方法\",\n\
    \        \"- 核心原则是「摒弃情绪，用无区别的心对待每件事」——不带主观好恶地客观感受每件事的时间消耗\",\n        \"**关键性质**\"\
