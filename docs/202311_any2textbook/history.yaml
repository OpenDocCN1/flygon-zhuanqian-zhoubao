        |\n\n## 练习题\n\n1. **绘制你的五星时间全景图**：用五星功夫五个维度诊断昨天——记录每个活动耗时并加总，确认最重要的三件事，为明天各安排一个执行时间段，找出你的精力高峰期，并设置今晚复盘的标准。\n2.
