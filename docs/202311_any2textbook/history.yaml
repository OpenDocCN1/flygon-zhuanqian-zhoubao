    function:
      arguments: '{"paper": "6个读书笔记的方法，让你读完一本书写出N篇文章，作者二丫吖。6个方法：1带着写文章的目的去记笔记（读书时明确安排书中内容，标注这段可作为开头、这句可引用）；2带着新媒体写作思维去记笔记（写前想清楚文章用来干嘛，有领域意识，用是什么为什么怎么办公式拆解书框架）；3带着场景感故事思维去记笔记（举一反三，结合生活场景把书中观点迁移到自身领域）；4用书中的总结做笔记拓展一个故事（总分总写法，把作者结论消化关联身边例子）；5借用书中观点要学会翻译，将翻译后语句当重要笔记（原文翻译成自己语言可作文章小标题）；6如何替换书中的例子为你文章所用（书上的例子替换成本国/身边例子，扩展出文章）。核心观点：读书最重要的是思考，笔记是思考的体现。带着目的去读，你是用来写文章的，就带领域意识去寻找选题，能否拓展到其他领域，举一反三想到什么就记录下来。当笔记足够形成框架就立马出文。示例：读《终身成长》写出育儿、职场、情感领域选题。高效阅读快速出文，不需读完一整本书（看书看到一半有思路就先写一篇文章）。",
        "paper_name": "20231128_05 读书笔记六法"}'
      name: tool_ext_concepts
