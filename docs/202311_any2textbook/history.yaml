  content: "{\n  \"paper\": \"20231114_08 咨询方法论四步法\",\n  \"desc\": \"该素材以“肩颈不舒服”生活案例为切入点，系统阐述了咨询行业的问题解决方法论四步法（界定问题、拆解问题、执行解决、总结复盘），并明确主张该四步法并非线性强制流程而是可灵活跳跃的框架。素材深入辨析了核心概念（Issue\
    \ Tree、Hypo-Driven、MECE、SMART等）的适用边界，提出多个反常识观点：假说驱动应建立在熟悉度之上而非强行套用、Bottom Up拆解更适合新手、Issue\
    \ Tree与PDCA本质同源等，并强调了学习理论模型时应持有的预期管理心态。\",\n  \"concepts\": [\n    {\n      \"\
    name\": \"四步法（界定问题/拆解问题/执行解决/总结复盘）\",\n      \"desc\": \"咨询方法论的总体流程框架，源于文翰《掌控工作》，包含界定问题、拆解问题、执行解决、总结复盘四个环节，其核心特征是可跳过、非线性。\"\
    ,\n      \"is_original\": false,\n      \"excerpt\": [\n        \"书的四大章节：界定问题/拆解问题/执行解决/总结复盘。\"\
    ,\n        \"所有步骤都是可以跳的……不要被理论框住。\"\n      ]\n    },\n    {\n      \"name\": \"\
    Issue Tree（议题树）\",\n      \"desc\": \"将大问题逐层拆解为互不重叠且穷尽的小议题的树状结构工具，拆出的小Todo可直接执行，且与PDCA本质等同。\"\
    ,\n      \"is_original\": false,\n      \"excerpt\": [\n        \"Issue Tree（议题树）拆出的一些小Todo可以直接执行，不用等到最后。\"\
    ,\n        \"总结复盘环节，Issue Tree和PDCA基本是一件事。\"\n      ]\n    },\n    {\n      \"\
    name\": \"Hypo-Driven（假说驱动）\",\n      \"desc\": \"先提出假设再逐一验证的分析思路，适用前提是对事物有相当熟悉度，不具备时应退回到Bottom\
    \ Up拆解而非强行套用。\",\n      \"is_original\": false,\n      \"excerpt\": [\n      \
    \  \"Hypo-driven（假说驱动）在熟悉某件事的前提下应用更顺，不需要强行套用。\"\n      ]\n    },\n    {\n    \
    \  \"name\": \"Scope 与 Standard 的区别\",\n      \"desc\": \"Scope约等于实现问题的手段，而Standard是手段达成后的考核指标，二者含义易混淆但维度不同。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"Standard和Scope差别（Scope≈手段，Standard是手段达成的考核指标）。\"\
    \n      ]\n    },\n    {\n      \"name\": \"Risk（风险）的扩展定义\",\n      \"desc\":\
    \ \"超出预期的时间消耗或未预料的意外事件均构成风险，而不仅是传统意义上的负面损失。\",\n      \"is_original\": true,\n\
    \      \"excerpt\": [\n        \"Risk定义（超预期时间或新意外都是风险）。\"\n      ]\n    }\n  ],\n\
    \  \"methods\": [\n    {\n      \"name\": \"__overview__\",\n      \"desc\": \"\
    以'肩颈不舒服'具体案例代入，演示从问题界定到总结复盘的完整咨询思维链路，并在此基础上提出对各步骤的具身化反思。\",\n      \"excerpt\"\
    : [\n        \"以《掌控工作》一书（文翰所著）为基础，通过代入'肩颈不舒服'案例探讨咨询方法论。\"\n      ]\n    },\n \
    \   {\n      \"name\": \"Bottom Up（自下而上拆解）\",\n      \"desc\": \"从具体事实和细节出发自下而上归纳议题，素材主张该方法对不熟悉的事物更友好，优于主流但难上手的Top\
    \ Down。\",\n      \"excerpt\": [\n        \"拆解问题时Bottom Up更适合不熟悉的事物，主流Top Down对新手不友好。\"\
    \n      ]\n    },\n    {\n      \"name\": \"逻辑驱动与试错双轨策略\",\n      \"desc\": \"\
    面对问题场景时，要么依赖业务逻辑推演，要么直接试错，创意本身价值不高，业务逻辑才是多数场景成立的关键。\",\n      \"excerpt\": [\n\
    \        \"创意大多廉价，业务逻辑是大多数场景成立的关键；要么靠逻辑要么靠试错。\"\n      ]\n    }\n  ],\n  \"theorems\"\
    : [\n    {\n      \"name\": \"方法论非线性原则\",\n      \"desc\": \"咨询四步法各步骤均非强制顺序，可根据熟悉度与情境自由跳跃，任何工具都不应在真空中被假设为丝滑运行。\"\
    ,\n      \"excerpt\": [\n        \"所有步骤都是可以跳的，无论是熟悉专业术语还是制定工作计划，不要被理论框住。\",\n\
    \        \"学习任何理论模型需要有预期，反反复复乃至上线大雷都很常见，不存在在真空中丝滑运行的工具。\"\n      ]\n    },\n \
    \   {\n      \"name\": \"假说驱动的适用性边界\",\n      \"desc\": \"Hypo-Driven的有效性以问题的熟悉度为前提条件，对陌生问题强行套用假说驱动反而会降低效率。\"\
    ,\n      \"excerpt\": [\n        \"Hypo-driven（假说驱动）在熟悉某件事的前提下应用更顺，不需要强行套用。\"\n\
    \      ]\n    },\n    {\n      \"name\": \"Issue Tree与PDCA同源论\",\n      \"desc\"\
    : \"总结复盘环节中，议题树的作用与PDCA循环本质上是同一件事的两种表述，不必割裂看待。\",\n      \"excerpt\": [\n    \
    \    \"总结复盘环节，Issue Tree和PDCA基本是一件事。\"\n      ]\n    },\n    {\n      \"name\"\
    : \"创意廉价论\",\n      \"desc\": \"在业务问题解决中，创意本身价值有限，起决定作用的是业务逻辑推导或直接试错验证。\",\n \
    \     \"excerpt\": [\n        \"创意大多廉价，业务逻辑是大多数场景成立的关键；要么靠逻辑要么靠试错。\"\n      ]\n\
    \    }\n  ],\n  \"findings\": [\n    {\n      \"name\": \"新手偏好Bottom Up拆解\",\n\
    \      \"desc\": \"[evidence] 基于对主流Top Down对新手不友好的观察，素材主张Bottom Up更适合不熟悉的事物，但此结论为经验性断言而非受控实验数据支撑。\"\
    ,\n      \"excerpt\": [\n        \"拆解问题时Bottom Up更适合不熟悉的事物，主流Top Down对新手不友好。\"\
    \n      ]\n    },\n    {\n      \"name\": \"简单case的拆解即完成分析\",\n      \"desc\"\
    : \"[claim] 素材主张在执行解决环节，简单的case在拆解问题阶段就已完成了大部分分析工作，后续执行所增信息量有限。\",\n      \"excerpt\"\
    : [\n        \"执行解决环节，简单的case拆解问题时就完成大部分分析了。\"\n      ]\n    },\n    {\n     \
    \ \"name\": \"填格子硬凑字数是界定问题常见缺陷\",\n      \"desc\": \"[evidence] 基于对咨询实践案例的观察，界定问题环节剖析问题本质时的常见陷阱是机械填满框架格子而缺乏实质思考，此判断来自实践经验总结。\"\
    ,\n      \"excerpt\": [\n        \"界定问题环节剖析问题本质时，填格子硬凑字数是常见问题。\"\n      ]\n  \
    \  }\n  ]\n}"
- role: tool
  tool_call_id: call_g2neq06thceogzg5wisswf61
  content: "{\n  \"paper\": \"20231128_03 日计划制定法\",\n  \"desc\": \"该素材由时间管理教练枕棠提出一套结合滴答清单软件的日计划制定方法论，核心为'三步法'（收集清空大脑、4D整理分类、挑选列入日计划），主张通过把重要事情设定截止日期使其'变紧急'来对抗人类天性，并警示计划制定中的两个常见误区，最终以'清空、自由、蓄能、计划'四句箴言收束。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"清空大脑/收集箱\",\n      \"desc\": \"\
    将所有脑内待办事项无差别地记录到外部清单工具中，以此降低认知负担和焦虑，是日计划制定的第一步，可随时随地执行。\",\n      \"is_original\"\
    : false,\n      \"excerpt\": [\n        \"1把脑袋里的事情都收集到清单里（清空大脑/收集箱）；\",\n    \
    \    \"清空大脑可随时随地做，整理收集箱一天一次。\"\n      ]\n    },\n    {\n      \"name\": \"4D工作法（GTD衍生）\"\
    ,\n      \"desc\": \"对收集箱中的事项按四象限处理：Delay计划去做、Do it now立即去做、Do not do it尽量别做、Delegate授权去做；其中授权需明确交接时间，思考下一步行动需尽量详细并拆分大任务。\"\
    ,\n      \"is_original\": false,\n      \"excerpt\": [\n        \"4D工作法（GTD）：Delay计划去做、Do\
    \ it now立即去做、Do not do it尽量别做、Delegate授权去做。\",\n        \"授权不是放权，要询问对方下一步交接时间。思考下一步行动要尽量详细，大任务拆解为小任务（减小阻力、方便碎片时间）。\"\
    \n      ]\n    },\n    {\n      \"name\": \"日计划的'事件+时间双维度'\",\n      \"desc\"\
    : \"与单纯清单的区别在于，日计划必须为事件安排具体时间；不给事安排时间的不叫计划而叫清单，这是新手最常见误区之一。\",\n      \"is_original\"\
    : true,\n      \"excerpt\": [\n        \"1清单只有事件维度，计划既有事件维度又有时间维度（不给事安排时间的不叫计划叫清单）\"\
    \n      ]\n    },\n    {\n      \"name\": \"计划的自由度/盈余时间\",\n      \"desc\": \"\
    日计划不应严丝合缝，应为一小时至两小时安排一项任务，并每日预留一两小时盈余时间，以防失控感与挫败感，保障计划的可持续落地。\",\n      \"is_original\"\
    : true,\n      \"excerpt\": [\n        \"2新手做计划安排严丝合缝（一小时一任务半小时一任务），一旦没按预期进行全部推翻产生失控感和挫败感，应留足够自由度一小时两小时安排一任务，每天留出一两小时盈余时间。\"\
    \n      ]\n    },\n    {\n      \"name\": \"让重要的事情变紧急\",\n      \"desc\": \"针对人类天性更倾向于做紧急而非重要的事情，通过给重要事项设置截止日期（deadline）使其转化为紧急事项，从而推动执行。\"\
    ,\n      \"is_original\": false,\n      \"excerpt\": [\n        \"2让重要的事情变紧急（人类天性做紧急而非重要的事，给重要的事设deadline让它紧急起来）。\"\
    \n      ]\n    }\n  ],\n  \"methods\": [\n    {\n      \"name\": \"日计划制定三步法\"\
    ,\n      \"desc\": \"以衣柜整理作比的三步法：一、将脑中杂事尽数收集入清单（清空大脑）；二、使用4D工作法厘清并分门别类管理下一步行动；三、从清单挑选部分事项列入日计划并分配时间。\"\
    ,\n      \"excerpt\": [\n        \"制作日计划三步法（对应衣柜整理比喻）：1把脑袋里的事情都收集到清单里（清空大脑/收集箱）；2厘清这些事情下一步行动分门别类管理（4D工作法）；3从事情中挑选出部分列为日计划安排时间。\"\
    \n      ]\n    },\n    {\n      \"name\": \"__overview__\",\n      \"desc\": \"\
    整体方法论：以滴答清单为工具载体，遵循'收集—整理—排期'的流水线框架，辅以对第三往步骤的'自由度控制'和'重要设限'策略，形成闭环的日计划管理体系。\"\
    ,\n      \"excerpt\": [\n        \"滴答清单&日计划制定法：重点介绍滴答清单功能与日计划制定三步法。\",\n     \
    \   \"清空是为了更好的专注；自由是为了更好的落地；蓄能是为了更好的创造；计划是为了更好的前行。\"\n      ]\n    }\n  ],\n \
    \ \"theorems\": [\n    {\n      \"name\": \"人类天性趋紧急避重要原理\",\n      \"desc\": \"\
    人类天性会优先执行紧急而非重要的事务，因此有效的时间管理在于将重要的事务通过设定截止日期'制造'出紧急感，以促进行动。\",\n      \"excerpt\"\
    : [\n        \"人类天性就是去做紧急的事情而非重要的事情。让重要的事情变得紧急，即为重要的事情设置时间设ddl。\"\n      ]\n \
    \   },\n    {\n      \"name\": \"清单与计划分野准则\",\n      \"desc\": \"只有事件维度没有时间维度的组织方式属于清单，必须同时具备事件与时间两个维度才能真正构成计划；无时间安排的'计划'名不副实。\"\
    ,\n      \"excerpt\": [\n        \"1清单只有事件维度，计划既有事件维度又有时间维度（不给事安排时间的不叫计划叫清单）；\"\
    \n      ]\n    },\n    {\n      \"name\": \"弹性容量原则\",\n      \"desc\": \"日计划应保持任务颗粒度粗放（一至两小时一项）并预留日盈余时间（一两小时），以缓冲区吸收不确定性，避免规划过载导致的整体崩溃与挫败。\"\
    ,\n      \"excerpt\": [\n        \"2新手做计划安排严丝合缝（一小时一任务半小时一任务），一旦没按预期进行全部推翻产生失控感和挫败感，应留足够自由度一小时两小时安排一任务，每天留出一两小时盈余时间。\"\
    \n      ]\n    }\n  ],\n  \"findings\": [\n    {\n      \"name\": \"日计划降低焦虑并驱动执行\"\
    ,\n      \"desc\": \"[claim] 作者宣称日计划的双重益处：一为罗列事项并确定下一步行为可形成清晰可执行计划从而降低焦虑；二为通过设deadline使重要事情变紧急，驱动执行。该结论为经验断言，无实测数据。\"\
    ,\n      \"excerpt\": [\n        \"做日计划的巨大意义：1降低焦虑（所有事列出来确定下一步行为形成清晰可执行计划）；2让重要的事情变紧急（人类天性做紧急而非重要的事，给重要的事设deadline让它紧急起来）。\"\
    \n      ]\n    },\n    {\n      \"name\": \"严丝合缝计划的失败模式\",\n      \"desc\": \"\
    [claim] 作者经验性指出新手若将日程安排得严丝合缝（以小时或半小时为粒度），一旦偏离预期便会全盘推翻，进而引发失控感与挫败感；对策是放宽任务粒度并预留盈余时间。属方法论断言，非数据实证。\"\
    ,\n      \"excerpt\": [\n        \"2新手做计划安排严丝合缝（一小时一任务半小时一任务），一旦没按预期进行全部推翻产生失控感和挫败感，应留足够自由度一小时两小时安排一任务，每天留出一两小时盈余时间。\"\
    \n      ]\n    },\n    {\n      \"name\": \"大任务拆解的阻力削减效用\",\n      \"desc\": \"\
    [claim] 作者主张将大任务拆解为小任务能同时减小启动阻力并利用碎片时间，属操作性经验原则，未附实证数据支撑。\",\n      \"excerpt\"\
    : [\n        \"思考下一步行动要尽量详细，大任务拆解为小任务（减小阻力、方便碎片时间）。\"\n      ]\n    },\n    {\n\
    \      \"name\": \"软件选型对比建议\",\n      \"desc\": \"[claim] 作者给出滴答清单与时光序两款软件横向对比的结论，倾向推荐滴答清单的功能（采重点介绍滴答清单功能），属主观评测意见。\"\
    ,\n      \"excerpt\": [\n        \"横向对比时间管理软件（滴答清单vs时光序），重点介绍滴答清单功能与日计划制定三步法。\"\
    \n      ]\n    }\n  ]\n}"
- role: tool
  tool_call_id: call_urjhk2bmi6l90o7geaczthau
  content: "{\n  \"paper\": \"20231128_05 读书笔记六法\",\n  \"desc\": \"该素材提出了一套以'产出文章'为导向的读书笔记方法论，主张读书笔记不应是知识的简单抄录，而应带着写作目的、新媒体思维、场景故事感与'翻译'意识去记录和迁移书中内容，从而将一本书读成多篇文章；其核心观点是读书最重要的在于思考，笔记是思考的体现，并强调不必读完一本书即可快速成文。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"带着写文章的目的去记笔记\",\n      \"desc\"\
    : \"在读书时预先设定写作目标，边读边标注书中内容在未来文章中的用途（如作为开头或引用），使笔记直接服务于文章产出。\",\n      \"is_original\"\
    : false,\n      \"excerpt\": [\n        \"1带着写文章的目的去记笔记（读书时明确安排书中内容，标注这段可作为开头、这句可引用）\"\
    \n      ]\n    },\n    {\n      \"name\": \"带着新媒体写作思维去记笔记\",\n      \"desc\":\
    \ \"记笔记前先想清文章用途，具备领域意识，并用'是什么—为什么—怎么办'的公式拆解书籍框架，使笔记适配新媒体文章的常见结构。\",\n      \"\
    is_original\": false,\n      \"excerpt\": [\n        \"2带着新媒体写作思维去记笔记（写前想清楚文章用来干嘛，有领域意识，用是什么为什么怎么办公式拆解书框架）\"\
    \n      ]\n    },\n    {\n      \"name\": \"带着场景感故事思维去记笔记\",\n      \"desc\":\
    \ \"记笔记时举一反三，把书中观点结合生活场景迁移到自身领域，使抽象观点具象化为可叙事的素材。\",\n      \"is_original\": false,\n\
    \      \"excerpt\": [\n        \"3带着场景感故事思维去记笔记（举一反三，结合生活场景把书中观点迁移到自身领域）\"\n \
    \     ]\n    },\n    {\n      \"name\": \"用书中的总结做笔记拓展一个故事\",\n      \"desc\":\
    \ \"以书中作者总结为基点，采用总分总的写法，将作者结论消化后关联身边的实际例子，扩展成一个完整故事。\",\n      \"is_original\"\
    : false,\n      \"excerpt\": [\n        \"4用书中的总结做笔记拓展一个故事（总分总写法，把作者结论消化关联身边例子）\"\
    \n      ]\n    },\n    {\n      \"name\": \"把握好'素材的迁移替换'\",\n      \"desc\": \"\
    将书中的例子替换为本国或身边的例子，实现素材的本土化再造，从而扩写为一篇文章。\",\n      \"is_original\": false,\n  \
