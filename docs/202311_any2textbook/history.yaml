  content: '"# 时间管理的底层思维和操作方法\n\n> 原文：[`www.yuque.com/for_lazy/thfiu8/rwgkyecu49nckosx`](https://www.yuque.com/for_lazy/thfiu8/rwgkyecu49nckosx)\n\n##
    (37 赞)时间管理的底层思维和操作方法\n\n作者： 康妮姐\n\n日期：2023-11-01\n\n大家好，我是康妮姐，本次航海的时间管理教练之一，20
    年经验的税务专家，合规筹划节税额 30 亿。\n\n我的工作一直和时间有关。用时长依据收费，用时点保证交付，用耗时控制成本，所以尝试过很多时间管理方法，也在实践中积累了一些经验。\n今天我就把我
    20 年总结迭代的时间管理的 “功夫” 分享给大家，我认为它从根本上解决了困惑，创造了更多的时间，完成了更好的产出，在我的团队推广实践应用也很有效，希望对大家有帮助。\n\n因为一共有
    5 点，所以我给它起了个名字叫“五星功夫”。五颗星星分别是衡量时间，要事第一，周密计划，保持状态，有效复盘。\n\n20 世纪最伟大的管理学家彼得德鲁克曾经说过一句话，一样东西，如果你不能够衡量他，你就不能增长他。\n同样的，如果我们想增长时间，那我们首先要做到的是衡量时间。\n\n那什么是衡量时间呢？\n\n肯定不是说让你拿着表去或者手机去数秒了。衡量时间是你体内随时自带一个计时器。\n\n这个听起来很容易，但其实比较难。比如同样的
    1 个小时，刷短视频的时候怎么这么快，开会的时候怎么这么慢，这就是不一样的体感。\n\n当你掌握了衡量时间的能力后，会出现这样的效果：\n1、你会对将要做、正在做的事情，花费的时间，有更准确的预估；\n2、不会因为重要的事感觉要多花时间，就下结论“没空”不去做，比如锻炼，整理笔记；\n3、不会因为不重要的事“就一会儿”，就随意开始，比如刷视频，闲聊。\n\n衡量时间的训练的方式很简单：\n\n第一，摒弃情绪，用无区别的心对待每一件事，时间是公平的。\n第二，有意尝试，在开始前预测时间，开始后感觉时间，结束后测量时间，复盘时进行分析。\n\n尝试的方式也很简单，不用开始研究任何计时软件，千万不要\n放个本子在旁边，开始的时候记一笔，结束的时候记一笔，看到误差后，有时间就想想到底是哪块儿技能自己高估了，没时间就想
    30 秒大概知道就行了。\n\n每天工作结束后，花 2 两分钟看看今天记录，把需要改进的部分简单写几个字到旁边。特别重要的列入计划。完结。\n记的东西你能看懂就行。所以千万不要纠结买什么本子笔，配什么文具写多少字，这些动作没一个对目标有用的。\n\n建议先从你觉得“就一会儿”的事，和“没空做”的事，开始。\n相信我，你会发现一个未知的自己，也会对每件事重新定义。\n两天下来你就不一样了，两周后改变明显。\n\n在时间可以衡量的前提下，我们就可以开始对时间进行真正的管理了。\n\n我们面临的最常见的问题是：同时有很多事情要做。\n这个问题是让我们渐入纠结内耗的最重要的问题。处理不当的话会让我们每天疲于应付，最后迷失自己，简称瞎忙。\n\n那么如何解决这个问题？要事第一，就是永远把重要的事优先。\n\n什么是重要的事，需要拉长周期，把现在的事情，嵌到你的周计划、月计划、年计划，甚至人生计划去思考，真正做到日拱一卒。\n\n从生财这个点出发，那就是所有的事情，在赚钱这件事上的贡献度，再明确点就是收益、成本、风险，重新排序。\n\n更具体的说，你要做的所有事情都可以用
    这个公式来衡量。\n\n这里注意 2 点：\n1、动作一定是对目标有贡献的；\n2、反馈最好是当下的，也可以是长期的（比如思考，研发，休息）。\n\n凡事欲则立不预则废。如果有手头不止一件事的话，计划就成了必须。\n\n计划是由和两部分组成，列计划需要注意以下几点：\n\n1、时间的起点，是现在。终点是
    deadline 的前两天（或前两个小时，前 20 分钟）。一定要像赶飞机一样提前，才能应对意外出现的特殊情况。\n2、预估每一个动作，包括如果遇到意外的应对策略，也就是
    plan B。\n\n3、预估每个动作所需时长，填到你的计划表中。这里需要用到衡量时间的技巧。\n4、做一个 MVP。先校验、跑通，不要铺开太大。比如改革开放是从特区开始的，积累了经验才全面开展的\n比如在我的工作中，我是先看一个月的数据，先开一个小范围的启动会，先试点一个区域的方案。\n\n5、根据
    MVP 调整第一步和第二步。\n6、确定、并搞定每个动作牵涉到的所有的人、财、物、场地、顺序等。\n出于保密的职业道德，我给大家看一个我行业最基础动作的计划表作为例子\n\n![](img/ad6f89babb3166451e9c79c470f9fd45.png)\n\n补充
    MVP 的应用\n\n制造业的新产品上市有其自身规律，不是在实验室研究出来后，就直接批量生产推向市场。\n通常有四个阶段，小试，中试，试生产，量产。\n\n小试，就是在实验室里把产品做出来；中试，就是模拟一个生产环境对小试进行放大和检验；试生产，就是放到正式的生产线上跑，直到符合既定目标；最后才真的量产。前三个阶段都需要不断调整。\n\n部分焦虑，就来源于直接把自己推进了市场，良品率不高，或者良品率虽高但成本过高，又开始怀疑自己\n\n有时候，即便我们已经确定什么事要做了，也知道其实花的时间并不可怕，可就是拖延，或者提不起兴趣，反正“不在状态”。怎么解决呢？\n\n状态是你当下所有精力、体力、情绪的集合，是你这个生物体要作用于外界的起点。\n\n每个人的状态形成原因不同，需要大家自己去觉察和记录，按年、季、月、周、天、半天甚至小时，大概会是什么时候最佳，什么时候最差，尤其是找到自己的那个临界点，可以在适宜的时候去拓宽，不要在慌乱的时候去刺激。\n\n比如我自己，同事们都尽量避免给我安排下午
    3 点的重要会议，因为那个时候我的状态最差\n\n我们可以根据上述内容，做一个自己的生物实验手册，包含饮食、睡眠、运动、情绪等，以及历史上对付不良状态时曾经有效的心法和方法\n\n根据自己的生物特性，可以把重要或着急的事安排在状态好的时候，把不重要或者不着急的事情安排在状态不太佳的时候。\n至于轻重缓急怎么区分，请回到“第二个，要事第一”去衡量\n\n如果有情绪问题，也不用沮丧，识别情绪的周期和解决方案，就像饿了吃饭一样自然。比如我在某些时候会容易伤感，我会接受自己的周期，不会强行寻找快乐，而是干脆看一部悲剧，眼泪流完人就清爽了。\n\n首先，接受每个人都有不喜欢做的事情，把潜意识里的不愿意，放到明意识里，然后寻找不喜欢背后的情绪，是畏难，还是嫌烦，然后针对性地做情绪训练，寻找正反馈。\n也可以直接让行为改变状态。\n\n有两种情况：\n\n可以先去干点与工作相关的，其他重要但不紧急的事，放慢节奏，让自己进入状态。\n\n拿我自己举例。我是靠脑子吃饭的，状态不好的时候动不了脑子，那我就去干点其他的来恢复，重看项目资料查缺补漏，整理工作文档方便以后，阅读行业税法寻找灵感。\n\n这些事务，既不需要耗费太多的精力，又必需集中一定的精力，还能够给我一个很明显的正反馈，甚至会直接产生灵感，脑子就转起来了。\n\n我们可以做状态练习。也有三个版本\n\n最简单的做法是：\n先放松深呼吸，想像自己正在做一件自己最喜欢的事，体会给你带来的美妙感受，然后带着这个非常棒的状态，去投入工作。\n\n进阶版的做法是：\n先放松深呼吸，放松后去想象，想像这项工作已经完成后的情形，比如说升职加薪，或者视频爆了，存款增加了等等，体会你的感受。然后带着这个非常棒的状态，去投入工作。\n\n高阶版的做法，是在第二种做法上再加点料的
    WOOP 模型，做法是：\n\n先放松深呼吸……\nW：想象。\n想象这个事情虽然有些棘手，但你觉得能够达成。这个度要把握好，别选你一定做不成的，这方法并不能点石成金。\nO：结果。\n想像这项工作已经完成后你的样子，你对此有什么感受？比如升职加薪，获得肯定\nO：障碍。\n\n思考你自身的阻力是什么？它是真实的吗？找到那个妨碍你完成目标的最严重的、内心的障碍。\n可能是很普遍的“累”、“紧张”，也可能是某种行为、情绪、观念、冲动、恶习等。\n\n这里有个坑，有的人会在此时联想起
    O 的其他坏事，或者干脆进入到了反思状态，然后就无法继续了。\n此刻，先接受自己的情绪，不要推开他：不要我不该 XXX，而是此刻我就是 XXX 了。这个非常重要。\n情绪的奇妙之处在于一旦觉察就被打断。回忆一下，在你忘情的时候，是什么让你停下来的，是你突然意识到自己的忘情。\n\nP：计划。\n要克服或规避这个障碍的话，你能怎么做？\n想出最有效的想法和行动，将其牢记于心\n然后想一想这个障碍，下次将在何时何地出现。\n\n接着制订一个“如果……那么……”计划：“如果障碍
    X 出现了，那么我就采取行动 Y。”\n然后将这个计划重复一遍给自己听。\n\n比如说，你不想写稿子，想刷手机，那就告诉自己：\n如果我在沙发上躺着刷手机
    10 分钟了，我就放下手机，从沙发上起来，移步坐到电脑前，打开 WORD 写稿子。\n\n这里有一个比较容易犯的错误，举个例子：\n一个律师想在法庭上表现得更加自信，他的
    “如果……那么……” 计划是 “如果我能提高嗓门反驳对方律师，那么我就能打赢官司” 。这是个错误示范。\n\n正确的计划应该是 “如果在对方律师反驳我时我觉得不安，那么我就提醒自己——我的本事一点都不比她差”
    。\n\n记住，你要制定的计划取决于你的“障碍”，你需要采取以目标为导向的某种行动。\n\n大家可以发现，WOOP 模型是要事第一的一种实现方式。不仅可以针对当下，还可以制定周、月度、季度、年度的计划，\n所以，它不仅能帮你提高工作的完成度，还能帮你减轻
    “吃着碗里的想着锅里的” 纠结内耗式焦虑。\n\n不论哪种状态练习，本质上是一种冥想，所以一定要扎实地静下心，认真做，别想匆忙结束敷衍了事，一定要想好、想透，要不然想完了还没干劲就不对。\n\n时间越紧张，状态练习越要认真，此时“浪费”的时间，完全可以通过工作效率的提升抢救回来。\n\n静心的标准是“虚心实腹”，大白话是“把心放肚子里”。现代人不会放松的情况很常见。我自己是通过站桩和呼吸训练学会的，在此我分享一个起势动作。\n\n动作的要点。1、深吸一口气。2、憋气。3、把憋住的气送到腹部，感受”把心放肚子里“。再从腹部送回胸腔，感受“把心提嗓子眼儿”。一口憋住的气能做四五个来回。4，重复上述动作，直至“把心放肚子里”感受特别明显就停止\n\n今后再感受到“心提在嗓子眼儿”的时候，就可以通过这个动作快速地“把心放肚子里”。\n\n复盘的角度有很多种。从时间管理的角度，复盘有三个要点：\n\n第一，复盘计划是否周密。动作有没有被严格地执行，如果没有，是什么事儿妨碍了你，它为什么能打断你？\n第二，复盘时间衡量能力。检查在工作过程中自己预测并实地测量、对比时间的结果如何，发现自己的误区。\n第三，复盘要事第一原则。虽然在计划的时候已经注意这个事项了，复盘时好多人还是会跑偏。如果有了新的想法，既不要着急马上解决，也先不着急调整计划，一定要想想和你的任务结果有多少必然的关系再下手。\n\n比如说拍一个视频，突然之间你觉得这个背景下可能穿一个红色的衣服会更好看，然后你就开始选，是红外套呢，还是红衬衫，还是红
    T 恤衫，是冷色还是暖色，深红还是浅红，面料是要针织那种细腻，那还真丝那种光泽，还是亚麻那种肌理，最近的商场有没有，预算够不够，花了很长时间很多精力，工作遭受到了巨大的延宕，后果不可控。\n\n最后你发现，其实有好几个方案不用去在红衣服上折腾，比如换个背景，或者干脆放弃视频，甚至搞个图文更快更有效。\n\n总结：\n我们每个人都是一台被写好程序的机器，外界按几个键我们就会按照程序反应。\n掌控人生，首先要知道自己是怎么反应的，然后改写内置程序。\n\n*
    * *\n\n评论区：\n\n小七 : 很走心的分享[玫瑰]，中间看着看着是越来越有熟悉感，直到出现冥想 2 个字哈哈。视觉化想象，呼吸控制，都是很有效的觉知训练意识。被你这么跟时间管理联起来梳理，很棒的输出\n叶叶
    _ 优势教练 : 这个时间管理真得拆解很细致，真的是底层逻辑，学到了！\n\n![](img/1c37d505930596d12a88ab23e11aa07a.png)\n\n*
    * *"'
- role: tool
  tool_call_id: call_0ly6zc8znxbs8ps39rrmt9wl
  content: '"# 找准个人优势，创造自己的赚钱之路\n\n> 原文：[`www.yuque.com/for_lazy/thfiu8/slm2usv03y35fcx5`](https://www.yuque.com/for_lazy/thfiu8/slm2usv03y35fcx5)\n\n##
    (36 赞)找准个人优势，创造自己的赚钱之路\n\n作者： 苏姐 职场优势教练\n\n日期：2023-10-31\n\n各位生财圈友、个人优势航海的伙伴们，大家好！非常开心这次能担任生财的个人优势航海教练。\n\n我是苏姐，坐标北京，北大毕业的优势教练导师，优势动力学院创始人。曾在外资、国企、民营上市公司做过十多年人力管理工作。2018
    年辞职开始做自由职业，2020 年正式创业，创办了优势动力。作为个人 IP 创业者，3 年实现 400 万+营收，在家办公、没有全职员工，年营收稳定过百万。\n\n当看过
    1000+份优势报告、做了一对一解读，长期陪伴辅导数百人后，我最大的感触是：升起了悲悯之心和使命感（关联才干 11）。\n\n我无数次感慨，如果他们能掌握优势解读咨询这个能力，可以在人生道路上少走很多弯路。\n\n今天我就想带大家看看，“生财”、“赚钱”这条人生道路上，优势才干可以怎样发挥作用。\n\n说到“生财”、“赚钱”，大家认为想要获得成功，最重要的是什么？\n\n我认为，是“定位”。\n\n很多人没有意识到，“赚钱”和“提供价值”，两者是可以划等号的。而你只能靠做你擅长的事情，去提供价值。也就是说，你的优势，决定了你在事业、社会、团队中的位置，以及你在其中能提供的价值，进而决定你能否赚钱。这就是“定位”。\n\n而发掘自我优势，只能是你自己的责任，这条路需要
    100%的自我负责，是一条英雄之路、勇敢者的游戏。\n\n那如何发掘自我优势，做好定位呢？\n\n我做过上千个 1 对 1 咨询，发现很多人在副业/创业时，有个执念：必须找到正确的定位，再开始行动，那这个结果就是：可能你终生都停留在“想”和“找”的阶段。\n\n实际上，定位不是找到的，是实践（试错）出来的。\n\n我在公开课中，展示过一张基于优势的定位图，一个人有这里的
    2~4 项，都是有可能的，大家可以凭直觉，加上对自己才干的理解，选一下自己已经具备/可能发展出来的优势定位，是哪几个。\n![](img/7910d2161f5bdb46e4bd71ca89550923.png)\n\n我个人自评的话，按照上面图片的分类，我在创业早期是
    1+4；现在是 1+4+6+7。而 2、3、5，从来不是我擅长的，我是通过与他人合作，优势互补来实现。\n\n无论你是做小红书，还是知乎好物，是平台主播，还是短视频教学，这都是表象。真正成就你的，是你在这些项目里、赛道上，贡献的那份独特的价值。\n\n比如，你可以用这个表格来梳理一下自己（下表以我个人为例）：\n赛道不是一成不变。如果你在一个赛道，通过学习实践，挖掘发展出个人优势，把它做成。这个过程打造出了清晰的个人优势和才干，将会成为你的核心竞争力。迁移到其他赛道，也更有可能成功。\n\n这样，你才能立于不败之地。\n\n具体如何在实践中挖掘呢？\n\n任何一个能赚钱、且能持续赚钱的项目、赛道，一定是有闭环的，需要产品、渠道、流量、成交、交付。\n\n你可以从思考如下这些问题开始：\n你在什么环节最能提供价值，怎么提供？是什么价值？这个价值和最终商业变现，它的关系是什么？你在提供这些价值时，如何保证自己比他人更优秀？\n\n当你看清楚这个链条，就全力以赴去提供这些价值，不会、不懂的就付费去学习、去咨询、去请教那些有结果的、专业的人。\n\n在这个过程中，\n\n我学员中有一位大关系建立的保险经纪人、财富规划师，李晨总。\n![](img/8d0a0d8f6e8e4263e204109fd99803ca.png)\n\n他原先做基金经理，都在用自己的短板，拼不过那些高学历、高智商的同事们，天天内耗。\n\n转型做保险经纪人之后，学会用自己的关系建立才干，特别是“个别”、“关联”，配合“责任”“回顾”等，深度维护老客户关系，根据每个客户不同，提供不同比例的专业+情绪价值，成为客户的朋友，成为了特定圈子里的红人。\n\n他从不做公域引流，但因为用对了自己的优势才干，精准有效地链接资源、稳定推进成交，他的客户关系都非常紧密，而且会主动帮他转介绍。\n\n他转型保险经纪人第一年就获得了
    50w 的收入、且工作强度并不高、还非常自洽舒适。\n![](img/a0ff36b9cd29903eef6879168943b871.png)\n\n![](img/aeeb54e2a359b8773b6b1c74d0ab415d.png)\n\n再举个我自己的例子。\n\n我是战略思维+执行力才干的布局，我天然擅长做产品、搭框架、学习内化、从本质上分析、高纬度认知、专业内容，却不喜推广、不爱大量交谈。那么我的定位，就是导师、教练。\n\n可是做事业，必然涉及宣传推广、做流量、做成交等。\n\n我用了
    2 个方法，第一是找优势互补的合作者，第二是快速学会技能、然后赋能团队，或者外包。\n\n我的事业好伙伴、闺蜜，生财红人梁靠谱，是大影响力（取悦、沟通、统率）+执行力才干，还有关系建立里的个别。她总能帮我运营社群，用大影响力在各种场合帮我宣传、推动成交。\n\n我的团队目前
    10 人左右，助教团队 leader 波波是影响力+战略思维的才干布局。而我们团队的大总管张妍，则是超级温暖的大关系建立。她们在我和数百名学员的关系中，补足了“影响他人、感性关怀”的那部分价值。\n\n而快速学会技能，是指在创业中必然需要具备的大大小小的技能。\n\n这里，就要做个区分，你真正喜欢做的、擅长的是什么，它是不是一个核心能力，还是仅仅是一个普通技能？\n\n普通技能，比如社群运营、海报制作、视频剪辑。如果你不擅长，就外包。没钱外包，就先自己做，等有钱了再外包。\n而核心稀缺技能，一定要自己掌握，比如咨询、流量、成交、内容（不管是做知识付费，还是实体产品，都需要这些能力）。即使自己不喜欢不擅长，至少也要能做。\n\n更重要的是，当我掌握后，我就可以辅导别人来做（教练辅导他人的能力，恰恰是我擅长的）。我现在团队里的销冠们，有
    1、2 位比我自己的成交能力更强，因为他们天然擅长这件事。\n\n这样，通过合作、外包，节省时间精力，发挥自己所长。\n\n发挥优势，生财有术，考验的是做选择、做取舍的能力。集中兵力，用你的优势，着力击穿一点、创造出成就事件。\n\n当你找到了自己在一个项目/事业中的精准定位，能贡献相应的价值，拿到相应的成果，成为团队中不可或缺的成员，或建立自己的团队，这个时候，就是：极致简单+有效重复。\n\n比如我，愿望就是把现在优势动力的旗舰产品，持续卖上
    10 年、20 年，可以迭代产品（完美才干）、辅导团队（交往才干），而不是每年做 3 个新产品。\n\n清晰带来成功，认清自己是谁，这是生财的第一步，然后才是赚钱的技能。\n\n有些人，有自己做产品的执念（特别是知识付费领域的老师、咨询师、教练们），但其实，市场上不缺好产品，而是缺能把产品卖好的人。后者是普通人逆袭的正确打开方式，也更是放在哪里都值钱的核心竞争力。\n\n不管你从事什么项目，有一项能力是必备的，那就是销售成交能力。\n\n不管你写文案/文章、拍视频、写图文、做咨询、做直播、做社群、分享/讲课、发圈……这些环节，有的你会喜欢、擅长，但如果你无法导向成交，这些优势与结果不能有强挂钩，那也无法带来价值变现。\n\n不同才干类型的人，在销售成交方面呈现的状态、节奏、卡点、方式，是完全不同的。\n\n战略思维领域才干突出的人，销售方面通常不积极推动、比较佛系，因为本来思考问题、学习、理解事物，对他们就足够满足才干了（我原先是这样的，再加上完美才干，行动力方面还是很卡的）。而战略思维才干的人，如果对自己所销售的产品有深度的洞察、认同，加上足够的专业知识经验积累，可以在帮客户提供有洞察力的解决方案、表述解决方案的专业性方面，展现自己的优势。\n\n比如，我见过一个“备孕咨询师”的个人介绍，她提到的不仅仅是自己的这个专业服务带给对方的功能价值，还有对这项工作的深层次解读：生命的传承者，让家庭更圆满。这如果不是她想出来的，就一定有深刻洞察力的人帮她总结的。有深刻而独特的认知，是战略思维才干的人，非常容易打动客户的地方。\n\n这也决定了，战略思维才干靠前的人，选择的产品、商业模式，一定是要有专业度的。比如卖一个复杂的咨询方案，就比卖日用品、做个二手中介，要更适合他们。\n\n影响力才干突出的人，适合推动影响他人。由于天然具有一定的“攻击性”，其实是传统意义上做销售非常好用的才干类型。他们适合成为价值中心，流量分发者：手握流量、兴风作浪。一对多，是他们的主场。比如演讲、直播、社群运营……但是，大影响力才干的人，如果不自知、发挥过度，特别容易给人带来强势、压迫的感觉，会被讨厌，可能几句话就得罪人，更不要提建立信任和成交了。\n\n对大影响力来说，还有很致命的一点，就是“眼高手低”，往往求速成，一旦求而不得，自我怀疑、反噬严重。有赚一个亿的野心，却只有等一天的耐心。而在一个新领域，即使是大影响力，也需要时间积累知识技能，否则不可能光靠一张能说会道的嘴（如果有沟通才干，虽然这嘴确实好用），就真的让人信服而产生购买。\n\n影响力才干里，比较软的，像取悦、沟通；比较硬的，有统率、竞争；其他偏中间一些。所以影响力才干的伙伴，有偏软的部分，避免看上去讨好；偏硬的部分，避免看上去强势。这都是你很重要的功课。\n\n关系建立才干突出的人，适合润物细无声式的的成交，虽然不像取悦才干容易和陌生人破冰，但是关系建立才干非常细腻，如果用得好，可以给客户提供很全面的情绪价值，甚至成为多年的朋友。人说到底都是感性的动物，特别是在购买决策时。关系建立的伙伴，如果能提供这部分的价值，那么老客户复购、转介绍方面，简直无往不利。\n\n但关系建立才干的伙伴，和影响力正相反，属于容易“妄自菲薄”的类型，自己明明有
    8、9 分能力，非要说成 4、5 分，又特别在意他人的看法（和谐、体谅、适应的过度发挥，很容易内耗），有话不直说、自己也羞于展示价值（可能压根觉得，没啥可展示的），造成错失很多销售机会。\n\n执行力才干突出的人，适合“非常靠谱、使命必达、步骤详细”的成交。也就是那句比金子还珍贵的“你永远不会让我失望”。有些人觉得踏实勤奋负责任，算不上什么优势，但现实中，只要做到“事事有响应，件件有着落”，在任何地方都吃不了亏。\n\n比如成就、专注才干，那么你目标感强，持续跟进客户、持续触达；如果你有排难才干，帮助客户解决问题、想对方所想、急对方所急；纪律才干，可以把对方使用这个产品的步骤、SOP
    都梳理好，交给对方……\n\n执行力才干突出的人，给人老黄牛的印象，容易没有存在感，不妨学会复盘自己做事的过程，展示出去，这也是非常好的个人口碑。\n\n以上只是一个简单的分类，具体如何达成销售，跟每个人的具体才干分布、人生阶段、职业背景、资源和认知，都有关系，所以无法一言以蔽之，只能靠更多的体会、学习和成长。\n\n每个人都是独特的，世上没有两片相同的树叶。属于每个人的花期不同，但只要你愿意投入，各有各的精彩。盖洛普就是你的个人使用说明书，帮你打开通往新世界大门的那把钥匙。\n\n从生财的角度，你要学会用自身优势，找到自己在一个项目/赛道/事业里的位置，拼命去提供价值，打造核心竞争力。在实践层面，最重要的是销售成交。那你可以找到自己影响世界、触达他人、销售产品的方式，站着赚钱、内外平和，就是最美妙的事了。\n\n祝福大家的优势绽放、生财有术！\n\n*
    * *\n\n评论区：\n\n伊骞 : 苏姐 yyds！\n\n![](img/1c37d505930596d12a88ab23e11aa07a.png)\n\n*
    * *"'
