      arguments: '{"paper_name": "20231107_08 内容输出力", "paper": "为什么说内容输出力是个超能力，如何培育持续的内容输出力？作者唐夕。核心论点：内容输出力是跨越时空建立信任、链接贵人的超能力，尤其是无限的内容输出力。底层逻辑：你为什么会尊敬、敬佩、信任一个人，尤其是没见过的人？因为这个人通过语言带来了启迪，引发情感、思考、改变行为。历史长河里苏轼、曾国藩、孔子等先贤，若没有写作留存思想，我们不会记得他们。掌握内容输出力，能快速有效地获得对方尊重和信任。每一个对外输出的人建立的组织，尤其是社群，实际都是小型宗教，凝聚力很强。只要有1000个铁杆粉丝信任你就足够，甚至100个足矣。层次比你高的人看过你的内容产生认同，愿意推荐就是超级节点，有指数增长机会。培育方法：1)打通阅读-思考-输出整个系统，先从小微闭环开始（每天读书10分钟，有意识思考找启发点，读完至少输出100字）；2)输入有三个方面：个人经历（最好的素材、最打动人心的）、多读书多链接人、多提问多收集好问题加以回答输出。真正好的内容是能打开人内心的保险箱，最好的秘诀是创造内容之人的真实与真诚。内容输出力越早培育越好，凡有积累的事情早一天就是优势优势就是绝对的核心竞争力。当做长期的事、终身的日课去做。"}'
