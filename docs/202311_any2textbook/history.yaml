    \ \"no\": 10,\n      \"name\": \"盖洛普才干四分类 —— 认识优势的「四维地图」\",\n      \"points\"\
    : [\n        \"**为什么需要这个概念？**\",\n        \"- 要「找准个人优势」先要有一个科学的框架来识别和分类优势\",\n\
    \        \"- 大多数人对自己的优势描述模糊（如「我比较细心」「我善于沟通」），缺少系统化认知\",\n        \"- 盖洛普四分类提供了一个标准化的优势认知框架，帮助人们快速定位自己的才干类型\"\
    ,\n        \"**核心定义**\",\n        \"- 盖洛普才干四分类将人的优势才干划分为四大类：战略思维（善于分析、统筹规划）、影响力（善于表达、感染他人）、关系建立（善于连接、凝聚团队）、执行力（善于推动、落地执行）\"\
    ,\n        \"**关键性质**\",\n        \"- 独立性：四大类才干相互独立，每个人在不同类别上有不同的强弱分布\",\n   \
    \     \"- 组合性：绝大多数人的优势是跨类别的组合，而非单一类别\",\n        \"- 识别导向：四分类的作用是「识别」而非「评判」——没有哪类更好，只有是否适合\"\
    ,\n        \"**典型例子**\",\n        \"- 一个创业者可能是「战略思维（统筹规划）＋影响力（说服投资人）＋执行力（推动落地）」的组合，而一个优秀的工程师可能是「战略思维（分析）+执行力（解决问题）」的组合\"\
    ,\n        \"**边界条件**\",\n        \"- 盖洛普四分类是识别优势的参考框架而非绝对标准，不同人的优势表现可能超出四分类的框架\"\
    ,\n        \"- 测试结果只是起点，真正的优势需要在实践中被验证，不能仅凭测试结果就给自己贴标签\"\n      ],\n      \"sources\"\
