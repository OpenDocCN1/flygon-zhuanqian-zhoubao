      arguments: '{"append": true, "fname": "教科书.md", "text": "\n---\n\n# 第四单元 输出倒逼输入：让成长被看见\n\n>
        本单元打通「读 → 写」的关键链路，让输入真正转化为可积累的输出。核心素材：读书笔记六法（20231128_05）、内容输出力（20231107_08）。\n\n##
        学习目标\n\n读完本单元，你将能够：\n1. 理解「读书最重要的在于思考，笔记是思考的体现」；\n2. 掌握读书笔记六法，把一本书读成多篇文章；\n3.
        理解「一本书可产出 N 篇文章」的杠杆效应；\n4. 将本单元与第一单元的内容输出力（小微闭环）打通，形成完整的输入-输出链路。\n\n## 第 6
        章 带着「目的」读书，一本书长出 N 篇文章\n\n### 6.1 打破「读完」的执念（认知）\n\n很多人读书追求「读完」和「读得够多」，误把阅读数量当作学习成果，结果读了很多书却毫无成长。素材作者一针见血地指出：\n\n>
        读书最重要的在于思考，**笔记是思考的体现**。【src=20231128_05】\n\n单纯读完一本书而不思考，知识无法内化。而思考的最佳载体，就是笔记——当你在书上划线、在笔记中写下感想时，本质是在「与作者对话、与自己对话」。\n\n###
        6.2 读书笔记六法（方法）\n\n素材提出一套以「产出文章」为导向的读书笔记方法论，共六个技法：\n\n| 技法 | 做法 | 产出指向 |\n|---|---|---|\n|
        **1 目的导向** | 读书时标注「这段可作为开头」「这句可引用」 | 直接为文章搭建骨架 |\n| **2 新媒体思维** | 写前想清文章用途，有领域意识，用「是什么-为什么-怎么办」拆解书的结构
        | 一套观点可换多个领域表达 |\n| **3 场景故事** | 举一反三，把书中观点结合生活场景迁移到自己领域 | 观点具象化为可叙事素材 |\n|
        **4 总结拓展** | 以作者总结果为基点，总分总地消化、关联身边例子 | 把结论写成完整故事 |\n| **5 观点翻译** | 将书中观点用自己语言重新翻译，可作文章小标题
        | 形成个人化表达 |\n| **6 例子替换** | 把书中的例子替换成本国/身边例子，逻辑不变 | 快速扩写出一篇文章 |\n\n【src=20231128_05，方法提炼】\n\n###
        6.3 六个技法的组合拳（示例）\n\n素材作者以读《终身成长》为例展示了六法如何组合发力：\n- 用「目的导向」标注书中的段落可作为文章开头、某句话可作为金句引用；\n-
        用「新媒体思维」判断这本书能出育儿、职场、情感几个领域的选题，为投稿做准备；\n- 用「场景故事」从「小孩子是 3 岁看老」这句老家俗语切入，结合成长型思维写一篇育儿观点文；\n-
        用「例子替换」把书中《太空英雄》的例子替换成《中国机长》刘机长，写一篇航空主题的深度文。【src=20231128_05】\n\n### 6.4 框架触发快速成文法（方法）\n\n六法有一个共同的核心前提：**不必读完一整本书**。当笔记积累到足以形成一篇文章的框架时，立即开始写作。作者常是「看书看到一半，有思路了就先写一篇文章，写完再接着看」。【src=20231128_05】\n\n这就带来了强大的杠杆效应：**一本书可以产出
        N 篇文章**——通过不同角度深度挖掘，同一本书能支撑多篇内容的产出（「一鱼多吃」）。【src=20231128_05】\n\n> 注意：不是所有书都值得产出
        N 篇，只有信息密度高、观点丰富的书才具备这种潜力。且「产出 N 篇」的前提是真正进行了多角度的深度思考。\n\n### 6.5 与内容输出力闭环打通\n\n把本单元与第一单元的内容输出力连接起来，就形成完整的成长闭环：\n\n```\n  读书（输入）→
        思考（六法笔记）→ 输出（文章/内容）\n      ↑                                    │\n      └─────
        小微闭环（每天读10分钟+输出100字）←────┘\n```\n\n第一单元的「小微闭环」解决了「每天坚持做」（习惯），本单元的「六法」解决了「怎么做才高效、能产出」（方法）。两者结合，成长就「被看见」、可积累。【原创整合】\n\n##
