    \  ],\n  \"units\": [\n    {\n      \"no\": 1,\n      \"name\": \"道歉的七难 —— 为什么说「对不起」这么难开口\"\
    ,\n      \"points\": [\n        \"**为什么需要这个概念？**\",\n        \"- 道歉是最常见却也最艰难的人际沟通场景，几乎人人都经历过「话到嘴边却说不出口」的窘境\"\
    ,\n        \"- 如果不理解道歉难的心理根源，就无法设计出有效的道歉方法\",\n        \"- 只有先弄清「难在哪里」，才能对症下药破解道歉的心理障碍\"\
    ,\n        \"**核心定义**\",\n        \"- 道歉的七难指：损失担忧（怕认错有损失）、不想承认（不愿承认自己错了）、面子问题、恐惧惩罚、关系不确定性、自我形象维护、情绪对抗等七个心理障碍\"\
    ,\n        \"- 这七难本质上是「自我保护机制」在阻碍真诚道歉\",\n        \"**关键性质**\",\n        \"- 普遍性：七难几乎人人都会经历，是普遍心理现象\"\
    ,\n        \"- 叠加性：一次道歉可能同时触发多个心理障碍，难度成倍增加\",\n        \"- 可破解性：七难虽难，但可以通过认知转变和方法训练逐一克服\"\
    ,\n        \"**典型例子**\",\n        \"- 职场中因为自己的失误导致项目延期，明知道是自己的错，却因为「怕被上级责罚」「怕影响绩效考核」而迟迟不敢承认\"\
    ,\n        \"**边界条件**\",\n        \"- 七难适用于绝大多数人际冲突场景，但在极端情况（如涉及法律纠纷、人身安全）下，道歉需要专业的法律意见，不能单纯依赖心理层面的突破\"\
    ,\n        \"- 并非所有道歉都需要先克服七难——在关系亲密、信任基础牢固的情况下，道歉可能并不「难」\"\n      ],\n      \"\
