  content: "{\n  \"paper\": \"20231107_64 时间管理五星功夫\",\n  \"desc\": \"该素材提出了一套名为“五星功夫”的个人时间管理方法论，由作者康妮姐基于20年经验总结，包含衡量时间、要事第一、周密计划、保持状态、有效复盘五个核心要点，并强调了从底层思维（内省、改变反应模式）到具体操作（计时、公式评估、MVP验证、WOOP模型）的完整体系。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"衡量时间\",\n      \"desc\": \"一种体内自带计时器的能力，能准确预估时间，不受事务重要性影响而产生情绪化的时间判断（既不因重要而拒绝，也不因不重要而随意开始）。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"衡量时间不是数秒，而是体内随时自带计时器，能准确预估时间、不会因为重要事觉得费时就拒绝、不会因为不重要事觉得就一会儿就随意开始。\"\
    \n      ]\n    },\n    {\n      \"name\": \"要事第一\",\n      \"desc\": \"永远把重要的事优先，需要拉长周期（周计划、月计划、年计划、人生计划）来审视当前事务的定位。\"\
    ,\n      \"is_original\": false,\n      \"excerpt\": [\n        \"要事第一就是永远把重要的事优先，需要拉长周期把现在的事嵌到周计划月计划年计划人生计划思考。\"\
    \n      ]\n    },\n    {\n      \"name\": \"周密计划\",\n      \"desc\": \"以现在为起点、以截止日前两天为终点，预估每个动作（含备选方案plan\
    \ B）的时长，并通过小规模验证（MVP）逐步推进的计划方法。\",\n      \"is_original\": false,\n      \"excerpt\"\
    : [\n        \"起点是现在，终点是deadline前两天；预估每个动作包括plan B；预估动作时长；做MVP先校验跑通不铺开太大（制造业小试中试试生产量产）；根据MVP调整；确定涉及的人和物。\"\
    \n      ]\n    },\n    {\n      \"name\": \"保持状态\",\n      \"desc\": \"把当下精力、体力、情绪的综合集合视为可管理对象，通过找到临界点和状态练习（想象、WOOP模型）主动调节。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"状态是当下所有精力体力情绪的集合。找到自己的临界点。可做状态练习（初级：想象最喜欢的事；进阶：想象工作已完成；高阶：WOOP模型——愿望W、结果O、障碍O、计划P，制定'如果…那么…'计划）。\"\
    \n      ]\n    },\n    {\n      \"name\": \"有效复盘\",\n      \"desc\": \"对时间管理过程进行系统性回顾，从计划周密性、时间衡量能力和要事第一原则三个维度进行检验。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"有效复盘三要点：复盘计划是否周密、复盘时间衡量能力、复盘要事第一原则。\"\
    \n      ]\n    },\n    {\n      \"name\": \"人生程序改写\",\n      \"desc\": \"将人比作被写好程序的机器，时间管理的关键在于觉察自身反应模式并改写内置程序。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"我们每个人都是一台被写好程序的机器，掌控人生首先要知道自己是怎么反应的，然后改写内置程序。\"\
    \n      ]\n    }\n  ],\n  \"methods\": [\n    {\n      \"name\": \"__overview__\"\
    ,\n      \"desc\": \"基于内省与系统性流程五步迭代，通过衡量—排序—计划—状态管理—复盘形成闭环，核心在于先改变认知（反应程序）再执行操作。\"\
    ,\n      \"excerpt\": [\n        \"评分体系：用收益、成本、风险公式衡量所有任务。\",\n        \"计划闭环：起点（现在）→\
    \ 终点（截止日前两天）→ 预估动作与plan B → 确定时长 → MVP小规模验证 → 反馈调整 → 确定人事。\",\n        \"状态调节：初阶想象愉快；进阶想象完成；高阶WOOP（愿望、结果、障碍、计划）+“如果…那么…”实施提示。\"\
    \n      ]\n    },\n    {\n      \"name\": \"时间衡量训练法\",\n      \"desc\": \"通过摒弃情绪、无分别心地对待每件事，并有意识地练习预测、感觉、测量、复盘时间的四步训练。\"\
    ,\n      \"excerpt\": [\n        \"衡量时间的训练：摒弃情绪用无区别的心对待每件事；有意尝试预测、感觉、测量、复盘时间。\"\
    \n      ]\n    },\n    {\n      \"name\": \"收益成本风险评估法\",\n      \"desc\": \"用收益、成本、风险三个维度对所有待办事项进行量化评估，辅助要事第一的决策。\"\
    ,\n      \"excerpt\": [\n        \"要做的所有事情可以用收益、成本、风险公式衡量。\"\n      ]\n    },\n\
    \    {\n      \"name\": \"MVP验证法\",\n      \"desc\": \"借鉴制造业小试—中试—试生产—量产流程，先在最小可行规模上跑通流程并据此调整，再全面铺开。\"\
    ,\n      \"excerpt\": [\n        \"做MVP先校验跑通不铺开太大（制造业小试中试试生产量产）；根据MVP调整。\"\n \
    \     ]\n    },\n    {\n      \"name\": \"WOOP状态调节法\",\n      \"desc\": \"高阶状态管理练习，通过明确愿望、想象结果、识别障碍、制定计划四个步骤，并配以“如果…那么…”的实施意向来保持状态。\"\
    ,\n      \"excerpt\": [\n        \"高阶：WOOP模型——愿望W、结果O、障碍O、计划P，制定'如果…那么…'计划。\"\n\
    \      ]\n    }\n  ],\n  \"theorems\": [\n    {\n      \"name\": \"衡量是增长的前提（德鲁克引用）\"\
    ,\n      \"desc\": \"无法衡量的东西就无法实现增长，因此时间管理的首要环节是建立对时间的精确感知。\",\n      \"excerpt\"\
    : [\n        \"德鲁克说：一样东西如果你不能衡量它，你就不能增长它。要增长时间首先要衡量时间。\"\n      ]\n    },\n  \
    \  {\n      \"name\": \"五星体系完备性主张\",\n      \"desc\": \"将时间管理归结为五个相互支撑的维度（衡量、排序、计划、状态、复盘），缺一不可，构成从认知到行动到反馈的完整闭环。\"\
    ,\n      \"excerpt\": [\n        \"20年经验提出的'五星功夫'时间管理方法：衡量时间、要事第一、周密计划、保持状态、有效复盘五个要点。\"\
    \n      ]\n    },\n    {\n      \"name\": \"掌控人生即改写程序\",\n      \"desc\": \"人的行为如同预设程序的机器，掌控人生的关键是先觉知自身反应模式，再主动改写内置程序。\"\
    ,\n      \"excerpt\": [\n        \"我们每个人都是一台被写好程序的机器，掌控人生首先要知道自己是怎么反应的，然后改写内置程序。\"\
    \n      ]\n    }\n  ],\n  \"findings\": [\n    {\n      \"name\": \"情绪导致时间误判\"\
    ,\n      \"desc\": \"[claim] 作者宣称，人们对事务重要性的情绪判断会造成时间感知失真，导致对重要事务轻易拒绝或对次要事务随意开始。\"\
    ,\n      \"excerpt\": [\n        \"不会因为重要事觉得费时就拒绝、不会因为不重要事觉得就一会儿就随意开始。\"\n   \
    \   ]\n    },\n    {\n      \"name\": \"拉长周期提升排序质量\",\n      \"desc\": \"[claim]\
    \ 作者主张，只有把当前事务嵌入更高层次的时间周期（周/月/年/人生计划）中，才能真正落实“要事第一”。\",\n      \"excerpt\": [\n\
    \        \"要事第一就是永远把重要的事优先，需要拉长周期把现在的事嵌到周计划月计划年计划人生计划思考。\"\n      ]\n    },\n\
    \    {\n      \"name\": \"截止日前移降低风险\",\n      \"desc\": \"[claim] 作者宣称将计划终点设为截止日前两天，可预留缓冲，提升计划稳健性。\"\
    ,\n      \"excerpt\": [\n        \"起点是现在，终点是deadline前两天。\"\n      ]\n    },\n\
    \    {\n      \"name\": \"状态的可练习性\",\n      \"desc\": \"[claim] 作者主张状态可通过分级练习（想象愉快→想象完成→WOOP）系统提升，实现从被动受影响转向主动调节。\"\
    ,\n      \"excerpt\": [\n        \"可做状态练习（初级：想象最喜欢的事；进阶：想象工作已完成；高阶：WOOP模型）。\"\n\
    \      ]\n    }\n  ]\n}"
