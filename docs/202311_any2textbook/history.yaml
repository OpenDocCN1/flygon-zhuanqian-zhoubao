    \        \"- 这五个维度构成了一个完整的时间管理循环：先知道时间去哪了（衡量），再决定做什么（要事），然后安排怎么做（计划），接着保证做得动（状态），最后看做得怎样（复盘）\"\
    ,\n        \"**关键性质**\",\n        \"- 系统性：五个维度环环相扣，构成完整闭环\",\n        \"- 通用性：适用于工作、学习、创业等各种场景\"\
