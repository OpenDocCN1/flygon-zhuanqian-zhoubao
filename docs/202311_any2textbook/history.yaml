    no\": 14,\n      \"name\": \"四步法 —— 解决问题的「总路线图」\",\n      \"points\": [\n    \
    \    \"**为什么需要这个概念？**\",\n        \"- 面对复杂问题时，如果没有系统化框架，容易陷入「头痛医头、脚痛医脚」的被动应对\"\
    ,\n        \"- 咨询行业在长期实践中沉淀出一套普适性的问题解决框架，但未经过方法论提炼很难直接借鉴\",\n        \"- 四步法将隐性的问题解决过程显性化、标准化，让每个人都能按路径解决问题\"\
    ,\n        \"**核心定义**\",\n        \"- 四步法指「界定问题→拆解问题→执行解决→总结复盘」四个阶段构成的完整问题解决路径\"\
    ,\n        \"- 界定问题：明确真正要解决的问题是什么；拆解问题：将大问题分解为可处理的小问题；执行解决：针对每个小问题制定并执行解决方案；总结复盘：回顾全过程，提炼经验教训\"\
    ,\n        \"**关键性质**\",\n        \"- 全过程覆盖：从「发现问题」到「沉淀经验」形成闭环\",\n        \"\
    - 结构清晰：每一步都有明确的目标和产出\",\n        \"- 普遍适用：从工作难题到生活决策都可以套用\",\n        \"**典型例子**\"\
    ,\n        \"- 公司业绩下滑（界定：是市场问题还是产品问题？）；拆解：将业绩拆解为流量、转化率、客单价三个维度分析；执行：针对最薄弱的环节制定改进方案；复盘：总结哪些措施有效、哪些无效，沉淀为下一次的策略参考\"\
    ,\n        \"**边界条件**\",\n        \"- 四步法是通用框架而非万能公式，执行过程中需要根据不同场景灵活调整每个步骤的深度（如简单问题可以跳过拆解直接执行）\"\
    ,\n        \"- 四步法的价值取决于执行质量——「总结复盘」做不好，整个闭环的迭代价值就会大打折扣\"\n      ],\n      \"\
    sources\": [\n        {\n          \"paper\": \"20231114_08 咨询方法论四步法\",\n    \
    \      \"role\": \"origin\"\n        }\n      ],\n      \"excerpts\": [\n    \
    \    \"界定问题/拆解问题/执行解决/总结复盘\",\n        \"界定拆解执行复盘\"\n      ]\n    },\n    {\n\
    \      \"no\": 15,\n      \"name\": \"方法论非线性 —— 跳着用的「路线图」才是好路线图\",\n      \"points\"\
    : [\n        \"**为什么需要这个概念？**\",\n        \"- 很多人学习了一套方法论后容易「死板套用」，以为必须严格按顺序走完每个步骤\"\
    ,\n        \"- 实际上，刻板遵循步骤会降低效率、增加不必要的工作量\",\n        \"- 「非线性原则」解放了方法论的执行方式，让工具为人服务而非人被工具束缚\"\
    ,\n        \"**核心定义**\",\n        \"- 方法论非线性原则指：四步法中的所有步骤都是可以跳跃的，不必严格遵循先后顺序\"\
    ,\n        \"- 当对某个领域足够熟悉时，可以直接跳过某些步骤（如熟悉的问题不需要重新界定）；当遇到意外情况时，可以随时回到前面的步骤重新调整\"\
    ,\n        \"**关键性质**\",\n        \"- 灵活性：步骤的执行顺序和深度完全适应具体情况\",\n        \"- 经验依赖：越熟悉的问题领域，越能灵活地跳跃步骤\"\
    ,\n        \"- 动态调整：执行过程中可以根据新发现随时回到前面的阶段\",\n        \"**典型例子**\",\n        \"\
    - 一位资深咨询顾问接到一个非常熟悉的行业项目，直接跳过「界定问题」阶段进入拆解阶段；在拆解过程中发现一个意料之外的问题，又回到界定阶段重新定义问题边界\"\
    ,\n        \"**边界条件**\",\n        \"- 非线性原则建立在「理解每个步骤本质」的基础上，新手在尚未掌握四步法的核心之前，仍应先完整走一遍流程积累经验\"\
    ,\n        \"- 非线性不代表「没有步骤」，即使是跳着用，每个被跳过的步骤仍然需要判断「为什么可以跳过」\"\n      ],\n     \
