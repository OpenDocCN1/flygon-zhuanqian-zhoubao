      arguments: '{"paper": "犯了错，道歉为什么就这么难？作者粥左罗。玩互联网的学会道歉是一门必修课，尤其做个人IP、自媒体、个人品牌。人生必须学会三样东西：求助，感谢，道歉。道歉最难。刘润老师年度演讲PPT事件引发的思考，刘润老师真诚致歉了（删评论、真人出镜拍道歉视频、素颜出镜）。道歉难的七个心理难点：难点一损失担忧不想承认；难点二不对等感受逆反心理（正确不会10倍放大，错误却被10倍放大）；难点三错误被放大越想越委屈；难点四下不来台了被绑架（被自己最初的道歉绑架）；难点五强给弱、高给低道歉不爽（老板领导父母很少道歉）；难点六被动道歉的对抗性和不爽（主动道歉相对容易，被动道歉有对抗性）；难点七越公开的道歉越不爽（公开道歉太羞耻）。如何道歉10条：1不间接不拐弯不找补，直接说明自己错误越具体越好；2说明接下来的行动和弥补方式；3不求原谅和理解只道歉，原谅权交给对方；4主动道歉不要等别人要求；5第一时间道歉否则下不来台；6道歉后反而轻松不道歉更累；7既然要道歉就彻底真诚真实否则不如不道歉；8学会示弱，姿势比动作更重要；9道歉不会造成更大损失反而是止损；10道歉最本质是完善自己。道歉的本质是完善自己，越公开越羞耻，主动具体不求原谅。给台阶下的人都是有大智慧的人。",
