    ,\n        \"**核心定义**\",\n        \"- 铁杆粉丝理论认为：只要有1000个铁杆粉丝（即深度信任你、愿意持续为你付费的人）就足以支撑一个人的事业\"\
    ,\n        \"- 在此基础上延伸出「超级节点」概念——内容输出者通过持续输出成为社交网络中的超级节点，跨越时空链接信任\",\n       \
    \ \"**关键性质**\",\n        \"- 以质取胜：信任的深度比粉丝的数量更重要\",\n        \"- 可验证性：1000个铁杆粉丝是一个可以被实际检验的目标\"\
