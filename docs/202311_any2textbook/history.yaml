    function:
      arguments: '{"paper": "滴答清单&日计划制定法，作者枕棠（985工科生，时间管理教练）。分享横向对比时间管理软件（滴答清单vs时光序），重点介绍滴答清单功能与日计划制定三步法。时间管理软件像屠龙宝刀。做日计划的巨大意义：1降低焦虑（所有事列出来确定下一步行为形成清晰可执行计划）；2让重要的事情变紧急（人类天性做紧急而非重要的事，给重要的事设deadline让它紧急起来）。人类天性就是去做紧急的事情而非重要的事情。让重要的事情变得紧急，即为重要的事情设置时间设ddl。制作日计划三步法（对应衣柜整理比喻）：1把脑袋里的事情都收集到清单里（清空大脑/收集箱）；2厘清这些事情下一步行动分门别类管理（4D工作法）；3从事情中挑选出部分列为日计划安排时间。清空大脑可随时随地做，整理收集箱一天一次。4D工作法（GTD）：Delay计划去做、Do
        it now立即去做、Do not do it尽量别做、Delegate授权去做。授权不是放权，要询问对方下一步交接时间。思考下一步行动要尽量详细，大任务拆解为小任务（减小阻力、方便碎片时间）。两个大坑：1清单只有事件维度，计划既有事件维度又有时间维度（不给事安排时间的不叫计划叫清单）；2新手做计划安排严丝合缝（一小时一任务半小时一任务），一旦没按预期进行全部推翻产生失控感和挫败感，应留足够自由度一小时两小时安排一任务，每天留出一两小时盈余时间。清空是为了更好的专注；自由是为了更好的落地；蓄能是为了更好的创造；计划是为了更好的前行。",
        "paper_name": "20231128_03 日计划制定法"}'
