    function:
      arguments: '{"paper_name": "20231107_66 找准个人优势", "paper": "找准个人优势，创造自己的赚钱之路，作者苏姐（北大毕业优势教练导师，3年400万+营收）。核心观点：\"赚钱\"与\"提供价值\"可以划等号，只能靠做擅长的事情提供价值，优势决定你在事业社会团队中的位置，进而决定能否赚钱，这就是\"定位\"。发掘自我优势只能是自己责任，100%自我负责。定位不是找到的，是实践（试错）出来的。不要终生停留在\"想\"和\"找\"阶段。任何能赚钱且持续赚钱的赛道一定是有闭环的项目，需要产品、渠道、流量、成交、交付。可思考在什么环节最能提供价值、如何保证比他人优秀。盖洛普才干分类：战略思维（擅长产品搭框架分析）、影响力（适合推动影响他人销售）、关系建立（适合润物细无声成交）、执行力（使命必达靠谱）。普通技能可外包（社群运营、海报、剪辑），核心稀缺技能必须自己掌握（咨询、流量、成交、内容）。集中兵力，用你的优势着力击穿一点创造成就事件。极致简单+有效重复。市场上不缺好产品，缺能把产品卖好的人。有一项能力是必备的：销售成交能力。清晰带来成功，认清自己是谁是生财第一步，然后才是赚钱技能。"}'
