- 第五单元需补写'如何综合运用前四单元'的整合方法论
- 每章末的'行动清单'（将原则转化为可执行步骤）
retain_principles: 优先保留：方法论体系完整、逻辑清晰、有明确行动指南的素材；保留原则是素材必须能直接支撑'个人成长闭环'这一核心命题，且内容深度达high标准。
steps:
- 第一步：将7篇筛选素材按新目录重新分拣，初步标注每篇素材对应章节、需补写的位置
- 第二步：先补写引言+结语，确立全书整体叙事与核心主张，作为各单元的写作锚点
- 第三步：按'第二单元→第四单元→第三单元'的顺序完成主体章节初稿，再回头写第一、五单元衔接内容
risks:
- 主题仍存在轻微分散风险，需在写作中时刻锚定'成长闭环'主线
- 部分素材理论性强、案例少，可能导致可读性不足，需补充真实场景案例
- 时效性过高的细节（如特定工具版本）可能让内容快速显旧，需在改写中弱化具体工具、强化原则
next_product: 一份完整的'个人成长方法论'小书初稿（booklet，5-8万字），包含各章节初稿与行动清单
default_output_file: 个人成长的系统开关_初稿.md
writing_approach: 以'方法论落地'为核心叙事，采用'原理篇+案例篇+行动篇'的单元结构；每章独立可读，同时通过引言与结语形成闭环；避免学术化表达，多用第一人称实操视角和对话式文风。
