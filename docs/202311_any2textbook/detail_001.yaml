learning_targets:
- 理解道歉的七个心理障碍，并能识别自己在道歉时面临的困难
- 掌握道歉十法，能运用主动道歉等原则修复人际关系
- 理解内容输出力的本质是跨越时空建立信任，掌握小微闭环的练习方法
- 理解铁杆粉丝理论的核心主张：少数深度信任即可支撑事业
- 掌握五星功夫时间管理的五个维度，并能应用体内计时器训练法提升时间感知
- 掌握日计划三步法与4D工作法，能将杂乱任务整理为可执行清单
- 理解定位、赚钱与提供价值之间的传导链路，能应用盖洛普四分类识别个人优势
- 掌握读书笔记六法，理解一本书可产出N篇文章的杠杆效应
- 掌握问题解决四步法与议题树，理解方法论的非线性原则
concept_map:
- 自我完善与信任链接
- ├── 道歉心理学
- │   ├── 道歉的七难（损失担忧、不想承认、面子、恐惧惩罚等）  —— 20231107_12
- │   │   ├── 本质：自我保护机制阻碍真诚道歉
- │   │   └── 性质：普遍性、叠加性、可破解性
- │   └── 道歉十法（主动道歉、真诚、具体、行动）            —— 20231107_12
- │       ├── 核心原则：主动道歉，不要等别人要求
- │       └── 性质：主动性、可操作性、系统性
- ├── 内容输出力
- │   ├── 小微闭环（每天读书10分钟输出100字）              —— 20231107_08
- │   │   ├── 核心：输入→思考→输出最小回路
- │   │   └── 性质：最小化、闭环性、可持续性
- │   └── 铁杆粉丝1000理论（超级节点）                     —— 20231107_08
- │       ├── 核心主张：少数深度信任足以支撑事业
- │       └── 杠杆效应：铁杆粉丝成为传播节点
- ├── 时间管理
- │   ├── 五星功夫（衡量、要事、计划、状态、复盘）          —— 20231107_64
- │   │   └── 构成完整时间管理循环
- │   ├── 体内计时器（预测→感觉→测量→复盘）               —— 20231107_64
- │   │   └── 核心原则：摒弃情绪，无区别心感知时间
- │   └── 日计划三步法与4D工作法（收集、4D整理、挑选）     —— 20231128_03
- │       └── 4D：Delay / Do it now / Do not do it / Delegate
- ├── 个人优势与定位
- │   ├── 定位（优势→位置→价值→赚钱）                     —— 20231107_66
- │   │   └── 核心逻辑：以优势驱动，发挥杠杆效应
- │   ├── 赚钱=提供价值（价值交换公式）                    —— 20231107_66
- │   │   └── 等价性、能力依赖、长期主义
- │   └── 盖洛普才干四分类（战略思维、影响力、关系建立、执行力）  —— 20231107_66
- │       └── 识别导向：没有优劣，只有适合
- ├── 内容生产方法论
- │   ├── 笔记是思考的体现（思考优先于读完）               —— 20231128_05
- │   │   └── 笔记是思维活动的可视化产物
- │   ├── 读书笔记六法（目的导向、新媒体思维、场景故事、总结拓展、观点翻译、例子替换）  —— 20231128_05
