  excerpts:
  - 只要有1000个铁杆粉丝信任你就足够
  - 获得少数铁杆粉丝信任即可支撑事业
- 'no': 5
  name: 五星功夫 —— 时间管理的「全景地图」
  points:
  - '**为什么需要这个概念？**'
  - '- 时间管理是一个系统工程，只掌握单一技巧（如番茄钟、清单法）往往难以真正提升效率'
  - '- 需要一个全景式的框架来统领时间管理的各个维度，避免「捡了芝麻丢了西瓜」'
  - '- 五星功夫提供了从「感知时间」到「有效复盘」的完整闭环'
  - '**核心定义**'
  - '- 五星功夫包含五个维度：衡量时间、要事第一、周密计划、保持状态、有效复盘'
  - '- 这五个维度构成了一个完整的时间管理循环：先知道时间去哪了（衡量），再决定做什么（要事），然后安排怎么做（计划），接着保证做得动（状态），最后看做得怎样（复盘）'
  - '**关键性质**'
  - '- 系统性：五个维度环环相扣，构成完整闭环'
  - '- 通用性：适用于工作、学习、创业等各种场景'
  - '- 层次性：从时间感知（衡量）到行动执行（计划）再到优化迭代（复盘），层层递进'
  - '**典型例子**'
  - '- 一个创业者用五星功夫管理一天：先记录每个任务的实际耗时（衡量时间），确定今天最重要的三件事（要事第一），制定详细的执行时间表（周密计划），保证睡眠和运动以维持精力（保持状态），晚上回顾当天效率并调整策略（有效复盘）'
  - '**边界条件**'
  - '- 五星功夫是框架而非具体工具，每个维度下需要配合具体方法来落地（如衡量时间配体内计时器训练法、计划配日计划三步法）'
  - '- 五星功夫的五个维度不需要每天全部完美执行，可以根据实际情况有所侧重——例如忙碌时可简化复盘，困惑时多花时间衡量'
  sources:
  - paper: 20231107_64 时间管理五星功夫
    role: origin
  excerpts:
  - 衡量时间、要事第一、周密计划、保持状态、有效复盘
  - 五星功夫时间管理方法论
- 'no': 6
  name: 体内计时器 —— 把「时间感」训练成第二本能
  points:
  - '**为什么需要这个概念？**'
  - '- 大多数人不知道自己的时间花在哪里，对「10分钟到底有多长」缺乏准确感知'
  - '- 若无法精确感知时间，就无法有效衡量和分配时间，「衡量时间」便无从谈起'
  - '- 体内计时器训练法能够培养精准的时间感知能力，为时间管理打下基础'
  - '**核心定义**'
  - '- 体内计时器是一种通过「预测→感觉→测量→复盘」循环来训练时间感知的方法'
  - '- 核心原则是「摒弃情绪，用无区别的心对待每件事」——不带主观好恶地客观感受每件事的时间消耗'
  - '**关键性质**'
  - '- 客观性：训练的核心是去除情绪干扰，纯粹感知时间流逝'
  - '- 循环性：通过反复的预测-验证循环持续校准时间感知能力'
  - '- 可迁移性：一旦养成时间感知力，可应用于任何任务的时间预估'
  - '**典型例子**'
  - '- 在开会前先预估「这个会议大概需要40分钟」，会议结束后对照实际耗时，如果偏差较大，反思是哪些环节产生了意外耗时，逐步提高预估准确度'
  - '**边界条件**'
  - '- 训练需要持续一段时间才能见效，不可能一两天就形成精准的时间感'
  - '- 该方法适用于常规任务的时长感知，对于高度不确定性任务（如创意头脑风暴）的预估仍然会很困难'
  sources:
  - paper: 20231107_64 时间管理五星功夫
    role: origin
  excerpts:
  - 衡量时间的训练：摒弃情绪用无区别的心对待每件事
  - 通过预测感觉测量复盘循环培养时间感知
- 'no': 7
  name: 日计划三步法 —— 把杂乱思绪「收纳」成可执行清单
  points:
  - '**为什么需要这个概念？**'
  - '- 每天脑子里充满各种任务和想法，如果不进行整理，就会陷入混乱，重要的事被琐事淹没'
  - '- 五星功夫中的「周密计划」需要具体落地工具，日计划三步法就是其中最关键的执行工具'
  - '- 通过结构化整理，将大脑从「记事本」变成「思考器」，释放认知资源'
  - '**核心定义**'
  - '- 日计划三步法包含三个步骤：①把脑子里的事情都收集到清单里；②用4D工作法（Delay、Do it now、Do not do it、Delegate）整理；③挑选重要事项列入日计划'
  - '- 4D工作法是核心筛选工具：延迟、立即做、不做、委派给他人'
  - '**关键性质**'
  - '- 收集先行：先清空大脑，再谈整理'
  - '- 四维筛选：通过4D快速分类，避免无效任务占据时间'
  - '- 聚焦执行：最后只挑最重要的事进入日计划，保证精力聚焦'
  - '**典型例子**'
  - '- 早上用5分钟将脑子里所有「要做的事」全部写到清单上（收集），然后逐一判断：哪些可以推迟（Delay）、哪些必须今天完成（Do it now）、哪些根本不值得做（Do
    not do it）、哪些可以交给别人（Delegate），最后挑出2-3件最重要的事列入今天的计划'
  - '**边界条件**'
  - '- 日计划三步法更适合个人时间规划，如果涉及团队协作，需要配合团队任务管理工具（如项目管理软件）一起使用'
  - '- 4D中的「Do not do it」需要一定的判断力，刚使用时可能难以区分「不做」和「延迟」，需要结合长期目标来辅助判断'
  sources:
  - paper: 20231128_03 日计划制定法
    role: origin
  excerpts:
  - 1把脑袋里的事情都收集到清单里
  - 4D工作法：Delay、Do it now、Do not do it、Delegate
- 'no': 8
  name: 定位 —— 找到事业中的「长板生态位」
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人努力却赚不到钱，根本原因是没有找到自己在事业中的合适位置'
  - '- 在错误的位置上再努力也难以产出高价值，需要先「定位」再「发力」'
  - '- 定位回答的是「我是谁、我在哪、我该做什么」的根本性问题'
  - '**核心定义**'
  - '- 定位是指：优势决定你在事业中的位置，位置进而决定能否赚钱'
  - '- 定位的核心逻辑是「优势→位置→价值→赚钱」的传导链路——只有找到自己优势所在的位置，才能高效创造价值并获得回报'
  - '**关键性质**'
  - '- 优势驱动：定位必须以个人优势为出发点，而不是以市场热度为出发点'
  - '- 杠杆效应：好的定位能让同样的努力产生数倍的回报'
  - '- 动态性：定位不是一次找到就一劳永逸，需要在实践中不断调整'
  - '**典型例子**'
  - '- 一个人擅长深度思考和分析但不擅长社交，如果硬去做销售岗位，就会事倍功半；但如果定位为「分析师」角色，就能充分发挥优势创造价值'
  - '**边界条件**'
  - '- 定位的前提是了解自己的优势，不了解优势时盲目定位会适得其反'
  - '- 定位受行业和时代影响，某些优势在特定时期可能难以变现，需要结合市场需求进行平衡'
  sources:
  - paper: 20231107_66 找准个人优势
    role: origin
  excerpts:
  - 优势决定你在事业中的位置进而决定能否赚钱
  - 赚钱等于提供价值等于定位
- 'no': 9
  name: 赚钱=提供价值 —— 从「想赚钱」到「值钱」的换算公式
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人想赚钱但思路错误：总想着「怎么赚别人的钱」，而不是「我能为别人创造什么价值」'
  - '- 「赚钱＝提供价值」重新定义了赚钱的底层逻辑，纠正了对财富来源的根本认知'
  - '- 只有将赚钱等同于提供价值，才会把精力放在提升能力和服务他人上，而非投机取巧'
  - '**核心定义**'
  - '- 赚钱与提供价值可以划等号——赚钱的本质是「你为他人提供的价值」的市场化回报'
  - '- 并且只能靠擅长的事情提供价值，即「优势×价值＝赚钱」'
  - '**关键性质**'
  - '- 等价性：赚钱不是零和博弈，而是价值交换的必然结果'
  - '- 能力依赖：提供价值的能力取决于个人优势的发挥程度'
  - '- 长期主义：持续提供价值才能持续赚钱，一次性投机不能持久'
  - '**典型例子**'
  - '- 一个医生通过治病救人（提供健康价值）获得收入；一个教师通过传授知识（提供教育价值）获得收入——他们赚到的钱本质上是所创造价值的货币化体现'
  - '**边界条件**'
  - '- 「提供价值」并不意味着所有价值都能立即变现，有些价值需要时间积累才能被市场认知'
  - '- 商业环境中的信息不对称、垄断等因素可能导致价值与价格短期偏离，但长期来看二者趋于一致'
  sources:
  - paper: 20231107_66 找准个人优势
    role: origin
  excerpts:
  - 赚钱与提供价值可以划等号
  - 赚钱等于提供价值等于定位
- 'no': 10
  name: 盖洛普才干四分类 —— 认识优势的「四维地图」
  points:
  - '**为什么需要这个概念？**'
  - '- 要「找准个人优势」先要有一个科学的框架来识别和分类优势'
  - '- 大多数人对自己的优势描述模糊（如「我比较细心」「我善于沟通」），缺少系统化认知'
  - '- 盖洛普四分类提供了一个标准化的优势认知框架，帮助人们快速定位自己的才干类型'
  - '**核心定义**'
  - '- 盖洛普才干四分类将人的优势才干划分为四大类：战略思维（善于分析、统筹规划）、影响力（善于表达、感染他人）、关系建立（善于连接、凝聚团队）、执行力（善于推动、落地执行）'
  - '**关键性质**'
  - '- 独立性：四大类才干相互独立，每个人在不同类别上有不同的强弱分布'
  - '- 组合性：绝大多数人的优势是跨类别的组合，而非单一类别'
  - '- 识别导向：四分类的作用是「识别」而非「评判」——没有哪类更好，只有是否适合'
  - '**典型例子**'
  - '- 一个创业者可能是「战略思维（统筹规划）＋影响力（说服投资人）＋执行力（推动落地）」的组合，而一个优秀的工程师可能是「战略思维（分析）+执行力（解决问题）」的组合'
  - '**边界条件**'
  - '- 盖洛普四分类是识别优势的参考框架而非绝对标准，不同人的优势表现可能超出四分类的框架'
  - '- 测试结果只是起点，真正的优势需要在实践中被验证，不能仅凭测试结果就给自己贴标签'
  sources:
  - paper: 20231107_66 找准个人优势
    role: origin
  excerpts:
  - 战略思维、影响力、关系建立、执行力
  - 盖洛普才干四分类
- 'no': 11
  name: 笔记是思考的体现 —— 把「读过的书」变成「想过的理」
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人读书追求「读完」和「读完很多本」，误把阅读数量当作学习成果'
  - '- 单纯读完一本书而不思考，知识无法内化，也就无法转化为输出能力'
  - '- 需要先厘清「读书的目的不是读完而是思考」，才能为笔记六法奠定认知基础'
  - '**核心定义**'
  - '- 读书最重要的是思考，笔记是思考的体现——笔记不是为了记录而记录，而是思维活动的可视化产物'
  - '- 当你在书上划线、在笔记中写下感想时，本质上是在「与作者对话」和「与自己对话」，这才是读书的核心价值'
  - '**关键性质**'
  - '- 思考优先：思考的价值高于「读完」本身'
  - '- 外化载体：笔记是思考过程的外化，没有笔记很难确认是否真正进行了深度思考'
  - '- 双向互动：笔记连接了「作者的思想」与「读者的理解」，是知识内化的桥梁'
  - '**典型例子**'
  - '- 读一本管理学书籍时，不是追求「三天读完」而是边读边在书边写下自己的管理经验与书中理论的对照，最后整理成一篇有自己观点的笔记'
  - '**边界条件**'
  - '- 「笔记是思考的体现」适用于主动学习型的阅读场景，对于消遣型阅读或信息检索型阅读，不一定需要刻意做笔记'
