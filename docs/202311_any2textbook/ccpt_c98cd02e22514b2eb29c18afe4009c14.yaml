paper: 20231107_66 找准个人优势
desc: 素材由北大毕业、具备三年400万+营收经验的优势教练导师苏姐撰写，围绕'找准个人优势'这一主题，提出'赚钱=提供价值'、'定位源于实践（试错）而非寻找'的核心观点，并系统阐述了优势发掘的自我责任、优势与商业闭环的关系、盖洛普才干四分类的应用、技能外包原则及销售成交能力的重要性，是一套以个人优势为核心的商业定位与赚钱方法论。
concepts:
- name: 定位（优势决定位置）
  desc: 定位指个人在事业、社会、团队中的位置，由个人优势决定，进而决定能否赚钱、赚多少钱。
  is_original: true
  excerpt:
  - 优势决定你在事业社会团队中的位置，进而决定能否赚钱，这就是'定位'。
- name: 自我负责（100%责任）
  desc: 发掘自我优势只能是自己责任，必须100%自我负责，不能依赖他人或外部环境。
  is_original: true
  excerpt:
  - 发掘自我优势只能是自己责任，100%自我负责。
- name: 商业闭环（项目四要素）
  desc: 任何能赚钱且持续赚钱的赛道一定是具有闭环的项目，需要产品、渠道、流量、成交、交付五大关键环节协同运作。
  is_original: true
  excerpt:
  - 任何能赚钱且持续赚钱的赛道一定是有闭环的项目，需要产品、渠道、流量、成交、交付。
methods:
- name: 盖洛普才干分类定位法
  desc: 运用盖洛普四个象限（战略思维、影响力、关系建立、执行力）对个人才干进行分类，据此判断自己在商业闭环中最能创造价值的环节，并差异化地选择推动他人、销售、润物细无声成交或使命必达交付等具体工作路径。
  excerpt:
  - 战略思维（擅长产品搭框架分析）、影响力（适合推动影响他人销售）、关系建立（适合润物细无声成交）、执行力（使命必达靠谱）。
  - 可思考在什么环节最能提供价值、如何保证比他人优秀。
- name: 技能外包与核心掌握策略
  desc: 将普通技能（社群运营、海报、剪辑）进行外包，将咨询、流量、成交、内容等核心稀缺技能由自己掌握，从而集中资源于高价值环节。
  excerpt:
  - 普通技能可外包（社群运营、海报、剪辑），核心稀缺技能必须自己掌握（咨询、流量、成交、内容）。
- name: __overview__（实践试错与成功方法论）
  desc: 整体方法论为：通过实践（试错）而非空想寻找定位，用优势击穿一点创造成就事件，遵循极致简单+有效重复原则，同时必备销售成交能力，最终以清晰自我认知为起点实现赚钱目标。
  excerpt:
  - 定位不是找到的，是实践（试错）出来的。不要终生停留在'想'和'找'阶段。
  - 集中兵力，用你的优势着力击穿一点创造成就事件。极致简单+有效重复。
  - 有一项能力是必备的：销售成交能力。
theorems:
- name: 赚钱=提供价值（定位决定成败）
  desc: 核心主张是'赚钱'与'提供价值'可以划等号，因此只能靠做擅长的事情去提供价值；一个人能否赚钱由其优势决定的定位所决定。
  excerpt:
  - '''赚钱''与''提供价值''可以划等号，只能靠做擅长的事情提供价值，优势决定你在事业社会团队中的位置，进而决定能否赚钱。'
- name: 市场缺卖者不缺产品
  desc: 市场上不缺好产品，缺能把产品卖好的人，因此销售成交能力是个人赚钱的一项必备能力。
  excerpt:
  - 市场上不缺好产品，缺能把产品卖好的人。有一项能力是必备的：销售成交能力。
findings:
- name: 实践优于想找（试错出真知）
  desc: '[evidence] 素材宣称定位不是找到的，而是实践（试错）出来的，并且以实践经验为依据强调不要终生停留在''想''和''找''阶段——这是从其个人及教练实践中提炼出的发现。'
  excerpt:
  - 定位不是找到的，是实践（试错）出来的。不要终生停留在'想'和'找'阶段。
- name: 清晰带来成功（认知先行论）
  desc: '[claim] 素材宣称''清晰带来成功''，认为认清自己是谁是生财第一步，之后才谈得上赚钱技能——这一主张是原文宣称的结论，未展示具体数据支撑。'
  excerpt:
  - 清晰带来成功，认清自己是谁是生财第一步，然后才是赚钱技能。
