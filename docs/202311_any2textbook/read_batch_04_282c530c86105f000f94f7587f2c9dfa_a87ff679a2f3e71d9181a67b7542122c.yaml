- file_path: docs/202311/20231121_12.md
  title: 十年复盘：星星之火可燎原，狂朝控股的发展之路
  summary: 盗坤以十年创业历程为主线，详细复盘了从淘宝蓝海起步，到转型电商IP孵化、娱乐主播、直营获客，建立重庆/杭州/广州多地分公司、月销数千万GMV的狂朝控股全过程。他提炼了三条核心心得：发挥自己最擅长并学会合作；人生最重要的能力是决策能力；有能力的人很多但有勇气把握机会的人少。
  core_question: 一个白手起家的电商创业者，如何通过十年时间、多次跨越式转型，建立起多业务协同的控股公司？
  key_judgment: 公司发展的核心转折点在于“从看项目升级为看人”，通过加入生财私董会等并花了近百万链接更优质创业者，才真正完成从短期项目到正道、从单打独斗到平台化合伙共创的认知与模式跃迁；决定成败的关键是每次的决策选择，而非流量能力本身。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 公司数据为特定时期，具有时效性
  - 案例独特，不可直接复制，需提炼普适原则
  screening_conclusion: retain
  reason: 十年综合复盘是难得的高质量演进案例，完整呈现了从个人到组织、从单一到多元化的真实演进路径，并提炼出了有深度的决策原则，具备章节级价值。
- file_path: docs/202311/20231121_13.md
  title: 普通女孩搞钱 10 件套，成功 3 件,也能赚到 100 万
  summary: 作者以“普通女孩”自述，复盘了从月薪几千到30岁前攒下第一个100万的10次投资/创业经历：甜品店、A股、基金、港股打新、可转债、币圈、跨境电商、服装创业、小红书、证券撸羊毛。详细分享了甜品店踩坑（与亲戚合伙、没调研）及港股打新/可转债/币圈的成功经验，核心观点是10件套里成功3件也能达成目标。
  core_question: 一个没有强力背景的普通女孩，如何通过多次尝试和复盘，在10次尝试中抓住3次机会赚到第一个100万？
  key_judgment: 普通人的财富积累不是靠一次全垒打，而是通过多次小成本试错（搞钱10件套），在具备基础理财认知后的几个关键风口中（港股打新、可转债、币圈的早期阶段）精准出击，成功几件就能完成原始资本积累；核心是接受不确定性并迅速执行。
  depth: medium
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 含币圈/股票等高风险投资经历，需谨慎介绍防止误导
  - 时效性强（港股打新、可转债红利期已过）
  screening_conclusion: retain
  reason: 真实的个体搞钱经历复盘，特别是有“失败试错+成功”对比，对读者有强烈的共鸣和参照价值，适合作为个人实践案例，但需提示风险。
