- file_path: docs/202311/20231121_35.md
  title: 小红书电商选品方法
  summary: 作者分享其小红书电商选品的方法论：主要针对无货源单品打爆模式，强调多渠道挖掘新爆款（如抖音/供应商提前获取素材）、关注小赛道新爆品并快速跟进，并提及配套的图文素材去重策略。
  core_question: 在小红书电商的无货源模式下，如何系统性地找到能打爆的单品？
  key_judgment: 小红书电商（无货源单品打爆模式）的核心玩法是“跨平台搬品”：盯住其他平台（如抖音）新出现的小爆品，在时间差内第一时间搬运到小红书，同时必须要提前与供应商建立联系拿到素材，以避开严格的查重。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性中（小红书查重趋严，此玩法正在被收紧）
  - 平台策略变化快
  screening_conclusion: retain
  reason: 提供了具体的跨平台选品策略和供应链前置思维，方法论框架（盯平台、抢时间、锁供应链）具备章节级的深度和迁移价值。
