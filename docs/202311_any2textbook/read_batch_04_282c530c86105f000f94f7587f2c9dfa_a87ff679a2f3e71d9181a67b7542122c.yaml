- file_path: docs/202311/20231121_08.md
  title: 所有的广告都是品效合一的
  summary: 营销专家小马宋通过访谈形式阐述对品效合一的独特理解：所有广告本质上都是品效合一的，但转化周期可能很长（3年、10年）。他指出传统广告（如央视、户外广告牌）在建立长期品牌资产方面有效，而互联网广告能快速见效，企业在预算有限时应按比例配置长短效广告组合。
  core_question: 企业如何正确理解“品效合一”，并在预算有限的情况下配置传统广告与互联网广告？
  key_judgment: 品效合一不应被曲解为“即时转化”，品牌广告的效果是长期的、累积的；企业需根据自身经济能力接受不同长度的转化周期，不宜盲目追求短期GMV而放弃长期品牌资产的建立。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 重复（与营销类经典著作观点重合）
  - 访谈形式口语化
  screening_conclusion: retain
  reason: 对“品效合一”这一被滥用概念做了清晰厘清，提供了决策框架（预算分配与周期选择），具备章节级的理论价值与普适性。
- file_path: docs/202311/20231121_09.md
  title: 先小人后君子！合作创业退出机制怎么定？
  summary: 企业咨询顾问详细讲解合伙创业中股东退出的常见坑（人走股走、激励对象离职不退股、退出价格无约定、竞争对手持有股权）及三种情况下的处理方式：退出时间约束（合同期内1元回购）、合同期后项目亏损（按比例分或1元回购）、合同期后项目盈利（按市盈率/净资产/最近融资折扣定价并分批支付）。
  core_question: 合伙创业时，如何事先设定退出机制，避免中途合伙人退出带来的风险与纠纷？
  key_judgment: 股东有进有出是常态，必须在入伙时“先小人后君子”约定退出机制（时间、价格、方式），用1元回购或明确估值倍数等条款防范道德风险，确保公司长期稳定。
  depth: medium
  suggested_destination: handbook_entry
  possible_shape: handbook
  risks:
  - 内容为专业法律/股权咨询范畴，需核验合规性
  - 案例细节可能不适用于所有地区
  screening_conclusion: retain
  reason: 针对小创业团队高频痛点，提供了具有操作性的框架和定价逻辑，可大幅降低试错成本，适合发展成为手册中的实操条目。
