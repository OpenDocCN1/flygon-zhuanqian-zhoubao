paper: 初创公司股权分配五步法
desc: 该素材提出了一套面向初创公司的'4C动态量化股权分配模型'及配套的'五步法'，将股权分配从经验判断转变为可量化的科学流程。模型将股权贡献拆解为创始人身份、岗位权重、时间投入、资金投入四个维度，并给出了各维度的经验权重范围，强调通过创始团队自评互评达成共识；五步法则从赛道定位、信息收集、权重锚定、系数打分到最终计算逐步落地。素材同时明确指出股比计算只是'最简单的环节'，最终法律效力需借助一致行动权、期权池等合同工具规范。
concepts:
- name: 4C动态量化股权分配模型
  desc: 将股权贡献拆解为资本（人力资本+货币资本）下四个维度——创始人身份、岗位权重、时间投入、资金投入，并配以经验权重范围进行量化分配的模型，强调'动态'即随阶段调整、'量化'即用系数计算。
  is_original: true
  excerpt:
  - 初创公司科学量化股权分配的4C动态量化股权分配模型及五步法。
  - 4C含义：资本（人力资本+货币资本），细分为4个维度：创始人身份、岗位权重、时间投入、资金投入。
  - 各维度权重范围（经验值，需创始团队锚定共识）
- name: 创始人身份
  desc: 指谁承担最大风险、谁最有控制企业需要的属性，权重范围10%-30%，代表公司对外的唯一声音与风险兜底角色。
  is_original: false
  excerpt:
  - 创始人身份：10%-30%。谁承担最大风险，谁最有控制企业的需要。创始人身份极度明确，一家公司对外只有一个声音。
  - 创始人身份代表风险承担（兜底的人）。
- name: 岗位权重
  desc: 行业技术壁垒所在岗位的重要性，权重范围30%-40%，强调前期讲清楚以避免后期拆伙。
  is_original: false
  excerpt:
  - 岗位权重：30%-40%。行业技术壁垒在哪里，哪个岗位最重要。前期聊清楚避免后期拆伙（大多数合作伙伴拆伙就是觉得自己最重要出力最多但分钱不最多）。
- name: 时间投入
  desc: 全职vs兼职的精力投入程度，权重范围10%-25%，用于判断对项目的信心和风险承担。
  is_original: false
  excerpt:
  - 时间投入：10%-25%。全职vs兼职，投入精力大小。判断对项目的信心和风险承担。
- name: 资金投入
  desc: 前期货币出资规模，权重范围20%-50%，同样用于判断对项目的信心与风险承担。
  is_original: false
  excerpt:
  - 资金投入：20%-50%。前期资金投入，判断对项目的信心和风险承担。
methods:
- name: 初创公司股权分配五步法
  desc: 从赛道定位、信息收集、权重共识、系数打分到比例计算的一套完整股权分配流程，是4C模型的操作化落地。
  excerpt:
  - 1.确定行业和赛道：技术驱动/资金驱动、自主创业/集团孵化（2个维度4个类型）。
  - 2.收集创始团队信息：创始人信息、其他联合创始人信息、谁全职、负责哪个岗位、各自出资额度。
  - 3.确定每个维度的权重比例：通过创始团队自评互评达成共识。4C工具前置逻辑。
  - 4.确定股东四个维度的权重系数：按1-10打分，分自评和他评。
  - 5.计算各个股东的股权比例。
- name: __overview__
  desc: 整体方法论为'量化分解-共识校准'：先用4C维度将股权贡献分解为可度量的四类，再通过自评互评机制校准主观偏差，最终以加权计算导出股比，并辅以法律合同工具完成闭环。
  excerpt:
  - 4C工具前置逻辑。
  - 创始人身份代表风险承担（兜底的人）。容易分歧的维度是岗位分工和时间投入。
  - 注意：股权比例分配是最简单的环节，最终工商结果还需其他合同规范和调整：一致行动权、期权池、分红奖励、回购权、纯资金方投资优先清算权、领售权等。
theorems:
- name: 股权分配的核心矛盾在于分歧而非计算
  desc: 核心主张：股比计算本身是最简单的环节，真正的难点在于对岗位分工和时间投入等维度的认知分歧，需通过自评互评和合同工具解决。
  excerpt:
  - 股权比例分配是最简单的环节
  - 容易分歧的维度是岗位分工和时间投入。
  - 大多数合作伙伴拆伙就是觉得自己最重要出力最多但分钱不最多
- name: 创始团队共识是量化模型生效的前提
  desc: 核心主张：四个维度的权重范围本质是经验值而非绝对真理，必须由创始团队通过'锚定共识'（自评互评）来确定，模型才能公平有效。
  excerpt:
  - 各维度权重范围（经验值，需创始团队锚定共识）
  - 通过创始团队自评互评达成共识。
findings:
- name: 儿童体能训练项目股权分配结果
  desc: '[evidence] 该案例展示了五步法的完整应用：3位合伙人、200万启动资金背景下，通过量化维度计算得出各自股权比例，验证了模型对''出资与出力错位''情形的可操作性。'
  excerpt:
  - 案例：儿童体能训练项目，3个合伙人，启动资金200万。小明（发起人，有经验，全职，出50万）、小磊（市场运营，全职）、小胡（国企，出资人，投150万，不出力）。
  - 最终通过五步法计算出各自的股权比例。
