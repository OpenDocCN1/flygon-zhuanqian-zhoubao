retain_principles: 保留所有high深度且能直接贡献方法论或案例质感的素材；合并medium深度周报为辅助素材；排除低深度、空内容或主题偏离的孤立文件。
steps:
- 第一步：确认核心命题与目录框架（1周内），与作者对齐'系统方法论'的定位和读者画像。
- 第二步：将high深度素材按新目录重组为章节初稿，标注缺口（需补写部分），优先完成'认知/项目/IP/私域'四大核心模块。
- 第三步：对medium周报进行二次拆解，填充案例库与工具箱；同步启动书名、封面与营销文案包装，并进行小范围读者内测。
risks:
- 时效性风险：部分素材依赖特定平台规则（如抖音、视频号），需在上架前更新或加时效说明。
- 同质化风险：'个人IP变现'主题竞争激烈，需强化'龙哥案例复盘'的独特叙事与可复制框架。
- 补写超时风险：方法论系统化补写工作量未预估，可能拖延出版节奏，建议先出电子版/内测版。
