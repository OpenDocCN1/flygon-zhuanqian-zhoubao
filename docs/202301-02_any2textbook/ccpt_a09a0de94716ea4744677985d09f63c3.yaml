paper: 万字复盘副业拆解
desc: 该素材提出一套针对普通职场人的副业成功方法论，核心主张是副业成功的关键并非原创或All in，而是建立一套'后发制人'的商业情报挖掘与项目拆解体系；素材系统化地给出了喂养算法、情报挖掘三方法、项目拆解八步、项目管理双案、三大杠杆、选项目防坑标准、基础能力模型等操作框架，并以多个亲历项目（如儿童游乐项目）作为复制成功的证据。
concepts:
- name: 后发制人
  desc: 该概念主张做别人已经验证赚钱的事情，通过复制或二次创作获取成功，不看原创、不赌不确定性，以此降低副业试错成本。
  is_original: true
  excerpt:
  - 后发制人：做别人做过的事情，将其进行复制或二次创作，不看原创不赌。
- name: 情报挖掘与拆解体系
  desc: 该概念指一套系统化收集、筛选、拆解商业案例的流程，由喂养算法、学会搜索、记录到飞书表格三个环节构成，是后发制人的前提。
  is_original: true
  excerpt:
  - 副业成功关键不是原创和All in，而是建立一套后发制人的情报挖掘与拆解体系。
  - 建立赚钱情报挖掘体系三方法：喂养算法、学会搜索（分辨信息源真伪、泛读、技术爬虫监测）、记录到飞书表格建立项目库。
- name: 喂养算法
  desc: 该概念指通过主动的收藏、点赞、关注等行为，配合每天两小时的商业内容泛阅读，使算法持续向自己推送商业案例，从而低成本获得情报源。
  is_original: true
  excerpt:
  - 喂养算法：每天保持两小时商业内容泛阅读，通过收藏点赞关注，让算法持续推送商业内容。
- name: 项目库
  desc: 该概念指通过飞书表格将搜集到的潜在赚钱项目结构化记录下来，形成可筛选、可批量评估的候选池。
  is_original: false
  excerpt:
  - 记录到飞书表格建立项目库。
  - 找项目（建项目库）
- name: 赛道与渠道
  desc: 该概念区分了业务基本盘（赛道：卖货、卖课、卖服务）与营销分发路径（渠道：客户在哪里哪里就是渠道），并强调渠道存在信息差，是后发复制时可以套利的关键。
  is_original: false
  excerpt:
  - 赛道是业务基本盘（卖货卖课卖服务），渠道是营销渠道（客户在哪里哪里就是渠道）。渠道存在信息差。
- name: 防踩坑标准
  desc: 该概念提炼为三条选项目过滤规则：重资产的不要碰、自己搞不懂的不要碰、自己不喜欢的不要碰。
  is_original: true
  excerpt:
  - 选项目防踩坑标准：重资产的不要碰、自己搞不懂的不要碰、自己不喜欢的不要碰。
methods:
- name: __overview__
  desc: 整体方法论：先由算法和搜索建立情报源，再入库过滤项目，随后对候选项目进行八步拆解、项目管理落地、杠杆放大，最终实现多项目复制与副业变现。
  excerpt:
  - 核心方法论：副业成功关键不是原创和All in，而是建立一套后发制人的情报挖掘与拆解体系。
  - 1. 喂养算法... 2. 建立赚钱情报挖掘体系三方法... 3. 拆解一个赚钱项目八步... 4. 项目管理思维... 5. 三大杠杆... 6. 选项目防踩坑标准...
    7. 基础能力模型...
- name: 赚钱情报挖掘三方法
  desc: 该方法包含喂养算法、学会搜索（分辨信息源真伪、泛读、技术爬虫监测）、记录到飞书表格三步，目的在于持续获得低成本的商业情报。
  excerpt:
  - 建立赚钱情报挖掘体系三方法：喂养算法、学会搜索（分辨信息源真伪、泛读、技术爬虫监测）、记录到飞书表格建立项目库。
- name: 拆解赚钱项目八步法
  desc: 该方法按'找项目→拆流量→拆转化→拆产品交付→评估可复制性和可持续性→定策略→搭团队→强执行'八步骤对一个项目进行全链路拆解，以评估其能否被后发复制。
  excerpt:
  - 拆解一个赚钱项目八步：找项目（建项目库）、拆流量、拆转化、拆产品交付、评估可复制性和可持续性、定策略、搭团队、强执行。
- name: 项目管理双案法
  desc: 该方法将项目管理拆为策划案（产品货盘、运营策略、目标制定、里程碑、止损点、放大操作点）与执行案（时间、地点、事项、责任人、阶段性目标）两部分，保证项目可追踪可落地。
  excerpt:
  - 项目管理思维：策划案（产品货盘、运营策略、目标制定、里程碑、止损点、放大操作点）+执行案（时间、地点、事项、责任人、阶段性目标）。
- name: 三大杠杆
  desc: 该方法主张用人力杠杆（低成本兼职+SOP）、技术杠杆（软件批量搬运释放双手）、资源杠杆（资金、人脉）三种杠杆放大业务规模，避免个人体力投入成为瓶颈。
  excerpt:
  - 三大杠杆：人力杠杆（低成本兼职+SOP）、技术杠杆（软件释放双手批量搬运）、资源杠杆（资金人脉）。
theorems:
- name: 副业成功的非原创定理
  desc: 核心主张：副业成功不取决于原创程度的高低，也不取决于是否All in，而取决于是否建立后发制人的情报挖掘与拆解体系——复制已验证项目是最高效的成功路径。
  excerpt:
  - 副业成功关键不是原创和All in，而是建立一套后发制人的情报挖掘与拆解体系。
  - 后发制人：做别人做过的事情，将其进行复制或二次创作，不看原创不赌。
- name: 渠道信息差定理
  desc: 核心主张：赛道决定业务方向，渠道决定流量来源；同一业务在不同渠道存在信息差，掌握渠道信息差的人在后发复制中可套利。
  excerpt:
  - 赛道是业务基本盘（卖货卖课卖服务），渠道是营销渠道（客户在哪里哪里就是渠道）。渠道存在信息差。
- name: 项目三不碰过滤定理
  desc: 核心主张：选项目时设置三条硬性过滤标准——重资产、搞不懂、不喜欢三种类型一律不碰，以此控制失败率和投入风险。
  excerpt:
  - 选项目防踩坑标准：重资产的不要碰、自己搞不懂的不要碰、自己不喜欢的不要碰。
findings:
- name: 多项目复制成功
  desc: '[evidence] 该发现在文中由作者自述''成功复制30+项目、副业收入破百万''作为支撑，属于方法论的整体效果证据。'
  excerpt:
  - 普通职场人通过拆解各平台商业案例，成功复制30+项目，副业收入破百万。
- name: 儿童游乐项目复制变现
  desc: '[evidence] 该发现以''儿童游乐项目''为具体案例支撑，作者通过复制该项目并在三个月内变现40万，验证了八步拆解+后发制人方法在真实项目中的兑现能力。'
  excerpt:
  - 案例：儿童游乐项目（复制三个月变现40万）
- name: 轻资产创意设计类项目可复制
  desc: '[claim] 文川手写logo设计、艺术签名设计、抓娃娃卖娃娃+收徒弟、飞纸牌切水果教学等案例，被作者作为可复用、可教学、可二次创作的轻资产副业样本列举，暗示这些项目具有高可复制性。'
  excerpt:
  - 案例：儿童游乐项目（复制三个月变现40万）、文川手写logo设计、艺术签名设计、抓娃娃卖娃娃+收徒弟、飞纸牌切水果教学。
- name: 副业可同时跑多个项目
  desc: '[claim] 素材以''成功复制30+项目''为总成绩，暗含单个职场人可通过体系批量运营多个轻量项目的可行性，但原文未透露各项目间的资源分配与协同细节，仅作整体性宣称。'
  excerpt:
  - 普通职场人通过拆解各平台商业案例，成功复制30+项目，副业收入破百万。
