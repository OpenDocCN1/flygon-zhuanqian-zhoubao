- file_path: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
  title: 创业三年，两年获得天使投资，月入15w+，看我们怎么玩转“0”中介费房屋分享平台！
  summary: 本文以第一人称详细复盘了“胖龟找房”项目的创业历程，从发现房产中介行业痛点（高额中介费、信息不透明），到建立“0中介费”个人房屋分享平台，再到迭代商业模式（卖房会员、租房中介费由房东承担）、开设线下门店、开放加盟并最终获得天使投资的完整过程。
  core_question: 如何在一个传统且痛点明显的行业（房产中介）中，通过重塑商业模式（0中介费）找到切入点，并实现从0到1、从1到N的创业落地？
  key_judgment: 创业机会源于解决行业真实痛点（信息不对称和高额中介费），项目的核心在于构建“流量+转化+交付”的闭环能力，并通过精准选址（蹭同行流量）、标准化流程和加盟模式进行规模化扩张。
  depth: high
  suggested_destination: case
  possible_shape: course
  risks:
  - 时效性
  - 重复
  screening_conclusion: retain
  reason: 这是一个完整的、有数据支撑的创业案例，涵盖了市场分析、商业模式设计、运营细节、避坑指南和融资经历，具有很高的参考价值和案例教学意义。
- file_path: docs/202301-02/QbBKdHvfiofIUNxDlmjceWbfnqh.md
  title: 抖音自动化公转私玩法及防封攻略
  summary: 本文系统拆解了抖音平台将公域流量转化为微信私域流量的多种自动化玩法，包括主页跳转、评论跳转、私信卡片、直播小风车等，并重点介绍了不同账号类型（蓝V、半蓝、员工号）的适用情况以及抖音和微信两端的防封策略。
  core_question: 在抖音平台规则日益收紧的背景下，如何实现高效且相对安全的自动化公转私引流？
  key_judgment: 最高级的公转私玩法是尽可能使用抖音官方提供的功能（如认证账号、官方接口），而将第三方工具（如小程序生成卡片）作为辅助，并需同时考虑抖音端和微信端的账号与域名防封措施，才能保证转化路径的长期稳定。
  depth: high
  suggested_destination: chapter
  possible_shape: course
  risks:
  - 时效性
  - 格式预处理
  screening_conclusion: retain
  reason: 内容详实、操作性强，提供了从账号选择、入口配置到防封的完整方法论。但平台规则变化快，时效性风险高，适合作为实践课程中的核心章节，需要标注时效性。
- file_path: docs/202301-02/SvdFdfi3VoAiaRxENHNcncEqnif.md
  title: 盲盒引流常见问题解答
  summary: 本文以问答形式，针对抖音盲盒直播引流项目中遇到的平台选择、账号准备、直播内容优化、平台风控以及项目规模复制等问题，提供了基于两个月实操经验的详细解答和避坑指南。
  core_question: 在抖音做盲盒引流项目时，新手最常见的问题是什么，以及如何有效解决这些问题并实现规模化？
  key_judgment: 盲盒引流项目虽好复制，但核心在于精细化运营和风控管理：平台合规性是根基，账号需要作为‘消耗品’管理，直播数据的核心是‘留存’而非‘拉新’，而规模化扩张的关键在于有效的团队管理与激励机制。
  depth: high
  suggested_destination: course_unit
  possible_shape: course
  risks:
  - 时效性
  - 口语化
  screening_conclusion: retain
  reason: 文章针对性强，问题解答详细且包含大量实操细节，是对项目从0到1及规模化放大过程的极佳补充，适合作为相关课程单元或问答案例集。
