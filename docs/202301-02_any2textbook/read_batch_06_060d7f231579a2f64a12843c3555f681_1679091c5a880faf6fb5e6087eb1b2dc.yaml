- file_path: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
  title: 一个千万项目的底层逻辑
  summary: 本文提出了一套拆解任何商业项目的六维模型（流量效率、销转效率、交付效率、客单价、毛利率、复购率），并通过多个案例（如小说推文、教育资料、减肥食谱、商业IP、知识付费）展示了如何用该模型评估项目的可行性与可复制性。
  core_question: 如何用一个通用框架快速拆解和评估任意商业项目的底层逻辑和赚钱效率？
  key_judgment: 任何项目都可以用“流量、销转、交付”三个效率指标和“客单价、毛利率、复购率”三个财务指标拆解；前三个效率高则项目可复制放大，若有短板则需通过提高后三个财务指标来弥补。
  depth: medium
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 口语化
  screening_conclusion: retain
  reason: 提供了一套通用且可操作的商业项目分析框架，适合作为方法论章节的核心素材，能指导读者进行项目评估。
- file_path: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
  title: ifttt实现推特用户更新内容后自动推送到邮箱或企业微信或钉钉
  summary: 本文是一篇工具教程，详细介绍了如何使用IFTTT平台监控特定推特账号的更新，并将更新内容自动推送到指定邮箱或通过企业微信/钉钉机器人群进行通知。
  core_question: 如何在无需编程的情况下，实现推特账号更新内容的自动化监控和即时推送？
  key_judgment: 利用IFTTT的‘如果这样，那样就那样’的自动化逻辑和非官方的Webhook接口，可以低成本、快速地构建一个跨平台的信息监控与推送管道，满足特定信息获取需求。
