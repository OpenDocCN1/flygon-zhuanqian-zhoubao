paper: IP如何做到风骨体面且年入千万
desc: 该素材提出一个从0到年入千万的内容型IP运营方法论，将IP打造拆解为夯实地基、内容体系规划、千万营收模型、一年节点规划、落地五大步骤，强调IP要实现"风骨体面"（文化溢价）与"千万变现"（商业能力）的平衡，并提供了地基搭建（12345框架）、内容架构（4级）、独有理论构建、营收模型等具体操作路径。
concepts:
- name: 母题
  desc: 指文化传统中具有传承性的文化因子，或人类社会循环往复普遍发生的事情，即原型；掌握母题可搭建护城河并灵活调整边界。
  is_original: false
  excerpt:
  - 1个母题：文化传统中具有传承性的文化因子，或人类社会循环往复普遍发生的事情，最简单的理解是原型。
  - 掌握母题可以搭建护城河又能随时调整边界。
- name: 2层基因
  desc: IP的两层内在基因：文化沉淀价值（风骨）与商业持续能力（变现），强调不做没有文化溢价的事情。
  is_original: true
  excerpt:
  - 2层基因：文化沉淀价值（风骨）和商业持续能力（变现）。
  - 不要做没有文化溢价的事情。
  - IP是少数人的领地，每个IP的花期和成长环境不同，不要走别人的路径。
- name: 3重身份
  desc: IP对外兼具三重身份：工具（解决用户问题）、人（解决价值主张或情绪）、神（解决迭代升级）。
  is_original: true
  excerpt:
  - 3重身份：工具（解决用户问题）、人（解决价值主张或情绪）、神（解决迭代升级）。
- name: 4级观感
  desc: IP带给用户的四级观感体验：松弛感（尽在掌握）、对象感（只对你说）、获得感（卧槽）、氛围感（沉浸无法自拔）。
  is_original: true
  excerpt:
  - 4级观感：松弛感（尽在掌握）、对象感（只对你说）、获得感（卧槽）、氛围感（沉浸无法自拔）。
- name: 5份资产
  desc: IP沉淀的五类资产：用户资产、版权资产、实物资产、文化资产、生态资产。
  is_original: true
  excerpt:
  - 5份资产：用户资产、版权资产、实物资产、文化资产、生态资产。
- name: 4级内容架构
  desc: 内容体系规划的结构层级：IP方向→关键词→关键业务板块→关键业务内容，遵循mece原则。
  is_original: true
  excerpt:
  - 4级内容架构：IP方向→关键词→关键业务板块→关键业务内容（mece原则）。
- name: 点线面打通路径
  desc: 产品到项目的打通逻辑：产品（文章、课程、账号）→项目（培训项目养人）→产业链（S级IP产业群组），将电商人货场升级为内容型IP品项态。
  is_original: true
  excerpt:
  - 点线面打通路径：产品（文章、课程、账号）、项目（培训项目养人）、产业链（S级IP产业群组）。
  - 电商人货场→内容型IP品项态。
- name: 核心逻辑4近
  desc: IP变现的核心底层逻辑：离钱近好变现、离痛点近好卖出、离易用近好留存、离信任近好复购。
  is_original: true
  excerpt:
  - 核心逻辑4近：离钱近好变现、离痛点近好卖出、离易用近好留存、离信任近好复购。
methods:
- name: __overview__
  desc: 内容型IP从0到年入千万的五大步骤总框架：夯实地基、做好内容体系规划（风骨体面）、做好千万营收模型（千万变现）、做好一年的节点规划、落地。
  excerpt:
  - 内容型IP从0到年入千万的五大步骤：夯实地基、做好内容体系规划（风骨体面）、做好千万营收模型（千万变现）、做好一年的节点规划、落地。
- name: 内外部地基夯实法
  desc: 内部通过30个任务与市场接轨（含阅读3本经典写作书、准备15分钟直播循环内容），外部遵循12345框架（1个母题、2层基因、3重身份、4级观感、5份资产）夯实IP地基。
  excerpt:
  - 内部夯实地基：需要完成30个任务与市场接轨。掌握写作底层逻辑（看3本经典写作书）。直播准备（准备15分钟内容循环，人均在线时长大多数到不了8分钟）。
  - 外部夯实地基：12345，即1个母题、2层基因、3重身份、4级观感、5份资产。
- name: 独有理论5种方法
  desc: 构建IP独有理论的五种方法论：理想解法（TRIZ）、节点法、词根法、母题法、核心法。
  excerpt:
  - 独有理论的5种方法：理想解法（TRIZ）、节点法、词根法、母题法、核心法。
- name: 十年故事构建法
  desc: 通过素材（前后对比成长，关键节点标注）、故事（5-8分钟中视频）、文案、音乐四个部分构建IP的十年故事。
  excerpt:
  - 十年故事：素材（前后对比成长，关键节点标注）、故事（5-8分钟中视频）、文案、音乐。
- name: 百问百答生成法
  desc: 从行业爆款选题、高赞、热评、变现出发、用户需求出发五个来源提炼问题生成百问百答内容。
  excerpt:
  - 百问百答：问题从行业爆款选题、高赞、热评、变现出发、用户需求出发。
- name: 千万营收模型
  desc: 整合年度会员、私教（3w 3个月）、私董会（线上5-20w买圈子）、合伙人徒弟（买一赠一送一赚一分一）、图书（一书一码联合出品人）、课程直播搭配、咨询（1k+/h）、培训（1天3万）、顾问（轻顾问3w起重顾问20w/年）九种变现方式的IP营收模型。
  excerpt:
  - 变现方式：年度会员、私教（3w 3个月）、私董会（线上5-20w买圈子）、合伙人徒弟（买一赠一送一赚一分一）、图书（一书一码联合出品人）、课程直播搭配、咨询（1k+/h）、培训（1天3万）、顾问（轻顾问3w起重顾问20w/年）。
- name: 一年节点规划法
  desc: 综合考虑变现、内容、产品三条线制定年度规划，以选对生产资料（能产生滚雪球效应的内容）为唯一核心排序原则。
  excerpt:
  - 综合考虑三条线：变现、内容、产品。
  - 排序原则以能够选对生产资料为唯一核心，生产资料是能够有滚雪球效应的内容。
theorems:
- name: 不下牌桌优于天道酬勤
  desc: IP成长不应依赖"天道酬勤"的线性努力，而应具备持续不下牌桌的长期能力。
  excerpt:
  - 不要相信天道酬勤，用不下牌桌的能力来表达更恰当。
- name: IP是少数人的领地
  desc: 每个IP的花期和成长环境不同，不应复制他人的成长路径。
  excerpt:
  - IP是少数人的领地，每个IP的花期和成长环境不同，不要走别人的路径。
- name: 风骨与变现双基因论
  desc: IP须同时具备文化沉淀价值（风骨）和商业持续能力（变现），不做没有文化溢价的事情。
  excerpt:
  - 2层基因：文化沉淀价值（风骨）和商业持续能力（变现）。不要做没有文化溢价的事情。
findings:
- name: 内容体系五要素构成
  desc: '[claim] 内容体系应包含4级内容架构、一套独有理论、一个十年故事、一份百问百答、一份产品项目产业链打通路径五个部分。'
  excerpt:
  - 内容体系包含5个部分：4级内容架构、一套独有理论、一个十年故事、一份百问百答、一份产品项目产业链打通路径。
- name: 直播人均在线时长数据
  desc: '[evidence] 直播内容循环的准备应以人均在线时长大多数不到8分钟为事实依据，故准备15分钟循环内容。'
  excerpt:
  - 直播准备（准备15分钟内容循环，人均在线时长大多数到不了8分钟）。
- name: 4近逻辑对变现的支撑
  desc: '[claim] 离钱近、离痛点近、离易用近、离信任近四个维度分别支撑变现、卖出、留存、复购四项商业目标。'
  excerpt:
  - 核心逻辑4近：离钱近好变现、离痛点近好卖出、离易用近好留存、离信任近好复购。
- name: 公私域变现价格梯度
  desc: '[evidence] 素材披露了各变现方式的价格带：私教3万/3个月、私董会5-20万/年、咨询1k+/小时、轻顾问3万起/年、重顾问20万/年、培训3万/天，构成从低到高的营收阶梯。'
  excerpt:
  - 私教（3w 3个月）、私董会（线上5-20w买圈子）、咨询（1k+/h）、培训（1天3万）、顾问（轻顾问3w起重顾问20w/年）
