- file_path: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  title: 公众号追热点复盘：通过行程码一天涨粉4万+，直接变现6K+
  summary: 作者复盘其利用行程码下线的热点，通过12个公众号批量操作，实现单日新增净增4.5万粉丝、流量主及CPS等综合变现约1万元的实操过程与细节。
  core_question: 如何高效地利用社会热点事件，通过公众号矩阵实现快速涨粉和变现？
  key_judgment: 追热点的核心竞争力不在于发文速度，而在于对平台搜索算法的理解（关键词铺设、伪原创、标题优化）以及流量承接和变现路径的设计（自动回复、文中广告、CPS）。
  depth: high
  suggested_destination: case
  possible_shape: course
  risks:
  - 时效性
  - 重复
  screening_conclusion: retain
  reason: 内容虽基于特定历史热点，但详细拆解了包含关键词布局、标题策略、公众号后台设置、变现方式在内的完整操作SOP，方法论具有可迁移性，是热点营销与SEO结合的典型案例。
- file_path: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
  title: 初创公司如何科学量化股权分配？股权分配五步法教你不再踩坑！！！
  summary: 文章介绍了适用于初创团队的“4C动态量化股权分配模型”及“股权分配五步法”，通过一个儿童体能训练项目的真实案例，详细演示了如何从创始人身份、岗位权重、时间投入、资金投入四个维度量化计算股权比例。
  core_question: 初创公司在面临多个合伙人的情况下，如何避免拍脑袋决策，科学、公平地量化分配股权？
  key_judgment: 股权分配的核心在于前期通过自评与互评的方式，就创始人风险承担、岗位价值、时间投入和资金投入四个维度的权重达成共识，这远比最终计算出的数字更重要，能有效避免后期合作隐患。
  depth: high
  suggested_destination: handbook_entry
  possible_shape: handbook
  risks:
  - 内容依赖于具体案例
  - 表述口语化
  screening_conclusion: retain
  reason: 提供了一个结构清晰、可操作性强的股权分配工具和方法论，案例详实，对于初创企业具有较高的实用参考价值，可作为创业工具箱中的标准条目。
- file_path: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
  title: 有了这两个AI机器人,还怕做不好带货短视频?
  summary: 作者通过影刀RPA工具，针对抖音巨量百应后台的“爆款视频”和“创意搜索”功能开发了两个采集机器人，实现了对高GMV对标短视频的批量数据采集、表格导出和无水印下载。
  core_question: 如何让短视频创作者高效、精准地获取同行爆款视频作为对标和学习素材？
  key_judgment: 官方后台（巨量百应）比第三方数据平台更实时精准；通过RPA工具可以将对标视频的采集过程自动化，将数据资产沉淀为可复用的素材库，尤其“低粉高销量”的黑马账号更值得小达人学习。
  depth: medium
  suggested_destination: kb_entry
  possible_shape: kb
  risks:
  - 时效性
  - 工具依赖性强
  - 格式预处理
  screening_conclusion: retain
  reason: 介绍了获取精准行业爆款视频数据的新渠道和自动化方法，将RPA工具应用于内容创作的特定场景，对专注短视频带货的读者有直接的实操启发，可作为知识库中的工具方法条目。
- file_path: docs/202301-02/CZPydiVmgo2odMx0nWecf3DTn6e.md
  title: 「抖音SEO」2天线下大课圆满结束
  summary: 这是一篇抖音SEO陪跑计划的线下课程总结，重点宣传了课程“理论+实操”的模式、选词定生死的重要性，并列举了学员（留学业务、实体店）在课程当天通过优化关键词快速获得搜索流量的成功案例。
  core_question: 抖音SEO是什么，为什么它对绝大多数商家而言仍是蓝海机会，以及如何通过选词和优化细节快速见效？
  key_judgment: 抖音搜索流量存在巨大蓝海（70%为蓝海词），做好SEO的关键是选对词和优化视频细节，效果快且持久，能解决商家“流量不稳定”和“获客精准度低”的核心痛点。
  depth: medium
  suggested_destination: course_unit
  possible_shape: course
  risks:
  - 商业推广性质
  - 内容重复
  - 口语化
  screening_conclusion: demote
  reason: 内容主体是线下课程的宣传复盘，核心观点（抖音SEO是蓝海、选词关键、效果快）在其他素材中可能被更系统性地阐述，但其中关于“选词定生死”和“细节决定成败”的案例仍有参考价值，适合作为课程中的一个宣传案例或知识点补充。
- file_path: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
  title: 卖空气，需求分析与做局盈利！
  summary: 作者基于个人开发者视角，分享了“非规范化生产”的理念：通过“卖空气”（卖预期/概念）的方式，利用软件（或伪装成软件的软文）结合SEO技术，精准筛选用户并建立信任，从而实现盈利的野路子方法论。
  core_question: 个人开发者（或小团队）如何不依赖复杂技术，通过挖掘需求、撰写软文和“做局”套话，以极低成本实现盈利？
  key_judgment: 软件的本质是软文，可以通过营销策略（如“虚假攻略”、“包装APP”）制造“专业”的假象来获取流量和信任；核心是围绕用户问题部署产品，并利用“居高临下”的套话策略套取市场信息和解决方案。
  depth: high
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 观点具有投机性
  - 道德风险
  - 口语化
  screening_conclusion: retain
  reason: 内容系统性地阐述了一套不同于常规“产品-开发-推广”的逆向、低成本个人开发者生存哲学，包含需求分析、软文策略、过审技巧等独特观点，有思想深度，适合整理为非规范化创业/开发主题下的独立章节。
- file_path: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
  title: 线上美业，不到2万成本到变现过百万
  summary: 93年女孩夕子分享自己利用医学专业背景，从替同事代购医美面膜（一单赚2元）起步，通过知乎问答、小红书内容引流，逐步建立私域，最终实现年利润过百万并创立自有品牌的线上美业创业历程。
  core_question: 零生意基础的人如何利用专业知识和极低成本，从0到1在线上美业领域实现成功创业并持续增长？
  key_judgment: 成功关键在于：将专业能力转化为产品（服务与选品），私域运营中要聚焦高客单价的“专业价值”而非低毛利团购；在扩大流量时，应通过学习和复制成功者的SOP来实现内容生产的标准化。
  depth: high
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 个人成功案例
  - 部分内容为招商宣传
  - 时间跨度长
  screening_conclusion: retain
  reason: 这是一个从个人专业出发、白手起家的完整创业案例，详细记录了从0到1、从1到10的不同阶段的关键决策（选品、内容、私域），尤其是对“专业价值变现”和“标准化赋能合伙人”的思考，具有故事性和方法论价值。
