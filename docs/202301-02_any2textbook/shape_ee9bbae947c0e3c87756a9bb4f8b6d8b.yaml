best_shape: book
reason: 素材在'个体赚钱/轻创业'母题下高度聚焦，13篇留存内容覆盖了底层逻辑（千万项目、IP风骨、副业复盘）、方法论（私域裂变、文案写作、团队搭建）和实战案例（美业、TikTok、抖音自动化），内容深度普遍为high，且存在'底层逻辑→具体方法→团队交付'的递进扩写空间，足以支撑6-10章的系统成书结构，目标读者（想低门槛起步的创业者/副业人群）明确。
not_recommended_shapes:
- course
- knowledge_base
not_recommended_reasons:
- 素材是跨案例、跨项目的复盘与思维框架为主，缺乏统一的讲授顺序和学习路径，强行转课程需要重构大量内容，且每篇已可自成章节反复阅读，成书后自然保留其讲授价值。
- 素材虽主题多样但共同指向'个体赚钱'单一线索，不具备多主题并行、持续维护的检索价值（如AI绘画、抖音SEO等散点已下沉或排除），建库会稀释主线且维护成本高。
if_force_book_need: 需补充必要的概念定义（如私域裂变、自动化玩法的基础机制）和进阶演绎章节（从案例到可复制模板的提炼），同时将20230207_01等medium深度素材扩展为操作步骤和适用场景，并增加开篇范式说明（本书适用人群与使用方法）维持体系厚度。
