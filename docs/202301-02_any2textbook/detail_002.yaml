  name: 三大杠杆与防踩坑三不碰 —— 放大优势、过滤风险
  points:
  - '**为什么需要这个概念？**'
  - '- 项目拆解清楚了，但个人能力有限，单打独斗做不大'
  - '- 同时，副业项目鱼龙混杂，不具备风险识别标准容易踩坑'
  - '- 需要一边用杠杆放大能力边界，一边用红线过滤掉高危项目'
  - '**核心定义**'
  - '- 三大杠杆指：人力杠杆、技术杠杆、资源杠杆'
  - '  - 人力杠杆：通过雇佣、外包或合伙放大产出'
  - '  - 技术杠杆：用工具、脚本、系统自动化替代重复手工'
  - '  - 资源杠杆：利用行业人脉、供应商、渠道等存量资源撬动更大业务'
  - '- 防踩坑三不碰：重资产不碰、搞不懂不碰、不喜欢不碰'
  - '  - 重资产不碰：避免囤货、高启动成本、资金链脆弱型项目'
  - '  - 搞不懂不碰：商业模式看不透，等于盲投'
  - '  - 不喜欢不碰：缺乏兴趣难以坚持，也无法持续投入'
  - '**关键性质**'
  - '- 杠杆的本质是以小博大，让有限时间/资金产能放大'
  - '- 三不碰是底线过滤器，任何好项目先过红线，再谈策略'
  - '- 杠杆是有代价的，使用时要算清边际成本是否划算'
  - '**典型例子**'
  - '- 人力杠杆：招 1 个剪辑兼职，日更视频数量由 1 条翻到 3 条'
  - '- 技术杠杆：用 python 脚本自动定时发布图文，省去每天 1 小时重复操作'
  - '- 三不碰应用：某加盟奶茶项目需 20 万加盟费，属重资产，一票否决；某快团团卖货逻辑搞不清不碰'
  - '**边界条件**'
  - '- 杠杆需要一定的管理能力，否则团队成本和混乱抵消效率增益'
  - '- 三不碰是过滤标准但不是唯一标准，过线的项目仍要做详细拆解'
  - '- 若某个项目极具成长性且资源充沛，重资产也可以考虑，但须知风险'
