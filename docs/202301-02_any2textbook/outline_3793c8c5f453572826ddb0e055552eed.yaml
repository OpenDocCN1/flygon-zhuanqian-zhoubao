- 'no': 1
  name: 平台生态与流量入口 —— 先选“池塘”再谈“钓鱼”
  desc: 本章通过四个短视频/内容平台的实战案例，带你理解不同平台的流量分发逻辑、用户特征与变现路径，帮助你建立“平台选择优先于内容生产”的决策框架。
  nodes:
  - 'no': 1
    name: 平台红利的定义与识别
    desc: 用“风口”类比理解：新平台或新账号阶段往往存在结构性流量扶持，是入局的第一决策变量。
    role: motivation
    src:
    - paper: Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    - paper: AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 2
    name: 四大平台流量分发机制对比
    desc: 系统对比抖音、视频号、公众号、小说推文平台的流量分发逻辑、用户画像与变现路径差异。
    role: definition
    src:
    - paper: QbBKdHvfiofIUNxDlmjceWbfnqh.md
    - paper: ZcEdd0xTCo1K5IxwCyLccKUynOb.md
    - paper: Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    - paper: AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 3
    name: 平台红利验证案例：视频号10天变现复盘
    desc: 以“29.9元客单价佣金12块”为例，展示新号流量扶持如何转化为实际收益，验证平台红利假设。
    role: experiment
    src:
    - paper: Lg2vd5GWHoqhBbxuT5LcThEpncb.md
  - 'no': 4
    name: 平台红利的时效性与局限性
    desc: 平台红利并非永久，新号扶持期过后如何维持流量，以及矩阵操作带来的边际成本递增问题。
    role: limitation
    src:
    - paper: Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    - paper: AmKRdF2Z9oQjDExxxuAc18a5nbb.md
- 'no': 2
  name: 转化路径设计 —— 打通公域到私域的“管道”
  desc: 本章聚焦内容平台与私域载体之间的流量转化链路，从公转私、关键词铺设到自动回复承接，教你系统设计流量变现的“管道工程”。
  nodes:
  - 'no': 1
    name: 公转私的本质与价值
    desc: 以“管道”类比理解：公域流量如同自来水，私域载体如同蓄水池，转化入口是连接两者的管道。
    role: motivation
    src:
    - paper: QbBKdHvfiofIUNxDlmjceWbfnqh.md
  - 'no': 2
    name: 五大转化入口的形式化
    desc: 系统归纳主页链接、评论跳转、私信卡片、直播小风车、抖音群五类转化触点的功能与适用场景。
    role: definition
    src:
    - paper: QbBKdHvfiofIUNxDlmjceWbfnqh.md
  - 'no': 3
    name: 关键词铺设与自动回复承接
    desc: 公众号矩阵案例中的关键词铺设+自动回复承接组合打法，实现搜索流量的批量获取与筛选。
    role: method
    src:
    - paper: AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 4
    name: 转化路径能力与账号资质正相关
    desc: 账号资质等级越高（蓝V/半蓝V），可用的跳转与转化路径越丰富，验证官方背书的价值。
    role: proof
    src:
    - paper: QbBKdHvfiofIUNxDlmjceWbfnqh.md
  - 'no': 5
    name: 官方功能优先于第三方工具原则
    desc: 优先采用平台官方功能（如官方卡片、自动回复）可降低风控判定概率，是长线运营的安全底线。
    role: method
    src:
    - paper: QbBKdHvfiofIUNxDlmjceWbfnqh.md
  - 'no': 6
    name: 转化路径的局限与风控挑战
    desc: 防封须同时针对抖音端和微信端两端考量，转化路径再丰富也无法完全规避平台风控风险。
    role: limitation
    src:
    - paper: QbBKdHvfiofIUNxDlmjceWbfnqh.md
- 'no': 3
  name: 内容生产策略 —— 从“选题”到“爆款”的工业化流程
  desc: 本章拆解内容生产的核心方法论：从选品/选文的垂直化原则，到改文套路化、剪辑标准与追热点的伪原创生产，建立可复制的内容流水线。
  nodes:
  - 'no': 1
    name: 内容生产中的差异化选品
    desc: 用“开矿”类比理解：蓝海是尚未被过度开采的富矿，死海则是已被挖空的贫矿，选品决定内容变现的起点。
    role: motivation
    src:
    - paper: Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    - paper: ZcEdd0xTCo1K5IxwCyLccKUynOb.md
  - 'no': 2
    name: 选文垂直化的定义
    desc: 围绕作者和专栏两个维度保持选文主题聚焦一致，是小说推文项目的绝对核心。
    role: definition
    src:
    - paper: ZcEdd0xTCo1K5IxwCyLccKUynOb.md
  - 'no': 3
    name: 改文四步法
    desc: 提取关键词→概括核心剧情→适当改编→精简篇幅，将长篇小说改写成适配短视频的脚本。
    role: method
    src:
    - paper: ZcEdd0xTCo1K5IxwCyLccKUynOb.md
  - 'no': 4
    name: 剪辑制作五维标准
    desc: 从配音、音色、背景素材、背景音乐、智能字幕五个维度建立制作质量标准，保证内容的一致品质。
    role: method
    src:
    - paper: ZcEdd0xTCo1K5IxwCyLccKUynOb.md
  - 'no': 5
    name: 追热点伪原创内容生产
    desc: 对热门文章进行改写、重组或视角变换，生成符合平台审核要求的高效内容生产方式。
    role: method
    src:
    - paper: AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 6
    name: 追热点核心竞争要素定理
    desc: 追热点的成败不在于发文速度，而在于对平台搜索算法的理解和变现路径的设计。
    role: proof
    src:
    - paper: AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 7
    name: 选文是项目绝对核心
    desc: 选文的重要度高于改文、剪辑、发布等其他环节，内容源头决定流量天花板。
    role: proof
    src:
    - paper: ZcEdd0xTCo1K5IxwCyLccKUynOb.md
- 'no': 4
  name: 生命周期运营 —— 从“起量”到“收割”的节奏控制
  desc: 本章聚焦内容发布前后与转化收割阶段的运营节奏，包括5s完播率优化、发布策略、直播收割打法与矩阵放大，教你掌握内容变现的“节拍器”。
  nodes:
  - 'no': 1
    name: 5s完播率的决定作用
    desc: 用“第一印象”类比：视频前5秒的表现决定用户是否继续观看，是内容能否起量的生死线。
    role: motivation
    src:
    - paper: ZcEdd0xTCo1K5IxwCyLccKUynOb.md
  - 'no': 2
    name: 5s完播率的定义与优化
    desc: 将文章精彩部分前置呈现，通过改文策略系统性提升前5秒留存率。
    role: definition
    src:
    - paper: ZcEdd0xTCo1K5IxwCyLccKUynOb.md
  - 'no': 3
    name: 发布与引导的节奏策略
    desc: 以发布前活跃、维护评论区、发布后造互动、及时引导为时间线的运营节奏，最大化每条内容的转化效率。
    role: method
    src:
    - paper: ZcEdd0xTCo1K5IxwCyLccKUynOb.md
  - 'no': 4
    name: 直播收割的基本打法
    desc: 场观过万即开播、扒核心话术、购买样品，以最低成本验证直播转化模型。
    role: method
    src:
    - paper: Lg2vd5GWHoqhBbxuT5LcThEpncb.md
  - 'no': 5
    name: 视频加工与矩阵放大
    desc: 视频处理流程（放大→翻转→BGM→加字）加上对标账号筛选标准，可实现内容的批量复制与矩阵分发。
    role: extension
    src:
    - paper: Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    - paper: AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 6
    name: 矩阵热点变现的边界
    desc: 以单日净增4.5万粉丝、综合变现约1万元为例，展示矩阵操作的爆发力，同时提示其依赖热点周期、不可持续。
    role: limitation
    src:
    - paper: AmKRdF2Z9oQjDExxxuAc18a5nbb.md
