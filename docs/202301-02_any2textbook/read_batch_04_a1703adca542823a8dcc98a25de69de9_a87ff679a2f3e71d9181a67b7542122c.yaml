  reason: 内容极其具体且有实操数据支撑，包含完整的项目拆解（定位、用户、竞对、本地化）和开发方法论，对读者理解TikTok娱乐直播生态和项目复制逻辑有重要价值。时效性风险较高但方法论价值仍在，可作为章节核心素材。
- file_path: docs/202301-02/HfJEd0huioyShvxowVfcOMQYnHb.md
  title: 心理卡点：不敢打广告，打完广告不出单好自闭，怎么办？
  summary: 作者七小针对自媒体新手常见的‘打广告心理障碍’，从认知层面拆解了不敢打广告的三大原因（不认可产品价值、不理解人际关系、不理解广告本质），并系统给出了破除方法和广告后无成交的检查清单与心态调整策略。
  core_question: 如何破除新手在打广告时的心理卡点，建立正确的广告认知，并理性应对广告无成交的挫败感？
  key_judgment: 广告的本质是‘放大’和‘筛选’，不是骚扰。关键在于分清社交关系的不同象限，将无效关系与目标客户区分对待，并认识到成交是长期信任建设和多次触达的结果，而非单次广告的必然反应。
  depth: medium
  suggested_destination: chapter
  possible_shape: handbook
  risks:
  - 重复
  screening_conclusion: retain
  reason: 它精准解决了新手在营销环节的普遍心态卡点，提供了从认知重建到实操检查的完整闭环。虽然深度为中等，但与‘从0到1’阶段高度匹配，适合作为手册式章节的内容，实用性极强。
- file_path: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  title: IP如何做到风骨体面且年入千万
  summary: 内容经纪公司创始人刘梦园系统分享了一个内容型IP从0到年入千万的五大步骤：夯实内外部地基、规划内容体系（四级架构/独创理论/百问百答等）、设计千万营收模型、制定年度节点规划并进行落地。结合了其‘星云IP计划’的实战经验。
  core_question: 一个在垂直领域有积累的新手，如何体系化地打造一个既能保持专业风骨又能实现年入千万的商业化IP？
  key_judgment: IP打造的最高境界是‘风骨与变现并存’。其核心不是单一技巧，而是基于母题和独创理论构建的内容护城河、基于文化资产沉淀的长期价值，以及通过经纪人模式整合生态资源实现多维变现的系统工程。反对单纯追逐爆款和同质化路径。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 口语化
  - 格式预处理
  screening_conclusion: retain
  reason: 这是一份极其详尽的IP操盘级方法论，覆盖从定位、内容到变现模型的完整体系，具有极高的行业深度和战略价值。虽然部分内容偏口语化且有作者个人业务植入，但其理论框架（如4级内容架构、3重身份、营收模型）具有普遍指导意义，是高端IP打造章节的绝佳核心素材。
- file_path: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
  title: 万字复盘:普通职场人，下班时间靠拆解，7年拆了500个项目，复制成功30+，副业收入破百万
  summary: 私域运营老兵秦汉唐复盘了自己7年通过拆解各平台商业案例，成功复制30+项目、副业收入破百万的经历。详细分享了从挖掘项目、拆解八步法、建立赚钱情报体系、使用项目管理思维（策划案+执行案）到利用三大杠杆放大收入的完整方法论及防坑指南。
  core_question: 普通职场人如何利用碎片时间，通过系统的商业拆解方法论，挖掘、验证并复制可持续盈利的副业项目？
  key_judgment: 副业成功的关键不是原创和All in，而是建立一套‘后发制人’的情报挖掘与拆解体系。通过喂养算法获取案例、八步拆解评估可复制性、用项目管理思维确保执行闭环，并以人为/技术/资源杠杆实现规模化，可以大幅度降低试错成本并稳定变现。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 重复
  screening_conclusion: retain
  reason: 这篇文章是全书‘副业项目挖掘与复制’主题的基石材料。它不仅有真实案例，更重要的是提供了从战略层面（赛道/渠道）到战术执行层面（拆解八步/项目管理/杠杆）的全套可操作方法，是含金量极高的实操指南。
- file_path: docs/202301-02/IpCcdJ9NAoAt4pxKKV5c5sfenZc.md
  title: 小红书资料号一周：涨粉6000+ 变现3w+ 实操复盘
  summary: 作者分享了自己作为小红书新手，通过做‘资料号’一周内涨粉6000+、变现3w+的实操复盘。内容涵盖赛道选择、选题挖掘、封面打造、标题技巧、钩子设置、评论引爆和私域导流等完整链路，并强调‘用户心动’的核心思维。
  core_question: 小红书新手如何在竞争中找到一条简单可复制且能快速变现的路径？
  key_judgment: 资料号的核心不是点赞收藏，而是高转化的评论和私域引流。成功关键在于选择竞争小的细分蓝海（如英语类资料）、复制经过验证的爆款钩子以及通过引导评论制造羊群效应。内容生产并非体现‘原创能力’，而是体现基于市场的‘重复与迭代’能力。
  depth: medium
  suggested_destination: case
  possible_shape: course
  risks:
  - 时效性
  - 口语化
  - 重复
  screening_conclusion: retain
  reason: 这是对匿名项目拆解中‘资料号’案例的极佳补充，侧重具体平台操作细节和流量玩法。虽然时效性风险高（平台规则变化快），口语化严重，但其拆解的实操步骤（如找蓝海、做钩子）对新手有极高的学习价值，故保留为案例素材。
