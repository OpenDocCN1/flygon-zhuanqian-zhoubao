- 'no': 1
  name: 私域的本质 —— 从“流量”到“留量”
  desc: 本章首先重构销售额公式，揭示“复购”对于商业增长的核心价值。通过对比公域与私域，引出私域作为“长远而忠诚的客户关系”的定义，并进一步提出“私域价值密度”这一衡量指标，为后续的冷启动策略奠定理论基础。
  nodes:
  - 'no': 1
    name: 被忽视的增长引擎：销售额公式重构
    desc: 从经典的销售额公式（客户数×客单价×购买频次）出发，通过分析各要素的权重，指出在存量竞争时代，“复购（购买频次）”远比“拉新（客户数）”更重要，为理解私域价值提供动机。
    role: motivation
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
  - 'no': 2
    name: 定义私域：长远而忠诚的客户关系
    desc: 给出私域的操作性定义，将其与一次性买卖的公域流量进行区分，强调其核心在于“信任度”与“粘性”，而非简单的“好友数量”。这是在概念上明确研究对象。
    role: definition
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
  - 'no': 3
    name: 私域价值密度定理：好友数量≠成交额
    desc: 提出并阐述“私域价值密度”这一评估维度，论证“有信任度有粘性的好友远胜过泛泛之交”的核心观点。这为衡量私域资产质量提供了量化视角，是对定义的深化。
    role: method
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
- 'no': 2
  name: 冷启动三法 —— 找到你的第一批“种子用户”
  desc: 本章聚焦于实操策略。基于“群红优于网红定理”，提出了普通人启动个人品牌的三大路径：公域知识营销、社群群红、抱大腿。本章将详细拆解每种方法的适用场景与核心逻辑，并引入“站台产品”概念来构建商业闭环。
  nodes:
  - 'no': 1
    name: 为什么是“群红”而非“网红”？
    desc: 阐述“群红优于网红定理”，指出普通人冷启动应选择有限竞争的社群环境，而非无限竞争的开放平台。这为选择具体的冷启动方法提供了战略指导（动机）。
    role: motivation
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
  - 'no': 2
    name: 冷启动三法之一：去公域做知识营销
    desc: 详细介绍第一种方法，即在公域平台（如社交媒体）通过输出专业知识吸引初始关注，并将公域流量导向私域池。
    role: method
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
  - 'no': 3
    name: 冷启动三法之二：去社群做“群红”
    desc: 详细介绍第二种方法，即在目标用户聚集的垂直社群中，通过持续提供价值建立个人影响力，成为该社群的“意见领袖”。
    role: method
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
  - 'no': 4
    name: 冷启动三法之三：抱大腿提供可交换价值
    desc: 详细介绍第三种方法，即通过与已有资源的“大腿”合作，以自身可提供的价值（如技能、服务）进行交换，借助对方势能完成冷启动。
    role: method
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
  - 'no': 5
    name: 设计产品矩阵：从引流转化的“站台产品”
    desc: 引入“站台产品”概念，说明为何要设计高客单价产品。它虽非主要盈利来源，但可以拉高品牌力，并为承接其他流量和产品提供信任背书，是冷启动获客之后的转化关键。
    role: extension
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
- 'no': 3
  name: 裂变增长 —— 从“单点突破”到“指数传播”
  desc: 本章深入探讨用户增长的核心引擎——裂变。首先剖析单一用户裂变模型的固有缺陷（裂变断层），然后提出“团队+用户”裂变的叠加解法（战队PK），最终实现自下而上的圈层扩散与自上而下的利益驱动相结合的增长飞轮。
  nodes:
  - 'no': 1
    name: 单一用户裂变的瓶颈：裂变断层
    desc: 分析传统纯用户裂变模型失效的原因，揭示“裂变断层”现象：分享行为通常仅发生在激发层，而无法有效传导至第三层。这解释了为何许多裂变活动效果不佳（动机）。
    role: motivation
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
  - 'no': 2
    name: 用户裂变：自下而上的圈层扩散
    desc: 定义用户裂变的概念，阐述其依赖社交网络网状结构、讲究圈层效应的传播逻辑。这是两种基本裂变模式中的一种，其核心驱动力是社交关系。
    role: definition
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
  - 'no': 3
    name: 团队裂变：自上而下的利益驱动
    desc: 定义团队裂变的概念，详细说明其“自上而下”的推荐关系与“躺赚”逻辑，并指这种模式常见于微商团队，通过明确的层级结构驱动增长。
    role: definition
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
  - 'no': 4
    name: 裂变断层的最优解：战队PK玩法
    desc: 基于前面对两种裂变模式优缺点的分析，提出“团队裂变+用户裂变叠加（战队PK）”的综合解法，阐述其如何同时激活社交传播与利益驱动，从而有效地突破三层裂变断层。
    role: method
    src:
    - paper: VAA8dQLTZolMlJx1jxrcKaPrnzd.md
