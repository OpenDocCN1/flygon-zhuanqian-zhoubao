paper: 小说推文精细化运营
desc: 该素材系统性地提出了一套小说推文项目的精细化运营方法论，从选文、改文、剪辑、发布到日常维护五个环节给出可操作的标准和套路，核心主张是选文为项目绝对核心，并以提高5秒完播率为改文抓手。
concepts:
- name: 选文垂直化
  desc: 指围绕作者和专栏两个维度保持选文主题的聚焦与一致，是项目绝对核心的前置策略。
  is_original: true
  excerpt:
  - 选文垂直化：选文是项目绝对核心。作者垂直（关注8-10个优质作者）、专栏垂直（锁定同主题专栏）。
- name: 5s完播率
  desc: 衡量视频前5秒能否留住观众的指标，改文套路化的核心目标，通过在开头呈现精彩部分来提升。
  is_original: true
  excerpt:
  - 改文套路化：提高5s完播率，把文章精彩部分在开头呈现。
- name: 改文套路化
  desc: 通过提取关键词、概括核心剧情、适当改编和精简篇幅四步，将原文改编为适合短视频呈现的文本套路。
  is_original: true
  excerpt:
  - 提取剧情关键词（准确、简洁、可读）、概括核心剧情（分清主次）、适当改编（加修饰词调动情绪）、精简篇幅。
- name: 日常复盘
  desc: 每日从内容、粉丝、策略三个层面进行数据分析与迭代的维护机制。
  is_original: true
  excerpt:
  - 每日复盘（内容分析、粉丝分析、策略分析）
methods:
- name: __overview__
  desc: 小说推文精细化运营的完整闭环方法论，覆盖选文、改文、剪辑、发布、维护五个环节。
  excerpt:
  - 选文垂直化 → 改文套路化 → 剪辑制作 → 发布策略 → 日常维护
- name: 选文判断标准
  desc: 从代入感、情感调度、剧情安排、社会意义四个维度判断好文章的选文筛选方法。
  excerpt:
  - 判断好文章标准：身临其境的代入感、强有力的情感调度、扣人心弦的剧情安排、引人回味深思的社会意义。
- name: 改文四步法
  desc: 将长文改编为短视频脚本的四步操作流程，目标是提升5秒完播率。
  excerpt:
  - 提取剧情关键词（准确、简洁、可读）→ 概括核心剧情（分清主次）→ 适当改编（加修饰词调动情绪）→ 精简篇幅
- name: 剪辑制作标准
  desc: 文本配音、音色、背景素材、背景音乐、智能字幕五个维度的具体操作规范。
  excerpt:
  - 文本配音（直接配音、拼接配音）、音色选择（温和女声）、背景素材（游戏录屏、街头小吃等）、背景音乐（匹配文章节奏）、智能字幕（朴素清晰）。
- name: 发布与引导策略
  desc: 以发布前中后为时间线循环的发布与运营节奏，含点赞互动、评论区维护和评论引导操作。
  excerpt:
  - 发布前提前上线活跃、维护评论区（回复评论、主动发起话题、清理评论区）、发布后看视频造互动、及时引导（主动评论引导、热门互动引导、私信引导）。
- name: 关键词设定要点
  desc: 为搜索匹配和避开审核而制定的关键词设定原则。
  excerpt:
  - 组词简单通俗易懂、与文章情节有关、避免敏感词。
theorems:
- name: 选文是项目绝对核心
  desc: 核心主张：在小说推文项目中，选文环节的重要性超过改文、剪辑、发布等其他环节，是决定项目成败的第一要素。
  excerpt:
  - 选文是项目绝对核心。
- name: 开头定生死：完播率由开头决定
  desc: 核心主张：视频前5秒的表现决定了用户是否会继续观看，因此必须把文章最精彩的部分前置呈现。
  excerpt:
  - 提高5s完播率，把文章精彩部分在开头呈现。
- name: 心态决定长期运营成败
  desc: 核心主张：精细化运营的成功依赖持续输出和良好的心态管理，需明确定位、放低预期并持续试错。
  excerpt:
  - 保持良好心态（明确定位放低预期、不断试错积攒经验）。
- name: 情绪是改编的核心杠杆
  desc: 核心主张：改编的核心并非压缩内容，而是通过修饰词等技术手段放大情绪调动能力。
  excerpt:
  - 适当改编（加修饰词调动情绪）
findings:
- name: 结构化运营流程的有效性
  desc: '[claim] 素材宣称将运营拆分为选文、改文、剪辑、发布、维护五大环节即可实现精细化；但未提供数据或案例支撑该结论。'
  excerpt:
  - 小说推文项目精细化运营方法论。
- name: 完播率与改文策略关联
  desc: '[claim] 素材宣称通过将精彩内容前置到开头可以直接提高5秒完播率，但未给出实验数据或对照结果。'
  excerpt:
  - 改文套路化：提高5s完播率，把文章精彩部分在开头呈现。
- name: 具体操作规范可迭代性
  desc: '[claim] 素材宣称频繁发布（日更）结合每日复盘能够带来运营效果提升（产出稳定内容），但未给出相应数据验证；同时作者将垂直选文的8-10位作者数量作为经验性结论。'
  excerpt:
  - 选文垂直化：作者垂直（关注8-10个优质作者）
  - 日常维护：坚持日更、活跃账号、每日复盘（内容分析、粉丝分析、策略分析）
