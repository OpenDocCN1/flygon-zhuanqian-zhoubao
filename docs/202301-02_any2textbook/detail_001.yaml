  name: 防踩坑三不碰 —— 守住副业安全底线的“防火墙”
  points:
  - '**为什么需要这个概念？**'
  - '- 有些项目看似赚钱，实则暗藏风险'
  - '- 需要有明确的过滤器来排除不良项目，保障安全'
  - '**核心定义**'
  - '- 防踩坑三不碰：三种特定类型的项目应当不碰（注：具体三种类型见原素材），作为项目过滤定理'
  - '**关键性质**'
  - '- 过滤性：用于在项目评估早期快速排除风险项'
  - '- 安全性：核心目的是守住副业的安全底线（合规、资金安全）'
  - '**典型例子**'
  - '- 某类项目依赖灰色流量或违规操作，短期有收益但长期有法律风险，应不碰'
  - '- 某类项目需要大量前期垫资且无保障，应不碰'
  - '**边界条件**'
  - '- 三不碰是底线，不等于满足条件就是好项目，仍需结合六要素评估'
  - '- 过滤条件随政策和平台规则变化需动态更新'
  sources:
  - paper: I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 防踩坑三不碰。
  - 项目过滤定理：守住安全底线的三条标准。
- 'no': 11
  name: 方法论合流 —— 六要素是体检，八步法是手术
  points:
  - '**为什么需要这个概念？**'
  - '- 第1章的六要素拆解是诊断工具，第2章的副业方法八步法是实操流程'
  - '- 需要将两者结合，形成完整的项目操盘能力'
  - '**核心定义**'
  - '- 六要素是体检：用以评估项目的健康状况、评估可复制性'
  - '- 八步法是手术：从发现项目到落地执行的全流程操作指南'
  - '**关键性质**'
  - '- 分工：六要素解决“做什么”，八步法解决“怎么做”'
  - '- 顺序：先用六要素筛选/体检项目，再用八步法制定和执行计划'
  - '**典型例子**'
  - '- 用喂养算法发现一个知识付费项目（八步法中的情报挖掘），先通过六要素体检“流量效率高、销转效率中等、交付效率高、客单价中等、毛利率中高、复购率中等”，总体合格，而后按八步法完成拆解和执行'
  - '**边界条件**'
  - '- 如果项目连六要素体检都不合格，不需要进入八步法流程'
  - '- 该方法论合流适用于具备基本商业常识操盘者'
  sources:
  - paper: NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: origin
  excerpts:
  - 六要素是体检，八步法是手术。
  - 方法论合流：诊断与执行结合。
