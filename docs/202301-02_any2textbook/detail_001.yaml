  name: 三大杠杆 —— 撬动副业规模的“阿基米德支点”
  points:
  - '**为什么需要这个概念？**'
  - '- 个人精力有限，副业规模要扩大必须借力'
  - '- 需要三个方向（人力、技术、资源）来撬动规模化'
  - '**核心定义**'
  - '- 人力杠杆：通过雇佣/外包他人来放大产能'
  - '- 技术杠杆：利用软件/自动化代替重复劳动'
  - '- 资源杠杆：借助已有渠道/人脉/资产获取放大效应'
  - '**关键性质**'
  - '- 三大杠杆可以将个人型副业转化为系统型生意'
  - '- 杠杆的实质是让单位时间创造更多价值'
  - '**典型例子**'
  - '- 人力杠杆：淘宝店雇客服处理售前售后，自己专注选品'
  - '- 技术杠杆：用自动化工具批量剪辑视频、批量发布，一人顶一个团队'
  - '- 资源杠杆：利用自有私域流量池（积累的粉丝）分销第三方产品'
  - '**边界条件**'
  - '- 杠杆的前提是项目本身经过验证，否则杠杆越大风险越大'
  - '- 技术杠杆需要一定的技术能力投入，门槛较高'
  sources:
  - paper: I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 人力、技术、资源三大杠杆。
  - 撬动副业规模的三大杠杆。
