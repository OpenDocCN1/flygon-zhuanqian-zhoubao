- 'no': 6
  name: 副业迷思 —— 打破“原创与All in”的直觉陷阱
  points:
  - '**为什么需要这个概念？**'
  - '- 许多做副业的人认为必须原创才能成功、必须All in才能专注'
  - '- 这两种迷思会导致失败率极高'
  - '**核心定义**'
  - '- 原创迷思：认定只有从零开始原创的想法才值得做'
  - '- All in迷思：认为必须投入全部精力和资金才可能成功'
  - '**关键性质**'
  - '- 原创不等于有效，缺乏验证的项目风险极高'
  - '- All in会放大试错成本，一旦失败就难以翻身'
  - '**典型例子**'
  - '- 有人全职投入原创文创产品，结果市场不认可，损失惨重'
  - '- 有人原创自媒体内容，半年无流量；而搬运/二创的同类账号已积累上万粉丝'
  - '**边界条件**'
  - '- 在创意型顶尖领域（如纯艺术）原创依然重要，但不适用于普通副业操盘'
  - '- 个人已有雄厚资金储备时All in的风险相对可控，对于普通人不适用'
  sources:
  - paper: I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 打破原创即成功的直觉。
  - 打破All in即专注的直觉。
- 'no': 7
  name: 后发制人 —— 复制验证项目的“低成本入局”智慧
  points:
  - '**为什么需要这个概念？**'
  - '- 与其冒险原创，不如复制已经被验证成功的项目'
  - '- 降低试错成本，提高成功率'
  - '**核心定义**'
  - '- 后发制人：复制已验证成功的项目，再进行局部二次创作和优化'
  - '**关键性质**'
  - '- 安全性：项目已被市场验证，商业模式跑通'
  - '- 可优化性：在复制基础上可进行差异化改进'
  - '**典型例子**'
  - '- 观察某小红书博主用“图文+清单”形式带货大获成功，复制该形式做同类但不同品类的账号'
  - '- 某抖音号直播卖健身器材火爆，同城另一团队复制模板卖瑜伽用品'
  - '**边界条件**'
  - '- 后发制人要求足够快，如果赛道已极度饱和则不适合再入'
  - '- 纯复制不创新无法形成竞争壁垒，必须结合已有优势二次创作'
  sources:
  - paper: I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 复制已验证项目。
  - 后发制人：复制+二次创作。
