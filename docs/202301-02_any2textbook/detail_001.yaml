  name: 喂养算法与情报挖掘 —— 建立商业雷达的“两只触角”
  points:
  - '**为什么需要这个概念？**'
  - '- 副业需要持续获取“什么项目赚钱”的情报'
  - '- 被动等待灵感不可靠，需要主动建立情报体系'
  - '**核心定义**'
  - '- 喂养算法：主动让平台的算法推送更多商业相关的内容（如赚钱案例、项目拆解）'
  - '- 情报挖掘：系统性地发现和收集可复制的赚钱项目信息'
  - '**关键性质**'
  - '- 喂养算法是利用平台推荐机制，主动定向获取商业情报'
  - '- 情报挖掘是一种系统化方法，而非偶然发现'
  - '**典型例子**'
  - '- 在抖音连续搜索、点赞“副业项目拆解”“赚钱案例”等内容，使算法持续推送同类高质量商业项目案例'
  - '- 关注行业资讯、电商数据平台，挖掘畅销品类和高增长赛道'
  - '**边界条件**'
  - '- 算法喂养的前提是算法本身推荐逻辑可被引导，不适用信息封闭的渠道（如线下人脉）'
  - '- 情报挖掘需要辨别信息质量，不能盲目相信流量数据'
  sources:
  - paper: I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 喂养算法：让算法推送商业内容。
  - 情报挖掘：建立商业雷达。
