  - '- 框架只是工具，不能迷信'
  - '- 需要明确工具的局限，避免误判'
  - '**核心定义**'
  - '- 六要素拆解法有特定适用场景，需要警惕及格线带来的幻觉'
  - '**关键性质**'
  - '- 及格线幻觉：某项目六要素评分刚好达及格线，但不代表该项目值得投入，因为缺乏综合评估'
  - '- 框架简化了现实，可能遗漏外部变量（如政策、竞争）'
