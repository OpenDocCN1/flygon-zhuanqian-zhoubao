  - '**边界条件**'
  - '- 当项目涉及政策监管、非市场化资源时，不适合六要素评估'
  - '- 当行业天花板极低时，即使六要素全部高分也不值得投入'
  - '- 框架适用于成熟项目诊断，不适用于创新型早期项目'
