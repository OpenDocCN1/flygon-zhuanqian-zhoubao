- file_path: docs/202301-02/20230207_11.md
  title: 221115 龙哥赚钱周报
  summary: 一份汇编周报，核心内容围绕垂直IP获取精准客户的策略、产品idea的来源，以及多个平台（抖音、视频号、小红书、快手等）的引流和变现实操案例。
  core_question: 如何低成本、高效地获取精准客户，并选择和验证一个有成功潜力的产品或项目？
  key_judgment: 垂直IP应以SEO思维获取精准搜索流量，而非追逐平台爆款；产品idea最成功的来源是解决自身问题（原生idea），其次是基于被验证的成功竞品进行差异化改进。
  depth: medium
  suggested_destination: kb_entry
  possible_shape: kb
  risks:
  - 时效性
  - 格式预处理
  screening_conclusion: retain
  reason: 提供了关于垂直IP商业模式和产品创新的底层方法论，并包含了多个平台的具体实操案例，作为知识库素材价值较高。
