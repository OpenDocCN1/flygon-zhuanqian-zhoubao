  content: 继续抽取训练营和股权分配的概念，以及补充案例素材
  tool_calls:
  - index: 0
    id: call_b4b75e75ae0e4587b5028ae7
    function:
      arguments: '{"paper_name": "从零到一打造高质量交付训练营", "paper": "打造高交付质量训练营的心法与干法。核心心法是\"高效率交付才能高质量交付\"。\n\n困境：要把学员教好就得花更多时间精力，花更多时间教学一线实战时间减少，一线实战减少业绩下滑教学内容可落地性变差。很多培训做不下去。\n\n解法一：把一份时间卖很多次。\n1v1是学员优先级最低的选项（耗费大量时间、重复回答、碎片化信息帮助有限）。\n具体做法：制作项目操作手册（系统性给出流程和具体动作，用来查）+直播讲解项目和操作手册（用来理解）+制作百问百答手册（供查阅）。如果经过直播+操作手册+百问百答还解决不了问题，再上1v1诊断。\n\n解法二：撬动学员的时间。\n优秀学员的经验分享：给其他学员信心、在怎么学上起榜样作用、更好氛围。对优秀学员本身：通过分享提高影响力、\"分享必爆\"、传递正能量。对老师：丰富课程释放时间精力。三方共赢。\n\n解法三：让学员意识到自己的责任。\n取消对后进学员的提醒工作（只会感动自己的无效工作）。开营前让学员意识到做出成果的责任在自己身上。设置打卡动作（每天写下执行动作、遇到的问题、复盘）。做到失败的唯一可能性就是学员自己放弃。\n\n干法：训练营分成招生和交付两个步骤。\n\n招生：获取生源、收款、课程运营。平台推荐：千聊（免费，但有风控冻结风险）、小鹅通（付费4800/版本）。\n\n交付方式：操作手册（飞书文档）、直播授课&录播回放（飞书直播）、打卡（飞书群）、交流（微信群）、百问百答（飞书文档）。\n\n操作手册写作技巧：按阶段给出信息（拆分要做什么、先后顺序、需要技能、需要时间，然后分阶段放出）+只给最少必要信息（学员完成一件事情只需掌握哪些信息，先掌握最少必要信息，先学会弹小星星再学乐理）。\n\n打卡模板：今日发布视频数量、昨日发布视频总播放量、昨日GMV、明日发布计划、遇到问题及如何解决、疑问。\n\n百问百答：问题源于微信群讨论、打卡群答疑、学员1v1诊断。按阶段分类，不按日期。若问题学员解决的，艾特出学员扩大影响力。"}'
      name: tool_ext_concepts
    type: function
  - index: 1
    id: call_dd7d6980c13a48429bcc5d7a
    function:
      arguments: '{"paper_name": "初创公司股权分配五步法", "paper": "初创公司科学量化股权分配的4C动态量化股权分配模型及五步法。\n\n4C含义：资本（人力资本+货币资本），细分为4个维度：创始人身份、岗位权重、时间投入、资金投入。\n\n各维度权重范围（经验值，需创始团队锚定共识）：\n1.创始人身份：10%-30%。谁承担最大风险，谁最有控制企业的需要。创始人身份极度明确，一家公司对外只有一个声音。\n2.岗位权重：30%-40%。行业技术壁垒在哪里，哪个岗位最重要。前期聊清楚避免后期拆伙（大多数合作伙伴拆伙就是觉得自己最重要出力最多但分钱不最多）。\n3.时间投入：10%-25%。全职vs兼职，投入精力大小。判断对项目的信心和风险承担。\n4.资金投入：20%-50%。前期资金投入，判断对项目的信心和风险承担。\n\n股权分配五步法：\n1.确定行业和赛道：技术驱动/资金驱动、自主创业/集团孵化（2个维度4个类型）。\n2.收集创始团队信息：创始人信息、其他联合创始人信息、谁全职、负责哪个岗位、各自出资额度。\n3.确定每个维度的权重比例：通过创始团队自评互评达成共识。4C工具前置逻辑。\n4.确定股东四个维度的权重系数：按1-10打分，分自评和他评。创始人身份代表风险承担（兜底的人）。容易分歧的维度是岗位分工和时间投入。\n5.计算各个股东的股权比例。\n\n注意：股权比例分配是最简单的环节，最终工商结果还需其他合同规范和调整：一致行动权、期权池、分红奖励、回购权、纯资金方投资优先清算权、领售权等。\n\n案例：儿童体能训练项目，3个合伙人，启动资金200万。小明（发起人，有经验，全职，出50万）、小磊（市场运营，全职）、小胡（国企，出资人，投150万，不出力）。最终通过五步法计算出各自的股权比例。"}'
