- role: tool
  tool_call_id: call_99557274d8e64ad290d29767
  content: '"# 小说推文进阶玩法，精细化运营所带来的稳定出单\n\n> 来源：[https://m1lpiqj5ed.feishu.cn/docx/ZcEdd0xTCo1K5IxwCyLccKUynOb](https://m1lpiqj5ed.feishu.cn/docx/ZcEdd0xTCo1K5IxwCyLccKUynOb)\n\n大家好，我是今年加入生财的某人周，一名工科出身的英语老师。年中开始就跟着
    干小说推文项目：在抖音等平台发布知乎的付费小说，引导观众去知乎开通盐选会员看后续，开通后推文博主获得佣金收益。\n\n目前我运营2个号，每天发布2-4条视频，每天从选文改文到剪辑发布投入的时间不超过1.5小时，单号每周收益在400左右，偶尔爆一篇赚几百上千，此外老视频的长尾流量还能细水长流地出单。\n\n这是我第一次在某个项目中投入这么多的时间，这里分享我通过精细化运营做到稳定出单的心得和理解，希望帮大家更深入全面地了解推文项目，以及给大家提供有价值的实操步骤。\n\n####
    本文主要写给有以下几种情况的小伙伴：\n\n*   尝试过小说推文，但遇到较多卡点的，这篇文章能解答不少常见问题，比如找文难、起号难、卡万播、转化率低、常违规等。\n\n*   仍在坚持小说推文，但没有条件规模化，打算专心运营1~3个左右账号的，这篇文章重点讲解了选文改文和剪辑制作，能够给你提供精细化运营的发力方向。\n\n*   有规模化运营小说推文的打算，但暂时没有完善SOP，这篇文章能给你的规模化运营提供一些思路，比如套路化改文、获取低重复素材等。\n\n首先讲一下小说推文项目的现状，推文项目已不再如上半年那么蓝海，在不断有个人、工作室进入的前提下，形成了“两个共存”的局面，即知乎、番茄、潇湘等多平台共存；配音、图文、真人等多种推文方式共存。\n\n对个人玩家来说，推文的主要卡点在于前期起号慢、正反馈不稳定，甚至是同一篇文章，别人发爆了我发平平无奇的情况，对心态影响很大。需要结合抖音的推荐机制，不断优化选文改文、剪辑制作和日常运营，不断提高视频爆款的概率；争取有一两篇爆款后，账号标签稳定、视频数据稳定、推流人群稳定，进入平稳阶段，项目体验会有显著改善。\n\n对工作室玩家来说，规模化的运营模式非常适合小说推文，个人运营2~3个号，工作室10个号起步，不仅是收益翻倍，爆文的概率也翻倍。如何把推文项目做得更大更好？发挥规模化的优势，更快铺新文争取爆款，采取更稳定可靠的起号流程，降低试错成本，使用更优质的文章和素材，提高视频平均质量；老号运营维护和新号冷启动两手抓。\n\n下面我将根据配音号的实操流程，从选文改文、剪辑制作、发布运营、日常维护四个方面展开，也可以根据左侧的目录直达想要了解的内容。\n\n##
    一、选文改文\n\n### 选文垂直化\n\n如同视频带货的选品，选文是小说推文项目的绝对核心。选文可分为两个步骤，首先是找到充足的、优质的文章来源，其次是筛选出符合账号定位、有爆文潜力的文章。\n\n####
    作者垂直，从优质作者到优质文章\n\n平台上的小说茫茫多，哪怕是借助工具批量筛选都看不过来，更不用提 “有哪些好看的xx文” 这种问题下几千上万个回答，更新频率高但质量良莠不齐，但有个点是不变的：文章都是作者写出来的。\n\n抓住了作者，就可以说抓住了稳定的文章来源。不需要经常去翻阅问题的新回答，把重心从问题上移到回答问题的人身上，作者是最稳定的文章产出。\n\n那么很显然，优质的作者=优质的文章来源，比如知乎上的巧克力阿华甜、白框凉太子、张若妤等等，人家是坐拥几十上百万粉丝专业的作者，对于创作热点、创作套路的理解比我们强，与其在问题回答下大浪淘沙，不如紧跟这些优质作者。\n\n关注8~10个符合账号定位的优质作者，在知乎-动态里可以看到他们每天点赞的文章、关注的问题、发布的回答还有他们关注的作者，顺腾摸瓜挨个找下去，根本缺文章来源，需要做的是对文章内容进行筛选。\n\n![](img/29b21dbcb8d32a3ccec484b336e5ffbd.png)\n\n![](img/8970452b1754fce77415b39bda08d622.png)\n\n![](img/67a6c74272ef853a4c0e076e75eb4ad2.png)\n\n关注好作者/专栏后，每天选定几个时间点
    “收菜” 就可以了，不仅能直观看到优质作者的最新动态、争取文章首发，还能捕捉盐选专栏动态，抢占关键词先发制人。\n\n#### 专栏垂直，优质文章的同类扩充\n\n作者是优质文章的生产者，而盐选专栏是优质文章的收纳库。专栏收纳的是同一主题或者同一作者的优质文章，相当于知乎的编辑事先帮我们筛选一遍。\n\n![](img/939cd807c390ddd034889f4305d32f46.png)\n\n每个专栏都有它的主题，比如下面这个《从校服到婚纱，少女暗恋成真》，看名字就知道专栏里的文章大多是青春校园主题的，而且最终结局还是HE(Happy
    Ending)，这个专栏就很适合我们筛选校园题材、受众是18~23岁女性的优质文章。\n\n再举个例子，10、11月起新号很好用的专栏《爽文女主她杀疯了》，有些文章发布当天就能上热门爆文，甚至过一周左右再发也能取得不错的市场反响。\n\n爽文就是追求说不敢说的话，做不敢做的事，怎么爽怎么来，从校园打脸到“反杀”亲戚都有，因此它的受众极广，特别是扮猪吃虎的套路百看不腻，大家都喜欢压抑后的打脸情节。\n\n总结，从专栏里选文章对账号的
    “垂直” 帮助很大，因为优质作者们很少会死磕某一类文章，我们也不可能只发一个作者的文章，但我们可以瞄准了一个专栏使劲薅。\n\n在我看来，专栏选文是对作者选文的补充：选中了作者的某篇优质文章后，查看该文章所属盐选专栏，再去专栏里筛选同类型的优质文章。\n\n####
    如何判断一篇文章好坏？筛选文章需要考虑哪些因素？\n\n知乎上的小说受限于篇幅、主题、平台等因素，一篇小说只能讲好一件事，其他所有剧情都围绕这个核心情节展开的。此外，知乎的小说通常会将核心剧情的概括及结果前置在小说开头，吸引读者注意。\n\n这里拿一篇家庭教育主题的虐文举例：\n\n我和同学起了冲突，老师叫了家长。\n\n我妈到了学校二话不说先给了我一巴掌，还把楼道里的窗户打开，让我去死。\n\n我没有犹豫，从六楼翻身一跃而下。\n\n我和同桌张雯雯课间操的时候打了起来，我扇了她耳光，她挠了我的脸。\n\n我俩同时被叫了家长。张雯雯的妈来得很快，一听说闺女被打了，\n\n「哎你这孩子怎么回事儿，有没有点教养？」张雯雯的妈松了口气，扭头拧眉看我。\n\n「你怎么能动手打同学啊，有什么事儿好好说不行啊？」\n\n林老师微微皱眉，刚想说话，就见我妈急匆匆地赶了过来。\n\n她穿着一身西装，手上还带着一沓文件，应该是刚开完会。\n\n我妈紧紧锁着眉，见了我的第一句话就是：「你能不能消停点？」\n\n这篇文章在盐选专栏内获得近万赞及1400+条评论互动，在抖音上不只一个号发这篇上热门爆单，不论新号还是老号，那为什么这篇家庭教育虐文能火？它包含了哪些能爆的潜质？\n\n简要分析一下剧情\n\n小说开头是一个非常具有代入感、许多人都经历过的场景，同学打架老师叫家长。犯了大错叫家长来协调，回家指定还有一顿骂；\n\n第二句话直接让人血压飙升，二话不说一巴掌，潜台词就是不分青红皂白，结合叫家长的场景，孩子在大庭广众下被打，不被理解的委屈、不甘、埋怨已经在心中激荡；\n\n紧接着第三句话，打开窗户让我去死，让人不自觉联想到20年一初中生被母亲当众扇耳光后跳楼的悲剧，不好的预感和悲伤到了一个极点；\n\n随后就是，没有犹豫一跃而下，正如那位从走廊一跃而下的男生，这是意料之内的悲剧，更是黄金5s开头的典型。\n\n总结一下，一篇好文章都有哪些特点？\n\n#####
    身临其境的代入感\n\n为什么许多架空小说的开头都是穿越？因为穿越能在读者和主角之间创造一种连接：我们都是地球人；为什么知乎小说绝大多数都是第一人称？都是为了增加代入感，代入感是继续阅读的前提条件。\n\n我说某打工人中了彩票大奖挥霍无度能有代入感，因为打工人完全有中彩票的可能性，甚至下一个就是你我；但如果我说某打工人起床去火星救了太阳系公主，然后出走银河系统一宇宙，你只会觉得太离谱太扯淡了。\n\n#####
    强有力的情感调度能力\n\n好的小说一定能让读者和文中角色产生共情，随着剧情发展，读者会因为文中角色的遭遇或喜或悲，比如上面提到的家庭虐文，看了个开头我就已经开始生气了，怎么还会有这种妈妈？\n\n调动情绪也是代入感的进一步体现，看别人的流水账也能有代入感，但往往淡而无味阅后即忘；可如果流水账说他今天和女朋友大吵一架后无缝衔接女友闺蜜还和女友他妈暧昧不清，这八卦的情绪不就有了？\n\n#####
    扣人心弦的剧情安排\n\n知乎的小说大多在1w~3w之间，如此短的篇幅只能用来讲好一个主题一件事。所以剧情一定要紧凑、合理，交代好事情的起因/结尾，重点写好核心剧情，结尾仓促一些其实无可厚非。\n\n紧凑指文中不能有太多废话，比如对推动剧情毫无贡献的打情骂俏、单纯废话的场景描写、莫名其妙的个人独白，这些可以直接在改文阶段删掉。\n\n合理指剧情发展要符合上下文逻辑，文中人物的行为要有前因后果。还是以上面那篇家庭虐文为例：\n\n妈妈不能真的无缘无故打女儿，这是因为她长期把对丈夫、对家庭的恨转移到了女儿身上；也不能打完一巴掌后立马回心转意开始道歉，那是因为女儿真的选择了跳楼，她在经历了这一切后才道歉。\n\n所以通读全文是很必要的，不仅为了了解情节脉络，更是培养对文章的“文感”，文章好坏、有没有爆款潜力一看便知。\n\n#####
    引人回味深思的社会意义\n\n这是小说的额外加分项。文学作品往往来源于现实，在抖音爆过的知乎小说很多，为什么这篇家庭虐文在知乎的成绩这么优异？因为它还能反映一种社会问题，令人看完后深思。\n\n如果我是文中的女儿，我会不会选择跳楼？如果我是文中的家长，我会这样刺激孩子吗？如何防止类似事件再次发生？社会意义能让小说脱离单纯的娱乐性质。\n\n最后，强烈建议大家在选文的同时为账号制作选文表。比如下面是我的一个虐文号的选文表格，从左到右依次是剧情概括、专栏链接、关键词、小说标签、是否提交和发布。\n\n![](img/ae1dcb2b421446e2682235378b0f8d8c.png)\n\n对于每一篇入选的文章，我都会创建单独文件夹，并用编号+关键词+一句话概括命名，这样做一是能构建直观清晰的备选文库，二是加深我对选文改文的印象和理解。\n\n![](img/c2590a9329cf345410b9a1adeaf02e4c.png)\n\n抖音热点宝、跟踪对标账号也是一种选文方法，这里不赘述了。\n\n*
    * *\n\n### 改文套路化\n\n为什么要改文？尤其是改开头？因为有些文章的开头第一、二句话并没有那么吸引人，只是在陈述一件平淡的事，读到中后期才能体会到它的精彩之处，俗称“中开高走”
    或者 “低开高走”。\n\n但观众可没时间管你高不高走不走，刷到一条视频看几秒，不感兴趣直接划走，这样的情况下我们根本没有机会把文章的精彩之处展现给观众；直观体现在5s完播率和文章开单数量上。\n\n那么如何解决这个问题？如何提高5s完播率乃至整体完播率？这些个问题转化一下就是：如何把文章的精彩部分在开头就呈现给观众？\n\n事前通读文章是必须的，在通读的过程中熟悉剧情发展的脉络，然后提炼核心剧情的关键词(如角色、悬念、反差、泪点)，对核心剧情进行再编辑，最后给它放在视频开头。\n\n案例分析\n\n以我八月爆过的一篇文章为例，这篇属于属于盐选专栏《从校服到婚纱，少女暗恋成真》里的一篇脑洞文，正好赶上了高考结束后的学生党热度。我看它的套路比较新，以“我”的身份旁观老妈穿越重生，于是在一众青梅竹马文中选了它。\n\n我高考得了个市状元，美滋滋地等着清华北大来抢我。\n\n结果我妈转手就给我填了一个本市的二本志愿，我整个人都傻了!\n\n我质问我妈为什么这么做。结果她却眼神复杂地对我说道：\n\n[这事说起来匪夷所思，但你别不信，一年后你会被清华劝退，然后患上了严重的抑郁症，后来被人贩子拐卖到小山村，吃猪食，被铁链子拴着，最后只能给人家生了五个娃，一辈子郁郁而终。]\n\n什么情况，我妈重生回来了?我拿着老妈给我改好的志愿单，手一个劲地额抖。\n\n[妈，你认真的?
    你女儿可以上清华北大啊，你给我报个二本志愿干啥? ]\n\n我此刻晴天霹雳，脑海里面闪过各种奇葩父母，为了阻止女儿考名校的神操作，\n\n比如贪污孩子的奖学金啊，又如为了让家里弟弟上个好学校啊，见不得女儿好高啊？\n\n####
    提取剧情关键词\n\n文章第一个小冲突“我是高考状元，却被填了个二本志愿”，即“状元”和“二本”的鲜明反差；而后“我质问我妈，她煞有其事说了一大堆我的未来，我怀疑她是重生的”；即我妈匪夷所思的行为让我怀疑她是重生的人，引出文章主要悬念。\n\n而在提取关键词了要着重考虑小说人物、核心情节和地点等要素，还要满足以下几个原则：\n\n#####
    准确\n\n关键词要准确反映核心剧情的内容，不能顾左右而言他。比如上文中对话中出现了“人贩子”，但这玩意儿绝对不能作为关键词；但 “我妈重生回来了” 虽然是心里独白，但一定要作为关键词。\n\n#####
    简洁\n\n关键词要尽量简洁避免冗长。比如“市状元”简化为“状元”，“本地二本”简化为“二本”，“重生回来了”简化为“重生”。后续修改的时候可以适当为关键词添加修饰。\n\n#####
    可读\n\n关键词一定要让自己看得懂，最好看到关键词就能够主动联想出一个大致的故事，能帮我们在脑海中勾勒出核心情节全貌，方便后续创作修改。\n\n所以关键词为：状元、改志愿、二本、未来、我妈、重生。\n\n####
    概括核心剧情\n\n在概括情节时要分清主次，被篡改志愿的套路不少，后妈偏心、继妹作死都可以，但这篇文章的核心悬念在于“我妈到底是不是重生的”，而不是状元和二本的反差。\n\n“我重生”不少，但“妈重生”就比较稀有了，所以接下来修改的时候要把重点放在“妈重生”这个点上，才能从一众篡改志愿文或者重生文中脱颖而出。\n\n所以我们把核心剧情概括为：我是状元却被我妈篡改了志愿，她告诉我未来上清华后悲惨结局，因此我怀疑她是重生的人。\n\n####
    适当改编\n\n将核心剧情提前后，还可以适当添加一些能够调动情绪的修饰词，比如“竟然”、“偏偏”、“非要”等，或者加上直接的情绪描写来带动读者情绪。\n\n结合后续剧情适当改编后就得到了最终版本：\n\n我妈说她是从未来穿越回来的，还说她穿越了不止一次，我和我爸都惊呆了\n\n要知道我可是本市高考状元，本来我美滋滋地等着清华北大来抢我，\n\n结果我妈偏偏给我填了个本市的二本志愿，我整个人都傻了，\n\n我质问我妈为什么这么做......\n\n这当然不是唯一答案，甚至可以更直接
    “我妈重生了” “我妈重生了几十次就为了救我”；改文是一种灵活多变的手段，而我们的目标是提高完播率、引发观众兴趣。\n\n#### 精简篇幅\n\n在上文有提到过，对剧情发展毫无贡献的文字完全可以删去用来精简篇幅，谁都不想听一大段啰里啰嗦和核心剧情毫无关系的话。\n\n此外，部分对主线剧情没有作用的回忆也可以删去，这些情节更多是为了与现在形成对比，比如过去爱答不理现在高攀不起；这些闪回很占篇幅，酌情精简，以便尽快让推文视频进入核心情节。\n\n虽然改文有原则和套路，但改文也更需要多加练习，平常刷视频的时候也要多加留意，刷到了改文的同行视频要多留意，看看他们是怎么改的，思考为什么会这么改，尝试迁移类似的改法，最终形成自己的改文思路和模板。\n\n*
    * *\n\n### 关键词说白话\n\n某种程度上来说，关键词好比文章的“脸面”，对于配音号来说，关键词一般放在视频上、下方醒目位置，或者在发布时添加一个显眼的封面，让观众点进主页的时候能够一眼看到。\n\n####
    组词简单，通俗易懂\n\n关键词不用复杂拼音、不含生僻字、不含需要多次输入的单字。观众输入关键词是为了找书的，从抖音到其他app已经有些繁琐了，不要再给观众添麻烦了。\n\n比如
    “宸宸星愁” “氤氲难眠” “流萤渐沉” 等，乍一看蛮文艺，但种词只适合作者给文章起名字，不适合我们用来当关键词。关键词是拿到后切换到另一个app键入搜索的，越简单越容易输入越好，一眼就能记下来最好。\n\n实在没有思路就去晋江文学城看一看，如下图，看看人家职业作者是怎么起名的，或者从里面挑几个关键词拼接一下都可以，挑简单的来。\n\n![](img/cf916cc847952600f00fd161d0cb07a0.png)\n\n####
    与文章情节有关\n\n关键词最好能够明示、暗含文章核心剧情，如“分手” “千金”，或者包含文中某个重要的道具，比如“信封” “房本” “首饰” 等。\n\n举个例子，今年高考后许多爽文喜欢用重生回到高中的套路：\n\n比如重生后考了高分就叫
    “重生高分” “重生状元” “重生第一” 等；\n\n重生后打脸看不起自己的人就可以叫 “重生打脸” “重生反杀” “重生翻盘” 等；\n\n重生后的狗血感情戏可以叫
    “重生情缘” “重生前任” “重生复合” 等；\n\n再进一步，还可以用三个字的词组概括文中剧情，拿穿越举例子：\n\n穿越后和渣男分手的，可以叫 “穿越要分手”
    “穿越不和好” “穿越没缘分” 等；\n\n穿越后经商炒股赚大钱的爽文，可以叫 “穿越当土豪” “穿越不差钱” “穿越当股神” 等；\n\n穿越后脱离原生家庭悲剧的，可以叫
    “穿越不回家” “穿越要脱身” “穿越不领情” 等。\n\n以上关键词是我随便乱想的，如有雷同纯属巧合。\n\n中华文化的博大精深不是盖的，关键词的组合千变万化，多组词多看别人关键词找灵感。还可以确定一个前缀(如高中、重生、眼泪)或后缀，专心为它找搭配，减少了组词时间还能做到关键词/标题整齐划一。\n\n####
    避免出现人名、地名、职务等敏感词\n\n有些名称、代号、隐喻是绝对不能碰的底线。\n\n* * *\n\n## 二、剪辑制作\n\n小说推文的剪辑操作并不难，甚至可以简化到“打开剪映-拖入素材-处理素材-智能字幕-导出视频”，熟练后用于剪辑的时间不超过15分钟；第一次剪辑后可复制草稿形成统一模板，后续直接打开在第一条视频的基础上进行删改。\n\n###
    文本配音\n\n一篇文章分三集或者一集都可以，但更推荐一篇一集的长视频(8-15分钟)。剪辑操作比较简单，剪三集或者剪一集都是相同重复步骤，就操作时间来说没有太大区别。其次每天发三篇不同文章出爆款的概率会更大，因为一篇文章分三集后如果第一集没有上热门，其他两集上热门概率同样不大(除非改文功力非常深厚，改到三集近乎是独立的故事)；而发三篇不同文章相当于多了两种全新的可能性。最后，长视频也能使观众更加深入剧情，看后续的意愿也会更加强烈。\n\n####
    直接配音\n\n音频少停顿无停顿。以微配音小程序为例，改好一篇文章后，将所有的标点符号替换为逗号，规避小程序识别句号、问号、感叹号等标点造成的长停顿。\n\n![](img/38c1219d64ecab9356b6639d713908a6.png)\n\n同时要注意文本中的多音字，如果屡次出现一定要用“读音纠正”功能正确配音，偶尔一个问题不大，但听多了一样会影响观感。\n\n在初步配音完成后，可以在文本中手动添加0秒的停顿，抵消配音音频的短停顿，而后在缩短静音选项中缩短大于150~200ms的静音部分，批量处理音频文件生成后的较长停顿。\n\n![](img/f594e4d2c5e8f9f757d4c0b272fd600d.png)\n\n![](img/6aa074c43fa750da9d7cc4fc20f94d5a.png)\n\n至少要做到前20-30s内无明显、突兀的停顿，这直接关系到5s完播率和对视频的第一印象。换位思考一下，视频的音频磕磕绊绊，多音字发音错得离谱，甚至语调都忽上忽下的，你会给它点赞收藏吗？\n\n####
    拼接配音\n\n也有方法可以做到全文无停顿，在微配音中的更多-拼接配音，每一段音频配350~450个字，一边配音一边插入停顿，确保每一段音频无停顿、无错字。\n\n![](img/90d1be842b54c3c2b6bd96526cbcaa94.png)\n\n![](img/6cdc1dd5b2b7f01f5030c9451c2579e4.png)\n\n![](img/4a88b4a6d8c0b8e3c45b992434ee8025.png)\n\n但这样做的缺点也很明显——耗时极其严重。每一段音频至少要听两遍，还要一边听一边修改，对拥有多个配音账号的玩家来说十分不友好，显著降低了剪辑效率。\n\n此外，使用拼接配音的时候，可以根据说话人不同选择不同音色配音，从而区分讲话人、做到差异化，但多人配音更加麻烦，需要考虑旁白、声音1、声音2等多个不同配音员，非常不建议使用。\n\n####
    音色选择\n\n声音影响第一印象。推文声音可以冷门但不能邪门，知乎小说大多为女性第一人称视角讲述，选择一个温和的、说普通话的女声完全足够了，不需要特别选什么播音腔、夹子音等。\n\n我们不是做asmr，只是娓娓道来讲述一个吸引人的故事就足够了，其次我们喜欢听什么不重要，粤语、东北话还是河南话都不重要，让观众听起来正常最重要！正常最重要！\n\n如果文章的5s完播率不大好，可以调整语调，或者更换配音员。\n\n目前用的最广泛的音色是微配音-云晓辰(知性女声)，语速11.2，语调8/15，音量15。\n\n如果要正儿八经给小说配音，音色需要与文中角色的性格、年龄相符；语速要根据文中动作场面快慢确定；语调要根据文中剧情调整，愤怒、悲伤都要用不同语调处理...但我们只是推文的，每个账号选定一种声音完全足够了。\n\n###
    背景素材\n\n背景素材影响视频的重复率，不仅针对平台，更是针对观众。去重到位可以过平台这一关，但如果观众刷了十几条视频全是点心甜点，怎么也会有些审美疲劳了。\n\n目前主流的背景素材有这几种：点心甜点、街头小吃、沉浸解压、手工制作、猎奇搞怪、手游录屏，其中个人观感最好的是手游录屏和街头小吃。\n\n先说手游录屏，最火的手游录屏是跑酷游戏，包括但不限于神庙逃亡、地铁跑酷、蜡笔小新跑酷等手游，如下面几张图：\n\n![](img/2a9c471e5b3efd270f89c7636441f0cd.png)\n\n![](img/21dbb2e4f55c937f9f29409319d28e6f.png)\n\n![](img/c9631dbac0b96c9ab1a9bfe8eba5fd3d.png)\n\n字幕居中靠上，标题/关键词摆上边，一般字幕会置于游戏人物模型上方，看字幕能够引导观众的视线聚焦在游戏内跑道前方，不自觉关注游戏人物的操作。\n\n####
    游戏录屏素材好用的原因\n\n*   创作简单、原创度高。自己跑一把5~10分钟的素材不难，而且不会有其他人的操作跟你完全一样，剪辑时根本不需要去重处理，打开录屏开始游戏就是了。\n\n*   游戏素材互动潜力高。跑酷游戏的操作简单易懂，故意玩的差能引起人吐槽、故意不捡金币能引起强迫症玩家骂街、玩修改版(无限道具、无限跳跃)也能激发好奇心，问你这是什么版本、为什么你的角色不死等等。\n\n*   游戏素材易沉迷。跑酷游戏其实很单调，一个主角和一条看不到尽头的路，障碍物永远是那几个，但能吸引人一直跑下去。玩游戏对人的吸引力是可迁移的，从而游戏视频对人也有一种莫名的吸引力，尤其是自己熟悉的游戏，在抖音这个娱乐平台看别人玩游戏一样停不下来。\n\n再说街头小吃素材，包括但不限于炒酸奶、砍椰子、做蛋糕等，如下图所示：\n\n![](img/6da5a5ee5d4611342e6097260a6936ca.png)\n\n![](img/d6d943241fb64dc65688aa0ec2a1b7f3.png)\n\n![](img/d6e3e484f20ddd8a4e792f7a5177fe4c.png)\n\n####
    美食素材与早期对比的差异\n\n*   更新奇更稀有。年初年中是清一色的零食甜点，甚至我现在还记得那几位博主的id，用采集工具扒下来后混剪去重；从最早的美食甜点，到后来的八大菜系，再到私房小炒，再到街头小吃，美食素材能经久不衰靠的就是花样多、博主多，永远有更新更好的视频。\n\n*   素材尺寸更大。从一开始的16:9到后来3:4、4:3甚至1:1都有，背景素材在视频中占据的画面逐渐变多，这和素材内容有关，比如炒酸奶裁到16:9可能只看得见盘子，做蛋糕的就只能看见下半部分；更大的画面能展现更多素材的精美之处，增加互动、提高完播。\n\n*   来源多样化。很多人都从抖音上采集，大大小小美食博主都快被扒烂了，现在美食素材的主要来源是Youtube上的小吃博主，原因也很简单，科学上网和采集工具是硬性要求，油管上的素材天然具备了稀有性；此外也有很多素材来自b站、西瓜视频等平台，不过也快被扒烂了。\n\n最后提一下手工素材，通过创造或破坏的方式达到解压效果，如下图一是化妆品修复，图二是刨木头ASMR，图三是制作微缩模型。手工素材的特点在于精致、冷门、解压。\n\n![](img/c5519b27dbf62a00439334fddb33dff2.png)\n\n![](img/101bb3466f0efe1477358c8dcfa6c5f8.png)\n\n![](img/a238b267d908d1d9ad2eb5438e1518e9.png)\n\n####
    优质素材的特点总结\n\n*   重复率低，越低越好，人无我有最好。比如录屏跑酷游戏，每一局游戏都不一样，不用去重大胆放心用；再比如你用甜点的时候我在用湘菜，你在用八大菜系我在用街头小吃，你用小吃的时候我已经开始播日料了，永远快人一步。\n\n*   素材质量高，越高越好。只有画质高清还不够，内容也要优质。拿跑酷来说，别人老是跑死，但我技术够高，甚至可以一个金币和道具都不碰到；再比如炒菜，你做小炒我上西餐，你上饭店后厨我上米其林。\n\n*   来源稀缺，门槛越高越好。还是拿跑酷举例，常规的跑酷容易看腻，所以总会有些新的整活，比如人物小到看不见，比如无限跳跃无限道具，这些都需要下载破解版客户端才能做到；\n\n再比如美食甜点，抖音甜品博主的素材能被不同推文号翻来覆去用几十遍，因为从抖音上扒视频太简单了，但如果换成Youtube上的视频呢？科学上网就能拦住很多人，批量下载油管视频又能够淘汰一部分人。\n\n目前素材的最佳来源还是上油管自己扒。不要买素材，流传的素材库已经不知道被卖了多少遍了。\n\n###
    背景音乐\n\n#### 背景音乐的类型\n\n根据视频/文章内容选择合适的背景音乐类型，比如甜文适合歌颂甜蜜爱情的音乐；虐文适合能把人唱哭的、歌颂悲欢离合的歌曲，比如《多远都要在一起》《喜帖街》等。\n\n反过来说，如果小说内容虐得不要不要的，主角死的死残的残，背景音乐却在放《好运来》《今天是个好日子》，谁能看得下去？不会有太强代入感，笑一笑就划走了。\n\n####
    背景音乐的节奏\n\n背景音乐的节奏最好匹配文章节奏。比如剧情紧凑对话密集的文章可以使用节奏轻快的音乐；而古代言情类小说的节奏通常比较慢，就很适合采用A-Lin的《天若有情》。\n\n其实只要不为了整活，BGM都不会出现大问题。能够在抖音传唱的歌，是被广大群众、被市场认可的歌，如果连这些音乐都不行，那还能听什么歌呢？\n\n####
    背景音乐的版权\n\n为了避免版权纠纷，BGM的来源最好是抖音上现有的音乐切片，收藏原声后，在剪映内使用抖音账号登录，可以直接看到抖音上收藏的音频。\n\n![](img/917e76195a180a6aa92bdb5e65c5d83e.png)\n\n虐文就该用伤感一些的歌曲，比如A-Lin的《天若有情》，邓紫棋的《多远都要在一起》等，爽文可以用一些轻松欢快的bgm，悬疑文就要用偏阴间一些的音乐，既有代入感又能引发吐槽。\n\n图省事可以统一使用林俊杰-《裹着心的光》，音量-10。\n\n###
    智能字幕\n\n#### 字幕样式\n\n字幕样式包括字体、颜色、描边、大小等。不要搞花里胡哨的样式和字体，比如什么草书、行楷，比如什么艺术字、阴影，越想搞特色和差异越容易适得其反。\n\n显眼、清晰就可以了。黑字白边和黄字黑边是最常见的两种字体，足够在背景素材中突出，字体用喵魂体或者新青年体足够，字体样式朴素简单有利于观众观看、理解视频内容。\n\n![](img/7a8f6b443b8c04216c4945dcbd1be9a2.png)\n\n其实剪映预设的前3种字体就挺好用的\n\n####
    字幕位置\n\n把位置单独拎出来讲，是因为字幕位置需要结合背景素材综合考虑。比如在使用跑酷素材中，字幕一般被放在靠上方的位置，一是因为该位置不会遮挡住游戏角色；二是这个位置可以引导观众视线落在游戏内的跑道上，从而导致沉迷。\n\n换个例子，使用画画素材的时候，字幕最好放在画面下方，因为放在正中央会遮挡很大一部分作画内容，非常影响观感。总结一下，字幕的位置选择需要根据视频内容和观众观看习惯综合考虑。\n\n####
    内容是否违规\n\n由于各种各样你懂的原因，匹配好字幕后，我们一定要对字幕的内容进行处理，删除敏感内容或者用同音字和emoji代替。\n\n具体要求根据官方的规范表达沟通手册来，也可以在一些网站上免费检测内容是否涉嫌违规；善用字幕的查找替换功能，一次性修改所有相同敏感词。\n\n字幕匹配完成后，拉动进度条，将字幕对齐开头和结尾画面，拖动进度条检查一遍，尽量做到字幕紧挨连贯，没有明显空档。\n\n![](img/7344a3a310caec7d377f787e0cc1d9c9.png)\n\n剪辑制作的基本要求是：配音顺滑不停顿、素材精美不重复、字幕连贯无空档、内容正面不违规。其次是“追新”，文章要新素材也要新，新奇的玩意儿和新鲜的故事在娱乐平台一定有市场。\n\n*
    * *\n\n## 三、发布策略\n\n### 发布前\n\n#### 提前上线活跃\n\n抖音并不只是发布视频的工具，发布每一条视频前的5~15分钟就该上线了，开始刷一刷同行视频，给视频点点赞，在同行评论区留言，关注一下同行的引导方式和评论区优质发言。\n\n看一眼热点宝，在热点宝-视频页面搜索推文，尤其关注一下近三天有哪些爆款文章，思考该文章能否进入自己的选文库；点开看看评论区，学习借鉴一下互动率高的热门评论，便于以后自己造互动。\n\n####
    维护评论区\n\n##### 回复评论，增加互动\n\n好数据需要良好的评论区互动支持，及时点赞、回复观众评论，让观众感受到博主的关心和支持；讨论剧情的说两句，吐槽文章角色的表个态，只发表情的咱也回个表情。\n\n对于
    “室友临死前想看下一集” 等类似的评论，回复一定要灵性，甚至可以多说两句拉扯一下，比如“让生产队的驴休息一会儿” “让你室友撑一会儿，实在不行我烧给他” 等，就像朋友聊天打趣一样，不要回复个“马上”
    “尽快” “好的” 就完事了。\n\n##### 主动发起话题，挑起热度\n\n在评论区提出一些有趣的话题，可以是文章相关或者无关的，鼓励观众发表自己的意见看法，带动观众的情绪，增加评论区活跃度。\n\n比如吐槽文中某个角色“真下头，就该xxx，早该xxx”
    或者抛出一些离谱的事情吸引观众，如 “邻居家老婆快生了，我姓王，能帮起个名吗” 等，甚至可以适当拱火增加热度。\n\n![](img/64183be2dfd199bcc7649e39078e0ede.png)\n\n![](img/628aa81c62a5efe456cb97edb2e88c57.png)\n\n发个“你们卡不卡”都可以。\n\n#####
    清理评论区\n\n清理掉不合适的评论，包括辱骂、广告等违规评论，以免不必要的违规限流。尤其是那些和视频内容无关的引战吵架，互骂几十条评论的情况都有，直接给它删除，酌情拉黑。\n\n还有部分推文博主会开小号来截流，在“在哪看”
    “叫什么” 等评论下回复他们的关键词，先删除他们的评论，然后在消息通知中点开他主页并拉黑，最后在原评论下引导自己的关键词。\n\n### 发布后\n\n####
    看视频、造互动\n\n开大号小号先把自己发布的视频看完，点赞和收藏安排上。用小号在评论区适当留言，如“尊贵的会员先走一步” “看完回来了，是很好看的xx文”等，为后续可能的互动埋下伏笔。\n\n甚至可以稍微剧透一下，给点进评论区的观众留下悬念吸引观看，比如“结局很好”
    “这渣男的下场很爽” 等，适当性挑动一下观众对后续剧情的好奇心。\n\n![](img/5c1454ab04fd09f70d2a0e2f6cd5e887.png)\n\n![](img/adc5ebba584a0398a63f299c0fa5df5a.png)\n\n####
    及时引导\n\n##### 主动评论引导\n\n播放量过5k就可以主动引导了，等有一条视频过15w播放量后就可以置顶引导了。不要因为没人问出处就不引导了，评论区空空荡荡是一种病。\n\n![](img/6e34210c0edf2e6d23257596212b34af.png)\n\n![](img/b077cd1b1c4f09539b13982a43f97632.png)\n\n有观众看完了觉得文章不错，但发现没人评论，可能他最多点个赞就划掉了，直接流失一个潜在付费用户；除非文章足够对胃口，他会主动开
    “金口” 询问后续。\n\n如果我们开一两个小号在评论区互动一下，再加上置顶一个关键词引导，他就很有可能点开评论区瞄一眼，看看有没有读完和他有同感的评论，之后看到我们发的引导去看后续了。\n\n#####
    热门互动下引导\n\n关注评论区，总有些评论能够吸引其他人互动，而且观众点开评论区也更倾向查看这些评论和下面的回复，当然要利用好这种“凑热闹”的心理，在热门评论下面发送关键词+表情包引导，还可以开小号当路人，发送引导词。\n\n![](img/121d05a4da372b99b42398c26d74c062.png)\n\n![](img/7662ec259a317b9f3141a9278b88162a.png)\n\n![](img/5e72d7cd899c8e7525697ca40adc3558.png)\n\n#####
    私信引导\n\n如果有观众一直反馈找不到，可以考虑私信引导，但要注意对面是不是来钓鱼的同行，私信引导很容易被举报限流，去他人主页看一看是不是正常的抖音号再决定是否私信引导。\n\n以上三大点就是小说推文的核心操作了，这里讲解一下起新号的流程。\n\n1.  青春校园爽文、都市虐文、家庭虐文选一个垂类发，尽量不要用惊悚悬疑玄幻起号；\n\n1.  打开抖音搜索热点宝，视频榜，搜索“推文”，选择低粉爆款、3天以内，这是新号选文的重要参考；\n\n1.  一篇文章剪一集长视频，8-15分钟，数据非常好再考虑更新第二集；\n\n1.  早中晚各更新一集，选择下班前30分钟左右发布，每天最多更新三条视频；\n\n1.  新号新视频高标准高要求：文章新、素材新、配音流畅、字幕清晰、无违规内容；\n\n1.  改文下功夫，善用第一人称或提问，增加代入感、设置悬念、点明核心剧情；\n\n1.  当天批量投放抖加，点赞评论、女性、18-23岁、全国、12小时；\n\n1.  数据号继续追投抖加，或者给第二、第三天发布的新视频投抖加，投放条件同上；\n\n最多投放3次抖加，后续新发视频能够轻松突破二、三次曝光(3k-1w播放量)就算起号成功。但如果起号一个月后还没能突破15w播放量，可以考虑换号重练了，继续闷头发视频不断改进也可以，但正反馈来的会比较慢，容易影响心态。\n\n*
    * *\n\n## 四、日常维护\n\n### 每日养号\n\n#### 坚持日更\n\n首先，日更能让账号内容保持新鲜和丰富，粉丝也会有更多机会刷到我们的视频，既能够维护粉丝忠诚度还能吸引更多潜在粉丝关注，也能不断提高账号权重。\n\n日更还是一种态度，意味着我们对项目有着高度的认真和投入，愿意每天付出时间和精力去满足观众的需求和自我需求。不要一时半会没出成绩就溜了
    ，把前期付出变成经验而不是沉没成本。\n\n#### 活跃账号\n\n抖音不只是发布视频的工具，是一个记录、分享的平台，就算不怎么喜欢刷短视频，也每天时不时打开划一划，进个直播间挂机、偶尔点点赞都行。我们不是机器人，但如果每天只是上线发个视频就下，抖音就不这么认为了。\n\n最好每天能够保证一个半到两个小时的活跃时间，刷到同行视频停下来看一看，人家选的什么文？有没有改开头？评论区引导怎么做的？还可以点个赞再收藏一下，这个活跃时间不久来了么。\n\n“抖音让每一个人看见并连接更大的世界,鼓励表达、沟通和记录，激发创造，丰富人们的精神世界，让现实生活更美好”\n\n###
    每日复盘\n\n#### 内容分析\n\n回顾每日发布的内容，根据完播率、播放量、评论量等数据，分析哪些文章更受欢迎，哪些文章不太符合账号定位和粉丝口味，在后续发文的过程中进行调整。\n\n上文中选文改文部分有提到，可以制作一张表格记录选文的多项数据，如文章特色(分手虐渣、重男轻女等)、文章核心剧情(妹妹抢了我男友等)、发布一段时间后的完播率，结合内容分析一起使用。\n\n####
    粉丝分析\n\n每天进数据中心看一看粉丝画像，尤其是粉丝男女占比和年龄分布。可以适当移除一些不符合账号定位的粉丝，比如大龄男粉。\n\n根据不同视频的涨粉效果、粉丝画像反馈选文改文过程，优化选文改文和坚持发视频涨粉是一个动态的、相互影响的过程；说实话，多玩废几个号就知道怎么发文、发哪些文了。\n\n####
    策略分析\n\n记录并回顾每天的发布时间、话题标签、引导方式等，这些是实操的细枝末节，但每个推文号都应该有比较固定的一套流程。\n\n比如视频发布时附带哪几个标签？“小说”
    “小说推荐” “女生必看” 等，改变标签的排列组合，最终测试得出最适合账号的标签组合。\n\n再比如推文视频的发布时间，早中晚各发一集？下午晚上两集？晚上到凌晨更新？每个时间段的活跃人群、系统推流快慢都不一样，不同文章的受众也不一样，需要通过记录和对比不断优化。\n\n###
    保持良好心态\n\n#### 明确定位，放低预期。\n\n期望过高很容易招来焦虑和压力，放低预期能帮我们集中精力稳步推进。此外预期过高很容易导致不健康竞争，不仅分散注意力还会更难取得成绩，形成恶性循环。明确自己的地位，按照教程步骤一步步来，少看同行报喜，你的对手只有自己。\n\n比如我，之前没有做抖音短视频的相关经验，也没有规模化运营的能力，那就跟着教程培训埋头苦干，坚持发视频，遇到问题就问，先跑通后优化各个流程。\n\n####
    不断试错，积攒经验。\n\n我的第一个号直到一个月才堪堪出单，一个半月才有一篇爆款，不少同期小伙伴都重新起号出爆款了，我还在坚持日更3条视频，同时不断学习和琢磨如何优化选文、如何修改开头、编辑标题(现在不起标题了)，从40完播率一路干到
    65~70。\n\n不会找文选文就抄同行的，跟踪对标号挨个照着发；改文不熟练就去刷同行的视频听写下来再分析，想想别人为什么这么改，整理多种改文模板并套用到自己选的文上。\n\n没有互动就去同行那儿抄热评，去刷其他视频收集，多开几个小号在评论区给自己造势，这样一套下来终于在第73天爆了第一篇文章。不是有希望才坚持，而是坚持才有希望。\n\n####
    积极分享，持续学习。\n\n玩法是会变的，有新模式、新素材、新文章等等就要赶紧跟上，项目本身也需要不断迭代来保持活力；遇到问题直接提问，有了新点子及时分享，很可能别人已经遇到过并解决了类似问题、思考过类似方向并且有了经验，多交流的效率比闭门造车高得多。\n\n最早没几个人想到用游戏录屏当素材，也没啥人发长视频，都是一篇文章分三集，可平台算法会更新、观众的口味也会变，进入这个赛道的同行也越来越多，需要我们保持步伐跟上节奏，不断测试、分享和测试新玩法新操作，灵感需要不断碰撞才能达到最大的可能性。\n\n#
    写在最后\n\n感谢看到最后，如果你对知乎推文感兴趣，我可以提供关键词的授权渠道和基础教程，帮你跑通推文项目的全流程。但看文章和上手操作是两码事，实操中遇到的问题一定比文章中提到的更多。一定要评估自己有没有时间精力投入到推文项目中，如果没有，尽可能减少沉没成本。\n\n我是今年加入生财的小白，一开始完全不知道自己能做什么该做什么，就瞎逛瞎看。看到亦仁大大说从实操干起，正好年中张哥说有个知乎和抖音的项目，我就直接开始抱大腿。再次感谢张哥，同一期的人都出单爆文了我还在40左右的完播率折腾，张哥一直鼓励我让我坚持不放弃，每次有问题都会认真解答；还要感谢芷蓝姐，她分享的写作技巧对我的帮助很大，我从一开始的不敢分享、不知道分享什么到现在的敢分享，并朝着善于分享努力；同时要感谢林蔷七，是七姐领我走进了互联网的大门；最后要感谢生财和亦仁，这是一个谈钱不伤感情的地方，是一个分享利他的地方，是一个谈钱增进感情的地方，现在我也开始分享、试着利他，希望能和圈友们一起持续精进，一起生财有术。\n\n感谢你的阅读，任何与小说推文相关的问题都可以在评论区或者私信和我交流，希望这篇关于推文项目精细化运营的文章能够对你有所启发，甚至帮你拓展一个新的生财渠道，让我们一起生财有术！"'
- role: tool
  tool_call_id: call_879a002553f64ed5ab0762c0
  content: '"# 实操复盘：10天时间，视频号从0到变现6000+，到场观过万，我做了什么？\n\n> 来源：[https://fgsd3oxjki.feishu.cn/docx/Lg2vd5GWHoqhBbxuT5LcThEpncb](https://fgsd3oxjki.feishu.cn/docx/Lg2vd5GWHoqhBbxuT5LcThEpncb)\n\nhello，我是姚麻。很久没在生财正儿八经写过分享了，最近刚脱坑了多多视频，于是就开始测视频号，是从15号开始有这个想法了，17号开始发的第一条视频，截止到昨天晚上，也就是27号，变现正好6201块，最高播放310W。然后昨天晚上的直播，也正好是第一次场观破万。\n\n趁着今天发什么视频都是0播，直播也不进人，又正好接到通知上船了，想着来个新的开始，就和大家一起来聊聊这十天里，我到底做了什么，以及关于遇到的一些问题的思考。\n\n对了，这里要先特别特别感谢李诚老师，李诚老师给我解答了非常多的疑问，尽管上期航海我并没有上船，但李诚老师还是坦然的面对了我的“骚扰”，真的特别感谢，等佣金到手了高低先给老师来个大红包哈哈哈。\n\n一、我做了什么\n\n前面说过了，我是15号开始有想法的，当时是刚卖了多多号，还没确定接下来到底去测啥项目，待定的是视频号、AI绘画引流、抖音书单号还有就是闲鱼。\n\n说来也是很巧，我正在犹豫的时候，我妈跟我说在直播间买了个锅，我以为是抖音，问了一下才知道是视频号，我一寻思我妈都从抖音转移阵地到视频号了嘛，那我也试试吧，于是我就开始了我的视频号之旅。\n\n首先是学习，看资料，猛看。总得先把怎么玩大概弄明白吧，我花了差不多两天，把生财的航海手册里，关于视频号的资料，全部都看了一遍，大概的捋了一下视频号的机制。简单来说，按我的理解就是，视频号电商基本就是发视频然后引导去主页下单、发视频挂车、直播出单、引流到企微再成交。\n\n从转化路径来看，肯定是直接挂车最好，但是挂车要1000粉丝，而且好像挂车的视频一般流量都不是很好。其次是引导到主页下单以及直播出单，这里关键就在于视频能不能跑出流量，然后就是直播的转化能不能拉高。最后就是引流到企微了，这个等于就是把视频号纯粹的当流量池了。\n\n对于我这种纯小白来说，挂车肯定是挂不了了，引流到企微也不考虑了，因为做起来有点复杂，刚开始就这样去做不太合适。所以就直接把目标放在发视频引导出单，以及趁着流量直播。\n\n总的来说，视频号的玩法和抖音快手大差不差，但是红利在哪里呢？其实也简单，一个是因为视频号新号有流量扶持，这个在我看来是最重要的。然后就是，因为视频号的用户人群相对抖音快手来说，年纪更大，更为下沉，甚至可以说是没有被洗过的净土，所以做起来相对来说可能会“简单”一点，客单价也能拉的高一点。\n\n最后一个就是，针对我个人而言，从最开始的阿胶到后面的多多视频，面向的用户一直都是中老年人群体，可以算是我的一个强项，所以也是红利。\n\n整个流程捋明白之后，我就开始选品和选对标账号了。这里其实特别的轻松，我直接从之前做多多的品里选的，号也不用重新找，之前囤了很多这种只带一两个品的账号，稍微筛选了一下就直接确定了，这也就是我为什么说这是我的一个红利。\n\n具体是什么品就不说了，但可以聊一下我选品和选账号这块的一个思路，虽然我是捡现成的用，但当初这些品也是我根据这些思路选出来的。\n\n在我看来，选品其实就是定人群然后找需求，大家能理解这句话，就很好选品了。人群的话大家都知道，标签就是中老年人+下沉城市。那么需求呢，也很简单，年纪大了就想身体好，年纪大了就想重返青春，所以运动锻炼类的品和有关保养方面的品，都可以考虑。然后就是下沉城市，这个就比较复杂了，针对这个标签，我更多的是考虑视频方面的东西，并没有怎么把这个和选品相结合。\n\n关于选品还有一个点就是，我会去抖音快手拼多多各种平台搜一下，看在做的人多不多。如果做的人多，我就再去视频号搜一下看，如果也很多，可能就不会考虑了。视频号如果不多，就可以考虑测一下。要是那种抖音快手根本没什么人做的，这种我基本也不考虑，一个是素材能找，还有一个就是我们这是找蓝海，不是找死海。\n\n至于还有一些“通用”类的品，比如说服装、吃的、应季品等等，这种在我看来不是不能做，但是这种需求过于普通，这是所有人的需求，而不是我们目标人群的特定需求，所以不在我考虑的第一梯队里面。\n\n这种通用品其实有点像我说的下沉这个点，更多的是要去考虑怎么通过视频、通过直播去给用户传递出你产品的特色和优势，用户下单可能是因为你的东西卖的便宜，或者有什么特点吸引人，同时又正好用得上，所以买了。而我个人更偏向于那种，让用户看了觉得这个东西我是真的需要，是真的适合我，价格什么的反而不是特别的重要，重点在于我觉得这玩意对我有用。\n\n我一共是选了3个品，1个运动类的2个美妆类（偏保养）的。选好了品就去选对标账号了，根据老习惯，我直接去的快手找号。用的方法也比较笨，就直接搜品的名字，然后找那种真人出镜的点开主页去看，看这个号是不是小号、有多少视频、是不是围绕固定的品在一直带、视频画面是否干净、视频长度如何、是否有生活/内容视频、现在是否还有在更新。\n\n一般来说，粉丝在5W以下、视频在200以上、一直围绕几个品反复带、视频画面不是自己加很多字的、有一定的非带货视频、保持更新，这样的号我就会把它列入考察目标。至于那种一看就是混剪的带货号，或者是自己出镜实拍的但来回反复剪的，我直接就给他PASS了，这种完全不考虑。\n\n至于为什么会有这些要求，其实也很简单。小号就代表被搬过的几率小，而且号主本人同时在发视频号的几率也小。视频多素材就多，可以发的久也可以去做筛选。带固定的品则是因为，我觉得做垂直类目的号会比较好，而且要考虑到直播样品方面的事。视频画面和音频干净的话，我们能进行处理的地方就比较多，以免去重这关都过不去。\n\n视频长度的话，我比较喜欢那种短视频，就几秒十几秒的，当然带讲解的二三十秒也可以，过长的我个人不是很感冒。至于内容视频这块，就是我觉得如果能参杂一点非带货视频，会比纯带货号好一点，特别本来就是一直围绕这么几个品发来发去，粉丝看多了肯定会腻，平台可能也不喜欢。当然了，这个只是我个人的想法，有点玄学的意思，大家不用过于当真。\n\n还在更新就更不用说了，有那种自己每天也更几条的我最喜欢了，甚至可以搞个同步更新，不过如果视频本来就很多，那更不更新就无所谓了。\n\n选好了账号就要开始处理视频了，我基本是一个固定的处理流程，放大→翻转→bgm→加字。放大翻转不用说，bgm的话，那种原本就是纯bgm无讲解的，我就直接给他换个bgm。带讲解的但没有bgm的视频，我会给他加个bgm的底。本身又有讲解又有bgm的，我就会整个变速啥的，调个1.1倍1.2倍稍微弄一下。\n\n然后看有没有字幕，没字幕的识别个字幕，有字幕的也识别个字幕，把原先的给他遮了。最后就是加字，这个点其实我感觉挺重要的，就是针对产品特色/作用/需求等方面，给他整个一两句话，然后弄个醒目的颜色加上去。之前做多多视频的时候，子浅就说过，这种一定要加，有时候出单可能不是因为视频，而是你加的字抓住了用户。\n\n当然了，也可以整一点类似标题党的那种文字，和你本身视频内容、产品可能没什么太大关系，但说不定就能因为这个，你能收获一些评论啥的，这好歹也是拉了数据嘛。\n\n针对加字这块，给大家举个例子吧，比如说产品是个拖把，视频内容是一个人在用这个拖把搞卫生。\n\n我可能会这样加字：今天惹老伴生气了，罚我做一天家务，还好有这个拖把。\n\n或者可以这样：退休之后太闲了，每天在家搞卫生，得亏儿子买了这个。\n\n甚至你还可以这样：重度洁癖+强迫症，一天不打扫三遍就难受，还是这玩意好使。\n\n当然了你也可以简单粗暴，直接说产品好：自从用了这个拖把，家里其他拖把都丢了。\n\n这种东西就大家自由发挥吧，可劲造就完事儿了。看到这里，大家应该就明白了，为什么我会要去选那种比较干净比较素的视频，因为如果它自己就已经弄得花里胡哨了，那我就不好操作了呀。\n\n视频弄完我就直接去发了，17号下午开始发的第一个视频，然后到了晚上我看了一下，三个号全部破万播放了，两个1W出头，有一个跑到了3W+的播放，然后我就又发了一个。第二个视频睡觉之前看了下，也都破万了。这时候我就知道，圈友诚不欺我也，新号果然是有流量扶持的，这个视频号还真可以搞。\n\n到了第二天起来一看，倒是没有出现什么大爆特爆的情况，播放过万之后反而都停了，我就接着发视频呗，不过也不是一口气全发了，前一天一个号剪了5个视频，发了俩还剩下3个，我就隔两三个小时发一个，隔两三个小时发一个。同时在这个期间，就在研究挂橱窗和直播的东西，把号都实名了一下，然后找了相对应的链接挂到了橱窗。\n\n到了晚上吃完饭，还是一个一个号的检查呗，突然发现有个号最新的一个视频播放直接跑到14W了，但是一单也没有，这时候突然想起我好像没有做任何的引导，就是在简介那里整了一句同款在橱窗。于是我就把每个视频都自己评论了一句引导话术，过了一会儿再看，视频还在跑，但还是没单。\n\n于是就开始考虑，是不是要直接去直播了，同时又想起因为上次分享的原因，我还混迹在上期视频号的航海群里，就去群里搜了一下直播的聊天记录，发现大家是过万播放就开播，那没什么好说的，就播呗。\n\n说实话对于直播这个东西，很多人可能会觉得不好意思，或者觉得自己又不是专业的，播不好啥啥的。我倒是没这个包袱，毕竟我大学就做了好几年的游戏主播，现在有时候特别闲，都还会B站播会儿下棋，所以也没做什么心理建设，直接就准备上了。\n\n但肯定还是要提前做些功课的，我就马上打开我挂的那条链接，先是了解了一下价格方面，然后去看里面的商品详情，看了几遍感觉差不多了，最后再去咨询了一下李诚老师，标题这一块有没有什么注意的，能不能说福利啥的，问完就直接开播了。\n\n说实话和我想象的还是挺不一样的，一个是根本没啥人，没记错的话，那天播了俩小时，到下播也就一百多的场观。然后全程也没人说话互动，就一个人嗯说，我就拿着另外一个手机，打开商品详情，这个说一下那个说一下，说完就引导点击下面的橱窗下单。\n\n想着是不紧张，但其实还是有点紧张的，出了蛮多汗的还，说话也总是卡壳说错啥的。也没有样品，全程嗯说还是挺尬的。\n\n不过累是真的累啊，全程嘴巴基本没怎么停过，光水我就喝了三杯，要知道我的杯子是750ml的，平时我一天也就喝个一杯多一点。中途也没见过两次谁谁谁正在购买的提示，我原先还以为这个意思就是出单了，还挺激动的，也正是因为这个才让我播了俩小时。\n\n后面下播了去看，发现才出了一单，但也可以了，至少这个0-1是跑通了，有正反馈就好说。而且视频号是真香啊，29.9的客单价，佣金就有12块。之前做多多视频，有个20%左右我就很满意了，这算下来都快50%了，给我这乡里别着实是香透了。\n\n下播了之后呢，猛点了三根蚊香，直播对着镜头抽不得，而且嘴也没空，得补回来。同时也在想，还是得去弄点话术，不然纯靠自己乱侃，转化肯定是上不去的。\n\n于是就去视频号搜了一下，居然没找着同品类的直播。但是我知道抖音有，我就去抖音看直播，这一看就看了两个小时，因为中途换了个主播，然后这俩主播的话术和风格还不太一样，我就寻思着都抄一抄，一个手机看直播，一个手机录音，然后电脑上打字记话术。\n\n把主播的话术基本扒干净之后，肯定还是要筛选一下，然后自己再改一下的，改完改完自己再顺了两遍，感觉差不多就行了。话术弄完了就去买样品，既然要直播，那肯定还是要有样品展示的，不然天花板说穿了也很难出单。\n\n事实证明话术和样品还是很有有必要的，因为第三天直播的时候，我发现虽然还是基本没人互动，但是提示去购买的次数明显增加了。第三天第一次直播我只播了一个小时，场观还是100出头，但是停留时长高了不少，再一看出单，出了6单。\n\n着实是很舒服了，休息了一会就接着播，播到一小时感觉自己不太行了，也不怎么进人了，我就关了。这样关播再开播，我弄了5次，那天就这样播了5个小时，一共是出了20单。说实话我也想一鼓作气就一直播，但是是真顶不住，而且还得打水上厕所啥的。\n\n对了，这中间还有个插曲，就是我第二天起来一看，发现号的橱窗和直播被封了，原先还打算大展宏图的，结果直接凉凉，还好只是封一天，说是无意义直播。\n\n说实话，我现在也没整明白这个是因为我中途出去打水了，没有人出镜，还是因为我没有样品，反正我后面都没有出过这个情况了。虽然被封了，但也没闲着，该发视频发视频，然后去尝试了另外两个号的直播，挺惨的，俩都播了一小时，场观就十几。\n\n我就明白了，视频没有在跑，就没必要直播了，终归还是要靠视频给直播间带流量。所以我后面都是看有没有视频在跑，或者就是按群里说的，有新视频破万了就去播。同时也有在不停的顺那个写好的话术，后面发现这其实根本就没有必要，因为我这么几天播下来，反正就这么几套来回倒，我现在根本都不用打开那个话术文档，直接就可以脱稿说，倒背如流是称不上，但自己任意组合着用是没点问题。\n\n所以啊，大家要是准备了好了话术，我建议除了那种真的特别特别紧张的，需要不停的练话术给自己信心的，其他的你可以就和我一样，坐在电脑面前播，记不得了就瞟一眼电脑上的话术，播多几次就可以了。而且做电脑面前播还省个打光灯哈哈哈，我原本是用那种带灯的支架，后面因为要看话术，就换了个小的支架，发现其实差不多。\n\n说到这里其实关于我做了什么这部分内容，就基本结束了，因为我后面几天做的事情，和出单有关的哈，基本都是一模一样的，无非就是重复，发视频、看有没有视频在跑、直播、看有没有出单、看还进不进人，真没别的了。\n\n剩下的就是在琢磨其他两个号的事，因为那两个号都是不温不火，一天发4个视频，基本就1个过万的，剩下的就几千播放，然后过万的那个还会停，直播也不会有人。我觉得这样还是不行，于是一个号直接换品换内容了，一个号坚持在发，因为我感觉那个品是真行，毕竟那个品我之前在多多就爆过，我相信它。就这样做着做着到了今天，其实也没几天，一下就过了。\n\n现在大概的情况就是，主号每天都会播，播多播少播长播短取决于进人情况，目前出单最好的一次也就是27号那天，场观1.1W，播了3个半小时，出了200多单。另外两个号呢，换品换内容的号可以说已经是死了，删完视频再发新内容，直接我到现在也没有过一个播放过千的视频，最高的播放300+，只能说很心疼我的保证金，现在打算再发两天看看，如果还是这样，我就再把视频都删了，再换个品去测，还没流量，我就要放弃它了，保证金也不要了，直接注销了。\n\n这里要吐槽一下，视频号注销真的太久了，10天啊，抖音都才7天，现在还能整秒注销，视频号多学学啊，注销整这么久干嘛。\n\n坚持在发的那个号有一点小起色，小爆过两个视频，一个80W一个30W播放，但是转化一般，没记错的话，正常的橱窗出单好像就几单，直播也很一般，反正加起来佣金只有700多。但我还是相信它会爆的，希望不要辜负我哈哈哈。\n\n同时还开了两个新号，也是昨天刚弄的，目前都没有翻车，加起来8个视频，今天下午看已经全部过万了，但是今天发出去的视频全是0播放审核中，不知道会持续多久，也不知道后续这俩号咋样，还有待观察。因为破万播放之后就没有视频再跑了，所以橱窗也还先没看，再观望观望。\n\n二、补充和问题\n\n首先是关于直播流量券的问题，现在视频号有新主播成长计划，会给你一些新手任务，完成一个就给你100点的流量券，可以用来加热直播间，100点相当于100块钱了，做完新手任务后面还有每天的任务，也是给100，还是挺香的，建议大家每天都去做一下那个任务。\n\n还有就是在你第一次直播的第二天，还有个任务，那个任务就只有第二天能做，你不完成后面就做不了了，一定要去做，我主号不是第二天被封了一天橱窗和直播嘛，我就没拿到这100点的奖励，我至今还无法释怀。\n\n话说回来，这个流量券我目前还真没用好过。无论是100一次的那种直接投观众的，还是500起步的投商品点击/下单，我都有去试过，就是没有过出单。\n\n至少在他那个加热期间，没有过出单。最好的一次就是，小爆了的那个号，500点投了商品点击，然后换来了1300的场观，30次商品点击，0单。500的下单，我是昨天在主号用了，更勾勾坑，直接就只有6次商品点击，当然了场观是差不多的，也是一千多。\n\n不过根据我的想法，我还是推荐大家把这个都攒一攒，攒到500去用，一个是看着爽，还有一个我昨天就是投了500的下单，然后十几分钟就跑到了1000+的场观，虽然没有出单也没什么商品点击，但是配合两波发福袋，直播间的互动和关注是比平时好很多很多的。\n\n等到它消耗完了，进人一下没有这么猛了，但是一直持续也在进，也一直有在出单，反正比平时是好很多。播了一个多小时后，就在我准备下了，来了一波回光返照，小爆发了一下，一直进人还一直出单，
    我就一直熬一直熬，熬了3个多小时，熬到了场观过万，熬到了200多单小三千块钱，所以说大家还是要坚持啊，只要有反馈就别放弃。\n\n再补充一下关于视频内容的东西，前面说过了我新开了两个号，不单是为了测品，也是为了去测新的视频内容形式。怎么说呢？这两个号我一个是做的找的那种纯BGM无讲解的视频，然后把BGM换成了抖音近期很火的语录，加的字也和语录有关。\n\n另一个呢，我就直接找了一个不是带货的素人小号，跳广场舞的，我发的也是纯内容视频，打算是后面去掺着发那种混剪的带货视频，或者自己实拍产品素材也行，这样的话，后续能选择的品就会比较多。可以说只要跟我人设沾点边的，我就可以尝试去发，然后保持一个品类的垂直就好了。\n\n测这两种形式，无非就是想通过内容去搏流量，尽管这种流量相对纯带货视频来的可能杂一些，但是如果能稳定的获取到流量，那我觉得没问题，质不行就用量补嘛。\n\n目前看来好像还行，后续到底怎么样，能不能有稳定的流量，能不能把流量变现，还不知道，后续我可能还会再写点复盘，到时候有结果了我们再交流。\n\n然后就是这几天做下来，我遇到的或者是我想过的一些问题，有一些我自己的思考，不一定会对，所以希望如果大家有懂的，可以教一下，指点指点。\n\n1.直播间人脸认证问题\n\n因为我开过直播的三个号，全部都是那种，开播之前必须来一次人脸认证，哪怕是我刚关的直播，过了一会再开又要认证。除了每天都在播的主号，从前两天开始突然不用认证了，另外还有零散在播的那个号，依旧是每次都需要进行人脸认证。\n\n我有问过李诚老师，李诚老师的说法是，一般最开始第一次直播需要认证，后面就不要了，但是每次都要也属于正常情况。那么像我这种播着播着就不要了的，是属于偶然的情况，还是说这是一个正常的机制呢，如果是每个号都播着播着就不要再认证了，可以省不少事呢。\n\n而且这还涉及到一个用其他人实名微信的问题，一个人你最多也就实名5个微信，弄5个视频号，再多就要用别人的。我目前用的都是我自己的，还没用过别人的实名信息，如果说用别人的实名信息，人脸认证肯定是他来做吧，做完了之后也需要他来直播吗？如果仅仅是验证完就可以让别人播，这样倒也还可以接受，但是也挺麻烦的，因为这代表需要和实名的那个人去做捆绑，如果那个人不在边上，扫不了脸，那就直播不了，得凑别人的时间。\n\n2.关于上架商品的问题\n\n我主号在带的那个品，是用爱逛的链接，在优选联盟里根本就没有这个品，听说下个月这些第三方就不能用了，那我这个该咋整呢。而且我还有想测的品也是这样，优选联盟里根本没有，微店倒是有，但是这上来就是3W的保证金，根本扛不住啊。\n\n针对这个问题，我目前是想能不能自己上架再去带，也就是开视频号小店，或者让认识的商家去视频号上品，这样不仅解决了带不了的问题，还可以更方便的去调整价格之类的东西。或者就只能去引流到微信，再去做进一步的转化。\n\n但说实话这三个方面我现在一个都没试过，我感觉光是想想就有很多问题，比如说视频号小店该怎么认证，认证的话一个主体能认证几个？如果我要带美妆类的品，需要我有相关的执照吗？以及这种品类是不是上架需要更多的保证金？\n\n让商家去视频号上品，其实也很麻烦，因为还得上到优选联盟，我看那个要求还挺高的，李诚老师倒是说了可以用旗舰店的形式入住，这样可以直接上，但是这个旗舰店的形式入住有什么具体的要求吗，我一无所知，甚至都找不到一个入口，如果有了解的朋友希望可以答疑解惑一下。\n\n转企微引流其实也是一样，企业微信也是要认证的，那我能挂到多少个视频号上去呢？说实话我对引流这种玩法接受度挺高的，毕竟是老本行嘛，引流过去了玩法就可以很多了。\n\n没有作为第一选择，仅仅是因为刚开始肯定要选门槛低的，后续如果可以跑通我肯定会往这方面去走，但如果说局限性比较大，没有办法轻松的复制，那就很让人头疼了。\n\n3.关于视频转化出单和关注的问题\n\n两个现在有出单的号，加起来通过视频出的单，不会超过10%。我每天起来，打开带货中心一看，能有一单两单就不得了了，不直播根本就没有单，我看大家好像基本都是能做到1W播放1单这样，我连尾灯都看不到啊。\n\n涨粉也涨的很少，主号几百万播放4000的赞，现在才500多的粉。另外一个号就更惨了，八十几万播放+1500的赞现在100粉都没有。说实话视频号不比抖音，我还是蛮看重粉丝的数量，因为开直播的时候，关注的粉丝会直接在微信收到推送，这可是个强提醒，最起码粉丝越多，刚开播那会进的人就会越多。\n\n倒也不是没有想办法去解决，比如说每个视频都评论引导去主页下单，也会评论引导关注，也做了有引导封面的视频置顶，直播里也会去叫关注点关注，但是我感觉并没有什么作用，大差不差的，就很难受。\n\n也许这都是因为我视频的形式和内容不好，导致的转化很低。不过话说回来，归根结底还是现在经验太少，可参考的样本也少，所以很难摸清楚套路，后面接触的多了应该会有一些新的体会。\n\n4.新号流量的问题\n\n关于新号流量扶持这一块，我听说是新号有7天的流量扶持？现在我最开始3个号都过了七天，我倒是没觉得流量有差很多，确实没最开始好，可也不至于没法玩，每天看后台少说也有大几万播放。\n\n但没有新的视频再爆过了，能过万播放的基本也就停留在那里了，更多的是几千。也听说有人新号发出去就是一直几百播放，这种是为什么呢，因为视频内容不行吗？\n\n有没有那种发视频一直不温不火，然后坚持发了挺长一段时间，终于爆了的朋友？如果有这种的话，我感觉就还能正常玩，就针对视频内容去做优化好了。\n\n但如果没有的话，或者说这种情况很少的话，那是不是可以考虑换一种玩法了，就是在7天扶持期内作死的发视频，一个视频几千一万的，几十个视频就是几十万，几百个就是几百万，然后7天时间过了就换号。这样虽然不长久，但总比每天发了没反应做无用功要强吧。\n\n还有就是新号的定义到底是什么呢？一个新注册的微信/老微信但没在视频号发过内容的叫新号，那我把视频号注销了再开通，这样算新号吗？还是说这个微信就不得行了，得换一个微信？因为我注销的号现在还没到10天，所以我对这玩意也不了解...\n\n5.关于问题的总结\n\n其实大家看了我这几个问题就知道，我基本都是在围绕怎么才能稳定、怎么才能复制和扩大这样两个核心在思考，毕竟可持续的项目才香，谁都不想一天天的提心吊胆，吃了这顿担心下顿的。\n\n有的人说从0到1最难，1到100很简单，无非就是复制复制再复制，但你真的保证你做同样的事情，就能得到同样的结果吗？\n\n反正我觉得这是个很难的事情，对我个人而言，我确实运气蛮好的，我做过的很多项目基本都是轻轻松松从0到1，但是最后死在了1到100，天胡开局是很爽，但最后无奈退场也是很狼狈。\n\n在这样一个摸索如何稳定，如何放大的过程中，光凭自己其实还是很难的，所以才需要大家一起来走，分享彼此的心得、踩过的坑，这样才能走的更快、走的更远。\n\n对我而言，我觉得生财的价值很大一部分就源自于这点，这也是生财的魅力之一，也是我陆陆续续写了这么多分享的初衷。不是为了显摆什么，而是为了抛砖引玉，想要用真诚换真诚，无论水平高或低，也无论成果多与少，你都有属于你自己的，独一无二的经历和价值。\n\n在你看来稀疏平常的东西，对别人而言说不定就有多宝贵。所以还是那句话，希望大家可以多多交流，多带带弟弟！！！\n\nok，到这里就结束了，没想到一下就到三点了，等于是给大家准备的夜宵直接变早餐了。感谢能坚持看到这里的你，希望不要过于嫌弃我的啰嗦和垃圾文笔，时间也差不多了，我要去看葡萄牙和乌拉圭了，有什么问题啥的咱们评论区聊"'
