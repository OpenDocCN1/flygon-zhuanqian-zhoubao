    function:
      arguments: '{"paper_name": "千万项目的底层逻辑", "paper": "任何项目都可以拆解成：流量效率，销转效率，交付效率，客单价，毛利率，复购率，这六个点。满足的越多越好，满足四个点，及格。\n\n流量效率：以时间、素材、流量为指标。花的时间少、素材难度低、获得流量大，即为流量效率高。\n\n销转效率：以专业度为指标。专业度要求低（能SOP）、能一对多，即为销转效率高，本质也是时间、销售的时间利用率。\n\n交付效率：以时间为指标。花的时间少（人力少），即为交付效率高。\n\n案例：小说推文项目（流量高、销转高、交付高、客单价低、毛利率高、复购率低）。教育资料1.0/2.0项目。减肥食谱项目。项目拆解商业IP（流量效率低、销转效率高、交付效率低、客单价高、毛利率高、复购率高）。知识付费（流量高、销转高、交付高、客单价高、毛利率高、复购率低）。\n\n总结：流量效率高意味着内容极其好复制，可以通过矩阵、培训等方式，把这一块单独拎出去进行放大。销转效率高、交付效率高，意味着销售可以SOP化，不需要极强的专业性，也意味着交付也不需要啥时间精力，同时也意味着流量来了能接得住。意味着赚多赚少取决于流量的多少。如果三个效率中有一块低，就难以复制放大，就得在客单价、毛利率、复购率这三块下功夫，比如通过提高客单价来增加收入。\n\n任何事情只有明白底层逻辑，才能有的放矢。"}'
