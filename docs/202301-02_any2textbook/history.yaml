  content: "{\n  \"paper\": \"万字复盘副业拆解\",\n  \"desc\": \"该素材提出一套针对普通职场人的副业成功方法论，核心主张是副业成功的关键并非原创或All\
    \ in，而是建立一套'后发制人'的商业情报挖掘与项目拆解体系；素材系统化地给出了喂养算法、情报挖掘三方法、项目拆解八步、项目管理双案、三大杠杆、选项目防坑标准、基础能力模型等操作框架，并以多个亲历项目（如儿童游乐项目）作为复制成功的证据。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"后发制人\",\n      \"desc\": \"该概念主张做别人已经验证赚钱的事情，通过复制或二次创作获取成功，不看原创、不赌不确定性，以此降低副业试错成本。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"后发制人：做别人做过的事情，将其进行复制或二次创作，不看原创不赌。\"\
