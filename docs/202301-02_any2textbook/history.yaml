    ,\n        \"设置打卡动作（每天写下执行动作、遇到的问题、复盘）。做到失败的唯一可能性就是学员自己放弃。\"\n      ]\n    },\n\
    \    {\n      \"name\": \"最少必要信息\",\n      \"desc\": \"该概念指操作手册只应给出学员完成一件具体事情所需的最少必要信息，避免信息过载，先让学员能上手（先学会弹小星星再学乐理）。\"\
