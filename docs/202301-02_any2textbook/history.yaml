    function:
      arguments: '{"paper_name": "万字复盘副业拆解", "paper": "普通职场人通过拆解各平台商业案例，成功复制30+项目，副业收入破百万。核心方法论：\n\n1.
        副业成功关键不是原创和All in，而是建立一套后发制人的情报挖掘与拆解体系。\n2. 喂养算法：每天保持两小时商业内容泛阅读，通过收藏点赞关注，让算法持续推送商业内容。\n3.
        建立赚钱情报挖掘体系三方法：喂养算法、学会搜索（分辨信息源真伪、泛读、技术爬虫监测）、记录到飞书表格建立项目库。\n4. 拆解一个赚钱项目八步：找项目（建项目库）、拆流量、拆转化、拆产品交付、评估可复制性和可持续性、定策略、搭团队、强执行。\n5.
        项目管理思维：策划案（产品货盘、运营策略、目标制定、里程碑、止损点、放大操作点）+执行案（时间、地点、事项、责任人、阶段性目标）。\n6. 三大杠杆：人力杠杆（低成本兼职+SOPSOP）、技术杠杆（软件释放双手批量搬运）、资源杠杆（资金人脉）。\n7.
        选项目防踩坑标准：重资产的不要碰、自己搞不懂的不要碰、自己不喜欢的不要碰。\n8. 基础能力模型：搜索能力、低成本兼职渠道、分润比例设置、精力分配。\n9.
        赛道是业务基本盘（卖货卖课卖服务），渠道是营销渠道（客户在哪里哪里就是渠道）。渠道存在信息差。\n10. 后发制人：做别人做过的事情，将其进行复制或二次创作，不看原创不赌。\n\n案例：儿童游乐项目（复制三个月变现40万）、文川手写logo设计、艺术签名设计、抓娃娃卖娃娃+收徒弟、飞纸牌切水果教学。"}'
