    \        \"企业营收28原则：20%客户带来80%利润，复购比拉新更重要。搞定100个愿意在10个月里每月支付1000元的客户，就能年入百万。\"\
    \n      ]\n    },\n    {\n      \"name\": \"私域价值密度定理\",\n      \"desc\": \"在私域场景中，好友数量与成交额不成正比，高粘性私域好友的单位价值远高于泛粉丝，即少量高信任好友可带来更高成交。\"\
