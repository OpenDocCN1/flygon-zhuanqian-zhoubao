    ,\n      \"desc\": \"该素材的整体方法论：以‘高效率交付才能高质量交付’为心法，以‘将一份时间卖多次、撬动学员时间、让学员意识到自身责任’为三大解法，并以‘招生+交付’的干法（操作手册、直播、打卡、百问百答）落地执行。\"\
