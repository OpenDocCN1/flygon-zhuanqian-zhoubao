    ,\n      \"excerpt\": [\n        \"优秀学员的经验分享：给其他学员信心、在怎么学上起榜样作用、更好氛围。对优秀学员本身：通过分享提高影响力、‘分享必爆’、传递正能量。对老师：丰富课程释放时间精力。三方共赢。\"\
    \n      ]\n    },\n    {\n      \"name\": \"打卡驱动责任制\",\n      \"desc\": \"该方法以每日打卡（执行动作、问题、复盘）替代老师的‘感动自己’式提醒，将成果责任明确归属到学员自身，失败唯一可能即学员自我放弃。\"\
