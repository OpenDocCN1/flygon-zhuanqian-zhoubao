    function:
      arguments: '{"paper_name": "私域裂变与个人品牌冷启动", "paper": "无资源无资本的个人如何通过私域裂变和个人品牌搞定冷启动流量难题。\n\n一、重新理解微信好友\n销售额=客户数×客单价×购买频次。传统过度关注客户数，忽略客单价和购买频次。企业营收28原则：20%客户带来80%利润，复购比拉新更重要。搞定100个愿意在10个月里每月支付1000元的客户，就能年入百万。\n私域的本质是长远而忠诚的客户关系。有信任度有粘性的好友远胜过泛泛之交。只有800个微信好友月成交20万
        vs 3万好友月成交5万，好友数量40倍但成交不足四分之一。\n产品结构一定要设计高客单价产品（站台产品，拉高品牌力），避免只有引流产品而没有承接。\n\n二、冷启动三法\n1.去公域平台：发布内容到视频号、公众号、知乎、小红书等自带流量平台。知识营销是被动引流，把营销内容化变成分享。\n2.去当群红：普通人做个人IP最好的起盘方式不是做抖音网红而是做社群群红。群红是有限竞争（面对几十到几千人），网红是无限竞争（面对全平台）。先做经典案例然后复盘，加入付费社群做奉献分享案例。\n3.抱大腿：提供可交换价值，练好一身本领是最好的方式。抱行业大腿（站对风口）和抱行业里有影响力的人的大腿（找准贵人）。你不牛逼，认识再多牛逼的人也与你无关。\n\n三、撬动10个铁杆粉丝获取1000个客户\n裂变是传统流量红利尽后最低成本获客方法之一。\n两种裂变模型：\n1.团队裂变（自上而下）：有明确上下级推荐关系，微商团队、经销商网络常用。核心诱惑是躺赚逻辑。\n2.用户裂变（自下而上）：用户之间是社交网络网状结构，讲究圈层效应。分口碑传播（疯传六大原则）和裂变营销活动（利益诱饵）。\n裂变断层问题：只有激发层用户愿意分享，到第三层裂变层就断层。解法是用团队裂变+用户裂变的叠加（战队PK玩法）解决。\n运营阶段：起盘阶段做个人品牌+公域内容引流+社群群红+抱大腿获取第一批客户；发展期靠裂变营销放大流量池；有钱则投放是更高效的放大器。"}'
