    function:
      arguments: '{"previous_chapter": "# 第1章 项目六要素拆解\n## 学习目标\n- 理解为什么做生意不能凭感觉，需要一套通用诊断框架\n-
        掌握项目六要素的定义与及格线标准\n- 理解三项效率指标如何从源头判断项目可复制性\n## 1.1 为什么要拆解项目\n体检需要一套标准化的指标（血压、心率、血糖），判断一个项目能不能做同样需要标准化诊断框架。好的框架必须具备通用性、系统性、诊断性。\n##
        1.2 项目六要素拆解：定义、及格线与边界\n「任何项目拆解为六个核心点，四点为及格线。」\n六要素：流量、销转、交付、客单、毛利、复购\n| 要素
        | 定义 |\n| 流量 | 触达潜在客户的数量 |\n| 销转 | 从看到买的比例 |\n| 交付 | 产品或服务完成度 |\n| 客单 | 单笔交易金额
        |\n| 毛利 | 单笔利润空间 |\n| 复购 | 客户再次购买率 |\n及格线基准：四点为及格线\n## 1.3 三项效率指标\n「流量效率：花时间少、素材难度低、流量大；销转效率：专业度要求低、能一对多；交付效率：花时间少、人力少。」\n|
        效率指标 | 判断标准 |\n| 流量效率 | 花时间少、素材难度低、流量大 |\n| 销转效率 | 专业度要求低、能一对多 |\n| 交付效率 |
        花时间少、人力少 |\n杠杆效应定理：任一环节效率高时放大整体产出\n互补定理：某环节效率低时靠其他环节高指标补偿", "current_chapter":
        "# 第2章 副业方法论\n## 学习目标\n- 打破副业迷思\n- 理解后发制人\n- 掌握喂养算法与情报挖掘\n- 掌握拆解八步法\n- 掌握三大杠杆与三不碰\n##
        2.1 生活类比\n餐厅厨师的类比。\n## 2.2 概念地图\n## 2.3 副业迷思：为什么\"原创\"和\"All in\"是危险的直觉\n「副业成功靠后发制人的情报拆解体系。」\n##
        2.4 后发制人：复制已验证项目，降低试错成本\n**后发制人**定义：不追求成为第一个进入者，复制已被验证成功的项目，二次创作进入市场。\n##
        2.5 喂养算法与情报挖掘：建立商业雷达\n**喂养算法**定义：通过主动搜索关注互动，引导算法持续推送商业案例。\n## 2.6 拆解八步法\n找项目→拆流量→拆转化→拆产品交付→评估→定策略→搭团队→强执行\n##
        2.7 三大杠杆与三不碰\n三大杠杆：人力、技术、资源。三不碰：重资产、搞不懂、不喜欢。\n## 2.8 设计中的取舍：为什么先复制而不是先创新？\n"}'
