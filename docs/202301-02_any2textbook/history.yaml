    ,\n      \"excerpt\": [\n        \"项目管理思维：策划案（产品货盘、运营策略、目标制定、里程碑、止损点、放大操作点）+执行案（时间、地点、事项、责任人、阶段性目标）。\"\
    \n      ]\n    },\n    {\n      \"name\": \"三大杠杆\",\n      \"desc\": \"该方法主张用人力杠杆（低成本兼职+SOP）、技术杠杆（软件批量搬运释放双手）、资源杠杆（资金、人脉）三种杠杆放大业务规模，避免个人体力投入成为瓶颈。\"\
    ,\n      \"excerpt\": [\n        \"三大杠杆：人力杠杆（低成本兼职+SOP）、技术杠杆（软件释放双手批量搬运）、资源杠杆（资金人脉）。\"\
    \n      ]\n    }\n  ],\n  \"theorems\": [\n    {\n      \"name\": \"副业成功的非原创定理\"\
    ,\n      \"desc\": \"核心主张：副业成功不取决于原创程度的高低，也不取决于是否All in，而取决于是否建立后发制人的情报挖掘与拆解体系——复制已验证项目是最高效的成功路径。\"\
    ,\n      \"excerpt\": [\n        \"副业成功关键不是原创和All in，而是建立一套后发制人的情报挖掘与拆解体系。\",\n\
    \        \"后发制人：做别人做过的事情，将其进行复制或二次创作，不看原创不赌。\"\n      ]\n    },\n    {\n     \
    \ \"name\": \"渠道信息差定理\",\n      \"desc\": \"核心主张：赛道决定业务方向，渠道决定流量来源；同一业务在不同渠道存在信息差，掌握渠道信息差的人在后发复制中可套利。\"\
    ,\n      \"excerpt\": [\n        \"赛道是业务基本盘（卖货卖课卖服务），渠道是营销渠道（客户在哪里哪里就是渠道）。渠道存在信息差。\"\
    \n      ]\n    },\n    {\n      \"name\": \"项目三不碰过滤定理\",\n      \"desc\": \"核心主张：选项目时设置三条硬性过滤标准——重资产、搞不懂、不喜欢三种类型一律不碰，以此控制失败率和投入风险。\"\
    ,\n      \"excerpt\": [\n        \"选项目防踩坑标准：重资产的不要碰、自己搞不懂的不要碰、自己不喜欢的不要碰。\"\n \
    \     ]\n    }\n  ],\n  \"findings\": [\n    {\n      \"name\": \"多项目复制成功\",\n\
    \      \"desc\": \"[evidence] 该发现在文中由作者自述'成功复制30+项目、副业收入破百万'作为支撑，属于方法论的整体效果证据。\"\
    ,\n      \"excerpt\": [\n        \"普通职场人通过拆解各平台商业案例，成功复制30+项目，副业收入破百万。\"\n   \
    \   ]\n    },\n    {\n      \"name\": \"儿童游乐项目复制变现\",\n      \"desc\": \"[evidence]\
    \ 该发现以'儿童游乐项目'为具体案例支撑，作者通过复制该项目并在三个月内变现40万，验证了八步拆解+后发制人方法在真实项目中的兑现能力。\",\n   \
    \   \"excerpt\": [\n        \"案例：儿童游乐项目（复制三个月变现40万）\"\n      ]\n    },\n    {\n\
    \      \"name\": \"轻资产创意设计类项目可复制\",\n      \"desc\": \"[claim] 文川手写logo设计、艺术签名设计、抓娃娃卖娃娃+收徒弟、飞纸牌切水果教学等案例，被作者作为可复用、可教学、可二次创作的轻资产副业样本列举，暗示这些项目具有高可复制性。\"\
    ,\n      \"excerpt\": [\n        \"案例：儿童游乐项目（复制三个月变现40万）、文川手写logo设计、艺术签名设计、抓娃娃卖娃娃+收徒弟、飞纸牌切水果教学。\"\
    \n      ]\n    },\n    {\n      \"name\": \"副业可同时跑多个项目\",\n      \"desc\": \"\
    [claim] 素材以'成功复制30+项目'为总成绩，暗含单个职场人可通过体系批量运营多个轻量项目的可行性，但原文未透露各项目间的资源分配与协同细节，仅作整体性宣称。\"\
