    ,\n      \"excerpt\": [\n        \"起盘阶段做个人品牌+公域内容引流+社群群红+抱大腿获取第一批客户；发展期靠裂变营销放大流量池；有钱则投放是更高效的放大器。\"\
    ,\n        \"解法是用团队裂变+用户裂变的叠加（战队PK玩法）解决。\"\n      ]\n    }\n  ],\n  \"theorems\"\
    : [\n    {\n      \"name\": \"销售额要素重构定理\",\n      \"desc\": \"销售额=客户数×客单价×购买频次，但传统过度关注客户数而忽略客单价与购买频次；复购远比拉新重要，少量高复购高客单客户即可实现高营收。\"\
