  content: '"# 【保姆级教程】从零到一打造一个高质量交付训练营\n\n> 来源：[https://y2mt3o47i3.feishu.cn/docx/MUfLdmUlTosj0NxPhlfcjRPHnff](https://y2mt3o47i3.feishu.cn/docx/MUfLdmUlTosj0NxPhlfcjRPHnff)\n\n跑通项目的圈友，想通过培训来放大收益的时候，你是不是经常遇到以下情况：\n\n1.  会做不会教，不知从何入手\n\n1.  收了几个一对一的学员，结果发现教人耗费精力太多了，还不如自己做项目\n\n1.  收了一堆学员，但没过多久就发现自己实战的时间精力被大大分散，讲出来的东西，越来越不及时，落地性也越来越差了，自己在项目上的收益也越来越差\n\n经常付费学习各种项目的圈友，是不是也有「明明老师的成绩不错，但自己怎么就学不会呢？」的疑问。\n\n希望今天这篇帖子，既能帮想做训练营的圈友，做出高交付质量的训练营。\n\n也能帮需要付费参与培训，跨出搞钱第一步的圈友，更清晰的认识到自己需要什么。\n\n话不多说，进入正题：\n\n《操作手册：如何从零到一打造一个高交付质量的训练营》\n\n*
    * *\n\n大家好呀，我是郭晓文。\n\n先用@亦仁 说的方式，做个自我介绍吧。\n\n这是我在生财的精华贴：\n\nhttps://t.zsxq.com/03UbAyJAE【如何利用生财有术，抓住视频号带货的红利】\n\nhttps://t.zsxq.com/fU3F2jU
    《抖音引流Tips合集：鱼钩思维+企业号专属引流方式+常见误区》\n\nhttps://t.zsxq.com/niQ7iIe【红包封面售卖】一周时间，搭建一个自裂变的赚钱系统\n\nhttps://t.zsxq.com/RRrfqJE
    【操作手册】公众号1个多月时间做到几乎篇篇5w+，进阶版「manchuan」玩法\n\nhttps://t.zsxq.com/uZnyr7I 抖音月均播放量4个亿的短视频创作心法\n\nhttps://t.zsxq.com/Uzv3Nrv
    抖音小程序依旧可以稳定日入过千的玩法，实操手册\n\nhttps://t.zsxq.com/b2FuNnq 茶叶垂直领域，抖音直播做到月营业额200w\n\n用心的朋友会发现，我有特别多帖子都是具体某个项目的操作手册。\n\n过去两年，我不仅自己跑通了许多个搞钱项目，也通过训练营的方式，带着很多圈友跨出了搞钱第一步。\n\n今天，我就把我对训练营的理解，对新手如何入门项目的理解，以及打造训练营的保姆级教程，分享给大家。\n\n内容分成两部分：\n\n1.  心法---为什么要这么设计训练营\n\n1.  招式---保姆级教程\n\n##
    心法---为什么要这么设计训练营\n\n### 高效率交付，才能高质量交付\n\n我的观点是：要做出高质量，落地性强的训练营，老师就不能脱离一线。\n\n很多老师做培训之后，就会陷入一个困境：\n\n1.  我要把学员教好，就得花更多时间精力\n\n1.  我花更多时间精力去教学员，我一线实战的时间精力就变少了\n\n1.  我一线实战的时间精力变少了，我自己的业绩就得下滑，我教的东西的可落地性也就变差\n\n结果，学员体验也差，自己项目也没做好。\n\n这也是很多培训没办法长期做下去的原因之一。\n\n这个困境的解法，就在：\n\n「我要把学员教好，就得花更多时间精力」。\n\n这句话上。\n\n但：谁说要把学员教好，一定得花更多的时间精力？\n\n####
    解法一：把一份时间卖很多次\n\n很多人做培训，主打的噱头是：1v1。\n\n但在我的训练营体系里，1v1是学员优先级最低的选项。\n\n因为1v1：\n\n1.  会耗费大量时间\n\n1.  会需要我重复回答非常多的问题\n\n1.  即时回复的东西，都是未经雕琢的碎片化的信息，对学员的帮助，效果并没那么好\n\n简单来说，就是1v1是最吃力不讨好的事情。\n\n那我们具体要怎么做呢：\n\n1.  制作项目的操作手册。系统性的给出做成项目要做的流程和具体动作。——标准，让入门的新手，可以对照着手册，把每个动作做清楚\n\n操作手册是系统性的给出所有知识，是用来「查」的。\n\n1.  直播讲解项目和操作手册，并进行答疑。新手入门一个项目，不仅需要查，还需要理解。所以，我们可以通过一场直播，讲解清楚手册的内容、演示图文讲不清楚的具体动作、说清楚不同动作之间的关系以及重点。最后进行答疑和录屏。\n\n直播是更直观的介绍手册，是用来「理解」的。\n\n1.  制作项目的百问百答手册，供查阅。新手在学习的过程中，会有各种各样的细节问题。这些问题，平时大家都会在群里讨论。而我们要做的，是把这些问题整理出来，出一个百问百答文档，供大家遇到问题的时候查阅。\n\n百问百答是各种碎片化的问题，也是用来查的。\n\n新手入门的问题，无非就是：\n\n1.  不知道做什么\n\n1.  不知道怎么做\n\n不知道做什么，就去看操作手册，听话照做\n\n看完之后还不清楚、不理解怎么做，就去看直播录屏，加深理解。\n\n遇到具体的问题了，就去群里提问，或者查询百问百答手册。\n\n如果经过直播（包括录屏）+操作手册+百问百答还解决不了问题，再上1v1诊断。\n\n按照以往经验来说，上述已经能解决大部分问题，1v1诊断的情况很少出现。\n\n####
    解法二：撬动学员的时间\n\n老师毕竟是从一个成熟的实操者的角度，来制作的操作手册和直播。\n\n同时，老师的基础，和学员们的基础，也是不一样的。\n\n这就导致了，学员会遇到很多老师没遇到过的困难。\n\n这个时候，优秀学员的经验分享，就显得意义巨大了：\n\n1.  可以给其他学员信心——同期的你可以，我也可以\n\n1.  在「怎么学」这块，起到一个榜样的作用——老师一般更知道教怎么做\n\n1.  更好的氛围。学员之间互帮互助，会让大家更有归属感\n\n而对优秀学员来说：\n\n1.  通过分享，让更多人知道自己的能力，提高了自己的影响力\n\n1.  通过准备分享，更清楚的意识到出自己的正确动作是什么，让自己的成果更稳。——我们称之为「分享必爆」\n\n1.  传递正能量。听了分享的学员，总有一些人会记在心里，并总会有机会回馈这份善意。\n\n对老师来说，优秀学员的分享，非常好的丰富了课程，也能很好的释放自己的时间精力。\n\n这是三方共赢的行为。\n\n####
    解法三：让学员意识到自己的责任\n\n之前我刚做训练营的时候，还会花时间去提醒那些不积极主动、掉队的学员。\n\n后来，我发现这样的学员：\n\n1.  有的会在我提醒之后，完全无声无息\n\n1.  有的会在我提醒之后，敷衍式的做一些动作\n\n但，几乎没有人会因为我的提醒，而做出成绩。\n\n因为，他们是在「被动」的做项目。\n\n他们把做出成果的希望，完全寄托在别人身上。\n\n而被动的做项目，几乎是不可能做出成果的。\n\n反而是我努力帮积极主动的学员做出成果后，这些后进的学员看到后，会重拾积极性，归队一起冲。\n\n所以，后来我：\n\n1.  几乎取消了所有对后进学员的提醒工作。这是只会感动自己的无效工作\n\n1.  在每次开营之前，都会花时间让大家意识到做出成果的责任在自己身上。简单来说就是：\n\n*   我的责任是：在你想做这个项目的时候，遇到的问题，都能得到解决\n\n*   你的责任是：踏踏实实的执行项目，努力保证动作不变形。\n\n1.  设置打卡的动作，让学员每天写下自己当天的执行动作、遇到的问题，以及复盘\n\n做到：失败的唯一可能性，就是学员自己放弃。\n\n相信我，当学员们开始意识到责任在自己身上的时候，他们的成材率会高特别特别多，作为开训练营的我们，也会轻松特别特别多。\n\n很多时候，大家不是执行力不行，只是没有得到正确的引导。\n\n##
    干法---保姆级落地步骤\n\n设计一个训练营，分成两个步骤：\n\n1.  招生\n\n1.  交付\n\n### 招生\n\n招生要解决的问题是：\n\n1.  获取生源（这个说来话长，这边不展开说）\n\n1.  收款\n\n1.  课程运营（比如说分销、优惠券等）\n\n许多人刚开始做培训，收学员都是直接用微信支付。\n\n但学员少了还好，学员一多就容易乱。——哪些学员给我付费了？什么时候付费的？哪些学员给我推荐过新学员？哪些学员可以给优惠？\n\n同时，个人账户收款太多，也很容易出现账户异常的问题，同时也会为后续的税务问题留下隐患。\n\n这边提供两个我用过的平台：\n\n1.  千聊（免费）\n\n1.  小鹅通\n\n大家学员多的话，买个平台收款，成本就不算高。\n\n学员少的话，可以直接跳过这一步，看【交付】的板块。\n\n*
    * *\n\n千聊的优点是免费。\n\n同时免费版就支持收款，分销等功能。\n\n缺点是客服反应慢。除此之外，现在千聊的风控也比较严格。一旦你的课程属于下面这些类目，你的课程款项都有可能被冻结，分阶段返还。\n\n星座玄学、医疗、金融财经、部分教育培训行业、非课程教学、线下履约、跨境电商、抖音培训等领域。\n\n我自己在千聊上开过一期课程，款项被冻结了50%，剩下部分分阶段返还，预计得9个月才能全部提现。\n\n小鹅通的缺点是需要付费。\n\n标准版4800，专业版7999.\n\n正常大家购买4800的版本就可以了。\n\n价格的话，生财也有很多圈友在做小鹅通的代理商，都可以拿到适当的折扣。\n\n具体区别看这个文档。\n\n优点的话就很多了，可以上视频号直播，可以分销，可以收集学员信息表单，分销和裂变的工具也很多。\n\n有需要的，购买后自行去研究即可。\n\n###
    交付\n\n按照上面心法的内容，我这边习惯的交付方式是：\n\n1.  操作手册——飞书文档\n\n1.  直播授课&录播回放——飞书直播\n\n1.  打卡——飞书群\n\n1.  交流——微信群\n\n1.  百问百答——飞书文档\n\n接下来，我会一步步告诉大家怎么做。\n\n###
    操作手册\n\n操作手册，我往往是采用飞书文档来写。\n\n飞书文档的好处是：\n\n1.  可以限制只有某个飞书群的成员可见，有助于保护付费成员的权益\n\n1.  可以灵活插入图片、视频、文档、软件，有助于我们把课讲清楚\n\n大家可以无脑选择用飞书文档来写操作手册。\n\n那，操作手册要怎么写呢？\n\n人接受陌生信息的能力是有限的。\n\n所以，这一步要做到两个点：\n\n1.  按阶段给出信息\n\n1.  只给最少必要信息\n\n作为学员，相信大家都有被一堆录播视频，一堆文档砸晕的经历吧？\n\n大多数人得到海量的信息，第一反应是兴奋，第二反应是绝望。\n\n“我该从哪看起？”\n\n“哪些是重点？”\n\n“我看到哪里的时候可以开始做？”\n\n####
    按阶段给出信息\n\n所以，我们做操作手册之前，首先要学会拆分。\n\n我们要梳理一下：\n\n1.  要做成自己这个项目，都需要做什么事情？\n\n1.  这些事情的先后顺序是什么？\n\n1.  做成这些事情，分别需要具备什么样的技能和知识？\n\n1.  掌握这些技能和知识，大概需要多长时间？\n\n然后，分阶段放出这些信息。\n\n拿我之前做的情感号训练营的课程设计举例。\n\n做成情感号引流项目，需要：\n\n1.  有一个可以承接流量，并且具备一定功能的公众号\n\n1.  有持续输出视频的抖音号，源源不断的获取公域流量\n\n1.  懂得如何运营抖音，以获取更多的公域流量\n\n1.  知道怎么把引流过来的流量变现\n\n所以，当时这个训练营的第一节课，就只讲：怎么搭建一个情感类公众号。\n\n然后，留一周的时间，给大家去执行。\n\n第二节课，就只讲：怎么制作可以获取流量的视频。\n\n然后留一周的时间，给大家去执行。\n\n第三节课：就只讲：抖音运营的知识\n\n然后，留一周的时间，给大家去执行。\n\n第四节课，就只讲：变现的路径\n\n然后，留一周的时间，给大家去执行。\n\n每一周有一个固定的主题，大家就围绕着这一个主题去执行，去讨论。\n\n做成一个项目，很难。\n\n但把项目分解清楚，让大家一块，一块执行清楚了，难度就会下降很多。\n\n####
    只给最少必要信息\n\n除了一些初心就是割韭菜的人之外，我相信大部分做付费课程的人，都是热爱分享的。\n\n但我们这种热爱分享的人，大多有个毛病：恨不得把自己知道的全部分享出来。\n\n但问题是：学员接受不了那么多信息。\n\n给的信息太多，只会让学员脑子里一团浆糊，反而提高了学习的门槛。\n\n所以，要做课程，我们还必须懂一个概念——最少必要信息。\n\n什么是最少必要信息呢？\n\n就是学员完成一件事情，只需要掌握哪些信息。\n\n举个例子，前阶段我教大家怎么做视频号带货。\n\n我只需要：\n\n1.  简单介绍一种玩法玩法逻辑——当时我选择的是纯搬运玩法\n\n1.  告诉大家怎么用考古加&精选联盟选品\n\n1.  告诉大家怎么用哼哼猫批量下载\n\n1.  告诉大家下载之后怎么批量上传并发布视频\n\n在这个阶段，我不需要把我知道的混剪、原创等方法也告诉大家。\n\n我不需要把考古加&精选联盟的其他功能（看流量构成、看近期飙升的新玩家等）告诉大家。\n\n因为，大家要完成闭环，只需要了解这些信息。\n\n更多的信息，是大家在需要进阶的阶段，在去做其他项目的时候，才需要了解的信息，属于「有用」但「不必要」的信息。\n\n正如学吉他，最快的方式不是先从乐理，看谱开始学，而是先学会弹小星星。\n\n入门项目也是一样的逻辑，先掌握，也只需要掌握「最少必要信息」。\n\n大家可以在操作手册给出后，问一问自己：\n\n「文档里面哪些信息，删掉之后，也不影响学员完成这个阶段的动作？」\n\n然后，删掉这些内容。\n\n####
    直播授课&录播回放\n\n有了文档后，我们还需要直播一次。\n\n直播内容：\n\n1.  讲解文档，讲清文档里面的重点，帮助大家理解\n\n1.  答疑，对文档的内容补缺补漏。\n\n不得不再次感慨，飞书太强大了。\n\n大家直播授课，也是可以直接采用飞书直播：\n\n1.  可以限定特定飞书群人员参与\n\n1.  可以共享屏幕进行讲解\n\n1.  稳定且流畅。飞书牛逼\n\n1.  可以自动生成回放\n\n####
    打卡\n\n我们采用的是飞书群打卡。\n\n打卡的核心点：\n\n1.  提醒学员每天要执行，要复盘。\n\n1.  激发学员互动\n\n为了降低学员打卡的门槛，我还会设定要成打卡模板。\n\n大家可以参考一下：\n\n1.今日发布视频数量\n\n2.昨日发布视频总播放量\n\n3\\.
    昨日GMV:\n\n4.明日发布计划：\n\n5\\. 遇到问题以及如何解决\n\n6\\. 疑问：\n\n在飞书群，大家还可以对彼此的打卡信息点赞，互动。\n\n![](img/b6764fcf57b6a5cd66dfd1189360c4e1.png)\n\n####
    交流\n\n这个板块，则放在微信群。\n\n因为前面我们已经把每周的内容统一，所以，大家的问题和讨论的信息，都会比较集中。\n\n相比各种信息混杂，还需要付出比较高的筛选信息成本的群，学员自然会更活跃。\n\n####
    百问百答\n\n百问百答文档，里面的问题源于：\n\n1.  微信群的讨论\n\n1.  打卡群的答疑\n\n1.  学员的1v1诊断\n\n我们可以把这几个地方的问题和答案，定期整理进百问百答文档里面。\n\n这样可以避免反复回答一些重复的问题。\n\n注意点：\n\n1.  百问百答，要按照阶段来分类，而不是简单的把信息堆在一起，更不是按照日期来分类\n\n1.  如果问题是学员解决的，最好能艾特出这个学员。这样也能帮学员扩大影响力。\n\n具体可以参考\n\n##
    写在最后\n\n副业培训行业其实还是比较乱的。\n\n但我相信很多没做好交付的人，初心并非割韭菜。\n\n毕竟，谁不想自己的名声好呢？\n\n只是，很多人懂做项目，但不懂教项目，更没有一个可参考的高效的培训体系。\n\n希望，我的这个文档，多少能帮到大家。\n\n能让已经成功跑出项目的人，能通过培训，复制自己的成功，拓宽收入来源。\n\n能让更多想做项目的普通人，能有学得会、靠谱的副业培训项目，开启一个一个新世界的大门。\n\n我是郭晓文，最懂新手的男人。\n\n欢迎交流。微信：gxw_career"'
- role: tool
  tool_call_id: call_f47429dbe130450f90a521fc
  content: '"# 初创公司如何科学量化股权分配？股权分配五步法教你不再踩坑！！！\n\n> 来源：[https://ozqj66fvp1.feishu.cn/docx/C0dydiFPCoBI3LxemwWcXpdxn2e](https://ozqj66fvp1.feishu.cn/docx/C0dydiFPCoBI3LxemwWcXpdxn2e)\n\n####
    \n\n哈喽大家好，我是玉斌，在分享之前，我特地去生财精华帖里搜了下，讲股权的很多，但是在如何科学量化股权分配上，我还没有看到有圈友系统的分享过，所以今天我冒昧来给大家分享下如何定性定量的科学的把股权算出来。\n\n生财圈友大多是创业者，很多圈友的企业已经做得非常大，不知道大家在刚创业并且有合伙人的情况下，是用什么方法去做的股权分配呢？比如说是按股东各自的出资比例，还是有一定的方法论？\n\n先抛2个比较普遍的案例问题给大家。\n\n一：假设你准备做一个全国连锁的快餐品牌，其中有一些合伙人需要负责市场运营，有些合伙人有配方，有些合伙人只出钱，如果你是
    CEO 你要怎么协调，怎么去分配这个股权？按出资比例分配吗？\n\n二：如果你的团队有四个合伙人，这四个合伙人分别是负责市场的，负责运营的，负责产品的，负责融资的，每个人的能力背景都不一样。你作为创始人，你要怎么平衡好每个合伙人的股权情况？大家激情澎湃的准备一起来搞一个事情，但是每个人负责的板块并不一样，这时候我们要怎么去分配这个股权呢？\n\n对以上2个案例，如果你只是拍脑袋凭感觉决策，就要认真往下看啦~\n\n#
    一.4C 动态量化股权分配模型是什么？\n\n今天给大家提供一个工具，这个工具的名称叫 4C 动态量化股权分配模型。实际上我们做股权设计的时候，它会涉及到很多工具，甚至有可能不同的项目，它用到的工具是不一样的。今天和大家分享的4C
    动态量化股权分配模型特别适合小白，特别适合一些刚刚开始的初创型的项目，他会给大家非常明确的参考的指引。\n\n先和大家分享下，4C 动态量化股权分配模型中的4C，是什么意思。\n\n![](img/86936afb478c8488aed5017e653d4f43.png)\n\n4C中的C，就是资本的意思，资本我们分为人力资本和货币资本。再细分成4个维度的话，就是创始人身份、岗位权重、时间投入、资金投入。这四个维度是这个工具里面已经给大家植入的一个参数，这个参数是在一定的范围内波动的。\n\n下图是股权比例范围，我等下会给大家案例，不同的赛道，他的参数比例是完全不同的。\n\n![](img/4b992642f9f28d34f6888d4a4ff9acf3.png)\n\n首先，我们要达成以下几个共识：\n\n1.创始人身份它其实是最重要的，我认为谁承担最大的风险，谁就最有控制整个企业的需要。这就是创始人身份的这个比例权重的来源。如果我这个项目黄了，他可能还欠了一些债，他可能还涉及到一些员工工资要发放，谁来最后承担这个兜底的人，那么我会认为这个人他就是发起人和创始人。创始人的身份是要极度明确的，从一开始就要很明确，它是要能控制这个项目的，一家公司最后对外的时候，应该只有一个声音。创始人身份的权重通常在10%-30%。\n\n2.岗位权重，就是这个行业技术壁垒在哪里，那个岗位是最重要的。这个项目里面哪个岗位对这个项目的重要性最高，合伙人一定要对这个达成共识。比如说一个负责产品研发的和一个负责市场的，他们都认为各自的岗位权重在这个项目里面是更为重要的，那这里就会产生一个巨大的分歧。这个分歧在我们前期做股权设计的时候，大家可能不容易发现，但是在公司发展壮大的过程中，越到后面越会产生一些隐患。因为大家从一开始对自己的重要程度的判断就是不一致的，大多数合作伙伴拆伙，就是觉得自己最重要，出力最多，但是分到的钱又不是最多。所以在前期就要聊清楚，公司还没有开始发展的时候，也是最为好聊的时候，因为还没有赚钱，就不会那么计较。岗位权重通常在30%-40%。\n\n3.时间的投入，最简单的划分就是全职还是兼职，投入精力的大小等。时间投入的权重通常在10%-25%。\n\n4.资金的投入。这个比较好理解，所有的项目都会有一个前期资金的投入。比如说我们可能要设立公司，我们要租办公场地等。我们可以通过时间投入和资金投入去判断这个合伙人他对项目的信心和他愿意承担多大的风险。资金投入的权重通常在20%-50%。\n\n需要和大家再解释下，这4个维度的比例并不是固定的，上文给到大家的比例，是成百上千个案例积累下来的一个经验，在实操过程中，最终还是要创始团队一起来做一个锚定，达成共识。在权重比例产生分歧的时候，我们会有一个自评和互评，篇幅有限，就不在这边写了，在下文会给大家一些各个赛道的通用权重比例。\n\n#
    二：股权分配五步法\n\n![](img/87d6d7cd8c42a2449dced0b5f6f58652.png)\n\n在确认四个维度的权重比例后，我们会按照五步法来计算出各个股东的最终股权比例，下面带大家一起过一个真实案例。\n\n案例分享：有三个朋友合伙，他们准备一起做一个儿童体能训练的项目，这个项目的预期启动资金是
    200 万。他们看上了一个购物中心的一个 300 平的商铺，准备先开一个旗舰店。合伙人的背景是这样子的，合伙人一：小明，之前加盟过一个幼儿游泳馆的品牌，他对儿童教育培训是有一定经验的。合伙人二：小磊，他之前一直在大众点评做运营推广，对实体店的品牌包装和运营有经验。合伙人三：小胡，现在在国企上班，家里拆迁户特别有经济实力，他愿意投资
    150 万。这个模型比较经典，有人能负责产品，有人有市场渠道资源，还有人能出钱。\n\n现在小明和小磊是准备全职投入这个项目的，但是小胡在国企上班，不差钱，不能全职参与，但他特别看好小明的能力，所以他愿意投资。那小明作为发起人，前期是准备出资
    50 万，但是小磊不太愿意出钱了，他就觉得市场为王，能搞定市场，他就不需要出钱了。\n\n那么问题来了，如果你是 CEO ，你认为小明应该占多少股？小磊应该占多少股？然后小胡应该占多少股？\n\n先把答案分享给大家，同时带大家走一遍股权分配五步法流程。\n\n![](img/15859acf067aca3df9fd399280f86d63.png)\n\n##
    第一个步骤：确定行业和赛道\n\n![](img/799123b32525d9512ba40ea987793007.png)\n\n我们要先确定赛道，也就是你所处的行业，不同的赛道，对资金和技术的权重不一样。我们把行业分成2个维度四个类型，分别是技术驱动型/资金驱动型，以及自主创业型/集团孵化型，我们这个案例里面的行业，它就是一个线下教育的项目，是自主创业型，它对标的是集团孵化型，就是后面没有人在支持你。线下教育它对场地有非常重的依赖，所以它是偏向资金驱动，它是靠商业模式和资金驱动来发展壮大，而不是靠某一个技术壁垒。所以我们在这个项目里面，就会把它定位成资金驱动型和自主创业型。\n\n##
    第二个步骤：收集创始团队信息\n\n![](img/e8d76da515f4c0e8a84cad5670ac4bd6.png)\n\n我们要开始收集合伙人的信息，也就是创始人的信息和其他联合创始人的信息。以及这个项目里面谁是全职，谁负责哪个岗位，各自出资额度等。\n\n##
    第三个步骤：确定每个维度的权重比例\n\n![](img/35b537e85d261b5c7180f5bcfc3822ba.png)\n\n这是 4C 动态量化股权分配模型里最大的问题，对四个维度的比例分配，再次强调下，相信很多人到这边还是有疑问，不理解为什么这4个维度要按照这个比例去分配，比如说在这个项目里为什么创始人的身份是15%，岗位权重是30%，时间投入是15%，资金投入是40%，这个是谁定的，是怎么来的？这涉及到刚刚说的另一个工具，创始团队之间的自评和互评，从而达成一个共识，股东们要先认可这个赛道的这4个维度就是在这样的一个区间波动微调。这是
    4C 工具的一个前置逻辑，非常非常重要。\n\n## 第四个步骤：确定股东四个维度的权重系数\n\n![](img/8cd60b8bd7c71eba9a36e1418585df38.png)\n\n我们确定了每个维度的权重比例之后，就要确定股东四个维度的权重系数，按从
    1 到 10 各自去打分，就是每一个维度每一个人、每一个合伙人他要打多少分，这里也是分自评和他评。\n\n这个案子里是怎么评的呢，我们先看第一个维度，创始人身份，实际上创始人这个身份它并不完全代表着荣耀，在我看来，它其实代表着风险承担，就谁最后在兜底。当这个项目不成立或这个项目遇到了极大的风险，谁愿意无条件的去为这个项目兜底，那这个人就是创始人，他对这个项目的付出程度是跟其他的合伙人完全不一样。所以在这个项目里面，很显然发起人是小明，全身心投入，并且也愿意出钱，也为了这个项目去找各种各样的资源。所以在这个维度，小明拿了10分。\n\n资金投入维度，这个比较简单，小胡出
    150 万，小明出 50 万，按照投入资金比例划分即可。创始人维度和资金投入维度这两个是不容易有分歧的。特别容易产生分歧的是在岗位分工和时间投入上，借着这个案例，给大家做一个简单的分析。\n\n先讲时间投入，时间投入我们衡量的标准是全职和兼职，但是大家有没有想过，就是其实有
    60% 左右的项目，所有的合伙人除了纯财务投资人之外，其实都是全职参与的。只是说你全职参与的这个产出它是不是就能匹配的到这个项目的所有的进展，项目到达的里程碑是不是跟你全职参与有必然关系。所以我们前期在做股权设计的时候，就一定要讲清楚，这个时间投入，它对应的除了是我们投入的时间精力，还有我们愿意引进的资源，愿意为了这个项目付出多少，不单单只是一个全职兼职。\n\n实际上在这个项目里面，小明他是负责主要的商业模式设计，然后做一些产品的迭代。小磊他主要是负责这个项目的包装和怎么做线下门店的运营，负责门店的市场渠道营销。\n\n那我们在做股权设计的时候，前期是要跟这三个创始人去做沟通，要跑通这个商业模式，我们需要设置一些里程碑，比如达到盈亏平衡点之类的。在这些里程碑里面，那么哪个岗位它的权重是最重的，或者说它们各自应该是一个什么样的比例？大家通过自评和互评，最终得出来岗位权重是
    7 ：2 ：1。\n\n那么小胡为什么在里面还占有一个比例1呢？因为在这个项目里面，他其实是一个金主，小胡他不仅解决了第一期投入，他还可以解决后面再引进新的投资人的这种资源对接。可以理解成是一个负责融资的岗位，大家能理解吗？\n\n然后小磊他是负责市场开拓的人，而小明他是负责整个商业模式的设计和去落实。所以这个岗位分工在这个项目里面，我们最终通过自评和互评得出来这个平均值最终就是
    7 ： 2 ：1，然后时间投入是 6 ： 3 ：1。\n\n## 第五个步骤：计算出各个股东的股权比例。\n\n![](img/51ac695b6d235a88248a9167f9933b25.png)\n\n最后比例就是最早发给大家的图：\n\n![](img/86f5958ad256ee5a8a315f0c19cdd1fe.png)\n\n#
    三：总结\n\n在最后不得不提醒大家的是，这个股权比例分配是最最简单的一个环节，并不是说，按这个比例算出来的，就是最终体现在工商商事主体上的最后结果。在算完初步的股权分配后，我们还会有其他一系列的合同规范和调整，比如一致行动权，期权池，分红奖励，回购权，纯资金方投资的优先清算权，领售权，等等等等。\n\n如果有需要相关的股权合同模板，可以随时找我要~VX：18030219049"'
- role: tool
  tool_call_id: call_40b9186ee8d2498fa732c714
  content: '"# 抖音自动化公转私玩法及防封攻略\n\n> 来源：[https://p9rxk6ovll.feishu.cn/docx/QbBKdHvfiofIUNxDlmjceWbfnqh](https://p9rxk6ovll.feishu.cn/docx/QbBKdHvfiofIUNxDlmjceWbfnqh)\n\n抖音公转私的半自动/人工玩法圈友们分享得不少，关于市面上自动转化的玩法也不少，但很多容易导致封号，本文围绕抖音公转私自动化玩法及防封把常见方法进行拆解，一方面便于大家结合自己的情况进行选择合适的玩法，另一方面在筛选一些转化工具时可以参考减少被坑。\n\n以下为本文主体内容：\n\n为了有更直观的了解，先看下相关效果，以导流加微为例\n\n#
    加微效果演示\n\n这些都是我们已经跑通的玩法\n\n## 1.评论区跳转加微\n\n评论区顶部-（点击引导图）-点击打开微信-长按加好友\n\n![](img/d3e8de102d7436d4893fd45f927be1be.png)\n\n##
    2.直播间跳转加微\n\n直播小风车-点击引导图-点击打开微信-长按加好友\n\n![](img/78969fcc8d34d412341d21cfee56d5a8.png)\n\n##
    3.主页跳转加微\n\n抖音主页-点击引导图-点击打开微信-长按加好友\n\n![](img/15ca660126c15c55eaf2f25b376d91fc.png)\n\n##
    4.私信自动回复加微\n\n抖音私信-自动回复卡片+话术-点击引导图-点击打开微信-长按加好友\n\n![](img/106c6b6e4ee21768c2c713c0b898bdc3.png)\n\n#
    适用账号\n\n首先了解下抖音的账号类型：\n\n个人号：普通个人号、员工号\n\n认证号：黄v、蓝v、半蓝（资料已提交，资质已过审，未付费，不显示认证主体）\n\n蓝v：官方蓝v、小店蓝v（小店赠送）、来客蓝v（抖音来客开通，功能不全）\n\n下图为小店蓝v\n\n![](img/0eb07cc348b2a6ca1ddd9d3790de6c8a.png)\n\n##
    1.各类账号适用玩法\n\n|  | 认证号 |  |  | 个人号 |  |\n|  | 蓝v | 半蓝 | 员工号 | 黄v | 普通个人 |\n| 主页跳转
    | √ | √ | √ |  |  |\n| 视频自动评论 | √ | √ |  |  |  |\n| 私信卡片 | √ | √ | √ |  |  |\n|
    直播小风车 | √ | √ | √ |  |  |\n| 抖音群 | √ | √ | √ | √ | √ |\n| 说明 | 小店蓝v、来客蓝v不适用 |  |  |  |  |\n\n从适用玩法上看，官方蓝v和半蓝的跳转路径是最丰富的，适合根据不同行业属性，组合成不同的私域转化路径。\n\n员工号可作为矩阵号的延伸，帮助企业节约认证成本，员工号跳转主页\n\n##
    2.如何免费开通蓝v和半蓝\n\n抖音蓝v认证页面\n\n半蓝：完成企业身份验证 免费蓝v：点击限时免费审核，\n\n满足500粉，配置商家主页即可免费开通\n\n![](img/1808faa1efdc4e2d5b0e147ba42156b0.png)\n\n![](img/60743eb91b73a9d95a49d0c1644f116c.png)\n\n##
    3.如何开通员工号\n\n企业号后台-营销矩阵-员工账号申请，申请后，员工激活即可\n\n开通成功员工号享有企业号类似的功能玩法\n\n![](img/5aa6779e8ad89e3d6016a8259fda617b.png)\n\n开通后效果\n\n![](img/64ddde053f7093c2e66823be6bf2ca13.png)\n\n![](img/7282daeb6d908824cbfc8ceea3010eed.png)\n\n#
    转化入口\n\n## 1.主页链接跳转\n\n当用户点击主页-官网主页等黄色超链，实现对应跳转\n\n![](img/2ab2b95ba3d7b7a5ca65e1008bd477c0.png)\n\n玩法建议\n\n普通玩法：跳转私信、下载app、团购等\n\n升级玩法：通过接口对接，生成带链接的主页，实现页面链接跳转微信，详见上方效果演示\n\n##
    2.短视频评论跳转\n\n### 评论自动回复\n\n一样两种玩法：官方后台、接口开发的产品\n\n1.走官方后台，内容需要先过平台审核，回复速度超快且稳定\n\n方法去年就分享过，这里再列一下，便于查看\n\n巨量纵横的官方接口，直接在后台设置即可\n\n适用于抖音蓝V\n\n说下具体步骤：\n\n1.注册巨量纵巨量纵横（也可以让开通了的帮忙绑定，见图1）\n\n2.授权绑定抖音号\n\n3.设置评论关键词和回复内容，完事儿，自动评论速度5秒内\n\n![](img/bef65de4e2ae97979f05223c15e077a5.png)\n\n![](img/aacee21e2effcd4cb0f5105867ba703d.png)\n\n![](img/e730ceefb29164dba45030f38f0bcca8.png)\n\n玩法建议\n\n普通玩法：发视频自动关联小程序或poI，评论引导转化；\n\n升级玩法：结合下方评论跳转微信玩法，通过自动回复引导点击\n\n2.接口或对应产品实现\n\n懂技术的可以到抖音开放平台申请相应接口，现在很多短视频矩阵平台都是通过接口实现的\n\n![](img/1121d082bb4a972fc63c2d844fbad15c.png)\n\n具体的功能可参考\n\n![](img/6b8697e22914d21ae692f45c19a995eb.png)\n\n###
    评论跳转微信\n\n#### 付费玩法\n\n普通玩法:巨量星图付费投放\n\n星图后台创建任务-短视频-选达人发布任务\n\n至少1050起步，适合人民币玩家，对普通创业者不友好\n\n![](img/6d9495cf263d7c8d0265e09eaccb09e6.png)\n\n####
    免费玩法\n\n升级玩法：通过接口对接，生成带链接的官网主页，生成后一直免费\n\n企业号后台短视频管理-添加经营工具-官网主页-添加，即可实现评论页链接跳转微信，详见上方效果演示\n\n![](img/cc7df94726c41fef6e02822835597578.png)\n\n![](img/051b078ea9932609b8c6d508a8fd07a1.png)\n\n强烈建议做了抖音SEO或者短视频流量不错的圈友，用此类方法把引来的流量吃干抹净。\n\n##
    3.私信卡片跳转\n\n### 抖音卡片\n\n在私信或群聊中以卡片样式出现，具备跳转功能，多用来微信私域转化\n\n![](img/cfc5f4a092ea540185790f2206d5a463.png)\n\n###
    抖音卡片类型\n\n市面上出售比较常见的有app、小程序生成，只能手动分享，无法自动回复，抗风险能力弱\n\n| 卡片类型及生成原理 | 能否跳转微信 |
    能否自动回复 | 潜在风险 |\n| 抖音官方开通 | √ | √ | 无 |\n| 抖音接口对接 | √ | √ | 无 |\n| app生成 | √ |  |
    域名拦截 |\n| 小程序生成 | √ |  | 域名拦截 |\n| 橙子建站 | √ |  | 无 |\n| 抖音后台订阅通知 |  |  | 无 |\n\n普通玩法：\n\n如果做矩阵号，或者账号风控要求不高，可以用第3-4方式实现跳转微信\n\n升级玩法：\n\n通过接口实现效果演示中，虽然点击步骤多了一步，但由于用的全是官方的功能，安全持久且能实现私信自动回复\n\n##
    4.直播小风车\n\n广义上的小风车应该是直播卡片，包含预约，留咨，咨询，团购，跳转微信等功能，只是运营者更多关注的是私域变现传着传着都指的是直播加微的功能\n\n![](img/e6660b0ee0a9d0f54391f3eb7a4e6ba9.png)\n\n关于跳转加微/微信小程序等，常见的也有两种实现方式\n\n普通玩法：和短视频评论跳转类似，走巨量星图付费投放\n\n星图后台创建任务-直播-选达人发布任务，1000/小时起，适合人民币玩家，对普通创业者不友好\n\n![](img/9434df525f8b787346076adc96b6f689.png)\n\n![](img/8ab4de6ca79169156e31363f7cb48aab.png)\n\n升级玩法：通过接口对接，生成带链接的小风车，生成后一直免费\n\n企业号后台场景管理-添加直播卡片-讲解，即可实现评论页链接跳转微信，详见上方效果演示（手机端直播也可操作设置，这里不再赘述）\n\n![](img/df0d242295961f182aedb9321c80d858.png)\n\n##
    5.抖音群\n\n设置进群门槛，如关注才能进群，结合私信自动回复，实现自动化触达\n\n设置进群欢迎语，自动@\n\n采用第三方生成的卡片结合抖音群运营，可以降低封号风险\n\n#
    承载与防封\n\n自动化公转私跳微信，转化承载体一般包含两方：抖音号和微信。\n\n所有的防封措施必须同时针对两端考量，否则一方出问题，都会导致转化路径断裂。\n\n##
    抖音防封\n\n结合上面的内容，抖音转化通道主要为手动转发，或接口（含官方产品及官方接口），风险最高的在前者。\n\n1.提高账号安全，减少私信频率，群互动代替一对一人工私信\n\n2.提高账号安全，小号为主进行互动，如手动转发抖音卡片\n\n3.提高域名安全，白名单域名代替第三方域名，否则打开会有不定期的安全提示，影响转化\n\n![](img/d2cb3e2ad51736c812b34d442fee30f4.png)\n\n解决方案：这块有相应的抖链转换工具，生成抖音域名网址如https://v.douyin.com/XXX\n\n最高级别防封：\n\n1.认证蓝v/半蓝（推荐，因为不会影响昵称）\n\n2.如有矩阵号，用员工号\n\n3.通过升级玩法，生成卡片和自动回复，避免限制\n\n升级玩法提交工具界面演示：\n\n![](img/3694aa50ce78d65b2332f38e356e4e08.png)\n\n##
    微信防封\n\n如果用官方接口或者官方产品跳转微信问题极少，这里主要说说其他玩法的防封\n\n其他玩法跳转微信主要两种方式：小程序、微信客服\n\n小程序支持的跳转形式如下：\n\n![](img/4e569e5d7c656aed51cacca5ed58e85f.png)\n\n先看几张封禁案例\n\n1.被发现小程序没有实质内容，属于纯引流\n\n![](img/71a7ee3b3357ad1f9744418bdd38aba7.png)\n\n2.被同行举报，轻则封跳转功能，重则直接干废小程序\n\n![](img/3efb03d47700b4d55dfc3bdf1b553c40.png)\n\n防封建议：\n\n1.保证小程序有一定的自然流量，别全是跳转来的\n\n2.展示内容不建议用小程序页面二维码，改用跳转显示公众号文章文章或第三方小程序\n\n3.让服务商开一个属于自己的独立小程序，别用公用小程序，否则一旦别人的项目出问题，你的跳转也会挂；同时用小程序批量注册工具注册多个小程序备用，一个出问题，马上换上\n\n4.购买小程序或对应跳转服务与服务商沟通，如果小程序出问题，是否更新小程序，以及后续更新费用\n\n最高级别防封：\n\n1.小程序增加防截图举报机制\n\n升级玩法采用的就是这类机制，举报小程序时截图显示不了对应内容\n\n![](img/c21bd74697c04c015952f51199639b53.png)\n\n![](img/fe5b06a49259fa96ad7df6a6c4c574ca.png)\n\n2.微信客服替代小程序\n\n简单说下微信客服，企微衍生的一个支持平台跳转到微信的功能\n\n目前可以直接通过官方后台配置（回复内容及形式单一），也可以通过接口开发的第三方工具，丰富回复内容\n\n![](img/0ea54f71c5c3df26d969bc72f04b5d92.png)\n\n除非微信把自己域名封了，否则这种方式做跳转一直有效\n\n以上就是针对抖音自动化公转私的分享内容，欢迎交流一起探讨，谢谢！"'
