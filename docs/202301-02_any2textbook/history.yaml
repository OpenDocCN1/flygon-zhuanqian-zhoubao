  content: "{\n  \"paper\": \"从零到一打造高质量交付训练营\",\n  \"desc\": \"该素材提出一套‘打造高交付质量训练营’的方法论，核心心法为‘高效率交付才能高质量交付’，并给出三大解法（将一份时间卖多次、撬动学员时间、让学员意识到自身责任）以及训练营的招生与交付干法（含操作手册、直播、打卡、百问百答等具体动作），以解决培训中‘教学投入与一线实战时间冲突’的困境。\"\
    ,\n  \"concepts\": [\n    {\n      \"name\": \"高效率交付\",\n      \"desc\": \"该概念主张交付质量并不取决于教学投入的绝对时长，而取决于交付方式的效率；高效率的交付方式才能支撑可持续的高质量交付。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"核心心法是‘高效率交付才能高质量交付’。\"\
    \n      ]\n    },\n    {\n      \"name\": \"一份时间卖多次\",\n      \"desc\": \"该概念指通过将教学内容沉淀为可复用、可查阅的标准化材料（操作手册、百问百答等），使老师的一次备课和讲解服务于大量学员，从而摆脱1v1重复消耗。\"\
    ,\n      \"is_original\": false,\n      \"excerpt\": [\n        \"解法一：把一份时间卖很多次。1v1是学员优先级最低的选项（耗费大量时间、重复回答、碎片化信息帮助有限）。\"\
    ,\n        \"具体做法：制作项目操作手册（系统性给出流程和具体动作，用来查）+直播讲解项目和操作手册（用来理解）+制作百问百答手册（供查阅）。\"\
    \n      ]\n    },\n    {\n      \"name\": \"撬动学员时间\",\n      \"desc\": \"该概念指通过激活优秀学员的经验分享，形成学员之间的互助与示范效应，从而替代老师部分的教学与激励工作，实现老师、分享学员、其他学员三方共赢。\"\
    ,\n      \"is_original\": true,\n      \"excerpt\": [\n        \"解法二：撬动学员的时间。优秀学员的经验分享：给其他学员信心、在怎么学上起榜样作用、更好氛围。对优秀学员本身：通过分享提高影响力、‘分享必爆’、传递正能量。对老师：丰富课程释放时间精力。三方共赢。\"\
    \n      ]\n    },\n    {\n      \"name\": \"学员自身责任\",\n      \"desc\": \"该概念指训练营的成功前提是学员意识到‘做出成果的责任在自己身上’，老师应取消无效的提醒工作，转而通过打卡动作让学员自我驱动。\"\
