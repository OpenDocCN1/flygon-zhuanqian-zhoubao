    \    \"普通人做个人IP最好的起盘方式不是做抖音网红而是做社群群红。\"\n      ]\n    },\n    {\n      \"name\"\
    : \"抱大腿可交换价值定理\",\n      \"desc\": \"抱大腿的本质是提供可交换价值，自身能力是前提；空有人脉而无本事则人脉无效。\",\n\
    \      \"excerpt\": [\n        \"提供可交换价值，练好一身本领是最好的方式。\",\n        \"你不牛逼，认识再多牛逼的人也与你无关。\"\
    \n      ]\n    },\n    {\n      \"name\": \"裂变断层及其解法\",\n      \"desc\": \"单一用户裂变存在第三层断层问题，解法是以团队裂变的利益结构叠加用户裂变的社交传播（战队PK玩法）形成复合裂变机制。\"\
    ,\n      \"excerpt\": [\n        \"只有激发层用户愿意分享，到第三层裂变层就断层。解法是用团队裂变+用户裂变的叠加（战队PK玩法）解决。\"\
    \n      ]\n    }\n  ],\n  \"findings\": [\n    {\n      \"name\": \"高价值私域客户营收案例\"\
    ,\n      \"desc\": \"[claim] 素材宣称：100个愿意在10个月内每月支付1000元的客户即可年入百万；此结论为理论推算示例而非实证数据支撑。\"\
    ,\n      \"excerpt\": [\n        \"搞定100个愿意在10个月里每月支付1000元的客户，就能年入百万。\"\n    \
    \  ]\n    },\n    {\n      \"name\": \"私域用户密度对比案例\",\n      \"desc\": \"[claim]\
    \ 素材宣称：800个微信好友月成交20万，而3万好友月成交5万，好友数量差40倍但成交不足四分之一；此例用于论证私域高粘性价值，但素材未给出数据来源或实验条件。\"\
    ,\n      \"excerpt\": [\n        \"只有800个微信好友月成交20万 vs 3万好友月成交5万，好友数量40倍但成交不足四分之一。\"\
    \n      ]\n    },\n    {\n      \"name\": \"用户裂变传播断层观察\",\n      \"desc\": \"\
