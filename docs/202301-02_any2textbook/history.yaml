    ,\n      \"excerpt\": [\n        \"任何项目都可以拆解成：流量效率，销转效率，交付效率，客单价，毛利率，复购率，这六个点。满足的越多越好，满足四个点，及格。\"\
    ,\n        \"如果三个效率中有一块低，就难以复制放大，就得在客单价、毛利率、复购率这三块下功夫。\"\n      ]\n    }\n  ],\n\
    \  \"theorems\": [\n    {\n      \"name\": \"效率高则可复制放大的核心主张\",\n      \"desc\"\
    : \"流量、销转、交付三效率高意味着项目高度可复制、可矩阵化/培训放大，且赚多赚少取决于流量多少。\",\n      \"excerpt\": [\n\
    \        \"流量效率高意味着内容极其好复制，可以通过矩阵、培训等方式，把这一块单独拎出去进行放大。\",\n        \"销转效率高、交付效率高，意味着销售可以SOP化，不需要极强的专业性，也意味着交付也不需要啥时间精力，同时也意味着流量来了能接得住。\"\
    ,\n        \"意味着赚多赚少取决于流量的多少。\"\n      ]\n    },\n    {\n      \"name\": \"效率短板由收益端弥补的定理\"\
    ,\n      \"desc\": \"若三个效率中有短板，则难以复制放大，须通过在客单价、毛利率、复购率上下功夫（如提高客单价）来增加收入。\",\n\
    \      \"excerpt\": [\n        \"如果三个效率中有一块低，就难以复制放大，就得在客单价、毛利率、复购率这三块下功夫，比如通过提高客单价来增加收入。\"\
    \n      ]\n    },\n    {\n      \"name\": \"底层逻辑决定行动力的主张\",\n      \"desc\": \"\
    唯有明白项目底层逻辑，才能有的放矢地行动。\",\n      \"excerpt\": [\n        \"任何事情只有明白底层逻辑，才能有的放矢。\"\
    \n      ]\n    }\n  ],\n  \"findings\": [\n    {\n      \"name\": \"小说推文项目分析\"\
    ,\n      \"desc\": \"[evidence] 案例表明：流量高、销转高、交付高、客单价低、毛利率高、复购率低。\",\n      \"\
    excerpt\": [\n        \"案例：小说推文项目（流量高、销转高、交付高、客单价低、毛利率高、复购率低）。\"\n      ]\n  \
    \  },\n    {\n      \"name\": \"教育资料与减肥食谱项目\",\n      \"desc\": \"[claim] 教育资料1.0/2.0项目与减肥食谱项目同属案例列举，素材未逐一给出各要素量化值，仅作并列实例。\"\
    ,\n      \"excerpt\": [\n        \"教育资料1.0/2.0项目。减肥食谱项目。\"\n      ]\n    },\n\
    \    {\n      \"name\": \"项目拆解商业IP分析\",\n      \"desc\": \"[evidence] 案例表明：流量效率低、销转效率高、交付效率低、客单价高、毛利率高、复购率高。\"\
    ,\n      \"excerpt\": [\n        \"项目拆解商业IP（流量效率低、销转效率高、交付效率低、客单价高、毛利率高、复购率高）。\"\
    \n      ]\n    },\n    {\n      \"name\": \"知识付费项目分析\",\n      \"desc\": \"[evidence]\
    \ 案例表明：流量高、销转高、交付高、客单价高、毛利率高、复购率低。\",\n      \"excerpt\": [\n        \"知识付费（流量高、销转高、交付高、客单价高、毛利率高、复购率低）。\"\
    \n      ]\n    }\n  ]\n}"
