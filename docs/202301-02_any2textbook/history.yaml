        基于生财有术\"龙哥赚钱周报\"系列素材提炼的可溯源教科书\n> 目标读者：想搞副业、做个人IP、搞私域流量的互联网创业者/内容创作者\n> 本书原则：先拆解再组织，先大纲再正文；每条知识点可回溯到具体素材\n\n---\n\n##
