- role: tool
  tool_call_id: call_a94c310f5e34446f9e132907
  content: '"# IP如何做到风骨体面且年入千万\n\n> 来源：[https://z5uufnsl6h.feishu.cn/docx/HiVkdfBYJo2H5xxWIemcMcMQnLc](https://z5uufnsl6h.feishu.cn/docx/HiVkdfBYJo2H5xxWIemcMcMQnLc)\n\n优质的合作从一个自我介绍开始，欢迎对年入千万感兴趣的IP来一起牛皮。\n\n【姓名】刘梦园（微信：camel17）\n\n【所在地区】北京朝阳\n\n【一句话介绍自己】巢野文化创始人（内容经纪公司）&星云IP计划发起人（20个S级IP、年2亿的盘子、北京市版权局战略试点项目）&内容经纪赛道开创者（开启通往web3.0的钥匙，有极具想象空间的一整套理论和落地体系）\n\n【我的标签】超强内容把控力（十年运营人，涉及多个垂类）；擅长生态布局（例：nobody的时候搭建了覆盖6亿的新媒体公益联盟）；全域IP打造（目前极少数个人把图书知识付费自媒体版权私域都做过且有结果的人）\n\n【其他的】对应用web3.0（目前主要在IP的“上市”方向）、跨越结构洞、整合多维资源有一些心得\n\n![](img/e29f4ce109102c48e09de9b34af76675.png)\n\n为了方便把整个分享的逻辑更清晰的呈现，我们来做一个前提\n\n假设你是一个在某个垂直细分领域有多年积淀和多个亮点案例的人，但你之前从来没有做过课程知识付费自媒体等等（如果有做一部分也尽量从头体验一下，空杯状态下走一遍会发现很多好玩的事情）\n\n那你就可以按照这5大步骤来一点点的把自己的IP运作起来，既能平衡长短期利益又能实现风骨与变现的并存，当然如果你有自己的专属内容经纪人就另当别论了~\n\n5大步骤分别是：\n\n夯实地基\n\n做好内容体系规划（风骨体面）\n\n做好千万营收模型（千万变现）\n\n做好一年的节点规划\n\n落地\n\n##
    一、夯实地基\n\n如果没有自己的专属内容经纪人，那么第一步就需要夯实IP的地基，我会从两个视角来分析这个板块，分别是内部夯实以与市场接轨，外部夯实以便在市场上占据一席之地。\n\n###
    第一部分内部角度\n\n我的内容经纪理论中（整体的内容经纪理论可以参考这篇文章https://mp.weixin.qq.com/s/1BFbuc5H4igCYmJRakdpag）有一个奠基期，需要IP完成30个任务，这30个任务完成基本上就可以和市场接轨了~\n\n很多情况下IP做着做着就遇到了一个卡点，比如直播的时候碰到有人连麦了给人解决不了问题，那是不是可以通过提前多和一些人聊或者深耕这个行业一百个案例来解决这个卡点呢；\n\n还有就是如果打定主意要做内容型IP了，如何做优质输出就是基本功，那就需要先掌握好写作的底层逻辑，那这三本指定的写作书是一定要看的，看就要看经典，市场上的口水书就算了；\n\n再有就是很多人做直播60分钟吭哧吭哧讲完，只有三五个人看，既没有任何变现也没有涨粉，这可能是没做任何准备也可能是没看其他人直播的问题，常规人家准备个15分钟的内容，直接循环就可以了，毕竟人均在线时长大多数到不了8min，去看人家怎么逼单，有什么话术，如何逼单才能在十分钟内从4w的成交变成6w；\n\n还有很多例子，总体上来说还是要做好准备之后再去做IP，当然了这是一个孵化逻辑，想稳扎稳打的走就把自己当个白纸，一步步的做。这和现在市场上的筛选逻辑是不一样的，筛选逻辑下对IP的专业度、展现度、销转能力考核的尤为激烈，所以如果想走筛选逻辑的话先着重练这三个能力也OK~\n\n![](img/9f581e8accf2e9ad45dcb64be4f91794.png)\n\n###
    第二部分外部视角\n\n12345具备了才能上山打老虎，不然只能打个小松鼠（好烂的梗），12345也就是1个母题、2层基因、3重身份、4级观感、5份资产。下面我来详细拆解一下\n\n####
    1个母题\n\n指的是，文化传统中具有传承性的文化因子，或者人类社会中那些循环往复且普遍发生的事情。最简单的理解就是原型。\n\n有本书叫《经典人物原型45种》，里面都是我们平时看电影看小说看话剧时引起我们强烈共鸣的人物的原型，作者们在对自己写的人物把握不住的时候可以仔细看一下这本书，就能搞定更贴合用户需求的人物。\n\n比如说有两个悬疑类的类型叫完美受害人和密室杀人，去搜的话应该有很多这种类型的故事，但这些故事都有一些共性，这个共性就是母题；再比如说，大家都经历过高考，当时老师们都会讲很多经典题，会一道母题，所有相关的百变题型都可以解。\n\n对于IP来说，掌握母题就是可以既搭建出来自己的护城河又能随时调整边界的，这里可以直接挂钩很多人讲的定位卡位，但这个定位有一个弊端就是，它不是从内容的角度出发的，也就没法做好更细化的延展更不可能把护城河做出来，举例来说，讲创业是定位，讲白手起家的创业是卡位，然后呢？还是不好太运作的。\n\n定了一个母题之后，母题下有百变题型的对不对？那百变题型最好是都可以解，百变题型具体都有哪些？题型能不能模块化，解法能不能标准化？输出能不能连续可量化？和需要这些题型的人（用户）的接口能不能简化？用户的体验能不能可视化？这些都能的话，市场上是一定有一席之地的。\n\n2层基因\n\n指文化沉淀价值（风骨）和商业持续能力（变现），这里重点需要说的有三点：\n\n一是不要做没有文化溢价的事情，这要求积少成多，但也不用想的那么大。\n\n比如女性安全这个方向，如果只是做一些遇到危险的情境如何做防卫其实很难真的有文化溢价，毕竟在这种情况下，女性基本处于绝对劣势，那真正需要分享的真正有文化溢价的是通过一些家暴、户外安全、pua、诈骗等等相关的案例分析让女性知道如何才能不让自己置于危险的情境下，用案例引出更多的案例和故事，让整个IP在整个大环境更具有沉淀和厚重感；\n\n比如教穿搭的IP，需要沉淀更多的穿搭图片，不仅仅限于厂商的、品牌的、学员的、自己的，只有当图片的势能沉淀的足够多，IP才能更具有行业话语权，尤其是疫情当下，图片的版权足够多可以做很多事情了，比如线上发布会等等，谁说只有大厂才能做服装发布会，谁说发布会只能是新品，一场发布会包括带货、内容输出、广告、版权授权等等至少能有千万上亿的流水，但这也需要基于有文化溢价的前提下；\n\n二是IP是少数人的领地，每个IP的花期和成长环境不同，不要走别人的路径，既容易形成路径依赖又容易忽略“地图”上不好展示的关键节点；\n\n1931年美籍波兰裔哲学家科日步斯基发现人类在识别模式上有极大的天赋。我们天生具有接受大量数据并将其转化成简易模型的能力，但是有时候我们会忘记那个模型只是现实的表现，而非现实本身。所以基本上任何试图通过他人的成果捕捉现实的尝试，都会使你漏掉很多情境资讯。\n\n比如现在很多家都在学博商的玩法，但忽略了其实博商的后端已经积累了十几年，199的小课只是后端几万上百万费用的钩子；赛马机制可以学，但是后端没有常年的积淀是学不来的，所以不要全学~\n\n最有效的办法是找十个模型，看自己适合哪个模型的哪一部分，再看这些部分能不能有机结合，运作起来是不是顺滑，借鉴但非借用~\n\n三是不要相信天道酬勤那种鬼话，极大概率是幸存者偏差，这里用不下牌桌的能力来表达会更恰当。\n\n看过太多说要常年公众号日更的了，但是不会运营没流量，不做产品预设没变现，不学写作没技巧，不做输入没品质等等。\n\n像这种是不是可以转换个思路呢？把稍微有数据正反馈的内容做一下基本调整，放到另外一个平台，学会把变现放在第一位，如果两周不能变现就赶紧撤赶紧换，这里的变现不是说多多，起码一个300的咨询是可以卖出去的吧？如果再不行就花钱找个团队或者用未来预期换个合伙人吧。\n\n所有的努力与坚持必须是在有非常明晰的前景下才有效，也不要高估了人性，很少有人能在没有持续变现的正反馈下坚持太久。\n\n####
    3重身份\n\n指IP需要根据不同的状态下把自己当工具或者当人或者当神。\n\n工具是从解决用户问题的功能性上去说的，举例来说，我就是来看你分享的如何做知识付费课程的，所以你不要表演其他的东西，我不想看，也不要说你多牛逼，你先帮我把做一节课的问题解决了再说；\n\n人是从解决用户价值主张或情绪性的角度去说的。乔治·戴德说过，在人际交往中，你接触的不是人而是他们的防御机制。\n\n所以IP想与用户的亲近度up,首先就要用情绪打破他们的防御，像个身边的朋友一样和他们沟通，你是个超级富二代但是你在整容上吃了大亏，你是个超级能吐槽的人但是你数学不行，你家庭幸福但是你从小吃了很多苦等等；\n\n神是从解决用户迭代升级的角度去说的。危机具有强烈的再分配的效应。\n\n当用户意识到自身的瓶颈之后便具有了一定的危机感，这时候谁解决这个危机感谁就具有一定的再分配话语权，而往往分配的话语权的丧失也意味着用户已经从平等的状态变成了被指挥被组织的状态，且这种状态会维持较长的一段时间，如果IP能够借助这个状态搭建完自己的组织，那这个护城河就彻底搭建起来了\n\n####
    4级观感\n\n指的是IP的对外输出和呈现上要具备至少两个观感才可以让用户有被感性支配而非理性催生的消费行为。\n\n韩国电影《魔女》中有一句台词是你的S级和我的是不一样的，我是S级是因为最高只有S级。松弛感是说IP有一种尽在掌握的状态，龙飞律师在婚姻方向的连麦上就是有一种松弛感的，给用户的感受就是你的问题我差不多都见过了，你看那些连过麦的都解决了，你还不快来说出你的糟心事儿我给你出出好主意嘛，这也是她的账号短短时间内就破千万的原因；\n\n对象感是指这些话我只对你一个人说，尽可能让用户喜欢你营造出来的这段关系中的自己；直男并不直男癌这个账号基本上就是通过读粉丝私信来做系列涨粉的，每读一份私信都让用户觉得这是在说自己或者自己身边的胖友，通过破口婆心的话语让用户觉得自己应该按照他说的做才是好的自己；\n\n获得感指的是没能让你说卧槽就是我输，南翔不爱吃饭的粉丝说过最多的一句话就是你赚钱我绝对不眼红，能够用一年时间做一道宫廷菜的人是完全对得起用户的期待的也是完全配的上用户的一句卧槽来赞美的，这里本质上还是将自身的专业发挥到极致，成为业内天花板级的存在；\n\n氛围感是指沉浸其中无法自拔。谁能忍住不在李佳琦的直播间剁一次手呢（好吧，我还没有），来感受一下除了直播间氛围“OMG，所有女生们，今天的福利来咯~”外李佳琦的剁手文案给的氛围\n\n口红\n\n这支唇膏在嘴巴上会跳舞\n\n这只口红给人的感觉是，甄嬛上位以后回头一笑，对着那些人说“老娘赢了”\n\n啊！好闪！五克拉的嘴巴\n\n香水\n\n你不惹我我不惹你，你敢惹我，老娘把你卡嚓卡嚓的那种味道\n\n恋爱中的少女，开心的去找男朋友，那种很甜的感觉\n\n屋顶花园，斩男香，非常适合夏天\n\n####
    5份资产\n\n指的用户资产、版权资产、实物资产、文化资产、生态资产这五种和个人IP息息相关的资产形态。\n\n用户资产指的是你的用户是谁决定了你是谁。\n\n如果你的IP是靠流量堆起来的，那这些庞大的数量和数据就是你的用户资产，如果你的IP是靠品牌涨起来的，那品牌本身所具有的势能就是你的用户资产。\n\n显而易见，品牌性质的边界会更广，幂次效应更强，IP的多次“觉醒”就有了可能。必须要说明的是，用户资产的评估模型有很多种，标签、动作、分层、数量、平台等等都会影响评估模型，这里有一个用户资产模型（并非评估模型）可以给大家借鉴一下\n\n![](img/00e9f28ab8fdf27a7ccf65173c0d1739.png)\n\n版权资产首先要明确一个IP可以有17种版权，其中13种是可交易的。\n\n在web3还没普世之前，这个部分做大量的准备和规划是非常有必要的。\n\n首先就是需要有更多的版权内容，包括但不限于做图书知识付费课程自媒体私域版权（这里指的是电子书版权、纸质书版权、有声书版权、课程版权、影视剧版权、视频版权等市场常规说法）；\n\n然后才是通过版权证券化方式做另外一种变现，版权内容和版权证券化都是版权资产。\n\n![](img/6f10b3874ff475afed27723ea4826178.png)\n\n实物资产是指IP衍生品，这一部分在影视剧领域最为常见。\n\n超过数亿以上收益价值的周边系列像悟空大声、机器猫、迪士尼系列、漫威宇宙系列等等，形式多种多样，可以是盲盒、毛绒玩具、服饰、美妆、文具、饮食甚至主题公园等等，同时目前大行其道的还有数字藏品，这属于另外一种实物资产的变种~\n\n文化资产是指IP能够将自己置于某一主文化或者亚文化之下（需要合法合规合趋势），并借势让自己能够获得经济和文化效益。\n\n比如我家星云计划里的一个IP马上就要做自己的版权证券化，有我司整体战略规划和布局，有北京市版权局版权认证支持，有版权链和智能合约的技术支持，有多家机构和资源方的合作，推进之后他就是全国乃至世界IP“上市”第一人，我司也算是创造了一个奇迹，这也算是文化资产的一种；\n\n比如北大荒集团的一个农场要做文化资产方向的规划，北大荒变北大仓，是解决了新中国早期粮食的问题的，所以把“满仓”这种美好寓意作为文化资产的符号，用文化给品牌赋能，李子柒的IP本质上也是走文化资产路线的。\n\n生态资产本质上指的是某个组织里所有成员或者单位协同有效发展带来的经济效益。\n\n肖逸群为什么会做一个福布斯新创企业家联盟和U30同学会，我为什么做一个星云IP计划（后面还有IP上市计划）、生财为什么做航海？其实是从组织一个利益共同体来创造一个终级护城河，这样一来，整合上下游供应链、沉淀多维资源、卡多种生态位、赋能多种项目、极致缩小信息差等目的就都可以达到了~\n\n##
    二、做好内容体系规划\n\n一个IP的内容体系包含5个部分，四级内容架构、一套独有理论、一个十年故事、一份百问百答和一份产品项目产业链打通路径。\n\n####
    1、4级内容架构\n\n它是第一位的，为什么要做这个呢，首先这是风骨的底线边界，然后是可以给内容提真降噪，最后是给产品矩阵（也就是各种版权载体）做养分池。那这4级分别是什么呢？用我家一个IP举例\n\n![](img/752838d1761eb009789cb68a66cfb8a5.png)\n\n第一级是IP方向，印刷学院的教授以及出了40多本书，教别人出书肯定没问题；哲学硕士以及修心类、疗愈类的其实都可以往人生这个深度命题上引导；传记类励志类又可以换成另外一个词就是人生故事；OK了，她的IP方向确定了就，人生之书；\n\n第二级是围绕着IP方向思维发散出二三十个关键词后，选出三个覆盖度足够广的，最终她的3个二级，就是人生、书、人生之书；这里需要说明的是第二级其实是最难确定的，每个IP的生成逻辑都不一样；\n\n第三级是每个关键词下面的关键业务板块，这个部分是可以直接随便拿出一个点了做书做课的；\n\n第四级是关键业务板块下面对应的关键业务内容，尽量遵循mece原则，即相互独立完全穷尽。下面给出她的4级架构作为参考：\n\n![](img/ce41ce7107f0111b5260ae11bfdd9b90.png)\n\n####
    2、一份独创理论\n\n独有理论的前提是能够在某一个方向上有很深的思考和总结，比较讨巧的方式是从多个模型、工具和测评中延展出来，然后再把能力分解成动作，再用用户的故事讲出自己的观点，基本上一套理论就成型了。（这一趴有点啰嗦了，但又怕说不清楚，手动哭笑不得）\n\n系统的方法也是有的，大概分成5种。\n\n第一种理想解法。\n\nTRIZ的一个基本观点是：任何系统都向其理想解方向进化，理想状态不断增加。理想解即消除了所有有害作用，充分发挥有益作用的解决方案。理想解实际是不存在的，当技术系统越接近理想解，其成本越低、效率越高，系统的现有资源利用率越高。\n\nARIZ算法中给出了确定理想解的步骤：\n\n1）设计的最终目标是什么？\n\n2）理想解是什么？\n\n3）达到理想解的障碍是什么？\n\n4）出现这种障碍的结果是什么？\n\n5）不出现这种障碍的条件是什么？\n\n6）创造这些条件存在的可用资源是什么？\n\n所以如果IP想做出来自己的一套理论，可以思考在某一个问题的解决上理想解怎么做，基本上按照这个步骤都可以做出来。（具体案例可以参考《TRIZ:产品创新设计》一书中9.5理想解部分，微信读书可看）\n\n第二种是节点法。\n\n列出你在实际生活工作中给甲方解决一个实际问题需要分几步，每一步可以提炼的共性点又是什么，这些点是否可以通过引入一个其他的物体或者场来串联起来。\n\n举例来说，有个做私域很牛逼的胖友，好几个出版社要找他出书，但他自己想精益求精，我们就讨论了一下他的理论问题，通过理论的确定倒逼内容重新梳理。\n\n因为他的私域年度顾问费用较高（50-100w/年），服务逻辑下，我问的是他怎么给甲方提供服务才能让甲方觉得钱花的不冤，他就说了一下第一步是重构组织结构重塑商业模型，2345步分别是什么，比如私域做的好的企业的模型大概有多少种呢？哪种是这个甲方可以借鉴并吸收的呢？怎么样搭建自己家的包含私域在内的数字化商业模型呢？这个模型有哪些关键节点呢？这些都做好了对企业营收有什么影响呢？\n\n交付逻辑下肯定第一时间要考虑的是私域在甲方里是一个什么地位，在甲方里推进会不会遇到各方的阻碍等等，那就需要把私域放在一个非常友善的位置，用水利万物而不争来说明就非常贴切了，后面的几步也就逐步把水相关的关键词进行对应，比如水系、水利工程、水系、水循环、流水等等。\n\n（特别说明，目前这个水利私域理论属于我的那个朋友，在此仅作为举例使用，不建议朋友们挪用~，如果想私域合作的话我可以对接）\n\n第三种是词根法。\n\n结合IP所在垂直细分领域来做，我司一个文案类IP，她的核心优势是懂商业，那么是和钞票挂钩的，想学文案的人大多数是想获得单位时间内更多钞票的能力的，所以初步的理论可以叫做文案钞能力。\n\n但是吧，一个理论只有钞票这个点是很low的，那还要重点强调这个钞怎么办呢？把所有chao都列出来，看看能不能找个3-5个，我们找出来这三个抄（仿写和拆解）超（文字杠杆）炒（情绪），文案4chao理论get。\n\n但在实际运用中是要把课题分离的，这个理论是我们和出版社谈妥出版的核心点，但不是我们做课程的核心点，课程有另外的分类方法，比如题目是文案人如何让甲方付你4w一条的软文费，那就需要从这4个chao里分别拿出对应的内容来告诉学员怎么用才能解决这个问题。\n\n第四种是母题法。\n\n可以是单独一个母题的延展和截取，也可以是多个母题的有机结合。\n\n“截拳道是一门脱离任何功夫门派窠臼的技击思想，这种思想最宝贵的核心便是反传统的自由。李小龙提出“以无法为有法，以无限为有限”的开拓性拳理，致力于追求武术搏击的根本，追求核心理念为：精简、直接、非传统的三要素技击法，在后期形成了有固定形态和技法的格斗术，由李小龙本人原著的《李小龙技击法》一书成为公认的中期截拳道教材。”\n\n这就是把道德经无为而治的母题和武术的母题做出了结合。\n\n第五种是核心法。\n\n我的内容经纪理论是一整套东西，没办法用以上四种办法解决，那怎么办呢？我找到我这些理论内容的核心点，就是内容经纪人，直接命名内容经纪理论了；还有我最喜欢的《中间人经济》这本书，整本书在说的其实就是6个中间人角色，所以这本书没有理论，但又可以成为中间人理论~\n\n####
    3、百问百答\n\n顾名思义，百问百答最好是有上百个（概数）问题和回答，问题从哪来呢？从行业爆款选题来，从高赞来，从热评来，从变现出发，从用户需求出发。答案怎么写这个没有定式，但有几个需要注意的点，具体如下：\n\n强调用户获得感——认知提升（不急）、学以致用（常规）、即时获利（急）；\n\n预留钩子——引流私域（回复666可以获得xx手册）、植入产品（这里简单回答一下框架，更具体的内容可以联系助理咨询或预购系统课程）、长尾传播（做好水印和二维码，目前最好的模式是飞书关掉对应复制权限）；\n\n降本增效——减少无意义的重复劳动（我的故事可以看一下第XX条内容）、大量精准流量引入（每周三个免费咨询名额，随机朋友圈点赞选择）、高价转化（我有XX可以帮你系统提升和获得结果）；\n\n系统问答——问题主要涉及常识（wooow厉害了）、误区（我不行的话我得找行的人学习啊）、IP方向专区（高客单和商务合作）三大方向；问题需要考虑用户关注度高的；答案需要带有IP本身调性并体现专业性~\n\n给一个参考案例——魔筷家的视频号百问百答\n\n####
    4、十年故事\n\n目前大部分想做IP的人一开始就把自己的十年故事做成短视频置顶了，这也没问题，但是有一些需要注意的点我总结了一下：\n\n素材方面，需要前后对比表现成长，重点是新手村到大佬村的对比；关键时刻重点标注
    低谷、荣耀、转折；\n\n故事方面，一般一个十年故事要5-8分钟，这种中视频长度需要有一个非常重要的信息作为主线，用主线支撑可视度用支线贡献立体度；\n\n文案方面，表达清晰，便于用户接收想要传递的信息；目的明确，增加信任，毕竟信任是IP的货币；契机合理，为什么要发布这个十年故事；\n\n音乐方面，不要搞那种沉重的，体现个人品味即可。\n\n####
    5、点线面打通路径\n\n如何打通点线面路径呢？在垂直IP小航海了有个典型的例子，因为没有思考好后面的路径所以在前面的产品细节上打转了就。（好吧对话上我有些凶）\n\n![](img/6576ae3d98a7111957f10f09ad0d0b54.png)\n\n设计点线面打通的重要性就体现出来了，在电商方向上，大家都知道人货场这个概念，到了内容型IP上其实就是品项态（产品项目生态），这里也不适合用我司签约IP和星云计划里的IP做示例了，那就聊点实在的，用我自己举例吧，虽然我不做我自己的IP。\n\n怎么做产品呢？\n\n产品可以是一篇文章一份课程一个账号一个3折页甚至一个二维码等\n\n假设我的第一篇龙珠是一个本身就奔着龙珠去的产品，那这个产品给我带来了一些对做全域IP感兴趣和对做内容经纪人感兴趣的朋友，其中也包括不拿薪资愿意跟着干的忠实粉丝以及是头部MCN操盘手的徒弟们等~\n\n那我怎么做项目呢？\n\n是不是可以再做一个内容经纪人培训项目养一大批和我差不多的人呢？可以的，那就把这个项目交给愿意参与的小伙伴一起做好了，分钱嘛对不对，而且还要舍得分钱；\n\n那怎么做产业链呢？\n\n我有一大批经过层层筛选的内容经纪人、还有一大批经过层层筛选的S级IP（80个报名星云计划的但没入选的那些至少也是A级以上的），还有我多年积累下的各种头腰部资源，组成一个S级为基因的产业群组是不是也可以呢？可以的，理论端、执行端、变现端、IP端、政府支持、人才端都OK了之后我做什么不行呢？\n\n再比如数字资产的运作，这就是我司和北京市版权局的战略合作的范畴内的东西了，可以做的产品是一个版权证券化的基础课程，项目是一个针对于数字认证的代认证项目，产业链是做一个商学院或私董会，和商学院的强资源人物们一起做项目和盘子，后续的很多东西都玩得6\n\n##
    三、千万营收模型\n\n![](img/5f6e93a619dba33e7269c286b0fde2f4.png)\n\n图里主要涉及到内容型IP可以变现的几乎所有方式，以及一年之内可能会变现的大概数额，以及这些数额的公式模型等\n\n年度会员的年入百万像素级拆解可参考https://mp.weixin.qq.com/s/NsyeFNXoxFDSM9gbWsUTVg，核心点在于提供标品趋近0交付。\n\n私教常规是3w3个月的一对一或者10-15人小班，当然不同垂直细分不同IP底蕴费用不定时间不定，3个月的时间可以分为第一个月进行主题性课程输出，一周两次一个月8节课就差不多了；第二个月有针对性的留作业，第三个月给每个人出具一个系统性发展报告即可。\n\n私董会分为线下和线上两种，线下的是舶来品，是由CEO定期圆桌讨论演变而来，是继EMBA、富豪俱乐部之后的第三种企业经营者沟通交流平台线上的是群响、恒星、生财、海参等互联网社群私董会，核心就是花个5-20w买个圈子的门票\n\n合伙人和徒弟的玩法很像，核心就是买一赠一送一赚一分一，20w起100w属于常规线\n\n图书在常规出版的情况下卖5w册才有二三十万的版税收入，但是能卖1w册已经属于畅销书了，这意味着卖1w册已经挺难的了，那这四五万能不能拿到就是个概率问题，那是不是有一些额外的玩法可以在图书方向赚到钱呢？\n\n可以，走一书一码和联合出品人计划，在一书一码技术的支持下招募1000个人作为联合出品人，这个玩法和联盟促销的核心不同点在联合出品人出的费用要高于图书的价格，当然，责权利肯定也是不一样的。\n\n![](img/441481ea7dde2bb152d87b4242ca574f.png)\n\n课程和直播一起搭配会更有效果，说个现实数据，199小课，一天两播，一场6w，一个月400w~有点意思是吧，如果想走这个路线，可以直接低成本做直播课然后剪成小课，再配合直播在短视频内容部分做切条，1+1+1是绝对＞3的。\n\n注意一个底层逻辑就是4近，离钱近好变现，离痛点近好卖出，离易用近好留存，离信任近好复购（这个复购就可以结合私域做升单了）。\n\n自媒体账号的话，这里不提相关技术手段哈，比如投流啊数据复盘啊等等，起号必须要走爆款路线，爆款从哪来？把这个行业和其他三个不相关行业的近三年的爆款选题都拉出来，你的爆款库就有了；\n\n内容主要从五个方向来配比，专门拍摄的系统专业内容、演讲培训课程直播切条、采访对谈、背景介绍、时事热点辣评，具体哪个方向占比较大看IP本身表现力和市场需求度，不看内容好不好（当然，有风骨的人不缺好内容）；\n\n内容型IP的短视频账号是为直播和私域转化服务的，不要纠结是否能挣多少广告费和是否被一些人抄了，意义不大。\n\n咨询的话既然做IP了就要在1k+/h，敢要价也是对自己的服务有信心的表现，如果300的话不如让咨询人去学课程，每个产品都有对应的使命，咨询是为了解决问题的嘛？不是的，是给调整方向的，但这个方向的调整是要调用之前多年的沉淀的。\n\n培训的话，可以一天多少钱比如1天3万不能超过6个小时；一个小时多少钱比如1小时1w，2小时起；也可以3天2页打包10w；也可以签年框（不过我接触的这种比较少不推荐）。\n\n顾问可以分为轻顾问和重顾问，轻顾问只有方案和资源对接，重顾问包括方案+一定次数陪跑+资源对接+人员培训；建议前者3w起，后者20w/年起。（顺嘴说一句，我的是咨询5k、轻顾问10w，重顾问100w，不免费提供建议）\n\n所以其实到目前为止知道设计一条点线面打通的路径也知道每个路径的节点上大概能收多少钱，IP接下来就可以做一个一年营收千万起的规划了。\n\n##
    四、一年节点规划\n\n做这个规划需要综合考虑三条线，变现、内容、产品。\n\n变现主要是结合千万营收模型那里，每个产品都有自己的单位时间roi，比如行业影响力小但是专业度非常可的话，不建议做私董会而要做私教；专业度比较差但是资源整合能力很强，建议优先做年度会员；是从底层一点点打拼出来的，建议多做咨询顾问；等等\n\n内容主要是要在内容体系规划部分精益求精，如果暂时没办法找到自己的内容体系，可以退而求其次，先把库搭建好，能力不好的话苦功夫还是要下的，比如爆款库、十万加库、标题库、视频模型库、理论库、案例库等等；\n\n产品主要是要先做，如果是一人模式可以先从一个直播课做起，如果是团队模式建议做好一个矩阵，如果是钞能力模式，也不建议找代运营机构，直接找经纪人，比如我（不是抖机灵）。\n\n考虑完三条线之后建议把所有能变现的产品都列一遍，然后假设自己一切条件都OK，再看这些产品的优先级排序，排序原则以能够选对“生产资料”为唯一核心，这里的生产资料指的是能够有滚雪球效应的内容，用故事推进故事，用图片吸引图片，用如何拍视频堆积视频体量等等\n\n这个图价值2000w啊哈哈哈，整个图要配合着每个部分的细案来看的，这是在每个部分的方案做完了之后才能做得东西。我花了3天时间才做出来，主要是每一个阶段都牵扯着其他三个阶段、每个营收点都必须在百万以上不然都不值得写在上面、每条文案都牵扯了至少三个团队等等，真是让人脱发。\n\n![](img/6a958def8ec694fe40b1b5876ae0c2f3.png)\n\n如果朋友们需要借助这个图做自己的IP一年规划的话，还是需要把关键词部分进行调整（就是IP上市啊高客单啊私域那些东西），毕竟IP之所以为IP，规划还是要配合着本人特色的。\n\n这是我司签约的IP里比较典型的一个IP，从图书知识付费自媒体版权私域再到数字资产都有了，如果觉得自身的阶段和能力还没到一年时间能全都做了的地步，可以选择两三个方向一起规划，千万不要只规划一个，这样脆弱性高，有很大赌的成分，当然了，如果自身资源足够的话也不是不可以。\n\n综上，一步步走下来可能会有一个开天眼的感觉，这样挺好的，希望大家都能清清醒醒的做IP，前路光明的做IP~（落地这一趴就不聊了，涉及到太多人员和成本的问题，具体情况具体分析吧大家）"'
- role: tool
  tool_call_id: call_88c7c11a90f14a3e925c7628
  content: '"# 增长女黑客阿may：无资源无资本，如何结合私域裂变和个人品牌，搞定冷启动流量难题\n\n> 来源：[https://uuy7p3hra0.feishu.cn/docx/VAA8dQLTZolMlJx1jxrcKaPrnzd](https://uuy7p3hra0.feishu.cn/docx/VAA8dQLTZolMlJx1jxrcKaPrnzd)\n\n大家好，我叫阿may\n\n![](img/a87799bfacf07faffc18fd8958d55e38.png)\n\n现任智能洗车领跑者车海洋CGO、私域裂变工具伙伴猫CEO，常驻广州，90年出生于广东湛江，毕业于华南师范大学（物理学），从事互联网营销10年，创业5年\n\n![](img/33c1dd432bd2aa221c592a9308804a4b.png)\n\n我是生财四年的圈友，写了11篇精华稿，靠9颗龙珠变现了10万元，当我要了解一个新项目或者要学习一些新的营销玩法时，我常常会用生财有术的精华帖搜索相关内容，总是很快就能找到答案\n\n![](img/a9bba2a2880302dfacb69ff0bfbd0cbb.png)\n\n因此，我真的非常感谢亦仁，也非常感谢生财有术，也累计安利了将近200位好友加入生财有术\n\n我研究互联网营销已有10年，经历过贴吧、seo等搜索营销时代，也亲自操盘过了公众号营销、朋友圈营销、社群营销的微信营销时代，现在更是亲自下场做抖音等短视频营销玩法，基于我个人前后操盘6个项目、陪跑12个企业、辅导培训上万个学员的经历，给大家分享一些我关于品牌起盘阶段的流量玩法思考\n\n今天我的分享主题是：如何结合私域裂变和个人品牌，搞定流量难题\n\n主要是从以下三个部分展开分享：\n\n一、重新理解微信好友\n\n二、无资源无资本，如何从0开始积攒第一批客户\n\n三、如何通过撬动10个铁杆粉丝获取1000个客户\n\n![](img/53aceb72114f4f0808cacb422181209f.png)\n\n#
    一、重新理解微信好友\n\n如果要1年赚100万，如何做得到？\n\n有人说找到1万个客户，买100元的产品\n\n有人说找到100个客户，每个产生1万利润\n\n有人说成交1000个客户，买他们100元的产品，再成交他们10次\n\n有人说做梦吧……\n\n你有想过这个问题吗？你有想过其实，自己真的有机会年入百万吗？\n\n你有想过这个问题吗？你有想过其实，自己真的有机会年入百万吗？\n\n其实，年入百万，很难，但也不是不能实现的。但是起码你要先有这样的目标，有了目标后，再去找实现的方法，也许就能实现了呢。\n\n计算销售额有条公式：销售额=客户数×客单价×购买频次\n\n按照第一个方案来，你得找到1万个客户，如果你的成交转化率是30%（已经很高了吧？），那起码你得获取到3.34万新客户，那相当于每天获取到91个新客户，你就有机会实现营收百万。\n\n按照第二个方案，你得找到100个客户，那就相当于4天成交一个客户，你就有机会实现。\n\n……\n\n按照这样计算下来，是不是觉得，天呐，我太缺流量了，赶紧去搞流量去！\n\n实际上，以往的我们，都太过关注客户数这个指标了，而大大忽略了客单价和购买频次，根据销售额公式可以看到，购买频次和客户数、客单价一样重要！\n\n你知道吗？企业营收也有28原则，20%的客户给你带来80%的利润，复购比拉新更重要！\n\n找到1万个客户多难呀，你得不断拉新培育成交，但是找到100个客户就容易得多了。只要搞定100个愿意在10个月里每个月给你支付1000元的客户，你的年入百万就实现了！\n\n分享大家2组数据，第一组数据，在418推广生财有术时，我公司共有微信好友4万人，我的微信好友有3万人，基本都是私域增长从业者相关，但是我的微信可以转化80人，我公司的资源却只能转化20人，数量上我公司的资源其实更多，但是成交上我的好友却是公司资源的4倍！\n\n第二组数据，我有一个朋友，他只有800个微信好友，每个月却能成交超过20万元，另外还有一个朋友，微信好友有3万人，但是每个月仅能成交5万元，在好友数量是前者将近40倍的情况下，成交额却不足别人的四分之一！\n\n这两组数据，不知道大家看到了什么？\n\n这也是我今年来最大的转变之一，有信任度、有粘性的好友，远胜过泛泛之交。\n\n所以，我今年开始关注线下活动，关注线下的关系建立，今年我来到广州，只做了4场增长饭局，深入沟通了接近50人，就已经创造出了30万的业绩！\n\n而且因为对用户的深入沟通和了解，我们还搭建出了更多合作方式，从以往客单价几千块，到了现在客单价10万。\n\n我之前在操盘群勾搭项目的时候，就踩过一个大坑，那就是只设置引流产品的价格，后面没有高客单价产品来做承接。实际上，只要你成交一个客户，他就有机会给你复购。所以如果你只有一个sku，相当于你把复购的机会直接砍掉了。\n\n所以，一定一定要设计一个高客单价产品，这样可以大幅度增加你的利润。而且有个高客单价产品在那里，就相当于是你的站台产品，一下子拉高你的品牌力。\n\n重新去梳理下自己的产品结构吧，看看是否可以设置客单价更高的产品？是否可以增加客户复购的产品？\n\n然后，沉下心来，去深度了解你的用户，而不是天天只想着批量成交！\n\n私域的本质，是长远而忠诚的客户关系！\n\n什么样的关系才能长远而忠诚？\n\n不是只有用户了解你，而是我们彼此了解！\n\n把用户当朋友，关系才能更紧密！\n\n我的增长饭局，为何现场满意度那么高？\n\n就是因为我抱着纯利他的心态，给每一个来到现场的朋友，想办法解决他们的流量难题\n\n更有不少朋友，因为看了我们增长饭局的流程，也引发了自己做饭局的想法\n\n相互彼此互为客户，更能长久\n\n有了上面关于私域好友的认知，你就会发现，实际上，我们真的没有那么缺流量，我们缺的是深度沟通、精准的客户而已。\n\n![](img/d0d6b1c98742abc716d43e50f9988f73.png)\n\n#
    二、无资源无资本，如何从0开始积攒第一批客户\n\n那么，在我们无资源、无资本的情况下，如何从0开始积攒到我们第一批客户呢？\n\n前几天我重看小马宋老师的书《朋友圈的尖子生》，里面有一个篇章是讲李倩老师的。\n\n小马宋老师在跟李倩采访的时候，李倩老师是在青山资本做天使投资，小马宋就很疑惑，现在李倩既然在做天使投资，为什么又开始强化自己在营销上的认知，强化自己在品牌营销上的个人标签呢？\n\n李倩老师是这么说的：\n\n这是一个个人品牌差异化的打造方法。因为她属于投资圈里的后进生，那怎么才能成为这个圈子里的尖子生呢？她就观察到，这个行业里面，投资人最重要的资产其实是流量。\n\n因为投资人手里都有钱，但是好的项目很少，那么当你遇到一个真正好的项目，为什么别人要选你呢？那肯定是由于你有其他的优势。\n\n而李倩老师认为投资圈最大的区别就是流量的差别，也就是说当一个创业者在选择投资人的时候，他会看中你到底在哪方面给到他实质的帮助。\n\n所以她就要强化她在品牌营销上的标签，这样一来，她就是营销圈里最懂投资的，是投资圈里最懂品牌营销的，这就是一种差异化的身份。\n\n这种差异化的身份可以帮助到她获得流量。而且这种获得流量的方式其实是几何倍数的速度。\n\n而她相比于其他投资人，能给创业者带来的差异化的服务，就是可以在中国提供最好最顶级，最详细最妥帖的品牌服务，这样一来就给了创业者一个理由，选他们。\n\n你看拥有个人品牌是不是就拥有了流量？的确如此，我在做增长女黑客之前，我的微信好友只有区区200多人，想要去找工作，恐怕还要去招聘平台投简历，但是当我做了增长女黑客这个个人标签之后，就有很多牛人大咖开始找到我，给我介绍各种项目、资源。\n\n一方面个人品牌给我带来了流量，另一方面个人品牌也帮我在与人交往的过程中，快速建立了信任。\n\n我认为，垂直行业的专家也将会是普通人，做个人品牌最好的切入口！也是我们普通人起盘最好的切入口！\n\n那么，当你找好了你的个人定位之后，怎么才能积累到你的第一拨客户呢？\n\n最近就有个生财的朋友找到我，提到了一个问题，就是他现在是有稳定的内容输出
    ，但是没有破圈，都是朋友支持，所以想要开一个付费的知识星球，但是不知道如何给知识星球创建粉丝？\n\n咱们群里不知道是否也有遇到此类问题的朋友？\n\n当你有内容时，如果一直只是在自己的朋友圈发布，没有向外界拓展，而你的内容又还没有到达朋友看到后想要帮你分享转发的情况时，要想拓展新用户，真的很难。\n\n不仅仅是做内容的朋友，做产品或者其他服务的朋友也是如此，如果你仅仅是在你的圈子里发布你在做这样那样的服务或者产品，是不是很难获取新客户？\n\n这种情况，怎么办呢？\n\n这其实就是冷启动的问题了。\n\n没有流量，那就去借流量。\n\n可以去哪里借？我认为非常有效的是以下三个地方\n\n##
    1、去公域平台\n\n例如把内容发布到视频号、公众号、知乎、小红书、抖音、快手、B站等自带流量的平台上，还有一些行业的网站、自媒体平台等等，这些平台自带流量，只要你的内容足够好，就会吸引到目标用户关注你。\n\n你还可以把内容换成多种形式去表达，从图文形式到音频、视频、图片不等，可以换不同的花样去发布。\n\n我有些文章，发布到自己的公众号，只有一两千的阅读，但是发布到人人都是产品经理的网站上，却有几万的阅读，而我在那里发布内容，其实很简单，就是把我公众号的内容，复制过去，稍微修改一下即可。\n\n好的内容，平台是非常欢迎的。\n\n所以，如果我们没有资源没有资本，学会做内容营销，学会写作、拍摄短视频，就是我们能够拿到流量的基本功。\n\n在这里我给大家推荐一个非常好用的内容营销方式，就是知识营销。以前你可能去打广告，就是去推硬广，但是现在呢，比较流行的是什么？去推广你这个产品的知识，通过知识吸引到你的精准客户。\n\n尤其是那些需要长时间去做决策才能下单购买的产品，比如说车啊，房啊，还有家具啊，或者说高价的产品啊。你最好的营销方式是什么？就是影响他，培育他，让他在决策过程当中接触到你的专业度，当他信任你了，订单就自然来了。
    另外呢，对于短时间决策产品，也会有一些产品比较适合用知识营销这种方式。比如说日化产品啊，食品啊，服装啊，美妆啊，也经常用知识产品去做转化的。\n\n传统销售是主动销售，就是发硬广，直接就是业务介绍，这种情况一般会被大家厌恶，而知识营销是被动引流，他们会把自己的营销内容化，变成“分享”、变成“硬核干货”，
    就连他们的自我介绍都不放过，都要变成吸引的钩子。只要内容是真的有价值的， 是名副其实的，我们都是欢迎的，喜爱的。\n\n我有写过一系列关于如何做知识营销的内容，大家有时间的话，可以前往看看：\n\n阿may：这套获客方法厉害了！客户源源不断疯狂找上门来！（1）https://mp.weixin.qq.com/s/HO4-bpMD5rRvLwTrofzaZg\n\n阿may：如何把别人的客户变成自己的客户？这4步精准引流法，超有效！（2）https://mp.weixin.qq.com/s/5RosiRRC9KjuE5YYF61EGw\n\n阿may：如何快速出一系列的获客问答文章？我有绝招！（3）https://mp.weixin.qq.com/s/1TppSAHVv9Z0XybfOGLQ1g\n\n阿may：我身边的畅销课大牛，都在用的一套做课方法！（4）https://mp.weixin.qq.com/s/2zFrIHIb5D2N4TZa20nXEQ\n\n这个系列内容还在更新中，后续有机会再跟大家分享。\n\n但是，做内容营销，其实很考验人的能力，所以如果你没有那么热爱做内容，其实做内容营销这条路对你来说，会很难。\n\n那么，还有没有其他办法？\n\n有！\n\n##
    2、去当群红\n\n我认为，普通人做个人IP最好的起盘方式，不是去做抖音、小红书、知乎、公众号等，而是扎扎实实地做好社群的群红\n\n为什么这么说？\n\n因为抖音这种公域平台，是算法机制，是筛选机制，通过这种机制，平台只会筛选出最聪明最勤奋的创作者出来，为平台奉献好的内容~\n\n如果我们只是去做公域，说实话，我们面临的竞争是无限竞争，有太多人跟你竞争了，你太难走出一片天，除非你非常敏锐，找到了市场空白点，别人没有做，或者你的竞争对手没有涉及，你才会抢得先机，、获得一段时间的增长红利，没错！是一段时间！\n\n因为做好公域平台的人，都太会调研了，太会研究数据了，一旦你测试这种内容模式成功，就有一大批人去复制你的内容模式，去研究怎么变成自己的\n\n所以你只能获得一段时间的增长红利，如果你没有好的创新，或者在之前的这段时间红利里你没有积累下用户信任、规模优势，那么你就很容易被别人赶超，淹没在人海当中……\n\n这种案例我们见得太多了，有多少人在抖音上爆红过，但是大浪淘沙，又有多少人能够长红？\n\n更不用说，作为普通人的我们，没资源、没资本、能力一般、才艺一般……我们凭什么能够在众多的创作者中走出自己的优势？\n\n而做好社群的群红不一样，社群的群红是有限竞争！\n\n如果你在的是一个线下社群场域，通常你面对的社群成员只有十几个、几十个，最多也就几百个、几千个，你完全有机会在这几十个人中展示你的特点和标签，让大家记住你。\n\n所以，不要一开始就把自己定位要去做“网红”，而是想办法让自己变成“群红”！\n\n在一个几百人的社群里做出名气，让大家认识你，让大家信任你，你就很容易在这几百人中获得铁杆粉丝，转而跟你合作、购买你的产品……\n\n其实我自己的个人品牌起盘模式就是如此，我就是先把自己的经典案例做出来，然后去复盘我的案例，加入了很多付费社群，想办法在社群里做出奉献，把我的案例分享给大家，让大家通过案例来认识我，就是这样，我得到了生财有术、混沌等社群的推荐，从而获得了很多来自于这些社群的成员认可和信任\n\n也是因为如此，我也非常感恩于这些社群的组织者，也经常跟大家推荐这些社群……很多事情，都是相互的\n\n我身边很多人，也都是通过这种方式把自己的个人名牌做出知名度的\n\n这种模式，很好复制，比去做抖音，要容易复制多了\n\n所以，我才说，普通人做个人IP最好的起盘方式，不是去做抖音、小红书、知乎、公众号等，而是扎扎实实地做好社群的群红！\n\n那么，怎么才能找到我们目标客户所在的社群呢？我之前还写过一篇文章，讲过如何寻找目标客户所在的社群的，大家可以看看：https://mp.weixin.qq.com/s/YqUc8g83Jx4hUa_AdBm_Tg\n\n但是有很多人虽然知道方法，却总是不知道怎么执行。\n\n这里面最大的问题，其实出在自己根本不知道目标客户是谁\n\n例如像我提问的这个朋友，我问他，你的目标客户是谁，他说他的目标人群有两类
    一类是艺术爱好者 潜在的购买客户 一类是艺术创作者\n\n这种就是明显分不清楚自己目标客户是谁\n\n为什么这么说呢？\n\n因为艺术爱好者和艺术创作者，这两个分类都太泛了\n\n你通过这两个关键词，是根本找不到社群的\n\n没有人这么命名社群！\n\n那么可以如何细分呢？\n\n例如，把艺术细分下来，例如分为绘画、音乐、摄影等等，哪怕分到绘画、音乐这一层，还是不够的，还可以继续细分，例如绘画可以分为素描、油画等等，音乐可以分为钢琴、吉他等等\n\n当细分到素描、吉他这一层时，你就会发现，再去寻找这样的社群，就容易多了！\n\n明确目标人群，是做销售、做推广的前提！\n\n分析自己的目标客户是谁，值得我们花时间去细细研究的\n\n说到这里，有人跟我说了，阿may，我也加了很多社群，但是我并没有获取很多流量，怎么办？\n\n那就说到第三种方法了！\n\n##
    3、去抱大腿\n\n我的投资人是《裂变式创业》的作者宗毅，他一直说“人生不要只靠自己傻傻奋斗，一定要有老师，一定要有贵人，否则没有任何机会成功，这句话送给所有奋斗中的同学们“\n\n是的，我们虽然平凡，但是我们如果能够与牛人为伍，得高人指路，获贵人相助，那么我们也可以成为不平凡的一员！\n\n那么如何抱大腿呢？\n\n在这个方面，秋叶大叔是我学习的榜样，我是从2015年关注秋叶大叔的，我发现，秋叶大叔的主动抱大腿的意识是非常强的。\n\n他也曾在多个场合公开说过，他要是发现比他强或者和他互补的资源，他就想着赶紧勾搭一下，看看能不能一起整合推广搞事情。\n\n例如最近我看了他在16年的一篇文章分享，他就提到两个人：\n\n一个是阿文，他当初发现了阿文做PPT的能力很强，大叔自己也是做PPT的，按道理来说，两人是竞品了都，但是大叔的第一反应是赶紧勾搭，所以就找到了阿文跟他合作，一起做ppt课程，后面变成了他的事业合伙人。\n\n一个是阿何，他看到阿何运营职场充电宝，公众号涨粉飞速，所以他就赶紧去勾搭，跟阿何链接（阿何老师就是影响我做个人品牌的老师）\n\n到现在，秋叶大叔抱过的大腿很多，不仅仅是这些比他强的人，还有名人，有资源的企业等等，例如百度文库、百度云、新浪微博、新浪微盘、微软Office、金山WPS、锐普PPT、PPT美化大师、网易云课堂、网易有道笔记、腾讯、微信、罗辑思维等等，都曾经被秋叶大叔抱过大腿……\n\n那我们应该抱到什么样的大腿呢？我认为有两个层面：\n\n1、要抱行业的大腿
    （站对风口）\n\n2、要抱行业里有影响力的人的大腿（找准贵人）\n\n那么，怎么才能抱到大腿呢？\n\n抱大腿不能靠钱去换，因为大腿不缺钱，像宗大，要说用钱去跟他勾搭，还真的是不行，宗大身家都不知道是我的多少倍，我就算拿出我的全副身家，也不足他的百分之一。\n\n那么，靠什么去交换呢？\n\n你要去创造资源、创造价值！\n\n对于普通人的我们来说，练好一身本领，就是最好的方式！\n\n正所谓“你不牛逼，认识在再多牛逼的人也与你无关”，抱大腿一定要提供可交换的价值，想想自己有没有可交换的个人核心能力或者资源？\n\n像宗大之所以愿意投资我，就是看中了我在私域营销的特长，加上人品等各方面，他觉得靠谱有潜能，才会愿意投资我，甚至帮我各方面去背书的。\n\n我做10年互联网营销，这几年一直在研究用户增长，深钻一处，就是为了可以把自己的本领练得更好，如果没有这一身本领作为护身符，我是没有办法吸引到“大腿“，也很难跟“大腿们”搭上关系的。\n\n只要你有价值，“大腿”也会自然主动来结识你的。\n\n关于如何抱大腿的细节故事，我之前写过一篇文章，大家有兴趣可以看下：\n\n如何让大咖乐意结交你？分享两个与牛人链接的故事：小马宋和罗振宇，我和宗毅\n\nhttps://mp.weixin.qq.com/s/jN6sHcBDu4PjY0Q4-krzOg\n\n做好以上这三点，我认为，就算你一开始是0资源起盘，也能积累到第一批客户了！\n\n有了第一批客户后，如何做得更大呢？这就是我们接下来要思考的问题。\n\n![](img/d1b90f2574ba8bd7b95573e642b2da05.png)\n\n#
    三、如何通过撬动10个铁杆粉丝获取1000个客户\n\n我常常用的方式，是裂变。传统流量红利已尽，获客成本不断上升的今天，裂变确实是最低成本获客的方法之一了。\n\n如果你还在怀疑裂变的威力，给你看下这张图，你就懂了：\n\n![](img/6f3079b4528c7c71e7100f20caff8492.png)\n\n真的做好裂变，威力无穷！\n\n那么怎么做呢？\n\n我之前有开发了一整套的裂变课程，裂变是一整套的方案，很难一下子全部告诉大家。\n\n这里我简单讲一下裂变的大框架内容，让大家掌握底层框架：\n\n在我看来，裂变分为两种模型：\n\n![](img/2d4ad0d6c0b0fc84889df50186dc513c.png)\n\n第一种是团队裂变，这是一种自上而下的裂变模型，用一个很牛的段子，大家就可以快速了解到这种模型的魅力了：\n\n一个军团是怎么快速搭起来的？\n\n毛主席找来林彪，
    说： 给你个司令当当\n\n林彪问：军队在哪里？\n\n主席微微一笑，说： 去找三个军长来。\n\n林彪心领神会， 向主席敬礼大声说： 保证完成任务！ 林彪回去找到三位军长，
    说： 给你们一个军长干干，\n\n三人同问： 军队在哪里?\n\n林彪说： 去找三个师长来！\n\n三人相视一笑， 三双大手有力的握在一起， 然后向林彪敬礼说：
    保证完成任务！\n\n3 位军长回去， 各自又找到三个师长， 说： 给你们一个师长干干\n\n九人同问： 部队在哪里？\n\n军长说： 去找三个旅长来！\n\n师长们齐敬礼说：
    保证完成任务！\n\n9 位师长回去又各自找到三个旅长！\n\n27 位旅长又各自去找到三个团长！\n\n81 位团长们回去又各自找到三个营长，\n\n243
    位营长回去又各自找到三个连长，\n\n729 位连长回去又各自找到三个排长，\n\n2187 位排长回去又各自找到三个班长，\n\n6561 位班长回去又各自找到三个兵……，\n\n很快一个
    68890 人的集团军就顺利组建完成了！\n\n看完这个，不知道你会不会会心一笑？这就是团队裂变的模型，这个模型，是有明确清晰的上下级推荐关系的，常见的微商团队、经销商网络、社交电商等玩法，就是靠这种模型搭建起来的\n\n![](img/5be74c89eb3f153489bb9252520e029f.png)\n\n这种模型吸引人们参与的核心关键点，就是诱饵足够大：躺赚逻辑！\n\n只要你做得足够早，你后期就有可能享受躺赚，一个人真的可能带着千军万马！我身边有个朋友，做社群团购，就是因为加入一个社群团购平台足够早，她也给力，很会拉人，现在1个人，月收入100万！没错，是月收入100万，纯利润！！！比市面上大部分100人以上的公司利润还要高！这样的故事说出去，就足够吸引很多人来参与\n\n![](img/d730fbc235d74fc6dde3ab2bdbdb04a7.png)\n\n因此，只要设计好机制，保障终端能卖得出去货，靠这种模型，的确可以快速裂变。\n\n![](img/8badd2ef5f907a3aeeaa35834af7b7cc.png)\n\n第二种是用户裂变，这是一种自下而上的裂变模型\n\n用户与用户之间是社交网络的状态，ABCD之间有可能相互认识的，彼此关系是网状结构，不是树状结构\n\n![](img/e8a97c6214021fbcca2496772b8e2378.png)\n\n用户裂变讲究的就是圈层效应，所以一般都是针对不同人群去设计不同的裂变玩法\n\n![](img/a931f97a414828749f80b30f13c6dfc7.png)\n\n我研究用户裂变已有5年多，在我看来，用户裂变有两种形式：\n\n![](img/a5b37945dca7f7ce7faeb95a05629ea0.png)\n\n口碑传播，就是用户没有基于任何利益诱惑的前提下，就愿意帮你分享和传播！\n\n那么，怎么才能让用户帮忙做口碑传播呢？推荐大家看一下一本书——《疯传》，里面提到的六大原则，我觉得总结得非常好：\n\n![](img/455aa58687abc316d9f3031cfaa7d2ad.png)\n\n书籍因为翻译不太好，有些晦涩难读，樊登有解读过这本书，我还曾经带领过我们的社群伙伴，一起共读过这本书，大家有需要可以扫码看下（密码是666666）\n\n![](img/1835c6ca5b85016510348a94874d792a.png)\n\n除了口碑传播之外，我们还可以用到的一种裂变形式，那就是举办裂变营销活动，通过利益诱饵的方式，促进我们的员工/渠道/老顾客帮我们分享。\n\n例如，在做活动的时候，我们可以去设置这样的一个环节：加微信的用户，我会设置一个他会感兴趣的福利，如果他愿意分享到朋友圈的话，我就会免费把这个福利送给他，但我不会强迫他帮我分享。\n\n当然，这里的福利一定是对用户有价值的东西，他才会愿意分享，否则就算你做了分享的引导，也是无效的。\n\n比如说我们现在给大家分享的这个时间捐赠社群，如果亦仁开放给大家，支持大家分享给朋友的话，我想，肯定很多人愿意去分享，尤其当你觉得我们的分享都很有价值的时候，因为你会觉得这样的社群对你朋友是有帮助的。\n\n一般来说，设计裂变营销活动的话，我们主要是围绕着以下三种裂变机制来开展的：\n\n![](img/ece7e508444fee64bf24e41829133985.png)\n\n针对不同的裂变机制，也有不同的裂变路径，因为我公司就是做裂变工具的，所以我们也开发了不少裂变玩法，我们目前最常用的玩法就是基于企业微信的任务宝裂变玩法（我们称之为好友裂变）、赠礼裂变玩法（我们称之为冲榜裂变），基于服务号的分销裂变玩法和赠礼裂变玩法（我们称之为活动裂变）\n\n估计大家多多少少都有见过这样的裂变营销活动\n\n但是，在做裂变营销活动过程中，最重要的是有多少用户真正去行动帮你去做分享\n\n因为，大部分裂变营销活动策划者策划的活动之所以效果不好，往往最大的原因是在于，只有激发层的用户愿意分享，到了第三层裂变层，就断层了。因此就根本裂变不动！\n\n![](img/2a6ee8742f27acff01744b118b841c83.png)\n\n那么，怎么样才能让更多人产生分享行动，并且有持续的分享行动呢？\n\n我们会在用户裂变的营销活动玩法的基础上，还会叠加一层“团队裂变”的玩法，这种玩法我们称之为“战队PK”的玩法，也就是组织中的动销系统。\n\n怎么做呢？我用一个案例，跟大家说下：\n\n最近刘润老师的跨年演讲刷爆了我的朋友圈，就有朋友提到我们去年做的一场跨境电商峰会，刘润老师为此连发几次推文讲到这个峰会《我演讲到一半，警察来了》：\n\n![](img/55b8ed90461e6f0914d8482ae89d54cf.png)\n\n![](img/8df00b187c33307b8991e294ccd86199.png)\n\n我们是这个峰会的幕后营销服务商，我们在展会开始之前，通过活动裂变+战队PK裂变的方式，我们实现了3天内裂变近6000个用户参加线下活动，加上主办方的助推，最终活动报名人数累积1.8万人，到展会现场的有4000人，由于活动过于火爆，展会进行途中警察赶到现场维护秩序，还有1万人只能在场外听分享；\n\n在展会现场，我们通过精准洞察在场用户需求，我们一小时引流用户5000多人，还使用了冲榜裂变+群裂变的玩法吸引到1000多位新用户进入私域流量池，这个是具体案例的详细复盘拆解文章，大家有时间可以详细看下：\n\n【案例拆解】刘润老师都惊了！3天半如何吸引6000+精准客户参与线下活动（上）\n\nhttps://mp.weixin.qq.com/s/pYh3EJG9ByVHCkS4vVKI3w\n\n我的人生，就是因为掌握了裂变营销这套玩法，发生了翻天覆地的变化，我真心推荐，每一位想要获取流量的朋友，都学一学裂变营销这种获取流量的方式。\n\n总得来说，如果你目前属于起盘阶段，那么你可以通过做个人品牌，然后结合公域内容引流、社群打造个人影响力、抱大腿借势营销这三种方法，获取第一批客户。\n\n如果你属于发展期，那么可以借助裂变营销这种杠杆营销玩法放大你的流量池。\n\n当然，如果有钱的话，投放是一种更有效率的放大器\n\n总得来说，今天我跟大家分享的起盘阶段用到的方案和放大流量的方案，是我亲自实践验证有效的，并且我也带领了不少学员也用这种方案做出结果的，我所说的路径是可复制的，希望对大家有启发。\n\n今晚的分享就到这里，谢谢各位\n\n这个是今天分享的逐字稿：\n\n对了，我常驻广州，在广州成立了一个私域增长圈社群，给生财的朋友送个社群门票，如果你想要加入的话，可以加下我的个人微信2780671395，免费拉你进群\n\n![](img/d399b59be8f851487287fd4a07b8c699.png)\n\n再次谢谢生财的邀请~"'
