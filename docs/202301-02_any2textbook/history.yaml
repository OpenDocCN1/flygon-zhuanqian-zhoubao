    \n      ]\n    },\n    {\n      \"name\": \"群红优于网红定理\",\n      \"desc\": \"对普通人而言，个人IP冷启动应选择社群群红而非平台网红，因为有限竞争（社群）比无限竞争（全平台）更容易起盘。\"\
