    function:
      arguments: '{"paper_name": "IP如何做到风骨体面且年入千万", "paper": "内容型IP从0到年入千万的五大步骤：夯实地基、做好内容体系规划（风骨体面）、做好千万营收模型（千万变现）、做好一年的节点规划、落地。\n\n一、夯实地基\n内部夯实地基：需要完成30个任务与市场接轨。掌握写作底层逻辑（看3本经典写作书）。直播准备（准备15分钟内容循环，人均在线时长大多数到不了8分钟）。\n外部夯实地基：12345，即1个母题、2层基因、3重身份、4级观感、5份资产。\n1个母题：文化传统中具有传承性的文化因子，或人类社会循环往复普遍发生的事情，最简单的理解是原型。掌握母题可以搭建护城河又能随时调整边界。\n2层基因：文化沉淀价值（风骨）和商业持续能力（变现）。不要做没有文化溢价的事情。IP是少数人的领地，每个IP的花期和成长环境不同，不要走别人的路径。不要相信天道酬勤，用不下牌桌的能力来表达更恰当。\n3重身份：工具（解决用户问题）、人（解决价值主张或情绪）、神（解决迭代升级）。\n4级观感：松弛感（尽在掌握）、对象感（只对你说）、获得感（卧槽）、氛围感（沉浸无法自拔）。\n5份资产：用户资产、版权资产、实物资产、文化资产、生态资产。\n\n二、内容体系规划\n内容体系包含5个部分：4级内容架构、一套独有理论、一个十年故事、一份百问百答、一份产品项目产业链打通路径。\n4级内容架构：IP方向→关键词→关键业务板块→关键业务内容（mece原则）。\n独有理论的5种方法：理想解法（TRIZ）、节点法、词根法、母题法、核心法。\n十年故事：素材（前后对比成长，关键节点标注）、故事（5-8分钟中视频）、文案、音乐。\n百问百答：问题从行业爆款选题、高赞、热评、变现出发、用户需求出发。\n点线面打通路径：产品（文章、课程、账号）、项目（培训项目养人）、产业链（S级IP产业群组）。电商人货场→内容型IP品项态。\n\n三、千万营收模型\n变现方式：年度会员、私教（3w
        3个月）、私董会（线上5-20w买圈子）、合伙人徒弟（买一赠一送一赚一分一）、图书（一书一码联合出品人）、课程直播搭配、咨询（1k+/h）、培训（1天3万）、顾问（轻顾问3w起重顾问20w/年）。\n核心逻辑4近：离钱近好变现、离痛点近好卖出、离易用近好留存、离信任近好复购。\n\n四、一年节点规划\n综合考虑三条线：变现、内容、产品。排序原则以能够选对生产资料为唯一核心，生产资料是能够有滚雪球效应的内容。"}'
