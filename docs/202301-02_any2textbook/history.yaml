      arguments: '{"chapter": "# 第1章 项目六要素拆解\n## 1.1 为什么要拆解项目\n体检需要一套标准化的指标，判断一个项目能不能做同样需要标准化诊断框架。\n##
        1.2 项目六要素拆解\n「任何项目拆解为六个核心点，四点为及格线。」\n六要素：流量、销转、交付、客单、毛利、复购\n## 1.3 三项效率指标\n「流量效率：花时间少、素材难度低、流量大；销转效率：专业度要求低、能一对多；交付效率：花时间少、人力少。」\n杠杆效应定理、互补定理",
        "paper": "任何项目都可以拆解成：「流量效率，销转效率，交付效率，客单价，毛利率，复购率」，这六个点。满足的越多越好，满足四个点，及格。\n流量效率：以「时间，素材，流量」为指标。花的时间少，素材难度低，获得流量大，即为流量效率高。\n销转效率：以「专业度」为指标。专业度要求低（能SOP），能一对多，即为销转效率高。\n交付效率：以「时间」为指标。花的时间少（人力少），即为交付效率高。\n如果流量效率，销转效率，交付效率这三块有一块低的话，就很难复制放大，那就得在客单价，毛利率，复购率这三块下功夫。"}'
