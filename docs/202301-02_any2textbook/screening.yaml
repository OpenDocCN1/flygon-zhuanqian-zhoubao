screening_principles: 筛选基于三方面权衡：1）价值密度：优先保留能提炼出稳定判断、方法论框架或完整案例链路的素材，排除仅有索引、链接或泛泛经历的占位内容；2）可用性：对时效性强但模式可迁移的素材，判断其能否改写为常青表达，能则保留、仅背景过时则降级为案例附件；3）唯一性：与更强文本重复度高的素材，仅在其能补充案例或细节时降权保留，否则排除。深度为medium以上且具备体系化或反常识判断的文本优先进入章节，口语化较重或推广性质明显的素材降权待重写。
