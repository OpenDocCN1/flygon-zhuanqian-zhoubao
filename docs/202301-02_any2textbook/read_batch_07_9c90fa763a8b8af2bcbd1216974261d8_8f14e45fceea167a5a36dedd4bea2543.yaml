- file_path: docs/202301-02/VAA8dQLTZolMlJx1jxrcKaPrnzd.md
  title: 增长女黑客阿may：无资源无资本，如何结合私域裂变和个人品牌，搞定冷启动流量难题
  summary: 增长女黑客阿may结合自身操盘经验，系统分享无资源无资本的个人/品牌在起盘阶段如何通过个人品牌打造、公域内容引流、社群群红策略、抱大腿借势获取第一批客户，再通过裂变营销（团队裂变与用户裂变）撬动十倍百倍客户增长的完整方法论。
  core_question: 无资源无资本的普通人/小品牌，如何低成本完成冷启动并实现规模化获客？
  key_judgment: 私域的本质是长远而忠诚的客户关系，有信任度有粘性的好友远胜过泛泛之交；普通人的个人IP起盘最佳切入点是成为垂直行业专家，最佳起盘方式不是做公域网红而是做社群群红（有限竞争）；裂变是发展期放大流量的杠杆，用户裂变需结合团队裂变（战队PK）解决分享断层问题。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 口语化
  - 格式预处理
  - 部分案例时间久远
  screening_conclusion: retain
  reason: 内容系统完整，从认知到实操（产品结构、冷启动三法、裂变两模型）层层递进，视角独特（群红优于网红），有个人案例和数据支撑，具备体系化提炼价值，可沉淀为书籍章节的扎实框架。
- file_path: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
  title: 围观船员视频号带货如何7天10万粉变现5w+
  summary: 一位生财圈友分享了其以围观船员身份参加视频号带货航海，通过差异化定位（做人群而非做商品）、伪原创内容策略（情/趣/用/品四字诀），在7天内实现10万粉、变现5万+的实操过程，并复盘了后续与供应链合作、专注流量的打法。
  core_question: 在视频号带货赛道竞争激烈、搬运遭打击的背景下，个人玩家如何通过差异化定位实现快速起号与变现？
  key_judgment: 避免与头部玩家在热门商品上正面竞争，转而利用伪原创内容做人群（共情/有趣/有用/新奇），可以更大概率跑出爆款；同时要克服'知识的诅咒'（过度思考不执行），并尽早考虑通过合作（如供应链）而非单打独斗来放大收益。
  depth: medium
  suggested_destination: case
  possible_shape: kb
  risks:
  - 时效性
  - 口语化
  - 未提供具体操作SOP
  - 依赖个人运气成分
  screening_conclusion: retain
  reason: 提供了一套'做人群不做商品'的差异化竞争思路，及伪原创的底层分类框架，对视频号创作者有启发性。但个人色彩浓、时效性强，更适合作为案例库/情报库条目而非方法论核心章节。
- file_path: docs/202301-02/XuOgdT9o8ongKPxfSMlcfgLbngf.md
  title: 如何通过抖音卖几百万非遗拓片
  summary: 竹庐拓艺品牌创始人分享了如何通过抖音将非遗拓片产品做到几百万销售额，核心围绕平台定位、产品定位（高客单、送礼/装逼需求）、人群定位（新锐白领、资深中产）、内容与直播间搭建、线上线下结合转化等展开，并介绍了信仰类产品的市场机会。
  core_question: 一个高客单价、小众的文化非遗类产品，如何通过抖音平台实现从线上引流到线下高客单转化的完整商业化路径？
  key_judgment: 产品是未来的压舱石；抖音正从兴趣电商向货架电商转型，高客单是趋势；对于高客单产品，线上只是获客渠道，最终要通过线下场景（展厅、家居卖场）承接流量完成高客单转化；产品设计需满足目标人群的审美、文化与'装逼'需求。
  depth: high
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 类目特殊
  - 缺乏可复制的具体操作步骤
  - 依赖资源优势
  screening_conclusion: retain
  reason: 提供了一个极其完整的'高客单文化产品线上引流+线下转化'的商业模式案例，内容包含平台趋势判断、产品设计逻辑、人群洞察、合作模式拓展等深度思考。虽类目特殊，但其背后的商业逻辑（产品、人群、平台、线上线下协同）对做高客单品牌有重要借鉴意义，适合作为深度案例。
- file_path: docs/202301-02/ZcEdd0xTCo1K5IxwCyLccKUynOb.md
  title: 小说推文进阶玩法，精细化运营所带来的稳定出单
  summary: 一名个人玩家系统分享了小说推文项目（抖音发布知乎付费小说内容引流转佣金）的精细化运营方法论，覆盖选文（作者垂直、专栏垂直）、改文（提取核心冲突前置）、关键词设置、配音剪辑、发布策略（评论区维护、主动引导）、日常维护（养号、复盘）全流程，并总结了稳定出单的实操经验与心态建议。
  core_question: 在小说推文赛道竞争加剧的背景下，个人玩家如何通过精细化运营（而非盲目铺量）提升爆款概率、实现稳定出单？
  key_judgment: 小说推文的核心是选文（抓住作者和专栏源头）与改文（提炼核心冲突和悬念前置，提高5s完播率）；精细化运营（配音顺滑、素材优质新颖、评论区积极维护、每日复盘）是个人玩家对抗规模化竞争、实现稳定出单的关键；项目本质是概率游戏，坚持+不断试错是持续出结果的保障。
  depth: high
  suggested_destination: chapter
  possible_shape: course
  risks:
  - 时效性
  - 平台规则变化快
  - 内容细节多
  screening_conclusion: retain
  reason: 内容极其系统、完整、实操性强，从战略（选文）到战术（改文、剪辑、发布、维护）再到心态管理，都给出了具体可执行的步骤和判断标准，是典型的高价值实操方法论，非常适合作为课程的独立单元或手册的核心章节。
- file_path: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
  title: 追逐风口，AI绘画目前收益5W+
  summary: 一位生财圈友分享了其在2023年初AI绘画风口期，通过搭建小程序（对接AI绘画接口），利用关键词SEO（蹭微信指数和竞品关键词）获取搜索流量，再通过广告和充值积分变现，实现收益5W+的实操记录。
  core_question: 技术革新（AI绘画）带来的商业机会中，不具备大模型研发能力的普通人，可以基于什么模式快速变现？
  key_judgment: 技术革新的窗口期，普通人无法做模型生意，但可以通过'套壳小程序+流量变现'模式切入，核心是赚取接口调用费用与广告收入之间的差价；关键不在于技术，而在于利用关键词SEO精准获取免费流量，风口+时机+简单的流量操作即可快速获得收益。
  depth: low
  suggested_destination: kb_entry
  possible_shape: kb
  risks:
  - 时效性极强
  - 风口已过
  - 操作细节简单
  screening_conclusion: demote
  reason: 提供了一个特定技术窗口期的套利案例，商业模式清晰但深度有限（操作简单、流量靠SEO），且时效性极强，AI绘画接口价格和平台规则已大变，不具备长期参考价值，可降级为知识库中的历史案例/情报参考。
