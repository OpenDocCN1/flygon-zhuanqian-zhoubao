  excerpt:
  - 只有800个微信好友月成交20万 vs 3万好友月成交5万，好友数量40倍但成交不足四分之一。
- name: 用户裂变传播断层观察
  desc: '[claim] 素材宣称用户裂变中分享行为仅停留在激发层，第三层即断层；该描述为经验性归纳，素材未提供具体裂变实验数据。'
  excerpt:
  - 只有激发层用户愿意分享，到第三层裂变层就断层。
