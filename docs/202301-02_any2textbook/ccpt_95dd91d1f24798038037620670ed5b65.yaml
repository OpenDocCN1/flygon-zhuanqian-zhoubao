  desc: '[claim] 素材宣称：100个愿意在10个月内每月支付1000元的客户即可年入百万；此结论为理论推算示例而非实证数据支撑。'
  excerpt:
  - 搞定100个愿意在10个月里每月支付1000元的客户，就能年入百万。
