paper: 千万项目的底层逻辑
desc: 该素材提出项目评估与优化的底层逻辑框架：将任何项目拆解为流量效率、销转效率、交付效率、客单价、毛利率、复购率六个要素，并给出合格线（满足四点及格）。通过多个案例（小说推文、教育资料、减肥食谱、知识付费等）的要素分析，归纳出效率高则项目可复制放大（流量、销售、交付均可SOP化/矩阵化），若某效率低下则须依赖收益端（客单价、毛利率、复购率）弥补的核心主张。
concepts:
- name: 项目六要素拆解
  desc: 任何项目都可拆解为流量效率、销转效率、交付效率、客单价、毛利率、复购率六个核心点，四点为及格线。
  is_original: true
  excerpt:
  - 任何项目都可以拆解成：流量效率，销转效率，交付效率，客单价，毛利率，复购率，这六个点。满足的越多越好，满足四个点，及格。
- name: 流量效率
  desc: 以时间、素材、流量为指标，花的时间少、素材难度低、获得流量大即为流量效率高。
  is_original: false
  excerpt:
  - 流量效率：以时间、素材、流量为指标。花的时间少、素材难度低、获得流量大，即为流量效率高。
- name: 销转效率
  desc: 以专业度为指标，专业度要求低（能SOP）、能一对多，即为销转效率高，本质是销售的时间利用率。
  is_original: false
  excerpt:
  - 销转效率：以专业度为指标。专业度要求低（能SOP）、能一对多，即为销转效率高，本质也是时间、销售的时间利用率。
- name: 交付效率
  desc: 以时间为指标，花的时间少（人力少）即为交付效率高。
  is_original: false
  excerpt:
  - 交付效率：以时间为指标。花的时间少（人力少），即为交付效率高。
methods:
- name: __overview__
  desc: 项目底层逻辑分析法：将任一项目按六要素逐一评估，据此判断其可复制性与优化方向（效率端提升 or 收益端弥补）。
  excerpt:
  - 任何项目都可以拆解成：流量效率，销转效率，交付效率，客单价，毛利率，复购率，这六个点。满足的越多越好，满足四个点，及格。
  - 如果三个效率中有一块低，就难以复制放大，就得在客单价、毛利率、复购率这三块下功夫。
theorems:
- name: 效率高则可复制放大的核心主张
  desc: 流量、销转、交付三效率高意味着项目高度可复制、可矩阵化/培训放大，且赚多赚少取决于流量多少。
  excerpt:
  - 流量效率高意味着内容极其好复制，可以通过矩阵、培训等方式，把这一块单独拎出去进行放大。
  - 销转效率高、交付效率高，意味着销售可以SOP化，不需要极强的专业性，也意味着交付也不需要啥时间精力，同时也意味着流量来了能接得住。
  - 意味着赚多赚少取决于流量的多少。
- name: 效率短板由收益端弥补的定理
  desc: 若三个效率中有短板，则难以复制放大，须通过在客单价、毛利率、复购率上下功夫（如提高客单价）来增加收入。
  excerpt:
  - 如果三个效率中有一块低，就难以复制放大，就得在客单价、毛利率、复购率这三块下功夫，比如通过提高客单价来增加收入。
- name: 底层逻辑决定行动力的主张
  desc: 唯有明白项目底层逻辑，才能有的放矢地行动。
  excerpt:
  - 任何事情只有明白底层逻辑，才能有的放矢。
findings:
- name: 小说推文项目分析
  desc: '[evidence] 案例表明：流量高、销转高、交付高、客单价低、毛利率高、复购率低。'
  excerpt:
  - 案例：小说推文项目（流量高、销转高、交付高、客单价低、毛利率高、复购率低）。
- name: 教育资料与减肥食谱项目
  desc: '[claim] 教育资料1.0/2.0项目与减肥食谱项目同属案例列举，素材未逐一给出各要素量化值，仅作并列实例。'
  excerpt:
  - 教育资料1.0/2.0项目。减肥食谱项目。
- name: 项目拆解商业IP分析
  desc: '[evidence] 案例表明：流量效率低、销转效率高、交付效率低、客单价高、毛利率高、复购率高。'
  excerpt:
  - 项目拆解商业IP（流量效率低、销转效率高、交付效率低、客单价高、毛利率高、复购率高）。
- name: 知识付费项目分析
  desc: '[evidence] 案例表明：流量高、销转高、交付高、客单价高、毛利率高、复购率低。'
  excerpt:
  - 知识付费（流量高、销转高、交付高、客单价高、毛利率高、复购率低）。
