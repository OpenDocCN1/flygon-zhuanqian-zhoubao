- 'no': 1
  name: IP本质论 —— 从“1个母题”到“5份资产”的身份建构
  desc: 本章从文化原型与商业逻辑的交叉视角出发，带你理解什么是真正的“内容型IP”——它不只是流量，而是一套可沉淀、可变现、可迭代的综合系统。
  nodes:
  - 'no': 1
    name: 母题：IP的文化基因
    desc: 用“文化原型”类比：母题是文化传统中代代相传的主题，掌握它等于拿到了内容表达的“源代码”
    role: definition
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 2
    name: 2层基因：风骨与变现的双螺旋
    desc: IP的内在基因由文化沉淀价值（风骨）与商业持续能力（变现）共同构成，缺一不可——“只谈文化不赚钱是自嗨，只谈变现没文化是泡沫”
    role: definition
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 3
    name: 3重身份：从工具到神格
    desc: 用“工具箱→朋友→信仰”递进类比：IP对用户依次承担解决问题、提供情绪、赋予意义的责任
    role: method
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 4
    name: 4级观感：感官体验的阶梯
    desc: 从松弛感到氛围感，四级观感层层递进——用“约会”类比：先要让对方舒服，才能进入深谈
    role: extension
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 5
    name: 5份资产：从身份到不动产
    desc: 用户、版权、实物、文化、生态资产——用“不动产”类比：好IP不是一次性消耗品，而是可累积的资产包
    role: method
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 6
    name: 双基因论：为什么缺一不可？
    desc: 论证“风骨×变现”互为乘数：纯风骨无变现则无法持续，纯变现无风骨则无法溢价——IP是少数人的领地，路径不可复制
    role: proof
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
- 'no': 2
  name: 内容体系规划 —— 从“关键词”到“商业地图”
  desc: 本章教你像建筑师一样搭建内容体系：先有结构（4级架构），再有方法（5种工具），最后用“4近”原则验证商业可行性。
  nodes:
  - 'no': 1
    name: 为什么先规划内容？——从“想到哪写到哪”到“有蓝图施工”
    desc: 用“建筑图纸”类比：没有规划的内容是碎片堆，有规划的内容才是大厦——IP内容需要可叠加、可复用
    role: motivation
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 2
    name: 4级内容架构：从方向到颗粒
    desc: IP方向→关键词→关键业务板块→关键业务内容，层层拆解（MECE原则），确保不遗漏、不重叠——用“城市地图”类比：先有国家→省→市→街道
    role: method
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 3
    name: 独有理论5种方法：形成不可替代的“个人学说”
    desc: TRIZ、节点法、词根法、母题法、核心法——用“配方”类比：可复制且稳定，才是理论而非经验
    role: extension
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 4
    name: 核心逻辑4近：商业化四维过滤网
    desc: 离钱近好变现、离痛点近好卖出、离易用近好留存、离信任近好复购——用“漏斗”类比：每一层都在筛掉“叫好不叫座”的内容
    role: method
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 5
    name: 内容→商业的断点问题：为什么好内容不一定赚钱？
    desc: 即使内容优质，若无“4近”校验，也可能陷入“高口碑低变现”——这是内容型IP最常见的天花板
    role: limitation
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
- 'no': 3
  name: 营收与落地 —— 从“九条变现通道”到“年度路线图”
  desc: 本章拆解从0到千万营收的现实路径：9种变现方式如何组合，5大步骤如何按期落地，最终形成可执行的增长飞轮。
  nodes:
  - 'no': 1
    name: 为什么“变现”是IP的最终试金石？
    desc: 用“考试”类比：内容好坏是“平时作业”，营收能力才是“高考成绩”——千万营收模型是规模化验证
    role: motivation
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 2
    name: IP五大步骤总框架：从0到千万的路径图
    desc: 夯实地基→内容体系规划→千万营收模型→一年节点规划→落地，五步联动——用“盖楼”类比：地基决定楼层高度
    role: method
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 3
    name: 千万营收模型：九种变现方式的组合拳
    desc: 年度会员、私教、私董会、合伙人徒弟、图书、课程直播、咨询、培训、顾问——按“客单价”从低到高排列，形成“漏斗+火箭”结构
    role: method
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 4
    name: 内外部地基夯实法：先把自己“撑住”
    desc: 内部30个任务与市场接轨，外部12345框架——用“树根”类比：根扎得深，树才长得高
    role: method
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 5
    name: 九种变现的边界：什么情况下不应扩张？
    desc: 营收模型需要与自身IP基因和产能匹配——盲目铺全品类会导致“摊子大客场乱”，是IP早期常见的陷阱
    role: limitation
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 6
    name: 案例：从0到千万的模拟推演
    desc: 以“一名文化知识类IP”为例，按五步法逐一推演：地基-架构-营收-节点-落地，展示每一步对应的产出与验证指标
    role: experiment
    src:
    - paper: HiVkdfBYJo2H5xxWIemcMcMQnLc.md
