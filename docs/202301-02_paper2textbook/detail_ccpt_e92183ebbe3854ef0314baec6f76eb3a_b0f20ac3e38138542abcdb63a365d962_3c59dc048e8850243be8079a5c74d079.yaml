units:
- 'no': 1
  name: 风口下的冷思考 —— 先把“三张底牌”亮出来
  points:
  - '**为什么需要这个概念？**'
  - '- AI绘画等新技术刚出现时，遍地是“月入十万”的造富神话，让人容易冲动入场'
  - '- 但如果一开始没想清楚自己在整个链条里扮演什么角色，很容易盲目跟风、迷失方向'
  - '- 需要用一个系统化的前置思考，把“我有什么、我会什么、我能触达谁”搞清楚，再决定动不动手'
  - '**核心定义**'
  - '- 在拥抱AI绘画这类风口前，先分析自己的三个维度的资源禀赋：技术（能不能开发/会不会用）、变现（有没有现成渠道）、流量（有没有粉丝/内容能力）'
  - '- 定位正确，方向才不跑偏；定位错了，再好的风口也是别人的红利'
  - '**关键性质**'
  - '- 三维定位是一个“前置过滤器”：只有三样里至少占一样，这个项目才值得启动'
  - '- 定位不是一次性的，项目每推进一步，都要回头重新检查这三个维度是否依然匹配'
  - '- 技术、变现、流量三者可以互相弥补，但至少要有确定性的起点'
  - '**典型例子**'
  - '- 作者自己复盘AI绘画小程序时，先把“技术/变现/流量”三个词摆出来逐条自问：没有开发能力、没有私域流量，所以选择“照猫画虎”蹭关键词SEO，而不是自研'
  - '**边界条件**'
  - '- 三维定位只适用于“以个人或小团队为主体”的项目启动阶段，不适用于大公司资源型布局'
  - '- 如果三样资源全都没有，则说明该项目当前不适合你，应先回去积累资源，而不是硬上'
  sources:
  - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
    role: origin
  excerpts:
  - 任何技术的革新都会带来新的机会，不过冷静下来，还是要找好自己在这个事情中的定位，定位错了，方向就迷失了。
  - 首先分析自己的定位：技术/变现/流量
- 'no': 2
  name: 收益公式 —— 用一道乘法题看穿生意的底牌
  points:
  - '**为什么需要这个概念？**'
  - '- 一个生意看起来热闹，但要判断它值不值得做，不能凭感觉，得先把“钱从哪里来、差价在哪里”算清楚'
  - '- 把复杂商业模式压缩成一道公式，能一眼看到最关键的增长变量，避免被表象迷惑'
  - '**核心定义**'
  - '- 收益 = 使用人次 ×（CPC广告单价 − 接口调用费用）− 一次性投入，即通过小程序提供AI绘画服务，用户看广告换取使用次数，赚取广告费与接口成本之间的差价'
  - '- 把公式拆开：收入侧是广告收益+可能有的充值积分；成本侧是每次AI绘画的接口调用费+一次性部署投入'
  - '**关键性质**'
  - '- 这是一个极简数学模型：把生意抽象成“差价×量−固定成本”，一眼就能定位哪个变量才是命门'
  - '- 在CPC单价和接口成本相对固定的前提下，公式右侧只剩下“使用人次”这一个自由变量，所以所有运营动作都必须围绕“让更多人用”展开'
  - '- 公式天然具备杠杆性：使用人次越大，利润越是成倍放大，边际成本几乎不增加'
  - '**典型例子**'
  - '- 若看一次30s广告CPC为0.1-0.3元、接口调用费为0.05元，则每多一次使用就赚0.05-0.25元差价；再用充值积分收入摊薄接口成本，净利进一步提高'
  - '**边界条件**'
  - '- 公式只对“广告变现型”工具类小程序成立；若产品依赖直接付费购买，需另建模型'
  - '- 公式忽略了平台政策变动、竞品涌入导致的CPC下跌，属于理想态估算'
  - '- 一次性投入如果摊销周期短于风口存活期，则公式失效，必须考虑回本周期'
  sources:
  - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
    role: origin
  excerpts:
  - 所以这个生意对于我来说，收益 = 使用人次 * （ CPC的广告价格 - 接口调用费用） - 一次性投入 ，其实这里边还有个充值积分的钱，可以平摊到接口调用费用中。
  - 使用人次越多成为唯一变量。
- 'no': 3
  name: 成本与收入的构成拆解 —— 把账本摊开算清楚
  points:
  - '**为什么需要这个概念？**'
  - '- 光知道公式不够，还得知道公式两侧每一项具体装的是什么，否则算出来也是“假账”'
  - '- 拆清成本和收入，才能判断这个差价生意是否真的有肉吃，以及哪里可以再抠出利润'
  - '**核心定义**'
  - '- 收入侧：①小程序/抖音小程序广告的CPC单价（看一次30s广告约0.1-0.3元）；②用户充值积分收入，可进一步平摊接口调用成本'
  - '- 成本侧：①AI绘画接口按次调用费用（按生成次数计费）；②一次性部署成本（选型供应商、开发/购买小程序等）'
  - '**关键性质**'
  - '- 广告CPC是“平台定价”类收入，单价相对刚性，波动空间小——所以不能指望提高单价，只能靠堆量'
  - '- 充值积分是“二次收入”，能把接口固定成本进一步摊薄，是隐藏的利润调节阀'
  - '- 接口调用费是“随量而动的可变成本”，使用人次越多，这块成本也随之线性增加，但被广告收入盖过'
  - '**典型例子**'
  - '- 用户充值一笔积分（如10元），获得一定次数；这些次数消耗的接口成本直接从充值里抵扣，等于多出来的广告费全是净赚'
  - '**边界条件**'
  - '- 此拆解仅适用于“按次调用”的API模式；若采用包月固定接口费，成本结构完全不同'
  - '- 充值积分若设置不合理（比如太便宜），反而会拉低净利率，甚至补贴重度用户导致亏本'
  sources:
  - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
    role: origin
  excerpts:
  - 小程序广告和充值变现 看一次30s广告的CPC大概在0.1-0.3之间
  - 抖音小程序广告变现 看一次30s广告的CPC大概在0.1-0.3之间
  - 其实这里边还有个充值积分的钱，可以平摊到接口调用费用中。
- 'no': 4
  name: 蹭关键词SEO —— 在水流湍急的地方下网
  points:
  - '**为什么需要这个概念？**'
  - '- AI绘画小程序刚上线时没有自然流量、没有粉丝基础，主动投广告又费钱'
  - '- 需要一种近乎零成本的获客方式，把平台的搜索流量“白嫖”过来'
  - '- 搜索流量的用户是带着明确需求来的，转化率远高于刷到的泛流量'
  - '**核心定义**'
  - '- 通过观察微信指数等工具锁定当下热门的关键词（如“AI绘画”），再把这些词植入小红书、抖音等平台的账号名称与简介中，让用户在搜索这些词时能刷到你的账号，从而获得平台的搜索自然流量'
  - '**关键性质**'
  - '- 低成本：只需改一下昵称和简介，几乎零边际成本'
  - '- 精准：搜索用户本身就有需求，点击即意向'
  - '- 长尾效应：一次铺设，持续带来流量；且关键词热度越高，蹭到越多'
  - '- 主导性：作者实测本项目约98%的流量都来源于小程序搜索，说明SEO在本项目里不是补充手段，而是命脉'
  - '**典型例子**'
  - '- 作者预判“AI绘画”会是高频搜索词，提前在小红书等平台把关键词埋进账号名和简介，“简单的设置下名字和简介就能够蹭来很多流量”'
  - '**边界条件**'
  - '- 该方法依赖平台算法与搜索规则，关键词热度会随风口消退而衰减'
  - '- 若平台对“蹭词”行为限流或要求内容与关键词高度相关，则可能失效'
  - '- 仅适合早期零成本冷启动，后期仍需内容或投放来承接流量'
  sources:
  - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
    role: origin
  excerpts:
  - 流量方面我首先采用的是蹭关键词的方法：
  - 这个是当前当下AI绘画关键词的微信指数，所以简单的设置下小红书的名字和简介就能够蹭来很多流量
  - 几乎百分之98的流量都来源于小程序搜索，所以关键词SEO这块目前非常重要。
- 'no': 5
  name: 从选型到躺赚 —— 复制一条可跑通的流水线
  points:
  - '**为什么需要这个概念？**'
  - '- 很多新手面对AI绘画项目，第一反应是“我要自己开发一个”，投入大、周期长、风险高'
  - '- 需要一条现成的、别人已经跑通的路，照着做就能快速落地'
  - '- 把项目拆成固定步骤，降低启动门槛，让人人都能快速复制'
  - '**核心定义**'
  - '- 四步操作流程：①选一个靠谱的小程序供应商（照猫画虎，不自研）；②做关键词SEO引流；③开通流量主、配置广告位；④如有私域流量和内容能力，可自行发布视频导流'
  - '**关键性质**'
  - '- 门槛低、可复制性强：不需要开发能力，选型即可'
  - '- 先选型后引流：把“货架”搭好再引客，避免流量来了没处接'
  - '- 数据驱动优化：98%流量来自搜索，所以SEO是核心，其他动作都是辅助'
  - '**典型例子**'
  - '- 作者自己不做开发、没有私域，仅靠“选供应商+蹭SEO+开流量主”三步，就实现月收益5W+'
  - '**边界条件**'
  - '- 依赖第三方供应商的质量与稳定性，若供应商跑路或服务降级，项目即受冲击'
  - '- 仅适合广告变现型工具类小程序；若想做品牌或长期资产，需要更深的产品与技术投入'
  - '- 该流程是“复制”而非“创新”，可复制意味着竞争者涌入后红利迅速衰减'
  sources:
  - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
    role: origin
  excerpts:
  - 1、选一个靠谱的小程序供应商 2、照猫画虎一样的去蹭SEO关键词 3、开通流量主，设置广告 4、如果有私域流量和做内容的能力，可以自己发布视频引流量
- 'no': 6
  name: 风口生意的天花板 —— 从“追风口”到“建能力”
  points:
  - '**为什么需要这个概念？**'
  - '- 风口总有消退的一天，靠运气赚的钱，最终会靠实力亏掉'
  - '- 如果只停留在“复制一个爆款项目”的层面，项目死了就一无所有'
  - '- 需要把一次性的项目经验，沉淀为可复用的商业拆解能力，才能在下个风口来临时再次抓住机会'
  - '**核心定义**'
  - '- 作者自述其成功“还属于风口和运气成分居多”，但背后真正的护城河是“无数次在生财阅读各种文章后积累的项目的感觉”——即通过大量案例复盘建立的商业拆解能力'
  - '**关键性质**'
  - '- 可迁移性：项目感觉不绑定于单一项目，能应用于新风口、新赛道'
  - '- 复利性：每复盘一个案例，能力就增长一分，长期积累形成判断力'
  - '- 反脆弱性：即便当前项目失败，能力还在，随时能东山再起'
  - '**典型例子**'
  - '- 作者并非只做AI绘画，而是长期在生财等平台“攒感觉”，等到AI绘画风口一来，用之前练就的“项目感觉”快速上马并变现'
  - '**边界条件**'
  - '- 这种“感觉”需要长期、大量的案例输入，短期速成不可能'
  - '- 只在“信息差型”副业项目中适用；对于需要核心技术壁垒的生意，单纯拆解能力不足够'
  - '- 方法有效的前提是持续学习，一旦停止输入，能力也会停滞'
  sources:
  - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
    role: origin
  excerpts:
  - 这个项目其实做起来目前来说，还属于风口和运气成分居多，不过这背后其实是无数次在生财阅读各种文章后积累的项目的感觉
