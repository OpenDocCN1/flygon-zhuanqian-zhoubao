- 'no': 2
  name: 案例标题格式 —— 用“主题+平台+数据结果”抓住注意力
  points:
  - '**为什么需要这个概念？**'
  - '- 汇编中数十篇文章并列呈现，读者需要快速判断哪篇值得点开'
  - '- 副业案例的核心价值在于可复制性与收益预期，标题是传递这些信号的第一载体'
  - '- 需要一种标准化的标题结构，降低读者的筛选成本'
  - '**核心定义**'
  - '- 案例标题格式采用“主题+平台+数据结果”三段式结构：主题标明做什么（如追热点）、平台标明在哪做（如公众号）、数据结果标明收益预期（如一天涨粉4万+，变现6K+）'
  - '**关键性质**'
  - '- 信息密度高：一个标题同时回答“做什么、在哪做、赚多少”三个关键问题'
  - '- 结果前置：数据结果往往是读者最关心的部分，放在标题中有效激发点击欲'
  - '- 可复制性暗示：具体数字让读者感知到“别人能做到，我也可能做到”'
  - '**典型例子**'
  - '- “公众号追热点复盘：通过行程码一天涨粉4万+，直接变现6K+”'
  - '- “实操复盘：10天时间，视频号从0到变现6000+，到场观过万，我做了什么？”'
  - '- “线上美业，不到2万成本到变现过百万”'
  - '**边界条件**'
  - '- 标题数据是结果复盘而非承诺，需警惕“幸存者偏差”'
  - '- 过度依赖数字吸引眼球，可能牺牲对方法论的深度描述'
  - '...'
  sources:
  - paper: docs/202301-02/SUMMARY.md
    role: origin
  excerpts:
  - 每篇文章采用'主题+平台+数据结果'的标题结构，如'单直播间日进800美金-小时均100美金'或'线上美业，不到2万成本到变现过百万'，以吸引读者并预览收益。
  - '[公众号追热点复盘：通过行程码一天涨粉4万+，直接变现6K+](AmKRdF2Z9oQjDExxxuAc18a5nbb.md)'
  - '[实操复盘：10天时间，视频号从0到变现6000+，到场观过万，我做了什么？](Lg2vd5GWHoqhBbxuT5LcThEpncb.md)'
  - '[单直播间日进800美金-小时均100美金，价值8800可矩阵的tiktok娱乐直播项目](FCiidWBeJoLOT1xreYnc9Se4nOf.md)'
  - '[线上美业，不到2万成本到变现过百万](E1WGd70YLoaHGfxAYJTc4WoFnsd.md)'
- 'no': 3
  name: 标题数字杠杆 —— 用具体数字撬动“可复制感”
  points:
  - '**为什么需要这个概念？**'
  - '- 抽象描述（如“效果不错”）缺乏说服力，难以建立读者的信任与预期'
  - '- 数字能瞬间锚定读者的收益认知，使其快速判断案例是否值得研读'
  - '- 案例汇编的实用性取决于读者是否能感知“复制后能获得什么”'
  - '**核心定义**'
  - '- 标题数字杠杆指在案例标题中嵌入涨粉数、变现额、成本等具体量化指标（如“4万+”“6K+”“过百万”），以此放大案例的可复制性与吸引力'
  - '**关键性质**'
  - '- 锚定效应：具体数字为读者提供一个清晰的收益参照系'
  - '- 低成本传递：不增加正文篇幅，仅通过标题即完成信息传递'
  - '- 结果导向：隐含“复制该方法即可获得类似结果”的逻辑暗示'
  - '**典型例子**'
  - '- 目录中大量标题包含具体收益或涨粉数字：“一天涨粉4万+”“变现6K+”“变现过百万”'
  - '- 案例标题：“IP如何做到风骨体面且年入千万”'
  - '**边界条件**'
  - '- 数字是特定时空下的结果，平台规则、市场环境变化后可能失效'
  - '- 高度凝练可能掩盖投入成本、运气成分等关键前提'
  - '...'
  sources:
