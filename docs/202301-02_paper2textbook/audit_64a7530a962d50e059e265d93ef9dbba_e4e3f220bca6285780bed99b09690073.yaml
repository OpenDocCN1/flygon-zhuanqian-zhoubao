unsupported_claims:
- location: '26.3'
  claim: 痛点需经得起专业人士解决的验证，伪痛点经不起专业推敲
  reason: 素材中未明确界定'专业推敲'的具体标准与操作流程，仅引用夕子观点未提供可落地验证清单
- location: '26.4'
  claim: 信息差核心壁垒在于获取渠道与效率，而非信息本身
  reason: 素材虽有胖龟物业/水电费渠道案例，但未系统对比'信息本身'与'渠道效率'在不同业务阶段的边际贡献度
- location: '26.5'
  claim: 选品公式=精准痛点解决方案+信任背书+高复购结构，权重40/30/30
  reason: 素材仅给出夕子'深挖需求/涵盖面/品牌背书/高复购/可溢价'五维口述，未提供权重推导的量化依据与跨品类验证数据
- location: '26.6'
  claim: MVP验证标准：首单成本<预算、回本周期<阈值、复购意向>0
  reason: 素材列举夕子/胖龟/老杨/美团四个案例的MVP成本与结果，但未披露各案例具体的首单成本、回本周期、复购率实测数值，无法支撑通用阈值设定
- location: '26.7'
  claim: 窗口期判断依据：平台战略重心、头部玩家动作、流量单价、违规容忍度、政策风向
  reason: 素材中老杨采用'对标抖音历史路径法'、胖龟用'宏观周期拐点法'，但未给出上述五个维度的具体量化指标与权重
- location: '26.8'
  claim: 1+1+1矩阵中项目生命周期2-6个月，必须具备开发新项目能力
  reason: 素材仅老杨口述'生命周期2-6个月'，夕子/胖龟案例未披露其接力项目的具体启动节点、验证周期与成功率
- location: '26.9'
  claim: 公域获客四大战术优先级：冷启动期主动出击>蹭流截流>内容建设；成长期内容建设>主动出击>蹭流截流
  reason: 素材三位创业者战术执行差异大（夕子重内容、胖龟重主动/蹭流、老杨重模仿/微创新），未提供跨阶段A/B测试数据支撑优先级排序
- location: '26.10'
  claim: 五位一体成交飞轮：破冰→诊断→方案→信任→成交，解决为什么买/跟你买/现在买
  reason: 素材虽对照夕子/胖龟执行动作，但未量化各环节转化率、客单价提升幅度、LTV贡献度，飞轮闭环有效性缺乏硬数据支撑
- location: '26.11'
  claim: 裂变扩张三模式判据：基建重→城市合伙人；运营重→加盟赋能；销售重→人海战术
  reason: 素材三位创业者扩张模式各异，但未披露各模式下的CAC、LTV、复制成功率、管理成本等关键财务指标对比
- location: '26.12'
  claim: 4C模型权重区间：创始人身份10-30%、岗位权重30-40%、时间投入10-25%、资金投入20-50%
  reason: 素材引用玉斌'成百上千案例积累经验区间'，但未公开案例样本量、行业分布、权重锚定的具体协商机制
- location: '26.13'
  claim: 风控四大核心防线：劳动合同全套、平台规则红线、融资零前置费、止损红线
  reason: 素材汇总胖龟/夕子/老杨教训，但未量化各防线投入产出比、覆盖风险类型占比、剩余风险敞口
- location: '26.14'
  claim: 心态五层塔：正反馈驱动热爱→盲目自信→成功累积自信→俯视学习→拒绝战术勤奋
  reason: 素材综合龙哥/小排/老杨/可可陶等碎片化心得，缺乏心理学实证研究或纵向追踪数据验证层级因果关系
