- 'no': 4
  name: 从索引到知识库 —— 案例集的进化路径
  points:
  - '**为什么需要这个概念？**'
  - '- 纯索引只解决“找到”，不解决“懂得”与“用上”，随着积累越来越厚，反而越来越难用'
  - '- 读者需要：跨案例的模式识别（如“所有爆款都用了钩子”）、方法论的显性提取、决策时的直接调用'
  - '- 必须从“目录管理”进化为“知识工程”，引入分类体系、标签系统、关联链接、专题综述'
  - '**核心定义**'
  - '- 将周报条目按“平台（抖音/小红书/视频号）”、“赛道（AI绘画/私域/电商）”、“阶段（冷启动/放大/避坑）”三维度重新打标'
  - '- 建立“案例-方法论-工具-模板”四层关联：每个案例链接其使用的SOP、工具清单、复盘模板'
  - '- 定期输出“专题深度报告”：如《2023上半年视频号带货100案例横向对比》《AI变现项目避坑白皮书》'
  - '**关键性质**'
  - '- 检索维度从“时间序”扩展为“问题域”：用户可按“我在做视频号选品”直接调取所有相关案例'
  - '- 支持模式挖掘：通过高频标签共现（如“矩阵+无人直播+素材去重”）发现隐性打法组合'
  - '- 变现形态升级：从“免费周报引流”→“付费知识库订阅”→“定制化选题咨询”'
  - '**典型例子**'
  - '- Notion/Airtable搭建的“副业项目库”：每条记录含平台、赛道、投入、产出、关键动作、可复制性评分、源链接'
  - '- 语雀/飞书文档构建的“方法论维基”：将“爆款标题公式”“私域转化SOP”沉淀为可复用条目'
  - '- 结合向量数据库的智能问答：输入“视频号冷启动怎么破”，自动检索Top5相关案例并生成摘要'
  - '**边界条件**'
  - '- 结构化维护成本高：需人工或AI辅助做实体抽取、关系建立，边际成本随数据量线性增长'
  - '- 版本管理难题：平台规则变更导致旧案例失效，需引入“时效性标记”（如🟢有效/🟡参考/🔴失效）'
  - '- 核心壁垒非索引：真正护城河是“独家案例源”“深度复盘能力”“社群讨论质量”，而非目录本身'
  - '**素材溯源**'
  - '- 来源文档：SUMMARY.md（扩展方向表述）、20230207_00.md（长周期积累佐证）'
  - '- 核心依据：素材中明确提及“从单纯索引扩展为分析工具”“按平台/赛道分类支持深度复盘与趋势洞察”'
  sources:
  - paper: docs/202301-02/SUMMARY.md
    role: origin
  - paper: docs/202301-02/20230207_00.md
    role: improve
  excerpts:
  - 讨论此类周报如何从单纯索引扩展为分析工具，例如按平台（抖音、小红书）、赛道（AI绘画、私域裂变）分类，支持深度复盘与趋势洞察。
  - 本目录列出约40篇独立文章，覆盖公众号、抖音、小红书、视频号、TikTok等平台，以及AI绘画、Web3、私域裂变等主题
