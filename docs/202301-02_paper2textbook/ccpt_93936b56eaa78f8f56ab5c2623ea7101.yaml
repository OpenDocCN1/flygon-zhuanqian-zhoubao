paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
desc: 该素材是一篇面向普通用户的在线AI绘画实操教程，核心贡献在于无N卡/A卡也可通过Google Colab免费云GPU运行Stable Diffusion
  WebUI，完整给出从账号申请、环境搭建、模型分发到出图的流程，并原创性地总结了多套模型/文件的获取与迁移方法（Gdrive挂载、gdown、Hugging Face私有中转、任意云存储）。素材还给出了一套可直接复用的正向/负向prompt咒语与关键参数配置。
concepts:
- name: colab（Google Colaboratory）
  desc: Google提供的免费云GPU服务器（Ubuntu 18.04 + GPU），可供用户在浏览器中远程执行Python代码进行AI训练/推理，是本文免显卡玩AI绘画的基础载体。
  is_original: false
  excerpt:
  - colab是google提供的一个云平台，可以理解为一台远程电脑或者云服务器，用户远程连接进去后，可以用其提供的CPU、GPU资源做各种各样的事情。
  - Google colab提供了免费与收费服务，免费服务每个账号大概每天可以玩几个小时，免费的配置大概是12G的内存，15G左右的显存以及55G左右的硬盘。
- name: stable diffusion WebUI
  desc: 基于stable diffusion开发的可视化Web界面，免去命令行交互，是本文认为AI绘画大火的重要原因。
  is_original: false
  excerpt:
  - 基于用于stable diffusion开发的一套webui的界面，方便更多人的使用。没有这个的话，要使用stable diffusion的话只能写代码或者敲命令，大多数人使用会很困难，这也是现在AI绘画大火的一个很重要的原因。
- name: Gdrive挂载模式
  desc: 将模型文件存于Google云端硬盘并挂载到colab，再利用cp命令拷贝到SD环境中；优点是不易丢失，缺点是免费盘仅15G，模型文件过大放不下几个。
  is_original: true
  excerpt:
  - 将模型文件放入自己的Gdrive（Google 云端硬盘），然后colab挂载Gdrive，将Gdrive的文件拷贝到Colab中。
  - 这种方法的优点是模型文件因为是自己的云端硬盘文件，会确保不会丢失，缺点是免费的google账户硬盘空间只有15G，模型文件动辄4G、8G，所以存不了几个模型云端硬盘就会满了。
- name: Hugging Face私有中转法
  desc: 在Hugging Face创建私有model仓库并上传模型文件，再结合token与wget在colab中下载，既保护非官方开源模型隐私又解决了Gdrive空间不足的问题；本文最推荐此法。
  is_original: true
  excerpt:
  - 原因是有些model是泄露出的，并不是官方开源的，避免一些麻烦，所以你还没玩懂之前，选成私有的自己玩玩。
  - 我个人比较推荐使用huggingface，简单易学，综合体验很好。
  - 上传完成之后点左下角的commit，成功之后如下图...获取到了这个模型文件的下载链接。
- name: AI绘画prompt咒语
  desc: 正向tag（如masterpiece、best quality、sea beach、chiaroscuro等）与负向tag（如lowres、bad
    anatomy、text、watermark等）共同组成的高质量文生图提示词组合，可稳定输出精致细腻的动漫风海洋场景。
  is_original: true
  excerpt:
  - masterpiece,best quality,CG,wallpaper,HDR,{(sea beach)},{beautiful detailed water},{detailed
    light},((extremely delicate and beautiful girls)),((blue bubble)),splash,fluttered
    detailed splashs,{{intricate detail}},{highres},surrounded_by_floating_petal,chiaroscuro,swimming
    ring,splash,waves, coconut trees
  - 'Negative prompt: lowres, (bad anatomy, bad hands:1.1), text, error, missing fingers,
    extra digit, fewer digits, cropped, worst quality, low quality, normal quality,
    jpeg artifacts, signature, watermark, username, blurry, artist name, b&w, weird
    colors, (cartoon, 3d, bad art, poorly drawn, close up, blurry:1.5), (disfigured,
    deformed, extra limbs:1.5)'
methods:
- name: __overview__
  desc: 一套面向零基础用户的Google Colab云端免费运行SD WebUI的全流程方法论：由申请账号→访问共享脚本→设置GPU环境→搭建webui→下载模型→启动出图组成。
  excerpt:
  - '# 开始实操 一、申请Google账号 二、访问colab共享脚本 三、设置colab环境（修改硬件加速器为GPU/连接/释放） 四、stable diffusion
    webui环境搭建 五、下载各种模型 六、运行stable diffusion webUI'
- name: colab环境初始化法
  desc: 修改colab硬件加速器为GPU并连接免费云资源；不再使用时通过disconnect and delete runtime释放服务器资源，避免占用免费时长。
  excerpt:
  - 选择左上角Edit(修改)->Notebook settings (笔记本设置)->Hardware accelerator（硬件加速器）->GPU
  - 选择右上角connect（连接）->就会分配云服务器资源。
  - 选择右上角connect（连接）->disconnect and delete runtime（断开连接并删除运行时）
  - 注意：该操作会将搭建好的环境全部删除清空
- name: colab一键搭建SD WebUI脚本
  desc: 依次执行挂载Gdrive、git clone stable-diffusion-webui、安装全部依赖的三大命令，即完成环境配置。
  excerpt:
  - '# 挂载Google Drive / from google.colab import drive / drive.mount(''/content/drive'')'
  - '# 下载stable diffusion webui最新代码 / !git clone https://github.com/AUTOMATIC1111/stable-diffusion-webui.git
    / %cd stable-diffusion-webui'
  - '# 安装stable diffusion webui工程所有依赖资源 / !COMMANDLINE_ARGS="--exit" REQS_FILE="requirements.txt"
    python launch.py'
- name: gdown分享文件下载法
  desc: 利用Google Drive文件的分享ID，通过gdown命令直接下载到colab的模型目录，适合一两人的小圈子分享模型，人多了google会屏蔽访问。
  excerpt:
  - 进入网络硬盘，找到想要分享的文件，点击共享->权限为知道链接的任何人->复制链接->下图分享链接红框选中的就是该文件的ID，填入到脚本中的输入框即可
  - 'model_name = '''' #@param {type: ''string''} / !gdown {model_name} --output /content/stable-diffusion-webui/models/Stable-diffusion/model.ckpt'
- name: Hugging Face私有仓库+token下载法
  desc: 注册HF账号→新建Private模型仓库→上传模型文件→获取下载链接→生成token→填入脚本，利用带Authorization头部的wget从HF下载模型和VAE。
  excerpt:
  - 'user_token = '''' #@param {type: ''string''} / model_link = '''' #@param {type:
    ''string''} / model_vae_link = '''' #@param {type: ''string''}'
  - 'user_header = f"\"Authorization: Bearer {user_token}\"" / !wget --header={user_header}
    {model_link} -O /content/stable-diffusion-webui/models/Stable-diffusion/model.ckpt'
  - '!wget --header={user_header} {model_vae_link} -O /content/stable-diffusion-webui/models/Stable-diffusion/model.vae.pt'
- name: 其他云存储下载法（泛化）
  desc: 凡能拿到模型文件外网访问地址或提供API的云盘（mega、AWS S3、Google Cloud Storage等）理论上均可在colab中下载，原理与HF下载相同。
  excerpt:
  - 如mega，AWS S3，google Cloud Storage...只要能拿到模型文件的外网访问地址，或者有提供API的云盘，理论上都可以，原理和从huggingface下载是一样的。
- name: SD WebUI启动参数配置法
  desc: 通过COMMANDLINE_ARGS注入--share、--gradio-auth、--deepdanbooru等命令行参数，一次性启动带公网链接、登录鉴权与图片提词功能的webUI。
  excerpt:
  - '命令行参数如下:'
  - '  - `--share` - 创建一个在线的 gradio.app 链接'
  - '  - `--deepdanbooru` - 用于安装deepdanbooru，方便使用图片获取prompt'
  - '  - `--ckpt` - 用于选择加载默认模型'
  - '!COMMANDLINE_ARGS="--deepdanbooru --share --gradio-debug --gradio-auth test:test"
    REQS_FILE="requirements.txt" python launch.py'
theorems:
- name: 免本地高性能显卡的AI绘画可行主张
  desc: 无论电脑有无N卡/A卡，借助colab的免费云GPU资源即可完成stable diffusion绘画，只需浏览器与Google账号。
  excerpt:
  - 大家好，我是屋顶瓦，今天带来一期在google colab上快乐玩耍AI绘画的教程，干货满满，看完秒变专业玩家！
  - 因为数据训练需要较为强大的GPU资源，一般很多个人电脑配置并不能达到要求，所以colab现在在人工智能、机器学习领域用的比较多。
- name: 多品类模型文件画风差异性主张
  desc: 同一prompt、同一参数下，不同模型文件（NovelAI、Waifu1.3、SD1.4/1.5等）生成画风差异显著：动漫类模型偏二次元、SD系列因LAION-5B数据偏向真实风格。
  excerpt:
  - 上图从左到右、从上到下...从模型使用同一个prompt、同样参数生成的图片，可以明显看出novelai以及waifu满满的动漫风、其他模型则更加显得真实一些。
  - NovelAI以及Waifu这两个模型对应的是动漫画风，Stable Diffusion1.4/1.5，由于它使用来自LAION-5B数据库进行训练，...所以其画风包含了更多样式。
- name: 模型文件拷贝的位置闭环原则
  desc: 在colab中玩SD，需先用环境搭建把webui装到云端电脑，再将模型文件拷贝到指定模型目录下，webui才能加载模型并出图。
  excerpt:
  - colab环境类似一台拥有GPU资源的云服务器...，通过上述操作stable diffusion webui环境搭建，已经将sdwebui的环境安装到了该台电脑上，现在需要将模型文件也拷贝到该台电脑上，sdwebui才能加载模型，从而出图。
findings:
- name: Finding 1 - 模型多下载与空间利用率对比
  desc: '[evidence] 文中实证展示Gdrive法只能同时放1-2个模型（15G盘），而colab直接下载法借助50多G空间可同时玩10个左右模型。'
  excerpt:
  - 缺点是免费的google账户硬盘空间只有15G，模型文件动辄4G、8G，所以存不了几个模型云端硬盘就会满了，所以只能同时玩1-2个模型。
  - 在colab中直接下载模型文件。这种方法优点就是，colab默认有50多G的空间，可以下载很多模型，我最多的时候下载过10个左右的模型文件同时玩。
- name: Finding 2 - 共享脚本一键运行效率
  desc: '[evidence] 教程展示利用菜单‘运行当前单元格以及其后的所有单元格’可一键顺序执行整个脚本，等待最后一条执行完即可打开webui页面，降低了操作门槛。'
  excerpt:
  - 之后运行的话可以一键运行整个脚本，点击到脚本文件中的第一个单元格，随后点击菜单代码执行程序->运行当前单元格以及其后的所有单元格，这样整个脚本就会顺序执行了，只要等它执行完最后一条，就可以打开webui页面了。
- name: Finding 3 - 免费用户多账号延长使用时长
  desc: '[claim] 作者宣称若免费6小时不够用，可通过注册多个Google账号分别使用、各玩数小时，来延长整体可玩时长。'
  excerpt:
  - 如果这几个小时还体验不够，有没有办法延长时间呢？答案是有的，你只需要多注册几个google账号，每个可以玩几小时，多几个账号就可以多玩很多小时- -
