learning_targets:
- 理解为什么多数副业失败源于'从零发明'而非'复制已验证模式'
- 掌握商业项目拆解的核心逻辑：从爆款中找到流量、转化、交付三大链路
- 学会判断项目可复制性的三大标准，避免掉入'伪机会'陷阱
- 能运用'后发制人'思维，在降低试错成本的同时找到自己的微创新切入点
- 建立'卖空气/软文先行'的逆向产品思维：先验证需求，再投入开发
- 掌握六维项目评估模型，能对任意项目进行可复制性与收入天花板的量化拆解
concept_map:
- 商业项目拆解
- ├── 为什么要拆解
- │   ├── 多数副业失败：从零发明而非复制已验证模式 —— P001, P002
- │   ├── 单案例难复制：需先理解内在链路 —— P001
- │   └── 后发制人：等别人验证月余再入场降低试错成本 —— P001
- ├── 拆什么
- │   ├── 流量获取方式：固定内容分享 / 投放 —— P002
- │   ├── 转化链路：直播间 / 私域社群 / 朋友圈+私聊 —— P002
- │   └── 产品交付方式：有形 / 无形、客单价、同行做多久 —— P002
- ├── 可复制性判定三标准
- │   ├── 爆得非偶然 —— P001
- │   ├── 货源非独家（可另寻渠道） —— P001
- │   └── 消费场景验证有需求 —— P001
- └── 拆解后的评估与行动
- '    ├── 六维模型评估：流量/销转/交付效率 + 客单价/毛利率/复购率 —— P003'
- '    ├── 六维及格线：满足四个点及格，效率不足时靠财务补齐 —— P003'
- '    ├── 三效率决定可复制性：三都高则赚多赚少取决于流量 ── P003'
- '    ├── 结合自身擅长点微创新，避免照搬水土不服 —— P001, P002'
- '    └── 案例验证：儿童游乐（3月40W）、文川手写logo（599差价）、知识付费（500W天花板） —— P002, P003'
life_analogy:
- 想象商业项目拆解是一个**厨师拆解招牌菜**的过程：
- '- **爆款视频** = 别人店里排队到街角的招牌菜'
- '- **流量获取** = 这道菜吸引食客的摆盘和香气（表面功夫）'
- '- **转化链路** = 顾客从进门到点这道菜的引导动线（菜单设计、服务员推荐）'
- '- **产品交付** = 后厨真正端上桌的那道菜（实打实的产物）'
- '- **可复制性** = 这道菜能否用常见食材复刻，而不是靠独家秘方和运气'
- '- **六维评估** = 判断这道菜值不值得上菜单：做起来快不快（效率）、定价高不高（财务）'
- 就像厨师不靠灵感发明新菜，而是拆解爆款菜品的可复制配方；副业成功不是从零创造，而是把赚钱的商业模式拆成能复制、能微调的零件，再用统一的尺子量一量它能走多远。
summary:
- concept: 商业项目拆解
  desc: 从爆款中发现可复制的副业项目，拆出流量、转化、交付三大底层链路的过程
- concept: 私域前端流量
  desc: 私域只是渠道，真正决定成败的是前端是否有稳定流量进来——先解决流量，再谈转化
- concept: 后发制人
  desc: 不追求原创、不做赌注式all in，等别人验证项目可赚后复制或二次创作，降低试错成本
- concept: 可复制性三标准
  desc: 爆红不靠偶然、货源非独家、消费场景验证有需求——三条满足才可低成本复制
- concept: 信息差搬运论
  desc: 渠道间存在信息差，把A平台做烂的内容优化后搬到B平台，可能瞬间爆火
- concept: 软文先行/卖空气
  desc: 先写软文、卖预售验证需求，再决定是否开发——软件的本质就是软文
- concept: 喂养算法与情报挖掘
  desc: 通过主动点赞/收藏/停留引导平台推荐商业情报，建立持续稳定的项目信息源
- concept: 六维项目评估模型
  desc: 用流量/销转/交付三效率判断可复制性，用客单价/毛利率/复购率判断收入天花板
- concept: 六维满足度及格线
  desc: 六个维度满足的越多越好，满足四个点为及格线；效率维度偏低时需用财务维度补足收入
- concept: 三效率决定可复制性
  desc: 流量/销转/交付三个效率都高则项目可矩阵化放大、赚多赚少取决于流量多少；任一偏低则难以复制
- concept: 红海赛道不红
  desc: 任何红海赛道都不缺年赚几十万的人，找到已验证项目做微调即可进场
exercises:
- 'no': 1
  title: 拆解一个你刷到的爆款视频
  contents:
  - 打开抖音或小红书，找到一条你认为'能赚钱'的爆款商业视频（点赞>5W），回答以下问题：
  - 1. 流量获取：这个账号通过什么固定内容形式引流？（口播、情景剧、图文笔记？）
  - 2. 转化链路：视频如何引导用户成交？（挂车、私信引导、评论区暗号？）
  - 3. 产品交付：它卖的是有形产品还是无形服务？客单价大概多少？
  - 4. 可复制性：用'爆得非偶然、货源非独家、场景有需求'三标准判断能否复制？
  - 5. 微创新：如果你来做，你擅长的哪些点可以做差异化调整？
  - 提示：不要只看表面形式，要拆到'链路'层面，即对方连续做了几个月且稳定赚钱的动作。
- 'no': 2
  title: 六维模型实战：给三个项目打分并判断天花板
  contents:
  - 用六维模型（流量效率、销转效率、交付效率、客单价、毛利率、复购率）评估以下三个项目，每个维度按高/中/低打分：
  - 1. 小说推文（书单号）——内容素材固定、挂链接佣金变现、无需交付
  - 2. 线上PPT定制——需要接单沟通、按页收费、需人工交付
  - 3. 知识付费训练营——直播间口播卖课、高客单价、课程录制后一次交付
  - 回答问题：
  - '- 哪个项目的效率三维（流量/销转/交付）组合最适合矩阵化放大？'
  - '- 哪个项目需要靠财务三维（客单价/毛利率/复购率）来补偿效率不足？'
  - '- 参考''六个点满足四个点及格''的标准，哪个项目最接近及格线？'
  - '- 如果你只有内容制作能力、没有销售团队，你会优先选哪个？为什么？'
- 'no': 3
  title: 逆向策划：设计一个'卖空气'验证方案
  contents:
  - 假设你想做一个'AI周报自动生成工具'，但目前没有开发能力，只有一篇很能打动目标用户的推广文案。
  - 请设计一个'软文先行+卖空气'的验证方案：
  - 1. 你的目标用户是谁？他们的核心痛点是什么？（写清楚用户画像）
  - 2. 写一段500字左右的'已解决口吻'的软文大纲，包括：
  - '   - 开头如何复述用户的问题/症状以建立信任'
  - '   - 中间如何展示''工具已存在''的截图或界面'
  - '   - 结尾如何引导用户付费或留资（预售）'
  - 3. 你计划如何判断验证成功？（例如：多少人付费/留资算通过）
  - 4. 如果验证失败，你的止损点设在哪里？
  - 提示：参考'复述问题建立信任'和'有效噱头，无效产品'的案例，但思考其伦理边界。
- 'no': 4
  title: 案例诊断：这个项目为什么不可复制？
  contents:
  - 阅读以下项目描述，用可复制性三标准判断其是否适合普通人复制：
  - '''某网红自制独家配方的手工酱料，通过直播带货月销10万瓶，配方严格保密，限量发售，每次开播瞬间售罄。'''
  - 回答问题：
  - 1. 这个项目'爆得偶然'吗？为什么？
  - 2. '货源非独家'这一条是否满足？为什么？
  - 3. '消费场景验证有需求'——虽然需求已验证，但普通人能否切入？
  - 4. 综合判断：这是'可复制的副业'还是'不可复制的生意'？给出至少两条理由。
  - 5. 如果一定要做相关方向，你会选择哪个环节切入（原料供应、包装设计、直播代运营）？为什么？
units:
- 'no': 1
  name: 商业项目拆解 —— 把“赚钱的别人”拆成“可复制的零件”
  points:
  - '**为什么需要这个概念？**'
  - '- 多数副业失败源于从零发明，而非发现已验证的商业模式'
  - '- 单个成功案例难以直接复制，需先理解其流量、转化、交付的内在链路'
  - '- 只有把“别人的成功”拆解为可识别的组件，才能判断是否可复制、如何微调'
  - '**核心定义**'
  - '- 商业项目拆解是指从爆款内容或成功案例中，系统性地拆出流量获取方式、转化链路和产品交付方式，进而复制出类似副业项目的过程'
  - '**关键性质**'
  - '- 关注底层链路而非表面模仿：拆的是流量、转化、交付，而非单纯的外在形式'
  - '- 可复制性判定：爆得非偶然、货源非独家、消费场景经验证有需求'
  - '- 后发制人：等别人验证可行后再复制或二次创作，降低试错成本'
  - '**典型例子**'
  - '- 儿童游乐项目：拆解爆款视频（8.4w赞、1.1w转发）后复制加盟模式，3个月变现约40万'
  - '- 文川手写logo：拆解其评论区客资与固定内容生产方式，外包设计、赚取差价'
  - '**边界条件**'
  - '- 若货源为项目方独家、爆红纯属偶然、或消费场景未经验证，则不可复制'
  - '- 拆解后仍需结合自身擅长点做微创新，完全照搬可能水土不服'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: improve
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: improve
  excerpts:
  - 拆下来之后，我就发现很多时候有些项目是完全可以复制的，是不需要投入几十万也可以复制的。复制了之后，用跟他一样的内容生产方式、转化链路，你也能拿到一定的结果。
  - 通过刷抖音或者刷小红书的过程发现商业案例，再拆解复制这样的案例去形成一个商业模式，去发展自己的副业。
  - 首先，这个视频爆得偶然；其次，他货源不是他自己的，也就是说我可以通过别的方式找到他的货源；最后，这个消费场景经过验证是证明是有需求的，而且需求量还不小。
  - 我一定是看别人已经做成了，已经做了好几个月了，我才会选择做这个项目做这个赛道。
  - 任何项目都可以拆解成：「流量效率，销转效率，交付效率，客单价，毛利率，复购率」，这六个点。
  - 「六个点，满足的越多越好，满足四个点，及格」。
  - 如果流量效率，销转效率，交付效率，这三块有一块低的话，就很难复制放大，那就得在客单价，毛利率，复购率这三块下功夫，比如通过提高客单价来增加收入。
- 'no': 2
  name: 六维评估模型 —— 给项目算一笔“复制账”
  points:
  - '**为什么需要这个概念？**'
  - '- 拆解出项目链路后，还需要一把“统一的尺子”来判断项目值不值得做、能不能做大'
  - '- 只看表面的赚钱数字容易误判，需要从效率与财务两个维度立体评估'
  - '**核心定义**'
  - '- 六维评估模型将任何项目拆解为六个可量化指标：流量效率、销转效率、交付效率、客单价、毛利率、复购率'
  - '- 前三个为“效率维度”，决定项目能否复制放大；后三个为“财务维度”，决定收入天花板'
  - '**关键性质**'
  - '- 效率三维全高：意味着可通过矩阵、培训等方式放大，赚多赚少取决于流量多少'
  - '- 效率任一偏低：难以复制放大，需靠提高客单价、毛利率、复购率来补偿收入'
  - '- 及格线：六个点满足越多越好，满足四个点为及格'
  - '**典型例子**'
  - '- 小说推文：三效率全高但客单价低、无复购，月收益1000~2W'
  - '- 教育资料1.0→2.0：通过叠加高客单价合作转化，月收益从1.0的1000~2W跃升至2W~100W'
  - '- 知识付费：三效率全高+客单价高+毛利率100%，月收益10W~500W，天花板最高'
  - '**边界条件**'
  - '- 该模型是评估框架而非自动决策工具，仍需结合自身资源禀赋判断'
  - '- 六维中某一维的“高/低”是相对判断，需结合同行与自身条件校准'
  sources:
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: origin
  excerpts:
  - 任何项目都可以拆解成：「流量效率，销转效率，交付效率，客单价，毛利率，复购率」，这六个点。
  - 「六个点，满足的越多越好，满足四个点，及格」。
  - 流量效率高，意味着内容极其好复制，可以通过矩阵，培训等方式，把这一块单独拎出去，进行放大。
  - 如果流量效率，销转效率，交付效率，这三块有一块低的话，就很难复制放大，那就得在客单价，毛利率，复购率这三块下功夫，比如通过提高客单价来增加收入。
  - 小说推文项目：月收益1000~2W。流量效率高：内容素材获取简单，且素材大量，框架固定自带流量。销转效率高：搜索对应的暗号，充值会员就有佣金。交付效率高：无需交付。客单价低：十几二十块。毛利率高：50%以上。复购率低：没有复购。
  - 教育资料2.0项目：月收益2W~100W。（对比1.0，多了一步，高客单价转化合作）。客单价低：几千到十几二十万不等，毛利率高：10%，复购率低：基本没有复购。
  - 知识付费，以李一舟为代表：月收益10W~500W。流量效率高：内容门槛不高，口播就完事。销转效率高：直播间挂小黄车。交付效率高：课卖掉那一刻，就交付完了。客单价高：小几千。毛利率高：100%。复购率低：没有复购（课会更新）。
'no': 1
