paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
desc: 该素材以一份个人实战复盘的形式，记录了作者以“围观船员”（未正式完成航海任务）身份，在视频号带货项目7天内实现4个账号共10万粉丝、5万+利润的完整过程。作者分析了视频号带货在2022年7月后因平台打击搬运导致的行业困境，提出从“做商品”转向“做人群”的差异化策略，详细阐述了基于“情、趣、用、品”四象限的人群定位方法、跨平台伪原创的二创方法，并复盘了账号生命周期管理、变现与直播合作等后续运营思路，最终形成了一套从选赛道、做内容到变现合作的视频号带货打法。
concepts:
- name: 做人群替代做商品
  desc: 作者提出的一种差异化竞争策略：在平台上大多数玩家以搬运商品视频、用数量对抗爆款概率、因而陷入同质化竞争时，他转向选择细分人群，以人群的情感需求为出发点制作内容，从而实现流量的高效获取。
  is_original: true
  excerpt:
  - 四、视频号别人做商品，我做人群，伪原创。
  - 做商品类型的种草视频成功概率太小了，并且还有很多有船的大佬，现在都开始付费了，像我这样的单打独斗打不过。大路上的人太多了，我换条小路。
- name: 情、趣、用、品（内容四象限）
  desc: 作者提出的一套短视频内容分类模型，将几乎所有平台的爆款内容归纳为四类：共情（喜怒哀乐）、有趣（反差/实验）、有用（教学/实用）、新奇特产品（稀罕物件），并认为这四类的分支可以细分到上千种，是内容定位与找素材的底层逻辑。
  is_original: true
  excerpt:
  - 我把短视频内容分为"情趣用品"四个字
  - 情-共情（举例：喜怒哀乐）喜怒哀乐里面又能延伸小朋友的喜怒哀乐，20岁的，30岁的，40岁的，50岁的，男人的，女人的，有钱男人的，没钱女人的等等一些列分支。
  - 趣-有趣（有意思的实验，80岁老人做口播，一些反差较大的有意思的内容）
  - 用-有用（你教会我做菜了，你在教我做PPT，你教我做电工等等）
  - 品-新奇特的产品（北方人大多数没见过酸角糕，很多地方特色的绿植其他地区没见过-昨天看文林写了一个爆款叫彼岸花的盆栽）
  - 所有短视频平台的爆款内容，都可以纳入其中。
- name: 伪原创的二创方法
  desc: 作者提出的内容制作方法：在抖音、快手、优酷、知乎、小红书甚至TK等所有短视频平台作为素材库，基于“情、趣、用、品”的底层逻辑，寻找有迹可循的爆款规律，将这些素材不违规地进行二次创作（拼接、换音乐等），变成自己赛道发布的作品。
  is_original: false
  excerpt:
  - 抖音，快手，优酷，知乎，小红书，甚至TK，所有的短视频平台都是你的素材库。
  - 通过这个底层逻辑，你会发现很多爆款都是有迹可循，我们要做的无非是把这些素材不违规的二创成自己赛道的作品，进行发布。
  - 通过大概几十条作品的制作之后，你大概率会发现其实有些作者没上热门的视频，其实他的画面或者他们音乐很好。你就会开始留意那些视频的那些片段，或者音乐，脑海里面会自然给他做一个合适的拼接。
- name: 知识的诅咒与精神内耗
  desc: 作者指出的一个执行障碍：对短视频平台和内容制作有深刻理解的人（有丰富经验者），反而因为考虑变现难易、资源利用、未来困难等“远处的困难”过多，陷入精神内耗，执行不力；而没有太多顾虑的人反而更容易拿到结果，因此需要警惕并克服。
  is_original: true
  excerpt:
  - 这部分人群其实对短视频平台，内容制作有很深刻的理解，但是考虑的太多。
  - 比如：我做情感账号应该怎么变现，变现效果万一不好怎么办，我的资源能不能尽量的都用上等等远处的困难。
  - 反而没有顾虑的人执行起来更容易拿到结果，切勿陷入精神内耗。
methods:
- name: __overview__（围观船员破局方法论）
  desc: 该素材的整体方法论：首先通过系统收集信息（航海手册、群消息、搜索关键词）进行行业剖析，识别行业竞争与平台打击的痛点，然后在差异化方向（做人群）上定位细分赛道，再通过伪原创制作内容（情、趣、用、品）获量，最后结合账号生命周期管理（限制观看次数、分配精力）与外部资源合作（直播基地/供应链）完成商业变现，形成一条从选赛道到变现的完整路径。
  excerpt:
  - 群消息从头翻到尾+航海手册+生财搜索"视频号"关键词，几乎这些资料整体阅读不下5次
  - 查资料更是数不清多少次了
  - 通过收集信息进行剖析
  - 从这两个问题中间找到突破点
  - 四、视频号别人做商品，我做人群，伪原创。
  - 在账号第四天我就想过招主播了...正好想到这个基地这个，我跟他聊把账号拿去给他们播...我只需要专注做流量，拿分润。
- name: 信息收集与行业剖析方法
  desc: 作者的开局方法：通过系统性地阅读航海手册、翻看群消息、在生财搜索“视频号”关键词，将资料阅读5次以上，再结合检索到的行业信息，对行业现状（收入降低、平台搬运打击）进行因果剖析，从而找出自己的突破方向。
  excerpt:
  - 群消息从头翻到尾+航海手册+生财搜索"视频号"关键词
  - 几乎这些资料整体阅读不下5次（盗坤文林等等大佬的文章很有感触）
  - 查资料更是数不清多少次了。
  - 我的猜测：大概率入行的人多了大家都在做带货视频；以前纯靠搬运，现在平台开始有打击动作了
- name: 人群定位四象限法
  desc: 基于“情、趣、用、品”四象限的内容分类，用于细分人群定位。作者指出：这四个板块的分支可以延伸到上千种，定位时不要“想要的越多越陷入困境”，只需在成千上万的分支中扣到一个点就够了。
  excerpt:
  - 我把短视频内容分为"情趣用品"四个字
  - 情-共情（举例：喜怒哀乐）喜怒哀乐里面又能延伸小朋友的喜怒哀乐，20岁的，30岁的，40岁的，50岁的，男人的，女人的，有钱男人的，没钱女人的等等一些列分支。
  - 趣-有趣（有意思的实验，80岁老人做口播，一些反差较大的有意思的内容）
  - 用-有用（你教会我做菜了，你在教我做PPT，你教我做电工等等）
  - 品-新奇特的产品
  - 这四个板块的分支的延伸可以细分到上千种。
  - 做好定位应该是每个内容创作者最初期的想法，但是往往想要的越多越陷入困境。
  - 这些成千上万的分支里面能扣到一个点，其实就够了。
- name: 伪原创二创法
  desc: 作者的内容制作方法：以全平台为素材库，基于“情、趣、用、品”底层逻辑拆解爆款视频，将素材“不违规地二创”成自己赛道的作品；经过数十条作品制作后，学会留意未上热门但画面或音乐好的视频，在脑海里自然拼接。同时建议若多赛道同时做，要分时间段找素材以免“脑裂”。
  excerpt:
  - 抖音，快手，优酷，知乎，小红书，甚至TK，所有的短视频平台都是你的素材库。
  - 这里分享一下安先生短视频课程我记录的Xmind
  - 通过这个底层逻辑，你会发现很多爆款都是有迹可循，我们要做的无非是把这些素材不违规的二创成自己赛道的作品，进行发布。
  - 通过大概几十条作品的制作之后，你大概率会发现其实有些作者没上热门的视频，其实他的画面或者他们音乐很好。你就会开始留意那些视频的那些片段，或者音乐，脑海里面会自然给他做一个合适的拼接。
  - （这里建议如果多少赛道同时做的话，尽量分时间段去找素材，真的很容易脑裂）
- name: 克服精神内耗的两点操作
  desc: 作者提出的应对“知识的诅咒”的实操方法：第一，想知道赛道如何变现就去看对标账；第二，不焦虑播放量的方法是不去看后台数据——给自己定下一天一个账号10条视频的目标，一天最多看一次后台数据去分析人群喜好。
  excerpt:
  - 第一点大多数人都会在意的点，账号如何变现，能赚多少钱？这点其实航海教练也说过很多次了，想知道你的赛道如何变现去看你的对标。
  - 第二点没有播放量的焦虑如何克服？不去看他，我给自己定的目标是一天一个账号10条视频，比如今天我剪了又40条视频。
  - 一天最多看一次后台数据，去分析视频号的人群喜欢看什么类型的内容。
- name: 账号与直播合作模式（输送到基地）
  desc: 作者提出的后续运营与变现合作策略：不自己同时做账号和直播（个人打法有限且风险大），而是专注孵化账号，将运作起来的账号输送到直播基地（利用其供应链）进行“日不落”式直播，自己拿分润，并帮助基地打造视频号案例，再牵手商家，形成借力打力的超级个体模式。
  excerpt:
  - 我的思路一直是专注一条线。
  - 如果我又做账号又直播只能是个人打法，能赚钱但有限，你也不知道什么时候平台打击你的账号，就一无所有了。
  - 专注流量自己孵化账号，同步找伙伴加入一起做账号。做出的账号输送到基地去日不落。
  - 帮助基地打造他们的视频号案例，然后手牵手去做商家。
  - 之前抖音DP盲目扩张团队的惨痛经历在，不想重蹈覆辙，接下来的寒冬里，借力打力，做一个温饱的超级个体户。
theorems:
- name: 概率性爆款与0播困境的成因（行业判断）
  desc: 核心主张：视频号带货在2022年7月后收入降低、大量账号被0播，是因为入行的人多了（大家都在做带货视频）以及平台开始打击搬运行为；基于此，纯粹做商品视频很难爆，用数量对抗概率虽然可行但容易0播、搞一波流。
  excerpt:
  - 几乎所有的在玩视频号项目的大佬都在说从7月分开始收入降低，搬运受打击严重。
  - 我的猜测：大概率入行的人多了大家都在做带货视频；以前纯靠搬运，现在平台开始有打击动作了
  - 概率性的爆，绝大多数人做的是商品的视频，以搬运为主，用数量对抗概率，实际结果下来可行的，但是后期容易0播，搞一波流。
  - 纯粹做商品的视频其实很难爆。
- name: 竞争格局判断：鱼塘捕鱼论
  desc: 核心主张：在视频号带货这一赛道中，资源（流量/平台机会）是有限的“鱼塘”，头部玩家已占据优势位置（用网捕鱼），且开始付费投放，而普通散户（在岸边用钓竿）和上千人同时入场的情况下，单打独斗做商品视频难以竞争，必须走差异化路线。
  excerpt:
  - 大家都一个鱼塘捕鱼，他们在船上用网捕鱼，我们在岸边用钓竿。
  - 视频号航海应该有上千人吧。打个比方，每个人5个号，这就是5000个号了，每个账号10条商品视频，这就5万条了。
  - 做商品类型的种草视频成功概率太小了，并且还有很多有船的大佬，现在都开始付费了，像我这样的单打独斗打不过。
- name: 人群泛化与变现效率的关系（内容→变现的权衡）
  desc: 核心主张：大爆款（破亿播放）带来的粉丝人群是泛的，其变现效率反而较低；而精准人群虽播放量不如泛人群高，但变现效果更好（对比C账号破亿播放实际变现约3万，与AB账号破千万变现2万+）。这提醒在内容定位时，追求播放量与追求变现之间存在张力，需要权衡。
  excerpt:
  - 大爆款的人群会泛，产品可能也没选好，实际变现其实只有3万左右。
  - AB账号2天破百万播放，7天破千万播放，真正变现应该是从5，6号开始到现在大概有2W多
  - C账号第3天破千万，第5天单天4000万播放，7天破亿播放了，6号开始直播。大爆款的人群会泛，产品可能也没选好，实际变现其实只有3万左右。
findings:
- name: 四账号差异化定位的效果验证
  desc: '[evidence] 作者采取四个账号分别定位不同人群（白领虚荣穷、80-90怀旧、50+女性亲情共情、纯带货）后，AB账号2天破百万播放、7天破千万播放并变现2W+；C账号第3天破千万、第5天单天4000万播放、7天破亿播放，变现3万左右；D账号20条无反馈被放弃，这展示了精准人群定位与内容质量（而非纯搬运数量）在视频号带货中的有效性。'
  excerpt:
  - 做了四个账号。
  - A:20岁-30岁，刚毕业的大学生白领群体，特征：虚荣心强但穷。
  - B:35岁-45岁，80-90年代的怀旧情怀
  - C:50+的女性，亲情共情。
  - D:还有一个带货账号
  - AB账号2天破百万播放，7天破千万播放，真正变现应该是从5，6号开始到现在大概有2W多
  - C账号第3天破千万，第5天单天4000万播放，7天破亿播放了，6号开始直播。大爆款的人群会泛，产品可能也没选好，实际变现其实只有3万左右。
  - D账号更了20条没什么反馈，其他账号都起来了于是就放一边了。
- name: 爆款生命周期衰减与应对
  desc: '[evidence] 作者观察到账号爆了三天后，高峰期流量开始衰减（第四天约2000万播放，较前一日峰值明显下降），因此主动将直播时间从长时间减少到3小时，并引入外部直播基地合作以延长变现窗口，证明视频号带货账号存在明显的流量衰减周期，单纯消耗流量不可持续。'
  excerpt:
  - 账号爆了三天，自己播了三天，真的坐下来开播就是钱。
  - 一个小时几千块的感觉，会让人沉迷。但我意识到不能这样，如果每时每刻都在直播，我没有精力去做内容，流量迟早被消耗完。
  - 而且主要三个账号一起爆，我只能选择最好的账号直播。吃了三天最高峰流量。第四天大概只有2000万左右播放了，我把直播时间减少到3个小时。
- name: 视频号与抖音热点差异观察
  desc: '[claim] 作者根据实践经验宣称“抖音的热度内容不一定在视频号爆”，提示内容策略不能直接跨平台照搬，需要观察视频号平台人群的特性来调整。'
  excerpt:
  - （抖音的热度内容不一定在视频号爆）
