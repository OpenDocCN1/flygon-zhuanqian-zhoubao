unsupported_claims:
- location: ch11.6
  claim: 作者将一篇"中开高走"的文章，把最精彩的情节（如"分手""千金"）提炼成关键词并前置到开头，完播率从 40% 提升至 65-70%。
  reason: 素材P006（《小说推文精细化运营实操指南》）中，只有作者提到其完播率从40%提升至65-70%，但这是作者对自己多个视频的综合收益描述，并未明确将这一提升归因于某一特定文章或'分手'、'千金'等具体关键词。该论断将结果与特定操作强行关联，属于过度推断，素材中找不到直接支撑。
- location: ch11.5
  claim: 笔者用两篇内容完全相同的同行笔记数据来验证钩子的威力。以下是对比数据：| 笔记 | 点赞数 | 评论数 | 转化逻辑 | |------|--------|--------|----------|
    | 笔记 A | 1980 | 35 | 展示了全部资料内容，用户围观完毕即离开 | | 笔记 B | 500 | 230 | 只展示 4 篇，暗示还有 96
    篇，评论区求分享 |
  reason: 素材P002（《小红书资料号从零到一实操复盘》）中原文为'一个点赞近2000 评论才35，一个点赞500 评论230'，并未提及'笔记A展示全部资料'、'笔记B只展示4篇、暗示96篇'等具体内容。素材中并未明确说明两篇笔记的内容展示方式，此处的对比表格及'转化逻辑'属于作者的推测或演绎，素材中无法找到对应支撑。
- location: ch11.7
  claim: P006（小说推文素材）虽然也强调"关键词说白话"和"评论区造互动"，但其核心是选文和改文，而非简单加字。
  reason: 素材P006中明确将'关键词说白话'、'评论区造互动'作为其完整的精细化运营SOP的一部分，并未进行'核心与加字'的权重比较。书中此论断在素材中找不到直接依据，属于主观推断。
