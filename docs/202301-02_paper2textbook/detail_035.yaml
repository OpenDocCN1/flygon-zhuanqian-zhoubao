    role: origin
  excerpts:
  - 听谁的?听自己的!终究要自己懂底层判断依据:1.流量 2.转化。
  - 所以说好做，说不好做都对，听谁的?听自己的!自己要懂底层判断依据:1.流量 2.转化。
  - 要让其知其所以然。讲不出所以然的，大概率镰刀。
- 'no': 10
  name: 抖音选品发散思维法 —— 把刷视频变成‘挖金矿’
  points:
  - '**为什么需要这个概念？**'
  - '- 闲鱼/闲置/二手/信息差选品最大痛点：‘脑子里没有货’，不知道选什么、从哪找灵感'
  - '- 传统选品工具（5118、百度指数、插件）只能挖掘‘已知需求’，无法发现‘隐性需求/场景需求/新趋势’'
  - '- 短视频内容=真实生活场景的高密度投射，是零成本、高直观、强时效的选品灵感库'
  - '**核心定义**'
  - '- 利用抖音/短视频平台的**算法推荐机制**，通过**有意识的刷视频**，从四个维度发散选品思维：'
  - '  1. **电子代金券搬运**：刷到团购券/代金券视频 → 闲鱼搜同款 → 发现价差/信息差 → 上架倒卖'
  - '  2. **热门影视剧/综艺场景选品**：刷热剧高光片段 → 截取场景道具/同款/衍生品 → 闲鱼/电商搜索验证需求 → 上架测款'
  - '  3. **特定场景视频选品（特别好用）**：刷垂直场景视频（理发店、露营、整理收纳、宠物、母婴） → 场景内所有显性/隐性产品 → 批量挖掘高客单/批发潜力品'
  - '  4. **技能类视频找灵感**：刷手工/改造/技能教学视频 → 关注工具/材料/辅料/半成品 → 发现‘卖铲子/卖课/卖材料包’的B端/C端机会'
  - '**关键性质**'
  - '- **‘场景即需求’**：视频展示的不是孤立产品，是‘人+场景+产品+动作+结果’的完整使用语境，天然包含痛点、卖点、搭配点'
  - '- **‘热点即流量’**：影视/节日/大事件自带百万级曝光，蹭热点选品自带搜索流量爆发期，无需冷启动'
  - '- **‘信息差即利润’**：视频创作者/平台用户大多非卖家，不懂变现；卖家用‘商业视角’二次解码，即获取认知套利收益'
  - '**典型例子**'
  - '- **粒上皇代金券**：刷到团购券视频 → 闲鱼搜‘粒上皇代金券’ → 商家加价转卖 → 妥妥信息差套利'
  - '- **《去有风的地方》保温餐炉**：刷剧见自助餐厅场景 → 闲鱼搜‘保温餐炉/自助餐炉’ → 发现需求旺、可触发批发单'
  - '- **理发店广告视频**：洗头床、置物架、剪发工具、护发素、围布 → 全是‘触发批发单’的B端高客单产品'
  - '- **画兔年灯笼视频**：春节临近 → 闲鱼搜‘兔年灯笼/春节装饰’ → 季节性爆款验证即时生效'
  - '**边界条件**'
  - '- **‘半小时挖十几个’的前提**：具备‘商业敏感度’（能一眼识别‘可卖/可批发/有利润’）+ ‘执行力’（立马搜、立马测、立马上），光刷不动手=娱乐'
  - '- **验证闭环不可省略**：视频里火 ≠ 闲鱼/电商卖得动。必须走‘搜索验证需求→ 供应链验证利润→ 小批量测款→ 数据决定加单’闭环'
  - '- **版权/合规红线**：影视同款/周边涉及版权风险，需区分‘通用款/风格款’（安全）与‘官方授权/Logo款’（高危），新手碰前者不碰后者'
  - '- **平台迁移性**：此法适用于‘内容平台（抖音/小红书/B站/视频号）→ 交易平台（闲鱼/拼多多/亚马逊/独立站）’的跨平台套利，单平台内闭环效果弱'
