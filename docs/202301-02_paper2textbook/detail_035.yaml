  excerpts:
  - '"七分选品，三分运营"？'
  - 我们认为选品就是运营，运营要解决的问题主要就是两个：流量，转化。
  - 好的选品，在确定具体产品的时候，就已经确定引流方法，和转化方法（卖点）。
  - 即好的选品模式，必须把流量和转化，解决一个，或者两个都解决。
- 'no': 8
  name: 追求确定性而非彩票 —— 拒绝‘货找人’的赌博逻辑
  points:
  - '**为什么需要这个概念？**'
  - '- 短视频/直播‘货找人’流量（TikTok、抖音、快手）看似爆发快、门槛低，实则‘大力出奇迹’、极度依赖运气、不可复制、不可积累'
  - '- 新手极易沉迷‘单日爆单’的多巴胺，忽视‘长期稳定盈利’的商业本质，最终沦为平台流量收割的韭菜'
  - '- 需要建立‘确定性思维’：只做能算清账、能复制、能沉淀资产的生意，哪怕慢、哪怕小'
  - '**核心定义**'
  - '- **确定性生意模式**：流量来源可追溯（搜索词/广告位）、转化路径可复现（标准话术/详情页/SOP）、利润结构可测算（成本/费用/净利）、资产可沉淀（品牌/客户/供应链/团队）'
  - '- **彩票模式**：‘货找人’算法推流、靠爆款视频/直播间人气、单品生命周期极短（几天-几周）、无品牌/无复购/无供应链壁垒、核心指标看‘运气’而非‘动作’'
  - '**关键性质**'
  - '- **可控变量 vs 不可控变量**：确定性模式最大化可控变量（选品、供应链、广告、客服），最小化不可控变量（算法推流、平台政策、大主播带货）；彩票模式反之'
  - '- **时间复利**：确定性模式随时间积累优势（品牌权重↑、关键词权重↑、客户资产↑、团队能力↑）；彩票模式随时间资产归零（账号权重清零、粉丝流失、供应链断联）'
  - '- **抗风险能力**：确定性模式可跨平台迁移（亚马逊→独立站→线下）；彩票模式强绑定单一平台算法，一封号/一限流即团灭'
  - '**典型例子**'
  - '- **确定性**：作者亚马逊蓝海选品→搜索流量稳定→广告投放ROI稳定→品牌沉淀→团队复制→年利润稳定增长'
  - '- **彩票**：TikTok‘每天上100个视频、All in赌爆款’、抖音无人直播‘怼量赌爆单’、拼多多‘低价引流赌自然流’ → 作者断言：‘我接触的大卖，没有一个主战场在TK’'
  - '**边界条件**'
  - '- **‘确定性’非‘死板’**：在确定性主航道上，可分配10-20%资源做‘小赌注’测试新平台/新玩法（如TikTok Shop早期红利），但核心资源不倾斜'
  - '- **阶段差异**：0-1阶段为生存，适度‘赌’一下极低成本高爆发机会可接受；1-N阶段为发展，必须建立确定性模型，否则规模化即死'
  - '- **主观确定性陷阱**：很多卖家把‘主观臆断’当‘确定性’（如‘我觉得这产品一定火’），真正的确定性必须有**数据佐证**（搜索量、竞品销量、广告测试ROI）'
  - '...'
  sources:
