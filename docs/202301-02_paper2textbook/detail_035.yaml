  excerpts:
  - 本文将选品从底层往上分为四层：1.套利 2.流量&转化 3.模式 4.品&品类。
  - 本文通过描述一个四步选品范式，来带大家感受一下这个 4 层结构是如何被满足的。
  - 第一步【找蓝海】、第二步【走捷径】、第三步【加光环】、第四步【微创新】
  - 第一步【找蓝海】：蓝海市场、蓝海平台、蓝海产品方向
  - 只要你有选蓝海市场蓝海平台的意识，你就已经超过了 90%跨境小白和新手。
  - 第二步【走捷径】：流量捷径、转化捷径
  - 好的选品，在确定具体产品的时候，就已经确定引流方法，和转化方法（卖点）。
  - 即好的选品模式，必须把流量和转化，解决一个，或者两个都解决。
  - 第三步【加光环】：快速获得品牌力、溢价、复购
  - 第四步【微创新】：获得更长的红利期
- 'no': 7
  name: 选品即运营 —— 打破‘七分选品三分运营’的伪命题
  points:
  - '**为什么需要这个概念？**'
  - '- 传统认知将‘选品’与‘运营’割裂：选品选完甩给运营，运营背锅‘产品不好卖’'
  - '- 导致选品不考虑推广成本、运营不懂产品卖点、团队互甩锅、资源浪费'
  - '- 需要重新定义二者关系：选品**就是**运营的前置环节，运营**是**选品假设的验证环节'
  - '**核心定义**'
  - '- **选品即运营**：好的选品，在确定具体产品时，**就已经确定了引流方法和转化方法（卖点）**。选品模式必须把‘流量’和‘转化’解决一个，或两个都解决'
  - '- 选品四层模型本质：第1层套利（成本结构）→ 第2层流量&转化（商业模式）→ 第3层模式（组织/品牌）→ 第4层品&品类（资产护城河）'
  - '**关键性质**'
  - '- **前置决策**：选品阶段就要想清楚‘靠什么词引流’、‘靠什么卖点转化’、‘靠什么模式复购’，不会做的不选'
  - '- **倒逼供应链**：运营端的流量词/卖点/痛点，反向倒逼供应链端的材质选择/工艺标准/包装设计'
  - '- **验证闭环**：运营实测数据（点击率、转化率、退货率、搜索词报告）→ 反哺下一轮选品方向迭代'
  - '**典型例子**'
  - '- **反面教材**：选了个‘设计感极强但无搜索词、无痛点、客单$50利润$2’的原创包包 → 运营无词可投、无卖点可讲、广告费烧光仍不出单'
  - '- **正面教材**：选定‘真皮平替通勤包’ → 选品时已定：引流词‘真皮包/通勤包/大容量’，卖点‘真皮质感/百搭/价格仅品牌1/5’，模式‘空壳品牌+会员复购’
    → 运营上手即跑'
  - '**边界条件**'
  - '- 并非否定运营技巧的价值：同款产品，强运营比弱运营业绩高3-5倍；但运营无法拯救‘选品逻辑不通’的产品'
  - '- 早期‘选品即运营’偏重流量/转化验证；后期品牌化阶段，运营重心转向用户运营/品牌资产沉淀，选品重心转向产品线规划/护城河建设'
  - '- 团队协作机制：选品人员必须懂运营基础逻辑（搜索原理、广告结构、转化漏斗），运营人员必须参与选品评审会'
  - '...'
  sources:
