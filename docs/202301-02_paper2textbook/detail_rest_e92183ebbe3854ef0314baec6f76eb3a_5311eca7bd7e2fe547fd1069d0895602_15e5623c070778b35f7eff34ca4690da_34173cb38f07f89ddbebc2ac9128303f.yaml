learning_targets:
- 理解搜索流量追热点的底层逻辑，掌握其与推荐流量的核心差异
- 掌握通过下拉词、相关搜索、5118工具挖掘长尾关键词的三种方法
- 学会撰写迎合公众号算法收录的爆款文章，并能设计高点击率的标题
- 理解批量做号矩阵的核心原理，能评估其命中率与风险边界
- 掌握自动回复CTA的配置方法，能设计从内容到变现的承接路径
- 理解母题作为IP护城河的核心概念，能区分其与传统定位的优劣
- 了解内容型IP的五层资产架构与千万级营收模型的构成
- 能根据任务特点选择合适的搜索流量变现方式（流量主/CPS/CPA/泛粉洗粉）
