  - +   [线上美业，不到2万成本到变现过百万](E1WGd70YLoaHGfxAYJTc4WoFnsd.md)
  - +   [初创公司如何科学量化股权分配？股权分配五步法教你不再踩坑！！！](C0dydiFPCoBI3LxemwWcXpdxn2e.md)
