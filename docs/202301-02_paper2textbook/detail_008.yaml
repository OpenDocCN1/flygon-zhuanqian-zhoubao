- 'no': 3
  name: 周期性情报编纂 —— 建立个人的“商业雷达站”
  points:
  - '**为什么需要这个概念？**'
  - '- 单次灵感不可持续，商机发现需要制度化、节奏化的情报收集机制'
  - '- 个人精力有限，无法实时监控全网动态，需建立“低维护、高信噪”的定期扫描流程'
  - '- 将碎片化阅读转化为结构化资产，实现“读过即获、用时即查”'
  - '**核心定义**'
  - '- 以固定周期（如双周/月）为节奏，从公域平台、付费社群、同行案例中采集高价值实操内容'
  - '- 经“筛选→分类→重标题→打标签→汇总发布”五步加工，输出一份可检索的周报文档'
  - '- 核心产出：Markdown格式索引文件（SUMMARY.md）+ 归档原文链接库'
  - '**关键性质**'
  - '- 低成本维护：依赖现有阅读习惯，不需额外采集工程，仅在分享时多做结构化记录'
  - '- 复利效应：单期周报价值有限，但10期、20期积累后形成个人专属的“赛道知识图谱”'
  - '- 双重价值：对外是个人IP展示（专业度背书），对内是决策参考库（选品/选赛道依据）'
  - '**典型例子**'
  - '- “龙哥赚钱周报 202301-02”：覆盖2022.11-2023.02三个月窗口，40篇文章，形成阶段性情报快照'
  - '- 同类实践：生财有术“周报”、各大知识付费社群“精华帖汇总”、独立开发者“周刊”'
  - '**边界条件**'
  - '- 依赖源头质量：若订阅源多为营销号/二手搬运，周报必然“信噪比极低”'
  - '- 缺乏深度分析：周报本质是“目录”，不包含跨案例的横向对比、底层逻辑提炼，需配合专题复盘使用'
  - '- 维护动力：无即时反馈（如订阅数、变现），长期坚持依赖内驱力或外部承诺机制'
  - '**素材溯源**'
  - '- 来源文档：SUMMARY.md（汇编形态与覆盖范围）、20230207_00.md（历史跨度证明）、README.md（品牌标识）'
  - '- 核心依据：文件命名规律（202301-02、20230207_00）揭示的周期性、版本化管理特征'
