learning_targets:
- 理解官方数据源与第三方工具在短视频对标中的差异，掌握以巨量百应创意中心为雷达的对标方法论
- 掌握短视频模板六元素拆解法，能将任意爆款视频转化为可复制的乐高积木
- 理解伪原创二创的底层逻辑，能基于'情、趣、用、品'四象限跨平台取材并合规改造
- 掌握选品即定人群的推导逻辑，能针对特定人群标签筛选垂直需求品
- 理解视频号新号流量扶持机制与视频搬运去重流水线，能独立完成新号冷启动与素材改造
- 掌握混淆元素与随机取用机制，能实现批量视频的差异化和原创化生产
- 理解黑马小达人策略的筛选标准与学习价值，能建立可持续的对标账号库
- 掌握小说推文的核心剧情前置与选文垂直化方法，能将文艺创作转化为标准化SOP
concept_map:
- 短视频爆款内容生产
- ├── 对标方法论
- │   ├── 官方数据源（巨量百应创意中心） —— P001
- │   │   ├── 爆款视频库（实时、分行业）
- │   │   └── 创意搜索（按GMV/关键词筛选）
- │   ├── 黑马小达人策略 —— P001, P008
- │   │   ├── 粉丝5W以下、视频200条以上
- │   │   ├── 围绕垂直品反复带、画面干净
- │   │   └── 低粉高销更具可参考性
- │   └── 脚本模板复用 —— P001
- ├── 模板化拆解
- │   ├── 六元素模型（背景/标题/内容/文案/字幕/BGM） —— P002
- │   ├── 流量视频 vs 带货视频 —— P002, P011
- │   ├── 1比1模仿保底原则 —— P002
- │   └── 底层工具模块抽取 —— P002
- ├── 伪原创二创
- │   ├── 情、趣、用、品四象限 —— P003, P002
- │   │   ├── 情-共情（喜怒哀乐细分人群）
- │   │   ├── 趣-有趣（反差/实验）
- │   │   ├── 用-有用（教学/实用）
- │   │   └── 品-新奇特产品
- │   ├── 跨平台素材库（抖音/快手/知乎/小红书/TK） —— P003
- │   └── 不违规二创（拼接/换音乐） —— P003
- ├── 选品定人群
- │   ├── 人群标签先行（中老年+下沉城市） —— P004
- │   ├── 垂直需求品优先 —— P004
- │   │   ├── 运动锻炼类
- │   │   └── 保养类
- │   └── 通用品不作为第一梯队 —— P004
- ├── 批量生产与去重
- │   ├── 视频搬运去重流水线（放大→翻转→BGM→加字） —— P006
- │   │   └── 加字引导出单 —— P006
- │   ├── 混淆元素与随机取用 —— P002, P007
- │   │   ├── 素材随机取用
- │   │   ├── 时间段随机取用
- │   │   └── 自拍混淆元素
- │   ├── 新号流量扶持（前7天） —— P005
- │   └── RPA批量采集（影刀） —— P001
- └── 小说推文SOP
- ├── 选文垂直化（作者垂直+专栏垂直） —— P010
- ├── 核心剧情前置（提高5s完播率） —— P009
- ├── 改文套路化（关键词提炼+情绪修饰） —— P009
- └── 模板化剪辑（复制草稿统一样式） —— P012
life_analogy:
- 想象短视频内容生产是一个**美食中央厨房**：
- '- **对标方法论** = 参考米其林餐厅的招牌菜榜单，而不是听美食博主空口推荐'
- '- **黑马小达人** = 那些不在榜单上、但小巷里天天排队的苍蝇馆子，更值得偷师'
- '- **六元素拆解** = 一份菜谱可拆为食材、火候、摆盘、酱汁、餐具、背景音乐般的用餐环境'
- '- **伪原创二创** = 把A店的招牌菜换个B店的秘制酱料，端到C店卖，只要不是照抄就能上菜单'
- '- **选品定人群** = 给中老年人开食堂，就要卖养生粥和健步鞋，而不是网红奶茶'
- '- **去重流水线** = 把别人用过的食材换个切法、换口锅、换个盘子，再撒把自家葱花'
- '- **混淆元素** = 每道菜出锅前夹一片自家院子种的香菜，让每盘菜都有一点点''原创''的味道'
- '- **核心剧情前置** = 把小说最精彩的反转写到封面海报上，让路人第一眼就掏钱买书'
- 就像中央厨房需要标准化的菜谱和流水线才能批量出餐，短视频生产也需要模板化和SOP才能规模化放大。
summary:
- concept: 对标方法论
  desc: 以官方实时数据源（巨量百应创意中心）替代滞后第三方工具，以爆款作为学习基准
- concept: 黑马小达人策略
  desc: 优先学习'低粉高销'账号，其内容转化力不依赖粉丝加成，更具参考价值
- concept: 六元素拆解模型
  desc: 所有短视频均可拆为背景、标题、内容、文案、字幕、BGM六个可替换的积木模块
- concept: 流量视频 vs 带货视频
  desc: 内容矩阵分工：流量视频拉曝光打标签，带货视频承接转化
- concept: 伪原创二创
  desc: 以'情、趣、用、品'四象限为底层逻辑，跨平台取材并合规拼接换乐
- concept: 选品即定人群
  desc: 先定义人群标签再推导垂直需求，让用户觉得'我真的需要'而非靠价格取胜
- concept: 新号流量扶持
  desc: 视频号新号前7天有流量倾斜，是快速起量的时间窗口
- concept: 搬运去重流水线
  desc: 固定四步（放大→翻转→BGM→加字）给旧素材换马甲，加字引导是出单关键
- concept: 混淆元素与随机取用
  desc: 通过素材随机、时间段随机和自拍混淆，保证批量视频差异化且过原创
- concept: 核心剧情前置
  desc: 将小说冲突悬念提炼后前置到开头，是提升5s完播率的关键手段
- concept: 选文垂直化
  desc: 作者垂直+专栏垂直双路径获取稳定优质文章来源，强化账号垂直定位
- concept: 批量生产SOP
  desc: 从选文到发布的标准流程，把单条制作时间压缩到15分钟内
exercises:
- 'no': 1
  title: 拆解一条爆款视频：六元素扫描练习
  contents:
  - 在抖音或巨量百应创意中心任选一条近期带货爆款视频（建议选择中医养生或家居品类）：
  - 1. 暂停视频，逐一识别其六元素：背景、标题、内容、文案、字幕、背景音乐
  - 2. 写出每个元素的具体形式（如图片类型、字体风格、音乐流派）
  - 3. 判断该视频属于'流量视频'还是'带货视频'，并说明依据
  - 4. 为每个元素寻找2-3个可替代的相似素材（可在其他平台搜索）
  - 回答问题：
  - '- 该视频的哪个元素对转化贡献最大？为什么？'
  - '- 如果要将该模板迁移到另一个赛道（如美妆），哪些元素需要替换？哪些可以保留？'
- 'no': 2
  title: 设计一套视频搬运去重流水线
  contents:
  - 假设你从快手找到一条卖拖把的带货视频，原视频带讲解、有BGM、有字幕：
  - 1. 按照'放大→翻转→BGM→加字'四步骤，写出每一步的具体操作参数
  - '   - 放大：放大多少比例？是否需要裁剪？'
  - '   - 翻转：左右翻转还是上下翻转？对画面内容有何影响？'
  - '   - BGM：原视频已带BGM，如何处理？（换/变速/加底）'
  - '   - 加字：为这款拖把设计2句不同的引导文字，要求抓住中老年用户心理'
  - 2. 若该视频将被发布到视频号，还需叠加哪些去重手段？
  - 回答问题：
  - '- 为什么''加字''被视为出单关键而非视频本身？'
  - '- 翻转画面可能对观看体验造成什么负面影响？如何规避？'
- 'no': 3
  title: 选品推导：为视频号中老年人群选品
  contents:
  - 给定人群标签：中老年人 + 下沉城市 + 女性为主：
  - 1. 列出该人群的3个核心需求（如身体好、重返青春、打发时间）
  - 2. 针对每个需求，各推荐2个具体的垂直品类（如健步鞋、按摩仪）
  - 3. 说明为什么这些品类'价格不是首要决策因素'
  - 4. 给出1个'通用品'作为反例，并解释为什么它不在第一梯队
  - 回答问题：
  - '- 若该人群对某垂直品的价格敏感度高于预期，应如何调整选品策略？'
  - '- ''选品即定人群''与传统的''选品看销量''有何本质区别？'
- 'no': 4
  title: 设计一套原创视频自动生成规则
  contents:
  - 为一个中医养生赛道设计自动化视频生成方案：
  - 1. 选定一个爆款视频模板，拆解其六元素
  - 2. 为每个元素准备素材池：背景图（至少20张）、内容图（至少15张）、BGM（至少10首）
  - 3. 设计'素材随机取用'规则：描述每轮生成时如何从素材池中随机抽取
  - 4. 设计'时间段随机取用'规则：若模板含多个片段，如何随机截取每个片段的起止时间
  - 5. 设计'混淆元素'方案：准备哪些自拍素材？混入频率和位置如何设定？
  - 回答问题：
  - '- 随机组合可能产生哪些不协调的视频（如古风画面配现代音乐）？如何通过预设规则规避？'
  - '- 若平台审核发现视频素材与已发布视频相似度过高，应如何进一步优化混淆策略？'
