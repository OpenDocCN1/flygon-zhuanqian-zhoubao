life_analogy:
- 想象你是一个**刚开张的小饭馆老板**：
- '- **最小MVP闭环** = 先用一道拿手菜和几张桌椅开张，证明有人愿意付钱吃饭，而不是先贷款装修豪华大厅'
- '- **剥离式拆解** = 把“生意好”这个模糊目标拆成“买菜、洗菜、炒菜、上菜、收钱”等一个个具体动作'
- '- **买卖/生意/商业** = 自己端菜是买卖；招服务员是生意；把菜谱和流程标准化复制开连锁店才是商业'
- '- **OKR** = 把“年底赚到10万”拆成“每月卖500份招牌菜”这样的量化指标'
- '- **矩阵化复制** = 在街角开3家分店，即使一家冷清，另外两家也可能爆满，整体不亏'
- '- **健康扩张** = 先确保一家店盈利稳定，再在同区域开第二家验证可行性，而不是一次性在全国铺100家'
- 就像聪明的老板不会一上来就砸钱开大酒楼，而是先跑通最小模型、拆解流程、建立标准，再一步步复制放大，才能真正做大做强。
summary:
- concept: 最小MVP闭环
  desc: 用最快速度、最低成本跑通“产品—流量—销售—交付”的完整商业循环，哪怕只赚一元钱，作为放大前的验证
- concept: 剥离式拆解
  desc: 将客户最需要的10个大问题各拆解为10个小问题，得到100个可执行的具体行动项，团队精力聚焦于此
- concept: 买卖/生意/商业
  desc: 买卖是出卖劳动力，生意是通过渠道复制赚钱，商业是建立可复制放大的系统模式
- concept: OKR执行
  desc: 战略坚定为底层，KR直接推动O且O可衡量，配以MVP验证最不确定因素和高频同步机制
- concept: 人力资源杠杆
  desc: 花钱雇人处理重复性基础工作，释放自己精力从执行者转变为管理者，建立赚钱杠杆
- concept: 矩阵化复制
  desc: 在保证质量底线的前提下大量发布内容以增加爆单概率，用数量对冲单点不确定性
- concept: 招商加盟四级别
  desc: 按难度分为轻量级（卖技术）、中量级（卖设备）、重量级（卖品牌）、魔鬼级（卖特许权），价值与门槛递增
- concept: 健康扩张三关
  desc: 开放加盟前必须先跑通单店模型、验证区域模型、确保财务模型健康，避免带病扩张
- concept: 股权顶层设计四要素
  desc: 围绕顶层控制权、进入机制（资金/资源/技术差异化进入）、分配机制（静态+动态）、退出机制（约束+回购）展开
- concept: 三会一层
  desc: 股东会、董事会、监事会、高管层四机构权责分离相互制衡，公司经营不善的深层原因多在治理层而非执行层
exercises:
- 'no': 1
  title: 用“最小MVP闭环”评估你身边的项目
  contents:
  - 选择一个你感兴趣的副业项目（如小红书带货、短视频引流、知识付费等）：
  - 1. 画出该项目的“产品—流量—销售—交付”最小闭环
  - 2. 回答以下问题：
  - '- 完成第一单的最小成本和时间是多少？'
  - '- 用什么指标判断该闭环已经“跑通”？（如：第一个付费用户、第一笔100元收入）'
  - '- 该模式是否具备可复制性？放大10倍的瓶颈在哪里（资金/人力/流量/交付）？'
  - '- 评估该项目是否值得放大，给出你的判断依据。'
- 'no': 2
  title: 剥离式拆解：把“月入10万”拆成可执行动作
  contents:
  - 假设你是一名私域运营操盘手，目标是“团队月入10万”：
  - 1. 先定义需要解决的10个大问题（如流量获取、转化提升、复购运营、团队管理等）
  - 2. 选择其中2个大问题，各拆解为10个小问题（共20个）
  - 3. 为每个小问题标注：
  - '- 负责角色（谁来做）'
  - '- 完成标准（做到什么程度算完成）'
  - '- 时间节点（什么时候完成）'
  - 4. 反思：
  - '- 拆解后的问题是否具备可操作性？'
  - '- 哪些问题是高优先级？如何排序取舍？'
- 'no': 3
  title: 判断你的项目属于“买卖、生意还是商业”
  contents:
  - 分析你目前从事的工作或副业：
  - 1. 判断它属于哪一层级：
  - '- 买卖：所有事情都需要自己完成，收入与时间直接挂钩'
  - '- 生意：有团队/渠道/代理帮你卖出产品或服务'
  - '- 商业：建立了可复制放大的标准化模式与系统'
  - 2. 分析：
  - '- 如果目前是“买卖”层级，设计一条向“生意”跃迁的具体路径（哪些事情可以交给别人做？）'
  - '- 如果已是“生意”层级，评估距离“商业”层级的差距在哪里（标准化程度、系统化程度）'
  - '- 这一跃迁过程中最大的障碍是什么？如何克服？'
- 'no': 4
  title: 为你的项目设计OKR
  contents:
  - 选择一个你正在推进的业务目标（如“3个月内私域用户达到1000人”）：
  - 1. 设定1个核心目标（O），确保其具备可衡量标准
  - 2. 分解为3-4个关键结果（KR），验证每个KR是否直接推动O的实现
  - 3. 确定其中最不确定的假设，设计一个最小MVP来验证它
  - 4. 制定执行计划：
  - '- 明确与关键角色的同步频率'
  - '- 设定问题暴露机制（如每周复盘会）、'
  - '- 为每个KR分配负责人和时间节点'
  - 5. 优化：假设团队效率提升50%，你的OKR设计会如何调整？
- 'no': 5
  title: 人力资源杠杆：识别可外包清单
  contents:
  - 回顾你一周的工作时间分配：
  - 1. 列出你本周做的所有事情（越细越好）
  - 2. 对每件事标注类型：
  - '- 高价值决策（如战略规划、客户谈判）'
  - '- 重复性基础工作（如剪辑、客服、排版、数据整理）'
  - '- 成长性学习（如学习新技能）'
  - 3. 从中选出3项可以外包/委托给他人的重复性工作：
  - '- 每项工作外包的预估成本是多少？'
  - '- 外包后节省的时间可以投入到什么更高价值的事情上？'
  - '- 你更倾向于雇兼职还是用工具替代？为什么？'
  - 4. 制定一个30天内的外包落地计划（选人、交接、SOP化）
- 'no': 6
  title: 模拟招商加盟：你的品牌处于哪个级别？
  contents:
  - 假设你想把自己的副业模式做成加盟体系：
  - 1. 判断你最适合的加盟级别：
  - '- 轻量级（卖技术/SEOSOP）：适合起步期，只需整理操作文档和工具包'
  - '- 中量级（卖设备/服务）：适合已有标准化流程，需要总部支持'
  - '- 重量级（卖品牌）：适合已建立品牌势能与口碑'
  - '- 魔鬼级（卖特许权）：适合已有完整体系与品牌资产，可转让继承'
  - 2. 根据级别回答：
  - '- 你的“单店模型”是否已跑通？单店盈利数据是什么？'
  - '- 是否完成了区域模型验证？在哪些区域验证过？'
  - '- 你的财务模型是否健康（毛利率、回本周期、复购率）？'
  - '- 该加盟模式的运营复杂度和风险如何评估？'
  - 3. 制定一个从当前级别向上跃迁的路径规划。
- 'no': 7
  title: 股权设计模拟：为你的团队分配股权
  contents:
  - 假设你与2位合伙人共同创立一家公司：
  - 1. 根据四要素设计股权框架：
  - '- 顶层控制权：谁应拥有控制权？理由是什么？'
  - '- 进入机制：三位股东分别以什么方式进入（资金/资源/技术/全职操盘）？各占多少初始比例？'
  - '- 分配机制：设计静态分配比例 + 动态调整规则（如里程碑达成后的股权调整）'
  - '- 退出机制：约定退出时间限制、回购原则和回购价格计算方式'
  - 2. 画出三会一层的治理框架图
  - 3. 反思：
  - '- 你的设计如何避免“合伙拆伙”的常见坑？'
  - '- 是否存在“前期重要程度判断不一致”的风险？如何通过自评互评达成共识？'
  - '- 还需要哪些配套法律文件（公司章程、一致行动协议等）？'
