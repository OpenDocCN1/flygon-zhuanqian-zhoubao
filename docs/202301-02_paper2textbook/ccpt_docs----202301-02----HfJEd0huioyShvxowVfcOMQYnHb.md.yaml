desc: 该素材是一篇面向自媒体新手的内容运营与销售心理指导文章，主题是破除'不敢打广告'和'打完广告不出单就自闭'两类心理卡点。文章提出不敢打广告的三个根源（对所卖产品价值不够认可、对人际关系理解不到位、对广告本身理解不到位），并将'打广告'的本质界定为'放大'与'筛选'；同时针对打广告后无成交的挫败感，提出四步排查法（检查用户是否精准、检查文案、检查前期铺垫、理解道路曲折并持续努力），主张用'精准鱼塘'、'前置价值输出与信任建立'、'有间隔的重复次数'等理念来化解心理障碍。素材为个人经验型指导文，非学术研究。
concepts:
- name: 打广告的“放大与筛选”本质
  desc: 打广告这一动作的本质是放大与筛选：放大喜欢你的人对你的理解和认可，也放大不喜欢你的人对你的反感；筛选出愿意靠近你、购买产品的客户，剔除无关人员。
  is_original: true
  excerpt:
  - 打广告这动作，本质是一种「放大」和「筛选」。
  - 让喜欢你的人，更深入的理解你在做的事情，更明白你的能力和价值。喜欢你的人，更喜欢你；不喜欢你的人，更烦你。此为「放大」。
  - 喜欢你的人，觉得你的广告，是一个能更好的了解你的窗口，了解完之后，他们会靠近你，购买你的产品，成为你的客户。不喜欢你的人，觉得你打广告，是又想让他掏钱了，你又打扰他了，看完后更烦你，然后屏蔽你、删除你、拉黑你。此为筛选。
- name: 人际关系四象限分类（价值交换理论）
  desc: 将微信好友按'是否有感情/是否产生价值交换'分为四类：需要顾及感受的（亲朋好友、领导同事合作方）与无需顾及感受的（不点赞、不评论、不聊天、不掏钱、无任何价值交换的泛泛之好友），据此决定广告是否分组可见或删好友。
  is_original: true
  excerpt:
  - 要照顾感受的那批人，是第4象限的那批人。是你的亲朋好友，以及你的领导同事合作方（如果你有主业，在宣传你的副业的话）。这些人，你早晚要见面，抬头不见低头见的，所以要顾及他们对你的看法，避免被他们讨厌。
  - 但是像第2象限的那批人，你在网上加到的好友，平时也不交流，也不见他给你朋友圈、推文点赞评论，不和你产生知识、情绪上的价值交换，那他们除了给你掏钱，和你发生金钱关系外，对你而言，其实也没有别的价值了。
  - 这里再强调一次，我说的这波人是：不点赞、不评论、不聊天、不掏钱，与你在知识、情绪、金钱上没有任何价值交换的人。而不是说，不付费的人，就都该删掉。
- name: 优质软广与垃圾硬广的区分
  desc: 区分了观众讨厌的广告形态（自嗨自夸、制造不买危害、贩卖焦虑、刷屏、不输出价值的垃圾广告）与可接受的软广形态（有趣、适度激发梦想、克制、依据真实好评、提供价值），主张要讨厌的是垃圾广告而非打广告本身。
  is_original: true
  excerpt:
  - 我们讨厌的广告，是那种不考虑观众的感受，光自卖自夸，还凭空制造一些不买的危害，暗示你不卖你就是蠢蛋，那种自嗨+夸大宣传+贩卖焦虑+刷屏+不输出价值的垃圾广告。
  - 而那种：有趣的/适度正能量激发梦想的/克制的/根据真实好评的/提供价值的软广，对于多数人来说，哪怕谈不上喜欢，至少也是不会讨厌的。
  - 你要讨厌的不是打广告这件事，而是应该讨厌打垃圾广告。
- name: 成交前的信任积累（有间隔的重复次数）
  desc: 成交依赖于前期持续的价值输出、个性展现与信任建立，且本质上取决于'有间隔的重复次数'——不同的人需要多次（3次、10次、30天、100天）被你触动后才会买单，广告只是临门一脚。
  is_original: true
  excerpt:
  - 打广告，是成交前的最后一步，而不是唯一的步骤！在打广告之前，还有：价值输出、个性展现、信任建立...
  - 我发现，打动别人，让人下单这事，除了强度之外，还有【有间隔的重复次数】。
  - 有些人会在认识你的第一天就买单。而有些人会在第10天、第30天、第50天、第100天...第N次看到你的干货，看到你的生活，了解你这人的性格、三观，第N次被你触动后，才会买单的。
methods:
- name: __overview__：破除'不敢打广告'与'出单自闭'的认知失调三步法
  desc: 整体方法论分两阶段：先是破认知（认可产品价值、理解人际关系四象限、理解广告本质为放大筛选），后是破心态（打完广告不出单时，依次检查用户精准度、检查文案、检查前期铺垫、理解道路曲折并持续努力）。
  excerpt:
  - 看到大家对于打广告这块，是有挺多问题的，那我这个过来人，就来分享一下，如何破除打广告的一些认知和心态的卡点吧~
  - 一、为什么你不敢打广告？ 我觉得这个原因有三。 1）你对所卖产品的价值不够认可 2）你对于「人际」的理解不到位 3）你对于「广告」的理解不到位
  - 二、打广告之后没成交，感觉挫败怎么办？ 1）检查用户有没有问题 2）检查文案有没有问题 3）检查前期铺垫有没有问题 4）理解道路的曲折，持续努力
- name: 精准用户排查法（鱼塘钓鱼类比）
  desc: 用'养牛场里钓鱼'的类比指引排查：打完广告没成交时，先判断自己的用户池是否为精准'鱼塘'，而非随缘积累的'动物园'（牛、羊、长颈鹿等非目标用户）；若池子不精准则不能据此怀疑自己的能力。
  excerpt:
  - 你现在的精准人群，他们的类型是【鱼】，但你以前从各种场合积累下来的，都是些【牛】【羊】【长颈鹿】【犀牛】【狮子】... 2000好友里，就没有几只你要的【鱼】。钓不到鱼，那不是再正常不过了吗？
  - 所以呀，当你发现你没钓上几只鱼时，你要想的第一件事，不是怀疑自己，而是思考思考，自己到底是在鱼塘，还是动物园。要检验自己的钓鱼技术如何，得去鱼塘，才能检验出来呀。
- name: 广告文案自查清单法
  desc: 当拿到目标受众仍无成交时，通过复盘产品讲清楚没有、初心、价值点、使用场景、包含范围、适合人群、价格、服务期、交付方式、信任背书、好评素材等细节，来检验文案与价值感传递是否到位。
  excerpt:
  - 打广告的时候，得想想：你的产品讲清楚没有？你为什么要做这个产品，初心是什么？这东西的价值点在哪，用于哪些场景，解决哪些问题？产品服务包含什么，不包含什么？适合哪些人买，哪些人不适合买？价格多少？服务期多长？用哪些平台/工具/方式做交付？......
  - 东西讲清楚了，价值感传递的够不够？现在有多少人买你东西了？买了你东西的人，都有哪些进步？有什么实打实的收益？买了你东西的人，对你的产品服务是怎样评价的？有没有哪些圈内大咖帮你做信任背书，为你站台？......
- name: 前期铺垫自查法（价值输出前置）
  desc: 对照检查在打广告前是否已做了足够的价值文章输出、朋友圈生活分享、活动和交流互动等信任铺垫，若铺垫不足，则没出单可按'付出不够'而坦然接受。
  excerpt:
  - 在打广告之前，还需要输出N篇有价值的文章，写N篇生活分享的朋友圈，N次参加活动，和大家交流互动建立信任。最后才是打广告，完成这临门一脚，开单。
  - 打了广告不出单的时候，回顾一下自己的前期努力做了多少？想想自己付出的其实还不够多，那没有回报，其实也能心甘情愿的接受了。
theorems:
- name: 不打广告则无法吸引客户（打扰与吸引不可兼得的本末倒置批判）
  desc: 对于无关人员是'打扰'的东西，对于你的客户恰是'吸引'；若因照顾无关人员观感而不打广告，等于舍弃真正的支持者，是本末倒置。
  excerpt:
  - 对于【无关人员】来说是【打扰】的东西，对于【你的客户】来说是一种【吸引】。如果你不打广告，不去【打扰】无关人员，那么同样的，你就没法【吸引】你的客户。
  - 为了照顾【无关人员】的观感，而舍弃掉了【真正的支持者】，这不是本末倒置吗？
- name: 酒香也怕巷子深：好东西应大方宣传
  desc: 优质、真实、有价值的产品应当主动传播，不必含羞藏掖，宣传本身就是为世界做贡献。
  excerpt:
  - 酒香也怕巷子深呀，你卖的是个好东西，何必藏着掖着呢？大方宣传，让好东西传播出去，为世界做贡献才对嘛。
- name: 成交从众慕强与实力逆袭论
  desc: 人类骨子里从众慕强，早期围观者因你弱小（10个付费用户时）而笑话你，随着销量逐步增长（50、100、300、500、上千份）及产品迭代、大咖背书，质疑者会陆续被拿下；应对挫败的出路是持续努力拿到成果。
  excerpt:
  - 人类的骨子里，都是从众和慕强的。当你的产品只有10个付费用户的，某些围观群众会在心里笑你...当你卖了50个人了，他们会被震惊一下...当你卖了100人了，他们再震惊一下，不得不承认你有点本事了...当你卖了300人了...他们中的一些人，就开始动摇了...
  - 你要做的，就是继续努力，坚持宣传。自己在各种事情上拿到成果，自己卖的产品销量越来越高。以前怀疑你的那批人，迟早会被你拿下的。
findings:
- name: 打广告没成交往往源于用户池不精准而非能力不足
  desc: '[evidence] 素材通过''养牛场钓鱼''类比和''2000个随缘好友多为牛羊''的案例说明：新手在非精准（泛泛）用户池中打广告无成交属正常现象，不能据此判定自身能力与魅力有问题。'
  excerpt:
  - 比如说你有一个2000好友的微信号，里面都是你从小到大加到的同学、亲人、同事，都是你因为各种机缘巧合，随缘积攒下来的好友...现在你开始有个自己的业务了...你发现没有成交，就很怀疑自己的能力和魅力...这不就是，在养牛场里没有钓到鱼，然后怀疑自己吗...
  - 你现在的精准人群，他们的类型是【鱼】，但你以前从各种场合积累下来的，都是些【牛】【羊】【长颈鹿】【犀牛】【狮子】... 2000好友里，就没有几只你要的【鱼】。钓不到鱼，那不是再正常不过了吗？
- name: 有间隔的重复触动才能促成转化
  desc: '[evidence] 素材以作者自身经历为案例：虽有3篇精彩代表作，新朋友看过之后仍不买单，需继续刷十几篇唠嗑短文才触成下单；并据与用户交流归纳出''有人第一次觉得你牛逼就买单，有人需3/5/10次或第10/30/50/100天被触动才买单''这一转化节奏。'
  excerpt:
  - 以我为例，原本我以为，我已经有几篇很精彩的代表作了，一些新朋友加过来，看了我3篇大作，应该就能买单了。但实际上，我发现不完全是这样的。也有很多朋友，是看了我几篇大作后初步了解了我，但仍对我的产品无动于衷。后来又刷了我十几篇唠嗑短文后，才来找我下单的。
  - 有些人是在第一次觉得你真牛逼的时候，就会买单的。而有些人需要3次、5次、10次，觉得你牛逼，才会买单。有些人，是觉得你牛逼就买单了。而有些人，是知道你厉害还不够，还要在朋友圈中看到你的生活，了解你的为人后，才会买单的。
- name: 销量增长与产品迭代可逐步拿下质疑者
  desc: '[claim] 素材宣称（非数据支撑）随着销量从10到50到100到300到500到上千份的增长、产品多版本迭代及大咖背书，原本从众慕强的围观人群会从笑话、质疑逐步转为动摇、付费甚至后悔没早''上车''，最终演出一出逆袭故事。'
  excerpt:
  - 当你卖了300人了，产品也迭代了两三个版本，像模像样了。同时你也得到圈内一些大佬的认可夸赞了，有些大佬背书了。他们中的一些人，就开始动摇了：卧槽，当初是我小看你了，现在再不上车，再晚之后就跟不上了。于是为你付费了。
  - 当你了500份了...又一批嘴硬的人坐不住了，被你拿下了。而还有一些人，继续嘴硬，不承认你。等到你卖了上千份了...这时他们会垂头丧气，感慨：开始看不见你，后来看见了但看不起你，再然后承认你有点本事了但还不是完全信你，等到完全信你的时候已经追不上你了...
