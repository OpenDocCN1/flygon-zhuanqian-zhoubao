  name: 产品定位五维拆解 —— 做菜前先定菜系
  points:
  - '**为什么需要这个概念？**'
  - '- 开发新项目时，很多人凭感觉照搬模仿，缺乏系统分析'
  - '- 盲目照搬容易水土不服，无法本地化'
