  name: 不把鸡蛋放一个篮子里 —— 保住基本盘
  points:
  - '**为什么需要这个概念？**'
  - '- 依赖单一收入渠道风险极高，一旦外部环境变化（如广告市场下滑），收入会断崖式下跌'
  - '- 很多博主/创业者All in单一平台或单一变现方式，抗风险能力极弱'
  - '- 需要有基本盘思维，构建多元化的收入结构'
