  - 因为原来依赖的单一广告收入渠道下滑，甚至没了，不得不停更。为爱发电的少，人人都要吃饭，长期也亏不起。
  - 2024年一年都没有广告，不是没有广告找，是不感兴趣。自身业务就够吃了，当然有个现状是品牌投广告的越来越少，很多是直接投到直播间了，要产出。
