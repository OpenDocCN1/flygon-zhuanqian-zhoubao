  - 1）睡播的产品定位是什么？2）睡播的用户群体是谁？3）如何给用户带来价值 4）竞对在哪里？5）如何本地化
- 'no': 9
  name: 截流开店 —— 蹭竞争对手的势
  points:
  - '**为什么需要这个概念？**'
  - '- 线下获客成本高，从零开始聚拢客流难度大、周期长'
  - '- 竞争对手已经通过长期经营积累了稳定客流，直接''借''比''造''更高效'
  - '- 需要一种低成本、精准的线下引流策略'
  - '**核心定义**'
  - '- 蹭流截流开店：将店开在传统中介店隔壁，利用对方门店的自然客流，以具有吸引力的差异化门头标语（如''0中介费''）截流用户，只做引流和转化'
  - '**关键性质**'
  - '- 低成本：无需自己引流，借用对方客流'
  - '- 精准性：过往客户均是精准的目标用户'
  - '- 强对比：门头标语直接对比，凸显自身优势'
  - '**典型例子**'
  - '- 胖龟找房在洛阳涧西区销售冠军中介店隔壁开''0中介费''门店，截流大量顾客，导致对标门店销售额接连下降，店员不敢带客到店洽谈'
  - '**边界条件**'
  - '- 竞对门店需有足够的客流支撑，否则截流效果有限'
  - '- 需要自身有显著差异化优势（如真的0中介费）'
  - '- 注意商业伦理和潜在的法律纠纷风险'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 传统的中介店会有大量的客户到店，我们只需要在隔壁开一家小店，很小的一家店，就会有源源不断的客流通过我们店铺门前。只用做好引流跟转化就行了。
  - 用互联网的专有名词，就是蹭，蹭其他中介的流量，然后通过我们的门头标语：买二手房，租房，"0"中介费。来吸引用户到店，以达到截流的目的。
  - 我们在这个店的隔壁开了一家店，门头就是“0 中介费”。自从开了店以后，截流隔壁门店好多顾客，导致这家门店销售额接连下降，店员也不敢带顾客去店里面谈了。
