  - 5.1 多看。看尽天下电影，心中自然无马。国内的直播和国外的直播都要看，很多国内的玩法老外都不吃。
  - 5.2 多拆解。拆多了，看到一个直播间，大体就知道怎么玩了。
- 'no': 6
  name: 风口周期判断 —— 在'高流量低商业化'阶段入场
  points:
  - '**为什么需要这个概念？**'
  - '- 同样的项目，不同时期进入，结果截然不同'
  - '- 在平台成熟期进入，竞争激烈、流量昂贵，很难做出成绩'
  - '- 需要建立对平台和行业周期的判断力，在窗口期入场'
  - '**核心定义**'
  - '- 平台发展遵循''高流量低商业化''（早期）到''低流量高商业化''（成熟期）的演进路径'
  - '- 在平台早期高流量低商业化阶段入场，是普通人最轻松的切入窗口'
  - '**关键性质**'
  - '- 窗口期：早期阶段竞争小、流量便宜，机会窗口有限'
  - '- 可预测：参照国内抖音、映客花椒的发展路径，可预判TikTok等新兴平台的演化节奏'
  - '- 非持久：窗口期通常持续约2年左右，之后竞争加剧'
  - '**典型例子**'
  - '- 老杨判断TikTok处于类似抖音早期的''高流量低商业化''阶段，主攻娱乐直播（睡播），单小时均100美金、峰值在线4.2万，验证了窗口期的价值'
  - '**边界条件**'
  - '- 平台政策变化可能加速或延长窗口期，需持续关注'
  - '- 窗口期入场仍需好的项目和执行，并非躺赚'
  - '- 不同赛道的窗口期长短不同'
  sources:
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: origin
  excerpts:
  - 回观抖音的发展路径，第一阶段就是高流量低商业化阶段，这时候要做的并不一定要跟平台的指向，而是要看清平台的现状。
  - 按照抖音、映客花椒的发展路线图，初级阶段娱乐直播至少可以做2年的时间，在这段时间里面，不需要对某个项目进行深度的运营和挖掘，就可以赚到一桶金。
  - 对于大部分想要在tiktok上赚到钱的小伙伴，娱乐直播是最简单也是最容易拿到结果的方向。
- 'no': 7
  name: 项目生命周期管理 —— 让多个灶台同时开火
  points:
  - '**为什么需要这个概念？**'
  - '- 任何项目都有生命周期，内容同质化或平台管控会使其衰退'
  - '- 单一项目收入不稳定，一旦衰退则整体收入归零'
  - '- 需要建立持续造血的项目组合，而非依赖单一项目'
  - '**核心定义**'
  - '- 项目生命周期理论：所有娱乐直播（及多数互联网）项目在无升级情况下生命周期约2-6个月，因此必须具备项目开发运营能力以不断升级迭代'
  - '- ''1+1+1''项目矩阵：1个在盈利、1个在开发、1个做知识付费，实现现金流、储备、溢价的良性循环'
  - '**关键性质**'
  - '- 有限性：项目有明确的生命周期，需预见性管理'
  - '- 可复制性：新项目开发需可复制、快速执行，以持续迭代'
  - '- 组合效应：多个项目并行，降低单一项目衰退的风险'
  - '**典型例子**'
  - '- 老杨为娱乐直播项目设计''1+1+1矩阵''：1个在盈利（睡播）、1个在开发（新玩法）、1个做知识付费（卖课/方案），实现持续造血'
  - '**边界条件**'
  - '- 项目矩阵需考虑团队精力与资源分配，避免摊子过大'
  - '- 并非所有项目都只有2-6个月生命周期，需结合行业判断'
  - '- 知识付费需有真材实料，才能持续运转'
  sources:
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: origin
  excerpts:
  - 有模式，我称之为1+1+1，1个在盈利，1个在开发，1个在知识付费
  - 同一个项目在不升级的情况下生命周期从2-6个月不等，所以在开发项目时必须要可复制，快速执行，门槛能有多高拔多高，不过也要看自己的人员配备现状。
  - 因为所有的项目都会有内容同质化或者平台管控的时候，这个时候没有项目开发运营能力，就不能升级项目，不能开发新项目，结果就被淘汰。
