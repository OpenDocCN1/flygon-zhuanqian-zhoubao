unsupported_claims:
- location: '8.13'
  claim: 做商品的门槛低、复制快，但同质化严重，竞争激烈。素材 P046 明确指出，纯做商品视频“成功概率太小”，且头部玩家已开始付费投放，散户单打独斗难以取胜。做人群的门槛较高，需要内容创作能力，但一旦建立人群认知，流量获取成本远低于商品赛道。
  reason: 书中称此段后半部分为‘推断性结论’，但前半部分关于‘做商品门槛低’本身也非素材明确表述，且素材原文未提及‘一体机账号成本低、复制快’等说法。
- location: '8.13'
  claim: 如果你能在商品赛道做到差异化（如独家货源、极致性价比），可以做商品；如果你没有这些优势，做人群是更稳妥的突围路径。
  reason: 书中自行标注此判断为‘推断性结论’，素材P046与P012均未给出此决策条件。
- location: '8.12'
  claim: 竹庐拓艺的直播间1小时场观500人，但千次成交4000-6000GMV，高的时候1-2万。抖音客单价1000-1200元，单一平台年销售额几百万。
  reason: 书名中引用了相关性数据，但并非素材原文直接包含，来自‘线上做的不久，只有抖音一个平台，销售额几百万左右，抖音客单价1000-1200左右’等句，与多数细节一致，但‘1小时场观500人’未在素材中直接出现。
- location: '8.3'
  claim: “同样的减肥粉，别人设计好了完善的变现体系，一个客户可以贡献1000块的毛利，而你只能做到500块...”用于支撑后端变现效率公式，且书中称“作者随后给出了更具体的对比场景”。
  reason: 该段落为书中直接引用来源，但因未标注，直接列为“声称来自素材”存在透明度风险。
