units:
- 'no': 1
  name: 内在比赛理论 —— 自我二决定你能走多远
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人有技术、有资源、有勤奋，却始终做不成事，核心卡在潜意识不认可目标'
  - '- 外在比赛（业绩、收入）的成败，实则由内在比赛（潜意识信念）决定'
  - '- 李宗伟技术不输林丹，却屡败；老虎伍兹技术未退步，却跌出前百，皆因输掉内在比赛'
  - '**核心定义**'
  - '- 自我一：理性/一般自我，爱分析、评判、发号施令'
  - '- 自我二：感性/潜意识，掌握肌肉记忆、直觉、真实信念体系'
  - '- 内在比赛：自我一与自我二的博弈，核心是自我二是否真心认可目标'
  - '- 外在比赛：现实世界的业绩竞争，结果受内在比赛支配'
  - '**关键性质**'
  - '- 决定论：一旦输掉内在比赛，外在比赛必输，无法靠战术勤奋弥补战略信念缺失'
  - '- 非理性：自我二不讲逻辑，只认“成功体验”和“身份认同”，不认“大道理”'
  - '- 可训练：可通过唤醒成功体验、俯视学习法主动重塑自我二的信念'
  - '**典型例子**'
  - '- 李宗伟vs林丹：37次交手输25次，技术不分伯仲，败在潜意识不信能赢'
  - '- 老虎伍兹：性丑闻后两个月丢世界第一，几年跌出前百，核心是失去“不可战胜”的潜意识信念'
  - '- 优秀推销员：每天先推易卖产品制造“小赢”，唤醒潜意识自信，再攻硬骨头'
  - '**边界条件**'
  - '- 盲目自信≠盲目冲动：需建立在“已验证的能力圈”内，否则是幻觉非信念'
  - '- 无法替代技能：内在比赛赢了只能发挥真实水平，不能让外行打赢专家'
  - '- 环境剧变失效：如海水干涸，最强的鱼也会死，需配合进化论式适应环境'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  excerpts:
  - 人，有两个自我，分别是自我一、自我二。自我一，对应着理性，是一般意义上的自我。自我二，对应着感性，或者说对应着潜意识。
  - 任何一个比赛，实际上是同时进行的两场比赛，内在比赛和外在比赛。内在比赛，也就是英文书名里的'Inner Game'，这是最容易被人忽视的。
  - 人们往往容易忽略的是，如果自我二（也就是潜意识），并不认可这个目标的时候，会输掉内在比赛。一旦输掉内部比赛，外在比赛也会输。
  - 他不是输给了林丹，他是输给了自己。
  - 失败不是成功之母，成功才是成功之母。我一个成功体验，推动一个又一个的成功体验。
- 'no': 2
  name: 盲目自信与唤醒成功体验 —— 给潜意识装配“必胜信念”
  points:
  - '**为什么需要这个概念？**'
  - '- 创业充满不确定性，理性分析往往导致犹豫、恐惧，自我一会拖自我二后腿'
  - '- 潜意识（自我二）只认“成功过”，不认“理论上能行”，必须喂给它确定性证据'
  - '- 普通人缺乏大成就，需用“微小成功”拼凑“必胜信念”'
  - '**核心定义**'
  - '- 盲目自信：在能力圈内，对自己能搞定目标的无条件信任，是创业者的理性选择'
  - '- 唤醒成功体验法：回顾/制造过往成功经历，激活潜意识中的“赢家身份”，作为新挑战的心理燃料'
  - '- 俯视学习法：战略上藐视（我是国王看奏折），战术上重视（跪着把细节学透）'
  - '**关键性质**'
  - '- 正向循环：成功体验→自信→行动更果敢→更大成功→更强体验'
  - '- 逆向工程：没有现成大成功，就用“先卖易卖品”、“先攻简单关”制造小成功'
  - '- 身份锚定：一旦自我二认同“我是搞X的高手”，会自动过滤干扰、调动资源'
  - '**典型例子**'
  - '- 优秀推销员：每天先找优质客户/推易卖品，制造“开门红”体验，带动全天状态'
  - '- 作者建议：做新事前回顾“曾搞定过比这难的事”，唤醒潜意识“舍我其谁”'
  - '- 俯视学习：看付费社群帖子当“奏折”，心态是“朕心甚悦，但朕是国王”，而非跪着求教'
  - '**边界条件**'
  - '- 仅限能力圈内：不懂芯片设计却盲目自信造芯片，是妄想非自信'
  - '- 需配合“进化论”：环境变了（如海水干涸），原有信念失效，需进化出新肺（新能力/新模式)'
  - '- 避免幸存者偏差：只复盘成功不复盘失败，会让自我二积累虚假无敌感'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  excerpts:
  - 一言以蔽之：你需要盲目的自信。因为盲目的自信和乐观，是创业者的理性选择。
  - 这样'舍我其谁''在我的领域，我就是国王'的心态，才是创业者真正需要的心态！
  - 当自己内心很怂、不自信的时候，你需要回顾下自己成功的经历，唤醒自己的成功体验。
  - 比如，一些优秀的推销员，在开展一天的工作时，会先去找一些优质的客户，或者推销一些容易卖的产品，通过这种方式去制造成功体验。
  - 我的答案是：别跪着学！要俯视！你就是国王，把生财有术的帖子，当成奏折来看。
  - 毛主席说，战略上藐视敌人，战术上重视敌人。跪着学生财有术的人，打不赢内在比赛。
- 'no': 3
  name: 确定性窗口期 —— 用数据推演“春天在哪里”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人创业最怕“赌运气”，需要找到确定性高的时间窗口集中火力'
  - '- 宏观周期（疫情、政策、技术爆发）决定了流量、需求、竞争的大基调'
  - '- 错过窗口期=放弃全年最重要机会，如2023春天错过则等下一轮周期'
  - '**核心定义**'
  - '- 确定性窗口期：通过类比推演（香港疫情数据→大陆），判断出的宏观环境相对稳定、需求集中释放、竞争尚未白热化的黄金期'
  - '- 核心判断：首轮大感染后2-3个月平稳期→第二波来临前，是确定性窗口'
  - '- 2023春天：作者判定的全年最重要3个月窗口期，主张“先干个春天再说”'
  - '**关键性质**'
  - '- 类比推演：用相似体系（香港）的历史轨迹，预测目标体系（大陆）的未来'
  - '- 红利递减：窗口期内越早入场红利越大，平稳期结束红利归零甚至变负'
  - '- 多行业共振：窗口期往往催生旅游、健康、餐饮等多个确定性赛道同时爆发'
  - '**典型例子**'
  - '- 香港疫情类比：首轮感染8-9成→2-3个月平静→第二波维持5-6个月感染率减半'
  - '- 2023春节旅游：国内3亿人次恢复88.6%，出境机票涨258%，入境涨632%，酒店涨177%'
  - '- 健康带货：诺特兰德维生素连续两月抖音单品销量第一，多品牌销量过亿'
  - '**边界条件**'
  - '- 仅适用“确定性”判断：不可用于技术突破型、政策突变型不可预测赛道'
  - '- 窗口期≠躺赢：仍需选对赛道、跑通模型、组建团队，窗口只给“风向”不给“风力”'
  - '- 二次感染风险：平稳期结束后流量成本暴涨、转化率下降，需提前布局私域沉淀'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 最近 3~6 个月，是比较确定的疫情平稳期，之后才会迎来第二波疫情的峰值。
  - 香港跟大陆一样，也是第一次大规模疫情感染，就把八九成的居民给感染了。之后香港就进入了 2~3 个月的平静期，平静期之后就进入第二波疫情感染。
  - 至少 2023 年的春天，会是一个比较确定的稳定期。
  - 因为这个春天，可能是今年最重要的 3 个月窗口期。反正我相信春天来了，先干个春天再说。
  - 如果你本身不是干旅游行业的，但是又想分一杯羹，怎么办？最简单的就是做分销，可以做机票、酒店、旅游景点等等之类的分销。
  - 而健康行业，普通人最适合的切口，是保健养生带货。
- 'no': 4
  name: 增长瓶颈怪圈与价值创造视角 —— 别让目标绑架了你
  points:
  - '**为什么需要这个概念？**'
  - '- 企业/个人越想增长、越焦虑、越投机、越计算利弊、越抓取资源，反而离增长越远'
  - '- 根因：被“想拥有的增长”绑架，丧失了面向未来、面向用户、积累价值的三种勇气'
  - '- 表现：面向过去（用旧地图找新路）、计算利弊（不关注用户）、抓取资源（不积累品牌/信任）'
  - '**核心定义**'
  - '- 增长瓶颈怪圈：被增长预期绑架→投机跟风/压榨自己/计算利弊→失去优势→更焦虑→更投机'
  - '- 价值创造视角：从“我如何得到增长”切换为“我如何成为值得被奖赏增长的人”'
  - '- 三种勇气：面向未来而非过去、面向用户而非计算利弊、积累价值而非抓取资源'
  - '**关键性质**'
  - '- 视角重构：转化看待问题的方式，比解决问题本身更关键'
  - '- 稀缺资产导向：识别环境中“最稀缺、最不流动”的资产（品牌、数据、人才、信任）并积累'
  - '- 复盘双轨：除问“坚持什么走到今天”，必问“抓住什么机会/打破什么惯例走到今天”'
  - '**典型例子**'
  - '- 柯达：自认成功源于“坚持高品质”，实则源于“开发低价便捷相机”，用过去定义自己错失数码趋势'
  - '- 宜家：对标者学其“多品类体验店”提高停留时长，忽略其本质是解决“陌生城市一天拥有一家”'
  - '- 茅台：八项规定后中高端白酒降价砸牌，茅台守住“品牌心智”这一不流动稀缺资产'
  - '- 九子夺嫡（四爷）：“争是不争，不争是争”，从争权视角转贡献视角，最终获胜'
  - '**边界条件**'
  - '- 需有“面向未来”的基本判断力：盲目乐观非面向未来，需洞察趋势势能'
  - '- 非否定目标：目标是战略的对象/结果，非战略本身；无目标无导向，执着目标误入歧途'
  - '- 积累价值≠不赚钱：积累品牌/信任/数据是为了更高维度、更长周期的变现能力'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 进入增长瓶颈的一个典型现象，就是越想要增长，却距离想要的增长越远。
  - 如果用一句话来形容这种现象，那就是我们被我们想拥有的东西绑架了。
  - 我发现，破除增长焦虑唯一的方法，就是怎么从追求增长的视角，切换成价值创造的视角。
  - 从一个'我如何得到增长'，变成'我如何成为一个值得被奖赏增长的人'。
  - 真正要去摆脱这种视角，最难的不在于方法论，而是 3 种'勇气'：面向未来而非面向过去的勇气；面向用户而非计算利弊的勇气；积累价值而非抓取资源的勇气。
  - 实际上，这也是一个奇怪的现象，我们花费了太多的精力去抓住无限的、流动的东西，而非关注真正稀缺的、不变的东西。
  - 对一个品牌来说，销售额几乎是无限的而且每年都在改变，但是用户对你高端品牌的心智是稀缺的。
  - 柯达认为自己成功的重要法门是坚持成像的品质和性能……它最初成功的法门并不是高品质，而是抓住技术趋势开发适合更多人群的便捷性产品。
  - 邬思道提出了违反共识却真正行之有效的关键战略，只有八个字'争是不争，不争是争'。
- 'no': 5
  name: 战略三要素与强加成本战略 —— 用优势逼死对手
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人把“定目标”当“定战略”，导致战略成了口号，无法指导具体取舍'
  - '- 资源有限时，必须通过战略指导原则，把优势转化为对手的负担，实现以弱胜强'
  - '- 战略本质是“选择不做什么”，并发挥禀赋（劣势不能做战略方向）'
  - '**核心定义**'
  - '- 战略三要素：1)目的：获得相对优势；2)形式：自始至终的指导原则；3)基础：发挥禀赋（优势）'
  - '- 强加成本战略：利用自身优势，迫使对手不得不持续投入高昂成本应对，拖垮其经济实力'
  - '- 战略非目标论：目标是战略的对象/结果，非战略本身；“帮一万人赚钱”是目标非战略'
  - '**关键性质**'
  - '- 非对称博弈：不在对手强项硬碰硬，而在己方强项/对手弱项发起攻势（美苏：美用技术/经济拖垮苏）'
  - '- 指导原则恒定：战术可变（毒刺导弹、压油价、星球大战），战略指导原则不变（让苏联加成本）'
  - '- 劣势规避：老乡鸡拼卫生/标准化/品牌力会死，战略方向必须是“人情味/现炒”等优势'
  - '**典型例子**'
  - '- 美国vs苏联：苏联国土大防空成本高→美训阿富汗游击队给毒刺导弹打直升机→压油价破坏造血→星球大战逼军备竞赛→苏联经济崩溃'
  - '- LV/耐克/索尼/宝洁：抓住大趋势（铁路/电视/晶体管/广播）做开创性举动（旅行箱/球星代言/随身听/全国品牌）'
  - '- 格力vs奥克斯：格力拼专利/标准（优势），奥克斯拼价格/渠道（劣势），格力以强加成本守住基本盘'
  - '**边界条件**'
  - '- 需准确识别“相对优势”：错判优势会导致战略指导原则指错方向'
  - '- 对手必须有“成本承受上限”：对无成本约束的对手（如无限输血的平台方）失效'
  - '- 指导原则需穿越周期：战术随环境变（毒刺→压油价→星球大战），原则不变'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  - paper: docs/202301-02/20230207_03.md
    role: improve
  excerpts:
  - 首先，战略目的是让你能获得优势或者获得相对优势。
  - 其次，战略应该形成一种自始至终的指导原则。
  - 还有一个呢，就是战略需要发挥你的禀赋。你要是跟老乡鸡、南城香比卫生、标准化、品牌力，那就错了。
  - 因为苏联有几个弱点：国土面积太大……防守成本很高……美国的战略就是，让苏联承受越来越多的费用和成本。
  - 你看，美国所有的行动，都是遵守一个战略指导原则，就是让苏联增加成本。这叫做'强加成本'战略。
  - 战略就是先审视自己手里的筹码，也就是自己的优势，然后再决定自己怎么打牌，也就是如何运用自己的优势来获得你想要的结果。
- 'no': 6
  name: 信息差生意与身边机会挖掘 —— 赚钱机会在脚下
  points:
  - '**为什么需要这个概念？**'
  - '- 网上公开的“月入X万项目”基本已过时，真机会隐藏在身边被忽视的信息差中'
  - '- 普通人容易仰望网红大佬，却忽视身边“闷声发大财”的实体小生意'
  - '- 信息差≠垄断资源，只是“多看一眼、多问一句、多跑一趟”发现的供需错配'
  - '**核心定义**'
  - '- 信息差生意：利用认知不对称（如专业门槛、渠道壁垒、需求隐蔽性）获利，而非依靠技术/资本垄断'
  - '- 先有闷声发大财，网上说赚钱的基本过时：公开教学时红利期已过大半'
  - '- 身边案例法：通过观察本地商业细节（广告牌、烤面筋、朋友圈卖蟹）发现高ROI微生意'
  - '**关键性质**'
  - '- 非标准化：难以被复制粘贴，依赖本地资源、人际网络、特定场景'
  - '- 高确定性：已验证有人赚钱、模型跑通、现金流为正，非理论推演'
  - '- 反脆弱：不依赖平台算法、不怕大厂降维打击、抗周期能力强'
  - '**典型例子**'
  - '- 苏州AO图文：专做广告牌，70家店，单牌3-5千，月15块牌=月入7万+，极其稳定'
  - '- 四线城市烤面筋：三轮车日卖600串，日入2000+，节假日更高，月入过万'
  - '- 大学生朋友圈卖螃蟹：非全职，季节性强，旺季月2-3万，均摊年入1.2万'
  - '**边界条件**'
  - '- 难规模化复制：强依赖本地/人际/非标，不适合“矩阵化/标准化”放大'
