- 'no': 1
  name: 算力平权 —— 让每个人的电脑都能跑AI绘画
  desc: 本章从“显卡门槛”这一现实痛点出发，围绕 Google Colab 免费云 GPU 这一核心载体，系统讲解如何从零开始在云端搭建 Stable Diffusion
    WebUI 并完成出图。内容覆盖环境初始化、WebUI 搭建、模型分发与迁移、提示词配置与启动调优等环节，帮助读者在无本地高性能显卡的前提下，也能完整体验并掌握
    AI 绘画的全流程操作。
  nodes:
  - 'no': 1
    name: 痛点：高性能显卡为何成为门槛
    desc: 以“没有 N 卡/A 卡就跑不动”的普遍认知为切入点，指出个人电脑配置难以满足 AI 训练与推理的 GPU 需求，引出后续的云端替代方案。
    role: motivation
    src:
    - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
  - 'no': 2
    name: Google Colab：免费的远程 GPU 服务器
    desc: 将 Colab 类比为“一台远程电脑/云服务器”，介绍其免费 GPU 资源配置（约 12G 内存、15G 显存、55G 硬盘）与浏览器远程执行的定位，说明其作为云端算力载体的基本可行性。
    role: definition
    src:
    - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
  - 'no': 3
    name: Stable Diffusion WebUI：从命令行到可视化
    desc: 以“让普通人也能用”的视角解释 WebUI 的价值：它把原本需要写代码、敲命令的 Stable Diffusion 封装为可视化界面，是 AI
      绘画走向大众的关键推手。
    role: definition
    src:
    - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
  - 'no': 4
    name: 云端环境初始化与一键搭建
    desc: 四步走的核心操作：申请 Google 账号 → 访问共享脚本 → 修改硬件加速器为 GPU 并连接云资源 → 依次执行挂载 Gdrive、git
      clone WebUI 仓库、安装依赖三大命令，即可完成云端环境搭建。并强调用完需“断开并删除运行时”以释放免费额度。
    role: method
    src:
    - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
  - 'no': 5
    name: 模型分发四法：从 Gdrive 到 Hugging Face 中转
    desc: 以“把模型文件搬进云端电脑”为核心，对比讲解四种模型获取与迁移方式：Gdrive 挂载拷贝（15G 空间限制）、gdown 链接下载（小圈子分享）、Hugging
      Face 私有仓库 + token 中转（兼顾隐私与空间，作者最推荐）、以及任意云存储泛化下载。重点强调模型文件必须拷贝到 WebUI 指定目录才能被加载出图。
    role: method
    src:
    - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
  - 'no': 6
    name: Prompt 咒语与模型画风差异
    desc: 以“咒语”类比讲解提示词工程：正向 tag（如 masterpiece、best quality、sea beach、chiaroscuro）与负向
      tag（如 lowres、bad anatomy、watermark）共同构成高质量出图的关键输入。同时通过同一 prompt 下不同模型的出图对比，说明模型文件的训练数据源决定画风风格（动漫
      vs 真实）。
    role: experiment
    src:
    - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
  - 'no': 7
    name: 启动参数配置与公网访问
    desc: 介绍通过 COMMANDLINE_ARGS 注入 --share（生成公网 gradio.app 链接）、--gradio-auth（登录鉴权）、--deepdanbooru（图片提词）等参数，实现带鉴权的在线
      WebUI 服务，完成从本地玩耍到对外分享的升级。
    role: method
    src:
    - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
  - 'no': 8
    name: 免费额度的天花板与多账号策略
    desc: 指出免费 GPU 每天约数小时的硬限制，以及 15G 免费 Gdrive 的存储瓶颈；提出多账号注册轮换与 colab 直连下载（55G 空间）作为应对策略，让读者对免费方案的边界有清晰认知。
    role: limitation
    src:
    - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
- 'no': 2
  name: 自动化编排 —— 让工具替你盯梢和跑腿
  desc: 本章以 IFTTT 平台为样本，讲解无需编写代码即可搭建自动化工作流的完整方法论。从「If This Then That」的核心心智模型出发，通过“监控推特账号并推送通知”这一具体场景，分别演示邮件推送与企业微信群
    Webhook 推送两条路径，并提炼出触发器、动作、Webhook 等可复用的抽象概念，帮助读者建立“事件驱动”思维并迁移到钉钉等同类平台。
  nodes:
  - 'no': 1
    name: 需求诞生：跨平台信息触达的痛点
    desc: 以“想实时掌握 Web3 圈大佬动态但推特无法直连微信”的真实诉求为引，说明自动化工具在解决个人化、跨平台信息流转需求中的价值。
    role: motivation
    src:
    - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
  - 'no': 2
    name: IFTTT：'如果这样，就会那样'的自动化平台
    desc: 将 IFTTT 比作一张“数字胶水”：以「如果这样（If This）… 就会那样（Then That）」的条件触发逻辑连接 Twitter、Email、企业微信等异构应用，用户无需写代码，只需填参数即可组装自动化任务（Applet），免费额度为
      2 个机器人。
    role: definition
    src:
    - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
  - 'no': 3
    name: 触发器与动作：自动化任务的因果两端
    desc: 以“如果下雨（触发器），就带伞（动作）”类比，拆解触发器和动作的职责分工：触发器负责监听“事件发生”的条件（如指定推特用户发推），动作负责执行“事件发生后”的结果（如发送邮件/群消息），并详解在
      IFTTT 内的配置步骤。
    role: method
    src:
    - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
  - 'no': 4
    name: 路径一：邮件推送，零配置的首选
    desc: 演示在 IFTTT 中选择 Twitter“指定用户更新”触发器 → Email 动作 → 确认收件邮箱的完整流程。该方法无需额外鉴权或第三方服务，适合快速验证自动化链路是否打通。
    role: method
    src:
    - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
  - 'no': 5
    name: Webhook：一类通用的推送通道
    desc: 将 Webhook 定义为“访问某个 URL 并携带规定格式内容即可推送消息”的通用机制；以企业微信群机器人为例，讲解创建机器人、获取 Webhook
      地址、以及在 IFTTT 的 Webhooks 动作中填写 URL、Method、Body（JSON 请求体）的完整配置。
    role: method
    src:
    - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
  - 'no': 6
    name: 同一条逻辑，多种玩法
    desc: 归纳「If This Then That」作为普适心智模型的扩展价值：只要理解了“事件→响应”的抽象关系，即可自由组合出同步微博到推特、监控竞品动态等无限多的自定义自动化场景。
    role: extension
    src:
    - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
  - 'no': 7
    name: 边界与限制：免费额度与平台约束
    desc: 盘点该方案的现实约束：免费用户仅 2 个推送机器人（付费可提升）、企业微信群若含外部联系人则无法创建机器人、单人群聊需“先拉人再 T 掉”的变通操作——帮助读者评估方案的适用边界。
    role: limitation
    src:
    - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
- 'no': 3
  name: 流量变现 —— AI绘画小程序的生意经
  desc: 本章从“技术革新带来的机会”谈起，通过一个 AI 绘画小程序月收益 5W+ 的真实案例，拆解 C 端变现的整套商业逻辑。核心内容涵盖：项目定位分析（技术/变现/流量）、收益公式建模（使用人次
    × 广告 CPC 单价 − 接口成本）、SEO 蹭热点引流方法，以及流量主开通与广告位设置的可复制操作步骤，帮助读者理解从技术能力到商业收入的转化路径。
  nodes:
  - 'no': 1
    name: 风口下的冷静：先定位再动手
    desc: 以“任何技术革新都会带来新机会，但定位错了方向就迷失了”为引，提出从业者在拥抱 AI 绘画风口前，必须首先梳理自身在技术、变现、流量三个维度的资源禀赋与定位。
    role: motivation
    src:
    - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
  - 'no': 2
    name: 收益公式：一眼看穿生意的本质
    desc: 以“赚差价”为核心，将整个商业模式抽象为极简公式：收益 = 使用人次 ×（CPC 广告单价 − 接口调用费用）− 一次性投入。在广告单价与接口成本相对固定的前提下，使用人次成为唯一核心变量，一切运营动作都围绕扩大使用人次展开。
    role: definition
    src:
    - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
  - 'no': 3
    name: 成本与收入的构成拆解
    desc: 盘点公式两侧的实际构成：收入侧为广告 CPC 单价（30s 广告约 0.1-0.3 元，含小程序侧与抖音侧）与用户充值积分；成本侧为 AI 绘画接口的按次调用费用（可被充值收入摊薄）与一次性部署成本。
    role: definition
    src:
    - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
  - 'no': 4
    name: 蹭关键词 SEO：零成本撬动 98% 搜索流量
    desc: 以“在水流湍急的地方下网”类比，演示通过观察微信指数锁定热门 AI 绘画关键词，将其植入小红书等平台账号的名称与简介，即能获取平台搜索自然流量的低成本方法。作者实测该项目
      98% 的流量来源于小程序搜索，验证了 SEO 的引流主导地位。
    role: method
    src:
    - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
  - 'no': 5
    name: 从选型到躺赚：部署与变现操作全流程
    desc: 四步复制路径：①选一个靠谱的小程序供应商（照猫画虎）；②做关键词 SEO 引流；③开通流量主、配置广告位；④若有私域流量和内容能力可自行发布视频导流。强调该流程门槛低、可复制性强。
    role: method
    src:
    - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
  - 'no': 6
    name: 收益验证：5W+ 的背后是数据还是运气
    desc: 展示作者宣称的月收益 5W+ 及多张收益截图作为支撑证据；同时指出该数据尚未披露完整账号明细与统计口径，且作者自述“风口和运气成分居多”，提醒读者在评估案例时保持审慎。
    role: experiment
    src:
    - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
  - 'no': 7
    name: 风口生意的天花板：从 Copy 到方法论沉淀
    desc: 揭示作者成功背后的底层能力：依托在生财等平台持续阅读大量案例积累出的“项目感觉”。风口红利终会消退，但通过案例复盘建立起来的商业拆解能力可以持续复用，指引读者从“追风口”走向“建能力”。
    role: extension
    src:
    - paper: docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md
