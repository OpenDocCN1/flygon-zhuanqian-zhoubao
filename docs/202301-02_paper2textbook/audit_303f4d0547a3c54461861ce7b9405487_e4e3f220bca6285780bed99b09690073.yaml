unsupported_claims:
- location: ch1.3
  claim: 商业项目拆解的核心公式（看到→拆解→复制→放大）在素材中明确出现。
  reason: 该定位准确，但在表述上存在夸大。素材中“看到”并非公式的正式组成部分，而是对过程的通俗描述。
- location: ch1.4
  claim: 信息差搬运论的核心公式“内容效果 = 内容价值 × f(平台用户, 算法, 竞争环境)”。
  reason: 素材中仅以文字形式阐述了渠道存在信息差，并没有给出这样的数学模型。该公式是书籍作者的生造，缺乏素材支撑。
- location: ch1.4
  claim: 将“不断优化，提高社群产出”等未在素材中出现的表述归属于P001。
  reason: 素材原文为‘不断优化，提高社群产出’（P001），此处引用不准确，且无法在P001中找到该句。
- location: ch1.5
  claim: 私域前端流量定理（前端流量×转化率×客单价）的公式。
  reason: 素材中明确提到，前端流量是成功与否的关键，并指出私域只是一个渠道，但并没有提供该乘法公式。
- location: ch1.5
  claim: 流量活水模型。
  reason: 素材中虽有关于“前端流量需要持续引入”的论述，但并未形成“公域→私域→转化→再引入”的模型或循环图示。
- location: ch1.6
  claim: 红海赛道定理（=需求已验证+用户付费意愿已确认+局部蓝海仍存在）。
  reason: 素材中强调了在红海中有机会，但并未对其结构进行这样明确的分解或公式化表达。
- location: ch1.6
  claim: 将“后发制人”描述为‘唯一的选择方式’。
  reason: 素材中并未强调其唯一性，而是作为‘最实在的策略’进行表述。
