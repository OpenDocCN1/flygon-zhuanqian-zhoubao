learning_targets:
- 理解副业成功的核心不是“做产品”而是“发现并复制已验证的赚钱模式”
- 掌握“后发制人”的思维，能识别并判断一个项目是否已具备复制条件
- 熟练应用商业项目拆解方法，将一个赚钱案例拆解为流量、转化、交付的底层链路
- 学会使用六维评估模型为项目打分，判断其可复制性与收入天花板
- 能对比不同项目（如小说推文 vs 教育资料）的六维画像，理解客单价对项目量级的杠杆作用
- 建立从项目库到产品、运营、放大的整体认知框架，知道自己在哪一步、下一步做什么
concept_map:
- 第6章 副业变现的底层逻辑：从“看到”到“复制变现”
- ├── 思维转变：从“产品思维”到“信息差思维”
- │   ├── 信息差思维：知道别人不知道的路径就是商业价值
- │   ├── 后发制人：等别人验证成功后再复制，而非盲目首创
- │   └── 核心主张：副业的核心不是做产品，而是发现并复制已验证的赚钱模式
- ├── 核心方法：商业项目拆解
- │   ├── 定义：从爆款内容中拆出流量、转化、交付三环节
- │   ├── 操作：商业拆解八步法（找项目→拆流量→拆转化→拆交付→评估→定策略→搭团队→强执行）
- │   ├── 可复制性三标准：爆得是否偶然、货源是否可寻、场景是否验证有需求
- │   └── 前端策略：复述问题建立信任（内容策略）
- ├── 评估工具：六维评估模型
- │   ├── 效率维度：流量效率、销转效率、交付效率 → 决定可复制性
- │   ├── 财务维度：客单价、毛利率、复购率 → 决定收入天花板与补偿策略
- │   └── 评估标准：满足越多越好，满足四个点及格
- ├── 实战对比：案例应用六维模型
- │   ├── 小说推文：六维全高但客单价低、无复购 → 天花板低（月1000~2W）
- │   ├── 教育资料1.0：“三高一低”低客单、高毛利、无复购（月1000~2W）
- │   ├── 教育资料2.0：多一步高客单价合作转化 → 跃迁（月2W~100W）
- │   └── 核心结论：客单价是撬动收入量级的关键杠杆之一
- └── 整体框架：本书四部曲预览
- ├── 建立项目库（选赛道）：喂养算法+情报挖掘+权重打分
- ├── 开发最小产品：卖空气/软文先行（低成本验证）
- ├── 流量与转化运营：私域前端流量+转化链路
- └── 三大杠杆放大：人力杠杆（SOP兼职）、技术杠杆（批量搬运）、资源杠杆（资金/人脉）
life_analogy:
- 想象副业探索是一个**当“课代表”抄作业**的过程：
- '- **信息差思维** = 你知道隔壁学霸的“提分笔记”比你自己埋头苦读更有效'
- '- **后发制人** = 你不是自己发明解题方法，而是等学霸连续考了三次满分后，再借他的笔记来学'
- '- **商业项目拆解** = 把学霸的笔记拆成“公式集、错题本、做题顺序”三部分，你也照着做'
- '- **六维评估模型** = 拿到一份新“答案”时，先算一下“花费多少时间、提分多少、自己能不能坚持”再决定要不要照抄'
- '- **客单价杠杆** = 你抄完“基础题解法”（赚小分）后，发现加上“压轴大题解法”（贵价课），总分才能冲上100万'
- 就像课代表不会自己从零创一套理论，聪明的副业者先看别人验证有效的模式，再拆解、评估并复制它。
summary:
- concept: 信息差思维
  desc: 认识到“你知道而别人不知道的路径”本身就是商业价值，副业的核心是发现并复制已验证的赚钱模式
- concept: 后发制人
  desc: 等别人做成了、连续做好几个月验证可行后，再复制或二次创作，而非盲目首创
- concept: 商业项目拆解
  desc: 从爆款内容中拆出流量、转化、交付三环节，系统化复制一个赚钱项目
- concept: 商业拆解八步法
  desc: 找项目→拆流量→拆转化→拆交付→评估可复制/可持续→定策略→搭团队→强执行的系统化拆解方法
- concept: 可复制性三标准
  desc: 爆得是否偶然、货源是否可寻、消费场景是否验证有需求，三者满足即可低成本复制
- concept: 六维评估模型
  desc: 将项目拆解为流量效率、销转效率、交付效率、客单价、毛利率、复购率六个可量化维度
- concept: 效率维度
  desc: 流量/销转/交付三效率决定项目能否被复制放大的底层能力
- concept: 财务维度
  desc: 客单价/毛利率/复购率决定收入天花板，在效率受限时可作为补偿手段
- concept: 客单价杠杆
  desc: 大幅提升客单价可将项目的收入量级从月千元级跃迁到月百万级（如教育资料1.0→2.0）
- concept: 本书四部曲
  desc: 建立项目库（选赛道）→ 开发最小产品（卖空气/软文先行）→ 流量与转化运营 → 三大杠杆放大
- concept: 三大杠杆
  desc: 人力杠杆（低成本的兼职SOP）、技术杠杆（软件批量搬运）、资源杠杆（资金与人脉）可用于放大收入
exercises:
- 'no': 1
  title: 手算一次六维模型
  contents:
  - 给定两个副业项目，请用六维评估模型分别给它们打分：
  - '- 项目A：小红书减肥食谱账号。内容素材简单、获客量大；网销按SOP发即可；交付只需发PDF食谱。客单价10元，毛利率80%，减肥是重复过程所以复购高。'
  - '- 项目B：企业IP代运营服务。需要深度行业洞察、案例产出慢；需要一对一销售谈判；交付需专业团队陪跑。客单价5万元，毛利率70%，客户基本一次性合作。'
  - 回答问题：
  - '- 项目A和项目B分别有哪些维度“达标”？'
  - '- 哪个项目的收入天花板更高？为什么？'
  - '- 如果项目B的流量效率很低，它可以靠哪些维度来补偿？请给出具体的策略。'
- 'no': 2
  title: 拆解一个你身边的赚钱案例
  contents:
  - 观察你身边（朋友圈、抖音、小红书、闲鱼等）一个你觉得“赚钱”的账号或项目，完成一次商业拆解：
  - 1. 找到项目：描述它是做什么的、赛道、渠道。
  - 2. 拆流量：它是通过什么方式引流的？内容形式是什么？评论区是否有咨询？
  - 3. 拆转化：它是直接在平台成交，还是引流到私域后转化？转化话术是什么？
  - 4. 拆交付：交付的是有形产品还是无形服务？客单价大概多少？
  - 5. 评估可复制性：用可复制性三标准（爆得偶然？货源可寻？场景有需求？）来判断。
  - 6. 用六维模型打分：写出该项目的六维画像，并给出你的结论（是否值得复制）。
- 'no': 3
  title: 战略模拟：如何用“后发制人”避开红海竞争
  contents:
  - 假设你看到抖音上“艺术签名设计”的账号很火，评论区有大量咨询。
  - 问题A：在复制前，你需要确认哪三个条件才能动手？（提示：可复制性三标准）
  - 问题B：如果抖音已经做烂了，你如何利用“渠道信息差”原理找到一个仍有红利的平台？请具体说明你的选择依据。
  - 问题C：你准备如何用“复述问题建立信任”这一内容策略，写出一条引流笔记的开头？请实际写出来。
- 'no': 4
  title: 案例对比：为什么小说推文天花板低，而教育资料2.0能到百万
  contents:
  - 请根据本素材，分别列出小说推文和教育资料2.0的六维画像（每个维度标注：高/中/低）。
  - 回答问题：
  - '- 两者的核心差异在哪个维度？'
  - '- 为什么这个维度的提升能带来如此大的收入跃迁？'
  - '- 如果要提升小说推文项目的天花板，你会优先调整哪个维度？请给出具体操作建议。'
- 'no': 5
  title: 动手搭建一个自己的“项目情报库”
  contents:
  - 选择你感兴趣的副业方向，按照商业拆解八步法，建立一份项目情报库：
  - 1. 用“喂养算法”的方法，连续3天主动刷该领域的商业内容并点赞收藏，记录你刷到的3个潜在项目。
  - 2. 对每个项目，完成八步法中的前四步（找项目、拆流量、拆转化、拆交付）。
  - 3. 对每个项目用六维模型打分，并按“满足维度数量”排序。
  - 4. 反思：你的情报来源是否足够多元？如何利用“搜索+泛读”拓宽信息源？
