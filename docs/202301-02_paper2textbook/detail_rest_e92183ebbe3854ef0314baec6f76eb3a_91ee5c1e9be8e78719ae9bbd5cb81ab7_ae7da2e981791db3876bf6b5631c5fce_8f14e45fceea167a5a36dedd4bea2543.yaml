learning_targets:
- 理解副业案例汇编从碎片信息到系统知识的转化价值
- 掌握“主题+平台+数据结果”高点击率标题的结构化撰写公式
- 学会建立周期性情报编纂机制，打造个人商业雷达站
- 掌握从单纯索引进化为多维知识库的路径与关键动作
- 能识别案例集编纂中的幸存者偏差、时效性衰减等边界陷阱
concept_map:
- 副业案例集与情报编纂体系
- ├── 核心载体：龙哥赚钱周报
- │   ├── 形态定义：定期汇编的索引合集，按日期编号组织  —— P001
- │   ├── 覆盖维度：多平台（公众号/抖音/小红书/视频号/TikTok）× 多赛道（AI/Web3/私域/电商）  —— P001
- │   └── 核心功能：降低检索成本，将离散灯塔串联为导航图谱  —— P001
- ├── 标题工程：数据钩子设计
- │   ├── 结构公式：主题 + 平台 + 量化结果（涨粉/变现/ROI/成本/周期）  —— P002
- │   ├── 信任锚点：具体数字替代模糊形容词，传递可复制性与收益预期  —— P002
- │   └── 检索友好：结构化标题可直接解析入库，支持多维筛选  —— P002
- ├── 编纂机制：周期性情报雷达
- │   ├── 节奏设定：固定周期（双周/月）更新，形成阶段性情报快照  —— P003
- │   ├── 加工流程：筛选 → 分类 → 重标题 → 打标签 → 汇总发布  —— P003
- │   └── 双重价值：对外立人设（专业度背书），对内辅决策（选品/选赛道依据）  —— P003
- └── 进化路径：从索引到知识库
- '    ├── 维度重构：按平台/赛道/阶段三维打标，从“时间序”转“问题域”检索  —— P004'
- '    ├── 四层关联：案例 ↔ 方法论 ↔ 工具 ↔ 模板，支持模式挖掘  —— P004'
- '    ├── 产出升级：定期输出专题深度报告（横向对比/避坑白皮书/趋势洞察）  —— P004'
- '    └── 变现阶梯：免费周报引流 → 付费知识库订阅 → 定制化咨询  —— P004'
life_analogy:
- 想象副业案例集的建设像是**为一片未知海域绘制航海图**：
- '- **单篇复盘文章** = 水手零散的“见岛日志”（只记录某次发现陆地的坐标与收获）'
- '- **周报索引** = 按航次整理的“航海日志汇编”（按时间序串联，能看出大致航线）'
- '- **结构化标题** = 日志封面上的“关键坐标标注”（一眼看到：哪里、什么岛、多少金银）'
- '- **周期性编纂** = 固定频次的“测绘船队出海”（制度化保证情报持续更新、不缺档）'
- '- **知识库进化** = 最终绘成的“标注了洋流、暗礁、补给港、贸易航线”的**总航海图**'
- '    - 支持按“目的地（赛道）”“船型（平台）”“季节（阶段）”快速查阅'
- '    - 标注了“哪里有暗礁（避坑）”“哪里顺风快（爆款打法组合）”'
- '    - 新航海者（读者）拿到图，就能避开死海、直奔富饶群岛，而非盲目漂流。'
summary:
- concept: 龙哥赚钱周报
  desc: 定期汇编的副业实操索引合集，用结构化目录将碎片灯塔串联成导航图谱
- concept: 案例标题工程
  desc: “主题+平台+数据结果”三段式标题，用具体数字做钩子传递可复制性与收益预期
- concept: 周期性情报编纂
  desc: 固定节奏的筛选-加工-发布流程，低成本维护个人商业雷达站，实现对外立人设、对内辅决策
- concept: 索引到知识库进化
  desc: 从时间序目录进化为平台/赛道/阶段三维知识库，建立案例-方法论-工具-模板四层关联，输出专题深度报告
- concept: 幸存者偏差
  desc: 周报多收录成功案例，失败教训易被标题掩盖，需引入失效标记与反面教材平衡认知
- concept: 时效性衰减
  desc: 平台规则与流量红利随时间失效，旧案例需打🟢/🟡/🔴时效标记，避免误导实操
exercises:
- 'no': 1
  title: 标题重构实战：给模糊标题装上“数据钩子”
  contents:
  - 以下是某副业实操文章的原始标题，请按“主题+平台+数据结果”公式改写：
  - 1. 原标题：《我做小红书资料号的一周心得》
  - '   已知数据：投入7天，发布21篇笔记，涨粉1200，私域引流300人，变现980元，客单价9.9元。'
  - '   任务：写出3个不同侧重点的新标题（侧重涨粉/侧重变现/侧重低成本）。'
  - 2. 原标题：《视频号带货新手避坑指南》
  - '   已知数据：测试5个品，亏损2000元后单品日出单20单，利润30%，回本周期10天。'
  - '   任务：写出一个体现“避坑后结果”的标题。'
  - 回答问题：
  - '- 为什么标题里的“980元”比“变现四位数”更可信？'
  - '- 标题里若不带平台名（如小红书/视频号），会损失什么检索价值？'
- 'no': 2
  title: 设计你的首期“赚钱周报”原型
  contents:
  - 假设你过去一个月在公域平台（公众号/小红书/抖音/知乎/即刻）收藏了15篇高质量副业/副业复盘文章。
  - 请完成：
  - 1. 建立一个 Notion/飞书文档/Excel 表格，字段含：原标题、来源链接、平台、赛道、核心数据（涨粉/变现/成本/周期）、可复制性自评（1-5分）、你的重标题。
  - 2. 按“平台”分组，筛选可复制性≥3分的条目，按“核心数据”降序排列。
  - 3. 输出一份 Markdown 格式的周报草稿，文件名按“YYYYMMDD-YYYYMMDD”命名。
  - 回答问题：
  - '- 这15篇中有多少篇原标题已包含核心数字？缺失数字的篇幅占比说明了什么？'
  - '- 若坚持每双周发一期，你需要建立什么“素材采集-加工-发布”的最小化 SOP？'
- 'no': 3
  title: 知识库进化演练：从索引到“问题域”检索
  contents:
  - 基于练习2产出的周报数据，执行“知识库化”改造：
  - 1. 为每个案例新增三个标签维度：
  - '   - 赛道标签（如：AI绘画/私域裂变/小说推文/知识付费/电商选品）'
  - '   - 阶段标签（冷启动/流量获取/转化变现/放大矩阵/避坑合规）'
  - '   - 关键动作标签（如：矩阵号/SEO/无人直播/软文先行/卖空气/裂变/公转私）'
  - 2. 模拟三个真实查询场景，用筛选器/数据库查询/向量检索任意方式，在5秒内调取相关案例：
  - '   场景A：我要做视频号冷启动，有哪些可参考的“前3天动作”案例？'
  - '   场景B：我想用“软文先行”验证一个知识付费产品，有成功先例吗？'
  - '   场景C：近期抖音打击“无人直播”了吗？有最新避坑案例吗？'
  - 3. 尝试提炼1个“隐性打法组合”（如：矩阵号+无人直播+素材去重=低成本高爆单概率）。
  - 回答问题：
  - '- 纯时间序索引无法直接回答上述场景，根本原因是什么？'
  - '- 维护三维标签的边际成本随案例量如何增长？如何用AI（如嵌入向量+聚类）降低人工标注负担？'
