learning_targets:
- 理解赚钱的本质是交易与需求满足，并能够识别不同场景下的付款者与打动方式
- 掌握流量价值公式，能够用规模、相关性、信任度三个维度评估流量质量
- 理解财富积累的四个阶段与杠杆效应的原理，能够判断自身所处的阶段并找到可用的杠杆
- 掌握MVP先卖后做的方法，能够用最小成本验证需求的真实性
- 掌握商业拆解复制的方法，能够将已验证的商业模式拆解为可复制的流程
- 理解需求与痛点的区别与转化关系，能够将用户需求上升为购买动力
- 理解原生Idea的概念，能够从自身问题出发构思产品创意
- 了解平台生命周期的四个周期，能够判断平台所处阶段并选择匹配的运营策略
- 理解超垂直个人IP与SEO思维，能够制定获取精准流量的长期策略
