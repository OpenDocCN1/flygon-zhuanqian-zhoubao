learning_targets:
- 理解IP母题作为文化原型搭建护城河的核心作用与延展逻辑
- 掌握IP三重身份（工具/人/神）在用户不同阶段的动态切换策略
- 熟悉IP四级观感（松弛/对象/获得/氛围）驱动感性消费的组合拳打法
- 理解IP五份资产（用户/版权/实物/文化/生态）的幂次效应与化学反应
- 掌握内容体系五件套（架构/理论/故事/问答/路径）的构建方法与标准化交付逻辑
- 熟练运用构建独有理论的五大方法（理想解法/节点法/词根法/母题法/核心法）
- 理解千万营收模型全价格带产品矩阵与4近原则（离钱/痛点/易用/信任近）的定价底层逻辑
- 明确Web3定义、以虚促实趋势及其与传统互联网的演进关系
- 建立赛道选择的金融视角：选择比努力更重要、容错率控制与资金分层配置策略
- 掌握Web3熊市生存铁律：敬畏市场、保护弹药/团队、选基建不选应用
