learning_targets:
- 理解传统“先开发后售卖”流程的痛点与风险
- 掌握“卖空气”预售法的定义、核心原则与操作路径
- 理解“软件的本质就是软文”这一反直觉起点及其推论
- 学会用“复述问题”建立信任基础的内容策略
- 掌握非规范化生产（野路子）的核心目标与工具选择
- 了解“有效噱头、无效产品”的心理学原理及其伦理边界
- 能根据产品特点判断“卖空气”方法的适用边界与风险
concept_map:
- 第3章 产品孵化 —— “卖空气”与“软文先行”的最小化验证
- ├── 核心起点：软件的本质就是软文
- │   ├── 推广方式决定开发流程 —— 反推开发，甚至不开发而寻找现成软件
- │   ├── 沟通成本高于开发成本 —— 用工具捏模型替代语言沟通
- │   └── 程序思维 vs 反流程思维 —— “先有东西再推广”是误区
- ├── 核心方法：卖空气（预售验证）
- │   ├── 核心定义 —— 制造“已具备功能”的假象来预售
- │   ├── 核心原则 —— 假装已经有了，再去卖；卖不出去就不做
- │   ├── 操作路径 —— 捏模型截图 → 发布预售 → 收钱测试需求
- │   ├── 关键性质 —— 需求验证前置、零沉没成本、反流程性
- │   └── 典型案例 —— 羊了个羊P图吸粉、橡皮擦工具预售
- ├── 信任基础：复述问题建立信任
- │   ├── 心理机制 —— “这次找对了”的就医错觉
- │   ├── 内容策略 —— 罗列用户症状而非给出解决方案
- │   └── 应用场景 —— 软文撰写的第一性目标
- ├── 生产方式：非规范化生产（野路子）
- │   ├── 核心目标 —— 降低成本、提升效率
- │   ├── 工具路径 —— 中文编程工具等低门槛工具
- │   ├── 时间红线 —— 单软件研发不超过1周
- │   └── 反面警示 —— “没有正统的命，得了正统的病”
- └── 理论支撑与边界：有效噱头与无效产品
- ├── 安慰剂效应 —— 糖豆当救命药也有30%+康复率
- ├── 名字决定认知 —— 连花清瘟案例
- ├── 伦理边界 —— 不适用于长期交付、复购或品牌信任
- └── 风险提示 —— 信任透支、法律与道德风险
life_analogy:
- 想象产品孵化是一场**在集市上预售“空气”**：
- '- **传统做法** = 先把菜做好再摆摊，成本高、周期长，可能没人买'
- '- **“卖空气”** = 先画一张菜的诱人图片挂在摊上，有人付钱预订了再去做菜'
- '- **模型截图** = 那张诱人的菜品海报，让人相信你已经有了这道菜'
- '- **预售款** = 顾客交的定金，验证了这道菜到底有没有人想吃'
- '- **复述问题** = 像医生先问你“是不是这里疼”，让你觉得“这次找对人了”'
- '- **非规范化生产** = 用普通锅具快速炒出一道能吃的菜，而不是先建五星级厨房'
- 就像聪明的摊主先收钱后出菜，能卖出去就做，卖不出去就收摊，个人开发者也需要用“卖空气”来先验证市场需求再投入开发。
summary:
- concept: 软件的本质就是软文
  desc: 软件最终靠软文推广，因此可反推流程：先写软文、后做产品，甚至不开发而寻找现成软件交付
- concept: 卖空气
  desc: 在产品未开发时制造“已具备功能”的假象来预售收钱，以此低成本验证需求，卖不出去就不做
- concept: 复述问题建立信任
  desc: 通过罗列用户症状让用户产生“这次找对了”的信任感，哪怕只是知道问题而无法解决
- concept: 非规范化生产
  desc: 个人开发者应放弃正规流程，用中文编程等低门槛工具快速捏出模型，核心是降低成本、提升效率
- concept: 有效噱头、无效产品
  desc: 产品不解决需求也不影响赚钱速度，借助安慰剂效应和好名字即可获利，但存在伦理灰色地带
- concept: 需求验证前置
  desc: 把“市场是否买单”的验证从开发后提前到开发前，最大程度降低试错成本
- concept: 零沉没成本
  desc: 卖不出去就不必继续做，避免传统开发模式下投入打水漂的风险
- concept: 反流程性
  desc: 销售先于产品存在，颠覆“先有东西再推广”的传统思维
- concept: App门槛精准过滤
  desc: App需下载安装的高门槛反而能过滤掉看客，留下有强烈需求的精准用户，并让其相信App“真的具有该功能”
- concept: 软件营销派碾压软营销派
  desc: 逼真的App界面比纯文本攻略更显专业，让用户觉得“软件问题就要用软件解决”
- concept: 过审的艺术
  desc: 通过超长文、干净截图、合集模板等技巧，让审核员觉得文章“长篇大论且专业”从而通过审核
- concept: 居高临下的套话
  desc: 以“已解决”口吻写文吸引同行，再反问套取真实方案，卖给未解决的客户盈利
exercises:
- 'no': 1
  title: 设计一个“卖空气”预售方案
  contents:
  - 背景：假设你观察到一个热门需求——“一键生成周报的AI工具”，但你并不会开发。
  - 任务：按照“卖空气”方法论，设计一个完整的预售方案：
  - 1. 你会如何制造“已具备功能”的假象？（列出至少2种手段，如截图、演示视频、预售页）
  - 2. 你会用什么样的“复述问题”内容策略来撰写预售文案？（写出文案开头的前三句话）
  - 3. 你计划用什么低门槛工具快速捏出一个可演示的模型？
  - 4. 如果你的预售效果不佳（如24小时内无人付费），你的止损计划是什么？
  - 回答问题：
  - '- 该方案中哪些环节利用了“需求验证前置”和“零沉没成本”的原理？'
  - '- 如果该产品需要长期复购，你还会用“卖空气”策略吗？为什么？'
- 'no': 2
  title: 案例分析：羊了个羊P图吸粉事件
  contents:
  - 回顾素材中的案例：羊了个羊刚火时，有人P一张999999分数截图，以“已开挂”口吻发帖吸粉，5天后游戏大火，套话找出真正刷分软件直接变现。
  - 请拆解该案例：
  - 1. 该操作中“卖空气”体现在哪些环节？
  - 2. “复述问题建立信任”是如何被运用的？（该帖以什么口吻、面向什么用户？）
  - 3. “套话做局”在本案例中是如何进行的？
  - 4. 如果你是模仿者，你认为该案例最大的风险是什么？
  - 5. 如果该玩法被大量复制，你认为会发生什么？这体现了“卖空气”的哪个边界条件？
- 'no': 3
  title: “软件的本质就是软文”辩论与产品反推
  contents:
  - 作者主张“软件的本质就是软文”，因此可以“不开发软件，而是寻找类似的软件给客户使用”。
  - 请从正反两面分析：
  - 1. 支持该观点：列举至少2个这种策略能成立的理由（如热点窗口期短、沟通成本高）。
  - 2. 反对该观点：列举至少2个这种策略可能失败或被用户识破的场景。
  - 3. 实操任务：找一个你熟悉的软件（如番茄钟、截图工具），尝试反推：
  - '   - 如果让你“先写软文后开发”，你会为这个软件写一篇什么样的软文？'
  - '   - 不开发的情况下，你能找到哪个现成软件来交付给客户？'
  - 4. 判断：你认为“软件的本质就是软文”适用于所有类型的软件吗？请说明你的边界条件。
- 'no': 4
  title: “有效噱头、无效产品”的道德边界与替代方案
  contents:
  - 作者提到“不解决需求，也不是好的产品，并不会影响赚钱的速度”，并举了“安慰剂效应”（糖豆当救命药有30%+康复率）和“连花清瘟名字好”两个例子。
  - 请思考并回答：
  - 1. 作者举例的“安慰剂效应”和“连花清瘟”案例在本质上有什么区别？（一个是骗，一个是信）
  - 2. “有效噱头”和“虚假宣传”的边界在哪里？请给出你的判断标准。
  - 3. 如果你是消费者，买到一个“噱头有效但功能无效”的产品，你的感受是什么？这会影响你对品牌的长期信任吗？
  - 4. 设计一个“既有噱头、又真实有用”的替代方案：为一个产品（如背单词App）设计一个吸引人的名字和宣传口吻，但确保宣称的功能至少80%真实。
  - 5. 总结：在什么条件下，“有效噱头”是可接受的？在什么条件下不可接受？
- 'no': 5
  title: 开发周期红线：评估你的个人项目
  contents:
  - 作者提出“个人开发者研发一个软件的时间不应超过1周，超过1周的软件产品不适合个人开发者”。
  - 请完成以下评估：
  - 1. 列出你目前正在做或想做的3个产品想法。
  - 2. 对每个想法，估算你预计的开发周期（诚实估算）。
  - 3. 如果一个产品预计开发周期超过1周，请回答：
  - '   - 它能不能被拆分成“1周内可交付的最小版本”？如果能，这个最小版本只包含哪些功能？'
  - '   - 它是否适合个人开发者？如果不适合，是否可以通过“卖空气”先验证需求后再决定？'
  - 4. 选择其中一个产品想法，按照“非规范化生产”的思路，用“中文编程工具”或其他低门槛工具，设计一个不超过3天能完成的模型方案，并列出具体的工具和步骤。
units:
- 'no': 1
  name: 卖空气 —— 先收钱、后造梦的预售魔法
  points:
  - '**为什么需要这个概念？**'
  - '- 传统“先开发产品、后推向市场”的流程成本高、周期长，一旦需求判断失误，所有投入都将付诸东流'
  - '- 个人开发者或小团队资源有限，无法承担完整的开发周期，需要一种低成本、快速验证需求真实性的手段'
  - '- 市场环境变化快，热点窗口期短暂（如羊了个羊大火只有几天），等到产品开发完再卖，风口早已过去'
  - '**核心定义**'
  - '- “卖空气”指在产品尚未开发或无法真正兑现功能时，先通过制造“已具备该功能”的假象（如模型截图、预售页面、演示视频）来收取用户资金，以此测试需求是否真实存在'
  - '- 核心原则是“假装已经有了，再去卖”——若预售效果不佳，则果断放弃后续开发，避免沉没成本'
  - '**关键性质**'
  - '- 需求验证前置：把“市场是否买单”的验证从开发后提前到开发前'
  - '- 零沉没成本：卖不出去就不必继续做，最大程度降低试错代价'
  - '- 反流程性：销售先于产品存在，颠覆“先有东西再推广”的传统思维'
  - '**典型例子**'
  - '- 开发者看到某一热点需求（如羊了个羊刷分工具），先P一张功能截图发帖预售，若有大量用户询价付款，再着手寻找或开发真正能兑现的软件'
  - '- 用中文编程工具先捏出一个粗糙的模型界面展示给潜在客户，而非先完成完整研发'
  - '**边界条件**'
  - '- 此方法建立在“有效噱头、无效产品”这一伦理灰色地带上，虽能加速赚钱但存在法律与道德风险'
  - '- 不适用于需要长期交付、复购或建立品牌信任的产品形态，只能用于一次性、小额、需求急迫的短期生意'
  - '- 预售承诺若无法兑现，会积累用户信任透支，不可作为持续性商业模式'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 或者直接做个模型，上架开卖，卖空气，卖预售。卖不出去就没必要继续做了！
  - 假装已经有了足够！卖空气！
  - 程序的思维总是先有东西再推广，不要等什么东西已经有了再去卖！假装已经有了足够！卖空气！
  - 羊了个羊刚有点火，立刻就有人P一张分数999999截图，去社交软件用已经开挂的口吻发文，开始吸粉，差不多5天后《羊了个羊》大火，这时他就可以，套话找真正能刷分软件了，直接把粉丝变现！
'no': 3
