- 'no': 1
  name: 短视频带货 —— 从“内容”到“生意”的必修课
  desc: 本章系统梳理抖音、视频号等主流平台的短视频带货方法论，从赛道选择、内容生产、账号运营到变现转化，带你建立从内容到生意的完整闭环。
  nodes:
  - 'no': 1
    name: 短视频带货的底层逻辑：流量→信任→成交
    desc: 理解短视频电商“内容种草→直播/私域收割”的基本链路，建立“前端内容决定流量、后端变现决定成败”的全局观。
    role: motivation
    src:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
  - 'no': 2
    name: 做人群 vs 做商品：差异化竞争策略
    desc: 当平台内商品搬运同质化严重时，转而以细分的“人群情感需求”为切入点制作内容，避开红海竞争，实现低成本流量获取。
    role: method
    src:
    - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
  - 'no': 3
    name: 变现产品的双轨制：泛兴趣品与精准痛点品
    desc: 将适合做IP的变现产品分为低客单泛兴趣产品（0-50元）和高客单精准痛点产品（1000+元），并分别匹配短视频直购、直播间转化、私域成交三条成交路径。
    role: method
    src:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
  - 'no': 4
    name: 行业冠军联营：借力放大流量的打法
    desc: 通过筛选当地行业头部机构（行业冠军），以冷电话+见面洽谈的方式达成联营合作（服务费+分成），借其预算、背书与完整变现体系放大抖音流量。
    role: method
    src:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
  - 'no': 5
    name: 选品方法论：定人群、找需求
    desc: 提出“选品即定人群找需求”的核心原则，以视频号中老年下沉人群为例，优先选择垂直需求品（健康、保养）而非通用品。
    role: definition
    src:
    - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
  - 'no': 6
    name: 高客单非遗产品的价值塑造
    desc: 以竹庐拓艺品牌为例，展示高客单价非遗产品如何通过“产品思维”（八层装裱工艺）、场景化直播（佛堂、茶室）和人群定位（新锐白领、资深中产）实现年销数百万。
    role: experiment
    src:
    - paper: docs/202301-02/XuOgdT9o8ongKPxfSMlcfgLbngf.md
- 'no': 2
  name: 爆款内容生产线 —— 从“搬运”到“自动化原创”
  desc: 本章聚焦短视频内容的批量生产与模板化创作，从1比1模仿爆款、模板元素化拆解、伪原创二创到RPA自动化采集，帮你建立可持续的内容供给能力。
  nodes:
  - 'no': 1
    name: 为什么原创优于二剪优于搬运
    desc: 在平台打击搬运、内容同质化的背景下，明确内容创作质量分层，确立“直接1比1模仿当下爆款视频去做原创”的保底策略。
    role: motivation
    src:
    - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
    - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
  - 'no': 2
    name: 模板化拆解：视频六元素
    desc: 提出所有短视频可拆解为背景、标题、内容、文案、字幕、背景音乐六种元素，这是实现视频自动生成的核心抽象模型。
    role: definition
    src:
    - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
  - 'no': 3
    name: 伪原创的二创方法论
    desc: 基于“情、趣、用、品”四象限内容分类，将全平台素材库（抖音、快手、知乎、小红书、TK等）中的爆款进行“不违规二创”，拼接换乐成为自己赛道的作品。
    role: method
    src:
    - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
  - 'no': 4
    name: RPA机器人批量采集爆款素材
    desc: 基于影刀RPA工具开发采集机器人，实现巨量百应创意中心爆款视频的批量搜索、数据采集（GMV、粉丝量等）与无水印视频下载，替代人工与第三方工具。
    role: method
    src:
    - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
  - 'no': 5
    name: 混淆元素与随机取用：保证原创性
    desc: 通过素材随机取用、时间段随机取用和加入自拍混淆元素三个手段，确保自动生成的批量视频各不相同且能通过平台原创审核。
    role: method
    src:
    - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
  - 'no': 6
    name: 视频搬运去重流水线
    desc: 视频号搬运的固定处理流程：放大→翻转→BGM处理→加字，其中“加字引导”被认为是出单关键而非视频本身。
    role: method
    src:
    - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
  - 'no': 7
    name: 小说推文的批量生产SOP
    desc: 以知乎盐选小说推文为例，展示选文垂直化（作者垂直+专栏垂直）、核心剧情前置、改文套路化、模板化剪辑的精细化内容生产方式。
    role: experiment
    src:
    - paper: docs/202301-02/ZcEdd0xTCo1K5IxwCyLccKUynOb.md
- 'no': 3
  name: 账号运营与私域转化 —— 把流量“吃干抹净”
  desc: 本章围绕账号生命周期管理和公域向私域转化，讲解新号起量、评论区运营、直播转化以及抖音公转私的自动化工具与防封策略。
  nodes:
  - 'no': 1
    name: 新号起号：流量扶持期与极速流承接
    desc: 视频号新号前7天有流量扶持，发视频容易破万播放；抖音起号期推流标签不精准时，通过发福袋+小号带头抢（从众心理）做留存和互动数据，用福袋接极速流。
    role: method
    src:
    - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    - paper: docs/202301-02/SvdFdfi3VoAiaRxENHNcncEqnif.md
  - 'no': 2
    name: 对标账号筛选与黑马小达人策略
    desc: 在快手/抖音筛选对标账号的四项标准（粉丝5W以下、视频200条以上、垂直品反复带、画面干净），并优先选择“粉丝量少但销量高”的黑马小达人作为学习对象。
    role: method
    src:
    - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
  - 'no': 3
    name: 评论区“造互动”与羊群效应
    desc: 通过引导关注+扣随机数字、拿3个小号自己先评论激发羊群效应（三人成虎），带动用户真实评论，提升笔记数据和流量。
    role: method
    src:
    - paper: docs/202301-02/IpCcdJ9NAoAt4pxKKV5c5sfenZc.md
    - paper: docs/202301-02/ZcEdd0xTCo1K5IxwCyLccKUynOb.md
  - 'no': 4
    name: 直播转化：话术扒取、样品展示与开播节奏
    desc: 从同品类抖音直播中录音扒取话术并改写成自己风格，购买样品展示提升信任；遵循“视频没在跑就不直播”原则，根据破万播放决定开播，用反复开/关播控制时长。
    role: method
    src:
    - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
  - 'no': 5
    name: 五大公转私入口与账号类型权限矩阵
    desc: 梳理主页跳转、评论跳转、私信卡片、直播小风车、抖音群五大转化入口，以及蓝V、半蓝、员工号、黄V、个人号在不同入口上的权限差异表。
    role: definition
    src:
    - paper: docs/202301-02/QbBKdHvfiofIUNxDlmjceWbfnqh.md
  - 'no': 6
    name: 官方接口升级玩法：免付费、可自动回复的跳转链路
    desc: 通过官方后台或接口对接（如企业号官网主页、巨量纵横评论自动回复、直播卡片-讲解类型）生成带链接的跳转组件，实现全程免费、安全持久、5秒内自动回复的效果。
    role: method
    src:
    - paper: docs/202301-02/QbBKdHvfiofIUNxDlmjceWbfnqh.md
  - 'no': 7
    name: 风险分级、双线防封与兜底方案
    desc: 建立转化工具风险分级框架（官方>接口>第三方App>小程序），遵循抖音端与微信端双线并行防封原则，采用白名单域名替代、小程序备用池批量注册、防截图举报机制、微信客服替代小程序等兜底策略。
    role: method
    src:
    - paper: docs/202301-02/QbBKdHvfiofIUNxDlmjceWbfnqh.md
  - 'no': 8
    name: 账号生命周期与设备风控管理
    desc: 抖音盲盒项目实操总结：通过控制单场直播时长（15分钟）和每日场次避免系统断播；建立“违反直播行为规范”的判断流程（单号复播验证、换机排查、次日抖音来电确认），确认封设备后直接刷机。
    role: method
    src:
    - paper: docs/202301-02/SvdFdfi3VoAiaRxENHNcncEqnif.md
- 'no': 4
  name: 搜索流量蓝海 —— 用抖音SEO精准获客
  desc: 本章带你掌握抖音搜索优化（SEO）的底层逻辑，从选蓝海词、优化细节指标到工业级素材库，学会在推荐流量之外开辟精准、持久、低成本的搜索流量渠道。
  nodes:
  - 'no': 1
    name: 抖音搜索是蓝海：流量大、竞争小、持久
    desc: 因为99%的抖音达人不理解搜索逻辑，搜索端流量大而内容供给不充分，形成蓝海；且搜索作品远不如推荐作品优质，存在大量机会，获得流量可持久。
    role: motivation
    src:
    - paper: docs/202301-02/CZPydiVmgo2odMx0nWecf3DTn6e.md
  - 'no': 2
    name: 蓝海词定义与选词定生死原则
    desc: 蓝海词指搜索流量大但竞争小、容易被排上名的关键词；做抖音SEO最重要的是选词，找到蓝海词才能保证90%的成功率，词选得好靠运气也能获得搜索流量。
    role: definition
    src:
    - paper: docs/202301-02/CZPydiVmgo2odMx0nWecf3DTn6e.md
  - 'no': 3
    name: 基于1500万搜索词库的选词方法
    desc: 利用极客抖音Seo工具的1500万搜索词数据库筛选蓝海词：一个领域约70%是蓝海词，结合月覆盖人数和每日关键词指数涨势辅助判断，规避大词过泛和无效长尾词两大误区。
    role: method
    src:
    - paper: docs/202301-02/CZPydiVmgo2odMx0nWecf3DTn6e.md
  - 'no': 4
    name: 从用户搜索需求出发的内容定位
    desc: 站在用户搜索习惯与搜索量数据出发选词和做内容定位，避免从自身专业视角写用户不搜的生僻词，用数据洞察用户痛点、区分用户群体，从而确定运营策略。
    role: method
    src:
    - paper: docs/202301-02/CZPydiVmgo2odMx0nWecf3DTn6e.md
  - 'no': 5
    name: 细节指标优化法：5分钟见效
    desc: 基于抖音SEO底层原理包含的十几项指标，对已发布内容的细节进行完善以快速见效——案例中老板仅花5分钟优化已发视频，旧视频即新增3w+搜索量和150条潜在客资。
    role: experiment
    src:
    - paper: docs/202301-02/CZPydiVmgo2odMx0nWecf3DTn6e.md
- 'no': 5
  name: IP矩阵与团队搭建 —— 从“个人作战”到“工业化复制”
  desc: 本章揭秘短视频IP矩阵从0到1搭建的完整流程，从变现产品梳理、团队人才培养到标准化内容生产流水线，并总结看好的赛道与20条实战心得。
  nodes:
  - 'no': 1
    name: 后端变现效率决定项目成败
    desc: 抖音是开卷考试，前端内容趋同，真正决定成败的是后端变现效率；高毛利可拉高获客成本碾压对手，反之当ROI算不过来时不敢放预算。
    role: motivation
    src:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
  - 'no': 2
    name: 短视频IP团队五岗位架构
    desc: 标准团队配置为演员/出镜人、运营（选题/文案/规划）、剪辑（拍摄剪辑）、IP手（聊天手，面向创始人IP孵化）、项目经理，每个岗位有明确的核心考核指标。
    role: definition
    src:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
  - 'no': 3
    name: 剪辑→运营→项目经理人才培养路线
    desc: 针对优质运营难招而剪辑岗供给充足的现状，提出“只招剪辑、筛选灵性者向运营培养”的团队搭建方案，由老人下场跑通流程后再复制。
    role: method
    src:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
  - 'no': 4
    name: IP打造五步法：定位-选题-文案-拍剪-复盘
    desc: 标准化内容生产流程：竞品调研→定位缺口→定位细节；热点宝收集对标→选题库评分；复制10w+爆款开头句式结构→最优结构为“泛流量开头+漏斗型观点+引导结尾”；5秒完播率/总体完播率/留存坏点三维复盘。
    role: method
    src:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
  - 'no': 5
    name: 留存坏点：复盘流失节点
    desc: 作者自创的复盘概念，指视频播放中某一秒观众人数骤降的节点，通过找到“什么话、什么场景、什么动作会掉人”并砍掉，实现留存优化。
    role: definition
    src:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
  - 'no': 6
    name: 创始人IP是坑：用演员替代
    desc: 大部分老板专业程度不足以弥补表现力差距，且老板时间值钱无法全力投入，从商业效率角度比创始人出镜，用专业演员/主持人出镜效率更高。
    role: limitation
    src:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
  - 'no': 7
    name: 不下牌桌的能力与流程化复制
    desc: 盈利短视频团队最重要的不是内容能力，而是人不层、业务不因单一IP/运营退出而停的持续运营能力；内容营销团队最大的浪费是经验浪费，必须靠标准化流程积累和放大业务。
    role: extension
    src:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
- 'no': 6
  name: 项目风控与实验复盘 —— 从“实操案例”中提炼规律
  desc: 本章汇编多个真实项目（视频号带货、抖音盲盒、公转私）的实操复盘，重点关注风控管理、平台规则、成本收益测算及不同阶段的决策逻辑，帮助你在实践中少踩坑。
  nodes:
  - 'no': 1
    name: 财务逻辑：把号当消耗品
    desc: 做项目必须具备财务逻辑，只要创造的收入与号的成本（含运营成本）打正即可；把号视为消耗品，把心态放平，以此作为战略方向。
    role: motivation
    src:
    - paper: docs/202301-02/SvdFdfi3VoAiaRxENHNcncEqnif.md
  - 'no': 2
    name: 视频号带货7天破亿播放的复盘
    desc: 以一个“围观船员”视角记录7天4个账号10万粉、5万+利润的完整过程，展示差异化“做人群”策略、爆款生命周期衰减（第4天流量下降）以及主动缩减直播时长、引入外部基地合作的经验。
    role: experiment
    src:
    - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
  - 'no': 3
    name: 短视频矩阵自动化的变现验证
    desc: 通过朋友三个中医养生号数月变现10w左右的案例，论证自动化内容生产+矩阵化靠量获取免费流量的可行性，同时指出“RPA脚本运行会锁住电脑”等限制。
    role: experiment
    src:
    - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
    - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
  - 'no': 4
    name: 抖音盲盒项目的风控边界
    desc: 明确抖音对“跨平台引流+盲盒抽奖”双重违禁行为的打击态度，总结三类违规及处置对照（未挂载组件→轻罚可避；不确定性派发商品→常见需控时长；违反直播行为规范→可能封设备需刷机）。
    role: limitation
    src:
    - paper: docs/202301-02/SvdFdfi3VoAiaRxENHNcncEqnif.md
  - 'no': 5
    name: 平台合规性判断：自研与概率
    desc: 判断合作平台是否可靠的关键在于平台是否为源码套壳、概率是否为自研：如果均为外部购置现成，则该平台大概率是追风收割，风险极高。
    role: method
    src:
    - paper: docs/202301-02/SvdFdfi3VoAiaRxENHNcncEqnif.md
  - 'no': 6
    name: 爆款生命周期管理：热度衰减与能量分配
    desc: 视频号爆款视频在三天后流量高峰期开始衰减（如第4天播放从峰值下降），需要主动控制直播时长、引入外部合作延长变现窗口，避免流量被消耗完。
    role: limitation
