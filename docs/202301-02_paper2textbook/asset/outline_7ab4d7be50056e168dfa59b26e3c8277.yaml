  - 'no': 7
    name: 克制止损：直播要有节制意识
    desc: 直播不应因无警告或断播就持续播放，继续播流量不一定更高但账号风险必然增加；被处罚后当天不应再播，要见好就收、及时止损。
    role: limitation
