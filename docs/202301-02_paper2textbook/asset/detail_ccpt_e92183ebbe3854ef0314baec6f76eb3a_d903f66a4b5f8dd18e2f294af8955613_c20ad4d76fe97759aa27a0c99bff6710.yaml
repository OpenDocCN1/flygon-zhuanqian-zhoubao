  - 观众缘 > 表现力 > 文案（选题 > 开头 > 结构 > 结尾 ）> 场景 >剪辑
  - 观众缘，不只是观众看的舒服，还得匹配。你让个小姑娘讲中医变现一定不好。
  - 大部分老板的专业程度，不足以弥补在表现力上的差距
- 'no': 12
  name: IP手（聊天手） —— 创始人IP的“内容挖掘机”
  points:
  - '**为什么需要这个概念？**'
  - '- 创始人/专家通常“不善表达”“无时间整理”“思维跳跃”，直接让运营采访效率极低'
  - '- 运营不懂业务深度，无法挖掘高价值内容点；创始人不懂内容逻辑，无法输出可用素材'
  - '- 需要一个“懂业务+懂内容+高情商”的中间角色，连接专家大脑与内容工厂'
  - '**核心定义**'
  - '- 面向创始人/专家IP孵化项目专设岗位，核心职责：深度了解IP专业体系 → 高频沟通挖掘可表达内容 → 整理成结构化素材库 → 喂给运营写文案、演员拍摄'
  - '- 考核指标与运营对齐：选题命中率、素材转化率、账号数据（完播/互动/转化）'
  - '**关键性质**'
  - '- 翻译官角色：将专家的“专业语言”翻译为“大众内容语言”，保留专业度又降低理解门槛'
  - '- 挖掘式沟通：非访谈式问答，而是基于选题库反向追问、挖案例、找金句、抠细节'
  - '- 信任锚点：成为创始人最信任的“内容合伙人”，掌握创始人未公开的核心方法论/案例库'
  - '**典型例子**'
