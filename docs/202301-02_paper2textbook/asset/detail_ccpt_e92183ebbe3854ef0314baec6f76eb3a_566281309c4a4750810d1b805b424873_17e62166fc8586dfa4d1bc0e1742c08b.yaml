units:
- 'no': 1
  name: 流量价值公式 —— 给流量装上“规模×相关性×信任”的三维棱镜
  points:
  - '**为什么需要这个概念？**'
  - '- 我们看到一篇10万+的文章、一个爆火视频，常常被表面的流量规模震撼'
  - '- 但高曝光不一定带来高成交，仅看流量数字容易产生焦虑和误判'
  - '- 需要一个综合框架来判断流量的真实商业价值，而不被规模表象迷惑'
  - '**核心定义**'
  - '- 流量价值 = 流量规模 × 交易相关性 × 信任度'
  - '- 规模只解决连接问题，不解决交易问题；相关性与信任度才是转化关键'
  - '**关键性质**'
  - '- 三个维度是乘积关系：任一项为0，整体价值就是0'
  - '- 作为评估框架，可解释“高流量低转化”现象——规模很大但相关性或信任度很低'
  - '- 指导运营者关注流量质量与转化，而非盲目追求曝光量'
  - '**典型例子**'
  - '- 同一篇热门笔记，在精准育儿社群转发产生高转化，在泛娱乐大号转发仅带来围观'
  - '**边界条件**'
  - '- 该公式是一个定性的思考框架，而非定量计算公式，无法直接输入数字算出精确产值'
  - '- 当平台数据造假或刷量时，规模维度失真，公式评估结果也会失真'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  excerpts:
  - 流量价值=流量规模×交易相关性×信任度
  - 有时候我们面对一篇阅读量很高的文章、一篇赞藏很高的小红书笔记、一个很火的抖音视频，会感到困惑或焦虑。因为我们只看到了表层的流量规模，有些慌张，但流量规模只解决连接的问题，不解决交易的问题。比流量规模更重要的是流量相关性…信任度怎么看？有的连接带来的价值有限，这和连接给UV带来的感受有关…不轻易连接，但连接必有价值。
- 'no': 2
  name: 流量流速悖论 —— 让水流“不快不慢、持续不断”
  points:
  - '**为什么需要这个概念？**'
  - '- 流量要么来得太快一闪而过，要么积压不动，两种极端都无法产生稳定价值'
  - '- 过快时用户来不及沉淀、来不及形成信任；过慢时缺乏规模效应'
  - '- 需要理解流量流动速度与停留时长之间的平衡'
  - '**核心定义**'
  - '- 流量的价值取决于“流”与“量”的平衡：既要流动也要停留，不快不慢、持续不断'
  - '- 流量核心动作为增加用户停留时间，同时保持足够规模'
  - '**关键性质**'
  - '- 强调时间维度上的动态平衡：速度过快无法形成连接和停留，太慢则丧失规模'
  - '- 可指导运营动作的调整：控制推送节奏、设计停留钩子'
  - '- 流量价值最大化的条件：流动性与留存性并存'
  - '**典型例子**'
  - '- 直播间人流过旺但用户划走极快、停留短，成交率低；流量平缓时反而能聊出订单'
  - '**边界条件**'
  - '- 不同业务对最优流速的阈值不同：冲动消费品适合快流速，高客单价咨询适合慢流速'
  - '- 该概念是定性判断原则，难以精确量化“过快”与“过慢”的数值边界'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  excerpts:
  - 流量的速度太快、没有停留、规模再大也没有用，流量一直停留不动也不行，等于没有了规模。
  - 流量的核心是流和量，就要流动也要停留、不快不慢、持续不断，这样的流量价值才是最大的。
  - 增加用户的停留时间。
- 'no': 3
  name: 交易目的论 —— 从“有曝光”到“有交易”的价值校准
  points:
  - '**为什么需要这个概念？**'
  - '- 运营者常陷入“唯曝光论”，关注UV/PV数字却忽略交易本质'
  - '- 无转化的曝光不仅无价值，甚至可能产生负价值（用户反感、平台降权）'
  - '- 需要从交易目的出发重新审视流量价值'
  - '**核心定义**'
  - '- 从交易目的看，单纯的页面曝光（UV/PV）没有价值；有曝光无反馈的内容页面是负价值'
  - '- 一切运营动作应以交易（或促成交易的互动）为最终目的'
  - '**关键性质**'
  - '- 确立了运营的终极价值锚点：一切流量手段最终需服务于交易转化'
  - '- 隐含“互动即信号”机制：平台倾向将流量分配给有互动的内容，无互动则流量衰减'
  - '- 帮助运营者识别“自嗨式流量”：数据好看但无交易贡献'
  - '**典型例子**'
  - '- 一篇10万阅读的情感故事文，无商品链接无评论互动，商家无法变现，反而消耗用户信任'
  - '**边界条件**'
  - '- 对品牌曝光型或公益类内容，交易目的论不完全适用，需以长期心智积累为衡量'
  - '- “交易”应广义理解，包括互动、加粉、咨询等中间转化，而非仅指下单付费'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  excerpts:
  - 所以，从交易目的来看，单纯的页面曝光是没有太大价值的，如果是内容页面，有曝光无反馈反而是负价值。
  - “让该来的来，让该走的走，多不重要，合适就好，我们的目的是交易”
  - 没有互动就没有价值，平台不给流量。
- 'no': 4
  name: 流量合并 —— 让“别人的鱼塘”变成“你的鱼塘”
  points:
  - '**为什么需要这个概念？**'
  - '- 自建流量团队成本高、周期长，而市场上已有大量优质流量资产被闲置'
  - '- 需要一种方法将别人的流量转化为自己可用的资源，实现低成本扩张'
  - '- 流量合并是打破流量瓶颈的关键杠杆'
  - '**核心定义**'
  - '- 流量按所有权分为两类：自己建团队获取，或整合别人的流量'
  - '- 核心逻辑：谁能让流量主赚更多钱，谁就拥有其所有积累的流量——“流量不为我所有，但为我所用”'
  - '**关键性质**'
  - '- 本质是价值交换：通过让合作方获益来换取流量使用权'
  - '- 核心抓手是“让流量主赚更多钱的方案”，而非单纯买量或广告投放'
  - '- 可复用性高：一个成功的合并方案可复用到多个流量主'
  - '**典型例子**'
  - '- KOL积累4-5年流量，运营者设计一套方案让其卖货月赚20万，该KOL的流量全部被激活为运营者所用'
  - '**边界条件**'
  - '- 流量合并的前提是你有能让流量主“赚更多钱”的产品或方案，否则公平交换不成立'
  - '- 部分流量主有排他性合约或自营商业，无法直接合并，需先界定合作边界'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  excerpts:
  - “我自己认为世界上流量按照所有权分类只有两类：一个是自己建团队获取流量，还有一类是整合别人的流量。”
  - 谁能让流量主赚更多的钱，谁就拥有了这个流量主的流量。
  - 我们假设有一个 KOL，积累了四五年的流量…现在如果我能想一个办法出来，让他卖我的货，一个月能赚二十万，那这个人四五年积累的流量就会为我服务…在这个世界里并不缺流量，真正缺少的是把流量价值最大化的方法。
- 'no': 5
  name: 私域单客价 —— 从“一锤子买卖”到“一辈子生意”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统电商用客单价衡量单次交易价值，但在私域运营中，用户的终身价值远大于单次成交金额'
  - '- 过分关注客单价会忽略复购与转介绍带来的长期收益，低估私域价值'
  - '- 需要以单客价为核心指标来指导私域运营策略'
  - '**核心定义**'
  - '- 单客价指在私域流量运营下，单个消费者在整个生命周期内贡献的总销售额'
  - '- 核心逻辑：通过拉长用户生命周期、提升复购频次来最大化单客总贡献'
  - '**关键性质**'
  - '- 区别于客单价（单次交易金额），单客价是累计总销售额，更全面反映用户价值'
  - '- 强调复购与留存价值，与私域“连接-信任-成交-复购”的闭环逻辑匹配'
  - '- 可作为私域资产估值的基础指标'
  - '**典型例子**'
  - '- 一个健身客户第一次只买99元体验课，但持续2年购买训练营、补剂，累计贡献2万元——单客价2万远高于单次客单价99元'
  - '**边界条件**'
  - '- 单客价的计算需要时间窗口界定，不同品类（快消vs耐消）的时间跨度差异大'
  - '- 单客价高不意味着毛利高，还需结合毛利结构综合评估'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  excerpts:
  - 电商有个'客单价'的概念，而在私域流量运营的思维下，真正值得关注的不是'客单价'，而是'单客价'，就是一个消费者总共贡献了多少销售额。
- 'no': 6
  name: 实时真实ROI —— 把私域产值也算进“投产账本”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统ROI只计算直播间/广告直接产生的营业额与投放成本之比，忽略了私域沉淀带来的额外产值'
  - '- 私域产值往往是长期复利，将其纳入核算才能真实反映投放的综合收益'
  - '- 需要一套包含私域产值的综合ROI核算框架'
  - '**核心定义**'
  - '- 将私域流量产生的额外年产值计入投放产出后，综合计算得到的投产比'
  - '- 综合ROI = 纯直播+私域综合利润 / 广告投入，通常显著高于仅计算直播间的ROI'
  - '**关键性质**'
  - '- 将不计入广告成本的私域产值纳入收益端，使ROI更全面真实'
  - '- 私域进线率、私域月产值、生命周期衰减率（前3月按80%算）是核心参数'
  - '- 可解释“广告ROI凑合但整体很赚”的业务现象'
  - '**典型例子**'
  - '- 150客单价、进粉率60%、月产值8-15元条件下，只做直播ROI为2.5；计入私域产值后提升至3.5，若私域月产值翻倍可达4.5'
  - '**边界条件**'
  - '- 私域产值具有估算性质，不同产品与客户的LTV差异大，参数需按实际业务校准'
  - '- 该公式为半定量模型，公式中客户复购衰减、维护成本等变量需运营者自行补充调整'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  excerpts:
  - 做一个公式：客单价 n 的产品，毛利率如果是 q，投入 y，直播间除去退货后营业额为 z。私域进线率 60%为合格，月产值为 p。那么你只做直播间纯利润就是
    q*z-y；做私域后纯利润就是 q*z-y 每个月加上 z/n×60%×p，月递减前 3 个月按 80%算，后面看维护。
  - roi2.5 也就是我 100 万的营业额，需要有 40 万的广告投放，那么在这 40 万的投放算到私域中，我将额外有 100 万×60%×60/150=24
    万的私域营业额，这一块是无需投放的……这么一算我的 roi 就从 2.5 提升到了 3.5。
- 'no': 7
  name: 捡漏群 —— 用“1-3折商品+演员氛围”搭建的佣金变现引擎
  points:
  - '**为什么需要这个概念？**'
  - '- 传统社群运营靠低价引流但难以持续变现，群活跃度差、转化率低'
  - '- 需要一种可复制、可规模化、且能高效变现的社群模式'
  - '- 捡漏群通过超高性价比商品+精细化运营实现佣金规模化变现'
  - '**核心定义**'
  - '- 通过企业微信建立社群，用户可以用原价1-3折买到超高性价比商品，平台方通过商家佣金变现的电商模式'
  - '- 核心运营要素：稳定的企微主体、靠谱流量、精细化运营、社群规模、多重变现'
  - '**关键性质**'
  - '- 高性价比锚定用户心智，用户有“捡漏”的持续粘性'
  - '- 每天精推1个主品+配置大量演员（托）营造抢购氛围，大幅提升转化'
  - '- 生命周期约2年，2-3个月回本，单群月利润约1000元（回本后）'
  - '**典型例子**'
  - '- 一个群7000元成本，3个月回本后每月产生1000元利润，21个月纯利2.1万'
  - '- 新起盘不到1000个群，月佣金100W+；头部团队社群过万，月佣数千万'
  - '**边界条件**'
  - '- 需要稳定企业微信主体，防止封号风险'
  - '- 对选品供应链要求较高，品选不好群活跃度迅速衰减；演员氛围做不好会断崖式影响生命周期'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  excerpts:
  - 捡漏群：用户在我们的群里可以用原价的 1-3 折买到超高性价比的商品。…… 能通过售卖商品来产出佣金，实现变现。
  - 核心要点：稳定的企微主体、靠谱且稳定的流量、精细化的社群运营、社群的规模大小，以及多重变现方式。
  - 目前今年新起的盘不到 1000 个群，月佣在 100w+。
  - 假设一个社群 7000 成本，3 个月回本，之后每个月可以产生 1000 的利润，21 个月还能产生 2.1W 的纯利润。
- 'no': 8
  name: 演员氛围 —— 用“托”点燃社群羊群效应
  points:
  - '**为什么需要这个概念？**'
  - '- 空荡荡的社群难以激发用户购买冲动，用户会因“没人买”而观望犹豫'
  - '- 需要营造“大家都在抢”的从众氛围来提升转化率'
  - '- 演员（托）是低成本启动和维持社群活跃氛围的关键角色'
  - '**核心定义**'
  - '- 在捡漏群等社群中配置20-50个“演员”（托），模仿真实用户抢购、晒单、追问等行为，营造爆单和紧迫氛围'
  - '- 演员是捡漏群的灵魂，核心目的是提高社群活跃度、可信度、制造爆单假象'
  - '**关键性质**'
  - '- 有演员和没演员的社群产出相差至少一倍以上，效果显著'
  - '- 氛围不佳（演员死气沉沉）会对社群生命周期造成很大负面影响'
  - '- 演员需配合精推文案与催单节奏（4-6次递进刺激）共同发挥作用'
  - '**典型例子**'
  - '- 新主品上架时，演员先“抢”3-5单并发晒单图，真实用户看到后跟风下单'
  - '**边界条件**'
  - '- 演员数量过少（低于20）难以形成氛围，过多则成本高且有穿帮风险'
  - '- 需注意合规风险，过度使用虚假交易可能违反平台规则或消法'
  - '- 该策略适用于高情绪驱动的低价商品，不适合所有品类的社群运营'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  excerpts:
  - 一个群必须有 20 个以上的演员，确保整个群的发品节奏。演员是捡漏群的灵魂，有演员和没演员的情况，社群产出起码相差一半以上。
  - 演员目的：提高社群活跃度，可信度，爆单假象！一个群一般都要有 30-50 个托。
  - 社群的演员氛围不好，死气沉沉的话，对社群的生命周期也会造成很大的影响。
- 'no': 9
  name: 战略=选择 —— 明确“不做什么”比“做什么”更重要
  points:
  - '**为什么需要这个概念？**'
  - '- 面对无限商业机会，盲目“什么都做”会导致资源分散、执行失焦'
  - '- 明确不做什么，才能集中资源在真正优势领域形成突破'
  - '- 战略的本质不是海纳百川，而是取舍与聚焦'
  - '**核心定义**'
  - '- 战略的本质是取舍和选择，其最重要的决策在于明确不做什么，而非盲目追求做更多'
  - '**关键性质**'
  - '- 战略应以获得相对优势为目的'
  - '- 战略应形成自始至终的指导原则，而非朝令夕改'
  - '- 战略需要发挥自身禀赋，不能选择自己的劣势作为战略方向'
  - '**典型例子**'
  - '- 中式快餐不与老乡鸡比标准化，而是发挥“现炒、人情味”差异优势'
  - '**边界条件**'
  - '- 明确不做什么的前提是你已清楚自己的禀赋和优势所在，否则无从取舍'
  - '- 战略选择需伴随明确的目标，目标本身不是战略'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/202301-02/20230207_07.md
    role: improve
  excerpts:
  - 什么是战略呢？就是选择。选择，其最重要的就是不做什么，而不是做什么。
  - 战略目的是让你能获得优势或者获得相对优势。
  - 战略应该形成一种自始至终的指导原则。
  - 战略需要发挥你的禀赋。你要是跟老乡鸡、南城香比卫生、标准化、品牌力，那就错了。你应该提升你的人情味、现炒等等。这就是不能选择你的劣势来做战略方向。
- 'no': 10
  name: 增长瓶颈怪圈 —— 被“想拥有的东西”绑架的恶性循环
  points:
  - '**为什么需要这个概念？**'
  - '- 企业或个人在增长停滞时，越是拼命追求增长，反而越难实现增长'
  - '- 对增长的过度预期会使人陷入焦虑、投机和短视行为，形成恶性循环'
  - '- 需要识别这一心理与行为陷阱，跳出怪圈'
  - '**核心定义**'
  - '- 当企业或个人被增长的预期绑架，会陷入越追求增长反而距离增长越远的恶性循环'
  - '- 核心机制：投机跟风→计算利弊→抓取资源，替代了开创、用户关注与价值积累的正确习惯'
  - '**关键性质**'
  - '- 增长问题的根源多在疫情前已存在，疫情只是加重而非本质原因'
  - '- 大部分企业在大部分时间是不增长的，这是常态'
  - '- 被绑架后会出现FOMO心理、焦虑紧张、难以专注热爱之事等典型症状'
  - '**典型例子**'
  - '- 当企业进入增长瓶颈后，开始频繁跟随对手动作、计较短期利益得失、抓取流量资源，而非创新和沉淀用户价值，结果距离增长越来越远'
  - '**边界条件**'
  - '- 该概念主要适用于“曾经增长过但试图保持增长”的企业或个人，不适用于初创期从0到1阶段'
  - '- “怪圈”的突破需要价值创造视角切换，但3种勇气（面向未来/面向用户/积累价值）难以一蹴而就'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 进入增长瓶颈的一个典型现象，就是越想要增长，却距离想要的增长越远。
  - 如果用一句话来形容这种现象，那就是我们被我们想拥有的东西绑架了。
  - 再进一步的恶性循环，就是觉得这些问题的原因是自己还不够狼性、不够拼搏，所以不断压榨自己、逼迫自己，让自己活在一个焦虑紧张和对失去的害怕中（业界常说的话就是
    FOMO 心理），让自己更加难以去做自己热爱的事情，更加难以去专注，从而进一步失去优势。
- 'no': 11
  name: 价值创造视角 —— 从“我如何得到增长”到“我如何值得被奖赏增长”
  points:
  - '**为什么需要这个概念？**'
  - '- “追求增长”视角让人被预期绑架，陷入焦虑和短视行为，反而阻碍增长'
  - '- 需要根本性的视角转换，从向外索取向内修炼'
  - '- 破解增长焦虑的唯一方法是切换视角'
  - '**核心定义**'
  - '- 从“我如何得到增长”转变为“我如何成为一个值得被奖赏增长的人”，即从追求增长转向价值创造'
  - '**关键性质**'
  - '- 视角切换比方法论更重要：转化看待问题的方式，而非解决问题本身'
  - '- 需要三种勇气：面向未来而非面向过去；面向用户而非计算利弊；积累价值而非抓取资源'
  - '- 核心实践：识别当前环境中最稀缺、最不流动的资产（品牌、数据、人才、信任）并积累价值'
  - '**典型例子**'
  - '- 八项规定后大量中高端白酒降价砸牌，茅台坚持品牌为最重要资产，不牺牲品牌换销售额，长期赢得市场'
  - '**边界条件**'
  - '- 该视角需要企业有一定生存基础，完全生存无望时仍需先解决生存问题'
  - '- “识别稀缺不流动资产”在不同行业与阶段差异较大，需要较强的行业洞察力'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  - paper: docs/202301-02/20230207_07.md
    role: apply
  excerpts:
  - 我发现，破除增长焦虑唯一的方法，就是怎么从追求增长的视角，切换成价值创造的视角。
  - 从一个'我如何得到增长'，变成'我如何成为一个值得被奖赏增长的人'。
  - 真正要去摆脱这种视角，最难的不在于方法论，而是 3 种'勇气'：面向未来而非面向过去的勇气；面向用户而非计算利弊的勇气；积累价值而非抓取资源的勇气。
  - 识别在我当前的环境中，最稀缺的、最不流动的是什么，如果整体的优化目标本着这些，就会形成正向的价值积累。
- 'no': 12
  name: 利他等于利己 —— 越分享越幸运的商业“道”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人顾虑分享赚钱信息会“教会徒弟饿死师傅”，担心竞争受损'
  - '- 但事实证明，越利他回报越大，信息是越分享越多的资源'
  - '- 需要破除“零和博弈”思维，建立分享共赢的商业心态'
  - '**核心定义**'
  - '- 乐于分享好信息、好方法不藏私，不仅不会因竞争受损，反而因分享获得更大回报和更多信息回流'
  - '**关键性质**'
  - '- 信息是稀缺资源，但分享不消耗存量反而带来增量'
  - '- 利他行为能积累信任资产，信任是成交的前提'
  - '- 市场足够大，不存在“蛋糕分完”的问题，价值创造的边界是无限的'
  - '**典型例子**'
  - '- 作者坚持分享赚钱信息，不仅未失去优势，反而获得更多信息回馈与合作机会'
  - '**边界条件**'
  - '- 利他分享需以自身核心壁垒稳固为前提，完全无壁垒的核心技术机密仍需保护'
  - '- 利他不是无条件“白给”，而是建立在价值交换与长期共赢的逻辑上，需避免被白嫖'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  excerpts:
  - 利他等于利己，越分享越幸运。
  - 曾有朋友反问我，你就不怕你把赚钱的信息分享出去，别人抢了你的蛋糕？…事实证明，你越利他，你得到的回报会更大。现在最稀缺的就是信息…这市场这么大，蛋糕分的完吗？
- 'no': 13
  name: 财富积累四阶段 —— 出卖劳动力只能“温饱”，钱生钱才能“自由”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人困在“出卖劳动力”的第一阶段，靠时间换钱，收入天花板极低'
  - '- 不理解财富进阶逻辑，甚至试图跳跃式致富，反而踩坑'
  - '- 需要一张清晰的财富积累地图来指导路径选择与努力方向'
  - '**核心定义**'
  - '- 人群按赚钱方式划分为四个递进阶段：出卖劳动力（打工）、一份时间多次卖（写书/卖课）、购买他人时间（当老板）、钱生钱（投资），且必须依次跃迁，不可跳跃'
  - '**关键性质**'
  - '- 由低到高：出卖劳动力（时间单次出卖）→ 一份时间多次卖（知识产权）→ 购买他人时间（组织杠杆）→ 钱生钱（资本杠杆）'
  - '- 每一阶段对应一个人生阶段：初入职场（扩广度）、中年危机（做管理）、第二曲线（副业）、复制商业放大'
  - '- 跃迁不可跳过：比喻为“爬楼梯”，跳过一层将缺乏对应的能力与资源基础'
  - '**典型例子**'
  - '- 打工者（阶段一）→ 写书/录课作者（阶段二）→ 开公司雇人（阶段三）→ 投资理财（阶段四）'
  - '**边界条件**'
  - '- “不可跳跃”是理想的线性路径描述，实际中部分人能通过特殊机遇（如大厂期权）部分跳跃'
  - '- 阶段之间没有绝对边界，一个人可同时处于多个阶段（如打工时做副业卖课）'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  excerpts:
  - 财富积累分为四个阶段，第一：出卖劳动力；第二：一份时间多次卖；第三：购买他人时间；第四：钱生钱。
  - 第一阶段，出卖劳动力…第二阶段是一份时间多次卖…第三个阶段是什么？购买他人时间…第四个阶段，就是去钱生钱了…你就是投资。
  - 人生四个阶段，第一阶段：初入职场（30 岁以前）…在这个阶段你要不断的长见识，要不断的去尝试不同的行业、不同的岗位、不同的职业…第二阶段，中年危机，在这个阶段一定要去做管理…第三个阶段的话，其实我就是你要开始在你的主业以外，你要去寻找自己的第二曲线…第四个阶段其实就是你在第二曲线找到了一个
    MVP…然后组建团队给它放大。
- 'no': 14
  name: 战略发挥优势 —— 手里有什么牌，再决定怎么打
  points:
  - '**为什么需要这个概念？**'
  - '- 很多战略是从“我想要什么”出发，而非“我有什么”出发，导致方向偏离实际'
  - '- 忽视自身禀赋而盲目对标强者，选择劣势领域作战，注定失败'
  - '- 需要一套基于自身优势制定战略的思考框架'
  - '**核心定义**'
  - '- 战略的核心是先审视自己手里的筹码（优势），再决定怎么打牌（如何运用优势获得结果）'
  - '- 执行战略的核心思路是发挥优势、补齐短板；不能选择自己的劣势作为战略方向'
  - '**关键性质**'
  - '- 从资源禀赋出发，而非从愿望出发：以牌定打法，而非以打法定牌'
  - '- 劣势不可作为战略方向选择，但可适当补足'
  - '- 可用于个人定位、企业战略及国家战略分析等多个层面'
  - '**典型例子**'
  - '- 美国对苏“强加成本”战略：利用苏联国土纵深大、防空成本高的劣势，持续放血拖垮对方'
  - '- 中式快餐发挥“现炒、人情味”优势，不与连锁巨头比标准化'
  - '**边界条件**'
  - '- 发挥优势的前提是能清晰识别自身核心优势，优势识别本身有难度'
  - '- 仅“发挥优势”不够，还需结合市场环境与客户需求的匹配度，优势不符合需求则无用'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/202301-02/20230207_07.md
    role: improve
  excerpts:
  - 战略就是先审视自己手里的筹码，也就是自己的优势，然后再决定自己怎么打牌，也就是如何运用自己的优势来获得你想要的结果。
  - 在执行战略的时有个核心的思路，就是要发挥自己的优势。
  - 因为苏联有几个弱点：国土面积太大（这在面对德国侵略时是优点，纵深比较好），防守成本很高，苏联还非常重视国土防空。
  - 美国的战略就是，让苏联承受越来越多的费用和成本。
