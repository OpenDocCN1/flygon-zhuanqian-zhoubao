  excerpts:
  - 一份有效的劳动合同必须包含岗位考核表、公司规章制度、廉洁自律协议、员工保密协议等附件；劳动合同等同一把枪，附件是子弹——枪再好没有子弹也无济于事。
  - 处理被辞退员工时公司只能尽量减少损失而无法完全避免：安排会表达的人去谈、引导签署离职表（原因写个人原因且公司不盖章）、离职当天结清工资、收集证据备不时之需。
  - 我的方案可以分成三个步骤：1、做容易亏钱的事。2、投入足够多的钱。3、坚持到底。坚定选择只有少数人能够赚钱的项目...要带着一夜暴富的追求，伴随破釜沉舟的气势...一次上大仓位，最好配上杠杆...赚钱了不止盈，亏钱了不止损。
  - 在线内容发布平台对上传内容进行自动或人工违规判定，导致内容无法正常公开显示；应对方式包括提供离线版分发渠道、征集用户敏感内容反馈、修订后重新上传。
  - 本人创业 10 年创业失败 4 次，负债百万靠自媒体上的岸…不够刚需的事情现在一律不敢做了…最终是项目的本性成就人，而不是人去推动一个不够刚需的项目。
  - 目前我们普通人能接触到的互联网项目不是科研项目，本质上讲几乎是没有任何壁垒的……所以市面上所有项目培训的本质就是付费买别人的试错经验和时间。
  - 第二种是直播手机，目前市场上很多在卖tiktok无人直播手机...时间短的仅仅十分钟，直播间就不见人了，慢的话跑个十天半个月的也就不行了...硬改设备我不建议尝试。
  - 之前我也跟小二聊过，他们会给商家预留10%左右的利润空间，对商家中报价超过1688同款比较多的，直接视为没有诚意，会减少跟这类商家的合作。
  - 敬畏市场并与市场共舞；年轻团队领袖要保护团队免受市场崩塌的连锁反应（如FTX暴雷）；在资金弹药充裕的基建公司工作是熊市更优选择。
  - 因预算远超预期、无个体和公司执照、工期15-20天对热点太长、流量99%来自公众号等原因放弃AI绘画小程序开发——理性评估门槛后选择止损而非盲目投入。
