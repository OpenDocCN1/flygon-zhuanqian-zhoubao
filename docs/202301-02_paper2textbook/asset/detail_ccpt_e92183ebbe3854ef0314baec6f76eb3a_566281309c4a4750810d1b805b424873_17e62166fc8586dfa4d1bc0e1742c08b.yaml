  name: 趋势判断与机会窗口 —— 从“看数据”到“抓红利”
  points:
  - '**为什么需要这个概念？**'
  - '- 通过数据推演和行业类比判断确定性窗口期：香港疫情数据类比推演大陆首轮感染后有2-3个月平稳期，2023年春天是相对确定的稳定期，是生意人与投资者看重的窗口期。'
  - '- 平台电商演进有四个周期（铺货、动销、精细化、玩趋势），底层逻辑相通，可用来预判新平台（美团、TEMU）机会——视频号与抖音历史进程何其相似。'
  - '- 面对流量热点，技术驱动者用已备好技术基础设施最小成本快速响应：注册域名公众号/小程序、接入API、做镜像站，抢占搜索流量首位。'
  - '- 赚钱机会往往隐藏在身边，源于多数人未发现的信息差；网上说做什么小项目月入多少的基本已过时。'
  - '**核心定义**'
  - '- 确定性窗口期：从疫情数据推演商业机会，如香港数据类比大陆首轮感染后2-3个月平稳期，2023年春天是全年最重要的3个月窗口期。'
  - '- 平台电商四周期：铺货期（鼓励资源涌入，适合激进投放）→ 动销期→ 精细化期→ 玩趋势期（存量期重生态建设，需从自身找原因）。'
  - '- 热点套利技术栈：技术基础设施决定响应速度，ChatGPT热度起来后十几分钟写代码成全网首个集成公众号，消耗近50万次请求。'
  - '- 需求共振：商品销售与目标用户季节性需求（如学生暑假对台灯需求增加）高峰期重合，利用此规律提升销量。'
  - '- 信息差生意：身边被忽视的赚钱机会，源于多数人未发现的信息差。'
  - '**关键性质**'
  - '- 行业机会切入点：旅游/健康/餐饮三行业。旅游做产品分销套利（机票/酒店/景点）；健康做保健养生带货；餐饮紧扣春季爆发需求。'
  - '- 旅游复苏数据：春节国内旅游3亿人次恢复至2019年88.6%，出境机票订单涨258%、入境预定涨632%、国际酒店预定增177%。'
  - '- 健康带货火爆：多个保健品品牌抖音销量过亿，诺特兰德维生素片连续两月抖音直播单品销量第一，养生书单/茶/推拿小课程适合普通人带货。'
  - '- 美团电商红利验证：8月末发现机会<2个月从0跑通扩展到30店，类目不同单店月利润6k-12k（零运营未优化），首店MVP仅花80元。'
  - '- SEO长尾福利：SEO思维发布内容即使3-5年后依然享受流量福利，发<200篇内容后大半个月不更新也每天有人主动咨询。'
  - '**典型例子**'
  - '- 香港疫情数据类比推演大陆平稳期，2023年春天“先干个春天再说”。'
  - '- 旅游/健康/餐饮三行业春天爆发数据验证。'
  - '- 美团电商：不到两个月30家店，单店月利润6k-12k，验证新平台初期红利效应。'
  - '- ChatGPT热点套利：十几分钟注册公众号“ChatGPT中文版”、接入API、做镜像站套娃小程序，全网首个集成，消耗近50万请求。'
  - '- 台灯需求共振：预测6月底暑假旺季，72个台灯旺季单日最高卖9个。'
  - '- 身边信息差案例：苏州AO图文专做广告牌开70家店、四线城市烤面筋三轮车月入过万、大学生朋友圈卖螃蟹年入约1.2万。'
  - '**边界条件**'
  - '- 反期望：逆向操作也不能保证赚钱，因为“赚钱方式千差万别，亏钱方式殊途同归”，亏钱是赚钱路上不可缺少部分。'
  - '- 平台存量期需合规：增长期激进投放，存量期重生态建设，需从自身找原因（合规、素材原创、发货时效），否则被清理。'
  - '- 赛道热度与SEO长尾：热门/冷门赛道数据优秀有抬价优势；SEO内容长尾福利持久。'
  - '- Web3新人23条建议：小成本试错、不玩杠杆合约、保护资产、好机会重仓>平庸机会轻仓、会卖比会买重要、人声鼎沸时一定要跑（见好就收、有利必跑、狠心出货、切勿幻想、变现为王）。'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_07.md
    role: origin
  - paper: docs/202301-02/20230207_11.md
    role: improve
  excerpts:
  - 通过香港疫情数据类比推演：大陆首轮大规模感染后有2-3个月疫情平稳期，之后才进入第二波感染峰值——2023年春天是相对确定的稳定期，是生意人与投资者看重的窗口期。
  - 基于疫情平稳期共识，2023年春天可能是全年最重要的3个月窗口期；行业恢复最猛，普通人应“先干个春天再说”。
  - 从平台电商的历史出发，我把美团的发展分为了四个周期：铺货、动销、精细化、玩趋势。所有平台演变的底层逻辑是相通的。
  - 最重要的是要打造好自己的或者团队的技术基础设施，这样可以用最短的时间来迎接风口...我又花了十几分钟，写了几十行代码，成了全网首个把'ChatGPT'集成到公众号的人。
  - 身边赚钱的机会其实还是很多的，只是你没有发现，这个就是大家所说的信息差。先有闷声发大财，网上说做什么小项目一个月可以赚多少钱的，基本是已经过时了。
  - 春节国内旅游人次达3亿，恢复到2019年同期88.6%；出境机票订单量上涨258%、入境预定量上涨632%、国际酒店预定量同比增长177%。
  - 多个保健品品牌抖音销量过亿；诺特兰德维生素片连续两个月为抖音直播单品销量第一。
  - 美团电商成长为团队的第二曲线，类目不同单店月利润6k-12k（零运营未优化）...第一家店跑通最小MVP仅仅花费了80元。
  - 用SEO思维去发布的内容，那怕3年5年你依然可以享受到这个内容的福利。
  - 我通过往年的台灯数据以及生活的经验，预测6月底之后会迎来台灯的小旺季...旺季时7月单日最高峰卖出9个台灯。
  - 如果你要问，那我反着来，就能保证赚钱吗？我也希望可以，但很不幸不能...舍弃了亏钱，就意味着舍弃赚钱。
- 'no': 9
  name: 风险管理与合规底线 —— 从“踩坑复盘”到“稳健经营”
  points:
  - '**为什么需要这个概念？**'
  - '- 劳动合同必须包含岗位考核表、公司规章制度、廉洁自律协议、员工保密协议等附件；合同是枪、附件是子弹——枪再好没子弹也无济于事。'
  - '- 处理被辞退员工只能尽量减少损失而无法完全避免：安排会表达的人谈、引导签署离职表（原因写个人原因且公司不盖章）、离职当天结清工资、收集证据备不时之需。'
  - '- 平台内容合规审核会导致内容无法正常显示；应对方式：提供离线版分发渠道、征集用户敏感内容反馈、修订后重新上传。'
  - '- 非刚需项目本性成就人而非人推动项目：10年创业失败4次、负债百万靠自媒体上岸，总结“不够刚需链条太长推不动”。'
  - '- 没有壁垒的项目本质是付费买试错经验：普通人能接触的互联网项目几乎无绝对核心壁垒，培训本质是让用户付费购买别人的试错经验和时间。'
  - '**核心定义**'
  - '- 劳动合同有效性：必须包含岗位考核表、公司规章制度、廉洁自律协议、员工保密协议等附件。'
  - '- 辞退损失最小化：只能减少损失无法完全避免，核心动作：会表达的人谈、签离职表（个人原因不盖章）、当天结清工资、收集证据。'
  - '- 优雅亏大钱三步骤（反讽式）：做容易亏钱的事（选少数人能赚钱或看不懂项目）→ 投入足够多钱（加杠杆/高频交易）→ 坚持到底（赚钱不止盈亏钱不止损），反向提醒规避。'
  - '- 平台风控本质：通过分析限流逻辑、违禁词、处罚机制，反向推导平台流量分配偏好，进而通过合规或规避获得更多流量。'
  - '- 理性止损：因预算超期、无执照、工期过长、流量依赖单一渠道等理由放弃AI绘画小程序开发，理性评估门槛后选择止损而非盲目投入。'
  - '**关键性质**'
  - '- 劳动纠纷三案例：品牌部张先生赔22500元、运营部徐女士赔4500元、短视频部李女士赔2500元，总结：合同须及时签（特别是节假日）、建立考核表和周考核、完善合同体系。'
  - '- TikTok无人直播设备风险：硬改手机寿命10分钟至10天不等，卖手机是“一锤子买卖”；朋友买五六十部谷歌3手机后风控直播间进不去，卖家不解决。基本一个员工2-3个号，电脑二手1500、手机二手600-800。'
  - '- TEMU低价标品议价空间极小：小二预留10%利润，报价超1688同款视为“无诚意”压价至持平或更低，需侧重非标品。'
  - '- Web3熊市生存法则：敬畏市场与市场共舞；年轻团队领袖保护团队免受崩塌连锁反应（如FTX暴雷）；资金弹药充裕的基建公司工作是熊市更优选择。'
  - '- 星云IP计划生态构想：头部玩家构建IP聚合生态（20个S级IP、年2亿盘子、北京市版权局战略试点），S级基因为核心的产业群组通过理论/执行/变现/人才端协同形成终极护城河。'
  - '**典型例子**'
  - '- 劳动纠纷赔付：三个真实案例总赔付2.95万，暴露合同未及时签、缺考核表等管理漏洞。'
  - '- AI绘画小程序放弃决策：预算远超预期、无个体/公司执照、工期15-20天对热点太长、流量99%来自公众号，理性止损。'
  - '- 非刚需项目失败：10年创业失败4次、负债百万靠自媒体上岸，结论“非刚需项目都别做”。'
  - '- Web3市场规模信号：10年创造3万亿流动价值、Polychain/Paradigm/a16z管理数十亿至数百亿美元、全球对冲基金计划5年内投入7%资产。'
  - '**边界条件**'
  - '- 合同是枪附件是子弹：劳动合同无附件等于没子弹的枪，无法有效管控风险。'
  - '- 辞退只能最小化损失：无法完全规避劳动纠纷风险，只能通过流程控制降低损失。'
  - '- 平台规则敬畏：引流对平台是“强盗行为”，平台为保护流量做诸多限制，需基于账号/笔记/对话框三大场景花式表达绕过检测。'
  - '- 优雅亏钱三步骤是反讽警示：实际操作中应反向规避这三步（选懂项目、控制仓位止损、不死扛）。'
  - '- 硬改设备不可控：TikTok无人直播硬改手机寿命极短且不可控，卖手机者不负责售后，建议不尝试。'
