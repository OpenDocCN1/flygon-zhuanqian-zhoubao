learning_targets:
- 理解副业失败的核心原因：陷入“产品思维”而非“信息差思维”
- 掌握商业项目拆解的八步法与可复制性三判据
- 熟练运用六维评估模型给项目“算账”：三效率决定可复制性，三财务决定天花板
- 能对标拆解真实案例（小说推文 vs 教育资料 2.0），识别关键变量（客单价/复购率）对收入的放大作用
- 建立全书“发现→验证→运营→放大”四部曲心智地图，明确各章节在闭环中的定位与依赖关系
- 树立“后发制人”复制心法：只做已验证、货源可寻、场景确定的项目，设定止损点规避沉没成本
concept_map:
- 副业变现底层逻辑
- ├── 核心范式转移：从“造产品”到“拆项目、算账、走流程”
- │   ├── 产品思维 vs 信息差思维
- │   ├── 后发制人原则（复制已验证模型）
- │   └── 核心公式：收入 = 流量 × 转化 × 客单价 × 复购
- ├── 商业项目拆解（八步法）
- │   ├── 找项目 → 建立项目库
- │   ├── 拆流量（形式/渠道/投放/素材）
- │   ├── 拆转化（路径/周期/话术SOP）
- │   ├── 拆交付（形态/客单价/毛利/标准化）
- │   ├── 评估可复制性（三判据：爆得偶然/货源可寻/场景验证）
- │   ├── 定策略（复制/微创新）
- │   ├── 搭团队（产品/流量/转化端分工）
- │   └── 强执行（前提）
- ├── 六维评估模型（标尺）
- │   ├── 效率维度（决定可复制性）
- │   │   ├── 流量效率：时间少、素材易、流量大
- │   │   ├── 销转效率：专业度低、能SOP、一对多
- │   │   └── 交付效率：耗时少、人力少、支付即完成为最高
- │   └── 财务维度（决定天花板/补偿机制）
- │       ├── 客单价
- │       ├── 毛利率
- │       └── 复购率
- ├── 案例对比实战（变量隔离）
- │   ├── 小说推文：三高三低 → 天花板 2万
- │   ├── 教育资料 1.0：同小说推文
- │   ├── 教育资料 2.0：引入高客单价合作 → 天花板 100万
- │   ├── 项目拆解 IP：低流/低交付 + 高价/高利 → 月入 10-200万
- │   └── 知识付费（李一舟）：六维全高 + 毛利 100% → 月入 10-500万
- └── 全书框架四部曲
- '    ├── 第一部：建立项目库（Ch.2 发现与筛选）'
- '    ├── 第二部：开发最小产品（Ch.3 产品孵化：卖空气/软文先行/MVP）'
- '    ├── 第三部：流量与转化运营（Ch.4 流量收割、Ch.5 交付管理）'
- '    └── 第四部：三大杠杆放大（Ch.6 放大：人力/技术/资源杠杆）'
life_analogy:
- 想象做副业像**“开一家加盟店”而非“发明新菜”**：
- '- **产品思维** = 自己在厨房闭门研发秘制酱料（高风险、长周期、无人买单）'
- '- **信息差思维** = 考察街对面排队店的“招牌菜、供应链、引流海报、外卖打包流程”，照抄核心、微调细节开自家分店'
- '- **六维模型** = 加盟总部的“选址评估表”：人流量大不大（流量效率）、出餐快不快（交付效率）、加盟费多少（客单价）、回本快不快（毛利率）、老客回头率（复购率）'
- '- **项目拆解** = 把对面店“拆成零件”：招牌怎么挂、菜单怎么排、外卖怎么接、食材找谁买'
- '- **卖空气/MVP** = 还没装修好就先在朋友圈发海报收定金，收不够就不开工（止损）'
- '- **三大杠杆** = 雇兼职学徒（人力）、买自动炒菜机（技术）、谈食材团购价（资源）'
- 就像成熟加盟体系：先跑通单店模型（MVP），再标准化复制（矩阵/加盟），最后用杠杆放大规模。
summary:
- concept: 产品思维 vs 信息差思维
  desc: 副业成败分水岭：前者闭门造车，后者拆解复制已验证商业模式
- concept: 后发制人原则
  desc: 只做别人跑通3个月以上、货源非独家、消费场景验证有需求的项目
- concept: 商业项目拆解八步法
  desc: 找项目→拆流量→拆转化→拆交付→评估→定策略→搭团队→强执行
- concept: 可复制性三判据
  desc: 爆得不偶然、货源他人可寻、消费场景验证有需求
- concept: 六维评估模型
  desc: 流量/销转/交付效率（定可复制性）+ 客单价/毛利率/复购率（定天花板/补偿）
- concept: 三效率决定可复制性
  desc: 三效率全高则收入取决于流量；任一低则难放大，需靠三财务补
- concept: 六维及格线
  desc: 六维满足≥4个为及格；效率维度不足时必须用财务维度补偿
- concept: 小说推文 vs 教育资料 2.0
  desc: 同赛道仅改客单价/转化链路，收入天花板从 2万跃升至 100万
- concept: 项目拆解 IP 补偿机制
  desc: 低流量/低交付效率 + 高客单价(几千-六位数)/高毛利(70%+) = 月入 10-200万
- concept: 全书四部曲
  desc: 建库（选赛道）→ MVP（卖空气/软文先行）→ 运营（公域截流/私域成交/双案管理）→ 放大（人力/技术/资源杠杆）
- concept: 止损点
  desc: 设定时间/金钱/资源最大投入界限，达标未果即停止，避免沉没成本
- concept: 喂养算法
  desc: 主动点赞/收藏/停留商业内容，驯养平台算法成“商业雷达”
- concept: 策划案 + 执行案
  desc: 策划案定方向（货盘/目标/里程碑/止损），执行案保落地（时间/事项/责任人/红绿灯标记）
exercises:
- 'no': 1
  title: 六维模型实战标注
  contents:
  - 选取一个你熟悉的副业项目（如：闲鱼无货源、公众号流量主、知识付费社群、同城相亲群）：
  - 1. 在六个维度（流量效率、销转效率、交付效率、客单价、毛利率、复购率）上分别标注“高/中/低”或具体数值
  - 2. 判断：该项目满足几个维度？是否达及格线（≥4）？
  - 3. 若三效率有一项偏低，该项目靠哪个财务维度（客单价/毛利/复购）在补偿？
  - 4. 给出月收益区间预估，并说明理由
  - 回答问题：
  - '- 如果想把该项目月收益提升 10 倍，优先优化哪个维度？为什么？'
  - '- 若你要复制该项目到另一平台，六维评分会如何变化？'
- 'no': 2
  title: 商业项目拆解复盘
  contents:
  - 在抖音/小红书/视频号找一个近 30 天持续出单的同行账号（粉丝 1-10 万，非头部大V）：
  - 1. 拆流量：内容形式？发布频次？素材来源？是否投放？
  - 2. 拆转化：引流钩子？成交路径（直播/私域/小程序）？转化话术是否 SOP？
  - 3. 拆交付：产品形态？客单价？交付耗时？是否可标准化？
  - 4. 套用“可复制性三判据”打分：爆款偶然性(1-10)、货源可寻度(1-10)、场景验证度(1-10)
  - 5. 写出该项目的“策划案”草稿：货盘结构、目标、里程碑、止损点
  - 回答问题：
  - '- 该项目的核心护城河是什么？你能复制吗？'
  - '- 若你入场，会在哪个环节做“微创新”？（材质/流程/话术/渠道）'
- 'no': 3
  title: 喂养算法 & 项目库建立（7天挑战）
  contents:
  - 连续 7 天，每天在抖音/小红书/视频号花 30 分钟：
  - 1. 搜索关键词：副业、赚钱、项目拆解、行业名词（如：宠物、母婴、跨境）
  - 2. 对出现的商业类内容：点赞、收藏、完读、评论“有用”
  - 3. 每天记录 3 个有完整“流量→转化→交付”闭环的项目片段（截图/链接）
  - 4. 第 8 天整理飞书表格，按八步法字段填入：项目名、赛道、渠道、内容形式、引流钩子、转化路径、产品形态、客单价、交付方式、同行坚持时长
  - 5. 给每个项目打六维分（高/中/低），筛选得分最高的 1 个作为下一阶段复制目标
  - 回答问题：
  - '- 算法推荐的商业内容质量随天数如何变化？'
  - '- 哪个渠道的“信息密度”最高？（有效项目片段 / 刷屏时长）'
  - '- 你筛选出的目标项目，止损点设在哪里？（时间/金钱/资源上限）'
- 'no': 4
  title: MVP“卖空气”预售测试
  contents:
  - 基于练习 3 筛选出的目标项目，设计一个“卖空气”预售验证：
  - 1. 产出：一张交付承诺海报/文档（含：产品名、核心卖点、价格、交付时间、退款承诺）
  - 2. 分发：发至 3 个精准社群/朋友圈/私信 20 个种子用户
  - 3. 指标：48 小时内，有多少人表达付费意向？多少人实际付款？
  - 4. 复盘：若付费人数 < 3，分析是“流量不精准”“价值未打动”“信任不足”还是“伪需求”？
  - 回答问题：
  - '- 预售价格设定逻辑是什么？（成本+、价值锚点、竞品对标）'
  - '- 若预售失败，你的止损点触发了吗？接下来怎么调整？'
units:
- 'no': 1
  name: 副业核心范式转移 —— 从“造产品”到“拆项目、算账、走流程”
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数副业失败，是因为陷入‘产品思维’：闭门造车开发产品，却无流量、无转化、无交付闭环'
  - '- 成功的副业本质是‘信息差思维’：发现已验证的商业模式，拆解其流量、转化、交付链路，低成本复制放大'
  - '- 普通人缺乏资源与容错率，需用‘后发制人’策略，避开‘从0到1’的创新风险，走‘从1到N’的复制之路'
  - '**核心定义**'
  - '- 副业变现的底层逻辑：选赛道（基本盘）→ 定渠道（流量源）→ 搭转化（成交链路）→ 定交付（产品形态）→ 算六维账（评估可复制性）→ 定策划案/执行案（落地）→
    加杠杆（放大）'
  - '- 核心公式：收入 = 流量 × 转化率 × 客单价 × 复购率，六维模型将其拆解为三效率（流量/销转/交付）+ 三财务（客单价/毛利/复购）'
  - '**关键性质**'
  - '- 可复制性：不依赖天赋与运气，依赖标准化流程（SOP）与已验证模型'
  - '- 低成本试错：通过‘卖空气’/MVP预售验证需求，单项目投入可控制在低水平'
  - '- 组合拳打法：单一项目天花板低，需通过‘1+1+1项目矩阵’或‘矩阵化账号’实现收入放大'
  - '**典型例子**'
  - '- 儿童游乐项目：拆解抖音爆款视频（8.4w赞、3000+评论咨询），3个月组建团队复制加盟模式，收入40万'
  - '- 文川手写Logo：拆解设计类账号评论区需求，外包大学生设计，中间赚差价，月入几万'
  - '- 抓娃娃卖娃娃+收徒：一年卖娃娃40万，收599元学费教技巧，合计年入百万，演示‘二次变现’威力'
  - '**边界条件**'
  - '- 仅适用于‘货源非独家、消费场景已验证、爆款非偶然’的项目（商业拆解可复制性三判据）'
  - '- 核心前提是‘前端流量已打通’：私域只是渠道，无前端流量一切归零'
  - '- 需具备基本的‘喂养算法’与‘搜索挖掘’情报获取能力，否则无源之水'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: improve
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: apply
  excerpts:
  - 私域只是一个渠道，是帮助我们企业更好地跟客户建立关系和发展粘性的一个渠道，其实更重要的是前端的流量，你有没有打开流量，每个月是否有稳定的流量进来。
  - 任何项目都可以拆解成：「流量效率，销转效率，交付效率，客单价，毛利率，复购率」，这六个点
  - 软件的本质就是软文。软件开发出来，怎么推广？还是通过写文章，发广告，介绍你这个软件，软件的最终的展现方式还是软文
  - 有一个词叫做后发制人。就是你去做别人做过的事情，将其进行复制或者二次创作。
  - 止损点什么意思呢？就是你做这个事情不用继续了，你做这个事情的最大限度，你能够承担多大的损失。
- 'no': 2
  name: 商业项目拆解 —— 把“赚钱的别人”拆成“可复制的零件”
  points:
  - '**为什么需要这个概念？**'
  - '- 看到别人赚钱不等于能复制，必须拆解出：流量从哪来？怎么转化？产品怎么交付？成本多少？才能判断‘我能不能做’'
  - '- 避免‘只模仿表面’：很多新手只学内容形式，不懂后端转化链路，导致有流量不变现、变现不交付'
  - '**核心定义**'
  - '- 商业项目拆解：对一个已验证盈利的项目，按‘找项目→拆流量→拆转化→拆产品交付→评估可复制/可持续→定策略→搭团队→强执行’八步法进行结构化拆解'
  - '- 核心产出：可执行的‘策划案’（产品货盘、运营策略、目标、里程碑、止损点、放大点）与‘执行案’（时间、地点、事项、责任人、阶段目标）'
  - '**关键性质**'
  - '- 拆流量：看引流内容形式（口播/图文/视频）、渠道（抖音/小红书/搜索）、是否投放、素材来源与生产难度'
  - '- 拆转化：看成交路径（直播间/私域社群/朋友圈/一对一）、转化周期、话术SOP化程度'
  - '- 拆交付：看产品形态（实物/虚拟/服务/加盟）、客单价、毛利率、交付耗时、是否可标准化'
  - '- 评估可复制性‘三判据’：爆得是否偶然？货源他人能否寻？消费场景是否验证有需求？'
  - '**典型例子**'
  - '- 艺术签名账号：拆解发现小红书笔记爆发概率大，引流微信9.9元/单，免费素材网交付，日单几十，月入数千'
  - '- 飞纸牌切水果：爱好者发视频爆火→开线下教学班899元/人→10天速成，展示‘技能变现’拆解路径'
  - '**边界条件**'
  - '- 无法拆解‘个人IP强绑定’的项目（如头部网红个人魅力驱动），因核心资产不可复制'
  - '- 同行坚持不足3个月的项目，大概率未验证盈利模型，不可入库'
  - '- 需投入5-10万以上资金/资源的项目，超出个人副业承受范围，需设止损点排除'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: apply
  excerpts:
  - 1、找项目。建立项目库。 2、拆流量。它是通过什么方式引流？是不是固定的内容分享方式去引流的？还是投放？ 3、拆转化。它是通过什么转化？直接在直播间里面卖、还是引流到私域后通过社群转化？
    4、拆产品交付。这个产品是有形的产品，还是无形的产品？
  - 首先，这个视频爆得偶然；其次，他货源不是他自己的，也就是说我可以通过别的方式找到他的货源；最后，这个消费场景经过验证是证明是有需求的。
  - 策划案，包括你产品货盘是什么... 执行案是什么呢？某一年某一月的核心工作事项... 完成的时候要把它标绿，然后未完成或者延期的要把它标红。
- 'no': 3
  name: 六维评估模型 —— 给项目算一笔“复制账”
  points:
  - '**为什么需要这个概念？**'
  - '- 直觉判断项目靠不住：有的项目流量大但不赚钱，有的客单价高但交付累死人，需要一把‘标尺’量化对比'
  - '- 决策‘做还是不做’、‘怎么放大’：三效率决定能否复制放大，三财务决定收入天花板，缺一项补一项'
  - '**核心定义**'
  - '- 六维指标体系：'
  - '  1. 流量效率 = 时间少 + 素材易 + 流量大（指标：时间、素材难度、流量量级）'
  - '  2. 销转效率 = 专业度低 + 可SOP + 一对多（指标：专业度/销售时间利用率）'
  - '  3. 交付效率 = 耗时少 + 人力少（指标：时间/人力，支付即交付为最高）'
  - '  4. 客单价：单次交易金额'
  - '  5. 毛利率：(收入-直接成本)/收入'
  - '  6. 复购率：用户重复购买比例'
  - '- 及格线：六维满足≥4个；三效率全高→看流量定收入；任一效率低→必靠三财务补'
  - '**关键性质**'
  - '- 诊断功能：如‘项目拆解IP’流量效率低、交付效率低，但靠高客单价(几千-六位数)+高毛利(70%+)补齐，月入10-200万'
  - '- 优化指南：小说推文三效率全高但客单价低/复购低→天花板2万；教育资料2.0引入高客单价合作→天花板升至100万'
  - '**典型例子**'
  - '- 减肥食谱：三效率中高、复购率高(减肥是重复过程)→月入10-200万，展示‘复购率’的杠杆作用'
  - '- 知识付费(李一舟)：六维全高、毛利率100%→月入10-500万，展示‘零边际成本产品’的极致形态'
  - '**边界条件**'
  - '- 仅适用于‘标品/半标品’项目，强服务定制化项目（如高端咨询）交付效率天然低，需单独建模'
  - '- 数据来源须真实：流量、转化、客单价需实测或同行验证，不可拍脑袋估算'
  - '- 忽略‘品牌资产’等长期隐性价值，仅评估显性财务与效率指标'
  sources:
