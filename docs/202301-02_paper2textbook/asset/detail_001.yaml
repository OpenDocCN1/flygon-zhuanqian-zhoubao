  name: 本书框架预览 —— 从项目库到产品、运营、放大四部曲
  points:
  - '**为什么需要这个概念？**'
  - '- 读者需建立全书心智地图：理解各章节如何串联成‘发现→验证→运营→放大’完整闭环'
  - '- 避免‘学了前面忘后面’：明确学习路径，知晓当前章节在整体框架中的定位与前置依赖'
  - '**核心定义**'
  - '- 全书四部曲逻辑链：'
  - '  第一部：建立项目库（第2章《发现与筛选》）—— 像猎人一样建立情报库，用六维模型筛选项目'
  - '  第二部：开发最小产品（第3章《产品孵化》）—— ‘卖空气’/软文先行/非规范化生产，极低成本验证需求'
  - '  第三部：流量与转化运营（第4章《流量收割》、第5章《交付与项目管理》）—— 公域截流、私域成交、双案管理、止损控风险'
  - '  第四部：三大杠杆放大（第6章《放大与变现》）—— 人力杠杆(SOP+兼职)、技术杠杆(爬虫/自动化)、资源杠杆，实现1到100'
  - '- 学习路径建议：先跑通单项目MVP（0→1），再建项目库选赛道（1→N），最后搭团队加杠杆（N→规模化）'
  - '**关键性质**'
  - '- 环环相扣：无项目库则无目标，无MVP则无验证，无运营则无现金流，无杠杆则无规模'
  - '- 认知递进：从‘战术工具’(拆解、六维、卖空气)上升至‘战略框架’(矩阵、杠杆、治理)'
  - '**典型例子**'
  - '- 秦汉唐：喂养算法建库 → 八步法拆解儿童游乐/文川手写 → 策划案+执行案落地 → 兼职矩阵/爬虫放大'
  - '- 小徐/作者：项目拆解IP(低流高价) → 持续内容生产(流量) → 社群/陪跑交付 → 徒弟/合伙人杠杆放大'
  - '**边界条件**'
  - '- 框架假设读者具备基本执行力（‘强执行’是前提），纯理论学习无法产出结果'
  - '- 部分章节(如短视频带货、AI绘画)为垂类实战延伸，非核心必修，可按需择学'
  - '- 法律/合规边界贯穿全程：第7章《避坑与反思》为全书‘护栏’，不可跳过'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: apply
