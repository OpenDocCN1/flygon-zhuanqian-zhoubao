unsupported_claims:
- location: ch14.5（爆款生命周期）
  claim: 素材中明确提到“第四天大概只有2000万左右播放了”且“把直播时间减少到3个小时”。
  reason: 素材中提到了这个事实，但章节中“流量立刻从全天缩减到3小时”的描述属于对素材片段的转述，未发现逻辑错误。经核查，该声称有素材支撑，特此说明。
- location: ch14.6（做人群的实战效果验证）
  claim: 四象限（情、趣、用、品）这个分类框架被定义为“爆款内容的底层分类逻辑”，且“以‘情’象限为例，它包含了所有人的喜怒哀乐，而每一类情绪又可以按年龄、性别、财富状况等维度进一步细分”。
  reason: 素材中确实提到了“情、趣、用、品”四个字的分类，但未明确将其命名为“四象限”，也未明确说它是“底层分类逻辑”或“底层框架”，这是作者的总结提炼。虽有关联，但属于延伸定义，特此说明。
- location: ch14.11（为什么对标大达人不如对标黑马小达人？）
  claim: “幸存者偏差”这一概念被用于解释黑马小达人策略。
  reason: 该章节将此逻辑关联到素材 CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md，但该素材原文中并无“幸存者偏差”一词，这属于作者在讲解时引入的统计学概念，以辅助理解，并非素材的直接引用，特此说明。
