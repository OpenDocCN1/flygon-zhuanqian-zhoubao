paper: docs/202301-02/20230207_01.md
desc: 该素材是《龙哥赚钱周报》2023 年 2 月 7 日刊，摘自某年费 3000 多的付费社群资源帖。全文以两篇精华帖为主：《搞钱的心法》与《未来 3 个月，有什么普通人可以抓住的机会？》。前者以商业案例（静水流深、盗坤、跨境杨少）和体育案例（林丹
  vs 李宗伟、老虎伍兹性丑闻）为引，提出'盲目自信是创业者的理性选择'这一核心心法，并借《身心合一的奇迹力量》一书中的'自我一/自我二'与'内在比赛/外在比赛'框架，论述打赢内在比赛对做成事情的决定性作用，给出了'用成功体验唤醒潜意识'与'俯视优于跪着学'两个实操建议；后者则从疫情平稳期这一确定性窗口出发，指出旅游、健康、餐饮三个行业在未来
  3~6 个月的普通人机会与具体切入玩法。
concepts:
- name: 盲目自信 / 舍我其谁心态
  desc: 作者提出的创业者核心心法：创业者需要的不是理性的自我怀疑，而是近乎盲目的自信与乐观，因为这种'在我的领域我就是国王'的潜意识信念，是打赢内在比赛、进而获得外在成功的前提；失败不是成功之母，成功才是成功之母。
  is_original: true
  excerpt:
  - 一言以蔽之：你需要盲目的自信。因为盲目的自信和乐观，是创业者的理性选择。
  - 这样'舍我其谁''在我的领域，我就是国王'的心态，才是创业者真正需要的心态！
  - 创业途中充满了艰难险阻，而盲目的自信和乐观，是创业者的理性选择。常言道，永远不要低估一个高估自己的人。
- name: 自我一与自我二（内在比赛理论）
  desc: 源自《身心合一的奇迹力量》（The Inner Game Of Tennis）的核心概念：人有两个自我，自我一对应理性/一般自我，自我二对应感性/潜意识；任何比赛同时进行着内在比赛与外在比赛，当自我二不认可目标时就会输掉内在比赛，进而输掉外在比赛。
  is_original: false
  excerpt:
  - 人，有两个自我，分别是自我一、自我二。自我一，对应着理性，是一般意义上的自我。自我二，对应着感性，或者说对应着潜意识。
  - 任何一个比赛，实际上是同时进行的两场比赛，内在比赛和外在比赛。内在比赛，也就是英文书名里的'Inner Game'，这是最容易被人忽视的。
  - 人们往往容易忽略的是，如果自我二（也就是潜意识），并不认可这个目标的时候，会输掉内在比赛。一旦输掉内部比赛，外在比赛也会输。
- name: 三到六个月确定性窗口期
  desc: 作者提出的对 2023 年春天的市场判断：参照香港疫情数据，大陆在首轮大规模感染后会有 2~3 个月的疫情平稳期，随后进入第二波感染；因此 2023
    年春天是相对确定的稳定期，是生意人与投资者看重的窗口期。
  is_original: true
  excerpt:
  - 最近 3~6 个月，是比较确定的疫情平稳期，之后才会迎来第二波疫情的峰值。
  - 香港跟大陆一样，也是第一次大规模疫情感染，就把八九成的居民给感染了。之后香港就进入了 2~3 个月的平静期，平静期之后就进入第二波疫情感染。
  - 至少 2023 年的春天，会是一个比较确定的稳定期。
methods:
- name: __overview__
  desc: 素材整体的方法论框架：先提出创业者心态层面的核心主张（打赢内在比赛），再给出为创业者提供'确定性'的市场窗口判断与三个可落地的行业切入方向（旅游分销、健康带货、餐饮）。
  excerpt:
  - 从心态层面，如何使用生财有术呢？我的答案是：别跪着学！要俯视！你就是国王，把生财有术的帖子，当成奏折来看。
  - 反正我相信春天来了，先干个春天再说。
- name: 唤醒成功体验法
  desc: 针对'内心怂、不够自信'的创业者，作者提出通过回顾并唤醒自己过往的成功体验来建立潜意识自信：先做容易成功的事制造成功体验，借此撬动更大规模的成功。
  excerpt:
  - 当自己内心很怂、不自信的时候，你需要回顾下自己成功的经历，唤醒自己的成功体验。
  - 比如，一些优秀的推销员，在开展一天的工作时，会先去找一些优质的客户，或者推销一些容易卖的产品，通过这种方式去制造成功体验。这份体验，会帮助他更好地开展一天的工作。
  - 失败不是成功之母，成功才是成功之母。
- name: 俯视学习法（战略藐视战术重视）
  desc: 作者提出的对外学习与请教的方法论：在潜意识层面保持国王般的俯视姿态（战略上藐视），在具体请教与落实时保持学生的认真态度（战术上重视），如此才能赢下内在比赛。
  excerpt:
  - 我的答案是：别跪着学！要俯视！你就是国王，把生财有术的帖子，当成奏折来看。
  - 毛主席说，战略上藐视敌人，战术上重视敌人。跪着学生财有术的人，打不赢内在比赛。
  - 但是在战略上，来自于你的潜意识，你内心相信的应该是'老头儿，刚才你的奏折有一些亮点，朕心甚悦。可是，朕才是这个领域的国王。'
- name: 行业机会切入点分析（旅游/健康/餐饮）
  desc: 作者基于确定性窗口判断，为普通人给出了三个具体行业的切入玩法：旅游行业做产品分销与套利；健康行业做保健养生带货；餐饮行业紧扣春季爆发需求。
  excerpt:
  - 如果你本身不是干旅游行业的，但是又想分一杯羹，怎么办？最简单的就是做分销，可以做机票、酒店、旅游景点等等之类的分销。
  - 而健康行业，普通人最适合的切口，是保健养生带货。
  - 健康行业、餐饮行业……普通人最适合的切口。
theorems:
- name: 内在比赛决定外在成败
  desc: 核心主张：任何长期目标与创业行为的成败，本质上取决于潜意识（自我二）是否真正认可该目标；一旦输掉内在比赛，外在比赛也必然会输。
  excerpt:
  - 他不是输给了林丹，他是输给了自己。
  - 如果他的潜意识不相信自己能够打赢林丹，他就输了这场内部比赛，从而也会输掉外部比赛。
  - 作为一等一的赚钱高手，他们早就身心合一了。大家看到他们言语里的不羁，是源自于他们打赢了自己内在比赛。
- name: 成功是成功之母（反常识主张）
  desc: 核心主张：与其相信'失败是成功之母'，不如相信'成功才是成功之母'；过去的成功体验会持续在潜意识中累积自信，从而推动后续更大的成功。
  excerpt:
  - 失败不是成功之母，成功才是成功之母。
  - 我一个成功体验，推动一个又一个的成功体验。成功，才是成功之母。
  - 你也一定有成功体验，在做新的事情之前，好好回顾回顾，从潜意识里唤醒它，它会帮助你走得更远。
- name: 确定性窗口期共识
  desc: 关键观点：由于疫情平静期的存在，2023 年春天是确定的稳定期，可作为生意与投资的确定性窗口，这一判断依赖对香港疫情数据的类比推演。
  excerpt:
  - 最近 3~6 个月，是比较确定的疫情平稳期，之后才会迎来第二波疫情的峰值。
  - 所以我们会有一个共识，至少 2023 年的春天，会是一个比较确定的稳定期。
  - 香港第二波疫情，没有第一波那么快那么猛，但是陆陆续续维持了 5~6 个月，感染率是第一波的 50%。
- name: 春天是窗口期结论
  desc: 基于疫情平稳期共识，作者认为整个 2023 年春天将是行业恢复最猛的窗口，普通人应'先干个春天再说'，否则将错过这 3~6 个月的机会。
  excerpt:
  - 因为这个春天，可能是今年最重要的 3 个月窗口期。
  - 反正我相信春天来了，先干个春天再说。
  - 如果机会来了，你不去抓，那就等于放弃了。
findings:
- name: 旅游行业复苏数据
  desc: '[evidence] 通过春节国内旅游数据与行业预订数据，佐证旅游行业在春天将爆发：国内旅游人次恢复到 2019 年同期 88.6%，出入境及国际酒店预订量分别增长
    258%/632%/177%。'
  excerpt:
  - 今年春节国内旅游人次达到 3 个亿，基本上已经恢复到 2019 年同期的 88.6%了。
  - 出境的机票订单量上涨了 258%，入境的预定量上涨了 632%，国际酒店的预定量同比增长了 177%。
- name: 健康行业带货火爆数据
  desc: '[evidence] 用抖音保健品单品销量数据，佐证健康行业尤其是保健养生带货是普通人的合适切口：诺特兰德维生素片连续两个月为抖音直播单品销量第一。'
  excerpt:
  - 像去年有好几个保健品的品牌，在抖音销量都过亿了。
  - 诺特兰德的维生素片保健品，连续两个月是抖音直播的单品销量第一了。
  - 还有养生相关的书单，养生茶，推拿的小课程、小产品，都是适合普通人带货的品类。
- name: 李宗伟内在比赛败因
  desc: '[claim] 作者用李宗伟多次决赛输给林丹的统计数据，宣称其输球根源不是技术，而是潜意识层面输掉了内在比赛。'
  excerpt:
  - 在两人的职业生涯中，总共交手 37 次，李宗伟输了 25 次，其中两次是奥运会决赛。
  - 李宗伟的技术比林丹差吗？可真不见得，大部分职业羽毛球运动员和教练认为，他俩的技术不分伯仲。甚至还有一些人认为，李宗伟的技术比林丹更加全面。
  - 其实他不是输给了林丹，他是输给了自己。
- name: 老虎伍兹状态下滑归因
  desc: '[claim] 作者用老虎伍兹性丑闻离婚后丢世界第一、跌出前 100 的事实，宣称其核心是失去了''不可战胜''的潜意识信念。'
  excerpt:
  - 在性丑闻离婚之后的两个月，他就丢掉了世界第一的头衔，在往后几年，甚至跌出过世界排名前 100，还闹过退役、无限期休赛。
  - 曾经，他光芒四射，是个完美的人。闹了性丑闻以后，他的潜意识和他的对手的潜意识，都不再认为他是一个完美、不可战胜的人。因为性丑闻，老虎伍兹输掉了自己的内在比赛。
