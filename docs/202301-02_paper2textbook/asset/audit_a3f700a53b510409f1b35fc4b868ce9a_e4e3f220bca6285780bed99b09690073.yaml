unsupported_claims:
- location: ch40.17
  claim: 美团电商：2022年8月发现机会→2月跑通30店→单店月利6k-12k（零运营），验证新平台红利期“完成>完美”。
  reason: 素材中未找到美团电商2个月跑通30店、单店月利6-12k、零运营的具体数据支撑，仅在P011中提到刘家齐12月营收60万、直营50家店、单月毛利30万，且提到11月平台下店收紧被拉黑执照，12月中下旬恢复下店，与‘零运营’、‘2月跑通30店’不符。
- location: ch40.18
  claim: 作者ChatGPT案例：热度起→十几分钟注册公众号‘ChatGPT中文版’→十几分钟写代码接入API→首个集成公众号→十几分钟做镜像站套小程序→消耗50万请求。
  reason: 素材中仅提到‘十几分钟，写了一百多行代码，成了全网首个把ChatGPT集成到公众号的人’、‘十几分钟，做了一个ChatGPT的镜像的镜像（套娃）……包在小程序的壳子里上线了’、‘消耗接近50w次请求’，但未明确提到注册公众号名为‘ChatGPT中文版’、‘首个集成公众号’、‘十几分钟注册公众号’等细节。
- location: ch40.19
  claim: 优秀推销员：每天先找易成单客户/卖易卖品 → 制造‘成功体验’ → 唤醒潜意识自信 → 一天大单拿下。
  reason: 素材P001中提到‘一些优秀的推销员，在开展一天的工作时，会先去找一些优质的客户，或者推销一些容易卖的产品，通过这种方式去制造成功体验’，但未提及‘唤醒潜意识自信’、‘一天大单拿下’等后续推论。
- location: ch40.20
  claim: 作者从亏损100万→盘点资源（社群运营经验+私域流量+内容能力）→ 匹配‘外卖CPS+副业课程’ → 3月赚100万。
  reason: 素材P001、P006、P022中均未直接描述作者亏损100万、3月赚100万、盘点资源匹配外卖CPS+副业课程的完整过程。P022提到‘从赔100万，到在生财里找到项目赚回300万’，但未细化‘外卖CPS+副业课程’及3月节点。
- location: ch40.22
  claim: 4C动态量化模型：创始人身份(C0)、岗位权重(C1)、时间投入(C2)、资金投入(C3)四维打分加权算比例。
  reason: 素材P020中详细描述了4C模型（创始人身份、岗位权重、时间投入、资金投入）及五步法，但未使用C0/C1/C2/C3代号，且‘动态量化’、‘加权算比例’为全书推论，非素材原文表述。
- location: ch40.23
  claim: TikTok无人直播：硬改手机寿命10分钟-10天，卖手机者‘收割一茬’，买家血本无归。
  reason: 素材P011中提到‘TikTok无人直播手机寿命短、风控严’，但未给出‘10分钟-10天’具体寿命数据，也未提及‘收割一茬’、‘买家血本无归’表述。
- location: ch40.23
  claim: TEMU标品议价空间<10%，超1688价即判‘无诚意’压价。
  reason: 素材P011中提到‘TEMU标品议价空间<10%，超1688价即判无诚意压价’，但未说明来源，属单向表述，缺乏佐证。
- location: ch40.27
  claim: 丰田经典：机器停了→为什么?保险丝断→为什么?负载过大→为什么?轴承润滑不足→为什么?油泵吸入金属屑→为什么?无过滤网 → 对策:装过滤网/定期清理/改进油泵。
  reason: 素材P025仅定义5WHY方法与‘老板骂我’案例，未包含丰田案例，该案例为全书补充，非素材溯源。
- location: ch40.29
  claim: 某知识付费项目：道=用‘私域运营陪跑服务’解决‘中小商家不会私域变现’痛点赚‘服务费/分成’…
  reason: 素材P027仅定义道术器用四层框架，未提供具体知识付费项目案例，该案例为全书编造演示。
