unsupported_claims:
- location: ch44.4
  claim: 抖音发散选品四法（代金券/影视/场景/技能）半小时可挖十几个蓝海产品
  reason: 素材中仅列举4个具体案例（粒上皇代金券、去有风的地方保温餐炉、理发店场景、春节灯笼），未提供批量验证数据或通用化操作SOP支撑‘半小时十几个’的量化结论
- location: ch44.5
  claim: 视频号直播一小时加私人微信近200人，生财新年预约51个、加曹大星球49个
  reason: 素材中仅有作者自述截图，无第三方复盘或独立数据验证，且‘生财新年预约’、‘曹大星球’为特定社群内部名词，外部不可复现
- location: ch44.7
  claim: 矩阵化怼量：点赞超过500的视频仅10个，大部分个位数甚至0，纯靠怼量累计带货10万+
  reason: 素材仅展示单账号数据截图，未披露账号总数、运营周期、选品更换频率等关键变量，无法验证‘保证质量前提下量大概率爆单’的可复制性
- location: ch44.9
  claim: 闲鱼倒爷套利：飞利浦音响5台购入1400卖出2250、360U盘20个购入300卖出550、欧普台灯72个成本102元旺季单日最高卖9个
  reason: 素材仅提供单笔交易截图，未展示完整账期现金流、退货率、售后成本、账号权重养号周期等关键经营指标，无法验证‘低买高卖、安全边际’的长期盈利模型
- location: ch44.10
  claim: ChatGPT热点套利：十几分钟注册公众号‘ChatGPT中文版’、接入API、做镜像站套娃小程序，全网首个集成，消耗近50万请求
  reason: 素材中作者自述‘懒得优化’、‘消耗接近50万次请求’后热度即消退，未提供留存率、变现转化率、用户画像等核心运营数据，无法验证‘技术基建决定响应速度’的商业价值
- location: ch44.11
  claim: TikTok硬改设备手机寿命10分钟至10天不等，卖手机是‘一锤子买卖’，朋友买五六十部谷歌3手机后风控直播间进不去，卖家不解决
  reason: 素材仅为作者传闻描述，无设备采购合同、风控检测日志、售后沟通证据等客观佐证，且‘硬改设备’技术细节未披露，不可复现验证
- location: ch44.12
  claim: 蜜雪冰城（加盟）21年19亿利润 VS 奈雪的茶（直营）亏1.5亿，验证加盟模式优势
  reason: 素材直接对比两家上市公司财报单一指标，未控制规模、区域、品类、供应链成熟度、资本结构等混淆变量，属幸存者偏差式论证，无法得出‘加盟优于直营’的因果结论
- location: ch44.13
  claim: 茅台案例：八项规定后中高端白酒降价砸牌，茅台视品牌为最重要资产，不牺牲品牌换销售额
  reason: 素材未提供茅台同期财报数据（如毛利率、库存周转、渠道压货情况）支撑‘不牺牲品牌’论断，且‘八项规定’为2012年政策，距文中‘近期’时间跨度过大，因果链条断裂
