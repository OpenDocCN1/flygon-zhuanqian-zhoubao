  title: 拆解一个同行的“捡漏群/资料号/带货号”商业模型
  contents:
  - 找一个你所在赛道、已跑通盈利、规模达 10 万+ 月收益的同行账号/项目
  - 1. 按四层拆解并填表：
  - '   - 前端获客：平台、内容形式、发布频次、钩子设计、引流话术、投流比例'
  - '   - 中端转化：私域承接路径、破冰/诊断/方案/信任/成交五步法细节、演员/氛围/催单机制'
  - '   - 后端交付：产品/服务/供应链结构、SOP 程度、单客价/复购率/毛利率'
  - '   - 财务模型：客单价、毛利、ROI、获客成本（CAC）、回本周期'
  - 2. 标注哪些环节“货源非独家、动作可 SOP、自己资源能覆盖”，哪些是“硬壁垒/不可复制”
  - 3. 基于拆解，写出你的“微创新”方案：材质套利/热点嫁接/包装升级/流程缩短/成本降低
  - 4. 回答问题：该模型在你手里跑通的关键风险点是什么？如何用 MVP 验证？
