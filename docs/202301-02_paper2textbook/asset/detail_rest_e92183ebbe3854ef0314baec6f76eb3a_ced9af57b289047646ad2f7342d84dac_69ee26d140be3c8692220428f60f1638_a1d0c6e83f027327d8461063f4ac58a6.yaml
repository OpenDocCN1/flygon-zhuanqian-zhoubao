  title: 为你的团队/项目设计一份“股权/分红/退出”简易协议框架
  contents:
  - 假设你正在与 2-3 位合伙人启动一个新项目（或正在重构现有项目股权）
  - 1. 按四要素填写核心条款：
  - '   - 控制权：创始人持股 %、一致行动协议签署人、董事会席位分配、否决权事项'
  - '   - 进入：资金型溢价公式、资源型对赌指标(KPI)、技术型专利/成果估值、试用期/考核期'
  - '   - 分配：初始静态比例、动态调整触发条件(里程碑/营收/利润/融资)、期权池 % 与授予标准、分红政策'
  - '   - 退出：锁定期(年)、回购价格公式(净资产/营收倍数/估值折扣/协商)、优先清算权、竞业限制期/范围/补偿'
  - 2. 列出必须固化进法律文本的 6 份文件：公司章程、股东协议、期权计划、保密协议、竞业协议、一致行动协议
  - 3. 回答问题：
  - '   - 如果合伙人中途“躺平”不干了，但持有股份，你的协议如何处理？（动态调整/回购/表决权剥离）'
  - '   - 融资来了，新投资人要董事会席位和清算优先权，你如何在不丧失控制权的前提下引入资金？'
