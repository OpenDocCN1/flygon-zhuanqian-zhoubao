  title: 练习“渣男思维”写一条爆款笔记/视频脚本
  contents:
  - 选定你的目标人群（垂直的是人群！）和一个核心痛点/痒点
  - 1. 设计“撩完就跑”结构：
  - '   - 开头 3 秒：视觉/听觉/认知冲击，直接戳中痛点/痒点（钩子）'
  - '   - 中间：只给“目录/名单/金句/结果/最小可行价值”，绝不给“完整教程/细节/过程”'
  - '   - 结尾：峰终定律——在情绪最高点戛然而止，抛出钩子（加微信领完整版/看下集/评论区扣1）'
  - 2. 准备“广撒网”分发计划：同一内容改 3 个标题/封面/开头，发到小红书/抖音/视频号/公众号/微头条/朋友圈/行业群，记录各渠道数据
  - 3. 回答问题：
  - '   - 这条内容处于内容价值金字塔的哪一层？如何把它“升级”到工具层或方法层？'
  - '   - 如果平台判定为“标题党/诱导分享”，你的申诉/修改预案是什么？'
