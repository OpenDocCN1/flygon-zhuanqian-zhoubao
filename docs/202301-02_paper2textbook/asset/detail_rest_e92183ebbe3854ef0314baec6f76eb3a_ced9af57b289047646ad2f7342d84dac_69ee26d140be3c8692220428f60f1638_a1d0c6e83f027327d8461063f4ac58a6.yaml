life_analogy:
- 想象商业世界是一场**“电梯与爬楼梯”的游戏**：
- '- **时代红利 = 自动扶梯/电梯**：你站上去不动也能上升，但电梯会停、会检修、会换线路；九成高度是它给的'
- '- **个人能力 = 爬楼梯的腿力**：电梯停了、没电梯的楼层、想去更高楼层，全靠自己一步步爬；只有一成高度但永远属于你'
- '- **财富四阶段 = 四种交通工具**：出卖劳动力=徒步；一份时间多次卖=骑车（一次踩踏、惯性滑行）；购买他人时间=开车/坐大巴（带人、规模化）；钱生钱=乘飞机/火箭（资本杠杆、跨越周期）'
- '- **流量价值公式 = 开店三要素**：规模=路过人数；相关性=路过的人是不是要买你东西的；信任度=进店后敢不敢掏钱、敢不敢回头'
- '- **私域单客价 = 养奶牛 vs 杀猪**：客单价是杀猪卖肉（一次性）；单客价是养奶牛（每天挤奶、长周期、复利）'
- '- **MVP先卖后做 = 卖“期房”验证需求**：不盖房子先收定金，20-30人交定金再开工，没人交就退款换地块，避免烂尾楼沉没成本'
- '- **商业拆解复制 = 吃透“秘制酱料配方”**：买竞品、当顾客、录过程、拆配料（流量/转化/交付/财务），换成自己的食材（资源）重做一份'
- '- **刚需生意 = 卖水给沙漠里的人**：不解决会死、立刻能感知价值、主动催单、不用推、复购极高；非刚需=卖冰雕给爱斯基摩人（锦上添花、链条长、推不动）'
- '- **杠杆效应 = 阿基米德杠杆**：支点选对（零边际成本产品/媒体/代码）、杠杆够长（复制分发）、用力够猛（执行力），撬动地球不再是梦'
- '- **渣男思维做内容 = 相亲“撩完就跑”**：见面3秒展示最帅一面（开头钩子）、聊到最投缘时找借口走人（峰终定律停）、留下“加微信聊”的悬念（钩子）、下周换个相亲角再来一次（广撒网）'
- '- **内容价值金字塔 = 餐厅菜单**：娱乐=前菜/氛围组（留人不赚钱）；工具=主菜/半成品（实用、引流、低客单）；方法=秘制酱料/大厨课（核心壁垒、高溢价、可复制、建IP）'
- '- **股权设计 = 婚前协议+公司章程**：顺境谈丑话（控制权/进入/分配/退出）、定规则（一致行动/期权池/回购/竞业）、签合同（法律落地）、防逆境翻脸'
- '- **内在比赛 = 网球“自我一/自我二”**：自我一=嘴碎教练（理智/担忧/评判/设限）；自我二=肌肉记忆/直觉（潜意识/真实动力）；赢内在比赛=让自我二相信“我行”，靠盲目自信、微小成功堆叠、俯视学习喂养自我二'
- '- **战略即选择 = 背包客登山**：背包容量有限（资源稀缺），不选“不做什么”就装不下核心装备；地图看清（认知）、路线定准（取舍）、步子迈稳（执行）、别朝令夕改（战略稳于执行）'
- '- **执行力变现 = “笨功夫”铁匠**：不炫巧、不贪多、一锤子砸在确定性节点上、日复一日、可量化、可SOP、可招徒弟复制、本身能卖钱（宝妈微信号7万/作者进生财办公室）'
- '- **利他即利己 = 挖水渠灌溉邻田**：水渠通了邻田也通了自家田（信息回流）；水大市场大（蛋糕分不完）；筛选同频者（愿分享/能分享/持续分享=高执行力/长期主义）；核心机密不外传（水库大坝不拆）'
summary:
- concept: 时代红利与能力补偿
  desc: 每百块钱九十块是风给的，十块是力给的；英雄是时势造的，识别红利窗口比提升能力更紧迫
- concept: 财富积累四阶段
  desc: 出卖劳动力→一份时间多次卖→购买他人时间→钱生钱，严禁跳跃，对应人生30岁前扩广度/30岁后做管理/找第二曲线/复制放大
- concept: 流量价值公式
  desc: 价值=规模×相关性×信任度；规模只解决连接，相关性与信任度决定交易；任一为零总值归零
- concept: 私域单客价
  desc: 单用户生命周期总GMV=客单价×频次×周期；倒逼运营从收割转向养牛、拉长周期、提复购、增客单
- concept: MVP先卖后做
  desc: 不造产品先卖想法/预售单；聊100人20-30人付费即验证通过；筛选>培养，短时间并行测试几十产品
- concept: 商业拆解复制法
  desc: 四层拆解：前端获客→中端转化→后端交付→财务模型；套话做局显性化隐性知识；微创新重组要素；资源匹配度定成败
- concept: 刚需生意观
  desc: 用户不解决会难受/损失/焦虑，立刻感知价值、主动催单、高频/必需/替代成本高/强外驱；非刚需链条长推不动，项目本性成就人
- concept: 杠杆效应
  desc: 三类杠杆：劳动力/资本/零边际成本产品(代码/媒体/内容)；可叠加；内容杠杆门槛最低最适合普通人；执行力激活杠杆
- concept: 渣男思维做内容
  desc: 撩完就跑(峰终定律/情绪最高点停/意犹未尽)+广撒网(垂直人群非题材/多圈子多平台/模板化/不靠灵感靠流程)
- concept: 内容价值金字塔
  desc: 娱乐(情绪/难变现)→工具(实用/引流/低客单)→方法(认知/权威/IP壁垒/高客单/高复购)；价值交换逻辑；可组合漏斗
- concept: 股权顶层设计四要素
  desc: 控制权(操盘能力/责任心/好人)>51%或AB股；进入(资金溢价/资源对赌/技术专利)；分配(静态+动态/里程碑)；退出(锁定期/回购价/竞业)；配套合同落地
- concept: 内在比赛理论
  desc: 自我一(理智/担忧)vs自我二(潜意识/动力)；潜意识不认可目标→输内在→输外在；盲目自信/成功体验唤醒/俯视学习喂养自我二
- concept: 战略即选择
  desc: 战略=取舍=不做什么；目标≠战略；发挥优势(筹码)+补齐短板+序列化推进；三会一层治理护航；战略稳于执行
- concept: 执行力变现论
  desc: 持续把确定性动作做到位/做到果/做出结果；可量化(日更/发文/加粉/测款/电话/提交/复盘)；本身可变现(宝妈号7万/作者进生财)；竭尽全力最轻松
- concept: 利他即利己
  desc: 主动分享好信息/方法/资源/项目不藏私；分享→吸引同频→信任网络→信息回流→复利；市场大蛋糕分不完；核心机密除外；筛选白嫖党
exercises:
- 'no': 1
  title: 复盘你的收入结构：红利 vs 能力
  contents:
  - 拿出你过去 12 个月的收入明细（工资、副业、投资等）
  - 1. 逐项标注：这笔钱有多少比例是因为“平台/政策/风口”才拿到的（时代红利）？多少是凭你不可替代的专业技能/认知/执行力拿到的（能力补偿）？
  - 2. 计算全年红利占比与能力占比
  - 3. 回答问题：
  - '   - 如果明天你所在的平台流量归零、政策收紧、风口结束，你的收入还剩多少？'
  - '   - 你的“能力补偿”部分主要来自哪个技能？该技能是否可跨平台、跨周期复利？'
  - '   - 下一年你计划如何主动提升“能力补偿”占比？'
- 'no': 2
  title: 为你的当前项目算一笔“流量价值账”
  contents:
  - 选定你正在运营的一个项目（或准备启动的项目）
  - 1. 估算/统计：月流量规模（UV/播放/曝光）
  - 2. 评分（1-10分）：交易相关性（受众画像与产品匹配度）、信任度（连接带来的安全感/转化率/客单价支撑）
  - 3. 计算：流量价值指数 = 规模 × 相关性分 × 信任度分
  - 4. 回答问题：
  - '   - 哪一项是短板？如果只优化这一项，价值指数能提升多少倍？'
  - '   - 你能设计哪 3 个具体运营动作，分别提升相关性、信任度、规模？'
  - '   - 对比公域直播间流量 vs 私域好友流量，两者的相关性、信任度、单客价差异在哪里？'
- 'no': 3
  title: 设计一次“MVP 先卖后做”验证实验
  contents:
  - 假设你有一个新产品/服务想法（如：某垂直领域的付费社群、小工具 SaaS、实体课程、虚拟资料包）
  - 1. 写一份《预售落地页/朋友圈文案/咨询话术》，包含：核心承诺、价格、交付时间、退款承诺、收款码
  - 2. 设定验证标准：目标触达 100 精准意向用户（定义精准标准），其中 20-30 人付预售金（按客单价调整阈值）即通过
  - 3. 列出你将通过哪 3 个渠道、用什么钩子、在多长时间内完成这 100 人触达
  - 4. 回答问题：
  - '   - 如果只有 3 个人买单，你会如何判断：是产品不行、渠道不对、话术烂、还是定价贵？如何用最小成本进一步排查？'
  - '   - 预售承诺若无法兑现，你的退款/补偿方案是什么？如何避免透支信任？'
