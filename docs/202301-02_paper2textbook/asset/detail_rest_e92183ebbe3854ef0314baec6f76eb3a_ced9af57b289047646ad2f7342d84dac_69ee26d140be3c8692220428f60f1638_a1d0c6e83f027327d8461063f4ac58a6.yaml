learning_targets:
- 理解时代红利与个人能力补偿的区别，建立正确的财富归因认知
- 掌握财富积累四阶段模型，明确当前所处阶段与跃迁路径
- 熟练运用流量价值公式（规模×相关性×信任度）拆解与优化获客ROI
- 建立私域单客价思维，从单次交易转向用户全生命周期价值经营
- 掌握MVP先卖后做验证逻辑，用最小成本筛选高确定性项目
- 学会商业拆解复制法，像拆玩具一样拆解同行盈利模型并重组为己用
- 确立刚需生意观，只做用户“离不开”的高确定性生意
- 识别并构建适合自己的杠杆体系（劳动力、资本、零边际成本产品）
- 掌握“渣男思维”内容创作法（撩完就跑、广撒网）与峰终定律应用
- 理解内容价值金字塔，有意识从娱乐层向工具层、方法层跃迁
- 掌握股权顶层设计四要素（控制权、进入、分配、退出），建立合伙护城河
- 理解内在比赛理论，通过盲目自信、成功体验唤醒、俯视学习赢在潜意识层面
- 践行战略即选择，敢于说“不”，聚焦核心优势与确定性机会
- 重塑执行力变现认知，把“笨功夫”打造成最高护城河
- 内化利他即利己原则，建立分享驱动的复利信息网络
