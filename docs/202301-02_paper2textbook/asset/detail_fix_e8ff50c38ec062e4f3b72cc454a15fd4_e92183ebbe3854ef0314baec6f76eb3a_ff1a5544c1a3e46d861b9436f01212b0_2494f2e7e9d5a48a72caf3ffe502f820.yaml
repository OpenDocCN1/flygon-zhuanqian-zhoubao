  name: 辞退损失最小化 —— 优雅地降低裁员成本
  points:
  - '**为什么需要这个概念？**'
  - '- 无论员工主动离职还是被辞退，处理不当都可能导致劳动仲裁和公司损失'
  - '- 辞退流程不规范会带来高额赔偿金、声誉损失和团队士气下降'
