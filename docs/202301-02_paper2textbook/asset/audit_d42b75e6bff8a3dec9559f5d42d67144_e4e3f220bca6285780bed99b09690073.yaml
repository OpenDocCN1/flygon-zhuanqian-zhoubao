unsupported_claims:
- location: ch37.3
  claim: 可能所有夸张，我们所赚的每一百块钱，有九十块钱是时代红利，仅有十块钱是时代对我们个人能力的补偿
  reason: 素材中为定性判断而非精确统计数据，全书将其表述为核心定义，但原文明确标注'可能所有夸张'
- location: ch37.5
  claim: 流量价值=流量规模×交易相关性×信任度，三者是乘积关系而非加和关系
  reason: 素材中给出公式但未论证乘积关系的数学必要性，仅为经验总结
- location: ch37.6
  claim: 四个阶段必须依次跃迁，不可跳跃
  reason: 素材中虽提及不可跳跃，但也承认'现实中有人通过继承或风口直接进入后段'，存在矛盾
- location: ch37.10
  claim: 横向切片解决'来源与归因'，纵向切片解决'用户与价值'，二者缺一不可
  reason: 素材中未明确界定二者缺一不可的边界条件
- location: ch37.12
  claim: 聊了100个人，只有几个人买，肯定有问题；如果20-30个人购买并交了预售金，那这个不确定因素就解决了
  reason: 素材中给出具体数字阈值但未说明样本代表性、统计显著性或行业差异
- location: ch37.15
  claim: 劳动合同就是一把枪，附件就是子弹，没有子弹枪再好也无济于事
  reason: 素材中为比喻性表述，非法律条文规定，不同地区司法实践可能差异巨大
- location: ch37.17
  claim: 目前我们普通人能接触到的互联网项目不是科研项目，本质上讲几乎是没有任何壁垒的
  reason: 素材中为'几乎没有任何壁垒'的定性判断，未界定'普通人'、'互联网项目'、'壁垒'的具体范围
- location: ch37.19
  claim: 进入增长瓶颈的一个典型现象，就是越想要增长，却距离想要的增长越远
  reason: 素材中为经验观察，未提供实证研究支持该因果关系
- location: ch37.20
  claim: 破除增长焦虑唯一的方法，就是怎么从追求增长的视角，切换成价值创造的视角
  reason: 素材中用'唯一'表述过于绝对，未论证其他方法（如战略转型、成本控制等）的无效性
- location: ch37.27
  claim: 利润率≠现金流：账面盈利但现金流断裂是创业公司最常见的死法
  reason: 素材中为经验总结，未引用统计数据支持'最常见'的判断
- location: ch37.29
  claim: 盈亏平衡点=固定费用÷毛利率，即每月需达到的最低销售额
  reason: 素材中未考虑变动成本随销量非线性变化、税务影响、季节性波动等现实因素
- location: ch37.30
  claim: 容错率是风险管理的核心：用可承受的损失换取学习机会
  reason: 素材中未量化'可承受损失'的计算标准，'10-20%总资金'为经验法则而非推导结论
