paper: docs/202301-02/CZPydiVmgo2odMx0nWecf3DTn6e.md
desc: 本文是「抖音SEO陪跑计划」两天线下课的复盘总结，核心主张抖音搜索（SEO）仍处于蓝海市场，存在巨大红利。素材围绕选词（蓝海词）、底层原理的十几项指标细节、理论+实操陪跑式教学、工业级爆款素材库等展开，并通过一个留学业务老板当场出结果的例子（优化已发布视频后，月前视频新增3万+搜索量、截止次日累计11万播放/2000赞/150条客资）作为效果佐证，最终归纳出抖音SEO精准、蓝海、成本低、速度快、轻松、流量大、持久七大优点。
concepts:
- name: 抖音SEO（抖音搜索优化）
  desc: 在抖音平台内，针对用户搜索行为进行内容与关键词优化，使作品被有需求的用户精准搜索到的过程，是素材的核心方法论对象。
  is_original: false
  excerpt:
  - 单有工具虽然已经很不错了，但是收获一套底层思维才是真的受益匪浅
  - 在学课程之前，大家做出的内容很好，但难以被有需求的用户精准搜索到。而上完课程，这个问题解决了。
- name: 蓝海词
  desc: 指搜索流量大但竞争小、容易被排上名的关键词；素材主张选词做抖音SEO的灵魂，词选对则90%成功率，这是后续所有方法（工具选词、内容优化）的前提概念。
  is_original: true
  excerpt:
  - 做抖音SEO最重要的是选词，找到蓝海词，才能保证90%的成功率，词选的好，靠运气也能获得搜索流量。
  - 蓝海之所以是蓝海，是因为流量大，竞争小。而之所以竞争小，是因为99%的抖音达人并不懂搜索逻辑
- name: 抖音SEO底层原理（十几项指标）
  desc: 指抖音SEO底层原理包含的十几项指标，实操时需将各项指标都完善，是'细节决定成败'的细节来源，也是课程内容的具体着手点。
  is_original: false
  excerpt:
  - 抖音SEO底层原理包含十几项指标，我们在实操的时候，就是要把各项指标都完善好。
- name: 陪跑式教学（理论+实操结合）
  desc: 区别于纯理论线下课的教学形式，通过先讲解底层原理、再现场实操完成6个任务，并附赠专属SOP供团队执行，以对抗遗忘率高的痛点。
  is_original: false
  excerpt:
  - 很多线下课都是纯理论式，当场的感觉很好，但是二天后已经忘记了80%的干货内容。
  - 在了解完抖音SEO的底层原理之后，老板们现场开始完成了6个任务，完整的体验了一遍抖音SEO全部流程。
  - 学完课程后可以拿到了一份专属的Sop，方便老板们在上完线下课之后，可以给到团队去执行。
- name: 工业级内容生产方式（爆款素材库）
  desc: 全自动收集全网爆款素材与评论的工业化内容生产方式，只需设定关键词即可自动收集昨天的爆款内容和选题及评论，用于降低选题难度并挖掘隐性需求。
  is_original: true
  excerpt:
  - 只需设定几个关键词关键词，就能够自动收集全网的爆款内容，每日自动收集全网昨天的爆款内容，大大节省人力了。
  - 不仅仅能够自动收集选题，也会自动收集选题下的评论，方便深度洞察高点赞数的评论背后的隐形需求
methods:
- name: __overview__（抖音SEO操作流程：选词→指标细节→内容调整）
  desc: 整体方法论：首先用工具从1500万个搜索词中选蓝海词（避开大词和无效长尾词），然后基于底层原理的十几项细节指标对已发布内容或新内容做优化，配合内容定位与痛点分析引导精准流量，再辅以工业级素材库持续产出。
  excerpt:
  - 目前99%的抖音博主都是不懂抖音SEO逻辑的，所以大家即使选词，也容易出现两种情况：1.只挑大词……2.挑了没有流量的长尾词……
  - 我们帮助她从用户的搜索量来分析用户痛点，区分用户群体，确定接下来的运营策略。
  - 你对自己的客户定位越清晰，你靠内容吸引的客户就越精准。
- name: 基于搜索词数据库的选词策略
  desc: 利用1500万搜索词数据库（极客抖音seo工具）筛选蓝海词的方法：一个领域中约70%是蓝海词，可结合月覆盖人数、每日关键词指数涨势来辅助判断，以规避'大词'叠加无效和'专业长尾词'无搜索流量两大选词误区。
  excerpt:
  - 我们1500万个搜索词中，70%是蓝海词，绝大多数一个领域，都可以找到属于自己的蓝海方向。
  - 我给大家举一个世界杯的例子，可以快速找到大量与世界杯相关的蓝海词，以及与之对应的月覆盖人数，以及每日关键词的指数的涨势情况
  - 只放行业词……用户压根不会这么搜，即使这么搜，这么大的词，压根也轮不到你。
- name: 用户搜索需求导向的选词/做内容法（从用户角度而非自身专业角度）
  desc: 其要点是站在用户搜索习惯与搜索量数据出发选词和做内容定位，避免从自身专业视角出发写词，而是用数据洞察用户痛点、区分用户群体，从而确定运营策略。
  excerpt:
  - 有的老板会从自己专业角度出发，写一些专业的词，但是假如面向的是小白用户，大家根本不懂，也不会搜这个词，那这种词就没有意义，因为无法让用户搜索到你。而从用户的搜索需求我们就可以看出，用户会搜什么，从而避免这个情况。
  - 学会用数据分析的方法，从用户的角度看问题，视野真的开阔多了。你对客户的定位越清晰，你靠内容吸引的客户就越精准。
- name: 细节指标优化法（对已发布内容微调）
  desc: 在底层原理包含的十几项指标基础上，对已发布视频的细节进行完善以快速见效的方法——本案中老板仅花5分钟对已发视频做SEO优化即获巨大搜索流量。
  excerpt:
  - 关键词的一环就是做好抖音细节。之前我们课程介绍里也有提过，抖音SEO底层原理包含十几项指标，我们在实操的时候，就是要把各项指标都完善好。
  - 当场出效果的老板，也就是在原有的内容基础上优化了细节，就立马产生巨大的效果。
- name: 数据驱动的内容差异化定位法（基于用户痛点与人群定位做差异化）
  desc: 针对实体店老板低价引流导致转化差的案例，从用户搜索量分析痛点、区分用户群体，据此调整内容定位，避免陷入低价竞争，以内容吸引精准客户。
  excerpt:
  - 我们结合她的人群定位，建议她与别人做出差异化，做好客户的痛点分析，从用户痛点入手来做内容，避免传统的低价竞争。
  - 我们帮助她从用户的搜索量来分析用户痛点，区分用户群体，确定接下来的运营策略。
  - 你对自己的客户定位越清晰，你靠内容吸引的客户就越精准。
theorems:
- name: 抖音SEO=蓝海（流量大、竞争小、持久）
  desc: 因为99%的抖音达人不懂搜索逻辑，导致搜索端流量大而内容供给不充分，形成蓝海；且搜索作品远不如推荐作品优质，搜索存在大量机会，从而获流量可持久（一年不更新仍每月流量稳定）。
  excerpt:
  - 蓝海之所以是蓝海，是因为流量大，竞争小。而之所以竞争小，是因为99%的抖音达人并不懂搜索逻辑，更别谈运用搜索逻辑，能获得长久流量的，更多是靠运气蹭上的。
  - 搜索出来的作品，远没有推荐的作品优质，搜索存在大量的机会。
  - 蹭到搜索流量，一年不更新视频，依旧每月流量稳定
- name: 选词定生死（选对词保证90%成功率）
  desc: 做抖音SEO成败核心在于选词，找到蓝海词即保证90%成功率；词选得好靠运气也能获得搜索流量。
  excerpt:
  - 做抖音SEO最重要的是选词，找到蓝海词，才能保证90%的成功率，词选的好，靠运气也能获得搜索流量。
  - 1.只挑大词，词太泛，加了等于没加。2.挑了没有流量的长尾词，写了等于没写。
- name: 内容定位越清晰，吸引的客户越精准
  desc: 流量来了接不住、转化率低的根因是业务定位不清晰；要做好客户痛点分析，从用户痛点做内容，从而避免低价竞争并提升转化。
  excerpt:
  - 很多老板的痛点，不是缺流量，而是流量来了，也接不住，转化率低，核心原因是，自身业务定位不清晰。
  - 你对客户的定位越清晰，你靠内容吸引的客户就越精准。
- name: 小需求（细分领域）可以低成本获稳长流量且难被抄袭
  desc: 挖掘别人不注意的小需求专门做内容，可稳定节省买量费并稳赚，且因为竞争对手看不明白而难以被抄袭。
  excerpt:
  - 我们一个做APP的用户，就是因为挖掘了别人平常都不会注意到的小需求，专门做这部分内容，就能稳定每个月省下10万+买量费，同时多稳赚10万。而且还不怕竞争对手抄他，毕竟，竞争对手也看不明白。
  - 谁也想不到，这样一个不为人知的需求，竟然是用户心中的痛。
- name: 抖音SEO要求业务已跑通0-1
  desc: 要最大发挥抖音SEO效用，前提是业务从0到1已经跑通；否则流量来了也接不住。
  excerpt:
  - 想要最大发挥抖音SEO的效用，首先是你已经跑通了从0-1。很多老板的痛点，不是缺流量，而是流量来了，也接不住，转化率低，核心原因是，自身业务定位不清晰。
findings:
- name: 留学业务老板当场出结果：优化细节后旧视频获大量搜索流量与客资
  desc: '[evidence] 该案例由线下课现场学员自己反馈并附对比效果图支撑：老板在早上按老师方法对已发布内容优化5分钟后，一个月前发布的视频新增3w+搜索量、评论区新增几十条客资；截止昨天累计新增11万播放、2000赞、150条潜在客资。'
  excerpt:
  - 我早上对已经发布的内容，按照老师的方法做了调整，一个月前的视频突然多了3w+的搜索量，评论区多了几十条客资。
  - 虽然只花了5分钟的时间，对已经发布的视频进行SEO的优化，但是截止到昨天，这位老板已经新增了11万播放，2000个点赞，150条潜在客资
- name: 抖音SEO出效果速度极快（最快不到8小时/1天）
  desc: '[evidence] 素材对比历史记录与本次线下课：历史最快记录为18小时出结果，而本次线下课当场（不到8小时）即有老板出结果，用于支撑''抖音SEO出效果快''的宣称。'
  excerpt:
  - 在我们历史的培训中，学员最快的记录是凌晨开始做，当天晚上出结果，用时18个小时。
  - 然而这次线下课直接突破了记录，结果当场就有老板出结果了！只用了不到8个小时的时间，流量直接起飞。
- name: 抖音搜索流量数据基数（月搜索5.5亿、1500万词库70%蓝海）
  desc: '[claim] 素材宣称截至2021年底抖音月搜索量为5.5亿，其1500万搜索词库中70%是蓝海词，且大多数行业都能找到蓝海方向；此词库数据为宣称（未提供具体统计口径与方法），并非独立可验证的证据。'
  excerpt:
  - 我们1500万个搜索词中，70%是蓝海词，绝大多数一个领域，都可以找到属于自己的蓝海方向。
  - 截止到2021年底月搜索为5.5亿
- name: 实体店老板案例：低价策略失效，数据化定位后有清晰运营策略
  desc: '[evidence] 案例呈现现象与结果：高端女性路线实体店在疫情压力下做低价引流但转化很差；团队结合人群定位建议差异化+以用户搜索量分析痛点做内容后，老板反馈''以前只会凭直觉，现在靠数据支撑，更清晰了''。'
  excerpt:
  - 这位老板与合伙人开了一家店，面向女性群体，走的是高端路线，但是今年疫情严重，迫于压力，操作了一段时间的低价引流，导致吸引来的大量用户转化效果很差。
  - 实体店老板反馈，以前只会凭直觉，现在靠数据支撑，更清晰了。学会用数据分析的方法，从用户的角度看问题，视野真的开阔多了。
- name: '''低成本/不需要日更''获流量（更新3~10条视频即可）'
  desc: '[claim] 素材宣称抖音SEO可低成本获得流量，只需更新3~10条视频、无需日更，且可持久获得稳定流量；此为课程宣传性宣称，未提供统计样本或对照数据。'
  excerpt:
  - 成本低：只需要更新3~10条视频，无需日更
  - 持久：蹭到搜索流量，一年不更新视频，依旧每月流量稳定
