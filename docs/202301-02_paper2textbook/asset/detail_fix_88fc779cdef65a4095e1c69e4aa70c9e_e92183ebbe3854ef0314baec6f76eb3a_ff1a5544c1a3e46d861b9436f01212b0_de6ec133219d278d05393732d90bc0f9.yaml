learning_targets:
- 掌握热点收割策略的概念与核心定义：从快速决策、批量产出到流量承接的完整闭环
- 理解搜索流量追热点与推荐流量追热点的区别，并能在实操中正确铺设长尾词
- 掌握公众号后台流量承接（关键词回复、收到消息回复）与降低取关率、举报率的技巧
- 了解批量做号矩阵的运作逻辑及其对内容差异性与账号储备的要求
- 能根据热点生命周期与自身前置能力，判断是否值得入局追热点，并计算单次追热点的投入产出比
- 掌握热点流量的多种变现路径（流量主、CPS/CPA、泛粉洗粉），并能根据账号类型与合规要求选择合适策略
- 掌握内容冷启动的差异化策略：从"做商品"到"做人群"的转型路径与"情、趣、用、品"四象限定位法
- 掌握RPA自动化工具在短视频爆款采集、内容生产与批量发布中的应用，理解"原创优于二剪优于搬运"的原则
- 了解批量做号与内容原创的边界条件，能评估矩阵策略与单号原创策略的适用场景
- 理解IP打造与热点收割两种内容商业模式的差异，能根据自身目标选择合适的内容战略
