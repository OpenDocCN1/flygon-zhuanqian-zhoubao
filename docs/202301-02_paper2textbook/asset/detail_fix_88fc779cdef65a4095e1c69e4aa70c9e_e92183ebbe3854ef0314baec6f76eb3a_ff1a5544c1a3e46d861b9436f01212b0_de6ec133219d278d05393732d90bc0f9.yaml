  - '- 四象限分支可细分上千种，只需扣到一个点即可'
  - '- 精准人群虽播放量不如泛人群高，但变现效率更优'
  - '- 大爆款人群泛化、变现有限；精准小爆款变现更好'
  - '**典型例子**'
  - '- 4个账号7天破10万粉、5万+利润：A白领虚荣穷、B80-90怀旧、C50+亲情共情、D纯带货（被放弃）'
  - '**边界条件**'
  - '- 抖音热度内容不一定在视频号爆发，需结合平台人群调整'
  - '- 多赛道同时做需分时间段找素材，避免''脑裂'''
  - '- 警惕''知识的诅咒''：考虑太多远处困难会陷入精神内耗'
  sources:
  - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
    role: origin
  excerpts:
  - 四、视频号别人做商品，我做人群，伪原创。
  - 做商品类型的种草视频成功概率太小了，并且还有很多有船的大佬，现在都开始付费了，像我这样的单打独斗打不过。大路上的人太多了，我换条小路。
