  - '- 视频模板元素化拆解：所有短视频可拆为背景、标题、内容、文案、字幕、背景音乐六元素'
  - '- 混淆元素机制：加入自拍照片与视频保证原创性'
  - '**关键性质**'
  - '- 原创优于二剪优于搬运：直接1比1模仿爆款做原创可保证质量60分以上'
  - '- 素材随机取用 + 时间段随机取用 + 混淆元素 = 每视频不同且过原创审核'
  - '- 底层工具模块抽取后可几分钟开发一个新模板'
  - '**典型例子**'
  - '- 中医养生号三个号数月变现10w左右：验证自动化+矩阵流量变现'
  - '**边界条件**'
  - '- 内容自动生成稳定后，主要精力在选品与更新模板'
  - '- RPA脚本执行会锁住电脑，需安排非工作时段运行'
  - '- 抖音上特效很多的视频无法用模板自动生成'
  sources:
  - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
    role: origin
  excerpts:
  - 每个赛道的视频内容也都有两种：流量视频和带货视频。流量视频是拉曝光涨粉打标签用的，针对要做的客户人群画像，找到对标账号，找出当下流行的爆过的那些流量视频。
  - 所有的视频都可以拆成以下元素：1. 背景：图或者视频 2. 标题：主、副标题 3. 内容：图、视频 4. 文案：5. 字幕：6. 背景音乐：
  - 内容创作上，原创优于二剪优于搬运，所以直接1比1模仿当下的爆款视频去做原创。
  - 用这样验证过的流量视频或者带货视频当模板，是要保证1比1模仿做出的内容都是60分以上的。
