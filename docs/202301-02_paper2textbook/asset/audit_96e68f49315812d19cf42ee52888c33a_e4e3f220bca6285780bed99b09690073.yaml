unsupported_claims:
- location: '5.5'
  claim: 六维评估模型中流量效率、销转效率、交付效率的公式化表达及逐步推导
  reason: 素材P002仅给出定性定义（时间/素材/流量、专业度/SOP、时间/人力），未提供公式化表达及物理意义推导过程
- location: '5.5'
  claim: 六维模型中‘满四及格’及‘三效率定可复制、四财务定上限’判定定理
  reason: 素材P002原文仅提及‘六个点，满足的越多越好，满足四个点，及格’及‘三块效率...意味着赚多赚少取决于流量’，未系统表述为两大判定定理
- location: '5.3'
  claim: 商业项目拆解核心产出包含‘可复制性评估’
  reason: 素材P001定义中仅列举赛道、渠道、流量模式、转化模式、交付模式、客单价，未明确包含可复制性评估
- location: '5.10'
  claim: 项目管理双案法中执行案包含‘年/月/周、模块、二级事项、内容、负责人、协助人、完成日期、状态、阶段目标’九大核心字段
  reason: 素材P001原文描述执行案字段为‘某一年某一月的核心工作事项、模块、二级事项、具体内容、负责人、协助人、完成日期、完成标绿/标红’，未提及‘年/月/周’视图及‘阶段目标’字段
- location: '5.11'
  claim: 三大杠杆放大法中人力杠杆‘5-10分钟/篇，引流付费’，技术杠杆‘RPA/爬虫/自动化脚本’，资源杠杆‘投流/分销/品牌授权/收购’的具体操作细节
  reason: 素材P001仅给出概括性描述（如‘招兼职按单提成’、‘影刀RPA批量采集/去重/发布/监测’、‘投流/分销/收购’)，未提供本章声称的详细操作参数
- location: '5.12'
  claim: 止损点三维设定包含‘时间/金钱/资源上限’及‘止损复盘报告：假设vs现实、偏差原因、教训入库’
  reason: 素材P001原文仅提及‘止损点包括时间成本、金钱投入、资源投入’及‘复盘报告：假设vs现实、偏差原因、教训入库’，未明确‘三维上限’量化标准
- location: '5.15'
  claim: 设计取舍中‘后发制人’trade-off为‘得确定性收益、极速启动、可复制放大；失无先发优势、无独家护城河、易陷入同质化价格战’
  reason: 素材P001/P002未系统论述后发制人的得失权衡分析
- location: '5.5'
  claim: 五大项目六维画像对比表（小说推文、教育资料1.0/2.0、减肥食谱、项目拆解IP、知识付费）的量化打分与月收益区间
  reason: 素材P002仅给出六维定性描述及部分案例收益范围，未提供结构化对比表及量化打分
