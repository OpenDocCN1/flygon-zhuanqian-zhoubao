  claim: 后发制人原则中‘只做验证3个月+项目’、‘红海微调而非原创创新’的具体操作标准
  reason: 素材P001原文为‘已经做成了，已经做了好几个月了’、‘红海微调’，未量化‘3个月’及‘微调’的具体标准
- location: '5.8'
  claim: 八步筛选法中第5步‘评估可复制性和可持续性’必须包含‘止损点设定’
  reason: 素材P001原文八步法第5步仅为‘评估可复制性和可持续性’，未强制要求设定止损点
- location: '5.14'
  claim: 可复制性判定三铁律为‘爆款非偶然、货源可寻、场景验证’
