units:
- 'no': 1
  name: 盲目自信 —— 创业者的理性选择
  points:
  - '**为什么需要这个概念？**'
  - '- 创业路上充满艰难险阻，理性的自我怀疑会让人畏首畏尾，无法迈出关键的第一步'
  - '- 潜意识（自我二）不认可目标时，人会输掉“内在比赛”，进而输掉“外在比赛”'
  - '- 传统“理性分析风险”的思维无法解决创业者心理能量不足的问题'
  - '**核心定义**'
  - '- 创业者需要的是近乎盲目的自信与乐观，即‘在我的领域我就是国王’的潜意识信念'
  - '- 这种心态不是盲目自大，而是打赢内在比赛、获得外在成功的前提'
  - '**关键性质**'
  - '- 自我一（理性）负责分析，自我二（感性/潜意识）决定行动力'
  - '- 内在比赛（潜意识认可目标）先于外在比赛（实际成果）'
  - '- 自信可以通过“唤醒成功体验”来刻意培养'
  - '**典型例子**'
  - '- 李宗伟技术不输林丹，但多次决赛失利，根源是潜意识认为自己赢不了'
  - '- 老虎伍兹性丑闻后失去“不可战胜”的信念，技术未变但状态急剧下滑'
  - '**边界条件**'
  - '- 盲目自信适用于需要长期坚持的创业/项目，不适用于需要精确计算的投资决策'
  - '- 自信需与“战术上重视”结合，俯视学习但细节上认真请教'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 一言以蔽之：你需要盲目的自信。因为盲目的自信和乐观，是创业者的理性选择。
  - 这样'舍我其谁''在我的领域，我就是国王'的心态，才是创业者真正需要的心态！
  - 常言道，永远不要低估一个高估自己的人。
  - 创业途中充满了艰难险阻，而盲目的自信和乐观，是创业者的理性选择。
- 'no': 2
  name: 自我一与自我二 —— 内心的两个“我”如何决定成败
  points:
  - '**为什么需要这个概念？**'
  - '- 仅靠理性分析无法解释为什么有些人条件优异却屡屡失败，有些人条件平平却能成功'
  - '- 需要理解潜意识和情绪在长期目标达成中的决定性作用'
  - '- 为“盲目自信”提供心理学理论支撑，让抽象心态有可操作的理论框架'
  - '**核心定义**'
  - '- 人有两个自我：自我一对应理性/一般自我，负责分析、评价；自我二对应感性/潜意识，负责行动、本能'
  - '- 内在比赛：潜意识（自我二）是否真正认可目标，决定外在比赛的输赢'
  - '**关键性质**'
  - '- 自我二是本能和潜意识的载体，直接驱动行为，不听从理性指令'
  - '- 当自我二不认可目标时，人会“心口不一”，行为上偏离目标'
  - '- 内在比赛被忽视时，往往成为成败的真正决定因素'
  - '**典型例子**'
  - '- 打网球时，自我一不断评价“这球打不好”，自我二反而发挥失常——源自《身心合一的奇迹力量》'
  - '- 李宗伟每次决赛对林丹，他的自我二不认为能赢，再好的技术也发挥不出来'
  - '**边界条件**'
  - '- 该理论适用于长期、复杂、需要内在驱动力的目标（创业、竞技体育）'
  - '- 不适用于纯机械性、短周期任务——那种场景理性分析更重要'
  - '- 自我一和自我二需要协调，不能只靠自我二蛮干'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 人，有两个自我，分别是自我一、自我二。自我一，对应着理性，是一般意义上的自我。自我二，对应着感性，或者说对应着潜意识。
  - 任何一个比赛，实际上是同时进行的两场比赛，内在比赛和外在比赛。
  - 人们往往容易忽略的是，如果自我二（也就是潜意识），并不认可这个目标的时候，会输掉内在比赛。一旦输掉内部比赛，外在比赛也会输。
- 'no': 3
  name: 三到六个月确定性窗口期 —— 抓住“确定的春天”
  points:
  - '**为什么需要这个概念？**'
  - '- 商业机会往往伴随不确定性，普通人难以判断何时该全力投入'
  - '- 需要一个基于数据的、可推理的时机判断工具，避免盲目行动或错失良机'
  - '- 传统“等市场完全明朗再投入”会错过红利期，太早投入又容易成为炮灰'
  - '**核心定义**'
  - '- 参照香港疫情数据，大陆在首轮大规模感染后会有 2~3 个月的疫情平稳期，之后才进入第二波感染峰值'
  - '- 因此 2023 年春天是相对确定的稳定期，是生意人与投资者看重的窗口期'
  - '**关键性质**'
  - '- 以类比历史数据为基础，具有可推理性'
  - '- 窗口期意味着“确定但有限”，必须在期限内采取行动'
  - '- 行业恢复存在先后，旅游、健康、餐饮是切入最快的三个方向'
  - '**典型例子**'
  - '- 春节国内旅游人次恢复到 2019 年同期的 88.6%，出境机票上涨 258%'
  - '- 诺特兰德维生素片连续两个月为抖音直播单品销量第一'
  - '**边界条件**'
  - '- 该判断基于特定历史时期（疫情周期），不适用于无疫情背景的常规商业决策'
  - '- 窗口期预测有时间局限，3-6个月后需重新评估'
  - '- 切入时机确定后仍需个体结合自身资源选择具体玩法'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 最近 3~6 个月，是比较确定的疫情平稳期，之后才会迎来第二波疫情的峰值。
  - 香港跟大陆一样，也是第一次大规模疫情感染，就把八九成的居民给感染了。之后香港就进入了 2~3 个月的平静期，平静期之后就进入第二波疫情感染。
  - 至少 2023 年的春天，会是一个比较确定的稳定期。
  - 这个春天，可能是今年最重要的 3 个月窗口期。
- 'no': 4
  name: 成功是成功之母 —— 用体验唤醒潜意识
  points:
  - '**为什么需要这个概念？**'
  - '- 传统教育强调“失败是成功之母”，但这会让创业者陷入自我怀疑的循环'
  - '- 潜意识自信的建立需要具象的体验支撑，而非抽象的说教'
  - '- 需要一种可操作的方法来激发长期坚持所需的心理能量'
  - '**核心定义**'
  - '- 与其相信“失败是成功之母”，不如相信“成功才是成功之母”'
  - '- 过去的成功体验会在潜意识中累积自信，推动后续更大成功'
  - '**关键性质**'
  - '- 成功体验可以刻意“唤醒”和“制造”'
  - '- 一个成功体验推动一个又一个成功体验，形成正向循环'
  - '- 与“唤醒成功体验法”配套使用：先做容易成功的事制造体验，再挑战大目标'
  - '**典型例子**'
  - '- 优秀推销员一天工作开始前，先找优质客户或推销容易卖的产品，制造成功体验，再推进难度大的客户'
  - '- 作者本人通过回顾成功经历，在创业低谷期重新建立自信'
  - '**边界条件**'
  - '- “制造成功”不等于回避挑战，而是用小的成功为大的挑战蓄能'
  - '- 该方法适用于需要长期意志力的领域，不适用于单次精确决策'
  - '- 不能替代真正的能力建设，体验只是催化剂，能力才是发动机'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 失败不是成功之母，成功才是成功之母。
  - 我一个成功体验，推动一个又一个的成功体验。成功，才是成功之母。
  - 当自己内心很怂、不自信的时候，你需要回顾下自己成功的经历，唤醒自己的成功体验。
  - 你也一定有成功体验，在做新的事情之前，好好回顾回顾，从潜意识里唤醒它，它会帮助你走得更远。
- 'no': 5
  name: 俯视学习法 —— 战略藐视，战术重视
  points:
  - '**为什么需要这个概念？**'
  - '- 向他人学习时，容易陷入“跪着学”的仰视姿态，导致潜意识自卑，削弱内在比赛'
  - '- 需要一种既能汲取他人智慧又不丢失自我信心的学习方法'
  - '- 解决“学得好”与“信自己”之间的矛盾'
  - '**核心定义**'
  - '- 在战略（潜意识）层面保持国王般的俯视姿态：我是我领域的国王，他人的经验只是“奏折”'
  - '- 在战术（具体请教与落实）层面保持学生的认真态度：细节上认真对待'
  - '**关键性质**'
  - '- 战略藐视为潜意识注入王者心态，赢得内在比赛'
  - '- 战术重视确保具体能力的提升，避免盲目自大'
  - '- 二者结合形成“俯视但不轻视，学习但不盲从”的平衡'
  - '**典型例子**'
  - '- 作者对待生财有术社群的态度：把帖子当奏折来看，提取亮点但保持“朕才是国王”的信念'
  - '- 毛主席“战略上藐视敌人，战术上重视敌人”的军事思想迁移到个人学习'
  - '**边界条件**'
  - '- 适用于向同行、前辈、社群学习时的心理建设'
  - '- 不能演变为傲慢——俯视的是“我的领域”，在学习他人领域知识时应保持谦逊'
  - '- 需要先有扎实的领域积累，否则“国王心态”会变成“纸上谈兵”'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 我的答案是：别跪着学！要俯视！你就是国王，把生财有术的帖子，当成奏折来看。
  - 毛主席说，战略上藐视敌人，战术上重视敌人。跪着学生财有术的人，打不赢内在比赛。
  - 但是在战略上，来自于你的潜意识，你内心相信的应该是'老头儿，刚才你的奏折有一些亮点，朕心甚悦。可是，朕才是这个领域的国王。'
