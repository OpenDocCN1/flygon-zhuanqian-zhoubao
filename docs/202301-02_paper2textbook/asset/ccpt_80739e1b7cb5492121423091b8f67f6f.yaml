paper: docs/202301-02/20230207_04.md
desc: 该素材是《龙哥赚钱周报》2023年1月10日期刊，源自年费3000多的付费社群资源帖，汇编了多篇关于生财认知、生财技能的文章。核心内容包括：策略师应具备的五大能力（调研、归纳、项目管理、决断、叙事）；对web3新人的23条建议；商业模式画布的'道术器用'四层分析法；借助抖音平台发散思维进行闲鱼选品的方法；自动化信息推送工具（IFTTT）搭建教程；微小中创业的合规财税基础框架；以及如何科学撰写年度总结与制定年度目标的方法论（含5WHY分析法等）。素材整体聚焦于商业认知提升、实操赚钱技能传授与个人/企业经营管理方法。
concepts:
- name: 卓越策略师五大能力
  desc: 提出合格乃至卓越的策略师应具备的五项综合素养：扎实的调研能力、清晰逻辑的归纳总结能力、把控全局的项目管理能力、让人难以怀疑的决断力、面向内外部的双重叙事能力。
  is_original: true
  excerpt:
  - 1. 扎实的调研能力 不管是什么项目，不管你是多少年经验的营销从业者，在面对陌生的行业和客户时，都要下苦工去做充分的调研。
  - 2. 清晰逻辑的归纳总结能力 不同于广告的'头脑风暴'，策略师更加将就基于事实的归纳。
  - 3. 把控全局的项目管理能力 每一个项目都有着严格的提案时间，什么时候做访谈、什么时候要根据策略推动设计，这些都需要清楚的规划和时间意识。
  - 4. 让人难以怀疑的决断力 策略师能够成为让客户可以依赖的人，而不只是简单的需求执行方。
  - 5. 面向内外部的双重叙事能力 由于策略师特殊的身份，提案和汇报时会同时兼具面向客户和消费者的两种视角。
- name: 事实与观点
  desc: 在总结和目标设定中，必须严格区分事实与观点。事实是中性的、能用数字和证据支撑的；观点则因人而异、基于立场和层次差异，无法统一衡量。
  is_original: false
  excerpt:
  - 我们一定要知道自己和对方说出口的每一句话，到底哪一句是观点，哪一句是事实。我今年业绩做的不好，这句话是观点还是事实？----观点！
  - 只有中性的，能够用数字和证据支撑的才是事实，例如：我今年完成了83%的年度业绩目标。
- name: 问题是期望与现状的差距
  desc: 提出'问题'的定义是期望与现状之间的差距，无论期望大于现状还是现状大于期望，差距即为需要深挖的问题。
  is_original: true
  excerpt:
  - 1、期望和现状的差距，就是问题。不管是期望大于现状，还是现状大于期望。
methods:
- name: 商业模式画布的'道术器用'四层分析法
  desc: 用道、术、器、用四个层面讲清楚并运行所有项目：道为商业模式的本质，术为解决方案的9个关键维度，器为承载项目要素的工具平台，用为执行力与业务流迭代。
  excerpt:
  - 1、道的层面： 一句话阐述商业模式：我用一个XX产品/服务，解决了XX客户的XX痛点，赚XX钱。
  - 2、术的层面： ①解决谁的问题，一个企业（产品）想要接触和服务的不同人群或组织； ②解决什么问题，为客户创造价值的系列产品和服务； ③怎么让用户找到，如何接触和沟通客户来传递其价值主张；
    ④怎么和用户打交道，公司与特定客户群体建立的关系类型； ⑤我是谁，我有什么，商业模式有效运转所必需的最重要因素； ⑥谁能帮我，商业模式有效运作所需的供应商与合作伙伴的网络；
    ⑦我要做什么，确保其商业模式可行企业必须做的最重要的事情； ⑧我要付出什么，运营商业模式所引发的所有成本； ⑨我能得到什么，从客户群体中获得的收入；
  - 3、器的层面：承载上述9个板块的有没有更便捷的工具；
  - 4、用的层面：执行力、业务流的迭代； 为了确定这个工具，是否适合生财，花了6个小时，看完了《生财有术项目精选》的所有项目，并且将所有项目的商业模式画布都画出来。
- name: 抖音平台选品发散思维法
  desc: 借助抖音短视频平台，通过四种方式（电子代金券搬运、热门影视剧找产品、特定场景视频选品、技能类视频找灵感）来发散思维、发现闲鱼蓝海产品。
  excerpt:
  - 1、电子代金券搬运闲鱼 像我刷到的这个粒上皇的代金券，我在闲鱼一搜索，就有商家直接加利润在卖。这就是妥妥的一个信息差~
  - 2、热门影视剧里找产品 虽然我们作为搞钱人是不怎么煲剧的，但一样可以从一个小片段里找到一些可以借鉴的产品，突破选品的固定思维。
  - 3、特定场景视频选品法（特别好用系列！） 我每次都很喜欢刷到这样特定场景的视频，因为一个场景可以衍生出不少的产品出来。
  - 4、技能类视频找灵感 抖音这种技能类的视频也非常多，而且因为创作者经常会实跟热点创作，所以也是可以为我们所用的。
- name: IFTTT自动化信息推送搭建法
  desc: 使用IFTTT平台，通过无需编写代码、只需编辑参数的方式，将推特用户更新内容以邮件或企业微信群机器人两种方式自动推送到微信。
  excerpt:
  - 我最终找到了个IFTTT这个平台，这个平台就是自动化的，也不需要自己写代码，编辑上一些参数就行了。
  - 这个平台有两个推送方式：1、推特用户更新内容后，以邮件方式将推特内容推送到指定邮箱；2、推特用户更新内容后，通过企业微信群的机器人将内容推送到企业微信群（钉钉也可以）
- name: 科学设定目标与撰写年度总结方法论
  desc: 从六个角度系统阐述如何科学地写年度总结和制定目标：合格总结三要素、量化非销售岗位成绩、总结能力、区分规划与愿望清单、六原则设定科学目标、目标牵引与路径拆解。
  excerpt:
  - 一、合格的总结，得至少拥有这三个要素。二、即使并非销售岗位，也必须量化成绩。三、除了总结业绩之外，还必须总结能力。四、规划不是愿望清单，也不是待办事项。五、科学设定目标，需要遵循这六个原则。六、目标牵引，路径拆解以及痛苦的坚持。
  - 一次合格的总结必须带有下方三个因素：1、总结与目标的比对。2、要事实，不要观点。3、能够帮助发现问题。
- name: 5WHY分析法
  desc: 一种连续问5个'为什么'以探寻问题真实原因的分析方法，用于在总结中深挖'期望与现状差距'背后的根因。
  excerpt:
  - 第一个方法，叫5WHY分析法，意思是每当遇到问题时，都可以连续用5个WHY来探寻其发生的真实原因。
  - 1WHY：为什么老板骂我？因为我今天迟到了。2WHY：为什么我会迟到？因为我起床晚了。3WHY：为什么会起床晚？因为天杀的闹钟没响。4WHY：为什么闹钟没响？因为它没有电了。5WHY：为什么闹钟没电？因为我忘记了换电池。
theorems:
- name: 对调研的压倒性投入就是对客户的负责
  desc: 策略师面对陌生行业和客户时，必须投入压倒性的努力做充分调研，这是对客户负责的根本体现。调研背后需要深入一线、搜索、信息处理和快速学习等多种能力支撑。
  excerpt:
  - 对调研的压倒性投入，就是对客户的负责。而每一次调研的背后，可能是十几个竞品分析，十几万字的消费者、店长和经销商访谈，不计其数的行业报告等等。
  - 策略师不是一个白领，而是一个蓝领。
- name: 搜尽奇峰打草稿
  desc: 策略制定应基于广泛调研后进行的大量深入思考和分析，即先广泛收集事实（搜尽奇峰）再反复推敲归纳（打草稿），而非依赖办公室里的头脑风暴。
  excerpt:
  - 一句名言非常贴切：'搜尽奇峰打草稿'，这个典故是画家在画山峰时广泛收集各种不同的山峰，并不断练习打草稿。懂得搜奇峰是懂得妙理，多打草图是能用苦功。
  - 比起一堆人坐在办公室里'头脑风暴'，不如深入一线，去针对现象进行总结归纳。
- name: 合格的总结必须能发现问题
  desc: 总结的目的就是'发现问题'，因为完美不可能存在而问题无处不在；完不成目标有问题、完成目标也有问题（为何不能超额），超额完成也有问题（目标是否设太低）。
  excerpt:
  - 总结的目的是什么？我认为就是简单四个字：发现问题。（请注意，在这里'问题'并非是一个贬义词）
  - 完不成目标有问题，为什么完不成？完成了目标有问题，为什么没办法超额完成？超额完成了目标也有问题，那是不是我们的目标设置得太低？为什么？
- name: 无目标则总结无从谈起
  desc: 判断一项工作是否成功必须依据最初设定的目标；没有目标作为锚点，任何业绩陈述都只是'我做了什么'的行为表达，而非合格的总结。
  excerpt:
  - 判断一项工作是否成功，要看一开始设计的目标是什么，没有目标，总结无从谈起。
  - 目标就是我们工作的锚点或者标准，没有目标，我们永远都不知道自己做的到底是好还是不好，永远都不知道我们是否正在沿着设定的方向前进。
findings:
- name: web3新人入局的23条建议
  desc: '[claim] 原作者可乐提出对想入局web3新人的23条建议，包括：web3非常早期对普通人友好、勿丢场外赚钱能力、小成本试错、不玩杠杆合约、保护资产、多动手实践、抓住好机会重仓比平庸机会轻仓收益大、会卖比会买重要、人声鼎沸时一定要跑等。'
  excerpt:
  - 1.现在的web3还非常早期，对普通人非常友好。2.入局web3之后，不要丢掉场外赚钱的能力。3.要对这个行业充满敬畏，机遇和风险并存。4.敢于去尝试，用小成本试错。...16.一个好机会重仓的收益，远远大于许多个平庸机会轻仓的收益。17.会卖比会买更重要...18.人声鼎沸的时候一定要跑。19.时刻牢记20字箴言，见好就收，有利必跑，狠心出货，切勿幻想，变现为王。
- name: 抖音刷半小时可挖掘十几个蓝海产品
  desc: '[evidence] 作者饼饼通过4个具体实例（粒上皇代金券、热门剧《去有风的地方》中的保温餐炉、理发店场景中的洗头床与置物架、春节画兔灯笼视频）验证了借助抖音平台选品法：细心留意场景和产品，半小时可挖出十几个蓝海产品。'
  excerpt:
  - 视频的好处在于我们所看到的场景和产品非常的直观，如果你细心留意，半个小时挖出十几个蓝海产品完全是没有问题的。
  - 像我刷到的这个粒上皇的代金券，我在闲鱼一搜索，就有商家直接加利润在卖。这就是妥妥的一个信息差~
  - 我刷到最近大火的刘亦菲的新剧：去有风的地方。其中这个片段是在一个自助餐厅的场景...立马就去闲鱼搜索了一下，果然是有需求的。
  - 像我刷到的这个洗剪吹理发店的广告视频。画面里就有非常多的产品可以直接拿来搜索...这些都是会触发批发单的产品，值得大家去上架测一测。
  - 像我刷到的这个画兔年灯笼的视频，我就想到春节的相关产品最近在闲鱼肯定也是需求很高，一搜索果然如此。
- name: 商业模式画布适合项目篇不适合技能篇
  desc: '[claim] 作者认为商业模式画布是众多商业工具中用得最多、帮自己赚钱最多的工具，适合用于项目拆解分析，但不适用于技能类帖子；并对《生财有术项目精选》所有项目都用商业模式画布进行了拆解验证。'
  excerpt:
  - 商业模式画布，是我用的众多商业工具里面，用得最多的一个，也是帮我赚钱赚最多的一个。商业模式画布，适合项目篇哈，不适合技能篇。
  - 为了确定这个工具，是否适合生财，花了6个小时，看完了《生财有术项目精选》的所有项目，并且将所有项目的商业模式画布都画出来。
- name: 线下到场1200人未必是成功的活动
  desc: '[evidence] 以某次线下活动为例佐证''总结必须与目标比对''的原理：到场1200人看似热闹，但若目标是2000人到场、或满意率、或转化率，则本次活动的成功性判断完全不同。'
  excerpt:
  - 我们曾经举办过一场线下活动，到场了1200人，很热闹，大家也很happy，但是我们能够称之为一次成功的活动吗？
  - 不能，要是我们的目标是到场2000人呢？要是我们最一开始的目标是满意率呢？要是我们的目标是活动后的转化率呢？
- name: 基于场景的温度感知差异说明观点因人而异
  desc: '[evidence] 用10摄氏度气温对不同常年居住地的人的感知差异类比，说明基于角度、立场和层次的差异，不同人对同样一句话的理解不一样，因此总结中必须用事实而非观点交流。'
  excerpt:
  - 譬如10摄氏度的气温，对于一个常年生活在0摄氏度地方的人来说，会觉得'好温暖'；可对于一个常年生活在20摄氏度地方的人来说，会觉得'太冷了'。此时，假如双方进行辩论的话，就互相会觉得对方在胡说八道。
