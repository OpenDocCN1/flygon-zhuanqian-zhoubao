paper: docs/202301-02/20230207_03.md
desc: 该素材是一份付费社群'龙哥赚钱周报'的合集，汇总了2023年1月中旬生财有术社群内的多篇精华帖，内容涵盖生财认知（项目底层逻辑、战略思维、商业认知）、生财技能（AI工具、文案、股权分配）、亦仁问答（副业与生活平衡、执行力）、生财项目（抖音本地生活、微信捡漏群、视频号直播、私域变现等）以及线下实体（书画门店收款）与游戏租赁、YouTube海外内容等案例。素材的核心价值在于集中呈现了互联网创业的多种实操方法论、时代红利的认知框架（如'每一百块钱有九十块钱是时代红利'）以及以私域流量、矩阵运营、精细化社群运营为代表的变现模式，并附有大量具体数据、操作流程和复盘结论。
concepts:
- name: 时代红利与个人能力补偿
  desc: 该概念主张普通人赚取的绝大部分收入来自时代红利，仅少部分是对个人能力的补偿，因此创业者应识别并最大化利用时代红利。
  is_original: false
  excerpt:
  - 可能所有夸张，我们所赚的每一百块钱，有九十块钱是时代红利，仅有十块钱是时代对我们个人能力的补偿，英雄只是时势的产物。
- name: 长短线结合项目属性（以视频号直播+私域为例）
  desc: 该概念描述一种既有短期爆发力又有长期基本盘的业务模式，即通过视频号直播获得短期流量与营收，同时将用户沉淀至私域实现长期复购与衰减周期较慢的年产值。
  is_original: false
  excerpt:
  - 近年来，因为现在信息传递越来越快了，项目红利期是越来越短的。所以我就在思考，怎么样能长短线结合，又有短期的爆发力，又有长期的基本盘。目前看，视频号直播+私域是有这个属性的。
- name: 好方向 = 想做 & 能做 & 可做的交集
  desc: 该概念定义个人创业方向的选择标准，认为好方向是热爱（想做）、专业能力（能做）和时间成本（可做）三者的交集，且权重排序为能做 > 想做 > 可做。
  is_original: false
  excerpt:
  - 个人方向的定义很简单：好方向 = 想做 & 能做 & 可做的交集。想做：热爱（非讨厌）的；能做：专业能力所在的；可做：花时间能完成的。
  - 关于好方向定义，权重还是：能做（硬技能） > 想做（心态） > 可做（体力）。
- name: 实时真实ROI（含私域产值）
  desc: 该概念指将私域流量产生的额外年产值计入投放产出后，综合计算得到的投产比，通常显著高于仅计算直播间广告直接回报的ROI。
  is_original: false
  excerpt:
  - roi2.5 也就是我 100 万的营业额，需要有 40 万的广告投放，那么在这 40 万的投放算到私域中，我将额外有 100 万×60%×60/150=24
    万的私域营业额，这一块是无需投放的……这么一算我的 roi 就从 2.5 提升到了 3.5。
- name: 捡漏群（优惠券社群）
  desc: 该概念指通过企业微信建立社群，以原价1-3折的超高性价比商品吸引用户，通过佣金变现的电商模式，通常每天精推一个主品并配置大量演员营造抢购氛围。
  is_original: false
  excerpt:
  - 捡漏群：用户在我们的群里可以用原价的 1-3 折买到超高性价比的商品。…… 能通过售卖商品来产出佣金，实现变现。
  - 目前这种模式不仅能将单品的产出发挥到极致，还不会造成选品的困难。
- name: 私域单客价
  desc: 该概念强调在私域流量运营下，应关注单个消费者长期贡献的总销售额（单客价），而非传统的单次客单价，通过拉长用户生命周期和增加复购来提升整体销售额。
  is_original: false
  excerpt:
  - 电商有个'客单价'的概念，而在私域流量运营的思维下，真正值得关注的不是'客单价'，而是'单客价'，就是一个消费者总共贡献了多少销售额。
- name: 内容为王与杠杆效应（代码/媒体）
  desc: 该概念化用《纳瓦尔宝典》的观点，认为商业杠杆来自资本、劳动力和复制边际成本为零的产品（代码和媒体），并强调内容（包括代码）是低成本高复利的杠杆。
  is_original: false
  excerpt:
  - 《纳瓦尔宝典》里面也有一句话记忆犹新：想要获得财富，就必须充分利用杠杆效应。商业杠杆来自资本、劳动力和复制边际成本为零的产品（代码和媒体）。
  - Content is King！如果代码也算内容的一种形式。
- name: 演员氛围（社群运营）
  desc: 该概念指在捡漏群等社群中配置大量'演员'（托），通过模仿真实用户抢购、晒单等行为，营造爆单和紧迫氛围，从而提高真实用户的转化率和社群产出。
  is_original: false
  excerpt:
  - 一个群必须有 20 个以上的演员，确保整个群的发品节奏。演员是捡漏群的灵魂，有演员和没演员的情况，社群产出起码相差一半以上。
- name: 视频号直播引流与金句卡片
  desc: 该概念指在视频号直播中利用企业微信弹出、金句卡片等工具，在不跳出直播环境的情况下实现高效引流和转化，一小时内可加到200人私域。
  is_original: false
  excerpt:
  - 第一个，用好企业微信，直播时候点弹出，引流到私人微信，带任何链接形式分销，二维码形式分销，都是非常是丝滑的，可以不用跳出直播环境，直接完成转化。
  - 第二个，都知道 ppt 模式可以让人停留更久，我优化了一个对大家来说更丝滑的方式，就是金句卡片。
methods:
- name: __overview__（私域+直播+社群运营整体方法论）
  desc: 该素材整体呈现一套以'私域流量沉淀与多重变现'为核心的创业方法论，包含从公域引流（视频号直播、抖音）、私域精细化运营（捡漏群、选品排品、演员氛围）到多重变现（淘客、副业、无货源）的完整链路。
  excerpt:
  - 捡漏群的商业闭环：通过免费/付费的引流，将目标用户从各大平台引流到企业微信，再拉到 500 人大群里，通过售卖商品来产出佣金，实现变现。
  - 核心要点：稳定的企微主体、靠谱且稳定的流量、精细化的社群运营、社群的规模大小，以及多重变现方式。
- name: 直播+私域 ROI 核算公式
  desc: 该方法提出一个量化模型：客单价n、毛利率q、广告投入y、直播间营业额z、私域进线率60%、月产值p，据此计算纯直播利润与加入私域后的综合利润与ROI提升。
  excerpt:
  - 做一个公式：客单价 n 的产品，毛利率如果是 q，投入 y，直播间除去退货后营业额为 z。私域进线率 60%为合格，月产值为 p。那么你只做直播间纯利润就是
    q*z-y；做私域后纯利润就是 q*z-y 每个月加上 z/n×60%×p，月递减前 3 个月按 80%算，后面看维护。
- name: 找项目与抄同行方法
  desc: 该方法建议创业者寻找有成熟结果的项目，以'抄同行'为最快路径，通过关键词搜索同行、以顾客身份套取话术与流量渠道，并强调主流人群都在做的项目不会差。
  excerpt:
  - 同行就是最好的老师，抄同行永远是做项目最快的途径，能避开多数弯路和无用功。
  - 每个项目都有关键词，通过关键词在各个推广渠道搜索这个项目的关键词就一定可以找到同行。
  - 我们以客户的角度去思考如果我想要买这个产品，我会在哪去搜关键词，自然也可以找到同行的流量渠道。
- name: 做局盈利法（卖空气案例分析）
  desc: 该方法总结一套围绕'简单有效、直击需求、软文过审、无中生有、做局套话'的轻资产产品设计与营销策略，主张'不解决问题，也不是好产品'并不影响赚钱。
  excerpt:
  - 文章核心围绕：简单有效、直击需求、软文过审、无中生有、做局套话。一句话概括：'不解决问题，也不是好产品'，并不会影响赚钱！
- name: 股权分配五步法
  desc: 该方法提供一套科学量化初创公司股权分配的五步法，旨在定性定量地计算股权，避免踩坑。
  excerpt:
  - 《初创公司如何科学量化股权分配？股权分配五步法教你不再踩坑》……在如何科学量化股权分配上，我还没有看到有圈友系统的分享过，所以今天我冒昧来给大家分享下如何定性定量的科学的把股权算出来。
- name: 抖音本地生活破局五步打爆门店法（SOP）
  desc: 该方法提供一套从选爆品、POI加热、短视频矩阵、直播运营到好评维护的完整SOP，用于将实体门店在抖音本地生活赛道从0打爆至1。
  excerpt:
  - 一个门店的从 0 到 1 打爆，保证这个方式，再按照我之前分享到的推广流程，基本上就没太大问题。
  - 1. POI 加热是从业者的第一课。…… 2. 没有爆品就别做推广。…… 3. 玩转短视频矩阵和直播运营就能发财。…… 4. 好评率的维护极其重要。
- name: 捡漏群精细化运营法（选品排品+精推文案+催单+演员）
  desc: 该方法详细拆解捡漏群的运营细节，包括选品渠道（定向招商群、选品网站、同行群）、排品节奏、精推文案撰写、4-6次递进式催单以及30-50个演员的氛围营造。
  excerpt:
  - 选品渠道：定向招商群、大淘客、好单库等主流淘客选品网站，还有同行群。
  - 精推文案：预告文案+秒杀文案+催单文案，一般加起来都要一百多条消息。
  - 发品节奏：10:00-10:30大主品秒杀、11:00第一次催单……19:00隔天大主品预告。
  - 演员目的：提高社群活跃度，可信度，爆单假象！一个群一般都要有 30-50 个托。
- name: 同城实体门店收款转化法（三步走）
  desc: 该方法总结一条帮助实体门店提升销售额的路径：引爆同城流量（微信同城群+抖音爆店码）、裂变自有/新流量（66元定金卡+拼团）、转化到店流量（造节促销+群接龙），20天可实现160万收款。
  excerpt:
  - 主要环节分为这几块：1、引爆同城流量；2、裂变自有流量；3、转化到店流量。
  - 通过这样的方式，裂变了 4000 人左右的微信群，95%以上的都是宝妈。
  - 定金卡的数量在 624 张……通过这三步走，转化了 160 万。
- name: YouTube内容出海运营法（流量+SEO+互动）
  desc: 该方法系统总结在YouTube上进行教育类内容出海的经验，涵盖平台理解、内容创作（IP/独立站/引流三方向）、成本与启动周期、多渠道分发、数据分析（浏览时长/用户量）、SEO优化（标题封面关键词）、互动率和定期复盘，以及通过直播和360度视频创新获取超额流量。
  excerpt:
  - 分析数据指出浏览时长最重要：YouTube在判断一个视频好坏的最重要的因素就是视频的浏览时长。
  - SEO重点：一定要简洁精准、不要堆砌关键词，说人话。
  - 多渠道分发：将视频分享到 FB，Twitter 等其他社交媒体或者专业论坛上，增加视频的展示几率。
  - 结尾引导：制作模板结尾，推荐其他视频给用户。
- name: 副业转老板路径（招人+杠杆）
  desc: 该方法建议副业收入增长疲惫时，拿出部分收入招聘他人处理重复基础工作，从而释放自己精力成为老板，建立赚钱杠杆，提升天花板。
  excerpt:
  - 拿出你现在收入的一部分，别舍不得，这是必须要花的钱，把重复的基础的活整理出来，安排给其他人，可以是家里的亲戚，可以是同学朋友，让他们开始给你兼职干活。
  - 一旦你习惯了这样的方式，不断的通过花钱找人帮你干活，你就开始成为一个老板，赚钱的杠杆就有了。
- name: 战略发挥优势法（筹码-出牌框架）
  desc: 该方法以国家战略（苏联国土纵深、中国高铁与一带一路）和商业为例，提出战略的核心是先审视自身资源筹码，再决定如何运用优势获取结果，强调发挥优势补齐短板。
  excerpt:
  - 战略就是先审视自己手里的筹码，也就是自己的优势，然后再决定自己怎么打牌，也就是如何运用自己的优势来获得你想要的结果。
  - 在执行战略的时有个核心的思路，就是要发挥自己的优势。
theorems:
- name: 多数情况下没有不赚钱的项目，只有不赚钱的人
  desc: 该核心主张认为能拿出来卖且有人操作盈利过的项目不会是纯坑，项目失利多因个人认知或执行不足，而非项目本身不可行。
  excerpt:
  - 多数情况下没有不赚钱的项目，只有不赚钱的人。凡是大一些的，能拿出来卖的项目就不会是一个纯坑。因为只有有一部分人操作这个项目挣到过钱，这个项目才会流出来，才会被拿出来卖。
- name: 商业模式换汤不换药、客户群体不断新生
  desc: 该核心主张认为互联网商业模式（如代运营、好物分享）会周期性重复，只是换平台或名称，新客户世代不断产生，因此多年前的项目仍可持续变现。
  excerpt:
  - 商业模式不断的换汤不换药，新的客户群体也不断产生。这就会导致，玩了很多年的项目，甚至是十年前的项目，现在依然有人做的很好。
- name: 战略=选择，最重要是不做什么
  desc: 该核心主张强调战略的本质是取舍和选择，关键决策在于明确不做什么，而非盲目追求做更多。
  excerpt:
  - 什么是战略呢？就是选择。选择，其最重要的就是不做什么，而不是做什么。
- name: 做局套话与无效产品盈利论
  desc: 该核心主张提出在某些需求分析情境下，不需要真正解决问题或提供优质产品，仅通过有效的噱头、软文和'做局'氛围即可实现盈利。
  excerpt:
  - 文章核心围绕：简单有效、直击需求、软文过审、无中生有、做局套话。一句话概括：'不解决问题，也不是好产品'，并不会影响赚钱！
- name: 没有壁垒的项目本质是付费买试错经验
  desc: 该核心主张认为普通人能接触的互联网项目（淘宝、抖音、美团等）基本无绝对核心壁垒，任何项目培训的本质是让用户付费购买别人的试错经验和时间成本。
  excerpt:
  - 目前我们普通人能接触到的互联网项目不是科研项目，本质上讲几乎是没有任何壁垒的……所以市面上所有项目培训的本质就是付费买别人的试错经验和时间。
- name: 没有爆品就不做推广
  desc: 该核心主张强调在抖音本地生活中，爆品是成功关键，没有爆品时强行推广会转化极差甚至适得其反，一切动作如同赌博。
  excerpt:
  - 一定不能做逆流而上的事情，没有爆品去做强推，转化会一言难尽，甚至适得其反。铁子们这一块就遵循一个原则，没有爆品就不做抖音推广的动作，否则一切动作就是在赌博。
- name: 执行力是值钱的，是可以变现的
  desc: 该核心主张通过宝妈4个月加4000好友被高价购买和作者被亦仁邀请等案例，论证持续的执行力本身具有经济价值并可被奖励变现。
  excerpt:
  - 记得亦仁说我想告诉大家，执行力是值钱的，执行力是可以变现的，我想奖励执行力；邀请我去生财办公室这何尝不是对我的执行力的一种奖励。
  - 亦仁大概花了 7W 买了她坚持 4 个月加了 4000 多好友的微信号。
- name: 战术勤奋无法逃避战略探索
  desc: 该核心主张批判用忙碌工作麻痹自己、以战术勤奋逃避战略突破的行为，认为这是短期轻松但长期有毒的。
  excerpt:
  - 动脑是很累的，探索是令人恐惧的，用战术上面的勤奋来逃避真正战略上要去探索和突破的事情，用忙碌的工作来麻痹自己，是短期轻松的，长期确是有毒的。
findings:
- name: 视频号直播+私域综合ROI提升至4.5
  desc: '[evidence] 该发现由作者个人案例与核算公式支撑：150客单价、进粉率60%、月产值8-15元条件下，只做直播ROI为2.5，加入私域产值后提升至3.5，若月产值翻倍则可达4.5。'
  excerpt:
  - 我们 150 客单价的产品，进粉率 60%的情况下，月产值只能做到 8……年产值算完衰减，能到 60。
  - 这么一算我的 roi 就从 2.5 提升到了 3.5……翻个倍的话 roi 就能提升到 4.5。
- name: 捡漏群月佣100W+的运营结果
