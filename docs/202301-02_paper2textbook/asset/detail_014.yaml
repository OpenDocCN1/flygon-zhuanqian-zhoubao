  name: 视频模板元素化 —— 把爆款解构成六个零件
  points:
  - '**为什么需要这个概念？**'
  - '- 手工逐个制作视频效率极低，无法支撑矩阵化批量产出的需求'
  - '- 爆款视频看似千变万化，实则背后有可复用的结构规律'
  - '- 需要一种抽象方法，把视频从''灵感创作''变成''标准化组装'''
  - '**核心定义**'
  - '- 提出所有短视频都可以被拆解为六种基本元素（背景、标题、内容、文案、字幕、背景音乐），这是实现视频自动生成的核心抽象模型'
  - '**关键性质**'
  - '- 完备性：任何形式的视频模板都能拆成这六种元素'
  - '- 可替换性：每个元素都可以独立寻找相似替代素材，实现差异化'
  - '- 可编程性：拆解后可用代码自动生成，实现批量生产'
  - '**典型例子**'
  - '- 一个中医养生流量视频可拆解为：背景（中医大师照片放大模糊）、标题（''请等一下，xxxx''）、内容（照片）、文案（''国医大师xxx''）、字幕（无）、背景音乐（xxx）'
  - '**边界条件**'
  - '- 元素化拆解适用于模板化、套路化的视频类型（如带货、口播）；对于强创意、特效复杂的视频，拆解与复现难度大'
  - '- 元素相似素材的收集质量直接影响生成视频的质量上限'
  sources:
  - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
    role: origin
  excerpts:
  - 所有的视频都可以拆成以下元素：1. 背景：图或者视频 2. 标题：主、副标题 3. 内容：图、视频 4. 文案：5. 字幕：6. 背景音乐：
  - 视频模板有各种各样的形式，拆解的多了会发现其实都是上面提到的那些元素组成的
  - 举例，第一个流量视频模板可以拆解为：背景：一张中医大师的照片，放大模糊；标题：请等一下，xxxx；内容：一张中医大师的照片；文案：国医大师xxx；字幕：无；背景音乐：
- 'no': 7
  name: 混淆元素机制 —— 给批量视频打上'原创'水印
  points:
  - '**为什么需要这个概念？**'
  - '- 批量生成的视频若高度雷同，会被平台判定为搬运或低质量内容，无法过原创审核'
  - '- 需要一种机制，在自动化生产的同时保证每条视频的独特性'
  - '**核心定义**'
  - '- 在自动生成的视频中加入自己拍摄的照片和视频作为混淆元素，以保证生成内容在平台上能通过原创审核'
  - '**关键性质**'
  - '- 唯一性：混淆元素的加入确保每条生成视频互不相同'
  - '- 原创性：加入自拍素材后，视频可通过任何平台的原创审核'
  - '- 低成本：混淆元素不依赖昂贵素材，用手机随手拍即可'
  - '**典型例子**'
  - '- 在中医养生视频中，随机插入自己拍摄的日常照片或视频片段，使自动生成的几十条视频各不相同且都算原创'
  - '**边界条件**'
  - '- 混淆元素应与视频主题有一定相关性，否则可能影响内容质量和观众体验'
  - '- 加入混淆元素的密度需适度，过多会稀释核心信息'
  sources:
  - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
    role: origin
  excerpts:
  - 每个视频的生成时都加一些混淆元素，用自己拍的照片和视频
  - 再加上混淆元素，这样能保证做出来的视频都是原创视频，且每个视频生成的都不相同，在任何一个平台都能过原创。
- 'no': 8
  name: 黑马小达人策略 —— 低粉高销才是学习的标杆
  points:
  - '**为什么需要这个概念？**'
  - '- 对标大达人（头部网红）的销量数据存在严重幸存者偏差——他们因粉丝基础加成，销量天然偏高，普通人无法复制'
  - '- 需要找到与自身发展阶段更匹配的学习样本，才能获取真正可借鉴的策略'
  - '**核心定义**'
  - '- 在采集数据后，优先筛选''粉丝量少但销量高''的视频作为学习对象，因为大达人有粉丝基础加成，销量天然偏高，黑马小达人更适合小达人用户对标学习'
  - '**关键性质**'
  - '- 可参考性：黑马小达人没有粉丝加成，其成功更多归因于内容本身，更值得普通玩家学习'
  - '- 信号价值：低粉高销说明其选品、脚本、投放策略经过了市场验证'
  - '- 实时性：官方平台数据实时更新，能捕捉最新的爆款规律'
  - '**典型例子**'
  - '- 在巨量百应创意中心筛选时，优先选择粉丝量低于5万但单条视频GMV较高的账号，拆解其脚本结构与选品逻辑'
  - '**边界条件**'
  - '- 黑马小达人样本可能是个别爆款运气使然，需结合多条视频数据综合判断'
  - '- 在极度冷门的小众赛道，黑马样本可能过少，无法形成有效对标'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  excerpts:
  - 我的思路是找那种,粉丝量少,但是销量高的视频,做参考
  - 这种黑马小达人更是我们小达人适合学习的对象,毕竟大达人都是有粉丝基础加成在的,销量天然会高一点.
- 'no': 9
  name: 脚本模板复用 —— 用旧瓶装新酒，成功率远超瞎原创
  points:
  - '**为什么需要这个概念？**'
  - '- 完全依赖灵感进行原创，成功率低且不可持续'
  - '- 爆款脚本的底层结构往往经久不衰，换汤不换药即可继续见效'
  - '**核心定义**'
  - '- 爆款脚本模板随时间变化慢，一个经过验证的脚本模板通过替换文案和商品，其成功率大概率高于毫无依据的原创，因此可持续积累与复用'
  - '**关键性质**'
  - '- 可迁移性：同一个模板可跨品类、跨产品反复使用'
  - '- 稳健性：验证过的模板有保底效果（至少60分以上）'
  - '- 累积性：模板库越积累越厚，后续测试成本越低'
  - '**典型例子**'
  - '- 从一个爆款中医养生视频中提取脚本结构，将文案替换为另一个保健品，推送到不同账号，而非每次重新构思'
  - '**边界条件**'
  - '- 模板复用存在边际递减，同一模板使用过多次后效果下降，需关注平台对同质化内容的压制'
  - '- 模板复用适合成熟赛道，对于新兴蓝海品类，模板缺乏验证数据'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  excerpts:
  - 好的脚本大概率是不会过时的,一个脚本模板,改改文案换个产品推,成功率大概也比瞎原创要好一点吧.
  - 好记性不如烂笔头,不如全部下载保存起来吧.
