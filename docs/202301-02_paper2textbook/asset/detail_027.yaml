  name: 蹭流截流开店 —— 借对手流量打对手脸
  points:
  - '**为什么需要这个概念？**'
  - '- 传统中介门店自带精准自然客流，新平台缺流量、缺信任'
  - '- 选址成本高、引流难，需低成本获取高意向客群'
  - '**核心定义**'
  - '- 在传统中介旗舰店隔壁开小店，门头打“0中介费”截流对手自然客流'
  - '- 仅做引流转化，不做重资产运营，利用对手品牌势能完成冷启动'
  - '**关键性质**'
  - '- 成本不对等：对手付房租养客流，己方付房租收客流'
  - '- 心理冲击：用户进对手店发现隔壁免中介费，极易转单'
  - '**典型例子**'
  - '- 涧西区标杆中介店隔壁开店：截流大量顾客，导致对手销售额连降、店员不敢带客进店'
  - '**边界条件**'
  - '- 仅适用于线下高频、标品、决策周期短的业务（租房、二手房）'
  - '- 需承受对手恶意投诉、同行打压等非市场竞争风险'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 传统的中介店会有大量的客户到店，我们只需要在隔壁开一家小店，很小的一家店，就会有源源不断的客流通过我们店铺门前。只用做好引流跟转化就行了。
  - 用互联网的专有名词，就是蹭，蹭其他中介的流量，然后通过我们的门头标语：买二手房，租房，"0"中介费。来吸引用户到店，以达到截流的目的。
  - 一个典型的案例，我们这边有个涧西区，涧西区有个中介门店，该门店是整个洛阳市区里的标杆店跟销售冠军门店。我们在这个店的隔壁开了一家店，门头就是“0 中介费”。自从开了店以后，截流隔壁门店好多顾客，导致这家门店销售额接连下降，店员也不敢带顾客去店里面谈了。
