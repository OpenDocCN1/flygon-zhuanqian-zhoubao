  name: 中介费伪概念 —— 信息差是中介费的唯一护城河
  points:
  - '**为什么需要这个概念？**'
  - '- 传统中介靠垄断房东电话收取高额费用，用户痛点极强'
  - '- 互联网本质是消除信息不对称，中介费本质是“智商税”'
  - '**核心定义**'
  - '- 中介费之所以能收取，仅因买房/租房者不知道业主联系电话'
  - '- 一旦信息透明化（平台直接连接房东租客），中介费即失去存在合理性'
  - '**关键性质**'
  - '- 伪概念本质：非服务定价，纯信息垄断定价'
  - '- 可被平台模式（撮合交易+会员费/佣金）替代'
  - '**典型例子**'
  - '- 胖龟找房：自建小程序+线下门店，不收中介费，改收年费会员费、开发商返佣、代办费、租房佣金（由二房东承担）'
  - '**边界条件**'
  - '- 仅适用于标准化程度高、流程可SOP的租售场景'
  - '- 复杂产权、纠纷房源仍需专业中介介入，非全量替代'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 我们不收中介费，是因为中介费本身就是个伪概念！为什么说是伪概念，因为是智商税，中介费为什么要收？就是因为买房及租房者不知道售房及出租转让业主的联系电话！
  - 如果买房者或者租房者知道房东电话！那么他们还会给中介公司掏中介费吗？nonononon，绝对不会！这叫什么？是不是信息不对等差造成的信息差？
  - 生意的本质就是信息差，在互联网里也存在大量的信息差生意。以这个信息差为市场的切入点我们创办了胖龟找房的 1.0——没有中介费的个人房屋分享平台。
