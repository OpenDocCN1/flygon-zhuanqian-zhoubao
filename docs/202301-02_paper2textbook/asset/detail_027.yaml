- 'no': 6
  name: 股权分配五步法 —— 从吵架到算账的标准化动作
  points:
  - '**为什么需要这个概念？**'
  - '- 将主观博弈转化为标准化流程，降低沟通成本，提升公平感'
  - '- 给新手创业者提供“拿来即用”的操作手册'
  - '**核心定义**'
  - '- 步骤1：确定行业赛道（技术/资金驱动 × 自主/孵化）定基础权重区间'
  - '- 步骤2：收集创始团队信息（全职/兼职、岗位分工、出资额度）'
  - '- 步骤3：自评互评确定四维度权重比例（达成共识是前提）'
  - '- 步骤4：各股东四维度打分1-10分得权重系数'
  - '- 步骤5：加权计算最终股权比例'
  - '**关键性质**'
  - '- 共识前置：步骤3未达成共识则后续步骤无意义'
  - '- 可追溯：每步留痕，事后复盘有据可查'
  - '**典型例子**'
  - '- 体能项目完整演示：赛道定为自主创业+技术驱动型 → 收集三人信息 → 自评互评定权重 → 打分系数 → 算出比例'
  - '**边界条件**'
  - '- 仅输出初步比例，必须配套法律文件（一致行动权、期权池、回购条款等）才能落地'
  - '- 适用于3-5人核心团队，人数过多建议引入持股平台简化决策链'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 在确认四个维度的权重比例后，我们会按照五步法来计算出各个股东的最终股权比例，下面带大家一起过一个真实案例。
  - 第一个步骤：确定行业和赛道……第二个步骤：收集创始团队信息……第三个步骤：确定每个维度的权重比例……第四个步骤：确定股东四个维度的权重系数……第五个步骤：计算出各个股东的股权比例。
  - 我们要先确定赛道，也就是你所处的行业，不同的赛道，对资金和技术的权重不一样。我们把行业分成2个维度四个类型，分别是技术驱动型/资金驱动型，以及自主创业型/集团孵化型……
  - 我们要开始收集合伙人的信息，也就是创始人的信息和其他联合创始人的信息。以及这个项目里面谁是全职，谁负责哪个岗位，各自出资额度等。
  - 这涉及到刚刚说的另一个工具，创始团队之间的自评和互评，从而达成一个共识，股东们要先认可这个赛道的这4个维度就是在这样的一个区间波动微调。
  - 我们确定了每个维度的权重比例之后，就要确定股东四个维度的权重系数，按从 1 到 10 各自去打分……
