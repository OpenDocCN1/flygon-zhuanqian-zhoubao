unsupported_claims:
- location: '27.15'
  claim: 中介费本质是智商税/信息差税，信息透明即可取消
  reason: 素材中未提供实证数据支撑‘中介费=纯信息差’的绝对化结论，忽略了中介提供的看房陪同、合同审核、资金监管、纠纷调解等实质性服务成本
- location: '27.13'
  claim: 蹭流截流开店能显著冲击对手业绩（销售额连降、员工不敢带客）
  reason: 仅凭单一案例（涧西区一家店）推断普遍规律，缺乏多店对照实验、时间序列对比或第三方验证数据
- location: '27.14'
  claim: 二房东渠道‘单员工月两单覆盖成本、一线城市佣金1-2万’
  reason: 素材未披露样本量、统计周期、佣金结算周期、空置率等关键运营指标，无法验证盈利模型的普适性
- location: '27.16'
  claim: 抖音投放ROI远优于汽车广播（2万广播‘水花都看不到’）
  reason: 未控制投放素材、定向、时段、归因窗口等变量，单渠道对比缺乏科学性
- location: '27.17'
  claim: 2021年杭州上线‘0中介费政府平台’构成政策性竞争
  reason: 素材仅提及‘杭州上线’，未提供平台名称、运营主体、房源量、用户量、成交量等对比数据，无法判定竞争强度
