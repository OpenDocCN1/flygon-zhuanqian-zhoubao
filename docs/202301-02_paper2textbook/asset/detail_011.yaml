learning_targets:
- 理解官方实时爆款视频库与第三方工具的核心差异及对标价值
- 掌握黑马小达人样本策略：为何低粉高销视频比头部大号更具参考性
- 掌握 RPA 批量采集全流程：从参数配置、反爬对抗到脚本库自动化构建
- 掌握脚本模板复用论：将爆款视频拆解为“骨架+变量”实现标准化生产
- 掌握对标账号筛选标准体系：用量化指标锁定低风险、高产出的素材源
- 掌握视频搬运去重标准化流水线：放大→翻转→BGM→加字四步 SOP 与合规边界
- 掌握直播话术扒取与改写闭环：从录音转文字到模块化文档资产的沉淀
- 掌握靠视频拉流的开播节奏：以视频破万播放为触发条件的动态开播策略
- 掌握小红书资料号运营核心：以钩子设计驱动评论区转化，而非追求虚荣指标
- 掌握抖音公转私自动化全链路：五大转化入口、官方接口升级玩法与双线防封体系
concept_map:
- 短视频带货情报与生产体系
- ├── 情报获取层
- │   ├── 官方实时爆款视频库          —— CGZ4dZq4ZoSFT4xUmFecNpk4nNe
- │   │   ├── 爆款视频模块（行业/等级/周期）
- │   │   └── 创意搜索模块（关键词/商品名/GMV过滤）
- │   ├── 黑马小达人样本策略            —— CGZ4dZq4ZoSFT4xUmFecNpk4nNe, Lg2vd5GWHoqhBbxuT5LcThEpncb
- │   │   ├── 核心指标：粉丝<5万 & 单视频GMV高
- │   │   └── 价值：剥离粉丝加成，还原纯内容转化力
- │   └── RPA 批量采集与脚本库构建      —— CGZ4dZq4ZoSFT4xUmFecNpk4nNe
- │       ├── 创意搜索采集机器人（参数化/定时/导出表格+视频）
- │       ├── 爆款分类采集机器人（多维筛选/批量下载）
- │       └── 飞书妙记/剪映语音转文字 → 结构化脚本库
- ├── 生产加工层
- │   ├── 脚本模板复用论                —— CGZ4dZq4ZoSFT4xUmFecNpk4nNe, ZcEdd0xTCo1K5IxwCyLccKUynOb
- │   │   ├── 六大模块：钩子/痛点/演示/信任/锚定/引导
- │   │   └── 生产公式：选模板+填变量+微调节奏
- │   ├── 对标账号筛选标准体系          —— Lg2vd5GWHoqhBbxuT5LcThEpncb, CGZ4dZq4ZoSFT4xUmFecNpk4nNe
- │   │   ├── 硬指标：粉丝≤5W/视频≥200/持续更新
- │   │   ├── 软特征：垂直品固定/画面干净/穿插非带货
- │   │   └── 评分模型：加权打分+周度巡检更新
- │   └── 视频搬运去重标准化流水线      —— Lg2vd5GWHoqhBbxuT5LcThEpncb
- │       ├── 核心四步：放大1.1x → 镜像翻转 → 音频处理 → 文字重构
- │       ├── 关键创新：加字引导（卖点/痛点/场景化文案）
- │       └── 增强项：调色/插帧/MD5修改/元数据清洗
- └── 直播转化层
- '    ├── 直播话术扒取与改写闭环          —— Lg2vd5GWHoqhBbxuT5LcThEpncb'
- '    │   ├── 扒取：双机录音/录屏 → 六阶段分段'
- '    │   ├── 结构化：语音转文本 → 黄金句/框架/弹幕库'
- '    │   ├── 改写：保留心理逻辑+替换卖点/人设+违规词清洗'
- '    │   └── 迭代：实战验证 → 复盘卡顿/高转化/违规 → 版本库周更'
- '    └── 靠视频拉流的开播节奏            —— Lg2vd5GWHoqhBbxuT5LcThEpncb'
- '        ├── 触发条件：新视频破万播放/累计在跑>5万'
- '        ├── 节奏控制：单场1-3h/体感疲劳即关播/间隔1-2h再开'
- '        └── 熄火机制：连续2场无流无单→停播转产视频'
- 小红书资料号运营体系
- ├── 核心定位：引流转化 > 虚荣指标（赞/藏）
- ├── 选品策略：三厨狂喜（自喜/用户喜/平台喜）+ 蓝海细分
- ├── 爆款生产：七分选题三分内容 + 二极管标题 + 杂交法
- ├── 钩子设计：冰山一角原则（给一半留一半）+ 评论区造势
- └── 连爆机制：抄别人爆款→跑出自己爆款→抄自己爆款
- 抖音公转私自动化体系
- ├── 账号分级：蓝V/半蓝/员工号/黄V/普通号 → 权限矩阵
- ├── 五大入口：主页/评论/私信/直播/群 → 普通/升级双玩法
- ├── 升级核心：官方接口（巨量纵横/企业号后台）免费+自动回复+抗风险
- ├── 防封体系：风险分级（官方>接口>第三方>小程序）+ 双线并行（抖音端+微信端）
- └── 兜底方案：白名单域名/小程序备用池/防截图/微信客服替代
- 抖音盲盒项目风控实战
- ├── 财务逻辑：号=消耗品，产值>成本即可
- ├── 起号核心：福袋+小号托→从众心理接极速流
- ├── 运营节奏：单场15min/无断播日两场/有断播日一场
- ├── 风控分级：未挂组件(轻)>不确定性派发(中)>违反行为规范(重→封设备)
- └── 设备处置：复播验证→换机排查→抖音来电确认→刷机
life_analogy:
- 想象短视频带货是一场**“开餐厅”**的生意：
- '- **官方实时爆款视频库** = **米其林后厨的每日出菜单**：官方后厨（巨量百应）实时公布今天最卖座的菜（爆款视频）、食材成本（GMV）、食客评价（粉丝/互动），比美团大众点评（第三方工具）更准、更快、有隐藏菜单（腰部黑马）。'
- '- **黑马小达人样本策略** = **只学“白手起家的小馆子”不学“继承家产的连锁店”**：大达人自带粉丝流量像“继承家产”，销量高不代表菜好；粉丝少却天天排队的小馆子，其菜单（脚本）、食材（选品）、火候（剪辑）才是纯技术、可复制的“硬本事”。'
- '- **RPA 批量采集** = **雇佣一支“不眠不休的采购小分队”**：你给清单（搜索词/类目/GMV阈值），他们自动跑遍全市场（翻页/滚动），把菜单抄回来、食材（视频）买回来、整理成标准食谱表（脚本库），你只管做菜。'
- '- **脚本模板复用论** = **把“红烧肉标准SOP”贴在灶台上**：爆款视频底层说服结构像“红烧肉”的固定步骤（焯水、炒糖色、炖煮、收汁），新菜（新视频）只需换食材（产品卖点）、调调火候（节奏），出品稳定、上手极快。'
- '- **对标账号筛选标准体系** = **建立“合格供应商白名单”**：不找知名大厂（头部大号，素材带水印/字幕、去重难、被盯得紧），找“小而美、出货稳、包装干净、持续供货”的优质小厂（粉丝<5万/视频>200/垂直品/画面纯净），纳入白名单按周考核。'
- '- **视频搬运去重流水线** = **中央厨房的“预制菜标准化加工线”**：原料进厂 → 统一切配（放大/翻转） → 换汤底（BGM/变速） → 贴自有品牌标签（加字引导）
  → 出成品。核心秘诀不是洗多干净（像素去重），而是贴上自家“招牌字”（场景化文案）让食客下单。'
- '- **直播话术扒取与改写闭环** = **把“金牌销冠”的推销词变成“全员话术手册”**：派人偷师（双机录音） → 整理成分阶段、可复制的“话术积木”（开场砖/留人瓦/讲品梁/促单顶）
  → 新员工搭积木上岗 → 每周按实战数据换新积木。'
- '- **靠视频拉流的开播节奏** = **“看天吃饭”的摆摊智慧**：视频是“风”，直播是“风筝”。风来了（视频破万）立马放线开播；风停了（流量衰减）果断收线关播，不硬抗、不浪费线（账号权重），等下阵风（下条爆款视频）再放。'
- '- **小红书资料号** = **“免费试吃摊”引流术**：只给食客尝一口（冰山一角），剩下的“满汉全席”藏在后厨（私域），食客想吃全套就得加微信排队。评论区的“排队声”比点赞收藏更值钱。'
- '- **抖音公转私** = **“自动化收费站”建设**：《官方ETC通道》（企业号后台/巨量纵横）免费、稳、不限流；《第三方现金车道》（App/小程序卡片）易拥堵、易被查、无自动收费。建设核心是：主路走官方ETC，备用道存现金车道，双线同时开工保通行。'
- '- **抖音盲盒项目** = **“赌场筹码”管理游戏**：账号是筹码（消耗品），直播间是赌台，福袋是发彩金钓鱼，小号托是托儿带节奏。核心纪律：赢了收筹码（日结分成），输了换桌（刷机/换号），从不赌上瘾（止损/控时长），只赌数学期望（财务逻辑）。'
summary:
- concept: 官方实时爆款视频库
  desc: 巨量百应创意中心提供的实时、全维度、可下载的带货视频数据源，精度与时效性显著优于第三方工具
- concept: 黑马小达人样本策略
  desc: 筛选粉丝量低但单视频GMV高的视频作为学习对象，剥离粉丝流量加成，还原可复制的纯内容转化能力
- concept: RPA 批量采集
  desc: 基于影刀等工具开发参数化采集机器人，实现搜索、翻页、字段提取、表格导出、无水印下载的端到端自动化
- concept: 脚本模板复用论
  desc: 将验证过的爆款脚本抽象为六大模块化骨架+变量槽位，新视频制作=选模板+填变量，大幅提升成功率与效率
- concept: 对标账号筛选标准体系
  desc: 粉丝≤5万、视频≥200条、垂直品固定、画面干净、持续更新的量化筛选模型，配合周度评分巡检构建低风险素材池
- concept: 视频搬运去重标准化流水线
  desc: 放大→翻转→BGM处理→加字引导四步核心SOP，配合批量工具实现日产百条合规视频，核心在于“加字”而非单纯去重
- concept: 直播话术扒取与改写闭环
  desc: 扒取→结构化→改写→实战验证→版本迭代的全流程，将隐性话术资产显性化、模块化、合规化，支撑团队复制
- concept: 靠视频拉流的开播节奏
  desc: 以视频破万播放为触发条件开播，单场1-3小时，流量衰减即关播，避免无效直播损账号权重，实现人效与流量利用率最大化
- concept: 小红书资料号钩子设计
  desc: 遵循“给一半留一半”核心原则，通过冰山一角展示激发索取欲，配合评论区造势（引导+羊群效应）实现单篇笔记引流20-30人
- concept: 抖音公转私官方接口升级玩法
  desc: 利用企业号后台官网主页、巨量纵横评论自动回复、直播卡片讲解类型，实现免付费、5秒内自动回复、抗封禁的跳转链路
- concept: 抖音盲盒项目财务与风控体系
  desc: 以号为消耗品核算ROI，福袋+托儿破解冷启动，15分钟单场控风控，三级违规分级应对，封设备即刷机，实现可复制放大
exercises:
- 'no': 1
  title: 实战：从零搭建一个“竞品脚本雷达”
  contents:
  - 场景：你要切入“家用除螨仪”细分品类，需在 3 天内产出 10 条高转化潜力脚本。
  - 任务 1：打开巨量百应创意中心，用“创意搜索”以“除螨仪”为关键词，按 GMV 降序筛选近 7 天 TOP 20 视频。记录：前 3 条视频的 GMV、粉丝量、投流占比（若可见）。
  - 任务 2：应用“黑马小达人样本策略”，从 TOP 20 中筛选“粉丝<2万 且 GMV>5000”的视频。若不足 5 条，放宽粉丝阈值至 5 万，再筛。记录最终入选视频数量。
  - 任务 3：下载入选视频（无水印），用飞书妙记/剪映转文本。将每条视频按“前3秒钩子-痛点放大-产品演示-权威背书-价格锚定-行动号召”六模块拆解，提炼固定句式/镜头语言。
  - 任务 4：基于拆解结果，制作 1 份“除螨仪通用脚本模板”（骨架+变量槽位），并按模板生成 3 条不同卖点（如：母婴级除螨/宠物家庭/敏感肌友好）的脚本草稿。
  - 思考题：
  - '- 为什么不建议直接模仿粉丝 100 万+ 大达人的同品类视频脚本？'
  - '- RPA 采集机器人运行时“占用前台”如何解决？对比“专用闲置电脑”“云服务器”“无头浏览器”三种方案的成本与维护难度。'
  - '- 平台升级语义级视频理解后，像素级去重（放大/翻转）失效，脚本模板层面应如何进化？'
- 'no': 2
  title: 实战：建立“种子对标账号库”并跑通去重流水线
  contents:
  - 场景：你需要为“中老年养生茶”品类建立长期素材供给渠道。
  - 任务 1：在快手/抖音搜索“养生茶/三高茶/药食同源”，按“最新”排序，人工浏览 50 个账号主页，按《对标账号筛选标准体系》六项硬指标（粉丝/视频数/垂直度/画面/非带货/更新频次）打分，筛选
    Top 5 纳入种子库。记录 5 个账号的主页链接与评分明细。
  - 任务 2：取种子库中某账号最新 3 条带货视频，按《视频搬运去重标准化流水线》操作：
  - '  1. 剪映专业版导入 → 画面放大 1.08 倍 + 水平镜像'
  - '  2. 原声处理：保留人声→变速 1.1x + 底噪；或静音→换节奏感 BGM'
  - '  3. 识别字幕 → 遮盖原字幕（黑条/马赛克） → 添加黄底红字“加字引导”（如：‘三高老伴不敢喝？这款0糖0添加’）'
  - '  4. 导出 1080P，用 MD5 修改工具改文件哈希。'
  - 任务 3：用抖音/视频号创作者中心“原创检测”功能测试 3 条成品视频，记录通过率。若有不通过，回溯是哪一步参数（放大倍数/翻转方向/BGM来源/字幕遮盖面积）导致。
  - 思考题：
  - '- “加字引导”文案如何A/B测试？设计一套“同素材、不同文案、分账号投、比转化”的最小化实验方案。'
  - '- 种子账号突然停更 10 天，评分模型应如何自动预警并触发替换机制？伪代码描述。'
- 'no': 3
  title: 实战：直播话术“扒-改-练-测”最小闭环
  contents:
  - 场景：你要在视频号直播间卖“中老年按摩仪”，单场目标 GMV 1 万+。
  - 任务 1：扒取。找 3 场同品类头部直播回放（场观>5万、成交>200单），双机操作（一机看播、一机手机录音/电脑录屏），按“开场福袋(0-10min)-留人互动(10-30min)-讲品痛点(30-60min)-促单倒计时(60-90min)-逼单收尾(90-120min)”五阶段分段录音，语音转文字存入飞书文档。
  - 任务 2：结构化。提炼每阶段 3-5 个“黄金话术模块”（如：开场‘福袋钩子话术’，讲品‘决策树话术：肩颈疼选A/腰腿疼选B’），标注：心理触发点（损失厌恶/从众/权威）、违规风险词（最低价/全网首发/根治）。
  - 任务 3：改写。保留心理触发逻辑，替换为自有产品参数、主播人设语气（如：邻家大姐/退休老医生），清洗违规词。形成《按摩仪直播话术手册 V1.0》。
  - 任务 4：实战验证。按《靠视频拉流的开播节奏》，发 1 条垂直痛点视频（脚本来自练习1模板），破万播放后开播，主播背诵 V1.0 话术+实物演示。复盘记录：各阶段场观/停留/点击/下单/违规提醒。
  - 思考题：
  - '- 话术手册为何要按“阶段”而非“时间轴”模块化？当直播间流量结构变化（如极速流占比高/精准流占比高）时，如何动态增减模块？'
  - '- “违规词库”如何实现动态更新？设计一套“每日巡检平台公告+自动同步文档高亮+主播早会同步”的低成本机制。'
- 'no': 4
  title: 实战：小红书资料号“选题-钩子-评论区”冷启动
  contents:
  - 场景：你要从 0 起一个“考公资料号”，目标首周引流 200 精准粉。
  - 任务 1：选题。用“找到蓝海赛道四步法”锁定细分赛道（如：省考行测/申论真题/面试热点），输出 10 个符合“三厨狂喜”的选题。
  - 任务 2：钩子制作。按“好钩子三步获取法”找 3 个同行高转化钩子，改编为“冰山一角”版本（展示 3 道题，引导“扣1领完整版”）。
  - 任务 3：发布与评论区运营。连发 3 天，每天 2 篇笔记（早/晚各 1），用“引爆评论区操作法”：大号引导扣数字 + 3 个小号抢首评。记录每篇笔记的评论数、引流数。
  - 任务 4：连爆验证。若某篇笔记评论破 100，次日按“连爆技术”复制该模板再发 2 篇，观察流量是否延续。
  - 思考题：
  - '- 为什么“赞 100 评 100”的笔记比“赞 1w 评 20”更赚钱？结合《资料号钩子核心原则》解释。'
  - '- 新号首篇笔记赞评比接近 1:1 是何信号？如何利用此信号判断账号权重？'
- 'no': 5
  title: 实战：抖音公转私“官方接口双通道”搭建与压测
  contents:
  - 场景：你有一个蓝V认证的抖音号，需搭建“评论区自动回复+直播间小风车”双通道引流私域。
  - 任务 1：评论通道。登录巨量纵横，授权绑定抖音号，设置关键词“资料”→ 回复内容含微信客服链接/蓝字跳转。测试：评论“资料”后 5 秒内是否收到回复、链接是否可点击跳转微信。
  - 任务 2：直播通道。企业号后台→场景管理→添加直播卡片→选择“讲解”类型→配置微信客服跳转。开播测试：点击小风车是否弹出微信客服、是否可一键添加企微。
  - 任务 3：防封压测。连续 3 天日播，每日评论区诱导 50 次、直播间发卡片 20 次。记录：账号是否收到违规提醒、跳转链路是否中断、微信客服是否被限流。
  - 任务 4：兜底演练。模拟主小程序被封：切换备用小程序池、更换白名单域名、启用防截图举报机制。记录切换耗时、流量损失量。
  - 思考题：
  - '- 为什么“官方接口”能做到免费、自动回复、抗风险三合一？对比“第三方 App 生成卡片”在域名拦截、自动回复、抗举报三维度的本质差异。'
  - '- 双线防封（抖音端+微信端）中，哪一端的风控更隐蔽、更难排查？如何设计“抖音来电+微信客服后台”双预警机制？'
- 'no': 6
  title: 实战：抖音盲盒项目“起号-风控-复制”最小闭环
  contents:
  - 场景：你要测试抖音盲盒直播项目，预算 2000 元（含设备/抖币/样品），目标 7 天内单号日均利润 500+。
  - 任务 1：起号。新号养 3 天（刷视频/看直播/点赞）→ 第 4 天开播：充 6 元抖币发福袋（评论指令/5min/1/3个）→ 安排 2 个小号抢福袋造从众
    → 单场 15 分钟，日两场。记录：开播 2/5/10 分钟进人数、极速流有无。
  - 任务 2：风控分级应对。若出现违规：
  - '  - “未挂载组件”：立即开橱窗挂手机链接规避；'
  - '  - “不确定性派发”：屏蔽“盲盒/抽奖”词、控时长≤20min；'
  - '  - “违反行为规范”：当天停播，次日同设备复播验证→换机排查→监听抖音来电→确认封设备即刷机。'
  - 任务 3：复制放大。跑通单号模型后，按“纯提成合作模式”招 2 个主播（无底薪/10-15%提成/日结），同设备轮播，目标日产出 3 号×2 场×15min。
  - 任务 4：财务复盘。核算：设备成本+抖币+样品+主播提成 vs 佣金收入，判断 ROI 是否>1。若<1，伪代码描述自动止损逻辑（如：连续 3 天亏损→停项）。
  - 思考题：
  - '- “财务逻辑：号=消耗品”如何改变传统“养号惜号”心态？在什么情况下应果断刷机换号而非申诉？'
  - '- “锁人头”机制下，充值转化差为何不可急？设计“进群 3/7/14 天未充值”分层唤醒策略。'
units:
- 'no': 1
  name: 官方实时爆款视频库 —— 让对标拥有“实时雷达”
  points:
  - '**为什么需要这个概念？**'
  - '- 短视频带货需要快速找到当下最能出单的视频脚本和选品'
  - '- 第三方工具（抖查查、蝉妈妈）数据滞后、不准，无法捕捉最新爆款'
  - '- 官方平台（巨量百应创意中心）掌握一手实时 GMV、粉丝、投流数据，是“最准的对标源”'
  - '**核心定义**'
  - '- 巨量百应创意中心内置的“爆款视频”与“创意搜索”两大模块'
  - '- 可按行业、作者等级、时间周期、关键词/商品名筛选近期带货效果最好的真实短视频'
  - '- 提供视频 GMV、销量、粉丝量、投流数据等核心指标，支持无水印下载'
  - '**关键性质**'
  - '- 实时性：数据为平台官方实时更新，比第三方工具快、准'
  - '- 全维度：覆盖各行业、各层级作者（含腰部/尾部黑马），非仅头部榜单'
  - '- 可下载：支持批量导出数据表格、无水印视频文件，便于二次分析'
  - '**典型例子**'
  - '- 搜“拖把”关键词，按 GMV 降序，10 秒内找到近 7 天卖得最好的 20 条带货视频及其完整数据'
  - '- 按“家居-清洁”类目、达人等级“腰部”、近 3 天筛选，发现多个粉丝仅 2 万但单条 GMV 10 万+的黑马视频'
  - '**边界条件**'
  - '- 需拥有巨量百应账号权限（通常需开通商家/达人后台）'
  - '- 仅覆盖抖音生态内投流/自然流带货视频，不含快手、视频号等跨平台数据'
  - '- 数据仅反映“已发生”的爆款，不能直接预测未来趋势，需结合人工判断'
  - '...'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  excerpts:
  - 一个是爆款视频,能找到各个行业,不同等级作者,近期的非常实时的最新带货效果最好的短视频.
  - 这个是比抖查查蝉妈妈这些第三方要更准确的行业优秀爆款视频库.对于上不了热榜的来说,这里更容易找到同行的东西.
  - 对标对标,这里上榜的,出成绩的,最新的,不就是最好的对标吗?
- 'no': 2
  name: 黑马小达人样本策略 —— 让学习对标“去伪存真”
  points:
  - '**为什么需要这个概念？**'
  - '- 大达人自带粉丝流量加成，销量高不代表视频/脚本好，盲目模仿易“水土不服”'
  - '- 小号/新号缺乏粉丝基础，更需要学习“无粉丝加成也能爆单”的纯内容/脚本能力'
  - '- 粉丝少但销量高（GMV 高）的视频，其脚本、选品、剪辑才是真正可复制的“硬本事”'
  - '**核心定义**'
  - '- 在采集到的爆款视频数据中，优先筛选“粉丝量低（如<5万）但 GMV/销量高”的视频作为学习样本'
  - '- 核心指标：单视频 GMV、转化率、ROI，而非总粉丝数或账号权重'
  - '- 此类账号称为“黑马小达人”，其成功更依赖内容质量与选品精准度'
  - '**关键性质**'
  - '- 可复制性强：剥离了粉丝流量变量，剩下的纯内容转化能力对新号/小号参考价值最高'
  - '- 抗干扰性：大达人常有团队、投流、品牌加持，黑马视频更接近“单视频自然流/少量投流”裸跑实力'
  - '- 样本稀缺：需从海量数据中用 RPA+筛选规则挖掘，非榜单显性展示'
  - '**典型例子**'
  - '- 某清洁类目视频，作者粉丝 8000，单条视频 GMV 5 万+，脚本结构“痛点开头-演示对比-价格锚定-引导下单”被直接复用'
  - '- 批量采集 1000 条视频后，按“粉丝<2万 & GMV>1万”筛选，仅剩 12 条，逐帧拆解成脚本模板库'
  - '**边界条件**'
  - '- 需警惕“投流刷量”造假视频，需结合 ROI、自然流占比、评论真实度二次校验'
  - '- 仅适用于“内容/脚本驱动型”品类，强品牌/强供应链驱动型品类（如 3C 数码）参考价值低'
  - '- 样本量随类目波动，冷门类目可能找不到足够黑马样本，需放宽阈值或跨类目借鉴'
  - '...'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: improve
  excerpts:
  - 我的思路是找那种,粉丝量少,但是销量高的视频,做参考
  - 这种黑马小达人更是我们小达人适合学习的对象,毕竟大达人都是有粉丝基础加成在的,销量天然会高一点.
  - 粉丝在5W以下、视频在200以上、一直围绕几个品反复带、视频画面不是自己加很多字的、有一定的非带货视频、保持更新，这样的号我就会把它列入考察目标。
- 'no': 3
  name: RPA 批量采集与脚本库构建 —— 让情报收集“自动化流水线”
  points:
  - '**为什么需要这个概念？**'
  - '- 官方爆款库每天更新海量视频，人工逐条点击、记录、下载、转文字效率极低、易遗漏'
  - '- 需将“搜索-筛选-采集-下载-转文本”全链路自动化，才能建立可持续更新的个人脚本素材库'
  - '- 非程序员也需低门槛实现自动化，RPA（影刀）提供可视化拖拽+少量代码即可开发采集机器人'
  - '**核心定义**'
  - '- 基于影刀 RPA 开发两类采集机器人：① 创意搜索采集（按关键词/商品名+GMV过滤）② 爆款分类采集（按行业/作者等级/时间周期）'
  - '- 自动执行：翻页滚动、字段提取（标题、GMV、粉丝、链接）、表格导出、无水印视频下载'
  - '- 配合飞书妙记/剪映语音转文字，批量将视频转为文本脚本，存入飞书/Notion 形成可检索脚本库'
  - '**关键性质**'
  - '- 端到端自动化：从打开网页到得到结构化数据+视频文件，全程无人值守'
  - '- 参数化配置：搜索词、翻页数、GMV 阈值、导出路径均可在 UI 填写，复用性强'
  - '- 反爬鲁棒：模拟真人操作（随机延时、鼠标轨迹），规避平台高频访问封禁'
  - '**典型例子**'
  - '- 每天早 9 点定时运行“创意搜索采集”，输入竞品关键词“除螨仪”，自动导出近 3 天 TOP50 视频数据与视频到本地文件夹'
  - '- 周一运行“爆款分类采集”，选“美妆-护肤-达人等级腰部-近 7 天”，得 200 条视频，配合飞书妙记批量转文本，周三完成脚本库周更'
  - '**边界条件**'
  - '- RPA 运行时会占用鼠标/键盘/屏幕（前台运行），电脑不可同时做他事，建议专用机/云服务器跑'
  - '- 平台前端结构变更（类名、 DOM 调整）会导致脚本失效，需定期维护选择器'
  - '- 免费版影刀/云扩等 RPA 工具并发数、运行时长有限制，大规模采集需付费或自建 Selenium/Playwright 方案'
  - '...'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  excerpts:
  - 指定搜索词/商品名;滚动刷新次数;按gmv过滤视频,默认过滤0销量;数据采集表格导出,默认到桌面;可选视频下载(无水印);记住上次输入的内容
  - 可选大行业,子行业类目;可选作者等级;可选时间周期;下拉刷新页数;数据采集表格导出,默认到桌面;可选视频下载(无水印);记住上次输入的内容
  - 视频下载下来,可以用飞书妙记,语音转文字,你懂得.
- 'no': 4
  name: 脚本模板复用论 —— 让爆款结构“拿来即用”
  points:
  - '**为什么需要这个概念？**'
  - '- 从零原创脚本成功率低、周期长、成本高，且缺乏验证'
  - '- 爆款视频的底层说服结构（钩子-痛点-方案-信任-引导）具有跨品类、跨时间的稳定性'
  - '- 将验证过的爆款脚本抽象为“模板+变量”，仅替换产品卖点/场景/话术即可快速生产新视频'
  - '**核心定义**'
  - '- 将高 GMV 视频逐帧拆解为：前 3 秒钩子、痛点放大、产品演示、权威背书、价格锚定、行动号召 6 大模块'
  - '- 每个模块提炼“固定句式/镜头语言/节奏”作为模板骨架，产品相关内容作为变量槽位'
  - '- 新视频制作 = 选模板 + 填变量 + 微调节奏，而非重新编写'
  - '**关键性质**'
  - '- 成功率提升：实测模板化改脚本成功率显著高于“瞎原创”'
  - '- 生产效率：单条脚本产出从 2 小时降至 20 分钟以内'
  - '- 资产沉淀：脚本库随项目积累成为核心护城河，人员流失不带走核心能力'
  - '**典型例子**'
  - '- “家用清洁类”通用模板：开头‘别再用 XX 了’(钩子)→ 特写污渍(痛点)→ 一擦即净(演示)→ 实验室检测报告(信任)→ 9.9 元 3 瓶(锚定)→
    左下角小黄车(引导)'
  - '- 将该模板套用“洗碗机/除霉凝胶/管道疏通剂”三款产品，仅替换演示画面与参数，3 条视频均跑出正 ROI'
  - '**边界条件**'
  - '- 模板有生命周期：平台审美迭代、用户免疫、竞品跟进会导致模板疲软，需持续从官方库更新迭代'
  - '- 非万能：强剧情/强人设/强技术流品类（如数码评测、剧情号）不适用纯模板化'
  - '- 合规红线：模板中不可包含违禁词、虚假承诺、诱导分享等违规话术，需法务/运营逐条清洗'
  - '...'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  - paper: docs/202301-02/ZcEdd0xTCo1K5IxwCyLccKUynOb.md
    role: improve
  excerpts:
  - 好的脚本大概率是不会过时的,一个脚本模板,改改文案换个产品推,成功率大概也比瞎原创要好一点吧.好记性不如烂笔头,不如全部下载保存起来吧.
  - 关键词要准确反映核心剧情的内容；关键词要尽量简洁避免冗长；关键词一定要让自己看得懂。
  - 将核心剧情提前后，还可以适当添加一些能够调动情绪的修饰词，比如'竟然''偏偏''非要'等。
- 'no': 5
  name: 对标账号筛选标准体系 —— 让素材源“自带过滤器”
  points:
  - '**为什么需要这个概念？**'
  - '- 直接搬运头部大号视频易被判搬运、限流，且大号素材常带水印、字幕、个性化强、去重难'
  - '- 需要一套可量化、可执行的筛选标准，在海量账号中精准定位“适合搬运/对标”的优质素材源'
  - '- 标准需覆盖：账号体量、内容垂直度、更新频次、画面干净度、素材可用性等多维度'
  - '**核心定义**'
  - '- 核心指标阈值：粉丝 ≤ 5 万、视频数 ≥ 200 条、近 30 天持续更新'
  - '- 内容特征：围绕 3-5 款固定垂直品反复带货（素材稳定）、画面干净无自带字幕/水印（去重成本低）、穿插非带货内容（账号真实、非纯营销号）'
  - '- 评分模型：按上述指标加权打分，Top 20% 纳入“种子对标账号库”，每周自动巡检更新'
  - '**关键性质**'
  - '- 低搬运风险：小号素材被平台/同行监测到的概率低，去重后过原创审核率高'
  - '- 高素材产出：视频量大、更新勤、品固定，单账号可持续供给数月素材'
  - '- 可监控性：指标均为公开数据，可通过 RPA 定时抓取自动评分预警'
  - '**典型例子**'
  - '- 筛选“家居清洁”类目：从 500 个账号中筛出 12 个种子账号（粉丝 1-3 万、视频 300+、只卖 3 款拖把、画面纯实拍），月均产出可用素材
    80+ 条'
  - '- 发现某账号突然停更 10 天，自动评分跌出库，及时替换为新晋账号，保证素材源鲜活'
  - '**边界条件**'
  - '- 标准阈值随平台算法迭代需动态调整（如粉丝上限从 5 万放宽至 10 万）'
  - '- 仅适用“实物带货/演示型”视频，不适用口播、剧情、混剪等依赖人设/剪辑的内容形态'
  - '- 需配合法律审核：确认素材账号授权或属于合规二创范围，避免侵权纠纷'
  - '...'
