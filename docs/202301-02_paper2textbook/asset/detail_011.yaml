  - '**关键性质**'
  - '- 去除了粉丝基础的影响，更聚焦于内容本身与选品策略的有效性'
  - '- 对普通玩家具有更高的可模仿性和迁移性'
  - '- 是筛选数据、锁定学习对象的优先级排序原则'
