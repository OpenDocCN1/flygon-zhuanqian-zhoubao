  - '- 垂直选源：锁定优质作者与专栏，确保文章来源稳定且匹配账号定位'
  - '- 前置吸引：将核心剧情（冲突、悬念、反差）提炼后前置到视频开头，提升完播率'
  - '- 用户思维：从观众输入便捷性与审美疲劳出发设计关键词与素材'
  - '**典型例子**'
  - '- 关注8~10个符合账号定位的优质作者，通过其动态“顺藤摸瓜”找文章；选中爆文后，再从其所属盐选专栏里筛选同类型文章，实现“作者垂直+专栏垂直”双保险'
  - '- 将一篇“中开高走”的文章，把最精彩的情节（如“分手”“千金”）提炼成关键词并前置到开头，完播率从40%提升至65-70%'
  - '**边界条件**'
  - '- 精细化运营需要投入时间进行选文、改文、剪辑与互动，对个人玩家的日投入有要求（参考案例为1.5小时/天）'
  - '- 关键词设计需避开人名、地名、职务等敏感词，防止触发平台审核'
  - '- 该方法更适合小说推文领域，其他内容赛道的适配度需另行评估'
  sources:
  - paper: docs/202301-02/ZcEdd0xTCo1K5IxwCyLccKUynOb.md
    role: origin
  excerpts:
  - 选文是小说推文项目的绝对核心。选文可分为两个步骤，首先是找到充足的、优质的文章来源，其次是筛选出符合账号定位、有爆文潜力的文章。
  - 关注8~10个符合账号定位的优质作者，在知乎-动态里可以看到他们每天点赞的文章、关注的问题、发布的回答还有他们关注的作者，顺腾摸瓜挨个找下去。
  - 如何提高5s完播率乃至整体完播率？这些个问题转化一下就是：如何把文章的精彩部分在开头就呈现给观众？
  - 关键词是拿到后切换到另一个app键入搜索的，越简单越容易输入越好，一眼就能记下来最好。
  - 重复率低，越低越好，人无我有最好。素材质量高，越高越好。来源稀缺，门槛越高越好。
  - 好数据需要良好的评论区互动支持，及时点赞、回复观众评论，让观众感受到博主的关心和支持。
