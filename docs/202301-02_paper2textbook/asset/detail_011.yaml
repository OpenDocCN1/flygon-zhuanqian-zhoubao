  - '- 利用飞书妙记将下载的爆款视频转成文字脚本，存入素材库备用'
  - '**边界条件**'
  - '- 脚本复用需结合平台的原创审核机制，避免直接搬运导致限流'
  - '- 模板并非万能，当某一模板流量衰减后需及时更换新的爆款模板'
