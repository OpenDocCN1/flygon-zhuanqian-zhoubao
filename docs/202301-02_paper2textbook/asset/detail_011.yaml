  - 视频下载下来,可以用飞书妙记,语音转文字,你懂得。
- 'no': 4
  name: 蓝海与红海 —— 从“狼多肉少”到“狼少肉多”的赛道判断
  points:
  - '**为什么需要这个概念？**'
  - '- 在看似竞争激烈的红海赛道中，往往存在大量机会的蓝海细分领域'
  - '- 选对赛道比努力更重要，选错方向则努力白费'
  - '- 避免陷入同质化竞争，提高成功率'
  - '**核心定义**'
  - '- 红海指竞争激烈、同行实力强的领域（狼多肉少），蓝海指竞争少、机会多的细分赛道（狼少肉多）；本质是供不应求还是供大于求'
  - '**关键性质**'
  - '- 相对性：在看似红海的大赛道中存在蓝海的细分领域，反之亦然'
  - '- 动态性：随着入场者增多，蓝海会逐渐变红'
  - '- 判断标准：由供给与需求的对比关系决定'
  - '**典型例子**'
  - '- 小学语文赛道看似红海，但细分到“一年级”或“二年级”可能机会更多；对比24小时内小学语文与小学英语的笔记发布量，发现英语类目竞争更小'
  - '**边界条件**'
  - '- 蓝海判断依赖于市场调研的准确性，需结合搜索下拉词、头部竞争者的观察、最新与最热笔记数量对比等方法来综合判断'
  - '- 蓝海的窗口期可能很短，需快速切入'
  sources:
  - paper: docs/202301-02/IpCcdJ9NAoAt4pxKKV5c5sfenZc.md
    role: origin
  excerpts:
  - 红海：狼多肉少；蓝海：狼少肉多
  - 有些是大赛道看起来蓝海 部分细分领域已经打破头了；有些是大赛道看起来红海 部分细分领域还是很空白
  - 本质：供不应求还是供大于求
  - 血的教训：选择大于努力，选择不对 努力白费！
- 'no': 5
  name: 三厨狂喜 —— 让“我喜欢、用户喜欢、平台喜欢”同时发生
  points:
  - '**为什么需要这个概念？**'
  - '- 只做自己喜欢的内容容易自嗨，用户不买单'
  - '- 只做用户喜欢的内容，但没有平台流量的支持，难以放大'
  - '- 只有同时满足三方需求的定位，才能形成可持续的运营动力'
  - '**核心定义**'
  - '- 指赛道选择的黄金定位原则，即所选内容同时满足“自己喜欢”（内驱力）、“用户喜欢”（用户需求）和“平台喜欢”（顺应平台算法）三个条件'
  - '**关键性质**'
  - '- 三重满足：内核是内容定位的“不可能三角”平衡'
  - '- 内驱力驱动：自己喜欢能提供持续的动力'
  - '- 数据验证：用户喜好和平台算法需要通过数据反馈验证'
  - '**典型例子**'
  - '- 一个热爱英语（自己喜欢）的博主，选择做小学英语资料号（用户需求大），且内容形式符合小红书的推荐机制（平台喜欢）'
  - '**边界条件**'
  - '- 三厨狂喜的理想状态难以一步到位，往往需要动态调整，在运营过程中不断寻找三者的交集'
  - '- 过分追求平台喜欢而牺牲自己的热爱，难以长期坚持'
  sources:
  - paper: docs/202301-02/IpCcdJ9NAoAt4pxKKV5c5sfenZc.md
    role: origin
  excerpts:
  - 三厨狂喜：自己喜欢 用户喜欢 平台喜欢
  - 我喜欢：赚钱的过程往往是磕磕绊绊...我想做自己热爱的事情是最好的内驱了
  - 小技巧：干货内容和营销内容结合起来 28开，10篇内容 8篇营销 2篇干货
