learning_targets:
- 理解官方实时数据在短视频对标中的战略价值，区分官方平台与第三方工具的本质差异
- 掌握黑马小达人样本策略的核心逻辑，能够按'低粉高销'标准筛选可模仿的对标对象
- 掌握脚本模板复用方法，理解'已验证爆款'相比盲目原创的成功率优势
- 理解蓝海与红海赛道判断的相对性与动态性，掌握选赛道的综合调研方法
- 掌握三厨狂喜定位原则，能平衡自身热爱、用户需求与平台偏好三者关系
- 掌握用户心动公式与钩子设计原则，理解'给他看一半'的引流转化心理学机制
- 理解虚荣指标与真实转化指标的差异，能基于商业模式识别关键数据指标
- 掌握连爆技术与评论区引爆方法，具备将偶发爆款转化为持续流量产出的能力
- 理解视频号新号流量扶持机制与'加字引导'在搬运视频中的出单关键作用
- 掌握小说推文精细化运营（选文垂直、剧情前置、逐项拆解）的完整SOP
concept_map:
- 短视频对标与资料号引流方法论
- ├── 对标方法论
- │   ├── 官方实时爆款视频库（巨量百应创意中心）  —— P001（CGZ4dZq4ZoSFT4xUmFecNpk4nNe）
- │   │   ├── 实时性优于第三方工具（抖查查/蝉妈妈）
- │   │   └── 按行业/等级/周期分层筛选
- │   ├── 黑马小达人样本策略                    —— P001
- │   │   ├── 低粉高销去除粉丝基础加成
- │   │   └── 对普通小达人更具可迁移性
- │   ├── 脚本模板复用                          —— P001
- │   │   ├── 替换文案+更换产品的二次创作
- │   │   └── 飞书妙记语音转文字提取脚本
- │   └── RPA批量采集（影刀）                    —— P001
- │       ├── 搜索采集与分类采集双机器人
- │       └── 替代人工与第三方工具的自动化
- ├── 赛道选择与定位
- │   ├── 蓝海与红海                            —— P002（IpCcdJ9NAoAt4pxKKV5c5sfenZc）
- │   │   ├── 相对性：大赛道红海中存在细分蓝海
- │   │   ├── 动态性：随入场增多蓝海变红
- │   │   └── 判断标准：供不应求 vs 供大于求
- │   └── 三厨狂喜定位                            —— P002
- │       ├── 自己喜欢（内驱力）
- │       ├── 用户喜欢（用户需求）
- │       └── 平台喜欢（顺应算法）
- ├── 引流转化核心机制
- │   ├── 用户心动公式                            —— P002
- │   │   ├── 自己少费力（最省力法则）
- │   │   ├── 神器/方法/秘籍（帮助）
- │   │   └── 马上实现愿望（及时享受）
- │   ├── 钩子（给他看一半）                      —— P002
- │   │   ├── 冰山一角展示制造悬念
- │   │   ├── 低门槛指令降低行动成本
- │   │   └── 转化率相差可达5倍以上
- │   └── 虚荣指标 vs 真实转化指标                —— P002
- │       ├── 点赞收藏=观赏价值（虚荣）
- │       └── 评论互动/私域导流=商业价值（真实）
- ├── 流量持续与放大技术
- │   ├── 连爆技术                               —— P002
- │   │   ├── 先复制别人的爆款
- │   │   ├── 测试跑出自己的爆款
- │   │   ├── 持续复抄自己的爆款
- │   │   └── 流量衰减后换下一个爆款
- │   └── 引爆评论区（羊群效应）                  —— P002
- │       ├── 引导关注+扣随机数字
- │       ├── 3个小号带头评论（三人成虎）
- │       └── 从众心理带动真实互动
- ├── 基础支撑技术与进阶玩法
- │   ├── 小说推文精细化运营                      —— P006（ZcEdd0xTCo1K5IxwCyLccKUynOb）
- │   │   ├── 选文垂直化（作者垂直+专栏垂直）
- │   │   ├── 核心剧情前置（提高5s完播率）
- │   │   ├── 关键词说白话（简单易输入）
- │   │   ├── 背景素材去重（降低重复率）
- │   │   └── 评论区造互动（小号引导+置顶关键词）
- │   ├── 视频号新号起量（新号流量扶持）          —— P003（Lg2vd5GWHoqhBbxuT5LcThEpncb）
- │   │   ├── 新号7天流量扶持期（发视频易破万）
- │   │   ├── 选品即定人群找需求（垂直需求品优先）
- │   │   ├── 视频搬运去重流水线（放大/翻转/BGM/加字）
- │   │   ├── 加字引导出单（人设化、场景化文案）
- │   │   └── 直播话术扒取与样品展示提升转化
- │   └── 公转私自动化的官方通道优先原则          —— P004（QbBKdHvfiofIUNxDlmjceWbfnqh）
- │       ├── 账号类型权限矩阵（蓝V/半蓝/员工号/黄V/个人号）
- │       ├── 五大转化入口（主页/评论/私信/直播/群）
- │       └── 风险分级（官方>接口>第三方App>小程序）
life_analogy:
- 想象你是一名**渔夫**，正在寻找最佳的捕鱼水域：
- '- **对标方法论** = 使用官方的"鱼群探测雷达"（巨量百应），而非仅靠肉眼观察水面（第三方工具）——实时、精准地锁定鱼群最密集的区域'
- '- **黑马小达人** = 不从满载而归的大渔船（大达人）学习，而是观察那些小船却满载的小渔民（低粉高销）——他们的技巧更容易被复制'
- '- **蓝海与红海** = 选择"鱼多竞争少"的水域（蓝海），而非"鱼少竞争多"的拥挤渔场（红海）；但要留意——今天的好水域明天可能就挤满了船'
- '- **三厨狂喜** = 选择一条"你喜欢钓、鱼喜欢咬钩、渔场规则鼓励"的路线——三者缺一不可，否则难以长久坚持'
- '- **钩子（给他看一半）** = 就像用"鱼饵只露半截"来引诱鱼咬钩，展示资料的冰山一角，用剩余部分激发用户的索取欲望'
- '- **虚荣指标 vs 真实转化** = 撒网时"网眼好看"（点赞收藏）远不如"网里有鱼"（评论求分享、私域导流）重要——渔夫的成就不看网好不好看，看桶里有多少鱼'
- '- **连爆技术** = 找到一处鱼群密集的水域后持续下网，而不是每次换一个陌生的地方从零开始——"火过的内容大概率还会火"'
- '- **引爆评论区** = 就像集市上先安排几个"托儿"聚在摊位前围观，路过的行人看到热闹就会纷纷驻足——三人成虎，羊群效应让冷启动热起来'
- '- **小说推文精细化运营** = 像一位**美食家**挑选食材：选文垂直化是"只选当季、产地直供的食材"（锁定优质作者与专栏），核心剧情前置是"把最诱人的一道菜端到门口"（把精彩部分前置到开头）——每一步都精益求精'
- '- **视频号新号流量扶持** = 像**新店开业**的"全场打折"：平台用流量扶持吸引新商家入驻，7天黄金期内发视频容易破万播放——要抓住这波"店庆红利"拼命上货（发视频）'
- '- **加字引导出单** = 像在**商品包装上贴标语**：同样一件商品，贴上"今日特惠、限量抢购"的醒目标签，销量立刻不同——有时候出单的关键不是商品本身，而是那句抓住人心的"加字"'
summary:
- concept: 对标方法论
  desc: 以官方平台实时爆款视频库为依据，用数据驱动替代盲目原创，降低内容生产的不确定性
- concept: 黑马小达人样本
  desc: 优先学习'低粉高销'账号，其成功更可能归因于内容策略而非粉丝存量，对普通人更具参考价值
- concept: 脚本模板复用
  desc: 将已验证的爆款脚本替换文案与产品进行再创作，成功率高于盲目原创，是内容生产工业化的基础
- concept: 蓝海与红海
  desc: 竞争程度的相对性与动态性判断，本质是供不应求还是供大于求；选对赛道比努力更重要
- concept: 三厨狂喜
  desc: 内容定位的黄金原则：同时满足自己喜欢（内驱力）、用户喜欢（需求）、平台喜欢（算法）三重条件
- concept: 用户心动公式
  desc: 购买欲=自己少费力+神器/方法/秘籍+马上实现愿望；核心是让用户产生'心动'的感觉进而行动
- concept: 钩子（给他看一半）
  desc: 只展示部分资料制造悬念，用剩余部分诱惑用户评论索取，是资料号引流转化的灵魂
- concept: 虚荣指标
  desc: 点赞收藏仅反映观赏价值，评论互动与私域导流才反映商业价值；聚焦关键指标避免认知偏差
- concept: 连爆技术
  desc: 基于'爆款都是重复的'原理，先复制他人爆款，测试出自有爆款后持续复抄，直到流量衰减
- concept: 羊群效应引爆评论区
  desc: 通过小号带头评论激发从众心理，用几个领头评论带动大量真实互动，撬动平台推荐流量
- concept: 小说推文精细化运营
  desc: 从选文垂直化（作者垂直+专栏垂直）、核心剧情前置、关键词说白话到背景素材去重，系统化提升推文爆款率与完播率
- concept: 视频号新号流量扶持
  desc: 平台给予新号初期（约7天）的流量倾斜，发视频容易破万播放，是快速起量的关键窗口期
- concept: 加字引导出单
  desc: 在搬运视频上针对产品特色附加醒目标语性文字，用人设化、场景化文案抓住目标用户心理，被认为是出单关键而非视频本身
exercises:
- 'no': 1
  title: 对标对象筛选实战：为你的赛道挑选黑马小达人
  contents:
  - 假设你运营一个小红书英语学习资料号，现有一批候选对标账号数据如下：
  - '| 账号 | 粉丝数 | 单条带货GMV | 视频总数 | 内容垂直度 |'
  - '|------|--------|------------|---------|-----------|'
  - '| A | 12.5W | 8W | 300 | 英语干货+带货混发 |'
  - '| B | 800 | 3.2W | 45 | 专注小学英语语法 |'
  - '| C | 3.2W | 2.1W | 500 | 英语+职场技能混发 |'
  - '| D | 1500 | 1.8W | 120 | 初中英语阅读理解 |'
  - 1. 基于'黑马小达人样本策略'，选出最适合你学习的对标账号并说明理由
  - 2. 结合'选文垂直化'和'对标账号筛选标准'，补充你认为还需要考察的其他维度
  - 3. 为所选账号设计一个脚本拆解清单（应包含哪些分析维度）
- 'no': 2
  title: 钩子与评论区引爆的转化率对比实验
  contents:
  - 现有两篇内容完全相同的资料号笔记，数据如下：
  - '- 笔记A：点赞1980，评论35'
  - '- 笔记B：点赞500，评论230'
  - 1. 分析两篇笔记转化率差异可能的原因（结合'钩子'概念）
  - 2. 假设你重新发布笔记B的变体，请设计：
  - '   - 钩子展示方案（展示哪些内容、如何布局）'
  - '   - 评论区引爆的具体操作步骤（包括小号话术设计和节奏安排）'
  - 3. 设计一个A/B测试方案，验证不同钩子设计对评论转化率的影响
  - 4. 思考：如果笔记B的评论区互动持续火爆但私域导流依然很低，可能是什么环节出了问题？
- 'no': 3
  title: 蓝海赛道发现实操：用四步法完成赛道评估
  contents:
  - 以'小学教育'为大方向，使用以下四步法完成一次蓝海赛道调研：
  - 1. 搜索下拉词调研：在小红书搜索'小学语文''小学英语'，记录下拉推荐词的差异
  - 2. 头部竞争分析：搜索各细分关键词，找出各赛道头部账号及其粉丝量级，判断是否存在垄断
  - 3. 供需对比：分别搜索几个细分关键词，对比24小时内'最新'与'最热'笔记的数量差异
  - 4. 交叉验证：结合上述数据，回答以下问题：
  - '   - 哪些细分赛道属于''大赛道红海、细分蓝海''？'
  - '   - 你用''三厨狂喜''标准评估，哪个赛道最适合自己切入？'
  - '   - 这个蓝海的窗口期可能有多长？如何快速切入抢占先机？'
- 'no': 4
  title: 心动文案改造：从'自嗨表达'到'心动公式'
  contents:
  - 给你三句'自嗨式'的表达，请用'用户心动公式'改造成高转化文案：
  - 1. 原文案：'这份语法笔记非常全面，涵盖了所有重要知识点'
  - 2. 原文案：'我整理的阅读理解技巧能帮大家提高正确率'
  - 3. 原文案：'这是一份精心制作的英语学习资料合集'
  - 要求：
  - '- 每一句改造后的文案必须包含公式三要素（自己少费力+帮助+及时享受）'
  - '- 补充可使用''二极管标题法''（正面刺激或负面刺激）制作的两个备选标题'
  - '- 为其中一份资料设计一个''给他看一半''的钩子方案（包括封面截图内容、评论区引导语）'
  - '- 反思：在你改造后的文案中，哪些部分容易滑向虚假宣传？如何守住信任底线？'
- 'no': 5
  title: 小说推文选文垂直化实操：从'大海捞针'到'精准垂钓'
  contents:
  - 假设你准备在抖音开设一个小说推文账号，定位为'都市情感类'。
  - 1. 请列出你在知乎上筛选'优质作者'时关注的具体维度（至少3个），并说明理由
  - 2. 当你选定一位作者的某篇爆文后，如何利用'专栏垂直'原则扩充同类型文章？请写出具体操作步骤
  - 3. 针对一篇'中开高走'（开头平淡、后期精彩）的文章，请设计一个'核心剧情前置'的改编方案：
  - '   - 你会提炼哪些关键词？（请给出3个候选关键词）'
  - '   - 你会如何改写开头两句话以提升5s完播率？'
  - 4. 为你的账号拟定一个3天的'日更养号'计划（包括发布时间、话题标签、评论区互动安排）
- 'no': 6
  title: 视频号新号流量扶持期的破万实操计划
  contents:
  - 假设你有一个全新的视频号，准备利用7天的流量扶持期快速起量。
  - 1. 请制定一份7天的内容发布计划表（包括发布频率、内容类型、每日互动安排）
  - 2. 选品：请用'选品即定人群找需求'原则，为中老年下沉用户人群筛选3个垂直需求品（非通用品），并说明选择理由
  - 3. 对其中1个选品，请设计'加字引导出单'的文案（人设化、场景化，1-2句话即可）
  - 4. 直播配合策略：说明大爆款第5天流量衰减后，你如何安排直播时长与外部合作来延长变现窗口？
units:
- 'no': 1
  name: 对标方法论 —— 让平台的实时数据成为你的“作战地图”
  points:
  - '**为什么需要这个概念？**'
  - '- 盲目原创的成功率低，且无法保证内容的商业有效性'
  - '- 第三方数据工具（如抖查查、蝉妈妈）不够准确和实时，容易错判市场'
  - '- 行业优秀的爆款视频是最直观的“标准答案”，可以用来指导方向'
  - '**核心定义**'
  - '- 指以短视频行业官方平台（如巨量百应创意中心）实时更新的爆款视频库与创意搜索作为对标依据，筛选出高GMV、低粉丝量的“黑马”视频进行学习与模仿，而非依赖第三方工具或大达人样本'
  - '**关键性质**'
  - '- 实时性：数据来自官方平台，比第三方工具更准确、更新更快'
  - '- 可复制性：爆款脚本模板复用比盲目原创成功率更高'
  - '- 分层参考：不同等级作者（大达人 vs 小达人）有不同的数据参考价值'
  - '**典型例子**'
  - '- 通过巨量百应创意中心的“爆款视频”和“创意搜索”模块，找到近期带货效果最好的短视频，批量下载作为学习素材'
  - '- 在采集数据后，优先筛选“粉丝量少但销量高”的视频作为学习对象'
  - '**边界条件**'
  - '- 对标方法论适用于内容同质化严重、竞争激烈的短视频带货领域，其核心价值在于降低“瞎原创”带来的不确定性；但对于创新驱动的品牌，仍需结合自身的差异化优势'
  - '- 依赖官方平台数据的可靠性，若平台数据有偏差则方法论失效'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  excerpts:
  - 对标对标,这里上榜的,出成绩的,最新的,不就是最好的对标吗?
  - 好的脚本大概率是不会过时的,一个脚本模板,改改文案换个产品推,成功率大概也比瞎原创要好一点吧。
  - 这里是比抖查查蝉妈妈这些第三方要更准确的行业优秀爆款视频库。
- 'no': 2
