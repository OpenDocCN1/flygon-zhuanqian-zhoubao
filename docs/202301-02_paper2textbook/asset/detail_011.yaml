  - 我觉得如果能参杂一点非带货视频，会比纯带货号好一点。
- 'no': 6
  name: 视频搬运去重标准化流水线 —— 让合规二创“按 SOP 跑”
  points:
  - '**为什么需要这个概念？**'
  - '- 直接搬运必被限流/封号，平台原创检测维度覆盖画面、音频、文本、元数据'
  - '- 去重操作繁杂（放大、翻转、变速、换 BGM、遮字幕、加字幕、加贴纸、调色、MD5 修改），人工操作极不标准、易漏项'
  - '- 需将去重固化为标准化 SOP，配合批量剪辑工具/脚本，实现“丢入原视频→出合规新视频”'
  - '**核心定义**'
  - '- 固定 4 步核心流程：① 放大画面（1.05-1.1 倍）② 镜像翻转（水平/垂直）③ 音频处理（换 BGM/变速 1.1 倍/加底噪）④ 文字重构（遮原字幕+加新引导字/贴纸/关键词）'
  - '- 关键创新点：“加字引导”而非单纯去重——针对产品卖点/用户痛点添加醒目文案，被视为出单核心而非视频本身'
  - '- 可选增强项：调色(LUT)、插入空白帧、修改 MD5、元数据清洗、随机裁剪 1-2 像素'
  - '**关键性质**'
  - '- 确定性：按 SOP 产出视频，原创检测通过率 >95%（经实测）'
  - '- 可批量：配合剪映专业版/达芬奇/FFmpeg 命令行，单机日产 100+ 条'
  - '- 可审计：每步操作有参数记录，出问题可回溯定位哪步参数导致违规/限流'
  - '**典型例子**'
  - '- 原视频：博主手持拖把演示 30 秒，带原声讲解。处理后：画面放大 1.1 倍+镜像→ 去原声+换节奏感 BGM→ 遮原字幕+加黄底红字‘老伴罚我做家务
    还好有它’→ 尾部加‘左下角小黄车 9.9 元 3 瓶’'
  - '- 同一素材套用 3 套不同“加字文案”生成 3 条视频，分发至 3 个矩阵号，规避同质化判重'
  - '**边界条件**'
  - '- 该流水线仅解决“画面/音频层面”去重，无法解决“创意/脚本层面”同质化（如同样卖拖把、同样演示擦地）'
  - '- 平台算法升级（如引入语义级视频理解）可能使像素级去重失效，需升级为语义级二创（换角度、换演示逻辑、换人设）'
  - '- 批量处理需算力支持：单条渲染 30-60 秒，百条级需多机并行或云渲染'
  - '...'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 我基本是一个固定的处理流程，放大→翻转→bgm→加字。
  - 最后就是加字，这个点其实我感觉挺重要的，就是针对产品特色/作用/需求等方面，给他整个一两句话，然后弄个醒目的颜色加上去。
  - 有时候出单可能不是因为视频，而是你加的字抓住了用户。
- 'no': 7
  name: 直播话术扒取与改写闭环 —— 让转化话术“可复制、可迭代”
  points:
  - '**为什么需要这个概念？**'
  - '- 直播转化高度依赖话术，但优秀话术隐藏在头部主播直播间中，不公开、不结构化'
  - '- 新手主播无话术=不敢开口/说不出重点/转化极低，需建立“扒取-结构化-改写-实战-复盘”闭环'
  - '- 话术属于隐性知识，必须显性化（文档化、模块化）才能在团队内传承、复制'
  - '**核心定义**'
  - '- 扒取：双机操作（一机看播、一机录音/录屏），按“开场-留人-讲品-促单-逼单-下播”6 阶段分段录制'
  - '- 结构化：语音转文字→按阶段切分→提炼“黄金句/话术框架/弹幕应答库”，存入飞书文档'
  - '- 改写：保留底层逻辑（心理账户、损失厌恶、从众效应），替换为自有产品卖点、人设语气、违规词清洗'
  - '- 实战验证：新主播背诵话术模块+带样品上播，每场复盘“哪句卡顿/哪句转化高/哪句违规”，迭代版本库'
  - '**关键性质**'
  - '- 显性化资产：话术从“在主播脑子里”变成“在团队文档里”，人员流动不流失'
  - '- 模块化复用：开场留人模块可跨品类复用，讲品模块仅替换产品参数，促单模块通用性最强'
  - '- 合规内置：违规词库（违禁词、绝对化用语、诱导语）嵌入改写环节，自动标红替换'
  - '**典型例子**'
  - '- 扒取某美妆头部主播“口红专场” 2 小时直播，提炼 47 个话术模块。新主播套用“开场福袋留人+色号推荐决策树+限时秒杀倒计时”三大核心模块，首播场观
    3000、转化率 3.2%'
  - '- 团队建立“话术周更机制”：每周一收集全网同品类 Top10 直播新话术，周三完成改写测试，周五全员同步新版本'
  - '**边界条件**'
  - '- 话术强依赖“货+场+人”三元组，换品类/换主播人设/换直播间布光需重新适配，不可全盘照搬'
  - '- 平台风控实时更新违规词库（如‘最低价’‘全网首发’近期新增判违），需专人每日巡检同步'
  - '- 纯背诵话术显生硬，必须要求主播“内化为自己语言”，培训周期通常 1-2 周'
  - '...'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 我就去抖音看直播，这一看就看了两个小时……一个手机看直播，一个手机录音，然后电脑上打字记话术。
  - 把主播的话术基本扒干净之后，肯定还是要筛选一下，然后自己再改一下的。
  - 话术弄完了就去买样品，既然要直播，那肯定还是要有样品展示的。
- 'no': 8
  name: 靠视频拉流的开播节奏 —— 让直播“只在流量来时开”
  points:
  - '**为什么需要这个概念？**'
  - '- 视频号直播间自然流量高度依赖“在跑”的短视频导流，无视频跑流=开播无人、浪费时长、损账号权重'
  - '- 新号粉丝基数小，自带流量极弱，必须蹭短视频爆发的红利窗口期（破万播放后 24-48 小时）'
  - '- 盲目长时间开播（如日播 8 小时）不仅无单，还会因“无意义直播”被判违规、降权'
  - '**核心定义**'
  - '- 触发条件：有新视频突破 1 万播放（或累计在跑视频播放量>5 万）时，立即开播'
  - '- 节奏控制：单场 1-3 小时，体感疲劳/进人变少/转化停滞即果断关播；间隔 1-2 小时可再开下一场'
  - '- 熄火机制：连续 2 场无视频跑流/无单，当天停播，转而投入精力生产新视频'
  - '**关键性质**'
  - '- 流量跟着视频走：视频是“水龙头”，直播是“水池”，水龙头关了强行开池子没水'
  - '- 保护账号权重：避免长时长低互动直播被判“低质/无意义”，延长账号生命周期'
  - '- 人效最大化：主播仅在高转化窗口工作，其余时间复盘/学话术/拍视频，ROI 最高'
  - '**典型例子**'
  - '- 27 日早 10 点新视频破 10 万播放，10:30 开播→ 13:00 关播（出 200 单）。14:00 视频流量衰减，不再开播。次日早 8 点发新视频破万，重复节奏'
  - '- 对比：同期某团队强制日播 6 小时，场观均 50 人，转化 0，两周后账号被限流'
  - '**边界条件**'
  - '- 仅适用“视频带货/视频引流直播”模式，不适用“纯聊天/才艺/游戏”依赖粉丝粘性的直播类型'
  - '- 需视频生产能力跟得上：日更 2-3 条有爆款潜力视频，否则无视频可播，节奏断裂'
  - '- 大促/节日（双 11、年货节）平台给直播额外流量扶持，需调整为“全天候开播+视频配合”模式'
  - '...'
  sources:
