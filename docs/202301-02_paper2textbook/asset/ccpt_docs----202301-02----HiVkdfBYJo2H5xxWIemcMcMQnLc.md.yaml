paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
desc: 该素材是内容经纪赛道开创者刘梦园（巢野文化创始人、星云IP计划发起人）分享的一套将个人IP从零打造为年入千万且保持‘风骨体面’的系统方法论。素材提出一套五步操作框架（夯实地基、内容体系规划、千万营收模型、一年规划、落地），并重点展开前三步：地基部分提出‘1个母题、2层基因、3重身份、4级观感、5份资产’的外部打造框架；内容体系规划提出四级内容架构、一套独创理论（含理想解法/节点法/词根法/母题法/核心法五种创作路径）、百问百答、十年故事和点线面打通路径；营收模型则梳理了从年度会员、私教、私董会、合伙/徒弟、图书（一书一码/联合出品人）、课程直播到咨询、顾问等几乎所有内容型IP变现渠道及对应客单价。素材兼具理论框架、实操步骤、单价参考与多个真实案例（龙飞律师、李佳琦、南翔不爱吃饭、李子柒、李小龙等）。
concepts:
- name: 母题
  desc: 源自文化原型概念，指文化传统中具有传承性的文化因子或人类社会中循环往复且普遍发生的事情，是IP搭建护城河并调整边界的核心锚点。
  is_original: false
  excerpt:
  - 指的是，文化传统中具有传承性的文化因子，或者人类社会中那些循环往复且普遍发生的事情。最简单的理解就是原型。
  - 对于IP来说，掌握母题就是可以既搭建出来自己的护城河又能随时调整边界的，这里可以直接挂钩很多人讲的定位卡位，但这个定位有一个弊端就是，它不是从内容的角度出发的，也就没法做好更细化的延展更不可能把护城河做出来。
- name: 2层基因（文化沉淀价值与商业持续能力）
  desc: 指IP应兼具文化沉淀价值（风骨）与商业持续能力（变现），并强调不要做没有文化溢价的事情，以及避免全盘复刻他人路径（借鉴模型而非借用）。
  is_original: true
  excerpt:
  - 指文化沉淀价值（风骨）和商业持续能力（变现），这里重点需要说的有三点：一是不要做没有文化溢价的事情……二是IP是少数人的领地……三是不要相信天道酬勤那种鬼话。
- name: 3重身份（工具/人/神）
  desc: 指IP要根据用户在不同阶段的需求（解决功能问题、提供价值主张或情绪、支持迭代升级）把自己当作工具、人或神，分别对应解决用户问题、打破防御机制、承接危机再分配话语权。
  is_original: true
  excerpt:
  - 指IP需要根据不同的状态下把自己当工具或者当人或者当神。
  - 工具是从解决用户问题的功能性上说的……人是从解决用户价值主张或情绪性的角度去说的……神是从解决用户迭代升级的角度去说的，危机具有强烈的再分配的效应。
- name: 4级观感
  desc: 指IP对外输出和呈现上要具备至少两个观感（松弛感、对象感、获得感、氛围感）以促成由感性支配而非理性催生的消费行为。
  is_original: true
  excerpt:
  - 指的是IP的对外输出和呈现上要具备至少两个观感才可以让用户有被感性支配而非理性催生的消费行为。
  - 松弛感是说IP有一种尽在掌握的状态……对象感是指这些话我只对你一个人说……获得感指的是没能让你说卧槽就是我输……氛围感是指沉浸其中无法自拔。
- name: 5份资产
  desc: 指与个人IP息息相关的五种资产形态：用户资产、版权资产、实物资产、文化资产、生态资产。
  is_original: true
  excerpt:
  - 指的用户资产、版权资产、实物资产、文化资产、生态资产这五种和个人IP息息相关的资产形态。
  - 用户资产指的是你的用户是谁决定了你是谁……版权资产首先要明确一个IP可以有17种版权，其中13种是可交易的……实物资产是指IP衍生品……文化资产是指IP能够将自己置于某一主文化或者亚文化之下……生态资产本质上指的是某个组织里所有成员或者单位协同有效发展带来的经济效益。
- name: 内容体系（五件套）
  desc: 指一个IP的内容体系包含的5个部分：四级内容架构、一套独有理论、一个十年故事、一份百问百答和一份产品项目产业链打通路径。
  is_original: true
  excerpt:
  - 一个IP的内容体系包含5个部分，四级内容架构、一套独有理论、一个十年故事、一份百问百答和一份产品项目产业链打通路径。
- name: 品项态（点线面）
  desc: 将电商的人货场概念转接到内容型IP上，对应产品-项目-生态（产业链）的点线面打通路径。
  is_original: true
  excerpt:
  - 到了内容型IP上其实就是品项态（产品项目生态）
  - 设计点线面打通的重要性就体现出来了，在电商方向上，大家都知道人货场这个概念，到了内容型IP上其实就是品项态（产品项目生态）。
- name: 4近原则
  desc: 描述IP变现产品设计/定价时需要遵循的底层逻辑：离钱近、离痛点近、离易用近、离信任近。
  is_original: true
  excerpt:
  - 注意一个底层逻辑就是4近，离钱近好变现，离痛点近好卖出，离易用近好留存，离信任近好复购。
- name: 一书一码/联合出品人计划
  desc: 指在图书方向赚到传统版税之外更多增量收益的一种玩法，依托一书一码技术招募联合出品人出资支持。
  is_original: true
  excerpt:
  - 可以，走一书一码和联合出品人计划，在一书一码技术的支持下招募1000个人作为联合出品人。
methods:
- name: __overview__
  desc: 覆盖从零到年入千万的IP打造五步法，核心论证了‘风骨与变现并存’的可行性：第一步夯实地基（内部任务30个+外部框架12345），第二步做内容体系规划（风骨体面），第三步做好千万营收模型，第四步做一年节点规划，第五步落地。每一步都给出具体任务、工具（框架）和案例。
  excerpt:
  - 5大步骤分别是：夯实地基、做好内容体系规划（风骨体面）、做好千万营收模型（千万变现）、做好一年的节点规划、落地。
  - 方便把整个分享的逻辑更清晰的呈现……你就可以按照这5大步骤来一点点的把自己的IP运作起来，既能平衡长短期利益又能实现风骨与变现的并存。
- name: 地基夯实（内部+外部）
  desc: 从内部（奠基期30个任务，完善准备）与外部（1个母题、2层基因、3重身份、4级观感、5份资产）两个角度为IP打好基础，其中衔接市场能力训练需前置。
  excerpt:
  - 如果没有自己的专属内容经纪人，那么第一步就需要夯实IP的地基，我会从两个视角来分析这个板块，分别是内部夯实以与市场接轨，外部夯实以便在市场上占据一席之地。
  - 12345具备了才能上山打老虎，不然只能打个小松鼠，12345也就是1个母题、2层基因、3重身份、4级观感、5份资产。
- name: 构建体系理论五大方法（理想解法/节点法/词根法/母题法/核心法）
  desc: 一套为IP生成自有独创理论的系统化方法：基于TRIZ理想解的六步推导、从实际服务流程中抽取共性节点的节点法、针对垂类优势提炼词根的词根法、延展/结合母题的母题法，以及提取自身内容体系核心点的核心法。
  excerpt:
  - 系统的方法也是有的，大概分成5种。第一种理想解法。……ARIZ算法中给出了确定理想解的步骤：1）设计的最终目标是什么？……第六种是核心法。……直接命名内容经纪理论了。
- name: 十年故事创作法
  desc: 将个人十年经历制作成一个5-8分钟中视频的具体规范，包含素材（前后对比、关键时刻）、故事主支线、文案（表达清晰、目的明确、契机合理）与音乐（体现品位）。
  excerpt:
  - 素材方面，需要前后对比表现成长，重点是新手村到大佬村的对比；关键时刻重点标注 低谷、荣耀、转折；
  - 故事方面，一般一个十年故事要5-8分钟……文案方面，表达清晰……目的明确，增加信任。
- name: 点线面打通路径
  desc: 以产品-项目-产业链（品项态）为主线，从可交付的最小产品（文章/课程/账号等）出发，逐步串成培训项目，再在理论端、执行端、变现端、IP端、政府支持、人才端齐备后构成产业群组的结构化成长路径。
  excerpt:
  - 产品可以是一篇文章一份课程一个账号一个3折页甚至一个二维码等……那怎么做项目呢？是不是可以再做一个内容经纪人培训项目养一大批和我差不多的人呢？……组成一个S级为基因的产业群组是不是也可以呢？
- name: 千万营收模型
  desc: 将内容型IP所有可变现方式统一罗列，并给出每种变现方式的定价区间与增长模型：年度会员（标品趋近0交付）、私教3w/3个月、私董会5-20w门票、合伙/徒弟20w-100w、图书（一书一码/联合出品）、课程直播（199小课/双播/月400w）、自媒体（爆款路线+五方向配比，服务直播与私域）、咨询1K+/h、培训1天3w/1小时1w、轻顾问3w起，重顾问20w/年起。
  excerpt:
  - 图里主要涉及到内容型IP可以变现的几乎所有方式……年度会员的年入百万像素级拆解……私教常规是3w3个月的一对一……私董会……花个5-20w买个圈子的门票……
theorems:
- name: IP是少数人的领地，不要走别人的路径
  desc: IP天然具备差异化与资源禀赋，直接复刻别人的爬坡路径/模型会遗漏关键情境信息，生发路径依赖；应借鉴模型而非借用模型，得拆解多模型后取长补短、有机结合。
  excerpt:
  - 二是IP是少数人的领地，每个IP的花期和成长环境不同，不要走别人的路径，既容易形成路径依赖又容易忽略“地图”上不好展示的关键节点；
  - 最有效的办法是找十个模型，看自己适合哪个模型的哪一部分，再看这些部分能不能有机结合，运作起来是不是顺滑，借鉴但非借用~
- name: 学——不要被天道酬勤的幸存者偏差误导（不下牌桌的能力）
  desc: 做IP单靠长期努力/日更基本归零，因为缺乏流量机制与变现反馈，容易耗尽人性；所有坚持须建立在清晰前景+有效正反馈（两周可验证变现）的基础上，否则要及时转换或引入团队。
  excerpt:
  - 三是不要相信天道酬勤那种鬼话，极大概率是幸存者偏差，这里用不下牌桌的能力来表达会更恰当。
  - 所有的努力与坚持必须是在有非常明晰的前景下才有效，也不要高估了人性，很少有人能在没有持续变现的正反馈下坚持太久。
- name: 危机再分配效应（神身份的支撑逻辑）
  desc: 当用户意识到自身瓶颈并感到危机时，能够解决该危机的IP便获得再分配话语权，从而将用户从平等关系变为被指挥被组织状态，借此搭建护城河。
  excerpt:
  - 神是从解决用户迭代升级的角度去说的。危机具有强烈的再分配的效应。当用户意识到自身的瓶颈之后便具有了一定的危机感，这时候谁解决这个危机感谁就具有一定的再分配话语权……
- name: 用户资产的…幂次效应
  desc: 以流量堆起的IP其用户资产边界较窄，而以品牌势能积累的IP用户资产幂次效应更强，更有可能实现IP的多次“觉醒”。
  excerpt:
  - 如果你的IP是靠品牌涨起来的，那品牌本身所具有的势能就是你的用户资产。显而易见，品牌性质的边界会更广，幂次效应更强，IP的多次“觉醒”就有了可能。
- name: 定位不能代替内容（母题/护城河视角）
  desc: 传统的定位、卡位非从内容出发，无法完成细化的延展，也就做不起护城河；应落到可延展的母题（百变题型）之上。
  excerpt:
  - 定了一个母题之后，母题下有百变题型的对不对？那百变题型最好是都可以解，百变题型具体都有哪些？题型能不能模块化，解法能不能标准化？
  - 但这个定位有一个弊端就是，它不是从内容的角度出发的，也就没法做好更细化的延展更不可能把护城河做出来。
findings:
- name: 非遗/文化沉淀（文化溢价）与高客单并行
  desc: '[evidence] 支撑‘IP要有文化溢价（风骨）’的多个案例：女性安全议题应从防卫升级为家暴、户外安全、pua、诈骗案例分析；穿搭IP需要沉淀版权素材，一场线上发布会可带来千万-上亿流水；李子柒IP本质走文化资产路线。'
  excerpt:
  - 比如女性安全这个方向……那真正需要分享的真正有文化溢价的是通过一些家暴、户外安全、pua、诈骗等等相关的案例分析……
  - 一场发布会包括带货、内容输出、广告、版权授权等等至少能有千万上亿的流水。
  - 文化资产是指IP能够将自己置于某一主文化或者亚文化之下……李子柒的IP本质上也是走文化资产路线的。
- name: 松弛感-直接高转化关系的验证
  desc: '[evidence] 以龙飞律师连麦风格为例，用松弛感（尽在掌握）的数据结果验证：她的“你问题我都见过了”的信号能直接带来粉丝粘性，账号短时间内破千万。'
  excerpt:
  - 龙飞律师在婚姻方向的连麦上就是有一种松弛感的……你看那些连过麦的都解决了，你还不快来说出你的糟心事儿我给你出出好主意嘛，这也是她的账号短短时间内就破千万的原因。
- name: 直播1+1+1模式（低成本量产）
  desc: '[evidence] 以199元小课的直播变现数据为例，一天两播、一场6w的例子支撑了1+1+1（低成本直播课->剪成小课->短视频切条）的商业模式，月营收可达400w。'
  excerpt:
  - 课程和直播一起搭配会更有效果，说个现实数据，199小课，一天两播，一场6w，一个月400w~有点意思是吧……
- name: 图书版税收入与联合出品人增量
  desc: '[claim] 作者主张传统图书版税商业模式回报低（5w册才有二三十万版税，但实际上1w册即为畅销书），因此在图书方向需用一书一码/联合出品人计划来打开增量收益。'
  excerpt:
  - 图书在常规出版的情况下卖5w册才有二三十万的版税收入，但是能卖1w册已经属于畅销书了……那这四五万能不能拿到就是个概率问题……可以，走一书一码和联合出品人计划，在一书一码技术的支持下招募1000个人作为联合出品人。
- name: 四年沉淀带来的IP路径差异（博商案例）
  desc: '[claim] 作者主张互联网上盛行沉痛的直播玩法（199小课+赛马机制），但博商这类玩家后端已积累十几年，199小课只是后端大客单的钩子，盲学只会扑空，进一步印证要对模型做拆借而非借用的论点。'
  excerpt:
  - 比如现在很多家都在学博商的玩法，但忽略了其实博商的后端已经积累了十几年，199的小课只是后端几万上百万费用的钩子；赛马机制可以学，但后端没有常年的积淀是学不来的。
- name: 私域年度顾问的服务逻辑案例（水理论）
  desc: '[evidence] 通过作者为某私域顾问设计‘水利私域理论’的过程，展示节点法如何从服务/交付逻辑提取理论：第一步重构组织结构、重塑商业模型，后续以水为喻（水系、水利工程、水循环）串联。'
  excerpt:
  - 因为他的私域年度顾问费用较高（50-100w/年），服务逻辑下……他就说了一下第一步是重构组织结构重塑商业模型，2345步分别是什么……
  - （特别说明，目前这个水利私域理论属于我的那个朋友，在此仅作为举例使用，不建议朋友们挪用~）
- name: 星球计划IP聚合生态（S级基因）
  desc: '[claim] 作者宣称自己发起的星云IP计划（20个S级IP、年2亿的盘子、北京市版权局战略试点项目）可以支撑起一个以S级为基因的产业群组，达成供应链整合、多维资源沉淀、缩小信息差的终极护城河效果。'
  excerpt:
  - 我有一大批经过层层筛选的内容经纪人、还有一大批经过层层筛选的S级IP（80个报名星云计划的但没入选的那些至少也是A级以上的）……从理论端、执行端、变现端、IP端、政府支持、人才端都OK了之后我做什么不行呢？
