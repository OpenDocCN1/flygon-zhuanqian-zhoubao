learning_targets:
- 理解最小可行产品（MVP）闭环的核心定义与验证目标
- 掌握选品决定论的核心逻辑与三要素
- 理解信息差在商业模式中的关键作用与价值创造机制
- 学会用投产比（ROI）量化评估不同渠道的营销效率
- 掌握平台演化周期的四阶段模型，能预判新平台红利期
- 理解1+1+1项目矩阵模式的构成与协同逻辑
- 掌握私域高客单策略的适用前提与核心价值
- 学会用逆向开发方法论从痛点反推产品与卖点
concept_map:
- 最小MVP闭环
- ├── 核心目标
- │   └── 验证“有人愿意付钱”和“交付可行” —— P001
- ├── 关键性质
- │   ├── 低成本性：投入小，失败损失可控 —— P001
- │   ├── 快验证性：最短时间判断模式是否成立 —— P003
- │   └── 可复制性：跑通后可无限放大 —— P001
- └── 典型应用
- '    └── 线上美业：甲油胶代购一单挣2元起跑通闭环 —— P001'
- 选品决定论
- ├── 核心主张
- │   └── 产品好省一半心，自带转化力 —— P001
- ├── 选品三要素
- │   ├── 深挖用户需求，涵盖面齐全 —— P001
- │   ├── 口服保养是趋势，客户粘性强 —— P001
- │   └── 与医院合作，强化品牌背书 —— P001
- └── 边界条件
- '    └── 需验证利润空间：无利润空间不如不做 —— P001'
- 信息差赚钱论
- ├── 底层逻辑
- │   └── 生意的本质是信息差 —— P002
- ├── 核心概念
- │   └── 中介费伪概念：信息差造成的智商税 —— P002
- └── 关键性质
- '    ├── 广泛存在：互联网与线下均有 —— P002'
- '    ├── 可被消除：技术进步可颠覆旧模式 —— P002'
- '    └── 价值创造：撮合匹配解决需求产生良性循环 —— P002'
- 渠道投产比（ROI）
- ├── 定义
- │   └── 收益与投入成本的比值，衡量渠道效率 —— P002
- ├── 关键性质
- │   ├── 可比较性：同一标准横向对比 —— P002
- │   ├── 本地相关性：本地项目必投本地 —— P002
- │   └── 差异巨大：最优与最差可能差数十倍 —— P002
- └── 典型实测
- '    └── 抖音推广 > 本地自媒体 > 汽车广播 —— P002'
- 平台演化周期
- ├── 四阶段模型
- │   └── 铺货 → 动销 → 精细化 → 玩趋势 —— P003
- ├── 关键窗口
- │   └── 高流量低商业化阶段是普通人最佳切入 —— P003
- ├── 核心性质
- │   ├── 周期普遍性：所有平台底层逻辑相通 —— P003
- │   ├── 窗口有限性：红利被快速消耗 —— P003
- │   └── 风险递进性：后期需更合规精细 —— P003
- └── 典型应用
- '    └── TikTok睡播：判断平台早期主攻娱乐直播 —— P003'
- 1+1+1项目矩阵
- ├── 构成
- │   ├── 1个在盈利：提供现金流 —— P003
- │   ├── 1个在开发：提前储备接班 —— P003
- │   └── 1个做知识付费：经验溢价变现 —— P003
- └── 关键性质
- '    ├── 现金流稳定 —— P003'
- '    ├── 储备项目延续性 —— P003'
- '    └── 经验溢价 —— P003'
- 私域高客单
- ├── 核心主张
- │   └── 私域用户因专业而来，应服务高客单技术型需求 —— P001
- ├── 金饭碗比喻
- │   └── 端着金饭碗讨饭是对专业价值的浪费 —— P001
- └── 关键性质
- '    ├── 高信任度：用户因专业而来 —— P001'
- '    ├── 高利润空间：技术型服务可收更高价格 —— P001'
- '    └── 可持续性：专业信任带来更长客户生命周期 —— P001'
- 逆向开发方法论
- ├── 核心链条
- │   └── 发现痛点 → 定义产品形态 → 快速验证 → 复制放大 —— P002, P001
- ├── 关键性质
- │   ├── 需求导向性：从用户真实反馈出发 —— P002
- │   ├── 高效执行性：无需开发完再找市场 —— P002
- │   └── 信息差驱动性：常与信息差套利结合 —— P002
- └── 典型应用
- '    └── 胖龟找房：先发现中介费痛点，再反向搭建平台 —— P002'
life_analogy:
- 想象商业验证是一场**渡河**：
- '- **最小MVP闭环** = 先造一艘独木舟快速试水过河，验证船不沉再回来造航母，而不是一开始就投入巨资造船'
- '- **产品好省一半心** = 种子决定收成，好的种子（产品）自己会发芽，差的种子需要加倍浇水施肥（推销）'
- '- **信息差** = 你知道一条别人不知道的近路，就能靠带路赚钱，而一旦地图公开，近路就失去了价值'
- '- **渠道投产比** = 你是一个渔夫，撒网前先用探鱼器（数据）测量哪个区域鱼最多，而不是凭感觉在风浪大的地方浪费时间'
- '- **平台演化周期** = 早春播种（平台早期高流量低商业化）的农民最轻松收获，等到夏天（竞争激烈期）别人都来种地时，土地已被分完'
- '- **1+1+1项目矩阵** = 三灶同炊：一个灶正煮着饭（盈利），一个灶正备着菜（开发），一个灶正卖着菜谱（知识付费），保证任何时候都有饭吃'
- '- **私域高客单** = 你手里捧着金饭碗（专业信任），却用来讨剩饭（做低价值团购），不如用它盛满汉全席（高客单服务）'
- '- **逆向开发** = 先看到病人哪里疼（痛点），再决定开什么药（产品），而不是先研究各种药材（技术）再找谁需要'
summary:
- concept: 最小MVP闭环
  desc: 以最小成本、最快速度跑通“产品-流量-销售-交付”完整循环，目标是确认“有人愿意付钱”而非追求利润最大化
- concept: 选品决定论
  desc: 好产品自带转化力，深挖用户需求、优选高粘性品类、强化品牌背书，选品重于销售
- concept: 信息差赚钱论
  desc: 生意的本质是信息差，中介费是信息差造成的伪概念，平台撮合匹配产生良性循环
- concept: 渠道投产比（ROI）
  desc: 用收益与投入比值衡量渠道效率，需实测而非凭感觉，做本地项目必投本地渠道
- concept: 平台演化周期
  desc: 平台经历铺货-动销-精细化-玩趋势四阶段，高流量低商业化早期阶段是普通人最佳切入窗口
- concept: 1+1+1项目矩阵
  desc: 同时运营一个盈利项目、一个开发项目、一个知识付费项目，实现现金流、储备、溢价的良性循环
- concept: 私域高客单
  desc: 私域用户因专业而来，应服务高客单技术型需求而非低价值团购，端着金饭碗别讨饭
- concept: 逆向开发方法论
  desc: 从用户真实痛点反推产品形态与卖点，需求导向、高效执行、信息差驱动，而非自我喜好出发
exercises:
- 'no': 1
  title: 设计一个最小MVP验证方案
  contents:
  - 假设你想做一款“AI智能食谱推荐”小程序，目标用户是忙碌的职场白领。请回答：
  - 1. 用最小MVP闭环框架设计一个完整的验证方案（产品-流量-销售-交付），要求明确每个环节的“最小动作”和“最短周期”
  - 2. 你的MVP阶段“有人愿意付钱”的验证标准是什么？准备如何衡量“交付可行”？
  - 3. 如果MVP跑通了，如何设计复制放大路径？请给出具体的放大倍数和资源需求估算
  - 4. 如果MVP阶段连1块钱都挣不到，你如何判断是模式问题还是执行问题？给出你的决策依据和止损条件
- 'no': 2
  title: 选品三要素评估练习
  contents:
  - 以下有三个候选产品，请用“选品决定论”的三要素（深挖需求涵盖面、客户粘性、品牌背书）为每个产品打分（1-10分），并说明理由：
  - 产品A：一次性口罩（无品牌、低价走量）
  - 产品B：私人定制护肤方案（含祛痘、美白、抗衰三线组合，与皮肤科医生合作）
  - 产品C：通用果蔬清洗剂（品牌成熟、超市有售）
  - 请回答：
  - 1. 哪个产品最符合“产品好省一半心”的标准？为什么？
  - 2. 如果让你优化产品A使其更具竞争力，你会如何调整？
  - 3. 结合自身资源，你会选择哪个产品作为创业切入点？考虑你的投入资本和预期回本周期分析可行性
- 'no': 3
  title: 信息差地图绘制练习
  contents:
  - 选择一个你熟悉的行业（如餐饮、教育、本地生活），完成以下练习：
  - 1. 列出该行业中至少5个“信息差”存在的场景（例如：消费者不知道的价格差异、服务差异、渠道差异）
  - 2. 对每个信息差，判断是“可持续信息差”还是“可被消除的信息差”，并给出理由
  - 3. 从中选择一个信息差，用“逆向开发方法论”设计一个商业切入点（痛点→产品形态→验证→放大）
  - 4. 与其他学员交换练习结果，互相找出对方方案中“信息差会被消除”的潜在风险点
- 'no': 4
  title: 渠道投产比实测设计
  contents:
  - 假设你的预算是5000元，要在抖音、小红书、本地微信公众号三个渠道中选择投放一个推广本地瑜伽工作室的广告。请设计一个投产比实测方案：
  - 1. 定义每个渠道的“收益”指标（注意要可量化）和“成本”指标
  - 2. 设计一个公平的对比方法（时间周期、目标人群、落地页等如何统一）
  - 3. 根据你自己的经验或调研，预测三个渠道的投产比排序，并给出你的判断依据
  - 4. 如果测试结果与你的预期不符，你如何决定是“追加预算”还是“放弃该渠道”？给出具体的决策阈值
- 'no': 5
  title: 平台演化周期预判练习
  contents:
  - 选择一个你正在关注的新兴平台（如小红书电商、TEMU、视频号带货），回答：
  - 1. 根据平台演化周期四阶段模型，判断该平台目前处于哪个阶段？给出至少3个判断依据（用户增长、平台政策、商业化程度等）
  - 2. 结合抖音的历史路径，预测该平台下一阶段可能发生的变化（竞争程度、平台管控、新玩法）
  - 3. 如果你是普通个体，现在入场应该采用什么打法？如果晚一年入场，打法需要如何调整？
  - 4. 识别该平台当前可能存在“灰色地带”机会，并评估其合规风险
