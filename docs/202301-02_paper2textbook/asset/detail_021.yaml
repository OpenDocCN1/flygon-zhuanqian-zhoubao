learning_targets:
- 理解 IFTTT 等零代码自动化平台的核心逻辑与适用场景
- 掌握“触发器—动作”二元模型的配置方法与排查思路
- 熟练配置邮件推送与 Webhook 群推送两条跨平台触达路径
- 理解 Webhook 作为通用 HTTP 回调标准的抽象能力与迁移复用
- 能评估免费额度、平台规则、外部依赖等现实约束并制定兜底方案
- 能将“If This Then That”心智模型迁移至钉钉、飞书、Zapier、n8n 等同类平台
concept_map:
- 自动化编排（第 21 章）
- ├── 核心平台：IFTTT
- │   ├── 定位：零代码、事件驱动、跨平台“数字胶水”
- │   ├── 免费额度：2 个 Applet
- │   └── 核心模型：If This Then That（触发器 → 动作）
- ├── 触发器
- │   ├── 来源：Twitter（指定用户发推）、微博、RSS、GitHub 等
- │   ├── 配置：授权账号、填写监控目标、Create trigger
- │   └── 限制：单 Applet 仅 1 触发器、免费版轮询有延迟
- ├── 动作
- │   ├── 类型：Email、Webhooks（Make a web request）、钉钉/飞书机器人等
- │   ├── 解耦：同一触发器可接多动作，动作间无数据依赖
- │   └── 扩展：多步骤、条件分支、代码节点多为付费功能
- ├── 推送路径对比
- │   ├── 路径一：Email（零配置、归档检索、时效依赖客户端、易沉底）
- │   └── 路径二：企业微信/钉钉 Webhook（即时、团队共见、Markdown 富文本、受群类型与频控限制）
- ├── Webhook 机制
- │   ├── 定义：HTTP 回调端点，URL 即凭证
- │   ├── 请求体：JSON，含 msgtype、markdown/content 等字段
- │   ├── 通用性：凡提供 Webhook URL 平台均可复用同一 IFTTT 配置
- │   └── 边界：公网可达、频控（企微 20 次/分）、无自动重试、URL 泄露风险
- ├── 变通与兜底
- │   ├── 单人群：先拉人再 T 掉
- │   ├── 外部联系人群：建纯内部群转发或改用应用消息 API
- │   ├── 额度不足：多账号轮换、付费升级或自建 n8n
- │   └── 核心依赖失效：监控任务存活、轮换 Token、评估自建方案 TCO
- └── 方法论迁移
- '    ├── 心智模型：事件源 → 响应目标 的排列组合'
- '    ├── 跨平台：IFTTT / Zapier / Make / n8n 同构'
- '    └── 典型场景：微博→Twitter、GitHub Release→群通知、RSS→Notion、监控告警→语音电话'
life_analogy:
- 想象自动化编排是一个**“专属管家 + 快递员”系统**：
- '- **触发器** = 管家的“监听雷达”：盯着 Twitter（门口），一旦目标大佬发推（事件发生）就立刻知道'
- '- **动作** = 管家的“指令单”：要么“寄封信到你邮箱”，要么“打电话给快递员（Webhook）送进企业微信群”'
- '- **Webhook** = **快递员的专属投递口**：只要给他一个地址（URL）和标准包裹格式（JSON），他就能把东西送进任何装了投递口的房间（企微群、钉钉群、自建系统）'
- '- **Applet** = 一张**“如果……就……”的标准作业单（SOP）**：免费版只给你发 2 张 SOP，想多管家得买会员或自建管家团队（n8n）'
- 就像管家不需要知道快递员内部怎么分拣，只需把包裹扔进投递口；IFTTT 也不需要知道企微怎么渲染 Markdown，只需 POST 标准 JSON 到 Webhook
  URL。
summary:
- concept: IFTTT
  desc: 零代码自动化平台，以“如果这样，就会那样”连接异构应用，免费额度 2 个 Applet
- concept: 触发器
  desc: 自动化的“因”，监听特定事件（如指定用户发推），单 Applet 仅支持一个
- concept: 动作
  desc: 自动化的“果”，执行预设操作（发邮件、调 Webhook），同一触发器可接多动作
- concept: Webhook
  desc: 通用 HTTP 回调标准，URL 即凭证，支持 Markdown 富文本，凡提供 Webhook 的平台均可复用
- concept: 邮件推送路径
  desc: 零配置、天然归档、可检索，但时效依赖邮件客户端推送、易被忽略
- concept: 群机器人推送路径
  desc: 即时触达、团队共见、Markdown 渲染，但受群类型限制（外部联系人不可建）、频控 20 次/分、URL 泄露风险
- concept: Applet 复用迁移
  desc: “If This Then That” 为通用心智模型，触发器与动作解耦，可迁移至 Zapier、Make、n8n 等平台
- concept: 边界与限制
  desc: 免费额度硬限制、平台规则红线（外部联系人群、Twitter API 收紧）、核心依赖三方无 SLA、运维成本隐性化
exercises:
- 'no': 1
  title: 从零搭建一个“监控 Twitter 并推送到企业微信群”的 Applet
  contents:
  - 1. 注册 IFTTT 账号并新建 Applet
  - 2. 选择 Twitter 触发器“New tweet by a specific user”，完成授权并填入被监控账号用户名
  - 3. 在企业微信中创建一个纯内部群，添加群机器人并复制 Webhook URL
  - 4. 在 IFTTT 动作处选择 Webhooks -> “Make a web request”，按下列要求填写：
  - '   - URL: 粘贴第 3 步复制的 Webhook URL'
  - '   - Method: POST'
  - '   - Content Type: application/json'
  - '   - Body: 粘贴以下 JSON 并保持 Ingredients（{{UserName}}、{{Text}}、{{LinkToTweet}}）不变：'
  - '     {'
  - '       "msgtype": "markdown",'
  - '       "markdown": {'
  - '         "content": "> 账号:{{UserName}} \n> 内容:{{Text}}\n> 链接:{{LinkToTweet}}"'
  - '       }'
  - '     }'
  - 5. 保存并等待目标账号发推，观察企业微信群是否收到推送
  - 回答问题：
  - '- 若企业微信群后来加入了外部联系人，推送会怎样？如何规避？'
  - '- 免费版 IFTTT 轮询间隔约为多久？若需秒级触达应如何解决？'
  - '- Webhook URL 泄露后会有什么后果？如何降低风险？'
- 'no': 2
  title: 对比邮件推送与群 Webhook 推送的优劣并制定双路径兜底策略
  contents:
  - 场景：你需要监控 3 个核心 KOL 的 Twitter 动态，既要自己第一时间看到，也要同步给 2 位合伙人协同研判。
  - 任务：
  - 1. 列出邮件路径与群 Webhook 路径在“时效性、可检索性、协同可见性、配置维护成本、抗风险能力”五个维度的优劣对比表
  - 2. 鉴于免费版仅 2 个 Applet 额度，设计一种“主路径+备用路径”方案，使 3 个 KOL 均能被监控且在主路径失效时自动切换（提示：可利用多账号、邮箱转发规则、企微转发群等手段）
  - 3. 说明当 Twitter API 政策变更导致触发器失效时，你的排查步骤与应急预案
- 'no': 3
  title: 将同一自动化逻辑迁移至钉钉/飞书/自建 n8n
  contents:
  - 1. 在钉钉群中创建自定义机器人，获取 Webhook URL，并修改 IFTTT 动作的 URL 字段完成迁移（对比企微 JSON 结构，钉钉需改为 `{"msgtype":"markdown","markdown":{"title":"Twitter更新","text":"..."}}`）
  - 2. 尝试在飞书群中添加机器人并获取 Webhook，说明飞书机器人是否支持 Markdown、签名校验等差异点
  - 3. （进阶）在本地或服务器部署 n8n，复刻“Twitter 触发 -> 企微/钉钉/飞书多群并发推送”工作流，对比 n8n 与 IFTTT 在：
  - '   - 免费额度/自托管成本'
  - '   - 多步骤/条件分支/错误重试能力'
  - '   - 数据隐私/合规可控性'
  - '   - 维护负担'
  - '   四个维度的差异，并给出“个人用户 vs 团队核心业务”的选型建议'
units:
- 'no': 1
  name: IFTTT 自动化平台 —— 连接异构应用的“数字胶水”
  points:
  - '**为什么需要这个概念？**'
  - '- 个人需求：想实时获取 Twitter 上 Web3 大佬动态，但 Twitter 无法直连微信，跨平台信息触达存在天然壁垒'
  - '- 技能门槛：非技术用户不会写代码、搭服务器，无法自研爬虫或中转服务'
  - '- 现有工具限制：国内常用软件多不支持国外平台联动，需寻找零代码、可配置的中间层'
  - '**核心定义**'
  - '- IFTTT (If This Then That) 是一个无代码自动化服务平台'
  - '- 核心逻辑："如果这样（触发器）... 就会那样（动作）"，连接 Twitter、Email、企业微信等异构应用'
  - '- 用户只需填参数、点点鼠标即可组装自动化任务，免费额度 2 个 Applet'
  - '**关键性质**'
  - '- 零代码：全程图形化配置，无需编程基础'
  - '- 跨平台：打通国外社交媒体与国内即时通讯生态'
  - '- 事件驱动：基于"事件发生-自动响应"的被动监听模式，而非主动轮询'
  - '- 免费额度有限：免费用户仅能创建 2 个自动化任务，付费版可扩展'
  - '**典型例子**'
  - '- 监控某 Web3 KOL 的 Twitter，新推文发布后 1 分钟内自动推送到企业微信群'
  - '- 同步微博内容到 Twitter（反向同理可用）'
  - '**边界条件**'
  - '- 依赖 IFTTT 官方服务稳定性，平台挂了则全盘失效'
  - '- Twitter API 政策变更可能导致触发器失效'
  - '- 免费版轮询间隔可能有延迟（非实时推送），高频需求需付费'
  - '- 企业微信群若含外部联系人，无法创建群机器人，Webhook 路径不通'
  sources:
  - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
    role: origin
  excerpts:
  - 这个平台就是自动化的，也不需要自己写代码，编辑上一些参数就行了。
  - 这个平台有两个推送方式：1、推特用户更新内容后，以邮件方式将推特内容推送到指定邮箱 2、推特用户更新内容后，通过企业微信群的机器人将内容推送到企业微信群（钉钉也同理）
  - 免费用户只能搞2个推送机器人，还有两个付费版本，根据自己的需要购买
  - 进来之后，会出现这个，第一行的意思是：如果这样 第二行的意思是：就会那样 合起来就是：如果这样了，那就会那样
- 'no': 2
  name: 触发器与动作 —— 自动化任务的“因果两端”
  points:
  - '**为什么需要这个概念？**'
  - '- 抽象理解：自动化本质是"事件-响应"模式，必须拆解为可配置的因果两端'
  - '- 组合复用：理解触发器与动作的解耦关系，才能像搭积木一样自由组合新玩法'
  - '- 故障排查：推送失败时，需判断是触发端没监听到，还是动作端执行报错'
  - '**核心定义**'
  - '- 触发器：自动化的"如果"，负责监听特定事件发生（如：指定用户发推）'
  - '- 动作：自动化的"那样"，负责执行预设操作（如：发邮件、调 Webhook）'
  - '- Applet = 1 个触发器 + 1 个或多个动作'
  - '**关键性质**'
  - '- 解耦性：触发器与动作独立开发、独立配置、可任意排列组合'
  - '- 标准化：IFTTT 内置数百种服务的标准触发器/动作，开箱即用'
  - '- 单向流：数据从触发器流向动作，不支持回路控制'
  - '**典型例子**'
  - '- 触发器：Twitter - "New tweet by a specific user"（指定用户发推）'
  - '- 动作 1：Email - "Send me an email"（发送邮件到注册箱）'
  - '- 动作 2：Webhooks - "Make a web request"（POST JSON 到企业微信 Webhook）'
  - '**边界条件**'
  - '- 单个 Applet 仅支持 1 个触发器，不支持复合条件（如：A 用户发推且含关键词）'
  - '- 动作执行失败通常不重试，需自行配置死信队列或告警（IFTTT 原生不支持）'
  - '- 触发器轮询频率受免费版限制，非毫秒级实时'
  sources:
  - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
    role: origin
  excerpts:
  - 点击 if this 后面的add 出现下面的界面...我们要用的是“指定用户更新推特触发”
  - 在下面的then that设置触发后的动作，邮箱推送和企业微信推送的区别就是触发后的动作不同。
  - 搜索名为「Webhooks」的触发器，选择「Make a web request」动作。
  - 这里要填两个账号，第一行的账号是自己的账号，第二行是要监控的账号。
- 'no': 3
  name: Webhook 机制 —— 通用的“推送通道”抽象
  points:
  - '**为什么需要这个概念？**'
  - '- 打破孤岛：不同应用（企业微信、钉钉、飞书、自建系统）各有 API，Webhook 提供统一的"HTTP 回调"标准'
  - '- 零代码集成：IFTTT 等平台只需支持"发起 Web 请求"动作，即可对接所有支持 Webhook 的下游'
  - '- 安全可控：Webhook URL 即凭证，无需在 IFTTT 存储下游账号密码'
  - '**核心定义**'
  - '- Webhook：用户自定义的 HTTP 回调端点，访问特定 URL 并携带规定格式载荷即可触发下游动作'
  - '- 企业微信群机器人：群设置中添加机器人，生成唯一 Webhook URL，支持 Markdown/文本/图文等消息类型'
  - '**关键性质**'
  - '- 通用性：凡提供 Webhook URL 的平台（钉钉、飞书、Slack、自建服务）均可复用同一套 IFTTT 配置'
  - '- 无状态：单次 HTTP 请求，不保持长连接，适合低频事件推送'
  - '- 格式约定：下游规定 JSON 结构，上游需严格按字段填写'
  - '**典型例子**'
  - '- 企业微信 Markdown 推送体：`{"msgtype":"markdown","markdown":{"content":"> 账号:{{UserName}}
    \n> 内容:{{Text}}\n> 链接:{{LinkToTweet}}"}}`'
  - '- 钉钉群机器人 Webhook：相同配置逻辑，仅换 URL 即可复用'
  - '**边界条件**'
  - '- 企业微信：含外部联系人的群无法创建机器人；单人群需"拉人再踢"变通'
  - '- 频率限制：企业微信机器人每分钟最多 20 次请求，高频场景会被限流'
  - '- 公网可达：Webhook URL 必须公网可访问，内网环境需内网穿透'
  - '- 无重试：IFTTT 发送失败不自动重试，需下游幂等或自建中转层'
  sources:
  - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
    role: origin
  excerpts:
  - 生成机器人成功后，会获取到一个 Webhook 地址，请记住这个地址。（以后我们简称 {WebhookUrl}）
  - 可以理解为，访问这个 Webhook 地址并以某种方式携带我们需要传递的内容，就能够把我们要传递的内容，推送到企业微信中。
  - 注意包含「外部联系人」的话，不能创建机器人，也就不能实现上述功能。
  - 同理，钉钉也是可以这样操作的，只要能获取到webhooks地址的都可以。
  - 'body填写内容(从下面一行的括号开始复制）： { "msgtype": "markdown", "markdown": { "content": ">
    账号:{{UserName}} \n> 内容:{{Text}}\n> 链接:{{LinkToTweet}}" } }'
- 'no': 4
  name: 两条推送路径对比 —— 邮件 vs 企业微信 Webhook
  points:
  - '**为什么需要这个概念？**'
  - '- 方案选型：不同场景（个人独享 vs 团队协作、临时验证 vs 长期运行）需不同推送路径'
  - '- 成本权衡：邮件零配置但易沉底；群推送即时可见但需维护群机器人'
  - '- 容灾备份：单路径易失效，双路径互为兜底'
  - '**核心定义**'
  - '- 路径一（邮件）：触发器 Twitter -> 动作 Email -> 注册邮箱收件箱'
  - '- 路径二（群机器人）：触发器 Twitter -> 动作 Webhooks -> 企业微信群机器人 Webhook -> 群聊'
  - '**关键性质**'
  - '- 邮件路径：零额外配置、天然归档、可搜索、但时效性依赖邮件客户端推送、易被忽略'
  - '- 群机器人路径：即时触达、团队共见、Markdown 渲染富文本、但受群类型限制、需维护 Webhook URL 安全'
  - '- 两路径触发器完全相同，仅动作端不同，体现"触发-动作"解耦优势'
  - '**典型例子**'
  - '- 个人独用、低频监控：选邮件路径，最快验证链路通否'
  - '- 团队研判、高频跟踪：选群机器人路径，配合 @全员 唤起注意力'
  - '**边界条件**'
  - '- 邮件路径：IFTTT 仅发送到注册邮箱，不支持自定义收件人（除非用转发规则）'
  - '- 群机器人路径：Webhook URL 泄露即可被任意推送垃圾信息，需妥善保管'
  - '- 免费版 2 个 Applet 额度，同时跑两条路径即占满，需权衡或付费'
  sources:
  - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
    role: origin
  excerpts:
  - 这个平台有两个推送方式：1、推特用户更新内容后，以邮件方式将推特内容推送到指定邮箱 2、推特用户更新内容后，通过企业微信群的机器人将内容推送到企业微信群
  - 这里他推送的邮箱是你账号注册的邮箱。
  - url填写WebhookUrl 其他的按照图中选择，Additional Headers 这个不填（因为我不知道这是啥意思）
  - 这两个方法我都测试了，都是可以的
- 'no': 5
  name: Applet 复用与迁移 —— 同一逻辑，多种玩法
  points:
  - '**为什么需要这个概念？**'
  - '- 举一反三：掌握"事件-响应"抽象模型，即可将单一技能迁移为通用能力'
  - '- 资产沉淀：将具体配置上升为可复用的方法论，而非一次性操作手册'
  - '- 创新源泉：新需求=新触发器+新动作的排列组合，而非重新学习'
  - '**核心定义**'
  - '- "If This Then That" 为通用心智模型：任何离散事件源 -> 任何可编程响应目标'
  - '- 迁移三要素：新触发器（如微博更新）、新动作（如发钉钉）、同一编排逻辑'
  - '**关键性质**'
  - '- 平台无关：IFTTT、Zapier、Make、n8n 均遵循此模型，技能可跨平台迁移'
  - '- 组合爆炸：N 个触发器 × M 个动作 = N×M 种潜在自动化场景'
