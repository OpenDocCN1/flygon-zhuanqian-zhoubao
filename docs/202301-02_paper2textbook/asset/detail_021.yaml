  - '**核心定义**'
  - '- 免费额度硬限制：IFTTT 免费版仅 2 个 Applet；企业微信机器人每分钟 20 次调用上限'
  - '- 平台规则红线：企业微信含外部联系人群不可建机器人；Twitter API 访问权限收紧趋势'
