learning_targets:
- 理解流量价值公式，掌握规模、相关性、信任度三要素的乘法效应
- 掌握流量流速悖论，能够解释流量运营中速度与停留时间的辩证关系
- 掌握公域引流私域变现的完整链路，理解从平台流量到自有资产的转化逻辑
- 理解交易目的论，能够区分有效流量与无效流量
- 掌握买卖生意商业三分论，明确从个人劳动力到系统复制的成长路径
- 掌握MVP先卖后做论，能够运用预售和想法验证产品需求
- 掌握五位一体成交飞轮，能够设计标准化的私域成交流程
- 理解内容价值金字塔，能够规划从娱乐到方法的内容层级
- 掌握三会一层与股权顶层设计，理解公司治理的结构化逻辑
- 理解利他等于利己的认知哲学，建立分享型增长思维
