life_analogy:
- 想象创业是一场**双层网球赛**：
- '- **外在比赛** = 你在球场上跑动、击球、与对手博弈（技术、资源、策略）'
- '- **内在比赛** = 你脑海中那场‘我能不能赢’的心理较量（自我一理性分析 vs 自我二潜意识信念）'
- '- **自我一** = 嘴碎的教练，不断指责‘手腕没翻’、‘脚步太慢’（理性焦虑、计算利弊）'
- '- **自我二** = 天赋异禀的运动员，只需‘信任肌肉记忆’挥拍（潜意识自信、盲目乐观）'
- '- **俯视学习法** = 球场边站着‘国王’姿态的你，战略上藐视对手‘朕即王’，战术上认真记笔记‘这招高明’'
- '- **确定性窗口期** = 赛程表上标红的‘主场连战3个月’，顺势而为比硬碰硬强百倍'
- '- **价值创造视角** = 不盯着比分牌（增长KPI），而是每天打磨‘不流动的稀缺资产’——发球精度、体能储备、战术库（品牌、数据、信任）'
- '- **选品四步法** = 寻找‘无人耕种的沃土’（蓝海），种‘90%口感1/5价格’的种子（平替），挂‘百年老字号’的牌子（空壳品牌），再施‘改良土壤’的微创新'
- '- **优雅亏大钱三步骤** = 赛前喝酒、押注全身家当、输了赖裁判不认输——反面教材刻骨铭心'
- '- **利他即利己** = 免费教陪练发球，结果陪练成了世界冠军，回头带你进国家队训练基地'
- '- **趋势判断** = 像老渔民看鸟群知鱼群，用香港疫情鸟群推演大陆鱼群，用淘系周期推演新平台鱼群'
- '- **招商加盟** = 先把自家‘秘制酱料包’（单店模型）标准化，再招‘合伙人’开分店，而非只卖‘招牌’'
- '- **IP体系** = 盖摩天大楼：母题是地基，基因是钢筋，身份是楼层功能，观感是装修风格，资产是租金收益'
summary:
- concept: 内在比赛理论
  desc: 人分自我一(理性)与自我二(潜意识)；外在成败由内在比赛决定，自我二不认可目标必输无疑
- concept: 盲目自信
  desc: 创业者的理性选择：战略上‘舍我其谁’的潜意识信念，是打赢内在比赛的前提
- concept: 成功是成功之母
  desc: 反常识核心主张：过去的成功体验在潜意识累积自信，推动后续更大成功，失败非成功之母
- concept: 唤醒成功体验法
  desc: 内心怂时回顾过往成功，或像优秀推销员一样先卖易品造‘小赢’，撬动全天状态
- concept: 俯视学习法
  desc: 战略藐视（朕是国王看奏折）、战术重视（认真记笔记），跪着学打不赢内在比赛
- concept: 确定性窗口期
  desc: 用香港疫情数据类比推演大陆：首波感染后2-3月平稳期=黄金入场窗，2023春天先干个春天再说
- concept: 二波规律
  desc: 平静期后必有二波，但更缓、周期更长(5-6月)、感染率约首波50%，行业复苏分波次传导
- concept: 增长瓶颈怪圈
  desc: 越追求增长越远：被预期绑架→投机跟风/计算利弊/抓取资源→失去优势→更焦虑
- concept: 价值创造视角
  desc: 从‘我如何得增长’切换为‘我如何配得增长’；需三种勇气：面向未来/用户/积累稀缺价值
- concept: 不流动稀缺资产
  desc: 销售额/DAU/权力是无限流动的；品牌心智/核心数据/核心人才/用户信任才是稀缺不流动的锚点
- concept: 战略非目标论
  desc: 目标是战略的对象非战略本身；战略=获相对优势的指导原则+发挥禀赋，归治理层(三会一层)管
- concept: 强加成本战略
  desc: 利用优势迫使对手持续承担高成本应对(如美拖垮苏)，而非单纯军备竞赛
- concept: 选品四步法
  desc: 找蓝海市场/平台/方向 → 走合规平替捷径(流量+转化) → 加空壳品牌光环(溢价+复购) → 做微创新/材质套利(护城河+延长红利)
- concept: 蓝海分类体系
  desc: 最蓝(小语种发达国+准入门槛) → 次蓝(发达国+头部平台) → 微蓝(新平台/新开放) → 不蓝(所有低价平台)
- concept: 合规平替
  desc: 用低成本材料还原高端体验90%，价格仅1/5甚至1/10，同时解决流量获取与转化难题
- concept: 空壳品牌
  desc: 抢注国外未注册类目品牌或策划虚构外国品牌故事，快速获品牌溢价、信任与复购(10%复购/30%净利提升)
- concept: 微创新/材质套利
  desc: 新手不搞原创设计，基于大标品做材质升级(如头层皮换二层皮)与热点嫁接差异化，延长红利期
- concept: 信息差生意
  desc: 机会藏在身边被忽视的细节：苏州广告牌图文70店/四线城烤面筋月2万/朋友圈卖蟹年1.2万；网上公开的已过时
- concept: 正反馈驱动热爱
  desc: 懒惰=无正反馈=做得不够多=不够爱/想/缺；突破口：找真热爱 或 纯为钱冲(不别扭不内耗)
- concept: 优雅亏大钱三步骤
  desc: 反讽清单：1)做自作对手方的事 2)加杠杆重仓一夜暴富 3)赚不止盈亏不止损死扛；反向操作也不保赢
- concept: 利他等于利己
  desc: 越分享越幸运：市场大蛋糕分不完、信息最稀缺分享最划算、公开生信任；核心机密除外、高质量可收费
- concept: 趋势判断框架
  desc: 疫情类比推演窗口期 + 平台电商四周期演进规律 + 热点套利技术基建前置 + SEO长尾福利 + 身边信息差挖掘
- concept: 平台电商四周期
  desc: 铺货期→动销期→精细化期→玩趋势期；所有平台底层逻辑相通，可预判美团/TEMU等新平台机会
- concept: 热点套利技术栈
  desc: 预置技术基建(域名/公众号/小程序)→热点来临时十分钟接入API/做镜像站→抢占搜索流量首位
- concept: 招商加盟四级模式
  desc: 轻量(卖技术/料包)→中量(卖设备/服务)→重量(卖品牌)→魔鬼(卖特许权可资产转移继承)
- concept: 健康单店模型验证
  desc: 门店模型测算到位 → 单店财务模型健康 → 区域模型验证通过 → 复制性与财务模型达标 → 再开放加盟
- concept: IP地基12345
  desc: 1个母题(文化原型锚点护城河) + 2层基因(文化沉淀+商业能力) + 3重身份(工具/人/神) + 4级观感(松弛/对象/获得/氛围) + 5份资产(用户/版权/实物/文化/生态)
- concept: 独创理论五大生成法
  desc: 理想解法(TRIZ六步推导) / 节点法(服务流程共性节点) / 词根法(垂类优势词) / 母题法(延展/结合) / 核心法(提取核心点)
- concept: 千万营收模型
  desc: 年会员(标品0交付) → 私教3w/3月 → 私董会5-20w → 合伙/徒弟20w-100w → 图书(一书一码/联合出品) → 课程直播(199小课/双播月400w)
    → 咨询1K+/h → 轻顾问3w起/重顾问20w/年
- concept: 超垂直SEO流量
  desc: 极度细分领域长期主义 + SEO思维精准搜索流量(300-500长尾词/词写方案/多渠道发布/坚持更新) → 1个月后日增精准咨询
- concept: 爆款引流库100-10-1
  desc: 自建选款库/第三方工具/同类同品牌推荐/数据化测试 → 先找100款 → 每款发3-5条笔记 → 选出10个出单款 → 聚焦爆款
- concept: 反向发帖(挨骂流派)
  desc: 故意发表反主流争议观点(如表扬被骂对象)引发谩骂讨论 → 获巨大流量收益(<300字微头条赚400+)
- concept: Web3赛道认知
  desc: 基于区块链且能与现实交互的互联网生态(以虚促实)；10年造3万亿流动价值；熊市生存=敬畏市场+保护弹药+选基建公司；选择比努力重要+留容错率
exercises:
- 'no': 1
  title: 复盘你的一次“内在比赛”败局
  contents:
  - 回顾一个你曾全力投入但最终失败的长期目标（创业、考证、减肥等）：
  - 1. 事前，你的‘自我二’（潜意识）真心相信能成功吗？有什么具体信号（如失眠、找借口、不敢投入核心资源）？
  - 2. 过程中，当困难出现时，‘自我一’（理性）是如何干扰的（如不断自我批评、频繁换方案、过度研究而不行动）？
  - 3. 你是否有过‘成功体验’可供唤醒？如果重来，你会用什么‘微小必赢’的动作来制造早期正反馈？
  - 4. 你当时的学习姿态是‘跪着学’还是‘俯视学’？请给出一个具体场景对比。
- 'no': 2
  title: 推演你所在行业的“确定性窗口期”
  contents:
  - 参照‘香港疫情类比大陆’的推演逻辑，为你的行业/赛道做一次窗口期判断：
  - 1. 找一个‘领先经历过类似周期’的参照系（如海外同行业、上游下游、政策先行区），其关键节点时间轴是什么？
  - 2. 映射到你的环境，当前处于‘首波冲击’、‘平稳期’还是‘二波来临前’？依据是什么数据？
  - 3. 在判断的‘平稳期’内，你的行业哪三个细分方向属于‘刚需+复苏’？对应普通人的切入玩法是什么？
  - 4. 如果窗口期只有3个月，你的MVP验证、流量搭建、首单成交的时间表如何排？
- 'no': 3
  title: 审计你的“稀缺不流动资产”清单
  contents:
  - 列出你当前正在投入精力的项目/业务，按下表分类填写：
  - '| 资产类别 | 当前拥有量/质量 | 是否稀缺/不流动 | 过去3个月积累增量 | 竞争对手能否轻易复制 |'
  - '|---|---|---|---|---|'
  - '| 品牌心智/用户信任 | | | | |'
  - '| 核心数据/用户画像 | | | | |'
  - '| 核心人才/关键合伙人 | | | | |'
  - '| 独家供给/渠道/技术 | | | | |'
  - '| 销售额/GMV/粉丝数(流动性指标) | | | | |'
  - 回答问题：
  - '- 你的核心优化目标（OKR的O）是指向左侧稀缺资产，还是右侧流动性指标？'
  - '- 如果是后者，如何修改O和KR，使其直接驱动稀缺资产积累？'
  - '- 参考‘茅台不降价守品牌’，你有什么‘哪怕亏短期钱也要守’的资产底线？'
- 'no': 4
  title: 压力测试：你的项目能否通过“优雅亏大钱”三步骤的反向筛查？
  contents:
  - 对你正在做或准备做的项目，诚实回答：
  - 步骤一·赛道筛查：这是‘少数人能赚/我看不懂’的项目吗？我是否在自作对手方（如不懂技术做SaaS、不懂医疗卖保健品）？
  - 步骤二·资金筛查：我是否在用‘一夜暴富’预期驱动决策？仓位是否过重（>30%流动资金）？是否使用杠杆/高频交易模式？
  - 步骤三·止损筛查：我是否设定了明确的‘止损线’（时间/金额/里程碑）？过往有无‘赚了不止盈、亏了死扛’的经历？
  - 综合判定：若三项全中，立即停止并重新设计MVP验证路径；若1-2项中，制定具体整改措施与监督机制。
- 'no': 5
  title: 设计你的“利他即利己”分享实验
  contents:
  - 在未来两周内，执行一次高质量的知识/经验公开分享，并记录全过程数据：
  - 1. 选题：选择一个你掌握、同行需求大、非核心机密的‘方法论/复盘/避坑指南’。
  - 2. 产出：写一篇3000字以上的深度长文，或录制10分钟以上结构化视频，包含：背景痛点、核心框架、关键步骤、踩坑细节、可复用模板。
  - 3. 分发：同步发布到至少3个平台（公众号/小红书/知乎/社群/即刻等），标题植入SEO长尾词。
  - 4. 追踪（两周内每日记录）：阅读/播放量、完读率、收藏转发量、新增关注/私信/咨询量、产生的实际商业线索（合作/带资入伙/付费咨询）。
  - 5. 复盘：哪条内容带来的‘高质量连接’最多？分享前的顾虑是什么？分享后是否验证了‘市场大、信息稀缺、公开生信任’？
- 'no': 6
  title: 实战演练：为你的项目跑一遍‘选品四步法’
  contents:
  - 选定一个你正在运营或准备启动的电商/带货项目，完成以下四步推演：
  - 步骤一·找蓝海：你的目标市场属于‘最蓝/次蓝/微蓝/不蓝’哪一类？是否存在‘蓝海方向’(垂直细分词自带搜索流量)？
  - 步骤二·走捷径：能否做‘合规平替’？即用1/5甚至1/10成本还原头部产品90%体验？核心关键词与竞品品牌词如何布局？
  - 步骤三·加光环：是否适合‘空壳品牌’策略？在东欧做日本品牌、在美国做欧洲品牌，能否策划品牌故事获10%复购/30%净利提升？
  - 步骤四·微创新：基于大标品能做什么‘材质套利’或‘热点嫁接’差异化？能否打造护城河延长红利期？
- 'no': 7
  title: 趋势判断沙盘：预演你赛道的‘平台电商四周期’位置
  contents:
  - 以你所在的主流平台(抖音/视频号/小红书/快手/美团/TEMU等)为例：
  - 1. 判断当前平台处于‘铺货期/动销期/精细化期/玩趋势期’的哪个阶段？依据是什么(商家数/流量成本/平台政策/头部玩法)？
  - 2. 参考淘系历史，你的赛道在该阶段的最优打法是什么？(如铺货期重SKU、精细化期重ROI、玩趋势期重IP/直播)
  - 3. 若平台处于‘动销期→精细化期’过渡期，你的‘完成比完美更重要’的MVP验证清单是什么？(如美团电商首店80元跑通)
  - 4. 你的技术/内容基建是否具备‘热点套利’能力？列出缺失的基础设施清单(域名/账号/API/镜像站/自动发布工具)。
- 'no': 8
  title: 加盟模式自查：你的单店模型是否达标‘健康四项’？
  contents:
  - 对你的核心业务模型进行诚实评估：
  - 1. 门店模型测算：单店投入/产出/回本周期/现金流是否已建立量化表格并跑通？
  - 2. 单店财务健康：扣除房租/人工/货品/推广后，单店月净利是否为正且稳定？毛利率是否达标？
  - 3. 区域模型验证：是否已在2-3个不同城市/商圈复制跑通？区域差异化调整项是什么？
  - 4. 复制性达标：核心SOP(选品/装修/招聘/培训/运营/供应链)是否文档化？新合伙人‘拿来即用’耗时几天？
  - 若有任意一项不达标，列出具体补齐行动与时间表；切勿在模型未成熟时开放加盟。
- 'no': 9
  title: 构建你的个人IP‘地基12345’草图
  contents:
  - 按以下框架为你的个人IP/专家品牌填写草稿：
  - 1. 母题(核心锚点)：你所在领域循环往复的文化原型是什么？(如‘成长’/‘财富’/‘健康’/‘自由’)
  - 2. 两层基因：
  - '   - 文化沉淀(风骨)：你坚持不做的‘无文化溢价’的事是什么？你的‘危机再分配’话语权来自解决什么危机？'
  - '   - 商业能力(变现)：你的千万营收阶梯包含哪些产品？(标品会员/私教/私董/徒弟/图书/课程/顾问)'
  - 3. 三重身份场景：
  - '   - 工具：解决用户什么具体功能性问题？'
  - '   - 人：提供什么价值主张/情绪陪伴？'
  - '   - 神：支持用户什么迭代升级/身份跃迁？'
  - 4. 四级观感(至少具备两个)：松弛感/对象感/获得感/氛围感，你的内容/直播/社群如何体现？
  - 5. 五份资产现状：用户资产(画像/分层)、版权资产(17种可交易版权)、实物资产(衍生品)、文化资产(主文化/亚文化定位)、生态资产(合伙人/服务商/政府支持)。
- 'no': 10
  title: Web3/新赛道决策压力测试
  contents:
  - 针对一个你心动的新赛道/新技术(如Web3/AI应用/元宇宙等)，诚实回答：
  - 1. 选择依据：你是因‘前期资金规模匹配’而选择，还是因‘FOMO/大佬背书/热度词’而冲动All in？
  - 2. 容错率：若该方向归零，你的场外赚钱能力(主业/副业/技能)能否维持生活6个月以上？
  - 3. 试错成本：能否用‘小成本/无杠杆/不碰合约’的方式验证核心假设？预算上限多少？
  - 4. 变现路径：是否已想清‘会卖比会买重要’？首个变现闭环是什么？见好就收/有利必跑/狠心出货/切勿幻想/变现为王——你能做到哪几条？
  - 5. 熊市生存：若遇FTX级崩盘，你的团队/资金/心态是否具备‘敬畏市场与共舞、保护成员不被连锁暴雷’的韧性？
units:
- 'no': 1
  name: 内在比赛理论 —— 搞定潜意识才能赢外部
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人有技术、有资源、有计划，最后还是失败了，根本原因不是外部竞争对手强，而是自己内心深处不相信能赢'
  - '- 创业、考证、减肥等长期目标，往往死在“开始前就已输掉”的心理建设上'
  - '- 只有当潜意识（自我二）真正认可目标，理性的执行力（自我一）才能持续发力，不再内耗'
  - '**核心定义**'
  - '- 来源于《身心合一的奇迹力量》：人分为“自我一”（理性/显意识）和“自我二”（感性/潜意识）'
  - '- 任何外在比赛（创业、考试、销售）背后，都同时进行着一场“内在比赛”'
  - '- 内在比赛的输赢，取决于自我二是否真心认可这个目标；一旦内在比赛输了，外在比赛必输无疑'
  - '**关键性质**'
  - '- 决定论：外在成败由内在比赛决定，李宗伟不是输给林丹，是输给自己不相信能赢的潜意识'
  - '- 叠加性：成功体验能累积潜意识自信，形成“成功是成功之母”的正向飞轮'
  - '- 可训练性：通过“唤醒成功体验”和“俯视学习法”可主动强化自我二'
  - '**典型例子**'
  - '- 老虎伍兹：性丑闻后潜意识失去“不可战胜”信念，两个月丢世界第一，跌出前100'
  - '- 优秀推销员：每天先卖容易卖的产品给优质客户，制造“小赢”唤醒自信，再攻坚大单'
  - '- 作者自己：把付费社群帖子当“奏折”看，心态上“朕即国王”，战略俯视、战术重视'
  - '**边界条件**'
  - '- 盲目自信≠盲目冲动：战略上藐视困难（我相信我能赢），战术上必须重视细节（我要研究怎么赢）'
  - '- 需要真实成功体验支撑：空洞的自我暗示无效，必须有过往“赢过”的记忆做锚点'
  - '- 适用于长期博弈：短期投机、纯运气游戏（如买彩票）不适用此理论'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 人，有两个自我，分别是自我一、自我二。自我一，对应着理性，是一般意义上的自我。自我二，对应着感性，或者说对应着潜意识。
  - 任何一个比赛，实际上是同时进行的两场比赛，内在比赛和外在比赛。内在比赛，也就是英文书名里的'Inner Game'，这是最容易被人忽视的。
  - 人们往往容易忽略的是，如果自我二（也就是潜意识），并不认可这个目标的时候，会输掉内在比赛。一旦输掉内部比赛，外在比赛也会输。
  - 一言以蔽之：你需要盲目的自信。因为盲目的自信和乐观，是创业者的理性选择。
  - 失败不是成功之母，成功才是成功之母。我一个成功体验，推动一个又一个的成功体验。
  - 我的答案是：别跪着学！要俯视！你就是国王，把生财有术的帖子，当成奏折来看。
- 'no': 2
  name: 确定性窗口期 —— 用数据推演红利的“黄金3个月”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人创业最怕“赌错赛道、错过风口”，需要一种低成本判断“何时入场、做什么”的方法'
  - '- 宏观环境（疫情、政策、技术周期）决定了流量和需求的大潮汐，顺势而为比逆势硬扛效率高百倍'
  - '**核心定义**'
  - '- 通过对标历史相似事件（如香港疫情数据），推演本地未来3-6个月的宏观确定性状态'
  - '- “确定性窗口期” = 疫情首波感染后的平稳期（约2-3个月），此时消费复苏、流量红利、政策宽松三重叠加'
  - '- 核心判断：2023年春天是全年最重要的窗口期，先干个春天再说'
  - '**关键性质**'
  - '- 类比推演：香港首波感染8-9成后进入2-3月平静期，大陆参照此节奏'
  - '- 二波规律：平静期后必有二波，但二波更缓、周期更长（5-6月），感染率约首波50%'
  - '- 行业传导：窗口期内，旅游、健康、餐饮三大刚需赛道将率先爆发复苏'
  - '**典型例子**'
  - '- 旅游复苏数据：春节国内旅游3亿人次，恢复至2019年88.6%；出境机票单量涨258%，入境预订涨632%'
  - '- 健康带货爆发：诺特兰德维生素连续两月抖音直播单品销量第一，多个保健品品牌抖音销量过亿'
  - '- 普通人切入：旅游做分销（机票/酒店/景点）、健康做养生带货/书单/茶、餐饮紧扣春季爆发'
  - '**边界条件**'
  - '- 窗口期具有强时效性：错过春天这3-6个月，等于主动放弃全年最大确定性红利'
  - '- 仅适用于“刚需+复苏”赛道：非刚需项目（链条长、推不动）在窗口期也跑不通'
  - '- 依赖宏观类比准确性：若大陆疫情节奏显著偏离香港，窗口期判断失效'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 最近 3~6 个月，是比较确定的疫情平稳期，之后才会迎来第二波疫情的峰值。
  - 香港跟大陆一样，也是第一次大规模疫情感染，就把八九成的居民给感染了。之后香港就进入了 2~3 个月的平静期，平静期之后就进入第二波疫情感染。
  - 至少 2023 年的春天，会是一个比较确定的稳定期。
  - 今年春节国内旅游人次达到 3 个亿，基本上已经恢复到 2019 年同期的 88.6%了。
  - 出境的机票订单量上涨了 258%，入境的预定量上涨了 632%，国际酒店的预定量同比增长了 177%。
  - 反正我相信春天来了，先干个春天再说。
- 'no': 3
  name: 价值创造视角 —— 从“我要增长”转为“我配增长”
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数企业和个人陷入“增长瓶颈怪圈”：越想增长、越焦虑、越投机、越计算利弊、越抓取资源，反而离增长越远'
  - '- 传统复盘只问“坚持了什么”，导致用过去定义自己，错失趋势势能（如柯达自以为坚持品质实为错失数码趋势）'
  - '- 唯一破局路径：视角从“追求增长”切换到“价值创造”，即“我如何成为值得被奖赏增长的人”'
  - '**核心定义**'
  - '- 增长视角：面向过去、计算利弊、抓取资源 → 导致FOMO焦虑、短视行为、恶性循环'
  - '- 价值创造视角：面向未来（开创）、面向用户（解决问题）、积累稀缺价值（品牌/数据/信任/人才）'
  - '- 三种勇气：面向未来而非过去的勇气、面向用户而非计算利弊的勇气、积累价值而非抓取资源的勇气'
  - '**关键性质**'
  - '- 因果倒置：增长是价值创造的结果，而非可直接追逐的目标；“帮助一万人赚钱”是目标不是战略'
  - '- 稀缺性导向：销售额/DAU/权力是无限流动的，品牌心智/核心数据/核心人才/用户信任才是稀缺不流动的资产'
  - '- 历史验证：LV借铁路造箱、Nike借电视签星、索尼借晶体管造Walkman、宝洁借广播建品牌，皆因抓住势能开创而非守成'
  - '**典型例子**'
  - '- 茅台：八项规定后中高端白酒集体降价砸牌，唯茅台守住“品牌心智”这一稀缺资产，长期跑赢'
  - '- 宜家：不为提高停留时长而做体验店，而是为解决“陌生城市一天拥有一家”的核心需求，模式服务于需求'
  - '- 四爷（雍正）：“争是不争，不争是争”，从争权夺力转为给大清创造价值，最终赢得皇位'
  - '**边界条件**'
  - '- 需具备长期主义耐心：价值创造周期长，短期利润压力大的企业难以坚持'
  - '- 必须识别出当下环境真正稀缺的“锚点资产”，否则易陷入“伪价值创造”的自我感动'
  - '- 不排斥增长指标：只是不把增长当KPI当目的，而是把它作为价值创造的自然投影'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 进入增长瓶颈的一个典型现象，就是越想要增长，却距离想要的增长越远。
  - 如果用一句话来形容这种现象，那就是我们被我们想拥有的东西绑架了。
  - 我发现，破除增长焦虑唯一的方法，就是怎么从追求增长的视角，切换成价值创造的视角。
  - 从一个'我如何得到增长'，变成'我如何成为一个值得被奖赏增长的人'。
  - 真正要去摆脱这种视角，最难的不在于方法论，而是 3 种'勇气'：面向未来而非面向过去的勇气；面向用户而非计算利弊的勇气；积累价值而非抓取资源的勇气。
  - 邬思道（号称编剧附体的人）提出了违反共识却真正行之有效的关键战略，只有八个字'争是不争，不争是争'。
  - 实际上，这也是一个奇怪的现象，我们花费了太多的精力去抓住无限的、流动的东西，而非关注真正稀缺的、不变的东西。
- 'no': 4
  name: 战略非目标论 —— 战略是指导原则，不是贴在墙上的数字
  points:
  - '**为什么需要这个概念？**'
  - '- 绝大多数人把“年入百万”、“上市”、“帮助一万人”当战略，其实那是目标/KPI，导致战略层面空洞、执行层面朝令夕改'
  - '- 战略混淆导致：资源分散、组织内耗、错失趋势窗口、被竞争对手降维打击'
  - '- 必须澄清：战略是什么、不是什么、怎么落地，才能让“三会一层”治理层真正发挥作用'
  - '**核心定义**'
  - '- 战略≠目标：目标是战略的对象/结果，战略是“自始至终的指导原则”'
  - '- 战略三要素：1) 目的——获得相对优势；2) 形式——指导原则（而非一次性计划）；3) 约束——必须发挥自身禀赋（劣势不能做战略方向）'
  - '- 治理归属：战略是“三会一层”（股东会/董事会/监事会/高管层）要做的事，而非执行层的事'
  - '**关键性质**'
  - '- 稳定性：战略既不是一朝一夕的事，也不是朝令夕改的事，需慎之又慎'
  - '- 差异化：老乡鸡比标准化、南城香比品牌力会死，必须比“人情味/现炒”这种自身禀赋优势'
  - '- 强加成本：美国拖垮苏联的战略指导原则是“让对手持续增加成本”，而非单纯军备竞赛'
  - '**典型例子**'
  - '- 柯达：自以为战略是“坚持成像品质”，实则被过去定义，错失数码相机趋势'
  - '- 格力/董明珠：战略坚定“造芯/精密制造”，不为短期股价波动朝令夕改'
  - '- 作者实践：OKR制定时“战略坚定是最底层成功要素”，KR必须直接推动O，过程管理量化目标+明确时间节点，团队效率提升50%'
  - '**边界条件**'
  - '- 战略需配套“进入/分配/退出”股权机制：内部不乱才能更好打市场，不存在放之四海而皆准的方案'
  - '- 战略探索不可被战术勤奋替代：动脑累、探索怕，但只有战略突破带来真正增长'
  - '- 早期创业团队：先跑通MVP验证商业模式，再上升到战略层面，不要一上来就谈宏大战略'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  - paper: docs/202301-02/20230207_06.md
    role: improve
  excerpts:
  - 战略目的是让你能获得优势或者获得相对优势。
  - 战略应该形成一种自始至终的指导原则。
  - 战略需要发挥你的禀赋。你要是跟老乡鸡、南城香比卫生、标准化、品牌力，那就错了。
  - 比如读书群里有人说他的战略是：帮助一万个人赚到钱。这就是对战略的一个巨大误解。因为帮助一万人赚到钱，这是一个目标，它不是战略。
  - 战略，既不是一朝一夕的事，也不是朝令夕改的事。战略，是三会一层要做的事。
  - 你看，美国所有的行动，都是遵守一个战略指导原则，就是让苏联增加成本。这叫做'强加成本'战略。
  - 战略坚定是最底层的成功要素…作为 KR 的负责人，重点关注的是 O，不是 KR。KR 一定要能对 O 产生直接推动…过程管理只要有了'量化的目标'和'明确的时间节点'，团队效率至少提升50%。
- 'no': 5
  name: 信息差生意 —— 钱藏在身边被忽视的细节里
  points:
  - '**为什么需要这个概念？**'
  - '- 网上公开的“月入X万项目”基本已过时、红利期结束，真正的机会藏在生活细节的信息不对称中'
  - '- 普通人缺的不是执行力，而是“发现身边赚钱机会”的敏锐度和“闷声发大财”的纪律性'
  - '- 信息差不等于骗局，而是“别人不知道的路径/渠道/供需匹配”，合法合规且可持续'
  - '**核心定义**'
  - '- 信息差生意：利用认知差、渠道差、时机差，在供需双方之间搭建高效连接，赚取“认知溢价”'
  - '- 核心特征：先有闷声发大财，网上说赚钱的基本过时；机会源于观察身边，而非刷网课'
  - '- 三大要素：发现被忽视的需求、找到低成本供给、建立信任闭环'
  - '**关键性质**'
  - '- 隐蔽性：苏州只做广告牌的图文店开70家、四线城市烤面筋月入2万+、大学生朋友圈卖螃蟹年入1.2万，行业看似不起眼实则现金流极健康'
  - '- 刚需性：广告牌是商家刚需、烤面筋是夜宵刚需、螃蟹是节令礼品刚需，非刚需链条太长推不动'
  - '- 可复制性：模式标准化后可跨城复制（如广告牌图文店）、可规模化（如烤面筋加三轮车）'
  - '**典型例子**'
  - '- AO图文：专做广告牌，单价3-5千，月15块牌=月入7万+，已开70家直营店'
  - '- 烤面筋三轮车：四线城市，日卖600串，日入2000+，节假日更高，无房租压力'
  - '- 朋友圈卖螃蟹：大学生利用同学圈层信任，季节性爆发月入2-3万，年均1.2万，零成本启动'
  - '**边界条件**'
  - '- 反向操作也不能保证赚钱：“赚钱方式千差万别，亏钱方式殊途同归”，规避亏钱模式≠自动赚钱'
  - '- 依赖持续观察力：一旦行业信息透明化（如美团外卖普及），信息差红利消失，需持续挖掘新缝隙'
  - '- 需合规合法：灰色地带信息差（如倒号、钻平台漏洞）风险极高，长期主义只做白白的信息差'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 身边赚钱的机会其实还是很多的，只是你没有发现，这个就是大家所说的信息差。
  - 先有闷声发大财，网上说做什么小项目一个月可以赚多少钱的，基本是已经过时了。
  - 对于赚钱这件事，真的需要你从身边挖掘发现，而不是在网上听谁说赚钱。
  - 苏州有一家叫 ao 图文的，就只做广告牌子，现在开了有 70 家店……一块牌子 3000-5000 块，生意稳定……
  - 四线城市做烤面筋……一天卖 600 串左右，一天的收入在 2000 多，节假日更多。
  - 如果你要问，那我反着来，就能保证赚钱吗？我也希望可以，但很不幸不能，无论多厉害的高手，亏钱是赚钱路上的不可缺少的部分。
- 'no': 6
  name: 正反馈驱动热爱 —— 懒惰是“没正反馈”，不爱是“不够多”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人陷入“懒惰→没结果→更懒”的死循环，误以为是自律性差，实则是正反馈机制缺失'
  - '- “热爱”不是前置条件，而是大量行动后获得正反馈的副产品；等热爱再行动，永远不行动'
  - '- 需要一个可操作的破局路径：要么找真热爱，要么纯为钱冲（不别扭、不内耗）'
  - '**核心定义**'
  - '- 懒惰本质 = 未获得正反馈；正反馈来源 = 做得够多；做得不够多核心原因 = 不够喜欢/不够想赚钱/不够缺钱'
  - '- 正反馈闭环：行动 → 结果（钱/赞/成长） → 多巴胺 → 更想行动 → 更多结果'
  - '- 两个突破口：1) 尽快找到真正热爱的事（内驱力）；2) 找不到就纯粹为钱冲，承认“为了钱”无需羞耻'
  - '**关键性质**'
  - '- 可制造性：优秀推销员每天先卖易卖品给优质客户，人为制造“早早赢一次”的正反馈，撬动全天状态'
  - '- 门槛递降：开始最难（冷启动无反馈），一旦跑通最小正反馈循环，后续边际成本递减'
  - '- 反脆弱性：纯为钱冲的人反而更稳定，因为钱是最标准、最即时、最不掺杂情绪的正反馈'
  - '**典型例子**'
  - '- 作者自己：从“不敢发朋友圈卖货”到“日更写作565天”，靠每篇文章的阅读/变现正反馈坚持下来'
  - '- 宝妈微信号：4个月加4000好友，因执行力强被收购，执行力本身因正反馈（卖号赚钱）而被强化'
  - '- 老虎伍兹反面教材：失去“不可战胜”信念后，正反馈循环断裂，技术未退步但成绩崩盘'
  - '**边界条件**'
  - '- 正反馈必须真实：虚假数据、刷单刷赞制造的伪正反馈，潜意识识别后会加速崩溃'
  - '- 避免“战术勤奋掩盖战略懒惰”：天天忙碌但无关键指标突破，是假正反馈，需定期用5WHY复盘'
  - '- 生存压力过大时：无法等待正反馈自然生成，必须强制制造“微小必赢”场景（如日更、打卡）启动循环'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  - paper: docs/202301-02/20230207_01.md
    role: improve
  excerpts:
  - 为什么会有懒惰这个东西？本质上，就是没拿到正反馈，如果你每天做的事都有大量的钱进账，比如一天一万利润揣兜里，你说你会懒？你比谁都积极。
  - 但是最核心的是，你不够喜欢。
  - 你不够想，不够想赚钱，不够缺钱。这里有两个突破口，一个是尽快找到自己到底热爱，另一个，找不到也没关系，就是为了钱冲，不别扭，不内耗。
  - 当自己内心很怂、不自信的时候，你需要回顾下自己成功的经历，唤醒自己的成功体验。
  - 比如，一些优秀的推销员，在开展一天的工作时，会先去找一些优质的客户，或者推销一些容易卖的产品，通过这种方式去制造成功体验。
- 'no': 7
  name: 优雅亏大钱三步骤（反讽式风控清单）
  points:
  - '**为什么需要这个概念？**'
  - '- 正面教人“如何赚钱”往往听不进、记不住、执行偏；反面教人“如何必亏”，触动痛点、倒逼自查、直击人性弱点'
  - '- 创业者最易犯的三类死穴：选错赛道（贪天才生意）、加杠杆/重仓（赌一把）、不止损（赌徒心理），需建立负面清单'
  - '- 亏钱是赚钱路上不可缺少的学费，但“优雅亏大钱”是主动送死，必须规避'
  - '**核心定义**'
  - '- 步骤一·做容易亏钱的事：选“少数人能赚/我看不懂”的项目，自作对手方，除非天赋异禀否则大概率亏钱'
  - '- 步骤二·投入足够多的钱：带着一夜暴富追求，配上破釜沉舟气势，一次上大仓位、最好加杠杆/高频交易'
  - '- 步骤三·坚持到底：赚钱不止盈、亏钱不止损，死扛到底，确保真的亏大钱、亏彻底'
  - '**关键性质**'
  - '- 普适性：股市、币圈、创业、赌博、甚至职场选赛道，通杀所有“想赚快钱”的场景'
  - '- 反讽力：把“止盈止损、轻仓试错、做懂的事”包装成“亏钱秘籍”，读完背脊发凉、刻骨铭心'
  - '- 承认亏钱常态：即便严格反着做（避开三步），也不保证赚钱，因为“赚钱方式千差万别，亏钱方式殊途同归”'
  - '**典型例子**'
  - '- 作者自述：创业10年失败4次、负债百万，最终靠自媒体上岸，教训全在“非刚需、链条太长、不止损”上'
  - '- 社群案例：无数人追风口、加杠杆、不止损，最终清仓离场，验证了三步骤的杀伤力'
  - '- 李靖观点：高手也会亏钱，舍弃亏钱=舍弃赚钱，关键是“小亏试错、大赢放大”，而非“零亏损”'
  - '**边界条件**'
  - '- 仅作风控清单：不能作为行动指南（反着做不等于能赢），必须配合正向方法论（MVP、刚需、止损）使用'
  - '- 适用于非对称收益场景：上限无限、下限有底（如买期权/创业），不适用于下限无底场景（如卖期权/高杠杆做空）'
  - '- 需区分“试错亏损”与“本金亏损”：前者是买教训（可控预算），后者是赌命（不可逆），三步骤描述的是后者'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 我的方案可以分成三个步骤：1、做容易亏钱的事。2、投入足够多的钱。3、坚持到底。
  - 坚定选择只有少数人能够赚钱的项目。这样，除非天赋异禀，否则你大概率就是一个亏钱的人。
  - 要带着一夜暴富的追求，伴随破釜沉舟的气势，配上一往无前的决断（XX 跌很多这种事情不可能发生！），一次上大仓位，最好配上杠杆。
  - 这一步叫：坚持到底，决不退出。赚钱了不止盈，亏钱了不止损。只有这样才能确保真的亏大钱。
  - 如果你要问，那我反着来，就能保证赚钱吗？我也希望可以，但很不幸不能，无论多厉害的高手，亏钱是赚钱路上的不可缺少的部分。
  - 毕竟，赚钱的方式千差万别，亏钱的方式殊途同归。
- 'no': 8
  name: 利他等于利己 —— 分享越多、蛋糕越大
  points:
  - '**为什么需要这个概念？**'
  - '- 传统稀缺思维认为“分享经验=培养竞争对手=分蛋糕”，导致藏私、封闭、错失协作机会'
  - '- 互联网时代边际成本趋零、市场无限大，知识/信息/渠道的分享反而能召唤更多同频者、回流更高质量资源'
  - '- 建立“利他=利己”认知，是从“独行快”跨越到“众行远”的关键心法'
  - '**核心定义**'
  - '- 利他即利己：乐于分享好信息、好方法、好资源不藏私，不会因竞争受损，反而因分享获得更大回报和更多信息回流'
  - '- 核心逻辑：市场足够大（蛋糕分不完）、稀缺的是信息（分享换信息最划算）、信任源于公开（藏私反而失信任）'
  - '- 实践准则：把社群帖子当“奏折”看、把经验当“教案”教、把资源当“连接器”连'
  - '**关键性质**'
  - '- 复利效应：分享一次，可能触达成百上千人，其中少数人成为合伙人/客户/朋友，长期价值远超一次性变现'
  - '- 筛选机制：公开分享自带过滤器，同频者留下、异频者离开，极低成本完成高质量社交筛选'
  - '- 反脆弱：独家秘籍一旦泄露归零，公开体系越分享越完善、越难被复制（如可口可乐配方公开也无人能复制其品牌护城河）'
  - '**典型例子**'
  - '- 作者实践：持续在社群分享实操复盘，反而获得更多优质项目线索、合伙人推荐、付费咨询邀约'
  - '- 生财有术社群：鼓励“发帖赚钱、回帖赚钱”，知识公开流通催生出大量商业合作与IP孵化'
  - '- 开源软件：Linux、React、Vue等核心基础设施完全开源，反而构建了最庞大的商业生态与人才护城河'
  - '**边界条件**'
  - '- 核心商业机密（算法核心参数、独家供应链渠道、未公开专利）不在分享范围，仅分享“方法论/复盘/认知”'
  - '- 分享≠无偿付出：高质量内容可收费、社群可付费、咨询可按小时收费，利他前提是自利可持续'
  - '- 避免“伪利他”：带私货推广、收割韭菜式分享，长期会被市场识别并反噬，真利他必是真价值输出'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  excerpts:
  - 利他等于利己，越分享越幸运。
  - 曾有朋友反问我，你就不怕你把赚钱的信息分享出去，别人抢了你的蛋糕？…事实证明，你越利他，你得到的回报会更大。现在最稀缺的就是信息…这市场这么大，蛋糕分的完吗？
  - 商业英雄只是平台以及市场红利的产物。今天所有的大佬，都是在某一个时间，抓到了某一个市场红利，再匹以执行力，就赚到了第一桶金。
- 'no': 9
  name: 选品四步法 —— 从蓝海定位到微创新差异化的爆款打造范式
  points:
  - '**为什么需要这个概念？**'
  - '- 90%以上跨境电商新手死于选品：不会找蓝海、不会解决流量转化、不懂品牌溢价、盲目搞原创创新'
  - '- 选品即运营：好选品在确定产品时就已解决流量与转化，而非事后靠运营硬推'
  - '- 需一套从市场选择到产品差异化的标准化范式，追求确定性而非彩票式爆单'
  - '**核心定义**'
  - '- 选品四步法：第一步【找蓝海】筛选市场/平台/方向 → 第二步【走捷径】合规平替解决流量转化 → 第三步【加光环】空壳品牌获溢价复购 → 第四步【微创新】材质套利打造护城河延长红利'
  - '- 蓝海分层：最蓝(小语种发达国+准入门槛)→次蓝(发达国头部平台)→微蓝(新平台/新开放)→不蓝(所有低价平台)'
  - '- 蓝海方向：比品类更高维的垂直产品方向(如真皮/科技材料)，自带精准搜索流量'
  - '**关键性质**'
  - '- 合规平替：以90%体验、1/5甚至1/10价格对标明星产品/高端材质，同时拥有流量捷径与转化捷径，客单净利可超百元'
  - '- 空壳品牌：抢注国外未注册类目品牌或策划虚构外国品牌故事，在东欧卖日本品牌、在美国卖欧洲品牌，本土查不到、故事随便编，可达10%复购/30%净利提升'
  - '- 微创新=不创新：新手不搞原创设计/痛点迭代，基于大标品做材质升级(头层皮换二层皮/帆布升真皮)+热点嫁接，延长红利期'
  - '- 追求确定性：成功老板抓确定性，只做已验证模型；新手避开低价平台(Temu/虾皮/速卖通)与TK“货找人”彩票逻辑'
  - '**典型例子**'
  - '- 日本乐天真皮鞋类：通过海关关税壁垒筛选出真皮方向，头层皮换二层皮成本降2/3，打原价1/10价格仍净利200+元'
  - '- Gore-Tex平替冲锋衣：39.99美元鹤立鸡群于100-200美元首页SKU中，功能相同、足够便宜、搜goretex即展示'
  - '- 速卖通空壳品牌：垄断JEEP/骆驼等品牌鞋服销售，抢注国外品牌跨类目做新品，复制全系产品'
  - '- 独立站模式更迭：FB+Shopify杂货铺已死，SEO/Google Shopping“商品找人”流量结合蓝海选品的玩家当前最易赚钱'
  - '**边界条件**'
  - '- 依赖蓝海判断力：海关壁垒/平台搬运/材质升级等发现蓝海方向的方法需持续迭代'
  - '- 平替必须合规：有自有品牌、无侵权风险，才能大胆投放竞品品牌词广告'
  - '- 空壳品牌仅有特定窗口期：平台收紧/品牌方维权时失效，非长期护城河'
  - '- 微创新非原创：不适合无专业积淀的新手做原创设计，仅限升级式/热点嫁接式差异化'
  - '- 平台选择底层逻辑：听自己的，懂流量与转化两个底层判断依据，讲不出所以然的大概率是镰刀'
  sources:
  - paper: docs/202301-02/20230207_02.md
    role: origin
  excerpts:
  - 本文将选品从底层往上分为四层：1.套利 2.流量&转化 3.模式 4.品&品类。
  - 第一步【找蓝海】：蓝海市场、蓝海平台、蓝海产品方向
  - 只要你有选蓝海市场蓝海平台的意识，你就已经超过了 90%跨境小白和新手。
  - 第二步【走捷径】：流量捷径、转化捷径
  - 好的选品，在确定具体产品的时候，就已经确定引流方法，和转化方法（卖点）。
  - 合规平替不仅可以平替具体明星产品，也可以平替高端材质，这两种做产品的方向都是自带流量的。
  - 第三步【加光环】：快速获得品牌力、溢价、复购
  - 我们做一个日本品牌，在东欧做一个日本品牌，在美国做一个欧洲或者日本品牌，这都是可行的，本土客户查不到，故事随便你说。
  - 第四步【微创新】：获得更长的红利期
  - 微创新其实就是不创新。新手适合基于大标品，去做升级式的和热点嫁接式的差异化产品。
  - 成功老板都是抓确定性，只有韭菜财迷爱抓彩票，我接触的大卖，没有一个主战场在 tk。
- 'no': 10
  name: 趋势判断与机会窗口 —— 从疫情类比到平台周期的红利捕捉框架
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人创业最怕“错过风口、追错赛道”，需要一套“以史为鉴+数据验证”的趋势判断方法论'
  - '- 宏观确定性窗口(疫情平稳期) + 平台演进周期规律(淘系四阶段) + 热点响应速度(技术基建) = 立体化机会捕捉能力'
  - '- 素材提供了从疫情数据推演、旅游健康数据验证、美团电商冷启动、ChatGPT镜像站套利、TEMU低价标品判断等完整实证链条'
  - '**核心定义**'
  - '- 确定性窗口期：通过香港疫情类比推演大陆，首波感染后2-3月平稳期=黄金入场窗，旅游/健康/餐饮三大刚需优先复苏'
  - '- 平台电商四周期：铺货期(重SKU/铺货红利)→动销期(重动销率/转化)→精细化期(重ROI/合规/原创)→玩趋势期(重IP/直播/品牌)，底层逻辑相通'
  - '- 热点套利技术栈：预置域名/公众号/小程序/API/镜像站架构 → 热点爆发十分钟内接入上线 → 抢占搜索流量首位 → 消耗50万+请求验证'
  - '- SEO长尾福利：SEO思维发布内容3-5年后仍享稳定流量，<200篇内容大半月不更新仍日有咨询'
  - '- 信息差生意：身边被忽视的赚钱机会(AO图文/烤面筋/卖螃蟹)，网上公开的已过时，闷声发大财'
  - '**关键性质**'
  - '- 疫情类比强时效性：2023春天窗口仅3-6个月，错过等于放弃全年最大红利'
  - '- 平台周期相通性：视频号/抖音/美团/TEMU演进何其相似，可用淘系经验预判新平台红利期'
  - '- 技术基建决定响应速度：ChatGPT热度起十几分钟写代码成全网首个集成公众号，无基建则零机会'
  - '- 反期望：逆向操作规避亏钱步骤也不保赢，亏钱是赚钱路上必修课(赚钱方式千差万别，亏钱方式殊途同归)'
  - '**典型例子**'
  - '- 旅游复苏：春节国内游3亿人次恢复88.6%，出境机票涨258%、入境预订涨632%、国际酒店涨177%'
  - '- 健康带货：诺特兰德维生素连续两月抖音直播单品销量第一，多品牌抖音销量过亿'
  - '- 美团电商：8月末发现机会<2个月跑通扩展30店，单店月利6k-12k(零运营)，首店MVP仅80元'
  - '- ChatGPT套利：热度起十几分钟注册公众号/接入API/套娃镜像站/包小程序，消耗近50万请求'
  - '- TEMU判断：小二预留10%利润，标品报价超1688即视为无诚意压价，议价空间极小，须侧重非标品'
  - '- 身边信息差：苏州AO图文专做广告牌70店月入7万+、四线城烤面筋日入2000+、大学生朋友圈卖蟹年均1.2万'
  - '**边界条件**'
  - '- 窗口期依赖类比准确性：大陆疫情节奏偏离香港则判断失效'
  - '- 平台周期预判仅供参考：政策/算法/竞争格局变化可能打破历史规律'
  - '- 热点套利需技术门槛：非技术背景者需合作或购买成熟基建，否则只能蹭SEO长尾流量'
  - '- 信息差具有时效性：一旦透明化(如美团普及)红利消失，需持续观察挖掘新缝隙'
  - '- Web3极早期高风险：勿丢场外赚钱能力、小成本试错、不玩杠杆合约、人声鼎沸必跑、保护资产'
  sources:
  - paper: docs/202301-02/20230207_11.md
    role: origin
  - paper: docs/202301-02/20230207_01.md
    role: improve
  - paper: docs/202301-02/20230207_06.md
    role: improve
  - paper: docs/202301-02/20230207_07.md
    role: improve
  excerpts:
  - 最近 3~6 个月，是比较确定的疫情平稳期，之后才会迎来第二波疫情的峰值。
  - 至少 2023 年的春天，会是一个比较确定的稳定期。
  - 从平台电商的历史出发，我把美团的发展分为了四个周期：铺货、动销、精细化、玩趋势。
  - 所有平台演变的底层逻辑是相通的，刚过去的视频号...与抖音的历史进程何其相似。美团电商与淘系的发展也将大相径庭。
  - 第一家店跑通最小MVP仅仅花费了80元...截止到10月美团电商全类目商家仅2000多家，我们应该是百货类目入驻的全国前300名。
  - 看了这些数据后，出于职业嗅觉…所以我第一时间去注册了公众号：ChatGPT 中文版
  - 我又花了十几分钟，写了一百多行代码，成了全网首个把'ChatGPT'集成到公众号的人
  - 目前消耗接近 50w 次请求
  - 之前我也跟小二聊过，他们会给商家预留10%左右的利润空间，对商家中报价超过1688同款比较多的，直接视为没有诚意，会减少跟这类商家的合作。
  - 身边赚钱的机会其实还是很多的，只是你没有发现，这个就是大家所说的信息差。
  - 先有闷声发大财，网上说做什么小项目一个月可以赚多少钱的，基本是已经过时了。
  - 现在的web3还非常早期，对普通人非常友好。...时刻牢记20字箴言：见好就收，有利必跑，狠心出货，切勿幻想，变现为王。
- 'no': 11
  name: 招商加盟与规模复制 —— 从单店验证到四级加盟模式的扩张体系
  points:
  - '**为什么需要这个概念？**'
  - '- 多数创业者急于扩张却忽视单店模型验证，导致加盟商亏损、品牌口碑崩塌、法律纠纷不断'
  - '- 需建立“先跑通单店、再验证区域、再开放加盟、再设计股权顶层”的标准化扩张体系'
  - '- 素材对比蜜雪冰城(加盟模式年利19亿)与奈雪的茶(直营模式亏1.5亿)，揭示加盟模式在餐饮/零售中的优势'
  - '**核心定义**'
  - '- 招商加盟四级模式：轻量级(卖技术/卖料包)→中量级(卖设备/卖服务)→重量级(卖品牌)→魔鬼级(卖特许权：可资产转移继承，最难实现)'
  - '- 健康单店模型新标准(替代过时‘两店一年’)：1)各种门店模型测算到位 2)单店财务模型健康 3)实现一定范围内区域模型验证 4)该区域模型复制性与财务模型达标'
  - '- 股权顶层设计四要素：顶层控制权(有操盘能力有责任心的好人)→进入机制(资金型溢价入/资源型对赌入/技术型专利入)→分配机制(静态+动态调整)→退出机制(时间约束/回购原则价格)'
  - '- 1+1+1项目矩阵：1个在盈利、1个在开发、1个做知识付费，实现现金流/储备/溢价良性循环，项目生命周期2-6个月'
  - '**关键性质**'
  - '- 单店盈利是前提：未跑通单店模型直接加盟属收割行为；蜜雪/喜茶验证加盟利润能力远超直营'
  - '- 区域合伙人(城市管家)：平台提供房源库/配房人员/带看流程，合伙人只维护用户，如铺铁路网各站快速通行'
  - '- 人海战术对抗不确定性：视频号店群最少5个以上、矩阵思维；抖音带货怼量增加爆单概率(点赞>500仅10个、大部分个位数)'
  - '- 完成比完美重要：美团电商首店MVP仅80元跑通，快速迭代优于完美策划'
  - '**典型例子**'
  - '- 蜜雪冰城vs奈雪：加盟模式21年利润19亿VS直营亏损1.5亿，加盟品牌盈利能力显著更高'
  - '- 胖龟找房：一年8家门店/34店中店/287会员/104.7万营收→迭代后月入15w，城市管家模式扩张至杭州/上海/深圳'
  - '- 视频号无货源店群：7店日营业额7858元/单店均1122元/毛利30%/单店月利1W/10店月入10W+达人爆单额外几万'
  - '- 抖音矩阵带货：保证质量前提下怼量发视频，单号纯发视频不开播累计带货10万+，爆单概率靠量堆'
  - '- 股权设计实操：儿童体能项目启动资金200万，自评互评定岗位权重7:2:1/时间投入6:3:1，配套一致行动权/期权池/回购权等合同规范'
  - '**边界条件**'
  - '- 加盟非万能药：不同模式对品牌方要求不同，总部准备工作不同，魔鬼级特许权最难且非必需'
  - '- 需配套合同规范：初步股权比例仅起点，须搭配一致行动权/期权池/分红/回购/优先清算/领售权等完整法律体系'
  - '- 警惕收割式加盟：无单店验证、无区域复制、仅收加盟费/设备费/料包费的模式大概率是坑'
  - '- 融资避坑：识别收费的骗子公司，最好有人推荐、不盲目缴费'
  - '- 项目生命周期：娱乐直播类2-6个月，必须具备持续开发新项目能力(不下牌桌)而非依赖单一IP'
  sources:
  - paper: docs/202301-02/20230207_11.md
    role: origin
  excerpts:
  - 按照品牌方操作的难度，加盟模式一共分为四个级别六种类型：轻量级、中量级、重量级和魔鬼级。
  - 魔鬼级的加盟是最难实现的一种，我称之为卖特许权。说白了，就是加盟了某个品牌之后，这个品牌的特许权是可以作为资产进行转移和继承的。
  - 我们提出了一个最新的标准：1）各种门店模型要测算到位；2）单店模型的财务模型要健康；3）要实现一定范围内的区域模型验证；4）该区域模型的复制性和财务模型要达标。
  - 对比即将上市的蜜雪冰城和已经上市的奈雪的茶（21年19亿利润 VS 亏损1.5亿），大概能代表加盟模式和直营模式的现状...加盟品牌的利润能力要比直营品牌高非常非常多。
  - 有模式，我称之为1+1+1，1个在盈利，1个在开发，1个在知识付费
  - 在保证视频质量的前提下，量怼的越多，爆单的概率肯定就越大
  - 做股权顶层设计时考虑的核心因素，还是顶层控制权、进入机制、分配机制、退出机制。
- 'no': 12
  name: 内容IP体系构建 —— 从母题地基到千万营收模型的完整方法论
  points:
  - '**为什么需要这个概念？**'
  - '- 多数内容创作者陷入“追热点/靠天道酬勤/全盘复刻他人路径”三大误区，缺乏系统性IP构建框架'
  - '- 素材提供了从零到年入千万的IP打造五步法，兼具理论深度(母题/基因/身份/观感/资产)与实操细节(独创理论五法/内容体系五件套/营收阶梯)'
  - '- 原创性提出“IP是少数人的领地，不要走别人路径”、“坚持须建立在清晰前景+两周可验证变现基础上”等反幸存者偏差认知'
  - '**核心定义**'
  - '- IP地基12345：1个母题(文化原型锚点护城河) + 2层基因(文化沉淀风骨+商业持续变现) + 3重身份(工具/人/神) + 4级观感(松弛/对象/获得/氛围)
    + 5份资产(用户/版权/实物/文化/生态)'
  - '- 独创理论五大生成法：理想解法(TRIZ六步推导)/节点法(服务流程共性节点/水利私域理论)/词根法(垂类优势词)/母题法(延展结合)/核心法(提取核心点)'
  - '- 内容体系五件套：四级内容架构 + 一套独有理论 + 一个十年故事(5-8分钟中视频规范) + 一份百问百答 + 一份点线面打通路径(品项态：产品-项目-产业群组)'
  - '- 千万营收模型：年会员(标品0交付)→私教3w/3月→私董会5-20w→合伙/徒弟20w-100w→图书(一书一码/联合出品人)→课程直播(199小课/双播月400w)→自媒体(爆款+五方向配比)→咨询1K+/h→轻顾问3w起/重顾问20w/年'
  - '- 4近原则：离钱近好变现、离痛点近好卖出、离易用近好留存、离信任近好复购'
  - '**关键性质**'
  - '- 母题≠定位：定位非从内容出发无法细化延展做不起护城河；母题下有百变题型可模块化标准化解法'
  - '- 危机再分配效应：用户感危机时，解决危机者获再分配话语权，IP从“神”身份获得护城河'
  - '- 用户资产幂次效应：品牌势能积累的用户资产边界更广、幂次效应更强、IP多次觉醒可能，优于流量堆砌'
  - '- 文化溢价实践：龙飞律师松弛感破千万粉、女性安全内容升级案例分析文化溢价、穿搭IP线上发布会千万-亿流水、李子柒走文化资产路线'
  - '- 直播1+1+1模式：低成本直播课→剪成小课→切条短视频，一天两播单场6w月营收400w'
  - '- 拒绝天道酬勤：单靠长期努力无正反馈基本归零，坚持必须基于清晰前景+两周可验证变现'
  - '- 拒绝全盘复刻：直接复制他人路径产生路径依赖遗漏关键情境，应拆解多模型取长补短有机结合'
  - '**典型例子**'
  - '- 水利私域理论：为年费50-100w私域顾问设计，第一步重构组织/商业模型，后续以水为喻(水系/工程/循环)串联成独创理论'
  - '- 十年故事制作：前后对比(新手村→大佬村)、关键时刻标注(低谷/荣耀/转折)、文案表达清晰目的明确契机合理、音乐体现品位'
  - '- 星云IP计划：20个S级IP、年2亿盘子、北京版权局战略试点、S级基因为核心产业群组(理论/执行/变现/IP/政府/人才六端齐备)'
  - '- 反向发帖：微头条表扬被全网批评对象(李少莉)，<300字引发谩骂赚400+，核心四字：争议、共鸣'
  - '**边界条件**'
  - '- 母题识别难度大：需深厚文化积淀与行业洞察，非一日可成'
  - '- 独创理论生成需实战沉淀：理想解法/节点法等依赖大量服务案例与复盘积累'
  - '- 营收模型非全照搬：需根据自身资源禀赋选择匹配阶梯，如无咨询能力勿强上重顾问'
  - '- 文化溢价难量化：风骨体面与变现并行需长期验证，短期ROI可能不如纯带货'
  - '- 星云计划非个人可复制：头部玩家聚合生态需顶级资源整合能力，普通创作者可借鉴框架而非模仿规模'
