  name: 选品即定人群找需求 —— 先锁定「谁要」，再决定「卖什么」
  points:
  - '**为什么需要这个概念？**'
  - '- 盲目选品容易陷入同质化竞争，导致视频流量差、转化低'
  - '- 不同人群的需求差异巨大，只有精准匹配才能提高成交率'
  - '- 从人群需求出发选品，是低成本获取精准流量的核心方法'
  - '**核心定义**'
  - '- 选品的核心原则：通过定义目标人群标签并挖掘该人群的特定需求来选择品类'
  - '- 优先选择垂直需求品（特定人群的刚需），而非通用品（所有人的需求）'
  - '**关键性质**'
  - '- 人群导向性：选品从目标人群标签出发，而非从产品本身出发'
  - '- 需求垂直性：优先选择垂直需求而非通用需求'
  - '- 价格次要性：对目标人群而言，需求匹配度比价格更重要'
  - '**典型例子**'
  - '- 视频号用户以中老年人+下沉城市为主，其特定需求是''身体好、重返青春''，因此运动锻炼类和保养类产品优先考虑'
  - '- 服装、食品等通用品因需求普遍，不作为第一梯队选择'
  - '**边界条件**'
  - '- 通用品并非不能做，但需要更多考虑如何通过视频、直播传递产品特色和优势'
  - '- 选品后还需结合抖音/快手/拼多多的在做人数量判断蓝海程度，做的人多则谨慎考虑'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 选品其实就是定人群然后找需求，大家能理解这句话，就很好选品了。
  - 年纪大了就想身体好，年纪大了就想重返青春，所以运动锻炼类的品和有关保养方面的品，都可以考虑。
  - 这种需求过于普通，这是所有人的需求，而不是我们目标人群的特定需求，所以不在我考虑的第一梯队里面。
  - 我个人的想法……价格什么的反而不是特别的重要，重点在于我觉得这玩意对我有用。
