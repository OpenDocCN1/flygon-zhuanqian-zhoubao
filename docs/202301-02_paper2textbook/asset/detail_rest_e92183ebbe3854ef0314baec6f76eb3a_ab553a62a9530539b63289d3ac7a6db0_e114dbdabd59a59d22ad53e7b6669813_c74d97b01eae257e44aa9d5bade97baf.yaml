learning_targets:
- 理解「心金文案」的双重属性：既能吸金（商业变现）又能深入人心（情感共鸣）
- 掌握写文案前的「三重思考」框架：明确宏观/微观目的、洞察目标受众、适配发布平台特性
- 熟练运用「富兰克林复写法」（看-关-写-比）精准定位表达薄弱点并通过外部点评优化
- 掌握「共鸣感构建」三维路径：经历共鸣、感受共鸣、价值观共鸣，并理解高能量吸引低能量的底层逻辑
- 建立「输入带动输出」的分级阅读体系：故事类练表达 → 评论类练逻辑 → 商业类练变现套路
- 理解打广告的本质是「放大与筛选」，区分优质软广与垃圾硬广，破除「不敢打广告」的心理卡点
- 掌握「人际关系四象限」与「鱼塘钓鱼」策略：精准识别第4象限（顾及感受）与第2象限（无需顾及）用户，建立精准流量池
- 理解成交依赖「有间隔的重复次数」信任积累法则，掌握前置价值输出、个性展现、信任建设的节奏
- 掌握「打广告无成交四步排查法」：查用户精准度 → 查文案细节 → 查前期铺垫 → 理解曲折坚持长期主义
- 理解销量增长的「从众慕强」复利效应：持续拿结果、迭代产品、获背书，用实力反杀质疑者
concept_map:
- 内容与文案力
- ├── 核心范式：心金文案
- │   ├── 吸金属性（商业变现）
- │   └── 深入人心属性（情感共鸣）
- ├── 前置思维：三重思考
- │   ├── 宏观/微观目的
- │   ├── 目标受众画像
- │   └── 平台特性适配
- ├── 核心方法论
- │   ├── 富兰克林复写法（看-关-写-比+外部点评）
- │   ├── 共鸣感构建法（经历/感受/价值观三维）
- │   ├── 输入带动输出三级阅读法（故事→评论→商业）
- │   ├── 100问练习法（建立认知体系+输出能力）
- │   ├── 三个为什么/A4头脑风暴/多角度思维（深度思考训练）
- │   └── 闪光文件夹/文案素材库（素材积累管理）
- ├── 广告与销售心法
- │   ├── 放大与筛选本质（破除不敢打广告）
- │   ├── 优质软广 vs 垃圾硬广区分
- │   ├── 人际关系四象限（顾及/不顾及决策）
- │   ├── 鱼塘钓鱼精准池策略
- │   ├── 有间隔的重复次数（信任积累法则）
- │   ├── 四步排查法（用户→文案→铺垫→心态）
- │   └── 从众慕强复利效应（销量阶梯拿下质疑者）
- └── 核心定律
- ├── 文案是思维的显化
- ├── 一条文案一个主旨
- ├── 统一风格形成记忆点
- ├── 硬性模仿/套模板局限思维
- ├── 文字掌控力提升信息捕捉与思维层次
- ├── 高质量输入3个月大幅提升思维
- ├── 酒香也怕巷子深（好东西必宣传）
- └── 打扰无关人员=吸引精准客户（本末倒置批判）
life_analogy:
- 想象「文案创作」是一场**精心设计的相亲局**：
- '- **心金文案** = 既要展示硬核条件（房车票/吸金），又要流露真实性格温度（深入人心），缺一不可'
- '- **三重思考** = 相亲前三问：我要结婚还是交友（目的）？对方喜欢什么类型（受众）？在公园见面还是酒吧（平台）？'
- '- **富兰克林复写法** = 反复背诵、模仿偶像的高情商话术，关书自述、对比录音，找出自己「直男/直女」发言的薄弱环节'
- '- **共鸣感构建** = 聊童年趣事（经历共鸣）、吐槽加班心酸（感受共鸣）、谈三观人生（价值观共鸣），层层递进让对方觉得「懂我」'
- '- **输入带动输出** = 先看言情小说练嘴皮子（故事类）→ 看心理学书练逻辑（评论类）→ 看搭讪大师实战笔记（商业类），分级练功'
- '- **打广告 = 发朋友圈官宣恋情**：放大让喜欢你的人更安心，筛选让嫉妒你的人退散；不敢发 = 错失真爱、留住烂桃花（本末倒置）'
- '- **人际四象限/鱼塘钓鱼** = 相亲对象必须是「单身异性」（鱼），不是「已婚同事/发小/长辈」（牛羊长颈鹿）；在动物园相亲怪自己魅力低？'
- '- **有间隔的重复次数** = 从微信聊天→视频通话→见面吃饭→见父母，多次触动、时间沉淀，才能修成正果（成交）'
- '- **四步排查法** = 相亲失败复盘：对象不对（查用户）→ 话术烂（查文案）→ 缘分未到/铺垫少（查铺垫）→ 好饭不怕晚（心态）'
- '- **从众慕强效应** = 刚谈恋爱时亲友质疑「这人行吗？」；结婚、生娃、升职、买房节节胜利，质疑者纷纷转粉「早说这人靠谱！」'
summary:
- concept: 心金文案
  desc: 既能吸金（商业变现）又能深入人心（情感共鸣）的文案范式，文案是思维的显化
- concept: 自嗨式写作
  desc: 沉浸自身局限视角、忽略用户真实需求的错误写作状态，导致朋友圈发再多也无咨询
- concept: 写作前三重思考
  desc: 宏观/微观目的、目标受众画像、平台特性适配——文案不跑题、不自嗨的前置锚点
- concept: 富兰克林复写法
  desc: 看优秀文案→关闭→用自己话重写→对比找薄弱点→请人点评，精准定位表达短板的训练闭环
- concept: 共鸣感构建三维
  desc: 经历共鸣（同款遭遇）→ 感受共鸣（同款情绪）→ 价值观共鸣（同款信仰），高能量吸引低能量
- concept: 输入带动输出三级阅读
  desc: 故事类练表达通畅 → 评论类练逻辑结构 → 商业类练变现套路，踩着巨人肩膀提升思维
- concept: 100问练习法
  desc: 整理行业高频100问，能答自答、不会求教后用自己话写出，同时建立专业认知体系与输出能力
- concept: 打广告本质：放大与筛选
  desc: 放大喜欢者理解与认可，筛选出精准客户剔除无关人员；不打广告=舍弃真正支持者（本末倒置）
- concept: 优质软广 vs 垃圾硬广
  desc: 有趣/激发梦想/克制/真实好评/提供价值=软广；自嗨自夸/制造危害/贩卖焦虑/刷屏/无价值=硬广
- concept: 人际关系四象限
  desc: 按「有无感情」×「有无价值交换」分类：第4象限（亲友/合作方）顾及分组可见，第2象限（泛泛之交）无需顾及可清理
- concept: 鱼塘钓鱼策略
  desc: 精准用户=鱼，随缘好友=牛羊长颈鹿；在动物园钓不到鱼不代表技术烂，得去鱼塘（精准流量池）验证
- concept: 有间隔的重复次数
  desc: 成交取决于用户在不同时间点、不同内容形式下被反复触动的累积次数（3次/10次/30天/100天），广告只是临门一脚
- concept: 前置铺垫三件套
  desc: N篇价值干货 + N条生活朋友圈 + N次活动互动，打广告前完成信任建设，付出不够坦然接受无回报
- concept: 四步排查法
  desc: 1查用户精准度(鱼塘/动物园) 2查文案细节(价值点/信任背书/交付细节) 3查前期铺垫(干货/生活/互动量) 4理解曲折持续努力
- concept: 从众慕强复利效应
  desc: 销量阶梯增长(10→50→100→300→500→1000+)配合产品迭代+大咖背书，围观者心理经历嘲笑→震惊→动摇→付费→后悔，持续拿结果反杀质疑
- concept: 核心定律集
  desc: 文案即思维显化/一条文案一个主旨/统一风格形成记忆点/硬性模仿局限思维/文字掌控力提升思维层次/高质量输入3个月见效/酒香怕巷深/打扰即吸引
exercises:
- 'no': 1
  title: 练习1：心金文案诊断与重写
  contents:
  - 素材：某私域运营者发朋友圈推广《副业入门课》，文案如下：
  - 《大佬带你躺赚！这门课原来999，今天仅需99！名额仅剩10个，手慢无！买了就能月入过万，不信你看我收益截图！》
  - 任务：
  - 1. 从「心金文案」双重属性（吸金/深入人心）角度，诊断该文案的三大核心问题
  - 2. 运用「三重思考」框架，分析该文案在目的、受众、平台适配上的缺失
  - 3. 运用「共鸣感构建」三维路径，重写一条心金文案（字数不限），并在文后标注对应的经历/感受/价值观共鸣点
  - 4. 说明你如何通过「富兰克林复写法」练习这条新文案（素材来源、复写步骤、对比重点、点评渠道）
- 'no': 2
  title: 练习2：精准鱼塘建设与广告排查实战
  contents:
  - 场景：你运营一个「考公上岸笔记」私域号，微信好友2000人（含500大学同学、300前同事、200亲戚、1000陌生加粉），发了3条考公课广告，仅1单成交（买家是陌生粉）。
  - 任务：
  - 1. 用「人际关系四象限」分类你的2000好友，标注哪些需「分组可见」、哪些可「清理/不顾及」、哪些是「精准鱼/鱼苗」
  - 2. 按「四步排查法」依次自查：
  - '   - 用户精准度：你的「鱼塘」在哪？当前池子鱼的比例多少？如何低成本扩充鱼塘？'
  - '   - 文案细节：对照「广告文案自查清单」（初心/价值点/场景/包含/适合人群/价格/服务期/交付/背书/好评），列出你当前文案缺失的5项关键信息'
  - '   - 前期铺垫：过去30天你发了多少篇价值干货/生活圈/互动活动？是否达标？'
  - '   - 心态复盘：面对1单成交，如何用「从众慕强效应」和「有间隔的重复次数」视角重构心态？'
  - 3. 制定未来2周的「前置铺垫+精准引流+广告投放」执行计划表（含每日动作、预期指标）
- 'no': 3
  title: 练习3：输入带动输出——三级阅读与100问落地
  contents:
  - 背景：你决定用3个月系统提升「小红书爆款笔记写作」领域的文案力。
  - 任务：
  - 1. 列出你将阅读的「故事类/评论类/商业类」各3个具体素材来源（账号/书籍/专栏/付费社群），并说明每类素材你重点练习的子能力（如：故事类练「开头钩子/画面感/节奏控制」）
  - 2. 设计你的「文案素材库」分类标签体系（至少3级标签），并规定「每日/每周/每月」的整理与复盘SOP
  - 3. 列出「小红书爆款笔记写作」领域的前20个高频问题（作为100问的起步），并完成前3个问题的「自己回答→求教验证→用自己话重写」闭环演示
  - 4. 结合「三个为什么/A4头脑风暴/多角度思维」三种思维训练法，设计一周7天的每日10分钟思维训练计划（每天练哪种、围绕什么主题、产出什么成果）
  - 5. 预设第3个月末的验收标准：你的文案力提升将体现在哪3个可量化指标上？（如：单篇笔记平均阅读量、转粉率、商单报价等）
- 'no': 4
  title: 练习4：软广设计与信任积累节奏推演
  contents:
  - 任务：为你的「考公上岸笔记」私域号，设计一套「21天信任积累+第22天软广成交」的内容日历。
  - 要求：
  - 1. 21天前置铺垫：每天安排1条价值干货/1条生活人设/1次互动动作（可合并），标注对应「有间隔的重复次数」节奏（如：第1/3/7/14/21天为关键触点）
  - 2. 第22天软广文案：运用「优质软广」标准（有趣/激发梦想/克制/真实好评/提供价值）撰写，并在文后逐条自查「广告文案自查清单」10项细节
  - 3. 设定「分组可见」策略：根据四象限，列出需屏蔽的标签组、需私发的重点人名单、公开可见的预期触达人数
  - 4. 预案：若第22天广告发出后24小时0成交，按「四步排查法」写出具体排查动作清单（每步至少3个可执行动作）
  - 5. 反思：该日历设计中，哪些环节体现了「酒香也怕巷子深」、哪些体现了「打扰无关人员=吸引精准客户」？
