docs/202301-02/HfJEd0huioyShvxowVfcOMQYnHb.md: '# 心理卡点：不敢打广告，打完广告不出单好自闭，怎么办？  > 来源：[https://mkfwp3u79v.feishu.cn/docx/HfJEd0huioyShvxowVfcOMQYnHb](https://mkfwp3u79v.feishu.cn/docx/HfJEd0huioyShvxowVfcOMQYnHb)  最近和一些朋友聊天，发现许多做自媒体的新手朋友，对于打广告，都有卡点。  包括不敢打广告，怕打扰好友，怕被人屏蔽拉黑。  以及不会打广告，不知道怎么写文案，不知道怎样配图效果才最好。  还有打了广告后没出单，就觉得自己好没用，自闭。  ![](img/f11badeffcc97eadb2d348869b0ac8e8.png)  看到大家对于打广告这块，是有挺多问题的，那我这个过来人，就来分享一下，如何破除打广告的一些认知和心态的卡点吧~  #
