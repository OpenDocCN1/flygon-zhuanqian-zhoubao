docs/202301-02/CZPydiVmgo2odMx0nWecf3DTn6e.md: '# 「抖音SEO」2天线下大课圆满结束  > 来源：[https://bchje44bsl.feishu.cn/docx/CZPydiVmgo2odMx0nWecf3DTn6e](https://bchje44bsl.feishu.cn/docx/CZPydiVmgo2odMx0nWecf3DTn6e)  很荣幸第一次与「生财有术」合作举办的「抖音SEO陪跑计划」，两天线下课圆满结束，这次效果很好，当场就有老板出了结果！  ![](img/526aba23ded153096b85399e46626848.png)  在我们历史的培训中，学员最快的记录是凌晨开始做，当天晚上出结果，用时18个小时。  然而这次线下课直接突破了记录，结果当场就有老板出结果了！只用了不到8个小时的时间，流量直接起飞。这位老板是做留学的业务，大家都知道留学的流量有多贵吧。  当时的情况是这样的，第二天线下课快结束的时候，我问了一下在场的各位老板，还有没有什么疑问。  有一位做留学业务的老板站出来，问了在场的各位老板：早上做的任务，大家有出结果吗？有没有人反馈一下。  然后接着说：如果大家没有的话，我有一个效果要'
docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md: '# 卖空气，需求分析与做局盈利！  > 来源：[https://szzs4fdjd8.feishu.cn/docx/DNGrdODFBowfk2xwkNCc5GGSnRd](https://szzs4fdjd8.feishu.cn/docx/DNGrdODFBowfk2xwkNCc5GGSnRd)  *   分享人：@小千哥  *   日期：2023
  年 1 月 9 日  ## 开场白  大家好我是小千，老圈友了，简单介绍一下吧：初一辍学,自学编程,未成年时App盈利百万！  比较喜欢研究小而暴利的产品，经历了移动互联网，淘客，私域流量。最近刚失业，目前在调研海外软件尝试入局，难得有空写一篇文章与大家分享卖空气的基本思维。.  多年前写过一篇精华帖：https://t.zsxq.com/097zNVqZG  放心阅读，这不是一篇代码文章，文中只会略微涉及编程知识  #
  靠近用户编程  很多人学编程，学了几天都不知道在学啥、不知道有啥用  甚至学了好久，才发现学的是“后台开发”  “后台开发”离用户就更远了，但这是打工标配技术  好多程序员，只会写代码，但不知道做什么  无法站在真正的用'
docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md: '# 线上美业，不到2万成本到变现过百万  > 来源：[https://ancab4z106.feishu.cn/docx/E1WGd70YLoaHGfxAYJTc4WoFnsd](https://ancab4z106.feishu.cn/docx/E1WGd70YLoaHGfxAYJTc4WoFnsd)  我是夕子，93年女孩，白手起家，不到2万成本现在每月稳定10w+利润。白手起家，不靠家里，完成了在新一线城市安家落户，买房买车育儿。  对比很多大佬的成绩，这只是小儿科，但我只跟自己比，跟昨天的自己比，有没有更聪明些，认知有没有更宽阔些，有没有更沉稳些，有没有更接近我理想的生活，有没有更有钱------  ![](img/ac41ce89f9dc078985c8a2515328b3bc.png)  （单品牌收入）  毕竟属于大学毕业后第一次做生意，没有亏，反而挣了，是条稳稳的现金流。我把相关的重要经验分享给有缘人，希望能给到大家一些启发。  分享目录如下：  一：我是个皮肤病患者，所以选择从医  一：毕业后，放弃不喜欢的工作  二：做生意，从一单2块开始  三：店铺被封，差点放弃  '
docs/202301-02/ELHqdhiI5oSQAxxItLJctNAhnah.md: '# 【已发部分】普通人可复制的云监工玩法，挑战3天读50篇生财小报童项目精选+写5000多字心得  >
