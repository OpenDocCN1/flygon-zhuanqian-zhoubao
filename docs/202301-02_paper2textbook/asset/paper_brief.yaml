docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md: '# IP如何做到风骨体面且年入千万  > 来源：[https://z5uufnsl6h.feishu.cn/docx/HiVkdfBYJo2H5xxWIemcMcMQnLc](https://z5uufnsl6h.feishu.cn/docx/HiVkdfBYJo2H5xxWIemcMcMQnLc)  优质的合作从一个自我介绍开始，欢迎对年入千万感兴趣的IP来一起牛皮。  【姓名】刘梦园（微信：camel17）  【所在地区】北京朝阳  【一句话介绍自己】巢野文化创始人（内容经纪公司）&星云IP计划发起人（20个S级IP、年2亿的盘子、北京市版权局战略试点项目）&内容经纪赛道开创者（开启通往web3.0的钥匙，有极具想象空间的一整套理论和落地体系）  【我的标签】超强内容把控力（十年运营人，涉及多个垂类）；擅长生态布局（例：nobody的时候搭建了覆盖6亿的新媒体公益联盟）；全域IP打造（目前极少数个人把图书知识付费自媒体版权私域都做过且有结果的人）  【其他的】对应用web3.0（目前主要在IP的“上市”方向）、跨越结构洞、整合多维资源有一些心得  ![](img/e29f4ce10'
docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md: '# 万字复盘:普通职场人，下班时间靠拆解，7年拆了500个项目，复制成功30+，副业收入破百万  >
  来源：[https://evs6m7y1q3.feishu.cn/docx/I9OAdzzs2oBliNxsmPjcHnBUnzf](https://evs6m7y1q3.feishu.cn/docx/I9OAdzzs2oBliNxsmPjcHnBUnzf)  大家好，我是秦汉唐，一个7年私域老兵，擅长私域运营、商业项目拆解&复制。  相信有很多做私域的小伙伴会发现，就是我们在做私域的过程中都会碰到一个问题：就是你的私域做的再好，项目后面的转化链路、企业员工培训做得再好，如果项目前面流量的问题没有搞定的话，都没有用！  私域只是一个渠道，是帮助我们企业更好地跟客户建立关系和发展粘性的一个渠道，其实更重要的是前端的流量，你有没有打开流量，每个月是否有稳定的流量进来。  我们之前服务过一些电商公司，他们想法也蛮多，要把客户发展成推广员，发展成代理等等，但是前端的流量一直迟迟没法搞定。没法搞定的原因并不是说他们公司的订单不够，也不是说老客户不多，而是说他们电商的老客户基本上都在另外一个部门，'
