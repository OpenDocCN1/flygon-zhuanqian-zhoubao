docs/202301-02/JPRAdLgGFowUE7xargGc8YNjnzh.md: '# 如何写出既能吸金、又能深入人心的心金文案  > 来源：[https://b80fa9wrsf.feishu.cn/docx/JPRAdLgGFowUE7xargGc8YNjnzh](https://b80fa9wrsf.feishu.cn/docx/JPRAdLgGFowUE7xargGc8YNjnzh)  哈喽，大家好。  我叫李思念，是睿思学院创始人，也是一名10年的创业者。  过去从事过多个私域创业项目，目前专注为个体创业者提供IP创业综合指导。  我身上被人广为记忆的个人IP标签中，首当其冲的应该就是我的文案力。  我坚持更新朋友圈，年输出超过百万字，写的文案在创业圈被广泛传播，在小红书上也通过文案吸粉无数，变现超过7位数。  我有时候会觉得，文案，它真的是一个逆天改命的武器。  当你开始亲自原创文案时，你会发现，自己学会了在字里行间思考，自己慢慢拥有了核心思想，这种思想，通过文案的传播，吸引、影响、感染了更多同频的人。  而这种影响力，也反之加持了你的个人IP，会直接作用于你的事业成绩。  写作多时，2022年，我给我的文案风格，终于敲定了一个名字，叫做「心金文案」，寓意'
docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md: '# 如何解决原创视频内容的批量生产？聊聊我的短视频带货矩阵的自动化之路  >
