docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md: '# 传统金融转型Web3，聊聊我的经历  > 来源：[https://otnh7rfhg0.feishu.cn/docx/T1Jad4VhIoPc2hxKJxwcUFPOnTc](https://otnh7rfhg0.feishu.cn/docx/T1Jad4VhIoPc2hxKJxwcUFPOnTc)  各位生财圈友们大家好，我是久富，曾是一名十年金融分析师，2021年转型Web3创业。  第一次在生财上分享内容，请各位多多指教！接下来我会分背景、探索、展望未来三个方面，来聊聊我眼中的Web3。  去年6月，我从十年金融分析师开始转型，正式开启了我的Web3创业。那时候中概股还没完全暴跌，港股也没回到08年金融危机附近，日元汇率更没跌回30年前的水平，而元宇宙概念也还糊不清，NFT更未成为年度热词。  （声明：本次分享涉及到的任何东西，均不构成投资建议。投资有风险，入市需谨慎！）  ###
