docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md: '# 围观船员视频号带货如何7天10万粉变现5w+  > 来源：[https://v9rbaf0m5d.feishu.cn/docx/VsjCdIDNJoNRvlxo4OWcJ7bDnO5](https://v9rbaf0m5d.feishu.cn/docx/VsjCdIDNJoNRvlxo4OWcJ7bDnO5)  入生财三年了，第一次发文，也是第一次航海  很惭愧，别人都10月底上岸了，我10月底刚刚上船。  10月的航海实操报了3个项目（创业IP，共读，视频号带货）  先说结果：  创业IP-全网100多个粉丝（我花精力最多的地方）变现4k  共读—上岸  视频号带货-未上岸-10月28号开始登船4个账号到11月7号变现5万+  我的背景（项目能做起来有运气成分也有过往经历的成分）：  19年之前北京打工10年，混到一个体育滑冰场馆的区域总经理的位置。  给冬奥会吉祥物发布会出过整场节目。  接奥组委项目到美国归化过队员。  （谷爱凌大家应该都知道，没错他是另外一个项目组归化回来的哈哈。）  我们规划的人物叫朱易，很遗憾没拿到好的成绩。  19年去了杭州，在发小@直浪那里学电商。 '
docs/202301-02/XuOgdT9o8ongKPxfSMlcfgLbngf.md: '# 如何通过抖音卖几百万非遗拓片  > 来源：[https://wppopmriov.feishu.cn/docx/XuOgdT9o8ongKPxfSMlcfgLbngf](https://wppopmriov.feishu.cn/docx/XuOgdT9o8ongKPxfSMlcfgLbngf)  ###
  一、项目背景介绍：  可能很多的圈友之前都没听说过拓片这个产品，为了直观的让大家了解，我先发个视频给大家看看。  在两宋阶段，传拓已成为一门独特的艺术并延续至今。
  拓片不同于书法绘画，它是集金石学、考古学、美学三位一体的高层次艺术门类。将具有科学价值、艺术价值、历史价值的高古刻画、浮雕文物拓制于纸上而形成的一门独特的艺术形式。  我们的品牌叫竹庐拓艺，产品涵盖佛像、书画、碑刻、画像石、青铜铭文、陶器文字、瓦当图案等拓片产品，经过近几年的产品创新，开发出了一系列适合当下审美的产品供应链。  线上做的不久，只有抖音一个平台，销售额几百万左右，抖音客单价1000-1200左右，线下有两个展厅，上海抱朴美术馆、郑州二砂文创产业园馆，后续也会在北京、广州等地开线下展厅。  目前拓片这个类目我'
docs/202301-02/ZcEdd0xTCo1K5IxwCyLccKUynOb.md: '# 小说推文进阶玩法，精细化运营所带来的稳定出单  > 来源：[https://m1lpiqj5ed.feishu.cn/docx/ZcEdd0xTCo1K5IxwCyLccKUynOb](https://m1lpiqj5ed.feishu.cn/docx/ZcEdd0xTCo1K5IxwCyLccKUynOb)  大家好，我是今年加入生财的某人周，一名工科出身的英语老师。年中开始就跟着
  干小说推文项目：在抖音等平台发布知乎的付费小说，引导观众去知乎开通盐选会员看后续，开通后推文博主获得佣金收益。  目前我运营2个号，每天发布2-4条视频，每天从选文改文到剪辑发布投入的时间不超过1.5小时，单号每周收益在400左右，偶尔爆一篇赚几百上千，此外老视频的长尾流量还能细水长流地出单。  这是我第一次在某个项目中投入这么多的时间，这里分享我通过精细化运营做到稳定出单的心得和理解，希望帮大家更深入全面地了解推文项目，以及给大家提供有价值的实操步骤。  ####
  本文主要写给有以下几种情况的小伙伴：  *   尝试过小说推文，但遇到较多卡点的，这篇文章能解答不少常见问题，比如找文难、起号难、卡万播'
docs/202301-02/Zjr6dgbHIoxcp0x21SVcrwlqn8d.md: '# 追逐风口，AI绘画目前收益5W+  > 来源：[https://ovyhcgsmdu.feishu.cn/docx/Zjr6dgbHIoxcp0x21SVcrwlqn8d](https://ovyhcgsmdu.feishu.cn/docx/Zjr6dgbHIoxcp0x21SVcrwlqn8d)  我尽量用最简洁的语言来讲清楚这件事情  今年2月份，国外的技术团队在通过文字生成图片这件事情上，有了非常大的突破，可以通过文字生成以下图片，非常的精美，气势恢弘的像这种  ![](img/091b58bf3d565cc8b2575ace09f26f27.png)  二次元的话就类似这种  ![](img/e2ecd78114a8176992feefe2c3c24caf.png)  任何技术的革新都会带来新的机会，不过冷静下来，还是要找好自己在这个事情中的定位，定位错了，方向就迷失了。  首先分析自己的定位  技术：
  模型的训练需要大量的数据，做模型的生意显然不太现实了，另外各大大厂都推出了AI绘画的接口，目前的价格在0.10元左右  ![](img/b87398cca1d6206a4b'
