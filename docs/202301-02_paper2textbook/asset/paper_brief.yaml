docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md: '# 我对从0到1搭建短视频团队的一些理解  > 来源：[https://heatwave.feishu.cn/docx/MXPcd58gSoEsTlxFhUVcJ5X7npc](https://heatwave.feishu.cn/docx/MXPcd58gSoEsTlxFhUVcJ5X7npc)  大家好，我是俊达，一个短视频赛道创业者。  今年4月份开始，我们团队做了几个垂类知识IP、商业IP，团队也做出了一些成绩：  *   两个月，高考志愿号精准涨粉10万+，私信爆满。  *   一条讲抗衰的视频，给后端导流300个干细胞客户。  *   垂类账号千粉变现六位数。  *   ...  我把自己关于如何打造短视频IP矩阵的理解，梳理了出来，主要分为5个部分，如果你也是在想做/在做短视频IP方向，希望对你有帮助：  1.  如何梳理变现产品  1.  如何打造短视频团队  1.  短视频IP打造流程  1.  我看好的抖音IP赛道  1.  20条抖音IP实战心得  ##
  变现效率决定成功率  先明确一个认知，我们做抖音IP的最终目的是为了搞流量，为了后端变现。  抖音是开卷考试，'
docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md: '# 一个千万项目的底层逻辑  > 来源：[https://xsej9se9cv.feishu.cn/docx/NxhWdJj3UoPKvmxaBqkcz8wlntf](https://xsej9se9cv.feishu.cn/docx/NxhWdJj3UoPKvmxaBqkcz8wlntf)  前两天说了，要开始在生财持续输出，今天带来一篇认知方面的文章：  前几天那篇盲盒的文章，提了一嘴。  任何项目都可以拆解成：「流量效率，销转效率，交付效率，客单价，毛利率，复购率」，这六个点  「六个点，满足的越多越好，满足四个点，及格」  #
