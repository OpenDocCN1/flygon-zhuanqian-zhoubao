paper: docs/202301-02/XuOgdT9o8ongKPxfSMlcfgLbngf.md
desc: 该素材以竹庐拓艺品牌为案例，系统阐述了如何通过抖音平台销售高客单价非遗拓片产品并实现年销售额数百万的商业实践。作者从项目背景出发，提出了'利他思维'和'产品思维'两个核心理念，然后从平台定位、产品定位、人群定位、抖音引流、转化成交、合作模式六个维度详细拆解了实操方法论，强调了线上引流、线下承接高客单成交的商业模式，以及通过高品质装裱（八层结构）和场景化直播提升产品价值感的策略。
concepts:
- name: 拓片
  desc: 将具有科学价值、艺术价值、历史价值的高古刻画、浮雕文物拓制于纸上而形成的独特艺术形式，集金石学、考古学、美学三位一体，起源于两宋时期并延续至今。
  is_original: false
  excerpt:
  - 拓片不同于书法绘画，它是集金石学、考古学、美学三位一体的高层次艺术门类。将具有科学价值、艺术价值、历史价值的高古刻画、浮雕文物拓制于纸上而形成的一门独特的艺术形式。
- name: 利他思维
  desc: 作者做非遗传拓项目的初心：通过帮助技艺精湛但不会运营销售的手艺人卖出产品，实现弘扬非遗文化和改善手艺人生活的双重价值。
  is_original: true
  excerpt:
  - 很多的手艺人有非常精湛的技艺，但是不会运营销售，随着后面慢慢销售额越来越多，很多手艺人也跟着我们买了新车，在老家盖新房子，站在弘扬中国传统非遗文化的角度，我们这个事情还是很伟大的，是利他的，所以让我们坚定了这条路。
- name: 产品思维
  desc: 在经历了为他人服务（古玩城、内容服务商、直播带货）的各个阶段后，作者提出'产品才是未来的压舱石'的核心认知，认为无论平台和时代如何变化，优质产品是商业的根本。
  is_original: true
  excerpt:
  - 我们一路回首，好像一直在为别人服务，从为古玩店商家服务，到平台的内容服务商，再到帮厂家带货，始终没有自己的品牌和产品，直到遇到非遗传拓这个项目，让我们坚信产品才是未来的压舱石。不管平台怎么变，时代怎么变，只要把优质的产品做好了，一定会有市场。
- name: 文人空间
  desc: 作者对竹庐拓艺未来的畅想方向，借鉴日本流行的概念，打造包含宋代极致美学产品和传统文化元素的线下空间，从卖产品升级为卖空间与文化体验。
  is_original: false
  excerpt:
  - 我们未来的畅想是打造目前日本非常流行的文人空间的概念，都是宋朝极致美学的产品，里面都是传统文化的东西。
methods:
- name: __overview__
  desc: 整体商业方法论：通过'道术器'框架，以平台定位、产品定位、人群定位三个维度构建战略思考，以抖音短视频引流获客、多账号矩阵布局、直播间场景化搭建、平价引流+线下高客单承接的转化链路、多模式合作为战术执行，实现非遗拓片高客单产品的规模化销售。
  excerpt:
  - 我觉得核心的还是思路问题，我们讲道、术、器，术和器的层面圈友应该比我更厉害，我今天着重分享思路的层面
  - 平台定位：抖音为了养成用户的购买习惯，由兴趣电商往货架电商转型，现在直播间的考核是以成交单量为主
  - 产品定位：为什么一定要做好产品，传递美与价值
  - 人群定位：新锐白领、资深中产，这是我们抖音后台人群的标签
- name: 平台定位方法
  desc: 基于抖音从兴趣电商向货架电商转型的趋势预判，判断未来平台将像天猫、拼多多一样以成交效率为核心考核指标，因此选择做高客单价产品以顺应趋势。
  excerpt:
  - 抖音为了养成用户的购买习惯，由兴趣电商往货架电商转型，现在直播间的考核是以成交单量为主，所以我们会看到很多低性价比直播间人非常的多，但是成交效率很低。
  - 未来平台的策略会和现在天猫、拼多多一样，考核商家的成交效率。我们的直播间1个小时场观500人左右，千次成交4000-6000GMV，高的时候1-2万多。所以未来高客单一定是趋势。
- name: 产品定位与高品质装裱法
  desc: 针对高净值人群对'有历史且美有内涵'产品的需求，通过八层结构的极致装裱工艺（包括精选俄罗斯黑松木材质）提升产品质感和性价比感知，利用'三分画七分裱'的行业逻辑建立产品价值壁垒。
  excerpt:
  - 第一层实木框，这个实木框我们尝试了20多个材质，最后选择了俄罗斯黑松木材质。第二层有机玻璃，第三层卡纸，第四层拓片，第五层背纸，第六层龙骨架，第七层整张封板，第八层防尘封条
  - 所以一般线上收到我们产品的客户，产品整体品质看起来秒杀他们家里同价的书画。而且这个装裱到本地的话最少上千块。所以他们会觉得性价比非常高。
- name: 人群定位方法
  desc: 通过分析抖音后台人群标签（新锐白领、资深中产）及订单手机号规律（全是连号），锁定高净值、对生活有美好追求且有购买力的目标人群，据此开发匹配产品线（唐卡、心经、佛像等）。
  excerpt:
  - 新锐白领、资深中产，这是我们抖音后台人群的标签。这部分人都是对生活有美好追求的人，而且有足够的购买能力。
  - 而且发现我们后台订单的手机尾号全是连号，88888、6666、00000、9999都是这种五六位数的连号，接着我们每一次出新品客单价都在往上走。前天甚至卖了一单6666的高价
- name: 抖音流量获取与直播间搭建法
  desc: 通过抖音布局10几个账号、小红书/快手/视频号各8个账号进行短视频引流，以产品拍摄为主要内容形式；同时基于'产品特别吃场景'的判断，将直播间从低端场景升级为佛堂、玄关、茶室、书房等家居场景，提升转化率。
  excerpt:
  - 目前我们在抖音布局了10几个账号，小红书、快手、视频号各8个账号。
  - 早期我们是一个师傅在后面拓制拓片，我们主播在前面直播，直播了一段时间不行，价格卖不上去，场景太low了，因为我们这个产品特别吃场景，所以我们产品的直播场景也一直在优化，比如佛堂挂画（我们就布置一个佛堂的景），玄关挂画、茶室挂画、书房挂画等
- name: 线上引流+线下承接的转化模型
  desc: 商业模式核心：线上以平价入门产品作为获客渠道，通过直播成交转化并引流到私域，最终目标是将用户引导至上海、北京、深圳、广州等线下展厅，成交几万到几十万的高客单产品。
  excerpt:
  - 线上我们是入门级产品，首先平价卖，仅仅是我们获客的渠道，未来我们会上海、北京、深圳、广州开线下展厅，目的是服务背后的高客单复购人群，客单价是几万、几十万的产品。
  - 高客单一定要用线上引流，线下承接流量成交变现。
- name: 多模式合作拓展法
  desc: 线上线下多维度合作模式：线上启动精选联盟，与信仰类IP、历史IP、非遗类IP、书单号等达人合作带货；线下与5A景区、寺庙、画廊、茶室等场景合作，并开展拓片研学项目（申请非遗文创补贴）、DIY体验项目+线下店模式。
  excerpt:
  - 线上：我们准备把精选联盟启动……接下来准备和一些与我们产品元素相关的短视频达人和主播合作。例如：信仰类IP、历史IP、非遗类IP、书单号等。
  - 线下：目前已经有很多的5A景区、寺庙、画廊、茶室等谈合作模式。
  - 后期开展拓片研学项目（可以申请各地区非遗文创项目的补贴资金，我们提供全套流程和资料），拓片DIY体验项目+线下店模式
theorems:
- name: 产品是商业的压舱石
  desc: 在经历了古玩城、平台内容服务商、直播带货等多个'为人服务'的业务阶段后，作者得出结论：没有自有品牌和产品，业务始终缺乏根基，优质产品才是应对平台与时代变化的根本保障。
  excerpt:
  - 我们一路回首，好像一直在为别人服务，从为古玩店商家服务，到平台的内容服务商，再到帮厂家带货，始终没有自己的品牌和产品，直到遇到非遗传拓这个项目，让我们坚信产品才是未来的压舱石。不管平台怎么变，时代怎么变，只要把优质的产品做好了，一定会有市场。
- name: 高客单价是抖音电商的未来趋势
  desc: 基于抖音从兴趣电商向货架电商转型的战略判断，直播间考核从成交单量转向成交效率，因此高客单价直播间将更符合平台长期策略导向，成为趋势。
  excerpt:
  - 未来平台的策略会和现在天猫、拼多多一样，考核商家的成交效率。我们的直播间1个小时场观500人左右，千次成交4000-6000GMV，高的时候1-2万多。所以未来高客单一定是趋势。
- name: 产品价值需匹配目标人群的居住空间与审美层级
  desc: 高净值人群居住空间价值极高（上海美术馆楼上房价20万/平，一套近2000万），他们不可能挂几十元的复制品，必然偏好有历史、美且有内涵的产品，因此产品设计必须匹配此类人群的消费层级与审美需求。
  excerpt:
  - 就拿我们上海抱朴美术馆楼上的房价是20万一平，户型90平方左右，一套房子近2000万，二线城市的房价最少也要200万往上，那他们不可能挂一个几十的复制品书画在家里，肯定喜欢有历史并且美有内涵的东西。所以我们的产品设计就要符合这部分人的需求。
- name: 高客单价产品的线上流量获客、线下承接变现
  desc: 高客单产品无法仅靠线上完成成交，必须采用'线上平价引流获客—私域沉淀—线下高客单承接变现'的漏斗模型，线下场景（展厅、家居卖场）才是高客单成交的主战场。
  excerpt:
  - 高客单一定要用线上引流，线下承接流量成交变现。因为我们发现红星美凯龙、喜盈门、居然之家、宜家等家居卖场，有油画、字画、山水画，但是没有拓片画，结合线下场景式营销，未来也是一个非常大的市场。
- name: 非遗类高客单产品必须依赖场景化呈现
  desc: 拓片产品'特别吃场景'，直播间的场景搭建水平直接决定成交价格天花板——从师傅拓制的低端场景升级为佛堂、茶室、书房等家居场景后，产品价值感才能支撑高客单价。
  excerpt:
  - 早期我们是一个师傅在后面拓制拓片，我们主播在前面直播，直播了一段时间不行，价格卖不上去，场景太low了，因为我们这个产品特别吃场景，所以我们产品的直播场景也一直在优化，比如佛堂挂画（我们就布置一个佛堂的景），玄关挂画、茶室挂画、书房挂画等
findings:
- name: 非遗拓片抖音销售业绩
  desc: '[evidence] 素材数据支撑的发现：竹庐拓艺品牌在抖音单一平台上实现年销售额数百万，抖音客单价1000-1200元；第一个月尝试线上销售即卖出50万元；拓片类目从抖音数据看为TOP；竹庐拓艺馆拥有大小石刻印版100多块，日产量300余张，年销量近2000万。'
  excerpt:
  - 线上做的不久，只有抖音一个平台，销售额几百万左右，抖音客单价1000-1200左右
  - 于是就尝试着线上卖试试，没想到第一个月就卖了50万
  - 目前拓片这个类目我们从抖音数据来说是TOP
  - 目前竹庐拓艺馆拥有大小石刻印版100多块，日产量300余张，年销量近2000万
- name: 直播间转化效率指标
  desc: '[evidence] 素材数据支撑的发现：在1小时场观仅500人的情况下，直播间千次成交可达4000-6000GMV，高峰期达1-2万，验证了低流量高转化效率的可行性，支撑了''高客单直播间更重成交效率''的判断。'
  excerpt:
  - 我们的直播间1个小时场观500人左右，千次成交4000-6000GMV，高的时候1-2万多。
- name: 产品装裱品质的性价比感知
  desc: '[claim] 原文宣称的结论：八层结构的精工装裱（黑松木实木框等）使产品品质在同价书画中占据优势，且本地装裱成本至少上千元，因此用户会感到产品性价比极高。'
  excerpt:
  - 所以一般线上收到我们产品的客户，产品整体品质看起来秒杀他们家里同价的书画。而且这个装裱到本地的话最少上千块。所以他们会觉得性价比非常高。
- name: 信仰类目的市场表现
  desc: '[evidence] 素材数据支撑的发现：信仰类产品（西方三圣）销量达1000多单，带框单价近3000元；信仰类视频播放量高，信徒消费需求不受经济周期影响，验证了信仰类目产品的市场需求。'
  excerpt:
  - 研究了一批信仰类目的产品，不管你经济好还是坏，有信仰的人一直都存在……而且信仰类的视频播放量也很高。
  - 有一个西方三圣的销售量也不错，卖了1000多单。
  - 带框的单价近3000
- name: 高净值客户订单特征
  desc: '[claim] 原文宣称的观察结论：客户订单手机尾号全为连号（88888、6666、00000、9999等五六位数），且有大明星客户单次消费数万元，说明客群为高净值人群；据此每次出新品持续上探客单价，并成功售出6666元高价单品。'
  excerpt:
  - 而且发现我们后台订单的手机尾号全是连号，88888、6666、00000、9999都是这种五六位数的连号，接着我们每一次出新品客单价都在往上走。前天甚至卖了一单6666的高价，也有很多的大明星喜欢我们家的产品，每次一买都是好几万。
- name: 同行短视频带货验证达人合作价值
  desc: '[evidence] 素材数据支撑的发现：同行通过短视频带货卖出上千单，验证了短视频达人合作模式的可行性，成为作者启动精选联盟、与相关IP达人合作的决策依据。'
  excerpt:
  - 我们发现一个同行短视频带货卖了上千单，而自己短视频带货没有精力去做，接下来准备和一些与我们产品元素相关的短视频达人和主播合作。
