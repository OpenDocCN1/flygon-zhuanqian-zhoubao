paper: docs/202301-02/20230207_09.md
desc: 素材为龙哥赚钱周报（2022年11月29日），汇总了生财有术社群中关于创业认知、赚钱技能与项目实操的系列精华帖，核心内容包括：微小创业财税规划、日更写作打造个人复利系统、从亏损100万到盈利300万的项目复盘，并系统阐述了“结合自身资源做项目”的创业方法论（资源盘点→项目拆解→匹配度评估）。
concepts:
- name: 持续输出力
  desc: 指个人通过持续写作表达，倒逼输入与思考，从而积累知识、能力与影响力的能力，被视为普通人打造复利系统的基础。
  is_original: false
  excerpt:
  - 1 为什么一定要打造持续输出力
  - 02 输出是倒逼自己输入，以及帮助自己思考最好的方式
  - 03 内容是这个时代普通人最容易建立的复利杠杆
- name: 内容复利杠杆
  desc: 指以内容为媒介，通过复制边际成本为零的特性，在多种平台重复传播、放大价值，从而为普通人带来被动收益的杠杆。
  is_original: false
  excerpt:
  - 《纳瓦尔宝典》一书中提到要最大限度的利用杠杆，而对于普通人来说，最容易触手可及的就是'内容'，它的复制边际成本为零，可以重复利用，多平台推广，放大价值。
- name: 写作即社交/身份证
  desc: 主张写作是最佳社交活动，通过持续输出观点与价值观，内容本身成为个人筛选同频者、建立连接的‘身份证’。
  is_original: false
  excerpt:
  - 写作就是最好的社交活动，是你最好的'身份证'，因为你的思考，经历，价值观都在你的文章中一一展现
methods:
- name: 日更写作复利系统构建法
  desc: 系统化拆解写作过程为‘输入+思考+输出’，并针对常见卡点逐项提供解决方案（选题积累、允许不完美的表达、公开承诺等），以实现持续写作与个人成长。
  excerpt:
  - 我们把写作拆解一下，可以拆解为这样一个系统--输入+思考+输出~
  - 首先从'入口维度'，提升自己输入的广度与深度；其次，提升自己的思考力；最后，出口思维，提升输出力
  - 对于写作，有一个公式就是：文章=问题+回答
  - 做公开承诺，这个方法真的无敌了
- name: __overview__
  desc: 素材整体呈现『自我复盘+项目方法论』的结合，从亏损案例切入，提炼出一套‘结合自身资源、从错配到匹配’的创业路径，并辅以具体项目（外卖CPS）的实操步骤。
  excerpt:
  - 我总结了一套成功的方法（需要结合生财使用），帮助我扭转局面，3个月赚了100万，总利润超过300w
  - 以上是关于结合自身资源、拆解项目、匹配度评估的系统性方法论
- name: 资源盘点与项目拆解法
  desc: 通过三步完成新项目评估：第一步盘点自身现有资源（粉丝、经验、软件、团队、案例等）；第二步拆解潜在项目所需资源；第三步评估资源匹配度，以快速启动项目。
  excerpt:
  - 第一步：盘点自己手里有哪些资源
  - 第二步：拆解项目需要的资源
  - 我以自己举例……那么我的资源就是：公众号经验+流量+人+项目=找到适合公众号变现的方法就可以直接开始
  - 所以对我来说这个项目和我匹配程度就是 100%，因为：公众号经验、美团饿了么平台、导流方法，我都有。
- name: 外卖CPS/副业课程变现法
  desc: 以公众号为流量底座，对接外卖CPS（美团联盟/饿了么分销）或售卖副业课程，实现快速盈利的具体变现路径，并展示其规模化过程。
  excerpt:
  - 外卖cps：第一天就实现盈利100块钱+、2个月盈利做到10w/月、第3个月盈利突破20w/月，总盈利超过200万+
  - 副业课程：3个月盈利100w+
theorems:
- name: 正文/写作复利主张
  desc: 写作是普通人最容易建立的人生复利系统；持续输出倒逼输入并放大个人能力与价值。
  excerpt:
  - 日更公众号，先从坚持做到这件事，给自己积累和沉淀开始改变自己
  - 写作输出是个复利技能，是我们能力和价值的放大器
- name: 创业项目匹配度主张
  desc: 赚钱应结合自身已有资源而非盲目all in；项目与资源的匹配度（而非项目本身好坏）决定成功概率。
  excerpt:
  - 很多人都有一个误区，那就是严重低估已有项目，同时过分高估新的项目
  - 应该结合自身的资源，梳理新项目的资源和自己资源的匹配度，再决定重新做哪个项目
- name: 内容创作者的稀缺性主张
  desc: 信息爆炸时代真正的创作权握在少数人手中，创作内容者是享受红利的稀缺群体。
  excerpt:
  - 真正在创造内容的仅仅只有1%的人，其他10%的人会点赞，评论和转发，而剩余89%的人只是浏览
findings:
- name: 关于创业者亏损路径的观察
  desc: '[claim] 老罗声称大家亏钱的路径雷同（贸然入行、合伙生意、盲目all in、遗憾离场），并多由资源错配与盲目上新导致；此为该帖作者的个人观察，非系统性统计证据。'
  excerpt:
  - 很多朋友写自己的亏钱经历，发现大家亏钱的路径其实都差不多：贸然入行、合伙生意、盲目 all in、最终遗憾离场。更有甚者循环往复，一直亏钱。
- name: 关于亏损反弹至300万盈利的经验数据
  desc: '[evidence] 该帖以自身案例提供数据支撑：此前多项目累计亏损超100万，后经资源梳理叠加外卖CPS与副业课程，3个月赚100万、总利润超300万（外卖CPS总盈利200万+，副业课程3个月100万+）。'
  excerpt:
  - 我……合计亏损超过100多万……3个月赚了100万，总利润超过300w，具体如下：1.外卖cps：……总盈利超过200万+……2.副业课程：3个月盈利100w+
- name: 关于写作的量化反馈
  desc: '[evidence] 该作者通过日更写作565天，完成了课程、付费社群、个人咨询三个变现闭环，并称微信好友数增加6倍；该数据自述为个人样本。'
  excerpt:
  - 一年半的时间，因为日更写作这件事，出了自己的课程，做了自己的付费社群，也接了不少的个人咨询
  - 因为写作输出这件事，我的微信好友数增加了6倍
