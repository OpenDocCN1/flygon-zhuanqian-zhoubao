paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
desc: 该素材由一位个人开发者分享，系统阐述了'卖空气'式的产品开发与盈利思维：主张个人开发者应靠近用户编程、使用非规范化工具快速捏出产品模型并预售'卖空气'，将软件视为软文、用复述问题建立信任，利用App下载门槛精准过滤用户需求，并系统讲解了'有效噱头无效产品'的安慰剂效应、碾压软营销的软件营销派、过审的艺术、居高临下的套话做局收割，以及个人独立开发者应控制开发周期、通过下拉词发现需求、走软件全球化和非规范化生产道路。全文以大量个人实战案例（淘客套话盈利、羊了个羊截图吸粉等）佐证其观点。
concepts:
- name: 卖空气
  desc: 指在产品尚未开发或无法真正兑现功能时，先制造'具备该功能'的假象（预售、截图、演示）来盈利或测试需求。
  is_original: false
  excerpt:
  - 或者直接做个模型，上架开卖，卖空气，卖预售。卖不出去就没必要继续做了！
  - 假装已经有了足够！卖空气！
- name: 软件的本质就是软文
  desc: 作者的核心观点：软件的最终展现和推广方式终究是软文，因此可以反推开发流程，甚至不开发软件而寻找类似软件给客户用。
  is_original: true
  excerpt:
  - 多年经验总结一个观点：软件的本质就是软文。
  - 软件开发出来，怎么推广？还是通过写文章，发广告，介绍你这个软件，软件的最终的展现方式还是软文
  - 所以直接拿软文，最终形式。反推开发流程，甚至不开发软件，而是寻找类似的软件给客户使用。
- name: 复述问题建立信任/用复述问题建立信任基础
  desc: 一种内容策略：通过罗列、复述用户遇到的症状或问题，让用户认为'这次找对了'，从而建立信任基础，哪怕只是知道问题而无法解决。
  is_original: false
  excerpt:
  - 举例：就拿看病举例子，医生会问你：'有没有这个症状？有没有那个症状？'结果你发现：'都是我现在的症状'，所以你认为这个医生懂你的病，这次找对了！
  - 所以，这就是一种内容策略，用复述问题建立信任基础！
- name: 有效噱头，无效产品
  desc: 主张即便产品不真正解决需求，只要噱头有效、名字起得好，也不影响赚钱速度，借助安慰剂效应和好名字改变固有事实。
  is_original: false
  excerpt:
  - 但还有一个观点没说，那就是：'不解决需求'，'也不是好的产品'，并不会影响赚钱的速度！
  - 医学上有一种安慰剂效应，说白了就是诈骗效应。一个糖豆卖的特别贵，就说这是救命药，你吃了也真管用，患者的康复率30%以上！
  - 连花之所以大卖，就是名字取得好，事实证明起个好名字，真的可以改变固有事实！
- name: 非规范化生产（野路子）
  desc: 个人开发者应采用的强调降低成本、提升效率的'野路子'生产方式，区别于正规化流程。
  is_original: false
  excerpt:
  - 个人开发者需要的是'非规范化生产'俗称野路子
  - 非规范化生产的核心是：'降低成本''提升效率'
  - 就怕个人开发者'没有正统的命，得了正统的病！'
methods:
- name: __overview__
  desc: 整体方法论：从用户/需求反推产品，用软文先行而非代码先行，通过卖空气/预售快速验证，借助非规范化工具快速捏出模型，并利用套话、做局来持续获取资源。
  excerpt:
  - 个人开发者，主要精力不应该是开发，应该站在用户角度上去调研做什么，之后用一个非常简单的方式把这个东西捏出来！
  - 程序的思维总是先有东西再推广，不要等什么东西已经有了再去卖！假装已经有了足够！卖空气！
  - 使用《中文编程工具》，不会英语也能快速入门
  - 把需求完整的讲出来，又让他理解，本身就是一件不容易的事。沟通成本有时候比开发成本都高，还赶不上有一个趁手的工具，自己先捏一个模型给他看！
- name: 软文先行/反推开发流程
  desc: 先撰写介绍该软件的软文，再反推是否需要真开发，甚至直接寻找已有类似软件交付给用户。
  excerpt:
  - 所以直接拿软文，最终形式。反推开发流程，甚至不开发软件，而是寻找类似的软件给客户使用。
  - 想一些根本不现实，或多数人下载不到的软件，但他们觉得应该有这种软件，只需要想到名字即可
  - 写软文的核心是用户看到你这篇文章，内心在想'这次找对了！'，就行了，不管他真找对了还是假找对了。
- name: 居高临下的套话（做局）
  desc: 以'已解决问题'的口吻写软文吸引同类问题用户加微信，再反问对方'解决了吗'来套取真实解决办法，最后卖给未解决的精准客户盈利。
  excerpt:
  - 我将这个问题用：已经解决的口吻写出来，软文中附加微信号，之后每天都有淘客大佬加我
  - 过了些天，我又反问加我的人'前几天有点忙没来得及回，你们解决了吗？'开始套话，怎么解决的？
  - 总有解决的，也总有没解决的。把解决的套出来，卖给精准的，没解决的客户，直接盈利几十万！
  - 套话之所以能成，主要是因为对方要彰显优越感
- name: 通过下拉词发现需求
  desc: 通过应用商店、百度、微信、小红书、Google等搜索框的下拉推荐词，来发现用户真实遇到的搜索需求和问题。
  excerpt:
  - 发现需求的方式也很简单，去应用商店找一些App名字，输入百度、微信、小红书，Google搜索框
  - 需求是抓住用户遇到问题,用户寻找解决办法产生的行为。围绕用户可能产生的行为场景，在行为中部署产品！
- name: 过审的艺术
  desc: 通过超长文、干净截图、合集大全汇总模板等技巧，让审核员觉得文章'长篇大论且专业'或'看起来无害'从而通过审核。
  excerpt:
  - 所以软文需要有一个干净的截图，只凭软件的截图，没需求用户不会去下载的，调动用户分享精神，也是一种在社交媒体推广软件，过审的技巧！
  - 文超长，字超多，审核员懒得看，就行了！可使用：合集、大全、汇总，之类模板，增加文章字数！
  - 核心是让自己变得至少看起来是无害的。
- name: 软件营销派策略
  desc: 相比纯文本攻略，用更逼真的App界面来营销，让用户觉得'软件问题就要用软件解决'，并设置强制分享等裂变机制。
  excerpt:
  - 软件营销派：核心是，看起来更逼真、更专业。广告隐藏的更深，更容易用户裂变
  - 弄一个APP告诉你，你下载这个APP，填上名字，就可以申请解封！
  - 我不仅有广告，我还强制你分享给别人后才能使用，这可比软文营销狠
theorems:
- name: App的不便是精准过滤需求的优势
  desc: 相比网页/小程序，App需下载安装、门槛高，反而能够精准过滤出有强烈需求的用户，并让用户相信'该App真的具有该功能'。
  excerpt:
  - 但是正因为App使用不方便，却可以当成优势利用一下
  - 如果没有强烈的需求，用户根本不可能去下载安装App App大多数展示只是看客，下载率极低！
  - 但这时用户看到了App截图和使用方法，用户就会知道，有这么一个App，没有需求的用户不可能去下载。所以用户觉得：该App'真的具有该功能！'
- name: 超长文的SEO欺骗效应
  desc: 超长、看似专业的文章会让用户在页面停留更久、让用户认为专业而收藏转发（但后半部分往往不看），从而提升搜索排名和传播。
  excerpt:
  - 用户在你这个文章的页面停留的时间越长，搜索引擎就会觉得你这个文章更专业
  - 该类文章特征：写的字长，让你停留时间长，让你照着各种步骤去做，反正你最终也解决不了！
  - 知乎只要是长文，点赞收藏就多。看到200字有联系方式或者公众号，先加了在说，然后收藏点赞（反正看不完，以后也不会看）
- name: 世上本没有攻略，瞎编一些就有了
  desc: 营销文章的常见本质：编造并不存在的、无用的攻略，依靠'长篇大论且专业'的表象获得流量和排名。
  excerpt:
  - 世上本没有攻略，瞎编一些就有了！
  - 市面上的营销文章大多是：编一些根本不存在的攻略
  - 无效的攻略看起来特征：'长篇大论且专业'
- name: 软件营销派碾压软营销派
  desc: 当软文稿子配上逼真的软件界面时，营销效果会碾压纯文本攻略，因为用户觉得'软件问题就要用软件解决，用魔法打败魔法'。
  excerpt:
  - 但是呢，如果这种方向的文章上产生了一个软件派，就可以直接碾压他们了，因为软件看起来更逼真了.....虽然仍然不解决任何问题！
  - 对于这两个版本而言，用户肯定会觉得后一个版本更专业，虽然这两个版本都无法解决你的问题。
- name: 个人开发者开发周期不应超过1周
  desc: 个人独立开发者应研发小而简单的产品，单个软件研发时间不应超过一周，超过一周就不适合个人开发者。
  excerpt:
  - 个人开发者研发一个软件的时间不应超过1周，超过1周的软件产品不适合个人开发者！
  - 做些小而简单的软件，站在用户角度上根据需求打造产品
- name: 软件全球化是大势所趋
  desc: 国内互联网环境不佳，软件全球化几乎是唯一出路，且海外对软件非常友好（免备案、免证件、免审核）。
  excerpt:
  - 目前国内的互联网环境没那么好，软件全球化是大势所趋，甚至可能是唯一的出路！
  - 1、网站不需要备案 2、Google投放广告不需要证件，充钱就行 3、软件不需要'软件著作权证书' 4、不需要应用商店审核
  - 无证件的产品也可以上市场，正适合非规范化生产
findings:
- name: 礼包软件评论区集体幻觉现象
  desc: '[evidence] 作者观察到早些年做的礼包软件实际领不到礼包，但应用商店评论区出现大量''我领到了''''是真的我也领到了''的虚假好评，支撑了''有效噱头、无效产品也能获利''的观点。'
  excerpt:
  - 早些年做个礼包软件，根本领不到礼包，但应用商店评论区：'我领到了','是真的我也领到了'我习以为常，观察人类迷惑的行为
- name: 淘客套话做局盈利案例
  desc: '[evidence] 作者用''已解决''口吻写淘客API问题的软文，每天吸引淘客大佬加微信，套出真实解决方案后卖给未解决的客户，直接盈利几十万，案例佐证''居高临下的套话''方法论。'
  excerpt:
  - 一堆淘客大佬加我问怎么解决？我特么怎么知道咋解决，我只是知道这个问题。
  - 总有解决的，也总有没解决的。把解决的套出来，卖给精准的，没解决的客户，直接盈利几十万！
  - 土豪老板刚通过好用就直接连发几个888转账！
- name: 羊了个羊P图吸粉套话案例
  desc: '[evidence] 羊了个羊刚火时，有人P一张999999分数截图，以''已开挂''口吻发帖吸粉，5天后游戏大火，套话找出真正刷分软件直接变现。'
  excerpt:
  - 羊了个羊刚有点火，立刻就有人P一张分数999999截图
  - 去社交软件用已经开挂的口吻发文，开始吸粉，差不多5天后《羊了个羊》大火🔥
  - 这时他就可以，套话找真正能刷分软件了，直接把粉丝变现！
- name: 15页材料秒过审案例
  desc: '[evidence] 作者亲身经历：提交2页证明材料被拒，改成乱七八糟的15页后秒过，案例支撑''超长文/字多利于过审''的判断。'
  excerpt:
  - 之前提交一个证明材料，只提交了2页直接给我拒绝了，后面我乱七八糟提交了15页秒过。
