unsupported_claims:
- location: 19.5.5
  claim: 《生财有术项目精选》是知识星球“生财有术”官方出品的年度项目复盘合集，汇聚了社群内经过验证的50个实战项目案例...
  reason: 素材中未找到关于《生财有术项目精选》的权威背书、编辑标准、星主亦仁及核心运营团队多轮筛选把关的描述，该段落属于教材编写时的补充阐述，非素材直接溯源。
- location: 19.12.1
  claim: 全额退费模式...将群主置于‘单向付出’境地...利益天然对立，不可持续。
  reason: 素材中虽提及‘纯打卡全额退费’为反面教材（ELHqdhiI5oSQAxxItLJctNAhnah.md），但未详细论述‘群主垫资运营、承担服务成本’及‘服务质量下降、甚至跑路’等因果链条，属于教材推演延伸。
- location: 19.12.2
  claim: 私域承接能力弱时，**先建后域（SOP/人设/案例/信任背书），再用泛内容引流**；私域体系成熟后，可逐步提高精准内容占比，降低筛选成本。
  reason: 素材中虽提及‘私域承接能力不足先建后域再引流’（ELHqdhiI5oSQAxxItLJctNAhnah.md），但未给出‘SOP/人设/案例/信任背书’的具体构成清单，亦无‘成熟后逐步提高精准内容占比’的实操节奏，属于教材综合归纳。
- location: 19.12.3
  claim: 验证的是‘支付意愿’而非‘点赞意愿’，现金流是唯一硬指标。免费用户的反馈往往失真...付费用户的反馈才具有决策参考价值。
  reason: 素材中虽有‘验证产品应优先卖想法而非做产品，通过高意向付费人数判断需求’（ELHqdhiI5oSQAxxItLJctNAhnah.md），但未对比论述‘免费用户反馈失真’与‘付费用户反馈具参考价值’的机制差异，属于教材升华总结。
