  title: 股权顶层设计实战：为‘捡漏群矩阵公司’设计股权结构
  contents:
  - 背景：你（创始人，全职操盘、出资50万、核心供应链/运营体系）、合伙人A（兼职、出资30万、负责法务/财税/融资）、合伙人B（全职、出资0、核心技术/自动化工具开发）、核心员工C/D（全职、无出资、运营主管/选品主管）。
  - 按四要素设计：
  - 1. 控制权：创始人持股比例？AB股/一致行动人/否决权如何设计？
  - 2. 进入机制：合伙人A资金型溢价入（估值多少？）、合伙人B技术型专利入（专利归属谁？）、员工C/D期权入（行权价/归属期/悬崖期）。
  - 3. 分配机制：静态启动比例？动态调整触发条件（GMV/利润/团队规模里程碑）？期权池预留比例？
  - 4. 退出机制：自愿退出回购价格（原价/净资产/估值折扣）？强制退出触发条件（竞业/失职/刑事）？公司回购资金来源？
  - 回答问题：
  - '- 创始人控制权<67%时，如何通过‘一致行动人协议’实质控制董事会/股东会？'
  - '- 合伙人B‘技术入股’若核心代码未注册软著/专利，法律风险如何规避？'
  - '- 公司盈利后，分红权与回购权冲突如何条款化解决？'
- 'no': 7
  title: 内在比赛自我诊断与成功体验唤醒
  contents:
  - 1. 自我诊断：列出你当前正在推进的3个核心目标（如：月入5万/组建5人团队/上线1款产品）。对每个目标，诚实回答：潜意识里，我真信‘我配得上/我能行/这事成’吗？（1-10分打分）。
  - 2. 成功体验唤醒：回顾过去3年，找出3个‘虽小但确定’的成功体验（如：某次谈成难客户/某篇文爆了/某次考试逆袭）。用STAR法则复盘每个体验：情境(S)、任务(T)、行动(A)、结果(R)。
  - 3. 俯视学习计划：针对当前最恐惧/最拖延的1项战略任务（如：融资/招合伙人/上线核心功能），列出‘向谁学’（3个已达成该目标的人）、『学什么』（3个关键动作/决策）、『怎么学’（付费咨询/请吃饭/旁听会议），并设定‘战略俯视’心理暗示语。
  - 回答问题：
  - '- 打分<7分的目标，是‘能力不足’还是‘潜意识不认可’？如何区分？'
  - '- 成功体验唤醒后，如何防止变成‘幸存者偏差’式的盲目自信（忽视真实风险）？'
  - '- 俯视学习中，如何判断对方建议是‘战术细节’还是‘战略方向’？前者跪着学，后者俯视听。'
