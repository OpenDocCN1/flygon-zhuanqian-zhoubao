- location: '39.7'
  claim: 香港疫情曲线显示第一波感染8-9成居民，之后进入2-3个月平静期，第二波感染率为第一波50%并持续5-6个月
  reason: 素材中仅提到'八九成居民被感染'、'2~3个月平静期'、'第二波感染率是第一波的50%'、'陆陆续续维持了5~6个月'，未明确说明第一波感染比例为8-9成，且'平静期'与'第二波'的时间界限未量化
- location: '39.7'
  claim: 2023年春节国内旅游人次达到3亿，恢复至2019年同期88.6%，出境机票订单量上涨258%，入境预订量上涨632%，国际酒店预订量同比增长177%
  reason: 素材中确有该数据，但未注明数据来源（如文化和旅游部、携程/飞猪等平台），无法溯源验证真实性
- location: '39.9'
  claim: 私域进线率60%为合格线，月产值8-15元/人，前3个月衰减率按80%计算，年化产值可达首月7.5倍
  reason: 素材中为作者实测经验值（'我们实测'、'作者实测'、'基于经验'），非行业通用标准或第三方权威数据，属于个人经验归因
- location: '39.10'
  claim: 捡漏群单群成本3500-10000元，回本周期2-3个月，回本后月利润约1000元，生命周期约2年，单群总收益约2.1万；1000群矩阵日利润3万，月利润90万
  reason: 素材中为作者团队及同行自述数据（'目前今年新起的盘不到1000个群，月佣在100w+'、'我身边还有大的团队社群数量达到万个以上，月佣在几千个W'），缺乏独立审计或平台官方数据佐证
- location: '39.12'
  claim: 劲猫曾用20分钟做出10万赞藏大爆文，1万粉丝变现20万；小红书3个月从0涨粉8000、变现5万
  reason: 素材中为作者个人陈述（'曾经20分钟做出过10万赞藏大爆文，1万粉丝变现20万'、'小红书3个月，从0涨粉8000粉，变现5万'），无第三方平台数据或链接可验证
- location: '39.21'
  claim: 把月入3000的号复制30遍即可月入9万，复制100遍月入30万，单点赚1元无限放大可年入百万
  reason: 素材中为理论推演模型（'把1个号做到月入10万很难，但是把月入3000的号复制30多遍不难'），未提供实际复制案例的存活率、边际成本递增、平台风控等约束条件验证
