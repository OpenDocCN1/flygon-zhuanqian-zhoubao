  name: 本书框架预览：从项目库到产品、运营、放大四部曲
  points:
  - '**为什么需要这个概念？**'
  - '- 读者需要全书地图，避免在碎片战术中迷失'
  - '- 建立“先选赛道、后做产品、再搞流量、最后放大”的系统性认知'
  - '- 明确各章节在整体链路中的定位与依赖关系'
  - '**核心定义**'
  - '- 四部曲：建立项目库（选赛道）→ 开发最小产品（卖空气/软文先行）→ 流量与转化运营 → 三大杠杆放大'
  - '- 学习路径：先跑通“看到-拆解-复制”最小闭环，再逐章深化各环节能力'
  - '**关键性质**'
  - '- 顺序不可逆：无项目库则无产品方向；无最小产品验证则运营无着落；无运营跑通则放大无基础'
  - '- 每部曲对应核心能力：情报挖掘力、产品验证力、流量运营力、系统放大力'
  - '**典型例子**'
  - '- 儿童游乐案例：刷到视频(情报)→拆解模型(项目库)→定制加盟品(最小产品)→双渠道引流(运营)→人力/技术杠杆放大(放大)'
  - '**边界条件**'
  - '- 框架适用于“副业/微创业”规模，大企业战略管理另有体系'
  - '- 个人资源禀赋不同，四部曲投入重心可调整（如技术强者重产品，销售强者重运营）'
