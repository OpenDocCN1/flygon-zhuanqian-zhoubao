- 'no': 3
  name: 六维评估模型：给项目算一笔“复制账”
  points:
  - '**为什么需要这个概念？**'
  - '- 凭感觉选项目容易被“包装好的假象”骗，需要量化标尺'
  - '- 既要看“能不能复制”（效率维度），又要看“能赚多少钱”（财务维度）'
  - '- 统一评估语言，便于团队对齐和项目库打分筛选'
  - '**核心定义**'
  - '- 效率三维：流量效率（获客易难）、销转效率（成交易难）、交付效率（履约易难）'
  - '- 财务三维：客单价、毛利率、复购率，决定收入天花板'
  - '**关键性质**'
  - '- 效率维度判断“可复制性”：三效率越高，个人/小团队越容易跑通'
  - '- 财务维度判断“收入上限”：客单价×复购×毛利 = 单客终身价值'
  - '- 补偿机制：某维效率低（如交付重），可用高客单价/高复购补偿'
  - '**典型例子**'
  - '- 小说推文：流量效率高、交付效率高，但客单价低、复购低 → 天花板低'
  - '- 教育资料2.0/项目拆解IP：流量效率低、交付效率中，但客单价高、复购高 → 能做到百万级'
  - '- 减肥食谱：交付效率高、复购高，但客单价极低 → 需走量'
  - '**边界条件**'
  - '- 模型假设“已有同行验证”，不适用于0到1的创新型项目'
  - '- 权重需根据个人资源（如擅长交付选重交付项目）动态调整'
