  name: 信息差搬运论：A平台的“烂内容”就是B平台的爆款
  points:
  - '**为什么需要这个概念？**'
  - '- 打破“内容已饱和”的认知封锁，发现内容迁移的套利空间'
  - '- 降低内容生产成本：不用原创，只需搬运+微调+跨平台分发'
  - '- 利用平台算法差异、用户群体差异、内容生态差异获利'
  - '**核心定义**'
  - '- 渠道间存在天然信息差：同一内容在不同平台表现截然不同'
  - '- 核心操作：把在A平台做烂/做透的内容，优化后搬运到B平台，往往能瞬间爆火'
  - '**关键性质**'
  - '- 非抄袭：需针对目标平台调整标题、封面、话术、发布节奏等“原生化”要素'
  - '- 单向流动性强：通常从成熟平台（抖音/知乎）向新兴/垂类平台（小红书/视频号）流动'
  - '- 时间窗口：每个平台对同类内容的红利期约6-12个月，需快进快出'
  - '**典型例子**'
  - '- 秦汉唐实操：抖音上做烂的“艺术签名/手写Logo”搬到小红书，瞬间爆单'
  - '- 反之，小红书成熟的“避坑指南/种草笔记”搬到抖音/视频号，同样高转化'
  - '**边界条件**'
  - '- 平台打击搬运力度升级时需进化为“二次创作/伪原创”'
  - '- 版权风险：避开有强版权保护的内容（影视、音乐、独家课程），优选工具类、知识类、素材类'
  - '- 不适用于强个人IP属性的内容（如李子柒、罗翔），核心资产在“人”不在“内容”'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 渠道其实是有信息差的，我们做过很多项目，其实吃的就是信息差，有些项目在抖音上做得很烂的，但是如果你搬到小红书上面，瞬间就爆了。有些项目在小红书上面做的人很多了，那你把同样的内容优化一下，搬到抖音上，也有可能把它做爆。
- 'no': 8
  name: 红海不红：为什么红海赛道照样能赚几十万
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人天然恐惧竞争，一听“红海”就退缩，错失成熟赛道红利'
  - '- 误以为红海=赚不到钱，实则红海=需求验证充分、模型跑通、有钱赚'
  - '- 需要重塑“竞争=机会”的认知，建立入场决策标准'
  - '**核心定义**'
  - '- 任何一个红海赛道都不缺一个年赚几十万的人，关键是找到已验证项目做微调'
  - '- 红海本质：市场充分、模型成熟、玩法透明，适合“后发制人”复制'
  - '**关键性质**'
  - '- 竞争激烈 ≠ 无利可图，竞争激烈往往意味着市场大、需求真、流量足'
  - '- 入场关键：不是“避开竞争”，而是“找到已验证项目，做匹配调整”'
  - '- 微调维度：人群更细分、内容更垂直、服务更极致、交付更标准'
  - '**典型例子**'
  - '- 艺术签名/手写Logo/抓娃娃教学：看似红海、低门槛，实则持续有人月入几万'
  - '- 秦汉唐：专门挑同行做了3个月以上、有稳定流量的红海项目复制'
  - '**边界条件**'
  - '- 需具备基本的内容生产/运营/交付能力，完全小白直接进红海大概率被卷死'
  - '- 避开“强个人IP/独家资源/重资产”型红海，选择“轻资产/标准化/可外包”型红海'
  - '- 单项目天花板有限，需通过矩阵化/多项目组合突破收入上限'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 任何一个红海的赛道都不缺一个一年赚几十万的人，都不缺你一个一年赚几十万的人。
  - 所以你唯一能够要做的事情就是找到一个别人做过的事情，做了并且稳定有赚钱的项目。确定好赛道，给他们更匹配一点的调整就可以赚到钱。从 0 到100w，其实就是找到一个项目。
- 'no': 9
  name: 喂养算法与情报挖掘：让平台成为你的商业雷达
  points:
  - '**为什么需要这个概念？**'
  - '- 被动刷视频效率极低，算法默认推送娱乐内容而非商业情报'
  - '- 需要主动“驯化”算法，建立持续、低成本的商业案例发现渠道'
  - '- 单靠算法不够，还需掌握主动搜索、爬虫监测等补强手段'
  - '**核心定义**'
  - '- 喂养算法：通过主动点赞、收藏、评论、停留商业类内容，反向训练推荐模型'
  - '- 搜索挖掘：关键词搜索+真伪分辨+泛读筛选+爬虫数据监测，主动捕猎情报'
  - '**关键性质**'
  - '- 算法有惯性：持续喂养1-2周后，商业内容占比显著上升'
  - '- 搜索需辨真伪：区分“卖课广告”与“实操复盘”，前者常夸大易复制性'
  - '- 爬虫监测：对标账号/关键词设定自动采集，把“人工刷屏”升级为“机器巡逻”'
  - '**典型例子**'
  - '- 秦汉唐：每天2小时商业泛读，坚持喂养算法，积累几百个可拆解项目'
  - '- 作者自述：喂养后算法推荐从“搞笑段子”变为“项目拆解/行业复盘”'
  - '**边界条件**'
  - '- 需注册/清理专用账号，避免个人兴趣标签干扰商业画像'
  - '- 爬虫开发需技术门槛或外包，非必需但能大幅提升情报广度与时效性'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 无论是抖音还是小红书，还是今日头条，还是现在的公众号视频号，都是算法逻辑。我上面讲的几个案例、还有我自己拆过的几百个项目，很多都是通过喂养算法刷到的。
  - 我就不断的点赞收藏关注，然后坚持了一、两个月之后，它就不断地给我推送这些文章。
  - 其次，要学会搜索：1、你要学会分辨你搜索的这些信息源真伪和干货程度。2、你要学会泛读。3、需要有一定的技术实力，或者你认识一些比较靠谱的技术小伙伴，可以做一些爬虫、以及数据监测的开发。
