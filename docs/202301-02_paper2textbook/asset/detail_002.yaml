  name: 策划案+执行案：双案驱动项目落地
  points:
  - '**为什么需要这个概念？**'
  - '- 有想法无计划等于白日梦；有计划无执行等于空中楼阁'
  - '- 副业时间碎片化，必须用结构化文档对齐目标、分工、进度、止损'
  - '- 双案分离：策划案管“方向与边界”，执行案管“节奏与细节”'
  - '**核心定义**'
  - '- 策划案：产品货盘（引流/盈利/高客单）、运营策略（流/转/交）、目标里程碑、止损点、放大点'
  - '- 执行案：周/日维度的甘特表——时间、地点、事项、责任人、阶段目标、完成状态（红绿灯）'
  - '**关键性质**'
  - '- 止损前置：策划案必须写明“时间/金钱/资源”三条红线，触发即止损，杜绝沉没成本'
  - '- 里程碑可验证：如“第1周跑通首单、第1月日单>10、第3月月入>5万”，拒绝模糊目标'
  - '- 执行案红绿灯：完成标绿、延期标红、未开始留白，周复盘只看红项原因与对策'
  - '**典型例子**'
  - '- 秦汉唐儿童游乐：策划案定“3个月招40加盟商、止损投入5万”，执行案周复盘“引流渠道/转化话术/交付SOP”进度'
  - '- 个人副业：策划案定“周投10h/投2000元/连2周日引流<5人止损”，执行案日历化“拍视频/回私信/发货”动作'
  - '**边界条件**'
  - '- 策划案一周一改（微调），执行案一日一看（执行），月度一复盘（迭代）'
  - '- 个人独资可简化为“策略卡+周计划表”，团队协作必须双案完备'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 项目管理。我把它分为两个部分，一个叫策划案，一个叫执行案。
  - 策划案就是一个想法、规划、目标制定；执行案就是人员分工、分解执行、过程监控、结果复盘。
  - 一定要有目标，没有目标的话你自己是懵的。
  - 里程碑是什么意思呢？就是你在做这个项目的过程中，有一些对你来说有关键性的目标叫里程碑。
  - 止损点什么意思呢？就是你做这个事情不用继续了，你做这个事情的最大限度，你能够承担多大的损失。这个止损点包括你的时间成本、还有你的金钱投入、资源投入。
