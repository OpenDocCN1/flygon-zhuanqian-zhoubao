learning_targets:
- 理解私域运营的核心痛点在于前端流量而非私域技巧本身
- 掌握商业项目拆解的三维拆解法（流量、转化、交付）与可复制性三判据
- 熟练运用六维评估模型（流量效率、销转效率、交付效率、客单价、毛利率、复购率）给项目“算账”
- 建立“后发制人”认知：等同行验证3个月以上再入场复制，规避创新风险
- 识别跨平台信息差套利机会，掌握内容搬运/二次创作的平台原生化适配要点
- 能按八步法（找、拆流、拆转、拆交付、评估、定策、搭团、强执）建立个人项目库并筛选
- 理解“策划案+执行案”双案项目管理法与止损点设定原则
- 掌握人力/技术/资源三大杠杆放大副业收入的具体路径
- 辨析红海赛道的真实机会结构：竞争激烈≠无利可图，关键在微调已验证模型
- 掌握‘喂养算法’与搜索挖掘双轨情报获取体系，建立持续商业雷达
- 学会用下拉词零成本捕捉用户真实痛点，指导选品与内容方向
concept_map:
- 第2章：发现与筛选 —— 像猎人一样建立“项目情报库”
- ├── 核心认知重塑
- │   ├── 私域痛点定理：前端流量是私域成败的关键  —— P001
- │   ├── 后发制人原则：等别人验证完再复制  —— P001
- │   ├── 信息差搬运论：A平台的“烂内容”就是B平台的爆款  —— P001
- │   └── 红海不红：红海赛道照样能赚几十万  —— P001
- ├── 情报获取体系
- │   ├── 喂养算法：驯养信息猎犬  —— P001
- │   ├── 搜索挖掘：分辨真伪、泛读筛选、爬虫监测  —— P001
- │   └── 下拉词发现需求：从搜索框“淘金”  —— P002
- ├── 项目拆解与评估
- │   ├── 商业项目拆解：把“赚钱的别人”拆成“可复制的零件”  —— P001, P002
- │   │   ├── 三维拆解：流量端/转化端/交付端
- │   │   └── 可复制性三判据：爆款偶然性/货源可获取性/场景验证性
- │   ├── 六维评估模型：给项目算“复制账”  —— P003
- │   │   ├── 效率三维：流量效率/销转效率/交付效率 → 判断可复制性
- │   │   ├── 财务三维：客单价/毛利率/复购率 → 判断收入天花板
- │   │   └── 补偿机制：效率短板可用财务指标补
- │   └── 案例对比标注：小说推文vs教育资料  —— P003
- ├── 项目库建立与筛选
- │   ├── 项目库归档：按拆解逻辑整理  —— P001
- │   ├── 八步筛选法：找项目→拆流量→拆转化→拆交付→评估→定策→搭团→强执  —— P001
- │   └── 权重打分规则：按六维+个人资源匹配度量化
- ├── 项目落地与管理
- │   ├── 策划案：产品货盘/运营策略/目标/里程碑/止损点/放大点  —— P001
- │   └── 执行案：时间/地点/事项/责任人/阶段目标表格化  —— P001
- └── 放大杠杆体系
- '    ├── 人力杠杆：SOP+兼职按效果付费  —— P001'
- '    ├── 技术杠杆：爬虫批量搬运/二次创作/工业化流水线  —— P001'
- '    └── 资源杠杆：资金/人脉（非大多数人常规路径）  —— P001'
life_analogy:
- 想象你要在陌生城市开一家餐厅（副业项目）：
- '- **私域痛点定理** = **选址（前端流量）比装修（私域运营）更重要**：没人路过的巷子里，厨艺再好也没生意；必须先搞定“门口有人流”。'
- '- **商业项目拆解** = **偷师对面爆款店的“菜单、引流海报、外卖打包流程”**：不光抄菜品，要抄全套“获客-转化-交付”标准动作。'
- '- **六维评估模型** = **给这家店算账**：日均进店多少人（流量效率）、入座率多少（销转效率）、出餐快不快（交付效率）、客单价多少、毛利多高、回头率怎样。'
- '- **后发制人** = **等对面店开半年还排队，你再开分店**：别抢着做第一个吃螃蟹（且可能有毒）的人。'
- '- **信息差搬运** = **把食神节目里火过的菜，改良后放到没看过节目的小区食堂卖**：同一道菜，换个食客群体就是爆款。'
- '- **红海不红** = **满街烧烤摊，依然能开出日入千元的那家**：不是避开竞争，而是在验证过的模型上“微调”（更干净、更快、更懂常客口味）。'
- '- **八步筛选法** = **加盟总部的“选址-试菜-算账-签约-装修-开业-推广-复盘”标准化SOP**。'
- '- **策划案+执行案** = **“商业计划书”+“每日排班表”**：一个定方向、定止损；一个管落地、管进度。'
- '- **三大杠杆** = **请兼职跑腿（人力）、买自动点餐机（技术）、找供应链谈独家低价（资源）**。'
- '- **喂养算法** = **每天固定去同一家早餐店打卡、点赞老板推荐的菜单**，久而久之老板就会主动给你推荐最赚钱的新品（算法推送商业情报）。'
- '- **下拉词挖需求** = **站在菜市场入口听大妈们唠嗑“最近啥菜涨价了/啥海鲜最鲜”**，这才是真实的市场需求信号。'
summary:
- concept: 私域痛点定理
  desc: 私域只是渠道，成败取决于前端是否有稳定流量持续流入
- concept: 商业项目拆解
  desc: 从爆款内容中三维拆解流量/转化/交付链路，复制已验证商业模式而非模仿表面
- concept: 可复制性三判据
  desc: 爆款非偶然、货源可寻、消费场景验证有需求 —— 缺一不可
- concept: 六维评估模型
  desc: 效率三维（流量/销转/交付）判可复制性，财务三维（客单/毛利/复购）判天花板，支持补偿策略
- concept: 后发制人原则
  desc: 等同行跑通3个月以上再入场复制/二创，让别人替你交学费验证模型
- concept: 信息差搬运论
  desc: 渠道间存在天然信息差，把A平台做烂的内容优化搬运到B平台常成爆款
- concept: 红海不红
  desc: 任何红海赛道都不缺年赚几十万的人，关键是找到已验证项目做微调而非盲目创新
- concept: 喂养算法
  desc: 通过主动点赞/收藏/停留商业内容，驯化平台算法持续推送高价值商业情报
- concept: 下拉词挖需求
  desc: 利用百度/微信/小红书/应用商店搜索框下拉推荐词，零成本捕捉用户真实痛点
- concept: 项目库与八步筛选法
  desc: 按拆解逻辑归档项目，按八步（找、拆流、拆转、拆交、评、定、搭、执）权重打分筛选
- concept: 策划案+执行案
  desc: 策划案定方向/止损/放大点；执行案表格化管控时间/事项/责任人/进度，双轮驱动落地
- concept: 止损点
  desc: 预设最大投入界限（时间/金钱/资源），触及即停，避免沉没成本拖垮
- concept: 三大杠杆
  desc: 人力（SOP+兼职）、技术（爬虫/软件批量）、资源（资金/人脉），将收入从1放大到N
exercises:
- 'no': 1
  title: 实战：对一个感兴趣的副业项目做六维打分
  contents:
  - 在抖音/小红书找一个持续发布3个月以上、有明显商业变现迹象的账号（如：教PPT、卖资料、推好物、做咨询）。
  - 按六维模型为该项目打分（1-10分）：
  - '  1. 流量效率：其获客方式（发视频/投流/SEO）对普通人可复制度如何？'
  - '  2. 销转效率：从加微信到成交的标准话术/SOP是否成熟？一对多还是一对一？'
  - '  3. 交付效率：交付是否标准化（资料/软件/课程）？还是重人工服务（陪跑/定制）？'
  - '  4. 客单价：典型订单金额？'
  - '  5. 毛利率：扣除直接成本（货源/佣金/广告）后利润率？'
  - '  6. 复购率：用户是否有自然复购理由（耗材/进阶/会员）？'
  - 回答问题：
  - '- 该项目的“短板维度”是哪个？能否用“长板维度”补偿（如交付重但客单价高）？'
  - '- 若你操盘，六维权重如何调整（如你擅长技术→可承担低交付效率）？'
  - '- 该项目是否满足“可复制性三判据”？请逐条论证。'
- 'no': 2
  title: 实战：跨平台信息差搬运演练
  contents:
  - 在抖音搜索一个成熟赛道关键词（如“避坑指南”、“整理收纳”、“副业推荐”），找3条点赞10万+、发布时间超过1个月的爆款视频。
  - 在小红书/视频号/公众号搜索同主题，对比内容呈现差异：标题风格、封面排版、话术节奏、评论区引导方式。
  - 选择1条视频，制作“原生化改造版”：重写标题、重做封面、按目标平台话术改写文案/脚本、调整发布时间。
  - 回答问题：
  - '- 原视频的核心“卖点/钩子”是什么？改造时你保留/放大/削弱了哪些要素？'
  - '- 目标平台用户对“硬广/引流”的容忍度如何？你如何设计“安全钩子”（如主页背景图/置顶笔记/私信回复关键词）？'
  - '- 若该内容在目标平台已有大量同质化，你的“微调”差异化在哪里（人群更细/场景更真/福利更实）？'
- 'no': 3
  title: 实战：为一个拟开展项目写“策划案”骨架 & 设定“止损点”
  contents:
  - 假设你决定复制上练习1中的项目，按“策划案”模板填写：
  - '  1. 产品货盘：引流品（免费/低价）、盈利品（主力）、高利润套餐/高客单（后端）的具体形态与定价。'
  - '  2. 运营策略：流量端（哪个平台、什么内容形式、日更几条）、转化端（加微信路径、话术框架、成交周期）、交付端（标准化交付物、SOP关键节点）。'
  - '  3. 目标与里程碑：第1周目标（跑通首单）、第1月目标（稳定日单量）、第3月目标（收入/规模）。'
  - '  4. 止损点：设定三条红线——时间成本上限（如每周不超10小时）、金钱投入上限（如不超2000元）、关键指标底线（如连续2周日引流<5人）。'
  - '  5. 放大点：人力杠杆（哪步可外包兼职）、技术杠杆（哪步可用工具/脚本）、资源杠杆（可复用的渠道/供应链/社群）。'
  - 回答问题：
  - '- 你的止损点是基于“可承受损失”还是“预期收益”设定的？两者有何区别？'
  - '- 里程碑设定是否具备“可验证性”（如“日引流50人”优于“努力发视频”）？'
  - '- 若第1月未达标，你的“备选策略”（Plan B）是什么？是否已在策划案中预留？'
- 'no': 4
  title: 思辨：为什么“红海赛道反而更适合普通人后发制人”？
  contents:
  - 素材主张：任何红海赛道都不缺年赚几十万的人，关键是找到已验证项目做微调。
  - 请结合“六维模型”与“可复制性三判据”论证：
  - '- 红海赛道的“高竞争”在六维中主要体现在哪个/些维度？（提示：流量效率/销转效率）'
  - '- 为什么“已验证项目做微调”比“蓝海赛道从0创新”更符合普通人资源禀赋？'
  - '- 什么情况下红海赛道确实“不可做”？（提示：强个人IP/独家供应链/重资质/平台打击期）'
  - 写出你的判断清单：评估一个红海项目“是否值得入场”的5个核心判断项。
- 'no': 5
  title: 工具：搭建你的“每日商业情报雷达”（喂养算法+搜索+下拉词）
  contents:
  - 操作步骤（建议连做14天形成习惯）：
  - '  1. 新注册/清理一个抖音号、小红书号、微信“文件传输助手”笔记。'
  - '  2. 每天固定20分钟：在目标平台搜索“副业/赚钱/项目拆解/行业案例”等词，对前20条商业属性强的内容：点赞、收藏、评论（提问/复述痛点）、转发至文件传输助手。'
  - '  3. 每周六汇总：打开收藏/转发内容，按“赛道/渠道/变现模式”分类，挑选3个符合“可复制性三判据”的项目，按八步法第2-4步（拆流量/拆转化/拆交付）做简易拆解记入项目库。'
  - '  4. 每月月初：用百度/微信/小红书/应用商店搜索框输入核心赛道词（如“AI绘画/宠物/考研/露营”），记录下拉推荐词前10位，筛选出3个“搜索量大、竞品内容少”的长尾词作为下月选题/产品方向。'
  - 回答问题：
  - '- 经过2周喂养，算法推荐内容的“商业浓度”是否显著提升？有何感知变化？'
  - '- 下拉词中发现的“用户真实痛点”与你原本设想的“卖点”有何冲突/偏差？'
  - '- 项目库中目前积累了多少个项目？通过权重打分，Top3分别是？为什么？'
units:
- 'no': 1
  name: 私域痛点定理：前端流量是私域成败的关键
  points:
  - '**为什么需要这个概念？**'
  - '- 多数人把精力花在私域运营技巧上，却忽略了流量来源'
  - '- 私域只是渠道，没有前端流量进来，运营再好也是空中楼阁'
  - '- 解决“从哪来”的问题，比解决“怎么转”更本质'
  - '**核心定义**'
  - '- 私域运营的痛点不在于私域本身怎么做，而在于如何搞定前端的流量来源'
  - '- 前端流量 = 每个月是否有稳定的流量持续流入私域池'
  - '**关键性质**'
  - '- 因果倒置：流量是因，转化是果；无因必无果'
  - '- 通用性：无论卖货、卖课、卖服务，前端流量都是第一块拼图'
  - '**典型例子**'
  - '- 秦汉唐案例：做了大量私域培训、SOP、员工考核，但因前端流量未打通，最终项目失败'
  - '- 反之，儿童游乐项目：先通过爆款视频验证流量获取模型，再搭建后端转化，3个月变现40万'
  - '**边界条件**'
  - '- 仅适用于需要持续获客的商业模式，不适用于纯存量运营或品牌维护场景'
  - '- 前端流量打通后，仍需最小可行转化链路承接，否则流量即浪费'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 私域只是一个渠道，是帮助我们企业更好地跟客户建立关系和发展粘性的一个渠道，其实更重要的是前端的流量，你有没有打开流量，每个月是否有稳定的流量进来。
  - 所以私域的痛点不在于私域怎么做，而是前端流量如何来。
  - 如果项目前面流量的问题没有搞定的话，都没有用！
- 'no': 2
  name: 商业项目拆解：把“赚钱的别人”拆成“可复制的零件”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人缺乏从零发明商业模式的能力，但擅长模仿和复制'
  - '- 直接模仿表面动作（发什么视频）容易踩坑，必须拆解底层链路'
  - '- 需要一套标准化的“拆解-评估-复制”流程，降低试错成本'
  - '**核心定义**'
  - '- 从爆款内容中发现商业案例，拆解其流量获取、转化链路、产品交付三大核心模块'
  - '- 不是模仿表面内容，而是复制已验证的商业模式底层逻辑'
  - '**关键性质**'
  - '- 三维拆解：流量端（怎么引流）、转化端（怎么卖）、交付端（怎么给）'
  - '- 可复制性评估：看爆款偶然性、货源可获取性、消费场景验证性'
  - '**典型例子**'
  - '- 文川手写Logo：拆解出“创意生产固定+设计外包大学生+中间赚差价”模型'
  - '- 艺术签名：拆解出“持续发内容引咨询+9.9元/单+免费素材网交付”模型'
  - '**边界条件**'
  - '- 仅适用于已有同行跑通3个月以上的项目，不适用于全新未验证赛道'
  - '- 核心资源（如独家货源、个人IP）不可复制时，该模型失效'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: improve
  excerpts:
