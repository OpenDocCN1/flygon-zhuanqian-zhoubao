learning_targets:
- 理解自动化工具如何解决跨平台信息流转的个人化需求
- 掌握 IFTTT 平台「如果这样，就会那样」的核心心智模型与 Applet 组装方式
- 区分触发器（Trigger）与动作（Action）在自动化任务中的职责分工
- 能够使用 Webhook 地址将消息推送到企业微信、钉钉等群聊工具
- 能评估零代码自动化方案的适用边界与免费额度限制
concept_map:
- 零代码自动化
- ├── IFTTT 平台
- │   ├── 定义：无需写代码的连接不同应用的自动化服务
- │   ├── 核心心智模型：If This Then That（如果这样，就会那样）
- │   └── Applet：用户组装的自动化任务（免费限额 2 个）
- ├── 触发器（Trigger）
- │   ├── 职责：监听「事件发生」的条件（因果链的「如果」）
- │   └── 案例：Twitter「指定用户更新推特触发」，需绑定自己的账号+监控账号
- ├── 动作（Action）
- │   ├── 职责：执行「事件发生后」的结果（因果链的「那样」）
- │   ├── 路径一：Email 推送（零配置首选，适合快速验证）
- │   └── 路径二：Webhook 推送（实时性强，适合团队协作）
- ├── Webhook
- │   ├── 定义：访问特定 HTTP 地址并携带规定格式内容即可推送消息的通用机制
- │   ├── 企业微信群机器人为典型载体
- │   ├── 鉴权简单：逻辑内置于地址（token）中
- │   └── 边界：群含「外部联系人」则无法创建机器人
- └── 应用边界
- ├── 免费额度：仅 2 个推送机器人，更多需付费
- ├── 平台依赖：触发源受第三方 API 策略影响
- └── 可迁移性：支持 Webhook 的平台（钉钉等）均可复用
life_analogy:
- 想象自动化工具是一个**贴心的私人助理**：
- '- **IFTTT** = 这位助理的服务台'
- '- **If This（触发器）** = 助理盯着的信号灯，比如“老板一发朋友圈就告诉我”'
- '- **Then That（动作）** = 助理听到信号后做的事，比如“立刻发微信通知你”'
- '- **Webhook** = 助理手中那条专属的“快递专线”，直接把消息塞进你的群聊'
- '- **Applet** = 你给助理下达的一张“注意事项卡片”，写清条件和动作'
- 就像助理帮你盯梢跑腿，IFTTT 也在 7x24 小时替你监控事件、执行响应。
summary:
- concept: IFTTT 自动化平台
  desc: 无需写代码、以「如果这样，就会那样」逻辑连接不同应用的自动化服务
- concept: 触发器（Trigger）
  desc: 自动化任务的「如果」条件部分，负责监听事件是否发生
- concept: 动作（Action）
  desc: 自动化任务的「那样」结果部分，负责执行事件发生后的响应
- concept: Webhook
  desc: 一种访问特定 HTTP 地址携带规定内容即可推送消息的通用机制
- concept: 零代码自动化
  desc: 用工具直接满足个人化需求，而非自研软件的方法论
- concept: Applet 逻辑
  desc: 「如果这样了，那就会那样」的普适理解框架，可衍生多元玩法
- concept: 免费额度与边界
  desc: 免费仅 2 个机器人，群含外部联系人无法创建机器人
exercises:
- 'no': 1
  title: 设计一个自己的自动化 Applet
  contents:
  - 结合 IFTTT 的「If This Then That」逻辑，为以下场景设计自动化方案：
  - 场景：你关注的一位行业 KOL 在新浪微博发布新动态，你想第一时间收到通知，但不想频繁刷微博。
  - 1. 明确触发器（Trigger）应该是什么？需要哪些参数？
  - 2. 明确动作（Action）可以选择哪些？每种动作的优劣是什么？
  - 3. 画出该自动化任务的因果链示意图。
  - 4. 思考：若该 KOL 只在国外平台（如 X/Twitter）活跃，你的方案需要做哪些调整？
  - 回答问题：
  - '- 如果该平台不支持 Webhook，你还有哪些备选推送方式？'
  - '- 如何评估这个自动化方案是否值得搭建（成本 vs 收益）？'
- 'no': 2
  title: 推演 Webhook 请求体的格式与字段
  contents:
  - 给定以下企业微信群机器人的 Webhook 地址：
  - https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx-xxxx-xxxx
  - 素材中使用的 JSON 请求体为：
  - '```'
  - '{'
  - '  "msgtype": "markdown",'
  - '  "markdown": {'
  - '    "content": "> 账号:{{UserName}} \n> 内容:{{Text}}\n> 链接:{{LinkToTweet}}"'
  - '  }'
  - '}'
  - '```'
  - 1. 解释上述 JSON 中 `msgtype`、`markdown`、`content` 三个字段各自的作用。
  - '2. 若想对群聊发送一条「文本类型」的消息，且内容为“Stock price alert: ABC is up 5%”，请改写请求体。'
  - 3. 思考：`{{UserName}}` 这类占位符在 IFTTT 中是如何被替换的？
  - 4. 若推送的消息包含敏感链接，你会如何设计 content 的内容以降低风险？
  - 回答问题：
  - '- 为什么企业微信要求使用 markdown 类型而不是纯文本类型？'
  - '- 若将同样的请求体发送到钉钉的 Webhook 地址，会有哪些差异？'
- 'no': 3
  title: 评估零代码自动化的适用边界
  contents:
  - 考虑以下三个自动化需求，分别判断是否适合用 IFTTT/零代码工具实现，并说明理由：
  - 需求 A：监控某电商平台 5 个关键词的价格，降价超过 10% 时推送通知给自己。
  - 需求 B：将某公众号每日更新的文章自动同步到自己的知识星球。
  - 需求 C：根据用户输入的不同问题，自动生成定制化回复（含多条件分支判断）。
  - 1. 对每个需求，判断：该需求是否小众/琐碎？是否值得自研？
  - 2. 对适合用零代码工具的需求，设计触发器与动作；对不适合的，说明局限在哪里。
  - 3. 若需要处理多个需求的叠加（如 A+B 同时运行），免费额度是否足够？
  - 回答问题：
  - '- 零代码工具的能力覆盖有限，哪些类型的逻辑它们无法实现？'
  - '- 涉及商业敏感数据时，使用第三方自动化平台有哪些隐私风险？'
