paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
desc: 该素材是一位传统金融分析师转型Web3创业者的经验分享，从背景、探索、展望未来三个方面阐述其转型历程，剖析了传统金融萎缩与Web3兴起的原因，指出跨境电商、VR/AR、新能源等热门赛道的机会与局限，并通过实际参与DeFi项目得出结论：Web3是基于区块链且能与现实交互的互联网生态，其市场融资规模剧增（十年创造3万亿流动价值），但熊市生存关键在于敬畏市场、保护团队弹药并控制风险，最终强调选择比努力更重要以及容错率的必要性。
concepts:
- name: Web3（基于区块链的互联网生态）
  desc: Web3是一种基于区块链技术的互联网生态，能够实现与现实世界交互的虚拟世界，是传统互联网的演进形态，强调以虚促实的经济趋势。
  is_original: true
  excerpt:
  - 什么是Web3? 是一种基于区块链技术的互联网生态，并且还能实现与现实世界交互的虚拟世界。
  - 随着2021年元宇宙、NFT、DiFi等市场热度词的火爆，国内外都掀起了一阵元宇宙热潮……都可以表明现实与虚拟之间的交互将会成为一种大趋势，同时会制造出更多的就业岗位。
  - 各大厂也都开始推出自己平台的NFT和线下结合，而这也符合国内所说的以虚促实的经济趋势。
- name: 以虚促实经济趋势
  desc: 指Web3、NFT等虚拟经济与实体经济结合的趋势，各大厂推出平台NFT并与线下结合，促进虚实融合的经济模式。
  is_original: true
  excerpt:
  - 各大厂也都开始推出自己平台的NFT和线下结合，而这也符合国内所说的以虚促实的经济趋势。
methods:
- name: __overview__（传统金融转型Web3的行业扫描与躬身入局方法论）
  desc: 该方法通过分析市场风向标与热度词、区分跨境电商/VR/AR/新能源/Web3多赛道机会、以初学者身份参与初创项目并结合金融资源快速验证可行性，同时积极参加线上线下分享会结识VC，从而完成从传统金融到Web3的转型探索。
  excerpt:
  - 2021年上半年开始，我对市场上的风向标和热度词也特别敏锐，时刻留意研报中各行各业市场的需求性。
  - 跟两个公司的合伙人说了下我的想法，自己另外去开辟Web3的赛道。然后我用金融圈的资源找到了一些国内Web3的初创团队，以一个初学者的身份参与进去。因为只有自己参与项目，才能快速的摸透行业的可行性。
  - 平时也会积极的参加一些Web3的线下或线上分享会，结识到不少行业VC。
theorems:
- name: 选择比努力更重要，且容错率决定风险控制
  desc: 核心观点：在Web3赛道选择上，前期资金规模决定关注赛道，选择比努力更重要；同时从金融视角要给自身一定容错率，不能早期All in单一方向以控制风险。
  excerpt:
  - 有句老话，选择比努力更重要。在看赛道之前，在于你前期资金规模有多大，再决定要关注什么赛道。
  - 从金融的角度来说，要给自己一定的容错率，如果在早期仅仅是ALL IN在一个方向，风险并不是特别好控制。
findings:
- name: Web3融资资金池大幅加深
  desc: '[evidence] 该发现由作者引用的机构数据和行业统计支撑：Web3市场10年内创造3万亿美元流动价值，与全球传统创投基金总规模相当；Polychain、Paradigm、a16z等专精公司管理数十亿至数百亿美元；全球对冲基金计划5年内将7%资产投入Web3。'
  excerpt:
  - Web3市场在10年内创造了3万亿美元的流动价值，已足以与传统投资基金投资的初创公司的总价值相媲美。
  - Polychain、Paradigm、a16z、Multicoin、3AC以及一些其他专精的公司各自管理着数十亿或数百亿美元的资金。
  - 全球大量对冲基金正计划5年内将其资产的7%投入到web3的市场中，巨无霸养老基金也开始酝酿直投了。
- name: 熊市生存的必要条件是敬畏市场与保护团队弹药
  desc: '[claim] 作者宣称：真正活下来的老鸟都懂敬畏市场并与市场共舞，年轻团队领袖应保护团队不受市场崩塌连锁反应影响（如FTX事件导致的连环暴雷），并强调‘不要浪费弹药’、选择资金充裕的基建公司是熊市更好选择。'
  excerpt:
  - 真正活下来能够完成远航的老鸟，都懂一句话：“敬畏它，并且与它共舞”。
  - 而如果你们是一个初次接触并投身于Web3市场的年轻团队领袖，请尽你所能保护你们的团队和成员不受市场崩塌的连锁反应影响，特别是近期FTX事件导致的连环暴雷。
  - 在此温馨提示各位从事Web3的小伙伴：“不要浪费弹药”。如果你是一个有抱负的Web3公司的员工，在签约之前，记得去问招聘人员他们公司的赛道情况以及现金情况。在一个拥有大量资金弹药的“基建公司”工作绝对不是个坏的选择，这在熊市会是更好的选择。
