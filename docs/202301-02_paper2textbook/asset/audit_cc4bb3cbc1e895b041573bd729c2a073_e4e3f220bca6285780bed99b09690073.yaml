unsupported_claims:
- location: '37.4'
  claim: 作者实测：小红书3个月从0涨粉8000、变现5万；20分钟产出10万赞藏大爆文，1万粉变现20万。
  reason: 素材中未找到支撑该具体数据的原始出处，仅在P005中提到类似成果但无详细验证细节
- location: '37.5'
  claim: 作者小红书/抖音发<200篇SEO内容，大半月不更新仍每天有人主动咨询。
  reason: 素材中未找到该具体数据的原始出处，P011仅提到'发<200篇SEO内容'但无'大半月不更新仍每天有人主动咨询'的验证数据
- location: '37.8'
  claim: 把月入3000的号复制30遍，远比把1家店做到月入10万容易。
  reason: 素材中虽有该论述(P005, P011)，但缺乏具体数学推导与实测数据支撑，属于经验之谈而非验证结论
- location: '37.11'
  claim: 内容价值金字塔三层结构：娱乐、工具、方法及其变现逻辑。
  reason: 素材中P006和P011对三层定义一致，但'变现难度/客单价/留存/复购率'的量化表格为教科书综合整理，非素材原文直接给出
- location: '37.12'
  claim: TikTok无人直播硬改设备（如小米8、谷歌3）存在10分钟至10天不等的寿命风险。
  reason: 素材中P011提到'时间短的仅仅十分钟...慢的话跑个十天半个月'，但未明确列出'小米8'机型，仅提到'谷歌3'
