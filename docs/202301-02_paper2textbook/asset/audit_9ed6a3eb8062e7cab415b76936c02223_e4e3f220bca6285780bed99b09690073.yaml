unsupported_claims:
- location: ch4.2
  claim: 信息差思维：发现并复制已验证项目 -- P001
  reason: P001原文中未出现“信息差思维”这一术语，该概念是由本书作者在4.3节中提出的。4.2节的概念地图早于4.3节的定义，可能给读者造成该术语源自P001的误导。
- location: ch4.2
  claim: 后发制人：做项目不追求原创，也不做赌博式的 All in，而是等待时机成熟再下场收割（素材 ID：P001，origin）
  reason: P001原文中未出现“后发制人”这一术语或对“等待时机成熟再下场收割”这一观点的直接表述。该观点可能是由本书作者在4.3节中基于P001的素材进行归纳的。
- location: ch4.2
  claim: 信息差搬运论：此理论解释了为何“抄作业”如此可行：因为不同平台、不同人群之间存在天然的信息不对称，这为搬运和复制提供了广阔的空间。
  reason: 在提供的素材中，没有找到关于“信息差搬运论”的表述，这是本书作者在4.3节中提出的新概念。
- location: ch4.4
  claim: 商业拆解八步法：这个工具将看似模糊的“模仿”过程，转化为八个可执行的、逻辑严谨的步骤，打破了“看到别人赚钱→自己也去做”的模糊直觉。—— 来源：《I9OAdzzs2oBliNxsmPjcHnBUnzf.md》，素材
    ID：P001，origin
  reason: P001原文中并未明确阐述“商业拆解八步法”（第一步至第八步）这一名称。原文categorized的步骤与中国传统八步法不完全对应，本书作者将其命名为“商业拆解八步法”并定义为聚合逻辑。
- location: ch4.4
  claim: 可复制性判定三标准（素材 ID：P001，origin）：第一，非偶然爆发。第二，货源可寻。第三，消费场景验证有需求。
  reason: P001原文中提供了这段引文但没有明确将其命名为“可复制性判定三标准”。将此引文包装成独立的三标准体系是本书作者的建构，并非P001的直接内容。
- location: ch4.5
  claim: 六维模型是衡量项目的六个指标：流量效率、销转效率、交付效率、客单价、毛利率、复购率。——来源：《NxhWdJj3UoPKvmxaBqkcz8wlntf.md》，素材
    ID：P002，origin
  reason: P002原文中并未明确使用“六维评估模型”这一术语，书中将其命名为“六维评估模型”是作者组建的抽象分类。P002提出的六点是：流量效率，销转效率，交付效率，客单价，毛利率，复购率。
- location: ch4.5
  claim: “流量效率高，意味着内容极其好复制，可以通过矩阵，培训等方式，把这一块单独拎出去，进行放大。” ——《NxhWdJj3UoPKvmxaBqkcz8wlntf.md》（素材
    ID：P002，origin）
  reason: 该引文为Diluted可作参考，原文中说的是“流量效率高，意味着内容极其好复制，可以通过矩阵，培训等方式，把这一块单独拎出去，进行放大。” 素材中原文是“流量效率高意味着内容极其好复制，可以通过矩阵，培训等方式，把这一块单独拎出去，进行放大。”书中的确引用了这句话。
- location: ch4.5
  claim: 六维满足度及格线定理（本章在原文基础上提炼的表述，素材 ID：P002，origin）
  reason: 原文中的表述是“六个点，满足的越多越好，满足四个点，及格”。这是对原始素材的总结。
- location: ch4.5
  claim: '"收入 = 流量 × 转化率 × 客单价 × 毛利率"'
  reason: 该公式为本书作者推导，素材中没有明确列出此公式。
- location: ch4.6
  claim: 五维评估模型是衡量项目的六个指标：流量效率、销转效率、交付效率、客单价、毛利率、复购率。
  reason: P002原文中并未提出包含客单价、毛利率、复购率的“六维评估模型”。书中“宣称”这是P002的核心，但原文并未将财务指标纳入同一“模型”。
- location: ch4.6
  claim: 项目拆解IP（含高客单价补偿低效率）的“月收益为10W~200W”，源自P002。
  reason: P002原文明确提到项目拆解商业IP（小徐和他自己），月收益10W到200W。
- location: ch4.6
  claim: 多源对照与共识——收入量级的差异，主要由客单价和毛利率的乘积决定。
  reason: 该结论是本书作者的总结，并非P002原文的直接表述
- location: ch4.6
  claim: 5. 知识付费——六维中的“五边形战士”
  reason: 这种“五边形战士”的标签是本书作者对P002案例的重新诠释。
- location: ch4.7
  claim: '"补偿机制的上限在哪里？...这就是为什么“满足四个点及格”会被作为经验性的判断基准。"'
  reason: 这是作者的推论性总结，而非P002的直接引用。
