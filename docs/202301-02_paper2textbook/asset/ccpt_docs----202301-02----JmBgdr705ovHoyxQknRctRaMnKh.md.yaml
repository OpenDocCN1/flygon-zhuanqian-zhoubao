paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
desc: 本文档由一位前互联网架构师分享其短视频带货矩阵项目的自动化实现方法，核心贡献在于提出了一套将爆款视频模板化、元素化，并通过代码实现原创视频批量生成与跨平台自动发布的完整方法论。文档主张通过“1比1模仿爆款”保证内容质量底线，通过“元素随机取用+混淆元素”实现批量内容的差异化与原创性，并强调该流程可标准化、可复制到其他赛道从而规模化放大带货能力。
concepts:
- name: 流量视频 vs 带货视频
  desc: 每个赛道的短视频内容都被划分为两类：流量视频用于拉曝光、涨粉和打标签，带货视频用于直接促成销售转化。这是内容自动化生产的第一步分类。
  is_original: true
  excerpt:
  - 每个赛道的视频内容也都有两种：流量视频和带货视频。流量视频是拉曝光涨粉打标签用的，针对要做的客户人群画像，找到对标账号，找出当下流行的爆过的那些流量视频
  - 带货视频也是一样的路子。用这样验证过的流量视频或者带货视频当模板，是要保证1比1模仿做出的内容都是60分以上的。
- name: 视频模板元素化拆解
  desc: 提出所有短视频都可以被拆解为六种基本元素（背景、标题、内容、文案、字幕、背景音乐），这是实现视频自动生成的核心抽象模型。
  is_original: true
  excerpt:
  - 所有的视频都可以拆成以下元素：1. 背景：图或者视频 2. 标题：主、副标题 3. 内容：图、视频 4. 文案：5. 字幕：6. 背景音乐：
  - 视频模板有各种各样的形式，拆解的多了会发现其实都是上面提到的那些元素组成的
- name: 混淆元素机制
  desc: 在自动生成的视频中加入自己拍摄的照片和视频作为混淆元素，以保证生成内容在平台上能通过原创审核。
  is_original: true
  excerpt:
  - 每个视频的生成时都加一些混淆元素，用自己拍的照片和视频
  - 再加上混淆元素，这样能保证做出来的视频都是原创视频，且每个视频生成的都不相同，在任何一个平台都能过原创。
methods:
- name: __overview__
  desc: 一套完整的从选品、找模板到自动生成、自动发布的内容矩阵自动化方法论，将短视频带货的全流程标准化并程序化。
  excerpt:
  - 首先每个赛道短视频带货都是有方法的，我做过中医养生号、教辅号，从起号到变现，这个流程可以标准化。
  - 所以直接1比1模仿当下的爆款视频去做原创。
  - 现在内容自动化生产和发布已经比较稳定了，需要花费的精力主要就是选品和更新视频模板，这个需要选品能力和内容把控能力
- name: Step1 视频模板拆解法
  desc: 将任意爆款视频拆解为背景、标题、内容、文案、字幕、背景音乐六个独立元素，并对每个元素分别定位其具体形式，以便后续逐一寻找替代素材。
  excerpt:
  - Step1、拆解视频模板：所有的视频都可以拆成以下元素：1. 背景：图或者视频 2. 标题：主、副标题 3. 内容：图、视频 4. 文案：5. 字幕：6.
    背景音乐：
  - 举例，第一个流量视频模板可以拆解为：背景：一张中医大师的照片，放大模糊；标题：请等一下，xxxx；内容：一张中医大师的照片；文案：国医大师xxx；字幕：无；背景音乐：
- name: Step2 相似素材搜集法
  desc: 针对拆解出的每个元素去寻找形式相似的替代素材，如背景图、内容素材、背景音乐等。
  excerpt:
  - Step2、找素材：找这个视频模板拆解后的每个元素相似的素材，比如背景图，内容素材、背景音乐等。
  - 举个例子，第一个流量视频模板的背景和内容素材是一张中医大师的照片，第二个的背景是中医相关的视频，内容素材就是中医大师的照片，去找相关的素材就可以了。
- name: Step3 原创视频自动生成法
  desc: 基于拆解出的元素和准备好的素材编写代码自动生成视频，并通过“素材随机取用”、“时间段随机取用”和“混淆元素”三个手段确保批量视频的差异性和原创性。
  excerpt:
  - Step3、原创视频内容自动生成：每个元素的素材准备好以后，就可以写这个视频模板的自动生成视频代码了。
  - 这里有几个方法：1、每个素材随机取用 2、如果模版视频有多个片段，那么每个片段素材内的时间段也随机取用 再加上混淆元素，这样能保证做出来的视频都是原创视频，且每个视频生成的都不相同
- name: Step4 自动发布法
  desc: 开发自动发布工具，实现每天向抖音、视频号等多平台多账号自动发布批量生成的视频，基本无需人工干预，实现一鱼多吃。
  excerpt:
  - Step4、自动发布：有了内容自动生成能力之后，每天能生产很多的视频，视频内容自由了。
  - 视频生产出来之后，可以往多个平台发布，一鱼多吃，所以就开发了自动发布工具，每天往多平台多账号自动发布视频，基本不需要人工干预。平台主要是抖音和视频号。
- name: 底层工具模块抽取法
  desc: 在编写多个视频模板的生成代码过程中，将可复用的代码抽取成底层的工具模块，使后续新模板的开发时间缩短到几分钟。
  excerpt:
  - 写的模板多了就会发现很多方法都可以共用，把他们抽出来做成底层的工具模块，以后再有新的视频模板，拼一下就出来了，很简单。
  - 现在几分钟就能实现一个新的模板，抖音上看到的视频只要不是特效很多，基本都能做，只要拆解清楚就可以。
theorems:
- name: 原创优于二剪优于搬运原则
  desc: 在内容创作方式上，原创内容的质量和平台友好度最高，次之是二次剪辑，最后才是搬运，因此应优先做原创。
  excerpt:
  - 内容创作上，原创优于二剪优于搬运，所以直接1比1模仿当下的爆款视频去做原创。
- name: 1比1模仿保底原则
  desc: 通过模仿已经验证过的爆款流量视频或带货视频作为模板，能保证1比1模仿做出的内容质量都在60分以上，避免低质内容。
  excerpt:
  - 用这样验证过的流量视频或者带货视频当模板，是要保证1比1模仿做出的内容都是60分以上的。
- name: 差异化生成保障原创原则
  desc: 通过素材随机取用、时间段随机取用和结合混淆元素，可以确保自动生成的每个视频内容都不相同且能通过任何平台的原创审核。
  excerpt:
  - 1、每个素材随机取用 2、如果模版视频有多个片段，那么每个片段素材内的时间段也随机取用 再加上混淆元素，这样能保证做出来的视频都是原创视频，且每个视频生成的都不相同，在任何一个平台都能过原创。
findings:
- name: 视频模板元素构成规律
  desc: '[evidence] 通过拆解大量各种形式的视频模板（包括流量视频和带货视频）发现，所有视频最终都由背景、标题、内容、文案、字幕、背景音乐这六种元素构成，因此实现逻辑基本一致。'
  excerpt:
  - 视频模板有各种各样的形式，拆解的多了会发现其实都是上面提到的那些元素组成的，比如相对复杂一些的：这三个有带货视频也有流量视频，但是模板拆解以后，实现起来都差不多。
- name: 自动化短视频带货的变现可行性
  desc: '[claim] 作者宣称通过一个朋友在中医养生号赛道做三个号数月变现10w左右的案例，论证了该赛道的带货能力，并由此得出该流程可以标准化规模化放大的结论。'
  excerpt:
  - 当时中医养生号短视频带货还比较火，有一个朋友正巧在做，做了三个号几个月变现了10w左右
  - 他给我详细说了一下中医养生赛道从起号到变现的过程，我当时就冒出一个想法，这事可以标准化规模化来搞。
- name: 免费流量时代矩阵化数量取胜的必然性
  desc: '[claim] 作者认为在当前免费流量获取难度增加的环境下，唯有通过矩阵化的方式靠内容数量获取更多免费流量，才能提高爆单概率，因此批量原创内容生产成为关键问题。'
  excerpt:
  - 现在想用免费流量做短视频带货不像之前那么容易了，通过矩阵的方式靠量获取更多的免费流量，这样才能增加爆单的概率
  - 所以'如何解决原创视频内容的批量生产'就是一个关键问题了，相比手动剪辑视频，自动化生产是个很好的解决方案。
