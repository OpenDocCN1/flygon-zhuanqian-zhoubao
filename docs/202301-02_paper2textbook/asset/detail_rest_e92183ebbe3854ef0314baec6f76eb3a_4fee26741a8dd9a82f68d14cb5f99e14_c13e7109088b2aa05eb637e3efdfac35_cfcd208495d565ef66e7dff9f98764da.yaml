learning_targets:
- 理解为什么多数副业失败源于'从零发明'而非'复制已验证模式'
- 掌握商业项目拆解的核心逻辑：从爆款中找到流量、转化、交付三大链路
- 学会判断项目可复制性的三大标准，避免掉入'伪机会'陷阱
- 能运用'后发制人'思维，在降低试错成本的同时找到自己的微创新切入点
- 建立'卖空气/软文先行'的逆向产品思维：先验证需求，再投入开发
concept_map:
- 商业项目拆解
- ├── 为什么要拆解
- │   ├── 多数副业失败：从零发明而非复制已验证模式 —— P001, P002
- │   ├── 单案例难复制：需先理解内在链路 —— P001
- │   └── 后发制人：等别人验证月余再入场降低试错成本 —— P001
- ├── 拆什么
- │   ├── 流量获取方式：固定内容分享 / 投放 —— P002
- │   ├── 转化链路：直播间 / 私域社群 / 朋友圈+私聊 —— P002
- │   └── 产品交付方式：有形 / 无形、客单价、同行做多久 —— P002
- ├── 可复制性判定三标准
- │   ├── 爆得非偶然 —— P001
- │   ├── 货源非独家（可另寻渠道） —— P001
- │   └── 消费场景验证有需求 —— P001
- └── 拆解后的行动
- ├── 六维模型评估：流量/销转/交付效率 + 客单价/毛利率/复购率 —— P003
- ├── 结合自身擅长点微创新，避免照搬水土不服 —— P001, P002
- └── 案例验证：儿童游乐（3月40W）、文川手写logo（599差价） —— P002
life_analogy:
- 想象商业项目拆解是一个**厨师拆解招牌菜**的过程：
- '- **爆款视频** = 别人店里排队到街角的招牌菜'
- '- **流量获取** = 这道菜吸引食客的摆盘和香气（表面功夫）'
- '- **转化链路** = 顾客从进门到点这道菜的引导动线（菜单设计、服务员推荐）'
- '- **产品交付** = 后厨真正端上桌的那道菜（实打实的产物）'
- '- **可复制性** = 这道菜能否用常见食材复刻，而不是靠独家秘方和运气'
- 就像厨师不靠灵感发明新菜，而是拆解爆款菜品的可复制配方；副业成功不是从零创造，而是把赚钱的商业模式拆成能复制、能微调的零件。
summary:
- concept: 商业项目拆解
  desc: 从爆款中发现可复制的副业项目，拆出流量、转化、交付三大底层链路的过程
- concept: 私域前端流量
  desc: 私域只是渠道，真正决定成败的是前端是否有稳定流量进来——先解决流量，再谈转化
- concept: 后发制人
  desc: 不追求原创、不做赌注式all in，等别人验证项目可赚后复制或二次创作，降低试错成本
- concept: 可复制性三标准
  desc: 爆红不靠偶然、货源非独家、消费场景验证有需求——三条满足才可低成本复制
- concept: 信息差搬运论
  desc: 渠道间存在信息差，把A平台做烂的内容优化后搬到B平台，可能瞬间爆火
- concept: 软文先行/卖空气
  desc: 先写软文、卖预售验证需求，再决定是否开发——软件的本质就是软文
- concept: 喂养算法与情报挖掘
  desc: 通过主动点赞/收藏/停留引导平台推荐商业情报，建立持续稳定的项目信息源
- concept: 六维项目评估模型
  desc: 用流量/销转/交付三效率判断可复制性，用客单价/毛利率/复购率判断收入天花板
- concept: 红海赛道不红
  desc: 任何红海赛道都不缺年赚几十万的人，找到已验证项目做微调即可进场
exercises:
- 'no': 1
  title: 拆解一个你刷到的爆款视频
  contents:
  - 打开抖音或小红书，找到一条你认为'能赚钱'的爆款商业视频（点赞>5W），回答以下问题：
  - 1. 流量获取：这个账号通过什么固定内容形式引流？（口播、情景剧、图文笔记？）
  - 2. 转化链路：视频如何引导用户成交？（挂车、私信引导、评论区暗号？）
  - 3. 产品交付：它卖的是有形产品还是无形服务？客单价大概多少？
  - 4. 可复制性：用'爆得非偶然、货源非独家、场景有需求'三标准判断能否复制？
  - 5. 微创新：如果你来做，你擅长的哪些点可以做差异化调整？
  - 提示：不要只看表面形式，要拆到'链路'层面，即对方连续做了几个月且稳定赚钱的动作。
- 'no': 2
  title: 六维模型实战：给三个项目打分
  contents:
  - 用六维模型（流量效率、销转效率、交付效率、客单价、毛利率、复购率）评估以下三个项目，每个维度按高/中/低打分：
  - 1. 小说推文（书单号）——内容素材固定、挂链接佣金变现、无需交付
  - 2. 线上PPT定制——需要接单沟通、按页收费、需人工交付
  - 3. 知识付费训练营——直播间口播卖课、高客单价、课程录制后一次交付
  - 回答问题：
  - '- 哪个项目的效率三维（流量/销转/交付）组合最适合矩阵化放大？'
  - '- 哪个项目需要靠财务三维（客单价/毛利率/复购率）来补偿效率不足？'
  - '- 如果你只有内容制作能力、没有销售团队，你会优先选哪个？为什么？'
- 'no': 3
  title: 逆向策划：设计一个'卖空气'验证方案
  contents:
  - 假设你想做一个'AI周报自动生成工具'，但目前没有开发能力，只有一篇很能打动目标用户的推广文案。
  - 请设计一个'软文先行+卖空气'的验证方案：
  - 1. 你的目标用户是谁？他们的核心痛点是什么？（写清楚用户画像）
  - 2. 写一段500字左右的'已解决口吻'的软文大纲，包括：
  - '   - 开头如何复述用户的问题/症状以建立信任'
  - '   - 中间如何展示''工具已存在''的截图或界面'
  - '   - 结尾如何引导用户付费或留资（预售）'
  - 3. 你计划如何判断验证成功？（例如：多少人付费/留资算通过）
  - 4. 如果验证失败，你的止损点设在哪里？
  - 提示：参考'复述问题建立信任'和'有效噱头，无效产品'的案例，但思考其伦理边界。
- 'no': 4
  title: 案例诊断：这个项目为什么不可复制？
  contents:
  - 阅读以下项目描述，用可复制性三标准判断其是否适合普通人复制：
  - '''某网红自制独家配方的手工酱料，通过直播带货月销10万瓶，配方严格保密，限量发售，每次开播瞬间售罄。'''
  - 回答问题：
  - 1. 这个项目'爆得偶然'吗？为什么？
  - 2. '货源非独家'这一条是否满足？为什么？
  - 3. '消费场景验证有需求'——虽然需求已验证，但普通人能否切入？
  - 4. 综合判断：这是'可复制的副业'还是'不可复制的生意'？给出至少两条理由。
  - 5. 如果一定要做相关方向，你会选择哪个环节切入（原料供应、包装设计、直播代运营）？为什么？
