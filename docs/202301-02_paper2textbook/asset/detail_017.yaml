learning_targets:
- 理解心金文案的'吸金'与'深入人心'双重属性
- 掌握写文案前的三重思考：目的、受众、平台
- 学会用'构建相似'引发读者共情的三种路径
- 能运用富兰克林复写法定位并打磨表达薄弱点
- 理解'输入带动输出'的闭环机制并建立素材库
- 读懂打广告'放大与筛选'的本质并破除心理卡点
- 建立'有间隔的重复次数'的成交信任积累节奏
- 掌握用'鱼塘钓鱼'类比排查精准用户的决策顺序
- 能结合案例与局限，综合运用心法和心法避免自嗨
concept_map:
- 内容与文案力
- ├── 心金文案
- '│   ├── 双重属性: 吸金(商业变现)+入心(情感共鸣) —— P002'
- '│   └── 思维显化: 写作传递思考与价值观 —— P002'
- ├── 写作前置思考
- │   ├── 目的(宏观/微观) —— P002
- │   ├── 受众(理解用户) —— P002
- │   └── 平台(特性适配/多平台分发) —— P002
- ├── 表达打磨方法
- │   ├── 富兰克林复写法(看-关-写-比) —— P002
- │   ├── 共鸣感构建(经历/感受/价值观) —— P002
- │   └── 统一的文案风格(记忆点) —— P002
- ├── 持续输出系统
- │   ├── 输入带动输出(故事→评论→商业) —— P002
- │   ├── 三类内容输入法 —— P002
- │   ├── 文案素材库/闪光文件夹 —— P002
- │   └── 100问练习法 —— P002
- ├── 广告认知与心态
- │   ├── 打广告的放大与筛选本质 —— P001
- │   ├── 广告是成交前最后一步 —— P001
- │   ├── 成交信任积累(有间隔的重复) —— P001
- │   └── 精准用户排查(鱼塘/动物园类比) —— P001
- └── 自我反思与边界
- '    ├── 自嗨式写文案的陷阱 —— P002'
- '    ├── 硬性模仿与套模板局限 —— P002'
- '    ├── 打广告无成交的排查顺序(池子→文案→铺垫) —— P001'
- '    └── 不精准用户池中的数据归因 —— P001'
life_analogy:
- 想象你是一位**养鱼塘塘主**想钓到目标客户：
- '- **心金文案** = 你精心调配的**鱼饵**：既能散发诱人香味（吸金），又符合鱼群口味（深入人心）'
- '---'
- 想象打广告就像**在广场上打开一束聚光灯**：
- '- **放大** = 喜欢你的人更清楚地看到你的价值而靠近，不喜欢你的人更烦你而离开'
- '- **筛选** = 灯光照过之处，留下的是顾客，走掉的是无关者'
- '---'
- 想象成交像**追求喜欢的人**：
- '- **有间隔的重复次数** = 不是一次表白就成功，而是持续约见、展示生活、分享三观，让对方在第N次被你打动时才点头'
- '- **精准用户排查** = 如果在动物园里钓不到鱼，不要怀疑自己技术，先看看自己是否在鱼塘里'
summary:
- concept: 心金文案
  desc: 既能吸金（商业变现）又能深入人心（情感共鸣）的文案范式，是私域经营的表达核心
- concept: 自嗨式写文案
  desc: 沉浸自我世界、按自身局限想法发文，误以为用户想看却无人问津的写作状态
- concept: 文案是思维的显化
  desc: 写作是传递思考与价值观的过程，思考清晰才能写得清晰
- concept: 三重思考（目的/受众/平台）
  desc: 写文案前先问'为什么写、给谁看、在哪发'，避免跑题与自嗨
- concept: 共鸣感构建
  desc: 通过经历、感受、价值观三种相似性触发读者情感共振，让其觉得'你懂我'
- concept: 富兰克林复写法
  desc: 看-关-写-比的复写训练，精准定位表达薄弱点并借外部点评改进
- concept: 输入带动输出
  desc: 以故事→评论→商业三类高质量输入喂养思维，配合素材库与100问形成输出闭环
- concept: 打广告的放大与筛选本质
  desc: 广告既放大喜欢你的人的理解也放大不喜欢者的反感，并筛选出真正的客户
- concept: 有间隔的重复次数
  desc: 成交取决于多次（第10/50/100天）有价值的重复触动，而非单次惊艳强度
- concept: 精准用户排查（鱼塘/动物园）
  desc: 打完广告无成交先检查用户池是否为精准鱼塘，而非随缘积累的动物园，避免错误自我怀疑
exercises:
- 'no': 1
  title: 拆解一条朋友圈文案的三重思考
  contents:
  - 给定以下朋友圈文案：
  - '"深夜11点，刚哄完二宝睡觉。看着镜子里浮肿的自己，想起三年前那个被甲方折磨到崩溃的职场妈妈。那时我没想到，现在能靠写文案月入过万，还能每天接送孩子上下学。如果你也在带娃和事业之间挣扎，私信我''妈妈''，送你一份我的私域起步清单。"'
  - 请回答：
  - 1. 用'三重思考'框架拆解：这条文案的宏观目的和微观目的是什么？目标受众是谁？适合发布在哪些平台（朋友圈/小红书/公众号）？
  - 2. 指出文案中'共鸣感构建'属于哪一种类型（经历/感受/价值观），并改写其中一句，使其加入'价值观共鸣'元素。
  - 3. 判断：如果发布后咨询寥寥，按照排查顺序，第一步应该检查什么？为什么不是先改文案？
- 'no': 2
  title: 用富兰克林复写法对比打磨一段文案
  contents:
  - 步骤1：阅读以下优秀文案（范本）：
  - '"你不是懒，你只是太久没有被自己感动过了。那些说''差不多就行''的日子，正在一点点吞掉你眼里的光。"'
  - 步骤2：关闭范本，用自己的话重新写出同样的意思（复写），至少100字，不要看原文。
  - 步骤3：将你的复写与原文对比，找出你表达不清、逻辑不顺或缺少画面感的3个薄弱点，写下来。
  - 步骤4：将你的复写发给一位朋友或同事，请对方给出1条具体改进建议，并记录对方的反馈。
  - 回答问题：
  - '- 对比后你发现自己最薄弱的环节是什么？是抽象表达的具象化，还是情绪渲染？'
  - '- 请他人点评与自我对比，两者的反馈有何不同？哪个更能暴露问题？'
- 'no': 3
  title: 鱼塘检查：为你的微信好友做一个'动物园盘点'
  contents:
  - 打开你的微信通讯录，任选100位好友（或全部），做一次用户池盘点：
  - 1. 将好友按四个象限分类：A=有感情联系（亲友/同事/领导）、B=无联系但可能有价值交换（网友/同行）、C=无联系也无付费可能（泛泛之交）、D=精准目标用户（符合你业务画像）。
  - 2. 统计每类人数，算出你通讯录中的'鱼'（D类）占比。
  - 3. 假设你正在推广一门'家庭理财入门课'，请判断：你的用户池是'鱼塘'还是'动物园'？依据是什么？
  - 4. 如果D类占比低于5%，请列出2种将'动物园'改造为'鱼塘'的具体行动（如加入垂类社群、调整内容吸引精准人群），并说明为什么这些行动有效。
- 'no': 4
  title: 设计'有间隔的重复次数'的30天信任积累计划
  contents:
  - 假设你开始推广自己的副业产品（自选，如课程/咨询/实物），请制定一个30天的'成交铺垫日历'，要求体现'有间隔的重复次数'理念：
  - 1. 将30天划分为4周，每周安排不同内容主题（如第1周=专业干货、第2周=个人故事、第3周=用户好评、第4周=软广），避免连续刷屏。
  - 2. 在日历中标注至少3个"软广"节点，并说明每个软广前已铺垫了哪些价值内容（价值输出/个性展现/信任建立）。
  - 3. 针对"有人第1天就买单、有人要到第30天才买单"的现实，写出你预判的2种用户反应，以及你对应的应对策略（如私聊跟进/持续输出）。
  - 4. 最后用'放大与筛选'视角回答：如果一位老同学因你发广告而屏蔽你，你应该如何看待？依据哪条原理？
units:
- 'no': 1
  name: 心金文案 —— 让文字既能“吸金”又能“入心”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人发朋友圈、写内容常陷入“自嗨式表达”：自己觉得不错，用户却不感兴趣，咨询寥寥无几'
  - '- 传统文案或只重“吸金”（硬广自夸）惹人反感，或只重“抒情”却不带来商业回报'
  - '- 需要一种同时兼顾商业变现（吸金）与情感共鸣（深入人心）的文案范式，让每一次表达都服务于成交'
  - '**核心定义**'
  - '- “心金文案”是作者独创的文案风格概念，寓意“既能吸金、又能深入人心的文案”'
  - '- 区别于普通文章，文案自带商业变现属性，同时需蕴藏感情、带来触动'
  - '**关键性质**'
  - '- 双重属性：商业变现属性与情感共鸣属性缺一不可'
  - '- 思维显化：文案是写作者思考与价值观的外在呈现，思考清晰才能写得清晰'
  - '- 风格统一：需要形成差异化、标签化的个人风格，统一协调才利于形成记忆点'
  - '**典型例子**'
  - '- 朋友圈软广：先讲自己踩坑故事引发共鸣（入心），再自然带出产品如何解决问题（吸金）'
  - '- 个人IP介绍：用“营销圈里最懂投资”的差异化标签吸引同频人群关注并咨询'
  - '**边界条件**'
  - '- 不适合硬性模仿与套用模板——这会束缚文案力与创造力，使人无法理解爆款背后的吸引点和逻辑性'
  - '- 适合需要长期经营私域、打造个人IP的个体，而不适合追求短期一次性投放的纯流量玩家'
  sources:
  - paper: docs/202301-02/JPRAdLgGFowUE7xargGc8YNjnzh.md
    role: origin
  excerpts:
  - 2022年，我给我的文案风格，终于敲定了一个名字，叫做「心金文案」，寓意是既能吸金、又能深入人心的文案。
  - 文案不同于文章，文案本身就带有一层商业变现属性，所以能够吸金才是关键，而文案又需要蕴藏感情、给人能带来触动，所以深入人心的写法，也是必要。
  - 很多做私域的朋友，为什么发了无数朋友圈但是咨询寥寥无几？大概率是因为他陷入了一种自嗨式写文案的状态。
  - 我曾经说过，文案是思维的显化。写作的过程其实就是把你的思考你的价值观传递出来。
  - 如果说你的文案能够让别人在阅读的时候，感叹出来这一定是谁写的文案，那其实就证明你成功了，你已经形成了自己的风格。
  - 所以大家写作记住，千万不要硬性模仿，更不要去套什么所谓的模版，那只会局限你的思维。
- 'no': 2
  name: 写文案前的三重思考 —— 先问“为什么、给谁看、在哪发”再动笔
  points:
  - '**为什么需要这个概念？**'
  - '- 许多写作者不假思索提笔就写，结果文案跑题、无人问津，陷入自嗨'
  - '- 缺乏对目标用户的理解，写出的内容用户不关心、不信任，更不会下单'
  - '- 同一内容在不同平台若不调整风格，传播效果天差地别'
  - '**核心定义**'
  - '- 写文案前的三个前置性思考问题：①你写文案的目的是什么？②你的文案是写给谁看？③文案发布在哪些平台？'
  - '- 目的需分宏观（整体方向）与微观（单条目标）两层；受众需理解用户需求与特征；平台需根据特性调整文案风格'
  - '**关键性质**'
  - '- 目的是方向锚：明确主旨才能不跑题，一条文案一个主旨就足够'
  - '- 受众是沟通靶：要先理解用户，才能写好文案甚至做好营销'
  - '- 平台是放大器：同一条文案适当修改可实现多平台分发，让影响力成倍放大'
  - '**典型例子**'
  - '- 卖护肤品的写朋友圈：宏观目的是建立专业形象，微观目的是让读者私信咨询；受众锁定有痘印困扰的年轻女性；发在小红书侧重图文种草，发在公众号侧重长文信任建设'
  - '- 写“复盘类”内容：发在个人朋友圈用口语化短句，发在知乎用逻辑完整长文，发在抖音用金句开头抓眼球'
  - '**边界条件**'
  - '- 当受众画像模糊（如“所有人”）时应先做减法聚焦人群，否则三重思考难以落地'
  - '- 当平台特性与内容主旨冲突时（如严谨行业报告发抖音），应优先保证主旨在单平台内的适配表达，而非强求多平台分发'
  sources:
  - paper: docs/202301-02/JPRAdLgGFowUE7xargGc8YNjnzh.md
    role: origin
  excerpts:
  - 你写文案的目的是什么？你的文案是写给谁看？文案发布在哪些平台？
  - 我们在写文案之前，需要思考两层目的。一层是宏观的，你整体文案的方向是为了实现什么？……一层是微观的，具体到每一个单条文案要达到什么目的？
  - 你要先去理解用户，然后才能写好文案甚至于做好营销。
  - 同一条文案，适当根据平台特性去修改，就可以实现多平台分发，真正让一条文案实现成倍放大影响力的效果。
  - 先明确一条文案的表达主旨，然后围绕着这一个主旨来写。一条文案，一个主旨就足够了。太多了，就会让人眼花缭乱，反而无法抓住重点。
- 'no': 3
  name: 共鸣感构建 —— 让读者觉得“你懂我”的写作心法
  points:
  - '**为什么需要这个概念？**'
  - '- 用户对“自说自话”的文案无感，只有感到“被理解”才会产生信任'
  - '- 单纯的道理说教难以触动情绪，而没有情绪触动的文案很难驱动购买决策'
  - '- 文案要深入人心，就必须触发读者的情感共振，让读者觉得“这说的就是我”'
  - '**核心定义**'
  - '- 通过“构建相似”来引发读者共鸣的写作方法，包含三个方向：经历的共鸣、感受的共鸣、价值观的共鸣'
  - '- 核心操作是在文案中代入生活场景与切身感受，贴近现实，让用户忆起相似情境'
  - '**关键性质**'
  - '- 相似性是触发器：共鸣源于读者在文案中看到自己的影子'
  - '- 三重递进：经历共鸣建立“同病相怜”，感受共鸣建立“感同身受”，价值观共鸣建立“灵魂同频”'
  - '- 势能吸引法则：想引发别人共鸣，自己要先有能量、敢于表达心声'
  - '**典型例子**'
  - '- 经历共鸣：“你是不是也试过，深夜加班回家，打开外卖软件却不知道点什么？”'
  - '- 感受共鸣：“那种被客户放鸽子后还得笑着说没事的委屈，我太懂了。”'
  - '- 价值观共鸣：“我坚持认为，好的关系不是消耗，而是互相成就。”'
  - '**边界条件**'
  - '- “构建相似”不能编造虚假经历，否则一旦被识破信任崩塌'
  - '- 共鸣感需要建立在真实自我表达基础上，如果一味迎合用户而失去自我风格，反而削弱文案辨识度'
  sources:
  - paper: docs/202301-02/JPRAdLgGFowUE7xargGc8YNjnzh.md
    role: origin
  excerpts:
  - 这种共鸣，是需要通过「构建相似」来进行的。可以在文案中代入生活场景感受，贴近现实，你所感受到的喜怒哀乐，用户也能同样感受到。
  - 分享给大家3个方向：经历的共鸣，感受的共鸣，价值观的共鸣。
  - 世间万物其实都遵循着吸引力法则，低能量会被高能量吸引，那你就必须要先把自己的势能打造起来，勇敢的在文案里去表达你的心声，才会引发别人的共鸣。
- 'no': 4
  name: 富兰克林复写法 —— 用“看-关-写-比”打磨表达力
  points:
  - '**为什么需要这个概念？**'
  - '- 新手写作最大的问题是“看不清自己的薄弱点”：不知道哪里表达不清、哪里逻辑不顺'
  - '- 单纯的阅读输入不经过刻意训练，无法转化为自己的写作能力'
  - '- 需要一套可操作的自检方法，精准定位表达短板并针对性改进'
  - '**核心定义**'
  - '- 源自富兰克林自传的写作训练方法：先看一遍优秀文案，关闭后用自己的话重新写出，再与原文对比找出表达不清晰之处，并请他人点评优化'
  - '**关键性质**'
  - '- 对比产生反馈：通过“自己的表达”与“优秀原文”的差异，暴露短板'
  - '- 需要外部视角：找朋友或专业人士点评，避免“孤芳自赏”'
  - '- 原理是复写而非抄写：每一次重写都不一样，逼迫大脑重新组织语言'
  - '**典型例子**'
  - '- 看到一句“好的文案是思维的显化”，关闭后自己写“写作就是在表达思考，想法理清了，写出来才明白”，对比后发现自己在“抽象概念的具象化”上弱于原文'
  - '- 写完一条朋友圈文案，发给有经验的朋友点评，对方指出“开头没有痛点代入，读者不知道跟他有什么关系”'
  - '**边界条件**'
  - '- 需要选择真正高质量的范本，否则复写学到的是错误范式'
  - '- 复写训练的进步是渐进的，不适合追求“看一遍就脱胎换骨”的速成心态'
  sources:
  - paper: docs/202301-02/JPRAdLgGFowUE7xargGc8YNjnzh.md
    role: origin
  excerpts:
  - 什么叫做复写？就是你先看一遍文案，然后把它关闭，尝试用自己的话去再次写出来，然后你会发现，每一次你写出来的内容都不一样，然后你去跟原文案对比，去发现自己表达不清晰的地方在哪里，那就是你写作的薄弱点。
  - 然后当大家写出来一个文案的时候，不要孤芳自赏，可以去找一些朋友或者专业人士帮助你点评你的文案，提出建议。
- 'no': 5
  name: 输入带动输出 —— 用“高质量输入”喂养思维，突破写作瓶颈
  points:
  - '**为什么需要这个概念？**'
  - '- 写作卡壳的根源往往不是“手生”，而是“脑空”——没有足够的素材、观点和逻辑框架可供调用'
  - '- 只靠闷头苦想，容易因认知基础薄弱而归因错误、产出低质内容'
  - '- 持续输出能力的建立必须依靠稳定的输入系统，否则写作难以为继'
  - '**核心定义**'
  - '- 以高质量阅读输入带动文案输出的方法：核心是“踩着巨人的肩膀”提升认知，输入后经过“内化”过程转化为自身认知，再外化为持续输出'
  - '**关键性质**'
  - '- 输入有层级：按“故事类→评论类→商业类”三级递进，分别训练表达、逻辑与观点'
  - '- 输入后需内化：从“明白”到“掌握”之间有转化过程，只读不想等于白读'
  - '- 系统化支撑：配合“文案素材库”分类整理与“100问练习法”刻意输出，形成闭环'
  - '**典型例子**'
  - '- 看故事类内容学“把一件事说明白”，看评论类内容学“逻辑结构”，看商业类内容学“观点与套路”'
  - '- 建立“闪光文件夹”随手记录灵感；整理行业100个最常见问题，逐一用自己的话写出回答，既建专业认知体系又练文字表达'
  - '**边界条件**'
  - '- 输入内容需与自身输出方向强相关，漫无目的的泛读效率低下'
  - '- “内化”需要足够的思考时间与主动加工，若只囤积不加工（收藏夹吃灰），则输入无法转化为输出能力'
  sources:
  - paper: docs/202301-02/JPRAdLgGFowUE7xargGc8YNjnzh.md
    role: origin
  excerpts:
  - 千万不要自己闷头苦想，因为你的认知基础薄弱，你想半天想出来的很可能归因逻辑就是错的。
  - 思维是一定要通过不断输入才能得到提升的，踩着巨人的肩膀，你会看到更广阔的天空。
  - 输入完了之后，还要思考。因为从明白到掌握，有一个「内化」的过程。
  - 建议大家看三类，可以先从【故事类】的内容看起，然后去看一些【评论类】的内容，最后再去看一些【商业类】的内容。
  - 去把你行业里最常见的100个问题整理出来，能自己回答的自己尝试回答，不能自己回答的去各种书籍、行业大神那里求教获得答案，理解之后再用自己的话写出来。
- 'no': 6
  name: 打广告的“放大与筛选”本质 —— 把广告变成精准客户的雷达
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人不敢打广告，核心是不理解打广告的价值，误以为广告只会打扰别人、损害关系'
  - '- 打完广告不出单容易陷入自我怀疑，归因于“我不行”而非“池子不对、铺垫不够”'
  - '- 需要重新定义广告的本质，建立对广告的正确认知与健康心态'
  - '**核心定义**'
  - '- 打广告的本质是一种“放大”和“筛选”：放大喜欢你的人对你的理解与认可，也放大不喜欢你的人的反感；筛选出愿意靠近你、购买产品的客户，剔除无关人员'
  - '**关键性质**'
  - '- 双向性：广告同时作用于喜欢与不喜欢你的人，效果相反但机制相同'
  - '- 筛选而非讨好：广告天然不是为所有人服务的，对准客户是“吸引”，对无关者是“打扰”'
  - '- 临门一脚而非唯一步骤：真正决定成交的是此前持续的价值输出、个性展现与信任建立'
  - '**典型例子**'
  - '- 朋友圈发一条产品软广：喜欢你的人看完更懂你在做什么而靠近购买；不喜欢你的人觉得被打扰而屏蔽删除——这正是筛选机制在工作'
  - '- 公众号推文末尾放课程广告：老读者因信任积累直接下单，泛泛关注者可能取关，但留下的都是高意向用户'
  - '**边界条件**'
  - '- “放大筛选”的前提是产品真实有价值，如果产品本身是垃圾，广告只会加速口碑崩塌'
  - '- 该逻辑仅适用于“有价值交换”的关系，对需要顾及感受的亲朋好友、领导同事，需要另外调整投放范围与表达方式'
  sources:
  - paper: docs/202301-02/HfJEd0huioyShvxowVfcOMQYnHb.md
    role: origin
  excerpts:
  - 打广告这动作，本质是一种「放大」和「筛选」。
  - 让喜欢你的人，更深入的理解你在做的事情，更明白你的能力和价值。喜欢你的人，更喜欢你；不喜欢你的人，更烦你。此为「放大」。
  - 喜欢你的人，觉得你的广告，是一个能更好的了解你的窗口，了解完之后，他们会靠近你，购买你的产品，成为你的客户。不喜欢你的人，觉得你打广告，是又想让他掏钱了，你又打扰他了，看完后更烦你，然后屏蔽你、删除你、拉黑你。此为筛选。
  - 对于【无关人员】来说是【打扰】的东西，对于【你的客户】来说是一种【吸引】。如果你不打广告，不去【打扰】无关人员，那么同样的，你就没法【吸引】你的客户。
  - 打广告，是成交前的最后一步，而不是唯一的步骤！在打广告之前，还有：价值输出、个性展现、信任建立...
- 'no': 7
  name: 成交信任积累 —— “有间隔的重复次数”比一次惊艳更重要
  points:
  - '**为什么需要这个概念？**'
  - '- 很多新人以为“写一篇爆款就能转化客户”，但实际上多数人成交前需要多次被触动'
  - '- 打完广告不出单就自闭，是因为把“单次广告”当成全部，忽略了此前的信任积累'
  - '- 需要理解成交的真实节奏，建立对“打广告-没成交”的合理预期与耐心'
  - '**核心定义**'
  - '- 成交依赖于前期持续的价值输出、个性展现与信任建立；打动别人下单的要素除了“强度”还有“有间隔的重复次数”——不同的人需要多次（3次、10次、30天、100天）被触动才会买单，广告只是临门一脚'
  - '**关键性质**'
  - '- 节奏因人而异：有人第一次觉得你牛逼就买单，有人需要3/5/10次甚至第10/30/50/100天才被拿下'
  - '- 内容是铺垫：价值文章、生活分享、互动交流都是信任积累的一部分'
  - '- 广告是结果：没有前面N次铺垫，广告只会被当作垃圾信息'
  - '**典型例子**'
  - '- 作者自述：虽有3篇精彩代表作，新朋友看完并不下单；又刷了十几篇唠嗑短文后才来找作者买单'
  - '- 有人看到一条干货视频觉得有道理但没买，半个月后在朋友圈第三次刷到同款产品，又看到购买者的好评，才下单'
  - '**边界条件**'
  - '- “重复”必须“有间隔”，连续刷屏式重复会造成反感而非信任'
  - '- 重复的内容需保持价值输出的多样性（干货、生活、三观），不能只重复同一句广告语'
  sources:
  - paper: docs/202301-02/HfJEd0huioyShvxowVfcOMQYnHb.md
    role: origin
  excerpts:
  - 我发现，打动别人，让人下单这事，除了强度之外，还有【有间隔的重复次数】。
  - 有些人会在认识你的第一天就买单。而有些人会在第10天、第30天、第50天、第100天...第N次看到你的干货，看到你的生活，了解你这人的性格、三观，第N次被你触动后，才会买单的。
  - 以我为例，原本我以为，我已经有几篇很精彩的代表作了，一些新朋友加过来，看了我3篇大作，应该就能买单了。但实际上，我发现不完全是这样的。也有很多朋友，是看了我几篇大作后初步了解了我，但仍对我的产品无动于衷。后来又刷了我十几篇唠嗑短文后，才来找我下单的。
  - 在打广告之前，还需要输出N篇有价值的文章，写N篇生活分享的朋友圈，N次参加活动，和大家交流互动建立信任。最后才是打广告，完成这临门一脚，开单。
- 'no': 8
  name: 精准用户排查 —— 别在“动物园”里钓不到鱼就怀疑自己
  points:
  - '**为什么需要这个概念？**'
  - '- 打广告没成交时，新手第一反应是怀疑自己能力不行、魅力不够，从而陷入自卑与内耗'
  - '- 很多人的用户池是长期随缘积累的“杂物间”，里面几乎没有目标客户'
  - '- 需要一套方法先排除“池子不对”的干扰因素，再谈优化文案与转化'
  - '**核心定义**'
  - '- 用“养牛场里钓鱼”类比指引排查：打完广告没成交时，先判断自己的用户池是否为精准“鱼塘”，而非随缘积累的“动物园”（牛、羊、长颈鹿等非目标用户）；若池子不精准则不能据此怀疑自己的能力'
  - '**关键性质**'
  - '- 排查优先级第一：先检查用户池是否精准，再检查文案与铺垫'
  - '- “精准”不以好友数量衡量，而以目标用户占比衡量'
  - '- 如果2000好友里没有几条“鱼”，钓不到鱼是正常结果而非能力问题'
  - '**典型例子**'
  - '- 一个微信号2000好友全是同学、亲人、同事等随缘积累，开始卖母婴产品，发广告无人问津——这不是文案问题，而是池子里根本没有宝妈'
  - '- 对比：在一个300人的宝妈社群发同一条广告，可能瞬间收到5个咨询，因为池子精准'
  - '**边界条件**'
  - '- 精准不等于“付费用户”，不付费但产生价值交换（点赞、评论、互动）的好友也算池内有效人群'
  - '- 即使池子精准，仍需结合文案自查与信任铺垫，不能只靠“池子对”就期望成交'
  sources:
  - paper: docs/202301-02/HfJEd0huioyShvxowVfcOMQYnHb.md
    role: origin
  excerpts:
  - 你现在的精准人群，他们的类型是【鱼】，但你以前从各种场合积累下来的，都是些【牛】【羊】【长颈鹿】【犀牛】【狮子】... 2000好友里，就没有几只你要的【鱼】。钓不到鱼，那不是再正常不过了吗？
  - 所以呀，当你发现你没钓上几只鱼时，你要想的第一件事，不是怀疑自己，而是思考思考，自己到底是在鱼塘，还是动物园。要检验自己的钓鱼技术如何，得去鱼塘，才能检验出来呀。
  - 比如说你有一个2000好友的微信号，里面都是你从小到大加到的同学、亲人、同事，都是你因为各种机缘巧合，随缘积攒下来的好友...现在你开始有个自己的业务了...你发现没有成交，就很怀疑自己的能力和魅力...这不就是，在养牛场里没有钓到鱼，然后怀疑自己吗...
'no': 17
