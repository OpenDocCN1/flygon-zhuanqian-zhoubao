  - '**核心定义**'
  - '- 增长瓶颈怪圈：当企业或个人被增长的预期绑架，会陷入越追求增长反而距离增长越远的恶性循环'
  - '- 价值创造视角：从“我如何得到增长”切换为“我如何成为一个值得被奖赏增长的人”'
  - '- 三种勇气：面向未来而非面向过去的勇气、面向用户而非计算利弊的勇气、积累价值而非抓取资源的勇气'
  - '- 不流动稀缺资源价值优先：优先投入时间去积累当前环境中真正稀缺、不流动的资产（品牌、数据、人才、信任等）'
  - '**关键性质**'
  - '- 视角转换：转化看待问题的方式，而非解决问题本身，往往才是最关键的办法'
  - '- 稀缺资产导向：销售额几乎是无限且每年都在改变，但用户对高端品牌的心智是稀缺的'
  - '- 贡献视角：从争抢的视角变成贡献的视角，不争反而能赢得最关键的信任'
  - '**典型例子**'
  - '- 柯达自认成功源于坚持成像品质，但其最初成功实际源于抓住大众化趋势——用过去定义自己导致错失数码相机'
  - '- 八项规定后大量中高端白酒降价砸牌，几乎只有茅台认为品牌才是最重要资产，不牺牲品牌换销售额'
  - '- 四爷最与众不同的策略是“争是不争，不争是争”——从争抢的视角变成贡献的视角'
  - '**边界条件**'
  - '- 价值创造视角需要长期主义支撑，不适合追求短期套利者'
  - '- 识别“当前环境中真正稀缺不流动的资产”需要深刻的行业理解'
  - '- 贡献视角在内部政治复杂的组织中可能难以推行，需结合实际情况判断'
  - '...'
