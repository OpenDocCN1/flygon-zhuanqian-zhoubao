    把控全局的项目管理能力…4. 让人难以怀疑的决断力…5. 面向内外部的双重叙事能力。
  - 对调研的压倒性投入，就是对客户的负责。而每一次调研的背后，可能是十几个竞品分析，十几万字的消费者、店长和经销商访谈，不计其数的行业报告等等。策略师不是一个白领，而是一个蓝领。
  - 商业模式画布，是我用的众多商业工具里面，用得最多的一个，也是帮我赚钱赚最多的一个。用道、术、器、用四个层面讲清楚并运行所有项目：道为商业模式的本质（用XX产品/服务，解决了XX客户的XX痛点，赚XX钱），术为解决方案的9个关键维度（客户、价值、渠道、关系、资源、伙伴、活动、成本、收入），器为载体工具平台，用为执行力与业务流迭代。
