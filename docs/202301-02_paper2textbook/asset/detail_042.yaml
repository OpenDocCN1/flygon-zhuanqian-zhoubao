  excerpts:
  - 进入增长瓶颈的一个典型现象，就是越想要增长，却距离想要的增长越远。如果用一句话来形容这种现象，那就是我们被我们想拥有的东西绑架了。
  - 我发现，破除增长焦虑唯一的方法，就是怎么从追求增长的视角，切换成价值创造的视角。从一个'我如何得到增长'，变成'我如何成为一个值得被奖赏增长的人'。
  - 真正要去摆脱这种视角，最难的不在于方法论，而是3种'勇气'：面向未来而非面向过去的勇气；面向用户而非计算利弊的勇气；积累价值而非抓取资源的勇气。
  - 我们花费了太多的精力去抓住无限的、流动的东西，而非关注真正稀缺的、不变的东西。对一个品牌来说，销售额几乎是无限的而且每年都在改变，但是用户对你高端品牌的心智是稀缺的。
  - 八项规定后大量的中高端白酒品牌，降价砸了牌子，几乎只有茅台认为品牌才是最重要的资产，不会用品牌和品质的牺牲去换销售额。
