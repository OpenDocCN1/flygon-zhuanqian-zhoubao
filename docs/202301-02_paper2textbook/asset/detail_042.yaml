  name: 三会一层与战略归属 —— 公司治理的“四权分立”与战略的源头
  points:
  - '**为什么需要这个概念？**'
  - '- 公司经营不善或倒闭，根源往往不在于执行层，而在于治理层的战略决策失误'
  - '- 缺乏清晰的治理结构，会导致权责不清、决策随意、内部混乱'
  - '- 需要理解公司顶层治理架构的基本逻辑，以支撑长远的战略决策'
  - '**核心定义**'
  - '- 三会一层：股东（大）会（最高权力机构）、董事会/执行董事（决策机构）、监事会（监管机构）、高管层（执行机构）'
  - '- 战略非目标论：目标是战略的对象或结果，但目标本身不是战略——战略应形成自始至终的指导原则并发挥自身禀赋'
  - '**关键性质**'
  - '- 权力制衡：股东会选任董事会与监事会，董事会选任高管层，监事会监督董事会与高管层，形成闭环'
  - '- 权责分明：各层机构承担不同职能，避免决策与执行混同'
  - '- 战略归属：战略是三会一层要做的事，既不是一朝一夕的事，也不是朝令夕改的事'
  - '**典型例子**'
  - '- 股东会决定公司重大战略方向，董事会制定具体战略方针，高管层负责执行落地'
  - '- 公司经营不善时，首先反思治理层的战略决策（画地图/选路径/定计划）是否失误'
  - '**边界条件**'
  - '- 小微公司可能无需设置完整的三会一层，可简化为执行董事制度'
  - '- 治理结构需要与公司发展阶段相匹配，过早复杂化治理成本偏高'
  - '- 战略制定需要结合外部环境与内部资源，避免闭门造车'
  - '...'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_07.md
    role: improve
  excerpts:
  - 三会一层：股东（大）会、董事会/执行董事、监事会、高管层；
  - 股东会选任董事会成员/执行董事…董事会/执行董事选任高管层经理…股东会选任监事会成员，监事会监督董事会/执行董事、监督高管层经理，向股东会负责汇报。
  - 所以，公司如果经营不善或者倒闭，更多的原因，不是下面的管理层、执行层，而是治理层'三会一层'。
  - 战略，既不是一朝一夕的事，也不是朝令夕改的事。战略，是三会一层要做的事。
  - 目标是战略的对象或结果，但目标本身不是战略——比如读书群里有人说他的战略是：帮助一万个人赚到钱。这就是对战略的一个巨大误解。因为帮助一万人赚到钱，这是一个目标，它不是战略。
