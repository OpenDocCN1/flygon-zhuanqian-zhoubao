  - '- 需要用一套公式来评估流量的真实变现潜力，避免被虚荣指标误导'
  - '**核心定义**'
  - '- 流量价值=流量规模×交易相关性×信任度'
  - '- 流量规模只解决连接的问题，不解决交易的问题；相关性和信任度决定转化'
  - '- 能够变现的流量才叫流量，不能变现的流量只能叫做数据——要从第一个粉丝就开始变现'
  - '**关键性质**'
  - '- 乘法效应：三个维度任一项为0，整体价值即为0'
  - '- 相关性优先：不如人气的、只和产品相关的精准流量价值更高'
  - '- 信任度积累：不轻易连接，但连接必有价值'
  - '**典型例子**'
  - '- 胖龟找房：不追求泛流量，而是通过“0中介费”这一差异化主张吸引精准租房人群'
  - '- 小红书资料号：评论用户才是衣食父母，做好钩子生态圈，而非追逐点赞收藏'
  - '**边界条件**'
  - '- 流量相关性和信任度需要长期经营，无法速成'
  - '- 不同业务对流量价值三要素的权重不同，需结合行业特点评估'
  - '...'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  excerpts:
  - 流量价值=流量规模×交易相关性×信任度；有时候我们面对一篇阅读量很高的文章、一篇赞藏很高的小红书笔记、一个很火的抖音视频，会感到困惑或焦虑。因为我们只看到了表层的流量规模，有些慌张，但流量规模只解决连接的问题，不解决交易的问题。比流量规模更重要的是流量相关性…信任度怎么看？有的连接带来的价值有限，这和连接给UV带来的感受有关…不轻易连接，但连接必有价值。
  - 要从第一个粉丝就开始变现，流量就像是一张门票，有效期内你不用掉，就会变成一张废纸。能够变现的流量才叫流量，不能变现的流量只能叫做数据。
  - 公域流量属于平台；私域流量属于自己。我们的目标是把他们引流到微信上…所以我们整套商业模式的目的只有一个：把所有公域平台的流量导入微信私域。整个项目的5句核心心法：1.
    定位即人群、2. 人群即内容、3. 内容即流量、4. 流量即转化、5. 转化即模式。
