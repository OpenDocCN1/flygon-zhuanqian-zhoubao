paper: docs/202301-02/20230207_07.md
desc: 该素材是《龙哥赚钱周报》的一期合集，收录了多位作者关于商业增长、战略认知、亏钱规避、发现身边生意机会和寻找热爱等主题的观点分享。核心内容包括：著名战略顾问李靖关于从'追求增长'视角切换到'价值创造'视角以破解增长瓶颈的深度演讲；对战略本质、战略指导原则和发挥自身禀赋的通俗阐述；以反讽方式系统总结'优雅亏大钱'的方案步骤；通过身边案例说明赚钱机会往往隐藏在日常信息差中；以及关于正反馈与热爱的感悟总结。素材整体是一份面向社群成员的经验分享汇编，兼具商业认知启发和实操案例参考价值。
concepts:
- name: 增长瓶颈怪圈
  desc: 当企业或个人被增长的预期绑架，会陷入越追求增长反而距离增长越远的恶性循环。
  is_original: true
  excerpt:
  - 进入增长瓶颈的一个典型现象，就是越想要增长，却距离想要的增长越远。
  - 如果用一句话来形容这种现象，那就是我们被我们想拥有的东西绑架了。
  - 再进一步的恶性循环，就是觉得这些问题的原因是自己还不够狼性、不够拼搏，所以不断压榨自己、逼迫自己，让自己活在一个焦虑紧张和对失去的害怕中（业界常说的话就是
    FOMO 心理），让自己更加难以去做自己热爱的事情，更加难以去专注，从而进一步失去优势。
- name: 价值创造视角（vs 追求增长视角）
  desc: 破解增长焦虑的唯一方法是实现视角的根本性切换：从'我如何得到增长'转变为'我如何成为一个值得被奖赏增长的人'，即从追求增长转向价值创造。
  is_original: true
  excerpt:
  - 我发现，破除增长焦虑唯一的方法，就是怎么从追求增长的视角，切换成价值创造的视角。
  - 从一个'我如何得到增长'，变成'我如何成为一个值得被奖赏增长的人'。
  - 转化看待问题的方式，而非解决问题本身，往往才是最关键的办法。
- name: 强加成本战略
  desc: 利用自身优势，迫使对手不得不持续投入高昂成本以应对己方的每一次低成本举措，从而拖垮对方经济实力的一种战略指导原则。
  is_original: false
  excerpt:
  - 因为苏联有几个弱点：国土面积太大（这在面对德国侵略时是优点，纵深比较好），防守成本很高，苏联还非常重视国土防空。
  - 美国的战略就是，让苏联承受越来越多的费用和成本。
  - 你看，美国所有的行动，都是遵守一个战略指导原则，就是让苏联增加成本。这叫做'强加成本'战略。
- name: 信息差生意
  desc: 赚钱的机会往往隐藏在身边，源于多数人没有发现的'信息差'，而非网上宣传的过时项目。
  is_original: false
  excerpt:
  - 身边赚钱的机会其实还是很多的，只是你没有发现，这个就是大家所说的信息差。
  - 先有闷声发大财，网上说做什么小项目一个月可以赚多少钱的，基本是已经过时了。
  - 对于赚钱这件事，真的需要你从身边挖掘发现，而不是在网上听谁说赚钱。
- name: 正反馈驱动热爱
  desc: 懒惰的本质是未获得正反馈；未获正反馈源于做得不够多，而做得不够多的核心原因是不够喜欢，因此要尽快找到热爱或纯粹为钱而冲以摆脱内耗。
  is_original: false
  excerpt:
  - 为什么会有懒惰这个东西？本质上，就是没拿到正反馈，如果你每天做的事都有大量的钱进账，比如一天一万利润揣兜里，你说你会懒？你比谁都积极。
  - 但是最核心的是，你不够喜欢。
  - 你不够想，不够想赚钱，不够缺钱。这里有两个突破口，一个是尽快找到自己到底热爱，另一个，找不到也没关系，就是为了钱冲，不别扭，不内耗。
methods:
- name: 重构成功归因复盘法
  desc: 在复盘时除了问'过去坚持了什么让我们走到今天'，还要同时问'过去抓住了什么机会、打破了什么惯例'，以避免用过去定义自己而陷入自我局限。
  excerpt:
  - 如果你在复盘会中除了上面的问题，还问另外一个问题呢？'过去你抓住了什么机会，或者打破、开创了什么让你有今天的？'你就会发现视角完全又不一样了。
  - 凡是认为昨天自己坚持了某种信念，只要继续坚持这个信念就能获得未来增长，这往往容易陷入自我局限。
  - 但如果看到了 19 世纪末最大的势能就是广播媒体的出现带动全国品牌的建立，就自然会发现还有更大的空间。
- name: 增长视角三勇气切换法
  desc: 从追求增长转向价值创造，需要具备三种勇气：面向未来而非面向过去、面向用户而非计算利弊、积累价值而非抓取资源。
  excerpt:
  - 真正要去摆脱这种视角，最难的不在于方法论，而是 3 种'勇气'：面向未来而非面向过去的勇气；面向用户而非计算利弊的勇气；积累价值而非抓取资源的勇气；
  - 面向未来而非面向过去：只有觉得未来的自己更大，远比过去已经创造出来的自己要大，才能真正洞察到趋势，并且不断去开创未来。
  - 面向用户而非计算利弊：把视角切换为'我如果想要去解决用户的问题，应该怎么做？'，就会发现，答案更容易找了。
  - 积累价值而非抓取资源：识别在我当前的环境中，最稀缺的、最不流动的是什么，如果整体的优化目标本着这些，就会形成正向的价值积累。
- name: 优雅亏大钱三步骤法（反讽式）
  desc: 以反讽方式系统总结保证亏大钱的三个步骤：做容易亏钱的事（选少数人能赚钱或看不懂的项目自作对手方）、投入足够多的钱（加杠杆或高频交易）、坚持到底（赚钱不止盈亏钱不止损），以此反向提醒读者规避。
  excerpt:
  - 我的方案可以分成三个步骤：1、做容易亏钱的事。2、投入足够多的钱。3、坚持到底。
  - 坚定选择只有少数人能够赚钱的项目。这样，除非天赋异禀，否则你大概率就是一个亏钱的人。
  - 要带着一夜暴富的追求，伴随破釜沉舟的气势，配上一往无前的决断（XX 跌很多这种事情不可能发生！），一次上大仓位，最好配上杠杆。
  - 这一步叫：坚持到底，决不退出。赚钱了不止盈，亏钱了不止损。只有这样才能确保真的亏大钱。
- name: 战略描述三段论
  desc: 对战略不作固定定义，而进行三个维度的描述：战略目的是获得相对优势、战略应形成自始至终的指导原则、战略需要发挥自身禀赋（劣势不能作为战略方向）。
  excerpt:
  - 首先，战略目的是让你能获得优势或者获得相对优势。
  - 其次，战略应该形成一种自始至终的指导原则。
  - 还有一个呢，就是战略需要发挥你的禀赋。你要是跟老乡鸡、南城香比卫生、标准化、品牌力，那就错了。你应该提升你的人情味、现炒等等。这就是不能选择你的劣势来做战略方向。
- name: __overview__
  desc: 素材整体采用'认知观点输出 + 案例实证'的社群周报汇编方法：先提出核心商业认知（如视角切换破局、战略本质、赚钱信息差），再辅以历史案例（九子夺嫡）、军事案例（大卫战歌利亚、强加成本战略）、商业案例（LV、耐克、宝洁、格力、茅台、宜家）及现实小生意案例（广告牌图文店、烤面筋摊、朋友圈卖螃蟹）加以佐证和具象化。
  excerpt:
  - 以下是目录，内容有些多。大家可以挑兴趣的内容阅读。
  - 从上面三个案例来看，身边赚钱的机会其实还是很多的，只是你没有发现，这个就是大家所说的信息差。
  - 如果你要问，那我反着来，就能保证赚钱吗？我也希望可以，但很不幸不能，无论多厉害的高手，亏钱是赚钱路上的不可缺少的部分。
theorems:
- name: 被想拥有的东西绑架论
  desc: 对增长的过度追求会使人被增长预期绑架，转而采取投机、计较利弊和抓取资源的短视行为，从而进一步远离真正的增长。
  excerpt:
  - 我们被我们想拥有的东西绑架了。
  - 当一个人被增长的预期绑架，就会失去这些习惯，他会变得投机一样地去跟随对手而非做开创性事情，会天天计算自己的利弊得失而非去关注用户，会抓取身边的资源、流量而非积累价值，这些都让他距离增长越来越远。
- name: 争是不争，不争是争
  desc: 在激烈竞争中，越是直接争抢目标反而距离目标越远；转而想着为目标系统创造价值，反而能赢得最关键的信任与最终胜利。
  excerpt:
  - 邬思道（号称编剧附体的人）提出了违反共识却真正行之有效的关键战略，只有八个字'争是不争，不争是争'——就是当你想去争权夺力，反而距离皇位会变远，当你不去争，去想着怎么给大清国创造价值，才能赢得皇帝的信任，这才是最大的争，成为最后的赢家。
  - 四爷最与众不同的策略在于——从一个争抢的视角，变成一个贡献的视角。
- name: 战略非目标论
  desc: 目标是战略的对象或结果，但目标本身不是战略；制定战略不等于设定一个目标。
  excerpt:
  - 比如读书群里有人说他的战略是：帮助一万个人赚到钱。这就是对战略的一个巨大误解。因为帮助一万人赚到钱，这是一个目标，它不是战略。
  - 如果说定一个目标就叫做战略的话，那做战略是不是非常简单了？
- name: 不流动稀缺资源价值优先论
  desc: 应优先投入时间去积累当前环境中真正稀缺、不流动的资产（品牌、数据、人才、信任等），而非追逐无限、流动的短期资源（销售额、DAU、权力），才能形成正向价值积累。
  excerpt:
  - 实际上，这也是一个奇怪的现象，我们花费了太多的精力去抓住无限的、流动的东西，而非关注真正稀缺的、不变的东西。
  - 对一个品牌来说，销售额几乎是无限的而且每年都在改变，但是用户对你高端品牌的心智是稀缺的。
  - 而要打破这种循环，就不得不去识别，在我当前的环境中，最稀缺的、最不流动的是什么，有时候是品牌，有时候是数据，有时候是稀缺供给，有时候是人才，如果整体的优化目标本着这些，就会形成正向的价值积累。
- name: 持续增长悖论
  desc: 企业或人在成功后往往不再做当初导致成功的事情（面向未来开创、洞察用户、积累价值），一旦面对巨大增长预期便为追求增长而放弃价值创造，最终陷入瓶颈。
  excerpt:
  - 为什么'可持续增长'这么难，有个很重要的原因，就是一个人或者企业成功了后，就往往不再去做当初导致它们成功的事情。
  - 一旦面对巨大的增长预期，就很容易为了追求增长而放弃价值创造，开始因循守旧面向过去、开始不关注用户而是计算自己的利弊、开始抓取短期的增长数据提高安全感，最终陷入了瓶颈。
- name: 亏钱反期望定理（反讽式）
  desc: 即便严格按照亏钱步骤反向操作，也无法保证赚钱，因为高手也会亏钱，亏钱是赚钱路上不可避免的组成部分。
  excerpt:
  - 如果你要问，那我反着来，就能保证赚钱吗？我也希望可以，但很不幸不能，无论多厉害的高手，亏钱是赚钱路上的不可缺少的部分。舍弃了亏钱，就意味着舍弃赚钱。
  - 毕竟，赚钱的方式千差万别，亏钱的方式殊途同归。
findings:
- name: 增长瓶颈源于长期增长习惯的断裂
  desc: '[claim] 作者宣称大部分企业的增长问题在疫情前就已存在，疫情只是加重而非本质原因；大部分企业和人在大部分时候并不增长，因此应重新思考对增长的态度。'
  excerpt:
  - 在 2019 年，许多企业的增长就遇到问题了。大部分企业的增长问题，并不是因为疫情，而是在疫情之前就发生了。疫情只是加重了你的问题，但可能并不是问题的最本质原因。
  - 大部分企业在大部分时候，是不怎么增长的。大部分人在大部分时候，也不会获得升职加薪的。即使在最发的经济体美国，一个本科毕业生毕业后，一辈子能获得的晋升机会也只有
    1.5 次而已。
- name: 柯达成功归因错位案例
  desc: '[evidence] 素材以柯达为例（学术案例）支撑''用过去定义自己导致错失趋势''的观点：柯达自认成功源于坚持成像品质与性能，但其最初成功实际源于创始人开发低价便捷相机抓住大众化趋势。'
  excerpt:
  - 柯达认为自己成功的重要法门是坚持成像的品质和性能（这个 belief 也在一定程度上限制了它们进入更加便捷但是成像品质相对低的数码相机市场）。
  - 它最初成功的法门并不是高品质，而是抓住技术趋势开发适合更多人群的便捷性产品。
- name: 成功企业抓住势能开创新品类案例群
  desc: '[evidence] 素材列举 LV、NIKE、索尼、宝洁等历史案例（均为常识性商业史实）支撑''巨大增长来自抓住大趋势并做开创性举动''：LV
    借铁路普及推出轻便旅行箱、NIKE 借电视转播崛起赞助球星、索尼借晶体管突破开发随身听、宝洁借广播媒体建立全国品牌。'
  excerpt:
  - LV 率先开发出轻便、耐磨损的旅行箱，抓住了 19 世纪欧洲火车普及的机会；NIKE 通过赞助顶级球星的方式抓住了电视转播崛起的机会；索尼抓住了晶体管技术的突破开发随身听等等。
  - 宝洁最早也只是卖肥皂，如果宝洁基于过去去做自我定位……就很难有我们看到的宝洁。但如果看到了 19 世纪末最大的势能就是广播媒体的出现带动全国品牌的建立，就自然会发现还有更大的空间。
- name: 宜家模式误读案例
  desc: '[evidence] 素材以宜家为例（常识性案例）支撑''应基于用户最重要需求而非对标模式做决策''：宜家出发点不是提高顾客停留时长，而是解决''搬入陌生城市一天内拥有一家''的需求，学其门面模式而不解其因可能导致失败。'
  excerpt:
  - 一个家具公司，按照对标研究，需要提高门店的顾客时长，所以学习宜家，做多品类的体验式门店。但忽略的是，宜家的出发点并不是提高顾客的时长，而是怎么解决当时它崛起时最重要的客户需求——当我搬到一个陌生的城市，如何一站式的在一天之内拥有一个家？
- name: 茅台珍视品牌不降价案例
  desc: '[evidence] 素材以茅台在八项规定后维持品牌为案例，支撑''识别稀缺不流动资产（品牌心智）并积累价值''的主张：当时大量中高端白酒降价砸牌，茅台视为品牌为最重要资产而不牺牲品牌换销售额。'
  excerpt:
  - 八项规定后大量的中高端白酒品牌，降价砸了牌子，几乎只有茅台认为品牌才是最重要的资产，不会用品牌和品质的牺牲去换销售额。
- name: 美国强加成本战略拖垮苏联
  desc: '[claim] 作者以美国对苏''强加成本''战略（含毒刺导弹放血行动、压油价、星球大战等史实）为例，宣称美国通过迫使苏联持续承担高成本并同时破坏其造血能力，成功拖垮苏联经济。'
  excerpt:
  - 首先是训练阿富汗游击队。并向阿富汗提供'毒刺'的肩扛式防空导弹……第一批'毒刺'200 枚运到阿富汗以后就击落了 100 多架苏军的直升机和固定翼飞机。
  - 石油价格每降 1 美元，苏联就损失 5 亿到 10 亿美元。这就是一方面在放血，一方面破坏造血功能。
  - 你看，美国所有的行动，都是遵守一个战略指导原则，就是让苏联增加成本。这叫做'强加成本'战略。
- name: 身边小生意信息差案例群
  desc: '[evidence] 素材列举三个现实身边案例支撑''赚钱机会潜藏于信息差''：苏州 ao 图文专做广告牌开 70 家店、四线城市烤面筋三轮车月入过万、大学生朋友圈卖螃蟹年入可观（约
    1.2 万/年均）。'
  excerpt:
  - 苏州有一家叫 ao 图文的，就只做广告牌子，现在开了有 70 家店……一块牌子 3000-5000 块，生意稳定……一个月 15 块牌子，也要 7w 块了。
  - 四线城市做烤面筋……一天卖 600 串左右，一天的收入在 2000 多，节假日更多。
