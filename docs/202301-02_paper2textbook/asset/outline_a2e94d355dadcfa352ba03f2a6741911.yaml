- 'no': 1
  name: 内容生态与模式洞察 —— 从“追热点”到“做IP”的进化
  desc: 本章以两个真实案例为切入，剖析内容生态中两种典型的生存与增长模式：短期热点收割与长期个人IP沉淀，帮助读者建立对内容行业底层逻辑的全局认知。
  nodes:
  - 'no': 1
    name: 热点收割者的日常：一次完整的追热点复盘
    desc: 以2022年12月14日“行程码下线”热点为例，展示如何通过批量公众号矩阵在单日内实现数万粉丝增长与多元变现，引发对内容运营效率的思考。
    role: motivation
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 2
    name: IP打造者的长线布局：年入千万的“风骨体面”方法论
    desc: 引入内容经纪赛道开创者刘梦园的IP打造五步法，展示如何从零构建一个有文化沉淀价值与商业变现能力的个人IP，与短平快的热点收割形成鲜明对比。
    role: motivation
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 3
    name: 时代风口观察：从传统金融到Web3的跨界转型
    desc: 通过一位传统金融分析师转向Web3创业的真实历程，引出对“以虚促实”经济趋势的观察，理解内容与虚拟经济结合的未来方向。
    role: motivation
    src:
    - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
  - 'no': 4
    name: 搜索流量追热点与批量做号矩阵
    desc: 定义两种核心运营策略：在文章正文铺设搜索长尾词以获取微信搜一搜流量；同时运营12个以上公众号、每篇内容标题保持差异以增加收录概率。
    role: definition
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 5
    name: IP地基：母题、基因、身份、观感与资产
    desc: 讲述IP外部打造的12345框架：1个母题作为护城河锚点、2层基因（文化沉淀与商业能力）、3重身份（工具/人/神）、4级观感（松弛/对象/获得/氛围）、5份资产（用户/版权/实物/文化/生态）。
    role: definition
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 6
    name: Web3与以虚促实：区块链互联网生态的内涵
    desc: 定义Web3为基于区块链且能与现实交互的互联网生态，解读“以虚促实”经济趋势，说明虚拟经济与实体经济结合的大方向。
    role: definition
    src:
    - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
- 'no': 2
  name: 流量获取与内容生产 —— 把“爆款”做成系统工程
  desc: 本章聚焦热点收割场景下的流量获取方法论，从关键词挖掘、爆款文章撰写到标题优化，拆解一套可复制的短期流量爆发流程。
  nodes:
  - 'no': 1
    name: 长尾关键词获取三法：从下拉词到5118
    desc: 介绍免费获取文章可铺设长尾词的三种工具化方法：微信搜一搜下拉词、搜索栏相关搜索、5118网站长尾词查询，解决“写什么词”的问题。
    role: method
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 2
    name: 爆款文章撰写法：迎合算法而非文笔
    desc: 总结追热点文章的写作原则：字数控制在七八百字以满足文中广告要求；采用整合复制做伪原创；关键词以暗淡颜色呈现以平衡阅读体验，核心是迎合平台算法。
    role: method
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 3
    name: 爆款标题双法：关键词组合与伪原创
    desc: 两种起标题策略：提取排名靠前文章标题中的高频热词自行组合；或直接摘录爆款标题做轻微改动。核心兼顾原创度（利于收录）与吸引力（引导点击）。
    role: method
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 4
    name: 流量承接双模块：关键词回复与收到消息回复
    desc: 介绍公众号后台承接流量的标配设置：关键词回复自动推送链接；收到消息回复设置引导文案，减少读者因不知道回复什么而产生的举报率。
    role: method
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 5
    name: 批量矩阵策略的有效性验证
    desc: 用数据验证批量做号策略的可行性：12个公众号中9个有效，其中3个未上排名，75%的账号成功获得流量，累计新增97385粉、净增44955粉，取关率约53.8%。
    role: experiment
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 6
    name: 批量做号的边界：内容差异性与原创转述
    desc: 指出批量做号策略的适用条件：多账号分发必须保证每篇内容标题各不相同以提升收录率；若仅一两个账号追热点，应尽量用自己话转述做原创。
    role: limitation
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
- 'no': 3
  name: 变现路径设计 —— 从流量到现金的“最后一公里”
  desc: 本章系统拆解两类内容创作者的变现架构：短期热点号的广告+CPS组合打法，以及长期IP的多层次千万营收模型，揭示变现设计中的底层逻辑。
  nodes:
  - 'no': 1
    name: 流量主变现阶段：手动广告位与智能插入的差异
    desc: 对比两种文中广告设置方式，揭示手动将广告置于引导关注文案下方可借助用户第一反应点击与平台误导性推荐显著拉高单价，是流量主收入远超同行的核心原因。
    role: method
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 2
    name: CPS/CPA变现的载体选择：自动回复的蓝字链接
    desc: 解释订阅号文章页链接不生效跳转的平台限制，论证自动回复中可点击蓝字链接是CPS/CPA（如电话卡销售、外卖进群）变现的唯一落脚点，并通过6张电话卡销售400余元的实际效果验证。
    role: method
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 3
    name: 热点变现总账：单日万元的构成拆解
    desc: 汇总单日追热点的全部收益构成：流量主收入6514元（其中3个单号破千）、电话卡佣金400余元、4万余粉丝估值4000元，总变现约1万元，提供热点经济价值的量化参照。
    role: experiment
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 4
    name: 千万营收模型：内容型IP的变现全景图
    desc: 罗列内容型IP几乎全部可变现方式及定价区间：年度会员（标品趋近0交付）、私教3w/3个月、私董会5-20w、合伙/徒弟20w-100w、课程直播（199小课）、咨询1K+/h、轻顾问3w起、重顾问20w/年，构建从低门槛到高溢价的完整产品阶梯。
    role: definition
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 5
    name: 直播1+1+1模式：低成本量产的商业化验证
    desc: 以199元小课为例展示1+1+1商业模式（低成本直播课→剪成小课→短视频切条）的变现效率：一天两播、单场6w、月营收可达400w，证明该模式的规模效应。
    role: experiment
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 6
    name: 变现设计的4近原则与图书增量玩法
    desc: 提炼变现产品设计的底层逻辑“4近”：离钱近好变现、离痛点近好卖出、离易用近好留存、离信任近好复购；并介绍一书一码+联合出品人计划破解传统图书版税过低的增量方案。
    role: method
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 7
    name: 泛粉与洗粉：热点流量的二次变现与局限
    desc: 讨论追逐热点吸引的泛流量粉丝的变现边界：可通过电商导购（淘宝客）或筛选洗粉进行二次变现，但需意识到泛粉价值密度低、取关率高的天然局限。
    role: limitation
    src:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
  - 'no': 8
    name: IP变现的局限：不要相信天道酬勤与全盘复刻
    desc: 指出IP变现中的两个认知陷阱：其一，单靠长期努力而无正反馈基本归零，坚持必须在清晰前景与两周可验证变现的基础上；其二，直接复制他人路径会产生路径依赖并遗漏关键情境，应拆解多模型后取长补短。
    role: limitation
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
- 'no': 4
  name: 方法论的内化与自建 —— 从“借用”到“独创”理论
  desc: 本章探讨如何将外部学到的经验内化为自身的理论体系，重点讲解IP领域独创理论的生成方法、内容体系架构，以及赛道选择与风险控制的金融视角。
  nodes:
  - 'no': 1
    name: 构建体系理论的五大方法
    desc: 系统介绍为IP生成自有独创理论的五条路径：理想解法（TRIZ六步推导）、节点法（抽取服务流程共性节点）、词根法（提炼垂类优势词）、母题法（延展/结合母题）、核心法（提取内容体系核心点）。
    role: method
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 2
    name: 水利私域理论：节点法从服务逻辑中提炼的案例
    desc: 展示节点法的实际应用：为年费50-100w的私域顾问设计“水利私域理论”，通过第一步重构组织结构与商业模式、后续以水为喻（水系/工程/循环）串联，形成独创理论体系的完整过程。
    role: experiment
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 3
    name: 内容体系五件套与十年故事创作法
    desc: 定义IP内容体系的5个构成部分：四级内容架构、一套独有理论、一个十年故事、一份百问百答、一份点线面打通路径；并详解十年故事的制作规范（5-8分钟中视频的素材、结构、文案与音乐要求）。
    role: method
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 4
    name: 从产品到产业链：点线面打通路径
    desc: 讲解内容型IP从可交付最小产品（文章/课程/账号）起步，串联为培训项目，再到理论端、执行端、变现端、IP端、政府支持、人才端齐备后构成产业群组的结构化成长路径。
    role: method
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 5
    name: 传统金融转型Web3：行业扫描与躬身入局方法论
    desc: 复盘从传统金融迈向Web3的全过程：保持对市场风向标与热度词的敏锐、用金融资源接触初创团队以初学者身份参与验证可行性、积极参加分享会结识VC，形成“扫描-入局-验证-链接”的转型闭环。
    role: method
    src:
    - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
  - 'no': 6
    name: 赛道选择的金融视角：选择比努力更重要与容错率控制
    desc: 提出两条投资视角的核心原则：赛道选择取决于前期资金规模，选择比努力更重要；同时应给自己留足容错率，避免早期All in单一方向导致风险失控。
    role: proof
    src:
    - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
- 'no': 5
  name: 护城河与风险意识 —— 长期价值的防守与进攻
  desc: 本章总结内容创作者与创业者在长期竞争中建立护城河的关键要素，以及在经济下行期保护自身、控制风险的生存智慧。
  nodes:
  - 'no': 1
    name: 定位的局限：母题才是护城河的根基
    desc: 论证传统定位、卡位因不从内容角度出发而无法做细化的延展、无法构建护城河；提出“母题”作为文化原型，可承载百变题型，既能搭建护城河又能灵活调整边界，是IP长期价值的根基。
    role: proof
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 2
    name: 3重身份与危机再分配效应
    desc: 讲解IP在不同用户阶段扮演的三种角色：工具（解决功能问题）、人（提供价值主张/情绪）、神（支持迭代升级）；并论证“神”身份的支撑逻辑——危机具有强烈的再分配效应，解决用户危机感即获得话语权。
    role: method
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 3
    name: 4级观感与用户资产的幂次效应
    desc: 定义IP对外呈现的4级观感（松弛感、对象感、获得感、氛围感及其对感性消费的驱动作用），并对比流量堆砌与品牌势能积累两种用户资产的本质差异——后者边界更广、幂次效应更强。
    role: definition
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 4
    name: 文化溢价的实践验证：松弛感与高客单并行
    desc: 通过龙飞律师（松弛感带来的千万粉快速积累）、女性安全内容升级（从防卫到案例分析的文化溢价）、穿搭IP线上发布会（千万-上亿流水）、李子柒IP（文化资产路线）等案例，验证风骨与变现并行的可行性。
    role: experiment
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
  - 'no': 5
    name: 熊市的生存法则：敬畏市场、保护弹药与选对赛道
    desc: 总结Web3熊市中真正能活下来的老鸟的共识：敬畏市场并与市场共舞；年轻团队领袖要保护团队免受市场崩塌的连锁反应（如FTX暴雷）；在资金弹药充裕的基建公司工作是熊市更优选择。
    role: proof
    src:
    - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
  - 'no': 6
    name: Web3市场的规模信号：数据与趋势综述
    desc: 汇总支撑Web3长期价值的量化证据：10年创造3万亿流动价值、Polychain/Paradigm/a16z等公司管理数十亿至数百亿美元资金、全球对冲基金计划5年内将7%资产投入Web3，帮助读者判断赛道趋势。
    role: experiment
    src:
    - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
  - 'no': 7
    name: 星云IP计划的生态构想与个体IP的边界
    desc: 介绍头部玩家构建的IP聚合生态（20个S级IP、年2亿盘子、北京市版权局战略试点项目），展示S级基因为核心的产业群组如何通过理论端、执行端、变现端、人才端协同形成终极护城河。
    role: extension
    src:
    - paper: docs/202301-02/HiVkdfBYJo2H5xxWIemcMcMQnLc.md
