  name: 利他即利己与分享复利 —— 越分享越幸运
  points:
  - '**为什么需要这个概念？**'
  - '- 传统思维认为“教会徒弟饿死师父”，导致囤积秘诀、封闭运营'
  - '- 互联网时代市场容量极大、边际成本趋零，分享反而能引来更多信息回流、资源连接'
  - '- 利他是最高级的利己：通过帮助他人成功，建立信任资产、召唤同频合伙人'
  - '**核心定义**'
  - '- 利他即利己：乐于分享好信息、好方法不藏私，不会因竞争受损，反而因分享获得更大回报和信息回流'
  - '- 分享复利：市场蛋糕极大（分不完），分享行为本身是筛选同频者、建立个人品牌的最高效动作'
  - '- 信息稀缺性悖论：现在最稀缺的是“经过验证的高质量信息”，分享者自带权威光环'
  - '**关键性质**'
  - '- 非零和：知识/经验分享不减库存，反而通过反馈、讨论、迭代增值'
  - '- 吸引力法则：分享什么，吸引什么人；藏私什么，失去什么连接可能'
  - '- 长期复利：短期看似“便宜别人”，长期建立“专家/靠谱/慷慨”人设，转化率极高'
  - '**典型例子**'
  - '- 作者亲证：分享项目拆解、运营心法，未因竞争受损，反而获邀生财办公室、被亦仁高价买号奖励执行力'
  - '- 社群裂变：书里有品0预算冷启动，靠“分销员发圈展示好妈妈形象”（社交货币）首月进10万分销员'
  - '- 开源生态：Linux、React、Stable Diffusion因开源分享成为行业标准，核心贡献者获顶级商业回报'
  - '**边界条件**'
  - '- 核心护城河不分享：如核心算法、独家供应链、法律红线内的商业机密'
  - '- 分享需“高质量”：垃圾内容/过时教程/营销软文伪装干货，会透支信任破产'
  - '- 需配合“接住流量”：分享引来咨询/合作无转化体系（私域/产品/服务），流量即废纸'
