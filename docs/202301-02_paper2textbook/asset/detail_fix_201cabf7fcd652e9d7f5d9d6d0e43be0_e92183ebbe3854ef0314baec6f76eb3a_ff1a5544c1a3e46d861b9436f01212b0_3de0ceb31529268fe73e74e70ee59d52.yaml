life_analogy:
- 想象创业是一场**网球内在比赛**（源自《身心合一的奇迹力量》）：
- '- **自我一** = 爱唠叨、爱评判、爱发号施令的理性教练（经常搞砸事）'
- '- **自我二** = 掌握肌肉记忆、直觉、真实信念的天才选手（真正打球的人）'
- '- **内在比赛** = 教练是否信任选手、选手是否相信自己能赢'
- '- **外在比赛** = 实际的比分、业绩、收入'
- '- **盲目自信** = 教练闭嘴，对选手说：“在我的领域，你就是国王”'
- '- **唤醒成功体验** = 让选手回忆/制造几个“漂亮回球”，激活“我能赢”的肌肉记忆'
- '- **俯视学习法** = 看高手教学时，心态是“朕心甚悦，但朕是国王”，而非跪着记笔记'
- ''
- 再想象**抓住确定性窗口期**像**冲浪者等“组合浪”**：
- '- **香港疫情数据** = 气象卫星云图（相似体系的历史轨迹）'
- '- **首轮感染后平静期** = 浪前的深呼吸窗口（2-3个月确定性红利期）'
- '- **第二波疫情** = 后续的碎浪、乱流（红利归零甚至变负）'
- '- **春天** = 全年最大的一组浪，冲上去就是“先干个春天再说”，错过等明年'
- ''
- 最后想象**价值创造视角**像**种树 vs 采果子**：
- '- **追求增长视角** = 盯着树上果子（销售额/DAU/权力）拼命跳、甚至摇树，果子越跳越少、树也摇死了'
- '- **价值创造视角** = 扎根、浇水、施肥（品牌心智/数据资产/人才密度/用户信任）——这些是**最稀缺、最不流动**的资产'
- '- **不流动稀缺资源** = 树根系，看不见、挪不走、但决定树高、决定抗风、决定年年有果'
- '- **茅台案例** = 八项规定砸牌降价时，别人卖果子（牺牲品牌换销售额），茅台护根系（守住品牌心智），最终成万年老树'
summary:
- concept: 内在比赛理论
  desc: 人有两个自我：自我一（理性/评判）、自我二（潜意识/执行）；内在比赛输则外在比赛必输，核心是自我二是否认可目标
- concept: 盲目自信
  desc: 创业者的理性选择：在能力圈内对自己无条件信任，建立“在我的领域我就是国王”的潜意识信念
- concept: 唤醒成功体验法
  desc: 通过回顾/制造微小成功（先推易卖品），激活潜意识赢家身份，驱动更大成功——成功才是成功之母
- concept: 俯视学习法
  desc: 战略上藐视（我是国王看奏折）、战术上重视（跪着把细节学透），避免跪着学习导致内在比赛输
- concept: 确定性窗口期
  desc: 用类比推演（香港疫情→大陆）判断宏观平稳期，2023春天为3个月黄金窗口，主张“先干个春天再说”
- concept: 增长瓶颈怪圈
  desc: 被增长预期绑架→投机/计算利弊/抓取资源→失去优势→更焦虑，越想增长反而离增长越远
- concept: 价值创造视角
  desc: 从“我如何得到增长”切换为“我如何成为值得被奖赏增长的人”，需面向未来、面向用户、积累价值三种勇气
- concept: 强加成本战略
  desc: 利用自身优势（美：技术/经济）迫使对手（苏联）在弱项（防空/油价/军备）持续高成本应对，拖垮其经济
- concept: 信息差生意
  desc: 真机会在身边被忽视的细节（广告牌/烤面筋/朋友圈卖蟹），网上公开项目基本过时，先有闷声发大财
- concept: 优雅亏大钱三步骤
  desc: 反讽式风控：1)选少数人能赚/看不懂的项目 2)加杠杆大仓位 3)赚不止盈亏不止损——规避这三步即避开致死路径
- concept: 亏钱反期望定理
  desc: 严格反着亏钱步骤做也不保证赚钱，因为赚钱方式千差万别、亏钱方式殊途同归，亏钱是赚钱路上不可缺少的部分
- concept: 正反馈驱动热爱
  desc: 懒惰本质=无正反馈=做得少=不够喜欢/不够缺钱；两条路：找真热爱，或纯粹为钱冲（不别扭不内耗）
- concept: 利他即利己/分享复利
  desc: 市场蛋糕极大、边际成本趋零，分享高质量信息不减库存反增值，吸引同频者、建立权威、召唤合伙人
- concept: 卓越策略师五大能力
  desc: 扎实调研（压倒性投入）、清晰归纳（搜尽奇峰打草稿）、把控全局项目管理、让人难以怀疑的决断力、双重叙事能力
- concept: 道术器用四层框架
  desc: 道=商业本质（用XX解决XX痛点赚XX钱）；术=9维方案（客户/价值/渠道/关系/资源/伙伴/活动/成本/收入）；器=载体工具；用=执行迭代
- concept: 5WHY分析法
  desc: 问题=期望-现状，连续问5个为什么穿透症状找根因（如：老板骂我→报告晚→数据迟→同事拖→闹钟没电→无备用兜底）
- concept: 产品Idea成功率排序
  desc: 原生需求(解决自己问题)>抄竞品做差异>分析搜索词找缺口>预付费定制>生造idea(不推荐)，高成功率需：真实需求+领域专家+能坚持
- concept: 好名字公式
  desc: 低触达/理解/记忆/传播成本 + 好体验理由 + 好延展空间 = 听得懂、记得住、好理解、易传播、易扩散、易延展
exercises:
- 'no': 1
  title: 内在比赛复盘与成功体验唤醒实战
  contents:
  - 回顾你过去 3 个月最想推进但卡住的一件事（如：做公众号、跑通某项目、学某技能）：
  - 1. 识别自我一的唠叨：写下它反复说的 3 句‘你不行’理由（如：没时间、不专业、竞品太强）
  - 2. 识别自我二的真实状态：你潜意识里真信能成吗？若不信，写下‘自我二不认可’的核心证据
  - 3. 执行唤醒成功体验法：列出你此前搞定过的、难度相当或更大的 3 件事（哪怕是‘考上大学’、‘搞定难搞客户’、‘学会开车’），每天出发前花 2 分钟闭眼重温其中一件的‘赢’的感觉
  - 4. 设计‘开门红’微任务：把大目标拆解出一个‘今晚 30 分钟必能完成、且能拿到正反馈’的小动作（如：发 1 条朋友圈测试选题、加 1 个同行微信套话术），完成后记录自我二的反应
  - 回答问题：
  - '- 连续 7 天做‘开门红’后，你对大目标的‘盲目自信’程度有何变化？（1-10 分自评）'
  - '- 为什么‘跪着学’（笔记记满、不敢质疑）会导致内在比赛输？结合‘俯视学习法’说明你的下一次付费学习如何‘俯视’'
- 'no': 2
  title: 确定性窗口期推演与行动方案设计
  contents:
  - 假设当前是 2024 年 1 月，你观察到某新技术（如 AI 视频生成 Sora 级模型开放）引发首轮狂热，类比 2023 春天疫情平稳期判断逻辑：
  - 1. 寻找‘香港数据’：列出 3 个可作为类比参照系的历史案例（如：ChatGPT 开放后的 3 个月、抖音电商 2020 上半年、直播带货 2019 年）
  - 2. 推演‘平静期’特征：从参照系中提取‘首轮狂热后 2-3 个月平台鼓励、流量便宜、竞争未白热化’的共性特征，判断当前是否处于窗口期
  - 3. 定义你的‘旅游/健康/餐饮’三个切入赛道：基于你的能力圈（能做）、资源禀赋（可做）、兴趣（想做），各写 1 个具体切入动作（如：做 AI 视频工具分销/做
    AI 换装带货/做 AI 课程私域）
  - 4. 制定‘先干个春天再说’的 90 天冲刺计划：第 1-30 天跑通 MVP（完成第一单）、第 31-60 天复制放大（做 10 个号/招 2 个兼职）、第
    61-90 天沉淀私域（建立单客价模型）
  - 回答问题：
  - '- 若第 45 天平台算法大变、流量成本翻倍（类比第二波疫情来袭），你的‘止损/转型’预案是什么？'
  - '- 为什么‘不流动稀缺资源’（品牌/数据/信任）必须在窗口期内开始积累，而不能等窗口期结束再补？'
- 'no': 3
  title: 增长瓶颈诊断与价值创造视角切换
  contents:
  - 选取你正在操盘或熟悉的一个真实项目（哪怕是朋友的、同行的），进行‘增长瓶颈怪圈’体检：
  - 1. 症状检查：近 3 个月是否出现‘越投广告/越加班/越跟风竞品、ROI 越低、焦虑越重’的恶性循环？列出 3 个具体表现
  - 2. 归因复盘：用‘重构成功归因复盘法’问两个问题——A) 过去靠什么‘坚持’走到今天？B) 过去抓住了什么‘机会/打破了什么惯例’走到今天？对比两个答案的差异
  - 3. 视角切换演练：把当前核心 KPI（如：月 GMV 100 万）改写为‘价值创造型战略指导原则’（如：成为细分人群‘最信赖的选品专家’），并按‘三种勇气’拆解：
  - '   - 面向未来：放弃哪个‘过去有效但未来失效’的动作？（如：停止无差别投流，转做超垂直 SEO 内容）'
  - '   - 面向用户：新增哪个‘不计算 ROI、纯解决用户痛点’的动作？（如：建立‘买前免费诊断、买后陪跑 21 天’服务）'
  - '   - 积累价值：本季度要沉淀的 1 个‘不流动稀缺资产’是什么？（如：100 个‘信任我选品’的高净值私域用户标签）'
  - 回答问题：
  - '- 为什么‘帮助一万个人赚到钱’是目标不是战略？你的新战略指导原则如何体现‘发挥禀赋、不选劣势’？'
  - '- 结合‘强加成本战略’，你的新动作如何让竞品‘接招成本极高、不接招死得更快’？'
- 'no': 4
  title: 身边信息差挖掘与反向风控演练
  contents:
  - 第一部分：信息差寻宝（实地/线上均可）
  - 1. 打开大众点评/抖音同城/微信‘附近的商家’，筛选‘评分 4.5+、评价数<200、开业>2 年’的店，实地/线上观察 3 家，记录：客单价、翻台率/日单量、显性痛点（如：排队久、无会员体系、不接外卖）
  - 2. 用‘苏州 AO 图文/烤面筋/卖螃蟹’案例逻辑分析：这 3 家店中，是否存在‘单品极致标准化、供应链可复制、老板不想扩张/不会扩张’的信息差？若有，写出‘帮老板做分销/做品牌/做供应链’的合作提案草案
  - ''
  - 第二部分：优雅亏大钱反向体检
  - 3. 列出你近 1 年投入时间/金钱>5000 元但未盈利的 3 个尝试，对照‘优雅亏大钱三步骤’打分（每步中 1 分）：
  - '   - 步骤 1：是否‘只有少数人能赚/我看不懂模型’？（如：不懂合约做合约、不懂跨境做跨境）'
  - '   - 步骤 2：是否‘加杠杆/大仓位/高频’？（如：借钱投流、全职无收入硬扛、高频换项目）'
  - '   - 步骤 3：是否‘赚不止盈、亏不止损、决不退出’？（如：亏了加仓、赚了不提、死磕半年）'
  - 4. 总分≥2 分的项目，立即制定‘止损/转型/清仓’执行清单（含截止日期、责任人、最小可行行动）
  - 回答问题：
  - '- 为什么‘反着亏钱步骤做’（选大众能赚/我看懂、小仓位无杠杆、止盈止损纪律）仍可能亏钱？结合‘亏钱反期望定理’说明'
  - '- 如何用‘利他即利己’化解‘教会徒弟饿死师父’的顾虑？设计一个‘分享得利他’的具体动作（如：把你的选品 SOP 脱敏后发社群/做成公开文档）'
- 'no': 5
  title: 策略师能力自测与道术器用落地
  contents:
  - 针对你当前主导的一个业务/项目，完成‘道术器用’四层画布填写（每层限 100 字以内）：
  - 1. **道**（商业本质）：我们用 [具体产品/服务] 解决 [具体人群] 的 [核心痛点]，赚 [具体钱/模式] 的钱
  - 2. **术**（9 维方案）：客户画像/核心价值/获客渠道/用户关系/关键资源/核心伙伴/核心活动/成本结构/收入来源 —— 各写 1 句核心结论
  - 3. **器**（载体工具）：列出当前用的 3 个核心工具/平台（如：企微+小程序+RPA），标注哪个是‘可替换的’，哪个是‘护城河’
  - 4. **用**（执行迭代）：本周完成的 1 个‘最小闭环验证’、下周计划的 1 个‘关键指标优化动作’、本月需解决的 1 个‘战略级卡点’
  - ''
  - 接着做‘卓越策略师五大能力’自评（1-5 分，5 分为教科书级）：
  - '- 调研能力：最近 1 个月是否做过‘压倒性投入’的实地/数据调研？（而非只看报告/听汇报）'
  - '- 归纳总结：最近 1 个复盘文档是否‘搜尽奇峰打草稿’（反复推敲结构、语言、逻辑）？'
  - '- 项目管理：团队是否有‘量化目标+明确时间节点+高频同步’的 OKR 运行节奏？'
  - '- 决断力：最近 1 个‘让人难以怀疑’的艰难决策是什么？（如：砍掉业务线/换核心供应商/清退合伙人）'
  - '- 双重叙事：对内（团队）和对外（投资人/合作伙伴/用户）的核心叙事是否一致且各自说服力强？'
  - 回答问题：
  - '- 用 5WHY 分析你自评最低的那项能力的根因（连问 5 个为什么），并写出下周要做的 1 个‘刻意练习’动作'
  - '- 你的‘好名字’是否通过‘低触达/理解/记忆/传播成本+好体验理由+好延展’测试？若不通过，给出修改建议'
units:
- 'no': 1
  name: 内在比赛理论 —— 自我二决定你能走多远
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人有技术、有资源、有勤奋，却始终做不成事，核心卡在潜意识不认可目标'
  - '- 外在比赛（业绩、收入）的成败，实则由内在比赛（潜意识信念）决定'
  - '- 李宗伟技术不输林丹，却屡败；老虎伍兹技术未退步，却跌出前百，皆因输掉内在比赛'
  - '**核心定义**'
  - '- 自我一：理性/一般自我，爱分析、评判、发号施令'
  - '- 自我二：感性/潜意识，掌握肌肉记忆、直觉、真实信念体系'
  - '- 内在比赛：自我一与自我二的博弈，核心是自我二是否真心认可目标'
  - '- 外在比赛：现实世界的业绩竞争，结果受内在比赛支配'
  - '**关键性质**'
  - '- 决定论：一旦输掉内在比赛，外在比赛必输，无法靠战术勤奋弥补战略信念缺失'
  - '- 非理性：自我二不讲逻辑，只认“成功体验”和“身份认同”，不认“大道理”'
  - '- 可训练：可通过唤醒成功体验、俯视学习法主动重塑自我二的信念'
  - '**典型例子**'
  - '- 李宗伟vs林丹：37次交手输25次，技术不分伯仲，败在潜意识不信能赢'
  - '- 老虎伍兹：性丑闻后两个月丢世界第一，几年跌出前百，核心是失去“不可战胜”的潜意识信念'
  - '- 优秀推销员：每天先推易卖产品制造“小赢”，唤醒潜意识自信，再攻硬骨头'
  - '**边界条件**'
  - '- 盲目自信≠盲目冲动：需建立在“已验证的能力圈”内，否则是幻觉非信念'
  - '- 无法替代技能：内在比赛赢了只能发挥真实水平，不能让外行打赢专家'
  - '- 环境剧变失效：如海水干涸，最强的鱼也会死，需配合进化论式适应环境'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  excerpts:
  - 人，有两个自我，分别是自我一、自我二。自我一，对应着理性，是一般意义上的自我。自我二，对应着感性，或者说对应着潜意识。
  - 任何一个比赛，实际上是同时进行的两场比赛，内在比赛和外在比赛。内在比赛，也就是英文书名里的'Inner Game'，这是最容易被人忽视的。
  - 人们往往容易忽略的是，如果自我二（也就是潜意识），并不认可这个目标的时候，会输掉内在比赛。一旦输掉内部比赛，外在比赛也会输。
  - 他不是输给了林丹，他是输给了自己。
  - 失败不是成功之母，成功才是成功之母。我一个成功体验，推动一个又一个的成功体验。
- 'no': 2
  name: 盲目自信与唤醒成功体验 —— 给潜意识装配“必胜信念”
  points:
  - '**为什么需要这个概念？**'
  - '- 创业充满不确定性，理性分析往往导致犹豫、恐惧，自我一会拖自我二后腿'
  - '- 潜意识（自我二）只认“成功过”，不认“理论上能行”，必须喂给它确定性证据'
  - '- 普通人缺乏大成就，需用“微小成功”拼凑“必胜信念”'
  - '**核心定义**'
  - '- 盲目自信：在能力圈内，对自己能搞定目标的无条件信任，是创业者的理性选择'
  - '- 唤醒成功体验法：回顾/制造过往成功经历，激活潜意识中的“赢家身份”，作为新挑战的心理燃料'
  - '- 俯视学习法：战略上藐视（我是国王看奏折），战术上重视（跪着把细节学透）'
  - '**关键性质**'
  - '- 正向循环：成功体验→自信→行动更果敢→更大成功→更强体验'
  - '- 逆向工程：没有现成大成功，就用“先卖易卖品”、“先攻简单关”制造小成功'
  - '- 身份锚定：一旦自我二认同“我是搞X的高手”，会自动过滤干扰、调动资源'
  - '**典型例子**'
  - '- 优秀推销员：每天先找优质客户/推易卖品，制造“开门红”体验，带动全天状态'
  - '- 作者建议：做新事前回顾“曾搞定过比这难的事”，唤醒潜意识“舍我其谁”'
  - '- 俯视学习：看付费社群帖子当“奏折”，心态是“朕心甚悦，但朕是国王”，而非跪着求教'
  - '**边界条件**'
  - '- 仅限能力圈内：不懂芯片设计却盲目自信造芯片，是妄想非自信'
  - '- 需配合“进化论”：环境变了（如海水干涸），原有信念失效，需进化出新肺（新能力/新模式)'
  - '- 避免幸存者偏差：只复盘成功不复盘失败，会让自我二积累虚假无敌感'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  excerpts:
  - 一言以蔽之：你需要盲目的自信。因为盲目的自信和乐观，是创业者的理性选择。
  - 这样'舍我其谁''在我的领域，我就是国王'的心态，才是创业者真正需要的心态！
  - 当自己内心很怂、不自信的时候，你需要回顾下自己成功的经历，唤醒自己的成功体验。
  - 比如，一些优秀的推销员，在开展一天的工作时，会先去找一些优质的客户，或者推销一些容易卖的产品，通过这种方式去制造成功体验。
  - 我的答案是：别跪着学！要俯视！你就是国王，把生财有术的帖子，当成奏折来看。
  - 毛主席说，战略上藐视敌人，战术上重视敌人。跪着学生财有术的人，打不赢内在比赛。
- 'no': 3
  name: 确定性窗口期 —— 用数据推演“春天在哪里”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人创业最怕“赌运气”，需要找到确定性高的时间窗口集中火力'
  - '- 宏观周期（疫情、政策、技术爆发）决定了流量、需求、竞争的大基调'
  - '- 错过窗口期=放弃全年最重要机会，如2023春天错过则等下一轮周期'
  - '**核心定义**'
  - '- 确定性窗口期：通过类比推演（香港疫情数据→大陆），判断出的宏观环境相对稳定、需求集中释放、竞争尚未白热化的黄金期'
  - '- 核心判断：首轮大感染后2-3个月平稳期→第二波来临前，是确定性窗口'
  - '- 2023春天：作者判定的全年最重要3个月窗口期，主张“先干个春天再说”'
  - '**关键性质**'
  - '- 类比推演：用相似体系（香港）的历史轨迹，预测目标体系（大陆）的未来'
  - '- 红利递减：窗口期内越早入场红利越大，平稳期结束红利归零甚至变负'
  - '- 多行业共振：窗口期往往催生旅游、健康、餐饮等多个确定性赛道同时爆发'
  - '**典型例子**'
  - '- 香港疫情类比：首轮感染8-9成→2-3个月平静→第二波维持5-6个月感染率减半'
  - '- 2023春节旅游：国内3亿人次恢复88.6%，出境机票涨258%，入境涨632%，酒店涨177%'
  - '- 健康带货：诺特兰德维生素连续两月抖音单品销量第一，多品牌销量过亿'
  - '**边界条件**'
  - '- 仅适用“确定性”判断：不可用于技术突破型、政策突变型不可预测赛道'
  - '- 窗口期≠躺赢：仍需选对赛道、跑通模型、组建团队，窗口只给“风向”不给“风力”'
  - '- 二次感染风险：平稳期结束后流量成本暴涨、转化率下降，需提前布局私域沉淀'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 最近 3~6 个月，是比较确定的疫情平稳期，之后才会迎来第二波疫情的峰值。
  - 香港跟大陆一样，也是第一次大规模疫情感染，就把八九成的居民给感染了。之后香港就进入了 2~3 个月的平静期，平静期之后就进入第二波疫情感染。
  - 至少 2023 年的春天，会是一个比较确定的稳定期。
  - 因为这个春天，可能是今年最重要的 3 个月窗口期。反正我相信春天来了，先干个春天再说。
  - 如果你本身不是干旅游行业的，但是又想分一杯羹，怎么办？最简单的就是做分销，可以做机票、酒店、旅游景点等等之类的分销。
  - 而健康行业，普通人最适合的切口，是保健养生带货。
- 'no': 4
  name: 增长瓶颈怪圈与价值创造视角 —— 别让目标绑架了你
  points:
  - '**为什么需要这个概念？**'
  - '- 企业/个人越想增长、越焦虑、越投机、越计算利弊、越抓取资源，反而离增长越远'
  - '- 根因：被“想拥有的增长”绑架，丧失了面向未来、面向用户、积累价值的三种勇气'
  - '- 表现：面向过去（用旧地图找新路）、计算利弊（不关注用户）、抓取资源（不积累品牌/信任）'
  - '**核心定义**'
  - '- 增长瓶颈怪圈：被增长预期绑架→投机跟风/压榨自己/计算利弊→失去优势→更焦虑→更投机'
  - '- 价值创造视角：从“我如何得到增长”切换为“我如何成为值得被奖赏增长的人”'
  - '- 三种勇气：面向未来而非过去、面向用户而非计算利弊、积累价值而非抓取资源'
  - '**关键性质**'
  - '- 视角重构：转化看待问题的方式，比解决问题本身更关键'
  - '- 稀缺资产导向：识别环境中“最稀缺、最不流动”的资产（品牌、数据、人才、信任）并积累'
  - '- 复盘双轨：除问“坚持什么走到今天”，必问“抓住什么机会/打破什么惯例走到今天”'
  - '**典型例子**'
  - '- 柯达：自认成功源于“坚持高品质”，实则源于“开发低价便捷相机”，用过去定义自己错失数码趋势'
  - '- 宜家：对标者学其“多品类体验店”提高停留时长，忽略其本质是解决“陌生城市一天拥有一家”'
  - '- 茅台：八项规定后中高端白酒降价砸牌，茅台守住“品牌心智”这一不流动稀缺资产'
  - '- 九子夺嫡（四爷）：“争是不争，不争是争”，从争权视角转贡献视角，最终获胜'
  - '**边界条件**'
  - '- 需有“面向未来”的基本判断力：盲目乐观非面向未来，需洞察趋势势能'
  - '- 非否定目标：目标是战略的对象/结果，非战略本身；无目标无导向，执着目标误入歧途'
  - '- 积累价值≠不赚钱：积累品牌/信任/数据是为了更高维度、更长周期的变现能力'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 进入增长瓶颈的一个典型现象，就是越想要增长，却距离想要的增长越远。
  - 如果用一句话来形容这种现象，那就是我们被我们想拥有的东西绑架了。
  - 我发现，破除增长焦虑唯一的方法，就是怎么从追求增长的视角，切换成价值创造的视角。
  - 从一个'我如何得到增长'，变成'我如何成为一个值得被奖赏增长的人'。
  - 真正要去摆脱这种视角，最难的不在于方法论，而是 3 种'勇气'：面向未来而非面向过去的勇气；面向用户而非计算利弊的勇气；积累价值而非抓取资源的勇气。
  - 实际上，这也是一个奇怪的现象，我们花费了太多的精力去抓住无限的、流动的东西，而非关注真正稀缺的、不变的东西。
  - 对一个品牌来说，销售额几乎是无限的而且每年都在改变，但是用户对你高端品牌的心智是稀缺的。
  - 柯达认为自己成功的重要法门是坚持成像的品质和性能……它最初成功的法门并不是高品质，而是抓住技术趋势开发适合更多人群的便捷性产品。
  - 邬思道提出了违反共识却真正行之有效的关键战略，只有八个字'争是不争，不争是争'。
- 'no': 5
  name: 战略三要素与强加成本战略 —— 用优势逼死对手
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人把“定目标”当“定战略”，导致战略成了口号，无法指导具体取舍'
  - '- 资源有限时，必须通过战略指导原则，把优势转化为对手的负担，实现以弱胜强'
  - '- 战略本质是“选择不做什么”，并发挥禀赋（劣势不能做战略方向）'
  - '**核心定义**'
  - '- 战略三要素：1)目的：获得相对优势；2)形式：自始至终的指导原则；3)基础：发挥禀赋（优势）'
  - '- 强加成本战略：利用自身优势，迫使对手不得不持续投入高昂成本应对，拖垮其经济实力'
  - '- 战略非目标论：目标是战略的对象/结果，非战略本身；“帮一万人赚钱”是目标非战略'
  - '**关键性质**'
  - '- 非对称博弈：不在对手强项硬碰硬，而在己方强项/对手弱项发起攻势（美苏：美用技术/经济拖垮苏）'
  - '- 指导原则恒定：战术可变（毒刺导弹、压油价、星球大战），战略指导原则不变（让苏联加成本）'
  - '- 劣势规避：老乡鸡拼卫生/标准化/品牌力会死，战略方向必须是“人情味/现炒”等优势'
  - '**典型例子**'
  - '- 美国vs苏联：苏联国土大防空成本高→美训阿富汗游击队给毒刺导弹打直升机→压油价破坏造血→星球大战逼军备竞赛→苏联经济崩溃'
  - '- LV/耐克/索尼/宝洁：抓住大趋势（铁路/电视/晶体管/广播）做开创性举动（旅行箱/球星代言/随身听/全国品牌）'
  - '- 格力vs奥克斯：格力拼专利/标准（优势），奥克斯拼价格/渠道（劣势），格力以强加成本守住基本盘'
  - '**边界条件**'
  - '- 需准确识别“相对优势”：错判优势会导致战略指导原则指错方向'
  - '- 对手必须有“成本承受上限”：对无成本约束的对手（如无限输血的平台方）失效'
  - '- 指导原则需穿越周期：战术随环境变（毒刺→压油价→星球大战），原则不变'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  - paper: docs/202301-02/20230207_03.md
    role: improve
  excerpts:
  - 首先，战略目的是让你能获得优势或者获得相对优势。
  - 其次，战略应该形成一种自始至终的指导原则。
  - 还有一个呢，就是战略需要发挥你的禀赋。你要是跟老乡鸡、南城香比卫生、标准化、品牌力，那就错了。
  - 因为苏联有几个弱点：国土面积太大……防守成本很高……美国的战略就是，让苏联承受越来越多的费用和成本。
  - 你看，美国所有的行动，都是遵守一个战略指导原则，就是让苏联增加成本。这叫做'强加成本'战略。
  - 战略就是先审视自己手里的筹码，也就是自己的优势，然后再决定自己怎么打牌，也就是如何运用自己的优势来获得你想要的结果。
- 'no': 6
  name: 信息差生意与身边机会挖掘 —— 赚钱机会在脚下
  points:
  - '**为什么需要这个概念？**'
  - '- 网上公开的“月入X万项目”基本已过时，真机会隐藏在身边被忽视的信息差中'
  - '- 普通人容易仰望网红大佬，却忽视身边“闷声发大财”的实体小生意'
  - '- 信息差≠垄断资源，只是“多看一眼、多问一句、多跑一趟”发现的供需错配'
  - '**核心定义**'
  - '- 信息差生意：利用认知不对称（如专业门槛、渠道壁垒、需求隐蔽性）获利，而非依靠技术/资本垄断'
  - '- 先有闷声发大财，网上说赚钱的基本过时：公开教学时红利期已过大半'
  - '- 身边案例法：通过观察本地商业细节（广告牌、烤面筋、朋友圈卖蟹）发现高ROI微生意'
