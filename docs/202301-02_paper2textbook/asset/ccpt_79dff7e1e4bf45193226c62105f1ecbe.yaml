paper: docs/202301-02/20230207_08.md
desc: 该素材是一份名为《龙哥赚钱周报》的社群周报合集，汇集了多个来源的实操经验分享，主题涵盖劳动法合规、高净值客户销售、创业认知、各类平台（抖音、视频号、小红书）的流量获取与变现玩法（如无人直播、无货源店群、社群分销）、跨境电商模式以及AI绘画应用等。素材的核心是提供各类副业与创业项目的实操方法、踩坑经验与案例数据，具有较强的实践导向与信息密度。
concepts:
- name: 买家系统与卖家系统
  desc: 在销售过程中，买家会本能启动自我保护机制（撒谎、给希望、躲起来）以获取免费资讯，而卖家若按传统需求挖掘流程（卖家系统）推进，会在高净值客户面前受挫；破局需从让客户产生好奇开始。
  is_original: false
  excerpt:
  - 通常当一个人你知道他是销售，你出现在他面前的时候，他有一些举动好像是想吸引你的注意，或者是有一些你觉得疑似销售的动作，我们会开始自我保护起来。
  - 这些行为在买家系统里就是一个本能，叫撒谎。我们没有把自己最真实的情感或者是最真实的诉求直接开放给疑似销售人员。
  - 我们要破局的话，我们一定要从一开始自己心里打破这个固化思维。他虽然是一个高净值客户，但是他使用的招数没有比普通客户高明多少，只不过他演技好。
- name: 需求与痛点
  desc: 需求是理性的、缺乏情绪动力的，而痛点是带有强烈情绪驱动的；只有把客户的需求上升为痛点，才能促使其下决定购买。
  is_original: false
  excerpt:
  - 需求和痛点的差别在什么呢？我以为我需要这个东西，它没有什么情绪的动力。
  - 当客户很平静的时候，都是需求，不是痛点。
  - 情绪动力是客户花钱的最根本的点，大客户也逃不掉。
- name: 高净值客户最大痛点：失去掌控权
  desc: 高净值客户（尤其是富一代、创一代）最大的痛点是失去掌控权，恐惧源于未知；抓住这个核心痛点，可以让客户觉得你懂他，从而形成依赖。
  is_original: false
  excerpt:
  - 你不用学那么多，你只要知道他最大的痛点就是失去掌控权，恐惧源于未知。
  - 对一个一直拥有掌控权的人来说更可怕。因为由奢入俭难。
  - 当你抓住了他的这个痛点以后，他第一感觉就是我得找你帮我解决这个事情，别人没发觉。
- name: 社群分销增长公式
  desc: 收入增长=供应链强度 X 顶层设计 X 动员能力；其中供应链强度是基础，顶层设计（关系绑定、佣金机制等）是杠杆，动员能力是放大器。
  is_original: false
  excerpt:
  - 收入增长=供应链强度 X 顶层设计 X 动员能力
  - 供应链强度：你的产品是否有优势。标准品=更低的价格。非标准品=发圈转化率
  - 顶层设计：如何确认关系绑定，商品销售的流程，佣金分配机制，分销员升级机制等。动员能力：你对分销员团队的影响力。
- name: 发圈动力公式
  desc: 发圈动力=佣金/设计交压力；产品需要具备社交货币价值，让分销员发朋友圈、私聊没有压力，才能形成自发传播。
  is_original: false
  excerpt:
  - 发圈动力=佣金/设计交压力。
  - 社群分销主要依赖推广员发朋友圈、发社群和私聊。挖掘产品的社交货币价值。
  - 发朋友圈介绍好书，展示出的是爱阅读爱学习爱教育的好妈妈形象，正向价值观，所以大家都疯狂发圈。
methods:
- name: 高净值客户销售破局法
  desc: 针对高净值客户销售，先通过反问或布置功课引起客户好奇，跳出其熟悉的买家系统；再通过将需求上升为痛点和重塑行业概念建立权威；最后通过提问（聊小孩、谈自己、谈传承）形成长久依赖。
  excerpt:
  - 引起好奇的方法，我通常先反问或者是先给客户布置功课。
  - 我就对高净值客户说，我要和你谈的不是钱的问题，是一个趣味性的问题和价值的问题。
  - 灵魂三问，它就是一个递进，第一你是怎么想的？第二的话是在想的过程中我们做了哪些准备？那你会发觉卡住了吗？这个卡点怎么解决？你想不想再多一点点？
- name: 商业拆解复制副业法
  desc: 通过刷短视频平台发现商业案例，拆解其从前端内容生产到后端导流私域及转化成交的整个流程，判断项目是否可复制（货源非独家、场景验证有需求），再通过低门槛复制（如找代工厂、与公众号合作）快速变现。
  excerpt:
  - 拆下来之后，我就发现很多时候有些项目是完全可以复制的，是不需要投入几十万也可以复制的。
  - 分析完上述内容后，我基本上判断这个项目是可以复制的。首先，这个视频爆得偶然；其次，他货源不是他自己的；最后，这个消费场景经过验证是证明是有需求的。
  - 定完产品定引流渠道，我觉得做生意需要确定性，我不需要偶然性，所以我就设计了两个渠道，两条腿走路。
- name: 无人直播素材获取与合作法
  desc: 无人直播的核心是准备高质量素材，主要方法有两种：一是录播别人的内容（需经过审查看是否出现违禁词、去重处理，且不能录带品牌标识的）；二是与商家合作录制真实直播间（私聊客服提出带货请求，获得授权后录制真实场景，提升直播间拟真度）。
  excerpt:
  - 准备直播素材就是准备你直播时需要循环的视频，这包括视频和音频。一场直播的成功与否，素材的优劣就占了半壁江山。
  - 我们怎么解决的呢？直接去这个品的小店，私聊客服。问：店主你好，我是一名主播，很喜欢你的这款商品，可以去 KS 带你的货么？
  - 我一般会录制真实直播间（有真实的场景、有真人且激情的主播），这样在我开播的时候，是无法从肉眼上来判断我在无人直播，直播间非常"拟真"。
- name: 视频号无货源店群操作法
  desc: 通过开旗舰店（买商标授权）或普通店刷入池的方式进入视频号优选联盟，选品后大量铺货（使用采集插件和搬家工具），通过拼多多等低价货源平台采购，最后由达人带货成交，赚取差价。
  excerpt:
  - 视频号无货源店群关键操作有：开店，入优选联盟，选品上架，拍单发货。
  - 先去买对应的商标授权，比如图书类目就去买 16 类的商标授权。哪里买？淘宝拼多多都行，一年授权 300 以内
  - 采集链接我们一般是用的至尊宝插件，其他插件也可以，采集网页版拼多多，批量导出商品链接。
- name: 社群分销冷启动与增长法
  desc: 社群分销冷启动的关键不是运营而是选品，选择标品、有社交货币的产品；通过找到1-2个核心意见领袖作为传播节点引发指数级裂变；增长期只抓大团长，不赋能太过，用爆品而非盲目增加SKU来驱动。
  excerpt:
  - 社群分销最重要的不是运营，而是产品，是供应链的强度和差异化
  - 只要触达到了一两个核心节点，应该是将会引起指数级裂变。
  - 真正对团长激励最大的，是爆品带来的佣金反馈。
  - 平台主要靠爆品挣钱，严格服从二八定律，20%的产品贡献80%的利润。
- name: TikTok+Shopify 独立站爆品模式
  desc: 通过 TikTok Ads 引流到 Shopify 独立站，利用一件代发（Dropshipping）模式变现；核心是选品（高价格感知、可x3倍定价、新鲜度、有痛点）、测品（CBO
    50-100美金广告预算）和落地页优化。
  excerpt:
  - TIktok+shopify 跨境电商模式，其中主要运用的商业模式就是 Dropshipping，也叫做直销，简单点就是一件代发模式
  - 这里推荐使用 CBO 的方式去投，50-100 美金预算都可以，广告会根据每个广告组的数据情况来，自动分配预算
  - 落地页是提升我转化率的关键，客户进去看起来是像一个品牌站还是杂货铺
- name: AI 绘画关键词扩句法
  desc: 通过对一个核心词（如"虫洞"）进行无限衍生扩句来生成关键词，扩句的逻辑是：形容词，人/物，风格，滤镜；通过这个思路可以创作出独一无二的 AI 绘画作品，而不是简单复制别人的关键词。
  excerpt:
  - 会扩句就会写关键词
  - 我个人感觉，关键词就是在扩句。而扩句的逻辑是：形容词，人/物，风格，滤镜
  - 在虫洞的基础上，无限加词，发挥你的想象力，可以衍生无数个图
- name: 个人优势账号定位法
  desc: 找一张空白A4纸，写下你每天都会做的事，从中梳理出至少3个账号定位方向；再从这些定位中选择你最喜欢的那个，因为只有喜欢才能长久做，才能在细分领域做到顶级。
  excerpt:
  - 这里给新手圈友们一个炒鸡简单、又高效的办法：找一张空白 A4 纸，写你每天都会做的事。
  - 这条时间线，起码能找到 3 个账号定位
  - 做你最喜欢的！！这句话，很重要。因为喜欢，才能长久的做；能长久的做，就有可能找到属于你，最擅长发挥的细分领域，把这做到顶级。
theorems:
- name: 劳动合同有效性理论
  desc: 一份有效的劳动合同不仅指合同本身，必须包含岗位考核表、公司规章制度、廉洁自律协议、员工保密协议等附件；合同是枪，附件是子弹，缺一不可。
  excerpt:
  - 一份有效的劳动合同，不止只是劳动合同，而是一定是包含了岗位考核表、公司规章制度、廉洁自律协议、员工保密协议等附件。
  - 劳动合同就等于是一把枪，而这些附件，就是子弹。你的枪再好，没有子弹也是无济于事。
- name: 辞退损失最小化原则
  desc: 处理被辞退员工时，公司只能尽量减少损失而无法完全避免，核心操作包括安排会表达的人去谈、引导签署离职表（原因写个人原因且公司不盖章）、离职当天结清工资、收集证据备不时之需。
  excerpt:
  - 我们只能尽量减少最少化，而不能完全避免，因为没有办法
  - 无论员工公司主动离职还是被辞退，一定要引导他签署离职表。离职原因最好是写"个人原因"或者"其它"
  - 工资建议在离职当天就给他结算完，千万不要拖，非常重要。
- name: 视频号后端价值理论
  desc: 视频号后端（无货源店群）能挣钱的根本原因是后端商品的缺乏，选品库不够丰富，所以即使现在去做暴力铺品依旧能出单；且一定要做店群，用矩阵思维来对抗不确定性。
  excerpt:
  - 视频号后端能挣钱的根本原因是因为后端商品的缺乏，视频号选品库整体依旧还是不够多不够丰富的
  - 所以即使现在去做暴力铺品依旧能出单，而且一定要做店群，去多做店，数量越多越好，越多越稳定，最起码要做 5 个以上的店铺，要用矩阵思维来对抗不确定性！
- name: 社群分销佣金分配底层逻辑
  desc: 一级佣金高则普通分销员卖货意愿强但难吸引大团长；二级佣金高则团长招商积极但普通分销员动力不足；调高二级佣金招商裂变更快，调高一级佣金平台发展更稳健。
  excerpt:
  - 一级佣金高，普通分销员卖货的意愿强，但是很难吸引到大的团长。
  - 二级佣金高，团长很积极招商和拓展团队，但普通分销员带货的意愿不足。
  - 一般来说，调高二级佣金，招商裂变更快。调高一级佣金，平台发展更稳健。
- name: 平台生命周期与投放策略
  desc: 在任何一个平台做生意，需要跟随平台的战略阶段调整打法：增长期平台鼓励各方资源快速涌入，适合激进投放；没有增长期（存量期）平台更重视生态建设，需要从自身找原因（合规、素材原创、发货时效等），否则会被清理。
  excerpt:
  - 不同时期不同打法在任何一个平台做生意，当你感觉不好做的时候，一定要马上去跟进平台的步伐调整，不然等你没做的时候，那会就是你被平台淘汰了而已。
  - 增长期平台希望各方面资源，各方面服务都快速拉去来，以到达用户数的高点，那争取更好的竞争力。
  - 没有增长期平台更希望用户各方面服务和信息，能够更好干净绿色，所以平台宁愿不赚眼前的钱也要把服务和生态建设好。
findings:
- name: 劳动合同纠纷案例经验
  desc: '[evidence] 通过品牌部张先生（赔付22500元）、运营部徐女士（赔付4500元）、短视频部李女士（赔付2500元）三个真实劳动纠纷案例，总结出劳动合同必须及时签、建立考核表、完善合同体系的经验。'
  excerpt:
  - 案例一：品牌部张先生劳动纠纷事件...赔付了 22500 元
  - 案例二：运营部徐女士劳动纠纷事件...赔付了 4500 元
  - 劳动合同一定要及时去签，特别是遇到一些节假日时
  - 员工一定要考核，同时一定要建立周考核表
- name: 商业拆解复制案例验证
  desc: '[evidence] 通过拆解儿童游乐爆款视频，判断项目可复制（货源非独家、场景已验证），三个月招40多个加盟商变现约40万；并验证了拆解设计logo账号和艺术签名账号均可复制变现。'
  excerpt:
  - 三个月时间内我们招了 40 多个加盟商，2 万一个就是 80 多万，刨去各种成本费用，基本上半个月我们赚了 40 万。
  - 分析了上述内容后，我基本上判断这个项目是可以复制的。
  - 设计艺术签名的免费素材全网有很多。而且经过我们验证，通过这个艺术签名的这样的一个在小红书里面的笔记爆的概率是比较大。
- name: 无人直播单场百万销售额
  desc: '[evidence] 通过自主研发硬件（伪装成摄像头的黑色盒子）规避系统检测，录制真实直播间进行无人直播带货，单场销售额达到116.8万，验证了无人直播天花板高的特征。'
  excerpt:
  - 我在抖音的一场直播，7 月 16 号一天卖了 116.8 万，无人直播能拉到的销售额，甚至比大多数真人直播都要高。
  - 打开直播伴侣--添加摄像头--选中盒子--开播。开播内容就是你拷贝在盒子上的内容，这个方法可以防止系统检测。
- name: 视频号无货源店群盈利数据
  desc: '[evidence] 通过7个店铺的日度数据显示，单店日营业额约1122元、毛利约30%（每天300-400元利润），多店运营可实现单店月利润约1W，10店月入10W+；且每月均有达人爆单带来的额外利润（每次几万）。'
  excerpt:
  - 今天这 7 个店营业额加起来 7858，平均到单店营业额就是 1122，正常毛利在 30%左右，单店一天的利润也就 3，400 左右。
  - 多起一些店，再精细点做，平均一个店能做到月利润 1W 左右，做 10 个店就是 10W 了！
  - 我们每个月也都会碰到几次（达人爆单）。
- name: 社群分销冷启动与增长成果
  desc: '[evidence] 书里有品（童书社群分销平台）通过0预算冷启动，2020年4月上线第一个月进来10万分销员，2年内做到80万+分销员、1.5亿销售额，成为行业头部；验证了"找到核心传播节点即可引指数级裂变"的判断。'
  excerpt:
  - 2020 年 4 月上线，第一个月没有花一分钱投放，进来 10 万宝妈和老师做分销员。
  - 80 万+的分销员（我们称为阅读推广人），200 多家出版社入驻直发，1.5 亿销售额，4 轮融资
  - 只要触达到了一两个核心节点，应该是将会引起指数级裂变。
- name: 抖音引流卖教辅资料变现数据
  desc: '[evidence] 通过抖音图文内容引流1-6年级家长到微信，再以39.9元/年级的虚拟资料变现，两个月加好友3000人、成交1000+人（转化率30%），团队三人共获利45610元。'
  excerpt:
  - 10 月底开启了正式变现，到目前位置前期测试+后续稳定大约两个月时间三个人总共获利 45610 元。
  - 共加好友接近 3000 人，客单价 39.9，成交 1000+人，转化率 30%左右
  - 我们卖的 1-6 年级的学习资料，一个年级只需要 39.9，和做年费社群一个道理
- name: 新手抖音账号起量经验
  desc: '[evidence] 通过新注册的抖音账号，从0开始做知识分享型博主的VLOG，第四条视频从300播放量一天内涨到6万+，5天涨到456个粉丝（第4天17个粉丝），且开播2.5小时带来4000+观众和97个新粉，验证了"新号比断更老号好运营"和"流量来了要把握"的经验。'
  excerpt:
