- name: AI 绘画变现可行性验证
  desc: '[evidence] 一个非技术背景的普通办公人员用20多天时间跑通了AI绘画项目并变现1000元；但另一位实操者尝试用API接口开发AI绘画小程序，因预算超出预期、无营业执照、工期过长、流量风险等原因最终放弃，提示了该项目对个人创业的进入门槛。'
  excerpt:
  - 这二十多天的探索过程中...让我跑通了 AI 绘画这个项目，形成了一个小闭环，截止到 12 月 1 日变现了 1000 块钱。
  - 最终我放弃了，原因如下：1.预算远远超出了预期... 2.没有个体和公司执照... 3.工期在 15-20 天左右，对于热点来说，这个时间怕是早就凉透了。4.最为关键的一点，虽然微信搜索指数
    AI 绘画出现了异常值，但这次的流量 99%来自于公众号。
