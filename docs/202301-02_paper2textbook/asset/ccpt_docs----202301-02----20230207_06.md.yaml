paper: docs/202301-02/20230207_06.md
desc: 本文是2022年12月20日发布的一期付费社群赚钱周报，汇编了多篇精华帖与风向标。核心内容涵盖四类知识：一是关于流量运营的认知与方法（如从UV/PV看细节、流量价值公式、流速控制、流量合并等）；二是财富积累与人生四阶段的财商思维（出卖劳动力、一份时间多次卖、购买他人时间、钱生钱）；三是大量可实操的副业项目与具体玩法（抖音带货、小说推文、小红书资料号、AI绘画、ChatGPT套利等）；四是公司治理与股权设计方法论（三会一层、组织架构、股权顶层设计）。本期周报以信息密度高、实操性强为特点，提供了多个已跑通的变现路径及其复盘细节。
concepts:
- name: 流量价值公式
  desc: 流量的实际价值由流量规模、交易相关性和信任度三个因素的乘积决定，其中规模只解决连接问题，相关性和信任度才决定交易转化。
  is_original: true
  excerpt:
  - 流量价值=流量规模×交易相关性×信任度
  - 有时候我们面对一篇阅读量很高的文章、一篇赞藏很高的小红书笔记、一个很火的抖音视频，会感到困惑或焦虑。因为我们只看到了表层的流量规模，有些慌张，但流量规模只解决连接的问题，不解决交易的问题。比流量规模更重要的是流量相关性…信任度怎么看？有的连接带来的价值有限，这和连接给UV带来的感受有关…不轻易连接，但连接必有价值。
- name: 财富积累四阶段
  desc: 人群按赚钱方式可划分为四个递进阶段：出卖劳动力（打工）、一份时间多次卖（写书/卖课）、购买他人时间（当老板）、钱生钱（投资），且必须依次跃迁，不可跳跃。
  is_original: false
  excerpt:
  - 财富积累分为四个阶段，第一：出卖劳动力；第二：一份时间多次卖；第三：购买他人时间；第四：钱生钱。
  - 第一阶段，出卖劳动力…第二阶段是一份时间多次卖…第三个阶段是什么？购买他人时间…第四个阶段，就是去钱生钱了…你就是投资。
- name: 人生四阶段
  desc: 与财富积累对应的个人成长路径：初入职场（30岁前扩广度）、中年危机（30岁后做管理拉高度）、第二曲线（副业/改命机会）、复制商业放大（钱生钱）。
  is_original: false
  excerpt:
  - 人生四个阶段，第一阶段：初入职场（30 岁以前）…在这个阶段你要不断的长见识，要不断的去尝试不同的行业、不同的岗位、不同的职业…第二阶段，中年危机，在这个阶段一定要去做管理…第三个阶段的话，其实我就是你要开始在你的主业以外，你要去寻找自己的第二曲线…第四个阶段其实就是你在第二曲线找到了一个
    MVP…然后组建团队给它放大。
- name: 刚需生意观
  desc: 创业选择项目应以刚需为前提，只有刚需项目才能推得动，非刚需链条太长最终挣不到钱，项目的本性成就人而非人去推动项目。
  is_original: false
  excerpt:
  - 我现在的理念就是非刚需的项目都不做了，我现在手上在循环的项目，也只有副业和减肥两个事情。
  - 不够刚需的事情现在一律不敢做了…其中的原因就是不够刚需，链条太长了，你认为你推的动，结果就是挣不到钱…最终是项目的本性成就人，而不是人去推动一个不够刚需的项目。
- name: 三会一层
  desc: 公司顶层治理的四类机构及其权责关系：股东会（最高权力机构）、董事会（决策机构）、监事会（监管机构）、高管层（执行机构），按公司法赋权形成治理闭环。
  is_original: false
  excerpt:
  - 三会一层：股东（大）会、董事会/执行董事、监事会、高管层；
  - 股东会选任董事会成员/执行董事…董事会/执行董事选任高管层经理…股东会选任监事会成员，监事会监督董事会/执行董事、监督高管层经理，向股东会负责汇报。
- name: 内容价值金字塔
  desc: 小红书等平台的内容价值由低到高分为三层：给娱乐（情绪价值难变现）、给工具（实用性可引流）、给方法（打造个人IP壁垒最高），核心逻辑是价值交换。
  is_original: true
  excerpt:
  - ①给娱乐：搞笑号、剧情号，他们的数据很好，用情绪价值交换了用户的注意力，但是很难变现。
  - ②给工具：给工具满足更加实用性的需求…最常见的是给整合资料，帮用户节省时间…这就是当下很火的虚拟资料项目。
  - ③给方法：通过给方法，解决问题，抢占专业认知，打造个人 IP。
- name: 公域引流私域变现
  desc: 整套商业模式的底层逻辑：把公域平台的流量导入微信私域进行一对一反复成交，因为公域流量属于平台、私域流量才真正属于自己。
  is_original: false
  excerpt:
  - 核心区别是：公域流量属于平台；私域流量属于自己。
  - 我们的目标是把他们引流到微信上…所以我们整套商业模式的目的只有一个：把所有公域平台的流量导入微信私域。
  - 整个项目的 5 句核心心法：1. 定位即人群、2. 人群即内容、3. 内容即流量、4. 流量即转化、5. 转化即模式。
methods:
- name: __overview__
  desc: 本期周报的整套方法论是「认知驱动+最小成本验证+快速行动」：先建立流量/财富/治理等底层认知，再用MVP小成本验证产品，最后用像素级模仿和极速迭代推动项目落地变现。
  excerpt:
  - 要让自己养成精益思维，用最小成本验证那些最不确定的因素，先有一个假设，然后设计一个 MVP 测试。
  - 先行动就对了，行动才是解决一切焦虑的最好办法。
  - 不要想太多，先行动
- name: 流量切片分析法
  desc: 将流量数据如UV/PV按横向（来源渠道、涨跌趋势、干预动作）和纵向（用户背后的需求、行为路径、业务价值）切成片分析，才能形成可执行的运营干预动作。
  excerpt:
  - 横向你要看：这 200 个 UV 从哪里来？有哪些渠道？哪些涨了？哪些跌了？趋势如何？原因是什么？可干预的运营动作是什么？
  - 纵向你要看：UV 的背后是用户，这个用户来到页面前经历了什么？有着怎样的需求？为什么要来？停留了多久？去向了哪里？离开的时候和刚进来有什么不同？能不能形成业务价值？
  - 流量要切成片来看，才有可优化的空间，才能形成可执行的运营干预动作。
- name: 流量合并方法论
  desc: 通过设计让流量主赚更多钱的方案来整合其流量，实现'流量不为我所有，但为我所用'，因为让流量主赚更多钱的人将获得其所有积累的流量。
  excerpt:
  - “我自己认为世界上流量按照所有权分类只有两类：一个是自己建团队获取流量，还有一类是整合别人的流量。”
  - 谁能让流量主赚更多的钱，谁就拥有了这个流量主的流量。
  - 我们假设有一个 KOL，积累了四五年的流量…现在如果我能想一个办法出来，让他卖我的货，一个月能赚二十万，那这个人四五年积累的流量就会为我服务…在这个世界里并不缺流量，真正缺少的是把流量价值最大化的方法。
- name: OKR 制定与执行要点
  desc: 制定OKR时战略要坚定、KR必须直接推动O、O要有可衡量标准；执行时用MVP验证最不确定因素、与关键角色高频同步、增加问题暴露场景和勇气。
  excerpt:
  - 战略坚定是最底层的成功要素…作为 KR 的负责人，重点关注的是 O，不是 KR。KR 一定要能对 O 产生直接推动…
  - 要让自己养成精益思维，用最小成本验证那些最不确定的因素，先有一个假设，然后设计一个 MVP 测试。
  - 一定要和关键角色高频同步…增加问题暴露的场景，和问题暴露的勇气。
- name: AI绘画提示词公式法
  desc: 用'主体+环境+前后缀'的公式结构化编写AI绘画提示词，并通过扩句丰富细节、词语替换改写、权重控制（::数字）等技巧精准控制出图效果。
  excerpt:
  - 通过上述思路再简化，在脑海里思考一个大概的画面，然后通过公式来写提示词，可以简化为：主体指的是画面中的主要部分…环境指的是画面中的背景、场景等…前后缀指的是对画风要求词、对引擎使用词、对整体效果的要求词。
  - 根据公式去分析原来的结构，然后提取其中自己想要的效果，接着加入自己的想法，进行测试。
  - 在一段词之后加上'：：数字'即可调整权重，基础权重是 1…数字的取值范围一般是在 0~5 之间。
- name: 小红书资料号五步法
  desc: 小红书资料号变现的核心流程：定位选品（人群-内容-流量-转化-模式）、养号、内容获取（买同行资料）、图文制作（引流类+干货类）、上传分发并配合10种引流方法转私域。
  excerpt:
  - 简单讲，就是通过在小红书发布内容，吸引潜在客户添加微信领取资料，单份资料依据行业不同 19.9-199 不等，转化率 30%-40%。
  - ①引流类…采用发一半留一半的方式，暗示手法告诉客户：这只是一部分。想要完整版，加我微信。
  - 小红书最新养号 sop 流程：第一天：养号 1 次…第七天后：每天发布 2 条图文笔记。
- name: 五位一体成交飞轮
  desc: 私域一对一成交的五步法：破冰（好感建立）、诊断（放大需求）、方案（成交铺垫）、信任（突破抗拒）、成交（引导下单），解决客户为什么必须买/为什么跟你买/为什么现在买三个问题。
  excerpt:
  - 私域成交有逻辑、有章法…我把整套成交逻辑整理成了五位一体成交飞轮：①破冰——好感建立、②诊断——放大需求、③方案——成交铺垫、④信任——突破抗拒、⑤成交——引导下单。
  - 多数犹豫不决的客户，究其根本都是因为三个原因：为什么必须买？为什么跟你买？为什么现在买？
  - 想解决这个问题…心理学领域，有一个专业的名词'损失厌恶'。
- name: 抖音爆单承接法
  desc: 抖音带货爆单后的快速承接策略：视频爆了立即上传同内容视频并建合集带爆新视频；流量视频与带货视频双路并进；视频一爆立即开直播双频共振。
  excerpt:
  - 视频一爆，立马上传同内容的视频，并创建合集，大概率能把新的视频带爆…同款产品流量视频与带货视频都要发，相辅相成…视频一爆，立马开直播，双频共振。
- name: 股权顶层设计四要素法
  desc: 股权设计围绕顶层控制权、进入机制、分配机制、退出机制四个核心因素展开，内部不乱才能更好打市场，但不存在放之四海而皆准的方案。
  excerpt:
  - 做股权顶层设计时考虑的核心因素，还是顶层控制权、进入机制、分配机制、退出机制。
  - √：有操盘能力、有责任心的好人拥有公司的控制权…进入机制：资金型股东溢价进入，资源型股东对赌进入，技术型股东专利进入…分配机制：静态分配+动态调整…退出机制：退出时间约束、约定回购原则、约定回购价格。
- name: 热点套利技术栈
  desc: 面对流量热点，技术驱动的从业者应用已备好的技术基础设施最小成本快速响应：注册域名公众号/小程序、接入API、做镜像站，从而实现抢名+引流+变现。
  excerpt:
  - 最重要的是要打造好自己的或者团队的技术基础设施，这样可以用最短的时间来迎接风口…
  - 第一个推出该功能，并且第一名的名字在手里，必然会拿到最多的搜索流量
  - 我又花了十几分钟，写了一百多行代码，成了全网首个把'ChatGPT'集成到公众号的人…我又花了十几分钟，做了一个 ChatGPT 的镜像的镜像（套娃）…包在小程序的壳子里上线了。
theorems:
- name: 流量流速悖论
  desc: 流量必须保持不快不慢、持续不断的流速才能产生最大价值：太快无法形成连接和停留、太慢丧失规模，核心是增加用户停留时间并保持规模。
  excerpt:
  - 流量的速度太快、没有停留、规模再大也没有用，流量一直停留不动也不行，等于没有了规模。
  - 流量的核心是流和量，就要流动也要停留、不快不慢、持续不断，这样的流量价值才是最大的。
  - 增加用户的停留时间。
- name: 交易目的论
  desc: 从交易目的看，单纯的页面曝光（UV/PV）没有价值，无互动的曝光反而负价值，一切运营应以交易为最终目的。
  excerpt:
  - 所以，从交易目的来看，单纯的页面曝光是没有太大价值的，如果是内容页面，有曝光无反馈反而是负价值。
  - “让该来的来，让该走的走，多不重要，合适就好，我们的目的是交易”
  - 没有互动就没有价值，平台不给流量。
- name: 买卖生意商业三分论
  desc: 买卖、生意、商业是三件不同层级的事情：自己做所有事是出卖劳动力（买卖），通过代理商/多次卖出是生意，建立可复制放大的模式才是商业。
  excerpt:
  - 首先你要清楚的是买卖、生意、商业是三件事情，所以你做的事是需要自己去做所有事，那就是第一个阶段——靠出卖劳动力赚钱。
  - 如果你像段永平那样，有很多代理商，然后通过代理商让自己赚个几百亿，那就是代理商赚差价的天花板级别了。
  - 商业的本质是什么？其实就是卖卖卖，就是你能给别人创造价值，而创造得这个价值只要是客户所需要的就可以不断的去卖。
- name: 顶尖人才不必管理的悖论
  desc: 能做到从别人口袋拿钱和把思想装进别人脑袋两件最难事的人是聪明人，而聪明人不好管理，因此要在理解规则的前提下最大化让自己过得好。
  excerpt:
  - 这个世界上面有两件事情是最难的。第一件事情是从别人口袋里面拿钱。第二是把你自己的思想装进别人的脑袋里面…
  - 所以，如果说你能做到这件事情，你是一个聪明人，那聪明人其实是不太好管理的，因为中国人太多了。
  - 所以不论什么情况，我们唯一能做的事情是什么？我们要理解它的规则，理解天道，理解社会真相。理解了之后，我们如何在规则之下能够去最大化的让自己过得相对的很好。
- name: MVP先卖后做论
  desc: 验证产品应优先卖想法而非做产品，通过高意向付费人数判断需求是否成立，实现短时间测试几十个产品。
  excerpt:
  - 比如最重要的是先卖产品的想法，而不是做产品。如果聊了 100 个人，只有几个人买，肯定有问题；如果 20-30 个人购买，交了预售金，那这个不确定因素就解决了。
  - 这样我们就能够在短时间内测试几十个产品，最后得出一个正确选项，这是最好的验证方式。因为筛选大于培养，尝试次数多了就知道哪个是比较好的方案。
- name: 战略稳于执行论
  desc: 公司经营不善或倒闭的根源更多在治理层（三会一层）而非管理层/执行层，战略既不是一朝一夕的事，也不是朝令夕改的事，战略是三会一层要做的事。
  excerpt:
  - 所以，公司如果经营不善或者倒闭，更多的原因，不是下面的管理层、执行层，而是治理层'三会一层'。
  - 战略，既不是一朝一夕的事，也不是朝令夕改的事。战略，是三会一层要做的事。
  - 股东会、董事会做出公司的战略方针时，要绘制地图、要选择路径、要制定当下一步的计划、要抬头看路，要慎之又慎，不要朝令夕改。
- name: 利他等于利己
  desc: 乐于分享好信息、好方法不藏私，不仅不会因竞争受损，反而会因分享获得更大回报和更多信息回流。
  excerpt:
  - 利他等于利己，越分享越幸运。
  - 曾有朋友反问我，你就不怕你把赚钱的信息分享出去，别人抢了你的蛋糕？…事实证明，你越利他，你得到的回报会更大。现在最稀缺的就是信息…这市场这么大，蛋糕分的完吗？
findings:
- name: 单日1000有效咨询的流量操盘实践
  desc: '[claim] 作者宣称通过按片分析流量、控制流速、合并流量等方法，可让C端业务单日获得1000个有效咨询；[evidence] 该宣称基于作者与多平台操盘手交流及自身操盘经历，素材中未提供具体数据表。'
  excerpt:
  - 在今天的环境下，我可以让我们的 C 端业务单日获得 1000 个有效咨询，一直以来，我对流量的理解深度和把握效率应该是比较自信的。
- name: 非刚需项目失败案例
  desc: '[evidence] 作者10年创业失败4次、负债百万靠自媒体上岸，总结归纳出非刚需项目做不起来的结论；[claim] 作者主张''非刚需的项目都别做''，认为不够刚需的项目因素链条太长而推不动。'
  excerpt:
  - 本人创业 10 年创业失败 4 次，负债百万靠自媒体上的岸…
