- location: ch32.3
  claim: 母题下有百变题型，题型可模块化、解法可标准化
  reason: 素材P002中仅提及'母题下有百变题型'及'百变题型最好都可以解'，未明确论证题型模块化与解法标准化的可行性与方法
- location: ch32.4
  claim: IP是少数人的领地，每个IP的花期和成长环境不同，不要走别人的路径
  reason: 素材P002中提及'IP是少数人的领地'，但未展开论证'花期和成长环境不同'的具体内涵与判断依据
- location: ch32.5
  claim: 神身份的权威必须建立在危机再分配效应之上，不能靠话术包装
  reason: 素材P002中虽提及'危机具有强烈的再分配效应'，但未直接论证'神的权威不能靠话术包装'，该结论属于教材推导
- location: ch32.6
  claim: 4级观感具备至少两个即可促成感性消费
  reason: 素材P002中称'具备至少两个观感才可以'，但未提供实证数据支撑'至少两个'的阈值判断
- location: ch32.7
  claim: 一个IP可以有17种版权，其中13种可交易
  reason: 素材P002直接陈述该数据，未引用权威来源或法律条文支撑版权分类与可交易数量的具体依据
- location: ch32.8
  claim: 内容体系五件套互相咬合，理论支撑内容、故事增加信任、百问百答承接流量
  reason: 素材P002列举五件套组成，但未详细论证各组件间的咬合机制与协同效应
- location: ch32.9
  claim: 节点法从服务流程提炼共性节点可生成独创理论
  reason: 素材P002仅给出'水利私域理论'单一案例，未系统论证节点法的普适性与操作边界
- location: ch32.10
  claim: 4近原则为变现产品设计底层逻辑
  reason: 素材P002提出4近原则，但未论证其覆盖全变现场景的完备性，亦未对比其他定价框架优劣
- location: ch32.11
  claim: Web3十年创造3万亿美元流动价值，对冲基金拟5年内配置7%资产
  reason: 素材P004引用该数据但未标注数据来源机构、统计口径与统计时间范围，缺乏可溯源性
- location: ch32.11
