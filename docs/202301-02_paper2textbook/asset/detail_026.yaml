learning_targets:
- 理解痛点驱动创业的第一性原理：从‘哪里疼贴哪里’到构建商业闭环
- 掌握信息差变现的核心逻辑：识别信息断层、打通渠道、收取‘降低搜索成本’的服务费
- 熟练运用‘选品决定论’评估产品：深挖需求、涵盖面齐全、品牌背书、高复购结构
- 掌握最小MVP闭环验证方法：用最小成本（如80元、2周）跑通‘产品-流量-销售-交付’全链路
- 学会判断行业周期窗口期：识别‘高流量低商业化’红利期，在平台早期完成模型跑通与放大
- 能运用‘1+1+1项目矩阵’规划业务组合：1个盈利养团队、1个开发接力、1个知识付费变现经验
- 掌握从0到1的获客与转化实操：公域矩阵引流、蹭流截流开店、私域高客单SOP转化、裂变扩张
- 建立风险控制与合规底线：外包避坑、招聘偏好、投放渠道排序、融资防骗、平台规则红线
concept_map:
- 创业起点与商业模式设计 (第1章)
- ├── 痛点是创业的第一性原理
- │   ├── 核心定义：用户急迫想解决且现有方案无法满足的具体问题
- │   ├── 关键性质：天然刚需、越垂直越易建壁垒、需经专业验证
- │   ├── 典型例子：夕子荨麻疹→科学护肤、胖龟买房痛点→0中介费、老杨TikTok赚钱难→娱乐直播
- │   └── 边界条件：需具备付费意愿/能力、警惕政策/平台规则失效、自身痛点≠大众痛点需验证规模
- ├── 信息差就是金钱
- │   ├── 核心定义：交易双方对关键信息认知不对等，变现即打通断层收取服务费
- │   ├── 关键性质：随透明度收窄需挖新断层、核心壁垒在于获取渠道与效率、买家跳单因定价过高
- │   ├── 典型例子：胖龟公开房东电话、夕子转化医美专业信息、老杨移植Twitch睡播玩法
- │   └── 边界条件：不可持久需叠加服务/产品/品牌、非法获取信息有法律风险、纯信息差天花板低
- ├── 选品决定论
- │   ├── 核心定义：寻找‘深挖需求+涵盖面全+品牌背书+高复购+可溢价’的产品组合
- │   ├── 关键性质：选品重于销售、口服/消耗型>耐用型、品牌背书可迁移(医生/博士/空壳品牌)
- │   ├── 典型例子：夕子医美面膜→口服爆款→自建品牌、胖龟卖信息→卖会员→卖自有品牌、老杨声光电道具微创新
- │   └── 边界条件：依赖平台规则动态适配、无绝对好产品只有特定人群时刻好、需持续迭代开发能力
- └── 最小MVP闭环
- '    ├── 核心定义：仅含核心价值、能跑通‘产品-流量-销售-交付’的最简版本'
- '    ├── 关键性质：速度>完美(80元/2周)、要素齐全(缺啥补啥)、止损前置(设定最大投入)'
- '    ├── 典型例子：夕子2万起步半月出单、胖龟小程序挂房源成交首单、老杨iPhone+道具峰值破万、美团80元跑通30店'
- '    └── 边界条件：MVP≠简陋(核心体验必达标)、验证指标看硬数据(首单成本/回本/复购)、重服务类需先标准化SOP'
- 行业周期与项目矩阵 (第1章延伸/第4章)
- ├── 行业周期窗口期
- │   ├── 核心定义：平台流量释放>商业化收割、规则宽松、头部未垄断、普通人可入场的黄金期
- │   ├── 关键性质：早期高流量低商业化(抖音早期/TikTok2022/视频号2023/美团电商)、窗口期有寿命(老杨预判2年)、完成比完美重要
- │   ├── 典型例子：老杨TikTok对标抖音2017、胖龟扑中存量时代二手房红利、夕子疫期小红书红利、美团电商类比淘系铺货期
- │   └── 边界条件：不可预测精确终点需敬畏市场、警惕伪窗口期平台收割、跨周期生存靠1+1+1矩阵
- └── 1+1+1项目矩阵模式
- '    ├── 核心定义：1个盈利养团队、1个开发接力、1个知识付费变现经验'
- '    ├── 关键性质：项目生命周期2-6个月必须具备开发新项目能力、可复制快速执行门槛拔高'
- '    └── 典型例子：老杨娱乐直播矩阵、夕子美业+加盟+课程、胖龟买房+租房+合伙人'
- 获客转化与私域运营 (第3章)
- ├── 公域获客矩阵
- │   ├── 内容不自嗨：定位→选题→模仿→优化→创新(学书法先临帖)
- │   ├── 全域矩阵：抖音/快手/小红书/58/转转/豆瓣/知乎多平台撒网(撒网捕鱼)
- │   ├── 蹭流截流：开在传统中介隔壁‘0中介费’截流自然客流(借东风)
- │   └── 租客全域发掘：评论区私聊、拼室友、求租广场、超话小组主动出击
- ├── 私域转化体系
- │   ├── 金饭碗思维：专业用户服务高客单技术需求，非低价值团购(端金饭碗别讨饭)
- │   ├── 咨询SOP表格：标准化回复模板提升速度/客单/成交率
- │   ├── 五位一体成交飞轮：破冰→诊断→方案→信任→成交(解决为什么买/跟你买/现在买)
- │   └── 单客价思维：关注用户生命周期总价值(LTV)而非单次客单价，拉长周期提复购
- └── 裂变与扩张
- '    ├── 合伙人/城市管家：平台给房源库/配房/流程，合伙人只维护用户(铺铁路网)'
- '    ├── 加盟赋能一条龙：脚本/SOP/课程/朋友圈/聊天SOP拿来即用(克隆直营店)'
- '    └── 人海战术：单员工底薪3000月两单覆盖成本，批量招人放大利润'
- 团队治理与风控 (第5-6章)
- ├── 股权与治理
- │   ├── 4C动态量化模型：创始人身份/岗位权重/时间投入/资金投入四维定量分股
- │   ├── 创始人身份本质：承担最大风险兜底责任=最大控制权(对外仅一把声音)
- │   ├── 时间投入看产出匹配里程碑、资金投入是信心与风险意愿信号
- │   ├── 招聘避坑：白纸可塑(应届生)>经验固化(房产销售)，旧瓶难装新酒
- │   └── 股权起点非终点：需配套一致行动权/期权池/回购权/优先清算/领售权等合同
- ├── 融资与合规风控
- │   ├── 融资防骗：有人推荐、不盲目缴费(看病找正规医院)
- │   ├── 劳动合规：合同是枪附件是子弹(岗位考核/规章/廉洁/保密)、辞退最小化损失、及时签合同建考核
- │   ├── 平台规则：敬畏风控、合规或规避获流量、内容审核应对(离线版/用户反馈/修订重传)
- │   └── 止损决策：理性评估门槛(预算/资质/工期/流量源)果断放弃而非盲目投入
- └── 认知与心态
- '    ├── 内在比赛理论：自我二(潜意识)认可目标才能赢外在比赛，盲目自信是理性选择'
- '    ├── 成功是成功之母：过去成功体验累积潜意识自信推动更大成功，唤醒成功体验法'
- '    ├── 俯视学习法：战略藐视战术重视，跪着学打不赢内在比赛'
- '    ├── 正反馈驱动热爱：懒惰本质是无正反馈，突破口找热爱或纯为钱冲'
- '    └── 战术勤奋逃避战略探索：用忙碌麻痹自己长期有毒，唯有战略突破带来真增长'
life_analogy:
- 想象创业像**开一家‘专科诊所’**：
- '- **痛点** = 病人‘哪里疼’的具体症状（荨麻疹、买房被坑、想赚钱没门路）'
- '- **信息差** = 医生‘知道病因和药方’而病人不知道的知识垄断'
- '- **选品** = 开对症的‘特效药’（深挖需求、高复购、有背书），而非卖‘维生素’'
- '- **MVP** = 先用‘土方子’治好第一个病人（挣第一块钱、跑通闭环），再建医院'
- '- **窗口期** = 流感高发季‘荒诞疗法’也能火（平台早期高流量低商业化），过季神药也卖不动'
- '- **1+1+1矩阵** = 诊所里：1个主治医师看病赚钱、1个研发新药方、1个开培训班教徒弟'
- '- **公域引流** = 在大街上发传单、蹭隔壁大医院溢出病人、在社区讲座留微信'
- '- **私域转化** = 进诊室‘破冰问诊→诊断病因→开方子→建立信任→收费开药’（五位一体成交飞轮）'
- '- **裂变扩张** = 开分院、收徒弟、授牌匾（合伙人/加盟/城市管家），标准化复制‘诊疗SOP’'
- '- **股权治理** = 合伙开医院：谁担责谁控股（创始人身份）、按出工出力出钱分红（4C模型）、立规矩防撕逼'
- '- **心态内功** = 医生必须‘盲目自信’能治好病（内在比赛赢），靠‘治好一个信一个’累积自信（成功是成功之母），站着收徒不跪着求教（俯视学习）'
summary:
- concept: 痛点/第一性原理
  desc: 创业源于对用户真实痛点的深切感知，解决真痛点生意才有刚需属性
- concept: 信息差变现
  desc: 生意本质是信息不对等，打通信息断层收取‘降低搜索成本’服务费
- concept: 选品决定论
  desc: 好产品=精准痛点方案+信任背书+高复购结构，选品重于销售、自带流量转化属性
- concept: 最小MVP闭环
  desc: 用最小成本跑通‘产品-流量-销售-交付’，速度>完美、止损前置、验证看硬指标
- concept: 行业周期窗口期
  desc: 平台早期‘高流量低商业化’是普通人最易入场红利期，完成比完美重要、预判寿命做矩阵
- concept: 1+1+1项目矩阵
  desc: 1个盈利养团队、1个开发接力、1个知识付费变现经验，应对项目2-6个月生命周期
- concept: 公域获客矩阵
  desc: 内容不自嗨(模仿优化)、多平台撒网(抖音/小红书/58等)、蹭流截流(开隔壁店)、主动出击挖租客
- concept: 私域高客单转化
  desc: 端金饭碗别讨饭：专业用户服务高客单技术需求，靠咨询SOP+五位一体成交飞轮提效
- concept: 单客价/LTV思维
  desc: 关注用户生命周期总价值而非单次客单价，通过复购拉长周期提升整体销售额
- concept: 裂变扩张体系
  desc: 城市合伙人(平台给基建合伙人维用户)+加盟赋能(脚本/SOP/课程拿来即用)+人海战术(低底薪高提成)
- concept: 4C股权模型
  desc: 创始人身份/岗位权重/时间投入/资金投入四维定量分股，创始人身份=风险承担=控制权
- concept: 招聘偏好
  desc: 白纸可塑(应届生)>经验固化(行业老手)，旧瓶难装新酒，思维转化比技能更关键
- concept: 合规风控底线
  desc: 劳动合同带附件、外包实地考察吸纳技术合伙人、投放排序抖音>本地自媒体>广播、融资防骗不盲目交费
- concept: 内在比赛/心态
  desc: 潜意识(自我二)认可目标才能赢，盲目自信是理性选择、成功累积自信、俯视学习、正反馈驱动热爱
exercises:
- 'no': 1
  title: 练习1：为你的副业想法做一次‘痛点-信息差-选品’三步验证
  contents:
  - 假设你想做一个‘考公上岸资料整理’副业：
  - 1. 痛点验证：列出目标用户（考公小白/二战裸考生）最急迫的3个具体痛点，并判断哪些是‘伪痛点’（如‘想要免费资料’非付费痛点）。
  - 2. 信息差挖掘：这些痛点背后，用户不知道而你知道的关键信息是什么？（如：哪个老师的押题卷命中率高、哪个岗位竞争比被低估、面试真题去哪找）。
  - 3. 选品决策：基于以上，设计一个‘最小可行产品’组合（如：9.9元‘避坑指南电子书’+ 99元‘高频考点押题卷’+ 299元‘面试模拟陪练营’），标注每个产品的‘深挖需求/涵盖面/品牌背书/复购/溢价’得分。
  - 回答问题：
  - '- 如果平台突然免费开放所有真题，你的信息差还在吗？如何升维？'
  - '- 为什么‘免费资料包’不能作为核心付费产品？'
- 'no': 2
  title: 练习2：设计一个‘最小MVP闭环’的7天执行计划
  contents:
  - 场景：你想验证‘帮中小企业做抖音同城获客代运营’这个模式。
  - 请按‘产品-流量-销售-交付’四环节，列出第1-7天每天的关键动作、预算上限、验证指标（如：第3天前搞定1个种子客户免费试单、第5天跑通标准化交付SOP、第7天收到首笔意向金）。
  - 标注你的‘止损点’：最多投入多少钱/天/人力，未达标准即切换或放弃。
  - 回答问题：
  - '- 为什么‘帮客户拍1条视频’不是合格的MVP交付？'
  - '- 如何用‘咨询SOP表格’思维，把非标的‘代运营’服务标准化？'
- 'no': 3
  title: 练习3：推演你所在赛道的‘窗口期-矩阵-风控’策略
  contents:
  - 以‘AI绘画小程序’或‘视频号无货源店群’或‘抖音本地生活代运营’任选一个为例：
  - 1. 窗口期判断：该赛道目前处于‘高流量低商业化’、‘成长期’、‘成熟期’还是‘衰退期’？依据是什么（平台战略/头部动作/流量单价/违规容忍度）？
  - 2. 1+1+1矩阵规划：你的‘盈利项目’是什么？‘开发中的接力项目’是什么？‘知识付费变现经验’产品是什么？
  - 3. 关键风控清单：列出该模式下的Top 3平台规则红线、Top 2合规成本、Top 1止损触发条件。
  - 回答问题：
  - '- 如果平台突然收紧规则（如抖音打击无货源、微信封小程序），你的‘开发接力项目’能否在2周内顶上？'
  - '- 为什么‘把鸡蛋放在一个平台篮子里’是违背窗口期理论的？'
- 'no': 4
  title: 练习4：模拟一次‘股权分配与合伙人招聘’决策会
  contents:
  - 场景：你和两位合伙人（一位全职运营、一位出技术兼职、一位出资20万不参与运营）准备注册公司做‘私域流量变现工具’。
  - 1. 用4C模型（创始人身份/岗位权重/时间投入/资金投入）给三人分配初始股权比例，并写出每个维度的权重设定理由。
  - 2. 列出必须配套的5项合同条款（如：一致行动权归属、期权池比例、退出回购价格公式、竞业限制、知识产权归属）。
  - 3. 招聘第1名员工（运营助理）：你会倾向于‘有2年抖音运营经验’还是‘应届生但做过学生会组织过3场百人活动’？用‘旧瓶难装新酒/白纸可塑’理论解释理由。
  - 回答问题：
  - '- 为什么‘创始人身份’必须由一个人承担，不能共享？'
  - '- 如果出资合伙人要求‘因为我出钱多，重大决策我有一票否决权’，你如何用‘创始人身份=风险兜底=控制权’理论沟通？'
units:
- 'no': 1
  name: 痛点是创业的第一性原理 —— 哪里疼就贴哪里
  points:
  - '**为什么需要这个概念？**'
  - '- 创业不是凭空发明，而是源于对用户真实痛点的深切感知'
  - '- 只有解决真痛点，生意才有刚需属性，不靠“忽悠”也能成交'
  - '- 避免陷入“伪需求”陷阱，做出来没人用的产品'
  - '**核心定义**'
  - '- 痛点：用户急迫想解决、且现有方案无法满足的具体问题'
  - '- 创业切入点：从自身或他人的真实痛点出发，构建商业闭环'
  - '**关键性质**'
  - '- 痛点驱动的生天然具备“刚需”属性，客单价与复购率更高'
  - '- 痛点越具体、越垂直，越容易建立专业壁垒（如夕子从荨麻疹切入科学护肤）'
  - '- 痛点需经得起“找专业人士解决”的验证，伪痛点经不起专业推敲'
  - '**典型例子**'
  - '- 夕子因自身荨麻疹、敏感肌痛点，辞职三甲医院做线上美业，年利润过百万'
  - '- 胖龟找房创始人因买房遭遇“虚假低价、阴阳合同、高额代办费”痛点，创立0中介费平台'
