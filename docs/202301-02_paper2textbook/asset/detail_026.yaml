life_analogy:
- 想象创业像**看病就医**：
- '- **痛点** = 你身体真实的疼痛部位（荨麻疹、失眠、被中介费坑）'
- '- **信息差** = 你只知道挂号排队，但名医知道哪个窗口最快'
- '- **选品** = 医生开的药——好药对症自然见效，烂药再好的诊所也白搭'
- '- **MVP闭环** = 先开一剂小药方试三天，有效再开大疗程，而不是直接住院手术'
- 就像医生必须先问“哪里疼”再开药，创业也必须先找准用户最痛的那一点，才能对症下药。
- ''
- 想象商业模式的付费设计像**钓鱼**：
- '- **付费方** = 鱼塘里最饿的那条鱼（二房东空置一天亏一天房租）'
- '- **全域获客** = 在多个鱼塘同时撒网（抖音、小红书、58），而不是守着一个池塘等鱼上钩'
- '- **私域运营** = 钓上来好鱼养在自家鱼缸里，喂精饲料，而不是炖了吃一顿就没了'
- '- **标准化复制** = 把养鱼秘诀写成手册，教多个渔场同时养，而不是自己一个人守着唯一鱼塘'
summary:
- concept: 痛点
  desc: 创业的第一性原理：用户真实愿意花钱解决的强烈困扰，是商业逻辑成立的原始起点
- concept: 信息差
  desc: 一方掌握而另一方不掌握的关键信息，凭借这种不对等可合法获取利益，但窗口期有限
- concept: 选品决定论
  desc: 产品好省一半心：需求覆盖、产品粘性、品牌背书构成好产品的三个维度
- concept: 最小MVP闭环
  desc: 用最低成本跑通产品-流量-销售-交付全链路，验证模型成立后再复制放大
- concept: 付费方即盈利支点
  desc: 找到“谁痛谁掏钱”的付费主体（如二房东），商业模式自然成立
- concept: 全域获客
  desc: 同时布局多个公域平台，按平台特性定制内容与钩子，主动出击发掘目标客户
- concept: 私域金饭碗
  desc: 专业用户是高价值资产，应匹配高客单技术型服务，而非低价值团购消耗信任
- concept: 标准化复制
  desc: 将跑通的单店模型SOP化并赋能合伙人，是规模化扩张的前提，单店盈利前置是必要条件
- concept: 避坑止损
  desc: 通过前人经验识别外包选型、招聘固化、投放无效等典型陷阱，设好成本上限及时退出
exercises:
- 'no': 1
  title: 痛点识别工作坊：给三个案例各找一个创业切口
  contents:
  - 结合本章三个素材案例，完成以下分析：
  - 1. 从你自身或身边人的经历中，找出3个高频、广泛、可持续的真实痛点，并用一句话描述目标人群
  - 2. 对每个痛点，评估其付费意愿强度（1-10分）与可外延性（能否推及同类人群）
  - 3. 选其中一个痛点，模仿夕子（荨麻疹→线上美业）的逻辑，设计一个最小MVP闭环：
  - '   - 最小可行产品是什么？'
  - '   - 初始流量从哪来？'
  - '   - 怎么定价和完成第一单销售？'
  - '   - 交付物是什么？'
  - 回答问题：
  - '- 如何判断一个痛点是真痛点还是伪痛点？'
  - '- 为什么“高频、广泛、可持续”三个特征缺一不可？'
- 'no': 2
  title: 信息差地图：找出你所在行业的三层信息差
  contents:
  - 信息差是商业机会的源泉。请针对你所在或熟悉的行业，绘制一张“信息差地图”：
  - 1. 列出行业的5个主要参与者（如：生产者、渠道商、消费者、监管方、服务方）
  - 2. 在每对参与者之间，标出信息不对称的具体内容（如：生产者知道成本底价，消费者不知道）
  - 3. 判断每类信息差是否合法、可定价、可抹平（窗口期多长？）
  - 4. 模仿胖龟找房“取消中介费”的逻辑，设计一个消除某类信息差的商业模式：
  - '   - 谁最痛？谁愿意付费？'
  - '   - 如果由最痛的一方付费，商业模式如何闭环？'
  - 回答问题：
  - '- 信息差被抹平之后，你的壁垒在哪里？'
  - '- 如何在窗口期内完成收割或建立新壁垒？'
- 'no': 3
  title: 六维模型实战：给三个项目算一笔“复制账”
  contents:
  - 用本章学习的六维评估模型（流量效率、销转效率、交付效率、客单价、毛利率、复购率），评估以下3个项目的可复制性与收入天花板：
  - 项目A：夕子的线上美业（皮肤诊断+医美产品+加盟）
  - 项目B：胖龟找房1.0（0中介费个人房屋分享平台）
  - 项目C：TikTok睡播（娱乐直播打赏）
  - 对每个项目：
  - 1. 逐项打分（1-10分）并说明理由
  - 2. 判断该项目属于“效率维度”驱动还是“财务维度”驱动
  - 3. 模拟计算：如果复制到10个城市/10个账号，收入是否线性增长？瓶颈在哪？
  - 回答问题：
  - '- 为什么小说推文天花板低而教育资料能到百万？'
  - '- 客单价提升如何改变项目量级？'
- 'no': 4
  title: 付费方设计练习：重构一个“用户不掏钱”的生意
  contents:
  - 假设你经营一个面向C端消费者的本地生活平台，但用户拒绝为服务付费。
  - 1. 列出可能的潜在付费方：广告主、商家、供应商、数据需求方、政府…
  - 2. 对每个候选付费方，分析其痛点强度：
  - '   - 他们面临什么损失？'
  - '   - 愿意为消除损失支付多少？'
  - '   - 支付是否可持续？'
  - 3. 模仿胖龟找房“二房东付费”的逻辑，设计一个新盈利模型：
  - '   - 选择最合适的付费方'
  - '   - 明确你为其创造的独特价值'
  - '   - 画出新的商业闭环'
  - 回答问题：
  - '- 如何验证付费方的痛点真实存在而非臆想？'
  - '- 如果付费方痛点随时间消解，如何调整？'
- 'no': 5
  title: 标准化复制方案：把一门手艺做成SOP
  contents:
  - 选一个你熟练掌握但依赖个人能力的技能（如：写文案、剪视频、做咨询），设计一套可复制的SOP体系：
  - 1. 拆解该技能的5-8个关键步骤
  - 2. 为每个步骤设计标准化的模板或工具（如：脚本模板、检查清单）
  - 3. 设计一套赋能方案：
  - '   - 如何让新人“拿来即用”？（参考夕子给加盟商现成脚本）'
  - '   - 如何保证质量下限？（参考胖龟的配房-带看SOP）'
  - '   - 如何评估单店/单人盈利能力？（参考单店模型健康标准）'
  - 回答问题：
  - '- 过度标准化会失去什么？如何保留灵活性？'
  - '- 如果复制10份，哪些环节会最先崩坏？如何预防？'
units:
- 'no': 1
  name: 痛点即创业起点 —— 从“哪里疼”到“贴哪里”
  points:
  - '**为什么需要这个概念？**'
  - '- 创业的第一问题不是“我有什么”，而是“用户哪里疼”'
  - '- 多数人从自身优势出发，结果做出无人需要的产品'
  - '- 真实痛点自带付费意愿，是商业逻辑成立的原始起点'
  - '- 夕子的荨麻疹、胖龟的高中介费、老杨的睡不着，都是同一个起点'
  - '**核心定义**'
  - '- 痛点是用户真实存在、愿意花钱解决的强烈困扰，商业项目的切入点应锚定在最痛的那一点上'
  - '**关键性质**'
  - '- 真实性：来自本人或身边人的亲身经历，而非臆想'
  - '- 付费意愿：痛点越深，用户越愿意掏钱'
  - '- 可外延：从自身痛点可推及同类人群的共性需求'
  - '**典型例子**'
  - '- 夕子因荨麻疹、敏感肌就医，从三甲皮肤科辞职创业做线上美业；胖龟发现买房者跳单省中介费的现象创办0中介费平台；老杨捕捉到现代人失眠压力大而开发TikTok睡播'
  - '**边界条件**'
  - '- 自身痛点需同时具备高频、广泛、可持续三个特征，否则是伪痛点；痛点必须能翻译成可付费的服务或产品，否则停留在抱怨层面'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: improve
  excerpts:
  - 想着离职后先要搞定社保问题，找了代办公司注册公司，方便自己交社保，这公司不知不觉也有4个年头了。
  - 专业——流量——成交——深挖需求——复购，不断做好这个闭环。
  - 我们不收中介费，是因为中介费本身就是个伪概念！为什么说是伪概念，因为是智商税，中介费为什么要收？就是因为买房及租房者不知道售房及出租转让业主的联系电话！
  - 回想一下买房的用户为什么要私下找我成交？我在开发新店的时候为什么愿意跑中介的单子？其实就是想省掉高额的中介费，中介提供的价值不值得收取这么高的费用。
  - 一句话：恶搞之让你睡不着
  - 对于大部分想要在tiktok上赚到钱的小伙伴，娱乐直播是最简单也是最容易拿到结果的方向。
- 'no': 2
  name: 信息差即商业机会 —— 你凭“知道别人不知道的”赚钱
  points:
  - '**为什么需要这个概念？**'
  - '- 痛点存在但用户不知道如何解决，就形成了信息差'
  - '- 中介费、搬运费、代办的实质都是信息差的定价'
  - '- 互联网放大了信息差——A平台烂内容正是B平台的爆款'
  - '- 看懂信息差才能看懂“为什么别人能赚钱而我不能”'
  - '**核心定义**'
  - '- 信息差指一方掌握而另一方不掌握的关键信息（如房东电话、低价货源、平台红利），凭借这种不对等可以合法获取利益'
  - '**关键性质**'
  - '- 不对称：买卖双方掌握的信息不对等'
  - '- 可定价：用户愿为省时、省力的关键信息付费'
  - '- 可抹平：平台或竞品一旦跟进，信息差就消失'
  - '**典型例子**'
  - '- 胖龟找房把“房东联系电话”这一信息透明化后取消中介费；生财有术里“把抖音做烂的内容搬到小红书就爆”；闲鱼“低买高卖”的倒爷套利本质都是靠信息差赚钱'
  - '**边界条件**'
  - '- 信息差必须合法合规，不能涉及隐私窃取或欺诈；信息差的窗口期通常有限，需在被人抹平前完成收割或建立新壁垒'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: improve
  excerpts:
  - 生意的本质就是信息差，在互联网里也存在大量的信息差生意。以这个信息差为市场的切入点我们创办了胖龟找房的 1.0——没有中介费的个人房屋分享平台。
  - 如果买房者或者租房者知道房东电话！那么他们还会给中介公司掏中介费吗？nonononon，绝对不会！这叫什么？是不是信息不对等差造成的信息差？
  - 回观抖音的发展路径，第一阶段就是高流量低商业化阶段，这时候要做的并不一定要跟平台的指向，而是要看清平台的现状。
- 'no': 3
  name: 选品定生死 —— 好产品自带流量和转化力
  points:
  - '**为什么需要这个概念？**'
  - '- 产品不好，再强的运营也是徒劳'
  - '- 好产品自带转化力和复购力，能省掉一半销售精力'
  - '- 很多创业者重营销轻选品，导致后端交付无力、口碑崩塌'
  - '- 选品本质是解决“卖什么才能持续赚钱”的问题'
  - '**核心定义**'
  - '- 选品决定论是强调产品本身的质量、需求匹配度和复购潜力优先于销售技巧的商业方法论，即“产品好省一半心”'
  - '**关键性质**'
  - '- 需求覆盖：好产品应深挖用户需求并涵盖面齐全（祛痘+美白+抗衰）'
  - '- 粘性：口服类等产品一旦被接受，用户不轻易换品牌'
  - '- 背书：与医院合作能强化品牌专业可信度'
  - '**典型例子**'
  - '- 夕子选品三要素——涵盖面齐全的口服趋势产品+医院背书；TikTok睡播的“独木舟”式的简单直播间也能破万在线'
  - '**边界条件**'
  - '- 选品决定性不能替代运营——在竞争充分领域仍需流量打法配合；小众高客单产品虽好但市场规模有限'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  excerpts:
  - 所以选品很关键，产品好省了一半的心，后续回购率也高。
  - 果断花了1万6入了一批货，这个级别属于合伙人级别，折扣比较低，有利润空间。
  - 1.深挖用户需求，最好涵盖面齐全：比如说不仅祛痘、还有美白、抗衰等等
  - 2.口服保养是趋势，一个人一单接受了某个品牌的口服，不会轻易更换牌子的
  - 3.尽量能跟医院合作的产品，品牌背书这块强
- 'no': 4
  name: 最小MVP闭环 —— 先造独木舟，再想航母
  points:
  - '**为什么需要这个概念？**'
  - '- 创业最大的风险是投入巨大成本后发现需求不存在'
  - '- 很多人一开始就想建大平台、雇大团队，结果死在半路上'
  - '- MVP能帮助创业者用最小成本验证“产品—流量—销售—交付”是否成立'
  - '- 从挣1块钱开始，跑通单点再复制放大'
  - '**核心定义**'
  - '- 最小可行产品（MVP）闭环是通过最低成本、最快速度跑通“产品-流量-销售-交付”整个商业链路，验证模型成立后再复制放大的方法'
  - '**关键性质**'
  - '- 最小化：只做能验证闭环的最少工作量'
  - '- 可复制：验证的是模式，不是一次性买卖'
  - '- 低成本：投入控制在可承受范围内，避免一次性重投入'
  - '**典型例子**'
  - '- 夕子从代购医美面膜一单赚2元起步，跑通闭环后才逐步放大到年利润过百万；老杨开发睡播先做简陋直播间测试流量，数据亮眼后才配置软硬件系统；胖龟先跑通洛阳本地8家门店才扩张到杭州上海'
  - '**边界条件**'
  - '- MVP验证的是“有人买”而非“能赚大钱”，需警惕幸存者偏差；跑通闭环之后的放大路径必须提前设计，否则会陷入项目天花板'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: improve
  excerpts:
  - 1.做生意从自己身边资源入手，从挣1块钱开始，选一个天花板比较高的，持续3——5年。
  - 2.跑通自己的生意环节，最小mvp（产品——流量—销售—交付）
  - 5.3 测试。快速测试，快速看到结果，产品方法论MVP真是让各行各业都能大放异彩啊。
  - 刚开始的直播间就这么简陋，然而并不耽误在线峰值飙到上万。（这个直播间和账号可能有一些做娱播的朋友早期看过，就是被泄露的那个直播间。）
- 'no': 5
  name: 付费方即盈利支点 —— 找到“谁痛谁掏钱”
  points:
  - '**为什么需要这个概念？**'
  - '- 商业模式不成立的常见原因是没有找对付费方'
  - '- 用户痛但不掏钱，说明付费方错位'
  - '- 有时付费方不是最终使用者，而是“中间人”'
  - '- 找到“谁痛谁付费”的支点，商业模式自然成立'
  - '**核心定义**'
  - '- 盈利支点指在商业模式设计中选择适当的付费主体，通常由最痛的一方承担费用（如二房东因空置亏损而愿付中介费），从而支撑整体商业闭环'
  - '**关键性质**'
  - '- 痛点强度：付费方必须痛点足够深（如空置一天亏一天房租）'
  - '- 价值对价：付费方获得的利益需明确大于所付费用'
  - '- 稳定可续：付费方有持续支付能力而非一次性冲动'
  - '**典型例子**'
  - '- 胖龟找房的0中介费租房不向租客收费，转向二房东收费——因二房东空置即亏损，有强烈动力付钱快速出房'
  - '**边界条件**'
  - '- 需警惕“两头通吃”导致用户反感；付费方的痛点可能随市场变化而消解（如空置率下降），商业模式需具备动态调整能力'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 我们推演了很多，也会见了很多房东，最后我们找准了二房东这个渠道。因为二房东手上不单单就一间房子，他需要快速的让自己的房子租出去不能有空置，因为每空置一天，房租的费用就需要自行来承担。
  - 有需求的地方就有市场，中介平台公司在房产市场蓬勃发展的10年获得了大量的财富，也产生了大量的问题。
- 'no': 6
  name: 全域获客 —— 把“鱼塘”撒满全网
  points:
  - '**为什么需要这个概念？**'
  - '- 单一渠道的流量不稳定，平台算法一变生意就断'
  - '- 不同平台的用户画像差异大，多渠道覆盖才能提高触达概率'
  - '- “等客上门”时代的结束，必须主动出击、全域布网'
  - '**核心定义**'
  - '- 全域获客指同时布局多个公域平台（抖音、快手、小红书、58、转转、豆瓣等），根据不同平台特性定制内容与钩子，系统化地发掘和引流目标客户'
  - '**关键性质**'
  - '- 平台适配：每个平台有各自的用户习惯和内容偏好'
  - '- 主动出击：私信、评论区互动、发帖等主动动作比坐等有效'
  - '- 矩阵协同：多平台同步发布、相互导流提升覆盖'
  - '**典型例子**'
  - '- 胖龟找房在抖音、快手、小红书、58、安居客、转转、豆瓣、微博、知乎等平台发帖、私聊、评论区互动，全方位发掘租客；夕子用小红书爆款视频+知乎引流双线获客'
  - '**边界条件**'
  - '- 全域不等于平均用力，需根据投产比动态调整渠道优先级；小团队需警惕渠道过多导致精力分散'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: improve
  excerpts:
  - 打开抖音，搜索 上海租房，找热点回复量最高的几个，点开评论区，找回复 博主：这个多少钱，这个还在吗，徐汇区某某还有房子吗，等等一系列的有租房欲望的人，那就给人私聊，破冰建立联系取得租房需求。
  - 转转，咸鱼，这些APP比较有意思，在主菜单上直接就有租房的模块，点开租房，找到求租广场...
  - 豆瓣，微博，知乎，这一类的APP，比如微博，有各地的租房超话，#杭州租房超话#上海租房超话，进入讨论组内，进行发帖，回复...
  - 做内容有个很重要的点，一定不要自嗨。先从模仿开始。做好定位，之后模仿，再优化。
- 'no': 7
  name: 私域金饭碗 —— 专业用户就该卖高客单
  points:
  - '**为什么需要这个概念？**'
  - '- 很多私域运营者把优质专业用户当泛粉消耗，做低价团购'
  - '- 私域的核心价值在于信任，信任能支撑高客单价'
  - '- 用低价值方式消耗信任，是对私域资产的最大浪费'
  - '**核心定义**'
  - '- 私域金饭碗指将私域中具有专业需求的用户视为高价值资产，用专业技术服务匹配高客单产品，避免做低价值团购“讨饭”式运营'
  - '**关键性质**'
  - '- 专业匹配：用户因专业而来，应服务专业需求'
  - '- 高客单：技术型服务应收取高客单价格'
  - '- 持续复购：信任建立后复购率自然提升'
  - '**典型例子**'
  - '- 夕子的私域用户通过专业诊断+医美产品成交，复购率高；一个私域老师仅用3000粉变现300万的案例说明“后端产品决定私域价值”'
  - '**边界条件**'
  - '- 以专业技术建信任需真才实学支撑，否则高客单不可持续；私域运营的人力和时间成本高，需有SOP提效'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  excerpts:
  - 私域老师有句话点醒了我：“端着金饭碗在讨饭。”当时我兼着一个社群团购业务，就是吃喝拉撒的这些，我私域的用户更多奔着我专业，看皮肤来的，我居然做这种事情，真的在讨饭。
  - 私域的用户需要花费时间和精力去交流，这种需要技术的事情，就应该收高客单。
  - 一个私域老师3000粉变现300万，这个跟她后端变现产品有很大的关系。
- 'no': 8
  name: 标准化复制 —— 把“跑通的店”克隆30遍
  points:
  - '**为什么需要这个概念？**'
  - '- 单点盈利只是开始，真正的商业价值在于规模化复制'
  - '- 没有标准化流程就无法复制，只能永远做小店'
  - '- 从1到N的关键是把“人-货-场”变成可复制的SOP'
  - '**核心定义**'
  - '- 标准化复制是将已验证跑通的单店/单项目模型，通过制定标准作业流程（SOP）、模板化工具和赋能体系，批量复制到更多门店或合伙人的过程'
  - '**关键性质**'
  - '- SOP化：流程模板化、标准化，减少对人能力的依赖'
  - '- 赋能输出：将技术、话术、剪辑等打包为现成内容赋能合伙人'
  - '- 单店盈利前置：只有单店模型健康才可复制扩张'
  - '**典型例子**'
  - '- 夕子将脚本（改人设即发）、拍摄剪辑SOP、看脸课程、聊天SOP打包赋能加盟商；胖龟用小程序锁码+配房流程+带看SOP让城市合伙人快速上手；TikTok睡播通过程序自动控制设备实现一人多号'
  - '**边界条件**'
  - '- 过度标准化可能失去灵活性，需保留一定个性化空间；复制扩张前必须跑通单店盈利，否则放大的是亏损'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: improve
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: improve
  excerpts:
  - 所以我现在给到合作伙伴，直接是现成的脚本（在标红的地方改为自己的人设信息即可），给到录制视频的sop，以及提供3条视频的剪辑。你拿来就可以直接发布，相当于公域账号直接有了。
  - 3.问题性肌肤专业看脸端：价值6980的课程赠送，有小群服务，不会看的皮肤发群里，品牌方会告知你是什么，怎么搭配，相当于喂饭教程。
  - 4.私域端：基础的朋友圈搭建，聊天sop都会给到，也会辅助群发售。
  - 我们将所有的流程模板化，标准化，我们通过区域合伙人计划——城市管家，快速让合伙人上手。
  - 正常来说，为节省人工，我们采用的都是程序控制所有设备，某些不能控制的设备，可以由主播自行完成，或者由一名主播或运营在镜头后人工控制。
- 'no': 9
  name: 避坑止损 —— 看穿外包、错招和项目泡沫
  points:
  - '**为什么需要这个概念？**'
  - '- 创业成功的路不可复制，但失败的路可以提前避开'
  - '- 很多错误源于信息不对称和认知不足，而非能力问题'
  - '- 一次失败的试错成本可能吃掉几轮盈利'
  - '**核心定义**'
  - '- 避坑止损基于对创业中典型陷阱（外包选错、招聘固化、渠道无效、平台周期等）的事先知悉与判断，避免投入方向性错误'
  - '**关键性质**'
  - '- 先验性：通过前人经验提前识别风险'
  - '- 成本意识：对试错成本有明确的预估和上限'
  - '- 灵活性：不恋战，方向错误及时止损'
  - '**典型例子**'
  - '- 胖龟找房踩坑：外包团队未深入考察导致返工、招有固化思维的房产销售导致转化低迷、投2w汽车广播水花都看不到——经验教训是实地考察、招可塑新人、投本地抖音'
  - '**边界条件**'
  - '- 过度避坑可能导致行动迟缓、错失窗口期；风险信息需结合自身环境判断，不能全盘照搬'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 在本地选择的时候，一定要深入公司内部去考察，看看外包团队的人员构成，人员数量，还有他们实施过的案例... 所以在做互联网项目创业的时候，最好的方式吸纳一位优秀的技术开发人员最好。
  - 一开始我们在线下招聘的时候偏向于找寻一些从事过相关房产行业的销售人员...这波人有个严重的问题，固化思维太重，难以改变思维，销售的重点只是推荐房子，而非会员的转化。后来我们把招聘重点放到了刚毕业的大学生身上...
  - 以此 抖音推广>本地自媒体>汽车广播...汽车广播这个板块不建议大家做，薅羊毛的客户比较多~...投抖音的时候如果你是做本地项目，一定要投本地一定要投本地...
'no': 26
