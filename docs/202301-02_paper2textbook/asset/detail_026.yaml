- │   ├── 真实性（自身体验）        —— E1WG, PglA, FCii
- │   ├── 付费意愿（痛点深度）       —— E1WG, PglA
- │   └── 可外延（同类人群）         —— E1WG, PglA
- ├── 信息差洞察
- │   ├── 不对称性（中介费伪概念）   —— PglA
- │   ├── 可定价（省时省力付费）     —— PglA
- │   └── 可抹平（窗口期有限）       —— PglA
- ├── 选品决定论
- │   ├── 需求覆盖（涵盖面齐全）     —— E1WG
- │   ├── 产品粘性（口服不换牌）     —— E1WG
- │   └── 品牌背书（医院合作）       —— E1WG
- └── 最小MVP闭环
