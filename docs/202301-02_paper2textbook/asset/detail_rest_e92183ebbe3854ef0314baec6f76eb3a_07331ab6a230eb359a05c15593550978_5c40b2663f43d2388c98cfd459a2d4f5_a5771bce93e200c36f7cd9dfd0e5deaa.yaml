learning_targets:
- 理解内在比赛理论：自我一与自我二的博弈如何决定外在成败
- 掌握盲目自信、唤醒成功体验、俯视学习法三大打赢内在比赛的实操工具
- 掌握确定性窗口期的类比推演判断方法，学会在宏观周期中识别“春天”并集中火力
- 理解增长瓶颈怪圈的成因，学会从“追求增长”视角切换到“价值创造”视角的三种勇气
- 掌握强加成本战略的核心逻辑：用自身优势迫使对手承受高成本
- 识别信息差生意的本质，学会从身边被忽视的细节中挖掘高确定性的微生意机会
- 建立“优雅亏大钱”反向风控思维，通过规避三大致死步骤建立敬畏市场的止损肌肉记忆
- 理解正反馈驱动热爱的机制，掌握“找热爱”或“为钱冲”两条摆脱懒惰内耗的突破路径
- 掌握利他即利己的分享复利逻辑，学会在开放生态中通过高质量输出吸引资源回流
- 掌握卓越策略师五大能力模型与道术器用四层框架，完成从执行者到架构师的认知跃迁
