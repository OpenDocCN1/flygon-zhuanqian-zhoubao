desc: 该素材是夕子（93年女性创业者）分享的线上美业创业复盘：以皮肤病（荨麻疹、敏感肌）亲身经历为起点，从三甲医院皮肤科辞职，历经代购医美面膜一单挣2元、知乎引流、淘宝店铺被封等挫折，通过付费学习（小红书内容营销、私域运营）逐步将月利润从1-2万提升至10万+、年利润过百万，并最终自建品牌、开放加盟。素材核心强调：选品重于销售、内容不要自嗨、后端产品深挖用户需求、私域高客单、复制对标者再创新，以及“最小MVP”跑通‘产品—流量—销售—交付’闭环等商业方法论。
concepts:
- name: 科学护肤金字塔
  desc: 皮肤问题最快捷的方式是找专业人士解决；皮肤无问题时做好温和清洁+适度保湿+加强抗氧化+随时防晒即可完成80%的健康皮肤管理。
  is_original: false
  excerpt:
  - 皮肤有问题最快捷的方式就是找专业人士解决。皮肤没啥问题，做好温和清洁+适度保湿+加强抗氧化+随时防晒，健康靓丽皮肤就完成80%。
- name: 最小MVP闭环
  desc: 跑通自己的生意环节：产品——流量—销售—交付，先以最小可行产品验证商业模型，再复制放大。
  is_original: false
  excerpt:
  - 1.做生意从自己身边资源入手，从挣1块钱开始，选一个天花板比较高的，持续3——5年。
  - 2.跑通自己的生意环节，最小mvp（产品——流量—销售—交付）
- name: 美业选品三要素
  desc: 线上美业选品需满足：深挖用户需求且涵盖面齐全（祛痘、美白、抗衰等）、口服保养是趋势（客户粘性强）、尽量与医院合作以强化品牌背书。
  is_original: false
  excerpt:
  - 1.深挖用户需求，最好涵盖面齐全：比如说不仅祛痘、还有美白、抗衰等等
  - 2.口服保养是趋势，一个人一单接受了某个品牌的口服，不会轻易更换牌子的
  - 3.尽量能跟医院合作的产品，品牌背书这块强
- name: 私域高客单（金饭碗）
  desc: 私域用户因专业而来，应服务高客单、技术型需求，而非做低价值的社群团购；我从私域老师处学到“端着金饭碗在讨饭”的教训。
  is_original: false
  excerpt:
  - 私域老师有句话点醒了我：“端着金饭碗在讨饭。”当时我兼着一个社群团购业务，就是吃喝拉撒的这些，我私域的用户更多奔着我专业，看皮肤来的，我居然做这种事情，真的在讨饭。
  - 私域的用户需要花费时间和精力去交流，这种需要技术的事情，就应该收高客单。
methods:
- name: __overview__
  desc: 从自身痛点出发创业，以最小成本（2万）起步，通过公域引流（知乎、小红书）+私域转化（微信诊断、医美选品）+后端产品深挖（口服、多功效）形成闭环，并不断付费学习、复制对标再创新。
  excerpt:
  - 想着离职后先要搞定社保问题，找了代办公司注册公司，方便自己交社保，这公司不知不觉也有4个年头了。
  - 疫情影响，加上资本不多，我也不敢开实体店，从有结果的出发，做线上美业，简单来说，就是你有皮肤问题，微信上找到我，我给你诊断，搭配医用产品，你给我钱，就这么简单。
  - 专业——流量——成交——深挖需求——复购，不断做好这个闭环。
- name: 小红书内容SOP（自媒体起号）
  desc: 做内容的系统化流程：先做定位（科学护肤），每天收集1-3个爆款选题入库，统一写3-5个脚本并录制3-5个视频，定期发布。强调“不要自嗨，先从模仿开始”。
  excerpt:
  - 1.定位 （科学护肤）
  - 2.选题（每天收集1-3个爆款分析）现在有个素材库
  - 3.统一写3-5个脚本，统一录制⏺视频3-5个
  - 4.定期发布
  - 做内容有个很重要的点，一定不要自嗨。先从模仿开始。做好定位，之后模仿，再优化。
- name: 咨询SOP表格（私域转化）
  desc: 梳理现有咨询中的标准作业流程，固定回复模板并不断完善，加快回复速度、提升客单价和成交率。
  excerpt:
  - 梳理了现有咨询中的sop表格，目前也不断在完善，有了这个表格，我回复客户信息也比较快。当然目前这一套我都复制给了我的联创合伙人，她们的客单价、成交率、利润率都上来了。
- name: 加盟商赋能一条龙
  desc: 为合伙人提供现成脚本（改人设即可发布）、拍摄剪辑SOP（含3条视频剪辑）、问题性肌肤专业看脸课程（6980元赠品+小群喂饭教程）、私域朋友圈搭建和聊天SOP，实现“脚本、案例共享”的重复-复制-重复模式。
  excerpt:
  - 所以我现在给到合作伙伴，直接是现成的脚本（在标红的地方改为自己的人设信息即可），给到录制视频的sop，以及提供3条视频的剪辑。你拿来就可以直接发布，相当于公域账号直接有了。
  - 3.问题性肌肤专业看脸端：价值6980的课程赠送，有小群服务，不会看的皮肤发群里，品牌方会告知你是什么，怎么搭配，相当于喂饭教程。
  - 4.私域端：基础的朋友圈搭建，聊天sop都会给到，也会辅助群发售。
theorems:
- name: 产品好省一半心（选品决定论）
  desc: 好产品自带转化力，能省掉一半销售精力，后续回购率也高。
  excerpt:
  - 所以选品很关键，产品好省了一半的心，后续回购率也高。
  - 果断花了1万6入了一批货，这个级别属于合伙人级别，折扣比较低，有利润空间。
- name: 变现渠道不能单一（基本盘论）
  desc: 美妆护肤博主不能完全依赖接广告度日，广告渠道下滑会导致被迫停更，必须有一个基本盘（淘宝店、实体店或项目）。
  excerpt:
  - 这里也提醒各位美妆护肤博主，变现渠道不要太单一了，不能完全依赖于接广告。得有个基本盘，比如有家淘宝店铺，有家实体店，或者有项项目。
  - 因为原来依赖的单一广告收入渠道下滑，甚至没了，不得不停更。为爱发电的少，人人都要吃饭，长期也亏不起。
- name: 向有结果的人学习，复制再创新
  desc: 赚钱要借鉴成功者的打法，付费学习（生财星球、玩赚星球、私域老师）并复制其策略（高客单、剧本人设），而非闭门造车。
  excerpt:
  - 4.赚钱，向有结果的人学习，复制再创新
  - 不断付费学习,付费最有价值的两个星球，一个是生财星球，一个是玩赚星球。
  - 除了付费星球，还付费了私域老师。
- name: 换词换认知（代理→会员）
  desc: 将“代理”改称“会员”，规避顾客心理抵触，在自己和顾客都能接受的语境下发展团队。
  excerpt:
  - 后面打破心魔的是因为我说服自己，不把代理常挂嘴边，代理就是会员，会员就是代理。哈，换个词，顾客听着也舒服，我也舒服。
findings:
- name: Finding1：从2万成本到月入5万的小红书实证
  desc: '[evidence] 素材自述：封在老家半个月后，付费学习了老师的录播课，录制实操刷酸视频走红，小红书从千粉到万粉，咨询增多，实现了从月利润1-2万到5万的跃升。'
  excerpt:
  - 2020年初疫情爆发，封在老家半个月，焦虑+皮肤变差，迫不及待想回广州重整旗鼓。
  - 知乎无意刷到了一个老师的视频……加上联系方式，直接转钱。
  - 我仔细地上了这个老师的录播课，在家录了个实操刷酸的视频，火了，意料之中，也是意料之外。
  - 小红书从千粉直接到万粉，咨询也是越来越多。
- name: Finding2：私域3000粉变现300万的佐证
  desc: '[claim] 素材引述：一个私域老师仅用3000粉变现300万，关键在于后端变现产品；私域的成交率、利润率由此显著提升。'
  excerpt:
  - 一个私域老师3000粉变现300万，这个跟她后端变现产品有很大的关系。
  - 跟私域老师语音沟通了一个半小时，我列举现状，指出目标，一起想突破点。核心点就是深挖用户需求……提高顾客信任度。
- name: Finding3：2024年美妆博主广告停更现象
  desc: '[evidence] 素材观察：2024年品牌投放越来越少，且转向直播间求产出，导致大量单纯依赖广告的护肤、美妆博主停更；作者自身2024年一年未接广告，靠自身业务即可覆盖。'
  excerpt:
  - 2024年一年都没有广告，不是没有广告找，是不感兴趣。自身业务就够吃了，当然有个现状是品牌投广告的越来越少，很多是直接投到直播间了，要产出。
  - 所以你会看到很多护肤博主，美妆博主停更了。因为原来依赖的单一广告收入渠道下滑，甚至没了，不得不停更。
- name: Finding4：加盟模式的四个差异化优势
  desc: '[claim] 素材宣称：其加盟模式对比市面有四优势——产品端（985生物医学博士+医生创立）、流量端（直接给脚本剪辑）、问题性肌肤看脸端（6980课程喂饭教程）、私域端（朋友圈/聊天SOP），并有孕妈店主一周内卖出自有品牌家居水光的案例。'
  excerpt:
  - 1.产品端：医生、985生物医学博士创立的品牌，更具有专业性以及说服力。
  - 2.流量端：直接给加盟商脚本，教拍摄，剪辑3条视频，你一键发布就好啦！
  - 3.问题性肌肤专业看脸端：价值6980的课程赠送……相当于喂饭教程。
  - 4.私域端：基础的朋友圈搭建，聊天sop都会给到，也会辅助群发售。
  - 有个孕妈店主，加入联创不到一个礼拜就成功卖出去家居水光了。
- name: Finding5：实体皮肤管理店回本时间
  desc: '[evidence] 素材自述：2024年9月独资开第一家皮肤管理店，投入不足10万（排除产品研发），3个月内回本；2025年3月开第二家，第二个月扣除房租和员工工资后小盈利。'
  excerpt:
  - 去年9月份独资开了第一家皮肤管理店，3个月不到就回本了，投入资金不到10万（抛开产品研发成本），今年3月份第二家店投入运营，第二个月扣除房租 员工工资小盈利。
