learning_targets:
- 理解公众号搜索流量追热点的底层逻辑与操作流程
- 掌握批量做号矩阵策略以对抗收录不确定性
- 掌握爆款文章撰写法（迎合算法、字数控制、关键词植入、伪原创）
- 掌握爆款标题双法（关键词组合原创与爆款标题伪原创）
- 掌握流量承接双模块设置（半匹配关键词回复+兜底收到消息回复）
- 理解手动文中广告位设计利用峰终定律与平台误导性拉高流量主单价
- 理解自动回复CTA是订阅号CPS/CPA变现的唯一合规落脚点
- 理解泛粉与洗粉概念及热点流量的二次变现路径
- 理解IP地基五维框架（1个母题、2层基因、3重身份、4级观感、5份资产）
- 掌握内容体系五件套（四级内容架构、独创理论、十年故事、百问百答、点线面打通）
- 掌握构建体系理论的五大方法（理想解法、节点法、词根法、母题法、核心法）
- 理解千万营收模型与4近原则（离钱近、离痛点近、离易用近、离信任近）
- 理解Web3核心定义（区块链+虚拟世界+现实交互）与以虚促实趋势
- 掌握传统金融转型Web3的扫描-入局-验证-链接方法论
- 理解赛道选择比努力更重要及容错率控制的金融视角战略风控
