  title: Web3赛道判断与转型决策模拟
  contents:
  - 你是一位年薪60万的券商行业研究员（手头闲置资金100万），观察到Web3热度上升。请完成以下决策推演：
  - 1. **扫描风向标**：列出你会重点跟踪的3类信息源（如特定研报、VC推特、链上数据工具），并设定‘入场信号’触发条件（如某赛道单周融资超X亿、头部VC连投Y项目）。
  - 2. **区分赛道优劣**：用金融视角（市场容量/竞争格局/政策/技术成熟度/人才稀缺度/资本关注度）对比分析：跨境电商 vs VR/AR vs 新能源 vs
    Web3基建层 vs Web3应用层，填写评分表并得出结论。
  - 3. **躬身入局设计**：你不打算All in辞职。设计一个‘周末/下班双轨’最小验证方案：以什么身份（如DAO贡献者/测试员/小额LP）参与哪个具体项目？投入多少时间/金钱？验证指标是什么？（如：能否搞懂合约逻辑/能否跑通一笔跨链/能否认识3个核心开发者）
  - 4. **链接资本**：规划未来3个月参加的线上/线下活动清单，目标结识几位VC/Founder？如何用‘懂金融合规+懂研报+懂叙事’的复合标签换取优质项目白名单/投资机会？
  - 5. **容错率控制**：设定你的止损线——最大亏损金额/最大投入时间/里程碑未达成则退出条件。保留的‘场外赚钱能力’（现金流来源）是什么？熊市若持续18个月，你的‘弹药’能撑多久？
