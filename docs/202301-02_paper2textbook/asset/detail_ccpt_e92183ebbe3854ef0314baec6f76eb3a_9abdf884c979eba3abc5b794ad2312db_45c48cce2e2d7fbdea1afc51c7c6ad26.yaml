units:
- 'no': 1
  name: 对标方法论 —— 让官方数据成为你的“商业雷达”
  points:
  - '**为什么需要这个概念？**'
  - '- 短视频带货竞争激烈，盲目原创成功率低，需要找到经过市场验证的爆款作为参考'
  - '- 第三方数据工具（如抖查查、蝉妈妈）数据滞后且不准确，难以实时捕捉行业最新趋势'
  - '- 短视频团队需要持续、稳定的高质量内容供给，但对标筛选缺乏统一标准'
  - '**核心定义**'
  - '- 以巨量百应创意中心等官方实时更新的爆款视频库作为对标依据，筛选出高GMV、低粉丝量的黑马视频进行学习与模仿，而非仅依赖第三方工具或大达人样本'
  - '**关键性质**'
  - '- 实时性：官方平台数据比第三方工具更准确、更实时，能捕捉到最新的行业爆款'
  - '- 筛选性：优先选择“粉丝量少但销量高”的黑马小达人作为学习对象，避免大达人粉丝加成造成的误导'
  - '- 模板化：爆款脚本模板复用优于盲目原创，一个脚本换文案换产品可反复使用'
  - '**典型例子**'
  - '- 通过巨量百应创意中心，输入“护肤”关键词，自动采集近7天内GMV最高的100条视频，筛选出粉丝量低于5万但单条视频GMV超10万的“黑马视频”，下载后用飞书妙记转成文字脚本，存入自己的脚本库'
  - '**边界条件**'
  - '- 官方平台数据虽准确，但仅覆盖入驻巨量百应的商家，部分非平台内爆款无法捕捉'
  - '- 新号对标时，若选择粉丝量过少的账号（如低于1000粉），可能因其偶然爆款而缺乏可复制性'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  excerpts:
  - 对标对标,这里上榜的,出成绩的,最新的,不就是最好的对标吗?
  - 我的思路是找那种,粉丝量少,但是销量高的视频,做参考
  - 这种黑马小达人更是我们小达人适合学习的对象,毕竟大达人都是有粉丝基础加成在的,销量天然会高一点.
  - 这里是比抖查查蝉妈妈这些第三方要更准确的行业优秀爆款视频库.
  - 好的脚本大概率是不会过时的,一个脚本模板,改改文案换个产品推,成功率大概也比瞎原创要好一点吧.
  - 视频下载下来,可以用飞书妙记,语音转文字,你懂得.
- 'no': 2
  name: 模板化拆解 —— 把爆款视频拆成“乐高积木”
  points:
  - '**为什么需要这个概念？**'
  - '- 1比1模仿爆款虽然保险，但直接搬运会面临平台打击和内容同质化风险'
  - '- 手动剪辑视频效率低，无法实现批量生产，难以满足矩阵化运营对内容数量的需求'
  - '- 视频制作看似复杂多变，缺乏统一的抽象模型就无法实现自动化生成'
  - '**核心定义**'
  - '- 提出所有短视频都可被拆解为六种基本元素：背景、标题、内容、文案、字幕、背景音乐。这是实现视频自动生成的核心抽象模型，也是将任意爆款视频转化为可复制模板的基础'
  - '**关键性质**'
  - '- 普适性：所有短视频无论形式如何，最终都由这六种元素构成'
  - '- 模块化：每个元素可独立寻找相似替代素材，降低模板复制的操作难度'
  - '- 可编程性：元素拆解后即可编写代码自动生成视频，实现批量化生产'
  - '**典型例子**'
  - '- 拆解一条中医养生流量视频模板：背景为一张中医大师照片放大模糊，标题为“请等一下，xxx”，内容为一张中医大师照片，文案为“国医大师xxx”，字幕为无，背景音乐为一段舒缓古风曲。随后为每个元素寻找3-5个相似素材，编写代码实现自动生成'
  - '**边界条件**'
  - '- 特效较多的视频（如复杂转场、粒子效果）拆解后难以用代码还原，需人工介入'
  - '- 模板拆解依赖对目标赛道的理解，若赛道本身内容形式单一，拆解出的模板受限'
  sources:
  - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
    role: origin
  excerpts:
  - 所有的视频都可以拆成以下元素：1. 背景：图或者视频 2. 标题：主、副标题 3. 内容：图、视频 4. 文案：5. 字幕：6. 背景音乐：
  - 视频模板有各种各样的形式，拆解的多了会发现其实都是上面提到的那些元素组成的
  - 举例，第一个流量视频模板可以拆解为：背景：一张中医大师的照片，放大模糊；标题：请等一下，xxxx；内容：一张中医大师的照片；文案：国医大师xxx；字幕：无；背景音乐：
  - 现在几分钟就能实现一个新的模板，抖音上看到的视频只要不是特效很多，基本都能做，只要拆解清楚就可以。
- 'no': 3
  name: 伪原创二创 —— 用“拼图思维”制造“新爆款”
  points:
  - '**为什么需要这个概念？**'
  - '- 平台对搬运打击日益严厉，直接搬运视频容易导致限流、封号'
  - '- 完全原创难度大、成功率低，需要借力已验证的爆款素材降低创作风险'
  - '- 各平台素材丰富，但缺乏系统化的素材筛选与重组方法，导致二次创作效率低'
  - '**核心定义**'
  - '- 以抖音、快手、知乎、小红书甚至TikTok等所有短视频平台为素材库，基于“情、趣、用、品”四象限内容分类的底层逻辑，寻找有迹可循的爆款规律，将素材不违规地二次创作为自己赛道的作品（拼接、换音乐等）'
  - '**关键性质**'
  - '- 跨平台取材：所有平台都是素材库，打破单一平台创作限制'
  - '- 底层逻辑驱动：基于“情（共情）、趣（有趣）、用（有用）、品（新奇特产品）”四象限识别爆款基因'
  - '- 不违规操作：通过拼接、换音乐等手法规避平台侵权检测'
  - '**典型例子**'
  - '- 在抖音找到一条播放量破千万的“情感共鸣”类视频，分析其文案和画面节奏后，将其画面素材与另一条快手的背景音乐拼接，文案改为自己赛道（如“中年职场困境”）相关的表达，发布到视频号后播放量突破百万'
  - '**边界条件**'
  - '- 过度拼接他人素材可能触犯平台原创审核，需要搭配自拍混淆元素降低风险'
  - '- “情、趣、用、品”仅用于内容定位和素材筛选，不能替代对目标用户需求的深入理解'
  sources:
  - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
    role: origin
  excerpts:
  - 我把短视频内容分为"情趣用品"四个字
  - 情-共情（举例：喜怒哀乐）喜怒哀乐里面又能延伸小朋友的喜怒哀乐，20岁的，30岁的，40岁的，50岁的，男人的，女人的，有钱男人的，没钱女人的等等一些列分支。
  - 趣-有趣（有意思的实验，80岁老人做口播，一些反差较大的有意思的内容）
  - 用-有用（你教会我做菜了，你在教我做PPT，你教我做电工等等）
  - 品-新奇特的产品（北方人大多数没见过酸角糕，很多地方特色的绿植其他地区没见过-昨天看文林写了一个爆款叫彼岸花的盆栽）
  - 所有短视频平台的爆款内容，都可以纳入其中。
  - 抖音，快手，优酷，知乎，小红书，甚至TK，所有的短视频平台都是你的素材库。
  - 通过这个底层逻辑，你会发现很多爆款都是有迹可循，我们要做的无非是把这些素材不违规的二创成自己赛道的作品，进行发布。
- 'no': 4
  name: 选择品即定人群 —— 让用户觉得“我真的需要”
  points:
  - '**为什么需要这个概念？**'
  - '- 视频号用户群体（中老年、下沉市场）与抖音快手差异明显，直接搬运其他平台的选品逻辑失败率高'
  - '- 面向泛人群的通用品（服装、食品）竞争激烈，难以通过价格优势取胜'
  - '- 带货效率取决于商品与目标用户需求的精准匹配，缺乏方法论时容易凭感觉选品'
  - '**核心定义**'
  - '- 通过定义目标人群标签（如中老年人+下沉城市）并挖掘该人群的特定需求（如身体好、重返青春）来选择品类，优先选择垂直需求品（运动、保养类）而非“通用品”（所有人的需求）'
  - '**关键性质**'
  - '- 人群先行：先定义清晰的人群标签（年龄、地域、消费习惯），再推导需求'
  - '- 垂直优先：垂直需求品让用户觉得“我真的需要”，价格反而不是首要决策因素'
  - '- 需求差异化：通用品因需求普通，只能靠价格或卖点吸引，不作为第一梯队选择'
  - '**典型例子**'
  - '- 视频号带货项目中，将人群定位为“中老年人+下沉城市”，挖掘其“身体好、重返青春”的特定需求，选择运动锻炼类和保养类产品（如健步鞋、按摩仪）而非服装、零食等通用品。最终通过直播实现单场破万场观、200多单的转化'
  - '**边界条件**'
  - '- 垂直需求品虽转化率高，但受众相对狭窄，需配合高频上新和持续内容输出维持流量'
  - '- 下沉市场用户对价格敏感度存在差异，部分垂直品（如高价保健品）需测试后再决定是否主推'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 选品其实就是定人群然后找需求，大家能理解这句话，就很好选品了。
  - 人群的话大家都知道，标签就是中老年人+下沉城市。
  - 年纪大了就想身体好，年纪大了就想重返青春，所以运动锻炼类的品和有关保养方面的品，都可以考虑。
  - 这种需求过于普通，这是所有人的需求，而不是我们目标人群的特定需求，所以不在我考虑的第一梯队里面。
  - 我个人的想法……价格什么的反而不是特别的重要，重点在于我觉得这玩意对我有用。
  - 而我个人更偏向于那种，让用户看了觉得这个东西我是真的需要，是真的适合我。
- 'no': 5
  name: 视频号新号流量扶持 —— 平台送给新手的“新手村加速器”
  points:
  - '**为什么需要这个概念？**'
  - '- 新账号冷启动阶段播放量低、无人问津，大量运营者在前7天就放弃'
  - '- 不了解平台的冷启动机制，就无法利用平台规则加速起量过程'
  - '- 需要判断新号流量扶持的时间窗口和效果边界，以制定合理的起号策略'
  - '**核心定义**'
  - '- 视频号平台给予新注册账号在初期（据称7天）的流量倾斜机制，表现为新号发视频容易破万播放，是快速起量的重要基础'
  - '**关键性质**'
  - '- 时限性：扶持期通常在注册初期（约7天），过期后流量回归正常水平'
  - '- 叠加性：新号在扶持期内大量发视频可叠加获得百万级播放量'
  - '- 不确定性：不同账号的扶持效果存在差异，但破万播放较为普遍'
  - '**典型例子**'
  - '- 作者17号开始发第一条视频，当天晚上三个号全部破万播放（两个1W出头，一个3W+），验证了新号流量扶持的存在及起量速度'
  - '**边界条件**'
  - '- 扶持期结束后流量下降明显，需要依赖内容质量和粉丝积累维持播放量'
  - '- 过度依赖流量扶持会导致扶持期结束后数据断崖式下跌，需提前规划内容策略'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 一个是因为视频号新号有流量扶持，这个在我看来是最重要的。
  - 圈友诚不欺我也，新号果然是有流量扶持的，这个视频号还真可以搞。
  - 到了晚上我看了一下，三个号全部破万播放了，两个1W出头，有一个跑到了3W+的播放。
  - 我听说是新号有7天的流量扶持？现在我最开始3个号都过了七天，我倒是没觉得流量有差很多。
  - 在7天扶持期内作死的发视频，一个视频几千一万的，几十个视频就是几十万，几百个就是几百万，然后7天时间过了就换号。
  - 这样虽然不长久，但总比每天发了没反应做无用功要强吧。
- 'no': 6
  name: 视频搬运去重流水线 —— 给旧素材换上“新马甲”
  points:
  - '**为什么需要这个概念？**'
  - '- 直接搬运同行视频会触发平台的重复检测机制，导致限流或封号'
  - '- 不同平台对相同内容的容忍度不同，需要一套固定的去重流程来规避风险'
  - '- 搬运视频的转化率依赖于引导文字的吸引力，而非视频本身，需要标准化处理流程'
  - '**核心定义**'
  - '- 一套固定的视频去重与改造流程：先放大翻转画面，再按原视频情况处理BGM（换BGM/加BGM底/变速），随后识别并遮盖原字幕，最后添加针对产品特点的醒目引导文字'
  - '**关键性质**'
  - '- 流程化：四步固定流程（放大→翻转→BGM→加字），可批量化操作'
  - '- 去重性：通过画面翻转、变速、遮盖字幕等手段规避平台重复检测'
  - '- 转化导向：加字引导被视作出单关键，而非视频本身内容'
  - '**典型例子**'
  - '- 从快手找到一条卖拖把的短视频，先放大画面并左右翻转，再加速至1.2倍并添加新的背景音乐，识别原字幕并覆盖，最后加上一句“今天惹老伴生气了，罚我做一天家务，还好有这个拖把”的引导文字，发布到视频号后成功出单'
  - '**边界条件**'
  - '- 画面翻转、变速幅度过大可能影响观看体验，需适度处理'
  - '- 加字引导需要精准抓取目标用户心理，文案能力不足时效果大打折扣'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 我基本是一个固定的处理流程，放大→翻转→bgm→加字。
  - 带讲解的但没有bgm的视频，我会给他加个bgm的底。本身又有讲解又有bgm的，我就会整个变速啥的，调个1.1倍1.2倍稍微弄一下。
  - 没字幕的识别个字幕，有字幕的也识别个字幕，把原先的给他遮了。
  - 最后就是加字，这个点其实我感觉挺重要的，就是针对产品特色/作用/需求等方面，给他整个一两句话，然后弄个醒目的颜色加上去。
  - 有时候出单可能不是因为视频，而是你加的字抓住了用户。
  - 比如产品是个拖把……今天惹老伴生气了，罚我做一天家务，还好有这个拖把。
- 'no': 7
  name: 混淆元素与随机取用 —— 让批量视频“长得不一样”
  points:
  - '**为什么需要这个概念？**'
  - '- 自动化批量生成的视频若内容雷同，会被平台判定为搬运或低质内容，无法通过原创审核'
  - '- 手动差异化处理效率低，无法支撑矩阵化运营对内容数量的要求'
  - '- 需要一套机制在自动化流程中自然地生成具有差异性的原创内容'
  - '**核心定义**'
  - '- 通过三个手段确保自动生成的视频各不相同且能通过平台原创审核：素材随机取用（每个素材随机选择）、时间段随机取用（模板多片段时随机截取素材内时间段）、加入自己拍摄的照片和视频作为混淆元素'
  - '**关键性质**'
  - '- 随机性：素材和片段时间的随机选择保证每批生成的视频内容不同'
  - '- 原创性：加入自拍混淆元素使视频在平台上能通过原创审核'
  - '- 自动化：三个手段均可编码实现，无需人工干预'
  - '**典型例子**'
  - '- 在一套中医养生视频模板中，准备了20张中医相关照片、50段背景视频、30首背景音乐。生成时每次随机选取1张照片、随机截取某段视频的某个时间段，并混入自己拍摄的5张生活照片，确保生成的100条视频各不相同且都能过原创审核'
  - '**边界条件**'
  - '- 自拍混淆元素需与赛道相关或至少不突兀，否则影响视频内容的完整性'
  - '- 随机组合可能产生不协调的视频（如古风画面配现代音乐），需要预设合理的素材组合规则'
  sources:
  - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
    role: origin
  excerpts:
  - 这里有几个方法：1、每个素材随机取用 2、如果模版视频有多个片段，那么每个片段素材内的时间段也随机取用
  - 再加上混淆元素，这样能保证做出来的视频都是原创视频，且每个视频生成的都不相同，在任何一个平台都能过原创。
  - 每个视频的生成时都加一些混淆元素，用自己拍的照片和视频
- 'no': 8
  name: 黑马小达人策略 —— 向“低粉高销”的野路子学习
  points:
  - '**为什么需要这个概念？**'
  - '- 对标大达人（粉丝百万级）时，其销量受粉丝基础加成影响，难以判断内容本身的质量'
  - '- 普通小达人需要可复制、可参照的学习对象，而非遥不可及的大V案例'
  - '- 缺乏筛选标准时，对标账号的选择随意性大，学习效率低'
  - '**核心定义**'
  - '- 在采集数据后，优先筛选“粉丝量少但销量高”的视频作为学习对象。大达人有粉丝基础加成导致销量天然偏高，黑马小达人更适合普通小达人对标学习'
  - '**关键性质**'
  - '- 可参考性：低粉高销说明内容本身具备转化力，而非依赖粉丝信任'
  - '- 筛选标准明确：粉丝5W以下、视频200条以上、围绕固定垂直品反复带、画面干净等'
  - '- 机会性：黑马小达人往往被搬运次数少，素材稀缺性高'
  - '**典型例子**'
  - '- 在巨量百应创意中心筛选出一位粉丝仅8000、但近30天带货视频累计GMV超20万的博主。分析其视频后发现，其脚本多采用“痛点前置+产品演示+限时优惠”结构，因此复制该结构替换为自己赛道的产品和文案，成功跑出多条爆款视频'
  - '**边界条件**'
  - '- 黑马小达人可能昙花一现，需持续更新对标库而非固定某几个账号'
  - '- 部分低粉高销账号依赖直播转化而非视频内容，需结合直播间数据综合判断'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  excerpts:
  - 我的思路是找那种,粉丝量少,但是销量高的视频,做参考
  - 这种黑马小达人更是我们小达人适合学习的对象,毕竟大达人都是有粉丝基础加成在的,销量天然会高一点.
  - 粉丝在5W以下、视频在200以上、一直围绕几个品反复带、视频画面不是自己加很多字的、有一定的非带货视频、保持更新，这样的号我就会把它列入考察目标。
  - 小号就代表被搬过的几率小，而且号主本人同时在发视频号的几率也小。视频多素材就多，可以发的久也可以去做筛选。
- 'no': 9
  name: 核心剧情前置 —— 把小说的“高潮”提前到第一眼
  points:
  - '**为什么需要这个概念？**'
  - '- 知乎小说常“中开高走”或“低开高走”，开头平淡，观众缺乏点击和完播的动力'
  - '- 抖音等平台的推荐机制高度依赖5秒完播率，开头不吸引人则后续流量极低'
  - '- 需要对原文进行二次加工，而非直接配音朗读原文'
  - '**核心定义**'
  - '- 针对知乎小说开头吸引力不足的问题，将核心剧情（含冲突、悬念、反差）提炼后前置到视频开头，以提高5s完播率'
  - '**关键性质**'
  - '- 前置性：将文章最精彩的部分在开头就呈现给观众'
  - '- 提炼性：从通读文章中提炼冲突、悬念、反差等核心剧情元素'
  - '- 增强性：可适当添加情绪修饰词（如“竟然”“偏偏”“非要”）强化感染力'
  - '**典型例子**'
  - '- 一篇文章的开头是平淡的家庭场景描写，但中后段出现“母亲出轨”的反转。改写时直接将“发现母亲出轨的那一刻，我愣住了”作为视频开头，成功将完播率从40%提升至65%'
  - '**边界条件**'
  - '- 核心剧情前置需保持与原文的连贯性，过度改编可能丢失原文细节和韵味'
  - '- 部分慢热型文章缺乏突出的“爆点”，提炼难度大，需评估改造成本'
  sources:
  - paper: docs/202301-02/ZcEdd0xTCo1K5IxwCyLccKUynOb.md
    role: origin
  excerpts:
  - 有些文章的开头第一、二句话并没有那么吸引人，只是在陈述一件平淡的事，读到中后期才能体会到它的精彩之处，俗称'中开高走'或者'低开高走'。
  - 如何提高5s完播率乃至整体完播率？这些个问题转化一下就是：如何把文章的精彩部分在开头就呈现给观众？
  - 将核心剧情提前后，还可以适当添加一些能够调动情绪的修饰词，比如'竟然''偏偏''非要'等。
  - 对剧情发展毫无贡献的文字完全可以删去用来精简篇幅。
- 'no': 10
  name: 选文垂直化 —— 抓住“优质作者”这条稳定水源
  points:
  - '**为什么需要这个概念？**'
  - '- 从问题区随机挑选文章，来源不稳定，无法保证文章质量和爆款潜力'
  - '- 账号需要高度垂直的内容定位，而随机选文难以持续维持垂直度'
  - '- 新文章发现滞后，无法抢占关键词先发优势'
  - '**核心定义**'
  - '- 通过作者垂直（关注8-10个优质作者，跟踪其动态获取首发文章）和专栏垂直（利用盐选专栏的编辑筛选机制，同一主题下高效扩充同类型文章）两种路径获取稳定优质的文章来源，确保账号内容定位精准、具备爆文潜力'
  - '**关键性质**'
  - '- 稳定性：抓住优质作者即抓住稳定文章来源，无需频繁翻阅问题区'
  - '- 垂直性：专栏选文强化账号垂直定位，比分散的作者选文更聚焦'
  - '- 先发优势：跟踪作者动态可抢占关键词，先人一步发布'
  - '**典型例子**'
  - '- 一个情感账号关注了8位知乎情感领域万粉作者，每天定时查看其动态（点赞、回答、关注的问题），从中筛选新发布的优质文章，并将其所属盐选专栏中的同类型文章一并纳入备选库'
  - '**边界条件**'
  - '- 优质作者也可能发一些低质量文章，仍需二次筛选判断'
  - '- 过度依赖少数作者可能导致内容风格单一，需定期补充新的对标作者'
  sources:
  - paper: docs/202301-02/ZcEdd0xTCo1K5IxwCyLccKUynOb.md
    role: origin
  excerpts:
  - 选文是小说推文项目的绝对核心。选文可分为两个步骤，首先是找到充足的、优质的文章来源，其次是筛选出符合账号定位、有爆文潜力的文章。
  - 作者是最稳定的文章产出。关注8~10个符合账号定位的优质作者，在知乎-动态里可以看到他们每天点赞的文章、关注的问题、发布的回答还有他们关注的作者，顺腾摸瓜挨个找下去。
  - 专栏选文是对作者选文的补充：选中了作者的某篇优质文章后，查看该文章所属盐选专栏，再去专栏里筛选同类型的优质文章。
  - 抓住了作者，就可以说抓住了稳定的文章来源。不需要经常去翻阅问题的新回答，把重心从问题上移到回答问题的人身上。
  - 关注好作者/专栏后，每天选定几个时间点'收菜'就可以了，不仅能直观看到优质作者的最新动态、争取文章首发，还能捕捉盐选专栏动态，抢占关键词先发制人。
  - 专栏收纳的是同一主题或者同一作者的优质文章，相当于知乎的编辑事先帮我们筛选一遍。
  - 从专栏里选文章对账号的'垂直'帮助很大，因为优质作者们很少会死磕某一类文章，我们也不可能只发一个作者的文章，但我们可以瞄准了一个专栏使劲薅。
- 'no': 11
  name: 流量视频 vs 带货视频 —— 内容矩阵的“分工协作”
  points:
  - '**为什么需要这个概念？**'
  - '- 短视频内容承担两种截然不同的任务：拉新曝光与直接转化，混为一谈会导致内容策略不清晰'
  - '- 流量视频追求播放量，带货视频追求转化率，两者的评价指标不同'
  - '- 自动化生产需要先对内容进行分类，才能针对每类制定对应的模板和素材库'
  - '**核心定义**'
  - '- 每个赛道的短视频内容都被划分为两类：流量视频用于拉曝光、涨粉和打标签，带货视频用于直接促成销售转化。这是内容自动化生产的第一步分类'
  - '**关键性质**'
  - '- 目标差异：流量视频追求曝光和标签，带货视频追求销售转化'
  - '- 模仿基准：两类视频都以验证过的爆款为模板，确保1比1模仿的内容质量在60分以上'
  - '- 策略协同：流量视频蓄水，带货视频收割，两者形成内容矩阵'
  - '**典型例子**'
  - '- 一个中医养生账号：每周发布3条流量视频（引用中医养生知识、情绪共鸣类内容）拉新涨粉，同时发布2条带货视频（演示某款保健品功效）直接引导购买。流量视频带来账号标签精准化，带货视频承接流量实现转化'
  - '**边界条件**'
  - '- 部分赛道（如机械工具类）流量视频与带货视频内容重合度高，分类成本高'
  - '- 自动化生产中流量视频与带货视频的发布比例需根据账号阶段动态调整'
  sources:
  - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
    role: origin
  excerpts:
  - 每个赛道的视频内容也都有两种：流量视频和带货视频。流量视频是拉曝光涨粉打标签用的，针对要做的客户人群画像，找到对标账号，找出当下流行的爆过的那些流量视频
  - 带货视频也是一样的路子。用这样验证过的流量视频或者带货视频当模板，是要保证1比1模仿做出的内容都是60分以上的。
- 'no': 12
  name: 小说推文的批量生产SOP —— 把“文艺创作”变成“流水线作业”
  points:
  - '**为什么需要这个概念？**'
  - '- 单篇小说推文制作耗时（选文、改文、配音、剪辑），无法满足日更多篇的需求'
  - '- 手工制作质量不稳定，难以形成可持续的内容供给能力'
  - '- 需要一套标准化、可重复的流程，降低单条内容的制作时间和精力消耗'
  - '**核心定义**'
  - '- 将小说推文的全流程（选文改文、剪辑制作、发布运营、日常维护）标准化为固定SOP：选文垂直化（作者垂直+专栏垂直）、核心剧情前置、改文套路化、模板化剪辑、固定发布策略、日更养号'
  - '**关键性质**'
  - '- 全流程覆盖：从选文到剪辑到发布维护，均有固定流程和技巧'
  - '- 时间可控：熟练后单条视频剪辑时间可控制在15分钟内'
  - '- 质量稳定：模板化制作保证每条内容都达到及格线以上'
  - '**典型例子**'
  - '- 作者运营2个号，每天发布2-4条视频，从选文改文到剪辑发布投入的时间不超过1.5小时，单号每周收益稳定在400元左右'
  - '**边界条件**'
  - '- SOP依赖选文质量，若选文环节未垂直化则后续改文剪辑的投入可能浪费'
  - '- 标准化流程可能限制创意发挥，需定期引入新模板防止内容同质化'
  sources:
  - paper: docs/202301-02/ZcEdd0xTCo1K5IxwCyLccKUynOb.md
    role: origin
  excerpts:
  - 下面我将根据配音号的实操流程，从选文改文、剪辑制作、发布运营、日常维护四个方面展开。
  - 目前我运营2个号，每天发布2-4条视频，每天从选文改文到剪辑发布投入的时间不超过1.5小时，单号每周收益在400左右，偶尔爆一篇赚几百上千。
  - 小说推文的剪辑操作并不难，甚至可以简化到'打开剪映-拖入素材-处理素材-智能字幕-导出视频'，熟练后用于剪辑的时间不超过15分钟。
  - 第一次剪辑后可复制草稿形成统一模板，后续直接打开在第一条视频的基础上进行删改。
  - 发布每一条视频前的5~15分钟就该上线了，开始刷一刷同行视频，给视频点点赞，在同行评论区留言。
  - 播放量过5k就可以主动引导了，等有一条视频过15w播放量后就可以置顶引导了。
