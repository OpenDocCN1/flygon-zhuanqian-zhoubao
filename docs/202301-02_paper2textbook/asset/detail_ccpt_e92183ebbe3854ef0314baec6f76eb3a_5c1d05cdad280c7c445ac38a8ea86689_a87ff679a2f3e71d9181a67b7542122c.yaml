  excerpts:
  - 小说推文项目：月收益1000~2W。
  - 流量效率高：内容素材获取简单，且素材大量，框架固定自带流量。
  - 销转效率高：搜索对应的暗号，充值会员就有佣金
  - 交付效率高：无需交付
  - 客单价低：十几二十块
  - 毛利率高：50%以上
  - 复购率低：没有复购
  - 教育资料1.0项目：月收益1000-~2W。（卖各种教育资料，比如考研，高考生物，化学）
  - 客单价低：十几块~小几十块，毛利率高：50~100%，复购率低：基本没有复购
  - 教育资料2.0项目：月收益2W~100W。（对比1.0，多了一步，高客单价转化合作）
  - 客单价低：几千到十几二十万不等，毛利率高：10%，复购率低：基本没有复购
  - 减肥食谱项目：月收益10W~200W。（在小红书，抖音上发减肥食谱）
  - 复购率高：减肥是个重复的过程。
  - 项目拆解商业IP，比如小徐，还有我自己：月收益10W到200W。
  - 流量效率低：项目拆解需要时间，以及好的信息源，所以很难批量产出。
  - 客单价高：从几千到六位数。毛利率高：70%以上
  - 知识付费，以李一舟为代表：月收益10W~500W
  - 客单价高：小几千。毛利率高：100%。复购率低：没有复购（课会更新）
