learning_targets:
- 理解 AI 绘画的算力瓶颈，掌握 Google Colab 作为免费云端 GPU 替代方案的定位与边界
- 掌握从零在 Colab 中搭建 Stable Diffusion WebUI 环境的一键脚本与手动步骤
- 掌握四种模型分发与迁移方法，并能根据模型体积、隐私需求与存储空间权衡选择
- 理解Prompt咒语中正向与负向提示词的作用，以及不同模型文件对画风的决定性影响
- 能通过COMMANDLINE_ARGS注入--share、--gradio-auth等参数定制WebUI的对外访问与安全策略
- 能识别免费算力的天花板（时间/空间限制），并制定多账号轮换与存储优化的应对策略
concept_map:
- AI绘画算力平权
- ├── 痛点与替代方案
- │   ├── 本地显卡门槛（N卡/A卡需求）  —— P001
- │   └── Google Colab 免费云GPU       —— P001, P002
- ├── 云端环境搭建
- │   ├── Colab账号申请与环境初始化    —— P001
- │   ├── 一键脚本：挂载Gdrive→git clone→装依赖 —— P001, P002
- │   └── Stable Diffusion WebUI可视化界面 —— P001, P002
- ├── 模型分发与迁移（位置闭环：拷贝到指定目录）
- │   ├── Gdrive挂载拷贝（15G限制、不易丢）—— P001
- │   ├── gdown链接下载（小圈子、易被屏蔽）—— P001
- │   ├── Hugging Face私有中转（推荐：隐私+空间）—— P001
- │   └── 任意云存储泛化下载（需外链/API）   —— P001
- ├── 出图控制与风格决定
- │   ├── Prompt咒语：正向tag+负向tag    —— P001, P002
- │   └── 模型画风差异（NovelAI/Waifu动漫 vs SD写实）—— P001
- └── 部署优化与算力天花板
- '    ├── 启动参数（--share公网/--gradio-auth鉴权/--deepdanbooru提词）—— P001'
- '    └── 免费额度限制（每日时长/15G Gdrive/55G Colab）与多账号轮换、直连下载应对 —— P001'
life_analogy:
- 想象在云端搭建AI画室的过程如同**开办一家远程营业的照相馆**：
- '- **Google Colab** = 你免费租到的一间云端暗房（自带GPU显影液、内存相纸和硬盘储物柜）'
- '- **Stable Diffusion WebUI** = 一台封装好的傻瓜相机，你无需懂光学原理，只需按快门（填表单）'
- '- **模型文件（.ckpt）** = 不同品牌的胶片，必须装进相机指定卡槽（模型目录）才能成像'
- '- **Gdrive/Hugging Face等存储源** = 你的胶片仓库，搬家（拷贝）时需考虑仓库容量与搬运方式'
- '- **Prompt正向/负向tag** = 给摄影师的指令清单：要什么（masterpiece、sea beach）和不要什么（lowres、watermark）'
- '- **--share与--gradio-auth** = 给照相馆装上临时的对外橱窗和门禁锁，客户凭密码才能进店'
- 就像开照相馆既要租得起暗房、选对胶片，也要会写拍摄指令并给店面配好锁和橱窗，云端AI绘画的全部流程也围绕环境、模型、提示词与访问控制这四件事展开。
summary:
- concept: Google Colab
  desc: Google提供的免费云GPU服务器，通过浏览器远程执行，解决了本地无高性能显卡的算力痛点
- concept: Stable Diffusion WebUI
  desc: 基于Stable Diffusion的可视化Web界面，将命令行封装为鼠标点击，是AI绘画走向大众的关键推手
- concept: 模型分发与迁移
  desc: 把模型文件从Gdrive、Hugging Face等存储源拷贝到云端WebUI指定目录的方法集合，位置闭环是出图前提
- concept: Gdrive挂载法
  desc: 优点是不易丢失，缺点是免费盘仅15G，放不下几个大模型（动辄4G-8G）
- concept: Hugging Face私有中转法
  desc: 创建私有仓库+token鉴权下载，兼顾隐私与空间，是作者最推荐的模型分发方式
- concept: Prompt咒语
  desc: 正向tag（描述期望元素与质量）与负向tag（排除缺陷）共同控制AI绘画输出
- concept: 模型画风差异
  desc: 不同模型因训练数据不同而画风迥异：NovelAI/Waifu偏动漫，SD系列（LAION-5B）偏写实
- concept: 启动参数配置
  desc: 通过COMMANDLINE_ARGS注入--share、--gradio-auth等参数，定制公网访问、登录鉴权与图片提词功能
- concept: 免费算力天花板
  desc: 免费GPU每日数小时硬限制、Gdrive 15G vs Colab 55G空间差异，需多账号轮换与直连下载应对
exercises:
- 'no': 1
  title: 手算一次注意力（迁移练习：模型分发路径权衡）
  contents:
  - 假设你需要在 Colab 中加载两个 Stable Diffusion 模型（每个约 6G），请你：
  - 1. 分别评估使用 Gdrive 挂载法与 Colab 直连下载法的可行性
  - 2. 计算两种方案下剩余可用的云端硬盘空间
  - 3. 若其中一个模型为泄露的非官方开源模型，选择分发方式时应考虑什么？
  - 回答问题：
  - '- 鉴于 Gdrive 免费盘仅 15G，colab 有 55G，你倾向于哪种方式？为什么？'
  - '- Hugging Face 私有中转法相比 gdown 分享法的核心优势是什么？'
- 'no': 2
  title: 调试一次环境搭建流程
  contents:
  - 根据素材，在 Colab 中执行以下操作：
  - 1. 申请一个 Google 账号并访问共享脚本，修改硬件加速器为 GPU
  - 2. 依次执行挂载 Gdrive、git clone WebUI 仓库、安装依赖三大命令
  - 3. 尝试运行一键脚本（运行当前单元格及其后的所有单元格）
  - 4. 观察并记录脚本执行过程中可能出现的报错或中断点
  - 回答问题：
  - '- 为什么每次使用完必须‘断开并删除运行时’？这会导致什么损失？'
  - '- 假设你在运行 `git clone` 时网络中断，如何在不浪费免费时长的情况下恢复？'
- 'no': 3
  title: Prompt 画风控制对比实验
  contents:
  - 使用同一段 Prompt 与同一参数：
  - 正向tag：masterpiece, best quality, sea beach, chiaroscuro
  - 负向tag：lowres, bad anatomy, watermark
  - 1. 在 NovelAI 与 Stable Diffusion 1.5 两个模型上各生成一张图
  - 2. 对比两张图的画风差异，并说明原因
  - 3. 尝试在负向tag中删除 bad anatomy 并重新生成，观察画面变化
  - 回答问题：
  - '- 模型文件的训练数据源（如 LAION-5B）如何决定画风边界？'
  - '- 负向tag 过度使用可能带来什么副作用？'
- 'no': 4
  title: 设计一个带鉴权的公网访问方案
  contents:
  - 你想把自己搭建的 WebUI 分享给 3 位朋友使用：
  - 1. 写出包含 --share 与 --gradio-auth 参数的完整 COMMANDLINE_ARGS 命令
  - 2. 解释每个参数的作用
  - 3. 说明公网链接的时效性特点
  - 回答问题：
  - '- 如果希望额外支持从图片反推 prompt 的功能，应追加哪个参数？'
  - '- 公网链接失效后，如何快速恢复给朋友的访问权限？'
units:
- 'no': 1
  name: Google Colab —— 让每个人的电脑都拥有云端”显卡“
  points:
  - '**为什么需要这个概念？**'
  - '- AI绘画（如Stable Diffusion）需要较强的GPU资源，一般个人电脑配置难以满足'
  - '- 高性能显卡价格昂贵，且升级电脑硬件成本高、门槛高'
  - '- 需要一个免费、无需本地硬件升级即可获得强大算力的替代方案'
  - '- Colab作为免费的云端GPU服务器，恰好解决了这一痛点'
  - '**核心定义**'
  - '- Google提供的免费云GPU服务器（Ubuntu 18.04 + GPU），用户可通过浏览器远程连接并执行Python代码'
  - '- 免费配置约12G内存、15G显存、55G硬盘，可用于AI训练/推理'
  - '**关键性质**'
  - '- 免本地硬件：只需浏览器和Google账号即可使用，无需N卡/A卡'
  - '- 免费额度：每个账号每天约有数小时的免费使用时长'
  - '- 远程执行：环境在云端，用户可以随时断开，下次重新连接'
  - '**典型例子**'
  - '- 在无本地高性能显卡的电脑上，通过Colab运行Stable Diffusion WebUI完成AI绘画出图'
  - '**边界条件**'
  - '- 免费额度每天有限（数小时），长时间使用需多账号轮换付费'
  - '- 环境不持久：断开并删除运行时会清空搭建好的环境，需重新搭建'
  sources:
  - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
    role: origin
  excerpts:
  - colab是google提供的一个云平台，可以理解为一台远程电脑或者云服务器，用户远程连接进去后，可以用其提供的CPU、GPU资源做各种各样的事情。
  - Google colab提供了免费与收费服务，免费服务每个账号大概每天可以玩几个小时，免费的配置大概是12G的内存，15G左右的显存以及55G左右的硬盘。
  - 因为数据训练需要较为强大的GPU资源，一般很多个人电脑配置并不能达到要求，所以colab现在在人工智能、机器学习领域用的比较多。
- 'no': 2
  name: Stable Diffusion WebUI —— 从命令行到可视化，AI绘画的“傻瓜相机”
  points:
  - '**为什么需要这个概念？**'
  - '- 原始的Stable Diffusion需要通过写代码或敲命令来使用，对大多数人极不友好'
  - '- 命令行交互方式学习成本高，阻碍了技术的普及'
  - '- 需要一个封装好的可视化界面，让普通人也能轻松上手'
  - '- WebUI正是这样一个将复杂模型封装为友好GUI的工具，是AI绘画走向大众的关键推手'
  - '**核心定义**'
  - '- 基于Stable Diffusion开发的可视化Web界面，用户可免去命令行交互，直接在浏览器中操作出图'
  - '**关键性质**'
  - '- 可视化操作：通过鼠标点击、填写表单即可完成参数配置'
  - '- 可扩展性：支持加载不同模型文件（.ckpt）并切换'
  - '- 公网访问：可通过启动参数生成公网链接，分享给他人使用'
  - '**典型例子**'
  - '- 在Colab中搭建WebUI后，用户直接在网页上输入prompt即可生成动漫或写实风格的图片'
  - '**边界条件**'
  - '- 依赖底层环境（如Colab）的资源，环境断开则服务停止'
  - '- 虽免命令行，但仍需理解基本概念（如模型目录、参数配置）才能高效使用'
  sources:
  - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
    role: origin
  excerpts:
  - 基于用于stable diffusion开发的一套webui的界面，方便更多人的使用。没有这个的话，要使用stable diffusion的话只能写代码或者敲命令，大多数人使用会很困难，这也是现在AI绘画大火的一个很重要的原因。
- 'no': 3
  name: 模型分发与迁移 —— 把模型文件”搬“进云端画室
  points:
  - '**为什么需要这个概念？**'
  - '- 搭建好WebUI环境仅仅是准备了一个“空画室”，没有“颜料和画笔”（模型文件）无法出图'
  - '- 模型文件体积巨大（4G、8G），传输和存储都有限制'
  - '- 需要一套高效、安全的方法将模型文件从本地或网盘“搬”进云端环境'
  - '- 不同的模型文件（Gdrive、gdown、Hugging Face等）各有优劣，需按场景选择'
  - '**核心定义**'
  - '- 指将预训练的Stable Diffusion模型文件（如.ckpt）从各种存储源（Google Drive、Hugging Face、任意云存储）迁移到云GPU环境（Colab）的WebUI指定目录的方法集合'
  - '**关键性质**'
  - '- 位置闭环：模型文件必须拷贝到WebUI指定模型目录下才能被加载出图'
  - '- 方式多样：挂载拷贝、链接下载、私有中转、泛化下载等方式并存'
  - '- 空间权衡：Gdrive免费空间小（15G）但不易丢失；Colab直连空间大（55G）'
  - '**典型例子**'
  - '- 通过Hugging Face私有仓库+token中转，既保护非官方泄露模型的隐私，又解决了Gdrive空间不足问题'
  - '**边界条件**'
  - '- Gdrive免费盘15G空间限制，放不下几个大模型'
  - '- gdown分享方式只适合一两人小圈子，人多会被Google屏蔽'
  - '- Hugging Face私有法需要额外注册账号并掌握token生成'
  sources:
  - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
    role: origin
  excerpts:
  - 将模型文件放入自己的Gdrive（Google 云端硬盘），然后colab挂载Gdrive，将Gdrive的文件拷贝到Colab中。
  - 这种方法的优点是模型文件因为是自己的云端硬盘文件，会确保不会丢失，缺点是免费的google账户硬盘空间只有15G，模型文件动辄4G、8G，所以存不了几个模型云端硬盘就会满了。
  - 我个人比较推荐使用huggingface，简单易学，综合体验很好。
  - 如mega，AWS S3，google Cloud Storage...只要能拿到模型文件的外网访问地址，或者有提供API的云盘，理论上都可以，原理和从huggingface下载是一样的。
- 'no': 4
  name: Prompt咒语与画风差异 —— 指挥AI的“魔法咒语”
  points:
  - '**为什么需要这个概念？**'
  - '- 如何让AI画出你想要的画面？这需要一套精确的控制指令'
  - '- 正向和负向提示词（tag）是控制AI绘画质量的关键输入'
  - '- 不同模型文件的训练数据不同，生成的画风有显著差异，需要理解并善用'
  - '- Prompt工程让普通人也能稳定输出高质量、风格化的图片'
  - '**核心定义**'
  - '- 正向tag（如masterpiece、best quality、chiaroscuro）与负向tag（如lowres、bad anatomy、watermark）共同组成的高质量文生图提示词组合'
  - '- 不同模型（如NovelAI动漫风 vs SD1.5写实风）因训练数据不同而呈现不同画风'
  - '**关键性质**'
  - '- 正向tag描述期望出现的元素与质量，负向tag排除不期望出现的缺陷'
  - '- 模型文件决定画风：动漫类模型偏二次元，SD系列因LAION-5B数据偏向真实'
  - '- 同一prompt在不同模型下输出的结果不同，模型选择是画风控制的关键'
  - '**典型例子**'
  - '- 输入正向tag“masterpiece, best quality, sea beach, chiaroscuro”与负向tag“lowres, bad
    hands, watermark”，可稳定输出精致细腻的动漫风海洋场景'
  - '**边界条件**'
  - '- Prompt编写有学习曲线，不同主题需要不同的关键词组合'
  - '- 负向tag需谨慎，过度使用可能抑制画面质量'
  - '- 画风受限于模型本身的训练数据边界，无法生成超出模型能力的内容'
  sources:
  - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
    role: origin
  excerpts:
  - masterpiece,best quality,CG,wallpaper,HDR,{(sea beach)},{beautiful detailed water},{detailed
    light},((extremely delicate and beautiful girls)),((blue bubble)),splash,fluttered
    detailed splashs,{{intricate detail}},{highres},surrounded_by_floating_petal,chiaroscuro,swimming
    ring,splash,waves, coconut trees
  - 'Negative prompt: lowres, (bad anatomy, bad hands:1.1), text, error, missing fingers,
    extra digit, fewer digits, cropped, worst quality, low quality, normal quality,
    jpeg artifacts, signature, watermark, username, blurry, artist name, b&w, weird
    colors, (cartoon, 3d, bad art, poorly drawn, close up, blurry:1.5), (disfigured,
    deformed, extra limbs:1.5)'
  - 从模型使用同一个prompt、同样参数生成的图片，可以明显看出novelai以及waifu满满的动漫风、其他模型则更加显得真实一些。
  - NovelAI以及Waifu这两个模型对应的是动漫画风，Stable Diffusion1.4/1.5，由于它使用来自LAION-5B数据库进行训练，...所以其画风包含了更多样式。
- 'no': 5
  name: 启动参数配置 —— 给WebUI装上“对外窗口”
  points:
  - '**为什么需要这个概念？**'
  - '- 默认启动的WebUI只在本机可见，难以分享给他人'
  - '- 裸奔的公网接口有安全隐患，需要登录鉴权'
  - '- 不同使用场景（公开分享、私人使用、图片提词）需要不同的功能支持'
  - '- 通过命令行参数注入，可灵活配置启动行为，满足多样化需求'
  - '**核心定义**'
  - '- 通过COMMANDLINE_ARGS环境变量向launch.py注入--share、--gradio-auth、--deepdanbooru等命令行参数，以定制WebUI的启动行为（如生成公网链接、开启鉴权、加载提词功能）'
  - '**关键性质**'
  - '- --share可生成一个在线的gradio.app公网链接，实现访问分享'
  - '- --gradio-auth可设置登录用户名与密码，保障安全'
  - '- --deepdanbooru用于安装图片提词工具，便于通过图片反推prompt'
  - '**典型例子**'
  - '- 使用`--share --gradio-auth test:test`启动后，获得带鉴权的公网链接，他人输入账号密码即可访问'
  - '**边界条件**'
  - '- 公网链接为临时生成，环境重启后失效'
  - '- 参数配置需在启动前正确设置，错误参数可能导致启动失败'
  - '- 公网访问依赖网络环境，部分网络可能无法访问gradio.app'
  sources:
  - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
    role: origin
  excerpts:
  - '命令行参数如下:'
  - '  - `--share` - 创建一个在线的 gradio.app 链接'
  - '  - `--deepdanbooru` - 用于安装deepdanbooru，方便使用图片获取prompt'
  - '  - `--ckpt` - 用于选择加载默认模型'
  - '!COMMANDLINE_ARGS="--deepdanbooru --share --gradio-debug --gradio-auth test:test"
    REQS_FILE="requirements.txt" python launch.py'
- 'no': 6
  name: 免费算力的天花板 —— 知其然，更知其所以然
  points:
  - '**为什么需要这个概念？**'
  - '- 免费的午餐终有限度，理解免费额度的边界才能合理规划使用'
  - '- 15G的Gdrive空间与55G的Colab空间存在明显差异，需知晓各自的局限'
  - '- 当免费额度不足以支撑需求时，有多账号轮换等应对策略'
