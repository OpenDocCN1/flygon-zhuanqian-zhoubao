unsupported_claims:
- location: ch40.3
  claim: '"赚钱的本质是交易，交易的本质是满足用户需求。只要满足用户需求，就能赚到钱，你需要做的就是选谁作为付款者，以及怎么打动付款者，这个需求可以是物质需求，也可以是精神需求。"'
  reason: 素材中未找到支撑
- location: ch40.4
  claim: '"流量价值=流量规模×交易相关性×信任度"'
  reason: 素材中未找到支撑
- location: ch40.5
  claim: '"财富积累分为四个阶段，第一：出卖劳动力；第二：一份时间多次卖；第三：购买他人时间；第四：钱生钱。"'
  reason: 素材中未找到支撑
- location: ch40.6
  claim: '"依靠出租自己的时间是很难致富的，要想获得财富，就要充分利用杠杆效应，比如劳动力，自媒体（无限放大自己的影响力），和复制边际成本几乎为零的产品（软件，课程，虚拟产品等）。"'
  reason: 素材中未找到支撑
- location: ch40.7
  claim: '"比如最重要的是先卖产品的想法，而不是做产品。如果聊了 100 个人，只有几个人买，肯定有问题；如果 20-30 个人购买，交了预售金，那这个不确定因素就解决了。"'
  reason: 素材中未找到支撑
- location: ch40.8
  claim: '"拆下来之后，我就发现很多时候有些项目是完全可以复制的，是不需要投入几十万也可以复制的。"'
  reason: 素材中未找到支撑
- location: ch40.9
  claim: '"需求和痛点的差别在什么呢？我以为我需要这个东西，它没有什么情绪的动力。"'
  reason: 素材中未找到支撑
- location: ch40.10
  claim: '"构思产品idea的动词，应该是''注意到''，而不是''想到''。''我注意到，有这么一个问题，可以这么来解决'' 而不是 ''我想到了一个创业idea''。"'
  reason: 素材中未找到支撑
- location: ch40.11
  claim: '"从平台电商的历史出发，我把美团的发展分为了四个周期：铺货、动销、精细化、玩趋势。"'
  reason: 素材中未找到支撑
- location: ch40.12
  claim: '"如果你选的是超垂直的细分领域，你如果坚持的是长期主义变现，那么还有一种流量比迎合平台推荐更有价值：那就是精准搜索的流量"'
  reason: 素材中未找到支撑
