- │   │   └── 各岗核心考核指标  —— P001
- │   ├── 剪辑→运营→项目经理成长路线  —— P001
- │   └── IP手（聊天手）：创始人IP内容挖掘岗  —— P001
- ├── 标准化内容生产流水线
- │   ├── 定位：竞品调研→商业缺口→细节梳理  —— P001
- │   ├── 选题：热点宝对标→选题库→多维评分  —— P001
- │   ├── 文案：跨领域对标素材库+爆款开头句式结构  —— P001
- │   │   └── 黄金结构：钩子开头+漏斗观点+钩子结尾  —— P001
