units:
- 'no': 1
  name: 日更写作 —— 打造普通人的内容复利系统
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人最容易触手可及的杠杆是内容，复制边际成本为零，可重复利用、多平台推广、放大价值'
  - '- 写作输出是能力和价值的放大器，持续输出倒逼输入与思考，构建个人复利系统'
  - '- 在信息爆炸时代，真正创造内容的仅1%，内容创作者是享受红利的稀缺群体'
  - '**核心定义**'
  - '- 持续输出力：个人通过持续写作表达，倒逼输入与思考，积累知识、能力与影响力的能力'
  - '- 内容复利杠杆：以内容为媒介，利用复制边际成本为零特性，在多平台重复传播、放大价值，带来被动收益'
  - '- 写作即社交/身份证：写作是最佳社交活动，持续输出观点与价值观，内容本身成为个人筛选同频者、建立连接的“身份证”'
  - '**关键性质**'
  - '- 复利效应：时间越久、积累越多，价值指数级增长，而非线性增长'
  - '- 低门槛高上限：无需特殊资质，仅需执行力和坚持，上限由思考深度决定'
  - '- 筛选机制：内容自动筛选同频人群，建立高质量连接，降低社交成本'
  - '**典型例子**'
  - '- 作者日更565天，完成课程、付费社群、个人咨询三个变现闭环，微信好友数增加6倍'
  - '- 小马宋《营销笔记》中“基于能力和资源而非愿望做事”被2512位读者标注，验证优质内容的长尾传播力'
  - '**边界条件**'
  - '- 需解决“输入+思考+输出”全链路卡点，仅靠毅力不解决方法论会陷入“低水平勤奋”'
  - '- 必须允许“不完美表达”，追求完美会导致启动困难和中断'
  - '- 仅靠内容杠杆若无后端变现产品（课程、社群、咨询），难以直接转化为商业收入'
  - '...'
  sources:
  - paper: docs/202301-02/20230207_05.md
    role: origin
  - paper: docs/202301-02/20230207_09.md
    role: improve
  - paper: docs/202301-02/20230207_06.md
    role: apply
  excerpts:
  - 《纳瓦尔宝典》一书中提到要最大限度的利用杠杆，而对于普通人来说，最容易触手可及的就是'内容'，它的复制边际成本为零，可以重复利用，多平台推广，放大价值。
  - 我们把写作拆解一下，可以拆解为这样一个系统--输入+思考+输出~
  - 写作就是最好的社交活动，是你最好的'身份证'，因为你的思考，经历，价值观都在你的文章中一一展现
  - 日更公众号，先从坚持做到这件事，给自己积累和沉淀开始改变自己
- 'no': 2
  name: 渣男思维做内容 —— 撩完就跑与广撒网的爆款制造术
  points:
  - '**为什么需要这个概念？**'
  - '- 传统内容创作陷入“自嗨式表达”或“完美主义瘫痪”，难以持续产出爆款'
  - '- 平台算法偏好情绪峰值与完结体验，用户注意力稀缺，需低成本提高命中率'
  - '- 垂直领域创作者常误解“垂直”为内容题材单一，实则应垂直人群、广撒网'
  - '**核心定义**'
  - '- 撩完就跑：基于峰终定律，在内容开头和结尾制造愉悦体验（戳中痛点/痒点），中间过程可简略，在用户情绪最高点戛然而止，制造意犹未尽感'
  - '- 广撒网：在多个圈子、多平台发布内容，垂直的是目标人群而非内容题材，通过增加曝光面提高爆款命中率'
  - '- 爆款模板复用：爆过的内容一定可以再爆，内容创作靠模板工业化而非灵感'
  - '**关键性质**'
  - '- 峰终定律驱动：用户对体验的评价取决于峰值时刻和结束时刻，中间过程影响极小'
  - '- 低成本试错：单条内容投入极低（如20分钟产出10万赞藏），可大规模并行测试'
  - '- 反直觉的垂直性：内容题材可跨界，核心是精准击中同一类人群的不同需求面'
  - '**典型例子**'
  - '- “有钱人的生活”视频：开头无边泳池、结尾美妙画面，中间剪辑粗糙模糊，仍获大量点赞'
  - '- “做个人IP的40个APP”文：仅列名称不教用法，戳中痛点后即停，引发大量关注和咨询'
  - '- 作者小红书3个月从0涨粉8000、变现5万；20分钟产出10万赞藏大爆文，1万粉变现20万'
  - '**边界条件**'
  - '- 仅适用于“给工具/给方法”层级内容，“给娱乐”层级需完整剧情支撑'
  - '- “撩完就跑”若无真实价值支撑（如APP清单真实可用），会透支信任变成标题党'
  - '- “广撒网”需配合平台规则（如标题差异化避免判重），否则易触发限流封号'
  - '...'
  sources:
  - paper: docs/202301-02/20230207_05.md
    role: origin
  - paper: docs/202301-02/20230207_06.md
    role: improve
  excerpts:
  - 做渣男第一点：撩完就跑。戳痒点，意犹未尽。…… 咱们撩到用户的痒点就停，峰终定律，在情绪最高点停止，才能让人意犹未尽，印象最好。
  - 做渣男第二点：广撒网 渣男怎么养鱼的？当然是混多个圈子，他们不止在一个圈子里寻找自己的猎物。
  - 有同学就会问，咱们不是一直说做内容要垂直吗？为什么现在要广撒网呢？要注意，咱们垂直，并不是垂直内容，咱们垂直垂的是人群。
  - 爆过的内容一定是可以再爆的，内容创作不要靠灵感，要靠爆款模板！
- 'no': 3
  name: SEO思维布局精准流量 —— 长期主义者的隐形资产
  points:
  - '**为什么需要这个概念？**'
  - '- 平台推荐流量（爆款思维）不稳定、周期短、泛粉多、变现难，追风者易陷入“流量焦虑”'
  - '- 精准搜索流量（SEO思维）用户意图明确、转化率高、长尾效应强、抗周期能力强'
  - '- 超垂直个人IP需建立护城河，SEO内容积累是难以复制的长期资产'
  - '**核心定义**'
  - '- SEO思维：不追逐平台推荐，而是布局用户主动搜索的长尾关键词，通过“问题-解决方案”内容获取精准流量'
  - '- 100-10-1聚焦法：先找100个关键词/选款，每个测3-5条内容，筛选出10个能出单/引流的，最终聚焦1个爆款规模化'
  - '- 长尾福利：SEO内容发布后3-5年仍持续获得免费精准流量，实现“一次创作、终身收益”'
  - '**关键性质**'
  - '- 精准度高：主动搜索用户意图强，1个搜索粉丝价值 > 100个推荐粉丝'
  - '- 可控性强：关键词布局、内容结构、发布节奏均可标准化SOP，不依赖算法玄学'
  - '- 复利确定性：内容库随时间增厚，流量基数只增不减，形成护城河'
  - '**典型例子**'
  - '- 作者小红书/抖音发<200篇SEO内容，大半月不更新仍每天有人主动咨询'
  - '- 超垂直IP四步法：布局300-500长尾词 → 每词写1个解决方案/拍3分钟视频 → 多平台分发关键词全覆盖 → 1个月后每天自动来客'
  - '- 小红书资料号：通过SEO关键词布局，单账号月纯利1万+，内测10人8人单日盈利300+'
  - '**边界条件**'
  - '- 前期1-3个月无正反馈，需极强执行力支撑“坚持更新”'
  - '- 仅适合“给工具/给方法”高客单价或高复购业务，低客单泛娱乐内容ROI不划算'
  - '- 关键词挖掘需真实洞察用户语言（如用“举手”规则爬取真实提问），不能凭空臆造'
  - '...'
  sources:
  - paper: docs/202301-02/20230207_11.md
    role: origin
  - paper: docs/202301-02/20230207_06.md
    role: improve
  excerpts:
  - 长期主义者，大部分都用SEO思维在做流量，而追风者往往是用爆款思维组流量，彻底理解这一点，起码受益10年
  - 一个用户愿意通过各种关键词找到你的信息，进而添加到你的私域里。这样来的1个人会比你平台推荐来的100个人更有价值。
  - 先辛苦一阵子，根据你的切割的细分领域，用心布局300-500个长尾关键词。每个关键词写一个解决方案...大概1个月后，你就会发现你每天都有人添加你
  - 与其漫无目的瞎猜一些款...还不如老老实实的自己先找出100款来，每一款发上3-5条笔记...基本就能选出10个左右能出单的款
- 'no': 4
  name: 逆向思考法 —— 从“变现”倒推“动作”的最小行动单元
  points:
  - '**为什么需要这个概念？**'
  - '- 正向流程（定位→内容→流量→产品→变现）易陷入“自嗨式创作”，做大量无效动作'
  - '- 新手资源有限，必须聚焦于直接产生收入的关键路径，避免资源分散'
  - '- 市场需求不确定，先验证“有人买单”再投入生产，降低试错成本'
  - '**核心定义**'
  - '- 以结果为导向，逆向拆解步骤：变现 → 定位 → 产品 → 内容 → 流量'
  - '- 先找买家/需求，再找/造产品，最后才考虑内容和流量如何承接'
  - '- 确定最小行动单元（MVP）：能在最短时间、最低成本验证商业闭环的最小动作集合'
  - '**关键性质**'
  - '- 目标导向性：每个动作必须指向变现，无直接关联的动作坚决砍掉'
  - '- 快速验证性：强调“先卖想法，后做产品”，用预售/意向金验证真需求'
  - '- 资源聚焦性：将有限精力集中在“匹配度最高”的项目上，而非盲目All in新赛道'
  - '**典型例子**'
  - '- 外卖CPS项目：先有公众号流量资源 → 锁定“外卖红利”变现路径 → 对接美团/饿了么联盟 → 首日盈利100+ → 3个月月利润20万+'
  - '- 副业课程：先验证社群付费意愿 → 再录制课程交付 → 3个月盈利100万+'
  - '- AI绘画小程序：因预算超预期、无执照、周期长、流量依赖公众号，理性止损放弃'
  - '**边界条件**'
  - '- 仅适用于“已有部分资源/能力”阶段，零资源新手需先积累最小资源包'
  - '- 逆向拆解依赖对商业模式的认知深度，认知不足会导致倒推路径错误'
  - '- 过度功利可能忽视品牌长期资产积累，需在“快速变现”与“品牌沉淀”间动态平衡'
  - '...'
  sources:
  - paper: docs/202301-02/20230207_05.md
    role: origin
  - paper: docs/202301-02/20230207_09.md
    role: apply
  - paper: docs/202301-02/20230207_06.md
    role: improve
  excerpts:
  - 正常流程：定位→内容→流量→产品→变现，我们可以以结果倒推内容：变现→定位→产品→内容→流量。先找买家，再找产品！
  - 比如最重要的是先卖产品的想法，而不是做产品。如果聊了 100 个人，只有几个人买，肯定有问题；如果 20-30 个人购买，交了预售金，那这个不确定因素就解决了。
  - 第一步：盘点自己手里有哪些资源...第二步：拆解项目需要的资源...第三步：评估资源匹配度
  - 因预算远超预期、无个体和公司执照、工期15-20天对热点太长、流量99%来自公众号等原因放弃AI绘画小程序开发
- 'no': 5
  name: 资源匹配度评估 —— 用“手里的牌”决定“打什么局”
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常“严重低估已有项目，过分高估新项目”，导致频繁切赛道、资源归零'
  - '- 项目成败取决于“资源匹配度”而非“项目好坏”，同一项目资源匹配者赚钱，不匹配者亏钱'
  - '- 明确自身资源包（粉丝、经验、软件、团队、案例、渠道），能快速筛选高胜率项目'
  - '**核心定义**'
  - '- 资源盘点：系统梳理自身现有的有形/无形资产，包括流量资产、操作经验、技术工具、人脉团队、成功案例等'
  - '- 项目拆解：将目标项目拆解为“前端流量获取、中端转化交付、后端变现复购”所需的关键资源清单'
  - '- 匹配度评估：对比“手里有”与“项目需”，匹配度>80%可直接启动，50-80%需补齐关键资源，<50%坚决放弃'
  - '**关键性质**'
  - '- 动态性：资源包随项目推进积累扩大，匹配度可随时间提升，需定期复盘更新'
  - '- 非对称性：某些关键资源（如核心渠道、独家货源、信任背书）具有“一票决定”权重'
  - '- 复利性：高匹配度项目执行过程本身在积累新资源，形成“资源-项目-更强资源”正循环'
  - '**典型例子**'
  - '- 作者：公众号经验+流量+人+项目 = 匹配“外卖CPS/副业课程”=100%匹配 → 3个月赚100万、总利润300万+'
  - '- 反面：非刚需项目（链条长、无核心资源匹配）连续创业4次失败、负债百万'
  - '- 招商加盟：必须先跑通单店模型（自有资源验证），再开放加盟（复制资源包），否则是收割加盟费'
  - '**边界条件**'
  - '- 资源盘点易受“沉没成本”偏见，高估沉没资产价值，低估新资源获取难度'
  - '- 匹配度高不等于必成功，执行力、时机、运气等外部变量仍占重要权重'
  - '- 早期资源极少时，匹配度评估参考价值低，需先通过“打工/兼职/小项目”积累种子资源'
  - '...'
  sources:
  - paper: docs/202301-02/20230207_09.md
    role: origin
  - paper: docs/202301-02/20230207_11.md
    role: apply
  - paper: docs/202301-02/20230207_06.md
    role: critique
  excerpts:
  - 很多人都有一个误区，那就是严重低估已有项目，同时过分高估新的项目
  - 应该结合自身的资源，梳理新项目的资源和自己资源的匹配度，再决定重新做哪个项目
  - 我以自己举例……那么我的资源就是：公众号经验+流量+人+项目=找到适合公众号变现的方法就可以直接开始
  - 打造一个好的产品，需要先解决单店模型的问题，等到单店模型跑通之后，再开始批量化复制，实现规模化增长
- 'no': 6
  name: 盈利验证与放大法 —— 先跑通1块钱，再复制100万遍
  points:
  - '**为什么需要这个概念？**'
  - '- 追求完美导致迟迟不上线，或上线即重资产投入，死亡率极高'
  - '- 商业模式核心不确定性在于“能否卖出去”，而非“能不能做出来”'
  - '- 单点盈利模型一旦跑通，边际复制成本极低，规模化收益呈指数级增长'
  - '**核心定义**'
  - '- MVP先卖后做：用最简单方式（预售页、人工服务、拼凑交付）完成第一笔交易，验证“有人愿付费”'
  - '- 盈利模型标准化：将跑通的“流量来源、转化话术、交付SOP、客单价结构”固化为可复制的操作手册'
  - '- 矩阵化放大：把月入3000的单号/单店/单人复制30遍，通过数量换确定性，实现规模化收益'
  - '**关键性质**'
  - '- 速度优先：完成比完美重要，第一单验证比完美产品重要'
  - '- 可复制性：核心判断标准是“能否一对多、能否快速复制、能否标准化SOP”'
  - '- 杠杆放大：利用劳动力杠杆（招兼职）、技术杠杆（RPA/软件）、资金杠杆（投放）实现指数增长'
  - '**典型例子**'
  - '- 抖音带货：纯靠“怼量”发拼接视频，点赞>500仅10条、大部分个位数，但累计带货10万+'
  - '- 美团电商：首店MVP仅花80元跑通，2个月扩展到30家店，单店月利润6k-12k（零运营未优化）'
  - '- 视频号店群：7店日销7858元，单店日均1122元，毛利30%，精细化单店月利1万，10店即10万'
  - '- 外卖CPS：首日盈利100+，2个月月利10万，3个月突破20万/月，总盈利200万+'
  - '**边界条件**'
  - '- 单点模型未跑通前，任何放大动作都是放大亏损（如未盈利即招商加盟属于收割)'
  - '- 矩阵化需平台规则允许（账号主体、流量分配、风控红线），否则面临批量封号风险'
  - '- 规模化后管理复杂度指数上升，需同步建立OKR、三会一层、股权激励等治理体系'
  - '...'
  sources:
  - paper: docs/202301-02/20230207_05.md
    role: origin
  - paper: docs/20230207_06.md
    role: apply
  - paper: docs/202301-02/20230207_11.md
    role: improve
  excerpts:
  - 不要追求完美，用最快速度跑通盈利模型。（先用最简单的方式去验证商业模式是否正确，也就是完成第一单）
  - 把 1 个号做到月入 10 万很难，但是把月入 3000 的号复制 30 多遍不难，把盈利的事情重复做。
  - 在保证视频质量的前提下，量怼的越多，爆单的概率肯定就越大...纯靠怼量...累计带货10万+。
  - 第一家店跑通最小MVP仅仅花费了80元...类目不同单店月利润6k-12k（零运营未优化）
  - 我们提出了一个最新的标准：1）各种门店模型要测算到位；2）单店模型的财务模型要健康；3）要实现一定范围内的区域模型验证；4）该区域模型的复制性和财务模型要达标。
