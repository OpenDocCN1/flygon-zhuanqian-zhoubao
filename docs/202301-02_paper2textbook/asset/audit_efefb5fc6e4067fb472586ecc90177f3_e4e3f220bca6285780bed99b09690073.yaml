unsupported_claims:
- location: ch3.3
  claim: “典型例子：一键解封工具。作者提到，可以设想一个“一键解封”工具——用户提交名字即可申请解封——先写一篇介绍该工具的软文，有人付费咨询后再找现成软件或开发（《个人开发者：卖空气与软文先行》，P001）。”
  reason: 素材中确实提到了“一键解封”工具的玩法，但并未明确提及“有人付费咨询后再找现成软件或开发”这一环节。原素材描述为“弄一个APP告诉你，你下载这个APP，填上名字，就可以申请解封！”，没有具体描述交付环节的策略。
- location: ch3.9
  claim: “作者原话更直接：'如果项目前面流量的问题没有搞定的话，都没有用！'（《副业拆解方法论》，P002）”
  reason: 素材中并未直接找到此句引文。相近的表述是：“...如果项目前面流量的问题没有搞定的话，都没有用！”，但这句话出自《万字复盘》一文，并非文中引用的《副业拆解方法论》（P002）中的直接引语。
