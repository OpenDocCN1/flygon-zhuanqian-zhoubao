units:
- 'no': 1
  name: 时代红利 —— 让个人能力乘上“电梯”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人容易把靠风口赚到的钱误认为是自己实力强'
  - '- 看不清红利边界，会在风口过后裸泳、甚至加杠杆翻车'
  - '- 需要一把“尺子”量清：这笔钱到底几成是风给的、几成是我自己挣的'
  - '**核心定义**'
  - '- 时代红利：不依赖个人深度积累、仅因身处特定风口期（平台流量爆发、政策松绑、消费习惯迁移）就能获得的超额收益'
  - '- 个人能力补偿：扣除时代红利后，凭借专业技能、认知深度、执行力真正创造并留住的那部分收入'
  - '**关键性质**'
  - '- 占比极高：素材反复强调“每一百块钱里九十块是红利”，甚至指出“商业英雄只是平台红利的产物”'
  - '- 周期性与不可控：红利窗口有开有合（如淘系、抖音、视频号、美团电商各有生命周期），个人无法延长'
  - '- 易混淆：不刻意区分，就会把“运气好”当成“本事大”，导致战略决策失真（如盲目 All in、拒绝止损）'
  - '**典型例子**'
  - '- 淘系红利期：作者亲历“上半年几个月淘系红利期”，原以为是实力赚钱，复盘后发现全是红利的钱'
  - '- 视频号直播带货：半年月入 3w+、21 天赚 11w，作者判断“未来两年仍有大机会”，实为平台扶持期红利'
  - '- 美团电商冷启动：入驻早期 30 家店、单店月利润 6k-12k（零运营未优化），纯属平台铺货期红利'
  - '**边界条件**'
  - '- 红利不可复制、不可继承：换个平台、换个时间点，同一套打法可能直接归零'
  - '- 只有“能力补偿”部分才能跨周期复利：如写作复利、私域运营 SOP、选品方法论、股权设计框架'
  - '- 判断标准：把平台流量关掉、把品牌光环摘掉、把热门关键词屏蔽后，还能不能出单？能，才是能力'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: improve
  - paper: docs/202301-02/20230207_06.md
    role: apply
  excerpts:
  - 可能所有夸张，我们所赚的每一百块钱，有九十块钱是时代红利，仅有十块钱是时代对我们个人能力的补偿，英雄只是时势的产物。
  - 商业英雄只是平台以及市场红利的产物。今天所有的大佬，都是在某一个时间，抓到了某一个市场红利，再匹以执行力，就赚到了第一桶金。
  - 以前总以为自己足够努力赚的是实力的钱，经历了上半年几个月淘系红利期...才明白我们赚的钱都是红利的钱，这是今年最大的感悟之一。
- 'no': 2
  name: 财富积累四阶段 —— 给人生装上“分级变速箱”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人想跳跃式致富：刚入职想当老板、刚有点积蓄想投资、不懂业务想搞资本'
  - '- 阶段混淆会导致“用打工心态做老板事”或“用投机心态做实业”，必死无疑'
  - '- 需要一张清晰的“地图”，告诉自己当下在哪一层、下一层的门槛是什么'
  - '**核心定义**'
  - '- 第一阶段·出卖劳动力：用时间换钱，核心是“扩广度”——尝试不同行业、岗位、职业，积累见识与技能'
  - '- 第二阶段·一份时间多次卖：打造可复制产品（写书、卖课、软件、内容），实现边际成本趋零'
  - '- 第三阶段·购买他人时间：成为老板，用系统、流程、团队放大自己，核心是“管人、管事、管钱”'
  - '- 第四阶段·钱生钱：资本配置者，不再亲自操盘业务，靠资源整合、投资组合获取收益'
  - '**关键性质**'
  - '- 严禁跳跃：必须依次跃迁，每一阶段都是下一阶段的前置条件（如没跑通 MVP 就招人、没赚到钱就投资）'
  - '- 对应人生四阶段：30 岁前扩广度 → 30 岁后做管理拉高度 → 寻找第二曲线 → 复制商业放大'
  - '- 阶段特征可量化：收入结构中“主动收入 vs 被动收入”占比、时间花费在“执行 vs 决策”占比'
  - '**典型例子**'
  - '- 作者亲历：打工 → 做自媒体/课程（一份时间多次卖） → 招人做捡漏群/视频号店群（购买他人时间） → 股权设计/投资项目（钱生钱）'
  - '- 副业转老板路径：“拿出部分收入招人干重复基础活 → 释放精力成老板 → 赚钱杠杆就有了”'
  - '**边界条件**'
  - '- 并非人人都能走到第四阶段：绝大多数人止步于第一、二阶段，核心卡点在“能否跑通可复制模型”'
  - '- 阶段倒退风险：不懂业务却想当投资人（跳过第三阶段）、不懂管理却盲目扩团队（跳过第二阶段）'
  - '- “扩广度”不等于频繁跳槽：必须是在“有意识复盘、沉淀可迁移能力”前提下的尝试'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/202301-02/20230207_06.md
    role: improve
  - paper: docs/202301-02/20230207_05.md
    role: apply
  excerpts:
  - 财富积累分为四个阶段，第一：出卖劳动力；第二：一份时间多次卖；第三：购买他人时间；第四：钱生钱。
  - 人生四个阶段，第一阶段：初入职场（30 岁以前）……第二阶段，中年危机，在这个阶段一定要去做管理……第三个阶段……寻找自己的第二曲线……第四个阶段……组建团队给它放大。
  - 拿出你现在收入的一部分……把重复的基础的活整理出来，安排给其他人……一旦你习惯了这样的方式，不断的通过花钱找人帮你干活，你就开始成为一个老板，赚钱的杠杆就有了。
- 'no': 3
  name: 流量价值公式 —— 把“虚荣指标”换成“交易货币”
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者极易被“阅读量 10w+”“播放量百万”迷惑，误以为有流量就有生意'
  - '- 平台给的 UV/PV 只是“连接”，不等于“交易”；不把流量拆解到“相关性”“信任度”，就算不出 ROI'
  - '- 需要一个可计算、可优化、可对比的公式，指导投流、选品、内容、私域每一步动作'
  - '**核心定义**'
  - '- 流量价值 = 流量规模 × 交易相关性 × 信任度'
  - '- 流量规模：曝光量、UV、播放量，只解决“连接”问题'
  - '- 交易相关性：受众画像与产品的匹配度（如卖养生茶的流量全是 18 岁学生，相关性≈0）'
  - '- 信任度：连接带来的“安全感”，决定转化率与客单价（如私域好友 vs 直播间路人）'
  - '**关键性质**'
  - '- 乘法模型：任意一项为 0，总价值归 0；相关性、信任度是杠杆，规模只是底座'
  - '- 可拆解、可干预：横向切片看渠道、趋势、动作；纵向切片看需求、路径、业务价值'
  - '- 公私域差异本质是信任度差：公域流量信任度低、衰减快；私域流量信任度高、可复购、可裂变'
  - '**典型例子**'
  - '- 视频号直播+私域：纯直播 ROI 2.5，加入私域后 ROI 提升至 3.5-4.5，核心是把低信任度公域流量转化为高信任度私域资产'
  - '- 捡漏群：用“原价 1-3 折”极致性价比建立信任，配 30-50 个演员造氛围，单群月利润 1000+、生命周期 2 年'
  - '- 抖音本地生活：POI 加热是“规模”，爆品是“相关性”，好评率维护是“信任度”，缺一不可'
  - '**边界条件**'
  - '- 规模虚大：刷量、买僵尸粉、蹭无关热点，规模↑但相关性↓、信任度↓，总价值反降'
  - '- 相关性陷阱：精准流量太小（如日搜 10 人），规模不足以支撑变现，需“广撒网+精准筛”平衡'
  - '- 信任度不可速成：私域信任需“破冰-诊断-方案-信任-成交”五步法、需“有间隔的重复次数”累积'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/20230207_03.md
    role: apply
  - paper: docs/202301-02/20230207_06.md
    role: apply
  excerpts:
  - 流量价值=流量规模×交易相关性×信任度……流量规模只解决连接的问题，不解决交易的问题。
  - 横向你要看：这 200 个 UV 从哪里来？有哪些渠道？哪些涨了？哪些跌了？趋势如何？原因是什么？可干预的运营动作是什么？纵向你要看：UV 的背后是用户……
  - 整个项目的 5 句核心心法：1. 定位即人群、2. 人群即内容、3. 内容即流量、4. 流量即转化、5. 转化即模式。
- 'no': 4
  name: 私域单客价 —— 从“单次切菜”到“养牛奶牛”
  points:
  - '**为什么需要这个概念？**'
  - '- 电商思维习惯看“客单价”，一锤子买卖、拼流量、拼转化、拼复购成本'
  - '- 私域本质是关系，关系的价值是“长期、累积、复利”的，用客单价会严重低估用户价值'
  - '- 需要一个指标倒逼运营：从“搞一次大促”转向“设计用户全生命周期”'
  - '**核心定义**'
  - '- 单客价 = 单个用户在整个生命周期内贡献的总销售额（GMV）'
  - '- 核心公式：单客价 = 客单价 × 购买频次 × 生命周期（年）'
  - '- 运营杠杆：拉长生命周期、提高复购频次、提升客单价，三者缺一不可'
  - '**关键性质**'
  - '- 思维倒逼：关注单客价，就不敢“收割完拉黑”、不敢“卖烂货”、不敢“忽视售后”'
  - '- 可量化运营：进粉率 60% 合格、月产值 8-15 元、年产值衰减前 3 个月按 80% 递减、ROI 从 2.5 升到 4.5'
  - '- 与“流量价值公式”联动：私域流量的高信任度、高相关性，正是通过高单客价变现的'
  - '**典型例子**'
  - '- 视频号直播引流：客单价 150、进粉率 60%、月产值 8-15 元，年产值 60 元，私域让 ROI 从 2.5→3.5→4.5'
  - '- 捡漏群：用“演员氛围+精推文案+4-6 次催单”把单群日产出从 0 做到 30 元，千群日赚 3 万'
  - '- 胎毛纪念品：2 万精准宝妈私域，7000 单产品变现 + 副业培训 + 无货源 + 淘客，总变现超 100 万'
  - '**边界条件**'
  - '- 非标品、低频品（如装修、买房）单客价模型失效，需改用“转介绍系数”“终身价值 LTV”'
  - '- 私域运营成本（人力、工具、风控）随规模非线性上升，单客价必须覆盖边际运营成本'
  - '- 平台风控红线：频繁营销、诱导分享、违规引流会导致封号，单客价归零，需“合规优先”'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/20230207_03.md
    role: improve
  - paper: docs/202301-02/20230207_06.md
    role: apply
  excerpts:
  - 电商有个'客单价'的概念，而在私域流量运营的思维下，真正值得关注的不是'客单价'，而是'单客价'，就是一个消费者总共贡献了多少销售额。
  - roi2.5 也就是我 100 万的营业额，需要有 40 万的广告投放，那么在这 40 万的投放算到私域中，我将额外有 100 万×60%×60/150=24
    万的私域营业额……这么一算我的 roi 就从 2.5 提升到了 3.5。
  - 回本之后，单群单日产出 30 来讲，假设有 100 个群，一天就是 3000 利润，有 1000 个群，一天就是 30000，那么一个月就是 90W。
- 'no': 5
  name: MVP 先卖后做 —— 用“预售单”代替“完美产品”
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者最爱“闷头造产品”，造完才发现没人买，沉没成本极高'
  - '- 传统验证（问卷、访谈）用户会骗你、也会骗自己，唯有“真金白银下单”才是硬真相'
  - '- 需要一套“最小成本、最快速度、最硬指标”的验证标准流程'
  - '**核心定义**'
  - '- MVP（最小可行产品）验证核心：不造产品，先卖“想法/方案/预售单”'
  - '- 通过标准：聊 100 人，20-30 人付预售金 → 需求成立；仅几人买 → 直接否决'
  - '- 目标：在短时间内并行测试几十个产品，用“筛选”代替“培养”'
  - '**关键性质**'
  - '- 完成比完美重要：第一家美团店跑通 MVP 仅花 80 元、两个月扩到 30 家店'
  - '- 验证维度：支付意愿（核心）、支付能力、决策链路、交付可行性'
  - '- 失败成本极低：无库存、无开发、无招聘，仅需文案、着陆页、收款码'
  - '**典型例子**'
  - '- AI 绘画小程序：因预算超预期、无执照、工期长、流量依赖公众号，理性止损放弃开发'
  - '- 外卖 CPS + 副业课程：资源梳理后 3 个月赚 100 万、总利润超 300 万，验证“先跑通再放大”'
  - '- 闲鱼倒爷：5 台音响 1400 买入 2250 卖出、20 个 U 盘 300 买 550 卖、72 个台灯旺季日出 9 单'
  - '**边界条件**'
  - '- 重资产、强合规、长交付周期项目（如医疗器械、重工程）不适用“先卖后做”'
  - '- 预售承诺必须兑现：收钱不发货、发货不符，会透支信任、触犯消保法'
  - '- “20-30 人付费”阈值因客单价而异：高客单价（万级）可能 3-5 单即验证，低客单价需更多样本'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/20230207_03.md
    role: apply
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - 比如最重要的是先卖产品的想法，而不是做产品。如果聊了 100 个人，只有几个人买，肯定有问题；如果 20-30 个人购买，交了预售金，那这个不确定因素就解决了。
  - 第一家店跑通最小MVP仅仅花费了80元...截止到10月美团电商全类目商家仅2000多家，我们应该是百货类目入驻的全国前300名。
  - 因预算远超预期、无个体和公司执照、工期15-20天对热点太长、流量99%来自公众号等原因放弃AI绘画小程序开发——理性评估门槛后选择止损而非盲目投入。
- 'no': 6
  name: 商业拆解复制法 —— 像“拆玩具”一样拆生意
  points:
  - '**为什么需要这个概念？**'
  - '- 90% 的人做项目靠“拍脑袋”、“跟风”、“听课”，不懂生意的底层结构'
  - '- 成功的生意表面千变万化，底层只有“流量→转化→交付→复购”四块拼图'
  - '- 需要一把“手术刀”，把别人赚钱的项目切开，看清每一块怎么运作、能不能换成我的资源'
  - '**核心定义**'
  - '- 商业拆解：将一个已验证盈利的项目，按“前端获客（内容/投流/渠道）→ 中端转化（私域/直播/社群/销售 SOP）→ 后端交付（产品/服务/供应链）→
    财务模型（客单价/毛利/复购/ROI）”四层拆解'
  - '- 复制判断：货源非独家、场景验证有需求、核心动作可 SOP 化、自己资源能覆盖关键环节'
  - '- 核心口诀：“同行是最好的老师，抄同行是最快途径”'
  - '**关键性质**'
  - '- 拆解维度标准化：流量来源、内容模版、钩子设计、引流话术、成交话术、交付流程、供应链结构、财务测算表'
  - '- 套话/做局：以客户身份咨询同行、混同行社群、买同行产品、录同行直播，把“隐性知识”显性化'
  - '- 微创新：在拆解基础上做“材质套利、热点嫁接、包装升级”，打造差异化护城河'
  - '**典型例子**'
  - '- 闲鱼倒爷：拆解“低买高卖”底层逻辑 → 市场调研（品牌/标品/销量/价格/避坑类目） → 关键词找货（抵账/抵债/批量出） → 合作思维谈判'
  - '- 小红书资料号：买同行资料 → 图文制作（引流类/干货类） → 10 种引流方法转私域 → 单价 19.9-199、转化 30-40%'
  - '- 美团电商：发现案例 → 80 元跑通 MVP → 梳理流程团队入场 → 以史为鉴找共性 → 复盘扩张'
  - '**边界条件**'
  - '- 拆解≠抄袭：核心是“借鉴模式、重组要素”，而非“复制文案、盗用素材、侵犯商标”'
  - '- 幸存者偏差：只能拆解“还活着且赚钱”的项目，死掉的项目看不到、幸存的可能靠运气'
  - '- 自身资源匹配度：拆解再透彻，若自己无流量能力、无供应链、无交付团队，照样跑不通'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/20230207_06.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - 同行就是最好的老师，抄同行永远是做项目最快的途径，能避开多数弯路和无用功。
  - 每个项目都有关键词，通过关键词在各个推广渠道搜索这个项目的关键词就一定可以找到同行。
  - 我们以客户的角度去思考如果我想要买这个产品，我会在哪去搜关键词，自然也可以找到同行的流量渠道。
- 'no': 7
  name: 刚需生意观 —— 只做“用户离不开”的生意
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者易陷入“伪需求陷阱”：用户说要、调研说好、样品夸赞，上线却无人买单'
  - '- 非刚需链条长、决策慢、复购低、抗风险弱，稍有风吹草动即崩盘'
  - '- 需要一把“刚需检测仪”，在投入前就能判断：这需求到底是不是“痛到必须解决”'
  - '**核心定义**'
  - '- 刚需：用户不解决会难受、会损失、会焦虑、会掉层皮；解决后立刻能感知价值、愿意立即付费、甚至主动催单'
  - '- 非刚需：好像有用、锦上添花、改善型、情绪型、社交型，决策链长、价格敏感、易替代'
  - '- 判断标准：① 是否高频/必需 ② 痛点是否具象可量化 ③ 替代成本是否极高 ④ 是否有强外部驱动（政策、季节、生理）'
  - '**关键性质**'
  - '- 项目本性成就人：作者 10 年创业 4 次失败、负债百万，最终靠“副业+减肥”两个刚需上岸'
  - '- 刚需天然自带流量、转化、复购，运营成本极低，不用“推”也能动'
  - '- 刚需可跨周期：副业（焦虑常在）、减肥（身材焦虑常在）、健康（生存刚需）、教育（阶层跃升刚需）'
  - '**典型例子**'
  - '- 副业项目：中年危机、裁员焦虑、通胀压力，用户“不搞副业睡不着觉”，天然刚需'
  - '- 减肥/健康：春节后、夏天前、体检后、生病后，强外部驱动，复购率极高'
  - '- 视频号本地生活：必须有“爆品”（刚需单品），无爆品强推=赌博，有爆品才配做推广'
  - '**边界条件**'
  - '- 伪刚需陷阱：用户“说”很痛、实则“不痛不痒”（如某些保健品、知识付费），需用“预售/定金”验证'
  - '- 刚需会迁移：今日刚需（如共享单车）明日成鸡肋，需持续监测“用户离开后会有什么后果”'
  - '- 刚需≠大众需求：超垂直细分领域（如罕见病护理、特种设备操作）虽人群小，但刚需度极高、溢价极高'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/20230207_03.md
    role: apply
  - paper: docs/202301-02/20230207_11.md
    role: improve
  excerpts:
  - 我现在的理念就是非刚需的项目都不做了，我现在手上在循环的项目，也只有副业和减肥两个事情。
  - 不够刚需的事情现在一律不敢做了…其中的原因就是不够刚需，链条太长了，你认为你推的动，结果就是挣不到钱…最终是项目的本性成就人，而不是人去推动一个不够刚需的项目。
  - 一定不能做逆流而上的事情，没有爆品去做强推，转化会一言难尽，甚至适得其反。铁子们这一块就遵循一个原则，没有爆品就不做抖音推广的动作，否则一切动作就是在赌博。
- 'no': 8
  name: 杠杆效应 —— 让“一份时间”卖无数次
  points:
  - '**为什么需要这个概念？**'
  - '- 出卖时间（打工、接单、咨询）天花板极低：一天 24 小时、精力有限、不可复制、一旦停手收入归零'
  - '- 普通人翻身唯一路径：构建“睡后收入”资产，实现边际成本趋零、规模无上限'
  - '- 需要识别、选择、建设适合自己的杠杆类型，而非盲目“多干活”'
  - '**核心定义**'
  - '- 纳瓦尔杠杆三类：劳动力杠杆（雇人）、资本杠杆（投钱）、零边际成本复制产品杠杆（代码、媒体、内容、课程、SOP）'
  - '- 内容杠杆：写作、视频、音频、课程、模板、工具，一次生产、无限分发、复利累积'
  - '- 核心公式：收入 = 杠杆系数 × 单位时间产出，杠杆系数决定上限'
  - '**关键性质**'
  - '- 杠杆可叠加：内容吸粉（媒体杠杆） → 私域成交（销售杠杆） → 招人运营（劳动力杠杆） → 再投资（资本杠杆）'
  - '- 门槛从高到低：资本杠杆需本金、劳动力杠杆需管理、内容杠杆仅需技能+坚持，最适合普通人起步'
  - '- 杠杆需“执行力”激活：宝妈 4 个月加 4000 好友被 7 万收购、作者因执行力被邀请进生财办公室，执行力本身可变现'
  - '**典型例子**'
  - '- 写作复利：565 天日更，完成课程、付费社群、个人咨询三个闭环，微信好友 6 倍增长'
  - '- 视频号矩阵：3 个中医号数月变现 10w，自动化内容生产+矩阵靠量获取免费流量'
  - '- AI 绘画小程序：零边际成本接口调用，月收益 5w+，公式：收益 = 使用人次 × (CPC - 接口成本)'
  - '**边界条件**'
  - '- 杠杆不是“躺赚”：前期需巨大投入（内容杠杆需长期高频产出、劳动力杠杆需极强 SOP 和管理）'
  - '- 平台依赖风险：内容杠杆建在公域平台上，算法变、规则变、账号封，杠杆瞬间失效，必须“公域引流、私域沉淀”'
  - '- 杠杆质量＞数量：1 个高信任度私域 IP > 100 个低粘性公域号；1 套成熟 SOP > 10 个混乱流程'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: apply
  - paper: docs/20230207_03.md
    role: apply
  excerpts:
  - 想要获得财富，就必须充分利用杠杆效应。商业杠杆来自资本、劳动力和复制边际成本为零的产品（代码和媒体）。
  - 依靠出租自己的时间是很难致富的，要想获得财富，就要充分利用杠杆效应，比如劳动力，自媒体（无限放大自己的影响力），和复制边际成本几乎为零的产品（软件，课程，虚拟产品等）。
  - 把 1 个号做到月入 10 万很难，但是把月入 3000 的号复制 30 多遍不难，把盈利的事情重复做。
- 'no': 9
  name: 渣男思维做内容 —— 用“峰终定律”钩住用户
  points:
  - '**为什么需要这个概念？**'
  - '- 传统“干货满满、全流程教学”内容：用户看完觉得“好厉害”，转头就忘，不关注、不转化'
  - '- 算法推荐机制下，完播率、互动率、关注转化率才是核心指标，而非“内容质量”'
  - '- 需要一种“反直觉”的内容策略：少给、留白、戳中即停、多平台撒网'
  - '**核心定义**'
  - '- 撩完就跑：基于峰终定律，在用户情绪最高点（痛点被戳中、痒点被挠爽）戛然而止，制造“意犹未尽”，倒逼关注、私信、购买'
  - '- 广撒网：垂直的是“人群”而非“题材”，在多个圈子、多个平台、多种形式发布，提高命中率'
  - '- 爆款模板化：爆过的内容一定能再爆，建立个人爆款库，用模板持续产出，不靠灵感靠流程'
  - '**关键性质**'
  - '- 心理机制：峰终定律——体验的高峰与结尾愉悦，整体即愉悦；开头钩住、结尾升华，中间无所谓'
  - '- 执行标准：标题/封面/开头 3 秒必须“戳中”；正文只给“目录/名单/金句/结果”，不给“过程/教程/细节”；结尾抛钩子（加微信领完整版/看下集）'
  - '- 平台适配：小红书（图文/笔记）、抖音/视频号（短视频/直播切片）、公众号（长文/SEO）、微头条（争议/共鸣）'
  - '**典型例子**'
  - '- “有钱人生活”视频：开头无边泳池、结尾美妙画面，中间剪辑垃圾模糊，依然大量点赞'
  - '- “做个人 IP 的 40 个 APP”：只列名字、不教用法、不给下载，戳中痛点即停，引发大量关注咨询'
  - '- 作者实操：20 分钟出 10 万赞藏爆文，1 万粉变现 20 万；小红书 3 个月 0 到 8000 粉、变现 5 万'
  - '**边界条件**'
  - '- 避免“标题党”红线：戳中后必须给最小价值（名单、金句、思路），纯骗点击会被平台判罚、用户拉黑'
  - '- 不适用于“强交付型”内容：编程教程、手工教学、学科辅导等需完整路径的场景，缺失步骤即投诉'
  - '- 长期需沉淀“方法论层”内容：纯“撩完就跑”无法建立专业护城河，需配合“内容价值金字塔”的第 3 层（给方法/建 IP）'
  sources:
  - paper: docs/202301-02/20230207_05.md
    role: origin
  - paper: docs/202301-02/20230207_06.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - 做渣男第一点：撩完就跑。戳痒点，意犹未尽。有个定律，叫做峰终定律：如果在一段体验的高峰和结尾，体验是愉悦的，那么对整个体验的感受就是愉悦的。咱们撩到用户的痒点就停，峰终定律，在情绪最高点停止，才能让人意犹未尽，印象最好。
  - 做渣男第二点：广撒网 渣男怎么养鱼的？当然是混多个圈子，他们不止在一个圈子里寻找自己的猎物。所以，咱们做内容也需要广撒网，提高自己的内容命中率。
  - 爆过的内容一定是可以再爆的，内容创作不要靠灵感，要靠爆款模板！
- 'no': 10
  name: 内容价值金字塔 —— 从“逗乐”到“授渔”的三层跃迁
  points:
  - '**为什么需要这个概念？**'
  - '- 大量创作者困在“娱乐层”：数据好看（点赞高、播放高），变现极难（粉丝粘性低、付费意愿弱）'
  - '- 不清楚内容分层，就无法有意识地从“蹭流量”进化到“品牌资产”'
  - '- 需要一个清晰的“进阶地图”，指导内容策略从工具型向方法论型跃迁'
  - '**核心定义**'
  - '- 第一层·给娱乐：情绪价值（搞笑、剧情、颜值、猎奇），换注意力，难变现，属于“流量奶牛”非“商业资产”'
  - '- 第二层·给工具：实用价值（资料包、模板、工具、清单、避坑指南），换信任，可引流、可低客单变现'
  - '- 第三层·给方法：认知价值（方法论、体系、框架、心法、SOP），换权威，打造个人 IP 护城河、高客单、高复购'
  - '**关键性质**'
  - '- 价值递增、变现难度递减、用户粘性递增、抗周期能力递增'
  - '- 核心逻辑：价值交换——你给什么层级的价值，就收获什么层级的用户关系'
  - '- 可组合：头部用娱乐破圈、腰部用工具留存、核心用方法变现，形成内容漏斗'
  - '**典型例子**'
  - '- 小红书资料号：发“整理好的考研资料/副业资源库”（给工具）→ 引流私域卖“考研规划服务/副业训练营”（给方法）'
  - '- 作者 IP：日更写作（给工具/练习）→ 付费社群/课程/咨询（给方法）→ 565 天完成三个变现闭环'
  - '- 超垂直 IP：布局 300-500 个长尾关键词，每个词写一个解决方案（给工具/方法）→ SEO 精准获客、日均主动咨询'
  - '**边界条件**'
  - '- 非互斥：同一账号可同时发三层内容，但比例决定商业模型（娱乐>70% 难变现、方法>30% 才是 IP）'
  - '- “给方法”门槛高：需真实战绩、体系化沉淀、持续迭代，否则易沦为“卖课割韭菜”被平台打击'
  - '- 平台偏好不同：抖音/视频号偏娱乐+工具，小红书/公众号/知识付费平台偏工具+方法'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - ①给娱乐：搞笑号、剧情号，他们的数据很好，用情绪价值交换了用户的注意力，但是很难变现。
  - ②给工具：给工具满足更加实用性的需求…最常见的是给整合资料，帮用户节省时间…这就是当下很火的虚拟资料项目。
  - ③给方法：通过给方法，解决问题，抢占专业认知，打造个人 IP。
- 'no': 11
  name: 股权顶层设计四要素 —— 给合伙关系装上“安全阀与加速器”
  points:
  - '**为什么需要这个概念？**'
  - '- 合伙创业最怕“钱没赶到、人先散了”：股权模糊、控制权不清、退出无门、贡献难算'
  - '- 早期不谈股权、不签协议、不设机制，后期估值大时必撕逼、进法院、公司死掉'
  - '- 需要一套“标准化、可量化、可落地、可进化”的股权设计框架，在顺境把丑话说前头'
  - '**核心定义**'
  - '- 顶层控制权：谁有操盘能力、谁有责任心、谁是“好人”，谁拥有最终决策权（通常创始人持股 >51% 或 AB 股/一致行动人协议）'
  - '- 进入机制：资金型溢价进入、资源型对赌进入、技术型专利/成果进入，拒绝“送股份、分蛋糕”'
  - '- 分配机制：静态初始分配 + 动态调整（按里程碑、贡献、绩效），避免“大锅饭、养闲人”'
  - '- 退出机制：时间约束（锁定期）、回购原则（净资产/估值/协商价）、回购价格公式、竞业限制'
  - '**关键性质**'
  - '- 五步法量化：定性定量结合，把模糊的“贡献”算成具体的“股点”，全员公开、可复核'
  - '- 配套合同规范：一致行动权、期权池、分红奖励、回购权、优先清算权、领售权，股权比例只是起点'
  - '- 创始人身份本质是风险承担：对外只能有一个声音，控制权必须极度明确，不可模糊'
  - '**典型例子**'
  - '- 胖龟找房：城市合伙人模式，平台提供房源库/配房人员/带看流程，合伙人只维护用户，标准化赋能复制'
  - '- 4C 动态量化模型：创始人身份、岗位权重、时间投入、资金投入四维度打分，自评互评达成共识'
  - '- 作者警示：融资避坑——识别骗子公司（收各种费）、不盲目缴费、最好有人推荐'
  - '**边界条件**'
  - '- 无标准答案：不存在“放之四海而皆准”方案，需按行业、阶段、团队、愿景定制'
  - '- 股权≠分钱：早期股权几乎为 0，核心是锁定核心人、对齐预期、预留未来，而非当下分蛋糕'
  - '- 法律落地必需：所有机制必须固化进《公司章程》《股东协议》《期权计划》《保密协议》，口头无效'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/20230207_03.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - 做股权顶层设计时考虑的核心因素，还是顶层控制权、进入机制、分配机制、退出机制。
  - √：有操盘能力、有责任心的好人拥有公司的控制权…进入机制：资金型股东溢价进入，资源型股东对赌进入，技术型股东专利进入…
  - 在顺境时把丑话说在前面，才能避免逆境时翻脸。
- 'no': 12
  name: 内在比赛 —— 赢在潜意识认可目标的那一刻
  points:
  - '**为什么需要这个概念？**'
  - '- 无数创业者“技术行、资源有、机会来”，却在关键时刻掉链子、自我设限、恐惧成功、拖延放弃'
  - '- 外在比赛（市场、竞品、融资、运营）赢不赢，取决于内在比赛（潜意识是否真正认可目标）'
  - '- 需要一套“心法”，在潜意识层面装配“必胜信念”，而非靠意志力硬扛'
  - '**核心定义**'
  - '- 自我一（理性/一般自我）：爱分析、爱担忧、爱评判、爱设限、声音大、爱抢麦克风'
  - '- 自我二（潜意识/感性自我）：掌握技能、直觉、肌肉记忆、真实动力、不说话但决定行动'
  - '- 内在比赛：自我二是否真心认可目标？若不认可 → 潜意识拖后腿 → 外在比赛必输'
  - '**关键性质**'
  - '- 盲目自信是理性选择：在潜意识植入“我就是国王/我不可战胜”，不是盲目乐观，是战略性自我暗示'
  - '- 成功是成功之母：刻意制造、收集、唤醒“微小成功体验”，在潜意识堆叠“赢家身份”'
  - '- 俯视学习法：战略上藐视对手（我比你强）、战术上重视细节（虚心请教、像学生一样执行）'
  - '**典型例子**'
  - '- 老虎伍兹：性丑闻后潜意识“不再完美”，世界第一跌出前 100，技术没变、信念碎了'
  - '- 李宗伟 vs 林丹：技术不分伯仲，李宗伟 37 战 25 败，核心是潜意识层面的内在比赛落败'
  - '- 唤醒成功体验法：推销员早起先卖容易卖的、找好客户，制造“早早赢一把”，带动全天状态'
  - '**边界条件**'
  - '- 非“阿 Q 精神”：必须基于真实能力、真实复盘、真实微小胜利，空洞自我暗示会被现实粉碎'
  - '- 不能替代战略与执行：心态再好、模式不对、方向错、不干活，依然归零'
  - '- 需持续维护：一次成功体验会褪色，需建立“成功体验库”、定期复盘、持续喂养自我二'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  - paper: docs/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: improve
  excerpts:
  - 人有两个自我，自我一对应理性/一般自我，自我二对应感性/潜意识；任何比赛同时进行着内在比赛与外在比赛，当自我二不认可目标时就会输掉内在比赛，进而输掉外在比赛。
  - 李宗伟不是输给了林丹，是输给了自己。
  - 创业者需要的不是理性的自我怀疑，而是近乎盲目的自信与乐观——“在我的领域我就是国王”的潜意识信念是打赢内在比赛、获得外在成功的前提。
  - 成功才是成功之母；过去的成功体验会在潜意识中累积自信，推动后续更大成功。
- 'no': 13
  name: 战略即选择 —— “不做什么”比“做什么”更重要
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者贪多嚼不烂：想做所有平台、卖所有品类、服务所有人群、试所有玩法，结果样样稀松'
  - '- 资源永远稀缺（时间、精力、钱、人），不做减法，重点就没有资源，重点不强，生意就不成'
  - '- 需要一个“战略筛选器”，在海量机会中果断说“不”，把资源全部倾斜到那 1 个确定性最高的点上'
  - '**核心定义**'
  - '- 战略 = 选择 = 取舍 = 明确“不做什么”'
  - '- 目标 ≠ 战略：“帮助一万个人赚到钱”是目标；“只做副业和减肥两个刚需项目、不碰非刚需”是战略'
  - '- 战略三要素：发挥优势（筹码）、补齐短板（防御）、序列化推进（节奏）'
  - '**关键性质**'
  - '- 战略稳于执行：公司倒闭多因治理层（三会一层）战略失误，而非执行层不努力；战略不朝令夕改、慎之又慎'
  - '- 战略发挥优势：先盘点手里的“筹码”（资源、能力、人脉、数据、品牌），再决定怎么打牌'
  - '- 战略即放弃：放弃非刚需项目、放弃非核心渠道、放弃非高潜人才、放弃低毛利 SKU'
  - '**典型例子**'
  - '- 作者战略收缩：“非刚需项目都不做了，手上只循环副业和减肥”，10 年 4 次失败后的觉醒'
  - '- 喜茶开放加盟：承认直营模式跑不通（奈雪亏损 1.5 亿），顺应行业规律（蜜雪 19 亿利润），战略转型'
  - '- 美团电商：发现机会 → 80 元跑通 MVP → 梳理流程团队入场 → 以史为鉴找共性 → 复盘扩张，每步聚焦单一目标'
  - '**边界条件**'
  - '- 战略需“战术勤奋”支撑：只选方向不冲锋 = 空谈；战术勤奋不能逃避战略探索：只埋头干活不抬头看路 = 盲动'
  - '- 战略有窗口期：红利期激进投放、存量期精细运营、衰退期及时止损，同一战略不同时期执行截然不同'
  - '- 战略需“三会一层”治理护航：股东会定方向、董事会做决策、监事会查风控、高管层抓落地，内部不乱才能外部打赢'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_06.md
    role: apply
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - 什么是战略呢？就是选择。选择，其最重要的就是不做什么，而不是做什么。
  - 战略就是先审视自己手里的筹码，也就是自己的优势，然后再决定自己怎么打牌，也就是如何运用自己的优势来获得你想要的结果。
  - 公司如果经营不善或者倒闭，更多的原因，不是下面的管理层、执行层，而是治理层'三会一层'。战略，既不是一朝一夕的事，也不是朝令夕改的事。
- 'no': 14
  name: 执行力变现论 —— “笨功夫”才是最高级的护城河
  points:
  - '**为什么需要这个概念？**'
  - '- 环境推崇“聪明人”、“捷径”、“黑科技”、“信息差”，实则“执行力”才是最稀缺、最可变现、最难被复制的资产'
  - '- 很多人“有想法、有方案、有资源”，就是不干、不坚持、不复盘、不迭代，死在“知行合一”鸿沟上'
  - '- 需要重新定义“执行力”：不是盲目蛮干，而是“以结果为导向、以最小行动单元为颗粒度、以高频复盘为节奏”的持续交付能力'
  - '**核心定义**'
  - '- 执行力 = 持续把确定性动作做到位、做到果、做出结果的能力'
  - '- 可量化指标：日更天数、发文篇数、加粉人数、测款轮次、招商电话量、代码提交频次、复盘文档字数'
  - '- 执行力本身可变现：宝妈 4 个月加 4000 好友微信号卖 7 万、作者因执行力被亦仁邀请进生财办公室'
  - '**关键性质**'
  - '- 竭尽全力是最轻松的工作方式：大多数人从未竭尽全力，只要做到“够勤奋、够用心”就能超过 90% 对手'
  - '- 战术勤奋 ≠ 战略执行：用忙碌掩盖战略懒惰（不思考、不复盘、不探索）是剧毒；真执行 = 战略方向对 + 战术动作狠 + 复盘迭代快'
  - '- 执行力可 SOP 化、可招人复制：把重复基础工作外包/招人，自己聚焦“最不确定、最高杠杆”的 100 个小问题'
  - '**典型例子**'
  - '- 565 天日更写作：完成课程、社群、咨询三个变现闭环，微信好友 6 倍增长'
  - '- 视频号大型直播活动：无全职人员、无助理，策划到海报设计到话术细节全亲力亲为，三次活动 GMV 破 16 万/场观 1.2 万'
  - '- 美团电商：80 元跑通 MVP、两个月 30 家店、单店月利润 6k-12k，核心是“完成比完美更重要”的极速执行'
  - '**边界条件**'
  - '- 执行方向错 = 零效率：在错误赛道、错误模式、错误产品上狂执行，只是“加速死亡”'
  - '- 执行需“反馈回路”：无数据复盘、无用户反馈、无同行对标的执行，是“自我感动式内耗”'
  - '- 执行力有边界：健康、家庭、认知上限、平台规则、宏观周期，强行突破会导致系统崩溃'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_06.md
    role: apply
  excerpts:
  - 执行力是值钱的，执行力是可以变现的，我想奖励执行力；邀请我去生财办公室这何尝不是对我的执行力的一种奖励。
  - 亦仁大概花了 7W 买了她坚持 4 个月加了 4000 多好友的微信号。
  - 竭尽全力是最轻松的工作方式。…… 其实我们几乎所有的人，做事都很难做到竭尽全力。…… 有时候我们不必去拼天分，我们在很多事情上，只要够勤奋、够用心就可以了。
- 'no': 15
  name: 利他即利己 —— 把“分享”变成“资产增殖器”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统商业思维：“教会徒弟饿死师父”、“核心机密不外传”、“用户名单是命根子”'
  - '- 互联网时代：信息半衰期极短、市场容量极大、连接成本极低，藏着掖着反而切断信息回流、错失合作机会'
  - '- 需要重塑“分享观”：分享不是成本，而是投资；分享越多、回流越多、信任越厚、机会越大'
  - '**核心定义**'
  - '- 利他即利己：主动分享好信息、好方法、好资源、好项目，不设门槛、不求直接回报，长期看回报远超成本'
  - '- 机制：分享 → 吸引同频者 → 形成信任网络 → 信息/资源/项目回流 → 复利增长'
  - '- 核心认知：“现在最稀缺的就是信息，这市场这么大，蛋糕分得完吗？”'
  - '**关键性质**'
  - '- 正向循环：越分享 → 越被信任 → 越获核心信息 → 越能抓住机会 → 越有料可分享'
  - '- 筛选器：愿分享、能分享、持续分享的人，大概率是高执行力、高认知、长期主义者，天然筛选优质伙伴'
  - '- 成本极低：一篇文章、一条朋友圈、一次直播、一个文档，边际成本趋零，边际收益无上限'
  - '**典型例子**'
  - '- 作者坚持周报、写作、分享，获得亦仁认可、进入核心圈层、获取高阶项目信息、实现多项目变现'
  - '- 社群分销：佣金/设计压力低、产品有社交货币价值（如推荐好书展示好妈妈形象），分销员疯狂发圈自发裂变'
  - '- 知识付费：付费买别人的试错经验和时间，本质是“利他者把坑踩平了，让后来者少走弯路”'
  - '**边界条件**'
  - '- 核心商业机密（核心算法、独家供应链、未公开专利、核心财务数据）不在分享范围内'
  - '- 分享需“有价值、有门槛、有节奏”：纯发鸡汤、发过时信息、发无法落地的宏大叙事，会透支信任'
  - '- 避免“白嫖党”吸血：建立“先给价值、后收反馈”的机制（如关注领资料、打卡领课程、付费入群），筛选真需求者'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - 利他等于利己，越分享越幸运。
  - 曾有朋友反问我，你就不怕你把赚钱的信息分享出去，别人抢了你的蛋糕？…事实证明，你越利他，你得到的回报会更大。现在最稀缺的就是信息…这市场这么大，蛋糕分的完吗？
  - 采用合作思维，我和他不是对立关系，而是合作共赢，即利他思维，利他即利己，所以合作思维逻辑成立。
