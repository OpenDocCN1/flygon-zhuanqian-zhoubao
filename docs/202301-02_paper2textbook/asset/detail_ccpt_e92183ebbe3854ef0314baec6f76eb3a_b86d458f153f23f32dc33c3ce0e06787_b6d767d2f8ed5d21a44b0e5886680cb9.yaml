  excerpts:
  - 有模式，我称之为1+1+1，1个在盈利，1个在开发，1个在知识付费。
  - 直接给到合作伙伴现成的脚本、录制视频的sop、3条视频的剪辑、价值6980的课程赠送、喂饭教程、朋友圈搭建聊天sop。
  - 我们通过区域合伙人计划——城市管家，快速让合伙人上手。平台提供房源库、配房人员、带看流程，合伙人只需要维护用户。
  - 开放加盟前必须先跑通单店模型（单店盈利），再进行区域模型验证（多店复制）。
- 'no': 7
  name: 风控与止损 —— 把“输得起”写进商业计划书
  points:
  - '**为什么需要这个概念？**'
  - '- 素材中充满“亏损百万”、“账号被封”、“平台规则突变”、“合伙人纠纷”、“供应链断供”等血泪教训'
  - '- 普通人创业容错率极低，一次致命风险(法律/现金流/核心账号/核心人员)即可归零'
  - '- 必须建立“事前预判、事中监控、事后复盘、止损红线”全周期风控体系'
  - '**核心定义**'
  - '- 创业风控体系：包含平台规则红线、法律合规底线、现金流安全线、核心资产备份、止损触发条件、Plan B/C 方案的系统性防御机制'
  - '- 核心原则：只做“输得起、赚得多、可复制、有护城河”的事；不碰“不喜欢、不懂、单一变现、无基本盘”的事'
  - '**关键性质**'
  - '- 平台规则敬畏：老杨控制直播时长/场次避免断播、胖龟抖音必投本地/避开汽车广播、夕子不依赖单一广告变现、TikTok硬改手机寿命10分钟-10天'
  - '- 法务前置：劳动合同+考核表+保密协议+廉洁协议“四件套”(胖龟三个赔付案例)、股权协议+一致行动权+退出机制(4C模型/顶层设计四要素)、融资识别骗子公司(不缴纳前置费用)'
  - '- 现金流止损：单项目/单渠道/单账号投入上限设定；亏损项目“见好就收、有利必跑、狠心出货”(Web3 20字箴言/夕子亏损反弹/胖龟放弃AI小程序)'
  - '- 核心资产去中心化：多账号矩阵/多渠道获客/多供应商/多合伙人/多城市，避免单点故障'
  - '**典型例子**'
  - '- 老杨：直播间判雷同限流/原创举报/录播罚款/批量罚款规则清单 → 控制时长/场次/硬改设备/程序化去重 → 刷机应对封设备'
  - '- 胖龟：外包开发坑/招聘固化思维销售/汽车广播打水漂/融资骗子公司 → 吸纳技术合伙人/招应届生/抖音本地投放/不盲目缴费'
  - '- 夕子：淘宝店被封/代购断供/单一广告变现停更/非刚需项目亏损百万 → 多渠道引流/自建品牌供应链/基本盘业务/资源盘点匹配项目'
  - '- 通用：AI绘画小程序预算超期/资质缺失/工期过长/流量单一 → 理性止损放弃；闲鱼套利/无人直播/视频号店群 → 小成本试错/矩阵对抗不确定性'
  - '**边界条件**'
  - '- 过度风控=不行动：需区分“可控风险(通过SOP/工具/法律规避)”与“系统性风险(政策/平台生态/宏观周期)”，前者大胆试，后者早规避'
  - '- 止损执行力：人性贪婪/沉没成本/面子导致“再坚持一下”，需引入外部监督(合伙人/导师/董事会/自动止损指令)强制执行'
  - '- 合规成本计入：合规不是成本中心，是生存门槛；预算中必须含法务/合规/风控/审计/保险费用'
