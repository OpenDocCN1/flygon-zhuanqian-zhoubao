units:
- 'no': 1
  name: 最小MVP闭环 —— 从“挣1块钱”到“复制放大”
  points:
  - '**为什么需要这个概念？**'
  - '- 副业/创业初期最大的风险是投入大量资源后才发现方向错误'
  - '- 传统思维是“先造航母再过河”，但个人和小团队根本承担不起这种试错成本'
  - '- 需要一个低成本、快速验证商业模式是否成立的方法'
  - '**核心定义**'
  - '- 最小可行产品闭环：以最小成本、最快速度跑通“产品—流量—销售—交付”的完整商业循环'
  - '- 核心要求：不是追求完美，而是先完成第一单交易，哪怕只赚1块钱'
  - '**关键性质**'
  - '- 低成本性：投入小，即使失败损失也可控'
  - '- 快验证性：能在最短时间内判断模式是否成立'
  - '- 可复制性：跑通后可以无限放大，从月入3000的号复制30遍变成大生意'
  - '**典型例子**'
  - '- 线上美业：夕子以2万资本起步，从代购医美面膜一单挣2元开始，逐步跑通“产品-流量-销售-交付”闭环，最终年利润过百万'
  - '- TikTok睡播：老杨用MVP方法快速测试新玩法，验证可行性后才批量复制'
  - '**边界条件**'
  - '- MVP验证的目标不是追求利润最大化，而是确认“有人愿意付钱”和“交付可行”'
  - '- 如果MVP阶段连1块钱都挣不到，说明模式本身有问题，应果断调整而非加大投入'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: improve
  excerpts:
  - 1.做生意从自己身边资源入手，从挣1块钱开始，选一个天花板比较高的，持续3——5年。
  - 2.跑通自己的生意环节，最小mvp（产品——流量—销售—交付）
  - 5.3 测试。快速测试，快速看到结果，产品方法论MVP真是让各行各业都能大放异彩啊。
- 'no': 2
  name: 产品好省一半心 —— 选品决定论
  points:
  - '**为什么需要这个概念？**'
  - '- 很多创业失败并非销售能力不足，而是从一开始就选错了产品'
  - '- 差产品需要花大量精力推销，好产品自带转化力'
  - '- 后端复购率取决于产品本身能否持续满足用户需求'
  - '**核心定义**'
  - '- 选品重于销售：选择好的产品比销售技巧更重要，好产品自然带来转化和复购'
  - '- 选品三要素：深挖用户需求且涵盖面齐全、口服保养是趋势（客户粘性强）、尽量与医院合作强化品牌背书'
  - '**关键性质**'
  - '- 自带转化力：好产品能省掉一半销售精力'
  - '- 高复购率：客户粘性强，接受后不轻易更换'
  - '- 品牌背书强：有专业机构背书，客户信任度更高'
  - '**典型例子**'
  - '- 线上美业：选品时优先选择能涵盖祛痘、美白、抗衰等多种需求的产品线，而非单一的某个爆品'
  - '- 口服保养品：客户一旦接受某个品牌的口服产品，不会轻易换牌子，复购率高'
  - '**边界条件**'
  - '- 选品考察的是后端供应链和产品力，而非单一价格优势'
  - '- 需结合自身资源验证：没有利润空间的产品（如合伙人级别才能拿到低折扣）不如不做'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  excerpts:
  - 所以选品很关键，产品好省了一半的心，后续回购率也高。
  - 果断花了1万6入了一批货，这个级别属于合伙人级别，折扣比较低，有利润空间。
  - 1.深挖用户需求，最好涵盖面齐全：比如说不仅祛痘、还有美白、抗衰等等
  - 2.口服保养是趋势，一个人一单接受了某个品牌的口服，不会轻易更换牌子的
  - 3.尽量能跟医院合作的产品，品牌背书这块强
- 'no': 3
  name: 信息差就是金钱 —— 卖“你知道而别人不知道的路径”
  points:
  - '**为什么需要这个概念？**'
  - '- 商业的本质是交易，交易的前提是买方和卖方对同一个商品的价值认知存在差异'
  - '- 传统行业（如房产中介）依靠信息不对称赚取高额费用，这恰恰说明信息差是钱的来源'
  - '- 理解信息差才能找到创业切入点和商业模式的根基'
  - '**核心定义**'
  - '- 生意的本质是信息差：利用买卖双方对市场、产品、价格等信息的不对称，通过撮合、搬运或服务创造价值并获利'
  - '- 中介费伪概念：中介费之所以能收取，本质是买房者不知道房东电话，一旦信息透明该费用可被取消'
  - '**关键性质**'
  - '- 广泛存在：互联网和线下都存在大量信息差生意'
  - '- 可被消除：技术进步和模式创新能消除信息差，从而颠覆原有商业模式'
  - '- 价值创造：平台撮合买卖双方匹配，解决需求及痛点，产生良性循环'
  - '**典型例子**'
  - '- 胖龟找房：不向租客收中介费，而是让二房东承担佣金（因为空置一天损失一天房租），本质是重新分配了“信息差红利”'
  - '- 闲鱼套利：利用不同平台间的价格信息差低买高卖'
  - '**边界条件**'
  - '- 信息差会随时间和技术进步被消除，需要持续寻找新的信息差或建立其他壁垒'
  - '- 单纯依赖信息差而无实际服务价值，容易被视为“智商税”并面临竞争者的颠覆'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 生意的本质就是信息差，在互联网里也存在大量的信息差生意。以这个信息差为市场的切入点我们创办了胖龟找房的 1.0——没有中介费的个人房屋分享平台。
  - 我们不收中介费，是因为中介费本身就是个伪概念！为什么说是伪概念，因为是智商税，中介费为什么要收？就是因为买房及租房者不知道售房及出租转让业主的联系电话！
  - 如果买房者或者租房者知道房东电话！那么他们还会给中介公司掏中介费吗？nonononon，绝对不会！这叫什么？是不是信息不对等差造成的信息差？
- 'no': 4
  name: 渠道投产比 —— 用数据说话，不凭感觉花钱
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者资源有限，投放预算必须花在回报最高的渠道上'
  - '- 凭经验和“听说”选择渠道往往导致资金浪费（如汽车广播投入2万元看不到水花）'
  - '- 需要量化比较不同渠道的投产比，用数据指导后续投放决策'
  - '**核心定义**'
  - '- 投产比（ROI）：某渠道带来的收益与投入成本的比值，衡量营销渠道效率的核心指标'
  - '- 按效果排序渠道价值：抖音推广 > 本地自媒体 > 汽车广播'
  - '**关键性质**'
  - '- 可比较性：不同渠道用同一标准（获客成本、付费转化数）横向对比'
  - '- 本地相关性：做本地项目时投放必须选本地渠道，外地流量无效'
  - '- 差异巨大：最优与最差渠道的回报可能相差数倍到数十倍'
  - '**典型例子**'
  - '- 胖龟找房实测：抖音投放带来4000+粉丝、100+付费会员，获客成本约600元/名，投产比不错，还带来5位加盟商（单个成本8000元，但利润1万+有盈余）；汽车广播投入2万几乎看不到水花'
  - '**边界条件**'
  - '- 投产比受行业、地域、内容质量影响，需在自身业务场景中实测，不能直接照搬他人结论'
  - '- 投放效果有滞后性，需给短中期观察期后再评估是否追加或放弃'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 以此 抖音推广>本地自媒体>汽车广播
  - 品牌营销这部分营销推广直接带来了 4000+的粉丝，付费会员大概在 100 多名，获客成本大概在 600 左右一名，投产比还不错。
  - 招商版块推广带了 100+的意向客户，最后成交变成加盟客户 5 位，单个加盟商成本在 8000 左右。因为我们有个 1w 左右的利润，所以也是有盈余的。
  - 汽车广播这个板块不建议大家做，薅羊毛的客户比较多~。这个版块我们大概扔进去 2w，水花都看不到。
  - 投抖音的时候如果你是做本地项目，一定要投本地一定要投本地...
- 'no': 5
  name: 平台演化周期 —— 从“以史为鉴”到“预判红利”
  points:
  - '**为什么需要这个概念？**'
  - '- 新平台（如TikTok、美团、TEMU）的发展路径高度相似，历史规律可预判新机会的窗口期'
  - '- 只有理解平台演化阶段，才能判断“什么时间用什么打法”最容易被奖励'
  - '- 普通人逆袭的窗口往往在平台早期（高流量低商业化阶段），错过即失去'
  - '**核心定义**'
  - '- 平台演化周期：互联网平台普遍经历“铺货→动销→精细化→玩趋势”四个阶段，早期流量红利最大但商业化不成熟'
  - '- 高流量低商业化阶段：平台主推电商和广告只是为了赚钱占市场，此时做娱乐直播/内容种草是普通人最轻松拿到现金流的方向'
  - '**关键性质**'
  - '- 周期普遍性：所有平台演变的底层逻辑相通（淘系历史可类比视频号、抖音）'
  - '- 窗口有限性：每个阶段的红利被快速消耗，错过早期的简单模式就进入竞争激烈的精细化阶段'
  - '- 风险递进性：后期平台管控加强，需要更合规、更精细的打法'
  - '**典型例子**'
  - '- TikTok睡播：作者判断TikTok处于抖音早期类似阶段，主攻娱乐直播而非带货直播，预判风口至少可持续2年'
  - '- 美团电商冷启动：2022年8月末发现机会，不到两个月从0跑通并扩展到30家店，验证新平台初期红利效应'
  - '**边界条件**'
  - '- 平台政策可能突变，早期蓝海也可能是“灰色地带”，需留意合规风险'
  - '- 平台生命周期判断需要结合多方数据（用户增长、监管政策、竞对动态），不能只看单一指标'
  sources:
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: origin
  excerpts:
  - 回观抖音的发展路径，第一阶段就是高流量低商业化阶段，这时候要做的并不一定要跟平台的指向，而是要看清平台的现状。
  - 按照抖音、映客花椒的发展路线图，初级阶段娱乐直播至少可以做2年的时间，在这段时间里面，不需要对某个项目进行深度的运营和挖掘，就可以赚到一桶金。
  - 对于大部分想要在tiktok上赚到钱的小伙伴，娱乐直播是最简单也是最容易拿到结果的方向。
- 'no': 6
  name: 项目矩阵 —— 一个盈利、一个开发、一个变现方法论
  points:
  - '**为什么需要这个概念？**'
  - '- 单项目都有生命周期（约2-6个月），不做储备就会陷入“断粮”'
  - '- 只盯着一个项目容易被内容同质化或平台管控淘汰'
  - '- 需要形成“持续造血+提前储备+知识变现”的良性循环'
  - '**核心定义**'
  - '- 1+1+1项目矩阵：同时运营三个层级项目——1个在盈利（现金流）、1个在开发（储备）、1个做知识付费（经验变现）'
  - '**关键性质**'
  - '- 现金流稳定：盈利项目提供当前收入'
  - '- 储备项目延续性：开发中的项目确保生命周期结束前有新项目接班'
  - '- 经验溢价：将已验证的方法论打包成知识付费产品，实现“卖水”型收入'
  - '**典型例子**'
  - '- 老杨的娱乐直播矩阵：一个睡播项目在盈利，同时开发新的娱乐直播玩法，并做知识付费输出方法论（但批判高价售卖行为）'
  - '**边界条件**'
  - '- 项目开发必须可复制、快速执行、门槛尽量拔高（但也需根据人员配备现状调整）'
  - '- 知识付费需要建立在真实可验证的成果之上，否则伦理风险很高'
  sources:
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: origin
  excerpts:
  - 有模式，我称之为1+1+1，1个在盈利，1个在开发，1个在知识付费
  - 毕竟是免费流量，要像投流一样稳是不可能的，那么怎么做到一次又一次推流呢？就看直播运营能力了，另外同一个项目在不升级的情况下生命周期从2-6个月不等，所以在开发项目时必须要可复制，快速执行，门槛能有多高拔多高，不过也要看自己的人员配备现状。
  - 因为所有的项目都会有内容同质化或者平台管控的时候，这个时候没有项目开发运营能力，就不能升级项目，不能开发新项目，结果就被淘汰。
- 'no': 7
  name: 私域高客单 —— 端着“金饭碗”别讨饭
  points:
  - '**为什么需要这个概念？**'
  - '- 私域用户因专业价值而来，如果只做低客单价社群团购，是把稀缺资源浪费在低价值场景'
  - '- 私域的核心价值是高信任度，必须用它承载高客单、技术型服务'
  - '- 许多人把私域做成了“消耗”，忘记了私域的专业溢价能力'
  - '**核心定义**'
  - '- 私域高客单：私域用户因专业能力而来，应服务高客单、技术型需求，而非做低价值的社群团购'
  - '- 金饭碗比喻：私域的专业价值如同金饭碗，端着金饭碗讨饭是对资源的极大浪费'
  - '**关键性质**'
  - '- 高信任度：用户因专业而来，天然带着信任'
  - '- 高利润空间：技术型服务可以收取更高价格'
  - '- 可持续性：专业信任带来的客户生命周期更长'
  - '**典型例子**'
  - '- 夕子：曾兼着一个社群团购业务（吃喝拉撒），被私域老师点醒“端着金饭碗在讨饭”——私域用户是奔着她专业看皮肤来的，应做高客单皮肤诊断服务，而非团购'
  - '**边界条件**'
  - '- 私域高客单的前提是专业能力能解决用户真实问题，否则高客单只是“割韭菜”'
  - '- 需要时间与精力深度交流，不适合追求“短平快”的运营者'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  excerpts:
  - 私域老师有句话点醒了我：“端着金饭碗在讨饭。”当时我兼着一个社群团购业务，就是吃喝拉撒的这些，我私域的用户更多奔着我专业，看皮肤来的，我居然做这种事情，真的在讨饭。
  - 私域的用户需要花费时间和精力去交流，这种需要技术的事情，就应该收高客单。
- 'no': 8
  name: 逆向开发方法论 —— 从“问题”到“卖点”的转化路径
  points:
  - '**为什么需要这个概念？**'
  - '- 大多数新手做产品是“我会做什么就卖什么”，但市场不一定需要'
  - '- 高手是通过“看到问题→确定卖点→反向开发/包装”来保证产品从出生就自带需求'
  - '- 解决“做出一个没人要的东西”的尴尬'
  - '**核心定义**'
  - '- 逆向开发：从用户的真实痛点出发，反推产品应该是什么、怎么做、怎么卖，而非从技术或自我喜好出发'
  - '- 核心链条：发现信息差或痛点→定义产品形态与解决方案→快速验证→复制放大'
  - '**关键性质**'
  - '- 需求导向性：一切从用户和市场的真实反馈出发'
  - '- 高效执行性：围绕最小可行闭环快速迭代，无需先开发完产品再寻找市场'
  - '- 信息差驱动性：常与信息差套利结合（发现别人用旧方法赚钱，用新方法做到更高效）'
  - '**典型例子**'
  - '- 胖龟找房：先发现“中介费是信息差伪概念”的痛点，再反向搭建平台+线下门店，最终月入15w'
  - '- 线上美业：先观察到皮肤问题人群的需求，反向整合医美产品和医生品牌，再制作内容获客'
  - '**边界条件**'
  - '- 逆向开发不等于“没产品也卖空气”，最终交付物必须真实解决用户问题'
  - '- 对信息差的依赖度高，需要持续保持对市场动态的敏感度'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: improve
  excerpts:
