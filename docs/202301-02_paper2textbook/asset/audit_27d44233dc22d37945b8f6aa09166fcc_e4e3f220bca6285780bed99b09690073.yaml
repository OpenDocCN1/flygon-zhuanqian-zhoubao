unsupported_claims:
- location: '14.5'
  claim: 免费版影刀限制导出行数、并发数，规模化需求（日采集5000+条）下，自建分布式RPA集群 vs 购买商业版 vs 雇佣众包采集，三者ROI如何对比？
  reason: 素材中未找到关于分布式RPA集群架构选型、商业版定价、众包采集成本的具体对比数据，仅提到免费版限制和云服务器部署成本估算。
- location: '14.7'
  claim: 混淆素材总时长占生成视频总时长的比例建议<15%，若超标会对完播率和转化率产生何种具体负面影响？
  reason: 素材中仅提到建议占比<15%，未给出超标时对完播率、转化率的具体量化负面影响数据。
- location: '14.8'
  claim: 不同赛道（如图书教辅vs生鲜水果）生命周期长短差异巨大，如何建立'赛道校准系数'快速套用本模型？
  reason: 素材中仅提到不同赛道周期差异大、需校准，未提供建立'赛道校准系数'的具体方法论或公式。
- location: '14.9'
  claim: 素材源账号为'独家首发/签约达人'时，二创风险极高。如何建立'素材源风险等级标签体系'（S/A/B/C级）并在执行表中自动拦截高风险素材？
  reason: 素材中仅提到风险高、建议规避，未给出具体的分级标准体系构建方法或自动化拦截技术方案。
- location: '14.11'
  claim: 平台合作平台若源码套壳、概率外购，大概率追风收割，需规避；自研能力是长期靠谱的核心信号。
  reason: 素材中仅给出定性判断，未提供平台源码审计的具体技术指标、合规白皮书参考或尽调清单。
- location: '14.12'
  claim: 公式参数（-30%、50%、3场）为经验值，不同赛道需校准：视频号带货周期短可收紧至-20%、40%、2场；抖音种草号周期长可放宽至-40%、60%、5场。
  reason: 素材中给出的校准建议为经验之谈，未引用实证研究数据支撑不同赛道的具体参数区间。
- location: '14.13'
  claim: 单台云服务器日采集上限约2000-3000条（受平台频控限制），日需5000+条需2-3台集群+负载均衡+统一调度，月成本500-1000元，远低于雇佣众包采集（按条付费约0.1-0.3元/条，月成本1.5-4.5万）。
  reason: 素材中云服务器成本为估算，众包采集单价为经验值，未提供实际采购合同或第三方服务商报价作为佐证。
- location: '14.13'
  claim: 视频号打击'挂车引流'、抖音打击'第三方导流'可能切断模式，需持续关注规则红线。
  reason: 素材中仅提到政策收紧风险，未引用具体平台公告条款、处罚案例或应对预案。
