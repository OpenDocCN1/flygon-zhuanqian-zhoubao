- │   │   ├── 岗位权重(技术壁垒/核心岗) 30%-40% —— P001
- │   │   ├── 时间投入(全职/里程碑匹配/引入资源) 10%-25% —— P001
- │   │   ├── 资金投入(前期出资/信心信号) 20%-50% —— P001
