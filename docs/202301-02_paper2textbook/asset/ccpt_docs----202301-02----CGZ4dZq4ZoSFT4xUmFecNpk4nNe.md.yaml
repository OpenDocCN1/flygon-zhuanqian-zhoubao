paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
desc: 该素材从短视频带货从业者视角，介绍了巨量百应（Buyin）创意中心的两个官方模块（爆款视频库、创意搜索），并演示了如何基于影刀（RPA工具）开发两个采集机器人，实现爆款短视频的批量搜索、数据采集（含GMV、粉丝量等）与无水印视频下载，用于竞品对标、脚本复用与选品分析。素材同时提出一套'对标方法论'：以官方实时数据替代第三方工具、以黑马小达人（低粉高销）为学习对象、以脚本模板复用替代盲目原创。
concepts:
- name: 对标方法论
  desc: 以短视频行业官方平台实时更新的爆款视频库和创意搜索作为对标依据，筛选出高GMV、低粉丝量的黑马视频进行学习与模仿，而非仅依赖第三方数据工具或大达人样本。
  is_original: true
  excerpt:
  - 对标对标,这里上榜的,出成绩的,最新的,不就是最好的对标吗?
  - 好的脚本大概率是不会过时的,一个脚本模板,改改文案换个产品推,成功率大概也比瞎原创要好一点吧.好记性不如烂笔头,不如全部下载保存起来吧.
- name: 黑马小达人样本策略
  desc: 在采集数据后，优先筛选'粉丝量少但销量高'的视频作为学习对象，因为大达人有粉丝基础加成，销量天然偏高，黑马小达人更适合小达人用户对标学习。
  is_original: true
  excerpt:
  - 我的思路是找那种,粉丝量少,但是销量高的视频,做参考
  - 这种黑马小达人更是我们小达人适合学习的对象,毕竟大达人都是有粉丝基础加成在的,销量天然会高一点.
- name: 官方实时爆款视频库
  desc: 巨量百应创意中心的爆款视频和创意搜索模块，相比抖查查、蝉妈妈等第三方工具，能提供更准确、更实时的行业优秀爆款视频数据，是短视频带货从业人员的重要情报源。
  is_original: true
  excerpt:
  - 一个是爆款视频,能找到各个行业,不同等级作者,近期的非常实时的最新带货效果最好的短视频.
  - 这个是比抖查查蝉妈妈这些第三方要更准确的行业优秀爆款视频库.
methods:
- name: Douyin百应创意中心爆款视频搜索采集（RPA机器人）
  desc: 基于影刀RPA工具开发，输入搜索词/商品名、滚动刷新次数、按GMV过滤等参数，自动采集创意搜索的视频数据并导出表格，可选无下载码视频（无水印）。
  excerpt:
  - 指定搜索词/商品名;滚动刷新次数;按gmv过滤视频,默认过滤0销量;数据采集表格导出,默认到桌面;可选视频下载(无水印);记住上次输入的内容
  - 点击确定开始运行,不刷新页数,1页下载完就22秒左右吧
- name: Douyin百应创意中心爆款视频分类采集（RPA机器人）
  desc: 基于影刀RPA工具开发，按大行业/子行业类目、作者等级、时间周期等维度筛选爆款视频库，采集并导出数据，支持无水印视频下载。
  excerpt:
  - 可选大行业,子行业类目;可选作者等级;可选时间周期;下拉刷新页数;数据采集表格导出,默认到桌面;可选视频下载(无水印);记住上次输入的内容
  - 点击确定开始运行,不刷新页数,1页下载完就55秒左右吧
- name: __overview__
  desc: 整体方法论为：通过官方Buyin创意中心获取实时竞品数据 → 用RPA（影刀）批量采集/下载 → 基于数据筛选（优先GMV高、粉丝少的黑马视频）→
    借助飞书妙记做语音转文字提取脚本 → 完成脚本库积累与对标学习。
  excerpt:
  - 到这里,这里上榜的,出成绩的,最新的,不就是最好的对标吗?好的脚本大概率是不会过时的,一个脚本模板,改改文案换个产品推,成功率大概也比瞎原创要好一点吧.
  - 视频下载下来,可以用飞书妙记,语音转文字,你懂得.
theorems:
- name: 官方数据优于第三方工具
  desc: 在短视频带货领域，巨量百应创意中心的实时爆款视频库比抖查查、蝉妈妈等第三方工具更准确、更实时，因此应优先采用官方平台数据作为对标依据。
  excerpt:
  - 这里是比抖查查蝉妈妈这些第三方要更准确的行业优秀爆款视频库.对于上不了热榜的来说,这里更容易找到同行的东西.
- name: 脚本模板复用优于盲目原创
  desc: 爆款脚本模板随时间变化慢，一个经过验证的脚本模板通过替换文案和商品，其成功率大概率高于毫无依据的原创，因此可持续积累与复用。
  excerpt:
  - 好的脚本大概率是不会过时的,一个脚本模板,改改文案换个产品推,成功率大概也比瞎原创要好一点吧.
- name: 低粉高销更值得学习
  desc: 大达人拥有粉丝基础加成导致销量天然偏高，因此对标学习时应优先选择粉丝量少但销量高的黑马小达人，对普通小达人更具参考价值。
  excerpt:
  - 这种黑马小达人更是我们小达人适合学习的对象,毕竟大达人都是有粉丝基础加成在的,销量天然会高一点.
findings:
- name: 带货短视频收入上限极高
  desc: '[claim] 作者在刷完百应创意中心后观察到，带货短视频单条视频收入可达十几万、几十万元，行业中存在大量矩阵号、模板化内容批量产出的现象。'
  excerpt:
  - 刷完这里我才发现,带货短视频上限竟然能这么高,一条视频十几万,几十万的收入...很明显这里有很多矩阵号,模板化的内容批量的产出...
- name: RPA工具降低编程门槛
  desc: '[claim] 影刀等RPA工具加上一点编程思维，即可让非专业程序员（如产品经理）快速开发出可用的采集或自动化脚本；同时RPA相比后羿采集器更自由。'
  excerpt:
  - rpa更自由吧,只要你有想法,加上一点点的编程思维,即使你不是专业的程序员,也能写出来能用的脚本.我不是程序员,最多算个半吊子的产品经理.
- name: RPA脚本运行阻塞限制
  desc: '[evidence] 作者用影刀自建无人直播机器人时，成功实现了抓取弹幕、关键词匹配、自动音频回复、自动视频回复，但运行时会锁住电脑无法操作，因此改用程序员开发的无人直播工具。'
  excerpt:
  - 我还自己用影刀做了个无人直播机器人,抓取直播间弹幕-匹配关键词-自动音频回复-自动视频回复.跑通了,不过不太好用,脚本执行的时候电脑就不能操作了...所以我还是找程序员朋友另外开发了无人直播工具.
