learning_targets:
- 理解痛点驱动创业的核心：从用户真实痛点而非主观愿望出发
- 掌握信息差红利的识别与变现逻辑
- 学会设计并跑通最小可行产品（MVP）闭环
- 建立“选品决定论”的认知，理解产品质量对后续经营的全链条影响
- 能判断行业周期窗口，把握入场时机
concept_map:
- 创业的起点
- ├── 痛点驱动创业
- │   ├── 创业的第一性原理      —— E1WG, PglA
- │   ├── 真实性 / 迫切性 / 可感知性 —— E1WG
- │   └── 痛点 vs 痒点          —— PglA
- ├── 信息差红利
- │   ├── 生意的本质是信息差    —— PglA
- │   ├── 中介费伪概念          —— PglA
- │   └── 时效性 / 隐蔽性 / 可迁移性 —— PglA
- ├── 最小可行产品闭环
- │   ├── 产品—流量—销售—交付  —— E1WG
- │   ├── 低成本快速验证        —— E1WG
- │   └── 从挣1块钱到复制放大    —— E1WG
- ├── 选品决定论
- │   ├── 好产品自带转化力      —— E1WG
- │   ├── 深挖需求 / 趋势 / 品牌背书 —— E1WG
- │   └── 选品重于销售          —— E1WG
- └── 行业周期窗口
- ├── 高流量低商业化阶段入场  —— PglA
- ├── 存量时代洗牌机会        —— PglA
- └── 时机性 / 红利性 / 可预测性 —— PglA
life_analogy:
- 想象创业选方向如同**生病就医**：
- '- **痛点** = 身体真实的不适感（疼才想治）'
- '- **痒点** = 可有可无的保养（不疼不急）'
- '- **信息差** = 只有你知道的专科医生或特效药渠道'
- '- **MVP** = 先买一小盒药试试疗效，而不是直接住院开刀'
- '- **选品** = 药本身好不好，好药省心，烂药再会推销也白搭'
- '- **周期窗口** = 疫情刚过、医院人少的时候去看病，排队短、看得快'
- 就像好医生先问“哪里疼”而不是“你想开什么药”，创业者也要先找准痛点和时机，再谈产品和放大。
summary:
- concept: 痛点
  desc: 用户情感上强烈关注、迫切想解决的真实问题，是创业的第一性原理
- concept: 痒点
  desc: 有则更好、无则亦可的浅层需求，不构成创业的坚实起点
- concept: 信息差
  desc: 交易双方信息掌握程度不对等，是商业利润的重要来源
- concept: 中介费伪概念
  desc: 中介费本质是信息差造成的“智商税”，信息透明后即可被取消
- concept: 最小可行产品（MVP）
  desc: 以最低成本验证“产品—流量—销售—交付”闭环，跑通后再复制放大
- concept: 选品决定论
  desc: 好产品自带转化力，选品成功与否决定后续销售、复购、口碑的成败
- concept: 行业周期窗口
  desc: 在行业早期高流量低商业化阶段入场，机会成本最低、红利最大
- concept: 存量消费时代
  desc: 从增量到存量的市场切换期，旧模式出清时正是新模式进场窗口
exercises:
- 'no': 1
  title: 痛点评估矩阵：判断一个创业想法是否值得投入
  contents:
  - 你身边有一位朋友抱怨“下班后想学点东西但总是坚持不下去”。请以此为出发点：
  - 1. 列出至少 3 个你可能想到的“痛点”表述，并区分其中哪些是真正的痛点、哪些只是痒点
  - 2. 用“真实性、迫切性、可感知性”三个维度评估每个痛点，给出 1-5 分
  - 3. 根据得分判断：这个想法是否值得作为创业起点？为什么？
  - 回答问题：
  - '- 如果你发现这个群体其实“不疼”，但你认为市场巨大，你会怎么调整？'
  - '- 痛点的“群体规模”和“付费意愿”哪个更重要？'
- 'no': 2
  title: 信息差挖掘：找出你身边隐藏的赚钱机会
  contents:
  - 回想你最近一次感到“不合理”的消费经历（比如某产品溢价过高、某服务收费离谱）：
  - 1. 描述这个场景，并指出信息差在哪里（是谁不知道什么？）
  - 2. 判断这是地域、行业、渠道还是认知信息差？
  - 3. 设计一个利用该信息差的商业设想，并回答：
  - '- 该信息差能维持多久？（时效性）'
  - '- 别人复制你的模式难不难？（壁垒）'
  - '- 是否存在合规风险？'
- 'no': 3
  title: MVP设计工坊：为你的想法设计最小验证方案
  contents:
  - 假设你想做“帮上班族搭配一周健康午餐”的付费服务：
  - 1. 定义这个商业模式的“产品—流量—销售—交付”四个环节分别是什么
  - 2. 为每个环节设计“最小成本”的验证方案（不是最优方案，是最省钱的方案）
  - 3. 设定一个验证周期和“成功标准”（比如多少人付费算验证通过）
  - 回答问题：
  - '- 如果验证结果显示“有人感兴趣但不愿付费”，下一步应该怎么办？'
  - '- MVP验证的是“能不能赚钱”还是“能不能稳定赚钱”？为什么？'
- 'no': 4
  title: 选品分析：对比两个产品方案的优劣
  contents:
  - 你准备做一个线上护肤品牌，现有两个选品方向：
  - '- 方案A：一款“万能面霜”，男女通用、价格99元'
  - '- 方案B：一款“敏感肌修复精华”，针对问题肌肤、价格399元'
  - 1. 用“深挖用户需求、涵盖面齐全、趋势正确、品牌背书”四个标准分别评估两个方案
  - 2. 结合“复购率”和“客单价”两个维度，预测哪个方案的长期利润更高
  - 3. 结合“选品决定论”判断：如果你是夕子，你会选哪个？为什么？
  - 回答问题：
  - '- 高客单价一定比低客单价好吗？在什么情况下低客单价更优？'
  - '- 如何判断一个选品是否踩准了行业趋势？'
- 'no': 5
  title: 周期判断：识别你所在行业的窗口期
  contents:
  - 选择一个你熟悉的行业（如：短视频电商、在线教育、本地生活服务）：
  - 1. 判断该行业当前处于“增量”还是“存量”阶段，给出至少 2 个数据或现象依据
  - 2. 分析：如果你现在入场，是处于窗口期、成熟期还是衰退期？为什么？
  - 3. 假设你判断该行业正处于“高流量低商业化”的窗口期，你会采取什么策略快速切入？
  - 回答问题：
  - '- 窗口期的“低门槛”伴随什么风险？如何应对？'
  - '- 窗口期进入后，如何建立自己的壁垒，避免红利消散后被淘汰？'
