learning_targets:
- 理解内在比赛理论（自我一/自我二）如何决定外在成败
- 掌握盲目自信、唤醒成功体验、俯视学习法等心态建设方法
- 掌握确定性窗口期的数据推演方法，能识别并抓住时机窗口
- 理解时代红利对个人收入的量级影响，建立长短线结合的项目思维
- 掌握实时真实ROI的核算公式，能综合评估公域与私域的投产比
- 理解渣男思维做内容的核心理念（撩完就跑、广撒网、峰终定律）
- 掌握逆向思考法，能先定变现路径再规划内容与产品
- 理解增长瓶颈怪圈与价值创造视角，学会三大勇气切换法
- 了解信息差生意的特征，具备从身边发现机会的意识
- 掌握战略即选择的核心理念，明确不做什么是关键决策
- 理解正反馈驱动热爱的机制，摆脱低水平勤奋的内耗
- 掌握盈利验证与放大法，构建从跑通到复制的增长路径
concept_map:
- 创业心态 · 内在比赛
- ├── 内在比赛理论
- │   ├── 自我一（理性） vs 自我二（感性/潜意识）
- │   ├── 内在比赛 vs 外在比赛
- │   └── 自我二不认可 → 输掉外在比赛
- │       ├── 李宗伟输给林丹（37次交手输25次）
- │       └── 老虎伍兹失去'不可战胜'信念
- ├── 盲目自信
- │   ├── 舍我其谁心态 · 我的领域我是国王
- │   ├── 战胜理性自我怀疑
- │   └── 配合俯视学习法（战略藐视·战术重视）
- └── 成功是成功之母
- '    ├── 用成功体验唤醒潜意识自信'
- '    └── 优秀推销员先制造成功体验'
- 商业机会 · 时机窗口
- ├── 确定性窗口期
- │   ├── 香港疫情数据类比推演（2-3个月平静期）
- │   ├── 2023年春天 = 全年最重要的3个月窗口
- │   └── 联动数据验证（旅游/健康/餐饮）
- └── 时代红利
- '    ├── 每100元收入90元来自时代红利'
- '    ├── 英雄是平台与市场红利的产物'
- '    └── 长短线结合项目（视频号直播+私域）'
- 流量运营 · 私域变现
- ├── 实时真实ROI
- │   ├── 综合核算公域投放与私域产值
- │   ├── 公式：q*z-y + z/n×60%×p
- │   └── ROI从2.5提升至3.5-4.5
- ├── 捡漏群
- │   ├── 原价1-3折超高性价比商品
- │   ├── 演员（30-50个托）营造抢购氛围
- │   └── 500人大群 · 佣金变现
- └── 私域单客价
- '    ├── 关注长期贡献而非单次客单价'
- '    └── 2万宝妈好友变现超100万'
- 内容创作 · 爆款心法
- ├── 渣男思维做内容
- │   ├── 撩完就跑（峰终定律：开头结尾愉悦）
- │   └── 广撒网（垂直垂的是人群而非题材）
- ├── 逆向思考法
- │   ├── 逆向流程：变现→定位→产品→内容→流量
- │   └── 先找买家，再找产品
- └── 剥离式拆解问题法
- '    └── 10个大问题 → 100个小问题'
- 战略认知 · 增长视角
