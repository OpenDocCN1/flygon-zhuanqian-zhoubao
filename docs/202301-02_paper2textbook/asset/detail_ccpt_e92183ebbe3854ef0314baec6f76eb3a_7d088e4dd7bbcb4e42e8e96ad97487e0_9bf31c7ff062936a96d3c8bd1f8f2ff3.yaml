  name: 训练营工具链选型与避坑 —— 免费不等于无成本
  points:
  - '**为什么需要这个概念？**'
  - '- 训练营交付涉及收款、文档、直播、社群、打卡五大场景，工具选型直接影响交付体验、资金安全、运营效率'
  - '- 免费工具（如千聊）常有隐形成本：风控严、提现慢、类目限制多，可能导致现金流断裂'
  - '- 需建立「主收款+备用收款」「主交付+备用交付」的冗余工具链'
  - '**核心定义**'
  - '- 收款层：主选小鹅通（付费、稳、类目宽）；备选千聊（免费、但金融/跨境/抖音培训等类目极易冻结、分期返还）'
  - '- 交付层：飞书全家桶（文档/直播/群/打卡/百问百答一体化）+ 微信群（即时交流、社交属性强）'
  - '- 核心原则：资金安全>功能丰富>免费便宜；交付体验>工具统一'
  - '**关键性质**'
  - '- 千聊冻结实例：作者课程款冻结50%，预计9个月才能全提现，直接影响现金流与再投入'
  - '- 飞书文档支持权限分级、多维表格、知识库、视频播放，极适合操作手册与百问百答沉淀'
  - '- 微信群不可替代：国民级渗透率、社交关系链天然存在、转化路径最短'
  - '**典型例子**'
  - '- 作者实操：千聊课程被冻结50%（属跨境电商类目），小鹅通同期正常提现'
  - '- 交付组合：手册/百问百答→飞书文档；直播/录播→飞书直播；打卡→飞书群；交流→微信群'
  - '**边界条件**'
  - '- 个体/微小团队首选：小鹅通+飞书+微信，成本可控、上手快'
  - '- 企业/规模化团队：需考虑私有化部署、数据合规、CRM打通，可能需定制开发或SaaS组合'
  - '- 类目敏感度：涉及金融、医疗、星座、跨境、抖音培训等高风类目，必须首选小鹅通/自建系统，禁用千聊等免费平台'
  sources:
  - paper: docs/202301-02/MUfLdmUlTosj0NxPhlfcjRPHnff.md
    role: origin
  excerpts:
  - '这边提供两个我用过的平台：1. 千聊（免费）；1. 小鹅通

    我自己在千聊上开过一期课程，款项被冻结了50%，剩下部分分阶段返还，预计得9个月才能全部提现。

    一旦你的课程属于下面这些类目，你的课程款项都有可能被冻结，分阶段返还。星座玄学、医疗、金融财经、部分教育培训行业、非课程教学、线下履约、跨境电商、抖音培训等领域。'
  - 我这边习惯的交付方式是：1. 操作手册——飞书文档；1. 直播授课&录播回放——飞书直播；1. 打卡——飞书群；1. 交流——微信群；1. 百问百答——飞书文档
