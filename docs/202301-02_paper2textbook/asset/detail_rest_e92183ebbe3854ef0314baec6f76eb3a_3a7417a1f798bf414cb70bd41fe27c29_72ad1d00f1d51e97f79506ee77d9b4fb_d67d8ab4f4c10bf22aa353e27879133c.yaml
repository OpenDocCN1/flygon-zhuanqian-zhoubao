learning_targets:
- 理解流量价值公式（规模×相关性×信任度）的底层逻辑，并能识别虚荣指标与变现指标的差异
- 掌握财富积累四阶段（出卖劳动力、一份时间多次卖、购买他人时间、钱生钱）的跃迁路径与不可跳跃性
- 学会运用流量切片分析法（横向渠道+纵向用户）将糊涂数据切成可执行的运营动作
- 掌握流量合并思维：通过设计让流量主赚更多钱的方案，实现“流量不为我有，但为我用”
- 理解MVP先卖后做的核心：用预售验证需求，以“筛选大于培养”低成本试错
- 辨析买卖、生意、商业三个层级的本质区别，判断自身所处阶段并制定匹配策略
- 掌握内容价值金字塔（娱乐→工具→方法）的分层逻辑，明确不同层级的变现天花板与核心指标
- 学会超垂直个人IP与SEO思维：布局300-500个长尾词，用精准搜索流量替代不可控的推荐流量
- 掌握“渣男思维做内容”两大原则：撩完就跑（峰终定律）与广撒网（垂直人群、泛内容）
- 内化以结果倒推的逆向思考法：变现→定位→产品→内容→流量，先找买家再找产品
- 掌握剥离式拆解问题法：将客户10个大问题拆解为100个小问题，锁定团队核心精力投入点
- 学会商业拆解复制法：还原底层逻辑（流量/转化/交付/供应链），判断可复制性三条件并低门槛复制
- 理解高净值客户销售破局法：攻克“失去掌控权”核心痛点，通过好奇→权威→依赖三步成交
- 掌握社群分销增长公式：供应链强度×顶层设计×动员能力，冷启动靠选品与核心节点
- 建立平台生命周期意识：识别铺货/动销/精细化/玩趋势四阶段，顺势调整投放与运营策略
- 建立热点套利技术栈思维：平时练内功（备案/API/自动化），风口时拔剑（十分钟上线）
- 内化内在比赛理论：自我二（潜意识）认可目标是外在胜利的前提，训练“盲目自信”与“成功体验唤醒”
- 掌握战略发挥优势法：盘点手中筹码（优势）定出牌策略，补齐短板、规避劣势、贡献视角胜争夺视角
- 学会OKR制定与执行五要素：战略坚定、KR推动O、MVP验证、高频同步、暴露问题
- 理解股权顶层设计四要素：控制权、进入、分配、退出机制，配套法律文件落地
- 建立风险管理与合规底线：劳动合同“枪+子弹”、平台规则敬畏、止损铁律、非刚需/无壁垒不碰
- 践行利他等于利己：高质量分享吸引同频网络，降低获取成本、提升决策质量、复利增长
- 掌握产品Idea五种构思法成功率排序：原生>抄竞品微创新>搜索词>预付费定制>生造
- 学会好名字公式：低触达/理解/记忆/传播成本+好体验理由+好延展空间，自带传播基因
- 熟练运用5WHY分析法穿透现象抓本质，输出根因+防再发措施+验证计划
- 践行合格总结三要素：目标比对+只要事实+发现问题，拒绝流水账，产出待改进行动项
- 掌握商业模式画布道术器用四层分析法：道定生死、术设系统、器搭基建、用跑飞轮
