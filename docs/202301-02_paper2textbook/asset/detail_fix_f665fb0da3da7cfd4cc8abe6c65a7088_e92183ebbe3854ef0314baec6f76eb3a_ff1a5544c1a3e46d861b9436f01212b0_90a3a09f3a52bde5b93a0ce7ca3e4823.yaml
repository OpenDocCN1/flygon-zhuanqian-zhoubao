  - '- 问题是期望与现状的差距，无论期望大于现状还是现状大于期望，差距即为问题'
  - '- 5WHY分析法：每当遇到问题时，连续用5个“为什么”来探寻其发生的真实原因，从表象层层深入到根因'
  - '- 事实与观点的区分：事实是中性的、能用数字和证据支撑的；观点则因人而异、基于立场和层次差异'
  - '**关键性质**'
  - '- 根因导向：5个为什么的层层追问，避免头痛医头'
  - '- 证据驱动：强调用事实（数据、证据）而非观点来做判断'
  - '- 普适性强：适用于商业复盘、项目诊断、个人成长等各类问题求解场景'
  - '**典型例子**'
  - '- 5WHY经典案例：为什么老板骂我 → 因为迟到 → 因为起床晚 → 因为闹钟没响 → 因为没电 → 因为忘记换电池，找到根因即可针对性解决'
  - '- 合格总结的核心是发现问题：完不成目标有问题，完成了目标也有问题（为何不能超额），超额完成也有问题（目标是否设太低）'
  - '**边界条件**'
  - '- 5WHY并非万能，当问题存在多个并行根因时需结合其它分析工具（如鱼骨图）'
