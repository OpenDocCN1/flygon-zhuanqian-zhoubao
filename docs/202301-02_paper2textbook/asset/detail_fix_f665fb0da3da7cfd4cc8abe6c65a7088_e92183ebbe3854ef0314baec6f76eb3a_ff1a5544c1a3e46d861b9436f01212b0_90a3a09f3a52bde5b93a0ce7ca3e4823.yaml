  name: 问题定义与5WHY分析法 —— 用“期望与现状的差距”找准真问题
  points:
  - '**为什么需要这个概念？**'
  - '- 多数商业复盘与项目诊断浅尝辄止，只停留在表象（如“业绩不好”）而无法触及根因'
