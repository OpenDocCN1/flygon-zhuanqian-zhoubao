learning_targets:
- 理解母题与定位的本质区别，掌握其作为IP护城河根基的原理
- 掌握IP地基的12345框架（母题、基因、身份、观感、资产）的构成与相互关系
- 能根据用户阶段运用3重身份（工具/人/神）动态调整IP定位
- 理解4级观感（松弛/对象/获得/氛围）如何驱动感性消费行为
- 辨析5份资产（用户/版权/实物/文化/生态）的形态与复利效应
- 掌握道法术器用四层分析法看穿商业模式的骨架
- 理解Web3与以虚促实经济趋势的内涵与机会
- 掌握赛道选择中「选择比努力更重要」与容错率控制的战略原则
- 建立敬畏市场、保护团队弹药的熊市生存法则
- 理解5WHY分析法与问题定义（期望与现状的差距）在商业模式复盘中的应用
- 掌握事实与观点的区分在商业总结与决策中的关键作用
- 理解卓越策略师五大能力及其对IP打造的启示
