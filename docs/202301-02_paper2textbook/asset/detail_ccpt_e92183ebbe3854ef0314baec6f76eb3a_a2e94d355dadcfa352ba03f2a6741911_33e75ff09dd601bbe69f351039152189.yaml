- 'no': 13
  name: Web3核心定义 —— 基于区块链的可交互虚拟世界生态
  points:
  - '**为什么需要这个概念？**'
  - '- “元宇宙/NFT/DeFi”概念混淆，缺乏统一、可落地的定义'
  - '- 传统互联网(Web2)面临数据垄断、隐私泄露、创作者分成低等天花板'
  - '- 需要一个能连接“虚拟价值”与“现实资产”的新基建定义'
  - '**核心定义**'
  - '- Web3 = 基于区块链技术 + 能与现实世界交互的虚拟世界互联网生态'
  - '- 核心三要素：区块链(信任基建/确权结算) + 虚拟世界(资产载体/体验空间) + 现实交互(以虚促实/虚实映射)'
  - '- 区别于纯虚拟元宇宙：必须能“落地”现实(实物兑换、线下权益、身份映射、资产确权)'
  - '**关键性质**'
  - '- 以虚促实：虚拟资产(NFT/代币)映射现实权益(门票/股权/实物/服务)，虚实双向奔赴'
  - '- 用户拥有权：数据/身份/资产归用户，平台无权单方面冻结/删除(抗审查)'
  - '- 组织新形态：DAO(去中心化自治组织)替代传统公司，贡献即分配'
  - '**典型例子**'
  - '- 大厂NFT+线下：购买NFT获得线下门店折扣/专属服务/实物盲盒，验证“以虚促实”'
  - '- DeFi协议：代码即合约，全球资金池无许可借贷/做市，映射现实金融需求'
  - '- 链游Play-to-Earn：游戏资产上链可交易变现，玩家时间价值货币化'
  - '**边界条件**'
  - '- 技术门槛高：私钥管理、Gas费、跨链、扩容等用户体验痛点未完全解决'
  - '- 监管不确定：各国对代币发行、DeFi、NFT金融属性监管政策差异大、变化快'
  - '- 投机泡沫重：90%+项目无实业务、无现金流、纯叙事融资，归零率极高'
  - '- 基建未成熟：钱包、身份、支付、存储、预言机等中间层设施仍在建设中'
  sources:
  - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
    role: origin
  excerpts:
  - 什么是Web3? 是一种基于区块链技术的互联网生态，并且还能实现与现实世界交互的虚拟世界。
  - 随着2021年元宇宙、NFT、DiFi等市场热度词的火爆，国内外都掀起了一阵元宇宙热潮……都可以表明现实与虚拟之间的交互将会成为一种大趋势，同时会制造出更多的就业岗位。
  - 各大厂也都开始推出自己平台的NFT和线下结合，而这也符合国内所说的以虚促实的经济趋势。
- 'no': 14
  name: 传统金融转型Web3方法论 —— 扫描风向、躬身入局、链接资本
  points:
  - '**为什么需要这个概念？**'
  - '- 传统金融(券商/基金/银行)面临去杠杆、佣金下降、牌照价值稀释、人才外流'
  - '- Web3处于早期红利期，但认知门槛高、信息不对称重、骗局多'
  - '- 需要一套“低风险、高确定性、可复制”的跨界转型路径'
  - '**核心定义**'
  - '- 步骤一【扫描风向标与热度词】：持续跟踪研报/一级市场/顶级VC动向/热门叙事(如2021年元宇宙/NFT/DeFi)，建立赛道热度雷达'
  - '- 步骤二【区分赛道优劣】：用金融视角筛选——跨境电商(红海)、VR/AR(硬件未成熟)、新能源(政策强周期)、Web3(基建期/确定性高/人才稀缺/资本涌入)'
  - '- 步骤三【躬身入局/最小验证】：以“初学者身份”参与初创项目(非投资人视角)，用金融资源(人脉/研判/合规)换取核心圈层准入，实操验证可行性'
  - '- 步骤四【链接资本/结识VC】：高频参加线上线下分享会/黑客松/DemoDay，建立“懂金融又懂Web3”稀缺标签，获取优质项目分配权/投资机会'
  - '**关键性质**'
  - '- 身份降维：放下“分析师/专家”架子，做“Builder/Contributor”，才能触达核心信息流'
  - '- 资源置换：金融资源(合规/法务/资金/机构网络)是Web3项目极度稀缺的，是核心谈判筹码'
  - '- 组合投注：早期All in单项目风险极大，需以“小额参与多项目/多角色”构建组合，保留容错率'
  - '**典型例子**'
  - '- 作者本人：券商分析师 -> 关注热度词 -> 筛选Web3 -> 加入初创团队实操 -> 参加分享会结识VC -> 完成转型'
  - '**边界条件**'
  - '- 需具备传统金融/法务/合规/一级市场资源背景，纯技术/纯运营背景难复制此路径'
  - '- 熊市周期该路径失效：融资难、估值崩、项目死、人才散，需切换“进基建公司/攒弹药/待牛市”策略'
  - '- 合规红线：严禁参与违规发币/资金盘/洗钱项目，职业生涯毁灭性打击'
  sources:
  - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
    role: origin
  excerpts:
  - 2021年上半年开始，我对市场上的风向标和热度词也特别敏锐，时刻留意研报中各行各业市场的需求性。
  - 跟两个公司的合伙人说了下我的想法，自己另外去开辟Web3的赛道。然后我用金融圈的资源找到了一些国内Web3的初创团队，以一个初学者的身份参与进去。因为只有自己参与项目，才能快速的摸透行业的可行性。
  - 平时也会积极的参加一些Web3的线下或线上分享会，结识到不少行业VC。
- 'no': 15
  name: 赛道选择比努力更重要 & 容错率控制 —— 金融视角的战略风控
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者/投资人易陷入“战术勤奋掩盖战略懒惰”：拼命执行错误方向'
  - '- 资源有限(时间/金钱/精力)，方向错误=归零，方向正确=复利'
  - '- 早期All in单一赛道=赌博，非投资，生存概率极低'
  - '**核心定义**'
  - '- 【选择>努力】：前期资金规模决定关注赛道维度(小资金->高Beta高波动/大资金->低Beta稳健)；赛道选择权重>执行力权重，选对赛道躺赚，选错赛道跪死'
  - '- 【容错率控制】：给自己留“退路/弹药/时间”：1)不All in单方向 2)保留核心场外赚钱能力(现金流) 3)设定止损线(时间/金额/里程碑) 4)分批建仓/分批投入'
  - '**关键性质**'
  - '- 资金规模定策略：10万美金玩早期项目(高风险高收益)；1亿美金只能配基建/蓝筹(低风险稳健)，不可混用'
  - '- 时间周期定判断：Web3周期约4年(减半周期)，熊市磨底1-2年，牛市主升1-2年，配置需跨周期'
  - '- 信息不对称定优势：懂金融合规+懂技术落地+懂叙事造势 = 三重稀缺复合型人才，拥有定价权'
  - '**典型例子**'
  - '- Polychain/Paradigm/a16z管理数十亿-百亿美金：只投基建/协议层/顶级团队，不碰应用层/模因币，靠容错率活穿周期'
  - '- 全球对冲基金5年内配7%资产入Web3：机构化入场信号，验证赛道确定性，但也带来合规/合规新挑战'
  - '- FTX暴雷连环效应：无容错率(高杠杆/挪用资金/关联交易)的必然结局，警示“敬畏市场、保护弹药”'
  - '**边界条件**'
  - '- 仅适用于“投资/创业/职业规划”等长周期决策，不适用于“打工/考试/短期项目”'
  - '- 需具备基本金融素养(资产配置/风险管理/周期认知)，纯技术/纯销售背景需补课'
  - '- “选择”本身需要认知门槛：认知不到的赛道无法选择，需持续“扫描风向标”提升认知上限'
  sources:
  - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
    role: origin
  excerpts:
  - 有句老话，选择比努力更重要。在看赛道之前，在于你前期资金规模有多大，再决定要关注什么赛道。
  - 从金融的角度来说，要给自己一定的容错率，如果在早期仅仅是ALL IN在一个方向，风险并不是特别好控制。
  - Web3市场在10年内创造了3万亿美元的流动价值，已足以与传统投资基金投资的初创公司的总价值相媲美。
  - Polychain、Paradigm、a16z、Multicoin、3AC以及一些其他专精的公司各自管理着数十亿或数百亿美元的资金。
  - 全球大量对冲基金正计划5年内将其资产的7%投入到web3的市场中，巨无霸养老基金也开始酝酿直投了。
  - 真正活下来能够完成远航的老鸟，都懂一句话：“敬畏它，并且与它共舞”。
  - 在此温馨提示各位从事Web3的小伙伴：“不要浪费弹药”。如果你是一个有抱负的Web3公司的员工，在签约之前，记得去问招聘人员他们公司的赛道情况以及现金情况。在一个拥有大量资金弹药的“基建公司”工作绝对不是个坏的选择，这在熊市会是更好的选择。
