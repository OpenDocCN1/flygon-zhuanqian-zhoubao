unsupported_claims:
- location: ch1.4 (1.4节首段)
  claim: 业界调研提供了有力的佐证：Startup Genome 与 CB Insights 等机构的行业报告长期追踪新创项目的生死，其结论一致指向——新创项目失败的首要原因并非竞争激烈或执行力不足，而是“没有市场需求”
  reason: 素材中未找到任何关于“Startup Genome”或“CB Insights”的报告或数据；素材中只提到“市场需求”是判断项目可复制性的标准之一，但未提供该统计结论
- location: ch1.4 (1.4节首段)
  claim: 管理学中的“追随者优势”（follower advantage）理论给出了解释：后发者通过规避试错成本、借鉴成熟路径，往往能以更低风险获得可观收益
  reason: 素材中未找到“追随者优势”这一理论或相关表述；素材P001中只有“后发制人”的实践原则，无学术理论支撑
- location: ch1.5 (1.5节‘为什么需要这个概念’)
  claim: 这揭示了项目是“九宫格”或类似框架
  reason: 此描述为对P003的转述，且“九宫格”一词未在正文或素材中出现；P003原文为“任何项目都可以拆解成六个点”，并非“九宫格”
- location: ch1.5 (1.5节‘为什么需要这个概念’)
  claim: 九宫格又称六维模型
  reason: “九宫格”一词未在素材中出现；这与“唯一官方术语为六维模型”的表述不符
- location: ch1.6 (1.6节‘取舍三’)
  claim: “秦汉唐在《商业项目拆解方法论与实战复盘》……中说：‘定策略。你自己定你的产品，你的流量，你的转化，这三个端口怎么做？是复制全部还是通过你的擅长点进行微创新。’”
  reason: 素材P001中原文为“你在做副业的FUNDAMENTAL逻辑…”。该引文并非素材P001的直接引用；素材P001中提到的相关表述是“定产品、定流量、定转化”，但并非此完整引文，且“三个端口”的框架在P001中不存在
