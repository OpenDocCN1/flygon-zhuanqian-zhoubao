  name: 本书框架预览 —— 从项目库到产品、运营、放大四部曲
  points:
  - '**为什么需要这个概念？**'
  - '- 零散的方法论容易让人“学完就忘”'
  - '- 需要一张整体路线图，把选赛道、做产品、搞运营、放大的逻辑串联起来'
  - '- 让读者明确自己在哪个阶段、下一步该做什么'
  - '**核心定义**'
  - '- 本书四部曲：建立项目库（选赛道）→ 开发最小产品（卖空气/软文先行）→ 流量与转化运营 → 三大杠杆放大'
  - '**关键性质**'
  - '- 递进性：每一步建立在前一步的成果之上，不可跳跃'
  - '- 闭环性：从项目库到放大，最终形成可复制的赚钱体系'
  - '- 驱动性：前端流量是整套模式的起点和成败关键'
  - '**典型例子**'
  - '- 从“喂养算法”建立情报来源 → 拆解入库 → 八步筛选 → 卖空气验证 → 私域转化 → 三大杠杆放大收入'
  - '**边界条件**'
  - '- 学习路径需因材施教：无资源者从低成本方法起步，有团队者可着重放大环节'
  - '- 四部曲适用于可持续、可复制的项目，纯投机型项目不适用'
