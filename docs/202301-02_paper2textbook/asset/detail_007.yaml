    role: origin
  excerpts:
  - 如何从看到一个内容，产生想法，再到实战落地执行拿结果。
  - 找一个别人做过的事情，做了并且稳定有赚钱的项目。确定好赛道，给他们更匹配一点的调整就可以赚到钱。
  - 通过三个月的有意记录，就能积累几十个，形成1个项目库。
  - 整理完之后，建立项目库，然后根据流量、转化、产品交付难度等各个维度，设置权重，给他们打分。分数高的项目，不出意外，就是你接下来可以做副业的发展方向。
  - 如果你没有强执行，前面说的所有一切都是自嗨，没有用。
