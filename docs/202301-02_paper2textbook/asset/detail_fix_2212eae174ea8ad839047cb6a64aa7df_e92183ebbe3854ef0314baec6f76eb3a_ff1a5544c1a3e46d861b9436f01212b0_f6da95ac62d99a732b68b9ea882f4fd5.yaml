  name: 搜索流量追热点 —— 用“长尾词”在正文里铺设“暗门”
  points:
  - '**为什么需要这个概念？**'
  - '- 追热点光靠平台推荐流量不稳定，需要主动蹭搜索流量'
  - '- 微信搜一搜是公众号文章的流量蓝海，主动铺词才能被收录'
  - '- 区别于长期SEO，短期热点要求快速批量铺设长尾词'
  - '**核心定义**'
  - '- 搜索流量追热点指不坐等平台推荐，主动在文章正文中铺设搜索长尾词，让文章被微信搜一搜收录，从而在用户搜索热点关键词时获取搜索流量'
  - '**关键性质**'
  - '- 长尾词放正文而非标题（区别于长期SEO将关键词放标题）'
  - '- 长尾词来源三法：微信搜一搜下拉词、微信搜索栏相关搜索、5118网站长尾词查询'
  - '- 关键词颜色调暗淡以兼顾阅读体验'
  - '**典型例子**'
  - '- 追“行程码下线”热点时，把“行程卡纪念版”“行程码怎么生成”等下拉词全部放入文章'
  - '**边界条件**'
  - '- 批量做号时每篇内容、标题必须不同以增加收录概率'
  - '- 单号追热点建议用自己话转述做原创文字'
  - '...'
  sources:
  - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
    role: origin
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: apply
  excerpts:
  - 我们做的是搜索流量，那相关的搜索长尾词、搜索下拉框词语都可以放进来。文章被收录之后，读者搜索相关长尾词会搜到我们这篇文章。
  - 我在追短期热点的时候，会把这个长尾词放进文章内容中。
  - 1、微信搜一搜下拉词：打开微信搜一搜，输入关键词，会有对应的下拉词弹出；把这些下拉词全部放入文章中。
  - 2、微信搜索栏中的相关搜索：这里的相关搜索是根据你搜索的关键词来展示，也是其他用户在搜索时经常用到的词语。
  - 3、5118网站查询长尾词：5118网站有个查询长尾词功能，用这个功能查找相关长尾词。
  - 追热点文章不是需要文笔写的多好，内容迎合平台算法喜好能被收录就行。
  - 为了阅读体验感好一些，我在文章中就把这些关键词的颜色调暗淡一些。
  - 发现需求的方式也很简单，去应用商店找一些App名字，输入百度、微信、小红书，Google搜索框
- 'no': 5
  name: 批量做号矩阵 —— 用“数量”提升“命中率”
  points:
  - '**为什么需要这个概念？**'
  - '- 单账号追热点命中概率低，需要多账号矩阵摊薄风险'
  - '- 平台搜索收录具有不确定性，多发才有更多被收录机会'
  - '**核心定义**'
  - '- 批量做号矩阵指同时运营多个公众号（账号），每个号发多篇文章且全部内容、标题各不相同，以增加被系统收录的概率'
  - '**关键性质**'
  - '- 多账号同时操作（案例中12个公众号）'
  - '- 每篇内容、标题都不一样以增加收录概率'
  - '- 付费学员的“批量做号需保证内容差异性”定理'
  - '**典型例子**'
  - '- 追“行程码下线”热点时，12个公众号发布96篇文章，其中9个有效账号实现净增近4.5万粉丝'
  - '**边界条件**'
  - '- 批量做号时每篇内容、标题必须不同以增加收录概率'
  - '- 仅一两个账号追热点时应尽量用自己话转述做原创'
  - '...'
  sources:
  - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
    role: origin
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: apply
  excerpts:
  - 我用12个公众号，每个公众号8篇文章；总共发布了96篇文章，全部是这样子整合内容。
  - 要注意的一点是我96篇文章，每一篇内容都不一样；并且标题都不一样；这样做能够更好的增加被公众号系统收录的概率。
  - 如果是需要批量做号发布文章的话，要注意的一点是我96篇文章，每一篇内容都不一样；并且标题都不一样；这样做能够更好的增加被公众号系统收录的概率。
  - 如果是一两个号追热点，我建议尽量用自己的话来转述一下文章，变成原创文字；就更容易被微信系统收录。
  - 12个公众号中仅9个获得流量，其中3个未上排名，即75%的账号实现了有效涨粉，说明批量矩阵策略下多数账号可命中搜索流量。
