  - '- 需评估平台调性差异与内容适用性'
  - '**典型例子**'
  - '- 在抖音做烂的项目内容，优化后搬到小红书瞬间爆火'
  - '**边界条件**'
  - '- 需注意内容版权风险与平台规则差异'
  - '- 信息差搬运不等于简单复制，需优化调整'
  - '...'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
