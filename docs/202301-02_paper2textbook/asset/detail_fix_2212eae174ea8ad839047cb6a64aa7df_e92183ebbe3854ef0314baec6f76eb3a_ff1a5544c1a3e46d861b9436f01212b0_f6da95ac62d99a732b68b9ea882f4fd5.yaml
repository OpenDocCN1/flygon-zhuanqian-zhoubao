    role: apply
  excerpts:
  - 渠道其实是有信息差的，我们做过很多项目，其实吃的就是信息差，有些项目在抖音上做得很烂的，但是如果你搬到小红书上面，瞬间就爆了。有些项目在小红书上面做的人很多了，那你把同样的内容优化一下，搬到抖音上，也有可能把它做爆。
  - 抖音的热度内容不一定在视频号爆
  - 蓝海之所以是蓝海，是因为流量大，竞争小。而之所以竞争小，是因为99%的抖音达人并不懂搜索逻辑，更别谈运用搜索逻辑，能获得长久流量的，更多是靠运气蹭上的。
