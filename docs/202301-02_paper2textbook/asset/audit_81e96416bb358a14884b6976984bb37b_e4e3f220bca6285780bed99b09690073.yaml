unsupported_claims:
- location: ch16.3
  claim: 群主获得执行动力、外部监督、信任沉淀、内容素材（据作者实践归纳）（素材ID：P001）
  reason: 素材P001中只提到了群主通过云监工获得持续的执行动力与信任沉淀，但未提及'内容素材'这一价值
- location: ch16.4
  claim: 高额的失败基金（如1000元）会吸引一批'红包猎人'
  reason: 素材P001原文仅说'失败瓜分的金额设置得很低，这能筛选掉只是被红包吸引的人'，并未对高额失败基金吸引的具体人群做描述或断言
- location: ch16.5.2
  claim: 第3步'复利性'……积累的拆解能力可反复用于判断新项目
  reason: 素材P001原文只描述了举一反三的两个想法（逻辑一致与拆解思路值得练习），并未提及'复利性'或'积累的拆解能力可反复用于判断新项目'
- location: ch16.6
  claim: 观点：……核心是让老师的单位时间价值最大化
  reason: 素材P005原文的核心主张是'要做出高质量，落地性强的训练营，老师就不能脱离一线'，并未直接提出'让老师的单位时间价值最大化'这一主张
- location: ch16.6
  claim: 若你……1v1会耗费大量时间、需要重复回答非常多的问题……（素材ID：P005）
  reason: 素材P005原文并未直接说明为何1v1是优先级最低的选项原因，'耗费大量时间、需要重复回答、碎片化信息'这些具体原因在素材中未找到
- location: ch16.6
  claim: 维度5'遇到问题以及如何解决'，是一个复盘指标……记录并分享解决问题的过程。这既有助于学员自身成长，也为'百问百答'沉淀了素材。
  reason: 素材P005原文仅列出打卡模板的6个维度，未对各维度的设计意图（复盘指标、沉淀素材等）进行解释
- location: ch16.7
  claim: 免费工具（如千聊）……对特定类目的课程（如星座玄学、医疗、金融财经、部分教育培训行业、非课程教学、线下履约、跨境电商、抖音培训等，据原文完整列举）实施严厉的风控措施
  reason: 素材P005原文没有列举这些具体被风控的类目，该列举在素材中找不到支撑
- location: ch16.7
  claim: 应对策略是多平台/多载体布局（飞书+微信群+千聊/小鹅通）
  reason: 素材P005原文仅提到在千聊平台遇到资金冻结问题，未提出多平台布局的应对策略
- location: ch16.9
  claim: 理性做法是采用'标准化为主，个性化为辅'的混合策略……既能保证服务质量的下限（标准化），又能提升服务体验的上限（个性化）
  reason: 素材P005原文并未提出'标准化为主，个性化为辅'的具体混合策略
- location: ch16.2
  claim: 地毯式阅读法……打破信息茧房
