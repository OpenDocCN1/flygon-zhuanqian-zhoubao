- location: ch16.2
  claim: 目标需有挑战性且奖励有吸引力
  reason: 素材P001原文为'目标必须有挑战性但又有达成可能，才能激发监工的好奇心与围观欲'，在应用边界部分提及目标挑战性，但未明确提及'奖励有吸引力'作为前提条件
- location: ch16.11
  claim: 云监工玩法的本质，是为你的人生马拉松组建一支可持续的陪跑团
  reason: 素材P001原文是一个快闪群玩法，并未将其定义为'可持续'的陪跑团
- location: ch16.11
