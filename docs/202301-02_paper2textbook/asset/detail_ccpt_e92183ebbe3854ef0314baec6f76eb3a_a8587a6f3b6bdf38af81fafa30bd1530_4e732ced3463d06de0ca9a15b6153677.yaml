units:
- 'no': 1
  name: 4C动态量化股权分配模型 —— 给切蛋糕装上“电子秤”
  points:
  - '**为什么需要这个概念？**'
  - '- 初创团队常因股权分配不公导致拆伙，核心原因是对各自“重要程度”判断不一致'
  - '- 传统谈判式分配靠吵、靠关系，缺乏客观标准，事后难以服众'
  - '- 需要一个可量化、可复盘、能达成共识的工具把定性争论变成定量计算'
  - '**核心定义**'
  - '- 将资本拆解为人力资本与货币资本，细分为创始人身份、岗位权重、时间投入、资金投入四个维度'
  - '- 每个维度设定参考权重区间（创始人身份10%-30%、岗位权重30%-40%、时间投入10%-25%、资金投入20%-50%）'
  - '- 通过“自评+互评”锚定权重，再按五步法计算各股东最终持股比例'
  - '**关键性质**'
  - '- 动态可调：权重非固定，随赛道类型（技术驱动/资金驱动、自主/孵化）微调'
  - '- 共识机制：必须经创始团队自评互评达成一致，否则模型失效'
  - '- 起点非终点：算出比例仅是起草，后续仍需配套一致行动权、期权池、回购条款等合同规范'
  - '**典型例子**'
  - '- 儿童体能训练项目：三合伙人启动资金200万，经自评互评定岗位权重7:2:1、时间投入6:3:1，结合出资额算出最终股权比例'
  - '**边界条件**'
  - '- 仅适用于早期初创团队，上市后或引入机构投资后需转为律师主导的法律架构设计'
  - '- 若团队无法就维度权重达成共识，模型无法运转，需先解决信任问题'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 今天给大家提供一个工具，这个工具的名称叫 4C 动态量化股权分配模型。4C中的C，就是资本的意思，资本我们分为人力资本和货币资本。再细分成4个维度的话，就是创始人身份、岗位权重、时间投入、资金投入。这四个维度是这个工具里面已经给大家植入的一个参数，这个参数是在一定的范围内波动的。
  - 创始人身份的权重通常在10%-30%。岗位权重通常在30%-40%。时间投入的权重通常在10%-25%。资金投入的权重通常在20%-50%。
  - 在确认四个维度的权重比例后，我们会按照五步法来计算出各个股东的最终股权比例……第一个步骤：确定行业和赛道……第二个步骤：收集创始团队信息……第三个步骤：确定每个维度的权重比例……第四个步骤：确定股东四个维度的权重系数……第五个步骤：计算出各个股东的股权比例。
  - 这个分歧在我们前期做股权设计的时候，大家可能不容易发现，但是在公司发展壮大的过程中，越到后面越会产生一些隐患。因为大家从一开始对自己的重要程度的判断就是不一致的，大多数合作伙伴拆伙，就是觉得自己最重要，出力最多，但是分到的钱又不是最多。
  - 这个股权比例分配是最最简单的一个环节，并不是说，按这个比例算出来的，就是最终体现在工商商事主体上的最后结果。在算完初步的股权分配后，我们还会有其他一系列的合同规范和调整，比如一致行动权，期权池，分红奖励，回购权，纯资金方投资的优先清算权，领售权，等等等等。
- 'no': 2
  name: 创始人身份 —— 谁兜底谁说了算
  points:
  - '**为什么需要这个概念？**'
  - '- 公司对外必须只有一个声音，必须明确最终决策者和兜底者'
  - '- 很多团队把创始人当荣誉头衔分，导致出事时没人敢担责'
  - '**核心定义**'
  - '- 创始人身份不是荣誉，而是风险承担者的代名词：谁愿无条件为项目兜底，谁就是创始人'
  - '- 在4C模型中权重10%-30%，虽非最高但最关键，决定控制权归属'
  - '**关键性质**'
  - '- 排他性：一家公司只能有一个真正的创始人身份持有者（或明确的控制权集合）'
  - '- 先发性：必须从项目开始就极度明确，不能等出事再指定'
  - '**典型例子**'
  - '- 素材中儿童体能项目案例：小明作为发起人承担创始人身份，虽出资仅50万但掌握控制权'
  - '**边界条件**'
  - '- 若有多个联合创始人，需通过一致行动协议落实单一决策声音'
  - '- 纯财务投资人（LP）不具备创始人身份，不参与运营控制'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 1.创始人身份它其实是最重要的，我认为谁承担最大的风险，谁就最有控制整个企业的需要。……谁来最后承担这个兜底的人，那么我会认为这个人他就是发起人和创始人。……创始人身份的权重通常在10%-30%。
  - 在我看来，它其实代表着风险承担，就谁最后在兜底。当这个项目不成立或这个项目遇到了极大的风险，谁愿意无条件的去为这个项目兜底，那这个人就是创始人，他对这个项目的付出程度是跟其他的合伙人完全不一样。
  - 创始人的身份是要极度明确的，从一开始就要很明确，它是要能控制这个项目的，一家公司最后对外的时候，应该只有一个声音。
- 'no': 3
  name: 岗位权重 —— 找到行业的“技术壁垒在哪个工位上”
  points:
  - '**为什么需要这个概念？**'
  - '- 不同赛道核心竞争力所在岗位不同，技术驱动型重研发，销售驱动型重市场'
  - '- 合伙人常高估自己岗位价值，导致隐性矛盾随公司壮大爆发'
  - '**核心定义**'
  - '- 反映行业技术壁垒所在的关键岗位权重，权重区间30%-40%'
  - '- 需结合赛道类型判断：技术驱动型项目研发岗权重高，资金驱动型项目渠道/销售岗权重高'
  - '**关键性质**'
  - '- 赛道相关性：同一岗位在不同赛道权重天差地别'
  - '- 隐性冲突源：前期不易察觉，后期最易引发利益撕裂'
  - '**典型例子**'
  - '- 儿童体能项目：教练/运营岗为核心壁垒，小明负责该岗位获岗位权重系数7，远高于小磊2和小胡1'
  - '**边界条件**'
  - '- 随公司发展阶段变化，核心岗位可能迁移（如早期重产品、后期重销售），需动态调整'
  - '- 避免将岗位权重等同于职级工资，二者维度不同'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 2.岗位权重，就是这个行业技术壁垒在哪里，那个岗位是最重要的。……这个分歧在我们前期做股权设计的时候，大家可能不容易发现，但是在公司发展壮大的过程中，越到后面越会产生一些隐患。……岗位权重通常在30%-40%。
  - 我们要先确定赛道，也就是你所处的行业，不同的赛道，对资金和技术的权重不一样。我们把行业分成2个维度四个类型，分别是技术驱动型/资金驱动型，以及自主创业型/集团孵化型……
- 'no': 4
  name: 时间投入 —— 不止全职兼职，要看“产出匹配里程碑”
  points:
  - '**为什么需要这个概念？**'
  - '- 约60%项目里除财务投资人外全员全职，单纯区分全职/兼职失去区分度'
  - '- 关键在于投入的时间精力是否匹配项目里程碑进展，以及愿意引入何种外部资源'
  - '**核心定义**'
  - '- 衡量维度：投入时间精力大小 + 愿意引进的资源 + 产出是否匹配里程碑'
  - '- 权重区间10%-25%，按1-10分制打分量化'
  - '**关键性质**'
  - '- 里程碑绑定：时间价值取决于业务进度匹配度，而非工时长短'
  - '- 资源外溢：含隐性引入资源（人脉、渠道、信息）能力'
  - '**典型例子**'
  - '- 体能项目案例：小明全职运营匹配里程碑得6分，小磊兼职配合得3分，小胡仅出资不参与运营得1分'
  - '**边界条件**'
  - '- 需前期约定里程碑标准，否则事后扯皮无据'
  - '- 兼职不代表低分，若兼职引入关键资源可得高分'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 3.时间的投入，最简单的划分就是全职还是兼职，投入精力的大小等。时间投入的权重通常在10%-25%。
  - 但是大家有没有想过，就是其实有 60% 左右的项目，所有的合伙人除了纯财务投资人之外，其实都是全职参与的。只是说你全职参与的这个产出它是不是就能匹配的到这个项目的所有的进展，项目到达的里程碑是不是跟你全职参与有必然关系。所以我们前期在做股权设计的时候，就一定要讲清楚，这个时间投入，它对应的除了是我们投入的时间精力，还有我们愿意引进的资源，愿意为了这个项目付出多少，不单单只是一个全职兼职。
- 'no': 5
  name: 资金投入 —— 用真金白银投票表决信心
  points:
  - '**为什么需要这个概念？**'
  - '- 资金投入不仅是输血，更是判断合伙人对项目信心和风险意愿的硬性信号'
  - '- 谁愿下重注，谁就更有动力推动项目成功'
  - '**核心定义**'
  - '- 指项目前期实际到账出资额，权重区间20%-50%'
  - '- 可通过出资比例、出资节点、是否追加投资等量化打分'
  - '**关键性质**'
  - '- 信号价值：出资额度反映合伙人风险偏好与信心度'
  - '- 杠杆作用：资金驱动型项目中该维度权重上限可达50%'
  - '**典型例子**'
  - '- 体能项目：小胡出资150万占启动资金75%，资金投入系数最高；小明出资50万；小磊不出资系数最低'
  - '**边界条件**'
  - '- 纯财务投资人（LP）仅参与资金投入维度，不参与其他三维度'
  - '- 资金到位节点（注册前/后、分期到账）影响实时权重计算'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 4.资金的投入。这个比较好理解，所有的项目都会有一个前期资金的投入。……我们可以通过时间投入和资金投入去判断这个合伙人他对项目的信心和他愿意承担多大的风险。资金投入的权重通常在20%-50%。
- 'no': 6
  name: 股权分配五步法 —— 从吵架到算账的标准化动作
  points:
  - '**为什么需要这个概念？**'
  - '- 将主观博弈转化为标准化流程，降低沟通成本，提升公平感'
  - '- 给新手创业者提供“拿来即用”的操作手册'
  - '**核心定义**'
  - '- 步骤1：确定行业赛道（技术/资金驱动 × 自主/孵化）定基础权重区间'
  - '- 步骤2：收集创始团队信息（全职/兼职、岗位分工、出资额度）'
  - '- 步骤3：自评互评确定四维度权重比例（达成共识是前提）'
  - '- 步骤4：各股东四维度打分1-10分得权重系数'
  - '- 步骤5：加权计算最终股权比例'
  - '**关键性质**'
  - '- 共识前置：步骤3未达成共识则后续步骤无意义'
  - '- 可追溯：每步留痕，事后复盘有据可查'
  - '**典型例子**'
  - '- 体能项目完整演示：赛道定为自主创业+技术驱动型 → 收集三人信息 → 自评互评定权重 → 打分系数 → 算出比例'
  - '**边界条件**'
  - '- 仅输出初步比例，必须配套法律文件（一致行动权、期权池、回购条款等）才能落地'
  - '- 适用于3-5人核心团队，人数过多建议引入持股平台简化决策链'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 在确认四个维度的权重比例后，我们会按照五步法来计算出各个股东的最终股权比例，下面带大家一起过一个真实案例。
  - 第一个步骤：确定行业和赛道……第二个步骤：收集创始团队信息……第三个步骤：确定每个维度的权重比例……第四个步骤：确定股东四个维度的权重系数……第五个步骤：计算出各个股东的股权比例。
  - 我们要先确定赛道，也就是你所处的行业，不同的赛道，对资金和技术的权重不一样。我们把行业分成2个维度四个类型，分别是技术驱动型/资金驱动型，以及自主创业型/集团孵化型……
  - 我们要开始收集合伙人的信息，也就是创始人的信息和其他联合创始人的信息。以及这个项目里面谁是全职，谁负责哪个岗位，各自出资额度等。
  - 这涉及到刚刚说的另一个工具，创始团队之间的自评和互评，从而达成一个共识，股东们要先认可这个赛道的这4个维度就是在这样的一个区间波动微调。
  - 我们确定了每个维度的权重比例之后，就要确定股东四个维度的权重系数，按从 1 到 10 各自去打分……
- 'no': 7
  name: 中介费伪概念 —— 信息差是中介费的唯一护城河
  points:
  - '**为什么需要这个概念？**'
  - '- 传统中介靠垄断房东电话收取高额费用，用户痛点极强'
  - '- 互联网本质是消除信息不对称，中介费本质是“智商税”'
  - '**核心定义**'
  - '- 中介费之所以能收取，仅因买房/租房者不知道业主联系电话'
  - '- 一旦信息透明化（平台直接连接房东租客），中介费即失去存在合理性'
  - '**关键性质**'
  - '- 伪概念本质：非服务定价，纯信息垄断定价'
  - '- 可被平台模式（撮合交易+会员费/佣金）替代'
  - '**典型例子**'
  - '- 胖龟找房：自建小程序+线下门店，不收中介费，改收年费会员费、开发商返佣、代办费、租房佣金（由二房东承担）'
  - '**边界条件**'
  - '- 仅适用于标准化程度高、流程可SOP的租售场景'
  - '- 复杂产权、纠纷房源仍需专业中介介入，非全量替代'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 我们不收中介费，是因为中介费本身就是个伪概念！为什么说是伪概念，因为是智商税，中介费为什么要收？就是因为买房及租房者不知道售房及出租转让业主的联系电话！
  - 如果买房者或者租房者知道房东电话！那么他们还会给中介公司掏中介费吗？nonononon，绝对不会！这叫什么？是不是信息不对等差造成的信息差？
  - 生意的本质就是信息差，在互联网里也存在大量的信息差生意。以这个信息差为市场的切入点我们创办了胖龟找房的 1.0——没有中介费的个人房屋分享平台。
- 'no': 8
  name: 个人房屋分享平台 —— 做“连接器”而非“中介”
  points:
  - '**为什么需要这个概念？**'
  - '- 58、安居客、贝壳本质是“网上中介公司”，联系人全是置业顾问'
  - '- 用户需要直接对接房东，而非被中介筛选、推销'
  - '**核心定义**'
  - '- 定位为第三方平台，但不收中介费，仅提供信息撮合、工具赋能、流程SOP'
  - '- 核心差异：联系人直接是房东/房主，平台不赚信息差钱'
  - '**关键性质**'
  - '- 双边网络效应：房源多→租客多→房东更愿挂房源'
  - '- 信任机制：平台提供合同模板、资金托管、带看SOP等信用增级服务'
  - '**典型例子**'
  - '- 胖龟扑房1.0/2.0/3.0迭代：从卖房信息→居家生活平台→0中介费租房平台'
  - '**边界条件**'
  - '- 需自建房源库（物业、水电费号、同行转化三渠道）解决冷启动'
  - '- 必须解决“房东不愿直面租客”的心理障碍（提供代看、代签服务）'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 我们不是房屋中介公司，因为我们不收取中介费！我们是第三方平台，但是又跟其他的第三方平台不一样，我们做的是个人房屋分享平台。
  - 58同城里面的房源有个人有中介，大多数置顶，首页的房源全是房屋中介的置业顾问发布的房源。安居客，贝壳找房，房天下，里面全是房源，但联系人全是各个房屋中介公司的置业顾问！（伪第三方平台，其实就是网上房屋中介公司...）
  - 因为平台上的客户全是有需求的，没有需求的客户是不需要来浏览的，那么活跃在胖龟找房里面的客户都是准客户。胖龟找房建立这个第三方平台撮合买方与卖方匹配，互利，解决需求及痛点，产生良性循环。
- 'no': 9
  name: 蹭流截流开店 —— 借对手流量打对手脸
  points:
  - '**为什么需要这个概念？**'
  - '- 传统中介门店自带精准自然客流，新平台缺流量、缺信任'
  - '- 选址成本高、引流难，需低成本获取高意向客群'
  - '**核心定义**'
  - '- 在传统中介旗舰店隔壁开小店，门头打“0中介费”截流对手自然客流'
  - '- 仅做引流转化，不做重资产运营，利用对手品牌势能完成冷启动'
  - '**关键性质**'
  - '- 成本不对等：对手付房租养客流，己方付房租收客流'
  - '- 心理冲击：用户进对手店发现隔壁免中介费，极易转单'
  - '**典型例子**'
  - '- 涧西区标杆中介店隔壁开店：截流大量顾客，导致对手销售额连降、店员不敢带客进店'
  - '**边界条件**'
  - '- 仅适用于线下高频、标品、决策周期短的业务（租房、二手房）'
  - '- 需承受对手恶意投诉、同行打压等非市场竞争风险'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 传统的中介店会有大量的客户到店，我们只需要在隔壁开一家小店，很小的一家店，就会有源源不断的客流通过我们店铺门前。只用做好引流跟转化就行了。
  - 用互联网的专有名词，就是蹭，蹭其他中介的流量，然后通过我们的门头标语：买二手房，租房，"0"中介费。来吸引用户到店，以达到截流的目的。
  - 一个典型的案例，我们这边有个涧西区，涧西区有个中介门店，该门店是整个洛阳市区里的标杆店跟销售冠军门店。我们在这个店的隔壁开了一家店，门头就是“0 中介费”。自从开了店以后，截流隔壁门店好多顾客，导致这家门店销售额接连下降，店员也不敢带顾客去店里面谈了。
- 'no': 10
  name: 二房东渠道 —— 让最痛的人买单
  points:
  - '**为什么需要这个概念？**'
  - '- 租房业务中，租客不愿付中介费，房东不愿管琐事'
  - '- 唯有二房东（长租公寓、分散式公寓运营方）因空置即亏损，有最强付费动力'
  - '**核心定义**'
  - '- 租房业务变现主体：由二房东承担原租客端的中介费/佣金'
  - '- 通过58同城、美团公寓、长租公寓老板等渠道批量获取二房东资源'
  - '**关键性质**'
  - '- 痛点精准匹配：二房东“空置一天损失一天房租”→ 极强出房动力'
  - '- 复购高、决策快：二房东手握多套房源，单次成交即建立长期合作'
  - '**典型例子**'
  - '- 胖龟找房租房业务：锁定二房东为付费方，配房-带看-成交全流程SOP服务二房东出房'
  - '**边界条件**'
  - '- 需建立房东/二房端信任体系（合同规范、资金托管、维修响应）'
  - '- 受限于城市租赁政策（如杭州政府自建0中介费平台形成政策性竞争）'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 我们推演了很多，也会见了很多房东，最后我们找准了二房东这个渠道。因为二房东手上不单单就一间房子，他需要快速的让自己的房子租出去不能有空置，因为每空置一天，房租的费用就需要自行来承担。
  - 配房-带看-成交标准流程...由后台人员，根据租户提供的租房需求，按照公司的房源表进行精准匹配房源...引导客户自己去看房...联系房源所属的房东，二房东，管理公司等，在最短的时间内到房间内给客户签署租房合同...
