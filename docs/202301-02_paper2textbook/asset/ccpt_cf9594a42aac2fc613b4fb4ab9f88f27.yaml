paper: docs/202301-02/20230207_10.md
desc: 该素材是‘龙哥赚钱周报’系列中的一期（2022年11月22日发布），内容为一份赚钱相关的信息汇总周报。素材核心并非方法论研究，而是运营层面的一个突发状况说明：本期周报因被语雀平台判定违规而无法在线上传，作者（小懒）因此提供离线版PDF供读者查阅，并邀请读者反馈敏感内容以便后续处理后再上传。
concepts:
- name: 平台内容合规审核
  desc: 在线内容发布平台（语雀）对上传内容进行自动或人工的违规判定，导致内容无法正常公开显示的现象。
  is_original: false
  excerpt:
  - 本周周报被语雀判违规了，无法上传。
  - 大家可以先用离线版查看，有感觉哪块比较敏感的跟小懒说，小懒去除一下再上传。
- name: 离线版内容分发
  desc: 当在线渠道受限时，通过网盘等非平台渠道分发内容PDF，以绕过平台审核限制的临时替代方案。
  is_original: false
  excerpt:
  - 离线版 pdf：https://lazyman.lanzoul.com/igkkJ0glsn4d
methods:
- name: __overview__
  desc: 素材未提出具体赚钱方法论或系统化流程，仅是一个运营应急处理流程：发现平台违规→告知读者→提供替代渠道→征集敏感内容反馈→修订后重新上传。
  excerpt:
