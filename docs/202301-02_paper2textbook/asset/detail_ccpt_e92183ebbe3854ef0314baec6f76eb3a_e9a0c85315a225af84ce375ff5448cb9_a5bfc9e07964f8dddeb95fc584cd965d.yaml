  - 今天这 7 个店营业额加起来 7858，平均到单店营业额就是 1122，正常毛利在 30%左右，单店一天的利润也就 3，400 左右。
  - 多起一些店，再精细点做，平均一个店能做到月利润 1W 左右，做 10 个店就是 10W 了！
  - 基于淘系经验总结电商平台演进规律：铺货、动销、精细化、玩趋势四个阶段，可用来预判新平台（美团、TEMU）的机会
- 'no': 10
  name: MVP先卖后做 —— 用预售验证需求，规避“造没人要的产品”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统创业：花月时间做产品 → 上线无人问津 → 沉没成本巨大'
  - '- 90%项目死在“做了没人要”，而非“做不好”'
  - '- 需要一种“零成本、高确定性、可批量测试”的验证范式'
  - '**核心定义**'
  - '- MVP验证核心：先卖想法/预售/收定金，不做产品'
  - '- 判断标准：聊100人只有几个买=有问题；20-30人买单交预售金=需求验证通过'
  - '- 可在短时间内测试几十个产品，筛选大于培养'
  - '**关键性质**'
  - '- 反直觉：不解决问题、不是好产品，也能赚钱（卖空气、做局套话）'
  - '- 速度优先：完成第一单即验证通过，完美主义是最大敌人'
  - '- 资源匹配：验证通过后，再匹配资源（找供应链、招人、做交付），不匹配不启动'
  - '**典型例子**'
  - '- 外卖CPS：第一天盈利100+，2月10万/月，3月突破20万/月，总盈利200万+'
  - '- 副业课程：3个月盈利100万+'
  - '- AI绘画小程序：因预算超预期、无执照、工期长、流量风险，理性止损放弃'
  - '**边界条件**'
  - '- 仅适用于“可预售、可分期交付、用户容忍度高”的虚拟/服务/定制类产品'
  - '- 标品/刚需/强监管类（医疗、食品、硬件）预售风险极高，甚至违法'
  - '- 需要极强的“卖想法”文案/话术/信任背书能力，否则连预售都卖不出去'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_09.md
    role: apply
  - paper: docs/202301-02/20230207_08.md
    role: critique
  excerpts:
  - 比如最重要的是先卖产品的想法，而不是做产品。如果聊了 100 个人，只有几个人买，肯定有问题；如果 20-30 个人购买，交了预售金，那这个不确定因素就解决了。
  - 这样我们就能够在短时间内测试几十个产品，最后得出一个正确选项，这是最好的验证方式。因为筛选大于培养，尝试次数多了就知道哪个是比较好的方案。
  - 外卖cps：第一天就实现盈利100块钱+、2个月盈利做到10w/月、第3个月盈利突破20w/月，总盈利超过200万+
  - 最终我放弃了，原因如下：1.预算远远超出了预期... 2.没有个体和公司执照... 3.工期在 15-20 天左右，对于热点来说，这个时间怕是早就凉透了。
- 'no': 11
  name: 资源匹配度评估 —— 不做“好项目”，只做“适合我的项目”
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常犯错：严重低估已有资源，过分高估新项目，盲目All In陌生赛道'
  - '- 项目成败取决于“项目需求资源”与“自有资源”的匹配度，而非项目本身好坏'
  - '- 需要一套结构化的“资源盘点→项目拆解→匹配决策”工具'
  - '**核心定义**'
  - '- 三步法：①盘点自有资源（粉丝、经验、软件、团队、案例、渠道、资金等）；②拆解目标项目所需关键资源；③评估匹配度，匹配度高（如100%）即启动，低则放弃或补齐'
  - '- 核心判据：我是否已具备该项目最关键的1-2个核心资源？（如流量渠道、供应链、转化话术）'
  - '**关键性质**'
  - '- 避坑神器：帮你过滤掉“看起来很美、做起来要命”的伪好项目'
  - '- 复利思维：在已有资产上叠加新业务，边际成本低、成功率高、抗风险强'
  - '- 动态更新：资源随项目积累变化，定期复盘重新匹配'
  - '**典型例子**'
  - '- 作者：公众号经验+流量+人+项目 = 匹配外卖CPS/副业课程（匹配度100%），3月赚100万、总利润300万'
  - '- 反例：此前多项目累计亏损100万+，皆因资源错配（如做不懂的重运营项目、无供应链做电商）'
  - '**边界条件**'
  - '- 核心资源必须是“显性、可迁移、可复用”的（如渠道、品牌、SOP），隐性经验/人脉难量化'
  - '- 新赛道/新模式若无任何资源匹配，建议“打工/合伙/小额试错”积累资源后再启动'
  - '- 避免陷入“只有锤子，满世界找钉子”的资源锚定偏见'
  sources:
  - paper: docs/202301-02/20230207_09.md
    role: origin
  - paper: docs/202301-02/20230207_06.md
    role: improve
  excerpts:
  - 第一步：盘点自己手里有哪些资源
  - 第二步：拆解项目需要的资源
  - 我以自己举例……那么我的资源就是：公众号经验+流量+人+项目=找到适合公众号变现的方法就可以直接开始
  - 所以对我来说这个项目和我匹配程度就是 100%，因为：公众号经验、美团饿了么平台、导流方法，我都有。
  - 很多人都有一个误区，那就是严重低估已有项目，同时过分高估新的项目
  - 战略就是先审视自己手里的筹码，也就是自己的优势，然后再决定自己怎么打牌，也就是如何运用自己的优势来获得你想要的结果。
