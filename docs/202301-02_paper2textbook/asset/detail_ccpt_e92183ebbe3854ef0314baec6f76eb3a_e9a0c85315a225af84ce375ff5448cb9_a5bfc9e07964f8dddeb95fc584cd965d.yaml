  name: 商业拆解复制法 —— 把“赚钱的别人”拆成“可复制的SOP”
  points:
  - '**为什么需要这个概念？**'
  - '- 同行是最好的老师，抄同行是最快捷径，能避开90%弯路'
  - '- 但凡是“抄表面”（抄文案、抄图、抄品），不抄底层链路（流量从哪来、怎么转化、怎么交付、怎么裂变），必死无疑'
  - '- 需要一套标准化的“商业X光机”，透视同行全链路'
  - '**核心定义**'
  - '- 核心动作：刷短视频/搜关键词找同行 → 以客户身份套话/下单/进群 → 拆解：前端内容/渠道、中端引流/私域、后端产品/转化/交付/裂变 → 判断可复制性（货源非独家、场景验证有需求、门槛可跨）
    → 低成本复制启动'
  - '- 关键判断点：货源是不是他的？场景需求是不是真的？我能不能搞到货？我能不能跑通流量？'
  - '**关键性质**'
  - '- 确定性优先：不需要偶然性，要确定性；设计两条腿走路（如公域+私域、达人+矩阵）'
  - '- 快速验证：拆解后立即用MVP验证，跑通再放大'
  - '- 迭代进化：抄同行起步，微创新（材质/包装/服务/组合）建立护城河'
  - '**典型例子**'
  - '- 儿童游乐项目：拆解爆款视频，判断货源非独家+场景验证有需求，3月招40+加盟商赚40万'
  - '- 设计Logo/艺术签名：免费素材全网有、爆款概率大、验证可复制变现'
  - '- 闲鱼套利：拆解“低买高卖”底层逻辑，验证飞利浦音响、360U盘、欧普台灯三个案例均盈利'
  - '**边界条件**'
  - '- 仅适用于“非强专利、非强品牌、非强供应链、流程可标准化”的轻资产项目'
  - '- 核心风险：平台规则变动、供应链断供、同行反制、法律合规（侵权/虚假宣传）'
  - '- 拆解能力依赖商业直觉与经验，新手易“看不透本质、抄不全链路”'
  sources:
  - paper: docs/202301-02/20230207_08.md
    role: origin
  - paper: docs/202301-02/20230207_03.md
    role: improve
  excerpts:
  - 同行就是最好的老师，抄同行永远是做项目最快的途径，能避开多数弯路和无用功。
  - 每个项目都有关键词，通过关键词在各个推广渠道搜索这个项目的关键词就一定可以找到同行。
  - 我们以客户的角度去思考如果我想要买这个产品，我会在哪去搜关键词，自然也可以找到同行的流量渠道。
  - 拆下来之后，我就发现很多时候有些项目是完全可以复制的，是不需要投入几十万也可以复制的。
  - 分析完上述内容后，我基本上判断这个项目是可以复制的。首先，这个视频爆得偶然；其次，他货源不是他自己的；最后，这个消费场景经过验证是证明是有需求的。
