units:
- 'no': 1
  name: 私域单客价 —— 从单次交易转向全生命周期价值
  points:
  - '**为什么需要这个概念？**'
  - '- 传统电商只关注单次客单价，忽视用户长期价值'
  - '- 公域流量成本越来越高，获客即亏损，必须靠复购回本'
  - '- 私域流量属于自己，可反复触达、低成本运营，天然适合做长期价值'
  - '**核心定义**'
  - '- 单客价：单个消费者在整个生命周期内贡献的总销售额'
  - '- 核心公式：单客价 = 客单价 × 购买频次 × 生命周期（年）'
  - '- 关注点从“单次卖多少”转移到“这个人能陪我走多久、买多少次”'
  - '**关键性质**'
  - '- 复利属性：用户留存越久、买得越频繁，边际获客成本趋近于零'
  - '- 反直觉：前端甚至可以亏损获客（如9.9元引流品），后端靠高单客价回本盈利'
  - '- 可量化：通过“实时真实ROI”模型，将私域年产值纳入投产比核算'
  - '**典型例子**'
  - '- 视频号直播卖150元客单价产品，进粉率60%，月产值15元，年产值60元，私域ROI从2.5提升至3.5甚至4.5'
  - '- 捡漏群：单群成本7000元，3个月回本，生命周期2年，单群纯利2.1万，投资回报率3-4倍'
  - '**边界条件**'
  - '- 仅适用于高复购、高信任、可长期服务的品类（如消耗品、教育、会员制）'
  - '- 需要成熟的私域运营体系（SOP、社群、人设、售后）支撑，否则用户流失快'
  - '- 非刚需、低频品类（如耐用家电、装修）单客价天花板极低，强行做私域反而增加成本'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/202301-02/20230207_06.md
    role: improve
  excerpts:
  - 电商有个'客单价'的概念，而在私域流量运营的思维下，真正值得关注的不是'客单价'，而是'单客价'，就是一个消费者总共贡献了多少销售额。
  - roi2.5 也就是我 100 万的营业额，需要有 40 万的广告投放，那么在这 40 万的投放算到私域中，我将额外有 100 万×60%×60/150=24
    万的私域营业额，这一块是无需投放的……这么一算我的 roi 就从 2.5 提升到了 3.5。
  - 假设一个社群 7000 成本，3 个月回本，之后每个月可以产生 1000 的利润，21 个月还能产生 2.1W 的纯利润。
  - 私域成交有逻辑、有章法…我把整套成交逻辑整理成了五位一体成交飞轮：①破冰——好感建立、②诊断——放大需求、③方案——成交铺垫、④信任——突破抗拒、⑤成交——引导下单。
- 'no': 2
  name: 实时真实ROI —— 让隐形资产显性化参与决策
  points:
  - '**为什么需要这个概念？**'
  - '- 传统ROI只算广告直接带来的单次转化，忽略私域沉淀的长期价值'
  - '- 导致老板不敢加预算、不敢投流，误判项目真实盈利能力'
  - '- 需要一个把“看不见的未来钱”算进“现在账本里”的方法'
  - '**核心定义**'
  - '- 实时真实ROI = (直播间毛利 + 私域预估年产值) / 广告投入'
  - '- 私域预估年产值 = 直播间成交客数 × 进粉率 × 单客月产值 × 12个月 × 衰减系数'
  - '- 核心变量：客单价(n)、毛利率(q)、进粉率(60%合格线)、月产值(p)、衰减率(前3月80%)'
  - '**关键性质**'
  - '- 决策导向：算完真实ROI，敢投流、敢加预算、敢招人'
  - '- 动态模型：随运营优化（提升月产值、延长生命周期），ROI会持续跃升'
  - '- 反脆弱：广告投放波动时，私域存量业务兜底现金流'
  - '**典型例子**'
  - '- 客单价150、毛利率Q、投放40万、营业额100万：纯直播ROI 2.5，加私域后3.5，月产值翻倍则达4.5'
  - '- 作者据此判断：月产值若能从15元提升到30元，业务模型彻底跑通，可规模化复制'
  - '**边界条件**'
  - '- 依赖进粉率、月产值、衰减率的准确估算，数据不实则模型失效'
  - '- 仅适用于“公域引流+私域变现”双轨模式，纯公域或纯私域不适用'
  - '- 前3个月80%衰减系数为经验值，不同行业/品类需实测校准'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/20230207_06.md
    role: improve
  excerpts:
  - 做一个公式：客单价 n 的产品，毛利率如果是 q，投入 y，直播间除去退货后营业额为 z。私域进线率 60%为合格，月产值为 p。那么你只做直播间纯利润就是
    q*z-y；做私域后纯利润就是 q*z-y 每个月加上 z/n×60%×p，月递减前 3 个月按 80%算，后面看维护。
  - 所以，从交易目的来看，单纯的页面曝光是没有太大价值的，如果是内容页面，有曝光无反馈反而是负价值。
  - 流量价值=流量规模×交易相关性×信任度
- 'no': 3
  name: 捡漏群模型 —— 用“演员+极致性价比”撬动社群裂变
  points:
  - '**为什么需要这个概念？**'
  - '- 普通社群活跃度低、转化差、用户沉默，靠运营苦吆喝不可持续'
  - '- 需要一种“自带氛围、自动成交、可规模化复制”的社群标准化模型'
  - '- 核心矛盾：如何让陌生人在群里抢着下单、甚至主动传播？'
  - '**核心定义**'
  - '- 捡漏群：以原价1-3折超高性价比商品为饵，通过企业微信建群，配置30-50个“演员”（托）营造抢购氛围，靠淘客佣金变现'
  - '- 核心三要素：极致性价比（选品）、演员氛围（信任/从众）、精细化运营节奏（排品/文案/催单）'
  - '**关键性质**'
  - '- 杠杆放大：单群成本3500-10000元，3个月回本，生命周期2年，单群纯利2万+，ROI 3-4倍'
  - '- 矩阵化：100群日利3000，1000群日利3万，月利90万，边际成本极低'
  - '- 演员是灵魂：有演员vs无演员，产出相差1倍以上；演员氛围差则生命周期断崖式缩短'
  - '**典型例子**'
  - '- 新起盘<1000群，月佣100万+；头部团队万群量级，月佣数千万'
  - '- 书里有品：0预算冷启动，首月10万分销员，2年80万+分销员、1.5亿销售额'
  - '**边界条件**'
  - '- 依赖稳定企微主体（抗封号）、靠谱供应链（发货/售后）、精细化运营团队（排品/演员管理）'
  - '- 选品必须是标品、有社交货币、高性价比，非标品/高客单品不适用'
  - '- 平台风控收紧时（如微信打击诱导分享、托行为），模型面临失效风险'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/202301-02/20230207_08.md
    role: improve
  excerpts:
  - 捡漏群：用户在我们的群里可以用原价的 1-3 折买到超高性价比的商品。…… 能通过售卖商品来产出佣金，实现变现。
  - 一个群必须有 20 个以上的演员，确保整个群的发品节奏。演员是捡漏群的灵魂，有演员和没演员的情况，社群产出起码相差一半以上。
  - 选品渠道：定向招商群、大淘客、好单库等主流淘客选品网站，还有同行群。
  - 收入增长=供应链强度 X 顶层设计 X 动员能力
  - 发圈动力=佣金/设计交压力。
  - 一级佣金高，普通分销员卖货的意愿强，但是很难吸引到大的团长。二级佣金高，团长很积极招商和拓展团队，但普通分销员带货的意愿不足。
- 'no': 4
  name: 流量切片分析法 —— 把流量数据切成“可执行的片”
  points:
  - '**为什么需要这个概念？**'
  - '- 老板只看UV/PV总数，不知道哪里来、哪里去、为什么涨跌，无法决策'
  - '- 流量不切片，就没有优化空间，运营动作全靠拍脑袋'
  - '- 需要一套标准化的“显微镜”，把流量看透、看细'
  - '**核心定义**'
  - '- 横向切片：按来源渠道、涨跌趋势、可干预运营动作拆解（如：这200 UV从哪来？哪个渠道涨了？要做什么动作？）'
  - '- 纵向切片：按用户需求、行为路径、业务价值拆解（用户经历什么？有什么需求？停留多久？去哪了？能不能变现？）'
  - '**关键性质**'
  - '- 可执行性：切片的终点是“可干预的运营动作”，不是报表'
  - '- 全链路：覆盖获客→停留→转化→离开全生命周期'
  - '- 迭代性：每日/每周切片，形成“数据→假设→动作→验证”闭环'
  - '**典型例子**'
  - '- 作者用此法实现C端业务单日1000有效咨询'
  - '- 抖音带货案例：发现第四条视频从300播放涨到6万+，立马开直播承接，日入1.8万'
  - '**边界条件**'
  - '- 需要埋点完善、数据打通（公域+私域+转化），数据孤岛无法切片'
  - '- 仅适用于有一定流量规模（如日均百级UV）的业务，太小样本无统计意义'
  - '- 切片分析依赖运营经验判断“原因”与“动作”，新手易误读数据'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_03.md
    role: apply
  excerpts:
  - 横向你要看：这 200 个 UV 从哪里来？有哪些渠道？哪些涨了？哪些跌了？趋势如何？原因是什么？可干预的运营动作是什么？
  - 纵向你要看：UV 的背后是用户，这个用户来到页面前经历了什么？有着怎样的需求？为什么要来？停留了多久？去向了哪里？离开的时候和刚进来有什么不同？能不能形成业务价值？
  - 流量要切成片来看，才有可优化的空间，才能形成可执行的运营干预动作。
  - 昨天开了个直播，一小时吧，加到私人微信近 200 人……有流量了，能直播，就直播
- 'no': 5
  name: 流量流速悖论 —— 不快不慢，持续不断，价值最大
  points:
  - '**为什么需要这个概念？**'
  - '- 追求爆款、大流量往往导致“来快去也快”，用户无停留、无连接、无转化'
  - '- 流量太慢则规模不够、业务跑不起来'
  - '- 需要一个“流速调节阀”，平衡规模与停留'
  - '**核心定义**'
  - '- 流量价值核心 = 流（动） + 量（规模），要流动也要停留、不快不慢、持续不断'
  - '- 核心指标：用户停留时间、互动率、转化率，而非单纯UV/PV'
  - '**关键性质**'
  - '- 反直觉：主动控制流速（如限制直播时长、控制投放节奏），反而能提升总产出'
  - '- 平台算法偏好：有停留、有互动、有转化的流速，平台会持续推流'
  - '- 交易目的论：无互动的曝光是负价值，平台不给流量'
  - '**典型例子**'
  - '- 视频号直播：控制单场15分钟，避免系统断播，延长账号寿命'
  - '- 抖音盲盒项目：热度衰减期主动缩减直播时长、引入外部合作，延长变现窗口'
  - '**边界条件**'
  - '- 新号冷启动期需“快”（抓住流量扶持期），成熟期需“慢”（精细运营）'
  - '- 不同平台流速偏好不同：抖音偏快、视频号偏慢、私域最慢'
  - '- 无法通过数据实时监控流速（如无埋点、无后台），无法调控'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_08.md
    role: apply
  excerpts:
  - 流量的速度太快、没有停留、规模再大也没有用，流量一直停留不动也不行，等于没有了规模。
  - 流量的核心是流和量，就要流动也要停留、不快不慢、持续不断，这样的流量价值才是最大的。
  - 增加用户的停留时间。
  - 所以，从交易目的来看，单纯的页面曝光是没有太大价值的，如果是内容页面，有曝光无反馈反而是负价值。
  - 在任何一个平台做生意需跟随平台战略阶段调整打法：增长期平台鼓励资源快速涌入，适合激进投放；存量期平台更重视生态建设，需要从自身找原因……否则会被清理。
- 'no': 6
  name: 流量合并术 —— 借别人的流量为我所用
  points:
  - '**为什么需要这个概念？**'
  - '- 自己建团队获流量太慢、太贵、天花板低'
  - '- 世上不缺流量，缺的是“把流量价值最大化”的方法'
  - '- 谁能让流量主赚更多钱，谁就拥有了流量主的流量'
  - '**核心定义**'
  - '- 流量按所有权分两类：自建流量、合并流量（整合别人的流量）'
  - '- 核心策略：设计让KOL/流量主“卖我的货、赚更多钱”的方案，从而调动其积累多年的存量流量为我服务'
  - '**关键性质**'
  - '- 杠杆思维：用利益绑定替代自建，边际成本极低'
  - '- 双赢结构：流量主获新收入源、我获精准流量、用户获好产品'
  - '- 可复制：一套标准化合作方案（佣金、物料、售后），可批量复制到同类KOL'
  - '**典型例子**'
  - '- 假设KOL积累4-5年流量，若我让他卖货月赚20万，他的流量即为我服务'
  - '- 视频号无货源店群：后端商品缺乏，达人缺货源，我供货源+佣金，达人带流量，双赢'
  - '**边界条件**'
  - '- 必须有极强供应链/产品力/履约能力支撑，否则坑了流量主、砸了信誉、断了路'
  - '- 仅适用于“产品标准化、佣金结算清晰、售后兜底”的品类'
  - '- 流量主若有自有品牌/独家供应链，合并意愿极低'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_08.md
    role: apply
  excerpts:
  - “我自己认为世界上流量按照所有权分类只有两类：一个是自己建团队获取流量，还有一类是整合别人的流量。”
  - 谁能让流量主赚更多的钱，谁就拥有了这个流量主的流量。
  - 我们假设有一个 KOL，积累了四五年的流量…现在如果我能想一个办法出来，让他卖我的货，一个月能赚二十万，那这个人四五年积累的流量就会为我服务…在这个世界里并不缺流量，真正缺少的是把流量价值最大化的方法。
  - 视频号后端能挣钱的根本原因是因为后端商品的缺乏，视频号选品库整体依旧还是不够多不够丰富的
- 'no': 7
  name: 五位一体成交飞轮 —— 私域一对一成交的标准化动作
  points:
  - '**为什么需要这个概念？**'
  - '- 私域成交靠聊天、靠感觉、靠人品，不可复制、不可规模、靠谱人难招'
  - '- 客户犹豫不决只因三个问题：为什么必须买？为什么跟你买？为什么现在买？'
  - '- 需要一套标准化、可培训、可考核的成交SOP'
  - '**核心定义**'
  - '- 五步法：①破冰（好感建立）→ ②诊断（放大需求）→ ③方案（成交铺垫）→ ④信任（突破抗拒）→ ⑤成交（引导下单）'
  - '- 核心心理学原理：损失厌恶（害怕错过/损失）驱动决策'
  - '**关键性质**'
  - '- 标准化：新人按SOP练话术、练流程，1周上岗，解决“靠谱销售难招”痛点'
  - '- 可量化：每步有话术、有指标（如破冰回复率、诊断完成率、成交转化率）'
  - '- 复用性：话术库、案例库、异议处理库沉淀后，全团队复用，边际成本为零'
  - '**典型例子**'
  - '- 抖音引流卖教辅资料：两个月加好友3000、成交1000+、转化率30%、三人获利4.5万'
  - '- 高净值客户销售：先反问/布置功课引起好奇，再上升痛点建立权威，最后聊小孩/传承形成依赖'
  - '**边界条件**'
  - '- 仅适用于高客单、高决策成本、需信任背书的产品（课程、咨询、高客单实物）'
  - '- 低客单、冲动消费、标品类（如9.9元资料、捡漏群商品）无需如此重流程'
  - '- 依赖人设/专业度支撑，无专业度的“破冰-诊断”是骚扰'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_08.md
    role: improve
  excerpts:
  - 私域成交有逻辑、有章法…我把整套成交逻辑整理成了五位一体成交飞轮：①破冰——好感建立、②诊断——放大需求、③方案——成交铺垫、④信任——突破抗拒、⑤成交——引导下单。
  - 多数犹豫不决的客户，究其根本都是因为三个原因：为什么必须买？为什么跟你买？为什么现在买？
  - 想解决这个问题…心理学领域，有一个专业的名词'损失厌恶'。
  - 引起好奇的方法，我通常先反问或者是先给客户布置功课。
  - 需求和痛点的差别在什么呢？我以为我需要这个东西，它没有什么情绪的动力。当客户很平静的时候，都是需求，不是痛点。
