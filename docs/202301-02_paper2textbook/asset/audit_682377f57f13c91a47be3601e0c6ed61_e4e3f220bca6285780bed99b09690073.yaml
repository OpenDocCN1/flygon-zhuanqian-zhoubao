unsupported_claims:
- location: '30.3'
  claim: 搜索流量追热点的核心范式转移：不再坐等平台推荐，而是主动去“搜一搜”里拦截流量
  reason: 素材中未明确提及'核心范式转移'这一学术概念，属于教材对素材的升华表述
- location: '30.4'
  claim: 矩阵号有效率约75%（12个号中9个有效）
  reason: 素材中仅提及'9个号有效，3个无流量'，未明确使用'有效率'或'75%'表述
- location: '30.6'
  claim: 爆款文章撰写法：字数卡在700-800字（满足文中广告门槛）
  reason: 素材中提到'七八百字左右'，'700-800字'为教材量化后的表述
- location: '30.8'
  claim: 半匹配挽回超30%流量
  reason: 素材中提到'挽回大量流量'，'超30%'为教材量化估算
- location: '30.9'
  claim: 文中广告收入占比超80%，单号破千元全靠文中广告
  reason: 素材中作者称'文中广告收入远超底部广告'、'单号破千元'，'占比超80%'为教材推算
- location: '30.11'
  claim: 泛粉单粉估值约0.1元，取关率53.8%
  reason: 素材中作者自估'单粉一毛钱'、数据显示'取消关注52430/新增97385≈53.8%'，教材整合表述
- location: '30.12'
  claim: 前置能力包含SEO经验、写作肌肉、账号储备、变现通路、后台SOP
  reason: 素材中列举'公众号SEO经验、伪原创写作速度、多账号管理SOP、CPS/CPA资源'，教材系统化归纳
