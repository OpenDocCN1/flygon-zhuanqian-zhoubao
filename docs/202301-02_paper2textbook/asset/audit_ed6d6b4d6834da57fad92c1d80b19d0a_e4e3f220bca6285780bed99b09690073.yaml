unsupported_claims:
- location: 25.6 选品决定论（核心定义）
  claim: 选品决定论是指好产品自带转化力，选品成功与否在很大程度上决定了后续销售、复购、口碑的成败。
  reason: 素材《E1WGd70YLoaHGfxAYJTc4WoFnsd.md》中仅有一句'所以选品很关键，产品好省了一半的心，后续回购率也高。'，书中将其扩展为完整概念'选品决定论'，并强调其权重远大于运营效率，属于作者团队的理论升华，缺乏直接素材支撑。
- location: 25.4 信息差红利（核心定义及关键性质）
  claim: 核心定义提出了信息差红利这一概念，并总结了三大核心性质：时效性、隐蔽性、可迁移性。
  reason: 素材《PglAdRMiIoVTRyxc4Q3cw8hvnWf.md》中多次提到'信息差'（如'生意的本质就是信息差'），但并未直接定义'信息差红利'，也未阐述其三大核心性质。该概念及性质的总结提炼超出了素材原文提供的直接信息。
- location: 25.7 行业周期窗口（关键性质表格）
  claim: 行业周期窗口有三个关键性质：时机性、红利性、可预测性。
  reason: 素材《PglAdRMiIoVTRyxc4Q3cw8hvnWf.md》中提及了行业周期和消费时代变化，但未明确提出'行业周期窗口'这一概念，也未对其性质进行归纳总结。书中内容属于对素材信息的二次归纳和加工。
- location: 25.6 选品决定论（优质选品三大标准）
  claim: 原创的标准表格明确列出：标准一：深挖用户需求；标准二：踩准行业趋势；标准三：强化品牌背书。
  reason: 素材《E1WGd70YLoaHGfxAYJTc4WoFnsd.md》中确有'1.深挖用户需求...2.口服保养是趋势...3.尽量能跟医院合作的产品'等相似表述，但原文并未将其概括为'三大标准'，书中进行了结构化总结，属于二次加工。
- location: 25.5 最小可行产品闭环（专业公式）
  claim: 专业闭环公式：专业 → 流量 → 成交 → 深挖需求 → 复购。
  reason: 素材《E1WGd70YLoaHGfxAYJTc4WoFnsd.md》原文为'专业——流量——成交——深挖需求——复购'，书中将其称为'专业闭环'的升级版公式，虽内容一致，但'升级版闭环'的定义和解读属于书本作者主观发挥。
