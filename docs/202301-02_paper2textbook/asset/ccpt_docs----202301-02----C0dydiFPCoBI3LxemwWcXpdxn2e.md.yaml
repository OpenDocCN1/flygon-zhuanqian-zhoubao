desc: 该素材由创业领域分享者提出，针对初创公司在有多个合伙人时如何科学、定量地分配股权的问题，给出了一个名为“4C动态量化股权分配模型”的工具及其配套的“股权分配五步法”操作流程。素材首先定义4C模型基于人力资本和货币资本细分为创始人身份、岗位权重、时间投入、资金投入四个维度，并提供了各维度的参考权重范围，随后通过一个儿童体能训练项目的真实案例，完整演示了从确定赛道、收集信息、定维度权重、定股东权重系数到最终计算出股权比例的五步操作。素材强调这四个维度的比例并非固定，需要创始团队通过自评和互评达成共识，并提醒计算出的初步比例只是起点，还需配套一系列合同规范和调整工具。
concepts:
- name: 4C动态量化股权分配模型
  desc: 一个用于初创团队量化股权分配的工具，将资本分为人力资本和货币资本，并细分为创始人身份、岗位权重、时间投入、资金投入四个维度，每个维度带有可波动的建议权重范围。
  is_original: true
  excerpt:
  - 今天给大家提供一个工具，这个工具的名称叫 4C 动态量化股权分配模型。
  - 4C中的C，就是资本的意思，资本我们分为人力资本和货币资本。再细分成4个维度的话，就是创始人身份、岗位权重、时间投入、资金投入。这四个维度是这个工具里面已经给大家植入的一个参数，这个参数是在一定的范围内波动的。
- name: 创始人身份
  desc: 4C模型中最重要的维度，代表谁承担最大风险和兜底责任，谁就最有控制企业的需要，权重通常在10%-30%。
  is_original: false
  excerpt:
  - 1.创始人身份它其实是最重要的，我认为谁承担最大的风险，谁就最有控制整个企业的需要。……谁来最后承担这个兜底的人，那么我会认为这个人他就是发起人和创始人。……创始人身份的权重通常在10%-30%。
- name: 岗位权重
  desc: 4C模型中的维度，反映行业技术壁垒所在，即哪个岗位对项目重要性最高，权重通常在30%-40%。
  is_original: false
  excerpt:
  - 2.岗位权重，就是这个行业技术壁垒在哪里，那个岗位是最重要的。……这个分歧在我们前期做股权设计的时候，大家可能不容易发现，但是在公司发展壮大的过程中，越到后面越会产生一些隐患。……岗位权重通常在30%-40%。
- name: 时间投入
  desc: 4C模型中的维度，最简单的划分是全职还是兼职、投入精力的大小，权重通常在10%-25%。
  is_original: false
  excerpt:
  - 3.时间的投入，最简单的划分就是全职还是兼职，投入精力的大小等。时间投入的权重通常在10%-25%。
- name: 资金投入
  desc: 4C模型中的维度，指项目前期资金的投入，可用于判断合伙人对项目的信心和承担风险意愿，权重通常在20%-50%。
  is_original: false
  excerpt:
  - 4.资金的投入。这个比较好理解，所有的项目都会有一个前期资金的投入。……我们可以通过时间投入和资金投入去判断这个合伙人他对项目的信心和他愿意承担多大的风险。资金投入的权重通常在20%-50%。
- name: 股权分配五步法
  desc: 运用4C模型分配股权的具体操作流程，包含确定行业和赛道、收集创始团队信息、确定每个维度的权重比例、确定股东四个维度的权重系数、计算出各个股东的股权比例五个步骤。
  is_original: true
  excerpt:
  - 在确认四个维度的权重比例后，我们会按照五步法来计算出各个股东的最终股权比例……
  - 第一个步骤：确定行业和赛道……第二个步骤：收集创始团队信息……第三个步骤：确定每个维度的权重比例……第四个步骤：确定股东四个维度的权重系数……第五个步骤：计算出各个股东的股权比例。
- name: 股权分配五步法实操
  desc: 通过儿童体能训练项目案例，演示了创始团队如何通过自评互评确定四个维度权重及各自系数，最终计算出小明、小磊、小胡的股权比例。
  is_original: false
  excerpt:
  - 有三个朋友合伙，他们准备一起做一个儿童体能训练的项目，这个项目的预期启动资金是 200 万。……通过自评和互评，最终得出来岗位权重是 7 ：2 ：1。……然后时间投入是
    6 ：3 ：1。
methods:
- name: __overview__
  desc: 素材总体的方法论为4C动态量化股权分配模型配合股权分配五步法，将定性讨论转化为定量计算，并通过自评互评机制达成创始团队共识。
  excerpt:
  - 今天和大家分享的4C 动态量化股权分配模型特别适合小白，特别适合一些刚刚开始的初创型的项目，他会给大家非常明确的参考的指引。
  - 在确认四个维度的权重比例后，我们会按照五步法来计算出各个股东的最终股权比例，下面带大家一起过一个真实案例。
- name: 股权分配五步法
  desc: 具体操作流程：第一步确定行业和赛道，将行业分为技术驱动型/资金驱动型以及自主创业型/集团孵化型两个维度四个类型；第二步收集创始团队信息（谁是全职、负责岗位、出资额度等）；第三步确定每个维度的权重比例，依靠创始团队自评互评达成共识；第四步确定股东四个维度的权重系数，按1到10打分；第五步加权计算各股东股权比例。
  excerpt:
  - 我们要先确定赛道，也就是你所处的行业，不同的赛道，对资金和技术的权重不一样。我们把行业分成2个维度四个类型，分别是技术驱动型/资金驱动型，以及自主创业型/集团孵化型……
  - 我们要开始收集合伙人的信息，也就是创始人的信息和其他联合创始人的信息。以及这个项目里面谁是全职，谁负责哪个岗位，各自出资额度等。
  - 这涉及到刚刚说的另一个工具，创始团队之间的自评和互评，从而达成一个共识，股东们要先认可这个赛道的这4个维度就是在这样的一个区间波动微调。
  - 我们确定了每个维度的权重比例之后，就要确定股东四个维度的权重系数，按从 1 到 10 各自去打分……
  - 最后比例就是最早发给大家的图：
theorems:
- name: 创始人身份代表风险承担
  desc: 原创观点：创始人身份的核心意义不在于荣耀而在于风险兜底，谁承担最大风险谁就最有控制企业的需要；且创始人的身份必须从一开始极度明确，公司对外只能有一个声音。
  excerpt:
  - 在我看来，它其实代表着风险承担，就谁最后在兜底。当这个项目不成立或这个项目遇到了极大的风险，谁愿意无条件的去为这个项目兜底，那这个人就是创始人，他对这个项目的付出程度是跟其他的合伙人完全不一样。
  - 创始人的身份是要极度明确的，从一开始就要很明确，它是要能控制这个项目的，一家公司最后对外的时候，应该只有一个声音。
- name: 合伙拆伙的根本原因在于前期重要程度判断的不一致
  desc: 原始观点：多数合伙人拆伙是因为觉得自己最重要、出力最多但分到的钱不是最多；根源在于前期做股权设计时，每个合伙人对自己的重要程度以及对岗位权重的判断不一致，因此必须在公司尚未盈利、大家还不那么计较的时候提前聊清楚。
  excerpt:
  - 这个分歧在我们前期做股权设计的时候，大家可能不容易发现，但是在公司发展壮大的过程中，越到后面越会产生一些隐患。因为大家从一开始对自己的重要程度的判断就是不一致的，大多数合作伙伴拆伙，就是觉得自己最重要，出力最多，但是分到的钱又不是最多。所以在前期就要聊清楚，公司还没有开始发展的时候，也是最为好聊的时候，因为还没有赚钱，就不会那么计较。
- name: 时间投入应匹配项目里程碑而非只区分全职兼职
  desc: 原始观点：衡量时间投入时，除了全职/兼职的区分，更重要的是其产出是否匹配上项目里程碑的进展；因此时间投入应同时涵盖投入的时间精力以及愿意引进的资源，前期就要讲清楚。
  excerpt:
  - 但是大家有没有想过，就是其实有 60% 左右的项目，所有的合伙人除了纯财务投资人之外，其实都是全职参与的。只是说你全职参与的这个产出它是不是就能匹配的到这个项目的所有的进展，项目到达的里程碑是不是跟你全职参与有必然关系。所以我们前期在做股权设计的时候，就一定要讲清楚，这个时间投入，它对应的除了是我们投入的时间精力，还有我们愿意引进的资源，愿意为了这个项目付出多少，不单单只是一个全职兼职。
- name: 初步计算出的股权比例仅是起点，需配套合同规范与调整
  desc: 原始观点：按五步法计算出的股权比例只是最简单的环节，并非最终体现在工商商事主体上的最终结果；之后还须搭配一致行动权、期权池、分红奖励、回购权、优先清算权、领售权等一系列合同规范和调整。
  excerpt:
  - 在最后不得不提醒大家的是，这个股权比例分配是最最简单的一个环节，并不是说，按这个比例算出来的，就是最终体现在工商商事主体上的最后结果。在算完初步的股权分配后，我们还会有其他一系列的合同规范和调整，比如一致行动权，期权池，分红奖励，回购权，纯资金方投资的优先清算权，领售权，等等等等。
findings:
- name: 四个维度参考权重范围
  desc: '[claim] 素材宣称各维度的权重范围（创始人身份10%-30%、岗位权重30%-40%、时间投入10%-25%、资金投入20%-50%）是成百上千个案例积累下来的经验值，但素材并未在文中提供实际统计数据支撑该范围，故标为宣称结论。'
  excerpt:
  - 创始人身份的权重通常在10%-30%。岗位权重通常在30%-40%。时间投入的权重通常在10%-25%。资金投入的权重通常在20%-50%。
  - 需要和大家再解释下，这4个维度的比例并不是固定的，上文给到大家的比例，是成百上千个案例积累下来的一个经验，在实操过程中，最终还是要创始团队一起来做一个锚定，达成共识。
- name: 常见项目除纯财务投资人外约60%的合伙人全职参与
  desc: '[claim] 素材宣称大约60%左右的项目里，除纯财务投资人之外所有合伙人其实都全职参与；文中未提供支撑该数据的抽样调查或统计来源，故标为宣称结论。'
  excerpt:
  - 但是大家有没有想过，就是其实有 60% 左右的项目，所有的合伙人除了纯财务投资人之外，其实都是全职参与的。
- name: 儿童体能项目股权计算案例
  desc: '[evidence] 通过设定启动资金200万、小明出资50万、小胡出资150万等参数，并经团队自评互评确定岗位权重7:2:1、时间投入6:3:1，素材演示了如何用五步法得出各股东股权比例，但其最终比例结果未在文中以文字形式给出，仅有配图呈现，故案例本身提供了完整的方法论演示证据。'
  excerpt:
  - 这个项目的预期启动资金是 200 万。……合伙人一：小明，之前加盟过一个幼儿游泳馆的品牌……合伙人二：小磊……合伙人三：小胡，现在在国企上班，家里拆迁户特别有经济实力，他愿意投资
    150 万。
  - 小明作为发起人，前期是准备出资 50 万，但是小磊不太愿意出钱了，他就觉得市场为王，能搞定市场，他就不需要出钱了。
  - 大家通过自评和互评，最终得出来岗位权重是 7 ：2 ：1。……然后时间投入是 6 ：3 ：1。
  - 最后比例就是最早发给大家的图：
