units:
- 'no': 1
  name: 精准过滤 —— App门槛是筛选“付费意愿”的筛子
  points:
  - '**为什么需要这个概念？**'
  - '- 传统认知认为App下载门槛高是劣势，会流失用户'
  - '- 实际上，高门槛反而能过滤掉无强烈需求的“看客”'
  - '- 需要一种机制，让用户在付费前就完成自我筛选，提高转化质量'
  - '**核心定义**'
  - '- 利用App下载、安装、授权等高摩擦操作，作为用户需求强度的天然过滤器'
  - '- 只有真正有强烈痛点、急需解决的用户，才愿意跨过门槛下载使用'
  - '**关键性质**'
  - '- 反直觉优势：不便即筛选，门槛越高，留存用户付费意愿越强'
  - '- 信任锚定：用户看到App截图和操作流程后，会预设“该App真的具有该功能”，降低信任成本'
  - '- 流量精准化：极低的下载率（如1%）反而意味着极高的用户质量'
  - '**典型例子**'
  - '- 微信解封类软件：用户必须下载App、填资料、甚至强制分享才能“申请解封”，看似繁琐实则精准收割急需解封的用户'
  - '- 羊了个羊刷分工具：用户为破关下载App，过程本身即验证了强付费意愿'
  - '**边界条件**'
  - '- 仅适用于“刚性刚需”场景（如解封、破解、急救类），非高频刚需产品会因门槛过高导致流量枯竭'
  - '- 依赖平台分发规则，若应用商店下架或无法安装，策略失效'
  - '- 需配合“软件营销派”的逼真界面，否则下载后即刻卸载，信任崩塌'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 但是正因为App使用不方便，却可以当成优势利用一下
  - 如果没有强烈的需求，用户根本不可能去下载安装App App大多数展示只是看客，下载率极低！
  - 但这时用户看到了App截图和使用方法，用户就会知道，有这么一个App，没有需求的用户不可能去下载。所以用户觉得：该App'真的具有该功能！'
  - 软件营销派：核心是，看起来更逼真、更专业。广告隐藏的更深，更容易用户裂变
- 'no': 2
  name: 软件营销派 vs 软营销派 —— 用“魔法打败魔法”
  points:
  - '**为什么需要这个概念？**'
  - '- 纯文本攻略（软营销）同质化严重，用户免疫，转化率低'
  - '- 同赛道竞品若推出“看起来更专业的工具”，会瞬间碾压纯内容玩家'
  - '- 需要一种“降维打击”的内容形式，重塑专业度感知'
  - '**核心定义**'
  - '- 软营销派：纯文本/图文攻略，教用户手动操作或心理疏导'
  - '- 软件营销派：包装成可视化App/小程序界面，让用户觉得“软件问题必须用软件解决”，自带专业光环'
  - '**关键性质**'
  - '- 认知碾压：同等无效内容下，带界面演示的版本被感知为更专业、更可信'
  - '- 裂变内生性：易植入“强制分享解锁功能”等病毒式传播机制'
  - '- 广告隐蔽性：推广链路藏在App操作流程中，而非显性文案，规避平台风控'
  - '**典型例子**'
  - '- 微信解封：软文版教你“写申诉理由”，软件版给你“申诉助手App”填名字点按钮，后者转化率碾压前者'
  - '- 羊了个羊刷分：P图攻略 vs “一键修改分数App”，后者引发疯狂分享裂变'
  - '**边界条件**'
  - '- 核心依赖“看起来像”的包装能力，而非真实功能，属于灰色地带'
  - '- 平台一旦打击“诱导分享/虚假功能”类小程序/App，该策略即刻失效'
  - '- 需持续迭代UI/交互细节维持“逼真感”，维护成本随平台规则升级而增加'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 软件营销派：核心是，看起来更逼真、更专业。广告隐藏的更深，更容易用户裂变
  - 弄一个APP告诉你，你下载这个APP，填上名字，就可以申请解封！
  - 我不仅有广告，我还强制你分享给别人后才能使用，这可比软文营销狠
  - 但是呢，如果这种方向的文章上产生了一个软件派，就可以直接碾压他们了，因为软件看起来更逼真了.....虽然仍然不解决任何问题！
- 'no': 3
  name: 信息差搬运论 —— A平台的“烂内容”就是B平台的爆款
  points:
  - '**为什么需要这个概念？**'
  - '- 创作者常陷入“原创焦虑”，认为内容必须首发、独家'
  - '- 跨平台算法推荐机制、用户画像差异巨大，同一内容在不同平台命运截然不同'
  - '- 需要一个低成本、可规模化的内容获取与分发逻辑'
  - '**核心定义**'
  - '- 渠道间存在天然信息差：用户群体不重叠、算法偏好不同、内容生态成熟度不同'
  - '- 核心操作：在平台A（红海/过度竞争）挖掘验证过的爆款内容，搬运至平台B（蓝海/内容空白）并微调优化'
  - '**关键性质**'
  - '- 非对称收益：搬运成本极低（复制+伪原创），收益取决于目标平台流量红利期'
  - '- 方向性：通常从成熟平台（抖音、知乎）向新兴/垂类平台（小红书、视频号、公众号）单向流动'
  - '- 时间窗口：目标平台内容生态成熟前（如小红书早期、视频号早期）效果最佳'
  - '**典型例子**'
  - '- 抖音做烂的“艺术签名/手写logo”项目，搬运至小红书瞬间爆火，月入数万'
  - '- 知乎长文回答拆解重组为公众号“超长文”，吃搜索流量红利'
  - '- TikTok爆款视频去水印搬运至抖音/快手/视频号，批量收割播放量'
  - '**边界条件**'
  - '- 仅适用于“内容消费型”项目（资料、教程、娱乐），强服务/强交付/强供应链项目无法单纯靠搬运复制'
  - '- 涉及版权/侵权风险，需做“二次创作”处理（剪辑、配音、改文案、加水印）'
  - '- 平台算法升级（如原创保护、跨平台查重）会周期性失效，需持续对抗'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 渠道其实是有信息差的，我们做过很多项目，其实吃的就是信息差，有些项目在抖音上做得很烂的，但是如果你搬到小红书上面，瞬间就爆了。有些项目在小红书上面做的人很多了，那你把同样的内容优化一下，搬到抖音上，也有可能把它做爆。
  - 通过刷抖音或者刷小红书的过程发现商业案例，再拆解复制这样的案例去形成一个商业模式，去发展自己的副业。
  - 拆下来之后，我就发现很多时候有些项目是完全可以复制的，是不需要投入几十万也可以复制的。复制了之后，用跟他一样的内容生产方式、转化链路，你也能拿到一定的结果。
- 'no': 4
  name: 套话做局 —— 把“同行的方案”变成“自己的产品”
  points:
  - '**为什么需要这个概念？**'
  - '- 个人开发者/创业者常因“不会技术/没资源/没方案”不敢入局'
  - '- 实际上，市场上已有大量同行解决了同类问题，只需“套”出来即可'
  - '- 需要一套“零成本获取核心交付方案”的逆向获客逻辑'
  - '**核心定义**'
  - '- 步骤1：以“已解决问题”的口吻写软文/发内容，吸引同行/从业者加微信（利用同行好奇心/优越感)'
  - '- 步骤2：过段时间反问“解决了吗？怎么解决的？”，套取真实可行方案'
  - '- 步骤3：将套到的方案整理包装，卖给“未解决但急需解决”的精准付费用户'
  - '**关键性质**'
  - '- 零成本研发：核心方案来自市场验证过的同行，非自研'
  - '- 信任反转：买家以为卖家是“已解决的专家”，实则是“信息中介”'
  - '- 高杠杆：一份方案可无限复制售卖，边际成本趋近零'
  - '**典型例子**'
  - '- 淘客API对接难题：作者写“已解决”软文引几十个淘客大佬加微信 -> 套出对接方案 -> 卖给不会对接的小白淘客，盈利几十万'
  - '- 羊了个羊刷分：P图999999分截图发“已开挂”贴吸粉 -> 游戏火爆后套取真刷分工具 -> 变现粉丝'
  - '- 各类“已破解/已对接/已实现”类软文，本质皆为套话陷阱'
  - '**边界条件**'
  - '- 依赖同行“有解且愿分享”，若行业极度保密或无解，则套不到核心方案'
  - '- 法律/道德风险高：涉及虚假宣传、欺诈、侵犯商业秘密，平台严打'
  - '- 仅能解决“已知有解”的问题，无法应对真正的“从0到1”创新需求'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 我将这个问题用：已经解决的口吻写出来，软文中附加微信号，之后每天都有淘客大佬加我
  - 过了些天，我又反问加我的人'前几天有点忙没来得及回，你们解决了吗？'开始套话，怎么解决的？
  - 总有解决的，也总有没解决的。把解决的套出来，卖给精准的，没解决的客户，直接盈利几十万！
  - 套话之所以能成，主要是因为对方要彰显优越感
  - 羊了个羊刚有点火，立刻就有人P一张分数999999截图，去社交软件用已经开挂的口吻发文，开始吸粉，差不多5天后《羊了个羊》大火，这时他就可以，套话找真正能刷分软件了，直接把粉丝变现！
- 'no': 5
  name: 销转效率的本质 —— 专业度越低，越能靠SOP放大
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常误以为“专业度高=赚钱多”，陷入“提升专业度”的内耗'
  - '- 实际操作中，高专业度依赖人（难复制、难培训、难放大）'
  - '- 需要一个评估标准：判断销售环节是否可标准化、规模化'
  - '**核心定义**'
  - '- 销转效率 = 销售时间的利用率'
  - '- 核心指标：专业度要求（能否SOP化）、是否一对多、单位时间产出'
  - '- 网销（线上）本质低专业度、可SOP、可一对多，销转效率天然高；线下销售（面销、会销）高专业度、一对一、低效率'
  - '**关键性质**'
  - '- 可复制性判据：能否写成SOP交给兼职/新人执行？能则高，不能则低'
  - '- 杠杆支点：专业度要求越低，越容易通过“人力杠杆”（招兼职）、“技术杠杆”（自动化话术）放大'
  - '- 反直觉：看似“不专业”的标准化流程，反而支撑起百万级收入'
  - '**典型例子**'
  - '- 小说推文：搜索暗号充值会员，全流程SOP，零专业度，月入2万轻松放大'
  - '- 项目拆解IP：虽客单价高，但销转依然靠SOP话术/流程成交，非依赖个人超强销售能力'
  - '- 知识付费/课程卖课：直播间挂小黄车，标准化话术，交付即刻完成'
  - '**边界条件**'
  - '- 高客单价（>10万）、强信任依赖（医疗、法律、高端咨询）场景，低专业度SOP会破坏成交，需高专业度人工介入'
  - '- 平台风控若打击“话术模板/自动回复/批量操作”，SOP策略失效'
  - '- 仅适用于“标准化产品/服务”，非标定制化业务无法完全SOP'
  sources:
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: origin
  excerpts:
  - 我们以「专业度」为指标。
  - 「专业度要求低（能SOP），能一对多，即为销转效率高，本质也是时间，销售的时间利用率」
  - 「基本上网销不需要啥专业度，按SOP做就好，线下才需要极高的专业度」
  - 销转效率高，交付效率高，意味着销售可以SOP化，不需要极强的专业性，也意味着交付也不需要啥时间，精力，同时也意味着流量来了，能接得住。
