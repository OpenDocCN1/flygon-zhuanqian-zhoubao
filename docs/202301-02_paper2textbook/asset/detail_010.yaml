learning_targets:
- 掌握爆款视频模板化拆解的六要素法（背景、标题、内容、文案、字幕、BGM）
- 理解“原创优于二剪优于搬运”及“1比1模仿保底60分”的内容生产底层逻辑
- 掌握素材随机取用、时间段随机取用、混淆元素三重机制实现批量视频差异化与过原创审核
- 学会利用巨量百应创意中心官方数据+RPA工具构建私有竞品素材库，替代第三方工具
- 掌握‘做人群不做货’差异化策略及‘情、趣、用、品’四象限内容定位法
- 掌握黑马小达人（粉丝<5万、GMV高、视频>200条、画面干净、持续更新）筛选标准
- 掌握视频号新号流量扶持期（7天）的激进起号打法：放大→翻转→BGM处理→加字引导的固定去重流水线
- 理解‘视频即直播间流量入口’：视频破万播放才开播，视频不跑果断关播，反复开关播控制节奏
- 掌握爆款生命周期管理：起爆期(1-3天)全力直播→衰退期(4-7天)压缩时长引入基地托管→存量期靠自然单
- 克服‘知识诅咒’精神内耗：不看后台数据、定量化动作目标（日更10条/号）、看对标定变现
- 掌握RPA自动化采集流程：创意搜索/爆款库分类采集→飞书妙记语音转文字→脚本库沉淀
- 掌握小说推文精细化运营SOP：作者垂直+专栏垂直选文→核心剧情前置改文→模板化剪辑→评论区造互动
concept_map:
- 短视频带货内容工业化体系
- ├── 核心方法论层
- │   ├── 爆款视频模板化拆解（六要素）  —— P002
- │   ├── 1比1模仿保底原则（原创优于二剪优于搬运）  —— P002
- │   ├── 做人群不做货（情/趣/用/品四象限）  —— P004
- │   └── 知识诅咒破解（不看数据、定动作目标、看对标）  —— P011
- ├── 生产技术层
- │   ├── 素材随机混淆三重保险（随机素材/随机时段/自拍混淆）  —— P002
- │   ├── 视频去重标准化流水线（放大/翻转/BGM/加字）  —— P008
- │   ├── RPA自动化采集体系（官方数据雷达/影刀/飞书妙记）  —— P003, P012
- │   └── 底层工具模块复用（新模板几分钟开发）  —— P002
- ├── 选品与对标层
- │   ├── 选品即定人群找需求（垂直需求>通用需求）  —— P004
- │   ├── 官方数据雷达（巨量百应创意中心实时全量数据）  —— P003
- │   ├── 黑马小达人筛选标准（低粉高销/视频量大/画面干净）  —— P006
- │   └── 全平台二创法（跨平台素材库/非违规二创/赛道化植入）  —— P005
- ├── 分发与变现层
- │   ├── 视频号新号流量扶持（7天窗口期/破万播放/激进发视频）  —— P009
- │   ├── 视频即直播入口（视频跑才开播/反复开关播/话术样品转化）  —— P009
- │   ├── 加字引导出单（人设化场景化文案/OCR友好/低成本A/B测试）  —— P007
- │   ├── 爆款生命周期管理（起爆/衰退/存量三阶段/矩阵接力/基地托管）  —— P010
- │   └── 小说推文精细化SOP（作者/专栏垂直/核心剧情前置/关键词说白话/评论造势）  —— P001
- └── 规模化与资产层
- '    ├── 矩阵化账号体系（3-5号错峰/自动化发布/一鱼多吃）  —— P002, P010'
- '    ├── 脚本/话术/素材/模板资产沉淀（账号死资产不死）  —— P010'
- '    └── 超级个体模式（专注流量/输送基地/拿分成/借力打力）  —— P010'
life_analogy:
- 想象短视频带货是一场**“工业化盖房子”**的游戏：
- '- **爆款视频模板 = 经过验证的标准化户型图纸**（六要素：地基/墙体/屋顶/水电/装修/景观），直接套用保证房子不塌（保底60分）'
- '- **1比1模仿 = 照着样板间盖**，避免“自嗨式设计”导致烂尾楼'
- '- **素材随机混淆 = 每套房子换不同瓷砖、壁纸、软装，并放入自家传家宝（自拍混淆元素）**，让验房师（平台查重）查不出重复，还能证明原创'
- '- **官方数据雷达 = 用开发商自家的“卫星地图”（巨量百应）选地皮**，比中介（第三方工具）数据更准、更实时'
- '- **黑马小达人 = 那些没背景、没资源、靠手艺盖出高价房的“草根工长”**，比靠家族资源（粉丝基数）的大包工头更值得学'
- '- **做人群不做货 = 别盖“谁都住”的大通铺（通用品），要盖“专给带娃妈妈/养老独居/焦虑白领”定制的精装房（垂直人群需求）**'
- '- **视频号新号扶持 = 新开发区前7天“买地送地、通水通电、带客源”**，必须在这7天疯狂盖房（发视频），过期作废'
- '- **视频即直播入口 = 样板间（视频）带看客进售楼处（直播间）**，没样板间开售楼处纯属自嗨（场观十几人）'
- '- **加字引导 = 售楼处关键位置贴的“毁约金翻倍/今天签送车位”横幅**（人设+痛点+行动指令），比样板间装修更直接成交'
- '- **爆款生命周期 = 房子有“热销期/去化期/尾盘期”**，热销期自己卖，去化期外包给中介（基地托管），尾盘期靠口碑带看'
- '- **克服知识诅咒 = 别在开工前纠结“未来房价涨跌/物业费贵不贵/能不能传家”**，定目标“每天盖1层”，只看隔壁工地（对标）怎么卖的'
- '- **RPA自动化 = 派机器人（影刀）去竞品工地偷图纸、量尺寸、拍照、整理成册**，自己喝茶盯大局'
- '- **小说推文 = 把知乎大神的长篇小说（原著）剪成“精华预告片”，挂链接卖会员卡**，选文垂直=只拍悬疑/只拍言情，核心剧情前置=预告片前3秒放高潮'
summary:
- concept: 视频六要素模板
  desc: 背景、标题、内容、文案、字幕、BGM —— 所有短视频的通用拆解原子单元
- concept: 1比1模仿保底原则
  desc: 模仿已验证爆款模板，保证生产内容质量≥60分，规避自嗨式创作
- concept: 混淆元素机制
  desc: 自拍素材植入视频生成环节，配合随机取用策略，实现批量视频差异化与原创过审
- concept: 官方数据雷达
  desc: 巨量百应创意中心实时全量数据（爆款库/创意搜索）优于第三方工具，配合RPA批量采集
- concept: 黑马小达人样本
  desc: 粉丝<5万、视频>200条、围绕垂直品反复带、画面干净、持续更新 —— 最值得新手拆解的对标标准
- concept: 做人群不做货
  desc: 从‘选品找视频’转为‘定人群、挖需求、做内容、匹配品’，基于情/趣/用/品四象限细分上千微人群
- concept: 全平台二创法
  desc: 以全网短视频平台为素材库，基于四象限逻辑非违规二创，保留爆款内核植入自家赛道标签
- concept: 视频号新号扶持
  desc: 新号前7天享流量倾斜，发视频易破万播，是冷启动核心窗口，支持激进‘作死式’堆量打法
- concept: 视频去重流水线
  desc: 放大(105-110%)→水平翻转→BGM分级处理(换/加底/变速)→识别遮盖原字幕+加引导字幕，固定四步过机审
- concept: 加字引导出单
  desc: 针对产品特色/痛点添加醒目文案（人设/场景+痛点/爽点+动作指令），被认为是出单关键而非视频本身
- concept: 视频即直播入口
  desc: 视频号直播无自然推流，必须靠在跑视频拉流量；视频破万才开播，不跑即关，反复开关播控制节奏
- concept: 爆款生命周期管理
  desc: 起爆期(1-3天)全力直播→衰退期(4-7天)压缩时长引入基地托管→存量期靠自然单；矩阵接力+外部托管实现现金流平滑
- concept: 知识诅咒破解
  desc: 认知越深越易精神内耗；对策：不看后台、定量化动作目标(日更10条/号)、看对标定变现，用傻瓜式执行力穿透认知迷雾
- concept: RPA自动化采集
  desc: 影刀RPA低代码开发：创意搜索/分类采集机器人→数据表格+无水印视频→飞书妙记转文字→私有脚本库
- concept: 小说推文精细化SOP
  desc: 作者垂直+专栏垂直选文→核心剧情前置改文(关键词说白话)→模板化剪辑(游戏录屏/显眼字幕)→评论区造互动(小号/热评/置顶引导)→日更养号+三维复盘
exercises:
- 'no': 1
  title: 手拆一个爆款视频模板
  contents:
  - 在视频号/抖音找一条带货GMV>5万、粉丝<5万的黑马视频：
  - 1. 将其拆解为六要素：背景(图/视频)、标题(主/副)、内容(图/视频)、文案、字幕、BGM
  - 2. 针对每个要素，在网上搜集3-5个形式相似的替代素材（如：背景换同领域不同大师照片）
  - 3. 设计一套“混淆元素”方案：拍摄/准备5-10张自己的照片或视频片段（如：手持产品特写、点头微笑、翻书页），标注插入位置（开头/结尾/中间切片）
  - 回答问题：
  - '- 如果不加混淆元素，仅靠素材随机取用，视频通过原创审核的概率会如何变化？'
  - '- 为什么要求背景/内容素材要“来源稀缺、门槛高”？这与平台查重逻辑有何关系？'
- 'no': 2
  title: 设计一个“情/趣/用/品”四象限人群定位练习
  contents:
  - 假设你要在视频号卖一款“中老年关节护理贴”：
  - 1. 在“情-共情”象限：定义一个细分人群分支（如：55岁退休阿姨，膝盖疼不敢带孙子下楼，内心愧疚焦虑），写一条视频脚本大纲（开头冲突/中间共情/结尾植入）
  - 2. 在“趣-有趣”象限：设计一个反差感画面（如：70岁大爷贴完贴现场挑战深蹲/爬楼），标注BGM风格与剪辑节奏
  - 3. 在“用-有用”象限：列出3个硬核知识点（成分机制/贴敷时长/配合运动），设计“教学式”视频结构
  - 4. 在“品-新奇特”象限：挖掘产品冷知识（如：航天同源技术/非遗膏药传承/极地探险队专用），设计“种草式”文案
  - 回答问题：
  - '- 哪个象限的内容最容易跑出大播放？哪个象限的转化率通常最高？为什么？'
  - '- 如果同时运营4个账号分别对应四象限，如何避免“脑裂”（思维切换成本过高）？'
- 'no': 3
  title: 模拟视频号新号7天冷启动排程
  contents:
  - 假设今日注册3个新号（健康养生/怀旧情怀/亲情共情三赛道），制定未来7天执行表：
  - Day 1-3：每号每天发10条视频（用去重流水线处理对标素材+加字引导），记录每条视频播放量、完播率、涨粉
  - Day 4-7：筛选播放>1万的视频，按“视频破万→开播1-3小时→关播→等下一条破万→再开播”节奏安排直播，准备话术版本V1/V2、样品展示清单
  - 同步建立“视频-直播”复盘表：源视频ID、开播时长、进人数、停留秒数、成交单数、GMV
  - 回答问题：
  - '- Day 3某号单条视频播放300万但直播场观仅200人，可能原因是什么？如何调整？'
  - '- Day 5主力号流量衰减至峰值50%（第4天现象），是继续硬播、减少时长、还是引入外部基地托管？决策依据是什么？'
  - '- 为何建议单场直播≤3小时、日累计≤5小时？违规风险与流量边际收益如何权衡？'
- 'no': 4
  title: RPA采集机器人需求文档设计
  contents:
  - 为影刀RPA编写“巨量百应创意搜索采集机器人”需求文档（伪代码/流程图描述即可）：
  - 输入参数：搜索词列表、滚动页数、GMV过滤阈值、是否下载无水印视频、导出路径
  - 核心流程：登录→进入创意搜索→输入词→点击搜索→循环滚动N页→提取每条视频(链接/GMV/销量/粉丝/作者/标题)→按GMV过滤→导出CSV→可选：遍历列表下载无水印视频→断点续爬/记忆上次参数
  - 异常处理：验证码弹窗/登录失效/页面结构变更选择器失效/网络超时/磁盘空间不足
  - 回答问题：
  - '- RPA运行会锁鼠标键盘，如何解决“开发机无法并行操作”问题？对比：云桌面/备用物理机/无头模式/定时任务错峰，优劣势如何？'
  - '- 官方页面更新导致选择器失效，建立什么样的“监控告警+快速修复”机制成本最低？'
  - '- 采集下的视频仅限内部拆解学习，如何建立“素材来源台账”与“二创证据链”应对版权风险？'
- 'no': 5
  title: 小说推文单条视频从选文到发布的全链路复盘
  contents:
  - 选取一篇知乎盐选小说（或任意付费长文），完成：
  - 1. 作者垂直验证：该作者是否持续产出同类爆款？近3篇数据如何？
  - 2. 核心剧情提取：通读全文，标记核心冲突/悬念/反差/泪点，提炼5-8个关键词（准确/简洁/可读）
  - 3. 改文实操：将核心剧情前置到开头（黄金5秒），添加情绪修饰词（竟然/偏偏/非要），精简至800-1200字适配8-15分钟长视频
  - 4. 素材决策：选择游戏录屏(跑酷/解压) vs 实拍图文 vs 影视混剪，论证“创作简单/原创度高/互动潜力/易沉迷”四维度打分
  - 5. 字幕样式：黑字白边/黄字黑边二选一，位置避开核心画面，字号适配手机竖屏
  - 6. 发布策略：发布前15分钟预热动作、发布后5k/15w播放分级引导话术、抖加投放包(定向/金额/时长)
  - 回答问题：
  - '- 为什么“一篇一集长视频”优于“分三集”？从算法推荐机制与用户心理两个维度解释'
  - '- “关键词说白话”具体如何操作？举3个正例、3个反例，解释为何人名/地名/代号是底线红线'
  - '- 评论区造互动“三板斧”（主动回复+小号带节奏+热评置顶引导）各自成本与产出比如何量化？'
units:
- 'no': 1
  name: 爆款视频拆解 —— 让模型学会"抄作业"
  points:
  - '**为什么需要这个概念？**'
  - '- 短视频带货中，新手闭门造车极易生产低质内容，导致流量为零、变现无门'
  - '- 平台算法偏好已验证的爆款结构，模仿成功案例比盲目原创成功率高得多'
  - '- 缺乏系统化拆解方法，导致只能靠直觉“凑”，无法复制、无法规模化'
  - '**核心定义**'
  - '- 将任意爆款短视频拆解为背景、标题、内容、文案、字幕、背景音乐六大基础元素的标准化结构'
  - '- 以此为“模板”，通过替换同类素材实现内容的批量化、原创化生产'
  - '**关键性质**'
  - '- 普适性：所有短视频形式（流量视频、带货视频）最终都由这六要素组成'
  - '- 可迁移性：拆解出的模板可跨赛道、跨平台复用，开发新模板仅需几分钟'
  - '- 保底机制：1比1模仿已验证爆款，保证生产内容质量≥60分，规避“自嗨式创作”'
  - '**典型例子**'
  - '- 中医养生号：背景=大师照片模糊放大，标题=“请等一下…”，内容=大师照片，文案=“国医大师xxx”，字幕=无，BGM=舒缓纯音乐'
  - '- 利用飞书妙记将对标视频语音转文字提取文案，结合RPA下载无水印素材，快速完成拆解与素材库建设'
  - '**边界条件**'
  - '- 仅适用于非重特效、结构化强的视频类型（如口播、图文、混剪），复杂特效视频难以还原'
  - '- 必须结合“混淆元素”（自拍素材）与“随机取用”策略，否则批量生成视频极易被平台判定重复/搬运'
  - '- 依赖对标样本质量：优先选“粉丝少、销量高”的黑马小达人视频，避免大号粉丝加成干扰判断'
