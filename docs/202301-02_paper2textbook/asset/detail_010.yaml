  - 这个是比抖查查蝉妈妈这些第三方要更准确的行业优秀爆款视频库.
  - 对标对标,这里上榜的,出成绩的,最新的,不就是最好的对标吗?
  - 我的思路是找那种,粉丝量少,但是销量高的视频,做参考
  - 视频下载下来,可以用飞书妙记,语音转文字,你懂得.
- 'no': 4
  name: 做人群不做货 —— 让内容精准"钓鱼"
  points:
  - '**为什么需要这个概念？**'
  - '- 同质化“卖货视频”陷入红海厮杀：大家都搬运同款商品视频，靠量博爆款概率，极易触发平台搬运打击'
  - '- 商品视频受众泛、意图弱，转化率低；人群视频针对特定人群情感需求，流量精准、变现效率高'
  - '- 大号有供应链/投流优势，小号硬碰硬必死，必须换赛道打“游击战”'
  - '**核心定义**'
  - '- 从“选品找视频”转为“定人群、挖需求、做内容、再匹配品”'
  - '- 基于“情、趣、用、品”四象限（共情、有趣、有用、新奇特产品）细分人群标签至上千个微分支，选定一个深耕'
  - '**关键性质**'
  - '- 差异化护城河：内容护城河比商品护城河深，同行难以通过换链接直接复制'
  - '- 标签穿透力：视频号算法依据内容打人群标签，人群内容一致性强，标签越准，推流越精准'
  - '- 变现杠杆：精准人群允许高客单价、高复购，甚至可输送直播基地拿分成，实现“超级个体”放大'
  - '**典型例子**'
  - '- 白领虚荣穷人群（A号）：内容聚焦“月薪三千住大平层/买大牌平替”，匹配轻奢平替好物，2天破百万播、7天变现2万+'
  - '- 50+女性亲情共情（C号）：内容聚焦“儿女不孝/婆媳矛盾/独自养老”，匹配健康养生品，单日4000万播、7天破亿但变现仅3万（人群太泛）'
  - '- 80-90后怀旧情怀（B号）：内容用老物件/老动画触发记忆，匹配情怀文创/零食，变现稳健'
  - '**边界条件**'
  - '- 人群定位越细，总流量池越小，需权衡“精准度”与“流量上限”'
  - '- 内容生产需持续产出该人群专属的“情/趣/用/品”素材，素材库枯竭会导致断更'
  - '- 变现环节必须匹配人群支付能力：别给学生党卖千元课，别给养老群体卖潮玩'
  sources:
  - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
    role: origin
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: apply
  excerpts:
  - 四、视频号别人做商品，我做人群，伪原创。
  - 做商品类型的种草视频成功概率太小了，并且还有很多有船的大佬，现在都开始付费了，像我这样的单打独斗打不过。大路上的人太多了，我换条小路。
  - 我把短视频内容分为"情趣用品"四个字...所有短视频平台的爆款内容，都可以纳入其中。
  - 抖音，快手，优酷，知乎，小红书，甚至TK，所有的短视频平台都是你的素材库。
  - 选品其实就是定人群然后找需求，大家能理解这句话，就很好选品了。
- 'no': 5
  name: 全平台二创法 —— 让全网爆款为我所用
  points:
  - '**为什么需要这个概念？**'
  - '- 单一平台素材库有限，且易触发平台内部查重；跨平台搬运（抖音→视频号）因算法差异常导致“不适水土”'
  - '- 优质内容内核（情绪钩子、叙事节奏、视觉语言）具有跨平台通用性，只需“换皮”即可复用'
  - '- 零成本获取无限素材：抖音、快手、小红书、知乎、B站、TikTok 全是免费素材库'
  - '**核心定义**'
  - '- 以“情、趣、用、品”四象限为底层逻辑，跨平台搜索高互动素材，通过拼接、换音乐、调节奏、加字幕、植入混淆元素等“非违规二创”手段，生成符合目标平台调性的原创内容'
  - '- 核心原则：不违规（过原创审核）、有迹可循（保留爆款内核）、赛道化（植入自家产品/人群标签）'
  - '**关键性质**'
  - '- 素材泛化：不执着于“同品类”素材，而找“同逻辑”素材（如教PPT的节奏可用来教养生操）'
  - '- 经验沉淀：制作几十条后，大脑自动建立“片段-音乐-节奏”的拼接直觉，从“找素材”进化为“造素材”'
  - '- 反脑裂机制：多赛道并行时，需分时段找素材（如早做养生、晚做教辅），避免思维切换成本过高'
  - '**典型例子**'
  - '- 从抖音找“80岁老人做口播”反差感片段（趣），配上养生知识文案（用），BGM换轻音乐，首尾加自拍，发视频号成爆款'
  - '- 从小红书找“北方人没见过酸角糕”新奇特素材（品），改编为“南方人没见过的北方年货”，匹配食品带货'
  - '**边界条件**'
  - '- 必须理解目标平台“审核红线”与“推荐偏好”（如视频号偏好真人出镜/中老年语调，抖音偏好节奏快/视觉冲击）'
  - '- 严禁搬运含水印、Logo、可识别人像的原始素材，必须深度二创（重新剪辑、重新配音、重新包装）'
  - '- 素材来源平台若起诉版权，需保留二创证据链（工程文件、素材来源记录、修改痕迹）'
  sources:
  - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
    role: origin
  - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
    role: improve
  excerpts:
  - 抖音，快手，优酷，知乎，小红书，甚至TK，所有的短视频平台都是你的素材库。
  - 通过这个底层逻辑，你会发现很多爆款都是有迹可循，我们要做的无非是把这些素材不违规的二创成自己赛道的作品，进行发布。
  - 通过大概几十条作品的制作之后，你大概率会发现其实有些作者没上热门的视频，其实他的画面或者他们音乐很好。你就会开始留意那些视频的那些片段，或者音乐，脑海里面会自然给他做一个合适的拼接。
  - 找这个视频模板拆解后的每个元素相似的素材，比如背景图，内容素材、背景音乐等。
- 'no': 6
  name: 对标黑马样本 —— 避开"大佬光环"看真功夫
  points:
  - '**为什么需要这个概念？**'
  - '- 大号爆款往往依赖粉丝基数、投流加持、品牌溢价，去除这些外部变量后，内容本身未必可复制'
  - '- 小号（粉丝<5万）能跑出高GMV，说明其内容结构、选品、话术具有极强的“裸奔带货力”，最值得新手拆解'
  - '- 第三方工具常推荐大号案例，需自建筛选逻辑反向淘金'
  - '**核心定义**'
  - '- 筛选标准：粉丝量<5万 + 视频数>200条 + 围绕固定垂直品反复带 + 画面干净(无重字/水印) + 夹杂非带货内容 + 保持更新'
  - '- 核心指标：单视频GMV / 粉丝比（该比值越高，内容自带带货能力越强）'
  - '**关键性质**'
  - '- 可复制性强：小号无团队、无投流、无供应链优势，其成功因子高度浓缩在“内容-货-场”基础动作中'
  - '- 素材安全：小号视频被搬运概率低，且号主同步运营视频号概率小，降低跨平台撞车风险'
  - '- 素材丰富：视频数>200提供充足拆解样本，可横向对比同一产品不同脚本的转化差异'
  - '**典型例子**'
  - '- 快手搜“护腰带”，找到粉丝2万、视频300条、固定带3款护腰的账号，其单条视频GMV达5万，远超同量级头部大号均值'
  - '- 该账号视频画面干净、无硬广感、穿插“医生科普”非带货视频建立信任，完美符合筛选标准'
  - '**边界条件**'
  - '- 需人工逐个查看主页验证，无法完全自动化筛选（RPA难以判断“画面干净”“夹杂非带货”等主观指标）'
  - '- 部分黑马号实为大号小号/矩阵号/员工号，需警惕“伪黑马”，可通过注册主体、发布设备、相似度交叉验证'
  - '- 仅适用于“内容驱动型”赛道，强依赖“主播个人IP/供应链垄断/私域沉淀”的赛道，小号难复制大号逻辑'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: apply
  excerpts:
  - 我的思路是找那种,粉丝量少,但是销量高的视频,做参考
  - 这种黑马小达人更是我们小达人适合学习的对象,毕竟大达人都是有粉丝基础加成在的,销量天然会高一点.
  - 粉丝在5W以下、视频在200以上、一直围绕几个品反复带、视频画面不是自己加很多字的、有一定的非带货视频、保持更新，这样的号我就会把它列入考察目标。
  - 小号就代表被搬过的几率小，而且号主本人同时在发视频号的几率也小。
- 'no': 7
  name: 加字引导出单 —— 让视频会"说话"
  points:
  - '**为什么需要这个概念？**'
  - '- 搬运/二创视频本身无语音讲解、无强引导，用户看完不知怎么买、为什么买、为什么现在买'
  - '- 视频号用户年龄偏大、阅读习惯强、对醒目文字敏感，一句精准文案胜过十个华丽转场'
  - '- 视频内容同质化严重时，“加的字”成为唯一差异化变量，直接决定点击率与转化率'
  - '**核心定义**'
  - '- 在视频去重处理最后一步，针对产品特色/作用/目标人群痛点，添加1-2句醒目颜色、大字号、人设化/场景化的引导文案'
  - '- 文案公式：[人设/场景] + [痛点/爽点] + [产品关键动作] + [隐性行动指令]'
  - '**关键性质**'
  - '- 低成本高杠杆：零拍摄成本、零技术门槛，修改文案即可A/B测试，迭代周期以分钟计'
  - '- 归因神器：通过对比同款视频不同文案的出单数据，精准定位用户决策触发点，反哺选品与产品卖点提炼'
  - '- 算法友好：文字信息可被平台OCR识别，辅助算法理解视频意图，提升推流精准度'
  - '**典型例子**'
  - '- 拖把带货：视频原本只是拖地演示，加字“今天惹老伴生气了，罚我做一天家务，还好有这个拖把” → 场景化+情绪化+隐性种草，出单激增'
  - '- 养生茶带货：加字“医生说这茶寒性重，脾胃虚寒的别喝，我家老伴喝了手脚不凉了” → 专家背书+人群筛选+对比反馈'
  - '**边界条件**'
  - '- 字幕遮挡核心画面/产品细节会得不偿失，需预留“安全区”布局文字'
  - '- 文案不可违规（绝对化用语、诱导分享、医疗承诺等），否则触发人工审核导致限流'
  - '- 需配合“评论区造互动”（置顶关键词回复、小号带节奏）形成闭环，单靠视频加字转化有天花板'
  sources:
