- 'no': 8
  name: 视频去重流水线 —— 让搬运视频洗白上岸
  points:
  - '**为什么需要这个概念？**'
  - '- 直接搬运必死：平台查重系统对MD5、特征码、关键帧、音频指纹全维度检测，原视频上传必判违规'
  - '- 手工去重效率低、标准不一、易漏项，必须固化为标准化SOP流程，配合工具/代码批量执行'
  - '- 去重不是目的，过审+保留原视频带货力才是目的，处理度要在“通过查重”与“保留完播率”间平衡'
  - '**核心定义**'
  - '- 固定四步处理链：放大画面(105%-110%) → 镜像翻转(水平) → BGM处理(换/加底/变速) → 识别遮盖原字幕+添加引导字幕'
  - '- BGM处理分级：有讲解无BGM→加BGM底；有讲解有BGM→变速1.1-1.2倍；纯BGM→直接换同节奏曲目'
  - '**关键性质**'
  - '- 确定性高：固定流程可稳定通过机器查重，将“不确定的搬运”变为“可控的二创”'
  - '- 可工具化：每步均有成熟剪辑软件功能/命令行工具对应，极易封装为自动化脚本/剪映宏'
  - '- 保留语义：不改变原视频核心展示逻辑（产品特写、使用演示、对比实验），保留带货转化力'
  - '**典型例子**'
  - '- 批量处理50条竞品带货视频：用Python+MoviePy脚本跑完四步流程，耗时20分钟，过审率95%以上'
  - '- 剪映宏：录制一次“放大-翻转-变速-智能字幕-导出”动作，保存为宏，后续一键套用'
  - '**边界条件**'
  - '- 过度处理（如变速1.5倍、强滤镜、大面积贴纸遮挡）会破坏视频观感，导致完播率暴跌，得不偿失'
  - '- 含真人出镜/特定场景/版权音乐的视频，去重后仍存肖像权/版权风险，建议仅作参考重拍'
  - '- 平台查重模型持续迭代，固定流程周期性失效，需建立“小号测试→大号发布”的灰度验证机制'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 我基本是一个固定的处理流程，放大→翻转→bgm→加字。
  - 带讲解的但没有bgm的视频，我会给他加个bgm的底。本身又有讲解又有bgm的，我就会整个变速啥的，调个1.1倍1.2倍稍微弄一下。
  - 没字幕的识别个字幕，有字幕的也识别个字幕，把原先的给他遮了。
  - 视频搬运的固定处理流程：放大→翻转→BGM处理→加字，其中“加字引导”被认为是出单关键而非视频本身。
- 'no': 9
  name: 视频即流量入口 —— 直播间的"引水渠"
  points:
  - '**为什么需要这个概念？**'
  - '- 视频号直播间无自然推流入口，绝大部分流量来自“在跑”的短视频挂载直播预约/入口'
  - '- 盲目开播（无视频跑量）场观极低（十几人），浪费时间精力，还可能因“无人互动”被判无意义直播封禁'
  - '- 视频与直播是“种-收”关系，视频负责拉新、打标签、蓄水，直播负责深度转化、客单价提升'
  - '**核心定义**'
  - '- 运营节奏：监控视频实时数据，仅当有视频破万播放/持续进人时开播；视频流量衰退立刻关播，不硬扛'
  - '- 反复开关播：单场直播1-3小时，一天可开5-10场，每场对应不同爆款视频的流量波峰，最大化流量利用率'
  - '**关键性质**'
  - '- 流量确定性：视频数据是直播流量的领先指标，用视频数据决定开播，胜过凭感觉开播'
  - '- 节奏可控：避免长时间无效直播消耗账号权重，也避免错过流量高峰期'
  - '- 话术复用：同一产品的直播话术可标准化、模块化，配合视频流量波段反复使用'
  - '**典型例子**'
  - '- 作者第3天：新视频破万→开播1小时出6单 → 关播 → 另一视频起量 → 再开播 → 单天5场累计出20单'
  - '- 第4天流量衰减（从峰值4000万降至2000万） → 主动压缩直播时长至3小时，引入外部直播基地托管'
  - '**边界条件**'
  - '- 仅适用于“视频带货→直播承接”模式，不适用于纯自然流量直播间/付费投流直播间/品牌自播间'
  - '- 需建立“视频-直播”复盘机制：记录每场直播对应的源视频ID、进人数、停留、转化、GMV，积累选品-排播规律'
  - '- 直播间违规风险随时长增加而累积，单场建议≤3小时，日累计≤5小时，避免“无意义直播”判责'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
    role: apply
  excerpts:
  - 终归还是要靠视频给直播间带流量。所以我后面都是看有没有视频在跑，或者就是按群里说的，有新视频破万了就去播。
  - 视频没有在跑，就没必要直播了。
  - 去尝试了另外两个号的直播，挺惨的，俩都播了一小时，场观就十几。
  - 账号爆了三天，自己播了三天...第四天大概只有2000万左右播放了，我把直播时间减少到3个小时。
- 'no': 10
  name: 爆款生命周期管理 —— 在流量枯竭前"换血"
  points:
  - '**为什么需要这个概念？**'
  - '- 视频号爆款视频生命周期极短：通常爆发3天、第4天开始断崖式衰减，单账号持续变现窗口仅3-5天'
  - '- 死守单一账号/单一爆款会导致流量归零、账号废弃，必须建立“矩阵接力+外部托管”的延续机制'
  - '- 个人精力有限，无法同时兼顾内容生产、直播带货、供应链对接，需在巅峰期引入外部资源分担'
  - '**核心定义**'
  - '- 生命周期三阶段：起爆期(1-3天，全力直播收割) → 衰退期(4-7天，压缩直播、引入基地) → 存量期(7天+, 仅靠视频自然单/老客复购)'
  - '- 矩阵接力：同时运营3-5个账号，错峰起爆，保证任意时刻至少有1个账号处于起爆期/爆发期'
  - '- 外部托管：将成熟账号(有稳定流量、明确人群标签)输送给直播基地/供应链商家“日不落”直播，创作者拿分成、专注做流量'
  - '**关键性质**'
  - '- 反脆弱性：单账号寿命短、风险高，矩阵+托管将风险分散，将“打工者”转型为“超级个体户”'
  - '- 现金流平滑：避免单账号“三天赚五万、一个月没收入”的极端波动，实现相对稳定的现金流'
  - '- 资产沉淀：账号、人群标签、内容模板、选品库、话术库均为可复用资产，账号死掉资产不死'
  - '**典型例子**'
  - '- 作者4账号矩阵：AB号第7天破千万播、变现2万+；C号第7天破亿播、变现3万；D号20条无反馈放弃 → 整体7天10万粉、5万+利润'
  - '- 第4天主动减少直播时长、联系直播基地合作：账号给基地播，基地给供应链、客服、发货，创作者只管发视频拉流量'
  - '**边界条件**'
  - '- 矩阵规模受限于内容生产能力：自动化生产可支撑更大矩阵，手工剪辑建议≤5号'
  - '- 托管分成比例需精算：基地通常分3-5成，需确保剩余利润覆盖内容生产成本+时间机会成本'
  - '- 账号所有权/运营权归属需合同约定，防止基地“养熟账号换人播”踢走创作者'
  sources:
  - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
    role: origin
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: apply
  excerpts:
  - 账号爆了三天，自己播了三天，真的坐下来开播就是钱。一个小时几千块的感觉，会让人沉迷。但我意识到不能这样，如果每时每刻都在直播，我没有精力去做内容，流量迟早被消耗完。
  - 而且主要三个账号一起爆，我只能选择最好的账号直播。吃了三天最高峰流量。第四天大概只有2000万左右播放了，我把直播时间减少到3个小时。
  - 在账号第四天我就想过招主播了...正好想到这个基地这个，我跟他聊把账号拿去给他们播...我只需要专注做流量，拿分润。
  - 专注流量自己孵化账号，同步找伙伴加入一起做账号。做出的账号输送到基地去日不落。
- 'no': 11
  name: 克服知识诅咒 —— 让执行力穿透认知迷雾
  points:
  - '**为什么需要这个概念？**'
  - '- 认知越深（看过太多课程、复盘、案例），越容易陷入“精神内耗”：担心变现难、资源浪费、未来风险、路径不纯'
  - '- 悖论：懂得越多的人反而做不起来，不懂/不怕死的“小白”反而跑通闭环拿到结果'
  - '- 副业/创业初期，执行力的边际收益远高于认知精度，先跑通再优化才是正道'
  - '**核心定义**'
  - '- 识别“远处的困难”（变现模式未定、资源利用率、长期护城河）属于伪命题，强制屏蔽'
  - '- 设定“近处的指标”：每天1个账号发10条视频、每天最多看1次后台数据、不看同行报喜只看自己数据'
  - '- 变现验证唯一标准：去看对标账号怎么变现、赚多少钱，而非脑补'
  - '**关键性质**'
  - '- 认知降维打击：用“傻瓜式执行力”击穿“聪明人的犹豫”，在行动中获得真实反馈修正认知'
  - '- 焦虑隔离层：不看后台数据=切断焦虑源，用“发视频数量”替代“播放量”作为过程考核指标'
  - '- 正反馈循环：完成日更目标→获得成就感→坚持次日执行，避免因数据波动导致情绪波动断更'
  - '**典型例子**'
  - '- 作者早期：深谙短视频逻辑、知晓变现难点、手握资源 → 陷入精神内耗、迟迟不发视频'
  - '- 作者破局后：定目标“日更40条”、不看后台、只看对标变现 → 7天4号破亿播、5万+利润'
  - '- 克服内耗两招：1) 想知道怎么变现→去看对标；2) 怕没播放→不看后台、定量化动作目标'
  - '**边界条件**'
  - '- 仅适用于“0-1冷启动/探索期”，规模化阶段（1-N）必须引入精细化数据运营、风控、合规体系'
  - '- 不能用“盲目执行”掩盖“战略性懒惰”：方向错误时，越执行越偏离，需设置“周复盘/月复盘”战略检查点'
  - '- 核心前提：已完成基础信息收集（航海手册、群消息、关键词搜索阅读5遍+），非盲目裸奔'
  sources:
  - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
    role: origin
  excerpts:
  - 这部分人群其实对短视频平台，内容制作有很深刻的理解，但是考虑的太多。比如：我做情感账号应该怎么变现，变现效果万一不好怎么办，我的资源能不能尽量的都用上等等远处的困难。
  - 反而没有顾虑的人执行起来更容易拿到结果，切勿陷入精神内耗。
  - 第一点大多数人都会在意的点，账号如何变现，能赚多少钱？这点其实航海教练也说过很多次了，想知道你的赛道如何变现去看你的对标。
  - 第二点没有播放量的焦虑如何克服？不去看他，我给自己定的目标是一天一个账号10条视频...一天最多看一次后台数据，去分析视频号的人群喜欢看什么类型的内容。
- 'no': 12
  name: RPA自动化采集 —— 让机器人当你的"情报员"
  points:
  - '**为什么需要这个概念？**'
  - '- 官方爆款视频库数据量大、更新快，人工逐条点击、复制、下载效率极低，且无法持续跟进'
  - '- 编程门槛高、维护成本高，非技术人员难以开发爬虫；RPA（影刀等）以可视化流程/低代码降低门槛'
  - '- 需将“采集-清洗-入库-下载”全链路自动化，才能支撑每日/每周级的对标迭代节奏'
  - '**核心定义**'
  - '- 基于影刀RPA开发两类采集机器人：①创意搜索采集（按关键词/商品名+GMV过滤）②爆款库分类采集（按行业/等级/周期）'
  - '- 核心参数：搜索词/类目、滚动页数、GMV阈值、导出路径、是否下载无水印视频、断点续爬/记忆上次参数'
  - '- 输出物：结构化数据表格(含视频链接、GMV、销量、粉丝、作者等)+ 无水印视频文件夹'
  - '**关键性质**'
  - '- 低门槛：产品经理/运营可通过“一点编程思维+RPA”自主开发，无需专业工程师'
  - '- 高自由度：相比后羿采集器等固定软件，RPA可应对复杂动态页面、验证码、弹窗等异常情况'
  - '- 可复用性：将通用操作（登录、滚动、提取、下载）封装为模块，新需求拼积木式组装'
  - '**典型例子**'
  - '- 创意搜索机器人：输入“护腰带”、滚动20页、GMV>1000、勾选下载 → 22秒/页 自动产出Top高GMV视频素材包'
  - '- 爆款库分类机器人：选“大健康-养生-L1-L3-近7天”、滚动50页 → 55秒/页 自动产出周度行业榜单'
  - '- 配合飞书妙记批量语音转文字，完成“视频→文案→脚本库”全自动化流水线'
  - '**边界条件**'
  - '- RPA运行独占本地桌面（锁鼠标键盘），无法并行操作，建议部署云桌面/备用机/无头模式'
  - '- 官方页面结构变更会导致选择器失效，需建立“监控告警+快速修复”机制，或转向官方API'
  - '- 免费版影刀/其他RPA工具可能有并发数、运行时长、功能限制，规模化需评估付费版ROI'
  - '- 视频下载涉及版权灰色地带，仅限内部拆解学习，严禁直接搬运发布或商业分发'
  sources:
  - paper: docs/202301-02/CGZ4dZq4ZoSFT4xUmFecNpk4nNe.md
    role: origin
  - paper: docs/202301-02/JmBgdr705ovHoyxQknRctRaMnKh.md
    role: improve
  excerpts:
  - 指定搜索词/商品名;滚动刷新次数;按gmv过滤视频,默认过滤0销量;数据采集表格导出,默认到桌面;可选视频下载(无水印);记住上次输入的内容
  - 点击确定开始运行,不刷新页数,1页下载完就22秒左右吧
  - 可选大行业,子行业类目;可选作者等级;可选时间周期;下拉刷新页数;数据采集表格导出,默认到桌面;可选视频下载(无水印);记住上次输入的内容
  - rpa更自由吧,只要你有想法,加上一点点的编程思维,即使你不是专业的程序员,也能写出来能用的脚本.我不是程序员,最多算个半吊子的产品经理.
  - 我还自己用影刀做了个无人直播机器人...跑通了,不过不太好用,脚本执行的时候电脑就不能操作了...
