paper: docs/202301-02/JPRAdLgGFowUE7xargGc8YNjnzh.md
desc: 该素材由睿思学院创始人李思念撰写，系统阐述了其原创的「心金文案」写作方法论。素材提出文案区别于文章，需兼具'吸金'（商业变现）与'深入人心'（情感共鸣）双重属性。内容涵盖写文案前的三重思考（目的、受众、平台）、文案写作的道与术、具体写作方法论（风格、灵感记录、富兰克林复写法、共鸣感构建），以及培养持续输出能力的方法（输入带动输出、三类输入内容、建立素材库、持续重复练习）。素材强调文案是思维的显化，主张通过深度思考、多角度思维和高质量输入来提升文案力与个人IP影响力。
concepts:
- name: 心金文案
  desc: 作者独创的文案风格概念，寓意既能吸金（具备商业变现属性）又能深入人心（蕴含感情、带来情感触动）的文案类型。
  is_original: true
  excerpt:
  - 2022年，我给我的文案风格，终于敲定了一个名字，叫做「心金文案」，寓意是既能吸金、又能深入人心的文案。
  - 文案不同于文章，文案本身就带有一层商业变现属性，所以能够吸金才是关键，而文案又需要蕴藏感情、给人能带来触动，所以深入人心的写法，也是必要。
- name: 自嗨式写文案
  desc: 指写文案者沉浸在自己的世界里，按照自身局限性想法创作，误以为用户想看的内容其实用户并不一定想看的错误写作状态。
  is_original: false
  excerpt:
  - 很多做私域的朋友，为什么发了无数朋友圈但是咨询寥寥无几？大概率是因为他陷入了一种自嗨式写文案的状态。他沉浸在自己的世界里，按照自己的局限性想法去发文案，他以为用户会想看的内容，其实用户并不一定想看。
- name: 文案是思维的显化
  desc: 作者的核心观点，认为写作过程就是将思考与价值观传递出来的过程，文风受起心动念影响，思考的清晰决定写作的清晰。
  is_original: true
  excerpt:
  - 我曾经说过，文案是思维的显化。写作的过程其实就是把你的思考你的价值观传递出来，那么我们只要去写文案，一定其中就会包含着我们态度的表达，你的每一次起心动念，都会影响着你文字的风格与走向。
  - 写作也是一个看待事物思考的过程，思考的清晰，才能写的清晰，好的文案往往是源自于深度思考的。
- name: 闪光文件夹
  desc: 作者个人使用的灵感记录工具概念，用于随时记录日常生活中突然迸发的灵感与感悟，作为原创素材的积累。
  is_original: false
  excerpt:
  - 在我自己的备忘录里，就有一个「闪光文件夹」，这里面都是我平时突然迸发出来的灵感记录，我朋友圈很多文案也不是在发表的那一刻才想出来的，而是在我的备忘录里已经积累了很久的。
- name: 文案素材库
  desc: 建议建立的个人知识管理工具，将阅读学习中积累的好词句、观点、文章分门别类收集整理，便于反复翻阅与快速获取写作灵感。
  is_original: false
  excerpt:
  - 这里我建议大家可以建立一个属于自己的「文案素材库」，因为在这个快节奏的时代，只看一遍的内容可能转眼就忘，而拥有一个专属自己的素材库，全部都是高价值的精华内容，会更有利于自我的精进。
  - 做素材库的时候，可以进行分门别类的整理，因为如果不同的话题都掺杂在一起，未来我们想找的时候也会比较麻烦，所以在日常积累时就提前做好分类，会更高效。
methods:
- name: __overview__
  desc: 心金文案整体方法论，由'道'（底层思维逻辑）与'术'（写作方法技巧）结合构成，包括写作前的三重思考、五术（风格、灵感记录、富兰克林复写法、共鸣感构建、持续输出能力培养）三大板块。
  excerpt:
  - 文案的写作，也是需要术道结合的。道，是文案底层的思维逻辑。……而文案的术，则是写文案的方法技巧，比如说写作方法是属于术的，文案风格是属于术的，哪种话能更让人产生信任感也是属于术的。
  - 不断输入，高频思考，适当技巧，大量练习。——这就是写好文案乃至提升思维能力的秘诀。
- name: 写文案前的3重思考
  desc: 写作前的三个前置性思考问题方法：明确写作目的（宏观与微观两层）、明确目标受众（理解用户特征与需求）、明确发布平台（根据平台特性调整文案风格），确保文案不跑题、不陷入自嗨。
  excerpt:
  - 你写文案的目的是什么？你的文案是写给谁看？文案发布在哪些平台？
  - 我们在写文案之前，需要思考两层目的。一层是宏观的，你整体文案的方向是为了实现什么？……一层是微观的，具体到每一个单条文案要达到什么目的？
  - 你要先去理解用户，然后才能写好文案甚至于做好营销。
  - 同一条文案，适当根据平台特性去修改，就可以实现多平台分发，真正让一条文案实现成倍放大影响力的效果。
- name: 三个为什么思维训练法
  desc: 提升深度思考能力的方法，遇到任何事情时连续追问三个'为什么'，挖掘内心深处的想法，倒逼自己思考并做出独立判断。
  excerpt:
  - 第一种，遇到任何事情多问自己三个'为什么'？为什么是这样？为什么会发生这件事情？为什么我要去做这件事情？这个其实就是挖掘内心深处的想法，也是倒逼自己思考，做出独立的判断。
- name: A纸头脑风暴方法
  desc: 源自《零秒思考》的快速思维训练方法，用1分钟在A4纸上写下想法，每张纸写一个主题，写4-6行，每行20-30字，每日写十张，长期训练可提高深度思考能力。
  excerpt:
  - 将一张 A4 纸横放在面前，每张纸写一个主题，1 页写 4～6 行，每行 20～30 字，写每张纸所用的时间要控制在 1 分钟以内。每天去写十张纸，也就是花十分钟的时间。
  - 这个方法虽然简单，但如果长期训练可以轻松提高深度思考的能力。
- name: 多角度思维法
  desc: 突破思维困局的方法，通过主动变换观察角度来打破思维局限，避免陷入思维死角，适用于情感、工作、人生、写文案等各个领域。
  excerpt:
  - 第三种，学会多角度思维。其实很多时候我们的困顿是源于局限的。只要改变角度，一切都会随之而变。太专注于事物本身，我们只会局限在事物的某一方面……阻碍我们的不是往往事物，而是我们看事物的角度。
- name: 富兰克林写作法
  desc: 源自富兰克林自传的写作训练方法，通过'复写'方式锻炼写作能力：先看一遍优秀文案，关闭后再用自己的话重新写出，与原文对比找出表达薄弱点，并请他人点评优化。
  excerpt:
  - 什么叫做复写？就是你先看一遍文案，然后把它关闭，尝试用自己的话去再次写出来，然后你会发现，每一次你写出来的内容都不一样，然后你去跟原文案对比，去发现自己表达不清晰的地方在哪里，那就是你写作的薄弱点。
  - 然后当大家写出来一个文案的时候，不要孤芳自赏，可以去找一些朋友或者专业人士帮助你点评你的文案，提出建议。
- name: 共鸣感构建法
  desc: 通过'构建相似'来引发读者共鸣的写作方法，包括三个方向：经历的共鸣、感受的共鸣、价值观的共鸣。核心是在文案中代入生活场景感受，贴近现实，唤起用户记忆中的相似情境。
  excerpt:
  - 这种共鸣，是需要通过「构建相似」来进行的。可以在文案中代入生活场景感受，贴近现实，你所感受到的喜怒哀乐，用户也能同样感受到。
  - 分享给大家3个方向：经历的共鸣，感受的共鸣，价值观的共鸣。
  - 世间万物其实都遵循着吸引力法则，低能量会被高能量吸引，那你就必须要先把自己的势能打造起来，勇敢的在文案里去表达你的心声，才会引发别人的共鸣。
- name: 输入带动输出法
  desc: 以高质量阅读输入带动文案输出的方法，核心观点是思维提升必须通过不断输入实现，输入后需经过'内化'过程转化为自身认知。
  excerpt:
  - 千万不要自己闷头苦想，因为你的认知基础薄弱，你想半天想出来的很可能归因逻辑就是错的。
  - 思维是一定要通过不断输入才能得到提升的，踩着巨人的肩膀，你会看到更广阔的天空。
  - 输入完了之后，还要思考。因为从明白到掌握，有一个「内化」的过程。
- name: 三类内容输入法
  desc: 按照故事类、评论类、商业类三个递进层次选择输入内容的系统方法：故事类看表达方式与语句通畅，评论类看逻辑与结构，商业类看观点与文案套路。
  excerpt:
  - 建议大家看三类，可以先从【故事类】的内容看起，然后去看一些【评论类】的内容，最后再去看一些【商业类】的内容。
  - 看故事类的内容是看表达方式，是看语句的通畅，连贯的表达，是把一件事情说明白的能力。
  - 接着看【评论类】的内容，比如书评，影评等等，这类是去看逻辑的。
  - 最后再看【商业类】的内容，这类内容是看观点和文案套路。
- name: 100问练习法
  desc: 持续输出能力培养的具体练习方法：整理行业最常见的100个问题，能回答的自己回答，不能回答的从书籍、行业大神处求教后用自己的话写出来，以建立专业认知体系并提升文字输出能力。
  excerpt:
  - 去把你行业里最常见的100个问题整理出来，能自己回答的自己尝试回答，不能自己回答的去各种书籍、行业大神那里求教获得答案，理解之后再用自己的话写出来。
  - 一定是用自己的话写出来，不是去照搬或者模仿别人的语言，那样你还是没有思考、没有自己文风的。
  - 大家可以试一试，当写完这100个问题的回答之后，不仅你的专业认知体系完整建立了，文字输出能力也提升了。
theorems:
- name: 一条文案，一个主旨
  desc: 核心主张：每条文案只需围绕一个主旨写作，过多主旨会让人眼花缭乱、无法抓住重点，明确主旨是写文案不跑题的先决条件。
  excerpt:
  - 先明确一条文案的表达主旨，然后围绕着这一个主旨来写。一条文案，一个主旨就足够了。太多了，就会让人眼花缭乱，反而无法抓住重点。
- name: 文案是思维的显化，思考清晰才能写得清晰
  desc: 核心主张：文案写作是思维过程的显性呈现，文风受写作者起心动念影响，深度思考是写出好文案的根本前提，需通过三个为什么、A4纸头脑风暴、多角度思维等方法提升思考力。
  excerpt:
  - 我曾经说过，文案是思维的显化。写作的过程其实就是把你的思考你的价值观传递出来，那么我们只要去写文案，一定其中就会包含着我们的态度的表达。
  - 好的文案往往是源自于深度思考的，所以我们要提升自己的思考能力以及思考深度。
- name: 统一的文案风格是形成记忆点的前提
  desc: 核心主张：文案风格应统一协调，风格频繁变换不利于形成记忆点；形成差异化、标签化的个人风格是确立形象、持续吸粉的关键。
  excerpt:
  - 如果说你的文案能够让别人在阅读的时候，感叹出来这一定是谁写的文案，那其实就证明你成功了，你已经形成了自己的风格。
  - 很多人写文案，是没有一个统一风格的，今天俏皮可爱，明天又是犀利毒舌，后天又成了沉稳温柔——这样反而不利于形成记忆点。所以一定要想明白，自己要形成哪种文案风格，统一、协调，才能持续吸粉。
- name: 硬性模仿和套用模板会局限思维
  desc: 核心主张：写作应避免硬性模仿他人或套用所谓模板，因为这会束缚文案力与创造力，使写作者无法真正理解文案背后的吸引点和逻辑性。
  excerpt:
  - 这种就是根本没掌握文案写法，自以为很聪明，但实际上束缚了自己的文案力和创造力，她只会在我的文案框架里去改写，却从未思考我文案中的吸引点和逻辑性。
  - 所以大家写作记住，千万不要硬性模仿，更不要去套什么所谓的模版，那只会局限你的思维。
- name: 文字掌控力越强，信息捕捉能力与思维层次越高
  desc: 核心主张：学会写文案具有'逆天改命'的效果，对文字掌控力越强，对信息越敏感，越容易捕捉有价值的信息，促使思维层次快速提升。
  excerpt:
  - 学会写文案，是真的有逆天改命的效果的。你对文字掌控力越强，对信息也会越敏感，也更容易捕捉到有价值的信息，而这些信息的摄入会让你的思维层次快速提升，脱颖而出。
- name: 高质量输入3个月即可大幅提升思维水平
  desc: 核心主张：不同于《红楼梦》中黛玉所说的'一年'，真正高质量的输入仅需3个月即可使思维水平得到大幅度提升。
  excerpt:
  - 黛玉说的是一年，在我看来一年算长了，真正高质量的输入，只需3个月，你的思维水平就会得到大幅度的提升。
findings:
- name: 个人IP标签中文案力首当其冲
  desc: '[claim] 作者自我宣称其个人IP标签中最为人记忆的是文案力，坚持更新朋友圈年输出超百万字，文案在创业圈广泛传播，小红书吸粉无数且变现超7位数。'
  excerpt:
  - 我身上被人广为记忆的个人IP标签中，首当其冲的应该就是我的文案力。我坚持更新朋友圈，年输出超过百万字，写的文案在创业圈被广泛传播，在小红书上也通过文案吸粉无数，变现超过7位数。
- name: 私域朋友圈咨询寥寥的原因诊断为自嗨式写作
  desc: '[claim] 作者认为做私域的朋友发无数朋友圈但咨询寥寥无几的主要原因是陷入自嗨式写文案的状态——按照自己的局限想法发文，而非用户想看的内容。'
  excerpt:
  - 很多做私域的朋友，为什么发了无数朋友圈但是咨询寥寥无几？大概率是因为他陷入了一种自嗨式写文案的状态。
- name: 小红书模仿案例证实差异化风格的竞争优势
  desc: '[evidence] 作者以''很多朋友跑来跟我说某人的小红书是模仿你的''这一日常反馈作为案例支撑，说明形成鲜明差异化文案风格能树立自身形象并形成记忆点，且风格统一协调才能持续吸粉。'
  excerpt:
  - 比如很多朋友会跑来跟我说，谁谁谁的小红书是模仿你的，这就是我的文案风格形成的优势，特点分明。
- name: 文字掌控力与信息捕捉能力的正向关系
  desc: '[claim] 作者主张对文字掌控力越强，对信息越敏感，越容易捕捉有价值信息，信息摄入促进思维层次快速提升，从而脱颖而出。该主张以个人创业经验为依据，未提供系统证据支撑。'
  excerpt:
  - 你对文字掌控力越强，对信息也会越敏感，也更容易捕捉到有价值的信息，而这些信息的摄入会让你的思维层次快速提升，脱颖而出。
- name: 文案写作对个人IP与事业的正向反哺
  desc: '[claim] 作者宣称通过文案传播吸引、影响、感染同频人群，这种影响力反过来加持个人IP并直接作用于事业成绩，即以自身创业经历作为典型案例支撑。'
  excerpt:
  - 当你开始亲自原创文案时，你会发现，自己学会了在字里行间思考，自己慢慢拥有了核心思想，这种思想，通过文案的传播，吸引、影响、感染了更多同频的人。而这种影响力，也反之加持了你的个人IP，会直接作用于你的事业成绩。
