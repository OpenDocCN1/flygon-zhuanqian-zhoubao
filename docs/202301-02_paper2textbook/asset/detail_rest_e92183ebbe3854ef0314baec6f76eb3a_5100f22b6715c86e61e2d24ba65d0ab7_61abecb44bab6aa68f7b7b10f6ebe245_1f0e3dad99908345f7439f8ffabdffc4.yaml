learning_targets:
- 理解 Google Colab 免费云 GPU 环境的资源配额与非持久化特性
- 掌握 Stable Diffusion WebUI 在云端的零基础搭建、启动参数配置与公网访问方法
- 熟练运用四种模型分发方案（Gdrive、gdown、HF 私有仓库、泛化云存储）解决大文件入驻云端难题
- 掌握结构化 Prompt 咒语（正向 Tag、负向 Tag、权重语法）与关键采样参数的组合调优
- 建立“模型决定画风、咒语调控表型”的正确心智模型，能按需选择/融合 Checkpoint 与 LoRA
- 制定免费额度生存策略：多账号轮换、存储分离、启动加速，并评估向付费云 GPU 迁移的临界点
concept_map:
- AI绘画零门槛入门（Colab + SD WebUI）
- ├── 算力载体：Google Colab
- │   ├── 免费 GPU 配额（~15G VRAM, ~55G Disk, 数小时/天） —— P001
- │   ├── 非持久化运行时（断连即清空） —— P001
- │   └── 硬件加速器切换与连接管理 —— P001
- ├── 交互界面：Stable Diffusion WebUI (A1111)
- │   ├── Gradio 可视化封装（txt2img/img2img/Extras...） —— P002
- │   ├── 插件生态（ControlNet/ADetailer/xFormers） —— P002
- │   └── 启动参数注入（--share/--gradio-auth/--deepdanbooru） —— P002
- ├── 资产物流：模型分发四法
- │   ├── Gdrive 挂载拷贝（私有持久、15G 上限） —— P003
- │   ├── gdown 分享链接（小圈子、易限流） —— P003
- │   ├── HF 私有仓库 + Token（隐私、大空间、高速、推荐） —— P003
- │   └── 泛化云存储直链（S3/Mega/R2/OSS 通用） —— P003
- ├── 核心控制：Prompt 咒语工程
- │   ├── 正向 Tag（画质/主体/环境/风格、权重语法、顺序敏感） —— P004
- │   ├── 负向 Tag（通用质量否定、Embedding 强化） —— P004
- │   └── 采样参数套装（Sampler/Steps/CFG/Size/Hires.Fix） —— P004
- ├── 风格基因：模型即画风
- │   ├── 动漫系（NAI/WAIFU，Tag 敏感、赛璐珞/厚涂） —— P005
- │   ├── 写实系（SD1.5/Realistic，自然语言友好、摄影感） —— P005
- │   ├── VAE 解码影响色彩与细节 —— P005
- │   └── LoRA 低秩微调注入特定风格/角色 —— P005
- └── 生存策略：免费额度最大化
- '    ├── 多账号轮换（防风控、手动少量） —— P006'
- '    ├── 存储分离（Gdrive/HF/实例盘分层） —— P006'
- '    ├── 启动加速（预装 Notebook/Docker/缓存） —— P006'
- '    └── 成本临界点（>100h/月 建议付费云 GPU） —— P006'
life_analogy:
- 想象你想画一幅油画，但家里没画室、没画架、没颜料（本地无 GPU）：
- '- **Google Colab** = 一家**免费共享画室**，提供画架（GPU）、画布（内存）、颜料柜（硬盘），但每天只开放几小时，且下班清场（非持久化）。'
- '- **Stable Diffusion WebUI** = 画室里的**智能调色机器人**，你不用自己研磨颜料（写命令行），直接在面板上拨钮选色（可视化参数），它帮你把画画出来。'
- '- **模型文件** = **不同流派的颜料配方包**（二次元水彩包、写实油画包、赛博朋克丙烯包），体积大（几 GB），必须先搬进画室的指定货架（models/Stable-diffusion
  目录）机器人才能调用。'
- '- **模型分发四法** = 四种**搬运配方包的物流渠道**：自家仓库搬（Gdrive）、朋友快递寄（gdown）、官方私有仓库代发（HF+Token）、任意物流直达（泛化云存储）。'
- '- **Prompt 咒语** = 你给机器人的**结构化订单单**：“用大师级水彩纸（masterpiece）、画海边少女（sea beach, girl）、逆光凌厉（chiaroscuro）、别画坏手（bad
  hands:1.1）”、单子写得越精准，成品越像你想要的样子。'
- '- **免费额度生存法则** = **画室会员卡玩法**：办几张卡轮换（多账号）、把常用配方包存在外面仓库随时取（存储分离）、把调色机器人预设好下次直用（启动加速）……玩得太狠（>100h/月）干脆租专业画室（付费云
  GPU）更划算。'
summary:
- concept: Google Colab
  desc: 免费云端 Jupyter 环境，提供 ~15G 显存 GPU、~55G 临时硬盘、每天数小时配额，非持久化
- concept: Stable Diffusion WebUI (A1111)
  desc: 基于 Gradio 的可视化界面，封装 txt2img/img2img/训练等功能，支持插件扩展与启动参数定制
- concept: 模型分发四法
  desc: Gdrive挂载/ gdown分享/ HF私有仓库+Token/ 泛化云存储直链，解决大模型文件入驻云端的物流问题
- concept: 模型文件落盘位置
  desc: 必须拷贝至 /content/stable-diffusion-webui/models/Stable-diffusion/ 目录，WebUI 重载才能识别
- concept: Prompt 咒语（正向）
  desc: 画质+主体+环境/光影/风格 Tag 组合，支持 (tag:1.2) 权重、顺序敏感，Danbooru 逗号分隔风格
- concept: Prompt 咒语（负向）
  desc: 通用质量否定标签套装 + Embedding (如 EasyNegative)，抑制坏手、水印、模糊等伪影
- concept: 关键采样参数
  desc: DPM++ 2M Karras / 20-30 Steps / CFG 7 / 512² 或 768² + Hires.Fix 二次放大
- concept: 模型即画风
  desc: Checkpoint 承载训练数据分布：NAI/WAIFU→二次元；SD1.5/Realistic→写实/摄影；同一 Prompt+Seed 换模型=换风格
- concept: VAE 与 LoRA
  desc: VAE 影响解码色彩锐度；LoRA 低秩微调注入特定风格/角色/动作，权重 0.6-0.9，比换大模型轻量
- concept: 免费额度生存法则
  desc: 多账号轮换+存储分离(Gdrive/HF/实例盘)+启动加速(预装 Notebook)；月需>100h 建议迁移付费云 GPU (RunPod/Vast/Autodl)
exercises:
- 'no': 1
  title: 手搓一个 Colab SD WebUI 启动脚本
  contents:
  - 在一个新的 Colab Notebook 中，按顺序编写代码单元格完成以下任务（不直接复制教程现成脚本）：
  - 1. 切换运行时为 GPU 并连接；
  - 2. 挂载 Google Drive（提示授权）；
  - 3. 克隆 AUTOMATIC1111/stable-diffusion-webui 仓库并进入目录；
  - 4. 安装依赖（使用 --exit 仅安装不启动）；
  - 5. 从 Hugging Face 私有仓库下载一个 Checkpoint 与 VAE 到 models/Stable-diffusion/ 目录（准备好
    token 与下载链接占位符）；
  - 6. 启动 WebUI，注入参数：--share --gradio-auth user:pass --deepdanbooru --xformers；
  - 7. 运行完毕后，如何获取公网访问链接？链接有效期多久？国内直连是否稳定？
- 'no': 2
  title: Prompt 咒语对比实验：同一模型、同一 Seed、不同 Tag 组合
  contents:
  - 固定模型为 ChilloutMix、Seed 为 123456789、采样参数为 DPM++ 2M Karras / 20 Steps / CFG 7 /
    512x512，分别生成三张图并对比差异：
  - A. 仅输入 “beautiful girl, sea beach” （极简自然语言）
  - B. 使用素材提供的完整正向咒语 + 完整负向咒语
  - C. 在 B 基础上把正向咒语中的 {(sea beach)} 替换为 {(cyberpunk city)}，把负向咒语中的 (bad hands:1.1)
    权重改为 0.5
  - 观察并记录：画质细节、构图稳定性、手部/肢体结构、风格偏移程度。思考：为什么极简自然语言在 ChilloutMix 上效果较差？负向权重降低后出现了什么伪影？
- 'no': 3
  title: 模型即画风：跨 Checkpoint 复现对比
  contents:
  - 使用素材中的“海边少女”完整正/负向咒语，固定 Seed = 987654321、采样参数同练习 2，依次加载以下三个 Checkpoint 生成图片：
  - 1. NovelAI / WAIFU Diffusion（动漫系）
  - 2. Stable Diffusion v1.5 原版（通用写实系）
  - 3. ChilloutMix / Realistic Vision（亚洲写实系）
  - 对比三张图的：线条风格（赛璐珞 vs 笔触 vs 皮肤纹理）、色彩饱和度、光影物理真实感、标签响应度（如 chiaroscuro、floating petal
    是否生效）。
  - 回答：若想在写实模型上获得“动漫厚涂感”，除了换模型，还能尝试什么轻量化手段？（提示：LoRA）
- 'no': 4
  title: 免费额度压力测试与存储方案选型
  contents:
  - 场景：你计划在周末连续两天，每天跑 6 小时批量出图（含 Hires.Fix），单张出图约 30 秒，模型库共 8 个 Checkpoint（总 40GB）+
    20 个 LoRA（总 5GB），输出图片预计 5000 张（~15GB）。
  - 问题：
  - 1. 单个 Google 账号免费额度是否足够？若不够，需准备几个账号轮换？
  - 2. 8 个 Checkpoint 无法全放入 15GB Gdrive，设计一个“热模型在 Gdrive、冷模型在 HF 私有仓库、输出图定期打包传 Telegram
    Bot”的三层存储分层方案，画出数据流向示意图（文字描述即可）。
  - 3. 若改用 RunPod 租用 A100 (24GB VRAM, $0.34/小时)，完成相同工作量成本约多少？与免费方案的时间成本（搭建、换号、防封、下载等待）如何权衡？
