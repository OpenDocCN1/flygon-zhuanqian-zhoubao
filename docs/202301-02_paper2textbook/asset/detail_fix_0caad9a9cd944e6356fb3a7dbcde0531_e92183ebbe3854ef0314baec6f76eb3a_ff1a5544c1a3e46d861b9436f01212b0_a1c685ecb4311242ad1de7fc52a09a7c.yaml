learning_targets:
- 理解盲目自信与理性自我怀疑在创业中的对立作用
- 掌握自我一与自我二的内在比赛理论及其对成败的影响
- 学会运用唤醒成功体验法建立潜意识自信
- 能够识别三到六个月确定性窗口期并据此制定行动策略
- 掌握俯视学习法的战略与战术双重姿态
- 理解流量价值公式及其对私域运营的指导意义
- 识别被增长预期绑架的怪圈，运用价值创造视角破解增长焦虑
- 掌握财富积累四阶段与人生四阶段的对应关系
- 学会利用杠杆效应（劳动力、自媒体、零边际成本产品）放大收入
- 理解商业英雄是时代红利与个人执行力的共同产物
- 掌握用逆向思考法从变现反推定位、产品、内容与流量
- 学会用剥离式拆解法确定团队精力投入方向
- 掌握MVP最小成本验证法，学会先卖想法再建产品
- 理解买卖、生意、商业三个层级的递进关系并据此规划路径
- 学会用OKR与量化目标驱动团队，从战略垂直到执行落地
- 掌握用'做局套话'思维获取信息差红利的方法
concept_map:
- 内在比赛理论
- ├── 自我一（理性）
- │   ├── 负责分析、评价
- │   └── 过度干预导致发挥失常
- ├── 自我二（感性/潜意识）
- │   ├── 驱动行为与本能
- │   ├── 决定内在比赛的输赢
- │   └── 不认可目标则外在比赛必输
- └── 内在比赛 vs 外在比赛
- '    ├── 内在比赛先于外在比赛'
- '    └── 典型案例：李宗伟、老虎伍兹'
- 创业者心态心法
- ├── 盲目自信（舍我其谁）
- │   ├── 定义：'在我的领域我就是国王'
- │   ├── 性质：赢下内在比赛的前提
- │   └── 边界：适用于长期项目，非精确投资
- ├── 成功是成功之母
- │   ├── 反常识主张：失败不是成功之母
- │   ├── 成功体验累积潜意识自信
- │   └── 配套方法：唤醒成功体验法
- └── 俯视学习法
- '    ├── 战略藐视：保持国王姿态'
- '    ├── 战术重视：细节上认真请教'
- '    └── 本质：向他人学习而不丢失自信'
- 市场时机判断
- ├── 三到六个月确定性窗口期
- │   ├── 定义：疫情平稳期为确定的稳定期
- │   ├── 依据：香港数据类比推演
- │   └── 结论：先干个春天再说
- └── 行业切入机会
- '    ├── 旅游：分销与套利'
- '    ├── 健康：保健养生带货'
- '    └── 餐饮：紧扣春季需求'
- 商业底层认知
- ├── 流量价值公式：规模×相关性×信任度
- │   ├── 规模只解决连接问题
- │   ├── 相关性与信任度决定转化
- │   └── 不能变现的流量只是数据
- ├── 增长瓶颈怪圈
- │   ├── 被想拥有的东西绑架
- │   ├── 越追求增长越远离增长
- │   └── 破解：从追求增长切换到价值创造视角
- ├── 财富积累四阶段
- │   ├── 出卖劳动力（打工）
- │   ├── 一份时间多次卖（写书/卖课）
- │   ├── 购买他人时间（当老板）
- │   └── 钱生钱（投资）
- └── 杠杆效应
- '    ├── 劳动力杠杆'
- '    ├── 自媒体杠杆'
- '    └── 零边际成本产品（代码/内容）'
- 时代红利与个人能力
- ├── 时代红利是收入主体
- │   ├── 每一百块钱有九十块是时代红利
- │   └── 识别红利窗口比提升能力更紧迫
- ├── 商业英雄是平台与市场红利的产物
- │   └── 个人能力只是执行力的加持
- └── 逆向思考法
- '    ├── 正常流程：定位→内容→流量→产品→变现'
- '    ├── 逆向流程：变现→定位→产品→内容→流量'
- '    └── 本质：先找买家，再找产品'
- 团队精力管理
- ├── 剥离式拆解问题法
- │   ├── 提炼客户最需要解决的10个大问题
- │   ├── 每个拆解为10个小问题
- │   └── 团队最该花时间的就是这100个小问题
- └── 目标聚焦
- '    └── 用结构化问题替代盲目忙碌'
- 项目验证与放大
- ├── MVP最小成本验证
- │   ├── 先卖想法而非做产品
- │   ├── 高意向付费人数判断需求（20-30人购买则成立）
- │   └── 可短时间测试几十个产品
- ├── 买卖、生意、商业三分论
- │   ├── 买卖：自己出卖劳动力
- │   ├── 生意：通过代理商多次卖出
- │   └── 商业：建立可复制放大的模式
- └── OKR与量化目标
- '    ├── KR必须直接推动O、O要有可衡量标准'
- '    ├── 用MVP验证最不确定因素'
- '    └── 过程管理有了量化目标，团队效率提升50%'
- 信息差与做局
- ├── 做局套话思维
- │   ├── 以'已解决'口吻写软文吸引同行
- │   ├── 反问套取真实解决方案
- │   └── 卖给未解决的精准客户盈利
- └── 信息差是生意的本质
- '    ├── 渠道存在信息差，A平台烂内容B平台爆火'
- '    └── 先有闷声发大财，网上流传的已过时'
life_analogy:
- 想象创业是一场**网球比赛**：
- '- **自我一** = 脑海中不断评价''这球打不好''的解说员'
- '- **自我二** = 身体本能挥拍、跑动的运动员'
- '- **内在比赛** = 解说员的评价是否影响运动员的自信'
- '- **外在比赛** = 实际比分'
- 就像解说员越是喋喋不休，运动员越容易失误；创业中理性的自我怀疑越多，行动力越差。
- 想象学习他人经验是**皇帝批阅奏折**：
- '- **战略（俯视）** = 皇帝保持''朕才是这个领域的国王''的信念'
- '- **战术（重视）** = 仔细阅读每份奏折中的亮点'
- '- **跪着学** = 把奏折当圣旨，丧失自我判断'
- 就像皇帝从奏折中汲取智慧但不放弃决策权，创业者应学习他人经验但不丢失'舍我其谁'的信念。
- 想象市场窗口期是**春天的播种季**：
- '- **确定性窗口** = 土壤解冻、气温回暖的明确时段'
- '- **太早播种** = 种子被冻死'
- '- **太晚播种** = 错过生长季'
- 就像农民必须在确定的春天窗口抢种，创业者必须在确定性窗口期全力行动。
- 想象流量是**一桌宴席**：
- '- **流量规模** = 餐桌上有多少人'
- '- **交易相关性** = 这些人是不是真的想吃你做的菜'
- '- **信任度** = 他们是否相信你的菜干净好吃'
- 就像宴席上人多不一定卖得好，只有'对的客人'加上'信任'才会真正下单——流量规模只解决'来多少人'，相关性和信任度才解决'多少人买'。
- 想象追求增长是**在流沙中挣扎**：
- '- **越用力抓取** = 越快速下陷'
- '- **被增长的预期绑架** = 恐慌地挥舞手脚'
- '- **停下来思考价值创造** = 平躺身体增大接触面积'
- 就像陷入流沙时越挣扎越危险，只有转身面向价值创造才能停下来——与其拼命'抓增长'，不如先成为一个'值得被奖赏增长的人'。
- 想象财富积累是**爬楼梯**：
- '- **出卖劳动力** = 第一个台阶，用双手双脚爬'
- '- **一份时间多次卖** = 第二个台阶，坐上电梯（写书/做课）'
- '- **购买他人时间** = 第三个台阶，让别人替你搬砖'
- '- **钱生钱** = 顶层，让钱自己升上去'
- 就像爬楼梯不能跳级，财富积累的四个阶段不可跳跃——每个阶段都为下一阶段积累资本与认知。
- 想象做项目是**剥洋葱**：
- '- **10个大问题** = 洋葱的外层皮'
- '- **每个大问题拆出10个小问题** = 一层层剥开'
- '- **100个小问题** = 洋葱的核心——真正需要投入精力的地方'
- 就像剥洋葱最核心的部分才是最有价值的，团队最该花时间的地方就是那100个小问题——剥离表象，直达本质。
- 想象验证创业想法是**餐厅试菜**：
- '- **MVP先卖后做** = 只拿出小样让顾客试吃、预订'
- '- **高意向付费人数** = 有多少人愿意为这道菜付定金'
- '- **20-30人购买** = 这道菜值得正式上菜单'
- 就像高级餐厅先以小份试菜验证口味再决定量产，创业也应先卖想法、用小成本验证需求，而不该一上来就投入全部资源做大餐。
- 想象买卖、生意、商业三层是**卖柠檬水**：
- '- **买卖** = 自己亲手榨汁、亲手摆摊卖'
- '- **生意** = 教会几个小贩你的配方，让他们摆摊替你卖'
- '- **商业** = 建立一套可复制的连锁加盟体系'
- 就像卖柠檬水，自己榨汁赚的是辛苦钱，建立可复制的连锁才能获得规模化收益——做事前先想清楚自己处在哪个层级，想往哪个层级跃迁。
- 想象信息差生意是**在不同海域捕鱼**：
- '- **A平台（抖音）** = 已被过度捕捞的海域'
- '- **B平台（小红书）** = 鱼群密集但少人下网的海域'
- '- **搬运优化** = 把旧渔网换个织法，适应新海域的鱼群习性'
- 就像有经验的渔民会根据海域情况调整渔具，副业经营者也应利用不同平台间的信息差，把已有的内容适配到新的平台赚取红利。
summary:
- concept: 自我一与自我二
  desc: 内心的两个'我'：理性分析者与感性行动者，潜意识不认可目标则外在必输
- concept: 内在比赛
  desc: 潜意识是否认可目标的比赛，先于外在比赛并决定其成败
- concept: 盲目自信
  desc: 创业者需要的'舍我其谁'心态，是打赢内在比赛、获得外在成功的前提
- concept: 成功是成功之母
  desc: 反常识主张：过去的成功体验在潜意识累积自信，推动后续更大成功
- concept: 唤醒成功体验法
  desc: 通过回顾过往成功经历或先做易成功的事，制造成功体验以建立潜意识自信
- concept: 俯视学习法
  desc: 战略上保持国王般的俯视姿态，战术上保持学生的认真态度，向他人学习而不丢失自信
- concept: 三到六个月确定性窗口期
  desc: 基于历史数据推演的明确机会窗口，必须在期限内采取行动
- concept: 行业切入机会
  desc: 旅游（分销套利）、健康（保健带货）、餐饮（紧扣需求）是窗口期最快的切入方向
- concept: 流量价值公式
  desc: 流量价值=规模×交易相关性×信任度，规模只解决连接，相关性和信任度决定转化
- concept: 增长瓶颈怪圈
  desc: 被增长预期绑架时会越追求增长越远离增长，破解之道是从追求增长切换到价值创造视角
- concept: 价值创造视角
  desc: 从'我如何得到增长'变为'我如何成为一个值得被奖赏增长的人'，需要三种勇气
- concept: 财富积累四阶段
  desc: 出卖劳动力→一份时间多次卖→购买他人时间→钱生钱，不可跳跃，需依次跃迁
- concept: 杠杆效应
  desc: 依靠出租时间很难致富，应充分利用劳动力、自媒体和复制边际成本为零的产品作为杠杆
- concept: 时代红利
  desc: 普通人赚取的绝大部分收入来自时代红利，仅有少部分是对个人能力的补偿
- concept: 逆向思考法
  desc: 以结果为导向逆向拆解步骤：变现→定位→产品→内容→流量，先找买家再找产品
- concept: 剥离式拆解问题法
  desc: 将客户最需要的10个大问题每个拆成10个小问题，团队最该花时间的地方就是这100个小问题
- concept: MVP最小成本验证
  desc: 先卖想法而非做产品，通过高意向付费人数（20-30人购买）判断需求是否成立
- concept: 买卖、生意、商业
  desc: 自我出卖劳动力是买卖，通过代理商多次卖出是生意，建立可复制放大的模式才是商业
- concept: OKR与量化目标
  desc: KR必须直接推动O且O可衡量，用MVP验证不确定因素，量化目标让团队效率提升50%
- concept: 做局套话思维
  desc: 以'已解决'口吻吸引同行，反问套取真实方案，再卖给未解决的精准客户盈利
exercises:
- 'no': 1
  title: 识别你内心的'解说员'
  contents:
  - 回忆你最近一次放弃或拖延的目标（如开始副业、健身计划、学习新技能）。
  - 写下当时脑海中出现的自我否定或怀疑的声音（例如：'这太难了''我不擅长这个''万一失败怎么办'）。
  - 对照自我一与自我二理论，分析这些声音来自哪个'自我'，它们如何影响了你的实际行动。
  - 回答问题：
  - '- 如果你的自我二（潜意识）真正认可这个目标，你的行为会有什么不同？'
  - '- 你能用哪些方法来让自我二认可这个目标？'
- 'no': 2
  title: 设计你的'成功唤醒'仪式
  contents:
  - 列出你过去取得的三次成功经历（无论大小，如考试通过、完成项目、赢得比赛）。
  - 针对每个经历，写出它给你带来的具体能力和信心（例如：'我学会了坚持''我证明了我能搞定客户'）。
  - 设计一个可操作的'唤醒仪式'：在下次面临挑战前，你如何主动回顾这些成功体验？
  - 参照优秀推销员的例子（先推销容易卖的产品制造成功体验），设计一个'先赢小局'的具体行动。
  - 回答：
  - '- 这个仪式如何帮助你赢得''内在比赛''？'
  - '- 你如何避免''制造成功''演变为''回避挑战''？'
- 'no': 3
  title: 用'俯视学习法'复盘一次学习经历
  contents:
  - 回顾你最近一次向他人学习的过程（如阅读干货文章、参加培训、请教前辈）。
  - 分析你当时的学习姿态：是'仰视'（觉得对方很厉害、自己很弱）还是'俯视'（保持自信地汲取经验）？
  - 用'战略藐视、战术重视'的框架，重新设计这次学习的姿态：
  - '- 战略层面：你如何保持''在我的领域我是国王''的信念？'
  - '- 战术层面：你如何认真提取可用的具体方法？'
  - 回答问题：
  - '- 仰视学习可能带来哪些''内在比赛''的失败？'
  - '- 俯视学习法在哪些场景下不适用？'
- 'no': 4
  title: 寻找你的'三到六个月窗口期'
  contents:
  - 选择一个你当前想推进的项目或目标（如副业、职业转型、新技能学习）。
  - 收集与该目标相关的历史数据或行业趋势（类似素材中香港疫情数据类比大陆），回答：
  - '- 是否存在可类比的历史先例？'
  - '- 当前是否有''确定性窗口''的信号？'
  - '- 这个窗口期预计持续多久？'
  - 基于你的分析，制定一个针对窗口期的行动规划：
  - '- 未来3个月内要完成的关键里程碑；'
  - '- 你计划切入的具体行业或方向（类似旅游、健康、餐饮的切入点）。'
  - 回答：
  - '- 窗口期判断的局限性和风险是什么？'
  - '- 如果窗口期预测错误，你的止损计划是什么？'
- 'no': 5
  title: 将'盲目自信'转化为行动计划
  contents:
  - 选一个你因自我怀疑而迟迟未启动的项目。
  - 写下你的'舍我其谁'宣言：为什么'在我的领域我是国王'？列出你的优势、资源、过往积累。
  - 根据'成功是成功之母'原则，拆解该项目的第一个小目标（确保可达成）：
  - '- 这周内能完成的第一个''成功体验''是什么？'
  - '- 如何用这个成功体验推动下一步？'
  - 回答：
  - '- 盲目自信的边界在哪里？你如何区分''自信''与''盲目自大''？'
  - '- 当遇到真正的失败时，你如何用''成功是成功之母''的心态重新站起来？'
- 'no': 6
  title: 用'流量价值公式'诊断你的私域池
  contents:
  - 选择一个你正在运营或计划运营的流量池（如微信号好友、公众号粉丝、小红书粉丝）。
  - 用流量价值公式（规模×相关性×信任度）对当前状态打分（1-10分）：
  - '- 流量规模：目前有多少人？目标是多少？'
  - '- 交易相关性：这些人是否对你的产品/服务有真实需求？'
  - '- 信任度：你与他们的关系是''泛泛之交''还是''彼此了解''？'
  - 基于打分结果回答：
  - '- 你最应该优化的维度是哪一个？为什么？'
  - '- 素材中''4万好友转化20人 vs 3万好友转化80人''的案例对你有什么启示？'
  - '- 你计划用哪些具体动作提升弱项维度？'
- 'no': 7
  title: 识别你的'增长怪圈'与破解路径
  contents:
  - 回忆你或你所在团队最近一次'越努力越焦虑'的经历（如狂发内容但涨粉停滞、加班但业绩下滑）。
  - 对照'被想拥有的东西绑架'的特征，分析：
  - '- 你是否在用投机的方式跟随对手而非做开创性事情？'
  - '- 你是否在天天计算利弊得失而非关注用户？'
  - '- 你是否在抓取资源而非积累价值？'
  - 用'价值创造视角'重新设计行为：
  - '- 从''我如何得到增长''变为''我如何成为一个值得被奖赏增长的人''。'
  - '- 三个勇气的具体行动是什么（面向未来/面向用户/积累价值）？'
  - 回答：
  - '- 什么是最稀缺、最不流动的资产？你打算如何优先积累它？'
- 'no': 8
  title: 用'逆向思考法'梳理一个赛道
  contents:
  - 选定一个你感兴趣的副业或创业赛道。
  - 用正常流程（定位→内容→流量→产品→变现）记录你原本的规划。
  - 改用逆向流程（变现→定位→产品→内容→流量）重新推演：
  - '- 变现：这个赛道有哪些已验证的变现方式？客单价和毛利如何？'
  - '- 定位：基于变现倒推，你的差异化人群定位应该是什么？'
  - '- 产品：目标用户愿意为什么样的产品付费？'
  - '- 内容：什么内容能吸引这些精准用户？'
  - '- 流量：他们聚集在哪些平台？如何触达？'
  - 回答：
  - '- 两条路径的差异在哪里？逆向思考法带来了哪些新的洞察？'
  - '- ''先找买家，再找产品''如何帮助你避免自嗨？'
- 'no': 9
  title: 设计一个'先卖后做'的最小验证方案
  contents:
  - 选择一个你正在酝酿的产品或服务想法。
  - 设计一个'卖空气'的验证方案：不投入开发，而是先向潜在用户展示概念、模型或预售页。
  - 回答：
  - '- 你需要找到多少个高意向付费用户，才能判断需求成立？'
  - '- 你能列出哪些具体的渠道来触达这些潜在用户？'
  - '- 如果20-30人愿意购买并预付定金，你的下一步计划是什么？'
  - '- 如果验证失败，你的止损线设在哪里？'
- 'no': 10
  title: 为你的项目建立'量化目标'与OKR
  contents:
  - 选定你在练习4中准备的窗口期项目，或任意一个正在推进的副业项目。
  - 为该项目的未来一个季度制定一套完整的OKR：
  - '- 目标（O）：要达成什么可衡量的结果？'
  - '- 关键结果（KR）：如何量化目标的进展？每个KR如何直接推动O的实现？'
  - '- 时间节点：每个KR的完成期限是什么？'
  - 思考：你计划用哪个最不确定的因素来设计MVP验证？
  - '- 你打算如何用最小成本验证这个最不确定的因素？'
  - '- 你计划与哪些关键角色保持高频同步？多久同步一次？'
units:
- 'no': 1
  name: 盲目自信 —— 创业者的理性选择
  points:
  - '**为什么需要这个概念？**'
  - '- 创业路上充满艰难险阻，理性的自我怀疑会让人畏首畏尾，无法迈出关键的第一步'
  - '- 潜意识（自我二）不认可目标时，人会输掉“内在比赛”，进而输掉“外在比赛”'
  - '- 传统“理性分析风险”的思维无法解决创业者心理能量不足的问题'
  - '**核心定义**'
  - '- 创业者需要的是近乎盲目的自信与乐观，即‘在我的领域我就是国王’的潜意识信念'
  - '- 这种心态不是盲目自大，而是打赢内在比赛、获得外在成功的前提'
  - '**关键性质**'
  - '- 自我一（理性）负责分析，自我二（感性/潜意识）决定行动力'
  - '- 内在比赛（潜意识认可目标）先于外在比赛（实际成果）'
  - '- 自信可以通过“唤醒成功体验”来刻意培养'
  - '**典型例子**'
  - '- 李宗伟技术不输林丹，但多次决赛失利，根源是潜意识认为自己赢不了'
  - '- 老虎伍兹性丑闻后失去“不可战胜”的信念，技术未变但状态急剧下滑'
  - '**边界条件**'
  - '- 盲目自信适用于需要长期坚持的创业/项目，不适用于需要精确计算的投资决策'
  - '- 自信需与“战术上重视”结合，俯视学习但细节上认真请教'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 一言以蔽之：你需要盲目的自信。因为盲目的自信和乐观，是创业者的理性选择。
  - 这样'舍我其谁''在我的领域，我就是国王'的心态，才是创业者真正需要的心态！
  - 常言道，永远不要低估一个高估自己的人。
  - 创业途中充满了艰难险阻，而盲目的自信和乐观，是创业者的理性选择。
- 'no': 2
  name: 自我一与自我二 —— 内心的两个“我”如何决定成败
  points:
  - '**为什么需要这个概念？**'
  - '- 仅靠理性分析无法解释为什么有些人条件优异却屡屡失败，有些人条件平平却能成功'
  - '- 需要理解潜意识和情绪在长期目标达成中的决定性作用'
  - '- 为“盲目自信”提供心理学理论支撑，让抽象心态有可操作的理论框架'
  - '**核心定义**'
  - '- 人有两个自我：自我一对应理性/一般自我，负责分析、评价；自我二对应感性/潜意识，负责行动、本能'
  - '- 内在比赛：潜意识（自我二）是否真正认可目标，决定外在比赛的输赢'
  - '**关键性质**'
  - '- 自我二是本能和潜意识的载体，直接驱动行为，不听从理性指令'
  - '- 当自我二不认可目标时，人会“心口不一”，行为上偏离目标'
  - '- 内在比赛被忽视时，往往成为成败的真正决定因素'
  - '**典型例子**'
  - '- 打网球时，自我一不断评价“这球打不好”，自我二反而发挥失常——源自《身心合一的奇迹力量》'
  - '- 李宗伟每次决赛对林丹，他的自我二不认为能赢，再好的技术也发挥不出来'
  - '**边界条件**'
  - '- 该理论适用于长期、复杂、需要内在驱动力的目标（创业、竞技体育）'
  - '- 不适用于纯机械性、短周期任务——那种场景理性分析更重要'
  - '- 自我一和自我二需要协调，不能只靠自我二蛮干'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 人，有两个自我，分别是自我一、自我二。自我一，对应着理性，是一般意义上的自我。自我二，对应着感性，或者说对应着潜意识。
  - 任何一个比赛，实际上是同时进行的两场比赛，内在比赛和外在比赛。
  - 人们往往容易忽略的是，如果自我二（也就是潜意识），并不认可这个目标的时候，会输掉内在比赛。一旦输掉内部比赛，外在比赛也会输。
- 'no': 3
  name: 三到六个月确定性窗口期 —— 抓住“确定的春天”
  points:
  - '**为什么需要这个概念？**'
  - '- 商业机会往往伴随不确定性，普通人难以判断何时该全力投入'
  - '- 需要一个基于数据的、可推理的时机判断工具，避免盲目行动或错失良机'
  - '- 传统“等市场完全明朗再投入”会错过红利期，太早投入又容易成为炮灰'
  - '**核心定义**'
  - '- 参照香港疫情数据，大陆在首轮大规模感染后会有 2~3 个月的疫情平稳期，之后才进入第二波感染峰值'
  - '- 因此 2023 年春天是相对确定的稳定期，是生意人与投资者看重的窗口期'
  - '**关键性质**'
  - '- 以类比历史数据为基础，具有可推理性'
  - '- 窗口期意味着“确定但有限”，必须在期限内采取行动'
  - '- 行业恢复存在先后，旅游、健康、餐饮是切入最快的三个方向'
  - '**典型例子**'
  - '- 春节国内旅游人次恢复到 2019 年同期的 88.6%，出境机票上涨 258%'
  - '- 诺特兰德维生素片连续两个月为抖音直播单品销量第一'
  - '**边界条件**'
  - '- 该判断基于特定历史时期（疫情周期），不适用于无疫情背景的常规商业决策'
  - '- 窗口期预测有时间局限，3-6个月后需重新评估'
  - '- 切入时机确定后仍需个体结合自身资源选择具体玩法'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 最近 3~6 个月，是比较确定的疫情平稳期，之后才会迎来第二波疫情的峰值。
  - 香港跟大陆一样，也是第一次大规模疫情感染，就把八九成的居民给感染了。之后香港就进入了 2~3 个月的平静期，平静期之后就进入第二波疫情感染。
  - 至少 2023 年的春天，会是一个比较确定的稳定期。
  - 这个春天，可能是今年最重要的 3 个月窗口期。
- 'no': 4
  name: 成功是成功之母 —— 用体验唤醒潜意识
  points:
  - '**为什么需要这个概念？**'
  - '- 传统教育强调“失败是成功之母”，但这会让创业者陷入自我怀疑的循环'
  - '- 潜意识自信的建立需要具象的体验支撑，而非抽象的说教'
  - '- 需要一种可操作的方法来激发长期坚持所需的心理能量'
  - '**核心定义**'
  - '- 与其相信“失败是成功之母”，不如相信“成功才是成功之母”'
  - '- 过去的成功体验会在潜意识中累积自信，推动后续更大成功'
  - '**关键性质**'
  - '- 成功体验可以刻意“唤醒”和“制造”'
  - '- 一个成功体验推动一个又一个成功体验，形成正向循环'
  - '- 与“唤醒成功体验法”配套使用：先做容易成功的事制造体验，再挑战大目标'
  - '**典型例子**'
  - '- 优秀推销员一天工作开始前，先找优质客户或推销容易卖的产品，制造成功体验，再推进难度大的客户'
  - '- 作者本人通过回顾成功经历，在创业低谷期重新建立自信'
  - '**边界条件**'
  - '- “制造成功”不等于回避挑战，而是用小的成功为大的挑战蓄能'
  - '- 该方法适用于需要长期意志力的领域，不适用于单次精确决策'
  - '- 不能替代真正的能力建设，体验只是催化剂，能力才是发动机'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 失败不是成功之母，成功才是成功之母。
  - 我一个成功体验，推动一个又一个的成功体验。成功，才是成功之母。
  - 当自己内心很怂、不自信的时候，你需要回顾下自己成功的经历，唤醒自己的成功体验。
  - 你也一定有成功体验，在做新的事情之前，好好回顾回顾，从潜意识里唤醒它，它会帮助你走得更远。
- 'no': 5
  name: 俯视学习法 —— 战略藐视，战术重视
  points:
  - '**为什么需要这个概念？**'
  - '- 向他人学习时，容易陷入“跪着学”的仰视姿态，导致潜意识自卑，削弱内在比赛'
  - '- 需要一种既能汲取他人智慧又不丢失自我信心的学习方法'
  - '- 解决“学得好”与“信自己”之间的矛盾'
  - '**核心定义**'
  - '- 在战略（潜意识）层面保持国王般的俯视姿态：我是我领域的国王，他人的经验只是“奏折”'
  - '- 在战术（具体请教与落实）层面保持学生的认真态度：细节上认真对待'
  - '**关键性质**'
  - '- 战略藐视为潜意识注入王者心态，赢得内在比赛'
  - '- 战术重视确保具体能力的提升，避免盲目自大'
  - '- 二者结合形成“俯视但不轻视，学习但不盲从”的平衡'
  - '**典型例子**'
  - '- 作者对待生财有术社群的态度：把帖子当奏折来看，提取亮点但保持“朕才是国王”的信念'
  - '- 毛主席“战略上藐视敌人，战术上重视敌人”的军事思想迁移到个人学习'
  - '**边界条件**'
  - '- 适用于向同行、前辈、社群学习时的心理建设'
  - '- 不能演变为傲慢——俯视的是“我的领域”，在学习他人领域知识时应保持谦逊'
  - '- 需要先有扎实的领域积累，否则“国王心态”会变成“纸上谈兵”'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 我的答案是：别跪着学！要俯视！你就是国王，把生财有术的帖子，当成奏折来看。
  - 毛主席说，战略上藐视敌人，战术上重视敌人。跪着学生财有术的人，打不赢内在比赛。
  - 但是在战略上，来自于你的潜意识，你内心相信的应该是'老头儿，刚才你的奏折有一些亮点，朕心甚悦。可是，朕才是这个领域的国王。'
- 'no': 6
  name: 流量价值公式 —— 规模、相关性与信任度的乘积效应
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人面对高阅读量、高赞藏的内容会感到困惑或焦虑，只看到表层的流量规模'
  - '- 但流量规模只解决连接的问题，不解决交易的问题——需要一套框架来衡量流量的真实价值'
  - '- 在私域运营中,''好友多但转化差''是普遍困境，需要用公式发现真正待优化的变量'
  - '**核心定义**'
  - '- 流量价值 = 流量规模 × 交易相关性 × 信任度'
  - '- 流量规模：触达的人数/连接数；交易相关性：流量与产品的匹配程度；信任度：用户对运营者的信任水平'
  - '**关键性质**'
  - '- 三个因素是乘积关系，任一为零则整体为零'
  - '- 流量规模只解决连接问题，相关性和信任度才决定交易转化'
  - '- 有信任度、有粘性的好友远胜过泛泛之交——好友质量重于数量'
  - '**典型例子**'
  - '- 作者在418推广生财有术：个人3万好友转化80人，公司4万好友仅转化20人，好友质量是数量的4倍'
  - '- 朋友800好友月成交超20万，另一朋友3万好友月成交仅5万——好友数差近40倍，成交额却不足四分之一'
  - '**边界条件**'
  - '- 该公式是认知评估工具，不适用于精确财务测算'
  - '- 不同阶段应侧重不同维度：起盘期重规模，成长期重相关性与信任度'
  - '- 信任度的建立需要时间与持续价值输出,不可急于求成'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/VAA8dQLTZolMlJx1jxrcKaPrnzd.md
    role: improve
  excerpts:
  - 流量价值=流量规模×交易相关性×信任度
  - 有时候我们面对一篇阅读量很高的文章、一篇赞藏很高的小红书笔记、一个很火的抖音视频，会感到困惑或焦虑。因为我们只看到了表层的流量规模，有些慌张，但流量规模只解决连接的问题，不解决交易的问题。比流量规模更重要的是流量相关性…信任度怎么看？有的连接带来的价值有限，这和连接给UV带来的感受有关…不轻易连接，但连接必有价值。
  - 有信任度、有粘性的好友，远胜过泛泛之交。
  - 在418推广生财有术时，我公司共有微信好友4万人，我的微信好友有3万人，基本都是私域增长从业者相关，但是我的微信可以转化80人，我公司的资源却只能转化20人，数量上我公司的资源其实更多，但是成交上我的好友却是公司资源的4倍！
- 'no': 7
  name: 增长瓶颈怪圈 —— 被想拥有的东西绑架
  points:
  - '**为什么需要这个概念？**'
  - '- 很多企业或个人陷入''越努力越焦虑''的增长困境，甚至越追求增长反而距离增长越远'
  - '- 传统''更狼性、更拼搏''的自我压榨反而让问题加剧'
  - '- 需要识别增长瓶颈的典型现象及其深层原因，才能找到破解之道'
  - '**核心定义**'
  - '- 进入增长瓶颈的典型现象：越想要增长，却距离想要的增长越远'
  - '- ''被想拥有的东西绑架''：当人被增长预期绑架，会变得投机跟随、计算利弊、抓取资源'
  - '**关键性质**'
  - '- 恶性循环：被预期绑架→投机行为→进一步失去优势→更加焦虑→更加压制自己'
  - '- 大部分企业的增长问题在疫情之前就已发生，疫情只是加重而非本质原因'
  - '- 大部分企业在大部分时候并不增长，这是常态而非异常'
  - '**典型例子**'
  - '- 被增长预期绑架后：投机一样跟随对手而非做开创性事情；天天计算利弊得失而非关注用户；抓取资源、流量而非积累价值——这些都让他距离增长越来越远'
