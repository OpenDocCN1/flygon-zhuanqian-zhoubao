paper: docs/202301-02/20230207_11.md
desc: 该素材是一份由'小懒'整理的《龙哥赚钱周报》，汇编了2022年11月15日前后生财有术社群内的多篇精华帖与风向标帖子。内容覆盖生财认知与技能（如超垂直个人知识IP获取精准客户策略、如何获得产品Idea的五种方法）、国内平台项目（抖音、腾讯系、小红书等，如抖音情感中视频项目、小红书引流选款、美团电商红利）、海外项目（如Telegram自动引流工具、TEMU爆款打造、YouTube运营）以及实体/其他项目（如黄焖鸡米饭招商加盟、喜茶加盟分析等）。素材本质是大量实操案例、复盘和风向标的集合，为读者提供了不同平台和领域的项目玩法、流量获取、变现策略的方法论与经验总结。
concepts:
- name: 超垂直个人知识IP
  desc: 指在极度细分领域深耕、坚持长期主义的个人知识品牌，其核心策略是以SEO思维获取精准搜索流量而非追逐平台爆款。
  is_original: false
  excerpt:
  - 如果你选的是超垂直的细分领域，你如果坚持的是长期主义变现，那么还有一种流量比迎合平台推荐更有价值：那就是精准搜索的流量
  - 长期主义者，大部分都用SEO思维在做流量，而追风者往往是用爆款思维组流量
- name: 原生idea (organic idea)
  desc: 硅谷创业界推崇的产品构思方式，指通过'注意到'并解决自己遇到的问题来获得产品创意，创业者自身即是产品的核心用户。
  is_original: false
  excerpt:
  - 构思产品idea的动词，应该是'注意到'，而不是'想到'。'我注意到，有这么一个问题，可以这么来解决' 而不是 '我想到了一个创业idea'。
  - The most important thing is to find ideas from solving your own problems
- name: 流量思维：SEO思维 vs 爆款思维
  desc: 区分两种获取流量的底层逻辑：SEO思维侧重长期、精准搜索流量的积累，适合长期主义者；爆款思维侧重追逐热点与平台推荐，见效快但难持续。
  is_original: false
  excerpt:
  - 长期主义者，大部分都用SEO思维在做流量，而追风者往往是用爆款思维组流量，彻底理解这一点，起码受益 10 年
- name: 需求欲引流 vs 影响力引流
  desc: 两种引流方式的对比：需求欲引流是闪电战，门槛低、时间短、靠送资料等快速变现；影响力引流是持久战，门槛高、周期长、需长期建立个人品牌。
  is_original: false
  excerpt:
  - 我们经常用的，通过送资料、优惠价引流到私域的这种方法，就是用的需求欲引流，它的特点是门槛低，时间短，核心竞争力在于速度要快
  - 而影响力引流怎么理解呢？...它的特点是门槛高，时间长，核心竞争力在于长期持久，而广告变现，就是在支持这样一个大V的诞生。
- name: 爆款引流库
  desc: 基于'100-10-1聚焦法'建立的数据化选款体系，通过筛选、测试、优化建立专属的爆款商品库，避免想当然地凭感觉选款。
  is_original: false
  excerpt:
  - 与其漫无目的瞎猜一些款，并充满期待的等这些款有产出。还不如老老实实的自己先找出100款来，每一款发上3-5条笔记...基本就能选出10个左右能出单的款...这种款就是最终我们要找的爆款了。
- name: 招商加盟的四种级别
  desc: 按照品牌方操作难度划分的加盟模式分类体系，包括轻量级（卖技术、卖料包）、中量级（卖设备、卖服务）、重量级（卖品牌）和魔鬼级（卖特许权）。
  is_original: true
  excerpt:
  - 按照品牌方操作的难度，加盟模式一共分为四个级别六种类型：轻量级、中量级、重量级和魔鬼级。
  - 魔鬼级的加盟是最难实现的一种，我称之为卖特许权。说白了，就是加盟了某个品牌之后，这个品牌的特许权是可以作为资产进行转移和继承的。
- name: 平台电商发展的四个周期
  desc: 作者基于淘系经验总结的电商平台演进规律，认为各平台都会经历铺货、动销、精细化、玩趋势四个阶段，可用来预判新平台（如美团、TEMU）的机会。
  is_original: true
  excerpt:
  - 从平台电商的历史出发，我把美团的发展分为了四个周期：铺货、动销、精细化、玩趋势。
  - 所有平台演变的底层逻辑是相通的，刚过去的视频号...与抖音的历史进程何其相似。美团电商与淘系的发展也将大相径庭。
- name: 行动三要素：脑、心、手
  desc: 关于推动个人行动力的模型，认为一个人要开始做一件事需要'认知（脑）、愿力（心）、能力（手）'三者合一，缺一不可。
  is_original: false
  excerpt:
  - 简单来说一个人要开始做一件事，通常需要脑、心、手三者合一。这对应的就是「认知、愿力与能力」
- name: TDLib (Telegram Database Library)
  desc: Telegram官方封装的开源库，允许开发者基于其构建自己的Telegram客户端，从而通过程序化方式实现加好友、加群、发消息等全部功能。
  is_original: false
  excerpt:
  - 官方帮我们封装好了一个库，叫做 TDLib 。任何人都能基于 TDLib 去开发 Telegram 的客户端。
  - 高性测试每个实例可以处理超过 24000 个机器人
- name: 生态位补充
  desc: 在快手等平台选择竞争小而符合自身优势的品类，因为平台相似内容不多，更容易获得流量倾斜，从而更快起号。
  is_original: false
  excerpt:
  - 这也是坤哥说的生态位补充，竞争小的，平台相似内容不多，就容易给你更多的流量。
- name: 反向发帖 (挨骂流派)
  desc: 微头条的一种另类玩法，通过故意发表与主流舆论相反的、富有争议的观点（如反着夸被全网批评的人），主动引发网友谩骂和讨论，从而获取巨大流量收益。
  is_original: true
  excerpt:
  - 挨骂 流派，流量的尽头是吵架 别人都在骂 李少莉，社区女干部， 我们就去表扬她 结果，不出意外，账号被网友喷成了狗 不到300字的微头条，含着眼泪赚了400多块
- name: 合作思维 (利他思维)
  desc: 在商业谈判中，将自己与对方置于合作共赢而非对立的关系中，通过释放'利他'信号（如为对方节省精力、加速资金回笼）促成交易。
  is_original: false
  excerpt:
  - 采用合作思维，我和他不是对立关系，而是合作共赢，即利他思维，利他即利己，所以合作思维逻辑成立。
- name: 需求共振
  desc: 指商品销售与目标用户的季节性需求（如学生放暑假时对台灯需求增加）产生的高峰期重合现象，利用此规律可提升产品销量。
  is_original: false
  excerpt:
  - 我通过往年的台灯数据以及生活的经验，预测6月底之后会迎来台灯的小旺季。因为学生们都放暑假了，家长就有需求给孩子配置一个台灯，所以说需求会释放。
- name: 健康财务模型与区域模型验证
  desc: 作者提出的评估加盟品牌是否成熟的新标准，取代过时的'两店一年'标准，强调单店财务健康、多门店模型测算、区域模型验证及可复制性。
  is_original: true
  excerpt:
  - 我们提出了一个最新的标准：1）各种门店模型要测算到位；2）单店模型的财务模型要健康；3）要实现一定范围内的区域模型验证；4）该区域模型的复制性和财务模型要达标。
methods:
- name: __overview__
  desc: 素材整体方法论：以资讯周报形式系统性聚合社群内的实操案例、风向标和复盘贴，通过案例拆解和数据展示，为读者提供不同平台项目的引流、变现与增长套路。
  excerpt:
  - 专属群的群友大家好。小懒继续给大家带来赚钱周报～
  - 标题加了(精华)的表示精华贴，前面为截至今日的点赞数。
  - 本周的内容比之前的稍微少一点，虽然字数上也快十万了
- name: SEO思维布局精准流量（超垂直个人IP四步骤）
  desc: 为超垂直个人IP获取精准客户的方法，通过布局长尾关键词、创作解决方案内容、多渠道发布并坚持更新，实现让精准客户主动找上门。
  excerpt:
  - 1：先辛苦一阵子，根据你的切割的细分领域，用心布局300-500个长尾关键词。
  - 2：每个关键词写一个解决方案，写成各种指南或者攻略，写成600-1000字的千字文，拍成3分钟左右的短视频。
  - 3：把这些内容一天1-2篇的频率丢到抖音，小红书和各大自媒体。注意好布局关键字，大标题，小标题，第一段，最后一段，图篇描述等都要有同样的关键词。
  - 4：大概1个月后，你就会发现你每天都有人添加你，你还发愁没生意做吗？
- name: 产品idea五种构思法
  desc: 从高到低按成功率排序的五种寻找产品创意的方法：原生idea、抄成功竞品做出差异化、分析搜索关键词、预付费定制产品化、生造idea（不推荐）。
  excerpt:
  - 我一共总结了五种常见的方法，他们的成功概率递减。它们分别是：一、原生idea；二、抄成功竞品，然后做出差异化的价值点；三、分析搜索关键词，找到尚未被满足的需求；四、有人愿意预付费找你定制某个需求，然后你将它产品化；五、生造的idea
- name: 抖音情感中视频项目全流程实操法
  desc: 一套从零开始运营抖音情感赛道中视频项目的完整流程，涵盖注册、过中视频计划、养号、找素材、制作、发布、变现，门槛低，靠播放量变现。
  excerpt:
  - 发布方法：打开抖音，点击发布视频，选择做好的视频发布；写标题的时候，标题内容伪原创下对标的内容
  - 过计划要发的视频：我们主要以做菜为主...边做边讲边拍，不需要露脸
  - 养号分5天：第一天正常刷刷视频；第二天做垂直标签，搜索'情感故事聊天记录'；第三天持续点赞关注；第四天重复；第五天下午考虑发视频
- name: 小红书数据化精准引流四步法
  desc: 从聊天记录中筛选高频问题、词频分析、验证特定需求，最终提炼出新人最关心的12个问题，并给出对应的引流、笔记、变现策略。
  excerpt:
  - 我爬取了小红书航海中近百万字聊天，筛选出了上千条问题，进行归纳整理，得出了新人下场小红书最关心的12个问题。
  - 有效数据筛选出来了，接下来就是进行可视化的词频分析
  - 除了看到出现的词频之外，还要进一步确认，这些词，都和哪些词一同出现，以此来具体高频词背后对应的需求。
- name: 小红书笔记发布时间三步模型
  desc: 通过确定用户、分析用户、测试迭代三步，找到最适合自己账号的发布时间，而非照搬官方或赛道时间。
  excerpt:
  - 一个三步模型，分享给你。①确定用户：确定你的笔记是发给哪个用户群体的；②分析用户：去分析出宝妈什么时候有空；③测试迭代：通过你自己发笔记，才调整发现自己的最佳时间。
- name: 小红书爆款选款10-100-1聚焦法
  desc: 通过自建选款库、利用第三方工具、同类同品牌类推、数据化测试四种方式，建立属于自己的爆款商品库，选款测款由数据说话。
  excerpt:
  - 第一，利用100-10-1聚焦法，建立专属于你的爆款选款库。
  - 第二，利用第三方工具找爆款，尽量缩短测款路径。
  - 第三，利用同类同品牌找爆款，效果基本上差不多。
  - 第四，爆款不要想当然，一定要测款，用数据说话。
- name: 美团电商项目冷启动法
  desc: 从发现平台商机、收购公司执照入驻、梳理流程团队入场到从平台历史中找共性，实现美团电商店铺群的快速冷启动与规模扩张。
  excerpt:
  - 一、发现成功案例，做有心人；二、八十块跑通项目最小MVP；三、梳理流程团队入场；四、以史为鉴，从平台历史中找共性；五、项目复盘
  - 在平台上搞钱一定要注意吃相：新平台，没有前人经验借鉴，最重要的不是选品运营，而是了解平台规则
  - 过程管理只要有了'量化的目标'和'明确的时间节点'，团队效率至少提升50%
- name: Telegram自动化集群引流技术
  desc: 基于TDLib开发机器人，通过'搜索群'获取'种子群'，扫描群内消息中的新群链接并自动扩展加入，多机器人服务器协同工作避免重复加群。
  excerpt:
  - 我们开发一个机器人，首先添加几个'搜索群'...通过搜索群，我们可以获得一些'种子群'。
  - 通过扫描这些群里面的人发送过的消息，看看有没有包含群链接。如果包含群链接，我们就自动加入下一个群。
  - 我的做法是用一个服务器来协作：把所有机器人监控到的群链接传到服务器上...每个机器人从数据库中取一个没有加过的群，然后去添加。
- name: TEMU爆款选品与上架法
  desc: 针对Temu平台（拼多多跨境）的选品、上架、备货、爆品打造流程，强调通过筛选有海外资质的工厂、利用英文包材、把握平台稀缺度来打造爆款。
  excerpt:
  - 基于我们现有供应链体系，把所有有海外资质的厂家都筛选一遍，然后在有资质的厂家中，把所有有现成英文版包材的商品在筛选出来
  - 优先选择：1）工厂有现成直接能用的英文图片的商品；2）对起订量要求比较少；3）客单中上，且产品价格相较于亚马逊的热卖价格带还有很大空间；4）Temu上相关产品比较少，亚马逊上销量又不错的商品；5）在北美有热度的品类
- name: 闲鱼低买高卖倒爷套利法
  desc: 一套完整的闲鱼信息差套利流程：先确认商业底层逻辑（低买高卖、安全边际、选爆品、合作思维），再进行市场调研，最后通过定向关键词搜索找低价好货并在闲鱼卖出。
  excerpt:
  - 一、商业的底层逻辑：低买高卖、安全边际、标品看价格、选爆品、合作思维。
  - 二、如何进行前期的市场调研：品牌货最优先、标品优先、销量大优先、销量小看竞争、候选品官方价格一般至少需要150元以上、避开劝退类目。
  - 三、如何找到低价好货：定向关键词搜索（抵账、抵债、顶债、顶账、批量出）、善用筛选功能（价格筛选、最新发布）、不要执着于砍价。
- name: 招商加盟从0到1操盘法
  desc: 一套从项目分类、模式选择到准备工作的完整招商加盟起盘方法论，细分为卖技术、卖料包、卖设备、卖服务、卖品牌、卖特许权，并给出具体准备工作清单。
  excerpt:
  - 招商加盟在我个人看来，是规模化增长非常有效的方法之一
  - 一、招商加盟的分类：轻量级（卖技术、卖料包）、中量级（卖设备、卖服务）、重量级（卖品牌）、魔鬼级（卖特许权）。
  - 三、从0到1准备工作清单：不同的加盟模式，对品牌方的要求不同，那么总部需要提前做的准备工作也略有不同
- name: 视频号大型直播活动操盘法
  desc: 从0到1操盘视频号大型直播活动的完整框架，涵盖策划、从活动框架到细节落地的完整执行方案，适合新手IP或操盘手通过营销活动破圈。
  excerpt:
  - 2月4号开始尝试在视频号直播，截至8月做了三次视频号直播活动，分别是：514大咖8小时连麦，GMV破16万；618学员7小时连麦，场观过1.2万，GMV2万；7月连续5日大咖连麦活动
  - 没有任何大全职人员，第一次活动时甚至没有助理，所有从策划到细节落地均是一手经验，大到整个活动框架，小到海报设计细节及话术细节
- name: 抖音直播镭雕售货拆解法
  desc: 通过拆解个护工具类目的抖音直播间（镭雕工艺刻钥匙扣），分析其选品（低价竞品差价）、话术（痛点对比）、人员配置（2人）、流量策略（场观维护），来评估其利润空间。
  excerpt:
  - 抖音直播镭雕工艺刻钥匙扣车牌号码，好多观众见单价十几块也不贵就下单了
  - 拼多多中号钥匙卖6.88，抖音直播间卖15.9。15.9-6.88=9元（差价）；再用差价*直播商品列表页显示已售8.7w：9（差价）*8.7w（已售）=78.3W（利润）
  - 直接用商品评价数1.1w来计算：1.1w*9元=9.9w，也是6位数的生意。
- name: 微头条爆文写作法
  desc: 通过选择社会类、法律类等有争议或共鸣的题材，掌握平台推荐机制（点击率与互动率指标），编写吸引人的开头和留白提问来提升爆文概率和收益。
  excerpt:
  - 我建议大家去选择社会类的新闻事件以及法律类的故事情节
  - 平台推送的规则：按点击率...必须超过10%点击率，才有机会再进入下一轮的推送流量池...达到3%的互动...如果这两项达不到的话就不会再推送了。
  - 什么样的文章比较容易爆...要掌握四个字'争议、共鸣'
- name: 外贸短视频内容出海变现法
  desc: 将国内已有短视频内容（如绘画教学）发布到TikTok等海外平台吸引流量，通过gumroad、co-fi等虚拟商品平台、中转站及按需列印平台实现多渠道变现。
  excerpt:
  - 通过研究我的同行大号，我挖到gumroad.com这个国外专门卖虚拟商品的平台，注册不难，上架也简单
  - 通过direct.com做中转站...挂到自己的主页上，而且中转站平台是可以看到访问数据的。
  - 工具总结：gumroad.com；co-fi.com；direct.com/linktree.com；redbubble.com
- name: 矩阵化抖音带货视频怼量法
  desc: 在保证视频质量的前提下，通过大量发布拼接剪辑的带货视频来增加爆单概率，即使绝大多数视频流量惨淡，仅靠少数爆款也能实现可观收益。
  excerpt:
  - 在保证视频质量的前提下，量怼的越多，爆单的概率肯定就越大
  - 我大概数了一下，从开始带货到现在，点赞超过500的视频就10个，超过100赞的也没几个。剩下的都是个位数点赞，甚至0点赞。
  - 就这样纯靠怼量，把这个抖音号做起来了...一个号，纯靠发带货视频，不开直播，累计带货10万+。
theorems:
- name: 长期主义者的SEO流量思维
  desc: 长期做超垂直知识IP的人应优先使用SEO思维做流量而非追逐爆款，因为精准搜索流量质量更高、可持续性强，能让后端交付更轻松。
  excerpt:
  - 长期主义者，大部分都用SEO思维在做流量，而追风者往往是用爆款思维组流量，彻底理解这一点，起码受益10年
  - 一个用户愿意通过各种关键词找到你的信息，进而添加到你的私域里。这样来的1个人会比你平台推荐来的100个人更有价值。
- name: 好名字公式
  desc: 一个好的品牌名称应满足：低触达成本+低理解成本+低记忆成本+好体验理由+低传播成本+好的延展空间，从而降低市场推广成本并易于传播。
  excerpt:
  - 好的名字=低触达成本+低理解成本+低记忆成本+好体验理由+低传播成本+好的延展空间
  - 好的名字，听得懂、记得住、好理解、易传播，就比较容易扩散并形成一定的口碑
- name: 平台风控与规则的本质是对流量的分配
  desc: 通过分析小红书、抖音、快手等平台的限流逻辑、违禁词和处罚机制，可以反向推导出平台对流量的分配偏好，进而通过合规或规避方式获得更多流量。
  excerpt:
  - 对于平台来说，引流就是强盗行为，自己辛辛苦苦挖池子养起来的鱼，被别人钓走了，还是不给钱的那种。出于对自己流量的保护，平台对引流行为做出了诸多限制
  - 上有政策，下有对策，我们引流的思路，便是基于账号、笔记、对话框这三大场景，通过花式表达，绕过检测机制，实现传递引流信息的目的。
- name: 商业英雄是平台红利的产物
  desc: 商业上的成功更多是抓住了某个时期平台或市场的红利，而非单纯的个人能力，因此要重视执行力并快速抓住红利窗口期。
  excerpt:
  - 商业英雄只是平台以及市场红利的产物。今天所有的大佬，都是在某一个时间，抓到了某一个市场红利，再匹以执行力，就赚到了第一桶金。
  - 以前总以为自己足够努力赚的是实力的钱，经历了上半年几个月淘系红利期...才明白我们赚的钱都是红利的钱，这是今年最大的感悟之一。
- name: 奶茶加盟模式优于直营模式
  desc: 依据蜜雪冰城（加盟）与奈雪的茶（直营）的财务对比，作者提出在奶茶行业加盟品牌的盈利能力显著高于直营品牌，因此喜茶开放加盟是顺应行业规律的正确决定。
  excerpt:
  - 对比即将上市的蜜雪冰城和已经上市的奈雪的茶（21年19亿利润 VS 亏损1.5亿），大概能代表加盟模式和直营模式的现状...加盟品牌的利润能力要比直营品牌高非常非常多。
  - 所以喜茶要开放加盟这件事，想想也没啥奇怪的，因为奶茶行业真的不适合做直营。
- name: 高成功率产品idea的三个条件
  desc: 一个高成功率的产品idea需要同时满足三个条件：有真实需求存在、你是该领域专家、你能坚持下去，尤其是早期缺乏正反馈的时候。
  excerpt:
  - 在我看来，一个高成功率的产品idea，需要满足三个条件：1.有真实需求存在；2.你是这个领域的专家，即便是直面竞争，你也能比对手做得好；3.你能坚持下去，尤其是早期缺乏正反馈的时候
- name: 健康的单店模型是加盟扩张的前提
  desc: 在开放加盟前，必须先跑通单店模型（单店盈利），再进行区域模型验证（多店复制），只有当模型健康且可复制时，规模化扩张才具可持续性。
  excerpt:
  - 打造一个好的产品，需要先解决单店模型的问题，等到单店模型跑通之后，再开始批量化复制，实现规模化增长。
  - 我们提出了一个最新的标准：1）各种门店模型要测算到位；2）单店模型的财务模型要健康；3）要实现一定范围内的区域模型验证；4）该区域模型的复制性和财务模型要达标。
- name: 视频内容变现的边际成本为零
  desc: 相较于实体商品或需答疑的课程，虚拟商品（如绘画笔刷、模板）售卖的边际成本极低，是真正的一本万利，变现体验甚至优于卖课程。
  excerpt:
  - 某些虚拟类的商品售卖有时候觉得甚至比卖课程体验好很多，大家如果有卖过微信红包封面爆单的经历就比较能感受，完全零售后，而且边际成本就是0，真真正正的一本万利，不像课程还需要答疑。
findings:
- name: 小红书新人最关注的12个高频问题
  desc: '[evidence] 通过爬取小红书航海群近百万字聊天记录（1.6万条），利用''#举手''规则筛选出1700条提问，再经关键词筛选（得到400多条），结合词频分析得出新人最关心的12个问题，集中在流量、笔记、变现三大板块。'
  excerpt:
  - 我爬取了小红书航海中近百万字聊天，筛选出了上千条问题，进行归纳整理，得出了新人下场小红书最关心的12个问题。
  - 瞬间从1.6w条聊天记录里面，筛选出了1千7条提问。
  - 先说一下结论：流量是大家最关心的问题，最大的讨论焦点'违规与限流'...几乎没有人提到定位、选题、爆款。
- name: 小红书词频分析存在迷惑性需进一步验证
  desc: '[evidence] 高频出现的词（如''笔记''）背后可能对应多种不同需求，需进一步分析其伴随词来确认具体需求，不能仅凭词频高低得出结论。'
  excerpt:
  - 这些数据是具有迷惑性的！比如，笔记出现那么高频，大家在讨论笔记的什么呢？是否存在两个词经常伴随出现，从而拉高了出现频率呢？
  - 就拿'笔记'这个词来说，和它一同出现的词，特别的杂，有小眼睛、有违规、流量、发布等等，所以，这样的词，不能具体体现需求的词，可以直接pass掉，虽然它高频出现排在第二位。
- name: SEO内容的长尾福利效应
  desc: '[claim] 作者宣称用SEO思维发布的内容，即使3-5年后依然能享受到内容带来的流量福利，并分享其在小红书、抖音发了不到200篇内容后，即使大半个月不更新也每天有人主动咨询。'
  excerpt:
  - 用SEO思维去发布的内容，那怕3年5年你依然可以享受到这个内容的福利。
  - 我在我的抖音和小红书里，就发了不到200篇内容，现在每天打开小红书和抖音，都有人主动的咨询。我们试过有大半个月一条内容都不更新，也是每天都有人过来咨询。
- name: 小红书广告变现门槛持续放宽
  desc: '[evidence] 从小红书品牌合作人（蒲公英平台）的入驻门槛变化（从5000粉到3000粉再到1000粉）可以看出，平台正大力放宽广告变现门槛，以吸引和留住优质内容创作者。'
  excerpt:
  - 最近小红书又有新动作了，而且力度还很大，一而再再而三的放宽品牌合作人的要求。
  - 从以前的5000粉才能开通，到后来的3000粉，再到现在1000粉，门槛一次次放低，这是为什么？因为平台需要同时面对内外压力。
- name: 合作方报价策略
  desc: '[evidence] 在广告报价中，作者发现申报的粉丝比例（10%）、视频加价（10-20%）、赛道热度和最近7篇数据都是决定报价的关键变量，被同行公司邀请合作时对方未还价，侧面验证了报价策略的有效性。'
  excerpt:
  - 看粉丝：一般来说，报价是粉丝量的10%；看形式：视频可以在图文的基础上，再高10%-20%；看赛道：如果是热门赛道或冷门赛道，数据表现优秀，有抬价优势。
  - 被同行公司看中了，邀我帮他们做视频，我开价对方竟然都没还价就直接拉了工作群开干了。
- name: 无人直播的三大风险与处罚
  desc: '[evidence] 快手无人直播面临平台检测（雷同限流）、原创举报（限流）、判录播（罚100-200）及批量做号（罚2-3千）等处罚，且平台风控会不断收紧，需持续换品、换号。'
  excerpt:
  - 如果去重没有做好，被平台判雷同太多，大概率会被罚，限流一个月；被原创举报搬运，限流一个月；被判录播，一般是让你重新考试，或者罚100-200；批量做号（大概意思），罚2-3千。
  - 做了一年，目前做了一年了，还能做多久不知道。一个款式或者品类做到后面就会有很多人跟上了，竞争大赚钱少了，所以得隔一段时间就换，然后也得注销账号，重新起号等等。
- name: TikTok无人直播的成本与寿命
  desc: '[evidence] TikTok无人直播（obs推流方式）需要MCN资质，成本约1500（二手电脑）+600-800（二手手机），但硬改设备手机（如小米8、谷歌3）存在10分钟至10天不等的寿命风险，观点认为卖手机是''一锤子买卖''。'
  excerpt:
  - 第二种是直播手机，目前市场上很多在卖tiktok无人直播手机...这些机型我们都测试过，时间短的仅仅十分钟，直播间就不见人了，慢的话跑个十天半个月的也就不行了。
  - 目前我们基本一个员工2-3个号，电脑二手的 成本在1500上下，手机是苹果的二手的，600-800一部。
  - 硬改设备我不建议尝试，我有个朋友，买了五六十部谷歌3手机，刚开始没有问题，后来风控，直播间进不去，卖手机的也不给解决。
- name: TEMU低价标品议价空间极小
  desc: '[evidence] TEMU小二会为商家预留约10%利润空间，对报价超过1688同款较多的商家视为''没有诚意''且会压价至与1688相当或更低，因此标品在TEMU上议价空间极小，需侧重非标类商品。'
  excerpt:
  - 之前我也跟小二聊过，他们会给商家预留10%左右的利润空间，对商家中报价超过1688同款比较多的，直接视为没有诚意，会减少跟这类商家的合作。
  - 随着某个产品的类目的商家越来越多，会导致该相关产品的供货价也越来越低...所以我们的重心是放在非标类的商品上，目前来看，非标类的议价会比较少。
- name: 闲鱼倒爷项目实战数据
  desc: '[evidence] 通过三个案例验证了闲鱼低买高卖套利的可行性：飞利浦音响5台购入1400卖出2250；360U盘20个购入300卖出550；72个欧普台灯（配套成本102元/个）在旺季时以149元包邮价格卖出，单日最高卖出9个。'
  excerpt:
  - 尝试一：低买高卖5台飞利浦音响，总价1400购入，2250卖出。
  - 尝试二：低买高卖20个360U盘，总价300购入，550卖出。
  - 72个欧普台灯，共6480元购入；总成本102元每个；旺季时7月单日最高峰卖出9个台灯。
- name: 美团电商单店月利润6k-12k
  desc: '[evidence] 作者团队在2022年8月末发现美团电商机会后，不到两个月时间从0跑通并扩展到30家店，类目不同单店月利润6k-12k（零运营未优化），验证了新平台在成长初期的红利效应，以及''完成比完美更重要''的执行力价值。'
  excerpt:
  - 美团电商成长为团队的第二曲线，类目不同单店月利润6k-12k（零运营未优化），扭转了我们的淘宝店群的颓势。
  - 第一家店跑通最小MVP仅仅花费了80元...截止到10月美团电商全类目商家仅2000多家，我们应该是百货类目入驻的全国前300名。
- name: 微头条反向发帖（挨骂）的收益实证
  desc: '[evidence] 通过发布与主流观点相反的微头条（表扬被全网批评的女干部），主动引发争论和谩骂，350字以内的内容获得了400多块的收益，验证了''流量尽头是吵架''的另类变现思路。'
  excerpt:
  - 别人都在骂李少莉，社区女干部，我们就去表扬她，结果不出意外，账号被网友喷成了狗 不到300字的微头条，含着眼泪赚了400多块
