units:
- 'no': 1
  name: 新号流量扶持 —— 平台送给新人的「见面礼」
  points:
  - '**为什么需要这个概念？**'
  - '- 新账号冷启动最难，没有粉丝基础，内容发出去无人问津'
  - '- 平台需要吸引和留存新创作者，因此愿意在早期给予流量倾斜'
  - '- 理解扶持期机制，才能抓住窗口期快速起量，避免错过红利'
  - '**核心定义**'
  - '- 视频号平台给予新注册账号在初期（据称7天）的流量倾斜机制'
  - '- 具体表现为新号发视频容易突破万次播放，是快速起量的重要基础'
  - '**关键性质**'
  - '- 时效性：扶持期有限，需在早期集中发力'
  - '- 保底性：新号每个视频有几千到一万的保底播放量'
  - '- 不可再生：扶持期结束，流量回归正常竞争水平'
  - '**典型例子**'
  - '- 作者17号开始发第一条视频，晚上三个号全部破万播放（两个1W出头、一个3W+）'
  - '- 新号发视频容易破万播放，是该项目快速起量的核心基础'
  - '**边界条件**'
  - '- 扶持期后，如内容转化率低、视频质量差，流量会明显下降'
  - '- 新号在扶持期内发视频，也有出现全部0播放审核中的情况，并非绝对保证'
  - '- 有观点认为扶持期是7天，也有观点认为流量差异不大，具体时长尚无统一结论'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 一个是因为视频号新号有流量扶持，这个在我看来是最重要的。
  - 圈友诚不欺我也，新号果然是有流量扶持的，这个视频号还真可以搞。
  - 我听说是新号有7天的流量扶持？现在我最开始3个号都过了七天，我倒是没觉得流量有差很多。
  - 在7天扶持期内作死的发视频，一个视频几千一万的，几十个视频就是几十万，几百个就是几百万，然后7天时间过了就换号。
- 'no': 2
  name: 选品即定人群找需求 —— 先锁定「谁要」，再决定「卖什么」
  points:
  - '**为什么需要这个概念？**'
  - '- 盲目选品容易陷入同质化竞争，导致视频流量差、转化低'
  - '- 不同人群的需求差异巨大，只有精准匹配才能提高成交率'
  - '- 从人群需求出发选品，是低成本获取精准流量的核心方法'
  - '**核心定义**'
  - '- 选品的核心原则：通过定义目标人群标签并挖掘该人群的特定需求来选择品类'
  - '- 优先选择垂直需求品（特定人群的刚需），而非通用品（所有人的需求）'
  - '**关键性质**'
  - '- 人群导向性：选品从目标人群标签出发，而非从产品本身出发'
  - '- 需求垂直性：优先选择垂直需求而非通用需求'
  - '- 价格次要性：对目标人群而言，需求匹配度比价格更重要'
  - '**典型例子**'
  - '- 视频号用户以中老年人+下沉城市为主，其特定需求是“身体好、重返青春”，因此运动锻炼类和保养类产品优先考虑'
  - '- 服装、食品等通用品因需求普遍，不作为第一梯队选择'
  - '**边界条件**'
  - '- 通用品并非不能做，但需要更多考虑如何通过视频、直播传递产品特色和优势'
  - '- 选品后还需结合抖音/快手/拼多多的在做人数量判断蓝海程度，做的人多则谨慎考虑'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 选品其实就是定人群然后找需求，大家能理解这句话，就很好选品了。
  - 年纪大了就想身体好，年纪大了就想重返青春，所以运动锻炼类的品和有关保养方面的品，都可以考虑。
  - 这种需求过于普通，这是所有人的需求，而不是我们目标人群的特定需求，所以不在我考虑的第一梯队里面。
  - 我个人的想法……价格什么的反而不是特别的重要，重点在于我觉得这玩意对我有用。
- 'no': 3
  name: 对标账号筛选 —— 找到值得「抄作业」的学霸
  points:
  - '**为什么需要这个概念？**'
  - '- 直接搬运爆款账号容易因重复被平台限流'
  - '- 需要找到素材可持续、可搬运且被搬概率小的账号作为参考'
  - '- 筛选标准化的对标账号，是内容生产流水线化的前提'
  - '**核心定义**'
  - '- 在快手等平台筛选可作为素材来源和目标参考的账号时，需要满足的条件列表'
  - '- 核心标准：粉丝5W以下、视频200条以上、围绕固定垂直品反复带、视频画面干净、有一定非带货视频、保持更新'
  - '**关键性质**'
  - '- 低粉丝量：被搬过的几率小，号主同时发视频号的几率也小'
  - '- 高视频量：素材多，可支撑长期发布和筛选'
  - '- 垂直聚焦：围绕固定品类，保证素材与目标产品一致'
  - '**典型例子**'
  - '- 作者在快手找对标账号时，会重点考察粉丝5W以下、视频200条以上、一直围绕几个品反复带的账号'
  - '- 优先选择画面干净、有一定非带货视频的账号，以规避搬运重复风险'
  - '**边界条件**'
  - '- 筛选标准并非绝对，需结合具体品类和平台调整'
  - '- 对标的账号也可能更新停止或转型，需要定期更新对标库'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 粉丝在5W以下、视频在200以上、一直围绕几个品反复带、视频画面不是自己加很多字的、有一定的非带货视频、保持更新，这样的号我就会把它列入考察目标。
  - 小号就代表被搬过的几率小，而且号主本人同时在发视频号的几率也小。视频多素材就多，可以发的久也可以去做筛选。
  - 我觉得如果能参杂一点非带货视频，会比纯带货号好一点。
- 'no': 4
  name: 视频搬运处理流程 —— 给素材穿上「原创马甲」
  points:
  - '**为什么需要这个概念？**'
  - '- 平台打击纯搬运内容，直接搬运有被限流、封号风险'
  - '- 需要通过固定流程对素材进行去重和改造，提高原创度'
  - '- 一条标准化的处理流水线能大幅提升内容生产效率'
  - '**核心定义**'
  - '- 一套固定的视频去重与改造流程：放大→翻转→BGM处理→加字'
  - '- 加字指针对产品特色/作用/需求添加醒目标语性文字，被认为是出单的关键而非视频本身'
  - '**关键性质**'
  - '- 流程固定化：放大→翻转→BGM→加字，四步标准化操作'
  - '- BGM灵活处理：无BGM则加底，有BGM则变速（如1.1倍、1.2倍）'
  - '- 字幕遮盖：无字幕的识别字幕，有字幕的也识别并遮住原字幕'
  - '**典型例子**'
  - '- 产品是拖把时，加上“今天惹老伴生气了，罚我做一天家务，还好有这个拖把”的标语'
  - '- 对带讲解但无BGM的视频加BGM底，对本身有讲解和BGM的视频做变速处理'
  - '**边界条件**'
  - '- 加字需要针对产品特点设计，并非所有产品都适用同一种文案'
  - '- 放大翻转等方式可能影响视频画质，需在去重和可看性之间平衡'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 我基本是一个固定的处理流程，放大→翻转→bgm→加字。
  - 带讲解的但没有bgm的视频，我会给他加个bgm的底。本身又有讲解又有bgm的，我就会整个变速啥的，调个1.1倍1.2倍稍微弄一下。
  - 没字幕的识别个字幕，有字幕的也识别个字幕，把原先的给他遮了。
  - 最后就是加字，这个点其实我感觉挺重要的，就是针对产品特色/作用/需求等方面，给他整个一两句话，然后弄个醒目的颜色加上去。
  - 有时候出单可能不是因为视频，而是你加的字抓住了用户。
- 'no': 5
  name: 视频号直播转化 —— 用「视频跑流量，直播做收割」
  points:
  - '**为什么需要这个概念？**'
  - '- 视频号直播间自然流量依赖在跑的视频供给，视频没流量则直播无意义'
  - '- 需要掌握开播时机和直播转化技巧，避免无效直播'
  - '- 直播是视频号电商变现的关键转化环节'
  - '**核心定义**'
  - '- 视频号电商变现的关键环节：依赖视频跑出流量作为直播间的流量入口，通过话术+样品展示在直播间实现出单'
  - '- 核心原则：视频没在跑就不开播，终归要靠视频给直播间带流量'
  - '**关键性质**'
  - '- 流量依赖性：直播间的自然流量主要由在跑视频供给'
  - '- 话术+样品双驱动：话术建立信任，样品展示提升转化'
  - '- 节奏控制性：通过反复开播/关播控制时长与节奏'
  - '**典型例子**'
  - '- 无话术无样品首播2小时仅出1单；改写话术并购买样品后，第三天首场1小时即出6单'
  - '- 两个号各播一小时场观仅十几，验证视频没在跑时直播无意义'
  - '**边界条件**'
  - '- 直播需要样品的实物展示，无样品时转化效果差'
  - '- 视频在跑是开播的前提，但视频爆了也需结合精力分配，不能全天候直播'
  sources:
  - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
    role: origin
  excerpts:
  - 终归还是要靠视频给直播间带流量。所以我后面都是看有没有视频在跑，或者就是按群里说的，有新视频破万了就去播。
  - 视频没有在跑，就没必要直播了。
  - 事实证明确话术和样品还是很有有必要的，因为第三天直播的时候，我发现虽然还是基本没人互动，但是提示去购买的次数明显增加了。
  - 我就去抖音看直播，这一看就看了两个小时……一个手机看直播，一个手机录音，然后电脑上打字记话术。
  - 话术弄完了就去买样品，既然要直播，那肯定还是要有样品展示的。
- 'no': 6
  name: 做人群替代做商品 —— 从「卖货」到「懂人心」的降维打击
  points:
  - '**为什么需要这个概念？**'
  - '- 平台搬运受打击、同行数量激增，纯商品视频越来越难爆'
  - '- 头部玩家有资源优势，散户单打独斗难以在商品赛道竞争'
  - '- 需要寻找差异化竞争策略，突破同质化困局'
  - '**核心定义**'
  - '- 一种差异化竞争策略：不搬运商品视频，而是选择细分人群，以人群的情感需求为出发点制作内容，从而实现流量的高效获取'
  - '- 核心逻辑：大路上的人太多了，我换条小路走'
  - '**关键性质**'
  - '- 人群导向：从人群的情感需求出发，而非从商品功能出发'
  - '- 差异化：避开同质化商品视频的竞争红海'
  - '- 内容驱动：以内容引发共情、共鸣，带动流量'
  - '**典型例子**'
  - '- 作者将4个账号分别定位为：20-30岁刚毕业白领（虚荣强但穷）、35-45岁80-90怀旧情怀、50+女性亲情共情、纯带货'
  - '- AB账号2天破百万播放，7天破千万播放并变现2W+；C账号7天破亿播放'
  - '**边界条件**'
  - '- 大爆款带来的人群较泛，变现效率可能低于精准人群'
  - '- 需要较强的内容创作能力，不是简单搬运能实现的'
  - '- 多赛道同时操作易“脑裂”，建议分时间段找素材'
  sources:
  - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
    role: origin
  excerpts:
  - 四、视频号别人做商品，我做人群，伪原创。
  - 做商品类型的种草视频成功概率太小了，并且还有很多有船的大佬，现在都开始付费了，像我这样的单打独斗打不过。大路上的人太多了，我换条小路。
  - 做了四个账号。
  - A:20岁-30岁，刚毕业的大学生白领群体，特征：虚荣心强但穷。
  - B:35岁-45岁，80-90年代的怀旧情怀
  - C:50+的女性，亲情共情。
  - D:还有一个带货账号
- 'no': 7
  name: 情、趣、用、品内容四象限 —— 给内容创作装上「导航仪」
  points:
  - '**为什么需要这个概念？**'
  - '- 内容创作经常陷入“不知道做什么”的迷茫'
  - '- 需要一套分类模型来理解爆款内容产生的底层逻辑'
  - '- 分类框架能帮助创作者快速定位赛道、筛选素材'
  - '**核心定义**'
  - '- 一套短视频内容分类模型，将几乎所有平台的爆款内容归纳为四类：情（共情）、趣（有趣）、用（有用）、品（新奇特产品）'
  - '- 这四个板块的分支可以延伸细分到上千种'
  - '**关键性质**'
  - '- 普适性：所有短视频平台的爆款内容都可以纳入其中'
  - '- 可细分性：每个象限都能延伸到上千种细分方向'
  - '- 底层逻辑性：揭示爆款内容的底层产生规律'
  - '**典型例子**'
  - '- 情：喜怒哀乐，延伸出小朋友的、男人的、女人的、有钱男人的、没钱女人的等各种分支'
  - '- 趣：80岁老人做口播、反差较大的内容'
  - '- 用：教做菜、教做PPT、教做电工'
  - '- 品：北方人没见过的酸角糕、彼岸花盆栽'
  - '**边界条件**'
  - '- 定位时想要的越多越陷入困境，真正能扣到一个点就够了'
  - '- 四象限是内容分析工具，不直接解决变现问题'
  sources:
  - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
    role: origin
  excerpts:
  - 我把短视频内容分为"情趣用品"四个字
  - 情-共情（举例：喜怒哀乐）喜怒哀乐里面又能延伸小朋友的喜怒哀乐，20岁的，30岁的，40岁的，50岁的，男人的，女人的，有钱男人的，没钱女人的等等一些列分支。
  - 趣-有趣（有意思的实验，80岁老人做口播，一些反差较大的有意思的内容）
  - 用-有用（你教会我做菜了，你在教我做PPT，你教我做电工等等）
  - 品-新奇特的产品（北方人大多数没见过酸角糕，很多地方特色的绿植其他地区没见过-昨天看文林写了一个爆款叫彼岸花的盆栽）
  - 所有短视频平台的爆款内容，都可以纳入其中。
- 'no': 8
  name: 伪原创二创方法 —— 让别人的爆款变成你的原创
  points:
  - '**为什么需要这个概念？**'
  - '- 平台打击搬运，纯搬运内容面临限流风险'
  - '- 原创内容创作门槛高、周期长，不适合快速起量'
  - '- 需要一套方法论，让借鉴的素材通过二次创作成为自己的作品'
  - '**核心定义**'
  - '- 以全平台为素材库，基于“情、趣、用、品”的底层逻辑，寻找爆款规律，将素材不违规地进行二次创作（拼接、换音乐等），变成自己赛道发布的作品'
  - '- 核心是“不违规地二创”'
  - '**关键性质**'
  - '- 全平台素材库：抖音、快手、优酷、知乎、小红书、TK等皆可取材'
  - '- 规律性：基于底层逻辑，爆款都是有迹可循的'
  - '- 拼接创作：将不同素材的片段、音乐进行合适拼接，形成新作'
  - '**典型例子**'
  - '- 通过数十条作品制作后，开始留意未上热门但画面或音乐好的视频，在脑海中自然拼接成新作品'
  - '- 借鉴安先生短视频课程的内容分类思维导图，辅助拆解爆款逻辑'
  - '**边界条件**'
  - '- 需要在“不违规”的前提下进行，不能直接侵犯原创权益'
  - '- 多赛道同时操作容易“脑裂”，建议分时间段找素材'
  - '- 前期需要积累，经过数十条作品制作后才能逐渐得心应手'
  sources:
  - paper: docs/202301-02/VsjCdIDNJoNRvlxo4OWcJ7bDnO5.md
    role: origin
  excerpts:
  - 抖音，快手，优酷，知乎，小红书，甚至TK，所有的短视频平台都是你的素材库。
  - 通过这个底层逻辑，你会发现很多爆款都是有迹可循，我们要做的无非是把这些素材不违规的二创成自己赛道的作品，进行发布。
  - 通过大概几十条作品的制作之后，你大概率会发现其实有些作者没上热门的视频，其实他的画面或者他们音乐很好。你就会开始留意那些视频的那些片段，或者音乐，脑海里面会自然给他做一个合适的拼接。
  - （这里建议如果多少赛道同时做的话，尽量分时间段去找素材，真的很容易脑裂）
