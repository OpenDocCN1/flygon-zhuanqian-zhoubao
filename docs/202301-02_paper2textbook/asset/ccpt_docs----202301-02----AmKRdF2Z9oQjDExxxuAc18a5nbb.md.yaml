paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
desc: 该素材是公众号运营者火火对2022年12月14日'行程码下线'热点的一次完整追热点复盘。作者利用12个公众号批量发布96篇文章，在9个有效账号上实现净增近4.5万粉丝、流量主收入6514元。素材系统阐述了追热点的完整操作流程——从找对标体验、写符合算法的文章（铺关键词、加文中广告、伪原创）、起爆款标题，到设置后台承接流量，并总结了流量主、CPS、引流淘宝客三种变现方式。其核心原创贡献在于揭示了一套'公众号搜索流量+批量矩阵'的短期热点收割方法论，特别是通过手动文中广告位设计提升流量主单价、以及用半匹配关键词回复降低举报率等细节技巧。
concepts:
- name: 搜索流量追热点
  desc: 不同于坐等平台推荐，主动在文章中铺入搜索长尾词，让文章被微信搜一搜收录，从而在用户搜索热点关键词时获取搜索流量。作者将长尾词放入文章而非标题，是与长期SEO玩法的区别。
  is_original: true
  excerpt:
  - 我们做的是搜索流量，那相关的搜索长尾词、搜索下拉框词语都可以放进来。文章被收录之后，读者搜索相关长尾词会搜到我们这篇文章。
  - 我在追短期热点的时候，会把这个长尾词放进文章内容中。
- name: 批量做号矩阵
  desc: 同时运营多个公众号（本次12个），每个号发多篇文章且全部内容、标题各不相同，以增加被系统收录的概率。
  is_original: true
  excerpt:
  - 我用12个公众号，每个公众号8篇文章；总共发布了96篇文章，全部是这样子整合内容。
  - 要注意的一点是我96篇文章，每一篇内容都不一样；并且标题都不一样；这样做能够更好的增加被公众号系统收录的概率。
- name: 半匹配关键词回复
  desc: 公众号关键词回复设置中，用半匹配功能设置多个用户经常回复的变体词语，只要回复包含其中任意一个词，就自动回复对应链接，以提升读者体验。
  is_original: true
  excerpt:
  - 关键词回复有一个半匹配功能，意思就是读者回复半匹配中任意一个词语，公众号后台都会自动回复对应链接。文章中让读者回复的关键词是'行程卡'三个字，很多读者其实不会回复成完整的3个字，各种各样的回复都有。我为了让读者体验感更好一些，半匹配词语我设置成他们经常回复的文字。
- name: 泛粉与洗粉
  desc: 将追热点吸引来的泛流量粉丝进行二次变现的概念，低门槛做淘宝客或筛选高价值粉丝再变现。
  is_original: false
  excerpt:
  - 泛粉也有变现的价值，专业一点的小伙伴一般还会洗粉，筛选出比较高价值的粉丝来变现；简单暴力一些的变现方式就是拉群发单做淘宝客。
methods:
- name: __overview__
  desc: 一套完整的公众号热点事件收割流程：从快速决策、对标体验，到批量产出符合算法收录的文章、设置承接流量的后台规则，再到多种广告变现的组合策略。
  excerpt:
  - 我决定要追这个热点之后，把我手头上的公众号挨个登陆，就开始了下面的操作流程：1、找对标账号体验一遍流程；2、写一篇符合平台算法的文章；3、给文章起一个爆款标题；4、设置公众号后台接住流量。
- name: 长尾关键词获取三法
  desc: 获取文章可铺设的长尾关键词的三种免费手段：微信搜一搜下拉词、微信搜索栏相关搜索、5118网站长尾词查询。
  excerpt:
  - 1、微信搜一搜下拉词：打开微信搜一搜，输入关键词，会有对应的下拉词弹出；把这些下拉词全部放入文章中。
  - 2、微信搜索栏中的相关搜索：这里的相关搜索是根据你搜索的关键词来展示，也是其他用户在搜索时经常用到的词语。
  - 3、5118网站查询长尾词：5118网站有个查询长尾词功能，用这个功能查找相关长尾词。
- name: 爆款文章撰写法
  desc: 围绕'迎合算法而非文笔'原则写文，要点包括：内容写到七八百字满足文中广告插入要求；通过整合复制等方式做伪原创；将关键词设置成暗淡颜色以兼顾阅读体验。
  excerpt:
  - 追热点文章不是需要文笔写的多好，内容迎合平台算法喜好能被收录就行。
  - 我写追热点文章的时候，我会有意识的把文章内容写到七八百字左右；让文章更加容易被公众号收录，也能符合公众号在文中添加广告的要求。
  - 为了阅读体验感好一些，我在文章中就把这些关键词的颜色调暗淡一些。
  - 我第一部分内容先写了如何获取行程卡纪念版生成链接，第二部分内容是在公众号平台/百度平台搜索行程码，把其他相关的文章内容复制加入到后面半段；凑够八百字并且读的还流畅就行。
- name: 爆款标题双法
  desc: 两种起标题策略：一是提取排名靠前文章标题中的高频热词（如'火爆全网''免费获取'）自行组合成新标题；二是直接摘录爆款标题做轻微改动伪原创，兼顾原创度与吸睛度。
  excerpt:
  - 方法1：提取关键词自己原创：把排名在前面阅读量比较好的文章标题全部copy下来当参考，找到共同的关键词...火爆全网、免费获取；然后再加上关键词个人行程卡。
  - 方法2：找爆款标题伪原创：我搜对应关键词，直接把排名在前面的文章标题复制下来，轻微改动；但不能全部一样。
  - 标题更改的原理是在于原创性以及吸引眼球，原创度有助于算法收录文章，吸引眼球有助于读者搜索到第一栏点击进去阅读。
- name: 流量承接双模块设置
  desc: 通过公众号后台自动回复的两个模块（关键词回复+收到消息回复）来承接流量，关键词回复承接链接、收到消息回复引导用户并降低举报率。
  excerpt:
  - 模块1：设置关键词回复承接住流量：我们设置好的流程是粉丝关注公众号之后，回复关键词，公众号自动回复行程码生成链接。
  - 模块2：设置收到消息回复减少举报率：我还在收到消息回复这里也设置了文案，这里的作用是让读者不管回复什么消息，都能看到这句话；知道回复哪几个字才能拿到链接。这里其实起到了一点作用啊，就是减少粉丝举报的概率。
theorems:
- name: 手动广告位优于智能插入且可诱导点击
  desc: 文中广告手动添加在'点击关注下方公众号进入主页'这句话下面，利用读者第一反应和平台推荐其它公众号的误导性，能显著拉高流量主单价，是变现高于他人的核心原因。
  excerpt:
  - 我把广告添加在点击关注下方公众号进入主页这句话下面，很多读者第一反应就会直接点击广告，稍微带了一些诱导性质；另外平台推荐广告的时候，文中广告位直接就推荐其它公众号，很有误导性。这也是为啥我公众号这次追热点流量主收入那么高的原因。
  - 一定是要设置手动添加广告，不要智能插入广告。
- name: 自动回复CTA（Call To Action）是CPS/CPA变现的落脚点
  desc: 订阅号文章内放链接不生效跳转，但自动回复中可以放可点击的蓝字链接，因此CPS/CPA变现载体应放在自动回复里，而非文章内。
  excerpt:
  - 订阅号文章页面放链接不会生效跳转，但是它放在自动回复里面就可以实现。我在这次追热点的过程中，自动回复里放入两个链接；一个是电话卡销售CPS，一个是外卖进群加粉CPA。
  - 注意，自动回复链接是可以用篮字的方式展示，当时太赶就没有来得及做这个处理。
- name: 批量做号需保证内容差异性
  desc: 批量发布多篇文章时，每篇内容、标题保持各不相同，能显著提高被公众号算法收录的概率；单号追热点则建议进行原创转述。
  excerpt:
  - 如果是需要批量做号发布文章的话，要注意的一点是我96篇文章，每一篇内容都不一样；并且标题都不一样；这样做能够更好的增加被公众号系统收录的概率。
  - 如果是一两个号追热点，我建议尽量用自己的话来转述一下文章，变成原创文字；就更容易被微信系统收录。
- name: 追热点需快速决策与前置能力积累
  desc: 即便获取热点信息晚（11点多才得知），凭借此前积累的公众号SEO能力和追热点经验（秋天第一杯奶茶引流3000粉）仍可果断入局，判断'这个热点我可以做'。
  excerpt:
  - 基于上面的信息以及自身经历，我认为这个热点我可以做；就算这个热点信息我获取的时间晚，但经过我操作的公众号还是能获取到一点点流量。
  - 我之前追过热点，秋天第一杯奶茶引流了3000多的公众号外卖粉；本身也比较擅长公众号SEO。
findings:
- name: 净增粉丝与取关率数据
  desc: '[evidence] 由运营数据截图支撑：9个有效公众号累计新增97385粉、取关52430粉、净增44955粉，取关率约53.8%，说明热点追粉存在大量取关。'
  excerpt:
  - 9个公众号总共新增97385个粉丝；取消关注52430个粉丝；净增44955个粉丝。
- name: 流量主变现构成
  desc: '[evidence] 流量主总收入6514元，且3张破千元的单号收益截图显示文中广告收入远超底部广告收入，支撑了手动文中广告位价值的观点。'
  excerpt:
  - 流量主总收入6514元。
  - 给大家截图3张我这边最好的流量主收益，每一个收益都是破千元。
  - 对比追热点时同一个账号同一天这两个地方的收入差别，如果不是文中广告手动添加的位置找得好，那文中广告的收入就不会远远超出底部广告的收入了。
- name: CPS变现转化效果
  desc: '[evidence] 自动回复内放置两个CPS/CPA链接，电话卡售出6张（每张约70元佣金，共400余元），外卖进群CPA因路径过长转化失败。'
  excerpt:
  - 一个是电话卡销售CPS，一个是外卖进群加粉CPA。电话卡总共卖了6张，平均每张70元的佣金；总共四百多佣金。外卖进群路径太长诱惑力度小，导致外卖这一块没有产出，失策了。
- name: 单日热点总变现测算
  desc: '[claim] 作者宣称按单粉一毛钱估值4万多粉丝价值4000元，加上流量主6000元与手机卡400元，单日追热点理论上变现约1万元。'
  excerpt:
  - 如果四万多粉丝按照单粉一毛钱的价格来算，算价值四千元；然后加上流量主六千元，卖手机卡400元；理论上是我昨天追热点变现一万元。
- name: 发文数量与命中率关系
  desc: '[evidence] 12个公众号中仅9个获得流量，其中3个未上排名，即75%的账号实现了有效涨粉，说明批量矩阵策略下多数账号可命中搜索流量。'
  excerpt:
  - 总共用12个公众号批量操作来追这个热点，其中3个公众号发文没有上排名没有流量，不统计数据。
