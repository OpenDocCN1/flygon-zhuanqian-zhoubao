- 'no': 11
  name: 股权顶层设计四要素 —— 给合伙关系装上“安全阀与加速器”
  points:
  - '**为什么需要这个概念？**'
  - '- 合伙创业最怕“钱没赶到、人先散了”：股权模糊、控制权不清、退出无门、贡献难算'
  - '- 早期不谈股权、不签协议、不设机制，后期估值大时必撕逼、进法院、公司死掉'
  - '- 需要一套“标准化、可量化、可落地、可进化”的股权设计框架，在顺境把丑话说前头'
  - '**核心定义**'
  - '- 顶层控制权：谁有操盘能力、谁有责任心、谁是“好人”，谁拥有最终决策权（通常创始人持股 >51% 或 AB 股/一致行动人协议）'
  - '- 进入机制：资金型溢价进入、资源型对赌进入、技术型专利/成果进入，拒绝“送股份、分蛋糕”'
  - '- 分配机制：静态初始分配 + 动态调整（按里程碑、贡献、绩效），避免“大锅饭、养闲人”'
  - '- 退出机制：时间约束（锁定期）、回购原则（净资产/估值/协商价）、回购价格公式、竞业限制'
  - '**关键性质**'
  - '- 五步法量化：定性定量结合，把模糊的“贡献”算成具体的“股点”，全员公开、可复核'
  - '- 配套合同规范：一致行动权、期权池、分红奖励、回购权、优先清算权、领售权，股权比例只是起点'
  - '- 创始人身份本质是风险承担：对外只能有一个声音，控制权必须极度明确，不可模糊'
  - '**典型例子**'
  - '- 胖龟找房：城市合伙人模式，平台提供房源库/配房人员/带看流程，合伙人只维护用户，标准化赋能复制'
  - '- 4C 动态量化模型：创始人身份、岗位权重、时间投入、资金投入四维度打分，自评互评达成共识'
  - '- 作者警示：融资避坑——识别骗子公司（收各种费）、不盲目缴费、最好有人推荐'
  - '**边界条件**'
  - '- 无标准答案：不存在“放之四海而皆准”方案，需按行业、阶段、团队、愿景定制'
  - '- 股权≠分钱：早期股权几乎为 0，核心是锁定核心人、对齐预期、预留未来，而非当下分蛋糕'
  - '- 法律落地必需：所有机制必须固化进《公司章程》《股东协议》《期权计划》《保密协议》，口头无效'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_03.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - 做股权顶层设计时考虑的核心因素，还是顶层控制权、进入机制、分配机制、退出机制。
  - √：有操盘能力、有责任心的好人拥有公司的控制权…进入机制：资金型股东溢价进入，资源型股东对赌进入，技术型股东专利进入…
  - 在顺境时把丑话说在前面，才能避免逆境时翻脸。
- 'no': 12
  name: 内在比赛 —— 赢在潜意识认可目标的那一刻
  points:
  - '**为什么需要这个概念？**'
  - '- 无数创业者“技术行、资源有、机会来”，却在关键时刻掉链子、自我设限、恐惧成功、拖延放弃'
  - '- 外在比赛（市场、竞品、融资、运营）赢不赢，取决于内在比赛（潜意识是否真正认可目标）'
  - '- 需要一套“心法”，在潜意识层面装配“必胜信念”，而非靠意志力硬扛'
  - '**核心定义**'
  - '- 自我一（理性/一般自我）：爱分析、爱担忧、爱评判、爱设限、声音大、爱抢麦克风'
  - '- 自我二（潜意识/感性自我）：掌握技能、直觉、肌肉记忆、真实动力、不说话但决定行动'
  - '- 内在比赛：自我二是否真心认可目标？若不认可 → 潜意识拖后腿 → 外在比赛必输'
  - '**关键性质**'
  - '- 盲目自信是理性选择：在潜意识植入“我就是国王/我不可战胜”，不是盲目乐观，是战略性自我暗示'
  - '- 成功是成功之母：刻意制造、收集、唤醒“微小成功体验”，在潜意识堆叠“赢家身份”'
  - '- 俯视学习法：战略上藐视对手（我比你强）、战术上重视细节（虚心请教、像学生一样执行）'
  - '**典型例子**'
  - '- 老虎伍兹：性丑闻后潜意识“不再完美”，世界第一跌出前 100，技术没变、信念碎了'
  - '- 李宗伟 vs 林丹：技术不分伯仲，李宗伟 37 战 25 败，核心是潜意识层面的内在比赛落败'
  - '- 唤醒成功体验法：推销员早起先卖容易卖的、找好客户，制造“早早赢一把”，带动全天状态'
  - '**边界条件**'
  - '- 非“阿 Q 精神”：必须基于真实能力、真实复盘、真实微小胜利，空洞自我暗示会被现实粉碎'
  - '- 不能替代战略与执行：心态再好、模式不对、方向错、不干活，依然归零'
  - '- 需持续维护：一次成功体验会褪色，需建立“成功体验库”、定期复盘、持续喂养自我二'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: improve
  excerpts:
  - 人有两个自我，自我一对应理性/一般自我，自我二对应感性/潜意识；任何比赛同时进行着内在比赛与外在比赛，当自我二不认可目标时就会输掉内在比赛，进而输掉外在比赛。
  - 李宗伟不是输给了林丹，是输给了自己。
  - 创业者需要的不是理性的自我怀疑，而是近乎盲目的自信与乐观——“在我的领域我就是国王”的潜意识信念是打赢内在比赛、获得外在成功的前提。
  - 成功才是成功之母；过去的成功体验会在潜意识中累积自信，推动后续更大成功。
- 'no': 13
  name: 战略即选择 —— “不做什么”比“做什么”更重要
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者贪多嚼不烂：想做所有平台、卖所有品类、服务所有人群、试所有玩法，结果样样稀松'
  - '- 资源永远稀缺（时间、精力、钱、人），不做减法，重点就没有资源，重点不强，生意就不成'
  - '- 需要一个“战略筛选器”，在海量机会中果断说“不”，把资源全部倾斜到那 1 个确定性最高的点上'
  - '**核心定义**'
  - '- 战略 = 选择 = 取舍 = 明确“不做什么”'
  - '- 目标 ≠ 战略：“帮助一万个人赚到钱”是目标；“只做副业和减肥两个刚需项目、不碰非刚需”是战略'
  - '- 战略三要素：发挥优势（筹码）、补齐短板（防御）、序列化推进（节奏）'
  - '**关键性质**'
  - '- 战略稳于执行：公司倒闭多因治理层（三会一层）战略失误，而非执行层不努力；战略不朝令夕改、慎之又慎'
  - '- 战略发挥优势：先盘点手里的“筹码”（资源、能力、人脉、数据、品牌），再决定怎么打牌'
  - '- 战略即放弃：放弃非刚需项目、放弃非核心渠道、放弃非高潜人才、放弃低毛利 SKU'
  - '**典型例子**'
  - '- 作者战略收缩：“非刚需项目都不做了，手上只循环副业和减肥”，10 年 4 次失败后的觉醒'
  - '- 喜茶开放加盟：承认直营模式跑不通（奈雪亏损 1.5 亿），顺应行业规律（蜜雪 19 亿利润），战略转型'
  - '- 美团电商：发现机会 → 80 元跑通 MVP → 梳理流程团队入场 → 以史为鉴找共性 → 复盘扩张，每步聚焦单一目标'
  - '**边界条件**'
  - '- 战略需“战术勤奋”支撑：只选方向不冲锋 = 空谈；战术勤奋不能逃避战略探索：只埋头干活不抬头看路 = 盲动'
  - '- 战略有窗口期：红利期激进投放、存量期精细运营、衰退期及时止损，同一战略不同时期执行截然不同'
  - '- 战略需“三会一层”治理护航：股东会定方向、董事会做决策、监事会查风控、高管层抓落地，内部不乱才能外部打赢'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_06.md
    role: apply
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - 什么是战略呢？就是选择。选择，其最重要的就是不做什么，而不是做什么。
  - 战略就是先审视自己手里的筹码，也就是自己的优势，然后再决定自己怎么打牌，也就是如何运用自己的优势来获得你想要的结果。
  - 公司如果经营不善或者倒闭，更多的原因，不是下面的管理层、执行层，而是治理层'三会一层'。战略，既不是一朝一夕的事，也不是朝令夕改的事。
- 'no': 14
  name: 执行力变现论 —— “笨功夫”才是最高级的护城河
  points:
  - '**为什么需要这个概念？**'
  - '- 环境推崇“聪明人”、“捷径”、“黑科技”、“信息差”，实则“执行力”才是最稀缺、最可变现、最难被复制的资产'
  - '- 很多人“有想法、有方案、有资源”，就是不干、不坚持、不复盘、不迭代，死在“知行合一”鸿沟上'
  - '- 需要重新定义“执行力”：不是盲目蛮干，而是“以结果为导向、以最小行动单元为颗粒度、以高频复盘为节奏”的持续交付能力'
  - '**核心定义**'
  - '- 执行力 = 持续把确定性动作做到位、做到果、做出结果的能力'
  - '- 可量化指标：日更天数、发文篇数、加粉人数、测款轮次、招商电话量、代码提交频次、复盘文档字数'
  - '- 执行力本身可变现：宝妈 4 个月加 4000 好友微信号卖 7 万、作者因执行力被亦仁邀请进生财办公室'
  - '**关键性质**'
  - '- 竭尽全力是最轻松的工作方式：大多数人从未竭尽全力，只要做到“够勤奋、够用心”就能超过 90% 对手'
  - '- 战术勤奋 ≠ 战略执行：用忙碌掩盖战略懒惰（不思考、不复盘、不探索）是剧毒；真执行 = 战略方向对 + 战术动作狠 + 复盘迭代快'
  - '- 执行力可 SOP 化、可招人复制：把重复基础工作外包/招人，自己聚焦“最不确定、最高杠杆”的 100 个小问题'
  - '**典型例子**'
  - '- 565 天日更写作：完成课程、社群、咨询三个变现闭环，微信好友 6 倍增长'
  - '- 视频号大型直播活动：无全职人员、无助理，策划到海报设计到话术细节全亲力亲为，三次活动 GMV 破 16 万/场观 1.2 万'
  - '- 美团电商：80 元跑通 MVP、两个月 30 家店、单店月利润 6k-12k，核心是“完成比完美更重要”的极速执行'
  - '**边界条件**'
  - '- 执行方向错 = 零效率：在错误赛道、错误模式、错误产品上狂执行，只是“加速死亡”'
  - '- 执行需“反馈回路”：无数据复盘、无用户反馈、无同行对标的执行，是“自我感动式内耗”'
  - '- 执行力有边界：健康、家庭、认知上限、平台规则、宏观周期，强行突破会导致系统崩溃'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_06.md
    role: apply
  excerpts:
  - 执行力是值钱的，执行力是可以变现的，我想奖励执行力；邀请我去生财办公室这何尝不是对我的执行力的一种奖励。
  - 亦仁大概花了 7W 买了她坚持 4 个月加了 4000 多好友的微信号。
  - 竭尽全力是最轻松的工作方式。…… 其实我们几乎所有的人，做事都很难做到竭尽全力。…… 有时候我们不必去拼天分，我们在很多事情上，只要够勤奋、够用心就可以了。
- 'no': 15
  name: 利他即利己 —— 把“分享”变成“资产增殖器”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统商业思维：“教会徒弟饿死师父”、“核心机密不外传”、“用户名单是命根子”'
  - '- 互联网时代：信息半衰期极短、市场容量极大、连接成本极低，藏着掖着反而切断信息回流、错失合作机会'
  - '- 需要重塑“分享观”：分享不是成本，而是投资；分享越多、回流越多、信任越厚、机会越大'
  - '**核心定义**'
  - '- 利他即利己：主动分享好信息、好方法、好资源、好项目，不设门槛、不求直接回报，长期看回报远超成本'
  - '- 机制：分享 → 吸引同频者 → 形成信任网络 → 信息/资源/项目回流 → 复利增长'
  - '- 核心认知：“现在最稀缺的就是信息，这市场这么大，蛋糕分得完吗？”'
  - '**关键性质**'
  - '- 正向循环：越分享 → 越被信任 → 越获核心信息 → 越能抓住机会 → 越有料可分享'
  - '- 筛选器：愿分享、能分享、持续分享的人，大概率是高执行力、高认知、长期主义者，天然筛选优质伙伴'
  - '- 成本极低：一篇文章、一条朋友圈、一次直播、一个文档，边际成本趋零，边际收益无上限'
  - '**典型例子**'
  - '- 作者坚持周报、写作、分享，获得亦仁认可、进入核心圈层、获取高阶项目信息、实现多项目变现'
  - '- 社群分销：佣金/设计压力低、产品有社交货币价值（如推荐好书展示好妈妈形象），分销员疯狂发圈自发裂变'
  - '- 知识付费：付费买别人的试错经验和时间，本质是“利他者把坑踩平了，让后来者少走弯路”'
  - '**边界条件**'
  - '- 核心商业机密（核心算法、独家供应链、未公开专利、核心财务数据）不在分享范围内'
  - '- 分享需“有价值、有门槛、有节奏”：纯发鸡汤、发过时信息、发无法落地的宏大叙事，会透支信任'
  - '- 避免“白嫖党”吸血：建立“先给价值、后收反馈”的机制（如关注领资料、打卡领课程、付费入群），筛选真需求者'
  sources:
  - paper: docs/202301-02/20230207_06.md
    role: origin
  - paper: docs/202301-02/20230207_05.md
    role: improve
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - 利他等于利己，越分享越幸运。
  - 曾有朋友反问我，你就不怕你把赚钱的信息分享出去，别人抢了你的蛋糕？…事实证明，你越利他，你得到的回报会更大。现在最稀缺的就是信息…这市场这么大，蛋糕分的完吗？
  - 采用合作思维，我和他不是对立关系，而是合作共赢，即利他思维，利他即利己，所以合作思维逻辑成立。
