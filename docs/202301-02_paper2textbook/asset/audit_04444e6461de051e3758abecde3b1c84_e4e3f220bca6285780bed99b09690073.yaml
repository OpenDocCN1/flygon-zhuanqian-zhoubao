unsupported_claims:
- location: '36.27'
  claim: 内容价值金字塔的三层分别是：给娱乐、给工具、给方法
  reason: 素材中P006和P005虽提及三层内容价值，但未明确使用'内容价值金字塔'这一术语，且P005中层级描述为'给娱乐、给工具、给方法'，P006中描述为'①给娱乐、②给工具、③给方法'，两者内容一致但术语表述存在差异，章节36.27将其定义为'金字塔结构内容创作法'并关联'史实-方法-心法'三层，与素材中'娱乐-工具-方法'三层模型不完全对应，属于概念扩展而非直接引用。
- location: '36.31'
  claim: 团队裂变为树状结构、用户裂变为网状结构，通过战队PK叠加可破解裂变断层
  reason: 素材P001(VAA8dQLTZolMlJx1jxrcKaPrnzd)中明确提及团队裂变为自上而下的树状结构、用户裂变为自下而上的网状结构，并提出战队PK玩法将两者叠加，实现了3天裂变近6000用户，该主张有素材支撑。
- location: '36.32'
  claim: 加盟扩张前需完成单店模型验证、区域模型验证及复制性财务模型达标
  reason: 素材P001(20230207_11)中提出最新加盟标准包含四点：门店模型测算到位、单店财务模型健康、区域模型验证、区域模型复制性与财务模型达标，与章节主张一致。
