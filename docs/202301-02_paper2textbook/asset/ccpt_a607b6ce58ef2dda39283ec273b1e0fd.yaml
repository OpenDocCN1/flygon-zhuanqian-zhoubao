paper: docs/202301-02/MUfLdmUlTosj0NxPhlfcjRPHnff.md
desc: 该素材是郭晓文撰写的关于如何从零到一打造高交付质量训练营的保姆级教程。素材首先提出核心心法——要做出高质量、落地性强的训练营，老师不能脱离一线，并针对“教学占用时间→影响实战→落地性变差”的困境给出三个解法：把一份时间卖很多次（用操作手册、直播、百问百答替代1v1）、撬动学员的时间（引入优秀学员分享）、让学员意识到自己的责任（取消无效提醒、强调责任感、设置打卡）。随后给出干法层面的保姆级落地步骤，涵盖招生（收款平台选择）和交付（操作手册、直播授课、打卡、交流、百问百答五个板块）的具体操作，重点强调操作手册要“按阶段给出信息”和“只给最少必要信息”两个原则。
concepts:
- name: 高效率交付才能高质量交付
  desc: 核心心法主张：老师只有保持一线实战能力，才能保证教学内容可落地。若教学占用过多时间导致脱离一线，则会陷入教学与实战的恶性循环，最终学员体验差且自己业绩下滑。
  is_original: true
  excerpt:
  - 要做出高质量，落地性强的训练营，老师就不能脱离一线。
  - 我花更多时间精力去教学员，我一线实战的时间精力就变少了；我一线实战的时间精力变少了，我自己的业绩就得下滑，我教的东西的可落地性也就变差
- name: 把一份时间卖很多次（质量低下，需要并列结构）
  desc: 将原本需要逐一重复回答的1v1教学，转化为一次制作可反复查阅/回看的标准化内容（操作手册、直播录屏、百问百答），从而提升单位时间的交付效率与质量。
  is_original: true
  excerpt:
  - 1v1是学员优先级最低的选项。因为1v1：会耗费大量时间；会需要我重复回答非常多的问题；即时回复的东西，都是未经雕琢的碎片化的信息
  - 操作手册是系统性的给出所有知识，是用来「查」的。直播是更直观的介绍手册，是用来「理解」的。百问百答是各种碎片化的问题，也是用来查的。
- name: 撬动学员的时间（质量不好，建议改命：学员互帮互助）
  desc: 通过引入优秀学员的分享，利用同侪之间的信任和榜样效应，既能促进学员间的互助氛围，又能丰富课程、释放老师精力，实现老师、优秀学员、普通学员三方共赢。
  is_original: true
  excerpt:
  - 学员会遇到很多老师没遇到过的困难。这个时候，优秀学员的经验分享，就显得意义巨大了：可以给其他学员信心；在「怎么学」这块，起到一个榜样的作用；更好的氛围。
  - 对老师来说，优秀学员的分享，非常好的丰富了课程，也能很好的释放自己的时间精力。这是三方共赢的行为。
- name: 让学员意识到自己的责任
  desc: 教学方应引导学员建立主动学习心态，将“做出成果的责任”归因给学员自身，同时设定打卡等动作保证执行力，让成材率提高而老师更轻松。
  is_original: true
  excerpt:
  - 被动 的做项目，几乎是不可能做出成果的。
  - 我的责任是：在你想做这个项目的时候，遇到的问题，都能得到解决；你的责任是：踏踏实实的执行项目，努力保证动作不变形。
  - 做到：失败的唯一可能性，就是学员自己放弃。
- name: 按阶段给出信息
  desc: 制作操作手册前，需要将项目拆分（步骤、顺序、所需技能、耗时），然后分阶段分次放出信息，使学员每个周期只围绕一个主题执行和讨论，降低项目完成难度。
  is_original: true
  excerpt:
  - 做成一个项目，很难。但把项目分解清楚，让大家一块，一块执行清楚了，难度就会下降很多。
  - 每一周有一个固定的主题，大家就围绕着这一个主题去执行，去讨论。
- name: 最少必要信息
  desc: 教学时只提供学员完成当前阶段闭环所需的信息，过滤“有用但不必要”的进阶信息，以降低学习门槛。
  is_original: true
  excerpt:
  - 学员完成一件事情，只需要掌握哪些信息。
  - 在这个阶段，我不需要把我知道的混剪、原创等方法也告诉大家。因为，大家要完成闭环，只需要了解这些信息。
  - 文档里面哪些信息，删掉之后，也不影响学员完成这个阶段的动作？然后，删掉这些内容。
methods:
- name: __overview__
  desc: 素材提供了一套完整的训练营设计与落地方法论，分为心法层（保证交付质量的三条原则）和干法层（招生与交付五板块的具体安排）。
  excerpt:
  - 内容分成两部分：1. 心法---为什么要这么设计训练营；1. 招式---保姆级教程
  - 设计一个训练营，分成两个步骤：1. 招生；1. 交付
- name: 把一份时间卖很多次：操作手册 + 直播录播 + 百问百答 + 1v1诊断
  desc: 交付体系的构建方法：优先制作系统性的操作手册（供查阅），再配合直播讲解（供理解）、整理百问百答（供查阅），只有三者无法解决时才动用1v1诊断，将老师的碎片化重复劳动降至最低。
  excerpt:
  - 1. 制作项目的操作手册。系统性的给出做成项目要做的流程和具体动作
  - 1. 直播讲解项目和操作手册，并进行答疑。
  - 1. 制作项目的百问百答手册，供查阅。
  - 如果经过直播（包括录屏）+操作手册+百问百答还解决不了问题，再上1v1诊断。
- name: 撬动学员的时间：优秀学员分享机制
  desc: 引入优秀学员进行经验分享，利用其榜样效应给其他学员信心、示范「怎么学」，同时通过分享让优秀学员巩固自己的正确动作（分享必爆），并增强训练营的社群氛围。
  excerpt:
  - 可以给其他学员信心——同期的你可以，我也可以
  - 在「怎么学」这块，起到一个榜样的作用——老师一般更知道教怎么做
  - 通过准备分享，更清楚的意识到出自己的正确动作是什么，让自己的成果更稳。——我们称之为「分享必爆」
- name: 让学员意识到责任：开营前引导 + 每日打卡模板
  desc: 通过开营前引导学员建立「责任在自己」的认知，配合固定的打卡模板，监督学员每日执行与复盘，让学员从被动转为主动，老师则取消无效的提醒工作。
  excerpt:
  - 在每次开营之前，都会花时间让大家意识到做出成果的责任在自己身上。
  - 设置打卡的动作，让学员每天写下自己当天的执行动作、遇到的问题，以及复盘
  - '1.今日发布视频数量 2.昨日发布视频总播放量 3. 昨日GMV: 4.明日发布计划： 5. 遇到问题以及如何解决 6. 疑问：'
- name: 操作手册撰写法：项目拆分与信息筛选
  desc: 针对操作手册的编写，提出了“按阶段给出信息”与“只给最少必要信息”两个执行步骤。即先梳理项目执行所需的动作、顺序、技能与耗时，按周分阶段放出信息；同时删除不影响学员完成阶段动作的非必要信息。
  excerpt:
  - 按阶段给出信息：先拆分：要做成自己这个项目，都需要做什么事情？这些事情的先后顺序是什么？做成这些事情，分别需要具备什么样的技能和知识？掌握这些技能和知识，大概需要多长时间？然后，分阶段放出这些信息。
  - 只给最少必要信息：文档里面哪些信息，删掉之后，也不影响学员完成这个阶段的动作？然后，删掉这些内容。
- name: 工具选型方案：千聊/小鹅通 + 飞书全家桶
  desc: 给出训练营交付的基础设施选型方案：招生收款使用千聊（免费但风控严）或小鹅通（付费）；交付环节采用飞书文档（操作手册）、飞书直播（授课录播）、飞书群（打卡）、微信群（交流）的组合。
  excerpt:
  - 这边提供两个我用过的平台：1. 千聊（免费）；1. 小鹅通
  - 我这边习惯的交付方式是：1. 操作手册——飞书文档；1. 直播授课&录播回放——飞书直播；1. 打卡——飞书群；1. 交流——微信群；1. 百问百答——飞书文档
- name: 百问百答整理法（质量差，建议改为：百问百答文档沉淀法）
  desc: 将微信群讨论、打卡群答疑和1v1诊断中的问题与答案定期整理进百问百答文档，并按阶段分类而非按日期堆叠；若问题由学员解决，则艾特该学员以扩大其影响力，从而降低成本、反哺学员。
  excerpt:
  - 我们可以把这几个地方的问题和答案，定期整理进百问百答文档里面。这样可以避免反复回答一些重复的问题。
  - 百问百答，要按照阶段来分类，而不是简单的把信息堆在一起，更不是按照日期来分类
  - 如果问题是学员解决的，最好能艾特出这个学员。这样也能帮学员扩大影响力。
theorems:
- name: 1v1是学员优先级最低的选项
  desc: 在训练营交付体系中，1v1被定位为最吃力不讨好的教学方式，因为其耗费大量时间、引发重复回答问题，且即时碎片化信息对学员帮助有限；应通过标准化文档与直播替代。
  excerpt:
  - 在我的训练营体系里，1v1是学员优先级最低的选项。
  - 因为1v1：1. 会耗费大量时间；1. 会需要我重复回答非常多的问题；1. 即时回复的东西，都是未经雕琢的碎片化的信息，对学员的帮助，效果并没那么好。
  - 简单来说，就是1v1是最吃力不讨好的事情。
- name: 被动做项目几乎不可能做出成果
  desc: 学员若将做出成果的希望寄托在别人身上、被动执行，则几乎不可能成功；老师的主动唤醒式提醒是无效工作，反而应通过帮助积极主动的学员取得成果，来带动后进者重拾积极性。
  excerpt:
  - 被动的做项目，几乎是不可能做出成果的。
  - 反而是我努力帮积极主动的学员做出成果后，这些后进的学员看到后，会重拾积极性，归队一起冲。
  - 几乎取消了所有对后进学员的提醒工作。这是只会感动自己的无效工作
- name: 分享必爆
  desc: 优秀学员通过准备和进行分享，能够更清楚地意识到自己的正确动作是什么，从而让自己的成果更稳定，是巩固自身能力的一种有效方式。
  excerpt:
  - 通过准备分享，更清楚的意识到出自己的正确动作是什么，让自己的成果更稳。——我们称之为「分享必爆」
findings:
- name: 教学与实战的矛盾困境
  desc: '[claim] 作者宣称做培训的老师常陷入“培训占用时间→减少实战→业绩下滑→教授内容可落地性变差”的恶性循环，这是很多培训无法长期做下去的原因。'
  excerpt:
  - 我要把学员教好，就得花更多时间精力；我花更多时间精力去教学员，我一线实战的时间精力就变少了；我一线实战的时间精力变少了，我自己的业绩就得下滑，我教的东西的可落地性也就变差。
  - 结果，学员体验也差，自己项目也没做好。这也是很多培训没办法长期做下去的原因之一。
- name: 标准化交付可以替代大部分1v1需求
  desc: '[claim] 作者依据过往经验宣称，经过「直播（含录屏）+操作手册+百问百答」的组合后，能解决大部分学员问题，1v1诊断的情况很少出现。'
  excerpt:
  - 按照以往经验来说，上述已经能解决大部分问题，1v1诊断的情况很少出现。
- name: 对后进学员的提醒是无效工作
  desc: '[claim] 作者根据自己的实践发现，提醒那些不积极主动的学员几乎无效：被提醒者要么无声无息，要么敷衍式做动作，几乎无人因此做出成绩，因此取消了所有对此类学员的提醒工作。'
  excerpt:
  - 有的会在我提醒之后，完全无声无息；有的会在我提醒之后，敷衍式的做一些动作；但，几乎没有人会因为我的提醒，而做出成绩。
  - 因为他们是在「被动」的做项目。
  - 所以，后来我：几乎取消了所有对后进学员的提醒工作。这是只会感动自己的无效工作
- name: 千聊平台风控与提现风险实例
  desc: '[evidence] 作者基于自身实操案例发现：千聊虽然免费，但风控严格，金融、跨境电商、抖音培训等类目课程款项可能被冻结分阶段返还；作者自己的课程被冻结了50%，预计需约9个月才能全部提现。'
  excerpt:
  - 我自己在千聊上开过一期课程，款项被冻结了50%，剩下部分分阶段返还，预计得9个月才能全部提现。
  - 一旦你的课程属于下面这些类目，你的课程款项都有可能被冻结，分阶段返还。星座玄学、医疗、金融财经、部分教育培训行业、非课程教学、线下履约、跨境电商、抖音培训等领域。
- name: 学员意识到责任后成材率大幅提升
  desc: '[claim] 作者依据经验宣称：当学员开始意识到责任在自己身上时，其成材率会提高特别多，同时训练营运营方也会轻松特别多。'
  excerpt:
  - 相信我，当学员们开始意识到责任在他们身上的时候，他们的成材率会高特别特别多，作为开训练营的我们，也会轻松特别特别多。
  - 很多时候，大家不是执行力不行，只是没有得到正确的引导。
