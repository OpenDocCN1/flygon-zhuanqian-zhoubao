- 'no': 1
  name: 商业认知的底层逻辑 —— 从“赚钱思维”看懂商业世界
  desc: 本章从多个付费社群精华帖中提炼商业认知的底层逻辑，帮助读者建立对赚钱、交易、增长、战略等核心概念的系统性理解。通过“认知升级是变现的前提”这一主线，将看似零散的心法、策略和洞察串联为完整的商业认知框架。
  nodes:
  - 'no': 1
    name: 赚钱的本质：交易与需求满足
    desc: 用“交换”类比理解：赚钱的本质是交易，交易的本质是满足用户需求。只要满足用户需求就能赚到钱，关键在选定付款者与打动方式。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_05.md
  - 'no': 2
    name: 时代红利与个人能力的边界
    desc: 普通人赚取的绝大部分收入来自时代红利，仅有少部分是对个人能力的补偿；商业英雄是平台与市场红利的产物，因此识别红利窗口比提升能力更紧迫。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_03.md
    - paper: docs/202301-02/20230207_11.md
  - 'no': 3
    name: 流量价值公式：规模×相关性×信任度
    desc: 流量的实际价值由流量规模、交易相关性和信任度三因素乘积决定。流量规模只解决连接问题，相关性和信任度才决定交易转化。
    role: definition
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 4
    name: 能够变现的流量才叫流量
    desc: 流量像一张门票，有效期内不用掉就会变成废纸。不能变现的流量只能叫数据，因此要从第一个粉丝就开始变现。
    role: method
    src:
    - paper: docs/202301-02/20230207_05.md
  - 'no': 5
    name: 事实与观点的区分
    desc: 在商业总结与决策中必须严格区分事实与观点：事实是中性的、能用数字和证据支撑的；观点因人而异、基于立场和层次差异。
    role: definition
    src:
    - paper: docs/202301-02/20230207_04.md
  - 'no': 6
    name: 战略=选择，最重要的是不做什么
    desc: 战略的本质是取舍和选择，关键决策在于明确不做什么；目标是战略的对象但目标本身不是战略，战略应形成自始至终的指导原则并发挥自身禀赋。
    role: method
    src:
    - paper: docs/202301-02/20230207_03.md
    - paper: docs/202301-02/20230207_07.md
  - 'no': 7
    name: 被想拥有的东西绑架：增长瓶颈的怪圈
    desc: 当企业或个人被增长的预期绑架，会陷入越追求增长反而距离增长越远的恶性循环，表现为投机跟风、计算利弊、抓取资源等短视行为。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_07.md
  - 'no': 8
    name: 价值创造视角：破解增长焦虑的唯一方法
    desc: 从“我如何得到增长”切换为“我如何成为一个值得被奖赏增长的人”，需要三种勇气：面向未来而非过去、面向用户而非计算利弊、积累价值而非抓取资源。
    role: extension
    src:
    - paper: docs/202301-02/20230207_07.md
  - 'no': 9
    name: 进化论式成功学与竭尽全力原则
    desc: 进化论是唯一可靠的成功学，适应环境变化才能生存；竭尽全力是最轻松的工作方式，多数事情只要够勤奋用心就能超过大多数人。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_05.md
  - 'no': 10
    name: 财富积累四阶段与人生四阶段
    desc: 财富积累依次经历出卖劳动力、一份时间多次卖、购买他人时间、钱生钱四个阶段，不可跳跃；对应人生四阶段：初入职场扩广度、中年危机做管理、第二曲线找副业、复制商业放大。
    role: extension
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 11
    name: 杠杆效应：劳动力、自媒体与零边际成本产品
    desc: 依靠出租自己的时间很难致富，应充分利用劳动力、自媒体和复制边际成本几乎为零的产品（代码、内容等）作为杠杆。
    role: method
    src:
    - paper: docs/202301-02/20230207_03.md
    - paper: docs/202301-02/20230207_05.md
  - 'no': 12
    name: 多数情况下没有不赚钱的项目，只有不赚钱的人
    desc: 能拿出来卖且有人操作盈利过的项目不会是纯坑；项目失利多因个人认知或执行不足。商业模式不断换汤不换药，新客户群体不断新生，十年前的项目今天依然有人做得很好。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_03.md
- 'no': 2
  name: 选品方法论 —— 从“选什么”到“为什么能卖爆”
  desc: 本章围绕跨境电商和国内电商的选品核心，系统拆解“四步打造百万爆款”的选品范式。从蓝海市场定位、合规平替、品牌光环到微创新差异化，构建一套可复制的选品决策框架，让读者理解流量与转化的确定性来源。
  nodes:
  - 'no': 1
    name: 选品即运营：流量与转化的底层逻辑
    desc: 用“七分选品三分运营的反驳”切入：选品过程本身就决定了引流方法和转化卖点，好的选品必须提前解决流量和转化中的一个或两个，而不是分离地看待选品与运营。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 2
    name: 蓝海市场与蓝海平台的分类体系
    desc: 根据语言、人口、准入壁垒等特征将蓝海分为最蓝、次蓝、微蓝和不蓝四个层级：小语种发达国家、有本地入驻门槛的头部平台为最蓝；所有低价平台为不蓝。
    role: definition
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 3
    name: 蓝海方向：比蓝海品类更高一层的概念
    desc: 蓝海方向指相对垂直的产品方向（如真皮、科技材料），自带精准搜索流量，是连接宽泛蓝海和具体选品的关键，如“通过筛选日本海关关税信息发现真皮制品蓝海”。
    role: definition
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 4
    name: 第一步【找蓝海】：从市场到方向的筛选
    desc: 筛选蓝海市场和蓝海平台，进一步定位带精准搜索流量的蓝海方向，通过海关壁垒、平台搬运、材质升级等方式告别红海竞争，仅此意识已超过90%新手。
    role: method
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 5
    name: 合规平替：流量捷径与转化捷径的统一
    desc: 通过低成本材料或产品还原高端明星产品或高端材质的核心体验（90%），但价格仅为原品五分之一甚至更少，同时解决流量和转化问题。好的平替可打原价十分之一的价格，净利润仍有200元以上。
    role: method
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 6
    name: 第二步【走捷径】：确定引流与转化卖点
    desc: 合规平替或合规山寨直接对标拥有巨大搜索流量的明星产品或高端材质，以极致的性价比和精准词布局获得优势；只要产品合规有品牌，可大胆投放竞品品牌关键词广告。
    role: method
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 7
    name: 空壳品牌与品牌光环策略
    desc: 通过抢注国外知名品牌（未在该类目注册的）或策划虚构外国品牌故事快速获得品牌溢价与复购；成功的空壳品牌可做到10%复购，净利提升可达30%，但只有特定窗口期。
    role: method
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 8
    name: 第三步【加光环】：低成本获取信任与背书
    desc: 通过构建空壳品牌为产品赋予品牌力、溢价能力和复购价值；在东欧做日本品牌、在美国做欧洲品牌，本土客户查不到，故事可自由策划。
    role: method
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 9
    name: 微创新与材质套利：不创新的差异化
    desc: 微创新就是不创新——新手不适合做原创设计和痛点迭代，应基于大标品做升级式和热点嫁接式差异化，其中材质套利（如头层皮换二层皮、帆布升级真皮）是推荐路径。
    role: method
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 10
    name: 第四步【微创新】：打造护城河与延长红利期
    desc: 在选品和运营确定的基础上通过材质套利等微创新实现差异化，打造护城河并延长产品红利期；新手适合基于大标品做升级式和热点嫁接式差异化。
    role: method
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 11
    name: 追求确定性而非彩票：新手避坑指南
    desc: 成功的生意人追求确定的、可持续的赚钱模式，而非依赖偶然爆单；新手不应沉迷于“货找人”流量下的彩票逻辑，也不建议入局所有低价平台——卖家算来算去都是亏的。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_02.md
  - 'no': 12
    name: 抖音平台选品发散思维法
    desc: 借助抖音短视频平台通过四种方式发散选品思维：电子代金券搬运、热门影视剧找产品、特定场景视频选品、技能类视频找灵感；细心留意半小时可挖出十几个蓝海产品。
    role: extension
    src:
    - paper: docs/202301-02/20230207_04.md
- 'no': 3
  name: 流量获取与私域运营 —— 从“公域捕捞”到“私域养殖”
  desc: 本章系统讲解从公域引流到私域精细化运营的完整链路。核心是从“流量切片分析、流速控制、流量合并”三大运营技术出发，再到私域的单客价思维、社群精细化运营和五位一体成交飞轮，形成一套可量化的获客-留存-变现方法论。
  nodes:
  - 'no': 1
    name: 公域引流私域变现：整套商业模式的底层逻辑
    desc: 公域流量属于平台，私域流量属于自己。整套商业模式的目标是把所有公域平台的流量导入微信私域进行一对一反复成交，核心心法五句话：定位即人群、人群即内容、内容即流量、流量即转化、转化即模式。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 2
    name: 流量切片分析法
    desc: 将流量数据按横向（来源渠道、涨跌趋势、干预动作）和纵向（用户需求、行为路径、业务价值）切成片分析，才能形成可执行的运营干预动作。
    role: method
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 3
    name: 流量流速悖论与流速控制
    desc: 流量必须保持不快不慢、持续不断的流速才能产生最大价值：太快无法形成连接和停留、太慢丧失规模；核心是增加用户停留时间并保持规模。
    role: proof
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 4
    name: 交易目的论：曝光≠价值
    desc: 从交易目的看，单纯的页面曝光（UV/PV）没有价值，内容页面有曝光无反馈反而是负价值；一切运营应以交易为最终目的，无互动就没有价值，平台不给流量。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 5
    name: 流量合并：让流量主的流量为我所用
    desc: 世界上流量按所有权分两类：自己建团队获取，或整合别人的流量。谁能让流量主赚更多钱，谁就拥有其所有积累流量；世界不缺乏流量，缺少的是将流量价值最大化的方法。
    role: method
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 6
    name: 私域单客价思维：从客单价到单客价
    desc: 私域流量运营下应关注单个消费者长期贡献的总销售额（单客价），通过拉长用户生命周期和增加复购来提升整体销售额，而非仅关注单次客单价。
    role: definition
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 7
    name: 实时真实ROI：含私域产值的综合核算
    desc: 将私域流量产生的额外年产值计入投放产出后计算综合投产比：150客单价、进粉率60%、月产值8-15元时，只做直播ROI为2.5，加入私域产值后提升至3.5，月产值翻倍可达4.5。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 8
    name: 视频号直播引流：企业微信弹出与金句卡片
    desc: 利用企业微信弹出引流和金句卡片工具，在不跳出直播环境的情况下实现高效引流和转化——一小时可加到私人微信近200人。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 9
    name: 捡漏群的商业闭环与精细化运营
    desc: 通过免费/付费引流将用户导入企业微信和500人大群，以原价1-3折超高性价比商品吸引用户，通过佣金变现。核心要点：稳定企微主体、靠谱流量、精细化社群运营、规模大小、多重变现。
    role: method
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 10
    name: 演员氛围与催单节奏：社群产出的倍增器
    desc: 在捡漏群中配置30-50个“演员”（托）模仿真实用户抢购晒单，有演员和没演员的社群产出至少相差一倍；配合精推文案和4-6次递进式催单提升转化。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 11
    name: 五位一体成交飞轮
    desc: 私域一对一成交五步法：破冰（好感建立）、诊断（放大需求）、方案（成交铺垫）、信任（突破抗拒）、成交（引导下单），解决为什么必须买、为什么跟你买、为什么现在买三个问题。
    role: method
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 12
    name: 社群分销增长公式与冷启动
    desc: 收入增长=供应链强度×顶层设计×动员能力。冷启动关键不是运营而是选品，选择标品、有社交货币的产品；触达1-2个核心意见领袖即引发指数级裂变——书里有品0预算冷启动，第一个月进来10万分销员，2年做到80万+分销员、1.5亿销售额。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_08.md
- 'no': 4
  name: 内容创作与IP打造 —— 从“写什么”到“为什么爆”
  desc: 本章围绕内容创作的核心方法论，从持续输出力、内容价值金字塔、渣男思维做内容到SEO精准流量，系统讲解个人IP的打造路径。强调内容是普通人最容易建立的复利杠杆，以及如何通过“撩完就跑”和“广撒网”提升内容命中率。
  nodes:
  - 'no': 1
    name: 内容复利杠杆：普通人最容易建立的复利系统
    desc: 普通人最容易触手可及的是内容杠杆——复制边际成本为零，可重复利用、多平台推广、放大价值；写作输出是能力和价值的放大器，持续输出倒逼输入与思考。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_09.md
  - 'no': 2
    name: 内容价值金字塔：娱乐、工具与方法
    desc: 内容价值由低到高分为三层：给娱乐（情绪价值难变现）、给工具（实用性可引流）、给方法（打造个人IP壁垒最高），核心逻辑是价值交换。
    role: definition
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 3
    name: 写出爆款内容：题目与回答的解构
    desc: 文章=问题+回答。通过“输入+思考+输出”的系统化拆解，针对常见卡点逐项提供解决方案，包括选题积累、允许不完美的表达、公开承诺等方法。
    role: method
    src:
    - paper: docs/202301-02/20230207_09.md
  - 'no': 4
    name: 日更写作的复利实践
    desc: 通过565天日更写作，完成了课程、付费社群、个人咨询三个变现闭环，微信好友数增加6倍——个人样本验证了写作复利系统的有效性。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_09.md
  - 'no': 5
    name: 渣男思维做内容：撩完就跑与广撒网
    desc: 借用“渣男”的恋爱行为比喻内容创作：撩完就跑，利用峰终定律在用户情绪最高点停止让其意犹未尽；广撒网，在多个圈子多平台发内容提高命中率——垂直垂的是人群而非内容题材。
    role: method
    src:
    - paper: docs/202301-02/20230207_05.md
  - 'no': 6
    name: 峰终定律在内容创作中的应用
    desc: 如果一段体验的高峰和结尾是愉悦的，整个体验感受就是愉悦的。让用户在内容的开头和结尾体验愉悦（中间无关紧要），就会对内容产生好感。
    role: proof
    src:
    - paper: docs/202301-02/20230207_05.md
  - 'no': 7
    name: 爆款内容可复制与再利用
    desc: 爆过的内容一定可以再爆；内容创作不要靠灵感，要靠爆款模板来持续输出，这是内容生产工业化的基础认知。
    role: method
    src:
    - paper: docs/202301-02/20230207_05.md
  - 'no': 8
    name: 以结果倒推的逆向思考法
    desc: 以结果为导向逆向拆解需要的步骤，确定最小行动单元。正常流程是定位→内容→流量→产品→变现，逆向流程是变现→定位→产品→内容→流量——先找买家，再找产品。
    role: method
    src:
    - paper: docs/202301-02/20230207_05.md
  - 'no': 9
    name: 写作即社交：以内容为身份证
    desc: 写作是最好的社交活动，是个人的“身份证”——思考、经历、价值观在文章中展现，持续输出观点与价值观可筛选同频者、建立连接。
    role: extension
    src:
    - paper: docs/202301-02/20230207_09.md
  - 'no': 10
    name: 超垂直个人IP与SEO思维获取精准流量
    desc: 在极度细分领域坚持长期主义，以SEO思维获取精准搜索流量而非追逐平台爆款：布局300-500个长尾关键词、每个词写一个解决方案、多渠道发布、坚持更新——1个月后每天有人添加。
    role: method
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 11
    name: 爆款引流库：100-10-1聚焦法
    desc: 通过自建选款库、利用第三方工具、同类同品牌类推、数据化测试四种方式建立专属爆款商品库：先找出100款、每款发3-5条笔记、选出10个左右能出单的款，最终聚焦爆款。
    role: method
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 12
    name: 反向发帖（挨骂流派）：争议内容的另类变现
    desc: 在微头条通过故意发表与主流舆论相反的争议观点引发谩骂和讨论获取巨大流量收益——“别人都在骂李少莉，我们就去表扬她”，不到300字的微头条赚了400多块。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_11.md
- 'no': 5
  name: 项目操盘与变现 —— 从“最小验证”到“规模复制”
  desc: 本章聚焦副业与创业项目的实操方法论，从MVP最小成本验证、资源匹配度评估、商业拆解复制到各平台实操项目（无人直播、无货源店群、外卖CPS等），构建一套从0到1再到N的项目操盘框架。
  nodes:
  - 'no': 1
    name: MVP先卖后做：最小成本验证需求
    desc: 验证产品应优先卖想法而非做产品，通过高意向付费人数判断需求是否成立：聊了100人只有几个人买肯定有问题，20-30人购买并交预售金则该不确定因素解决，可短时间测试几十个产品。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 2
    name: 商业拆解复制副业法
    desc: 通过刷短视频发现商业案例，拆解从前端内容生产到后端导流私域及转化成交的完整流程，判断项目是否可复制（货源非独家、场景验证有需求），再通过低门槛复制快速变现。
    role: method
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 3
    name: 资源盘点与项目拆解法
    desc: 通过三步完成新项目评估：第一步盘点自身现有资源（粉丝、经验、软件、团队、案例等）；第二步拆解潜在项目所需资源；第三步评估资源匹配度，以快速启动项目。
    role: method
    src:
    - paper: docs/202301-02/20230207_09.md
  - 'no': 4
    name: 创业项目匹配度：结合自身资源而非盲目All In
    desc: 很多人严重低估已有项目而过分高估新项目；赚钱应结合自身已有资源，新项目与自身资源的匹配度（而非项目好坏）决定成功概率。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_09.md
  - 'no': 5
    name: 亏损反弹的完整案例复盘
    desc: 此前多项目累计亏损超100万，经资源梳理叠加外卖CPS与副业课程，3个月赚100万、总利润超300万——外卖CPS总盈利200万+，副业课程3个月100万+。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_09.md
  - 'no': 6
    name: 无人直播：素材准备与平台规则
    desc: 无人直播核心是准备高质量素材：录播别人内容需审查违禁词、去重处理，不能录带品牌标识的；与商家合作录制真实直播间可提升拟真度。同时需了解平台检测风险：判雷同限流一个月、原创举报限流、判录播罚100-200、批量做号罚2-3千。
    role: method
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 7
    name: 无人直播单场百万销售额
    desc: 通过自主研发硬件（伪装成摄像头的黑色盒子）规避系统检测，录制真实直播间进行无人直播带货，单场销售额达116.8万——无人直播能拉到的销售额甚至比大多数真人直播都要高。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 8
    name: 视频号无货源店群操作法
    desc: 视频号后端能挣钱的根本原因是后端商品的缺乏。关键操作：开旗舰店（买商标授权）或普通店刷入池、进入优选联盟、选品上架、拍单发货；一定要做店群，用矩阵思维对抗不确定性，最少做5个以上店铺。
    role: method
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 9
    name: 视频号店群盈利数据验证
    desc: 7个店铺日营业额合计7858元，单店平均1122元/天，毛利约30%（每天300-400元利润）；精细操作单店月利润约1W，10个店就是10W；每月有达人爆单带来额外利润（每次几万）。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 10
    name: 平台生命周期与投放策略调整
    desc: 在任何一个平台做生意需跟随平台战略阶段调整打法：增长期平台鼓励资源快速涌入，适合激进投放；存量期平台更重视生态建设，需要从自身找原因（合规、素材原创、发货时效等），否则会被清理。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 11
    name: 抖音本地生活：爆品驱动的门店从0到1
    desc: 抖音本地生活核心方法：POI加热是从业者第一课、没有爆品就不做推广（否则一切动作是在赌博）、玩转短视频矩阵和直播运营、好评率维护极其重要。
    role: method
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 12
    name: 抖音本地生活的十倍增长空间
    desc: 美团活跃商家880万家覆盖全国地级市，而抖音本地生活仅覆盖一线及新一线全部城市，二三线城市覆盖率低，存在巨大增长空间；加之2023年投放入口全面调为本地推及外卖打开，预计10倍以上增长。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_03.md
- 'no': 6
  name: 创业心态与内在比赛 —— 从“输了内在”到“赢了自己”
  desc: 本章从心理学角度切入创业成功的心态底层逻辑。核心是“内在比赛”理论——任何外在成就的取得都取决于潜意识是否真正认可目标。通过“盲目自信”“成功是成功之母”“唤醒成功体验”等心法，帮助创业者打赢内在比赛。
  nodes:
  - 'no': 1
    name: 内在比赛理论：自我一与自我二
    desc: 源自《身心合一的奇迹力量》：人有两个自我，自我一对应理性/一般自我，自我二对应感性/潜意识；任何比赛同时进行着内在比赛与外在比赛，当自我二不认可目标时就会输掉内在比赛，进而输掉外在比赛。
    role: definition
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 2
    name: 内在比赛决定外在成败
    desc: 任何长期目标与创业行为的成败，本质上取决于潜意识（自我二）是否真正认可目标；一旦输掉内在比赛，外在比赛也必然会输——李宗伟不是输给了林丹，是输给了自己。
    role: proof
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 3
    name: 盲目自信是创业者的理性选择
    desc: 创业者需要的不是理性的自我怀疑，而是近乎盲目的自信与乐观——“在我的领域我就是国王”的潜意识信念是打赢内在比赛、获得外在成功的前提；永远不要低估一个高估自己的人。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 4
    name: 成功是成功之母：反常识的核心主张
    desc: 与其相信“失败是成功之母”，不如相信“成功才是成功之母”；过去的成功体验会在潜意识中累积自信，推动后续更大成功——一个成功体验推动一个又一个成功体验。
    role: method
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 5
    name: 唤醒成功体验法
    desc: 当内心很怂、不自信时，回顾并唤醒过往成功体验来建立潜意识自信；优秀推销员开展一天工作时先找优质客户或推销容易卖的产品制造成功体验，帮助更好开展一天工作。
    role: method
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 6
    name: 俯视学习法：战略藐视战术重视
    desc: 对外学习与请教的方法论：在潜意识层面保持国王般的俯视姿态（战略上藐视），在具体请教与落实时保持学生的认真态度（战术上重视）——跪着学习的人打不赢内在比赛。
    role: method
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 7
    name: 老虎伍兹案例：失去“不可战胜”信念的代价
    desc: 性丑闻离婚后两个月丢掉世界第一头衔，几年内跌出世界排名前100；核心不是技术下降，而是潜意识和对手的潜意识都不再认为他是完美、不可战胜的人——他输掉了自己的内在比赛。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 8
    name: 李宗伟与林丹：技术之外的胜负手
    desc: 两人职业生涯交手37次，李宗伟输25次，其中两次奥运会决赛；大部分职业运动员和教练认为两人技术不分伯仲——其输球根源是潜意识层面的内在比赛落败，而非技术不足。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 9
    name: 正反馈驱动热爱：懒惰的本质
    desc: 懒惰的本质是未获得正反馈；未获正反馈源于做得不够多，而做得不够多是因为不够喜欢。两个突破口：尽快找到自己真正热爱的，或纯粹为钱冲——不别扭、不内耗。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_07.md
  - 'no': 10
    name: 战术勤奋无法逃避战略探索
    desc: 用忙碌工作麻痹自己、以战术勤奋逃避战略突破，是短期轻松但长期有毒的。动脑是累的、探索是令人恐惧的，但只有战略层面的探索和突破才能带来真正成长。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 11
    name: 执行力是值钱的、可以变现的
    desc: 持续的执行力本身具有经济价值并可被奖励变现——宝妈4个月加4000多好友的微信号被亦仁花约7W购买；作者因执行力被邀请至生财办公室，这是对执行力的奖励。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 12
    name: 做事的依据是能力与资源而非愿望
    desc: 不能基于美好愿望做事，而是基于能力和资源：老鹰可以吃到兔子，鲨鱼却吃不到——鲨鱼不应羡慕老鹰，应努力捕捉更多的鱼；先确定适合做什么，倾注一生精力做好。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_05.md
- 'no': 7
  name: 销售与成交 —— 从“卖产品”到“卖信任”
  desc: 本章从高净值客户销售的特殊性出发，讲解买家系统与卖家系统的博弈、需求与痛点的转化、以及如何抓住高净值客户“失去掌控权”的核心痛点。同时覆盖闲鱼套利、无人直播等具体销售场景中的成交技巧。
  nodes:
  - 'no': 1
    name: 需求与痛点：情绪动力是花钱的根本
    desc: 需求是理性的、缺乏情绪动力的，而痛点是带有强烈情绪驱动的；只有把客户的需求上升为痛点，才能促使其下决定购买——当客户很平静时，都是需求，不是痛点。
    role: definition
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 2
    name: 高净值客户最大痛点：失去掌控权
    desc: 高净值客户（尤其是富一代、创一代）最大的痛点是失去掌控权，恐惧源于未知；抓住这个核心痛点，客户会觉​​得你懂他，从而形成依赖——由奢入俭难，对一个一直拥有掌控权的人更可怕。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 3
    name: 买家系统与卖家系统：销售的博弈
    desc: 销售过程中买家会本能启动自我保护机制（撒谎、给希望、躲起来）以获取免费资讯，而卖家若按传统需求挖掘流程推进会在高净值客户面前受挫；破局需从让客户产生好奇开始。
    role: method
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 4
    name: 从引起好奇到形成依赖的破局方法
    desc: 先通过反问或布置功课引起客户好奇，跳出其熟悉的买家系统；再将需求上升为痛点和重塑行业概念建立权威；最后通过提问（聊小孩、谈自己、谈传承）形成长久依赖。
    role: method
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 5
    name: 成交的核心：需求、信任与购买力
    desc: 成交的核心三个要素：需求、信任、购买力。成交的前提是信任，信任的前提是能提供用户需要的价值、解决用户的需求。
    role: definition
    src:
    - paper: docs/202301-02/20230207_05.md
  - 'no': 6
    name: 闲鱼低买高卖倒爷套利法
    desc: 完整闲鱼信息差套利流程：从商业底层逻辑（低买高卖、安全边际、标品看价格、选爆品、合作思维）到市场调研（品牌货优先、标品优先、销量大优先、候选品官方价格150元以上、避开劝退类目），再到定向关键词搜索（抵账、抵债、批量出）找低价好货。
    role: method
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 7
    name: 闲鱼套利实战：三个验证案例
    desc: 三个案例验证闲鱼套利可行性：飞利浦音响5台购入1400卖出2250；360U盘20个购入300卖出550；72个欧普台灯（成本102元/个）旺季单日最高卖出9个、以149元包邮价卖出。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 8
    name: 合作思维：利他即利己的谈判逻辑
    desc: 商业谈判中将对方置于合作共赢而非对立关系，释放“利他”信号（为对方节省精力、加速资金回笼）促成交易——我和他不是对立关系，而是合作共赢。
    role: extension
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 9
    name: 发圈动力公式：社交货币驱动的分销
    desc: 发圈动力=佣金/设计交压力。产品需要具备社交货币价值，让分销员发朋友圈、私聊没有压力才能自发传播——发朋友圈介绍好书展示爱学习好妈妈形象，正向价值观驱动疯狂发圈。
    role: method
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 10
    name: 社群分销佣金分配底层逻辑
    desc: 一级佣金高则普通分销员卖货意愿强但难吸引大团长；二级佣金高则团长招商积极但普通分销员动力不足；调高二级佣金招商裂变更快，调高一级佣金平台发展更稳健。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 11
    name: 抖音爆单承接法
    desc: 视频爆了立马上传同内容视频并创建合集大概率带爆新视频；同款产品流量视频与带货视频双路并进；视频一爆立马开直播双频共振——A账号两条视频日入1.8W，B账号连续直播最高日佣3W。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 12
    name: 微头条爆文写作法
    desc: 选择社会类、法律类等有争议或共鸣的题材，掌握平台推荐机制（点击率超10%进入下一轮推送、3%互动率），编写吸引人的开头和留白提问——核心四字：争议、共鸣。
    role: method
    src:
    - paper: docs/202301-02/20230207_11.md
- 'no': 8
  name: 趋势判断与机会窗口 —— 从“看数据”到“抓红利”
  desc: 本章聚焦如何识别和把握商业机会的时间窗口。核心是通过数据推演和行业类比判断确定性窗口期，从疫情平稳期的消费复苏到平台电商的演进周期，再到热点风口的快速套利，建立一套“以史为鉴+数据验证”的趋势判断框架。
  nodes:
  - 'no': 1
    name: 确定性窗口期：从疫情数据推演商业机会
    desc: 通过香港疫情数据类比推演：大陆首轮大规模感染后有2-3个月疫情平稳期，之后才进入第二波感染峰值——2023年春天是相对确定的稳定期，是生意人与投资者看重的窗口期。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 2
    name: 春天是窗口期结论：先干个春天再说
    desc: 基于疫情平稳期共识，2023年春天可能是全年最重要的3个月窗口期；行业恢复最猛，普通人应“先干个春天再说”，否则错过这3-6个月的机会就等于放弃。
    role: extension
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 3
    name: 旅游行业复苏数据验证
    desc: 春节国内旅游人次达3亿，恢复到2019年同期88.6%；出境机票订单量上涨258%、入境预定量上涨632%、国际酒店预定量同比增长177%——旅游行业春天将爆发。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 4
    name: 健康行业带货火爆数据验证
    desc: 多个保健品品牌抖音销量过亿；诺特兰德维生素片连续两个月为抖音直播单品销量第一；养生书单、养生茶、推拿小课程都是适合普通人带货的品类。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 5
    name: 行业机会切入点：旅游/健康/餐饮三行业
    desc: 基于确定性窗口判断给出三个行业切入玩法：旅游行业做产品分销与套利（机票、酒店、景点分销）；健康行业做保健养生带货；餐饮行业紧扣春季爆发需求。
    role: method
    src:
    - paper: docs/202301-02/20230207_01.md
  - 'no': 6
    name: 平台电商发展的四个周期：以史为鉴
    desc: 基于淘系经验总结电商平台演进规律：铺货、动销、精细化、玩趋势四个阶段，可用来预判新平台（美团、TEMU）的机会——所有平台演变的底层逻辑相通，视频号与抖音历史进程何其相似。
    role: definition
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 7
    name: 美团电商冷启动与红利验证
    desc: 2022年8月末发现美团电商机会后不到两个月从0跑通并扩展到30家店，类目不同单店月利润6k-12k（零运营未优化）——验证了新平台在成长初期的红利效应和“完成比完美更重要”的执行力价值；第一家店跑通最小MVP仅花费80元。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 8
    name: 热点套利：技术基础设施决定响应速度
    desc: 面对流量热点，技术驱动的从业者用已备好的技术基础设施最小成本快速响应：注册域名公众号/小程序、接入API、做镜像站——ChatGPT热度起来后十几分钟写代码成为全网首个集成ChatGPT的公众号，消耗接近50万次请求。
    role: method
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 9
    name: 赛道热度与SEO长尾福利
    desc: 热门赛道或冷门赛道数据表现优秀时有抬价优势；SEO思维发布的内容即使3-5年后依然能享受流量福利——发了不到200篇内容后即使大半个月不更新也每天有人主动咨询。
    role: extension
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 10
    name: 信息差生意：身边被忽视的赚钱机会
    desc: 赚钱机会往往隐藏在身边，源于多数人没有发现的信息差。先有闷声发大财，网上说做什么小项目月入多少的基本已过时。案例：苏州图文专做广告牌开70家店、四线城市烤面筋月入过万、大学生朋友圈卖螃蟹年入约1.2万。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_07.md
  - 'no': 11
    name: 反期望：逆向操作也不能保证赚钱
    desc: 无论多厉害的高手，亏钱是赚钱路上不可缺少的部分——舍弃了亏钱，就意味着舍弃赚钱。严格反着做亏钱步骤也无法保证赚钱，因为“赚钱方式千差万别，亏钱方式殊途同归”。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_07.md
  - 'no': 12
    name: 需求共振与季节性机会捕捉
    desc: 商品销售与目标用户的季节性需求（如学生放暑假时对台灯需求增加）产生高峰期重合，利用此规律可提升产品销量——通过往年数据及生活经验预测6月底后迎来台灯小旺季，72个台灯旺季单日最高卖出9个。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_11.md
- 'no': 9
  name: 风险管理与合规底线 —— 从“踩坑复盘”到“稳健经营”
  desc: 本章聚焦创业与副业中的风险防控。从劳动合同合规、平台规则敬畏到投资亏钱规避，通过真实纠纷案例、失败项目复盘和平台处罚规则，帮助读者建立风险意识底线，理解合规是长期经营的前提。
  nodes:
  - 'no': 1
    name: 劳动合同有效性：合同是枪、附件是子弹
    desc: 一份有效的劳动合同必须包含岗位考核表、公司规章制度、廉洁自律协议、员工保密协议等附件；劳动合同等同一把枪，附件是子弹——枪再好没有子弹也无济于事。
    role: definition
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 2
    name: 辞退损失最小化原则
    desc: 处理被辞退员工时公司只能尽量减少损失而无法完全避免：安排会表达的人去谈、引导签署离职表（原因写个人原因且公司不盖章）、离职当天结清工资、收集证据备不时之需。
    role: method
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 3
    name: 劳动纠纷案例：三个真实赔付教训
    desc: 品牌部张先生赔付22500元、运营部徐女士赔付4500元、短视频部李女士赔付2500元——三个案例总结出劳动合同必须及时签（特别是节假日时）、建立考核表和周考核表、完善合同体系的经验。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 4
    name: 平台内容合规审核与应对
    desc: 在线内容发布平台对上传内容进行自动或人工违规判定，导致内容无法正常公开显示；应对方式包括提供离线版分发渠道、征集用户敏感内容反馈、修订后重新上传。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_10.md
  - 'no': 5
    name: 优雅亏大钱三步骤：反讽式风险警示
    desc: 系统总结保证亏大钱的三个步骤：做容易亏钱的事（选少数人能赚钱或看不懂的项目）、投入足够多的钱（加杠杆或高频交易）、坚持到底（赚钱不止盈亏钱不止损）——反向提醒读者规避这些行为。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_07.md
  - 'no': 6
    name: 非刚需项目失败：十年四次亏损的教训
    desc: 本人创业10年失败4次、负债百万靠自媒体上岸——总结出非刚需项目做不起来的结论：不够刚需链条太长，你认为推得动结果就是挣不到钱；最终是项目的本性成就人，而不是人去推动一个不够刚需的项目。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 7
    name: 没有壁垒的项目本质是付费买试错经验
    desc: 普通人能接触的互联网项目（淘宝、抖音、美团等）基本无绝对核心壁垒，任何项目培训的本质是让用户付费购买别人的试错经验和时间成本——“市面上所有项目培训的本质就是付费买别人的试错经验和时间”。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 8
    name: AI绘画小程序的放弃决策：理性止损
    desc: 因预算远超预期、无个体和公司执照、工期15-20天对热点太长、流量99%来自公众号等原因放弃AI绘画小程序开发——理性评估门槛后选择止损而非盲目投入。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_08.md
  - 'no': 9
    name: 平台风控与流量分配的本质
    desc: 通过分析小红书、抖音、快手等平台的限流逻辑、违禁词和处罚机制，可反向推导平台对流量的分配偏好，进而通过合规或规避方式获得更多流量。
    role: method
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 10
    name: TikTok无人直播的设备风险与寿命
    desc: 硬改设备手机存在10分钟至10天不等的寿命风险，卖手机是“一锤子买卖”——朋友买五六十部谷歌3手机，后因风控直播间进不去，卖手机的不给解决；基本一个员工2-3个号，电脑二手成本1500上下、手机二手600-800一部。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 11
    name: TEMU低价标品议价空间极小
    desc: TEMU小二为商家预留约10%利润空间，对报价超过1688同款较多的商家视为“没有诚意”并压价至与1688相当或更低；标品在TEMU上议价空间极小，需侧重非标类商品。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 12
    name: web3新人入局的23条建议核心
    desc: web3非常早期对普通人友好但机遇和风险并存；不要丢掉场外赚钱能力；小成本试错、不玩杠杆合约、保护资产；一个好机会重仓的收益远大于多个平庸机会轻仓；会卖比会买更重要；人声鼎沸时一定要跑——时刻牢记20字箴言：见好就收，有利必跑，狠心出货，切勿幻想，变现为王。
    role: extension
    src:
    - paper: docs/202301-02/20230207_04.md
- 'no': 10
  name: 杠杆复制与放大 —— 从“单点盈利”到“系统增长”
  desc: 本章聚焦已验证商业模式的放大路径。从盈利验证、矩阵化复制、招商加盟到杠杆效应，系统讲解如何将月入三千的号复制三十遍变成大生意，以及如何通过股权顶层设计为规模化奠定制度基础。
  nodes:
  - 'no': 1
    name: 盈利验证与放大法：先跑通再复制
    desc: 不要追求完美，用最快速度跑通盈利模型——先用最简单方式验证商业模式（完成第一单）；把月入3000的号复制30多遍不难，把盈利的事情重复做；哪怕只赚一元钱，只要能无限放大就是年赚百万的项目。
    role: motivation
    src:
    - paper: docs/202301-02/20230207_05.md
  - 'no': 2
    name: 剥离式拆解问题法：确定团队精力投入方向
    desc: 提炼客户群体最需要解决的10个大问题，每个拆解为10个小问题得到100个问题——你和团队最该花时间的地方就是这100个小问题。
    role: method
    src:
    - paper: docs/202301-02/20230207_05.md
  - 'no': 3
    name: OKR制定与执行要点
    desc: 战略坚定是最底层成功要素；KR必须直接推动O、O要有可衡量标准；用MVP验证最不确定因素；与关键角色高频同步；增加问题暴露场景和勇气——过程管理有了量化的目标和明确的时间节点，团队效率至少提升50%。
    role: method
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 4
    name: 买卖、生意、商业：三个不同层级
    desc: 自己做所有事是出卖劳动力（买卖），通过代理商/多次卖出是生意，建立可复制放大的模式才是商业——商业的本质是卖卖卖，创造客户所需的价值就可以不断去卖。
    role: definition
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 5
    name: 副业转老板：招人与建立杠杆
    desc: 副业收入增长疲惫时拿出部分收入招聘他人处理重复基础工作，释放自己精力成为老板——“一旦你习惯了花钱找人帮你干活，你就开始成为一个老板，赚钱的杠杆就有了”。
    role: method
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 6
    name: 矩阵化抖音带货：怼量驱动的爆单概率
    desc: 保证视频质量前提下大量发布拼接剪辑带货视频增加爆单概率，即使绝大多数视频流量惨淡（点赞超500的仅10个、大部分个位数点赞甚至0），纯靠怼量不开直播累计带货10万+。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 7
    name: 招商加盟的四种级别：从卖技术到卖特许权
    desc: 按品牌方操作难度加盟模式分为四个级别：轻量级（卖技术、卖料包）、中量级（卖设备、卖服务）、重量级（卖品牌）、魔鬼级（卖特许权）——魔鬼级特许权可作为资产转移和继承，最难实现。
    role: definition
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 8
    name: 招商加盟从0到1操盘法
    desc: 一套从项目分类、模式选择到准备工作的完整招商加盟起盘方法论——招商加盟是规模化增长非常有效的方法之一；不同加盟模式对品牌方要求不同，总部需提前做的准备工作也略有不同。
    role: method
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 9
    name: 健康的单店模型是加盟扩张的前提
    desc: 开放加盟前必须先跑通单店模型（单店盈利），再进行区域模型验证（多店复制），只有当模型健康且可复制时规模化扩张才具可持续性——最新评估标准：门店模型测算到位、单店财务模型健康、区域模型验证、复制性和财务模型达标。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 10
    name: 奶茶加盟模式优于直营模式
    desc: 蜜雪冰城（加盟）21年19亿利润VS奈雪的茶（直营）亏损1.5亿——加盟品牌的利润能力比直营品牌高非常多；喜茶开放加盟是顺应行业规律的正确决定。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 11
    name: 股权顶层设计四要素法
    desc: 股权设计围绕顶层控制权、进入机制、分配机制、退出机制四个核心因素展开：有操盘能力有责任心的好人拥有控制权；资金型股东溢价进入、资源型股东对赌进入、技术型股东专利进入；静态分配+动态调整；退出时间约束、约定回购原则和价格——内部不乱才能更好打市场，但不存在放之四海而皆准的方案。
    role: method
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 12
    name: 三会一层与战略稳于执行论
    desc: 公司顶层治理四类机构：股东会（最高权力机构）、董事会（决策机构）、监事会（监管机构）、高管层（执行机构）；公司经营不善或倒闭更多源于治理层而非执行层——战略既不是一朝一夕的事，也不是朝令夕改的事，战略是三会一层要做的事。
    role: extension
    src:
    - paper: docs/202301-02/20230207_06.md
- 'no': 11
  name: 认知升维与长期主义 —— 从“赚快钱”到“复利人生”
  desc: 本章作为全书的收束与升华，将视野从具体项目操作提升到长期主义的人生复利系统。通过“利他即利己”“战略发挥优势”“不流动稀缺资源优先”等认知框架，帮助读者建立可持续的个人成长与财富积累哲学。
  nodes:
  - 'no': 1
    name: 利他等于利己：越分享越幸运
    desc: 乐于分享好信息、好方法不藏私，不会因竞争受损，反而因分享获得更大回报和更多信息回流——“事实证明，你越利他，你得到的回报会更大；现在最稀缺的就是信息，这市场这么大，蛋糕分得完吗？”
    role: motivation
    src:
    - paper: docs/202301-02/20230207_06.md
  - 'no': 2
    name: 战略发挥优势法：筹码与出牌框架
    desc: 战略核心是先审视自己手里的筹码（优势），再决定怎么打牌（如何运用优势获得结果）——执行战略的核心思路是发挥优势、补齐短板；不能选择自己的劣势作为战略方向。
    role: method
    src:
    - paper: docs/202301-02/20230207_03.md
  - 'no': 3
    name: 争是不争，不争是争：贡献视角的胜利
    desc: 当你想去争权夺力，反而距离目标会变远；当你不去争，去想着怎么为系统创造价值，才能赢得最关键的信任——四爷最与众不同的策略是从争抢的视角变成贡献的视角。
    role: proof
    src:
    - paper: docs/202301-02/20230207_07.md
  - 'no': 4
    name: 不流动稀缺资源价值优先论
    desc: 应优先投入时间去积累当前环境中真正稀缺、不流动的资产（品牌、数据、人才、信任等），而非追逐无限流动的短期资源（销售额、DAU、权力）——八项规定后大量中高端白酒降价砸牌，几乎只有茅台认为品牌才是最重要资产。
    role: method
    src:
    - paper: docs/202301-02/20230207_07.md
  - 'no': 5
    name: 卓越策略师五大能力
    desc: 合格乃至卓越的策略师应具备五项综合素养：扎实的调研能力（对调研的压倒性投入就是对客户的负责）、清晰逻辑的归纳总结能力（搜尽奇峰打草稿）、把控全局的项目管理能力、让人难以怀疑的决断力、面向内外部的双重叙事能力。
    role: definition
    src:
    - paper: docs/202301-02/20230207_04.md
  - 'no': 6
    name: 商业模式画布的道术器用四层分析法
    desc: 用道、术、器、用四个层面讲清并运行所有项目：道为商业模式的本质（用XX产品/服务解决XX客户的XX痛点，赚XX钱），术为解决方案的9个关键维度（客户、价值、渠道、关系、资源、伙伴、活动、成本、收入），器为载体工具平台，用为执行力与业务流迭代。
    role: method
    src:
    - paper: docs/202301-02/20230207_04.md
  - 'no': 7
    name: 5WHY分析法与问题定义
    desc: 问题是期望与现状的差距，无论期望大于现状还是现状大于期望；连续问5个为什么探寻真实原因——从“为什么老板骂我”层层追问到“为什么闹钟没电”找到根因。
    role: method
    src:
    - paper: docs/202301-02/20230207_04.md
  - 'no': 8
    name: 合格总结三要素与发现问题原则
    desc: 合格总结必须包含三要素：总结与目标的比对、要事实不要观点、能够帮助发现问题。总结的目的是发现问题——完不成目标有问题、完成了有问题（为何不能超额）、超额完成也有问题（目标是否设太低）。
    role: method
    src:
    - paper: docs/202301-02/20230207_04.md
  - 'no': 9
    name: 产品Idea五种构思法与成功率排序
    desc: 从高到低按成功率排序的五种产品创意方法：原生idea（注意到并解决自己遇到的问题）、抄成功竞品做出差异化、分析搜索关键词找未满足需求、预付费定制产品化、生造idea（不推荐）。高成功率需满足三个条件：有真实需求、你是该领域专家、你能坚持下去。
    role: method
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 10
    name: 好名字公式与品牌传播
    desc: 好的品牌名称应满足：低触达成本+低理解成本+低记忆成本+好体验理由+低传播成本+好的延展空间——好的名字听得懂、记得住、好理解、易传播，易于扩散并形成口碑。
    role: method
    src:
    - paper: docs/202301-02/20230207_11.md
  - 'no': 11
    name: 战略非目标论与持续增长悖论
    desc: 目标是战略的对象或结果，但目标本身不是战略——“帮助一万个人赚到钱”是目标不是战略。企业成功后往往不再做当初导致成功的事情（面向未来开创、洞察用户、积累价值），一旦面对巨大增长预期便为追求增长而放弃价值创造，最终陷入瓶颈。
    role: limitation
    src:
    - paper: docs/202301-02/20230207_07.md
  - 'no': 12
    name: 成功企业抓住势能开创新品类的案例群
    desc: 巨大增长来自抓住大趋势并做开创性举动：LV借铁路普及推出轻便旅行箱、NIKE借电视转播崛起赞助球星、索尼借晶体管突破开发随身听、宝洁借广播媒体建立全国品牌——柯达因用过去定义自己而错失数码相机趋势。
    role: experiment
    src:
    - paper: docs/202301-02/20230207_07.md
