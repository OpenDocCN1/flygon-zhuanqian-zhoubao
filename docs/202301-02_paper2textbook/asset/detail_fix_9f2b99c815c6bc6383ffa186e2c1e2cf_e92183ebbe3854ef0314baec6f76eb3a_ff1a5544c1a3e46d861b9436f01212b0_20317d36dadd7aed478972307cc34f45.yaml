  - '- 破解增长焦虑的唯一方法是切换视角'
  - '**核心定义**'
  - '- 从“我如何得到增长”转变为“我如何成为一个值得被奖赏增长的人”，即从追求增长转向价值创造'
  - '**关键性质**'
  - '- 视角切换比方法论更重要：转化看待问题的方式，而非解决问题本身'
  - '- 需要三种勇气：面向未来而非面向过去；面向用户而非计算利弊；积累价值而非抓取资源'
  - '- 核心实践：识别当前环境中最稀缺、最不流动的资产（品牌、数据、人才、信任）并积累价值'
