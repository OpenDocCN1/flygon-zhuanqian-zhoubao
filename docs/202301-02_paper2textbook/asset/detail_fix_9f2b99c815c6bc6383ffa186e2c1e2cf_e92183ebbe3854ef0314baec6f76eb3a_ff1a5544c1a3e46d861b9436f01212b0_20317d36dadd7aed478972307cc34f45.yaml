  name: 战略=选择 —— 明确“不做什么”比“做什么”更重要
  points:
  - '**为什么需要这个概念？**'
  - '- 面对无限商业机会，盲目“什么都做”会导致资源分散、执行失焦'
  - '- 明确不做什么，才能集中资源在真正优势领域形成突破'
  - '- 战略的本质不是海纳百川，而是取舍与聚焦'
  - '**核心定义**'
  - '- 战略的本质是取舍和选择，其最重要的决策在于明确不做什么，而非盲目追求做更多'
  - '**关键性质**'
  - '- 战略应以获得相对优势为目的'
  - '- 战略应形成自始至终的指导原则，而非朝令夕改'
  - '- 战略需要发挥自身禀赋，不能选择自己的劣势作为战略方向'
  - '**典型例子**'
  - '- 中式快餐不与老乡鸡比标准化，而是发挥“现炒、人情味”差异优势'
  - '**边界条件**'
  - '- 明确不做什么的前提是你已清楚自己的禀赋和优势所在，否则无从取舍'
  - '- 战略选择需伴随明确的目标，目标本身不是战略'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/202301-02/20230207_07.md
    role: improve
  excerpts:
  - 什么是战略呢？就是选择。选择，其最重要的就是不做什么，而不是做什么。
  - 战略目的是让你能获得优势或者获得相对优势。
  - 战略应该形成一种自始至终的指导原则。
  - 战略需要发挥你的禀赋。你要是跟老乡鸡、南城香比卫生、标准化、品牌力，那就错了。你应该提升你的人情味、现炒等等。这就是不能选择你的劣势来做战略方向。
