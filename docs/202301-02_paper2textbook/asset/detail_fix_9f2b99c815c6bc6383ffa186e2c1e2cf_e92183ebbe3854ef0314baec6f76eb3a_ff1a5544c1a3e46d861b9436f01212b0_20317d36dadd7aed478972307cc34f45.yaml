  name: 事实与观点 —— 给商业判断装上“客观滤镜”
  points:
  - '**为什么需要这个概念？**'
  - '- 商业总结与决策中，主观感受与客观事实常被混为一谈，导致误判'
  - '- 观点因人而异、无法作为共同决策基础；事实才具备可验证性'
  - '- 需要一套严格的区分标准来提升总结与决策质量'
  - '**核心定义**'
  - '- 事实是中性的、可以用数字和证据支撑的客观陈述；观点是因人而异的立场和层次差异的表达'
  - '- 合格的总结必须“要事实，不要观点”'
  - '**关键性质**'
  - '- 事实具备可验证性（如“我完成了83%的年度业绩目标”），观点无法统一衡量（如“我今年业绩不好”）'
  - '- 区分事实与观点是科学总结、5WHY分析和商业模式拆解的共同前提'
  - '- 可用于评估信息质量：缺乏事实支撑的主张应谨慎采信'
  - '**典型例子**'
  - '- “我今年业绩不好”是观点；“我完成了83%的年度业绩目标”是事实'
  - '- 10摄氏度气温，常年住0度地区的人觉得“好温暖”，常年住20度地区的人觉得“太冷了”——同一事实，不同观点'
  - '**边界条件**'
  - '- 事实与观点的界限在某些模糊场景下并不绝对（如预测性描述），需按可验证性判断'
  - '- 观点并非毫无价值，而是不能作为决策的客观依据，可结合多个观点交叉验证'
  sources:
  - paper: docs/202301-02/20230207_04.md
    role: origin
  excerpts:
  - 我们一定要知道自己和对方说出口的每一句话，到底哪一句是观点，哪一句是事实。我今年业绩做的不好，这句话是观点还是事实？----观点！
  - 只有中性的，能够用数字和证据支撑的才是事实，例如：我今年完成了83%的年度业绩目标。
  - 譬如10摄氏度的气温，对于一个常年生活在0摄氏度地方的人来说，会觉得'好温暖'；可对于一个常年生活在20摄氏度地方的人来说，会觉得'太冷了'。此时，假如双方进行辩论的话，就互相会觉得对方在胡说八道。
- 'no': 17
  name: 5WHY分析法 —— 连续追问剥开问题的“洋葱皮”
  points:
  - '**为什么需要这个概念？**'
  - '- 面对问题（期望与现状的差距），停留在表面原因会错过根治机会'
  - '- 简单归因（如“老板对我有意见”）会引发情绪化误判'
  - '- 需要一种结构化方法逐层深挖，找到根因'
  - '**核心定义**'
  - '- 问题是期望与现状的差距，无论期望大于现状还是现状大于期望'
  - '- 5WHY分析法：遇到问题时，连续用5个“为什么”来探寻其发生的真实原因'
  - '**关键性质**'
  - '- 从表面现象（为什么老板骂我→因为我迟到）层层下钻到根本原因（为什么闹钟没电→因为我忘记换电池）'
  - '- 追问的深度不限于5次，而是直到找到可操作的根因'
  - '- 与“事实与观点”结合使用效果最佳：先区分事实，再对事实层层追问'
  - '**典型例子**'
  - '- 1WHY：为什么老板骂我？因为我今天迟到了→2WHY：为什么我会迟到？因为我起床晚了→3WHY：为什么会起床晚？因为闹钟没响→4WHY：为什么闹钟没响？因为它没电了→5WHY：为什么闹钟没电？因为我忘记换电池'
  - '**边界条件**'
  - '- 该方法的有效性依赖回答者对真实情况的坦诚认知，回避或粉饰会让追问失效'
  - '- 某些系统性问题的根因超出个人可控范围，需结合组织/环境因素综合判断'
  sources:
  - paper: docs/202301-02/20230207_04.md
    role: origin
  excerpts:
  - 第一个方法，叫5WHY分析法，意思是每当遇到问题时，都可以连续用5个WHY来探寻其发生的真实原因。
  - 1WHY：为什么老板骂我？因为我今天迟到了。2WHY：为什么我会迟到？因为我起床晚了。3WHY：为什么会起床晚？因为天杀的闹钟没响。4WHY：为什么闹钟没响？因为它没有电了。5WHY：为什么闹钟没电？因为我忘记了换电池。
  - 1、期望和现状的差距，就是问题。不管是期望大于现状，还是现状大于期望。
- 'no': 18
  name: 商业模式画布的道术器用 —— 拆解项目的“四层透视镜”
  points:
  - '**为什么需要这个概念？**'
  - '- 面对一个商业项目，大多数人只看到表面（做什么），却看不清其运作逻辑（为什么能赚钱）'
  - '- 需要一套系统工具将项目的商业本质、解决方案、工具载体和执行落地分层拆解'
  - '**核心定义**'
  - '- 用“道、术、器、用”四个层面讲清楚并运行所有项目'
  - '- 道为商业模式的本质：用XX产品/服务，解决XX客户的XX痛点，赚XX钱'
  - '- 术为解决方案的9个关键维度（客户、价值、渠道、关系、资源、伙伴、活动、成本、收入）'
  - '- 器为载体工具平台，用为执行力与业务流迭代'
  - '**关键性质**'
  - '- 道是根基：如果道的层面存在根本问题（伪需求），术器用做得再好也难以成功'
  - '- 术的九维度可完整刻画一个项目的商业逻辑，所有项目均可套用'
  - '- 器与用决定落地效率：工具选择和执行力度直接影响商业模式的实现程度'
  - '**典型例子**'
  - '- 用该工具拆解《生财有术项目精选》中的所有项目，逐个绘制商业模式画布，验证其普适性'
  - '**边界条件**'
  - '- 该方法适合“项目篇”而不适合“技能篇”（技能类内容难以用商业模式画布拆解）'
  - '- 需要投入相当的时间和精力才能完成高质量拆解，并非走马观花'
  sources:
  - paper: docs/202301-02/20230207_04.md
    role: origin
  excerpts:
  - 1、道的层面： 一句话阐述商业模式：我用一个XX产品/服务，解决了XX客户的XX痛点，赚XX钱。
  - 2、术的层面： ①解决谁的问题，一个企业（产品）想要接触和服务的不同人群或组织； ②解决什么问题，为客户创造价值的系列产品和服务； ③怎么让用户找到，如何接触和沟通客户来传递其价值主张；
    ④怎么和用户打交道，公司与特定客户群体建立的关系类型； ⑤我是谁，我有什么，商业模式有效运转所必需的最重要因素； ⑥谁能帮我，商业模式有效运作所需的供应商与合作伙伴的网络；
    ⑦我要做什么，确保其商业模式可行企业必须做的最重要的事情； ⑧我要付出什么，运营商业模式所引发的所有成本； ⑨我能得到什么，从客户群体中获得的收入；
  - 3、器的层面：承载上述9个板块的有没有更便捷的工具；
  - 4、用的层面：执行力、业务流的迭代； 为了确定这个工具，是否适合生财，花了6个小时，看完了《生财有术项目精选》的所有项目，并且将所有项目的商业模式画布都画出来。
