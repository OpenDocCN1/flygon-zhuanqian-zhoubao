  excerpts:
  - 做股权顶层设计时考虑的核心因素，还是顶层控制权、进入机制、分配机制、退出机制。内部不乱才能更好打市场，但不存在放之四海而皆准的方案。
  - √：有操盘能力、有责任心的好人拥有公司的控制权…进入机制：资金型股东溢价进入，资源型股东对赌进入，技术型股东专利进入…分配机制：静态分配+动态调整…退出机制：退出时间约束、约定回购原则、约定回购价格。
  - 创始人身份为何是最重要的维度：它代表谁承担最大风险和兜底责任，谁就最有控制权。公司对外只能有一个声音，创始人身份必须从开始极度明确。
  - 劳动合同就等于是一把枪，而这些附件，就是子弹。你的枪再好，没有子弹也是无济于事。
  - 按照品牌方操作的难度，加盟模式一共分为四个级别六种类型：轻量级、中量级、重量级和魔鬼级。魔鬼级的加盟是最难实现的一种，我称之为卖特许权。
  - 好的名字=低触达成本+低理解成本+低记忆成本+好体验理由+低传播成本+好的延展空间
- 'no': 11
  name: 内在比赛理论 —— 赢了自己，才能赢世界
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常陷入“战术勤奋掩盖战略懒惰”，外在努力掩盖内在恐惧、怀疑、不配得感'
  - '- 素材引用《身心合一的奇迹力量》：自我一（理性/表意识）vs 自我二（潜意识/感性），外在比赛输赢取决于内在比赛'
  - '- 李宗伟非输给林丹、老虎伍兹非输给对手，均是输给自己的潜意识“不可战胜”信念崩塌'
  - '**核心定义**'
  - '- 内在比赛：潜意识（自我二）是否真正认可目标、相信配得、允许成功'
  - '- 外在比赛：市场竞争、业绩指标、融资谈判、团队管理等显性对抗'
  - '- 核心因果：输掉内在比赛 → 必然输掉外在比赛；赢内在 → 外在大概率赢'
  - '**关键性质**'
  - '- 盲目自信是理性选择：创业者需“在我的领域我就是国王”的潜意识信念，永远不要低估一个高估自己的人'
  - '- 成功是成功之母：过去成功体验在潜意识累积自信，推动后续更大成功（反“失败是成功之母”）'
  - '- 唤醒成功体验法：怂/不自信时，主动回顾过往成功（哪怕微小），重建潜意识自信锚点'
  - '- 俯视学习法：战略上俯视（我是国王来学）、战术上重视（跪着学细节），跪着学习的人打不赢内在比赛'
  - '**典型例子**'
  - '- 老虎伍兹：丑闻离婚后潜意识“不可战胜”崩塌，两个月丢世界第一、几年跌出前100，技术未变但信念碎了（20230207_01.md）'
  - '- 李宗伟vs林丹：37次交手输25次，技术不分伯仲，核心是潜意识层面内在比赛落败（20230207_01.md）'
  - '- 优秀推销员：一天工作先找优质客户/卖易销品制造成功体验，唤醒自信再攻硬骨头（20230207_01.md）'
  - '- 作者执行力变现：4个月加4000好友微信号被亦仁7万收购、因执行力被邀请生财办公室（20230207_03.md）'
  - '**边界条件**'
  - '- 非盲目乐观：盲目自信建立在“能力圈内/已验证模型/可控风险”基础上，而非无视现实的妄想'
  - '- 需配合外在实操：内在比赛赢了只是“入场券”，外在仍需MVP验证、流量获取、交付运营等硬功夫'
  - '- 幸存者偏差：素材多为成功者复盘，失败者同样可能“盲目自信”却因能力/运气/时机不足而死，不可幸存者偏差'
  - '- 心理防御机制：过度“成功体验唤醒”可能掩盖真实风险信号，导致“确认偏误”拒绝止损转向'
  - '...'
  sources:
  - paper: 20230207_01.md
    role: origin
  - paper: 20230207_03.md
    role: apply
  - paper: 20230207_07.md
    role: improve
  excerpts:
  - 人有两个自我，自我一对应理性/一般自我，自我二对应感性/潜意识；任何比赛同时进行着内在比赛与外在比赛，当自我二不认可目标时就会输掉内在比赛，进而输掉外在比赛。
  - 李宗伟不是输给了林丹，是输给了自己。
  - 创业者需要的不是理性的自我怀疑，而是近乎盲目的自信与乐观——“在我的领域我就是国王”的潜意识信念是打赢内在比赛、获得外在成功的前提。
  - 与其相信“失败是成功之母”，不如相信“成功才是成功之母”；过去的成功体验会在潜意识中累积自信，推动后续更大成功。
  - 当内心很怂、不自信时，回顾并唤醒过往成功体验来建立潜意识自信；优秀推销员开展一天工作时先找优质客户或推销容易卖的产品制造成功体验。
  - 对外学习与请教的方法论：在潜意识层面保持国王般的俯视姿态（战略上藐视），在具体请教与落实时保持学生的认真态度（战术上重视）。
  - 性丑闻离婚后两个月丢掉世界第一头衔，几年内跌出世界排名前100；核心不是技术下降，而是潜意识和对手的潜意识都不再认为他是完美、不可战胜的人。
  - 执行力是值钱的，执行力是可以变现的...亦仁大概花了 7W 买了她坚持 4 个月加了 4000 多好友的微信号。
- 'no': 12
  name: 战略即选择 —— 最重要的是决定“不做什么”
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常陷入“机会主义”陷阱：见好项目就想做、见新平台就想上、见竞品就想跟，导致资源分散、战略模糊、执行变形'
  - '- 素材核心主张：战略的本质是取舍，关键决策在于明确“不做什么”，而非贪多求全'
  - '- 目标≠战略：“帮助一万人赚钱”是目标，不是战略；战略是贯穿始终的指导原则（如强加成本、生态位补充）'
  - '**核心定义**'
  - '- 战略三段论：①目的=获得相对优势 ②形式=自始至终的指导原则 ③基石=发挥禀赋（劣势不能做战略方向）'
  - '- 战略发挥优势法：先审视手中筹码（优势/资源/能力）→ 再决定怎么打牌（如何用优势获结果）→ 补齐短板'
  - '- 战略稳于执行：战略非朝令夕改、非一朝一夕，是“三会一层”（治理层）的事，执行层只管落地'
  - '**关键性质**'
  - '- 视角切换破局：从“追求增长”→“价值创造”，需三种勇气：面向未来非过去、面向用户非利弊、积累价值非抓取资源'
  - '- 不流动稀缺资源优先：销售额/DAU/权力是流动无限的；品牌/数据/人才/信任是稀缺不流动的，优先积累后者'
  - '- 重构成功归因：复盘不问“坚持了什么”，而问“抓住了什么机会/打破了什么惯例”，避免用过去定义未来'
  - '**典型例子**'
  - '- 苏联/美国冷战：美“强加成本”战略（毒刺导弹/压油价/星球大战）迫使苏联高防守成本+造血破坏→拖垮苏联（20230207_07.md）'
  - '- LV/耐克/索尼/宝洁：抓住大趋势（铁路/电视/晶体管/广播）做开创性举动（旅行箱/赞助球星/随身听/全国品牌）实现巨大增长（20230207_07.md）'
  - '- 宜家误读：对标学“提高停留时长”却忽略其核心逻辑“解决搬入陌生城市一天拥有一家”的需求（20230207_07.md）'
  - '- 茅台八项规定后：中高端白酒降价砸牌，唯茅台守品牌心智（稀缺不流动资产）→ 长期价值最大化（20230207_07.md）'
  - '- 柯达陷阱：自认成功源于“坚持成像品质”，实则源于“低价便捷相机抓住大众化趋势”，用过去定义自己错失数码趋势（20230207_07.md）'
  - '**边界条件**'
  - '- 战略需随环境演进：指导原则不变，但具体路径/战术须随平台周期/技术范式/竞争格局动态调整'
  - '- 中小微企业战略=生存策略：早期战略往往是“活下去/跑通MVP/找到PMF”，而非宏大叙事，切勿过度战略化'
  - '- 执行偏差放大战略错误：战略微小偏差，经执行层层放大后变成致命伤，需“三会一层”治理机制纠偏'
  - '- 信息不对称下的决策：创业者常在信息不全时做战略抉择，需建立“低成本试错/快速反馈/果断止损”纠错机制'
  - '...'
  sources:
  - paper: 20230207_03.md
    role: origin
  - paper: 20230207_06.md
    role: improve
  - paper: 20230207_07.md
    role: apply
  excerpts:
  - 什么是战略呢？就是选择。选择，其最重要的就是不做什么，而不是做什么。
  - 战略就是先审视自己手里的筹码，也就是自己的优势，然后再决定自己怎么打牌，也就是如何运用自己的优势来获得你想要的结果。
  - 战略，既不是一朝一夕的事，也不是朝令夕改的事。战略，是三会一层要做的事。
  - 我发现，破除增长焦虑唯一的方法，就是怎么从追求增长的视角，切换成价值创造的视角。从一个'我如何得到增长'，变成'我如何成为一个值得被奖赏增长的人'。
  - 真正要去摆脱这种视角，最难的不在于方法论，而是 3 种'勇气'：面向未来而非面向过去的勇气；面向用户而非计算利弊的勇气；积累价值而非抓取资源的勇气。
  - 实际上，这也是一个奇怪的现象，我们花费了太多的精力去抓住无限的、流动的东西，而非关注真正稀缺的、不变的东西。
  - 邬思道提出了违反共识却真正行之有效的关键战略，只有八个字'争是不争，不争是争'。
  - LV 率先开发出轻便、耐磨损的旅行箱，抓住了 19 世纪欧洲火车普及的机会；NIKE 通过赞助顶级球星的方式抓住了电视转播崛起的机会... 柯达认为自己成功的重要法门是坚持成像的品质和性能...
    它最初成功的法门并不是高品质，而是抓住技术趋势开发适合更多人群的便捷性产品。
- 'no': 13
  name: 平台周期与红利窗口 —— 在“高流量低商业化”期入场
  points:
  - '**为什么需要这个概念？**'
  - '- 所有平台遵循相同演进规律：铺货期→动销期→精细化期→玩趋势期，早期红利最大、门槛最低、竞争最弱'
  - '- 创业者常错过红利期（观望/犹豫/不懂规则），或在存量期硬冲（成本高/规则严/ROI低），需建立“平台钟”认知'
  - '- 素材总结：视频号似抖音、美团似淘系、TEMU似拼多多，以史为鉴可预判新平台机会窗口'
  - '**核心定义**'
  - '- 四周期模型：①铺货期（鼓励上架、宽进宽出、流量免费分发）②动销期（考核销量/动销率、清僵尸链接）③精细化期（重服务/体验/合规/内容质量、清洗劣币）④玩趋势期（玩直播/短视频/私域/品牌/出海、头部固化）'
  - '- 红利窗口：通常在铺货期-动销期交界（高流量、低商业化、规则宽松），普通人最易切入'
  - '- 确定性窗口期：如2023春节后2-3个月疫情平稳期（类比香港数据），为全年最关键3-6个月机会窗（20230207_01.md）'
  - '**关键性质**'
  - '- 完成比完美重要：美团电商80元跑通MVP、2个月30店，验证“新平台初期红利+极速执行”组合拳（20230207_11.md）'
  - '- 平台战略跟随：增长期激进投放/抢占心智；存量期合规深耕/精细化运营/找自身原因，否则被清理（20230207_08.md）'
  - '- 技术基建决定响应速度：ChatGPT热点十几分钟上线公众号/小程序/镜像站，消耗50万请求，基建好才能接得住风口（20230207_06/11.md）'
  - '- SEO长尾福利：SEO思维内容3-5年后仍享流量福利，<200篇内容大半月不更新仍日有咨询（20230207_11.md）'
  - '**典型例子**'
  - '- TikTok睡播：平台早期高流量低商业化，单小时均100美金、峰值在线4.2万、新号2天破500，简陋直播间也能破万在线（大纲Ch6节点2）'
  - '- 美团电商：8月发现→10月30店、单店月利6-12k（零运营）、百货类目前全国前300（20230207_11.md）'
  - '- 抖音本地生活：覆盖一二线、二三线空白、外卖打开+本地推上线→预计10倍增长（20230207_03/06.md）'
  - '- AI绘画/ChatGPT风口：技术基建就绪者十几分钟接入、抢占搜索首名、吃尽红利（20230207_06/11.md）'
  - '**边界条件**'
  - '- 红利期不可预测长度：可能3个月、可能3年，赌周期长短极难，需“快进快出/利润再投资/建立护城河”对冲'
  - '- 平台规则突变风险：算法调整/政策收紧/接口关停/封号潮，单一平台依赖极危险，需多平台矩阵+私域沉淀'
  - '- 伪红利陷阱：平台补贴/活动/流量扶持看似红利，实则收割商家（如TEMU压价至1688持平、标品议价空间极小（20230207_11.md））'
  - '- 团队/资源跟不上：红利期需极速扩张（招人/投流/开店/备货），组织能力/现金流/供应链跟不上会噎死'
