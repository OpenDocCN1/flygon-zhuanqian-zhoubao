- 'no': 14
  name: 风险管理与合规底线 —— 优雅止损、合规经营、避开“优雅亏大钱”陷阱
  points:
  - '**为什么需要这个概念？**'
  - '- 创业/副业充满不确定性，无风控意识必死无疑；素材系统梳理：劳动法合规、平台规则敬畏、投资止损、项目甄别、合同规范'
  - '- “优雅亏大钱三步骤”反讽揭示核心死因：做不懂的事+加杠杆/重仓+不止损不止盈 = 必亏大钱'
  - '- 合规非成本、是资产：劳动合同附件齐全（考核/制度/保密/廉洁）可避赔2.25万+；平台合规避封号、流量可持续'
  - '**核心定义**'
  - '- 劳动合同有效性：合同是枪，附件（考核表/规章/廉洁/保密）是子弹，缺一不可（20230207_08.md）'
  - '- 辞退损失最小化：会谈技巧/离职表签署（个人原因不盖章）/当天结清工资/证据固化，只能减损不能免责'
  - '- 平台风控本质：平台通过限流/违禁词/处罚分配流量偏好，反向推导可获合规/规避策略（20230207_11.md）'
  - '- 非刚需项目不做：10年4次失败/负债百万教训，链条太长推不动，项目本性成就人（20230207_06.md）'
  - '- 无壁垒项目=买试错经验：普通人能碰的项目几乎无绝对壁垒，培训本质=付费买别人试错时间（20230207_03/06.md）'
  - '**关键性质**'
  - '- 止损是策略非认输：AI绘画小程序因预算/执照/工期/流量风险理性放弃，非盲目坚持（20230207_08.md）'
  - '- 克制止损：直播有警告/断播即停、被罚当天不播、见好就收，账号>单场流量（20230207_03/06/11.md）'
  - '- 反期望定理：反着亏钱步骤做也不保证赚钱，亏钱是赚钱路上必经环节，舍弃亏钱=舍弃赚钱（20230207_07.md）'
  - '- Web3生存20字箴言：见好就收、有利必跑、狠心出货、切勿幻想、变现为王（20230207_04/11.md）'
  - '**典型例子**'
  - '- 劳动纠纷三案例：品牌部赔22500、运营部赔4500、短视频部赔2500 → 总结：及时签合同、建周考核表、完善合同体系（20230207_08.md）'
  - '- 非刚需失败：作者10年创业4败/负债百万靠自媒体上岸，总结“非刚需不做”（20230207_06.md）'
  - '- AI小程序放弃：预算超期/无执照/工期长/流量99%靠公众号 → 理性止损（20230207_08.md）'
  - '- TikTok无人直播硬改机：10分钟-10天寿命、卖手机一锤子买卖、朋友买5-6十部谷歌3风控进不去无售后（20230207_11.md）'
  - '- TEMU标品议价极小：小二预留10%利润、超1688视为无诚意压价、需侧重非标品（20230207_11.md）'
  - '**边界条件**'
  - '- 合规成本随规模上升：小微团队易忽视合规（成本高/不懂法），规模化后合规部门成标配，早布局低成本'
  - '- 灰色地带收益高但寿命短：无人直播/搬运/擦边/诱导分享等玩法，平台收紧即归零，不可作为核心长期业务'
  - '- 法律滞后于创新：新模式（如Web3/直播带货/社群分销）法规空白期，合规边界模糊，需自律+法律顾问双重保障'
  - '- 风控过度=机会成本：过度规避风险导致错失红利窗口，需在“合规底线”内“激进试错”，平衡攻防'
