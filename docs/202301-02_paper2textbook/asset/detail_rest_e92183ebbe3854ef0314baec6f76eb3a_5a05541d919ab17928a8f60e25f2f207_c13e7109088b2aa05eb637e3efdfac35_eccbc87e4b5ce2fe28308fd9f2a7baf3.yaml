learning_targets:
- 理解“卖空气”与“软文先行”作为最小化产品验证方法的底层逻辑
- 掌握用“复述问题”建立用户信任的内容策略与写作要点
- 了解“非规范化生产”如何降低个人开发者的试错成本
- 掌握“商业项目拆解”的八步法及可复制性判定标准
- 能运用“私域前端流量”思维判断副业项目的成败关键点
concept_map:
- 产品孵化方法论
- ├── 反直觉起点：软件的本质就是软文
- │   ├── 核心定义：感知形态是软文，可反推开发流程 —— P001
- │   ├── 关键性质：文案即产品、零代码交付（找现成软件替代） —— P001
- │   └── 边界条件：需真实需求支撑，否则积累恶评 —— P001
- ├── 最小化验证：卖空气
- │   ├── 核心定义：用模型/截图/预售页制造假象先收钱 —— P001
- │   ├── 关键性质：零成本验证、预售导向、快速迭代 —— P001
- │   └── 边界条件：需有交付意图，不可无限延期，适用轻量产品 —— P001
- ├── 信任建立：复述问题
- │   ├── 核心定义：罗列用户症状让其产生“这次找对了” —— P001
- │   ├── 关键性质：共鸣优先、低成本高回报、普适性强 —— P001
- │   └── 边界条件：只建立初步信任，必须有后续价值交付 —— P001
- ├── 快速产出：非规范化生产（野路子）
- │   ├── 核心定义：用低门槛工具在1周内做出可演示模型 —— P001
- │   ├── 关键性质：成本优先、模型即产品、工具平民化 —— P001
- │   └── 边界条件：只适合小而简单的产品，后续需回归质量 —— P001
- └── 系统复制：商业项目拆解
- '    ├── 拆解法：八步法（找项目→拆流量→拆转化→拆交付→评复制→定策略→搭团队→强执行） —— P002'
- '    ├── 可复制性判定：爆得非偶然、货源非独家、需求已验证 —— P002'
- '    └── 底层原则：后发制人、私域前端流量优先 —— P002'
life_analogy:
- 想象做副业产品就像**开一家“概念餐厅”**：
- '- **卖空气** = 先在门口贴出招牌菜海报，有客人点单才进厨房炒菜'
- '- **软文先行** = 菜单不是给厨房看的，而是给客人看的点菜指南，菜品（代码）反而可以后做'
- '- **复述问题** = 服务员先复述“您是不是想吃辣但怕上火？”，客人觉得“这服务员懂我”'
- '- **非规范化生产** = 用一口大锅先炒出个大概味道，让客人尝一口，认可了再精致摆盘'
- '- **商业项目拆解** = 看到隔壁餐厅生意好，不偷它的菜谱，而是拆出“地段引流→招牌菜转化→后厨外包”的经营链路'
- 就像聪明的老板不会先装修再等客，而是先放出菜单测试是否有客人愿意下单，再看要不要真备原料。
summary:
- concept: 卖空气
  desc: 在产品不存在时制造假象先收钱，用预售验证需求，卖不出就止损
- concept: 软件的本质就是软文
  desc: 软件的最终感知形态是推广文字而非代码，可反推开发流程甚至不开发
- concept: 复述问题建立信任
  desc: 通过精准罗列用户症状，让用户产生“这次找对了”的共鸣，建立初步信任
- concept: 非规范化生产（野路子）
  desc: 用低门槛工具快速捏出可演示的模型，核心是低成本、高性价比
- concept: 商业项目拆解
  desc: 把赚钱的同行拆成流量、转化、交付的可复制零件，后发制人地复制
- concept: 私域前端流量
  desc: 私域的痛点不在内部运营，而在前端是否打开稳定流量入口
exercises:
- 'no': 1
  title: 卖空气实操：设计你的预售验证方案
  contents:
  - 想象你想做一个‘朋友圈访客记录’工具（实际上多数平台无此功能）：
  - 1. 列出你会用哪些‘道具’制造产品已存在的假象（截图？H5演示？预售页？）
  - 2. 为这个不存在的产品撰写一段200字左右的软文，注意要包含‘复述问题建立信任’的手法（用户痛点是什么？）
  - 3. 规划你的验证指标：多少人在一天内咨询算需求成立？多少天无反馈就放弃？
  - 4. 思考边界：什么情况下你打算‘跑路’？什么情况下你会寻找现成替代软件兑现承诺？
  - 讨论：卖空气与诈骗的底线在哪里？
- 'no': 2
  title: 商业拆解八步法：拆解一个身边的副业项目
  contents:
  - 选取你在抖音/小红书上刷到的一个你觉得‘好像挺赚钱’的账号：
  - 1. 找项目：该账号主页介绍是什么？卖货/卖课/卖服务？
  - 2. 拆流量：它靠什么内容引流？是固定形式还是投放？有没有矩阵？
  - 3. 拆转化：从看到视频到付费，中间经历了哪几步？价格锚点是什么？
  - 4. 拆交付：产品是实物/虚拟/课程？客单价多少？同行是否做了半年以上？
  - 5. 评估可复制性：货源是否独家？爆红是否偶然？消费场景是否被验证？
  - 6. 若你要复制，写出你的差异化微调点（赛道/渠道/价格）
- 'no': 3
  title: 复述问题写作：消除用户的戒备心
  contents:
  - 假设你是一个卖‘副业培训课’的商家，目标用户是月薪5000想搞副业的上班族：
  - 1. 写出目标用户的三重痛点（如：不知道做什么副业、做了没流量、有流量不转化）。
  - 2. 用复述问题法写一段100字左右的引流文案，要求用户读完内心OS是‘这次找对了！’
  - 3. 对比写法A（直接推销课程有多好）与写法B（复述痛点），判断哪种更容易引发咨询，并说明理由。
  - 4. 思考边界：复述问题法有没有可能变成‘制造焦虑’？划分二者的依据是什么？
- 'no': 4
  title: 六维模型评估：给‘卖空气’项目打分
  contents:
  - 结合第1章学过的六维模型（流量/销转/交付/客单/毛利/复购），对‘卖空气’这种验证方式做一次体检：
  - 1. 你认为‘卖空气/预售’这种方式，在流量效率、销转效率、交付效率三个维度上分别能打几分（1-5）？为什么？
  - 2. 在后三个财务维度上，它天然适合高客单价还是低客单价？为什么？
  - 3. 结合‘软件本质是软文’的论点，论证为什么先写软文能提升‘销转效率’？
  - 4. 六维中哪一项是‘卖空气’模式最大的短板？它会如何影响项目的可复制性？
