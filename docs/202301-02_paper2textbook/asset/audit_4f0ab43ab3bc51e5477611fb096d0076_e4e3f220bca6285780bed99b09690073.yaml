unsupported_claims:
- location: '35.6'
  claim: 空壳品牌三种操作形态（抢注复制、跨类目新品、虚构故事）
  reason: 素材中仅提到空壳品牌三种形态，但未详细展开‘抢注国外品牌复制全系’的具体案例细节（如koolaburra被ugg收购后的操作细节），且‘虚构故事’在素材中表述为‘策划国外品牌故事和品牌形象’，并未明确等同于‘虚构故事’这一表述，存在夸大解读。
- location: '35.7'
  claim: 微创新=不创新的核心悖论，新手不要原创设计/痛点迭代
  reason: 素材中‘微创新其实就是不创新’表述为作者个人观点，并非公认定义；且‘新手不适合原创设计/痛点迭代’为经验之谈，书中将其表述为确定性结论，缺乏数据支撑，属于观点升级为论断。
- location: '35.10'
  claim: 成功老板没有一个主战场在TikTok，TikTok广告ROI极不稳定
  reason: 素材为作者2023年2月主观判断（‘我接触的大卖’、‘结合TK广告一级代理商数据’），非行业普查数据；且书中将其表述为确定性事实，忽略TikTok
    Shop后续美区闭环、全托管模式成熟等变化，存在时效性失真。
- location: '35.11'
  claim: Temu/拼多多跨境仅适合头部工厂全托管，新手禁入
  reason: 素材中作者坦言‘我看不懂，再见’，并非基于数据分析得出结论；书中将其上升为平台判断标准，属于个人偏见代替客观分析。
- location: '35.12'
  claim: 抖音发散法半小时挖十几个蓝海产品，四大信息差来源
  reason: 素材为饼饼个人经验分享（‘半个小时挖出十几个蓝海产品完全没有问题’），非可复现标准动作；书中将其标准化为教学SOP，忽略‘商业敏感度’前置能力要求，存在幸存者偏差。
