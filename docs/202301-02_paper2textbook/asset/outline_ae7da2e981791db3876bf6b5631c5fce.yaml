- 'no': 1
  name: 副业案例集 —— 从“经验分享”到“可复用的知识库”
  desc: 本章以“龙哥赚钱周报”为样本，讲解如何将分散的实操文章汇编成结构化的知识索引，并解析其组织逻辑与价值所在。
  nodes:
  - 'no': 1
    name: 为什么要汇编副业案例：从碎片信息到系统知识
    desc: 用“灯塔”类比：单个副业分享像散落的灯塔，周报则把它们串联成导航图，让读者快速定位有价值的信息，降低检索成本。
    role: motivation
    src:
    - paper: docs/202301-02/SUMMARY.md
  - 'no': 2
    name: 龙哥赚钱周报：一个周期性的副业案例集
    desc: 定义“龙哥赚钱周报”为一种定期汇编的索引合集，按日期编号（如202301-02、230207）组织，覆盖副业、自媒体、电商、AI应用等方向。
    role: definition
    src:
    - paper: docs/202301-02/README.md
    - paper: docs/202301-02/SUMMARY.md
  - 'no': 3
    name: 案例撰写格式：主题+平台+数据结果的标题结构
    desc: 解析周报文章的标题设计策略：通过“公众号追热点复盘：通过行程码一天涨粉4万+，直接变现6K+”这类格式，传递平台、策略与收益预期，吸引读者。
    role: method
    src:
    - paper: docs/202301-02/SUMMARY.md
  - 'no': 4
    name: 高密度索引与标题数字的杠杆效应
    desc: 通过标注涨粉数、变现额、成本等具体数字，周报在标题层面传递“可复制性”与“收益预期”，以增强汇编的实用性与吸引力。
    role: limitation
    src:
    - paper: docs/202301-02/SUMMARY.md
  - 'no': 5
    name: 从周报到知识库：案例集的典型应用与扩展方向
    desc: 讨论此类周报如何从单纯索引扩展为分析工具，例如按平台（抖音、小红书）、赛道（AI绘画、私域裂变）分类，支持深度复盘与趋势洞察。
    role: extension
    src:
    - paper: docs/202301-02/SUMMARY.md
