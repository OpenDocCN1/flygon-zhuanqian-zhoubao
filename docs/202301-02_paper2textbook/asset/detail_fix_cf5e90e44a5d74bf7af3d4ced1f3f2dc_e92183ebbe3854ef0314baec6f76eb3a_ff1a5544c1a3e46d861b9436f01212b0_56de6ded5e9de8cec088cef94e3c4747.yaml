  name: 全域获客矩阵 —— 多渠道“撒网捕鱼”
  points:
  - '**为什么需要这个概念？**'
  - '- 单一渠道的客户获取不稳定且天花板有限，需要多渠道组合来增大客户触达概率'
  - '- 不同平台聚集不同特征的用户群体，多渠道覆盖可以提升获客的广度与效率'
  - '- 获客不应坐等上门，而应主动出击，在客户聚集的多个平台“撒网捕鱼”'
  - '**核心定义**'
  - '- 全域获客矩阵指在抖音、快手、小红书、58同城、转转等多个流量平台同时发布信息、发掘客户的方法'
  - '- 其核心是用多平台覆盖增大有效触达概率，但需针对不同平台定制内容与打法'
  - '**关键性质**'
  - '- 多平台覆盖：每个平台都有独立的用户池，多平台同时布点可最大化潜在客户触达'
  - '- 主动发掘：在平台评论区寻找求租/求购等意向用户并主动私聊破冰'
  - '- 平台定制：不同平台的用户画像与运营规则不同，需针对性调整内容形式'
  - '- 精准圈层：善用平台圈子/超话等垂直社区，精准触达细分需求人群'
  - '**典型例子**'
  - '- 胖龟找房团队在抖音、快手、小红书、58、转转、豆瓣、微博、知乎等多平台发掘租客：在抖音搜索“上海租房”找高热度视频评论区中的求租用户进行私聊；在转转闲鱼求租广场发帖；在微博租房超话发帖回复'
  - '**边界条件**'
  - '- 适用于存在大量分散用户的多平台行业（如租房、二手交易），对高集中度行业效果递减'
  - '- 多平台运营需要投入较多人力维护，需根据自身资源取舍平台优先级'
  - '- 各平台规则差异大，需注意合规性，避免因过度营销被封禁'
