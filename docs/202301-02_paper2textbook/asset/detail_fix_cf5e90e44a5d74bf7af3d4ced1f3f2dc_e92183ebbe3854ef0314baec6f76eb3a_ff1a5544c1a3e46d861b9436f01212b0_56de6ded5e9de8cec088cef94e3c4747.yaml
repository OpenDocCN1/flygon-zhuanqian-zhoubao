life_analogy:
- 想象创办一家公司的那张“股权分配表”是一张**按不同口味切分的披萨**：
- '- **创始人身份** = 谁在深夜打烊后还愿意留下来锁门（兜底），谁就拿到那把唯一的钥匙（控制权）'
- '- **岗位权重** = 厨师长的配方决定了披萨的味道，因此他分到的那块总比别人厚一点（技术壁垒）'
- '- **时间投入** = 不是看谁在店里坐得久，而是看谁端出的菜正好赶上饭点（匹配里程碑的产出）'
- '- **资金投入** = 谁愿意掏出真金白银买下第一批面粉，谁就更有资格关心店里的招牌怎么挂（信心与风险意愿）'
- 就像一份披萨需要按配料、工时、出资与担责来公平切分，合伙创业的股权也需要依据这四个维度来量化切割，才能让大家吃得心服口服。
summary:
- concept: 4C动态量化股权分配模型
  desc: 将资本拆分四维度（创始人/岗位/时间/资金）加权计算的股权分配工具
- concept: 创始人身份
  desc: 本质是风险承担与兜底责任，而非头衔，权重10%-30%
- concept: 岗位权重
  desc: 反映行业技术壁垒所在，权重30%-40%
- concept: 时间投入
  desc: 关键看产出是否匹配项目里程碑，而非单纯全职兼职，权重10%-25%
- concept: 资金投入
  desc: 既是启动基础，也是合伙人对项目信心与风险意愿的信号，权重20%-50%
- concept: 股权分配五步法
  desc: 定赛道→收信息→定维度权重→定股东系数→加权计算的具体操作流程
- concept: 最小MVP闭环
  desc: 用最小可行产品跑通“产品-流量-销售-交付”闭环，验证后再复制放大
- concept: 内容不“自嗨”
  desc: 先模仿爆款再优化创新，避免闭门造成内容无人问津
- concept: 私域高客单
  desc: 因专业而来的私域用户应服务高客单需求，而非做低价值交易
- concept: 蹭流截流
  desc: 在传统中介旁开0中介费门店，利用自然客流与门头标语实现精准截流
- concept: 全域获客矩阵
  desc: 通过抖音、快手、小红书、58、转转等多平台矩阵式发掘客户
exercises:
- 'no': 1
  title: 动手实操：用5步法给一个初创项目分股权
  contents:
  - 假设你、小凡和小韩共同创立一家“AI健身课程”公司，预期启动资金100万元：你是发起人并出资30万（全职做产品）；小凡出资60万（兼职做渠道）；小韩出资10万（全职做运营，并引入其教练资源）。
  - 请按“股权分配五步法”操作：
  - 1. 确定你们所处的赛道类型（技术驱动型/资金驱动型、自主创业型/集团孵化型）
  - 2. 结合赛道特点，在建议区间内设定四个维度的权重
  - 3. 通过“自评互评”方式确定三人在四个维度上的权重系数（1-10）
  - 4. 进行加权计算得出初步股权比例
  - 回答问题：
  - '- 小韩全职且带来资源，他的“时间投入”维度的权重系数是否应该高于兼职的小凡？为什么？'
  - '- 如果小凡要求按出资比例（60%）占股，和4C模型的结果相比谁更合理？为什么？'
  - '- 在什么情况下，你们计算的股权比例需要启动“一致行动权”或“期权池”来调整？'
- 'no': 2
  title: 案例救火：找出四位合伙人的分配分歧点
  contents:
  - 阅读以下情境：
  - 四位合伙人共同创立一家餐饮连锁品牌。A提出品牌概念并负责供应链（全职），B出资200万占最大资金份额（全职），C负责门店运营（全职），D只在周末帮忙做营销策划（兼职）。品牌创立半年后，A认为自己是创始人应拿最大股份，B认为自己出了最多钱应拿最多回报，C认为自己每天在门店投入时间最长，D认为自己虽然兼职但营销策略决定了品牌成败。
  - 请运用“创始人身份”和“时间投入”连个概念诊断：
  - 1. 按4C模型的“创始人身份”定义，谁最有资格被认定为创始人？为什么？
  - 2. 分析题干中“全职兼职”的简单区分在“时间投入”维度上存在什么误区？
  - 3. 如何用“里程碑产出”来衡量C和D的时间投入价值？
  - 4. 为解决他们的分歧，你会提议按照什么流程重新谈判？关键步骤是什么？
- 'no': 3
  title: “最小MVP”策划案：验证你的副业想法
  contents:
  - 假设你想利用业余时间做一个“职场PPT模板定制”副业，目标是月入5000元。
  - 请设计一个最小可行的MVP闭环方案：
  - 1. 明确你的最小可交付产品（必须能在3天内完成）
  - 2. 设计获取第一批种子用户的渠道（至少2个公域/私域渠道）
  - 3. 制定一个简单的销售话术或页面来测试付费意愿
  - 4. 设定交付方式和客户反馈收集机制
  - 回答问题：
  - '- 你的MVP中“产品—流量—销售—交付”哪一环最容易断裂？如何补上？'
  - '- 如果测试过程中发现只有5%的咨询者愿意付费，你会选择继续还是止损？判断依据是什么？'
  - '- 结合“内容不自嗨”与“私域高客单”原则，你会如何设计你的获客内容与定价策略？'
units:
- 'no': 1
  name: 4C动态量化股权分配模型 —— 把“分饼的刀”变成“称重的秤”
  points:
  - '**为什么需要这个概念？**'
  - '- 多个合伙人创业时，分股权是极易引发矛盾的点：大家往往凭感觉、凭资历或凭关系分配，容易造成“出力最多的人拿得最少”的不公平感'
  - '- 大多数合作伙伴拆伙的原因，就是觉得自己最重要、出力最多，但分到的钱不是最多；根源在于前期做股权设计时，大家对各自重要程度的判断不一致'
  - '- 传统“拍脑袋”分股权在公司尚未盈利时看似和谐，但随着公司壮大，分歧会逐渐积累成隐患'
  - '**核心定义**'
  - '- 4C模型是一个用于初创团队量化股权分配的工具，将资本分为人力资本和货币资本，再细分为四个维度：创始人身份、岗位权重、时间投入、资金投入'
  - '- 每个维度带有可波动的建议权重范围，通过加权计算得出各股东应得的股权比例'
  - '- 四个维度的权重并非固定，需要创始团队通过自评和互评达成共识'
  - '**关键性质**'
  - '- 创始人身份代表风险承担：谁承担最大风险和兜底责任，谁就最有控制企业的需要，权重通常在10%-30%'
  - '- 岗位权重反映行业技术壁垒所在：哪个岗位对项目重要性最高，权重通常在30%-40%'
  - '- 时间投入最简单的划分是全职还是兼职、投入精力大小，权重通常在10%-25%（但约60%项目的合伙人都全职参与，不能只看全职兼职）'
  - '- 资金投入指项目前期资金的投入，可用于判断合伙人对项目的信心和承担风险意愿，权重通常在20%-50%'
  - '**典型例子**'
  - '- 三个朋友（小明、小磊、小胡）合伙做儿童体能训练项目，预期启动资金200万：小明出资50万且是发起人，小磊负责市场不愿出钱，小胡出资150万'
  - '- 通过自评互评，确定岗位权重为7:2:1、时间投入为6:3:1，再结合出资额加权计算出各股东股权比例'
  - '**边界条件**'
  - '- 该模型特别适合刚起步的初创型项目，给非常明确的参考指引；但并非放之四海而皆准'
  - '- 按五步法计算出的股权比例只是最简单的环节，并非最终体现在工商商事主体上的最终结果，还需配套合同规范和调整工具'
  - '- 最终比例必须依靠创始团队协商达成共识，工具只是辅助决策，不能替代沟通'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 今天给大家提供一个工具，这个工具的名称叫 4C 动态量化股权分配模型。
  - 4C中的C，就是资本的意思，资本我们分为人力资本和货币资本。再细分成4个维度的话，就是创始人身份、岗位权重、时间投入、资金投入。
  - 这个分歧在我们前期做股权设计的时候，大家可能不容易发现，但是在公司发展壮大的过程中，越到后面越会产生一些隐患。因为大家从一开始对自己的重要程度的判断就是不一致的，大多数合作伙伴拆伙，就是觉得自己最重要，出力最多，但是分到的钱又不是最多。
  - 在算完初步的股权分配后，我们还会有其他一系列的合同规范和调整，比如一致行动权，期权池，分红奖励，回购权，纯资金方投资的优先清算权，领售权，等等等等。
- 'no': 2
  name: 股权分配五步法 —— 从“商量着分”到“算着分”
  points:
  - '**为什么需要这个概念？**'
  - '- 有了4C模型提供四个维度的框架，还需要一套具体可执行的操作流程，否则模型只是空谈'
  - '- 创始团队需要一套标准化的步骤来收集信息、确定权重、计算比例，避免遗漏关键环节或凭感觉乱定'
  - '- 五步法将“定性的讨论”转化为“定量的计算”，让股权分配结果更透明、可解释、可追溯'
  - '**核心定义**'
  - '- 股权分配五步法是运用4C模型分配股权的具体操作流程，包含五个步骤：确定行业和赛道、收集创始团队信息、确定每个维度的权重比例、确定股东四个维度的权重系数、计算出各个股东的股权比例'
  - '- 其中第一步将行业划分为技术驱动型/资金驱动型、自主创业型/集团孵化型两个维度四个类型，不同赛道对资金和技术的权重需求不同'
  - '**关键性质**'
  - '- 第一步定赛道：技术驱动型对技术权重高，资金驱动型对资金权重高'
  - '- 第二步收集创始团队信息：包括谁是全职、谁负责哪个岗位、各自出资额度等'
  - '- 第三步确定维度权重：依靠创始团队自评互评达成共识，股东们要先认可这4个维度的权重比例就在设定区间内波动微调'
  - '- 第四步确定股东权重系数：按1到10各自打分'
  - '- 第五步加权计算：将各维度权重与各股东系数相乘并汇总，得出最终股权比例'
  - '**典型例子**'
  - '- 儿童体能训练项目中，三人在确定赛道的维度权重后，通过自评互评确定岗位权重7:2:1、时间投入6:3:1，再结合各自出资（小明50万、小胡150万），最终计算出各自股权比例'
  - '**边界条件**'
  - '- 五步法计算出的比例只是起点，还需配合合同规范和调整工具（如一致行动权、期权池、回购权等）'
  - '- 方法依赖创始团队自评互评的诚实与共识，若团队成员不愿坦诚沟通则难以有效执行'
  - '- 该方法适合初创阶段，公司发展壮大后需根据实际情况动态调整'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 第一个步骤：确定行业和赛道……第二个步骤：收集创始团队信息……第三个步骤：确定每个维度的权重比例……第四个步骤：确定股东四个维度的权重系数……第五个步骤：计算出各个股东的股权比例。
  - 我们要先确定赛道，也就是你所处的行业，不同的赛道，对资金和技术的权重不一样。我们把行业分成2个维度四个类型，分别是技术驱动型/资金驱动型，以及自主创业型/集团孵化型……
  - 大家通过自评和互评，最终得出来岗位权重是 7 ：2 ：1。……然后时间投入是 6 ：3 ：1。
- 'no': 3
  name: 创始人身份 —— 不是“头衔”而是“谁兜底”
  points:
  - '**为什么需要这个概念？**'
  - '- 在多合伙人项目中，如果创始人身份不明确，就会出现“谁都说了算、谁都不负责”的混乱局面'
  - '- 公司对外只能有一个声音，创始人身份必须从开始就极度明确，否则后期容易产生控制权纠纷'
  - '- 明确创始人身份是4C模型的第一步，也是最重要的维度，直接关系到谁拥有最终决定权'
  - '**核心定义**'
  - '- 创始人身份在4C模型中代表风险承担：谁承担最大风险、谁最后兜底，谁就最有控制整个企业的需要'
  - '- “当这个项目不成立或这个项目遇到了极大的风险，谁愿意无条件的去为这个项目兜底，那这个人就是创始人”'
  - '- 权重通常在10%-30%'
  - '**关键性质**'
  - '- 创始人身份的本质不是荣耀而是责任：创始人需要对项目有与其他人完全不同的付出程度'
  - '- 创始人身份必须从一开始极度明确，一家公司对外只能有一个声音'
  - '- 创始人身份是4C模型中最重要的维度，也是股权分配的首要锚点'
  - '**典型例子**'
  - '- 儿童体能训练项目中，小明作为发起人（前期出资50万），被认定为创始人，是项目遇到风险时无条件兜底的人'
  - '**边界条件**'
  - '- 创始人身份认定需要团队共同认可，若有多人同时声称自己是创始人，则需回到“谁愿意兜底”这一本质标准来判断'
  - '- 创始人身份权重并非固定，需结合项目阶段和团队共识在10%-30%区间内调整'
  - '- 创始人身份不等于“老板”或“最大股东”，控制权还需与股权、投票权等机制协同'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 1.创始人身份它其实是最重要的，我认为谁承担最大的风险，谁就最有控制整个企业的需要。……谁来最后承担这个兜底的人，那么我会认为这个人他就是发起人和创始人。
  - 在我看来，它其实代表着风险承担，就谁最后在兜底。当这个项目不成立或这个项目遇到了极大的风险，谁愿意无条件的去为这个项目兜底，那这个人就是创始人，他对这个项目的付出程度是跟其他的合伙人完全不一样。
  - 创始人的身份是要极度明确的，从一开始就要很明确，它是要能控制这个项目的，一家公司最后对外的时候，应该只有一个声音。
- 'no': 4
  name: 时间投入 —— 不是“全职兼职”而是“里程碑产出”
  points:
  - '**为什么需要这个概念？**'
  - '- 如果只按“全职还是兼职”来分配时间投入权重，会忽略一个重要现实：约60%的项目的合伙人其实都全职参与'
  - '- 全职参与并不等于产出到位——一个人全职坐班但产出跟不上项目里程碑，与一个兼职但每阶段都超额交付的人，对项目的贡献截然不同'
  - '- 时间投入是4C模型中关键的区分维度，但也是最容易被简单化、被误判的一个维度'
  - '**核心定义**'
  - '- 时间投入在4C模型中指合伙人投入项目的时间精力以及愿意引进的资源，不能简单以全职兼职区分，更要看其产出是否匹配上项目里程碑的进展'
  - '- 权重通常在10%-25%'
  - '**关键性质**'
  - '- 衡量时间投入不能只看“来了多少小时”，更要看“产出是否匹配项目里程碑”'
  - '- 时间投入还包括愿意为项目引进的资源，不单只是时间精力'
  - '- 约60%左右的项目，所有合伙人（除纯财务投资人外）其实都是全职参与'
  - '**典型例子**'
  - '- 儿童体能训练项目中，三位合伙人通过自评互评确定时间投入权重为6:3:1，反映出各自投入产出对项目里程碑的实际贡献差异'
  - '**边界条件**'
  - '- 时间投入权重需在前期股权设计时就讲清楚，避免后期因“我觉得我投入很多”产生纠纷'
  - '- 该方法适用于需要团队共同投入的初创项目，对于纯财务投资人占多数的项目，时间投入维度的权重可能不适用'
  - '- “时间投入”不应被误解为“工作时间”，而应理解为“有效产出+资源贡献”的综合衡量'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 3.时间的投入，最简单的划分就是全职还是兼职，投入精力的大小等。时间投入的权重通常在10%-25%。
  - 但是大家有没有想过，就是其实有 60% 左右的项目，所有的合伙人除了纯财务投资人之外，其实都是全职参与的。只是说你全职参与的这个产出它是不是就能匹配的到这个项目的所有的进展，项目到达的里程碑是不是跟你全职参与有必然关系。
  - 所以我们前期在做股权设计的时候，就一定要讲清楚，这个时间投入，它对应的除了是我们投入的时间精力，还有我们愿意引进的资源，愿意为了这个项目付出多少，不单单只是一个全职兼职。
