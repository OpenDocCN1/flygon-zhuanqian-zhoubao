  - '**核心定义**'
  - '- 资金投入在4C模型中指项目前期资金的投入，用于支撑项目启动和初期运营'
  - '- 权重通常在20%-50%，是四个维度中权重区间最大的'
  - '- 可以通过时间投入和资金投入去判断合伙人（对项目）的信心和他愿意承担多大的风险'
