unsupported_claims:
- location: ch17.1（概念地图及全章多处）
  claim: 素材 P001 被引用为“精准用户排查(鱼塘/动物园类比)”和“打广告无成交的排查顺序(池子→文案→铺垫)”的支撑来源。
  reason: 素材 P001《破除打广告的认知卡点》正文仅提供了“鱼塘/动物园”类比，但未明确提及“池子→文案→铺垫”这一具体的三步排查顺序。该顺序由教科书作者在
    17.10 节中自行提炼总结，故此处属于对素材内容的延伸解读，素材中无直接原文支撑。
- location: ch17.3
  claim: 文中心金文案定义被标注为“来源：《心金文案方法论》，素材 P002”。
  reason: 素材 P002 原文中对“心金文案”的表述是“既能吸金、又能深入人心的文案”，并未给出书中“= 既能吸金（具备商业变现属性）又能深入人心（蕴含情感、带来触动）”这一结构化定义。此定义属于教科书作者的二次提炼和总结。
- location: ch17.4
  claim: 文中的“三重思考框架”伪代码被标注为“方法（来源：《心金文案方法论》，素材 P002）”。
  reason: 素材 P002 原文确实提出了“目的、受众、平台”三个问题，但并未给出“步骤1、步骤2、步骤3”这种形式化的伪代码“方法”框架。此框架属于教科书作者对素材内容的重新编排和加工。
- location: ch17.5
  claim: 文中的“共鸣感构建层级模型”被标注为“方法（来源：《心金文案方法论》，素材 P002）”。
  reason: 素材 P002 原文提到了“经历的共鸣、感受的共鸣、价值观的共鸣”3个方向，但并未将其定义为“层级1、层级2、层级3”的递进模型，也未标注“同病相怜”“感同身受”“灵魂同频”等对应关系。此模型为教科书作者的加工与呈现。
- location: ch17.6
  claim: 文中的“富兰克林复写法”步骤被标注为“方法（来源：《心金文案方法论》，素材 P002）”，并命名为“看-关-写-比”。
  reason: 素材 P002 原文介绍了复写的过程（看一眼、关闭、用自己的话写出来、对比），但并未明确命名为“看-关-写-比”四步法。此命名属于教科书作者的提炼和简化。
- location: ch17.7
  claim: 文中的“输入层级（故事类→评论类→商业类）”被标注为“方法（来源：《心金文案方法论》，素材 P002）”。
  reason: 素材 P002 原文推荐了看这三类内容，但未明确将其定义为三层递进的“输入层级”。此架构为教科书作者对素材内容的组织与归纳。
- location: ch17.8
  claim: 广告效果公式 E = α·S·V 被表述为对素材 P001 中“放大与筛选”本质的形式化推导。
  reason: 素材 P001 只描述了“放大”和“筛选”的定性关系，并未提出任何数学公式或“S”、“V”、“α”等变量。该公式完全是教科书作者自行引入的数学模型，素材中无任何对应内容支撑。
- location: ch17.9
  claim: 成交概率累加公式 P = Σ(w_i · Value_i) 被表述为对素材 P001 中“有间隔的重复次数”理念的数学推导。
  reason: 素材 P001 只是用文字和案例描述了“重复次数”的重要性，并未提出“感知权重（w_i）”“价值（Value_i）”等量化概念或累加模型。该公式为教科书作者的原创性思想实验，素材中无直接对应内容。
- location: ch17.10
  claim: 文中将素材 P001 中的“鱼塘/动物园”类比明确定义为“鱼塘排查法”（判断依据：目标客户占比；执行步骤1-4）。
  reason: 素材 P001 原文仅用“鱼塘/动物园”类比来说明用户池不精准的问题，并未系统化地提出“排查方法”及“执行步骤”。此方法框架属于教科书作者的归纳和创建。
- location: ch17.11
  claim: 文中对比表格引用素材 P001 时，将其视角描述为“成交的关键变量是触达频率与节奏（有间隔的重复次数）”。
  reason: 素材 P001 确实提到了“有间隔的重复次数”与“强度”的重要性，但并未称其为“关键变量”。“关键变量”是书籍作者进行多源对照时使用的分析性词汇，原文无此表述。
- location: ch17.11
  claim: 文中称素材 P002 的核心视角为“单次触达的质量是关键，即触达的‘深度’是影响转化率的根本”。
  reason: 素材 P002 主要讲的是文案写作的方法与共鸣感构建，并未明确对“触达次数”和“触达深度”进行对比，也未提出转化率由‘质’决定的观点。此观点是教科书作者在“多源对照”中的主观解读与分析结论。
- location: ch17.12
  claim: 文中提及素材 P001 中有“追求‘单次惊艳’还是‘重复触达’”的“量”与“质”的经典取舍问题。
  reason: 素材 P001 虽然支持长期重复内容输出，但原文并未与“单次惊艳”做对比讨论“取舍”。“量/质取舍”是教科书作者根据素材内容进行延伸推演的结果，原文无此讨论。
- location: ch17.13（练习1）
  claim: 练习题1的文案被标注为“改编自素材 P002《心金文案方法论》的共鸣感构建案例”。
  reason: 素材 P002 中只举了抽象的例子说明共鸣感的三个方向（经历、感受、价值观），并未提供“深夜11点哄娃写文案月入过万”这类具体的完整案。此案例为教科书作者根据素材原理原创编写的示范文本。
- location: ch17.13（练习2）
  claim: 【练习素材】中的“优秀文案”被标注为“范本，改编自素材 P002《心金文案方法论》中关于共鸣感构建的写作原则”。
  reason: 素材 P002 原文并未提供“你不是懒，你只是太久没有被自己感动过了……”这一具体文案。该文案是教科书作者根据“共鸣感”原则创作的示例。
- location: ch17.1（导言处）
  claim: 导言中提及“素材 P001《破除打广告的认知卡点》”，但全文实际同时借鉴了素材 P002 的内容以构建“心金文案”体系。
  reason: 第17.1节的三个类比（鱼塘、聚光灯、追求爱人）中，“聚光灯”类比虽与P001的“放大筛选”逻辑相通，但在整个章节结构中，最核心的论述依赖P002。全章并未对P001与P002的融合使用进行明确说明。
