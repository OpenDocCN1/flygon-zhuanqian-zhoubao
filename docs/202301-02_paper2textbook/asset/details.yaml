- learning_targets:
  - 理解后端变现效率为何是抖音IP项目成败的核心决定因素
  - 掌握变现产品双轨制（泛兴趣低客单 vs 精准痛点高客单）及其成交路径匹配
  - 学会行业冠军联营打法：筛选、洽谈、利用头部机构资源放大流量
  - 建立短视频IP团队五岗标准架构与核心考核指标体系
  - 掌握剪辑→运营→项目经理的内部人才培养路线与操作步骤
  - 熟练运用IP打造五步流水线：定位、选题、文案、拍剪、复盘的标准化执行
  - 理解并能操作留存坏点复盘法，实现秒级流失诊断与精准优化
  - 掌握爆款文案‘钩子开头+漏斗观点+钩子结尾’结构的拆解与复制技巧
  - 认清创始人IP的商业效率陷阱，学会用专业演员替代创始人出镜的决策标准
  - 建立‘不下牌桌’的组织能力：经验沉淀、流程固化、梯队备份的护城河思维
