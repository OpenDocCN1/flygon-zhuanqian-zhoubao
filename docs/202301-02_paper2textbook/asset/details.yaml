    - '- 解决“拍脑袋想需求”导致的无效生产'
    - '**核心定义**'
    - '- 利用百度/微信/小红书/抖音/Google/应用商店搜索框的自动补全推荐词'
    - '- 这些词=真实用户高频搜索查询=真实痛点/需求/场景'
    - '- 核心动作：输核心词→记下拉词→输下拉词→再记下拉词→无限发散'
    - '**关键性质**'
    - '- 实时性：反映当下最热搜索意图，比指数工具快1-2周'
    - '- 长尾性：多为长尾词，精准度高、竞争低、转化好'
    - '- 跨平台互验：同一词在多平台都有下拉=超级强需求'
    - '**典型例子**'
    - '- 输入“微信解封”→下拉“微信解封辅助/微信解封平台/微信解封接单”→发现代解封需求'
    - '- 输入“AI绘画”→下拉“AI绘画关键词/AI绘画软件/AI绘画变现”→切中变现痛点'
    - '- 应用商店搜“去水印”→下拉“视频去水印/图片去水印/批量去水印”→细分工具需求'
    - '**边界条件**'
    - '- 仅反映搜索需求，不代表付费意愿，需结合商业价值判断'
    - '- 灰黑词下拉多（解封/刷单/外挂），需合规过滤'
    - '- 仅是需求发现起点，后续需验证竞品、变现路径、交付可行性'
    sources:
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: origin
    excerpts:
    - 发现需求的方式也很简单，去应用商店找一些App名字，输入百度、微信、小红书，Google搜索框
    - 需求是抓住用户遇到问题,用户寻找解决办法产生的行为。围绕用户可能产生的行为场景，在行为中部署产品！
