    name: 创业心态与内在比赛 —— 从“输了内在”到“赢了自己”
    points:
    - '**为什么需要这个概念？**'
    - '- 任何外在成就的取得都取决于潜意识是否真正认可目标：当自我二（潜意识）不认可目标时就会输掉内在比赛，进而输掉外在比赛——李宗伟不是输给林丹，是输给自己。'
    - '- 创业者需要的不是理性自我怀疑，而是近乎盲目的自信与乐观——“在我的领域我就是国王”的潜意识信念是打赢内在比赛、获得外在成功的前提。'
    - '- 与其相信“失败是成功之母”，不如相信“成功才是成功之母”；过去的成功体验在潜意识累积自信，推动后续更大成功。'
    - '- 懒惰本质是未获得正反馈；未获正反馈源于做得不够多，而做得不够多是因为不够喜欢。两个突破口：尽快找到真正热爱的，或纯粹为钱冲——不别扭、不内耗。'
    - '**核心定义**'
    - '- 内在比赛理论（源自《身心合一的奇迹力量》）：人有两个自我——自我一（理性/一般自我）、自我二（感性/潜意识）；任何比赛同时进行内在与外在比赛，输掉内在比赛必然输掉外在比赛。'
    - '- 盲目自信：创业者的理性选择，近乎盲目的自信与乐观，潜意识信念“我在我的领域我就是国王”。'
    - '- 成功是成功之母：过去的成功体验在潜意识累积自信，推动后续更大成功——一个成功体验推动一个又一个成功体验。'
    - '- 唤醒成功体验法：内心怂/不自信时，回顾并唤醒过往成功体验建立潜意识自信；优秀推销员先找优质客户或卖易销产品制造成功体验。'
    - '- 俯视学习法：潜意识层面保持国王般俯视姿态（战略藐视），具体请教落实时保持学生认真态度（战术重视）——跪着学习的人打不赢内在比赛。'
    - '**关键性质**'
    - '- 内在比赛决定外在成败：长期目标与创业行为成败本质取决于潜意识是否真正认可目标。'
    - '- 老虎伍兹案例：性丑闻离婚后两个月丢掉世界第一，几年跌出前100；核心非技术下降，而是潜意识和对手潜意识都不再认为他是完美、不可战胜的人——输掉了内在比赛。'
    - '- 李宗伟VS林丹：职业生涯交手37次李输25次（含两次奥运决赛）；大部分运动员教练认为技术不分伯仲——输球根源是潜意识层面内在比赛落败。'
    - '- 正反馈驱动热爱：懒惰本质=未获正反馈=做得不够多=不够喜欢。突破口：找到热爱，或纯粹为钱冲（不别扭、不内耗）。'
    - '- 战术勤奋无法逃避战略探索：用忙碌工作麻痹自己、以战术勤奋逃避战略突破，短期轻松长期有毒。'
    - '**典型例子**'
    - '- 老虎伍兹：丑闻后失去“不可战胜”信念，世界排名从第一跌出前100。'
    - '- 李宗伟：技术不输林丹，但潜意识层面内在比赛落败，奥运决赛两连败。'
    - '- 优秀推销员：开展一天工作先找优质客户或推销易卖产品制造成功体验，帮助更好开展后续工作。'
    - '- 宝妈执行力变现：4个月加4000多好友微信号被亦仁花约7万购买；作者因执行力被邀请生财办公室，这是对执行力的奖励。'
    - '**边界条件**'
    - '- 做事依据是能力与资源而非愿望：老鹰吃兔子、鲨鱼吃鱼；鲨鱼不应羡慕老鹰，应努力捕捉更多鱼；先确定适合做什么，倾注一生精力做好。'
    - '- 亏钱是赚钱路上不可缺少部分：舍弃亏钱就意味着舍弃赚钱；赚钱方式千差万别，亏钱方式殊途同归。'
    - '- 反期望：严格反着做亏钱步骤也无法保证赚钱，因为高手也会亏钱。'
    sources:
    - paper: docs/202301-02/20230207_01.md
      role: origin
    - paper: docs/20230207_03.md
      role: improve
    - paper: docs/20230207_07.md
      role: improve
    excerpts:
    - 人有两个自我，自我一对应理性/一般自我，自我二对应感性/潜意识；任何比赛同时进行着内在比赛与外在比赛，当自我二不认可目标时就会输掉内在比赛，进而输掉外在比赛。
    - 创业者需要的不是理性的自我怀疑，而是近乎盲目的自信与乐观——“在我的领域我就是国王”的潜意识信念是打赢内在比赛、获得外在成功的前提；永远不要低估一个高估自己的人。
    - 与其相信“失败是成功之母”，不如相信“成功才是成功之母”；过去的成功体验会在潜意识中累积自信，推动后续更大成功——一个成功体验推动一个又一个成功体验。
    - 当内心很怂、不自信时，回顾并唤醒过往成功体验来建立潜意识自信；优秀推销员开展一天工作时先找优质客户或推销容易卖的产品制造成功体验。
    - 对外学习与请教的方法论：在潜意识层面保持国王般的俯视姿态（战略上藐视），在具体请教与落实时保持学生的认真态度（战术上重视）——跪着学习的人打不赢内在比赛。
    - 性丑闻离婚后两个月丢掉世界第一头衔，几年内跌出世界排名前100；核心不是技术下降，而是潜意识和对手的潜意识都不再认为他是完美、不可战胜的人——他输掉了自己的内在比赛。
    - 两人职业生涯交手37次，李宗伟输25次，其中两次奥运会决赛；大部分职业运动员和教练认为两人技术不分伯仲——其输球根源是潜意识层面的内在比赛落败，而非技术不足。
    - 为什么会有懒惰这个东西？本质上，就是没拿到正反馈...但是最核心的是，你不够喜欢...两个突破口：一个是尽快找到自己到底热爱，另一个...就是为了钱冲，不别扭，不内耗。
    - 动脑是很累的，探索是令人恐惧的，用战术上面的勤奋来逃避真正战略上要去探索和突破的事情，用忙碌的工作来麻痹自己，是短期轻松的，长期确是有毒的。
    - 不能基于美好愿望做事，而是基于能力和资源：老鹰可以吃到兔子，鲨鱼却吃不到——鲨鱼不应羡慕老鹰，应努力捕捉更多的鱼。
  - 'no': 7
    name: 销售与成交 —— 从“卖产品”到“卖信任”
    points:
    - '**为什么需要这个概念？**'
    - '- 高净值客户最大痛点是“失去掌控权”，恐惧源于未知；抓住这个核心痛点，客户会觉得你懂他，形成依赖——由奢入俭难，对一直拥有掌控权的人更可怕。'
    - '- 销售中买家会本能启动自我保护机制（撒谎、给希望、躲起来）获取免费资讯，卖家按传统需求挖掘流程推进会在高净值客户面前受挫；破局需从让客户产生好奇开始。'
    - '- 成交核心三要素：需求、信任、购买力。成交前提是信任，信任前提是能提供用户需要的价值、解决用户需求。'
    - '- 闲鱼套利核心逻辑：低买高卖、安全边际、标品看价格、选爆品、合作思维（利他即利己）。'
    - '**核心定义**'
    - '- 需求vs痛点：需求是理性的、缺乏情绪动力；痛点带有强烈情绪驱动。只有把需求上升为痛点，才能促使下决定购买——客户很平静时都是需求，不是痛点。'
    - '- 高净值客户核心痛点：失去掌控权。恐惧源于未知，抓住此痛点客户觉你懂他，形成依赖。'
    - '- 买家系统vs卖家系统：买家本能启动自我保护（撒谎、给希望、躲起来），卖家传统流程在高净值客户面前受挫，破局需从引起好奇开始。'
    - '- 闲鱼倒爷套利流程：商业底层逻辑（低买高卖、安全边际、标品看价、选爆品、合作思维）→ 市场调研（品牌货优先、标品优先、销量大优先、候选品官方价≥150元、避开劝退类目）→
      定向关键词搜索（抵账、抵债、批量出）找低价好货。'
    - '- 合作思维：将对方置于合作共赢而非对立关系，释放“利他”信号（为对方节省精力、加速资金回笼）促成交易。'
    - '**关键性质**'
    - '- 破局方法：反问/布置功课引起好奇→跳出买家系统→需求上升为痛点+重塑行业概念建立权威→提问（聊小孩、谈自己、谈传承）形成长久依赖。'
    - '- 发圈动力公式：发圈动力 = 佣金 / 设计交压力。产品需具备社交货币价值，让分销员发圈/私聊无压力才能自发传播。'
    - '- 社群分销佣金分配：一级佣金高→普通分销员卖货意愿强但难吸引大团长；二级佣金高→团长招商积极但普通分销员动力不足。调高二级佣金招商裂变快，调高一级佣金平台发展稳健。'
    - '- 抖音爆单承接法：视频爆了立马上传同内容视频建合集带爆新视频；流量视频与带货视频双路并进；视频一爆立马开直播双频共振。'
    - '- 微头条爆文写法：选社会类/法律类争议或共鸣题材，掌握推荐机制（点击率>10%进入下一轮、互动率3%），编写吸引人开头和留白提问——核心四字：争议、共鸣。'
    - '**典型例子**'
    - '- 闲鱼套利三验证：飞利浦音响5台购入1400卖出2250；360U盘20个购入300卖出550；72个欧普台灯（成本102元）旺季单日最高卖9个、149元包邮价卖出。'
    - '- 抖音爆单实证：A账号两条视频日入1.8万；B账号连续直播最高日佣3万。'
    - '- 高净值客户痛点：富一代/创一代最大痛点是失去掌控权，恐惧源于未知。'
    - '- 微头条反向发帖：表扬被全网骂的女干部，账号被喷成狗，<300字赚400+块。'
    - '**边界条件**'
    - '- 闲鱼套利避开劝退类目：候选品官方价格至少150元以上，避开劝退类目。'
    - '- 合作思维非万能：利他即利己的谈判逻辑成立，但需对方具备合作意愿。'
    - '- 社群分销佣金设计需平衡：一级高利稳健、二级高利裂变快，需根据阶段调整。'
    sources:
    - paper: docs/202301-02/20230207_08.md
      role: origin
    - paper: docs/202301-02/20230207_11.md
      role: improve
    - paper: docs/202301-02/20230207_06.md
      role: improve
    excerpts:
    - 需求是理性的、缺乏情绪动力的，而痛点是带有强烈情绪驱动的；只有把客户的需求上升为痛点，才能促使其下决定购买——当客户很平静时，都是需求，不是痛点。
    - 高净值客户（尤其是富一代、创一代）最大的痛点是失去掌控权，恐惧源于未知；抓住这个核心痛点，客户会觉得你懂他，从而形成依赖。
    - 销售过程中买家会本能启动自我保护机制（撒谎、给希望、躲起来）以获取免费资讯，而卖家若按传统需求挖掘流程推进会在高净值客户面前受挫；破局需从让客户产生好奇开始。
    - 成交的核心三个要素：需求、信任、购买力。成交的前提是信任，信任的前提是能提供用户需要的价值、解决用户的需求。
    - 一、商业的底层逻辑：低买高卖、安全边际、标品看价格、选爆品、合作思维。
    - 采用合作思维，我和他不是对立关系，而是合作共赢，即利他思维，利他即利己，所以合作思维逻辑成立。
    - 先通过反问或布置功课引起客户好奇，跳出其熟悉的买家系统；再将需求上升为痛点和重塑行业概念建立权威；最后通过提问（聊小孩、谈自己、谈传承）形成长久依赖。
    - 发圈动力=佣金/设计交压力。产品需要具备社交货币价值，让分销员发朋友圈、私聊没有压力才能自发传播。
    - 一级佣金高则普通分销员卖货意愿强但难吸引大团长；二级佣金高则团长招商积极但普通分销员动力不足。
    - 视频一爆，立马上传同内容的视频，并创建合集，大概率能把新的视频带爆...视频一爆，立马开直播，双频共振。
    - 我建议大家去选择社会类的新闻事件以及法律类的故事情节...核心四字：争议、共鸣。
  - 'no': 8
    name: 趋势判断与机会窗口 —— 从“看数据”到“抓红利”
    points:
    - '**为什么需要这个概念？**'
    - '- 通过数据推演和行业类比判断确定性窗口期：香港疫情数据类比推演大陆首轮感染后有2-3个月平稳期，2023年春天是相对确定的稳定期，是生意人与投资者看重的窗口期。'
    - '- 平台电商演进有四个周期（铺货、动销、精细化、玩趋势），底层逻辑相通，可用来预判新平台（美团、TEMU）机会——视频号与抖音历史进程何其相似。'
    - '- 面对流量热点，技术驱动者用已备好技术基础设施最小成本快速响应：注册域名公众号/小程序、接入API、做镜像站，抢占搜索流量首位。'
    - '- 赚钱机会往往隐藏在身边，源于多数人未发现的信息差；网上说做什么小项目月入多少的基本已过时。'
    - '**核心定义**'
    - '- 确定性窗口期：从疫情数据推演商业机会，如香港数据类比大陆首轮感染后2-3个月平稳期，2023年春天是全年最重要的3个月窗口期。'
    - '- 平台电商四周期：铺货期（鼓励资源涌入，适合激进投放）→ 动销期→ 精细化期→ 玩趋势期（存量期重生态建设，需从自身找原因）。'
    - '- 热点套利技术栈：技术基础设施决定响应速度，ChatGPT热度起来后十几分钟写代码成全网首个集成公众号，消耗近50万次请求。'
    - '- 需求共振：商品销售与目标用户季节性需求（如学生暑假对台灯需求增加）高峰期重合，利用此规律提升销量。'
    - '- 信息差生意：身边被忽视的赚钱机会，源于多数人未发现的信息差。'
    - '**关键性质**'
    - '- 行业机会切入点：旅游/健康/餐饮三行业。旅游做产品分销套利（机票/酒店/景点）；健康做保健养生带货；餐饮紧扣春季爆发需求。'
    - '- 旅游复苏数据：春节国内旅游3亿人次恢复至2019年88.6%，出境机票订单涨258%、入境预定涨632%、国际酒店预定增177%。'
    - '- 健康带货火爆：多个保健品品牌抖音销量过亿，诺特兰德维生素片连续两月抖音直播单品销量第一，养生书单/茶/推拿小课程适合普通人带货。'
    - '- 美团电商红利验证：8月末发现机会<2个月跑通扩展到30店，类目不同单店月利润6k-12k（零运营未优化），首店MVP仅花80元。'
    - '- SEO长尾福利：SEO思维发布内容即使3-5年后依然享受流量福利，发<200篇内容后大半个月不更新也每天有人主动咨询。'
    - '**典型例子**'
    - '- 香港疫情数据类比推演大陆平稳期，2023年春天“先干个春天再说”。'
    - '- 旅游/健康/餐饮三行业春天爆发数据验证。'
    - '- 美团电商：不到两个月30家店，单店月利润6k-12k，验证新平台初期红利效应。'
    - '- ChatGPT热点套利：十几分钟注册公众号“ChatGPT中文版”、接入API、做镜像站套娃小程序，全网首个集成，消耗近50万请求。'
    - '- 台灯需求共振：预测6月底暑假旺季，72个台灯旺季单日最高卖9个。'
    - '- 身边信息差案例：苏州AO图文专做广告牌开70家店、四线城市烤面筋三轮车月入过万、大学生朋友圈卖螃蟹年入约1.2万。'
    - '**边界条件**'
    - '- 反期望：逆向操作也不能保证赚钱，因为“赚钱方式千差万别，亏钱方式殊途同归”，亏钱是赚钱路上不可缺少部分。'
    - '- 平台存量期需合规：增长期激进投放，存量期重生态建设，需从自身找原因（合规、素材原创、发货时效），否则被清理。'
    - '- 赛道热度与SEO长尾：热门/冷门赛道数据优秀有抬价优势；SEO内容长尾福利持久。'
    - '- Web3新人23条建议：小成本试错、不玩杠杆合约、保护资产、好机会重仓>平庸机会轻仓、会卖比会买重要、人声鼎沸时一定要跑（见好就收、有利必跑、狠心出货、切勿幻想、变现为王）。'
