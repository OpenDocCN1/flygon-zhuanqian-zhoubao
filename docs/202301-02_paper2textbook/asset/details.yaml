    name: 卓越策略师五大能力与商业模式画布道术器用法 —— 从执行到架构的进阶
    points:
    - '**为什么需要这个概念？**'
    - '- 从“会干活”进阶为“会设计生意/带团队/定战略”，需一套可训练的能力模型'
    - '- 杂乱无章的业务动作，需用“道术器用”四层框架统摄，避免战术忙碌掩盖战略懒惰'
    - '- 总结/复盘/提问/定义问题，是连接认知与行动的基础设施'
    - '**核心定义**'
    - '- 卓越策略师五大能力：1)扎实调研能力（压倒性投入=对客户负责）；2)清晰归纳总结能力（搜尽奇峰打草稿）；3)项目管理把控全局；4)让人难以怀疑的决断力；5)双重叙事能力（对内对外）'
    - '- 道术器用四层：道=商业本质（用XX产品解决XX痛点赚XX钱）；术=9维方案（客户/价值/渠道/关系/资源/伙伴/活动/成本/收入）；器=载体工具；用=执行迭代'
    - '- 合格总结三要素：目标比对、要事实不要观点、能发现问题（完不成/完成/超额皆有问题）'
    - '- 5WHY分析法：问题=期望-现状，连问5个为什么穿透症状找根因'
    - '- 产品Idea五种构思法（成功率降序）：原生需求>抄竞品做差异>分析搜索词>预付费定制>生造idea(不推荐)'
    - '- 好名字公式：低触达/理解/记忆/传播成本+好体验理由+好延展空间'
    - '**关键性质**'
    - '- 调研是策略师的“压倒性投入”：不用脚投票的调研是瞎猜'
    - '- 总结是发现问题的工具：超额完成目标也要反思“目标是否设太低”'
    - '- 道统领术、术落地器、器服务用：四层错位（如有器无道）必导致资源浪费'
    - '**典型例子**'
    - '- 5WHY案例：老板骂我→报告晚→数据迟→同事拖→闹钟没电→根因：无备用闹钟/流程无兜底'
    - '- 产品Idea：原生idea（解决自己遇到的问题）成功率最高，需满足：真实需求+领域专家+能坚持'
    - '- 好名字：听得懂、记得住、好理解、易传播、易扩散、易延展（如“蜜雪冰城”vs“奈雪的茶”）'
    - '**边界条件**'
    - '- 五大能力非天生：均可通过刻意练习（写草稿、做复盘、带项目、背锅决策）习得'
    - '- 道术器用非一次性填表：随业务演进动态校准，道变则术器用全变'
    - '- 决断力≠独断专行：建立在调研+总结+管理基础上，并有双重叙事安抚利益相关方'
    sources:
    - paper: docs/202301-02/20230207_04.md
      role: origin
    excerpts:
    - 合格乃至卓越的策略师应具备五项综合素养：扎实的调研能力（对调研的压倒性投入就是对客户的负责）、清晰逻辑的归纳总结能力（搜尽奇峰打草稿）、把控全局的项目管理能力、让人难以怀疑的决断力、面向内外部的双重叙事能力。
    - 用道、术、器、用四个层面讲清并运行所有项目：道为商业模式的本质……术为解决方案的9个关键维度……器为载体工具平台，用为执行力与业务流迭代。
    - 问题是期望与现状的差距，无论期望大于现状还是现状大于期望；连续问5个为什么探寻真实原因。
    - 合格总结必须包含三要素：总结与目标的比对、要事实不要观点、能够帮助发现问题。
    - 从高到低按成功率排序的五种产品创意方法：原生idea、抄成功竞品做出差异化、分析搜索关键词找未满足需求、预付费定制产品化、生造idea（不推荐）。
    - 好的品牌名称应满足：低触达成本+低理解成本+低记忆成本+好体验理由+低传播成本+好的延展空间。
