    name: 买卖-生意-商业三分论 —— 看清你在哪一层，别混淆了阶段
    points:
    - '**为什么需要这个概念？**'
    - '- 创业者常混淆“自己干活赚钱”、“招人干活赚钱”、“建系统赚钱”三个层级'
    - '- 战略、组织、财务模式完全不同，混淆导致错位决策'
    - '- 需要清晰的阶段地图指引进化路径'
    - '**核心定义**'
    - '- 买卖（第一层级）：自己做所有事 = 出卖劳动力，天花板=个人时间×单价'
    - '- 生意（第二层级）：有代理商/员工/分销商 = 卖卖卖，天花板=管理半径×复制倍数'
    - '- 商业（第三层级）：建立可复制放大模式 = 卖模式/卖品牌/卖股权，天花板=资本化估值'
    - '**关键性质**'
    - '- 进化路径：买卖 → 生意 → 商业，不可跳跃，需完成上一层级验证'
    - '- 核心跃迁动作：买卖→生意 = 招人/建SOP/放权；生意→商业 = 标准化/品牌化/资本化'
    - '- 利润结构：买卖赚“辛苦钱”、生意赚“差价钱”、商业赚“时间钱/品牌溢价钱”'
    - '**典型例子**'
    - '- 买卖：自由职业者/独立开发者/小店主/带货主播（核心靠自己出镜/写代码/守店）'
    - '- 生意：蜜雪冰城（加盟模式）、华为（代理商体系）、作者捡漏群矩阵（雇佣运营/演员）'
    - '- 商业：茅台（品牌资产）、腾讯（平台生态）、星云IP计划（IP聚合生态/版权/人才/政府背书）'
    - '**边界条件**'
    - '- 多数创业者一生停留在“买卖”层级，因不愿/不敢/不会放权'
    - '- 从生意到商业需跨越“标准化/品牌化”鸿沟，极少数能跨过'
    - '- 不同层级对创始人能力要求质变：技术/业务 → 管理/组织 → 战略/资本/生态'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    excerpts:
    - 首先你要清楚的是买卖、生意、商业是三件事情，所以你做的事是需要自己去做所有事，那就是第一个阶段——靠出卖劳动力赚钱。
