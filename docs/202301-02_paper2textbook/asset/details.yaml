      role: apply
    excerpts:
    - 做股权顶层设计时考虑的核心因素，还是顶层控制权、进入机制、分配机制、退出机制。内部不乱才能更好打市场，但不存在放之四海而皆准的方案。
    - √：有操盘能力、有责任心的好人拥有公司的控制权…进入机制：资金型股东溢价进入，资源型股东对赌进入，技术型股东专利进入…分配机制：静态分配+动态调整…退出机制：退出时间约束、约定回购原则、约定回购价格。
    - 创始人身份为何是最重要的维度：它代表谁承担最大风险和兜底责任，谁就最有控制权。公司对外只能有一个声音，创始人身份必须从开始极度明确。
    - 劳动合同就等于是一把枪，而这些附件，就是子弹。你的枪再好，没有子弹也是无济于事。
    - 按照品牌方操作的难度，加盟模式一共分为四个级别六种类型：轻量级、中量级、重量级和魔鬼级。魔鬼级的加盟是最难实现的一种，我称之为卖特许权。
    - 好的名字=低触达成本+低理解成本+低记忆成本+好体验理由+低传播成本+好的延展空间
