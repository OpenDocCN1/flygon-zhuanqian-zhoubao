    excerpts:
    - 被处罚后当天不应再播，要见好就收、及时止损。
    - 一定要吸纳一位优秀的技术开发人员最好。
    - 汽车广播这个板块不建议大家做，薅羊毛的客户比较多~。这个版块我们大概扔进去 2w，水花都看不到。
    - 市面上很多打着投融资的旗号的骗子公司，他们让创始团队缴纳各种名义的费用，一定不要盲目缴纳。
    - 劳动合同等同一把枪，附件是子弹——枪再好没有子弹也无济于事。
