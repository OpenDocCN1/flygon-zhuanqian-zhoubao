    name: 合格总结三要素 —— 总结不是“写流水账”，是“找问题”
    points:
    - '**为什么需要这个概念？**'
    - '- 绝大多数总结/复盘=“记录做了什么/发了多少条/赚了多少钱”，零洞察、零改进、零价值'
