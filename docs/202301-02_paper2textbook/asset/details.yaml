    name: 高净值销售破局法 —— 卖的不是产品，是“掌控感”
    points:
    - '**为什么需要这个概念？**'
    - '- 高净值客户（HNWI）抗销售、决策理性、信息获取渠道广、传统“挖需求-讲卖点-逼单”完全失效'
    - '- 素材核心洞见：富人最大痛点不是“缺钱”也不是“缺产品”，而是“失去掌控权”（恐惧源于未知）'
    - '- 谁能帮他们找回“确定性/掌控感”，谁就能赢得依赖、拿到大单、做长久生意'
    - '**核心定义**'
    - '- 买家系统 vs 卖家系统：买家本能启动防御（撒谎/给希望/躲藏），卖家按流程走必死；破局必先跳出买家系统'
    - '- 需求 vs 痛点：需求=理性/平静/无情绪动力；痛点=情绪驱动/恐惧/焦虑/渴望 → 只有上升为痛点才会成交'
    - '- 核心痛点：失去掌控权（富一代/创一代最怕），由奢入俭难，一旦失控恐惧极大'
    - '**关键性质**'
    - '- 三步破局法：①引起好奇（反问/布置功课/谈趣味价值）→ ②上升痛点+重塑概念（建立权威）→ ③灵魂三问形成依赖（聊孩子/谈自己/谈传承）'
    - '- 信任前于成交：成交三要素（需求、信任、购买力），信任前提是提供价值解决需求，而非推销产品'
    - '- 合作思维谈判：非对立博弈，而利他共赢（帮对方省精力/加速回笼/规避风险），释放“我们是一伙的”信号'
    - '**典型例子**'
    - '- 高净值销售实战：通过“聊孩子/谈传承”切入，而非谈产品参数，建立情感连接与信任锚点（20230207_08.md）'
    - '- 闲鱼倒爷合作思维：为对方节省精力、加速资金回笼，释放利他信号促成低价收货（20230207_11.md）'
    - '- 发圈动力公式：佣金/社交压力；产品有社交货币价值（如好书展示好妈妈形象）→ 正向价值观驱动疯狂发圈（20230207_08.md）'
    - '**边界条件**'
    - '- 仅适用于高客单、高决策周期、强信任依赖的非标/半标品（保险、房产、高端医疗、家族办公、大额投资）'
    - '- 对销售人员素质要求极高：需懂心理学/财税法/资产配置/家族传承，且具备高情商与长期主义耐力'
    - '- 合规红线：严禁虚假承诺、误导销售、利用恐惧诱导，金融/保健品等强监管领域易触刑法'
    - '- 规模化难：高度依赖个人IP与非标服务，难以SOP化复制，扩张靠“合伙人/学徒制”而非标准化复制'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_08.md
      role: origin
    - paper: docs/202301-02/20230207_11.md
      role: apply
    - paper: docs/202301-02/20230207_06.md
      role: improve
    excerpts:
    - 通常当一个人你知道他是销售，你出现在他面前的时候...我们会开始自我保护起来。这些行为在买家系统里就是一个本能，叫撒谎。
    - 需求和痛点的差别在什么呢？我以为我需要这个东西，它没有什么情绪的动力。当客户很平静的时候，都是需求，不是痛点。情绪动力是客户花钱的最根本的点，大客户也逃不掉。
    - 你不用学那么多，你只要知道他最大的痛点就是失去掌控权，恐惧源于未知。对一个一直拥有掌控权的人来说更可怕。因为由奢入俭难。
    - 引起好奇的方法，我通常先反问或者是先给客户布置功课。我就对高净值客户说，我要和你谈的不是钱的问题，是一个趣味性的问题和价值的问题。
    - 采用合作思维，我和他不是对立关系，而是合作共赢，即利他思维，利他即利己，所以合作思维逻辑成立。
    - 发圈动力=佣金/设计交压力。发朋友圈介绍好书，展示出的是爱阅读爱学习爱教育的好妈妈形象，正向价值观，所以大家都疯狂发圈。
    - 成交的核心三个要素：需求、信任、购买力。成交的前提是信任，信任的前提是能提供用户需要的价值、解决用户的需求。
