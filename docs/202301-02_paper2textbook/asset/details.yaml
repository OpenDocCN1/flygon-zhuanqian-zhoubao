  life_analogy:
  - 想象做副业像**开一家“复刻名店”的加盟店**：
  - '- **选品（六维模型）** = 选一个‘已验证盈利、流程可标准化、供应链非独家’的成熟品牌，而非自创菜谱'
  - '- **拆解（商业项目拆解）** = 拿到总部的《运营手册》：选址流程（流量）、出餐SOP（转化）、中央厨房配送（交付），照单全收'
  - '- **验证（MVP/卖空气）** = 先在朋友圈发海报预售（软文先行），收够定金再向总部要货，没人买就止损换品牌'
  - '- **放大（三大杠杆）** = 用人力杠杆招店员（SOP+兼职）、技术杠杆接入外卖系统（RPA/自动化）、资源杠杆谈独家食材价'
  - '- **避坑（第7章）** = 知道‘总部可能跑路’（平台风控）、‘菜谱可能侵权’（灰色地带），所以要同时开发自有招牌菜（真产品/IP），不把命运全交给加盟品牌'
  summary:
  - concept: 信息差思维/后发制人
    desc: 副业本质是发现并复制已验证模式，而非从零发明；同行是最好的老师
  - concept: 商业项目拆解
    desc: 将成熟项目按流量-转化-交付三段式拆解，量化关键指标，提炼可迁移的SOP
  - concept: 六维评估模型
    desc: 流量/销转/交付效率（判断可复制性）+ 客单价/毛利率/复购率（判断天花板）；效率短板可用财务指标补偿
  - concept: 小说推文 vs 教育资料
    desc: 前者三高效率但低客单价/复购→天花板低；后者低流量效率但高客单价/高复购/高毛利→天花板高
  - concept: MVP先卖后做/卖空气
    desc: 先预售/软文验证需求，再低成本生产；完成第一单即验证模型，而非造完产品找买家
  - concept: 软件营销派/套话做局
    desc: 用App界面/专业感碾压纯文本；以‘已解决者’口吻引流→套同行话术→卖给‘未解决者’
  - concept: 三大杠杆放大
    desc: 人力杠杆（SOP+兼职矩阵）、技术杠杆（RPA/爬虫/批量搬运）、资源杠杆（合伙人/全球化/复购魔力）
  - concept: 野路子边界与长期主义
    desc: 安慰剂效应/侵权/平台风控是红线；需将验证思维转向真产品打造，把能力沉淀为可复利资产
  exercises:
  - 'no': 1
    title: 六维模型实战：给你的副业想法算一笔账
    contents:
    - 假设你想做一个‘考公上岸资料包’项目（虚拟资料，客单价29.9元），请按六维模型估算：
    - 1. 流量效率：小红书发笔记引流，预计日产出50个精准加微信，单条笔记制作耗时30分钟，如何计算‘单位时间获客数’？
    - 2. 销转效率：私域成交话术成熟，预计加微信后30%付费，如何计算‘流量转现金比’？
    - 3. 交付效率：支付即自动发网盘链接，耗时0，如何量化？
    - 4. 客单价/毛利率/复购率：虚拟产品毛利~100%，复购极低（买一次够用），如何评价财务天花板？
    - 回答问题：
    - '- 若想把月收入从3千提到3万，六个维度哪个最容易撬动？为什么？'
    - '- 如果改做‘考公全程陪跑班’（客单价2999元），六维模型会如何变化？交付效率下降如何补偿？'
  - 'no': 2
    title: 商业项目拆解演练：拆解一个‘小红书资料号’同行
    contents:
    - 找到一个做‘公考资料/教资资料/建筑资料’的小红书同行账号（粉丝1万-10万），按三段式拆解：
    - 1. 【前端流量】：它的笔记选题是什么？封面/标题模板长什么样？发布频次/时间？关键词布局在哪？是否有矩阵号？
    - 2. 【中端转化】：主页简介怎么写？置顶笔记是什么？自动回复/私信话术？引流钩子（免费资料/低价体验）？
    - 3. 【后端交付】：加微信后发什么？成交话术几步？交付形式（网盘/群/小程序）？是否有后端复购产品？
    - 回答问题：
    - '- 该同行的流量/转化/交付中，哪个环节最强？最弱？'
    - '- 如果你复制这个项目，哪3个关键动作必须‘照抄’，哪3个可以‘微创新’？'
  - 'no': 3
    title: MVP验证设计：卖空气测试‘AI生成简历优化服务’
    contents:
    - 你想做一个‘上传简历→AI优化→输出STAR法则版本’的服务，客单价拟定99元。请设计一个‘卖空气’验证流程：
    - 1. 软文先行：写一篇‘复述用户痛点’的小红书笔记（参考‘复述问题建立信任’技巧），标题怎么拟？封面怎么做？
    - 2. 预售页/钩子：没有产品时，用什么作为‘已有假象’？（如：演示视频/对比截图/名额限制/创始人背书）
    - 3. 验证标准：聊多少人、收多少定金/预售款，才算‘不确定因素解除’？（参考‘聊100人、20-30人付预售金’标准）
    - 回答问题：
    - '- 如果预售转化极低，是‘痛点不真’还是‘信任不够’？如何用‘套话’快速区分？'
    - '- 验证通过后，如何用‘非规范化生产’在1周内搭建可交付的最小系统？（提示：中文编程/现成API/人工兜底）'
  units:
  - 'no': 1
    name: 副业变现的底层逻辑 —— 从“看到”到“复制变现”
    points:
    - '**为什么需要这个概念？**'
    - '- 多数人做副业失败，是因为陷入“产品思维”，试图从零发明产品，却忽略了商业的本质是发现并复制已验证的模式'
    - '- 素材中三位作者（夕子、老杨、胖龟）的共同成功路径均是：拆解同行 -> 验证需求 -> 低成本复制 -> 放大'
    - '**核心定义**'
    - '- 副业变现的本质不是“做产品”，而是“解项目、算账、走流程”'
    - '- “后发制人”：利用已验证项目的成熟链路（流量、转化、交付），避开试错成本'
    - '**关键性质**'
    - '- 信息差即核心壁垒：你知道而别人不知道的“已验证路径”就是钱'
    - '- 复制优于创新：成熟商业模式“换汤不换药”，新客户群体不断涌现，十年前的项目今天依然可做'
    - '- 执行力可变现：持续的执行力本身具有经济价值，可被奖励（如宝妈加好友号被高价收购）'
    - '**典型例子**'
    - '- 夕子：从皮肤痛点出发，付费学习 -> 小红书爆款 -> 私域高客单 -> 自建品牌 -> 开放加盟，年利润百万'
    - '- 老杨：TikTok睡播，用简陋直播间跑通MVP -> 1+1+1项目矩阵（盈利/开发/知识付费）持续造血'
    - '- 胖龟：0中介费找房，用“蹭流截流”低成本获客 -> 城市合伙人制度标准化复制 -> 第一年104.7万营收'
    - '**边界条件**'
    - '- 仅适用于“已有人盈利且流出”的项目，纯科研型/硬核技术壁垒项目不适用'
    - '- 核心风险：平台规则变更导致流量链路失效（如抖音打击无人直播、引流），需持续关注平台红利窗口'
    - '- 认知前提：必须承认“商业英雄是平台红利的产物”，避免陷入“个人能力决定论”的幸存者偏差'
