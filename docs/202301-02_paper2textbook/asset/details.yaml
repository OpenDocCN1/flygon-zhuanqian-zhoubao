    excerpts:
    - 我们推演了很多，也会见了很多房东，最后我们找准了二房东这个渠道。因为二房东手上不单单就一间房子，他需要快速的让自己的房子租出去不能有空置，因为每空置一天，房租的费用就需要自行来承担。
    - 配房-带看-成交标准流程...由后台人员，根据租户提供的租房需求，按照公司的房源表进行精准匹配房源...引导客户自己去看房...联系房源所属的房东，二房东，管理公司等，在最短的时间内到房间内给客户签署租房合同...
