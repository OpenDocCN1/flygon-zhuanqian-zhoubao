    sources:
    - paper: docs/202301-02/JPRAdLgGFowUE7xargGc8YNjnzh.md
      role: origin
    excerpts:
    - 千万不要自己闷头苦想，因为你的认知基础薄弱，你想半天想出来的很可能归因逻辑就是错的。思维是一定要通过不断输入才能得到提升的，踩着巨人的肩膀，你会看到更广阔的天空。
    - 建议大家看三类，可以先从【故事类】的内容看起，然后去看一些【评论类】的内容，最后再去看一些【商业类】的内容。
