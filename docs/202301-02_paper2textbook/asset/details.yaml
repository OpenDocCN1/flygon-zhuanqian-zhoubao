    name: 地毯式阅读法 —— 打破信息茧房的“强制全餐”
    points:
    - '**为什么需要这个概念？**'
    - '- 算法推荐强化“只看爱看”，导致认知边界固化、错过跨界机会'
    - '- 主动挑选阅读等于“用旧地图找新大陆”，无法发现未知盲区'
    - '- 需要一种强制性、系统性的输入方式重构知识图谱'
    - '**核心定义**'
    - '- 拒绝“挑喜欢的主题或人”，对指定专栏/书单/合集做“一篇不漏”的通读'
    - '- 读完即记录、即拆解、即举一反三，形成输入-处理-输出闭环'
    - '**关键性质**'
    - '- 打破信息茧房：强制接触陌生领域、反直觉观点、非舒适区知识'
    - '- 建立“异常值敏感度”：只有看全量才能识别出数据分布尾部的蓝海信号'
    - '- 训练“结构化阅读力”：从碎片摄入转向体系构建'
    - '**典型例子**'
    - '- 作者通读《生财有术项目精选》50篇，发现“除甲醛不仅是除甲醛，还要除掉客户心中误认为是甲醛的异味”等跨行业洞察'
    - '- 打破了“只做电商才用蓝海选品”的认知局限，将其迁移到内容生产、视频制作等全品类'
