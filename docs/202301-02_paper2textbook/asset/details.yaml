    name: 对标账号筛选标准体系 —— 让素材源“自带过滤器”
    points:
    - '**为什么需要这个概念？**'
    - '- 直接搬运头部大号视频易被判搬运、限流，且大号素材常带水印、字幕、个性化强、去重难'
    - '- 需要一套可量化、可执行的筛选标准，在海量账号中精准定位“适合搬运/对标”的优质素材源'
    - '- 标准需覆盖：账号体量、内容垂直度、更新频次、画面干净度、素材可用性等多维度'
    - '**核心定义**'
    - '- 核心指标阈值：粉丝 ≤ 5 万、视频数 ≥ 200 条、近 30 天持续更新'
    - '- 内容特征：围绕 3-5 款固定垂直品反复带货（素材稳定）、画面干净无自带字幕/水印（去重成本低）、穿插非带货内容（账号真实、非纯营销号）'
    - '- 评分模型：按上述指标加权打分，Top 20% 纳入“种子对标账号库”，每周自动巡检更新'
    - '**关键性质**'
    - '- 低搬运风险：小号素材被平台/同行监测到的概率低，去重后过原创审核率高'
    - '- 高素材产出：视频量大、更新勤、品固定，单账号可持续供给数月素材'
    - '- 可监控性：指标均为公开数据，可通过 RPA 定时抓取自动评分预警'
    - '**典型例子**'
    - '- 筛选“家居清洁”类目：从 500 个账号中筛出 12 个种子账号（粉丝 1-3 万、视频 300+、只卖 3 款拖把、画面纯实拍），月均产出可用素材
      80+ 条'
    - '- 发现某账号突然停更 10 天，自动评分跌出库，及时替换为新晋账号，保证素材源鲜活'
    - '**边界条件**'
    - '- 标准阈值随平台算法迭代需动态调整（如粉丝上限从 5 万放宽至 10 万）'
    - '- 仅适用“实物带货/演示型”视频，不适用口播、剧情、混剪等依赖人设/剪辑的内容形态'
    - '- 需配合法律审核：确认素材账号授权或属于合规二创范围，避免侵权纠纷'
    - '...'
