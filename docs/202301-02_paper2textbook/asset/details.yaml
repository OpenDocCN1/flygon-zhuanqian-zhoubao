    name: 股权顶层设计四要素 —— 从“分蛋糕”到“设计游戏规则”
    points:
    - '**为什么需要这个概念？**'
    - '- 90%创业团队死于内斗，核心是股权模糊、机制缺失、预期不一、退出无门'
    - '- 平均分配/大哥说了算/投钱多占股多，均为原始粗暴模式，无法支撑规模化与融资'
    - '- 素材提供系统性框架：控制权/进入/分配/退出四维设计，内部不乱才能外部打市场'
    - '**核心定义**'
    - '- 顶层控制权：有操盘能力、有责任心的好人拥有控制权（AB股/一致行动/否决权），对外仅一个声音'
    - '- 进入机制：资金型溢价入、资源型对赌入、技术型专利入，拒绝“情怀入股/关系入股”'
    - '- 分配机制：静态分配（启动时）+ 动态调整（里程碑/贡献/绩效），预留期权池（10-15%）激励核心骨干'
    - '- 退出机制：时间约束（如4年归属/1年悬崖）、回购原则（原价/净资产/估值）、回购价格、优先清算权'
    - '**关键性质**'
    - '- 股权是动态契约：非一次性切蛋糕，而是随阶段、贡献、风险动态调整的利益捆绑工具'
    - '- 控制权>收益权：创始人必须掌握控制权（>67%或AB股/一致行动），否则战略随大股东意志漂移'
    - '- 合同是枪、附件是子弹：股权协议+章程+投资协议+期权计划+回购协议+保密/竞业协议，缺一不可（20230207_08.md）'
    - '- 五步法量化：岗位权重×时间投入×资金投入×创始人身份×资源价值，自评互评达成共识（20230207_03.md）'
    - '**典型例子**'
    - '- 胖龟找房：城市合伙人制（平台给房源库/配房/流程，合伙人维用户）→ 8店/287会员/104.7万首年营收→迭代后月入15万（20230207_06.md大纲Ch4节点3）'
    - '- 作者股权实操：五步法计算比例只是起点，仍需一致行动权/期权池/分红/回购/优先清算/领售权等合同规范（20230207_03/06.md）'
    - '- 融资避坑：警惕收各种费用的骗子公司，正规机构不收前置费，最好有人推荐背书（20230207_03.md）'
    - '**边界条件**'
    - '- 无通用标准模板：每家公司业务模式/阶段/团队/愿景不同，方案须定制，照搬模板必坑'
    - '- 法律强制约束有限：公司法/合同法兜底，但商业博弈中“契约精神”常失效，靠信任/利益捆绑/声誉约束更实在'
    - '- 早期过度设计=束缚：种子期/天使期核心是活下来、跑通模型，复杂股权结构反而增加沟通成本、吓退投资人'
    - '- 人性贪婪恐惧：利益面前契约脆弱，唯有“利益绑定+价值观共鸣+利他文化”能延长团队半衰期'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_03.md
      role: origin
