    - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
      role: apply
    excerpts:
    - 任何项目都可以拆解成：「流量效率，销转效率，交付效率，客单价，毛利率，复购率」，这六个点
    - 「六个点，满足的越多越好，满足四个点，及格」
    - 流量效率高，意味着内容极其好复制，可以通过矩阵，培训等方式，把这一块单独拎出去，进行放大。
    - 如果流量效率，销转效率，交付效率，这三块有一块低的话，就很难复制放大，那就得在客单价，毛利率，复购率这三块下功夫，比如通过提高客单价来增加收入。
    - 小说推文项目：月收益1000~2W。流量效率高...销转效率高...交付效率高...客单价低...毛利率高...复购率低
    - 教育资料2.0项目：月收益2W~100W...客单价低：几千到十几二十万不等，毛利率高：10%...
    - 项目拆解商业IP...流量效率低...交付效率低...客单价高：从几千到六位数。毛利率高：70%以上
    - 知识付费...月收益10W~500W...流量效率高...销转效率高...交付效率高...毛利率高：100%
  'no': 6
- learning_targets:
  - 理解商业项目拆解的核心逻辑：从“赚钱的别人”拆出“可复制的零件”
  - 掌握六维评估模型（流量/销转/交付效率、客单价/毛利率/复购率）给项目算“复制账”
  - 熟练运用“卖空气”预售验证与“非规范化生产”快速捏出产品模型
  - 掌握软文撰写三板斧：复述问题建立信任、超长文博取算法、过审艺术保存活
  - 理解“有效噱头/安慰剂效应”与“软件营销派”的认知套利底层逻辑
  - 掌握“套话做局”与“信息差搬运”零成本获取方案与流量的高阶玩法
  - 建立“前端流量定生死”的认知，学会“喂养算法”与“下拉词挖需求”搭建情报库
  - 掌握项目管理“双案法”（策划案定方向+执行案保落地）与“止损点”设定
  - 理解三大杠杆（人力/技术/资源）放大收入的层级与前提条件
  - 认清红海赛道“后发制人”的确定性优势，避开“正统的病”与“自嗨式创新”
  concept_map:
  - 副业变现实战体系（第7章核心）
  - ├── 核心方法论：商业项目拆解
  - │   ├── 八步拆解法：找项目→拆流量/转化/交付→评估可复制性→定策略/团队/执行
  - │   ├── 可复制性判定三标准：爆款非偶然、货源可寻、场景验证有需求
  - │   └── 信息差搬运论：A平台烂内容→优化→B平台爆款（跨平台套利）
  - ├── 评估决策工具：六维评估模型
  - │   ├── 效率维度（定可复制性）
  - │   │   ├── 流量效率（时间/素材/流量）
  - │   │   ├── 销转效率（专业度/SOP/一对多）
  - │   │   └── 交付效率（时间/人力）
  - │   ├── 财务维度（定收入上限/补偿短板）
  - │   │   ├── 客单价
  - │   │   ├── 毛利率
  - │   │   └── 复购率
  - │   └── 及格线：满足4/6维；效率短板→财务补
  - ├── 产品验证与生产：极低成本闭环
  - │   ├── 卖空气/预售验证：制造“已有”假象→先收钱/测需求→卖不动止损
  - │   ├── 非规范化生产：野路子/中文编程/现成组件→1周内出模型
  - │   └── 软件本质即软文：反推开发流程，甚至不开发找现成交付
  - ├── 内容与转化技术：算法与人性套利
  - │   ├── 软文三板斧：复述问题(信任) + 超长文(算法/SEO) + 过审艺术(生存)
  - │   ├── 有效噱头/安慰剂效应：好名字/包装改变认知→驱动购买(边界:合法/兑现)
  - │   ├── 软件营销派：App界面碾压纯文本，门槛筛选精准用户+强制分享裂变
  - │   └── 套话做局：“已解决”口吻引同行→套方案→卖给未解决者
  - ├── 情报获取与需求发现
  - │   ├── 喂养算法：点赞/收藏/停留驯养商业情报猎犬(专号/垂直/1-2月)
  - │   └── 下拉词挖需求：搜索框自动补全=实时真实用户意图(跨平台互验)
  - ├── 项目管理与风控
  - │   ├── 双案法：策划案(货盘分层/里程碑/止损点/放大点) + 执行案(表格化管控/红绿标记)
  - │   └── 止损前置：时间/金钱/资源上限→到点未果果断切割(大闸蟹教训)
  - └── 放大增长：三大杠杆
  - '    ├── 人力杠杆：SOP+低成本兼职(5-10min/条/按果付费)'
  - '    ├── 技术杠杆：爬虫/RPA/伪原创/矩阵管理系统(边际成本最低)'
  - '    └── 资源杠杆：资金投流/人脉合伙/渠道置换(门槛高/非核心)'
  life_analogy:
  - 想象副业变现是一场**“拆解名表、组装复刻、批量卖表”**的游戏：
  - '- **商业项目拆解** = 拿放大镜拆解劳力士：不看表面光鲜，只拆机芯(流量)、发条(转化)、表带(交付)三大核心零件'
  - '- **六维评估模型** = 给复刻表算账：走时准不准(效率维度)、卖价高不高(客单价)、利润厚不厚(毛利率)、客户会不会回购换表带(复购率)'
  - '- **卖空气** = 先做张精美海报(预售页)发朋友圈收定金：定金够多再买机芯组装，定金不够直接退款、不亏一分钱'
  - '- **非规范化生产** = 不走瑞士钟表厂正规流程，用3D打印+淘宝零件1周拼出能走时、能戴手上的“野路子”样机'
  - '- **软文三板斧** = 卖表话术：先复述客户“手腕细/怕掉/想装X”痛点(信任) → 甩出100页画册(超长文/专业感) → 换个合规标题“高端商务配饰图鉴”过广告审核'
  - '- **有效噱头/安慰剂** = 表盘印个“航天级防震/量子隐形”名字：机芯还是那块，但客户戴上就觉得“稳了”，甚至真抗摔了(心理暗示)'
  - '- **软件营销派** = 别人发参数表(软营销)，你直接塞块会走的电子样机进客户手里(逼真App) → 客户一把玩：“这表真牛”，哪怕指针是贴纸'
  - '- **套话做局** = 发帖：“我已经搞定劳力士机芯渠道了” → 吸来同行大佬 → 反问“大佬们渠道咋搞定的？” → 整理卖给想搞渠道的小白'
  - '- **信息差搬运** = 把北京秀水街卖烂了的款式，优化包装运到三四线县城夜市 → 当地人从没见过 → 瞬间爆单'
  - '- **喂养算法** = 每天去名表论坛点赞收藏“拆解贴/渠道贴” → 算法把你标记为“表商” → 首页天天刷到同行爆款/新渠道/避坑指南'
  - '- **下拉词挖需求** = 在淘宝搜“劳力士” → 下拉出“劳力士绿水鬼/劳力士保养/劳力士回收” → 这就是用户真在搜、真在愁、真在买的细分生意'
  - '- **双案法/止损点** = 开表行前先立军令状(策划案)：引流款(石英表)/盈利款(机械表)/高利款(镶钻表)；周周核账(执行案/红绿标)；亏超5万/3个月不回本即关门止损'
  - '- **三大杠杆** = 人力：招兼职按SOP发朋友圈卖表；技术：软件批量采集同行朋友圈/自动发圈/群发；资源：找表厂老板谈独家授权/借钱投流'
  - '- **红海不红/后发制人** = 表市场再红，也不缺一个年入百万的表商；别去发明新机芯(0-1创新)，去复制成熟款做微调(1-N复制)才是正道'
  summary:
  - concept: 商业项目拆解
    desc: 从爆款内容逆向提取流量/转化/交付三大模块，按八步法标准化输出可复制SOP
  - concept: 六维评估模型
    desc: 流量/销转/交付效率(定可复制性) + 客单价/毛利率/复购率(定收入/补短板)，满四及格
  - concept: 卖空气/预售验证
    desc: 产品不存在时制造假象先收钱测需求，卖得动再开发，卖不动即止损，零沉没成本
  - concept: 非规范化生产
    desc: 个人开发者专用：抛弃正规流程，用野路子工具1周内捏出可演示、可交付、可卖的模型
  - concept: 软件本质即软文
    desc: 软件最终靠软文推广，故可反推：先写软文卖预售，卖得动再开发或找现成交付
  - concept: 软文三板斧
    desc: 复述问题(建立信任锚点) + 超长文(骗算法/博停留/覆盖长尾) + 过审艺术(干净截图+合集模板+隐性引导)
  - concept: 有效噱头/安慰剂效应
    desc: 好名字/包装/故事改变用户认知驱动购买(连花清瘟案例)，边界在合法承诺兑现与核心功能不完全失效
  - concept: 软件营销派
    desc: 逼真App界面/演示视频碾压纯文本攻略：专业感溢出+下载门槛筛选精准用户+强制分享裂变
  - concept: 套话做局
    desc: 以“已解决”口吻写软文引同行→反问套取真方案→包装卖给未解决精准客户，零成本研发
  - concept: 信息差搬运论
    desc: 渠道间天然信息差：A平台烂内容经优化搬运到B平台成爆款，核心公式=爆款内容×平台适配优化
  - concept: 喂养算法
    desc: 主动点赞/收藏/停留商业内容1-2月，驯养算法模型持续推送精准商业案例，建立专属情报流
  - concept: 下拉词挖需求
    desc: 利用搜索框自动补全捕捉实时真实用户意图，跨平台互验的词=超级强需求，免费且超前
  - concept: 项目管理双案法
    desc: 策划案管方向(货盘分层/目标/里程碑/止损点/放大点) + 执行案管落地(时间/地点/事项/责任人/红绿标)
  - concept: 止损点
    desc: 启动前设定时间/金钱/资源上限，到点未达标果断切割，避免沉没成本(大闸蟹案例：不喜欢不碰)
  - concept: 三大杠杆放大
    desc: 技术杠杆(爬虫/RPA/矩阵系统) > 人力杠杆(SOP+兼职) > 资源杠杆(资金/人脉)，前提：单点跑通+SOP化
  - concept: 红海不红/后发制人
    desc: 任何红海赛道不缺年入几十万的人，核心找已验证项目做微调(换平台/人设/包装/钩子/交付)而非盲目创新
  exercises:
  - 'no': 1
    title: 实战演练：六维模型给某项目“算账”
    contents:
    - 选取一个你熟悉的副业项目（如：小说推文、知识付费课程、闲鱼无货源、小红书艺术签名、抖音书单号等），按六维模型逐项打分（高/中/低）并简述理由：
    - 1. 流量效率：获取流量耗时？素材难度？流量规模？
    - 2. 销转效率：需不需要高专业度？能否SOP化一对多？
    - 3. 交付效率：付款后需人工介入多久？能否自动化？
    - 4. 客单价：单次交易金额？
    - 5. 毛利率：扣除直接成本后利润占比？
    - 6. 复购率：用户会不会二次购买？
    - 判断题：该项目三效率是否全高？若有一项低，靠哪三个财务指标补偿？是否满足“四维及格线”？
    - 思考：若要把该项目从月入3千放大到月入3万，优先拉动哪个杠杆（人力/技术/资源）？为什么？
  - 'no': 2
    title: 实战演练：7天“卖空气”预售验证挑战
    contents:
    - 构思一个你想做但不确定需求的微型产品（如：某垂类资料合集、小工具脚本、付费社群入场券、定制化模板等），执行以下步骤：
    - 1. 定痛点：用“复述问题”法写一段200字文案，罗列目标用户3-5个具体症状/焦虑
    - 2. 做预售页：用笔记/海报/表单/朋友圈制造“产品已就绪/内测招募”假象（截图/目录/交付时间/价格/退款承诺）
    - 3. 投流测试：在精准社群/朋友圈/小号评论区投放预售文案，统计：曝光数、点击数、咨询数、支付意向数、实际成交数
    - 4. 决策：若成交转化率>5%且单价>成本→立即启动非规范化生产交付；若<5%→直接退款/道歉/止损，复盘痛点是否伪需求
    - 复盘问题：预售文案的“复述问题”部分用户反应如何？超长文/合集模板是否提升了停留？有无触碰审核红线？
  - 'no': 3
    title: 实战演练：喂养算法+下拉词 双轮驱动建立项目库
    contents:
    - 新注册/备用一个抖音/小红书/公众号账号，执行14天情报采集实验：
    - 第1-7天（喂养算法）：每天固定30分钟，仅点赞/收藏/完读/评论“副业案例/项目拆解/商业模式/赚钱实操”类内容，记录算法推荐内容的商业价值占比变化（第1天
      vs 第7天）
    - 第8-14天（下拉词挖需求）：每天选3个核心词（如：副业、变现、引流、私域、选品、IP、AI、小程序），在抖音/小红书/微信/百度/应用商店搜索框输入，记录所有下拉长尾词，去重后建立“需求词库”
    - 产出：整理一份《第7章实战项目库》飞书文档，含：项目名称、来源(算法推荐/下拉词/搜索)、赛道、渠道、流量模式、转化模式、交付模式、客单价、可复制性打分(1-5分)、止损点设定
    - 挑战：从中筛选出1个“三效率均高、财务指标至少1项高、止损点清晰、你有资源优势”的项目，写出《策划案》草稿（货盘/里程碑/止损点）
  - 'no': 4
    title: 实战演练：拆解一个“信息差搬运”跨平台机会
    contents:
    - 在抖音/快手搜索一个已饱和的热门赛道关键词（如：减肥食谱、英语启蒙、装修避坑、宝宝辅食），找到3个点赞>10w、评论区大量求资源/求购买的爆款视频
    - 分析其：内容结构(前3秒钩子/中间干货/结尾引导)、标题关键词、评论区高频需求词
    - 去小红书/视频号/公众号搜索同赛道，对比前10名内容的：标题差异、封面风格、节奏快慢、引导方式、违规风险点
    - 制作1条“优化版搬运内容”发布在目标平台：换标题(植入下拉长尾词)、换封面(高对比度/强引导)、调节奏(前3秒更猛/中间加字幕/结尾硬广)、加合集标签
    - 连续发布7天，记录：播放/阅读、点赞/收藏/评论、私信/评论区咨询量、转化加微信数
    - 复盘：哪个平台的“信息差红利”最大？搬运优化的边际成本是多少？是否触发原创保护/水印检测？如何规避？
  - 'no': 5
    title: 实战演练：软件营销派 vs 软营销派 A/B 测试
    contents:
    - 选一个你能搞定的微型工具/脚本/资料包（如：批量重命名工具、去水印脚本、考研资料合集、简历模板包），制作两套推广物料：
    - A版（软营销/纯文本）：一篇3000字超长图文/笔记，含复述问题+详细教程/目录+合集截图+隐性引导加微信
    - B版（软件营销派）：一个可点击的网页/H5/小程序/企微应用演示页，含逼真UI界面截图/交互演示GIF/核心功能按钮(点击弹窗引导分享/加微信解锁)
    - 在同一私域流量池/社群/朋友圈不同时段各发一次，统计：点击率、分享率、加微信转化率、最终成交率
    - 分析：B版的“下载/使用门槛”是否过滤了看客？强制分享裂变是否带来额外曝光？A版的超长文SEO长尾流量长期价值如何？
    - 决策：你的主力推广形态选A还是B？还是A引流+B转化？
  units:
  - 'no': 1
    name: 商业项目拆解 —— 把“赚钱的别人”拆成“可复制的零件”
    points:
    - '**为什么需要这个概念？**'
    - '- 绝大多数副业失败源于盲目创新，成功者都在复制已验证模式'
    - '- 需要一套标准化方法，将别人的成功案例转化为自己的可执行方案'
    - '- 避免“瞎折腾”，把时间花在拆解确定性项目上'
    - '**核心定义**'
    - '- 从爆款内容中逆向提取：流量获取方式、转化链路、产品交付模式三大核心模块'
    - '- 不是模仿表面文案，而是拆解底层商业逻辑：赛道（卖什么）、渠道（客户在哪）、转化（怎么成交）'
    - '**关键性质**'
    - '- 可迁移性：拆解出的SOP可直接套用或微调复用'
    - '- 低成本验证：先拆解再决策，规避All in风险'
    - '- 信息差属性：同一项目跨平台搬运即可产生新机会'
    - '**典型例子**'
    - '- 儿童游乐项目：拆解挖掘机视频→复制内容模式→3个月变现40万'
    - '- 文川手写Logo：拆解设计账号→外包大学生设计→赚中间差价'
    - '- 艺术签名：拆解签名账号→免费素材网交付→月入几千'
    - '**边界条件**'
    - '- 仅适用于“货源非独家、场景验证有需求、爆款非偶然”的项目'
    - '- 需具备基础内容生产能力，纯小白需先练基本功'
    - '- 赛道红利期有限，需结合平台周期判断入场时机'
    sources:
    - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
      role: origin
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: improve
    excerpts:
    - 拆下来之后，我就发现很多时候有些项目是完全可以复制的，是不需要投入几十万也可以复制的。复制了之后，用跟他一样的内容生产方式、转化链路，你也能拿到一定的结果。
    - 通过刷抖音或者刷小红书的过程发现商业案例，再拆解复制这样的案例去形成一个商业模式，去发展自己的副业。
    - 所以直接拿软文，最终形式。反推开发流程，甚至不开发软件，而是寻找类似的软件给客户使用。
  - 'no': 2
    name: 六维评估模型 —— 给项目算一笔“复制账”
    points:
    - '**为什么需要这个概念？**'
    - '- 直觉判断项目靠谱与否极不靠谱，需要量化尺子'
    - '- 必须区分“效率维度”（能不能复制放大）与“财务维度”（能赚多少钱）'
    - '- 避免陷入“高流量但不赚钱”或“高客单但跑不通”的陷阱'
    - '**核心定义**'
    - '- 将任意商业项目拆解为六个可量化指标：流量效率、销转效率、交付效率、客单价、毛利率、复购率'
    - '- 前三个为效率维度（时间/素材/专业度），后三个为财务维度（价格/利润/复购）'
    - '**关键性质**'
    - '- 三效率全高：赚多赚少只看流量，可矩阵化/培训放大'
    - '- 任一效率短板：必须靠高客单、高毛利、高复购补偿收入'
    - '- 及格线：六维满足四个以上为合格项目'
    - '**典型例子**'
    - '- 小说推文：三效率全高，但客单价低/复购低→月入1k-2w天花板'
    - '- 教育资料2.0：引入高客单合作转化→月入2w-100w量级跃迁'
    - '- 项目拆解IP：流量/交付效率低，靠高客单价/高毛利补偿→月入10w-200w'
    - '- 知识付费：六维全满足（毛利100%）→月入10w-500w顶级模型'
    - '**边界条件**'
    - '- 仅作相对评估工具，不替代市场测试'
    - '- 行业特性不同，指标权重需动态调整（如重资产行业交付效率天然较低）'
    - '- 数据来源必须真实，杜绝幸存者偏差'
    sources:
    - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
      role: origin
    excerpts:
    - 任何项目都可以拆解成：「流量效率，销转效率，交付效率，客单价，毛利率，复购率」，这六个点
    - 「六个点，满足的越多越好，满足四个点，及格」
    - 流量效率高，意味着内容极其好复制，可以通过矩阵，培训等方式，把这一块单独拎出去，进行放大。
    - 如果流量效率，销转效率，交付效率，这三块有一块低的话，就很难复制放大，那就得在客单价，毛利率，复购率这三块下功夫
  - 'no': 3
    name: 卖空气 —— 制造“已有”的假象来预售验证
    points:
    - '**为什么需要这个概念？**'
    - '- 传统“先开发后售卖”周期长、沉没成本高、死于无人买单'
    - '- 需要极低成本在开发前验证真实付费意愿'
    - '- 解决“需求假象”：用户口头说要≠真掏钱买'
    - '**核心定义**'
    - '- 产品不存在时，用模型、截图、预售页制造“产品已就绪”假象，先收钱/测需求'
    - '- 核心逻辑：软件本质是软文，先写软文卖预售，卖得动再开发，卖不动直接止损'
    - '**关键性质**'
    - '- 反直觉：越早收钱越安全，免费试用反而验证不了商业价值'
    - '- 非欺诈：承诺交付时间，买不出去退款，卖得出去再补交付'
    - '- 配合“非规范化生产”：1周内捏出模型即可开卖'
    - '**典型例子**'
    - '- 淘客API问题：用“已解决”口吻写软文→吸引同行加微→套话→卖方案赚几十万'
    - '- 羊了个羊：P图999999分截图→以“已开挂”口吻吸粉→游戏爆火后套真外挂变现'
    - '- 礼包软件：根本领不到礼包，但评论区全是“我领到了”的集体幻觉'
    - '**边界条件**'
    - '- 必须明确告知预售/交付周期，不可无限拖延'
    - '- 核心痛点必须真实存在，不能编造伪需求'
    - '- 法律红线：虚假宣传、收费不发货属违法，边界在“承诺兑现”'
    sources:
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: origin
    excerpts:
    - 或者直接做个模型，上架开卖，卖空气，卖预售。卖不出去就没必要继续做了！
    - 多年经验总结一个观点：软件的本质就是软文。软件开发出来，怎么推广？还是通过写文章，发广告，介绍你这个软件，软件的最终的展现方式还是软文
    - 我将这个问题用：已经解决的口吻写出来，软文中附加微信号，之后每天都有淘客大佬加我...总有解决的，也总有没解决的。把解决的套出来，卖给精准的，没解决的客户，直接盈利几十万！
    - 个人开发者研发一个软件的时间不应超过1周，超过1周的软件产品不适合个人开发者！
  - 'no': 4
    name: 非规范化生产 —— 用“野路子”快速捏出产品模型
    points:
    - '**为什么需要这个概念？**'
    - '- 正规开发流程（需求文档、评审、测试、上线）对个人开发者太重、太慢'
    - '- 个人核心优势是“快”，必须用最笨但最快的工具跑通闭环'
    - '- 避免“正统的病”：没正统的命，得了正统的病（过度工程化）'
    - '**核心定义**'
    - '- 放弃规范流程，用中文编程、低代码、现成组件拼装，1周内产出可演示模型'
    - '- 核心原则：降低成本、提升效率、贴近用户、靠近需求'
    - '- 产出物：不一定是完美代码，但必须是“能跑、能看、能卖”的模型'
    - '**关键性质**'
    - '- 时间箱：单项目研发≤1周，超时即砍'
    - '- 工具无关：能解决问题的都是好工具（中文编程、RPA、现成API）'
    - '- 交付导向：不写文档、不写测试、不重构，只做能给用户演示的东西'
    - '**典型例子**'
    - '- 用中文编程工具1天搭建小程序雏形'
    - '- 直接调用现成AI接口封装成“AI绘画小程序”上架变现'
    - '- 找现成开源项目改UI、改文案、换包名直接上架'
    - '**边界条件**'
    - '- 仅适用于MVP验证期，规模化后需重构'
    - '- 核心逻辑复杂的项目（如支付、加密）不适用'
    - '- 团队协作场景需建立最低代码规范'
    sources:
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: origin
    excerpts:
    - 个人开发者需要的是'非规范化生产'俗称野路子
    - 非规范化生产的核心是：'降低成本''提升效率'
    - 就怕个人开发者'没有正统的命，得了正统的病！'
    - 个人开发者研发一个软件的时间不应超过1周，超过1周的软件产品不适合个人开发者！
    - 使用《中文编程工具》，不会英语也能快速入门
  - 'no': 5
    name: 软文撰写三板斧 —— 复述问题、超长文、过审艺术
    points:
    - '**为什么需要这个概念？**'
    - '- 内容平台流量分发靠算法，不懂算法偏好=自嗨'
    - '- 用户不信任你，根本不加微信、不下单'
    - '- 审核机制是生死线，触碰红线=封号清零'
    - '**核心定义**'
    - '- 复述问题：罗列用户症状/痛点，建立“懂你”的信任锚点（如医生问诊）'
    - '- 超长文：故意拉长字数、增加停留时间，骗过算法判定为“专业优质”'
    - '- 过审艺术：干净截图+合集模板+隐性引导，让审核员觉得“无害/专业”而通过'
    - '**关键性质**'
    - '- 信任前置：复述问题解决“信不信”，超长文解决“专不专”，过审解决“存不存”'
    - '- SEO红利：超长文天然覆盖长尾词，获得搜索流量'
    - '- 模板化：合集/大全/汇总标题可批量复用'
    - '**典型例子**'
    - '- 看病问诊类比：医生复述症状→患者信任→哪怕不开药也信服'
    - '- 15页材料秒过审：2页被拒→凑15页乱七八糟材料→秒过'
    - '- 知乎长文机制：200字见联系方式→先收藏点赞→以后根本不看'
    - '**边界条件**'
    - '- 复述问题≠编造问题，必须基于真实用户调研'
    - '- 超长文前20%必须有干货，全是水=用户举报+算法降权'
    - '- 过审技巧随平台规则迭代失效，核心仍是“提供价值”'
    sources:
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: origin
    excerpts:
    - 举例：就拿看病举例子，医生会问你：'有没有这个症状？有没有那个症状？'结果你发现：'都是我现在的症状'，所以你认为这个医生懂你的病，这次找对了！
    - 文超长，字超多，审核员懒得看，就行了！可使用：合集、大全、汇总，之类模板，增加文章字数！
    - 用户在你这个文章的页面停留的时间越长，搜索引擎就会觉得你这个文章更专业
    - 核心是让自己变得至少看起来是无害的。
    - 之前提交一个证明材料，只提交了2页直接给我拒绝了，后面我乱七八糟提交了15页秒过。
  - 'no': 6
    name: 有效噱头与安慰剂效应 —— 好名字能改变固有事实
    points:
    - '**为什么需要这个概念？**'
    - '- 打破“产品必须解决需求”的教条，承认认知偏差的商业价值'
    - '- 理解“名字决定认知、认知决定支付”的心理机制'
    - '- 区分“合法营销包装”与“欺诈诈骗”的伦理边界'
    - '**核心定义**'
    - '- 安慰剂效应：产品无实质功效，但因用户相信有效而产生正向反馈（康复率30%+）'
    - '- 有效噱头：好名字、好包装、好故事改变用户固有认知，驱动购买决策'
    - '- 连花清瘟案例：名字取得好（连翘+金银花+清瘟），改变“大感冒用抗生素”固有事实'
    - '**关键性质**'
    - '- 心理账户：用户买的不是功能，而是“确定性”和“安心感”'
    - '- 传播杠杆：好名字自带传播属性，降低获客成本'
    - '- 护城河：品牌认知一旦建立，比功能壁垒更持久'
    - '**典型例子**'
    - '- 礼包软件：根本领不到礼包，评论区全是“我领到了”的虚假好评'
    - '- 羊了个羊P图：999999分截图→吸粉→套真外挂变现'
    - '- 连花清瘟：疫情期大卖，核心是名字击中“清瘟”心理锚点'
    - '**边界条件**'
    - '- 红线：涉及医疗、金融、安全领域的虚假宣传属违法'
    - '- 底线：核心功能完全失效且无退款机制=诈骗'
    - '- 长期：纯靠噱头无复购，生命周期极短，需转型真产品'
    sources:
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: origin
    excerpts:
    - 但还有一个观点没说，那就是：'不解决需求'，'也不是好的产品'，并不会影响赚钱的速度！
    - 医学上有一种安慰剂效应，说白了就是诈骗效应。一个糖豆卖的特别贵，就说这是救命药，你吃了也真管用，患者的康复率30%以上！
    - 连花之所以大卖，就是名字取得好，事实证明起个好名字，真的可以改变固有事实！
    - 早些年做个礼包软件，根本领不到礼包，但应用商店评论区：'我领到了','是真的我也领到了'
  - 'no': 7
    name: 软件营销派 —— 用“魔法打败魔法”的碾压逻辑
    points:
    - '**为什么需要这个概念？**'
    - '- 纯文本攻略（软营销）信任度低、转化弱、易被同质化'
    - '- 用户心智中“软件问题用软件解决”更具说服力'
    - '- 需要一种更高维度的营销形态碾压同行'
    - '**核心定义**'
    - '- 制作逼真App界面/演示视频/交互原型，替代纯文本教程'
