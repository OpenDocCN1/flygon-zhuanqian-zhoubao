    name: 渣男思维做内容 —— “撩完就跑”抓人心，“广撒网”提命中
    points:
    - '**为什么需要这个概念？**'
    - '- 传统“干货满满/大而全”内容：制作累、用户看不完、无记忆点、难转化'
    - '- 平台算法推荐机制+用户注意力稀缺，决定了内容必须“短平快、强刺激、留悬念”'
