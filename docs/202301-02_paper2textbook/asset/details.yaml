    name: 产品Idea五种构思法与成功率排序 —— 从“瞎想”到“注意到”
    points:
    - '**为什么需要这个概念？**'
    - '- 多数人想创业第一步“想点子”，陷入“生造idea”幻觉：自嗨、伪需求、无落地'
    - '- 成功率高低差异巨大：原生idea成功率最高、生造idea最低，需按成功率排序选策略'
