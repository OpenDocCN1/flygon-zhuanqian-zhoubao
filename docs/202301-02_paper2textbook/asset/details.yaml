    - '**核心定义**'
    - '- “不下牌桌” = 人员不断层（有梯队备份）、业务不停摆（有标准化SOP）、经验不流失（有知识库沉淀）'
    - '- 核心资产不是账号/粉丝/爆款视频，而是“可复制的内容生产流程”和“持续迭代的选题库/文案库/复盘库”'
    - '**关键性质**'
    - '- 反脆弱性：人员变动反而倒逼流程完善，新人带来新视角优化旧流程'
    - '- 复利性：每个项目积累的选题库/文案模板/复盘案例，边际成本递减、边际收益递增'
    - '- 规模化前提：没有流程，矩阵号扩张必然导致质量失控、数据方差巨大'
    - '**典型例子**'
    - '- 作者团队：核心运营离职后，按SOP提拔剪辑转运营，账号数据无波动；新城市复制矩阵，2周搭建团队、1月跑通模型'
    - '- 对比：某MCN核心运营离职带走3个百万粉账号，公司半年未恢复元气，因无SOP、无梯队、无知识库'
    - '- 经验沉淀工具：飞书文档/Notion建立“选题库-文案模板-复盘案例-违禁词库-话术库”五大知识库'
    - '**边界条件**'
    - '- 前期投入大：建立完整SOP和知识库需3-6个月沉淀期，早期ROI为负，需创始人坚定投入'
    - '- 必须指定专人（PM/IP手）负责知识库维护和迭代，否则文档即成“死档案”'
    - '- 核心创意/策略决策不可完全流程化，需保留“创始人/合伙人决策层”把控方向'
