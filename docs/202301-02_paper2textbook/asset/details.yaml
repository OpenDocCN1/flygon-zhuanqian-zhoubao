  life_analogy:
  - 想象产品孵化是一场**'盲盒预售发布会'**：
  - '- **软件的本质就是软文** = 你不需要先造盲盒里的玩具，只需先设计一张极其诱人的**海报（软文）**，把‘买到就是赚到’的期待感拉满'
  - '- **卖空气** = 在玩具还没生产出来时，就挂着海报**开启预售**，收够订单再找工厂（或自己组装），没人订直接撤档，零库存风险'
  - '- **非规范化生产** = 别去建正规流水线（标准化开发流程），买台**3D打印机（中文编程工具）**，一周内在车库里打印出个能拿手里把玩的**手办模型**即可'
  - '- **复述问题建立信任** = 像**名医问诊**：‘您最近是不是失眠？是不是脱发？腰酸背痛？’患者一听‘全是我的症状’，瞬间信任，根本不在乎你手里有没有药'
  - '- **超长文过审** = 给审核员一份**厚厚的‘无害说明书’**，字多到他懒得细看，只能盖章通过；用户见厚，**‘先收藏点赞，改天再看（其实永不看）’**，帮你刷权重'
  - '- **有效噱头/安慰剂** = 卖**‘智商税糖豆’**，包装成‘诺贝尔同款’，吃了真管用（康复率30%+），名字（连花清瘟）本身就是最大功效'
  - '- **App门槛即筛子** = 开个**‘VIP专属俱乐部’**，门槛极高（需下载App、实名、填资料），进来的全是**真大佬（强需求用户）**，看客自动挡在门外'
  - '- **软件营销派** = 同样卖‘减肥秘籍’，**纯文本版（软营销派）** vs **配着高仿真App演示动画、还要强制转发才能看（软件营销派）**，后者碾压前者'
  - '- **信息差搬运** = 把**抖音上烂大街的段子**，换个标题、配张高清图，**搬到小红书**秒变‘宝藏干货’，赚的是‘东边日出西边雨’的认知差价'
  - '- **套话做局** = 挂个牌子**‘我已破解通关秘籍’**，引来一堆大神想装逼‘切，这也难不倒我’，一套话全套出来，**转手卖给过不去关的小白**，躺赚几十万'
  - '- **下拉词淘金** = 站在**搜索框旁偷听用户自言自语**：‘怎么...’ ‘为什么...’ ‘哪里买...’**，每一句补全都是真金白银的需求订单'
  - '- **软件全球化** = 国内开店要**办执照、备案、审核、软著**（四座大山），出海卖**Web版/插件**，**Google Ads一充钱就能投，免备案、免证件、免审核、免软著**，非规范化生产的终极乐园'
  summary:
  - concept: 软件的本质就是软文
    desc: 软件最终展现形式是软文，可反推开发流程：先写软文测需求，甚至不开发直接找现成软件交付
  - concept: 卖空气/预售验证
    desc: 产品不存在时制造‘已有’假象先收钱测需求，卖不出去即止损，将试错成本压缩至极致
  - concept: 非规范化生产/野路子
    desc: 个人开发者专用‘降本增效’模式：用中文编程等低门槛工具，1周内捏出可演示模型，拒绝正规流程
  - concept: 复述问题建立信任
    desc: 像医生问诊一样罗列用户症状，让用户产生‘都是我的症状、这次找对了’的心理认同，建立信任基础
  - concept: 超长文/合集模板过审
    desc: 利用审核员‘懒得看’、用户‘收藏不看’、算法‘爱长文’三大人性弱点，用形式主义通过审核并骗取权重
  - concept: 有效噱头与无效产品/安慰剂效应
    desc: 产品不解决需求也能赚钱：噱头、名字、表象（如连花清瘟）利用安慰剂效应改变认知，营销碾压产品力
  - concept: App不便即精准筛子
    desc: App下载门槛高反而成优势：过滤看客，留下强需求用户，且界面截图能锚定‘功能真实存在’的信任
  - concept: 软件营销派碾压软营销派
    desc: 逼真App界面营销（软件派）碾压纯文本攻略（软营销派），核心‘看起来更专业’+‘广告更隐蔽’+‘强制裂变’
  - concept: 信息差搬运论
    desc: 渠道间存在天然信息壁垒：A平台烂内容优化后搬运到B平台可成爆款，类比‘东边日出西边雨’
  - concept: 套话做局
    desc: ‘已解决口吻写文→引流→反问套话→卖给未解决者’，利用对方彰显优越感心理零成本获取成熟方案
  - concept: 下拉词发现需求
    desc: 利用百度/微信/小红书/Google等搜索框下拉推荐词，零成本捕捉用户真实搜索行为背后的痛点需求
  - concept: 软件全球化/四免红利
    desc: 国内合规成本高，海外市场提供网站免备案、投放免证件、免软著、免商店审核‘四免’环境，适配非规范化生产
  exercises:
  - 'no': 1
    title: 练习1：设计一个‘卖空气’预售落地页
    contents:
    - 场景：你发现小红书上大量用户搜索‘如何批量下载某平台无水印视频’，但现有工具要么收费高、要么限次数、要么需登录。
    - 任务：
    - 1. 用‘软件的本质就是软文’思维，为一个‘尚未开发’的‘全平台无水印批量下载神器’设计预售落地页核心文案结构（标题、痛点复述、解决方案预期、信任背书、行动号召）。
    - 2. 指出：你会用哪3个‘过审艺术’技巧让这篇软文在公众号/知乎存活？
    - 3. 设定‘止损线’：预售多少天、少于多少订单/金额，你决定放弃开发？
    - 思考题：
    - '- 如果预售成功但你无法开发核心功能（如平台加密升级），如何用‘非规范化生产’思维在1周内兑现交付？'
    - '- 这属于‘有效噱头’还是‘欺诈’？边界在哪里？'
  - 'no': 2
    title: 练习2：实战‘下拉词淘金’与‘信息差搬运’选题
    contents:
    - 操作步骤：
    - 1. 打开微信搜一搜、小红书搜索、百度、Google，分别输入‘副业’、‘AI绘画’、‘跨境电商’三个种子词。
    - 2. 记录每个平台前10条下拉推荐词，整理成表格（平台 | 种子词 | 下拉词 | 隐含痛点/需求）。
    - 3. 筛选出：在≥3个平台同时出现、且你有能力解决/找资源解决的3个长尾需求词。
    - 4. 去抖音/视频号搜索这3个词，找3个播放量>10万但制作粗糙/内容不全的视频。
    - 5. 针对每个视频，设计‘搬运到小红书/公众号’的二创方案：改标题、换封面、补细节、加引流钩子。
    - 回答问题：
    - '- 为什么同一个需求词，在抖音是‘烂内容’，到小红书却能成‘爆款’？（核心：用户心智/算法/内容形态差异）'
    - '- 搬运时如何规避版权/查重风险？（核心：二创深度/素材来源/去重技巧）'
  - 'no': 3
    title: 练习3：复盘一个‘软件营销派’碾压‘软营销派’的真实案例
    contents:
    - 找一个你熟悉的细分工具赛道（如：微信多开、视频去水印、数据恢复、简历生成、考公资料整理）。
    - 对比调研：
    - A. 搜索关键词，收集3篇纯文本教程/攻略类文章（软营销派），记录：阅读量、点赞/收藏/评论、是否留联系方式、评论区用户反馈情绪。
    - B. 搜索同关键词，收集3个推广‘App/小程序/在线工具’的软文/视频（软件营销派），记录：下载量/使用量、转化路径（是否强制分享）、界面截图专业度、用户信任度表现（评论区‘好用’/‘假的’比例）。
    - 分析问题：
    - 1. 为什么用户明明能用网页版/小程序，却更愿下载App/相信‘软件派’？（结合‘App门槛即筛子’与‘界面锚定信任’理论）
    - 2. ‘软件派’的裂变机制（如强制分享、邀请解锁）是否触犯平台红线？如何设计‘合规裂变’？
    - 3. 若你是个人开发者，没有能力开发App，如何用‘非规范化生产’低成本制造‘软件派’的逼真感？（提示：Figma原型、PPT动画、现成开源项目套壳、录屏剪辑）
  - 'no': 4
    title: 练习4：伦理与法律边界压力测试——‘安慰剂产品’决策模拟
    contents:
    - 案例背景：你用‘卖空气’预售了一个‘AI一键生成爆款短视频脚本’的工具，收了50个预售订单（单价99元）。开发阶段发现：现有AI大模型API根本无法稳定生成‘爆款’级脚本，最多只能生成‘及格’初稿。
    - 决策节点（必须二选一并论证）：
    - 方案A：上线‘及格版’，文案改为‘AI辅助生成脚本初稿，人工润色成爆款’，利用‘安慰剂效应’（用户觉得有工具就安心）完成交付，后续迭代。
    - 方案B：全额退款并道歉，承认‘技术暂时达不到预期’，关闭项目，损失前期软文制作/推广沉没成本。
    - 要求：
    - 1. 分别从‘短期现金流’、‘长期个人IP信誉’、‘法律风险（消保法/广告法）’、‘平台封号概率’、‘用户复购/口碑’五个维度，给两个方案打分（1-10分）。
    - 2. 写下你的最终选择及核心理由（不超过200字）。
    - 3. 如果选择方案A，你会设置什么‘补救措施’降低风险？（如：承诺退款期、赠送人工修改名额、明确标注‘辅助工具’免责声明等）
  units:
  - 'no': 1
    name: 反直觉起点：软件的本质就是软文 —— 让推广反推开发
    points:
    - '**为什么需要这个概念？**'
    - '- 传统开发流程是“先写代码、后写文案推广”，导致开发出的产品无人问津、推广乏力'
    - '- 独立开发者精力有限，若产品无法变现，前期开发投入将全部沉没'
    - '- 用户最终接触的只是软文介绍，而非代码本身，软文才是产品的最终展现形式'
    - '**核心定义**'
    - '- 软件的本质是软文：软件开发出来最终靠软文推广，所以可反推流程——先写软文、后做产品，甚至不开发而寻找现成软件交付'
    - '- 核心逻辑：用户看到文章内心想“这次找对了”即可，不管真找对还是假找对'
    - '**关键性质**'
    - '- 极大降低试错成本：卖不出去就没必要继续开发，规避“无人购买的完美代码”'
    - '- 倒逼需求理解：把需求完整讲出来让用户理解，本身就是验证需求真伪的过程'
    - '- 打破“正统开发”执念：个人开发者不应追求工程规范，而应追求“捏出模型”的速度'
    - '**典型例子**'
    - '- 作者早期做礼包软件：根本领不到礼包，但靠软文描述和评论区“集体幻觉”实现下载与变现'
    - '- 羊了个羊火时，有人P图999999分截图发帖“已开挂”吸粉，5天后游戏爆火再套话变现'
    - '**边界条件**'
    - '- 仅适用于个人/小团队非规范化生产，企业级核心系统不可用此法'
    - '- 必须处于法律法规与平台规则允许的“擦边球”边界，不可触碰诈骗红线'
    - '- 后期仍需补齐交付能力，否则面临退款、投诉、封号风险'
    sources:
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: origin
    excerpts:
    - 多年经验总结一个观点：软件的本质就是软文。
    - 软件开发出来，怎么推广？还是通过写文章，发广告，介绍你这个软件，软件的最终的展现方式还是软文
    - 所以直接拿软文，最终形式。反推开发流程，甚至不开发软件，而是寻找类似的软件给客户使用。
    - 想一些根本不现实，或多数人下载不到的软件，但他们觉得应该有这种软件，只需要想到名字即可
    - 写软文的核心是用户看到你这篇文章，内心在想'这次找对了！'，就行了，不管他真找对了还是假找对了。
  - 'no': 2
    name: 卖空气：制造“已有”的假象来预售 —— 开盲盒前的海报
    points:
    - '**为什么需要这个概念？**'
    - '- 传统“先开发后售卖”周期长、风险大，个人开发者无法承担开发完无人买单的沉没成本'
    - '- 需要一种极低成本的需求验证手段，在投入大量开发前确认市场付费意愿'
    - '- 用户往往为“确定性”买单，哪怕产品尚未交付，预售页和截图即可提供这种确定性'
    - '**核心定义**'
    - '- 在产品不存在或功能未实现时，用模型、截图、预售页制造“已有产品”的假象，先收钱、测试需求'
    - '- 口号：“假装已经有了足够！卖空气！卖预售！卖不出去就没必要继续做了！”'
    - '**关键性质**'
    - '- 验证优先于构建：以销售定生产，而非以生产定销售'
    - '- 模型即产品：用中文编程工具等低门槛工具在1周内捏出可演示模型，而非正规开发'
    - '- 快速止损：预售无人问津即放弃项目，将试错成本压缩至极致'
    - '**典型例子**'
    - '- 作者“淘客API问题”软文：用“已解决”口吻写文吸粉，套出真方案后卖给未解决者，盈利几十万'
    - '- 羊了个羊P图案例：游戏刚火时P图999999分以“已开挂”口吻吸粉，待游戏爆火后套出真刷分软件变现'
    - '**边界条件**'
    - '- 必须能在承诺时间内通过“找现成软件/外包/自研”兑现交付，否则构成欺诈'
    - '- 仅适用于数字化、可复制、边际成本极低的软件/课程/资料类产品'
    - '- 平台风控升级（如预售监管、实名认证）可能压缩生存空间'
    sources:
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: origin
    excerpts:
    - 或者直接做个模型，上架开卖，卖空气，卖预售。卖不出去就没必要继续做了！
    - 假装已经有了足够！卖空气！
    - 个人开发者研发一个软件的时间不应超过1周，超过1周的软件产品不适合个人开发者！
    - 把需求完整的讲出来，又让他理解，本身就是一件不容易的事。沟通成本有时候比开发成本都高，还赶不上有一个趁手的工具，自己先捏一个模型给他看！
  - 'no': 3
    name: 非规范化生产：用“野路子”快速捏出产品模型 —— 拒绝正统的病
    points:
    - '**为什么需要这个概念？**'
    - '- 个人开发者缺乏正规团队的工程化流程（需求评审、架构设计、测试上线），硬套正规流程会拖垮节奏'
    - '- 正规开发周期长、成本高、沟通成本大，不适合“小而快”的验证型项目'
    - '- 核心目标是“降低成本、提升效率”，只要能跑通演示和交付即可，代码质量非首要指标'
    - '**核心定义**'
    - '- 个人开发者应采用的强调降低成本、提升效率的“野路子”生产方式，区别于正规化流程'
    - '- 核心口诀：“个人开发者没有正统的命，得了正统的病” —— 就怕按大厂流程做小项目'
    - '**关键性质**'
    - '- 工具民主化：使用中文编程工具等低门槛工具，不会英语也能快速入门'
    - '- 模型优于代码：核心产出是可演示、可交付的模型，而非规范的代码库'
    - '- 周期红线：单个软件研发时间不应超过1周，超过即不适合个人开发者'
    - '**典型例子**'
