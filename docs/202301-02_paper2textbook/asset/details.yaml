  exercises:
  - 'no': 1
    title: 标题重构实战：给模糊标题装上“数据钩子”
    contents:
    - 以下是某副业实操文章的原始标题，请按“主题+平台+数据结果”公式改写：
    - 1. 原标题：《我做小红书资料号的一周心得》
    - '   已知数据：投入7天，发布21篇笔记，涨粉1200，私域引流300人，变现980元，客单价9.9元。'
    - '   任务：写出3个不同侧重点的新标题（侧重涨粉/侧重变现/侧重低成本）。'
    - 2. 原标题：《视频号带货新手避坑指南》
    - '   已知数据：测试5个品，亏损2000元后单品日出单20单，利润30%，回本周期10天。'
    - '   任务：写出一个体现“避坑后结果”的标题。'
    - 回答问题：
    - '- 为什么标题里的“980元”比“变现四位数”更可信？'
    - '- 标题里若不带平台名（如小红书/视频号），会损失什么检索价值？'
  - 'no': 2
    title: 设计你的首期“赚钱周报”原型
    contents:
    - 假设你过去一个月在公域平台（公众号/小红书/抖音/知乎/即刻）收藏了15篇高质量副业/副业复盘文章。
    - 请完成：
    - 1. 建立一个 Notion/飞书文档/Excel 表格，字段含：原标题、来源链接、平台、赛道、核心数据（涨粉/变现/成本/周期）、可复制性自评（1-5分）、你的重标题。
    - 2. 按“平台”分组，筛选可复制性≥3分的条目，按“核心数据”降序排列。
    - 3. 输出一份 Markdown 格式的周报草稿，文件名按“YYYYMMDD-YYYYMMDD”命名。
    - 回答问题：
    - '- 这15篇中有多少篇原标题已包含核心数字？缺失数字的篇幅占比说明了什么？'
    - '- 若坚持每双周发一期，你需要建立什么“素材采集-加工-发布”的最小化 SOP？'
  - 'no': 3
    title: 知识库进化演练：从索引到“问题域”检索
    contents:
    - 基于练习2产出的周报数据，执行“知识库化”改造：
    - 1. 为每个案例新增三个标签维度：
    - '   - 赛道标签（如：AI绘画/私域裂变/小说推文/知识付费/电商选品）'
    - '   - 阶段标签（冷启动/流量获取/转化变现/放大矩阵/避坑合规）'
    - '   - 关键动作标签（如：矩阵号/SEO/无人直播/软文先行/卖空气/裂变/公转私）'
    - 2. 模拟三个真实查询场景，用筛选器/数据库查询/向量检索任意方式，在5秒内调取相关案例：
    - '   场景A：我要做视频号冷启动，有哪些可参考的“前3天动作”案例？'
    - '   场景B：我想用“软文先行”验证一个知识付费产品，有成功先例吗？'
    - '   场景C：近期抖音打击“无人直播”了吗？有最新避坑案例吗？'
    - 3. 尝试提炼1个“隐性打法组合”（如：矩阵号+无人直播+素材去重=低成本高爆单概率）。
    - 回答问题：
    - '- 纯时间序索引无法直接回答上述场景，根本原因是什么？'
    - '- 维护三维标签的边际成本随案例量如何增长？如何用AI（如嵌入向量+聚类）降低人工标注负担？'
  units:
  - 'no': 1
    name: 副业案例汇编 —— 从“碎片灯塔”到“导航图谱”
    points:
    - '**为什么需要这个概念？**'
    - '- 单个副业分享像散落的灯塔，只能照亮一隅，无法形成体系认知'
    - '- 学习者面临海量碎片信息，检索成本高、难以建立知识闭环'
    - '- 需要一种结构化载体，将离散经验串联成可检索、可迁移的知识资产'
    - '**核心定义**'
    - '- “龙哥赚钱周报”是一种定期汇编的索引合集，按日期编号（如202301-02、230207）组织'
    - '- 覆盖副业、自媒体、电商、AI应用等方向，将40余篇实操复盘文章聚合为单一入口'
    - '- 本质是“信息的二次加工”：从原始内容中提取标题、平台、数据结果，重组为高密度导航索引'
    - '**关键性质**'
    - '- 周期性更新：按固定时间窗口（如半月/月）发布，保持情报时效性'
    - '- 结构化标题：采用“主题+平台+数据结果”格式（如“公众号追热点复盘：通过行程码一天涨粉4万+，直接变现6K+”），实现“不点开也能判断价值”'
    - '- 结果导向：标题层面即暴露涨粉数、变现额、成本等关键指标，传递“可复制性”与“收益预期”'
    - '**典型例子**'
    - '- “单直播间日进800美金-小时均100美金，价值8800可矩阵的tiktok娱乐直播项目”：标题直接给出单场GMV、小时产出、课程售价、可复制性判断'
    - '- “线上美业，不到2万成本到变现过百万”：用“低成本-高产出”反差建立项目吸引力'
    - '- “初创公司如何科学量化股权分配？股权分配五步法教你不再踩坑！！！”：将通用管理难题封装为标准化方法论条目'
    - '**边界条件**'
    - '- 索引≠内容：周报本身不包含实操细节，仅提供入口链接，深度学习仍需跳转原文'
    - '- 幸存者偏差：收录多为“成功/有结果”案例，失败教训、避坑细节可能被标题掩盖'
    - '- 时效性衰减：平台规则、流量红利随时间失效，半年前的“爆款打法”可能今日已不可用'
    - '**素材溯源**'
    - '- 来源文档：SUMMARY.md（周报目录索引）、README.md（周报标题）、20230207_00.md（历史汇总入口）'
    - '- 核心依据：目录中40余篇文章的标题命名规律、分类覆盖范围、数字化结果标注密度'
