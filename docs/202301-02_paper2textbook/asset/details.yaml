    name: 六维评估模型 —— 给放大决策算一笔“复制账”
    points:
    - '**为什么需要这个概念？**'
    - '- 盲目放大是创业致死主因：未验证模型就招人、买设备、砸广告，导致现金流断裂'
    - '- 直觉判断“不可靠”：需要一套结构化、可量化、可跨项目对比的决策框架，决定“能不能放大、怎么放大、放大上限在哪”'
    - '- 六维模型将复杂商业拆解为3个效率维度（决定可复制性）+ 3个财务维度（决定收入天花板），提供了决策坐标系'
    - '**核心定义**'
    - '- 六维评估模型：从流量效率、销转效率、交付效率、客单价、毛利率、复购率六个维度，对项目进行标准化打分与诊断'
    - '- 效率三维（可复制性判断)：流量效率(时间/素材/流量)、销转效率(专业度/SOP/一对多)、交付效率(时间/人力)'
    - '- 财务三维（收入天花板判断）：客单价、毛利率、复购率'
    - '- 及格线：六维满足≥4项；效率三维全高=可大规模矩阵化放大；效率有短板=必须靠财务三维补偿'
    - '**关键性质**'
    - '- 诊断功能：精准定位项目瓶颈在哪一环（如：流量效率低→靠SEO/广告/矩阵补；交付效率低→靠标准化/产品化/提价补）'
    - '- 对比功能：横向对比不同赛道/项目（小说推文vs知识付费vs教育资料），纵向追踪单项目迭代（教育资料1.0→2.0）'
    - '- 决策功能：指导资源分配——效率高处投人力/技术杠杆；效率低处投产品研发/提价策略/会员体系'
    - '**典型例子**'
    - '- 小说推文：三效率全高、三财务两低一高（毛利高）→ 适合“技术杠杆/矩阵化”放大，天花板受限于客单价/复购'
    - '- 教育资料1.0→2.0：客单价从几十元→数万，毛利从90%→10%，月收益 1-2万→100万，验证“提客单价换毛利”放大路径'
    - '- 项目拆解IP：流量/交付效率低 → 靠高客单价(万-十万)+高毛利(70%+)补偿，走“高价低量”精品化路线'
    - '- 知识付费：六维全高（毛利100%）、月收益天花板最高(500万) → 标杆级可复制模型'
    - '**边界条件**'
    - '- 静态快照局限：六维是时点评估，平台算法变、竞品入场、政策变会导致各维度剧烈波动，需定期（月/季）复盘'
    - '- 指标关联性：提客单价往往降转化率、降复购率；提毛利率可能降交付质量；指标间存在权衡，非线性独立'
    - '- 定性难量化：专业度、素材难度、信任度等核心变量难精确量化，打分带主观性，需结合实测数据（ROI、CAC、LTV）校准'
    - '- 不适用早期探索：MVP验证阶段（0-1）数据太少、噪音太大，六维参考意义弱，适用于1-N放大决策期'
