    name: 财富积累四阶段与人生四阶段 —— 你的财富阶梯在哪一步？
    points:
    - '**为什么需要这个概念？**'
    - '- 普通人财富焦虑源于“想跨阶段赚钱”（如打工者想靠投资致富）'
    - '- 每个阶段有明确的核心任务、核心杠杆、核心风险'
    - '- 认清阶段、做对阶段事，是财富自由的前提'
    - '**核心定义**'
    - '- 财富四阶段：①出卖劳动力（打工） → ②一份时间多次卖（内容/代码/课程） → ③购买他人时间（老板/雇佣/外包） → ④钱生钱（投资/基金/股权）'
    - '- 人生四阶段对应：①初入职场<30岁（扩广度/试错/积累技能） → ②中年危机>30岁（做管理/拉高度/建系统） → ③第二曲线（副业/创业/寻找MVP）
      → ④复制商业放大（组团队/跑模式/融资/上市）'
    - '**关键性质**'
    - '- 阶段不可跳跃：没积累技能/本金（阶段1）直接投资（阶段4）必亏；没跑通MVP（阶段3）就招人（阶段3）必亏'
    - '- 核心杠杆跃迁：时间杠杆 → 产品杠杆（代码/媒体） → 人力杠杆 → 资本杠杆'
    - '- 认知跃迁：打工思维 → 产品思维 → 老板思维 → 投资人思维'
    - '**典型例子**'
    - '- 阶段1：应届生进大厂、送外卖、做销售 → 积累技能/人脉/本金'
    - '- 阶段2：部门经理/技术总监/合伙人 → 管团队/做系统/拿分红'
    - '- 阶段3：大厂副业做公众号/带货/知识付费 → 跑通MVP → 辞职创业'
    - '- 阶段4：LP投基金/天使投资/买指数基金/配置房产 → 被动收入覆盖支出'
    - '**边界条件**'
    - '- 阶段划分非绝对，可并行（如打工同时做副业=阶段1+3）'
    - '- 退回可能：投资失败回阶段1、创业失败回阶段2、管理失职回阶段1'
    - '- “钱生钱”阶段需有足够本金（通常>500万）才有意义，否则收益率无法覆盖生活成本'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    - paper: docs/202301-02/20230207_03.md
      role: apply
    excerpts:
    - 财富积累分为四个阶段，第一：出卖劳动力；第二：一份时间多次卖；第三：购买他人时间；第四：钱生钱。
    - 人生四个阶段，第一阶段：初入职场（30 岁以前）…在这个阶段你要不断的长见识，要不断的去尝试不同的行业、不同的岗位、不同的职业…第二阶段，中年危机，在这个阶段一定要去做管理…第三个阶段的话，其实我就是你要开始在你的主业以外，你要去寻找自己的第二曲线…第四个阶段其实就是你在第二曲线找到了一个
      MVP…然后组建团队给它放大。
