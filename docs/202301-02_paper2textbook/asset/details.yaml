    - '**关键性质**'
    - '- 显性化资产：话术从“在主播脑子里”变成“在团队文档里”，人员流动不流失'
    - '- 模块化复用：开场留人模块可跨品类复用，讲品模块仅替换产品参数，促单模块通用性最强'
    - '- 合规内置：违规词库（违禁词、绝对化用语、诱导语）嵌入改写环节，自动标红替换'
    - '**典型例子**'
