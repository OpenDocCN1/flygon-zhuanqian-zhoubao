- learning_targets:
  - 理解 4C 动态量化股权分配模型的四个核心维度与参考权重范围
  - 掌握股权分配五步法的操作流程与自评互评共识机制
  - 理解最小 MVP 闭环（产品-流量-销售-交付）的验证逻辑与实操要点
  - 掌握“中介费伪概念”信息差洞察及个人房屋分享平台的商业模式设计
  - 了解店中店联营赋能、二房东渠道、蹭流截流开店等低成本获客与扩张策略
  - 理解城市合伙人制度（城市管家）的标准化赋能体系与非对称分工逻辑
  - 掌握抖音本地投放实测数据与渠道 ROI 对比方法论
  - 了解外包选型、招聘偏好、融资防骗、劳动合同合规等创业避坑指南
  - 理解存量时代行业周期判断与新旧模式切换的切入时机
  - 能综合运用上述工具与方法，从 0 到 1 再到 N 搭建可复制的实体+互联网闭环创业项目
