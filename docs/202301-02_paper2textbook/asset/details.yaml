    name: 四步排查法 —— 广告不出单时的冷静诊断单
    points:
    - '**为什么需要这个概念？**'
    - '- 打广告不出单时，新手极易陷入“自我怀疑→情绪内耗→乱改文案/换产品/换赛道”恶性循环，浪费宝贵窗口期'
    - '- 缺乏标准化诊断框架，导致归因随意、优化无效、经验不可复用'
    - '- 需要一套“标准化、可执行、可迭代”的排查清单，将情绪问题转化为技术问题'
    - '**核心定义**'
    - '- 步骤1·查用户：用户池是否精准？（鱼塘vs动物园）用户画像是否匹配？是否为目标决策人？'
    - '- 步骤2·查文案：产品讲清楚了吗？价值点/场景/包含范围/适合人群/价格/服务期/交付方式/信任背书/好评素材 是否完整呈现？'
    - '- 步骤3·查铺垫：广告前是否输出足够干货/生活分享/互动/活动建立信任？铺垫天数/频次/深度是否达标？'
    - '- 步骤4·悟曲折：理解道路曲折是常态，持续努力、持续迭代、持续积累，销量增长+产品迭代+大咖背书终将拿下质疑者'
    - '**关键性质**'
    - '- 归因外化：将“不出单”归因于“用户不精准/文案不全/铺垫不足/周期未到”而非“我不行/产品烂/命不好”'
    - '- 动作导向：每步排查对应明确行动（换引流渠道/补全文案细节/加大前置输出/坚持执行），避免原地打转'
    - '- 复盘资产化：每次排查记录形成“广告投放故障树”，沉淀为团队SOP，新人可直接套用'
    - '**典型例子**'
    - '- 养牛场钓鱼：2000好友全是牛羊长颈鹿（非精准鱼塘）→钓不到鱼正常，别怀疑钓鱼技术，先去找鱼塘（精准引流）'
    - '- 文案自查清单：产品初心/价值点/使用场景/包含范围/适合人群/价格/服务期/交付方式/信任背书/好评素材/大咖站台，逐项打勾'
    - '- 铺垫自查：打广告前输出了N篇价值文？发了N条生活朋友圈？参加了N次活动交流？建立了N次信任触点？'
    - '**边界条件**'
    - '- 排查顺序不可乱：先查用户（方向），再查文案（弹药），再查铺垫（蓄力），最后悟曲折（心法）；方向错了，后面全白费'
    - '- 第4步“悟曲折”不是躺平借口：必须在前3步执行到位、数据达标的前提下，才谈“时间未到”；执行不到位却怪曲折=甩锅'
    - '- 适用于“已有产品、已有流量入口、已有基础文案”的存量优化阶段；0-1冷启动阶段核心是“找鱼塘+造鱼饵”，而非排查'
