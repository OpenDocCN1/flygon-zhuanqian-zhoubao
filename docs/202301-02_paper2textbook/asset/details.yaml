    - 除甲醛不仅仅是除甲醛，还要除掉客户心中误认为是甲醛的异味。
    - 蓝海选品思维不仅仅只能用于带货，也能用于生产更受欢迎的视频、音频、文章或图片。挖掘蓝海离不开对异常值的敏感度。
  - 'no': 4
    name: 心金文案 —— 让文字既“吸金”又“入心”的双重炼金术
    points:
    - '**为什么需要这个概念？**'
    - '- 传统文案要么“土味硬广”引起反感，要么“文艺自嗨”无法变现'
    - '- 私域运营者常陷入“发了无数朋友圈，咨询寥寥无几”的自嗨陷阱'
    - '- 需要一种统一标准：商业转化率（吸金）与情感共鸣度（入心）双达标'
    - '**核心定义**'
    - '- 文案≠文章：文案自带商业变现属性，以“成交/转化”为核心指标'
    - '- 双重属性：吸金（商业闭环能力）+ 入心（情感触动/价值观共鸣）'
    - '- 本质：文案是思维的显化，思考清晰度决定文案穿透力'
    - '**关键性质**'
    - '- 一条文案一个主旨：多主旨导致焦点模糊，单一主旨穿透决策防线'
    - '- 统一风格形成记忆点：风格频繁切换=无人格面具，坚持风格=个人IP标签'
    - '- 拒绝硬性模仿/套模板：模仿框架不思考吸引点逻辑，会束缚创造力天花板'
    - '**典型例子**'
    - '- 作者年输出百万字，文案在创业圈广泛传播，小红书吸粉无数、变现超7位数，形成“文案力=核心IP标签”'
    - '- 富兰克林复写法：看优秀文案→关闭→用自己话重写→对比薄弱点→请他人点评→内化为己用'
    - '- 共鸣感三维构建：经历共鸣（同场景）、感受共鸣（同情绪）、价值观共鸣（同信仰）'
    - '**边界条件**'
    - '- 前置条件：必须完成“写作前三重思考”（目的/受众/平台），否则方向错误越努力越偏'
    - '- 思维深度是上限：文字掌控力源于思考深度，无深度思考的技巧堆砌是“无根之木”'
    - '- 平台规则红线：共鸣感构建不能触碰平台违禁词/诱导分享/虚假承诺等合规底线'
    - '...'
    sources:
    - paper: docs/202301-02/JPRAdLgGFowUE7xargGc8YNjnzh.md
      role: origin
    excerpts:
    - 2022年，我给我的文案风格，终于敲定了一个名字，叫做「心金文案」，寓意是既能吸金、又能深入人心的文案。
    - 文案不同于文章，文案本身就带有一层商业变现属性，所以能够吸金才是关键，而文案又需要蕴藏感情、给人能带来触动，所以深入人心的写法，也是必要。
    - 我曾经说过，文案是思维的显化。写作的过程其实就是把你的思考你的价值观传递出来，那么我们只要去写文案，一定其中就会包含着我们的态度的表达。
    - 很多做私域的朋友，为什么发了无数朋友圈但是咨询寥寥无几？大概率是因为他陷入了一种自嗨式写文案的状态。
    - 先明确一条文案的表达主旨，然后围绕着这一个主旨来写。一条文案，一个主旨就足够了。太多了，就会让人眼花缭乱，反而无法抓住重点。
    - 什么叫做复写？就是你先看一遍文案，然后把它关闭，尝试用自己的话去再次写出来，然后你会发现，每一次你写出来的内容都不一样，然后你去跟原文案对比，去发现自己表达不清晰的地方在哪里，那就是你写作的薄弱点。
    - 这种共鸣，是需要通过「构建相似」来进行的。可以在文案中代入生活场景感受，贴近现实，你所感受到的喜怒哀乐，用户也能同样感受到。分享给大家3个方向：经历的共鸣，感受的共鸣，价值观的共鸣。
  - 'no': 5
    name: 输入带动输出 —— 用“三级阅读阶梯”练就文案内功
    points:
    - '**为什么需要这个概念？**'
    - '- 闭门造车式写作：认知基础薄弱导致归因逻辑错误、观点贫瘠'
    - '- 碎片化阅读“看一遍即忘”，无法沉淀为可调用的认知资产'
