    - '**关键性质**'
    - '- 好奇心是打破防御的钥匙：“我想和你谈的不是钱，是趣味性问题和价值问题”'
    - '- 痛点升维：把“要买保险”升维为“要守护家族掌控权/传承确定性”'
    - '- 信任锚点：专业度（行业黑话/数据/案例）+ 共情度（懂他的孤独/焦虑/责任）'
    - '**典型例子**'
    - '- 作者实战：反问“如果明天醒来资产缩水30%你怎么处理？” → 客户卡住 → 布置功课“梳理资产图谱” → 二次见面讲“家族宪章” → 成交大额信托/保单'
    - '- 灵魂三问：你怎么想的？准备过程中做了什么？卡在哪？想不想更进一步？'
    - '**边界条件**'
