  - │   └── 喂养算法情报体系  —— P001
  - │       ├── 专用商业号物理隔离  —— P001
  - │       ├── 多平台并行（抖音/小红书/视频号/公众号/即刻）  —— P001
  - │       └── 搜索关键词强化标签（招商加盟/代理批发/私域引流/副业项目）  —— P001
  - └── 放大与风控
  - '    ├── 三大杠杆放大法  —— P001'
  - '    │   ├── 人力杠杆：SOP+兼职（门槛最低，5-10分钟/篇，引流付费）  —— P001'
  - '    │   ├── 技术杠杆：RPA/爬虫/自动化脚本（门槛中等，批量采集/去重/发布/监测）  —— P001'
  - '    │   └── 资源杠杆：投流/分销/品牌授权/收购（门槛最高，需强现金流）  —— P001'
  - '    ├── 止损点与避坑标准  —— P001'
  - '    │   ├── 三维止损：时间/金钱/资源上限  —— P001'
  - '    │   ├── 负面清单：不喜欢不碰、重供应链不碰、同行<3月不碰、单一变现不碰  —— P001'
  - '    │   └── 止损复盘报告：假设vs现实、偏差原因、教训入库  —— P001'
  - '    └── 典型案例验证库  —— P001, P002'
  - '        ├── 儿童游乐（3月40万）、文川手写Logo、艺术签名、抓娃娃收徒  —— P001'
  - '        ├── 小说推文、教育资料1.0/2.0、减肥食谱、项目拆解IP、知识付费(李一舟)  —— P002'
  - '        └── 大闸蟹电商失败教训（不喜欢赛道坚决止损）  —— P001'
  life_analogy:
  - 想象做副业像**开一家“复刻版”奶茶店**：
  - '- **商业项目拆解** = 去排队最长的那家店，不偷配方，但拆解它的：选址逻辑（流量）、点单动线（转化）、出杯SOP（交付）、定价结构（客单/毛利）、会员体系（复购）'
  - '- **六维评估模型** = 给这家店做“体检报告”：选址好不好复制（流量效率）、点单能不能标准化（销转效率）、出杯要不要大厨（交付效率）、一杯卖多少钱（客单价）、扣除成本剩多少（毛利率）、顾客会不会回购（复购率）'
  - '- **后发制人** = 不研发新口味（原创创新），直接复刻成熟爆款，只在“少糖选项”、“本地水果”、“外卖包装”上做微调'
  - '- **喂养算法** = 每天去商圈转3圈，盯着哪家店排队久、哪家新开张就拍照记录，训练你的“选址雷达”'
  - '- **项目管理双案法** = **策划案**是开业筹备书（菜单/定价/装修/开业日/止损线/加盟标准），**执行案**是每日排班表（谁采购/谁炒糖/谁出杯/几点开门/今日目标流水）'
  - '- **止损点** = 开业前立下“军令状”：亏损超10万或连续3月不回本，无条件关店转型，不拖家人、不借高利贷'
  - '- **三大杠杆** = **人力杠杆**招兼职店员按单提成；**技术杠杆**上自动封口机/点单小程序/库存预警；**资源杠杆**拿加盟费开直营店、买上游果园、砸抖音同城投流'
  - 就像开奶茶店不需要发明“珍珠”，只需拆透成熟模式、算清六维账本、立好止损军令、再用杠杆复制开分店，副业亦是如此。
  summary:
  - concept: 商业项目拆解
    desc: 从爆款内容逆向提取流量/转化/交付全链路零件，仅复制已验证模式，不搞原创创新
  - concept: 私域前端流量决定论
    desc: 私域只是蓄水池，前端流量才是水源；无稳定流量入口，私域运营再强也是零
  - concept: 六维评估模型
    desc: 流量效率/销转效率/交付效率定可复制性，客单价/毛利率/复购率定收入天花板，满四及格
  - concept: 流量效率
    desc: 以时间、素材难度、获得流量为标尺：时间少、素材易、流量大即为高
  - concept: 销转效率
    desc: 以专业度为标尺：可SOP、能一对多、销售时间利用率高即为高（网销天然优于线下）
  - concept: 交付效率
    desc: 以时间/人力为标尺：支付即完成（资料/课程）最高，陪跑/训练营需持续投入则低
  - concept: 后发制人原则
    desc: 只做别人跑通3个月以上的项目，用别人的试错成本换自己的確定性收益
  - concept: 信息差搬运论
    desc: A平台烂内容搬运优化到B平台即成爆款，核心是跨平台生命周期错位与合规二创
  - concept: 喂养算法
    desc: 用专用商业号持续点赞/收藏/停留商业内容，1-2个月驯化算法成专属情报猎犬
  - concept: 项目库与八步筛选法
    desc: 周更结构化档案库+权重打分漏斗，第5步必设止损点，分数高者决策Go
  - concept: 项目管理双案法
    desc: 策划案管战略（货盘/目标/里程碑/止损/放大），执行案管战术（表格化人/事/时/标红绿）
  - concept: 止损点
    desc: 启动前预设时间/金钱/资源三维红线，到期自动触发，输出复盘报告沉淀避坑清单
  - concept: 三大杠杆放大法
    desc: 人力杠杆（SOP+兼职）起步 → 技术杠杆（RPA/爬虫）替代 → 资源杠杆（投流/分销/收购）跨越
  - concept: 红海不红
    desc: 任何红海赛道都不缺年赚几十万的人，新手做微调（更垂直人群/极致服务/细分产品）而非创新
  - concept: 可复制性判定三铁律
    desc: 爆款非偶然、货源可寻、消费场景验证有需求——三条全满足即可低成本复制
  - concept: 交付效率分级
    desc: 支付即完成（资料/课程）> 发货型（实物/无货源）> 服务型（陪跑/训练营/咨询），按时间/人力递减
  - concept: 财务维度补偿策略
    desc: 三效率有短板时，提高客单价（高客单品）、毛利率（虚拟/品牌）、复购率（会员/订阅）兜底收入
  exercises:
  - 'no': 1
    title: 手算一个项目的六维画像
    contents:
    - 请选择一个你熟悉的副业项目（如：小红书卖PPT模板、抖音书单号、知识付费社群、闲鱼无货源），按六维模型逐项打分（1-10分）并简述理由：
    - 1. 流量效率：制作内容耗时？素材从哪来？日均流量多少？
    - 2. 销转效率：需不需要1v1沟通？能否SOP化？转化周期多久？
    - 3. 交付效率：下单后需不需要人工介入？单单耗时？
    - 4. 客单价：单次交易金额？
    - 5. 毛利率：扣除直接成本后利润占比？
    - 6. 复购率：用户半年内二次购买比例？
    - 回答问题：
    - '- 该项目三效率是否全高？若否，最短板在哪？'
    - '- 若最短板无法短期提升，能否通过提高客单价/毛利率/复购率补偿？具体怎么改？'
    - '- 按“满四及格”标准，该项目是否及格？是否值得All in？'
  - 'no': 2
    title: 拆解一个真实爆款商业案例（实战演练）
    contents:
    - 打开抖音/小红书/视频号，搜索关键词“招商加盟”“代理批发”“副业项目”“私域引流”，找一条点赞>1万、评论区大量咨询联系方式的爆款视频/笔记：
    - 1. 拆流量：是什么内容形式？（口播/混剪/实拍/图文）发布频次？前3秒钩子是什么？标题/标签关键词？
    - 2. 拆转化：引导去哪？（主页链接/私信/评论区/直播间/小程序）话术脚本？是否有免费诱饵（资料/体验课/测评）？
    - 3. 拆交付：卖什么？（实物/课程/服务/加盟）客单价？交付流程？是否标准化？
    - 4. 判可复制性：用“三铁律”验证——爆款是否偶然？（看账号历史数据）货源/服务是否独家？（搜同款）消费场景是否验证？（评论区真实咨询量）
    - 5. 定策略：若你要复制，是1:1全盘复制，还是微调？（换人群/换平台/换钩子/换交付方式）
    - 回答问题：
    - '- 该项目六维画像大致如何？'
    - '- 你的资源禀赋（时间/技能/资金/人脉）匹配度打几分？'
    - '- 设定止损点：最多投多少天/多少钱/多少精力？未跑通MVP怎么退出？'
  - 'no': 3
    title: 搭建你的“项目情报雷达”喂养算法实操
    contents:
    - 注册/指定一个“纯商业号”（抖音/小红书/视频号/公众号/即刻任选一平台），执行14天喂养计划：
    - Day 1-3：清理关注列表，仅保留商业博主；搜索并关注20个“副业拆解/项目复盘/商业模式”账号
    - Day 4-7：每日30分钟，仅对商业内容点赞/收藏/转发/评论/完播，物理屏蔽娱乐推荐（点“不感兴趣”）
    - Day 8-14：每日新增搜索3个长尾关键词（如：小红书引流SOP、闲鱼选品技巧、视频号带货话术），收藏优质内容至项目库
    - 记录观察：
    - 1. 第7天 vs 第1天，推荐流中商业内容占比变化？
    - 2. 算法推荐的“同类账号”是否精准？
    - 3. 收获了多少可入库的商业案例？
    - 回答问题：
    - '- 若14天后商业内容占比仍<30%，可能原因是什么？（账号权重/垂直度/平台算法特性）'
    - '- 如何用“搜索+爬虫/插件”补齐算法推荐的盲区？'
    - '- 该账号能否作为长期情报来源？需建立什么维护SOP？'
  - 'no': 4
    title: 为一个新项目写“策划案”与“执行案”骨架
    contents:
    - 假设你决定复制“儿童游乐挖掘机模拟”项目（或你练习2选定的项目），请起草：
    - 【策划案】骨架：
    - 1. 产品货盘：引流品____、利润品____、高客单品____（含定价/规格）
    - 2. 运营策略：流量端____、转化端____、交付端____（各写核心SOP 1-2句）
    - 3. 目标：月GMV____、净利____、进粉数____
    - 4. 里程碑：第1周____、第2周____、第1月____、第3月____
    - 5. 止损点：时间____、金钱____、资源____（三维必填）
    - 6. 放大点：触发条件____、放大方式（矩阵/加盟/代理/投流）____
    - 【执行案】第1周甘特表（示例）：
    - '| 日期 | 模块 | 二级事项 | 具体内容 | 负责人 | 协助人 | 完成标准 | 状态 |'
    - '|---|---|---|---|---|---|---|---|'
    - '| 周一 | 账号搭建 | 注册蓝V | 提交营业执照/对公打款 | 我 | 无 | 蓝V通过 | ☐ |'
    - '| 周二 | 素材准备 | 爆款去重 | 下载同行20条爆款→去重工具跑→存素材库 | 兼职A | 我 | 产出10条可用素材 | ☐ |'
    - '...（补全至周日）'
    - 回答问题：
    - '- 里程碑与止损点是否匹配？（如：止损点3个月，但第1月里程碑仅‘搭建账号’，风险是否过大？）'
    - '- 执行案中‘完成标准’是否可量化、可验证？模糊词（如‘搞定、优化、推进’）是否已剔除？'
    - '- 若周三‘素材准备’延期（标红），对第1周里程碑影响多大？预案是什么？'
  - 'no': 5
    title: 杠杆选择题：给三个不同阶段的项目配杠杆
    contents:
    - 场景A：项目刚跑通MVP，月利润2万，你是独行侠，无团队、无技术、存款5万。请设计“人力杠杆”启动方案：招几人？做什么SOP？按件/按结果怎么结算？月成本上限？
    - 场景B：项目月利润稳定10万，有3人核心团队，内容生产/发布/数据监测全靠人工，耗时占比70%。请设计“技术杠杆”替代方案：哪些环节优先自动化？（RPA/爬虫/API/脚本）预算多少？预计释放多少人力？
    - 场景C：项目单店模型跑通，月净利30万，想3年开100家分店。请设计“资源杠杆”扩张方案：加盟还是直营？投流预算？供应链整合？风控红线？
    - 回答问题：
    - '- 三个场景的杠杆门槛、风险、回报周期有何本质区别？'
    - '- 你手头的项目（或练习2项目）目前处于哪阶段？未来6个月最该部署哪种杠杆？第一步动作是什么？'
  - 'no': 6
    title: 交付模式分类与货盘设计实战
    contents:
    - 请对照“支付即交付（资料/课程/软件）”“发货履约（实物/无货源/代发）”“服务陪伴（训练营/咨询/陪跑）”三大交付模式：
    - 1. 列举你熟悉的5个副业项目，分别归类到三种模式中，并标注交付效率高/中/低
    - 2. 为其中一个“服务陪伴型”项目设计“产品货盘”：引流品（免费/低价）、利润品（标准化服务）、高客单品（定制/独家）
    - 3. 计算该项目的交付边际成本：第1个客户 vs 第100个客户的交付耗时/人力差异
    - 回答问题：
    - '- 若要将“服务陪伴型”项目的交付效率从“低”提升到“中”，必须标准化哪些环节？（SOP化、工具化、产品化）'
    - '- 高客单品的交付是否一定要由创始人亲自做？如何用“IP手/聊天手”机制替代？'
    - '- 该项目六维画像中“交付效率”打几分？能否通过“客单价/毛利率/复购率”三财务指标补偿？'
  - 'no': 7
    title: 止损点压力测试：模拟项目偏离轨道的决策
    contents:
    - 假设你投入某项目已耗时6周、花费3万元、调动2名核心兼职，止损点设定为“8周/5万/3人”。目前情况：流量端日均进粉仅20人（预期100）、转化率1%（预期5%）、交付端已出现3次投诉。
    - 1. 列出此时的“止损仪表盘”：三维指标实际消耗 vs 红线剩余量
    - 2. 判断：是否触发止损？理由是什么？（战略止损 vs 战术调整）
    - 3. 若决定继续，必须在接下来2周内达成的“挽救里程碑”是什么？
    - 4. 写一份《止损复盘报告》草稿：假设、现实、偏差原因、教训入库条目
    - 回答问题：
    - '- 止损点设得太宽（如12周/10万）会带来什么后果？太窄（如4周/1万）呢？'
    - '- 如何区分“战略止损”（模式跑不通）和“战术调整”（素材/话术/渠道不行）？'
    - '- 合伙人项目中，止损点如何通过“一致行动协议”强制执行、避免扯皮？'
  units:
  - 'no': 1
    name: 商业项目拆解 —— 把“赚钱的别人”拆成“可复制的零件”
    points:
    - '**为什么需要这个概念？**'
    - '- 多数副业失败是因为盲目创新、从零发明，忽略了市场上已有大量验证可行的案例'
    - '- 缺乏系统方法从爆款内容中提取可复用的商业逻辑，只能靠运气“撞大运”'
    - '- 需要一套标准化流程，将不可控的“灵感”转化为可控的“拆解动作”'
    - '**核心定义**'
    - '- 从公域平台（抖音、小红书）的爆款商业内容出发，逆向拆解其流量获取方式、转化链路、产品交付模式'
    - '- 核心产出：一份包含赛道、渠道、流量模式、转化模式、交付模式、客单价、可复制性评估的结构化项目档案'
    - '**关键性质**'
    - '- 非模仿表面：不抄文案、不抄封面，抄的是底层商业逻辑（谁在买、为什么买、怎么卖的）'
    - '- 可迁移性强：拆解出的“零件”（如引流钩子、转化话术、交付SOP）可重组到自己的项目中'
    - '- 依赖“后发制人”：只拆已验证稳定盈利3个月以上的项目，规避幸存者偏差'
    - '**典型例子**'
    - '- 儿童游乐项目：拆解“挖掘机模拟工地”爆款视频（8.4w赞、3000评论），复制其加盟招商模式，3个月变现40万'
    - '- 文川手写Logo：拆解评论区“怎么找你设计”的需求，外包给大学生设计师赚差价（收599、付200）'
    - '- 艺术签名：拆解“发内容→引流微信→9.9元/单→免费素材网交付”全链路，月入数千'
    - '- 抓娃娃收徒：拆解“线下抓娃娃→闲鱼卖娃娃→私域收徒599元教抓娃娃”双重变现，年入百万'
    - '**边界条件**'
    - '- 仅适用于“货源非独家、消费场景已验证、爆款非偶然”的标品化/服务标准化项目'
    - '- 核心技术壁垒强（如专利药、高精尖制造）、强个人IP绑定（如头部网红自有品牌）的项目难以拆解复制'
