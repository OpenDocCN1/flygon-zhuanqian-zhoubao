    excerpts:
    - 核心区别是：公域流量属于平台；私域流量属于自己。我们的目标是把他们引流到微信上…整套商业模式的目的只有一个：把所有公域平台的流量导入微信私域。
    - 流量价值=流量规模×交易相关性×信任度，流量规模只解决连接的问题，不解决交易的问题。
    - 横向你要看：这 200 个 UV 从哪里来？有哪些渠道？哪些涨了？哪些跌了？趋势如何？原因是什么？可干预的运营动作是什么？纵向你要看：UV 的背后是用户...能不能形成业务价值？流量要切成片来看，才有可优化的空间。
    - 流量的速度太快、没有停留、规模再大也没有用，流量一直停留不动也不行...流量的核心是流和量，就要流动也要停留、不快不慢、持续不断。
    - 从交易目的来看，单纯的页面曝光是没有太大价值的，如果是内容页面，有曝光无反馈反而是负价值。
    - 电商有个'客单价'的概念，而在私域流量运营的思维下，真正值得关注的不是'客单价'，而是'单客价'，就是一个消费者总共贡献了多少销售额。
    - roi2.5 也就是我 100 万的营业额，需要有 40 万的广告投放，那么在这 40 万的投放算到私域中，我将额外有 100 万×60%×60/150=24
      万的私域营业额，这么一算我的 roi 就从 2.5 提升到了 3.5。
    - 第一个，用好企业微信，直播时候点弹出，引流到私人微信...第二个，金句卡片。
    - 捡漏群：用户在我们的群里可以用原价的 1-3 折买到超高性价比的商品...通过售卖商品来产出佣金，实现变现。
    - 演员是捡漏群的灵魂，有演员和没演员的情况，社群产出起码相差一半以上。
    - 私域成交有逻辑、有章法…五位一体成交飞轮：①破冰——好感建立、②诊断——放大需求、③方案——成交铺垫、④信任——突破抗拒、⑤成交——引导下单。
    - 收入增长=供应链强度×顶层设计×动员能力。冷启动关键不是运营而是选品，选择标品、有社交货币的产品；触达1-2个核心意见领袖即引发指数级裂变。
  - 'no': 4
    name: 内容创作与IP打造 —— 从“写什么”到“为什么爆”
    points:
    - '**为什么需要这个概念？**'
    - '- 普通人最容易触手可及的是内容杠杆——复制边际成本为零，可重复利用、多平台推广、放大价值；写作输出是能力和价值的放大器，持续输出倒逼输入与思考。'
    - '- 内容价值由低到高分三层：给娱乐（情绪价值难变现）、给工具（实用性可引流）、给方法（打造个人IP壁垒最高），核心逻辑是价值交换。'
    - '- 爆款内容可复制再利用：爆过的内容一定可以再爆；内容创作不要靠灵感，要靠爆款模板持续输出，这是内容生产工业化的基础认知。'
    - '- 以结果倒推的逆向思考：正常流程定位→内容→流量→产品→变现，逆向流程变现→定位→产品→内容→流量——先找买家，再找产品。'
    - '**核心定义**'
    - '- 内容价值金字塔：娱乐层（情绪价值，难变现）→ 工具层（实用性，可引流）→ 方法层（解决问题，抢占专业认知，打造个人IP壁垒最高）。'
    - '- 超垂直个人IP与SEO思维：在极度细分领域坚持长期主义，布局300-500个长尾关键词、每个词写一个解决方案、多渠道发布、坚持更新，1个月后每天有人主动添加。'
    - '- 峰终定律应用：如果体验的高峰和结尾愉悦，整体感受即愉悦；让用户在开头和结尾体验愉悦（中间无关紧要），就会对内容产生好感。'
    - '- 渣男思维做内容：撩完就跑（峰终定律在情绪最高点停止让用户意犹未尽）、广撒网（多圈子多平台发内容提高命中率，垂直垂的是人群而非题材）。'
    - '- 写作即社交：写作是最好的社交活动，是个人的“身份证”——思考、经历、价值观在文章中展现，持续输出可筛选同频者、建立连接。'
    - '**关键性质**'
    - '- 爆款引流库（100-10-1聚焦法）：自建选款库、利用第三方工具、同类同品牌类推、数据化测试，先找100款、每款发3-5条笔记、选出10个能出单的款、最终聚焦爆款。'
    - '- 日更写作复利实践：565天日更完成课程、付费社群、个人咨询三个变现闭环，微信好友数增加6倍。'
    - '- 反向发帖（挨骂流派）：微头条故意发表与主流相反的争议观点引发谩骂讨论，获取巨大流量收益（<300字赚400+元）。'
    - '- 内容创作系统化拆解：文章=问题+回答，通过“输入+思考+输出”拆解，针对卡点提供选题积累、允许不完美表达、公开承诺等方案。'
    - '**典型例子**'
    - '- 超垂直IP案例：发了<200篇内容，大半个月不更新也每天有人主动咨询，享受3-5年SEO长尾福利。'
    - '- 小红书小说推文：二宝妈妈从零开始一个月，单量从周26单增至周120单、收入1000+，副业月入1万+。'
    - '- 反向发帖实证：表扬被全网批评的女干部，账号被喷成狗，<300字微头条含泪赚400多块。'
    - '- 爆款模板复用：内容创作不要靠灵感，要靠爆款模板持续输出，爆过的内容一定可以再爆。'
    - '**边界条件**'
    - '- 模板化会限制文案力：硬性模仿套用模板束缚创造力，“统一的文案风格”才是形成记忆点前提。'
    - '- 追风者用爆款思维，长期主义者用SEO思维：彻底理解这一点起码受益10年。'
    - '- 内容杠杆虽好，但需持续输出倒逼输入：不写作就不会深度思考，写作是思维的显化。'
    - '- 单纯给娱乐（搞笑/剧情号）数据好但很难变现，必须向给工具、给方法层级进阶。'
    sources:
    - paper: docs/202301-02/20230207_05.md
      role: origin
    - paper: docs/202301-02/20230207_06.md
      role: origin
    - paper: docs/202301-02/20230207_09.md
      role: origin
    - paper: docs/202301-02/20230207_11.md
      role: improve
    excerpts:
    - 普通人最容易触手可及的是内容杠杆——复制边际成本为零，可重复利用、多平台推广、放大价值；写作输出是能力和价值的放大器。
    - 内容价值由低到高分为三层：给娱乐（情绪价值难变现）、给工具（实用性可引流）、给方法（打造个人IP壁垒最高），核心逻辑是价值交换。
    - 长期主义者，大部分都用SEO思维在做流量，而追风者往往是用爆款思维组流量，彻底理解这一点，起码受益10年。
    - 一个用户愿意通过各种关键词找到你的信息，进而添加到你的私域里。这样来的1个人会比你平台推荐来的100个人更有价值。
    - 爆过的内容一定可以再爆；内容创作不要靠灵感，要靠爆款模板来持续输出，这是内容生产工业化的基础认知。
    - 渣男思维做内容：撩完就跑（利用峰终定律在用户情绪最高点停止让其意犹未尽）、广撒网（在多个圈子多平台发内容提高命中率——垂直垂的是人群而非内容题材）。
    - 以结果为导向逆向拆解需要的步骤，确定最小行动单元。正常流程是定位→内容→流量→产品→变现，逆向流程是变现→定位→产品→内容→流量——先找买家，再找产品。
    - 通过565天日更写作，完成了课程、付费社群、个人咨询三个变现闭环，微信好友数增加6倍。
    - 别人都在骂李少莉，社区女干部，我们就去表扬她...不到300字的微头条，含着眼泪赚了400多块。
    - 先辛苦一阵子，根据你的切割的细分领域，用心布局300-500个长尾关键词。每个关键词写一个解决方案...大概1个月后，你就会发现你每天都有人添加你。
  - 'no': 5
    name: 项目操盘与变现 —— 从“最小验证”到“规模复制”
    points:
    - '**为什么需要这个概念？**'
    - '- 验证产品应优先卖想法而非做产品，通过高意向付费人数判断需求：聊100人仅几人买有问题，20-30人购买交预售金则不确定因素解决，可短时间测试几十个产品。'
    - '- 很多人严重低估已有项目而过分高估新项目；赚钱应结合自身已有资源，新项目与自身资源匹配度（而非项目好坏）决定成功概率。'
    - '- 副业收入增长疲惫时，拿出部分收入招聘他人处理重复基础工作，释放自己精力成为老板，建立赚钱杠杆。'
    - '- 商业英雄是平台红利产物：抓住某时期平台/市场红利，匹以执行力，赚到第一桶金；以前以为赚的是实力钱，实则是红利钱。'
    - '**核心定义**'
    - '- MVP先卖后做：最小成本验证需求，先卖想法、再做产品，用高意向付费人数判断需求是否成立。'
    - '- 商业拆解复制副业法：刷短视频发现案例，拆解前端内容生产到后端导流私域及转化成交全流程，判断可复制性（货源非独家、场景验证有需求），低门槛复制快速变现。'
    - '- 资源盘点与项目拆解：三步评估新项目——盘点自身资源、拆解项目所需资源、评估匹配度以快速启动。'
    - '- 买卖、生意、商业三分论：自己做所有事是出卖劳动力（买卖），通过代理商/多次卖出是生意，建立可复制放大模式才是商业。'
    - '- 招商加盟四级别：轻量级（卖技术/料包）、中量级（卖设备/服务）、重量级（卖品牌）、魔鬼级（卖特许权，可作为资产转移继承）。'
    - '**关键性质**'
    - '- 矩阵化抖音带货怼量法：保证质量前提下大量发布拼接剪辑带货视频增加爆单概率，即使大部分视频流量惨淡（点赞>500仅10个、大部分个位数甚至0），纯靠怼量不开直播累计带货10万+。'
    - '- 健康单店模型是加盟前提：先跑通单店盈利，再验证区域模型（多店复制），模型健康可复制时规模化扩张才可持续。最新标准：门店模型测算到位、单店财务健康、区域模型验证、复制性和财务模型达标。'
    - '- 奶茶加盟优于直营：蜜雪冰城（加盟）21年19亿利润 VS 奈雪的茶（直营）亏1.5亿，加盟品牌利润能力显著高于直营，喜茶开放加盟顺应行业规律。'
    - '- 无人直播素材与风险：核心是高质量素材（录播需审查违禁词、去重、避开品牌标识），平台检测风险：雷同限流1月、原创举报限流、判录播罚100-200、批量做号罚2-3千。'
    - '- 视频号无货源店群：后端商品缺乏是根本原因，关键操作：开旗舰店/普通店刷入池→入优选联盟→选品上架→拍单发货；必须做店群（矩阵思维对抗不确定性），最少5个以上店铺。'
    - '- 抖音本地生活核心：POI加热是第一课、无爆品不做推广（否则是赌博）、玩转短视频矩阵和直播运营、好评率维护极其重要。'
    - '**典型例子**'
    - '- 亏损反弹案例：多项目累计亏损超100万，经资源梳理叠加外卖CPS与副业课程，3个月赚100万、总利润超300万（外卖CPS盈利200万+、副业课程3个月100万+）。'
    - '- 无人直播单场百万：自研硬件（伪装摄像头黑盒子）规避检测，录制真实直播间无人带货，单场销售额116.8万，甚至比大多数真人直播高。'
    - '- 视频号店群数据：7店日营业额合计7858元，单店均1122元/天，毛利30%（日利润300-400），精细操作单店月利润1W，10店即10W/月，达人爆单带来额外几万利润。'
    - '- 美团电商冷启动：8月末发现机会<2个月跑通扩展到30店，类目不同单店月利润6k-12k（零运营未优化），首店跑通MVP仅花80元。'
    - '- 抖音本地生活十倍增长空间：美团覆盖全国地级市，抖音仅覆盖一线新一线，二三线覆盖率低，2023年投放入口调为本地推及外卖打开，预计10倍增长。'
    - '**边界条件**'
    - '- 平台风控持续收紧：无人直播需持续换品、换号、注销重起；硬改设备手机寿命10分钟至10天不等，卖手机是“一锤子买卖”。'
    - '- TEMU低价标品议价空间极小：小二预留10%利润，报价超1688同款视为“无诚意”压价至持平或更低，需侧重非标品。'
    - '- 创业项目匹配度：结合自身资源而非盲目All In，低估已有项目、高估新项目是常见错误。'
    - '- 非刚需项目失败教训：10年创业失败4次、负债百万靠自媒体上岸，总结“非刚需项目都别做”，不够刚需链条太长推不动。'
    - '- 战术勤奋逃避战略探索：用忙碌麻痹自己，短期轻松长期有毒；动脑累、探索恐惧，但唯有战略突破带来真正成长。'
    sources:
    - paper: docs/202301-02/20230207_03.md
