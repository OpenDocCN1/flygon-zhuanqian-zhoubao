- learning_targets:
  - 理解内在比赛理论的核心框架，掌握自我一与自我二的区别与互动关系
  - 掌握确定性窗口期的判断逻辑与数据推演方法，能识别宏观红利的入场时机
  - 建立价值创造视角，完成从追求增长到积累稀缺资产的认知跃迁
  - 辨析战略与目标的本质区别，掌握战略描述三段论与顶层治理逻辑
  - 识别身边的信息差生意机会，掌握正反馈驱动行动的闭环构建方法
  - 熟记优雅亏大钱三步骤反面清单，建立风控底线思维与止损纪律
  - 践行利他即利己的开放心法，构建知识分享的复利增长飞轮
  - 掌握选品方法论：从蓝海市场定位到合规平替、空壳品牌、微创新差异化的四步打造爆款范式
  - 建立趋势判断框架：从疫情数据类比、平台电商周期演进到热点套利技术栈的机会窗口捕捉能力
  - 理解招商加盟的四种级别与健康单店模型验证标准，掌握从0到1操盘复制扩张的方法
  - 掌握内容IP打造体系：从母题/基因/身份/观感/资产的地基夯实，到独创理论生成、千万营收模型与点线面打通路径
  - 识别Web3赛道的本质特征与熊市生存法则，建立选择比努力更重要的赛道判断力与容错率控制
  - 掌握个人IP超垂直SEO流量获取法、爆款选款100-10-1聚焦法与反向发帖争议变现等差异化内容策略
