- learning_targets:
  - 理解商业认知的底层逻辑：时代红利、流量价值公式、财富积累四阶段、战略即选择
  - 掌握选品方法论的核心四步：找蓝海、走捷径（合规平替）、加光环（空壳品牌）、微创新（材质套利）
  - 掌握公域引流私域变现的完整链路：流量切片分析、流速控制、流量合并、单客价思维、五位一体成交飞轮
  - 理解内容创作与IP打造的核心逻辑：内容价值金字塔、渣男思维（撩完就跑/广撒网）、SEO思维布局精准流量、爆款模板复用
  - 掌握项目操盘从MVP验证到规模复制的方法：先卖后做、商业拆解复制、资源匹配度评估、矩阵化怼量、加盟扩张前提
  - 建立创业心态与内在比赛的认知：盲目自信、成功是成功之母、唤醒成功体验、俯视学习法、战术勤奋不逃避战略探索
  - 掌握高净值客户销售核心：需求上升为痛点、失去掌控权痛点、买家/卖家系统博弈、破局引起好奇、合作思维
  - 建立趋势判断与机会窗口的框架：确定性窗口期推演、平台电商四周期、热点套利技术栈、需求共振、信息差挖掘
  - 建立风险管理与合规底线：劳动合同有效性、辞退损失最小化、非刚需项目规避、无壁垒项目本质、理性止损、平台风控本质
  - 掌握杠杆复制与放大的系统方法：盈利验证放大、剥离式拆解问题、OKR执行、股权顶层设计四要素、三会一层治理、矩阵化复制
  - 内化认知升维与长期主义：利他等于利己、战略发挥优势法、争是不争不争是争、不流动稀缺资源优先、商业模式道术器用、5WHY分析、合格总结三要素、产品Idea五种构思法、好名字公式
