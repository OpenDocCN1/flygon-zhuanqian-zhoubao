    name: 案例对比：小说推文 vs 教育资料 —— 为什么一个天花板低，一个能到百万
    points:
    - '**为什么需要这个概念？**'
    - '- 直观展示六维模型如何解释同类“内容变现”项目巨大的收入差异，帮助读者建立“选赛道比努力重要”的战略认知'
    - '- 素材以此为核心教学案例，演示模型实操'
    - '**核心定义**'
    - '- 通过六维雷达图对比：小说推文（三高效率、三低财务） vs 教育资料/知识付费（低流量效率、高财务指标）'
    - '- 核心洞察：客单价是改变项目量级的杠杆，10元客单价需10万单才能百万，1000元客单价仅需1000单'
    - '**关键性质**'
    - '- 小说推文：流量效率高(平台分发)、销转高(低决策成本)、交付高(自动发文)，但客单价~10元、复购近0、毛利薄 -> 单靠规模放大，极限月入2万'
    - '- 教育资料/IP：流量效率低(需精准搜索/私域沉淀)、销转中(需信任建立)、交付低(需人工/社群服务)，但客单价299-9999、复购高(课程/社群/咨询阶梯)、毛利>90%
      -> 单客价极高，百万级可达'
    - '- 补偿法则：教育资料用“高客单价+高复购”补偿了“低流量效率”，实现了商业模式闭环'
    - '**典型例子**'
    - '- 小说推文作者：日更拼命，月入1-2万天花板，想突破只能做矩阵号或收徒(收徒即转型教育IP)'
    - '- 夕子/龙哥/小懒：做项目拆解/副业培训/社群IP，客单价299-几万，复购率高(续费/升级/咨询)，年入百万级'
    - '**边界条件**'
    - '- 高客单价模式对“个人信任/专业度”要求高，新人冷启动难，需先做低客单价积累信任再升级'
    - '- 知识付费面临“交付效率低”瓶颈，规模化需SOP化交付（手册/录播/助教/社群运营），否则创始人成瓶颈'
    - '- 行业周期：小说推文红利期短(平台打击/同质化)；知识付费周期长(信任复利)，但竞争加剧需持续迭代内容'
