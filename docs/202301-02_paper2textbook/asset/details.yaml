    name: 留存坏点 —— 视频流失的“显微镜”
    points:
    - '**为什么需要这个概念？**'
    - '- 传统复盘只看完播率、点赞率等宏观指标，无法定位具体哪句话、哪个动作让用户划走'
    - '- 完播率高不代表没流失，可能前半段流失补了后半段，掩盖了结构性问题'
    - '- 需要秒级颗粒度的诊断工具，指导精准剪辑优化'
    - '**核心定义**'
    - '- 留存坏点 = 视频播放过程中，某一秒观众人数出现异常骤降（如单秒流失率>5%）的节点'
    - '- 通过复盘工具导出留存曲线，定位骤降时间点，回溯对应画面/文案/动作，确认流失原因并优化'
    - '**关键性质**'
    - '- 因果确定性：直接关联具体内容元素（话术/场景/动作/转场），而非模糊的“内容不吸引人”'
    - '- 可操作性强：找到即砍掉或重拍，验证成本极低（重剪即可），见效即时'
    - '- 迭代累积：每条视频修复1-2个坏点，账号留存曲线平滑度显著提升，复利效应明显'
    - '**典型例子**'
    - '- 高考志愿号：第8秒讲“专业代码对照表”流失率飙升 → 砍掉代码表改讲“选错专业哭厕所的真实故事” → 留存曲线平滑，完播率提升15%'
    - '- 抗衰号：展示医院资质证书第12秒掉人 → 替换为“用户做项目前后对比图+真实聊天记录” → 咨询转化率翻倍'
    - '- 书单号：第3秒展示书籍封面特写流失 → 改为“翻开书第1页就看到的扎心金句” → 5秒完播率从35%→52%'
    - '**边界条件**'
    - '- 需要单条视频播放量>1万才有统计显著性，小流量视频留存曲线抖动大、误导性强'
    - '- 仅诊断“内容层面”流失，无法诊断“标题/封面/推荐机制”导致的进不来问题'
    - '- 过度优化坏点可能导致内容支离破碎，需平衡“流失点修复”与“逻辑完整性”'
    - '...'
