      role: apply
    - paper: docs/202301-02/20230207_11.md
      role: apply
    excerpts:
    - 电商有个'客单价'的概念，而在私域流量运营的思维下，真正值得关注的不是'客单价'，而是'单客价'，就是一个消费者总共贡献了多少销售额。
    - 我们 150 客单价的产品，进粉率 60%的情况下，月产值只能做到 8……年产值算完衰减，能到 60。
    - 回本之后，单群单日产出 30 来讲，假设有 100 个群，一天就是 3000 利润，有 1000 个群，一天就是 30000，那么一个月就是 90W。
    - 假设一个社群 7000 成本，3 个月回本，之后每个月可以产生 1000 的利润，21 个月还能产生 2.1W 的纯利润。
    - 收入增长=供应链强度 X 顶层设计 X 动员能力
    - 发圈动力=佣金/设计交压力。
    - 私域成交有逻辑、有章法…我把整套成交逻辑整理成了五位一体成交飞轮：①破冰——好感建立、②诊断——放大需求、③方案——成交铺垫、④信任——突破抗拒、⑤成交——引导下单。
    - 2020 年 4 月上线，第一个月没有花一分钱投放，进来 10 万宝妈和老师做分销员。80 万+的分销员...1.5 亿销售额
  - 'no': 5
    name: 捡漏群模型 —— 用“演员+极致性价比”打造社群印钞机
    points:
    - '**为什么需要这个概念？**'
    - '- 普通社群活跃度低、转化差、生命周期短，缺乏标准化复制模型'
    - '- 电商佣金模式竞争激烈，需通过“超高性价比（1-3折）”+“稀缺感/从众心理”突围'
    - '- 素材验证：新起盘<1000群月佣100万+，头部团队万群级、月佣千万级，单群投资回报率3-4倍'
    - '**核心定义**'
    - '- 捡漏群：以企业微信为载体，建立500人大群，每天精推1个主品（原价1-3折），配合30-50个演员（托）营造抢购氛围，通过淘客佣金变现'
    - '- 核心要素：稳定企微主体 + 靠谱流量 + 精细化运营（选品/排品/文案/催单/演员） + 规模化矩阵 + 多重变现'
    - '**关键性质**'
    - '- 演员是灵魂：有演员 vs 无演员，社群产出相差≥1倍；演员模仿真实用户抢单/晒单/催单，制造“爆单假象”触发从众心理'
    - '- 精推文案节奏：预告→秒杀→4-6次递进式催单→隔天预告，全天候覆盖用户不同时段'
    - '- 选品逻辑：标品看价格/销量、非标看转化率/社交货币；定向招商群/选品网站/同行群三大渠道'
    - '- 矩阵化放大：单群上限500人，通过裂变/投放/合伙人快速复制群数量，规模化摊薄运营成本'
    - '**典型例子**'
    - '- 作者团队：新起盘<1000群月佣100万+，单群成本3500-1万、回本2-3个月（20230207_03.md）'
    - '- 书里有品：童书分销，0预算冷启动触达核心KOL→指数级裂变→2年80万分销员、1.5亿销售额（20230207_08/11.md）'
    - '- 同行案例：社群数量达万个以上、月佣几千万（20230207_03.md）'
    - '**边界条件**'
    - '- 平台风控高压：企微反封号机制严、群发频率限制、诱导分享违规，需持续投入技术/资源对抗'
    - '- 演员管理成本：招募、培训、排班、考核30-50演员/群，人力成本随群数量线性增长'
    - '- 供应链依赖：强依赖稳定、低价、高佣、发货及时的供应链，一旦断供/涨价/发货慢即崩盘'
    - '- 用户价值递减：同质化“捡漏”久了用户疲劳、信任度下降、取关率升高，需不断创新玩法/品类'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_03.md
      role: origin
    - paper: docs/202301-02/20230207_06.md
      role: apply
    - paper: docs/202301-02/20230207_08.md
      role: improve
    - paper: docs/202301-02/20230207_11.md
      role: apply
    excerpts:
    - 捡漏群：用户在我们的群里可以用原价的 1-3 折买到超高性价比的商品。…… 能通过售卖商品来产出佣金，实现变现。
    - 目前这种模式不仅能将单品的产出发挥到极致，还不会造成选品的困难。
    - 一个群必须有 20 个以上的演员，确保整个群的发品节奏。演员是捡漏群的灵魂，有演员和没演员的情况，社群产出起码相差一半以上。
    - 目前今年新起的盘不到 1000 个群，月佣在 100w+。今年很多同行通过捡漏群和美妆小样群赚得盆满钵满，月佣百 W 的大有人在，我身边还有大的团队社群数量达到万个以上，月佣在几千个
      W。
    - 回本之后，单群单日产出 30 来讲，假设有 100 个群，一天就是 3000 利润，有 1000 个群，一天就是 30000，那么一个月就是 90W。
    - 社群分销最重要的不是运营，而是产品，是供应链的强度和差异化... 真正对团长激励最大的，是爆品带来的佣金反馈。
  - 'no': 6
    name: 视频号直播+私域 —— 长短线结合的“现金奶牛”
    points:
    - '**为什么需要这个概念？**'
    - '- 单一公域直播：流量易衰减、平台抽成高、无用户资产沉淀、抗风险极弱'
    - '- 单一私域运营：获客慢、冷启动难、缺乏爆发力、现金流不稳定'
    - '- 素材核心洞见：视频号直播（短期爆发、获新快）+ 私域运营（长期复购、高LTV、抗衰减）= 长短线结合的最优模型'
    - '**核心定义**'
    - '- 前端：视频号直播间（低门槛、高转化、可挂企微/金句卡片引流）'
    - '- 中端：企微/个人微信私域池（分层运营、标签化、SOP服务）'
    - '- 后端：多元变现产品矩阵（低客单引流品、中客单利润品、高客单复购品）'
    - '- 核心指标：直播间ROI + 私域年产值 = 实时真实ROI'
    - '**关键性质**'
    - '- 引流丝滑：企微弹窗、金句卡片不跳出直播环境即可加微信，一小时加200人（20230207_03.md）'
    - '- 私域放大ROI：进粉率60%合格，月产值8-15元/人，综合ROI从2.5提升至3.5-4.5（20230207_06.md）'
    - '- 爆单承接法：视频爆了立马上传同内容建合集、流量视频与带货视频双路、爆了立马开直播双频共振（20230207_06/11.md）'
    - '- 无人直播天花板高：自研硬件规避检测+真实素材拟真，单场销售额116.8万超真人（20230207_08/11.md）'
    - '**典型例子**'
    - '- 作者案例：视频号直播一小时加私域200人，生财预约51个、星球49个（20230207_03.md）'
    - '- 中老年带货：半年月入稳定3万+，10月21天赚11万（含3天赚8万），A账号日入1.8万、B账号日佣3万（20230207_06.md）'
    - '- 无人直播硬件：黑色盒子伪装摄像头，录制真实直播间素材，规避系统检测（20230207_08/11.md）'
    - '**边界条件**'
    - '- 视频号平台规则收紧风险：引流工具（企微弹窗/卡片）随时可能失效，需备多套方案'
    - '- 无人直播违规风险：平台打击录播/雷同/无人值守，硬件寿命短（10分钟-10天），属灰色地带'
    - '- 私域运营重运营：需专业销售团队执行“五位一体成交飞轮”，人力成本高、标准化难'
    - '- 直播间流量波动大：受算法/竞品/违规影响极大，单场爆单不可复制，需矩阵化稳产出'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_03.md
      role: origin
    - paper: docs/202301-02/20230207_06.md
      role: improve
    - paper: docs/202301-02/20230207_08.md
      role: apply
    - paper: docs/202301-02/20230207_11.md
      role: apply
    excerpts:
    - 近年来，因为现在信息传递越来越快了，项目红利期是越来越短的。所以我就在思考，怎么样能长短线结合，又有短期的爆发力，又有长期的基本盘。目前看，视频号直播+私域是有这个属性的。
    - 第一个，用好企业微信，直播时候点弹出，引流到私人微信...可以不用跳出直播环境，直接完成转化。第二个...金句卡片。
    - 昨天开了个直播，一小时吧，加到私人微信近 200 人，生财新年预约人数 51 个，加曹大星球 49 个。
    - 视频一爆，立马上传同内容的视频，并创建合集，大概率能把新的视频带爆...视频一爆，立马开直播，双频共振。
    - 我在抖音的一场直播，7 月 16 号一天卖了 116.8 万，无人直播能拉到的销售额，甚至比大多数真人直播都要高。
    - 打开直播伴侣--添加摄像头--选中盒子--开播。开播内容就是你拷贝在盒子上的内容，这个方法可以防止系统检测。
