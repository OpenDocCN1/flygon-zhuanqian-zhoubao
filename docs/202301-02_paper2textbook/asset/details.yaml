    name: 刚需生意观 —— 非刚需不碰，项目本性成就人
    points:
    - '**为什么需要这个概念？**'
    - '- 创业者常陷入“伪需求/弱需求/伪刚需”陷阱，投入巨大却回报微薄'
    - '- 只有“刚需”才能支撑高获客成本、高转化率、高复购率、高抗风险'
    - '- 需要一把“刚需识别尺”筛选项目'
    - '**核心定义**'
    - '- 刚需：用户“不买会难受、不买有损失、买了立竿见影”的需求'
    - '- 判据：链条短（决策快）、频次高（复购强）、替代难（壁垒深）、价格敏感度低'
    - '- 核心信条：最终是项目的本性成就人，而不是人去推动一个不够刚需的项目'
    - '**关键性质**'
    - '- 作者实测：副业（赚钱刚需）、减肥（颜值/健康刚需）仅两个项目长期循环'
    - '- 非刚需特征：链条长（需教育/引导/多次触达）、决策周期长、易被替代/延迟'
    - '- 刚需项目特征：用户主动找、成交快、少售后、高复购、抗周期'
    - '**典型例子**'
    - '- 刚需：考公/考研/考证资料、牙套/脱毛/祛痘医美、贷款/征信修复、孩子升学/留学规划'
    - '- 伪刚需：高端茶饮/网红餐厅（替代极易）、知识付费大课（完课率低、延迟消费）、SaaS工具（决策链长、替代多）'
    - '**边界条件**'
    - '- “刚需”随周期变迁：疫情期囤药/健康是刚需，后疫期旅游/报复性消费成刚需'
    - '- 细分人群视角：对富豪“奢侈品”是社交刚需，对打工者是奢望；定位决定刚需定义'
    - '- 早期创新往往创造“新刚需”（如打车软件创造“随时叫车刚需”），不可教条拒绝非传统刚需'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    - paper: docs/202301-02/20230207_03.md
      role: apply
