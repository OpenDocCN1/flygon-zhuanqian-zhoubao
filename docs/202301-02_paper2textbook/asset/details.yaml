  - 'no': 10
    name: 通过下拉词发现需求：从搜索框里“淘金” —— 读心术般的选题雷达
    points:
    - '**为什么需要这个概念？**'
    - '- 选题/选品失败多因“拍脑袋想需求”而非“看数据找需求”'
    - '- 关键词工具收费高、数据滞后，搜索框下拉词是免费、实时、真实的用户需求清单'
    - '- 解决“不知道做什么、不知道用户在找什么”的核心痛点'
    - '**核心定义**'
    - '- 利用百度、微信、小红书、Google、应用商店等搜索框的下拉推荐词，捕捉用户真实搜索行为背后的痛点'
    - '- 类比“读心术”：下拉词=用户真实提问的自动补全=真实需求排行榜'
    - '**关键性质**'
    - '- 零成本、实时性：无需付费工具，随搜随得，反映当下最热需求'
    - '- 长尾精准：下拉词多为长尾词，精准对应细分场景，竞争小、转化高'
    - '- 跨平台验证：同一词在多平台下拉均出现，说明需求普遍性强、赛道大'
    - '**典型例子**'
    - '- 作者实操：去应用商店找App名字 → 输入百度/微信/小红书/Google搜索框 → 记录下拉词 → 挖掘需求'
    - '- “需求是抓住用户遇到问题、用户寻找解决办法产生的行为。围绕用户可能产生的行为场景，在行为中部署产品！”'
    - '**边界条件**'
    - '- 下拉词受地域、账号画像、近期热点影响大，需多账号、多地区、多时段采样'
    - '- 仅反映“搜索需求”，不代表“付费需求”，需结合商业价值判断（如有无广告、竞品、变现路径）'
    - '- 热门词竞争极大，建议切入“下拉词的下拉词”（二级/三级长尾)或组合词'
    sources:
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: origin
    excerpts:
    - 发现需求的方式也很简单，去应用商店找一些App名字，输入百度、微信、小红书，Google搜索框
    - 需求是抓住用户遇到问题,用户寻找解决办法产生的行为。围绕用户可能产生的行为场景，在行为中部署产品！
  - 'no': 11
    name: 过审的艺术：超长文、干净截图与合集模板 —— 让审核员“懒得看”
    points:
    - '**为什么需要这个概念？**'
    - '- 内容平台（公众号、知乎、小红书等）审核机制越来越严，硬广、引流、敏感词直接封禁'
    - '- 创作者需要一套“合规包装”技巧，让正常商业内容披上“专业/无害”的外衣通过审核'
    - '- 审核员人工审核时间极短（秒级），机器审核依赖特征匹配，均可被“形式主义”欺骗'
    - '**核心定义**'
    - '- 超长文：字数极多（如合集、大全、汇总模板），审核员懒得细看、机器难判定广告密度，直接通过'
    - '- 干净截图：纯软件界面截图、无二维码/联系方式/诱导词，视觉上“无害”，降低违规判定概率'
    - '- 合集模板：用“XX工具大全合集”“XX教程汇总”标题+目录结构，制造“资源整理型”专业感'
    - '**关键性质**'
    - '- 利用人性弱点：审核员“懒”、用户“收藏不看”、算法“爱长文/爱停留”'
    - '- 形式大于内容：后半段常为注水/无关内容，但前半段建立的“专业感”已完成信任锚定'
    - '- 组合拳：干净截图（过机审）+ 超长文合集（过人审/骗权重）+ 隐晦引流（留钩子）'
    - '**典型例子**'
    - '- 作者亲测：提交2页材料被拒 → 改成乱七八糟15页秒过，证明“字多/厚”即正义'
    - '- 知乎长文：200字留联系方式 → 用户先加收藏点赞（反正看不完） → 权重拉满'
    - '- 软文配干净App截图：只凭截图调动用户分享精神，过审且推广软件'
    - '**边界条件**'
    - '- 平台算法升级（如语义分析识别注水、识别诱导分享截图）会精准打击'
    - '- 账号权重受损：长期发“注水长文”会被打标“低质内容创作者”，后续分发受限'
    - '- 用户信任透支：读者发现被“骗停留/骗收藏”会取关、举报，账号进入死亡螺旋'
    sources:
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: origin
    excerpts:
    - 所以软文需要有一个干净的截图，只凭软件的截图，没需求用户不会去下载的，调动用户分享精神，也是一种在社交媒体推广软件，过审的技巧！
    - 文超长，字超多，审核员懒得看，就行了！可使用：合集、大全、汇总，之类模板，增加文章字数！
    - 核心是让自己变得至少看起来是无害的。
    - 之前提交一个证明材料，只提交了2页直接给我拒绝了，后面我乱七八糟提交了15页秒过。
    - 用户在你这个文章的页面停留的时间越长，搜索引擎就会觉得你这个文章更专业
  - 'no': 12
    name: 软件全球化：免备案、免证件、免审核的蓝海 —— 非规范化生产的终极归宿
    points:
    - '**为什么需要这个概念？**'
    - '- 国内互联网环境收紧：网站需备案、广告投放需资质、软件需软著、上架需审核，非规范化生产寸步难行'
    - '- 个人开发者无公司主体、无资质证书、无法承担合规成本，被挡在商业化门外'
    - '- 海外市场（Google Play、Web、海外广告网络）门槛极低，且用户付费意愿强、单价高'
    - '**核心定义**'
    - '- 国内环境不佳，软件全球化是大势所趋，甚至是唯一出路'
    - '- 核心优势四免：①网站免备案 ②Google投放免证件（充钱就行） ③软件免软著 ④免应用商店审核（Web直发）'
    - '- 正适合“非规范化生产”：无证件产品也可上市场，想做就做，想停就停'
    - '**关键性质**'
    - '- 合规成本归零：个人开发者可合法合规地面向全球用户商业化'
    - '- 变现效率高：海外用户付费习惯成熟、单价高（美元定价）、LTV长'
    - '- 技术栈通用：同一套代码/模型，国内受限、海外畅通，边际复制成本为零'
    - '**典型例子**'
    - '- 作者断言：“目前国内的互联网环境没那么好，软件全球化是大势所趋，甚至可能是唯一的出路！”'
    - '- 个人开发者靠Web版工具、Chrome插件、Telegram Bot等无需上架形态，直接Google Ads投放收割全球流量'
    - '**边界条件**'
    - '- 需具备基础英文能力（或借助翻译/AI工具）处理文案、客服、政策合规'
    - '- 收款结算需解决：Stripe/PayPal/派安盈/万里汇等跨境收款账号开户门槛'
    - '- 法律管辖风险：面向海外用户需遵守GDPR、CCPA等数据隐私法，违规罚款极高'
    - '- 文化差异：产品设计、交互习惯、营销话术需本地化，不能生搬硬套国内打法'
    sources:
    - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
      role: origin
    excerpts:
    - 目前国内的互联网环境没那么好，软件全球化是大势所趋，甚至可能是唯一的出路！
    - 1、网站不需要备案 2、Google投放广告不需要证件，充钱就行 3、软件不需要'软件著作权证书' 4、不需要应用商店审核
    - 无证件的产品也可以上市场，正适合非规范化生产
