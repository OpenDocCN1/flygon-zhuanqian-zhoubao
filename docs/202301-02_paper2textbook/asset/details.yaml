    name: 剥离式拆解问题法 —— 把“模糊痛点”拆成“确动作清单”
    points:
    - '**为什么需要这个概念？**'
    - '- 团队/个人常陷入“忙碌但无效”：做了很多事，客户核心问题没解决'
    - '- 客户说“想赚钱/想瘦/想涨粉”太模糊，直接动手必偏'
