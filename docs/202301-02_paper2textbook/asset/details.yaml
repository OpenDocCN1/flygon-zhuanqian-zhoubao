    excerpts:
    - 收益 = 使用人次 * （ CPC的广告价格 - 接口调用费用） - 一次性投入
    - 使用人次越多成为唯一变量。
    - 关键词SEO这块目前非常重要
    - 最后给各位看一下最近的结果
