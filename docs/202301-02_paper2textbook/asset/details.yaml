    - 而且因为对用户的深入沟通和了解，我们还搭建出了更多合作方式，从以往客单价几千块，到了现在客单价10万。
    - 我的增长饭局，为何现场满意度那么高？就是因为我抱着纯利他的心态，给每一个来到现场的朋友，想办法解决他们的流量难题
    - 更有不少朋友，因为看了我们增长饭局的流程，也引发了自己做饭局的想法
