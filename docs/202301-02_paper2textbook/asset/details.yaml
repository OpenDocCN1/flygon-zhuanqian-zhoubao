    name: 资源匹配度评估 —— 用“手里的牌”决定“打什么局”
    points:
    - '**为什么需要这个概念？**'
    - '- 创业者常“严重低估已有项目，过分高估新项目”，导致频繁切赛道、资源归零'
    - '- 项目成败取决于“资源匹配度”而非“项目好坏”，同一项目资源匹配者赚钱，不匹配者亏钱'
    - '- 明确自身资源包（粉丝、经验、软件、团队、案例、渠道），能快速筛选高胜率项目'
    - '**核心定义**'
    - '- 资源盘点：系统梳理自身现有的有形/无形资产，包括流量资产、操作经验、技术工具、人脉团队、成功案例等'
    - '- 项目拆解：将目标项目拆解为“前端流量获取、中端转化交付、后端变现复购”所需的关键资源清单'
    - '- 匹配度评估：对比“手里有”与“项目需”，匹配度>80%可直接启动，50-80%需补齐关键资源，<50%坚决放弃'
    - '**关键性质**'
    - '- 动态性：资源包随项目推进积累扩大，匹配度可随时间提升，需定期复盘更新'
    - '- 非对称性：某些关键资源（如核心渠道、独家货源、信任背书）具有“一票决定”权重'
    - '- 复利性：高匹配度项目执行过程本身在积累新资源，形成“资源-项目-更强资源”正循环'
    - '**典型例子**'
    - '- 作者：公众号经验+流量+人+项目 = 匹配“外卖CPS/副业课程”=100%匹配 → 3个月赚100万、总利润300万+'
    - '- 反面：非刚需项目（链条长、无核心资源匹配）连续创业4次失败、负债百万'
    - '- 招商加盟：必须先跑通单店模型（自有资源验证），再开放加盟（复制资源包），否则是收割加盟费'
    - '**边界条件**'
    - '- 资源盘点易受“沉没成本”偏见，高估沉没资产价值，低估新资源获取难度'
    - '- 匹配度高不等于必成功，执行力、时机、运气等外部变量仍占重要权重'
    - '- 早期资源极少时，匹配度评估参考价值低，需先通过“打工/兼职/小项目”积累种子资源'
    - '...'
