    name: 三大杠杆：人力、技术、资源 —— 将收入从1放大到N
    points:
    - '**为什么需要这个概念？**'
    - '- 单人单号天花板极低（时间/精力有限），必须用杠杆突破收入上限'
    - '- 三大杠杆门槛依次递增：人力最低、技术中等、资源最高，按能力配置'
