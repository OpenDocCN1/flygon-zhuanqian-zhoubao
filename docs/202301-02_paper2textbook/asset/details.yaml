    - 商业模式不断的换汤不换药，新的客户群体也不断产生。这就会导致，玩了很多年的项目，甚至是十年前的项目，现在依然有人做的很好。
  - 'no': 36
    name: 执行力变现论 —— 执行力本身就是稀缺资产，可定价、可交易、可融资
    points:
    - '**为什么需要这个概念？**'
    - '- 创业者常轻视“执行”，以为“有想法/有资源/有技术”就行'
    - '- 实际上“知易行难”，持续执行力极其稀缺，市场愿意为其支付高溢价'
    - '- 将执行力显性化、资产化、可交易，是普通人逆袭最确定路径'
    - '**核心定义**'
    - '- 执行力 = 在不确定性中、克服人性弱性(懒/怕/拖/怂)、持续完成既定动作的能力'
    - '- 可变现形式：①高薪聘用(如作者被亦仁邀请) ②资产出售(宝妈号7万) ③融资/合伙入股(执行力换股权) ④客户溢价(因执行力好获信任/复购/转介绍)'
    - '**关键性质**'
    - '- 执行力可训练：MVP验证 → SOP固化 → 重复100次 → 交付结果 → 正反馈 → 习惯养成'
    - '- 执行力可量化：日更天数/发文篇数/加好友数/测品款数/直播场次/招商数/代码行数'
    - '- 执行力可复利：每一次执行沉淀为资产(内容/数据/流程/案例/信誉/人脉)'
    - '**典型例子**'
    - '- 宝妈：4个月日加好友 → 4000+精准好友 → 微信号7万出售给亦仁'
    - '- 作者：565天日更写作 → 课程/社群/咨询三重变现 → 好友6倍增长 → 被亦仁邀请进核心圈'
    - '- 亦仁语录：“执行力是值钱的，执行力是可以变现的，我想奖励执行力”'
    - '**边界条件**'
    - '- 盲目执行(无策略/无复盘/无反馈) = 战术勤奋战略懒惰 = 无效内耗'
    - '- 执行力必须服务于“正确方向”(战略/产品/市场)，否则越执行错得越远'
    - '- 执行力资产化需法律/合同保护(劳动合同/竞业限制/知识产权/股权激励)'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    - paper: docs/202301-02/20230207_03.md
      role: apply
    excerpts:
    - 记得亦仁说我想告诉大家，执行力是值钱的，执行力是可以变现的，我想奖励执行力；邀请我去生财办公室这何尝不是对我的执行力的一种奖励。
