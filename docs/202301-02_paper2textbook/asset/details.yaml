    name: 用户视角内容定位法 —— 别用专家思维，要用小白搜索词
    points:
    - '**为什么需要这个概念？**'
    - '- 专家视角=诅咒：老板用行业黑话选词、做内容，用户听不懂、不搜、不买单'
    - '- 流量来了接不住、转化低，根因是“业务定位不清晰”+“内容不匹配用户搜索意图”'
    - '- 必须从“用户怎么搜、搜什么、痛点什么”反推内容策略'
    - '**核心定义**'
    - '- 以用户搜索需求数据（搜索量、搜词习惯、痛点词）为锚点，反向确定账号人设、内容方向、选题规划、转化路径'
    - '- 核心公式：用户搜索行为数据 → 痛点分析 → 人群区分 → 差异化内容定位 → 精准获客'
    - '**关键性质**'
    - '- 去专业化：用大白话覆盖小白高频搜索词，而非学术术语'
    - '- 差异化：避开同质化低价竞争，用内容精准筛选高价值人群'
    - '- 数据驱动：用数据说话替代拍脑袋，视野更开阔、决策更确定'
    - '**典型例子**'
    - '- 高端女性实体店：原走低价引流→转化差；改用搜索数据分析用户真实痛点、做差异化内容→吸引精准高客单客户，老板反馈“以前凭直觉，现在靠数据，清晰多了”'
    - '- 留学业务：按用户搜索习惯布局长尾词，而非机构内部术语，精准截获高意向留学咨询'
    - '**边界条件**'
    - '- 需具备基础数据分析能力或工具支持（如词库工具、下拉词采集）'
    - '- 仅适用于“用户有主动搜索习惯”的赛道（如知识付费、本地服务、高客单产品），纯娱乐/冲动消费型赛道搜索权重低'
    - '- 定位一旦确立，内容需长期垂直深耕，频繁跳赛道会破坏账号标签权重'
    - '...'
    sources:
    - paper: docs/202301-02/CZPydiVmgo2odMx0nWecf3DTn6e.md
      role: origin
    excerpts:
    - 我们结合她的人群定位，建议她与别人做出差异化，做好客户的痛点分析，从用户痛点入手来做内容，避免传统的低价竞争。
    - 我们帮助她从用户的搜索量来分析用户痛点，区分用户群体，确定接下来的运营策略。
    - 你对自己的客户定位越清晰，你靠内容吸引的客户就越精准。
    - 有的老板会从自己专业角度出发，写一些专业的词，但是假如面向的是小白用户，大家根本不懂，也不会搜这个词，那这种词就没有意义，因为无法让用户搜索到你。
    - 学会用数据分析的方法，从用户的角度看问题，视野真的开阔多了。
