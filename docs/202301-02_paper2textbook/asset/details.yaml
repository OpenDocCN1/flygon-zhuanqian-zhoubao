    excerpts:
    - 通过香港疫情数据类比推演：大陆首轮大规模感染后有2-3个月疫情平稳期，之后才进入第二波感染峰值——2023年春天是相对确定的稳定期，是生意人与投资者看重的窗口期。
    - 基于疫情平稳期共识，2023年春天可能是全年最重要的3个月窗口期；行业恢复最猛，普通人应“先干个春天再说”。
    - 从平台电商的历史出发，我把美团的发展分为了四个周期：铺货、动销、精细化、玩趋势。所有平台演变的底层逻辑是相通的。
    - 最重要的是要打造好自己的或者团队的技术基础设施，这样可以用最短的时间来迎接风口...我又花了十几分钟，写了几十行代码，成了全网首个把'ChatGPT'集成到公众号的人。
    - 身边赚钱的机会其实还是很多的，只是你没有发现，这个就是大家所说的信息差。先有闷声发大财，网上说做什么小项目一个月可以赚多少钱的，基本是已经过时了。
    - 春节国内旅游人次达3亿，恢复到2019年同期88.6%；出境机票订单量上涨258%、入境预定量上涨632%、国际酒店预定量同比增长177%。
    - 多个保健品品牌抖音销量过亿；诺特兰德维生素片连续两个月为抖音直播单品销量第一。
    - 美团电商成长为团队的第二曲线，类目不同单店月利润6k-12k（零运营未优化）...第一家店跑通最小MVP仅仅花费了80元。
    - 用SEO思维去发布的内容，那怕3年5年你依然可以享受到这个内容的福利。
    - 我通过往年的台灯数据以及生活的经验，预测6月底之后会迎来台灯的小旺季...旺季时7月单日最高峰卖出9个台灯。
    - 如果你要问，那我反着来，就能保证赚钱吗？我也希望可以，但很不幸不能...舍弃了亏钱，就意味着舍弃赚钱。
