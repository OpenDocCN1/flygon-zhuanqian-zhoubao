- learning_targets:
  - 理解副业案例汇编从碎片信息到系统知识的转化价值
  - 掌握“主题+平台+数据结果”高点击率标题的结构化撰写公式
  - 学会建立周期性情报编纂机制，打造个人商业雷达站
  - 掌握从单纯索引进化为多维知识库的路径与关键动作
  - 能识别案例集编纂中的幸存者偏差、时效性衰减等边界陷阱
  concept_map:
  - 副业案例集与情报编纂体系
  - ├── 核心载体：龙哥赚钱周报
  - │   ├── 形态定义：定期汇编的索引合集，按日期编号组织  —— P001
  - │   ├── 覆盖维度：多平台（公众号/抖音/小红书/视频号/TikTok）× 多赛道（AI/Web3/私域/电商）  —— P001
  - │   └── 核心功能：降低检索成本，将离散灯塔串联为导航图谱  —— P001
  - ├── 标题工程：数据钩子设计
  - │   ├── 结构公式：主题 + 平台 + 量化结果（涨粉/变现/ROI/成本/周期）  —— P002
  - │   ├── 信任锚点：具体数字替代模糊形容词，传递可复制性与收益预期  —— P002
  - │   └── 检索友好：结构化标题可直接解析入库，支持多维筛选  —— P002
  - ├── 编纂机制：周期性情报雷达
  - │   ├── 节奏设定：固定周期（双周/月）更新，形成阶段性情报快照  —— P003
  - │   ├── 加工流程：筛选 → 分类 → 重标题 → 打标签 → 汇总发布  —— P003
  - │   └── 双重价值：对外立人设（专业度背书），对内辅决策（选品/选赛道依据）  —— P003
  - └── 进化路径：从索引到知识库
  - '    ├── 维度重构：按平台/赛道/阶段三维打标，从“时间序”转“问题域”检索  —— P004'
  - '    ├── 四层关联：案例 ↔ 方法论 ↔ 工具 ↔ 模板，支持模式挖掘  —— P004'
  - '    ├── 产出升级：定期输出专题深度报告（横向对比/避坑白皮书/趋势洞察）  —— P004'
  - '    └── 变现阶梯：免费周报引流 → 付费知识库订阅 → 定制化咨询  —— P004'
  life_analogy:
  - 想象副业案例集的建设像是**为一片未知海域绘制航海图**：
  - '- **单篇复盘文章** = 水手零散的“见岛日志”（只记录某次发现陆地的坐标与收获）'
  - '- **周报索引** = 按航次整理的“航海日志汇编”（按时间序串联，能看出大致航线）'
  - '- **结构化标题** = 日志封面上的“关键坐标标注”（一眼看到：哪里、什么岛、多少金银）'
  - '- **周期性编纂** = 固定频次的“测绘船队出海”（制度化保证情报持续更新、不缺档）'
  - '- **知识库进化** = 最终绘成的“标注了洋流、暗礁、补给港、贸易航线”的**总航海图**'
  - '    - 支持按“目的地（赛道）”“船型（平台）”“季节（阶段）”快速查阅'
  - '    - 标注了“哪里有暗礁（避坑）”“哪里顺风快（爆款打法组合）”'
  - '    - 新航海者（读者）拿到图，就能避开死海、直奔富饶群岛，而非盲目漂流。'
