    name: 不下牌桌的能力 —— 经验沉淀与流程复制的护城河
    points:
    - '**为什么需要这个概念？**'
    - '- 短视频行业人员流动极大，运营/剪辑/演员频繁跳槽，团队不能因核心人员离职而停摆'
    - '- 多数团队经验只存在于个人脑海/聊天记录，人走经验走，每次重新探索成本极高'
