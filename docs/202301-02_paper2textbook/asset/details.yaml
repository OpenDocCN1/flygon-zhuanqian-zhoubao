    name: 创始人IP是坑：用专业演员替代 —— 商业效率视角的抉择
    points:
    - '**为什么需要这个概念？**'
    - '- 绝大多数创始人误以为“必须亲自出镜才真实/建立信任”，实则陷入自我感动'
    - '- 创始人时间成本极高(时薪数千-数万)，亲自拍摄/直播机会成本巨大'
    - '- 专业演员/主持人表现力、抗压性、可控性全面碾压业余创始人'
    - '**核心定义**'
    - '- 创始人IP陷阱：老板坚持亲自出镜→场次跟不上→浪费流量/错失变现→团队依赖单一人→系统脆弱'
    - '- 演员替代模式：专业演员/主持人按脚本/SOP出镜→场次稳定/表现标准/可批量复制→创始人转型项目经理/监制(看数据/定战略/控风险)'
    - '**关键性质**'
    - '- 专业度差距：创始人懂业务但不懂表演(镜头感/节奏/情绪)；演员懂表演配合业务脚本即可'
    - '- 时间杠杆：创始人1小时拍摄=损失1小时战略思考/融资/招聘；演员1小时拍摄=产出1小时标准内容'
    - '- 容错与替代：创始人状态差/生病/离职=全盘停摆；演员可替换、可多备、可标准化管理'
    - '**典型例子**'
    - '- 高考项目踩坑：让创始人出镜→时间有限场次跟不上→浪费至少几十万流量/几十万收入'
    - '- 成功案例：聘请专业主持人做中医养生号演员，配合运营脚本，稳定日更、批量出片'
    - '**边界条件**'
    - '- 极少数“自带流量/超强表现力/极致专业”的创始人(如罗永浩/董宇辉)适合亲自出镜，属幸存者偏差'
    - '- 早期极度资源受限(月入<1万)可暂时创始人出镜跑通模型，但必须设定“替代时间表”'
    - '- 创始人仍需深度参与：定战略、审脚本、看复盘、谈合作、控风险，而非“甩手掌柜”'
    - '...'
    sources:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
      role: origin
    excerpts:
    - 大部分老板的认知还是说要做创始人IP，但从我们经验，创始人IP真的是个坑。
    - 一方面，大部分老板的专业程度，不足以弥补在表现力上的差距；另一方面，老板本身时间比较值钱，没有办法全力all in在抖音流量端。
    - 从商业效率角度，比创始人自己出镜或者签约专家老师效率更高。
    - 我们在这上面就踩坑了，当时和高考这个项目合作，就是让创始人出来做的，后面创始人时间有限，直播场次跟不上，浪费了很多流量（至少几十万的钱钱）。
