    - '- 认知对抗：人性贪婪（一夜暴富）、恐惧（不止损）、侥幸（跌很多不可能发生）是三步骤的心理燃料'
    - '- 幸存者偏差破解：只看赚钱案例学不到风控，必须研究“亏钱大师”共性'
