    name: 信息差搬运论 —— A平台的“烂内容”就是B平台的爆款
    points:
    - '**为什么需要这个概念？**'
    - '- 打破“内容已饱和”的认知，发现跨平台套利机会'
    - '- 降低内容生产成本：搬运优化≠原创，边际成本趋近零'
    - '- 理解平台算法差异：同一内容不同平台分发逻辑截然不同'
    - '**核心定义**'
    - '- 渠道间存在天然信息差：用户画像、算法偏好、内容生态不同'
    - '- 搬运非抄袭：需针对目标平台优化（标题、封面、节奏、话题标签）'
    - '- 核心公式：爆款内容 × 平台适配优化 = 新平台爆款'
    - '**关键性质**'
    - '- 单向流动：通常从成熟平台（抖音）流向新兴平台（小红书/视频号）'
    - '- 时间差：先发制人，在目标平台建立首发优势'
    - '- 批量化：可建立SOP/工具流水线，实现工业化搬运'
    - '**典型例子**'
    - '- 抖音做烂的项目→搬小红书瞬间爆（儿童游乐/艺术签名/文川手写）'
    - '- 小红书卷死的赛道→优化搬抖音/视频号→二次收割'
    - '- 知乎长文→改短视频脚本→抖音/视频号分发'
    - '**边界条件**'
    - '- 版权红线：直接搬运原创内容侵权，必须二创/改编/授权'
    - '- 平台打击：水印检测、指纹识别、原创保护机制持续升级'
    - '- 生命周期：信息差窗口期短（3-6个月），需快进快出'
    sources:
    - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
      role: origin
    excerpts:
    - 渠道其实是有信息差的，我们做过很多项目，其实吃的就是信息差，有些项目在抖音上做得很烂的，但是如果你搬到小红书上面，瞬间就爆了。有些项目在小红书上面做的人很多了，那你把同样的内容优化一下，搬到抖音上，也有可能把它做爆。
