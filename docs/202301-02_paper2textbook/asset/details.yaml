      role: improve
    excerpts:
    - 电商有个'客单价'的概念，而在私域流量运营的思维下，真正值得关注的不是'客单价'，而是'单客价'，就是一个消费者总共贡献了多少销售额。
    - roi2.5 也就是我 100 万的营业额，需要有 40 万的广告投放，那么在这 40 万的投放算到私域中，我将额外有 100 万×60%×60/150=24
      万的私域营业额，这一块是无需投放的……这么一算我的 roi 就从 2.5 提升到了 3.5。
    - 假设一个社群 7000 成本，3 个月回本，之后每个月可以产生 1000 的利润，21 个月还能产生 2.1W 的纯利润。
    - 私域成交有逻辑、有章法…我把整套成交逻辑整理成了五位一体成交飞轮：①破冰——好感建立、②诊断——放大需求、③方案——成交铺垫、④信任——突破抗拒、⑤成交——引导下单。
  - 'no': 2
    name: 实时真实ROI —— 让隐形资产显性化参与决策
    points:
    - '**为什么需要这个概念？**'
    - '- 传统ROI只算广告直接带来的单次转化，忽略私域沉淀的长期价值'
    - '- 导致老板不敢加预算、不敢投流，误判项目真实盈利能力'
    - '- 需要一个把“看不见的未来钱”算进“现在账本里”的方法'
    - '**核心定义**'
    - '- 实时真实ROI = (直播间毛利 + 私域预估年产值) / 广告投入'
    - '- 私域预估年产值 = 直播间成交客数 × 进粉率 × 单客月产值 × 12个月 × 衰减系数'
    - '- 核心变量：客单价(n)、毛利率(q)、进粉率(60%合格线)、月产值(p)、衰减率(前3月80%)'
    - '**关键性质**'
    - '- 决策导向：算完真实ROI，敢投流、敢加预算、敢招人'
    - '- 动态模型：随运营优化（提升月产值、延长生命周期），ROI会持续跃升'
    - '- 反脆弱：广告投放波动时，私域存量业务兜底现金流'
    - '**典型例子**'
    - '- 客单价150、毛利率Q、投放40万、营业额100万：纯直播ROI 2.5，加私域后3.5，月产值翻倍则达4.5'
    - '- 作者据此判断：月产值若能从15元提升到30元，业务模型彻底跑通，可规模化复制'
    - '**边界条件**'
    - '- 依赖进粉率、月产值、衰减率的准确估算，数据不实则模型失效'
    - '- 仅适用于“公域引流+私域变现”双轨模式，纯公域或纯私域不适用'
    - '- 前3个月80%衰减系数为经验值，不同行业/品类需实测校准'
