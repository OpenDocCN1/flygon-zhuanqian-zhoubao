    name: 抖音本地生活 —— 实体门店的“数字化翻身仗”
    points:
    - '**为什么需要这个概念？**'
    - '- 传统实体门店：获客成本高、依赖大众点评/美团高佣、无私域沉淀、营销手段单一'
    - '- 抖音本地生活：算法分发流量（非订阅制）、同城精准触达、视频/直播直观展示、POI门店页承接转化'
    - '- 素材判断：美团880万商家覆盖全国 vs 抖音仅覆盖一二线城市，二三线巨大空白 = 10倍增长空间'
    - '**核心定义**'
    - '- POI（Point of Interest）门店页：抖音本地生活的核心落地页，集团购券、预约、导航、评价于一体'
    - '- 爆品：单品高性价比、强视觉冲击、高转化率的引流款，是推广的前提（“无爆品不推广”）'
    - '- 矩阵打法：达人探店/自播/员工号/素人号多账号协同，覆盖同城不同人群圈层'
    - '**关键性质**'
    - '- POI加热是第一课：通过达人/投放/活动拉高POI权重，获得免费自然流量曝光'
    - '- 短视频+直播双引擎：短视频获精准流量、直播高转化承接、团购券核销到店闭环'
    - '- 好评率=生命线：差评直接影响POI权重与转化，需SOP化运营（好评返现/差评预警/运营介入）'
    - '- 投放工具迭代：2023年全面切换为“本地推”+外卖打开，门槛降低、定向更精准'
    - '**典型例子**'
    - '- 书画门店：引爆同城流量（微信群+爆店码）→ 裂变流量（66元定金卡+拼团）→ 转化到店（造节+群接龙），20天收款160万、裂变4000宝妈群（20230207_03.md）'
    - '- 作者预测：抖音本地生活覆盖一二线、二三线空白大、外卖打开+本地推上线 → 预计10倍增长（20230207_03/06.md）'
    - '- 抖音爆单承接：视频爆→传同款建合集→双路发视频→立马开直播→日入1.8-3万（20230207_06/11.md）'
    - '**边界条件**'
    - '- 强依赖线下履约：到店体验差→差评→POI权重崩→流量断，运营重心在线下而非线上'
    - '- 非标品类难复制：餐饮/美容/教培标准化程度不同，SOP复制难度大，单店模型跑通前不敢加盟'
    - '- 区域差异巨大：一线城市流量贵/竞争烈，三四线城市流量便宜但用户付费力弱，策略需因地制宜'
    - '- 平台规则变动快：从DOU+到本地推、从团购到外卖，打法半年一变，需持续跟进平台战略'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_03.md
      role: origin
    - paper: docs/202301-02/20230207_06.md
      role: improve
    - paper: docs/202301-02/20230207_11.md
      role: apply
    excerpts:
    - 主要环节分为这几块：1、引爆同城流量；2、裂变自有流量；3、转化到店流量。通过这样的方式，裂变了 4000 人左右的微信群，95%以上的都是宝妈。定金卡的数量在
      624 张……通过这三步走，转化了 160 万。
    - 美团平台活跃商家数量达到 880 万家，基本覆盖全国全部地级市，而抖音本地生活仅覆盖了一线及新一线全部城市，但在二三线城市覆盖率较低，还有巨大的增长空间。
    - 一定不能做逆流而上的事情，没有爆品去做强推，转化会一言难尽，甚至适得其反。铁子们这一块就遵循一个原则，没有爆品就不做抖音推广的动作，否则一切动作就是在赌博。
    - 视频一爆，立马上传同内容的视频，并创建合集，大概率能把新的视频带爆...视频一爆，立马开直播，双频共振。
    - A 账号…这两条视频让我日入 1.8W；B 账号…连续直播了三四天，每天至少十个小时，最高日佣 3W。
  - 'no': 8
    name: 无货源店群矩阵 —— 用“铺货概率”对抗“不确定性”
    points:
    - '**为什么需要这个概念？**'
    - '- 传统电商：选品难、备货压资金、发货慢、SKU管理重，个人/小团队难承担'
    - '- 视频号/抖音/美团等新平台：后端商品稀缺、流量红利期、平台扶持商家入驻'
    - '- 素材核心逻辑：平台缺货 = 机会；无货源（一件代发/采集搬运）+ 矩阵化店群（多店对抗风险）= 低成本试错、快速出单'
    - '**核心定义**'
    - '- 无货源：无库存、无发货，通过采集工具（至尊宝/蜘蛛/自研）从拼多多/1688/同平台采集商品，加价上架，出单后下单代发'
    - '- 店群：最少5个以上店铺（旗舰店买授权/普通店刷入池），矩阵思维对抗单店不确定性（限流/违规/断流）'
    - '- 优选联盟/精选联盟：平台官方选品池，入池即获得达人带货资源，无需自主引流'
    - '**关键性质**'
    - '- 暴力铺品：不精选、广撒网、靠量出单，视频号后端商品缺乏使得即使暴力铺品也能出单'
    - '- 选品标准：品牌货优先、标品优先、销量大优先、官方价≥150元、避开劝退类目（20230207_11.md）'
    - '- 利润模型：单店日营业额~1122元、毛利30%、日利300-400元、月利1万+、10店月入10万+、达人爆单额外几万（20230207_08.md）'
    - '- 合规底线：旗舰店买授权（300元/年）、不碰侵权/违禁/高售后品类、发货时效严守平台规则'
    - '**典型例子**'
    - '- 视频号店群：7店日销7858元、单店均1122元、毛利30%、精细运营单店月利1万、10店10万（20230207_08.md）'
    - '- 美团电商：80元跑通MVP、2个月30店、单店月利6k-12k（零运营未优化）、百货类目前全国前300（20230207_11.md）'
    - '- 抖音矩阵带货：纯靠怼量（点赞>500仅10条、多为个位数/0）、不开直播、累计带货10万+（20230207_11.md）'
    - '**边界条件**'
    - '- 平台打击升级：平台从鼓励入驻转为严管体验分（DSR/发货/售后/违规），店群模式易被判“无实质经营”封店'
    - '- 供应链不可控：上游拼多多/1688商家涨价/断货/发货慢/质量差，直接导致店铺体验分暴跌、限流封店'
    - '- 利润薄、现金流压力大：垫资垫付、退款周期长、佣金结算慢，资金链断裂是店群最大死因'
    - '- 无品牌资产：纯靠平台分发流量，无私域沉淀、无品牌溢价、无护城河，平台政策一变即归零'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_08.md
      role: origin
    - paper: docs/202301-02/20230207_11.md
      role: apply
    - paper: docs/202301-02/20230207_06.md
      role: improve
    excerpts:
    - 视频号后端能挣钱的根本原因是因为后端商品的缺乏，视频号选品库整体依旧还是不够多不够丰富的
    - 所以即使现在去做暴力铺品依旧能出单，而且一定要做店群，去多做店，数量越多越好，越多越稳定，最起码要做 5 个以上的店铺，要用矩阵思维来对抗不确定性！
    - 今天这 7 个店营业额加起来 7858，平均到单店营业额就是 1122，正常毛利在 30%左右，单店一天的利润也就 3，400 左右。
    - 多起一些店，再精细点做，平均一个店能做到月利润 1W 左右，做 10 个店就是 10W 了！
    - 第一家店跑通最小MVP仅仅花费了80元...截止到10月美团电商全类目商家仅2000多家，我们应该是百货类目入驻的全国前300名。
    - 在保证视频质量的前提下，量怼的越多，爆单的概率肯定就越大...一个号，纯靠发带货视频，不开直播，累计带货10万+。
