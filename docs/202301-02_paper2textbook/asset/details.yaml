    name: 三大杠杆放大法 —— 从月入3千到月入30万的复制公式
    points:
    - '**为什么需要这个概念？**'
    - '- 单点跑通后，靠自己干永远有天花板（时间/精力有限）'
    - '- 必须把“会做”变成“会教人做/会让机器做/会借资源做”'
    - '- 复制放大是副业变全职、小生意变大生意的必经之路'
    - '**核心定义**'
    - '- 人力杠杆：把内容生产/引流/客服做成SOP→招低成本兼职（5-10分钟/条）按结果付费'
    - '- 技术杠杆：爬虫批量采集素材、RPA自动发布、伪原创工具去重、矩阵号管理系统'
    - '- 资源杠杆：资金投流、人脉合伙、渠道置换、品牌授权（门槛高，非核心）'
    - '**关键性质**'
    - '- 杠杆层级：技术>人力>资源（边际成本递增，可控性递减）'
    - '- SOP先行：无SOP不招人，无工具不放大，否则是“乱放大”'
    - '- 复制单元：以“月入3000的号/店/号”为最小复制单元，复制30遍=月入9万'
    - '**典型例子**'
    - '- 小红书矩阵：招兼职按SOP发笔记，加一个微信付佣金，人力杠杆'
    - '- 批量搬运：软件扒同行笔记→二创→定时发布→矩阵收割，技术杠杆'
    - '- 抓娃娃收徒：卖娃娃(货)→收徒599元(课)→徒弟再卖娃娃(裂变)，资源杠杆'
    - '**边界条件**'
    - '- 前提：单点模型已跑通（ROI>1、流程SOP化、交付标准化）'
    - '- 管理半径：人力杠杆超5人需专人管，技术杠杆需懂技术或找靠谱外包'
    - '- 平台风控：矩阵操作极易触发关联封号，需设备/网络/主体隔离'
    sources:
    - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
      role: origin
    excerpts:
    - 人力杠杆。人力杠杆顾名思义是低成本的兼职。比如说要做小红书。我们招了很多兼职小伙伴，通过我们自己的内容生产模式，做成一个SOP，帮我们去做引流，5到10分钟一篇笔记，引流加一个微信我给你多少钱。
    - 技术杠杆就是顾名思义通过软件释放你的双手。比如说你可以批量的把某一个领域的小红书笔记批量地扒一下，因为你要抄同行。...用这种工业化的流水线这种方式去完成。
    - 资源杠杆这边我就不多说了，其实就是资金、人脉，不太适合我们大多数人。
    - 有一个哥们，他是一个抓娃娃的高手...卖娃娃就能赚40多万一年...又发展了另外一个变现模式——收徒弟。我教你怎么去商场抓娃娃，收599一个学费...加起来，一年能给他赚个100来万。
