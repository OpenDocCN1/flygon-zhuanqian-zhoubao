    name: 股权顶层设计四要素 —— 控制权、进入、分配、退出，缺一不可
    points:
    - '**为什么需要这个概念？**'
    - '- 创始团队常“谈感情不谈股权”或“平均分股权”，后患无穷'
    - '- 股权设计不是分蛋糕，是设计“谁控制、谁进入、怎么分、怎么退”的游戏规则'
    - '- 内部不乱才能外战，股权混乱是创业死亡第一隐形杀手'
    - '**核心定义**'
    - '- 四大核心要素：①顶层控制权（谁说了算） ②进入机制（谁能进、凭什么进） ③分配机制（怎么分、动态调整） ④退出机制（怎么退、按什么价退）'
    - '- 控制权原则：有操盘能力、有责任心的好人拥有控制权（AB股/一致行动/表决权委托）'
    - '- 进入机制：资金型溢价入、资源型对赌入、技术型专利入、全职型时间入'
    - '- 分配机制：静态初始分配 + 动态调整（业绩/贡献/增资/稀释）'
    - '- 退出机制：时间约束(锁定期)、回购原则(净资产/估值/协议价)、回购价格、优先清算权'
    - '**关键性质**'
    - '- 股权设计无标准答案，但无设计必有标准灾难'
    - '- 配套法律文本：公司章程、股东协议、投票权委托、回购协议、期权计划'
    - '- 阶段性：天使期重控制权、A轮重进入/退出、上市前重合规/结构清理'
    - '**典型例子**'
    - '- 作者股权五步法：定性定量计算股权比例（创始人身份/岗位权重/时间投入/资金投入） → 自评互评达成共识 → 签署配套协议'
    - '- 4C动态量化模型：创始人身份(C1)、岗位权重(C2)、时间投入(C3)、资金投入(C4) → 权重打分 → 量化出股权比例'
    - '**边界条件**'
    - '- 股权仅是“切蛋糕规则”，蛋糕做不大（业务失败）股权归零'
    - '- 过度复杂的股权结构（多层持股平台/大量小股东）会阻碍融资/上市'
    - '- 必须聘请专业律师落地文本，模板套用极易埋雷'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    - paper: docs/202301-02/20230207_03.md
      role: improve
    excerpts:
    - 做股权顶层设计时考虑的核心因素，还是顶层控制权、进入机制、分配机制、退出机制。
    - √：有操盘能力、有责任心的好人拥有公司的控制权…进入机制：资金型股东溢价进入，资源型股东对赌进入，技术型股东专利进入…分配机制：静态分配+动态调整…退出机制：退出时间约束、约定回购原则、约定回购价格。
    - 《初创公司如何科学量化股权分配？股权分配五步法教你不再踩坑》……在如何科学量化股权分配上，我还没有看到有圈友系统的分享过，所以今天我冒昧来给大家分享下如何定性定量的科学的把股权算出来。
