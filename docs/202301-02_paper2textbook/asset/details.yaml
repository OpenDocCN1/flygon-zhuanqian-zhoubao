    - 我又花了十几分钟，写了一百多行代码，成了全网首个把'ChatGPT'集成到公众号的人…我又花了十几分钟，做了一个 ChatGPT 的镜像的镜像（套娃）…包在小程序的壳子里上线了。
    - 目前消耗接近 50w 次请求
