      role: improve
    excerpts:
    - 比如最重要的是先卖产品的想法，而不是做产品。如果聊了 100 个人，只有几个人买，肯定有问题；如果 20-30 个人购买，交了预售金，那这个不确定因素就解决了。
    - 很多人严重低估已有项目而过分高估新项目；赚钱应结合自身已有资源，新项目与自身资源的匹配度（而非项目好坏）决定成功概率。
    - 拿出你现在收入的一部分，别舍不得，这是必须要花的钱，把重复的基础的活整理出来，安排给其他人...一旦你习惯了花钱找人帮你干活，你就开始成为一个老板，赚钱的杠杆就有了。
    - 商业英雄只是平台以及市场红利的产物。今天所有的大佬，都是在某一个时间，抓到了某一个市场红利，再匹以执行力，就赚到了第一桶金。
    - 买卖、生意、商业是三件事情...自己做所有事是出卖劳动力（买卖），通过代理商/多次卖出是生意，建立可复制放大的模式才是商业。
    - 在保证视频质量的前提下，量怼的越多，爆单的概率肯定就越大...点赞超过500的视频就10个，超过100赞的也没几个...纯靠怼量，把这个抖音号做起来了...累计带货10万+。
    - 健康的单店模型是加盟扩张的前提...我们提出了一个最新的标准：1）各种门店模型要测算到位；2）单店模型的财务模型要健康；3）要实现一定范围内的区域模型验证；4）该区域模型的复制性和财务模型要达标。
    - 对比即将上市的蜜雪冰城和已经上市的奈雪的茶（21年19亿利润 VS 亏损1.5亿）...加盟品牌的利润能力要比直营品牌高非常非常多。
    - 无人直播核心是准备高质量素材：录播别人内容需审查违禁词、去重处理，不能录带品牌标识的...平台检测风险：判雷同限流一个月、原创举报限流、判录播罚100-200、批量做号罚2-3千。
    - 视频号后端能挣钱的根本原因是后端商品的缺乏...一定要做店群，用矩阵思维对抗不确定性，最少做5个以上店铺。
    - 美团电商成长为团队的第二曲线，类目不同单店月利润6k-12k（零运营未优化）...第一家店跑通最小MVP仅仅花费了80元。
