    name: 喂养算法 —— 驯养一只“商业情报猎犬”
    points:
    - '**为什么需要这个概念？**'
    - '- 被动刷信息=娱乐消遣，主动喂算法=商业雷达'
    - '- 平台算法是黑箱，但可通过显性行为（点赞/收藏/停留）显性引导'
    - '- 解决“不知道找什么项目/找不到好项目”的源头问题'
    - '**核心定义**'
    - '- 在目标平台（抖音/小红书/公众号）批量点赞、收藏、关注、长停留商业类内容'
    - '- 持续1-2个月，算法模型标记你为“商业创作者/关注者”，持续推送同类优质案例'
    - '- 配合搜索/爬虫监测，构建立体情报获取体系'
    - '**关键性质**'
    - '- 低成本：零金钱投入，仅需时间纪律'
    - '- 复利效应：喂养越久，推送越精准，形成专属商业情报流'
    - '- 可迁移：换赛道/平台只需重新喂养新账号'
    - '**典型例子**'
    - '- 作者每天2小时泛读商业内容→喂养算法→刷到儿童游乐/文川手写/艺术签名等案例'
    - '- 建立项目库：每周整理飞书文档，几十个项目打分筛选'
    - '- 爬虫监测：技术配合监控竞品数据、爆款阈值'
    - '**边界条件**'
    - '- 账号垂直度：混杂娱乐内容会污染模型，需专号专用'
    - '- 算法周期：新号需1-2周冷启动，老号权重高见效快'
    - '- 信息过载：需建立筛选机制（真伪辨别/泛读/重点深读）'
    sources:
    - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
