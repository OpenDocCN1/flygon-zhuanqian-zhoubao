  life_analogy:
  - 想象短视频带货是一场**“开餐厅”**的生意：
  - '- **官方实时爆款视频库** = **米其林后厨的每日出菜单**：官方后厨（巨量百应）实时公布今天最卖座的菜（爆款视频）、食材成本（GMV）、食客评价（粉丝/互动），比美团大众点评（第三方工具）更准、更快、有隐藏菜单（腰部黑马）。'
  - '- **黑马小达人样本策略** = **只学“白手起家的小馆子”不学“继承家产的连锁店”**：大达人自带粉丝流量像“继承家产”，销量高不代表菜好；粉丝少却天天排队的小馆子，其菜单（脚本）、食材（选品）、火候（剪辑）才是纯技术、可复制的“硬本事”。'
  - '- **RPA 批量采集** = **雇佣一支“不眠不休的采购小分队”**：你给清单（搜索词/类目/GMV阈值），他们自动跑遍全市场（翻页/滚动），把菜单抄回来、食材（视频）买回来、整理成标准食谱表（脚本库），你只管做菜。'
  - '- **脚本模板复用论** = **把“红烧肉标准SOP”贴在灶台上**：爆款视频底层说服结构像“红烧肉”的固定步骤（焯水、炒糖色、炖煮、收汁），新菜（新视频）只需换食材（产品卖点）、调调火候（节奏），出品稳定、上手极快。'
  - '- **对标账号筛选标准体系** = **建立“合格供应商白名单”**：不找知名大厂（头部大号，素材带水印/字幕、去重难、被盯得紧），找“小而美、出货稳、包装干净、持续供货”的优质小厂（粉丝<5万/视频>200/垂直品/画面纯净），纳入白名单按周考核。'
  - '- **视频搬运去重流水线** = **中央厨房的“预制菜标准化加工线”**：原料进厂 → 统一切配（放大/翻转） → 换汤底（BGM/变速） → 贴自有品牌标签（加字引导）
    → 出成品。核心秘诀不是洗多干净（像素去重），而是贴上自家“招牌字”（场景化文案）让食客下单。'
  - '- **直播话术扒取与改写闭环** = **把“金牌销冠”的推销词变成“全员话术手册”**：派人偷师（双机录音） → 整理成分阶段、可复制的“话术积木”（开场砖/留人瓦/讲品梁/促单顶）
    → 新员工搭积木上岗 → 每周按实战数据换新积木。'
  - '- **靠视频拉流的开播节奏** = **“看天吃饭”的摆摊智慧**：视频是“风”，直播是“风筝”。风来了（视频破万）立马放线开播；风停了（流量衰减）果断收线关播，不硬抗、不浪费线（账号权重），等下阵风（下条爆款视频）再放。'
  - '- **小红书资料号** = **“免费试吃摊”引流术**：只给食客尝一口（冰山一角），剩下的“满汉全席”藏在后厨（私域），食客想吃全套就得加微信排队。评论区的“排队声”比点赞收藏更值钱。'
  - '- **抖音公转私** = **“自动化收费站”建设**：《官方ETC通道》（企业号后台/巨量纵横）免费、稳、不限流；《第三方现金车道》（App/小程序卡片）易拥堵、易被查、无自动收费。建设核心是：主路走官方ETC，备用道存现金车道，双线同时开工保通行。'
  - '- **抖音盲盒项目** = **“赌场筹码”管理游戏**：账号是筹码（消耗品），直播间是赌台，福袋是发彩金钓鱼，小号托是托儿带节奏。核心纪律：赢了收筹码（日结分成），输了换桌（刷机/换号），从不赌上瘾（止损/控时长），只赌数学期望（财务逻辑）。'
  summary:
  - concept: 官方实时爆款视频库
    desc: 巨量百应创意中心提供的实时、全维度、可下载的带货视频数据源，精度与时效性显著优于第三方工具
  - concept: 黑马小达人样本策略
    desc: 筛选粉丝量低但单视频GMV高的视频作为学习对象，剥离粉丝流量加成，还原可复制的纯内容转化能力
  - concept: RPA 批量采集
    desc: 基于影刀等工具开发参数化采集机器人，实现搜索、翻页、字段提取、表格导出、无水印下载的端到端自动化
  - concept: 脚本模板复用论
    desc: 将验证过的爆款脚本抽象为六大模块化骨架+变量槽位，新视频制作=选模板+填变量，大幅提升成功率与效率
  - concept: 对标账号筛选标准体系
    desc: 粉丝≤5万、视频≥200条、垂直品固定、画面干净、持续更新的量化筛选模型，配合周度评分巡检构建低风险素材池
  - concept: 视频搬运去重标准化流水线
    desc: 放大→翻转→BGM处理→加字引导四步核心SOP，配合批量工具实现日产百条合规视频，核心在于“加字”而非单纯去重
  - concept: 直播话术扒取与改写闭环
    desc: 扒取→结构化→改写→实战验证→版本迭代的全流程，将隐性话术资产显性化、模块化、合规化，支撑团队复制
  - concept: 靠视频拉流的开播节奏
    desc: 以视频破万播放为触发条件开播，单场1-3小时，流量衰减即关播，避免无效直播损账号权重，实现人效与流量利用率最大化
  - concept: 小红书资料号钩子设计
    desc: 遵循“给一半留一半”核心原则，通过冰山一角展示激发索取欲，配合评论区造势（引导+羊群效应）实现单篇笔记引流20-30人
  - concept: 抖音公转私官方接口升级玩法
    desc: 利用企业号后台官网主页、巨量纵横评论自动回复、直播卡片讲解类型，实现免付费、5秒内自动回复、抗封禁的跳转链路
  - concept: 抖音盲盒项目财务与风控体系
    desc: 以号为消耗品核算ROI，福袋+托儿破解冷启动，15分钟单场控风控，三级违规分级应对，封设备即刷机，实现可复制放大
  exercises:
  - 'no': 1
    title: 实战：从零搭建一个“竞品脚本雷达”
    contents:
    - 场景：你要切入“家用除螨仪”细分品类，需在 3 天内产出 10 条高转化潜力脚本。
    - 任务 1：打开巨量百应创意中心，用“创意搜索”以“除螨仪”为关键词，按 GMV 降序筛选近 7 天 TOP 20 视频。记录：前 3 条视频的 GMV、粉丝量、投流占比（若可见）。
    - 任务 2：应用“黑马小达人样本策略”，从 TOP 20 中筛选“粉丝<2万 且 GMV>5000”的视频。若不足 5 条，放宽粉丝阈值至 5 万，再筛。记录最终入选视频数量。
    - 任务 3：下载入选视频（无水印），用飞书妙记/剪映转文本。将每条视频按“前3秒钩子-痛点放大-产品演示-权威背书-价格锚定-行动号召”六模块拆解，提炼固定句式/镜头语言。
    - 任务 4：基于拆解结果，制作 1 份“除螨仪通用脚本模板”（骨架+变量槽位），并按模板生成 3 条不同卖点（如：母婴级除螨/宠物家庭/敏感肌友好）的脚本草稿。
    - 思考题：
    - '- 为什么不建议直接模仿粉丝 100 万+ 大达人的同品类视频脚本？'
    - '- RPA 采集机器人运行时“占用前台”如何解决？对比“专用闲置电脑”“云服务器”“无头浏览器”三种方案的成本与维护难度。'
    - '- 平台升级语义级视频理解后，像素级去重（放大/翻转）失效，脚本模板层面应如何进化？'
  - 'no': 2
    title: 实战：建立“种子对标账号库”并跑通去重流水线
    contents:
    - 场景：你需要为“中老年养生茶”品类建立长期素材供给渠道。
    - 任务 1：在快手/抖音搜索“养生茶/三高茶/药食同源”，按“最新”排序，人工浏览 50 个账号主页，按《对标账号筛选标准体系》六项硬指标（粉丝/视频数/垂直度/画面/非带货/更新频次）打分，筛选
      Top 5 纳入种子库。记录 5 个账号的主页链接与评分明细。
    - 任务 2：取种子库中某账号最新 3 条带货视频，按《视频搬运去重标准化流水线》操作：
    - '  1. 剪映专业版导入 → 画面放大 1.08 倍 + 水平镜像'
    - '  2. 原声处理：保留人声→变速 1.1x + 底噪；或静音→换节奏感 BGM'
    - '  3. 识别字幕 → 遮盖原字幕（黑条/马赛克） → 添加黄底红字“加字引导”（如：‘三高老伴不敢喝？这款0糖0添加’）'
    - '  4. 导出 1080P，用 MD5 修改工具改文件哈希。'
    - 任务 3：用抖音/视频号创作者中心“原创检测”功能测试 3 条成品视频，记录通过率。若有不通过，回溯是哪一步参数（放大倍数/翻转方向/BGM来源/字幕遮盖面积）导致。
    - 思考题：
    - '- “加字引导”文案如何A/B测试？设计一套“同素材、不同文案、分账号投、比转化”的最小化实验方案。'
    - '- 种子账号突然停更 10 天，评分模型应如何自动预警并触发替换机制？伪代码描述。'
  - 'no': 3
    title: 实战：直播话术“扒-改-练-测”最小闭环
    contents:
    - 场景：你要在视频号直播间卖“中老年按摩仪”，单场目标 GMV 1 万+。
    - 任务 1：扒取。找 3 场同品类头部直播回放（场观>5万、成交>200单），双机操作（一机看播、一机手机录音/电脑录屏），按“开场福袋(0-10min)-留人互动(10-30min)-讲品痛点(30-60min)-促单倒计时(60-90min)-逼单收尾(90-120min)”五阶段分段录音，语音转文字存入飞书文档。
    - 任务 2：结构化。提炼每阶段 3-5 个“黄金话术模块”（如：开场‘福袋钩子话术’，讲品‘决策树话术：肩颈疼选A/腰腿疼选B’），标注：心理触发点（损失厌恶/从众/权威）、违规风险词（最低价/全网首发/根治）。
    - 任务 3：改写。保留心理触发逻辑，替换为自有产品参数、主播人设语气（如：邻家大姐/退休老医生），清洗违规词。形成《按摩仪直播话术手册 V1.0》。
    - 任务 4：实战验证。按《靠视频拉流的开播节奏》，发 1 条垂直痛点视频（脚本来自练习1模板），破万播放后开播，主播背诵 V1.0 话术+实物演示。复盘记录：各阶段场观/停留/点击/下单/违规提醒。
    - 思考题：
    - '- 话术手册为何要按“阶段”而非“时间轴”模块化？当直播间流量结构变化（如极速流占比高/精准流占比高）时，如何动态增减模块？'
    - '- “违规词库”如何实现动态更新？设计一套“每日巡检平台公告+自动同步文档高亮+主播早会同步”的低成本机制。'
  - 'no': 4
    title: 实战：小红书资料号“选题-钩子-评论区”冷启动
    contents:
    - 场景：你要从 0 起一个“考公资料号”，目标首周引流 200 精准粉。
    - 任务 1：选题。用“找到蓝海赛道四步法”锁定细分赛道（如：省考行测/申论真题/面试热点），输出 10 个符合“三厨狂喜”的选题。
    - 任务 2：钩子制作。按“好钩子三步获取法”找 3 个同行高转化钩子，改编为“冰山一角”版本（展示 3 道题，引导“扣1领完整版”）。
    - 任务 3：发布与评论区运营。连发 3 天，每天 2 篇笔记（早/晚各 1），用“引爆评论区操作法”：大号引导扣数字 + 3 个小号抢首评。记录每篇笔记的评论数、引流数。
    - 任务 4：连爆验证。若某篇笔记评论破 100，次日按“连爆技术”复制该模板再发 2 篇，观察流量是否延续。
    - 思考题：
    - '- 为什么“赞 100 评 100”的笔记比“赞 1w 评 20”更赚钱？结合《资料号钩子核心原则》解释。'
    - '- 新号首篇笔记赞评比接近 1:1 是何信号？如何利用此信号判断账号权重？'
  - 'no': 5
    title: 实战：抖音公转私“官方接口双通道”搭建与压测
    contents:
    - 场景：你有一个蓝V认证的抖音号，需搭建“评论区自动回复+直播间小风车”双通道引流私域。
    - 任务 1：评论通道。登录巨量纵横，授权绑定抖音号，设置关键词“资料”→ 回复内容含微信客服链接/蓝字跳转。测试：评论“资料”后 5 秒内是否收到回复、链接是否可点击跳转微信。
    - 任务 2：直播通道。企业号后台→场景管理→添加直播卡片→选择“讲解”类型→配置微信客服跳转。开播测试：点击小风车是否弹出微信客服、是否可一键添加企微。
    - 任务 3：防封压测。连续 3 天日播，每日评论区诱导 50 次、直播间发卡片 20 次。记录：账号是否收到违规提醒、跳转链路是否中断、微信客服是否被限流。
    - 任务 4：兜底演练。模拟主小程序被封：切换备用小程序池、更换白名单域名、启用防截图举报机制。记录切换耗时、流量损失量。
    - 思考题：
    - '- 为什么“官方接口”能做到免费、自动回复、抗风险三合一？对比“第三方 App 生成卡片”在域名拦截、自动回复、抗举报三维度的本质差异。'
    - '- 双线防封（抖音端+微信端）中，哪一端的风控更隐蔽、更难排查？如何设计“抖音来电+微信客服后台”双预警机制？'
  - 'no': 6
    title: 实战：抖音盲盒项目“起号-风控-复制”最小闭环
    contents:
    - 场景：你要测试抖音盲盒直播项目，预算 2000 元（含设备/抖币/样品），目标 7 天内单号日均利润 500+。
    - 任务 1：起号。新号养 3 天（刷视频/看直播/点赞）→ 第 4 天开播：充 6 元抖币发福袋（评论指令/5min/1/3个）→ 安排 2 个小号抢福袋造从众
      → 单场 15 分钟，日两场。记录：开播 2/5/10 分钟进人数、极速流有无。
    - 任务 2：风控分级应对。若出现违规：
    - '  - “未挂载组件”：立即开橱窗挂手机链接规避；'
    - '  - “不确定性派发”：屏蔽“盲盒/抽奖”词、控时长≤20min；'
    - '  - “违反行为规范”：当天停播，次日同设备复播验证→换机排查→监听抖音来电→确认封设备即刷机。'
    - 任务 3：复制放大。跑通单号模型后，按“纯提成合作模式”招 2 个主播（无底薪/10-15%提成/日结），同设备轮播，目标日产出 3 号×2 场×15min。
    - 任务 4：财务复盘。核算：设备成本+抖币+样品+主播提成 vs 佣金收入，判断 ROI 是否>1。若<1，伪代码描述自动止损逻辑（如：连续 3 天亏损→停项）。
    - 思考题：
    - '- “财务逻辑：号=消耗品”如何改变传统“养号惜号”心态？在什么情况下应果断刷机换号而非申诉？'
    - '- “锁人头”机制下，充值转化差为何不可急？设计“进群 3/7/14 天未充值”分层唤醒策略。'
  units:
  - 'no': 1
    name: 官方实时爆款视频库 —— 让对标拥有“实时雷达”
    points:
    - '**为什么需要这个概念？**'
    - '- 短视频带货需要快速找到当下最能出单的视频脚本和选品'
    - '- 第三方工具（抖查查、蝉妈妈）数据滞后、不准，无法捕捉最新爆款'
    - '- 官方平台（巨量百应创意中心）掌握一手实时 GMV、粉丝、投流数据，是“最准的对标源”'
    - '**核心定义**'
    - '- 巨量百应创意中心内置的“爆款视频”与“创意搜索”两大模块'
    - '- 可按行业、作者等级、时间周期、关键词/商品名筛选近期带货效果最好的真实短视频'
    - '- 提供视频 GMV、销量、粉丝量、投流数据等核心指标，支持无水印下载'
    - '**关键性质**'
    - '- 实时性：数据为平台官方实时更新，比第三方工具快、准'
    - '- 全维度：覆盖各行业、各层级作者（含腰部/尾部黑马），非仅头部榜单'
    - '- 可下载：支持批量导出数据表格、无水印视频文件，便于二次分析'
    - '**典型例子**'
    - '- 搜“拖把”关键词，按 GMV 降序，10 秒内找到近 7 天卖得最好的 20 条带货视频及其完整数据'
