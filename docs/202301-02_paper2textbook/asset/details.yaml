  - ├── 财富积累四阶段（出卖劳动力→一份时间多卖→买他人时间→钱生钱）
  - ├── 人生四阶段（扩广度→做管理→找第二曲线→复制放大）
  - ├── 战略即选择（核心是不做什么）
  - ├── 杠杆效应（劳动力、媒体、代码边际成本零）
  - ├── 商业模式换汤不换药
  - ├── 执行力可变现
  - ├── 战术勤奋不逃避战略探索
  - └── 做事依据能力资源非愿望
