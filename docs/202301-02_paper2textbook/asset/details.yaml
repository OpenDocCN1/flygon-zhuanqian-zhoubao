    name: 资源匹配度评估 —— 不做“好项目”，只做“适合我的项目”
    points:
    - '**为什么需要这个概念？**'
    - '- 创业者常犯错：严重低估已有资源，过分高估新项目，盲目All In陌生赛道'
    - '- 项目成败取决于“项目需求资源”与“自有资源”的匹配度，而非项目本身好坏'
    - '- 需要一套结构化的“资源盘点→项目拆解→匹配决策”工具'
    - '**核心定义**'
    - '- 三步法：①盘点自有资源（粉丝、经验、软件、团队、案例、渠道、资金等）；②拆解目标项目所需关键资源；③评估匹配度，匹配度高（如100%）即启动，低则放弃或补齐'
    - '- 核心判据：我是否已具备该项目最关键的1-2个核心资源？（如流量渠道、供应链、转化话术）'
    - '**关键性质**'
    - '- 避坑神器：帮你过滤掉“看起来很美、做起来要命”的伪好项目'
    - '- 复利思维：在已有资产上叠加新业务，边际成本低、成功率高、抗风险强'
    - '- 动态更新：资源随项目积累变化，定期复盘重新匹配'
    - '**典型例子**'
    - '- 作者：公众号经验+流量+人+项目 = 匹配外卖CPS/副业课程（匹配度100%），3月赚100万、总利润300万'
    - '- 反例：此前多项目累计亏损100万+，皆因资源错配（如做不懂的重运营项目、无供应链做电商）'
    - '**边界条件**'
    - '- 核心资源必须是“显性、可迁移、可复用”的（如渠道、品牌、SOP），隐性经验/人脉难量化'
    - '- 新赛道/新模式若无任何资源匹配，建议“打工/合伙/小额试错”积累资源后再启动'
    - '- 避免陷入“只有锤子，满世界找钉子”的资源锚定偏见'
    sources:
    - paper: docs/202301-02/20230207_09.md
      role: origin
    - paper: docs/202301-02/20230207_06.md
      role: improve
    excerpts:
    - 第一步：盘点自己手里有哪些资源
    - 第二步：拆解项目需要的资源
    - 我以自己举例……那么我的资源就是：公众号经验+流量+人+项目=找到适合公众号变现的方法就可以直接开始
    - 所以对我来说这个项目和我匹配程度就是 100%，因为：公众号经验、美团饿了么平台、导流方法，我都有。
    - 很多人都有一个误区，那就是严重低估已有项目，同时过分高估新的项目
    - 战略就是先审视自己手里的筹码，也就是自己的优势，然后再决定自己怎么打牌，也就是如何运用自己的优势来获得你想要的结果。
  - 'no': 12
    name: 商业拆解复制法 —— 把“赚钱的别人”拆成“可复制的SOP”
    points:
    - '**为什么需要这个概念？**'
    - '- 同行是最好的老师，抄同行是最快捷径，能避开90%弯路'
    - '- 但凡是“抄表面”（抄文案、抄图、抄品），不抄底层链路（流量从哪来、怎么转化、怎么交付、怎么裂变），必死无疑'
    - '- 需要一套标准化的“商业X光机”，透视同行全链路'
    - '**核心定义**'
    - '- 核心动作：刷短视频/搜关键词找同行 → 以客户身份套话/下单/进群 → 拆解：前端内容/渠道、中端引流/私域、后端产品/转化/交付/裂变 → 判断可复制性（货源非独家、场景验证有需求、门槛可跨）
      → 低成本复制启动'
    - '- 关键判断点：货源是不是他的？场景需求是不是真的？我能不能搞到货？我能不能跑通流量？'
    - '**关键性质**'
    - '- 确定性优先：不需要偶然性，要确定性；设计两条腿走路（如公域+私域、达人+矩阵）'
    - '- 快速验证：拆解后立即用MVP验证，跑通再放大'
    - '- 迭代进化：抄同行起步，微创新（材质/包装/服务/组合）建立护城河'
    - '**典型例子**'
    - '- 儿童游乐项目：拆解爆款视频，判断货源非独家+场景验证有需求，3月招40+加盟商赚40万'
    - '- 设计Logo/艺术签名：免费素材全网有、爆款概率大、验证可复制变现'
    - '- 闲鱼套利：拆解“低买高卖”底层逻辑，验证飞利浦音响、360U盘、欧普台灯三个案例均盈利'
    - '**边界条件**'
    - '- 仅适用于“非强专利、非强品牌、非强供应链、流程可标准化”的轻资产项目'
    - '- 核心风险：平台规则变动、供应链断供、同行反制、法律合规（侵权/虚假宣传）'
    - '- 拆解能力依赖商业直觉与经验，新手易“看不透本质、抄不全链路”'
    sources:
    - paper: docs/202301-02/20230207_08.md
      role: origin
    - paper: docs/202301-02/20230207_03.md
      role: improve
    excerpts:
    - 同行就是最好的老师，抄同行永远是做项目最快的途径，能避开多数弯路和无用功。
    - 每个项目都有关键词，通过关键词在各个推广渠道搜索这个项目的关键词就一定可以找到同行。
    - 我们以客户的角度去思考如果我想要买这个产品，我会在哪去搜关键词，自然也可以找到同行的流量渠道。
    - 拆下来之后，我就发现很多时候有些项目是完全可以复制的，是不需要投入几十万也可以复制的。
    - 分析完上述内容后，我基本上判断这个项目是可以复制的。首先，这个视频爆得偶然；其次，他货源不是他自己的；最后，这个消费场景经过验证是证明是有需求的。
