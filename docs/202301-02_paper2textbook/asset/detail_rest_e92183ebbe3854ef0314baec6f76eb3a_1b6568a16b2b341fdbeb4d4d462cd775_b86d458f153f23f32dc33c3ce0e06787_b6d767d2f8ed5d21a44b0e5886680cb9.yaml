learning_targets:
- 理解痛点切入点与信息差变现的商业第一性原理
- 掌握最小MVP闭环的跑通标准与迭代方法
- 掌握选品决定论：如何筛选自带流量、高转化、高复购、可建立品牌溢价的核心单品
- 理解公私域联动模型：公域广撒网筛选意向、私域深诊断高客单高复购裂变
- 掌握标准化复制与矩阵放大的SOP颗粒度、人才标准化、利益绑定机制
- 建立风控与止损体系：平台规则红线、法务前置、现金流止损线、核心资产去中心化
concept_map:
- 副业创业实战方法论（第23章）
- ├── 核心认知层
- │   ├── 痛点即切入点 —— P001
- │   │   ├── 自证性：创始人亲历降低信任成本
- │   │   ├── 传播性：方案自带种草属性
- │   │   └── 验证性：MVP跑通的标尺
- │   ├── 信息差变现 —— P003
- │   │   ├── 非对称性：知/不知/不愿公开
- │   │   ├── 时效性：随公开度贬值需持续挖掘
- │   │   └── 合规边界：公开整合vs非法窃取
- │   └── 选品决定论 —— P004
- │       ├── 流量自带性：精准搜索流量
- │       ├── 转化自带性：产品力强降低销售压力
- │       └── 复购/溢价基因：耗材+品牌故事
- ├── 执行验证层
- │   ├── 最小MVP闭环 —— P002
- │   │   ├── 可复制性导向：标准化模块设计
- │   │   ├── 快速迭代：基于真实交易反馈
- │   │   └── 止损前置：投入上限设定
- │   └── 公私域联动 —— P005
- │       ├── 分层运营：公域标准化矩阵 vs 私域SOP人设分层
- │       ├── 数据打通：全链路量化ROI/单客价/裂变系数
- │       └── 互为备份：公域号被封私域兜底/私域受限公域冷启动
- ├── 放大复制层
- │   └── 标准化复制与矩阵放大 —— P006
- │       ├── SOP颗粒度：脚本/参数/部署包决定成功率
- │       ├── 人的标准化：可塑新人+喂饭级SOP+晋升通道
- │       ├── 利益绑定：先投入/先垫资/背靠背考核
- │       └── 滚动开发：1盈利+1开发+1知识付费对抗生命周期衰退
- └── 生存防御层
- └── 风控与止损 —— P007
- '    ├── 平台规则敬畏：控制时长/硬改设备/合规组件'
- '    ├── 法务前置：合同四件套/股权协议/识别骗子公司'
- '    ├── 现金流止损：单项目上限/见好就收/狠心出货'
- '    └── 核心资产去中心化：多账号/多渠道/多供应商/多城市'
life_analogy:
- 想象创业像**在陌生城市开一家“解决特定麻烦”的小店**：
- '- **痛点切入点** = 你发现这城里没处治“牙疼”（真痛点），你自己牙疼过且治好（自证性），开牙科诊所比开“综合养生馆”更易活'
- '- **最小MVP闭环** = 别先装修豪华诊所（造航母），先买把好椅子+一套工具（最小资源），治好第一个陌生人的牙收1块钱（跑通闭环）'
- '- **信息差变现** = 你知道城里哪家药房有特效药、哪条路不堵车（非对称信息），把这“路线图”卖给急需的人，赚“省时间”的钱'
- '- **选品决定论** = 卖“专治牙疼的神药”（自带流量/高转化/高复购）比卖“万能维生素”容易万倍，前者客户上门、后者需你吆喝'
- '- **公私域联动** = 在大街发传单/直播拔牙（公域广撒网筛选） → 加微信建档/定期复查/推荐洗牙/介绍家人（私域深度运营/高单客价/裂变）'
- '- **标准化复制** = 把“看诊流程/药方/话术/装修/招聘/培训”打包成“连锁加盟手册”，招应届毕业生按手册干也能出结果'
- '- **风控止损** = 卫生许可证/医师资格证（法务前置）、单店亏损超10万即关店（止损线）、多开几家分店/多雇几个医生/多备几家药商（去中心化）'
summary:
- concept: 痛点切入点
  desc: 创业起点源于创始人亲历或深度观察的高频、刚性、情绪化、现有方案体验差的真实问题，自带验证性与传播性
- concept: 最小MVP闭环
  desc: 以最小资源跑通‘产品-流量-销售-交付’全链路，核心指标为1-3个月正现金流与可复制模块化
- concept: 信息差变现
  desc: 掌握用户急需且高成本难获取的关键信息（渠道/流程/避坑/资源），产品化/服务化收费，核心护城河极浅需快速建立二道护城河
- concept: 选品决定论
  desc: 好产品自带精准搜索流量、极致性价比体验差、品牌溢价潜力与微创新空间，是流量与转化的上游决定因子
- concept: 公私域联动
  desc: 公域负责低成本广撒网筛选意向，私域负责深诊断高客单高复购裂变沉淀资产，互为备份形成飞轮
- concept: 标准化复制与矩阵放大
  desc: 将跑通模式拆解为标准动作库/工具包/人才模型/考核体系，通过多账号/多门店/多项目并行实现指数级增长
- concept: 风控与止损
  desc: 建立平台规则红线、法律合规底线、现金流安全线、核心资产备份与止损触发条件，只做‘输得起、赚得多、可复制、有护城河’的事
exercises:
- 'no': 1
  title: 练习1：为你的副业想法画一张‘痛点-信息差-MVP’画布
  contents:
  - 1. 写下你亲历或深度观察到的 3 个‘高频+刚性+情绪化+现有方案烂’的痛点
  - 2. 针对每个痛点，列出：用户自行解决需花多少钱/时间？你能提供什么‘非对称信息’（渠道/流程/避坑/资源）把成本降 80%？
  - 3. 设计最小 MVP：花 ≤1000 元、≤7 天，完成‘有一个可交付品 → 找 1 个陌生人付费 → 交付获好评’全流程
  - 4. 设定止损线：最多再投多少钱/天？跑不通的判定标准是什么？
  - 回答问题：
  - '- 哪个痛点的‘信息差护城河’最深？为什么？'
  - '- 你的 MVP 里哪个环节最依赖‘个人直觉’而非‘标准动作’？如何 SOP 化？'
- 'no': 2
  title: 练习2：拆解一个你熟知的‘公私域联动’案例
  contents:
  - 选取一个你见过的成功案例（可以是夕子/老杨/胖龟，也可以是身边同行），按下表拆解：
  - '| 环节 | 公域动作（平台/内容/钩子） | 私域动作（工具/分层/SOP/裂变） | 关键数据（引流成本/转化率/单客价/复购/裂变系数） | 备份机制（号封/触达失效咋办）
    |'
  - '|------|----------------------------------|--------------------------------------|--------------------------------------------------|----------------------------------------|'
  - '| 获客 |                                  |                                      |                                                  |                                        |'
  - '| 转化 |                                  |                                      |                                                  |                                        |'
  - '| 复购 |                                  |                                      |                                                  |                                        |'
  - '| 裂变 |                                  |                                      |                                                  |                                        |'
  - 回答问题：
  - '- 该案例的‘公域标准化程度’与‘私域人设化程度’各打几分？为什么？'
  - '- 如果平台明天封杀其主引流钩子，它能在 2 周内切换新钩子吗？关键阻力在哪？'
- 'no': 3
  title: 练习3：给你的项目写一份‘标准化复制包’清单
  contents:
  - 假设你的单点模型已跑通，准备矩阵放大。请列出你需要交付给合伙人/员工/加盟商的‘四大标准件’清单：
  - 1. 标准动作库（SOP）：必须细到什么颗粒度？（如：脚本逐字稿、剪辑时间点、话术问答库、发圈模板、程序控制参数、硬件清单、软件部署包）
  - 2. 标准工具包：软件/硬件/物料/模板/素材库清单
  - 3. 标准人才模型：岗位 JD、招聘画像（可塑新人 vs 明星员工）、培养路径（如：剪辑→运营→项目经理）、喂饭级培训大纲
  - 4. 标准考核与利益绑定：KPI/分成规则、先投入/先垫资门槛、背靠背考核机制、淘汰/退出条款
  - 回答问题：
  - '- 哪一项‘标准件’目前最欠缺？缺它会导致什么具体的‘复制失真’？'
  - '- 你的项目生命周期预估几个月？如何设计‘1盈利+1开发+1知识付费’的滚动开发机制对抗衰退？'
