unsupported_claims:
- location: 31.3.5
  claim: 一个只会卖课没文化的IP，硬套‘哲学大师’母题，用户一眼识破。
  reason: 素材中未找到支撑此具体案例或论断的内容，属于作者推演而非素材直接引用。
- location: 31.4.4
  claim: 龙飞律师的核心打法为松弛感连麦...结果账号短时间内破千万粉，这直接验证了4级观感中‘松弛感’的商业价值
  reason: 素材P001中虽提到龙飞律师松弛感连麦案例，但未明确提及‘短时间内破千万粉’这一具体数据结果。
- location: 31.7.3
  claim: 流量堆砌的IP：用户资产边界窄，线性增长...品牌势能积累的IP：用户资产边界广，幂次效应更强...这叫‘多次觉醒’。
  reason: 素材P001提到‘幂次效应’及品牌势能，但‘流量堆砌IP线性增长’、‘多次觉醒’等对比论述属于作者基于素材概念的延展性总结，非素材原文直接表述。
- location: 31.8.3
  claim: 术是道的‘展开图’。道定了‘做什么’，术就要把‘怎么做’推演完整。器是术的‘放大器’。用是道术器的‘试金石’和‘进化器’。
  reason: 素材P003定义了道法术器用四层含义，但‘展开图’、‘放大器’、‘试金石/进化器’等隐喻性定义为作者结构化重述，非素材原话。
- location: 31.13.4
  claim: 解决方案：不是‘下不为例’或‘买个响得更大的闹钟’，而是建立‘每月1号检查闹钟电池/充电’的SOP机制...
  reason: 素材P003给出5WHY案例至‘忘记换电池’为根因，但未给出具体SOP解决方案，该方案为作者补充。
- location: '31.15'
  claim: 三份素材均认为单纯的‘定位/标签’不足以构建护城河...长期主义是前提...
  reason: 素材P001明确对比母题与定位；P002、P003未直接讨论‘定位/标签’与‘护城河’关系，该共识为作者跨素材归纳。
