learning_targets:
- 理解股权分配的核心矛盾：从“人情账”到“明白账”的转变需求
- 掌握4C动态量化股权分配模型的四个维度及其参考权重范围
- 能运用股权分配五步法为初创团队计算初步股权比例
- 理解创始人身份的本质是风险承担，而非出资多少或职位高低
- 认识岗位权重、时间投入、资金投入在量化模型中的具体内涵与衡量标准
- 领会前期共识机制对避免合伙拆伙、保障团队稳定的关键作用
- 能识别4C模型的边界条件，理解初步股权比例仅是起点，需合同配套落地
- 明确股权分配中资金投入的“信号价值”：真金白银体现信心与风险意愿
concept_map:
- 股权分配
- ├── 核心痛点
- │   ├── 朋友间谈钱伤感情                    —— P001
- │   ├── 主观判断无法量化贡献                —— P001
- │   └── 对自身重要程度判断不一致导致拆伙    —— P001
- ├── 4C动态量化股权分配模型
- │   ├── 创始人身份（10%-30%）
- │   │   ├── 本质：风险承担与兜底责任        —— P001
- │   │   ├── 关键：话语权锚点，公司唯一声音  —— P001
- │   │   └── 判定：谁愿意无条件兜底谁掌舵    —— P001
- │   ├── 岗位权重（30%-40%）
- │   │   ├── 本质：行业技术壁垒所在          —— P001
- │   │   ├── 判定：自评互评打分（如7:2:1）   —— P001
- │   │   └── 影响：四维度中占比最高           —— P001
- │   ├── 时间投入（10%-25%）
- │   │   ├── 误区：全职≠高产出，兼职≠低价值  —— P001
- │   │   ├── 核心：产出需匹配项目里程碑        —— P001
- │   │   └── 外延：包含愿意引进的资源          —— P001
- │   └── 资金投入（20%-50%）
- │       ├── 作用：为项目提供运转资本          —— P001
- │       ├── 信号：真金白银体现信心与风险意愿  —— P001
- │       ├── 行业差异性：资金驱动型行业权重更高 —— P001
- │       └── 边界：出钱多≠决策权，不等同创始人 —— P001
- └── 操作流程与落地
- '    ├── 股权分配五步法'
- '    │   ├── 确定行业和赛道（2维4类型）       —— P001'
- '    │   ├── 收集创始团队信息（全职/岗位/出资）—— P001'
- '    │   ├── 确定各维度权重比例（自评互评）    —— P001'
- '    │   ├── 确定股东各维度权重系数（1-10打分）—— P001'
- '    │   └── 加权计算各股东股权比例            —— P001'
- '    ├── 前期共识机制'
- '    │   ├── 时机：公司未盈利时最佳            —— P001'
- '    │   ├── 方法：自评+互评达成一致           —— P001'
- '    │   └── 作用：前置消除分歧，避免拆伙      —— P001'
- '    └── 合同配套与边界'
- '        ├── 起点非终点：需合同规范调整         —— P001'
- '        └── 配套工具：一致行动权/期权池/回购权等—— P001'
life_analogy:
- 想象股权分配是**几个朋友合伙开一家餐厅**：
- '- **创始人身份** = 餐厅的**大厨兼老板**，他不仅投入心血，更在餐厅倒闭时承担所有债务，因此拥有最终决策权'
- '- **岗位权重** = 餐厅的**核心菜系**，做招牌菜的厨师比其他打杂人员更重要，因为菜好不好吃决定餐厅生死'
- '- **时间投入** = 服务员的工作时长，但**关键不是站了几小时，而是翻台率有没有达标、有没有带来熟客资源**'
- '- **资金投入** = 谁出了**装修费和设备钱**，但这不代表他就是老板，出钱多的人可以分红多，但决策权仍在大厨手里'
- 就像分蛋糕前需要明确切分的依据（谁出钱、谁掌勺、谁经营），股权分配也需要在开张前就把规则定清楚，才能避免生意红火后因分账不均而散伙。
summary:
- concept: 4C动态量化股权分配模型
  desc: 将资本细分为创始人身份、岗位权重、时间投入、资金投入四个维度，加权计算股权比例，把“人情账”变“明白账”
- concept: 创始人身份
  desc: 本质是风险承担与兜底责任，而非出资多少；谁承担最大风险谁最有控制权，公司对外只能有一个声音
- concept: 岗位权重
  desc: 代表行业技术壁垒所在，是四维度中占比最高（30%-40%）的因素，通过自评互评打分确定
- concept: 时间投入
  desc: 核心是产出是否匹配项目里程碑，而非简单区分全职/兼职；同时包含愿意为项目引进的资源
- concept: 资金投入
  desc: 既为项目提供运转资本，更是判断合伙人信心和风险承担意愿的“信号”；出钱多不等同于创始人
- concept: 股权分配五步法
  desc: 确定赛道→收集信息→定维度权重→定股东系数→加权计算，是标准化的五步操作流程
- concept: 前期共识机制
  desc: 在公司未盈利时通过自评互评达成共识，可前置消除“我觉得自己最重要”的分歧，有效避免拆伙
- concept: 合同配套与落地
  desc: 计算出的初步股权比例仅是起点，仍需一致行动权、期权池、回购权等合同规范与调整才能最终落地
exercises:
- 'no': 1
  title: 手算一次股权分配
  contents:
  - 给定三个合伙人A、B、C合作创业：
  - '- 项目类型：资金驱动型技术创业项目，启动资金500万'
  - '- A：发起人，全职负责技术研发，出资200万'
  - '- B：全职负责市场销售，出资150万'
  - '- C：兼职提供行业资源，出资150万'
  - 假设创始团队自评互评结果如下：
  - '- 岗位权重（技术:市场:资源）= 5:3:2'
  - '- 时间投入（A:B:C）= 6:3:1'
  - '- 创始人身份A=10分，B=5分，C=3分'
  - '- 资金投入（A:B:C）= 4:3:3'
  - 请按以下步骤计算：
  - 1. 设定四个维度的权重比例（在参考范围内自行设定）
  - 2. 汇总各股东在每个维度的得分
  - 3. 加权计算每位合伙人的最终股权比例
  - 回答问题：
  - '- 如果提高资金投入的权重到45%，C的股权比例会发生什么变化？'
  - '- 你认为怎样的权重设定对A最有利？最不利？'
  - '- C的创始人身份得分低，但他的资金投入高，这对最终结果产生了什么影响？'
- 'no': 2
  title: 案例诊断：这家公司为什么会散伙？
  contents:
  - 阅读以下场景：
  - 小王、小李、小张三人合伙开了一家教育培训公司。小王出资30万并全职管理教学，小李出资40万全职负责市场，小张出资30万但仅偶尔提供建议。由于项目启动时没有做股权分配，大家口头约定"按出资比例分配"。两年后公司盈利，小王认为自己贡献最大应多分，小李也认为市场是核心竞争力，而小张觉得自己出了最多的钱理应多拿，三方争执不下，最终散伙。
  - 回答问题：
  - '- 用4C模型分析，这三个人的分歧点分别对应哪个维度的权重视角？'
  - '- 如果他们在创业前使用五步法，你预估岗位权重和时间投入应该怎么设定？'
  - '- "按出资比例分配"的约定错在哪里？从"创始人身份"和"岗位权重"的角度解释。'
  - '- 结合4C模型，你认为在新项目中他们应该提前进行哪些沟通？'
- 'no': 3
  title: 实战演练：设计一家餐饮店的股权方案
  contents:
  - 场景设定：你和两位朋友计划开一家网红火锅店，预期启动资金100万。
  - '- 你：拥有5年餐饮管理经验，全职投入，愿意出资30万'
  - '- 朋友甲：有火锅底料的独家秘方，全职负责后厨，只能出资10万'
  - '- 朋友乙：有资金实力但无餐饮经验，不愿全职参与，愿意出资60万'
  - 按要求完成以下工作：
  - 1. 将行业归类到4C模型中的赛道类型（技术/资金驱动 × 自主/集团孵化）
  - 2. 为四个维度设定你认为合理的权重范围，并说明理由
  - 3. 为三位合伙人在每个维度上打分（1-10分）
  - 4. 计算每位合伙人的初步股权比例
  - 5. 针对计算出的结果，提出需要关注的潜在风险点
  - 思考题：
  - '- 如果乙希望获得更多话语权，你如何用"创始人身份"的概念回应？'
  - '- 针对朋友甲"技术核心但资金少"的情况，如何利用"期权池"机制解决？'
  - '- 这个股权方案在执行过程中可能遇到哪些"前期共识"未覆盖的问题？'
units:
- 'no': 1
  name: 4C动态量化股权分配模型 —— 让股权分配从"拍脑袋"变"按公式"
  points:
  - '**为什么需要这个概念？**'
  - '- 初创团队合伙创业时，股权分配往往是最大痛点，朋友之间不好意思谈钱，谈钱容易伤感情'
  - '- 传统"谁出力多谁多拿"的主观判断无法量化，导致合伙人自以为贡献大但分得少，埋下拆伙隐患'
  - '- 需要一个可操作的定量工具，把抽象的贡献转化为具体的股权比例，把"人情账"变"明白账"'
  - '**核心定义**'
  - '- 4C动态量化股权分配模型：将资本分为人力资本与货币资本，细分为创始人身份、岗位权重、时间投入、资金投入四个维度（4个C即资本Capital），每个维度设定可波动的参考权重范围，通过加权计算得出各股东股权比例'
  - '- 四个维度的参考权重：创始人身份10%-30%，岗位权重30%-40%，时间投入10%-25%，资金投入20%-50%'
  - '- 配套"股权分配五步法"：确定行业赛道→收集创始团队信息→确定各维度权重→确定各股东权重系数→加权计算股权比例'
  - '**关键性质**'
  - '- 定量化：将定性的贡献讨论转化为可计算的数值模型,每个维度1-10打分，最终得到清晰的股权数字'
  - '- 可调性：四个维度的权重比例并非固定，在参考范围内波动，需创始团队自评互评达成共识'
  - '- 行业适配性：不同行业对资金和技术的要求不同，需先确定行业赛道（技术驱动型/资金驱动型、自主创业型/集团孵化型）再定权重'
  - '- 前置性：适合在公司尚未盈利、大家还不计较的阶段使用，趁早把话说清楚避免后续纠纷'
  - '**典型例子**'
  - '- 三个朋友合伙做儿童体能训练项目，启动资金200万：小明出资50万并是发起人、小磊负责市场、小胡出资150万。通过自评互评确定岗位权重7:2:1、时间投入6:3:1，最终计算出各股东股权比例'
  - '**边界条件**'
  - '- 计算出的初步股权比例只是起点，仍需配套一致行动权、期权池、分红奖励、回购权、优先清算权、领售权等一系列合同规范和调整，才能体现在工商商事主体上'
  - '- 权重参考范围（10%-30%等）是成百上千个案例积累的经验值，并非固定标准，实操中需创始团队共同锚定达成共识'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 今天给大家提供一个工具，这个工具的名称叫 4C 动态量化股权分配模型。
  - 4C中的C，就是资本的意思，资本我们分为人力资本和货币资本。再细分成4个维度的话，就是创始人身份、岗位权重、时间投入、资金投入。这四个维度是这个工具里面已经给大家植入的一个参数，这个参数是在一定的范围内波动的。
  - 第一个步骤：确定行业和赛道……第二个步骤：收集创始团队信息……第三个步骤：确定每个维度的权重比例……第四个步骤：确定股东四个维度的权重系数……第五个步骤：计算出各个股东的股权比例。
- 'no': 2
  name: 创始人身份 —— 谁兜底，谁掌舵
  points:
  - '**为什么需要这个概念？**'
  - '- 初创公司对外只能有一个声音，谁说了算必须从第一天就明确，否则后期管理混乱、决策低效'
  - '- 创始人身份不能靠"谁股份多谁说了算"来简单界定——股份可以用钱买，但创始人的责任和风险承担无法用钱衡量'
  - '- 需要回归创始人的本质——风险兜底，用"谁承担最大风险谁最有控制权"来界定话语权'
  - '**核心定义**'
  - '- 创始人身份：指谁在企业中承担最大风险、在项目遇到极大困难时愿意无条件兜底，因而最有控制企业的需要和资格'
  - '- 在4C模型中，创始人身份是最重要的维度，权重通常在10%-30%'
  - '- 创始人身份必须极度明确，从一开始就要确立，一家公司对外只能有一个声音'
  - '**关键性质**'
  - '- 风险导向：创始人身份的本质是风险承担而非荣耀或出资多少，谁愿意无条件为项目兜底谁就是创始人'
  - '- 不可替代性：创始人的付出程度与其他合伙人完全不同，因为他承担了别人不愿承担的最坏情况'
  - '- 话语权锚点：创始人身份决定了公司的控制权归属，是后续岗位、时间、资金分配的基准'
  - '**典型例子**'
  - '- 儿童体能训练案例中，小明作为发起人前期准备出资50万，而小胡虽出资150万（资金投入高），但创始团队仍通过身份维度确认小明的创始人地位'
  - '**边界条件**'
  - '- 创始人身份应与风险承担的实际意愿匹配，不能只挂名不兜底，否则会在项目遇困时暴露矛盾'
  - '- 若项目由投资人主导完全出资，创始人身份可能转移到投资方，需在前期明确约定'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 在我看来，它其实代表着风险承担，就谁最后在兜底。当这个项目不成立或这个项目遇到了极大的风险，谁愿意无条件的去为这个项目兜底，那这个人就是创始人，他对这个项目的付出程度是跟其他的合伙人完全不一样。
  - 创始人的身份是要极度明确的，从一开始就要很明确，它是要能控制这个项目的，一家公司最后对外的时候，应该只有一个声音。
  - 创始人身份的权重通常在10%-30%。
- 'no': 3
  name: 岗位权重 —— 谁是技术的"承重墙"
  points:
  - '**为什么需要这个概念？**'
  - '- 不同岗位对项目的价值贡献截然不同：有些岗位掌握核心技术壁垒，有些岗位随时可被替代'
  - '- 如果不在前期明确哪个岗位最重要，公司发展壮大后各合伙人会因"我岗位更重要"产生分歧'
  - '- 行业技术壁垒决定公司成败，需要以岗位为维度量化各合伙人的贡献权重'
  - '**核心定义**'
  - '- 岗位权重：指该行业技术壁垒所在——哪个岗位对项目成功最重要，在4C模型中权重通常在30%-40%'
  - '- 反映各岗位对项目价值的相对重要性，通过自评互评打分确定（如7:2:1）'
  - '**关键性质**'
  - '- 行业差异性：不同赛道的技术壁垒岗位不同——编程项目的技术岗、销售项目的市场岗、生产项目的运营岗各不相同'
  - '- 前期的分歧隐蔽性：合伙人早期不易发现对岗位重要性判断的差异，但公司壮大后分歧会逐渐放大'
  - '- 直接影响股权：岗位权重是四维度中占比最高的因素（30%-40%），对最终股权比例影响最大'
  - '**典型例子**'
  - '- 儿童体能训练项目中，创始团队通过自评互评确定岗位权重为7:2:1，即负责核心教学/运营的岗位贡献最大，负责辅助工作的岗位贡献小'
  - '**边界条件**'
  - '- 岗位权重针对的是"当前阶段"的项目需要，若项目转型或扩张，各岗位的相对重要性会变化'
  - '- 自评互评需建立在坦诚沟通基础上，若合伙人碍于情面不敢表达真实看法，权重分配会产生偏差'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 2.岗位权重，就是这个行业技术壁垒在哪里，那个岗位是最重要的。……这个分歧在我们前期做股权设计的时候，大家可能不容易发现，但是在公司发展壮大的过程中，越到后面越会产生一些隐患。
  - 岗位权重通常在30%-40%。
  - 大家通过自评和互评，最终得出来岗位权重是 7 ：2 ：1。
- 'no': 4
  name: 时间投入 —— 别被"全职"欺骗，看产出才算数
  points:
  - '**为什么需要这个概念？**'
  - '- 创业团队中，有的合伙人全职投入但产出有限，有的兼职却带来关键资源，仅以"全职/兼职"衡量时间投入会严重低估后者贡献'
  - '- 数据显示约60%的项目除纯财务投资人外所有合伙人其实都全职参与，时间投入因素逐渐失去区分度'
  - '- 需要更精细地衡量"时间投入"：不仅要看投入了多少时间，更要看产出是否匹配项目里程碑、是否愿意引进资源'
  - '**核心定义**'
  - '- 时间投入：4C模型中的维度指标，最简单的划分是全职还是兼职、投入精力的大小，但更本质的是产出是否匹配项目里程碑进展，以及愿意为项目引进多少资源'
  - '- 参考权重范围：10%-25%'
  - '**关键性质**'
  - '- 产出导向：时间投入的价值不在"人在工位"而在"事有推进"，全职参与但产出跟不上里程碑的合伙人其权重应降低'
  - '- 资源绑定：时间投入应同时包含投入的时间精力和愿意引进的资源，不只是一句"我是全职"'
  - '- 前期约定：必须在前期股权设计时就讲清楚时间投入的衡量标准，避免后期因投入-产出不匹配产生纠纷'
  - '**典型例子**'
  - '- 儿童体能项目案例中，小明、小磊、小胡的时间投入权重通过自评互评为6:3:1，体现全职投入与兼职参与的不同贡献程度'
  - '**边界条件**'
  - '- 60%左右的项目合伙人全职参与的数据是经验判断而非严格统计结论，不同项目差异较大'
  - '- 若全职合伙人产出长期不匹配里程碑，应及时通过动态调整机制（如期权池）校正股权，而非等到矛盾爆发'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 3.时间的投入，最简单的划分就是全职还是兼职，投入精力的大小等。时间投入的权重通常在10%-25%。
  - 但是大家有没有想过，就是其实有 60% 左右的项目，所有的合伙人除了纯财务投资人之外，其实都是全职参与的。只是说你全职参与的这个产出它是不是就能匹配的到这个项目的所有的进展，项目到达的里程碑是不是跟你全职参与有必然关系。
  - 所以我们前期在做股权设计的时候，就一定要讲清楚，这个时间投入，它对应的除了是我们投入的时间精力，还有我们愿意引进的资源，愿意为了这个项目付出多少，不单单只是一个全职兼职。
- 'no': 5
  name: 资金投入 —— 真金白银背后的"信心信号"
  points:
  - '**为什么需要这个概念？**'
  - '- 项目的启动必须有人出钱，但谁出多少、出钱的人该占多少股，是初创团队最常见的争议点'
  - '- 资金投入不仅是项目运转的"燃料"，更是判断合伙人信心的信号——愿下多少注，代表对项目有多看好'
  - '- 需要把资金投入纳入量化模型，既要承认其输血价值，也要防止纯资金型股东靠钱占据过多话语权'
  - '**核心定义**'
  - '- 资金投入：指项目前期资金的投入额度，是4C模型中的量化维度之一，权重通常在20%-50%'
  - '- 本质作用有二：为项目提供运转资本；通过出资额判断合伙人对项目的信心和承担风险意愿'
  - '**关键性质**'
  - '- 信心信号价值：愿意真金白银投入的人，往往比只出人力的人更看好项目、更愿意在困难时坚持'
  - '- 行业差异性：资金驱动型行业（如制造业、房地产）中资金权重更高，技术驱动型行业中资金权重相对降低'
  - '- 补充性：出钱多的合伙人不一定是创始人——小胡出资150万但非创始人，说明资金投入不等于决策权'
  - '**典型例子**'
  - '- 儿童体能项目案例：小胡出资150万（总投资200万中的75%），因资金投入高获得较大股权权重，但创始人身份仍归发起人小明'
  - '**边界条件**'
  - '- 纯财务投资人通常不参与经营，其资金投入权重需通过优先清算权、领售权等合同条款单独约定，防止与经营股东冲突'
  - '- 需警惕资金投入与风险意愿的匹配：若某合伙人出资额与其实际承担风险能力不匹配，项目遇困时可能引发撤资风险'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 4.资金的投入。这个比较好理解，所有的项目都会有一个前期资金的投入。……我们可以通过时间投入和资金投入去判断这个合伙人他对项目的信心和他愿意承担多大的风险。资金投入的权重通常在20%-50%。
  - 合伙人三：小胡，现在在国企上班，家里拆迁户特别有经济实力，他愿意投资 150 万。
- 'no': 6
  name: 股权分配五步法 —— 从"一团乱麻"到"清清楚楚"
  points:
  - '**为什么需要这个概念？**'
  - '- 有了4C模型的理论框架还不够，需要一套标准化的操作流程把框架落到具体数字上'
  - '- 创始团队面对股权分配时往往不知从何聊起，容易要么回避不谈、要么谈崩'
  - '- 需要一套"傻瓜式"的五步操作指南，让创始团队按部就班就能算出各方都能接受的股权比例'
  - '**核心定义**'
  - '- 股权分配五步法：运用4C模型计算各股东股权比例的标准流程，依次为：确定行业和赛道→收集创始团队信息→确定每个维度的权重比例→确定股东四个维度的权重系数→计算出各个股东的股权比例'
  - '**关键性质**'
  - '- 流程化：五步环环相扣，从宏观赛道判断到微观个人打分，逻辑严密'
  - '- 共识导向：第三步和第四步依赖创始团队自评互评达成共识，而非某个人说了算'
  - '- 计算透明：各维度权重×各股东系数后加权求和，数字一目了然，避免"我感觉我贡献大"的模糊争论'
  - '**典型例子**'
  - '- 儿童体能项目五步实操：第一步确定为自主创业型/资金驱动型的赛道，第二步收集小明（发起人出资50万）、小磊（市场）、小胡（出资150万）的信息，第三步通过自评互评确定岗位权重和时间投入权重，第四步确定各股东系数，第五步计算最终比例'
  - '**边界条件**'
  - '- 五步法算出的比例只是"起点"而非"终点"，仍需配合一致行动权、期权池等合同工具才能落地'
  - '- 若团队人数较多（4人以上）或存在多个纯财务投资人，五步法的自评互评环节会变得更复杂，需分阶段进行'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 在确认四个维度的权重比例后，我们会按照五步法来计算出各个股东的最终股权比例……
  - 第一个步骤：确定行业和赛道……第二个步骤：收集创始团队信息……第三个步骤：确定每个维度的权重比例……第四个步骤：确定股东四个维度的权重系数……第五个步骤：计算出各个股东的股权比例。
  - 有三个朋友合伙，他们准备一起做一个儿童体能训练的项目，这个项目的预期启动资金是 200 万。
- 'no': 7
  name: 前期共识机制 —— 越早摊牌，越少拆伙
  points:
  - '**为什么需要这个概念？**'
  - '- 大多数合作伙伴拆伙，是因为觉得自己最重要、出力最多，但分到的钱不是最多——根本原因是前期没聊清楚'
  - '- 公司没有赚钱时是最好聊的时候，一旦赚钱了大家都会计较，"谈钱伤感情"的时机反而更差'
  - '- 需要建立一个前置沟通机制，让创始团队在项目初期就对各自的贡献判断达成一致'
  - '**核心定义**'
  - '- 前期共识机制：指在项目尚未盈利、大家尚未开始计较的阶段，通过创始团队自评和互评，对4C模型中各维度的权重以及各股东的系数达成一致共识的过程'
  - '- 核心原则："越早越好"——公司刚起步是摊牌的最佳时机，类似于婚前协议在热恋期签订才不伤感情'
  - '**关键性质**'
  - '- 防拆伙作用：通过在前期明确重要程度判断，避免后期因"你觉得自己重要、我觉得我重要"的分歧走向拆伙'
  - '- 双向评估：自评（我对自己贡献的判断）与互评（我对他人贡献的判断）结合，比单方面主张更客观'
  - '- 前置性：必须在公司尚未盈利时完成，否则等到有利益可分时，理性谈判就会被情绪取代'
  - '**典型例子**'
  - '- 儿童体能项目中，三个合伙人通过自评互评达成岗位权重7:2:1和时间投入6:3:1，避免了各自坚持"我更重要"的僵局'
  - '**边界条件**'
  - '- 自评互评需要合伙人之间具备基本的信任与坦诚对话能力，若关系已经紧张则该机制效果受限'
  - '- 共识达成的权重比例并非法律效力，仍需通过工商登记和合同固化'
  sources:
  - paper: docs/202301-02/C0dydiFPCoBI3LxemwWcXpdxn2e.md
    role: origin
  excerpts:
  - 这个分歧在我们前期做股权设计的时候，大家可能不容易发现，但是在公司发展壮大的过程中，越到后面越会产生一些隐患。因为大家从一开始对自己的重要程度的判断就是不一致的，大多数合作伙伴拆伙，就是觉得自己最重要，出力最多，但是分到的钱又不是最多。
  - 所以在前期就要聊清楚，公司还没有开始发展的时候，也是最为好聊的时候，因为还没有赚钱，就不会那么计较。
  - 这涉及到刚刚说的另一个工具，创始团队之间的自评和互评，从而达成一个共识，股东们要先认可这个赛道的这4个维度就是在这样的一个区间波动微调。
'no': 26
