  name: 六维评估模型 —— 给项目算一笔“复制账”
  points:
  - '**为什么需要这个概念？**'
  - '- 面对五花八门的副业机会，凭直觉和感觉做判断，极易被表面的“赚钱故事”迷惑'
  - '- 需要一把统一的“量尺”，把笼统的“这项目行不行”拆解为可量化、可比较的具体指标'
  - '- “复制放大”是副业升级的核心路径，但并非所有项目都具备可复制性——需要通过效率维度来判断'
  - '- 收入天花板高低，受客单价、毛利率、复购率等财务维度约束——需要通过财务维度来判断'
  - '**核心定义**'
  - '- 六维评估模型：将任何商业/副业项目拆解为六个可量化指标——流量效率、销转效率、交付效率、客单价、毛利率、复购率，并据此评估项目的可复制性和收入天花板'
  - '- 流量效率：以时间、素材、流量为指标，“花的时间少，素材难度低，获得流量大，即为流量效率高”'
  - '- 销转效率：以专业度为指标，“专业度要求低（能SOP），能一对多，即为销转效率高，本质也是时间，销售的时间利用率”'
  - '- 交付效率：以时间为指标，“花的时间少（人力少），即为交付效率高”'
  - '- 可复制化底层逻辑：若流量/销转/交付三效率均高，则赚多赚少取决于流量多少；若任一效率偏低，则需靠客单价、毛利率、复购率来弥补'
  - '**关键性质**'
  - '- 量化性：六个维度均有明确的评估指标，可逐项打分定位'
  - '- 分级判定：六个点满足越多越好，满足四个点为及格线'
  - '- 可复制性判断：三效率（流量/销转/交付）共同决定项目能否被复制放大'
  - '- 收入补偿机制：当效率维度偏低时，可通过提高客单价、毛利率、复购率来维持收入'
  - '**典型例子**'
  - '- 小说推文项目：流量效率高（素材获取简单、框架固定自带流量）、销转效率高（搜索暗号充值有佣金）、交付效率高（无需交付）、客单价低（十几二十块）、毛利率高（50%以上）、复购率低，月收益1000~2W'
  - '- 教育资料1.0（卖考研资料）：客单价低（十几到几十块）、毛利率高（50~100%）、复购率低，月收益1000~2W；2.0版本增加高客单价合作转化（数千至数十万），月收益提升至2W~100W——客单价提升显著放大收入天花板'
  - '- 减肥食谱项目：流量效率高（小红书/抖音发食谱）、销转效率高（网销按SOP）、交付效率低~高（产品无需交付、训练营需专人陪跑）、复购率高（减肥是重复过程），月收益10W~200W，收入高度依赖流量规模'
  - '- 项目拆解商业IP（小徐）：流量效率低（难批量产出）、销转效率高、交付效率低、客单价高（几千到六位数）、毛利率高（70%以上），月收益10W~200W，以高客单价补偿低效率'
  - '- 知识付费（李一舟）：流量效率高（口播即可）、销转效率高（直播间挂小黄车）、交付效率高（课卖掉即交付完）、客单价高（小几千）、毛利率高（100%）、复购率低，月收益10W~500W'
  - '**边界条件**'
  - '- 六维模型是评估框架而非绝对真理，项目不同阶段的指标可能动态变化（如教育资料从1.0到2.0客单价跃升）'
  - '- “满足四个点及格”是经验性判断标准，并非严格公式；仍应结合项目方向、个人资源等综合判断'
  - '- 效率维度的指标（时间、素材、专业度等）存在主观性，不同人对同一项目的评估可能存在差异'
  - '- 财务维度的补偿机制有上限：当三个效率维度都极低时，仅靠提高客单价难以维系长期收入'
  sources:
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: origin
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: apply
  excerpts:
  - 任何项目都可以拆解成：「流量效率，销转效率，交付效率，客单价，毛利率，复购率」，这六个点
  - 「六个点，满足的越多越好，满足四个点，及格」
  - 「六维模型：流量效率、销转效率、交付效率、客单价、毛利率、复购率，任何项目你都可以按照这六块去拆」
  - 我们以「时间，素材，流量」为指标。
  - 「花的时间少，素材难度低，获得流量大，即为流量效率高」
  - 「专业度要求低（能SOP），能一对多，即为销转效率高，本质也是时间，销售的时间利用率」
  - 「基本上网销不需要啥专业度，按SOP做就好，线下才需要极高的专业度」
  - 「花的时间少（人力少），即为交付效率高」
  - 流量效率高，意味着内容极其好复制，可以通过矩阵，培训等方式，把这一块单独拎出去，进行放大。
  - 如果流量效率，销转效率，交付效率，这三块有一块低的话，就很难复制放大，那就得在客单价，毛利率，复购率这三块下功夫，比如通过提高客单价来增加收入。
