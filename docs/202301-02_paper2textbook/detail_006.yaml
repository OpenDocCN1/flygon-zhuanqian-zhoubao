    role: origin
  excerpts:
  - 止损点什么意思呢？就是你做这个事情不用继续了，你做这个事情的最大限度，你能够承担多大的损失。这个止损点包括你的时间成本、还有你的金钱投入、资源投入。
  - 我从这个事情上我得出一个结论，我这辈子不会再碰电商。
- 'no': 4
  name: 客单价与毛利率的补偿策略 —— 一条效率短板，两块财务长板来凑
  points:
  - '**为什么需要这个概念？**'
  - '- 不是所有项目都能做到流量、销转、交付三个效率维度都优秀'
  - '- 当某个效率维度偏低导致项目难以复制放大时，收入就会受限'
  - '- 需要通过调整财务维度的参数来“找补”收入，让项目依然有利可图'
  - '**核心定义**'
  - '- 补偿策略：当一个项目的流量效率、销转效率、交付效率中有任一项偏低时，通过提高客单价、毛利率或复购率来维持整体收入的策略'
  - '- 用财务维度（客单价、毛利率、复购率）的强势来对冲效率维度（流量、销转、交付）的短板'
  - '**关键性质**'
  - '- 效率维度决定项目能否复制放大，财务维度决定单位产出的利润厚度'
  - '- 客单价越高，对流量规模的依赖越低，适合流量效率低、但能精准触达少数客户的场景'
  - '- 毛利率越高，每一单能留下的利润越多，可以弥补成交量不足的缺口'
  - '- 复购率越高，单个客户的长期价值越大，可缓解新客获取成本高的问题'
  - '- 三个效率全高时，赚多赚少取决于流量；效率有短板时，必须靠财务维度补足'
  - '**典型例子**'
  - '- 项目拆解商业IP：流量效率低（拆解内容难以批量产出）、交付效率低（需要专业知识持续交付），但客单价高达数千至六位数、毛利率70%以上，弥补了效率短板，月收益可达10W~200W'
  - '- 教育资料2.0项目：在1.0的客单价十几块基础上，增加高客单价训练营合作转化，客单价提升至数千至数十万，月收益从1000~2W跃升至2W~100W'
  - '**边界条件**'
  - '- 补偿策略有上限：客单价不可能无限提高，毛利率受行业竞争约束'
  - '- 高客单价通常意味着销售周期更长、信任门槛更高，需要更强的销售能力支撑'
  - '- 效率维度过低的项目即使靠财务补偿维持盈利，也难以通过矩阵化大幅放大，天花板依然有限'
  sources:
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: origin
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: apply
  excerpts:
  - 如果流量效率，销转效率，交付效率，这三块有一块低的话，就很难复制放大，那就得在客单价，毛利率，复购率这三块下功夫，比如通过提高客单价来增加收入。
  - 流量效率低：项目拆解需要时间，以及好的信息源，所以很难批量产出。
  - 销转效率高：网销不需要什么专业度，按照SOP发就完事。
  - 交付效率低：无论是社群还是陪跑，合作，都需要时间以及专业知识进行交付。
  - 客单价高：从几千到六位数。毛利率高：70%以上
  - 教育资料1.0项目：月收益1000-~2W。（卖各种教育资料，比如考研，高考生物，化学）
  - 教育资料2.0项目：月收益2W~100W。（对比1.0，多了一步，高客单价转化合作）
  - 客单价低：几千到十几二十万不等，毛利率高：10%，复购率低：基本没有复购
- 'no': 5
  name: 软件的本质就是软文 —— 用“软文先行”反推产品开发
  points:
  - '**为什么需要这个概念？**'
  - '- 个人开发者常陷入“先开发再推广”的思维定势，耗费大量时间做出无人问津的产品'
  - '- 软件的最终展现和推广方式终究是软文（介绍文章、广告），因此可以从最终形式反推开发流程'
  - '- 与其闭门造车，不如先想清楚如何“吆喝”，再决定是否真开发'
  - '**核心定义**'
  - '- 核心观点：软件的本质就是软文。软件的推广依赖写文章、发广告，所以可以拿软文作为起点，反推开发流程'
  - '- 甚至可以不开发软件，而是寻找类似的软件给客户使用，完成交付'
  - '**关键性质**'
  - '- 反推逻辑：先写软文（或找到软文形式），再判断是否需要开发'
  - '- 成本极低：省去前期大量开发试错成本，先验证需求'
  - '- 以用户视角出发：从“用户为什么需要这个软件”而非“我能做什么软件”出发思考'
  - '**典型例子**'
  - '- 想一个“多数人觉得应该有、但现实中不存在”的软件，先写一篇介绍它的软文，看用户反应'
  - '- 用户咨询增多、有付费意愿时，再去找现成的软件或开发最小模型'
  - '**边界条件**'
  - '- 软文先行只适用于解决明确“痛点”的工具型产品，对需要复杂交互逻辑的To B产品需谨慎'
  - '- 如果软文过于夸大而产品长期无法兑现，会透支用户信任，需要平衡'
  - '- 该方法与“卖空气”预售结合使用效果更佳'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 多年经验总结一个观点：软件的本质就是软文。
  - 软件开发出来，怎么推广？还是通过写文章，发广告，介绍你这个软件，软件的最终的展现方式还是软文
  - 所以直接拿软文，最终形式。反推开发流程，甚至不开发软件，而是寻找类似的软件给客户使用。
  - 程序的思维总是先有东西再推广，不要等什么东西已经有了再去卖！假装已经有了足够！卖空气！
- 'no': 6
  name: “卖空气”预售 —— 用“空头支票”验证真实需求
  points:
  - '**为什么需要这个概念？**'
  - '- 传统产品开发是先做产品再找用户，若需求判断失误则血本无归'
  - '- 个人开发者资源有限，经不起长时间的开发投入'
  - '- 需要一种低成本、快速验证市场需求的方法，“卖空气”应运而生'
  - '**核心定义**'
  - '- 卖空气：在产品尚未开发或无法真正兑现功能时，先制造“具备该功能”的假象（预售、截图、演示），先收钱、测试需求'
  - '- 核心原则：卖得出去就继续做，卖不出去就没必要继续做'
  - '**关键性质**'
  - '- 先收钱、后交付，用真实订单验证需求真伪'
  - '- 制造“已有”的假象：预售页、效果图、模型、演示视频都是工具'
  - '- 强调速度：快速推出、快速验证、快速迭代或放弃'
  - '**典型例子**'
  - '- 直接做个模型，上架开卖，卖预售；卖不出去就没必要继续做了'
  - '- 羊了个羊刚火时，有人P一张999999分数截图，以“已开挂”口吻发文吸粉，5天后游戏大火，套话找真正能刷分软件直接变现'
  - '**边界条件**'
  - '- 卖空气不等于诈骗：最终需要有最小可行产品（MVP）承接，否则会涉及法律与道德风险'
  - '- 对预售用户需提供明确的“交付时间表”，或设置退款机制，避免信任崩塌'
  - '- 卖空气适合验证“确定性需求”，对需要用户教育的新品类效果有限'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 或者直接做个模型，上架开卖，卖空气，卖预售。卖不出去就没必要继续做了！
  - 假装已经有了足够！卖空气！
  - 把需求完整的讲出来，又让他理解，本身就是一件不容易的事。沟通成本有时候比开发成本都高，还赶不上有一个趁手的工具，自己先捏一个模型给他看！
  - 羊了个羊刚有点火，立刻就有人P一张分数999999截图去社交软件用已经开挂的口吻发文，开始吸粉，差不多5天后《羊了个羊》大火🔥这时他就可以，套话找真正能刷分软件了，直接把粉丝变现！
- 'no': 7
  name: 复述问题建立信任 —— 用“问诊式开场”让客户觉得“你懂我”
  points:
  - '**为什么需要这个概念？**'
  - '- 用户面对陌生产品/服务，天然有戒备心，怀疑你能否解决他的问题'
  - '- 与其自卖自夸“我能解决”，不如先精准复述用户的“症状”，让用户觉得“这次找对了人”'
  - '- 信任是成交的前提，复述问题是快速建立信任的内容策略'
  - '**核心定义**'
  - '- 复述问题建立信任：通过罗列、复述用户遇到的症状或问题，让用户认为“这次找对了”，从而建立信任基础，哪怕只是知道问题而无法解决'
  - '- 核心机制：用户在你罗列的问题中看到了自己的影子，潜意识里认定你专业、懂行'
  - '**关键性质**'
  - '- 手段：医生式提问（你有没有这个症状？有没有那个症状？）'
  - '- 目标：让用户说出“都是我现在的症状”，从而认定“你懂我的病”'
  - '- 价值：即使你尚未给出解决方案，信任已经建立'
  - '**典型例子**'
  - '- 看病问诊：医生问你“有没有这个症状？有没有那个症状？”你发现“都是我现在的症状”，所以你认为医生懂你的病，这次找对了'
  - '- 软文中先罗列用户常见的痛点（如做副业没流量、有流量没转化、有转化没交付），再引出你的产品'
  - '**边界条件**'
  - '- 复述问题必须真实、精准，否则用户会觉被套路，适得其反'
  - '- 复述问题后需快速给出解决方案的“钩子”，否则会让用户焦虑而流失'
  - '- 该技巧对“解决痛点型”产品效果好，对“创造愉悦型”产品效果有限'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 举例：就拿看病举例子，医生会问你：'有没有这个症状？有没有那个症状？'结果你发现：'都是我现在的症状'，所以你认为这个医生懂你的病，这次找对了！
  - 所以，这就是一种内容策略，用复述问题建立信任基础！
  - 写软文的核心是用户看到你这篇文章，内心在想'这次找对了！'，就行了，不管他真找对了还是假找对了。
  - 超长文、字超多，审核员懒得看，就行了！可使用：合集、大全、汇总，之类模板，增加文章字数！
- 'no': 8
  name: 有效噱头与App门槛 —— 精准过滤用户与“安慰剂效应”
  points:
  - '**为什么需要这个概念？**'
  - '- 产品开发与营销中，常面临“产品不完美”的现实，但用户感知与真实功能存在偏差'
  - '- 流量精准度比流量规模更重要，需要机制过滤掉“看客”留下“精准用户”'
  - '**核心定义**'
  - '- 有效噱头，无效产品：只要噱头有效、名字起得好，即使产品不真正解决需求也不影响赚钱速度，借助安慰剂效应和好名字改变固有事实'
  - '- App的门槛：App需要下载安装、门槛较高，反而能精准过滤出有强烈需求的用户，并让用户相信“该App真的具有该功能”'
  - '**关键性质**'
  - '- 安慰剂效应：一个糖豆卖得贵、说是救命药，吃了真管用，患者康复率30%以上——心理暗示影响生理感受'
  - '- 好名字的力量：连花清瘟大卖是因为名字起得好，好名字可以改变固有事实'
  - '- App门槛的双刃剑：门槛高挡住看客，也留下精准用户'
  - '**典型例子**'
  - '- 早些年做礼包软件，根本领不到礼包，但评论区出现大量“我领到了”“是真的我也领到了”的虚假好评'
  - '- 用App界面（软件营销派）展示功能，让用户觉得“软件问题就要用软件解决”，比纯文本攻略更专业、转化率更高'
  - '**边界条件**'
  - '- “有效噱头”不等于虚假宣传，若产品完全无实际功能且涉及人身财产安全，有法律风险'
  - '- App门槛策略依赖用户的好奇心与需求强度，对需求不明确的用户群效果差'
  - '- 长期靠噱头无实质兑现，会被平台与用户抛弃，需守住底线'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 但还有一个观点没说，那就是：'不解决需求'，'也不是好的产品'，并不会影响赚钱的速度！
  - 医学上有一种安慰剂效应，说白了就是诈骗效应。一个糖豆卖的特别贵，就说这是救命药，你吃了也真管用，患者的康复率30%以上！
  - 连花之所以大卖，就是名字取得好，事实证明起个好名字，真的可以改变固有事实！
  - 但是正因为App使用不方便，却可以当成优势利用一下，如果没有强烈的需求，用户根本不可能去下载安装App，App大多数展示只是看客，下载率极低！
  - 但这时用户看到了App截图和使用方法，用户就会知道，有这么一个App，没有需求的用户不可能去下载。所以用户觉得：该App'真的具有该功能！'
  - 软件营销派：核心是，看起来更逼真、更专业。广告隐藏的更深，更容易用户裂变
