learning_targets:
- 理解交付效率的定义及'支付即交付'的最高形态
- 掌握用策划案+执行案管理副业项目的双轮驱动框架
- 学会在项目启动前设定涵盖时间、金钱、资源三维度的止损点
- 掌握用客单价、毛利率等财务维度的强势来对冲效率维度短板的方法
- 理解'卖空气'式产品验证法与软文先行的反直觉开发思维
- 掌握用App门槛过滤精准用户、软件营销派碾压软营销派的流量转化技巧
- 学会通过复述问题、超长文等软文技巧建立信任并过审
- 理解'有效噱头、无效产品'的安慰剂效应及其商业边界
- 掌握将软件视为软文、反推开发流程的轻资产产品化思路
concept_map:
- 交付与项目管理的效率与杠杆
- ├── 交付效率（以时间为指标）
- │   ├── 支付即交付 —— 资料/低价课 —— P001
- │   ├── 重服务交付 —— 训练营/陪跑 —— P001
- │   └── 补偿策略 —— 财务维度对冲效率短板 —— P001
- ├── 项目管理双案法
- │   ├── 策划案（定方向）—— 产品货盘/目标/止损点 —— P003
- │   └── 执行案（保落地）—— 表格化/标绿标红/责任人 —— P003
- └── 止损点（最大投入界限）
- '    ├── 时间止损：最多做几个月 —— P003'
- '    ├── 金钱止损：最多投多少钱 —— P003'
- '    └── 资源止损：最多消耗多少人脉精力 —— P003'
- 反直觉产品孵化：卖空气与软文先行
- ├── 软件的本质就是软文
- │   ├── 反推开发流程：先写软文、后做产品 —— P004
- │   └── 寻找现成软件交付 —— P004
- ├── 卖空气（预售验证）
- │   ├── 制造'已有'假象 —— 模型/截图/预售页 —— P004
- │   └── 先收钱、测试需求 —— 卖不出去就不做 —— P004
- ├── 复述问题建立信任
- │   ├── 罗列症状让用户认为'找对了' —— 看病问诊类比 —— P004
- │   ├── 超长文制造专业感并提升SEO —— P004
- │   └── 干净截图+合集模板过审 —— P004
- └── 有效噱头、无效产品
- '    ├── 安慰剂效应 —— 名字决定认知/糖豆救命 —— P004'
- '    └── 连花清瘟案例 —— 好名字改变固有事实 —— P004'
- 流量收割：精准过滤与软件营销派
- ├── App是不便的筛子
- │   ├── 下载门槛过滤'看客' —— P004
- │   └── 用户相信App'真的具有该功能' —— P004
- ├── 软件营销派 vs 软营销派
- │   ├── 逼真App界面碾压纯文本攻略 —— P004
- │   ├── 广告隐藏更深 —— P004
- │   └── 强制分享裂变机制 —— P004
- └── 非规范化生产（野路子）
- '    ├── 中文编程工具降低门槛 —— P004'
- '    ├── 1周内捏出可演示模型 —— P004'
- '    └── 个人开发者研发不超1周 —— P004'
life_analogy:
- 想象项目管理是**装修一套房子**：
- '- **策划案** = 设计图纸：定好有几个房间（产品货盘）、整体风格（运营策略）、预算上限（止损点）、完工节点（里程碑）'
- '- **执行案** = 施工排期表：哪一天哪个工人（责任人）在哪面墙（事项）上做什么，做完一项打一个勾（标绿），延期就标红'
- '- **止损点** = 装修合同里的停工条款：一旦超出预算或发现结构问题（项目不成立），立即叫停，避免越陷越深'
- '- **交付效率** = 不同装修方式的耗时：买成品家具（资料）当天进场即完成，而全屋定制（训练营）需要数月反复沟通打磨'
- 想象产品开发是**开一家'卖空气'的网红店**：
- '- **卖空气** = 在店铺还没装修好之前，先挂出效果图（模型/截图）并开启预售，用订单验证需求，卖不出去就不继续装修'
- '- **软件的本质就是软文** = 店铺的招牌和菜单就是你的推广软文，先想好怎么吆喝（软文），再决定做什么菜（开发），甚至直接找现成的半成品（类似软件）'
- '- **复述问题建立信任** = 店员先把你身体的不舒服全说出来，让你觉得''这次找对人了''，哪怕他还没给你开药'
- '- **App的门槛** = 网红店开在写字楼高层（需要预约、上楼），拦住只看不买的游客，上来的都是有强烈购买意愿的顾客'
- 就像装修不能光有图纸不施工，也不能埋头干不看图纸，副业项目需要策划案定方向、执行案保落地，并靠止损点防止烂尾；而产品开发则像开网红店，用好'卖空气'的预售、'软文'的吆喝和'App门槛'的筛选，才能低成本验证、精准触达并高效转化。
summary:
- concept: 交付效率
  desc: 以时间为指标衡量交付环节的消耗，'支付即交付'是最高效形态
- concept: 三效率
  desc: 流量效率、销转效率、交付效率共同决定项目能否被复制放大
- concept: 策划案
  desc: 解决'做什么、为什么做'的方向问题，涵盖产品货盘、目标、里程碑与止损点
- concept: 执行案
  desc: 解决'谁来做、怎么做'的落地问题，用表格化、标绿标红管控进度
- concept: 止损点
  desc: 项目启动前预设的时间、金钱、资源三维投入上限，避免沉没成本绑架
- concept: 补偿策略
  desc: 当效率维度偏低时，通过提高客单价、毛利率、复购率来维持整体收入
- concept: 软件的本质就是软文
  desc: 软件的最终展现形式是软文，因此可以反推流程：先写软文、后做产品，甚至不开发而寻找现成软件
- concept: 卖空气（预售验证）
  desc: 在产品不存在时用模型、截图、预售页制造'已有'的假象，先收钱测试需求，卖不出去就不做
- concept: 复述问题建立信任
  desc: 通过罗列用户遇到的症状或问题，让用户认为'这次找对了'，从而建立信任基础
- concept: 非规范化生产（野路子）
  desc: 放弃正规流程，用中文编程等低门槛工具在最短时间内捏出可演示的模型，核心是降低成本、提升效率
- concept: 有效噱头、无效产品
  desc: 只要噱头有效、名字起得好，即使产品不真正解决需求也不影响赚钱速度，借助安慰剂效应改变认知
- concept: App门槛作为精准过滤器
  desc: App的下载门槛虽高，却过滤掉'看客'，留下有强烈需求的精准用户，并让用户相信App'真的具有该功能'
- concept: 软件营销派 vs 软营销派
  desc: 用逼真的App界面营销（软件营销派）碾压纯文本攻略（软营销派），因为看起来更专业、广告埋得更深
exercises:
- 'no': 1
  title: 评估你正在做的副业项目的交付效率
  contents:
  - 选取你正在做或计划做的一个副业项目，回答以下问题：
  - 1. 描述该项目的完整交付流程（从客户付款到客户拿到成果）
  - 2. 估算每一次交付需要投入的时间与人力成本
  - 3. 判断该项目属于'支付即交付'型还是'重服务'型
  - 4. 如果交付效率偏低，你能设计出哪些手段将其向'支付即交付'方向优化？
  - 深入思考：
  - '- 能否将交付内容标准化为模板或自动化工具？'
  - '- 能否把交付环节外包给兼职或第三方？'
  - '- SOP化后，交付效率的提升是否会带来客户体验的下降？'
- 'no': 2
  title: 为大闸蟹电商案例补写策划案
  contents:
  - 参考素材中作者做阳澄湖大闸蟹电商的案例（4个月赚20万但身心俱疲选择退出）：
  - 1. 为该案例补写一份策划案，包含：产品货盘（引流品/盈利品/高利润套餐）、运营策略、目标、里程碑
  - 2. 为该案例设定合理的止损点（时间成本、金钱投入、资源投入三个维度）
  - 3. 请回答：作者最终的退出行为，是'止损'还是'错失良机'？判断依据是什么？
  - 4. 如果作者在项目启动前就写好了策划案与止损点，你认为他还会硬撑4个月吗？为什么？
- 'no': 3
  title: 用补偿策略改造一个'低交付效率'项目
  contents:
  - 假设你目前有一个'学习陪伴营'项目（交付效率低，需要每天监督学员打卡答疑）：
  - 1. 用六维框架（流量/销转/交付效率+客单价/毛利率/复购率）逐项评估该项目
  - 2. 分析：该项目在哪一个维度存在短板？哪一个维度最具优势？
  - 3. 设计三种通过调整财务维度来补偿效率短板的具体方案
  - 4. 对三种方案进行对比：你认为哪一种效果最好？为什么？
  - 延伸思考：
  - '- 补偿策略是否有天花板？什么时候该考虑放弃项目而非找补？'
  - '- 高客单价补偿低交付效率，对销售能力提出了什么新要求？'
- 'no': 4
  title: 设计你自己的止损点决策树
  contents:
  - 结合本章止损点的定义，为你未来的副业项目建立一套可执行的止损决策机制：
  - 1. 列出你会考虑止损的三种具体情境（例如：持续亏损、身心俱疲、方向被证伪）
  - 2. 为每种情境设定可量化的触发指标（例如：连续3个月净利润为负、每周投入超过10小时且零回报）
  - 3. 设计一套'止损后复盘清单'：止损后必须回答哪几个问题，才能让这次止损变得有价值？
  - 4. 反思：为什么很多人即使设定了止损点，真正要执行时依然做不到？心理障碍是什么？
- 'no': 5
  title: 为一个'Idea'设计'卖空气'验证方案
  contents:
  - 假设你有一个软件产品的创意（例如：帮助小红书博主一键生成爆款封面的工具）：
  - 1. 用'软件的本质就是软文'的思路，先为它写一篇推广软文（300-500字），文风请运用'复述问题建立信任'的技巧
  - 2. 设计一个'卖空气'的预售页：需要展示哪些'已有'的假象（模型/截图/演示）？
  - 3. 如何利用App的'门槛'特性来过滤非精准用户？
  - 4. 如果这个工具实际上并不存在，需要借助'套话做局'寻找现成解决方案卖给付费客户，你会如何设计流程？
  - 深入思考：
  - '- 这套''卖空气''玩法与传统的先开发后售卖相比，最大的优势与风险分别是什么？'
  - '- 在什么情况下，''有效噱头、无效产品''会从商业手段滑向法律与道德的红线？'
- 'no': 6
  title: 对比'软件营销派'与'软营销派'的转化效率
  contents:
  - 以'帮助淘宝卖家一键申诉违规'为同一个需求主题：
  - 1. 用纯文本攻略写一篇'软营销派'的引流内容（500字左右）
  - 2. 用'软件营销派'思路，设计一个App界面截图（可用文字描述），并说明它的营销话术
  - 3. 分析：为什么'软件看起来更专业'能产生碾压效应？其背后的用户心理是什么？
  - 4. 讨论：这套'软件营销派'打法在B2B（企业客户）场景下是否依然有效？为什么？
  - 延伸思考：
  - '- 随着用户对''假装有App''的警惕性提高，这种打法是否会失效？有什么升级替代方案？'
  - '- 如何平衡''卖空气''的预售策略与用户信任的长期维护？'
units:
- 'no': 1
  name: 交付效率 —— 让“成交”成为服务的终点
  points:
  - '**为什么需要这个概念？**'
  - '- 做副业不仅要把东西卖出去，还要把承诺的东西交到客户手上'
  - '- 交付环节消耗的时间与人力，直接决定你能否同时服务更多客户'
  - '- 如果交付太费时费力，项目就无法规模化复制，收入会被锁死在个人精力上'
  - '- 只有把交付成本降到最低，才能腾出精力去做流量和转化，形成正向循环'
  - '**核心定义**'
  - '- 交付效率衡量项目在交付环节对时间与人力的消耗程度，以「时间」为核心指标'
  - '- 花的时间少、人力投入少，即为交付效率高'
  - '- 效率最高的形态是“支付即完成交付”：客户付款那一刻，交付已经完成'
  - '**关键性质**'
  - '- 资料、低价课等虚拟产品交付效率最高，付款即交付'
  - '- 训练营、陪跑咨询等重服务项目需要持续投入时间设计流程、回答问题，交付效率较低'
  - '- 交付效率是“三效率”（流量效率、销转效率、交付效率）之一，三个效率共同决定项目能否被复制放大'
  - '**典型例子**'
  - '- 卖教育资料：客户付款后直接发送网盘链接，交付瞬间完成，效率极高'
  - '- 减肥训练营：需要专人监督陪跑、答疑，交付周期数周甚至数月，效率偏低'
  - '**边界条件**'
  - '- 交付效率低并不等于项目不能做，可以通过提高客单价来补偿'
  - '- 如果交付效率与流量、销转效率都高，则赚多赚少只取决于流量规模'
  - '- 交付效率衡量的是“常规交付”的耗时，不包含售前咨询和售后维护的额外时间'
  sources:
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: origin
  excerpts:
  - 我们以「时间」为指标。
  - 「花的时间少（人力少），即为交付效率高」
  - 比如说，资料，低价课，付款那一刻，交付已经做完。比如说，训练营，陪跑咨询，需要花时间精力，去设计方案，流程，回答问题。
  - 交付效率高，意味着销售可以SOP化，不需要极强的专业性，也意味着交付也不需要啥时间，精力，同时也意味着流量来了，能接得住。
- 'no': 2
  name: 项目管理双案法 —— 左手定方向，右手保落地
  points:
  - '**为什么需要这个概念？**'
  - '- 很多副业想法在脑子里很美好，一落地就乱成一团，执行过程中方向越做越偏'
  - '- 单靠热情和灵感做事，无法保证团队成员各司其职、按时交付'
  - '- 需要一个既能定方向（想清楚做什么、为什么做），又能控执行（谁在什么时间做什么事）的完整管理框架'
  - '**核心定义**'
  - '- 项目管理分为“策划案”与“执行案”两部分，形成双轮驱动'
  - '- 策划案：一个想法、规划、目标制定，涵盖产品货盘、运营策略、目标、里程碑、止损点等'
  - '- 执行案：人员分工、分解执行、过程监控、结果复盘，落地为时间、地点、事项、责任人、阶段目标的表格化管控'
  - '**关键性质**'
  - '- 策划案解决“做什么、为什么做”的方向问题，执行案解决“谁来做、怎么做”的落地问题'
  - '- 策划案中必须包含明确的止损点，避免陷入沉没成本陷阱'
  - '- 执行案通过标绿（完成）与标红（延期/未完成）的方式可视化进度，驱动团队自查'
  - '- 目标贯穿始终，没有目标则执行过程是懵的'
  - '**典型例子**'
  - '- 策划案：设计一款护肤品的副业项目，确定引流品（100ml小样）、盈利品（500ml正装）、目标（3个月积累1000个私域客户）、里程碑（首月200人）、止损点（投入不超过2万元）'
  - '- 执行案：某月第一周，由A负责小红书笔记发布（每天3篇），B负责微信朋友圈运营（每天5条），责任人、完成日期一栏一栏列清楚，完成标绿、延期标红'
  - '**边界条件**'
  - '- 双案法适用于有一定规模、需要多人协作的项目；个人单干小项目可简化执行案'
  - '- 策划案并非一成不变，需根据执行过程中的反馈动态调整'
  - '- 双案法提供的是管理框架，不替代具体的业务判断与战术选择'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 我在项目推进的整个过程里面，根据我的经验，把它分为两个部分，一个叫策划案，一个叫执行案。
  - 策划案就是一个想法、规划、目标制定；执行案就是人员分工、分解执行、过程监控、结果复盘。
  - 策划案，包括你产品货盘是什么。这个产品货盘包括定价、规格。比如说你是做化妆品的，有的是 100 毫升的，有的是 500 毫升的，有的是 1000 毫升的。那我
    100 毫升的是要作为引流产品对吧...
  - 执行案是什么呢？某一年某一月的核心工作事项。第一个模块是什么？这个模块里的二级事项有哪些？具体内容是什么？负责人是什么？协助人是谁？完成日期是什么？完成的时候要把它标绿，然后未完成或者延期的要把它标红。这个叫执行案。
  - 一定要有目标，没有目标的话你自己是懵的。
  - 里程碑是什么意思呢？就是你在做这个项目的过程中，有一些对你来说有关键性的目标叫里程碑。
  - 止损点什么意思呢？就是你做这个事情不用继续了，你做这个事情的最大限度，你能够承担多大的损失。这个止损点包括你的时间成本、还有你的金钱投入、资源投入。
- 'no': 3
  name: 止损点 —— 给项目装上一台“熔断器”
  points:
  - '**为什么需要这个概念？**'
  - '- 做副业很容易因为“已经投入了这么多”而继续硬撑，结果越陷越深'
  - '- 没有事先设定放弃条件，就容易在项目明显不赚钱时依然舍不得退出，被沉没成本绑架'
  - '- 需要一条清晰的红线，告诉自己“做到什么程度就该认输”'
  - '**核心定义**'
  - '- 止损点：做项目时设定的最大投入界限，包括时间成本、金钱投入、资源投入'
  - '- 当投入达到止损点仍未取得预期成果，就应停止该项目，避免更大损失'
  - '**关键性质**'
  - '- 止损点必须在项目启动之前就事先设定，而不是中途凭感觉决定'
  - '- 止损点覆盖三个维度：时间（最多做几个月）、金钱（最多投多少钱）、资源（最多消耗多少人脉与精力）'
  - '- 止损的决策逻辑是“控制损失”，与个人喜好、面子无关'
  - '- 止损点也是策划案的标准组成部分，确保每个项目都有退出机制'
  - '**典型例子**'
  - '- 作者做阳澄湖大闸蟹电商项目，发现自己完全不喜欢电商卖货，虽然4个月赚了20来万，但身心俱疲，于是立下“这辈子不会再碰电商”的止损标准'
  - '- 做小红书项目前设定：若3个月内粉丝未破1万且零变现，则停止投入'
  - '**边界条件**'
  - '- 止损点不意味着遇到短期困难就立刻放弃，应与项目的生命周期和自然波动相区分'
  - '- 设定止损点时需结合项目实际情况，标准过于宽松则失去保护意义，过于严格则可能错杀良机'
  - '- 止损之后的价值在于总结经验，而非纯粹的“认输”'
  sources:
