units:
- 'no': 1
  name: 卖空气 —— 产品不存在也能先收钱
  points:
  - '**为什么需要这个概念？**'
  - '- 传统开发流程是先做产品再卖，个人开发者时间、资金有限，赌错方向就血本无归'
  - '- 市场对需求是否真实存在缺乏低成本验证手段，凭感觉做产品失败率极高'
  - '- 需要一个在投入大量开发成本前，先测试用户付费意愿的方法'
  - '**核心定义**'
  - '- 在产品尚未开发或无法真正兑现功能时，用模型、截图、预售页等制造“已具备该功能”的假象，先收钱、先测试需求'
  - '- 核心逻辑：卖得出去就继续做，卖不出去就及时止损'
  - '**关键性质**'
  - '- 零成本验证：不需要完整产品即可获得付费数据'
  - '- 预售导向：用未来交付的承诺换取当下的资金与信号'
  - '- 快速迭代：根据预售反馈决定是否投入真实开发'
  - '**典型例子**'
  - '- 开发者做一张产品截图 + 一段功能介绍，挂到电商平台预售，有订单才开发'
  - '- 羊了个羊刚火时，有人P一张999999分数的截图，以“已开挂”口吻发帖吸粉，套话后变现'
  - '**边界条件**'
  - '- 预售 ≠ 诈骗：必须要有交付的意图或替代方案（如寻找现成软件给客户用）'
  - '- 不能对已收钱的用户无限延期，否则信任崩塌、口碑反噬'
  - '- 适用于低客单价的轻量产品，重资产项目不适用'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 或者直接做个模型，上架开卖，卖空气，卖预售。卖不出去就没必要继续做了！
  - 假装已经有了足够！卖空气！
  - 程序的思维总是先有东西再推广，不要等什么东西已经有了再去卖！假装已经有了足够！卖空气！
- 'no': 2
  name: 软件的本质就是软文 —— 先写文章，后做产品
  points:
  - '**为什么需要这个概念？**'
  - '- 传统开发思维是先写代码再做推广，但很多产品开发出来后根本没人知道、没人用'
  - '- 软件最终面向用户的形态是文字介绍、广告、软文，而非代码本身'
  - '- 如果推广文案写不好，产品做得再好也卖不出去'
  - '**核心定义**'
  - '- 软件被用户感知的最终形态是“软文”（介绍性文字），而非代码；因此可以从软文反推开发流程——先写推广文案验证用户兴趣，再决定是否开发'
  - '- 甚至可以不开发，寻找现成的类似软件交付给客户'
  - '**关键性质**'
  - '- 反推思维：从结果（软文）倒推过程（开发），而非正向推进'
  - '- 文案即产品：软文的说服力直接决定产品的销售转化'
  - '- 零代码交付：不一定需要自己写代码，可以用现成方案满足用户'
  - '**典型例子**'
  - '- 想做一个“一键解封”工具，先写一篇介绍该工具的软文，有人付费咨询后再找现成软件或开发'
  - '- 写软文介绍一个市场上已存在的软件功能，用功能介绍吸引客户，自己对接交付'
  - '**边界条件**'
  - '- 软文先行要建立在真实需求基础上，凭空捏造过度宣传会积累恶评'
  - '- 不开发就需要有可靠的现成替代软件，否则交付环节会崩盘'
  - '- 适用于工具类、功能明确的软件；品牌类、体验型产品仍需真实产品支撑'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 多年经验总结一个观点：软件的本质就是软文。
  - 软件开发出来，怎么推广？还是通过写文章，发广告，介绍你这个软件，软件的最终的展现方式还是软文
  - 所以直接拿软文，最终形式。反推开发流程，甚至不开发软件，而是寻找类似的软件给客户使用。
- 'no': 3
  name: 复述问题建立信任 —— 让用户觉得“这次找对了”
  points:
  - '**为什么需要这个概念？**'
  - '- 用户面对陌生卖家时天然有戒备心，很难在短时间内相信对方能解决问题'
  - '- 建立信任是转化的前提，但信任的建立通常需要很长时间'
  - '- 需要一个快速破冰、让用户产生“你懂我”感觉的速效方法'
  - '**核心定义**'
  - '- 一种内容策略：通过准确罗列、复述用户遇到的症状或问题，让用户产生“这次找对了”的心理，从而建立初步信任——即使你还没给出解决方案'
  - '- 借用了医生问诊的经典模式：医生问“有没有这个症状、有没有那个症状”，你发现全是你的症状，就认为医生懂你的病'
  - '**关键性质**'
  - '- 共鸣优先：先让用户感到被理解，而不是急着给方案'
  - '- 低成本高回报：只需精准描述问题，不需证明解决方案的有效性'
  - '- 普适性强：适用于软文、客服话术、售前咨询等一切触达场景'
  - '**典型例子**'
  - '- 卖护肤品的软文：先罗列“你是不是出油多、毛孔粗、爱长痘？”，用户全中，觉得这商家懂我，愿意继续读下去'
  - '- 卖课的朋友圈：先复述“想副业但不知道做什么、做了没流量、有流量不转化”三大困境，吸引目标用户咨询'
  - '**边界条件**'
  - '- 复述问题只是建立信任的第一步，后续必须跟上真实的价值交付，否则只是“知道问题”而非“解决问题”，信任会迅速崩塌'
  - '- 问题描述要足够精准、有细节，泛泛而谈让人无感'
  - '- 不能利用此方法过度渲染焦虑、制造虚假痛点'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 举例：就拿看病举例子，医生会问你：'有没有这个症状？有没有那个症状？'结果你发现：'都是我现在的症状'，所以你认为这个医生懂你的病，这次找对了！
  - 所以，这就是一种内容策略，用复述问题建立信任基础！
  - 写软文的核心是用户看到你这篇文章，内心在想'这次找对了！'，就行了，不管他真找对了还是假找对了。
- 'no': 4
  name: 非规范化生产（野路子） —— 用“野路子”快速捏出产品模型
  points:
  - '**为什么需要这个概念？**'
  - '- 个人开发者资金、时间、团队都有限，按正规化流程（需求分析→原型→UI→开发→测试→上线）走完，周期太长、成本太高'
  - '- 很多人“没有正统的命，得了正统的病”，盲目套用大厂流程导致项目胎死腹中'
  - '- 需要一套专为个人开发者设计的、极简高效的快速产出方法'
  - '**核心定义**'
  - '- 个人开发者应放弃正规的工程化流程，使用中文编程工具等低门槛工具，在最短时间内（如1周内）做出可演示的产品模型，核心是“降低成本、提升效率”'
  - '**关键性质**'
  - '- 成本优先：一切以省钱省时间为最高原则'
  - '- 模型即产品：做出来的东西只要能演示、能预售即可，不需要完整功能'
  - '- 工具平民化：用中文编程工具，零英语基础也能快速上手'
  - '**典型例子**'
  - '- 用中文编程工具（如易语言）一周内捏出一个软件的Demo，给客户演示看效果，对方认可后再完善'
  - '- 不追求完美的UI，用最简单的方式实现核心功能，先把产品挂出去卖，有人买再迭代'
  - '**边界条件**'
  - '- 野路子只适合做“小而简单的产品”，超过1周开发周期的重项目不适合个人开发者'
  - '- 模型可以粗糙，但要能稳定演示核心功能，不能频繁崩溃'
  - '- 后续仍需回归产品质量，否则口碑无法积累'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 个人开发者需要的是'非规范化生产'俗称野路子
  - 非规范化生产的核心是：'降低成本''提升效率'
  - 就怕个人开发者'没有正统的命，得了正统的病！'
  - 个人开发者研发一个软件的时间不应超过1周，超过1周的软件产品不适合个人开发者！
  - 使用《中文编程工具》，不会英语也能快速入门
- 'no': 5
  name: 商业项目拆解 —— 把“赚钱的别人”拆成“可复制的零件”
  points:
  - '**为什么需要这个概念？**'
  - '- 大多数普通人没有从零创造商业模式的能力，但复制已验证的商业模式是可行的'
  - '- 看到别人赚钱却看不懂他为什么赚，就无法复制；盲目模仿表面则容易翻车'
  - '- 需要一套系统化拆解方法，把“别人赚钱的完整系统”拆解成一个个可执行、可复制的零件'
  - '**核心定义**'
  - '- 一种从爆款内容中发现可复制的商业项目的方法：通过拆解其流量获取、转化链路和产品交付方式，提炼出底层的可复制逻辑，据此复制出类似的副业项目'
  - '- 核心公式：找到一个别人做过、持续稳定赚钱的项目 → 拆解 → 微调 → 复制'
  - '**关键性质**'
  - '- 后发制人：不追求原创，等别人验证可行后再进入'
  - '- 模块化思维：把项目拆成流量、转化、交付等独立模块分别分析'
  - '- 可复制性判断：爆得是否偶然、货源是否他人可寻、消费场景是否验证有需求'
  - '**典型例子**'
  - '- 看到“文川手写”账号帮人设计logo爆火，拆解出：流量端靠发视频、转化端靠评论区咨询、交付端外包给大学生，中间赚差价'
  - '- 看到儿童游乐项目视频有8.4w赞、3000条评论都在问加盟，拆解后复制模式，3个月招40多个加盟商赚40万'
  - '**边界条件**'
  - '- 拆解≠侵权：要复制的是商业模式（流量、转化、交付逻辑），而非直接抄袭别人的内容或产品'
  - '- 可复制性需要满足三个条件：爆得非偶然、货源非独家、需求已验证'
  - '- 拆解后仍需结合自身优势做微调，完全照搬可能水土不服'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 拆下来之后，我就发现很多时候有些项目是完全可以复制的，是不需要投入几十万也可以复制的。复制了之后，用跟他一样的内容生产方式、转化链路，你也能拿到一定的结果。
  - 通过刷抖音或者刷小红书的过程发现商业案例，再拆解复制这样的案例去形成一个商业模式，去发展自己的副业。
  - 首先，这个视频爆得偶然；其次，他货源不是他自己的，也就是说我可以通过别的方式找到他的货源；最后，这个消费场景经过验证是证明是有需求的，而且需求量还不小。
- 'no': 6
  name: 私域前端流量 —— 先解决流量，再谈转化
  points:
  - '**为什么需要这个概念？**'
  - '- 很多做私域的人花大量精力优化话术、设计活动、培训员工，却发现根本没人进来，一切努力都是自嗨'
  - '- 私域只是渠道，不是生意的源头；没有前端流量进来，后端转化做得再好也无济于事'
  - '- 需要纠正“私域运营决定成败”的误区，把注意力转移到流量的源头'
  - '**核心定义**'
  - '- 私域运营的真正痛点不在于私域内部怎么做，而在于前端的流量来源是否打通——是否有稳定、持续的流量进入私域池子'
  - '- 私域只是一个帮助企业与客户建立关系、发展粘性的渠道，真正决定成败的是前端获客'
  - '**关键性质**'
  - '- 流量前置：一切商业模式的第一步是解决流量，其次才是转化和交付'
  - '- 渠道属性：私域不是目的，是承接流量的容器'
  - '- 瓶颈识别：当私域增长停滞时，先检查前端流量，而非盲目优化内部运营'
  - '**典型例子**'
  - '- 同样两个卖护肤品的，一个每天有100个新客户加微信，一个只有10个，即便后者话术再精妙，总成交也大概率不如前者'
  - '- 做小红书引流卖课：内容发出去了但没人看（前端流量问题），此时优化朋友圈转化话术毫无意义'
  - '**边界条件**'
  - '- 当私域已经积累了大量“僵尸粉”时，需要先激活存量用户，而非一味追求新增'
  - '- 前端流量质量比数量更重要——引来一堆非目标用户，转化率和口碑都会受损'
  - '- 不同行业、不同阶段对前端流量的依赖程度不同，成熟品牌可能更依赖复购'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  excerpts:
  - 私域只是一个渠道，是帮助我们企业更好地跟客户建立关系和发展粘性的一个渠道，其实更重要的是前端的流量，你有没有打开流量，每个月是否有稳定的流量进来。
  - 所以私域的痛点不在于私域怎么做，而是前端流量如何来。
  - 如果项目前面流量的问题没有搞定的话，都没有用！
