learning_targets:
- 理解自动化工具如何解决跨平台信息流转的个人化需求
- 掌握 IFTTT 平台「如果这样，就会那样」的核心心智模型与 Applet 组装方式
- 区分触发器（Trigger）与动作（Action）在自动化任务中的职责分工
- 能够使用 Webhook 地址将消息推送到企业微信、钉钉等群聊工具
- 能评估零代码自动化方案的适用边界与免费额度限制
concept_map:
- 零代码自动化
- ├── IFTTT 平台
- │   ├── 定义：无需写代码的连接不同应用的自动化服务
- │   ├── 核心心智模型：If This Then That（如果这样，就会那样）
- │   └── Applet：用户组装的自动化任务（免费限额 2 个）
- ├── 触发器（Trigger）
- │   ├── 职责：监听「事件发生」的条件（因果链的「如果」）
- │   └── 案例：Twitter「指定用户更新推特触发」，需绑定自己的账号+监控账号
- ├── 动作（Action）
- │   ├── 职责：执行「事件发生后」的结果（因果链的「那样」）
- │   ├── 路径一：Email 推送（零配置首选，适合快速验证）
- │   └── 路径二：Webhook 推送（实时性强，适合团队协作）
- ├── Webhook
- │   ├── 定义：访问特定 HTTP 地址并携带规定格式内容即可推送消息的通用机制
- │   ├── 企业微信群机器人为典型载体
- │   ├── 鉴权简单：逻辑内置于地址（token）中
- │   └── 边界：群含「外部联系人」则无法创建机器人
- └── 应用边界
- ├── 免费额度：仅 2 个推送机器人，更多需付费
- ├── 平台依赖：触发源受第三方 API 策略影响
- └── 可迁移性：支持 Webhook 的平台（钉钉等）均可复用
life_analogy:
- 想象自动化工具是一个**贴心的私人助理**：
- '- **IFTTT** = 这位助理的服务台'
- '- **If This（触发器）** = 助理盯着的信号灯，比如“老板一发朋友圈就告诉我”'
- '- **Then That（动作）** = 助理听到信号后做的事，比如“立刻发微信通知你”'
- '- **Webhook** = 助理手中那条专属的“快递专线”，直接把消息塞进你的群聊'
- '- **Applet** = 你给助理下达的一张“注意事项卡片”，写清条件和动作'
- 就像助理帮你盯梢跑腿，IFTTT 也在 7x24 小时替你监控事件、执行响应。
summary:
- concept: IFTTT 自动化平台
  desc: 无需写代码、以「如果这样，就会那样」逻辑连接不同应用的自动化服务
- concept: 触发器（Trigger）
  desc: 自动化任务的「如果」条件部分，负责监听事件是否发生
- concept: 动作（Action）
  desc: 自动化任务的「那样」结果部分，负责执行事件发生后的响应
- concept: Webhook
  desc: 一种访问特定 HTTP 地址携带规定内容即可推送消息的通用机制
- concept: 零代码自动化
  desc: 用工具直接满足个人化需求，而非自研软件的方法论
- concept: Applet 逻辑
  desc: 「如果这样了，那就会那样」的普适理解框架，可衍生多元玩法
- concept: 免费额度与边界
  desc: 免费仅 2 个机器人，群含外部联系人无法创建机器人
exercises:
- 'no': 1
  title: 设计一个自己的自动化 Applet
  contents:
  - 结合 IFTTT 的「If This Then That」逻辑，为以下场景设计自动化方案：
  - 场景：你关注的一位行业 KOL 在新浪微博发布新动态，你想第一时间收到通知，但不想频繁刷微博。
  - 1. 明确触发器（Trigger）应该是什么？需要哪些参数？
  - 2. 明确动作（Action）可以选择哪些？每种动作的优劣是什么？
  - 3. 画出该自动化任务的因果链示意图。
  - 4. 思考：若该 KOL 只在国外平台（如 X/Twitter）活跃，你的方案需要做哪些调整？
  - 回答问题：
  - '- 如果该平台不支持 Webhook，你还有哪些备选推送方式？'
  - '- 如何评估这个自动化方案是否值得搭建（成本 vs 收益）？'
- 'no': 2
  title: 推演 Webhook 请求体的格式与字段
  contents:
  - 给定以下企业微信群机器人的 Webhook 地址：
  - https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx-xxxx-xxxx
  - 素材中使用的 JSON 请求体为：
  - '```'
  - '{'
  - '  "msgtype": "markdown",'
  - '  "markdown": {'
  - '    "content": "> 账号:{{UserName}} \n> 内容:{{Text}}\n> 链接:{{LinkToTweet}}"'
  - '  }'
  - '}'
  - '```'
  - 1. 解释上述 JSON 中 `msgtype`、`markdown`、`content` 三个字段各自的作用。
  - '2. 若想对群聊发送一条「文本类型」的消息，且内容为“Stock price alert: ABC is up 5%”，请改写请求体。'
  - 3. 思考：`{{UserName}}` 这类占位符在 IFTTT 中是如何被替换的？
  - 4. 若推送的消息包含敏感链接，你会如何设计 content 的内容以降低风险？
  - 回答问题：
  - '- 为什么企业微信要求使用 markdown 类型而不是纯文本类型？'
  - '- 若将同样的请求体发送到钉钉的 Webhook 地址，会有哪些差异？'
- 'no': 3
  title: 评估零代码自动化的适用边界
  contents:
  - 考虑以下三个自动化需求，分别判断是否适合用 IFTTT/零代码工具实现，并说明理由：
  - 需求 A：监控某电商平台 5 个关键词的价格，降价超过 10% 时推送通知给自己。
  - 需求 B：将某公众号每日更新的文章自动同步到自己的知识星球。
  - 需求 C：根据用户输入的不同问题，自动生成定制化回复（含多条件分支判断）。
  - 1. 对每个需求，判断：该需求是否小众/琐碎？是否值得自研？
  - 2. 对适合用零代码工具的需求，设计触发器与动作；对不适合的，说明局限在哪里。
  - 3. 若需要处理多个需求的叠加（如 A+B 同时运行），免费额度是否足够？
  - 回答问题：
  - '- 零代码工具的能力覆盖有限，哪些类型的逻辑它们无法实现？'
  - '- 涉及商业敏感数据时，使用第三方自动化平台有哪些隐私风险？'
units:
- 'no': 1
  name: IFTTT —— 一张不需要写代码的“数字胶水”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人想实现“推特动态自动同步到微信/邮箱”这类跨平台信息流转，但不会写代码'
  - '- 手动搬运费时费力，且无法做到7x24小时的实时监控'
  - '- 需要一个“搭积木”式、参数化配置的自动化工具，把不同APP粘合在一起'
  - '**核心定义**'
  - '- IFTTT是一个无需编写代码的自动化服务平台，以「如果这样（If This）… 就会那样（Then That）」的条件触发逻辑连接不同应用（如Twitter、Email、企业微信）'
  - '- 用户通过配置参数组装自动化任务（Applet），免费用户限额2个触发机器人'
  - '**关键性质**'
  - '- 零代码：无需编程基础，编辑参数即可完成配置'
  - '- 跨平台：可以连接Twitter、Email、企业微信、钉钉等异构应用'
  - '- 可复制：配置好的同一套逻辑，可以迁移到其他支持Webhook的平台'
  - '**典型例子**'
  - '- 用IFTTT监控Web3圈大佬的推特账号，新推文自动推送邮件或企业微信，实现“跟着大佬做项目”的需求'
  - '- 有人用同一平台自动把微博内容同步到推特'
  - '**边界条件**'
  - '- 免费用户只能创建2个推送机器人（机器人即Applet实例），更多需付费'
  - '- IFTTT依赖第三方平台的开放接口，如果Twitter等平台API策略调整，触发源可能失效'
  - '- 平台是国外服务，访问稳定性受网络环境影响'
  sources:
  - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
    role: origin
  excerpts:
  - 接着我开始百度找工具，因为推特是国外的平台，国内的很多软件都不能用，最终我找到了个IFTTT这个平台，这个平台就是自动化的，也不需要自己写代码，编辑上一些参数就行了。
  - 这个平台有两个推送方式：1、推特用户更新内容后，以邮件方式将推特内容推送到指定邮箱 2、推特用户更新内容后，通过企业微信群的机器人将内容推送到企业微信群（钉钉也同理）
  - 免费用户只能搞2个推送机器人，还有两个付费版本，根据自己的需要购买
  - 进来之后，会出现这个，第一行的意思是：如果这样 第二行的意思是：就会那样 合起来就是：如果这样了，那就会那样
- 'no': 2
  name: 触发器与动作 —— 自动化任务的因果两端
  points:
  - '**为什么需要这个概念？**'
  - '- IFTTT这类自动化工具需要一种统一的抽象来描述“何时开始”和“做什么”'
  - '- 用户不需要理解底层API调用，只需在界面上选择“触发条件”和“执行动作”'
  - '- 把复杂的编程逻辑拆分成可视化、可配置的两段式因果链'
  - '**核心定义**'
  - '- 触发器（Trigger）是自动化任务的“如果”条件部分，负责监听“事件发生”的条件；本案例中选用Twitter平台下的“指定用户更新推特触发”（New
    tweet by a specific user）'
  - '- 动作（Action）是自动化任务的“那样”结果部分，负责执行“事件发生后”的结果；本案例对比了两种动作：发送Email到注册邮箱，或通过Webhook发起web
    request将内容推送到企业微信群'
  - '**关键性质**'
  - '- 一一对应：一个自动化任务需要至少一个触发器和一个动作共同构成因果链'
  - '- 参数化配置：每个触发器和动作都有可填写的参数（如监控的账号名、接收邮箱、Webhook地址）'
  - '- 模块化组合：选择哪个触发器与哪个动作是自由的，可以自由搭配出不同玩法'
  - '**典型例子**'
  - '- “如果指定用户发推（触发器）→ 发送邮件到我的邮箱（动作）”：零配置首选，适合快速验证链路'
  - '- “如果指定用户发推（触发器）→ 通过Webhook推送企业微信群（动作）”：实时性更强，适合团队协作场景'
  - '**边界条件**'
  - '- 触发器必须指定正确的账号（自己的账号+要监控的账号两个都要填）'
  - '- 动作的执行依赖目标服务的可用性（如邮箱服务、企业微信接口）'
  - '- IFTTT对触发频率有限制，极端情况下可能合并或延迟触发'
  sources:
  - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
    role: origin
  excerpts:
  - 点击 if this 后面的add 出现下面的界面
  - 在放大镜后面搜索 twitter 选择推特平台
  - 我们要用的是“指定用户更新推特触发”，就选择箭头指的那个
  - 这里要填两个账号，第一行的账号是自己的账号，第二行是要监控的账号。
  - 在下面的then that设置触发后的动作，邮箱推送和企业微信推送的区别就是触发后的动作不同。
  - 点击 then that 后面的add 进行添加 ，会进入到选择工具的界面，这里输入 email
  - 搜索名为「Webhooks」的触发器，选择「Make a web request」动作。
- 'no': 3
  name: Webhook —— 一条给机器人的“专属快递通道”
  points:
  - '**为什么需要这个概念？**'
  - '- 邮件推送虽然零配置，但实时性和触达率不如群聊消息'
  - '- 需要一个“通用推送通道”，能把消息直接塞进微信、钉钉等聊天工具里'
  - '- 用户（非程序员）也能通过填几个参数就完成对接，而不用写请求代码'
  - '**核心定义**'
  - '- Webhook是一种通过调用特定HTTP地址并携带规定格式内容即可向群聊推送消息的机制'
  - '- 企业微信群（同钉钉）的Webhook机器人即此机制：创建机器人后会获得一个Webhook地址，访问该地址并以某种方式携带内容即可把消息推送到企业微信中'
  - '**关键性质**'
  - '- 通用性：任何能提供Webhook地址的平台（企业微信、钉钉等）都能复用同一套推送逻辑'
  - '- 格式可控：通过Body字段携带JSON请求体，可自定义推送的Markdown内容、标题等'
  - '- 鉴权简单：鉴权逻辑内置于Webhook地址中，普通用户无需理解token机制'
  - '**典型例子**'
  - '- 在IFTTT动作中选择Webhooks的「Make a web request」，在URL中填入企业微信群机器人的Webhook地址，在Body中填入指定的JSON内容（含账号、内容、链接），即可将推特推文推送至企业微信群'
  - '- 钉钉机器人同样支持此逻辑，只要能获取Webhook地址的都能操作'
  - '**边界条件**'
  - '- 若企业微信群内包含「外部联系人」，则不能创建机器人，也就不能实现上述功能'
  - '- 单人群聊需先把人拉进来再T掉，才能规避“外部联系人”限制'
  - '- Webhook地址作为“钥匙”具有泄露风险，一旦泄露可能收到垃圾消息'
  sources:
  - paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
    role: origin
  excerpts:
  - 生成机器人成功后，会获取到一个 Webhook 地址，请记住这个地址。（以后我们简称 {WebhookUrl}）
  - 可以理解为，访问这个 Webhook 地址并以某种方式携带我们需要传递的内容，就能够把我们要传递的内容，推送到企业微信中。
  - 如果想创建单人群聊，没有钉钉的面对面建群的便捷功能，需要先把人拉进来，然后 T 掉，即可实现单人群聊。
  - 注意包含「外部联系人」的话，不能创建机器人，也就不能实现上述功能。
  - 同理，钉钉也是可以这样操作的，只要能获取到webhooks地址的都可以。
