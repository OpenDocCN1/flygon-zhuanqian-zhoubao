units:
- 'no': 1
  name: Google Colab —— 让每个人的浏览器都拥有“云端显卡”
  points:
  - '**为什么需要这个概念？**'
  - '- AI绘画模型（如Stable Diffusion）推理需要强大GPU算力，普通个人电脑往往无N卡/A卡或显存不足，导致无法本地运行。'
  - '- 搭建本地服务器成本高、门槛高，且环境配置繁琐，劝退大量非技术背景用户。'
  - '- 需要一个零成本、免配置、开箱即用的云端算力平台，降低AI绘画的体验门槛。'
  - '**核心定义**'
  - '- Google Colaboratory (Colab) 是 Google 提供的免费云端 Jupyter Notebook 环境，内置免费 GPU（约
    12G 内存、15G 显存、55G 硬盘），可在浏览器中远程执行 Python 代码。'
  - '- 本质是一台“远程电脑/云服务器”，用户无需本地部署，即可借用云端算力完成模型训练与推理。'
  - '**关键性质**'
  - '- 免费额度有限：每个账号每天仅可使用数小时，用完需断开并删除运行时释放资源。'
  - '- 环境非持久化：运行时断开或超时后，内存、文件系统（除挂载的 Gdrive）重置，需重新搭建环境。'
  - '- 硬件规格固定：免费版通常分配 T4/K80 等入门级 GPU，显存约 15G，限制大模型加载。'
  - '**典型例子**'
  - '- 零基础用户申请 Google 账号 → 打开共享 Colab 脚本 → 修改硬件加速器为 GPU → 连接运行时 → 依次执行挂载 Gdrive、克隆
    WebUI 仓库、安装依赖三条命令 → 获得可用的 Stable Diffusion WebUI 界面。'
  - '**边界条件**'
  - '- 免费额度不稳定，高峰期可能无法分配 GPU，或提前断连。'
  - '- 严禁用于挖矿、长时间挂机等违反服务条款行为，封号风险高。'
  - '- 大模型（>10GB）或多模型并存易撑爆 55G 磁盘/15G 显存，导致 OOM 或磁盘写满崩溃。'
  - '...'
  sources:
  - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
    role: origin
  excerpts:
  - colab是google提供的一个云平台，可以理解为一台远程电脑或者云服务器，用户远程连接进去后，可以用其提供的CPU、GPU资源做各种各样的事情。
  - Google colab提供了免费与收费服务，免费服务每个账号大概每天可以玩几个小时，免费的配置大概是12G的内存，15G左右的显存以及55G左右的硬盘。
  - 选择左上角Edit(修改)->Notebook settings (笔记本设置)->Hardware accelerator（硬件加速器）->GPU
  - 选择右上角connect（连接）->就会分配云服务器资源。
  - 注意：该操作会将搭建好的环境全部删除清空
- 'no': 2
  name: Stable Diffusion WebUI —— 让命令行变成“可视化操作台”
  points:
  - '**为什么需要这个概念？**'
  - '- 原生 Stable Diffusion 需通过命令行调用参数、编写推理脚本，对非程序员极不友好，使用门槛极高。'
  - '- 缺乏直观的参数调节界面（如采样器、迭代步数、CFG Scale、高清修复等），难以进行精细化出图控制。'
  - '- 需要一个图形化界面，将复杂的参数配置封装为可视化控件，实现“所见即所得”的交互体验。'
  - '**核心定义**'
  - '- Stable Diffusion WebUI (通常指 AUTOMATIC1111 版本) 是基于 Gradio 构建的浏览器端可视化界面，封装了 txt2img、img2img、Extras、PNG
    Info、Model 训练等核心功能模块。'
  - '- 它将底层的扩散模型推理流程、模型加载、提示词解析、采样器调度等技术细节隐藏，暴露业务参数给用户操作。'
  - '**关键性质**'
  - '- 插件生态丰富：支持 ControlNet、ADetailer、xFormers 等扩展，功能可无限叠加。'
  - '- 跨平台一致性：只要浏览器能访问 Colab 公网链接，即可获得与本地部署一致的操作体验。'
  - '- 启动参数可控：通过 `COMMANDLINE_ARGS` 注入 `--share`（公网访问）、`--gradio-auth`（鉴权）、`--deepdanbooru`（反推提示词）等参数定制启动行为。'
  - '**典型例子**'
  - '- 用户在 Colab 执行 `!COMMANDLINE_ARGS="--deepdanbooru --share --gradio-auth user:pass"
    python launch.py`，几分钟内获得带鉴权的公网 WebUI 链接，手机端即可随时随地出图。'
  - '**边界条件**'
  - '- Gradio `--share` 生成的公网链接有效期通常 72 小时，且受 GFW 影响，国内直连不稳定，常需代理。'
  - '- WebUI 依赖特定 Python 环境与 PyTorch 版本，Colab 基础镜像更新可能导致依赖冲突，需定期维护启动脚本。'
  - '- 显存管理不善（如未开启 `--medvram`/`--lowvram`）极易在免费 T4 显存上 OOM。'
  - '...'
  sources:
  - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
    role: origin
  excerpts:
  - 基于用于stable diffusion开发的一套webui的界面，方便更多人的使用。没有这个的话，要使用stable diffusion的话只能写代码或者敲命令，大多数人使用会很困难，这也是现在AI绘画大火的一个很重要的原因。
  - '命令行参数如下:'
  - '  - `--share` - 创建一个在线的 gradio.app 链接'
  - '  - `--deepdanbooru` - 用于安装deepdanbooru，方便使用图片获取prompt'
  - '  - `--ckpt` - 用于选择加载默认模型'
  - '!COMMANDLINE_ARGS="--deepdanbooru --share --gradio-debug --gradio-auth test:test"
    REQS_FILE="requirements.txt" python launch.py'
- 'no': 3
  name: 模型分发四法 —— 解决“模型文件怎么进云端电脑”的物流难题
  points:
  - '**为什么需要这个概念？**'
  - '- Stable Diffusion 依赖 Checkpoint 模型文件（通常 2-7GB），Colab 环境重置后模型丢失，每次重新下载极其耗时且消耗流量。'
  - '- 官方模型托管于 Hugging Face，国内直连极慢或不通；民间微调模型（如 NovelAI 泄露版、ChilloutMix 等）分散于网盘、论坛，缺乏统一分发渠道。'
  - '- 需要一套“获取-传输-落盘-加载”的标准化物流方案，支持不同来源、不同隐私级别的模型文件高效入驻云端环境。'
  - '**核心定义**'
  - '- 模型分发四法：① Gdrive 挂载拷贝法（私有、持久、空间小）；② gdown 分享链接下载法（小圈子、易失效）；③ Hugging Face 私有仓库
    + Token 中转法（隐私大、空间足、速度快、作者最推荐）；④ 任意云存储泛化下载法（通用接口、扩展性强）。'
  - '- 核心动作：将 `.ckpt` / `.safetensors` 文件精准拷贝至 `/content/stable-diffusion-webui/models/Stable-diffusion/`
    目录，WebUI 重载即可识别。'
  - '**关键性质**'
  - '- Gdrive 法：免费 15G 容量仅能存 1-2 个大模型，适合“常用精选”；`cp` 命令拷贝速度受限于 Colab 实例与 Gdrive 间带宽。'
  - '- gdown 法：利用 Google Drive 文件 ID 直链下载，无需挂载全盘，但分享链接访问量大时会被 Google 限流封禁。'
  - '- HF 私有仓库法：模型上传至私有 Model Repo，生成 `wget --header="Authorization: Bearer <token>"
    <url>` 命令，下载速度快、不占 Gdrive 配额、保护版权敏感模型不公开。'
  - '- 泛化法：凡提供直链或 API 的对象存储（AWS S3、Mega、R2、阿里云 OSS 均可）皆可复用 `wget`/`curl`/`rclone`
    下载。'
  - '**典型例子**'
  - '- 作者实操：在 HF 创建 Private Repo `my-sd-models` → 上传 `chilloutmix_NiPrunedFp32Fix.safetensors`
    (6.2GB) → 生成 Token `hf_xxx` → Colab 填入 Token 与下载链接 → 执行 `wget` 命令 → 2 分钟内完成下载并自动重命名至模型目录
    → WebUI 刷新即用。'
  - '**边界条件**'
  - '- HF 免费账号单仓库文件大小限制 10GB（单文件可超 10GB 需用 LFS），大模型需分片或开启 Git LFS。'
  - '- Token 权限设为 `read` 即可，切勿泄露 `write` 权限 Token，避免模型被篡改或删除。'
  - '- 国内网络访问 `huggingface.co` 域名不稳定，Colab 服务器在海外通常秒下，但若在国内自建服务器跑脚本需配置代理或镜像源（`hf-mirror.com`）。'
  - '...'
  sources:
  - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
    role: origin
  excerpts:
  - 将模型文件放入自己的Gdrive（Google 云端硬盘），然后colab挂载Gdrive，将Gdrive的文件拷贝到Colab中。
  - 这种方法的优点是模型文件因为是自己的云端硬盘文件，会确保不会丢失，缺点是免费的google账户硬盘空间只有15G，模型文件动辄4G、8G，所以存不了几个模型云端硬盘就会满了。
  - 进入网络硬盘，找到想要分享的文件，点击共享->权限为知道链接的任何人->复制链接->下图分享链接红框选中的就是该文件的ID，填入到脚本中的输入框即可
  - 'model_name = '''' #@param {type: ''string''} / !gdown {model_name} --output /content/stable-diffusion-webui/models/Stable-diffusion/model.ckpt'
  - 原因是有些model是泄露出的，并不是官方开源的，避免一些麻烦，所以你还没玩懂之前，选成私有的自己玩玩。
  - 我个人比较推荐使用huggingface，简单易学，综合体验很好。
  - 'user_token = '''' #@param {type: ''string''} / model_link = '''' #@param {type:
    ''string''} / model_vae_link = '''' #@param {type: ''string''}'
  - 'user_header = f"\"Authorization: Bearer {user_token}\"" / !wget --header={user_header}
    {model_link} -O /content/stable-diffusion-webui/models/Stable-diffusion/model.ckpt'
  - 如mega，AWS S3，google Cloud Storage...只要能拿到模型文件的外网访问地址，或者有提供API的云盘，理论上都可以，原理和从huggingface下载是一样的。
- 'no': 4
  name: Prompt 咒语工程 —— 用“结构化咒语”驯服扩散模型
  points:
  - '**为什么需要这个概念？**'
  - '- 扩散模型对自然语言理解不如大语言模型，直接输入“画个美女”往往生成崩坏、低质量图片。'
  - '- 需要一套经过社区验证的、结构化的“标签式提示词”范式，显式指定画质、构图、光影、主体细节、风格流派、负面约束，稳定产出高质量图片。'
  - '- 正向 Prompt 决定“生成什么”，负向 Prompt 决定“不生成什么/避免什么缺陷”，二者缺一不可。'
  - '**核心定义**'
  - '- 正向咒语：由画质标签 + 主体标签 + 环境/光影/风格标签 组成，权重语法如 `(tag:1.2)` 增强、`[tag:0.8]` 削弱，常用 Danbooru
    风格标签（逗号分隔）。'
  - '- 负向咒语：固定套装 `lowres, bad anatomy, bad hands, text, watermark, blurry...` 等通用质量否定标签，配合
    Embedding（如 `EasyNegative`）强化抑制伪影。'
  - '- 核心参数配套：Sampler (DPM++ 2M Karras)、Steps (20-30)、CFG Scale (7)、Size (512x512/768x768)
    + Hires. Fix 二次放大。'
  - '**关键性质**'
  - '- 模型绑定性强：针对 NovelAI/WAIFU 训练的咒语（动漫标签体系）用在 SD1.5/Realistic 模型上效果大打折扣，需按模型训练数据分布调整标签词汇表。'
  - '- 顺序敏感：前部标签权重高，核心主体、画质标签须前置；括号嵌套权重叠加计算，`((masterpiece))` ≈ `masterpiece:1.21`。'
  - '- 随机种子 固定 + 咒语固定 = 完全复现；种子 -1 (随机) 用于探索变体。'
  - '**典型例子**'
  - "- 素材提供的“海边动漫少女”万能咒语：\n  `masterpiece, best quality, CG, wallpaper, HDR, {(sea\
    \ beach)}, {beautiful detailed water}, {detailed light}, ((extremely delicate\
    \ and beautiful girls)), ((blue bubble)), splash, fluttered detailed splashs,\
    \ {{intricate detail}}, {highres}, surrounded_by_floating_petal, chiaroscuro,\
    \ swimming ring, splash, waves, coconut trees`\n  负向：\n  `lowres, (bad anatomy,\
    \ bad hands:1.1), text, error, missing fingers, extra digit, fewer digits, cropped,\
    \ worst quality, low quality, normal quality, jpeg artifacts, signature, watermark,\
    \ username, blurry, artist name, b&w, weird colors, (cartoon, 3d, bad art, poorly\
    \ drawn, close up, blurry:1.5), (disfigured, deformed, extra limbs:1.5)`"
  - '**边界条件**'
  - '- 咒语不是万能键：同一咒语在不同模型、不同 VAE、不同分辨率下效果差异巨大，需配合模型微调。'
  - '- 负向标签过多/权重过高会导致画面“过度平滑”、失去细节纹理，甚至出现灰雾感。'
  - '- 中文自然语言 Prompt 需依赖 CLIP 模型编码器支持（如 SDXL、SD3、带中文微调的 SD1.5），原版 SD1.5 对中文理解极弱，必须用英文标签。'
  - '...'
  sources:
  - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
    role: origin
  excerpts:
  - masterpiece,best quality,CG,wallpaper,HDR,{(sea beach)},{beautiful detailed water},{detailed
    light},((extremely delicate and beautiful girls)),((blue bubble)),splash,fluttered
    detailed splashs,{{intricate detail}},{highres},surrounded_by_floating_petal,chiaroscuro,swimming
    ring,splash,waves, coconut trees
  - 'Negative prompt: lowres, (bad anatomy, bad hands:1.1), text, error, missing fingers,
    extra digit, fewer digits, cropped, worst quality, low quality, normal quality,
    jpeg artifacts, signature, watermark, username, blurry, artist name, b&w, weird
    colors, (cartoon, 3d, bad art, poorly drawn, close up, blurry:1.5), (disfigured,
    deformed, extra limbs:1.5)'
- 'no': 5
  name: 模型即画风 —— 同一咒语在不同模型下的“风格迁移”实验
  points:
  - '**为什么需要这个概念？**'
  - '- 新手常误以为“咒语决定一切”，忽略模型权重文件才是画风的根本决定因素。'
  - '- 缺乏直观对比认知，导致在写实模型上强行用动漫咒语、或在动漫模型上追求照片级真实，反复调参无果。'
  - '- 需要建立“模型 = 风格基因，咒语 = 表型调控”的正确心智模型，先选对模型再写咒语。'
  - '**核心定义**'
  - '- 模型文件 (Checkpoint) 承载了训练数据分布的统计特征：NovelAI/WAIFU 训练于 Danbooru 高质量动漫图片 → 输出二次元赛璐珞/厚涂风格；SD
    1.4/1.5/2.1 训练于 LAION-5B 大规模图文对 → 输出偏写实、摄影、油画、3D 渲染等多元风格。'
  - '- 同一 Prompt + 同一 Seed + 不同 Checkpoint = 完全不同风格的图像，这是扩散模型“先验分布不同”导致的必然结果。'
  - '**关键性质**'
  - '- 动漫系模型：对 Tag 语法敏感，Tag 顺序、权重、画质标签影响极大，适合“标签式咒语”。'
  - '- 写实系模型：对自然语言描述相对友好，Tag 堆砌反而显得生硬，适合“描述式 Prompt”。'
  - '- VAE (Variational Autoencoder) 影响色彩还原与细节锐度：通用 `vae-ft-mse-840000` 提升所有模型解码质量；动漫模型常内置专用
    VAE，外挂通用 VAE 可能导致色彩发灰。'
  - '**典型例子**'
  - '- 素材实验：同用上述“海边少女”咒语 + 固定 Seed，NovelAI/WAIFU 输出赛璐珞风、发丝飘动、气泡透明感强的二次元图；SD 1.5 输出接近
    3D 渲染/半真实风格，光影物理感强但线条不利落；ChilloutMix 输出亚洲真人写真感、皮肤纹理细腻。'
  - '**边界条件**'
  - '- 模型融合 可混合风格（如 `ChilloutMix = SD1.5 + 某动漫模型`），但融合比例需反复试错，非线性叠加。'
  - '- LoRA (Low-Rank Adaptation) 可在基础模型上微调注入特定风格/角色/动作，权重 0.6-0.9，比换大模型轻量、组合灵活，是进阶必学技能。'
  - '- 版权与合规：NovelAI 泄露模型、Civitai 部分模型训练数据版权不明，商用需确认协议（如 CreativeML OpenRAIL-M），避免侵权风险。'
  - '...'
  sources:
  - paper: docs/202301-02/KomqdeUMloO1CkxrgADcqGvDnIe.md
    role: origin
  excerpts:
  - 上图从左到右、从上到下...从模型使用同一个prompt、同样参数生成的图片，可以明显看出novelai以及waifu满满的动漫风、其他模型则更加显得真实一些。
  - NovelAI以及Waifu这两个模型对应的是动漫画风，Stable Diffusion1.4/1.5，由于它使用来自LAION-5B数据库进行训练，...所以其画风包含了更多样式。
  - colab环境类似一台拥有GPU资源的云服务器...，通过上述操作stable diffusion webui环境搭建，已经将sdwebui的环境安装到了该台电脑上，现在需要将模型文件也拷贝到该台电脑上，sdwebui才能加载模型，从而出图。
- 'no': 6
  name: 免费额度生存法则 —— 在“白嫖”边缘游走的多账号与存储策略
  points:
  - '**为什么需要这个概念？**'
  - '- Colab 免费 GPU 单账号每日仅数小时，重度用户（批量出图、训练 LoRA、跑视频生成）极易耗尽配额导致强制断连。'
  - '- 环境非持久化，每次重新搭建 WebUI、下载模型耗时 10-20 分钟，有效出图时间被严重挤压。'
  - '- 需要一套“账号轮换 + 存储分离 + 启动加速”的生存策略，最大化免费额度利用率，降低冷启动成本。'
  - '**核心定义**'
  - '- 多账号轮换策略：注册多个 Google 账号，分别运行 Colab 实例，单账号额度用完切换下一个，理论上可线性叠加可用时长。'
  - '- 存储分离策略：模型/输出图片/日志 存放于持久化存储，环境层保持轻量。方案对比：Gdrive (15G 免费、挂载便捷但小) vs Colab 实例自带磁盘
    (55G 临时、速度快但易丢) vs HF 仓库 (无容量限制、版本管理、下载快但需网)。'
  - '- 启动加速策略：将 `git clone`、`pip install` 等耗时步骤固化进 Docker 镜像或 Colab 本地缓存（付费版 Pro+
    支持后台运行、终端访问），或使用预装好环境的社区共享 Notebook（如 `fast-stable-diffusion`、`kohya-ss` 等）。'
  - '**关键性质**'
  - '- 账号风控：同一设备/指纹/IP 批量注册、高频切换账号极易触发 Google 风控（要求手机验证、封禁账号），需配置指纹浏览器/代理 IP 隔离环境。'
  - '- 数据同步成本：Gdrive 挂载首次授权需人工点击，自动化脚本需处理 `drive.mount(''/content/drive'', force_remount=True)`
    与 Token 刷新。'
  - '- 成本临界点：当月度 GPU 需求超 100 小时，免费方案的时间成本（搭建、排队、换号、防封）边际收益递减，租用 RunPod/Vast.ai/Autodl
    等按秒计费云 GPU (约 $0.2-0.5/小时 A100/3090) 反而更划算。'
  - '**典型例子**'
  - '- 轻度玩家：单号 + Gdrive 存 1-2 核心模型 + 共享 Notebook 一键启动，周末娱乐足够。'
  - '- 重度玩家：3-5 个 Google 账号轮换 + HF 私有仓库存模型库 (50+ 模型) + Colab 实例磁盘作临时缓存输出图 → 定期 `zip`
    打包传回 Gdrive/HF/Telegram 机器人 → 本地整理。'
  - '**边界条件**'
  - '- Google 服务条款禁止“为规避配额限制而创建多个账号”，大规模自动化轮换存在封号法律风险，建议个人手动少量轮换。'
  - '- 免费额度政策随时调整（如 2023 年曾限制免费版运行训练任务），不可作为生产环境核心依赖，需有本地/付费云备选方案。'
  - '- 隐私数据：上传至 HF/Gdrive/Colab 的模型、图片、Prompt 可能被平台扫描、用于改进服务，涉及商业机密/隐私数据严禁上传公共云。'
  - '...'
