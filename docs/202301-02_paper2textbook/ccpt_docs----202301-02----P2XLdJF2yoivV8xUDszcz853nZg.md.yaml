paper: docs/202301-02/P2XLdJF2yoivV8xUDszcz853nZg.md
desc: 该素材以一篇中文实操教程的形式，面向非技术用户，系统介绍了如何利用自动化平台 IFTTT（If This Then That）实现「监控指定 Twitter
  账号，并在其发布新内容时自动推送通知」的两条完整路径：一是通过邮件将推文内容推送到注册邮箱；二是通过企业微信群机器人（以及可类推的钉钉群机器人）的 Webhook
  地址，以 Markdown 格式将账号、内容与链接推送到群聊。素材以「触发器（Trigger）+ 动作（Action）」为逻辑主线，配套大量界面截图，逐一演示注册、新建
  Applet、选择 Twitter 触发器、配置邮箱动作、创建企业微信群机器人、获取 Webhook 地址并填写请求体等步骤，并给出适用于企业微信的 JSON
  请求体示例。全文强调零代码、自动化、可复制性，旨在让读者照做即可完成「关注链上/Web3 大佬动态并即时同步到微信生态」的需求。
concepts:
- name: IFTTT 自动化平台
  desc: IFTTT 是一个无需编写代码的自动化服务平台，以「如果这样（If This）… 就会那样（Then That）」的条件触发逻辑连接不同应用（如 Twitter、Email、企业微信），用户通过配置参数即可搭建自动化任务（Applet），免费用户限额
    2 个触发机器人。
  is_original: false
  excerpt:
  - 接着我开始百度找工具，因为推特是国外的平台，国内的很多软件都不能用，最终我找到了个IFTTT这个平台，这个平台就是自动化的，也不需要自己写代码，编辑上一些参数就行了。
  - 这个平台有两个推送方式：1、推特用户更新内容后，以邮件方式将推特内容推送到指定邮箱 2、推特用户更新内容后，通过企业微信群的机器人将内容推送到企业微信群（钉钉也同理）
  - 免费用户只能搞2个推送机器人，还有两个付费版本，根据自己的需要购买
  - 进来之后，会出现这个，第一行的意思是：如果这样 第二行的意思是：就会那样 合起来就是：如果这样了，那就会那样
- name: 触发器（Trigger）
  desc: 在 IFTTT 中，触发器是自动化任务的「如果」条件部分；本素材选用的触发器为 Twitter 平台下的「指定用户更新推特触发」（New tweet
    by a specific user），并需同时绑定自己的 Twitter 账号与目标监控账号。
  is_original: false
  excerpt:
  - 点击 if this 后面的add 出现下面的界面
  - 在放大镜后面搜索 twitter 选择推特平台
  - 我们要用的是“指定用户更新推特触发”，就选择箭头指的那个
  - 这里要填两个账号，第一行的账号是自己的账号，第二行是要监控的账号。
- name: 动作（Action）
  desc: 在 IFTTT 中，动作是自动化任务的「那样」结果部分；本素材对比了两种动作：一是发送 Email 到注册邮箱，二是通过 Webhook 发起 web
    request 将内容推送到企业微信群（钉钉同理）。
  is_original: false
  excerpt:
  - 在下面的then that设置触发后的动作，邮箱推送和企业微信推送的区别就是触发后的动作不同。
  - 点击 then that 后面的add 进行添加 ，会进入到选择工具的界面，这里输入 email
  - 搜索名为「Webhooks」的触发器，选择「Make a web request」动作。
- name: Webhook 机器人
  desc: 企业微信群（同钉钉）的 Webhook 机器人是一种通过调用特定 HTTP 地址并携带规定格式内容即可向群聊推送消息的机制；本素材以「{WebhookUrl}」指代该地址，并强调包含外部联系人的群无法创建机器人。
  is_original: false
  excerpt:
  - 生成机器人成功后，会获取到一个 Webhook 地址，请记住这个地址。（以后我们简称 {WebhookUrl}）
  - 可以理解为，访问这个 Webhook 地址并以某种方式携带我们需要传递的内容，就能够把我们要传递的内容，推送到企业微信中。
  - 如果想创建单人群聊，没有钉钉的面对面建群的便捷功能，需要先把人拉进来，然后 T 掉，即可实现单人群聊。
  - 注意包含「外部联系人」的话，不能创建机器人，也就不能实现上述功能。
- name: Applet 逻辑（If This Then That）
  desc: IFTTT 的核心心智模型「If This Then That」被作者形象地解释为「如果这样了，那就会那样」，并指认这是在该工具上衍生多种自动化玩法（如同步微博到推特）的普适理解框架。
  is_original: false
  excerpt:
  - 进来之后，会出现这个，第一行的意思是：如果这样 第二行的意思是：就会那样
  - 合起来就是：如果这样了，那就会那样
  - 理解了这句话，在这个工具上就能玩出很多的花样，比如说现在有人通过这个工具自动把微博的内容同步到推特
methods:
- name: __overview__
  desc: 零代码配置 IFTTT 自动化推送的整体流程：注册平台 → 新建 Applet → 选择 Twitter「指定用户更新」触发器并绑定账号 → 选择推送动作（Email
    或 Webhook）→ 配置目标参数 → 提交并验证。该流程无需编程，且电话端同样适用。
  excerpt:
  - 注册后，点击上面的My Applets
  - 这个平台就是自动化的，也不需要自己写代码，编辑上一些参数就行了。
  - 设置好后，点击create action提交就行了。
  - 提交之后，这个机器人就完成设置了，当你要监控的推特账号更新内容后，就会发送到你的邮箱了。
  - 手机上也是一样的操作，而且手机上还有很多地方是中文的
- name: 触发器配置方法
  desc: 在 IFTTT 内选取 Twitter 的「New tweet by a specific user」触发器，依次完成账号授权（输入自己的推特账号密码）、填写被监控账号（Username
    to watch）、点击 Create trigger。
  excerpt:
  - 点击 if this 后面的add 出现下面的界面
  - 在放大镜后面搜索 twitter 选择推特平台
  - 选择后，进入到下一个页面，选择账号
  - 点击 add new account 会弹出来让你授权
  - 这里输入自己的推特账号密码就行了。
  - 然后在Username to watch 填入你要监控的推特账号，最后点击 Create trigger
- name: 邮箱推送配置方法
  desc: 在动作侧选择 Email 服务，使用默认或自定义的邮件内容（可通过 add ingredient 添加参数），点击 create action 后，推文即以邮件形式发送到注册邮箱。
  excerpt:
  - 点击 then that 后面的add 进行添加 ，会进入到选择工具的界面，这里输入 email
  - 进入到下一个页面，只有一个可选项，这里就选它
  - 默认的内容就是这样的，如果你还想要推送别的内容到你的邮箱， 那么点击add ingredient 就能添加参数了。
  - 这里他推送的邮箱是你账号注册的邮箱。
- name: 企业微信群 Webhook 推送配置方法
  desc: 在企业微信中创建群聊（单人群需先拉人再 T 掉）、在群设置中添加机器人获取 Webhook 地址；在 IFTTT 动作侧选择 Webhooks 的「Make
    a web request」，按指定格式填入 url、method、content type 等字段，并在 body 中粘贴规则要求的 JSON 请求体，即可实现推送。
  excerpt:
  - 在群聊的设置界面中，添加机器人。
  - 生成机器人成功后，会获取到一个 Webhook 地址，请记住这个地址。（以后我们简称 {WebhookUrl}）
  - 搜索名为「Webhooks」的触发器，选择「Make a web request」动作。
  - url填写WebhookUrl 其他的按照图中选择，Additional Headers 这个不填（因为我不知道这是啥意思）
  - 'body填写内容(从下面一行的括号开始复制）： { "msgtype": "markdown", "markdown": { "content": ">
    账号:{{UserName}} \n> 内容:{{Text}}\n> 链接:{{LinkToTweet}}" } }'
- name: 通用推广法（技术可迁移性）
  desc: 提出同类接口（凡能获取 Webhook 地址的平台，如钉钉）均可采用相同的推送配置逻辑，从而实现跨平台适配。
  excerpt:
  - 同理，钉钉也是可以这样操作的，只要能获取到webhooks地址的都可以。
theorems:
- name: 零代码自动化可作为个人需求响应的快速解法
  desc: 面对「国外平台（Twitter）内容难以即时触达国内常用工具（微信）」的个人化需求，可通过无代码自动化平台直接满足，无需自研软件。
  excerpt:
  - 前几天，我对象说如果有个工具，能把推特的账号发送的内容在很短的时间之内推到微信就好了，这样就能掌握很多web3圈内大佬的消息，跟着他们的步伐做项目了。
  - 有需求，就能满足。
  - 这个平台就是自动化的，也不需要自己写代码，编辑上一些参数就行了。
- name: 触发-动作二元逻辑可衍生多元玩法
  desc: 一旦理解了「If This Then That」的抽象关系，就能基于同一平台衍生出任意「事件到响应」的自动化组合（如同步微博到推特）。
  excerpt:
  - 进来之后，会出现这个，第一行的意思是：如果这样 第二行的意思是：就会那样
  - 理解了这句话，在这个工具上就能玩出很多的花样，比如说现在有人通过这个工具自动把微博的内容同步到推特
- name: 外部联系人限制机器人功能
  desc: 企业微信群若包含「外部联系人」则无法创建机器人，从而无法启用 Webhook 推送功能；单人群聊可通过先拉人再移出的方式建立。
  excerpt:
  - 注意包含「外部联系人」的话，不能创建机器人，也就不能实现上述功能。
  - 如果想创建单人群聊，没有钉钉的面对面建群的便捷功能，需要先把人拉进来，然后 T 掉，即可实现单人群聊。
- name: Webhook 即可作为推送通道的抽象能力
  desc: 任何能提供 Webhook 地址的平台都可复用同一种推送逻辑，因此只要目标工具支持 Webhook，均可接入该自动化方案。
  excerpt:
  - 同理，钉钉也是可以这样操作的，只要能获取到webhooks地址的都可以。
findings:
- name: 'F1: 邮件推送路径可行'
  desc: '[evidence] 作者实测 Email 推送方式可成功：提交触发器与邮件动作后，被监控账号更新时即会推送到注册邮箱。'
  excerpt:
  - 设置好后，点击create action提交就行了。
  - 提交之后，这个机器人就完成设置了，当你要监控的推特账号更新内容后，就会发送到你的邮箱了。
  - 这两个方法我都测试了，都是可以的
- name: 'F2: 企业微信 Webhook 推送路径可行'
  desc: '[evidence] 作者实测企业微信群机器人方式可成功：通过 Webhook 地址 + 请求体配置后，得到可用的推送机器人，推文内容以 markdown
    格式进入群聊。'
  excerpt:
  - 配置好上面的内容后，提交就行了。
  - 最后，你就会得到这样的机器人
  - 这两个方法我都测试了，都是可以的
- name: 'F3: 实现方案可迁移至钉钉'
  desc: '[claim] 作者宣称钉钉可同法实现（只要能获取 Webhook 地址），但未展示钉钉侧的实测过程与结果。'
  excerpt:
  - 同理，钉钉也是可以这样操作的，只要能获取到webhooks地址的都可以。
