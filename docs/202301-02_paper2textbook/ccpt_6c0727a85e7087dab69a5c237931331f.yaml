paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
desc: 该素材以“0中介费”为切口，完整复盘了“胖龟找房”项目从1.0（卖房信息差平台）到2.0（胖龟+ 居家生活平台）再到3.0（0中介费租房平台）的三年创业迭代全流程。素材核心主张是“中介费是信息差造成的伪概念”，通过自建小程序+线下门店+店中店+合伙人裂变的模式，先解决买卖双方信息不对称问题，再通过会员费、开发商返佣、代办费、租房佣金等方式盈利，最终获得百万天使投资并月入15w+。素材详细披露了获客渠道（物业、水电费号、同行转化、自媒体矩阵）、避坑经验（外包选型、招聘偏好、抖音投放策略）以及租房业务的房东/租客双向找源-配房-带看-成交-裂变-扩张的整套SOP，对实体+互联网闭环创业具有较强参考价值。
concepts:
- name: 中介费伪概念
  desc: 作者提出的核心商业主张：中介费之所以能收取，本质是买房/租房者不知道业主联系电话，由此形成信息差，因此中介费是“信息差造成的智商税”，一旦信息透明化该费用即可被取消。
  is_original: true
  excerpt:
  - 我们不收中介费，是因为中介费本身就是个伪概念！为什么说是伪概念，因为是智商税，中介费为什么要收？就是因为买房及租房者不知道售房及出租转让业主的联系电话！
  - 如果买房者或者租房者知道房东电话！那么他们还会给中介公司掏中介费吗？nonononon，绝对不会！这叫什么？是不是信息不对等差造成的信息差？
- name: 个人房屋分享平台
  desc: 作者定义的差异化平台定位：区别于58同城、安居客、贝壳找房等实为“网上房屋中介公司”的伪第三方平台，胖龟找房定位为个人房屋分享平台，让买卖/租赁双方直接对接。
  is_original: true
  excerpt:
  - 我们不是房屋中介公司，因为我们不收取中介费！我们是第三方平台，但是又跟其他的第三方平台不一样，我们做的是个人房屋分享平台。
  - 58同城里面的房源有个人有中介，大多数置顶，首页的房源全是房屋中介的置业顾问发布的房源。安居客，贝壳找房，房天下，里面全是房源，但联系人全是各个房屋中介公司的置业顾问！（伪第三方平台，其实就是网上房屋中介公司...）
- name: 店中店联营赋能
  desc: 通过合伙人计划在便利店、菜鸟驿站、理发店等贴近客户的社区业态中开设联营店中店，通过小程序锁码跟踪为社区业态赋能、为合作方增收，以低成本扩展线下触点。
  is_original: true
  excerpt:
  - 通过合伙人计划，开设联营店中店，有便利店，社区菜鸟驿站，理发店等各种贴近顾客的地方。我们通过小程序锁码跟踪，为社区业态附能，为合作方增收。
- name: 二房东渠道
  desc: 0中介费租房业务中，确定由二房东方承担原本应由租客支付的中介费的商业模式：通过58同城、美团公寓、长租公寓老板等渠道找到二房东，因为二房东空置一天即损失一天房租，有动力付费快速出房。
  is_original: true
  excerpt:
  - 我们推演了很多，也会见了很多房东，最后我们找准了二房东这个渠道。因为二房东手上不单单就一间房子，他需要快速的让自己的房子租出去不能有空置，因为每空置一天，房租的费用就需要自行来承担。
- name: 蹭流截流开店
  desc: 一种线下门店选址策略：将店开在传统中介店隔壁，利用对方门店的自然客流，以“0中介费”门头标语截流用户，只做引流和转化。
  is_original: false
  excerpt:
  - 传统的中介店会有大量的客户到店，我们只需要在隔壁开一家小店，很小的一家店，就会有源源不断的客流通过我们店铺门前。只用做好引流跟转化就行了。
  - 用互联网的专有名词，就是蹭，蹭其他中介的流量，然后通过我们的门头标语：买二手房，租房，"0"中介费。来吸引用户到店，以达到截流的目的。
methods:
- name: __overview__
  desc: 0中介费房产平台的完整创业闭环方法论：以信息差洞察为切入，自建小程序+线下门店+店中店+抖音招商四轮驱动获客，通过年费会员+开发商返佣+代办费+推广奖裂变实现盈利，再以平台+城市合伙人模式复制扩张。
  excerpt:
  - 胖龟找房建立这个第三方平台撮合买方与卖方匹配，互利，解决需求及痛点，产生良性循环。
  - 我们将所有的流程模板化，标准化，我们通过区域合伙人计划——城市管家，快速让合伙人上手。
- name: 房东联系方式获取法
  desc: 建立线下房源库的三条低成本获取房东电话的渠道：物业关系付费获取、水电费号逆向查询、同行（传统中介）房源共享转化。
  excerpt:
  - 物业：通过与物业建立起关系，给予一定的费用，拿到业主电话。
  - 水电费号码：通过水电费号，找到相应的单位人员获取业主电话。
  - 同行转化：传统的中介，房源共享，客户共享，切入同行，获取业主电话。
- name: 租客全域发掘法
  desc: 通过抖音/快手/小红书（发帖+评论区私聊）、58/安居客（拼室友）、转转/咸鱼（求租广场）、豆瓣/微博/知乎（超话、小组）等自媒体平台矩阵发掘有效租客的方法，强调主动出击而非坐等上门。
  excerpt:
  - 打开抖音，搜索 上海租房，找热点回复量最高的几个，点开评论区，找回复 博主：这个多少钱，这个还在吗，徐汇区某某还有房子吗，等等一系列的有租房欲望的人，那就给人私聊，破冰建立联系取得租房需求。
  - 转转，咸鱼，这些APP比较有意思，在主菜单上直接就有租房的模块，点开租房，找到求租广场...
  - 豆瓣，微博，知乎，这一类的APP，比如微博，有各地的租房超话，#杭州租房超话#上海租房超话，进入讨论组内，进行发帖，回复...
- name: 配房-带看-成交标准流程
  desc: 租房业务的标准化运营SOP：后台按租户需求精准匹配3-5-7套房子，不满意的进行二配三配；看房提供位置+密码锁密码引导自看；成交时联系房东最短时间内签约，大量采用线上签约。
  excerpt:
  - 由后台人员，根据租户提供的租房需求，按照公司的房源表进行精准匹配房源，每个需求会发对应的 3-5-7 套合适的房子，不满意的接着二配，三配等。每位人员都会有自己相应的客户表，每日要进行总结，每周要进行复盘...
  - 客户想看哪个房子，我们会提供这个房子的位置、楼牌号、房间号、密码锁的密码，或者钥匙存放位置。引导客户自己去看房...
  - 一旦客户看中了，我们会联系房源所属的房东，二房东，管理公司等，在最短的时间内到房间内给客户签署租房合同，当然也有很大一部分都是线上签约。
- name: 避坑指南
  desc: 三年创业中总结的三条经验教训：小程序开发选外包要深入实地考察并最好吸纳技术合伙人；线下运营优先招刚毕业大学生而非有固化思维的房产销售；营销渠道排序为抖音>本地自媒体>汽车广播且投抖音必投本地。
  excerpt:
  - 在本地选择的时候，一定要深入公司内部去考察，看看外包团队的人员构成，人员数量，还有他们实施过的案例... 所以在做互联网项目创业的时候，最好的方式吸纳一位优秀的技术开发人员最好。
  - 一开始我们在线下招聘的时候偏向于找寻一些从事过相关房产行业的销售人员...这波人有个严重的问题，固化思维太重，难以改变思维，销售的重点只是推荐房子，而非会员的转化。后来我们把招聘重点放到了刚毕业的大学生身上...
  - 以此 抖音推广>本地自媒体>汽车广播...汽车广播这个板块不建议大家做，薅羊毛的客户比较多~...投抖音的时候如果你是做本地项目，一定要投本地一定要投本地...
- name: 城市扩张与人海战术
  desc: 将本地跑通的项目通过区域合伙人（城市管家）制度复制到杭州、上海、深圳等高流动人口城市，以单个基础员工底薪3000、月成交两单即覆盖成本的模型，通过人海战术获取更大利润。
  excerpt:
  - 单个房子的租金在我们这个城市大概在 1000-2000，每个基础员工的底薪大概在3000，每月成交两单，就能顾主成本。所以在项目跑通以后我们拓展了客服员工，通过人海战术获取更大的利润。
  - 将上海、杭州、深圳等数十万间合作房源整合到胖龟平台上...那里每年数以万计的毕业生蜂拥而至有庞大的需求市场...单个的房子佣金会更高，有高达 1-2w，也有
    2000-3000 的总体来说是很不错的。
  - 我们通过区域合伙人计划——城市管家，快速让合伙人上手。我们有自己平台，房源库、配房人员、带看流程、合伙人只需要维护用户，聊天就行。
theorems:
- name: 生意的本质是信息差
  desc: 作者的核心商业主张：二手房市场购房客户不懂买卖流程和交易规则，只能通过中介支付高额信息差费，因此以信息差为市场切入点建立平台商业模式。
  excerpt:
  - 生意的本质就是信息差，在互联网里也存在大量的信息差生意。以这个信息差为市场的切入点我们创办了胖龟找房的 1.0——没有中介费的个人房屋分享平台。
- name: 有需求的地方就有市场，找准痛点即可切入
  desc: 作者对行业痛点判断的核心主张：传统房产中介存在虚假低价房源、变相违规收费、签订阴阳合同、刻意抬高房价、子虚乌有的费用等五大痛点，并未从根本上解决行业问题，因此存在平台介入的商业机会。
  excerpt:
  - 有需求的地方就有市场，中介平台公司在房产市场蓬勃发展的10年获得了大量的财富，也产生了大量的问题。
  - 虚假低价房源：...变相违规收费：...签订阴阳合同：...刻意抬高房价：...子虚乌有的费用：签订合同，继续收割买房者口袋里的钱，高额的代办过户，代办贷款，千分之2的评估费差价，子虚乌有的贷款服务费1%。
- name: 平台内容创造准客户环境
  desc: 核心主张：只有有需求的客户才会浏览平台，因此活跃在平台上的都是准客户，平台撮合买卖双方匹配能产生良性循环。
  excerpt:
  - 因为平台上的客户全是有需求的，没有需求的客户是不需要来浏览的，那么活跃在胖龟找房里面的客户都是准客户。胖龟找房建立这个第三方平台撮合买方与卖方匹配，互利，解决需求及痛点，产生良性循环。
- name: 存量消费时代来临，行业面临重组洗牌
  desc: 对行业周期的判断：2018年起新建楼房走下坡路、城镇化接近尾声，叠加疫情，房产销售从存量与增量并重迈入存量消费时代，二手房成交金额逐年升高，传统中介迎来煎熬期与洗牌机会。
  excerpt:
  - 早在 2018 的时候国内的新建楼房已经开始走下坡路，大规模的城镇化建设也接近尾声。加上自 2019 年底疫情开始，老百姓们开始节衣缩食。国内房产销售已经从存量与增量市场并重的方向，开始迈入存量消费时代。
  - 任何一个行业都有其周期性...房地产行业正在进入低利率时期，房产中介未来会比较煎熬。
- name: 买房用户跳单的深层动机是省中介费
  desc: 核心主张：用户之所以绕过中介私下成交，是因为中介提供的服务不值所收的高额中介费，这一洞察是创业机会的源头。
  excerpt:
  - 回想一下买房的用户为什么要私下找我成交？我在开发新店的时候为什么愿意跑中介的单子？其实就是想省掉高额的中介费，中介提供的价值不值得收取这么高的费用。
- name: 投资须防骗子公司，收费即警惕
  desc: 对企业融资风险的经验判断：市面上很多打着投融资旗号的骗子公司，让创始团队缴纳各种名义的费用，一定不要盲目缴纳。
  excerpt:
  - 如果你想去融资，想去找投资人。最好有人推荐，市面上很多打着投融资的旗号的骗子公司，他们让创始团队缴纳各种名义的费用，少则几千多则上万，一定不要盲目缴纳各种费用。
findings:
- name: 第一年运营成果
  desc: '[evidence] 由素材罗列的第一年经营数据支撑的发现：项目1.0在洛阳跑通，开出8家门店、34家店中店，实现营收104.7万元，转化287名付费会员，帮助会员节省574万中介费及143万代办费。'
  excerpt:
  - 8 家门店，34 家店中店，新增 12110 名会员。
  - 转换胖龟会员 287 名，营收达 104.7 万元。
  - 帮助 287 名会员省了将近 574 万中介费。
  - 帮购房客户省了代办过户贷款及贷款服务费 143 万。
- name: 抖音投放投产比高于广播与自媒体
  desc: '[evidence] 由渠道投放效果对比数据支撑的发现：抖音推广效果最优（投产比不错），本地自媒体次之，汽车广播最差（投入2w未见水花），且抖音本地投放能带来4000+粉丝、100+付费会员、600元/名获客成本及5位加盟商。'
  excerpt:
  - 以此 抖音推广>本地自媒体>汽车广播
  - 品牌营销这部分营销推广直接带来了 4000+的粉丝，付费会员大概在 100 多名，获客成本大概在 600 左右一名，投产比还不错。
  - 招商版块推广带了 100+的意向客户，最后成交变成加盟客户 5 位，单个加盟商成本在 8000 左右。因为我们有个 1w 左右的利润，所以也是有盈余的。
  - 汽车广播这个板块不建议大家做，薅羊毛的客户比较多~。这个版块我们大概扔进去 2w，水花都看不到。
- name: 截流开店显著冲击对标门店业绩
  desc: '[evidence] 由涧西区标杆店案例支撑的发现：在销售冠军中介店隔壁开设“0中介费”门店后，成功截流大量顾客，导致对标门店销售额接连下降、店员不敢带客到店洽谈。'
  excerpt:
  - 一个典型的案例，我们这边有个涧西区，涧西区有个中介门店，该门店是整个洛阳市区里的标杆店跟销售冠军门店。
  - 我们在这个店的隔壁开了一家店，门头就是“0 中介费”。自从开了店以后，截流隔壁门店好多顾客，导致这家门店销售额接连下降，店员也不敢带顾客去店里面谈了。
- name: 天使轮融资达成及业务月入15w
  desc: '[evidence] 由融资与营收数据支撑的发现：项目经过一年努力，于2021年6月13日获数百万元天使轮融资（投资方为早行人创投），并在新业务“0中介费租房”上线小半年后实现月入15w的成绩。'
  excerpt:
  - 经过了将近一年的努力，我们在 2021 年 6 月 13 日，获数百万元天使轮融资，投资方为早行人创投。
  - 我们开辟了全新的业务增收渠道，做到了月入 15w 的小成绩...这个业务板块我们从 0 开始摸索，经过了小半年的努力，我们做到了月入 15w 的小成绩。
- name: 租房利润模型：单员工月两单即覆盖成本
  desc: '[evidence] 由素材内利润测算数据支撑的发现：在洛阳本地，单房月租金1000-2000元，基础员工底薪3000元，每月成交两单即可覆盖人力成本，跑通后可通过人海战术放大利润。'
  excerpt:
  - 单个房子的租金在我们这个城市大概在 1000-2000，每个基础员工的底薪大概在3000，每月成交两单，就能顾主成本。所以在项目跑通以后我们拓展了客服员工，通过人海战术获取更大的利润。
- name: 外地市场佣金显著高于本地
  desc: '[evidence] 由上海、杭州、深圳房源佣金数据支撑的发现：一线/新一线城市单房佣金可达1-2w，也有2000-3000档位，显著高于洛阳，因此向高流动人口城市扩张具备更高单产。'
  excerpt:
  - 单个的房子佣金会更高，有高达 1-2w，也有 2000-3000 的总体来说是很不错的。
  - 那里每年数以万计的毕业生蜂拥而至有庞大的需求市场，存在着各种租赁需求...
- name: 市场先发：早于杭州政府平台布局
