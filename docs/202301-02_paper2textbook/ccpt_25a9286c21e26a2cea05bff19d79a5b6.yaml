paper: docs/202301-02/20230207_02.md
desc: 素材基于“龙哥赚钱周报”分享的精华帖，提出了跨境电商选品的“必胜法”——四步打造一个百万爆款。核心围绕作者的“选品四层方法论”（套利、流量&转化、模式、品&品类），构建了一个从市场/平台选择到产品差异化的完整选品范式。素材强调通过“找蓝海、走捷径、加光环、微创新”四个步骤，实现流量与转化的确定性，规避铺货思维和纯“货找人”流量的不确定性，追求长期主义和红利期。文章通过大量个人实战案例（如真皮鞋类、goretex平替）和行业观察，论证了这套方法论在亚马逊等平台上的可行性和效果，对新手具有极强的实操指导意义。
concepts:
- name: 蓝海市场/蓝海平台分类
  desc: 作者提出的对蓝海市场和平台的分类体系，根据语言、人口、准入壁垒等特征将蓝海分为最蓝、次蓝、微蓝和不蓝四个层级。
  is_original: true
  excerpt:
  - 最蓝的（第一类蓝海）：1.小语种发达国家，2.人口大于一个亿，3.有本地入驻门槛的头部平台 ，比如日本乐天
  - 次蓝的（第二类蓝海）：1.发到国家，2.人口大于一个亿，3.平台仍然有蓝海选品空间， 比如亚马逊欧美日
  - 微蓝的（第三类蓝海）：1.新上线的平台 ，2.刚开始开放中国卖家入驻的平台 ，即使是低价平台也有一点铺货红利期
  - 不蓝的：所有低价平台
- name: 蓝海方向
  desc: 比蓝海品类更高一层的概念，指一个相对垂直的产品方向（如真皮、科技材料），其本身就带有精准的搜索流量，是连接宽泛蓝海和具体选品的关键。
  is_original: true
  excerpt:
  - 蓝海方向不是蓝海品类，真皮或者科技材料，可以做的品类有好几个，比如真皮我们重点选择了鞋类，科技材料我们即做了鞋类也做了服装类。
  - 蓝海方向虽然有了，但还是很宽泛的，距离落实具体选品，虽然还有一些距离，但这一步，我们已经开始解决精准流量了，因为真皮就是一个相对垂直的关键词，对应的就是对产品有一定要求，并有一定消费力的人群。
- name: 合规平替
  desc: 作者定义的一个核心选品方向，指通过成本较低的材料或产品，还原高端明星产品或高端材质的核心体验（90%），但价格仅为原品的五分之一甚至更少，从而同时解决流量和转化问题。
  is_original: true
  excerpt:
  - 合规平替不仅可以平替具体明星产品，也可以平替高端材质，这两种做产品的方向都是自带流量的，因为明星产品和高端材质，是有相应的搜索流量的。
  - 具体标准就是要达到原产品的客户体验的 90%，但是价格只有五分之一甚至更少。
  - 合规平替是一个适用绝大部分类目的宝藏选品方向，因为它既有流量捷径，也有转化捷径。
- name: 空壳品牌
  desc: 一种品牌策略，指通过抢注国外知名品牌（未在该类目注册的）或策划一个虚构的外国品牌故事，来快速获得品牌溢价、信任和复购，是选品模式中的一种“加光环”操作。
  is_original: true
  excerpt:
  - 我们还给他们起了个名字，叫做空壳品牌。这也是一种选品模式，虽然只有特定的窗口期。
  - 1.抢注国外品牌，并复制它的全系产品（例如 koolaburra 已被 ugg 收购） 2.抢注国外品牌，并跨类目做新类目产品（速卖通常见套利玩法） 3.在国外注册品牌，策划国外的品牌故事和品牌形象（国内电商常见品牌捷径）
- name: 微创新
  desc: 作者建议新手采取的差异化策略，其本质是“不创新”，不追求原创设计或痛点迭代，而是基于大标品进行材质升级和热点嫁接式的差异化，以获得更长的红利期。
  is_original: true
  excerpt:
  - 微创新其实就是不创新。
  - 新手做差异化，不要去考虑原创设计，痛点迭代，这些方向没有专业积淀，很难拿到成功确定性，新手适合基于大标品，去做升级式的和热点嫁接式的差异化产品。
- name: 材质套利
  desc: 一种具体的微创新和差异化实现方式，通过使用更低成本的原材料（如二层皮替代头层皮）来还原高端材质（如真皮、Gore-Tex）的体验，从而获得巨大的成本优势和利润空间。
  is_original: true
  excerpt:
  - 我们比较推荐新手去做的微创新差异化套路是：材质套利，是上文材质平替的一个延申。
  - 材质升级：帆布升级到真皮 平替套利：头层皮换成二层皮，成本下降三分之二。
methods:
- name: __overview__
  desc: 作者独创的“四步打造一个百万爆款”选品范式，是“选品四层方法论”的微缩版。该方法论通过从市场到产品的四个步骤，系统性地满足选品在控制风险、杜绝自嗨、长红利期和规模复制四个层面的要求。
  excerpt:
  - 本文将选品从底层往上分为四层：1.套利 2.流量&转化 3.模式 4.品&品类。
  - 本文通过描述一个四步选品范式，来带大家感受一下这个 4 层结构是如何被满足的。
  - 第一步【找蓝海】、第二步【走捷径】、第三步【加光环】、第四步【微创新】
- name: 第一步【找蓝海】
  desc: 该方法指导选品者通过筛选“蓝海市场”和“蓝海平台”，并进一步定位带有精准搜索流量的“蓝海方向”（如通过海关壁垒、平台搬运、材质升级等），从而告别竞争激烈的红海市场。
  excerpt:
  - 第一步【找蓝海】：蓝海市场、蓝海平台、蓝海产品方向
  - 只要你有选蓝海市场蓝海平台的意识，你就已经超过了 90%跨境小白和新手。
  - '"海关壁垒"算一个，还有"平台搬运"、"材质升级"等等。'
- name: 第二步【走捷径】
  desc: 该方法通过“合规平替”或“合规山寨”的模式，直接对标拥有巨大搜索流量的明星产品或高端材质，同时解决流量和转化问题，以极致的性价比和精准的词布局获得优势。
  excerpt:
  - 第二步【走捷径】：流量捷径、转化捷径
  - 好的选品，在确定具体产品的时候，就已经确定引流方法，和转化方法（卖点）。
  - 即好的选品模式，必须把流量和转化，解决一个，或者两个都解决。
  - 只要产品合规，有自己的品牌，在亚马逊是可以大胆投放竞品品牌的关键词广告的。
- name: 第三步【加光环】
  desc: 该方法通过构建“空壳品牌”（如抢注国外品牌、策划国外品牌故事），为产品快速赋予品牌力、溢价能力和复购价值，是一种低成本获取信任和品牌背书的捷径。
  excerpt:
  - 第三步【加光环】：快速获得品牌力、溢价、复购
  - 我们做一个日本品牌，在东欧做一个日本品牌，在美国做一个欧洲或者日本品牌，这都是可行的，本土客户查不到，故事随便你说。
  - 成功的空壳品牌，可以做到 10%的复购，可以带来的净利提升最多可以达到 30%。
- name: 第四步【微创新】
  desc: 该方法倡导在选品和运营确定的基础上，通过“材质套利”等微创新方式（如升级材质+平替+热点嫁接）进行产品差异化，以打造护城河并延长产品的红利期。
  excerpt:
  - 第四步【微创新】：获得更长的红利期
  - 我们比较推荐新手去做的微创新差异化套路是：材质套利，是上文材质平替的一个延申。
  - 新手适合基于大标品，去做升级式的和热点嫁接式的差异化产品。
theorems:
- name: 选品即运营，运营的核心是流量与转化
  desc: 核心主张：选品过程本身就决定了引流方法和转化卖点，好的选品必须提前解决流量、转化中的一个或两个，而不是分离地看待选品和运营。
  excerpt:
  - '"七分选品，三分运营"？'
  - 我们认为选品就是运营，运营要解决的问题主要就是两个：流量，转化。
  - 好的选品，在确定具体产品的时候，就已经确定引流方法，和转化方法（卖点）。
  - 即好的选品模式，必须把流量和转化，解决一个，或者两个都解决。
- name: 追求确定性，而非彩票
  desc: 核心主张：成功的生意人追求确定的、可持续的赚钱模式，而不是依赖偶然爆单或一夜暴富的运气；新手不应沉迷于“货找人”流量下的彩票逻辑。
  excerpt:
  - 成功老板都是抓确定性，只有韭菜财迷爱抓彩票，我接触的大卖，没有一个主战场在 tk。
  - 大力出奇迹，每天上 100 个视频，我要 all in~~你的时间不值钱?你 all in 一个月好好打工一万块赚不到?你这样做 tk 跟赌有啥区别?
- name: 平台选择的底层判断依据
  desc: 核心主张：评估一个平台或一种打法的好坏，不应听信他人片面之词，而应基于“流量”和“转化”两个底层逻辑去自行判断，任何不解释底层逻辑的“推荐”都可能是镰刀。
  excerpt:
  - 听谁的?听自己的!终究要自己懂底层判断依据:1.流量 2.转化。
  - 所以说好做，说不好做都对，听谁的?听自己的!自己要懂底层判断依据:1.流量 2.转化。
  - 要让其知其所以然。讲不出所以然的，大概率镰刀。
- name: 新手应避开低价平台
  desc: 核心主张：面向价格极其敏感人群的低价平台（如虾皮、速卖通、Temu），通常无法支撑蓝海选品所需的利润空间，新手应优先选择有客单价和利润空间的国家和市场。
  excerpt:
  - 低价平台。
  - 这两个平台的卖家，都比我厉害，因为我算来算去他们都是亏的。
  - Temu 也是低价平台，也不建议新手入。
  - 不蓝的：所有低价平台
findings:
- name: 合规平替模式的定价与利润空间
  desc: '[evidence] 该案例展示了通过合规平替模式，在发达国家市场可以打原价的十分之一的价格，同时保持高净利润，例如“好的平替，可以打原价的十分之一的价格，净利润还有
    200 人民币以上”，且客单净利可超百元。素材中以冲锋衣+goretex 平替产品为例，显示其以39.99美元的价格在100-200美元客单的首页SKU中形成鹤立鸡群的比价优势。'
  excerpt:
  - 好的平替，可以打原价的十分之一的价格，净利润还有 200 人民币以上。
  - 但同一套蓝海打法，跑到虾皮毛利润没有，在亚马逊仍然可以客单净利 100 人民+。
  - 它虽然不是 goretex 的，但是搜索 goretex 它会展示，它功能相同，它足够便宜。...39.99 的它鹤立鸡群。
- name: 空壳品牌的溢价与复购效果
  desc: '[evidence] 作者根据个人经验断言，成功的空壳品牌能带来显著的财务回报，即“成功的空壳品牌，可以做到 10%的复购，可以带来的净利提升最多可以达到
    30%”，并列举了日本乐天、速卖通等平台的战术案例（如垄断JEEP、骆驼鞋服销售）。这属于经验性结论，没有提供系统性的数据表格支撑。'
  excerpt:
  - 按我们的经验来看，成功的空壳品牌，可以做到 10%的复购，可以带来的净利提升最多可以达到 30%。
  - 我们在日本长期垄断了这三个品牌鞋服的销售，我们还给他们起了个名字，叫做空壳品牌。
  - 上文提到的我们在速卖通能做到客单净利润 100+的产品，就是这个模式出来的。
- name: 海关壁垒发现的蓝海案例
  desc: '[evidence] 作者通过筛选日本海关关税信息，发现真皮制品关税极高，导致价格体系未被破坏，形成了长久的蓝海。这属于一个具体的发现案例，其筛选数据的过程和细节在作者第一篇精华帖中，本素材是引述结论。'
  excerpt:
  - 我们通过筛选日本海关关税信息，发现真皮制品在日本的关税非常高...价格体系没有被打破过。
  - 比如真皮的靴子，日本人普遍认为应该卖到 100 多美元以上，而中国工厂出厂价格有的仅有几十人民币。
  - 这就是一片广阔的蓝海选品大方向。
- name: 对TikTok流量红利期的判断
  desc: '[claim] 作者基于对TikTok“货找人”流量本质和当前投放ROI不稳定的观察，宣称“成功老板都是抓确定性，只有韭菜财迷爱抓彩票”，并断言“我接触的大卖，没有一个主战场在
    TK”，暗示TikTok并非当前跨境卖家的主阵地。'
  excerpt:
  - tk 又是个跟 fb 一样"货找人"的流量性质，算了，洗洗睡吧
  - 但目前结合 tk 广告一级代理商的数据来看，tk 广告投放的 roi 极不稳定，即使付费玩家盈利的也不多。
  - 成功老板都是抓确定性，只有韭菜财迷爱抓彩票，我接触的大卖，没有一个主战场在 tk。
- name: 独立站模式的更迭
  desc: '[claim] 作者观察到曾经主流的fb+shopify杂货铺模式已经消亡，而“人找货”流量（如SEO、Google Shopping）结合蓝海选品的玩家目前更容易赚钱，称“杂货铺基本都是靠
    fb 测爆款模式，本质上…只是铺货形式...”，这部分属于行业观察和主观判断。'
  excerpt:
  - 目前还活着的是品牌出海站、垂直站、定制站。
  - 两三年前顾小北强烈推荐的 fb+shopify 模式，现在也只能偃旗息鼓。
  - 这部分独立站玩家目前是容易赚钱的。
