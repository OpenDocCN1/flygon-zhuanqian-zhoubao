paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
desc: 该素材是短视频赛道创业者俊达（热浪）基于自身从0到1搭建短视频团队的实战经验，系统梳理了抖音IP矩阵打造的方法论。内容涵盖变现产品梳理、团队搭建、IP打造流程（定位、选题、文案、拍剪、复盘）、看好的赛道以及20条实战心得，核心主张是后端变现效率决定项目成败、团队能力决定账号上下限、标准化流程决定规模复制。素材原创性地提出了'留存坏点'概念、'剪辑→运营→项目经理'的人才成长路径、爆款文案的'钩子开头+内容框架+钩子结尾'结构等观点。
concepts:
- name: 观众缘
  desc: 指出镜人带给观众的舒适感和匹配度，不只是好看，还必须与赛道/IP调性契合，是短视频能否爆火的最重要因素。
  is_original: false
  excerpt:
  - 观众缘，不只是观众看的舒服，还得匹配。你让个小姑娘讲中医变现一定不好。
- name: 留存坏点
  desc: 作者自创的词，指视频播放过程中某一秒观众人数骤降的节点，用于复盘定位导致流失的具体话、场景或动作。
  is_original: true
  excerpt:
  - 留存坏点（哪一秒人数骤降，我们自己造的一个词），我们不能只看什么文案、什么方法能留住人，还需要不断的复盘去找到什么话、什么场景、什么动作会掉人，然后再把这个话、文案砍掉。
- name: IP手（聊天手）
  desc: 面向创始人/专家做IP孵化时新增的岗位，核心工作是了解IP、与IP沟通、不断挖掘IP可表达的内容。
  is_original: true
  excerpt:
  - 如果你是面向创始人/专家做IP孵化，那工作岗位还得加个IP手（聊天手），工作内容核心是了解IP、和IP沟通、不断挖掘IP可以表达内容，核心考核指标和运营对齐。
- name: 变现效率
  desc: 指后端变现体系对单位流量的变现能力（如单个客户贡献毛利），作者认为这是抖音IP项目成败的真正决定因素。
  is_original: false
  excerpt:
  - 抖音是开卷考试，前端内容一定是趋同的，而真正决定了项目成败的，是我们的后端变现效率。
- name: 泛兴趣产品（低客单价0-50）
  desc: 指书单号、低价知识付费等客单价低但面向大流量人群的产品，适合通过短视频带货直接成交。
  is_original: false
  excerpt:
  - 一种是低客单价（0-50）的泛兴趣产品（比如书单号，低价知识付费课程）
  - 因为客单价低，所以一定要选择大流量，高转化率产品，比如书单号，比如揭秘人性的厚黑学，产品针对的用户人群规模在1亿+
- name: 精准痛点产品（高客单价1000+）
  desc: 指高考志愿填报等客单价高但解决精准刚需的产品，成交路径为直播间直接转化或引流私域成交。
  is_original: false
  excerpt:
  - 还有一种是高客单价（1000+）的精准痛点产品（比如高考志愿填报）。
  - 对于高客单价产品，通常有两种成交路径，一种是直播间直接转化，一种是引流私域成交。
methods:
- name: __overview__
  desc: 整体方法论是从变现产品梳理出发，确定商业定位，再配以（演员/运营/剪辑/IP手/项目经理）团队结构，用标准化内容生产流程（定位→选题→文案→拍剪→复盘）实现规模复制，核心是强调'用流程能规模复制'。
  excerpt:
  - 我把自己关于如何打造短视频IP矩阵的理解，梳理了出来，主要分为5个部分...如何梳理变现产品、如何打造短视频团队、短视频IP打造流程、我看好的抖音IP赛道、20条抖音IP实战心得
- name: 变现产品选择与成交路径设计法
  desc: 根据客单价高低选择两类变现产品（低客单泛兴趣/高客单精准痛点），并匹配对应成交路径：超低客单走短视频带货，高客单走直播间转化或引流私域（低转高打法）。
  excerpt:
  - 什么样的变现产品适合做IP呢？我认为有两种：一种是低客单价（0-50）的泛兴趣产品...还有一种是高客单价（1000+）的精准痛点产品
  - 对于超低客单价兴趣产品，可以通过短视频带货直接成交
  - 一种，直播间直接成交的高客单产品，需要用户对于IP有非常强的信任
  - 第二种，引流私域成交的路径，需要低转高打法，前端卖低价产品，后端再往几千块上万块导流
- name: 行业冠军联营打法
  desc: 通过筛选行业冠军（当地最大机构）作为合作对象，用冷电话+见面洽谈达成联营合作（服务费+项目分成），借其预算、背书和完整变现体系放大抖音流量。
  excerpt:
  - 所以就搜、找朋友问，哪家机构是我们当地最大的，也就是行业冠军，然后企查查、boss直聘查老板电话，直接一个cold call打过去，也很顺利，约见面两次后，谈成联营合作，每月的服务费+项目分成
  - 行业冠军的好处就是有预算、有背书、变现体系完整，这种是更适合抖音放大的好企业。
- name: 剪辑→运营→项目经理人才培养路线
  desc: 针对市面上好运营难招而剪辑好招的现状，提出只招剪辑、筛选灵性者向运营培养的团队搭建方案，由老人或自己先下场跑通流程再复制。
  excerpt:
  - 那么只招剪辑，筛选优秀人才往运营方向培养，是不是可行呢？我测试，完全行得通。
  - 1. 刚开始，让懂业务的团队老人或者自己下场做运营 2. 搭建初步内容生产流程 3. 招1-2个剪辑，跑2-3个账号实践 4. 找最灵性的剪辑，逐渐培养成运营
    5. 循环3-4
  - 人才成长路线：剪辑 -> 运营 -> 项目经理
- name: 定位流程（竞品调研-定位缺口-定位细节）
  desc: 花2-3天完成三件事：做竞品调研（数量/时长/营收/定位/形式），找商业+内容定位缺口（先商业后内容），再做定位细节（IP或演员、简介、头像、选题、模板、抖+预算）。
  excerpt:
  - 第一件事，竞品调研...这个行业在抖音有多少竞品？这个行业竞品做了多久？最近赚了多少钱？他们定位是什么？不同在哪？内容形式是啥？我们能不能抄/超？
  - 第二件事，找定位缺口。先想商业定位，然后再想内容定位。
  - 第三件事，做定位细节。这时候围绕商业定位，我们会做细节的梳理。比如要IP还是要演员，简介、头像、选题的规划、内容的基本模板、抖+的预算等等。
- name: 选题流程（对标-选题库-评分）
  desc: 用抖音热点宝找对标账号，用自研系统一键整理对标爆款视频转文字归纳选题库，再对选题按多个维度评分，评分高的优先发布。
  excerpt:
  - 收集对标账号...通过抖音自己出的热点宝的热门账号功能
  - 收集对标账号的爆款视频，搭建选题库...可以实现一键整理对标账号的视频。看到不错的就保存下来转文字，然后归纳汇总
  - 选题加到选题库后，我们会对选题进行评分，评分高的先发
- name: 文案流程（对标素材库+爆款开头句式）
  desc: 先批量找顶级高赞对标素材（跨领域找对标），撰写时要求每个开头都复制10w+点赞爆款句式结构，最优结构为'泛流量开头+漏斗型观点+引导结尾'。
  excerpt:
  - 绝大多数内容质量的问题，都可以用调研更多竞品来解决
  - 写文案最重要的就是开头，重要性占比70%以上
  - 开头一定要复制爆款开头的句式结构，我要求我们运营写的每一个开头，都要找到对应的爆款对标（点赞10w+）
  - 我们自己测一篇文案最好的结构就是：泛流量开头+漏斗型观点+引导结尾，也可以理解为钩子开头+内容框架+钩子结尾
- name: 复盘流程（核心数据指标法）
  desc: 通过5秒完播率、总体完播率、留存坏点三个核心指标定位问题（开头场景/文案结构/流失点），数据OK后再投放，高客单建议用约5000预算慢投一个月搭建基础粉丝模型。
  excerpt:
  - 5秒完播率不行：开头、场景的问题
  - 总体完播率不行：文案结构、剪辑、场景的问题
  - 留存坏点（哪一秒人数骤降）
  - 看到数据ok后，再去投放。我们目前起号大概5000预算，投到基础粉丝模型搭建完毕就可以（一般能上万粉），周期一个月左右。
  - 不要做什么7天、14天起号，粉丝模型会搭建的太泛了的，慢慢投
theorems:
- name: 后端变现效率决定项目成败（流量成本上升论）
  desc: 抖音前端内容趋同且流量成本越来越高，当单客毛利高时可将获客成本拉高从而碾压对手，所以后端变现效率是成败决定因素。
  excerpt:
  - 抖音是开卷考试，前端内容一定是趋同的，而真正决定了项目成败的，是我们的后端变现效率。
  - 同样的减肥粉，别人设计好了完善的变现体系，一个客户可以贡献1000块的毛利，而你只能做到500块，那么别人就可以通过投放，通过矩阵，把获客成本拉到900块
  - 抖音的流量成本一定是越来越高的，当你ROI算不过来的时候，你就不敢放预算
- name: 短视频爆火要素优先级：观众缘>表现力>文案>场景>剪辑
  desc: 决定短视频IP能否爆火的因素按权重排序，观众缘（含匹配度）和表现力远重于文案、场景、剪辑。
  excerpt:
  - 观众缘 > 表现力 > 文案（选题 > 开头 > 结构 > 结尾 ）> 场景 >剪辑
- name: 创始人IP是坑
  desc: 大部分老板专业程度不足以弥补表现力差距，且老板时间值钱无法全力投入，因此创始人IP从商业效率上不如找演员/专业主持人出镜。
  excerpt:
  - 大部分老板的认知还是说要做创始人IP，但从我们经验，创始人IP真的是个坑。
  - 一方面，大部分老板的专业程度，不足以弥补在表现力上的差距；另一方面，老板本身时间比较值钱，没有办法全力all in在抖音流量端。
  - 从商业效率角度，比创始人自己出镜或者签约专家老师效率更高。
- name: 盈利短视频团队最重要的是不下牌桌的能力
  desc: 团队真正能盈利的关键不是内容能力，而是人不断层、业务不因单个IP或运营退出而停滞的持续运营能力。
  excerpt:
  - 我认为一个真正能盈利的短视频团队，最重要的不是什么内容能力，而是不下牌桌的能力。
  - 人不断层，不会因为一个IP，一个运营退出不干，而让业务停下来了。
- name: 流程决定规模复制（经验不易浪费论）
  desc: 内容营销团队最大的浪费是经验的浪费，必须靠标准化流程把探索出的方法积累下来才能放大业务。
  excerpt:
  - 内容营销团队，最大的浪费根本不是人才、时间，而是经验的浪费。
  - 没有好的流程，内容营销团队积累、探索的内容方法没办法积累下来，这个业务就根本没办法放大。
  - 我相信用流程能规模复制。
- name: 先商业定位再内容定位
  desc: 做短视频必须优先确定商业变现（变现产品），再考虑内容打法，定位缺口本质是卖法缺失而非单纯内容差异。
  excerpt:
  - 先想商业定位，然后再想内容定位。
  - 梳理一下竞品的变现产品，看他们的内容打法，然后找到变现产品的缺口。
  - 做短视频，先做商业定位，再做内容定位。（心得14）
findings:
- name: 高考志愿账号2个月精准涨粉10万+
  desc: '[claim] 作者宣称其高考志愿号两个月精准涨粉10万+且私信爆满，印证了高客单+行业冠军联营打法的有效性，但无后台数据截图佐证。'
  excerpt:
  - 两个月，高考志愿号精准涨粉10万+，私信爆满。
- name: 抗衰视频单条导流300个干细胞客户
  desc: '[claim] 作者宣称一条讲抗衰的视频给后端导流300个干细胞客户，作为高客单内容变现效率的例证，为单案例陈述无多组对照。'
  excerpt:
  - 一条讲抗衰的视频，给后端导流300个干细胞客户。
- name: 垂类账号千粉变现六位数
  desc: '[claim] 作者宣称垂类账号实现千粉变现六位数，用以支撑''流量不在多大而在于后端变现效率''的论点，为典型个案。'
  excerpt:
  - 垂类账号千粉变现六位数。
- name: 成熟爆款开头结构使新号5秒完播率达50%+
  desc: '[claim] 作者宣称采用复制爆款句式结构的开头后，基本新号5秒完播率能到50%以上，作为开头重要性70%论点的经验支撑。'
  excerpt:
  - 比如我们现在做的开头，基本新号5秒完播率能到50%以上。
- name: 单条文案可整合20个精准高赞对标视频且耗时约20分钟
  desc: '[claim] 作者宣称自研关键词拓展、批量搜索转文字工具后，一篇文案可整合约20个精准高赞（2-50w赞）对标视频，耗时约20分钟，作为''调研更多竞品解决问题''的支撑，系其团队工具实践数据。'
  excerpt:
  - 最终一篇文案，差不多有20个非常精准的高赞（2-50w赞）的对标视频可以直接借鉴，所花费的时间可能也就20分钟。
- name: 剪辑岗招聘供给充足而优质运营稀缺
  desc: '[claim] 作者声称在二线城市招不到完全对口的人、MCN朋友反馈好内容运营难招，而剪辑岗位boss直聘开岗私信会爆掉，此发现支撑''只招剪辑培养成运营''的团队方案，基于作者及同行经验。'
  excerpt:
  - 我在二线城市做抖音，在市面上招不太到完全对口的人。同时我也问了下身边做MCN朋友，大家普遍反馈是好的内容运营非常难招。
  - 但是剪辑，这个岗位，非常好招，boss直聘开个岗位私信会爆掉。
- name: 创作者踩坑：创始人出镜直播场次跟不上浪费至少几十万流量
  desc: '[claim] 作者宣称高考项目中让创始人出镜后，因创始人时间有限、直播场次跟不上，浪费了至少几十万流量，反证''创始人IP是坑''与''用演员替代''的主张。'
  excerpt:
  - 我们在这上面就踩坑了，当时和高考这个项目合作，就是让创始人出来做的，后面创始人时间有限，直播场次跟不上，浪费了很多流量（至少几十万的钱钱）。
