  excerpts:
  - 终归还是要靠视频给直播间带流量。所以我后面都是看有没有视频在跑，或者就是按群里说的，有新视频破万了就去播。
  - 视频没有在跑，就没必要直播了。
  - 事实证明确话术和样品还是很有有必要的，因为第三天直播的时候，我发现虽然还是基本没人互动，但是提示去购买的次数明显增加了。
  - 我就去抖音看直播，这一看就看了两个小时……一个手机看直播，一个手机录音，然后电脑上打字记话术。
  - 话术弄完了就去买样品，既然要直播，那肯定还是要有样品展示的。
