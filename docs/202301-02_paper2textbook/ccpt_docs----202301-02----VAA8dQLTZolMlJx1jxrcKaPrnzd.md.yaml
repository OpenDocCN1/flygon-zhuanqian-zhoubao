desc: 该素材是增长女黑客阿may在生财有术社群的一次分享逐字稿，围绕"无资源无资本如何搞定冷启动流量"这一核心问题，提出了三条路径：重新理解微信好友（从关注客户数转向客户质量和复购）、无资源起盘获取第一批客户（公域内容引流、社群群红、抱大腿三种借流量方法）、以及通过裂变撬动铁杆粉丝放大用户池（团队裂变与用户裂变两种模型及战队PK叠加玩法）。素材以个人操盘6个项目、陪跑12个企业、辅导上万学员的经验为背书，强调私域的本质是长远而忠诚的客户关系，并给出了多个可复制的操作框架与实战案例。
concepts:
- name: 私域的本质（长远而忠诚的客户关系）
  desc: 私域运营的核心不是追求客户数量，而是建立有信任度、有粘性的长远客户关系，用户与企业应彼此了解、互为朋友甚至互为客户。
  is_original: false
  excerpt:
  - 私域的本质，是长远而忠诚的客户关系！
  - 什么样的关系才能长远而忠诚？不是只有用户了解你，而是我们彼此了解！
  - 把用户当朋友，关系才能更紧密！
  - 相互彼此互为客户，更能长久
- name: 个人品牌的差异化身份
  desc: 个人品牌的本质是一种差异化的身份标签，通过强化某一领域的标签（如"营销圈里最懂投资，投资圈里最懂品牌营销"）来获得流量和信任，是普通人起盘最好的切入口。
  is_original: false
  excerpt:
  - 所以她就要强化她在品牌营销上的标签，这样一来，她就是营销圈里最懂投资的，是投资圈里最懂品牌营销的，这就是一种差异化的身份。
  - 这种差异化的身份可以帮助到她获得流量。而且这种获得流量的方式其实是几何倍数的速度。
  - 我认为，垂直行业的专家也将会是普通人，做个人品牌最好的切入口！也是我们普通人起盘最好的切入口！
- name: 群红（社群红人）
  desc: 相比在公域平台做"网红"，普通人做个人IP最好的起盘方式是成为社群里的"群红"，在几百人的有限竞争社群中展示特点、建立信任、获得铁杆粉丝。
  is_original: true
  excerpt:
  - 我认为，普通人做个人IP最好的起盘方式，不是去做抖音、小红书、知乎、公众号等，而是扎扎实实地做好社群的群红
  - 社群的群红是有限竞争！
  - 不要一开始就把自己定位要去做"网红"，而是想办法让自己变成"群红"！
- name: 抱大腿（借势营销）
  desc: 通过与牛人、行业领袖和权威平台建立链接和合作（而非靠金钱交换），借助他人势能获取流量与背书，两个层面是：抱行业的大腿（站对风口）和抱行业里有影响力的人的大腿（找准贵人）。
  is_original: false
  excerpt:
  - 人生不要只靠自己傻傻奋斗，一定要有老师，一定要有贵人，否则没有任何机会成功
  - 1、要抱行业的大腿 （站对风口） 2、要抱行业里有影响力的人的大腿（找准贵人）
  - 抱大腿不能靠钱去换……靠什么去交换呢？你要去创造资源、创造价值！
  - 正所谓"你不牛逼，认识在再多牛逼的人也与你无关"，抱大腿一定要提供可交换的价值
- name: 知识营销（内容化引流）
  desc: 通过推广产品相关的知识来吸引精准客户，将营销内容化（变成"分享"、"硬核干货"），尤其适合需要长时间决策的高客单价产品，属于被动引流方式。
  is_original: false
  excerpt:
  - 现在呢，比较流行的是什么？去推广你这个产品的知识，通过知识吸引到你的精准客户。
  - 传统销售是主动销售，就是发硬广……而知识营销是被动引流，他们会把自己的营销内容化，变成"分享"、变成"硬核干货"
- name: 销售额三要素公式（客户数×客单价×购买频次）
  desc: 销售额等于客户数、客单价、购买频次的乘积，三者同等重要，但以往从业者往往过度关注客户数而忽略了客单价和购买频次（复购比拉新更重要）。
  is_original: false
  excerpt:
  - 计算销售额有条公式：销售额=客户数×客单价×购买频次
  - 以往的我们，都太过关注客户数这个指标了，而大大忽略了客单价和购买频次，根据销售额公式可以看到，购买频次和客户数、客单价一样重要！
  - 企业营收也有28原则，20%的客户给你带来80%的利润，复购比拉新更重要！
methods:
- name: __overview__（无资源冷启动流量方法论）
  desc: 一套覆盖品牌起盘期与发展期的流量获取整体方案：起盘期通过个人品牌+公域内容引流/社群群红/抱大腿三种方法获取第一批客户；发展期通过裂变营销杠杆放大流量池；有钱时投放作为更有效率的放大器。
  excerpt:
  - 总得来说，如果你目前属于起盘阶段，那么你可以通过做个人品牌，然后结合公域内容引流、社群打造个人影响力、抱大腿借势营销这三种方法，获取第一批客户。
  - 如果你属于发展期，那么可以借助裂变营销这种杠杆营销玩法放大你的流量池。
  - 当然，如果有钱的话，投放是一种更有效率的放大器
- name: 借流量三法（公域平台内容引流 / 群红 / 抱大腿）
  desc: 无资源无资本时从0积攒第一批客户的具体方法：①将内容发布到视频号、公众号、知乎、小红书等自带流量的公域平台；②扎扎实实做好社群群红，在有限竞争的社群中建立信任和铁杆粉丝；③通过创造可交换的价值抱行业和牛人的大腿。
  excerpt:
  - 没有流量，那就去借流量。可以去哪里借？我认为非常有效的是以下三个地方：1、去公域平台…… 2、去当群红…… 3、去抱大腿……
  - 你还可以把内容换成多种形式去表达，从图文形式到音频、视频、图片不等……我有些文章，发布到自己的公众号，只有一两千的阅读，但是发布到人人都是产品经理的网站上，却有几万的阅读
  - 当细分到素描、吉他这一层时，你就会发现，再去寻找这样的社群，就容易多了！明确目标人群，是做销售、做推广的前提！
- name: 团队裂变模型（自上而下树状裂变）
  desc: 一种自上而下、有明确清晰的上下级推荐关系的树状裂变模型，常见于微商团队、经销商网络、社交电商等玩法，核心吸引力是"躺赚逻辑"——加入早、层级高者可享受被动收益。
  excerpt:
  - 第一种是团队裂变，这是一种自上而下的裂变模型……这个模型，是有明确清晰的上下级推荐关系的，常见的微商团队、经销商网络、社交电商等玩法，就是靠这种模型搭建起来的
  - 这种模型吸引人们参与的核心关键点，就是诱饵足够大：躺赚逻辑！
  - 只要设计好机制，保障终端能卖得出去货，靠这种模型，的确可以快速裂变。
- name: 用户裂变模型（自下而上网状裂变）
  desc: 一种自下而上、用户之间呈社交网络网状关系的裂变模型，讲究圈层效应，需针对不同人群设计不同玩法，包含口碑传播（无利益诱惑）和裂变营销活动（利益诱饵）两种形式。
  excerpt:
  - 第二种是用户裂变，这是一种自下而上的裂变模型
  - 用户与用户之间是社交网络的状态，ABCD之间有可能相互认识的，彼此关系是网状结构，不是树状结构
  - 用户裂变讲究的就是圈层效应，所以一般都是针对不同人群去设计不同的裂变玩法
  - 口碑传播，就是用户没有基于任何利益诱惑的前提下，就愿意帮你分享和传播！
  - 还可以用到的一种裂变形式，那就是举办裂变营销活动，通过利益诱饵的方式，促进我们的员工/渠道/老顾客帮我们分享。
- name: 战队PK玩法（用户裂变叠加团队裂变）
  desc: 在用户裂变营销活动玩法的基础上叠加一层"团队裂变"玩法（称为动销系统），以团队PK机制促使更多用户产生分享行动并持续分享，解决传统裂变在第三层断层裂变不动的问题。
  excerpt:
  - 我们会在用户裂变的营销活动玩法的基础上，还会叠加一层"团队裂变"的玩法，这种玩法我们称之为"战队PK"的玩法，也就是组织中的动销系统。
  - 大部分裂变营销活动策划者策划的活动之所以效果不好，往往最大的原因是在于，只有激发层的用户愿意分享，到了第三层裂变层，就断层了。因此就根本裂变不动！
- name: 产品结构设计（高客单价承接产品）
  desc: 在产品设计中一定要设置高客单价产品作为承接和站台产品，避免只有引流产品一个SKU而砍掉复购机会，可大幅增加利润并拉高品牌力。
  excerpt:
  - 只设置引流产品的价格，后面没有高客单价产品来做承接。实际上，只要你成交一个客户，他就有机会给你复购。所以如果你只有一个sku，相当于你把复购的机会直接砍掉了。
  - 所以，一定一定要设计一个高客单价产品，这样可以大幅度增加你的利润。而且有个高客单价产品在那里，就相当于是你的站台产品，一下子拉高你的品牌力。
- name: 增长饭局（线下深度沟通激活私域）
  desc: 一种线下关系建立方法：以纯利他心态举办小规模饭局，深入沟通用户并帮其解决流量难题，从而建立有粘性的信任关系、撬动高客单价合作。
  excerpt:
  - 今年我来到广州，只做了4场增长饭局，深入沟通了接近50人，就已经创造出了30万的业绩！
  - 而且因为对用户的深入沟通和了解，我们还搭建出了更多合作方式，从以往客单价几千块，到了现在客单价10万。
  - 我的增长饭局，为何现场满意度那么高？就是因为我抱着纯利他的心态，给每一个来到现场的朋友，想办法解决他们的流量难题
  - 更有不少朋友，因为看了我们增长饭局的流程，也引发了自己做饭局的想法
theorems:
- name: 有信任度、有粘性的好友远胜过泛泛之交
  desc: 私域成交的有效性并不取决于好友数量的多少，而取决于好友的质量（信任度与粘性），高信任度的少量好友带来的成交远高于大量泛泛之交。
  excerpt:
  - 这也是我今年来最大的转变之一，有信任度、有粘性的好友，远胜过泛泛之交。
  - 两组数据：我公司4万好友转化20人，我个人3万好友转化80人（成交4倍）；朋友800好友月成交超20万，另一朋友3万好友月成交仅5万（好友数近40倍，成交不足四分之一）。
- name: 普通人做个人IP最好的起盘方式是成为群红而非网红
  desc: 公域平台是算法筛选机制、无限竞争，普通人难以脱颖而出；社群群红则是有限竞争，在几十到几千人的社群中更容易展示特点和标签、建立信任并获得铁杆粉丝，更易复制。
  excerpt:
  - 我认为，普通人做个人IP最好的起盘方式，不是去做抖音、小红书、知乎、公众号等，而是扎扎实实地做好社群的群红
  - 如果我们只是去做公域，说实话，我们面临的竞争是无限竞争……如果你没有好的创新……那么你就很容易被别人赶超，淹没在人海当中……
  - 而做好社群的群红不一样，社群的群红是有限竞争！
  - 这种模式，很好复制，比去做抖音，要容易复制多了
- name: 抱大腿需以创造可交换价值为前提
  desc: 抱大腿不能靠金钱交换（大腿不缺钱），而要靠创造资源、创造价值，对于普通人而言练好一身本领（个人核心能力）是最好的方式，且有价值后大腿也会主动来结识你。
  excerpt:
  - 抱大腿不能靠钱去换，因为大腿不缺钱……那么，靠什么去交换呢？你要去创造资源、创造价值！
  - 对于普通人的我们来说，练好一身本领，就是最好的方式！
  - 只要你有价值，"大腿"也会自然主动来结识你的。
- name: 目标人群细分是找社群、做推广的前提
  desc: 找不到目标社群的根本原因是目标客户定位太泛，需将目标人群不断细分（如艺术→绘画→素描、油画；音乐→钢琴→吉他），细分到具体关键词才能找到社群，明确目标人群是做销售、做推广的前提。
  excerpt:
  - 这里面最大的问题，其实出在自己根本不知道目标客户是谁
  - 这种就是明显分不清楚自己目标客户是谁……你通过这两个关键词，是根本找不到社群的，没有人这么命名社群！
  - 当细分到素描、吉他这一层时，你就会发现，再去寻找这样的社群，就容易多了！
  - 明确目标人群，是做销售、做推广的前提！
- name: 裂变营销的核心在于让更多用户持续产生分享行动
  desc: 裂变营销活动的效果取决于有多少用户真正行动去分享，多数活动效果差是因为只在激发层用户愿意分享，到第三层裂变层就断层了，因此需要强有力的机制保障分享的持续发生。
  excerpt:
  - 在做裂变营销活动过程中，最重要的是有多少用户真正去行动帮你去做分享
  - 因为大部分裂变营销活动策划者策划的活动之所以效果不好，往往最大的原因是在于，只有激发层的用户愿意分享，到了第三层裂变层，就断层了。因此就根本裂变不动！
  - 那么，怎么样才能让更多人产生分享行动，并且有持续的分享行动呢？
findings:
- name: 私域好友质量决定成交效率（个人好友vs公司资源的4倍差距）
  desc: '[evidence] 以作者在418推广生财有术的亲身数据支撑：个人3万好友转化80人，公司4万好友仅转化20人，公司资源数量更多但成交仅为个人好友的四分之一，验证了"好友质量重于好友数量"的主张。'
  excerpt:
  - 在418推广生财有术时，我公司共有微信好友4万人，我的微信好友有3万人，基本都是私域增长从业者相关，但是我的微信可以转化80人，我公司的资源却只能转化20人，数量上我公司的资源其实更多，但是成交上我的好友却是公司资源的4倍！
- name: 小量高粘性好友的成交能力可远超大量普通好友
  desc: '[evidence] 朋友案例对比：800微信好友者月成交超20万元，3万好友者月成交仅5万元，好友数量相差近40倍但成交额不足前者四分之一，有力支撑"有信任度、有粘性的好友远胜过泛泛之交"的核心主张。'
  excerpt:
  - 我有一个朋友，他只有800个微信好友，每个月却能成交超过20万元，另外还有一个朋友，微信好友有3万人，但是每个月仅能成交5万元，在好友数量是前者将近40倍的情况下，成交额却不足别人的四分之一！
- name: 线下深度沟通（4场饭局50人）创造30万业绩并拉高客单价
  desc: '[evidence] 作者在广州只做了4场增长饭局、深入沟通接近50人，即创造30万业绩，且因深入沟通搭建出更多合作方式，客单价从几千块提升到10万，验证了深度沟通、纯利他心态对于私域转化与合作升级的价值。'
  excerpt:
  - 今年我来到广州，只做了4场增长饭局，深入沟通了接近50人，就已经创造出了30万的业绩！
  - 而且因为对用户的深入沟通和了解，我们还搭建出了更多合作方式，从以往客单价几千块，到了现在客单价10万。
- name: 活动裂变+战队PK裂变3天裂变近6000人、线下到场4000人并引爆秩序
  desc: '[evidence] 跨境电商峰会案例：通过活动裂变+战队PK裂变方式，3天内裂变近6000个用户参加线下活动，加上主办方助推最终报名累计1.8万人，到现场4000人，火爆到警察到场维护秩序、1万人场外听分享，验证了叠加战队PK玩法的裂变放大效果。'
  excerpt:
  - 通过活动裂变+战队PK裂变的方式，我们实现了3天内裂变近6000个用户参加线下活动，加上主办方的助推，最终活动报名人数累积1.8万人，到展会现场的有4000人，由于活动过于火爆，展会进行途中警察赶到现场维护秩序，还有1万人只能在场外听分享；
  - 在展会现场，我们通过精准洞察在场用户需求，我们一小时引流用户5000多人，还使用了冲榜裂变+群裂变的玩法吸引到1000多位新用户进入私域流量池
- name: 公域平台内容一次搬运可获数倍阅读量
  desc: '[evidence] 作者个人经验数据：同一篇文章发布到自己的公众号仅一两千阅读，但复制到人人都是产品经理网站则有几万阅读，支撑了"去公域平台借流量、好内容平台欢迎"的方法论主张。'
  excerpt:
  - 我有些文章，发布到自己的公众号，只有一两千的阅读，但是发布到人人都是产品经理的网站上，却有几万的阅读，而我在那里发布内容，其实很简单，就是把我公众号的内容，复制过去，稍微修改一下即可。
- name: 个人品牌起盘的实际效果（200好友获大咖主动链接）
  desc: '[evidence] 作者自述案例：做增长女黑客个人标签前微信好友仅200多人需投简历求职，打造个人标签后大量牛人大咖主动找上门介绍项目资源，验证了个人品牌带来流量与信任的双重作用。'
  excerpt:
  - 我在做增长女黑客之前，我的微信好友只有区区200多人，想要去找工作，恐怕还要去招聘平台投简历，但是当我做了增长女黑客这个个人标签之后，就有很多牛人大咖开始找到我，给我介绍各种项目、资源。
  - 一方面个人品牌给我带来了流量，另一方面个人品牌也帮我在与人交往的过程中，快速建立了信任。
