unsupported_claims:
- location: '43.3'
  claim: 流量价值公式为：流量价值 = 流量规模 × 交易相关性 × 信任度
  reason: 素材中仅提到'流量价值=流量规模*交易相关性*信任度'，未明确界定为公式定义，且P001中表述为定性框架而非定量工具，全书将其表述为核心定义与逐步推导，存在过度形式化风险
- location: '43.9'
  claim: 实时真实ROI公式：综合ROI = (直播间毛利 + 私域累计产值) ÷ 广告投入，其中私域进线人数 = 营业额/客单价 × 60%，私域月产值8-15元/人/月，前3月按80%衰减
  reason: 素材P001、P006中虽有类似算账逻辑，但参数（如60%进线率、8-15元月产值、80%衰减系数）为作者经验估算，非通用标准，全书将其表述为核心定义与逐步推导，存在将经验值泛化为标准公式的问题
- location: '43.10'
  claim: 捡漏群单群成本3500-10000元，回本周期2-3个月，回本后单群月利润约1000元，生命周期约2年，单群全周期纯利2.1万，ROI约3-4倍
  reason: 素材P001、P006中数据为作者团队实测案例（今年新起盘<1000群月佣100W+），非行业通用标准，全书将其表述为核心定义与推导逻辑，存在个案泛化风险
- location: '43.11'
  claim: 演员数量标准为30-50个/群，少于20难成氛围，演员行为脚本为：抢单→晒单→追问→催单，有演员与无演员社群产出相差≥1倍
  reason: 素材P001、P006中演员配置标准为作者经验总结，非平台规范或学术结论，全书将其表述为核心定义与推导逻辑，缺乏普适性支撑
- location: '43.16'
  claim: 财富积累四阶段：出卖劳动力(≤30岁)→一份时间多次卖(30-40岁)→购买他人时间(40-50岁)→钱生钱(50岁+)，依次跃迁不可跳跃
  reason: 素材P001、P006中为作者个人认知总结，且文中提到'不可跳跃是理想的线性路径描述，实际中部分人能通过特殊机遇部分跳跃'，全书将其表述为铁律，存在绝对化表述问题
- location: '43.23'
  claim: 超垂直个人IP四步路径：布局300-500长尾词→逐个写方案→多渠道发布→坚持更新，约1个月见效，3-5年长尾复利
  reason: 素材P009中为作者个人实操经验（发了<200篇内容，大半月不更新仍有咨询），非通用方法论，全书将其表述为核心定义与推导逻辑，存在幸存者偏差风险
- location: '43.24'
  claim: 产品Idea五种构思法按成功率排序：原生idea>抄竞品差异化>分析搜索词>预付费定制>生造idea，高成功率需满足：真实需求+专家身份+坚持到底
  reason: 素材P009中为作者个人观点总结，缺乏实证研究支撑，全书将其表述为核心定义与推导逻辑，存在主观经验标准化问题
- location: '43.25'
  claim: 平台电商四周期：铺货期→动销期→精细化期→玩趋势期，所有平台演进规律相通，可预判新平台红利窗口
  reason: 素材P009中为作者基于淘系/抖音历史总结的经验模型，文中提到'每个周期的时间长度因平台而异，需结合具体平台发展速度判断'，全书将其表述为核心定义与推导逻辑，存在确定性过强问题
