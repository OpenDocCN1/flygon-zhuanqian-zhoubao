learning_targets:
- 理解风口项目启动前先做三维定位（技术/变现/流量）的必要性
- 掌握用收益公式抽象化商业模式并定位核心增长变量的方法
- 学会拆解成本与收入的构成，判断差价生意的可行性
- 掌握蹭关键词SEO这一低成本精准获客手段及其边界条件
- 能复制一条从选型到变现的可跑通流水线，并理解其适用前提
- 理解风口生意的天花板在于能力沉淀而非项目本身
concept_map:
- AI绘画变现项目
- ├── 前置定位
- │   └── 三维定位（技术 / 变现 / 流量）  —— 定位错则方向迷失
- ├── 商业模式与公式
- '│   ├── 收益公式: 使用人次×（CPC单价−接口费用）−一次性投入'
- │   ├── 收入侧：广告CPC + 充值积分 —— 摊薄接口成本
- │   └── 成本侧：接口调用费 + 一次性部署 —— 可变成本随量
- ├── 流量获取
- │   └── 蹭关键词SEO —— 植入高指数词，98%流量来自搜索，主导性/长尾效应
- ├── 落地流程
- │   └── 四步走：选供应商→蹭SEO→开通流量主→自媒导流 —— 门槛低、可复制
- └── 本质与天花板
- '    └── 风口+运气 → 沉淀“项目感觉” —— 可迁移/复利/反脆弱'
life_analogy:
- 把做风口项目比作**去水库钓鱼**：
- '- **三维定位** = 先看自己带的是鱼竿（技术）、鱼饵（变现渠道）还是渔网（流量资源）——带错工具，再好的鱼群也与你无关'
- '- **收益公式** = 鱼获 = 下网次数 ×（每条鱼的市场价 − 捕捞成本）− 买渔具的钱——一眼看出关键在下网次数'
- '- **收入与成本拆解** = 算清楚鱼价是市场定的（广告CPC），买多少鱼饵（接口费）会随捕捞量增加'
- '- **蹭关键词SEO** = 在水流湍急的洄游通道（搜索框）下网，不用划船到处找鱼，鱼自己会游过来'
- '- **四步流水线** = 照着老渔民的作业流程走一遍，先借船（选供应商），再选好下网点，把网支好，等着收鱼'
- 就像有经验的老渔夫知道“鱼获的命门是下网次数”一样，作者也清楚“使用人次是唯一核心变量”。
summary:
- concept: 三维定位（技术/变现/流量）
  desc: 风口项目启动前的资源前置过滤器，三样至少占一样才值得动手
- concept: 收益公式
  desc: 用“量×差价−固定成本”抽象商业模式，一眼定位命门变量
- concept: CPC广告单价
  desc: 平台定价的刚性收入，波动空间小，只能靠堆量提升总收益
- concept: 充值积分
  desc: 隐藏的二次收入，能摊薄接口固定成本，是利润调节阀
- concept: 接口调用费
  desc: 随使用人次线性增加的可变成本，被广告收入盖过
- concept: 蹭关键词SEO
  desc: 在平台名称/简介植入高热度词，低成本获取精准搜索流量
- concept: 98%搜索流量占比
  desc: 实测数据证明SEO是本项目的命脉而非补充手段
- concept: 四步流水线
  desc: 选供应商→蹭SEO→开流量主→自媒导流的可复制启动路径
- concept: 风口天花板
  desc: 项目是风口+运气，长期护城河在于沉淀可复用的“项目感觉”
exercises:
- 'no': 1
  title: 模拟运行一次收益公式沙盘
  contents:
  - 假设你运营一个AI绘画小程序，已知：
  - '- 看一次30s广告的CPC单价为0.2元'
  - '- 接口调用费用为每次0.05元'
  - '- 一次性部署成本为3000元'
  - 问题：
  - 1. 若每日使用人次为10000次，日收益和月收益各是多少？
  - 2. 如果充值积分收入能摊薄40%的接口成本，新的月收益是多少？
  - 3. 若要实现月净收益5W+，每日至少需要多少使用人次？
  - 4. 当竞品涌入导致CPC跌至0.1元时，同样的使用人次下月收益会发生什么变化？
- 'no': 2
  title: 设计一次关键词SEO冷启动方案
  contents:
  - 假如现在是2024年，你想复制“蹭关键词SEO”的方法做一个AI数字人小程序：
  - 1. 你会选择哪个平台（小红书/抖音/微信）作为主阵地？为什么？
  - 2. 请用微信指数或百度指数工具，找出3个你判断为“当下热门”的潜在关键词
  - 3. 尝试为你的账号撰写一份包含这些关键词的“名称+简介”（不超过30字）
  - 4. 判断这些关键词的流量真实性——例如“AI数字人”是高频搜索词，还是仅在小圈子内被讨论？
- 'no': 3
  title: 编写一份三维定位自测清单
  contents:
  - 借鉴素材中“技术/变现/流量”三维定位法，为一个你感兴趣的风口项目（如ChatGPT、AI数字人、短剧推广）做定位分析：
  - 1. 技术维度：你会开发或会用相关工具吗？若不会，能否找到现成供应商？
  - 2. 变现维度：你是否有现成的变现渠道（如公众号流量主、私域社群）？
  - 3. 流量维度：你有多少粉丝？是否有内容生产能力？
  - 4. 综合判断：这份自测清单是否显示该项目适合你？如果不适合，请给出1-2条具体的资源补强建议（例如先积累100个精准粉丝）。
