units:
- 'no': 1
  name: 副业变现的底层逻辑 —— 从“看到”到“复制变现”
  points:
  - '**为什么需要这个概念？**'
  - '- 多数人做副业失败，是因为陷入“产品思维”，试图从零发明产品，却忽略了商业的本质是发现并复制已验证的模式'
  - '- 素材中三位作者（夕子、老杨、胖龟）的共同成功路径均是：拆解同行 -> 验证需求 -> 低成本复制 -> 放大'
  - '**核心定义**'
  - '- 副业变现的本质不是“做产品”，而是“解项目、算账、走流程”'
  - '- “后发制人”：利用已验证项目的成熟链路（流量、转化、交付），避开试错成本'
  - '**关键性质**'
  - '- 信息差即核心壁垒：你知道而别人不知道的“已验证路径”就是钱'
  - '- 复制优于创新：成熟商业模式“换汤不换药”，新客户群体不断涌现，十年前的项目今天依然可做'
  - '- 执行力可变现：持续的执行力本身具有经济价值，可被奖励（如宝妈加好友号被高价收购）'
  - '**典型例子**'
  - '- 夕子：从皮肤痛点出发，付费学习 -> 小红书爆款 -> 私域高客单 -> 自建品牌 -> 开放加盟，年利润百万'
  - '- 老杨：TikTok睡播，用简陋直播间跑通MVP -> 1+1+1项目矩阵（盈利/开发/知识付费）持续造血'
  - '- 胖龟：0中介费找房，用“蹭流截流”低成本获客 -> 城市合伙人制度标准化复制 -> 第一年104.7万营收'
  - '**边界条件**'
  - '- 仅适用于“已有人盈利且流出”的项目，纯科研型/硬核技术壁垒项目不适用'
  - '- 核心风险：平台规则变更导致流量链路失效（如抖音打击无人直播、引流），需持续关注平台红利窗口'
  - '- 认知前提：必须承认“商业英雄是平台红利的产物”，避免陷入“个人能力决定论”的幸存者偏差'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: origin
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: improve
  - paper: docs/202301-02/20230207_03.md
    role: improve
  - paper: docs/202301-02/20230207_05.md
    role: critique
  excerpts:
  - 成功的副业不是从零发明，而是发现、拆解并复制已验证的商业模式。用“后发制人”类比，让读者理解“抄作业”的合理性。
  - 商业项目拆解：不是模仿表面，而是拆出流量、转化、交付的底层链路。
  - 六维评估模型：流量效率、销转效率、交付效率、客单价、毛利率、复购率。
  - 多数情况下没有不赚钱的项目，只有不赚钱的人。凡是大一些的，能拿出来卖的项目就不会是一个纯坑。
  - 进化论是地球上唯一可靠的成功学。今天的小马宋，和一年前的小马宋已经不同了，因为 2022 我们的生存环境发生了变化，如果不能进化，我们就会被新环境消灭。
  - 执行力是值钱的，执行力是可以变现的。亦仁大概花了 7W 买了她坚持 4 个月加了 4000 多好友的微信号。
- 'no': 2
  name: 商业项目拆解 —— 把“赚钱的别人”拆成“可复制的零件”
  points:
  - '**为什么需要这个概念？**'
  - '- 盲目模仿表面（文案、封面）无法复制核心利润，必须拆解出“流量从哪来、转化怎么做、交付什么、利润怎么分”的底层链路'
  - '- 素材强调：同行是最好的老师，抄同行是避开弯路最快途径'
  - '**核心定义**'
  - '- 商业项目拆解：将一个成熟项目按“前端流量获取 -> 中端转化承接 -> 后端交付变现”三段式拆解，并量化关键指标（ROI、客单价、复购率）'
  - '- 核心口诀：定位即人群、人群即内容、内容即流量、流量即转化、转化即模式'
  - '**关键性质**'
  - '- 可迁移性：拆解出的“关键词搜索同行”、“以客户身份套话术”、“复刻SOP”可跨平台、跨品类复用'
  - '- 低门槛验证：通过“MVP先卖后做”（预售/聊100人看付费意向）在低成本下验证拆解链路是否通顺'
  - '- 信息差套利：A平台的烂内容优化后搬到B平台可能爆火（如抖音->小红书），渠道差异即利润空间'
  - '**典型例子**'
  - '- 胖龟找房：拆解传统中介“带看-成交”链路，改为“平台撮合-会员制”，把中介费转嫁给二房东（空置损失大），实现0中介费截流'
  - '- 小红书资料号：拆解同行“发半截资料引流 -> 私域转单9.9-199元”全流程，8人内测8人单日盈利300+'
  - '- 闲鱼倒爷：拆解“抵账/抵债/批量出”关键词找低价货 -> 闲鱼高价出 -> 赚差价，三案例验证可行性'
  - '**边界条件**'
  - '- 仅适用于“无绝对核心壁垒、标品/半标品、流程可SOP化”的项目'
  - '- 风险：平台风控收紧（如引流限制、违禁词）会切断流量链路，需建立“合规优先”与“多平台分发”兜底策略'
  - '- 核心判断：项目是否“货源非独家、场景验证有需求、流程可标准化”，三者缺一不可'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: improve
  - paper: docs/202301-02/20230207_03.md
    role: apply
  - paper: docs/202301-02/20230207_11.md
    role: apply
  excerpts:
  - 同行就是最好的老师，抄同行永远是做项目最快的途径，能避开多数弯路和无用功。
  - 每个项目都有关键词，通过关键词在各个推广渠道搜索这个项目的关键词就一定可以找到同行。
  - 我们以客户的角度去思考如果我想要买这个产品，我会在哪去搜关键词，自然也可以找到同行的流量渠道。
  - A平台的“烂内容”就是B平台的爆款。类比为“东边日出西边雨”。
  - 商业的本质是信息差。用“你知道而别人不知道的路径”类比，阐述为何中介费是伪概念、为何平台撮合能创造价值。
- 'no': 3
  name: 六维评估模型 —— 给项目算一笔“复制账”
  points:
  - '**为什么需要这个概念？**'
  - '- 面对海量副机会，缺乏统一度量衡导致决策拍脑袋；需要一套既能判断“可复制性”又能判断“收入天花板”的量化框架'
  - '- 素材明确提出：用“效率维度”判断可复制性，“财务维度”判断收入天花板'
  - '**核心定义**'
  - '- 六维模型：流量效率、销转效率、交付效率（效率三维）+ 客单价、毛利率、复购率（财务三维）'
  - '- 效率维度 = 单位投入产出比（时间/人力/金钱）；财务维度 = 单客全生命周期价值'
  - '**关键性质**'
  - '- 补偿机制：当效率维度有短板（如流量效率低），可通过提升财务维度（高客单价、高毛利、高复购）补偿，维持总收入'
  - '- 可复制性判据：三效率均高 = 极易复制（如小说推文）；效率低但财务高 = 适合个人IP/高客单（如项目拆解IP、知识付费）'
  - '- 核心公式：收入 = 流量 × 转化率 × 客单价 × 复购率 × 毛利率；六维即为该公式的六个可干预变量'
  - '**典型例子**'
  - '- 小说推文：高流量效率/高销转/高交付，但客单价低(~10元)、复购低 -> 天花板低(月入2万)'
  - '- 教育资料2.0/项目拆解IP：流量效率低，但客单价高(299-9999)、复购高 -> 天花板高(月入百万)'
  - '- 减肥食谱：交付效率中（需食谱更新），复购高（周期性复购），毛利高 -> 适合长线运营'
  - '**边界条件**'
  - '- 模型假设“流量可购买/可复制”，若平台彻底切断流量入口（如封杀品类），模型失效'
  - '- 难以量化“品牌资产/护城河”等长期非财务指标，需结合“母题/身份/观感”定性分析'
  - '- 适用于“已跑通MVP”的项目评估，不适用于“0到1创新”的早期探索阶段'
  sources:
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: origin
  - paper: docs/202301-02/20230207_03.md
    role: improve
  - paper: docs/202301-02/20230207_06.md
    role: improve
  excerpts:
  - 系统提出全书分析工具——六维模型：流量效率、销转效率、交付效率、客单价、毛利率、复购率。用“效率维度”判断可复制性，“财务维度”判断收入天花板。
  - 用六维模型逐个标注“小说推文”“教育资料1.0/2.0”“减肥食谱”等项目，演示模型的实际操作。揭示“客单价提升”如何改变项目量级。
  - 流量价值=流量规模×交易相关性×信任度。
  - 电商有个'客单价'的概念，而在私域流量运营的思维下，真正值得关注的不是'客单价'，而是'单客价'，就是一个消费者总共贡献了多少销售额。
  - 当效率维度中有一项低时，如何通过提高客单价、毛利率、复购率来维持收入。以“项目拆解IP低流量效率+高客单价”为例。
- 'no': 4
  name: 案例对比：小说推文 vs 教育资料 —— 为什么一个天花板低，一个能到百万
  points:
  - '**为什么需要这个概念？**'
  - '- 直观展示六维模型如何解释同类“内容变现”项目巨大的收入差异，帮助读者建立“选赛道比努力重要”的战略认知'
  - '- 素材以此为核心教学案例，演示模型实操'
  - '**核心定义**'
  - '- 通过六维雷达图对比：小说推文（三高效率、三低财务） vs 教育资料/知识付费（低流量效率、高财务指标）'
  - '- 核心洞察：客单价是改变项目量级的杠杆，10元客单价需10万单才能百万，1000元客单价仅需1000单'
  - '**关键性质**'
  - '- 小说推文：流量效率高(平台分发)、销转高(低决策成本)、交付高(自动发文)，但客单价~10元、复购近0、毛利薄 -> 单靠规模放大，极限月入2万'
  - '- 教育资料/IP：流量效率低(需精准搜索/私域沉淀)、销转中(需信任建立)、交付低(需人工/社群服务)，但客单价299-9999、复购高(课程/社群/咨询阶梯)、毛利>90%
    -> 单客价极高，百万级可达'
  - '- 补偿法则：教育资料用“高客单价+高复购”补偿了“低流量效率”，实现了商业模式闭环'
  - '**典型例子**'
  - '- 小说推文作者：日更拼命，月入1-2万天花板，想突破只能做矩阵号或收徒(收徒即转型教育IP)'
  - '- 夕子/龙哥/小懒：做项目拆解/副业培训/社群IP，客单价299-几万，复购率高(续费/升级/咨询)，年入百万级'
  - '**边界条件**'
  - '- 高客单价模式对“个人信任/专业度”要求高，新人冷启动难，需先做低客单价积累信任再升级'
  - '- 知识付费面临“交付效率低”瓶颈，规模化需SOP化交付（手册/录播/助教/社群运营），否则创始人成瓶颈'
  - '- 行业周期：小说推文红利期短(平台打击/同质化)；知识付费周期长(信任复利)，但竞争加剧需持续迭代内容'
  sources:
  - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
    role: origin
  - paper: docs/202301-02/20230207_03.md
    role: apply
  - paper: docs/202301-02/20230207_05.md
    role: improve
  excerpts:
  - 用六维模型逐个标注“小说推文”“教育资料1.0/2.0”“减肥食谱”等项目，演示模型的实际操作。揭示“客单价提升”如何改变项目量级。
  - 小说推文：流量效率高、销转效率高、交付效率高，但客单价低、复购率低 -> 天花板低。
  - 教育资料/知识付费：流量效率低，但客单价高、毛利率高、复购率高 -> 天花板高，能到百万。
  - 内容价值由低到高分为三层：给娱乐（情绪价值难变现）、给工具（实用性可引流）、给方法（打造个人IP壁垒最高）。
  - 依靠出租自己的时间是很难致富的，要想获得财富，就要充分利用杠杆效应。
- 'no': 5
  name: 本书框架预览 —— 从项目库到产品、运营、放大四部曲
  points:
  - '**为什么需要这个概念？**'
  - '- 读者需要全书宏观地图，理解各章节逻辑串联，避免碎片化学习；明确“学习路径建议”降低认知负荷'
  - '- 素材将全书逻辑串联为：建立项目库（选赛道） -> 开发最小产品（卖空气/软文先行） -> 流量与转化运营 -> 三大杠杆放大'
  - '**核心定义**'
  - '- 四部曲结构：发现与筛选（猎人建立情报库） -> 产品孵化（卖空气/软文先行/MVP验证） -> 流量收割与转化（软件营销派/套话做局/公转私） ->
    放大与变现（人力/技术/资源杠杆/全球化）'
  - '- 学习路径：新手先读第1-2章建立认知 -> 第3章低成本验证 -> 第4-5章跑通闭环 -> 第6章规模化放大 -> 第7章合规长期主义'
  - '**关键性质**'
  - '- 闭环思维：每章解决一个核心环节（选品、造品、卖品、放大），环环相扣'
  - '- 实战导向：拒绝理论堆砌，每章给出具体方法（喂养算法、卖空气、软文技巧、SOP、止损点、杠杆操作）'
  - '- 批判收尾：第7章专门反思“野路子”边界（安慰剂效应、侵权风险、平台规则、投机转投资），建立长期主义护城河'
  - '**典型例子**'
  - '- 第2章：喂养算法让平台成雷达，下拉词淘金，八步筛选法打分入库'
  - '- 第3章：软文先行（复述问题/超长文/过审），卖空气预售，非规范化生产(中文编程/周级MVP)'
  - '- 第6章：人力杠杆(SOP+兼职矩阵)、技术杠杆(RPA爬虫/批量搬运)、复购魔力(卖货转收徒)、全球化出路(免备案/免审核)'
  - '**边界条件**'
  - '- 框架假设读者具备基本互联网操作能力（注册账号、发视频、加微信、简单剪辑）'
  - '- 部分“野路子”手段（强制分享裂变、擦边软文、搬运伪原创）处于平台灰色地带，长期主义者需逐步转向合规白帽'
  - '- 全球化路径需解决收款(Stripe/PayPal)、合规(GDPR/当地法)、语言本地化等新挑战，非零门槛'
  sources:
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: origin
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  - paper: docs/202301-02/20230207_07.md
    role: extension
  excerpts:
  - 串联后续章节逻辑：建立项目库（选赛道）→ 开发最小产品（卖空气/软文先行）→ 流量与转化运营 → 三大杠杆放大。并给出学习路径建议。
  - 本书框架预览：从项目库到产品、运营、放大四部曲。
  - 战略既不是一朝一夕的事，也不是朝令夕改的事。战略，是三会一层要做的事。
  - 利他等于利己，越分享越幸运。
  - 从“投机”到“投资”：如何把副业沉淀为资产。建议读者将“卖空气”的验证思维应用于“真产品”的打造。
