unsupported_claims:
- location: ch10.14 (boundary)
  claim: 免费版影刀/其他RPA工具可能有并发数、运行时长、功能限制
  reason: 素材中未找到关于影刀免费版具体限制的详细参数
- location: ch10.15 (boundary)
  claim: 知乎盐选会员佣金政策变动风险
  reason: 素材中未找到具体佣金政策细节与变动历史
- location: ch10.15 (boundary)
  claim: 素材去重难度随同行增多而上升
  reason: 素材中未提供去重难度量化数据或趋势分析
- location: ch10.3 (核心定义)
  claim: 1比1模仿保底60分原则
  reason: 素材中仅有作者主观断言'用这样验证过的流量视频或者带货视频当模板，是要保证1比1模仿做出的内容都是60分以上的'，缺乏量化验证数据
- location: ch10.4 (核心定义)
  claim: 三重混淆机制能使任意两条视频余弦相似度趋近于零
  reason: 素材中为理论推导，无实测相似度分布数据支撑
- location: ch10.5 (核心定义)
  claim: 官方数据雷达数据为'全量实时数据'
  reason: 素材中未提供官方文档或测试报告证明数据全量实时性
- location: ch10.8 (核心定义)
  claim: 黑马小达人单视频GMV/粉丝比越高内容自带带货能力越强
  reason: 素材中为经验总结，缺乏统计学显著性验证
- location: ch10.9 (核心定义)
  claim: 加字引导文案公式为出单关键而非视频本身
  reason: 素材中仅有作者感受'有时候出单可能不是因为视频，而是你加的字抓住了用户'，无AB测试对照数据
- location: ch10.10 (核心定义)
  claim: 视频去重流水线过审率95%以上
  reason: 素材中为作者自述'过审率95%以上'，无第三方审计或平台官方数据
- location: ch10.11 (核心定义)
  claim: 视频号直播无自然推流入口
  reason: 素材中为经验总结'视频号直播间无自然推流入口'，未引用平台官方文档
- location: ch10.12 (核心定义)
  claim: 爆款视频生命周期通常爆发3天、第4天开始断崖式衰减
  reason: 素材中为作者观察'账号爆了三天...第四天大概只有2000万左右播放了'，缺乏大样本统计支撑
- location: ch10.13 (核心定义)
  claim: 不看后台数据、定量化动作目标能克服知识诅咒
  reason: 素材中仅有作者个人案例对比，无对照实验或心理学机制验证
- location: ch10.14 (核心定义)
  claim: RPA运行独占本地桌面，建议部署云桌面/备用机/无头模式
  reason: 素材中未提供不同部署方案的成本效益对比测试数据
- location: ch10.16 (设计取舍)
  claim: 模板化二创边际成本趋近零
  reason: 素材中未计算人工审核、账号损耗、素材更新等隐性成本
- location: ch10.16 (设计取舍)
  claim: 新号7天扶持期激进堆量可用时间换空间
  reason: 素材中未量化'激进堆量'的具体投入产出比（ROI）
