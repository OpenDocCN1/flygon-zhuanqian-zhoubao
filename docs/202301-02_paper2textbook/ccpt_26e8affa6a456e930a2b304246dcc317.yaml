paper: docs/202301-02/20230207_05.md
desc: 该素材是‘龙哥赚钱周报’的一次汇编，内容来自一个年费3000多的付费社群，整理了多篇与生财认知和生财技能相关的帖子。素材包含了小马宋的‘10句话’（强调进化论、创新、竭尽全力、现场有神明等经营与营销认知），一篇‘50条认知思维’的浓缩总结（涉及赚钱本质、流量、杠杆、执行力等），以及一篇关于‘做内容要做渣男’的方法论分享（基于峰终定律，提出‘撩完就跑’和‘广撒网’两大做内容的原则）。整体上是一份浓缩了多个原创观点和方法论的赚钱经验合集。
concepts:
- name: 进化论式成功学
  desc: 一种将生物进化论类比于商业和个人成长的成功学观点，强调适应环境变化、不断进化才能生存和成功，是素材中提出的核心认知。
  is_original: false
  excerpt:
  - 进化论是地球上唯一可靠的成功学。 今天的小马宋，和一年前的小马宋已经不同了，因为 2022 我们的生存环境发生了变化，如果不能进化，我们就会被新环境消灭。所以我特别同意王立铭老师讲的这句话：进化论是地球上唯一可靠的成功学。我也说过一个更通俗的比喻，如果海水干涸，最强的鱼也活不下来，但能进化出肺的鱼会活下来。
- name: 创新与超额利润
  desc: 引用经济学家熊彼特的观点，认为只有创新才能获得超额利润，没有创新就只能获得平均的企业经营利润。
  is_original: false
  excerpt:
  - 只有创新才能获得超额利润，如果没有创新，你就只能获得平均的企业经营利润，勉强活下去而已。 经济学家熊彼特道出了成功的真相，那些活得好的企业，一定是有创新的企业。创新不止于技术创新，产品设计、渠道开发、投放方法、传播思路等等都可以做到创新。
- name: 营销与经营的层级关系
  desc: 主张营销问题的解决依赖于更高一级的企业经营问题的解决，强调要理解经营逻辑才能做好营销。
  is_original: false
  excerpt:
  - 营销的营，首先是经营的营。 …… 一个问题的解决，总是依赖于与问题相邻的更高一级的问题的解决。 …… 我虽然做营销咨询，但我一直提醒我们同事的是，营销问题上一个层级是企业经营问题，你首先要理解经营的逻辑才可以。
- name: 现场有神明
  desc: 强调产品经理要亲临销售和消费的现场去观察顾客的真实使用情况，而不是自我意淫地创造产品。
  is_original: false
  excerpt:
  - 第十句：现场有神明 很多人听说过这句话，但是，仅仅是听说而已。 我们的产品，其实是在销售和消费的现场，但有多少产品经理是在自我意淫中创造产品的呢？太多了。他们从不去看顾客使用中发生了什么。
- name: 渣男思维做内容
  desc: 一种做内容的策略性思维，借用‘渣男’的恋爱行为（撩完就跑、广撒网）来比喻内容创作中要善于戳中用户痛点/痒点但不过度纠缠，以及多平台多话题撒网以提高命中率。
  is_original: true
  excerpt:
  - 今天我来分享渣男思维做内容，让你们变成自媒体世界的渣男！
  - 做渣男第一点：撩完就跑。戳痒点，意犹未尽。…… 咱们撩到用户的痒点就停，峰终定律，在情绪最高点停止，才能让人意犹未尽，印象最好。
  - '# 做渣男第二点：广撒网 渣男怎么养鱼的？当然是混多个圈子，他们不止在一个圈子里寻找自己的猎物。所以，咱们做内容也需要广撒网，提高自己的内容命中率。'
methods:
- name: __overview__
  desc: 素材的整体方法论是从付费社群中整理和提炼‘生财认知’与‘生财技能’的经验，通过浓缩和总结形成可复用的思维原则与操作指南。
  excerpt:
  - 赚钱周报来自某年费 3000 多的付费社群资源帖。
  - 一般看到好的文章我都会思考后做精华总结，争取做到看到这一两句话，就能想到整个文章的内容框架。毕竟学习不是为了饱读诗书，而是当你遇到这个问题的时候能快速拿出来用，能做到学以致用的内容才是好内容。下面的这
    50 多条认知思维，都是思考大量优质文章中，浓缩出来的一两句话，可谓是精华中的精华！
- name: ‘撩完就跑’内容创作法
  desc: 在内容创作中，只展示结果而不提供完整过程，或者在展示过程中戳中用户的痒点/痛点后立即停止，利用峰终定律让用户在情绪最高点获得最佳体验。
  excerpt:
  - 做渣男第一点：撩完就跑。戳痒点，意犹未尽。有个定律，叫做峰终定律：如果在一段体验的高峰和结尾，体验是愉悦的，那么对整个体验的感受就是愉悦的。…… 咱们撩到用户的痒点就停，峰终定律，在情绪最高点停止，才能让人意犹未尽，印象最好。
  - 再比如这一篇，做个人 ip 的 40 个 APP。…… 现在大家都想要做 ip，但是怎么做呢，这就是一个痛点。咱们撩完就跑，除了戳痒点之外，还有一个就是戳痛点。不过，戳中就要撤，不能拖泥带水。……
    这篇内容，就是戳中了‘做个人 ip’这个痛点，并且展示了 40 个 APP 的名字。注意，只有 APP 名字，并没有告诉你 APP 怎么用，怎么下载，怎么用
    APP 去做个人 ip。
- name: 广撒网内容策略
  desc: 在多个圈子、多个平台上发布内容以提高命中率，同时强调‘垂直’垂直的是人群而非内容题材，以获取更广泛的潜在用户。
  excerpt:
  - '# 做渣男第二点：广撒网 渣男怎么养鱼的？当然是混多个圈子，他们不止在一个圈子里寻找自己的猎物。所以，咱们做内容也需要广撒网，提高自己的内容命中率。'
  - 有同学就会问，咱们不是一直说做内容要垂直吗？为什么现在要广撒网呢，这不就不垂直了嘛。要注意，咱们垂直，并不是垂直内容，不是说你做母婴领域，你就天天发育儿相关的内容。咱们垂直垂的是人群。
- name: 盈利验证与放大法
  desc: 先用最简单的方式快速验证商业模式（完成第一单），验证成功后再复制放大，通过把盈利的事情重复做来扩大生意。
  excerpt:
  - 不要追求完美，用最快速度跑通盈利模型。（先用最简单的方式去验证商业模式是否正确，也就是完成第一单）
  - 把 1 个号做到月入 10 万很难，但是把月入 3000 的号复制 30 多遍不难，把盈利的事情重复做。找到一点点能够获利的机会，再通过放大，将它变成个大生意，哪怕只能赚一元钱，只要他可以无限放大，那他就是一个年赚百万的项目！
- name: 以结果倒推的逆向思考法
  desc: 以结果为导向，逆向拆解需要的步骤，确定最小行动单元，先确定变现路径再开展业务，以提高效率。
  excerpt:
  - 以结果为导向，逆向思维需要的步骤，拆解出最小行动单元。正常流程：定位→内容→流量→产品→变现，我们可以以结果倒推内容：变现→定位→产品→内容→流量。先找买家，再找产品！（也可以理解为先找需求），一定要先考虑好怎么变现，然后再去开展业务，一定会事半功倍。
- name: 剥离式拆解问题法
  desc: 通过将客户群体最需要解决的大问题层层拆解为小问题，来确定团队应该投入精力的具体领域。
  excerpt:
  - 提炼客户群体最需要解决的 10 个大问题，并把每个大问题拆解为 10 个小问题，得到 100 个问题，你和你的团队，最该花时间的地方，就是这 100 个小问题。
theorems:
- name: 竭尽全力是最轻松的工作方式
  desc: 认为大多数人都没有竭尽全力做事，而只要足够勤奋和用心，在大多数事情上就能超过多数人，因此竭尽全力反而是一种最轻松的工作方式。
  excerpt:
  - 无论你做什么工作，只要竭尽全力就可以，竭尽全力是最轻松的工作方式。…… 其实我们几乎所有的人，做事都很难做到竭尽全力。…… 有时候我们不必去拼天分，我们在很多事情上，只要够勤奋、够用心就可以了。
- name: 做事的依据是能力与资源而非愿望
  desc: 主张做什么事不能基于美好的愿望，而是要基于能力和资源；每个人都应审视自身能力和资源，确定适合做什么并长期坚持。
  excerpt:
  - 做什么事，不能基于美好的愿望，而是要基于能力和资源，老鹰可以吃到兔子，鲨鱼却吃不到，但鲨鱼不应该羡慕老鹰，而是应该努力捕捉更多的鱼。…… 我们每个人，都要审视自己的能力和资源，先确定自己适合做什么，能不能给社会带来价值。然后就倾注一生的精力和实力，把这件事做好就是了。
- name: 赚钱的本质是交易，交易的本质是满足用户需求
  desc: 论述了赚钱的本质是交易，而交易的本质在于满足用户的需求，因此只要满足用户需求就能赚到钱，关键是要选定付款者和打动付款者的方式。
  excerpt:
  - 赚钱的本质是交易，交易的本质是满足用户需求。
  - 只要满足用户需求，就能赚到钱，你需要做的就是选谁作为付款者，以及怎么打动付款者，这个需求可以是物质需求，也可以是精神需求。
- name: 能够变现的流量才叫流量
  desc: 强调流量必须能够变现才有价值，不能变现的流量只能叫做数据，因此应从第一个粉丝就开始变现，避免流量过期失效。
  excerpt:
  - 要从第一个粉丝就开始变现，流量就像是一张门票，有效期内你不用掉，就会变成一张废纸。能够变现的流量才叫流量，不能变现的流量只能叫做数据。
- name: 爆款内容可以复制与再利用
  desc: 认为爆过的内容一定可以再爆，内容创作不应依赖灵感，而应依靠爆款模板来持续输出。
  excerpt:
  - 爆过的内容一定是可以再爆的，内容创作不要靠灵感，要靠爆款模板！
- name: 赚钱靠杠杆效应而非出租时间
  desc: 认为依靠出租自己的时间很难致富，要想获得财富就要充分利用劳动力、自媒体、复制边际成本几乎为零的产品等杠杆效应。
  excerpt:
  - 依靠出租自己的时间是很难致富的，要想获得财富，就要充分利用杠杆效应，比如劳动力，自媒体（无限放大自己的影响力），和复制边际成本几乎为零的产品（软件，课程，虚拟产品等）。
  - 找到属于自己的杠杆，才能利用有限的时间和精力，产生巨大的影响，比如个人 IP。
- name: 成交的核心是需求、信任、购买力
  desc: 提出成功成交的三个核心要素：需求、信任和购买力，其中信任的前提是能提供用户需要的价值并解决用户需求。
  excerpt:
  - 成交的核心：需求、信任、购买力。成交的前提是信任，信任的前提是你能提供用户需要的价值，解决用户的需求！
- name: ‘真传一句话，假传万卷书’与学以致用原则
  desc: 主张优质内容应浓缩成简洁的一句话，以便学以致用；学习应针对现阶段最需要的知识，边学习边思考边实战，而不是追求篇幅冗长。
  excerpt:
  - 真传一句话，假传万卷书。
  - 一般看到好的文章我都会思考后做精华总结，争取做到看到这一两句话，就能想到整个文章的内容框架。毕竟学习不是为了饱读诗书，而是当你遇到这个问题的时候能快速拿出来用，能做到学以致用的内容才是好内容。
  - 学以致用！知识一定要转化为生产力，要根据自己现阶段的情况，来学习当下最需要的知识（边学习，边思考，边实战！）
- name: 峰终定律在内容中的应用
  desc: 将心理学中的峰终定律应用于内容创作：只要让用户在内容开头和结尾的体验愉悦（中间较差无关紧要），用户就会对整个内容产生好感。
  excerpt:
  - 有个定律，叫做峰终定律：如果在一段体验的高峰和结尾，体验是愉悦的，那么对整个体验的感受就是愉悦的。这就说明，如果我们让目标用户在看我们的内容的开头和结尾（中间内容无所谓），体验愉悦，那么她对我们的内容就会产生好感。
findings:
- name: 小马宋的10句年度感悟
  desc: '[claim] 素材原文（小马宋告别2022的感悟）宣称：进化论是唯一可靠的成功学、真正的乐观是全然地接受事实和真相、只有创新才能获得超额利润、竭尽全力是最轻松的工作方式等10条经营与人生认知。这些是原文作者的主观观点陈述，没有提供数据支撑。'
  excerpt:
  - 第一句：进化论是地球上唯一可靠的成功学。…… 第六句：不要羞于提出那些答案似乎显而易见的问题。…… 第七句：做什么事，不能基于美好的愿望，而是要基于能力和资源。……
    第十句：现场有神明
  - 我是我的新书《营销笔记》在得到电子书上被划线最多的一句话，目前有 2512 位读者标注了这句话。
- name: 50条浓缩认知思维中的变现与流量规律
  desc: '[claim] 素材原文宣称了一系列关于赚钱的思维规律，包括‘能够变现的流量才叫流量’、‘赚钱的本质是满足用户需求’、‘以结果倒推内容’、‘利用杠杆效应致富’等。这些是作者基于大量优质文章浓缩出的经验性总结，属于主观归纳，素材未提供实证数据。'
  excerpt:
  - 6.要从第一个粉丝就开始变现，流量就像是一张门票，有效期内你不用掉，就会变成一张废纸。能够变现的流量才叫流量，不能变现的流量只能叫做数据。
  - 14.赚钱的本质是交易，交易的本质是满足用户需求。
  - 19.以结果为导向，逆向思维需要的步骤，拆解出最小行动单元。……先找买家，再找产品！
  - 24.依靠出租自己的时间是很难致富的，要想获得财富，就要充分利用杠杆效应。
- name: 渣男思维做内容的实际效果案例
  desc: '[evidence] 素材作者（劲猫）以自己的实操经历作为案例支撑‘渣男思维’的有效性：曾用20分钟做出10万赞藏的大爆文，1万粉丝变现20万；同时提到自己做小红书3个月从0涨粉8000、变现5万。这些是作者自称的个人经验数据，支撑‘撩完就跑’和‘广撒网’两个方法。'
  excerpt:
  - 我是劲猫，曾经 20 分钟做出过 10 万赞藏大爆文，1 万粉丝变现 20 万。
  - 听生财小伙伴说大家在共读我之前写过的一篇文章《自媒体小白做小红书 3 个月，从 0 涨粉 8000 粉，变现 5 万》。
- name: ‘撩完就跑’的成功案例展示
  desc: '[evidence] 素材以两个案例说明‘撩完就跑’手法的效果：一个展示有钱人生活的视频（开头无边泳池、结尾美妙画面收尾）虽然中间内容剪辑粗糙仍获大量点赞；另一篇‘做个人ip的40个APP’仅展示名称、不提供使用方法却成功戳中痛点。案例描述了具体做法和用户反应，但未给出精确数据。'
  excerpt:
  - 比如这一篇，展示了有钱人的生活，无边泳池，高楼远望，封面很吸引人，这是第一个开头愉悦点。结尾的时候也顺利用美妙的画面收尾了。尽管中间的内容剪辑很垃圾，甚至模糊不清，但这些都不重要。
  - 再比如这一篇，做个人 ip 的 40 个 APP。…… 注意，只有 APP 名字，并没有告诉你 APP 怎么用，怎么下载，怎么用 APP 去做个人 ip。……
    这种戳中痛点的感觉，就会让别人对你产生兴趣，从而关注你。
- name: 《营销笔记》的读者标注数据
  desc: '[evidence] 素材引用了一组数据来支撑‘做什么事要基于能力和资源’这个主张的社会认可度：《营销笔记》中‘不要基于美好的愿望，而是要基于能力和资源’这句话是得到电子书上被划线最多的一句话，目前有2512位读者标注。这为原文观点提供了一定的客观背书。'
  excerpt:
  - 我是我的新书《营销笔记》在得到电子书上被划线最多的一句话，目前有 2512 位读者标注了这句话。
