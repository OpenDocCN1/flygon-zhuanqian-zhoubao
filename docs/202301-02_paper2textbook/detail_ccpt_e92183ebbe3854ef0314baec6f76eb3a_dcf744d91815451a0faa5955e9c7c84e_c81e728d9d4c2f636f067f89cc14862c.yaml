units:
- 'no': 1
  name: 卖空气 —— 先收钱、后造梦的预售魔法
  points:
  - '**为什么需要这个概念？**'
  - '- 传统“先开发产品、后推向市场”的流程成本高、周期长，一旦需求判断失误，所有投入都将付诸东流'
  - '- 个人开发者或小团队资源有限，无法承担完整的开发周期，需要一种低成本、快速验证需求真实性的手段'
  - '- 市场环境变化快，热点窗口期短暂（如羊了个羊大火只有几天），等到产品开发完再卖，风口早已过去'
  - '**核心定义**'
  - '- “卖空气”指在产品尚未开发或无法真正兑现功能时，先通过制造“已具备该功能”的假象（如模型截图、预售页面、演示视频）来收取用户资金，以此测试需求是否真实存在'
  - '- 核心原则是“假装已经有了，再去卖”——若预售效果不佳，则果断放弃后续开发，避免沉没成本'
  - '**关键性质**'
  - '- 需求验证前置：把“市场是否买单”的验证从开发后提前到开发前'
  - '- 零沉没成本：卖不出去就不必继续做，最大程度降低试错代价'
  - '- 反流程性：销售先于产品存在，颠覆“先有东西再推广”的传统思维'
  - '**典型例子**'
  - '- 开发者看到某一热点需求（如羊了个羊刷分工具），先P一张功能截图发帖预售，若有大量用户询价付款，再着手寻找或开发真正能兑现的软件'
  - '- 用中文编程工具先捏出一个粗糙的模型界面展示给潜在客户，而非先完成完整研发'
  - '**边界条件**'
  - '- 此方法建立在“有效噱头、无效产品”这一伦理灰色地带上，虽能加速赚钱但存在法律与道德风险'
  - '- 不适用于需要长期交付、复购或建立品牌信任的产品形态，只能用于一次性、小额、需求急迫的短期生意'
  - '- 预售承诺若无法兑现，会积累用户信任透支，不可作为持续性商业模式'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 或者直接做个模型，上架开卖，卖空气，卖预售。卖不出去就没必要继续做了！
  - 假装已经有了足够！卖空气！
  - 程序的思维总是先有东西再推广，不要等什么东西已经有了再去卖！假装已经有了足够！卖空气！
  - 羊了个羊刚有点火，立刻就有人P一张分数999999截图，去社交软件用已经开挂的口吻发文，开始吸粉，差不多5天后《羊了个羊》大火，这时他就可以，套话找真正能刷分软件了，直接把粉丝变现！
