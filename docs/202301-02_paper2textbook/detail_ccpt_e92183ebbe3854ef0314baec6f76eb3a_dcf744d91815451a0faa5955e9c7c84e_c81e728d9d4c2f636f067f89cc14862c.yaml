units:
- 'no': 1
  name: 反直觉起点：软件的本质就是软文 —— 让推广反推开发
  points:
  - '**为什么需要这个概念？**'
  - '- 传统开发流程是“先写代码、后写文案推广”，导致开发出的产品无人问津、推广乏力'
  - '- 独立开发者精力有限，若产品无法变现，前期开发投入将全部沉没'
  - '- 用户最终接触的只是软文介绍，而非代码本身，软文才是产品的最终展现形式'
  - '**核心定义**'
  - '- 软件的本质是软文：软件开发出来最终靠软文推广，所以可反推流程——先写软文、后做产品，甚至不开发而寻找现成软件交付'
  - '- 核心逻辑：用户看到文章内心想“这次找对了”即可，不管真找对还是假找对'
  - '**关键性质**'
  - '- 极大降低试错成本：卖不出去就没必要继续开发，规避“无人购买的完美代码”'
  - '- 倒逼需求理解：把需求完整讲出来让用户理解，本身就是验证需求真伪的过程'
  - '- 打破“正统开发”执念：个人开发者不应追求工程规范，而应追求“捏出模型”的速度'
  - '**典型例子**'
  - '- 作者早期做礼包软件：根本领不到礼包，但靠软文描述和评论区“集体幻觉”实现下载与变现'
  - '- 羊了个羊火时，有人P图999999分截图发帖“已开挂”吸粉，5天后游戏爆火再套话变现'
  - '**边界条件**'
  - '- 仅适用于个人/小团队非规范化生产，企业级核心系统不可用此法'
  - '- 必须处于法律法规与平台规则允许的“擦边球”边界，不可触碰诈骗红线'
  - '- 后期仍需补齐交付能力，否则面临退款、投诉、封号风险'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 多年经验总结一个观点：软件的本质就是软文。
  - 软件开发出来，怎么推广？还是通过写文章，发广告，介绍你这个软件，软件的最终的展现方式还是软文
  - 所以直接拿软文，最终形式。反推开发流程，甚至不开发软件，而是寻找类似的软件给客户使用。
  - 想一些根本不现实，或多数人下载不到的软件，但他们觉得应该有这种软件，只需要想到名字即可
  - 写软文的核心是用户看到你这篇文章，内心在想'这次找对了！'，就行了，不管他真找对了还是假找对了。
- 'no': 2
  name: 卖空气：制造“已有”的假象来预售 —— 开盲盒前的海报
  points:
  - '**为什么需要这个概念？**'
  - '- 传统“先开发后售卖”周期长、风险大，个人开发者无法承担开发完无人买单的沉没成本'
  - '- 需要一种极低成本的需求验证手段，在投入大量开发前确认市场付费意愿'
  - '- 用户往往为“确定性”买单，哪怕产品尚未交付，预售页和截图即可提供这种确定性'
  - '**核心定义**'
  - '- 在产品不存在或功能未实现时，用模型、截图、预售页制造“已有产品”的假象，先收钱、测试需求'
  - '- 口号：“假装已经有了足够！卖空气！卖预售！卖不出去就没必要继续做了！”'
  - '**关键性质**'
  - '- 验证优先于构建：以销售定生产，而非以生产定销售'
  - '- 模型即产品：用中文编程工具等低门槛工具在1周内捏出可演示模型，而非正规开发'
  - '- 快速止损：预售无人问津即放弃项目，将试错成本压缩至极致'
  - '**典型例子**'
  - '- 作者“淘客API问题”软文：用“已解决”口吻写文吸粉，套出真方案后卖给未解决者，盈利几十万'
  - '- 羊了个羊P图案例：游戏刚火时P图999999分以“已开挂”口吻吸粉，待游戏爆火后套出真刷分软件变现'
  - '**边界条件**'
  - '- 必须能在承诺时间内通过“找现成软件/外包/自研”兑现交付，否则构成欺诈'
  - '- 仅适用于数字化、可复制、边际成本极低的软件/课程/资料类产品'
  - '- 平台风控升级（如预售监管、实名认证）可能压缩生存空间'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 或者直接做个模型，上架开卖，卖空气，卖预售。卖不出去就没必要继续做了！
  - 假装已经有了足够！卖空气！
  - 个人开发者研发一个软件的时间不应超过1周，超过1周的软件产品不适合个人开发者！
  - 把需求完整的讲出来，又让他理解，本身就是一件不容易的事。沟通成本有时候比开发成本都高，还赶不上有一个趁手的工具，自己先捏一个模型给他看！
- 'no': 3
  name: 非规范化生产：用“野路子”快速捏出产品模型 —— 拒绝正统的病
  points:
  - '**为什么需要这个概念？**'
  - '- 个人开发者缺乏正规团队的工程化流程（需求评审、架构设计、测试上线），硬套正规流程会拖垮节奏'
  - '- 正规开发周期长、成本高、沟通成本大，不适合“小而快”的验证型项目'
  - '- 核心目标是“降低成本、提升效率”，只要能跑通演示和交付即可，代码质量非首要指标'
  - '**核心定义**'
  - '- 个人开发者应采用的强调降低成本、提升效率的“野路子”生产方式，区别于正规化流程'
  - '- 核心口诀：“个人开发者没有正统的命，得了正统的病” —— 就怕按大厂流程做小项目'
  - '**关键性质**'
  - '- 工具民主化：使用中文编程工具等低门槛工具，不会英语也能快速入门'
  - '- 模型优于代码：核心产出是可演示、可交付的模型，而非规范的代码库'
  - '- 周期红线：单个软件研发时间不应超过1周，超过即不适合个人开发者'
  - '**典型例子**'
  - '- 作者建议：用《中文编程工具》快速捏模型，甚至不写代码直接找现成软件/开源项目二改'
  - '- “把需求完整讲出来让用户理解，本身就是一件不容易的事”，沟通成本常超开发成本'
  - '**边界条件**'
  - '- 仅适用于独立开发、副业项目、MVP验证阶段，团队协作、长期维护项目需引入规范流程'
  - '- 核心逻辑、支付、数据安全等关键模块不可因“野路子”而留下隐患'
  - '- 技术债需显性管理：验证通过后若决定长期运营，必须安排重构或并行规范化开发'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 个人开发者需要的是'非规范化生产'俗称野路子
  - 非规范化生产的核心是：'降低成本''提升效率'
  - 就怕个人开发者'没有正统的命，得了正统的病！'
  - 个人开发者研发一个软件的时间不应超过1周，超过1周的软件产品不适合个人开发者！
  - 使用《中文编程工具》，不会英语也能快速入门
  - 把需求完整的讲出来，又让他理解，本身就是一件不容易的事。沟通成本有时候比开发成本都高，还赶不上有一个趁手的工具，自己先捏一个模型给他看！
- 'no': 4
  name: 软文撰写技巧：复述问题、超长文与过审艺术 —— 看病问诊式建立信任
  points:
  - '**为什么需要这个概念？**'
  - '- 内容平台审核严格，硬广、引流直接被封，需要“过审技巧”存活'
  - '- 用户对硬广免疫，需要通过“复述问题”建立“懂我”的信任感，而非直接推销'
  - '- 搜索引擎偏好长文、专业感内容，超长文可刷停留时长、骗收藏点赞、提升SEO权重'
  - '**核心定义**'
  - '- 复述问题建立信任：罗列用户症状/问题，让用户产生“都是我的症状、这次找对了”的心理认同（类比医生问诊）'
  - '- 超长文制造专业感：字数极长、结构看似专业，实则后半段常无实质内容，利用用户“收藏不看”、审核员“懒得看”的心理'
  - '- 过审艺术：干净截图+合集/大全/汇总模板凑字数，核心让审核员觉得“无害、专业”从而通过'
  - '**关键性质**'
  - '- 信任转移：用户信任“懂问题的人”，而非“卖产品的人”'
  - '- 停留换权重：用户停留时长↑ → 平台判定优质 → 推荐流量↑、搜索排名↑'
  - '- 收藏转发假象：用户“先收藏点赞，以后也不看”，制造虚假热度数据'
  - '**典型例子**'
  - '- 看病问诊类比：医生问“有没有这个症状？”，患者全中 → 信任建立'
  - '- 作者提交材料案例：2页被拒，改成乱七八糟15页秒过，证明“字多/长”即是过审核心'
  - '- 知乎长文现象：200字有联系方式 → 先加后说 → 收藏点赞（反正看不完）'
  - '**边界条件**'
  - '- 平台算法迭代（如识别注水内容、打击诱导收藏）会失效'
  - '- 长期依赖“伪专业”内容会透支账号信誉，导致后续真优质内容也难分发'
  - '- 法律风险：虚假宣传、欺诈消费者可能面临监管处罚'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 举例：就拿看病举例子，医生会问你：'有没有这个症状？有没有那个症状？'结果你发现：'都是我现在的症状'，所以你认为这个医生懂你的病，这次找对了！
  - 所以，这就是一种内容策略，用复述问题建立信任基础！
  - 文超长，字超多，审核员懒得看，就行了！可使用：合集、大全、汇总，之类模板，增加文章字数！
  - 核心是让自己变得至少看起来是无害的。
  - 用户在你这个文章的页面停留的时间越长，搜索引擎就会觉得你这个文章更专业
  - 该类文章特征：写的字长，让你停留时间长，让你照着各种步骤去做，反正你最终也解决不了！
  - 知乎只要是长文，点赞收藏就多。看到200字有联系方式或者公众号，先加了在说，然后收藏点赞（反正看不完，以后也不会看）
  - 之前提交一个证明材料，只提交了2页直接给我拒绝了，后面我乱七八糟提交了15页秒过。
- 'no': 5
  name: 支撑赚钱的悖论：有效噱头与无效产品 —— 安慰剂也能卖好价
  points:
  - '**为什么需要这个概念？**'
  - '- 打破“产品必须解决需求、必须好用才能赚钱”的教条式认知'
  - '- 现实中大量“名字好、包装好、噱头足”但功能一般甚至无效的产品依然畅销'
  - '- 理解此悖论可避免陷入“完美产品主义”陷阱，先用噱头跑通商业闭环'
  - '**核心定义**'
  - '- 不解决需求、不是好产品，也不影响赚钱速度。噱头、名字和表象可以带来收入'
  - '- 核心机制：安慰剂效应（糖豆卖贵当救命药，康复率30%+）、好名字改变固有事实（连花清瘟因名字大卖）'
  - '**关键性质**'
  - '- 认知大于事实：用户购买的是“确定性感知”和“心理安慰”，而非客观功能'
  - '- 名字即资产：起个好名字（如“连花清瘟”）能直接改变市场认知，降低沟通成本'
  - '- 营销碾压产品：软件营销派（逼真App界面）碾压软营销派（纯文本攻略），即使两者都不解决问题'
  - '**典型例子**'
  - '- 礼包软件案例：根本领不到礼包，但评论区刷满“我领到了”“是真的”，集体幻觉支撑下载量'
  - '- 连花清瘟：名字取得好，证明“起个好名字，真的可以改变固有事实”'
  - '- 世上本没有攻略，瞎编一些就有了：营销文章编造不存在的攻略，靠“长篇大论且专业”骗流量'
  - '**边界条件**'
  - '- 伦理红线：利用安慰剂效应收割韭菜属于灰色地带，长期主义者慎用'
  - '- 法律风险：虚假宣传、售假可能触犯广告法、消保法，面临罚款、封号、刑责'
  - '- 可持续性极差：纯靠噱头无复购、无口碑、无护城河，平台风控一收紧即归零'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 但还有一个观点没说，那就是：'不解决需求'，'也不是好的产品'，并不会影响赚钱的速度！
  - 医学上有一种安慰剂效应，说白了就是诈骗效应。一个糖豆卖的特别贵，就说这是救命药，你吃了也真管用，患者的康复率30%以上！
  - 连花之所以大卖，就是名字取得好，事实证明起个好名字，真的可以改变固有事实！
  - 世上本没有攻略，瞎编一些就有了！
  - 市面上的营销文章大多是：编一些根本不存在的攻略
  - 无效的攻略看起来特征：'长篇大论且专业'
  - 早些年做个礼包软件，根本领不到礼包，但应用商店评论区：'我领到了','是真的我也领到了'我习以为常，观察人类迷惑的行为
- 'no': 6
  name: 精准过滤：App的不便是筛选“付费意愿”的筛子 —— 门槛即护城河
  points:
  - '**为什么需要这个概念？**'
  - '- 传统认知认为App下载门槛高、转化低，是劣势'
  - '- 实则高门槛能过滤“无需求看客”，留下“强需求精准用户”，提升后续转化率'
  - '- 解决“流量大、转化差、全是看客”的公域流量痛点'
  - '**核心定义**'
  - '- App下载安装门槛高，反而成为筛选“付费意愿/强需求用户”的筛子'
  - '- 用户愿下载App → 证明需求极强 → 后续转化率极高'
  - '- 同时App截图和使用方法让用户预设“该App真的具有该功能”，建立产品存在感'
  - '**关键性质**'
  - '- 反直觉优势：不便即筛选器，门槛即护城河'
  - '- 信任锚定：用户看到App界面，潜意识认为功能真实存在，降低信任成本'
  - '- 配合强制分享裂变：下载后强制分享才能用，以“不便”换“裂变”，比软文营销更狠'
  - '**典型例子**'
  - '- 微信解封类软件：弄个App让用户填名字申请解封，下载率低但转化极高，还强制分享裂变'
  - '- 对比：纯文本攻略（软营销派） vs 逼真App界面（软件营销派），后者碾压前者'
  - '**边界条件**'
  - '- 仅适用于高客单价、强刚需、决策周期长的工具类软件'
  - '- 低频刚需、轻决策场景下，App门槛会直接劝退绝大多数用户，得不偿失'
  - '- 依赖应用商店分发，受审核、下架、签名掉签等不可控风险影响大'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 但是正因为App使用不方便，却可以当成优势利用一下
  - 如果没有强烈的需求，用户根本不可能去下载安装App App大多数展示只是看客，下载率极低！
  - 但这时用户看到了App截图和使用方法，用户就会知道，有这么一个App，没有需求的用户不可能去下载。所以用户觉得：该App'真的具有该功能！'
  - 软件营销派：核心是，看起来更逼真、更专业。广告隐藏的更深，更容易用户裂变
  - 我不仅有广告，我还强制你分享给别人后才能使用，这可比软文营销狠
- 'no': 7
  name: 软件营销派 vs 软营销派：用“魔法打败魔法” —— 逼真界面碾压纯文本
  points:
  - '**为什么需要这个概念？**'
  - '- 公域流量红利见顶，纯文本攻略（软营销派）同质化严重、用户免疫、转化低'
  - '- 需要一种“降维打击”手段，让营销载体本身具备产品属性，建立专业信任感'
  - '- 利用用户“软件问题就要用软件解决”的心智模型，以魔法打败魔法'
  - '**核心定义**'
  - '- 软营销派：纯文本攻略/教程，靠内容堆砌、SEO获客'
  - '- 软件营销派：配合逼真的App界面截图/演示视频营销，核心是“看起来更逼真、更专业”'
  - '- 即使两者都不解决实际问题，用户也会觉得软件派版本更专业、更可信'
  - '**关键性质**'
  - '- 认知降维：用户无法分辨真假功能，但能感知“专业度”，界面即证据'
  - '- 广告隐藏更深：软件内嵌广告/引导，比文章硬广更隐蔽、更难被封'
  - '- 天然裂变属性：可设置“强制分享给好友/群才能使用”等强裂变机制'
  - '**典型例子**'
  - '- 微信解封类：文本教程 vs “下载App填名字一键申请解封”，后者碾压'
  - '- 作者观察：只要同方向出现软件派，直接碾压文本派，“虽然仍然不解决任何问题”'
  - '**边界条件**'
  - '- 制作逼真界面/演示视频有门槛，需一定设计/开发能力或外包成本'
  - '- 平台对“诱导分享”、“虚假功能演示”打击力度加大，账号存活率降低'
  - '- 长期看，若产品真无功能，用户投诉率高，账号权重会被平台永久压制'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 软件营销派：核心是，看起来更逼真、更专业。广告隐藏的更深，更容易用户裂变
  - 弄一个APP告诉你，你下载这个APP，填上名字，就可以申请解封！
  - 我不仅有广告，我还强制你分享给别人后才能使用，这可比软文营销狠
  - 但是呢，如果这种方向的文章上产生了一个软件派，就可以直接碾压他们了，因为软件看起来更逼真了.....虽然仍然不解决任何问题！
  - 对于这两个版本而言，用户肯定会觉得后一个版本更专业，虽然这两个版本都无法解决你的问题。
- 'no': 8
  name: 信息差搬运论：A平台的“烂内容”就是B平台的爆款 —— 东边日出西边雨
  points:
  - '**为什么需要这个概念？**'
  - '- 内容创作者常陷入“原创压力大、灵感枯竭”困境'
  - '- 不同平台用户群体重叠度低、内容偏好差异大，同一内容跨平台可反复收割'
  - '- 利用平台算法差异、用户认知差异，实现“零成本内容生产”'
  - '**核心定义**'
  - '- 核心定理：渠道存在信息差。把在抖音做烂的内容优化后搬到小红书可能瞬间爆火'
  - '- 类比“东边日出西边雨”：平台间存在天然信息壁垒，搬运即套利'
  - '**关键性质**'
  - '- 非简单搬运：需针对目标平台调整标题、封面、话术、标签（二创/伪原创）'
  - '- 时效性强：热点事件、爆款内容有生命周期，需在源平台衰退前搬运至目标平台'
  - '- 规模化可复制：建立SOP、用RPA工具批量搬运，形成“工业化流水线”'
  - '**典型例子**'
  - '- 抖音烂尾/平庸内容 → 小红书优化标题封面 → 爆款'
  - '- 知乎盐选小说推文 → 视频号/抖音短视频 → 带货变现'
  - '- 羊了个羊P图截图：从游戏社区吸粉 → 引流私域套话变现'
  - '**边界条件**'
  - '- 版权风险：直接搬运视频/图片易被判侵权、限流、封号，需“二创”去重'
  - '- 平台反作弊升级：指纹识别、语义查重、跨平台协同打击搬运号'
  - '- 仅能赚“信息差的钱”，无法建立品牌护城河，属于战术层面红利而非战略资产'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
    role: improve
  excerpts:
  - 核心定理：渠道存在信息差。把在抖音做烂的内容优化后搬到小红书可能瞬间爆火。类比为“东边日出西边雨”。
- 'no': 9
  name: 套话做局：把“同行的方案”变成“自己的产品” —— 居高临下收割情报
  points:
  - '**为什么需要这个概念？**'
  - '- 独立开发者/创业者常面临“不会技术、没方案、无资源”三无困境'
  - '- 同行/大佬手中掌握成熟方案，但碍于竞争关系不愿公开分享'
  - '- 需要一种低成本、高成功率的情报获取手段，将隐性知识显性化、产品化'
  - '**核心定义**'
  - '- “已解决口吻写文 → 引流 → 套话 → 卖给未解决者”的高阶转化术'
  - '- 关键心理：利用对方“彰显优越感/乐于助人”的心理，反问“解决了吗？怎么解决的？”套出真方案'
  - '**关键性质**'
  - '- 零成本研发：不需要自己攻克技术难点，只需做“诱饵”收割成果'
  - '- 精准画像：加微信的全是同类问题的精准用户/同行，转化率极高'
  - '- 双向变现：套到方案卖给小白、卖方案给同行、甚至卖“套话方法论”'
  - '**典型例子**'
  - '- 淘客API案例：作者写“已解决”软文吸引大佬加微信 → 反问“解决了吗？”套出方案 → 卖给未解决客户 → 盈利几十万，土豪老板连发888红包'
  - '- 羊了个羊案例：P图999999分“已开挂”吸粉 → 待游戏爆火 → 套出真刷分软件 → 变现粉丝'
  - '**边界条件**'
  - '- 伦理争议：本质是“骗取商业机密/隐性知识”，处于灰色地带'
  - '- 可持续性差：同一招数难对同一群体重复使用，需不断换“诱饵”'
  - '- 法律风险：若套取涉及核心商业秘密、代码、数据，可能触犯反不正当竞争法'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 我将这个问题用：已经解决的口吻写出来，软文中附加微信号，之后每天都有淘客大佬加我
  - 过了些天，我又反问加我的人'前几天有点忙没来得及回，你们解决了吗？'开始套话，怎么解决的？
  - 总有解决的，也总有没解决的。把解决的套出来，卖给精准的，没解决的客户，直接盈利几十万！
  - 套话之所以能成，主要是因为对方要彰显优越感
  - 土豪老板刚通过好用就直接连发几个888转账！
- 'no': 10
  name: 通过下拉词发现需求：从搜索框里“淘金” —— 读心术般的选题雷达
  points:
  - '**为什么需要这个概念？**'
  - '- 选题/选品失败多因“拍脑袋想需求”而非“看数据找需求”'
  - '- 关键词工具收费高、数据滞后，搜索框下拉词是免费、实时、真实的用户需求清单'
  - '- 解决“不知道做什么、不知道用户在找什么”的核心痛点'
  - '**核心定义**'
  - '- 利用百度、微信、小红书、Google、应用商店等搜索框的下拉推荐词，捕捉用户真实搜索行为背后的痛点'
  - '- 类比“读心术”：下拉词=用户真实提问的自动补全=真实需求排行榜'
  - '**关键性质**'
  - '- 零成本、实时性：无需付费工具，随搜随得，反映当下最热需求'
  - '- 长尾精准：下拉词多为长尾词，精准对应细分场景，竞争小、转化高'
  - '- 跨平台验证：同一词在多平台下拉均出现，说明需求普遍性强、赛道大'
  - '**典型例子**'
  - '- 作者实操：去应用商店找App名字 → 输入百度/微信/小红书/Google搜索框 → 记录下拉词 → 挖掘需求'
  - '- “需求是抓住用户遇到问题、用户寻找解决办法产生的行为。围绕用户可能产生的行为场景，在行为中部署产品！”'
  - '**边界条件**'
  - '- 下拉词受地域、账号画像、近期热点影响大，需多账号、多地区、多时段采样'
  - '- 仅反映“搜索需求”，不代表“付费需求”，需结合商业价值判断（如有无广告、竞品、变现路径）'
  - '- 热门词竞争极大，建议切入“下拉词的下拉词”（二级/三级长尾)或组合词'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 发现需求的方式也很简单，去应用商店找一些App名字，输入百度、微信、小红书，Google搜索框
  - 需求是抓住用户遇到问题,用户寻找解决办法产生的行为。围绕用户可能产生的行为场景，在行为中部署产品！
- 'no': 11
  name: 过审的艺术：超长文、干净截图与合集模板 —— 让审核员“懒得看”
  points:
  - '**为什么需要这个概念？**'
  - '- 内容平台（公众号、知乎、小红书等）审核机制越来越严，硬广、引流、敏感词直接封禁'
  - '- 创作者需要一套“合规包装”技巧，让正常商业内容披上“专业/无害”的外衣通过审核'
  - '- 审核员人工审核时间极短（秒级），机器审核依赖特征匹配，均可被“形式主义”欺骗'
  - '**核心定义**'
  - '- 超长文：字数极多（如合集、大全、汇总模板），审核员懒得细看、机器难判定广告密度，直接通过'
  - '- 干净截图：纯软件界面截图、无二维码/联系方式/诱导词，视觉上“无害”，降低违规判定概率'
  - '- 合集模板：用“XX工具大全合集”“XX教程汇总”标题+目录结构，制造“资源整理型”专业感'
  - '**关键性质**'
  - '- 利用人性弱点：审核员“懒”、用户“收藏不看”、算法“爱长文/爱停留”'
  - '- 形式大于内容：后半段常为注水/无关内容，但前半段建立的“专业感”已完成信任锚定'
  - '- 组合拳：干净截图（过机审）+ 超长文合集（过人审/骗权重）+ 隐晦引流（留钩子）'
  - '**典型例子**'
  - '- 作者亲测：提交2页材料被拒 → 改成乱七八糟15页秒过，证明“字多/厚”即正义'
  - '- 知乎长文：200字留联系方式 → 用户先加收藏点赞（反正看不完） → 权重拉满'
  - '- 软文配干净App截图：只凭截图调动用户分享精神，过审且推广软件'
  - '**边界条件**'
  - '- 平台算法升级（如语义分析识别注水、识别诱导分享截图）会精准打击'
  - '- 账号权重受损：长期发“注水长文”会被打标“低质内容创作者”，后续分发受限'
  - '- 用户信任透支：读者发现被“骗停留/骗收藏”会取关、举报，账号进入死亡螺旋'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 所以软文需要有一个干净的截图，只凭软件的截图，没需求用户不会去下载的，调动用户分享精神，也是一种在社交媒体推广软件，过审的技巧！
  - 文超长，字超多，审核员懒得看，就行了！可使用：合集、大全、汇总，之类模板，增加文章字数！
  - 核心是让自己变得至少看起来是无害的。
  - 之前提交一个证明材料，只提交了2页直接给我拒绝了，后面我乱七八糟提交了15页秒过。
  - 用户在你这个文章的页面停留的时间越长，搜索引擎就会觉得你这个文章更专业
- 'no': 12
  name: 软件全球化：免备案、免证件、免审核的蓝海 —— 非规范化生产的终极归宿
  points:
  - '**为什么需要这个概念？**'
  - '- 国内互联网环境收紧：网站需备案、广告投放需资质、软件需软著、上架需审核，非规范化生产寸步难行'
  - '- 个人开发者无公司主体、无资质证书、无法承担合规成本，被挡在商业化门外'
  - '- 海外市场（Google Play、Web、海外广告网络）门槛极低，且用户付费意愿强、单价高'
  - '**核心定义**'
  - '- 国内环境不佳，软件全球化是大势所趋，甚至是唯一出路'
  - '- 核心优势四免：①网站免备案 ②Google投放免证件（充钱就行） ③软件免软著 ④免应用商店审核（Web直发）'
  - '- 正适合“非规范化生产”：无证件产品也可上市场，想做就做，想停就停'
  - '**关键性质**'
  - '- 合规成本归零：个人开发者可合法合规地面向全球用户商业化'
  - '- 变现效率高：海外用户付费习惯成熟、单价高（美元定价）、LTV长'
  - '- 技术栈通用：同一套代码/模型，国内受限、海外畅通，边际复制成本为零'
  - '**典型例子**'
  - '- 作者断言：“目前国内的互联网环境没那么好，软件全球化是大势所趋，甚至可能是唯一的出路！”'
  - '- 个人开发者靠Web版工具、Chrome插件、Telegram Bot等无需上架形态，直接Google Ads投放收割全球流量'
  - '**边界条件**'
  - '- 需具备基础英文能力（或借助翻译/AI工具）处理文案、客服、政策合规'
  - '- 收款结算需解决：Stripe/PayPal/派安盈/万里汇等跨境收款账号开户门槛'
  - '- 法律管辖风险：面向海外用户需遵守GDPR、CCPA等数据隐私法，违规罚款极高'
  - '- 文化差异：产品设计、交互习惯、营销话术需本地化，不能生搬硬套国内打法'
  sources:
  - paper: docs/202301-02/DNGrdODFBowfk2xwkNCc5GGSnRd.md
    role: origin
  excerpts:
  - 目前国内的互联网环境没那么好，软件全球化是大势所趋，甚至可能是唯一的出路！
  - 1、网站不需要备案 2、Google投放广告不需要证件，充钱就行 3、软件不需要'软件著作权证书' 4、不需要应用商店审核
  - 无证件的产品也可以上市场，正适合非规范化生产
