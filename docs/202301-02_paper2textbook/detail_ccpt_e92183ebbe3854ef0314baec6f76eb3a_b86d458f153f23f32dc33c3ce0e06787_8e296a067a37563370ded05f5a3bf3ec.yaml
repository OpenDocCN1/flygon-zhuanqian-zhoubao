units:
- 'no': 1
  name: 痛点是创业的第一性原理 —— 哪里疼就贴哪里
  points:
  - '**为什么需要这个概念？**'
  - '- 创业不是凭空发明，而是源于对用户真实痛点的深切感知'
  - '- 只有解决真痛点，生意才有刚需属性，不靠“忽悠”也能成交'
  - '- 避免陷入“伪需求”陷阱，做出来没人用的产品'
  - '**核心定义**'
  - '- 痛点：用户急迫想解决、且现有方案无法满足的具体问题'
  - '- 创业切入点：从自身或他人的真实痛点出发，构建商业闭环'
  - '**关键性质**'
  - '- 痛点驱动的生天然具备“刚需”属性，客单价与复购率更高'
  - '- 痛点越具体、越垂直，越容易建立专业壁垒（如夕子从荨麻疹切入科学护肤）'
  - '- 痛点需经得起“找专业人士解决”的验证，伪痛点经不起专业推敲'
  - '**典型例子**'
  - '- 夕子因自身荨麻疹、敏感肌痛点，辞职三甲医院做线上美业，年利润过百万'
  - '- 胖龟找房创始人因买房遭遇“虚假低价、阴阳合同、高额代办费”痛点，创立0中介费平台'
  - '- 老杨发现TikTok早期“高流量低商业化”窗口期，普通人做带货太难，痛点是“想赚钱却没门路”，切入娱乐直播'
  - '**边界条件**'
  - '- 仅有痛点不够，还需具备“付费意愿”与“付费能力”（如<15岁用户爱看睡播但付费弱）'
  - '- 痛点若被平台规则封杀（如中介费被政策禁止），模式会失效'
  - '- 自身痛点不等于大众痛点，需验证市场规模（如“科学护肤金字塔”验证80%人只需基础护理）'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 皮肤有问题最快捷的方式就是找专业人士解决。皮肤没啥问题，做好温和清洁+适度保湿+加强抗氧化+随时防晒，健康靓丽皮肤就完成80%。
  - 中介费为什么要收？就是因为买房及租房者不知道售房及出租转让业主的联系电话！
  - 回观抖音的发展路径，第一阶段就是高流量低商业化阶段，这时候要做的并不一定要跟平台的指向，而是要看清平台的现状。
- 'no': 2
  name: 信息差就是金钱 —— 你知道而别人不知道的路径
  points:
  - '**为什么需要这个概念？**'
  - '- 打破“中介费天经地义”的认知，揭示垄断信息赚差价的本质'
  - '- 理解为何“搬运信息”能成生意：信息不对称是商业利润的源头'
  - '- 指导选品与获客：找到信息断层处，即是流量与变现入口'
  - '**核心定义**'
  - '- 信息差：交易双方对关键信息（价格、渠道、联系方式、规则）认知不对等'
  - '- 信息差变现：打通信息断层，收取“降低搜索成本/规避风险”的服务费'
  - '**关键性质**'
  - '- 信息差随透明度提升而收窄，需不断挖掘新断层（如从“房东电话”到“二房东渠道”）'
  - '- 核心壁垒不在于“信息本身”，而在于“获取信息的渠道与效率”（物业关系、水电费号、同行转化）'
  - '- 买家跳单动机本质是“信息差定价过高”（中介服务不值其费）'
  - '**典型例子**'
  - '- 胖龟找房：用小程序公开房东联系方式，用“0中介费”截流传统中介客流，年入百万'
  - '- 夕子：将医生端“医美面膜/口服保养”专业信息，转化为用户可懂的“科学护肤金字塔”卖货'
  - '- 老杨：将Twitch成熟“睡播”玩法（信息）本地化移植到TikTok（新市场），单小时均100美金'
  - '**边界条件**'
  - '- 信息差不可持久：政策推行“0中介费政府平台”、平台打击搬运、用户认知升级均会消灭信息差'
  - '- 非法获取信息（爬虫窃取、购买黑数据）构成法律风险，需合规化（如物业付费合作、公开渠道监测）'
  - '- 纯信息差模式天花板低，需叠加“服务/产品/品牌”升维（如胖龟从卖信息转向卖会员服务、自有品牌）'
  sources:
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: origin
  excerpts:
  - 生意的本质就是信息差，在互联网里也存在大量的信息差生意。
  - 我们不收中介费，是因为中介费本身就是个伪概念！为什么说是伪概念，因为是智商税……
  - 物业：通过与物业建立起关系，给予一定的费用，拿到业主电话。水电费号码：通过水电费号，找到相应的单位人员获取业主电话。
- 'no': 3
  name: 选品决定论 —— 产品好省一半心
  points:
  - '**为什么需要这个概念？**'
  - '- 避免“拼运营、拼投流”内卷：好产品自带流量属性与转化属性'
  - '- 解决“后端无复购、利润薄”顽疾：选品即定商业模式上限'
  - '- 降低创业试错成本：选对赛道，笨功夫也能出活'
  - '**核心定义**'
  - '- 选品：在特定市场窗口期，寻找“深挖用户需求、涵盖面齐全、有品牌背书、高复购、可溢价”的产品组合'
  - '- 核心公式：好产品 = 精准痛点解决方案 + 信任背书 + 高复购结构'
  - '**关键性质**'
  - '- 选品重于销售：夕子“果断花1.6万入货合伙人级别”，因产品好，客单价、成交率、利润率全上涨'
  - '- 口服/消耗型 > 耐用型：口服保养“一个人一单接受了不会轻易更换”，天然高复购'
  - '- 品牌背书可迁移：医生/博士创立、医院合作、空壳品牌故事，均能大幅降低信任成本'
  - '**典型例子**'
  - '- 夕子：从代购医美面膜（一单2元）→ 自选口服爆款（月利润5万）→ 自建品牌（985博士+医生背书）'
  - '- 胖龟找房：从卖“房源信息”→ 卖“会员服务”→ 卖“自有品牌租房/家居水光”，客单价从百元到万元'
  - '- 老杨：睡播核心“产品”是“声光电道具+剧本”，微创新（材质套利）延长红利期2-6个月'
  - '**边界条件**'
  - '- 选品依赖平台规则：抖音打击无货源、TikTok限制娱乐直播、美团压价标品，选品需动态适配'
  - '- 无绝对好产品，只有“特定人群+特定时刻”的好产品（如真皮包在日本免税、在东欧做日牌）'
  - '- 选品能力需持续迭代：老杨强调“项目生命周期2-6个月，必须具备开发新项目能力”'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  excerpts:
  - 所以选品很关键，产品好省了一半的心，后续回购率也高。
  - 1.深挖用户需求，最好涵盖面齐全：比如说不仅祛痘、还有美白、抗衰等等
  - 2.口服保养是趋势，一个人一单接受了某个品牌的口服，不会轻易更换牌子的
  - 3.尽量能跟医院合作的产品，品牌背书这块强
- 'no': 4
  name: 最小MVP闭环 —— 先造独木舟再过河
  points:
  - '**为什么需要这个概念？**'
  - '- 避免“造航母”式创业：前期投入过大、周期过长、风险不可控'
  - '- 验证商业模型核心假设：产品有人要？流量买得起？能交付？利润为正？'
  - '- 建立“从0到1”的标准动作：挣第一块钱，跑通闭环，再考虑放大'
  - '**核心定义**'
  - '- MVP（最小可行产品）：仅包含核心价值、能跑通“产品-流量-销售-交付”闭环的最简版本'
  - '- 闭环验证标准：能否用最小成本（如2万、80元、1周）完成一次完整的商业交易'
  - '**关键性质**'
  - '- 速度>完美：老杨“第一家店跑通MVP仅花80元”，夕子“2万起步、半个月出单”'
  - '- 要素齐全：缺产品找代工/联营，缺流量做内容/投放，缺交付做SOP/找外包'
  - '- 止损前置：设定“最大投入时间/金钱/资源”，跑不通即切换（夕子知乎封号转小红书）'
  - '**典型例子**'
  - '- 夕子：注册公司解决社保→ 微信诊断+医美面膜→ 知乎引流→ 淘宝交付→ 月利润1-2万'
  - '- 胖龟找房：小程序挂房源→ 物业买电话→ 朋友圈成交第一单→ 验证“买家愿付会员费”'
  - '- 老杨：iPhone+电脑+道具→ 程序控制设备→ 简陋直播间峰值破万→ 验证“娱乐直播可变现”'
  - '- 美团电商：80元开店→ 优选联盟选品→ 发货出单→ 两个月30店、单店月利6-12k'
  - '**边界条件**'
  - '- MVP不等于“简陋产品”：核心体验必须达标（如睡播需“声光电联动”、美业需“专业诊断”）'
  - '- 验证指标要硬：看“首单成本、回本周期、复购率”，别看“点赞、曝光、注册数”'
  - '- 非标品/重服务类MVP更难：需先做“服务SOP标准化”（如夕子咨询SOP表格）再复制'
  sources:
  - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
    role: origin
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: improve
  excerpts:
  - 1.做生意从自己身边资源入手，从挣1块钱开始，选一个天花板比较高的，持续3——5年。
  - 2.跑通自己的生意环节，最小mvp（产品——流量—销售—交付）
  - 第一个阶段：基本所有新号2天起量，峰值突破500，5天突破2000；
  - 美团电商冷启动与红利验证：2022年8月末发现美团电商机会后不到两个月从0跑通并扩展到30家店...第一家店跑通最小MVP仅花费80元。
- 'no': 5
  name: 行业周期窗口期 —— 在“高流量低商业化”阶段入场
  points:
  - '**为什么需要这个概念？**'
  - '- 同一项目，早做一年赚百万，晚做一年亏百万，核心差异在“入场时机”'
  - '- 识别平台/行业“红利期、成长期、成熟期、衰退期”，避免逆周期操作'
  - '- 利用“时间套利”：在平台鼓励、竞争弱、流量廉价时，用笨办法跑通模型'
  - '**核心定义**'
  - '- 窗口期：平台流量释放 > 商业化收割、规则宽松、头部未垄断、普通人可入场的黄金时期'
  - '- 判断依据：平台战略重心、头部玩家动作、流量单价、违规容忍度、政策风向'
  - '**关键性质**'
  - '- 早期高流量低商业化：抖音早期、TikTok 2022年、视频号 2023年、美团电商 2022下半年'
  - '- 窗口期有寿命：老杨预判娱乐直播“至少2年”，胖龟扑中“存量消费时代”二手房红利'
  - '- 窗口期内“完成比完美重要”：美团电商“完成比完美更重要”，先跑通再优化'
  - '**典型例子**'
  - '- 老杨：TikTok处于抖音2017-2018对应期，娱乐直播风口至少2年，单小时均100美金'
  - '- 胖龟找房：2018年新房下行+疫情催化，二手房成交金额逐年升高，切入“存量时代”红利'
  - '- 夕子：2020年疫期小红书流量红利期入场，封控期刷酸视频火，千粉变万粉'
  - '- 美团电商：8月末入场，2个月跑通30店，类比淘系“铺货期”红利'
  - '**边界条件**'
  - '- 窗口期不可预测精确终点：只能“敬畏市场、与市场共舞”，保护弹药（现金流、团队）'
  - '- 伪窗口期陷阱：平台放水吸引商家入驻，实则收割（如TEMU压价至1688平齐、抖音本地生活后期严控合规）'
  - '- 跨周期生存需“1+1+1矩阵”：1个盈利养团队、1个开发接力、1个知识付费变现经验'
  sources:
  - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
    role: origin
  - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
    role: improve
  excerpts:
  - 按照抖音、映客花椒的发展路线图，初级阶段娱乐直播至少可以做2年的时间...
  - 早在 2018 的时候国内的新建楼房已经开始走下坡路...国内房产销售已经从存量与增量市场并重的方向，开始迈入存量消费时代。
  - 有模式，我称之为1+1+1，1个在盈利，1个在开发，1个在知识付费
