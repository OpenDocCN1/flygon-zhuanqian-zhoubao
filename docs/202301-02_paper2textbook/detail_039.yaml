learning_targets:
- 理解内在比赛理论（自我一/自我二）如何决定外在成败
- 掌握盲目自信、唤醒成功体验、俯视学习法等心态建设方法
- 掌握确定性窗口期的数据推演方法，能识别并抓住时机窗口
- 理解时代红利对个人收入的量级影响，建立长短线结合的项目思维
- 掌握实时真实ROI的核算公式，能综合评估公域与私域的投产比
- 理解渣男思维做内容的核心理念（撩完就跑、广撒网、峰终定律）
- 掌握逆向思考法，能先定变现路径再规划内容与产品
- 理解增长瓶颈怪圈与价值创造视角，学会三大勇气切换法
- 了解信息差生意的特征，具备从身边发现机会的意识
- 掌握战略即选择的核心理念，明确不做什么是关键决策
- 理解正反馈驱动热爱的机制，摆脱低水平勤奋的内耗
- 掌握盈利验证与放大法，构建从跑通到复制的增长路径
concept_map:
- 创业心态 · 内在比赛
- ├── 内在比赛理论
- │   ├── 自我一（理性） vs 自我二（感性/潜意识）
- │   ├── 内在比赛 vs 外在比赛
- │   └── 自我二不认可 → 输掉外在比赛
- │       ├── 李宗伟输给林丹（37次交手输25次）
- │       └── 老虎伍兹失去'不可战胜'信念
- ├── 盲目自信
- │   ├── 舍我其谁心态 · 我的领域我是国王
- │   ├── 战胜理性自我怀疑
- │   └── 配合俯视学习法（战略藐视·战术重视）
- └── 成功是成功之母
- '    ├── 用成功体验唤醒潜意识自信'
- '    └── 优秀推销员先制造成功体验'
- 商业机会 · 时机窗口
- ├── 确定性窗口期
- │   ├── 香港疫情数据类比推演（2-3个月平静期）
- │   ├── 2023年春天 = 全年最重要的3个月窗口
- │   └── 联动数据验证（旅游/健康/餐饮）
- └── 时代红利
- '    ├── 每100元收入90元来自时代红利'
- '    ├── 英雄是平台与市场红利的产物'
- '    └── 长短线结合项目（视频号直播+私域）'
- 流量运营 · 私域变现
- ├── 实时真实ROI
- │   ├── 综合核算公域投放与私域产值
- │   ├── 公式：q*z-y + z/n×60%×p
- │   └── ROI从2.5提升至3.5-4.5
- ├── 捡漏群
- │   ├── 原价1-3折超高性价比商品
- │   ├── 演员（30-50个托）营造抢购氛围
- │   └── 500人大群 · 佣金变现
- └── 私域单客价
- '    ├── 关注长期贡献而非单次客单价'
- '    └── 2万宝妈好友变现超100万'
- 内容创作 · 爆款心法
- ├── 渣男思维做内容
- │   ├── 撩完就跑（峰终定律：开头结尾愉悦）
- │   └── 广撒网（垂直垂的是人群而非题材）
- ├── 逆向思考法
- │   ├── 逆向流程：变现→定位→产品→内容→流量
- │   └── 先找买家，再找产品
- └── 剥离式拆解问题法
- '    └── 10个大问题 → 100个小问题'
- 战略认知 · 增长视角
- ├── 增长瓶颈怪圈
- │   ├── 被想拥有的东西绑架
- │   ├── FOMO心理加剧焦虑
- │   └── 投机跟风、计较利弊、抓取资源
- ├── 价值创造视角（三大勇气）
- │   ├── 面向未来而非面向过去
- │   ├── 面向用户而非计算利弊
- │   └── 积累价值而非抓取资源
- ├── 战略即选择
- │   ├── 最重要是不做什么
- │   ├── 目标不是战略
- │   └── 发挥自身禀赋
- └── 信息差生意
- '    ├── 机会隐藏在身边'
- '    ├── 网上流传的项目已过时'
- '    └── 苏州图文/烤面筋/朋友圈卖螃蟹'
- 认知心理 · 动力机制
- ├── 正反馈驱动热爱
- │   ├── 懒惰 = 未获得正反馈
- │   ├── 不够喜欢 ↔ 做得不够多（负循环）
- │   └── 突破口：找到热爱 或 纯粹为钱冲
- ├── 优雅亏大钱法（反向警示）
- │   ├── 做容易亏钱的事
- │   ├── 投入足够多的钱
- │   └── 坚持到底（不止盈不止损）
- └── 盈利验证与放大法
- '    ├── 最快速度跑通盈利模型'
- '    ├── 月入3000的号复制30遍'
- '    └── 把盈利的事情重复做'
life_analogy:
- 想象创业是一场**打网球时的内在对决**：
- '- **自我一** = 你理性分析对手动作、计算球路的''教练大脑'''
- '- **自我二** = 你身体里凭直觉挥拍的''肌肉记忆'''
- '- **内在比赛** = 你的潜意识是否相信自己能赢这场球'
- '- **外在比赛** = 实际技术对抗的得分'
- '- 当你脑子里总在自我怀疑''这球我要失误''，身体就会僵硬动作变形，于是真的失误了'
- 就像网球手必须先赢下内心的恐惧，创业者也需要先打赢内在比赛，才能赢得外在的胜利。
- ''
- 想象流量像一座**水库的水流**：
- '- **公域** = 上游的江河（平台流量），流量大但不归你管'
- '- **私域** = 你建的水库（微信好友），蓄起来才属于你'
- '- **流速控制** = 水流太急会冲垮堤坝（无法形成连接），太慢会干涸（没有规模）'
- '- **实时真实ROI** = 不只是看引了多少水（曝光），还要算这类水在自家鱼塘养出的鱼（私域产值）'
- 就像修水库的人要算清蓄水带来的养鱼收益和发电收益，做私域也要把引流的长期产值算进总账。
summary:
- concept: 内在比赛理论
  desc: 自我一（理性）与自我二（潜意识）的对抗，潜意识不认可目标则外在必输
- concept: 盲目自信
  desc: 创业者需要的不是理性自我怀疑，而是'在我的领域我就是国王'的潜意识信念
- concept: 成功是成功之母
  desc: 过去的成功体验能在潜意识累积自信，推动后续更大的成功
- concept: 唤醒成功体验法
  desc: 先做容易成功的事制造正反馈，用成功的体验撬动一天更大规模的行动
- concept: 俯视学习法
  desc: 战略上藐视（保持国王姿态）、战术上重视（保持学生认真），才能打赢内在比赛
- concept: 确定性窗口期
  desc: 通过历史数据类比推演识别相对确定的市场稳定期，错过3-6个月即等于放弃
- concept: 时代红利
  desc: 普通人收入的90%来自时代红利而非个人能力，识别红利窗口比提升能力更紧迫
- concept: 实时真实ROI
  desc: 将私域产值计入投放产出后的综合投产比，公式：q*z-y + z/n×60%×p
- concept: 捡漏群
  desc: 以1-3折高性价比商品吸引用户、演员营造氛围、佣金变现的私域社群模式
- concept: 私域单客价
  desc: 关注单个用户长期贡献的总销售额而非单次客单价，通过复购拉长生命周期
- concept: 渣男思维做内容
  desc: 撩完就跑（峰终定律）+ 广撒网（垂直人群而非题材），提高内容命中率
- concept: 峰终定律
  desc: 开头和结尾的体验决定整体感受，中间内容好坏无关紧要
- concept: 逆向思考法
  desc: 以变现为终点逆向拆解：变现→定位→产品→内容→流量，先找买家再找产品
- concept: 增长瓶颈怪圈
  desc: 被增长预期绑架，越追求增长反而距离增长越远，陷入投机、计较、抓取的恶性循环
- concept: 价值创造视角
  desc: 从'我如何得到增长'切换为'我如何值得被奖赏增长'，需三大勇气（面向未来/用户/积累价值）
- concept: 战略即选择
  desc: 战略的本质是取舍，最重要是明确不做什么，目标是对象而非战略本身
- concept: 信息差生意
  desc: 赚钱机会隐藏在身边的日常信息差里，网上流传的项目往往已过时
- concept: 正反馈驱动热爱
  desc: 懒惰的本质是未获得正反馈，找到热爱或纯粹为钱冲是两大突破口
- concept: 优雅亏大钱法
  desc: 反向警示：容易亏钱的事+足够多的钱+坚持不止损=确保亏大钱，反着读是保命清单
- concept: 盈利验证与放大法
  desc: 最快速度跑通盈利模型，把月入3000的号复制30遍，把盈利的事情重复做
exercises:
- 'no': 1
  title: 自测内在比赛：识别你的'自我二'在对抗什么
  contents:
  - 选取一个你长期想做但迟迟未行动的目标（如启动副业、日更写作、转行），完成以下自我诊断：
  - 1. 用一句话写下这个目标，并标注它是'理性上应该做'还是'内心真正渴望做'。
  - 2. 列出当你准备行动时，脑海中浮现的三条'自我否定'声音（如'我肯定做不好''现在入场太晚了'）。
  - 3. 对每条声音，判断它来自自我一（理性分析）还是自我二（潜意识抗拒）。
  - 4. 回忆你过往一次成功的经历，写下当时如何赢下内在比赛（例如第一次完成某项挑战时的信心来源）。
  - 5. 运用'唤醒成功体验法'，设计一个'最小成功体验'动作——今天就能完成的一件小事，用于启动你的目标。
  - 回答问题：
  - '- 你的自我二更可能在哪些场景下对抗目标？如何识别这种对抗的早期信号？'
  - '- 盲目自信与自我欺骗的边界在哪里？如何确保自信建立在真实成功体验而非虚构之上？'
- 'no': 2
  title: 推演你的'确定性窗口期'
  contents:
  - 假设你现在要判断'未来6个月内，某个行业是否存在确定性机会窗口'，按以下步骤推演：
  - 1. 选定一个你关注的行业（如本地生活、AI应用、知识付费）。
  - 2. 找出该行业可类比的历史数据源（如上一轮行业周期、相似疫情/政策冲击下的恢复曲线）。
  - 3. 用类比法推演：源数据中'冲击后恢复到什么程度、持续多久'？据此推断目标行业未来3-6个月的走势。
  - 4. 列出3个可验证的联动数据指标（如旅游看人次数、健康看抖音销量、餐饮看门店客流），并说明每个指标如何辅助验证。
  - 5. 写出你的结论：这个窗口期的起止时间、确定性程度（高/中/低）及依据。
  - 回答问题：
  - '- 类比推演的局限性在哪里？若源数据失真或行业特性差异大，你的结论还成立吗？'
  - '- 如何设计一个''止损线''，让窗口期判断出错时的损失可控？'
- 'no': 3
  title: 用实时真实ROI重算你的投放决策
  contents:
  - 选取你正在做或计划做的业务（如直播带货、付费社群、知识星球），按以下步骤核算：
  - 1. 设定参数：客单价n、毛利率q、广告投入y、直播间营业额z、私域进线率、私域月产值p。
  - 2. 计算纯直播间ROI：企业利润 = q×z - y，ROI = 利润 / y。
  - 3. 计算加入私域后的综合利润：每月利润 = q×z - y + (z/n)×60%×p。
  - 4. 将综合利润除以广告投入y，得到实时真实ROI，与纯直播ROI对比。
  - 5. 若你的私域进线率不足60%或月产值很低，分析差距原因并给出改进方案。
  - 回答问题：
  - '- 当私域进线率从60%降到30%时，ROI会如何变化？递减率（前3个月80%）的假设对长期决策有什么影响？'
  - '- 这个方法适用于哪些业务？对于纯公域一次性交易（如信息流广告卖单品）还适用吗？'
- 'no': 4
  title: 用'渣男思维'拆解一篇你的内容
  contents:
  - 选取你最近发布的一篇内容（公众号文章、小红书笔记、短视频脚本皆可），按'渣男思维'进行分析：
  - 1. 检查'开头'：前3秒/前3行是否制造了第一个愉悦点？如果没有，改写一个更抓人的开头。
  - 2. 检查'结尾'：结尾是否在用户情绪最高点停止？还是在'抖完包袱'后还有冗余信息？
  - 3. 分析'撩完就跑'：你展示的是'完整答案'还是'戳中痛点的部分'？若给了完整答案，尝试删减为'只撩不教'。
  - 4. 分析'广撒网'：这篇文章发在几个平台？标题是否针对各平台做了差异化？
  - 5. 结合峰终定律，重新设计文章的开头和结尾，确保用户在两个端点体验愉悦。
  - 回答问题：
  - '- 渣男思维适用于你的内容''深度信任型''产品吗？边界在哪里？'
  - '- 如何避免''撩完就跑''滑向''标题党''，在吸引注意与建立信誉间找到平衡？'
- 'no': 5
  title: 从'增长瓶颈'到'价值创造'的三步演练
  contents:
  - 选取你当前正面临增长停滞的业务或个人项目，完成视角切换演练：
  - 1. 写下你当前的'增长目标'（如月营收10万、粉丝1万）。
  - 2. 诊断当前是否陷入'增长瓶颈怪圈'：你最近3次决策，是面向未来还是面向过去？是关注用户还是计较利弊？是积累价值还是抓取资源？
  - 3. 切换视角：把问题改为'我如何成为一个值得被奖赏增长的人？'，重新定义目标。
  - 4. 执行三大勇气切换：
  - '   - 面向未来：写下你当前环境中''未来更大''的依据（趋势、技术、用户变迁）。'
  - '   - 面向用户：列出用户当前最痛的3个问题，而非你希望卖的产品。'
  - '   - 积累价值：识别你环境中''最稀缺、最不流动''的资产（品牌、信任、数据、人才），设计一个与之对齐的每周行动。'
  - 5. 对比切换前后的行动清单，找出至少3个'从追逐到创造'的行为转变。
  - 回答问题：
  - '- 价值创造视角是否适用于所有阶段？对于一个从0起步、急需第一笔收入的创业者，是否过于''奢侈''？'
  - '- 如何避免''积累价值''变成''无限期不商业化''的借口？'
units:
- 'no': 1
  name: 内在比赛理论 —— 一场头脑中的“双线作战”
  points:
  - '**为什么需要这个概念？**'
  - '- 许多创业者面临“道理都懂，但就是做不到”的困境，规划清晰却行动迟缓'
  - '- 传统归因只关注技术、方法等外部因素，忽略了潜意识对成败的关键影响'
  - '- 需要用一套理论解释“为何技术不差却总在关键时刻掉链子”的现象'
  - '**核心定义**'
  - '- 人有自我一（理性）与自我二（感性/潜意识）两个自我'
  - '- 任何比赛都同时进行着内在比赛（潜意识是否认可目标）与外在比赛（实际竞争）'
  - '- 当自我二不认可目标时，就会输掉内在比赛，进而输掉外在比赛'
  - '**关键性质**'
  - '- 内在比赛的胜负是外在比赛成败的前提条件'
  - '- 自我一与自我二常常对立：理性上想要，潜意识却在抗拒'
  - '- 胜负手往往不在技术层面，而在心理层面的“身心合一”状态'
  - '**典型例子**'
  - '- 李宗伟技术被公认为与林丹不分伯仲，却37次交手输掉25次，两次奥运会决赛落败——输的不是技术，而是潜意识认为自己打不赢'
  - '- 老虎伍兹在性丑闻离婚后两个月丢掉世界第一，几年内跌出前100——技术与身体并未受损，但潜意识和对手的潜意识都不再认为他是那个不可战胜的人'
  - '**边界条件**'
  - '- 内在比赛理论适用于长期目标与复杂竞争情境，不适用于纯粹的运气博弈'
  - '- 它解释的是“为什么做不成”的心理根源，不能替代具体的方法和技能训练'
  - '- 只有自我二真正认可目标，外在的方法论才能发挥最大效用'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 人，有两个自我，分别是自我一、自我二。自我一，对应着理性，是一般意义上的自我。自我二，对应着感性，或者说对应着潜意识。
  - 任何一个比赛，实际上是同时进行的两场比赛，内在比赛和外在比赛。内在比赛，也就是英文书名里的'Inner Game'，这是最容易被人忽视的。
  - 人们往往容易忽略的是，如果自我二（也就是潜意识），并不认可这个目标的时候，会输掉内在比赛。一旦输掉内部比赛，外在比赛也会输。
  - 他不是输给了林丹，他是输给了自己。
  - 一旦输掉内在比赛，外在比赛也必然会输——李宗伟不是输给了林丹，是输给了自己。
- 'no': 2
  name: 盲目自信 —— 创业者的“理性保险丝”
  points:
  - '**为什么需要这个概念？**'
  - '- 创业充满不确定性与艰难险阻，理性的自我怀疑会放大恐惧、削弱行动力'
  - '- 过度分析利弊往往导致裹足不前，错失窗口期'
  - '- 需要一种心态机制，让创业者在信息不全时仍能果断推进'
  - '**核心定义**'
  - '- 创业者需要的不是理性的自我怀疑，而是近乎盲目的自信与乐观'
  - '- 这种“在我的领域我就是国王”的潜意识信念，是打赢内在比赛、获得外在成功的前提'
  - '**关键性质**'
  - '- 与“战略上藐视敌人，战术上重视敌人”相通：潜意识层面俯视，具体执行层面认真'
  - '- 盲目自信不是自负，而是主动选择的、有意识的心理建设'
  - '- 常言道：永远不要低估一个高估自己的人'
  - '**典型例子**'
  - '- 一等一的赚钱高手早已“身心合一”，言语中的不羁源自打赢了内在比赛'
  - '- 优秀推销员开展一天工作前，先找优质客户或推销容易卖的产品制造成功体验'
  - '**边界条件**'
  - '- 盲目自信应作用于心态层面，不能替代战术层面的精细化执行'
  - '- 它适用于需要长期坚持、对抗不确定性的创业场景，不适用于需要严谨风险测算的领域'
  - '- 自信需建立在过往成功体验的唤醒上，而非自我欺骗'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 一言以蔽之：你需要盲目的自信。因为盲目的自信和乐观，是创业者的理性选择。
  - 这样'舍我其谁''在我的领域，我就是国王'的心态，才是创业者真正需要的心态！
  - 创业途中充满了艰难险阻，而盲目的自信和乐观，是创业者的理性选择。常言道，永远不要低估一个高估自己的人。
  - 作为一等一的赚钱高手，他们早就身心合一了。大家看到他们言语里的不羁，是源自于他们打赢了自己内在比赛。
  - 我的答案是：别跪着学！要俯视！你就是国王，把生财有术的帖子，当成奏折来看。
