  name: 成功是成功之母 —— 用过去的胜利喂养未来的自己
  points:
  - '**为什么需要这个概念？**'
  - '- 传统认知强调“失败是成功之母”，但现实中失败可能反复打击自信、强化自我否定'
  - '- 创业者在低谷期需要一种正向心理循环，而非在失败中反复受挫'
  - '- 潜意识层面的自信需要可复现的路径来持续累积'
  - '**核心定义**'
  - '- 与其相信“失败是成功之母”，不如相信“成功才是成功之母”'
  - '- 过去的成功体验会在潜意识中累积自信，推动后续更大的成功'
  - '**关键性质**'
  - '- 一个成功体验会推动一个又一个成功体验，形成正向循环'
  - '- 成功体验是唤醒潜意识自信的“开关”，可被主动调用'
  - '- 它与“唤醒成功体验法”直接挂钩：先做容易成功的事，制造成功体验以撬动更大成功'
  - '**典型例子**'
  - '- 优秀推销员在一天工作开始前，先找优质客户或推销容易卖的产品，用“成功体验”帮助自己更好地开展一天工作'
  - '- 创业者在做新事情前，回顾并唤醒过往的成功经历，从潜意识层面建立自信'
  - '**边界条件**'
  - '- “成功是成功之母”适用于心理建设与信心累积，不适用于否认失败教训的价值'
  - '- 依赖此心态时需确保过往有真实的成功体验可唤起，而非凭空虚构'
  - '- 它强调的是心态层面的正反馈，仍需要外部的方法论与执行支撑'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 失败不是成功之母，成功才是成功之母。
  - 我一个成功体验，推动一个又一个的成功体验。成功，才是成功之母。
  - 当自己内心很怂、不自信的时候，你需要回顾下自己成功的经历，唤醒自己的成功体验。
  - 比如，一些优秀的推销员，在开展一天的工作时，会先去找一些优质的客户，或者推销一些容易卖的产品，通过这种方式去制造成功体验。这份体验，会帮助他更好地开展一天的工作。
  - 你也一定有成功体验，在做新的事情之前，好好回顾回顾，从潜意识里唤醒它，它会帮助你走得更远。
