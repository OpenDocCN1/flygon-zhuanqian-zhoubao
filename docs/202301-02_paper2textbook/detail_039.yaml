  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 为什么会有懒惰这个东西？本质上，就是没拿到正反馈，如果你每天做的事都有大量的钱进账，比如一天一万利润揣兜里，你说你会懒？你比谁都积极。
  - 但是最核心的是，你不够喜欢。
  - 你不够想，不够想赚钱，不够缺钱。这里有两个突破口，一个是尽快找到自己到底热爱，另一个，找不到也没关系，就是为了钱冲，不别扭，不内耗。
  - 好方向 = 想做 & 能做 & 可做的交集。想做：热爱（非讨厌）的；能做：专业能力所在的；可做：花时间能完成的。
- 'no': 16
  name: 优雅亏大钱法 —— 一条反着读的“保命清单”
  points:
  - '**为什么需要这个概念？**'
  - '- 多数风险警示只讲“应该做什么”，而亏钱的路径往往更为隐蔽且诱人'
  - '- 需要一个极端化、反讽式的框架，帮助读者看清亏损的机制并反面规避'
  - '- 通过“照镜子”的方式，让读者识别自己是否正走在亏大钱的路上'
  - '**核心定义**'
  - '- 以反讽方式系统总结保证亏大钱的三个步骤：①做容易亏钱的事（选少数人能赚钱或看不懂的项目）；②投入足够多的钱（加杠杆或高频交易）；③坚持到底（赚钱不止盈亏钱不止损）'
  - '**关键性质**'
  - '- 反向警示：每条“亏钱步骤”都对应一条应规避的行为'
  - '- 核心逻辑：亏钱方式千差万别但殊途同归——容易亏钱的事 + 足够多的钱 + 坚持不退出'
  - '- 强调“舍弃亏钱即舍弃赚钱”：高手也会亏钱，亏钱是赚钱路上不可缺少的部分'
  - '**典型例子**'
  - '- 坚定选择“只有少数人能够赚钱的项目”——除非天赋异禀，否则大概率亏钱'
  - '- 带一夜暴富的追求、破釜沉舟的气势、一往无前的决断，一次上大仓位最好配杠杆'
  - '- “这一步叫：坚持到底，决不退出。赚钱了不止盈，亏钱了不止损。只有这样才能确保真的亏大钱。”'
  - '**边界条件**'
  - '- 该“方法”是反讽式警示，不可作为实际操作指南'
  - '- 反向操作（严格反着来）也无法保证赚钱，因为亏钱是赚钱路上不可避免的组成部分'
  - '- 适用于风险教育场景，不适用于具体投资决策'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 我的方案可以分成三个步骤：1、做容易亏钱的事。2、投入足够多的钱。3、坚持到底。
  - 坚定选择只有少数人能够赚钱的项目。这样，除非天赋异禀，否则你大概率就是一个亏钱的人。
  - 要带着一夜暴富的追求，伴随破釜沉舟的气势，配上一往无前的决断（XX 跌很多这种事情不可能发生！），一次上大仓位，最好配上杠杆。
  - 这一步叫：坚持到底，决不退出。赚钱了不止盈，亏钱了不止损。只有这样才能确保真的亏大钱。
  - 如果你要问，那我反着来，就能保证赚钱吗？我也希望可以，但很不幸不能，无论多厉害的高手，亏钱是赚钱路上的不可缺少的部分。舍弃了亏钱，就意味着舍弃赚钱。
  - 毕竟，赚钱的方式千差万别，亏钱的方式殊途同归。
