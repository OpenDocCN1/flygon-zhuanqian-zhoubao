  name: 正反馈驱动热爱 —— 懒惰本质上是一笔“没到账的激励”
  points:
  - '**为什么需要这个概念？**'
  - '- 许多人把“懒惰”归因于意志力不足，却忽略了背后缺乏正反馈这一结构性原因'
  - '- 反复用意志力对抗懒惰往往失败，需要从激励机制的层面解决问题'
  - '- 理解正反馈与热爱的循环关系，才能从根本上摆脱内耗'
  - '**核心定义**'
  - '- 懒惰的本质是未获得正反馈；未获正反馈源于做得不够多，而做得不够多的核心原因是不够喜欢'
  - '- 两个突破口：尽快找到自己真正热爱的，或纯粹为钱冲——不别扭、不内耗'
  - '**关键性质**'
  - '- 正反馈（钱、认可、成就感）是驱动持续行动的根本燃料'
  - '- “不够喜欢”与“做得不够多”互为因果，形成负向循环'
  - '- 破局的关键是找到热爱或降低内耗（纯粹为钱）'
  - '**典型例子**'
  - '- “如果你每天做的事都有大量的钱进账，比如一天一万利润揣兜里，你说你会懒？你比谁都积极。”'
