  name: 确定性窗口期 —— 在“数据推演”里捕捉的商业春天
  points:
  - '**为什么需要这个概念？**'
  - '- 创业者常面临“何时入场”的困扰，盲目行动可能踩在错误的时间点上'
  - '- 市场机会有周期性，需要一种可推演的方法识别相对确定的机会窗口'
  - '- 减少不确定性是降低创业风险的关键手段'
  - '**核心定义**'
  - '- 通过历史数据的类比推演，识别一段“相对确定”的市场稳定期与机会窗口'
  - '- 以香港疫情数据为参照：首轮大规模感染后有2-3个月平静期，之后才进入第二波峰值——2023年春天即被判定为确定性窗口期'
  - '**关键性质**'
  - '- 确定性是相对的，基于数据类比而非绝对预测'
  - '- 窗口期具有时效性，错过3-6个月的机会就等同于放弃'
  - '- 可与其他行业数据（旅游、健康、餐饮）联动验证'
  - '**典型例子**'
  - '- 根据香港疫情类比，判断大陆首轮感染后有2-3个月平稳期，因此2023年春天是确定的稳定期'
  - '- 春节国内旅游人次达3亿、恢复至2019年同期的88.6%，出境机票订单涨258%、入境预定量涨632%、国际酒店预定量涨177%——旅游行业春天将爆发'
  - '- 诺特兰德维生素片连续两个月为抖音直播单品销量第一——健康行业带货窗口打开'
  - '**边界条件**'
  - '- 类比推演依赖源数据的可靠性，需警惕数据偏差'
  - '- 确定性窗口期有明确时限，超出该时段即失效'
  - '- 窗口期判断需结合行业特性，不同行业对同一窗口的敏感度不同'
  sources:
  - paper: docs/202301-02/20230207_01.md
    role: origin
  excerpts:
  - 最近 3~6 个月，是比较确定的疫情平稳期，之后才会迎来第二波疫情的峰值。
  - 香港跟大陆一样，也是第一次大规模疫情感染，就把八九成的居民给感染了。之后香港就进入了 2~3 个月的平静期，平静期之后就进入第二波疫情感染。
  - 至少 2023 年的春天，会是一个比较确定的稳定期。
  - 因为这个春天，可能是今年最重要的 3 个月窗口期。
  - 反正我相信春天来了，先干个春天再说。
  - 今年春节国内旅游人次达到 3 个亿，基本上已经恢复到 2019 年同期的 88.6% 了。
  - 出境的机票订单量上涨了 258%，入境的预定量上涨了 632%，国际酒店的预定量同比增长了 177%。
  - 诺特兰德的维生素片保健品，连续两个月是抖音直播的单品销量第一了。
