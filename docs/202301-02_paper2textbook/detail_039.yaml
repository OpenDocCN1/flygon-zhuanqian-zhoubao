  name: 盈利验证与放大法 —— 先赚1块钱，再复制10000遍
  points:
  - '**为什么需要这个概念？**'
  - '- 许多创业者追求完美，导致迟迟无法验证商业模式，错失市场窗口'
  - '- 单一项目的盈利天花板往往有限，需要一套“先跑通再复制”的放大路径'
  - '- 把“盈利的事情重复做”是实现从月入3000到年入百万的关键'
  - '**核心定义**'
  - '- 不要追求完美，用最快速度跑通盈利模型——先用最简单的方式验证商业模式（完成第一单）'
  - '- 把月入3000的号复制30多遍不难，把盈利的事情重复做——哪怕只赚一元钱，只要能无限放大就是年赚百万的项目'
  - '**关键性质**'
  - '- MVP验证优先：第一单是验证商业模式的“里程碑”'
  - '- 复制放大：单点盈利模型必须可复制、可重复才是生意的雏形'
  - '- 盈利模型跑通后，放大手段包括矩阵化、招商加盟、杠杆复用'
  - '**典型例子**'
  - '- “把1个号做到月入10万很难，但是把月入3000的号复制30多遍不难”'
  - '- 找项目与抄同行：以顾客身份套取话术与流量渠道，找到有成熟结果的项目快速复制'
  - '**边界条件**'
  - '- 放大的前提是单点模型健康且可复制，否则会放大亏损'
  - '- 追求速度不等于草率，验证阶段仍需关注核心指标（留存、转化）'
  - '- 适用于已验证的商业模式，不适用于探索性创新'
  sources:
  - paper: docs/202301-02/20230207_05.md
    role: origin
  - paper: docs/202301-02/20230207_03.md
    role: improve
  excerpts:
  - 不要追求完美，用最快速度跑通盈利模型。（先用最简单的方式去验证商业模式是否正确，也就是完成第一单）
  - 把 1 个号做到月入 10 万很难，但是把月入 3000 的号复制 30 多遍不难，把盈利的事情重复做。找到一点点能够获利的机会，再通过放大，将它变成个大生意，哪怕只能赚一元钱，只要他可以无限放大，那他就是一个年赚百万的项目！
  - 同行就是最好的老师，抄同行永远是做项目最快的途径，能避开多数弯路和无用功。
  - 我们以客户的角度去思考如果我想要买这个产品，我会在哪去搜关键词，自然也可以找到同行的流量渠道。
