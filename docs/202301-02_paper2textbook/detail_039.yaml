  name: 时代红利 —— 每一百块钱里，有九十块在“风口上”
  points:
  - '**为什么需要这个概念？**'
  - '- 许多人高估个人能力在成功中的占比，低估环境与趋势的推动作用'
  - '- 识别时代红利能帮助创业者在正确的方向上加倍努力，而非逆风挣扎'
  - '- 回应“努力就有回报”的朴素认知误区，提供更接近现实的解释框架'
  - '**核心定义**'
  - '- 普通人赚取的绝大部分收入来自时代红利，仅有少部分是对个人能力的补偿'
  - '- 英雄是时势的产物，商业英雄是平台与市场红利的产物'
  - '**关键性质**'
  - '- 时代红利与个人能力呈互补关系：红利决定量级，能力决定在红利中的分额'
  - '- 红利窗口具有时效性，识别窗口比单纯提升能力更紧迫'
  - '- 红利时隐时现，需要通过数据推演与行业观察来捕捉'
  - '**典型例子**'
  - '- “可能所有夸张，我们所赚的每一百块钱，有九十块钱是时代红利，仅有十块钱是时代对我们个人能力的补偿”'
  - '- 视频号直播+私域被认为兼具短期爆发力与长期基本盘，正是对时代红利的主动顺应'
  - '**边界条件**'
  - '- 时代红利论不否定个人努力的价值，只是重新校准了成功归因的权重'
  - '- 该概念适用于解释宏观层面的财富分配，不适用于指导单次微观决策'
  - '- 红利是客观存在但稍纵即逝的，识别与抓住红利都需前置行动'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  excerpts:
  - 可能所有夸张，我们所赚的每一百块钱，有九十块钱是时代红利，仅有十块钱是时代对我们个人能力的补偿，英雄只是时势的产物。
  - 近年来，因为现在信息传递越来越快了，项目红利期是越来越短的。所以我就在思考，怎么样能长短线结合，又有短期的爆发力，又有长期的基本盘。目前看，视频号直播+私域是有这个属性的。
  - 执行力是值钱的，执行力是可以变现的，我想奖励执行力；邀请我去生财办公室这何尝不是对我的执行力的一种奖励。
  - 亦仁大概花了 7W 买了她坚持 4 个月加了 4000 多好友的微信号。
- 'no': 6
  name: 实时真实ROI —— 把私域产值算进投放账本的“复利眼”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统ROI只计算直播间直接的广告回报，系统性低估了私域流量的长期价值'
  - '- 投放决策依赖精确的投产比，错误的算法会导致广告预算配置失当'
  - '- 需要一种综合核算方法，把公域引流与私域复购统一到同一本账上'
  - '**核心定义**'
  - '- 将私域流量产生的额外年产值计入投放产出后，综合计算得到的投产比'
  - '- 公式：纯直播间利润 = q*z - y；加入私域后纯利润 = 每月 q*z-y + z/n×60%×p'
  - '**关键性质**'
  - '- 私域进线率60%为合格线，直接影响私域产值的计算'
  - '- 月产值（p）与递减率（前3个月按80%算，后续看维护）共同决定长期ROI'
  - '- 私域产值是不需要额外投放的“免费增量”'
  - '**典型例子**'
  - '- 150客单价产品、进粉率60%、月产值8-15元时：只做直播ROI为2.5，加入私域后提升至3.5，月产值翻倍则可达4.5'
  - '- 视频号直播一小时可加到私人微信近200人，生财新年预约51个、加曹大星球49个——公转私的效率直接拉高综合ROI'
  - '**边界条件**'
  - '- 公式依赖稳定的私域进线率与月产值数据，需持续追踪维护'
  - '- 适用于直播+私域联动的业务模式，不适用于纯公域一次性变现'
  - '- 递减率假设（前3个月80%）基于经验，不同行业需自行校准'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  excerpts:
  - roi2.5 也就是我 100 万的营业额，需要有 40 万的广告投放，那么在这 40 万的投放算到私域中，我将额外有 100 万×60%×60/150=24
    万的私域营业额，这一块是无需投放的……这么一算我的 roi 就从 2.5 提升到了 3.5。
  - 做一个公式：客单价 n 的产品，毛利率如果是 q，投入 y，直播间除去退货后营业额为 z。私域进线率 60%为合格，月产值为 p。那么你只做直播间纯利润就是
    q*z-y；做私域后纯利润就是 q*z-y 每个月加上 z/n×60%×p，月递减前 3 个月按 80%算，后面看维护。
  - 我们 150 客单价的产品，进粉率 60%的情况下，月产值只能做到 8……年产值算完衰减，能到 60。
  - 昨天开了个直播，一小时吧，加到私人微信近 200 人，生财新年预约人数 51 个，加曹大星球 49 个。
- 'no': 7
  name: 捡漏群 —— 用“1-3折”把羊毛党变成现金流的社群引擎
  points:
  - '**为什么需要这个概念？**'
  - '- 传统电商获客成本高企，需要一种低成本、高转化的私域变现模式'
  - '- 用户对“低价好物”有持久需求，但缺乏可持续的供给与信任渠道'
  - '- 社群运营需要一套标准化的选品、排品与氛围营造方法'
  - '**核心定义**'
  - '- 通过企业微信建立社群，以原价1-3折的超高性价比商品吸引用户，通过佣金变现的电商模式'
  - '- 每天精推一个主品，配置30-50个“演员”营造抢购氛围，配合4-6次递进式催单'
  - '**关键性质**'
  - '- 核心要素：稳定的企微主体、靠谱且稳定的流量、精细化的社群运营、规模大小、多重变现'
  - '- 演员是社群的灵魂：有演员和没演员的社群产出起码相差一半以上'
  - '- 单品产出可极大化，且不造成选品困难'
  - '**典型例子**'
  - '- 今年新起的盘不到1000个群，月佣金100W+；行业有团队社群数量过万，月佣数千万'
  - '- 回本后单群单日产出约30元：100个群一天3000利润，1000个群一天30000，一个月90W'
  - '**边界条件**'
  - '- 社群有生命周期（约2年），需持续注入新流量'
  - '- 演员配置是隐形成本，需要精心管理以防穿帮'
  - '- 单群成本3500-10000元，回本周期2-3个月，需要资金垫付能力'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  excerpts:
  - 捡漏群：用户在我们的群里可以用原价的 1-3 折买到超高性价比的商品。…… 能通过售卖商品来产出佣金，实现变现。
  - 目前这种模式不仅能将单品的产出发挥到极致，还不会造成选品的困难。
  - 一个群必须有 20 个以上的演员，确保整个群的发品节奏。演员是捡漏群的灵魂，有演员和没演员的情况，社群产出起码相差一半以上。
  - 捡漏群的商业闭环：通过免费/付费的引流，将目标用户从各大平台引流到企业微信，再拉到 500 人大群里，通过售卖商品来产出佣金，实现变现。
  - 核心要点：稳定的企微主体、靠谱且稳定的流量、精细化的社群运营、社群的规模大小，以及多重变现方式。
  - 目前今年新起的盘不到 1000 个群，月佣在 100w+。
  - 回本之后，单群单日产出 30 来讲，假设有 100 个群，一天就是 3000 利润，有 1000 个群，一天就是 30000，那么一个月就是 90W。
  - 假设一个社群 7000 成本，3 个月回本，之后每个月可以产生 1000 的利润，21 个月还能产生 2.1W 的纯利润。
- 'no': 8
  name: 私域单客价 —— 从“一锤子买卖”转向“一辈子生意”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统电商以“客单价”衡量单次交易价值，忽视了用户长期贡献的潜力'
  - '- 获客成本高企，与其不断拉新，不如深耕已有用户的终身价值'
  - '- 私域运营需要一套以用户生命周期为核心的价值衡量指标'
  - '**核心定义**'
  - '- 在私域流量运营思维下，关注单个消费者长期贡献的总销售额（单客价）'
  - '- 通过拉长用户生命周期和增加复购来提升整体销售额，而非仅关注单次客单价'
  - '**关键性质**'
  - '- 单客价 = 单次客单价 × 复购次数 × 用户生命周期长度'
  - '- 与“复购比拉新更重要”的理念一脉相承'
  - '- 衡量的是整个私域资产的质量而非短期交易规模'
  - '**典型例子**'
  - '- 2万私域精准宝妈好友完成7000单胎毛纪念品变现，并结合副业培训、无货源、淘客等实现总计超100万变现——单客价远超单次客单价'
  - '- 视频号直播+私域模式中，私域端在无额外投放的情况下持续产出年产值，正是单客价思维的直接体现'
  - '**边界条件**'
  - '- 适用于有复购属性或可延伸需求的产品，不适用于一次性高额低频消费品'
  - '- 需要持续的用户维护投入（内容、服务、关怀）以拉长生命周期'
  - '- 单客价的提升依赖信任关系，急功近利的过度推销会反而缩短生命周期'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  excerpts:
  - 电商有个'客单价'的概念，而在私域流量运营的思维下，真正值得关注的不是'客单价'，而是'单客价'，就是一个消费者总共贡献了多少销售额。
  - 结果从抖音导流 2 万私域的，都是精准的宝妈好友，完成了 7000 单的胎毛纪念品变现。
  - 在副业赚钱上变现大概有 30 万左右。
  - 从抖音导流 2 万私域…… 总计超100万变现。
- 'no': 9
  name: 渣男思维做内容 —— “撩完就跑”和“广撒网”的爆款心法
  points:
  - '**为什么需要这个概念？**'
  - '- 许多创作者陷入“自嗨式”输出，内容质量高却缺乏用户共鸣与转化'
  - '- 平台竞争激烈，需要一种更高命中率的内容策略'
  - '- 传统“垂直深耕”思维限制了内容的覆盖面与传播潜力'
  - '**核心定义**'
  - '- 借用“渣男”的恋爱行为比喻内容创作的两大原则：撩完就跑（戳中痛点/痒点即停，利用峰终定律让用户在情绪最高点意犹未尽）与广撒网（在多个圈子多平台发内容提高命中率）'
  - '- 垂直垂的是人群而非内容题材'
  - '**关键性质**'
  - '- 峰终定律是核心心理学支撑：开头和结尾愉悦则整体体验愉悦，中间内容可粗糙'
  - '- 撩完就跑制造好奇与关注，广撒网扩大概率'
  - '- 爆过的内容一定可以再爆，内容创作不靠灵感靠爆款模板'
  - '**典型例子**'
  - '- 展示有钱人生活的视频：开头无边泳池、结尾美妙画面收尾，中间剪辑粗糙仍获大量点赞'
  - '- 一篇“做个人ip的40个APP”仅列名字不教用法，成功戳中想做IP的痛点引发关注'
  - '- 作者劲猫曾用20分钟做出10万赞藏大爆文，1万粉丝变现20万；小红书3个月从0涨粉8000、变现5万'
  - '**边界条件**'
  - '- 渣男思维适用于公域内容引流场景，不适用于需要深度信任的私域成交环节'
  - '- 撩完就跑需要把握分寸，过度“渣”会损坏个人品牌信誉'
  - '- 广撒网需建立在内容质量不低的基础上，否则只是无效的广泛分发'
  sources:
  - paper: docs/202301-02/20230207_05.md
    role: origin
  excerpts:
  - 今天我来分享渣男思维做内容，让你们变成自媒体世界的渣男！
  - 做渣男第一点：撩完就跑。戳痒点，意犹未尽。…… 咱们撩到用户的痒点就停，峰终定律，在情绪最高点停止，才能让人意犹未尽，印象最好。
  - 做渣男第二点：广撒网。渣男怎么养鱼的？当然是混多个圈子……所以，咱们做内容也需要广撒网，提高自己的内容命中率。
  - 要注意，咱们垂直，并不是垂直内容，不是说你做母婴领域，你就天天发育儿相关的内容。咱们垂直垂的是人群。
  - 有个定律，叫做峰终定律：如果在一段体验的高峰和结尾，体验是愉悦的，那么对整个体验的感受就是愉悦的。
  - 爆过的内容一定是可以再爆的，内容创作不要靠灵感，要靠爆款模板！
  - 我是劲猫，曾经 20 分钟做出过 10 万赞藏大爆文，1 万粉丝变现 20 万。
  - 听生财小伙伴说大家在共读我之前写过的一篇文章《自媒体小白做小红书 3 个月，从 0 涨粉 8000 粉，变现 5 万》。
- 'no': 10
  name: 逆向思考法 —— 从“先找买家”开始的变现倒推术
  points:
  - '**为什么需要这个概念？**'
  - '- 传统创业流程“定位→内容→流量→产品→变现”周期长、风险高，可能投入巨大却无人买单'
  - '- 许多创作者先做内容再想变现，导致流量无法转化为收入'
  - '- 需要一种以终点为起点的思考方式，确保每一步都服务于最终成交'
  - '**核心定义**'
  - '- 以结果为导向逆向拆解需要的步骤，确定最小行动单元'
  - '- 正常流程：定位→内容→流量→产品→变现；逆向流程：变现→定位→产品→内容→流量——先找买家，再找产品'
  - '**关键性质**'
  - '- 变现路径前置，保证内容与产品始终围绕付费需求'
  - '- 强调“先找需求”再投入研发与生产'
  - '- 与“MVP先卖后做”理念一脉相承：用最小成本验证需求'
  - '**典型例子**'
  - '- “先找买家，再找产品！”——先通过市场调研确认目标用户愿意为何付费，再针对性开发产品'
  - '- 做个人IP前先确定变现方式（如咨询、课程、社群），再决定内容定位与流量获取策略'
  - '**边界条件**'
  - '- 逆向思考需要一定的市场敏感度，否则可能倒推出伪需求'
  - '- 适用于可预见的变现路径（如知识付费、电商），不适用于探索性创新'
  - '- 需在逆向拆解后仍保留用户反馈的调整空间，避免过度僵化'
  sources:
  - paper: docs/202301-02/20230207_05.md
    role: origin
  excerpts:
  - 以结果为导向，逆向思维需要的步骤，拆解出最小行动单元。正常流程：定位→内容→流量→产品→变现，我们可以以结果倒推内容：变现→定位→产品→内容→流量。先找买家，再找产品！（也可以理解为先找需求），一定要先考虑好怎么变现，然后再去开展业务，一定会事半功倍。
  - 不要追求完美，用最快速度跑通盈利模型。（先用最简单的方式去验证商业模式是否正确，也就是完成第一单）
  - 把 1 个号做到月入 10 万很难，但是把月入 3000 的号复制 30 多遍不难，把盈利的事情重复做。找到一点点能够获利的机会，再通过放大，将它变成个大生意，哪怕只能赚一元钱，只要他可以无限放大，那他就是一个年赚百万的项目！
- 'no': 11
  name: 增长瓶颈怪圈 —— “被想拥有的东西绑架”的恶性循环
  points:
  - '**为什么需要这个概念？**'
  - '- 许多企业面临增长停滞时，越努力反而离增长越远，陷入自我怀疑与压榨的死循环'
  - '- 传统诊断聚焦于外部环境，忽略了“追求增长”这一心态本身可能成为障碍'
  - '- 需要用一套认知框架解释“为什么盯着目标反而够不到目标”的反常现象'
  - '**核心定义**'
  - '- 当企业或个人被增长的预期绑架，会陷入越追求增长反而距离增长越远的恶性循环'
  - '- 典型表现为：投机跟风而非开创、计算利弊而非关注用户、抓取资源而非积累价值'
  - '**关键性质**'
  - '- 核心机制：被想拥有的东西（增长预期）绑架，导致行为短视化'
  - '- 与FOMO心理（错失恐惧）强相关，进一步加剧焦虑与内耗'
  - '- 破局唯一方法是视角切换：从“追求增长”转向“价值创造”'
  - '**典型例子**'
  - '- “进入增长瓶颈的一个典型现象，就是越想要增长，却距离想要的增长越远”'
  - '- 柯达自认成功源于坚持成像品质，却错失数码相机趋势——用过去定义自己导致失去未来'
  - '- 宜家让顾客“一天之内拥有一个家”的核心需求被误读为“提高门店时长”，学其表面模式而不得其根本'
  - '**边界条件**'
  - '- 该概念适用于解释长期性增长停滞，不适用于短期波动或偶发业绩下滑'
  - '- 视角切换需要三种勇气（面向未来/面向用户/积累价值），并非一蹴而就'
  - '- 警惕将“不追求增长”误读为“躺平”，价值创造视角本身仍追求增长，只是换了一种路径'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 进入增长瓶颈的一个典型现象，就是越想要增长，却距离想要的增长越远。
  - 如果用一句话来形容这种现象，那就是我们被我们想拥有的东西绑架了。
  - 再进一步的恶性循环，就是觉得这些问题的原因是自己还不够狼性、不够拼搏，所以不断压榨自己、逼迫自己，让自己活在一个焦虑紧张和对失去的害怕中（业界常说的话就是
    FOMO 心理），让自己更加难以去做自己热爱的事情，更加难以去专注，从而进一步失去优势。
  - 当一个人被增长的预期绑架，就会失去这些习惯，他会变得投机一样地去跟随对手而非做开创性事情，会天天计算自己的利弊得失而非去关注用户，会抓取身边的资源、流量而非积累价值，这些都让他距离增长越来越远。
  - 柯达认为自己成功的重要法门是坚持成像的品质和性能（这个 belief 也在一定程度上限制了它们进入更加便捷但是成像品质相对低的数码相机市场）。
  - 一个家具公司，按照对标研究，需要提高门店的顾客时长，所以学习宜家，做多品类的体验式门店。但忽略的是，宜家的出发点并不是提高顾客的时长，而是怎么解决当时它崛起时最重要的客户需求——当我搬到一个陌生的城市，如何一站式的在一天之内拥有一个家？
- 'no': 12
  name: 价值创造视角 —— 从“索取增长”到“配得上增长”的三步切换
  points:
  - '**为什么需要这个概念？**'
  - '- 破解增长焦虑不能靠更努力地“追求增长”，而是需要根本性的视角切换'
  - '- 许多企业在瓶颈期采用的“对标、赶超”等策略，其实都停留在追求增长的思维框架内'
  - '- 需要一套可操作的心智模式，引导创业者回到价值创造的本质'
  - '**核心定义**'
  - '- 从“我如何得到增长”切换为“我如何成为一个值得被奖赏增长的人”'
  - '- 核心是三个维度的勇气切换：面向未来（而非面向过去）、面向用户（而非计算利弊）、积累价值（而非抓取资源）'
  - '**关键性质**'
  - '- 转化看待问题的方式（而非解决问题本身）往往才是最关键的'
  - '- 面向未来：只有认为未来的自己更大，才能洞察趋势并开创未来'
  - '- 面向用户：把“我如何解决用户的问题”放在第一位，答案更容易浮现'
  - '- 积累价值：识别当前环境中最稀缺、最不流动的资产（品牌、数据、人才、信任）并持续投入'
  - '**典型例子**'
  - '- 鉴真、贝聿铭等不断自我革新的人，始终面向未来而非守在过去成就上'
  - '- 茅台在八项规定后不降价砸牌，认为品牌是最重要的资产，最终维持高端心智'
  - '- 美国对苏“强加成本”战略：所有行动都遵循“让苏联增加成本”的指导原则，而非直接追求某一具体目标'
  - '**边界条件**'
  - '- 视角切换需要“勇气”，意味着它反直觉且需要刻意练习'
  - '- 适用于陷入增长瓶颈的成熟企业与个人，不适用于从零起步的简单业务'
  - '- 强调不流动的稀缺资产，但识别“什么是真正稀缺不流动的”仍依赖判断力'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 我发现，破除增长焦虑唯一的方法，就是怎么从追求增长的视角，切换成价值创造的视角。
  - 从一个'我如何得到增长'，变成'我如何成为一个值得被奖赏增长的人'。
  - 转化看待问题的方式，而非解决问题本身，往往才是最关键的办法。
  - 真正要去摆脱这种视角，最难的不在于方法论，而是 3 种'勇气'：面向未来而非面向过去的勇气；面向用户而非计算利弊的勇气；积累价值而非抓取资源的勇气；
  - 面向未来而非面向过去：只有觉得未来的自己更大，远比过去已经创造出来的自己要大，才能真正洞察到趋势，并且不断去开创未来。
  - 面向用户而非计算利弊：把视角切换为'我如果想要去解决用户的问题，应该怎么做？'，就会发现，答案更容易找了。
  - 积累价值而非抓取资源：识别在我当前的环境中，最稀缺的、最不流动的是什么，如果整体的优化目标本着这些，就会形成正向的价值积累。
  - 八项规定后大量的中高端白酒品牌，降价砸了牌子，几乎只有茅台认为品牌才是最重要的资产，不会用品牌和品质的牺牲去换销售额。
- 'no': 13
  name: 信息差生意 —— 在你身边“闷声发大财”的隐藏金矿
  points:
  - '**为什么需要这个概念？**'
  - '- 多数人以为赚钱机会都在网上“热门项目”里，却忽略了身边真实存在的低竞争机会'
  - '- 信息不对称是无处不在的套利空间，但需要用独特的视角去发现'
  - '- 网上流传的赚钱项目往往已过时或竞争饱和，缺乏信息差的优势'
  - '**核心定义**'
  - '- 赚钱的机会往往隐藏在身边，源于多数人没有发现的“信息差”'
  - '- 先有闷声发大财，网上说做什么小项目月入多少的基本已过时'
  - '**关键性质**'
  - '- 信息差 = 你知道而别人不知道的路径/渠道/认知'
  - '- 机会的隐蔽性决定了其低竞争高利润的属性'
  - '- 一旦被公开传播，信息差红利迅速消失'
  - '**典型例子**'
  - '- 苏州ao图文专做广告牌开了70家店，一块牌子3000-5000块，一个月15块牌子收入约7W'
  - '- 四线城市烤面筋一天卖600串，日收入2000多，节假日更高'
  - '- 大学生朋友圈卖螃蟹，差的月份7000-8000元，吃螃蟹季节月入2W-3W'
  - '**边界条件**'
  - '- 信息差生意规模往往有限，难以形成大规模复制'
  - '- 需要持续挖掘新的信息差，旧的很快会被抹平'
  - '- 发现信息差依赖对身边生活的敏感观察，而非远程追逐热点'
  sources:
  - paper: docs/202301-02/20230207_07.md
    role: origin
  excerpts:
  - 身边赚钱的机会其实还是很多的，只是你没有发现，这个就是大家所说的信息差。
  - 先有闷声发大财，网上说做什么小项目一个月可以赚多少钱的，基本是已经过时了。
  - 对于赚钱这件事，真的需要你从身边挖掘发现，而不是在网上听谁说赚钱。
  - 苏州有一家叫 ao 图文的，就只做广告牌子，现在开了有 70 家店……一块牌子 3000-5000 块，生意稳定……一个月 15 块牌子，也要 7w 块了。
  - 四线城市做烤面筋……一天卖 600 串左右，一天的收入在 2000 多，节假日更多。
  - 小姐姐也没有天天广告漫天……差一点一个月 7000-8000 左右，到了吃螃蟹的季节，一个月 2w-3w 不等。如果按照一年平均 1.2w 算。
- 'no': 14
  name: 战略即选择 —— 最重要的不是做什么，而是不做什么
  points:
  - '**为什么需要这个概念？**'
  - '- 许多创业者把“设定宏大目标”误当作战略，导致方向模糊、资源分散'
  - '- 面对众多可能性，缺乏取舍框架会在执行中不断摇摆'
  - '- 战略的稀缺性不在于做更多，而在于拒绝更多'
  - '**核心定义**'
  - '- 战略的本质是取舍和选择，关键决策在于明确不做什么'
  - '- 战略应形成自始至终的指导原则，并发挥自身禀赋（不能选择劣势作为战略方向）'
  - '**关键性质**'
  - '- 目标是战略的对象或结果，但目标本身不是战略'
  - '- 战略=选择=有所不为：拒绝诱惑与偏离是战略纪律的核心'
  - '- 战略需发挥禀赋：以己之长攻人之短，而非以己之短追人之长'
  - '**典型例子**'
  - '- “什么是战略呢？就是选择。选择，其最重要的就是不做什么，而不是做什么。”'
  - '- 美国对苏“强加成本”战略：所有行动都遵守“让苏联增加成本”这一指导原则，从毒刺导弹到压油价，目的明确而手段灵活'
  - '- 老乡鸡与南城香比拼标准化、品牌力是误区，小餐馆应发挥人情味、现炒等自身禀赋优势'
  - '**边界条件**'
  - '- “不做什么”的前提是已明确“要做什么”，否则只是消极不作为'
  - '- 战略指导原则需保持稳定，频繁更迭则失去指导意义'
  - '- 禀赋的识别需客观，自我认知偏差会导致战略建立在虚构优势上'
  sources:
  - paper: docs/202301-02/20230207_03.md
    role: origin
  - paper: docs/202301-02/20230207_07.md
    role: improve
  excerpts:
  - 什么是战略呢？就是选择。选择，其最重要的就是不做什么，而不是做什么。
  - 首先，战略目的是让你能获得优势或者获得相对优势。
  - 其次，战略应该形成一种自始至终的指导原则。
  - 还有一个呢，就是战略需要发挥你的禀赋。你要是跟老乡鸡、南城香比卫生、标准化、品牌力，那就错了。你应该提升你的人情味、现炒等等。这就是不能选择你的劣势来做战略方向。
  - 比如读书群里有人说他的战略是：帮助一万个人赚到钱。这就是对战略的一个巨大误解。因为帮助一万人赚到钱，这是一个目标，它不是战略。
  - 你看，美国所有的行动，都是遵守一个战略指导原则，就是让苏联增加成本。这叫做'强加成本'战略。
