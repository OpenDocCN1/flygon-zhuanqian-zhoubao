learning_targets:
- 理解流量价值公式的三要素（规模、相关性、信任度）及其乘法关系
- 掌握公域引流私域变现的核心心法与操作链路
- 学会用流量切片分析法拆解横向来源与纵向用户路径
- 洞察流量流速悖论，掌握“不快不慢、持续不断”的流速控制技巧
- 建立交易目的论思维，砍掉无互动无转化的虚荣指标动作
- 掌握流量合并术，学会用“让流量主赚更多钱”整合存量流量
- 理解私域单客价思维，从关注单次客单价转向用户全生命周期价值
- 会算实时真实ROI，把私域累计毛利纳入投放决策模型
- 掌握捡漏群模型的选品、排品、演员、催单标准化运营SOP
- 熟练使用视频号直播引流工具箱（企微弹出、金句卡片）实现丝滑获客
- 能按五位一体成交飞轮拆解高客单价私域成交的五步标准动作
- 辨析内容价值金字塔三层，明确“给方法”才是个人IP最高护城河
- 内化渣男思维做内容：撩完就跑（峰终定律）+ 广撒网（垂人群不垂内容）
- 掌握MVP先卖后做验证法，用预售/定金在低成本下筛选真需求
- 学会商业拆解复制法，从同行全链路中抄作业、避坑、快速变现
- 会做资源匹配度评估，用“手里牌能不能打这盘棋”决策是否入局
- 了解无人直播技术护城河：硬件盒子规避风控 + 真实素材极致拟真
- 掌握视频号无货源店群矩阵思维，用数量对抗不确定性
- 理解社群分销增长公式：供应链×顶层设计×动员能力的乘法模型
- 会用抖音爆单承接法：爆了即“复制-合集-直播”三连击承接流量
- 认知热点套利技术栈：预建设基础设施，十分钟上线抢占入口
- 分清买卖-生意-商业三层级，看清自己在哪一层、如何跃迁
- 对号入座财富积累四阶段与人生四阶段，认清当下核心任务与杠杆
- 确立刚需生意观：非刚需不碰，项目本性成就人
- 掌握高净值客户销售破局法：抓住“失去掌控权”核心痛点
- 会算发圈动力公式，挖掘产品社交货币价值降低分销员社交压力
- 建立劳动合同合规体系：合同是枪、附件是子弹，证据链闭环
- 掌握股权顶层设计四要素：控制权、进入、分配、退出机制设计
- 理解三会一层治理架构：战略稳于执行，治理层决定生死
- 跟随平台生命周期调整投放策略：增长期激进、存量期合规深耕
- 落地OKR制定与执行要点：战略坚定、KR推动O、MVP验证、高频同步
- 打赢内在比赛：盲目自信、成功是成功之母、唤醒成功体验、俯视学习
- 践行战略发挥优势法：先盘点筹码、再决定怎么打牌
- 信奉利他即利己：越分享越幸运，蛋糕分不完
- 保持时代红利认知：九成钱是时代给的，别把运气当本事
- 认可执行力变现论：执行力是稀缺资产，可定价、可交易、可融资
concept_map:
- 第36章 综合商业认知与实操体系
- ├── 流量认知与运营体系
- │   ├── 流量价值公式（规模×相关性×信任度）
- │   ├── 公域引流私域变现（五句心法：定位→人群→内容→流量→转化→模式）
- │   ├── 流量切片分析法（横向来源/纵向路径 → 可执行干预动作）
- │   ├── 流量流速悖论（不快不慢、持续不断、核心增停留）
- │   ├── 交易目的论（曝光无价值、互动是硬通货、以交易为北极星）
- │   ├── 流量合并术（让流量主赚更多钱 → 获其积累流量）
- │   ├── 私域单客价思维（LTV > AOV、进线率/月产值/留存衰减曲线）
- │   ├── 实时真实ROI（直播毛利+私域累计毛利 / 广告投入）
- │   ├── 捡漏群模型（1-3折标品+30-50演员+4-6轮催单+矩阵规模）
- │   ├── 视频号直播引流工具箱（企微弹出/金句卡片，不跳环境，小时加200人）
- │   ├── 五位一体成交飞轮（破冰→诊断→方案→信任→成交，解决三个为什么）
- │   ├── 内容价值金字塔（娱乐<工具<方法，核心=价值交换）
- │   └── 渣男思维做内容（撩完就跑/峰终定律 + 广撒网/垂人群不垂内容 + 模板化/逆向思考）
- ├── 项目验证与复制体系
- │   ├── MVP先卖后做（卖想法验证需求、聊100人20-30人付定金即成立）
- │   ├── 商业拆解复制法（刷视频找案例→拆全链路→判可复制性→低成本复制）
- │   ├── 资源匹配度评估（盘点资源→拆解需求→匹配度>项目好坏）
- │   ├── 无人直播技术护城河（硬件盒子伪装摄像头+真实素材拟真+单场百万GMV）
- │   ├── 视频号无货源店群（旗舰店/入池→优选联盟→采集铺货→矩阵≥5店对抗不确定性）
- │   ├── 社群分销增长公式（供应链×顶层设计×动员能力，冷启动=选品+核心节点）
- │   ├── 抖音爆单承接法（视频爆→同内容再发+建合集→流量/带货双路→立即开直播双频共振）
- │   └── 热点套利技术栈（预建域名/号/服务/API/支付→热点来10分钟上线→抢名/搜索流量）
- ├── 认知升维与阶段地图
- │   ├── 买卖-生意-商业三分论（出卖劳动力→代理商差价→可复制模式/品牌/股权）
- │   ├── 财富积累四阶段（出卖劳动力→一份时间多卖→买他人时间→钱生钱）
- │   ├── 人生四阶段（初入职场扩广度→中年做管理→第二曲线找MVP→复制商业放大）
- │   ├── 刚需生意观（非刚需不碰、链条短/频次高/替代难/项目本性成就人）
- │   ├── 时代红利认知（百块钱九十块红利、英雄是时势产物、识别/上车/下车）
- │   └── 执行力变现论（执行力=稀缺资产、可定价/交易/融资、可训练/量化/复利）
- ├── 高客单销售与分销体系
- │   ├── 高净值客户销售破局法（买家/卖家系统博弈→抓“失去掌控权”痛点→好奇/痛点升维/灵魂三问）
- │   ├── 发圈动力公式（佣金/社交压力、挖掘社交货币价值、正向价值观产品自发传播）
- │   └── 社群分销佣金分配逻辑（一级高稳一线、二级高猛招商、动态平衡）
- └── 组织治理与风控底线
- '    ├── 劳动合同合规体系（合同+考核表+规章+廉洁+保密=枪+子弹、及时签/考核留痕/离职谈话）'
- '    ├── 股权顶层设计四要素（控制权给操盘担责者、资金溢价/资源对赌/技术专利/全职时间入、静态+动态分、锁定期/回购价/优先清算）'
- '    ├── 三会一层治理架构（股东会/董事会/监事会/高管层、权力流向、战略是三会一层的事）'
- '    └── 平台生命周期投放策略（铺货/动销/精细化/玩趋势四阶段、增长期激进/存量期合规、淘系经验映射新平台）'
life_analogy:
- 想象做生意就像**开一家实体店**的完整生命周期：
- '- **流量价值公式** = **店铺选址（规模） × 卖对人爱买的东西（相关性） × 老板人品好让人敢买（信任度）**，三个乘法，缺一不可。'
- '- **公域引流私域变现** = **在商场（公域）发传单拉人进自家会员群（私域），以后天天在群里发特价、唠家常、卖回头客**，流量归自己、想卖就卖。'
- '- **流量切片分析法** = **老板每天不看总营业额，而切片看：早市来的多还是晚市来的多（横向）；进店顾客先摸哪件、试穿多久、为啥不买走人（纵向）**，才知道去哪补货、改陈列。'
- '- **流量流速悖论** = **进店人太多挤不动（太快）没人能细看、结账排长队跑单；太冷清（太慢）房租摊不薄。要像调水龙头，控进店节奏、留住人、保持稳定流动**'
- '- **交易目的论** = **光有路过围观（曝光）没人进店、进店不试穿不问价（无互动）纯属瞎忙、甚至挡道（负价值），只有掏钱买单（交易）才是目的**'
- '- **流量合并术** = **隔壁大餐馆天天排队，我给老板算账：卖我家酱料/甜点一个月多赚20万 vs 你收我2万广告费？大餐馆流量瞬间为我所用**'
- '- **私域单客价思维** = **别盯着单次卖多少钱（客单价），要算这顾客一辈子在你这花多少钱（单客价），做会员卡、办预付、搞复购、拉生命周期**'
- '- **实时真实ROI** = **广告投100块，当天卖货回本80块（直播ROI 0.8）看似亏，但加上这批客户后续一年在群里复购带来的200块利润，真实ROI瞬间变2.8，老板敢砸钱投流**'
- '- **捡漏群模型** = **开个“内部福利群”，天天发1-3折大牌捡漏品，安排30个托（演员）疯狂抢、晒单、催单，真客户跟着买、怕买不到，群寿命2年、投资回报率3-4倍**'
- '- **视频号直播引流工具箱** = **直播时点一下“弹企微名片/发金句卡片”，观众不用跳出直播间、一点就加好友进群，一小时加200精准粉，丝滑不掉线**'
- '- **五位一体成交飞轮** = **卖房/卖保险/卖高客单课的标准动作：先聊天搞关系（破冰）→ 问痛点挖坑（诊断）→ 给方案画饼（方案）→ 甩案例压担子（信任）→
  限时优惠逼单（成交），解决：为啥买、为啥找你买、为啥现在买**'
- '- **内容价值金字塔** = **底层讲段子逗乐（娱乐，涨粉快变现难）、中层发工具/资料/模板（工具，实用引流）、顶层讲方法论/认知/体系（方法，建IP护城河、高客单高复购），新手建议从中层起步**'
- '- **渣男思维做内容** = **“撩完就跑”=文章开头最爽/结尾悬念引导加微信（峰终定律），中间水点没关系；“广撒网”=一条内容改5个标题发5个平台/群，垂直的是精准人群画像不是题材**'
- '- **MVP先卖后做** = **没做产品先发朋友圈/群收定金：“正在研发，创始用户9.9元锁终身权益，仅招20人”，聊100人20人付款→立马开工，没人付→止损改下一个，一周测几十个**'
- '- **商业拆解复制法** = **刷抖音/小红书看到同行卖得好 → 以客户身份套话术/加微信看私域/拍素材/找货源 → 确认货源非独家/场景真有需求 → 照抄照搬微调
  → 快速出单**'
- '- **资源匹配度评估** = **想做抖音带货，先盘点手里牌：有选品能力？有供应链？有主播？有运营？有投流钱？缺核心牌还硬上 = 裸奔送死；匹配度高才动手**'
- '- **无人直播技术护城河** = **造个“黑盒子”插电脑伪装成摄像头（过风控），里面循环播“找商家合作录的真实直播间实景”（骗过人眼），单场卖116万，成本几千块硬件**'
- '- **视频号无货源店群** = **视频号后台货少、缺货源。我买几个商标授权开5-10家旗舰店，用采集器把拼多多/1688便宜货铺上去，达人带货/自然流出单，拼多多代发赚差价，矩阵对抗不确定性**'
- '- **社群分销增长公式** = **收入 = 供应链强度（标品比价/非标发圈转化） × 顶层设计（佣金/裂变/升级机制） × 动员能力（对团队影响力）。冷启动不靠运营，靠找1-2个核心大V带头裂变**'
- '- **抖音爆单承接法** = **视频爆了当天：①马上重剪同内容发新视频+建合集带爆新作 ②流量版/带货版双视频跑 ③立马开直播承接精准购买意向，双频共振，延长爆款寿命**'
- '- **热点套利技术栈** = **平时把域名、服务器、公众号、小程序、支付、API、发布流程全跑通“预建设”。ChatGPT火了→10分钟写代码接API→10分钟套娃小程序上线→抢占“ChatGPT中文版”名字→吃尽搜索红利**'
- '- **买卖-生意-商业三分论** = **第一层“买卖”：自己干活赚辛苦钱（自由职业/主播）；第二层“生意”：招代理/员工/分销赚差价钱（蜜雪冰城加盟）；第三层“商业”：建可复制模式/品牌/股权赚时间钱/溢价钱（茅台/腾讯），不可跳跃**'
- '- **财富四阶段&人生四阶段** = **30岁前打工积累技能本金（出卖劳动力/扩广度）→ 30岁后做管理拉高度（买他人时间/中年危机）→ 主业外找副业跑MVP（第二曲线）→
  跑通组团队放大融资（复制商业/钱生钱），阶段不可跳**'
- '- **刚需生意观** = **只做“不买会难受、不买有损失、买了立竿见影”的事（考公资料/牙套/贷款/升学）。作者10年4次创业失败、负债百万，总结：非刚需链条太长推不动，项目本性成就人**'
- '- **高净值销售破局法** = **富人最大痛点=“失去掌控权/恐惧源于未知”。别按套路挖需求（进买家系统被撒谎），先反问/布置功课引好奇→把“买保险”升维成“守家族掌控权/传承确定性”→聊孩子/谈自己/谈传承建依赖**'
- '- **发圈动力公式** = **动力 = 佣金 ÷ 社交压力。卖书发圈=展示“爱学习好妈妈”人设（社交压力为负值=正收益）→ 疯狂自发传播。佣金结构：一级高稳一线、二级高猛招商，动态平衡**'
- '- **劳动合同合规体系** = **合同是枪，附件是子弹。必须有：岗位考核表(KPI量化)、公司规章制度(民主程序)、廉洁协议、保密协议、入职背调。离职谈话：安排会谈者、签“个人原因”离职表(公司不盖章)、当天结清工资、留证据**'
- '- **股权顶层设计四要素** = **切蛋糕规则：①控制权给“操盘强+担责任”的好人(AB股/一致行动) ②进入：资金溢价/资源对赌/技术专利/全职时间 ③分配：静态初始+动态调整(业绩/增资)
  ④退出：锁定期/回购价(净资产/估值/协议价)/优先清算，配套律师落地文本**'
- '- **三会一层治理架构** = **公司法定四机构：股东会(最高权力/选董事分利润)→董事会(决策/定战略/选高管)→高管层(执行/拿结果)；股东会→监事会(监督董事高管)；战略是三会一层的事：绘地图/选路径/慎之又慎/不朝令夕改，公司死于治理层错多于执行层**'
- '- **平台生命周期投放策略** = **平台四阶段：铺货期(宽松/扶持)→动销期(考核销量)→精细化期(重服务/合规/品牌)→玩趋势期(重内容/直播/私域)。增长期激进投放抢心智，存量期合规深耕私域。淘系经验映射抖音/视频号/美团/TEMU**'
- '- **OKR制定执行** = **O定性鼓舞有截止、KR定量直接推动O。战略坚定(O不轻变)+战术灵活(KR可调)+MVP验证最不确定因素。周会对齐/月会复盘/季度定O。鼓励暴露问题、保护报信人、核心KR倾斜80%资源**'
- '- **内在比赛理论** = **人有两个我：自我一(理性/表层)、自我二(潜意识/深层)。内在比赛=潜意识认不认可目标/信不信配得上。输内在必输外在(李宗伟技术不输林丹但潜意识不信能赢→关键分崩盘；老虎伍兹丑闻后潜意识“不再完美”→对手不再怕→跌出前100)。赢内在：盲目自信(我领域我称王)、成功是成功之母(累积成功体验)、唤醒成功体验(怂时回顾过往赢过)、俯视学习(战略俯视我配学/战术跪着学细节)**'
- '- **战略发挥优势法** = **先盘点手里筹码(技能/经验/人脉/私域/供应链/专利/品牌/现金/团队)→再决定怎么打牌(选赛道/模式/团队/资源)。苏联靠纵深打防御、中国靠基建/一带一路打连接。作者靠内容+私域+裂变打副业/捡漏群/无货源。避坑：别选劣势赛道(文科生搞硬科技/内向者搞直播)**'
- '- **利他即利己** = **分享干货/信息/资源不藏私 → 吸引同频高质量连接 → 获得更高阶信息/资源/机会 → 复利增长。作者长期分享 → 被亦仁邀请核心圈/办公室/获投融资对接。宝妈4个月日加好友分享育儿干货
  → 号被7万收购。市场大、蛋糕分不完、核心机密/供应链不公开**'
- '- **时代红利认知** = **赚的每100块，90块是时代给的(平台流量红利/政策窗口/技术范式迁移/人口结构)，10块是能力补偿。英雄是时势产物。任务：识别红利在哪→上车怎么上→吃肉怎么赚→下车止盈转型→等下一波。纯蹭红利无资产沉淀→退潮归零；强者用红利期现金流/人才/品牌/数据建后红利护城河**'
- '- **执行力变现论** = **执行力=在不确定性中克服人性弱性(懒/怕/拖/怂)持续完成既定动作的能力。可变现：高薪聘用/资产出售(宝妈号7万)/融资换股权/客户溢价。可训练：MVP→SOP→重复100次→结果→正反馈→习惯。可量化：日更天数/发文篇数/加好友数/测品款数/直播场次/招商数/代码行数。可复利：每次执行沉淀内容/数据/流程/案例/信誉/人脉。盲目执行(无策略/复盘/反馈)=战术勤奋战略懒惰=无效内耗**'
summary:
- concept: 流量价值公式
  desc: 流量价值 = 规模 × 相关性 × 信任度，三要素乘法关系，任一为零则总值为零
- concept: 公域引流私域变现
  desc: 核心逻辑：公域流量归平台、私域流量归自己，目标是导入微信一对一反复成交
- concept: 流量切片分析法
  desc: 横向切来源渠道趋势、纵向切用户需求路径，形成可执行运营干预动作
- concept: 流量流速悖论
  desc: 流量需不快不慢、持续不断，太快无连接、太慢无规模，核心增用户停留时间
- concept: 交易目的论
  desc: 单纯曝光无价值、无互动曝光为负价值，一切运营以交易为最终目的
- concept: 流量合并术
  desc: 谁能让流量主赚更多钱，谁就拥有其积累流量，世界不缺流量缺最大化方法
- concept: 私域单客价思维
  desc: 关注用户全生命周期总贡献(单客价=客单价×频次×留存)，而非单次客单价
- concept: 实时真实ROI
  desc: 含私域累计毛利的综合投产比：(直播毛利+私域累计毛利)/广告投入，随时间上升
- concept: 捡漏群模型
  desc: 1-3折超高性价比+30-50演员造氛围+4-6轮催单+矩阵规模，单群寿命约2年ROI3-4倍
- concept: 视频号直播引流工具箱
  desc: 企微弹出/金句卡片，不跳出直播环境丝滑引流，小时级加200精准私域好友
- concept: 五位一体成交飞轮
  desc: 破冰/诊断/方案/信任/成交五步法，解决为什么买/为什么跟你买/为什么现在买
- concept: 内容价值金字塔
  desc: 娱乐(情绪价值难变现)<工具(实用引流)<方法(建IP护城河高客单)，核心=价值交换
- concept: 渣男思维做内容
  desc: 撩完就跑(峰终定律制造意犹未尽)+广撒网(垂人群不垂内容)+模板化工业化生产+逆向思考(变现→定位→产品→内容→流量)
- concept: MVP先卖后做
  desc: 先卖想法收定金验证需求，聊100人20-30人付款即成立，短时间并行测试几十个产品
- concept: 商业拆解复制法
  desc: 刷视频找案例→拆全链路(选品/素材/文案/引流/私域/成交/交付)→判可复制性(货源非独家/场景验证有需求)→低成本复制变现
- concept: 资源匹配度评估
  desc: 盘点现有资源→拆解目标项目所需→匹配度>项目好坏决定成功概率，缺口可外包/合伙填补
- concept: 无人直播技术护城河
  desc: 自研硬件盒子伪装摄像头规避风控+商家合作录制真实直播间素材极致拟真，单场GMV可达百万
- concept: 视频号无货源店群
  desc: 买商标授权开旗舰店/刷入池→入优选联盟→采集拼多多/1688铺货→达人带货/自然流出单→矩阵≥5店对抗不确定性
- concept: 社群分销增长公式
  desc: 收入增长 = 供应链强度 × 顶层设计 × 动员能力，乘法模型任一为零则增长为零
- concept: 抖音爆单承接法
  desc: 视频爆了立即：上传同内容新视频+建合集带爆新作、流量版/带货版双路并行、开直播双频共振承接
- concept: 热点套利技术栈
  desc: 预建域名/号/服务器/API/支付/发布流程，热点来10分钟上线抢占品牌词/搜索入口
- concept: 买卖-生意-商业三分论
  desc: 买卖=出卖劳动力、生意=代理商/多次卖出赚差价、商业=建可复制模式赚时间钱/品牌溢价，不可跳跃
- concept: 财富积累四阶段
  desc: 出卖劳动力→一份时间多次卖(内容/代码)→购买他人时间(当老板)→钱生钱(投资)，阶段不可跳跃
- concept: 人生四阶段
  desc: 初入职场扩广度→中年危机做管理→第二曲线找副业MVP→复制商业放大融资上市
- concept: 刚需生意观
  desc: 非刚需不碰，刚需=不买会难受/有损失/立竿见影，链条短/频次高/替代难，项目本性成就人
- concept: 高净值客户核心痛点
  desc: 失去掌控权(恐惧源于未知)，破局：引起好奇→需求升维痛点+重塑概念建权威→灵魂三问(聊孩子/谈自己/谈传承)形成依赖
- concept: 发圈动力公式
  desc: 发圈动力 = 佣金 / 社交压力，挖掘产品社交货币价值(如卖书=展示好妈妈)降低压力甚至正收益
- concept: 劳动合同合规体系
  desc: 合同是枪、附件是子弹：含考核表/规章制度/廉洁/保密协议，及时签/考核留痕/离职谈话签个人原因当天结清工资
- concept: 股权顶层设计四要素
  desc: 控制权/进入机制/分配机制/退出机制，内部不乱才能外战，无标准答案但无设计必有灾难
- concept: 三会一层治理架构
  desc: 股东会/董事会/监事会/高管层，权力流向与制衡，战略是三会一层的事，公司死于治理层错多于执行层
- concept: 平台生命周期投放策略
  desc: 铺货/动销/精细化/玩趋势四阶段，增长期激进投放、存量期合规深耕私域，淘系经验映射新平台
- concept: OKR制定执行要点
  desc: O定性鼓舞有截止、KR定量推动O，战略坚定+战术灵活+MVP验证不确定因素+高频同步+问题暴露文化
- concept: 内在比赛理论
  desc: 自我一(理性)vs自我二(潜意识)，输内在比赛必输外在比赛，赢法：盲目自信/成功是成功之母/唤醒成功体验/俯视学习
- concept: 战略发挥优势法
  desc: 先盘点筹码(优势/资源/能力)再决定怎么打牌，发挥优势补齐关键短板，避坑劣势赛道
- concept: 利他即利己
  desc: 越分享越幸运，市场大蛋糕分不完，分享吸引同频连接获得高阶信息回流复利增长
- concept: 时代红利认知
  desc: 百块钱九十块红利十块能力，识别红利窗口上车吃肉下车转型，用红利期成果建后红利护城河
- concept: 执行力变现论
  desc: 执行力是稀缺资产可定价/交易/融资，可训练/MVP→SOP→重复100次、可量化/日更/加好友/测品、可复利/沉淀资产
exercises:
- 'no': 1
  title: 手算一次流量价值与ROI
  contents:
  - 某知识付费项目投放视频号广告：投入 5 万元，直播间成交营业额 12 万元，客单价 300 元，毛利率 60%，私域进线率 55%，月产值 12 元/人，预计留存
    8 个月（前 3 个月按 80% 递减，后 5 个月按 90% 递减）。
  - 1. 计算纯直播间 ROI（不含私域）。
  - 2. 估算私域累计毛利贡献。
  - 3. 计算实时真实 ROI（含私域）。
  - 回答问题：
  - '- 若进线率提升至 70%，月产值提升至 18 元，实时真实 ROI 会如何变化？'
  - '- 为什么说“流量规模只解决连接问题，不解决交易问题”？结合相关性与信任度解释。'
- 'no': 2
  title: 设计一个捡漏群单日运营 SOP
  contents:
  - 假设你运营一个 500 人的捡漏群，拥有 30 个演员账号。请为“明日”设计完整的排品与运营节奏表，包含：
  - 1. 主品与辅品的选品标准（标品比价逻辑、非标品社交货币逻辑）。
  - 2. 发品时间节点：预告、主品秒杀、4-6 次催单、隔日预告的具体时间点。
  - 3. 演员分工与话术要点：抢单、晒单、催单、氛围造势的分工比例与关键话术。
  - 4. 精推文案结构：预告文案、秒杀文案、催单文案的核心卖点与损失厌恶话术。
  - 回答问题：
  - '- 为什么“有演员和没演员的社群产出至少相差一倍”？核心心理机制是什么？'
  - '- 若群内演员氛围突然“死气沉沉”，如何快速诊断并复活？'
- 'no': 3
  title: 复盘一个“商业拆解复制”实战案例
  contents:
  - 在抖音/小红书/视频号中找到一个近期爆火的同行商业案例（如：某虚拟资料号、某实体店同城引流、某无人直播带货），按以下维度拆解并判断可复制性：
  - 1. 前端内容：选题/标题/封面/钩子/节奏/爆款特征。
  - 2. 引流路径：公域留钩子/私信/评论区/直播间工具/主页挂载。
  - 3. 私域承接：进群/加好友/自动回复/破冰话术/诊断问卷。
  - 4. 成交转化：产品结构/定价锚点/成交飞轮/催单节奏/售后服务。
  - 5. 交付履约：标准化程度/人力依赖/复购设计/裂变机制。
  - 6. 供应链/货源：是否独家/可替代性/利润空间/质量稳定性。
  - 回答问题：
  - '- 该项目的“可复制性”评分（1-10 分）？核心壁垒在哪里？'
  - '- 你手里的资源（技能/人脉/资金/渠道/内容能力）与该项目匹配度如何？是否建议入局？'
- 'no': 4
  title: 制定个人/团队下一季度 OKR
  contents:
  - 假设你当前处于“买卖→生意”跃迁期（或“生意→商业”跃迁期），请为下一季度制定 OKR：
  - 1. 设定 1 个具有挑战性且可衡量的 O（Objective）。
  - 2. 分解 3-5 个直接推动 O 的 KR（Key Results），包含定量指标与截止时间。
  - 3. 标注最不确定的 1-2 个关键假设，并设计对应的 MVP 验证方案（最小投入、最快反馈）。
  - 4. 列出关键角色高频同步机制（周会/月会/季度会议程与产出）。
  - 5. 设置“红灯机制”：何种数据/信号触发必须升级汇报与资源倾斜。
  - 回答问题：
  - '- 如何避免 OKR 退化为 KPI 考核工具？'
  - '- 战略坚定与战术灵活在执行中如何动态平衡？'
- 'no': 5
  title: 内在比赛自我诊断与训练计划
  contents:
  - 结合《身心合一的奇迹力量》内在比赛理论，完成一次自我诊断：
  - 1. 列出你当前正在追求的 1 个长期目标（外在比赛）。
  - 2. 诚实审视：你的潜意识（自我二）是否 100% 认可这个目标？是否存在“配得上感”缺失、恐惧失败、恐惧成功、冒名顶替综合症？
  - 3. 回顾并书写 3-5 个过往“成功体验”（哪怕微小），按“唤醒成功体验法”提炼关键要素：当时做了什么、关键转折点、获得的正反馈、建立的自信神经回路。
  - 4. 设计未来 21 天“俯视学习”行动清单：每周请教 1 位高手（战略俯视：我配学、我是来拿结果的）+ 每日刻意练习 1 个战术细节（战术重视：跪着学执行）。
  - 5. 设定“盲目自信”锚点语录，每日早晚各念诵 1 遍，观察 21 天后心态与行动力变化。
  - 回答问题：
  - '- 为什么“战术勤奋无法逃避战略探索”？你近期是否在用忙碌掩盖战略懒惰？'
  - '- 李宗伟与老虎伍兹案例中，潜意识“内在比赛”失败的具体表现是什么？如何迁移到你的创业场景？'
