  - 'no': 1
    name: 热点收割策略 —— 让一次热点变成一场战役
    points:
    - '**为什么需要这个概念？**'
    - '- 追热点可以低成本获取爆发式流量，但缺乏系统打法容易浪费机会'
    - '- 需要一套从选题、写稿到变现的完整流程，才能将流量转化为收益'
    - '- 传统的''凭感觉追热点''不可持续，无法复制和放大'
    - '**核心定义**'
    - '- 热点收割策略是一套系统化的操作流程：快速决策追踪热点、批量产出符合算法收录的内容、设置承接流量的后台规则，最后通过多种广告组合变现'
    - '- 其核心是''快''与''系统化''，在热点生命周期内完成全链路闭环'
    - '**关键性质**'
    - '- 时效性强：热点生命力短，决策和产出必须快速闭环'
    - '- 流程可复制：沉淀为SOP后可批量作用于不同热点'
    - '- 依赖前置能力：账号矩阵、SEO功底、变现通道需提前备齐'
    - '**典型例子**'
    - '- 2022年12月14日''行程码下线''热点，作者用12个公众号批量发布96篇文章，单日净增近4.5万粉丝、变现约1万元'
    - '**边界条件**'
    - '- 对热点信息获取的时效性要求极高，过晚入局流量红利已稀释'
    - '- 批量做号需要提前储备账号矩阵与辅助工具，否则临时抱佛脚难以支撑'
    - '- 决策要果断，机会稍纵即逝'
    - '...'
    sources:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
      role: origin
    excerpts:
    - 我们做的是搜索流量，那相关的搜索长尾词、搜索下拉框词语都可以放进来。文章被收录之后，读者搜索相关长尾词会搜到我们这篇文章。
    - 我用12个公众号，每个公众号8篇文章；总共发布了96篇文章，全部是这样子整合内容。
    - 我决定要追这个热点之后，把我手头上的公众号挨个登陆，就开始了下面的操作流程：1、找对标账号体验一遍流程；2、写一篇符合平台算法的文章；3、给文章起一个爆款标题；4、设置公众号后台接住流量。
  - 'no': 2
    name: 搜索流量与批量矩阵 —— 让算法替你找读者
    points:
    - '**为什么需要这个概念？**'
    - '- 公众号推荐流量不可控，搜索流量是可持续的被动流量来源'
    - '- 单个账号命中搜索概率有限，需要矩阵化放大'
    - '**核心定义**'
    - '- 搜索流量追热点：在文章正文而非仅标题中铺设搜索长尾词，被微信搜一搜收录后，用户搜索热点词即可触达文章'
    - '- 批量做号矩阵：同时运营多个公众号，每篇内容与标题各不相同，以增加被算法收录与命中搜索的概率'
    - '**关键性质**'
    - '- 长尾词放入文章而非标题是短期追热点的核心区别'
    - '- 矩阵策略依赖内容差异性：每篇内容、标题必须各不相同'
    - '- 账号有效命中率约75%（9/12），多数账号可获得搜索流量'
    - '**典型例子**'
    - '- 96篇文章每篇内容与标题都不同，最终9个账号获流量、累计新增97385粉'
    - '**边界条件**'
    - '- 仅1-2个账号追热点时，建议用自己的话转述做原创而非批量伪原创'
    - '- 矩阵策略需提前储备足够数量的公众号'
    sources:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
      role: origin
    excerpts:
    - 我们做的是搜索流量，那相关的搜索长尾词、搜索下拉框词语都可以放进来。文章被收录之后，读者搜索相关长尾词会搜到我们这篇文章。
    - 要注意的一点是我96篇文章，每一篇内容都不一样；并且标题都不一样；这样做能够更好的增加被公众号系统收录的概率。
    - 如果是一两个号追热点，我建议尽量用自己的话来转述一下文章，变成原创文字；就更容易被微信系统收录。
