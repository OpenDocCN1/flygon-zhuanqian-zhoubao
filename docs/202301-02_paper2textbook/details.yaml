  - 'no': 3
    name: 流量价值公式 —— 规模之外，还有两把尺子
    points:
    - '**为什么需要这个概念？**'
    - '- 很多人把流量等同于“阅读量”“粉丝数”，看到一篇10w+文章就焦虑，以为大流量等于大生意'
    - '- 这种“流量崇拜”会让运营者盲目追求爆款，却忽略了流量背后是否真的能带来成交'
    - '- 需要一把客观的尺子来评价流量的真实价值，避免把“数据好看”误当成“生意好做”'
    - '- 只有理解了流量价值的三要素，才能有的放矢地优化引流、选品和信任建设'
    - '**核心定义**'
    - '- 流量价值 = 流量规模 × 交易相关性 × 信任度'
    - '- 流量规模只解决连接的问题，不解决交易的问题；比规模更重要的是相关性和信任度'
    - '**关键性质**'
    - '- 乘积效应：三要素是相乘而非相加，任何一项趋近于零都会让整体价值归零'
    - '- 相关性决定转化率：来的人是否想买你的东西，比来多少人更重要'
    - '- 信任度决定成交深度：有信任的连接才可能产生高客单价、高复购的深度交易'
    - '**典型例子**'
    - '- 宠物账号粉丝很多但卖宠物食品比卖母婴用品转化好，因为人群与品类高度相关'
    - '- 一个1000粉丝的垂直IP账号带货收入可能超过10万泛粉的娱乐号，因为信任度差异巨大'
    - '- 小红书资料号精准引流用户到微信后转化率30%-40%，因为来的都是对该资料有明确需求的人'
    - '**边界条件**'
    - '- 该公式适用于评估“可交易流量”的价值，不适用于纯品牌曝光、公关等非直接交易场景'
    - '- 相关性和信任度难以精确量化，更多是方向性判断，需要结合具体转化数据校准'
    - '- 流量的价值会随时间衰减，尤其是热点流量，需要及时承接转化'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    excerpts:
    - 流量价值=流量规模×交易相关性×信任度
    - 有时候我们面对一篇阅读量很高的文章、一篇赞藏很高的小红书笔记、一个很火的抖音视频，会感到困惑或焦虑。因为我们只看到了表层的流量规模，有些慌张，但流量规模只解决连接的问题，不解决交易的问题。
    - 比流量规模更重要的是流量相关性…信任度怎么看？有的连接带来的价值有限，这和连接给UV带来的感受有关…不轻易连接，但连接必有价值。
  - 'no': 4
    name: 事实与观点 —— 商业决策中的“分界线”
    points:
    - '**为什么需要这个概念？**'
    - '- 商业复盘和目标设定中，大多数人凭感觉说话：“今年业绩不好”“这个项目不行”，却拿不出证据'
    - '- 这样会导致归因错误：把观点当成事实，用情绪化的判断代替数据化的分析，最终做出错误决策'
    - '- 需要严格区分事实与观点，才能让总结“发现问题”的功能真正发挥作用'
    - '- 这也是团队沟通、向上汇报中避免争论和推诿的基础'
    - '**核心定义**'
    - '- 事实是中性的、能够用数字和证据支撑的；观点则因人而异、基于立场和层次差异，无法统一衡量'
    - '- 例：“我今年完成了83%的年度业绩目标”是事实；“我今年业绩做得不好”是观点'
    - '**关键性质**'
    - '- 可验证性：事实必须能被数据和证据检验，观点则基于个人感受和立场'
    - '- 沟通效率：用事实沟通能避免“你说好我说差”的无解争论，让讨论聚焦于数据和解决方案'
    - '- 目标锚点：判断工作是否成功必须先有目标（事实），没有目标则任何陈述都只是行为表达'
    - '**典型例子**'
    - '- “我们花了3个月做出这个产品”是事实，“这个产品很优秀”是观点，需要市场数据来支撑'
    - '- “这个月新增了500个付费用户”是事实，“这个月效果不错”是观点，效果如何要看目标对比'
    - '- “粉丝涨了但没有转化”是事实，“账号废了”是观点，需进一步分析转化数据才能定性'
    - '**边界条件**'
    - '- “数字”不一定等于“事实”：数据本身可能有水分或统计口径问题，需要交叉验证'
    - '- 重度依赖事实可能导致“分析瘫痪”，在信息不全时仍需结合经验做出判断'
    - '- 对“目标”的设定本身带有观点性质，需要在团队内达成共识后才能作为判定的基准'
    sources:
    - paper: docs/202301-02/20230207_04.md
      role: origin
    excerpts:
    - 我们一定要知道自己和对方说出口的每一句话，到底哪一句是观点，哪一句是事实。我今年业绩做的不好，这句话是观点还是事实？----观点！
    - 只有中性的，能够用数字和证据支撑的才是事实，例如：我今年完成了83%的年度业绩目标。
    - 判断一项工作是否成功，要看一开始设计的目标是什么，没有目标，总结无从谈起。
    - 目标就是我们工作的锚点或者标准，没有目标，我们永远都不知道自己做的到底是好还是不好，永远都不知道我们是否正在沿着设定的方向前进。
  - 'no': 5
    name: 战略选择 —— 最重的决定是“不做什么”
    points:
    - '**为什么需要这个概念？**'
    - '- 多数人把“战略”理解为宏伟目标或远大愿景，做了很多事却依然没有竞争力'
    - '- 还有人在面对机会时来者不拒，什么都想做，最终精力分散、没有一件事做深做透'
    - '- 需要理解战略的本质是取舍，是主动放弃那些“可以做但不该做”的事情'
    - '- 只有明确不做什么，才能把有限资源集中在最能发挥自身禀赋的一点上'
    - '**核心定义**'
    - '- 战略的本质是选择和取舍，其中最重要的是不做什么，而不是做什么'
    - '- 战略不是目标本身：目标是战略的对象或结果，但目标本身不是战略'
    - '- 战略应形成自始至终的指导原则，并发挥自身禀赋，不能选择劣势作为方向'
    - '**关键性质**'
    - '- 方向性：战略提供长期一致的决策基准，避免朝令夕改、机会主义'
    - '- 禀赋依赖：好的战略基于自身资源优势（即“手里的筹码”），“帮助一万个人赚到钱”是目标而非战略'
    - '- 排他性：选择意味着放弃其他可能，这是战略之所以困难的原因'
    - '**典型例子**'
    - '- 美国对苏“强加成本”战略：让苏联在国防上持续投入高昂费用，拖垮其经济，而非在所有领域全面对抗'
    - '- 胖龟找房主攻“0中介费”而非传统居间业务，放弃与百万中介正面竞争，以平台撮合模式切入'
    - '- 做内容选择“给方法”（打造个人IP）而非“给娱乐”，放弃短期的流量快感，沉淀长期壁垒'
    - '**边界条件**'
    - '- 战略不是一成不变的：宏观环境变化时需要重新审视，但不应朝令夕改'
    - '- “不做什么”需要基于对自身禀赋和外部机会的清醒认知，否则可能变成“什么都不敢做”的借口'
    - '- 个人成长同理：在早期资源有限时，过度聚焦可能错失探索期的广度，需要阶段性地调整'
    sources:
    - paper: docs/202301-02/20230207_03.md
      role: origin
    - paper: docs/202301-02/20230207_07.md
      role: improve
    - paper: docs/202301-02/20230207_06.md
      role: apply
    excerpts:
    - 什么是战略呢？就是选择。选择，其最重要的就是不做什么，而不是做什么。
    - 比如读书群里有人说他的战略是：帮助一万个人赚到钱。这就是对战略的一个巨大误解。因为帮助一万人赚到钱，这是一个目标，它不是战略。
    - 战略就是先审视自己手里的筹码，也就是自己的优势，然后再决定自己怎么打牌，也就是如何运用自己的优势来获得你想要的结果。
    - 战略，既不是一朝一夕的事，也不是朝令夕改的事。战略，是三会一层要做的事。
