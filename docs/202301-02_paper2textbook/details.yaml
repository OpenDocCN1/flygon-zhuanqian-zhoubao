    - '**为什么需要这个概念？**'
    - '- 企业在规模化放大后常陷入“越追求增长反而越不增长”的怪圈'
    - '- 被增长的预期绑架，会让人采取投机跟风、计算利弊、抓取资源等短视行为'
    - '- 需要一套认知框架来识别增长瓶颈的本质，并找到破解之道'
    - '**核心定义**'
    - '- 增长瓶颈怪圈：当企业或个人被增长的预期绑架，会陷入越追求增长反而距离增长越远的恶性循环'
    - '- 价值创造视角：从“我如何得到增长”切换为“我如何成为一个值得被奖赏增长的人”'
    - '- 三种勇气：面向未来而非面向过去的勇气、面向用户而非计算利弊的勇气、积累价值而非抓取资源的勇气'
    - '- 不流动稀缺资源价值优先：优先投入时间去积累当前环境中真正稀缺、不流动的资产（品牌、数据、人才、信任等）'
    - '**关键性质**'
    - '- 视角转换：转化看待问题的方式，而非解决问题本身，往往才是最关键的办法'
    - '- 稀缺资产导向：销售额几乎是无限且每年都在改变，但用户对高端品牌的心智是稀缺的'
    - '- 贡献视角：从争抢的视角变成贡献的视角，不争反而能赢得最关键的信任'
    - '**典型例子**'
    - '- 柯达自认成功源于坚持成像品质，但其最初成功实际源于抓住大众化趋势——用过去定义自己导致错失数码相机'
    - '- 八项规定后大量中高端白酒降价砸牌，几乎只有茅台认为品牌才是最重要资产，不牺牲品牌换销售额'
    - '- 四爷最与众不同的策略是“争是不争，不争是争”——从争抢的视角变成贡献的视角'
    - '**边界条件**'
    - '- 价值创造视角需要长期主义支撑，不适合追求短期套利者'
    - '- 识别“当前环境中真正稀缺不流动的资产”需要深刻的行业理解'
    - '- 贡献视角在内部政治复杂的组织中可能难以推行，需结合实际情况判断'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_07.md
      role: origin
    excerpts:
    - 进入增长瓶颈的一个典型现象，就是越想要增长，却距离想要的增长越远。如果用一句话来形容这种现象，那就是我们被我们想拥有的东西绑架了。
    - 我发现，破除增长焦虑唯一的方法，就是怎么从追求增长的视角，切换成价值创造的视角。从一个'我如何得到增长'，变成'我如何成为一个值得被奖赏增长的人'。
    - 真正要去摆脱这种视角，最难的不在于方法论，而是3种'勇气'：面向未来而非面向过去的勇气；面向用户而非计算利弊的勇气；积累价值而非抓取资源的勇气。
    - 我们花费了太多的精力去抓住无限的、流动的东西，而非关注真正稀缺的、不变的东西。对一个品牌来说，销售额几乎是无限的而且每年都在改变，但是用户对你高端品牌的心智是稀缺的。
    - 八项规定后大量的中高端白酒品牌，降价砸了牌子，几乎只有茅台认为品牌才是最重要的资产，不会用品牌和品质的牺牲去换销售额。
