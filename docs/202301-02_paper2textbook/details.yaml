    - '- 单品产出可极大化，且不造成选品困难'
    - '**典型例子**'
    - '- 今年新起的盘不到1000个群，月佣金100W+；行业有团队社群数量过万，月佣数千万'
    - '- 回本后单群单日产出约30元：100个群一天3000利润，1000个群一天30000，一个月90W'
    - '**边界条件**'
