  - │   ├── 负责分析、评价
  - │   └── 过度干预导致发挥失常
  - ├── 自我二（感性/潜意识）
  - │   ├── 驱动行为与本能
  - │   ├── 决定内在比赛的输赢
  - │   └── 不认可目标则外在比赛必输
  - └── 内在比赛 vs 外在比赛
  - '    ├── 内在比赛先于外在比赛'
  - '    └── 典型案例：李宗伟、老虎伍兹'
  - 创业者心态心法
  - ├── 盲目自信（舍我其谁）
  - │   ├── 定义：'在我的领域我就是国王'
  - │   ├── 性质：赢下内在比赛的前提
  - │   └── 边界：适用于长期项目，非精确投资
  - ├── 成功是成功之母
  - │   ├── 反常识主张：失败不是成功之母
  - │   ├── 成功体验累积潜意识自信
  - │   └── 配套方法：唤醒成功体验法
  - └── 俯视学习法
  - '    ├── 战略藐视：保持国王姿态'
  - '    ├── 战术重视：细节上认真请教'
  - '    └── 本质：向他人学习而不丢失自信'
  - 市场时机判断
  - ├── 三到六个月确定性窗口期
  - │   ├── 定义：疫情平稳期为确定的稳定期
  - │   ├── 依据：香港数据类比推演
  - │   └── 结论：先干个春天再说
  - └── 行业切入机会
  - '    ├── 旅游：分销与套利'
  - '    ├── 健康：保健养生带货'
  - '    └── 餐饮：紧扣春季需求'
