    name: 爆款内容可复制 —— 火过的内容，一定还会火
    points:
    - '**为什么需要这个概念？**'
    - '- 绝大多数内容创作者靠灵感创作，导致产量不稳定、质量波动大，难以持续'
    - '- 如果能够理解爆款内容的可复制性，就能将内容生产从“靠天吃饭”变为“流水线作业”'
    - '- 需要建立内容创作的工业化思维，用已验证的爆款模板持续输出'
    - '**核心定义**'
    - '- 爆过的内容一定可以再爆，这是内容生产工业化的基础认知'
    - '- 内容创作不要靠灵感，要靠爆款模板来持续输出'
    - '- 操作路径：先复制别人的爆款，不断测试直到跑出自己的爆款，之后持续复抄自己的爆款，直到流量衰减再换下一个爆款'
    - '**关键性质**'
    - '- 可重复性：验证过的爆款选题、标题、封面、结构可反复复用'
    - '- 概率提升：复制爆款模板的内容，爆的概率远高于盲目原创'
    - '- 效率优先：模板化生产大幅缩短制作时间'
    - '**典型例子**'
    - '- 最热前8笔记中有6个的标题几乎一样——看到爆款标题后，直接提取高频关键词排列组合，杂交出自带爆款基因的新标题'
    - '- 一条笔记火了之后，持续“怼”同类型内容，直到流量衰减；期间一天发2篇，一篇重复发爆款，一篇测试新模板'
    - '**边界条件**'
    - '- 需要持续的爆款样本库支持，拆解足够多的对标内容才能提炼出有效模板'
    - '- 追求“复制爆款”不等于完全照搬抄袭，需要做差异化调整规避平台查重'
    - '- 不同平台、不同赛道的爆款逻辑有差异，需要针对性提炼'
    sources:
    - paper: docs/202301-02/20230207_05.md
      role: origin
    - paper: docs/202301-02/IpCcdJ9NAoAt4pxKKV5c5sfenZc.md
      role: apply
    excerpts:
    - 爆过的内容一定是可以再爆的，内容创作不要靠灵感，要靠爆款模板！
    - 方法：先复制别人的爆款 不断测试 直到跑出来自己的爆款 接下来要做的就是抄自己的爆款
    - 原理就是火过的内容大概率还会火
    - 只要有数据不错的笔记我们就要一直怼 直到没流量，这个期间呢 我们可以一天发2篇
  - 'no': 20
    name: 渣男思维做内容 —— 撩完就跑与广撒网
    points:
    - '**为什么需要这个概念？**'
    - '- 很多内容创作者投入大量时间做作品，但因“太实在”而缺乏传播效果——把全部信息都给了用户，用户反而不珍惜'
    - '- 需要借鉴“渣男”的恋爱行为，理解内容传播中的情绪节奏与覆盖策略'
    - '- 掌握撩完就跑与广撒网两种方法，提高内容的吸引力和命中率'
    - '**核心定义**'
    - '- 渣男思维做内容是借用“渣男”的恋爱行为比喻内容创作的两个原则：撩完就跑与广撒网'
    - '- 撩完就跑：戳中用户的痒点/痛点后立即停止，利用峰终定律在情绪最高点停止，让人意犹未尽、印象最好'
    - '- 广撒网：在多个圈子、多个平台发布内容提高命中率，同时强调“垂直”垂直的是人群而非内容题材'
    - '**关键性质**'
    - '- 情绪节奏控制：在高潮点停止，制造意犹未尽感'
    - '- 覆盖面优先：多圈子多平台分发，提高命中率'
    - '- 人群垂直而非内容垂直：围绕目标人群的兴趣边界做泛内容'
    - '**典型例子**'
    - '- 做个人IP的40个APP——只展示APP名字，不告诉用户怎么用、怎么下载，戳中“想做IP”的痛点后戛然而止，引发大量互动'
    - '- 一个展示有钱人生活的视频：开头无边泳池+结尾美妙画面收尾，中间剪辑粗糙但用户只记住了开头与结尾的愉悦'
    - '**边界条件**'
    - '- 该方法适用于以情绪驱动的内容（短视频、朋友圈、图文），不适用于教程/说明书类内容'
    - '- “撩完就跑”需要平衡内容的信息量，过度隐藏会引起反感'
    - '- 广撒网的前提是内容有基础质量，否则多平台分发只会放大低质内容'
    sources:
    - paper: docs/202301-02/20230207_05.md
      role: origin
    excerpts:
    - 做渣男第一点：撩完就跑。戳痒点，意犹未尽。有个定律，叫做峰终定律：如果在一段体验的高峰和结尾，体验是愉悦的，那么对整个体验的感受就是愉悦的。…… 咱们撩到用户的痒点就停，峰终定律，在情绪最高点停止，才能让人意犹未尽，印象最好。
    - 做渣男第二点：广撒网 渣男怎么养鱼的？当然是混多个圈子，他们不止在一个圈子里寻找自己的猎物。所以，咱们做内容也需要广撒网，提高自己的内容命中率。
    - 要注意，咱们垂直，并不是垂直内容，不是说你做母婴领域，你就天天发育儿相关的内容。咱们垂直垂的是人群。
  - 'no': 21
    name: 逆向思考法 —— 先找买家，再找产品
    points:
    - '**为什么需要这个概念？**'
    - '- 大多数人的工作方式是“先做产品，再找客户”，但常常产品做出来了却没人买单'
    - '- 如果能够在开始行动前先想清楚结果和变现路径，就能大幅提高成功率'
    - '- 需要掌握逆向思考法，从结果倒推行动步骤'
    - '**核心定义**'
    - '- 以结果为导向，逆向思维需要的步骤，拆解出最小行动单元'
    - '- 正常流程是定位→内容→流量→产品→变现，逆向流程是变现→定位→产品→内容→流量——先找买家，再找产品'
    - '- 核心逻辑：先考虑好怎么变现，然后再去开展业务，一定会事半功倍'
    - '**关键性质**'
    - '- 结果导向：从终点倒推起点，避免走弯路'
    - '- 最小行动单元：将大目标拆解为最小可执行动作'
    - '- 变现前置：在行动前先确认变现路径'
    - '**典型例子**'
    - '- 想做自媒体，先想清楚靠什么变现（卖课/接广告/带货），再决定做哪个方向的账号、发什么内容吸引什么人——而不是先发内容再考虑如何变现'
    - '- 想开发产品，先找到愿意付费的客户（如通过预售、问卷、社群验证），再动手开发——而不是开发完再找买家'
    - '**边界条件**'
    - '- 逆向思考法在目标明确、路径可选的情况下最有效；对探索性、创新性项目，可能需要灵活并行'
    - '- 以结果倒推不等于“结果速成”，仍然需要扎实的执行'
    - '- 逆向拆解过程中需要结合自身资源与能力，否则推导出的路径可能不可行'
    sources:
    - paper: docs/202301-02/20230207_05.md
      role: origin
    excerpts:
    - 以结果为导向，逆向思维需要的步骤，拆解出最小行动单元。正常流程：定位→内容→流量→产品→变现，我们可以以结果倒推内容：变现→定位→产品→内容→流量。先找买家，再找产品！（也可以理解为先找需求），一定要先考虑好怎么变现，然后再去开展业务，一定会事半功倍。
