    name: 最小MVP闭环 —— 先造独木舟，再想航母
    points:
    - '**为什么需要这个概念？**'
    - '- 创业最大的风险是投入巨大成本后发现需求不存在'
    - '- 很多人一开始就想建大平台、雇大团队，结果死在半路上'
    - '- MVP能帮助创业者用最小成本验证“产品—流量—销售—交付”是否成立'
    - '- 从挣1块钱开始，跑通单点再复制放大'
    - '**核心定义**'
    - '- 最小可行产品（MVP）闭环是通过最低成本、最快速度跑通“产品-流量-销售-交付”整个商业链路，验证模型成立后再复制放大的方法'
    - '**关键性质**'
    - '- 最小化：只做能验证闭环的最少工作量'
    - '- 可复制：验证的是模式，不是一次性买卖'
    - '- 低成本：投入控制在可承受范围内，避免一次性重投入'
    - '**典型例子**'
    - '- 夕子从代购医美面膜一单赚2元起步，跑通闭环后才逐步放大到年利润过百万；老杨开发睡播先做简陋直播间测试流量，数据亮眼后才配置软硬件系统；胖龟先跑通洛阳本地8家门店才扩张到杭州上海'
    - '**边界条件**'
    - '- MVP验证的是“有人买”而非“能赚大钱”，需警惕幸存者偏差；跑通闭环之后的放大路径必须提前设计，否则会陷入项目天花板'
    sources:
    - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
      role: origin
    - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
      role: improve
    excerpts:
    - 1.做生意从自己身边资源入手，从挣1块钱开始，选一个天花板比较高的，持续3——5年。
    - 2.跑通自己的生意环节，最小mvp（产品——流量—销售—交付）
    - 5.3 测试。快速测试，快速看到结果，产品方法论MVP真是让各行各业都能大放异彩啊。
    - 刚开始的直播间就这么简陋，然而并不耽误在线峰值飙到上万。（这个直播间和账号可能有一些做娱播的朋友早期看过，就是被泄露的那个直播间。）
  - 'no': 5
    name: 付费方即盈利支点 —— 找到“谁痛谁掏钱”
    points:
    - '**为什么需要这个概念？**'
    - '- 商业模式不成立的常见原因是没有找对付费方'
    - '- 用户痛但不掏钱，说明付费方错位'
    - '- 有时付费方不是最终使用者，而是“中间人”'
    - '- 找到“谁痛谁付费”的支点，商业模式自然成立'
    - '**核心定义**'
    - '- 盈利支点指在商业模式设计中选择适当的付费主体，通常由最痛的一方承担费用（如二房东因空置亏损而愿付中介费），从而支撑整体商业闭环'
    - '**关键性质**'
    - '- 痛点强度：付费方必须痛点足够深（如空置一天亏一天房租）'
    - '- 价值对价：付费方获得的利益需明确大于所付费用'
    - '- 稳定可续：付费方有持续支付能力而非一次性冲动'
    - '**典型例子**'
    - '- 胖龟找房的0中介费租房不向租客收费，转向二房东收费——因二房东空置即亏损，有强烈动力付钱快速出房'
    - '**边界条件**'
    - '- 需警惕“两头通吃”导致用户反感；付费方的痛点可能随市场变化而消解（如空置率下降），商业模式需具备动态调整能力'
    sources:
    - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
      role: origin
    excerpts:
    - 我们推演了很多，也会见了很多房东，最后我们找准了二房东这个渠道。因为二房东手上不单单就一间房子，他需要快速的让自己的房子租出去不能有空置，因为每空置一天，房租的费用就需要自行来承担。
    - 有需求的地方就有市场，中介平台公司在房产市场蓬勃发展的10年获得了大量的财富，也产生了大量的问题。
  - 'no': 6
    name: 全域获客 —— 把“鱼塘”撒满全网
    points:
    - '**为什么需要这个概念？**'
    - '- 单一渠道的流量不稳定，平台算法一变生意就断'
    - '- 不同平台的用户画像差异大，多渠道覆盖才能提高触达概率'
    - '- “等客上门”时代的结束，必须主动出击、全域布网'
    - '**核心定义**'
    - '- 全域获客指同时布局多个公域平台（抖音、快手、小红书、58、转转、豆瓣等），根据不同平台特性定制内容与钩子，系统化地发掘和引流目标客户'
    - '**关键性质**'
    - '- 平台适配：每个平台有各自的用户习惯和内容偏好'
    - '- 主动出击：私信、评论区互动、发帖等主动动作比坐等有效'
    - '- 矩阵协同：多平台同步发布、相互导流提升覆盖'
    - '**典型例子**'
    - '- 胖龟找房在抖音、快手、小红书、58、安居客、转转、豆瓣、微博、知乎等平台发帖、私聊、评论区互动，全方位发掘租客；夕子用小红书爆款视频+知乎引流双线获客'
    - '**边界条件**'
    - '- 全域不等于平均用力，需根据投产比动态调整渠道优先级；小团队需警惕渠道过多导致精力分散'
    sources:
