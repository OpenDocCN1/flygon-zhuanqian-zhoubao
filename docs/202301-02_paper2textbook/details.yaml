    name: 高客单非遗产品的价值塑造 —— 用「工艺与场景」撑起价格
    points:
    - '**为什么需要这个概念？**'
    - '- 高客单价产品无法靠低价促销成交，必须通过价值塑造让用户觉得''值'''
    - '- 非遗类产品自带文化价值，但需要正确的呈现方式才能转化为溢价'
    - '- 传统的叫卖式直播无法承载高客单，需要场景化、内容化的呈现'
    - '**核心定义**'
    - '- 以竹庐拓艺品牌为例：通过产品思维（极致装裱工艺）、场景化直播（佛堂/茶室/书房）、人群定位（新锐白领/资深中产）实现非遗拓片年销数百万'
    - '- 核心逻辑：高客单必须线上引流、线下承接成交变现'
    - '**关键性质**'
    - '- 产品思维：八层装裱工艺（精选俄罗斯黑松木等）塑造极致品质感，''三分画七分裱'''
    - '- 场景化直播：产品''特别吃场景''，直播间场景决定价格天花板'
    - '- 人群定位：新锐白领、资深中产等对生活有美好追求且有购买力的人群'
    - '- 漏斗模型：线上平价入门获客→私域沉淀→线下展厅高客单成交'
    - '**典型例子**'
    - '- 直播间1小时场观500人，千次成交4000-6000GMV，高时1-2万'
    - '- 抖音客单价1000-1200元，单一平台年销售额几百万'
    - '- 客户订单手机尾号全是连号（88888、6666），大明星单次消费数万元'
    - '**边界条件**'
    - '- 高客单非遗传拓的客群较窄，需要精细的人群定位和私域运营'
    - '- 直播间场观低，不追求流量规模而追求成交效率，对内容质量要求高'
    sources:
    - paper: docs/202301-02/XuOgdT9o8ongKPxfSMlcfgLbngf.md
      role: origin
    excerpts:
    - 线上做的不久，只有抖音一个平台，销售额几百万左右，抖音客单价1000-1200左右
    - 第一层实木框，这个实木框我们尝试了20多个材质，最后选择了俄罗斯黑松木材质。第二层有机玻璃，第三层卡纸，第四层拓片，第五层背纸，第六层龙骨架，第七层整张封板，第八层防尘封条
    - 早期我们是一个师傅在后面拓制拓片，我们主播在前面直播，直播了一段时间不行，价格卖不上去，场景太low了，因为我们这个产品特别吃场景，所以我们产品的直播场景也一直在优化，比如佛堂挂画（我们就布置一个佛堂的景），玄关挂画、茶室挂画、书房挂画等
    - 新锐白领、资深中产，这是我们抖音后台人群的标签。这部分人都是对生活有美好追求的人，而且有足够的购买能力。
    - 线上我们是入门级产品，首先平价卖，仅仅是我们获客的渠道，未来我们会上海、北京、深圳、广州开线下展厅，目的是服务背后的高客单复购人群，客单价是几万、几十万的产品。
    - 高客单一定要用线上引流，线下承接流量成交变现。
    - 我们的直播间1个小时场观500人左右，千次成交4000-6000GMV，高的时候1-2万多。
