    name: 事实与观点 —— 给商业判断装上“客观滤镜”
    points:
    - '**为什么需要这个概念？**'
    - '- 商业总结与决策中，主观感受与客观事实常被混为一谈，导致误判'
    - '- 观点因人而异、无法作为共同决策基础；事实才具备可验证性'
    - '- 需要一套严格的区分标准来提升总结与决策质量'
    - '**核心定义**'
    - '- 事实是中性的、可以用数字和证据支撑的客观陈述；观点是因人而异的立场和层次差异的表达'
    - '- 合格的总结必须“要事实，不要观点”'
    - '**关键性质**'
    - '- 事实具备可验证性（如“我完成了83%的年度业绩目标”），观点无法统一衡量（如“我今年业绩不好”）'
    - '- 区分事实与观点是科学总结、5WHY分析和商业模式拆解的共同前提'
    - '- 可用于评估信息质量：缺乏事实支撑的主张应谨慎采信'
    - '**典型例子**'
    - '- “我今年业绩不好”是观点；“我完成了83%的年度业绩目标”是事实'
    - '- 10摄氏度气温，常年住0度地区的人觉得“好温暖”，常年住20度地区的人觉得“太冷了”——同一事实，不同观点'
    - '**边界条件**'
    - '- 事实与观点的界限在某些模糊场景下并不绝对（如预测性描述），需按可验证性判断'
    - '- 观点并非毫无价值，而是不能作为决策的客观依据，可结合多个观点交叉验证'
    sources:
    - paper: docs/202301-02/20230207_04.md
      role: origin
    excerpts:
