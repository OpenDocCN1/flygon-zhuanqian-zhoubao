    excerpts:
    - 所以选品很关键，产品好省了一半的心，后续回购率也高。
    - 果断花了1万6入了一批货，这个级别属于合伙人级别，折扣比较低，有利润空间。
    - 1.深挖用户需求，最好涵盖面齐全：比如说不仅祛痘、还有美白、抗衰等等
    - 2.口服保养是趋势，一个人一单接受了某个品牌的口服，不会轻易更换牌子的
    - 3.尽量能跟医院合作的产品，品牌背书这块强
  - 'no': 3
    name: 信息差就是金钱 —— 卖“你知道而别人不知道的路径”
    points:
    - '**为什么需要这个概念？**'
    - '- 商业的本质是交易，交易的前提是买方和卖方对同一个商品的价值认知存在差异'
    - '- 传统行业（如房产中介）依靠信息不对称赚取高额费用，这恰恰说明信息差是钱的来源'
    - '- 理解信息差才能找到创业切入点和商业模式的根基'
    - '**核心定义**'
    - '- 生意的本质是信息差：利用买卖双方对市场、产品、价格等信息的不对称，通过撮合、搬运或服务创造价值并获利'
    - '- 中介费伪概念：中介费之所以能收取，本质是买房者不知道房东电话，一旦信息透明该费用可被取消'
    - '**关键性质**'
    - '- 广泛存在：互联网和线下都存在大量信息差生意'
    - '- 可被消除：技术进步和模式创新能消除信息差，从而颠覆原有商业模式'
    - '- 价值创造：平台撮合买卖双方匹配，解决需求及痛点，产生良性循环'
    - '**典型例子**'
    - '- 胖龟找房：不向租客收中介费，而是让二房东承担佣金（因为空置一天损失一天房租），本质是重新分配了“信息差红利”'
    - '- 闲鱼套利：利用不同平台间的价格信息差低买高卖'
    - '**边界条件**'
    - '- 信息差会随时间和技术进步被消除，需要持续寻找新的信息差或建立其他壁垒'
    - '- 单纯依赖信息差而无实际服务价值，容易被视为“智商税”并面临竞争者的颠覆'
    sources:
    - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
      role: origin
    excerpts:
    - 生意的本质就是信息差，在互联网里也存在大量的信息差生意。以这个信息差为市场的切入点我们创办了胖龟找房的 1.0——没有中介费的个人房屋分享平台。
    - 我们不收中介费，是因为中介费本身就是个伪概念！为什么说是伪概念，因为是智商税，中介费为什么要收？就是因为买房及租房者不知道售房及出租转让业主的联系电话！
    - 如果买房者或者租房者知道房东电话！那么他们还会给中介公司掏中介费吗？nonononon，绝对不会！这叫什么？是不是信息不对等差造成的信息差？
  - 'no': 4
    name: 渠道投产比 —— 用数据说话，不凭感觉花钱
    points:
    - '**为什么需要这个概念？**'
    - '- 创业者资源有限，投放预算必须花在回报最高的渠道上'
    - '- 凭经验和“听说”选择渠道往往导致资金浪费（如汽车广播投入2万元看不到水花）'
    - '- 需要量化比较不同渠道的投产比，用数据指导后续投放决策'
    - '**核心定义**'
    - '- 投产比（ROI）：某渠道带来的收益与投入成本的比值，衡量营销渠道效率的核心指标'
    - '- 按效果排序渠道价值：抖音推广 > 本地自媒体 > 汽车广播'
    - '**关键性质**'
    - '- 可比较性：不同渠道用同一标准（获客成本、付费转化数）横向对比'
    - '- 本地相关性：做本地项目时投放必须选本地渠道，外地流量无效'
    - '- 差异巨大：最优与最差渠道的回报可能相差数倍到数十倍'
    - '**典型例子**'
    - '- 胖龟找房实测：抖音投放带来4000+粉丝、100+付费会员，获客成本约600元/名，投产比不错，还带来5位加盟商（单个成本8000元，但利润1万+有盈余）；汽车广播投入2万几乎看不到水花'
    - '**边界条件**'
    - '- 投产比受行业、地域、内容质量影响，需在自身业务场景中实测，不能直接照搬他人结论'
    - '- 投放效果有滞后性，需给短中期观察期后再评估是否追加或放弃'
    sources:
    - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
      role: origin
    excerpts:
    - 以此 抖音推广>本地自媒体>汽车广播
    - 品牌营销这部分营销推广直接带来了 4000+的粉丝，付费会员大概在 100 多名，获客成本大概在 600 左右一名，投产比还不错。
    - 招商版块推广带了 100+的意向客户，最后成交变成加盟客户 5 位，单个加盟商成本在 8000 左右。因为我们有个 1w 左右的利润，所以也是有盈余的。
    - 汽车广播这个板块不建议大家做，薅羊毛的客户比较多~。这个版块我们大概扔进去 2w，水花都看不到。
    - 投抖音的时候如果你是做本地项目，一定要投本地一定要投本地...
  - 'no': 5
    name: 平台演化周期 —— 从“以史为鉴”到“预判红利”
    points:
    - '**为什么需要这个概念？**'
    - '- 新平台（如TikTok、美团、TEMU）的发展路径高度相似，历史规律可预判新机会的窗口期'
    - '- 只有理解平台演化阶段，才能判断“什么时间用什么打法”最容易被奖励'
    - '- 普通人逆袭的窗口往往在平台早期（高流量低商业化阶段），错过即失去'
    - '**核心定义**'
    - '- 平台演化周期：互联网平台普遍经历“铺货→动销→精细化→玩趋势”四个阶段，早期流量红利最大但商业化不成熟'
    - '- 高流量低商业化阶段：平台主推电商和广告只是为了赚钱占市场，此时做娱乐直播/内容种草是普通人最轻松拿到现金流的方向'
    - '**关键性质**'
    - '- 周期普遍性：所有平台演变的底层逻辑相通（淘系历史可类比视频号、抖音）'
    - '- 窗口有限性：每个阶段的红利被快速消耗，错过早期的简单模式就进入竞争激烈的精细化阶段'
    - '- 风险递进性：后期平台管控加强，需要更合规、更精细的打法'
    - '**典型例子**'
    - '- TikTok睡播：作者判断TikTok处于抖音早期类似阶段，主攻娱乐直播而非带货直播，预判风口至少可持续2年'
    - '- 美团电商冷启动：2022年8月末发现机会，不到两个月从0跑通并扩展到30家店，验证新平台初期红利效应'
    - '**边界条件**'
    - '- 平台政策可能突变，早期蓝海也可能是“灰色地带”，需留意合规风险'
    - '- 平台生命周期判断需要结合多方数据（用户增长、监管政策、竞对动态），不能只看单一指标'
    sources:
    - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
      role: origin
    excerpts:
    - 回观抖音的发展路径，第一阶段就是高流量低商业化阶段，这时候要做的并不一定要跟平台的指向，而是要看清平台的现状。
    - 按照抖音、映客花椒的发展路线图，初级阶段娱乐直播至少可以做2年的时间，在这段时间里面，不需要对某个项目进行深度的运营和挖掘，就可以赚到一桶金。
    - 对于大部分想要在tiktok上赚到钱的小伙伴，娱乐直播是最简单也是最容易拿到结果的方向。
