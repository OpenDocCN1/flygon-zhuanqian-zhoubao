    - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
      role: apply
    excerpts:
    - 拆下来之后，我就发现很多时候有些项目是完全可以复制的，是不需要投入几十万也可以复制的。复制了之后，用跟他一样的内容生产方式、转化链路，你也能拿到一定的结果。
    - 有一个词叫做后发制人。就是你去做别人做过的事情，将其进行复制或者二次创作。
    - 我一定是看别人已经做成了，已经做了好几个月了，我才会选择做这个项目做这个赛道。
    - 渠道其实是有信息差的，我们做过很多项目，其实吃的就是信息差，有些项目在抖音上做得很烂的，但是如果你搬到小红书上面，瞬间就爆了。
    - 任何一个红海的赛道都不缺一个一年赚几十万的人，都不缺你一个一年赚几十万的人。
    - 所以你唯一能够要做的事情就是找到一个别人做过的事情，做了并且稳定有赚钱的项目。确定好赛道，给他们更匹配一点的调整就可以赚到钱。从 0 到100w，其实就是找到一个项目。
  - 'no': 2
    name: 商业项目拆解 —— 把“赚钱的别人”拆成“可复制的零件”
    points:
    - '**为什么需要这个概念？**'
    - '- 看到别人赚钱很容易，但“看不透”别人为什么赚钱，就无法复制'
    - '- 模仿表面（如照搬视频、复制话术）往往无效，因为没触及到底层链路'
    - '- 只有把“赚钱的别人”拆解为流量、转化、交付三个可复制的模块，才能真正内化并复现其商业模式'
    - '- 拆解能力是将“看到”转化为“做到”的关键桥梁'
    - '**核心定义**'
    - '- 商业项目拆解：一种系统化的方法论，将爆款内容或商业案例拆解为流量获取、转化链路和产品交付三个核心模块，并评估其可复制性与可持续性，据此复制出类似的副业项目'
    - '- 拆解八步法：找项目→拆流量→拆转化→拆产品交付→评估可复制/可持续→定策略→搭团队→强执行'
    - '**关键性质**'
    - '- 系统性：八步法覆盖从发现到落地的完整链路，而不仅仅是某一个环节'
    - '- 模块化：将项目拆为流量、转化、交付三大模块，每部分可独立评估与复制'
    - '- 可判定性：通过“是否偶然爆发、货源是否可寻、消费场景是否有需求”三条标准判定项目可复制性'
    - '- 落地导向：拆解最终指向策略制定、团队搭建和强执行，而非停留在分析层面'
    - '**典型例子**'
    - '- 拆流量：判断项目通过什么方式引流（是否固定内容分享、是否投放、是否有其他渠道）'
    - '- 拆转化：判断是通过直播间直接卖、引流到私域后社群转化，还是朋友圈+私聊，转化周期多久'
    - '- 拆产品交付：判断产品是有形还是无形、是货物/课程/招商加盟、客单价如何、是否有同行做了半年以上'
    - '- 评估可复制性：以“货源是否他人可寻、消费场景是否已验证有需求”为标准判断'
    - '- 定策略搭团队：明确产品/流量/转化三端口做法，将任务分工为产品端、流量端、转化端'
    - '**边界条件**'
    - '- 拆解的对象必须是已验证的、可持续盈利的项目，而不是偶然爆火的项目'
    - '- 拆解出的模块需要结合自身优势进行“微创新”，而非生搬硬套'
    - '- 评估可复制性时需考虑自身资金和时间限制（如投入五万十万的项目短期内无法复制）'
    - '- 拆解的最终目的是“强执行”，缺少这一步，前面所有分析都是自嗨'
    sources:
    - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
      role: origin
    excerpts:
    - 1、找项目。建立项目库。
    - 2、拆流量。它是通过什么方式引流？是不是固定的内容分享方式去引流的？还是投放？市面上他们有没有其他的引流渠道？
    - 3、拆转化。它是通过什么转化？直接在直播间里面卖、还是引流到私域后通过社群转化？还是通过朋友圈+私聊？转化周期多久？
    - 4、拆产品交付。这个产品是有形的产品，还是无形的产品？是货物、还是课程，还是招商加盟的项目，客单价怎么样？好不好卖？有没有同行做了半年以上？
    - 5、评估可复制性和可持续性。比如说他这个产品你需要投入五万十万的，那这个事情短期内复制不了；同行没有坚持三个月以上，持续不了，如果他坚持三个月以上说明他挣到钱了，那就可持续。
    - 首先，这个视频爆得偶然；其次，他货源不是他自己的，也就是说我可以通过别的方式找到他的货源；最后，这个消费场景经过验证是证明是有需求的，而且需求量还不小。
  - 'no': 3
    name: 六维评估模型 —— 给项目算一笔“复制账”
    points:
    - '**为什么需要这个概念？**'
    - '- 面对五花八门的副业机会，凭直觉和感觉做判断，极易被表面的“赚钱故事”迷惑'
    - '- 需要一把统一的“量尺”，把笼统的“这项目行不行”拆解为可量化、可比较的具体指标'
    - '- “复制放大”是副业升级的核心路径，但并非所有项目都具备可复制性——需要通过效率维度来判断'
    - '- 收入天花板高低，受客单价、毛利率、复购率等财务维度约束——需要通过财务维度来判断'
    - '**核心定义**'
    - '- 六维评估模型：将任何商业/副业项目拆解为六个可量化指标——流量效率、销转效率、交付效率、客单价、毛利率、复购率，并据此评估项目的可复制性和收入天花板'
    - '- 流量效率：以时间、素材、流量为指标，“花的时间少，素材难度低，获得流量大，即为流量效率高”'
    - '- 销转效率：以专业度为指标，“专业度要求低（能SOP），能一对多，即为销转效率高，本质也是时间，销售的时间利用率”'
    - '- 交付效率：以时间为指标，“花的时间少（人力少），即为交付效率高”'
    - '- 可复制化底层逻辑：若流量/销转/交付三效率均高，则赚多赚少取决于流量多少；若任一效率偏低，则需靠客单价、毛利率、复购率来弥补'
    - '**关键性质**'
    - '- 量化性：六个维度均有明确的评估指标，可逐项打分定位'
    - '- 分级判定：六个点满足越多越好，满足四个点为及格线'
    - '- 可复制性判断：三效率（流量/销转/交付）共同决定项目能否被复制放大'
    - '- 收入补偿机制：当效率维度偏低时，可通过提高客单价、毛利率、复购率来维持收入'
    - '**典型例子**'
    - '- 小说推文项目：流量效率高（素材获取简单、框架固定自带流量）、销转效率高（搜索暗号充值有佣金）、交付效率高（无需交付）、客单价低（十几二十块）、毛利率高（50%以上）、复购率低，月收益1000~2W'
    - '- 教育资料1.0（卖考研资料）：客单价低（十几到几十块）、毛利率高（50~100%）、复购率低，月收益1000~2W；2.0版本增加高客单价合作转化（数千至数十万），月收益提升至2W~100W——客单价提升显著放大收入天花板'
    - '- 减肥食谱项目：流量效率高（小红书/抖音发食谱）、销转效率高（网销按SOP）、交付效率低~高（产品无需交付、训练营需专人陪跑）、复购率高（减肥是重复过程），月收益10W~200W，收入高度依赖流量规模'
    - '- 项目拆解商业IP（小徐）：流量效率低（难批量产出）、销转效率高、交付效率低、客单价高（几千到六位数）、毛利率高（70%以上），月收益10W~200W，以高客单价补偿低效率'
    - '- 知识付费（李一舟）：流量效率高（口播即可）、销转效率高（直播间挂小黄车）、交付效率高（课卖掉即交付完）、客单价高（小几千）、毛利率高（100%）、复购率低，月收益10W~500W'
    - '**边界条件**'
    - '- 六维模型是评估框架而非绝对真理，项目不同阶段的指标可能动态变化（如教育资料从1.0到2.0客单价跃升）'
    - '- “满足四个点及格”是经验性判断标准，并非严格公式；仍应结合项目方向、个人资源等综合判断'
    - '- 效率维度的指标（时间、素材、专业度等）存在主观性，不同人对同一项目的评估可能存在差异'
    - '- 财务维度的补偿机制有上限：当三个效率维度都极低时，仅靠提高客单价难以维系长期收入'
    sources:
    - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
      role: origin
    - paper: docs/202301-02/I9OAdzzs2oBliNxsmPjcHnBUnzf.md
      role: apply
    excerpts:
    - 任何项目都可以拆解成：「流量效率，销转效率，交付效率，客单价，毛利率，复购率」，这六个点
    - 「六个点，满足的越多越好，满足四个点，及格」
    - 「六维模型：流量效率、销转效率、交付效率、客单价、毛利率、复购率，任何项目你都可以按照这六块去拆」
    - 我们以「时间，素材，流量」为指标。
    - 「花的时间少，素材难度低，获得流量大，即为流量效率高」
    - 「专业度要求低（能SOP），能一对多，即为销转效率高，本质也是时间，销售的时间利用率」
    - 「基本上网销不需要啥专业度，按SOP做就好，线下才需要极高的专业度」
    - 「花的时间少（人力少），即为交付效率高」
    - 流量效率高，意味着内容极其好复制，可以通过矩阵，培训等方式，把这一块单独拎出去，进行放大。
    - 如果流量效率，销转效率，交付效率，这三块有一块低的话，就很难复制放大，那就得在客单价，毛利率，复购率这三块下功夫，比如通过提高客单价来增加收入。
