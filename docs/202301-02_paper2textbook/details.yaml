    name: 非刚需陷阱 —— “想当然”的生意为何总做不成
    points:
    - '**为什么需要这个概念？**'
    - '- 很多人在选项目时凭直觉判断“这个东西肯定有人需要”，结果产品做出来却卖不动'
    - '- 他们以为需求存在，但实际是“弱需求”——用户觉得可有可无，付费意愿极低'
    - '- 需要引入“刚需”这个筛子，在投入大量时间金钱前判断一个需求是否足够痛'
    - '- 非刚需项目链条太长推不动的教训，可以帮创业者避免“自嗨式创业”'
    - '**核心定义**'
    - '- 刚需是指用户不得不解决、且愿意为之付费的需求；非刚需则指可有可无、付费意愿弱的需求'
    - '- “最终是项目的本性成就人，而不是人去推动一个不够刚需的项目”'
    - '**关键性质**'
    - '- 付费意愿差异：刚需用户会主动寻找解决方案并付费，非刚需用户即使看到产品也会犹豫'
    - '- 推动力差异：刚需品有天然的“拉力”，而非刚需品需要大量教育成本去“推动”用户'
    - '- 链条长度：非刚需项目的转化链条往往很长，中间任何一个环节的流失都会让前功尽弃'
    - '**典型例子**'
    - '- 睡眠问题催生的睡播：失眠人群巨大，且愿意为“帮助入睡”付费，是刚需'
    - '- 副业培训：想多赚钱是广泛刚需，所以知识付费能持续火爆'
    - '- 作者10年创业失败4次的教训：非刚需项目（链条太长）做不起来，最终靠副业培训（刚需）上岸'
    - '**边界条件**'
    - '- 刚需与伪需求、弱需求之间存在模糊地带，需要通过MVP小成本验证（如预售）来判断'
    - '- 某些非刚需品可以通过“制造需求”或“升级为身份象征”来变相成为刚需（如奢侈品），但难度极高'
    - '- 刚需不等于一定有利润：还需考虑供给端竞争、客单价、毛利是否能支撑商业闭环'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    excerpts:
    - 我现在的理念就是非刚需的项目都不做了，我现在手上在循环的项目，也只有副业和减肥两个事情。
    - 不够刚需的事情现在一律不敢做了…其中的原因就是不够刚需，链条太长了，你认为你推的动，结果就是挣不到钱…最终是项目的本性成就人，而不是人去推动一个不够刚需的项目。
    - 本人创业 10 年创业失败 4 次，负债百万靠自媒体上的岸…
  - 'no': 7
    name: MVP验证 —— 先“卖想法”再“做产品”
    points:
    - '**为什么需要这个概念？**'
    - '- 多数人做产品习惯“先开发、后找买家”，投入大量时间和资金后才发现没人要，损失惨重'
    - '- 这是“从产品出发”的思维陷阱，误以为好产品自然有人买，而忽略了需求验证的优先级'
    - '- 需要一种低成本的试错方法，在投入重资源之前就判断需求是否真实存在'
    - '- MVP先卖后做的逻辑，让“失败”变得廉价、快速、可重复'
    - '**核心定义**'
    - '- MVP（最小可行产品）不是做一个小而全的产品，而是用最低成本验证需求是否成立'
    - '- 核心做法是“先卖产品的想法，而不是做产品”：如果聊了100个人只有几个人买，肯定有问题；如果20-30人购买并交了预售金，则该不确定因素已解决'
    - '**关键性质**'
    - '- 低成本：不需要完整开发，用预售页、截图、口头描述即可测试'
    - '- 快速反馈：可在短时间（几天到几周）内获得付费意愿数据'
    - '- 筛选大于培养：尝试次数多了就知道哪个是比较好的方案，而非在单个项目上死磕'
    - '**典型例子**'
    - '- 卖空气：产品不存在时，用模型、截图、预售页制造“已有”的假象，先收钱、测试需求'
    - '- 软文先行：先写软文看阅读和咨询量，再决定是否投入开发'
    - '- 美团电商冷启动：第一家店跑通最小MVP仅仅花费了80元，验证了平台红利后再规模化扩张到30家店'
    - '**边界条件**'
    - '- 预售（卖想法）需要一定的流量或影响力基础，完全无流量则可能测不出真实需求'
