    - '**核心定义**'
    - '- 一种借力放大的合作打法：筛选当地行业头部机构（行业冠军），以冷电话+见面洽谈达成联营合作（服务费+分成），借其预算、背书与完整变现体系放大抖音流量'
    - '**关键性质**'
    - '- 筛选标准：当地最大机构、有预算、有背书、变现体系完整'
    - '- 操作流程：搜索/朋友问→企查查/BOSS直聘查老板电话→cold call→约见面→谈成联营'
    - '- 付费模式：每月服务费+项目分成'
    - '**典型例子**'
    - '- 作者通过cold call约见面两次后谈成与当地最大机构的联营合作，每月服务费+项目分成'
    - '- 高考志愿项目通过联营合作两个月精准涨粉10万+，私信爆满'
    - '**边界条件**'
    - '- 需要自身具备较强的流量操盘能力，否则无法说服行业冠军合作'
    - '- 行业冠军也可能已有合作方或有自己团队，需要差异化切入'
    sources:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
      role: origin
    excerpts:
    - 所以就搜、找朋友问，哪家机构是我们当地最大的，也就是行业冠军，然后企查查、boss直聘查老板电话，直接一个cold call打过去，也很顺利，约见面两次后，谈成联营合作，每月的服务费+项目分成
    - 行业冠军的好处就是有预算、有背书、变现体系完整，这种是更适合抖音放大的好企业。
    - 两个月，高考志愿号精准涨粉10万+，私信爆满。
  - 'no': 7
    name: 选品即定人群找需求 —— 先锁定「谁要」，再决定「卖什么」
    points:
    - '**为什么需要这个概念？**'
    - '- 盲目选品容易陷入同质化竞争，导致视频流量差、转化低'
    - '- 不同人群的需求差异巨大，只有精准匹配才能提高成交率'
    - '- 从人群需求出发选品，是低成本获取精准流量的核心方法'
    - '**核心定义**'
    - '- 选品的核心原则：通过定义目标人群标签并挖掘该人群的特定需求来选择品类'
    - '- 优先选择垂直需求品（特定人群的刚需），而非通用品（所有人的需求）'
    - '**关键性质**'
    - '- 人群导向性：选品从目标人群标签出发，而非从产品本身出发'
    - '- 需求垂直性：优先选择垂直需求而非通用需求'
    - '- 价格次要性：对目标人群而言，需求匹配度比价格更重要'
    - '**典型例子**'
    - '- 视频号用户以中老年人+下沉城市为主，其特定需求是''身体好、重返青春''，因此运动锻炼类和保养类产品优先考虑'
    - '- 服装、食品等通用品因需求普遍，不作为第一梯队选择'
    - '**边界条件**'
    - '- 通用品并非不能做，但需要更多考虑如何通过视频、直播传递产品特色和优势'
