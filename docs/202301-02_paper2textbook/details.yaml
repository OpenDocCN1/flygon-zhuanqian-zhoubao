    - '**核心定义**'
    - '- 普通人赚取的绝大部分收入来自时代红利，仅有少部分是对个人能力的补偿'
    - '- 英雄是时势的产物，商业英雄是平台与市场红利的产物'
    - '**关键性质**'
    - '- 时代红利与个人能力呈互补关系：红利决定量级，能力决定在红利中的分额'
    - '- 红利窗口具有时效性，识别窗口比单纯提升能力更紧迫'
    - '- 红利时隐时现，需要通过数据推演与行业观察来捕捉'
    - '**典型例子**'
    - '- “可能所有夸张，我们所赚的每一百块钱，有九十块钱是时代红利，仅有十块钱是时代对我们个人能力的补偿”'
    - '- 视频号直播+私域被认为兼具短期爆发力与长期基本盘，正是对时代红利的主动顺应'
    - '**边界条件**'
    - '- 时代红利论不否定个人努力的价值，只是重新校准了成功归因的权重'
    - '- 该概念适用于解释宏观层面的财富分配，不适用于指导单次微观决策'
    - '- 红利是客观存在但稍纵即逝的，识别与抓住红利都需前置行动'
    sources:
    - paper: docs/202301-02/20230207_03.md
      role: origin
    excerpts:
    - 可能所有夸张，我们所赚的每一百块钱，有九十块钱是时代红利，仅有十块钱是时代对我们个人能力的补偿，英雄只是时势的产物。
    - 近年来，因为现在信息传递越来越快了，项目红利期是越来越短的。所以我就在思考，怎么样能长短线结合，又有短期的爆发力，又有长期的基本盘。目前看，视频号直播+私域是有这个属性的。
    - 执行力是值钱的，执行力是可以变现的，我想奖励执行力；邀请我去生财办公室这何尝不是对我的执行力的一种奖励。
    - 亦仁大概花了 7W 买了她坚持 4 个月加了 4000 多好友的微信号。
  - 'no': 6
    name: 实时真实ROI —— 把私域产值算进投放账本的“复利眼”
    points:
    - '**为什么需要这个概念？**'
    - '- 传统ROI只计算直播间直接的广告回报，系统性低估了私域流量的长期价值'
    - '- 投放决策依赖精确的投产比，错误的算法会导致广告预算配置失当'
    - '- 需要一种综合核算方法，把公域引流与私域复购统一到同一本账上'
    - '**核心定义**'
    - '- 将私域流量产生的额外年产值计入投放产出后，综合计算得到的投产比'
    - '- 公式：纯直播间利润 = q*z - y；加入私域后纯利润 = 每月 q*z-y + z/n×60%×p'
    - '**关键性质**'
    - '- 私域进线率60%为合格线，直接影响私域产值的计算'
    - '- 月产值（p）与递减率（前3个月按80%算，后续看维护）共同决定长期ROI'
    - '- 私域产值是不需要额外投放的“免费增量”'
    - '**典型例子**'
    - '- 150客单价产品、进粉率60%、月产值8-15元时：只做直播ROI为2.5，加入私域后提升至3.5，月产值翻倍则可达4.5'
    - '- 视频号直播一小时可加到私人微信近200人，生财新年预约51个、加曹大星球49个——公转私的效率直接拉高综合ROI'
    - '**边界条件**'
    - '- 公式依赖稳定的私域进线率与月产值数据，需持续追踪维护'
    - '- 适用于直播+私域联动的业务模式，不适用于纯公域一次性变现'
    - '- 递减率假设（前3个月80%）基于经验，不同行业需自行校准'
    sources:
    - paper: docs/202301-02/20230207_03.md
      role: origin
    excerpts:
    - roi2.5 也就是我 100 万的营业额，需要有 40 万的广告投放，那么在这 40 万的投放算到私域中，我将额外有 100 万×60%×60/150=24
      万的私域营业额，这一块是无需投放的……这么一算我的 roi 就从 2.5 提升到了 3.5。
    - 做一个公式：客单价 n 的产品，毛利率如果是 q，投入 y，直播间除去退货后营业额为 z。私域进线率 60%为合格，月产值为 p。那么你只做直播间纯利润就是
      q*z-y；做私域后纯利润就是 q*z-y 每个月加上 z/n×60%×p，月递减前 3 个月按 80%算，后面看维护。
    - 我们 150 客单价的产品，进粉率 60%的情况下，月产值只能做到 8……年产值算完衰减，能到 60。
    - 昨天开了个直播，一小时吧，加到私人微信近 200 人，生财新年预约人数 51 个，加曹大星球 49 个。
  - 'no': 7
    name: 捡漏群 —— 用“1-3折”把羊毛党变成现金流的社群引擎
    points:
    - '**为什么需要这个概念？**'
    - '- 传统电商获客成本高企，需要一种低成本、高转化的私域变现模式'
    - '- 用户对“低价好物”有持久需求，但缺乏可持续的供给与信任渠道'
    - '- 社群运营需要一套标准化的选品、排品与氛围营造方法'
    - '**核心定义**'
    - '- 通过企业微信建立社群，以原价1-3折的超高性价比商品吸引用户，通过佣金变现的电商模式'
    - '- 每天精推一个主品，配置30-50个“演员”营造抢购氛围，配合4-6次递进式催单'
    - '**关键性质**'
    - '- 核心要素：稳定的企微主体、靠谱且稳定的流量、精细化的社群运营、规模大小、多重变现'
