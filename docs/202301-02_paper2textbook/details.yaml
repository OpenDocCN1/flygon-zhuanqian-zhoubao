    - '- 资金规模决定赛道层级：资金量不同，适合的赛道和打法完全不同'
    - '- 容错率控制：合理分配资源，不把全部筹码押注在单一方向上'
    - '- 前置性：赛道选择发生在投入之前，是需要最先做出的战略判断'
