    name: 卓越策略师的五大能力 —— 从“执行者”到“操盘手”的素养模型
    points:
    - '**为什么需要这个概念？**'
    - '- 不少人做项目停留在“执行”层面（按部就班做事），缺少系统性的策略思维与全局把控能力'
    - '- IP打造与项目操盘既是技术活也是策略活，需要一套综合素养框架来指导成长'
    - '- 单点能力（如内容创作）无法支撑从0到1再到N的完整闭环'
    - '**核心定义**'
    - '- 卓越策略师应具备的五项综合素养：扎实的调研能力、清晰逻辑的归纳总结能力、把控全局的项目管理能力、让人难以怀疑的决断力、面向内外部的双重叙事能力'
    - '- 调研能力：面对陌生行业和客户，需下苦工做充分调研，对调研的压倒性投入就是对客户的负责'
    - '- 归纳总结能力：基于事实进行归纳，而非依赖“头脑风暴”，强调“搜尽奇峰打草稿”'
    - '- 项目管理能力：严格把控提案时间、访谈节点、设计与策略推进的完整节奏'
    - '- 决断力：能成为客户可依赖的人，而不只是简单的需求执行方'
    - '- 叙事能力：在提案和汇报时同时具备面向客户和消费者的双重视角'
    - '**关键性质**'
    - '- 系统全面：五项能力共同构成从调研到交付的完整闭环'
    - '- 可迁移性：不仅适用于策略咨询，也适用于IP操盘、项目管理、副业孵化等场景'
    - '- 实践导向：每项能力都强调“落地”与“推进”，而非纸上谈兵'
    - '**典型例子**'
    - '- 策略师面对全新行业时通过十几个竞品分析、十几万字访谈、不计其数行业报告来支撑策略，体现调研的压倒性投入'
    - '- “搜尽奇峰打草稿”：画家广泛收集各种山峰并反复练习草图，策略师同样需要先广泛收集事实再反复归纳推敲'
    - '**边界条件**'
    - '- 五项能力需要综合发展，短板可能成为项目推进的瓶颈'
    - '- 调研投入需与项目预算和时间约束相平衡，不能无限拉长'
    sources:
    - paper: docs/202301-02/20230207_04.md
      role: origin
    excerpts:
    - 1. 扎实的调研能力 不管是什么项目，不管你是多少年经验的营销从业者，在面对陌生的行业和客户时，都要下苦工去做充分的调研。
    - 2. 清晰逻辑的归纳总结能力 不同于广告的'头脑风暴'，策略师更加将就基于事实的归纳。
    - 3. 把控全局的项目管理能力 每一个项目都有着严格的提案时间，什么时候做访谈、什么时候要根据策略推动设计，这些都需要清楚的规划和时间意识。
    - 4. 让人难以怀疑的决断力 策略师能够成为让客户可以依赖的人，而不只是简单的需求执行方。
    - 5. 面向内外部的双重叙事能力 由于策略师特殊的身份，提案和汇报时会同时兼具面向客户和消费者的两种视角。
    - 对调研的压倒性投入，就是对客户的负责。而每一次调研的背后，可能是十几个竞品分析，十几万字的消费者、店长和经销商访谈，不计其数的行业报告等等。
    - 一句名言非常贴切：'搜尽奇峰打草稿'，这个典故是画家在画山峰时广泛收集各种不同的山峰，并不断练习打草稿。懂得搜奇峰是懂得妙理，多打草图是能用苦功。
