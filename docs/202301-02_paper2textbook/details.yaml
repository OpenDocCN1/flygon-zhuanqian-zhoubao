    name: 流量流速悖论 —— 不快不慢才能“流得住”
    points:
    - '**为什么需要这个概念？**'
    - '- 运营者常追求“流量暴涨”，以为来得越快越多越好，结果流量像洪水一样冲过，什么也没留下'
    - '- 也有人苦于流量太少，但即使突然获得大量曝光，因承接能力不足也转化惨淡'
    - '- 需要理解流量不是“越多越好”，而是“流速适当”才有价值'
    - '- 这个认知决定了你是去追爆款还是做持续稳定的内容供给'
    - '**核心定义**'
    - '- 流量的核心是“流”和“量”，既要流动也要停留，不快不慢、持续不断，这样的流量价值才是最大的'
    - '- 太快无法形成连接和停留、太慢丧失规模，核心是增加用户停留时间并保持规模'
    - '**关键性质**'
    - '- 停留即连接：只有停留才能产生互动、信任和转化的可能'
    - '- 规模即势能：过慢的流量无法形成规模效应，合作方和算法都不会给你更多推荐'
    - '- 动态平衡：需要根据承接能力调节获取流量的速度和节奏'
    - '**典型例子**'
    - '- 爆款视频带来百万播放但账号不留人，因为内容与账号定位不垂直，流量“流过去”了'
    - '- 视频号直播一小时引流200人到私域，粉丝在直播间停留产生了信任，后续持续转化'
    - '- 小红书资料号每天稳定发布内容，流量平稳增长，用户精准且停留时间长，转化率30%-40%'
    - '**边界条件**'
    - '- 不同生意的最佳流速不同：高客单低频生意需要“深连接、慢流速”，低客单高频则相反'
    - '- “停留”不等于“转化”：还需要信任和购买力的配合'
    - '- 算法推荐的波动会导致流速难以精准控制，需要主动运营手段（如直播、社群）来稳定'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    excerpts:
    - 流量的速度太快、没有停留、规模再大也没有用，流量一直停留不动也不行，等于没有了规模。
    - 流量的核心是流和量，就要流动也要停留、不快不慢、持续不断，这样的流量价值才是最大的。
    - 增加用户的停留时间。
