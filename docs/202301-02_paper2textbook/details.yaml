    points:
    - '**为什么需要这个概念？**'
    - '- 流量进来后若无人承接，会快速流失并产生举报'
    - '- 不同广告类型的变现效率差异巨大'
    - '**核心定义**'
    - '- 流量承接双模块：关键词回复（自动推送链接）与收到消息回复（引导文案降低举报率）'
    - '- 手动广告位优化：将文中广告置于''引导关注文案''下方，利用读者第一反应与平台误导性推荐拉高单价'
    - '- CPS/CPA载体选择：订阅号文章内链接不生效，自动回复中可放可点击蓝字链接'
    - '**关键性质**'
    - '- 半匹配关键词回复：设置多个变体词，只要回复包含任一词语即自动回复链接'
    - '- 手动广告位是流量主收入远超同行的核心原因'
    - '- 自动回复链接是CPS/CPA落地变现的唯一落脚点'
    - '**典型例子**'
    - '- 行程码热点：流量主收入6514元（3个单号破千），电话卡CPS卖出6张佣金400余元'
    - '**边界条件**'
    - '- 外卖进群CPA路径过长、诱惑力小，转化率低'
    - '- 收到消息回复需精心设计引导文案以降低举报率'
    sources:
    - paper: docs/202301-02/AmKRdF2Z9oQjDExxxuAc18a5nbb.md
      role: origin
    excerpts:
    - 我把广告添加在点击关注下方公众号进入主页这句话下面，很多读者第一反应就会直接点击广告，稍微带了一些诱导性质；另外平台推荐广告的时候，文中广告位直接就推荐其它公众号，很有误导性。这也是为啥我公众号这次追热点流量主收入那么高的原因。
    - 关键词回复有一个半匹配功能，意思就是读者回复半匹配中任意一个词语，公众号后台都会自动回复对应链接。
    - 订阅号文章页面放链接不会生效跳转，但是它放在自动回复里面就可以实现。
