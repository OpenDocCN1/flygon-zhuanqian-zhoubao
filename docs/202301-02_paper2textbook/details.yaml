    name: 选品与对标实操 —— 从视频号入门到快手对标筛选
    points:
    - '**为什么需要这个概念？**'
    - '- 明确了人群和需求，仍需一套落地操作：如何选品、如何找对标账号'
    - '- 对标账号筛选能规避搬运重复风险，并获得可持续素材'
    - '**核心定义**'
    - '- 用''选品即定人群找需求''原则锁定品类后，还需结合抖音/快手/拼多多的在做人数量判断蓝海程度'
    - '- 筛选可搬运的对标账号：粉丝5W以下、视频200条以上、垂直品反复带、画面干净'
    - '**关键性质**'
    - '- 蓝海判断：做的人少（尤其视频号也少）可以考虑测，做的人多则谨慎'
    - '- 低粉丝量：被搬过的几率小，号主同时发视频号的几率也小'
    - '- 高视频量：素材多，可支撑长期发布和筛选'
    - '**典型例子**'
    - '- 作者通过直接搜品名、找真人出镜号、点开主页筛选对标账号'
    - '- 优先选择画面干净、有一定非带货视频的账号'
    - '**边界条件**'
    - '- 筛选标准并非绝对，需结合具体品类和平台调整'
    - '- 对标的账号也可能更新停止或转型，需要定期更新对标库'
    sources:
    - paper: docs/202301-02/Lg2vd5GWHoqhBbxuT5LcThEpncb.md
      role: origin
    excerpts:
    - 做的人多，我就再去视频号搜一下看，如果也很多，可能就不会考虑了。视频号如果不多，就可以考虑测一下。
    - 那种抖音快手根本没什么人做的，这种我基本也不考虑，一个是素材能找，还有一个就是我们这是找蓝海，不是找死海。
    - 直接搜品的名字，然后找那种真人出镜的点开主页去看。
    - 粉丝在5W以下、视频在200以上、一直围绕几个品反复带、视频画面不是自己加很多字的、有一定的非带货视频、保持更新，这样的号我就会把它列入考察目标。
    - 小号就代表被搬过的几率小，而且号主本人同时在发视频号的几率也小。视频多素材就多，可以发的久也可以去做筛选。
    - 我觉得如果能参杂一点非带货视频，会比纯带货号好一点。
