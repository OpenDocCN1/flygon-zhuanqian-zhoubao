    - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
      role: improve
    excerpts:
    - 想着离职后先要搞定社保问题，找了代办公司注册公司，方便自己交社保，这公司不知不觉也有4个年头了。
    - 专业——流量——成交——深挖需求——复购，不断做好这个闭环。
    - 我们不收中介费，是因为中介费本身就是个伪概念！为什么说是伪概念，因为是智商税，中介费为什么要收？就是因为买房及租房者不知道售房及出租转让业主的联系电话！
    - 回想一下买房的用户为什么要私下找我成交？我在开发新店的时候为什么愿意跑中介的单子？其实就是想省掉高额的中介费，中介提供的价值不值得收取这么高的费用。
    - 一句话：恶搞之让你睡不着
    - 对于大部分想要在tiktok上赚到钱的小伙伴，娱乐直播是最简单也是最容易拿到结果的方向。
  - 'no': 2
    name: 信息差即商业机会 —— 你凭“知道别人不知道的”赚钱
    points:
    - '**为什么需要这个概念？**'
    - '- 痛点存在但用户不知道如何解决，就形成了信息差'
    - '- 中介费、搬运费、代办的实质都是信息差的定价'
    - '- 互联网放大了信息差——A平台烂内容正是B平台的爆款'
    - '- 看懂信息差才能看懂“为什么别人能赚钱而我不能”'
    - '**核心定义**'
    - '- 信息差指一方掌握而另一方不掌握的关键信息（如房东电话、低价货源、平台红利），凭借这种不对等可以合法获取利益'
    - '**关键性质**'
    - '- 不对称：买卖双方掌握的信息不对等'
    - '- 可定价：用户愿为省时、省力的关键信息付费'
    - '- 可抹平：平台或竞品一旦跟进，信息差就消失'
    - '**典型例子**'
    - '- 胖龟找房把“房东联系电话”这一信息透明化后取消中介费；生财有术里“把抖音做烂的内容搬到小红书就爆”；闲鱼“低买高卖”的倒爷套利本质都是靠信息差赚钱'
    - '**边界条件**'
    - '- 信息差必须合法合规，不能涉及隐私窃取或欺诈；信息差的窗口期通常有限，需在被人抹平前完成收割或建立新壁垒'
    sources:
    - paper: docs/202301-02/PglAdRMiIoVTRyxc4Q3cw8hvnWf.md
      role: origin
    - paper: docs/202301-02/FCiidWBeJoLOT1xreYnc9Se4nOf.md
      role: improve
    excerpts:
    - 生意的本质就是信息差，在互联网里也存在大量的信息差生意。以这个信息差为市场的切入点我们创办了胖龟找房的 1.0——没有中介费的个人房屋分享平台。
    - 如果买房者或者租房者知道房东电话！那么他们还会给中介公司掏中介费吗？nonononon，绝对不会！这叫什么？是不是信息不对等差造成的信息差？
    - 回观抖音的发展路径，第一阶段就是高流量低商业化阶段，这时候要做的并不一定要跟平台的指向，而是要看清平台的现状。
  - 'no': 3
    name: 选品定生死 —— 好产品自带流量和转化力
    points:
    - '**为什么需要这个概念？**'
    - '- 产品不好，再强的运营也是徒劳'
    - '- 好产品自带转化力和复购力，能省掉一半销售精力'
    - '- 很多创业者重营销轻选品，导致后端交付无力、口碑崩塌'
    - '- 选品本质是解决“卖什么才能持续赚钱”的问题'
    - '**核心定义**'
    - '- 选品决定论是强调产品本身的质量、需求匹配度和复购潜力优先于销售技巧的商业方法论，即“产品好省一半心”'
    - '**关键性质**'
    - '- 需求覆盖：好产品应深挖用户需求并涵盖面齐全（祛痘+美白+抗衰）'
    - '- 粘性：口服类等产品一旦被接受，用户不轻易换品牌'
    - '- 背书：与医院合作能强化品牌专业可信度'
    - '**典型例子**'
    - '- 夕子选品三要素——涵盖面齐全的口服趋势产品+医院背书；TikTok睡播的“独木舟”式的简单直播间也能破万在线'
    - '**边界条件**'
    - '- 选品决定性不能替代运营——在竞争充分领域仍需流量打法配合；小众高客单产品虽好但市场规模有限'
    sources:
    - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
