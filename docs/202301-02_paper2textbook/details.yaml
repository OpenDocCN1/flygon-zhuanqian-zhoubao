    name: 剥离式拆解问题法 —— 用100个小问题锁定团队精力
    points:
    - '**为什么需要这个概念？**'
    - '- 团队或个体常陷入''忙碌但低效''的困境，精力被分散在各种琐事上'
    - '- 需要一套结构化的问题拆解方法，确定真正值得投入精力的方向'
    - '- 优质内容的浓缩、归纳与提炼本身就是一种可复用的思维工具'
    - '**核心定义**'
    - '- 提炼客户群体最需要解决的 10 个大问题，把每个大问题拆解为 10 个小问题，得到 100 个问题'
    - '- 你和你的团队，最该花时间的地方，就是这 100 个小问题'
    - '**关键性质**'
    - '- 从''客户真实需求''出发而非从''自我视角''出发——先想清楚问题，再投入精力'
    - '- 层层剥离：大问题是方向性的，小问题是可执行的——剥离到最小行动单元才可落地'
    - '- 该方法兼具''发现问题''与''确定优先级''的双重功能'
    - '**典型例子**'
    - '- 做项目拆解时，不是泛泛地看100个项目，而是先确定客户最关心的10个大问题，再逐层拆解成100个可操作的小问题'
    - '- ''真传一句话，假传万卷书''——好的归纳浓缩能让团队快速获取有效信息、节省时间'
    - '**边界条件**'
    - '- 大问题的提炼需要贴近客户真实需求，避免''拍脑袋''式的主观臆断'
    - '- 100个小问题仍需进一步排序，资源有限时不能''平均用力'''
    - '- 适用于需要团队协作的复杂项目，不适用于个人极简决策场景'
    sources:
    - paper: docs/202301-02/20230207_05.md
      role: origin
    excerpts:
    - 提炼客户群体最需要解决的 10 个大问题，并把每个大问题拆解为 10 个小问题，得到 100 个问题，你和你的团队，最该花时间的地方，就是这 100 个小问题。
    - 真传一句话，假传万卷书。
    - 一般看到好的文章我都会思考后做精华总结，争取做到看到这一两句话，就能想到整个文章的内容框架。毕竟学习不是为了饱读诗书，而是当你遇到这个问题的时候能快速拿出来用，能做到学以致用的内容才是好内容。
  - 'no': 12
    name: MVP最小成本验证 —— 先卖想法，再建产品
    points:
    - '**为什么需要这个概念？**'
    - '- 创业者常犯的错误是先投入大量资源开发产品，再验证市场需求，一旦需求不成立则损失惨重'
    - '- 需要一种低成本、快速验证需求的方法，避免''闭门造车''式的自嗨'
    - '- 传统''先开发后售卖''的流程无法适应快速变化的市场节奏'
    - '**核心定义**'
    - '- 验证产品应优先卖想法而非做产品，通过高意向付费人数判断需求是否成立'
    - '- 聊了100人只有几个人买则需求有问题；20-30人购买并交预售金则该不确定因素解决'
    - '**关键性质**'
    - '- 以''付费意愿''作为需求验证的核心指标，而非口头表态'
    - '- 可短时间测试几十个产品，用筛选代替培养'
    - '- 思考顺序：先假设，再设计MVP测试，最后根据结果迭代'
    - '**典型例子**'
    - '- 教育资料项目先预售电子资料而非开发平台，用小额付款验证需求后快速跑通'
    - '- 外卖CPS项目以公众号为底座先跑通''公众号经验+平台流量''的MVP，再扩展规模'
    - '**边界条件**'
    - '- MVP验证的是''需求是否存在''，而非''产品能否做好'''
    - '- 需设定明确的验证标准（如20-30人付费），否则容易陷入无限测试'
    - '- 适用于新产品/新方向的验证，不适用于已验证的成熟业务扩张'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    excerpts:
    - 比如最重要的是先卖产品的想法，而不是做产品。如果聊了 100 个人，只有几个人买，肯定有问题；如果 20-30 个人购买，交了预售金，那这个不确定因素就解决了。
    - 这样我们就能够在短时间内测试几十个产品，最后得出一个正确选项，这是最好的验证方式。因为筛选大于培养，尝试次数多了就知道哪个是比较好的方案。
    - 要让自己养成精益思维，用最小成本验证那些最不确定的因素，先有一个假设，然后设计一个 MVP 测试。
    - 先行动就对了，行动才是解决一切焦虑的最好办法。不要想太多，先行动
