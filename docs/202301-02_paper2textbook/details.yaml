    name: 创业项目匹配度 —— 结合自身资源而非盲目All In
    points:
    - '**为什么需要这个概念？**'
    - '- 很多人严重低估已有项目而过分高估新项目，看到"赚钱"的新项目就盲目投入'
    - '- 项目与自身资源不匹配时，再好的项目也难以做出成果'
