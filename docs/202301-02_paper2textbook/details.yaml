    - 1. 列出除劳动合同主文件外，你必须配套的附件清单（至少4项）
    - 2. 针对'岗位考核表'这一附件，设计一个可量化的考核模板（含3-5个考核指标）
    - 3. 说明每一项附件分别解决了什么风险（如劳动争议举证、保密义务等）
    - 任务二（辞退流程模拟）：
    - 1. 描述一个你作为负责人需要辞退员工的场景（设定具体理由）
    - 2. 按照'损失最小化原则'列出你的处理步骤（至少4步）
    - 3. 解释为什么'离职原因写个人原因'和'离职当天结清工资'是重要的操作
    - 思考题：
    - '- 如果员工拒绝在离职表上签字或拒绝写''个人原因''，你会如何应对？'
    - '- 劳动合同的时效性要求是什么？为什么节假日前后更容易出现未及时签合同的情况？'
