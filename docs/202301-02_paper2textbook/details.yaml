    - '- “不做什么”的前提是已明确“要做什么”，否则只是消极不作为'
    - '- 战略指导原则需保持稳定，频繁更迭则失去指导意义'
    - '- 禀赋的识别需客观，自我认知偏差会导致战略建立在虚构优势上'
