    name: 信息差生意 —— 在你身边“闷声发大财”的隐藏金矿
    points:
    - '**为什么需要这个概念？**'
    - '- 多数人以为赚钱机会都在网上“热门项目”里，却忽略了身边真实存在的低竞争机会'
