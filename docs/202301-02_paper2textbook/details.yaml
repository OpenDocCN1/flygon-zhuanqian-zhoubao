  - 'no': 17
    name: 财富积累四阶段 —— 从“卖时间”到“钱生钱”的跃迁之路
    points:
    - '**为什么需要这个概念？**'
    - '- 许多人对赚钱的理解停留在“打工”或“做小生意”层面，不理解为何有的人越做越轻松、收入却越来越高'
    - '- 如果不能清晰认知财富积累是一个分阶段跃迁的过程，就容易在同一阶段内打转'
    - '- 需要建立“从出卖劳动力到钱生钱”的阶梯认知，明确每个阶段的跃迁条件和方向'
    - '**核心定义**'
    - '- 财富积累分为四个阶段，且必须依次跃迁：第一阶段出卖劳动力（打工）；第二阶段一份时间多次卖（写书/卖课）；第三阶段购买他人时间（当老板）；第四阶段钱生钱（投资）'
    - '- 第二阶段的核心是“把同一份时间卖出多次”，如写书、录课、做软件；第三阶段的核心是“杠杆他人的时间”，通过雇佣放大产能；第四阶段的核心是“资本运作”，用钱赚钱'
    - '- 对应的个人成长路径分为人生四阶段：初入职场（30岁前扩广度）、中年危机（30岁后做管理拉高度）、第二曲线（副业/改命机会）、复制商业放大（钱生钱）'
    - '**关键性质**'
    - '- 阶段递进：四个阶段不可跳跃，每一阶段是下一阶段的基础'
    - '- 杠杆递增：从出卖劳动力到钱生钱，杠杆率与收入天花板逐级提升'
    - '- 时间解放：阶段越高，对个人时间的依赖越低'
    - '**典型例子**'
    - '- 出卖劳动力：外卖员、普通白领按时间领取工资'
    - '- 一份时间多次卖：作家写一本书，被千万人购买，边际成本为零'
    - '- 购买他人时间：老板雇人组建团队，赚取组织利润'
    - '- 钱生钱：投资人通过股权投资、理财获得被动收入'
    - '**边界条件**'
    - '- 每个阶段的跃迁需要特定的能力与资源条件，不可盲目越级'
    - '- 不同行业的“一份时间多次卖”难度差异极大（如服务业难以标准化复制）'
    - '- 钱生钱阶段需要前期足够的本金积累和风险承受能力'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    excerpts:
    - 财富积累分为四个阶段，第一：出卖劳动力；第二：一份时间多次卖；第三：购买他人时间；第四：钱生钱。
    - 第二阶段是一份时间多次卖…第三个阶段是什么？购买他人时间…第四个阶段，就是去钱生钱了…你就是投资。
    - 人生四个阶段，第一阶段：初入职场（30 岁以前）…第二阶段，中年危机，在这个阶段一定要去做管理…第三个阶段的话，其实我就是你要开始在你的主业以外，你要去寻找自己的第二曲线…第四个阶段其实就是你在第二曲线找到了一个
      MVP…然后组建团队给它放大。
