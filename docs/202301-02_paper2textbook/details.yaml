    - 2. 对照“卓越策略师五大能力”自评：
    - '- 调研能力：你对这个项目的竞品和用户做过多少调查？'
    - '- 归纳总结能力：你能把经验浓缩成几句可复用的话吗？'
    - '- 项目管理能力：你的时间表和里程碑清楚吗？'
    - '- 决断力：面对分歧你能拍板吗？'
    - '- 叙事能力：你能把项目讲给客户和团队听吗？'
    - 3. 找出最薄弱的1-2项能力，制定一个30天的提升计划。
  units:
  - 'no': 1
    name: 盈利验证与放大 —— 从“跑通”到“复制”的最小闭环
    points:
    - '**为什么需要这个概念？**'
    - '- 新项目启动时容易陷入“追求完美”而迟迟不行动的误区'
    - '- 需要一个明确的最小成功标准，来验证商业模式是否成立'
    - '- 只有先跑通“从0到1”的闭环，才能判断是否值得“从1到N”放大'
    - '**核心定义**'
    - '- 用最快速度、最低成本完成“产品—流量—销售—交付”的最小可行闭环，哪怕只赚一元钱'
    - '- 先卖产品的想法而非做产品，用高意向付费人数判断需求是否成立：聊了100人只有几个人买肯定有问题；20-30人购买并交预售金则该不确定因素解决'
    - '- 将月入3000的号复制30多遍，把盈利的事情重复做，即实现项目放大'
    - '**关键性质**'
    - '- 验证优先：先判断“能否赚到钱”，再考虑“如何赚更多钱”'
    - '- 可复制性：盈利模型必须具备标准化、可重复执行的特征'
    - '- 规模潜力：单点盈利是基础，能否无限复制放大决定项目天花板'
    - '**典型例子**'
    - '- 月入3000的号通过矩阵化运营复制30遍，变成大生意'
    - '- 哪怕只赚一元钱，只要能无限放大就是年赚百万的项目'
    - '- 短时间测试几十个产品，最后得出一个正确选项——筛选大于培养'
    - '**边界条件**'
    - '- 并非所有项目都适合复制放大，需评估其可复制性和规模潜力'
    - '- 追求完美和验证先行之间存在张力，需平衡速度与质量'
    - '- 放大过程中可能遇到资源瓶颈（人力、资金、时间），需提前规划'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    - paper: docs/202301-02/20230207_03.md
      role: improve
    excerpts:
    - 不要追求完美，用最快速度跑通盈利模型——先用最简单方式验证商业模式（完成第一单）；把月入3000的号复制30多遍不难，把盈利的事情重复做；哪怕只赚一元钱，只要能无限放大就是年赚百万的项目。
    - 比如最重要的是先卖产品的想法，而不是做产品。如果聊了100个人，只有几个人买，肯定有问题；如果20-30个人购买，交了预售金，那这个不确定因素就解决了。这样我们就能够在短时间内测试几十个产品，最后得出一个正确选项，因为筛选大于培养。
    - 要让自己养成精益思维，用最小成本验证那些最不确定的因素，先有一个假设，然后设计一个MVP测试；先行动就对了，行动才是解决一切焦虑的最好办法。
  - 'no': 2
    name: 剥离式拆解 —— 把“大方向”拆成“可执行的100个小问题”
    points:
    - '**为什么需要这个概念？**'
    - '- 面对宏大的客户需求或业务方向，团队往往不知从何下手'
    - '- 泛泛而谈“解决用户痛点”无法形成具体可执行的任务'
    - '- 需要将模糊的方向性目标，转化为可分配、可追踪的具体行动项'
    - '**核心定义**'
    - '- 从客户群体最需要解决的10个大问题出发，将每个大问题继续拆解为10个小问题，最终得到100个具体问题'
    - '- 团队最该投入时间和精力的地方，就是这100个可执行的小问题'
    - '**关键性质**'
    - '- 可操作性：拆解后的每个小问题都对应具体的解决动作'
    - '- 聚焦性：帮助团队明确精力投入方向，避免资源分散'
    - '- 系统性：从全局问题出发，层层拆解，保证覆盖面完整'
    - '**典型例子**'
    - '- 提炼出客户最关心的“流量获取”大问题，进一步拆解为“如何做内容”“如何选渠道”“如何优化投放”等小问题'
    - '- 将“提升转化率”拆解为“优化话术”“改善页面”“增强信任”等具体任务'
    - '**边界条件**'
    - '- 拆解需要基于对客户需求的深入理解，否则问题清单可能与实际情况脱节'
    - '- 100个问题并非全部同等重要，需要进一步排序和取舍'
    - '- 拆解后需要配套明确的责任人与时间节点，否则无法落地'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    - paper: docs/202301-02/20230207_03.md
      role: improve
    excerpts:
    - 提炼客户群体最需要解决的10个大问题，每个拆解为10个小问题得到100个问题——你和团队最该花时间的地方就是这100个小问题。
    - 同行就是最好的老师，抄同行永远是做项目最快的途径，能避开多数弯路和无用功；找项目与抄同行方法：通过关键词在各个推广渠道搜索这个项目的关键词就一定可以找到同行。
    - 做事情要有目标，没有目标的话你自己是懵的；里程碑就是你在做这个项目的过程中，有一些对你来说有关键性的目标。
  - 'no': 3
    name: 买卖生意商业三分论与财富阶梯 —— 从“卖劳动力”到“卖模式”的跃迁
    points:
    - '**为什么需要这个概念？**'
    - '- 很多人混淆“自己做所有事”和“建立可复制的模式”之间的本质区别'
    - '- 靠出卖个人时间与劳动力，收入天花板极低且难以突破'
    - '- 需要清晰区分不同层级的赚钱方式，以规划从个人到企业的跃迁路径'
    - '**核心定义**'
    - '- 买卖：自己做所有事，是出卖劳动力赚钱（如个体户、自由职业者）'
    - '- 生意：通过代理商、团队或多次卖出，是依靠渠道和复制赚钱'
    - '- 商业：建立可复制放大的模式，是依靠系统赚钱——商业的本质是卖卖卖，创造客户所需的价值就可以不断去卖'
    - '- 财富积累四阶段：出卖劳动力→一份时间多次卖→购买他人时间→钱生钱，依次递进不可跳跃'
    - '- 人生四阶段：初入职场（30岁前扩广度）→中年危机（30岁后做管理）→第二曲线（副业/改命机会）→复制商业放大（钱生钱）'
    - '**关键性质**'
    - '- 层级递进：从买卖到生意再到商业，是赚钱方式的逐级跃迁'
    - '- 复利效应：商业模式的边际成本递减，可无限复制和放大'
    - '- 系统依赖：商业阶段依赖的是系统而非个人，抗风险能力更强'
    - '- 阶段不可跳跃：每一阶段的跃迁都需要前一个阶段的能力与资源积累'
    - '**典型例子**'
    - '- 自己做所有事是买卖；通过代理商赚差价是生意；建立标准化连锁体系是商业'
    - '- 段永平通过众多代理商赚取数百亿，是代理商模式的极致体现'
    - '- 写书/卖课=一份时间多次卖；当老板雇人=购买他人时间；投资理财=钱生钱'
    - '**边界条件**'
    - '- 并非所有领域都能实现从买卖到商业的跃迁，需评估项目的标准化潜力'
    - '- 商业模式的建立需要更高的管理、组织与系统能力'
    - '- 从买卖到商业的跃迁过程伴随风险，需循序渐进'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    excerpts:
    - 自己做所有事是出卖劳动力（买卖），通过代理商/多次卖出是生意，建立可复制放大的模式才是商业——商业的本质是卖卖卖，创造客户所需的价值就可以不断去卖。
    - 财富积累分为四个阶段，第一：出卖劳动力；第二：一份时间多次卖；第三：购买他人时间；第四：钱生钱。第一阶段，出卖劳动力…第二阶段是一份时间多次卖…第三个阶段是什么？购买他人时间…第四个阶段，就是去钱生钱了…你就是投资。
    - 人生四个阶段，第一阶段：初入职场（30岁以前）…在这个阶段你要不断的长见识，要不断的去尝试不同的行业、不同的岗位、不同的职业…第二阶段，中年危机，在这个阶段一定要去做管理…第三个阶段的话，其实我就是你要开始在你的主业以外，你要去寻找自己的第二曲线…第四个阶段其实就是你在第二曲线找到了一个MVP…然后组建团队给它放大。
  - 'no': 4
    name: OKR执行与复盘体系 —— 让“战略”变成“每天的动作”
    points:
    - '**为什么需要这个概念？**'
    - '- 很多团队有宏大的战略目标，却缺乏清晰的执行路径与量化标准'
    - '- 目标（O）与关键结果（KR）脱节，导致团队精力分散、效率低下'
    - '- 需要通过一套结构化的方法来对齐战略、明确目标、驱动执行'
    - '**核心定义**'
    - '- 战略坚定是最底层的成功要素；KR必须直接推动O，O要有可衡量标准'
    - '- 用MVP验证最不确定因素；与关键角色高频同步；增加问题暴露场景和勇气'
    - '- 配套复盘体系：合格总结三要素（与目标比对、要事实不要观点、能发现问题）+ 5WHY分析法深挖根因'
    - '- 严格区分事实与观点：事实是中性的、能用数字和证据支撑的；观点因人而异、基于立场层次差异'
    - '**关键性质**'
    - '- 对齐性：KR与O强关联，确保团队聚焦于战略目标'
    - '- 可量化：O具备可衡量标准，KR是支撑O达成的具体结果'
    - '- 过程管理：通过量化目标和时间节点，使过程可追踪、可改进'
    - '- 问题导向：总结的目的就是发现问题，完不成有问题、完成也有问题（为何不能超额）、超额也有问题（目标是否设太低）'
    - '**典型例子**'
    - '- 将“提升私域转化率”设定为O，KR可拆解为“优化话术SOP”“每周复盘转化数据”等'
    - '- 用MVP小成本验证“新产品是否值得开发”这一最不确定因素'
    - '- 用5WHY从“为什么老板骂我”层层追问到“为什么闹钟没电”找到根因'
    - '**边界条件**'
    - '- OKR并非万能，不适用于所有团队和场景，需结合实际情况调整'
    - '- 制定KR需要充分理解业务逻辑，否则可能方向错误'
    - '- 过程管理需要配套数据体系和复盘机制，否则难以落地'
    - '...'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    - paper: docs/202301-02/20230207_04.md
      role: improve
    excerpts:
    - 战略坚定是最底层的成功要素；KR必须直接推动O、O要有可衡量标准；用MVP验证最不确定因素；与关键角色高频同步；增加问题暴露场景和勇气——过程管理有了量化的目标和明确的时间节点，团队效率至少提升50%。
    - 一次合格的总结必须带有下方三个因素：1、总结与目标的比对。2、要事实，不要观点。3、能够帮助发现问题。
    - 总结的目的是什么？我认为就是简单四个字：发现问题。完不成目标有问题，为什么完不成？完成了目标有问题，为什么没办法超额完成？超额完成了目标也有问题，那是不是我们的目标设置得太低？为什么？
    - 5WHY分析法——连续用5个WHY来探寻其发生的真实原因：1WHY：为什么老板骂我？因为我今天迟到了。2WHY：为什么我会迟到？因为我起床晚了。3WHY：为什么会起床晚？因为天杀的闹钟没响。4WHY：为什么闹钟没响？因为它没有电了。5WHY：为什么闹钟没电？因为我忘记了换电池。
    - 我们一定要知道自己和对方说出口的每一句话，到底哪一句是观点，哪一句是事实。我今年业绩做的不好，这句话是观点还是事实？----观点！只有中性的，能够用数字和证据支撑的才是事实，例如：我今年完成了83%的年度业绩目标。
  - 'no': 5
    name: 人力资源杠杆 —— 用“雇人”撬动“个人天花板”
    points:
    - '**为什么需要这个概念？**'
    - '- 个人副业或小生意做到一定阶段后，收入增长会遇到瓶颈'
    - '- 重复性基础工作占据大量时间，导致无法专注于高价值决策'
    - '- 需要通过雇佣他人来解放自己的时间，建立真正的赚钱杠杆'
    - '**核心定义**'
    - '- 拿出副业收入的一部分，将重复性基础工作交给其他人（如家人、朋友、兼职）处理'
    - '- 当家做主：将自己从执行者转变为管理者，从靠双手赚钱转变为靠他人时间赚钱'
    - '- 配以社群分销思维：收入增长=供应链强度×顶层设计×动员能力，让团队（分销员）替你卖货'
    - '**关键性质**'
    - '- 杠杆效应：花钱买他人的时间，释放自己的精力去处理更高价值的事务'
    - '- 可扩展性：当你习惯花钱找人干活，你就开始成为一个老板，赚钱的杠杆就有了'
    - '- 角色转变：核心是完成从“自己干”到“让别人干”的心态与角色转变'
    - '**典型例子**'
    - '- 副业收入增长疲惫时，拿出一部分收入招聘剪辑、客服处理基础工作'
    - '- 将内容生产的重复工作外包给兼职，自己专注于选题与商务对接'
    - '- 社群分销平台“书里有品”0预算冷启动，2年做到80万+分销员、1.5亿销售额——动员能力的极致体现'
