    - '- 传统金融从业者扫描各赛道后，选择Web3而非C端消费作为转型方向，与其金融资源禀赋匹配'
    - '**边界条件**'
    - '- 选择比努力更重要不等于努力不重要，而是强调先选对再用力'
    - '- 容错率的设定需要根据个人风险承受能力确定，没有统一标准'
    sources:
    - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
