    name: 不下牌桌的能力 —— 团队持续盈利的“定海神针”
    points:
    - '**为什么需要这个概念？**'
    - '- 很多短视频团队依赖一两个核心IP或运营，人一走业务就停'
    - '- 内容能力再强，如果团队不能持续稳定运营，就无法形成长期盈利'
    - '- 需要明确什么是团队真正最重要的能力，避免把资源全部押在内容上'
    - '**核心定义**'
    - '- 不下牌桌的能力：指团队不因一个IP或运营退出而业务停滞，人不断层、业务持续运转的运营能力。这是盈利短视频团队最重要的能力'
    - '**关键性质**'
    - '- 它比内容能力更根本——内容可以迭代，但业务停摆则一切归零'
    - '- 需要通过标准化流程、多备份机制来保障'
    - '- 与“流程决定规模复制”的概念紧密相关：没有流程就无法保证不依赖某个个人'
    - '**典型例子**'
    - '- 团队有3个运营，任何一人离职，其他运营都能接手其账号和流程，业务不中断'
    - '**边界条件**'
    - '- 在单打独斗的个体创作者阶段，不依赖团队也可以不下牌桌，因为自己就是全部'
    - '- 该概念主要适用于团队化运营阶段，越大的团队越需要此能力'
    sources:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
      role: origin
    excerpts:
    - 我认为一个真正能盈利的短视频团队，最重要的不是什么内容能力，而是不下牌桌的能力。
    - 人不断层，不会因为一个IP，一个运营退出不干，而让业务停下来了。
