    name: 战略复盘与合规底线 —— 用“事实”和“规则”为放大护航
    points:
    - '**为什么需要这个概念？**'
    - '- 放大过程中需要高质量的战略复盘，否则容易在错误方向上加速'
    - '- 策略师需要一套综合能力来支撑高质量的战略制定与复盘'
    - '- 在放大规模的同时必须守住平台合规底线，否则一夜清零'
    - '**核心定义**'
    - '- 卓越策略师五大能力：扎实的调研能力、清晰逻辑的归纳总结能力、把控全局的项目管理能力、让人难以怀疑的决断力、面向内外部的双重叙事能力'
    - '- 商业模式画布道术器用四层分析法：道为商业模式本质，术为解决方案9个关键维度，器为载体工具平台，用为执行力与业务流迭代'
    - '- 平台合规审核：在线内容平台会对上传内容进行违规判定，需提供离线版分发等替代方案'
    - '**关键性质**'
    - '- 调研压倒性投入：对调研的压倒性投入就是对客户的负责，每一次调研背后可能是十几个竞品分析、十几万字访谈'
    - '- 搜尽奇峰打草稿：策略制定应基于广泛调研后进行大量深入思考，而非依赖办公室头脑风暴'
    - '- 合规是底线：平台规则收紧时，依赖算法漏洞的野路子会被连根拔起'
    - '**典型例子**'
    - '- 用道术器用四层分析法拆解项目：道=用XX产品/服务解决XX客户痛点赚XX钱；术=9个关键维度；器=工具平台；用=执行力与业务流迭代'
    - '- 周报因被平台判定违规无法上传，通过离线版PDF分发+征集敏感内容反馈+修订后重新上传来应对'
    - '**边界条件**'
    - '- 策略师的五大能力是长期修炼的结果，难以速成'
    - '- 商业模式画布适合项目拆解但不适合技能类内容'
    - '- 合规底线在不同平台宽严不同，需持续跟踪平台规则变化'
    - '...'
