    name: 案例对比与框架实操 —— 用六维模型给项目“称重”
    points:
    - '**为什么需要这个概念？**'
    - '- 概念和框架只有落到具体项目上才能体现出价值，“纸上谈兵”无法建立直观认知'
    - '- 通过“小说推文 vs 教育资料 vs 减肥食谱”等真实案例的对比，可以直观感受六维模型如何区分项目的量级与天花板'
    - '- 案例对比揭示了“客单价提升如何改变项目量级”这一关键规律，为选项目提供了直接参照'
    - '- 通过实操演示，让读者学会将自己的项目或想法代入模型，“称一称”重量'
    - '**核心定义**'
    - '- 案例对比：应用六维评估模型，对多个真实副业项目（小说推文、教育资料1.0/2.0、减肥食谱、项目拆解IP、知识付费）进行逐项标注与横向比较，用以验证模型的可操作性并提炼项目规律'
    - '- “客单价跃升”现象：如教育资料项目通过从“卖资料”升级到“卖高客单价合作/转化”，客单价从几十块跃升到数千至数十万，项目月收益从1000~2W升至2W~100W'
    - '**关键性质**'
    - '- 直观性：通过逐项标注（流量效率高/低、客单价高/低等）将抽象框架落到具体项目'
    - '- 可比较性：横向对比多个项目后，可清晰看出不同项目的收入天花板与结构性差异'
    - '- 规律揭示：案例对比揭示“客单价是拉开收入量级的关键变量之一”及“低效率维度可被高财务维度补偿”等规律'
    - '- 实操导向：模型可直接用于评估自己当前或未来的项目'
    - '**典型例子**'
    - '- 小说推文（月收益1000~2W）：流量效率高、销转效率高、交付效率高（无需交付）、客单价低（十几二十块）、毛利率高（50%以上）、复购率低——三效率均高故可复制，但低客单价限制收入天花板'
    - '- 教育资料1.0（月收益1000~2W）：客单价低、毛利率高（50~100%）、复购率低——典型的低客单价项目'
    - '- 教育资料2.0（月收益2W~100W）：1.0基础上升级高客单价合作转化（数千至十几二十万），毛利率降至10%——客单价提升近千倍但毛利率大幅下滑'
    - '- 减肥食谱（月收益10W~200W）：小红书/抖音矩阵发食谱自带流量，网销按SOP即可，交付效率因产品/训练营不同而低~高，复购率高（减肥是重复过程）——高收入依赖流量规模'
    - '- 项目拆解IP（月收益10W~200W）：流量效率低（难批量产出）、销转效率高（按SOP发）、交付效率低（需专业交付）、客单价高（几千到六位数）、毛利率高（70%以上）——以高客单价+高毛利率补偿低流量和低交付效率'
    - '- 知识付费（李一舟，月收益10W~500W）：流量效率高（口播）、销转效率高（直播间挂小黄车）、交付效率高（课卖掉即交付完）、客单价高（小几千）、毛利率高（100%）、复购率低——五维满足，收入天花板远高于小说推文'
    - '**边界条件**'
    - '- 案例数据主要来自作者的经验与估算（如“月收益1000~2W”），并非精确财务数据，横向比较时应关注结构差异而非绝对数值'
    - '- 案例反映的是特定时期、特定背景下的项目状态（如教育资料1.0与2.0的跃升在于模式升级而非单纯市场变化）'
    - '- 六维标注的“高/低”是相对定性判断，不同项目间的可比性需结合具体指标（如单价数值、毛利率百分比）验证'
    - '- 高客单价并不必然等于高收入，需同时考虑销量/流量规模是否支撑（如教育资料2.0毛利率仅10%需要更大的流水）'
    sources:
    - paper: docs/202301-02/NxhWdJj3UoPKvmxaBqkcz8wlntf.md
