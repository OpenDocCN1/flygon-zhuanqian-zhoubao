    points:
    - '**为什么需要这个概念？**'
    - '- 内容营销团队最大的浪费是经验的浪费——摸索出的好方法没有沉淀下来'
    - '- 没有流程时，业务能力全部存在于个别员工的脑子里，无法放大'
    - '- 要实现从1到N的规模化复制，必须把经验标准化'
    - '**核心定义**'
    - '- 流程决定规模复制：内容营销团队必须依靠标准化流程把探索出的内容方法积累沉淀下来，才能实现业务放大，否则经验一旦散失，业务就无法扩张'
    - '**关键性质**'
    - '- 流程是实现规模复制的核心前提，是“用流程能规模复制”信念的体现'
    - '- 内容营销团队的最大浪费不是人才、时间，而是经验浪费'
    - '- 流程要覆盖定位、选题、文案、拍剪、复盘全链路'
    - '**典型例子**'
    - '- 将“留存坏点”复盘法固化为每一条视频的必做流程，确保团队的每一个成员都能使用，而不是只有创始人会'
    - '**边界条件**'
    - '- 流程管理不能僵化，需要保留创新空间'
    - '- 在业务探索初期（0到1阶段），过度流程化可能拖慢速度，流程应随验证后逐步固化'
    sources:
    - paper: docs/202301-02/MXPcd58gSoEsTlxFhUVcJ5X7npc.md
      role: origin
    excerpts:
    - 内容营销团队，最大的浪费根本不是人才、时间，而是经验的浪费。
    - 没有好的流程，内容营销团队积累、探索的内容方法没办法积累下来，这个业务就根本没办法放大。
    - 我相信用流程能规模复制。
  - 'no': 8
    name: 行业冠军联营 —— 借力最强的“流量放大器”
    points:
    - '**为什么需要这个概念？**'
    - '- 中小企业自己做抖音缺乏预算、背书和完整变现体系，单打独斗很难做大'
    - '- 与其从零培养客户，不如直接找到行业里最强的机构合作，借力打力'
    - '- 需要一种结构化的方法去筛选、接触并达成高价值合作'
    - '**核心定义**'
    - '- 行业冠军联营：筛选当地某行业最大的头部机构（行业冠军），通过cold call和见面洽谈谈成联营合作（每月服务费+项目分成），借助其预算、背书和完善的变现体系放大抖音流量'
    - '**关键性质**'
    - '- 行业冠军具备三大优势：有预算、有背书、变现体系完整，是更适合抖音放大的好企业'
