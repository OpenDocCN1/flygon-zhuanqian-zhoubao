    name: 正反馈驱动热爱 —— “懒惰”其实是没尝到甜头
    points:
    - '**为什么需要这个概念？**'
    - '- 很多人把“懒”归结为性格缺陷，不断自我否定，却忽略了懒惰背后的反馈机制'
    - '- 这种“道德化”的解释让人陷入自责却无法改变，因为找错了根源'
    - '- 需要理解“正反馈”驱动的行为逻辑：人不是天生懒，而是做了没回报所以不想做'
    - '- 理解了这一点，才能通过“制造正反馈”来启动自己的行动力'
    - '**核心定义**'
    - '- 懒惰的本质是未获得正反馈；未获正反馈源于做得不够多，而做得不够多的核心原因是不够喜欢'
    - '- 如果你每天做的事都有大量的钱进账，比如一天一万利润揣兜里，你说你会懒？你比谁都积极'
    - '**关键性质**'
    - '- 激励驱动性：正反馈（金钱、认可、成就感）是持续行动的根本燃料'
    - '- 良性循环性：行动→反馈→更多行动，一旦飞轮转动，坚持就不再依赖意志力'
    - '- 自我诊断性：如果长期对某件事提不起劲，不是“懒”，而是这件事没有给你正反馈'
    - '**典型例子**'
    - '- 日更写作565天：作者通过不断获得阅读反馈和粉丝增长，驱动完成三个变现闭环'
    - '- 小说推文项目：第一个月单量从26单/周增至120单/周，正反馈驱动下越做越有动力'
    - '- 减肥、副业等被反复验证为“刚需”的方向，因为改善成果带来强烈正反馈，人们乐于坚持'
    - '**边界条件**'
    - '- 正反馈是需要“时间差”的：早期往往没有反馈，需要通过目标拆解人为制造小反馈'
    - '- 纯粹为钱冲也是一种正反馈路径，但可能带来内耗，需要找到不别扭的方式'
    - '- 依赖外部正反馈（如点赞）可能导致情绪波动，需要建立内在的评价标准'
    sources:
    - paper: docs/202301-02/20230207_07.md
      role: origin
    excerpts:
    - 为什么会有懒惰这个东西？本质上，就是没拿到正反馈，如果你每天做的事都有大量的钱进账，比如一天一万利润揣兜里，你说你会懒？你比谁都积极。
    - 但是最核心的是，你不够喜欢。
    - 你不够想，不够想赚钱，不够缺钱。这里有两个突破口，一个是尽快找到自己到底热爱，另一个，找不到也没关系，就是为了钱冲，不别扭，不内耗。
