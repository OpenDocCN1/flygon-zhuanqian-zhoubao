    - '**核心定义**'
    - '- 问题是期望与现状的差距，无论期望大于现状还是现状大于期望，差距即为问题'
    - '- 5WHY分析法：每当遇到问题时，连续用5个“为什么”来探寻其发生的真实原因，从表象层层深入到根因'
    - '- 事实与观点的区分：事实是中性的、能用数字和证据支撑的；观点则因人而异、基于立场和层次差异'
    - '**关键性质**'
    - '- 根因导向：5个为什么的层层追问，避免头痛医头'
    - '- 证据驱动：强调用事实（数据、证据）而非观点来做判断'
    - '- 普适性强：适用于商业复盘、项目诊断、个人成长等各类问题求解场景'
    - '**典型例子**'
    - '- 5WHY经典案例：为什么老板骂我 → 因为迟到 → 因为起床晚 → 因为闹钟没响 → 因为没电 → 因为忘记换电池，找到根因即可针对性解决'
    - '- 合格总结的核心是发现问题：完不成目标有问题，完成了目标也有问题（为何不能超额），超额完成也有问题（目标是否设太低）'
    - '**边界条件**'
    - '- 5WHY并非万能，当问题存在多个并行根因时需结合其它分析工具（如鱼骨图）'
    - '- “事实”与“观点”的边界有时模糊，需要建立可验证的数据采集机制来支撑判断'
    sources:
    - paper: docs/202301-02/20230207_04.md
      role: origin
    excerpts:
    - 问题是期望与现状的差距。不管是期望大于现状，还是现状大于期望。
    - 第一个方法，叫5WHY分析法，意思是每当遇到问题时，都可以连续用5个WHY来探寻其发生的真实原因。
    - 1WHY：为什么老板骂我？因为我今天迟到了。2WHY：为什么我会迟到？因为我起床晚了。3WHY：为什么会起床晚？因为天杀的闹钟没响。4WHY：为什么闹钟没响？因为它没有电了。5WHY：为什么闹钟没电？因为我忘记了换电池。
    - 我们一定要知道自己和对方说出口的每一句话，到底哪一句是观点，哪一句是事实。我今年业绩做的不好，这句话是观点还是事实？----观点！只有中性的，能够用数字和证据支撑的才是事实，例如：我今年完成了83%的年度业绩目标。
    - 总结的目的是什么？我认为就是简单四个字：发现问题。完不成目标有问题，为什么完不成？完成了目标有问题，为什么没办法超额完成？超额完成了目标也有问题，那是不是我们的目标设置得太低？为什么？
