    name: Web3跨界 —— 寻找IP的第二增长曲线
    points:
    - '**为什么需要这个概念？**'
    - '- 当传统IP赛道竞争加剧，寻找新的蓝海市场和增长点成为必然，而Web3作为新兴生态提供了想象空间'
    - '- IP的“文化资产”与Web3的“数字资产”有天然的契合点，如NFT、数字藏品等'
    - '- 类比“出海远航”：国内市场（红海）竞争激烈，需要造一艘新船（Web3技能）去探索新大陆（新市场）'
    - '**核心定义**'
    - '- Web3：一种基于区块链技术的互联网生态，并且还能实现与现实世界交互的虚拟世界，强调“以虚促实”的经济趋势'
    - '- 转型方法论：通过扫描市场风向标→以初学者身份躬身入局→验证可行性→结识VC的闭环，实现从传统行业到Web3的转型'
    - '**关键性质**'
    - '- 以虚促实：虚拟经济与实体经济结合是长期大趋势，各大厂推出NFT与线下结合，符合国内经济趋势'
    - '- 躬身入局：只有自己参与项目，才能快速摸透行业的可行性，旁观永远无法获得真知'
    - '- 容错率控制：从金融视角要给自身一定容错率，避免早期All in单一方向，选择比努力更重要'
    - '**典型例子**'
    - '- 作者从传统金融分析师，通过分析市场热度词、用金融资源找到初创团队以初学者身份参与、参加分享会结识VC，成功转型Web3'
    - '- Web3市场在10年内创造了3萬亿美元的流动价值，足以与传统创投基金投资的初创公司总价值相媲美，且Polychain、Paradigm、a16z等专精公司各自管理数十亿至数百亿美元资金'
    - '**边界条件**'
    - '- 敬畏市场：真正活下来的老鸟都懂“敬畏它，并且与它共舞”，年轻团队领袖应保护团队免受市场崩塌的连锁反应影响'
    - '- 保护弹药：不要浪费弹药，在熊市选择有大量资金弹药的“基建公司”工作是更优选择'
    sources:
    - paper: docs/202301-02/T1Jad4VhIoPc2hxKJxwcUFPOnTc.md
      role: origin
    excerpts:
    - 什么是Web3? 是一种基于区块链技术的互联网生态，并且还能实现与现实世界交互的虚拟世界。
    - 各大厂也都开始推出自己平台的NFT和线下结合，而这也符合国内所说的以虚促实的经济趋势。
    - 跟两个公司的合伙人说了下我的想法，自己另外去开辟Web3的赛道。然后我用金融圈的资源找到了一些国内Web3的初创团队，以一个初学者的身份参与进去。因为只有自己参与项目，才能快速的摸透行业的可行性。
