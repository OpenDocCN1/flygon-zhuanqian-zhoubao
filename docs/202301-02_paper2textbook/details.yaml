    - '- 美国对苏“强加成本”战略：所有行动都遵守“让苏联增加成本”这一指导原则，从毒刺导弹到压油价，目的明确而手段灵活'
    - '- 老乡鸡与南城香比拼标准化、品牌力是误区，小餐馆应发挥人情味、现炒等自身禀赋优势'
