    - 1.做生意从自己身边资源入手，从挣1块钱开始，选一个天花板比较高的，持续3——5年。
    - 2.跑通自己的生意环节，最小mvp（产品——流量—销售—交付）
    - 5.3 测试。快速测试，快速看到结果，产品方法论MVP真是让各行各业都能大放异彩啊。
  - 'no': 2
    name: 产品好省一半心 —— 选品决定论
    points:
    - '**为什么需要这个概念？**'
    - '- 很多创业失败并非销售能力不足，而是从一开始就选错了产品'
    - '- 差产品需要花大量精力推销，好产品自带转化力'
    - '- 后端复购率取决于产品本身能否持续满足用户需求'
    - '**核心定义**'
    - '- 选品重于销售：选择好的产品比销售技巧更重要，好产品自然带来转化和复购'
    - '- 选品三要素：深挖用户需求且涵盖面齐全、口服保养是趋势（客户粘性强）、尽量与医院合作强化品牌背书'
    - '**关键性质**'
    - '- 自带转化力：好产品能省掉一半销售精力'
    - '- 高复购率：客户粘性强，接受后不轻易更换'
    - '- 品牌背书强：有专业机构背书，客户信任度更高'
    - '**典型例子**'
    - '- 线上美业：选品时优先选择能涵盖祛痘、美白、抗衰等多种需求的产品线，而非单一的某个爆品'
    - '- 口服保养品：客户一旦接受某个品牌的口服产品，不会轻易换牌子，复购率高'
    - '**边界条件**'
    - '- 选品考察的是后端供应链和产品力，而非单一价格优势'
    - '- 需结合自身资源验证：没有利润空间的产品（如合伙人级别才能拿到低折扣）不如不做'
    sources:
    - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
