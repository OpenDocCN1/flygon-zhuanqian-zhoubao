    name: 标准化复制 —— 把“跑通的店”克隆30遍
    points:
    - '**为什么需要这个概念？**'
    - '- 单点盈利只是开始，真正的商业价值在于规模化复制'
    - '- 没有标准化流程就无法复制，只能永远做小店'
    - '- 从1到N的关键是把“人-货-场”变成可复制的SOP'
    - '**核心定义**'
    - '- 标准化复制是将已验证跑通的单店/单项目模型，通过制定标准作业流程（SOP）、模板化工具和赋能体系，批量复制到更多门店或合伙人的过程'
    - '**关键性质**'
    - '- SOP化：流程模板化、标准化，减少对人能力的依赖'
    - '- 赋能输出：将技术、话术、剪辑等打包为现成内容赋能合伙人'
    - '- 单店盈利前置：只有单店模型健康才可复制扩张'
    - '**典型例子**'
    - '- 夕子将脚本（改人设即发）、拍摄剪辑SOP、看脸课程、聊天SOP打包赋能加盟商；胖龟用小程序锁码+配房流程+带看SOP让城市合伙人快速上手；TikTok睡播通过程序自动控制设备实现一人多号'
    - '**边界条件**'
    - '- 过度标准化可能失去灵活性，需保留一定个性化空间；复制扩张前必须跑通单店盈利，否则放大的是亏损'
    sources:
