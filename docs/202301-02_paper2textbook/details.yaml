  life_analogy:
  - 想象创业像**看病就医**：
  - '- **痛点** = 你身体真实的疼痛部位（荨麻疹、失眠、被中介费坑）'
  - '- **信息差** = 你只知道挂号排队，但名医知道哪个窗口最快'
  - '- **选品** = 医生开的药——好药对症自然见效，烂药再好的诊所也白搭'
  - '- **MVP闭环** = 先开一剂小药方试三天，有效再开大疗程，而不是直接住院手术'
  - 就像医生必须先问“哪里疼”再开药，创业也必须先找准用户最痛的那一点，才能对症下药。
  - ''
  - 想象商业模式的付费设计像**钓鱼**：
  - '- **付费方** = 鱼塘里最饿的那条鱼（二房东空置一天亏一天房租）'
  - '- **全域获客** = 在多个鱼塘同时撒网（抖音、小红书、58），而不是守着一个池塘等鱼上钩'
  - '- **私域运营** = 钓上来好鱼养在自家鱼缸里，喂精饲料，而不是炖了吃一顿就没了'
  - '- **标准化复制** = 把养鱼秘诀写成手册，教多个渔场同时养，而不是自己一个人守着唯一鱼塘'
  summary:
  - concept: 痛点
    desc: 创业的第一性原理：用户真实愿意花钱解决的强烈困扰，是商业逻辑成立的原始起点
  - concept: 信息差
    desc: 一方掌握而另一方不掌握的关键信息，凭借这种不对等可合法获取利益，但窗口期有限
  - concept: 选品决定论
    desc: 产品好省一半心：需求覆盖、产品粘性、品牌背书构成好产品的三个维度
  - concept: 最小MVP闭环
    desc: 用最低成本跑通产品-流量-销售-交付全链路，验证模型成立后再复制放大
  - concept: 付费方即盈利支点
    desc: 找到“谁痛谁掏钱”的付费主体（如二房东），商业模式自然成立
  - concept: 全域获客
    desc: 同时布局多个公域平台，按平台特性定制内容与钩子，主动出击发掘目标客户
  - concept: 私域金饭碗
    desc: 专业用户是高价值资产，应匹配高客单技术型服务，而非低价值团购消耗信任
  - concept: 标准化复制
    desc: 将跑通的单店模型SOP化并赋能合伙人，是规模化扩张的前提，单店盈利前置是必要条件
  - concept: 避坑止损
    desc: 通过前人经验识别外包选型、招聘固化、投放无效等典型陷阱，设好成本上限及时退出
  exercises:
  - 'no': 1
    title: 痛点识别工作坊：给三个案例各找一个创业切口
    contents:
    - 结合本章三个素材案例，完成以下分析：
    - 1. 从你自身或身边人的经历中，找出3个高频、广泛、可持续的真实痛点，并用一句话描述目标人群
    - 2. 对每个痛点，评估其付费意愿强度（1-10分）与可外延性（能否推及同类人群）
    - 3. 选其中一个痛点，模仿夕子（荨麻疹→线上美业）的逻辑，设计一个最小MVP闭环：
    - '   - 最小可行产品是什么？'
    - '   - 初始流量从哪来？'
    - '   - 怎么定价和完成第一单销售？'
    - '   - 交付物是什么？'
    - 回答问题：
    - '- 如何判断一个痛点是真痛点还是伪痛点？'
    - '- 为什么“高频、广泛、可持续”三个特征缺一不可？'
  - 'no': 2
    title: 信息差地图：找出你所在行业的三层信息差
    contents:
    - 信息差是商业机会的源泉。请针对你所在或熟悉的行业，绘制一张“信息差地图”：
    - 1. 列出行业的5个主要参与者（如：生产者、渠道商、消费者、监管方、服务方）
    - 2. 在每对参与者之间，标出信息不对称的具体内容（如：生产者知道成本底价，消费者不知道）
    - 3. 判断每类信息差是否合法、可定价、可抹平（窗口期多长？）
    - 4. 模仿胖龟找房“取消中介费”的逻辑，设计一个消除某类信息差的商业模式：
    - '   - 谁最痛？谁愿意付费？'
    - '   - 如果由最痛的一方付费，商业模式如何闭环？'
    - 回答问题：
    - '- 信息差被抹平之后，你的壁垒在哪里？'
    - '- 如何在窗口期内完成收割或建立新壁垒？'
  - 'no': 3
    title: 六维模型实战：给三个项目算一笔“复制账”
    contents:
    - 用本章学习的六维评估模型（流量效率、销转效率、交付效率、客单价、毛利率、复购率），评估以下3个项目的可复制性与收入天花板：
    - 项目A：夕子的线上美业（皮肤诊断+医美产品+加盟）
    - 项目B：胖龟找房1.0（0中介费个人房屋分享平台）
    - 项目C：TikTok睡播（娱乐直播打赏）
    - 对每个项目：
    - 1. 逐项打分（1-10分）并说明理由
    - 2. 判断该项目属于“效率维度”驱动还是“财务维度”驱动
    - 3. 模拟计算：如果复制到10个城市/10个账号，收入是否线性增长？瓶颈在哪？
    - 回答问题：
    - '- 为什么小说推文天花板低而教育资料能到百万？'
    - '- 客单价提升如何改变项目量级？'
  - 'no': 4
    title: 付费方设计练习：重构一个“用户不掏钱”的生意
    contents:
    - 假设你经营一个面向C端消费者的本地生活平台，但用户拒绝为服务付费。
    - 1. 列出可能的潜在付费方：广告主、商家、供应商、数据需求方、政府…
    - 2. 对每个候选付费方，分析其痛点强度：
    - '   - 他们面临什么损失？'
    - '   - 愿意为消除损失支付多少？'
    - '   - 支付是否可持续？'
    - 3. 模仿胖龟找房“二房东付费”的逻辑，设计一个新盈利模型：
    - '   - 选择最合适的付费方'
    - '   - 明确你为其创造的独特价值'
    - '   - 画出新的商业闭环'
    - 回答问题：
    - '- 如何验证付费方的痛点真实存在而非臆想？'
    - '- 如果付费方痛点随时间消解，如何调整？'
  - 'no': 5
    title: 标准化复制方案：把一门手艺做成SOP
    contents:
    - 选一个你熟练掌握但依赖个人能力的技能（如：写文案、剪视频、做咨询），设计一套可复制的SOP体系：
    - 1. 拆解该技能的5-8个关键步骤
    - 2. 为每个步骤设计标准化的模板或工具（如：脚本模板、检查清单）
    - 3. 设计一套赋能方案：
    - '   - 如何让新人“拿来即用”？（参考夕子给加盟商现成脚本）'
    - '   - 如何保证质量下限？（参考胖龟的配房-带看SOP）'
    - '   - 如何评估单店/单人盈利能力？（参考单店模型健康标准）'
    - 回答问题：
    - '- 过度标准化会失去什么？如何保留灵活性？'
    - '- 如果复制10份，哪些环节会最先崩坏？如何预防？'
  units:
  - 'no': 1
    name: 痛点即创业起点 —— 从“哪里疼”到“贴哪里”
    points:
    - '**为什么需要这个概念？**'
    - '- 创业的第一问题不是“我有什么”，而是“用户哪里疼”'
    - '- 多数人从自身优势出发，结果做出无人需要的产品'
    - '- 真实痛点自带付费意愿，是商业逻辑成立的原始起点'
    - '- 夕子的荨麻疹、胖龟的高中介费、老杨的睡不着，都是同一个起点'
    - '**核心定义**'
    - '- 痛点是用户真实存在、愿意花钱解决的强烈困扰，商业项目的切入点应锚定在最痛的那一点上'
    - '**关键性质**'
    - '- 真实性：来自本人或身边人的亲身经历，而非臆想'
    - '- 付费意愿：痛点越深，用户越愿意掏钱'
    - '- 可外延：从自身痛点可推及同类人群的共性需求'
    - '**典型例子**'
    - '- 夕子因荨麻疹、敏感肌就医，从三甲皮肤科辞职创业做线上美业；胖龟发现买房者跳单省中介费的现象创办0中介费平台；老杨捕捉到现代人失眠压力大而开发TikTok睡播'
    - '**边界条件**'
    - '- 自身痛点需同时具备高频、广泛、可持续三个特征，否则是伪痛点；痛点必须能翻译成可付费的服务或产品，否则停留在抱怨层面'
    sources:
    - paper: docs/202301-02/E1WGd70YLoaHGfxAYJTc4WoFnsd.md
