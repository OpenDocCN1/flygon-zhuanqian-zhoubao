    name: 卓越策略师五大能力 —— 从“执行者”到“操盘手”的素养跃迁
    points:
    - '**为什么需要这个概念？**'
    - '- 策略师常常陷入“坐在办公室头脑风暴”的陷阱，方案脱离一线'
    - '- 面对陌生行业和客户，缺乏系统性能力会导致策略质量低下'
    - '**核心定义**'
    - '- 合格乃至卓越的策略师应具备五项综合素养：扎实的调研能力、清晰逻辑的归纳总结能力、把控全局的项目管理能力、让人难以怀疑的决断力、面向内外部的双重叙事能力'
    - '**关键性质**'
    - '- 调研能力：对调研的压倒性投入就是对客户的负责，“策略师不是一个白领，而是一个蓝领”'
    - '- 归纳总结能力：策略不是头脑风暴，而是基于事实的归纳——“搜尽奇峰打草稿”'
    - '- 项目管理能力：每个项目都有严格的提案时间，需清晰规划与时间意识'
    - '- 决断力：让客户可以依赖的人，而不只是简单执行需求'
    - '- 双重叙事能力：同时面向客户和消费者两种视角进行叙事'
    - '**典型例子**'
    - '- 调研背后可能是十几个竞品分析、十几万字的消费者/店长/经销商访谈，以及不计其数的行业报告'
    - '**边界条件**'
    - '- 五能力缺一不可，但不同项目对各能力的权重需求不同，需按实际场景调配'
    - '- 该框架主要适用于策略咨询类高要求岗位，对一般执行岗位部分能力要求可放宽'
    sources:
    - paper: docs/202301-02/20230207_04.md
      role: origin
    excerpts:
    - 1. 扎实的调研能力 不管是什么项目，不管你是多少年经验的营销从业者，在面对陌生的行业和客户时，都要下苦工去做充分的调研。
    - 2. 清晰逻辑的归纳总结能力 不同于广告的'头脑风暴'，策略师更加将就基于事实的归纳。
    - 3. 把控全局的项目管理能力 每一个项目都有着严格的提案时间，什么时候做访谈、什么时候要根据策略推动设计，这些都需要清楚的规划和时间意识。
    - 4. 让人难以怀疑的决断力 策略师能够成为让客户可以依赖的人，而不只是简单的需求执行方。
    - 5. 面向内外部的双重叙事能力 由于策略师特殊的身份，提案和汇报时会同时兼具面向客户和消费者的两种视角。
    - 对调研的压倒性投入，就是对客户的负责。而每一次调研的背后，可能是十几个竞品分析，十几万字的消费者、店长和经销商访谈，不计其数的行业报告等等。
    - 一句名言非常贴切：'搜尽奇峰打草稿'，这个典故是画家在画山峰时广泛收集各种不同的山峰，并不断练习打草稿。懂得搜奇峰是懂得妙理，多打草图是能用苦功。
  - 'no': 21
    name: 超垂直IP与SEO思维 —— 在“极致细分”中挖一口精准流量的深井
    points:
    - '**为什么需要这个概念？**'
    - '- 大众赛道竞争激烈，普通人做个人IP难以在无限竞争中脱颖而出'
    - '- 追逐平台爆款的流量来得快去得也快，难以形成持久稳定的客户来源'
    - '- 需要一种长期主义的流量获取方式：精准、可持续、旱涝保收'
    - '**核心定义**'
    - '- 超垂直个人IP：在极度细分领域深耕、坚持长期主义的个人知识品牌'
    - '- SEO思维获取精准流量：布局长尾搜索关键词，让有明确需求的用户主动搜索到你，而非被动刷到你'
    - '**关键性质**'
    - '- SEO思维 vs 爆款思维：前者侧重长期精准搜索流量的积累，后者侧重追逐热点与平台推荐'
    - '- 一个通过SEO来的精准用户，比100个平台推荐来的泛粉更有价值'
    - '- 内容发布后3-5年依然能享受流量福利，旱涝保收'
    - '**四步操作路径**'
    - 1. 根据细分领域布局300-500个长尾关键词
    - 2. 为每个关键词写一个解决方案（写成攻略、拍成短视频）
    - 3. 多平台发布，关键词布局在标题、首段、图篇描述等位置
    - 4. 坚持更新，约1个月后每天都能收到精准咨询
    - '**典型例子**'
    - '- 作者在小红书/抖音发了不到200篇SEO内容，即使大半个月不更新，每天仍有人主动咨询'
    - '**边界条件**'
    - '- 需要有效的细分赛道判断（避免选到无人搜索的死海）'
    - '- 见效周期比爆款思维长，需要耐心与长期主义心态'
    sources:
    - paper: docs/202301-02/20230207_11.md
      role: origin
    excerpts:
    - 如果你选的是超垂直的细分领域，你如果坚持的是长期主义变现，那么还有一种流量比迎合平台推荐更有价值：那就是精准搜索的流量
    - 长期主义者，大部分都用SEO思维在做流量，而追风者往往是用爆款思维组流量，彻底理解这一点，起码受益 10 年
    - 一个用户愿意通过各种关键词找到你的信息，进而添加到你的私域里。这样来的1个人会比你平台推荐来的100个人更有价值。
    - 用SEO思维去发布的内容，那怕3年5年你依然可以享受到这个内容的福利。
    - 我在我的抖音和小红书里，就发了不到200篇内容，现在每天打开小红书和抖音，都有人主动的咨询。我们试过有大半个月一条内容都不更新，也是每天都有人过来咨询。
  - 'no': 22
    name: 产品Idea五种构思法 —— 从“想到”到“注意到”的成功率排序
    points:
    - '**为什么需要这个概念？**'
    - '- 大多数人构思产品靠“拍脑袋”或盲目跟风，成功率极低'
    - '- 不同产品构思方法的成功率差异巨大，需要一套可评估的排序框架'
    - '**核心定义**'
    - '- 按成功率从高到低排序的五种产品创意方法：'
    - 1. 原生idea：注意到并解决自己遇到的问题（创业者即用户）
    - 2. 抄成功竞品，做出差异化的价值点
    - 3. 分析搜索关键词，找到尚未被满足的需求
    - 4. 有人愿意预付费找你定制需求，然后将其产品化
    - 5. 生造的idea（不推荐）
    - '**关键性质**'
    - '- 原生idea的成功率最高，因为创意者本身就是产品的深度用户，最懂需求'
    - '- 任何创意方法都需满足三个条件：有真实需求、你是该领域专家、你能坚持下去'
    - '- “构思产品idea的动词应该是''注意到''而不是''想到''”'
    - '**典型例子**'
    - '- 硅谷创业界推崇的“原生idea”：如Dropbox创始人在通勤路上反复忘记U盘，从而“注意到”云端同步的需求'
    - '**边界条件**'
    - '- 高成功率idea需要同时满足“真实需求+专业背景+坚持能力”三条件'
    - '- 生造idea成功率最低但并非绝对不行，需要更强的市场需求验证'
    sources:
    - paper: docs/202301-02/20230207_11.md
      role: origin
    excerpts:
    - 构思产品idea的动词，应该是'注意到'，而不是'想到'。'我注意到，有这么一个问题，可以这么来解决' 而不是 '我想到了一个创业idea'。
    - 我一共总结了五种常见的方法，他们的成功概率递减。它们分别是：一、原生idea；二、抄成功竞品，然后做出差异化的价值点；三、分析搜索关键词，找到尚未被满足的需求；四、有人愿意预付费找你定制某个需求，然后你将它产品化；五、生造的idea
    - 在我看来，一个高成功率的产品idea，需要满足三个条件：1.有真实需求存在；2.你是这个领域的专家，即便是直面竞争，你也能比对手做得好；3.你能坚持下去，尤其是早期缺乏正反馈的时候
  - 'no': 23
    name: 平台电商四周期 —— 用“历史规律”预判下一个红利平台
    points:
    - '**为什么需要这个概念？**'
    - '- 普通人很难判断一个新平台是否值得投入、什么时机进入最佳'
    - '- 所有电商平台的发展演进存在相似的底层逻辑，可以以史为鉴'
    - '**核心定义**'
    - '- 基于淘系经验总结的电商平台演进规律：铺货期→动销期→精细化期→玩趋势期'
    - '**关键性质**'
    - '- 铺货期：平台刚起步，商家少、竞争小，暴力铺货即可出单（红利最大）'
    - '- 动销期：平台开始考核动销率，需精选商品与优化转化'
    - '- 精细化期：竞争加剧，需精细化运营（标题、主图、评价等）'
    - '- 玩趋势期：平台成熟，需跟随趋势与流量热点'
    - '- 所有平台演变的底层逻辑相通（视频号与抖音历史进程相似，美团与淘系将大相径庭）'
    - '**典型例子**'
    - '- 2022年8月末发现美团电商机会后，不到两个月从0跑通并扩展到30家店，单店月利润6k-12k（零运营未优化）——验证了新平台在成长初期的红利效应'
    - '**边界条件**'
    - '- 每个周期的时间长度因平台而异，需结合具体平台发展速度判断'
    - '- “四周期”是理想化模型，实际中可能叠加外部因素（如疫情、政策）'
    sources:
    - paper: docs/202301-02/20230207_11.md
      role: origin
    excerpts:
    - 从平台电商的历史出发，我把美团的发展分为了四个周期：铺货、动销、精细化、玩趋势。
    - 所有平台演变的底层逻辑是相通的，刚过去的视频号...与抖音的历史进程何其相似。美团电商与淘系的发展也将大相径庭。
    - 美团电商成长为团队的第二曲线，类目不同单店月利润6k-12k（零运营未优化），扭转了我们的淘宝店群的颓势。
    - 第一家店跑通最小MVP仅仅花费了80元...截止到10月美团电商全类目商家仅2000多家，我们应该是百货类目入驻的全国前300名。
