    name: 财富积累四阶段 —— 出卖劳动力只能“温饱”，钱生钱才能“自由”
    points:
    - '**为什么需要这个概念？**'
    - '- 很多人困在“出卖劳动力”的第一阶段，靠时间换钱，收入天花板极低'
    - '- 不理解财富进阶逻辑，甚至试图跳跃式致富，反而踩坑'
    - '- 需要一张清晰的财富积累地图来指导路径选择与努力方向'
    - '**核心定义**'
    - '- 人群按赚钱方式划分为四个递进阶段：出卖劳动力（打工）、一份时间多次卖（写书/卖课）、购买他人时间（当老板）、钱生钱（投资），且必须依次跃迁，不可跳跃'
    - '**关键性质**'
    - '- 由低到高：出卖劳动力（时间单次出卖）→ 一份时间多次卖（知识产权）→ 购买他人时间（组织杠杆）→ 钱生钱（资本杠杆）'
    - '- 每一阶段对应一个人生阶段：初入职场（扩广度）、中年危机（做管理）、第二曲线（副业）、复制商业放大'
    - '- 跃迁不可跳过：比喻为“爬楼梯”，跳过一层将缺乏对应的能力与资源基础'
    - '**典型例子**'
    - '- 打工者（阶段一）→ 写书/录课作者（阶段二）→ 开公司雇人（阶段三）→ 投资理财（阶段四）'
    - '**边界条件**'
    - '- “不可跳跃”是理想的线性路径描述，实际中部分人能通过特殊机遇（如大厂期权）部分跳跃'
    - '- 阶段之间没有绝对边界，一个人可同时处于多个阶段（如打工时做副业卖课）'
    sources:
    - paper: docs/202301-02/20230207_06.md
      role: origin
    excerpts:
    - 财富积累分为四个阶段，第一：出卖劳动力；第二：一份时间多次卖；第三：购买他人时间；第四：钱生钱。
    - 第一阶段，出卖劳动力…第二阶段是一份时间多次卖…第三个阶段是什么？购买他人时间…第四个阶段，就是去钱生钱了…你就是投资。
    - 人生四个阶段，第一阶段：初入职场（30 岁以前）…在这个阶段你要不断的长见识，要不断的去尝试不同的行业、不同的岗位、不同的职业…第二阶段，中年危机，在这个阶段一定要去做管理…第三个阶段的话，其实我就是你要开始在你的主业以外，你要去寻找自己的第二曲线…第四个阶段其实就是你在第二曲线找到了一个
      MVP…然后组建团队给它放大。
