    name: 私域单客价 —— 从“一锤子买卖”转向“一辈子生意”
    points:
    - '**为什么需要这个概念？**'
    - '- 传统电商以“客单价”衡量单次交易价值，忽视了用户长期贡献的潜力'
    - '- 获客成本高企，与其不断拉新，不如深耕已有用户的终身价值'
    - '- 私域运营需要一套以用户生命周期为核心的价值衡量指标'
    - '**核心定义**'
    - '- 在私域流量运营思维下，关注单个消费者长期贡献的总销售额（单客价）'
    - '- 通过拉长用户生命周期和增加复购来提升整体销售额，而非仅关注单次客单价'
    - '**关键性质**'
    - '- 单客价 = 单次客单价 × 复购次数 × 用户生命周期长度'
    - '- 与“复购比拉新更重要”的理念一脉相承'
    - '- 衡量的是整个私域资产的质量而非短期交易规模'
    - '**典型例子**'
    - '- 2万私域精准宝妈好友完成7000单胎毛纪念品变现，并结合副业培训、无货源、淘客等实现总计超100万变现——单客价远超单次客单价'
    - '- 视频号直播+私域模式中，私域端在无额外投放的情况下持续产出年产值，正是单客价思维的直接体现'
    - '**边界条件**'
    - '- 适用于有复购属性或可延伸需求的产品，不适用于一次性高额低频消费品'
    - '- 需要持续的用户维护投入（内容、服务、关怀）以拉长生命周期'
    - '- 单客价的提升依赖信任关系，急功近利的过度推销会反而缩短生命周期'
    sources:
    - paper: docs/202301-02/20230207_03.md
      role: origin
    excerpts:
    - 电商有个'客单价'的概念，而在私域流量运营的思维下，真正值得关注的不是'客单价'，而是'单客价'，就是一个消费者总共贡献了多少销售额。
    - 结果从抖音导流 2 万私域的，都是精准的宝妈好友，完成了 7000 单的胎毛纪念品变现。
    - 在副业赚钱上变现大概有 30 万左右。
    - 从抖音导流 2 万私域…… 总计超100万变现。
