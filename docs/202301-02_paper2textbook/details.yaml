  - ├── 时代红利
  - │   ├── 90%收入来自红利             —— P003, P011
  - │   ├── 时效性：窗口期行动           —— P003
  - │   ├── 隐蔽性：误以为是实力         —— P003
  - │   └── 可迁移性：识别方法可复制      —— P003
  - ├── 流量价值公式
  - │   ├── 规模 × 相关性 × 信任度       —— P006
  - │   ├── 规模解决连接问题             —— P006
  - │   ├── 相关性决定目标客户           —— P006
  - │   └── 信任度决定用户信不信         —— P006
  - ├── 流量变现原则
