    - '**核心定义**'
    - '- 项目生命周期理论：所有娱乐直播（及多数互联网）项目在无升级情况下生命周期约2-6个月，因此必须具备项目开发运营能力以不断升级迭代'
    - '- ''1+1+1''项目矩阵：1个在盈利、1个在开发、1个做知识付费，实现现金流、储备、溢价的良性循环'
