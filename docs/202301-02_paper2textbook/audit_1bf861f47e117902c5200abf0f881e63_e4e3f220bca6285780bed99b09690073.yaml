unsupported_claims:
- location: ch10.10
  claim: 作者运营2个号，每天发布2-4条视频，从选文改文到剪辑发布投入的时间不超过1.5小时，单号每周收益稳定在400元左右
  reason: 素材P012原文为“从零基础开始到现在运营两个号，每天投入1.5小时不到，单号每周收益400”，与教材所述“每天发布2-4条视频”及“稳定”的表述不完全一致，教材表述略有夸大但其核心数据可溯源。
- location: ch10.7
  claim: 这条流水线解决了两个核心问题：一是规避平台的重复内容检测机制，让旧素材在新号上以“新内容”的形式获得第二次生命；二是通过“加字”环节将通用素材转化为具有针对性的转化工具，使搬运内容在整体链路中承担起为直播间引流和测试选品的功能。
  reason: 素材P006原文并未明确说明流水线“解决两个核心问题”，此为教材编著者的推演性总结，原文仅描述了流程步骤及加字的效用。
- location: ch10.8
  claim: 三者叠加，使每条自动生成的视频在组合层面都是独一无二的，从而能在任何平台通过原创审核。
  reason: 素材P002原文为“在任何一个平台都能过原创”，但明确提到需“加上混淆元素”及“自己拍的照片和视频”为前提。教材此处被表述为“三者叠加”即可保证，存在过度简化前提条件的情况。
- location: ch10.4
  claim: 作者指出，底层工具模块抽取后，“现在几分钟就能实现一个新的模板，抖音上看到的视频只要不是特效很多，基本都能做，只要拆解清楚就可以。”
  reason: 该引文接近于素材P002原话，但在教材中被标注为直接引用，原素材中描写更详细（“写这个视频模板的自动生成视频代码了。写的模板多了就会发现很多方法都可以共用...”），原文并未包含“现在几分钟就能实现一个新的模板”此句。
