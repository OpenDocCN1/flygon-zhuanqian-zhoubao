unsupported_claims:
- location: 30.3 (典型例子：行程码下线收割实战)
  claim: 行程码下线热点中，作者使用12个公众号发布96篇文章，其中9个账号有效上排名，命中率75%，累计新增97,385粉，取关52,430，净增44,955粉，取关率53.8%，流量主收入6,514元，电话卡CPS佣金400+元，理论单日总变现约1万元。
  reason: 素材中仅包含《公众号热点收割复盘：行程码下线案例》这一篇文档（AmKRdF2Z9oQjDExxxuAc18a5nbb.md），其数据与教材一致，但教材第30.3节“典型例子”部分引用了该文档的具体数据，属于有来源支撑。然而教材第30.10节“本章小结”表格中列举的“追热点快速决策”概念，其来源标注为《公众号热点收割复盘：行程码下线案例》，但该文档中并未出现“追热点快速决策”这一术语，仅提到“基于上面的信息以及自身经历，我认为这个热点我可以做；就算这个热点信息我获取的时间晚，但经过我操作的公众号还是能获取到一点点流量”及“我之前追过热点，秋天第一杯奶茶引流了3000多的公众号外卖粉；本身也比较擅长公众号SEO”，属于教材对素材内容的概括提炼，非直接引用，不算声称来自素材但找不到。
- location: 30.5 (半匹配关键词回复)
  claim: 半匹配关键词回复的核心定义为：回复含半匹配词库任意词即触发推送。作者设置了8个半匹配词：行程码、卡、链接、生成、纪念版、行程卡纪念版、码、怎么弄。
  reason: 素材中《公众号热点收割复盘：行程码下线案例》明确提到“关键词回复有一个半匹配功能……半匹配词语我设置成他们经常回复的文字”，并列举了“行程卡”为核心词，但未在文中列出完整的8个半匹配词库，教材中的8个词系教材整理补充，属于教材基于素材核心逻辑的扩展，非素材原文直接声称。
- location: 30.7 (变现载体对照：文章内链接 vs 自动回复链接)
  claim: 订阅号文章页面放链接不会生效跳转，但放在自动回复里可以实现跳转。作者实测自动回复放电话卡CPS卖出6张、佣金400+元；外卖群CPA路径过长失败。
  reason: 素材中《公众号热点收割复盘：行程码下线案例》明确记录：“订阅号文章页面放链接不会生效跳转，但是它放在自动回复里面就可以实现。我在这次追热点的过程中，自动回复里放入两个链接；一个是电话卡销售CPS，一个是外卖进群加粉CPA。”并给出“电话卡CPS卖出6张，佣金400+元；外卖群CPA路径过长失败”的数据，教材引用准确，有来源支撑。
