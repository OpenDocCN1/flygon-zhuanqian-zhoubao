paper: docs/202306/20230613_068.md
desc: 该素材是一篇关于小微实体店创业风险控制的实战经验分享，作者基于家庭经商背景、实地观察及营销书籍知识，系统总结出降低开店倒闭风险的五大核心前置动作：科学统计人流量、排查市政修路风险、岗前实战打工学习、低认知成本命名原则、高可见度招牌设计，强调“笨功夫”是规避本金损失的关键基础。
concepts:
- name: 认知成本
  desc: 消费者识别、记忆、传播店铺名称所需的心智努力；命名应降低而非增加该成本。
  is_original: false
  excerpt:
  - 名字的意义是什么？是为了让人记住你，叫你叫得顺口，记你记得容易，跟别人转述时方便，降低消费者选择你时的认知成本，不是为了让你自己爽。
- name: 招牌传播半径
  desc: 招牌在物理空间内被路人识别的有效距离范围，可通过醒目配色与夜间亮化扩大。
  is_original: true
  excerpt:
  - 做招牌的目的，是为了让路人更容易看到你……晚上一定要给招牌打灯，让老远的人一看就知道你是干嘛的，扩大店铺招牌的传播半径。
- name: 笨方法论
  desc: 指在缺乏数据与经验时，坚持用最原始、最耗时但最可靠的实地调研手段（如人工计数人流）替代主观判断。
  is_original: true
  excerpt:
  - 统计人流量，笨方法，但一定要做……花一周时间，去你准备租的商铺前，用计步器，算下从早到晚有多少人路过。
methods:
- name: __overview__
  desc: 开店前置风控五步法：人流实测→政策排查→岗位沉浸→低认知命名→高可见招牌，构建从选址验证到品牌触达的全链路风控体系。
  excerpt:
  - 1 统计人流量，笨方法，但一定要做
  - 2 查明商铺门前是否要修路
  - 3 如果你想开一家 xx 店，先去店里打工
  - 4 起名字是方便让人记住，不是为了自嗨
  - 5 做招牌是为了让人很远就能发现你
- name: 人流量实测法
  desc: 在目标商铺前连续统计7天（含工作日与周末）全时段人流，记录高峰期分布，对比同街区两侧差异，用计步器量化决策依据。
  excerpt:
  - 花一周时间，去你准备租的商铺前，用计步器，算下从早到晚有多少人路过，一天中的人群高峰期是什么时候，有多少人，然后再统计下工作日和周六日从商铺面前路过的人流量分别是多少。
- name: 市政规划风险排查法
  desc: 通过市政部门官网、12345热线核实周边修路规划，并在租赁合同中嵌入‘修路减免房租’抗风险条款。
  excerpt:
  - 建议去当地市政部门，或者市政规划网站找一找有没有修路的相关信息，如果不方便查找，建议拨打市长热线 12345 求助。如果确认没有规划修路，建议在跟房东签合同时，看能不能加一个如果修路，适当减免房租的条款。
- name: 岗前沉浸式打工法
  desc: 创业者在目标业态店铺全职工作3个月，以员工身份低成本获取盈利模型、运营痛点、客诉处理等隐性知识。
  excerpt:
  - 如果你想开一家奶茶点，建议你先去奶茶店铺打工三个月，了解清楚里面的门道，确认下店铺是否赚钱，不赚钱的原因是什么，经常会遇到哪些问题，客诉集中在哪几块，如何处理客诉。
- name: 低认知成本命名法
  desc: 避免生僻字、自嗨式命名；参照互联网大厂（小米、京东等）命名范式，确保名字‘知业务、易记忆、顺口传播’。
  excerpt:
  - 参考下各种互联网公司的名字：小米，京东，天猫，百度，360，没有一家公司使用生僻字。给店铺招牌起名字的目的，两点：1 让人知道你是做什么的 2 容易记住你的名字，容易叫出你的名字。
- name: 高可见度招牌设计法
  desc: 采用高对比度配色（如红底白字）+ 强制夜间亮灯，最大化物理曝光距离与时长。
  excerpt:
  - 一定要使用醒目的颜色和字体，例如红底白字，很多人感觉丑，但是你去大街上比对下，是不是这样的颜色搭配较多，也更容易让人注意到。还有一点，晚上一定要给招牌打灯。
theorems:
- name: 前置调研成本 << 试错损失成本
  desc: 投入十几万本金开店前，花费时间成本做实地调研、打工学习（近乎零金钱成本），远低于开业后倒闭导致的本金归零、负债打工还债的沉没成本。
  excerpt:
  - 有的同学辛辛苦苦攒钱十几万……轻易地就把十几万投进了生意，很多人经营到一半，维持不下去，只能把店铺转让出去……赔了底朝天，最后不得不关掉店铺，回去老实去工作，再一次开始辛苦攒钱，慢慢还债。
- name: 选址微观差异决定生死
  desc: 同一街区、甚至马路两侧的人流量、商业性质可能截然不同，宏观‘大街火’不等于微观‘铺位活’，必须实测微观坐标。
  excerpt:
  - 别看一条街很火，但是隔了一条马路，就会经常发生马路一边的商铺火，另一边不火，周一到周五人多，周六日没人，所以一定要实地考察统计。
- name: 外部政策风险可通过契约对冲
  desc: 不可控的市政建设（如长周期修路）虽无法阻止，但可通过租赁合同条款（修路减租）将不可控风险转化为可量化的财务对冲。
  excerpt:
  - 见到过修路修半年，路两边商铺全部歇业的场面……看能不能加一个如果修路，适当减免房租的条款，否则真的突然修起路，受到的影响会非常大。
- name: 商业命名的功能主义本质
  desc: 店名不是自我表达的艺术品，而是降低消费者决策摩擦的工具；好名字=低认知成本+高业务暗示度。
  excerpt:
  - 起名字的目的，两点：1 让人知道你是做什么的 2 容易记住你的名字，容易叫出你的名字。
- name: 招牌是物理世界的‘流量入口’
  desc: 实体店招牌的核心KPI是‘被看见的概率×被看见的距离’，审美偏好必须让位于物理可见性。
  excerpt:
  - 做招牌的目的，是为了让路人更容易看到你……扩大店铺招牌的传播半径。
findings:
- name: 五线城市修路导致商铺批量歇业案例
  desc: '[evidence] 作者亲历五线小城修路半年导致路两边商铺全部歇业，验证了市政规划风险对小微实体店的毁灭性冲击。'
  excerpt:
  - 我来自五线小城，见到过修路修半年，路两边商铺全部歇业的场面。
- name: 互联网大厂命名零生僻字实证
  desc: '[evidence] 枚举小米、京东、天猫、百度、360等头部互联网企业名字均无生僻字，佐证‘低认知成本命名’在商业头部案例中的普适性。'
  excerpt:
  - 参考下各种互联网公司的名字：小米，京东，天猫，百度，360，没有一家公司使用生僻字。
- name: 红底白字招牌高频现象观察
  desc: '[evidence] 实地对比发现大街上高对比度配色（红底白字）招牌占比高、注意度高，尽管主观审美常被评价为‘丑’。'
  excerpt:
  - 例如红底白字，很多人感觉丑，但是你去大街上比对下，是不是这样的颜色搭配较多，也更容易让人注意到。
- name: 打工学习模式获取隐性知识收益
  desc: '[claim] 作者主张打工3个月可低成本掌握盈利模型、客诉处理等核心隐性知识，规避‘两眼一抹黑’从零起步。'
  excerpt:
  - 老板给你发工资，让你干活，你利用老板的店，学习解决问题，这样自己做同类型生意时，就能心里有底，而不是两眼一抹黑从零起步。
- name: 五大基础动作虽不保证盈利但能显著降低倒闭概率
  desc: '[claim] 作者总结的五条心得是开店风控的‘必要非充分条件’：做到不一定赚钱，但不做倒闭风险会大很多。'
  excerpt:
  - 做好上述这 5 点，不一定就能赚钱，但这是基础，如果连这 5 点都不做，倒闭的风险会大很多。
