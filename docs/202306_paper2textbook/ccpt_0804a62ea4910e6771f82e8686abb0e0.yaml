paper: docs/202306/20230613_127.md
desc: 该素材为一篇 Midjourney（MJ）不同类型风格的图样分享帖，作者整理并展示了多种 MJ 风格关键词的出图效果，旨在帮助用户直观理解风格名称对应的视觉表现，降低提示词学习门槛，文中并提及通过
  `--stop` 参数控制生成进度以创造特定效果（如模糊鬼影）的技巧。
concepts:
- name: MJ 风格关键词可视化图谱
  desc: 将抽象的 Midjourney 风格关键词（如哥特风格）与其生成的具体图像效果一一对应展示，形成直观的参考库，解决用户‘看着名字没感觉，出图后才清晰’的认知鸿沟。
  is_original: true
  excerpt:
  - 整理了一份 MJ 不同类型风格的图样，希望能够给到大家一些启示，在这个过程中，我自己最直观的感受就是，看着这些风格的名字没有什么感觉，但是出图之后就比较清晰了
- name: Stop 指令控制生成进度
  desc: 利用 Midjourney 的 `--stop` 参数在图像生成未完成时强制中断，保留模糊、未完全成型的中间态图像，以此创造特定的艺术效果（如恐怖片中的鬼影感）。
  is_original: false
  excerpt:
  - 适合出一些鬼片，再配合 stop 指令，停在出图前，来个模糊鬼影，绝了
methods:
- name: __overview__
  desc: 通过大量实验生成不同风格关键词的对比图样，整理为文档（飞书文档）供社区参考，采用‘风格名+出图效果’的对照呈现方式。
  excerpt:
  - 整理了一份 MJ 不同类型风格的图样
  - 文章很长请大家移步飞书 https://om8gx43e8e.feishu.cn/docx/AiXCdetQron13NxHHL6cKSjEn2c
theorems:
- name: 风格语义需视觉实证
  desc: AI 绘画提示词中的风格类关键词具有高度抽象性，仅阅读文字无法建立准确心理表征，必须通过实时出图对比才能掌握其真实视觉语义。
  excerpt:
  - 看着这些风格的名字没有什么感觉，但是出图之后就比较清晰了，希望也能给到大家同样的帮助
findings:
- name: 哥特风格恐怖感强
  desc: '[claim] 哥特风格生成的图像具有极强的恐怖片氛围感。'
  excerpt:
  - 哥特风格好恐怖，有一种鬼片的感觉！哈哈哈
- name: Stop 参数可制造模糊鬼影效果
  desc: '[evidence] 结合哥特风格使用 `--stop` 参数中断生成，可获得模糊鬼影的特殊视觉效果，经实测验证效果显著。'
  excerpt:
  - 的确，适合出一些鬼片，再配合 stop 指令，停在出图前，来个模糊鬼影，绝了
