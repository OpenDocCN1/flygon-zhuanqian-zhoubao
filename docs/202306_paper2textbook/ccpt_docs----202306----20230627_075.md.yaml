paper: docs/202306/20230627_075.md
desc: 该素材通过巴菲特对长期资本管理公司（LTCM）破产案的复盘，核心阐述了风险管理中的“非对称赔率”原则：当失败的后果是毁灭性的（如破产、身死）时，无论成功概率多高（哪怕是百万分之一的失败率），只要成功带来的收益对当事人无关紧要（如锦上添花），该风险就绝对不值得冒。素材批判了过度依赖数学模型（如六西格玛、贝塔系数）而忽视现实世界“未知未知”风险的傲慢心态，强调“只需富一次”的财富保全智慧。
concepts:
- name: 非对称生存赔率
  desc: 指决策中面临的收益与风险极度不对等的结构：成功仅带来边际效用递减的收益（如财富从1.1亿增至1.2亿），失败却导致不可逆的毁灭性后果（破产、生命终结、名誉扫地）。在该结构下，概率大小失去决策参考意义，核心在于后果的可承受性。
  is_original: false
  excerpt:
  - 假设你递给我一把枪，里面有 1000 个弹仓，100 万个弹仓，其中只有一个弹仓里有一颗子弹，你说把枪对准你的太阳穴扣下扳机，你想要多少钱，我不干给我多少钱都不干。
  - 假设年初你有 1 亿美元，如果不上杠杆能赚 10%，上杠杆的成功率是 99%能赚 20%，年未时你有 1.1 亿美元，还是 1.2 亿美元有区别吗？没一点区别，要是亏钱了的话...把朋友的钱都亏了没脸见人。
- name: 只需富一次
  desc: 财富管理的核心准则：一旦积累了足以维持理想生活的财富，首要目标应是保全财富避免归零，而非通过冒险追求多余的增量。该概念强调财富的边际效用递减与毁灭性风险的非线性冲击。
  is_original: false
  excerpt:
  - 有一本烂书但是书名起得很好，书名是《一生只需富一次》，这个道理难道不是很简单吗？
- name: 模型盲区与现实风险的背离
  desc: 指金融模型（如 VaR、六西格玛、贝塔系数）基于历史数据计算的概率分布，无法覆盖现实世界中“未知的未知”、极端尾部事件及结构性断裂，导致决策者产生虚假的安全感。
  is_original: false
  excerpt:
  - 他们太依赖数学了，以为知道了一支股票的贝塔系数，就知道了这支股票的风险，要我说贝塔系数和股票的风险根本是八竿子打不着，会计算西格玛不代表你就知道破产的风险。
  - 只看过去的情况，无法确定未来金融事件发生的概率。
- name: 两种破产者
  desc: 亨利·考夫曼提出的分类：一类是“什么都不知道的”无知者，另一类是“什么都知道的”傲慢者。后者因掌握精密模型和海量细节而过度自信，反而忽视了最关键的生存底线。
  is_original: false
  excerpt:
  - 亨利考夫曼说过一句话，破产的有两种人，一种是什么都不知道的，一种是什么都知道的。
methods:
- name: __overview__
  desc: 基于极端案例复盘的第一性原理推演法：选取极端典型案例（LTCM：高智商、高经验、高自有资金投入），剥离表象细节，直指决策逻辑的核心缺陷（为不需要的钱冒不该冒的险），通过思想实验（俄勒冈枪/百万弹仓）将抽象概率具象化为生死抉择，建立“后果可承受性
    > 概率大小”的决策启发式框架。
  excerpt:
  - 长期资本管理公司有 16 个创始人...智商高得不得了...经验老道...把自己的钱也投进去了...结果却破产了。
  - 假设你递给我一把枪，里面有 1000 个弹仓，100 万个弹仓...
  - 我们都有一定的概率会摊上类似的事，我们都有盲点，或许是因为我们了解了太多的细枝末节，把最关键的地方忽略了。
- name: 最坏结果前置审视法
  desc: 决策前置检查清单：在执行任何带有不确定性的行动前，强制提问‘最坏的结果是什么？我能不能接受？’，若无法承受最坏结果，则无论正向期望值多高、概率多大，坚决不执行。
  excerpt:
  - 做事情前问一问自己：最坏的结果是什么？我能不能接受？
theorems:
- name: 核心主张：为不需要的东西冒失去必需品的风险，是根本性的理性缺失
  desc: 当决策主体已拥有足够资源（财富、声誉、生命）满足核心需求时，任何以核心资产为赌注、博取边际效用极低的增量收益的行为，在理性层面均不可辩护。智商、经验、模型精度均无法为这种结构性愚蠢辩护。
  excerpt:
  - 他们为了赚更多的钱，为了赚自己不需要的钱，把自己手里的钱都搭进去了，这不是傻是什么？为了得到对自己不重要的东西，甘愿拿对自己重要的东西去冒险，哪能这么干？
  - 我真理解不了怎么有人会像这 16 个人一样，智商很高人品也好，却做这样的事，一定是疯了。
- name: 概率论失效定理：在毁灭性风险面前，高概率成功不等于理性决策
  desc: 当风险后果具有‘吸收障碍’特性（即游戏终局、不可逆）时，频率学派概率（如 99.99% 成功率）失去指导意义。决策依据必须从‘期望值最大化’转向‘生存概率最大化’（凯利公式/鲁棒性逻辑）。
  excerpt:
  - 之前他们和我说，六西格玛事件（即微小概率）伤不着他们，他们错了。
  - 要是我赢了，我不需要那些钱，要是我输了结果不用说了，这样的事我一点都不想做，但是在金融领域，人们经常做这样的事都不经过大脑的。
findings:
- name: LTCM 案例实证：精英阶层更易陷入‘能力陷阱’导致毁灭性失败
  desc: '[evidence] 素材呈现的 LTCM 真实历史案例支撑：16 位创始人包含 2 位诺奖得主、总计 300-400 年经验、高比例自有资金投入，却因极端行情（1998年俄国违约）导致模型失效、高杠杆爆仓、最终破产接受救助。这证明‘知道得越多’（模型越精细）在特定条件下反而会放大盲区风险。'
  excerpt:
  - 长期资本管理公司有 16 个创始人，其中还有两位诺贝尔奖桂冠得主...把他们这 16 个人加起来他们的智商该多高...这 16 个人加起来有三四百年的经验了...大多数人，都几乎把自己的整个身家财产，都投入到了长期资本管理公司...结果却破产了。
- name: 幸存者偏差与路径依赖的隐性风险：过往成功可能是积累隐性尾部风险的过程
  desc: '[claim] 评论区观点提出的假说：LTCM 此前获得大量本金、经历无数次‘万分之一风险’安全通过，可能并非能力使然，而是幸存者偏差掩盖下的风险积累过程。最终爆雷只是概率分布的必然呈现。此发现揭示了‘过往胜利=未来安全’的认知谬误。'
  excerpt:
  - 有个问题：他们获得大量的本金可能也是通过这种方式进行的，是经历过无数个万分之一风险安全过来的。只是说最后他们在某个万分之一上爆雷了，才出了广为人知的故事
- name: 风险决策的公众共识：不可承受之重，概率归零
  desc: '[evidence] 评论区高赞共识提炼：当失败代价超过承受阈值（如‘淹死的都是水性好的’、‘上了牌桌要想好输光了怎么办’），成功概率不再是决策变量。公众直觉验证了巴菲特‘俄勒冈枪’思想实验的普适性。'
  excerpt:
  - 如果失败的代价过于沉重、难以承受，那么这件事成功的概率有多高根本无关紧要。 (孤风)
  - 淹死的都是水性好的，太厉害的就容易自信过头，总觉得可以对抗违背规律 (超凡)
  - 上了牌桌，就要提前想好如果全部输掉了能不能接受，怎么办 (周彦充)
  - 反脆弱 (胖大魔)
