paper: docs/202306/20230613_163.md
desc: 该素材是一篇关于轻医美门店如何利用小红书平台实现每日引流100组精准私域客户的实战案例分享精华帖，由作者宗霖于2023年初跑通并拆解，供实体门店老板参考借鉴，文中并未直接展开具体操作细节，而是引导读者跳转外部链接查看完整图文拆解，评论区补充提及抖音信息流投放成本上涨、ROI下降的市场背景。
concepts:
- name: 轻医美门店私域引流
  desc: 指轻医美实体门店通过公域平台（如小红书）获取客户线索，并将其沉淀至私域流量池进行转化运营的商业动作。
  is_original: false
  excerpt:
  - 轻医美门店如何通过小红书每天引流 100 组精准私域客户
- name: 精准私域客户
  desc: 指具有明确轻医美需求、高意向且已添加企业微信/个人微信等私域联系方式的潜在客户群体。
  is_original: false
  excerpt:
  - 每天引流 100 组精准私域客户
- name: 实战案例拆解
  desc: 将已跑通的商业闭环案例，按步骤、节点、数据进行结构化还原，供同行复制参考的内容形式。
  is_original: false
  excerpt:
  - 这是我们今年年初跑通的一个案例，做了详细的拆解，做实体门店的老板可以参考借鉴。
methods:
- name: __overview__
  desc: 基于小红书内容种草获客，结合门店实体服务转化，构建标准化SOP实现日引流100组精准私域客户的系统化方法论（具体SOP细节需跳转外链查看）。
  excerpt:
