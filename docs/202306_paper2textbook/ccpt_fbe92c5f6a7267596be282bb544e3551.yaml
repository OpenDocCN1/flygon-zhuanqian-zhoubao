paper: docs/202306/20230613_202.md
desc: 该素材是一份名为《ChatGPT 投喂指南》的实操教程推荐帖，由作者黄小刀于2023年5月发布，旨在通过“投喂”（输入数据/指令）的方式，指导用户利用
  ChatGPT 完成 PDF 分析、网页信息查询、数据表格分析、文本风格模仿、聊天记录分类、长文本速读及特定观点提取等七大类核心应用场景，并附上了飞书文档形式的详细操作指南链接。
concepts:
- name: 投喂
  desc: 指向 ChatGPT 输入特定格式的数据（如 PDF、网页链接、表格、文本、聊天记录等）并配合特定提示词，以触发模型执行特定任务（分析、总结、提取、模仿等）的交互范式。
  is_original: true
  excerpt:
  - 《ChatGPT 投喂指南》 我想要让 ChatGPT 做这些事： 给它一份 PDF，让它分析摘要、提炼内容； 让它去看某个网页，帮我查询最新的信息； 给它一份数据表格，让它分析出数据的变化；
    给它一份文本，让它总结、模仿出相似的风格； 给它一个聊天记录，让它把你的好友进行分类和打标签； 给它一本书，让它快速读完，并且告诉我书里都讲了什么； 给它亦仁的公众号，让它告诉我亦仁对于某个问题是什么看法....
- name: 投喂指南
  desc: 一份系统化的操作手册，详细记录了针对不同数据源和任务目标的具体投喂方法、提示词技巧及工具配置（如飞书文档链接指向的内容）。
  is_original: true
  excerpt:
  - 那你不要错过这份入门级的投喂指南！！ 飞书奉上： https://k0z8o16zas8.feishu.cn/docx/SUTKd7wdDoAg2Exv7hoc8m0BnOK
methods:
- name: __overview__
  desc: 基于“投喂”范式的 ChatGPT 通用应用方法论，涵盖七大核心场景：文档分析（PDF/书籍）、联网查询（网页/公众号）、结构化数据分析（表格）、文本生成与风格迁移（总结/模仿）、非结构化对话数据挖掘（聊天记录分类打标）及特定知识库问答（公众号观点提取）。
  excerpt:
  - 给它一份 PDF，让它分析摘要、提炼内容； 让它去看某个网页，帮我查询最新的信息； 给它一份数据表格，让它分析出数据的变化； 给它一份文本，让它总结、模仿出相似的风格；
    给它一个聊天记录，让它把你的好友进行分类和打标签； 给它一本书，让它快速读完，并且告诉我书里都讲了什么； 给它亦仁的公众号，让它告诉我亦仁对于某个问题是什么看法....
theorems:
- name: ChatGPT 通用任务处理能力主张
  desc: ChatGPT 具备处理多模态输入源（文档、网页、表格、长文本、对话记录）并执行高阶认知任务（摘要、推理、分类、风格迁移、观点归因）的通用能力，用户只需掌握标准化的“投喂”技巧即可落地应用。
  excerpt:
  - 《ChatGPT 投喂指南》 我想要让 ChatGPT 做这些事： 给它一份 PDF，让它分析摘要、提炼内容； 让它去看某个网页，帮我查询最新的信息； 给它一份数据表格，让它分析出数据的变化；
    给它一份文本，让它总结、模仿出相似的风格； 给它一个聊天记录，让它把你的好友进行分类和打标签； 给它一本书，让它快速读完，并且告诉我书里都讲了什么； 给它亦仁的公众号，让它告诉我亦仁对于某个问题是什么看法....
- name: 入门级指南即刻上手主张
  desc: 通过提供结构化的“投喂指南”（飞书文档），可显著降低普通用户使用 ChatGPT 进行复杂任务自动化的门槛，实现即学即用。
  excerpt:
  - 那你不要错过这份入门级的投喂指南！！ 飞书奉上： https://k0z8o16zas8.feishu.cn/docx/SUTKd7wdDoAg2Exv7hoc8m0BnOK
findings:
- name: 社区高认可度反馈
  desc: '[evidence] 该指南发布后获得 549 个赞及大量正面评论（如“太强了”“超级干货”“正好需要”），验证了该“投喂指南”在真实用户场景中的实用性与受欢迎程度。'
  excerpt:
  - (精华帖)(549 赞)ChatGPT 投喂指南
  - '评论区： 黑头羊 : 太强了[哇][哇] 吴佩在天涯 : 太强啦 酌 _ 意 : 非常好 刚从老师课上下来，非常精彩，被耽误的相声演员[憨笑] 一瞬成空
    : 太牛了 百万 : 太干货了，正好我需要学习投喂，刀姐就投喂过来了 温特森ᴗ : 刀姐，刀我 矜持的射手 : 超级干货！ 我想写一本通过从业多年经验，大
    B 类的行业职场小说，期待刀姐的 GPT 写书分享 蓝叶 : 使用 bing 的缺点是不是漏掉了[偷笑]'
- name: 用户延伸需求发现
  desc: '[evidence] 评论区用户提出“GPT 写书分享”、“使用 Bing 的缺点”等延伸需求，揭示了用户从基础投喂技巧向长文本生成、工具对比评测等进阶场景的迁移意愿。'
  excerpt:
  - '矜持的射手 : 超级干货！ 我想写一本通过从业多年经验，大 B 类的行业职场小说，期待刀姐的 GPT 写书分享'
  - '蓝叶 : 使用 bing 的缺点是不是漏掉了[偷笑]'
