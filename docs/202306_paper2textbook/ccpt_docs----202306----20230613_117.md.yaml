paper: docs/202306/20230613_117.md
desc: 该素材分享了作者杨昌结合「快写慢改」写作方法论与 ChatGPT 协作的标准化作业程序（SOP），核心主张是通过「标题+关键词+大纲+清单+卡片」五步拆解写作任务，再配合分层级的「改稿」流程，将难度高的整体创作拆解为可执行的微步骤，从而降低写作门槛、稳定输出质量，实现人机高效协作。
concepts:
- name: 快写慢改
  desc: 一种将写作拆解为“快速产出草稿（快写）”与“多轮精细打磨（慢改）”两个阶段的写作方法论，旨在降低启动难度、保证输出质量。
  is_original: false
  excerpt:
  - 从 V 先生这里学到的「快写慢改」，是去年对我帮助最大的一个输出方法论。
  - 把一件难事，拆为可操作的一步步，降低写一篇文章的成本，是持续写很多篇文章的保证。
- name: Step-by-Step 协作范式
  desc: 指不指望 AI 一次性生成完美内容，而是由人类主导将任务拆解为微步骤，逐步引导 AI 完成各环节，确保每步对齐创作意图。
  is_original: true
  excerpt:
  - 让 ChatGPT 一气呵成输出优质内容，非常非常难。但如果能自己能做好拆解，Step by Step 地跟 ChatGPT 一起创作，争取让 ChatGPT
    每一步理解到创作背后的意图、期待，这样产出的内容，大概率不会太差。
- name: 角色扮演式提示词工程
  desc: 在协作过程中，要求 AI 带入“编辑”、“读者”等特定角色视角，对大纲逻辑、清单内容、改稿细节进行评审与优化。
  is_original: false
  excerpt:
  - 然后请 ChatGPT 带入编辑、读者等的角色，不断优化大纲的逻辑和表达。
  - 再让 ChatGPT 带入编辑、读者等的角色去理解和给优化建议。
  - 每一遍，都尽可能带入编辑和读者的视角
- name: 知识卡片
  desc: 写作素材的最小颗粒单元，建议利用联网搜索工具快速获取官方/权威内容填充，先求量/全，后求质/准，延迟到改稿阶段处理逻辑与措辞。
  is_original: false
  excerpt:
  - 【知识卡片】：这个时候，推荐用 new Bing 或者 ChatGPT 的联网插件，去快速搜一些比较官方的内容。不用在乎逻辑和措辞，先放上去，先把内容丰富起来，待改稿时再或删或改。
methods:
- name: __overview__
  desc: 「标题+关键词+大纲+清单+卡片+多轮改稿」六阶段人机协作 SOP：先由人主导拆解意图与结构（标题/关键词/大纲），再人机共创素材（清单/卡片），最后人主导分层打磨（改稿），全程贯穿角色扮演与步步对齐。
  excerpt:
  - 「标题+关键词+大纲+清单+卡片」
  - 1、【标题】：描述你想写什么...让它理解和总结一下，我们具体要写的是什么。
  - 2、【关键词】：先把自己的关键词列出来，再让 ChatGPT 总结一下这些词之间的逻辑，然后推荐更多关键词...
  - 3、【大纲】：最好是自己先将关键词排列好顺序，形成一套比较简单自洽的逻辑。然后请 ChatGPT 带入编辑、读者等的角色，不断优化大纲的逻辑和表达。
  - 4、【清单】：围绕大纲里面的关键词，形成清单。可以先把自己的想法快速写下来，再让 ChatGPT 带入编辑、读者等的角色去理解和给优化建议。
  - 5、【知识卡片】：...推荐用 new Bing 或者 ChatGPT 的联网插件，去快速搜一些比较官方的内容...待改稿时再或删或改。
  - 6、【改稿】：改稿时可以分几遍，每一遍改的重点不同...
- name: 分层改稿法
  desc: 将修改过程拆解为 7 个聚焦单一维度的遍数：结构调整、材料补充、句式简化与措辞检查、金句植入、错别字标点检查、引用规范化、标题打磨。
  excerpt:
  - 改稿时可以分几遍，每一遍改的重点不同，比如： 一遍调章节结构， 一遍补充材料， 一遍长句改短句并检查措辞， 一遍往里面加几个金句， 一遍检查错别字和标点符号，
    一遍为必要的引用添加脚注与链接， 最后一遍是打磨一下标题。
theorems:
- name: 任务拆解降低认知负荷定律
  desc: 将高难度的整体创作任务拆解为可操作的微步骤序列，能显著降低单次认知负荷与执行门槛，是持续稳定产出高质量内容的前提。
  excerpt:
  - “把一件难事，拆为可操作的一步步，降低写一篇文章的成本，是持续写很多篇文章的保证。”
  - 写文章如此，跟 ChatGPT 合作写文章更是如此。
- name: 人机协作能力杠杆效应
  desc: AI 协作对专家（高阶写作者）的边际收益远高于新手，专家擅长任务拆解与质量把关，能将 AI 转化为“兰博基尼拖拉机”实现指数级产出；新手缺乏拆解能力，易陷入“吐槽还不如我的镰刀”的工具怪圈。
  excerpt:
  - 有种说法叫：“AI 让 80 分以下的普通人做到 80 分水平，可以让 80 分以上的专业人士做到 80000 分的水平”。
  - 而专家毕竟投入了十几二十年精力，他们或多或少有点手艺执念或心理障碍... 专家一旦用起来，往往有惊人的产出。
- name: 人类保留“意图与结构主导权”原则
  desc: 在人机协作中，核心逻辑构建（关键词排序、大纲自洽）、素材源头把控（清单核心观点）、改稿策略制定必须由人类主导，AI 仅辅助执行、补全、评审，不可倒置。
  excerpt:
  - 最好是自己先将关键词排列好顺序，形成一套比较简单自洽的逻辑。
  - 可以先把自己的想法快速写下来，再让 ChatGPT...去理解和给优化建议。
  - 每一遍，都尽可能带入编辑和读者的视角，Step by Step 地介绍清楚背景、诉求，同时补齐相关的专业知识。
findings:
- name: SOP 实战验证：从零起步产出高认可度稿件
  desc: '[evidence] 作者在转行面对陌生产品与客群时，仅凭「快写慢改」方法论硬着头皮写出产品市场文章，并产出多篇获客户、行业专家、公司高层认可的稿件，验证了方法论对新手的有效性。'
  excerpt:
  - 当时刚转行，面对完全没接触过的产品，和非常陌生的客户群体，要着手写产品市场的文章... 后来，是靠着「先写慢改」的办法，硬着头皮写下来了。写着写着，还出过几篇客户、行业专家和公司高层比较认可的稿子。
- name: 专家抵触与高产并存现象
  desc: '[evidence] 评论区实证显示：专家群体存在“手艺执念/心理障碍”导致初期抵制 AI（如安利时遭小朋友激烈抵制），但一旦跨越门槛深度使用，往往产生“惊人的产出”，印证了能力杠杆效应的非线性特征。'
  excerpt:
  - 第一次被专家叫过去跟他手下的小朋友安利的时候，就受到过小朋友比较激烈的抵制。
  - 不过，专家一旦用起来，往往有惊人的产出。
- name: 普通人使用门槛高企现状
  desc: '[claim] 作者宣称受限于梯子、账号、充值等基础设施门槛，以及缺乏高价值应用场景引导，99.99% 的普通人被挡在 AI 红利门外，无法享受效率提升。'
  excerpt:
  - 因为梯子、账号、充值等问题，加上缺乏高价值的应用场景，99.99%的普通人被挡在了门外。
