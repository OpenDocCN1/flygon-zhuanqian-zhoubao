paper: docs/202306/20230613_029.md
desc: 该素材为吴东子发布的《AI 变现异常值案例库》第一期内容，作者因撰写系统性的 AI 变现方法论难度过大（MECE 原则难以满足），转而采用“异常值案例库”形式，分享
  5 大方向 10 个具体的 AI 副业变现案例（宝宝起名号、AI 热点资讯号、头像壁纸号、小说推文号、流量收益号），旨在提供灵感启发而非深度拆解，供读者筛选可复制、可放大的项目机会。
concepts:
- name: AI 变现异常值案例库
  desc: 作者创立的内容专栏概念，指不追求体系化、MECE 分类的方法论，而是收集、记录并分享市场上少数成功、可复制、高 ROI 的 AI 副业实战异常案例，侧重灵感启发而非理论构建。
  is_original: true
  excerpt:
  - 于是我转变为写【AI 变现异常值案例库】，侧重于副业项目这款
  - 把我观察到的案例分享给大家，不会做过多的拆解和分析，更多的是偏向于灵感启发
- name: AI 变现方法论
  desc: 作者原本计划撰写的系统性知识体系，旨在整理 AI 技术方向、应用场景与变现案例，因话题过大、难以做到相互独立完全穷尽（MECE）而搁置。
  is_original: false
  excerpt:
  - 本来想写一篇 AI 变现方法论，把 AI 现有的技术方向，应用场景，变现案例都整理出来
  - 做不到相互独立和完全穷尽，就算强行用一个分类把他们分类了，也会失去“分类”本身所具备的指导意义
methods:
- name: __overview__
  desc: 异常值观察与案例库构建法：放弃自顶向下的体系化分类，转而采用自底向上的实证观察，筛选市场上的‘异常值’（成功副业案例），按业务方向聚类（5大方向），呈现具体项目（10个案例），降低认知门槛，激发读者模仿与创新。
  excerpt:
  - 所以只好把 AI 变现方法论这个大话题先放一放...于是我转变为写【AI 变现异常值案例库】
  - 第一期先分享 5 种方向，10 个案例 1.宝宝起名号 2.AI 热点资讯号 3.头像壁纸号 4.小说推文号 5.流量收益号
  - 思考这里面的案例有没有你能做的，能复制的，能放大的
theorems:
- name: MECE 分类在 AI 变现领域的失效性
  desc: AI 领域跨度极大（从排版工具到无人驾驶），强行构建相互独立、完全穷尽（MECE）的分类体系不仅难度极高，且会丧失分类的实操指导意义，不如案例库实用。
  excerpt:
  - 因为人工智能这个话题太大了...做不到相互独立和完全穷尽，就算强行用一个分类把他们分类了，也会失去“分类”本身所具备的指导意义
- name: 案例库优于方法论的副业指导价值
  desc: 对于副业人群，具体的、可观察的、可复制的异常案例（灵感启发）比抽象的、系统的方法论更具即时行动指导价值。
  excerpt:
  - 侧重于副业项目这款...更多的是偏向于灵感启发
  - 思考这里面的案例有没有你能做的，能复制的，能放大的，可能屁用没有，也可能黄金万两
