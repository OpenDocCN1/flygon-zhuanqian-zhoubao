paper: docs/202306/20230613_087.md
desc: 该素材为生财有术社群成员「静水流深」撰写的连载开篇，作者以武汉大学计算机系毕业且大四年入百万的亲身经历为背景，论证「年入百万难度远低于考上985」的核心观点，并通过复盘从童年到大学的教育经历（跨区借读、早期计算机启蒙、香烟倒卖商业萌芽、超前学习策略、名校环境熏陶），揭示「认知与眼界起点」超越单纯努力的关键作用，旨在为后辈提供出海创业与个人成长的启示。
concepts:
- name: 年入百万vs考上985难度模型
  desc: 作者基于亲身经历提出的难度对比模型：年入百万难度 << 考上985 < 年入千万（一次）难度。认为高考是标准化考试，只要无短板即可；赚钱依靠认知、机遇和杠杆，上限更高但门槛更低。
  is_original: true
  excerpt:
  - 我的观点：年入百万的难度远小于进 985，年入过千万（一次）的难度跟进 985 的难度相当。
  - 高考其实是全日制非成人教育的一次重要的检阅...985 一般 600 分即可，只要数理化平均分 135 分以上，语外没有严重偏科，基本上稳进。
- name: 认知与眼界起点论
  desc: 核心主张：决定人生上限的不是单点努力，而是早期建立的认知框架和环境提供的眼界起点。父母的核心作用是提供最好的平台与空间（如大城市户口、优质学区、前沿信息接触），而非过度干预式陪伴。
  is_original: true
  excerpt:
  - 最关键的并不是我多努力，而是我知道人一辈子很长，并不是某个点的成绩代表一辈子。
  - 对于小孩的教育，给他们你能够给的最好的平台与空间，其他靠他们自己即可，所谓的现在大多数家长各种操心，陪伴，至少我觉得是完全没有必要的。
- name: 降维打击式超前学习
  desc: 指在低阶段提前掌握高阶段知识体系，从而在标准化考试中形成碾压优势。素材中小学六年级学初一数学、小学接触大学级Basic语言编程均为典型案例。
  is_original: false
  excerpt:
  - 教数学的老师小学六年级把初一的课给我们上了，所以学好数学最简单的方法就是你超前学就是降维打击。
  - 参加过小学的计算机兴趣小组...我学到后来的水平，可以自己编写一个打飞机的游戏
- name: 信息不对称套利思维
  desc: 指利用认知差距或地域价格差异进行低买高卖的商业本能。作者小学时期利用荆州武汉香烟价差倒卖获利，是该思维的萌芽，后延伸至出海互联网项目（Wise推荐、ChatGPT应用）的核心逻辑。
  is_original: true
  excerpt:
  - 荆州的中华香烟每条比武汉低大约 80 元...我把我所有的压岁钱拿去进货了香烟，回到武汉倒手给武汉我家门口的小卖部，赚了几百块钱。
methods:
- name: __overview__
  desc: 作者的成长与致富综合方法论：1. 环境置换法（父母通过义工、跨区借读置换优质教育资源）；2. 前沿技术早期捕获法（小学接触计算机、关注硅谷趋势）；3.
    信息套利实战法（香烟倒卖、出海项目挖掘）；4. 标准化考试降维打击法（超前学习覆盖考点）；5. 认知复利构建法（拒绝单点成绩定义人生，关注长期赛道）。
  excerpt:
  - 我爸妈通过给另外一个不错的小学做义工的方式，让我去了另外一个小学上学。
  - 专门去了一个阶梯教室，有个老师给我们讲了美国的硅谷，那个时候我就知道了信息高速公路这个词。
  - 学好数学最简单的方法就是你超前学就是降维打击。
  - 后来侥幸参加过一次计算机比赛，我获得武汉市二等奖...成为我读大学时候选专业的重要原因。
- name: 出海项目筛选与验证框架
  desc: 作者隐性使用的项目筛选标准：单人可单干、确定性高（一定可以月入万刀）、利用信息差/工具差（Wise推荐、ChatGPT应用）、社群内部验证后再公开分享。
  excerpt:
  - 我也又拿出了一个新的项目，也是可以一个人单干而且一定可以月入万刀的。
  - 上个月分享了《通过 Wise 的推荐项目，每天躺赚一万英镑+"也受到了一致好评。
theorems:
- name: 高考标准化门槛低于商业变现门槛定理
  desc: 高考是有明确大纲、标准答案、固定分数线的有限游戏，只要智力正常且无严重偏科，通过刻意练习即可达标；年入百万虽需综合能力，但路径多样（打工、创业、投资），容错率高，且可借助杠杆（代码、媒体、资本）放大产出，因此对普通人而言，后者难度系数更低。
  excerpt:
  - 高考其实是全日制非成人教育的一次重要的检阅...985 一般 600 分即可，只要数理化平均分 135 分以上，语外没有严重偏科，基本上稳进。
  - 年入百万的难度远小于进 985
- name: 父母教育边际效应递减定律
  desc: 父母对子女教育的高投入陪伴（监督作业、鸡娃）边际收益递减，甚至因亲子关系恶化而负收益；高杠杆动作是一次性配置核心资产（学区房/大城市户口/前沿眼界），随后顺应孩子天性放养，效果优于全程托管。
  excerpt:
  - 我的父母其实除了做了上面的一些事情后，平时从来不管我学习，包括教育我个人觉得是很失败的...唯一成功的是给了我一个不错的眼界起点。
  - 给他们你能够给的最好的平台与空间，其他靠他们自己即可。
findings:
- name: 武汉水果湖区域人才密度验证
  desc: '[evidence] 作者亲历证据：武汉大学/水果湖区域九十年代中学生集体接触"信息高速公路/硅谷"概念，该群体后续多赴美留学、进入互联网核心赛道，印证"环境决定眼界，眼界决定上限"。'
  excerpt:
  - 我们专门去了一个阶梯教室，有个老师给我们讲了美国的硅谷，那个时候我就知道了信息高速公路这个词，也是让我后来从事的行业，以及去了北美真切感受，再回来创业的一个很大因素。
  - 很多时候，每个人的经历决定了你的未来...水果湖这个地方才是真卧虎藏龙。
- name: 早期计算机教育性别反差观察
  desc: '[claim] 作者观察到八十年代小学/夏令营计算机启蒙教师全为年轻女性，参赛女生更努力但成绩不如提前学过的作者，推测早期计算机教育存在性别化分工现象，但未给出系统性数据支撑。'
  excerpt:
  - 教我们的老师...都是 20 多岁的小姐姐...我不由奇怪，为什么男人为主的计算机行业里，我计算机启蒙老师，竟然为什么都是女的。
  - 参加计算机小组的竟然全是女生，而且学得特别认真，可惜，最多也是获得三等奖
- name: Wise推荐/ChatGPT项目高收益验证
  desc: '[claim] 作者宣称通过Wise推荐项目实现"每天躺赚一万英镑"，ChatGPT相关项目"单人单干月入万刀"，并在社群内部验证获得好评，但未公开具体操作细节、周期及可复制性数据。'
  excerpt:
  - 上个月分享了《通过 Wise 的推荐项目，每天躺赚一万英镑+"也受到了一致好评。
  - 一个新的项目，也是可以一个人单干而且一定可以月入万刀的
