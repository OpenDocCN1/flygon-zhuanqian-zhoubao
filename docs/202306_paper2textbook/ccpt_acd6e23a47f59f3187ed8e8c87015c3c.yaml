paper: docs/202306/20230613_078.md
desc: 该素材为一篇小程序推广计划项目的引流宣传帖，作者温酒宣称通过陪跑项目验证该副业适合新手小白，并输出了一份包含项目现状、天花板分析、基础教程、新手建议及团队组建思考的保姆级教程，旨在帮助新手赚取互联网第一桶金，全文核心内容托管在飞书文档中。
concepts:
- name: 小程序推广计划
  desc: 一种通过推广小程序获取佣金或收益的互联网副业项目，作者称其适合新手小白操作，且老项目亦有新机会。
  is_original: false
  excerpt:
  - 《老项目也有春天，小程序推广计划保姆教程分享》
  - 这个项目适合新手小白
- name: 陪跑模式
  desc: 作者采用的项目验证与教学方式，即亲自带领学员实操两个月，根据数据反馈总结出教程并分享。
  is_original: false
  excerpt:
  - 最近两个月在陪跑小程序推广计划，根据数据反馈
methods:
- name: __overview__
  desc: 素材未直接展示具体操作方法，仅勾勒出教程框架：项目现状分析 -> 天花板与数据收集 -> 基础教程 -> 新手建议 -> 团队组建思考。核心方法论隐于飞书文档链接中。
  excerpt:
  - 1.小程序推广项目的现状 2.小程序推广计划的天花板与数据收集 3.程序推广计划基础教程 4.给新入场的朋友一些建议 5.组建两次团队后的一些思考
theorems:
- name: 新手适用性主张
  desc: '[claim] 作者基于两个月陪跑数据反馈，核心主张该项目适合新手小白，能帮助其实现互联网赚钱从0到1。'
  excerpt:
  - 根据数据反馈，这个项目适合新手小白，过来分享给大家，希望大家都能赚到自己互联网上的第一块钱。
- name: 老项目新机会论
  desc: '[claim] 主张小程序推广计划属于‘老项目’，但目前仍有‘春天’（机会窗口），值得入场。'
  excerpt:
  - 《老项目也有春天，小程序推广计划保姆教程分享》
findings:
- name: 团队组建复盘经验
  desc: '[claim] 作者宣称已组建两次团队，并由此产出了一些思考与经验，作为教程第5部分内容输出。'
  excerpt:
  - 5.组建两次团队后的一些思考
- name: 教程完整性声明
  desc: '[claim] 作者声称飞书文档为‘保姆级教程’，涵盖从基础到进阶的完整知识体系。'
  excerpt:
  - 《老项目也有春天，小程序推广计划保姆教程分享》
