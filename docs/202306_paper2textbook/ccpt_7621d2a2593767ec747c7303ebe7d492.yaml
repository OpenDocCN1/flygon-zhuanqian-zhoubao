paper: docs/202306/20230613_085.md
desc: 该素材为一篇知识星球（生财有术）内部的经验分享帖，作者“高尚坏孩”自述19岁时通过互联网项目实现赚取100万元人民币的经历，旨在回应社群内“考上985难还是赚100万难”的讨论话题，并引导读者跳转至飞书文档查看完整复盘细节。
concepts:
- name: 生财有术星球
  desc: 一个专注于赚钱项目拆解、流量变现及商业认知升级的付费知识星球社群，素材发布及讨论的核心场域。
  is_original: false
  excerpt:
  - 看到星球里有个话题
  - 生财有术，一起进步
- name: 赚100万 vs 考985
  desc: 社群内发起的对比议题，探讨传统学历晋升路径与商业变现路径的难度差异，激发了本文的创作动机。
  is_original: true
  excerpt:
  - 看到星球里有个话题是上 985 难，还是赚 100 万难
methods:
- name: __overview__
  desc: 作者采用‘个人真实经历背书+社群话题引发共鸣+外部长文档详细复盘’的内容分发策略，利用飞书文档承载核心干货，星球帖子作为引流入口。
  excerpt:
  - 仅此文章，回答这个问题
  - 辛苦大家移步飞书 https://zwbfnc29pf1.feishu.cn/docx/FmHpdiE2ooK5kixlEfDc47pPnod
theorems:
- name: 19岁普通人可实现百万收入
  desc: 作者主张通过互联网渠道（具体项目详见飞书文档），19岁这一年龄节点实现赚取100万是可行的，且旨在以此打破‘赚钱难’的固有认知。
  excerpt:
  - 19 岁，我赚了 100 万
  - 仅此文章，回答这个问题，祝大家暴富
findings:
- name: 社群正向反馈与认可
  desc: '[evidence] 评论区成员（任平生、千幻、苏大强等）给予高赞、点赞及‘牛逼’、‘很厉害’、‘真的牛’等正向情绪反馈，表明该经历在目标社群内具备较强的说服力和示范效应。'
  excerpt:
  - '任平生 : 牛逼，一起进步'
  - '千幻 : [强]很厉害'
  - '苏大强 : 真的牛'
