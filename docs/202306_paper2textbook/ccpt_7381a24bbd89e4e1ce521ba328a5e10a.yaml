  excerpt:
  - 0 付费，每天复制粘贴 5 分钟，公众号涨粉 3.7w+，变现 5w+
  - 阅读量最高 10w+，目前平均阅读量 3000+
- name: 新号冷启动验证数据
  desc: '[evidence] 作者称测试了几个新号，均实现了阅读量破千，支撑了‘玩法可复制、新号可做’的论断。'
  excerpt:
