- name: 同行流量主收益对比参考
  desc: '[evidence] 评论区用户‘周彦充’反馈其发一篇文章流量主收益仅20元，侧面印证作者‘平均阅读3000+变现5w+’的单价较高或变现路径更优（含私域转化）。'
