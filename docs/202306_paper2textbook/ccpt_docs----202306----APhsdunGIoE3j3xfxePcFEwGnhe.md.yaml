paper: docs/202306/APhsdunGIoE3j3xfxePcFEwGnhe.md
desc: 该素材由ChatGPT实践者'台风'撰写，系统阐述了ChatGPT角色指令的设计规范（身份、任务、约束‘三板斧’）、调试验收方法（四维测试用例）、使用技巧及‘角色指令生成器’工具应用，旨在降低Prompt
  Engineering门槛，主张中文指令即可高效驾驭模型，助力普通用户成为‘ChatGPT魔法师’。
concepts:
- name: 台风角色指令三板斧
  desc: 素材原创的角色指令设计核心框架，将指令结构标准化为身份设定、任务设定、约束设定三大模块，构成塑造完美角色的黄金三角。
  is_original: true
  excerpt:
  - 我总结了ChatGPT角色指令设定的套路，可以概括为3个设定：身份、任务、约束。它们共同构成了塑造“完美”角色的黄金三角。按江湖规矩起个炫酷的名字，就叫做“台风角色指令三板斧”吧。
- name: 身份设定
  desc: 指令开篇点明角色身份（专家、IP、虚构人物等），并通过知识经验、性格特质、风格形象等维度描述构建丰满人设，是角色指令的‘召唤术’。
  is_original: false
  excerpt:
  - 指令开篇，直接点明角色身份，即可完成角色召唤。角色身份可以是专家顾问、职业人员、IP角色、虚构人物、软件……万物皆可角色扮演。
  - 角色特征主要是包括这几个维度：知识经验、性格特质、风格形象、行为表现、角色背景或关系等等。
- name: 任务设定
  desc: 明确角色职责、回答方式、输出格式，按场景分为人物角色（风格模仿）、内容创作（结构/风格/格式规范）、流程规则（游戏/奖惩机制）三类，是角色指令的‘塑形术’。
  is_original: false
  excerpt:
  - 任务设定的主要目的是，让ChatGPT明确自己的任务职责，规范他回答的方式、格式。根据任务场景可以划分为人物角色、内容创作、流程规则3类。
- name: 约束设定
  desc: 即边界设定，通过负向禁止或正向强制指令，锁定角色不越界、不穿帮、不输出多余解释，是角色指令的‘封印术’。
  is_original: false
  excerpt:
  - 约束设定也可以叫做边界设定，主要目的是为了让ChatGPT沉浸在角色中，无论问什么问题都只能以设定的身份来回答，避免ChatGPT本体觉醒导致穿帮。
- name: 前置角色指令
  desc: 区别于多轮对话‘调教’的单次部署模式，指在会话首条消息或系统提示词中植入指令，后续对话长期生效且不修改。
  is_original: true
  excerpt:
  - 作为chatgpt魔法师，我主攻的场景是前置角色指令。无论是应用接口里封装的前置指令，还是每天聊天会话里首条角色指令消息，发送后均不会修改。
- name: 角色指令生成器
  desc: 素材作者开发的自动化工具（aicosplay.com.cn），利用ChatGPT自身能力根据用户需求一键生成符合‘三板斧’规范的指令草稿，大幅降低创作门槛与耗时。
  is_original: true
  excerpt:
  - 角色指令生成器已经封装成小应用，访问网页aicosplay.com.cn就可以生成自己想要的角色了。
  - 我后面创作的好几个专家小应用的指令，都是用角色指令生成器一键生成的，创作时间也缩短了一半。
methods:
- name: __overview__
  desc: 基于‘三板斧’框架的角色指令全生命周期方法论：设计（身份/任务/约束）→ 调试（四维测试用例+新建会话对比） → 部署（首条消息/系统提示词） →
    自动化生成（生成器辅助）。
  excerpt:
  - 我会跟大家分享我对ChatGPT角色指令的理解和使用心得。编写这份指南的目标，就是让人人都可以轻松成为chatgpt魔法师。
  - 角色指令使用方法很简单，新建一个会话，首条消息先发送角色设定指令...
  - 调试角色指令的过程中，我会构建多条测试用例，来检测指令是否达到预期效果。
- name: 四维测试用例法
  desc: 角色指令调试的标准化验收流程，包含确认身份、常规问题、复杂问题、跨域问题四个维度，要求固定测试问题、失败后新建会话重测以避免上下文污染。
  excerpt:
  - 角色指令的测试用例一般包括以下4个维度。1. 确认身份... 2. 常规问题... 3. 复杂问题... 4. 跨域问题...
  - 同个角色指令的测试问题，最好固定下来，方便修改指令后进行效果对比。
  - 当一轮测试失败，最好是新建会话，重新测试调优后的指令，避免历史对话污染影响判断。
- name: 指令迭代优化闭环
  desc: 测试失败 → 向ChatGPT反问诊断原因 → 修改指令 → 新建会话重测 → 通过验收的标准化迭代流程。
  excerpt:
  - 如果指令效果不理想，你可以直接向ChatGPT求助，询问他为什么不遵循某某设定，应该如何提问表达才能让他遵循某某设定。
  - 当一轮测试失败，最好是新建会话，重新测试调优后的指令...
- name: 生成器辅助创作法
  desc: 输入角色描述+任务细节 → 生成器输出草稿 → 人工微调约束/细节 → 部署测试，将指令创作时间从1小时压缩至半小时内。
  excerpt:
  - 调整了几版后，发现确实牛逼，效果超出预期，身份设定、任务设定部分准确度还可以，稍微修改下就能用。
  - 使用生成器时，尽量增加任务描述，以提高指令质量。约束指令是没有包含在内的，按自己需求添加完善吧。
theorems:
- name: 角色指令显著提升垂直领域回答质量
  desc: ChatGPT作为通用模型，直接提问垂直领域问题易得空泛、生硬、有‘AI味’的回答；角色指令官方支持‘调度’专家模型，是业内公认的必备技能。
  excerpt:
  - ChatGPT是一个通用AI，如果你直接提问垂直领域的问题，或让他进行专业创作，得到的回答通常会显得空泛、生硬，一股AI味，是难以直接拿来使用的。
  - 角色设定指令是ChatGPT官方支持的能力，起到“调度”行业专家模型的作用，可以显著提高答案质量。掌握召唤专家角色的魔法咒语，这是业内公认的ChatGPT必备技能。
- name: 人机关系定位：Boss与员工/助理
  desc: 拒绝‘提示工程师’等抽象称呼，主张人类是AI的主人，向ChatGPT布置任务本质是下达指令，优秀指令应做到‘令行禁止’。
  excerpt:
  - 我的理念是：人类是AI的主人。人类和ChatGPT至少是Boss和员工助理的关系，但凡涉及向ChatGPT布置任务的场景，那实际是向ChatGPT下达指令。
  - 一条优秀的指令，就应该能做到让ChatGPT令行禁止，这也是所有chatgpt魔法师的追求。
- name: 中文指令足以驯服ChatGPT，无需迷信英文Prompt
  desc: 尽管业界有英文指令效果更优的说法，但作者实践证明中文指令同样高效，且更利于普通人上手，坚持中文创作降低门槛。
  excerpt:
  - 网上有种说法：ChatGPT对英文的理解比指中文要强，所以更应该使用英文写指令...恕我无法认同。
  - 想让更多普通人上手ChatGPT，中文指令才是最好的选择。哪怕真的如此：英文指令效果更好，我也只会选择用中文来创作角色指令。我同样有足够的信心用中文“驯服”ChatGPT。
- name: 正视局限：角色指令非万能药
  desc: 角色指令无法解决模型幻觉（胡说八道）、知识截止（2021年9月）、大规模数据定制等底层模型局限，不应过度预期。
  excerpt:
  - 当然我们也要正视它的局限，降低预期。它无法解决拼凑信息胡说八道、数据库只更新到2021年9月等问题，也无法实现大规模的数据定制。
findings:
- name: AI律所案例验证专家角色商业价值
  desc: '[evidence] 作者创建的''AI律所''网页小应用吸引了王小川等行业大佬关注，证明基于角色指令构建的垂直专家应用具备高商业识别度与实用价值。'
  excerpt:
  - 其中AI律所这个网页小应用还吸引了大佬王小川的关注。
- name: 约束指令负向表达易失效，需正向强化或新建会话验证
  desc: '[evidence] AI教育专家案例显示，首轮测试‘禁止回答估分报考’约束失败（模型仍回答），调整表达为正向强制/拒绝机制后，新建会话测试约束生效，揭示负向指令理解难点及上下文污染干扰。'
  excerpt:
  - 1、首轮测试：约束失败，他还是回答了
  - 2、调优测试：约束成功，他拒绝给明确答案
  - 当一轮测试失败，最好是新建会话，重新测试调优后的指令，避免历史对话污染影响判断。
- name: 生成器自动化可覆盖身份/任务设定，约束部分需人工补全
  desc: '[evidence] 实测生成器对身份设定、任务设定准确度高、稍加修改即可用，但约束指令未包含在生成范围内，需用户按需手动添加。'
  excerpt:
  - 效果超出预期，身份设定、任务设定部分准确度还可以，稍微修改下就能用。
  - 约束指令是没有包含在内的，按自己需求添加完善吧。
- name: 上下文污染导致长对话角色偏移，需分会话隔离
  desc: '[claim] 作者主张单会话记忆有限，多轮大篇幅对话后易出现结果偏离指令设定，建议创作不同内容分开会话、偏差大时新建会话重设角色。'
  excerpt:
  - 由于单个会话的记忆长度有限的，需要留意多轮大篇幅的回答后，结果和指令设定是否一致，出现偏差较大的情况，则需要新建一个会话，重新设定角色身份，
  - 如果你要创作不同的内容，最好是分开不同的会话，避免上下文被污染出现结果偏差。
