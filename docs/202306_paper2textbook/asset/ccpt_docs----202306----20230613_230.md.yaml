paper: docs/202306/20230613_230.md
desc: 该素材为一篇小红书平台“探照灯计划”达人报名的实操指南文档，核心主张利用平台红利期（流量扶持、竞争少）的时间窗口通过保姆级教程快速入场变现，属于平台运营红利捕获类实战教程。
concepts:
- name: 探照灯计划
  desc: 小红书官方推出的达人招募/激励计划，处于平台红利期，提供流量扶持，是达人变现的核心载体。
  is_original: false
  excerpt:
  - 小红书探照灯计划是什么？达人如何报名保姆级文档
  - 小红书探照灯计划是什么？
- name: 平台红利期
  desc: 平台早期推广阶段，特征为进场人少、平台给流量扶持、随便上链接就能出单、属于‘捡钱’阶段。
  is_original: false
  excerpt:
  - 任何最好赚钱的机会，都是在平台红利期的时候，而往往这个时候，基本都是在捡钱，随便上个链接就能出单
  - 这个时候，进场的人不多，而且平台要做数据，有流量扶持。
- name: 保姆级文档
  desc: 指详细到可直接照做执行、无需额外思考判断的操作手册，降低新手入场门槛。
  is_original: false
  excerpt:
  - 达人如何报名保姆级文档
methods:
- name: __overview__
  desc: 通过飞书文档形式发布详细图文教程，指导达人完成探照灯计划的报名流程，核心策略为抢占平台红利期窗口。
  excerpt:
  - https://xsej9se9cv.feishu.cn/docx/E994d3QQpovKOOxO7YPc1jGxnXg
theorems:
- name: 红利期先发制人定律
  desc: 最好的赚钱机会存在于平台红利期，此时竞争低、扶持高，执行门槛极低（随便上链接出单），核心竞争力在于‘快’和‘早’。
  excerpt:
  - 任何最好赚钱的机会，都是在平台红利期的时候，而往往这个时候，基本都是在捡钱，随便上个链接就能出单
  - 这个时候，进场的人不多，而且平台要做数据，有流量扶持。
findings:
- name: 文档获取高社群认可
  desc: '[evidence] 该文档发布后获得159赞及多条高质量互动评论（如知乎好物推荐创作者背书、实体老板需求挖掘），验证了‘保姆级教程+红利期赛道’的内容产品市场契合度。'
  excerpt:
  - (精华帖)(159 赞)
  - '评论区：傅超人 : 可以点个赞支持一下哈哈[呲牙] 孙伟悦 : 必须支持这么用心的人 孙金鑫 : 我看过傅老师录得知乎好物推荐的视频，没想到在这遇到了傅老师
    ... 老彭 : 写写写'
