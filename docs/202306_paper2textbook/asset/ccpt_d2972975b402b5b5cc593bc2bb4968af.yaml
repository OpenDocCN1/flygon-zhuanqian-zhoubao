paper: docs/202306/20230613_253.md
desc: 该素材系统阐述了赚钱的五重境界体系：第一重靠体力/智力出卖时间赚钱，第二重靠资产增值与收益赚钱，第三重靠经营人脉、影响力等非标准化资源变现赚钱，第四重靠破解或创建商业规则赚钱，第五重靠概率正预期的运气赚钱。文章核心主张是赚钱本质是认知与资源的跃迁，需警惕负预期赌博，并通过资源积累与规则博弈实现财富自由。
concepts:
- name: 赚钱五重境界
  desc: 作者构建的赚钱层级模型，按核心生产要素依次为：时间（体力/智力）、资产、资源、规则、运气，层级越高越不依赖个人时间投入，抗风险能力越强。
  is_original: true
  excerpt:
  - 第一重境界，靠体力／智力＊时间赚钱。
  - 第二重境界，靠资产赚钱。
  - 第三重境界，靠资源赚钱。
  - 第四重境界，靠规则赚钱。
  - 第五重境界，靠运气赚钱。
- name: 资产
  desc: 具有相对固定交易市场、公允价格、可预期产出回报的生产要素，但面临贬值风险与高维护成本，需甄别优劣。
  is_original: false
  excerpt:
  - 有相对固定的交易市场和交易环境，有相对公允的市场价格，有可预期的产出回报。
  - 资产是否一定能赚钱，这个可不好说。所以才会有优质资产和劣质资产。
  - 房产维护是有成本的...人才本身属于成本很高的资产...存在产出下降和能力折旧的风险。
- name: 资源
  desc: 无固定交易市场与公允价格、不可直接变现、需经营转化的生产要素，核心特征是交换非零和（双方均不失去原有资源且互获增量），主要包括人脉、影响力、特许经营权、情报信息等。
  is_original: true
  excerpt:
  - 资源就复杂一点，可能上面提到的都没有（指资产的三个特征）。
  - 资源交换，你不会失去自己的资源，反而会获得对方的资源，对方也是同理。所谓强者互持...
  - 人脉网络就是资源...影响力也是重要资源...特许经营权、准入牌照...情报也是重要资源。
- name: 规则
  desc: 商业模式与产品策略的本质。分为“规则内生存”（普通大众）与“规则外博弈”（高阶境界），后者包含“破解规则”（如SEO、套利）与“创建规则”（巨头定标准、立平台）两条路径。
  is_original: true
  excerpt:
  - 商业模式就是规则，产品的策略就是规则。
  - 能谈到境界的，一定是跳出规则。
  - 第一种更常见一些...通过破解规则赚钱。第二种就罕见一些，靠创建规则赚钱。
  - 成为规则的制定者，才能完整吃到市场最大的红利。
- name: 概率正预期
  desc: 判断运气型赚钱优劣的核心标准。正预期下的概率游戏（如VC投资组合、赌场策略套利）是合理的财富增长手段；负预期下的运气（如彩票、赌博）虽有小概率暴富，但长期必导致灾难。
  is_original: true
  excerpt:
  - 他们是基于概率正预期去投资...形成的特定条件下的窄幅概率正预期，那么你有了正预期是否代表你能赢钱，不是，但基于正预期下注是被认为合理的追求收益的手段。
  - 凡是基于负预期实现的运气赚钱...往往会导致灾难后果。
methods:
- name: __overview__
  desc: 采用“要素分层+路径对比+认知升维”的分析框架：将赚钱要素拆解为五重境界，对比资产与资源的交易属性差异，剖析规则博弈的破解与创建双路径，确立概率正预期为决策准则，引导读者自我定位并规划跃迁路径。
  excerpt:
  - 第一重境界...第二重境界...第三重境界...第四重境界...第五重境界...
  - 资产交易，你失去了你的资产...资源交换，你不会失去自己的资源...
  - 破解规则...创建规则...
  - 正预期的概率游戏，是获得财富增长的重要手段...负预期的概率游戏...其实是毒药。
- name: 资源积累与交换法
  desc: 主张从早期（读书/职场初期）有意识积累高潜力人脉、影响力、情报等资源；通过“分享-链接-交换”闭环实现资源非零和增值，以低成本撬动高价值商业机会。
  excerpt:
  - 从读书的时候就要有意识积累资源...职场里就更不用说。
  - 你有了影响力，利用影响力，可以建立更广泛的社交人脉，以及获得更多的信息情报...再加上主动的链接和主动的资源交换...
  - 资源交换很多时候是无需成本的。
- name: 规则博弈策略
  desc: 区分“破解规则”（钻现有规则漏洞，如SEO、Cloak、羊毛党套利）与“创建规则”（满足大众需求建立新平台/标准，如搜索竞价、电商平台佣金），指出前者机会窗口窄、对抗性强，后者需解决“凭什么被接受”的价值先行难题。
  excerpt:
  - 所谓破解规则，典型的如 SEO，ASO。机会源于对抗。
  - 创建规则，就是巨头们之所以成功的底气所在，通过满足大众需求，创建一个新的商业形态...
  - 你必须让用户先享受到你带来的价值，才能让他们接受你的规则。
theorems:
- name: 赚钱本质是认知与资源的跃迁
  desc: 个人财富层级取决于核心生产要素从时间、资产、资源、规则到概率的跃迁，核心驱动力是认知升级（识别优质资产、经营资源、洞察规则、理解概率），而非单纯劳动投入。
  excerpt:
  - 各自盘算一下，你靠什么赚钱？
  - 如何甄别和维系优质资产，并获得尽可能稳定的高额回报，并不是那么容易的事情...
  - 资源并不都是私密的，但发现者的视角不同。
  - 成为规则的制定者，才能完整吃到市场最大的红利。
  - 正预期的概率游戏，是获得财富增长的重要手段...切莫沉迷。
- name: 资源交换的非零和特性优于资产交易的零和特性
  desc: 资产交易本质是所有权转移（我失去你获得），资源交换本质是价值共生（双方保留原有资源并互获对方资源），因此资源积累是更高阶、杠杆率更高的财富构建路径。
  excerpt:
  - 资产交易，你失去了你的资产，获得对方的资产。资源交换，你不会失去自己的资源，反而会获得对方的资源，对方也是同理。
  - 所谓强者互持，大家彼此有资源交换的诉求，彼此能够将资源价值最大化。
- name: 负预期运气致富必导致返贫
  desc: 基于负预期（彩票、赌博、拆迁暴富无认知托底）获得的财富，因持有者缺乏匹配的资产管理认知与风控能力，必然在后续概率博弈中归零或陷入骗局，最终返贫。
  excerpt:
  - 美国很多彩票大奖的幸运儿，几年之内就会破产返贫。缺乏对财富的正确认知...对负预期的概率游戏乐此不疲...
  - 很多拆迁户，因为钱来得太容易，认知水平有限，被各种骗局收割...返贫的也大有人在。
findings:
- name: 海外房产投资维护成本被低估
  desc: '[evidence] 作者指出国人投资海外房地产遇到的最大坑是维护成本远高于国内（含房产税、物业费、维修、折旧装修等），导致名义收益率虚高、实则亏损。'
  excerpt:
  - 特别是海外，房产维护的成本远高于国内，这是国人在海外投资房地产遇到的最大的坑。
- name: 人才作为高成本资产面临35岁折旧危机
  desc: '[evidence] 作者将优质人才定义为高成本资产，并实证指出其存在“产出下降和能力折旧”的风险，即行业公认的“35岁危机”是人才资产贬值的典型表现。'
  excerpt:
  - 人才本身属于成本很高的资产...而且也存在产出下降和能力折旧的风险，所谓 35 岁危机怎么来的。
- name: 作者个人影响力变现路径验证资源境界
  desc: '[evidence] 作者以自身20多年写博客、运营社群、建立影响力、转化为知识星球付费收入为例，印证了“影响力->人脉/情报->商业变现”的资源积累闭环。'
  excerpt:
  - 今天我能在这里说这些，那么回溯一下自己，从很久之前，我就喜欢分享，写博客，在社群里活跃，说起来是 20 多年前...这时候，机会就会多...
  - 本文也是赚钱的范例之一，如果有兴趣，可以随时回来看看付费人数，评估一下赚钱效率。
- name: 妻子人脉资源变现微创业案例
  desc: '[evidence] 作者妻子通过积累微信好友5000人、建立多个500人群，后与朋友合作小生意“很容易出单”，印证了社交资源（人脉）可直接转化为商业变现能力。'
  excerpt:
  - 我老婆总想创业...你好友朋友圈满五千人了，你拉几十个 500 人的群了，你想干嘛都成。后来我发现她现在确实好友足够多了，和一些朋友做点小生意果然很容易出单。这就是人脉资源变现的典型范例。
- name: 草根创业者多通过破解规则起家
  desc: '[claim] 作者观察到许多草根创业者通过SEO、ASO、广告投放汇差套利、Cloak技术、羊毛党积分套利等“破解规则”手段闷声发财，而非创建规则。'
  excerpt:
  - 我认识很多草根创业者都是这种，就是通过破解规则赚钱。
  - 前段时间直播里说的广告投放汇差套利，几年前偷摸提过的 cloak 技术...羊毛党的故事更不用说...这个圈子里闷声发财的一直都有。
- name: 美联储被视为商业领域最强规则制定者
  desc: '[claim] 作者主张在商业领域，美联储是目前最牛逼的规则制定者，其制定的货币规则具有全球强制性与最大红利分配权。'
  excerpt:
  - 这个世界上，在商业领域，目前最牛逼的规则制定者是谁？我的答案是美联储。
