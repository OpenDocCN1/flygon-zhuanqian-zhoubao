paper: docs/202306/20230627_023.md
desc: 该素材由饼公子撰写，旨在解决非设计专业人士在使用 Midjourney 进行商业定制设计时“找不到设计思路、不会写提示词”的痛点。核心方法论是“素材库反向提词法”：利用
  Shutterstock 等版权图库网站的专业关键词/标签体系作为设计灵感与提示词素材库，结合“摄影写法”与“工艺品写法”两大结构化提示词范式（含摄影师/设计师、机位/渲染软件、光效、材质等参数），实现从随机出图到可控商业级商品出图的转化。文中通过手提包、珠宝、沙发等实战案例演示了关键词提取、逻辑修正、风格迁移及品牌/设计师组合调用的完整工作流，并提示了
  AI 生成仅限概念图阶段、落地仍需专业配合的边界。
concepts:
- name: 素材库反向提词法
  desc: 核心工作流概念。指非设计专业者不凭空构思提示词，而是利用 Shutterstock 等专业素材网站的成熟关键词/标签体系，搜索目标品类，提取并修正其专业描述词（材质、光影、构图、风格等），直接喂给
    Midjourney 生成商业级图像的方法。
  is_original: true
  excerpt:
  - 如何快速找到设计思路，我们要借助一个叫“shutterstock”的网站，通过在网站上搜索我们想要设计的类别，然后找到关键词，到 MJ 上出图。
  - 把鼠标放在图片上，还会发现图片上会跳出一些“关键词”。点进去看看，往下拉可以看到一整段的“关键词”
  - 这个时候，我们可以把这个关键词复制下来，送到 MJ 里面去看看效果。
- name: 摄影写法范式
  desc: 结构化提示词模板之一。模拟商业摄影流程，通过 ‘商业摄影类型 + 摄影师风格 + 机位角度 + 产品主体细节 + 环境 + 光效’ 六大维度参数组合，生成具有真实摄影质感的商品图。
  is_original: true
  excerpt:
  - 商业摄影/商业美拍+摄影师+机位（从哪个角度拍）+产品主体+环境+光效
  - 摄影师（由 chatGPT 提供）：Hiroshi Nonami... Mitchell Feinberg...
  - 机位：特写、正面、俯视图、仰视图等
  - 光效：自然光、影棚光、色散、衍射等等
- name: 工艺品写法范式
  desc: 结构化提示词模板之二。模拟工业设计/3D渲染流程，通过 ‘设计师风格 + 产品主体 + 渲染软件 + 材质 + 环境 + 光效 + 设计流派’ 七大维度参数组合，生成超越摄影真实感、具有强设计感与工艺表现力的商品概念图。
  is_original: true
  excerpt:
  - 设计师+产品主体+渲染软件+材质+环境+光效+设计流派
  - 工艺品设计大师（由 chatGPT 提供）：Philippe Starck... Tom Dixon...
  - 渲染软件：C4D、Maya、Blender、Unity Engine 等
  - 设计流派：Art Nouveau、Art Deco、Bauhaus、Mid-century Modern、Scandinavian Design、Pop Art
    等
- name: 品牌/设计师组合调用策略
  desc: 进阶提示词策略。在提示词中显式调用知名品牌（如 LV、Hermès）或 ‘著名设计师 + 知名品牌’ 的组合（如 ‘请 Philippe Starck
    设计 Louis Vuitton 的包’)，利用模型对品牌视觉基因与设计师风格的强关联记忆，快速锁定高阶商业美感。
  is_original: true
  excerpt:
  - 除了一些著名的设计师，还可以运用著名的品牌，甚至可以一起用，称之为“请某著名设计师来做某个品牌的产品”
  - 栗子 1：来自著名品牌的产品
  - 栗子 2：来自著名设计师设计的著名品牌产品
  - 注:并不是所有的设计师都会起作用... 侵权问题自行注意。
- name: 关键词逻辑修正原则
  desc: 提示词工程细节原则。指对从素材库复制的原始关键词（常含机翻语病、画面描述与主体描述混淆）进行结构化清洗：剥离无关背景描述、修正语序逻辑、聚焦核心主体属性（材质、颜色、类型），使提示词符合
    MJ 语义理解习惯。
  is_original: true
  excerpt:
  - 可以看出来，直接复制的词，有些许不合逻辑，因为本是机翻的中文，所以我在出图的时候，会对整个关键词的写法进行略微的调整，更符合逻辑
  - 这个时候，想清楚一件事，你的目标是出“手提包”，还是想要留背景。如果是留下背景，那就把关于背景的描述留下... 如果是出和原图类似的“手提包”，那就对包的描述进行修改。
methods:
- name: __overview__
  desc: 非设计专业商业级 Midjourney 出图完整工作流：1. 需求分析（明确品类）；2. 素材库检索（Shutterstock 搜索品类 -> 提取专业关键词/标签）；3.
    关键词清洗（去噪、修正逻辑、聚焦主体/背景）；4. 范式套用（选择‘摄影写法’或‘工艺品写法’填入参数）；5. 进阶强化（注入品牌/设计师组合）；6. 参数设置（V5.1
    + style raw 增强真实感）；7. 迭代优化/垫图辅助。
  excerpt:
  - 一、网站介绍：Shutterstock 搜索 -> 找关键词 -> 复制到 MJ
  - 二、实操讲解：找词 -> 修正逻辑 -> MJ 出图 -> 对比调整
  - 三、商品的 2 种写法：摄影写法公式 / 工艺品写法公式 + 参数表
  - 四、第三种写法：品牌/设计师组合调用
  - 为了让产品更“真实”，选择的都是 V5.1 的 style raw 模型
- name: Shutterstock 关键词挖掘法
  desc: 具体操作方法：进入 Shutterstock -> 浏览/搜索目标品类（如‘手提包’) -> 鼠标悬停图片查看弹出标签 -> 点击详情页拉取完整关键词列表
    -> 切换网页语言为英语获取英文原版关键词 -> 复制关键词段落。
  excerpt:
  - 打开网页... 点击浏览--> 图片--> 找到类别
  - 在搜索栏输入「手提包」
  - 把鼠标放在图片上，还会发现图片上会跳出一些“关键词”
  - 点进去看看，往下拉可以看到一整段的“关键词”
  - 为了省事可以把网页拉到最下面，直接把网页语言改为英语。
- name: 摄影写法参数配置法
  desc: 按公式 ‘Commercial Photography + Photographer + Camera Angle + Product Subject
    + Environment + Lighting’ 填充参数。摄影师从推荐列表选（如 Hiroshi Nonami 擅长细节纹理）；机位选特写/正面/俯视；主体细化至材质、颜色、质感；环境选纯色/场景；光效选影棚光/自然光/色散等。
  excerpt:
  - 商业摄影/商业美拍+摄影师+机位+产品主体+环境+光效
  - 摄影师：Hiroshi Nonami（野波浩）- 日本商业产品摄影师，擅长捕捉产品的细节和纹理...
  - 机位：特写、正面、俯视图、仰视图等
  - 产品主体：包括具体产品名称、材质、质感、类型、颜色等等
  - 光效：自然光、影棚光、色散、衍射等等
- name: 工艺品写法参数配置法
  desc: 按公式 ‘Designer + Product Subject + Render Engine + Material + Environment +
    Lighting + Design Movement’ 填充参数。设计师选 Starck/Rashid/Urquiola 等；渲染软件指定 C4D/Blender
    等风格；材质选金属/宝石/陶瓷等物理属性；设计流派选 Bauhaus/北欧/装饰艺术等风格流派。
  excerpt:
  - 设计师+产品主体+渲染软件+材质+环境+光效+设计流派
  - 工艺品设计大师：Philippe Starck... Tom Dixon...
  - 渲染软件：C4D、Maya、Blender、Unity Engine 等
  - 材质：金属、石头、宝石、纺织品与皮革、陶瓷、玻璃等
  - 设计流派：Art Nouveau、Art Deco、Bauhaus、Mid-century Modern、Scandinavian Design、Pop Art
    等
- name: 品牌/设计师组合注入法
  desc: 在提示词中直接添加品牌名（如 ‘Louis Vuitton bag’）或 ‘Designer X designs for Brand Y’ 结构。利用
    MJ 对品牌视觉语言的强先验知识，或设计师风格与品牌基因的化学反应，快速生成高辨识度商业概念图。需注意版权风险与模型对特定设计师训练程度的不确定性。
  excerpt:
  - 除了一些著名的设计师，还可以运用著名的品牌，甚至可以一起用，称之为“请某著名设计师来做某个品牌的产品”
  - 栗子 1：来自著名品牌的产品
  - 栗子 2：来自著名设计师设计的著名品牌产品
  - 注:并不是所有的设计师都会起作用... 侵权问题自行注意。
theorems:
- name: 非设计师商业出图可行性定理
  desc: 非设计专业人士无需系统学习设计基础，即可通过 ‘外部专业知识库（素材网关键词）+ 结构化提示词范式（摄影/工艺品公式）+ 权威风格迁移（品牌/大师名）’
    的组合拳，绕过审美与专业知识短板，直接产出满足甲方需求的商业级商品概念图。
  excerpt:
  - 现在半路出家再去学习设计基础知识，就有点晚了，难道要眼睁睁的看着单子飞走吗？
  - 今天我就来给大家分享：对于非设计专业的人来说，该怎么快速找到设计的思路以满足甲方的需求，如何快速用 midjourney 做商品出图的思路
- name: 提示词结构化优于自然语言定理
  desc: 在 Midjourney 商品生成任务中，遵循 ‘摄影/工艺品’ 结构化参数公式（显式指定光效、材质、渲染器、机位等）的提示词，显著优于直接使用素材网复制的自然语言段落（含机翻语病、主背景不分），能更精准控制输出的商业质感与主体一致性。
  excerpt:
  - 可以看出来，直接复制的词，有些许不合逻辑... 我在出图的时候，会对整个关键词的写法进行略微的调整，更符合逻辑
  - 我发现出图的果然是和原图的包相差较远... 如果是出和原图类似的“手提包”，那就对包的描述进行修改。
  - 以下是两种常见的写法：... 公式列举
- name: AI 生成定位边界定理
  desc: Midjourney 等生成式 AI 在商业落地中的定位为 ‘概念图/思路图’ 阶段工具，解决 ‘0 到 1’ 的视觉沟通与方案确认；但无法替代 ‘具体落地’
    阶段，后者涉及具体尺寸、材质工艺验证、安全标准、国标合规等，必须依赖工业设计师与工厂的工程化配合。
  excerpt:
  - 顺带牢记，目前在商业应用上，作为概念图、思路图 MJ 效果是非常好的，距离具体落地仍旧离不开工业设计师和工厂的配合。
  - 因为具体的尺寸、材质、安全、是否符合国标等问题需要在实践中摸索。
findings:
- name: Shutterstock 关键词直接喂给 MJ 可生成高质量基础图
  desc: '[evidence] 作者以 ‘环保米色时尚帆布手提袋...’ 为例，直接复制修正后的 Shutterstock 关键词输入 MJ，生成的手提袋图像效果
    ‘很不错’，验证了素材库关键词作为高质量提示词源的有效性。'
  excerpt:
  - 关键词：[图示修正后的英文提示词]
  - 效果很不错吧？好的，这个手提袋其实不是我想要的...
  - '![](img/32d0557294b90100dc6c6b5dc9e7d21e.png)'
- name: 未清洗的素材网关键词包含画面级描述导致主体偏移
  desc: '[evidence] 作者复制 ‘棕色牛皮手提包’ 图片的完整英文关键词（含背景、构图描述）直接进 MJ，生成结果 ‘和原图的包相差较远’，发现原始关键词描述的是整个画面而非单一主体，验证了
    ‘关键词逻辑修正原则’ 的必要性。'
  excerpt:
  - 这里直接是英文的，那就不改写法了... 但是这个关键词的意思并不是完全描述包，而是描述整个画面
  - 我发现出图的果然是和原图的包相差较远。
  - '![](img/3c264979483eaeff3f1fdd6139b3a34b.png)'
- name: 摄影写法与工艺品写法在珠宝品类上均能产出商业级效果但风格迥异
  desc: '[evidence] 同一珠宝需求下，摄影写法（指定摄影师 Mitchell Feinberg、影棚光、特写）输出真实商业大片质感；工艺品写法（指定设计师
    Philippe Starck、C4D 渲染、宝石材质、Art Deco 流派）输出极具设计张力的概念渲染图。两种范式均有效，适用不同商业呈现目的。'
  excerpt:
  - 珠宝设计 摄影写法：关键词 [图示] -> 效果图 [图示]
  - 珠宝设计 工艺品写法：关键词 [图示] -> 效果图 [图示]
  - 为了让产品更“真实”，选择的都是 V5.1 的 style raw 模型
- name: 摄影写法与工艺品写法在沙发品类上均能产出商业级效果但风格迥异
  desc: '[evidence] 沙发案例中，摄影写法（商业摄影 + 正面机位 + 纯色背景 + 自然光）生成真实家居目录感；工艺品写法（Karim Rashid
    + C4D + 纺织材质 + Pop Art 流派）生成高饱和度、强风格化的设计概念图。再次验证双范式通用性与差异化价值。'
  excerpt:
  - 沙发的设计 摄影写法：关键词 [图示] -> 效果图 [图示]
  - 沙发的设计 工艺品写法：关键词 [图示] -> 效果图 [图示]
- name: 品牌名直接调用能强制锁定品牌视觉基因
  desc: '[evidence] ‘栗子 1’ 直接在提示词中使用品牌名（如 Louis Vuitton），生成图像高度还原该品牌标志性花纹、五金、造型语言，证明
    MJ 对头部奢侈品牌视觉特征有极强的先验编码能力。'
  excerpt:
  - 栗子 1：来自著名品牌的产品
  - '![](img/85011befb7baf1fd8fac75b5b0719382.png) ![](img/eeb7824dc421c62efaff330aca3d99ff.png)'
- name: 设计师+品牌组合能产生创新融合风格但存在失效风险
  desc: '[claim] 作者宣称 ‘请某著名设计师来做某个品牌的产品’ 可融合双方风格；[evidence] ‘栗子 2’ 展示了 Philippe Starck
    设计 LV、Zaha Hadid 设计 Hermès 等组合生成的独特融合图像；但作者同时提示 ‘并不是所有的设计师都会起作用’，存在品牌风格过强难变化、或设计师未被充分训练的失效情况。'
  excerpt:
  - 栗子 2：来自著名设计师设计的著名品牌产品
  - '![](img/f1abbfce087d78b7e8b1041944b7844d.png) ![](img/b290370e666e96b1a925ee2277e6d1f2.png)
    ...'
  - 注:并不是所有的设计师都会起作用，一个是有的著名商品效果太强了，难以变化；另一个是有些设计师风格并没有被 MJ 训练。
- name: V5.1 + Style Raw 参数组合显著提升商品真实感
  desc: '[claim] 作者明确指出并实践 ‘为了让产品更“真实”，选择的都是 V5.1 的 style raw 模型’，该参数设置作为全文案例的统一基线，支撑了摄影写法与工艺品写法输出的高质感、低
    AI 感特征。'
  excerpt:
  - 为了让产品更“真实”，选择的都是 V5.1 的 style raw 模型
  - 珠宝设计... 沙发的设计... 栗子 1... 栗子 2... 均使用该设置
