'no': 1
name: Web3 新人入圈实战 —— 从小白到锁定利润的闭环
desc: 本章以生财有术“Web3小航海”计划为教学场景，复盘一位零基础新人如何在BRC20红利期通过结构化学习、低成本试错与铁律执行，在3个月内实现300万利润锁定的全过程，拆解新人捕获新兴赛道红利的可复制路径。
nodes:
- 'no': 1
  name: 为什么普通新人能捕获Web3红利？
  desc: 对比传统认知‘懂技术才能玩Web3’，揭示新赛道早期的核心壁垒是‘信息不对称’而非‘技术门槛’，新人通过社群杠杆实现认知套利的动机。
  role: motivation
  src:
  - paper: docs/202306/20230613_168.md
  - paper: docs/202306/20230613_238.md
- 'no': 2
  name: BRC20生态红利期的窗口特征
  desc: 定义2023年2-5月BRC20基于Ordinals协议发行、工具不完善、头部代币刚上所、高波动高信息不对称的市场窗口期特征。
  role: definition
  src:
  - paper: docs/202306/20230613_168.md
- 'no': 3
  name: Web3小航海计划：社群结构化入圈法
  desc: 拆解‘导师带路+同伴互助+实战打卡’三位一体模式：领航员传授钱包/铸造工具操作、每日复盘打卡、群内共享一手情报（新代币部署、工具更新）、集体规避钓鱼/漏洞风险。
  role: method
  src:
  - paper: docs/202306/20230613_168.md
  - paper: docs/202306/20230613_238.md
- 'no': 4
  name: 叙事驱动的早期布局法
  desc: 方法论：在协议发布初期（3月）基于‘比特币原生资产+同质化代币’强叙事预判，趁工具成熟前抢跑铸造头部代币（ORDI、SATS）或抢占白名单，成本仅为Gas费（几美元至几十美元），获取极低筹码成本。
  role: method
  src:
  - paper: docs/202306/20230613_168.md
- 'no': 5
  name: 轻装上阵·以小博大：仓位与风控纪律
  desc: 核心策略：资金仓位控制在可承受损失范围（轻装上阵），通过早期低成本铸造/空投博取高倍潜力（以小博大），严格执行‘分批卖出锁定本金+利润跟踪止盈’规则，杜绝FOMO追高与钻石手死拿。
  role: method
  src:
  - paper: docs/202306/20230613_168.md
- 'no': 6
  name: 实战复盘：从入圈到锁定300万的完整时间线
  desc: 案例还原：2.7入圈→3月初抢跑铸造ORDI/SATS→4-5月分批止盈兑换稳定币/BTC→5月底锁定300万利润；同期反面教材：群内多名钻石手持有者因未止盈导致数十万美金缩水。
  role: experiment
  src:
  - paper: docs/202306/20230613_168.md
- 'no': 7
  name: 新人捕获新赛道红利的可行性定理
  desc: 证明：Web3新叙事早期存在极高信息不对称，普通新人通过‘付费社群结构化学习+极低成本试错+严格执行纪律’组合拳，无需懂深层技术原理，即可用小额本金博取百倍收益并安全落袋，核心在于‘认知套利’而非‘技术套利’。
  role: proof
  src:
  - paper: docs/202306/20230613_168.md
- 'no': 8
  name: FOMO与钻石手是新赛道最大杀手论
  desc: 证明：新赛道从0到1爆发、上所、FOMO到顶点的完整周期中，最大风险不在于买早买错，而在于卖不掉：上所后FOMO追高或贪婪死拿导致账面暴利归零，生存第一、利润第二。
  role: proof
  src:
  - paper: docs/202306/20230613_168.md
- 'no': 9
  name: 社群杠杆放大个体认知论
  desc: 论证：个体在复杂新兴领域认知边界有限，高质量付费社群通过‘领航员经验沉淀+同伴集体智慧+实时信息流’提供杠杆，将新人学习曲线从‘几年’压缩到‘几周’，在红利窗口关闭前完成‘入圈-实战-变现’闭环。
  role: proof
  src:
  - paper: docs/202306/20230613_168.md
  - paper: docs/202306/20230613_238.md
- 'no': 10
  name: 延伸：Web3Going新手实战营的标准化指导体系
  desc: 作者基于两期小航海教练经验沉淀，创办Web3Going实战营并统筹《从零开始读懂Web3》教材，形成‘系统化教材+社群陪伴教学+实战训练营’三位一体标准化指导体系，两期实战营效果验证了方法论可迁移性。
  role: extension
  src:
  - paper: docs/202306/20230613_238.md
