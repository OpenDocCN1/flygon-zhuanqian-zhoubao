- 'no': 1
  name: 商业认知重构 —— 从“流量狩猎”到“价值深耕”
  desc: 本章旨在打破新手“短平快”的暴富幻觉，建立正确的商业底层逻辑。通过剖析认知变现的边界、长期主义的复利效应以及“选择大于努力”的决策法则，引导读者从底层逻辑上理解互联网商业的本质，避免陷入红海内卷与同质化竞争的陷阱。
  nodes:
  - 'no': 1
    name: 认知变现的边界与陷阱
    desc: 阐述“赚不到认知以外的钱”并非空话，揭示知识付费与副业市场中常见的“收藏家陷阱”与“收割镰刀”，强调认知升级需透过现象看本质，而非单纯积累碎片信息。
    role: motivation
    src:
    - paper: docs/202306/20230613_009.md
    - paper: docs/202306/20230613_074.md
  - 'no': 2
    name: 选择大于努力：蓝海定位与赛道选择
    desc: 引入“蓝海定位方法论”，论证在资源受限条件下，垂直细分、高客单价或价格不透明品类的战略重要性。通过对比红海内卷与蓝海先手，展示选择正确赛道对降低试错成本的决定性作用。
    role: method
    src:
    - paper: docs/202306/20230613_193.md
    - paper: docs/202306/20230613_011.md
  - 'no': 3
    name: 长期主义与社群复利效应
    desc: 从“十年称王”长周期视角出发，论述社群与个人IP的复利属性。强调信任资产、人脉信息池的沉淀价值，以及“好且难”产品背后的长期战略意义，反驳短期套利心态。
    role: theorem
    src:
    - paper: docs/202306/20230613_008.md
  - 'no': 4
    name: 执行力与复盘闭环：从“知道”到“做到”
    desc: 剖析“中等认知陷阱”与行动瘫痪，提出“先完成再完美”与“下场复盘”的核心心法。通过新人从0到1的失败与修正案例，证明执行力是跨越认知鸿沟的唯一桥梁。
    role: experiment
    src:
    - paper: docs/202306/20230613_229.md
    - paper: docs/202306/20230613_016.md
- 'no': 2
  name: 流量获取矩阵 —— 公域算法与私域沉淀的双轮驱动
  desc: 本章系统拆解主流内容平台（小红书、抖音、视频号、公众号）的流量分发机制与获客策略。重点讲解如何利用SEO、热点追涨、矩阵号及AI工具实现低成本冷启动，并建立公域引流至私域的标准化SOP，解决“流量焦虑”与“转化断层”问题。
  nodes:
  - 'no': 1
    name: 小红书：种草决策平台的流量密码
    desc: 深入解析小红书“搜索+推荐”双引擎机制，掌握关键词布局、爆款笔记复刻及“利他引流”策略。通过助听器、本地生活等案例，展示如何通过高客单内容获取精准私域线索。
    role: method
    src:
    - paper: docs/202306/20230613_144.md
    - paper: docs/202306/20230613_052.md
  - 'no': 2
    name: 抖音与视频号：算法红利与同城变现
    desc: 对比抖音“人找货/货找人”与视频号社交推荐机制。重点讲解同城实体店的低粉高变现模型、图文二创带货及无人直播的合规操作，揭示算法推荐下的内容生产与投流策略。
    role: method
    src:
    - paper: docs/202306/20230613_159.md
    - paper: docs/202306/20230627_030.md
    - paper: docs/202306/20230613_063.md
  - 'no': 3
    name: 公众号SEO与矩阵号规模化运营
    desc: 利用微信“搜一搜”热点榜单与关键词布局实现自然流获取，结合“一公户代收50号”等矩阵技巧放大收益。通过AI辅助内容生产（GPT）降低人力成本，实现高频更新与长尾流量捕获。
    role: method
    src:
    - paper: docs/202306/20230613_137.md
    - paper: docs/202306/20230613_131.md
    - paper: docs/202306/20230613_040.md
  - 'no': 4
    name: 私域沉淀与信任构建体系
    desc: 讲解公域流量导入私域的风控合规要点（一卡一机、话术规避），以及朋友圈“非营销感”成交系统与社群运营的心法。强调“信任资产”在私域高客单转化中的核心地位。
    role: method
    src:
    - paper: docs/202306/20230613_035.md
    - paper: docs/202306/20230613_033.md
    - paper: docs/202306/20230613_132.md
- 'no': 3
  name: 产品与服务设计 —— 从选品逻辑到交付体系
  desc: 本章聚焦商业闭环中的“货”与“服务”。涵盖实体/虚拟选品的数据驱动法、知识付费产品的价值包装与定价策略、以及标准化交付SOP的构建。旨在帮助读者设计出高毛利、易复制、抗风险的产品矩阵，实现从“卖产品”向“卖解决方案”的跃迁。
  nodes:
  - 'no': 1
    name: 数据驱动选品：蓝海挖掘与利润模型
    desc: 利用第三方数据工具（如灰豚、蝉小红）进行赛道分级与单品成本核算。通过“价格不透明”、“高复购”、“低退货”三大标准筛选优质SKU，并构建“引流品-利润品-高客单”的产品分层体系。
    role: method
    src:
    - paper: docs/202306/20230613_050.md
    - paper: docs/202306/20230613_062.md
    - paper: docs/202306/20230627_051.md
  - 'no': 2
    name: 知识付费的价值包装与定价策略
    desc: 基于“价值=价格×10倍”的锚点法则，拆解课程/服务的四维价值模型（目标、问题、方案、交付）。通过案例展示如何规避“内容堆砌”误区，利用稀缺性与阶梯涨价机制实现高客单成交。
    role: method
    src:
    - paper: docs/202306/20230613_243.md
    - paper: docs/202306/20230613_073.md
  - 'no': 3
    name: 标准化交付SOP与自动化履约
    desc: 针对服务非标、交付易失控的痛点，设计“周期激励+分层社群+打卡监督”的交付体系。利用RPA、AI工具及ERP系统实现从内容生产到订单履约的全链路自动化，提升人效与利润率。
    role: method
    src:
    - paper: docs/202306/20230613_075.md
    - paper: docs/202306/20230613_154.md
    - paper: docs/202306/20230613_011.md
  - 'no': 4
    name: 线下实体的数字化改造与风控
    desc: 将线上流量逻辑引入线下实体店，涵盖选址人流实测、美团/大众点评权重优化及同城短视频获客。强调“经营落地为1，品牌营销为0”的生存法则，规避盲目扩张与合规风险。
    role: experiment
    src:
    - paper: docs/202306/20230613_068.md
    - paper: docs/202306/20230613_069.md
- 'no': 4
  name: AI赋能与效率杠杆 —— 从“人力密集型”到“技术密集型”
  desc: 本章探索生成式AI（GPT、Midjourney等）在商业实战中的深度应用。不再局限于工具介绍，而是聚焦于如何用AI重构工作流、降低边际成本、实现内容量产与个性化服务。揭示“AI+自动化”如何成为个人与小微企业的核心护城河。
  nodes:
  - 'no': 1
    name: 提示词工程与知识体系构建
    desc: 掌握“问思模”体系与双角色协作法，利用GPT进行深度调研、文案生成与逻辑推演。通过“投喂”高质量数据（如航海手册、行业报告）实现AI认知的垂直化定制。
    role: method
    src:
    - paper: docs/202306/20230613_009.md
    - paper: docs/202306/20230613_134.md
    - paper: docs/202306/20230613_202.md
  - 'no': 2
    name: AI内容量产与多模态生成
    desc: 实战演练利用GPT写爆款爆文、Midjourney生成头像/壁纸、以及AI语音克隆制作有声内容。通过标准化SOP实现“单人管理500账号”或“分钟级出片”的极致效率。
    role: method
    src:
    - paper: docs/202306/20230613_013.md
    - paper: docs/202306/20230613_211.md
    - paper: docs/202306/20230613_209.md
  - 'no': 3
    name: RPA与自动化系统开发
    desc: 介绍如何利用RPA（机器人流程自动化）与Python/易语言解决电商上架、订单处理、数据采集等重复性劳动。通过“程序员打怪”案例，展示技术杠杆如何将90%的机械操作自动化，释放人力聚焦高价值环节。
    role: method
    src:
    - paper: docs/202306/20230613_154.md
    - paper: docs/202306/20230613_011.md
    - paper: docs/202306/20230613_212.md
  - 'no': 4
    name: AI驱动的海外SaaS与工具站机会
    desc: 分析ChatGPT带来的海外工具站（Tools）创业机会，如SEO内容生成、图片转3D等。利用“利基市场+信息差”策略，低成本构建自动化变现闭环，实现“睡后收入”。
    role: extension
    src:
    - paper: docs/202306/20230613_206.md
    - paper: docs/202306/20230613_207.md
- 'no': 5
  name: 团队扩张与组织管理 —— 从“单兵作战”到“平台化复制”
  desc: 本章面向希望规模化的创业者，系统讲解团队从0到1、1到10、10到100的管理跃迁。核心在于解决人才筛选、SOP标准化、利益分配与合规风控问题，构建具备自驱力与抗风险能力的组织体系。
  nodes:
  - 'no': 1
    name: 人才筛选与“白纸”团队培养
    desc: 揭示“重欲望、轻经验”的招聘逻辑，利用标准化SOP快速培养新人。通过“基本盘衍生”与“跟随航海”策略降低用人风险，建立高执行力的运营梯队。
    role: method
    src:
    - paper: docs/202306/20230613_042.md
    - paper: docs/202306/20230613_012.md
  - 'no': 2
    name: 销售模型标准化与四维触达体系
    desc: 将顶尖销售的隐性经验显性化，构建“朋友圈+社群+私聊+客户朋友圈”四维标准化触达SOP。通过标签化管理与数据监控，实现从“个人英雄”到“体系化获客”的转变。
    role: method
    src:
    - paper: docs/202306/20230627_013.md
  - 'no': 3
    name: 合伙人机制与利益分配设计
    desc: 探讨从雇佣制向合伙制/平台化转型的路径，设计“增量利益分配”模型（分红/虚拟股）。通过绑定核心骨干利益，解决规模化扩张中的动力衰减与内部博弈问题。
    role: theorem
    src:
    - paper: docs/202306/20230627_013.md
  - 'no': 4
    name: 组织风控与合规经营
    desc: 强调“合规是生存底线”，涵盖微信/抖音平台风控规避、税务合规、知识产权（商标/专利）及劳动法律风险。通过建立“环境隔离”与“申诉预案”机制，保障业务连续性。
    role: limitation
    src:
    - paper: docs/202306/20230613_035.md
    - paper: docs/202306/20230627_014.md
- 'no': 6
  name: 复盘迭代与战略终局 —— 持续进化的能力
  desc: 本章将学习闭环延伸至战略层面，通过“复盘”与“评估”验证业务假设。不仅关注短期数据，更关注长期竞争优势的构建、赛道红利的衰减周期以及个人商业模式的迭代升级。
  nodes:
  - 'no': 1
    name: 结构化复盘方法论
    desc: 掌握“动机-目标-行动-心态”四维复盘法与“三维归因模型”（素材/投放/商品）。通过对比理想与实际结果，识别系统性偏差，将失败转化为可复用的资产。
    role: method
    src:
    - paper: docs/202306/20230627_011.md
    - paper: docs/202306/20230613_039.md
  - 'no': 2
    name: 红利期判断与赛道迁移
    desc: 识别平台政策变化（如风控升级、流量倾斜）带来的机遇与危机。学习如何在“异常值”中寻找机会（如微信封号潮后的合规工具），以及何时果断止损、切换赛道（如从红海转向蓝海）。
    role: theorem
    src:
    - paper: docs/202306/20230613_035.md
    - paper: docs/202306/20230613_042.md
  - 'no': 3
    name: 商业模式的终局：资源整合与生态构建
    desc: 超越单一项目变现，探讨如何通过社群沉淀人脉与信息，实现“投资蓄水池”战略。最终目标是构建一个自我进化的商业生态，让价值随时间指数级增长。
    role: extension
    src:
    - paper: docs/202306/20230613_008.md
