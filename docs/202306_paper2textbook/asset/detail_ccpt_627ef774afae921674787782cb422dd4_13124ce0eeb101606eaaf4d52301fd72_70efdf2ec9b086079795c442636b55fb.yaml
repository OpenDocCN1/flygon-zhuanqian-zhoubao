units:
- 'no': 1
  name: 闲鱼无货源 —— 让“信息差”变成“定价权”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统开店需要囤货、发物流、管售后，普通人资金和精力都不够'
  - '- 闲鱼天然是二手交易平台，买家对“非标品、非全新”的接受度高，为无货源搬运留下空间'
  - '- 平台供给过剩、同质化严重，单纯做“标品搬运”只能陷入价格战'
  - '**核心定义**'
  - '- 不提前囤货，从拼多多、1688 等上游平台选品上架，卖出后由上游代发，赚取差价'
  - '- 核心资产不是库存，而是“选品判断力 + 信息差优势”'
  - '**关键性质**'
  - '- 零库存、零发货压力，现金流占用小，试错成本低'
  - '- 利润高低不取决于货源稀缺性，而取决于买家能否轻松比价'
  - '- 机械操作占比高，可被工具和 SOP 大幅替代'
  - '**典型例子**'
  - '- 作者“百万先生”从带货主播转型全职闲鱼卖家，通过高客单冷门品类实现月入 2-3 万'
  - '- “攀哥”团队 12000+ 学员用拼多多代发起步，大部分货源至今仍是拼多多'
  - '**边界条件**'
  - '- 平台规则趋严，虚拟商品、出版物等需资质准入'
  - '- 选品若扎入数码 3C 等价格透明红海，违规、退货、资金占用风险叠加'
  - '- 纯人工操作时效率低，需借助批量上架、订单自动同步等工具才能规模化'
  sources:
  - paper: docs/202306/20230613_061.md
    role: origin
  - paper: docs/202306/20230613_062.md
    role: improve
  - paper: docs/202306/20230613_158.md
    role: apply
  excerpts:
  - 闲鱼无货源玩法另辟溪路之【高客单冷门产品玩法】新手小白万字超详细保姆级教程
  - 目前通过闲鱼这个项目给我带来的收入每月稳定在 2-3w 左右
  - 新人小白找货源比较好的几个渠道一个是拼多多（我就是利用拼多多做代发起来的）
  - 团队目前有一多半货源渠道还是拼多多，只有少数货源是对接的厂家，但是不影响我们赚钱
  - 做闲鱼无货源
- 'no': 2
  name: 价格不透明选品法 —— 让买家“无法比价”就是利润护城河
  points:
  - '**为什么需要这个概念？**'
  - '- 标品价格透明，买家随手一搜就能比价，卖家只能压价求生'
  - '- 闲鱼流量虽大，但真正能带来利润的不是曝光，而是成交价与拿货价之间的差额'
  - '- 新人没有品牌背书和供应链优势，需要绕开红海品类寻找议价空间'
  - '**核心定义**'
  - '- 选择客户无法通过常规电商渠道快速比价的非品牌、非标品，如古筝、商用冷柜、便携显示器'
  - '- 具体做法：避开“苹果手机式”的透明价格带，寻找“古筝式”的价格模糊带'
  - '**关键性质**'
  - '- 价格范围带越宽，卖家定价话语权越大'
  - '- 信息差越深，同行越难直接抄袭文案与定价'
  - '- 利润来源从“低价采购”转向“销售端价值感知塑造”'
  - '**典型例子**'
  - '- 售价 420 元的古筝，学员猜测拿货价分布在 50-400 元，几乎无人猜中'
  - '- 全新 iPhone 13 128G 市场价浮动在 100 元以内，价格极度透明'
  - '- 团队成员靠便携显示器一周利润 5000+，且月单量翻倍'
  - '**边界条件**'
  - '- 非标品需要更强的文案能力来建立信任与价值感'
  - '- 品类过冷会导致需求不足，必须用“杂货铺广测”验证真实出单'
  - '- 一旦某种非标品被大规模公开分享，价格不透明优势会被快速削弱'
  sources:
  - paper: docs/202306/20230613_062.md
    role: origin
  - paper: docs/202306/20230613_061.md
    role: improve
  - paper: docs/202306/20230613_234.md
    role: apply
  excerpts:
  - 所以一个选品很好的思路：卖那些价格不透明的产品是一个不错的选择。
  - 大家对比一下古筝这个产品和苹果手机这个产品有个很明显的区别就在于价格是不是透明。
  - 第二种情况就是卖一些非品牌（价格很不透明的东西）比如我上面提到的古筝...这样的产品客户是无法对比价格的
  - 从最开始的一天 100 多到后来每天 1000 多
- 'no': 3
  name: 高客单价杂货铺 —— 用“广撒网测品”代替“赌垂直赛道”
  points:
  - '**为什么需要这个概念？**'
  - '- 新人不清楚自己适合卖什么，一上来就做垂直店铺容易押错方向'
  - '- 很多“垂直店铺教学”本质是数码博主收代理卖货的套路'
  - '- 闲鱼本身是二手属性平台，并不要求店铺垂直'
  - '**核心定义**'
  - '- 新人以杂货铺形式起步，不限品类，但客单价锚定在三位数或四位数以上，通过广撒网测品发现优势品类，后期再选择性向垂直收敛'
  - '**关键性质**'
  - '- 客单价越高，单笔利润越厚，越能覆盖沟通与售后成本'
  - '- 杂货铺的“测品”功能优先于“定位”功能'
  - '- 高价杂货能筛选出“价格不敏感”买家，降低售后纠纷率'
  - '**典型例子**'
  - '- 作者自营店铺 15 天交易额 4.7 万，利润率约 25%'
  - '- 团队成员卖商用冷柜，单店月流水近 100 万'
  - '- 团队成员从拼多多拿货做便携显示器，单月利润持续翻倍'
  - '**边界条件**'
  - '- 杂货铺后期仍要收敛，否则运营效率与专业人设难以建立'
  - '- 高客单价意味着更大的决策成本，主图、文案、信任锚定缺一不可'
  - '- 需要建立数据复盘机制，否则“广撒网”会变成“瞎上架”'
  sources:
  - paper: docs/202306/20230613_062.md
    role: origin
  - paper: docs/202306/20230613_156.md
    role: improve
  excerpts:
  - 新人做闲鱼店铺应该从杂货铺开始做起...一定要做高价杂货，就是客单价在三位数或者四位数以上的客单价
  - 我这个店铺最近 15 天的交易额是 4.7 万，利润率在百分之 25 左右
  - 团队有个小伙伴卖这个卖的很不错，一个月好的时候利润破 6 万单店...目前一个月能卖将近 100 万的交易额
  - 时间久了你会慢慢发现你的店铺某一类的产品出单不错，那么后期你想做垂直可以慢慢向这个类目去靠拢
- 'no': 4
  name: 新人避坑指数 —— 数码 3C 为何是“新手坟场”
  points:
  - '**为什么需要这个概念？**'
  - '- 新手最容易凭直觉选择数码 3C：曝光好、需求大、感觉自己懂'
  - '- 但数码品类恰好同时踩中违规、退货、资金、利润四大陷阱'
  - '- 没有真实行业经验的新人入局，极易账号报废、本金亏损'
  - '**核心定义**'
  - '- 量化新人在数码 3C 品类面临的核心风险体系：账号安全风险、售后风险、资金风险、利润风险'
  - '**关键性质**'
  - '- 平台对数码类目监管严，违规与封号概率远高于普通类目'
  - '- 二手数码退货率常超 50%，还伴随“到手刀”恶意砍价'
  - '- 价格透明导致利润薄，却被占用大量垫付资金'
  - '**典型例子**'
  - '- 学员卖 iPad，一开始出单很猛，后来三个账号全部永久封号'
  - '- 学员卖数码相机和二手手机，25 天违规 17 条、退货率超 50%'
  - '- 学员卖华强北数码，一个账号违规七八条，另一个直接封号'
  - '**边界条件**'
  - '- 有行业背景、稳定货源、售后能力的成熟卖家仍可做数码'
  - '- 新人若执意尝试，必须控制单账号风险，不能 all in'
  - '- 此处的“数码”主要指手机、平板、相机等高价值标品，不含电脑配件等非标细分'
  sources:
  - paper: docs/202306/20230613_062.md
    role: origin
  excerpts:
  - 新人尽量不要去碰数码产品...容易违规，封号，售后率高，利润率低，垫付资金也不小。
  - 这个小伙伴闲鱼上卖 ipad 的一开始出单很猛，后来三个账号全部永久封号了。
  - 这个小伙伴在闲鱼上数码相机和二手手机的，退货率超过 50%，而且操作了 25 天违规记录 17 条。
  - 这个小伙伴在闲鱼上卖华强北的数码产品，一个账号违规了七八条，还有一个账号直接封号了。
- 'no': 5
  name: 货源反向整合法则 —— 让“厂家主动上门”的供应链逻辑
  points:
  - '**为什么需要这个概念？**'
  - '- 新人总以为“找到好厂家=拿到好价格”，于是盲目找厂，结果处处碰壁'
  - '- 厂家让利的前提是订单量，而新人既无订单量也无囤货资金'
  - '- 供应链话语权不是谈出来的，是销量堆出来的'
  - '**核心定义**'
  - '- 初期依托拼多多等平台代发零成本试错，跑通销售闭环、积累稳定单量后，厂家会因规模主动上门提供独家供给价与售后权益'
  - '**关键性质**'
  - '- 先有销售规模，后有供应链议价权'
  - '- 拼多多代发是新人阶段最可行、最灵活的货源渠道'
  - '- 反向整合法则让“无货源”与“厂家直供”不是对立，而是先后关系'
  - '**典型例子**'
  - '- 作者团队在很小的时候从没想过对接厂家，随着团队扩大，大量厂家主动来谈价格优势与售后服务'
  - '- 商用冷柜、便携显示器等爆款最初都是从拼多多拿货，销量起来后才反向谈厂家合作'
  - '**边界条件**'
  - '- 规模化后仍需保留拼多多等多元化货源，避免单一渠道断供'
  - '- 反向整合的前提是持续上新与测品能力，不能只守着老爆款'
  - '- 与厂家合作必须签订明确的价格、售后与供货稳定性条款'
  sources:
  - paper: docs/202306/20230613_062.md
    role: origin
  - paper: docs/202306/20230613_158.md
    role: improve
  excerpts:
  - 你一个小白一没有订单数量，二没有囤货资金，所以新人小白不要妄想去对接到有价格优势的货源。
  - 很多厂家会主动来找我们谈并且我们可以拿到一个不错的价格优势以及售后服务。
  - 这个货源实际上我们一开始都是从拼多多拿货的...今年 3 月份的时候开始推广起来这个货源。
  - 新人小白找货源比较好的几个渠道一个是拼多多（我就是利用拼多多做代发起来的）
- 'no': 6
  name: 账号养号 —— 用“模拟真人”换“初始权重”
  points:
  - '**为什么需要这个概念？**'
  - '- 新号直接发布商品，系统无法判断是否为营销号，初始曝光极低'
  - '- 闲鱼风控会监控频繁切换账号、新设备、异常作息等机器特征'
  - '- 没有权重基础的账号，再好的选品也难获得流量'
  - '**核心定义**'
  - '- 新注册或低权重账号通过模拟真实用户行为，提升账号信用分与权重，降低发布违规风险、提高商品曝光的前置操作过程'
  - '**关键性质**'
  - '- 核心在于“像真人”：固定时间、固定行为、稳定环境'
  - '- 芝麻信用授权对信用分和买家信任有显著正向作用'
  - '- 养号周期通常 3-7 天，未达标前不宜大量发布商品'
  - '**典型例子**'
  - '- 新号注册后先完成实名认证、芝麻信用授权、资料完善'
  - '- 每日固定花 30 分钟浏览同行商品、点赞、评论目标品类内容'
  - '- 避免频繁切换账号和 IP，降低关联风险'
  - '**边界条件**'
  - '- 养号不是玄学，不能替代选品和运营能力'
  - '- 平台规则持续更新，旧“养号技巧”可能随时失效'
  - '- 账号权重只能降低门槛，不能保证爆单'
  sources:
  - paper: docs/202306/20230613_158.md
    role: origin
  excerpts:
  - 3.1 养号
  - 曾学习了视频号、小红书爆款笔记、直播切片、红包封面、问卷调查、京东带货短视频等等……
  - 从迷茫犹豫到现在改变这个状态的几个感悟以及现在在做的项目成绩
- 'no': 7
  name: 选品测款四步法 —— 用“48 小时数据复盘”淘汰无效 SKU
  points:
  - '**为什么需要这个概念？**'
  - '- 凭感觉选品，上架后既不知道好不好卖，也不知道该优化哪里'
  - '- 闲鱼流量是动态分配的，需要用数据判断“品”与“链接”的真实潜力'
  - '- 新手最缺的不是选品数量，而是选品的筛选与淘汰机制'
  - '**核心定义**'
  - '- 通过多源挖掘、硬指标筛选、差异化上架测试、48 小时数据复盘四个步骤，建立低成本试错—高标准留存的选品闭环'
  - '**关键性质**'
  - '- 硬指标包括：近 30 天成交 >50 单、同款在售 <20 家、利润 >15 元或利润率 >20%、非强管控品牌'
  - '- 复盘指标包括：曝光 <100 下架、想要 >5 或询单 >2 则优化留存'
  - '- 每日上新 3-5 款，持续滚动才能扩大命中概率'
  - '**典型例子**'
  - '- 从闲鱼热搜、拼多多百亿补贴、1688 新品、竞品主页畅销款中挖掘候选品'
  - '- 上架后 48 小时内观察曝光与想要数，快速决定弃留'
  - '**边界条件**'
  - '- 数据复盘需要耐心，1 天测品容易误判'
  - '- 测品数量与出单概率正相关，人工采集有瓶颈时需引入工具'
  - '- 硬指标会随平台竞争变化，需定期校准'
  sources:
  - paper: docs/202306/20230613_158.md
    role: origin
  excerpts:
  - 3.2 整体操作流程
  - 详细内容请移步飞书：https://cxf1s7tdub.feishu.cn/docx/VFwTdYT25oHECPxsoVbcf05in3c
- 'no': 8
  name: 主图留白法则 —— 让“第一眼”成为点击理由
  points:
  - '**为什么需要这个概念？**'
  - '- 闲鱼买家在信息流中快速滑动，主图决定是否点进详情'
  - '- 新手常把画面填满产品图，以为信息越多越好，结果反而没有视觉焦点'
  - '- 商品同质化严重时，主图是唯一的差异化入口'
  - '**核心定义**'
  - '- 通过留白构图、展示最佳面、合集全貌、堆头实力四种范式，打造“规规矩矩、整整齐齐、耐看顺眼”的主图视觉锤'
  - '**关键性质**'
  - '- 一张图全是特点，等于没有特点'
  - '- 主图负责吸引点击，副图和文案负责促成转化'
  - '- 合集拍全家福、杂货铺拍堆头，本质是传递“体量与实力”'
  - '**典型例子**'
  - '- 卖单本书时，主图优先展示有插画和大标题的正面封面'
  - '- 卖合集书时，把 3 本书都拍进画面，体现合集特点'
  - '- 做杂货铺时，用大量书籍堆积的实拍图传递“有实力、价格便宜”'
  - '**边界条件**'
  - '- 留白不等于空洞，核心卖点仍需突出'
  - '- 不同品类的最优构图不同，需参考同品类爆款迭代'
  - '- 主图优化后必须配合点击率数据判断效果'
  sources:
  - paper: docs/202306/20230613_156.md
    role: origin
  excerpts:
  - 主图是买家的第一印象，在闲鱼，一张好主图决定买家的点击数量，决定这条链接的出单数量
  - 一张图，全是特点，那这张图就没有特点了
  - 主图一定要把这本书最具吸引点的地方充分展现出来
  - 规规矩矩，整整齐齐，非常的耐看，非常的顺眼
- 'no': 9
  name: 闲鱼币折扣遮挡销量 —— 给冷启动链接穿上“遮羞布”
  points:
  - '**为什么需要这个概念？**'
  - '- 买家有从众心理，销量低的新链接容易被直接划走'
  - '- 但任何爆款都要经历从 0 到 1 的冷启动期，低销量是暂时的劣势'
  - '- 平台功能中“闲鱼币折扣”恰好能在 UI 上遮挡“想要数”，为冷启动争取点击机会'
  - '**核心定义**'
  - '- 利用闲鱼币折扣标签物理遮挡“想要数”的机制，在冷启动期隐藏低销量；链接积累几百单后再取消折扣，把高销量作为从众心理的正面资产展示'
  - '**关键性质**'
  - '- 销量显示是一把双刃剑：高销量促单，低销量劝退'
  - '- 遮挡是物理层操作，不篡改数据，合规风险低'
  - '- 取消折扣的时机比是否开启更重要'
  - '**典型例子**'
  - '- 新发布的二手书链接开启闲鱼币折扣，买家只能看到折扣标签而看不到个位数的“想要数”'
  - '- 等到链接卖到几百单，关闭折扣，让“想要数”成为爆款证明'
  - '**边界条件**'
  - '- 闲鱼平台若调整 UI 或折扣功能，此策略可能失效'
  - '- 遮挡销量只是权宜之计，核心仍要靠主图、标题、文案提高点击'
  - '- 不能在所有链接上长期开启折扣，否则会被平台判定为低价引流'
  sources:
  - paper: docs/202306/20230613_156.md
    role: origin
  excerpts:
  - 闲鱼币折扣可以把你的想要数给盖住
  - 在你刚发布书籍销量少的时候，你用闲鱼币抵扣把想要数盖住，把缺点盖住，买家就不会根据销量把你 pass 掉
  - 啥时候取消？在你这条链接卖起来的时候，有几百个销量了，这就是优点了，再把闲鱼币折扣取消掉，把优点展示出来，利用买家从众心理
  - 下面这张主图 想要数是 1264 个 浏览数是 8873 个， 是一个爆款链接了...但大家可以发现，看不到他的想要数！
- 'no': 10
  name: 出手理由信任锚定 —— 用“场景真实感”消除二手信任顾虑
  points:
  - '**为什么需要这个概念？**'
  - '- 闲鱼买家对二手商品的来源、成色、可靠性天然存疑'
  - '- 通用促销话术“清仓大甩卖”无法回答“为什么卖”这一关键问题'
  - '- 没有信任，就没有点击、询单和成交'
  - '**核心定义**'
  - '- 在文案开头设置真实或特定场景化的“出手理由”，如实体店撤股周转、航海实操练手，用场景真实感替代促销话术，建立信任锚'
  - '**关键性质**'
  - '- 出手理由回答的是“为什么卖”，而不是“东西多好”'
  - '- 越具体、越反商业化的理由，信任感越强'
  - '- 同一种商品，换一种表达就能换一种转化结果'
  - '**典型例子**'
  - '- “实体店合伙人撤股，经营不下去了，需要资金周转，部分书籍低价忍痛亏本处理”'
  - '- “我是参加生财有术二手书航海的，教练带我们赚钱，你下单后我从孔夫子或拼多多填上你的地址发货”'
  - '**边界条件**'
  - '- 理由必须与商品属性匹配，生搬硬套会显得虚假'
  - '- 不能频繁用同一理由，否则老买家会失去信任'
  - '- 出手理由解决信任，但不替代主图吸引力和价格合理性'
  sources:
  - paper: docs/202306/20230613_156.md
    role: origin
  excerpts:
  - 可以在标题下，文案开头写上出手理由
  - 举例 1：实体店合伙人撤股，经营不下去了，需要资金周转，部分书籍低价忍痛亏本处理
  - 举例 2：我是参加的生财有术的二手书航海，教练带我们赚钱，你下单了我从孔夫子或者拼多多填上你的地址给你下单发货
  - 同样卖东西，不一样的表达，不一样的效果
- 'no': 11
  name: 合规低价引流 —— 用“双规格”在违规边缘安全钓鱼
  points:
  - '**为什么需要这个概念？**'
  - '- 低价是闲鱼最强引流手段，但直接标不相关低价会被判违规'
  - '- 新人往往只知道“低价引流”的威力，不知道平台规则的红线'
  - '- 需要一种既能吃到低价流量、又不触发判定的结构化定价方案'
  - '**核心定义**'
  - '- 通过设置“精装/简装”双规格标最低价，或“低商品价+高运费”组合，在不触发平台违规判定的前提下吸引流量，再用文案引导购买高客单规格'
  - '**关键性质**'
  - '- 本质是“价格分层”，而非“价格造假”'
  - '- 流量入口可以低，利润出口不能低'
  - '- 低价引来的部分非精准买家，需要靠文案二次筛选'
  - '**典型例子**'
  - '- 二手书设置“简装版”低价引流，详情文案中说明“精装版”更适合收藏，引导买家拍高价规格'
  - '- 商品标价 9.9 元，运费设置 20 元，综合到手价略低于市场价但仍有利润'
  - '**边界条件**'
  - '- 低价引流会降低店铺调性，需平衡使用频率'
  - '- 平台对“高价运费”的容忍度经常变化，需随时关注规则'
  - '- 低价规格必须真实存在，否则构成虚假宣传'
  sources:
  - paper: docs/202306/20230613_156.md
    role: origin
  excerpts:
  - 价格是一把刀，比技巧更实在
  - 不能直接标不相关的低价，不然会被判违规
  - 可以文案中写精装和简装两款规格，标价标最低简装的，这样就不会违规
  - 或者标的价，设置运费
- 'no': 12
  name: 地域流量套利 —— 把发货地变成“流量放大器”
  points:
  - '**为什么需要这个概念？**'
  - '- 闲鱼流量分发与地域人口规模正相关，大城市天然获得更多曝光'
  - '- 新手容易忽略‘地区’字段，随手填一个偏远发货地，白白损失流量'
  - '- 在保证物流时效的前提下，地域选择是零成本的流量优化'
  - '**核心定义**'
  - '- 利用闲鱼流量分发倾向人口密集大城市的机制，在保证发货速度的前提下，将发布地区设置为发货仓附近的大城市，获取更大基数的曝光'
  - '**关键性质**'
  - '- 地区影响的是“初始流量池大小”，而非商品质量评分'
  - '- 大城市竞争也更激烈，需配合主图与标题差异化'
  - '- 跨境不支持、偏远不发货的商家需先确认物流能力'
  - '**典型例子**'
  - '- 发货仓在广州的卖家，发布地区选择广州、深圳等一线城市，而非仓库所在地的地级市'
  - '- 做二手书杂货铺的卖家，将地区设为上海，获得比三线城市更高的基础曝光'
  - '**边界条件**'
  - '- 不能为了流量设置虚假异地，导致买家收不到货'
  - '- 一线城市竞争激烈，冷门品和标品的收益可能不同'
  - '- 地区套利只是流量维度之一，无法弥补主图和选品缺陷'
  sources:
  - paper: docs/202306/20230613_156.md
    role: origin
  excerpts:
  - 人口多的大城市，获取的流量更多
  - 建议发布到发货地附近的大城市，流量的同时可以保证发货速度
- 'no': 13
  name: 趋势信号捕捉 —— 盯住 KOL 风向标，先人一步进“小蓝海”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通卖家困在红海品类里拼价格，很难突破利润上限'
  - '- 宏观消费趋势一旦形成，会从头部 KOL 向大众扩散，先捕捉者吃到最大红利'
  - '- 存量能力长期无起色，往往不是能力问题，而是缺少增量趋势载体'
  - '**核心定义**'
  - '- 关注核心意见领袖发布的宏观经济与消费趋势研判，将其作为选品方向的先导指标，并把已有通用运营能力快速嫁接到高热度垂直品类上'
  - '**关键性质**'
  - '- 趋势信号先行于大众认知，越早捕捉，竞争越小'
  - '- 信号本身不值钱，快速执行与模式复用才值钱'
  - '- 垂直聚焦让“泛能力”找到“精准战场”'
  - '**典型例子**'
  - '- 作者捕捉到亦仁发布的“露营经济风向标”，将闲鱼无货源模式聚焦露营装备，从日入 100 多元增长到日入 1000+、峰值 4000+'
  - '- 一整年通过该项目变现近 20 万，稳定月入 1.5 万+'
  - '**边界条件**'
  - '- 趋势有季节性，露营品类只在春夏最赚钱，需提前备货与布局'
  - '- 风向标公开后常快速红海化，48-72 小时后就可能价格战'
  - '- 捕捉趋势仍需回归基础运营能力，不能只靠“追热点”'
  sources:
