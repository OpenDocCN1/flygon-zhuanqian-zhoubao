- 'no': 21
  name: 虚拟商品合规红线 —— 用“资质前置”替代“技术绕行”
  points:
  - '**为什么需要这个概念？**'
  - '- 图书、虚拟资料等品类利润高、交付轻，容易吸引新人尝试'
  - '- 为了规避资格证要求，有人开发“Word 生成条形码扫码上架”等旁门左道'
  - '- 平台对虚拟类商品打击力度大，绕过资质看似聪明，实则高风险'
  - '**核心定义**'
  - '- 在闲鱼销售出版物和虚拟商品前，必须办理相应资质许可；任何技术手段规避资质的行为，都属于平台严打的高风险违规，长期不可行'
  - '**关键性质**'
  - '- 合规成本远低于翻车成本'
  - '- 虚拟商品“打击大”不仅指封链接，还可能影响账号主体信用'
  - '- 技术上暂时通过不等于持续安全，平台规则随时收紧'
  - '**典型例子**'
  - '- 作者办理出版物经营许可证，作为闲鱼卖书的前置合规动作'
  - '- 评论区有人分享 Word 生成条形码扫码上架技巧，作者判定“主要违规，闲鱼对虚拟打击比较大”'
  - '**边界条件**'
  - '- 不同类目资质要求不同，需按平台最新规则核查'
  - '- 灰色技巧即使短期可用，也无法作为稳定商业模式'
  - '- 规模化经营前必须完成营业执照、经营许可等合规建设'
  sources:
  - paper: docs/202306/20230613_116.md
    role: origin
  - paper: docs/202306/20230613_157.md
    role: improve
  excerpts:
  - 主要是违规，闲鱼对于虚拟打击比较大
  - 可以用 word 生成图书条形码，然后扫码上架闲鱼，不用办资格证能通过。
  - 隔天就马上下单申请出版物许可证，目前也快要下来了
- 'no': 22
  name: 副业正反馈飞轮 —— 让“第一块钱”撬动长期行动力
  points:
  - '**为什么需要这个概念？**'
  - '- 新手做副业最大的敌人不是方法不对，而是没有正反馈'
  - '- 学了多个项目却拿不到结果，会陷入自我怀疑和“知行分离”'
  - '- 微小但真实的正反馈能重塑心态，驱动持续行动'
  - '**核心定义**'
  - '- 个体在项目执行中获得可见的正向结果，如首单、日出单、利润达标，从而强化信心、修正认知、持续投入精力的正向心理与行为强化机制'
  - '**关键性质**'
  - '- 正反馈的门槛越低，启动越快；金额不一定要大，真实即可'
  - '- 正反馈直接作用于“心态”，是新手从迷茫走向稳定的转折点'
  - '- 正反馈可以通过拆分目标人工制造，如“赚回学费”“跑通首单”'
  - '**典型例子**'
  - '- 作者此前学习视频号、小红书、直播切片等多个项目均无正反馈，陷入迷茫'
  - '- 聚焦闲鱼无货源后，通过第一个订单和稳定出单重建信心，2 个月跑通 SOP'
  - '**边界条件**'
  - '- 正反馈不能靠虚假数据自我欺骗，必须来自真实成交'
  - '- 正反馈后仍需保持复盘习惯，避免盲目自信'
  - '- 正反馈周期过长时，需要主动更换切入点或求助社群'
  sources:
  - paper: docs/202306/20230613_158.md
    role: origin
  excerpts:
  - 曾学习了视频号、小红书爆款笔记、直播切片、红包封面、问卷调查、京东带货短视频等等……
  - 可是由于个人原因都没有拿到正反馈，其实不是项目的原因，是人的原因。
  - 从迷茫犹豫到现在改变这个状态的几个感悟以及现在在做的项目成绩
  - 这 2 个月的一点心得和成绩
