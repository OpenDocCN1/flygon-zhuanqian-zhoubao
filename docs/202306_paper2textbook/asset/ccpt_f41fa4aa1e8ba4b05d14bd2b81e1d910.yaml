paper: docs/202306/20230613_113.md
desc: 该素材是一篇面向剪辑新手的入门指南，作者星空基于生财有术社区奇杰大佬的《单人日产200条实战攻略》进阶方法论，提炼并整理出一套'5分钟快速上手'的短视频混剪带货操作流程，旨在降低新手操作门槛，并提供了飞书文档作为详细图文教程的载体，同时推荐了抖音楠哥、王松傲寒、张暴撕及B站影视飓风等外部学习资源。
concepts:
- name: 短视频混剪带货
  desc: 作者自述的业务模式，指通过剪辑拼接多段视频素材制作成新视频，挂载小黄车/小店链接实现商品销售变现的模式。
  is_original: false
  excerpt:
  - 我自己是做短视频混剪带货的
- name: 批量思维
  desc: 源自奇杰大佬进阶攻略的核心理念，强调通过标准化流程（SOP）实现单人日产视频200条的高效率生产模式，而非单条精细化打磨。
  is_original: false
  excerpt:
  - 单人日产 200 条之‘批量思维’
- name: 新人友好型SOP
  desc: 本素材的核心定位概念，指将进阶级的‘批量思维’降维打击，转化为零基础小白‘5分钟完全搞定、对照实操几遍即可上手’的标准化操作手册。
  is_original: true
  excerpt:
  - 整理篇对于新人友好能学会、上手难度低的帖子
  - 基本 5 分钟完全搞定。对照着实操几遍，自然越来越丝滑
methods:
- name: __overview__
  desc: 素材整体方法论：以奇杰‘批量思维’进阶攻略为理论源头，通过‘降维拆解’与‘工具载体固化（飞书文档）’两大步骤，输出面向小白的‘5分钟上手’混剪实操SOP。
  excerpt:
  - 感谢鱼丸小姐姐的信息@鱼丸。 先贴出奇杰大佬的帖子... 今天我就开始实操拆解啦。
  - 文档的文字内容不多，就是图片有点多，敬请移步飞书文档
- name: 飞书文档教程载体法
  desc: 利用飞书文档承载大量图文步骤，解决语雀平台图片展示及链接跳转不便的问题，作为核心教学交付物。
  excerpt:
  - 敬请移步飞书文档 https://betteridea.feishu.cn/docx/H0yedmj1QoEPPfxSLSCcED7xnZb
  - 文档的文字内容不多，就是图片有点多
theorems:
- name: 进阶方法论可降维为新手入门标准
  desc: 核心主张：高阶玩家（奇杰）的‘单人日产200条’批量思维体系，经过实操拆解与文档化沉淀，可转化为新手‘5分钟上手、效率提升20倍’的可执行标准流程。
  excerpt:
  - 对我而言，真的至少效率提升 20 倍，我现在每天快的话也就 10 条视频。
  - 如果是剪辑新手，可以先从我的这篇文档入手，基本 5 分钟完全搞定。
- name: 社群信息筛选与二次加工的复利价值
  desc: 核心主张：在付费社群（生财有术）中，通过‘航海’机制发现需求，筛选高价值信息（奇杰帖子），经个人实操验证后二次加工输出，能形成高传播、高赞誉的优质内容资产。
  excerpt:
  - 生财流传着一句话“越分享，越幸运”，我真的就获得了一条十分有启发的信息——奇杰大佬的帖子。
  - (98 赞)小白友好向：5 分钟快速上手视频剪辑
findings:
- name: 作者个人效率验证数据
  desc: '[claim] 作者宣称采用奇杰方法论后，个人剪辑效率提升至少20倍，日产量从极低水平提升至‘快的话也就10条’。'
  excerpt:
  - 对我而言，真的至少效率提升 20 倍，我现在每天快的话也就 10 条视频。
- name: 社群推荐学习资源清单
  desc: '[evidence] 素材评论区沉淀出的外部学习路径：抖音搜索‘楠哥的课’、‘王松傲寒’、‘张暴撕’；B站搜索‘影视飓风’，被社群公认为剪辑入门的优质师资库。'
  excerpt:
  - 抖音，楠哥的课，王松傲寒，张暴撕。B 站一搜一堆，影视飓风
- name: 飞书链接在语雀平台的兼容性问题
  desc: '[evidence] 实际传播中发现飞书文档链接在语雀/微信生态中无法直接跳转，需手动复制至浏览器打开，且需确认文档权限设置为‘可阅读’。'
  excerpt:
  - '周彦充 : 飞书链接，打不开，不是链接形式'
  - '星空 : 抱歉抱歉，阅读权限是打开的，可能需要手动复制到浏览器啦'
