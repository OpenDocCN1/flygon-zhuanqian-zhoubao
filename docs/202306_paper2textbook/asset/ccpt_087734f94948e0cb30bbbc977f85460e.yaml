paper: docs/202306/I8QLdxyXYoJWBOxaQSbczLY5nOc.md
desc: 该素材为一篇资深从业者关于Google Cash（Media Buy/联盟营销）行业的实战复盘与深度思考。作者对比了国内项目（社交电商、短视频等）的高波动、短生命周期与Google
  Cash的长周期、高ROI、相对低竞争特性，详细拆解了Google Cash通过Google Ads购买品牌词精准流量、导流至返利网/联盟网赚取佣金的核心赚钱逻辑与数学模型，并系统梳理了品牌词投放合规风险、Offer测试成本、账号申请门槛、资金回款周期（90天）及境外收款渠道等核心风险点，最终提出了基于行业容量、发展广度、延伸性判断项目是否值得深耕的决策框架。
concepts:
- name: Google Cash / Media Buy (MB)
  desc: 指通过Google Ads等平台购买精准流量（主要为品牌词搜索流量），导流至联盟网络或返利网站推广Offer，赚取销售佣金差价的商业模式。核心特征为：依赖海外搜索引擎流量、品牌词高转化、高ROI（常超10:1）、美元结算、长周期稳定。
  is_original: false
  excerpt:
  - MediaBuy，字面意思翻译过来，就是【媒体购买】。简单来说，就是我们通过向Google购买精准流量，来实现变现。
  - 这个行业，玩法很多，有“浅水区”也有“深水区”，无论是横向还是纵向，发展方向都非常多，一年赚个七位数对大佬们而言也是轻松+愉快的
- name: 品牌词投放
  desc: 针对特定品牌名称（如Skechers）作为关键词在Google Ads投放广告。因用户搜索品牌词具有极强购买意图，转化率极高，是Google Cash的核心流量来源，但通常违反广告主/联盟平台政策，属灰色操作区。
  is_original: false
  excerpt:
  - 广告主其实不允许你在Google Ads里面投放他们的品牌词，而所有的推广者都知道，品牌词的搜索量才是最高的，产出的收益才是最吓人的
  - 老外购物...会通过浏览器搜索...来进行对应品牌的搜索，并且这部分用户，都是我们所说的“精准用户”
- name: 返利网/联盟网 Offer
  desc: 提供商品推广链接并按销售额返佣的平台（如Rakuten）。返利网面向消费者返现，联盟网面向推广者分佣。选择稳定、高佣金、宽松政策的Offer是盈利关键。
  is_original: false
  excerpt:
  - 像Skechers这样的一个品牌，在很多返利网、网盟上面都有offer，比如在Rakuten的返利网上面。我们可以看到，目前Skechers的返利为“6%
    Cash Back”。
  - 找到稳定的网盟、返利网，跑稳定的offer就非常重要了
- name: 项目深耕决策三维标准
  desc: 作者基于过往跨项目失败经验总结的项目筛选框架：①行业容量与抗卷能力；②横向/纵向发展广度；③向外延伸带来持续稳定收益与正向影响的能力。用于判断是否All-in某赛道。
  is_original: true
  excerpt:
  - 一个行业是否值得深耕，个人觉得有几个参考标准：①这个行业的容量是多少？是否会因为从事的人变多之后而变卷？②这个行业的横向发展、纵向发展的方向会有哪些，是否足够宽广？③这个行业，是否能够延伸到其它的一些方向，并且带来持续稳定的效益以及正向影响
- name: 核心竞争力转移：从信息差到资源整合与供应链
  desc: 作者指出互联网红利期结束后，单纯依靠“信息差/认知差”收割韭菜的模式失效，持续盈利的核心竞争力转移为“整合资源能力”与“自有供应链/产品能力”，这是其团队从国内项目转型海外MB的根本动因。
  is_original: true
  excerpt:
  - 当互联网的信息差正在缩小的时候，我们的核心竞争力是什么？
  - 如果缺乏整合资源的能力、如果缺乏供应链，应该何去何从？
  - 一直缺乏供应链，缺乏一个属于我们自己的好产品，又在口罩的大环境下，确实举步维艰
methods:
- name: __overview__
  desc: Google Cash标准化操作流程（SOP）：1. 选品/选Offer（高搜索量品牌+高佣金返利网/联盟）；2. 搭建合规落地页/博客申请联盟账号；3.
    Google Ads开户及品牌词投放设置；4. 数据监控与ROI优化（目标ROI>10）；5. 多账号/多Offer矩阵规划管理；6. 境外收款渠道对接与资金流周转管理（应对90天账期）。
  excerpt:
  - 简单来说，就是我们通过向Google购买精准流量，来实现变现。
  - 通常均价：$100左右...佣金收入为：100×100×6%=$600。而我们的投入，不到$20，产出/投入 比超过了30。
  - 无论是返利网还是网盟，都需要做好合理的规划，无论是广告费的规划，还是账号的规划、offer的规划。
- name: 单元经济模型测算法
  desc: 快速验证Offer可行性的数学公式：预估收益 = (点击数 × 转化率) × 客单价 × 佣金比例；ROI = 预估收益 / 广告成本。文中实例：1490点击，假设100单(转化率~6.7%)，客单$100，佣金6%，收益$600，成本$16.41，ROI>30。设定ROI>10为及格线。
  excerpt:
  - 1490次精准点击，通常下单人数，我们就按照100个人来算，差不多15个人中有1个人下单；
  - 那么佣金收入为：100×100×6%=$600。而我们的投入，不到$20，产出/投入 比超过了30。
  - 通常来说，返利网的产出/投入大于10是正常。达到20、30甚至更高也时有出现。
- name: 联盟账号批量申请与养号体系
  desc: 解决新人入行核心痛点的方法论：搭建符合联盟审核标准的垂直内容博客/网站 -> 批量申请主流联盟账号 -> 养号建立信誉 -> 备用账号矩阵应对封号风险。文中提及前EMU大佬转型带来的账号资源优势。
  excerpt:
  - 如何高效地申请到网盟账号，这也是对很多新人来说的一大痛点。
  - 过去这个行业里面跑EMU的那些大佬，手里不缺账号...对于那些新人来说，他们仍然需要投入时间，搭建符合要求的博客，去提高申请网盟账号的成功率
theorems:
- name: 海外长周期红利论
  desc: 相比国内平台规则高频变动、监管收紧导致项目生命周期短（月级/季级），海外（以Google为代表）生态规则迭代慢、商业基础设施成熟、竞争强度低（老外不卷），单一模型可跑10-20年，适合作为长期深耕赛道。
  excerpt:
  - 国内目前很多赛道的项目，变化速度很快...平台在变，规则在变，用户在变，流量也在变。
  - 老外相对于国内做项目的朋友，还是没有那么卷的，他们有时候发明一个什么东西，能用几十上百年，所以，他们的改变速度，也是相对来说慢一些的。
  - 只要Google的服务器不关闭，那这一行就可以一直赚钱，再做10年、20年没有问题。
- name: 高ROI源于‘违规套利’的风险收益对称性
  desc: 品牌词投放之所以能产生ROI 10-30倍的超额利润，本质是承担了‘广告主禁止品牌词竞价’的合规风险（K号、扣佣、停止合作）。风险越高（广告主查得越严），门槛越高，利润护城河越深，普通玩家无法参与，从而筛选出高收益人群。
  excerpt:
  - 广告主其实不允许你在Google Ads里面投放他们的品牌词，而所有的推广者都知道，品牌词的搜索量才是最高的，产出的收益才是最吓人的；（所以往往越是不允许的，利润空间越大）
  - 如果广告主查到了，那么可能就不会发给你佣金，联盟or返利网也会K号
- name: 项目生存周期与个人财富积累的错配定律
  desc: 频繁切换赛道（淘宝->京东->拼多多->抖音->小红书）虽能阶段性赚到大钱（8-9位数），但因缺乏资产沉淀（无品牌、无供应链、无用户资产），最终导致财富归零。只有深耕长周期赛道并建立资产护城河，才能实现‘守住钱、让钱生钱’。
  excerpt:
  - 换了这么多个坑位，赚过8位数、甚至接近9位数，但是最后都亏得一塌糊涂。
  - 不断地换着项目、换着赛道...有没有沉淀呢？沉淀了一些；但好像，又什么都没有留下。
  - 大家都是普通阶层，能赚钱，但是不太容易持续赚钱；能赚钱，但是不太容易守得住钱；能赚钱，但是不太容易让钱生钱。
findings:
- name: 实战数据验证：Skechers品牌词投放单日ROI>30
  desc: '[evidence] 作者提供Google Ads后台真实截图数据：花费$16.41，CPC $0.01，展示2040，点击1490。结合Rakuten
    6%佣金及$100客单价估算，单日收益$600，ROI超30倍。验证了品牌词流量极低成本、极高转化的核心假设。'
  excerpt:
  - 总消耗-Cost：$16.41 单次点击消耗-CPC：$0.01 展示量-Impressions：2040次 点击数-Clicks：1490次
  - 佣金收入为：100×100×6%=$600。而我们的投入，不到$20，产出/投入 比超过了30。
- name: 返利网账期实测：普遍90天结算周期
  desc: '[evidence] 作者展示两张返利网后台截图，确认提现周期均为90天。揭示了该模式极高现金流压力：需垫付广告费3个月无回款，对流动资金量、境外收款渠道稳定性要求极高。'
  excerpt:
  - 返利网普遍的结算周期是90天。
  - 上面的几张图，是这两天的一些收益，和一些订单明细...提现周期都是90天
- name: 作者实操阶段性成果：日均$200+稳定收入
  desc: '[evidence] 作者入行约2个月（2023年4月-6月），通过矩阵账号操作实现日收益稳定在$200以上（约¥1400/日），验证了新人经系统学习后可快速跑通模型，但也坦诚该收益在行业内属入门级（小巫见大巫）。'
  excerpt:
  - 目前我差不多在这个行业中实操了2个月，每天的收入可以稳定在200美金以上。
  - 但我的这一点点收益，相比于这个行业中的大佬们而言，确实是小巫见大巫。
- name: 头部玩家规模与隐秘性观察
  desc: '[claim] 作者传闻行业头部大佬以2-3人微型工作室形式运作，年纯利润达1.4亿人民币，极度低调、不培训、不露面。侧面印证了该赛道天花板极高、且核心壁垒在于非标准化的资源渠道与风控能力而非技术门槛。'
  excerpt:
  - 据说有大佬，2-3个人的工作室，一年干1.4亿纯利润，我不知道他们怎么做出来的，估计只有头部大佬能知道
  - 真正赚钱的大佬，基本都是悄悄赚钱；很少露面也不用露面；不屑于培训
- name: 培训市场乱象：无陪跑、售后缺失、贩卖Offer割韭菜
  desc: '[evidence] 作者调研发现现有培训多为‘收钱发文档’模式，缺乏实操陪跑；部分机构将测试出的赚钱Offer作为课程噱头贩卖，或倒卖联盟账号/收款渠道赚中介费，新人极易被收割。'
  excerpt:
  - 做培训的，绝大多数都是交付完了，没有陪跑、售后的保障。
  - 有不少培训机构，会提供一些赚钱的网盟、返利网；也有一些会卖offer，说简单点儿，这是别人赚钱的东西，也是他们课程的一个噱头
