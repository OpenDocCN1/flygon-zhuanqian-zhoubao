paper: docs/202306/20230613_280.md
desc: 该素材是一份抖音图书带货实操指南，作者猎音狮复盘其月均10w+ GMV的实战经验，系统拆解了选品、随心推投放、千川投放三大核心环节。核心主张为：选品决定上限、素材决定下限、投流只是放大器；投流操作上主张“信任算法智能投放大于人工定向”，并提出随心推长周期养模型、千川高峰期一键起量抢量、以随心推数据反推千川出价等具体战术组合。素材详细记录了选品四大渠道与三大避坑指标（大V垄断品、差评率、商家体验分）、随心推ROI出价公式与测品亏损心态建设、千川ECPM竞争力机制与正负反馈博弈论、素材不转化直接换素材等核心方法论，并附带实操截图数据佐证。
concepts:
- name: 选品三大避坑指标
  desc: 用于筛选爆品池中真实可投品的三个硬性指标：1. 相关视频有大V垄断（几百万播放）不可选；2. 差评好评比 > 6%-8% 不可选；3. 商家体验分
    < 4.8 慎选。
  is_original: true
  excerpt:
  - 第一种，相关视频里有很多几百万播放量的，这种品不要选，因为别人都报了几百万播放了，转化好肯定会持续投流，抢量你根本就抢不过他。
  - 第二种，差评好评比大于 6%-8%的不要选，就是用差评的个数除以好评的个数，占比越大说明产品体验越差，不爆单还好，一爆单口碑分直接干废。
  - 第三种，商家体验分低于 4.8 的慎选！会拉低自己橱窗的口碑分！
- name: 随心推-千川联动测品模型
  desc: 利用随心推低成本、长周期（24h）跑出模型数据，计算平均客单价与保本ROI，反推千川首单出价（佣金比例×平均客单价）及过新手期后降价策略（原出价÷1.2），实现低风险冷启动。
  is_original: true
  excerpt:
  - 当随心推消耗一定量后，基本模型已经出来，这个时候可以考虑上千川了，我们也可以通过随心推数据作为参考，计算出一个千川的出价
  - 计算公式：平均客单价=总销售额 ÷ 总订单数 ... 一般佣金多少直接出多少，比如这个品佣金 50%，就出67.55x50%=33.78 ... 过了新手，立马改一个出价，计算公式：原有出价
    ÷ 1.2
- name: ECPM竞争力衰减机制
  desc: 千川计划突然不消耗的核心原因：系统根据出单结果重新计算ECPM，若点击率、转化率不理想导致ECPM排名靠后，流量被同行抢走。需通过智能放量、优化素材/定向/商品信息提升竞争力。
  is_original: false
  excerpt:
  - 最大的可能就是你的计划竞争力不足，ECPM 值排名靠后，系统就不给你流量了。
  - 系统就根据你的出单情况重新计算你的 ECPM 值，发现你的点击率、转化率并不理想，排在同行后面了，流量就给同行了
- name: 正负反馈博弈论
  desc: 投放操作需站在平台视角：降低出价（负反馈）必须配合加大预算（正反馈），保证正反馈大于负反馈，向算法传递‘想跑量’的信号，避免计划被判定为放弃而停止分发。
  is_original: true
  excerpt:
  - A、正反馈＞负反馈。 ... 比如你降低了出价，那你至少要加大预算，告诉平台这个计划你想跑，虽然你压价了，但是你愿意给更多的钱。
  - 有了一个压价（负反馈），你就要有一个加大预算（正反馈），不能让负反馈比正反馈多。不然就是告诉机器，这个计划你不想跑了。
- name: 随心亏心态建设
  desc: 认知随心推测品阶段必然亏损（小亏几百、大亏几千）的客观规律，建立‘它亏任它亏，流量数据堆’的心态，不纠结单单盈亏，专注积累模型数据。
  is_original: true
  excerpt:
  - 随心推不是一本万利，行业内她有一个绰号叫“随心亏”，没有亏的心态，你就玩不好随心推，尤其是测品的时候，测一个品，小亏则几百，大亏则几 k
  - 玩随心推，不要在乎一单两单的亏盈，放好心态：它亏任它亏，流量数据堆，它赚任它赚，定向钻一钻！
methods:
- name: __overview__
  desc: 整体方法论：选品定生死（四渠道找品+三指标避坑） -> 素材定转化（模仿爆款+价值塑造） -> 随心推养模型（24h智能投放+ROI目标+测品容亏）
    -> 千川放规模（高峰期一键起量+正负反馈博弈+ECPM维护） -> 数据反哺（随心推数据反推千川出价）。
  excerpt:
  - 先从选品开始吧！ ... 1、用 4 个爆单秘籍选品 ... 2、跟爆款视频选品 ... 3、看爆款商品榜单选品 ... 4、选品误区
  - 只要选品没问题，做的素材（视频）没问题，用脚投都可以赚钱，就是这个道理，你就无脑选“系统智能投放”
  - 当随心推消耗一定量后，基本模型已经出来，这个时候可以考虑上千川了
  - 用好工具“一键起量” ... 起量时长选择 2 到 6 小时 之间！ ... 正反馈＞负反馈
- name: 随心推24h智能养模型法
  desc: 摒弃自定义定向，全程使用‘系统智能投放’、‘自动出价’、‘投放时长选最长(24h)’、‘目标选商品支付ROI’，给算法充足探索时间获取精准人群，夜间慢跑白天快跑，不足退款。
  excerpt:
  - 新手不要选“自定义定向投放”，你要相信，抖音机器，比你更懂抖音用户，更懂抖音人群。 ... 你就无脑选“系统智能投放”，自动出价，就 ok
  - 随心推投放时长上，就选最长就行 ... 你就给它时间，让它慢慢探索人群，慢慢给你找到精准用户，夜里活跃人群少，它就给你慢慢消耗，白天活跃人群多，它就给你消耗快一些！
  - 随心推新功能，直接投 Roi ... 一般我们佣金线上结算，不要低于保本 roi 就行
- name: 千川高峰期一键起量抢量法
  desc: 在早6-7点、中11-12点、晚8点后等流量高峰期前30分钟开启‘一键起量’，时长设2-6小时，配合前期高出价（佣金/1.2）跑量度过学习期，过20单后降价至原出价/1.2微调盈利。
  excerpt:
  - 用好工具“一键起量” ... 起量时长选择 2 到 6 小时 之间！ ... 操作时间要提前半小时，给到机器冷启动的时间。
  - A、提高出价：前期肯定要亏，过万新手把价格降下来就行，但是一次降低不能超过20%，不然容易把计划搞死！
  - 结合 A 利用好工具“一键起量”：高峰期使用!比如早上 6、7 点，中午 11、12 点，晚上 8 点后
- name: 随心推数据反推千川出价法
  desc: 步骤：1. 取随心推跑出数据中的总销售额与总订单数；2. 计算平均客单价 = 总销售额/总订单数；3. 千川首单出价 = 平均客单价 × 佣金比例（过新手期用）；4.
    过新手期(20单)后出价 = 首单出价 ÷ 1.2；5. 后续微调。
  excerpt:
  - 在抖老板里打开产品详情 ... 假设这个数据是我用随心推跑的，那么我们需要先计算出平均客单价
  - 计算公式：平均客单价=总销售额 ÷ 总订单数 ... 算出平均客单价后，就可以出价了，一般佣金多少直接出多少 ... 过了新手，立马改一个出价，计算公式：原有出价
    ÷ 1.2
- name: 随心推高峰期手动抢量测价法
  desc: 高峰期手动出价2小时、智能推荐、起步出价=佣金×1.2倍；若消耗70%耗时<1.2小时则降价5%迭代，直至找到‘能消耗且盈利’的平衡出价，批量复制计划抢量。
  excerpt:
  - 高峰期可以手动出价，2 小时，智能推荐，佣金的 1.2 倍开始测出价，如果不能消耗，说明这个品手动出价跑不动。
  - 如果能消耗，用时 1.2 小时就能消耗 70%，就降低 5%出价，直到测到既能消耗，又盈利的出价，就可以在高峰期批量剪 2 小时的计划出价抢量。
theorems:
- name: 选品决定上限、素材决定下限、投流只是放大器
  desc: 核心主张：带货盈利的核心链路中，选品决定了利润天花板，素材决定了转化基础，投流工具（随心推/千川）仅起放大作用。选品选错、素材烂，投再多流也亏损。
  excerpt:
  - 只要选品没问题，做的素材（视频）没问题，用脚投都可以赚钱，就是这个道理
  - 投流简单，我之前分享也说过，只要选品没问题，做的素材（视频）没问题，用脚投都可以赚钱
- name: 信任算法智能投放优于人工定向
  desc: 核心主张：抖音算法对人群画像的理解优于人工经验。人工设置定向（莱卡）极易‘定反’导致跑不出或跑飞，应无脑选择‘系统智能投放’，让算法自动探索最优人群。
  excerpt:
  - 新手不要选“自定义定向投放”，你要相信，抖音机器，比你更懂抖音用户，更懂抖音人群。
  - 比如说：同一个账号，不同的品，有的品男性够买的多，有的女性够买的多，如果你定向了，定反了，只有两种结果，要么跑不出去，要么跑飞！
- name: 投放时长越长，单次获客成本越低（算法探索成本视角）
  desc: 核心主张：给算法更长时间（24h vs 2h）相当于给‘找人’更充足预算和时间，算法可低成本慢速探索；缩短时间会迫使算法调用高价资源抢量，推高CPM/CPA。
  excerpt:
  - 你给抖音的时间少了，算法要给你调用更多的服务器资源，所以帮你找客户的成本就变高了，所以有时候你投 2 小时，跑完了一单也不出就是这个道理！
  - 你就给它时间，让它慢慢探索人群，慢慢给你找到精准用户... 超过 24 小时找不到客户了，或者找到的不符合你的预期，它会把剩下的退给你！
- name: 点击不转化的素材直接废弃，不做挽留测试
  desc: 核心主张：高点击低转化素材通常因价值塑造不到位（预期价格<实际价格）或市场饱和（用户已购）。无需纠结、无需追投，直接更换素材，一切不转化指标归零处理。
  excerpt:
  - 那遇到这样的视频素材应该怎么办呢？很多人就开始纠结，就想着要不要再投几笔试一下，我告诉你，完全没必要直接换素材，一切不转化的素材，点击率、完播率再高都没用！
  - 一个是视频内容对产品的价值塑造不到位，就是用户看了你的视频，对这个产品有一点点兴趣，他觉得愿意掏十块钱，但是点进小黄车发现这个产品卖 20 块钱
- name: 贪快是带货不赚钱的根本原因
  desc: 核心主张：大多数新手不赚钱源于‘贪快’心态——一发视频想快速出单、不消耗就加价导致跑飞。正确路径：控制出价在利润边缘（只跑不亏），每天持续产出素材测试，坚持一个月等待概率获胜。
  excerpt:
  - 其实在我看来，绝大部分人不赚钱的原因就两个字，贪快，一发视频就想快速出单，想快速出单就投，不消耗就加价，然后就跑飞了。
  - 我今天给你提供一个不亏钱的解决方案，那就是你可以投流，但是把价格控制住，只在利润边缘出价，能跑就跑，不能跑拉倒。然后每天做几个素材出来...坚持一个月
findings:
- name: 随心推ROI目标出价保本线实测表
  desc: '[evidence] 素材提供实测截图表格，展示不同佣金率（30%-50%）下的保本ROI与目标ROI设置参考，验证‘佣金线上结算，不低于保本ROI’的操作标准。'
  excerpt:
  - roi 要填多少呢？这个要根据你的佣金来了，请看如下表格，一般我们佣金线上结算，不要低于保本 roi 就行。
  - '![](img/6504db00a9e9ab018bb47d989cd19b8f.png)'
- name: 随心推实测数据反推千川出价案例
  desc: '[evidence] 实测案例：随心推跑出总销售额39921.20元、591单，平均客单价67.55元。佣金50%时，千川首单出价33.78元（过新手期），过新手期后降价至28.15元（33.78÷1.2），验证公式有效性。'
  excerpt:
  - 上面这个品的平均客单价，代入公式，得，39921.20 ÷ 591 = 67.55
  - 算出平均客单价后，就可以出价了，一般佣金多少直接出多少，比如这个品佣金 50%，就出67.55x50%=33.78 ... 过了新手，立马改一个出价，计算公式：原有出价
    ÷ 1.2 = 28.15
- name: 千川计划ECPM衰减导致停止消耗实证
  desc: '[evidence] 实操观察：千川计划昨日跑量良好，今日突然不消耗。排除余额不足、发货率低后，核心原因为出单数据导致ECPM重新计算排名靠后，流量被同行抢占。截图显示ECPM均值与胜出ECPM对比。'
  excerpt:
  - 有没有人建的计划是这样的，昨天跑的好好的，以为要大爆单了，今天起来一看，突然就不消耗了。
  - 最大的可能就是你的计划竞争力不足，ECPM 值排名靠后，系统就不给你流量了。
  - '![](img/e5d67ed067f2849384539bb21a1fb6ea.png)'
- name: 千川高峰期一键起量实操界面与参数
  desc: '[evidence] 素材提供千川后台‘一键起量’功能入口截图及参数设置截图（起量时长2-6小时），佐证高峰期抢量的标准化操作路径。'
  excerpt:
  - 用好工具“一键起量” ... 起量时长选择 2 到 6 小时 之间！
  - '![](img/2d7b7d1e178c7cf3961448ab522b8984.png) ![](img/ae9e0c2a92c2b3c11819899584e772df.png)'
- name: 作者月入10w+带货账单实证
  desc: '[claim] 作者宣称并展示截图证明其抖音图书带货月均收入10w+，且近期‘又投爆了一个品’，作为全套方法论有效性的背书。'
  excerpt:
  - 圈友们，就在刚刚又投爆了一个品，刚好承接周末流量！
  - '![](img/6c3fa2c9c95d78f2ef9220af87169dcc.png)  ![](img/f96decb069a721e9b51c40d4ce3d789f.png)'
  - 很荣幸之前分享的文章...入选精华...我是如何月入 10W➕的？
