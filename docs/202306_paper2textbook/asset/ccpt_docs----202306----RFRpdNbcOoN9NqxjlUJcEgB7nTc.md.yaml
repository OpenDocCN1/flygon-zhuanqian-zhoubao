paper: docs/202306/RFRpdNbcOoN9NqxjlUJcEgB7nTc.md
desc: 该素材是一篇面向零基础新手的AI绘画实操教程，核心讲解如何利用Midjourney（MJ）的垫图功能与图像权重参数（--iw），结合个人真实照片快速生成多风格个性化头像，并详细拆解了从操作入门、提示词工程迭代、参数调优到小红书/抖音等平台变现闭环（菜单化交付+Notion
  AI辅助提效）的完整SOP。
concepts:
- name: 垫图
  desc: 指在Midjourney中上传参考图片获取链接，作为Prompt的前缀输入，以图生图控制生成结果的构图、人脸特征等核心视觉要素的核心操作范式。
  is_original: false
  excerpt:
  - 垫图是让我们做出一张图的一种辅助方式，就是把一张图当成底稿图，在这个图的基础上生成图像。
  - 具体的操作步骤：第一步：选择对话框中的“+”，第二步：点击“上传文件”，第三步：选择你想要参考的图片，第四步：按你的键盘中的“Enter”回车键，发送图片
- name: 图像权重参数
  desc: Midjourney中控制参考图（垫图）对生成结果影响力的关键参数（--iw），数值越大图像相似度越高，越小文本提示词主导权越大，V5版本范围0.5-2，默认1。
  is_original: false
  excerpt:
  - 图像权重，就是“--iw”+“数字”这个参数，在V5和Niji 5里，iw后面的这个数字范围是0.5-2，默认值为 1
  - 给予图像提示更高的权重意味着它比文本更重要或更有影响力，比如--iw 2。而给予图像提示更低的权重则表示文本更为重要，比如--iw 0.5。
- name: 菜单化交付
  desc: 将头像定制服务标准化为可视化的‘选择题’菜单（风格、细节、成品展示），替代低效的‘问答式’沟通，降低客户决策成本与沟通摩擦，实现快速成单。
  is_original: true
  excerpt:
  - 我们要知道，图片比文字的冲击力要大……文字的沟通也不如图片的沟通效果好
  - 让客户去做『选择题』，顾客可以在“菜单”中勾选自己想要的画面，而且做『选择题』比做『问答题』要轻松很多
  - 下面可以供参考：文字描述：各种不同的风格可供选择……图片展示：各种不同表情、不同风格的成品图
- name: 提示词懒人模式
  desc: 利用Midjourney官方画廊或社区高质量案例的现成Prompt，仅替换垫图链接即可快速复刻风格，降低新手提示词编写门槛的实战策略。
  is_original: true
  excerpt:
  - 木木做图最喜欢的是“懒人模式”……做法就是我们可以去Mj 的画廊看图，在画廊看到你喜欢的图片，直接复制关键词和我们的链接组合。
  - 我用了Notion AI把词翻译成中文……现在，我们不改动任何词，只需要在词的前面，加上我的图片链接，来看看会出现什么图片
methods:
- name: __overview__
  desc: 基于Midjourney V5.1/Niji5的‘垫图+提示词迭代+--iw权重调节’三步法，实现从真人照片到多风格头像的标准化批量生产流程。
  excerpt:
  - 本篇文章使用的AI绘画工具是Midjourney（以下简称MJ）
  - 先来学习一下MJ的垫图方法... 用复制的链接生图，就是垫图... 接下来，就进入到木木的探索时间啦，在探索期间，我会根据自己的需求和出图效果来调整关键词...
    咱们继续来看看iw对图的影响
- name: 垫图操作标准流程
  desc: 上传图片->获取链接->构造Prompt（链接+空格+文本描述+参数）的MJ标准化操作SOP。
  excerpt:
  - 具体的操作步骤：第一步：选择对话框中的“+”，第二步：点击“上传文件”，第三步：选择你想要参考的图片，第四步：按你的键盘中的“Enter”回车键，发送图片
  - 左键单击图片，在图片上单击右键，选择“复制链接”
  - 输入“/” 选择“imagine” 在 prompt后面，输入：【粘贴刚刚复制的链接】+【空格键】+【你想要的词】 记得链接和词之间，一定要有一个【空格】
- name: 提示词分层迭代法
  desc: 采用‘单词->风格词->场景词->人物形象词->功能词(头像)->参数微调’的分层递进策略，逐步精准控制生成结果。
  excerpt:
  - 先来试试最简单的关键词组合方式，【链接】+【一个词】... 关键词：【链接】 可爱的女孩
  - 我们再来换个风格... 【链接】 赛博朋克，女孩
  - 这次要做一个美美的迪斯尼乐园里面的冰雪女王，这里我的关键词组合是，【链接】+【场景】+【描述词】
  - 那么我们再来加个词看看，人物会不会更精致一些，接下来我要加个词，人物形象Characters... 【链接】+【人物形象】+【场景，描述词】
  - 我们是要做头像的，就干脆的用“头像”来... 【链接】+【头像】+【场景，描述词】
  - 在做图之前，要先明白自己想要一个什么样的画面... 比如：我想要有点动漫的感觉。... 【链接】 头像，一个可爱的小女孩，在奔跑中，来自CoMix Wave
    Films，你的名字
- name: --iw参数动态调优法
  desc: 针对垫图过强导致姿态僵硬（如坐姿难变跑姿）的问题，通过降低--iw值（如0.5）削弱原图约束，增强文本提示词对动作、风味的主导权。
  excerpt:
  - 因为我的原图是坐着的，我们再减少一些原图参照的权重，用“--iw”这个参数来试一下... --iw 0.5
  - 你看，跑起来了~
  - 再来换个极简风格的... --iw 0.5 --niji 5 --style cute
  - 再来个没有iw 参数的，看看我的原图的效果... 图1和图4，爱了。图2和图3可能是吃胖的木木～
- name: Notion AI辅助菜单构建法
  desc: 利用Notion AI批量生成细分属性词库（表情、脸型、五官细节等），结合Notion数据库‘待办清单’功能一键转化为可交互的客户选配菜单。
  excerpt:
  - 当我问它眼睛的颜色都有哪些时... 人物的表情都有哪些... 人物的脸型都有哪些... 人物的五官都有哪些，并要求它对“眼睛大小”进行详细描述
  - 将上面我们批量产生出的文字，复制到想要画的表格中，它可以批量的把文字转换成你想要的格式
  - 全选内容，选择“转化成”——“待办清单”即可... 你看，只需要一秒钟就可以在文字的前面加上『□』
theorems:
- name: 头像赛道变现三要素
  desc: 头像具备高变现潜力（起号快）、强社交属性（形象展示/情绪价值/社交货币）与高频刚需（多平台多马甲需求）三大特性，是AI绘画新手切入商业化的最优切口。
  excerpt:
  - 之所以从头像入手，是因为：1. 头像很赚钱... 变现最快的就是头像。 2. 头像是最直观的表现出一个人对外的形象... 3. 头像也是可以传递情绪价值的...
    现阶段，谁还没几个马甲，同一个平台有不同的小马甲，不同的平台又是不同的风格，不同的风格肯定要搭配不同的头像
- name: 提示词工程‘准确直白’原则
  desc: AI无法理解复杂抽象概念，提示词必须拆解为具体、具象、可视化的描述词（如‘蓝天白云’代替‘天气真好’），才能获得可控生成结果。
  excerpt:
  - Tips：我们在写词的时候，对词语表达要准确和直白，AI理解不了那么复杂或者抽象的概念。比如，不要写：今天的天气真好，而是要写：蓝天，白云
- name: 工具组合‘强强联合’论
  desc: 单一AI工具存在短板，需识别各工具核心优势（MJ擅长生图、Notion AI擅长文本结构化与知识管理），通过工作流串联实现1+1>2的效率跃升。
  excerpt:
  - 关于工具：适合自己的才是最好的。善用工具，放大工具的优点，发挥工具的作用，强强联合使用，才能提高做事效率，才是我们身为制造者的应有思维。
  - Notion有2个功能：一个是作为资料存储功能... 另一个功能是：和GPT一样，有AI语言辅助功能
findings:
- name: 垫图+单词即可出可用头像
  desc: '[evidence] 实测仅用‘链接+可爱的女孩’即可生成保留本人特征且风格化程度高的头像（图1/图3质量较高），验证了垫图核心保真能力。'
  excerpt:
  - 关键词：【链接】 可爱的女孩... 我们来看看图... 对于上面的图，我个人还是比较满意的，虽然，图2和图4，把我原图的衣领颜色变成了头发颜色，但是也还不错
- name: 添加‘头像’关键词强制正面构图
  desc: '[evidence] 对比实验显示，在Prompt中加入‘Avatar/头像’词后，生成图显著呈现标准头像风格（正面、胸像构图、背景简洁），验证了功能词对构图的强约束力。'
  excerpt:
  - 【链接】+【头像】+【场景，描述词】... 有没有发现，加上【头像】后，这就是标准的头像风格了，且多数图都是正面图
- name: 降低--iw可打破原图姿态限制
  desc: '[evidence] 原图为坐姿，默认--iw 1生成跑步姿态失败（仅有姿态无动感），降低至--iw 0.5后成功生成奔跑动作，证明降低图像权重能有效解耦原图空间约束。'
  excerpt:
  - 因为我的原图是坐着的，我们再减少一些原图参照的权重，用“--iw”这个参数来试一下... --iw 0.5... 你看，跑起来了~
- name: 极简线条风需配合Niji模型与低--iw
  desc: '[evidence] 使用‘粗轮廓线/极简主义’提示词结合‘--niji 5 --style cute --iw 0.5’参数，生成高质量线条风头像（图4最佳），验证了模型风格与参数的耦合最优解。'
  excerpt:
  - 再来换个极简风格的，用一下niji的风格看看... --iw 0.5 --niji 5 --style cute... 依旧是喜欢图4~
  - 再来个没有iw 参数的... 图1和图4，爱了。图2和图3可能是吃胖的木木～
- name: 懒人模式（套用社区Prompt）存在颜色随机性风险
  desc: '[evidence] 直接套用画廊复杂Prompt（含蓝色/红色飞溅描述）生成时，颜色随机分配到头发/衣服上，不受控；加入--iw 0.5后可缓解但不可完全消除，提示需显式指定颜色标签。'
  excerpt:
  - 原图：词里的蓝色在头发上出现了，黑色氛围展示在衣服上了，我的图：词里的蓝色变成衣服颜色，黑色变成头发了，随机性比较多，因为关键词里没有固定头发的颜色，衣服的颜色，所以AI就把颜色自动随机填充了~
- name: 菜单化交付显著降低沟通成本
  desc: '[claim] 作者基于实战经验总结，采用‘菜单’让客户做选择题替代问答题，可减少双方沟通时间和成本，快速出图赚取定制费。'
  excerpt:
  - 文字的沟通也不如图片的沟通效果好，且大多数人其实是不知道自己想要什么样的图片... 让客户去做『选择题』... 这样可以减少双方沟通时间和成本，从而快速出图赚取定制费。
- name: Notion AI可高效生成结构化绘画词库
  desc: '[evidence] 实测Notion AI能秒级生成眼睛颜色、表情、脸型、五官细节（如眼睛大小分级）等分类词库，并支持扩写续写，配合Notion待办清单功能可一键产出交付级菜单。'
  excerpt:
  - 当我问它眼睛的颜色都有哪些时... 人物的表情都有哪些... 人物的脸型都有哪些... 人物的五官都有哪些，并要求它对“眼睛大小”进行详细描述
  - 将上面我们批量产生出的文字，复制到想要画的表格中... 全选内容，选择“转化成”——“待办清单”即可... 只需要一秒钟就可以在文字的前面加上『□』
