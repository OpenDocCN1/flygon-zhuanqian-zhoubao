'no': 1
name: 闲鱼无货源实战 —— 从“瞎折腾”到“稳变现”
desc: 本章聚焦闲鱼无货源电商模式，系统拆解从新手避坑、选品定价、店铺运营、自动化工具、供应链对接到私域沉淀的全链路实操方法论。通过对比“红海数码”与“蓝海非标”、“盲目找厂”与“拼多多代发起步”、“人工搬运”与“程序员自动化”等反差案例，帮助学员建立确定性收益认知，掌握从0到1、从1到N的可复制执行框架。
nodes:
- 'no': 1
  name: 为什么选闲鱼无货源：低门槛、轻资产、高确定性的副业首选
  desc: 对比多项目试错（视频号、小红书、直播切片等）与单一赛道深耕的收益曲线，确立闲鱼无货源作为新手‘从0到1’获取正反馈、建立商业自信的最优路径。
  role: motivation
  src:
  - paper: docs/202306/20230613_061.md
  - paper: docs/202306/20230613_233.md
  - paper: docs/202306/20230613_158.md
- 'no': 2
  name: 新人生存第一课：坚决不碰数码3C，拒绝垂直店铺收割陷阱
  desc: 基于12000+学员实战数据，量化数码品类‘高违规、高退货、低利润、资金占用大’四大死穴，揭露‘垂直店铺’多为头部博主收代理割韭菜的商业骗局，确立新人‘杂货铺起步、高客单非标品’的生存法则。
  role: limitation
  src:
  - paper: docs/202306/20230613_062.md
- 'no': 3
  name: 核心选品逻辑：价格不透明 = 定价权 = 高利润
  desc: 提出‘价格不透明选品法’：选择古筝、商用冷柜、便携显示器等非品牌/非标品，利用信息差获取定价话语权；对比标品（如iPhone 13）价格透明导致的薄利红海，验证‘利润源泉=信息差×非标品溢价’定律。
  role: method
  src:
  - paper: docs/202306/20230613_062.md
  - paper: docs/202306/20230613_061.md
- 'no': 4
  name: 高客单价杂货铺模型：广撒网测品，窄深耕爆款
  desc: 定义新人适用的店铺运营模型：不限品类、客单价锚定300元以上、通过广撒网测品发现优势品类，后期选择性向垂直收敛。实证作者店铺15天交易额4.7万、利润率25%、团队单店月流水近百万的盈利能力。
  role: method
  src:
  - paper: docs/202306/20230613_062.md
  - paper: docs/202306/20230613_234.md
- 'no': 5
  name: 趋势捕捉与垂直聚焦：露营经济风口下的单品类突围
  desc: 复盘作者捕捉‘露营经济风向标’、将通用无货源模式聚焦露营装备垂类，实现日利润从百元跃升至4000+、年变现20万的案例，验证‘趋势红利期内的垂直聚焦定律’与‘存量能力与增量趋势耦合原理’。
  role: experiment
  src:
  - paper: docs/202306/20230613_234.md
- 'no': 6
  name: 标准化执行闭环 SOP：养号 → 选品测款 → 转化话术 → 代发履约 → 售后复盘
  desc: 提炼全流程标准化动作：新号3-7天养号（实名、芝麻信用、模拟真人行为）；选品‘三高一低’筛选标准（近30天成交>50、同款<20家、利润>15元/率>20%、非强管控）；48小时数据复盘机制（曝光<100下架、想要>5或询单>2优化）；拼多多/1688一件代发防风控操作细则。
  role: method
  src:
  - paper: docs/202306/20230613_158.md
  - paper: docs/202306/20230627_116.md
- 'no': 7
  name: 二手书垂类高转化发布八步法：卖主图、卖信任、卖心理
  desc: 拆解二手书非标品发布核心要素：主图留白/最佳面/合集全貌/堆头实力四范式（首因效应）；闲鱼币折扣动态遮挡/展示想要数（从众心理双刃剑管理）；痛点前置标题（搜索词+捡漏词）；出手理由文案（场景化信任锚定）；合规低价双规格引流（规格拆分/价费分离）；大城市发货地套利（LBS流量机制）；圈子分流获取精准流量。
  role: method
  src:
  - paper: docs/202306/20230613_155.md
  - paper: docs/202306/20230613_156.md
  - paper: docs/202306/20230613_157.md
- 'no': 8
  name: 程序员的降维打击：全自动化运营系统替代90%机械操作
  desc: 展示程序员作者自研系统实战案例：批量上书、跨平台订单履约自动化（闲鱼↔孔夫子）、多渠道消息聚合推送、批量加价曝光、合规黑名单去重等几十项功能，实现‘用爽再给钱’的工程化变现；佐证AI编程（ChatGPT）可直接生产可用级浏览器插件，将人力从搬运工释放为系统设计者。
  role: extension
  src:
  - paper: docs/202306/20230613_154.md
  - paper: docs/202306/20230613_157.md
- 'no': 9
  name: 供应链反向整合法则：先跑通销售，厂家自会上门
  desc: 揭示货源对接底层逻辑：新人零订单、零囤货资金主动找厂家拿不到核心让利；正确路径是前期依托拼多多代发零成本试错，积累销量规模后反向整合厂家独家供给价及售后权益。实证团队超半数货源仍为拼多多、爆款商用冷柜/显示器均起源于拼多多拿货再谈厂家。
  role: method
  src:
  - paper: docs/202306/20230613_062.md
- 'no': 10
  name: 公域流量私域化：从一锤子买卖到用户资产复利
  desc: 构建‘公域获客→私域沉淀→信任运营→复购/高客单转化’闭环：被动引流（主页钩子、自动回复送资料）、主动引流（发货卡片引导加微信领售后/延保）、群运营（福利单/清仓单沉淀高信任用户）、朋友圈人设化打造（发货实拍、好评、避坑干货），将平台波动流量转化为可控用户资产。
  role: extension
  src:
  - paper: docs/202306/20230613_158.md
  - paper: docs/202306/20230613_233.md
- 'no': 11
  name: 合规红线与风险前置：出版物许可证、虚拟商品打击、季节性波动
  desc: 梳理必须办理出版物经营许可证的准入门槛；揭露‘Word生成条形码规避资质上架虚拟商品’属高风险违规操作（平台打击力度大）；提示露营等强季节性品类存在利润波动风险，规模化需考量营业执照/经营许可合规成本。
  role: limitation
  src:
  - paper: docs/202306/20230613_157.md
  - paper: docs/202306/20230627_116.md
  - paper: docs/202306/20230613_234.md
