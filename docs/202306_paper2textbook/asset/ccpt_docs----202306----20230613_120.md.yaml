paper: docs/202306/20230613_120.md
desc: 该素材为一篇创业经验分享文章的摘要，作者苗子作为连续创业者，记录并拆解了三人团队从零到一实现首个100万营收的完整互联网起盘步骤，核心主张是复盘过往路径对新入局者具有可复制的实战价值，详细打法细节引导至飞书文档查看。
concepts:
- name: 三人团队起盘模型
  desc: 指由三人组成的小团队，通过特定的互联网打法，从零开始构建业务并实现首个100万营收的组织与业务形态。
  is_original: true
  excerpt:
  - 三人团队如何去赚第一个 100W
  - 从零到一记录我整个互联网起盘的步骤
- name: 自残式拆解
  desc: 作者对自己创业全过程进行深度、无保留、甚至暴露短板的复盘与拆解，旨在提炼可复制的方法论。
  is_original: true
  excerpt:
  - 5000 字长文自残式拆解自己
- name: 网创领域通用打法
  desc: 一种经过验证、适用于网络创业（网创）入门者的标准化操作流程与策略组合。
  is_original: true
  excerpt:
  - 对于想进入网创领域的完全可以用我这套打法，就是现在使用也照样可以起盘
methods:
- name: __overview__
  desc: 作者未在当前文本中公开具体操作步骤，而是将完整的互联网起盘步骤、具体打法细节（共5000字长文）沉淀在外部飞书文档中，采用“引流至私域/知识库”获取全量方法论的策略。
  excerpt:
  - 更多详细请移步飞书：https://mv61xmj001b.feishu.cn/docx/WBsWdTm7uoOXICxiHDncFMdDnvb
  - 从零到一记录我整个互联网起盘的步骤
theorems:
- name: 复盘即升华
  desc: 创业者不应只顾埋头赶路，定期停下来复盘过往路径（看到的风景、走过的弯路），是对心灵的升华和警醒，也是沉淀方法论的关键。
  excerpt:
  - 很多时候我们不一定要埋头的去努力向前跑，偶尔停下来看看之前走过的路，看到的风景，也是对自己心灵的一次升华和警醒。
- name: 过往路径的可复制性
  desc: 作者实测的起盘路径具有跨周期的普适性，即便在当前时间节点，新入局者直接套用该打法依然能够起盘成功。
  excerpt:
  - 就是现在使用也照样可以起盘
findings:
- name: 社群认可度背书
  desc: '[evidence] 文章获得71个赞，且评论区出现‘强’、‘学习了’、‘成功是有成功的道理’等正向反馈，表明该经验分享在目标社群（网创/创业圈）内具有较高的认可度和参考价值。'
  excerpt:
  - (71 赞)
  - '之势 : [强][强][强] 喜子 : 成功是有成功的道理[强][强][强] 波仔 : [强][强] 🔥逆熵增者💰 : 看完挺有收获'
