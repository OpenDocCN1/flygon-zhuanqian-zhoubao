paper: docs/202306/NSJLdjAUUosmAixOHIWcFI93nob.md
desc: 该素材由张柯Ker分享，核心揭示了微信公众号公域流量爆发的新机制——「看一看精选」入口的推荐算法逻辑，指出其无需内容审核、不限新老号/原创/粉丝量，通过AB
  Test机制根据点击率筛选内容，从而解释了近期爆文写作、AI绘图美女图等打法爆发阅读量的底层原因；同时介绍了微信「问一问」作为新流量入口的红利期玩法（搬运知乎内容、视频号关联公众号导私域），为内容创业者提供了低门槛获取公域流量并变现（流量主/私域）的完整实操路径。
concepts:
- name: 看一看精选
  desc: 微信公域流量分发的核心入口，位于微信一级菜单栏「看一看」中，采用AB Test机制无差别抓取内容进入流量池，根据点击率等指标决定是否持续推荐，打破了传统社交链传播和原创/粉丝门槛。
  is_original: true
  excerpt:
  - 99%的流量来源，是一个叫「看一看精选」的地方
  - 只要内容进了这个入口，那他就是精选
  - 他不进行内容审核，新号老号都在流量池中，文章阅读量高低都有，不管是不是原创文都会进流量池
- name: AB Test流量池机制
  desc: 「看一看精选」的底层分发逻辑：系统将内容投放至流量池进行小规模测试，依据点击率（CTR）等用户行为反馈决定是否扩大推荐，实现了内容的冷启动与爆发式增长。
  is_original: true
  excerpt:
  - 他都有可能把你的文章挂上去，然后通过点击率等因素判断，要不要留下你这篇文章继续推送
  - 只有系统一直公域推流，才有可能这样大爆，而不是通过所谓的「在看」社交链
- name: 微信问一问
  desc: 微信搜一搜内新开放的问答型内容入口（类知乎），当前处于极度缺内容的红利期，支持视频号作答、关联公众号导流私域，形成完整商业闭环。
  is_original: true
  excerpt:
  - 另外一个新的流量入口，是微信版「知乎」，问一问
  - 答题的主体是用视频号，视频号又可以关联公众号，公众号又可以导私域，所以整个过程是非常丝滑的
- name: 三张图片阈值规则
  desc: 公众号文章配图数量≥3张时，「看一看」信息流会随机选取三张图以大图模式展示，显著增加屏幕占有率与点击率，是AI美女图等视觉类内容爆发的关键结构性优势。
  is_original: true
  excerpt:
  - 当文章中的配图大于等于三张后，系统会随机选择三张图片显示在信息流中
- name: 七天连更概率论
  desc: 基于「看一看」推送近七天内更新文章的推断，通过连续七天每日更新，使单账号拥有7篇文章同时在流量池参与AB Test，从而将进入推荐流的概率提升约7倍。
  is_original: true
  excerpt:
  - 我推断是看一看中，会推送近七天内更新的文章，当你连续更新七天后...所以更新七天自然也就是七倍概率
methods:
- name: __overview__
  desc: 低门槛公域流量获取与变现全链路：利用「看一看精选」AB Test机制批量产出高CTR内容（标题党+AI美女图/爆文洗稿）获取流量主收益，配合「问一问」搬运知乎内容挂视频号导流私域，实现多渠道变现。
  excerpt:
  - 不标原创，直接去复制粘贴，一天八篇批量操作，标原创，直接用chatgpt洗稿，再配美女三张以上美女图片
  - 我们可以直接去知乎照搬内容，复制粘贴一波...视频号又可以关联公众号，公众号又可以导私域
- name: 爆文写作/AI绘图批量生产法
  desc: 针对「看一看」算法偏好的内容生产策略：选题聚焦婆媳/情感/养生等常青树赛道（高基础点击率）；标题采用标题党技巧；正文用ChatGPT洗稿/生成狗血情感文；配图强制≥3张AI生成美女图触发大图展示模式；高频更新（日更8篇/周更7天）最大化AB
    Test参与次数。
  excerpt:
  - 用chatgpt批量写狗血情感文，月入8w
  - 爆文写作能爆...AI绘画基本上都是美女图，不仅占据的屏幕空间大，还吸睛，所以点击率自然就高
  - 不标原创，直接去复制粘贴，一天八篇批量操作，标原创，直接用chatgpt洗稿，再配美女三张以上美女图片
- name: 问一问知乎搬运导流法
  desc: 针对「问一问」红利期的内容冷启动策略：直接搬运知乎高赞回答内容至微信问一问；回答主体绑定视频号；视频号主页/简介关联公众号；公众号设置自动回复/菜单栏引导用户入群或加个人微信，完成公域-私域转化。
  excerpt:
  - 我们可以直接去知乎照搬内容，复制粘贴一波
  - 答题的主体是用视频号，视频号又可以关联公众号，公众号又可以导私域，所以整个过程是非常丝滑的
theorems:
- name: 公域流量入口红利窗口期定理
  desc: 新开放的公域流量入口（如看一看精选、问一问）在早期必然面临内容供给不足，算法门槛最低（无审核、不看权重），此时全品类内容均有机会获得超额曝光，先入场者可低成本获取流量并完成商业化验证。
  excerpt:
  - 全新的流量入口代表着全新的机会，这是趋势，趋势是不可阻挡的
  - 生财的内容，一般都领先业内半年，希望大家抓住机会
  - 目前是完全和知乎一样，但极度缺内容...值得深耕，相当于几年前的知乎
- name: 算法推荐替代社交裂变主张
  desc: 当前公众号流量爆发的核心驱动力已从传统的「在看」社交链传播转移为系统算法推荐（看一看精选），内容分发不再依赖粉丝基数与社交关系链，而是依赖内容本身在冷启动池中的点击率表现。
  excerpt:
  - 所以不管你是什么内容，不管你是新号老号...他都有可能把你的文章挂上去
  - 也只有系统一直公域推流，才有可能这样大爆，而不是通过所谓的「在看」社交链
- name: 视觉结构优先于内容质量假说
  desc: 在「看一看」信息流竞争环境下，文章配图≥3张触发的大图展示模式带来的视觉冲击力（屏幕占有率、吸睛度），对点击率的贡献大于文本内容本身的深度与质量，解释了AI美女图、标题党等「低质」内容高阅读的本质。
  excerpt:
  - 因为AI绘画基本上都是美女图，不仅占据的屏幕空间大，还吸睛，所以点击率自然就高
findings:
- name: ChatGPT批量情感文实测收益
  desc: '[evidence] 素材展示后台截图证明：使用ChatGPT批量生产狗血情感文，单月流量主收益达8万元，验证了「低成本生产+算法分发」模式的商业可行性。'
  excerpt:
  - 我看到最牛逼的人，是用chatgpt批量写狗血情感文，月入8w，纯流量主收益
  - '![](img/6c6c131605f25de22d8b4ff184441cdb.png)'
- name: 流量来源归因分析
  desc: '[evidence] 通过分析多位大佬后台截图发现：爆发流量99%来自「看一看精选」，而非SEO搜索流量或「在看」社交裂变，锚定了流量来源的唯一性。'
  excerpt:
  - 通过分析多位大佬的后台截图后发现不像...所以这个流量来源，只可能是推荐流量
  - 可以看到，99%的流量来源，是一个叫「看一看精选」的地方
- name: 入口分布三大场景
  desc: '[evidence] 实测观察「看一看精选」入口出现的三大具体场景：1.文章页点赞/在看后的推荐位；2.订阅号消息流穿插推荐（内测中）；3.一级菜单栏「看一看」主入口（最大流量来源）。'
  excerpt:
  - 通过研究，我发现这个入口在三个地方出现
  - 1、最普通的...在看完公众号点赞/在看后...
  - 2、新更新出来的，在订阅号消息中...
  - 3、这个应该是本次爆发式流量来源最大的因素，位于微信一级菜单栏中的「看一看」
- name: 算法无门槛特性验证
  desc: '[evidence] 大量刷内容实测总结：算法不审核内容、新老号同权、高低阅读量同池、非原创也可入池，确认了「全民创作、算法定生死」的分发机制。'
  excerpt:
  - 我通过大量的刷内容发现，1、他不进行内容审核，2、新号老号都在流量池中，3、文章阅读量高低都有，4、不管是不是原创文都会进流量池
- name: 个性化推荐学习机制
  desc: '[evidence] 用户行为实测：初期推荐泛内容，定向点击特定类目（如美女）后，推荐流快速收敛同类内容，证明系统具备实时兴趣建模与用户画像优化能力。'
  excerpt:
  - 有一定的学习算法，一开始进去就是什么都推，当你定向去点击一些固定内容后（比如美女），就会大量给你推同类型内容
- name: 多账号批量操作案例群
  desc: '[evidence] 素材展示9张不同账号后台截图（含流量主收益、阅读量曲线、来源分析），佐证该玩法已形成规模化、批量化操作产业链，非个例。'
  excerpt:
  - 账号举例：![](img/eaa39d235bdde4a68490acb57c6c5a6c.png) ... ![](img/d2a2831ea9dc449e0fa02129ed1f6d7f.png)
  - 目前已经发现很多账号在批量操作撸流量主收益了
- name: AI美女图+标题党高CTR验证
  desc: '[evidence] 实测案例展示：AI生成美女图配合标题党标题，在「看一看」信息流中获得高曝光高点击，验证「三张图阈值+视觉吸引」组合拳有效性。'
  excerpt:
  - AI绘画吸精+标题党：![](img/56a8142d7e49287c28dd0f706ec90f4d.png)
- name: 问一问红利期空窗期确认
  desc: '[claim] 宣称当前「问一问」已全量开放、极度缺内容、可直接搬运知乎、吃SEO流量、视频号关联公众号导流丝滑，处于类似「几年前知乎」的红利期，建议深耕。'
  excerpt:
  - 前段时间在内测...现在已经放开了
  - 目前是完全和知乎一样，但极度缺内容...值得深耕，相当于几年前的知乎，还能吃到seo流量，目前还是一片空白
  - 目前我已经看到有账号在批量铺内容了
