  - 提出选品策略‘信息差碾压’替代‘稀缺定价’、‘赚有钱人零花钱’避开‘赚穷人生活费’
  - 创新‘裂变式阿米巴’四步飞轮：阶梯产品矩阵+阿米巴分销团队+付费流量招募合伙人+从合伙人筛选人才开发新品
- 'no': 14
  name: 财富即权势即拿捏 —— 让价值定提取
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人将财富等同于存款，缺乏动态提取视角'
  - '- 未理解财富本质为持续从社会提取剩余的能力'
  - '- 缺乏三层级商业模式框架，难以规划跃迁路径'
  - '**核心定义**'
  - '- 财富定义为‘持续从社会提取剩余的能力’；底层法则为‘对他人施加得利或损害’；拿捏本质为提供价值完成绑定，实现对他人劳动剩余的持续定向提取'
  - '**关键性质**'
  - '- 三层模型：L1血酬(出卖时间，将被AI取代)、L2稀缺社会资源租金(守擂/攻擂博弈)、L3制定规则/建生态做庄家(赢家通吃)'
  - '- 动态流向：让别人的钱持续流向自己口袋'
  - '**典型例子**'
  - '- L3制定规则/建生态做庄家，实现赢家通吃'
  - '**边界条件**'
  - '- L1血酬模式在AI颠覆下必然消亡，需向L2/L3跃迁'
  - '- 提取剩余需建立信任绑定，单纯施加损害不可持续'
  sources:
  - paper: docs/202306/20230613_182.md
    role: origin
  excerpts:
  - 定义财富为‘持续从社会提取剩余的能力’，底层法则为‘对他人施加得利或损害’
  - 构建三层商业模式：L1血酬(出卖时间，将被AI取代)、L2稀缺社会资源租金(守擂/攻擂博弈)、L3制定规则/建生态做庄家(赢家通吃)
  - 升华‘拿捏’本质：提供价值完成绑定，实现对他人劳动剩余的持续定向提取
