units:
- 'no': 1
  name: 认知破局 —— 让思维变成赚钱杠杆
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人常被“考985”等应试思维锁定，认为标准化路径最安全'
  - '- 商业变现拥有赛道可选、红利可捕捉等后天可控变量，主观能动性释放空间远大于应试教育'
  - '- 缺乏认知升级会导致陷入“出卖时间”的线性收入陷阱'
  - '**核心定义**'
  - '- 认知破局是指从“打工者思维”切换至“赚钱者思维”，主观能动性释放与商业模型重构的跃迁过程'
  - '**关键性质**'
  - '- 非线性：认知升级不随工作年限自动增长，需主动打破思维范式'
  - '- 可迁移：认知模型可跨领域复用，支持从劳动密集型向资产型收入转型'
  - '**典型例子**'
  - '- 通过切换至中介/分销视角，将辛苦挣钱转化为“弯腰捡钱”的信息差变现'
  - '**边界条件**'
  - '- 认知觉醒仅是前置必要条件，必须配合实战闭环才能完成财富变现'
  - '- 先天禀赋差异存在，成事能力可迁移但不可完全复制，需承认时间差与路径依赖'
  sources:
  - paper: docs/202306/20230613_080.md
    role: origin
  - paper: docs/202306/20230613_081.md
    role: origin
  - paper: docs/202306/20230613_082.md
    role: origin
  - paper: docs/202306/20230613_083.md
    role: origin
  - paper: docs/202306/20230613_084.md
    role: origin
  - paper: docs/202306/20230613_085.md
    role: origin
  - paper: docs/202306/20230613_086.md
    role: origin
  - paper: docs/202306/20230613_087.md
    role: origin
  excerpts:
  - 高考受先天因素锁定、评价单一、逆袭概率低
  - 赚钱拥有赛道可选、红利可捕捉、评价多元等后天可控变量
  - 主观能动性释放空间远大于应试教育
- 'no': 2
  name: 出卖时间 vs 经营资产 —— 让劳动变成可复制资产
  points:
  - '**为什么需要这个概念？**'
  - '- 打工本质是帮中介完成交易，薪资经层层筛减，天花板极低'
  - '- 第四次科技革命将淘汰可标准化、重复性劳动，出卖时间者将失去议价力'
  - '- 唯有构建零边际成本产品（媒体/代码）实现时间复用，才能突破财务自由天花板'
  - '**核心定义**'
  - '- 经营资产是指构建可重复发售、边际成本趋近零的商业系统，实现从血酬到资产租金的层级跃迁'
  - '**关键性质**'
  - '- 零边际成本：写书、直播带货、代码、媒体等产品可重复发售'
  - '- 四阶段模型：出卖时间劳动力 → 产品/服务变现 → 商业系统杠杆 → 多系统整合'
  - '**典型例子**'
  - '- 舞蹈工作室开业前通过限量50席预售年卡，仅靠存量私域激活回笼25万现金流，覆盖运营成本'
  - '**边界条件**'
  - '- 非标产品（如成人用品）功能同质化，环境与隐私即护城河，需避免价格战'
  - '- 二手设备隐性成本高（过户繁琐/售后无保障），需量化风险边界'
  sources:
  - paper: docs/202306/20230613_177.md
    role: origin
  - paper: docs/202306/20230613_182.md
    role: origin
  - paper: docs/202306/20230613_253.md
    role: origin
  - paper: docs/202306/20230613_252.md
    role: improve
  excerpts:
  - 赚钱四阶段模型：出卖时间劳动力(血酬) -> 产品/服务变现(超级个体) -> 商业系统杠杆(资源构建者) -> 多系统整合(高维整合者)
  - 打工本质是帮中介完成交易、薪资经层层筛减
  - 构建零边际成本产品(媒体/代码)实现时间复用
- 'no': 3
  name: 信息差与认知套利 —— 让视角变成商机雷达
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人缺乏稀缺资源和渠道，难以直接进入高利润赛道'
  - '- 信息差变现本质是“中间人经济”，低成本跨越阶层的核心抓手'
  - '- 单纯辛苦劳作难以获得超额收益，需依赖认知不对称'
  - '**核心定义**'
  - '- 信息差为认知、资源、渠道维度的非对称信息；认知套利是指通过视角转换（如从打工者切换至中介/分销视角）将信息差转化为商业利润'
  - '**关键性质**'
  - '- 非对称性：信息掌握方与不知情方之间存在认知鸿沟'
  - '- 中间人经济：核心变现形态为分销、转介绍、拉皮条'
  - '**典型例子**'
  - '- 百篇精华帖实证，揭示视角一变，商机无限——将辛苦挣钱转化为弯腰捡钱'
  - '**边界条件**'
  - '- 灰黑产项目（如活体认证套利、API代理）法律风险极高，不可复制'
  - '- 风向标类项目信息半衰期极短（48小时红海化），依赖“捡漏”非长久之计'
  sources:
  - paper: docs/202306/20230613_004.md
    role: origin
  - paper: docs/202306/20230613_080.md
    role: origin
  - paper: docs/202306/20230613_093.md
    role: origin
  - paper: docs/202306/20230613_251.md
    role: origin
  excerpts:
  - 定义信息差为认知、资源、渠道维度的非对称信息
  - 信息差变现本质是‘中间人经济’(分销、转介绍)
  - 核心在于‘视角一变，商机无限’——从打工者视角切换至中介/分销视角
- 'no': 4
  name: 快钱慢钱辩证法 —— 让目的定策略
  points:
  - '**为什么需要这个概念？**'
  - '- 社会对“快钱/慢钱”存在二元对立的道德评价，容易让创业者陷入犹豫'
  - '- 在巨大不确定性下，盲目追求“慢钱”可能导致生存危机'
  - '- 缺乏清晰的创业目的论，导致策略与目标脱节'
  - '**核心定义**'
  - '- 创业无标准答案，合理性仅取决于创业者主观目的（改善生活 vs 缔造伟大）；快钱与慢钱构成时序链条而非对立面'
  - '**关键性质**'
  - '- 目的决定做法：不同主观目的对应不同商业策略'
  - '- 时序链条：快钱可为慢钱积累第一桶金（霍英东、芒格案例）'
  - '**典型例子**'
  - '- 霍英东、芒格通过快钱积累第一桶金，后转向长期价值投资'
  - '**边界条件**'
  - '- 巨大不确定性下落袋为安赚快钱是优选，但不代表放弃长期规划'
  - '- 不应将快钱道德化，需基于自身阶段与目的理性选择'
  sources:
  - paper: docs/202306/20230613_006.md
    role: origin
  excerpts:
  - 打破‘快钱/慢钱’二元对立道德评价
  - 提出‘创业目的论’：创业无标准答案，合理性仅取决于创业者主观目的
  - 快钱可为慢钱积累第一桶金(霍英东、芒格案例)，二者构成时序链条而非对立面
- 'no': 5
  name: 做题家 vs 出题家 —— 让身份定视界
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人习惯被动接受规则、优化答案，难以突破存量竞争天花板'
  - '- 做题家思维局限于规则内优化，收益上限受规则制定者控制'
  - '- 需完成身份跃迁，从规则内竞争存量转向规则外创造增量'
  - '**核心定义**'
  - '- 出题家是指主动定义规则、创造标准的身份；做题家是指被动接受规则并优化答案的身份'
  - '**关键性质**'
  - '- 身份决定视界：出题家掌握规则定义权，收益上限更高'
  - '- 引入高阶思维模型：第一性原理、反脆弱、边际复制成本等作为认知工具包'
  - '**典型例子**'
  - '- 普通人完成身份跃迁，从竞争存量规则转向创造增量规则'
  - '**边界条件**'
  - '- 身份跃迁需配合实战经验，单纯理论学习不足以支撑出题家能力'
  - '- 规则外创造增量面临更高不确定性，需承担相应风险'
  sources:
  - paper: docs/202306/20230613_088.md
    role: origin
  excerpts:
  - 区分被动接受规则优化答案的‘做题家’与主动定义规则创造标准的‘出题家’
  - 引入第一性原理、反脆弱、边际复制成本等高阶思维模型作为认知工具包
  - 从规则内竞争存量转向规则外创造增量
- 'no': 6
  name: 理论-实践鸿沟 —— 让实战定认知
  points:
  - '**为什么需要这个概念？**'
  - '- 正规商业理论系统性回避回扣、办公室政治、保护费等灰色地带'
  - '- 理论学习者入行必“懵逼”，书本知识无法直接应对商业冲突'
  - '- 隐性知识只能通过直接投身实战、在具体冲突中积累'
  - '**核心定义**'
  - '- 理论-实践鸿沟是指正规商业理论与实际商业生存技能之间的认知断层，实践认知需通过直接投身实战积累'
  - '**关键性质**'
  - '- 隐性知识：无法通过书本系统传授，需在冲突中体悟'
  - '- 灰色地带：回扣、办公室政治、保护费、恶意竞争、房东毁约等'
  - '**典型例子**'
  - '- 芒格‘提价增量’行贿案例揭示正规理论系统性回避灰色地带'
  - '**边界条件**'
  - '- 实践认知积累存在时间成本，需承担试错风险'
  - '- 不应完全否定理论，而应将理论与实战结合，避免片面'
  sources:
  - paper: docs/202306/20230627_003.md
    role: origin
  excerpts:
  - 基于芒格‘提价增量’行贿案例，揭示正规商业理论系统性回避回扣、办公室政治、保护费、恶意竞争、房东毁约等灰色地带
  - 论证实践认知只能通过直接投身实战、在具体冲突中积累隐性知识
  - 理论学习者入行必‘懵逼’
- 'no': 7
  name: 生意本质三维模型 —— 让需求定交易
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人易将生意等同于产品销售，忽视需求对象的差异'
  - '- 不同需求对象对应不同客单价、复购率与商业模式'
  - '- 缺乏系统模型导致选品与定位盲目'
  - '**核心定义**'
  - '- 生意本质是交易行为满足他人需求，按需求对象分为满足个体、满足群体、满足客观标准化需求三类'
  - '**关键性质**'
  - '- 满足个体：高客单/非标，交易劳动力/金钱/智力'
  - '- 满足群体：解决认知焦虑的知识付费，具备规模化潜力'
  - '- 满足客观标准化需求：红海标品，竞争激烈'
  - '**典型例子**'
  - '- 个人商业模式组合升级法：1个现金流传统生意+1个认知变现知识付费+1个优质甲方陪跑咨询'
  - '**边界条件**'
  - '- 知识付费‘高购买低使用’，用户为消除焦虑付费，焦虑缓解即失去行动动力'
  - '- 红海标品易陷入价格战，需具备供应链或渠道优势'
  sources:
  - paper: docs/202306/20230627_004.md
    role: origin
  - paper: docs/202306/20230613_255.md
    role: origin
  excerpts:
  - 将生意拆解为三类需求满足模式：满足特定个体(高客单/非标，交易劳动力/金钱/智力)、满足特定群体(解决认知焦虑的知识付费)、满足客观标准化需求(红海标品)
  - 提出个人商业模式组合升级法：1个现金流传统生意+1个认知变现知识付费+1个优质甲方陪跑咨询
- 'no': 8
  name: 职场四层次进化 —— 让层级定天花板
  points:
  - '**为什么需要这个概念？**'
  - '- 职场人易陷入线性阶梯思维，认为专业做事即可持续晋升'
  - '- 每层天花板由外部结构决定，忽视结构会导致职业天花板'
  - '- 缺乏降维打击策略，在低维度竞争中内耗'
  - '**核心定义**'
  - '- 职场能力进化四阶段：专业做事 → 满足上级利益建立不可替代性 → 为自己操盘事业版图 → 选择正确商业模式赛道'
  - '**关键性质**'
  - '- 天花板由外部结构决定：可替代性/老板瓶颈/模式杠杆/资源门槛'
  - '- 降维打击：在当前竞争维度低一级运作认知与能力，将四种能力作为工具箱灵活调用而非线性阶梯'
  - '**典型例子**'
  - '- 从专业做事者转为事业版图操盘者，突破可替代性天花板'
  - '**边界条件**'
  - '- 每层跃迁需匹配外部资源与平台，单靠个人努力不足'
  - '- 降维打击非放弃进步，而是战略性选择竞争维度'
  sources:
  - paper: docs/202306/20230613_098.md
    role: origin
  excerpts:
  - 构建职场能力进化四阶段：专业做事 -> 满足上级利益建立不可替代性 -> 为自己操盘事业版图 -> 选择正确商业模式赛道
  - 揭示每层天花板由外部结构决定(可替代性/老板瓶颈/模式杠杆/资源门槛)
  - 主张‘降维打击’——在当前竞争维度低一级运作认知与能力
- 'no': 9
  name: 认知觉醒五维重构 —— 让认知定变现
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人缺乏系统的认知框架，容易在变现前迷失方向'
  - '- 节省低价值时间反而错过高杠杆活动，陷入忙碌陷阱'
  - '- 缺乏对钱的本质与富人思维的深刻理解'
  - '**核心定义**'
  - '- 认知觉醒五维度：1.钱是交换价值而非拥有物 2.模仿有钱人底层逻辑 3.去除消耗资源型做事 4.重新理解钱为积累资源 5.不节省低价值时间而投资高杠杆活动'
  - '**关键性质**'
  - '- 前置性：认知觉醒是变现的前置必要条件'
  - '- 扬长避短：优于补短板，基于个人优势测评复盘'
  - '**典型例子**'
  - '- 基于个人优势测评(学习/思维/成就前三)的实战复盘，验证‘扬长避短优于补短板’'
  - '**边界条件**'
  - '- 认知觉醒不直接等于变现，需落地为具体商业动作'
  - '- 五维度相互关联，缺一不可，需系统重构'
  sources:
  - paper: docs/202306/20230613_100.md
    role: origin
  excerpts:
  - 基于个人优势测评(学习/思维/成就前三)的实战复盘，提炼认知觉醒五维度
  - 1.钱是交换价值而非拥有物 2.模仿有钱人底层逻辑 3.去除消耗资源型做事 4.重新理解钱为积累资源 5.不节省低价值时间而投资高杠杆活动
  - 验证‘扬长避短优于补短板’与‘认知觉醒是变现前置必要条件’
- 'no': 10
  name: 时间即生产资料 —— 让时间变成杠杆
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人一生可售时间仅占总寿命10%，直接出售时间天花板极低'
  - '- 缺乏对时间成本模型的系统理解，容易陷入低效劳作'
  - '- 未意识到再生产时间成本趋近零是指数级财富增长的必要条件'
  - '**核心定义**'
  - '- 时间为终极生产资料；商业模型四大时间成本：生产/再生产/学习/销售'
  - '**关键性质**'
  - '- 再生产时间成本趋近零：写书、直播带货、代码、媒体等可重复发售'
  - '- 指数级增长：零边际成本杠杆是实现财富指数级增长的必要条件'
  - '**典型例子**'
  - '- 李笑来演讲核心观点，确立时间为终极生产资料'
  - '**边界条件**'
  - '- 并非所有时间投入都能产生复利，需区分高杠杆与低杠杆活动'
  - '- 再生产产品需前期大量投入，回报具有滞后性'
  sources:
  - paper: docs/202306/20230613_101.md
    role: origin
  excerpts:
  - 基于李笑来演讲核心观点，确立时间为终极生产资料
  - 拆解商业模型四大时间成本(生产/再生产/学习/销售)
  - 证明再生产时间成本趋近零(写书、直播带货、代码、媒体)是实现指数级财富增长的必要条件
  - 普通人一生可售时间仅占总寿命10%，直接出售时间天花板极低
- 'no': 11
  name: 模仿律与组合拳创新 —— 让模仿变成壁垒
  points:
  - '**为什么需要这个概念？**'
  - '- 商业中单一创新易被模仿，无法形成持久护城河'
  - '- 普通人缺乏原创能力，盲目追求原创会错过窗口期'
  - '- 缺乏系统性模仿方法论，导致重复造轮子'
  - '**核心定义**'
  - '- 基于塔尔德《模仿律》揭示“世界本质无原创，皆为模仿结果”；组合拳创新是指组织、选址、用工、供应链、分配多维耦合的创新方式'
  - '**关键性质**'
  - '- 模仿四大规律：从上到下、几何扩散、先内后外、文化优于物质'
  - '- 反模 imitation 壁垒：唯有组合拳创新或持续创新能显著提升模仿难度'
  - '**典型例子**'
  - '- 以南城香、戴森为反模仿典范，通过多维耦合构建壁垒'
  - '**边界条件**'
  - '- 组合拳创新需协调多维资源，执行难度高'
  - '- 持续创新要求组织具备快速迭代能力，资源密集'
