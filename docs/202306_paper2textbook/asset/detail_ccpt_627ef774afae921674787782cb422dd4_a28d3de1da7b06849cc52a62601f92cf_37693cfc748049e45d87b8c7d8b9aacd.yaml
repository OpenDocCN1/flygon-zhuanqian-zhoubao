- 'no': 13
  name: 千万商业模式顶层设计 —— 让模型定规模
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人选品易陷入“稀缺定价”误区，忽视信息差碾压'
  - '- 缺乏年入千万商业模式的三要素框架，导致规模化受限'
  - '- 裂变式增长缺乏标准化飞轮模型'
  - '**核心定义**'
  - '- 年入千万商业模式三支柱：好卖产品(定生死)、巨大的利润(高客单/高毛利)、能做规模(人/钱的规模)'
  - '**关键性质**'
  - '- 选品策略：信息差碾压替代稀缺定价，赚有钱人零花钱避开赚穷人生活费'
  - '- 裂变式阿米巴四步飞轮：阶梯产品矩阵+阿米巴分销团队+付费流量招募合伙人+从合伙人筛选人才开发新品'
  - '**典型例子**'
  - '- 提出选品策略‘信息差碾压’替代‘稀缺定价’'
  - '**边界条件**'
  - '- 高客单产品需匹配高信任度渠道，转化周期较长'
  - '- 阿米巴模式对合伙人管理能力要求高，需建立独立核算机制'
