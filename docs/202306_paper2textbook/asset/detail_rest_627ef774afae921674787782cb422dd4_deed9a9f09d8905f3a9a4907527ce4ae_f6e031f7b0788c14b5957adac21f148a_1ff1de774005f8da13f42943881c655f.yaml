learning_targets:
- 理解结构化提示词的核心地位，掌握“身份设定+任务设定+约束设定”三要素设计方法
- 掌握“投喂”范式，能将 PDF、网页、表格、聊天记录等非结构化数据转化为 AI 可处理的标准化任务
- 了解私有化部署的适用场景、技术路径与商业价值，能判断何时选择本地化方案
- 学会用“异常值案例库”思维捕捉 AI 变现机会，从“可复制、可放大”角度评估项目
- 掌握 AI 头像壁纸号与 AI 视频工作流等典型落地场景的标准化 SOP
- 理解 RPA+X 模式“稳定内核+热点外壳”的复用逻辑，学会设计自动化内容生产线
- 具备 AI 内容合规与风控意识，能识别敏感领域、版权红线与平台风控风险
- 能根据自身资源禀赋选择合适的 AI 应用切入路径，完成从工具使用到商业闭环的跃迁
concept_map:
- AI 应用实战范式
- ├── 提示词工程
- │   ├── 角色指令三要素 —— 身份+任务+约束，调教垂直专家
- │   ├── 角色生成器 —— 元提示词一键生成，人工微调落地
- │   └── 过程式协作 —— 需求拆解→分步生成→迭代优化
- ├── 投喂范式
- │   ├── 七大数据源 —— PDF/网页/表格/文本/聊天记录/书籍/公众号
- │   ├── 标准化投喂 SOP —— 摘要/查询/分析/模仿/分类/速读/观点提取
- │   └── 核心主张 —— 从“万能打字机”升级为“过程式助手”
- ├── 私有化部署
- │   ├── 核心价值 —— 数据隐私时代的 ToB 落地刚需
- │   ├── 技术路径 —— 开源基座(LLaMA)+少量高质量指令微调(ShareGPT/LIMA)
- │   └── 边界条件 —— 中文基座瓶颈与英文出海窗口期
- ├── AI 变现案例库
- │   ├── 异常值观察法 —— 放弃 MECE，聚焦高 ROI 可复制案例
- │   ├── 五大方向 —— 宝宝起名/热点资讯/头像壁纸/小说推文/流量收益
- │   └── 迁移逻辑 —— 有没有能做的、能复制的、能放大的
- ├── AI 绘图与视频工作流
- │   ├── 头像壁纸号 —— 0成本起号/三大变现模型/IP二创关键词
- │   ├── 人物一致性 —— ControlNet/IP-Adapter/训练专属LoRA
- │   └── 3D视频SOP —— ChatGPT→MJ关键帧→LeiaPix→剪映合成
- ├── RPA+X 模式
- │   ├── 稳定内核 A —— RPA 自动化能力复用
- │   ├── 热点外壳 X —— ChatGPT/加好友/小红书/抖音
- │   └── 交付体系 —— 思路×流程×自动化三位一体
- ├── AI 内容自动化生产线
- │   ├── 批量生成 —— 自动输入 Prompt、智能续写、自动抓取保存
- │   └── 人机协作 —— 机器做重复操作，人工负责验收与品控
- └── 合规与风控
- '    ├── 敏感领域 —— AI 合规方案+外部托管+引流分发'
- '    ├── 版权红线 —— 声音克隆/同人二创/模型训练侵权风险'
- '    └── 平台风控 —— 灰产工具生命周期短，合规是生存底线'
life_analogy:
- 想象 AI 应用实战是一间**AI 内容餐厅**：
- '- **提示词三要素** = 给每位厨师（AI）的**岗位说明书**（身份：他是谁；任务：这顿做什么菜；约束：口味、忌口、摆盘）'
- '- **投喂范式** = 把食材（PDF、表格、聊天记录）**预处理成标准切配**，再递到厨师手上，而不是丢一只活鸡进厨房'
- '- **私有化部署** = 把厨房搬进自家后院，客人隐私不外泄，适合高端私宴（ToB 客户）'
- '- **异常值案例库** = 翻看热门餐厅的**招牌菜**，琢磨哪些能复制、能改进、能放大'
- '- **AI 视频工作流** = 洗菜（ChatGPT 剧本）→切配（Midjourney 画面）→烹饪（LeiaPix 转 3D）→摆盘（剪映合成）'
- '- **RPA+X 模式** = 固定老灶台（RPA）不变，换着做时令热点菜（ChatGPT/小红书/抖音）'
- '- **AI 内容自动化生产线** = 流水线后厨，自动配菜、自动断火续炒，厨师只负责试菜验收'
- '- **合规与风控** = 餐厅的营业执照与食品安全检查，不办证再好吃也会被查封'
summary:
- concept: 角色指令三要素
  desc: 身份+任务+约束，把通用 AI 快速调教成垂直领域专家
- concept: 角色生成器
  desc: 用元提示词让 AI 帮你生成指令，配合人工微调降低提示词工程门槛
- concept: 投喂范式
  desc: 结构化输入+配套提示词，释放 AI 的通用认知能力，从单轮调用走向过程协作
- concept: 私有化部署
  desc: 开源基座+少量高质量指令微调，满足数据隐私合规的 ToB 落地刚需
- concept: AI变现异常值案例库
  desc: 放弃 MECE 体系，用“可复制、可放大”的眼光捕捉高 ROI 异常案例
- concept: 三大变现模型
  desc: 流量主广告是喝汤、私人定制是吃肉、账号教学是构建闭环
- concept: 头像壁纸号
  desc: 0成本、易操作、变现清晰的 AI 副业切入点，垂直细分是起号关键
- concept: AI视频工作流
  desc: ChatGPT+Midjourney+LeiaPix+剪映六步 SOP，零成本产出 3D 视频
- concept: RPA+X模型
  desc: 稳定的核心技能 A 嫁接不断变化的热点 X，快速组合形成变现产品
- concept: 思路×流程×自动化
  desc: 交付完整解决方案而非裸工具，才能支撑高客单价与竞争壁垒
- concept: AI内容自动化生产线
  desc: RPA 批量输入、智能续写、自动抓取，让单日产量从百篇级跃升至万篇级
- concept: 合规与风控
  desc: 外部托管+AI 合规话术+版权红线意识，是敏感赛道长期生存的前提
exercises:
- 'no': 1
  title: 设计你的第一个“专家角色”
  contents:
  - 选择一个你熟悉的领域（如健身教练、考研规划师、母婴顾问）：
  - 1. 用“身份设定+任务设定+约束设定”三要素写出角色指令
  - 2. 使用角色生成器生成初稿，再进行人工优化
  - 3. 将模糊指令与优化后的专家指令分别发给同一个 AI，对比输出差异
  - 回答问题：
  - '- 约束设定中哪些限制最关键？为什么？'
  - '- 模糊指令为什么必然产出低质量结果？'
- 'no': 2
  title: 制定一份“投喂”任务清单
  contents:
  - 列出你学习/工作中常处理的 7 类数据源（PDF、网页、表格、长文本、聊天记录、公众号、书籍）：
  - 1. 为每类数据源设计一个具体任务（摘要、查询最新信息、数据分析、风格模仿、好友分类、速读、观点提取）
  - 2. 写出每个任务对应的提示词模板
  - 3. 拿一份真实材料逐项实测，记录 AI 输出质量与需要人工修正的部分
  - 回答问题：
  - '- 输入数据的格式与质量如何影响输出结果？'
  - '- 哪些任务适合直接“投喂”？哪些任务必须拆成多步完成？'
- 'no': 3
  title: 拆解并改造一条 AI 视频工作流
  contents:
  - 给定场景：为某产品制作一条 15 秒 3D 宣传视频：
  - 1. 按“ChatGPT 剧本→分镜→Midjourney 关键帧→LeiaPix 转 3D→剪映合成”写出每一步的输入与输出
  - 2. 替换其中一个环节的工具（如将 LeiaPix 换成其他 2D-3D 工具，或剪映换成 CapCut）
  - 3. 对比两条工具链的耗时、成本与成片效果
  - 回答问题：
  - '- 多模态工具链的瓶颈通常在哪个环节？'
  - '- 如何判断一个环节值得升级为付费工具？'
- 'no': 4
  title: 为“RPA+X”设计一个极速 MVP
  contents:
  - 假设你掌握 RPA 技能，最近出现了一个热点（如 AI 绘画、小红书引流、短剧 CPS）：
  - 1. 用 RPA+X 模型写出你的“A 内核 + X 热点”组合方案
  - 2. 按“极速 MVP”原则设计一个 3 节课训练营的产品结构（课程内容、工具包、社群服务）
  - 3. 估算你的私域流量池规模，用客单价倒推需要多少成交人数才能达到周入 1 万
  - 回答问题：
  - '- 为什么高客单价是“小流量池”实现高营收的必要杠杆？'
  - '- 如果定价降为 199 元，对你的营收和交付压力分别有什么影响？'
- 'no': 5
  title: AI 内容合规自查清单
  contents:
  - 列出三类高风险内容场景：敏感命理类、AI 声音克隆、IP 二创周边：
  - 1. 针对每一类场景，写出至少两条合规处理手段（如外部托管、话术替换、版权授权）
  - 2. 分析“AI 生成合规方案+飞书外部托管+引流分发”这条策略的优缺点
  - 3. 找出你正在做或打算做的业务中可能触碰的合规红线
  - 回答问题：
  - '- 平台风控升级时，依赖灰产工具（如群禁言插件、自动撤回工具）的商业模式为什么必然失效？'
  - '- 合规成本与翻车成本相比，哪个更值得优先承担？'
