paper: docs/202306/20230627_090.md
desc: 该素材由创业者 Y 仔分享，详细阐述了普通人如何利用 ChatGPT（GPT-3.5 即可）辅助完成线上文字类兼职（公众号、知乎、小红书文案），通过 BOSS
  直聘等平台在二三四线城市批量投递简历、面试获单，实现月入过万的完整实操流程。文章提供了四大平台专用的结构化提示词模板、从简历准备到交付的 9 步执行 SOP、基于对标文章的“框架-分步生成”写作心法，以及招人分包、RPA
  自动化、面试 SOP 化三种业务放大路径，并从企业降本增效角度论证了该模式的长期存续性。
concepts:
- name: GPT+线上兼职变现模型
  desc: 利用生成式 AI 大幅降低内容生产门槛，配合招聘平台信息差（二三四线城市企业需求大、竞争小），实现个人零成本、低技能要求的现金流变现闭环。
  is_original: true
  excerpt:
  - 我今天这篇文章，将会详细的展开，我是如何用 GPT+线上兼职，月入过万的详细流程，纯小白也能做，你只需要学会怎么用 GPT 输出能用的文章，再按照执行步骤去一步步操作即可。
  - 认真听了的学员，按照我的实操经验去做，5 月份赚了 1 万多。
- name: 结构化角色提示词模板
  desc: 采用‘名称-类型-能力-输出格式-说话风格-询问策略-回答身份’七维结构定义 AI 人设，针对公众号、知乎、小红书三大内容平台差异化定制，实现开箱即用的专业级文案生成。
  is_original: true
  excerpt:
  - 名称：Ycaa / 类型：公众号标题写手 / 能力：... / 输出格式：... / 说话风格：... / 询问策略：... / 回答身份：...
  - 名称：Inkwell / 类型：公众号文章写手 / ...
  - 名称：ZhiWriter / 类型：知乎推文写手 / ...
  - 名称：RedCraft / 类型：小红书文案写手 / ...
- name: 对标文章-框架拆解-分步生成写作法
  desc: 不直接让 GPT 写全文，而是先喂入爆款对标文章学习风格，再由 GPT 输出大纲框架，最后逐节点深化生成，再由人工拼装润色，显著提升内容可用率与通过率。
  is_original: true
  excerpt:
  - 最好是找好一篇对标的文章，把文章复制之后发给 GPT，让 GPT 学习了解，了解之后，你再给 GPT 一个内容主题，让 GPT 根据内容主题把内容框架搭出来，然后再让
    GPT 根据内容框架里的 1、2、3、4 去逐步完善，最后你再把所有 GPT 输出的内容，收集整理起来就是一篇成型的文章了。
- name: 城市-赛道匹配策略
  desc: 基于产业集聚规律，将公众号推文兼职锁定东莞、长沙等制造/消费品牌集中地，将小红书/知乎文案兼职锁定杭州、成都、厦门等新媒体/电商发达城市，提高简历投递精准度与成单率。
  is_original: true
  excerpt:
  - 写公众号推文兼职的可以把地区选在东莞、长沙等等这类城市、写小红书、知乎文案兼职的可以把地区选在杭州、成都、厦门这类城市，我说的这几个地方是这些业务比较发达的...
- name: 生产端与获客端动态平衡放大论
  desc: 放大阶段必须同步扩充内容生产能力（招人/RPA）与商单获取能力（面试/拉单），避免单边失控导致交付崩盘或客户流失，核心是维护长期客户关系（财神爷）。
  is_original: true
  excerpt:
  - 我建议，这两者咱们得稳着来，不要想着一下子把获客端的量拉满，然后在找人来做交付。一定要追求平衡，一旦一边的量太大，很容易崩盘的。
  - 像这些长期有需求的公司，搞砸了一个其实就是得罪了一个财神爷...
methods:
- name: __overview__
  desc: 完整的‘GPT+BOSS直聘线上兼职’标准化作业流程（SOP），覆盖工具准备、账号矩阵构建、精准投递、面试备战、合同保障、AI 高效生产、交付迭代、规模化放大全生命周期。
  excerpt:
  - 1. 准备几份风格不一样的简历... 2. 多注册几个 BOSS 直聘账号... 3. 选择 2、3、4 线城市，开始批量投线上兼职的简历... 4. 提前用
    GPT 写好 3-4 篇内容，用来应对面试... 5. 先沟通清楚对方是长期兼职还是短期兼职... 6. 一定要和对方签一个合同或者一个协议... 7. 用
    GPT 写内容的心得（对标-框架-分步）... 8. 找兼职的心得（城市-赛道匹配）... 9. 前期做 1-2 个兼职即可，后期同时找 5、6 份...
- name: 提示词注入与人设绑定法
  desc: 将结构化提示词直接复制至 GPT 对话框完成系统级人设初始化，后续仅需输入主题即可稳定输出符合平台调性的文案，降低提示工程门槛。
  excerpt:
  - 这些提示词，你直接复制发给 gpt，就可以让他给你生成你想要的内容了...
  - 把提示词复制发到 GPT 的对话框，然后给他主题就可以了
- name: RPA+GPT 内容自动化生产线
  desc: 引入 RPA（机器人流程自动化）工具替代人工操作 GPT 对话界面，实现‘自动喂入主题-自动生成框架-自动分步生文-自动收集成稿’的无人值守内容工厂模式。
  excerpt:
  - 用 RPA 机器人+GPT 自动产出优质内容，你只需要负责不停的面试和拉单，我目前就在这么做，平均每天能新增 3 个兼职。
- name: 兼职面试 SOP 化与客服分离模式
  desc: 将面试话术、应答逻辑、微信添加流程标准化为 SOP 手册，招聘低成本客服专员批量操作 BOSS 直聘/猪八戒平台完成‘加微-面试-拿需求’全流程，实现获客端解耦。
  excerpt:
  - 专门组建一支兼职面试团队，把兼职面试话术整理成 SOP 方法论，招客服专门去 BOSS 直聘、猪八戒网这些平台去加微信，做兼职。
theorems:
- name: 普通人 AI 变现‘降维打击’论
  desc: AI 第一波淘汰的是高薪专业人士，普通人反而因低机会成本、高杠杆工具（GPT-3.5 足矣）获得历史性红利窗口，核心竞争力是‘会用工具+肯执行’而非‘专业技能’。
  excerpt:
  - 首先我想说，普通人面对 AI，真没必要焦虑，AI 第一波淘汰的并不是你，天塌了也是高个子的先顶着...
  - 纯小白也能做，你只需要学会怎么用 GPT 输出能用的文章...
- name: 企业侧线上兼职刚需长存论
  desc: 线上兼职对企业具有‘灵活用工、降本控费（免社保、低工资、按需工时）、应对业务波峰（大促/发稿高峰）’的结构性价值，因此该商业模式生命周期长、抗周期性强。
  excerpt:
  - 因为线上兼职这个业务形态，对公司经营来说，是有利的。
  - 招聘线上兼职员工为我提供了灵活的人力资源... 兼职员工一般都不用交社保，工资对比其他员工来说，不会太高... 合理降低和控制公司的劳动成本。
- name: 信息差与工具杠杆双重套利定律
  desc: 个人收益 = （GPT 生产力杠杆）×（招聘平台地域/认知信息差）。二三四线城市企业缺乏 AI 认知且急需内容，一线人才下沉或远程协作即可收割差价。
  excerpt:
  - 选择 2、3、4 线城市（一定要选 2、3、4 线城市），开始批量投线上兼职的简历
  - 写公众号推文兼职的可以把地区选在东莞、长沙... 写小红书、知乎文案兼职的可以把地区选在杭州、成都、厦门...
findings:
- name: 作者亲测月入过万可行性
  desc: '[evidence] 作者本人及团队实操验证，通过该流程单月变现 1 万+，并管理最多同时 20 个兼职单，证明模型跑通且具备规模弹性。'
  excerpt:
  - 我在 5 月份的内部分享里详细的讲了一下... 认真听了的学员，按照我的实操经验去做，5 月份赚了 1 万多。
  - 我们最多一次接了 20 个
- name: 学员复现验证结果
  desc: '[evidence] 内部分享学员按教程执行后，5 月单月收入破万，证明方法论具有可复制性、可教学性，非幸存者偏差。'
  excerpt:
  - 认真听了的学员，按照我的实操经验去做，5 月份赚了 1 万多。
- name: RPA 自动化日增 3 单获客效率
  desc: '[claim] 作者宣称当前 RPA+GPT 模式运行稳定，平均每日新增 3 个兼职订单，获客端已实现准自动化。'
  excerpt:
  - 用 RPA 机器人+GPT 自动产出优质内容，你只需要负责不停的面试和拉单，我目前就在这么做，平均每天能新增 3 个兼职。
- name: GPT-3.5 满足商业级文案生产门槛
  desc: '[evidence] 实战中仅使用 GPT-3.5 即可通过面试稿审核、满足客户交付标准，降低了硬件成本（无需 GPT-4/Plus）与技术门槛（API/镜像站均可）。'
  excerpt:
  - 首先你得有个可以正常使用的 GPT（3.5 即可，市面上大把）
  - 提前用 GPT 写好 3-4 篇内容，用来应对面试... 面试通过之后...
- name: 合同/协议签署为长期合规关键动作
  desc: '[evidence] 实操中发现，面试通过后签署合同或协议是保障权益、规避拖欠薪资、确立长期合作关系的必要步骤，纳入 SOP 必做项。'
  excerpt:
  - 面试通过之后，一定要和对方签一个合同或者一个协议，保障自己的权益。
