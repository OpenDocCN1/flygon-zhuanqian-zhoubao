learning_targets:
- 理解认知破局：从“打工者思维”切换至“赚钱者思维”
concept_map:
- 认知破局 —— 让思维变成赚钱杠杆
- ├── 为什么需要该概念
- │   ├── 破除“考985”应试思维锁定 —— P080-P087
- │   └── 商业变现拥有更多后天可控变量 —— P080-P087
- ├── 核心定义
- │   └── 认知破局 = 主观能动性释放 + 商业模型重构 —— P080-P087
- ├── 关键性质
- │   ├── 非线性：需主动打破思维范式 —— P080-P087
- │   └── 可迁移：支持跨领域复用 —— P080-P087
- ├── 典型例子
- │   └── 切换至中介/分销视角，实现“弯腰捡钱” —— P080-P087
- └── 边界条件
- ├── 认知觉醒仅是前置必要条件，需配合实战闭环 —— P080-P087
- └── 成事能力可迁移但不可完全复制，承认时间差与路径依赖 —— P080-P087
life_analogy:
- 想象认知破局是从**考场走进市场**：
- '- **Query（你的问题）** = 原来是“考多少分能上名校”'
- '- **Key（对方标签）** = 现在变成“市场需要什么、谁愿意为解决问题付费”'
- '- **Value（对方内容）** = 你能提供的商业价值，而非应试答案'
- '- **Softmax（资源分配）** = 时间和精力不再花在刷题上，而是投向信息差、资源整合、产品经营等高杠杆环节'
- 就像考试是“固定标准答案的单选题”，赚钱是“动态寻找最优解的开放题”，认知破局就是你把自己从“答题者”切换为“出题人/解题经纪人”，让思维成为赚钱的杠杆。
summary:
- concept: 认知破局
  desc: 从“打工者思维”切换至“赚钱者思维”，释放主观能动性并重构商业模型，是普通人财富跃迁的前置必要条件。
exercises:
- 'no': 1
  title: 认知锚点自我诊断
  contents:
  - 请回答以下问题（不必给出标准答案，仅供你反思）：
  - 1. 你过去最依赖的‘标准答案’思维场景是什么？（例如：考证、考级、找稳定工作等）
  - 2. 在商业变现中，你目前最缺乏的‘后天可控变量’是哪一个？（赛道选择、红利捕捉、评价标准、主观能动性等）
  - 3. 试举一个你身边从‘出卖时间’转向‘经营资产’的具体案例，分析其核心差异在哪里。
- 'no': 2
  title: 中介视角切换练习
  contents:
  - 选一个你日常接触的信息或资源（如拼多多补贴商品、某技能课程、本地服务商），按以下步骤拆解：
  - 1. 如果作为消费者，你关注什么？（价格、质量、便利性等）
  - 2. 如果作为中介/分销者，你能为哪一方提供什么价值？（筛选、信任背书、渠道对接等）
  - 3. 切换视角后，原本需要‘辛苦挣钱’的场景，有没有变成‘弯腰捡钱’的机会？
- 'no': 3
  title: 资产型收入初步规划
  contents:
  - 列举你现有的一种可重复发售或边际成本趋近零的产品/服务形式（如知识笔记、代码模板、媒体账号、设计素材等），并回答：
  - 1. 第一次生产需要投入多少时间/精力？
  - 2. 第 N 份交付的边际成本近似为零吗？为什么？
  - 3. 若要将其从‘出卖时间’升级为‘经营资产’，缺少哪一个环节？（流量、信任、交付自动化等）
