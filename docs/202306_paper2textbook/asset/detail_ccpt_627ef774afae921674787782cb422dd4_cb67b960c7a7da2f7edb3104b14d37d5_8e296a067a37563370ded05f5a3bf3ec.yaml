units:
- 'no': 1
  name: AI认知协作范式 —— 让模型当“认知外脑”而非“打字机”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人把 AI 当“一键生成”工具，容易得到泛化、低质内容'
  - '- 缺乏结构化思考，输出无法复用，每次都要从零开始调教'
  - '- 缺少方法论沉淀，无法形成个人可复利的认知资产'
  - '**核心定义**'
  - '- 认知协作范式是指人与 AI 基于“目标拆解→标准调研→方法论沉淀→结构化提示词工程→迭代优化”的五步闭环进行协作，把 AI 定位为“大脑延伸”而非简单的任务代工'
  - '- 核心原则是“人治 AI”：人类负责审美、结构与判断，AI 负责执行与生成'
  - '**关键性质**'
  - '- 可复用性：同一套 Prompt 模板可跨项目、跨领域复用'
  - '- 可复利性：每次迭代都沉淀为可检索的方法论资产，而非一次性废料'
  - '- 结构可控：通过分层指令（续写/扩写/大纲控制）降低输出随机性'
  - '**典型例子**'
  - '- 使用 GPT-4 辅助写作：先由 AI 扮演“教练”训练用户构建提示词思维，再由用户反向指导 AI 产出结构化长文'
  - '- 杂乱素材→大纲→分段生成→人工润色，2 小时内产出高质量结构化文章'
  - '**边界条件**'
  - '- 若用户缺乏基本的专业判断力，AI 输出仅能成为“垃圾放大器”'
  - '- 过度依赖“一键生成”会导致认知萎缩，丧失独立思考与交叉验证能力'
  - '- 不适合需要深度情感共鸣或高度个性化表达的纯人文创作场景'
  sources:
  - paper: docs/202306/HEajdvRmbozwitxgBD3chKlDnbe.md
    role: origin
  - paper: docs/202306/YuFvdjdZBobrLpx5FcHcjyiin5g.md
    role: improve
  excerpts:
  - 确立人机协作的“认知协作模式”，拒绝“一键生成”浮躁心态
  - 通过“目标拆解→标准调研→方法论沉淀→结构化提示词工程→迭代优化”标准化流程
  - 实现从依赖运气的单次输出到可复用、可复利的方法论资产积累
  - 人类负责审美判断、结构把控、细节指令，AI 负责执行生成
  - 分层指令工程（续写/扩写细节/大纲控制）、微信搜索联想词优化标题、1:1爆款结构拆解复盘
