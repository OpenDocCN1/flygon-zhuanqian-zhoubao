  - paper: docs/202306/YsRgdNsJvoAYY3x7gUCcsnudnPc.md
- 'no': 22
  name: 短视频剪辑双轨SOP：PR粗剪+剪映精剪+去重三板斧
  desc: 工作流：PR三点式编辑（I/O标记入出点+M键打标+C键分割）按关键帧/语句边界粗剪→导入剪映智能字幕/TTS换声/BGM混音（口播BGM -15dB/人声+8dB）/贴纸/转场/滤镜/镜像裁剪→PR进阶去重：超级键抠图绿幕合成、高斯模糊遮挡水印/字幕、Lumetri曲线自定义调色。LosslessCut无损批量分割长素材。剪映列表模式支持I/O编辑可省回PR环节。
  role: method
  src:
  - paper: docs/202306/H0yedmj1QoEPPfxSLSCcED7xnZb.md
- 'no': 23
  name: 高客单价私域成交：信任前置与自动化体系
  desc: 珠宝/疗愈/塔罗/皮肤管理等赛道：粉丝量非核心指标（百粉变现、三百粉20万），信任前置成交。产品阶梯：引流款（免费/低价/随喜）→入门款（百元）→核心款（千元/师资课）→陪伴款（万级/合伙人）。转化SOP：Top20异议话术库+分层标签→意向锁定（区分业务意向/支付意向）→长周期运营（1-3月成单周期，朋友圈定时定类高质输出）→人设即信任。自动化：学员秒变运营助理，社群自运转。
  role: method
  src:
