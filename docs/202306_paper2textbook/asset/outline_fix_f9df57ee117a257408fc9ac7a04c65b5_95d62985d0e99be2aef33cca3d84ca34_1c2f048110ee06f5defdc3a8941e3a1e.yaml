  - paper: docs/202306/20230613_304.md
- 'no': 20
  name: 视频号直播投放：人货场为本，投放为器
  desc: 微信豆加热工具核心配置：目标组合6:3:1（成交/互动/涨粉）、自定义出价匹配人货场、兴趣标签选消费力而非品类、时长解耦直播时长（越长ROI越好）。四大漏斗指标诊断（曝光进入率/商品点击率/点击成交率/下单成交率）。冷启动30分钟/2小时熔断机制。底层：共享池博弈，UV值与GPM定胜负。终局拼供应链/场景/资金。
  role: method
  src:
  - paper: docs/202306/SXGvdR22do5QUmxqjCucpcnanmg.md
- 'no': 21
  name: 抖音SEO与小红书SEO：热门词优先与合集权重叠加
  desc: 抖音：热门词优先（冷门词无流量）、合集名称踩词权重最高（数据累积）、三模态踩词（文案/语音/字幕）、标题多重叠加、蓝V天然优势、昵称仅影响用户栏、豆荚冷启动投点赞/评论、合集持更对抗衰减、搜索行为模拟刷权重、延伸价值引流私域。小红书：关键词长尾词矩阵（目的地/景点/风格/技巧/文化/服务/热点）全维度植入标题/封面/正文/标签/评论。
  role: method
  src:
