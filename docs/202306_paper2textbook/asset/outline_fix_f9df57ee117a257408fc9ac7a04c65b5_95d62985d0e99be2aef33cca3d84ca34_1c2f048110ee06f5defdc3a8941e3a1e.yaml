- 'no': 24
  name: 匿名信/无人直播/群聊禁言：风向标项目生命周期与角色进化
  desc: 风向标项目周期：蓝海发现→验证闭环→公开曝光→千人下场→价格战红海化（48-72小时）。三种获利角色进化：阶段一小白必做‘快速行动者’积累反馈；阶段二转‘思路优化者’建立差异化；阶段三成‘已有准备者/卖铲子者’以资源杠杆收割红利。匿名信：矩阵剪辑引流+公众号挂发信通道+知识付费社群裂变，2月2万+。无人直播：三板块闭环（带货佣金/培训/供应链），SOP易学导致员工‘学会即走’，账号/SM资源为核心护城河，技术红皇后效应。群聊禁言：痛点制造式营销（帮客户痛一下）、红海期三板斧（AB话术/流量工业化/被动营销），卖铲子日入数万。
  role: method
  src:
