- 'no': 8
  name: 结构复刻>内容创新：爆款概率最大化定理
  desc: 在红利期，完全复刻验证过的爆款结构（文案/节奏/音乐/钩子）成功率远高于原创；核心竞争力在于素材获取与去重执行力。素材稀缺性（首发性/唯一性）决定流量上限，需建立‘素材即弃’机制与分级素材库。
  role: proof
  src:
  - paper: docs/202306/GJh0dHJVgoB1L5xb6p3c5uKVnCf.md
  - paper: docs/202306/20230613_288.md
- 'no': 9
  name: 无案例破局法：用‘量化努力过程’替代‘结果背书’建立信任
  desc: 新人无成功案例时，详细记录拆解数量、调研深度、请教专家次数等努力细节，以‘过程可靠’建立‘结果可期’的信任感，实现冷启动期的信任锚定。
  role: extension
  src:
  - paper: docs/202306/AwMHdgfqxomlshxeCdgcVpEMn9b.md
- 'no': 10
  name: 内容利用率与素材利用率：把一个爆款说100遍，建立外脑库
  desc: 核心主张：提高内容利用率（灵魂改编法保留核心改换开头/案例/结构）与素材利用率（三本账体系：收集箱/等待事项/归档资料，日清周清），执行‘带着答案找问题’反向生产，实现一次生产多次收益。
  role: extension
  src:
  - paper: docs/202306/20230627_128.md
- 'no': 11
  name: 平台视角逆向工程：从‘玄学细节’到‘底层逻辑’
  desc: 核心方法论：遇到关键决策节点时，切换至平台产品经理角色，推演平台限制逻辑（风控、反作弊、分发）与引导逻辑（激励、扶持），反推最优操作路径，规避低性价比动作。
  role: method
  src:
  - paper: docs/202306/20230613_171.md
- 'no': 12
  name: 知乎AI+SEO寄生虫流程：高权重平台长效获客
  desc: 全链路SOP：业务定位→三源挖词（站内/5118/规划师）→AI生成→人工‘人味儿化’改造（首尾加故事/口语化）→大纲式关键词布局→引流钩子植入→收录监控与5118反向复盘→变现。验证‘量变质变’与‘长周期排名’规律。
  role: method
  src:
  - paper: docs/202306/20230613_245.md
- 'no': 13
  name: 小红书引流隐写体系：主小号分离与非结构化传递
  desc: 风险隔离原则：主号产内容、小号担风险（发联系方式/群公告）。隐写式联系方式图（涂鸦遮盖敏感字）对抗OCR识别。公域→群聊→公众号→微信分级筛选模型，层层过滤提升LTV。私信即红线，一切深度沟通迁移私域。
  role: method
