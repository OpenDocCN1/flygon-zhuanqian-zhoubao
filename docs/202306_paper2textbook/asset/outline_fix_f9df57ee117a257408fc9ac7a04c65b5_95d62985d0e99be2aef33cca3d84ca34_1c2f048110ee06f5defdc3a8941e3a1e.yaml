  - paper: docs/202306/W8wjdOat3o0F5xx2UpIcsTienge.md
- 'no': 25
  name: 数据化选品与蝉小红采集：三维指标模型与RPA落地
  desc: 三维指标：需求度（互动数/笔记数）、电商价值（带货占比×商品数，权重2）、竞争度（行业笔记占比）。加权评分模型+否决门槛（商品<1000或带货占比<1%得0分）。RPA自动化采集蝉小红行业大盘/品类库→Excel清洗（万字符转数值）→互动笔记比（总互动/笔记数）降序筛选蓝海品类（婴儿油/课桌椅/悠悠球）。后羿采集器预登录+执行预操作（动态筛选）+瀑布流分页，全量采集15分钟。
  role: method
  src:
