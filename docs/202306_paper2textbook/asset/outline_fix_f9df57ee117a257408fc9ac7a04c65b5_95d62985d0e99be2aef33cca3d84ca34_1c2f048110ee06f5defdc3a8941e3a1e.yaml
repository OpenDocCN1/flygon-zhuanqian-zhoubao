  - paper: docs/202306/DdLvdWpB9o0D0cxXOjSc1YdznPd.md
- 'no': 26
  name: 小红书聚光投放：私信白名单与赛马机制
  desc: 合规前置：企业号+连投3天+销售申请‘私信开白’→可直接发微信。ROI双算法模型（投产比法/单流量价格法），1:12为合格线。赛马机制：3-5篇笔记分计划错峰/同跑，日预算100元，周耗500-700元筛选优胜计划长投。付费流选题：溯源同行‘赞助’标识笔记，提取共性与异常值（同选题异数据/弱账号强笔记）。目标选‘客资收集→私信开口量’，非‘种草/咨询量’。每日Excel复盘（消费/点击单价/CTR/私信单价/开口单价），1-2周固化SOP。避坑：付费流人群精准度劣于自然流、三态停损（正常/无效消耗/跑不动）、投放不影响自然流、重度违规号弃号换新。
  role: method
  src:
  - paper: docs/202306/EH1xdsKsWov8KYxHCticAU9Wn3d.md
