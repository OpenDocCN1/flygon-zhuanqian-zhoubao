- 'no': 18
  name: 小红书壁纸号：像素级模仿与高清原图变现
  desc: 冷启动100%模仿头部（风格/头像/昵称/简介/标签）。AI工具链：MJ生图→Upscayl超分4K→醒图定制模板。变现：免费种草（换互动）→平台压缩画质痛点→高清原图钩子→阶梯会员制（单张/多张/包年）→网盘交付。小程序分成因二次压缩失效。薯条投放ROI为负。
  role: method
  src:
  - paper: docs/202306/VGqDd4WMjoel5HxQFd2chn5znvm.md
- 'no': 19
  name: 公众号‘看一看精选’与‘问一问’双红利获客
  desc: 看一看精选：AB Test机制，无审核/不看权重/非原创可入池，CTR定生死。三张图阈值触发大图模式，AI美女图+标题党高CTR。七天连更概率论（7倍入池概率）。ChatGPT批量洗稿情感文月入8W流量主。问一问：搬运知乎高赞回答→视频号作答→关联公众号→自动回复/菜单栏导私域，丝滑闭环。
  role: method
