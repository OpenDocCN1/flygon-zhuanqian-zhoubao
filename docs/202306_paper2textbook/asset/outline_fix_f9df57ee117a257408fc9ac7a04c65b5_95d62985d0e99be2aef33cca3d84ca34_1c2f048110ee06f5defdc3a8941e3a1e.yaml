- 'no': 16
  name: 同城实体店短视频：发传单逻辑与头尾露脸范式
  desc: 同城号本质是‘发传单’，核心矛盾是动作成本。标准化范式：IP仅露头尾5秒（建信任/促行动），中间混剪素材+照稿念，单条10分钟。总部赋能（文案/素材/运营）+店端执行（拍摄/核销），引流品（199元）钩子+后端高客单转化，隐性流量（到店不下单）是显性4倍。
