paper: docs/202306/Z073dMlcmomg5CxeZKQcd5Y6nVg.md
desc: 该素材是一份关于制作“思维语录类短视频（图片会说话）”的实操教程，核心流程包含：使用Midjourney生成原创人物图片、提取或制作语录音频、利用CrazyTalk
  8软件驱动静态图片实现嘴唇同步动画、最后在剪映中合成视频。教程详细拆解了软件安装、AI作图提示词技巧、面部关键点定位、音频驱动设置、蒙版合成等关键技术节点，并给出了该赛道月涨粉10万+的运营数据佐证，适合零基础小白快速上手制作原创短视频并实现变现。
concepts:
- name: 思维语录视频
  desc: 一种以静态人物图片（老人、和尚等）配合语录音频，通过AI驱动嘴部动作使图片‘会说话’的短视频内容形态，具有制作门槛低、易过原创、涨粉快、变现路径清晰（收徒、卖书、小程序）的特点。
  is_original: false
  excerpt:
  - 今天给大家拆解一个最近一个月短视频平台超级火，涨粉超快，变现可观的项目，就是通过一张图片，给她配上思维语录、禅语、创业语录等音频，同时图片的嘴巴是动的视频。
  - 变现方面，起号后可以收徒、卖书、做小程序等，基本上整个项目是又简单，涨粉又快。
- name: CT8-CrazyTalk 8 Pipeline
  desc: 教程选定的核心驱动软件，特点是中文界面、傻瓜式安装、操作简单，支持通过导入音频自动生成2D人物面部嘴唇同步动画，并可内置牙齿修饰功能。
  is_original: false
  excerpt:
  - 目前这类软件有三种，经过我对比测试，选择了 CT8-CrazyTalk 这款软件。特点是中文、界面简单、操作简单、小白上手就会。
  - 首先按照标记的顺序安装...切记，千万不要改变默认安装路径。否则可能是英文版本。
- name: Midjourney 共享账号
  desc: 教程推荐的低成本获取AI作图工具Midjourney的方式，通过淘宝购买月租16-32元的共享账号，避免官方订阅高昂费用及注册门槛。
  is_original: true
  excerpt:
  - 首先到某宝购买Midjourney，这里不建议大家自己注册账号并充值，因为自己充值很贵，一个月要几百块。我们到某宝上只需要购买下图这种一个月16-32元的共享账号即可。
- name: Discord 私有服务器部署
  desc: 在Discord中创建个人服务器并添加Midjourney Bot的标准化流程，用于隔离生成环境、便于管理历史记录及提示词迭代。
  is_original: false
  excerpt:
  - 点击左下角的加号，创建自己的服务器...然后点击左下角的导航图标，进去之后，选择Midjourney社区...点击Midjourney，添加Midjourney机器人，安装到我们的服务器。
- name: 纯色背景提示词策略
  desc: Midjourney生成人物图时，刻意不生成复杂背景（如书架），改用纯色/素背景，以规避后期CrazyTalk面部识别错误及剪映合成时抠像困难的问题。
  is_original: true
  excerpt:
  - 这里建议描述与不要写书架，选择素背影。因为后期做的视频可能会有问题。
- name: 抖音竖屏比例参数 (--ar 9:16)
  desc: Midjourney提示词后缀参数，强制生成符合短视频平台（抖音/快手/视频号）标准竖屏比例的图片，免去后期裁剪变形损耗。
  is_original: false
  excerpt:
  - 注意——在输入描述语之后，后面加上 --ar 9:16 这样他会生成抖音比例的图片
- name: 面部关键点定位
  desc: CrazyTalk将静态图转为动态模型的核心校准步骤，包含：头部框选、眼角/嘴角定位、面部轮廓拟合、鼻子轮廓拟合，决定最终驱动效果的自然度。
  is_original: false
  excerpt:
  - 点击切割按键，框选老人的头部...如图所示，将眼角和嘴角选到合适的位置...通过鼠标拖动，将脸部轮廓定位...将鼻子轮廓定位。
- name: 仅嘴唇同步模式
  desc: CrazyTalk音频驱动的三种模式之一，教程实测推荐仅驱动嘴唇不动面部表情，避免生成僵硬/恐怖谷效果，提升视频真实感。
  is_original: true
  excerpt:
  - 选择说话模式或者仅嘴唇同步...一般只选择第三个。
- name: 内置牙齿修饰
  desc: CrazyTalk自带的嘴部细节优化功能，通过双击牙齿图标自动添加牙齿模型并支持微调位置，解决张嘴无牙‘难看’的硬伤。
  is_original: false
  excerpt:
  - 生成好之后，我们点击播放就发现嘴巴懂了，但是没有牙很难看。我们选择左上角的嘴巴按钮...双击牙齿之后，嘴巴就有牙了。我们在根据情况微调牙齿的位置。
- name: 剪映圆形蒙版融合
  desc: 将CrazyTalk导出的动态头部视频覆盖至原静态全身图上，利用圆形蒙版仅保留面部动态区域，实现‘身子不动、嘴巴动’的无缝合成技巧。
  is_original: true
  excerpt:
  - 再讲做好的动态头部拖入剪映...然后选中头部图层，然后我们选择圆形型蒙版进行选择脸部选择即可...这样一个视频雏形就完成了
methods:
- name: __overview__
  desc: 思维语录视频全流程标准化制作方法论：AI生图(纯背景+竖屏比) -> 音频获取(去水印转MP3/原创配音) -> CrazyTalk面部建模(关键点定位+仅嘴唇同步+加牙齿)
    -> 剪映蒙版合成(全身静图底图+动态头部叠加) -> 发布变现。
  excerpt:
  - 整体的流程超级简单，做出来的就是原创视频，不被判搬运和重复，熟练后基本上十几分钟一个视频。
  - 1、软件安装... 2、素材寻找和制作... 3、如何使图片的嘴巴会说话 4、视频的合成 5、如何精进视频
- name: 音频素材获取与制作法
  desc: 双通道获取音频：通道一，抖音/快手搜索同类爆款视频 -> 轻抖小程序去水印下载 -> 格式工厂转MP3；通道二，使用网络配音软件合成原创语音，规避版权风险。
  excerpt:
  - 可以在抖音、快手平台搜索老人思维语录、创业语录、禅语等关键字...打开“轻抖小程序”去水印下载视频...将视频素材拖入“格式工厂”软件转换成mp3格式
  - 或者也可以选择网络上的配音软件进行配音，这样声音也相当于原创声音，效果更加。
- name: Midjourney 实景级人物生成法
  desc: 基于Discord私有服务器，使用结构化提示词（主体特征+环境排除+比例参数）生成写实风格竖屏人物图，利用U/V变体机制筛选优化至满意。
  excerpt:
  - 登录https://discord.com/...创建自己的服务器...添加Midjourney机器人...输入描述语...后面加上 --ar 9:16...等待百分百运行到100%...U1-U4：放大单张；V1-V4：以图生图变体。
- name: CrazyTalk 8 照片驱动标准化流程
  desc: 导入图片选择2D -> 头部裁剪 -> 4步关键点定位(眼角嘴角/面部轮廓/鼻子轮廓) -> 导入音频选择'仅嘴唇同步' -> 启用内置牙齿并微调
    -> 导出MP4。
  excerpt:
  - 用鼠标将图片拖入软件内，选择2D...点击切割按键，框选老人的头部...将眼角和嘴角选到合适的位置...通过鼠标拖动，将脸部轮廓定位...将鼻子轮廓定位...选择输入声音...一般只选择第三个...双击牙齿之后，嘴巴就有牙了...点导出，选择MP4格式导出。
- name: 剪映‘静身动嘴’蒙版合成法
  desc: 底层放置原始全身静态图(拉满9:16画面) -> 顶层放置CrazyTalk导出动态头部视频(对齐时长) -> 顶层添加圆形蒙版仅露出面部 -> 实现身体静止、嘴部动态的无缝融合。
  excerpt:
  - 首先将图片导入剪映，比例选择9:16，将图形放大到充满整个画面...再讲做好的动态头部拖入剪映，将图片的长度拉到和视频一样的长度...然后选中头部图层，然后我们选择圆形型蒙版进行选择脸部选择即可
theorems:
- name: 低门槛高产出原创认定论
  desc: 利用AI生成原创画面素材+音频二创/原创配音+软件驱动生成动态画面，组合输出的视频平台判定为原创，不触发搬运/重复检测机制。
  excerpt:
  - 整体的流程超级简单，做出来的就是原创视频，不被判搬运和重复，熟练后基本上十几分钟一个视频。
- name: 赛道红利期变现确定性论
  desc: 思维语录赛道当前处于流量红利期，账号起号极快（半月5万->17万），变现模式成熟（收徒/卖书/小程序），外部培训收费499-999元，存在显著信息差套利空间。
  excerpt:
  - 上图1小和尚6月9日五万粉丝，现在半个月过去了，已经17万粉丝了...变现方面，起号后可以收徒、卖书、做小程序等...外面有培训这个项目都要499-999，也别让人家去割你韭菜
- name: 纯背景规避合成风险论
  desc: AI生图阶段主动放弃复杂场景背景（指定纯色背景），可预防后续CrazyTalk面部识别干扰及剪映蒙版合成边缘抠像困难，是保证成片质量的关键前置决策。
  excerpt:
  - 这里建议描述与不要写书架，选择素背影。因为后期做的视频可能会有问题。
- name: 仅唇动拟真最优论
  desc: 在CrazyTalk驱动模式中，放弃全脸表情驱动，仅保留嘴唇同步，能有效规避AI生成面部表情僵硬、恐怖谷感强的问题，是提升视频真实感的最优策略。
  excerpt:
  - 选择说话模式或者仅嘴唇同步...一般只选择第三个。
findings:
- name: 账号增速实证数据
  desc: '[evidence] 文中展示案例账号‘小和尚’在半个月内粉丝从5万增长至17万（月增12万），印证了该赛道极高的涨粉效率与流量潜力。'
  excerpt:
  - 上图1小和尚6月9日五万粉丝，现在半个月过去了，已经17万粉丝了，可以自行搜索账号查看。
- name: 制作时效实测数据
  desc: '[claim] 作者宣称熟练操作后单条视频制作耗时可控制在‘十几分钟’以内，展现极高的内容生产效率。'
  excerpt:
  - 熟练后基本上十几分钟一个视频。
- name: 市场培训定价锚点
  desc: '[evidence] 市场同类项目培训收费普遍在499-999元区间，侧面验证了该技能组合的商业价值与变现确定性。'
  excerpt:
  - 外面有培训这个项目都要499-999
- name: 软件选型避坑经验
  desc: '[evidence] 作者对比测试三款同类驱动软件后，确定CrazyTalk 8为最优解（中文/简单/傻瓜式），并发现修改默认安装路径会导致界面变为英文的兼容性Bug。'
  excerpt:
  - 目前这类软件有三种，经过我对比测试，选择了 CT8-CrazyTalk 这款软件...切记，千万不要改变默认安装路径。否则可能是英文版本。
- name: MJ共享账号成本优势
  desc: '[evidence] 淘宝共享账号月费16-32元，远低于官方标准订阅费（几百元/月），大幅降低了个体创作者的试错成本与固定支出。'
  excerpt:
  - 自己充值很贵，一个月要几百块。我们到某宝上只需要购买下图这种一个月16-32元的共享账号即可。
