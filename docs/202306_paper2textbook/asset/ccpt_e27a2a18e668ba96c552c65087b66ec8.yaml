paper: docs/202306/20230627_104.md
desc: 该素材由生财有术圈友猎音狮分享，核心在于公开其抖音图书带货的“洗稿”方法论——即通过“留、增、删、调、换”五字诀对爆款文案进行二次创作，结合付费投流（DOU+商家代投模式）实现暑假作业教辅单品5000多套、利润1.3万的实战成果。素材详细记录了从选品、起号、投流模式选择到文案具体改写对比的全流程，强调“能卖货的文案才是好文案”以及“付费时代拼的是素材质量”两大核心认知，并展示了黄金三秒钩子设计、痛点植入、年级泛化等具体战术细节。
concepts:
- name: 留增删调换洗稿法
  desc: 作者原创的短视频文案二次创作五步法，通过保留核心卖点、增强表达丰富度、删除冗余、调整叙事顺序、替换产品关键词，实现从“抄袭”到“超越”原版文案的转化。
  is_original: true
  excerpt:
  - 这是我以前做自媒体时候自己研究出来的，就五个字：留，增、删、调、换
  - 留：保留主要信息 增：增加丰富表达（这一步就是超越的部分） 删：删除多余或者无用文案 调：调换顺序 换：替换内容
- name: 商家代投模式
  desc: 抖音图书带货的一种合作模式，达人仅负责产出视频素材，商家负责投流与发货，达人拿较低佣金但无需承担广告成本风险，适合新手及规模化复制。
  is_original: false
  excerpt:
  - 投流有两种方式：第一、拿高佣，自己投！第二、低佣，商家代投！
  - 很多圈友看到代投的佣金都很低，喜欢第一种方式，但是投了一久下来，发现赚钱的反而是第二种。
- name: 黄金三秒延伸
  desc: 短视频前3秒留人核心策略，要求新增开头钩子、首帧带文字，直击用户痛点（如考试扣分重灾区、年级分水岭），建立紧迫感与相关性。
  is_original: true
  excerpt:
  - 黄金三秒延伸：新增前三秒开头、首帧带文字
  - 孩子#期末考试的扣分的重灾区都在这!看，这就是考试的重灾区(易错题或者暑假一本通复习册)
- name: 年级泛化话术
  desc: 通过将文案中的具体年级（如二升三）参数化为变量（x升x），实现单条文案结构覆盖小学全学段，批量生产适配不同年级家长的定向素材。
  is_original: true
  excerpt:
  - ●二年级欠的债，三年级是要还的! (年级以此类推)
  - ● x 年级升 x 年级，复习捷径他来了! (年级以此类推)
methods:
- name: __overview__
  desc: 抖音教辅图书付费带货标准化作业流程：1. 选品锚定爆款单品（暑假一本通）；2. 寻找对标爆款视频文案；3. 应用‘留增删调换’法重写文案，重点强化黄金三秒与年级泛化；4.
    拍摄制作素材（可无实物书，用网盘素材）；5. 对接商家代投，达人专注产出素材；6. 爆款素材复投放大。
  excerpt:
  - 短视频付费打法，其实对新手很友好！... 只要你开通小黄车，都可以干！
  - 整个事情的落地，还是回到了视频制作上... 你没打起来，他就在半边笑话你... 这个爆单的小伙伴，当时也没有样书，用的是我拍好给大家上传百度网盘的素材。
  - 好了，今天我就重点来聊聊洗稿！... 爆款文案（卖猿辅导的）... 我改了一下，用来卖小橙同学的暑假一本通
- name: 文案实战改写法
  desc: 针对单条爆款文案的逐行重构操作：保留‘暑假逆袭/分水岭/重灾区’核心逻辑（留）；前置‘扣分重灾区/年级债’痛点钩子，首帧加字（增）；去除品牌强绑定词（删）；将产品介绍后置，痛点前置（调）；将‘猿辅导’替换为‘小橙同学/暑假一本通’，年级具体化为变量（换）。
  excerpt:
  - 爆款文案（卖猿辅导的）：来源于账号：榜样妈妈团图书... 文案：二年级的暑假是最可怕的！不用功，开学差距就拉开了！
  - 我改了一下，用来卖小橙同学的暑假一本通：黄金三秒延伸：新增前三秒开头、首帧带文字 孩子#期末考试的扣分的重灾区都在这!... ●二年级欠的债，三年级是要还的!
    (年级以此类推)... 有远见的妈妈，这套猿辅导的暑假一本通早就给孩子安排上了 -> 换为小橙同学/暑假一本通
theorems:
- name: 付费时代拼素材论
  desc: 在抖音电商付费流量阶段，自然流‘看天吃饭’不稳定，付费流打破粉丝门槛，公平竞争的核心变量是视频素材质量（文案+拍摄），而非账号权重或粉丝量。
  excerpt:
  - 自然流时代，能把号做起来，确实不容易，哪怕爆了，也是看天吃饭... 付费时代，你只需要把内容做好就行，然后拿来投流！不看粉丝，只看视频质量
  - 自然流时代，你开通橱窗，哪怕有 10 万粉，赚钱都很难，所以我说，付费时代，大家都是公平的，就看谁拍的素材牛，拼素材！
- name: 文案价值唯转化论
  desc: 带货文案的唯一评价标准是转化率（卖货能力），而非文学性或原创性；爆款文案背后是大量A/B测试沉淀的高转化结构，直接借鉴并优化（洗稿）比原创试错ROI更高。
  excerpt:
  - 我文案从来不自己写... 我自己拍脑袋想出来的，没卵用！还是要学习借鉴热门文案，因为你不知道，人家起来一个热门的文案，这期间不知道测试了多少文案了
  - 能卖货的文案才是好文案，卖不了货，哪怕你用文言文写，在带货角度，并没有任何价值！
- name: 先发制人红利论
  desc: 在趋势品（如暑假教辅）爆发期，第一时间上架素材抢占流量红利至关重要；犹豫观望者将沦为炮灰，执行力与素材准备速度决定上限。
  excerpt:
  - 我们出品打的时候，要第一时间上，这样才能吃肉，很多圈友就是观望，抱着个手在旁边看... 所以，在这个卷成狗的时代，不积极真的就是炮灰了！
  - 这个爆单的小伙伴，当时也没有样书，用的是我拍好给大家上传百度网盘的素材。
findings:
- name: 暑假一本通单品爆发案例
  desc: '[evidence] 通过洗稿文案+商家代投模式，单视频推广‘暑假一本通’教辅，实现销量5000+套，播放量2468万，点赞7000+，点赞转单比约1:1，利润1.3万元。'
  excerpt:
  - 我洗稿卖暑假作业，一个视频出了5000 多套！
  - 目前 246.8w 播放，点赞 7000＋，差不多一个赞成交一单了！
  - 目前卖了 5000 套＋，还在飙升中……
- name: 新人商家代投起号案例
  desc: '[evidence] 团队新人小伙伴，新号真人出镜，采用商家代投模式，无样书使用网盘公共素材，单周利润达到1万元，验证了‘无粉丝、无样品、低佣金’也能快速跑通模型。'
  excerpt:
  - 我们来看看团队的这个小伙伴，刚起的新号，做真人出镜，一周赚 1w，就是商家代投！
  - 这个爆单的小伙伴，当时也没有样书，用的是我拍好给大家上传百度网盘的素材。
- name: 作者收入跃升验证
  desc: '[claim] 作者宣称加入生财有术社群70天，月收入从稳定5万跃升至稳定10万，并归因于社群‘真诚利他’文化及自身执行力提升。'
  excerpt:
  - 加入生财前，我的收入是平均每个月 5w，加入后，目前都是每个月稳定 10w。
  - 总结亦仁老师把生财有术做得那么成功的精髓，提炼出来四个字：真诚，利他！
