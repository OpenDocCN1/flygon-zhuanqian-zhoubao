units:
- 'no': 1
  name: AI投喂范式 —— 让数据变成可执行指令
  points:
  - '**为什么需要这个概念？**'
  - '- 大众将 AI 当成“万能打字机”，直接发送模糊指令，输出质量低且不可控'
  - '- 缺乏结构化输入方法，导致无法释放大模型的通用处理能力'
  - '- 普通人缺乏从“数据拥有者”到“AI任务委托者”的交互范式'
  - '**核心定义**'
  - '- 投喂是指向 ChatGPT 输入特定格式数据（PDF、网页链接、表格、文本、聊天记录、书籍、公众号等）并配合提示词，以触发模型执行分析、总结、提取、模仿等特定任务的交互范式'
  - '- 七大核心场景：文档分析、联网查询、表格分析、文本风格模仿、对话记录分类、长文本速读、特定知识库问答'
  - '**关键性质**'
  - '- 输入源必须结构化/可解析，模糊输入导致模糊输出'
  - '- 不同数据源对应不同提示词模板，需建立标准化操作手册'
  - '- 投喂是释放 LLM 通用能力的前置技能，而非一条 Prompt 即可出成品'
  - '**典型例子**'
  - '- 输入一份行业 PDF，要求提炼核心观点与趋势摘要'
  - '- 输入亦仁公众号历史文章，提取其对特定商业问题的看法'
  - '**边界条件**'
  - '- 数据源若不可访问或格式混乱，投喂将失效'
  - '- 长文本需分段处理，超出上下文窗口会导致信息丢失'
  - '- 模型生成内容存在幻觉风险，关键信息需人工核查'
  sources:
  - paper: docs/202306/20230613_202.md
    role: origin
  excerpts:
  - 《ChatGPT 投喂指南》我想要让 ChatGPT 做这些事：给它一份 PDF，让它分析摘要、提炼内容；让它去看某个网页，帮我查询最新的信息；给它一份数据表格，让它分析出数据的变化；给它一份文本，让它总结、模仿出相似的风格；给它一个聊天记录，让它把你的好友进行分类和打标签；给它一本书，让它快速读完，并且告诉我书里都讲了什么；给它亦仁的公众号，让它告诉我亦仁对于某个问题是什么看法....
  - 飞书文档链接：https://k0z8o16zas8.feishu.cn/docx/SUTKd7wdDoAg2Exv7hoc8m0BnOK
- 'no': 2
  name: 懒人简笔画 —— 把零门槛变成表情包生产线
  points:
  - '**为什么需要这个概念？**'
  - '- 新手面对 AI 绘画工具参数复杂，易陷入“炼丹”陷阱，产出与商业脱节'
  - '- 缺乏低门槛的风格定位，导致作品缺乏辨识度和变现路径'
  - '- 普通人缺乏从“出图”到“商品级交付”的工具链闭环'
  - '**核心定义**'
  - '- 懒人简笔画是一种适合新手快速上手的 AI 绘画风格，以极简线条感与表情包趣味性结合为特征，基于个人战略才干定位选取，配合免 PS 工具链产出动态表情包'
  - '- 核心公式：个人才干定位 × 低门槛工具链 × 场景化变现'
  - '**关键性质**'
  - '- 不卷技术参数，卷定位与场景契合度'
  - '- 表情包承载社群“你懂我懂”的共识，是社群货币化的载体'
  - '- 完整实操闭环包含：风格探索→提示词跑通→免PS动态表情包制作→变现玩法挖掘'
  - '**典型例子**'
  - '- 针对生财有术社群文化定制的表情包，用一个“懂”的表情替代千言万语'
  - '- 利用 AI 生成简笔画头像，结合 Notion AI 输出文案与运营素材'
  - '**边界条件**'
  - '- 风格需与目标社群文化匹配，否则缺乏传播动力'
  - '- 动态表情包制作仍需基础图层/帧处理能力，非完全零门槛'
  - '- 变现依赖社群信任积累，短期难以规模化'
  sources:
  - paper: docs/202306/20230613_203.md
    role: origin
  excerpts:
  - 新手也可以快速上手的 AI 绘画：懒人简笔画及衍生动态表情包篇
  - 亦仁老师说：有些时候，千言万语抵不过一个你懂我懂的表情包。而在社群的特有文化中，也不能缺少表情包。
  - 飞书文档：https://zf8mp27jub.feishu.cn/docx/S9SddaKHMoQEflxP6RucOtqGnCb?from=from_copylink
- 'no': 3
  name: 敏感领域合规 —— 用外部托管绕过审核红线
  points:
  - '**为什么需要这个概念？**'
  - '- 风水命理、玄学等高风险内容触发平台敏感词极易被删除、封号'
  - '- 创作者缺乏系统性合规运营方案，正文直接发布生存率极低'
  - '- 需要一种既能传递核心干货又能规避平台审核的内容分发架构'
  - '**核心定义**'
  - '- 敏感领域合规是指利用 ChatGPT 生成系统性合规话术与方案，将核心干货迁移至飞书等外部载体，通过正文引流到外部文档获取完整内容的双重保障策略'
  - '- 核心逻辑：正文洗白 + 外部托管 + 引流分发'
  - '**关键性质**'
  - '- 平台正文仅留安全引流入口，不承载违规核心内容'
  - '- AI 扮演合规顾问，输出针对特定领域的规避审核分析'
  - '- 飞书等外部文档承载高敏感信息，降低封号风险'
  - '**典型例子**'
  - '- 针对“6+2卦/风水命理”内容，向 ChatGPT 提问规避敏感词方法，将详细方案托管至飞书文档'
  - '- 正文发布“看 chatgpt 怎么分析...内容敏感词太多，大家移步飞书吧”'
  - '**边界条件**'
  - '- 外部链接仍可能被平台拦截，需备用分发渠道'
  - '- 模型生成的合规方案不等于法律合规，版权与侵权风险需自担'
  - '- 引流转化率低于直接发布，存在流量损耗'
  sources:
  - paper: docs/202306/20230613_204.md
    role: origin
  excerpts:
  - 风生水起，6+2 卦玄学方面方面怎么规避敏感被删除被封号的问题
  - 看 chatgpt 怎么分析：风生水起，6+2 卦玄学方面怎么规避敏感被删除封号 https://und276ymfr.feishu.cn/docx/KKACdp31KoAyyuxTpHEcA3a2nhd
  - 废话不多说，看看现在 chatgpt 大数据怎么说，或许会给你一些启发。内容敏感词太多，大家移步飞书吧。
- 'no': 4
  name: ChatGPT 联网选题 —— 让热点变成可复制选题
  points:
  - '**为什么需要这个概念？**'
  - '- 传统人工搜罗热点效率低、时效性差，容易错过流量窗口'
  - '- 盲目蹭热点与账号 IP 定位脱节，导致内容质量低且无粉丝积累'
  - '- 缺乏结构化选题工作流，创作陷入“灵感依赖”'
  - '**核心定义**'
  - '- ChatGPT 联网选题是指利用 ChatGPT-4 联网及插件功能，实时捕捉全网热点，结合自身 IP 定位进行筛选与适配，产出符合账号调性的高潜力选题的工作流'
  - '- 核心主张：选题即正义，蹭热点是爆款选题最快捷径'
  - '**关键性质**'
  - '- 联网功能突破训练数据时效限制，实现实时热点聚合'
  - '- 选题流程从“人工搜罗→筛选→构思”升级为“AI 实时检索→热点聚合→结合 IP 定位输出”'
  - '- 需结合账号人设、领域、受众画像进行二次筛选，非盲目跟风'
  - '**典型例子**'
  - '- 小红书/抖音创作者利用 GPT 联网追踪实时事件，结合个人情感文 IP 产出爆款选题'
  - '- 作者作为 GPT 老司机，3 篇精华帖验证方法论生命力'
  - '**边界条件**'
  - '- 联网功能依赖平台 API 稳定性，可能出现服务中断'
  - '- 热点时效性极强，捕捉后需立即制作，否则流量窗口已关闭'
  - '- 蹭热点需遵守平台内容合规红线，避免蹭敏感政治类热点'
  sources:
  - paper: docs/202306/20230613_205.md
    role: origin
  excerpts:
  - 5 月 16 日开始，ChatGPT4.0 已经在陆续开放联网和插件功能。ChatGPT 联网后在自媒体创作最大的帮助是什么？是找热点！！！
  - 不管是小红书还是抖音，自媒体创作重要的是什么？是选题！最容易爆的选题方法是什么？是蹭热点！！
  - 作为从去年 12 月就开始用 GPT 写文案的 GPT 老司机、在生财发布 3 篇关于 ChatGPT 的精华帖、正在担任生财本次 5 月份 ChatGPT+自媒体航海教练的小凡
- 'no': 5
  name: 海外工具站 —— 把 AI 能力变成可售卖产品
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人缺乏从“会用 AI”到“做成产品”的商业模型，容易停留在工具使用层面'
  - '- 缺乏系统的选品判断标准，盲目跟风开发竞争激烈的通用工具'
  - '- 不清楚如何将 OpenAI 能力转化为可落地的海外变现业务'
  - '**核心定义**'
  - '- 海外工具站是指围绕 ChatGPT/OpenAI 能力，针对海外利基市场开发的专用工具站点，变现模式分为“卖流量”（免费工具+广告/联盟）和“卖产品”（付费工具+完整销售链路）两大范式，可双重变现'
  - '- 选品铁律：市场需求 + ChatGPT 强相关 + 普通人可控复杂度'
  - '**关键性质**'
  - '- 围绕巨头 ChatGPT 做补充需求工具（Input/Output/Workflow/Prompt 缺口）'
  - '- 将 OpenAI 能力视为通用基座（类 OCR），结合垂直场景（邮件、亚马逊运营、SEO）开发专用工具'
  - '- 支持“卖流量”与“卖产品”双轨并行，1+1>2'
  - '**典型例子**'
  - '- Voice Control For ChatGPT：语音交互补充工具'
  - '- ChatGPT To Notion：会话归档知识库工具'
  - '- ProSEOAI：谷歌 SEO 内容生成付费工具站'
  - '**边界条件**'
  - '- 工具需与 OpenAI 官方插件生态差异化，避免被平台功能更新直接覆盖'
  - '- 跨境收款、海外推广存在语言与文化门槛'
  - '- 利基市场规模有限，难以实现规模化垄断'
  sources:
  - paper: docs/202306/20230613_206.md
    role: origin
  excerpts:
  - 如图，ChatGPT 海外工具站也分为 卖流量 和 卖产品 赚钱。同时卖流量和卖产品是否可行？ 当然可以。拥有流量意味着可以同时销售自己的产品和流量，只需确保相关性和目标客群的一致性即可。这样做可以实现双重变现效果。
  - 分析这个问题，其必要因素 1. IDEA：说明有市场需求 2. ChatGPT 相关：市场需求跟 ChatGPT 相关，或 OpenAI 能力能更快更好的解决
    3. 普通人：说明实现成本或复杂度不高
  - 如何找到这些需求... 这些我都是在谷歌插件通过下面关键词搜索到的 1. ChatGPT To xxx 2. Xxx For ChatGPT
- 'no': 6
  name: LeiaPix 3D 视频 —— 把 2D 图像变成立体动态
  points:
  - '**为什么需要这个概念？**'
  - '- 传统 3D 视频制作门槛高、成本贵，普通人无法参与'
  - '- 缺乏低成本的多模态视频制作工具链，内容生产受限'
  - '- 需要一种零成本、低技术门槛的 3D 动态视频生产方案'
  - '**核心定义**'
  - '- LeiaPix Converter 是一款可将 2D 静态图像转换为 3D 立体动态视频效果的免费 AI 工具，与 ChatGPT（创作故事/脚本）、Midjourney（生成关键帧）组合，形成端到端
    AI 视频制作工作流'
  - '- 应用场景：动态壁纸、动态头像、动态 Logo、广告、短视频'
  - '**关键性质**'
  - '- 完全免费，输出效果逼真'
  - '- 工作流：故事创作→脚本分镜→提示词工程→图像生成→3D 转换→后期合成'
  - '- 单点 AI 工具需与剪映等剪辑软件衔接，形成完整视频管线'
  - '**典型例子**'
  - '- 用 ChatGPT 写小故事，Midjourney 画画面，LeiaPix 转 3D，剪映加字幕音乐，制作商业级 3D 视频'
  - '- 制作中视频和短剧 CPS 推广素材'
  - '**边界条件**'
  - '- LeiaPix 仅负责 2D 转 3D 片段生成，后期合成、字幕、配音仍需人工或其他工具'
  - '- 视频时长与分辨率可能受免费版限制'
  - '- 商业变现依赖平台流量分发机制，不保证收益'
  sources:
  - paper: docs/202306/20230613_207.md
    role: origin
  excerpts:
  - 又发现一个宝藏工具，LeiaPix Converter，可以将图像 2D 转换为 3D 效果。关键的是目前完全免费。
  - 首先，使用 ChatGPT 创作一段小故事。接着，将该故事转化为视频脚本，并将其分割为各个镜头。通过镜头描述，运用 Midjourney 提示词来绘制每个画面的想象图，然后将每个画面输入
    LeiaPix，将 2D 图像转变为 3D 立体效果的视频。重复这个过程，直到得到所有 3D 画面的视频。最后，将所有视频片段连接在一起，并添加字幕进行朗读。同时，为视频添加背景音乐以增添氛围。
  - 完整过程移步飞书文档：https://esouqpttmy.feishu.cn/docx/V3NWdI08Yo4R9lxcIdScEMwanWb
- 'no': 7
  name: LLaMA 私有化部署 —— 让 ChatGPT 离线化、私有化
  points:
  - '**为什么需要这个概念？**'
  - '- 企业不敢将核心数据上传公有云 API，存在数据泄露与合规风险'
  - '- 公有云大模型无法满足 ToB 数据隐私与本地化部署需求'
  - '- 普通人缺乏低成本构建私有 ChatGPT 的工程路径'
  - '**核心定义**'
  - '- LLaMA 私有化部署是指基于开源基座模型 LLaMA，利用少量高质量指令数据（清洗后的 ShareGPT GPT-4 子集）进行指令微调，构建可在私有服务器或离线硬件（如
    U 盘）上独立运行的 ChatGPT 级模型'
  - '- 核心范式：预训练赋能，微调唤醒'
  - '**关键性质**'
  - '- 不需要从头预训练，仅需获取强基座并注入高质量指令数据即可低成本获得商用级模型'
  - '- Vicuna 仅用 3 周时间，效果达到 90%+ ChatGPT 水平；LIMA 仅需 1000 条数据即可超越 DaVinci-003'
  - '- 受限于 LLaMA 中文能力不足，短期聚焦英文出海 ToB 场景'
  - '**典型例子**'
  - '- 未来 6 个月内将出现私有独立部署的 ChatGPT 版本，甚至装在 U 盘类似硬件中，即插即用'
  - '- 盈腾/斗学科技聚焦决策机器人、智能客服私有化部署，两个月实现 73.2 万营收'
  - '**边界条件**'
  - '- LLaMA 词表与语料以英文为主，中文能力被“阉割”，微调难以根本弥补'
  - '- 中文场景私有化部署需等待原生中文基座模型（如 Chinese-LLaMA、Baichuan、Qwen）开源'
  - '- 模型训练与部署仍需一定工程能力，非完全零门槛'
  sources:
  - paper: docs/202306/20230613_208.md
    role: origin
  - paper: docs/202306/20230613_126.md
    role: improve
  excerpts:
  - Facebook 开源了 LLaMA 基础模型，从此产生了很多基于 LLaMA 微调的模型，Vicuna 仅用 3 周时间，效果达到 90%+ ChatGPT
    水平
  - 目测在未来 6 个月内，将会出现私有独立部署的 chatgpt 版本，甚至装在一个 U 盘类似的硬件当中，即插即用，toB 商业场景巨大
  - llama 不是说对中文支持比较差么，fine-tuning 能弥补么 闲富：不能，basemodel 阉割了中文，所以，做就来以后做出海产品。中文的要等大佬出
    basemodel 了
- 'no': 8
  name: AI 孙燕声音克隆 —— 把声音变成可复制资产
  points:
  - '**为什么需要这个概念？**'
  - '- 专业级声音克隆技术门槛高，普通人无法接触'
  - '- 缺乏一站式、零门槛的 AI 歌声合成教程与工具链'
  - '- 需要快速上手制作 AI 翻唱内容的实操路径'
  - '**核心定义**'
  - '- AI 孙燕声音克隆是指利用 So-VITS-SVC 等开源框架，通过采集目标歌手音频数据训练声学模型，实现音色迁移，使模型能演唱任意歌曲的虚拟歌手制作流程'
  - '- 一站式整合包包含环境依赖、推理程序、预训练模型、孙燕姿专用模型'
  - '**关键性质**'
  - '- 零门槛：手把手大白话教程，照着做准能做出来'
  - '- 一站式：所有软件安装包、整合包、模型均已打包网盘分享'
  - '- 全流程覆盖：环境搭建→数据预处理→模型训练→推理合成'
  - '**典型例子**'
  - '- 制作 AI 孙燕姿翻唱视频，蹭热点流量'
  - '- 让自定义声音唱任何喜欢的歌曲'
  - '**边界条件**'
  - '- 模型训练与使用存在版权侵权风险，需自担法律合规责任'
  - '- 音色保真度取决于训练数据质量与时长'
  - '- 商业变现涉及肖像权与声音权红线'
  sources:
  - paper: docs/202306/20230613_209.md
    role: origin
