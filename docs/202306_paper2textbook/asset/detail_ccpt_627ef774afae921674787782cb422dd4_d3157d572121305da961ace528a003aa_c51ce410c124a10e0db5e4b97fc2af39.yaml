  - '- 长期关系不会自然保鲜，激情衰减是常态；不主动经营，就会走向“7年之痒”。'
  - '**核心定义**'
  - '- 感情第二曲线：在平淡期或瓶颈期后，通过主动探索与深度链接，重新激发的新阶段亲密感与成长动力。'
  - '- 关系深度复盘机制：定期、结构化地回顾关系历程、核心冲突及成长路径，把隐性经验显性化。'
  - '- 基于生命周期的结构化提问法：用8个关键问题引导伴侣进行全景式关系复盘与共识构建。'
  - '**关键性质**'
  - '- 主动探索：高质量关系靠持续“探索自己和关系”对抗熵增，而非被动维持。'
  - '- 冲突处理：分歧是常态，高质量关系拥有一套显性、可复用的分歧处理流程。'
  - '- 相互成长：伴侣支持个人成长，使关系成为安全基地和加速器。'
  - '**典型例子**'
  - '- 作者与伴侣是心理学同班同学，18岁恋爱、22岁结婚，在一起12年从未停止探索自己和关系，在结婚5年后找到感情第二曲线。'
