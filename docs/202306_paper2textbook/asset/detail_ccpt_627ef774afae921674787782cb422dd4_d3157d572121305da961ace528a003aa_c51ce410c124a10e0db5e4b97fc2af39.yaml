units:
- 'no': 1
  name: 资料整理核心技能 —— 把“信息矿藏”变成“可变现产品”
  points:
  - '**为什么需要这个概念？**'
  - '- 技术人员往往只关注编码，却忽略了“信息的搜集、整理、分析”才是连接知识与金钱的桥梁。'
  - '- 高质量知识库里藏着大量宝藏，但不会整理，就只能看着金子埋在土里。'
  - '**核心定义**'
  - '- 资料整理指对信息的搜集、整理、分析能力，是工作效能、人生成长、商业变现的基础必修技能。'
  - '- 知识库淘金模型：用核心关键词检索，按热度排序，大样本阅读提炼，再结构化输出，把“海量非结构化信息”变成“可变现知识产品”。'
  - '**关键性质**'
  - '- 可迁移：适用于资料引流、技能变现、IP打造等多个场景。'
  - '- 高杠杆：掌握该技能，就能在已有知识宝库中低成本挖掘高价值变现路径。'
  - '**典型例子**'
  - '- 作者在生财有术搜索“技术、工具、程序员、软件”等关键词，按点赞量排序，读了一万多篇技术类帖子，精选300篇，整理成《技术赚钱实践指南》，帖子获283赞并加精华。'
  - '**边界条件**'
  - '- 需要高质量、密度大的垂直知识库作为前提，零散低质信息库的挖掘成本高、收益低。'
  - '- 筛选依赖社区的点赞/互动作为质量代理指标，若社区水军多则可能失真。'
  - '- 整理产出需要开放分享（如飞书文档、精华帖）才能实现商业引流，只收藏不输出无法变现。'
  sources:
  - paper: docs/202306/20230613_108.md
    role: origin
  excerpts:
  - 信息的搜集、整理、分析是一个非常重要的核心技能（本质也是资料整理的能力），要说什么是赚钱的必修技能，那资料整理这项能力肯定榜上有名。
  - 花了整整两个月，在 search01.shengcaiyoushu.com 中搜“技术、工具、程序员、软件”等关键字，然后根据点赞量从高到低的排序，看了生财有术差不多一万多篇技术类赚钱的帖子。
  - 今天索性把我笔记内容（精选的 300 篇文章），以及基于这 300 篇文章而整理的这篇《技术赚钱实践指南》跟大家分享出来。
  - 生财的知识星球内容库、航海资料库，是一个有着巨大价值的宝藏知识库。
- 'no': 2
  name: 达人优先原则 —— 先成为“六边形战士”，再谈项目
  points:
  - '**为什么需要这个概念？**'
  - '- 项目总在变，风口总在换，但个人能力是稳定资产；没有能力，给你一个好项目也接不住。'
  - '**核心定义**'
  - '- 达人优先原则：在寻找项目之前，先构建个人核心能力，成为垂直领域的达人，再匹配具体项目。'
  - '- 六边形战士模型：项目成功 = 个人5种核心能力（达人属性）+ 1个项目方向；个人积累边际收益递增，项目只是能力变现的载体。'
  - '**关键性质**'
  - '- 项目无关性：核心能力不依赖某个具体项目，可跨项目复用。'
  - '- 内生性：有效的生财方向来自个人阅读和禀赋画像中自然涌现，而非外部猎取风口。'
  - '**典型例子**'
  - '- 小红书戏精视频带餐饮券项目，决定成败的2/3是个人长期积累的“戏精”人设和拍摄技能，项目方向只占1/3。'
  - '**边界条件**'
  - '- 适合有足够时间和精力做长期积累的人，急于求成者难以复制。'
  - '- 需要配合大量阅读积累，否则难以做到“先胜而后战”。'
  sources:
  - paper: docs/202306/20230613_109.md
    role: origin
  excerpts:
  - 相比于是否挖掘到好项目，成为一个达人是更为重要的。
  - 这个人本身具有了 5 种能力，配合上项目那一条，最终组合成了六边形战士。
  - 对每个个体而言有效的生财方向，是在大剂量阅读的过程中、在基础技能的不断叠加中，自然而然涌现出来的，而非不停的去研究风口求来的。
  - 风口方向不一定对自己而言是好方向，而内生的项目方向，才是天命之所在。
- 'no': 3
  name: 广义阅读与狭义阅读 —— 既要“博观”，又要“约取”
  points:
  - '**为什么需要这个概念？**'
  - '- 只埋头做项目容易“只见树木不见森林”，只泛读不精读则永远无法落地，所以需要双轨阅读。'
  - '**核心定义**'
  - '- 广义阅读：跨学科、随机泛读，建立认知底座、理解世事人情，为决策提供多视角。'
  - '- 狭义阅读：针对具体项目做几十万字级的前后复盘，掌握起承转合和坑点，实现“先胜而后战”。'
  - '**关键性质**'
  - '- 广义阅读决定认知上限，狭义阅读决定执行下限，两者缺一不可。'
  - '- 狭义阅读讲究“缸满则溢”，读到一定程度会自然想动手验证。'
  - '**典型例子**'
  - '- 围绕一个项目方向阅读几十万字资料，对项目烂熟于心再动手，成事效率与“两眼一抹黑”硬闯有质的差别。'
  - '**边界条件**'
  - '- 阅读量需要时间积累，没有捷径；先读后战适合有耐心的人。'
  - '- 广义阅读不能替代实操验证，否则容易变成“纸上谈兵”。'
  sources:
  - paper: docs/202306/20230613_109.md
    role: origin
  excerpts:
  - 广义阅读量，随便看什么书，看个几十本、几百本、上千本，自然对世事人情、人间百态有更多的了解。
  - 狭义阅读量，一切跟赚钱、跟项目、跟生财有关的阅读。
  - 先胜而后战。相关的文字资料已经看了几十万字，对于项目的起承转合烂熟于心，然后动手实操、理论结合实践；或者两眼一抹黑，二话不说就开干，各种常见的坑挨个踩一遍。成事效率会有质的差别。
  - 生财的第一步，是阅读量过关。
- 'no': 4
  name: 时间管理闭环 —— 把时间当作精力来管理
  points:
  - '**为什么需要这个概念？**'
  - '- 工作、家庭、学习、副业多线并行，时间永远不够用；没有闭环体系，只能被任务推着走。'
  - '**核心定义**'
  - '- 时间管理闭环：学习理论 → 实践应用 → 复盘总结 → 调整优化，循环迭代成个人习惯。'
  - '- 组合实战体系：GTD收集清单 → 四象限/二分钟/8020分类 → 三只青蛙聚焦 → 番茄工作法执行。'
  - '- 时间管理本质是精力管理：早睡早起、运动、拒绝无效社交，维护高认知带宽。'
  - '**关键性质**'
  - '- 目标导向：年/月/周/日目标层层分解，定期复盘调整。'
  - '- 上午黄金时段：认知带宽在上午达到峰值，最重要、最难的任务安排在上午完成。'
  - '- 多线程并行时采用“目标分层 + 关键路径 + 批量化 + 工具自动化”，把管理复杂度从 O(n²) 降为 O(1)。'
  - '**典型例子**'
  - '- 作者同时参加11个航海：重点目标跑通流程，次要目标用周二/四晚3小时集中看回放，第三目标用收藏夹一键打卡；白天不开微信，晚上统一批量处理消息，最终全部推进。'
  - '**边界条件**'
  - '- 时间管理需要长周期内化（作者经历了约3年），无法立竿见影。'
  - '- 对必须实时响应的行业（如客服、交易），“白天不碰微信”不适用。'
  sources:
  - paper: docs/202306/20230613_115.md
    role: origin
  - paper: docs/202306/20230613_195.md
    role: improve
  excerpts:
  - 时间管理是一个长期的过程，一定是通过学习，实践，复盘总结，调整再学习，实践，复盘总结，这样一个循环的过程 最终找到适合自己的方法，然后长期坚持下来，形成习惯。
  - 个人认为这几种方法可以组合使用... 1.用 GTD 系统做个收集工作... 4.完成青蛙事项时可以使用番茄工作法让自己更加专注
  - 个人理解，时间管理是精髓是精力管理。
  - 确认重点目标，次要目标，和第 3 目标，定好关键路径。
  - 记住白天不要打开微信，晚上一个时间段统一去看 10 个航海群微信的消息，并归纳总结到飞书即可或直接去看百问百答即可。
  - 仔细看链接只有最后 1 个数字不同，懂得都懂。
- 'no': 5
  name: 企业号矩阵模式 —— 一个账号赚钱，一百个账号就是印钞机
  points:
  - '**为什么需要这个概念？**'
  - '- 单个账号容易限流、流量不稳定，且内容制作成本高；用矩阵复制可对冲风险、放大收益。'
  - '**核心定义**'
  - '- 企业号矩阵模式：批量注册多个小红书企业号，用同一套 SOP 换场景、换风格、换马甲复制内容，规模化获客。'
  - '- 轻资产代发供应链：不囤货、不发货，供应商免费寄样、卖出代发、不影响二次销售，创业门槛趋近于零。'
  - '- 爆文复刻与选品SOP：收集竞品 → 拆解爆款标题/封面/选品/文案/导流钩子 → 高度复刻 → 数据复盘迭代。'
  - '**关键性质**'
  - '- 可复制性：单号验证后，可以逐步放大到 6 号、30 号、122 号。'
  - '- 高毛利：高客单非标品（如高端女装）毛利可达 400%，覆盖营销和服务成本。'
  - '- 私域沉淀：每天可加 300-600 个新客户，复购率维持在 15%。'
  - '**典型例子**'
  - '- 作者单账号第7天小爆笔记引流120个好友，卖出30件客单价2000+的衣服；后运营30个号月流水60万+，团队122个号年流水3100万+。'
  - '**边界条件**'
  - '- 需要强内容能力和选品能力，否则只是低质量铺量。'
  - '- 平台规则收紧时封号风险高，需要持续补号。'
  - '- 代运营第三方模式扩张后收益与规模不成正比，难以深耕，最终需转向自营。'
  sources:
  - paper: docs/202306/20230613_119.md
    role: origin
  excerpts:
  - 既然 1 个号能卖，那我多开几个号，岂不是来得更快？...就这样，开启了我的企业号矩阵模式。
  - 2021 年，我一个人运营了 6 个账号...月入 20 来个 W...运营到了 30 个号...每个月可以稳定做到 60w+。
  - 2022 年，我团队做了 122 个账号，总营业 3100w+...私域粉丝...平均每天可以加到 300~600 个新客户，复购率大概在 15%的水平。
  - 为了更快的把爆文做起来，我把所有竞品的账号都收集起来，研究他们的标题、他们的爆文...第一个目标，就是高度复刻对标账号。
- 'no': 6
  name: 阿米巴利润分成 —— 学会分钱，才能赚大钱
  points:
  - '**为什么需要这个概念？**'
  - '- 固定工资下员工没有主人翁意识，人效低；把利润分出去，战斗力才会上来。'
  - '**核心定义**'
  - '- 阿米巴利润分成：按账号或业务单元拆分独立核算的小组织，将账号利润按比例直接分给运营人员，打破固定薪资上限。'
  - '**关键性质**'
  - '- 激发一线执行力：员工收入可从月薪3000提升到10000+，积极性发生质变。'
  - '- 适合规模化复制：每个账号组都是一个独立战斗单元，可不断裂变。'
  - '**典型例子**'
  - '- 凯哥团队转阿米巴后，一个人运营5个账号月收入至少10000+，战斗力明显提升，支撑了122个账号矩阵。'
  - '**边界条件**'
  - '- 需要公开透明的利润核算机制，否则分钱不均反而激化矛盾。'
  - '- 前提是单账号模型已验证可盈利，否则分的是亏损。'
  sources:
  - paper: docs/202306/20230613_119.md
    role: origin
  excerpts:
  - 全部都转成“阿米巴模式”，把账号的利润都分出去。在三线城市的平均工资也才 3000 左右，调整之后，一个人运营 5 个账号月收入至少可以拿到 10000+以上，这样她们的战斗力比之前有了明显提升。
  - 学会分钱，是赚大钱的必修课。
- 'no': 7
  name: 价格-人群锚定定律 —— 定价是筛选客户的第一道过滤器
  points:
  - '**为什么需要这个概念？**'
  - '- 很多创业者想通吃所有人群，结果被价格敏感型客户拖垮；定价其实是在选择客户。'
  - '**核心定义**'
  - '- 价格决定消费人群：低价吸引价格敏感型客户（高维权、低复购、高沟通成本），高价锚定高净值人群（低价格敏感、高品质、高复购、低售后）。'
  - '**关键性质**'
  - '- 定价即筛选：第一道过滤器，精准定位受众和需求是差异化核心。'
  - '- 高毛利空间决定服务能力：400%以上的利润才有空间做营销、产品优化和客户服务。'
  - '**典型例子**'
  - '- 作者研究车主后发现，购买100-300元脚垫的客户多是20万以下车型，流失率高；将产品梯度定为588/688/988的进攻/防守/定制款，主攻20万以上中高端车型，转化率4-5%，退换货几乎为零。'
  - '**边界条件**'
  - '- 高客单需要产品品质和品牌包装支撑，否则是“有价无市”。'
  - '- 价格锚定不能脱离市场供需，盲目高价在小众市场可能无人问津。'
  sources:
  - paper: docs/202306/20230613_119.md
    role: origin
  excerpts:
  - 价格决定消费人群 没有调查就没有发言权
  - 经过仔细的研究发现，购买 100-300 元款式的客户，基本都是 20 万以下车型，高端车型流失率高大 80%...20 万以上的车主最能接受的价位在 500
    左右
  - 低价只关注实用，高价要匹配逼格 差异化才是核心竞争力 准确抓住消费受众和需求是根本
  - 现在我有 400%以上的利润，有绝对的空间来做营销推广、产品优化和客户服务。
- 'no': 8
  name: 认知变现闭环 —— 永远赚不到认知以外的钱
  points:
  - '**为什么需要这个概念？**'
  - '- 靠运气赚来的钱最终会靠实力亏掉；只有认知圈内的钱才留得住。'
  - '**核心定义**'
  - '- 商业本质是认知变现：你永远赚不到超出认知范围的钱，失败源于跨越认知边界盲目扩张，成功源于在认知圈内深耕。'
  - '**关键性质**'
  - '- 认知边界 = 财富边界：盲目进入不熟悉的领域是“灭顶之灾”的导火索。'
  - '- 长期主义：真正的机会在于认知圈内的深耕与复利。'
  - '**典型例子**'
  - '- 作者在天猫脚垫、小红书女装领域认知深厚，越做越大；在不懂的直播带货领域重资产投入，半年亏光积蓄、负债400万。'
  - '**边界条件**'
  - '- 认知不等于知识，必须经过实战验证，纸上谈兵无法变现。'
  - '- 该定律强调“不熟不做”，但也需要动态学习扩展认知，否则会错过新机会。'
  sources:
  - paper: docs/202306/20230613_119.md
    role: origin
  excerpts:
  - 你永远赚不到超出你认知以外的钱，靠运气赚到的钱，最后往往又会凭实力亏掉。
  - 直播带货就是超出我认知的范畴，过快的扩张，团队跟不上节奏这是我的策略失误。
  - 面对一些所谓“风口”的时候，能够让自己冷静一些，理性看待。因为不是所有“风口”都是你以为的风口，也可能是给你带来“灭顶之灾”的导火线！
- 'no': 9
  name: 风口即陷阱法则 —— 有些风口是“灭顶之灾”
  points:
  - '**为什么需要这个概念？**'
  - '- 人人都想追风口，但风口可能超出你的认知与资源，追上去就是死。'
  - '**核心定义**'
  - '- 并非所有风口都值得入场：当风口超出认知边界、需要重资产投入、依赖不可控变量时，风口就是陷阱。'
  - '**关键性质**'
  - '- 可识别性：认知圈内的风口才是机会，圈外的风口是陷阱。'
  - '- 危险信号：重资产、依赖主播/算法/疫情等不可控变量，都是需要警惕的信号。'
  - '**典型例子**'
  - '- 作者2020年重资产杀入直播带货，缺乏选品、主播、运营经验，遭遇疫情黑天鹅，半年负债400万。'
  - '**边界条件**'
  - '- 该法则不否定所有风口，而是要求评估自身认知与资源，识别自己能驾驭的风口。'
  - '- 创业新手容易把“别人的成功”当成“自己的机会”，需要冷静判断。'
  sources:
  - paper: docs/202306/20230613_119.md
    role: origin
  excerpts:
  - 因为不是所有“风口”都是你以为的风口，也可能是给你带来“灭顶之灾”的导火线！
