  name: DIY留学申请 —— 不用中介也能上世界名校
  points:
  - '**为什么需要这个概念？**'
  - '- 中介费用高、专业度参差不齐，普通家庭想上名校但承担不起或信不过，DIY可以破局。'
  - '**核心定义**'
  - '- DIY留学申请：家长或学生自行完成选校、文书、网申、签证等全流程，不委托中介。'
  - '- 工科跨申商科/金融：美国对工转金融包容度高，英国纯金融/经济难度大，工科生应选择明确要求数理背景的交叉学科（如金融科技、金融工程）。'
  - '- 申请时间线倒推法：以大四毕业出国为终点，倒推大三秋季提交申请，大三前完成语言考试与针对性实习，大一/大二规划方向。'
  - '**关键性质**'
  - '- 可行性：普通家庭通过自学招生规则、精准规划时间线与背景提升，可实现世界Top10名校录取。'
  - '- 美英差异律：不同国家招生政策差异显著，需按目标院校官网要求匹配专业。'
  - '- 中介负价值风险：部分中介存在文书模板化、推荐不匹配院校等坑点，DIY可规避。'
  - '**典型例子**'
  - '- 作者自行DIY指导孩子获得世界Top10英国大学研究生录取；经验复用后，两年内帮助多名学生拿到美英Top30录取，含美国藤校。'
  - '**边界条件**'
  - '- 需要家长或学生有较强的信息检索和执行能力，否则DIY可能不如优秀中介。'
  - '- 该路径强调时间窗口（大一规划、大三申请），错过关键节点则难以复制。'
  sources:
  - paper: docs/202306/20230613_194.md
    role: origin
  excerpts:
  - 如何自己 DIY（不用中介）申请世界名校
