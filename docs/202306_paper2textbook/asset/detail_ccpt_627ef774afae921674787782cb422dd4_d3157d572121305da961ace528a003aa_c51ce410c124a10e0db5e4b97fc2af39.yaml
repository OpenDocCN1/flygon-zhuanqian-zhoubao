- 'no': 10
  name: 合伙人博弈不可避免论 —— 合伙容易，长久难
  points:
  - '**为什么需要这个概念？**'
  - '- 很多创业者因为合伙而成功，也因为合伙而失败；提前了解博弈规律才能设计好机制。'
  - '**核心定义**'
  - '- 合伙生意在顺境中掩盖矛盾和分歧，逆境中必然开裂；根本原因是私心、利益分配不清、亲属占据关键岗位导致话语权丧失。'
  - '**关键性质**'
  - '- 可预判性：顺境时就要预防，明确股权或利润分离机制。'
  - '- 独资或阿米巴式清晰分配是长期共存解。'
  - '**典型例子**'
  - '- 作者合伙做脚垫项目，合伙人安排亲属进公司，关键岗位都是老板的人，话语权被慢慢剥夺，最后被排挤离开。'
  - '**边界条件**'
  - '- 该定律主要针对无清晰机制的传统合伙；若双方有契约精神和透明机制，可以延长合伙寿命。'
  - '- 不是所有合伙都必死，而是“不可避免博弈”，需要治理机制。'
  sources:
  - paper: docs/202306/20230613_119.md
    role: origin
  excerpts:
  - 合伙的生意都是很难长久的，人都是有私心的...
  - 合伙人开始安排各种亲属进入公司，关键岗位上都是老板的人，导致我的话语权越来越少，慢慢我被排挤出了公司~
- 'no': 11
  name: 平台红利周期迁移论 —— 在成长期入场，在成熟期离场
  points:
  - '**为什么需要这个概念？**'
  - '- 流量平台有生命周期，不懂阶段切换，就会在红海厮杀中耗尽资源。'
  - '**核心定义**'
  - '- 平台生命周期：蓝海期（野蛮生长）→ 成长期（内容为王/红利期）→ 成熟期（资本垄断/流量碎片化/存量博弈）→ 衰退或合规收紧期。'
  - '**关键性质**'
  - '- 阶段识别：创业者需在成长期入场，在成熟期前撤离或转型。'
  - '- 规律性：红利必然迁移，平台规则必然收紧。'
  - '**典型例子**'
  - '- 作者从天猫流量碎片化、大品牌进入后萌生退意，转战小红书；2023年小红书私域导流收紧，每月死号，提示需要迁移或升级打法。'
  - '**边界条件**'
  - '- 判断阶段需要数据和行业嗅觉，无法精确到具体时点。'
  - '- 成熟期未必不能做，但需要更高资本和精细化运营能力。'
  sources:
  - paper: docs/202306/20230613_119.md
    role: origin
  excerpts:
  - 参与天猫的内容宣导时间长了，也慢慢发现天猫的流量日渐碎片化，大品牌和资本进入以后，流量倾斜严重，让我产生了退意。
  - 2023 年...私域导流相对往年，平台抓得更严了，动不动就限流，平均每个月都要死好几个号。
- 'no': 12
  name: 复盘即升华 —— 停下来看路，才能走更远
  points:
  - '**为什么需要这个概念？**'
  - '- 埋头狂奔容易迷失方向；偶尔停下来复盘走过的路，既是心灵升华，也是沉淀方法论。'
  - '**核心定义**'
  - '- 复盘即升华：定期回顾过往路径（看到的风景、走过的弯路），沉淀可复制经验。'
  - '- 自残式拆解：创业者对全过程进行深度、无保留、暴露短板的复盘，提炼可复制的方法论。'
  - '- 过往路径的可复制性：实测有效的起盘打法具有跨周期普适性，现在使用依然能起盘。'
  - '**关键性质**'
  - '- 可复制性：复盘不只是总结，而是提炼能教给别人的SOP。'
  - '- 诚实性：暴露短板比单纯展示成功更有教学价值。'
  - '**典型例子**'
  - '- 作者苗子用5000字长文“自残式拆解”三人团队如何赚第一个100万，获得71赞，评论区反馈“成功是有成功的道理”。'
  - '**边界条件**'
  - '- 复盘需要真实数据和失败细节，否则容易沦为“成功学鸡汤”。'
  - '- 可复制的路径通常属于特定领域，跨领域应用需重新验证。'
  sources:
