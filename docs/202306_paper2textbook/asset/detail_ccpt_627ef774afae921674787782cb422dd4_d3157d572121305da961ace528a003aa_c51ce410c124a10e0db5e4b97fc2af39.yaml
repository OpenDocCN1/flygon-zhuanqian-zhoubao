- 'no': 17
  name: 卖课全链路 —— 把知识产品的价值感“翻十倍”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多知识IP“会做课不会卖、不敢定高价、转化无章法”，卖课需要一套标准化体系。'
  - '**核心定义**'
  - '- 卖课利润公式：总利润 = 流量 × 转化率 × 客单利润。'
  - '- 课程分层产品矩阵：流量产品（几十到几百元引流）→ 信任产品（几百到几千元建信任）→ 利润产品（几万到几十万变现）。'
  - '- 价值定价锚点法则：价值 = 价格 × 10倍。'
  - '- 价值包装四维模型：从目标、问题、方案、交付四个维度提炼用户价值。'
  - '- 私域三大转化场域：朋友圈（高频种草）、群发售（批量促单）、1v1（高客单深度信任）。'
  - '**关键性质**'
  - '- 非标品价值自定义：课程价值边界模糊，卖家拥有定义权，高价本质是高价值感传递。'
  - '- 精准流量大于大流量：百级精准用户经优质转化可超越万级泛流量。'
  - '- 信任加速：个人品牌能显著降低商业信任成本。'
  - '**典型例子**'
  - '- 商业律师的《创业者法律避险课》销量不高，重新包装为《新手老板如何避开10大法律雷区》+合同模版+精准咨询，精准击中创业者刚需，实现高客单成交。'
  - '**边界条件**'
  - '- 高价需要价值包装和个人品牌支撑，否则容易变成“割韭菜”反噬。'
  - '- 私域高频运营需要维护内容质量，并且要照顾用户承受度。'
  sources:
  - paper: docs/202306/20230613_243.md
    role: origin
  excerpts:
  - 总利润 = 流量 * 转化率 * 客单利润
  - 定价的标准是：价值=价格*10 倍
  - 课程不是标品，它是你“智慧和技能”的提炼。因此，课程本身的价值是不够明确的，这带来的好处就是，你其实可以自己定义这个价值。
  - 我有个咨询客户是个商业律师，做了一个《创业者法律避险课》...销量不高。...做成《新手老板如何避开 10 大法律雷区》
- 'no': 18
  name: 新疆西藏包邮 —— 偏远地区也有电商蓝海
  points:
  - '**为什么需要这个概念？**'
  - '- 大部分卖家因物流成本高而忽视偏远地区，但平台补贴让这里成为低竞争、高流量的蓝海。'
  - '**核心定义**'
  - '- 新疆西藏包邮蓝海：电商平台针对偏远地区推出包邮补贴政策，当前商家覆盖少、竞争弱、自带流量红利。'
  - '- 中转仓发货模式：商家先发货到新疆/西藏中转仓，再由中转仓发给买家，获得包邮标识和流量扶持；提前提供中转单号可安抚买家。'
  - '- 全平台布局：在淘宝、京东、拼多多、抖音、快手、小红书等多个平台同步铺货。'
  - '**关键性质**'
  - '- 低门槛：纯小白实操一周即可见收益。'
  - '- 物流痛点可解：中转单号解决首段物流不更新导致的催单和纠纷。'
  - '**典型例子**'
  - '- 作者作为纯小白加入社群一个月、实操一周收益1600+；评论区用户反馈新运营的抖音图文账号最先在新疆西藏开单。'
  - '**边界条件**'
  - '- 红利期有时效性，竞争者涌入后利润会下降。'
  - '- 需要熟悉各平台包邮补贴政策和中转仓对接，有一定操作门槛。'
  sources:
  - paper: docs/202306/20230613_246.md
    role: origin
  excerpts:
  - 电商最后的蓝海市场，新疆西藏包邮批量玩法
  - 新疆西藏包邮，目前自带流量，还是红利期
  - 中转仓提前给中转单号的，这样买家就不怎么催了
  - 纯小白实操刚一个礼拜，收益 1600+
  - 自己新运营的抖音图文账号，最先开单的也是新疆西藏
- 'no': 19
  name: 蓝海定位方法论 —— 选择比努力更重要
  points:
  - '**为什么需要这个概念？**'
  - '- 红海内卷、利润薄、执行痛苦；系统性挖掘蓝海，才能做得轻松且利润空间大。'
  - '**核心定义**'
  - '- 蓝海定位方法论：在个人IP咨询实战中总结的一套系统性定位工具体系，用于跳出红海竞争，快速锁定细分蓝海市场。'
