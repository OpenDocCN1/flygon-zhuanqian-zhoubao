paper: docs/202306/20230613_028.md
desc: 该素材为台风（ChatGPT魔法师）在航海项目结业分享会上的简要宣传页，核心介绍其3个月利用ChatGPT搭建自媒体矩阵实现自然流量自动成交、变现5万+的实战经验，并预告将系统分享ChatGPT特点优劣势、精华案例及自媒体应用方法论，详细内容引流至飞书文档。
concepts:
- name: ChatGPT自媒体矩阵
  desc: 指利用多个账号协同运作、通过ChatGPT批量生产内容形成流量池，实现自然流量获取与自动化转化变现的自媒体运营体系。
  is_original: false
  excerpt:
  - 搭建 ChatGPT 自媒体矩阵，主打自然流量自动成交的玩法
- name: 角色指令
  desc: 通过设定特定人设、背景知识与行为规则，指导ChatGPT扮演特定专家角色（如AI佛祖、AI律师）完成专业化任务的提示工程技术。
  is_original: false
  excerpt:
  - 擅长创作角色指令，做过 AI 佛祖、AI 律所等多款火出圈的小应用
methods:
- name: __overview__
  desc: 作者的核心方法论框架：结合ChatGPT特点与优劣势分析，通过角色指令开发垂类应用，搭建自媒体矩阵获取自然流量，实现自动成交变现。
  excerpt:
  - 系统性地跟大家介绍 ChatGPT 的特点、优劣势，结合精华案例，总结 ChatGPT 在自媒体的应用方法
theorems:
- name: ChatGPT赋能自媒体实现自然流量自动成交
  desc: 核心主张：掌握ChatGPT特性与角色指令技术，可搭建自媒体矩阵，依靠平台自然流量而非付费投放，实现内容生产与转化的自动化，从而达成商业变现。
  excerpt:
  - 搭建 ChatGPT 自媒体矩阵，主打自然流量自动成交的玩法，3 个月变现 5 万+
