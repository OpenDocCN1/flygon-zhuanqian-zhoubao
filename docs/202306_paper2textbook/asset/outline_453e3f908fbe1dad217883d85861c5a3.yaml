  name: 私域流量获取的底层逻辑：精准度决定成交率
  desc: 对比‘泛流量广撒网’与‘精准流量深耕’的ROI差异，确立‘精准度优于数量’的核心原则，揭示付费筛选、非侵入式信任建立等底层机制。
  role: motivation
