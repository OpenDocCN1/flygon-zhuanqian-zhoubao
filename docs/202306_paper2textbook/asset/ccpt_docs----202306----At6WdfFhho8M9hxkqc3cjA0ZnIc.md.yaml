paper: docs/202306/At6WdfFhho8M9hxkqc3cjA0ZnIc.md
desc: 该素材为一篇实战经验分享，作者惠惠详细复盘了如何在7天内利用AI（GPT）创作出两篇10万+阅读量的公众号情感爆文。核心内容围绕四大痛点展开：题材搜集与筛选（建立‘看一看’爆款追踪法与个人素材库）、标题制造（GPT生成+微信搜索拼凑+关键词替换）、内容生产指令优化（续写扩充、细节描写注入、剧情合理性训练/大纲控制）、以及冷启动期的心态管理与概率论认知、1:1爆款拆解复盘法。素材强调‘人治AI’的协作范式，即人类负责审美判断、结构把控与细节指令，AI负责执行生成，通过精准提示词工程将AI‘调教’为合格写手。
concepts:
- name: 看一看爆款追踪法
  desc: 利用微信‘看一看’推荐机制，通过关注头部情感号训练算法推荐，在聚合流中筛选5天内5万+阅读量的爆款文章进行题材仿写，降低选题踩雷风险。
  is_original: true
  excerpt:
  - 先关注情感类公众号，关注5—10个，点进去看他们的文章，这样操作后，订阅号消息一直下滑，在看一看里面，就会出现很多篇情感类文章
  - 我会先看标题，能够吸引我，我就会点进去直接滑倒最下面看一下数据，在这些文章中筛选出5天内，5万＋以上的文章进行题材仿写
- name: 动态素材库
  desc: 建立个人化的情感写作素材库，前置条件是精读100篇以上爆文建立故事感，后期从库中组合题材，而非单纯堆砌素材。
  is_original: true
  excerpt:
  - 同时可以把每天写的题材都摘抄进素材库，丰富一下素材库，我建议素材库的使用是你最起码看100篇以上的情感类文章，再自行从素材库里面组建题材
- name: 微信搜索标题拼凑法
  desc: 利用微信搜索下拉框及相关推荐的关键词/同类标题，通过换地名、换称呼、加年龄等微创新方式快速生成高点击标题，同时可挖掘新选题。
  is_original: true
  excerpt:
  - 把标题打到微信搜索栏，点进去搜索，会有很多关键词和同类型标题（下图红框），拼凑到一起就可以了
  - 实在不会拼凑，可以关键词照抄，加年龄换称呼改地区，比如姑姑改成小姨，姨妈，姑妈，地址北京上海广州
- name: 人治AI协作范式
  desc: 核心理念：GPT只是工具，人类需掌握‘使用说明书’（精准提示词），通过不断喂养优秀片段、修正大纲、注入细节要求，将AI‘调教’为符合人类审美的写手。
  is_original: true
  excerpt:
  - 记住gpt 只是个工具，我们需要的是学会使用说明书，用更精确的语句命令他，它就会被调教得越来越好
  - 我们自己要先清楚如何是好故事...在gpt写的不合理的时候，我们去教导它，更改它，不停训练就会逐渐变得合理
- name: 冷启动概率论
  desc: 认知同质内容入池时间的随机性（概率分布），将精力聚焦于可控变量（内容质量、更新频率），忽略不可控的入池时长焦虑。
  is_original: true
  excerpt:
  - 因为我自己同时做了5个号，文章风格标题都大差不差，但是有的3天入池，有的9天入池，这个就是概率问题...这个完全不是由自己掌握的因素，不需要焦虑
methods:
- name: __overview__
  desc: 全流程AI情感爆文生产方法论：爆款追踪选题 -> 组合式标题制造 -> 分层指令工程生成内容（续写/扩写/细节注入/大纲控制） -> 概率论心态管理
    + 1:1结构拆解复盘。
  excerpt:
  - 我会分别从用gpt写文章不知道去哪里找题材，标题起了一个小时，结果完全不吸引人，gpt写的文章太差劲，和一直不入池，心态如何调整，这几方面展开讲一下我踩的坑，以及如何优化
- name: 分层指令工程
  desc: 针对GPT生成内容的常见缺陷（字数不足、流水账、脱离实际），设计分层级的Prompt策略：1.续写指令解决截断；2.扩写指令注入‘细节/对话/动作/神态/情绪’；3.大纲控制指令修正剧情逻辑与反转。
  excerpt:
  - 这段内容没写完，它就不写了，可以把没写完的内容复制一下，然后加上这段内容没写完，请继续
  - “需要扩写的内容”请扩充这部分内容，要有故事发生的具体细节，有对话，有动作和神态描写，有情绪，写一下
  - 下面是我要求它更改大纲的指令（图示：要求补充故事发展大纲、反转设计、人物动机等）
- name: GPT标题生成+微搜优化组合拳
  desc: 先用GPT根据梗概生成基础标题（可指定人设/年龄），再放入微信搜索利用联想词/竞品标题进行关键词替换组合，形成最终高点击标题。
  excerpt:
  - 例：带父亲去城里看病...给gpt发送指令如图（我这个是gpt3.5）...最后加上年龄或者换个称呼标题就有了
  - 把标题打到微信搜索栏...会有很多关键词和同类型标题...拼凑到一起就可以了
- name: 1:1爆款结构拆解法
  desc: 将自产文章与10万+标杆文章进行逐段对标：主人公登场时机、挫折节点分布、悬念揭秘段落位置等结构要素逐一对齐，精准定位差距并迭代优化。
  excerpt:
  - 我会把自己写的文章和那些10万＋的文章，进行1比1分析，包括什么时候主人公介绍，什么时候第一个挫折，什么时候第二个挫折，标题上的悬念在第几段揭秘，我会1比1地摘抄核对
theorems:
- name: 爆款题材蹭热度即安全边际定律
  desc: 筛选5天内5万+的爆文进行仿写，因同一时间窗口内能火的题材高度趋同，大爆文题材自带流量底托（几千阅读保底），写得好即可复制量级；参考低阅读文章仿写则上限受限。
  excerpt:
  - 原因是大爆文你蹭一下，题材肯定不踩雷，数据打底就几千阅读，写得好可以直接5万＋，10万＋，因为同一时间能够火起来的题材都是大同小异，如果你参考的文章只有1万阅读，那么你对这类题材进行仿写，数据也不会太好
- name: AI写作质量取决于人类‘导演’能力而非模型智商
  desc: GPT原生输出必然流水账、不合逻辑、字数不足；高质量输出源于人类具备‘故事结构感’（看50篇爆文练就），能精准下达‘细节化、结构化、情绪化’指令，并能像导演一样随时叫停、修改大纲、重拍细节。
  excerpt:
  - 最开始我和小伙伴一样，用gpt2个小时写出一篇文章，而且这一篇文章的质量还不如自己写的
  - 我从我的10万＋爆文中截取了一个片段...可以发现我的文章其实主要采用的就是语言描写，心理描写，动作和神态描写...这几个要素不断发送给gpt,它就能越写越好
  - 如果你给gpt标题的时候，你也有这个疑问（故事怎么发展），一定要多看文章，最起码自己心里得有个发展情节的大纲
- name: 多账号矩阵对冲冷启动不确定性
  desc: 单账号入池时间受不可控算法概率支配（3天vs 9天），同质内容跑5个号可将‘入池概率’转化为确定性收益，心态上实现‘着眼可控，忽略不可控’。
  excerpt:
  - 我自己写了5个号，5个号10天内全部入池...有的3天入池，有的9天入池，这个就是概率问题...不需要焦虑，用通俗的话来讲就是着急没用，可以把目光放在可以自己掌控的地方
findings:
- name: 7天双爆文实战成果
  desc: '[evidence] 作者在4月开始使用GPT写情感文，7天内产出2篇10万+阅读量文章，并晒出两个账号后台数据截图（阅读量破10万、在看/转发数据亮眼）作为支撑。'
  excerpt:
  - 4月开始用gpt 写情感文章，7天写出2篇10万＋
  - （晒下其中2个号的成绩） [图片显示两篇文章阅读数均超10万，其中一篇11.2万，一篇10.5万]
- name: 5账号矩阵10天全入池验证
  desc: '[evidence] 作者同时运营5个账号，内容风格高度相似，结果10天内5个账号全部通过冷启动入池，验证了‘多号对冲概率’策略的有效性及入池时间的随机分布特性。'
  excerpt:
  - 我自己写了5个号，5个号10天内全部入池
  - 有的3天入池，有的9天入池
- name: 指令迭代显著提升单篇产出效率与质量
  desc: '[claim] 作者宣称：初期用GPT写一篇需2小时且质量不如人工；应用分层指令工程（续写、扩写细节、大纲控制）后，显著缩短耗时并解决了‘流水账’、‘不合逻辑’、‘字数不足’核心痛点，实现高效高质产出。'
  excerpt:
  - 最开始我和小伙伴一样，用gpt2个小时写出一篇文章，而且这一篇文章的质量还不如自己写的，耗时耗力
  - 问题：用gpt写的文章字数不够/很流水账/故事不现实/不够吸引人 -> 采用方法后解决
- name: 微信搜索联想词挖掘出意外选题红利
  desc: '[evidence] 在微信搜索栏输入标题进行拼凑优化时，意外发现搜索推荐的‘蓝色框框’区域（相关搜索/大家还在搜）会暴露其他同类型的10万+狗血故事，形成‘起标题顺便挖选题’的复利效应。'
  excerpt:
  - 不仅如此有的时候还会有另外的狗血10万＋故事收获（蓝色框框）
