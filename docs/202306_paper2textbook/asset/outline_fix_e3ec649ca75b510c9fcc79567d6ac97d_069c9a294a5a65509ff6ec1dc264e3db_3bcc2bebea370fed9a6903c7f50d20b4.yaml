- 'no': 1
  name: 商业认知重构 —— 从“流量狩猎”到“价值深耕”
  desc: 本章旨在打破新手“短平快”的暴富幻觉，建立正确的商业底层逻辑。通过剖析认知变现的边界、长期主义的复利效应、知识管理的体系化构建以及“选择大于努力”的决策法则，引导读者从底层逻辑上理解互联网商业的本质，避免陷入红海内卷与同质化竞争的陷阱。
  nodes:
  - 'no': 1
    name: 认知变现的边界与陷阱
    desc: 阐述“赚不到认知以外的钱”并非空话，揭示知识付费与副业市场中常见的“收藏家陷阱”与“收割镰刀”，强调认知升级需透过现象看本质，而非单纯积累碎片信息。
    role: motivation
    src:
    - paper: docs/202306/20230613_009.md
    - paper: docs/202306/20230613_074.md
    - paper: docs/202306/20230613_072.md
  - 'no': 2
    name: 知识体系构建与思维模型应用
    desc: 介绍从资料整理到知识体系的进阶路径，重点讲解“问思模”体系（基本问题-思维方式-具体模型）以及五大知识串联逻辑，帮助读者建立结构化的商业思维框架，将碎片知识转化为决策工具。
    role: method
    src:
    - paper: docs/202306/20230613_009.md
  - 'no': 3
    name: 选择大于努力：蓝海定位与赛道选择
    desc: 引入“蓝海定位方法论”，论证在资源受限条件下，垂直细分、高客单价或价格不透明品类的战略重要性。通过对比红海内卷与蓝海先手，展示选择正确赛道对降低试错成本的决定性作用。
    role: method
    src:
    - paper: docs/202306/20230613_193.md
    - paper: docs/202306/20230613_011.md
  - 'no': 4
    name: 长期主义与社群复利效应
    desc: 从“十年称王”长周期视角出发，论述社群与个人IP的复利属性。强调信任资产、人脉信息池的沉淀价值，以及“好且难”产品背后的长期战略意义，反驳短期套利心态。
    role: theorem
    src:
    - paper: docs/202306/20230613_008.md
  - 'no': 5
    name: 执行力与复盘闭环：从“知道”到“做到”
    desc: 剖析“中等认知陷阱”与行动瘫痪，提出“先完成再完美”与“下场复盘”的核心心法。通过新人从0到1的失败与修正案例，证明执行力是跨越认知鸿沟的唯一桥梁。
    role: experiment
    src:
    - paper: docs/202306/20230613_229.md
    - paper: docs/202306/20230613_016.md
    - paper: docs/202306/20230613_169.md
