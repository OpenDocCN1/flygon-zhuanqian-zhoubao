paper: docs/202306/20230627_061.md
desc: 该素材系统梳理了2023年短剧CPS（Cost Per Sale）赛道的市场现状、商业模型、上下游生态角色及入局机会，并基于实地调研与星图负责人分享，深度剖析了版权方、分发平台、达人三大角色的盈利逻辑与核心坑点，指出市场处于“跑量抢市场”早期，核心竞争力在于爆款识别、独家供给与抗扣量能力，建议中小创业者以轻量级分发切入，警惕多级分销与数据扣量风险。
concepts:
- name: 短剧CPS分销模型
  desc: 指版权方制作短剧后，通过抖音星图或第三方分发平台，以高比例佣金（50%-80%）招募达人进行切片二剪推广，用户在小程序付费充值后按实绩结算佣金的分销模式。具有无退货、回本周期短、依赖公域自然流量等特征。
  is_original: true
  excerpt:
  - 短剧分销的具体玩法也就是通过切片的二次剪辑分发，分销者只要加入对应的分销平台，拿到短剧的内容授权，进行二次剪辑创作...用户通过抖音切片内容，点击小程序付费充值后，对应的分销达人能获得对应
    50%-80%佣金
  - CPS 对投放方来说是不会赔的生意，回本周期短，所以版权方愿意花更多钱来星图做投放
- name: 短剧‘一九原则’
  desc: 短剧市场呈现极度头部效应：约10%的短剧/达人贡献90%的GMV/收益。版权方需通过量产对抗随机性（月产30部测试爆款），达人收益极度两极分化。
  is_original: true
  excerpt:
  - 目前短剧市场完全是一九原则，做 10 个剧也许只有一个能爆，所以目前在抖音有 10%的短剧投放消耗能占到整个池子的 90%
  - 现阶段达人做短剧的收益、数量和收益率都存在极端的两极分化，大约 10%的达人获得了 90%的收益
- name: CPM收益基准
  desc: 达人推广短剧的单位千次播放收益基准。素材实测数据显示，无论粉丝量级，有效播放每CPM约对应1元收益（即1000万播放≈1万元佣金），为达人估算投入产出提供量化标尺。
  is_original: true
  excerpt:
  - 从营收上来看，每个 CPM 能有 1 块钱的收益（一个 CPM=1000 次播放），这跟分销达人粉丝的量级关系不是很大...1,000 万的播放能拿到大概
    1 万块钱收益
- name: 判重机制与去重剪辑
  desc: 抖音对短剧切片视频的原创性审核机制。同一剧集若被大量达人剪辑，极易触发判重导致零流量。达人核心竞争力之一在于‘识别新剧’与‘差异化二剪’规避判重。
  is_original: false
  excerpt:
  - 如果是老剧很多人剪了，这个剧很容易被判重，抖音的视频重复审核机制，如果你和前面的剧很重复的话，你这个剧就不会有流量
- name: 扣量黑箱
  desc: 短剧CPS链路中，版权方或中间分发平台通过技术手段少报充值金额（如实充100万仅结算60万），达人因无法获取完整数据链路而无法维权的隐性风险。
  is_original: true
  excerpt:
  - 在实际的分销中很容易被上游扣量，比如你带去了 100 万的充值，最后告诉你只有 60 万，你也无法去反驳，只能是上游告诉你有多少业绩就是多少
  - 一部分是版权方在扣量，一部分是中间的分发平台会扣量
methods:
- name: __overview__
  desc: 素材采用‘实地调研+头部访谈+数据复盘’的复合方法论：作者亲自充值体验+拜访头部切片公司+邀请星图负责人私董会分享+业内朋友交流，从用户视角、达人视角、平台视角、版权方视角四维拼接出全景图。
  excerpt:
  - 为了研究这玩意，我自己都花了几百块来看各种付费短剧
  - 3 月份的时候，我去一个做直播切片和短剧切片的公司拜访
  - 这次我邀请到私董会的分享嘉宾是抖音星图的内容消费运营负责人
- name: 版权方‘量产-测试-加投’方法
  desc: 头部版权方应对爆款不确定性的标准化生产流程：月产30部短剧（单部成本30万）-> 星图/自投小额测试 -> 识别出爆款（ROI达标）-> 全渠道重投放收割。核心是用规模对抗随机性。
  excerpt:
  - 版权方也不确定到底哪部剧会火，所以只能采用数量对抗随机性，同时拍多部，然后去市场上投放测试，根据测试结果再决定重点推哪一部，像一些头部公司，一个月能拍摄产出大概
    30 部短剧
- name: 达人‘新剧首发+差异化二剪’方法
  desc: 终端达人获取自然流量的操作SOP：1. 抢首发新剧（规避判重）；2. 选取高冲突/擦边片段（前3秒留人）；3. 多账号矩阵分发（解决‘搞到更多抖音账号’痛点）；4.
    监控CPM收益动态止损。
  excerpt:
  - 主要要考验达人识别爆品剧的能力...第二个就是选择新剧还是老剧，如果是老剧很多人剪了，这个剧很容易被判重
  - 挑战就是如何搞到更多的抖音账号，做出能够免费获取抖音公域流量的切片内容
- name: 中间商‘独家供给+综合分发平台’转型方法
  desc: 中间分发平台避免陷入佣金价格战的进化路径：1. 抢占独家版权（锁定下游达人）；2. 从单一短剧分发转型‘多任务分发平台’（短剧+IP带货+小说游戏）；3.
    自建培训体系提升达人产出（替代全职养号低ROI模式）。
  excerpt:
  - 挑战最大的还是能拿到好的剧，最好是独家的那种，这样下游的分销达人只能选择跟你合作
  - 未来的短剧中间分发平台的方向可能往多任务分发平台的方向走比较好，把切片当成一种获取流量的方式，为分发者们提供短剧分发、IP 带货切片分发、小说游戏分发等综合的切片分发平台
theorems:
- name: 市场规模天花板定论：短剧年充值将超电影票房
  desc: 基于月充值15亿、增至30亿/月的推算，年市场规模将达300亿+，超越2022年中国电影票房204亿。核心驱动力：碎片化时间匹配、爽文套路强付费意愿、CPS高佣金刺激分发侧供给。
  excerpt:
  - 据我了解目前付费短剧的市场规模在 15 亿/月左右的用户充值，长期来看能做到 30 亿/月应该问题也不大，这样来算一年能有 300 亿+的充值...2022
    年电影总票房的收入为 204 亿。也就是说很快付费短剧的市场就能超过电影的总票房
- name: 星图撮合三要素定理
  desc: 抖音星图成为短剧分发核心枢纽的三个必要条件：1) 供需匹配（影视达人供给充足+版权方缺流量）；2) CPS结算无风险（版权方零前置成本）；3) 平台战略扶持（官方主动撮合）。缺一不可。
  excerpt:
  - 短剧内容能够在星图投放火起来主要有三方面原因：1、由于短剧本身非常缺内容流量，而抖音平台侧的影视达人号供给很充足...2、因为版权方在星图与达人分销合作，是以
    cps 的方式来结算...3、目前短剧市场在星图的投放量级是每天 5000 万左右
- name: 多级分销必死论
  desc: 短剧CPS不适用多级分销（拉人头）模型。理由：1) 非高频刚需，无自购兜底；2) 头部10%达人产出90%业绩，长尾达人无效；3) 多级分佣稀释终端佣金导致核心达人流失。本质是‘家猪’（全职员工）不如‘野猪’（全职兼职达人）狼性强。
  excerpt:
  - 中间的分发平台们千万不要去做多级分销的事情...短剧这个事情不一样，它不是一个人人都会消费的内容...如果做了多级分销的模型，那么你给到终端分发者的佣金比例过低，吸引力不够，留不住人
  - 我看有的中间分发公司是自己养了很多的终端分销账号...在公司上班的人还真不一定会被那些外部兼职的做的好，这就是家猪和野猪的区别
- name: 入局分层建议：资金定上游，资源定中游，技术定下游
  desc: 三类创业者的最优入局策略：有资金/投放能力->做版权方（高风险高回报）；有系统/渠道能力->做独家分发联盟（中风险中回报）；个人/小团队->做终端分发达人（低成本高弹性，核心拼剪辑与账号获取能力）。
  excerpt:
  - 总的来说短剧市场最好的还是做上游的版权方，但是这个对资金、投放的要求都很高...对于中小创业公司来说还是个不错的选择...对于个体创业者或者自由职业者来说，还是做这种终端的分发者比较靠谱
findings:
- name: 星图投放单日5000万量级但利润薄
  desc: '[evidence] 星图负责人披露：短剧在星图日投放消耗约5000万，但整体ROI不高，版权方利润仅约10%，市场处于‘疯狂跑量抢市场’非盈利阶段。'
  excerpt:
  - 目前短剧市场在星图的投放量级是每天 5000 万左右，但是 ROI 不是很高，利润只有 10%左右，目前大家都是在跑量投放，疯狂抢市场的阶段
- name: 宁波行政小姑娘单条视频一夜佣金6000+验证低门槛高回报
  desc: '[evidence] 真实案例佐证：短剧分发对个人创作者存在‘低投入、高杠杆、强运气’的暴利可能，但隐含幸存者偏差。'
  excerpt:
  - 他们告诉我有一个宁波的小姑娘，本职工作是在物业公司上班做行政...发了一条抖音推广短剧，一晚上赚了 6000 多的佣金
- name: 版权方成本通胀：单剧成本3年涨3倍，剧本涨10倍
  desc: '[evidence] 行业数据对比：早期单剧拍摄成本10万->现30万；剧本费几千->2-3万。竞争白热化导致上游成本结构恶化，提高版权方回本门槛。'
  excerpt:
  - 目前版权方制作一部短剧的拍摄成本在 30w 左右，早期的时候在 10 万左右...早期的时候一个剧本也就几千块钱，而现在好点的剧本都涨价到 2-3 万左右
- name: 微信小程序承载流失率高于抖音小程序
  desc: '[evidence] 作者实测体验：微信小程序切出即失入口，用户找回路径长，导致转化流失显著高于抖音小程序（原生留存路径短）。'
  excerpt:
  - 就我个人的观看体验来说，整体感觉微信小程序的体验不太好，只要你返回其他 App 和看看消息，那个入口就消失了，用户流失相对来说会大一些
- name: 头部达人月入20万+，腰部达人月入6-7万，长尾陪跑
  desc: '[evidence] 拜访切片公司获得的分层收益数据：头部>10万/月，腰部6-7万/月，长尾按CPM 1元/千次播放勉强维持，印证‘一九原则’。'
  excerpt:
  - 收入好点的分发达人一个月大概能赚六七万佣金，头部达人一个月能赚 20 多万...每个 CPM 能有 1 块钱的收益
- name: 全职养号团队ROI低于外部兼职达人
  desc: '[claim] 作者基于‘家猪野猪理论’判断：公司全职剪辑员有底薪兜底，缺乏生存压力驱动的内容敏感度与迭代速度，不如以佣金为唯一收入的外部兼职达人‘狼性’强、产出高。'
  excerpt:
  - 在公司上班的人还真不一定会被那些外部兼职的做的好，毕竟他们是需要依靠这个业务做收入的，在公司上班还是有基本保底工资的，这就是家猪和野猪的区别
