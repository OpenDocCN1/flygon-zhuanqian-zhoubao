paper: docs/202306/20230613_079.md
desc: 该素材是一篇关于电子产品抢购副业的实操指南，核心阐述了利用京东、淘宝、拼多多等电商平台“百亿补贴”价格与回收商收购价差进行套利的盈利模式。文章详细拆解了以
  iPhone 为例的利润测算逻辑（单笔约 300-500 元）、具体操作流程（比价-下单-转寄-结款）、以及避免账号被风控（即“黑脸”）的养号策略，将该业务定位为资金占用较大但无需抢购、可稳定执行的“低保”式理财项目。
concepts:
- name: 电子产品套利
  desc: 利用电商平台百亿补贴价格低于二手回收市场价格的差价，通过下单购买新品并转卖给回收商赚取差价的商业模式。
  is_original: false
  excerpt:
  - 电子产品也是典型的从电商平台下单 主要分布在京东、淘宝、拼多多三个电商平台 去抢购手机、电脑、游戏机、显卡等
  - 百亿补贴就是会比普通网上售卖更便宜 这种不像演唱会 不像其他的东西 需要靠抢 抢到了才有利润 这种是随便下单 只要下单了就有利润
- name: 百亿补贴价差
  desc: 电商平台官方补贴价与第三方回收商报价之间的正向价差，是该业务的核心利润来源。
  is_original: true
  excerpt:
  - 6.1 日回收价为 8178 淘宝百亿补贴内实际下单金额为 7678 那么 8178-7678=500 元
- name: 黑号/黑脸
  desc: 指电商账号因长期薅羊毛、不正常交易行为（如仅买高利润商品、不评价、恶意退款）被平台风控系统标记，导致在有利润商品上无法下单（显示无货、排队）的状态。
  is_original: true
  excerpt:
  - 那京东也不傻 能放量给你吗？
  - “黑号”并不是代表你不能使用这个账号 平常购物还是可以使用的 只是在有利润的特定商品上会显示没货 或者显示前方下单人数过多 请稍后再试
- name: 养号
  desc: 通过模拟真实用户的日常购物行为（浏览、正常下单、好评、不恶意退款）来维护或恢复账号权重，使其能通过平台风控审核，成功下单高利润商品。
  is_original: false
  excerpt:
  - 任何电商平台是必须必须必须要养号的
  - 你是经常习惯性用京东 并且习惯性好评 也会有评论的大白号 你说你是京东你放不放量吧
- name: 低保抢购
  desc: 将电子产品抢购业务定位为：虽需较大本金（几千至万元），但无需定时抢购、操作确定性高、周转快（一周内）、收益稳定（几百元）的基础保障型副业项目。
  is_original: true
  excerpt:
  - 电子产品类的需要的金额比其他的高，可以当“低保”抢购 几千块钱一周下来就能赚个三五百 当个日常小理财来看待 还是不错的 毕竟不需要抢 佛系下单即可
methods:
- name: __overview__
  desc: 电子产品抢购套利的标准化操作流程：每日获取回收价 -> 三平台比价筛选利润款 -> 选官旗/信誉店下单 -> 收货转寄回收商 -> 回收商验货结款。
  excerpt:
  - 根据每日回收的价格表去三个电商平台的百亿补贴进行比价； 利润很透明 下单之前对于具体利润就已经了解 ； 尽量选择官方旗舰店 或有过交易的店铺 不然很容易收到假货
  - 算上下单 到货 转寄到结款 一周之内就可以搞定
- name: 利润测算法
  desc: 单品利润 = 当日回收商报价 - 电商平台百亿补贴实付金额。以 iPhone 14 Pro Max 256G 为例：8178 - 7678 = 500元。平均单笔利润约
    300 元。
  excerpt:
  - 以 iPhone 14 Pro Max 256G 为例 6.1 日回收价为 8178 淘宝百亿补贴内实际下单金额为 7678 那么 8178-7678=500
    元 那么这台手机就可以赚 500 元
  - 一般来情况下来说平均利润在是在 300 元左右/单
- name: 避坑选品策略
  desc: 在比价环节，优先选择官方旗舰店或有过成功交易记录的店铺下单，规避收到假货/翻新机导致回收商拒收或扣款的风险。
  excerpt:
  - 尽量选择官方旗舰店 或有过交易的店铺 不然很容易收到假货
- name: 账号权重维护法
  desc: 平时正常使用账号购物、撰写好评、避免恶意差评/退款，建立正常用户画像；若账号已‘变黑’，需停止薅羊毛行为，通过一段时间正常养号恢复权重。
  excerpt:
  - 你是经常习惯性用京东 并且习惯性好评 也会有评论的大白号
  - 不要恶意差评也会各个平台很重要的考核点 不然严重了直接是永久封禁
  - 薅完需要养养 具体看薅到什么程度了
theorems:
- name: 平台风控必然性定律
  desc: 电商平台基于盈利目标，必然通过用户画像（使用频次、喜好、评价行为）筛选高价值用户，长期仅薅羊毛的低价值账号必然被限流（黑号）。
  excerpt:
  - 站在电商平台角度上 肯定也希望要盈利 用户数量 用户使用频次 用户喜好等就就变成了筛选的条件
  - 你平常基本不用 用就是为了抢有利润的东西要么抢低价 要么点返利链接 拿了一堆优惠券也不用 那京东也不傻 能放量给你吗？
- name: 电子产品套利优于票务抢购的确定性主张
  desc: 电子产品抢购不依赖手速和运气（非限量抢购），只要下单成功即锁定利润，且资金周转周期短（一周），风险低于票务类需抢购且面值波动大的业务。
  excerpt:
  - 这种不像演唱会 不像其他的东西 需要靠抢 抢到了才有利润 这种是随便下单 只要下单了就有利润
  - 算上下单 到货 转寄到结款 一周之内就可以搞定 这样的一笔钱直接可以增值 300 块钱
findings:
- name: iPhone 14 Pro Max 单品实测利润
  desc: '[evidence] 2023年6月1日实测数据：淘宝百亿补贴到手价 7678 元，回收价 8178 元，单笔净利 500 元。验证了该模式在高端机型上的高利润潜力。'
  excerpt:
  - 以 iPhone 14 Pro Max 256G 为例 6.1 日回收价为 8178 淘宝百亿补贴内实际下单金额为 7678 那么 8178-7678=500
    元
- name: 平均单笔利润区间
  desc: '[claim] 作者宣称电子产品抢购平均利润在 300 元左右/单，资金占用 5000-12000 元/台，周转周期一周内。'
  excerpt:
  - 一般来情况下来说平均利润在是在 300 元左右/单
  - 一部苹果手机的本金在 5000-12000 左右 算上下单 到货 转寄到结款 一周之内就可以搞定
- name: 黑号可逆性发现
  desc: '[evidence] 基于评论区互动验证：账号被风控（黑号）并非永久废号，正常购物功能不受影响，仅针对高利润商品限购；通过停止薅羊毛、正常养号可恢复下单权限。'
  excerpt:
  - “黑号”并不是代表你不能使用这个账号 平常购物还是可以使用的 只是在有利润的特定商品上会显示没货 或者显示前方下单人数过多 请稍后再试
  - 薅完需要养养 具体看薅到什么程度了
- name: 大促期利润增厚规律
  desc: '[claim] 作者宣称遇到大促时间（如 618），平台补贴力度加大，导致百亿补贴价格下降，从而拉大与回收价的价差，利润更加丰厚。'
  excerpt:
  - 现在又逢抢购业务大促时间 所以利润会更加的丰厚
