learning_targets:
- 理解实体创业“九死一生”的认知门槛，识别对标错位、SKU臃肿、流量黑箱、调研浮浅等核心死因
- 掌握选址验证的“笨方法论”：人流实测、市政排查、岗前打工、低认知命名与高可见招牌
- 建立合规为生死线的意识，识别特种行业资质红线与下沉市场人情博弈的隐性成本
- 掌握成本结构重塑方法：SKU阈值清洗、非核心投入上限、房租占比红线
- 能运用对标层级匹配定律与单店模型标准化评估，选择可复制的创业样板
- 掌握“经营是1、营销是0”的第一性原理与止损即盈利的理性关店决策
- 掌握同城流量获客闭环：同城号方法论、爆款视频SOP、美团权重优化与私域分层锁客
- 理解从打工者到践写者的认知跃迁路径，用实战复盘穿越创业周期
concept_map:
- 第19章 线下实体生存法则 —— 从「开店不倒」到「单店跑通」
- ├── 认知破局：先看清「九死一生」的牌桌
- │   ├── [概念] 认知门槛：流量/对标/合规/调研的系统性盲区 —— 162
- │   ├── [概念] 认知差即红利：比同行多懂一点线上流量即垄断方圆6公里 —— 159
- │   ├── [方法] 失败案例五维归因复盘（对标/产品/流量/资源/调研） —— 162
- │   ├── [主张] 前置调研成本 << 试错损失成本 —— 068
- │   └── [主张] 失败教训比成功经验更有迁移价值 —— 162
- ├── 选址如选战场：用计步器代替拍脑袋
- │   ├── [概念] 笨方法论：原始但可靠的实地调研 —— 068
- │   ├── [方法] 人流量实测法（计步器7天，工作日vs周末，跨街区对比） —— 068
- │   ├── [方法] 市政规划风险排查法（12345查询+合同嵌入修路减租条款） —— 068
- │   ├── [方法] 岗前沉浸式打工法（3个月学盈利模型与客诉处理） —— 068
- │   ├── [方法] 低认知成本命名法 + 高可见度招牌设计法（红底白字/夜间亮灯） —— 068
- │   └── [主张] 选址微观差异决定生死：一条街火≠你的铺位活 —— 068
- ├── 合规是护城河：先办证再开店
- │   ├── [概念] 特种行业资质：娱乐经营许可证/消防验收/公安备案 —— 237
- │   ├── [概念] 下沉市场人情三维博弈：搞定顾客、同行、监管 —— 164
- │   ├── [方法] 合规软件边界：仅保留计时计费/桌费，严禁赌博功能 —— 237
- │   ├── [主张] 合规是生死线而不是成本线 —— 237
- │   └── [主张] 商场托底策略可屏蔽执法骚扰与同行找茬 —— 164
- ├── 成本结构重塑：菜单减法是利润加法
- │   ├── [概念] 长尾SKU负价值定律：月销<20单边际贡献为负 —— 162
- │   ├── [方法] SKU销量阈值清洗法（压缩至30-50个核心单品） —— 162
- │   ├── [方法] 核心指标资源聚焦法（包材/装修设上限，让位流量与核心食材） —— 162
- │   ├── [主张] 房租占营收15%-20%为健康线 —— 237
- │   └── [主张] 品质及格线下，谁终端做得好谁有市场 —— 162
- ├── 对标如找镜子：只学「同量级」的优等生
- │   ├── [概念] 可复制对标模型 —— 162
- │   ├── [方法] 同量级对标照抄法（辐射区域最优同行或新开2-3月优等生） —— 162
- │   ├── [方法] 财务四指标验证：投了多少钱/赚了多少/能否持续/有无先例 —— 162
- │   └── [主张] 跨5个量级对标必然资源错配、动作变形 —— 162
- ├── 单店模型是种子：先打磨可复制的「1」再谈连锁扩张的「0」
- │   ├── [概念] 单店模型标准化评估（标准化程度/复制成本/投入/市场容量） —— 164
- │   ├── [概念] 众创架构与期权行权（半藏总院-分院-联创-股东四层+300万行权） —— 120
- │   ├── [方法] 分院冷启动SOP（联创出资→发展股东→成立庆典品鉴会） —— 120
- │   ├── [主张] 熟食店优于火锅店；轻资产无人化棋牌室可快速复制 —— 164, 237
- │   └── [主张] 分院院长必须全职投入，兼职玩票拿不到长期红利 —— 120
- ├── 下沉市场藏金矿：成本低一半，利润却更高
- │   ├── [概念] 下沉市场生存悖论（房租1/4、营收1/2、利润率反超一线） —— 164
- │   ├── [概念] 强龙不压地头蛇（直营店长打不过创业夫妻/熟人排外/供应链不灵活） —— 164
- │   ├── [方法] 产品差异化研发法（请教厨师+找秘方+自主改进工艺） —— 164
- │   ├── [方法] 一战而定竞争策略（诱导对手备货后集中半价收割，注意法律与道德边界） —— 164
- │   └── [主张] 价格敏感度>品牌溢价；消费习惯存在断层 —— 164
- ├── 止损即盈利：关店不是认输
- │   ├── [概念] 盈亏平衡点感知（日单量=固定成本/单均毛利） —— 162
- │   ├── [主张] 结构性缺陷无法突破时果断关店，保本金优于盲目坚持 —— 162
- │   └── [主张] 沉没成本不参与决策，学费需转化为经验资产 —— 162
- ├── 第一性原理：经营是1，营销是0
- │   ├── [概念] 菜单工程：菜单是最大的销售员 —— 070
- │   ├── [概念] 坪效与进店转化率 —— 070
- │   ├── [方法] 标杆拆解法（蜜雪冰城/宜家/太二逆向推导） —— 070
- │   ├── [方法] MVP最小化运营（69平零活动零引流月业绩29.5万） —— 070
- │   └── [主张] 没有经营逻辑这个「1」，品牌营销再多的「0」也无效 —— 164
- ├── 同城流量获客：织一张方圆6公里的无线渔网
- │   ├── [概念] 隐形同城账号/低粉高变现（粉丝几百上千、变现却很猛） —— 159, 161
- │   ├── [方法] 同城号方法论：对标账号一比一拆解复制+模板化日更 —— 159, 161
- │   ├── [主张] 自媒体仅是获客工具，不依赖保险推修 —— 069
- │   ├── [例证] 汽修店折腾抖音一年无果→用对方法一个月营收10万 —— 069
- │   └── [例证] 眼镜店3000粉月变现5万；轻医美单日引流100组私域 —— 161, 163
- ├── 爆款视频像流水线：把卖点变成内容，把脚本变成SOP
- │   ├── [概念] 卖点内容化 / 到店理由 / 稳定出单脚本 —— 118
- │   ├── [方法] 六步法：机制认知→卖点提炼→到店理由→内容转化→脚本标准化→数据优化 —— 118
- │   └── [主张] 脚本决定下限、优化决定上限；不做泛娱乐只做精准卖货 —— 118
- ├── 美团排名是线上铺位：评分和权重决定你的曝光
- │   ├── [概念] 评分与排名强耦合，可同步运营干预 —— 165
- │   ├── [方法] 引流单+利润单组合/达人探店刷标签/好评返现/营销工具组合 —— 165, 237
- │   ├── [方法] 每日监控曝光-点击-到店-核销漏斗 —— 237
- │   └── [例证] 棋牌室美团做到区域Top3，月稳定盈利2万 —— 237
- ├── 私域是自家的鱼塘：从公海捞鱼到养鱼复购
- │   ├── [概念] 美团私域双轮驱动模型（公域获新+私域留存） —— 237
- │   ├── [方法] 三层锁客：体验群→充值会员群→合伙人群 —— 237
- │   ├── [方法] 充值权益/闲时特价/老带新裂变/自动追踪佣金 —— 237, 120
- │   └── [主张] 充值会员贡献营收>60%为健康线；社群品鉴裂变 —— 237, 120
- ├── 线下活动如做菜：拿一份标准菜谱就能出餐
- │   ├── [方法] 实体门店线下活动标准模型（SOP化，零成本户外引流） —— 049
- │   └── [主张] 标准模型降低执行门槛，实战资历是可复制性的背书 —— 049
- └── 认知跃迁：从打工者到践写者
- '    ├── [概念] 践写者：只说只写自己做过并拿到结果的事 —— 237'
- '    ├── [路径] 收入骤减→心理落差→借力社群/头部案例→全职入局→穿越周期 —— 166'
- '    ├── [方法] 头部案例复刻与领路人筛选法（不盲目试错） —— 166'
- '    ├── [主张] 好的初创团队自带天使轮/A轮资源 —— 120'
- '    └── [主张] 复盘输出回馈社群，形成分享-验证-连接飞轮 —— 166, 237'
life_analogy:
- 想象经营实体店是**经营一口鱼塘**：
- '- **选址** = 鱼塘的地理位置，决定先天有多少野生鱼（自然流量）'
- '- **自然流量** = 鱼塘自带的鱼群，是生意的根基'
- '- **同城号/营销** = 撒网的工具，只能捞鱼塘里已有的鱼，绝不能凭空造鱼'
- '- **私域闭环** = 把捞到的鱼养进自家小池，繁殖复购与裂变'
- '- **菜单/SKU** = 投喂的饵料，种类太多浪费、太少鱼长不肥'
- '- **对标同行** = 看隔壁鱼塘怎么投喂，只看同量级的塘才能抄作业'
- '- **房租成本** = 塘租，占比过高会把利润全吃光'
- '- **合规证照** = 养鱼许可证，没有会被封塘罚款'
- '- **止损关店** = 发现这口塘根本没鱼，及时换塘保住本金'
- 就像好渔夫先看塘再买网，实体生意要先选好铺位、跑通单店模型，再用营销网放大收益。
summary:
- concept: 认知门槛
  desc: 实体创业九死一生的根源：流量、对标、合规、调研等系统性盲区
- concept: 认知差即红利
  desc: 比同行多懂一点线上流量，就能垄断方圆6公里的同城客源
- concept: 前置调研成本 << 试错损失成本
  desc: 开店前用笨方法实测调研的花费，远低于关店亏掉本金
- concept: 选址笨方法论
  desc: 用计步器数人流、查市政规划、岗前打工等原始可靠手段代替拍脑袋
- concept: 选址微观差异
  desc: 同一条街两侧、工作日与周末的人流可能天差地别，必须实测微观坐标
- concept: 合规生死线
  desc: 特种行业的许可证、消防、公安备案是开店前提，赌博功能软件=刑事入口
- concept: 下沉市场人情三维博弈
  desc: 搞定顾客、同行、监管三方关系，否则三天两头停业整顿
- concept: SKU精简（长尾SKU负价值）
  desc: 月销<20单的菜品边际贡献为负，应定期清洗聚焦核心单品
- concept: 房租占比红线
  desc: 房租占营收15%-20%是常见健康线，超出则吞噬全部利润
- concept: 对标层级匹配定律
  desc: 只复制同量级、同阶段、同区域的成功模型，跨级对标必失败
- concept: 单店模型标准化评估
  desc: 用标准化程度、复制成本、投入、市场容量四维判断连锁化潜力
- concept: 下沉市场生存悖论
  desc: 三四线房租1/4、营收1/2，成本优势反而带来更高净利率
- concept: 强龙不压地头蛇
  desc: 大品牌街边店败于缺乏人情味、熟人排外与供应链不灵活
- concept: 止损即盈利
  desc: 结构性缺陷无法突破盈亏平衡点时，果断关店保住本金
- concept: 经营是1，营销是0
  desc: 经营基本功是“1”，品牌营销是后面的“0”，没有1再多0也无效
- concept: 菜单工程 / 坪效
  desc: 菜单是最大的销售员，优化菜单与空间效率ROI远高于投放
- concept: 同城号方法论
  desc: 用极低粉丝量获取精准本地客源，实现实体店低粉高变现
- concept: 卖点内容化 / 爆款脚本SOP
  desc: 把产品卖点转化为视频内容并标准化脚本，才能长期稳定出单
- concept: 美团权重优化
  desc: 引流单+利润单、达人探店、好评运营与漏斗监控提升评分排名
- concept: 私域流量闭环
  desc: 体验群→充值群→合伙人群三层锁客，充值会员贡献营收>60%为健康线
- concept: 线下活动标准模型
  desc: 把头部实战经验沉淀为SOP，零成本也能做出高引流活动
- concept: 践写者 / 认知跃迁
  desc: 从打工者到践写者：只说做到的事，用实战复盘穿越创业周期
exercises:
- 'no': 1
  title: 用“笨方法论”做一次真实选址评估
  contents:
  - 选一个你所在城市即将出租或你感兴趣的商铺（可实地观察，也可用地图实景辅助），完成以下任务：
  - 1. 设计一份7天人流实测表：划分时段，分别统计工作日与周末从早到晚的路人数量，记录高峰期
  - 2. 用市政官网或12345查询该路段是否有修路/市政规划，草拟一条“修路减免房租”的合同条款
  - 3. 观察同街区马路两侧的业态与人流差异，判断你的目标铺位是否处于“微观活跃带”
  - 4. 为该店设计一个低认知成本的店名（让人知道你是做什么的、容易记住），并说明招牌配色与夜间亮灯方案
  - 回答问题：
  - '- 为什么“一条街很火”不等于“你的铺位活”？'
  - '- 前置调研的金钱和时间成本如何估算？它为什么远低于关店试错成本？'
- 'no': 2
  title: 给一家麻辣烫店做成本与菜单“手术”
  contents:
  - 假设你接手一家麻辣烫店，现有SKU 100+个，月销数据示例：鱼丸300单、午餐肉260单、鸭血45单、黄喉8单、牛骨髓5单……（请自行补充至30个SKU并标注月销）
  - 1. 按“SKU销量阈值清洗法”划定月销<20单的淘汰名单，说明砍掉后的冰箱容量、采购复杂度、损耗变化
  - 2. 核算房租占比：若月营收8万、房租1.8万、包材定制费0.3万，分别计算占比并判断是否触犯红线
  - 3. 重排菜单结构：把高毛利+高频单品放在黄金视觉区，设计一个“引流套餐”和两个“利润套餐”
  - 4. 提出资源聚焦方案：哪些非核心投入（包材/装修/食材溢价）应砍掉或降级，把预算让给流量获取
  - 回答问题：
  - '- 长尾SKU的边际贡献为什么是负的？有没有例外情况？'
  - '- 房租占比超过30%时，除了换址还有哪些自救路径？'
- 'no': 3
  title: 拆解一家“同量级”的优等生门店
  contents:
  - 在你所在的城市选择一家新开2-3个月且业绩突出的实体店（餐饮/零售/服务均可），完成：
  - 1. 用财务四指标验证模型：投了多少钱、赚了多少钱、能否持续赚钱、有没有成功先例
  - 2. 拆解其选址逻辑（人流/租金占比/竞品密度）、菜单或SKU结构、流量打法（平台/私域/活动）
  - 3. 判断哪些动作可直接“照抄”，哪些需要结合自身优势做本地化微调
  - 4. 用一个标准化评估矩阵（标准化程度/复制成本/投入成本/市场容量）判断这个业态是否值得连锁化
  - 回答问题：
  - '- 为什么对标头部（如杨国福/海底捞）对初创者是有害的？'
  - '- 如何识别同量级成功案例中的“隐性资源”（人脉/供应链/运气），避免幸存者偏差？'
- 'no': 4
  title: 为一家棋牌室设计“同城号+美团+私域”获客闭环
  contents:
  - 假设你在三线城市经营一家棋牌室（12个包间），月目标净利2万元，请设计：
  - 1. 同城号内容模板：提炼3个“卖点内容化”脚本（如私密性/设备新/闲时划算），写出钩子、到店理由、行动号召
  - 2. 美团运营方案：设计“引流单+利润单”套餐组合、达人探店与好评运营动作、营销中心工具配置（新客立减/闲时券）
  - 3. 私域三层架构：设计体验群→充值会员群→合伙人群的入群钩子、充值阶梯权益、老带新裂变佣金规则
  - 4. 合规自查清单：列出娱乐经营许可证、消防验收、公安备案及软件功能（严禁赌博）等必须项
  - 回答问题：
  - '- 为什么说“无人≠无脑”？无人化解决的与不解决的分别是哪些问题？'
  - '- 美团公域流量成本上涨时，私域如何降低CAC并提升LTV？'
- 'no': 5
  title: 下沉市场开店 vs 一线城市止损——两难决策模拟
  contents:
  - 给定两个真实改编场景：
  - 场景A：乐亭县城熟食店M，房租为北京1/4，年净利20万+，双汇/紫燕百味鸡街边店被“打跑”
  - 场景B：某城市写字楼底商麻辣烫店，美团区域排名第一却零利润，附近大公司均有食堂，3公里内10+同类竞品
  - 1. 用“经营是1，营销是0”和“对标层级匹配定律”分析场景B失败的结构性原因
  - 2. 为场景A设计“一战而定”之外的差异化竞争策略（注意：该策略存在法律与道德风险，请说明你的边界）
  - 3. 判断场景B应否关店止损，并用“沉没成本不参与决策”论证
  - 4. 给出一份下沉市场人情三维博弈（顾客/同行/监管）的行动清单
  - 回答问题：
  - '- “强龙不压地头蛇”对品牌方和本地创业者分别意味着什么？'
  - '- 下沉市场的高利润率是否可持续？天花板在哪？'
units:
- 'no': 1
  name: 实体创业的第一课 —— 先看清‘九死一生’的牌桌
  points:
  - '**为什么需要这个概念？**'
  - '- 实体创业失败率高，许多老板因认知盲区踩坑后血本无归'
  - '- 99.99%的实体老板不懂线上流量，却要面对懂流量的新对手'
  - '- 盲目对标头部、忽视合规、轻视调研，是倒闭的三大常见原因'
  - '**核心定义**'
  - '- 认知门槛指创业者对流量、对标、合规、调研等关键变量的系统性盲区；突破它才能避免‘九死一生’'
  - '**关键性质**'
  - '- 前置调研成本远低于试错损失成本'
  - '- 认知差即红利：比同行多懂一点线上流量，就能垄断方圆6公里客源'
  - '- 失败案例的复盘教训比成功经验更有迁移价值'
  - '**典型例子**'
  - '- 麻辣烫店开业2个月做到美团区域第一，却因结构性问题零利润被迫关店'
  - '- 初中毕业汽修店老板折腾抖音一年分文不进，用对同城号方法后一个月营收10万'
  - '**边界条件**'
  - '- 认知觉醒不能替代执行，仍需落地动作'
  - '- 不同行业、不同城市的认知门槛有差异'
  sources:
  - paper: docs/202306/20230613_159.md
    role: origin
  - paper: docs/202306/20230613_162.md
    role: critique
  - paper: docs/202306/20230613_237.md
    role: apply
  - paper: docs/202306/20230613_069.md
    role: apply
  - paper: docs/202306/20230613_166.md
    role: apply
  - paper: docs/202306/20230613_161.md
    role: apply
  - paper: docs/202306/20230613_163.md
    role: apply
  excerpts:
  - 99.99%的实体老板大半辈子都是跟自己的行业在打交道，完全不懂线上流量，而这个时候你只需要比同行多懂那么一点点，你就几乎垄断了方圆 6 公里甚至是整个同城线上的流量
  - 这家店开了差不多两个月，目前在美团上做到了该品类区域排名第一，但她准备这周六关店不干了。
  - 初中毕业的汽修店老板，折腾抖音一年分文不进，按照这个方法一个月营收十万元
  - 如果她认识 30 个同行，知道同行的成本结构，赚钱方式，或者去其他店铺打工积累经验，或许会少踩一些坑。
- 'no': 2
  name: 选址如选战场 —— 用计步器代替拍脑袋
  points:
  - '**为什么需要这个概念？**'
  - '- 选址决定门店生死，但主观‘看着热闹’常导致误判'
  - '- 同一条街两侧、工作日与周末的人流可能天差地别'
  - '- 市政修路等外部风险可以在几天内毁掉一个商铺'
  - '**核心定义**'
  - '- 选址的‘笨方法论’：用计步器数人流、查市政规划、岗前打工等原始但可靠的实地调研，替代拍脑袋决策'
  - '**关键性质**'
  - '- 前置调研成本远低于试错损失成本'
  - '- 微观坐标差异决定生死：一条街火不等于你的铺位火'
  - '- 外部政策风险可通过合同条款对冲（如修路减免房租）'
  - '**典型例子**'
  - '- 花一周在目标商铺前统计从早到晚路过人数，并对比周末和工作日'
  - '- 五线城市修路半年，路两边商铺全部歇业'
  - '**边界条件**'
  - '- 调研只能降低风险，不能保证盈利'
  - '- 不同业态（餐饮/零售/服务）对人流的要求不同'
  sources:
  - paper: docs/202306/20230613_068.md
    role: origin
  - paper: docs/202306/20230613_162.md
    role: critique
  - paper: docs/202306/20230613_237.md
    role: apply
  excerpts:
  - 统计人流量，笨方法，但一定要做……花一周时间，去你准备租的商铺前，用计步器，算下从早到晚有多少人路过。
  - 建议去当地市政部门，或者市政规划网站找一找有没有修路的相关信息……如果确认没有规划修路，建议在跟房东签合同时，看能不能加一个如果修路，适当减免房租的条款。
  - 别看一条街很火，但是隔了一条马路，就会经常发生马路一边的商铺火，另一边不火，周一到周五人多，周六日没人，所以一定要实地考察统计。
  - 她本以为选址的地方办公楼众多，用餐量会很大，但她却没有调研清楚附近有好多大公司，都有自己的食堂
- 'no': 3
  name: 合规是护城河 —— 先办证再开店，别把命门交给运气
  points:
  - '**为什么需要这个概念？**'
  - '- 特种行业（如棋牌室）无证经营面临查封、罚款甚至刑事责任'
  - '- 下沉市场的基层执法存在‘人情’博弈，不搞关系会被反复刁难'
  - '- 很多老板把合规当成本线，实际它是生死线'
  - '**核心定义**'
  - '- 合规准入指开店前必须完成的行政许可（娱乐经营许可证、消防验收、公安备案等）及对基层监管关系的经营'
  - '**关键性质**'
  - '- 合规是固定成本，不可规避'
  - '- 软件含赌博功能=开设赌场罪的刑事入口'
  - '- 下沉市场需搞定顾客、同行、监管三维人情'
  - '- 大品牌入驻商场可屏蔽本地找茬与执法骚扰'
  - '**典型例子**'
  - '- 棋牌室因涉特种行业，需办齐娱乐经营许可证、消防验收、公安备案，系统严禁控牌/赔率功能'
  - '- 乐亭本地基层执法人员月薪仅三四千，靠‘找事’变现，不搞关系会被停业整顿'
  - '**边界条件**'
  - '- 不同行业资质要求差异大，需提前咨询主管部门'
  - '- 合规只是起点，日常消防、治安检查仍需持续维护'
  sources:
  - paper: docs/202306/20230613_237.md
    role: origin
  - paper: docs/202306/20230613_164.md
    role: apply
  excerpts:
  - '王亚莉莉 : 你好，请问下棋牌室需要什么资质吗，会不会被公安查？有没有政策风险'
  - '安哥拉 : 还好你没有开'
  - 下沉市场就是人情市场，这个人情，主要包含三个方面：第一是搞定顾客……第三是搞定工商管理……用 M 的话说，本地 gw 员一个月就三四千块钱，你以为他们靠工资过活吗？
  - 商场会给你处理消防、排污、食品卫生等一系列琐事。当然，入驻商场，一般也不会有人来找事儿。
- 'no': 4
  name: 菜单减法是利润加法 —— 砍掉不赚钱的SKU
  points:
  - '**为什么需要这个概念？**'
  - '- SKU越多，采购、后厨、库存、损耗成本越高'
  - '- 精美包材等非核心投入稀释毛利，客户却无感知'
  - '- 房租占比过高会吞噬全部利润'
  - '**核心定义**'
  - '- 成本结构重塑：以流量获取和核心食材为优先，砍掉长尾SKU和非核心投入，将房租控制在合理占比的利润管理方法'
  - '**关键性质**'
  - '- 长尾SKU边际贡献为负，月销<20单应强制清洗'
  - '- 包材/装修等体验投入要设上限，避免‘过度包装’'
  - '- 房租占营收15%-20%是常见健康线'
  - '**典型例子**'
  - '- 麻辣烫店100+SKU需3台冰箱，许多菜品月销不足20单，包材精心设计却让毛利率低于同类'
  - '- 棋牌室月净利2万的关键之一是房租占比控制在15%-20%'
  - '**边界条件**'
  - '- 精简SKU不等于无菜单，需保留高频、高毛利的核心单品'
  - '- 房租占比因城市、业态不同有差异，一线城市可能更高'
  sources:
  - paper: docs/202306/20230613_162.md
    role: origin
  - paper: docs/202306/20230613_068.md
    role: apply
  - paper: docs/202306/20230613_237.md
    role: apply
  excerpts:
  - 菜品越多采购难度越大，后厨操作起来越不方便。很多菜品完全可以砍掉，店铺里面不少菜品月销量不足 20 单。
  - 她的包材（筷子包装、碗的包装、外卖口袋），全部精心设计，花费了不少时间和金钱成本，菜也买比较好的……这或许让她的店铺毛利率低于同类。
  - 在品质过得去的前提下，谁终端做得好，谁就有市场。
- 'no': 5
  name: 对标如找镜子 —— 只学‘同量级’的优等生
  points:
  - '**为什么需要这个概念？**'
  - '- 初创者常见错误是一上来对标行业巨头，导致资源错配、动作变形'
  - '- 比你高5个量级的公司的打法，你根本模仿不了'
  - '**核心定义**'
  - '- 对标层级匹配：选择辐射区域内最优同行或新开2-3个月业绩突出的店铺，验证财务指标后直接照抄'
  - '**关键性质**'
  - '- 只有同量级、同阶段、同区域的成功案例才具备可复制性'
  - '- 需从投入、产出、持续性、成功先例四方面验证模型'
  - '- 模仿照抄比盲目创新更适合资源有限的初创者'
  - '**典型例子**'
  - '- 麻辣烫店对标杨国福/张亮，SKU高达100+导致运营失控'
  - '- 眼镜店3000粉丝月变现5万，靠的是模板化复制同城成功账号'
  - '**边界条件**'
  - '- 同量级成功也可能有隐性资源（人脉、供应链），需警惕幸存者偏差'
  - '- 对标后仍需结合自身优势做本地化微调'
  sources:
  - paper: docs/202306/20230613_162.md
    role: origin
  - paper: docs/202306/20230613_070.md
    role: apply
  - paper: docs/202306/20230613_166.md
    role: apply
  - paper: docs/202306/20230613_161.md
    role: apply
  excerpts:
  - 一上来就对标行业里面最好的公司，模仿对方的菜品。比你高 5 个量级（比如营收）以上的公司，你很难模仿。
  - 其实，她应该对标的是自己店铺辐射区域做得最好的同行；或者新开 2-3 个月，但是做得特别好的店铺。
  - 从财务指标上看一个生意，需要关心：投了多少钱，赚了多少钱，能不能持续赚钱，有没有成功案例。
  - 3000 粉丝月变现 5W
- 'no': 6
  name: 单店模型是种子 —— 先打磨可复制的‘1’，再谈连锁的‘0’
  points:
  - '**为什么需要这个概念？**'
  - '- 连锁扩张的前提是单店模型能赚钱且可复制'
  - '- 不同业态的标准化程度决定扩张天花板'
  - '**核心定义**'
  - '- 单店模型标准化评估：从标准化程度、复制成本、投入成本、市场容量四个维度判断业态是否值得连锁化'
  - '**关键性质**'
  - '- 标准化程度高、复制成本低、投入低、市场容量大的业态更有万店潜力'
  - '- 熟食店优于火锅店，棋牌室轻资产无人化可快速复制'
  - '- 众创/加盟模式需要核心成员全职投入，兼职‘玩票’拿不到长期收益'
  - '**典型例子**'
  - '- 熟食店高标准化可做千店万店，火锅店海底捞也仅千店上限'
  - '- 半藏酱酒分院要达成年销售300万才能行权，但兼职院长难以完成'
  - '**边界条件**'
  - '- 标准化程度高不等于一定成功，仍需供应链和组织能力'
  - '- 评估模型用于决策优先级，不是唯一成功公式'
  sources:
  - paper: docs/202306/20230613_164.md
    role: origin
  - paper: docs/202306/20230613_237.md
    role: apply
  - paper: docs/202306/20230627_120.md
    role: apply
  excerpts:
  - 如果要做加盟，熟食店更标准化、复制成本低、投入成本低，市场容量大，极有可能做成千店、万店品牌；火锅店操作复杂、单店投入成本高，最大的品牌海底捞，也就一千多家店，市场容量有限。
  - 我总结了一下，分院要成功达成 300，至少分院院长要全职做，像我这样兼职玩票的只能是玩玩，最后是没发拿到总院的股份，也就是无法分享未来的上市红利。
  - 月稳定盈利 2 万元的棋牌室案例复盘
- 'no': 7
  name: 下沉市场藏金矿 —— 成本低一半，利润却更高
  points:
  - '**为什么需要这个概念？**'
  - '- 一线经验直接下沉会水土不服，但下沉市场有独特的机会'
  - '- 房租、人力、原料成本低，利润率反而可能超过一线'
  - '**核心定义**'
  - '- 下沉市场生存悖论：三四线城市单店营收虽小，但因成本结构优势，净利润率更高；同时外来大品牌因排外、不灵活、店长缺乏拼劲而难以生存'
  - '**关键性质**'
  - '- 低营收高利润，年净利20万+是常见水平'
  - '- 价格敏感度>品牌溢价，便宜是刚需'
  - '- 熟人市场排外，外来口音导致顾客流失、同行找茬'
  - '- 商场托底策略可让外来品牌规避街边店死局'
  - '**典型例子**'
  - '- 乐亭县城熟食店单店年净利20万+，双汇/紫燕百味鸡街边店被打跑'
  - '**边界条件**'
  - '- 下沉市场利润上限较低，难以支撑高速扩张'
  - '- 人情关系维护有隐性成本和时间消耗'
  sources:
  - paper: docs/202306/20230613_164.md
    role: origin
  excerpts:
  - 在三四线开店，比一二线赚钱。因为房租、人员、原料成本低，单店利润率高过一线城市。举个例子，房租是北京的四分之一，营业额是北京的一半，自然就有更高的利润空间。
  - 第一是很多大品牌要做直营店打样板，但是打工的店长是干不过创业的小老板、小夫妻的。简单说，这种直营店没有人情味儿，回头客少。
  - 下沉市场主要还是价格敏感性，便宜是刚需。
- 'no': 8
  name: 关店不是认输 —— 是保住本金等待下一战
  points:
  - '**为什么需要这个概念？**'
  - '- 当单店模型有结构性缺陷时，继续坚持只是烧钱'
  - '- 很多创业者因‘舍不得’而拖到负债累累'
  - '**核心定义**'
  - '- 止损即盈利：在已知可控范围内无法突破盈亏平衡点，且核心逻辑存在结构性问题时，果断关店、保护本金'
  - '**关键性质**'
  - '- 沉没成本不参与决策，只看未来能否盈利'
  - '- 止损成本就是避免更大损失的隐性收益'
  - '- 理性关店后保留复盘资本和再战机会'
  - '**典型例子**'
  - '- 麻辣烫店两个月做到美团区域第一，但算账后零利润，作者建议及时关店'
  - '**边界条件**'
  - '- 必须区分结构性缺陷与短期波动，不能一遇困难就关店'
  - '- 关店后应认真复盘，把学费转化为经验资产'
  sources:
  - paper: docs/202306/20230613_162.md
    role: origin
  excerpts:
  - 这家店开了差不多两个月，目前在美团上做到了该品类区域排名第一，但她准备这周六关店不干了。
  - 没去之前，还想建议她再坚持 2 个月，去了后，也建议她关店及时止损。
  - 庆幸她现在还年轻……亏损得不算多，只能算交学费了。学费不能白交，需要认真总结教训。
- 'no': 9
  name: 经营是1，营销是0 —— 没有1，再多的0也是空
  points:
  - '**为什么需要这个概念？**'
