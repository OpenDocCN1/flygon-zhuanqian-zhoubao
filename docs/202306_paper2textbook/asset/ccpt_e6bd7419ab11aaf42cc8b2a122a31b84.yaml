paper: docs/202306/20230613_099.md
desc: 该素材是一篇项目复盘文章，记录了作者在‘风向标’社群分享一个低门槛蓝海项目后，仅两天内引发超过1000人入场、笔记量激增2000篇、客单价从99元崩盘至9.9元的全过程。文章深度剖析了项目从诞生、爆发到被‘毁灭’（红海化）的生命周期，揭示了信息不对称消失导致的商业价值归零规律，并核心主张获取社群价值的关键不在于获取‘项目’本身，而在于刻意练习‘需求挖掘’与‘执行力’等底层能力。
concepts:
- name: 龙哥风向标
  desc: 文中提及的付费社群/信息源名称，作为高密度信息分发渠道，其发布的项目信息能引发大规模即时跟风执行，是导致项目生命周期极度压缩的外部催化剂。
  is_original: false
  excerpt:
  - 5 月 25 日，我在风向标中分享了一个门槛极低的蓝海项目实操。
  - 龙哥风向标是怎么“毁灭”一个项目的
- name: 项目红海化/毁灭
  desc: 指因信息大规模公开导致从业者指数级涌入，供需关系逆转，客单价暴跌（99元->9.9元），商业利润空间被压缩至近乎为零的过程。文中定义为项目被‘毁灭’的核心特征。
  is_original: true
  excerpt:
  - 两天时间内，超过 1000 人下场，相关笔记增加超 2000 篇，项目的客单价直接从 99 元卷到 9.9 元。
  - 一个项目是如何产生的，以及如何被风向标“毁灭”的。
- name: 信息半衰期
  desc: 隐性概念，指商业项目信息从‘蓝海’（信息不对称、高利润）衰变为‘红海’（信息对称、无利润）所需的时间。文中实测该周期在高浓度社群影响下压缩至 48
    小时以内。
  is_original: true
  excerpt:
  - 两天时间内，超过 1000 人下场... 客单价直接从 99 元卷到 9.9 元。
- name: 刻意练习（获取价值的核心路径）
  desc: 作者提出的应对策略：不应依赖获取‘现成项目’，而应通过刻意练习‘需求挖掘本领’和‘执行力’，构建不可被复制的核心竞争力。
  is_original: true
  excerpt:
  - 如果你想获取风向标中的真正价值，为什么需要刻意练习。
  - 抓住某类人的某类需求就是赚钱的点... 这就要看挖掘需求的本领... 这就要看执行力
methods:
- name: __overview__
  desc: 复盘分析法：通过时间线记录（T0分享 -> T+2天数据采集 -> 结果量化）结合因果归因（信息扩散->供给过剩->价格战），还原项目生命周期全貌，并提炼出底层能力建设的方法论。
  excerpt:
  - 5 月 25 日，我在风向标中分享... 两天时间内... 客单价直接从 99 元卷到 9.9 元。
  - 在这篇文章中我会为你复盘：一个项目是如何产生的，以及如何被风向标“毁灭”的。
- name: 项目全生命周期量化追踪
  desc: 用关键指标（参与人数、内容产出量、客单价变化）在极短时间窗口（48小时）内对项目生死进行量化定义，将‘项目毁灭’从定性描述转为可验证的数据结论。
  excerpt:
  - 超过 1000 人下场，相关笔记增加超 2000 篇，项目的客单价直接从 99 元卷到 9.9 元。
theorems:
- name: 高密度社群分发加速项目红海化定律
  desc: 在高信任度、高执行力的付费社群中公开具体可执行的商业项目细节，会引发‘羊群效应’式的瞬间涌入，将项目的信息红利期压缩至天级，导致客单价快速归零，项目商业价值毁灭。
  excerpt:
  - 5 月 25 日，我在风向标中分享了一个门槛极低的蓝海项目实操。 两天时间内，超过 1000 人下场，相关笔记增加超 2000 篇，项目的客单价直接从 99
    元卷到 9.9 元。
- name: 项目即陷阱，能力才是护城河
  desc: 具体的‘项目’（操作手册、渠道、话术）具有极强的时效性且不可复用，一旦公开即失效；唯有‘需求挖掘能力’（发现痛点）和‘执行力’（落地变现）是跨周期、可迁移的核心资产。
  excerpt:
  - 如果你想获取风向标中的真正价值，为什么需要刻意练习。
  - 任何工具都不会满足所有人所有的需求，抓住某类人的某类需求就是赚钱的点... 需求挖掘出来了如何实现，这就要看执行力
- name: 门槛极低是毁灭加速器
  desc: 项目准入门槛越低（无技术壁垒、无资源壁垒），社群分发引发的‘毁灭’速度越快、烈度越大。低门槛意味着边际成本趋近于零，价格战瞬间打响。
  excerpt:
  - 门槛极低的蓝海项目实操... 客单价直接从 99 元卷到 9.9 元。
findings:
- name: 风向标分发实测数据：48小时红海化
  desc: '[evidence] 作者亲历实测：分享后 48 小时内，下场人数 >1000，内容产出 >2000 篇，客单价跌幅 90%（99->9.9），直接量化佐证了‘风向标毁灭项目’的结论。'
  excerpt:
  - 两天时间内，超过 1000 人下场，相关笔记增加超 2000 篇，项目的客单价直接从 99 元卷到 9.9 元。
- name: 社群成员对‘脚本/工具’的依赖性强于‘思维/能力’
  desc: '[claim] 评论区用户追问‘批量进群脚本怎么获取、版本是哪个’，侧面印证了大多数学习者关注点仍停留在具体战术工具（易失效）而非底层逻辑（长期有效），验证了作者‘需刻意练习能力’主张的必要性。'
  excerpt:
  - 大佬，请问批量进群脚本怎么获取，群聊广场版本是哪个
- name: 评论区自发提炼的‘赚钱三要素’模型
  desc: '[evidence] 评论区高赞回复自发总结出：1. 需求定位（抓住某类人某类需求）2. 需求挖掘本领 3. 执行力。该模型与作者主张的‘刻意练习’方向高度一致，构成了外部佐证。'
  excerpt:
  - 1，任何工具都不会满足所有人所有的需求，抓住某类人的某类需求就是赚钱的点 2，如何抓住某类人某类需求，这就要看挖掘需求的本领 3，需求挖掘出来了如何实现，这就要看执行力
