- 'no': 1
  name: AI 时代认知重构 —— 从“工具使用者”到“超级个体”
  desc: 本章旨在破除大众对 AI 的“门槛悖论”误解，确立 AI 作为“认知杠杆”的核心地位。我们将探讨如何通过“广义/狭义阅读”构建内生能力，以及如何利用
    AI 抹平技能鸿沟，实现从“做题家”到“解题者”的思维转变。
  nodes:
  - 'no': 1
    name: AI 门槛悖论与能力分化
    desc: 理解 AI 看似降低技术门槛，实则提高了判断力与提问能力的门槛，导致人群加速分化的现象。
    role: motivation
    src:
    - paper: docs/202306/20230613_027.md
    - paper: docs/202306/20230627_094.md
  - 'no': 2
    name: 内生项目方向与达人优先原则
    desc: 主张“先成为达人，再匹配项目”。通过广义阅读构建认知底座，狭义阅读进行项目复盘，让项目方向从内部积累中自然涌现，而非盲目追逐外部风口。
    role: method
    src:
    - paper: docs/202306/20230613_109.md
  - 'no': 3
    name: AI 生态位定位模型
    desc: 引入“生态位”概念，将用户分为甲方（平台构建者）、乙方生产者（提效降本）、乙方消费者（学习提效/转型）及第三方（痛点服务），明确自身在 AI 商业系统中的角色与盈利逻辑。
    role: definition
    src:
    - paper: docs/202306/20230627_094.md
  - 'no': 4
    name: 行动力破圈：克服中等认知陷阱
    desc: 剖析“想得多做得少”的心理机制，提出“先完成再完美”及“小步快跑试错”的行动准则，以行动换取确定性。
    role: motivation
    src:
    - paper: docs/202306/20230613_229.md
    - paper: docs/202306/20230613_111.md
- 'no': 2
  name: 提示词工程进阶 —— 从“单点指令”到“结构化思维”
  desc: 本章超越基础的“问答”模式，深入探讨高阶提示词工程。通过引入社会学研究方法论，教读者如何像科学家一样向 AI 提问，利用角色设定、语境完备化及多因果假设生成，释放模型的最大潜能。
  nodes:
  - 'no': 1
    name: 角色指令三要素与生成器
    desc: 掌握“身份、任务、约束”的结构化指令构建方法，并利用“元提示词”让 AI 反向生成专家级指令，降低创作门槛。
    role: method
    src:
    - paper: docs/202306/20230613_123.md
  - 'no': 2
    name: AI 提问的六重境界（社会学方法论迁移）
    desc: 运用赵鼎新先生的社会学研究标准，实现语境完备化、对照实验设计、多因果假设生成及隐含假设批判，提升提问的深度与严谨性。
    role: method
    src:
    - paper: docs/202306/20230627_024.md
  - 'no': 3
    name: 快写慢改与分层迭代法
    desc: 将写作任务拆解为“标题-大纲-清单-卡片”微步骤，配合“结构-材料-句式-金句-校对”的分层改稿流程，实现人机高效协作。
    role: method
    src:
    - paper: docs/202306/20230613_117.md
  - 'no': 4
    name: 长文本处理与“三体联动”策略
    desc: 解决 AI 处理长文案时的逻辑失控与风格缺失问题，通过多角色/多阶段协作机制，实现万字级文稿的高保真 IP 化转写。
    role: extension
    src:
    - paper: docs/202306/20230627_091.md
- 'no': 3
  name: AIGC 视觉创作与商用 —— 让像素为你打工
  desc: 本章聚焦 Stable Diffusion 与 Midjourney 等工具的商业落地。从“炼丹”（LoRA 训练）到“控制”（ControlNet），再到非设计背景人员的“素材库反向提词法”，构建一套可复制的视觉内容生产流水线。
  nodes:
  - 'no': 1
    name: LoRA 炼丹与 SD 应用双核范式
    desc: 理解 LoRA 作为“定制化核心入口”的作用，配合 ControlNet 实现从“生成”到“可控生成”的跨越，解决真人/特定物体的高保真还原问题。
    role: method
    src:
    - paper: docs/202306/20230613_026.md
    - paper: docs/202306/20230613_030.md
  - 'no': 2
    name: ControlNet 15 种模型与参数调优
    desc: 系统梳理 Canny, Depth, OpenPose 等模型的应用场景，掌握“模型-预处理器-任务”的强绑定原则及权重/步数的动态适配策略。
    role: method
    src:
    - paper: docs/202306/20230627_020.md
  - 'no': 3
    name: 非设计师商业出图：素材库反向提词法
    desc: 利用 Shutterstock 等专业图库的关键词体系，结合“摄影写法”与“工艺品写法”两大结构化范式，绕过审美短板直接产出商业级商品概念图。
    role: method
    src:
    - paper: docs/202306/20230627_023.md
  - 'no': 4
    name: AI 视觉变现路径：从头像到表情包
    desc: 解析 AI 头像定制（IP-Adapter/InstantID）、动态表情包（LeiaPix）及 POD（按需印刷）手机壳等低门槛、高现金流变现案例。
    role: experiment
    src:
    - paper: docs/202306/20230613_030.md
    - paper: docs/202306/20230613_207.md
    - paper: docs/202306/20230627_095.md
- 'no': 4
  name: 内容生产流水线 —— 打造你的“自动化内容工厂”
  desc: 本章探讨如何利用 RPA 与 AI 工具链，将个人内容生产升级为工业级流水线。重点解决“批量混剪去重”、“SEO 自动化内容”及“多平台分发”的效率瓶颈，实现“睡后收入”。
  nodes:
