    desc: 提出“低成本试错规模化”心法，通过海量低质但关键词精准的内容覆盖长尾搜索，获取 B 端或高意向 C 端询盘，解耦社交指标与商业价值。
    role: theorem
    src:
    - paper: docs/202306/20230627_092.md
  - 'no': 4
    name: 公众号热点文章 AI 生产 SOP
    desc: 利用微信搜一搜热点榜选题，结合“双角色协作”（风格模仿+深度分析）与“标题模板库”，实现 1200 字左右高完读率文章的快速量产。
    role: method
    src:
    - paper: docs/202306/20230613_134.md
- 'no': 5
