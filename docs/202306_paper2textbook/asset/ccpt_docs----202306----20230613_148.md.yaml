paper: docs/202306/20230613_148.md
desc: 该素材记录了作者海海hh在“航海实战”第9天，通过将ChatGPT设定为“小红书航海教练”这一角色，辅助完成小红书IP定位这一关键第一步的实操案例。文章展示了“人机协作”解决创作者“懂理论不敢落地”痛点的具体路径，并分享了通过飞书文档记录完整提问过程及应对上下文长度限制的工程化技巧（二次投喂/接入API）。
concepts:
- name: 小红书航海教练
  desc: 将ChatGPT通过Prompt Engineering设定为具备小红书运营专业知识、能引导用户完成IP定位的专家角色，实现从通用大模型到垂直领域教练的角色迁移。
  is_original: true
  excerpt:
  - 于是索性让 ChatGPT 成为我私人小红书航海教练，教我打造小红书 IP 定位
  - 不知道怎么做小红书，让小红书航海教练（ChatGPT）教你呗
- name: 航海实战
  desc: 指代“ChatGPT+自媒体”训练营中的实战演练环节，强调在规定周期内通过实操落地验证知识，对抗‘思想巨人，行动矮子’的认知偏差。
  is_original: true
  excerpt:
  - 今天已经是航海的第 9 天了...伟大的列宁说过：不要做思想的巨人，行动的矮子
  - 5 月份航海实战--ChatGPT+自媒体的志愿者
- name: 知识投喂与二次投喂
  desc: 针对LLM上下文窗口限制，用户先将长文档（如实战手册）分段或全量输入模型，后续对话中按需再次输入相关片段以维持上下文关联的工程化对话管理策略。
  is_original: true
  excerpt:
  - 我的解决方式是：把投喂的内容保存起来，需要用的时候再二次投喂。如果嫌麻烦接入 API 也是能解决的
methods:
- name: __overview__
  desc: ‘角色设定+知识库投喂+迭代对话’的三步走人机协作方法论：1. 设定专家人设；2. 投喂垂直领域知识库（实战手册）；3. 通过多轮对话推进任务（定位），并通过外部存储（飞书/本地）管理上下文实现长程推理。
  excerpt:
  - 于是索性让 ChatGPT 成为我私人小红书航海教练，教我打造小红书 IP 定位
  - 打开【小红书运营｜实战手册】认真学了起来...提问全过程请移步飞书
  - 把投喂的内容保存起来，需要用的时候再二次投喂
- name: 飞书文档记录复盘法
  desc: 将与ChatGPT的完整提问对话过程、投喂素材、生成结果沉淀至飞书文档，形成可复用、可迁移、可协作的结构化知识资产。
  excerpt:
  - 提问全过程请移步飞书：https://xvu3y1a6wl4.feishu.cn/docx/HBmfd10OXoXvmYxU2nbcYbsin2b
theorems:
- name: 行动优先于完美准备
  desc: 面对复杂任务（如IP定位），克服‘分析瘫痪’的关键在于借助AI工具强行启动第一步，而在实战中迭代优化，而非追求事前完美的理论掌握。
  excerpt:
  - 至今都没有迈出第一步去落地，这哪能行，伟大的列宁说过：不要做思想的巨人，行动的矮子
  - 终于今天下定决心先确定一个方向：ChatGPT+小红书
- name: AI作为认知脚手架降低行动门槛
  desc: 大模型不仅能生成内容，更可作为‘教练/顾问’角色，将隐性知识显性化、将复杂流程结构化，帮助新手跨越‘从0到1’的心理与能力鸿沟。
  excerpt:
  - 不知道怎么做小红书，让小红书航海教练（ChatGPT）教你呗
  - 第一步先定位。众所周知，第一步往往是最难的一步...让 ChatGPT 成为我私人小红书航海教练
findings:
- name: 上下文窗口管理的实操有效性验证
  desc: '[evidence] 作者实测‘保存投喂内容+二次投喂’策略可有效解决对话轮次增加导致的上下文遗忘问题；同时验证‘接入API’是更高阶的自动化解决方案。'
  excerpt:
  - '逐光者 : 想问一下投喂好之后，不是会因为字数限制而导致上下文失去关联吗，这个如何解决？'
  - '海海 hh : 我的解决方式是：把投喂的内容保存起来，需要用的时候再二次投喂。如果嫌麻烦接入 API 也是能解决的，刀姐前几天有说过'
- name: 社群协作产生的示范效应
  desc: '[evidence] 文章发布后引发同训练营成员（AI训练师小凡、江天、吴亿涵等）的高互动与即时行动意向，证明‘公开复盘+工具化分享’能有效激活社群的模仿学习与行动力。'
  excerpt:
  - 'AI 训练师小凡 : 你写了这周我想写的内容，大大地点赞哈哈'
  - '江天 : 投喂资料的过程学到了'
  - '吴亿涵 : 太棒了，懒人改变世界+1，这就去实操'
