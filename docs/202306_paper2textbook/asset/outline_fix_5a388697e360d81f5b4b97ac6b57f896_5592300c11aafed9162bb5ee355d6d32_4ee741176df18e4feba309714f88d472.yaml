    desc: 垂直细分赛道原创图文笔记，5个月涨粉4000+、引流近1000人、变现20万+，原创内容被大量抄袭反证权威，矩阵化复制初见成效，验证高客单价知识付费模型。
    role: experiment
    src:
    - paper: docs/202306/20230613_054.md
  - 'no': 18
