    src:
    - paper: docs/202306/20230613_055.md
- 'no': 4
  name: 抖音电商 —— 从纯付费流红海到图文二创蓝海
  desc: 本章系统对比抖音纯付费流单品短视频带货（红利耗尽、利润极薄、新手劝退）与图文二创带货（低门槛、高杠杆、弱粉丝强变现）两大范式，拆解选品硬性标准、实拍素材工厂、投流节奏、矩阵化运营等核心方法论。
  nodes:
  - 'no': 1
    name: 2023年抖音付费短视频带货红利耗尽定律
    desc: 赛道已从蓝海转为红海：流量成本持续上涨，利润空间持续压缩，头部玩家靠规模效应和供应链垄断维持微薄利润，新手入场缺乏资金厚度、供应链议价权和团队运营经验，大概率亏损退场。
    role: limitation
    src:
    - paper: docs/202306/20230613_042.md
  - 'no': 2
    name: 核心供应链议价权生存定律：佣金≥80%才能入局
    desc: 在付费流量成本趋近于商品毛利的红海期，唯有掌握核心供应链的玩家才能通过更高利润空间抵消流量成本通胀，维持正向现金流。
    role: theorem
    src:
    - paper: docs/202306/20230613_042.md
  - 'no': 3
    name: 三维硬性选品法：毛利≥70%、受众泛、退货率<5%
    desc: 选品铁律：高毛利对冲高投流成本、泛人群降低投放定向难度、低退货率控制售后隐性亏损，三条缺一不可。
    role: method
    src:
    - paper: docs/202306/20230613_042.md
  - 'no': 4
    name: 实拍素材工厂化：5人核心团队月产1500条原创视频
    desc: 建立标准化素材生产流水线：素材分类→脚本搜索筛选改编→实拍执行→剪辑产出。原创实拍视频可持续消耗1个月、斩获1000万+播放，混剪无法支撑长周期大规模投放。
    role: method
    src:
    - paper: docs/202306/20230613_042.md
  - 'no': 5
    name: 随心推测品+千川放大投流节奏法
    desc: 早期用低成本随心推快速测款测素材，验证后切换千川大预算放量；后期因竞争加剧直接上千川，但资金压力指数级上升，测品失败即沉没成本。
    role: method
    src:
    - paper: docs/202306/20230613_042.md
  - 'no': 6
    name: 抖音图文二创带货：抠图换背景、矩阵化、弱粉丝强变现
    desc: 无需直播、拍视频、混剪，仅通过商品图抠图换背景模板二创，发布‘图文来了’挂车变现。单账号1-2分钟/条，一人可运营十个号，零粉弱粉账号亦可单月销售额破十万乃至百万。
    role: method
    src:
    - paper: docs/202306/20230627_030.md
  - 'no': 7
