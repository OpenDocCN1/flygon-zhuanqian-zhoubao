- 'no': 1
  name: 社群运营 —— 打造长期复利的人脉蓄水池
  desc: 本章系统拆解社群作为复利产品的运营心法：从定位差异化、固定动作标准化、茶馆机制激活用户共创，到利益绑定机制解决运营动力，最终将社群建设为投资蓄水池实现战略跃迁。
  nodes:
  - 'no': 1
    name: 社群复利属性与生存悖论
    desc: 社群具备持续收费、信任沉淀、人脉积累的复利特性，但面临同质化严重、运营难度大、短期不赚钱的悖论，核心竞争对手是运营者自身的耐心与发心。
    role: motivation
    src:
    - paper: docs/202306/20230613_008.md
  - 'no': 2
    name: 茶馆机制：从独角戏到大合唱
    desc: 运营者退居幕后搭建舞台，通过分享激励和活动机制引导成员主动产出内容，将群主个人输出转化为成员主导的内容生产，解决‘群主独角戏’与‘成员沉默’的矛盾。
    role: method
    src:
    - paper: docs/202306/20230613_008.md
  - 'no': 3
    name: 固定动作标准化SOP与助理协作
    desc: 制定日/周/月计划表将运营动作固定化、日常化，配合助理执行确保核心节奏不中断，建立成员确定性预期。
    role: method
    src:
    - paper: docs/202306/20230613_008.md
  - 'no': 4
    name: 流量驱动与利益绑定机制
    desc: 建立持续引流机制维持社群活性，对运营助理及流量合伙人实行提成分红制，将外部流量获取与内部运营激励纳入利益共同体。
    role: method
    src:
    - paper: docs/202306/20230613_008.md
  - 'no': 5
    name: 差异化定位：小而美拒绝大而全
    desc: 拒绝同质化的‘百宝箱’式竞争，聚焦核心价值（信息与人脉），放弃非核心功能（如项目打卡），在细分领域建立独特护城河。
    role: method
    src:
    - paper: docs/202306/20230613_008.md
  - 'no': 6
    name: 社群投资蓄水池：在自己的池塘里捞鱼
    desc: 将社群定位为长期战略资源池，通过深度连接挖掘优秀人才与项目，实现从‘0-1’自营向‘1-10/10-100’投资布局的转型。
    role: extension
    src:
    - paper: docs/202306/20230613_008.md
  - 'no': 7
    name: 信任红线：一次失败毁信誉
    desc: 社群运营失败的核心代价是最初付费那批人的信任破产；若无法运营好低客单价社群，则不具备运营高客单价产品的能力。
    role: limitation
    src:
    - paper: docs/202306/20230613_008.md
  - 'no': 8
    name: 十年称王长周期论
    desc: 社群运营需置于10年周期视角：一年入门、三年入行、五年懂行、十年称王。长周期下无真实对手，唯有坚持‘发心’与‘价值观’的时间复利才能构建核心竞争壁垒。
    role: extension
    src:
    - paper: docs/202306/20230613_008.md
  - 'no': 9
    name: 免费转付费社群实战：家居陪伴年费群
    desc: 从无门槛免费群（引流粉污染、低质闲聊、广告泛滥、群主单向输出）转型为付费社群，通过付费门槛筛选用户、群友共创与大咖背书分担内容生产、沉淀4.6万字精华内容，跑通多元变现闭环。
    role: experiment
    src:
    - paper: docs/202306/20230613_132.md
  - 'no': 10
    name: 知识付费交付体系：从‘老师跟着学员走’到‘学员跟着体系走’
    desc: 通过固定学习周期、目标激励与分层社群、执行力整合机制（学员产出+导师增强）、全周期监督打卡与惩罚机制，重构师生协作关系，显著提升交付效率与学员成单率。
    role: method
    src:
    - paper: docs/202306/20230613_075.md
  - 'no': 11
    name: 蓝海定位方法论：跳出红海寻找细分蓝海市场
    desc: 通过系统性的‘蓝海定位方法论’避开红海竞争，帮助创业者和副业从业者快速发现细分蓝海市场，实现‘选择大于努力’的商业价值。
    role: method
    src:
    - paper: docs/202306/20230613_193.md
- 'no': 2
  name: 知识管理 —— 从搭积木到盖房子的认知升级
  desc: 本章阐述资料整理与知识管理的本质差异，提出五大知识串联逻辑构建领域知识体系，并推荐‘问思模体系’作为终极思维模型，实现从问题到决策的认知变现闭环。
  nodes:
  - 'no': 1
    name: 资料整理与知识管理的阶位差异
    desc: 资料整理是搭积木（聚合、分类），知识管理是盖房子（关联、系统化），管理路径为：知识点→知识链→知识面→知识体系→知识系统，难度递增。
    role: definition
    src:
    - paper: docs/202306/20230613_009.md
  - 'no': 2
    name: 五大知识串联逻辑
    desc: 构建细分领域知识体系的五种核心组织结构：主题分类、层次结构、流程/序列、网络/图形结构、矩阵结构，分别适用于不同认知场景与内容形态。
    role: method
    src:
    - paper: docs/202306/20230613_009.md
  - 'no': 3
    name: 问思模体系：基本问题-思维方式-具体思维模型
    desc: 以‘基本问题’为起点、‘思维方式’为中介层、‘具体思维模型’为工具，同一问题可对应多种思维方式进而整合不同有效策略，兼容生活经验与碎片知识附着。
    role: method
    src:
    - paper: docs/202306/20230613_009.md
  - 'no': 4
    name: 知识管理的终极目的：透过现象看本质、辅助决策拿结果
    desc: 知识管理非为了做图书管理员，而是通过管理内容提升思维认知，实现透过现象看本质、透过本质做决策、通过正确方法拿结果的认知变现闭环。
    role: motivation
    src:
    - paper: docs/202306/20230613_009.md
  - 'no': 5
    name: 生财有术索引站分类实证：主题分类+层次结构组合
    desc: 实测采用主题分类（四大板块）+层次结构（二级关键词）组合，平衡了检索效率与内容多样性，未过度细分至MECE底层。
    role: experiment
    src:
    - paper: docs/202306/20230613_009.md
  - 'no': 6
    name: 航海手册流程化组织实证：视频号带货手册
    desc: 《视频号带货实战手册》等多本手册验证流程序列法有效性，按实操步骤（了解→准备→选品→对标→制作）组织内容，显著降低实践门槛。
    role: experiment
    src:
    - paper: docs/202306/20230613_009.md
- 'no': 3
  name: 小红书电商 —— 从流量密码到精细化运营的进化
  desc: 本章复盘小红书电商从早期‘流量密码’（抄袭模仿爆款）到平台内容丰富度提升导致同质化竞争加剧、玩法失效的演进历程，提炼出选品-测品-怼爆品三阶段模型、养号提权、精细化二创、RPA自动化测品等成熟方法论。
  nodes:
  - 'no': 1
