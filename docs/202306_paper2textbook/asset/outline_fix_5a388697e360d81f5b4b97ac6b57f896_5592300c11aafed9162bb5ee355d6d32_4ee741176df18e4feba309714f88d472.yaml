    desc: 以拼多多/淘宝/抖音/小红书自有平台为数据源，路径：平台分类导航→细分类目高销量单品→评价综合评估→小红书站内搜索同款关键词验证销量热度→1688识图找货源一件代发→翻倍定价上架测试。
