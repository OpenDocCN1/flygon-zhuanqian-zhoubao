    - paper: docs/202306/20230613_150.md
  - 'no': 5
    name: 账号权重前置模型：先养号再发产品
    desc: 先通过发布同领域内容、互动提升账号权重，再发布产品笔记，利用高权重账号获得更多初始流量分配，超越直接怼量策略。
