    desc: 早期平台商品笔记内容丰富度不足，低门槛混剪搬运即可爆单；现内容生态成熟，算法倾向优质/差异化内容，单纯依赖模仿结构的‘流量密码’失效，普通人入局难度上升。
    role: motivation
    src:
    - paper: docs/202306/20230613_225.md
  - 'no': 2
