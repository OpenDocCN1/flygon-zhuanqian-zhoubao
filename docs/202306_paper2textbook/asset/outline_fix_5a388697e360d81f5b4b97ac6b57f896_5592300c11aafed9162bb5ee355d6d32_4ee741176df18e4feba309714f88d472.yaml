    desc: 前期选品确定方向，中期测品验证潜力，后期对爆品集中资源放大收益。虽操作逻辑简单，但成败取决于执行力深度与随机应变能力。
    role: method
    src:
    - paper: docs/202306/20230613_146.md
  - 'no': 3
    name: 高频多品测品法：日更5款、铺量10篇
    desc: 通过高频次上新和铺量笔记快速跑量测试，利用概率优势筛选潜力爆品。需引入素材质量控制变量，避免因素材不好误判为品不好。
