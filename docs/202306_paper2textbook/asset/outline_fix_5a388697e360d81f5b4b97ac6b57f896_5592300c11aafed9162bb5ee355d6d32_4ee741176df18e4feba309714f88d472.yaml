    desc: 当前抖音图文赛道处于流量扶持期，内容质量优于账号权重，新号/小号无需养号、无需投DOU+，仅凭内容本身即可获得百万级曝光并直接转化成交，存在显著时间窗口红利。
    role: motivation
    src:
