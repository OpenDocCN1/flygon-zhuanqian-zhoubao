paper: docs/202306/20230613_243.md
desc: 该素材系统梳理了知识付费领域“公域+私域”卖课的全链路实战方法论，核心围绕“利润公式-定价策略-高价包装-公域获客-私域转化”五大模块展开。原创性提出“价值=价格×10倍”定价锚点、课程分层产品矩阵（流量/信任/利润产品）、价值包装四维模型（目标/问题/方案/交付）及私域三大转化场域（朋友圈/群发售/1v1）的标准化SOP，旨在解决知识IP“会做课不会卖、不敢定高价、转化无章法”的通病。
concepts:
- name: 卖课利润公式
  desc: 将知识变现总利润拆解为流量×转化率×客单利润三要素，区分公域流量（内容/运营能力）与私域流量（社交/成交能力）的不同考验维度，强调流量成本上升背景下提升转化率的必要性。
  is_original: true
  excerpt:
  - 总利润 = 流量 * 转化率 * 客单利润
  - 公域考验的是我们做内容的能力、运营矩阵账号、平台运作的能力。私域考验的是我们发朋友圈、社群运营、互动成交的能力。
- name: 课程分层产品矩阵
  desc: 根据用户信任度与客单价将课程划分为三层：流量产品（几十-几百元，引流）、信任产品（几百-几千元，建立信任）、利润产品（几万-几十万，核心变现），形成阶梯式转化路径。
  is_original: true
  excerpt:
  - 定价要根据你的产品体系来定，当前这个课程，在你的产品体系里是流量产品，还是信任产品、利润产品？
  - 一般来说，流量产品价格在几十-几百。信任产品定价几百-几千。利润产品定价几万-几十万。每一层都是前一层的后端，可以用低价产品吸引流量，然后层层转化。
- name: 价值定价锚点法则
  desc: 确立'价值=价格×10倍'的定价核心标准，主张通过价格筛选高质量用户，而非盲目追求用户数量，平衡客单价与用户量以最大化总收益。
  is_original: true
  excerpt:
  - 定价的标准是：价值=价格*10 倍
  - 你定什么价格，所提供的价值，要是你价格的十倍。高价可能带来的结果就是用户变少，但其实这里的逻辑是：你的收入=客单价*用户数量
- name: 价值包装四维模型
  desc: 将课程价值提炼为用户视角的四个维度：目标（帮用户实现什么）、问题（解决什么痛点）、方案（提供何种路径）、交付（给何种具体物料/服务），避免陷入材质/工艺等供给侧自嗨。
  is_original: true
  excerpt:
  - 价值包装并不是夸大，或者虚构产品价值，而是充分挖掘产品本身已有的价值，并充分传达给用户。
  - 产品的材质、制作工艺这些其实并不重要，用户关心的，是你的产品会帮我实现什么目标、解决什么问题
- name: 私域三大转化场域
  desc: 将微信私域转化拆解为朋友圈（高频种草/信任维护）、群发售（批量稀缺/促单成交）、1v1私聊（高客单/深度信任）三个互补场域，并给出各场域的操作SOP与频次标准。
  is_original: true
  excerpt:
  - 私域这里主要指的就是微信，这里跟大家介绍三种私域卖课的方式。
  - 朋友圈成交的核心就是要多发...正常来讲 1 小时发一条是个合适的频率。
  - 群发售，就是在社群里发售你的产品。是在微信中批量成交特别有效的一种方式。
  - 在微信里私聊是最精准的成交方式...但需要一个前提——培养信任。
- name: 用户终身价值 (LTV) 导向
  desc: 主张关注单用户全生命周期价值而非单次成交金额，通过产品矩阵分层引导用户从低客单向高客单跃迁，实现复购与裂变。
  is_original: false
  excerpt:
  - 我们需要关注的，并不是单次成交的金额，而是每个用户对你来说的 lifelong value，用户终身价值。
methods:
- name: __overview__
  desc: 公域引流（短视频/直播获取精准流量）→ 私域承接（朋友圈/社群/私聊分层运营） → 分层转化（流量品→信任品→利润品） → 复购裂变（LTV最大化）的全链路卖课闭环方法论。
  excerpt:
  - 在公域卖课程，首先，我们需要获取精准用户。
  - 私域这里主要指的就是微信，这里跟大家介绍三种私域卖课的方式。
  - 定价要根据你的产品体系来定...每一层都是前一层的后端，可以用低价产品吸引流量，然后层层转化。
- name: 定价三步法
  desc: 步骤1：规避三大误区（内容堆砌定价、盲目跟随同行、主观低估价值）；步骤2：锚定两大核心因素（目标用户画像、产品矩阵定位）；步骤3：构建高价支撑体系（价值包装四维模型+个人品牌信任背书）。
  excerpt:
  - 课程定价三大误区：1. 课程内容越多价格就越高... 2. 跟着同行定价格... 3. 从自己主观判断出发...
  - 给大家分享两个决定价格的核心因素：1. 用户... 2. 产品体系
  - 定高价其实是一套整体性的策略...价值包装...个人品牌
- name: 公域精准获客法
  desc: 利用巨量算数、蝉妈妈等工具分析同行账号与直播观众画像（年龄/性别/地域/偏好）→ 反向定制高吸引力内容 → 短视频植入软硬广引发好奇 → 直播间批量承接转化。
  excerpt:
  - 我们可以用内容来筛选精准用户。现在有很多工具可以帮我们做用户研究，可以用巨量算数、蝉妈妈这些工具，分析同行账号，了解你的粉丝画像...
  - 广告分两种：硬广和软广...要引发观众的好奇，让看视频的人对你的课程产生浓厚的兴趣...
  - 直播是很多老师最常用的一种卖课方式
- name: 群发售标准化流程 (SOP)
  desc: 预热期（物料/文案/逐字稿/收款链接准备）→ 造势期（价值前置/案例背书/稀缺性营造）→ 爆发期（限时优惠/拼单/倒计时逼单）→ 收尾期（服务交付/转介绍/下轮预热），配套可直接套用的逐字稿模版。
  excerpt:
  - 群发售的环节如下：[图示流程]
  - 在发售之前，需要准备好宣传物料（包括课程海报、介绍文案等）、分享逐字稿、收款链接等。
  - 以下几点是可以提高群发售转化率的关键要素：[图示要素]
  - 再给圈友们分享一个我们自己在用的群发售模版，可直接套用
- name: 朋友圈高频运营节奏
  desc: 设定1小时/条的高频发布标准，内容覆盖生活晒单（人设）、成交截图（社会认同）、干货输出（专业度）、互动评论（活跃度）、成功案例（结果导向）五大板块，配套每日发圈模版表单化执行。
  excerpt:
  - 朋友圈成交的核心就是要多发。不要怕刷屏...正常来讲 1 小时发一条是个合适的频率。
  - 那朋友圈发什么？可以晒生活、晒成交、分享干货、互动评论、晒成功案例等。
  - 给大家分享一个我们常用的朋友圈每日发圈模版，可以结合你的行业来套用
theorems:
- name: 非标品价值自定义定律
  desc: 课程作为非标准化智力产品，其价值边界模糊，卖家拥有定义权；高价本质是高价值感的传递，而非成本加成，核心在于挖掘并放大'为用户节省时间/解决痛点/达成目标'的确定性结果。
  excerpt:
  - 课程和普通的实物产品（包子、可乐、手机等）最大不同就是，课程不是标品，它是你“智慧和技能”的提炼。因此，课程本身的价值是不够明确的，这带来的好处就是，你其实可以自己定义这个价值。
  - 用户需要的其实不是你的产品，而是能带给他/她的好处和价值。准确地说，后面要再加一个字，感。价值感。
- name: 个人品牌信任加速器
  desc: 个人品牌本质是降低商业信任成本的杠杆；视频媒介因高信息密度（视听觉+环境+人格特质）最利于建立'准社会关系'，普通人只需在细分领域持续输出真实个性即可构建小而美的信任护城河。
  excerpt:
  - 商业中有一个很大的成本就是信任。如果你的个人品牌很强，就可以更快达成信任，提高转化效率。
  - 相比于文字、音频，视频所能传递的信息密度更高...对你形成全方位的感知，加深了解，从而逐渐产生信任。
  - 做个人品牌，你需要有个性...做自己，是给想做个人 IP 的人最好的策略。
- name: 精准流量大于大流量原则
  desc: 公域运营核心非追求流量总量，而是通过内容钩子筛选'同频高意向'用户；百级精准流量经优质转化路径可超越万级泛流量，符合二八定律的高杠杆投入产出逻辑。
  excerpt:
  - 流量不是越多越好，关键是找到需要你产品的精准用户。二八定律，要找到那些你所做的事情中，投入少、产出高的部分。
  - 正常一条视频发出去，即使只有几百流量，只要内容精准，也能吸引到精准同频的用户。
findings:
- name: 律师课程价值重构案例
  desc: '[evidence] 原《创业者法律避险课》销量低迷，经价值包装重构为《新手老板如何避开10大法律雷区》+必备合同模版+精准咨询服务，精准击中创业者''多快好省''刚需，实现高客单价成交。'
  excerpt:
  - 我有个咨询客户是个商业律师，做了一个《创业者法律避险课》...销量不高。
  - 从这个需求点出发，她就可以把价值提炼出来，做成《新手老板如何避开 10 大法律雷区》，再加上很多附加价值之后，价格也可以定得更高。
- name: 《寻找小糖人》定价启示
  desc: '[claim] 同一产品（唱片）在不同人群/场景（美国vs南非）价值天差地别，证明产品价值非内生固定，而是由''人群-场景-需求''三元组决定，卖家不应主观低估价值。'
  excerpt:
  - 美国有一部电影叫《寻找小糖人》...同样的两张唱片，有人拿到南非去卖，却卖出了超过 50 万的销量...看着平凡无奇的产品，换一个人群、空间、场景，可能就价值巨大。
- name: 短视频广告好奇心转化机制
  desc: '[claim] 短视频带课广告（软/硬广）的核心转化杠杆是''引发好奇→产生兴趣→建立期待''的心理链条，而非直接罗列课程大纲。'
  excerpt:
  - 做内容广告的时候需要注意的一点，就是要引发观众的好奇，让看视频的人对你的课程产生浓厚的兴趣，想了解，想学习，对学完之后的效果充满期待，这样就会带来很好的转化效果。
- name: 群发售关键转化要素清单
  desc: '[evidence] 实战总结出提升群发售转化率的关键要素清单（含稀缺性、社会认同、风险逆转、限时利益点等），并形成可复用的标准化执行模版。'
  excerpt:
  - 以下几点是可以提高群发售转化率的关键要素：[图示要素]
  - 再给圈友们分享一个我们自己在用的群发售模版，可直接套用
- name: 1v1成交信任前置路径
  desc: '[evidence] 高客单1v1成交依赖''公域内容价值积累→私域朋友圈/社群高频触达→低客单产品首次付费建立信任锚点→高客单深度转化''的渐进式信任建立链路。'
  excerpt:
  - 在做 1v1 成交之前，你需要通过日常的朋友圈、社群交流、短视频分享等形式，不断为用户提供价值，逐渐对你产生信任。
  - 结合我们前面讲到的产品矩阵，也可以先从小的成交开始，让用户逐步熟悉你、认可你，逐渐建立对你的信任，从一次到多次为你付费。
