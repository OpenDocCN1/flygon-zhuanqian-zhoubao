learning_targets:
- 理解小红书电商红利期的三大特征与判断信号
- 掌握漏斗式选品法从宏观赛道到微观单品的完整流程
- 学会搭建小红书无货源模式并核算单品利润
- 掌握爆款笔记伪原创的去重技术（视频混剪、图片MD5修改）
- 学会账号权重冷启动与限流诊断方法
- 熟悉合规私域引流与高客单转化的信任模型
- 掌握广告商单变现的逆向布局与动态定价方法
- 能根据自身资源选择并组合适合的变现模式
concept_map:
- 小红书电商实战
- ├── 平台认知与红利期
- │   ├── 红利期三大特征 —— 无品牌垄断、无固定打法、未进入规范期
- │   ├── 红利信号 —— 笔记带货分销功能、本地团购内测、探照灯计划
- │   └── 核心主张 —— 普通人入场要趁早，红利随时间衰减
- ├── 选品方法论
- │   ├── 漏斗式选品法
- │   │   ├── 宏观赛道 —— GMV三档分级（百万/十万/万级）、粉丝门槛、价格带
- │   │   ├── 微观单品 —— 笔记制作成本、运营成本、启动资金、利润核算
- │   │   └── 核心主张 —— 选品定生死，目标与能力匹配，先下手为强
- │   ├── 跨平台销量对标法 —— 拼多多/淘宝高销量→小红书验证→1688找货源
- │   ├── 致敬同行选品法 —— 低粉高销的对标账号即验证过的爆品
- │   └── 爆品跨平台预埋 —— 抖音爆品提前布局小红书，吃时间差红利
- ├── 商业模式
- │   ├── 无货源模式（一件代发）
- │   │   ├── 零库存、轻运营、高试错容忍度
- │   │   └── 核心主张 —— 信息差赚差价，单品类多SKU打爆
- │   └── 自有货源模式
- │       └── 爆文反向定制选品，掌握定价权与质控权
- ├── 内容生产与账号运营
- │   ├── 爆款笔记伪原创
- │   │   ├── 视频混剪去重 —— 分割→打乱→转场→画中画→比例调整
- │   │   ├── 图片MD5修改 —— 滤镜调色+消除笔+贴纸遮挡
- │   │   ├── 文案杂糅重组 —— 拆解3-5条爆款高光句式重组
- │   │   └── 标签全覆盖 —— 提取高频标签去重合并
- │   ├── 账号权重冷启动
- │   │   ├── 历史爆款去重养号 —— 日更3-5条，目标200-500+阅读
- │   │   ├── 限流诊断 —— 探针笔记测试，500播放为分水岭
- │   │   └── 死号判定 —— 连续10条不过百，注销重置
- │   └── 内容进化三阶段 —— 搬运→二创→原创，原创享受超级红利
- ├── 流量获取与转化
- │   ├── 搜索流量SEO —— 关键词全链路布局，合集笔记垄断长尾
- │   ├── 私域引流与高客单转化
- │   │   ├── 收藏夹引流法 —— 利用平台原生功能构建长路径
- │   │   ├── 公众号中转 —— 规避直接留微信的违规风险
- │   │   └── 内容信任桥梁 —— 免费资料建信任，用户主动付费
- │   └── 广告商单变现
- │       ├── 逆向品牌决策链路 —— 关键词/场景/人设布局
- │       ├── 三步动态定价法 —— 同行询价+平台基准+博弈微调
- │       └── 需求匹配度标准 —— 粉丝需求∩产品需求非空即原生
- └── 规模化放大
- '    ├── 矩阵号策略 —— 企业号Pro一拖三，多账号对冲风险'
- '    ├── 标准化SOP —— 四阶段手册+模块化飞书知识库，批量复制'
- '    └── RPA自动化 —— 自动采集测品，提升测品效率'
life_analogy:
- 想象小红书电商是一个**在热门夜市租摊位卖爆款小吃**的过程：
- '- **小红书平台** = 夜市的人流'
- '- **红利期** = 夜市刚开业，摊位少、人流大、管理松'
- '- **选品** = 选择卖什么小吃（不能选太冷门的，要选已经被验证排队多的）'
- '- **无货源模式** = 你不需要自己备食材，隔壁摊位帮你做，你只负责吆喝和收钱，赚差价'
- '- **爆款笔记伪原创** = 看到隔壁摊位的小吃卖得好，你把他的招牌换个颜色、重新排个版，变成自己的招牌，避免被管理者说是抄袭'
- '- **账号权重** = 你的摊位等级，老摊位、常出摊、互动多，夜市管理员会给你更好的位置'
- '- **私域引流** = 让顾客加你微信，以后不在夜市也能直接找你点餐，复购率高'
- '- **广告商单** = 有品牌找你，在你摊位上放他们的海报，按人流付钱'
- 就像夜市摊主需要根据人流和流行趋势调整菜单，小红书电商也需要根据平台红利和用户需求动态调整选品和内容。
summary:
- concept: 小红书电商红利期
  desc: 平台未形成品牌垄断、玩法百花齐放、稽查宽松的窗口期，早入场早吃肉，晚入场成本指数级上升。
- concept: 漏斗式选品法
  desc: 从宏观赛道到微观单品分层筛选，用GMV分档、价格带打分和成本核算锁定蓝海单品的标准化选品方法论。
- concept: 小红书无货源模式
  desc: 不囤货不发货，通过1688/拼多多一件代发赚取差价的轻资产电商模式，适合个人或小团队低门槛试错。
- concept: 爆款笔记伪原创
  desc: 通过视频混剪（分割、打乱、转场、画中画）和图片MD5修改（滤镜、消除笔、贴纸）等技巧，让搬运内容通过平台原创检测。
- concept: 账号权重冷启动
  desc: 新号先发去重后的历史爆款养权重，以单篇500播放为健康分水岭，连续10条不过百即判定死号注销重置。
- concept: 私域引流与高客单转化
  desc: 利用收藏夹/公众号中转等间接路径规避风控，用免费内容建立信任桥梁，用户观察后主动付费，转化率远超硬推。
- concept: 广告商单变现
  desc: 基于品牌检索链路逆向布局关键词/场景/人设，结合需求匹配度植入和三步动态定价获取广告收益。
- concept: 矩阵化运营
  desc: 多账号并行测品，利用概率思维以量换确定性，单号成本极低，一个号跑通即可覆盖全矩阵成本。
- concept: 搜索流量SEO
  desc: 在昵称、标题、正文、标签等全链路布局关键词，利用合集笔记垄断搜索入口，获取长尾免费流量。
- concept: 内容信任桥梁
  desc: 免费资料/内容作为用户筛选与信任建立媒介，实现‘零推销自成交’，用户质量高且退单率低。
exercises:
- 'no': 1
  title: 漏斗式选品模拟：从赛道到单品的计算
  contents:
  - 给定某品类按价格带分成三档的数据：
  - '- A档（7.9-17.9元）：GMV 5万，销量 8000，互动量 2000'
  - '- B档（17.9-27.9元）：GMV 8万，销量 5000，互动量 3500'
  - '- C档（27.9-37.9元）：GMV 10万，销量 6000，互动量 2500'
  - 打分规则：GMV和互动量越大得分越高，销量越大得分越低（权重自行设定）。
  - 请完成：
  - 1. 按打分规则计算三档综合得分，选出最优价格带；
  - 2. 假设你选中B档，1688进货价8元，售价25元，运费3元，平台佣金5%，计算单件利润；如果要月赚6000元，需要卖出多少件？
  - 3. 回答问题：为什么万级赛道对新手更友好？价格带与带货难度有什么关系？
- 'no': 2
  title: 爆款笔记伪原创流程设计
  contents:
  - 给定一段从拼多多复制的商品视频（约15秒）和3张商品图，请设计完整的去重方案：
  - 1. 写出视频混剪去重的标准步骤（至少列出5个动作）；
  - 2. 写出图片伪原创的处理流程，并说明MD5修改的原理；
  - 3. 如果平台升级了‘帧级查重’或‘AI识别’，你还需要增加哪些操作？
  - 4. 思考：为什么原封不动搬运笔记必然导致限流？
- 'no': 3
  title: 私域引流路径设计：从公域到高客单成交
  contents:
  - 假设你是一位‘金钱关系疗愈’博主，想将小红书粉丝引到微信卖高客单价课程（单价1999元）。
  - 请设计：
  - 1. 公域钩子：设计一个笔记主题和一个免费资料包（用于引导关注）；
  - 2. 引导话术：写出至少2个不同版本的引导话术，规避平台的‘重复检测机制’；
  - 3. 中转路径：画出从收藏夹/公众号到微信的完整路径，并标注每个环节的风控要点；
  - 4. 用户添加微信后，第一步应该做什么来建立信任？
  - 注意：不允许直接留微信号或诱导私信。
- 'no': 4
  title: 广告商单定价与匹配判断
  contents:
  - 假设你是一个2万粉的女性成长类博主（内容包括认知提升、读书、自律），收到两个广告邀约：
  - '- A：某祛痘产品（单价198元）'
  - '- B：某高端职场技能课程（单价3999元）'
  - 请完成：
  - 1. 用‘需求匹配度标准’判断哪个广告更契合你的账号，并说明理由；
  - 2. 假设你决定接B的广告，按三步动态定价法写出你的报价思考过程（同行底价、平台报备价、试探策略）；
  - 3. 设计一个‘内涵共振’的植入方案，将产品内涵与你的IP内涵结合。
