learning_targets:
- 理解社群不应是温室，变现责任完全由个人自负盈亏的核心原则
- 识别‘素人等级森林’中不同个体能力、资源与认知的巨大差异，避免盲目模仿
- 掌握航海实战范式，通过‘先把手弄脏、跑通项目赚到第一块钱’跑通0到1闭环
- 运用微进步正反馈锚定法，以微小工具/流程进步替代结果焦虑，消除行动瘫痪
- 意识到选择本身是高强度认知努力，需在调研、溯源、试错后再做赛道决策
- 意识到高密度社群分发会加速项目红海化，项目即陷阱，需求挖掘能力与执行力才是跨周期护城河
- 掌握普通人抱团拉新模型，通过三档合伙人分级与锁定金机制实现无头部IP团队的规模化裂变
- 运用锁定金机制筛选高意向用户，利用微型航海裂变将服务转化为拉新引擎
- 运用基础佣金提前结算激励解决长周期拉新后期动力衰减问题
concept_map:
- 生财非温室论
- ├── 去庇护性：社群不兜底最终结果，仅提供信息、工具和同伴压力 —— docs/202306/20230627_078.md
- └── 自负盈亏：成员需亲自把手弄脏，环境不保障收益 —— docs/202306/20230627_078.md
- 素人等级森林
- ├── 异质性强：身份标签掩盖阶层与能力差异 —— docs/202306/20230613_021.md
- └── 可迁移但不可复制：核心能力可跨域迁移，形成路径不可短期复制 —— docs/202306/20230613_021.md
- 航海实战范式
- ├── 躬身入局 —— docs/202306/20230613_021.md
- ├── 先把手弄脏 —— docs/202306/20230613_021.md
- └── 跑通项目赚到第一块钱 —— docs/202306/20230613_021.md
- 微进步正反馈锚定法
- ├── 过程导向：接纳不完美作为常态 —— docs/202306/20230613_021.md
- └── 抗焦虑：以微小工具进步替代宏观结果指标 —— docs/202306/20230613_021.md
- 选择需建立在认知努力之上
- ├── 认知门槛高：选赛道前需调研、溯源、试错 —— docs/202306/20230613_021.md
- └── 非一次性决策：需持续根据反馈修正选择 —— docs/202306/20230613_021.md
- 项目即陷阱，能力才是护城河
- ├── 时效性强：信息公开即失效，客单价可48小时暴跌90% —— docs/202306/20230613_099.md
- └── 能力优先：需求挖掘能力与执行力是跨周期核心资产 —— docs/202306/20230613_099.md
- 普通人抱团拉新模型
- ├── 分级协作：TOP5/TOP15/长尾百人三档合伙人 —— docs/202306/20230613_266.md
- ├── 风控先行：分散建群、关闭群二维码、核心操盘手隐身 —— docs/202306/20230613_266.md
- └── 核心操盘手不可或缺 —— docs/202306/20230613_266.md
- 锁定金机制
- ├── 预付定金筛选高意向用户 —— docs/202306/20230613_266.md
- └── 全额退还并赠送福利，构建锁单预估与造势 —— docs/202306/20230613_266.md
- 微型航海裂变机制
- ├── 免费带领新圈友实战高确定性小项目 —— docs/202306/20230613_266.md
- └── 建立信任口碑，诱导用户自发转化为下一轮拉新合伙人 —— docs/202306/20230613_266.md
- 基础佣金提前结算激励
- ├── 长周期中段由队长自掏腰包提前发放基础佣金 —— docs/202306/20230613_266.md
- └── 即时正反馈激活后期爆发式转化 —— docs/202306/20230613_266.md
life_analogy:
- 想象生财社群不是一座‘温室养护花圃’，而是一座‘野外生存训练营’：
- '- 温室（错误认知） = 社群只提供课程和人脉，保证学员最终一定赚钱'
- '- 训练营（正确认知） = 社群提供航海手册、工具清单、同伴压力与信息杠杆，但实战、跑单、亏损与盈利全部由个人自负'
- '- 内讧植物（被庇护者） = 只刷精华帖、不执行项目，习惯在信息温室里满足，现实中零变现'
- '- 勇士（实践者） = 把手弄脏，跑通‘认知-技能-执行’最小闭环，赚到第一块钱才允许进阶'
- '- 教练（操盘手/航海长） = 提供训练器材与规则，不替你上战场，不保证你胜利'
- 就像生存训练营的教练不会替你打猎，生财社群也不会替你赚钱；环境提供杠杆，成长靠自负盈亏。
summary:
- concept: 生财非温室论
  desc: 社群提供杠杆与信息，但变现责任完全由个人承担，环境靠大家共建，不兜底最终结果。
- concept: 素人等级森林
  desc: 同为素人，500强总监与普通打工者的底层能力、资源与认知天差地别，不能简单划等号盲目模仿。
- concept: 航海实战范式
  desc: 躬身入局、先把手弄脏、跑通项目赚到第一块钱，以强制实操倒逼认知升级。
- concept: 微进步正反馈锚定法
  desc: 将‘知工具、会用工具’等最小进步定义为核心正反馈，替代发笔记、涨粉、变现等结果指标，消解焦虑。
- concept: 选择需建立在认知努力之上
  desc: 选赛道前必须进行调研、溯源、试错，无努力支撑的选择只是赌博。
- concept: 项目即陷阱，能力才是护城河
  desc: 具体项目具有时效性且不可复用，唯有需求挖掘能力与执行力是跨周期核心资产。
- concept: 普通人抱团拉新模型
  desc: 无头部IP团队通过三档合伙人分级聚合长尾流量，实现拉新总量对标头部大V。
- concept: 锁定金/生财金机制
  desc: 开售前预付定金全额退还并赠送福利，用于锁单预估、造势建立信心、筛选高意向用户。
- concept: 微型航海裂变机制
  desc: 免费带领新圈友实战小项目，通过实践-交流-复盘-迭代建立信任，诱导用户自发转化为下一轮拉新合伙人。
- concept: 基础佣金提前结算激励
  desc: 长周期拉新中段提前发放基础佣金，利用即时正反馈激活合伙人后期积极性。
exercises:
- 'no': 1
  title: 识别你身边的‘素人等级’差异
  contents:
  - 请列出你认识的3个表面都叫‘普通人’或‘素人’的朋友/熟人：
  - 1. 其中一人过去在大厂/外企/金融机构任职超过3年
  - 2. 其中一人是全职父母或刚毕业学生，无职场积累
  - 3. 其中一人拥有特定垂直资源（如供应链、渠道、行业人脉）
  - 思考问题：
  - '- 如果他们三人同时做同一个副业项目（如小红书带货），谁的启动难度最低？谁最容易放弃？'
  - '- 在盲目复制某个‘素人月入过万’案例前，你需要溯源该案例者的哪些隐性变量？'
  - '- 你自己属于哪一类‘素人’，应该选择哪种匹配度更高的起点？'
- 'no': 2
  title: 跑通第一个微型航海闭环
  contents:
  - 请在社群或朋友圈寻找一个门槛极低、周期不超过7天的小项目（如线下美团圈圈拉新、网盘拉新、简单问卷填写等），按以下步骤执行：
  - 1. 确认项目的最小必要知识与技能清单（不超过5条）
  - 2. 设定‘赚回第一块钱’或‘获得首个正向反馈’作为唯一目标
  - 3. 独立完成一次全流程操作，记录每一步的耗时与卡点
  - 4. 输出一篇不少于200字的复盘，包含：做了什么、遇到了什么工具/流程短板、下一步如何优化
  - 思考问题：
  - '- 在这个闭环中，哪一步是你最大的‘认知盲区’？'
  - '- 如果要让10个朋友跟你一起做，哪个环节最需要标准化SOP？'
- 'no': 3
  title: 评估一条社群风向标项目的‘毁灭速度’
  contents:
  - 选择社群中近期被大量分享的一个低门槛项目，按以下维度评估：
  - 1. 项目准入门槛（无技术/无资金/无资源，打几个勾）
  - 2. 项目信息公开度（是否在公开社群/朋友圈被1000+人看到）
  - 3. 客单价波动空间（是否容易被价格战压至接近成本）
  - 4. 你自身是否具备该项目的需求挖掘能力与执行力（非单纯复制脚本）
  - 思考问题：
  - '- 如果明天有1000人同时做这个项目，你的优势在哪里？'
  - '- 除了照抄操作手册，你还能在这个项目上培养什么跨周期能力？'
  - '- 这个项目是否适合作为你长期护城河的起点，还是仅作为一次试错？'
