learning_targets:
- 理解AI变现的核心赛道：AI写作、AI绘画/视频、ChatGPT插件与平台引流
- 掌握AI写作双轮驱动模型与衍生品矩阵的构建逻辑
- 掌握合规授权+生成式工作流重构非标服务的方法
- 学会用原生能力对比判据评估ChatGPT插件的商业价值
- 能运用SOP思维将平台起号、引流、转化标准化（小红书/抖音/拼多多）
- 理解高客单私域闭环的信任前置逻辑与敏感赛道生存法则
- 掌握PDCA循环、AB话术测试等底层迭代方法论
- 建立AI工具理性与复利思维，识别认知陷阱
