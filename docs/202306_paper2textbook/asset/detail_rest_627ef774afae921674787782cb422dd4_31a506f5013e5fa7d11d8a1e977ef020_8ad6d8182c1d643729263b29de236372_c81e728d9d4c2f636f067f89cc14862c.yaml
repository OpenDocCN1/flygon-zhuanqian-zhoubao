exercises:
- 'no': 1
  title: 设计AI写作双轮驱动模型
  contents:
  - 假设你创办了一个AI写作工作室，需要搭建“前端获客矩阵”和“后端生产工厂”。
  - 1. 请列出前端至少5个渠道，并说明各自承担的流量角色。
  - 2. 请设计后端SOP流程的3个关键环节（例如：需求拆解→AI初稿→人工质检）。
  - 3. 回答问题：如果前端某平台突然限流，你的模型如何保持稳定？衍生品矩阵可以如何对冲风险？
- 'no': 2
  title: 用“原生能力对比”评估ChatGPT插件
  contents:
  - 场景：你计划开发一款ChatGPT插件，候选方向有“语音输入转文字”、“复杂数学计算”、“每日新闻摘要”。
  - 1. 请用“与ChatGPT原生能力对比”判据分析这三个方向，选出你认为最值得做的方向并说明理由。
  - 2. 列出该插件的变现模式（导流/Affiliate/功能付费）及可持续性判断。
  - 3. 提示：先列出对比维度，再得出结论。
- 'no': 3
  title: 为便携咖啡机设计小红书起号SOP
  contents:
  - 产品信息：便携咖啡机，拿货价80元，目标客群：都市白领。
  - 1. 按照“权重分级、爆款选品、六维去重、优惠券定价”四大支柱，写出7天起号计划。
  - 2. 具体包括：如何判断账号权重？如何筛选对标爆款？如何设置价格与优惠券？
  - 3. 思考：如果账号播放量一直低于100，你会采取什么动作？为什么？
- 'no': 4
  title: 用PDCA规划首月带货直播
  contents:
  - 假设你下个月开始在抖音直播带货（纯自然流），用PDCA循环制定首月计划。
  - 1. Plan：设定1个月GMV目标、选品策略、排品计划。
  - 2. Do：列出每周必须执行的3个关键动作。
  - 3. Check：确定3个核心数据指标（如转化率、停留时长等）并说明原因。
  - 4. Act：根据数据优化的两个预案。
  - 5. 最后用一段话总结“PDCA为什么能驱动指数增长”。
