paper: docs/202306/IwUDdGvHhojaL2xwtUzc6YyZnHh.md
desc: 该素材系统阐述了如何利用第三方数据平台（如蝉小红）结合RPA自动化采集技术，通过构建“需求度-电商价值-竞争度”三维指标体系与加权评分模型，对小红书电商行业类目及细分品类进行数据化筛选与决策的完整方法论，并对适用边界（直播间转化vs私域转化、红海细分机会）及决策主观性进行了界定。
concepts:
- name: 需求度指标
  desc: 用于衡量用户对某行业/品类内容消费意愿的核心指标，定义为“笔记互动数/笔记数”的比率，需结合绝对数量综合判断。
  is_original: false
  excerpt:
  - 这里我们重点关注笔记互动数和笔记数这两个值的比例，也就是：笔记互动数/笔记数
  - 这个比例越大，则说明用户对这类笔记的参与度越高，也就侧面反映了用户对这类笔记的需求度越高，当然，这里我们不能只关注两者的比例，同时还要关注其绝对数量。
- name: 电商价值指标
  desc: 衡量行业/品类商业化承载能力的指标，核心由“带货笔记占比”与“商品数”两个维度构成，反映可直接在站内转化的产品丰富度。
  is_original: false
  excerpt:
  - 针对电商价值这个指标，我们需要重点关注的是：1. 带货笔记占比 2. 商品数
  - 因为带货笔记占比和商品数越多，就意味着这个行业中可以商业化的产品就越多。
- name: 竞争度指标
  desc: 反映行业内容供给饱和度的指标，定义为“行业笔记占比”（某行业笔记数/全平台笔记数），占比越高竞争越激烈。
  is_original: false
  excerpt:
  - 针对竞争度这个指标，我们需要重点关注的是：行业笔记占比
  - 一个行业的笔记在所有行业笔记中的占比越高，就说明该行业竞争度也越高
- name: 行业综合评分模型
  desc: 作者原创的加权决策模型，公式为：综合得分 = (30 - 需求度排名) + (30 - 电商价值排名)*2 + 竞争度排名。设置电商价值权重为2，并引入‘商品数<1000或带货笔记占比<1%即判0分’的否决性门槛机制。
  is_original: true
  excerpt:
  - 最终的综合评分规则如下：综合得分 = (30 - 需求度排名) + (30 - 电商价值排名)*2 + 竞争度排名
  - 在我计算某个行业综合得分的时候，对于那些商品数低于1000或者带货笔记占比小于1%的行业类目，我直接将其综合得分为 0 了
- name: RPA自动化数据采集流程
  desc: 针对蝉小红不支持数据导出的痛点，作者自主开发的RPA应用，实现行业大盘/品类库数据的批量抓取、指标自动计算、Excel结构化导出与排序。
  is_original: true
  excerpt:
  - 蝉小红并不支持导出相关的数据，所以，我利用 RPA 搭建了一个自动化流程，来批量的抓取出这些数据，并自动计算出笔记互动数和笔记数之间的比例，之后再利用 RPA
    把这些数据导入到 Excel 表格中
  - 以下是我开发好的 RPA 应用，这里我只需要选择一下我们要分析的行业流量类型，Excel保存的文件夹路径以及数据统计方式就可以了
- name: 品类需求度指标
  desc: 品类层面的需求度量化指标，定义为蝉小红‘品类库’中展示的‘互动量/相关笔记数量’，用于横向筛选供需不平衡的细分品类。
  is_original: false
  excerpt:
  - 这里我们重点关注：互动量/相关笔记数量
  - 这个比值越高，就侧面反应出用户对这个品类的需求度越高。
methods:
- name: __overview__
  desc: 全流程数据化选品方法论：1. 数据源锚定（蝉小红行业流量大盘/品类库）；2. RPA自动化采集与清洗；3. 行业层面三维建模（需求/价值/竞争）与加权评分筛选大类；4.
    品类层面单维需求度筛选结合搜索人工复核；5. 结合主观资源与边界条件做最终决策。
  excerpt:
  - 首先，我们可以先从大的行业类目着手去分析，基于数据分析的结果选定完行业类目之后，再用类似的思路去分析出对我们来说相对比较有价值的品类。
  - 数据分析只能辅助我们进行决策，我们在选品的时候还要结合我们自身已有资源、个人优势以及主观意愿来综合考虑。
- name: 行业类目筛选法
  desc: 分步骤：①抓取29个行业的互动数、笔记数、带货笔记占比、商品数、行业笔记占比；②计算三大指标并分别排名；③套用加权评分公式计算综合得分；④应用否决门槛（商品数<1000或带货占比<1%得0分）；⑤按得分倒序选定目标行业。
  excerpt:
  - 通过这种方式，我们就可以分析出用户对于每一个行业的内容需求度...利用 RPA 把这些数据导入到 Excel 表格中，并根据【笔记互动数/笔记数】这个比值对这些数据进行排序
  - 同样地，我们还是借助 RPA 来抓取并分析相关数据，之后再基于带货笔记的占比进行排序
  - 同样地，我们这里还是利用 RPA 自动计算出每个行业的笔记占比，并将结果导入到数据 Excel 表格中，之后，在根据行业比笔记占比对所有数据进行排序
  - 最终，应用运行结束之后，我们会得到如下结果
- name: 细分品类筛选法
  desc: 步骤：①进入蝉小红‘品类-品类库’选定目标行业；②RPA批量抓取全品类互动量与笔记数；③计算‘互动量/笔记数’比值并排序；④筛选高比值且绝对互动量可观的品类；⑤结合小红书站内搜索人工核验笔记质量与销量后定夺。
  excerpt:
  - 我们可以先把所有的数据导出来，然后计算一下不同品类的互动量/相关笔记数量，这样就能够对所有所有品类的需求度做一个横向对比，进而筛选出一些供需不平衡的品类。
  - 之后可以再结合小红书的搜索，大概看一下这个品类在小红书中笔记的质量和商品的销量，最终决定是否选择这个品类。
theorems:
- name: 产品即需求方案论
  desc: 选品本质是寻找需求的解决方案，商业活动核心链路为产品-流量-转化-交付，产品是后三环节基础，故选品定生死。
  excerpt:
  - 任何商业活动本质上都离不开产品-流量-转化-交付这四个环节，其中产品是后面三个环节的基础。而产品的背后则是需求，我们可以说，所有的产品本质上都是某类需求的解决方案。
- name: 数据辅助决策优于主观臆断
  desc: 选品不可依赖感觉，需借助三方数据平台与自动化工具获取客观数据进行分析，数据不会骗人。
  excerpt:
  - 稍微有点经验的同学可能都会想到借助一些类似蝉小红、新红这样的小红书三方数据平台来辅助自己选品，而不是全凭自己的感觉，毕竟感觉可能会有偏差，但是数据不会骗人。
- name: 高需求不等于高电商价值
  desc: 内容需求度高（如搞笑类目）不代表适合电商带货，必须引入电商价值指标（带货占比、商品数）过滤纯内容消费类目。
  excerpt:
  - 排名第一的是搞笑类目...我们也能直观的感受到，在这个类目下，我们可能很难进行电商带货，也就是说，虽然这个类目的内容需求量很大，但如果我们很难进行电商带货的话，那对于我们来说，价值也不是特别大。
- name: 电商价值与竞争正相关权衡原则
  desc: 带货笔记占比与商品数高说明商业化成熟但竞争激烈，需引入竞争度指标（行业笔记占比）寻找高价值低竞争的蓝海机会。
  excerpt:
  - 虽然带货笔记占比和商品数高虽然可以说明这个行业中可以商业化的产品比较多，但同时也说明这个行业竞争比较激烈，因此，我们需要关注第三个指标：竞争度
- name: 方法论适用边界界定
  desc: 该方法仅适用于小红书店铺直接转化的低客单价标品；高客单价/服务类需引流私域二次转化，不适用此数据体系；红海大类可通过搜索长尾词切入细分需求。
  excerpt:
  - 通过这种方式获取到的数据可能更适合一些直接在小红书店铺中直接转化的产品，这种产品客单价一般不会太高...如果我们想做一些高客单价的产品或服务...我们再通过上面这些数据来辅助我们选品可能就不太合适了。
  - 并不是说竞争度太过激烈的行业就没有办法做了，针对这些竞争比较激烈的行业，我们可以利用搜索长尾词去选出一些更加细分的产品
findings:
- name: 搞笑类目需求度最高但电商价值低
  desc: '[evidence] RPA抓取行业流量大盘数据计算后，搞笑类目‘笔记互动数/笔记数’排名第一，但作者实地判断其难以带货，验证了需求度指标单用的局限性。'
  excerpt:
  - 排名第一的是搞笑类目，即便不通过数据分析，我们也能直观的感受到，在这个类目下，我们可能很难进行电商带货
- name: 行业综合评分Top榜单产出
