paper: docs/202306/20230613_096.md
desc: 该素材通过作者小马宋亲身经历的国航与南航升舱服务对比，揭示了两家航空公司在经营效率与服务细节上的巨大差距。南航通过全流程（APP、值机口、机上）的升舱触点、灵活的授权机制（如员工微信收款、主动电话推销）及激励制度，构建了“员工主动服务-提升升舱转化-增加收入-反哺激励”的正向飞轮；而国航系统功能失效、流程僵化、服务缺失。作者依据“高效经营三角模型”（战略方向、创新能力、经营效率）指出，战略正确的前提下，经营效率与创新能力是超额利润的关键来源。
concepts:
- name: 高效经营三角模型
  desc: 作者提出的企业经营分析框架，由战略方向、创新能力、经营效率三个顶点构成。战略方向决定生死，创新与经营效率决定超额利润。
  is_original: true
  excerpt:
  - 我画过公司高效经营的三角△，分别是战略方向，创新能力，经营效率。战略方向对了，创新和效率，则是超额利润的保证。
- name: 升舱经营飞轮
  desc: 南航通过激励制度驱动员工主动挖掘升舱机会，形成‘激励->主动服务->转化收入->再激励’的正向循环机制，实现存量客户价值最大化。
  is_original: true
  excerpt:
  - 公司给激励员工升舱->员工给客户更好的服务提高升舱数量->升舱数量变多增加公司收入->公司有更多的激励给员工。
  - 能帮公司多赚一点就多赚一点，其他航空公司就很少见这样的员工，或许仅仅是激励制度的问题
- name: 全触点升舱服务体系
  desc: 南航构建的覆盖赛前（APP）、赛中（值机柜台）、赛后（机上/安检后）全生命周期的升舱销售触点网络，对比国航的单一失效触点。
  is_original: false
  excerpt:
  - 南航 APP，有登机口优惠升舱功能...南航在值机口，有人专门宣传优惠登机升舱...以前在南航，机上可以直接升舱...安检后，服务员又给我打电话，说商务舱出来一个座位。
- name: 一线服务授权制
  desc: 赋予一线员工（值机、空乘）在价格、支付方式（微信转账）、流程（跨舱位调整）上的灵活决策权，以提升服务响应速度和成交率。
  is_original: false
  excerpt:
  - 她可以帮我直接值机，然后加我微信付款就行。
  - 和海底捞员工有自主打折优惠的授权类似。
methods:
- name: __overview__
  desc: 基于个人用户体验的对比案例法，结合‘高效经营三角’理论模型进行结构性复盘，从战术细节（流程、授权、激励）推演战略层面的经营效率差异。
  excerpt:
  - 从升舱体验对比，来说一下国航和南航经营的差距。
  - 我画过公司高效经营的三角△...战略方向对了，创新和效率，则是超额利润的保证。
- name: 服务蓝图对比法
  desc: 将南航与国航的升舱服务流程拆解为APP端、值机端、机上端三个关键触点，逐项对比功能可用性、人员推销行为、价格透明度、支付灵活性等关键指标。
  excerpt:
  - 南航 APP，有登机口优惠升舱功能，国航，这个功能出现很久，但一直不能用。
  - 南航在值机口，有人专门宣传...国航，没有任何宣传。
  - 南航升舱，会优先给客人看有没有 999 优惠升舱...国航去升舱，服务员说要计算一下...需要手续费 2100 元。
  - 以前在南航，机上可以直接升舱。国航，对不起，机上不能升。
theorems:
- name: 经营效率源于一线微观授权与激励对齐
  desc: 宏观层面的‘经营效率’在微观上体现为：是否赋予一线员工服务授权（如灵活定价、便捷收款）、激励机制是否与营收目标对齐（员工主动创收）、流程是否打通全触点（赛前/中/后）。南航通过制度设计实现了三者统一，国航则三者缺失。
  excerpt:
  - 能帮公司多赚一点就多赚一点，其他航空公司就很少见这样的员工，或许仅仅是激励制度的问题
  - 南航的经营，至少在旅客层面的感受，比其他航空公司要好很多。
  - 战略方向对了，创新和效率，则是超额利润的保证。
- name: 存量资产变现能力是经营效率的核心试金石
  desc: 公务舱/明珠舱空座属于易逝性存量资产。优秀经营体现在通过动态定价（999元）、灵活推销（安检后电话）、跨渠道协同（微信支付）将‘注定为零’的资产变现，而非僵化执行高价（2100元）导致资产报废。
  excerpt:
  - 服务员让我先升了明珠舱，说商务舱没有了。安检后，服务员又给我打电话，说商务舱出来一个座位。
  - 跟我说需要手续费 2100 元，我说我在携程现在直接买公务舱也才 2100 啊
findings:
- name: 南航升舱服务全流程打通且具备极强主动性
  desc: '[evidence] 素材记录了南航在APP端（自助优惠）、值机端（专人推销、优先推荐低价、告知限制）、安检后/机上（电话追踪空座、微信收款、协助值机）三个阶段均有有效触点且员工主动作为，形成闭环。'
  excerpt:
  - 南航 APP，有登机口优惠升舱功能
  - 南航在值机口，有人专门宣传优惠登机升舱
  - 南航升舱，会优先给客人看有没有 999 优惠升舱，也会提醒客人优惠升舱的限制服务内容
  - 安检后，服务员又给我打电话，说商务舱出来一个座位。她可以帮我直接值机，然后加我微信付款就行
- name: 国航升舱系统功能失效、流程断点多、定价脱离市场
  desc: '[evidence] 素材记录国航APP功能长期不可用、值机口无人推销、机上拒绝升舱、柜台报价2100元远高于OTA平台同价公务舱（2100元），且服务员态度消极（‘您随意’），系统性经营失效。'
  excerpt:
  - 国航，这个功能出现很久，但一直不能用
  - 国航，没有任何宣传
  - 跟我说需要手续费 2100 元，我说我在携程现在直接买公务舱也才 2100 啊，国航说，那您随意
  - 国航，对不起，机上不能升
- name: 南航员工微信收款、跨舱位协调展示极高的一线授权度
  desc: '[evidence] 案例显示南航值机员工可在安检后通过电话联系旅客、微信收款、系统改签升舱，甚至建议先升低价舱位再候补高价舱位，流程极其灵活，打破常规‘柜台现付/刷卡’限制。'
  excerpt:
  - 服务员让我先升了明珠舱，说商务舱没有了。安检后，服务员又给我打电话...加我微信付款就行。然后我就升了商务舱。
- name: 激励机制驱动的‘正向飞轮’被评论区验证为核心原因
  desc: '[claim] 评论区用户（孙金鑫、知行派）基于素材现象，推导出‘公司激励->员工主动服务->升舱增收->再激励’的飞轮模型，并类比海底捞授权机制，印证作者‘激励制度’论断。'
  excerpt:
  - 公司给激励员工升舱->员工给客户更好的服务提高升舱数量->升舱数量变多增加公司收入->公司有更多的激励给员工。
  - 和海底捞员工有自主打折优惠的授权类似。服务好了，产生更多的成交，奖励就越高...形成一个正向反馈的飞轮。
