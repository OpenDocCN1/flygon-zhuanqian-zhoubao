paper: docs/202306/20230613_095.md
desc: 该素材《航行指南：创业者的 50 个关键问题》构建了一个系统化的创业决策思考框架，将创业者比作掌舵船长，通过 50 个跨越战略设定、资源整合、市场洞察、人脉构建、商业模式、团队管理、风险控制、个人成长及财富传承等九大维度的关键问题，引导创业者在不确定性中建立结构化思维，核心主张是创业本质是通过持续提问解决问题、整合资源并实现自我价值与社会价值的统一。
concepts:
- name: 创业者船长隐喻
  desc: 将创业者定位为在不确定海洋中掌舵、设定目标、解决问题的‘船长’，强调主观能动性与全局统筹责任。
  is_original: true
  excerpt:
  - 在创业的海洋中，我们扮演着船长的角色。我们掌舵，设定目标，解决问题。
  - 我们需要学会的是如何在复杂环境中理清思路，如何利用资源，如何成为自己的“船长”。
- name: 创业关键问题清单
  desc: 由 50 个具体问题组成的结构化思考工具，覆盖目标、资源、市场、人脉、模式、团队、风险、个人成长等创业全生命周期，用于引导创业者系统性审视现状与决策。
  is_original: true
  excerpt:
  - 这就是我们的航行指南——一个帮助我们向前的清晰路线图。在这里，我们将探讨关于资源、市场、人脉、合作、需求满足、团队激励等众多关键要素，一一解析，一一掌握。
  - 1. 【设置目标：今年，我们要挣多少个 W？】 ... 50. 【服务提升：怎样把事情做好，怎样服务好客户？】
- name: 创业即成长论
  desc: 主张创业过程不仅是建立公司，更是企业家个人生命成长、自我价值实现深度探索的旅程，失败与挑战是成熟的必经之路。
  is_original: true
  excerpt:
  - 这个过程不仅仅是创立一家公司，更重要的是，它是我们生命中的一次个人成长的旅程，是对自我价值实现的深度探索。
  - 每一次的失败都会让我们更近一步到达成功，每一个挑战都会让我们变得更成熟、更强大。
- name: 创业精神三元论
  desc: 将创业定义为目标、精神/态度、生活方式的统一，强调坚持梦想与信念是成为成功创新者的核心内驱力。
  is_original: true
  excerpt:
  - 创业不仅仅是一个目标，更是一种精神，一种态度，一种生活方式。
  - 无论何时，无论何地，无论遇到多大的困难和挑战，我们都需要有勇气和决心，坚持我们的梦想，坚持我们的信念。
methods:
- name: __overview__
  desc: 采用‘关键问题驱动’的结构化思考法，通过罗列 50 个高频、高影响力的决策问题，替代传统的标准答案灌输，迫使创业者主动构建认知框架，实现从‘寻找答案’到‘提炼问题’的认知跃迁。
  excerpt:
  - 我们试图解决的问题，从微小的细节到宏大的战略，无所不包，无所不能。这就是我们的航行指南——一个帮助我们向前的清晰路线图。
  - 现在，让我们一起迎接这 50 个关键问题，不畏困难，不惧失败。
- name: SWOT 分析法应用
  desc: 在第 42 个问题中明确引入 SWOT 分析法作为业务分析的标准工具，用于系统评估业务的优势、劣势、机会与威胁。
  excerpt:
  - 42. 【业务分析：用 SWOT 分析法分析业务。】
- name: 对比学习法
  desc: 在第 29 个问题中提出通过分析同行与自身的优劣势差距，向优秀同行学习，实现认知升级与策略优化。
  excerpt:
  - 29. 【对比学习：分析同行与自身的优势和劣势，向优秀同行学习。】
- name: 投入产出比决策模型
  desc: 在第 19 个问题中确立 ROI 为核心决策标准，要求创业者在资源投入前量化评估业务值得投程度。
  excerpt:
  - 19. 【投入产出比：这项业务的投入和产出比是怎样的，值不值得投？】
theorems:
- name: 问题即路线图定律
  desc: 核心主张：清晰的关键问题清单本身就是创业最有效的路线图，通过持续提问‘我们要挣多少钱’、‘资源在哪里’、‘市场在告诉我们什么’等，能在不确定性中理清思路、锁定资源、适应变化。
  excerpt:
  - 这就是我们的航行指南——一个帮助我们向前的清晰路线图。
  - 只要我们持续关注、理解和适应变化，就能找到成功的道路。在这个过程中，我们需要学会的是如何在复杂环境中理清思路...
- name: 资源整合与杠杆原则
  desc: 核心主张：创业成功的关键不在于自有资源量，而在于‘寻找资源’（Q2）、‘整合资源’（Q5）、‘借助别人资源’（Q18）、‘优势互补’（Q9）、‘利用关系网’（Q31）等外部资源杠杆的运用能力。
  excerpt:
  - 2. 【寻找资源：资源在哪里，我们怎么去找？】
  - 5. 【整合策略：怎样才能更好地整合资源和人脉？】
  - 18. 【利用资源：怎样借助别人的资源为自己所用？】
  - 9. 【优势互补：怎样才能优势互补，实现强强联合？】
  - 31. 【关系利用：怎样利用老乡、同学、朋友等关系网做好业务？】
- name: 利益分配与长期主义博弈论
  desc: 核心主张：可持续的商业生存依赖于‘利益分享’（Q38）、‘兼顾眼前与长远利益’（Q45）、‘放长线钓大鱼’（Q46）、‘在规则内做大做强’（Q40）的动态平衡，拒绝短视零和博弈。
  excerpt:
  - 38. 【利益分享：该怎样与利益链的人分享利益？】
  - 45. 【利益兼顾：怎样兼顾眼前和长远利益？】
  - 46. 【长线钓鱼：怎样放长线钓大鱼？】
  - 40. 【规则游戏：怎样在规则内做大做强？】
- name: 无资金创业与风险分散悖论
  desc: 核心主张：创业可通过‘无需自己资金创业’（Q26）、‘寻找投资’（Q25）、‘多元化分散风险’（Q15）、‘并购同行’（Q47）等手段，在低自有资本投入下实现规模扩张与风险对冲。
  excerpt:
  - 26. 【创业方式：怎样无需自己的资金就可以创业？】
  - 25. 【投资策略：想投资，但资金不够，怎样寻找投资？】
  - 15. 【多元化策略：怎样做多元化，分散经营，降低风险？】
  - 47. 【并购策略：怎样兼并和收购同行？】
findings:
- name: 创业决策全景覆盖度发现
  desc: '[evidence] 素材通过 50 个问题实现了对创业决策全维度的覆盖：战略目标（Q1, Q13, Q30）、资源获取（Q2, Q5, Q18,
    Q25, Q26）、市场与趋势（Q3, Q22, Q28, Q43）、人脉与圈层（Q4, Q10, Q20, Q31, Q32, Q35）、组织与团队（Q11,
    Q16, Q17, Q44）、财务与利润（Q7, Q14, Q19）、风险与规则（Q15, Q40, Q47）、个人认知升级（Q27, Q29, Q36,
    Q37）、财富与传承（Q33, Q34, Q48, Q49）、客户服务（Q39, Q50）、微观战术（Q34, Q35）。'
  excerpt:
  - 1-50 号问题全文列表
- name: 实用主义导向与中国本土语境强相关发现
  desc: '[evidence] 问题清单强实操、重人情、重圈子、重杠杆，体现浓厚中国本土商业语境特征：如‘商务应酬’（Q10）、‘面子投资’（Q33）、‘送礼艺术’（Q39）、‘关系利用’（Q31）、‘酒局决策’（Q35）、‘读
    MBA 提升’（Q36）、‘子女教育/接班’（Q48, Q49），区别于硅谷标准创业教科书的产品/技术/融资导向。'
  excerpt:
  - 10. 【商务应酬：怎样搞好应酬，拿下关键客户？】
  - 31. 【关系利用：怎样利用老乡、同学、朋友等关系网做好业务？】
  - 33. 【面子投资：该买什么来为自己增添面子？】
  - 35. 【酒局决策：一个酒局，是否值得参加？】
  - 36. 【教育提升：要不要读个 MBA 来提升自己？】
  - 39. 【送礼艺术：怎样给客户送礼？】
  - 48. 【教育投资：怎样让子女接受更好的教育？】
  - 49. 【接班人培养：怎样培养子女做自己的接班人？】
- name: 认知迁移与元认知训练价值发现
  desc: '[claim] 素材宣称该指南能帮助创业者‘理清思路’、‘找到成功道路’、‘实现自我价值’、‘改变世界’。[evidence] 素材结构上通过‘设置目标’->‘寻找资源/市场’->‘整合/合作’->‘复制/规模’->‘风险/传承’的逻辑链条，隐含了一个从战术执行到战略布局再到生命意义的认知迁移路径，适合作为创业者元认知训练的教学大纲雏形。'
  excerpt:
  - 我们需要学会的是如何在复杂环境中理清思路，如何利用资源，如何成为自己的“船长”。希望这份航行指南能在你的创业旅程中，为你带来所需的指导和灵感。
  - 创业不仅仅是一个目标，更是一种精神，一种态度，一种生活方式。我们通过创业实现自我价值，创造社会价值，为世界带来变革。
