paper: docs/202306/20230627_100.md
desc: 该素材是一篇实操型经验分享文章，作者"叉叉敌"详细拆解了如何利用ChatGPT通过"投喂提示词+优秀案例训练"的方法，快速生成符合微信"问一问"平台调性的高质量回答，并以此为杠杆撬动视频号流量增长（点赞100+，涨粉20+），文中公开了核心提示词、训练流程及实战数据。
concepts:
- name: 微信问一问
  desc: 微信生态内的问答社区产品，融合知乎深度与小红书碎片化调性，优质回答可获首页推荐、搜一搜曝光及视频号流量分发。
  is_original: false
  excerpt:
  - 有人认为是类似知乎体，我认为这个里面的回答更偏于知乎+小红书的分割，需要用户用很短的时间看完一篇文章。
  - 优质的答案，除了在问一问首页被推荐，还会在用户搜索相关问题时进行展现...如果你使用视频号视频来回答问题，还会为视频带来新增的曝光
- name: 提示词投喂训练法
  desc: 通过分步骤向ChatGPT输入平台规则定义、优秀案例样本、任务指令，使其掌握特定平台内容调性并稳定输出合格回答的方法论。
  is_original: true
  excerpt:
  - 明白 ChatGPT 不是什么都懂的，需要你投喂资料才行，并且告诉他什么样的回答会被通过和获得高质量的点赞和转发。
  - 投喂提示词，告诉他，明确的是什么和目的是什么
  - 提供好的素材和案例...直接上优秀的总结文档
- name: 视频号冷启动杠杆
  desc: 利用问一问回答（尤其是视频形式回答）的公域分发机制，为处于冷启动期的视频号导入精准流量、获取正反馈（点赞/关注）的策略。
  is_original: true
  excerpt:
  - 视频号的快速流量来源之一。如果是你在做视频号，想积累正反馈，这里是不错的选择。
  - 重点：如果你使用视频号视频来回答问题，还会为视频带来新增的曝光，也是吸引粉丝的新渠道。
methods:
- name: __overview__
  desc: 三步走标准化SOP：1. 定义平台画像与审核标准（投喂身份提示词）；2. 少样本微调（投喂优秀案例文档）；3. 批量生产与实战验证（套用生产提示词输出回答并发布）。
  excerpt:
  - '## 1. 告诉他什么是微信问一问'
  - '## 2. 提供好的素材和案例'
  - '## 3. 出成品的环节'
  - 我回答了 10 个问题 （每个问题 2~4 分钟）
- name: 平台认知对齐提示词
  desc: 指令ChatGPT扮演资深运营专家，输出微信问一问的产品定位、用户画像、内容调性（知乎+小红书）、审核红线及高质量回答结构标准。
  excerpt:
  - 投喂提示词，告诉他，明确的是什么和目的是什么
  - 来看看返回的结果：...（图中展示了ChatGPT输出的平台分析框架）
- name: 优秀案例少样本学习提示词
  desc: 将平台优质回答的结构化总结文档喂给ChatGPT，要求其学习并总结出高赞回答的通用模版（如：金句开头、分点陈述、避坑指南、互动引导结尾）。
  excerpt:
  - 现在他知道是什么了，需求是什么了，那么还有好的，优秀的作业给他抄一抄喃？
  - 有的，直接上优秀的总结文档，下面是提示词，直接复制即可。
  - 来看看学习的结果：...（图中展示ChatGPT总结出的高质量回答套路）
- name: 实战生产提示词
  desc: 在完成前两步训练的上下文中，输入具体问题关键词，要求ChatGPT按内化好的模版直接输出可发布的成品回答。
  excerpt:
  - 上面投喂和训练完成之后，就可以开始创作了。
  - 生财有非常这样多的话题和教程，我直接上提示词的案例：
  - 训练后的效果：...（图中展示针对具体问题生成的完整回答）
theorems:
- name: 原生内容搬运必死定律
  desc: 直接复制ChatGPT通用模型输出的内容发布到微信问一问，极大概率因违规、不符合平台调性、缺乏个人经验感而审核不通过。
  excerpt:
  - 我看到好多人都在反馈，问一问提问之后，都提示审核不通过。
  - 从 ChatGPT 复制过来的文字，审核都通不过，提示不行。
  - 投喂前：没有投喂，出来的结果差十万八千里。
- name: 垂直内容复利公式
  desc: 高质量回答（文/视频） -> 问一问首页推荐 + 搜一搜长尾曝光 -> 视频号主页回流 -> 粉丝沉淀 -> 公众号/产品变现闭环。内容垂直度是提高转化率的关键变量。
  excerpt:
  - 优质的答案，除了在问一问首页被推荐，还会在用户搜索相关问题时进行展现...
  - 重点：如果你使用视频号视频来回答问题，还会为视频带来新增的曝光，也是吸引粉丝的新渠道。
  - 你有产品，视频号的下方挂载公众号的链接，等等都是变现的方式，我目前还没有走通闭环，先把流量搞起来，内容尽量垂直。
- name: 低成本高频执行原则
  desc: 单条回答耗时2-4分钟，日更3条即可建立正反馈循环，门槛极低，适合个人IP冷启动期执行。
  excerpt:
  - 我回答了 10 个问题 （每个问题 2~4 分钟），可以给视频号带来点赞超过 100 个，粉丝接近 20 来个。
  - 来吧，知行合一：定一个 Flag，每天回答 3 个问题哦。
findings:
- name: 实战数据验证
  desc: '[evidence] 作者实测10个问题，耗时约20-40分钟，带来视频号点赞100+，涨粉近20人，验证了该方法在流量获取上的有效性。'
  excerpt:
  - 我回答了 10 个问题 （每个问题 2~4 分钟），可以给视频号带来点赞超过 100 个，粉丝接近 20 来个。
  - 下面是自己的号，内容不是很垂直，效果都不错。
- name: 审核失败常见原因
  desc: '[claim] 评论区用户反馈及作者回复表明，审核失败主要源于：1. 含违规/敏感词汇（建议换题不改文）；2. 直接复制AI生成文本未去AI味/未植入个人经验；3.
    账号权重或IP问题。'
  excerpt:
  - 'Fwrd : 老哥这回答问题老是审核失败，一直提示：内容可能包含违规或敏感内容...'
  - 用词违规了，直接删除不要再编辑了
  - '叉叉敌 : 是不是含有不该有的信息呀[发呆]，不行就换一个问题'
- name: 视频形式回答权重更高
  desc: '[claim] 官方机制暗示及作者强调：使用视频号视频回答问题，除获得文本回答权益外，额外获得视频曝光分发，是双重流量红利入口。'
  excerpt:
  - 重点：如果你使用视频号视频来回答问题，还会为视频带来新增的曝光，也是吸引粉丝的新渠道。
