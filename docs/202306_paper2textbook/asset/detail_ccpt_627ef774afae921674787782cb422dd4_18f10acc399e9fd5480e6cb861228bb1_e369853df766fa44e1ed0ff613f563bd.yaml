units:
- 'no': 1
  name: 自然流量曝光 —— 选址是实体商业的“免费高速公路”
  points:
  - '**为什么需要这个概念？**'
  - '- 99%实体老板沉迷线上营销，却忽视了物理位置自带的免费客群'
  - '- 没有基础客流，所有线上推广都像是在沙漠里泼水'
  - '- 优质位置能决定门店是否“旺”，甚至让老板无需主动做营销'
  - '**核心定义**'
  - '- 实体门店因地理位置优越（如临街门面、商场通道）而自带的无需付费即可获得的目标客群曝光'
  - '- 这是线下商业的核心护城河，优先于任何自媒体手段'
  - '**关键性质**'
  - '- 位置好才是王道：写字楼11层与商场2层通道的自然流量存在质变差异'
  - '- 优质选址的边际收益远超同等投入的线上营销'
  - '- 营销只能优化转化，无法创造不存在的自然流量'
  - '**典型例子**'
  - '- 舞蹈工作室从写字楼11层搬至商场2层通道，租金虽大幅上涨，但自然曝光质变，直接支撑了预售转化与长期经营'
  - '**边界条件**'
  - '- 若门店本身无产品/服务优势，优质选址也只能延缓失败，不能替代运营能力'
  - '- 某些隐私敏感业态（如成人用品店）需在“高流量”与“高隐私”之间平衡，不能盲目追求主干道显眼位置'
  sources:
  - paper: docs/202306/20230613_252.md
    role: origin
  - paper: docs/202306/20230613_294.md
    role: improve
  - paper: docs/202306/20230613_295.md
    role: improve
  excerpts:
  - “自然流量的曝光才是实体门店的利器。”
  - “真正的旺铺从来没有藏在写字楼里的，真正的旺铺旺到老板没有时间或者说必要去做自媒体营销。”
  - “位置好才是王道。”
  - “做自媒体营销，本质上还是用自媒体放大自己本身的优势，如果没有优势，尽量到生活中去创造一些事件。”
  - 成人用品店选址原则：“尽量不要开在主干道，或者是特别显眼的地方……被别人看见还是会觉得不好意思的。”
- 'no': 2
  name: 自媒体放大器 —— 先“造事”，再记录，最后变现
  points:
  - '**为什么需要这个概念？**'
  - '- 很多实体店老板凭空追求流量技巧，却没有可传播的内容基础'
  - '- 自媒体不是流量制造机，如果没有线下优势，发再多内容也难以转化'
  - '- 需要一种不依赖天赋的内容生产方法，适合普通实体从业者'
  - '**核心定义**'
  - '- 自媒体营销的本质是放大主体已有的线下优势（产品、位置、服务、事件）'
  - '- 无优势者应先“造事”（创造真实商业/生活事件），再记录过程，最后沉淀为可售卖的知识产品'
  - '**关键性质**'
  - '- 有优势者：放大优势（产品/位置/服务）；无优势者：到生活中去创造事件'
  - '- “生活即内容，认真生活，生活就会给你不停的反馈”'
  - '- 记录反馈并将其沉淀为可以出售的产品（教程、社群、加盟包）'
  - '**典型例子**'
  - '- 舞蹈工作室记录装修、开店、学员成品舞过程，最后沉淀成营销教程并对外售卖'
  - '**边界条件**'
  - '- “造事”必须基于真实的商业或生活行为，不能凭空编造'
  - '- 自媒体只是放大器，若线下核心优势缺失，放大后只会加速暴露问题'
  sources:
  - paper: docs/202306/20230613_252.md
    role: origin
  - paper: docs/202306/20230613_295.md
    role: improve
  excerpts:
  - “做自媒体营销，本质上还是用自媒体放大自己本身的优势，如果没有优势，尽量到生活中去创造一些事件，然后把自己做这件事的过程分享出来。”
  - “得真的有事件才能记录，自媒体就是对生活的记录，认真生活，生活就会给你不停的反馈，你要做的记录反馈且把他们沉淀成为可以出售的产品。”
  - “比如我最早就是写自己舞蹈室营销的相关内容，最后沉淀成为一个个教程，然后去卖教程。”
- 'no': 3
  name: 预售覆盖成本 —— 用存量私域实现“零成本开店”
  points:
  - '**为什么需要这个概念？**'
  - '- 新店开业前通常面临巨大的装修、房租、运营资金压力'
  - '- 若开业后才回笼现金流，容易因现金链断裂而夭折'
  - '- 普通创业者缺乏雄厚资本，需要一种零成本甚至盈利开店的方法'
  - '**核心定义**'
  - '- 新店开业前通过限量预售年卡/课时卡，让预售收入覆盖全部装修、房租、运营成本'
  - '- 实现“零成本开店”甚至盈利开店，为后续多店复制与打包加盟奠定资金基础'
  - '**关键性质**'
  - '- 利用存量私域（已有会员、试课未成交用户）完成首轮激活与变现'
  - '- 通过限量席位制造稀缺感，加速用户决策并锁定开业现金流'
  - '- 预售目标：覆盖所有成本，极端情况下覆盖运营成本即可立即筹划新店'
  - '**典型例子**'
  - '- 舞蹈工作室投资约60万，开业前限量50个名额预售，已售20张年卡（7180元）+ 30余张50课时卡，回笼现金流约25万'
  - '**边界条件**'
  - '- 需依赖已经积累的存量私域用户基数，纯新号冷启动难以直接复制'
  - '- 预售产品的客单价与价值感必须匹配目标客群支付能力'
  sources:
  - paper: docs/202306/20230613_252.md
    role: origin
  excerpts:
  - “新店开业，最好在预售的时候就把所有成本全部 cover 掉，极端一点，只要能覆盖了运营成本，我接着可以立刻再去开新店。”
  - “截止到现在搞定了 20 个预售年卡，和 30 多个 50 课时卡，大概收了 25 万左右了。”
  - “本次年卡目标是 50 个，我的想法是，新店开业，最好在预售的时候就把所有成本全部 cover 掉。”
- 'no': 4
  name: 选址风向标工具包 —— 百度热力图+实地骑行的组合拳
  points:
  - '**为什么需要这个概念？**'
  - '- 选址直接决定实体门店的生死与盈利上限，不能凭主观臆断'
  - '- 单纯线上看热力图可能与线下真实商业形态不匹配'
  - '- 普通创业者需要一套低成本、可标准化的选址验证方法'
  - '**核心定义**'
  - '- 一套组合选址工具链：百度热力图筛选高热力区域 + 地图同业分布拦截动线 + 贝壳找房/链家判断消费实力 + 实地骑行巡查验证'
  - '- 将“线上热力”与“线下形态”进行交叉验证，降低选址风险'
  - '**关键性质**'
  - '- 百度热力图用于初筛高热力区域'
  - '- 实地骑行用于验证线上热力与线下商业形态的匹配度'
  - '- 竞品侦察（拍照对比货架销售变化、垃圾箱包装分析）用于反推客群偏好'
  - '**典型例子**'
  - '- 某成人用品加盟品牌找店流程：先用百度热力图选区，再骑共享单车在周围找铺面'
  - '**边界条件**'
  - '- 工具包仅辅助决策，不能替代对特定业态（如成人用品店隐私需求）的深度理解'
  - '- 不同城市、不同业态的权重需动态调整'
  sources:
  - paper: docs/202306/20230613_294.md
    role: origin
  - paper: docs/202306/20230613_295.md
    role: improve
  excerpts:
  - “门店选址-百度地图热力图，判断热门区域。”
  - “竞争分析-地图模式同业商家分布，设置拦截动线。”
  - “消费分析-贝壳找房，周边楼盘价格，判断消费实力。”
  - “链家顾问，周边楼盘资源入驻情况比你熟，3 天看完潜力门店。”
- 'no': 5
  name: 体验差异化 —— 产品同质化下，环境与隐私即护城河
  points:
  - '**为什么需要这个概念？**'
  - '- 成人用品等终端产品功能、价格高度同质化，陷入恶性价格战'
  - '- 纯靠低价无法留存客户，也难以建立品牌记忆点'
  - '- 需要一种不依赖价格的差异化竞争手段'
  - '**核心定义**'
  - '- 在产品同质化前提下，拒绝价格战，通过门头设计、店内海报贴画、感官体验提升构建“有新意”的店铺形象'
  - '- 让进店消费者觉得“这是一家不同于以往毛坯店的有新意门店”，体验即护城河'
  - '**关键性质**'
  - '- 隐私首选址：避开主干道显眼位置，平衡高流量与高隐私'
  - '- 环境升级：ins风/网红社交风装修，将教室/门店打造为目标人群的“社交中心”'
  - '- 情绪价值：成人兴趣教育核心非技能达成，而是情绪疗愈、社交连接、自我呈现'
  - '**典型例子**'
  - '- 成人用品店通过门头设计、店内海报、感官体验提升，区别于传统“毛坯无人售货店”'
  - '- 舞蹈工作室升级ins风格，成为宝妈和年轻女孩的社交场域'
  - '**边界条件**'
  - '- 差异化必须建立在产品基本合规、质量及格的前提之上'
  - '- 体验升级不可导致成本失控，需控制在租金占比合理范围内'
  sources:
  - paper: docs/202306/20230613_295.md
    role: origin
  - paper: docs/202306/20230613_252.md
    role: improve
  excerpts:
  - “不要一味和同行打价格战，要在消费体验上认真思考做提升和差异化，因为成人用品从产品上，没有太大区别，功能作用几近相同。”
  - “核心就是让进店消费者觉得，这是一家有新意的门店，不同于以往的那种进都不想进去的‘毛坯无人售货店’。”
  - “说白了成人舞蹈培训，没有几个真的过来说要练习基本功的，都是一个情绪价值，交交新朋友，和大家一起跳跳舞快乐一下而已。”
- 'no': 6
  name: 数据驱动运营诊断 —— 建立“进店-购买”转化漏斗
  points:
  - '**为什么需要这个概念？**'
  - '- 很多实体店老板凭感觉判断经营不善，不知道是选址、选品还是定价出了问题'
  - '- 缺乏量化指标，导致优化方向错误，浪费时间与资金'
  - '- 需要一种简单可执行的运营诊断方法'
  - '**核心定义**'
  - '- 建立“进店人数/购买人数”转化漏斗模型，通过转化率拆解精准归因经营不善的根因'
  - '- 进店少=选址问题；进店多买少=选品/定价问题；机器故障=履约问题'
  - '**关键性质**'
  - '- 用数据替代主观判断，指导迭代决策'
  - '- 转化率是连接选址、选品、运营的核心指标'
  - '- 定期统计进店人数与购买人数，形成闭环复盘'
  - '**典型例子**'
  - '- 成人用品无人店通过统计进店与购买数据，判断是位置问题还是货品/定价问题'
  - '**边界条件**'
  - '- 数据统计需要一定的周期和样本量，短期波动不可作为唯一决策依据'
  - '- 漏斗模型需结合具体业态调整（如无人店需统计路过与进店转化）'
  sources:
  - paper: docs/202306/20230613_294.md
    role: origin
  excerpts:
  - “你要统计下进店人数和购买人数，然后判断下是你位置有问题，还是你的货品有问题或者定价有问题，如何判断：通过进店人数和购买人数来判断。”
