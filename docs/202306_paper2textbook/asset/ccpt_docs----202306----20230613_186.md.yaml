paper: docs/202306/20230613_186.md
desc: 该素材是生财有术社区郭晓文撰写的一篇指导新手参与「小航海」活动的实战指南。核心主张是：新手以「赚回学费」为目标时，必须克服「信息过载」与「选择瘫痪」，通过「目标锚定」策略，实施极致的「单项目单玩法」聚焦战术，即只做一个项目、只跟一个嘉宾、只练一个玩法，屏蔽所有无关干扰，将有限精力集中于跑通「认知-技能-执行」最小闭环，从而实现从小白到赚钱的突破。
concepts:
- name: 赚回学费目标
  desc: 设定具体、低门槛、可量化的朴素目标（如赚回199元报名费），作为决策锚点和心力来源，用于筛选行动、对抗焦虑、校准进度。
  is_original: true
  excerpt:
  - 接下来，我就以「赚回学费」这个最朴实的目的为例，和大家分享一下新手参加小航海的正确姿势。
  - 用这个目标来衡量「做一个项目，还是做多个项目」的决策。
  - 来，回归到我们的目标——「赚回 199 学费」。
- name: 单项目单玩法聚焦
  desc: 新手在资源有限、认知框架未建立时，应将注意力收窄至『一个项目的一个玩法』，屏蔽其他项目、其他玩法、其他嘉宾分享及他人爆单喜报，仅跑通最小必要闭环。
  is_original: true
  excerpt:
  - 你不需要懂那么多，你只需要搞定一个项目的一个玩法就够了
  - 意味着当你听了几个嘉宾的分享，已经确定要跟着一位嘉宾的玩法做之后，你就可以不听其他嘉宾的分享了
  - 意味着当你已经选定了一种玩法，那其他人用不同玩法做出成果的喜报和信息，也都与你无关了
- name: 反复横跳陷阱
  desc: 新手因缺乏判断框架，在多项目或多玩法间因贪婪/恐惧频繁切换，表象是『选择』实则是『逃跑』，导致舒适区未被突破、执行未闭环、最终一事无成。
  is_original: true
  excerpt:
  - 这就是大家常说的「在不同项目之间反复横跳，却一事无成」。
  - 我们不仅容易在不同项目之间反复横跳，还很容易在同一个项目的不同玩法之间反复横跳。
  - 你很难搞清楚自己是在选择，还是在逃跑。
- name: 目标锚定决策法
  desc: 利用明确目标（如赚回学费）作为唯一判断标准，反向推导『做什么』与『不做什么』，将海量信息转化为可执行的单一路径，降低认知负荷与决策瘫痪。
  is_original: true
  excerpt:
  - 具体的目标，可以提供我们突破舒适区所需要的心力
  - 具体的目标也可以作为锚点，让我们把注意力集中在对目标有效的行为和思考上
  - 当你有了明确的目标后，如何用目标来判断自己该做什么，不该做什么。
- name: 最少必要知识/技能闭环
  desc: 赚钱的最小可行性路径：理解项目所需的最少必要知识 → 掌握项目所需的最少必要技能 → 投入足够多资源去执行 → 突破过程中的难关。新手需在21天内跑通此闭环。
  is_original: true
  excerpt:
  - 赚回学费，意味着你顺利走完了「理解项目所需的最少必要知识➡️掌握项目所需的最少必要技能➡️ 投入足够多的资源去执行」的流程，也突破了这个过程中遇到的各种各样的难关。
methods:
- name: __overview__
  desc: 新手小航海「赚回学费」三步走执行法：1. 目标锚定（设定赚回学费为唯一指标）；2. 单项目锁定（仅报名/专注一个航海项目，拒绝多线作战）；3. 单玩法穿透（选定一位嘉宾的一个玩法，屏蔽其余所有分享与干扰，集中资源跑通『知-行』闭环）。
  excerpt:
  - 如果你的目的是「赚回学费」，那这个问题的标准答案可能就是「只参加一个航海」了。
  - 我们只需要搞定一个项目的一个玩法就可以对吗？
  - 专注，不仅意味着你要做什么，更意味着你不做什么。
- name: 项目筛选决策矩阵
  desc: 以『赚回学费』为单一约束条件：若选项（报名多个航海/学多个玩法/听多个嘉宾）无法在21天内支撑跑通『最少必要知识-技能-执行』闭环，则果断舍弃；仅保留能直接服务于『搞定一个玩法』的信息输入。
  excerpt:
  - 你觉得，作为一个新手来说，3 个礼拜你能搞定这些事情吗？
  - 用这个目标来衡量「做一个项目，还是做多个项目」的决策。
  - 在 21 天的时间里，全心全意去攻克一个项目，会比同时去做多个项目，胜率更高。
- name: 注意力屏蔽协议
  desc: 主动切断非目标相关信息流：确定嘉宾后停听其他分享；确定玩法后忽略他人不同玩法的爆单喜报；将『不做什么』清单显性化（不看其他项目帖、不研究其他选品法、不关注其他嘉宾课），物理/心理隔离干扰源。
  excerpt:
  - 你就可以不听其他嘉宾的分享了，无论那次分享呼声有多高。
  - 也都与你无关了，你要专注在把你选定的这套玩法做清楚上。
  - 当你把注意力范围，缩小到一个项目的一个玩法的时候，你自然就不会那么焦虑了。
theorems:
- name: 新手赚钱聚焦定律
  desc: 对于缺乏认知框架与判断力的新手，赚钱成功率与『聚焦度』正相关，与『广度』负相关。在时间受限（如21天）条件下，『一个项目×一个玩法×深度执行』的胜率显著高于『多项目×多玩法×浅尝辄止』。
  excerpt:
  - 要达成「赚回 199 学费」的目标，你并不需要知道那么多项目，并不需要懂得那么多项目，甚至并不需要你找到小航海项目里最红利、最适合你的项目。
  - 生财小航海里的任何一个搞钱为主题的项目，你能做清楚，都足够你赚回好几倍学费了。
  - 如果你的目标是赚回学费，那你不需要懂那么多，你只需要搞定一个项目的一个玩法就够了
- name: 目标驱动反脆弱性原理
  desc: 具体目标提供双重功能：1. 心力引擎：供给突破舒适区所需的心理能量；2. 认知过滤器：自动屏蔽不服务于目标的噪音信息。目标越具体，抗干扰能力越强，新手越不易陷入『选择即逃跑』的陷阱。
  excerpt:
  - 具体的目标，可以提供我们突破舒适区所需要的心力
  - 具体的目标也可以作为锚点，让我们把注意力集中在对目标有效的行为和思考上
  - 不去践行的话，道理懂得再多都毫无意义。
findings:
- name: 多航海并行导致焦虑瘫痪案例
  desc: '[evidence] 评论区用户「依稀阳光」反馈：报名四个航海（含ChatGPT+工具站高频讨论项目），前三天因信息爆炸崩溃，字认识但不理解，被迫熬夜补课、动员家人协助分流信息，焦虑感极强，验证了「多项目并行超出新手认知带宽」的判断。'
  excerpt:
  - 一个纯纯打工人，报了四个航海 前三天确实要崩溃了，信息爆炸，尤其是 ChatGPT+工具站，基本上每时每刻都有人发言，讲的东西吧，字都认识，但完全不理解
  - 焦虑到不行，熬夜看资料，一点一点补知识，也发动老婆帮我看视频号跟风向标的航海，自己只关注两个 ChatGPT
- name: 单项目聚焦缓解焦虑并推进理解案例
  desc: '[evidence] 同用户「依稀阳光」后续反馈：航海过一周后，收窄关注点至两个ChatGPT项目，聊天内容已能看懂，能用ChatGPT辅助视频号，焦虑感淡化，印证了「缩小注意力范围→降低认知负荷→恢复执行力」的路径有效性。'
  excerpt:
  - 航海过去一周了，昨天回去看 chatgpt 聊天内容，已经都能看懂了，也能用 ChatGPT 去辅助视频号了，焦虑感正在慢慢淡化
- name: 多项目报名者自我纠偏验证案例
  desc: '[evidence] 评论区用户「双平」自述：第七期报名6条航海，但仅1条是不知流程的新项目，其余皆为复盘/深化，表明有经验者会主动收敛至单一新变量，符合「新手单聚焦、老手可并行」的隐性分层规律。'
  excerpt:
  - 作为第七期新人，我这次报了 6 条航海，这 6 条航海只有 1 条我是不知道流程的，人最重要的是要有自知之明，明白自己想要什么，然后按照目标走就行了
- name: 信息贪婪与执行力负相关观察
  desc: '[claim] 作者观察到的普遍现象：新手倾向于『狗熊掰棒子』式收集海量资料（选品法、嘉宾分享、喜报），导致时间耗尽于学习而非执行，最终『什么都不剩下』，需通过『合适信息的断舍离』实现效率最大化。'
  excerpt:
  - 星球里面挺多信息都和自己的认知关联有限，而自己的时间也很有限，在效率最大化的情况下，要浏览和自己关联更强更有用的信息，才是门票最大化，时间使用最大化的办法，不然狗熊掰棒子，捡一个丢一个，最后什么都不剩下，要做合适信息的断舍离
