learning_targets:
- 理解定位三要素模型（积累×热爱×需求）在内容创业中的导航作用
- 掌握心态前置公理“先完成再完美”，突破完美主义导致的不产出
- 学会模块化知识体系建设法，将500个知识点聚类为内容生产库
- 掌握快写慢改与AI协作SOP的六阶段人机协同流程
- 学习爆款复盘三步法（找-思-仿），把爆款拆解为可复制因子
- 掌握爆款生成公式：热度话题 + 他人观点 + 独立思考原创观点
- 区分内容三大价值分类：实用、情绪、常识纠偏，指导选题设计
- 应用用户视角唯一性原则，通过换位假设法与过程倒推法转换思维
- 运用借势四源嵌入法（权威机构/经典出处/名人/热点）提升内容可信度
- 实践一鱼多吃，将单一内容跨平台分发以最大化ROI
- 构建垂直深度护城河，聚焦单一标签持续深挖至烧开
- 理解内容性质定人群定变现铁律，筛选高付费能力人群
- 实践降维人设设计，以普通人口吻输出专家级干货
- 掌握利他换利己平台博弈论，先输出优质内容再争取算法曝光
- 建立成长期价值塑造优先于用户筛选的认知，先攒信任资产
- 接受输入决定输出上限定律，通过高强度输入破解写作枯竭
- 实践持续输出量变引发质变定律，用日更积累内容复利资产
