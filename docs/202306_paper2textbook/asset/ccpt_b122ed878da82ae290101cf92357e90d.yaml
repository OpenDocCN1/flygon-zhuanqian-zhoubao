paper: docs/202306/20230627_015.md
desc: 该素材为一篇发售复盘报告的引言与索引，记录了作者圣矾在2022年针对知识付费项目课程，耗时3天策划、5天执行落地的7天发售方案，最终实现2天收款54万的实战案例。文章核心在于分享该发售策划的完整流程框架，并引导读者前往飞书文档查看详细执行细节。
concepts:
- name: 7天发售方案
  desc: 一种将产品发售过程压缩至7天内完成的高强度营销节奏设计，包含预热、正式开售、转化冲刺等阶段，旨在通过时间稀缺性驱动快速成交。
  is_original: false
  excerpt:
  - 用了 3 天的时间策划了一个为期 7 天的发售方案
- name: 发售策划流程框架
  desc: 指从策划准备、落地执行到收款复盘的标准化作业流程（SOP），本文旨在复盘并沉淀该框架供后续复用。
  is_original: true
  excerpt:
  - 本篇文章主要分享发售策划流程。
  - 策划 3 天，5 天落地，2 天收款 54 万复盘报告（流程框架）
methods:
- name: __overview__
  desc: 整体发售执行方法论：前置3天高强度策划设计方案 -> 中期5天按节奏落地执行（含预热、开售、逼单） -> 后置2天集中爆发收款 -> 事后复盘沉淀SOP。
  excerpt:
  - 策划 3 天，5 天落地，2 天收款 54 万
  - 用了 3 天的时间策划了一个为期 7 天的发售方案
theorems:
- name: 高客单价知识产品可通过标准化发售流程实现短周期大额变现
  desc: 核心主张：即使是已停止培训的知识付费项目课程，只要拥有成熟的发售策划流程框架，配合高强度的前期策划（3天）和纪律严明的执行落地（5天），即可在极短开售窗口（2天）内实现54万的大额收款，验证了发售模式对高客单价产品的高转化效能。
  excerpt:
  - 策划 3 天，5 天落地，2 天收款 54 万
  - 这个项目也早就停止培训了，本篇文章主要分享发售策划流程。
findings:
- name: 案例基础数据与结果
  desc: '[evidence] 实战案例数据：产品形态为知识付费项目课程；策划耗时3天；落地执行耗时5天；发售总周期7天；核心收款窗口2天；总收款金额54万元。该项目在复盘时已停止培训，证明了发售流程独立于产品长期交付能力的变现威力。'
  excerpt:
  - 策划 3 天，5 天落地，2 天收款 54 万
  - 本篇内容发售的产品是知识付费类的项目课程，这个项目也早就停止培训了
