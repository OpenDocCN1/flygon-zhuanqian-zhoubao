paper: docs/202306/WBsWdTm7uoOXICxiHDncFMdDnvb.md
desc: 该素材是连续创业者苗子的自述式长文复盘，详细记录了其从2019年入局互联网创业至2021年三人团队实现首个百万营收的全过程。核心内容围绕'积累-爆发-模型化'三个阶段展开：2019年通过付费进圈、对标模仿、内容输出完成'厚积'的资源与能力积累；2020年抓住小红书起号卖号风口，以'最小三人模型'极致执行单一项目并打通上下游资源实现'薄发'；2021年提炼出'纯线上、轻资产、自动化、可放大'的增长小组标准化作战模型，完成从靠项目赚钱向靠模式/能力赚钱的跨越。文章核心主张：项目有周期，唯有个人/组织能力的迭代（博观约取，厚积薄发）才是持续盈利的根本。
concepts:
- name: 最小三人模型/增长小组
  desc: 一种极小规模、高标准化的创业作战单元，由3人组成（通常为合伙人+执行/运营），通过'定时、定量、定人'的管理机制，专注于单一项目/渠道的极致执行与数据跑通，具备高复用性、可矩阵化放大特征。
  is_original: true
  excerpt:
  - 我把这套模式定为最小三人模型，我把这三人的群体叫做 增长小组。
  - 这种小团队的作战模式适用于非常多的场景，比如测试一个项目，比如跑一个渠道的数据，比如去提高某一方面的转化率，都非常适合用这套小团队去攻破
  - 我的管理方法就是三个词：定时，定量，定人。确定时间落实，确定工作量的划分，具体的责任指定人员
- name: 博观约取·厚积薄发创业论
  desc: 将苏轼诗句迁移至创业认知体系：'博观约取'指广泛对标学习同行模式后提炼核心精华；'厚积薄发'指在长期不盈利期沉淀资源、能力、私域基本盘，待风口到来时极致执行单一项目实现指数级爆发。
  is_original: true
  excerpt:
  - 只有见识广博才能择其精要而取之，只有积累丰厚才能得心应手为我用。
  - 放在自己的创业之路上也是一样，博观约取，才能厚积薄发
  - 如果要总结20年之后我为什么能赚钱，那就是我用了19年一整年的时间去做了积累。
- name: 付费进圈/高阶圈层跃迁
  desc: 将付费视为获取行业实时动态、对标头部模式、建立高质量人脉的最高效杠杆。核心逻辑：赚钱->进高层圈子->赚更多钱->进更高层圈子，通过'无脑付费'筛选优质信息源并建立信任连接。
  is_original: false
  excerpt:
  - 咱们赚钱就是为了进高层的圈子，然后去赚更多的钱，然后再用更多的钱去进更高层的圈子，去赚更多更多的钱。
  - 那我进了社群有两个目的：1，第一时间去了解行业的实时动态。2，第一时间去对标和模仿前辈们的运行模式。
  - 付费我是从头到尾都是认可的...我之前做线下装修也经常去做参加一些装企类的培训班，总裁班 等等。
- name: 项目极致执行与资源打通
  desc: 在单一项目上做到渠道覆盖极致（如小红书特定赛道霸屏）与变现链路闭环（对接MCN/博主批量出货）的双重深度，构建短期护城河。以'一机一号'矩阵化操作实现规模化产出，再通过线下跑城市对接买家资源解决后端变现瓶颈。
  is_original: true
  excerpt:
  - 一个是把项目做到极致；一个是把项目后端资源打通。
  - 我们统计了一下账号的数量，一共有解决6000个账号...一共有6000部手机再做号
  - 当时只要去小红书刷到这三个领域，10个视频最少有4-6个视频使我们这边的账号，这是项目做到极致。
  - 为此我们去跑了很多城市，北京，广州，佛山，济南，南京，对接了6家MCN机构，也同时对接了大量的小红书个人博主
- name: 四大关键词模式标准
  desc: 2021年确立的业务筛选与组织设计四大铁律：纯线上（不碰自营重运营）、轻资产（不碰重投资）、自动化（建立成交系统减少人力依赖）、可放大（单人可矩阵化复制）。用于判断项目是否值得接入及团队如何分工。
  is_original: true
  excerpt:
  - 其实这个时候我的创业关键词有四个：纯线上，轻资产，自动化，可放大。
  - 模式纯线上：坚决不拉自营项目。投资轻资产：坚决不会碰重投资。人员自动化：有一套完整的成交系统。项目可放大：一人可以矩阵化的工作。
- name: 晒数据即展示实力论
  desc: 重新定义'晒收益/晒数据'行为：非炫耀，而是低成本建立信任、筛选高意向客户、展示组织实力的营销必要手段。凡能证明实力强大的指标（团队规模、社群人数、转化数据等）均可作为'晒'的素材。
  is_original: true
  excerpt:
  - 晒数据它只是一种实力的展现，它不一定是晒收益，可以去晒团队人数，可以去晒社群人数，可以渠晒公司规模，可以渠晒人脉，可以渠晒豪车，一切可以渠证明的自己实力强大的东西都可以去晒。
  - 因为这个是一个酒香也怕巷子深的时代。
methods:
- name: __overview__
  desc: 全周期创业复盘与模型提炼法：按年度切分阶段 -> 标注关键词/转折点 -> 拆解核心动作（付费进圈、对标拆解、极致执行、资源打通、模型固化） ->
    提炼可复用的组织模型（最小三人模型）与认知原则（博观约取，厚积薄发）。
  excerpt:
  - 细数一下我从事互联网创业满打满算应该是有4年的时间...第一个一百万却是我足足用了两年半的时间才去赚到的
  - 2019年...积累；2020年...爆发；2021年...模型化
  - 项目不会永远赚钱，一直赚钱的永远是我们自己。
- name: 对标拆解与'扒模式'标准流程
  desc: 针对目标大佬/竞品的全链路逆向工程：1. 全平台搜索ID/关键词（抖快小/知乎/微博/公众号）；2. 关注公众号分析后端转化路径；3. 盗版网站/知识星球搜索其付费课程/社群内容；4.
    取其精华（可复用模式）去其糟粕，内化为自身打法或谈资储备。
  excerpt:
  - 现在信息很透明，无非就是那几个自媒体平台，短视频三大傻 抖快小，知乎，微博，所有的平台都去搜一遍，最后再去关注一下公众号...最关键的一步也是有点无耻的一步，那就是去盗版网站，里面去搜一下这个人所有的课程，这时候从头到尾才扒的很干净
  - 取其精华去其糟粕，模式能套的就套一下，套不了的就换下一个，最差的结果那就是他的这套模式我可以当做以后的谈资
- name: 最小三人模型落地执行法
  desc: 三人小团队高效作战SOP：1. 角色锁定（合伙人决策+执行+运营/后勤）；2. 目标量化（如6个月赚10万）；3. 管理三定（定时复盘、定量任务拆解、定人责任到人）；4.
    场景复用（测试新项目/跑新渠道/优化转化率均适用）；5. 矩阵化放大（单人多号/多账号操作）。
  excerpt:
  - 我把这套模式定为最小三人模型...我的管理方法就是三个词：定时，定量，定人。
  - 这种小团队的作战模式适用于非常多的场景...包括我现在工作室还是一直再用这种方式来去跑项目。
  - 当时我们定的目标是非常简单的，那就是从8月份到年底，距离过年6个月时间，目标是赚10万
- name: 社群裂变与后端资源打通组合拳
  desc: 低成本冷启动社群商业化闭环：1. 低价（365元）快速招募种子用户建立信任与现金流；2. 社群内发起大规模打卡营（如6000账号）制造声量与产出；3.
    创始团队线下跑城市对接MCN/大V/买家建立稳定收号渠道；4. 社群分层涨价（365->1980）筛选高客单价用户，形成'收学费+赚差价+自产自销'三重收入结构。
  excerpt:
  - 第一批一共招募了100人左右，当时的价格是365...一晚上就收入了快3万多
  - 我们其中一个月做了一个打卡营，社群200+成员和我们一起去做号，我们统计了一下账号的数量，一共有解决6000个账号
  - 对接了6家MCN机构，也同时对接了大量的小红书个人博主，才能实现把这么多账号给出手。
  - 收入一共分为三种：1，社群收人...2，自己做号收入...3，学员出号我们拿一定的差价
theorems:
- name: 核心能力迭代论：项目有周期，能力永存
  desc: 创业赚钱的本质非单一项目红利，而是创始人/团队核心能力（认知广度、执行深度、资源整合力、模型复用力）的持续迭代。只有完成从'靠项目赚钱'到'靠模式/能力赚钱'的跨越，才能实现长期确定性增长。
  excerpt:
  - 项目不会永远赚钱，一直赚钱的永远是我们自己。
  - 我用了两年半去赚到一百万...因为只有自己强大了，能力提升了，思维开阔了，这才是赚钱的根本。
  - 包括我从21年到23年的一个模式的转变，也是同样的道理。
- name: 阶段匹配论：合适阶段做合适事，赚合适钱
  desc: 创业需严格遵循阶段律：积累期（0-1）甘坐冷板凳付费学习、夯实基本功；爆发期（1-10）锁定单一风口极致执行、打通资源；模型期（10-N）标准化组织架构、剥离重资产、追求自动化放大。越级操作（如积累期想暴富、爆发期搞复杂管理）必死。
  excerpt:
  - 在合适的时间去做合适的事情，在合适的阶段去挣合适的Money。
  - 19年...去做了积累...20年...空手套白狼...21年...团队 模式
  - 我清楚的明白20年半年可以赚50w是有运气成分在的...所以才能定下这4个关键词（纯线上、轻资产、自动化、可放大）。
- name: 线下付费学习是打破认知天花板的最短路径
  desc: 对于非标准化、高壁垒的实操型项目（如小红书起号卖号的供应链/渠道对接），线下支付高额学费拜师学艺、实地考察资源方，是比线上自学、盗版课程效率高数量级的决策。'心疼钱'但'必须花'是跃迁的必要代价。
  excerpt:
  - 这也是为什么我2020年的关键词是：线下敢于花钱。
  - 一共跑了两个地方...一路上吃喝拉撒，加上其他开销一共花了7000大洋...但就是花了这个钱，我们半年才能去赚到50万。
  - 其实我们出去之前就估算到了这个数目，也是比较心疼的
- name: 合伙人必须线下共事原则
  desc: 高强度早期创业合伙，线上协作大概率因信任成本高、信息损耗大、执行力无法对齐而失败。唯有'线下同办公、同吃住、同作息'的强绑定模式，才能在极度不确定性中建立战友级信任，支撑'定时定量定人'的高压执行。
  excerpt:
  - 如果要在一起合伙做事，那必须在一起办公，什么线上先合作合伙，后面必会出现矛盾或者大概率坚持不下去。
  - 要么直接线下，要么还是各玩各的，以后可以项目上的合作
  - 我的强势，加上的合伙人的敢于尝试，才能碰到一起。
findings:
- name: 2019年零收入但完成八大核心资产积累
  desc: '[evidence] 作者自述2019年全年无实质性盈利（仅咸鱼项目一次性赚1000+），但通过进10+付费社群（投入4000元）、写作练习、项目拆解能力、私域积累（微信2500+好友、公众号4000粉）、高阶人脉连接（战劲、王一书、九京等）等8项隐性资产积累，为后续爆发奠定基础。'
  excerpt:
  - 其实我19年是真的没有赚什么钱...其他时间就是在啃老本和积累资源和去对标同行。
  - 那如果要总结20年之后我为什么能赚钱，那就是我用了19年一整年的时间去做了积累。
  - 1，我进了十几个社群... 2，练成了随手就可以写出一两千字文章的能力... 8，我积累了我的第一波私域流量2500+好友，公众号接近4000粉。
- name: 2020年半年实现50万营收，达成目标5倍
  desc: '[evidence] 三人团队（作者+合伙人墨羽+其妻）成立于2020年8月，定下年赚10万目标，通过小红书起号卖号项目（社群收费+自产号销售+学员代卖差价）三重收入结构，半年实际营收约50万。关键动作：线下花7000元学项目、矩阵化操作50部手机月产20-30个万粉号、跑5城对接6家MCN及大量博主打通销路。'
  excerpt:
  - 目标是赚10万...用了半年时间足足赚了5倍的目标。
  - 收入一共分为三种...后面添加到了50部手机，每个月都可以起万粉号差不多20-30个...对接了6家MCN机构
  - 一共跑了两个地方...加上其他开销一共花了7000大洋...但就是花了这个钱，我们半年才能去赚到50万。
- name: 2021年全年营收近90万，验证增长小组模型有效性
  desc: '[evidence] 2021年团队在''纯线上、轻资产、自动化、可放大''四大原则指导下，复用最小三人模型持续跑项目，全年营收达到90万（接近百万目标）。组织架构图显示已形成标准化运营体系，验证了''最小三人模型''的可复制性与规模化潜力。'
  excerpt:
  - 一直到年底我们也是非常幸运的去干到了90w的小目标。
  - 这张图包含了我目前整个工作室的运营架构。
  - 包括我现在工作室还是一直再用这种方式来去跑项目。
- name: 社群首发365元低价4天回笼3万现金流验证付费意愿
  desc: '[evidence] 思维社首期招募100人，定价365元/年，数天内售罄，单晚收入3万+，即时验证了私域影响力变现能力，并为后续项目测试、打卡营组织、高客单价升级（至1980元）提供了种子用户池与启动资金。'
  excerpt:
  - 第一批一共招募了100人左右，当时的价格是365，用了几天的时间去完成了第一次招募...一晚上就收入了快3万多
  - 当晚我们就花了200多吃了一顿小龙虾。这也是我们这个团队的第一笔启动资金。
- name: 豆瓣引流项目失败教训：无后端变现的流量无价值
  desc: '[evidence] 早期尝试带社群做豆瓣引流，虽能引流但90%用户无后端变现能力且多为白嫖党，导致流量资产贬值。此教训直接倒逼团队寻找''自带变现闭环''的小红书起号卖号项目，确立了''项目前端引流必须匹配后端资源打通''的选品标准。'
  excerpt:
  - 一开始带社群成员去做豆瓣引流...引来的人干嘛，百分之九十的人都没有后端变现，而且这些人大多数都是白嫖的，没有价值。
  - 就在遇到这问题的时候，很幸运，碰到了直接让我们出圈的一个项目，也是当时独家的项目。
