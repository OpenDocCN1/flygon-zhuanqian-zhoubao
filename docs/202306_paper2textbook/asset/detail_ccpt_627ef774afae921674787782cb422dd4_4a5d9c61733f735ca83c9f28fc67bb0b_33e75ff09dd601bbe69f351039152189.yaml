units:
- 'no': 1
  name: 认知破局 —— 让“打工思维”变成“赚钱逻辑”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人实现财富跃迁的核心障碍是思维范式固化'
  - '- 需要从出卖时间转向经营资产和提取剩余价值'
  - '- 为后续商业实战方法论奠定底层逻辑基础'
  - '**核心定义**'
  - '- 认知破局是主观能动性的释放与商业模型重构，即从“做题家”跃迁为“出题家”'
  - '**关键性质**'
  - '- 非线性增长：赚钱曲线具有波峰浪谷特征'
  - '- 主观能动性：赛道可选、红利可捕捉，评价多元'
  - '**典型例子**'
  - '- 考985路径受先天因素锁定 vs 年入百万路径后天可控'
  - '**边界条件**'
  - '- 认知升级不是理论学习，必须通过直接投身实战积累隐性知识'
  sources:
  - paper: docs/202306/20230613_080.md
    role: origin
  - paper: docs/202306/20230613_182.md
    role: improve
  excerpts:
  - 认知升级的本质是主观能动性的释放与商业模型的重构
  - 出卖时间本质是帮中介完成交易，薪资经层层筛减
  - 零边际成本产品（媒体/代码）实现时间复用，才能突破财务自由天花板
- 'no': 2
  name: 财富的本质 —— 让“存款”变成“持续提取”
  points:
  - '**为什么需要这个概念？**'
  - '- 打破“财富=存款”的静态认知'
  - '- 理解财富是动态流向过程，让别人的钱持续流向自己口袋'
  - '- 揭示合法获取财富的唯一路径：提供价值或掌握稀缺资源'
  - '**核心定义**'
  - '- 财富是持续从社会提取剩余的能力，影响力覆盖面与强度决定财富上限'
  - '**关键性质**'
  - '- 动态流向：财富不是拥有物，而是持续流动过程'
  - '- 底层法则：对他人施加“得利”或“损害”'
  - '**典型例子**'
  - '- 霍英东、芒格用快钱积累第一桶金，再布局慢钱'
  - '**边界条件**'
  - '- 仅靠出卖时间（血酬模式）将被AI取代，无法持续提取剩余价值'
  sources:
  - paper: docs/202306/20230613_182.md
    role: origin
  - paper: docs/202306/20230613_006.md
    role: apply
  excerpts:
  - 财富是动态流向过程的核心定义：让别人的钱持续流向自己口袋
  - 合法获取财富的唯一路径——提供价值（得利）或掌握稀缺资源（可施加损害/定价权）
  - 拿捏本质：提供价值完成绑定，实现对他人劳动剩余的持续定向提取
- 'no': 3
  name: 商业模式公式 —— 让“盲目努力”变成“量化评估”
  points:
  - '**为什么需要这个概念？**'
  - '- 建立评估商业模式优劣的量化标尺'
  - '- 避免“不懂公式盲目努力必然‘忙死赔死’”'
  - '- 明确好的商业模式=赚钱、高频、可持续'
  - '**核心定义**'
  - '- 利润 = (收入 - 成本) × 频次 × 周期'
  - '**关键性质**'
  - '- 频次与周期是放大利润的双引擎'
  - '- 单一交易无法构成良好商业模式'
  - '**典型例子**'
  - '- 农夫山泉早期好模式短期未必是好生意'
  - '**边界条件**'
  - '- 公式仅供评估，不代表执行保证，需结合实际验证'
  sources:
  - paper: docs/202306/20230613_007.md
    role: origin
  - paper: docs/202306/20230613_119.md
    role: improve
  excerpts:
  - 利润 = (收入 - 成本) × 频次 × 周期
  - 好的商业模式=赚钱、高频、可持续
  - 好模式短期未必是好生意；好生意未必是好模式
- 'no': 4
  name: 商业模式分层 —— 让“出卖时间”变成“做庄家”
  points:
  - '**为什么需要这个概念？**'
  - '- 按财富提取深度划分三级商业模式'
  - '- 揭示出卖时间者在AI时代将失去议价力'
  - '- 指引从L1血酬向L2/L3跃迁'
  - '**核心定义**'
  - '- L1血酬（出卖时间健康，将被AI取代）、L2资源租金（掌握稀缺社会资源）、L3规则制定（建立生态做庄家，赢家通吃）'
  - '**关键性质**'
  - '- 财富提取深度决定收入上限'
  - '- L3具有网络效应和规模效应'
  - '**典型例子**'
  - '- 出租司机（L1） vs 平台所有者（L3）'
  - '**边界条件**'
  - '- L2需要“稀”+“缺”双维度并满足，缺一不可'
  sources:
  - paper: docs/202306/20230613_182.md
    role: origin
  - paper: docs/202306/20230613_007.md
    role: apply
  excerpts:
  - L1血酬（出卖时间，将被AI取代）、L2稀缺社会资源租金（守擂/攻擂博弈）、L3制定规则/建生态做庄家（赢家通吃）
  - 第四次科技革命将淘汰可标准化、重复性劳动，出卖时间者将失去议价力
  - 稀=总量有限/信任成本高；缺=刚需/社会运转必不可少
- 'no': 5
  name: 时间杠杆 —— 让“单位时间”变成“可重复发售”
  points:
  - '**为什么需要这个概念？**'
  - '- 对比一对一（电销/咨询）与一对多（内容/代码/媒体）的时间复用率'
  - '- 证明普通人一生可售时间仅占总寿命10%，直接出售时间天花板极低'
  - '- 主张将单位时间重复发售，实现指数级放大'
  - '**核心定义**'
  - '- 一对多模式是财务自由核心路径，再生产时间成本趋近零是实现指数级财富增长的必要条件'
  - '**关键性质**'
  - '- 零边际成本：写书、直播带货、代码、媒体等再生产时间成本趋近零'
  - '- 指数级放大：单次生产，无限复制'
  - '**典型例子**'
  - '- 写书一次，持续版税；录制课程，持续销售'
  - '**边界条件**'
  - '- 需要具备内容生产能力和分发渠道，否则无法复用'
  sources:
  - paper: docs/202306/20230613_101.md
    role: origin
  - paper: docs/202306/20230613_180.md
    role: improve
  excerpts:
  - 时间为终极生产资料
  - 再生产时间成本趋近零（写书、直播带货、代码、媒体）是实现指数级财富增长的必要条件
  - 普通人一生可售时间仅占总寿命10%
- 'no': 6
  name: 商业进化三阶段 —— 让“渠道思维”变成“认知思维”
  points:
  - '**为什么需要这个概念？**'
  - '- 宏观判断商业社会演进规律：核心生产力从渠道转移至认知'
  - '- 供给过剩倒逼“代运营”等2.5中介层诞生'
  - '- 指导赛道选择与定位'
  - '**核心定义**'
  - '- 1.0鸡毛换糖（渠道为王）→ 2.0商铺模式（平台为王）→ 3.0知识模式（认知为王）'
  - '**关键性质**'
  - '- 认知红利是3.0时代的核心资产'
  - '- 2.5层连接2.0向3.0转型，价值来自认知理解'
  - '**典型例子**'
  - '- 代运营2.5模式：只做1-10提升效率'
  - '**边界条件**'
  - '- 认知红具有时效性，需及时变现'
  sources:
  - paper: docs/202306/20230613_007.md
    role: origin
  - paper: docs/202306/20230613_250.md
    role: improve
  excerpts:
  - 核心生产力从渠道转移至认知，供给过剩倒逼‘代运营’等2.5中介层诞生
  - 商业3.0时代：知识认知时代
  - 代运营2.5为连接2.0向3.0转型的中介模式
