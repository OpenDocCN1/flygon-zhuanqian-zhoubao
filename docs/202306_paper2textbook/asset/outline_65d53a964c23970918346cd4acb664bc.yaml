'no': 1
name: 小红书电商实战 —— 从“摸着石头过河”到“标准化量产”
desc: 本章系统梳理小红书电商从认知建立、账号冷启动、选品测品、内容生产、流量运营到商业变现的全链路方法论，重点解析平台红利期特征、无货源模式演进逻辑、矩阵化放大策略及合规引流转化体系，助力学员构建可复制的‘轻模式’电商操盘能力。
nodes:
- 'no': 1
  name: 小红书电商红利期的核心判断
  desc: 解析平台无品牌垄断、玩法百花齐放、稽查宽松的三大红利特征，以及高购买力用户、长尾搜索流量、高转化率的商业价值支撑，建立‘选择大于努力’的入局认知。
  role: motivation
  src:
