paper: docs/202306/20230613_179.md
desc: 该素材为小马宋《创业46条》系列第17条，核心探讨企业在存量竞争时代的生存法则：持续盈利的关键在于构建“先进生产力”与“极致执行力”的双重护城河。文章通过营销行业二十年变迁（从投电视广告到短视频矩阵运营）对比，阐释生产力必须随时代进化；以可口可乐终端管理为例，论证执行力是竞争壁垒的落地保障。同时指出运气仅决定初始成功，长期优势源于生产力与执行力的持续比拼，并延伸出“选择大于努力、洞察人性不变”的战略思考。
concepts:
- name: 先进生产力
  desc: 企业在特定历史阶段具备的、超越行业平均水平的创造价值能力，包含先进的理论、方法、工具，随技术环境变迁而动态进化，是企业竞争力的核心来源。
  is_original: false
  excerpt:
  - 企业的竞争，就是生产力和执行力的竞争。一个企业，首先要掌握先进的生产力，即使不是制造和科技行业，先进的生产力也是需要的。比如营销咨询，他想赢得竞争力，就需要先进的理论，先进的方法，先进的工具。
  - 二十年前，中国的营销行业有非常简单粗暴又有效的方式，就是投电视广告+铺渠道，那个时候你核心的竞争力来自你对投广告这件事有效性的认知...
  - 今天，这个方法慢慢失效了，那你就应该掌握更先进的运营方式和方法，比如爱玛的 CMO 告诉我，爱玛一周可以生产 2-3 万条短视频，曝光几个亿，这就是在这个短视频时代先进的方法、理念和工具。
- name: 执行力
  desc: 将决策、创意、战略转化为实际结果的落地能力，表现为对细节的极致管理和大规模标准化操作能力，是生产力产出商业价值的必要条件。
  is_original: false
  excerpt:
  - 第二个就是执行力。执行力是所有决策和创意落地的保障，优秀的企业，都是执行力极强的企业。
  - 像可口可乐在中国有数百万个售点，那对这些售点的管理是需要极其细致的执行力的，99%的企业并不具备管理可口可乐终端的能力。
  - 生产力就是创造力，创新力，执行力就是落地能力
- name: 生产力失效周期
  desc: 指特定商业方法（如投电视广告、PS设计、拍TVC）随技术普及、工具门槛降低而逐渐丧失竞争优势的过程，倒逼企业必须持续迭代生产力。
  is_original: true
  excerpt:
  - 过去广告公司会个 PS，能写脚本，能拍好看的 TVC 就很厉害了，这就是当时先进的生产力。但今天，广告人的专业能力和普通人的专业能力差被拉小了，因为很多人都可以制作视频、拍广告了，所以你的先进生产力就不足了，所以竞争力就会下降。
methods:
- name: __overview__
  desc: 竞争优势构建的双引擎模型：通过‘生产力迭代’获取认知与工具红利，通过‘执行力深挖’构建组织壁垒，二者缺一不可，共同应对‘凭什么是你’的生存拷问。
  excerpt:
  - 我们做公司，就是要始终思考，我比同行好在哪里，我比同行有哪些竞争优势，我如何才能创造竞争优势。
  - 创业成功，肯定有好运气的成分，但持续保持优势，就是生产力和执行力的比拼。
- name: 跨周期生产力对标法
  desc: 通过横向对比不同时代（如20年前vs现在）的营销成功案例，识别时代红利转移路径，从而定位当前阶段的‘先进生产力’标准。
  excerpt:
  - 二十年前，中国的营销行业有非常简单粗暴又有效的方式，就是投电视广告+铺渠道...
  - 今天，这个方法慢慢失效了，那你就应该掌握更先进的运营方式和方法，比如爱玛的 CMO 告诉我，爱玛一周可以生产 2-3 万条短视频，曝光几个亿...
- name: 头部企业执行力解剖法
  desc: 以行业绝对龙头（如可口可乐）的运营细节为基准，反推自身组织在规模化、标准化、精细化管理上的能力边界，定位执行力提升方向。
  excerpt:
  - 像可口可乐在中国有数百万个售点，那对这些售点的管理是需要极其细致的执行力的，99%的企业并不具备管理可口可乐终端的能力。
theorems:
- name: 竞争本质定律：生产力×执行力
  desc: 企业竞争的本质是生产力与执行力的乘积竞争。生产力决定‘上限’（能创造什么价值），执行力决定‘下限’（能兑现多少价值），缺一不可。
  excerpt:
  - 企业的竞争，就是生产力和执行力的竞争。
  - 生产力就是创造力，创新力，执行力就是落地能力，我们做公司，就是要始终思考，我比同行好在哪里，我比同行有哪些竞争优势，我如何才能创造竞争优势。
- name: 运气与实力分层定律
  desc: 创业初期的成功包含运气成分，但持续保持竞争优势、实现长期盈利，纯粹是生产力与执行力比拼的结果，运气在长周期中归零。
  excerpt:
  - 创业成功，肯定有好运气的成分，但持续保持优势，就是生产力和执行力的比拼。
- name: 选择大于努力，人性为锚
  desc: 在生产力与执行力均拉满（努力成为标配）的存量竞争阶段，战略选择（怎么做、做什么）成为决定性变量；洞察不变的人性是做对选择的底层逻辑。
  excerpt:
  - 我的观点：选择就是一切，努力只是标配。大家都努力，生产力和执行力都拉满的情况下，那其实比的就是怎么做的问题了。
  - 这涉及到人与人不同的认识，思考如何事半攻倍，这也涉及到平时要多多揣摩人性。什么都变，但是人性是不变的
findings:
- name: 营销行业生产力范式迁移证据
  desc: '[evidence] 素材通过对比‘二十年前投电视广告+铺渠道’与‘当下爱玛一周产2-3万条短视频、曝光几亿’的具体数据，实证展示了营销生产力从‘媒介购买认知’向‘内容工业化生产能力’的范式跃迁。'
  excerpt:
  - 二十年前，中国的营销行业有非常简单粗暴又有效的方式，就是投电视广告+铺渠道...
  - 爱玛的 CMO 告诉我，爱玛一周可以生产 2-3 万条短视频，曝光几个亿，这就是在这个短视频时代先进的方法、理念和工具。
- name: 专业门槛消解导致生产力贬值证据
  desc: '[evidence] 素材以广告行业为例，指出‘会PS、写脚本、拍TVC’曾是核心竞争力，但随着制作工具普及，专业人士与普通人能力差距缩小，导致原有生产力失效，竞争力下降。'
  excerpt:
  - 过去广告公司会个 PS，能写脚本，能拍好看的 TVC 就很厉害了，这就是当时先进的生产力。但今天，广告人的专业能力和普通人的专业能力差被拉小了，因为很多人都可以制作视频、拍广告了，所以你的先进生产力就不足了，所以竞争力就会下降。
- name: 可口可乐终端管理执行力天花板证据
  desc: '[evidence] 素材引用可口可乐‘中国数百万售点’的管理规模，论证极致执行力表现为大规模、精细化、标准化的组织落地能力，且‘99%企业不具备’该能力，确立了执行力的高门槛特征。'
  excerpt:
  - 像可口可乐在中国有数百万个售点，那对这些售点的管理是需要极其细致的执行力的，99%的企业并不具备管理可口可乐终端的能力。
- name: 评论区‘老实本分=核心竞争力’的社会学印证
  desc: '[claim] 评论区高赞观点认为‘做得特别好，其实就是老实一点，本分一点’，并归因于‘同行衬托’，侧面印证了在行业整体生产力/执行力低下时，坚守基本面即构成相对优势。'
  excerpt:
  - 老罗和郭德纲经常说，我们做的特别好吗？其实就是老实一点，本分一点。大概意思是有这么大的名气和这么多粉丝拥趸，全 tm 靠同行衬托😂
