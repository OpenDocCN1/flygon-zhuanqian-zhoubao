- 'no': 1
  name: AI 时代认知重构 —— 从“工具使用者”到“超级个体”
  desc: 本章旨在破除大众对 AI 的“门槛悖论”误解，确立 AI 作为“认知杠杆”的核心地位。我们将探讨如何通过“广义/狭义阅读”构建内生能力，如何利用 AI
    抹平技能鸿沟实现思维转变，以及如何管理多任务并行以维持高认知带宽。
  nodes:
  - 'no': 1
    name: AI 门槛悖论与能力分化
    desc: 理解 AI 看似降低技术门槛，实则提高了判断力与提问能力的门槛，导致人群加速分化的现象；认识到 AI 写作本质是过程而非结果映射，需保持人类主体性。
    role: motivation
    src:
    - paper: docs/202306/20230613_027.md
    - paper: docs/202306/20230627_094.md
    - paper: docs/202306/20230627_096.md
  - 'no': 2
    name: 内生项目方向、达人优先原则与信息差捕捉
    desc: 主张“先成为达人，再匹配项目”。通过广义阅读构建认知底座，狭义阅读进行项目复盘，让项目方向从内部积累中自然涌现。结合“资料整理”淘金模型与“风向标”信息差捕捉，低成本验证机会。
    role: method
    src:
    - paper: docs/202306/20230613_109.md
    - paper: docs/202306/20230613_029.md
    - paper: docs/202306/20230613_193.md
    - paper: docs/202306/20230613_108.md
    - paper: docs/202306/20230613_197.md
  - 'no': 3
    name: AI 生态位定位模型
    desc: 引入“生态位”概念，将用户分为甲方（平台构建者）、乙方生产者（提效降本）、乙方消费者（学习提效/转型）及第三方（痛点服务），明确自身在 AI 商业系统中的角色与盈利逻辑。
    role: definition
    src:
    - paper: docs/202306/20230627_094.md
  - 'no': 4
    name: 行动力破圈、时间管理与多线程并行
    desc: 剖析“想得多做得少”的心理机制（中等认知陷阱），提出“先完成再完美”的行动准则；通过时间管理闭环（三只青蛙、GTD等）维护高认知带宽；针对多项目并行场景，采用目标分层与批量化处理策略降低决策成本。
    role: method
    src:
    - paper: docs/202306/20230613_229.md
    - paper: docs/202306/20230613_111.md
    - paper: docs/202306/20230613_115.md
    - paper: docs/202306/20230613_195.md
- 'no': 2
  name: 提示词工程与高效协作 —— 从“单点指令”到“结构化思维”
  desc: 本章超越基础的“问答”模式，深入探讨高阶提示词工程与人机协作范式。通过引入社会学研究方法论提升提问深度，利用角色设定、语境完备化及多因果假设生成释放模型潜能，并实现长文本的高效处理与代码/插件的自动化生成。
