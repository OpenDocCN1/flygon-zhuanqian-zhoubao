learning_targets:
- 理解价值不等价交换的底层逻辑，能识别交易中价值与成本的错位
- 掌握项目前置推演与六维评估模型，能系统评估副业项目的可行性
- 学会用双维分类法扫描商业机会，能在非品牌忠诚型市场中找到切入点
- 熟悉“复制-改良-超越”的入场策略，能制定数据驱动的迭代方案
- 理解项目风险分层与本质归因，建立理性的项目预期与止损意识
- 掌握“闭环即正义”的合规准则，能诊断私域CPS等项目的生存边界
- 了解完整项目生命周期中的爆点与踩坑，牢固树立合规红线意识
- 能区分“做店”与“招商”的赚钱层级，规划从辛苦钱到资本钱的跃迁路径
concept_map:
- 副业认知重构 —— 从“找项目”到“懂商业本质”
- ├── 底层逻辑
- │   ├── 价值不等价交换 —— 20230613_240
- │   │   ├── 核心定义：提供者收获报酬 > 付出成本即盈利
- │   │   └── 核心主张：赚钱的关键是提供高市场价格的价值，而非付出多少
- │   ├── 项目前置推演 —— 20230613_240
- │   │   ├── 方法：先推演谁付费/为什么付费/我提供什么价值/成本结构/竞争格局
- │   │   └── 核心主张：逻辑不通，执行再强也难盈利
- │   └── 项目三棱镜 —— 20230627_123
- │       ├── 核心定义：任何项目都存在盈利、未盈利、被骗三种结局
- │       └── 核心主张：入场前必须评估自己属于哪一层，建立风险识别能力
- ├── 项目筛选与评估
- │   ├── 六维评估模型 —— 20230613_240
- │   │   ├── 方法：从痛点/付费意愿/竞争/规模/个人强项/执行成本六个维度打分
- │   │   └── 核心主张：维度互补，需综合评分而非单点判断
- │   ├── 机会雷达（双维分类法） —— 20230613_240
- │   │   ├── 方法：从个人出发（痛点/技能/资源）+ 从他人出发（热点/趋势/竞品）
- │   │   └── 核心主张：结构化扫描让灵感不再依赖运气
- │   └── 非品牌忠诚型市场 —— 20230613_240
- │       ├── 核心定义：用户只关心核心利益、不关心品牌的市场
- │       └── 核心主张：无垄断龙头，新进入者只要提供有效信息即可分羹
- ├── 入场与放大策略
- │   ├── 复制-改良-超越 —— 20230613_240
- │   │   ├── 方法：复制头部布局 → 用自有数据找差异 → 开发技术/体验爆点
- │   │   └── 核心主张：让市场帮你选择哪些能抄、哪些不能抄
- │   ├── 辛苦钱与资本钱 —— 20230627_050
- │   │   ├── 方法：做店赚线性收益，招商（复制模式给他人）赚指数收益
- │   │   └── 核心主张：真正的规模化财富路径在于“招商”而非单纯做店
- │   └── 折扣站生命周期 —— 20230613_240
- │       ├── 方法：低成本MVP → A/B测试选品 → 差异化功能爆点 → 自动化放大 → 合规管理
- │       └── 核心主张：合规是生存底线，技术红利不可对抗平台规则
- └── 风险与合规认知
- '    ├── 剥开项目外衣 —— 20230627_123'
- '    │   ├── 方法：把包装神秘的项目归因到已知商业模式（如营销联盟）再评估'
- '    │   └── 核心主张：识别本质有助于评估天花板、竞争度与可持续性'
- '    ├── 闭环即正义 —— 20230627_129'
- '    │   ├── 核心定义：私域CPS必须构建“用户支付-平台分账-服务履约”的实质性闭环'
- '    │   └── 核心主张：纯导流（跳转/口令）必死，自有交易闭环可生'
- '    └── 资料索引 —— 20230613_064 / 20230627_122'
- '        ├── 方法：通过语雀、飞书文档索引获取完整SOP与案例细节'
- '        └── 核心主张：教程之外需按图索骥深度研习原始资料'
life_analogy:
- 想象“副业项目选择”是一场**夜市摆摊创业**的实战演练：
- '- **价值不等价交换** = 你采的野果在山上只值1元，运到深夜的市区能卖50元，差价来自稀缺性与便利性带来的“价值感知”'
- '- **项目前置推演** = 出摊前先想清楚：谁会来买？为什么买？我有什么优势？隔壁摊多不多？摊位费多少？'
- '- **六维评估模型** = 给每个摆摊位置做“体检”：产品需求真伪、顾客付费意愿、竞争激烈度、人流规模、我的厨艺、租金成本'
- '- **机会雷达** = 既看自己背包里有什么（技能/资源），也看市场上流行什么（热点/趋势），双向扫描摆摊灵感'
- '- **非品牌忠诚型市场** = 夜市里的小吃摊，顾客只关心好不好吃、快不快，不认招牌，新摊主也能卖爆'
- '- **复制-改良-超越** = 先照着网红摊的菜单做，再根据自家食客的反馈改良配方，最后做出独家招牌'
- '- **项目三棱镜** = 同一个摆摊项目，有人日入千元，有人亏掉本金，还有人被“加盟商”割了韭菜'
- '- **剥开项目外衣** = 所谓“独家秘方加盟”本质上就是普通快餐外包，不是黑科技'
- '- **辛苦钱与资本钱** = 自己守着摊子是辛苦钱；把配方和流程标准化后教别人开店（招商）才是资本钱'
- '- **闭环即正义** = 你的外卖小程序必须让用户下单、支付、收到餐，而不是只给一个跳转链接'
- '- **折扣站生命周期** = 一家店从爆火到因卫生不合规被查封，说明合规是生死线'
- '- **资料索引** = 想看完整攻略，按地图上的标记去图书馆查阅详细教程'
- 就像夜市高手会根据位置、人流和自身手艺动态调整经营策略，副业玩家也需要根据价值逻辑、项目评估和风险边界来做出理性决策。
summary:
- concept: 价值不等价交换
  desc: 赚钱的本质是提供高市场价格的价值，收益大于付出成本即盈利
- concept: 项目前置推演
  desc: 行动前先算清谁付费、为什么付费、价值、成本与竞争逻辑，避免盲目试错
- concept: 六维评估模型
  desc: 从痛点/付费意愿/竞争/规模/个人强项/执行成本六个维度给项目做“全身体检”
- concept: 机会雷达
  desc: 从个人出发与从他人出发双维扫描，让寻找商机从碰运气变成结构化搜索
- concept: 非品牌忠诚型市场
  desc: 用户只看利益不看品牌的市场，是资源有限新人的低门槛切入点
- concept: 复制-改良-超越
  desc: 先像素级复制成熟竞品布局，再用自有数据迭代出差异化功能
- concept: 项目三棱镜
  desc: 同一项目存在盈利、未盈利、被骗三种结局，入场前必须理性评估自身层级
- concept: 剥开项目外衣
  desc: 把包装神秘的项目归因到已知商业模式，才能评估真实天花板与可持续性
- concept: 辛苦钱与资本钱
  desc: 做店赚线性辛苦钱，招商复制模式赚指数资本钱，需建立信任与交付能力
- concept: 闭环即正义
  desc: 私域CPS必须构建“支付-分账-履约”实质性闭环，纯导流必死
- concept: 折扣站生命周期
  desc: 从月入十万到归零的完整复盘，揭示爆点、放大与合规红线的项目全周期
- concept: 资料索引
  desc: 用外部文档索引作为深度研习的藏宝图，教程之外按图索骥
exercises:
- 'no': 1
  title: 用六维评估模型评估一个你关注的副业项目
  contents:
  - 选择一个你近期关注过的副业项目（如闲鱼无货源、小红书带货、私域CPS、短视频剪辑等）。
  - 分别从①解决痛点/满足需求、②用户付费意愿/商业模式、③竞争激烈度/是否赢家通吃、④用户群体规模、⑤个人强项匹配度、⑥执行成本承受力六个维度打分（1-5分）。
  - 回答问题：
  - '- 该项目是否适合资源有限的新人？为什么？'
  - '- 如果某一维度得分很低，你认为可以通过什么方式弥补？'
  - '- 用“剥开项目外衣”法，尝试判断该项目底层属于哪种已知商业模式（联盟营销、中介差价、知识付费等）？'
- 'no': 2
  title: 找到三个“价值不等价交换”的现实案例
  contents:
  - 从生活中找出三个“提供者收获报酬 > 付出成本”的交易场景（例如：一杯咖啡的成本与售价、一次咨询服务的收费、一个软件的使用费）。
  - 对每个案例，分析：
  - '- 提供者提供了什么价值？'
  - '- 为什么接收者愿意支付高价？'
  - '- 中间的“差价”来自哪里（信息差、便利性、情绪价值、稀缺性等）？'
  - 回答问题：
  - '- 如果你要基于“价值不等价交换”启动一个副业，你会选择哪种价值类型？为什么？'
- 'no': 3
  title: 模拟一个海外折扣工具站的完整决策流程
  contents:
  - 假设你想做一个海外折扣信息站，初始预算少于100美元。
  - 用“项目前置推演”列出：谁付费？为什么付费？你提供什么价值？成本结构如何？竞争格局如何？
  - 用“机会雷达（双维分类法）”从个人出发和从他人出发各写出3个可能的切入点。
  - 用“复制-改良-超越”设计一个最小可行方案：你会复制什么？如何获取数据？可能的差异化功能有哪些？
  - 回答问题：
  - '- 如果访问者跳出率高达80%，你会优先分析哪些数据？'
  - '- 你会在哪些方面设置“合规红线”以避免封号风险？'
- 'no': 4
  title: 私域CPS小程序“闭环即正义”诊断
  contents:
  - 假设你运营一个微信小程序，想通过CPS变现。
  - 分别列出三种“有实质性业务”的场景和三种“没有实质性业务”的场景。
  - 回答问题：
  - '- 为什么“只复制口令跳转”的CPS容易被封禁？'
  - '- 如果美团外卖券的常规佣金是6%，而“拼好饭”拉新佣金是7元/人，你会如何设计“超级单品钩子”组合？'
  - '- 如何利用高频刚需业务（如快递寄件）提升用户复购率？'
