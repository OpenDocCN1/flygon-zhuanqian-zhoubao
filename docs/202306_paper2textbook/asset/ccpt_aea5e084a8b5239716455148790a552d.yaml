methods:
- name: __overview__
  desc: 内容运营与分发方法：采用周更频次，通过语雀文档承载，利用分类标签（中括号）、社交互动指标（点赞、精华）构建内容结构，以“请勿外流+邀请进群”的稀缺性营销机制维护社群私域价值。
  excerpt:
  - 每周更新，龙哥风向标另外文档分享。
  - 【中括号】为分类，帖子内含点赞数和是否精华帖，带评论图片等。
  - 请勿外流，防止失效。如果感觉专属群有价值，可以邀请朋友进群。
theorems:
- name: 私域内容稀缺性价值主张
  desc: 核心主张：通过限制传播（请勿外流）和邀请制准入（邀请朋友进群），维护内容的独家性与社群粘性，从而实现知识付费或私域流量的商业闭环。
  excerpt:
  - 请勿外流，防止失效。如果感觉专属群有价值，可以邀请朋友进群。
