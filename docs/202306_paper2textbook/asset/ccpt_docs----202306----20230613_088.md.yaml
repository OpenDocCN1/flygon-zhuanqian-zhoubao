paper: docs/202306/20230613_088.md
desc: 该素材是一篇由亦仁撰写的短文，核心在于区分“做题家”与“出题家”两种思维模式与人生策略，主张普通人应从被动应试的“做题家”转型为主动设定规则的“出题家”，并引用王川等思想者的思维模型（如第一性原理、反脆弱、边际复制成本）作为支撑理论基础。
concepts:
- name: 做题家
  desc: 指在既定规则、固定赛道内通过努力刷题、优化答案以获取标准分/奖励的个体，特征是被动接受规则、路径依赖强、抗风险能力弱。
  is_original: false
  excerpt:
  - 你是做题家还是出题家？
  - 我是做题家，需要多看几遍。
- name: 出题家
  desc: 指能够定义规则、设计赛道、创造标准答案的人，站在更高维度审视问题，掌握话语权与分配权，具备第一性原理思考能力。
  is_original: false
  excerpt:
  - 你是做题家还是出题家？
  - 我喜欢出题者的角度，可以站在更好维度看问题
- name: 思维模型
  desc: 作为出题家核心认知工具的抽象框架，文中引用王川体系中的第一性原理、反脆弱、边际复制成本等具体模型，用于拆解底层逻辑而非表象。
  is_original: false
  excerpt:
  - 其中涉及到的一些名词，例如思维模型，反脆弱，第一性原理，边际复制成本等等，都是经常听到很多大佬提及
- name: 信息即权力
  desc: 亦仁与元璋老师联合直播的主题，隐喻信息不对称的获取与加工能力（即出题家视角）是核心竞争力来源。
  is_original: true
  excerpt:
  - 其中思维模型和反脆弱就在亦仁和元璋老师《信息即权力》直播中提及
methods:
- name: __overview__
  desc: 通过对比两种身份范式（做题家 vs 出题家），引导读者进行自我定位反思，并推荐引入外部高阶思维模型体系（王川体系）进行认知升级。
  excerpt:
  - 你是做题家还是出题家？
  - 配合阅读这篇：你是做题家还是出题家？
  - 又去拜读了王川老师的其他文章
theorems:
- name: 身份决定视界与收益
  desc: 做题家与出题家的本质区别不在于智商勤奋，而在于身份定位：前者在规则内竞争存量，后者在规则外创造增量；普通人应主动完成从做题家到出题家的跃迁。
  excerpt:
  - 你是做题家还是出题家？
  - 我喜欢出题者的角度，可以站在更好维度看问题
- name: 高阶思维模型可迁移性
  desc: 第一性原理、反脆弱、边际复制成本等思维模型具有跨领域通用性，是出题家拆解复杂系统、构建新规则的基础工具包。
  excerpt:
  - 例如思维模型，反脆弱，第一性原理，边际复制成本等等，都是经验听到很多大佬提及
findings:
- name: 读者认知分层现象
  desc: '[evidence] 评论区呈现明显的认知分层：多数人自我认同为做题家（如‘我是做题家，需要多看几遍’），少数人已转型或渴望转型出题家（如‘站在更好维度看问题’），极少数处于迷茫/拒绝定性状态（如‘既不做题也不出题…
    一个普通人’)。'
  excerpt:
  - 我是做题家，需要多看几遍。
  - 我喜欢出题者的角度，可以站在更好维度看问题
  - 既不做题也不出题… 都不配，没有假如，一个普通人。
- name: 知识传播路径验证
  desc: '[evidence] 读者Eilvo的评论证实了‘亦仁 -> 王川’的知识传播链路：读者因亦仁文章引用王川概念，进而主动去拜读王川原著，并将《信息即权力》直播内容与王川体系建立联系，验证了内容生产者（出题家）对受众认知升级的引导作用。'
  excerpt:
  - 读完亦仁这篇文章后，又去拜读了王川老师的其他文章，其中涉及到的一些名词... 估计亦仁也跟王川老师学了不少东西
