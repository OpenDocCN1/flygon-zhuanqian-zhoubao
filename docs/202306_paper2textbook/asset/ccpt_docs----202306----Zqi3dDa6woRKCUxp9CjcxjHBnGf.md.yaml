paper: docs/202306/Zqi3dDa6woRKCUxp9CjcxjHBnGf.md
desc: 该素材是一篇实操教程，介绍如何基于 ChatGPT Retrieval Plugin 与 OpenAI Embedding 模型搭建个人知识库系统，核心主张是利用向量检索技术实现“零整理、按需调用”的第二大脑，解决传统知识管理工具框架僵化、维护成本高的问题，并验证了极低的使用成本（3.7K
  中文字符仅 2 分人民币）。
concepts:
- name: 个人知识库
  desc: 基于大语言模型和向量检索构建的‘第二大脑’，不需要预设分类框架，支持自然语言问答式检索，实现信息的‘零整理存储、语义化调用’。
  is_original: false
  excerpt:
  - 所以我在想，是否存在这样一种方案？既不改变我们现有摄入处理信息的方式，又能在整理信息时帮助我们链接和管理我们历史的知识。
  - 拿来当第二大脑，真的超级适合！并且，通过提问的方式去使用它也非常符合直觉。
- name: 嵌入
  desc: 将自然语言映射为高维向量（如 OpenAI text-embedding-ada-002 的 1536 维），使语义相近的文本在向量空间距离接近，从而让机器理解词义及词间关系。
  is_original: false
  excerpt:
  - 简而言之，嵌入就是一个向量，它是可以被机器理解的数字列表。将自然语言映射成这样的向量，可以帮助机器理解词的含义以及词与词之间的关系。
  - OpenAI 的 text-embedding-ada-002 模型的空间向量有 1536 个维度。因此，在更多维度的加持和上下文的帮助下，它基本上可以准确地检索出我们想要的结果。
- name: 向量数据库
  desc: 以向量为索引存储数据的数据库，支持近似最近邻搜索（ANN），无需精确匹配即可高效检索语义相关的文本块。
  is_original: false
  excerpt:
  - 向量数据库是一种将信息存储为向量或数字数组的数据库。
  - 查询向量不需要与数据库向量完全匹配。数据库引擎可以有效地检索由接近的向量索引的数据。在我们的情况下，它检索的是与你的问题语义相关的块。
- name: ChatGPT Retrieval Plugin
  desc: OpenAI 官方开源插件项目，作为连接 ChatGPT 与个人向量数据库的标准化接口，实现文档向量化入库与自然语言查询检索的完整流程。
  is_original: false
  excerpt:
  - 本教程基于官方的开源项目 ChatGPT-retrieval-plugin
  - 插件会将你的聊天内容分割成查询的词，然后通过 Api 调用 text-embedding-ada-002-v2 模型，将查询词转换成向量，接着去数据库中，查找语义相关的问题区块
methods:
- name: __overview__
  desc: 基于 ChatGPT Retrieval Plugin 的个人知识库构建全流程：文档 -> Embedding 模型向量化 -> 向量数据库存储 ->
    用户提问 -> Query Embedding -> 向量检索 Top-k -> LLM 总结生成答案。
  excerpt:
  - 首先，你需要将你的文档或文本，通过官方的向量映射语言模型转换成向量，并存到向量数据库中。
  - 当你想要检索数据库中的内容时...插件会将你的聊天内容分割成查询的词，然后通过 Api 调用 text-embedding-ada-002-v2 模型，将查询词转换成向量，接着去数据库中，查找语义相关的问题区块，并在查询到结果后，经过整理返回给你
theorems:
- name: 零整理假说
  desc: 大语言模型的语义理解能力使得‘先存储、后整理’成为可能：用户无需在录入时建立分类体系，只需在检索时通过自然语言提问，系统即可基于向量语义相似度精准召回相关知识。
  excerpt:
  - 我们完全可以不必关心整理这一趴，所有的知识点都可以散落一地，我们只在需要它的时候，捡起我想要的。
  - 它可以给你的大脑减负。而那些收藏夹吃灰系列的内容，也有被再度回收利用的可能。
- name: 极低成本可行性
  desc: 基于当前 OpenAI Embedding API 定价，构建和维护中文个人知识库的边际成本极低（实测 3.7K 中文字符仅花费 0.02 元人民币），足以支撑大规模个人知识库的长期运行。
  excerpt:
  - 我在成本上也做了验证... 3.7K 的中文字数，收了 2 分钱，太良心了好吧？
findings:
- name: 语义检索有效性验证
  desc: '[claim] 在 1536 维向量空间中，语义相近文本（如‘猫吃老鼠’与‘猫吃咀嚼型动物’）向量距离显著小于无关文本，嵌入模型能准确捕捉同义、上下位及跨语言表达的语义一致性。'
  excerpt:
  - 比如下面三句话，在二维向量空间中，它们的位置大概如图示中这样👇🏻，其中「猫吃老鼠」、「猫吃咀嚼型动物」和「🐱😋🐭」，在空间中的位置是相近的，而「小吉爱吃鱼」这句话则在空间中位置则相对较远。
- name: 插件检索问答闭环演示
  desc: '[evidence] 实测 ChatGPT Retrieval Plugin 能成功将用户自然语言问题转为向量，从向量库召回相关文档片段，并由 LLM
    综合生成连贯自然语言答案，验证了‘存储-检索-生成’技术链路的完整可行性。'
  excerpt:
  - 运行的最终效果图如上所示...插件会将你的聊天内容分割成查询的词...查找语义相关的问题区块，并在查询到结果后，经过整理返回给你
