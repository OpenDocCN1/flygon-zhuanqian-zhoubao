learning_targets:
- 理解私域流量“精准度优于数量”的底层逻辑，掌握精准找群的核心原则
- 掌握全域精准找群的四大渠道与付费筛选、延迟进群等关键策略
- 能运用微信原生功能搭建零成本私域营销操作系统，构建用户画像与标签体系
- 掌握3+1共进成交法，能独立设计私域成交SOP与裂变机制
- 理解无门槛免费群转付费社群的转型逻辑与关键运营动作
- 掌握公众号矩阵SEO的关键词布局与多平台联合投放策略
- 能区分视频号直播投放中放大器与人货场的关系，建立整体ROI视角
concept_map:
- 私域流量体系构建
- ├── 私域流量获取：精准找群
- │   ├── 核心概念：精准度优于数量、付费筛选、渠道-业务匹配
- │   ├── 四大渠道：微信端 / 内容平台 / 知识付费平台 / 线下实体
- │   ├── 关键方法：关键词搜索、付费入群、延迟进群、换群买群
- │   └── 核心主张：付费即筛选，精准度决定成交率
- ├── 微信原生功能挖掘
- │   ├── 三维分类：聊天（沟通触达）、设置（风控配置）、朋友圈（信任内容）
- │   ├── 关键技巧：单人群知识库、好友三维标签、消息置顶SOP、长按原相机
- │   └── 核心主张：原生功能深度利用即效率倍增器
- ├── 私域成交：3+1共进成交法
- │   ├── 三平台：朋友圈 + 社群 + 公众号
- │   ├── 一方法：解决用户痛点
- │   ├── 支撑机制：事件展示引流、流量承接SOP、水到渠成裂变
- │   └── 核心主张：多触点同步运营，信任构建成交
- ├── 社群运营：免费群转付费社群
- │   ├── 免费群五大顽疾：引流粉污染、低质闲聊、广告泛滥、单向输出、伪活跃
- │   ├── 转型机制：付费门槛筛选、群友共创、大咖背书、精华内容沉淀
- │   └── 核心主张：社群运营是设计组织而非发内容
- ├── 公众号增长：矩阵SEO与多平台投放
- │   ├── 矩阵账号策略：情感号引流、IP号变现
- │   ├── SEO关键词：账号命名、标题/摘要/正文关键词、权重因子
- │   ├── 多平台联合投放：5-6位博主联动、单粉成本≤0.4元、持续复盘
- │   └── 核心主张：流量水池动态平衡，公众号需闭环自救
- └── 视频号直播投放：放大器定位
- '    ├── 投放工具：微信豆（调研-建计划-跟踪）'
- '    ├── 核心心法：整体ROI视角、出价非线性、心智博弈'
- '    ├── 高阶终局：供应链能力、直播场景、资金规模'
- '    └── 核心主张：投放是放大器，人货场才是根本'
life_analogy:
- 想象私域流量运营是**经营一家会员制社区咖啡馆**：
- '- **私域流量池** = 你的咖啡馆，经营的是常客关系而非过路流量'
- '- **精准找群** = 只邀请真正爱喝咖啡、愿意付费的邻居进店，而不是在门口对所有人发传单'
- '- **付费筛选** = 会员卡，愿意为入会付费的人才会珍惜座位、常来常往'
- '- **微信原生功能** = 咖啡馆的桌椅、吧台和账本，用最基础的设施就能把店经营得井井有条'
- '- **3+1共进成交法** = 在店内海报、社群公告、公众号推文三个窗口同步亮出你的招牌产品，让熟客都知道你在做什么'
- '- **视频号直播投放** = 在店门口花钱放一块广告牌，但前提是咖啡好喝、环境舒适（人货场），否则广告牌只能放大你的冷清'
- '- **公众号SEO** = 给咖啡馆起一个自带“附近咖啡”关键词的名字，让地图App的搜索结果主动把你推荐给有需要的人'
- 就像经营咖啡馆要先留得住老客再谈拉新，私域流量运营必须先建立信任，再通过多触点同步输出实现转化。
summary:
- concept: 精准找群
  desc: 基于用户画像和业务属性，通过渠道匹配获取高意向微信群资源，而非泛流量。
- concept: 渠道-业务匹配原则
  desc: 线上业务聚焦微信端/内容平台/知识付费，线下业务聚焦实体场景与换群裂变。
- concept: 付费筛选机制
  desc: 付费门槛是用户质量最强信号，天然过滤免费党，留存高付费意愿核心用户。
- concept: 延迟进群策略
  desc: 加微信后先经营朋友圈建立信任，等待自然拉群，避免广告号标签。
- concept: 线下群裂变模型
  desc: 通过换群/买群的红包激励机制，指数级扩充本地同城精准群矩阵。
- concept: 微信原生功能挖掘
  desc: 深度利用聊天/设置/朋友圈基础功能，零成本搭建私域营销操作系统。
- concept: 好友三维标签体系
  desc: 备注-标签-描述构成用户画像结构，支撑标签化精准群发与分层运营。
- concept: 单人群
  desc: 仅含自己的微信群，作为私有化云端收藏夹、资料库和待办清单。
- concept: 3+1共进成交法
  desc: 朋友圈+社群+公众号三平台同步运营，配合解决用户痛点，多触点构建信任完成成交。
- concept: 事件展示引流
  desc: 展示真实成绩/经验/踩坑，以价值参考性吸引精准流量主动添加微信。
- concept: 流量承接SOP
  desc: 5大主动链接节点的标准化动作，确保流量不流失并逐步深化关系。
- concept: 水到渠成裂变法
  desc: 分销佣金+主动服务高意向用户，驱动自然裂变与复购，实现低转高。
- concept: 免费群转付费社群
  desc: 通过付费门槛过滤低质用户，将无门槛群重构为高粘性、可变现的付费社群。
- concept: 群友共创与大咖背书
  desc: 邀请成员分享、引入专家讲座，解决群主单向输出精疲力竭，提升内容密度。
- concept: 公众号矩阵账号策略
  desc: 情感号负责引流获取泛流量，IP号负责变现沉淀精准粉丝，分离职能破解双难。
- concept: 公众号SEO关键词布局
  desc: 账号命名挂载热门长尾词，文章标题/摘要/正文自然植入，获取长尾搜索流量。
- concept: 多平台联合投放
  desc: 联合5-6位垂类博主同步投放，单粉成本控制在0.3-0.4元，以数据复盘驱动增长。
- concept: 视频号直播投放
  desc: 在人货场跑通基础上用微信豆放大效果，是锦上添花的放大器而非决定性因素。
- concept: 整体ROI视角
  desc: 不看单条计划ROI，通盘考量整体投放ROI与成交额量级，追求规模化收益。
- concept: 投放心智博弈
  desc: 投放是认知与心理素质的竞争，需胆大心细、持续实战复盘适应算法变化。
- concept: 供应链终局论
  desc: 投放技术趋同后，最终比拼品牌供应链能力、直播场景打造能力与资金规模。
exercises:
- 'no': 1
  title: 精准找群实战方案设计
  contents:
  - 假设你是一名线上理财课程创作者，目标用户是25-35岁有理财意识的白领，客单价299元。
  - 请完成以下实操任务：
  - 1. 描述你的目标用户画像（至少3个维度）；
  - 2. 从四大找群渠道中选择两个最适合此业务的渠道，并写出每渠道3个具体动作；
  - 3. 设计一段添加好友时的“延迟进群”话术（非直接要群）；
  - 4. 设计两个判断微信群质量的关键指标。
  - 回答问题：为什么“精准流量100人”的价值大于“泛流量1000人”？
- 'no': 2
  title: 用微信原生功能搭建私域CRM
  contents:
  - 请打开你的微信，尝试完成以下操作并记录步骤：
  - 1. 创建一个“单人群”（仅含自己），将它命名为“素材库-2024”，保存3条你最近收藏的干货链接；
  - 2. 选择你身边3位好友，为他们分别设置“备注-标签-描述”三维标签，标签需体现群体属性（如“高意向-理财课”）；
  - 3. 利用消息置顶功能，在一个群中设计一条“新人引导+核心价值+时效活动”的置顶消息；
  - 4. 用标签筛选功能，建立1个少于200人的群发池，写出群发内容的预编辑模板。
  - 回答问题：微信单次群发200人上限，会如何影响你的标签体系设计？
- 'no': 3
  title: 3+1共进成交法实战模拟
  contents:
  - 假设你刚完成一次“小红书0粉到1000粉”的实战，现在要通过3+1共进法引流卖你的陪伴社群（价格99元/年）。
  - 请完成以下设计：
  - 1. 写一条朋友圈文案（包含成绩展示+痛点共鸣+行动引导）；
  - 2. 写一段社群分享的开场白（用于吸引群友主动加你）；
  - 3. 写一个公众号文章标题及摘要（嵌入关键词）；
  - 4. 列出你会在哪5个节点主动链接潜在用户；
  - 5. 设计一个分销激励规则（金额+触发条件）。
  - 回答问题：为什么“解决用户痛点”是三平台同步的核心连接点？
- 'no': 4
  title: 免费群转付费社群策划方案
  contents:
  - 选择一个你所在或熟悉的免费微信群（如小区团购群、学习打卡群、装修交流群），观察其现状后完成：
  - 1. 诊断该群存在的免费群顽疾（至少3条，并结合观察到的现象）；
  - 2. 设计付费社群的定位（一句话）、年费区间和入群首月权益清单；
  - 3. 设计“群友共创”计划：如何邀请3位成员做主题分享？分享主题方向是什么？
  - 4. 设计“精华内容结构化沉淀”方式（用什么工具？如何分模块？）。
  - 回答问题：付费门槛为什么能倒逼运营者提升交付质量？
- 'no': 5
  title: 公众号矩阵SEO与联合投放计划
  contents:
  - 假设你要做“个人成长类”公众号矩阵，包含1个情感引流号和1个IP变现号。
  - 请完成以下任务：
  - 1. 为情感号设计3个含热门关键词且简短的账号昵称；
  - 2. 写一篇热点文章（主题自拟）的标题和摘要，列出2个需要植入的搜索关键词；
  - 3. 列出提升账号权重的5个具体动作；
  - 4. 设计一个多平台投放复盘表的字段（至少6列）。
  - 回答问题：为什么原创认证是文章搜索排名的最重要因素？
- 'no': 6
  title: 视频号直播投放整体ROI计划
  contents:
  - 假设你已跑通“高客单女装直播间”的人货场，现计划用微信豆投放放大。请你：
  - 1. 设定3天投放总预算并给出分配逻辑；
  - 2. 写出“学习期不动如山”原则的执行要点；
  - 3. 设计一份投后复盘表，包含整体ROI、成交额、曝光进入率、商品点击率、点击成交率；
  - 4. 根据供应链终局论，写出你会在哪三项能力上做长期投入。
  - 回答问题：为什么单条计划ROI低但整体成交额高可能是好现象？
