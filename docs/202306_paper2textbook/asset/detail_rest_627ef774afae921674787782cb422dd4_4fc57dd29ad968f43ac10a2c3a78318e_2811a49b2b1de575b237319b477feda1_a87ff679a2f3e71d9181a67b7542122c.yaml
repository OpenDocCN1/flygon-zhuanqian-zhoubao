learning_targets:
- 理解电子产品套利通过百亿补贴价差获利的核心逻辑
- 掌握利润测算法与单品选品风险控制方法
- 理解账号权重、黑号状态与养号恢复机制
- 掌握实体商业“选址决定自然流量上限”的底层逻辑
- 掌握百度热力图、竞品侦察等选址风向标工具组合
- 理解预售覆盖成本模型与情绪价值型成人教育定位
- 理解低粉高变现模式与同城精准流量的转化逻辑
concept_map:
- 电子产品套利
- ├── 商业核心：百亿补贴价差 —— docs/202306/20230613_079.md
- ├── 操作方法：利润测算法 —— 单品利润=回收商报价-补贴实付金额
- ├── 操作方法：避坑选品策略 —— 优先官方旗舰店/有交易记录店铺 —— docs/202306/20230613_079.md
- ├── 风险机制：平台风控必然性定律 —— 薅羊毛低价值账号必被限流 —— docs/202306/20230613_079.md
- ├── 风险机制：账号黑号状态 —— 有利润商品显示无货/排队 —— docs/202306/20230613_079.md
- └── 恢复机制：养号 —— 正常下单好评恢复权重 —— docs/202306/20230613_079.md
- 实体商业选址
- ├── 核心定律：选址>营销 —— 自然流量曝光为核心护城河 —— docs/202306/20230613_252.md
- ├── 选址方法：百度热力图+同业拦截+消费实力判断+楼盘情报 —— docs/202306/20230613_294.md
- ├── 选址方法：竞品垃圾箱选品法 —— 反推客群真实偏好 —— docs/202306/20230613_294.md
- ├── 成本诊断：进店-购买转化漏斗模型 —— 进店少为选址问题，进店多买少为选品定价问题 —— docs/202306/20230613_294.md
- ├── 商业模型：预售覆盖成本模型 —— 限量预售回笼现金流覆盖运营成本 —— docs/202306/20230613_252.md
- ├── 商业模型：情绪价值型成人教育 —— 售卖社交货币而非纯技能 —— docs/202306/20230613_252.md
- └── 商业模型：体验差异化竞争 —— 门店环境与隐私即护城河 —— docs/202306/20230613_295.md
- 低粉高变现
- ├── 核心逻辑：同城精准流量商业价值远高于泛娱乐流量 —— docs/202306/20230613_289.md
- ├── 建设方法：账号四件套 —— 昵称/头像/简介/背景图 —— docs/202306/20230613_289.md
- ├── 生产方法：五维内容矩阵 —— 作品/本地攻略/技巧/活动/器材 —— docs/202306/20230613_289.md
- └── 转化方法：引流钩子 —— 公域转私域的关键环节 —— docs/202306/20230613_289.md
life_analogy:
- 想象电子产品套利是一个**限时清仓贩卖中介**：
- '- **百亿补贴** = 商场突然贴出的超低价标签'
- '- **回收商报价** = 你早就谈好的高价回收底价'
- '- **价差** = 你口袋里直接进账的利润'
- '- **黑号** = 因为只买打折货不消费，被商场拉黑进店'
- '- **养号** = 平时正常买点生活用品，恢复进店资格'
- 就像奶牛客需要平时正常消费才能在清仓时抢到利润款，电商平台也需要账号权重正常才能下单高利润商品。
summary:
- concept: 电子产品套利
  desc: 利用电商平台百亿补贴价格低于二手回收价的正向价差赚取差价
- concept: 利润测算法
  desc: 单品利润 = 回收商报价 - 补贴实付金额，如iPhone 14 Pro Max单笔可赚500元
- concept: 黑号/养号
  desc: 账号被风控后高利润商品无法下单，需正常消费好评恢复权重
- concept: 选址>营销定律
  desc: 实体商业成败核心在于物理位置带来的自然流量，营销只能优化转化
- concept: 选址风向标工具包
  desc: 百度热力图+竞品侦察+消费实力判断+楼盘情报的组合拳
- concept: 预售覆盖成本模型
  desc: 开业前通过限量预售回笼现金流，覆盖装修房租等运营成本
- concept: 情绪价值型成人教育
  desc: 成人舞蹈培训核心售卖社交、解压、打卡等情绪价值而非纯技能
- concept: 低粉高变现
  desc: 千粉量级下通过精准定位和高客单价服务实现可观收入
- concept: 体验差异化竞争
  desc: 产品同质化下，门店环境与隐私体验即核心护城河
exercises:
- 'no': 1
  title: 手算一次电子产品套利利润
  contents:
  - 给定某款手机：回收商回收价 8500 元，京东百亿补贴实付价 8000 元，运费与耗材成本 50 元：
  - 1. 计算毛利润
  - 2. 扣除运费耗材后得到净利润
  - 3. 若资金占用 9000 元，周转周期为一周，计算年化收益率（近似）
  - 回答问题：
  - '- 若该账号被标记为“黑号”，在购买该款手机时会显示什么现象？'
  - '- 为什么不建议直接购买非官方旗舰店的补贴商品？'
- 'no': 2
  title: 实体店选址诊断与漏斗拆解
  contents:
  - 某成人用品无人店近30天进店人数约200人，购买人数为8人，平均客单价120元：
  - 1. 计算转化率
  - 2. 计算月营收（假设每天进店人数固定）
  - 3. 若目标月流水1万元，分析是提升进店人数还是提升转化率更现实
  - 回答问题：
  - '- 若进店人数少于每日5人，根据转化漏斗模型，问题主要出在哪个环节？'
  - '- 若进店人数充足但购买人数极少，可能涉及哪两个运营变量？'
- 'no': 3
  title: 预售覆盖成本模型设计
  contents:
  - 某新开舞蹈工作室，装修房租等开业成本共计 60 万元，计划推出年卡产品，单价 7180 元：
  - 1. 计算至少需要售出多少张年卡才能覆盖全部成本
  - 2. 若设定限量席位为 50 张，预售是否能覆盖全部成本？若不能，缺口是多少？
  - 3. 设计一条能制造稀缺感的预售海报文案要点（不给具体文案，只给要点）
  - 回答问题：
  - '- 为什么预售模式能降低新店开业的现金流风险？'
  - '- 若开业后第3个月出现亏损，根据本章逻辑，首先应排查哪个前置条件（选址/选品/营销）？'
