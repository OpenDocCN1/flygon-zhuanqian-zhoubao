learning_targets:
- 理解闲鱼无货源的信息差本质与“搬运工→系统设计者”的进化路径
- 掌握账号冷启动、选品测款与高转化发布八步法的标准化 SOP
- 学会运用全自动化系统与 AI 辅助开发降低机械操作成本
- 掌握公私域联动与 LTV 最大化的用户资产沉淀方法
- 能捕捉趋势信号并完成垂直聚焦，发现“小蓝海”机会
- 识别中间商模式的风控红线与项目生命周期局限
concept_map:
- 闲鱼无货源实战
- ├── 商业本质与核心矛盾
- │   ├── 信息差 + 供应链整合赚差价 —— 无货源模式
- │   ├── 机械重复操作占比 90%+ —— 倒逼系统化
- │   └── 核心主张：从“搬运工”进化为“系统设计者”
- ├── 账号冷启动与养号
- │   ├── 实名认证 + 芝麻信用 + 资料完善
- │   ├── 每日模拟真人行为 30 分钟 / 3-7 天
- │   └── IP/设备隔离 —— 降低违规风险
- ├── 选品测款闭环
- │   ├── 多源挖掘：闲鱼热搜 / 拼多多榜单 / 1688 新品 / 竞品
- │   ├── 硬指标筛选：成交>50 / 同款<20 / 利润>15 元 / 非强管控
- │   ├── 差异化上架测试：日更 3-5 款
- │   └── 48 小时复盘：曝光<100 下架，想要>5 优化留存
- ├── 高转化发布八步法
- │   ├── 主图视觉锤
- │   │   ├── 留白构图 —— 让特点被看见
- │   │   ├── 合集全貌 —— 提升客单价
- │   │   └── 堆头实拍 —— 传递供应链实力
- │   ├── 销量动态管理
- │   │   ├── 冷启动：闲鱼币折扣遮挡低想要数
- │   │   └── 爆款期：取消折扣展示高销量
- │   ├── 文案信任锚定
- │   │   ├── 出手理由场景化（撤股周转 / 航海实操）
- │   │   └── 同样卖东西，不同表达不同效果
- │   ├── 合规低价引流
- │   │   ├── 双规格（精装/简装）标最低价
- │   │   └── 价费分离（低商品价+高运费）
- │   ├── 痛点前置标题
- │   ├── 标签强化搜索
- │   ├── 大城市发货地套利
- │   └── 圈子分流精准流量
- ├── 技术杠杆与自动化
- │   ├── 全自动化运营系统
- │   │   ├── 批量上书（SKU 管理）
- │   │   ├── 跨平台订单履约（闲鱼↔孔夫子）
- │   │   ├── 多渠道消息聚合推送
- │   │   ├── 批量加价曝光
- │   │   └── 黑名单去重合规
- │   ├── AI 辅助开发
- │   │   ├── ChatGPT 生成浏览器插件
- │   │   └── 表单固定模板自动化 + 禁书检测
- │   └── 核心主张：工具即产品，用爽再给钱
- ├── 私域沉淀与 LTV 最大化
- │   ├── 被动引流：主页签名 / 自动回复钩子
- │   ├── 主动引流：发货卡片 / 售后群 / 延保
- │   ├── 群运营：福利单 / 清仓单
- │   └── 朋友圈人设：发货实拍 / 好评 / 干货
- ├── 进阶策略
- │   ├── 趋势捕捉与垂直聚焦
- │   │   ├── 露营经济风向标 -> 小蓝海
- │   │   ├── 存量能力 + 增量趋势 = 爆发
- │   │   └── 季节窗口把控（春夏）
- │   └── 福利卡券中间商模式
- │       ├── 种子用户裂变（国企员工扩散）
- │       ├── 上下游谈判压价/抬价
- │       ├── 卡券实物套利（手机/黄金）
- │       └── 首单垫资测试 + 上游先打款风控
- ├── 生命周期与风控
- │   ├── 试错-深耕双周期
- │   │   ├── 前期：多项目试错筛选
- │   │   └── 后期：单一赛道深耕复利
- │   ├── 渠道易复制 -> 利润衰减
- │   ├── 平台风控 / 红利窗口期
- │   └── 出版物经营许可证（合规前置）
- └── 实战数据验证
- '    ├── 2 年副业 30W+'
- '    ├── 露营单日峰值 4000+，稳定月入 1.5W+'
- '    └── 福利卡券单日 5000，累计 7W+'
life_analogy:
- 想象闲鱼无货源是一座**线上虚拟杂货铺**：
- '- **养号** = 先把店铺信誉分养起来，让平台愿意给你推荐顾客'
- '- **选品测款** = 少量进货试摆，看哪个商品有人问再重点补货'
- '- **主图** = 店铺门头和橱窗，第一眼决定顾客进不进来'
- '- **想要数** = 门口排队的“围观人数”，人多会吸引更多人'
- '- **出手理由** = 贴出“店主急转、清仓处理”的真实告示，打消顾虑'
- '- **自动发货** = 雇了个不会累的伙计，接单、下单、填单号全自动'
- '- **私域沉淀** = 把买过的顾客拉进会员群，有新品让他们先挑'
- '- **垂直聚焦** = 夏天露营热，就把整家店改成“露营装备专营店”'
- 就像开实体店要同时管好门面、货源、口碑和熟客，闲鱼无货源也需要一套从曝光到复购的系统打法。
summary:
- concept: 闲鱼无货源模式
  desc: 无需囤货，利用信息差和供应链代发赚差价，核心是选品与履约的标准化。
- concept: 信息差
  desc: 价格不透明 = 定价权 = 高利润，非标品比标品更容易获取超额收益。
- concept: 养号
  desc: 通过模拟真人行为提升账号权重与信用，降低违规风险，是冷启动前置动作。
- concept: 选品测款
  desc: 多源挖掘 + 硬指标筛选 + 48 小时数据复盘的低成本试错闭环。
- concept: 主图视觉锤
  desc: 留白、合集、堆头三种构图让商品特点在第一眼被看见，决定点击率。
- concept: 销量动态管理
  desc: 冷启动期用闲鱼币折扣遮挡低想要数，爆款期取消折扣展示从众优势。
- concept: 出手理由
  desc: 场景化文案锚定信任，用真实故事替代通用促销话术，化解来源顾虑。
- concept: 合规低价引流
  desc: 通过双规格或价费分离实现低价引流，同时不触发平台虚假低价判定。
- concept: 全自动化运营系统
  desc: 批量上书、跨平台履约、聚合消息、黑名单去重，释放 90% 机械操作。
- concept: AI 辅助开发
  desc: ChatGPT 生成浏览器插件，将固定模板表单自动化，降低开发门槛。
- concept: 私域引流与 LTV
  desc: 公域流量沉淀私域，通过信任运营实现复购和高客单价转化，最大化用户终身价值。
- concept: 趋势垂直聚焦
  desc: 存量能力 + 增量趋势耦合，在“小蓝海”垂直品类中实现利润跃迁。
- concept: 福利卡券中间商
  desc: 种子用户裂变 + 上下游谈判，利用福利变现的信息差赚取差价。
- concept: 风控红线
  desc: 首单垫资测试、要求上游先打款、渠道易复制导致利润衰减，是中间商模式的生命周期铁律。
- concept: 试错-深耕双周期
  desc: 副业必经多项目试错筛选与单一赛道深耕复利两个阶段，正反馈是坚持关键。
- concept: 出版物许可证
  desc: 闲鱼卖书的前置合规资质，属于业务启动前必须完成的动作。
exercises:
- 'no': 1
  title: 选品筛选实战
  contents:
  - 给定以下候选商品数据：
  - A：近30天成交 120 单，同款在售 15 家，利润 22 元，普通品牌
  - B：近30天成交 80 单，同款在售 30 家，利润 10 元，普通品牌
  - C：近30天成交 30 单，同款在售 3 家，利润 60 元，品牌强管控
  - D：近30天成交 200 单，同款在售 8 家，利润 18 元，普通品牌
  - 1. 应用硬指标筛选标准（成交>50、同款<20、利润>15元、非强管控），判断哪些商品值得上架测试。
  - 2. 对通过筛选的商品，制定一个为期一周的上架测试计划（日更数量、观察指标）。
  - 3. 如果某商品 48 小时曝光仅有 80，你会如何决策？依据是什么？
- 'no': 2
  title: 主图与销量动态管理方案设计
  contents:
  - 假设你正在闲鱼发布一本二手书《金字塔原理》，当前为全新链接、0 想要数：
  - 1. 设计三种主图构图方案，并分别说明它们适用的场景（单品留白 / 合集全貌 / 堆头实拍）。
  - 2. 写出闲鱼币折扣的开启时机和取消时机，并解释背后的买家心理。
  - 3. 当链接累计卖出 300 本后，你应该如何调整销量展示策略？为什么？
- 'no': 3
  title: 自动化需求拆解与 AI 提示词设计
  contents:
  - 1. 列举闲鱼二手书发布流程中至少 5 个可自动化的固定模板步骤。
  - 2. 设计一个 ChatGPT 提示词，让 AI 帮你生成一个浏览器插件的代码框架（输入：插件功能描述；输出：manifest.json / HTML /
    JS 的骨架）。
  - 3. 如果你不具备编程能力，还有哪些替代工具或人工流程可以达到相近的提效效果？
- 'no': 4
  title: 私域引流路径设计
  contents:
  - 设计一条从“闲鱼成交后”到“微信私域”的完整转化路径：
  - 1. 写出至少两个引流钩子，一个偏被动（主页/自动回复），一个偏主动（发货后触达）。
  - 2. 设计一张发货卡片上的话术文案，要求合规且能引导用户添加微信。
  - 3. 用户进入私域后，如何通过群运营和朋友圈人设实现分层运营，最终提升 LTV？
- 'no': 5
  title: 福利卡券中间商模拟
  contents:
  - 假设某家一万人的国企向每位员工发放了 500 元京东卡，大量员工希望折现：
  - 1. 设计一套“种子用户裂变”方案：你如何找到第一位种子用户？如何激励他帮你扩散？
  - 2. 列出与上游回收商谈判的三个关键动作，并说明每个动作的目的。
  - 3. 识别该模式至少两条风控红线，并为每条写出具体的应对措施。
- 'no': 6
  title: 副业路径规划：从试错到深耕
  contents:
  - 假设你有 6 个月的业余时间，准备从零开始做副业：
  - 1. 根据“试错-深耕双周期”理论，制定一份包含“试错筛选期”和“深耕复利期”的计划。
  - 2. 设定至少三个正反馈里程碑（例如：第1单、日出10单、月利润达标），并说明每个里程碑的意义。
  - 3. 如果你同时看中了 3 个项目，如何防止“多项目浅尝辄止”陷阱？写出你的决策规则。
