paper: docs/202306/DdLvdWpB9o0D0cxXOjSc1YdznPd.md
desc: 该素材是一篇关于使用后羿采集器从蝉小红平台采集小红书电商品类数据的实操教程。文章详细记录了从前置条件准备（开通蝉小红会员、下载安装采集器）、目标页面定位（品类库/商品库）、采集器配置（预登录、执行预操作处理动态筛选、瀑布流分页设置、采集范围设定）、启动采集、数据导出，到数据清洗与分析（处理带'w'单位字段、计算互动笔记比识别蓝海品类）的全流程。核心贡献在于提供了一套针对蝉小红反爬/动态加载特性的配置方法论，以及一套基于Excel公式的电商选品数据分析模型。
concepts:
- name: 蝉小红品类库/商品库
  desc: 蝉小红平台提供的核心数据入口，分别汇总小红书电商各品类的聚合指标（笔记数、互动量等）及单品商品数据，是选品分析的数据源头。
  is_original: false
  excerpt:
  - 做电商数据分析，我们一般关心的是这2个页面：品类，和商品
  - 品类库链接：https://www.chanxiaohong.com/categoryLib
  - 商品库链接：https://www.chanxiaohong.com/goodsLib
- name: 后羿采集器预登陆机制
  desc: 后羿采集器针对需登录态网站提供的内置功能，通过弹出真实浏览器窗口供用户手动完成登录（含验证码、二维码等），随后将Cookie同步回采集器内核，实现有状态采集。
  is_original: false
  excerpt:
  - 因为这时在后羿采集器中还没有登录蝉小红，需要登录。点击“预登陆”按钮
  - 会弹出新的页面，在新的页面进行登录。登录完成后，点击“登录完成”按钮
- name: 执行预操作
  desc: 后羿采集器的核心功能之一，允许在正式采集前录制一系列人工交互动作（点击、输入、下拉等），用于触发动态渲染、切换Tab、选择时间范围等，解决采集器无法直接操作页面动态元素的问题。
  is_original: false
  excerpt:
  - 所以，需要点击“执行预操作”按钮
  - 比如我们想选择30天，则，先点击一下30天，点击后，左上角会出现2条操作... 我们直接点击“点击一次该元素”
  - 这就意味着，后羿采集器在采集之前，会自动点击一下这里，选择30天
- name: 瀑布流分页
  desc: 后羿采集器针对无限滚动加载（Infinite Scroll）页面的分页模式，通过模拟鼠标向下滑动触发懒加载，在单页URL不变的情况下采集全部数据。
  is_original: false
  excerpt:
  - 然后我们点击“分页设置”这里的下拉箭头，把“瀑布流分页”选上。这是模拟鼠标下滑动作，在同一页加载更多数据
- name: 万单位字段规范化
  desc: 针对中文数据报表中常见的'万'字符（如'9.9w'）导致无法直接数值排序计算的问题，通过Excel公式提取数值部分并乘以10000转换为纯数值的标准化处理方法。
  is_original: true
  excerpt:
  - 采集到的数据有9.9w，带一个w，表示单位是万，但是有些是不带w的，这个w字母会影响我们进行排序
  - 在E列的第一行，填入如下公式：=IF(ISNUMBER(SEARCH("w",C1)),LEFT(C1,LEN(C1)-1)*10000,C1)
- name: 互动笔记比
  desc: 素材原创提出的选品评估指标，计算公式为：品类总互动量 / 品类笔记数。该指标用于量化品类的'供需比'：值越大表示用户需求强（互动高）且供给少（笔记少），即竞争小、机会大（蓝海）；值越小则竞争激烈（红海）。
  is_original: true
  excerpt:
  - 然后我们在I列，加一个公式，用每个品类的互动数量（F列）除以笔记数量（E列），得到一个比值
  - 这个比值代表着该品类的竞争程度... 如果互动数量除以笔记数量的结果，越大，等同于做的人少，需求大。这个值越小说明竞争越激烈
methods:
- name: __overview__
  desc: 蝉小红电商数据全流程采集分析法：目标锁定（品类/商品库） -> 采集器配置（预登陆+预操作录制动态筛选+瀑布流分页） -> 批量采集导出 -> Excel数据清洗（万单位转数值）
    -> 核心指标建模（互动笔记比） -> 排序筛选蓝海品类。
  excerpt:
  - 前置条件... 采集过程... 配置采集器页面... 开始采集... 数据导出... 数据查看与分析
- name: 动态时间范围选择配置法
  desc: 针对采集器无法直接点击页面下拉菜单/Tab切换的问题，利用'执行预操作'功能录制'点击目标时间选项(如30天)'的动作，生成自动化预处理流程，确保采集时刻页面状态符合预期。
  excerpt:
  - 在后羿采集器的设置页面，是无法直接点击的... 需要点击“执行预操作”按钮
  - 先点击一下30天... 点击“点击一次该元素”... 左下角的流程图中，出现了一次点击操作
- name: 万字符字段Excel清洗法
  desc: 使用公式 =IF(ISNUMBER(SEARCH("w",单元格)), LEFT(单元格, LEN(单元格)-1)*10000, 单元格) 兼容处理带'w'与不带'w'的混合列，统一转换为数值型数据，支持后续排序、四则运算。
  excerpt:
  - 在E列的第一行，填入如下公式：=IF(ISNUMBER(SEARCH("w",C1)),LEFT(C1,LEN(C1)-1)*10000,C1)
  - 同理，在F列第一行填入如下公式：=IF(ISNUMBER(SEARCH("w",D1)),LEFT(D1,LEN(D1)-1)*10000,D1)
- name: 蓝海品类筛选模型
  desc: 基于'互动笔记比'指标的降序排序筛选法。通过计算 总互动量/笔记数 并由大到小排序，顶部即为高需求低供给的蓝海品类（如文中案例中的婴儿油、课桌椅、悠悠球）。
  excerpt:
  - 对I列数据按从大到小排序
  - 可以看到婴儿油，课桌椅，悠悠球，这几个品类，在过去30天，是用户兴趣够大，但是笔记数量较少的。可以考虑这样的品类
theorems:
- name: 蝉小红数据采集可行性原则
  desc: 蝉小红作为数据聚合平台，其前端渲染的列表页数据可通过模拟浏览器行为（登录态维持、动态交互触发、无限滚动加载）实现全量结构化采集，无需破解接口加密。
  excerpt:
  - 通过后羿采集器的强大数据收集能力，配合蝉小红的数据，可以对小红书电商各个品类的数据进行深度分析
  - 采集总共要大概15分钟时间... 采集完成后，会弹出如下页面。点击“导出数据”
- name: 互动笔记比反映品类竞争度定理
  desc: 在内容电商生态中，品类维度的 '总互动量 / 笔记数' 比值正相关于市场机会：分子反映用户真实需求强度，分母反映商家入局供给量；比值高 = 需求强/供给弱
    = 低竞争高机会（蓝海）。
  excerpt:
  - 这个比值代表着该品类的竞争程度。一个品类笔记越多，等于做的人越多。互动数量越多，代表用户兴趣越大。
  - 如果互动数量除以笔记数量的结果，越大，等同于做的人少，需求大。这个值越小说明竞争越激烈。
findings:
- name: 采集器导出进度条卡死兼容性问题
  desc: '[claim] 后羿采集器导出数据时进度条卡在10.001%属于特定电脑环境兼容性问题，而非软件通用Bug。[evidence] 作者两台电脑均复现该问题，更换第三台电脑即解决，推测为初始软件环境冲突。'
  excerpt:
  - 我有2台电脑都出现这个问题。换一台电脑好了。可能是电脑中安装的初始软件的不兼容。遇到这个问题，换个电脑试试。
- name: 品类库全量采集耗时基准
  desc: '[evidence] 蝉小红品类库约2450个品类数据，使用后羿采集器瀑布流分页模式全量采集，耗时约15分钟。'
  excerpt:
  - 在蝉小红中的品类这个页面，一共提供了2450个品类的数据，采集总共要大概15分钟时间。
- name: 蓝海品类实证案例
  desc: '[evidence] 基于30天周期数据计算互动笔记比并降序排序后，婴儿油、课桌椅、悠悠球位列前茅，验证了该指标在发掘''高需求低竞争''细分品类上的有效性。'
  excerpt:
  - 可以看到婴儿油，课桌椅，悠悠球，这几个品类，在过去30天，是用户兴趣够大，但是笔记数量较少的。可以考虑这样的品类。
