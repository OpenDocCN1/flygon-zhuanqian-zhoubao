'no': 1
name: 副业实战方法论 —— 从“盲目试错”到“确定性变现”
desc: 本章汇聚生财有术社群多位实战者的从0到1复盘，拆解新人如何通过优势匹配、极速闭环、工具杠杆、社群杠杆，将副业从概率游戏转化为可复制的确定性路径。
nodes:
- 'no': 1
  name: 新人副业的核心困境：认知与执行的双重鸿沟
  desc: 揭示新人易陷入‘懂得很多却做不好’的根因：SOP无法覆盖隐性操作知识（如养号机制），且缺乏正向反馈支撑长期行动。
  role: motivation
  src:
  - paper: docs/202306/20230613_016.md
  - paper: docs/202306/20230613_169.md
- 'no': 2
  name: 优势-项目匹配度：降低试错成本的战略锚点
  desc: 主张新人入场前必须盘点技能、资源、性格偏好，选择高匹配度赛道（如程序员选AI写作、非技术选内容运营），避免在弱项领域硬碰硬。
  role: method
  src:
  - paper: docs/202306/20230613_016.md
  - paper: docs/202306/20230613_011.md
- 'no': 3
  name: 极速闭环与最小可行性验证：用最低成本跑通‘获客-转化-交付’
  desc: 不追求完美，先用人工/半自动跑通首单，验证付费意愿后再投入自动化开发；将‘失败’重构为‘提炼隐性知识’的必要学费。
  role: method
  src:
  - paper: docs/202306/20230613_016.md
  - paper: docs/202306/20230613_011.md
  - paper: docs/202306/20230613_169.md
- 'no': 4
  name: 技术杠杆与工具链：从‘赚辛苦钱’到‘赚规模钱’的放大器
  desc: 拥有编程/自动化能力的个体，可将验证可行的流程标准化为代码/RPA/AI工作流（如多账号矩阵、AI绘图、自动发货），实现指数级扩张，构建技术护城河。
  role: method
  src:
  - paper: docs/202306/20230613_016.md
  - paper: docs/202306/20230613_011.md
  - paper: docs/202306/20230613_013.md
- 'no': 5
  name: 社群杠杆：隐性知识显性化与情感支撑系统的双重保障
  desc: 高质量社群通过精华帖、航海手册、领队陪跑将高手经验显性化，降低认知门槛；同时提供正向情感反馈（鼓励、红包、指导）对冲挫败感，构建持续行动的心理安全网。
  role: method
  src:
  - paper: docs/202306/20230613_016.md
  - paper: docs/202306/20230613_169.md
  - paper: docs/202306/20230613_012.md
- 'no': 6
  name: 公私域联动变现模型：精准流量入口+标准化转化+自动化交付
  desc: 以公域平台（公众号/小红书/抖音/外卖平台）为流量入口，通过‘钩子’筛选高意向用户沉淀私域，再经标准化SOP话术与自动化交付系统完成高客单价转化。
  role: method
  src:
  - paper: docs/202306/20230613_011.md
  - paper: docs/202306/20230613_016.md
  - paper: docs/202306/20230613_142.md
  - paper: docs/202306/20230627_048.md
- 'no': 7
  name: 蓝海定位与信息差挖掘：在红海中另辟蹊径的战术指南针
  desc: 通过非标准化渠道（百度下拉框、竞品负面评价、知乎冷门问题、风向标信息）挖掘‘搜索量低但付费意愿强、竞争弱’的长尾需求，或利用平台视角反推操作边界。
  role: method
  src:
  - paper: docs/202306/20230613_011.md
  - paper: docs/202306/20230613_193.md
  - paper: docs/202306/20230613_171.md
  - paper: docs/202306/20230613_197.md
- 'no': 8
  name: 执行力与复盘闭环：新人变现的唯一核心杠杆
  desc: 对于认知不足的小白，执行力（立即行动、持续迭代、结构化复盘）比策略选择更重要；赚钱是高密度执行的必然结果，而非偶然。
  role: proof
  src:
  - paper: docs/202306/20230613_016.md
  - paper: docs/202306/20230613_169.md
  - paper: docs/202306/20230627_011.md
- 'no': 9
  name: 实战案例库：四位新人从0到1的完整复盘数据
  desc: 汇总四大典型案例的关键数据与路径：程序员ChatGPT+公众号两周四位数、大学生天涯神贴两周1万+、全职宝妈小红书3个月30万、哈尔滨创业者成人用品外卖两个月单店净利3.9-6万。
  role: experiment
  src:
  - paper: docs/202306/20230613_016.md
  - paper: docs/202306/20230613_169.md
  - paper: docs/202306/20230627_047.md
  - paper: docs/202306/20230627_048.md
- 'no': 10
  name: 局限与避坑：平台风控、红利窗口期与模式失效信号
  desc: 揭示副业模式的生命周期：平台风控收紧（如名片赞限流、多账号封号）、红利期结束迹象（跨平台迁移、老九增多）、现金流断裂风险、代运营依赖陷阱。
  role: limitation
  src:
  - paper: docs/202306/20230613_134.md
  - paper: docs/202306/20230613_197.md
  - paper: docs/202306/20230627_048.md
  - paper: docs/202306/20230627_013.md
- 'no': 11
  name: 进阶延展：从个人单打独斗到团队标准化与组织平台化
  desc: 当单人模型跑通后，如何通过销售SOP标准化、人才培养SOP闭环、资源向强者倾斜、合伙人利润分配模型，实现从‘个人英雄主义’到‘组织平台化’的跨越（0-1
    -> 1-10 -> 10-100）。
  role: extension
  src:
  - paper: docs/202306/20230627_013.md
  - paper: docs/202306/20230613_012.md
  - paper: docs/202306/20230613_196.md
