  desc: 点赞、粉丝、播放量等公开数据与实际收益不成正比，甚至负相关；需建立以GMV、佣金、咨询转化为核心的考核体系。曾做2000万播放视频涨粉5万却1分钱没赚。
  role: proof
  src:
  - paper: docs/202306/20230613_141.md
