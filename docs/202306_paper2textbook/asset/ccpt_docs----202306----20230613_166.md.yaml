paper: docs/202306/20230613_166.md
desc: 该素材为创业者孟老师在生财有术社区的分享帖，记录了其从大厂辞职回老家创业，经生财有术精华帖启发，于2021年8月入局同城相亲项目，历经疫情周期至2023年初实现月入10万+稳定流水的两年创业复盘与心路历程。
concepts:
- name: 同城相亲项目
  desc: 一种基于同城/LBS（位置服务）的相亲交友商业模式，作为素材作者的核心创业赛道，具备可复制、可规模化运营的特征。
  is_original: false
  excerpt:
  - 21 年 8 月开始入局同城相亲项目
  - 最近也准备搞本地同城相亲的业务
  - 帮很多做同城相亲项目的渠道做了代发
- name: 生财有术
  desc: 一个商业实战社群/知识星球平台，作者通过阅读其中精华帖获得项目灵感与方法论，并在此输出复盘回馈社区。
  is_original: false
  excerpt:
  - 于是 21 年加入生财，开始尝试看一些精华帖
  - 感谢生财
  - 主要是记录一下自己 2 年的心路历程，回馈生财
methods:
- name: __overview__
  desc: 作者的整体创业路径方法论：大厂离职 -> 回老家就业 -> 加入高质量商业社群(生财有术) -> 筛选头部实战案例(唐大、杜总帖子) -> 确定赛道(同城相亲)
    -> 全职入局执行 -> 熬过周期(疫情) -> 达到稳定盈利(月入10W+)。
  excerpt:
  - 19 年从上海互联网大厂辞职回到太原老家，上了一年多的班...总觉得我的生活不应该就这样了吧
  - 于是 21 年加入生财，开始尝试看一些精华帖...让我有了动力开始入局同城相亲项目
  - 21 年 8 月开始入局同城相亲项目，22 年扛过了疫情，23 年初月入 10W+稳定流水
- name: 头部案例复刻与领路人筛选法
  desc: 不盲目试错，而是通过社群精华帖识别已跑通模式的头部玩家（如唐大、杜总），直接复制其验证过的赛道与打法，降低认知成本与试错风险。
  excerpt:
  - 这里首先感谢我的两位领路人，是看了两位大佬分享的帖子，让我有了动力开始入局同城相亲项目： @唐大（） @杜总（）
theorems:
- name: 同城相亲赛道仍具备入局红利窗口期
  desc: 尽管入局时间较晚（2021年），但通过标准化执行与周期熬耐，该赛道在2023年依然能实现月入10万+的稳定正向现金流，验证了赛道的生命力与抗周期性。
  excerpt:
  - 同城相亲月入 10W+，现在入局还有机会吗？
  - 21 年 8 月开始入局同城相亲项目，22 年扛过了疫情，23 年初月入 10W+稳定流水
- name: 普通人创业需经历'收入骤减-心理落差-外部杠杆(社群/案例)-行动-穿越周期'的完整心智成熟周期
  desc: 创业成功非一蹴而就，需经历大厂光环褪去后的心理建设，借力外部高质量信息源（生财有术、头部案例）打破认知局限，最终以时间换取确定性结果。
  excerpt:
  - 收入骤减带来的不止是生活质量的下降，更多的是内心成就感很精神状态的不满足
  - 看了两位大佬分享的帖子，让我有了动力开始入局
  - 22 年扛过了疫情，23 年初月入 10W+稳定流水
findings:
- name: 作者个人创业结果验证
  desc: '[evidence] 作者从2021年8月全职入局同城相亲项目，在经历2022年疫情冲击后，于2023年初实现月流水10万元以上且趋于稳定，且评论区同行（刘海龙）印证该项目渠道流量可破万播、投产比合适。'
  excerpt:
  - 21 年 8 月开始入局同城相亲项目，22 年扛过了疫情，23 年初月入 10W+稳定流水
  - '刘海龙 : 帮很多做同城相亲项目的渠道做了代发 基本上每个号流量都能破万播，这个项目还是可以跑的，只要投产比合适'
- name: 社群背书与同行验证机制有效
  desc: '[evidence] 评论区出现多位同行（行野、刘海龙、小凯）进行业务咨询、渠道数据印证及人品背书，形成了‘分享-验证-连接’的正向社群飞轮效应。'
  excerpt:
  - '行野 : 孟老师，有联系方式吗？最近也准备搞本地同城相亲的业务。可以链接下吗？'
  - '刘海龙 : 帮很多做同城相亲项目的渠道做了代发 基本上每个号流量都能破万播...'
  - '小凯 : 孟总人非常好，我验证过，帖子内容和孟总实际操作属实，支持干货'
