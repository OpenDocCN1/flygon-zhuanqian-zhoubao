paper: docs/202306/20230613_114.md
desc: 该素材是一篇由吴东子发布的《瞬息全宇宙》AI视频制作实操教程，旨在手把手教导用户制作抖音百万点赞同款视频。内容涵盖该视频类型的两大核心玩法分类（【穿越之旅】与【平行宇宙】）、所需插件安装与界面操作讲解、基础复刻流程及进阶定制化技巧，并附赠现成的模型与预设文件链接，主打“奶奶都能听懂”的零门槛落地实操。
concepts:
- name: 瞬息全宇宙视频
  desc: 一种在抖音等平台流行的AI生成视频风格，单条视频可获百万点赞，核心视觉表现为主角在多种风格/场景间快速切换穿梭。
  is_original: false
  excerpt:
  - 最近一种叫“瞬息全宇宙”的视频火了，抖音一期视频百万赞，各个博主视频都在带瞬息全宇宙这个标签
- name: 穿越之旅
  desc: 《瞬息全宇宙》视频的两大核心子类型之一，通常指主角在不同时空、场景中连续穿梭变换的叙事视觉模式。
  is_original: true
  excerpt:
  - 瞬息全宇宙分两种：一种是【穿越之旅】
- name: 平行宇宙
  desc: 《瞬息全宇宙》视频的两大核心子类型之二，通常指同一主角在多个平行世界中呈现不同人设/风格的对比视觉模式。
  is_original: true
  excerpt:
  - 另一种是【平行宇宙】
- name: 模型与预设包
  desc: 作者整理并分享的配套资源包，包含制作该类视频所需的特定AI模型文件及参数预设，用户可直接下载使用以复刻效果。
  is_original: true
  excerpt:
  - 另外，模型和预设也给大家准备好了，放在文章的末尾
  - 【穿越之旅】 【平行宇宙】[https://ry5hwpuf7b.feishu.cn/docx/WbFVdvGkAoo38ZxDumwclWEynRg](https://ry5hwpuf7b.feishu.cn/docx/WbFVdvGkAoo38ZxDumwclWEynRg)[https://ry5hwpuf7b.feishu.cn/docx/Lfjedtd4QoCkBhxkgTfcBsG1np0](https://ry5hwpuf7b.feishu.cn/docx/Lfjedtd4QoCkBhxkgTfcBsG1np0)
methods:
- name: __overview__
  desc: 《瞬息全宇宙》视频制作全流程标准化教学法：包含插件安装部署、软件界面核心功能讲解、基础复刻标准流程（按两大类型分别操作）、进阶定制化玩法拓展，配套现成模型预设资源包实现零门槛落地。
  excerpt:
  - 教程包含了插件的安装，界面的讲解，基本看完之后是能做出来和爆款一样的效果的
  - 如果你想定制化操作，也有进阶的知识点让你玩出花样
  - 模型和预设也给大家准备好了，放在文章的末尾
theorems:
- name: 零门槛复刻爆款主张
  desc: 主张通过提供标准化教程（安装、界面、流程）配套现成模型预设，普通用户（甚至奶奶）无需专业背景即可复刻出百万点赞级别的《瞬息全宇宙》视频效果。
  excerpt:
  - 用奶奶都能听懂的方式分享可以落地实操的干货
  - 基本看完之后是能做出来和爆款一样的效果的
- name: 分类教学提效主张
  desc: 主张将《瞬息全宇宙》视频归类为【穿越之旅】与【平行宇宙】两大核心范式进行分类教学，能更高效地覆盖主流玩法并指导用户进行针对性定制化创作。
  excerpt:
  - 瞬息全宇宙分两种：一种是【穿越之旅】，另一种是【平行宇宙】
  - 如果你想定制化操作，也有进阶的知识点让你玩出花样
findings:
- name: 市场验证与用户需求
  desc: '[evidence] 该视频类型已在抖音平台跑出单条百万赞的头部案例，且形成标签聚合趋势，证明具备极强的传播潜力与商业价值；[claim] 作者基于朋友催更反馈，判断存在强烈的用户制作教程需求。'
  excerpt:
  - 抖音一期视频百万赞，各个博主视频都在带瞬息全宇宙这个标签，于是就有朋友催我出教程了
- name: 商业化延伸信号
  desc: '[evidence] 评论区用户直接建议开设定制服务，表明该技能具备明确的变现路径（C端教学/B端定制）。'
  excerpt:
  - '秋水 : 我觉得是不是开个定制服务呀'
