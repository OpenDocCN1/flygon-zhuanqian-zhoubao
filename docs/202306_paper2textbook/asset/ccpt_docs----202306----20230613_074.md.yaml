paper: docs/202306/20230613_074.md
desc: 该素材为一篇知识付费领域从业者的经验复盘贴预告，作者青志以“从入行设计师到跑通副业IP、知识付费收入2W+”的个人经历为背景，旨在揭秘知识付费行业的“光明与黑暗”，帮助小白识别坑、避坑，防止被收割（韭菜化），核心主张是通过认知升级抵御收割镰刀。
concepts:
- name: 知识付费收割/镰刀
  desc: 指知识付费行业中利用信息差、焦虑营销等手段收割入门者（韭菜）钱财的隐性规则或显性套路。
  is_original: false
  excerpt:
  - 咱来唠唠花钱
  - 看完应该多多少都能抵御点镰刀，避免进一步恶化到韭菜癌晚期
  - 揭秘知识付费的光明与黑暗
- name: 韭菜癌晚期
  desc: 形容深度陷入知识付费消费陷阱、持续付费却无实质产出、认知被严重异化的终端用户状态。
  is_original: true
  excerpt:
  - 避免进一步恶化到韭菜癌晚期
- name: 副业IP跑通模型
  desc: 作者从设计师入行，通过构建个人IP，实现知识付费变现2W+的可复制路径与方法论雏形。
  is_original: true
  excerpt:
  - 从入行设计师到跑通副业 IP，知识付费 2W+
  - 我学到了哪些？
methods:
- name: __overview__
  desc: 基于个人实战复盘的“避坑指南”输出法：通过公开真实收入数据建立信任 -> 承诺揭秘行业黑幕（光明与黑暗） -> 提供长文档深度复盘 -> 引导读者建立抵御收割的认知防御体系。
  excerpt:
  - 全文一共近 7000 字，阅读需要要花点时间，但看完应该多多少都能抵御点镰刀
  - 随我一起揭秘知识付费的光明与黑暗
  - 点赞过 50 就更新下一篇
theorems:
- name: 认知防御优于技术变现
  desc: 对于知识付费入门者（小白），学会识别行业套路、避免被收割（花钱买教训）比单纯学习赚钱技巧（搞钱）更具优先级和生存价值。
  excerpt:
  - 今天，咱不说怎么搞钱，咱来唠唠花钱
  - 看完应该多多少都能抵御点镰刀，避免进一步恶化到韭菜癌晚期
- name: 真实收入公开建立权威信任
  desc: 在知识付费/个人IP领域，公开具体、可验证的真实收入数据（如2W+）而非虚假包装的大数字，是建立“最懂小白”人设、获取初始信任的核心锚点。
  excerpt:
  - 从入行设计师到跑通副业 IP，知识付费 2W+
  - 那个最懂小白的男人又来了
findings:
- name: 社群互动验证内容需求
  desc: '[evidence] 上一篇精华贴获得200+赞，远超预设的50赞更新阈值，表明目标受众对“避块指南/反收割”内容有强烈刚需，且对真实从业者经验分享高度认可。'
  excerpt:
  - 上次答应大家的，点赞过 50 就更新下一篇，没想到点赞突破 200 了都
  - 真的非常感谢圈友的认可
- name: 受众普遍存在被收割痛点
  desc: '[claim] 评论区用户自发提及“朋友圈全是训练营”、“我是韭菜”，印证了素材核心主张：知识付费市场乱象丛生，受众处于高风险被收割环境中。'
  excerpt:
  - 'Ray♻️💥 : 同意，发现朋友圈全是训练营'
  - 'yl 杨留 : 怎么联系'
  - '帅彬 : 我是韭菜'
