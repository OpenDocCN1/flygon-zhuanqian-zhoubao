units:
- 'no': 1
  name: 低价引流与销量双刃剑 —— 让“想要数”变成信任背书
  points:
  - '**为什么需要这个概念？**'
  - '- 新品在闲鱼平台无销量基础，买家易因从众心理划走'
  - '- 需要在冷启动期隐藏销量劣势，后期展示销量优势'
  - '- 低价是强引流手段，但需规避平台虚假低价违规判定'
  - '**核心定义**'
  - '- 利用闲鱼币折扣动态遮挡/展示想要数，配合双规格或价费分离的合规低价引流策略'
  - '**关键性质**'
  - '- 冷启动期：开启闲鱼币折扣遮挡低销量，防止逆从众心理劝退'
  - '- 成长期：积累几百单后取消折扣，暴露高销量触发从众心理促单'
  - '- 计算复杂度：低价会吸引非精准流量，需通过文案引导高客单规格'
  - '**典型例子**'
  - '- 闲鱼币折扣遮挡“想要数”在链接冷启动期，千单后取消折扣展示高销量'
  - '**边界条件**'
  - '- 不得直接标不相关低价，否则触发平台违规判定'
  - '- 低价引流吸引单纯占便宜用户，需靠出手理由文案锚定信任'
  sources:
  - paper: docs/202306/20230613_156.md
    role: origin
  - paper: docs/202306/20230613_156.md
    role: apply
  excerpts:
  - 闲鱼币折扣可以把你的想要数给盖住
  - 在你刚发布书籍销量少的时候，你用闲鱼币抵扣把想要数盖住，把缺点盖住，买家就不会根据销量把你 pass 掉
  - 啥时候取消？在你这条链接卖起来的时候，有几百个销量了，这就是优点了，再把闲鱼币折扣取消掉，把优点展示出来，利用买家从众心理
  - 不能直接标不相关的低价，不然会被判违规，可以文案中写精装和简装两款规格，标价标最低简装的，这样就不会违规
- 'no': 2
  name: 主图留白与视觉锤 —— 让“特点”在第一眼被看见
  points:
  - '**为什么需要这个概念？**'
  - '- 闲鱼用实拍图，买家基于首因效应秒级决定点击'
  - '- 画面填满即无特点，需通过构图留白突出吸引点'
  - '- 合集/堆头主图可提升客单价与供应链信任感'
  - '**核心定义**'
  - '- 主图遵循留白法则，展示正面封面/插画、合集全貌或堆头实力，打造规整耐看视觉冲击'
  - '**关键性质**'
  - '- 首因效应：主图决定点击数量，决定链接出单数量'
  - '- 合集效应：拍摄全家福而非单本，体现合集特点提升客单价'
  - '- 堆头效应：大量堆积实拍图传递“有实力、价格便宜”信号'
  - '**典型例子**'
  - '- 探针笔记测限流连测3次，以500阅读为分水岭；爆款主图想要1264、浏览8873'
  - '**边界条件**'
  - '- 虽然主图重要，但文案/副图仍负责促成转化，主图不能替代信任锚定'
  sources:
  - paper: docs/202306/20230613_156.md
    role: origin
  excerpts:
  - 主图是买家的第一印象，在闲鱼，一张好主图决定买家的点击数量，决定这条链接的出单数量
  - 一张图，全是特点，那这张图就没有特点了
  - 如果卖合集，或者一位作者所有的书...最好把合集的 3 本书都拍进去，展现出合集的特点
  - 规规矩矩，整整齐齐，非常的耐看，非常的顺眼
- 'no': 3
  name: 出手理由与文案锚定 —— 让“卖信任”替代“卖商品”
  points:
  - '**为什么需要这个概念？**'
  - '- 买家对二手书来源不明、成色不可控存在信任顾虑'
  - '- 通用促销话术难以消除顾虑，需场景化出手理由'
  - '- 信任度差异直接导致同款不同转化率'
  - '**核心定义**'
  - '- 在文案开头设置真实场景化出手理由（如实体店撤股周转、航海实操练手），替代通用话术，锚定信任'
  - '**关键性质**'
  - '- 场景真实感：消除买家对二手书来源不明的顾虑'
  - '- 差异化表达：同样卖东西，不一样的表达，不一样的效果'
  - '- 信任锚定：文案首行出手理由是信任构建模板的核心'
  - '**典型例子**'
  - '- “我是参加的生财有术的二手书航海，教练带我们赚钱，你下单了我从孔夫子或者拼多多填上你的地址给你下单发货”'
  - '**边界条件**'
  - '- 出手理由需真实可信，虚构场景易被识破导致信任崩塌'
  sources:
  - paper: docs/202306/20230613_156.md
    role: origin
  excerpts:
  - 可以在标题下，文案开头写上出手理由
  - 举例 1：实体店合伙人撤股，经营不下去了，需要资金周转，部分书籍低价忍痛亏本处理
  - 举例 2：我是参加的生财有术的二手书航海，教练带我们赚钱，你下单了我从孔夫子或者拼多多填上你的地址给你下单发货
  - 同样卖东西，不一样的表达，不一样的效果
- 'no': 4
  name: 全自动化运营系统 —— 让“搬运工”升级为“系统设计者”
  points:
  - '**为什么需要这个概念？**'
  - '- 闲鱼二手书无货源模式90%以上为机械重复操作，人力有限'
  - '- 需要用技术杠杆替代人工，释放精力至选品等高决策价值环节'
  - '- 实现全自动赚钱是普通人突破单店瓶颈的必要路径'
  - '**核心定义**'
  - '- 程序员自研浏览器插件系统，覆盖批量上书、跨平台订单履约、消息聚合推送、黑名单去重等几十项功能'
  - '**关键性质**'
  - '- 批量上书：自动化获取书籍信息并发布闲鱼，解决人工上架效率低'
  - '- 跨平台履约：闲鱼订单回流至孔夫子，快递单号自动同步，完成无货源闭环'
  - '- 合规机制：书本黑名单去重，避免重复铺货扣分'
  - '**典型例子**'
  - '- 作者自称系统已运行两三个月，几十个功能天天在用，已较为完善'
  - '**边界条件**'
  - '- 需提前办理出版物经营许可证，属于业务启动前置合规动作'
  sources:
  - paper: docs/202306/20230613_154.md
    role: origin
  - paper: docs/202306/20230613_157.md
    role: improve
  excerpts:
  - 作为一名程序员开发了一套非常完善的系统，解决闲鱼二手书项目 90%的机械操作
  - 1.批量上书 2.自动修改孔夫子收货地址 3.自动发货，孔夫子的快递单号自动同步发布 4.订单，退货 ，孔夫子消息微信端实时通知 5.批量加价，增加数万曝光
    6.聚合聊天，全部闲鱼号聊天微信端实时通知 7.书本黑名单，去重，避免扣分
  - 隔天就马上下单申请出版物许可证，目前也快要下来了
- 'no': 5
  name: 选品测款与正反馈闭环 —— 让“第一单”成为信心锚点
  points:
  - '**为什么需要这个概念？**'
  - '- 新手易陷入多项目浅尝，精力分散无法跑通任何闭环'
  - '- 需要通过低成本试错验证需求真实性与付费意愿'
  - '- 首单正反馈是打破迷茫、建立商业自信的前置条件'
  - '**核心定义**'
  - '- 闲鱼无货源选品四步法：多源挖掘→硬指标筛选→差异化上架→48小时数据复盘决策'
  - '**关键性质**'
  - '- 筛选标准：近30天成交>50单、同款<20家、利润>15元或利润率>20%、非强管控'
  - '- 测试节奏：每日上新3-5款，48小时曝光<100下架，想要>5或询单>2优化留存'
  - '- 正反馈循环：可见结果（首单/日出单/利润达标）强化信心并修正认知'
  - '**典型例子**'
  - '- 作者从多项目失败到聚焦闲鱼无货源，2个月拿到正反馈并产出可复制飞书SOP'
  - '**边界条件**'
  - '- 项目方法论标准化，成败关键不在于知不知道，而在于做没做、坚持没坚持'
  sources:
  - paper: docs/202306/20230613_158.md
    role: origin
  excerpts:
  - 选品四步法：1)多源挖掘（闲鱼热搜/拼多多榜单/1688新品/竞品畅销）；2)硬指标筛选（近30天成交>50、同款在售<20、利润>15元或利润率>20%、非强管控品牌）；3)差异化上架测试（日更3-5款）；4)48小时数据复盘决策（曝光<100下架，想要>5或询单>2优化留存）
  - 由于个人原因都没有拿到正反馈，其实不是项目的原因，是人的原因
  - 详细内容请移步飞书：https://cxf1s7tdub.feishu.cn/docx/VFwTdYT25oHECPxsoVbcf05in3c
- 'no': 6
  name: 私域引流与LTV最大化 —— 让“公域流量”沉淀为“用户资产”
  points:
  - '**为什么需要这个概念？**'
  - '- 闲鱼平台规则收紧、流量波动大、单次交易利润薄'
  - '- 仅依赖平台一锤子买卖无法持续，必须构建完整商业闭环'
  - '- 将流量资产化是提高客户终身价值(LTV)的必要路径'
  - '**核心定义**'
  - '- 构建“公域获客→私域沉淀→信任运营→复购/高客单转化”的完整闭环体系'
  - '**关键性质**'
  - '- 被动引流：主页签名钩子、自动回复引导加微信'
  - '- 主动引流：成交后发货卡片引导加微信领售后群/延保'
  - '- 群运营：建粉丝群定期发福利单/清仓单，沉淀高信任用户'
  - '- 朋友圈打造：发货实拍、好评、避坑干货，建立专业信任感'
  - '**典型例子**'
  - '- 公域流量私域化：从一锤子买卖到用户资产复利，10天变现3万实战验证'
  - '**边界条件**'
  - '- 私域运营需遵守平台规则，避免直接留联系方式触发封号风险'
  sources:
  - paper: docs/202306/20230613_158.md
    role: origin
  excerpts:
  - 四、引流私域
  - 构建“公域获客->私域沉淀->信任运营->复购/高客单转化”的完整商业闭环，将流量资产化
  - 被动引流：主页签名留钩子（资料/群/福利），自动回复设置‘加微信送选品表/避坑指南’
- 'no': 7
  name: 单店投入产出与回本模型 —— 让“零成本开店”成为可验证预期
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人需在启动前评估闲鱼无货源的资金投入与回本周期'
  - '- 避免盲目囤货或重资产投入导致现金流断裂'
  - '- 建立确定性收益认知，支撑长期执行'
  - '**核心定义**'
  - '- 闲鱼无货源单店启动成本低，主要投入在养号时间与选品试错成本，回本周期取决于选品成功率与单店流水'
  - '**关键性质**'
  - '- 轻资产：无需囤货，一件代发履约，资金占用低'
  - '- 试错导向：多项目浅尝易失败，单一赛道深耕至出单是获取正反馈的最高效路径'
  - '- 复利增长：单店跑通后可通过矩阵化放大规模化收益'
  - '**典型例子**'
  - '- 作者2年副业收入30万+，验证了轻资产+碎片时间模式的上限'
  - '**边界条件**'
  - '- 平台风控、红利窗口期结束、合规红线（出版物许可证）均可能影响模型有效性'
  sources:
  - paper: docs/202306/20230613_233.md
    role: origin
  excerpts:
  - 从副业 0 收入，到第 1 单，到 100 单，2 年收入 30W+
  - 关于副业，我尝试过不下 6 个互联网项目。换了很多赛道，失败过、迷茫过，痛苦过
  - 从设计师到闲鱼卖货
