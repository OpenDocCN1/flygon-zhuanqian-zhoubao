paper: docs/202306/20230627_008.md
desc: 该素材是一篇由星陈发布的实操教程，介绍如何使用后羿采集器这一无代码可视化爬虫工具，对蝉小红（小红书数据分析平台）进行行业、品类及商品数据的自动化采集，旨在为小红书电商运营及选品分析提供数据支撑。
concepts:
- name: 后羿采集器
  desc: 一款无需编程基础的可视化网页数据采集工具，支持模拟人工操作、翻页、循环采集及数据导出，是本教程的核心执行工具。
  is_original: false
  excerpt:
  - 用后羿采集器在蝉小红采集行业信息的保姆级教程
  - 最近跑通了用后羿采集器采集蝉小红数据的整个流程
- name: 蝉小红
  desc: 专注于小红书生态的数据分析平台，提供行业榜单、品类分析、商品详情、达人分析等数据，是本教程的采集目标数据源。
  is_original: false
  excerpt:
  - 用后羿采集器在蝉小红采集行业信息
  - 可以用于小红书的品类分析和商品分析
- name: 小红书品类分析/商品分析
  desc: 基于蝉小红平台数据进行的市场洞察活动，包括行业趋势研判、爆款商品挖掘、竞品监控等，是本教程采集数据的最终业务落地场景。
  is_original: false
  excerpt:
  - 可以用于小红书的品类分析和商品分析
- name: 保姆级教程
  desc: 指代教程的详尽程度，涵盖从环境配置、规则配置、字段选择、反爬规避到数据清洗导出的全链路零基础操作指引。
  is_original: true
  excerpt:
  - 用后羿采集器在蝉小红采集行业信息的保姆级教程
  - 这里奉上保姆级教程，供圈友参考
methods:
- name: __overview__
  desc: 基于后羿采集器的可视化配置流程，通过‘新建任务-配置列表页/详情页规则-设置翻页/循环-启动采集-导出数据’的标准化操作链路，实现对蝉小红平台结构化数据的批量获取。
  excerpt:
  - 最近跑通了用后羿采集器采集蝉小红数据的整个流程
  - 详细使用方法，请移步飞书：https://mxlvpvhrxlt.feishu.cn/docx/DdLvdWpB9o0D0cxXOjSc1YdznPd
theorems:
- name: 无代码采集赋能电商运营
  desc: 非技术背景的运营人员可通过后羿采集器等可视化工具，低成本、高效率地打通蝉小红等商业数据平台至本地分析环节的数据链路，实现数据驱动的选品与决策。
  excerpt:
  - 最近跳通了用后羿采集器采集蝉小红数据的整个流程，可以用于小红书的品类分析和商品分析
  - 供圈友参考
findings:
- name: 教程验证与社区需求确认
  desc: '[evidence] 作者已实测跑通全流程，评论区用户（如‘正想学习就看到您的分享’、‘正想要呢’）确认了该教程对小红书运营从业者的强烈刚需。'
  excerpt:
  - 最近跑通了用后羿采集器采集蝉小红数据的整个流程
  - '评论区：小章鱼 : 太棒了 正想要呢 ... 李彬 : 正想学习就看到您的分享，谢谢'
- name: 类目详情页深层采集需求
  desc: '[claim] 社区用户提出进阶需求：需采集点击类目名称跳转后的详情页数据（二级/三级页面），暗示基础列表页采集无法满足深度分析场景。'
  excerpt:
  - '新月 : 多谢分享～请问类目详情页（点击类目名称跳转的页面）的数据可以爬吗'
