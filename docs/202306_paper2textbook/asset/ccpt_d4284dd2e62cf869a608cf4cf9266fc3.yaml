paper: docs/202306/20230613_228.md
desc: 该素材为一篇小红书电商实操经验分享帖，作者阿成及其团队于2022年11月入局小红书电商，运营14家店铺并实现6天12万+营业额的成果。核心贡献在于将从0到1的开店全流程系统化、标准化为「四阶段操作手册」，并构建了模块化、可检索的飞书知识库文档体系，旨在解决团队新人快速上手及店铺批量复制放大的标准化运营难题。
concepts:
- name: 四阶段操作手册
  desc: 将小红书电商从0到1的全流程拆解为四个有关联性的阶段性文档体系，覆盖入门基本功，支持新人边看边操作快速上手。
  is_original: true
  excerpt:
  - 手册的制作分为 4 个阶段，每一篇以及每一个阶段都是有关联性的，如未接触过小红书电商，按照流程从第一阶段开始即可
  - 这些步骤属于入门小红书的基本功
- name: 模块化知识库
  desc: 采用飞书文档构建的嵌套式知识库结构，主文档索引子文档，支持按需点击查阅遇到的具体问题，提升检索与学习效率。
  is_original: true
  excerpt:
  - 内容的详细程度是我带线下员工总结出来的，为了高效的带团队，所以做的比较细
  - 图片和文字较多，我拆分成了单独的文档，有一些文档里还有文档，使用过程中你可以点击你目前阶段遇到的问题，哪里不会点哪里即可
- name: 批量店群运营模型
  desc: 团队运营14家店铺并持续放大，验证了标准化SOP对多店铺并行复制的可行性。
  is_original: false
  excerpt:
  - 团队目前运营着 14 家店铺，还在放大中
methods:
- name: __overview__
  desc: 基于实战沉淀的标准化SOP构建方法论：以团队新人培训需求为倒逼，将碎片化实操经验结构化为四阶段手册，再通过飞书文档的树状嵌套结构实现模块化交付，实现『标准化流程-模块化文档-批量化复制』的运营闭环。
  excerpt:
  - 内容的详细程度是我带线下员工总结出来的，为了高效的带团队，所以做的比较细，基本团队里的小白过来边看边操作上手很快
  - 手册的制作分为 4 个阶段，每一篇以及每一个阶段都是有关联性的
  - 图片和文字较多，我拆分成了单独的文档，有一些文档里还有文档，使用过程中你可以点击你目前阶段遇到的问题，哪里不会点哪里即可
theorems:
- name: 标准化SOP是店群规模化复制的前置条件
  desc: 只有将运营经验沉淀为细致到『小白边看边操作上手』的标准化手册，才能支撑14家乃至更多店铺的同步放大运营。
  excerpt:
  - 内容的详细程度是我带线下员工总结出来的，为了高效的带团队，所以做的比较细，基本团队里的小白过来边看边操作上手很快
  - 团队目前运营着 14 家店铺，还在放大中
- name: 模块化文档优于线性长文适合实操型知识传递
  desc: 针对图文繁多、步骤复杂的电商实操，采用『主文档索引+子文档嵌套』的非线性结构，支持『哪里不会点哪里』的即时学习，显著降低认知负荷。
  excerpt:
  - 图片和文字较多，我拆分成了单独的文档，有一些文档里还有文档，使用过程中你可以点击你目前阶段遇到的问题，哪里不会点哪里即可
  - 推荐电脑打开阅读
findings:
- name: 团队实战业绩验证
  desc: '[evidence] 作者团队入局半年内运营14家店铺，单次操作周期6天实现12万+营业额，佐证了该手册体系在实战中的有效性。'
  excerpt:
  - 团队在去年 11 月份进入小红书电商赛道，团队目前运营着 14 家店铺，还在放大中
  - 6 天 12W+ 营业额的小红书店铺操作手册分享
- name: 新人上手效率验证
  desc: '[evidence] 手册经团队内部小白实测，可实现『边看边操作上手很快』，验证了文档颗粒度与结构设计的教学有效性。'
  excerpt:
  - 基本团队里的小白过来边看边操作上手很快
