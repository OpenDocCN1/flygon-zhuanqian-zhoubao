  - 用一年时间，认真把生财看完。
  - 在生财里找到几个标杆，对标学习。
  - 主动输出，倒逼输入。
  - (精华帖)(389 赞)《拼命拿结果的一年，终于有了第一个正反馈》
- 'no': 20
  name: 广告思维沟通 —— 用“编码-解码”让亲密关系信号零损耗
  points:
  - '**为什么需要这个概念？**'
  - '- 亲密关系冲突常因双方编码/解码不匹配（如直男思维vs密码化表达），用广告学原理可系统化诊断与改善'
  - '**核心定义**'
  - '- 借用广告“编码-解码”传播模型：沟通必须使用接收方能理解的语言与方式（顾客视角），而非发送方的自我表达习惯；长期沉默等于“停止投放广告”'
  - '**关键性质**'
  - '- 沟通本质即编码解码匹配：有效沟通前提是“用对方听得懂的话说”'
  - '- 沉默比错误沟通更致命：停止主动表达导致信息真空、认知偏差累积，关系必然不和谐'
  - '- 沟通风格匹配度决定关系质量：协议兼容的对象即便外部条件差，关系也优于风格严重错位的“门当户对”'
  - '**典型例子**'
  - '- 《万箭穿心》李宝莉-马学武因编码解码错位走向悲剧；李宝莉-建建因“直接编码-直接解码”匹配而和谐'
  - '**边界条件**'
  - '- 需要双方有改善意愿；单方面改变无法解决关系问题'
  - '- 影视案例为模型启发，现实关系需结合具体人格与情境'
  - '- 部分深层价值观冲突无法仅靠沟通技巧化解'
  sources:
  - paper: docs/202306/20230613_267.md
    role: origin
  excerpts:
  - 广告就是一个研究有效沟通信息的学问
  - 广告强调的沟通方式，是用顾客理解的话语和方式沟通
  - 你要知道对方的解码能力，才能进行适当地编码。
  - 两个人不说话，不沟通，就是等于停止做广告了
  - 李宝莉面对建建，她发出的所有信号，都能被有效解码，马学武不行。
