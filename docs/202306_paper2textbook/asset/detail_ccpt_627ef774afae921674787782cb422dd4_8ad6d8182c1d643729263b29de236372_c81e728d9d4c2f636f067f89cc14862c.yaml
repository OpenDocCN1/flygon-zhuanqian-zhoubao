- 'no': 25
  name: 随心推千川联动 —— 用“算法信任+数据反推”放大图书带货
  points:
  - '**为什么需要这个概念？**'
  - '- 投流新手容易“贪快”加价跑飞导致亏损，需要系统化模型控制出价、养模型、抢量'
  - '**核心定义**'
  - '- 三维体系：①选品定生死（4渠道选品+3避坑指标）②随心推24h智能养模型（系统智能投放/自动出价/ROI目标/测品容亏心态）③千川放大（高峰期一键起量+正负反馈博弈+随心推数据反推出价）'
  - '**关键性质**'
  - '- 选品决定上限、素材决定下限、投流只是放大器：选品错素材烂，投再多也亏损'
  - '- 信任算法智能投放优于人工定向：抖音机器比你更懂抖音用户，无脑选系统智能投放'
  - '- 投放时长越长单次获客成本越低：算法有充足时间低价探索人群'
  - '- ECPM竞争力衰减即失去流量：需通过优化素材/定向/商品信息持续维护'
  - '**典型例子**'
  - '- 月入10w+图书带货；随心推测得平均客单价67.55元，反推千川首单出价33.78元（佣金50%），过新手期降至28.15元'
  - '**边界条件**'
  - '- “随心亏”规律：测品期必亏损（小亏几百大亏几千），需心态建设'
  - '- 高点击低转化素材直接废弃，不做挽留测试'
  - '- 千川出价一次降低不能超过20%，否则易把计划搞死'
  sources:
  - paper: docs/202306/20230613_280.md
    role: origin
  excerpts:
  - 只要选品没问题，做的素材（视频）没问题，用脚投都可以赚钱，就是这个道理，你就无脑选“系统智能投放”
  - 随心推投放时长上，就选最长就行 ... 你就给它时间，让它慢慢探索人群，慢慢给你找到精准用户
  - 计算公式：平均客单价=总销售额 ÷ 总订单数 ... 一般佣金多少直接出多少，比如这个品佣金 50%，就出67.55x50%=33.78 ... 过了新手，立马改一个出价，计算公式：原有出价
    ÷ 1.2
  - 最大可能就是你的计划竞争力不足，ECPM 值排名靠后，系统就不给你流量了。
  - 其实在我看来，绝大部分人不赚钱的原因就两个字，贪快
