units:
- 'no': 1
  name: AI写作变现双轮驱动模型 —— 让流量与产能各跑一条流水线
  points:
  - '**为什么需要这个概念？**'
  - '- 传统写作变现受限于个人产能与速度，AI写作能以分钟级出稿、边际成本趋零，带来结构性优势'
  - '- 单打独斗无法同时兼顾多平台获客与高质量交付，需将流量获取与生产供给解耦'
  - '- 新手需要一条可复制、可放大的路径，而非依赖灵感的个体户模式'
  - '**核心定义**'
  - '- 将业务拆解为“前端多渠道获客矩阵（淘宝/小红书/闲鱼/公众号/抖音/视频号/微信群/朋友圈）”与“后端标准化写作工厂（SOP流程+作家招募培训考核）”'
  - '- 前端负责流量分发与订单转化，后端保障规模化产能与质量，形成双轮驱动模型'
  - '**关键性质**'
  - '- 流量与供给解耦：前端涨跌不影响后端生产，后端产能扩张不依赖前端个人精力'
  - '- 标准化可复制：SOP流程与非标写作服务转化为工业化产品'
  - '- 衍生品矩阵：核心写作能力可横向拓展AI小说推文、AI绘画、自媒体及付费社群'
  - '**典型例子**'
  - '- 作者“荷包蛋糕”从零到六位数存款，单日峰值5000元，前端店铺矩阵+后端写作工作室闭环'
  - '- 与头部机构“头条微念”合作写作培训付费社群，借力品牌背书低风险切入知识付费'
  - '**边界条件**'
  - '- AI写作需持续优化Prompt与SOP，否则产出同质化；平台流量规则变化会影响前端收益'
  - '- 适合有一定执行力和写作基础者，纯新手需先跑通单笔订单最小闭环'
  - '- 后端工厂依赖招聘与考核机制，个人单打独斗存在管理复杂度天花板'
  sources:
  - paper: docs/202306/20230613_272.md
    role: origin
  - paper: docs/202306/20230613_271.md
    role: apply
  excerpts:
  - 前段店铺介绍：淘宝店、小红书、闲鱼、公众号、抖音、视频号、微信群、朋友圈
  - 后端工厂介绍：【荷包蛋糕】写作工作室，建立SOP标准化流程，作家招募培训考核机制
  - AI写作优势：快、稳、省、多任务并行；传统写作劣势：慢、贵、不稳定、精力有限
  - 前端店铺引流 -> 后端工厂生产 -> 衍生项目增收 -> 个人IP沉淀 -> 反哺前端流量
  - 与【头条微念】团队合作做【写作培训付费社群】
- 'no': 2
  name: AI写作衍生品矩阵 —— 让一条能力长出多条变现枝干
  points:
  - '**为什么需要这个概念？**'
  - '- 核心写作能力跑通后，单一变现路径有天花板；工具同质化下需要多维度商业化'
  - '- 衍生项目能复用核心能力与已有流量，实现高毛利增收与资源闭环'
  - '**核心定义**'
  - '- 基于核心写作能力横向拓展AI小说推文+AI绘画+自媒体、写作培训付费社群等衍生赛道，联合头部机构合伙人模式构建个人IP飞轮'
  - '**关键性质**'
  - '- 高毛利衍生赛道：培训/推文等边际成本低、客单价高'
  - '- 资源复用闭环：前端店铺引流->后端工厂生产->衍生项目增收->个人IP沉淀->反哺前端流量'
  - '- 合伙人模式：借力机构品牌、课程体系与运营团队，个人以方法论与IP影响力分成'
  - '**典型例子**'
  - '- 与头条微念团队合作做【写作培训付费社群】'
  - '- AI写作小说+AI绘画+自媒体多模态内容生产，适配抖音/快手/视频号算法'
  - '**边界条件**'
  - '- 衍生项目必须与核心能力协同，避免精力分散导致主业质量下滑'
  - '- 合伙人选择需谨慎，需验证对方交付能力与价值观匹配'
  - '- 依赖核心IP的持续影响力，需要公开复盘与内容输出维持信任'
  sources:
  - paper: docs/202306/20230613_272.md
    role: origin
  - paper: docs/202306/20230613_271.md
    role: apply
  excerpts:
  - 3.4.1 AI 写作小说+AI 绘画+自媒体
  - 3.4.2 与【头条微念】团队合作做【写作培训付费社群】
  - 3.5 整合资源，形成闭环
  - 前端店铺引流 -> 后端工厂生产 -> 衍生项目增收 -> 个人IP沉淀 -> 反哺前端流量
- 'no': 3
  name: AI授权换脸祝福视频 —— 用合规授权+生成式流水线重建非标服务
  points:
  - '**为什么需要这个概念？**'
  - '- 传统明星祝福视频存在档期难约、价格高、效果不可控、版权风险大等痛点，且市场价格已暴跌80%+'
  - '- 生成式AI可标准化、低成本、高质量地重构非标视频服务，但版权是生死线'
  - '**核心定义**'
  - '- 合法获取明星肖像授权 + ChatGPT定制文案/分镜 + Midjourney关键帧 + 换脸/数字人合成，形成标准化祝福视频生产线'
  - '**关键性质**'
  - '- 内容自由定制：让明星说啥就说啥，形象定格巅峰，规避读稿/倦怠/衰老等不可控风险'
  - '- 合规即护城河：授权带来放心扩张、高客单价支撑、独家打假索赔三重商业价值'
  - '- 文生视频降级方案：用ChatGPT分镜 + MJ关键帧 + 3秒/张轮播 + 配乐，低成本替代复杂视频生成'
  - '**典型例子**'
  - '- 藏头诗Prompt调教半小时，ChatGPT一次生成5首备选；MJ画5幅画轮播配乐合成15秒视频'
  - '- 婚庆/蛋糕店等ToB渠道高客单价分销，婚礼祝福客单价高于生日祝福'
  - '**边界条件**'
  - '- 必须合法获取肖像授权，商业IP版权混乱（如奥特曼）风险高'
  - '- 声音克隆有侵权风险，可用“外国名人说方言”等旧元素新组合规避'
  - '- 需持续关注平台对AI生成内容的政策收紧'
  sources:
  - paper: docs/202306/20230613_273.md
    role: origin
  excerpts:
  - 真人明星祝福，改为 AI 换脸+场景情绪自由定制+诵读藏头诗和祝福语+诗的衍生画面视频播放+……
  - 你让明星说啥就说啥，你让 Ta 咋说就咋说。自由调试，不会出现各种意外。
  - 合法合规的好处，一是可以放心坦荡的扩大；二是可以保持较高客单价；或者同时获得“打假”授权
  - 这是让刚才 chatgpt 生成的藏头诗，变成 15 秒短视频画面文案，再让 midjourney 画 5 幅画，3 秒一张，轮播；再配个音乐，就齐活变成视频了。
  - 公共 IP 就没问题，chatgpt 还能帮你捋一捋
- 'no': 4
  name: Stable Diffusion 可控生成 —— 用ControlNet+LoRA把画图变成生产
  points:
  - '**为什么需要这个概念？**'
  - '- Midjourney难以精确控制生成结构，商业定制（如人物换装、换背景）需要可控、可本地化、可扩展的生成方案'
  - '**核心定义**'
  - '- SD全流程框架 + ControlNet（结构/姿势/深度控制）+ LoRA（风格/角色微调）双核技术栈'
  - '**关键性质**'
  - '- 可控性：ControlNet是实现商业级结构保持与语义编辑的核心引擎'
  - '- 本地化部署：保护数据隐私安全'
  - '- 开放生态：LoRA等微调模型提供无限风格扩展，但版权合规是前置条件'
  - '**典型例子**'
  - '- 电商模特换装、换背景通过ControlNet插件实现'
  - '- LoRA加载特定风格/角色特征，快速产出统一风格系列图'
  - '**边界条件**'
  - '- LoRA模型来源不明或基础模型许可证冲突时不可商用，仅供学习参考'
  - '- 技术门槛较高，需先建立“功能-玩法-应用”全流程框架认知'
  - '- 纯文字教程理解困难，需配合视觉结果反馈学习'
  sources:
  - paper: docs/202306/20230613_275.md
    role: origin
  excerpts:
  - 文中提到的 CN 是指的 SD 中的一个插件，全称叫 controlnet
  - 6-3 商业落地部分，人物换模特换背景也是通过 controlnet 插件实现的
  - 后面部分的 LoRA 模型目前没办法商用，仅供参考
  - 对比 midjourney，stable diffusion 有什么优劣势？
- 'no': 5
  name: ChatGPT插件变现 —— 用“原生能力对比”识别真金
  points:
  - '**为什么需要这个概念？**'
  - '- 首批71款插件涌现，但大量是导流/伪需求，需要系统分类与核心判据识别真正可付费的价值产品'
  - '**核心定义**'
  - '- 六大变现赛道分类（购物/商务/教育/金融/娱乐/办公）+“与ChatGPT原生能力对比”核心判据'
  - '**关键性质**'
  - '- 能力增强型插件（计算/长文本/深度分析）填补大模型硬性短板，具可持续单独付费价值'
  - '- 导流型/Affiliate插件面临OpenAI平台政策收紧风险，长期不可持续'
  - '- 工具型插件靠功能限制+付费墙变现，如Yay!Forms'
  - '**典型例子**'
  - '- Wolfram填补计算能力、ChatPDF解决几十万字解析，作者明确“原意单独付费”'
  - '- SEO App效果不如原生ChatGPT Plus，判定为“废柴”'
  - '**边界条件**'
  - '- 受GPT-4使用额度限制（25条/3小时）'
  - '- 联网搜索类插件难替代New Bing的免费优质体验'
  - '- 需持续观察平台插件市场开放后的政策变化'
  sources:
  - paper: docs/202306/20230613_274.md
    role: origin
  excerpts:
  - 我把 ChatGPT Plugins 分为以下几类：购物类，商务类，教育类，金融类，娱乐类，办公类（去掉我们一定用不到的本地类，出行类）
  - 如何判断一个 ChatGPT Plugins 是否真正有价值？其实很简单，也就是跟 ChatGPT 本身能力做对比
  - Wolfram 是实打实的真的 Plugins，填补了计算能力，这种插件，我原意单独付费。
  - 未来相信越来越多的插件上线，对于一般人来说引流和 Affiliate 都会越来越难。而真正可行的，一定是增强 ChatGPT 的能力，然后限制功能，单独付费变现
  - 如果就跟 SEO App 这种，是个废柴，就不算一个真正有价值的产品。
- 'no': 6
  name: GPT反向教学 —— 先让AI当教练，再让AI当代工
  points:
  - '**为什么需要这个概念？**'
  - '- 小白因缺乏领域底层逻辑产生“提示词能力倒挂”，直接投喂知识清单给GPT导致输出泛泛而谈、无法泛化'
  - '**核心定义**'
  - '- 用户先让GPT扮演专家/教练，通过结构化提问与知识框架拆解，引导人掌握领域核心逻辑；待建立判断力后再反向训练GPT产出高质量内容'
  - '**关键性质**'
  - '- 知识内化优于上下文注入：领域知识需在交互中“活”起来，而非静态塞入Prompt'
  - '- 人机协作上限取决于人类专家能力下限；GPT最佳角色是“教练”而非“代工”'
  - '- 结构化拆解：将抽象概念（如18个爆款密码）拆为触发机制、表现形式、心理动因维度'
  - '**典型例子**'
  - '- 把“18个抖音爆款密码”作为标准教材，先让GPT教学，再由人训练GPT'
  - '- 作者以“GPT老师，请教我做抖音”模式解决小白提示词质量低问题'
  - '**边界条件**'
  - '- 需要高质量领域知识框架作为教学素材'
  - '- 用户必须投入时间与反思，否则训练循环无法收敛'
  - '- 完整对话复盘需外部飞书文档支撑'
  sources:
  - paper: docs/202306/20230613_281.md
    role: origin
  excerpts:
  - 那么有没有一种可能，让 GPT 先训练我们，再去训练 GPT 呢？？？
  - 我们大部分小白，其实本来就对抖音或者小红书的底层逻辑理解得不够到位，所以很多时候，我们对 GPT 胡乱教育一通，用我们三脚猫的本事，也没有教出一个厉害的文案大师
  - 3 步用 GPT 教你轻松掌握抖音 18 个爆款密码
  - 例如：女孩们让我跟你们讲一个可怕但必须听完的故事，让目标受众群体觉得这条视频和他有关系，要能够调动观众的利己主义。
- 'no': 7
  name: 小红书起号SOP —— 用“权重先行+爆款复制”把起店变成流水线
  points:
  - '**为什么需要这个概念？**'
  - '- 低权重账号发上百篇也没播放，盲目怼量大概率仅出十几单，起号必须标准化、数据化'
  - '**核心定义**'
  - '- 四大支柱：①账号权重分级诊断（播放几十则注销重注/200+养号/1000+挂车冲爆款） ②爆款复发定律选品 ③六维去重技术栈（画中画+滤镜+画面参数+镜像+抽帧+挡脸特效）
    ④优惠券诱饵定价法'
  - '**关键性质**'
  - '- 权重决定起号周期与上限：权重低的账号无法通过怼量翻盘，必须注销重注'
  - '- 单笔记千单杠杆：一条爆款笔记能带动千单销量，测款-放量是核心策略'
  - '- 前期让利换权重、后期收割利润：用优惠券/福利价换高转化率与算法推流，爆款后取消优惠回归利润'
  - '**典型例子**'
  - '- 数十家店铺测试：正常账号互动笔记播放200+，高权重账号1000+；新店一周单篇笔记破千单'
  - '- 拿货18元定价58元+35元券，爆款日出百单后取消优惠'
  - '**边界条件**'
  - '- 平台查重升级使“剪映一键成片”等粗放搬运失效，必须精细化六维去重'
  - '- 低权重账号（播放几十）不可逆，直接注销重注效率更高'
  - '- 高客单价冷启动（如9.9拿货挂59.9）即使数据好出单也极少'
  sources:
  - paper: docs/202306/20230613_288.md
    role: origin
  excerpts:
  - 一般，正常的账号都会在 200+ 权重高的账号互动笔记都会在 1000+（如果是 1000+的数据挂车出爆款的几率会特别高）
  - 小红书目前有一个定律：爆过的笔记他依然还会再爆
  - 我们会进行添加画中画+滤镜+调整画面参数+镜像+抽帧+挡脸表情特效 这样过原创的几率会很高
  - 例如一款产品拿货是 18 元我们会定价 58 元然后设置单品优惠券 35 元，前期利润不高 一旦被平台推流成为爆款日出百单后，取消优惠券，来获取更多利润
  - 我们近期很多店铺都是一篇笔记起号一周左右就实现 1000+销量
- 'no': 8
  name: PDCA运营循环 —— 用“计划-执行-检查-处理”驱动直播间500倍增长
  points:
  - '**为什么需要这个概念？**'
  - '- 赚钱能力停滞、事业瓶颈的根本原因往往是缺乏系统化管理循环，需要可跨领域迁移的底层能力'
  - '**核心定义**'
  - '- PDCA循环 = Plan（计划）- Do（执行）- Check（检查）- Act（处理），应用于选品测款、话术迭代、排品优化、数据复盘的标准化闭环'
  - '**关键性质**'
  - '- 普适性：这是“一个可以做好任何事的底层能力”，可迁移至任何业务场景'
  - '- 数据驱动：每个环节基于反馈迭代，实现指数级增长'
  - '**典型例子**'
  - '- 作者3个月用纯自然流将单场直播GMV从200元（3小时）提升至10万元（1小时），实现500倍跃迁'
  - '**边界条件**'
  - '- 需严格执行PDCA四步，不能跳步或凭感觉决策'
  - '- 纯自然流依赖内容质量与算法红利，需连续测试与复盘'
  - '- 不适合不愿迭代、追求“一招制胜”的人'
  sources:
  - paper: docs/202306/20230613_278.md
    role: origin
  excerpts:
  - 这篇内容主要跟大家分享 一个可以做好任何事的底层能力——PDCA
  - 如果你觉得自己赚钱的能力和速度都没什么变化，或者是工作事业一直处于瓶颈期，这都是没有了解运用 PDCA 的原因。
  - 我是当小时，之前是个摄影师，后面想不开开了自己的原创服装品牌，开始摸索短视频和直播电商，在三个月内，从零搭建直播间，刚开始三个小时只能卖出两百块，到 1 小时
    GMV 到 10w 的。
  - '星陈 : 很赞，这个 PDCA 很有必要作为一个重要的课题，单独进行学习，并且把这个方法用于实践中。PDCA 是做事的很重要的底层方法。'
- 'no': 9
  name: 小红书图文IP矩阵 —— 用“低门槛图文+隐性引流”精准捕获创业女粉
  points:
  - '**为什么需要这个概念？**'
  - '- 小红书对新手友好且女粉消费力强，但硬广导流会被风控，需要一套低门槛、高精准、可矩阵化的引流链路'
  - '**核心定义**'
  - '- 垂直图文IP账号 + 三五养号法 + 关键词溯源爆款素材 + 网页端OCR提取 + 创可贴标准化图文生产 + 定时发布与评论区带节奏 + 四大隐性引流路径（主页简介同音字/邮箱隐写/私信分享收藏/群聊沉淀）'
  - '**关键性质**'
  - '- 分级流量池机制：初始100播放，按互动数据逐级扩大，内容决定能否进入下一池'
  - '- 伪原创+矩阵放大：标准化工具流实现量产，多账号突破单号流量与风控上限'
  - '- 私域引流本质是风控博弈与心理引导：将“被动推”转为“主动拉”（钩子/资料/群准入）'
  - '**典型例子**'
  - '- 创业女粉单号日引30-50人，矩阵效果更好；女性创业粉适合知识付费等高客单变现'
  - '**边界条件**'
  - '- 同音字/邮箱隐写等话术需持续轮换，平台重复检测机制会使其失效'
  - '- 私信频率需控制（如15人一组、间隔10-20分钟）避免频控'
  - '- 该玩法公开后红利边际递减，需细分化、本地化、新话题维度迭代'
  sources:
  - paper: docs/202306/20230613_284.md
    role: origin
  excerpts:
  - 做一个垂直类的 IP 账号，自己去制作创业文字类的图文并发在小红书上
  - 努力一点单号一天引流 30-50 个流量不是问题，矩阵效果更好
  - 如果直接放咨询、微信这些词可能会被提示违规，可以试下同音字
  - 用 QQ 邮箱的形式变成微信...艾特小号引流，也是一个隐藏式的引流方案
  - 发布笔记后，系统会推送给可能感兴趣的部分用户或者推送给你的粉丝，大概会有 100 左右的初始播放量，这个就是一级的流量池
