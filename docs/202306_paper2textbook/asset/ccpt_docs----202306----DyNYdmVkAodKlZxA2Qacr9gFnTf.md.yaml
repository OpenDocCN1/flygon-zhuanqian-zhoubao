paper: docs/202306/DyNYdmVkAodKlZxA2Qacr9gFnTf.md
desc: 该素材是一篇实操教程，介绍如何利用微信“问一问”功能结合ChatGPT快速生成高质量回答，以获取视频号流量与粉丝增长。核心在于通过“投喂平台规则+优秀案例”训练AI模型，使其输出符合平台调性（真实、简短、图文并茂、排版舒适）的回答，实测每日回答少量问题即可带来百级点赞与十级粉丝增量。
concepts:
- name: 微信问一问
  desc: 微信生态内的问答社区产品，融合知乎深度与小红书短平快调性，优质回答可获首页推荐、搜一搜首条曝光，并支持视频号视频挂载引流。
  is_original: false
  excerpt:
  - 在问一问里首页，用户可以看到我们为你推荐的优质有趣的问答...优质的答案，除了在问一问首页被推荐，还会在用户搜索相关问题时进行展现...如果你使用视频号视频来回答问题，还会为视频带来新增的曝光
- name: 提示词投喂训练法
  desc: 通过分步向LLM输入平台定义、优质内容标准及少样本案例，将通用模型快速适配为特定平台的专家级创作助手的方法论。
  is_original: true
  excerpt:
  - 明白 ChatGPT 不是什么都懂的，需要你投喂资料才行，并且告诉他什么样的回答会被通过和获得高质量的点赞和转发。
  - 不对，下面我给你介绍下，什么是微信问一问和其目的：...
  - 非常好，请继续学习下面是好的问答方式和优秀案例：...
- name: 问一问优质回答四维标准
  desc: 平台认定的高质量回答评价体系，包含内容真实性、表达精炼性、多媒体补充性、排版可读性四个维度。
  is_original: true
  excerpt:
  - 1. 真实、直接且有效的回答，对真正抱有这个问题的人有帮助...真实经验，言之有物...真实感受，分享观点
  - 2. 开放性的问题下，简短但精炼的表述能在回答问题的基础上提供新颖有趣的思考角度...
  - 3. 添加高质量的图片或视频让答案更加清晰...
  - 4. 舒适的排版让内容变得易读...善用换行、表情、字符分隔文字
methods:
- name: __overview__
  desc: 三阶段AI辅助创作工作流：1. 语境注入——输入平台机制与创作目的；2. 少样本对齐——输入官方质量标准与优秀案例；3. 任务执行——指令模型按特定风格（如幽默+表情符号）生成回答。
  excerpt:
  - 告诉他什么是微信问一问...投喂提示词...
  - 提供好的素材和案例...请继续学习下面是好的问答方式和优秀案例...
  - 出成品的环节...根据刚刚学习的好的方式和目的，用幽默方式回答如下问题...
- name: 语境注入提示词模板
  desc: 结构化提示词，包含‘平台定义’与‘参与目的’两大模块，用于消除模型对平台机制的幻觉。
  excerpt:
  - '不对，下面我给你介绍下，什么是微信问一问和其目的：

    （微信问一问是什么：... 参与问答的目的：...）'
- name: 少样本对齐提示词模板
  desc: 将平台官方质量准则转化为结构化指令，作为模型生成的约束条件与评价基准。
  excerpt:
  - '非常好，请继续学习下面是好的问答方式和优秀案例：

    1. 真实、直接且有效的回答... 2. 开放性的问题下... 3. 添加高质量的图片或视频... 4. 舒适的排版...'
- name: 风格化生成指令
  desc: 在完成训练后，追加风格约束（如‘幽默’、‘添加表情符号’）的生成指令，控制输出格式。
  excerpt:
  - 根据刚刚学习的好的方式和目的，用幽默方式回答如下问题，并在合适的位置添加表情符号：（ 你觉得高考重要？）
theorems:
- name: 问一问是视频号冷启动的高性价比流量入口
  desc: 通过回答问题积累正反馈，优质回答可获双重曝光（问一问首页+搜一搜），且视频回答能直接为视频号导流，是视频号0-1阶段的最优路径。
  excerpt:
  - 视频号的快速流量来源之一。如果是你在做视频号，想积累正反馈，这里是不错的选择。
  - 重点：如果你使用视频号视频来回答问题，还会为视频带来新增的曝光，也是吸引粉丝的新渠道。
- name: 通用大模型需领域知识注入才能胜任专业创作任务
  desc: 未经投喂的ChatGPT输出无法通过平台审核；仅需注入平台规则与少量案例，即可显著提升输出质量至‘通过审核并获赞’标准。
  excerpt:
  - 我看到好多人都在反馈，问一问提问之后，都提示审核不通过...从ChatGPT 复制过来的文字，审核都通不过。
  - 投喂前：没有投喂，出来的结果差十万八千里。
  - 来看看返回的结果：[投喂后生成的高质量回答截图]
- name: 内容垂直度是变现闭环的前置条件
  desc: 流量获取仅为第一步，只有垂直领域的持续内容输出才能连接后端产品（公众号、商品）实现商业变现。
  excerpt:
  - 你有产品，视频号的下方挂载公众号的链接，等等都是变现的方式，我目前还没有走通闭环，先把流量搞起来，内容尽量垂直。
findings:
- name: 小规模实测数据验证
  desc: '[evidence] 作者回答10个问题（耗时20-40分钟），获得视频号点赞100+、粉丝增长近10人，验证了该方法的短期有效性。'
  excerpt:
  - 我回答了10个问题 （每个问题2~4分钟），可以给视频号带来点赞超过100个，粉丝接近10来个。
  - 下面是自己的号，内容不是很垂直，效果都不错。[附两张后台数据截图]
- name: 投喂前后模型输出质量对比
  desc: '[evidence] 未投喂时模型输出‘差十万八千里’且无法通过审核；投喂规则与案例后，模型能生成符合‘真实、精炼、排版舒适’标准的回答并通过审核。'
  excerpt:
  - 投喂前：没有投喂，出来的结果差十万八千里。[附截图]
  - 来看看学习的结果：[附投喂后生成的结构化、带表情符号的回答截图]
  - 训练后的效果：[附‘高考重要吗’的幽默风格回答截图]
- name: 非垂直内容也能获得基础流量正反馈
  desc: '[claim] 作者宣称即使内容不垂直，该方法也能产出‘效果都不错’的基础流量数据。'
  excerpt:
  - 下面是自己的号，内容不是很垂直，效果都不错。
