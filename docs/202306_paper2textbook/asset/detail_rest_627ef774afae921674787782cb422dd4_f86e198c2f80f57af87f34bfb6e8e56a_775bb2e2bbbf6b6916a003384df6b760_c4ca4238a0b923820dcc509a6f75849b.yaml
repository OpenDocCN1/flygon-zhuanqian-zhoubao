learning_targets:
- 理解财富的本质：持续从社会提取剩余的动态过程
- 掌握财富获取的底层法则：对他人施加‘得利’或‘损害’
- 理解商业模式公式：利润 = (收入 - 成本) × 频次 × 周期
- 掌握赚钱双核心要素：产品与流量至少占一头
- 理解时间杠杆效率：一份时间卖多次的商业逻辑
- 认清三大商业模式分层：血酬、资源租金、规则制定
- 理解血酬模式在AI时代的消亡风险与‘无用阶层’预警
- 识别稀缺社会资源的双维拆解：‘稀’（供给端）与‘缺’（需求端）
- 掌握商业进化三阶段论：1.0鸡毛换糖 → 2.0商铺模式 → 3.0知识模式
- 掌握生意三维需求模型：满足个体、群体、客观标准化需求
- 区分个体需求交易三要素：劳动力、金钱、智力
- 洞悉知识付费本质：贩卖‘确定感’而非‘能力’
- 理解商业模式与生意的辩证关系：长期守模式，短期抢生意
- 确立成本可控即生存力的风险评估标准
- 掌握智力成本产品化变现：一次性投入，边际成本趋零
- 认知赚钱曲线与波动规律：指数级增长与波峰浪谷
- 确立中等智商成功充分条件：正确方法 + 足够坚持
- 践行利他利己共振：分享吸引优秀人，构建社交飞轮
concept_map:
- 财富
- ├── 本质定义 —— P001（20230613_182.md）
- │   ├── 持续从社会提取剩余的能力 —— 财富是流向过程而非静态存款
- │   └── 核心主张：让别人的钱持续流向自己口袋
- ├── 获取法则 —— P002（20230613_182.md）
- │   ├── 对他人施加‘得利’：提供价值吸引付款
- │   ├── 对他人施加‘损害’：掌握稀缺资源拥有定价权
- │   └── 核心主张：覆盖面决定规模，强度决定议价力
- ├── 三层商业模式 —— P006, P007（20230613_182.md）
- │   ├── L1血酬：出卖时间健康，将被AI取代 —— 核心主张：线性收入，无杠杆
- │   ├── L2稀缺社会资源租金：守擂与攻擂博弈 —— 核心主张：‘稀’（供给少/信任成本高）+‘缺’（刚需/必不可少）
- │   └── L3制定规则/建生态做庄家 —— 核心主张：赢家通吃，持续提供价值秩序
- ├── 商业模式公式 —— P003（20230613_007.md）
- │   ├── 利润 = (收入 - 成本) × 频次 × 周期
- │   ├── 赚钱、高频、可持续三要素
- │   └── 核心主张：不懂公式盲目努力必然‘忙死赔死’
- ├── 赚钱双核心要素 —— P004（20230613_180.md）
- │   ├── 产品端：积累护城河，控成本提复购
- │   ├── 流量端：低成本验证，分销/带货/无货源入局
- │   └── 核心主张：两头占一头，普通人建议从流量切入
- ├── 时间杠杆效率 —— P005（20230613_180.md）
- │   ├── 一对多模式：内容、代码、媒体重复发售时间
- │   ├── 边际成本趋近零
- │   └── 核心主张：一份时间卖多次，实现指数级放大
- ├── 稀缺社会资源双维拆解 —— P008（20230613_182.md）
- │   ├── 稀：总量有限，信任成本高
- │   ├── 缺：社会运转必不可少，刚需
- │   └── 核心主张：又少又缺才是宝
- ├── 商业进化三阶段论 —— P009, P010（20230613_007.md, 20230613_250.md）
- │   ├── 1.0鸡毛换糖：低效交易
- │   ├── 2.0商铺模式：供给丰富
- │   ├── 3.0知识模式：供给过剩，核心能力是认知
- │   └── 核心主张：2.0向3.0转型需代运营2.5中介层
- ├── 生意三维需求模型 —— P010, P011（20230627_004.md）
- │   ├── 满足个体：高客单/非标，交易劳动力/金钱/智力
- │   ├── 满足群体：解决认知焦虑，知识付费变现
- │   ├── 满足客观标准化需求：红海标品，竞争激烈
- │   └── 核心主张：为谁解决问题，就有多大生意
- ├── 知识付费本质 —— P012（20230627_004.md, 20230613_255.md）
- │   ├── 贩卖‘确定感’而非‘能力’
- │   ├── 付费即缓解焦虑，购买后动力反而下降
- │   └── 核心主张：交付结构化认知，而非承诺执行结果
- └── 血酬模式必然消亡 —— P007（20230613_182.md）
- ├── AI颠覆可标准化、重复性劳动
- ├── ‘无用阶层’预警：失去议价力
- └── 核心主张：倒逼向L2/L3跃迁
life_analogy:
- 想象商业模式公式是一台**抽水机**：
- '- 收入 - 成本 = 抽水机的单次抽水量（单笔毛利）'
- '- 频次 = 泵的抽水频率（交易频率，如日结/月结）'
- '- 周期 = 泵能持续工作多久（商业寿命）'
- '- 核心主张：单次抽得多不重要，关键是能高频长期地不停抽'
- 就像抽水机坏了就出不了水，商业模式公式中任何一个因子为零，利润就为零。
- ''
- 想象稀缺社会资源是一口**村里唯一的水井**：
- '- ‘稀’ = 村里只有一口井，水源总量有限'
- '- ‘缺’ = 村民每天都要喝水，缺它不可'
- '- 掌握井盖的人 = 拥有定价权，可以向村民收水费'
- 就像井被垄断，村民必须付费才能喝水，掌握稀缺资源者就能持续获取租金。
- ''
- 想象三大商业模式分层是**爬山的三种方式**：
- '- L1血酬 = 自己背着石头一步步爬，累得半死，停下来就没收入'
- '- L2稀缺社会资源 = 把唯一的登山路围起来收过路费，路人必须付费'
- '- L3制定规则 = 修建索道并制定票价规则，所有人都要按你的规则付费爬山'
- 就像层级越高，越不靠体力，越靠系统和规则赚钱。
summary:
- concept: 财富的本质
  desc: 财富不是存款余额，而是让别人的钱持续流向你口袋的动态过程。
- concept: 财富获取底层法则
  desc: 让他人付钱的唯一合法路径：对他人有用（得利）或能对他人施加损害。
- concept: 商业模式公式
  desc: 利润 = (收入 - 成本) × 频次 × 周期，好的模式需同时具备赚钱、高频、可持续三要素。
- concept: 赚钱双核心要素
  desc: 商业变现必须占据产品端或流量端至少一头，普通人建议从低门槛的流量端切入。
- concept: 时间杠杆效率
  desc: 通过内容、代码、媒体等一对多模式，将一份时间重复发售，实现指数级价值放大。
- concept: 三大商业模式分层
  desc: L1血酬出卖时间（易被AI取代），L2掌握稀缺社会资源收租，L3制定规则做庄家赢家通吃。
- concept: 血酬模式必然消亡
  desc: AI将淘汰可标准化、重复性劳动，出卖时间者将失去议价力，面临‘无用阶层’预警。
- concept: 稀缺社会资源双维拆解
  desc: 真正的护城河需同时满足‘稀’（供给少/信任成本高）与‘缺’（刚需/必不可少）两个维度。
- concept: 商业进化三阶段论
  desc: 商业社会从1.0鸡毛换糖演进至3.0知识模式，核心能力已从渠道转移至认知，2.5阶段为代运营中介层。
- concept: 生意三维需求模型
  desc: 生意本质是满足他人需求，按对象分为满足个体（高客单非标）、群体（认知焦虑/知识付费）、客观标准化需求（红海标品）。
- concept: 个体需求交易三要素
  desc: 除出卖时间外，个体还可交易金钱（投资）与智力（专业方案），智力可标准化产品化实现持续收益。
- concept: 知识付费本质
  desc: 知识付费贩卖的是‘确定感’而非‘能力’，用户为缓解认知焦虑付费，而非为执行结果付费。
- concept: 商业模式与生意辩证关系
  desc: 长期守好商业模式决定上限，短期灵活拿下好生意保障生存，二者不可偏废。
- concept: 成本可控即生存力
  desc: 抗风险能力取决于成本结构的可控性而非绝对规模，亏得起才能活得久。
- concept: 智力成本产品化变现
  desc: 将智力成本打包为书籍、方法论、课程等标准化产品，一次性投入，边际成本趋零，持续复利。
- concept: 赚钱曲线与波动规律
  desc: 赚钱是非线性指数级增长，前期慢后期爆发，收入必然波峰浪谷，追求绝对稳定只能打工。
- concept: 中等智商成功充分条件
  desc: 中等智商 + 正确方法 + 足够坚持 = 几乎必成，但‘无即时反馈下的长期坚持’是最大筛选器。
- concept: 利他利己共振
  desc: 通过分享价值吸引高质量社交资本，形成‘越分享越得到、越利他越利己’的正向社交飞轮。
exercises:
- 'no': 1
  title: 商业模式公式拆解
  contents:
  - 给定某项目数据：收入=5000元，成本=2000元，交易频次=每月10次，周期=12个月：
  - 1. 计算该项目的年利润
  - 2. 若频次降为每月2次，年利润如何变化？
  - 3. 若周期缩短为6个月，对利润有何影响？
  - 回答问题：
  - '- 为什么说‘赚钱、高频、可持续’缺一不可？'
  - '- 如果收入-成本为负数，无论频次和周期多高，结果是什么？'
- 'no': 2
  title: 产品与流量自我定位
  contents:
  - 请按以下维度自我评估：
  - 1. 你目前是否拥有自有产品或服务？（是/否）
  - 2. 你是否掌握可稳定获取的流量渠道？（是/否）
  - 3. 若两者皆无，建议优先切入哪一端？为什么？
  - 回答问题：
  - '- 列举一个你身边只做流量端的普通人案例（如分销、带货），其核心变现逻辑是什么？'
  - '- 列举一个只做产品端但缺乏流量的案例，其面临的主要困境是什么？'
- 'no': 3
  title: AI替代风险自查
  contents:
  - 请梳理你目前的主要收入来源所依赖的工作内容：
  - 1. 该工作是否包含高度标准化、可重复的流程？
  - 2. 是否主要出卖时间和体力？
  - 3. 若AI未来可低成本完成该工作，你的议价力将如何受影响？
  - 回答问题：
  - '- 你可以向哪个层级（L2稀缺资源或L3规则制定）跃迁？'
  - '- 需要积累哪些‘稀’且‘缺’的社会资源作为护城河？'
