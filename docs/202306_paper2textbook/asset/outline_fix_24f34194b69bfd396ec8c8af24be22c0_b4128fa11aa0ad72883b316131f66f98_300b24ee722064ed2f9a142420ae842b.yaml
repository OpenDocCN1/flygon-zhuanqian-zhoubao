'no': 1
name: 私域流量运营 —— 把微信变成自动化营销操作系统
desc: 本章系统拆解微信原生功能组合拳，将通讯工具重构为覆盖用户资产管理、内容触达优化、社群精细化运营、安全合规护城河的私域营销基建体系，解决“知功能、不懂场景、不会组合”的实操痛点。
nodes:
- 'no': 1
  name: 私域运营的底层逻辑：注意力管理与信任分层
  desc: 私域成功的关键不在于加多少好友、发多少广告，而在于管理自身注意力（折叠群/关注成员/消息提醒）与争取用户注意力（首句钩子/发布间隔/互动权重），并通过备注-标签-描述、分组可见、付费门槛实现用户信任等级的精细分层与差异化价值交付。
  role: motivation
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 2
  name: 工具即基建：微信原生功能深度开发优于外部工具叠加
  desc: 微信原生功能（收藏、笔记、标签、群管理、安全中心等）已覆盖私域运营90%以上高频需求。深度挖掘原生功能组合拳（单人群+收藏+标签=知识库；标签+群发+备注=CRM）比引入外部SCRM工具更低成本、零迁移风险、数据主权完全可控。
  role: definition
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 3
  name: 单人群：零成本搭建个人知识管理中枢
  desc: 利用‘面对面建群’或‘邀请好友后踢人’创建仅含自己的群聊，作为私有化的云端收藏夹、资料库、灵感记录本及待办清单，实现多端同步、分类存储、置顶快捷访问，替代专业笔记软件核心功能。
  role: method
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 4
  name: 好友三维标签体系：备注-标签-描述的精准用户画像结构
  desc: 构建‘备注（身份-昵称-业务）+ 标签（群体属性）+ 描述（详细画像/资料）’的三维结构，支撑精准群发（<200人/标签）、快速检索、分层运营及SOP执行，是私域精细化运营的数据地基。微信单次群发200人上限倒逼标签组精细化运营。
  role: method
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 5
  name: 消息置顶SOP：群内信息的‘黄金曝光位’精细化运营
  desc: 将群公告与聊天置顶标准化为‘新人引导+核心价值交付+时效性管理’动态机制：置顶高价值内容降低新用户认知成本，及时取消过期置顶避免信息噪音。建群前必须明确目的、设定规则、准备价值（三前置原则）。
  role: method
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 6
  name: 群聊分层过滤与重点突破：折叠群+关注核心成员
  desc: 利用‘消息免打扰-折叠该群聊’实现低频群物理隔离与批量清理，配合‘关注核心成员（最多4人）’穿透免打扰屏障获取关键信息，构建‘分层过滤+重点突破’的注意力管理模型。
  role: method
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 7
  name: 标签化精准群发操作法：合规触达与转化的标准化流程
  desc: 基于三维标签体系建立‘单标签<200人’合规群发池，执行‘内容预编辑+标签筛选+引导交互关键词（回复1/2）+及时人工回复+聊天记录备份’标准化流程，规避封号风险，提升触达转化率。
  role: method
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 8
  name: 付费社群筛选与运营模型：付费=筛选+激励+承诺
  desc: 通过设置入群门槛筛选高意向用户，利用沉没成本激励运营者持续产出，配合‘群规前置+违规即踢+一群一事’严格治理机制，构建高粘性、高转化、可复制的付费社群闭环。
  role: method
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 9
  name: 朋友圈折叠算法对抗策略：六维内容发布策略最大化触达
  desc: 针对‘同一时间多条折叠、营销内容折叠、复制内容折叠’机制，提出‘首句钩子+表情符+发布间隔控制+图文混排+谐音字规避+高互动权重’六维策略。经验规律：同一时间高频发布、内容重复、复制粘贴痕迹重、营销敏感词命中是四大触发条件。
  role: method
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 10
  name: 朋友圈自定义位置/IP标签化：零成本高曝光个人品牌广告位
  desc: 利用位置创建功能植入个人品牌口号、课程名、项目名；利用#话题标签聚合内容入口。配合封面视频化/专业化、评论区二次传播，构建立体人设，对抗‘触达不足200人’的社交图谱衰减。
  role: method
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 11
  name: 朋友圈故事化连载运营法：将单条内容转化为长期内容IP
  desc: 采用‘预告造势（定点发布）+ 标签串联（#故事分享1/2/3）+ 悬念设计’连载制策略，利用算法推荐机制与用户好奇心心理，提升用户粘性与主动搜索行为。
  role: method
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 12
  name: 朋友圈分组可见与动态权限管理：四层权限模型平衡隐私与营销
  desc: 建立‘公开-部分可见(标签/个人)-不给谁看-仅自己可见’四层权限模型，配合‘发布后修改可见范围’容错机制，实现同一内容库对不同信任层级用户的差异化触达。
  role: method
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 13
  name: 微信原生生产力工具链：采集-加工-输出-传输闭环体系
  desc: 整合收藏/笔记/备忘录/文件传输助手/长图生成/图片文字识别/边写边译/语音转文字等功能，形成闭环生产力体系，替代第三方工具，降低切换成本，实现数据微信生态内闭环。
  role: extension
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 14
  name: 隐私与资产安全防护体系：全方位账号安全与数据资产保护框架
  desc: 涵盖青少年模式防拉黑（关系锁定）、应急联系人/安全中心（账号兜底）、授权管理（数据隔离）、查询实名账号（资产清查）、关闭自动扣费/下载（资源保护）、聊天记录迁移导出（数据资产迁移）六大模块。
  role: extension
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 15
  name: 青少年模式反向应用：防拉黑/关系锁定功能的实测可行性
  desc: 开启青少年模式设置监护人后，被监护人无法单方面删除好友/拉黑，实现‘防拉黑、防删除’的关系锁定，适用于家人、情侣等核心强关系维护，经实测流程可行。
  role: experiment
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 16
  name: 微信收藏‘转存为笔记’：群聊记录结构化沉淀的实测路径
  desc: 验证‘多选聊天记录→收藏→转存为笔记→转发/复制’完整路径，可将碎片化群聊记录一键转化为结构化文档，支持二次编辑、长图导出、跨平台分享，解决群聊知识‘沉底难寻、难整理’痛点。
  role: experiment
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 17
  name: 长按相册调用系统原相机：提升业务场景拍摄清晰度的隐藏技巧
  desc: 聊天界面‘+’号菜单中长按‘相册’2秒可直接调用手机系统原生相机（支持锁定对焦、变焦、曝光调节），绕过微信内置压缩相机，显著提升发货单、产品图、会议白板等业务场景拍摄清晰度。
  role: experiment
  src:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
- 'no': 18
  name: 微信‘问一问’：视频号冷启动的高性价比流量入口
  desc: 利用微信搜一搜内的UGC问答社区，通过AI提示词投喂训练生成符合平台标准（真实、精炼、多媒体、排版舒适）的高质量回答，获取首页推荐与搜一搜曝光，并通过视频号视频挂载引流至私域。
  role: method
  src:
  - paper: docs/202306/DyNYdmVkAodKlZxA2Qacr9gFnTf.md
  - paper: docs/202306/JcEEdG3REoCSaVx079Dc8EoznXb.md
- 'no': 19
  name: 微信账号封号风险与异常值机会：从侵入式工具到RPA模拟人工
  desc: 腾讯风控升级导致Wetool等侵入式营销工具全面失效，模拟人工操作的RPA/无障碍服务方案成为相对安全的过渡方案。iOS与Android微信原生“群发助手”存在系统性功能差异（iOS独占朋友圈置顶，Android支持标签群发且单次可超200人），利用此类平台规则信息差结合技术优势切入私域服务赛道是可行的赚钱路径。
  role: limitation
  src:
  - paper: docs/202306/SswzdpTECoTtaBxuCrdc5mninZd.md
- 'no': 20
  name: 视频号定制品带货模式：先下单后备注的转化流程重构
  desc: 利用视频号短视频/直播流量，销售需个性化刻字/定制的非标品（如黑檀木吊坠），通过私域或视频号小店承接订单，由供应链代发的轻资产电商模式。重点拆解‘先下单后备注’反向操作流程、置顶教学视频兜底转化及跨平台爆款数据选品法。
  role: method
  src:
  - paper: docs/202306/AHYMdjjtrosYPYxcfVZcau6Lnkc.md
- 'no': 21
  name: 知识星球内容实时推送机器人：自动化工具降低信息获取成本
  desc: 一种将知识星球指定分类内容（最新话题、风向标）自动抓取并通过企业微信群机器人实时推送至个人微信的轻量级自动化工具，解决用户因时间碎片化导致的信息获取滞后问题。涵盖企业微信群机器人Webhook接入、知识星球非官方API爬取、INI配置驱动定时任务调度、Linux后台部署运维等技术路径。
  role: method
  src:
  - paper: docs/202306/BNZsd608eoQZffxlFzccXVVmnbb.md
- 'no': 22
  name: 抖音SEO：热门词优先与合集权重叠加的搜索流量获取
  desc: 系统阐述抖音SEO（搜索引擎优化）的实操方法论，核心主张通过“选热门词、重合集权重、多维度踩词布局、豆荚辅助数据权重、持续维护更新”实现长期精准搜索流量获取，并强调搜索流量精准度高、转化价值大，最终目标是通过延伸价值引流至私域转化。
  role: method
  src:
  - paper: docs/202306/CgDFdeYEpoAAWFxjhC0cjtcOnLf.md
- 'no': 23
  name: 赚钱圈子婚恋匹配场：婚姻ROI超越创业定理
  desc: 将婚姻选择视为人生中最重要的创业项目，主张利用“赚钱圈子”（如生财有术）作为寻找伴侣的高质量流量池，核心观点是“找对对象抵得过3次创业成功”，系统论证了为何应利用垂直付费成长社群作为婚恋匹配场，并给出航海自我介绍、发帖软植入、线下活动参加、官方交友活动四步实操方案。
  role: extension
  src:
  - paper: docs/202306/KBlWdtwzOo1B2hxB11BcXoeGnJc.md
- 'no': 24
  name: 朋友圈自动成交系统：标准化内容布局与转化微技巧
  desc: 系统阐述了零基础小白如何从0到1打造“朋友圈自动成交系统”的完整方法论，核心在于通过宏观布局（每日4-8条、四大板块固定占位）、微观策划（素材获取与文案“道术”结构）、硬广差异化（五大展示维度）、软广深度埋钩（心智占领）及自动成交微技巧（少即是多、对话感、图文协调、排版优化、好友精简）五大模块，将朋友圈运营转化为可复制、可执行的标准化动作流程。
  role: method
  src:
  - paper: docs/202306/Lq6jdKMoOolvwZxS4s3cmCqMnbf.md
- 'no': 25
  name: 海外线下组局与结果导向吸引链接：社交效率与商业模式筛选
  desc: 记录了生财有术第7期日本站首次线下组局活动，总结海外圈友抱团取暖、跨行业合作探索的实战经验，包含Web3合规离岸运营模式、微信小程序跨境闭环模型、ChatGPT+实体机器人风口论等概念；同时阐述“结果导向吸引链接”替代“主动链接”的高阶社交策略，以及轻资产可放大商业模式的筛选标准。
  role: extension
  src:
  - paper: docs/202306/20230613_247.md
  - paper: docs/202306/Nz18d0VBjo3lVRxWcG1cYKkCnDe.md
- 'no': 26
  name: 风向标项目生命周期：低门槛项目红海化与卖铲子者模式
  desc: 剖析小红书‘群聊禁言’项目的全流程复盘，揭示“风向标”曝光后项目经历‘蓝海发现→验证闭环→公开曝光→千人下场→价格战红海化’的完整周期。核心主张：从风向标赚钱需要刻意练习，小白需先做快速行动者积累反馈，进阶为思路优化者建立差异化，最终转型为资源沉淀者实现跨越式收益。
  role: extension
  src:
  - paper: docs/202306/W8wjdOat3o0F5xx2UpIcsTienge.md
- 'no': 27
  name: 尼斯分类：商品和服务国际分类体系与商标条目选择
  desc: 系统梳理《商品和服务国际分类（尼斯分类）》第1-45类的完整框架，详细列出每个大类的类别名称、类似群代码及群组名称，并配合图示阐述了商品/服务选择的三大核心原则（确定使用范围与类别、选取具体商品/服务项目、跨群组防御性保护）以及选择时的层级规范（严禁使用类别名/群组名，必须选取具体条目）。
  role: definition
  src:
  - paper: docs/202306/OpXIdbXvZoXp1HxU0BLcH4TtnHe.md
- 'no': 28
  name: 小说推文差异化平台运营：引流漏斗关键节点与风控对抗
  desc: 系统梳理了小说推文业务在抖音、快手、视频号、小红书、B站五大主流平台的差异化特性与运营策略，提出“平台视角”作为底层逻辑，深度拆解了从视频曝光到知乎搜索转化的用户路径漏斗，重点攻克“找后续”（视频水印、评论区表情包/养号引导、主页设置）与“关键词设置”（规避同音字/助词干扰、品牌化前缀）两大核心转化节点的防风控引流技巧，并总结出从粗放式向精细化运营转型的行业趋势。
  role: method
  src:
  - paper: docs/202306/QlUMdZfACoJhFNxp97RcvXygntf.md
