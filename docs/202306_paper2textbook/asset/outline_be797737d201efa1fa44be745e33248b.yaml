- 'no': 1
  name: 认知觉醒与财富跃迁 —— 从“打工思维”到“商业认知”的底层逻辑重构
  desc: 本章通过分析普通人从月薪几千到年入百万的真实案例，揭示财富增长的核心不在于勤奋，而在于认知模式的根本性跃迁：从出卖时间换取线性收入，转向构建产品化能力、利用杠杆放大价值、掌握稀缺资源与制定规则的四阶段进化路径。
  nodes:
  - 'no': 1
    name: 打工致富的不可能性与“血酬”陷阱
    desc: 企业本质是帮助无法直连市场的个体完成交易的中介，薪资经层层筛减后所剩无几；出卖时间健康换取的线性收入（血酬）缺乏杠杆，将被AI彻底取代。
    role: motivation
    src:
    - paper: docs/202306/20230613_177.md
    - paper: docs/202306/20230613_182.md
  - 'no': 2
    name: 财富获取的四阶段跃迁模型：从廉价零件到高维整合者
    desc: 个人财富模式进化路径：出卖时间/劳动力 → 产品/服务变现（超级个体） → 商业系统杠杆（资源构建者） → 多系统整合（高维整合者），每阶段核心能力与护城河迭代升级。
    role: definition
    src:
    - paper: docs/202306/20230613_177.md
    - paper: docs/202306/20230613_182.md
  - 'no': 3
    name: 专长与媒体杠杆：指数级财富效率的核心公式
    desc: 财富效率跃迁依赖‘专长’作为支点、‘媒体/产品杠杆’作为放大器；AI时代大幅降低代码/内容生产门槛，普通人可构建零边际成本复制的商业系统。
    role: method
    src:
    - paper: docs/202306/20230613_177.md
    - paper: docs/202306/20230613_101.md
  - 'no': 4
    name: 稀缺社会资源与规则制定者：从守擂到攻擂再到坐庄
    desc: 财富本质是持续从社会提取剩余；掌握‘稀’（总量有限）且‘缺’（刚需必不可少）的资源可获租金；最高阶是建立生态制定规则（庄家），实现赢家通吃与自复制滚雪球效应。
    role: extension
    src:
    - paper: docs/202306/20230613_182.md
  - 'no': 5
    name: 认知觉醒五维重构：钱的本质、富人思维、低认知清洗、资源积累、反节省时间
    desc: 普通人变现的前置条件是完成底层认知重构：钱是交换价值而非存量；模仿有钱人底层逻辑；去除消耗资源型做事；积累复利资产（技能/IP/系统）；敢于在高杠杆活动上投入时间而非省时间。
    role: method
    src:
    - paper: docs/202306/20230613_100.md
  - 'no': 6
    name: 扬长避短的优势变现策略：利用核心优势而非补齐短板
    desc: 个人商业成功取决于核心优势项（如学习、思维、成就）的极致发挥，而非劣势项（如取悦、沟通）的平庸修补；通过优势测评定位，转向高杠杆赛道实现快速变现。
    role: method
    src:
    - paper: docs/202306/20230613_100.md
- 'no': 2
  name: 商业模式设计与顶层架构 —— 从“赚第一桶金”到“年入千万”的系统化构建
  desc: 本章系统拆解从0到1跑通商业闭环、从1到10规模化放大、从10到100组织化扩张的三阶段方法论，核心在于产品选择、利润结构、流量获取、组织架构与资本运作的顶层设计，而非单纯的执行勤奋。
  nodes:
  - 'no': 1
    name: 商业模式公式与三要素：利润 = (收入-成本) × 频次 × 周期
    desc: 好的商业模式即赚钱、高频、可持续；需从人力/资金/智力三类成本中找到自身可控优势，定位平台-内容-运营三要素中的‘运营’角色，实现效率提升变现。
    role: definition
    src:
    - paper: docs/202306/20230613_007.md
  - 'no': 2
    name: 千万商业模式三支柱：好产品、高利润、上规模
    desc: 年入千万需满足：产品定生死（好卖、高客单、高毛利）、利润空间巨大（信息差碾压、赚有钱人零花钱）、规模可放大（人的规模裂变+钱的规模付费流量），缺一不可。
    role: definition
    src:
    - paper: docs/202306/20230613_254.md
  - 'no': 3
    name: 裂变式阿米巴组织模型：产品矩阵+分销团队+付费流量+人才孵化
    desc: 突破超级个体300万天花板的组织化方案：阶梯客单产品矩阵（99-99999）→ 阿米巴分销团队裂变 → 付费流量招募合伙人加速 → 从合伙人筛选人才开发新品，形成自我进化飞轮。
    role: method
    src:
    - paper: docs/202306/20230613_254.md
  - 'no': 4
    name: 三阶段发展模型：0-1死磕单项目、1-10同平台矩阵复制、10-100老板打天下员工守天下
    desc: 垂直电商卖家成长铁律：0-1阶段跑通单店盈利模型；1-10阶段在同平台复制店铺矩阵放大流量（经验复用、SOP标准化）；10-100阶段老板亲自研判新平台/新品类（打天下），员工执行SOP（守天下），接受账号存活率的概率分布特性。
    role: method
    src:
    - paper: docs/202306/20230627_066.md
  - 'no': 5
    name: 长线业务与品牌资产沉淀：业务-品牌-个人IP三层级容错策略
    desc: 持续盈利的确定性锚点是长线业务（核心能力标准化+短长周期产品矩阵）；受阻时退而做长线品牌（业务可变品牌不变）；再退而做个人品牌（产品皆变IP不变），确保每一份付出可积累、可复利。
    role: extension
    src:
    - paper: docs/202306/20230613_255.md
  - 'no': 6
    name: 代运营2.5模式：连接2.0传统商家向3.0认知商业转型的中介层
    desc: 核心价值在于用新商业认知替代传统商家低效自我摸索，采用‘轻资产主体公司+深度利益捆绑合伙人+项目独立核算+知识壁垒积累’架构，仅赚取‘从1到10’的效率提升收益，实现现金流安全与规模扩张并行。
    role: method
    src:
    - paper: docs/202306/20230613_007.md
    - paper: docs/202306/20230613_178.md
    - paper: docs/202306/20230613_250.md
- 'no': 3
  name: 流量获取与私域转化实战 —— 从“公域种草”到“私域成交”的标准化作业流程
  desc: 本章聚焦小红书、抖音、视频号、闲鱼、拼多多等主流平台的流量获取、内容生产、引流转化、私域承接全链路SOP，强调选品决定上限、素材决定下限、投流只是放大器，以及低成本矩阵化操作与高客单价私域成交的组合拳打法。
  nodes:
  - 'no': 1
    name: 平台算法底层逻辑与信任智能投放：曝光分配与排序决定的双权模型
    desc: 电商平台仅掌握曝光分配与排序决定权，目标函数为最大化GMV与用户留存；新人应无脑选择‘系统智能投放’而非人工定向，给算法24小时探索时间，信任算法比人更懂用户。
    role: definition
    src:
    - paper: docs/202306/20230613_256.md
    - paper: docs/202306/20230613_280.md
  - 'no': 2
    name: 小红书电商冷启动SOP：权重诊断→爆款选款→测款放量→六维去重→诱饵定价→评论造势
    desc: 账号权重分级（<几十注销、200+正常、1000+高权重）→ 爆款复发定律（历史爆款再爆概率高）→ 测款先行（低频测选题/形式）→ 六维去重组合拳（画中画+滤镜+调参+镜像+抽帧+挡脸）→
      优惠券诱饵定价（高标价+大额券引爆首单→爆款后取消优惠回归利润）→ 评论区运营战术（买家秀自问自评+争议话题+限时福利）。
    role: method
    src:
    - paper: docs/202306/20230613_288.md
  - 'no': 3
    name: 抖音图书带货投流闭环：随心推养模型+千川高峰起量+数据反推出价+正负反馈博弈
    desc: 随心推24h智能投放养模型（自动出价+ROI目标+容亏心态）→ 千川高峰期一键起量（早6-7/中11-12/晚8点前30分钟开启，2-6小时）→
      随心推数据反推千川出价（平均客单价×佣金率→过新手期÷1.2）→ 正负反馈博弈（降价=负反馈需配合加预算=正反馈，确保正>负）→ 点击不转化素材直接废弃换新。
    role: method
    src:
    - paper: docs/202306/20230613_280.md
  - 'no': 4
    name: 闲鱼二手书项目：资质门槛建立护城河+宏观需求驱动+标准化运营SOP
    desc: 出版物经营许可证为核心准入壁垒；大学教材管控放开、大学生接受度提升、消费降级三重驱动需求增长；选品定生死、基本功扎实（号/图/文/价）、做平台鼓励的事（降价/优详情/任务/服务）、运气不好多试几次（下架重发）、卖出别惹事（控纠纷/重好评）。
    role: method
    src:
    - paper: docs/202306/20230613_256.md
    - paper: docs/202306/20230627_012.md
  - 'no': 5
    name: 短视频矩阵AB话术引流：差异化话术测试+多形态组合拳+私域分层转化
    desc: A/B组话术轮换测试规避风控筛选高意向用户→ 视频/图文/挂榜/主页留痕/询盘关键词/弹幕截流组合拳 → 私域承接分层变现（资料包9.9-29.9→收徒299-999→高客单社群），标准化SOP经实测可跨行业复制，流量成本降70%、月变现30万+。
    role: method
    src:
    - paper: docs/202306/20230613_279.md
  - 'no': 6
    name: 拼多多短视频带货新手入局：矩阵起号+权限速通+数据驱动选品+竞品逆向二创
    desc: 低门槛、去中心化分发、极致性价比用户心智、易矩阵放大；批量养号模拟真实行为→最短路径达标开通带货权限→多多进宝/商家后台/达人广场筛选高佣/低价/高销量/高DSR商品→采集竞品爆款视频去水印→镜像/调速/抽帧/混剪/加字幕音乐/修改MD5发布测试原创度。
    role: method
    src:
    - paper: docs/202306/20230613_291.md
  - 'no': 7
    name: 高客单价私域成交闭环：信任前置+梯度产品+评论区深度运营+同城精准流量
    desc: 高客单赛道（珠宝/玄学/定制品）粉丝量与变现额解耦（百粉变现、三百粉二十万）；公域内容仅筛选建立专业人设，核心成交沉淀私域（微信/朋友圈）长周期信任积累；梯度产品设计（引流款→入门款→旗舰款，锚定效应提升首单均价）；互动型笔记（自测工具+课程洗脑）建立信任；评论区深度互动用户=高转化意向用户；本地服务型商家同城精准流量>泛流量。
    role: method
    src:
    - paper: docs/202306/20230613_285.md
    - paper: docs/202306/20230613_287.md
    - paper: docs/202306/20230613_289.md
    - paper: docs/202306/20230613_313.md
- 'no': 4
  name: 内容生产与个人IP建设 —— 从“被动消费”到“主动生产”的杠杆化输出体系
  desc: 本章阐述为何要做内容生产者而非消费者，如何通过结构化复盘、模板化Prompt、AI工具链实现高效内容生产，以及个人IP如何成为最大护城河，最终实现‘好模式自带流量’的质变。
  nodes:
  - 'no': 1
    name: 生产者身份转换与媒介选择：文字为深度内容的最优载体
    desc: 主动停止高耗时低价值消费，转向内容生产建立资产型输出；深度干货内容文字载体成本最低、效率最高、沉淀最好、粘性最强、商业价值最高（公众号>小红书>B站>视频号>抖音>快手），短视频纯口播信息密度反而低于文字。
    role: motivation
    src:
    - paper: docs/202306/20230613_091.md
    - paper: docs/202306/20230613_180.md
  - 'no': 2
    name: AI赋能内容生产全流程：Prompt工程+多模态工具链+标准化SOP
    desc: ChatGPT生成文案/分镜/藏头诗 → Midjourney生成关键帧图片 → 3秒/张轮播合成视频 → AI换脸/数字人合成祝福视频 → RPA自动化多平台分发；结构化Prompt框架（产品卖点+爆款标题+行业关键词+平台风格）实现90分高质量笔记、30倍效率提升。
    role: method
    src:
    - paper: docs/202306/20230613_271.md
    - paper: docs/202306/20230613_273.md
    - paper: docs/202306/20230613_283.md
    - paper: docs/202306/20230613_288.md
  - 'no': 3
    name: AI写作双轮驱动商业模型：前端店铺矩阵分发+后端工厂标准化生产
    desc: 前端多平台矩阵获客（淘宝/小红书/抖音/视频号/私域）→ 后端写作工作室SOP标准化（选题库/大纲模板/Prompt库/质检清单+作家招募培训考核分级）→
      衍生品矩阵（AI小说推文+绘画+自媒体流量变现 + 写作培训付费社群合伙人模式）→ 资源整合闭环（IP反哺流量、人才共用、技术复用）。
    role: method
    src:
    - paper: docs/202306/20230613_271.md
  - 'no': 4
    name: 个人IP是存量时代的最大护城河：信任预制+产品标准化→被动转化
    desc: AI工具普及导致生产技术同质化，唯有真实成绩背书、公开复盘、情感连接建立的个人品牌，才能溢价获客、吸引优质合伙人、实现流量资产私有化；‘一两个月从认识到转化、几乎无沟通’的被动成交源于公域内容预制信任+私域强化+标准化服务产品降低决策门槛。
    role: extension
    src:
    - paper: docs/202306/20230613_271.md
    - paper: docs/202306/20230627_067.md
  - 'no': 5
    name: 知识付费载体选择决策模型：垂直度-客单价/周期-受众画像三维匹配
    desc: 泛垂类适配知识星球（UGC+迭代）；垂类/标准化知识适配线上培训/小报童买断；低客单星球双重价值（知识沉淀库+大会员筛选漏斗），无高客单后端不可持续；高低客单价相对受众画像而非绝对金额；私董会多为老板建联俱乐部，真私董会运营门槛极高。
    role: method
    src:
    - paper: docs/202306/20230613_102.md
  - 'no': 6
    name: 好模式自带流量：从‘流量找模式’转向‘模式生流量’的质变
    desc: 当交付体系极致、代理成材率高、合伙人赚钱效应强时，形成口碑裂变与自发传播，流量成为模式运行的自然副产品而非投入项；核心杠杆在于‘交付’与‘货盘’的极致化，而非盲目买流量。
    role: extension
    src:
    - paper: docs/202306/20230613_097.md
    - paper: docs/202306/20230613_254.md
- 'no': 5
  name: 执行力与复盘闭环 —— 知行合一、PDCA循环与‘想全是问题、做才有答案’的行动哲学
  desc: 本章直击‘知道很多道理却过不好这一生’的知行分离痛点，提出执行力是竞争壁垒的落地保障，通过PDCA循环、即知即改、最小可行性行动（MVP）、结构化复盘输出等方法论，构建从认知到结果的高效转化闭环。
  nodes:
  - 'no': 1
    name: 知行合一的真谛：知到即改正、即执行，而非囤积知识
    desc: 结果源于执行彻底度而非知识量；企业管理口号化、个人成长停滞的根因是‘执行松懈马虎’；听众将‘压月发薪’改为按时发薪，证明‘知即改、即执行’能直接转化结果。
    role: definition
    src:
