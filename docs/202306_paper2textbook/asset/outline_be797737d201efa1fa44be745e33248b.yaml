    role: method
    src:
    - paper: docs/202306/20230613_265.md
    - paper: docs/202306/20230627_074.md
  - 'no': 4
    name: 复盘即产出：结构化输出倒逼深度思考，建立正反馈飞轮
    desc: 将复盘过程视为核心产出物，通过‘教会他人/发布精华帖’标准倒逼内化深度；主动输出→倒逼输入→获得正反馈（精华帖/点赞/职场反哺）→ 强化信心→持续迭代；职场中迁移‘复盘思维/结果导向/标杆拆解’提升主业决策质量。
    role: method
    src:
    - paper: docs/202306/20230613_262.md
