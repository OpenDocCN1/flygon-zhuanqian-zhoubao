  desc: 本章从风险管理、决策判断、博弈策略三个维度，提供在不确定性中生存发展的核心思维工具箱：非对称赔率下的‘只需富一次’原则、创业概率论的百次试错法则、第一性原理拆解商业本质、反脆弱从波动中获益、宏观周期博弈与认知边界圈定。
