  - 'no': 2
    name: PDCA循环：打破业务瓶颈的通用底层能力
    desc: Plan-Do-Check-Act管理循环是‘做好任何事的底层能力’；作者从摄影师转行服装品牌，仅用纯自然流量3个月将单场GMV从200提升至10万，验证PDCA在直播电商冷启动阶段的决定性作用。
    role: method
    src:
    - paper: docs/202306/20230613_277.md
