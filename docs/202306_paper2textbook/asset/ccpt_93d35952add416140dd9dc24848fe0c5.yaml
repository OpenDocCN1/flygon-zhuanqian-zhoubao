paper: docs/202306/20230613_305.md
desc: 该素材是一篇典型的互联网“野路子”副业推广笔记，作者声称通过点击石墨文档链接获取的“赚钱信息”，仅用3小时实现900元收益，核心意图是利用高收益诱饵引导读者点击外部链接（疑似流量变现、CPA拉新或灰产引流），评论区进一步揭示其技术实现可能涉及安卓端自建服务器调用API，且存在服务器被封、法律合规等风险，作者甚至建议规避熟人销售以规避风险。
concepts:
- name: 三小时九百元速富叙事
  desc: 一种利用极短时间、高额回报的具体数字组合，制造‘低门槛、高收益、见效快’心理锚点的营销话术模式。
  is_original: false
  excerpt:
  - 早上发现一个赚钱的秘密，我用了 3 个小时我赚了 900➕！
- name: 石墨文档跳转漏斗
  desc: 利用石墨文档等协作办公平台的公开链接特性，绕过社交平台外链拦截，承载诱导性内容并引导用户进一步转化的流量中转技术手段。
  is_original: false
  excerpt:
  - 打开一下链接就行 《我在朋友圈发现一个赚钱信息！》，可复制链接后用石墨文档 App 打开 风向标 https://shimo.im/docs/m5kvdD1YNOFJgM3X/
- name: 安卓端自建服务器API调用模式
  desc: 评论区技术推测的底层架构：通过自建服务器中转调用第三方API，客户端打包为安卓App分发，属于典型的‘套壳’或‘代理’灰产技术形态。
  is_original: false
  excerpt:
  - 如果是 Android 的 App，应该是自己搭建的服务器，后台调用的 API。
- name: 服务器封禁与法律合规风险
  desc: 该模式面临的核心运营风险：因违规调用接口、内容违规或诈骗投诉导致服务器被服务商封禁、IP封锁或面临法律追责。
  is_original: false
  excerpt:
  - 这种有个会风险，就是用的人多了，服务器被关了之类。
- name: 熟人规避销售策略
  desc: 操作层面的风控手段：建议不向熟人推销，以降低实名举报、信任崩塌及法律追溯至真实身份的概率。
  is_original: false
  excerpt:
  - 考虑到这种风险，不太建议卖给熟悉的人 😂
methods:
- name: __overview__
  desc: 全链路‘钩子-跳转-变现-风控’操作流：1. 发布高收益截图/文案制造焦虑与渴望（钩子）；2. 引导点击石墨文档链接绕过平台风控（跳转）；3. 在落地页诱导下载App/填写信息/缴纳会员费实现变现（变现）；4.
    采用陌生人社交裂变、规避熟人、频繁更换域名/服务器应对封禁（风控）。
  excerpt:
  - 早上发现一个赚钱的秘密，我用了 3 个小时我赚了 900➕！
  - 打开一下链接就行 《我在朋友圈发现一个赚钱信息！》，可复制链接后用石墨文档 App 打开 风向标 https://shimo.im/docs/m5kvdD1YNOFJgM3X/
  - 如果是 Android 的 App，应该是自己搭建的服务器，后台调用的 API。这种有个会风险，就是用的人多了，服务器被关了之类。考虑到这种风险，不太建议卖给熟悉的人
    😂
theorems:
- name: 高收益叙事驱动转化率假说
  desc: 宣称‘3小时赚900+’的具体化收益叙事，能有效降低受众决策门槛，驱使其打破防备点击不明链接。
  excerpt:
  - 早上发现一个赚钱的秘密，我用了 3 个小时我赚了 900➕！那我怎么做到的？打开一下链接就行
- name: 平台风控规避技术优先论
  desc: 利用石墨文档等正规SaaS工具作为跳板页，是当前私域/灰产引流规避微信等平台域名拦截的最优解。
  excerpt:
  - 可复制链接后用石墨文档 App 打开 风向标 https://shimo.im/docs/m5kvdD1YNOFJgM3X/
- name: 非熟人社交降维打击风控策略
  desc: 在高风险灰黑产项目中，刻意避开熟人社交圈层进行推广，能显著降低账号封禁、实名暴露及法律追责的系统性风险。
  excerpt:
  - 考虑到这种风险，不太建议卖给熟悉的人 😂
findings:
