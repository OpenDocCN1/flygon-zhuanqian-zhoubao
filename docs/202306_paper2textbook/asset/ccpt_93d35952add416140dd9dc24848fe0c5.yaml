  desc: '[claim] 作者声称通过该方法在3小时内获得900元以上收益。'
  excerpt:
  - 我用了 3 个小时我赚了 900➕！
- name: 技术架构为安卓客户端+自建服务器代理API
  desc: '[evidence] 评论区技术人员基于经验推断，该‘赚钱项目’本质是安卓App前端+自建服务器后台代理调用第三方API的架构，而非作者宣称的‘发现秘密’。'
  excerpt:
