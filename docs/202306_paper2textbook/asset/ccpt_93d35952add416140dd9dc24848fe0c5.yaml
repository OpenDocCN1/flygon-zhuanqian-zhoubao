- name: 项目存在服务器被封停的高概率运营风险
  desc: '[evidence] 评论区明确指出‘用的人多了，服务器被关了’是确定性风险，印证该模式不可持续、抗风险极低。'
  excerpt:
  - 这种有个会风险，就是用的人多了，服务器被关了之类。
- name: 推广者具备明确的规避法律与平台风控主观意图
  desc: '[evidence] 推广者建议‘不卖给熟悉的人’，证明其明知项目违规/违法，主观上采取措施规避熟人举报及身份暴露。'
  excerpt:
  - 考虑到这种风险，不太建议卖给熟悉的人 😂
