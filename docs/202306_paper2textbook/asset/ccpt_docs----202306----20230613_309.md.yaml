paper: docs/202306/20230613_309.md
desc: 该素材是一份关于线下组局（聚会/研讨会）的标准作业程序（SOP）全流程文档，详细规定了从组局前准备（主题确认、选址、报名、物料、预算、现场布置）到组局中执行（开局规则、自我介绍）的标准化操作步骤、时间节点、角色分工及管控机制，旨在通过流程固化提升线下深度交流活动的组织效率与产出质量。
concepts:
- name: 组局官
  desc: 活动的发起者、统筹者与执行者，负责全流程决策、资源协调、现场管控及成果交付，是SOP中的核心责任主体。
  is_original: true
  excerpt:
  - SOP【组局官】 1、确认组局主题，目标，时间，并发起组局官报名...
  - 3、坐 G1003 次耗时 42 分钟 12 点到达广州，安排 Mo.gz 把会务物料 13 点带到会议场地，来来和 Mo.gz13 点到达会场开始布置现场...
- name: 双周节奏
  desc: 组局活动固定的时间周期单位，规定了报名、准备、执行的固定时间窗口（如每双周二/五/六），形成组织肌肉记忆。
  is_original: true
  excerpt:
  - 每双周二 21 点开始，22 点结束
  - 每双周五 21 点开始，22 点结束
  - 每双周六 12 点开始，预计 18 点结束
- name: 押金机制
  desc: 通过收取押金并设定‘24小时未交押金移除群聊’、‘放鸽子扣除费用’的规则，利用沉没成本约束参会者履约，降低临时爽约率。
  is_original: true
  excerpt:
  - 根据预算发起群收款：核实成员押金情况，24 小时未交押金移除群聊
  - 告知参与这活动结束要分享自己的心得，正常参与活动 AA 制支出费用并退还多余押金，放鸽子会扣除费用。
- name: 手机上缴制
  desc: 强制参会者全程上交手机统一保管，仅保留组局官一台录音设备，物理隔绝外部干扰，强制实现‘全程投入’与‘真诚开放’的会议氛围。
  is_original: true
  excerpt:
  - 请大家全程不玩手机，手机上缴统一保管；组局官会安排 1 个手机全程录音最后分享给大家录音文件
- name: 参会者手册
  desc: 将会议概述、流程、全员介绍汇编印刷成册，配合笔发放给每位参会者，作为线下会议的信息对齐工具与沉浸式体验载体。
  is_original: false
  excerpt:
  - 参会者手册（将会议概述，会议流程，所有人的介绍汇聚成一个手册并打印，给线下在场参与者每人发一份和一支笔）
- name: 结构化自我介绍
  desc: 要求参会者按‘一个难题、一个方案、一个0-1案例’的固定模板进行自我介绍，将非结构化交流转化为可积累、可对比的知识资产。
  is_original: true
  excerpt:
  - 1》每人提出 1 个自己对 AI 在电商领域中应用中遇到的难题？
  - 2》每人提出 1 个自己觉得化解上述难题的 1 个解决方案
  - 3》每人提出 1 个自己从 0 到 1 跑通 AI 在电商领域引用的案例
methods:
- name: __overview__
  desc: 线下组局全流程标准化操作法：以‘双周节奏’为时间骨架，以‘组局官’为责任中枢，分‘组局前（策划-选址-招募-物料-布置）’与‘组局中（规则-介绍-讨论）’两大阶段，通过‘押金机制’保出席、‘手机上缴’保专注、‘结构化模板’保产出，实现低成本、高确定性的线下深度连接。
  excerpt:
  - SOP【组局官】 1、确认组局主题，目标，时间... 2、3 选 1 确认场地... 3、坐 G1003 次...
  - 3.2、每周五 22 点开始... 选址、预算、收款、自我介绍、同步流程、场地引导、制定详细方案
  - 开局规则：真诚开放、全程投入、互帮互助、拒绝空降
  - 自我介绍：每人 2 分钟，手机倒计时控制时间
- name: 三选一选址法
  desc: 提供3个备选场地供参会者投票决策，综合考量人数、时间限制、环境、装备、费用五个维度，兼顾民主决策与组局官效率。
  excerpt:
  - 参会者地点 3 选 1，根据参与者的人数，场地时间限制，场地环境，场地装备，场地费用，选择合适的场地
- name: 物料前置暂存法
  desc: 首次活动由组局官携带物料至现场，后续将物料固定暂存于场地或常驻城市，后续组局仅需提前半小时到场布置，大幅降低物流成本与组织负担。
  excerpt:
  - 第 3 步是第一次如此执行，后续物料来来会再做一份或借用 GZ 这份，直接暂存场地那边，后续组局官提前半小时到场，参与者 14 点直接到场地即可。
- name: 倒计时限时介绍法
  desc: 自我介绍环节每人固定2分钟，使用手机倒计时强制计时，防止时间失控，保证全员均等发言机会与会议节奏。
  excerpt:
  - 现场每人 2 分钟时间，做个自我介绍，使用手机倒计时控制时间。
theorems:
- name: 仪式感与规则前置提升组局质量
  desc: 通过开局规则（真诚开放、手机上缴、拒绝空降）建立‘神圣空间’与‘心理契约’，将松散聚会转化为高强度深度连接场域，是线下组局区别于普通聚餐的核心差异化因子。
  excerpt:
  - 1、真诚开放... 不要带面具来参加组局。
  - 2、全程投入... 请大家全程不玩手机，手机上缴统一保管
  - 3、互帮互助... 请带着问题而来，我们力争解决大家的难题
  - 4、拒绝空降... 请勿空降或者带朋友过来
- name: 结构化输出倒逼结构化思考
  desc: 要求参会者按‘难题-方案-案例’三要素准备自我介绍，迫使参会者在会前完成思考结构化，会中实现信息高密度对齐，会后形成可复用知识库。
  excerpt:
  - 1》每人提出 1 个自己对 AI 在电商领域中应用中遇到的难题？
  - 2》每人提出 1 个自己觉得化解上述难题的 1 个解决方案
  - 3》每人提出 1 个自己从 0 到 1 跑通 AI 在电商领域引用的案例
- name: SOP迭代原则：首次全托管，后续轻量化
  desc: 首次执行由核心组织者全程托管物流与物料（跨城携带），验证流程后将资产沉淀至本地（物料暂存），后续组局官仅需轻量介入，实现组织规模的边际成本递减。
  excerpt:
  - 第 3 步是第一次如此执行，后续物料来来会再做一份或借用 GZ 这份，直接暂存场地那边，后续组局官提前半小时到场，参与者 14 点直接到场地即可。
findings:
- name: 押金与惩罚机制有效降低爽约率
  desc: '[claim] 设定‘24小时未交押金移除群聊’及‘放鸽子扣除费用’规则，可有效筛选高意愿参会者，保障出席率。'
  excerpt:
  - 核实成员押金情况，24 小时未交押金移除群聊
  - 正常参与活动 AA 制支出费用并退还多余押金，放鸽子会扣除费用。
- name: 手机上缴制显著提升会议专注度
  desc: '[claim] 强制物理隔离手机，仅保留录音设备，能消除碎片化注意力干扰，强制参会者进入深度交流状态。'
  excerpt:
  - 请大家全程不玩手机，手机上缴统一保管；组局官会安排 1 个手机全程录音最后分享给大家录音文件
- name: 参会者手册增强归属感与信息留存
  desc: '[claim] 印制包含全员介绍、流程议程的纸质手册并配发笔，能提升参会仪式感，便利现场记录与会后复盘，强化社群身份认同。'
  excerpt:
  - 参会者手册（将会议概述，会议流程，所有人的介绍汇聚成一个手册并打印，给线下在场参与者每人发一份和一支笔）
- name: 固定时间窗口建立组织节奏感
  desc: '[evidence] 文档明确规定了‘每双周二/五/六’的固定操作时间点，实践表明固定的时间节奏能降低协调沟通成本，形成组织肌肉记忆。'
  excerpt:
  - 每双周二 21 点开始，22 点结束
  - 每双周五 21 点开始，22 点结束
  - 每双周六 12 点开始，预计 18 点结束
