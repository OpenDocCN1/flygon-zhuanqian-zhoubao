'no': 1
name: AI 应用实战范式 —— 从“单点调用”到“工程化闭环”
desc: 本章梳理 2023 年上半年生成式 AI 爆发期的典型实战案例，揭示从零基础入门到商业化变现的完整方法论演进路径：如何用“提示工程+工作流”重构内容生产，如何用“RPA+API”落地自动化生产线，如何用“微调+私有化”构建企业级护城河，以及普通人如何通过“利基切入+极速MVP”捕捉红利窗口。
nodes:
- 'no': 1
  name: AI 交互范式跃迁：从“单轮指令”到“过程式协作”
  desc: 剖析大众将 ChatGPT 当作“万能打字机”的误区，确立 AI 写作/创作是“需求拆解→角色设定→分步生成→迭代优化”的深度协作过程，而非一条 Prompt
    出成品。
  role: motivation
  src:
  - paper: docs/202306/20230613_027.md
- 'no': 2
  name: 角色指令三要素结构化定义
  desc: 将高质量 Prompt 标准化为“身份设定+任务设定+约束设定”三模块，并提供“角色生成器”元提示词实现指令自动生成与微调，降低提示词工程门槛。
  role: definition
  src:
  - paper: docs/202306/20230613_123.md
- 'no': 3
  name: “投喂”范式：多模态数据输入的标准化操作手册
  desc: 针对 PDF、网页、表格、长文本、聊天记录等七大数据源，定义统一的“投喂”动作与对应提示词模板，实现摘要、联网查询、数据分析、风格模仿、分类打标、速读、观点提取等高频任务的即学即用。
  role: method
  src:
  - paper: docs/202306/20230613_202.md
- 'no': 4
  name: 浏览器插件封装：把 Prompt 变成“一键按钮”
  desc: 以 HARPA AI 为例，演示如何将固定框架的 Prompt（摘要/笔记/待办提取）产品化为浏览器插件快捷指令，实现“免调教、即装即用”的结构化阅读工作流。
  role: method
  src:
  - paper: docs/202306/20230613_014.md
- 'no': 5
  name: 个人知识库工程化搭建：ChatGPT Plugins + FastAPI + Embedding
  desc: 提供从原理（向量映射/检索/上下文注入）到实战的完整教程：部署 FastAPI 中间层封装 OpenAI Embedding API 与向量数据库，接入
    ChatGPT 网页端插件实现二次交互，单次 3.7k 中文成本仅 0.02 元。
  role: method
  src:
  - paper: docs/202306/20230613_128.md
- 'no': 6
  name: RPA+ChatGPT 自动化内容生产线：从“手工投喂”到“批量生产”
  desc: 梳理 RPA 模拟浏览器操作实现 Prompt 批量输入、断点续写判断、结果自动抓取保存的完整工程流程，将单日生产量从百篇级提升至万篇级，并沉淀为“思路×流程×自动化”三层交付标准。
  role: method
  src:
  - paper: docs/202306/20230613_212.md
- 'no': 7
  name: Chrome 插件零基础开发：自然语言编程 + 记事本极简工具链
  desc: 验证非程序员仅用记事本 + ChatGPT 生成 manifest.json/popup.html/content.js，5 分钟完成首个插件开发-调试-发布闭环，确立“极简工具链+AI代码生成”的新范式。
  role: experiment
  src:
  - paper: docs/202306/20230613_124.md
- 'no': 8
  name: AI 全栈生成 Web 工具站：从临时邮箱到 SEO 自动化系统
  desc: 对比两个端到端案例：临时邮箱站——ChatGPT 生成全栈代码、人工部署迭代修复边缘 Bug、接入 AdSense 变现；超级 SEO 助手——技术+GPT
    实现“标题/关键词→批量生成→自动发布→收录获客”全流水线，运营成本趋近零。
  role: experiment
  src:
  - paper: docs/202306/20230613_125.md
  - paper: docs/202306/20230613_210.md
- 'no': 9
  name: 海外工具站选品方法论：双重变现模型与三要素筛选漏斗
  desc: 抽象出“卖流量（免费+广告/联盟）”与“卖产品（付费+销售链路）”双轨并行模式，提出“市场需求+ChatGPT强相关+普通人可控复杂度”三要素判断标准，给出“ChatGPT
    To xxx / Xxx For ChatGPT / chatgpt for xxx”关键词挖掘战术。
  role: method
  src:
  - paper: docs/202306/20230613_206.md
- 'no': 10
  name: 两大核心切入方向：补充巨头缺口 vs 能力场景化迁移
  desc: 方向一：围绕 ChatGPT 做 Input/Output/Workflow/Prompt 效率补充工具；方向二：将 OpenAI 能力视为通用基座（如
    OCR），结合邮件、亚马逊运营、社媒、SEO 等垂直场景封装专用工具。
  role: method
  src:
  - paper: docs/202306/20230613_206.md
- 'no': 11
  name: AI 绘画商业化落地：Lora 炼丹 + ControlNet 双核范式
  desc: 确立 Stable Diffusion 应用层核心框架：Lora 负责“特定主体/风格炼制”，ControlNet 负责“生成过程精准控制”，配合一站式整合包（环境/模型/参数打包）与全流程自验证教程，实现真人模特定制与商业产品建模的零门槛落地。
  role: method
  src:
  - paper: docs/202306/20230613_026.md
- 'no': 12
  name: AI 头像/壁纸/表情包变现全链路：从参数调优到 SOP 交付
  desc: 串联 Midjourney 垫图与 --iw 权重实测调优、三大爆款关键词体系模板、私人定制标准化 SOP（需求诊断→基础生成→精修迭代→多规格交付）、人物一致性技术阶梯，形成“生图-选图-文案-分发-转化”完整商业闭环。
  role: method
  src:
  - paper: docs/202306/20230613_030.md
  - paper: docs/202306/20230613_211.md
- 'no': 13
  name: 多模态工具链组装：ChatGPT + Midjourney + LeiaPix 制作 3D 视频
  desc: 演示“故事创作→脚本分镜→提示词工程→图像生成→2D转3D→后期合成”六步标准化 SOP，零成本产出商业级动态视频，验证多模态能力组装降维打击专业制作门槛。
  role: experiment
  src:
  - paper: docs/202306/20230613_207.md
- 'no': 14
  name: AI 声音克隆一站式交付：So-VITS-SVC 整合包与手把手教程
  desc: 提供环境依赖、预训练模型、目标音色模型打包分发，配合大白话图文教程覆盖数据预处理、训练、推理全流程，将专业级歌声合成门槛降至零基础可及，并提示版权合规风险。
  role: method
  src:
  - paper: docs/202306/20230613_209.md
- 'no': 15
  name: 私有化部署 ChatGPT：开源基座+高质量指令微调的工程实践
  desc: 基于 LLaMA 基座+清洗后 ShareGPT GPT-4 子集数据，参考 Vicuna/LIMA 范式（少量高质量数据对齐）完成指令微调；实测
    ChatGPT 套娃编程 3 小时完成数据清洗工程，论证“预训练赋能、微调唤醒”低成本复现 ChatGPT 级能力的可行性。
  role: method
  src:
  - paper: docs/202306/20230613_208.md
- 'no': 16
  name: 中文私有化落地的基座瓶颈与出海窗口期判断
  desc: 揭示 LLaMA 中文能力被“阉割”、微调难以根治的硬性限制，短期聚焦英文出海 ToB 场景（数据隐私合规刚需），预判 6 个月内将涌现离线硬件化私有部署产品，需等待中文原生基座开源。
  role: limitation
  src:
  - paper: docs/202306/20230613_208.md
- 'no': 17
  name: AI 变现异常值案例库：放弃 MECE，拥抱实证观察
  desc: 因 AI 领域跨度过大无法构建 MECE 分类体系，转而采用“异常值案例库”形式：收录宝宝起名、热点资讯、头像壁纸、小说推文、流量收益 5 大方向
    10 个可复制高 ROI 案例，提供灵感启发而非理论拆解。
  role: motivation
  src:
  - paper: docs/202306/20230613_029.md
- 'no': 18
  name: RPA+X 核心能力复用模型：稳定内核嫁接变化热点
  desc: 提炼“核心技能 A（RPA）+ 热点场景 X（加好友/ChatGPT/小红书/抖音）”复用模型，配合极速 MVP（首日上线、3 节课、1980 元高客单价）、私域精准收割（1
    万好友+公众号+知乎）、航海资料库零延迟内化，一周创收 7 万、十天复用模型再收 5 万。
  role: method
  src:
  - paper: docs/202306/20230613_212.md
- 'no': 19
  name: 敢于收钱与高客单价策略：小流量池撬动大营收的杠杆
  desc: 反驳完美主义与割韭菜恐惧：产品只需解决核心痛点（效率 10 倍提升）即可收费；高客单价筛选优质用户、少量成交即达高营收，低价反而导致总收入缩水 80%。
  role: theorem
  src:
  - paper: docs/202306/20230613_212.md
- 'no': 20
  name: 借势首发优势：在爆发早期窗口期抢占心智
  desc: 在 ChatGPT 航海启动当天推出训练营，借势社群流量红利实现高转化；验证“动作要快、首发即王道”，即便流量池不大也能因信任背书与紧迫感营销实现高变现。
  role: theorem
  src:
  - paper: docs/202306/20230613_212.md
- 'no': 21
  name: 工具不值钱，解决方案值钱：构建护城河的交付标准
  desc: 单纯脚本/工具易被复制、低客单价；必须封装“业务思路+标准化流程 SOP+工具执行”三位一体方案，支撑高客单价并建立竞争壁垒。
  role: theorem
  src:
  - paper: docs/202306/20230613_212.md
- 'no': 22
  name: AI 门槛悖论：看似降低门槛，实则提高门槛加剧分化
  desc: 生成式 AI 普及未平均化创作能力，反而因判断力/审美/提问能力差异放大高手与新手产出差距；人类主体性不可替代——需投入更多心力进行交流、训练、把关与修正。
  role: limitation
  src:
  - paper: docs/202306/20230613_027.md
- 'no': 23
  name: 敏感领域内容合规的“外部托管+AI生成方案”双重保障
  desc: 针对风水命理等高风险领域，利用 ChatGPT 生成系统性合规话术，核心干货迁移至飞书等外部载体规避平台审核，正文仅留引流入口，验证“正文洗白+外链承载”实操可行性。
