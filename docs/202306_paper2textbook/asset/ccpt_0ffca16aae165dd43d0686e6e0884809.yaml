paper: docs/202306/M0JDdADBAo9PI6xqWY1cTdMHn8g.md
desc: 该素材由AI训练师小凡撰写，系统阐述了利用ChatGPT联网功能进行自媒体爆款选题的三大核心方法论：1）大爆款话题+IP定位针对性选题法（针对超级热点事件，通过事件调查与IP匹配输出选题）；2）热榜清单挖掘+固定类目选题法（针对无超级热点时，通过联网抓取各平台热榜并结合IP筛选）；3）'天时地利人和'中的天时选题法（针对节日、节气、季节性固定时间窗口，提前布局选题）。素材采用'黄金思维圈'拆解提示词设计逻辑，强调'先喂信息（调查热点/投喂IP），后提要求’的标准化SOP流程，并附带职场、旅游、美妆三个垂类的实战Prompt案例与GPT返回结果。
concepts:
- name: IP定位四要素
  desc: 构建自媒体IP定位的标准化框架，包含目标人群、人群画像、人群痛点、解决方案四个维度，用于指导ChatGPT输出精准匹配账号调性的选题。
  is_original: false
  excerpt:
  - 目标人群：大四正在求职中在活跃在小红书平台的女性大学生群体
  - 人群画像：这个人群通常具备相对较高的教育水平，现在正在积极地寻找实习机会和求职
  - 人群痛点：1）找不到好的实习... 2）不会做简历... 3）不知道怎么面试... 4）好的工作投简历没音讯...
  - 解决方案：我能够提供简历辅导，面试培训以及其他相关求职知识
- name: 黄金思维圈提示词设计法
  desc: 将Why（目的）、How（路径/步骤）、What（具体指令）三层逻辑应用于Prompt工程，用于拆解复杂任务、设计多轮对话流程，提升大模型输出质量的元能力。
  is_original: true
  excerpt:
  - 所以拉个黄金思维圈来思考怎么写这个提示词... 1. WHY ... 2. HOW ... 3. WHAT ...
  - 第一步的提示词，调查热点话题... 第二步的提示词，投喂IP定位... 第三步就简单，结合两者，直接出选题方向即可
- name: 联网选题SOP (标准作业程序)
  desc: 素材总结的通用化选题流程：步骤1-调查热点/获取热榜/搜寻天时（联网获取外部信息） -> 步骤2-投喂IP定位（内部信息对齐） -> 步骤3-结合内外部信息输出选题（推理生成）。
  is_original: true
  excerpt:
  - 我们正常进行选题的一套SOP，但是我们通过ChatGPT，节省了非常多的时间和人力。
  - 请按下面的步骤帮助我完成任务：1.我会先以'请了解'为开头... 2.我会告诉你：请找到中国热门的互联网社区找到热搜榜单...
- name: 天时选题触发器
  desc: 将选题时机显性化为三类可预测的外部时间窗口：节日/营销节点、季节/二十四节气、临时热点，实现选题从'被动蹭热点'向'主动布局日历'的转变。
  is_original: false
  excerpt:
  - 所谓的天时是指：节日（五一劳动节、母亲节、517吃货节、520情人节等）、季节天气变化（四季、冷热等，特别是中国人的二十四个节气）、临时热点（热播剧，社会新闻）等
methods:
- name: __overview__
  desc: 素材整体方法论：基于ChatGPT联网能力的'三步走'选题闭环——外部情报收集（联网搜索/热榜抓取/日历检索）+ 内部画像对齐（结构化IP投喂）+
    逻辑推理生成（人性分析/匹配度论证），并通过黄金思维圈指导多轮Prompt设计。
  excerpt:
  - 本文我将阐述如何通过ChatGPT的联网功能、并讨论如何结合我们自己的IP定位，来进行创作选题。
  - 这实际上，就是我们正常进行选题的一套SOP，但是我们通过ChatGPT，节省了非常多的时间和人力。
- name: 大爆款话题针对性选题法 (三步法)
  desc: 针对单一超级热点事件（如孟羽童离职）的选题方法：步骤1 联网调查事件来龙去脉及爆火人性逻辑；步骤2 结构化投喂IP四要素并确认理解；步骤3 一键生成匹配选题方向。核心在于'先搞懂热点人性G点，再匹配IP痛点'。
  excerpt:
  - 第一步的提示词，调查热点话题... 2）这个话题怎么就火起来了？... 帮我分析一下：这个话题这么火，是不是击中了人们的哪个点？
  - 第二步的提示词，投喂IP定位... 请你认真阅读理解，如果你认为我提供的信息不够全面，请告诉我们还需要提供什么信息给你。
  - 第三步就简单，结合两者，直接出选题方向即可
- name: 热榜清单挖掘选题法 (反向筛选法)
  desc: 针对无超级热点或热点不匹配时的选题方法：步骤1 设定选题顾问Role并确认IP；步骤2 投喂IP定位；步骤3 指令GPT联网遍历主流社区热榜，筛选匹配度高的话题并输出'热度/内容/适配理由'三维分析。核心解决'硬蹭热点导致胡说八道'的问题。
  excerpt:
  - 请找到中国热门的互联网社区找到热搜榜单，从这些近期热点中，挑选你认为适合我这个IP定位选取的选题方向，并且告诉我：1）这个话题有多火爆？2）这个话题主要讨论了什么？3）为什么这个话题适合我这个IP。
- name: 天时日历前置选题法
  desc: 针对可预测时间窗口（节日/节气/季节）的提前布局方法：步骤1 定义'天时'概念并指令GPT联网检索特定月份（如5-6月）的天时清单；步骤2 投喂IP定位；步骤3
    结合IP属性（如美妆/消费）筛选相关天时并生成选题。核心优势是'确定性高、可提前准备'。
  excerpt:
  - 如果你能理解上面对于天时的含义，请帮我在网络上搜寻一下，23年5-6月，有哪些天时。
  - 请根据对我IP定位的理解，在中文互联网搜寻与我的IP定位相关的美妆或者消费相关的天时... 为我提供一些创作的选题方向。
- name: Prompt确认机制
  desc: 在多轮对话关键节点（IP投喂后、任务执行前），要求GPT复述任务理解与执行策略，通过'用自己的话描述一遍你要做的事；你会通过怎样的方式更好地完成你要做的事'两问，校准模型理解，防止幻觉与跑偏。
  excerpt:
  - 如果你明白我的意思，请回答以下两点：1、用自己的话描述一遍你要做的事；2、你会通过怎样的方式更好地完成你要做的事
  - 如果你完全理解我的IP定位... 请告诉我：'我已收集足够信息，并准备好帮小凡结合IP定位与...'
theorems:
- name: 选题即核心竞争力论
  desc: 自媒体创作成败的关键在于选题而非文笔，蹭热点是最高效的选题手段，ChatGPT联网功能将'找热点、懂热点、蹭热点'的全流程效率提升数量级。
  excerpt:
  - 不管是小红书还是抖音，自媒体创作重要的是什么？是选题！
  - 最容易爆的选题方法是什么？是蹭热点！！
  - ChatGPT联网后在自媒体创作最大的帮助是什么？是找热点！！！
- name: 人性G点驱动热点传播论
  desc: 大爆款话题之所以持续发酵，核心在于击中了人性的共性痛点/爽点（如阶层焦虑、打工人命运共情、权力更迭围观心理），选题必须从人性角度拆解热点而非罗列事件。
  excerpt:
  - 在了解到这些信息后，希望你能通过人性的角度，借助自己的逻辑推理思考，帮我分析一下：这个话题这么火，是不是击中了人们的哪个点？
- name: IP-热点匹配度决定选题质量论
  desc: 并非所有热点都值得蹭，选题质量取决于热点话题自带流量与账号IP定位（人群/痛点/方案）的重合度。强行匹配会导致GPT'胡说八道'，需采用'热榜筛选'或'天时布局'规避风险。
  excerpt:
  - 有些时候我们没有遇到特别大的爆款话题，也有可能这个爆款话题并不一定适合我们，那么硬蹭是会带来问题的。
  - 因为ChatGPT是一个你说什么他都'是是是'照做的老黄牛... 即使没法从话题里选出适合你IP定位的角度，他也会硬扯。
- name: 提示词工程即SOP外包论
  desc: 高质量Prompt的本质是将人类专家的标准作业程序（SOP）显性化、结构化、指令化。'黄金思维圈'是设计SOP的底层思维模型，Prompt确认机制是质检环节。
  excerpt:
  - 这实际上，就是我们正常进行选题的一套SOP，但是我们通过ChatGPT，节省了非常多的时间和人力。我认为，这才是ChatGPT在自媒体创作领域真正的定位。
  - 脑子里装了太多思维模型了，分析问题基本上潜意识里套个思维模型就出来了。
findings:
- name: 孟羽童事件选题实战产出
  desc: '[evidence] 基于职场IP（大四女大学生求职）与孟羽童事件（名校生/董明珠接班人/离职反差）的匹配，GPT输出3个具体选题：1）''董明珠接班人为何逃离体制内''对标''名校女生为何拒绝大厂Offer''；2）''孟羽童简历复盘：普通女生如何逆袭顶级资源''；3）''离职不裸辞：给准毕业生的体面止损指南''，均含标题/切入点/大纲/爆款理由。'
  excerpt:
  - 选题方向一：标题：《董明珠的“接班人”都逃离了，我们普通打工人还在为体制内卷破头？》... 切入点：孟羽童的“逃离”vs普通女大学生的“向往”...
  - 选题方向二：标题：《孟羽童同款简历长啥样？手把手教你用“项目化思维”包装平凡经历》...
  - 选题方向三：标题：《裸辞前，我准备了3个Plan B：写给即将毕业、不想裸辞的女生》...
- name: 旅游号热榜筛选实战产出
  desc: '[evidence] 基于亲子游/江浙沪周末游IP，GPT从热榜筛选出''淄博烧烤后遗症/周边游替代方案''、''五一亲子游避坑指南''、''江浙沪露营地预订难/私藏清单''三个方向，并给出热度数据源（微博/抖音/小红书热榜）、讨论核心内容及IP适配理由（精准击中白领时间焦虑/品质亲子需求）。'
  excerpt:
  - 话题一：淄博烧烤降温后，周边游/替代目的地搜索量暴涨... 适合IP理由：目标人群工作忙、时间不充裕，周末2日游是刚需...
  - 话题二：五一亲子游‘人从众’避坑指南... 适合IP理由：人群已成家拖家带口... 定制化亲子游服务可直接承接...
  - 话题三：江浙沪露营地‘一位难求’，博主私藏清单... 适合IP理由：擅长规划江浙沪周末2日游...
- name: 美妆号6月天时选题实战产出
  desc: '[evidence] 基于高性价比美妆/女大学生IP，GPT结合6月天时（高考/毕业季、618大促、父亲节/夏至/芒种）输出3大选题：1）''毕业季平价妆容/送礼清单''蹭毕业礼物/入职妆需求；2）''618囤货避坑/高性价比清单''蹭大促流量；3）''夏季底妆不脱妆/多用单品''蹭夏至/天气变化节点。'
  excerpt:
  - 选题方向一：毕业季专题——『平价毕业妆容/送礼清单』... 结合天时：6月毕业季、高考结束...
  - 选题方向二：618大促专题——『618不踩雷，学生党闭眼冲的高性价比美妆清单』... 结合天时：618年中大促...
  - 选题方向三：夏季/节气专题——『夏天油皮救星！一支定妆喷雾搞定全天底妆，还是二十四节气“夏至”应季刚需』... 结合天时：夏至、芒种、天气转热...
- name: 联网功能不稳定性制约
  desc: '[evidence] 素材作者在方法二、三实操中多次遭遇GPT联网超时、报错、网络不稳定导致结果不完整或需重试，表明当前联网插件在高并发/复杂检索任务下的工程可用性仍是瓶颈。'
  excerpt:
  - 这个结果应该是网络不好，老是超时报错。气死我了！！！！！只能暂时这样给到大家这样的案例了。
  - （注：方法三第二步结果图中亦显示'网络错误，请稍后重试'）
