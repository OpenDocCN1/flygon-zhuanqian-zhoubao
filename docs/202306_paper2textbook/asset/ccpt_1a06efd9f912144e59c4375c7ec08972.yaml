paper: docs/202306/20230613_209.md
desc: 该素材是一篇由吴东子发布于语雀的教程类帖子，标题为《火爆全网的 AI 孙燕姿的超详细干货教程》，主要宣传并分享了一站式制作 AI 孙燕姿翻唱视频的完整流程，包含声音模型训练、推理合成等步骤，并提供了软件整合包与预训练模型的网盘下载链接，旨在降低普通用户使用
  AI 声音克隆技术（基于 So-VITS-SVC 等开源框架）的门槛。
concepts:
- name: AI 孙燕姿
  desc: 利用 AI 声音转换技术克隆孙燕姿音色，使其能演唱任意歌曲的虚拟歌手形象，是当时网络热点现象的代称。
  is_original: false
  excerpt:
  - 最近 AI 孙燕姿火爆全网
  - 一站式制作 AI 孙燕姿的方法
- name: AI 声音克隆 / 声音模型训练
  desc: 通过采集目标歌手音频数据，训练声学模型（如 So-VITS-SVC），实现音色迁移，让模型能唱出目标音色的任意歌曲。
  is_original: false
  excerpt:
  - 训练声音模型的教程
  - 让你的声音可以唱任何你喜欢的歌曲
- name: 一站式整合包
  desc: 作者将运行 AI 歌声合成所需的依赖环境、推理程序、预训练模型、孙燕姿专用模型等打包分发，解决用户配置环境困难的问题。
  is_original: true
  excerpt:
  - 所有软件的安装包、整合包，甚至孙燕姿的声音模型 都已经打包好放在网盘分享给大家
methods:
- name: __overview__
  desc: 作者提供的从环境搭建、数据预处理、模型训练到推理合成的完整图文教程流程，配合整合包实现零门槛上手。
  excerpt:
  - 文章里面有一站式制作 AI 孙燕姿的方法，还包含了训练声音模型的教程
  - 每一步都是手把手教学，大白话讲解，确保你能听懂，照着做准能做出来
theorems:
- name: 降低 AI 歌声合成使用门槛
  desc: 通过提供整合包（环境+模型）和大白话手把手教程，普通用户无需深厚技术背景即可完成高质量的 AI 声音克隆与翻唱制作。
  excerpt:
  - 每一步都是手把手教学，大白话讲解，确保你能听懂，照着做准能做出来
  - 所有软件的安装包、整合包，甚至孙燕姿的声音模型 都已经打包好放在网盘分享给大家
