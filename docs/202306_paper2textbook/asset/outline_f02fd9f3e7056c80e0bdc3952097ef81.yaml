'no': 1
name: 线下实体生存法则 —— 从“开店不倒”到“单店跑通”
desc: 本章聚焦线下实体门店从0到1的生存核心逻辑。通过对比一线城市与下沉市场的成本结构差异、拆解头部品牌下沉失败与本土创业者成功的深层原因、复盘麻辣烫店倒闭与棋牌室稳健盈利的反面教材与正向案例，系统构建“选址验证、合规准入、成本控制、流量获取、单店模型标准化”的五维生存方法论，揭示实体生意“经营落地为1，品牌营销为0”的第一性原理。
nodes:
- 'no': 1
  name: 实体创业的残酷现实与认知门槛
  desc: 以麻辣烫店两月倒闭、棋牌室稳健盈利为对比案例，揭示99%实体老板不懂线上流量、盲目对标头部、忽视合规红线的普遍认知盲区，确立“前置调研成本远低于试错损失成本”的风控底层逻辑。
  role: motivation
  src:
  - paper: docs/202306/20230613_162.md
  - paper: docs/202306/20230613_237.md
  - paper: docs/202306/20230613_159.md
- 'no': 2
  name: 选址验证的“笨方法论”：人流实测与政策排查
  desc: 拒绝主观臆断，确立‘花一周用计步器统计人流、查市政规划进合同、实测同街区两侧微观差异’的硬核选址SOP，将选址从玄学变为可量化的财务模型输入项。
  role: method
  src:
  - paper: docs/202306/20230613_068.md
  - paper: docs/202306/20230613_162.md
  - paper: docs/202306/20230613_237.md
- 'no': 3
  name: 合规准入的“生死线”：特种行业资质与基层博弈
  desc: 以棋牌室‘娱乐经营许可证、消防验收、公安备案、拒赌博功能软件’为核心案例，剖析下沉市场‘搞定顾客、同行、监管’三维人情博弈的隐性成本结构，界定合规为固定成本而非可选项。
  role: definition
  src:
  - paper: docs/202306/20230613_237.md
  - paper: docs/202306/20230613_164.md
- 'no': 4
  name: 成本结构重塑：SKU精简、非核心投入砍除与房租占比红线
  desc: 从麻辣烫店‘100+ SKU拖垮后厨、精美包材稀释毛利、东北运麻将物流成本失控’反面教材，推导出‘月销<20单SKU强制清洗、包材/装修投入上限锁定、房租占营收15%-20%’的成本控制铁律。
  role: method
  src:
  - paper: docs/202306/20230613_162.md
  - paper: docs/202306/20230613_068.md
  - paper: docs/202306/20230613_237.md
- 'no': 5
  name: 对标层级匹配定律：只复制‘同量级、同阶段、同区域’的成功模型
  desc: 批判‘初创对标巨头’的战略性错位，确立‘寻找辐射区域最优同行、或新开2-3月业绩突出店铺，验证投入/产出/持续性/成功先例四项财务指标后直接照抄’的可复制对标方法论。
  role: method
  src:
  - paper: docs/202306/20230613_162.md
  - paper: docs/202306/20230613_070.md
- 'no': 6
  name: 单店模型标准化评估：复制成本、投入门槛与市场容量的三维决策
  desc: 对比熟食店（高标准化、低复制成本、万店潜力）与火锅店（低标准化、高投入、千店上限），确立‘以标准化程度为核心指标评估单店模型，优先打磨可复制单店再谈连锁’的战略定力。
  role: method
  src:
  - paper: docs/202306/20230613_164.md
- 'no': 7
  name: 下沉市场生存悖论：低营收高利润与强龙不压地头蛇
  desc: 通过唐山乐亭县城熟食店M年入百万、双汇/紫燕百味鸡街边店被‘打跑’的实证，揭示三四线城市‘房租1/4、营收1/2、利润率更高’的成本结构优势，及熟人市场排外性、直营店长打不过创业夫妻的竞争壁垒。
  role: experiment
  src:
  - paper: docs/202306/20230613_164.md
- 'no': 8
  name: 止损即盈利：结构性缺陷下的理性关店决策
  desc: 复盘麻辣烫店‘美团排名第一但零利润、盈亏平衡点沦为记账工具、核心逻辑结构性缺陷’全过程，论证‘在已知可控范围内无法突破盈亏平衡时，果断关店保护本金优于盲目坚持’的止损智慧。
  role: limitation
  src:
  - paper: docs/202306/20230613_162.md
- 'no': 9
  name: 经营落地为1，品牌营销为0：实体小店的第一性原理
  desc: 综合华与华方法论在基层落地验证、菜单工程提升坪效、MVP最小化运营跑通69平29.5万/月业绩等案例，总结实体生存核心公式：选品、成本、运营、关系处理等经营基本功是‘1’，品牌/营销/设计是后面的‘0’。
  role: extension
  src:
  - paper: docs/202306/20230613_164.md
  - paper: docs/202306/20230613_070.md
