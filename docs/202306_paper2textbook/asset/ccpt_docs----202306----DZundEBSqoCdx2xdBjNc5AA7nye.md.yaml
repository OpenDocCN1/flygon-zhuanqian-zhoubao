paper: docs/202306/DZundEBSqoCdx2xdBjNc5AA7nye.md
desc: 该素材记录了作者jime从互联网小白到月入5W+品牌创始人的实战复盘，核心路径为：通过大量课程学习重塑认知（破除固有认知、理解人性利益本质）-> 卖课实战积累信任与资金
  -> 升级“卖模式”实现可复制放大 -> 主动发声链接高阶圈层（生财有术）获取AI机遇 -> 与合伙人合作开发“婚礼台词AI小程序”切入细分垂类 -> 通过Prompt工程化、SOP标准化、矩阵引流、群发售转化构建完整商业闭环。素材详细拆解了行业应用落地的6步法（体验GPT、定位痛点、写商业计划、找合伙开发、推广引流、转化交付）及终极变现心法（满足完美状态、先破局后行动、躬身入局、举一反三），强调“无需技术背景、低成本源码搭建、标准化执行即可复制”。
concepts:
- name: 完美状态
  desc: 商业变现的核心原点，指‘对方想要的东西最好的样子是什么’。只有精准满足客户的完美状态（如主持人‘一分钟创作高定台词’），才能实现成交，而非依赖产品完美、资质深厚或自证实力。
  is_original: false
  excerpt:
  - 完美状态是一切商业行为供需关系的原点先有完美状态，再有商业需求，完美状态简单来说：就是搞明白 “对方想要的东西最好的样子是什么？”
  - 对我来说 我理解客户想要什么？他们大多数是刚入行的主持新手他们写台词的时候两个小时写不出一篇来...我告诉他，我这有个AI工具，可以一分钟写出高定婚礼开场白。
  - 商业变现唯一的本质 就是满足客户的完美状态
- name: 卖模式不如卖课
  desc: 将赚钱的全套执行流程（SOP）标准化、产品化后出售，而非单纯贩卖知识内容。通过‘复制100遍’实现杠杆放大，同时筛选高执行力合伙人，构建代理分销体系。
  is_original: true
  excerpt:
  - 总结一下：你手里有没有可以为别人创造价值的事，如果有，请你梳理一下。记得：“卖课不如卖模式”把赚钱的事情复制100遍。
  - 我把赚钱的这套方法做成详细的步骤，卖模式给想做副业的朋友。由此我出了我的课代群，总共49人 一人365 ，加上卖课第二个月我的变现是2万多。
- name: 主动发声
  desc: 在社群中主动输出价值、分享心得、提供帮助的行为。核心逻辑为：输出价值 -> 引发重视 -> 链接资源 -> 获取信任 -> 创造机会。是作者从卖课走向AI创业、链接合伙人及高阶圈层的关键动作。
  is_original: false
  excerpt:
  - 主动发声的核心是：输出价值，提供帮助，创造机会，展现正能量，给予正反馈
  - 第一次通过在学员群里面主动发声，我成为了课代表...第三次是通过众筹引流软件，我主动分享，让我链接到很多有自己项目的朋友。了解到ChatGPT，进行深度学习，并且邀请我加入合伙，创办了ChatGPT中文社群
- name: 固有认知
  desc: 阻碍普通人捕捉机会的心理障碍，表现为对新事物的本能否定（‘都是骗人的’、‘不可能是真的’）和自我设限（‘一定要先做成才能卖’）。打破固有认知需进入高认知密度圈层（如生财有术）进行重塑。
  is_original: false
  excerpt:
  - 其实我们很多时候被固有认知束缚住了，机会哪里都在唯独不在你的固有认知里面
  - 你的固有认知是什么 ？每当你看到什么机会 你的固有认知就会这么告诉你：“这都是骗人的”“这都是坑钱的”...然后和身边的人一起叹息 到处都是智商税 根本就没机会啊
- name: 行业Prompt工程化
  desc: 将通用大模型能力通过结构化Prompt封装为行业专用功能模块。按‘同等内容看类型 -> 同等类型分类目 -> 同等类目看结构 -> 结构里有功能’四层拆解业务流程，每个节点对应一个标准化Prompt，实现‘一分钟产出专业成果’。
  is_original: true
  excerpt:
  - 模块分类：同等内容看类型...同等类型分类目...同等类目看结构...结构里面有功能
  - 核心王道是人性：其实最终每个模块细分都是沿用了我的slgan：一分钟创作高质量台词，细分下来业内人觉得哇，专业
- name: 群发售SOP
  desc: 一种高转化的私域成交标准化流程：现炒现卖（当天拉群当晚开场）、热场激活（接入GPT体验+发红包）、干货演示（实时用小程序为用户产出成果）、逼单收割（限时优惠+福利）。配备场控、主持、互动、分享四角色分工，全程话术与动作标准化。
  is_original: true
  excerpt:
  - 群发售SOP的制定...人员需求：场控，主持人，互动嘉宾，分享老师。这个是基本配置
  - 现炒现卖：我们当天拉群，晚上八点直接开始...群发售热场：如果有条件自己接一个ChatGPT到微信群，让群用户体验GPT...群发售流程内容：...直接让用户发素材，然后我后台用小程序和GPT同时给他写作台词，写好马上发给客户
- name: 代理合伙SOP
  desc: 赋能分销代理的标准化作业手册，包含产品熟悉、加人标准化（统一人设/工具/话术）、朋友圈标准化（一键转发/克隆）、转化标准化（建群拉大号、执行群发售SOP）。解决‘人手不足’与‘执行力参差不齐’的规模化难题。
  is_original: true
  excerpt:
  - 代理合伙SOP：让所有帮你做事儿的人，都有一套标准可复制的SOP，包括以下几个方面：产品熟悉...加人标准化...朋友圈标准化...转化标准化
  - 我是让我所有的代理合伙人统一用我们的头像，品牌名+昵称，用一个破解的自动加人软件，统一的介绍，加人话术，邀请话术，体验话术，答疑话术。
methods:
- name: __overview__
  desc: AI细分行业应用落地六步法：1.深度体验GPT建立信心；2.拆解行业痛点定位‘完美状态’；3.GPT辅助生成商业计划书设计商业架构；4.低成本找合伙人/外包开发小程序（源码二开+个体户认证避坑）；5.矩阵号抖音引流+私域主动营销双轨推广；6.代理SOP+群发售SOP标准化转化交付。
  excerpt:
  - 详细拆解你也可以复制：1⃣️使用GPT 2⃣️找到你的行业定位 3⃣️写出商业计划 4⃣️找到你的合伙人+开发小程序 5⃣️产品的推广 6⃣️流量的转化
- name: 行业定位三步法
  desc: 提炼‘用户属性+用户痛点 -> 完美状态 -> Slogan’的定位公式。例如：婚礼主持人(属性) + 写台词慢/差(痛点) -> 一分钟创作高定台词(完美状态)
    -> ‘一分钟创作高质量台词’(Slogan)。
  excerpt:
  - 我的定位技巧就是：找到用户属性+用户痛点 ，最后给出完美状态
  - 用户属性是小学生，他们脑袋里面没货，想写出好的作文，OK你给出的完美状态就是：1.家长不用花时间改作文 2.娃娃写作满分的写作素材库
- name: GPT辅助商业计划书生成法
  desc: 赋予GPT角色（如‘十年商业顾问’），输入定位、模式、价格等关键参数，让GPT输出框架（市场、产品、财务、运营），再结合行业知情填充细节。用于快速验证商业可行性、融资谈判及执行指引。
  excerpt:
  - 首先给GPT你想要的定位，利用GPT他会给你列出很多大框架：比如：你现在是一名从业十年的商业顾问...由此也列出财务计划表。
  - 有了商业计划书你会有动力去做接下来的事情，因为知道这个事能赚多少钱，怎么去实施
- name: 小程序低成本极速开发法
  desc: 避开个人认证坑，直接申请个体工商户（淘宝代办30元/天）；采用成熟源码二次开发（合伙人几百元/2天或淘宝2000元/15天）；并行办理收款商户号、服务器部署、GPT接口接入；核心精力聚焦业务模块设计而非技术底层。
  excerpt:
  - 小程序的开发是借用了源码修改的，历时两天，就出了第一个原型。
  - 记得直接申请个体工商户去认证。个体工商户申请：淘宝上面搜代办，找一个网络工作室类目，30块钱，一天搞定
  - 小程序开发渠道：第一种方式，找我的合伙人，几百块钱，两天出我们类似的小程序...第二种，淘宝找技术，价格应该在2000，周期15天。
- name: 抖音矩阵号批量引流法
  desc: 不求单账号爆款，以‘引流’为唯一KPI：多账号（5个+/天发10条）、图文赛道（易批量）、主页留隐秘钩子（搜小程序名）、对标爆款内容用GPT/小程序洗稿为干货、简介强引导‘搜小程序体验’。以量换精准用户，成本极低。
  excerpt:
  - 抖音引流：起号的初衷：我们是为了引流和曝光的...很简单，就是矩阵，我目前只有五个号，一天十条作品...
  - 找同行的爆款作品，用你的小程序或者GPT洗一遍，变成用户需要的干货
  - 我账号120粉丝的时候，私域引流了48个人。然后小程序一天能进80多个人。引流第一个抖音用户就成交了。
- name: 群发售标准化执行法
  desc: 将群发售拆解为：人员配置(4角色) -> 时间控制(1.5h内) -> 热场工具(GPT进群+红包) -> 流程设计(文档预热->实时演示->逼单)
    -> 复盘迭代。每场发售按SOP执行，单场最高转化14单，合伙人单日最高收益1800+。
  excerpt:
  - 群发售SOP的制定...人员需求：场控，主持人，互动嘉宾，分享老师。这个是基本配置
  - 现炒现卖：我们当天拉群，晚上八点直接开始...群发售热场：如果有条件自己接一个ChatGPT到微信群...群发售流程内容：...直接让用户发素材，然后我后台用小程序和GPT同时给他写作台词...最后体验完之后，需要一个人来逼得单
theorems:
- name: 变现核心公式：满足完美状态 = 成交
  desc: 商业变现不依赖产品完美度、个人资历或营销技巧，唯一本质是‘精准识别并满足客户的完美状态’。只要能帮新手主持人‘一分钟出高定台词’，哪怕产品是MVP、人设是新手，首单也能成交。
  excerpt:
  - 商业变现唯一的本质 就是满足客户的完美状态 不论我卖的是三个月前的课程，还是现在的AI项目，都是利用了这个
  - 我抖音引流的第一个粉丝就成为了我的小程序会员。你也必须要这样。
- name: 认知破局先于行动
  desc: 普通人无法变现的根因非能力不足，而是‘过去经验’与‘固有认知’的双重锁死。必须先通过高维圈层学习（生财有术）重塑认知（破除‘先做成再卖’迷思、接受‘卖模式’逻辑），再执行‘看见-相信-听话-照做’的复制动作。
  excerpt:
  - 是你的过去障碍了自己 不是你自己没能力，而是你没学习
  - 是你的固有认知限制了自己 你本该去追求有价值的东西
  - 理解了上面这几点，我们只需要找到有结果的人和事，去研究去拆解，去复制，看见 | 相信 | 听话 | 照做
- name: AI赋能行业的通用复制路径
  desc: 任何细分行业均可复制‘AI+小程序’模式：核心不在技术门槛（可外包/源码），而在‘行业知情者’对痛点的拆解深度与Prompt工程化能力。只要懂行业、会拆解流程、敢投入低成本试错，即可构建‘工具+会员+代理’商业闭环。
  excerpt:
  - 那么我们能做什么AI项目呢？我想你什么领域都可以做，只要你感兴趣的 ，或者你足够了解的，你做起来有劲的均可
  - 是不是一定要有技术和启动资金？当然不是 ，淘宝找一个，或者找我合伙人做一个，成本不大
  - 核心是为行业赋能，提高工作效率。切入细分领域。
- name: 卖课模式进化论：内容 -> 模式 -> 工具/平台
  desc: 个体变现的进阶路径：卖课内容(单次交易、交付重) -> 卖赚钱模式/SOP(可复制、收徒代理) -> 卖AI工具/平台(边际成本趋零、规模效应强、代理收益占80%)。每一阶段都建立在前一阶段的信任积累与标准化沉淀之上。
  excerpt:
  - 在我卖课达到一天1000元的时候...我把赚钱的这套方法做成详细的步骤，卖模式给想做副业的朋友。
  - 卖课不是终极，AI应用才是未来...我们代理合伙给我带来的收益占据80%。
  - 我成立了AI未来婚礼这个品牌，实现了第三个月收入5W+
findings:
- name: 卖课模式验证期收益数据
  desc: '[evidence] 作者首月卖课收入1.3万，第二月通过‘卖模式’(课代群49人*365元)加卖课收入达2万+，且代理学员均实现盈利，验证了‘卖模式’比‘卖课’杠杆更高、复制更快。'
  excerpt:
  - 第一个月收入1万三...第二个月我的变现是2万多。并且加入课代的朋友都挣到钱。
- name: AI小程序商业化验证数据
  desc: '[evidence] ‘AI未来婚礼’小程序上线第三个月实现品牌方收入5W+。代理合伙体系贡献80%收益。单场群发售最高转化14单，单合伙人单日最高佣金1800+。抖音矩阵号(5号/日10条)日引流80+小程序用户，首粉即成交。'
  excerpt:
  - 我成立了AI未来婚礼这个品牌，实现了第三个月收入5W+
  - 因为我们代理合伙给我带来的收益占据80%。
  - 一场群发售下来我们收款最多的是14个...一个合伙人一天赚了1800多。
  - 我账号120粉丝的时候，私域引流了48个人。然后小程序一天能进80多个人。引流第一个抖音用户就成交了。
- name: 小程序认证避坑实证
  desc: '[evidence] 个人认证小程序需迁移至个体工商户主体，导致双重300元认证费+300元迁移费损失。直接申请个体工商户(淘宝代办30元/1天)可规避此损失，为后续开发者节省约900元及时间成本。'
  excerpt:
  - 最开始用个人去认证的小程序，花了两次冤枉钱，个人认证300，迁移300，个体工商认证又300
  - 记得直接申请个体工商户去认证。个体工商户申请：淘宝上面搜代办，找一个网络工作室类目，30块钱，一天搞定
- name: 付费精准流量 vs 免费矩阵流量对比
  desc: '[evidence] 付费短信流量(500元/万条)与免费抖音矩阵流量的小程序转化率持平，但后者成本为零且规模可叠加。验证了‘内容矩阵+小程序钩子’优于‘购买流量’的ROI模型。'
  excerpt:
  - 最开始我们用精准流量发短信，大概是500块钱1万条，最终小程序转化率跟下面免费的打法效果一样的
  - 目前这个做法，几个矩阵加起来已经超过我精准流量带来的转化了，而且是免费的
- name: 群发售时长与转化负相关实证
  desc: '[evidence] 早期群发售时长2小时(含大量理念讲解)转化差；压缩至1.5小时内、预热甩文档、开场即干货实时演示、全程红包激活、尾部逼单，转化显著提升。验证‘节奏快、体验强、逼单狠’的发售节奏论。'
  excerpt:
  - 最开始两场时间太久，前面讲太多介绍和理念，基本上快拉到了两小时，最后效果也不好，大家记得控制时间，发售热场开始后 直接上干货
  - 群发售热场：如果有条件自己接一个ChatGPT到微信群，让群用户体验GPT，这个会特别活跃...记得发红包，激活用户...最后体验完之后，需要一个人来逼得单
- name: SOP标准化对代理执行力的放大效应
  desc: '[evidence] 通过统一人设(头像/昵称)、工具(自动加人/一键转发)、话术(加人/邀请/体验/答疑)、流程(建群/拉大号/发售)的四维SOP，解决了作者‘人手不足、微信加人受限’的瓶颈，实现代理团队规模化复制，成为收入占比80%的核心增长引擎。'
  excerpt:
  - 代理合伙SOP：让所有帮你做事儿的人，都有一套标准可复制的SOP...
  - 手里还有20多万的流量，所以上次合伙人文章主要的需求还是找寻志同道合的人来一起做。我们有SOP，相信看见听话照做就可以
