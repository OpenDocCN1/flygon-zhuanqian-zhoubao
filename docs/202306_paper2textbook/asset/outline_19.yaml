'no': 1
name: 知识付费存量期破局 —— 从“割韭菜”到“造价值”的实战进阶
desc: 本章针对知识付费行业从增量红利转入存量深耕的现状，系统拆解普通创作者如何避坑、冷启动、标准化交付、构建产品矩阵与全域转化闭环，实现从“被收割”到“持续变现”的认知与能力跃迁。
nodes:
- 'no': 1
  name: 存量期认知重构：风口过后的黄金窗口期
  desc: 辨析行业从野蛮生长转入存量深耕的本质：用户付费习惯成熟、基建完备、长尾需求爆发，反而更适合专业玩家确定性变现；核心主张“知识付费反周期价值论”。
  role: motivation
  src:
  - paper: docs/202306/20230613_071.md
  - paper: docs/202306/20230613_072.md
  - paper: docs/202306/20230613_074.md
- 'no': 2
  name: 避坑指南：识别“镰刀”抵御“韭菜癌晚期”
  desc: 揭秘行业利用信息差、焦虑营销收割新人的隐性套路，确立‘认知防御优于技术变现’原则，通过公开真实收入数据建立权威信任，帮助小白建立反收割认知防御体系。
  role: method
  src:
  - paper: docs/202306/20230613_074.md
- 'no': 3
  name: 普通人冷启动核心杠杆：信任先于产品
  desc: 验证‘种子用户信任积累’为零流量创作者破局关键：通过低门槛服务（带打新、社群）积累400付费种子用户，支撑后续课程冷启动招募100人、变现3万+；信任源于长期点滴交付。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
- 'no': 4
  name: 差异化定位避坑法：方正不对，努力白费
  desc: 通过盘点独特优势（理财实战收益、带学经验）与观察红海竞争（写作课饱和），主动放弃无优势赛道，转向竞争小且有壁垒的细分领域（投资理财），实现精准切入。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
- 'no': 5
  name: 先完成，再完美：行动消解完美主义焦虑
  desc: 提出‘勇敢主义者’心态对抗‘怕写不好/怕卖不出去/怕被骂’的多重恐惧：接受不完美、先上线再迭代，实践中获得真实反馈是优化唯一来源。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
- 'no': 6
  name: 课程大纲树状设计法：有了核心才能开枝散叶
  desc: 将大纲视为‘树的中心’，先确立10节左右、单节2000-3000字、由浅入深递进的整体骨架，再逐节填充，避免漫无目的写作导致体系松散、返工成本高。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
- 'no': 7
  name: 轻量化交付形态：图文+社群+加餐三位一体模型
  desc: 针对强实操属性课程，采用‘图文主课（便于边学边操作）+ 社群陪伴（氛围与深度链接）+ 不定期加餐（经历强化信心）’组合，平衡制作成本与学员体验。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
- 'no': 8
  name: 朋友圈长短软硬结合文案法：真诚是最高级的销售技巧
  desc: 公众号长文(1500-2000字)建立深度信任 + 朋友圈日更2-5条短文案(200-500字)高频触达；软文分享生活/观点建立人设，硬广直击痛点/促单，避免微商式刷屏；验证老客复购率40-50%。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
  - paper: docs/202306/20230613_243.md
- 'no': 9
  name: 痛点直击四步文案公式：共情-权威-方案-信任
  desc: 针对核心痛点(存不下钱/收入单一) -> 引用权威金句强化认知 -> 展示方案价值 -> 融入真实经历背书(从租房到买房/存下100万)，形成成交闭环；亲身经历是最好背书。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
- 'no': 10
  name: 阶梯式涨价与名额稀缺销售模型：打破决策拖延
  desc: 结合早鸟价、阶梯涨价(每期涨30-100元)、动态名额倒计时(名额-1/-2)三重机制，利用损失厌恶与稀缺心理驱动犹豫用户加速下单，亲测‘即将涨价时集中下单’显著有效。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
- 'no': 11
  name: 定价即定客群：客单价匹配用户付费能力
  desc: 基于目标用户‘付费意愿’与‘付费能力’定价，而非单纯追求高客单；作者用户群为经济条件一般的副业需求者，采取200-600元平民价换取高转化与复购，为未来高客单迭代奠基。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
  - paper: docs/202306/20230613_243.md
- 'no': 12
  name: 价值定价锚点法则：价值=价格×10倍
  desc: 确立非标品价值自定义定律：课程价值边界模糊，卖家拥有定义权；高价本质是高价值感传递，核心在于挖掘放大‘为用户节省时间/解决痛点/达成目标’的确定性结果。
  role: definition
  src:
  - paper: docs/202306/20230613_243.md
- 'no': 13
  name: 课程分层产品矩阵：流量/信任/利润三层阶梯
  desc: 根据用户信任度与客单价划分：流量产品(几十-几百元，引流) -> 信任产品(几百-几千元，建立信任) -> 利润产品(几万-几十万，核心变现)，每层为前层后端，层层转化最大化LTV。
  role: method
  src:
  - paper: docs/202306/20230613_243.md
- 'no': 14
  name: 价值包装四维模型：从供给侧自嗨转向用户视角
  desc: 将课程价值提炼为目标(帮实现什么)、问题(解决什么痛点)、方案(提供何种路径)、交付(给何种物料/服务)四维，避免陷入材质/工艺等供给侧自嗨；律师课程重构案例验证有效性。
  role: method
  src:
  - paper: docs/202306/20230613_243.md
- 'no': 15
  name: 交付核心矛盾定律：收钱易、交付难、做好更难
  desc: 揭示行业痛点：交付环节非标准化导致高时间成本与低效果并存；旧模式下学员周期失控(1-2个月)、中途流失高、响应慢引发投诉，必须通过体系化重构解决。
  role: motivation
  src:
  - paper: docs/202306/20230613_075.md
- 'no': 16
  name: 师生协作关系重构：体系驱动人，而非人驱动人
  desc: 将‘老师被动跟进学员’重构为‘学员主动跟随固定体系节奏’的标准化协作模式；核心逻辑是将‘跟进压力’从导师转移给‘规则/周期/群体压力’，实现学员自驱式执行。
  role: method
  src:
  - paper: docs/202306/20230613_075.md
- 'no': 17
  name: 标准化交付四步走体系：定周期→设目标→整合执行→双循环监督
  desc: 借鉴生财航海模式：1)固定学习周期立规矩倒逼珍惜时间；2)目标激励与分层社群(进高阶结果群)立诱饵；3)执行力整合机制(学员选10品+导师增20品→沉淀品库)立协作；4)早晚双循环监督打卡+惩罚+素材复用立闭环。
  role: method
  src:
  - paper: docs/202306/20230613_075.md
- 'no': 18
  name: 分级答疑SOP：兼顾交付效率与新人体验
  desc: 根据时间成本与问题性质分级：忙碌期引导自学(委婉夸赞+指引课程)；闲时手把手保姆教学。同时‘教是最好的学’，据此反哺课程迭代，实现交付与产品升级双赢。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
- 'no': 19
  name: 学员变现闭环设计：交付即营销的最高形态
  desc: 在课程体系内植入‘实操闯关’与‘赚回学费/盈利’正向激励，学员学习期即获真实收益(甚至10倍学费)，强化信任、提升复购、生成天然传播素材；验证‘执行力大于方法论’。
  role: method
  src:
  - paper: docs/202306/20230613_073.md
  - paper: docs/202306/20230613_075.md
- 'no': 20
  name: 公域精准获客法：精准流量大于大流量
  desc: 利用巨量算数、蝉妈妈分析同行账号与直播观众画像 -> 反向定制高吸引力内容 -> 短视频植入软硬广引发好奇(而非罗列大纲) -> 直播间批量承接转化；百级精准流量经优质转化超越万级泛流量。
  role: method
  src:
  - paper: docs/202306/20230613_243.md
- 'no': 21
  name: 私域三大转化场域SOP：朋友圈/群发售/1v1私聊
  desc: 朋友圈：高频种草/信任维护(1小时/条，覆盖生活/成交/干货/互动/案例)；群发售：批量稀缺/促单成交(预热-造势-爆发-收尾标准化流程+逐字稿模版)；1v1：高客单/深度信任(公域价值积累->私域高频触达->低客单首付信任锚点->高客单深度转化)。
  role: method
  src:
  - paper: docs/202306/20230613_243.md
- 'no': 22
  name: 个人品牌信任加速器：视频媒介构建准社会关系
  desc: 个人品牌本质是降低商业信任成本杠杆；视频因高信息密度(视听觉+环境+人格特质)最利于建立‘准社会关系’；普通人只需在细分领域持续输出真实个性即可构建小而美信任护城河。
  role: extension
  src:
  - paper: docs/202306/20230613_243.md
- 'no': 23
  name: 拥抱变化即生存：外部冲击是业务迭代的强制信号
  desc: 可转债新规切断打新业务、公众号广告变现变难等外部冲击，倒逼作者从单一变现转向多课程体系(入门+进阶)；拒绝抱怨、快速开源新收入源，是自由职业者持续生存的核心能力。
  role: limitation
  src:
  - paper: docs/202306/20230613_073.md
- 'no': 24
  name: 组织能力边界：人员分工精细度决定体系上限
  desc: 标准化交付体系对运营团队分工专业化(助教、社群运营、内容整理分离)有硬性要求；单人或小团队难以完美复刻航海全套动作，需根据团队规模裁剪落地。
  role: limitation
  src:
  - paper: docs/202306/20230613_075.md
