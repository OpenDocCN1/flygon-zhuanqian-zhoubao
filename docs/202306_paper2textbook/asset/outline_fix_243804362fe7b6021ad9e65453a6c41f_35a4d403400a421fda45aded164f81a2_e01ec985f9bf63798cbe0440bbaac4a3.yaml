'no': 1
name: 副业认知重构 —— 从“找项目”到“懂商业本质”
desc: 本章通过真实副业案例的底层解构，建立“价值不等价交换”为核心的商业认知，教会学员用六维模型评估项目、用双维分类法寻找机会，并通过完整案例复盘理解从项目启动、爆点挖掘到合规红线的全生命周期，从根本上摆脱盲目跟风、建立理性决策的副业操作系统。
nodes:
- 'no': 1
  name: 赚钱的底层逻辑：价值不等价交换
  desc: 赚钱的本质是提供者提供价值（商品/服务/便利），接收者支付报酬；提供者收获报酬大于付出成本即盈利。核心在于如何提供高市场价格的价值，而非寻找所谓“躺赚项目”。
  role: definition
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 2
  name: 项目前置逻辑：先想清商业模型再动手
  desc: 做项目前必须推演“谁付费？为什么付费？我提供什么价值？成本结构如何？竞争格局是否允许新人生存？”若逻辑不通，执行再强也难盈利；这是避免试错成本的元策略。
  role: motivation
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 3
  name: 项目可行性六维评估模型
  desc: 从解决痛点、付费意愿、竞争激烈度、用户群体规模、个人强项匹配度、执行成本承受力六个维度系统评估项目可行性，拒绝凭感觉入场。该模型可直接用于筛选本章后续介绍的所有副业案例。
  role: method
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 4
  name: 机会来源双维分类法：从个人出发 vs 从他人出发
  desc: 将商业机会来源归纳为“从个人出发”（生活痛点、技能优势、资源人脉等）与“从他人出发”（社会热点、行业趋势、竞品分析等）两大类，结构化拓展机会搜索广度，让灵感不再依赖运气。
  role: method
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 5
  name: 非品牌忠诚型市场：新人切入的最佳战场
  desc: 指用户对品牌无粘性、仅关注核心利益（如折扣真实有效）的市场特性。此类市场无垄断龙头，新进入者只要提供有效信息即可分羹，可行性高，是资源有限者的理想切入点。
  role: definition
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 6
  name: 小白入场策略：复制头部布局，数据找差异
  desc: 资源弱时不创新模式，直接复制成熟竞品的验证过的UI/内容结构降低认知负荷；随后依托自有数据与用户反馈，在“无法复制的资源壁垒”外寻找“可复制的技术/体验差异”作为突破口。
  role: method
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 7
  name: 项目风险与收益共存论：Google Cash 的三类参与者
  desc: 以Google Cash项目为例，说明任何副业项目都存在持续盈利、未盈利、被骗三种结局。参与者分层决定了收益分布，不存在稳赚不赔的项目，必须建立风险识别与止损能力。
  role: limitation
  src:
  - paper: docs/202306/20230627_123.md
- 'no': 8
  name: 项目本质归因论：识别营销联盟的底层架构
  desc: Google Cash项目的核心运作机制本质上属于营销联盟（CPS/CPC/CPA）范畴，而非神秘黑箱技术。理解项目本质有助于评估其天花板、竞争度与可持续性，避免被包装话术误导。
  role: definition
  src:
  - paper: docs/202306/20230627_123.md
- 'no': 9
  name: 做店赚辛苦钱 vs 招商放大变现的认知分层
  desc: 单纯运营店铺属于劳动密集型，利润上限低（辛苦钱）；真正的规模化财富路径在于“招商”（收徒/培训/供应链输出），将成熟模式标准化复制给他人。但招商模式需要更强信任与交付能力。
  role: limitation
  src:
  - paper: docs/202306/20230627_050.md
- 'no': 10
  name: 私域CPS生存核心定律：闭环即正义
  desc: 在微信生态下，私域CPS小程序的生死线不在于业务品类，而在于是否构建了“用户支付-平台分账-服务履约”的实质性消费闭环。纯导流（跳转/口令）必死，自有交易闭环可生。这一原则适用于所有依赖平台生态的业务。
  role: definition
  src:
  - paper: docs/202306/20230627_129.md
- 'no': 11
  name: 项目复盘实证：Amazon Affiliate 折扣站从 0 到月入十万再到被封全过程
  desc: 独立站成本<$100，WordPress建站，A/B测试选品确认Amazon优于eBay；上线“百分比折扣搜索”功能转化率提升3倍，巅峰月入十万；后因付费垃圾外链被Google降权、FB群名含商标被封、多联盟混铺降低收益、共享主机性能瓶颈四大踩坑导致项目终局。该案例完整展示了从选品、爆点、自动化到合规红线的全生命周期。
  role: experiment
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 12
  name: 延伸阅读：社群内部文档索引
  desc: 提供两篇仅含外部链接的社群文档（语雀/飞书）作为延伸资料，分别标记为【快手】2篇和【海外项目】3篇，学员可按需访问获取更多案例数据与模板。
  role: extension
  src:
  - paper: docs/202306/20230613_064.md
  - paper: docs/202306/20230627_122.md
