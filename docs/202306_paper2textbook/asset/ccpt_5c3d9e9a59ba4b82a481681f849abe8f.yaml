paper: docs/202306/20230627_076.md
desc: 该素材为作者“静水流深”关于其1998-1999年大学时期初涉互联网及海外网赚（Spedia挂机赚美元、建站拉下线、西陆论坛获奖、发现EMUHOME论坛）的自述性回忆录，核心在于复盘早期互联网草根创业者从“零技术、零认知”到“模仿竞品、寻找切入点、利用免费资源、挖掘高价值社区（EMUHOME）”的认知跃迁路径，确立了“找目标、找切入点、模仿优秀者、利用杠杆（推荐制/联盟）”的出海赚钱底层逻辑雏形。
concepts:
- name: 海外淘金/网赚
  desc: 指利用互联网跨国界获取美元收益的行为，素材中特指1999年前后通过挂机软件、联盟推荐、EMU等方式赚取美金的早期实践。
  is_original: false
  excerpt:
  - 不经意中发现了一个人发了一个帖子，有关网上赚钱的，就是你去下载一个程序，桌面就多了一个广告条，根据你上网时间，给你报酬，一小时大概 0.5-0.8 美元。那个公司估计很多人也清楚，叫
    Spedia。
  - 现在海外淘金的 EMU 这个词的来源，就是出自这里。
- name: Spedia 模式
  desc: 早期典型的‘挂机赚钱’联盟模式：用户下载客户端挂广告条按时长付费，并提供25%推荐下线分成机制，是作者首次真实收到海外支票的验证案例。
  is_original: false
  excerpt:
  - 那个公司估计很多人也清楚，叫 Spedia。
  - Spedia 这家公司，有这样一个条款，你推荐的用户产生的收益的 25%，公司可以额外的付给你，作为推荐奖金，也就是大家熟悉的拉下线了。
- name: EMUHOME (模拟之家)
  desc: 早期海外网赚核心社区/论坛，EMU（Emulator/作弊模拟）一词在中文圈的发源地，作者由此系统性认识网赚行业深度玩法，标志着从‘挂机赚零花钱’向‘专业出海淘金’转型的关键节点。
  is_original: false
  excerpt:
  - 我知道了一个叫模拟之家（EMUHOME）的论坛，从此真正的改变了我对整个网上赚钱这个行业的认识以及看法，现在海外淘金的 EMU 这个词的来源，就是出自这里。
- name: 武汉129信箱 / Push Mail 雏形
  desc: 武汉电信针对寻呼机用户提供的邮箱服务，具备邮件到达寻呼机推送提示功能，属于极早期的移动端邮件推送（Push Mail）应用场景。
  is_original: false
  excerpt:
  - 武汉129信箱，就是武汉电信针对寻呼机用户才能够申请得到的信箱……有人给你发 E-Mail 的时候，你的寻呼机会有提示，中文机还可以显示邮件内容。如今，Push
    Mail 的技术广泛使用，但是包括现在 Push Mail 还是有很多人不知道，我在那个时候，就差不多已经在使用 Push Mail 的技术了。
methods:
- name: __overview__
  desc: 草根出海创业的‘模仿-切入-杠杆’三步走方法论：1. 寻找成熟标杆（如休闲居）进行模式复制而非内容采集；2. 确立差异化切入点（第九城市攻略+网赚栏目双轨）；3.
    利用免费/低成本基建（NetBig 5M空间、西陆免费论坛）与推荐分成杠杆（Spedia 25%下线佣金）放大收益。
  excerpt:
  - 当你什么都不会，没有目标的时候，你第一件事情就是要去找到一个目标，以及一个切入点，来完成你的想法。其次，找到一个你可以参考的目标，去模仿人家的优点。
  - 我的一开始的路线，也是去模仿休闲居，也来做第九城市周边攻略，同时也是利用人气，去拉我的 Spedia 的下线。
  - 我只是复制模式，并不是采集内容，而且一开始，我什么都不懂，一切都还是用的免费空间……我可以申请多个空间来控制各个栏目。
- name: 支票托收成本优化
  desc: 针对早期海外支票兑现的实操方法：对比银行手续费（交行10元 vs 中行更贵），选择低成本渠道最大化净收入。
  excerpt:
  - 我并没有去选择很多人喜欢去的中国银行去托收支票，而是去了交通银行，因为手续费比中国银行便宜，人民币 10 块钱。
- name: 免费资源组合建站法
  desc: 零成本建站组合策略：主站用 NetBig 5M 纯静态 HTML 空间（极速稳定）、论坛用西陆社区免费申请、镜像/备用用国外免费广告空间（虽广告收益被骗但技术可行），实现多栏目分离部署。
  excerpt:
  - 那个年代，所有的网站都是纯 Html 更新的，5M 大概可以放 100 个以上的网页，更重要的一点，我可以申请多个空间来控制各个栏目。至于为什么我要选择网大
    5M 这么小的空间来做网站，理由很简单，速度飞快，相当的稳定。
  - 我在西陆社区申请了一个自己的论坛……同时，因此也因为论坛办得好，获得了西陆每个月颁发的最有人气论坛奖金。
theorems:
- name: 草根创业‘找目标、找切入点、模仿优秀者’首要原则
  desc: 当个体缺乏技术、资源、方向时，首要任务非盲目原创，而是锁定已验证成功的标杆案例，复制其商业模式（非内容），并结合自身可获取资源寻找差异化切入点。
  excerpt:
  - 当你什么都不会，没有目标的时候，你第一件事情就是要去找到一个目标，以及一个切入点，来完成你的想法。其次，找到一个你可以参考的目标，去模仿人家的优点。这点腾讯乃是天下第一的典范，我当时的策略也是如此。
- name: ‘验证即真理’的海外赚钱认知跃迁
  desc: 仅凭搜索引擎看到他人收款截图（证据）即可打破‘周围人均质疑是骗局’的认知围墙，迈出第一步；随后通过亲身兑现支票完成闭环，建立‘网上赚钱确实是个好渠道’的坚定信念，驱动后续持续探索。
  excerpt:
  - 周围的所有的人都认为这是骗人的，我也有些怀疑，就去搜索引擎搜狐……发现其实很多人还是收到过支票的，包括扫描图片等，于是我就开始了海外淘金的第一步。
  - 有了这一次经历，我发现了网上赚钱确实是个好渠道，于是开始有了想法。
- name: 社区高阶认知源于‘圈子渗透’而非‘孤军奋战’
  desc: 个体认知上限由所在社区质量决定：西陆论坛获奖仅是流量层面成果，真正质变源于渗透进入 EMUHOME 这一高密度高手圈子，接触核心黑话（EMU）与深层玩法，实现认知维度跃升。
  excerpt:
  - 同时，因此也因为论坛办得好，获得了西陆每个月颁发的最有人气论坛奖金，但是更重要的是，我知道了一个叫模拟之家（EMUHOME）的论坛，从此真正的改变了我对整个网上赚钱这个行业的认识以及看法。
findings:
- name: Spedia 首笔支票实收验证
  desc: '[evidence] 作者亲历：Spedia 账户累计超 $30 申请支付，约 20 天后收到天蓝色底色支票，通过交通银行托收，手续费 10 元人民币，成功兑现，证实海外联盟营销收益真实可兑换。'
  excerpt:
  - 不经意之间，我的 Spedia 的帐号已经超过了 30 美元，我申请了支付。在这之后……经过了 20 多天的等待，我收到了 Spedia 的支票，天蓝色的底色……去了交通银行，因为手续费比中国银行便宜，人民币
    10 块钱。
- name: 西陆论坛 ‘最有人气论坛’ 奖金获取
  desc: '[evidence] 作者在西陆社区申请论坛并运营良好，获得平台官方每月颁发的 ‘最有人气论坛’ 奖金，证明免费平台建站亦可产生现金流正反馈。'
  excerpt:
  - 我在西陆社区申请了一个自己的论坛，同时，因此也因为论坛办得好，获得了西陆每个月颁发的最有人气论坛奖金。
- name: 国外免费广告空间广告收益为骗局
  desc: '[evidence] 作者实测国外免费提供空间并按广告展示付费的服务，空间质量尚可但广告结算方为骗子，从未收到任何支付，提示免费资源利用需甄别变现环节可靠性。'
  excerpt:
  - 那个空间还可以，但是付费广告是骗子一个，根本没收到过任何支付。
- name: 休闲居模式长期存活但创始人失去热情
  desc: '[evidence] 作者模仿对象‘休闲居’网站十年后依然在线，但创办者‘小浩哥’早已失去热情，侧印早期网赚模式可持续性强但个体易因缺乏迭代动力而退场。'
  excerpt:
  - 十年过去了，这个网站依然还在，但是休闲居的创办者小浩哥早已经失去了热情，包括我，也跟当时的情况完全不一样了。
