learning_targets:
- 理解从“打工者思维”到“赚钱者思维”的认知跃迁路径
- 掌握商业模式评估与选择的量化工具（利润公式、三层分级、六维模型）
- 熟悉AI时代五大变现赛道（写作、绘画、视频、私有化、SEO）的核心玩法和工具链
- 掌握闲鱼、小红书、抖音、微信等主流平台的从0到1标准化SOP
- 学会用私域流量与内容生产SOP构建可复利的商业闭环
concept_map:
- 副业实战与商业变现
- ├── 认知重构
- │   ├── 认知破局：从打工者思维到赚钱者思维
- │   ├── 财富的本质：持续提取剩余价值
- │   ├── 商业模式公式：利润=(收入-成本)×频次×周期
- │   ├── 商业模式分层：血酬/资源租金/规则制定
- │   ├── 时间杠杆：零边际成本产品实现时间复用
- │   ├── 商业进化三阶段：渠道→平台→认知
- │   └── 认知觉醒：三维重塑法与积累资源
- ├── AI 工具变现
- │   ├── AI 认知破局：低机会成本+工具杠杆
- │   ├── AI 工具分类与选品：四步法动态维护
- │   ├── AI 写作变现：RPA+AI内容工厂
