paper: docs/202306/S9SddaKHMoQEflxP6RucOtqGnCb.md
desc: 该素材是一篇实操型教程，详细演示了如何利用 Midjourney 生成风格统一的“懒人简笔画”风格图像，再配合免费手机端工具“可画”制作动态表情包，最后拆解了微信表情开放平台打赏、私域引流变现、社群定制接单三大商业化路径，形成从
  AI 绘图提示词工程到动图制作再到商业落地的完整闭环。
concepts:
- name: 懒人简笔画风格
  desc: 一种以单根黑色粗线条勾勒轮廓、极简可爱、适合做表情包的 AI 绘画风格，通过特定提示词组合在 Midjourney 中稳定复现。
  is_original: true
  excerpt:
  - 公式：【懒人简笔画】+【一根黑色的粗线条轮廓】+【你想要的主体和画面】。
  - Lazy stick figure, a thick black line Outlines a cat
- name: 提示词结构化公式
  desc: 将 MJ 提示词拆解为“风格词+线条描述+主体动作/属性+背景/辅助词”四层结构，通过逐步消融实验验证各词权重，实现风格可控。
  is_original: true
  excerpt:
  - 公式：【懒人简笔画】+【一根黑色的粗线条轮廓】+【你想要的主体和画面】+【白色背景】
  - Lazy stick figure, a black thick line outline, chibi, drawing a big mouth laughing
    very happy super cute rabbit, wearing a magician's black hat, white background
- name: Seed 复现机制
  desc: 在 Midjourney 中使用相同提示词与 Seed 值可 100% 复现同一张图，解决表情包系列角色一致性难题。
  is_original: false
  excerpt:
  - 最后，今天有一个神奇的发现，一样的关键词+一样的seed值，会出现一模一样的图
  - 可以直接拿来做表情包了~~
- name: 垫图/垫图法
  desc: 将已生成的满意图片作为图片提示词输入 MJ，生成同风格、同角色的新动作/表情图，用于快速扩充表情包素材库。
  is_original: false
  excerpt:
  - 想要差不多的，做表情包，就来垫图，或者用seed这个参数，来搞起来。
  - 下面2张是垫图出来的，多来几个，就可以做个表情包系列了。
- name: 可画
  desc: 一款免费的手机端多功能设计工具，支持模板搜索、抠图、动效添加、GIF/MP4 导出，零 PS 基础即可制作动态表情包。
  is_original: false
  excerpt:
  - 木木今天给大家推荐一个工具——『可画』，让新手小白也可以快速上手做基础的动图。最主要的：它是不收费的。
  - 在最下方的菜单栏，往左滑动，找到『动效』这个按钮，在里面有很多效果
methods:
- name: __overview__
  desc: 全流程方法论：① 通过消融实验确定核心提示词 → ② 结构化提示词公式批量生成基础角色 → ③ 利用 Seed 固定或垫图扩充同一角色多表情 → ④
    导入“可画”抠图+添加动效+设置时长 → ⑤ 导出 GIF/MP4 → ⑥ 依据三大变现模型上架或引流。
  excerpt:
  - 一、懒人简笔画的AI绘画探索思路
  - 二、不会用PS，也可以做出动态表情包
  - 三、 挖一挖，表情包的那些赚钱玩法
- name: 提示词消融验证法
  desc: 对比“含风格词/不含风格词/替换风格词”三组实验，量化单一关键词对画面风格的贡献度，快速锚定最小有效提示词集合。
  excerpt:
  - 我想要验证一下，没有『懒人简笔画』，这个词还成不成立，去掉这个词试一下。
  - 这次想要验证一下，到底是『懒人简笔画』的原因还是只输入『简笔画』也可以一样出图
- name: 可画动图制作标准化流程
  desc: 搜模板→删原图→导入AI图→抠图工具去背→缩放定位→选中图层加动效→选中文字加动效→删水印→调时长(如2秒)→导出GIF/MP4。
  excerpt:
  - 选中的是开心心模版。
  - 点击『图标』删除原图 -> 点击『➕』号添加图片 -> 选择『手机相册』 -> 选择『添加到页面』
  - 选择下面『特效』，选择『抠图工具』
  - 在最下方的菜单栏，往左滑动，找到『动效』这个按钮
  - 设置一下动图的时间，选中图片，会出现默认5.0秒的按钮，我们可以根据自己的喜好，来设置秒数，我这里设置的是2.0秒
  - 建议直接保存为『GIF动图』
theorems:
- name: AI 表情包制作零门槛论
  desc: 不懂手绘、不懂 PS、不懂代码的普通人，仅用 MJ + 免费手机 App 即可在 30 分钟内产出商业级动态表情包，打破了“设计师垄断表情包制作”的认知壁垒。
  excerpt:
  - 《新手也可以快速上手的AI绘画：懒人简笔画及衍生动态表情包篇》
  - 不会用PS，也可以做出动态表情包
  - 最主要的：它是不收费的。
- name: 风格词最小必要性原则
  desc: 在 MJ 提示词中，核心风格词（如‘懒人简笔画’）不可省略，通用词（如‘简笔画’）无法替代其特定视觉效果；必须通过对照实验确认最小必要词汇集。
  excerpt:
  - 懒人简笔画还是有点用的哇
  - 看来木木喜欢的『懒人简笔画』还是有点效果的
- name: 表情包商业化三阶跃迁模型
  desc: 表情包变现遵循‘平台被动分成(微信打赏) → 私域主动引流(卖包/拉新/小程序) → 高客单定制服务(社群IP/企业订单)’的价值递增路径，前者积累素材与流量，后者实现高变现。
  excerpt:
  - 3.1 将表情包上架到微信|表情开放平台，躺赚
  - 3.2 通过表情包引流到私域
  - 3.3 接定制单，做社群的专属表情包
  - 高客单，钱多多。可以链接到各个社群的主理人
findings:
- name: 懒人简笔画核心提示词有效性
  desc: '[evidence] 对比实验证明：含“Lazy stick figure”出图符合预期单线条风格；去掉该词出图失去简笔画感；仅用“Stick figure”效果差于“Lazy
    stick figure”，确立核心词必要性。'
  excerpt:
  - 呃，只有图2的那个白色的说猫不是猫的动物是我想要的画面，其余的都不是
  - 各种风情的猫出现了，但是没有简笔画的感觉了。
  - OK，试出来了，看来木木喜欢的『懒人简笔画』还是有点效果的
- name: Chibi 与自动填色关键词增强可爱度与着色可控性
  desc: '[evidence] 加入“chibi”显著提升角色可爱度；加入“autofill color”使 MJ 自动按简笔画惯例填充腮红/服装色块，避免全图单一色调。'
  excerpt:
  - 怀疑我打开的方式不对，帽子有了，但是不够可爱啊~~，这个时候怎么办，加个万能词『chibi』试试
  - 想要个绿色的裤子，黑色的帽子，出来的只有一个颜色，通篇绿
  - 好吧，它是懂我的，知道我想要脸蛋红扑扑，不过，这也证明了，它已经被喂过简笔画了，知道该往哪里填色了
- name: Seed 固定实现角色绝对一致性
  desc: '[evidence] 实测相同提示词+相同 Seed 值输出像素级一致图片，可直接用于表情包连续帧制作，解决 MJ 随机性导致的角色漂移问题。'
  excerpt:
  - 最后，今天有一个神奇的发现，一样的关键词+一样的seed值，会出现一模一样的图
  - 可以直接拿来做表情包了~~
- name: 可画免费版导出尺寸限制与低成本会员方案
  desc: '[evidence] 免费版导出尺寸固定且较小；淘宝 1.5 元/月企业会员可解锁超清大尺寸 MP4，成本极低且衍生出“代开会员/搭建企业账号”副业。'
  excerpt:
  - 没有会员也可以做图，但是出来的图是默认的尺寸，会比较小，也不能调整到大尺寸
  - 我买的一个月1.5元的，我看了一下，是加入企业账号了，这个又是一个可以赚钱的项目了
- name: 社群定制表情包高客单验证案例
  desc: '[claim] 作者主张社群专属表情包具有高客单、连接主理人、强化归属感三大价值，引用“生财有术圈友交流需表情包”“小马宋老师做文字表情包”作为佐证，但未公开具体成交金额与转化数据。'
  excerpt:
  - 远的不说，就说咱现在圈友交流，如果没有一套生财表情包，那就都不是生财人。还有小马宋老师，也做出了简单的文字表情包
  - 高客单，钱多多。可以链接到各个社群的主理人，这是一笔隐形的巨大的财富。
