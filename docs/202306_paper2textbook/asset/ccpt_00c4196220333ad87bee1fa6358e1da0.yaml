paper: docs/202306/20230613_312.md
desc: 该素材为一篇小红书聚光投放实战攻略的引流推广帖，作者陈铭 ivy 作为矩阵号玩家分享其低成本高效引流经验，核心主张其私信单价仅 10 元/个，远低于同行
  30-60 元/个的行业水平，旨在通过飞书文档提供安全省钱的聚光投放具体解决方案。
concepts:
- name: 小红书矩阵号玩家
  desc: 指同时运营多个小红书账号、形成账号矩阵以实现规模化流量获取与变现的运营者身份。
  is_original: false
  excerpt:
  - 这里是 ivy 酱，小红书矩阵号玩家。
- name: 聚光投放
  desc: 小红书官方商业推广平台，素材核心讨论的付费流量获取工具。
  is_original: false
  excerpt:
  - 目前我有两位数的账号充值了聚光投放
  - 通过聚光投放，安全+省钱的引流
- name: 私信单价
  desc: 通过聚光投放获取一个用户私信线索所需的广告成本，是衡量投放效率的核心指标。
  is_original: false
  excerpt:
  - 私信单价在 10 元/个左右，我的同行基本都是 30-60 元/个私信
- name: 低粉高变现
  desc: 指账号粉丝量少但商业变现能力强的运营模式，是作者过往经验的核心标签。
  is_original: false
  excerpt:
  - 粉丝 3000 月营收 20 万，小红书低粉高变现的蓝海攻略分享
methods:
- name: __overview__
  desc: 作者基于矩阵号实战经验，主张通过聚光平台进行付费投放以低成本（私信单价 10 元）获取精准线索，具体操作细节需跳转飞书文档查看。
  excerpt:
  - 目前我有两位数的账号充值了聚光投放，私信单价在 10 元/个左右
  - 如果你也想通过聚光投放，安全+省钱的引流，那么这篇文章会给到你解决方案。
  - 正文请点击飞书链接
theorems:
- name: 矩阵号聚光投放低成本优势论
  desc: 作者基于实战数据宣称：采用矩阵号批量充值聚光投放，可将私信获客成本控制在 10 元/个，显著低于同行 30-60 元/个的平均水平，实现安全且省钱的引流。
  excerpt:
  - 目前我有两位数的账号充值了聚光投放，私信单价在 10 元/个左右，我的同行基本都是 30-60 元/个私信。如果你也想通过聚光投放，安全+省钱的引流，那么这篇文章会给到你解决方案。
findings:
- name: 作者聚光投放实战数据声明
  desc: '[claim] 作者声称拥有两位数账号实操聚光投放，私信单价稳定在 10 元/个左右，远低于市场同行 30-60 元/个的均价。'
  excerpt:
  - 目前我有两位数的账号充值了聚光投放，私信单价在 10 元/个左右，我的同行基本都是 30-60 元/个私信
- name: 过往低粉高变现案例背书
  desc: '[claim] 作者引用去年案例：粉丝仅 3000 时即实现月营收 20 万，验证其低粉高变现及矩阵号运营能力。'
  excerpt:
  - 去年 5 月写过【粉丝 3000 月营收 20 万，小红书低粉高变现的蓝海攻略分享】
