units:
- 'no': 1
  name: 精准找群 —— 用付费筛选换高质量人脉
  points:
  - '**为什么需要这个概念？**'
  - '- 泛流量获取成本虽低，但后端转化率极低，耗时不成比例'
  - '- 精准用户虽获取成本较高，但成交率与客单价显著更高，整体利润最大化'
  - '- 免费群易沦为引流粉与广告泛滥，缺乏有效社群价值'
  - '**核心定义**'
  - '- 精准找群是基于目标用户画像与业务属性，通过关键词搜索、付费筛选、社交裂变等手段，获取高意向、高转化潜力的微信群资源'
  - '**关键性质**'
  - '- 付费即筛选：付费门槛天然过滤免费党与低意向用户，留存者具备付费习惯与认知水平'
  - '- 渠道-业务匹配：线上业务聚焦微信端/内容平台/知识付费平台，线下业务聚焦实体店/活动/换群买群'
  - '- 精准度决定成交率：ROI与用户精准度正相关'
  - '**典型例子**'
  - '- 购买同行付费社群进入，观察高价值成员并二跳渗透'
  - '- 线下实体店消费后自然入群，获取高LBS精准度的同城用户'
  - '**边界条件**'
  - '- 微信好友基数过少时，搜索框关键词检索效果显著下降'
  - '- 进群后立即发广告会导致封号或踢出，需先建立信任再转化'
  - '...'
  sources:
  - paper: docs/202306/20230613_110.md
    role: origin
  excerpts:
  - 找群我非常熟悉，特别是找一些精准的用户群...多去进精准的用户群，获取精准的流量，后续成交率会大大提高，利润肯定也会大大增加。
  - 愿意付费进群的，基本上都是一些跟你行业多少有点相关联的人...愿意付费进群的人，质量都不会太差。
  - 如果你是做线上知识付费的...如果你是做线下的...那你找群的渠道主要看线下的找群渠道就可以。
  - 加了微信就先放在哪里，可能过一段时间，或者是以后有什么活动的时候，很多的创作者会把你拉到活动群或者是粉丝群之类的。
- 'no': 2
  name: 微信原生功能 —— 把通讯工具变成营销操作系统
  points:
  - '**为什么需要这个概念？**'
  - '- 私域营销效率瓶颈往往不在于缺乏高级工具，而在于对微信原生基础功能认知不足'
  - '- 引入外部SCRM工具成本高、有迁移风险，数据主权不可控'
  - '- 需要零成本搭建个人知识管理中枢与CRM系统'
  - '**核心定义**'
  - '- 私域营销微信原生功能挖掘法是指不依赖第三方工具，仅通过微信聊天、设置、朋友圈等原生功能，结合营销场景重新组合应用，实现获客转化留存裂变全链路运营效率提升'
  - '**关键性质**'
  - '- 三维分类：微信聊天（沟通触达层）、微信设置（账号配置风控层）、微信朋友圈（内容分发信任层）'
  - '- 单人群即私有化云端收藏夹，替代专业笔记软件核心功能'
  - '- 好友三维标签体系（备注+标签+描述）是精准用户画像结构'
  - '**典型例子**'
  - '- 备注-标签-描述构建精准用户画像，支撑单标签<200人合规群发'
  - '- 长按相册调用系统原相机提升业务场景拍摄清晰度'
  - '**边界条件**'
  - '- 单次群发200人上限倒逼标签组精细化运营'
  - '- iOS与Android微信原生功能存在系统性差异'
  - '...'
  sources:
  - paper: docs/202306/20230613_199.md
    role: origin
  excerpts:
  - 很多时候我们并没有在意这个功能的出现，可以给我们带来哪些便利，是否可以用在私域营销中，让我们效率翻倍。
  - 这篇私域营销 100 个小技巧，主要从三个方面介绍：1.微信聊天 2.微信设置 3.微信朋友圈
  - 做私域营销，不得不掌握的 100 个技巧，学会效率翻倍。
  - 个人也找了许多资料，也通过在生财往期精华帖学习，汇总了 100 个私域营销小技巧
- 'no': 3
  name: 3+1共进成交法 —— 三平台同步构建信任成交
  points:
  - '**为什么需要这个概念？**'
  - '- 单一私域渠道触达不足，难以建立足够信任完成高客单转化'
  - '- 社群天然具备集体转化优势，但群主单向输出容易精疲力竭'
  - '- 需要可复制、可执行的标准化动作流程替代靠感觉运营'
  - '**核心定义**'
  - '- 3+1共进成交法是指“3个平台（微信朋友圈+社群+公众号）+1个方法（解决用户痛点）”，通过多触点同步运营建立信任、完成转化的私域成交体系'
  - '**关键性质**'
  - '- 事件展示引流：以真实成绩、经验、踩坑为钩子吸引精准流量'
  - '- 流量承接SOP：5大主动链接节点（分享冒泡、新人进群、进新群、自己分享、运营朋友圈）'
  - '- 水到渠成裂变：分销机制+主动服务高意向用户'
  - '**典型例子**'
  - '- 五一后一周实操：加好友上百、卖出几十社群、收2个合伙人、接3-4个广告、总收入3万'
  - '- 朋友圈‘彩卉风’自发传播，验证IP人设与内容穿透力'
  - '**边界条件**'
  - '- 爆发期后必现平台期，需利用期做交付积累等待下一波飞跃'
  - '- 新人无积累者短期可能无现金流，但能建立起势节奏'
  - '...'
  sources:
  - paper: docs/202306/20230613_215.md
    role: origin
  excerpts:
  - 我采用的是 3+1 共进法，什么意思：3 个平台+1 个方法 三个平台：微信朋友圈+社群+公众号 一个方法：解决用户痛点
  - 这样，三个私域平台同步运营，同步输出，我就把私域所有人“知道我”这件事做到了，与此同时，转化率也就开始了。
  - 五一结束后正式发力，大概一周时间： 加到上百号好友 卖出几十个社群 收到两个合伙人 接到三四个广告 总收入 3W
  - 我的社群设置了分销，分销金 200 元，这样很多人都主动帮我做分销。
- 'no': 4
  name: 无门槛免费群转付费社群 —— 用付费门槛过滤低质用户
  points:
  - '**为什么需要这个概念？**'
  - '- 免费群易陷入引流粉污染、低质闲聊、广告泛滥三重死局'
  - '- 群主单向输出容易精疲力竭，无法持续'
  - '- 活跃度虚高（发红包无人抢），缺乏真实价值'
  - '**核心定义**'
  - '- 无门槛免费群转付费社群是指通过设置付费门槛替代无门槛邀请，利用付费筛选机制过滤引流粉与低意向用户，留存高付费意愿核心用户，构建高质量社群生态'
  - '**关键性质**'
  - '- 付费即筛选：付费门槛是最高效的用户筛选器与价值锚定器'
  - '- 群友共创与大咖背书：解决群主单向输出精疲力竭问题'
  - '- 精华内容结构化沉淀：构建社群护城河'
  - '**典型例子**'
  - '- 邀请14位群友分享、4次大咖讲座，沉淀4.6万字精华内容'
  - '- 免费装修围观群升级为家居陪伴年度付费社群'
  - '**边界条件**'
  - '- 付费社群转型需经历3个月系统学习+4个月实战执行'
  - '- 素材未披露具体GMV、ROI、续费率等关键财务指标，数据支撑度较弱'
  - '...'
  sources:
  - paper: docs/202306/20230613_132.md
    role: origin
  excerpts:
  - 那些群都称不上真正意义上的社群。
  - 加入的新人很多是引流为目的地爆粉，拉低老群友的体验感。
  - 终于把一个【免费装修围观群】升级到了【家居陪伴年度社群】，邀请了 14 位群友分享，4 次大咖讲座，已沉淀 46000 字精华内容，跑通了好几个变现闭环，实现了稳定变现。
  - 群内以群主发言为主，持续输出耗费大量时间、精力，得不到反馈，难以坚持输出。
- 'no': 5
  name: 视频号直播投放 —— 投放只是锦上添花的放大器
  points:
  - '**为什么需要这个概念？**'
  - '- 新手容易将投放视为决定性因素，忽视人货场根本地位'
  - '- 单条计划ROI过度关注，忽略整体投放计划及成交额量级'
  - '- 新平台算法波动大，固化经验快速失效'
  - '**核心定义**'
  - '- 视频号直播投放是指在人货场跑通基础上，利用微信豆等付费推广工具放大直播效果的系统化操作方法论'
  - '**关键性质**'
  - '- 投放作为放大器：非决定性因素，人货场才是扭转乾坤'
  - '- 整体ROI视角：不应过度关注单条计划ROI，而应通盘考量整体投放计划ROI及成交额量级'
  - '- 出价非线性收益：合适的出价+合适的人货场才能最大化ROI'
  - '**典型例子**'
  - '- 618活动第一达人郭亿易的带货打法飞书文档'
  - '- 账号自查清单、素材拆解优化（黄金前5秒>30%）'
  - '**边界条件**'
  - '- 账号99.9%无限流问题，播放低本质是素材问题'
  - '- 新计划学习期模型建模期间任何人为干预均会重置学习期'
  - '...'
  sources:
  - paper: docs/202306/20230613_130.md
    role: origin
  excerpts:
  - 在整个直播项目中，投放只是锦上添花的放大器，人货场才是扭转乾坤。
  - 无需过度关注单独每一条投放计划的 ROI，要通盘去看整体投放计划的 ROI，包括成交额量级。
  - 投放也是一个拼心智的过程，胆大心细，敢于尝试，ROI 才有可能保持在一个较高的水平。
  - 平台的算法是一直在调整变化的，特别是新平台。
- 'no': 6
  name: 公众号矩阵SEO —— 搭建关键词与流量双引擎
  points:
  - '**为什么需要这个概念？**'
  - '- 单一账号面临涨粉难（流量留不住、遇瓶颈）与变现难（单一依赖广告、抗风险弱）双重困境'
  - '- 公众号是相对封闭平台，缺乏站内推荐分发机制，运营者是唯一推广员'
  - '- 泛粉流失快、阅读低，需持续引流维持阅读量水位'
  - '**核心定义**'
  - '- 公众号矩阵SEO是指通过情感号与IP号协同，利用账号命名关键词布局、文章标题与内容关键词优化、多平台联合投放，获取长尾精准搜索流量的引流方法论'
  - '**关键性质**'
  - '- 矩阵账号策略：情感号负责引流，IP号负责变现，分离流量获取与商业变现职能'
  - '- 账号权重影响因子：更新频率、账号年龄、订阅/星标用户数、留言互动、原创认证状态'
  - '- 文章搜索排名规则：标题关键词匹配度 > 摘要关键词 > 正文关键词 > 互动数据 > 原创认证'
  - '**典型例子**'
  - '- 账号名‘孤寡青蛙’、‘天涯资料’具备自带流量属性，甚至可交易变现'
  - '- 单粉转化成本稳定在0.3-0.4元/人以下'
  - '**边界条件**'
  - '- 文章内容关键词堆砌会被腾讯判定为滥用，影响搜索排名'
  - '- 原创门槛为300字以上，征稿/整合/法律条文类不可申请'
  - '...'
  sources:
  - paper: docs/202306/20230613_131.md
    role: origin
  excerpts:
  - '我认为现阶段很多朋友存在的公众号问题，我整合了大概是两个: 第一个是涨粉难，第二个是变现难。'
  - 为了应对这个问题，我搭建了矩阵账号。一个情感号，一个 IP 号。
  - 首先就是你这个名字要尽可能的简洁，少一些生僻字，最好是跟一些热门的关键词相挂钩...这种名称它都是自带流量的...
  - 第五，就是我们说的最重要的，开通原创，你的文章的原创能力越强，你的文章的自然排名也会越靠前。
