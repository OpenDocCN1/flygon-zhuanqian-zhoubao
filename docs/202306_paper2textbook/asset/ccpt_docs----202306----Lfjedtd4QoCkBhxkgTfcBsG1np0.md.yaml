paper: docs/202306/Lfjedtd4QoCkBhxkgTfcBsG1np0.md
desc: 该素材是一篇面向大众的AI视频制作实操教程，核心内容是详细讲解如何利用Runway Gen-1的视频生视频功能配合剪映剪辑软件，制作名为“瞬息全宇宙·平行宇宙”风格的短视频。教程涵盖了素材预处理（4秒分段导出）、Runway账号注册与三种风格迁移模式（参考图、预设、文本提示词）的操作流程、后期拼接调速技巧，以及通过临时邮箱突破Runway免费时长限制的“白嫖”方案，并对比了剪映模板一键生成的简易版与Runway专业版的优劣差异。
concepts:
- name: 瞬息全宇宙·平行宇宙
  desc: 素材定义的核心视频类型，指保持原视频轮廓/动作不变，仅替换画面风格（如写实变动漫、变奥特曼）的视频形式，区别于画面不断跳变场景的“穿越之旅”类型。
  is_original: true
  excerpt:
  - “平行宇宙”就是固定着原来的照片轮廓，变成不一样的风格的视频，就像是一个人在平行宇宙，平行时空的形态
  - 制作平行宇宙，用到的则是一个叫runway的网站里的功能
- name: Runway Gen-1 视频生视频
  desc: 教程核心依赖的AI工具能力，支持以视频为输入，结合参考图像、预设风格或文本提示词生成新风格视频，免费版限制单次生成4秒、总时长37秒。
  is_original: false
  excerpt:
  - 平行宇宙用的是runway里面 视频生成视频 的一个功能
  - runway的免费版本只能处理4秒内的视频
  - 每个账号可以生成37秒的视频
- name: 风格强度
  desc: Runway Gen-1中控制风格迁移程度的关键参数，教程建议设置在30%左右以平衡原视频动作保真度与风格化效果。
  is_original: false
  excerpt:
  - 然后把风格强度设置到30%左右
- name: 临时邮箱破解时长限制
  desc: 利用一次性邮箱服务批量注册Runway账号，以绕过免费账号37秒生成时长的硬性限制，获取无限生成额度。
  is_original: true
  excerpt:
  - 如果大家有几个邮箱的，可以用完时长就换一个邮箱注册
  - 东子我这里分享一个创建邮箱很快的网站 https://smailpro.com/advanced
methods:
- name: __overview__
  desc: 平行宇宙视频制作全流程标准化作业法（SOP）：原始视频→剪映分段切割（≤4秒）→逐段导出→Runway三模式风格迁移→批量下载→剪映加速对齐（1.5倍）→顺序拼接→BGM/变速/卡点修饰→成片。
  excerpt:
  - 具体可以分为三个步骤：1.用剪辑软件裁剪原始视频 2.用runway转换视频 3.将转换的视频拼接到一起
  - 把我们需要进行视频转换的片段全部切成4秒内的小片段...选中一个片段...按键盘上的“I”...按键盘上的“O”...点击右上角的“导出”
  - 导入刚刚保存的视频片段，右边可以进行照片风格的设置...点击右边生成视频
  - 因为runway生成出来的视频会比原来的视频时长稍微长了一点，所以我们要把这些视频整体加速一下...一般加速到1.5倍就可以了
- name: Runway三模式风格迁移法
  desc: Runway Gen-1提供的三种互补风格控制方式：①参考图模式：上传指定图片（如奥特曼）迁移其视觉风格；②预设模式：使用平台内置风格预设；③文本提示词模式：通过自然语言描述生成目标风格。
  excerpt:
  - 在runway里面，有三种转换视风格的方法：1.导入照片，按照图片风格转换视频 2.用里面已经有的预设 3.输入关键词转换视频
  - 我这里上传了一张奥特曼的照片，点击选用...把风格强度设置到30%左右
- name: 剪映I/O点精准分段导出法
  desc: 利用剪映专业版键盘快捷键（I设入点、O设出点）配合“导出选定区域”功能，实现长视频按4秒规范无损批量切片导出，解决Runway输入时长限制。
  excerpt:
  - 选中一个片段，把指针放到片段的开头，按键盘上的“I”，再把指针拉到片段的结尾，按键盘上的“O”，这样就会选中这个区域，这时候就按右上角的“导出”
  - 导出一个片段之后...点击“取消选定区域”，然后重复上一步的操作，保存其他片段
- name: Runway输出时长校准加速法
  desc: 针对Runway Gen-1生成视频普遍存在的时长漂移（比原片长）问题，采用整体倍速（1.5x）强制对齐原始片段时长，保证拼接时动作节奏同步。
  excerpt:
  - 因为runway生成出来的视频会比原来的视频时长稍微长了一点，所以我们要把这些视频整体加速一下，让它们的时长一样长，一般加速到1.5倍就可以了
theorems:
- name: 工具选择决定效果上限论
  desc: “穿越之旅”需用Stable Diffusion + Deforum（本地部署、高显存、高技术门槛），而“平行宇宙”仅需Runway云端SaaS（零部署、低门槛、联网即用），两者技术路线完全不同，工具选错必导致无法复现目标效果。
  excerpt:
  - 制作穿越之旅，用到的是Stable Diffusion里面的deforum插件，制作平行宇宙，用到的则是一个叫runway的网站里的功能，两种视频都叫“瞬息全宇宙”，但做法是完全不同的
  - 网络上很多文章，其实都没搞懂两者的区别就教别人做了，甚至很多是教大家用做“穿越之旅”的方式去做“平行宇宙”的效果，结果最后观众其实做不出自己心中想要的效果
- name: 分段处理兼容云端算力限制论
  desc: 受限于Runway免费版单次4秒、总额37秒的算力配额，必须将长视频物理切分为≤4秒片段逐个处理，再通过后期拼接还原完整叙事，这是零成本制作长视频的必要工程化手段。
  excerpt:
  - 因为runway的免费版本只能处理4秒内的视频，我们要先处理一下视频素材，把它切成一个个4秒内的小片段
  - 每个账号可以生成37秒的视频...如果大家有几个邮箱的，可以用完时长就换一个邮箱注册
- name: 专业版与模板版效能权衡论
  desc: Runway专业版支持自定义参考图/提示词/强度，风格自由度高、效果可控，适合追求独特性的创作者；剪映模板版一键生成但风格固定、不可控，仅适合快速跟风、不求个性化的轻量用户。
  excerpt:
  - 大家可以看一下最后的效果，但是剪映做出来的视频风格会比较有限
  - 每个账号可以免费制作3次
findings:
- name: Runway生成视频系统性时长漂移
  desc: '[evidence] 实操发现Runway Gen-1生成的视频片段时长普遍长于输入片段，需通过1.5倍速补偿对齐，否则拼接后动作节奏错位。'
  excerpt:
  - 因为runway生成出来的视频会比原来的视频时长稍微长了一点，所以我们要把这些视频整体加速一下，让它们的时长一样长，一般加速到1.5倍就可以了
- name: 风格强度30%为动作保真与风格化平衡点
  desc: '[claim] 作者经验建议将风格强度设为30%左右，可在保留原视频动作轮廓的前提下实现明显风格迁移，但未给出不同强度对比实验数据。'
  excerpt:
  - 然后把风格强度设置到30%左右，左边的按钮可以点击看看是什么效果，如果可以的话就可以点击右边生成视频
- name: 临时邮箱批量注册可无限突破免费额度
  desc: '[evidence] 通过smailpro.com临时邮箱服务实测可快速生成有效邮箱接收验证码，配合Runway无设备指纹限制特性，实测可无限循环获取37秒免费生成额度。'
  excerpt:
  - 点击链接进入网站，然后点击加号新建一个邮箱...随便点一个，然后点击右边的绿色按钮...这里就会出现刚刚选择的邮箱...去注册新的runway账号
  - 等需要在邮箱接受验证码的时候，回到这个网站点击刷新按钮，就会看到新的邮件...复制到runway就可以继续注册账号了
- name: 剪映模板版单账号限免3次生成
  desc: '[evidence] 剪映APP内“瞬息全宇宙”模板对单账号限制免费生成3次，超出需付费或更换账号，且风格库固定无法自定义。'
  excerpt:
  - 选一个视频点进去，在右下角有一个“剪同款”，每个账号可以免费制作3次
  - 大家可以看一下最后的效果，但是剪映做出来的视频风格会比较有限
