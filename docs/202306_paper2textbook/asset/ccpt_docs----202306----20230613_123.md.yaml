paper: docs/202306/20230613_123.md
desc: 该素材是一份面向初学者的 ChatGPT 角色指令编写入门指南，由作者“台风-gpt 魔法师”发布。核心内容提出角色指令由“身份设定、任务设定、约束设定”三大核心模块构成，结构清晰易上手；同时提供“角色生成器”工具实现指令的一键生成与微调，并附赠完整版飞书文档链接供深度学习。
concepts:
- name: 角色指令三要素
  desc: 构成高质量 ChatGPT 角色指令的三大核心组成部分：身份设定（定义 AI 扮演的专家人设）、任务设定（明确具体执行目标与流程）、约束设定（规定输出格式、语气、禁忌等边界条件)。
  is_original: true
  excerpt:
  - 角色指令包括身份设定、任务设定、约束设定 3 个部分，结构清晰，可以快速上手，帮助初学者快速创造任意一个专家角色。
- name: 角色生成器
  desc: 一种辅助工具或提示词策略，允许用户让 ChatGPT 反向生成符合上述三要素结构的角色指令，用户只需稍作修改即可投入使用，降低了提示词工程的门槛。
  is_original: true
  excerpt:
  - 当然你也可以使用角色生成器，让 ChatGPT 帮你一键生成角色指令，稍作修改即可使用。
methods:
- name: __overview__
  desc: 基于‘三要素结构化拆解’与‘生成器辅助创作’相结合的角色指令构建方法论：先理解身份/任务/约束三模块定义，再利用生成器快速产出初稿，最后人工微调落地。
  excerpt:
  - 角色指令包括身份设定、任务设定、约束设定 3 个部分，结构清晰，可以快速上手... 你也可以使用角色生成器，让 ChatGPT 帮你一键生成角色指令，稍作修改即可使用。
theorems:
- name: 结构化指令即专家人设
  desc: 核心主张：通过将指令显式拆解为身份、任务、约束三个模块，即可将通用大模型快速‘调教’为垂直领域的专家角色，该结构具有普适性，适用于初学者快速上手。
  excerpt:
  - 角色指令包括身份设定、任务设定、约束设定 3 个部分，结构清晰，可以快速上手，帮助初学者快速创造任意一个专家角色。
- name: 元提示词降低创作门槛
  desc: 核心主张：使用‘角色生成器’（即元提示词）让 AI 自动生成符合规范的指令草稿，配合微量人工修正，比完全手写指令更高效、更适合新手。
  excerpt:
  - 当然你也可以使用角色生成器，让 ChatGPT 帮你一键生成角色指令，稍作修改即可使用。
findings:
- name: 教学资料已产品化沉淀
  desc: '[evidence] 该指南内容已部分编录进《航海手册》并发布完整版飞书文档，形成了从公开引流文章到结构化教学文档的完整知识产品交付链路。'
  excerpt:
  - 本篇角色指令调教指南，部分已编录在航海手册中。
  - 完整版请移步至飞书阅读 https://xq6mz7nkknp.feishu.cn/docx/APhsdunGIoE3j3xfxePcFEwGnhe
