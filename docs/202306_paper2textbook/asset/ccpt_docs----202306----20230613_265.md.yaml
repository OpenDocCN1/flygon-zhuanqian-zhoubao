paper: docs/202306/20230613_265.md
desc: 该素材是一篇关于程序员如何快速熟悉业务的实战方法论总结，作者结合个人从游戏发行、B站搜索算法等一线业务开发经验，提出了从宏观产业链拆解、OKR目标对齐、竞品平台研究、一手信息获取、好奇心驱动学习、社交获取隐性知识、跳出技术思维、实地调研、识别合作方风格与规则、以及需求-组织-流程三维理论模型等十条核心方法论，旨在帮助技术人员建立业务思维、提升职场竞争力并实现技术价值与业务目标的对齐。
concepts:
- name: 业务产业链拆解模型
  desc: 将任意业务映射为供给侧到消费侧的产业链结构，通过拆解核心角色（如游戏行业的研发、发行、渠道）与核心流程（选品-上架-消费-支付），建立宏观业务认知框架。
  is_original: false
  excerpt:
  - 任何国家的经济体系，都会被切分为供给侧和消费侧...我们接触的任何业务都可以按照这个思想去理解业务，第一步是理解产业链，拆解核心角色...第二步就是按照按照供给侧到消费侧的顺序梳理核心流程
- name: OKR 职场生存法则
  desc: 将 OKR 不仅视为管理工具，更视为职场生存策略：通过对齐上层 Objective 争夺关键资源与项目，认为绩效在规划期即已决定，核心在于抓手核心
    KR。
  is_original: true
  excerpt:
  - 职场上的基本共识都是你的绩效不是在打绩效的时候决定的，而是在打绩效之初就已经决定了你今年的绩效是什么，你做的项目跟老板的 O 有没有关联才是真正决定你绩效的核心
- name: 行业演变周期认知
  desc: 识别行业从“渠道为王”向“内容为王”演进的历史阶段（如游戏行业：硬核联盟垄断期 -> 抖音投放分流期 -> TapTap/原神内容驱动期），以判断当前业务策略的有效边界。
  is_original: true
  excerpt:
  - 13、14 年的时候...渠道为王...2020 年的原神的发行更是游戏行业的颠覆性事件，没有依赖任何渠道...真正标志着游戏行业从渠道为王开始走向内容为王
- name: 一手信息分级体系
  desc: 将信息源按离事实距离分级：网络二手资料（知乎/课程）< 付费课程/白皮书/论文 < 线下深度访谈/行业沙龙/客户直接对话，主张只信最高级信息源。
  is_original: true
  excerpt:
  - 你在网上的知乎也好、小红书也好，看到的资料都是别人咀嚼消化过的 n 手资料...真正的一手信息是找人聊、找客户聊...也要会在知网上看博士论文、要去找行业的白皮书
- name: MVP 学习闭环
  desc: 将精益创业的 MVP 思想迁移至个人学习：读书-做笔记-输出-实战-改变，拒绝‘死磕大部头’式前置学习，主张在实战反馈中快速迭代认知。
  is_original: true
  excerpt:
  - 学习一定要培养 mvp 的思维方式->边学边做。读书->做笔记->输出->实战->改变，缺一不可...先看个大概，然后迅速践行 mvp，去非目标公司拿反馈
- name: 职场隐性知识社交获取机制
  desc: 认为核心方法论（3C方案、AR模型、向上汇报等）源于非正式社交场景（散步、奶茶局），并以“香烟奶茶”为媒介构建跨部门信息获取通道。
  is_original: true
  excerpt:
  - 自己过往在职场中学到的那些方法论不是在办公室里一块儿认真讨论出来的，而基本都是在办公室外和 leader 散步扯淡的时候学到的...香烟和奶茶是打工人之间的硬通货
- name: 技术思维与业务思维的张力
  desc: 定义技术思维为‘拿着锤子找钉子’（关注技术亮点、新技术应用），业务思维为‘经营视角权衡利弊’（关注核心流程、风险、灰度、协作），主张从前者向后者转型。
  is_original: false
  excerpt:
  - 技术思维会较少地站在用户和商业的角度理解问题...我们需要站在一个更高的视角理解业务，站在一个经营的视角去权衡利弊...主干意识、风险意识、灰度意识和 ABTest
    意识、协作意识
- name: 伪需求识别与实地调研原则
  desc: 强调‘没有调查就没有发言权’，要求技术人员直接接触一线用户（听投诉录音、访供应商、调研司机），而非依赖运营/产品二手转述，以验证需求真实性。
  is_original: false
  excerpt:
  - 要真正去了解用户，而不是听了某个运营同学说业务的痛点是这样的我们就去设计产品了...一定要确认这个需求是不是伪需求，一定要真正跟消费者做好确认
- name: 合作方画像与组织规则导航
  desc: 主张建立合作方能力/性格/风格画像并调整协作策略，同时严守部门职能边界（如技术只对产品负责，不越级对接市场/商务），以规避大公司病风险。
  is_original: true
  excerpt:
  - 要了解跟你合作的人能力强弱，了解他的性格大致是怎样的...根据你的合作方风格调整你的合作方式...技术同学，你的需求方是产品同学，而不是市场、不是商务，你不能越过产品直接和他们沟通
- name: 业务三要素认知模型 (需求-组织-流程)
  desc: 从理论高度将业务抽象为三要素：需求（人类社会需要）、组织（社会分工组织与内部结构）、流程（协作具体方式），等同于政治/经济/文化战略分析框架。
  is_original: true
  excerpt:
  - 通过需求，组织，流程，比较容易快速认知一个行业...换一种逻辑，其实也就是从政治、经济、文化等因素来去做分析。有点战略分析的色彩。
methods:
- name: __overview__
  desc: 十步走熟悉业务综合方法论：宏观建模 -> 目标对齐 -> 竞品复盘 -> 一手取证 -> 好奇驱动/MVP迭代 -> 非正式社交 -> 思维转型 ->
    实地验证 -> 合作导航 -> 理论抽象。
  excerpt:
  - 【1/宏观层面理解业务】...【2/ OKR 思想实施业务】...【3/研究该行业所有的平台】...【4/要看第一手的信息】...【5/获取信息的底层驱动是好奇心】...【6/社交手段和同事聊天】...【7/不要用技术思维理解业务】...【8/深入实际扎根调研】...【9/了解你合作方的风格】...【10/理论层面对业务这个词的三点高度概括】
- name: 宏观业务建模法
  desc: 两步走：1. 拆解产业链核心角色（上游/中游/下游）；2. 按供给侧到消费侧梳理核心流程（选品->生产/采购->分发/上架->消费->支付）。
  excerpt:
  - 第一步是理解产业链，拆解核心角色...第二步就是按照按照供给侧到消费侧的顺序梳理核心流程，比如游戏就是从选品->内测->上架渠道->用户下载->登陆->支付
- name: OKR 逆向对齐与抓手策略
  desc: 自顶向下拆解：P9/P10定业务规划(O/KR) -> P7/P8对齐业务OKR补专业OKR -> 一线执行KR。核心策略：分析老板O的拆解逻辑与资源申请，评估关联性，主动争夺高关联度项目。
  excerpt:
  - 利用 OKR 的思想由上到下拆解，理解团队 OKR。老板的 OKR 是什么，老板怎么拆解 O 的...评估拆下来之后跟自己的关联性...如何能把关键的事情抢到手里来做是非常重要的事情
- name: 竞品/平台全景复盘法
  desc: 行业分析 -> 竞对分析 -> 用户内测 -> 跑MVP。具体执行：梳理行业发展史与阶段特征 -> 完整体验头部竞品核心路径（搜索/推荐/下载） ->
    对比优劣势 -> 模仿迁移 -> 多平台复制方法论。
  excerpt:
  - 在具体做公司内的业务时，就一定要看下市面上其他家是怎么做的...完整体验一遍国内的硬核联盟渠道是如何搜索的，现在很火的 taptap 渠道是如何通过搜索词的补全引导用户下载的，通过对比分析优势劣势，然后去模仿
- name: 一手信息获取四渠道法
  desc: 1. 线下深度访谈/行业沙龙（高能量场）；2. 知网博士论文/行业白皮书（学术/权威源）；3. 高质量付费课程（避坑指南）；4. 直接找客户/用户聊天（最直接证据）。拒绝知乎/小红书/免费精华课等N手资料。
  excerpt:
  - 真正的一手信息是找人聊、找客户聊，多参加行业的沙龙坐在一起聊...也要会在知网上看博士论文、要去找行业的白皮书...或者是有价值的知识付费
- name: MVP 学习实战闭环
  desc: 拒绝前置大量阅读。流程：浏览大纲 -> 快速跑MVP（面试投非目标公司/业务做小Demo) -> 拿市场真实反馈 -> 调整学习路径 -> 积累底气
    -> 冲刺目标。核心节奏：读书->做笔记->输出->实战->改变。
  excerpt:
  - 面试也是同理，不要先把自己锁在家里把所有的面试点全部学一遍...先看个大概，然后迅速践行 mvp，去非目标公司拿反馈，然后迅速调整自己的学习思路...mvp
    跑得有底气了再去目标公司面试
- name: 非正式社交情报采集术
  desc: 利用碎片时间（楼下散步、奶茶局）与 Leader/跨部门同事建立弱连接。话术：请奶茶 -> 闲聊团队动态/规划/痛点 -> 获取隐性知识（3C、AR模型、老板视角、规划意图）。
  excerpt:
  - 基本都是在办公室外和 leader 散步扯淡的时候学到的...请喝一杯奶茶，去公司楼下聊聊天，你们团队目前在做什么好玩的事情，为什么这么做，过程中遇到了什么问题
- name: 技术转业务四大思维重塑
  desc: 建立四大工程化思维替代纯技术思维：1. 主干意识（识别核心链路/强弱依赖/兜底）；2. 风险意识（预演最坏情况/可回滚预案）；3. 灰度/ABTest意识（白名单/分批发布）；4.
    协作意识（Git分支管理/产研分工）。
  excerpt:
  - 这里也分享一下几个技术的思维方式：1、主干意识...2、风险意识...3、灰度意识和 ABTest 意识...4、协作意识
- name: 实地调研验证伪需求
  desc: C端：听用户投诉录音/用户访谈；B端：亲访供应商/客户；O2O：体验一线岗位（如跑网约车/送外卖）。核心原则：一线确认，拒绝二手转述。
  excerpt:
  - C 端就要去真正听用户投诉的录音，B 端就要亲自去找供应商沟通，做出行就去亲自调研司机，没有调查就没有发言权
- name: 合作方画像与边界导航术
  desc: 双维度：1. 个人画像（能力/性格/风格）-> 调整沟通协作策略（合作共赢）；2. 组织规则（职能边界/工作流/大公司病）-> 严守需求方单一入口（技术只对产品），拒绝越级沟通。
  excerpt:
  - 要了解跟你合作的人能力强弱...根据你的合作方风格调整你的合作方式...尤其是公司有一定体量后...你要搞清楚你的需求方是谁...技术同学，你的需求方是产品同学
theorems:
- name: 绩效预定论
  desc: 绩效结果在年度规划期（OKR对齐期）即已锁定，核心变量是‘所做项目与老板核心 Objective 的关联度’，而非执行阶段的努力程度。
  excerpt:
  - 职场上的基本共识都是你的绩效不是在打绩效的时候决定的，而是在打绩效之初就已经决定了你今年的绩效是什么，你做的项目跟老板的 O 有没有关联才是真正决定你绩效的核心
- name: 行业演进决定论
  desc: 业务策略的有效性强依赖于行业所处生命周期阶段（渠道为王 vs 内容为王），跨周期照搬方法论（如在内容为王期仍重渠道分发）必然失效。
  excerpt:
  - 13、14 年的时候...渠道为王...2020 年的原神的发行更是游戏行业的颠覆性事件...真正标志着游戏行业从渠道为王开始走向内容为王
- name: 知识实践不可分离原理
  desc: 脱离实践场景的知识输入（读书/课程）对普通人无效，仅提供‘获得知识的虚假感’；唯有‘实践机会+知识输入’的闭环才能产生能力增量。
  excerpt:
  - 包括很多看起来精英化的课程对大多数人来说也没什么用...对普通人来说它是不可能具备实践的机会的，如果不具备实践的机会，那除了满足你获得知识的感觉和贩卖焦虑外，就没有任何价值
- name: 好奇心正反馈养成律
  desc: 好奇心非天生固定，可通过‘MVP小步跑 -> 获得正反馈（解决问题/产出成果） -> 强化兴趣 -> 深入探索’的循环人工培养。
  excerpt:
  - 好奇心也是可以培养的，那就是通过正反馈培养好奇心...哼哧哼哧地把几本大块头的书先死磕一遍...到最后发现白白浪费了一年的时间。学习一定要培养 mvp 的思维方式
- name: 隐性知识社交属地化定律
  desc: 组织中最高价值的方法论、权力地图、战略意图等隐性知识，仅存在于非正式社交场域（办公室外、饭局、散步），正式会议/文档仅承载显性知识。
  excerpt:
  - 自己过往在职场中学到的那些方法论不是在办公室里一块儿认真讨论出来的，而基本都是在办公室外和 leader 散步扯淡的时候学到的
- name: 技术价值业务锚定论
  desc: 技术工作的本质不是技术指标优化，而是帮助老板解决业务问题；技术方案必须锚定业务痛点（主干/风险/灰度/协作），‘拿着锤子找钉子’是负价值。
  excerpt:
  - 工作其实只做一件事情，帮助老板解决问题...技术思维会较少地站在用户和商业的角度理解问题...新技术的应用只是带来了更多的复杂度...站在一个经营的视角去权衡利弊
- name: 业务本质三元论
  desc: 一切业务系统本质上可还原为：需求（Why/人类社会需要）、组织（Who/分工协作结构）、流程（How/具体处理方式）；此模型同构于政治/经济/文化战略分析框架。
  excerpt:
  - 通过需求，组织，流程，比较容易快速认知一个行业...换一种逻辑，其实也就是从政治、经济、文化等因素来去做分析。有点战略分析的色彩。
findings:
- name: 游戏发行行业演变实证
  desc: '[evidence] 作者亲历游戏发行行业从 2013-2014 年‘硬核联盟’渠道垄断 50% 分成、工作室无话语权，到抖音广告投放分流、头部厂商（米哈游/莉莉丝/叠纸）内容崛起，再到
    TapTap 零分成分发、原神无渠道登顶 AppStore 的全过程，验证了‘渠道为王 -> 内容为王’的范式迁移。'
  excerpt:
  - 13、14 年的时候手机厂商很强...硬核联盟...抽成 50%...工作室是根本无法向这些巨头反抗的...现在情况是有变化的...抖音的出现...taptap...2020
    年的原神的发行更是游戏行业的颠覆性事件，没有依赖任何渠道，appstore 全球各区排名第一
- name: B站游戏搜索优化竞品复盘案例
  desc: '[evidence] 作者主导 B 站游戏搜索算法优化时，通过全量体验硬核联盟渠道、TapTap 等竞品搜索交互（补全引导、排序逻辑），对比优劣后模仿迁移，印证了‘竞品全景复盘法’的有效性。'
  excerpt:
  - 我在 B 站曾经做过游戏的搜索算法优化，就要去完整体验一遍国内的硬核联盟渠道是如何搜索的，现在很火的 taptap 渠道是如何通过搜索词的补全引导用户下载的，通过对比分析优势劣势，然后去模仿
- name: 死磕书本反面教训
  desc: '[evidence] 作者早年花一年死磕大部头技术书籍构建‘扎实功底’，最终发现与实战脱节、白白浪费时间，反证了‘MVP学习法’优于‘前置大量阅读法’。'
  excerpt:
  - 哼哧哼哧地把几本大块头的书先死磕一遍，美其名曰，把自己的功底打扎实，到最后发现白白浪费了一年的时间
- name: 面试 MVP 策略验证
  desc: '[evidence] 作者建议面试前不全量刷题，而是投非目标公司跑 MVP 拿真实面试反馈（市场反馈），调整策略后再冲目标公司，该策略被作者验证优于‘闭门造车式备战’。'
  excerpt:
  - 先看个大概，然后迅速践行 mvp，去非目标公司拿反馈，然后迅速调整自己的学习思路，这是市场给予的最真实反馈...mvp 跑得有底气了再去目标公司面试
- name: 越级沟通担责风险实证
  desc: '[claim] 作者基于大公司职能分化经验断言：技术越过产品直接对接市场/商务属于违规操作，极易‘出锅担责’，需严守‘技术需求方=产品’的单一入口原则。'
  excerpt:
  - 技术同学，你的需求方是产品同学，而不是市场、不是商务，你不能越过产品直接和他们沟通，否则容易出锅担责
