units:
- 'no': 1
  name: 存量期认知重构 —— 风口过后，专业玩家的黄金窗口
  points:
  - '**为什么需要这个概念？**'
  - '- 知识付费行业从增量红利转入存量深耕，很多人误以为风口已过而放弃，实际是机会结构发生了变化'
  - '- 用户付费习惯已经成熟、交易基建完备、长尾需求爆发，专业玩家反而进入确定性更高的深耕期'
  - '- 需要打破“风口已过”的悲观预期，看到存量期里的结构性机会'
  - '**核心定义**'
  - '- 存量期认知重构：指行业度过野蛮生长后，虽无增量红利，但因用户心智、基建、细分需求成熟，依然存在可深耕变现的结构性商业机会'
  - '**关键性质**'
  - '- 反周期性：风口过后不是死亡，而是进入更考验专业能力的深耕期'
  - '- 结构性：机会存在于长尾需求与专业供给的错配之中'
  - '- 专业友好：对持续深耕的创作者更有利，对盲目跟风者更危险'
  - '**典型例子**'
  - '- 作者张亚萨从2022年裸辞后持续运营知识付费业务，搬家出国也业务未中断，印证赛道抗周期能力'
  - '**边界条件**'
  - '- 适用于已有专业积累和持续输出能力的人'
  - '- 没有专业能力、只想赚快钱的小白，在存量期更容易被收割'
  sources:
  - paper: docs/202306/20230613_072.md
    role: origin
  - paper: docs/202306/20230613_074.md
    role: improve
  excerpts:
  - 大家都在说知识付费的风口已经过去了，还值得做不？我认为是能做的
  - 这个话题从三个方面来聊一下：1、为什么还能做？ 2、可以怎么做？ 3、还能有哪些想象空间？
  - 随我一起揭秘知识付费的光明与黑暗
- 'no': 2
  name: 镰刀识别术 —— 给认知装上“防割铠甲”
  points:
  - '**为什么需要这个概念？**'
  - '- 知识付费行业存在大量利用信息差和焦虑营销收割新人的套路，小白容易成为“韭菜”'
  - '- 只有先识别镰刀，才能避免被割，建立反收割的认知防御体系'
  - '**核心定义**'
  - '- 镰刀：指知识付费行业利用信息差、焦虑营销等手段收割入门者钱财的隐性套路'
  - '- 韭菜癌晚期：指深度陷入付费陷阱、持续付费却无实质产出、认知被严重异化的终端状态'
  - '**关键性质**'
  - '- 信息不对称：镰刀依赖行业黑话和包装话术制造认知差'
  - '- 焦虑驱动：利用用户的赚钱焦虑、成长焦虑降低防御'
  - '- 认知防御优先：识别套路比学习赚钱技巧更具生存优先级'
  - '**典型例子**'
  - '- 评论区用户自发反馈：“朋友圈全是训练营”“我是韭菜”，印证收割现象的普遍性'
  - '**边界条件**'
  - '- 避坑指南只能建立防御，不能替代实战认知'
  - '- 需要在真实行动中持续提高判断力'
  sources:
  - paper: docs/202306/20230613_074.md
    role: origin
  excerpts:
  - 今天，咱不说怎么搞钱，咱来唠唠花钱
  - 看完应该多多少都能抵御点镰刀，避免进一步恶化到韭菜癌晚期
  - 从入行设计师到跑通副业 IP，知识付费 2W+
- 'no': 3
  name: 信任先于产品 —— 种子用户是冷启动的第一块基石
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人没有流量和名气时，直接做课程很难卖出去，必须先积累信任'
  - '- 种子用户是冷启动的核心杠杆，能支撑后续高价产品快速起盘'
  - '**核心定义**'
  - '- 种子用户信任积累：指在正式推出付费课程前，通过免费或低价服务积累的首批付费用户群体，构成新产品冷启动的核心信任基础'
  - '**关键性质**'
  - '- 信任非凭空而来，靠平时点滴交付积累'
  - '- 低门槛服务（带打新、社群）是积累种子用户的常见方式'
  - '- 种子用户的“被需要感”会给创作者开课决心'
  - '**典型例子**'
  - '- 作者鱼菇娘在开课前有约400人付费用户，支撑课程冷启动招募近100人、变现3万+'
  - '**边界条件**'
  - '- 需要长期运维，无法速成'
  - '- 种子用户质量比数量重要'
  sources:
  - paper: docs/202306/20230613_073.md
    role: origin
  excerpts:
  - 在开课之前，我有 400 人左右付费的用户，分别是之前带别人打新债和做知乎变现的，算是前期积累了一批种子用户。
  - 学员对你的信任并不是一下子凭空而来，都是通过平时的点点滴滴积累。
- 'no': 4
  name: 差异化定位避坑法 —— 方正不对，努力白费
  points:
  - '**为什么需要这个概念？**'
  - '- 选错赛道会让后续所有努力事倍功半，需要主动避开红海'
  - '- 差异化定位能够发挥自身独特优势，建立壁垒'
  - '**核心定义**'
  - '- 差异化定位避坑法：通过盘点自身独特优势与观察市场竞争红海，主动放弃无优势赛道，转向竞争小且有壁垒的细分领域'
  - '**关键性质**'
  - '- 优势盘点：理财实战收益、带学员经验等独特积累'
  - '- 竞争度观察：写作课饱和，则转向理财等细分'
  - '- 壁垒匹配：选自己有积累、别人短期难以模仿的领域'
  - '**典型例子**'
  - '- 作者最初想做自媒体写作课，发现竞争太激烈，后定位投资理财并结合自身理财经验'
  - '**边界条件**'
  - '- 需要客观自我评估，避免高估优势'
  - '- 市场调研要动态更新，不能一劳永逸'
  sources:
  - paper: docs/202306/20230613_073.md
    role: origin
  excerpts:
  - 最开始我做课程是奔着【自媒体写作】这个方向的，但是发现这个定位竞争太激烈了……我最后把定位放在【投资理财】方面
  - 正所谓方正不对，努力白费
- 'no': 5
  name: 先完成再完美 —— 用行动力碾碎完美主义
  points:
  - '**为什么需要这个概念？**'
  - '- 完美主义导致的不产出是新手最大的拦路虎'
  - '- 只有先发布，才能获得真实反馈，驱动迭代'
  - '**核心定义**'
  - '- 先完成再完美：一种行动优先心态，接受不完美、先上线再迭代，用真实反馈优化方向'
  - '**关键性质**'
  - '- 行动产生反馈，反馈驱动优化'
  - '- 勇敢主义者优于完美主义者'
  - '- 避免“事情还没开始，就被设想难倒”'
  - '**典型例子**'
  - '- 作者直言“与其当一个完美主义者，不如当一个勇敢主义者”'
  - '**边界条件**'
  - '- 适用于低风险的创作型任务'
  - '- 涉及重大财务决策仍需谨慎评估'
  sources:
  - paper: docs/202306/20230613_073.md
    role: origin
  excerpts:
  - 首先学会接受自己的不完美，才能让自己有勇气踏出第一步……与其当一个完美主义者，不如当一个勇敢主义者。
  - 想到的全是问题，而这些问题只有实践了才知道真正的答案……很多时候事情还没开始，就被自己的各种设想难倒了
- 'no': 6
  name: 课程大纲树状设计 —— 先立骨架，再开枝散叶
  points:
  - '**为什么需要这个概念？**'
  - '- 没有大纲的课程写作容易体系松散、返工成本高'
  - '- 先建立完整骨架，才能高效填充内容'
  - '**核心定义**'
  - '- 课程大纲树状设计法：将大纲视为“树的中心”，先确立课程整体骨架（约10节课、由浅入深），再逐节展开填充内容'
  - '**关键性质**'
  - '- 结构优先：大纲确定后写作方向清晰'
  - '- 递进式：章节之间由易到难'
  - '- 可复用：同一大纲可支撑多期课程迭代'
  - '**典型例子**'
  - '- 作者每门课约10节，每节2000-3000字，从第一章到第十章由浅入深'
  - '**边界条件**'
  - '- 大纲需根据学员反馈灵活调整'
  - '- 不能为了结构而牺牲内容实用性'
  sources:
  - paper: docs/202306/20230613_073.md
    role: origin
  excerpts:
  - 我的每门课程一般设有 10 节课左右，每个章节 2000-3000 字……第一章节到第十章节，会有一个由浅入深，由易到难的一个递进过程。
  - 大纲就像一颗树的中心，有了核心就可以慢慢开枝散叶了
- 'no': 7
  name: 轻量化交付形态 —— 图文+社群+加餐的“三驾马车”
  points:
  - '**为什么需要这个概念？**'
  - '- 高成本视频课程制作难、周期长，不适合个人创作者'
  - '- 实操型课程需要“边学边做”，图文+社群是更轻的交付方式'
  - '**核心定义**'
  - '- 图文+社群+加餐三位一体：以图文主课保证实操可跟，社群提供学习氛围和深度链接，不定期加餐结合经历强化信心'
  - '**关键性质**'
  - '- 低成本：图文制作成本远低于视频'
  - '- 强实操：学员可边看边操作'
  - '- 高陪伴：社群+加餐提升完课率和信任'
  - '**典型例子**'
  - '- 作者的理财课采用图文方式，配答疑群和不定期加餐'
  - '**边界条件**'
  - '- 适合强实操属性内容，不适合需要大量视觉演示的课程'
  - '- 社群运营需要投入时间和精力'
  sources:
  - paper: docs/202306/20230613_073.md
    role: origin
  excerpts:
  - 我比较倾向于图文课程……因为涉及到实操部分，图文比较方便边看边操作
  - 除了图文课程，每个课程我都配了一个答疑交流群……社群可以聚集一群有共同爱好的人在一起学习
  - 在学习期间我也会根据情况给他们不定期加餐……让他们更了解我，知道理财带给我的收获和改变
- 'no': 8
  name: 朋友圈长短软硬文案 —— 真诚是最高级的销售技巧
  points:
  - '**为什么需要这个概念？**'
  - '- 朋友圈是私域成交主力场，纯硬广刷屏会被屏蔽'
  - '- 需要系统化布局，长短结合、软硬兼施，才能自动成交'
  - '**核心定义**'
  - '- 长短软硬结合文案法：公众号长文建立深度信任，朋友圈短文案高频触达；软文分享生活/观点建人设，硬广直击痛点促单，避免微商式刷屏'
  - '**关键性质**'
  - '- 频次节奏：朋友圈日更2-5条，公众号长文1500-2000字'
  - '- 真诚内核：信任和认可是一切成交的核心'
  - '- 布局系统化：不是单篇文案，而是持续内容矩阵'
  - '**典型例子**'
  - '- 作者用公众号长文招募+朋友圈短文案组合，3个月招募近100名学员'
  - '**边界条件**'
  - '- 需要真材实料，否则真诚变成话术'
  - '- 避免过度营销导致好友屏蔽'
  sources:
  - paper: docs/202306/20230613_073.md
    role: origin
  - paper: docs/202306/20230613_243.md
    role: improve
  excerpts:
  - 宣传文案可分为【长文案】和【短文案】，公众号招募文案 1500-2000 字左右……朋友圈宣传文案，一次 200-500 字左右，平均一天大概 2-5 条左右。
  - 尽量不要让自己的朋友圈沦为微商模式，平时也要分享自己的生活和观点……软硬文案结合
  - 朋友圈成交的核心就是要多发。不要怕刷屏……正常来讲 1 小时发一条是个合适的频率。
- 'no': 9
  name: 痛点直击四步文案 —— 共情-权威-方案-信任
  points:
  - '**为什么需要这个概念？**'
  - '- 用户只会为痛点买单，泛泛介绍课程难以打动目标用户'
  - '- 需要一套可复制的文案公式，持续产出高转化招募文'
  - '**核心定义**'
  - '- 痛点直击四步文案公式：针对核心痛点→引用权威金句强化认知→展示方案价值→融入自身真实经历背书，形成“共情-权威-方案-信任”的成交闭环'
  - '**关键性质**'
  - '- 共情：唤起用户共鸣（如存不下钱、收入单一）'
  - '- 权威：借助名言/IP建立可信度'
  - '- 方案：明确课程能带来的具体结果'
  - '- 信任：亲身经历是最好的背书'
  - '**典型例子**'
  - '- 作者用“你是不是每个月想存钱却存不下钱？”开头，引用巴菲特名言，再结合自己从租房到买房的经历'
  - '**边界条件**'
  - '- 痛点必须真实，不能虚构制造焦虑'
  - '- 权威引用需相得益彰，不能生硬堆砌'
  sources:
  - paper: docs/202306/20230613_073.md
    role: origin
  excerpts:
  - 痛点一：存不下钱……‘你是不是每个月想存钱却存不下钱？’ 巴菲特说：你赚下的一分钱不是你的，你存下的一分钱才是。
  - 我觉得无论是发朋友圈还是公众号，自己的亲身经历才是最好的背书。
- 'no': 10
  name: 阶梯涨价与名额稀缺 —— 用损失厌恶打破犹豫
  points:
  - '**为什么需要这个概念？**'
  - '- 用户决策拖延是课程转化率低下的常见原因'
  - '- 涨价和稀缺能制造“错过就亏”的心理压力，促使用户下单'
  - '**核心定义**'
  - '- 阶梯式涨价与名额稀缺销售模型：结合早鸟价、每期涨价（30-100元）、动态名额倒计时（名额-1/-2）三重机制，利用损失厌恶与稀缺心理驱动犹豫用户快速下单'
  - '**关键性质**'
  - '- 涨价预期：第一批最优惠，后续每期上调'
  - '- 稀缺展示：文案中直观标注名额减少'
  - '- 损失厌恶：用户害怕错过优惠价而行动'
  - '**典型例子**'
  - '- 作者课程价格从119元涨至149、199元，不少用户在即将涨价时集中下单'
  - '**边界条件**'
  - '- 价格涨幅不能离谱，需在用户承受范围内'
  - '- 必须配合优质交付，否则消耗信任'
  sources:
  - paper: docs/202306/20230613_073.md
    role: origin
  excerpts:
  - 我的课程主要采取了阶梯式涨价……每次涨幅 30-100 元左右。别小看这个动作，有不少的小伙伴在即将要涨价的时候集中下单，这个亲测有效。
  - 我每期招募 20-30 人左右，有人报名写朋友圈文案的时候会加上名额-1，名额-2。
- 'no': 11
  name: 定价即定客群 —— 让价格筛选你的用户
  points:
  - '**为什么需要这个概念？**'
  - '- 价格决定你吸引的人群画像，高价筛选高净值用户，低价吸引价格敏感型用户'
  - '- 定价必须匹配目标用户的付费意愿和能力，才能实现高转化和复购'
  - '**核心定义**'
  - '- 定价即定客群：产品定价应基于目标用户的付费意愿与付费能力，而非单纯追求高客单或低客单'
  - '**关键性质**'
  - '- 用户画像匹配：不同价格吸引不同人群'
  - '- 转化与复购权衡：低价高转化但用户质量低，高价低转化但用户质量高'
  - '- 动态升级：先平民价积累用户，再逐步迭代高客单'
  - '**典型例子**'
  - '- 作者的读者多为需要副业、经济条件一般的用户，所以课程定价200-600元，换取高转化和40-50%复购'
  - '**边界条件**'
  - '- 不能盲目低价导致利润不足'
  - '- 也不能脱离用户承受力定高价'
  sources:
  - paper: docs/202306/20230613_073.md
    role: origin
  - paper: docs/202306/20230613_243.md
    role: improve
  excerpts:
  - 一般需要结合自己的【用户群体】来定价……根据用户的【付费意愿】和【付费能力】来给产品定价。
  - 我的这边的用户和读者大多数是需要副业的，多数人的经济条件一般……所以我的产品暂时定不了很高的价格
- 'no': 12
  name: 价值定价锚点 —— 价值=价格×10倍
  points:
  - '**为什么需要这个概念？**'
  - '- 课程是非标智力产品，价值边界模糊，容易被主观低估或免费化'
  - '- 需要主动定义价值，用“价值感”支撑高价'
  - '**核心定义**'
  - '- 价值定价锚点法则：定价标准是“价值=价格×10倍”，即课程为用户创造的价值感应是价格的十倍'
  - '**关键性质**'
  - '- 价值感优先：用户购买的是“价值感”而非产品本身'
  - '- 卖方定义权：非标品价值可由卖家结合用户视角挖掘放大'
  - '- 结果导向：落脚在为用户节省时间/解决痛点/达成目标'
  - '**典型例子**'
  - '- 《创业者法律避险课》重构为《新手老板如何避开10大法律雷区》后，价值感大增'
  - '**边界条件**'
  - '- 不能虚构价值，需真实挖掘已有价值并充分传达'
  sources:
  - paper: docs/202306/20230613_243.md
    role: origin
  excerpts:
  - 定价的标准是：价值=价格*10 倍
  - 课程本身的价值是不够明确的，这带来的好处就是，你其实可以自己定义这个价值。
  - 用户需要的其实不是你的产品，而是能带给他/她的好处和价值……价值感。
- 'no': 13
  name: 课程分层产品矩阵 —— 流量/信任/利润的三级火箭
  points:
  - '**为什么需要这个概念？**'
  - '- 单一产品无法承接不同信任阶段的用户，流失率高'
  - '- 需要用低价产品引流、中价产品建信任、高价产品实现利润'
  - '**核心定义**'
  - '- 课程分层产品矩阵：按用户信任度与客单价将课程划分为流量产品（几十-几百元）、信任产品（几百-几千元）、利润产品（几万-几十万元），形成阶梯式转化路径'
  - '**关键性质**'
  - '- 层层转化：每一层都是前一层的后端'
  - '- LTV导向：关注用户终身价值而非单次成交'
  - '- 价格梯度清晰，避免内部打架'
  - '**典型例子**'
  - '- 流量产品几十-几百元引流，信任产品几百-几千元建立信任，利润产品几万-几十万元核心变现'
  - '**边界条件**'
  - '- 需要产品线规划能力，后端产品必须实至名归'
  sources:
  - paper: docs/202306/20230613_243.md
    role: origin
  excerpts:
  - 一般来说，流量产品价格在几十-几百。信任产品定价几百-几千。利润产品定价几万-几十万。每一层都是前一层的后端，可以用低价产品吸引流量，然后层层转化。
- 'no': 14
  name: 价值包装四维模型 —— 从“我有什么”到“你要什么”
  points:
  - '**为什么需要这个概念？**'
  - '- 创作者常从供给侧自嗨，讲材质、工艺，但用户关心的是能带来什么结果'
  - '- 价值包装能充分挖掘产品已有价值并有效传达，支撑更高价格'
  - '**核心定义**'
  - '- 价值包装四维模型：从目标（帮用户实现什么）、问题（解决什么痛点）、方案（提供何种路径）、交付（给何种物料/服务）四个用户视角维度提炼课程价值'
  - '**关键性质**'
  - '- 用户视角：以用户为中心而非以产品为中心'
  - '- 结果导向：价值=可感知的结果提升'
  - '- 可操作：四个维度可直接填入具体内容'
  - '**典型例子**'
  - '- 律师课程用“新手老板避开10大法律雷区”替代“法律避险课”，击中创业者刚需'
  - '**边界条件**'
  - '- 不能夸大或虚构，只能充分挖掘已有价值'
  sources:
  - paper: docs/202306/20230613_243.md
    role: origin
  excerpts:
  - 价值包装并不是夸大，或者虚构产品价值，而是充分挖掘产品本身已有的价值，并充分传达给用户。
  - 产品的材质、制作工艺这些其实并不重要，用户关心的，是你的产品会帮我实现什么目标、解决什么问题
- 'no': 15
