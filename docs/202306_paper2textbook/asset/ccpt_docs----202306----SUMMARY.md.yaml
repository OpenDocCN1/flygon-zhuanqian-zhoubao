paper: docs/202306/SUMMARY.md
desc: 该素材为生财有术社群2023年6月期间的内容精华合集（龙哥赚钱周报），汇聚了200+篇实战案例与方法论，涵盖AI变现、短视频/直播电商（抖音/视频号/快手）、图文电商（小红书/闲鱼/拼多多/淘宝）、私域流量运营、个人IP打造、知识付费、同城实体店引流、海外项目等核心赚钱赛道。核心价值在于提供了大量'保姆级'可复制的SOP（标准作业程序）、从0到1的新人上岸路径、选品测品逻辑、流量获取与转化技巧、AI工具落地应用及商业认知升级，展示了普通人如何利用信息差、工具差、执行力差在具体平台实现变现闭环。
concepts:
- name: 风向标掘金
  desc: 生财有术社群特有的信息挖掘机制，通过追踪高赞/高互动内容（风向标）发现早期商业机会与异常值项目，并组织众包实战验证。
  is_original: true
  excerpt:
  - 风向标掘金，免费带领 1000 + 互联网小白天涯神贴项目捡钱的保姆级教程
  - 1 条没中标的风向标，让我多赚了 4 位数
- name: 航海实战模式
  desc: 社群组织的目标导向、有节奏、有教练陪跑、强制复盘的项目实战训练营模式，是新人快速跑通变现闭环的核心路径。
  is_original: true
  excerpt:
  - 如何开启一场有成果的航海实战——以小红书运营航海为例
  - 从失败到成功变现，生财新人成功变现四位数的航海收获
  - 三无小白如何通过航海跑通闭环成功上岸
- name: 矩阵号运营
  desc: 通过批量注册、养号、分工协作（如1个剪辑管理500个账号），利用概率思维规模化获取流量与变现的组织形式，适用于抖音图文、视频号、小红书等平台。
  is_original: false
  excerpt:
  - 详解 1 个剪辑管理 500 个账号【本地生活矩阵】
  - 37 天 8W8 佣金，0-1 抖音图文矩阵带货突出重围
  - 1000 个达人矩阵怎么搭建的？1 个人如何实名 3 个抖音号？
- name: 无货源电商模式
  desc: 无需囤货发货，通过选品搬运、信息差套利（如拼多多/淘宝货源卖到小红书/抖音/闲鱼），核心在于选品测品与供应链对接。
  is_original: false
  excerpt:
  - 小红书店铺无货源保姆级操作流程分享！
  - 闲鱼无货源玩法另辟溪路之高客单冷门产品玩法
  - 抖上拼食品精细化无货源佣金玩法+供应链模式保姆级实操教程
  - 淘宝高客单无货源玩法，一单利润四位数
- name: AI赋能内容生产流水线
  desc: 将ChatGPT、Midjourney、Stable Diffusion、RPA等工具串联，构建从选题、文案、配图、视频剪辑到发布的自动化/半自动化内容工厂，实现低成本高产出。
  is_original: true
  excerpt:
  - 从 ChatGPT 超级写手 1.0 到内容工厂 1.0
  - 批量混剪「单人日产 200 条」超强工具分享
  - 通过快写慢改和 ChatGPT 相结合写东西总结的 SOP
  - 手把手教你用 ChatGPT plugin 打造一个人知识库系统
- name: 异常值案例库
  desc: 收集整理非共识、非主流、高ROI的变现案例（如AI孙燕姿、Midjourney共享账号、球鞋搬砖、成人用品店、日本出国劳务），用于拓展认知边界、寻找蓝海切入点。
  is_original: true
  excerpt:
  - AI 变现异常值案例库，5 种方向 10 个案例的副业项目灵感启发
  - 《AI变现异常值案例库》——第1期 / 第2期
  - 利用 Midjourney 共享账号，赚到 2023 第一笔副业资金 10W+
  - 我是如何抓住 QQ 点赞小需求，结合自动化插件做起了 2W+的私域流量？
- name: 私域成交体系
  desc: 涵盖朋友圈人设打造（3+1共进成交法）、社群裂变、AB话术引流、高客单静默成交、IP信任资产积累等将公域流量转化为高复购私域资产的完整方法论。
  is_original: false
  excerpt:
  - 如何从 0 到 1 打造朋友圈自动成交系统，撬动 5 位数收益
  - 3+1 共进成交法，朋友圈社群发售 10 天变现 3W
  - 珠宝高客单，从小红书引流到私域，300 粉变现 20w+我做对了什么
  - 做私域营销，不得不掌握的 100 个技巧
- name: 同城号/本地生活变现
  desc: 实体商家或个人利用抖音/视频号/小红书同城流量（POI、团购、私域），通过爆款短视频或直播引流到店/成交，适用于餐饮、眼镜、相亲、成人用品、洗衣家政等赛道。
  is_original: false
  excerpt:
  - 人人可复制的同城号方法论
  - 实体商家通过打造抖音同城爆款视频，一年卖出 6000+团单，变现 300W+
  - 3000 粉丝月变现 5W，同城眼镜店短视频拆解
  - 同城相亲月入 10W+，现在入局还有机会吗？
methods:
- name: __overview__
  desc: 素材整体方法论为：基于社群协作的‘实战复盘+SOP标准化+异常值挖掘+工具赋能’四位一体模型。即通过航海实战产出真实案例 -> 提炼可复制SOP ->
    用风向标/异常值机制发现新机会 -> 接入AI/RPA工具提升效率 -> 形成矩阵/私域规模化变现。
  excerpt:
  - 全文贯穿的核心逻辑：实战案例 -> SOP拆解 -> 工具赋能 -> 规模化复制
  - 生财航海实战，在游戏化设计上还有哪些可能？
  - 技术赚钱实践指南（精选300篇技术类赚钱文章整理）
- name: 蓝海选品/需求挖掘四步法
  desc: 1. 数据端：蝉妈妈/蝉小红/后羿采集器采集竞品销量/关键词/笔记数据；2. 需求端：挖掘‘小众高频/高客单/高复购/非标品/情绪价值’需求；3.
    供给端：1688/拼多多/闲鱼/供应链对接验证利润空间；4. 测试端：小成本投流/自然流测款，数据达标放大。
  excerpt:
  - 我是如何从零开始，挖掘到蓝海小众需求，半年赚到 40 万的
  - 淘宝蓝海选品 I 顺藤摸瓜法
  - 如何利用数据分析进行小红书电商选品？
  - 用后羿采集器在蝉小红采集行业信息的教程
  - 小红书无货源电商如何高效测品？
- name: 爆款内容复制/改编SOP（洗稿/二创/模版化）
  desc: 1. 寻找对标爆款（同赛道高赞/高转化笔记/视频/文案）；2. 拆解结构（钩子/痛点/方案/引导/留钩子）；3. 建立素材库/选题库/金句库；4.
    用ChatGPT/Prompt套用模版批量生产/改编；5. 批量混剪/发布/数据复盘迭代。
  excerpt:
  - 带货短视频-文案如何创作？素材活用，改编成自己的带货文案——之人民日报
  - 抖音优化文案，从“抄”到“超”，卖中高考押题作文，3 天转化 3000 单＋
  - 两个搞钱技能，帮你看清图文二创赛道的全貌
  - 做一道填空题写出爆款小红书电商文案
  - 7 天用 AI 写出 2 篇 10 万+ 的公众号情感爆文，我做了哪些事情？
- name: AI Prompt工程与角色调教体系
  desc: 构建‘角色设定+任务拆解+少样本示例+思维链引导+约束条件+输出格式’的结构化Prompt，并通过‘三体联动’（系统提示词+用户指令+插件工具）实现ChatGPT专家级写作、编程、选品、运营辅助。
  excerpt:
  - 人人都能学会的 ChatGPT 角色指令调教指南-免费送角色指令
  - GPT最强心流调教思路——三体联动！
  - ChatGPT 调教心流法的新大杀器——三体联动
  - 实战使用 ChatGPT 辅助开发一款自动化程序经验分享
- name: 小红书电商‘测品-爆品-放大’闭环
  desc: 1. 开店/养号（员工号/蓝V/个人号）；2. 选品（蝉小红/竞品/供应链/异常值）；3. 测品（发笔记/投薯条/小额投流，看点击率/收藏率/转化率）；4.
    爆品复制（矩阵号发/达人合作/聚光放量）；5. 私域沉淀（主页/粉丝群/私信/企微转化高客单）。
  excerpt:
  - 6 天 12W+ 营业额的小红书店铺操作手册分享
  - 小红书店铺航海 半月 GMV 破 10W
  - 新手做小红书电商，1 个月净利润 6W
  - 小红书无货源电商内容输出玩法历程
  - 引流团队如何做到小红书单月引流 13000＋，全年变现 1000W＋
- name: 抖音图文带货‘低成本矩阵’打法
  desc: 1. 选品：高佣金/高转化/非标品/季节性/信息差商品（教辅/食品/图书/好物）；2. 素材：达人授权/混剪/二创/AI生图/实拍；3. 发布：多账号矩阵/定时发布/挂小黄车；4.
    优化：挂车率/转化率/GPG（单坑产出）监控；5. 放大：爆款复投/达人合作/付费投流（千川/随心推）。
  excerpt:
  - 单号日入 1000+，抖音图文带货玩法教学分享
  - 37 天 8W8 佣金，0-1 抖音图文矩阵带货突出重围
  - 抖音图文带货非常好做，小白，想做副业的朋友可以冲
  - 闷声发财，抖音图文二创带货
  - 抖音教辅赛道自然流量一个月 100 万 gmv，我是如何做到的？
- name: 视频号‘无人直播/短视频挂车’速成法
  desc: 利用视频号早期红利期，通过录播/绿幕/数字人/循环播放低成本搭建直播间，或批量剪辑短视频挂车（选品联盟/小店），配合微信生态私域转化（群/朋友圈/视频号主页），实现低门槛快速变现。
  excerpt:
  - 15 天视频号无人直播暴力起号收入 30w+
  - 视频号纯小白参加小航海：7 天 5W 利润
  - 2 天视频号短视频 5w+短视频变现保姆级分享
  - 视频号短视频挂车投流常见问题和解决方案
  - 视频号定制产品七天 3.5 万佣金
- name: 闲鱼‘高客单/垂类/自动化’进阶玩法
  desc: 避开红海低客单，聚焦二手书/露营装备/球鞋/高客单冷门品；利用SEO关键词布局/鱼小铺/自动发货插件/自动回复/采集上货工具实现半自动化运营；引流创业粉/高净值粉至私域高转化。
  excerpt:
  - 闲鱼二手书：程序员的打怪修仙之路，实现全自动赚钱
  - 闲鱼无货源进阶玩法-日赚 1000
  - 在闲鱼卖露营装备一整年，分享一下我稳定月入 1-2W 的小蓝海项目
  - 做高客单闲鱼五个月的一点心得和成绩
  - 闲鱼二手书插件分享：自动填写表单数据
theorems:
- name: 生财核心认知：赚钱是认知变现，而非勤劳变现
  desc: 核心主张：普通人赚钱依靠‘信息差’、‘认知差’、‘执行力差’、‘工具差’，而非单纯出卖时间。需从‘打工者思维’转为‘生意人思维’（关注ROI、杠杆、复利、概率），主动拥抱AI等新工具放大个人杠杆。
  excerpt:
  - 认知觉醒是开始赚钱的第一步
  - 亦仁说在生财人人都有赚百万的机会，看完这篇【信息差】万字整合贴，你会明白
  - 小马宋：为什么学了那么多，总是没结果？
  - 小马宋：如果只有少数企业能赚到钱，那凭什么是你？
  - 我来给 AI 泼泼冷水：普通人如何应对挑战与把握机遇
- name: 商业模式先于努力：不懂商业模式，忙死就是赔死
  desc: 核心主张：项目选择（赛道、模式、定位）决定上限，执行决定下限。必须先验证‘商业模式跑得通’（有需求、有利润、有流量来源、可复制、可规模化），再投入大量精力。避免在错误的赛道上‘勤奋地失败’。
  excerpt:
  - 不懂商业模式，忙死就是赔死
  - 从三种赚钱的商业模式，谈谈财富的本质
  - 持续赚钱，为什么最好逼自己做一个长线业务？
  - 商业顶层设计：从百万到千万
  - 这个经济环境下，我的商业模式变得更有优势
- name: 杠杆创富论：寻找边际成本趋近于零的杠杆
  desc: 核心主张：财富自由路径在于构建‘代码杠杆’（软件/插件/RPA/自动化脚本）、‘媒体杠杆’（内容/IP/矩阵号/SEO）、‘资本杠杆’（投流/供应链/品牌）、‘劳动力杠杆’（团队/SOP/外包）的组合，实现‘一次生产，无限售卖’或‘低边际成本扩张’。
  excerpt:
  - 小马宋：人有多少时间可以用于出售换成财富？
  - 技术赚钱实践指南
  - 内容工厂机器人库
  - 详解 1 个剪辑管理 500 个账号
  - 围绕大平台做小工具，一直是一个可以闷声赚钱的事情
- name: 长期主义与复利思维：做难而正确的事
  desc: 核心主张：拒绝短期快钱陷阱（如无人直播灰产、违规引流），选择‘难而正确’的长线赛道（个人IP、私域资产、品牌建设、技能沉淀），接受‘延迟满足’，通过持续复盘、迭代、积累信任资产，实现复利增长。
  excerpt:
  - 亦仁问答：短期项目跑得通，是不是应该去做难而正确的事？
  - 生财不是温室，而我们也不应该是温室的花朵
  - 我的十年自媒体之路
  - 全职妈妈写作 8 年，用 260w 稿费换了一套学区房！
  - 辞职后居家创业 3 年共赚 7 位数的个体创业指南分享
- name: 新人生存法则：最小可行性动作（MVA）与快速正反馈
  desc: 核心主张：新人切忌完美主义、大而全规划。应拆解目标至‘最小可行性动作’（如发第一条笔记、跑第一单广告、写第一个Prompt、搭第一个私域流程），追求‘快速正反馈’（首单、首粉、首佣金），在正反馈中修正方向、建立信心、积累资金与经验。
  excerpt:
  - 以赚钱为目标，新手在小航海中应该怎么做？
  - 新人做好这一点，助你快速拿回门票钱
  - 三无小白如何通过航海跑通闭环成功上岸
  - 拼命拿结果的一年，终于有了第一个正反馈
  - 新手做视频号，如何快速拿到正反馈，喂饭级教程
findings:
- name: AI工具落地变现已形成成熟商业闭环（非概念炒作）
  desc: '[evidence] 素材中包含10+个具体AI变现实战案例：Midjourney共享账号3月入10W+、ChatGPT写作变现月入3位数至73万、AI绘画头像/壁纸/儿童绘本/表情包批量变现、AI+RPA自动化程序开发、AI数字人直播/视频、AI辅助SEO/公众号/小红书内容工厂、AI插件开发/分销、AI换装模特服务电商。覆盖工具分销、内容服务、电商降本、自建产品/流量等多元模式。'
  excerpt:
  - 利用 Midjourney 共享账号，赚到 2023 第一笔副业资金 10W+
  - 如何两个月通过 Ai 私人部署变现 73 万
  - AI 头像壁纸号项目 3 种热门关键词+私人定制法全流程拆解
  - 新手也可以快速上手的 AI 绘画：懒人简笔画及衍生动态表情包篇
  - 实战使用 ChatGPT 辅助开发一款自动化程序经验分享
  - ChatGPT Plugins 变现分析
- name: 小红书电商为当期普通人入局性价比最高的赛道之一
  desc: '[evidence] 素材收录小红书相关文章达30+篇，案例覆盖无货源店铺（6天12W+、半月GMV破10W、月净利6W）、资料号引流（月入5位数、引流13000+）、高客单珠宝/疗愈/塔罗/助听器/宠物/旅拍/壁纸/起名等垂类、达人探照灯计划、聚光投流、违规避坑（限流/禁言应对）全链路。多位新人（大二学生、宝妈、裸辞职场人）在1-6个月内实现月入1-20万，且强调‘低粉高变现’、‘私域沉淀’特性。'
  excerpt:
  - 6 天 12W+ 营业额的小红书店铺操作手册分享
  - 小红书店铺航海 半月 GMV 破 10W
  - 新手做小红书电商，1 个月净利润 6W
  - 疗愈赛道小红书 5 个月变现 20 万超值实操干货分享
  - 珠宝高客单，从小红书引流到私域，300 粉变现 20w+
  - 小红书助听器赛道，一个月从 0-1 变现 4W+
