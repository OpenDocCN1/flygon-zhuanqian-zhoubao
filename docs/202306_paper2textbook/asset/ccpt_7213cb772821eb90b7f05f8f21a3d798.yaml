paper: docs/202306/20230627_037.md
desc: 该素材为一篇经验分享帖，作者“熊孩子不差”介绍如何利用思维导图作为核心工具在小红书平台打造垂直IP，并计划通过三个具体案例拆解实操方法，同时强调思维导图可与个人技能结合实现能力放大。
concepts:
- name: 思维导图打造垂直IP
  desc: 将思维导图作为知识承载与内容生产工具，应用于小红书平台建立垂直领域个人品牌的方法论核心概念。
  is_original: false
  excerpt:
  - 如何利用思维导图在小红书打造垂直 IP
  - 思维导图是工具，我们可以借助好这个工具来承载我们的知识
- name: 技能放大器
  desc: 指思维导图与个人既有技能结合后，能使技能效能呈指数级增长（十倍、百倍）的放大效应。
  is_original: true
  excerpt:
  - 让思维导图跟我们的技能相结合，让我们的技能放大十倍、百倍
methods:
- name: __overview__
  desc: 通过三个具体案例拆解的方式，演示思维导图在小红书垂直IP打造中的实战应用路径。
  excerpt:
  - 我将用三个例子来做拆解，一起来看看如何用思维导图来打造 IP
theorems:
- name: 工具承载知识论
  desc: 思维导图本质是工具，核心价值在于承载和结构化个人知识体系，而非绘图本身。
  excerpt:
  - 思维导图是工具，我们可以借助好这个工具来承载我们的知识
- name: 技能复利公式
  desc: 思维导图与个人技能结合可产生乘数效应，实现技能价值的十倍至百倍放大。
  excerpt:
  - 让思维导图跟我们的技能相结合，让我们的技能放大十倍、百倍
findings:
- name: 社群正向反馈验证
