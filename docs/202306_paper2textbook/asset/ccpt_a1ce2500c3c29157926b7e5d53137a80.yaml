paper: docs/202306/HdvTdpX8hoq4n7xsYEmcwsWxnFf.md
desc: 该素材是生财有术ChatGPT航海项目分享文档，由实操者“台风”系统总结了ChatGPT在自媒体内容创作中的应用方法论。核心在于将ChatGPT拟人化为“AI实习生助理”员工画像，据此提出“角色派、调教派、框架派”三大运用流派，并详细拆解了内容生成框架、提示词工程核心模块（背景、身份、任务、要求、格式）及常见问题调优策略，强调自媒体本业方法论是根基，ChatGPT仅为效率放大器。
concepts:
- name: AI实习生助理
  desc: 将ChatGPT拟人化定位为高学历、高智商但社会经验不足、表达生硬、记忆短暂、产出有随机性的临时外包员工，以此类比指导人机协作管理。
  is_original: true
  excerpt:
  - ChatGPT作为一个执行工作任务的临时外聘员工，其能力等同于一个初入社会的、高学历高智商的实习生助理。
  - 高学历：千亿级参数，知识渊博、百科全书；高智商：思维逻辑强、理解能力强、情感能力强、模仿能力强。
  - 表达一板一眼，太过于拘谨正经，一股AI味；有时死记硬背、不辨真假，胡说八道也要硬答；总是记不住要求，爱忘事；产出不稳定，有概率随机性。
- name: 三大运用流派
  desc: 根据提示词工程的复杂度与产出可控性，将ChatGPT在自媒体创作中的应用模式分为：角色派（固定前置指令，快速但可控一般）、调教派（思维链投喂引导，精细耗时但高质量高可控）、框架派（模板化流水作业，快速且相对可控）。
  is_original: true
  excerpt:
  - 形式：固定的前置指令...产出：快速，可控度一般
  - 形式：按思维链的形式，投喂学习资料，一步步引导，评分、修正...产出：质量较高，高度可控
  - 形式：针对不同内容模块形成固定的指令模板，严格规定内容结构...产出：快速，相对可控
- name: 内容生成框架
  desc: 结构化提示词工程模板，包含背景信息、字数要求、写作手法、语气风格、段落格式、内容结构、个人气质七大核心模块，用于将非结构化创作需求转化为AI可执行的标准化指令。
  is_original: true
  excerpt:
  - '1. 背景信息：作者、领域、平台、受众、目标

    1. 字数要求

    1. 写作手法

    1. 语气风格

    1. 段落格式

    1. 内容结构：开头、中间、结尾；或 故事部分、分析点评部分

    1. 个人气质：个人价值观、融合经历'
- name: 自媒体应用难易度分级
  desc: 基于内容形态对事实性要求、风格独特度、营销转化复杂度的差异，将自媒体场景按ChatGPT落地难度从易到难分为7级：规模化伪原创(9分)、百度问答(8)、小红书/知乎(7)、短视频直播(5)、强IP文案(4)、高原创内容(3)。
  is_original: true
  excerpt:
  - 10分满分，分越高越容易。可以看出，文章仿写类的最容易。
  - 规模化伪原创...9；百度问答...8；小红书...7；知乎问答...7；短视频、直播文案...5；强IP的文案风格...4；高原创度、参考内容少...3
- name: 速度-质量权衡矩阵
  desc: 阐述模型选择（GPT-3.5快/免费 vs GPT-4.0慢/付费/高质量）与内容生产策略（批量自动化/质量随机 vs 精品人工干预/成本高）之间的二维权衡关系，指导创作者根据赛道特性做决策。
  is_original: true
  excerpt:
  - 模型：GPT 3.5：速度快、质量尚可 免费；GPT 4.0：速度慢、质量较高 20美金/月
  - 内容：如果走批量化、自动化的路线，质量随机性大；如果要产出优质内容，人工干预调整成本会上升
methods:
- name: __overview__
  desc: 整体方法论：确立'AI实习生'心智模型 -> 遵循'不猜心思、层层把控'沟通原则 -> 根据场景选择'专业咨询/布置任务'策略 -> 依据难度选择'角色/调教/框架'流派
    -> 应用'内容生成框架'编写提示词 -> 迭代解决'忽略/原创/字数/风格/IP'常见问题 -> 选型工具(GPT/Claude/Notion/Bing)
    -> 回归自媒体本业根基。
  excerpt:
  - 要学会做一个好老板，掌握和AI实习生助理的交流沟通方法、任务管理方法。
  - GPT一下，你就知道：怎么用好GPT，多问他自己；不要让他猜你的心思：把话说明白，把事交代清楚；面面俱到、层层把控：不信任原则，强控任务流程。
  - ChatGPT定位：自媒体的辅助工具，效率放大器；你需要掌握做自媒体某一领域的方法论，在这个基础上再使用ChatGPT提效。
- name: 专业咨询策略 (专家模式+背景+循序渐进)
  desc: 针对知识学习、方案讨论场景：先设定专家角色限制领域/设定思考框架，再交代完整背景(初衷/问题/基本情况)，最后遵循探讨推演流程分轮次深入。
  excerpt:
  - 设置专家：限制领域让回答更精准；有互动性要求时，设置思考框架、互动工作流
  - 交代背景：提问交流的初衷，要解决的问题的背景，公司/个人/产品的基本情况等
  - 循序渐进：遵循探讨推演的流程，理清脉络，再不断深入完善
- name: 内容创作任务派单法 (身份+任务+要求+格式)
  desc: 针对文章、脚本等内容生产场景的标准化指令四步法：1.设身份(限定领域/风格) 2.派任务(平台/领域/爆款/受众/题目/原创) 3.提要求(字数/口语化/逻辑/举例)
    4.定格式(开头/中间/结尾结构化模板)。
  excerpt:
  - 1. 设身份：限制回答特定领域，有概率影响语言风格；如小红书博主、法律专家
  - 1. 派任务：写一篇xx平台、xx领域的爆款文章，受众是xxx，请围绕xxx题目进行原创
  - 1. 提要求：字数xxx字以上，语言要口语化，逻辑清晰，要适当结合自己经历进行举例…
  - 1. 定格式：【开头部分】xxx 【中间部分】xxx【结尾部分】xxx
- name: 调教派工作流 (投喂学习->思维链引导->评分修正)
  desc: 高精度内容生产方法：投喂参考方法论(爆款模板)与参考内容(结构/风格/用词) -> 按思维链分步引导(学文章->写故事->写分析) -> 多轮评分修正直至达标，适用于高客单价、强IP、高转化要求内容。
  excerpt:
  - 形式：按思维链的形式，投喂学习资料，一步步引导，评分、修正
  - 参考方法论：如爆款标题、公众号爆文模板，SEO关键词的分布策略等
  - 参考内容：总结内容结构、写作手法、语气风格、段落和用词习惯等等
  - 极简流程：先学文章-创作故事部分-创作分析部分
- name: 框架派模板化生产法
  desc: 规模化内容生产方法：先通过调教训练得到高质量输出 -> 抽象固化为针对特定模块(标题/开头/结尾等)的指令模板 -> 形成流水线标准作业程序(SOP)
    -> 批量套用模板快速生产，平衡速度与质量。
  excerpt:
  - 形式：针对不同内容模块形成固定的指令模板，严格规定内容结构
  - 特点：先训练再形成定制化模板，流水作业
  - 产出：快速，相对可控
- name: 常见调教问题对症优化策略
  desc: 针对生成过程中的六类高频故障提供定向修正指令：忽略要求->拆解条件/升级模型；原创不足->禁抄袭/指定新结构；字数不足->模块拆分/分段声明；例子生硬->要求细节/感官描写；风格AI感->定义角色/口语化/给参考语句；IP缺失->整理关键信息库/强制融合。
  excerpt:
  - 忽略要求：GPT3.5理解比4.0差；条件要求过多或描述不清晰-针对性调整
  - 原创不足：要求它原创、不能抄袭；规定使用全新的内容结构模板
  - 字数过少：拆分模块分开生成；在各部分单独再声明字数要求
  - 例子生硬：要求增加故事细节
  - 语气风格：定义角色；口语化、不要翻译腔、模仿真人写作、语句自然；给参考语句
  - IP内容：整理出IP有关的关键信息，常用观点、语句、经历等，要求进行结合
theorems:
- name: 工具辅助论：自媒体方法论是根基，ChatGPT仅为效率放大器
  desc: 核心主张：不掌握自媒体底层逻辑(选题/结构/变现/运营)盲用AI必失败；AI只能放大已有能力，不能从0创造能力。使用前须具备领域方法论，再叠加AI提效。
  excerpt:
  - ChatGPT定位：自媒体的辅助工具，效率放大器
  - 你需要掌握做自媒体某一领域的方法论，在这个基础上再使用ChatGPT提效
  - ChatGPT不是万能的，或许你需要尝试更多的工具组合，或者干脆降低预期
- name: 管理替代编程：好老板原则优于Prompt Engineering技巧
  desc: 核心主张：用好ChatGPT的本质是管理好一个‘AI实习生’，核心能力是清晰表达需求(不猜心思)、建立流程控制(层层把控)、善用反馈循环(多问GPT)，而非掌握晦涩的提示词黑魔法。
  excerpt:
  - 要学会做一个好老板，掌握和AI实习生助理的交流沟通方法、任务管理方法。
  - GPT一下，你就知道：怎么用好GPT，多问他自己
  - 不要让他猜你的心思：把话说明白，把事交代清楚
  - 面面俱到、层层把控：不信任原则，强控任务流程
- name: 场景-难度匹配定律：内容形态决定AI替代率上限
  desc: 核心主张：自媒体场景对AI的友好度呈现显著梯度差异，标准化/低事实性/弱IP属性内容(如伪原创、百度问答)易自动化高分；强个人风格/强逻辑/强营销/高原创内容(如强IP文案、深度原创)难度大，需重人工干预，不可强求全自动。
  excerpt:
  - 自媒体应用难易程度：10分满分...文章仿写类的最容易...规模化伪原创9...强IP的文案风格4...高原创度、参考内容少3
  - 需要结合自己的赛道领域特点、需求进行选择。
- name: 模型分层决策论：GPT-3.5跑量，GPT-4.0做精
  desc: 核心主张：构建分级模型调用策略：利用GPT-3.5免费、高速、大吞吐特性处理批量化、低容错、草稿生成任务；利用GPT-4.0高逻辑、高理解、大窗口特性处理核心策略、复杂推理、定稿润色、代码/结构化任务，实现成本与质量的帕累托最优。
  excerpt:
  - GPT 3.5：速度快、质量尚可 免费...逻辑 3 理解 3 情感 3 速度 5 文本容量 2
  - GPT 4.0：速度慢、质量较高 20美金/月...逻辑 4 理解 4 情感 3 速度 2 文本容量 4
  - 如果走批量化、自动化的路线，质量随机性大；如果要产出优质内容，人工干预调整成本会上升
findings:
- name: 身份角色显著影响平台风格适配度
  desc: '[evidence] 素材引用@白先生《GPT调教心流法-身份篇》实测图表显示，设定''小红书博主''身份后，生成内容自带emoji、分点罗列、口语化、体验感等平台典型特征；未设定身份时输出为标准说明文风格。证明''设身份''是低成本获取平台化语感的关键杠杆。'
  excerpt:
  - 身份角色对内容风格的影响：(配图对比展示)
  - '你是一名小红书博主，你的任务是根据我的提示词或描述生成小红书风格的文案：包括标题和内容。你的文案应该有以下特点: 表达要口语化，标题吸引人，要多使用emoji表情图标，内容观点尽量分点罗列，适当描述自己的使用体验和评价，文案最后生成相关的标签。'
- name: 木白公众号爆文案例：0基础7天达成10W+阅读
  desc: '[claim] 素材引用@木白案例宣称：使用ChatGPT配合公众号爆文写作方法论(框架派)，从0开始7天内达成单篇阅读10W+，验证了''方法论+AI''的高爆发潜力。但未公开具体选题、流量来源(推荐/搜索/私域)、复现率及长期稳定性数据。'
  excerpt:
  - ChatGPT + 公众号爆文写作，从0开始，7天达成阅读10W+，方法全分享，毫无保留@木白
  - https://articles.zsxq.com/id_i6vohzgwizfb.html
- name: 台风个人实战变现数据
  desc: '[evidence] 作者自述：2023年2月入局，搭建ChatGPT主题自媒体矩阵，主打自然流量自动成交，3个月变现5万+。作为实操者背书，证明该方法论体系在''教ChatGPT变现''赛道上具备正向ROI闭环能力。'
  excerpt:
  - 2月初入局ChatGPT，搭建ChatGPT主题的自媒体矩阵，主打自然流量自动成交的玩法，3个月变现5万+。
- name: 工具平替验证：Claude擅长口语/短视频，Bing擅长时事联网，Notion AI擅长国内便捷接入
  desc: '[claim] 素材基于作者及社区经验总结的工具特性对比：Claude输出更口语化适合短视频；Bing Chat实时联网强适合时事内容；Notion
    AI国内直连便捷。未提供对比评测数据，属经验性定性结论。'
  excerpt:
  - Claude：同门兄弟，口语化一点，做短视频不错
  - NotionAI：国内可访问使用，方便
  - Bing Chat：实时联网能力更强，时事类的内容产出可以考虑尝试
- name: GPT-4移动端无限制发现
  desc: '[evidence] 素材记录的实操环境差异：官网网页版GPT-4有条数限制(3小时/25次)且需梯子支持插件；官网手机版(iOS美区ID)GPT-4无条数限制；国内镜像版受字数、记忆、安全过滤限制更多且模型能力稍逊。为重度用户提供了降本增效的客户端选择依据。'
  excerpt:
  - 官网网页版本：梯子，支持使用插件，GPT-4条数有限制
  - 官网手机版本：梯子，IOS 美区ID，GPT-4没有条数限制
  - 国内镜像版本：梯子，字数、记忆长度、安全过滤有更多限制，API模型稍逊于官网版本
