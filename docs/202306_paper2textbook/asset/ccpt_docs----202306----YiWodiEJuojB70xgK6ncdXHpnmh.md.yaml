paper: docs/202306/YiWodiEJuojB70xgK6ncdXHpnmh.md
desc: 该素材提出了一套名为“三体联动”的GPT内容创作方法论，旨在解决GPT处理长文本易丢失信息、缺乏深度主观风格两大痛点。核心方案是联动GPT-4、谷歌浏览器插件（Superpower
  ChatGPT文档切割器）与Plus插件，通过“语料清洗（两轮压缩万字稿）→ 风格学习（短视频技巧+IP人设文档）→ 分步转写（视角替换+风格迁移+观点注入）”三步走流程，实现万字直播稿向IP风格短视频口播文案的高效转化，耗时从小时级压缩至20分钟内，形成可复用、可微调的标准化调教框架。
concepts:
- name: 三体联动
  desc: 核心方法论名称，指GPT-4模型、谷歌浏览器插件、ChatGPT Plus插件三大工具组件的协同工作模式，用于突破单一模型上下文窗口限制与风格模仿瓶颈。
  is_original: true
  excerpt:
  - 解决方案：三体联动——通过运用 GPT+谷歌插件+Plugin 组合联动来完成任务。
  - 这个思路也在肖厂长举办的华山论剑提词大会里拿到的第一名，受到大家一致认可
- name: GPT调教心流法
  desc: 作者体系化的提示词工程与思维训练方法论，分为初级（记提示词）、中级（掌握提问心法）、高级（灵活掌控提示词、插件和工具）三个层级，强调思维链路拓宽而非死记提示词。
  is_original: true
  excerpt:
  - 《GPT调教心流》，讲究的不是记住提示词，而是可以把思维链路无限拓宽
  - '掌控GPT三种能力：创造力、感知力、想象力

    初级新人类：记提示词、中级：掌握提问心法、高级：灵活掌控提示词、插件和工具的使用。'
- name: 文档切割器
  desc: Superpower ChatGPT插件的核心功能，自动将超长文本按Token限制切分为多块，依次送入GPT处理后再汇总，解决万字级长文本超出上下文窗口的问题。
  is_original: false
  excerpt:
  - 前置动作：插件设置：打开设置的 文档切割器
  - 直接复制粘贴1万字，插件会对自动对原文进行切块、清洗优化的过程，比如12000字拆成8块，逐块进行优化，然后进行第二轮的优化。
- name: 两轮清洗法
  desc: 长文本处理策略：一洗利用切割器逐块清洗冗余保留核心得5000字简版；二洗在新对话框对简版进一步压缩至1000字以内，平衡信息保真度与Token成本。
  is_original: true
  excerpt:
  - 一洗成果：简化版本的5千字内容... 保留程度较高。
  - 二洗成果：1千字以内的文案
- name: 分步转写逻辑
  desc: 将复杂转写任务拆解为四个顺序子任务：视角替换(第一人称→第三人称)→ 人设转述→ 观点注入(结合IP文档)→ 成片输出，通过链式推理降低单步认知负荷提升可控性。
  is_original: true
  excerpt:
  - '提示词3：转写分步处理（分步逻辑）

    1、把直播话术中的第一视角，替换为“cc总”...

    2、以肖厂长的身份 转述上一步“cc总”的分享内容

    3、根据肖厂长的文档...模仿肖厂长的语言风格...增加肖厂长的观点...

    4、输出形成一个完整的短视频文案'
- name: IP颜色微调
  desc: 指在自动化流程跑通后，针对语言习惯、口头禅、思维角度等非显性特征进行的人工微调或提示词定向优化，将完成度从70%提升至可商用水平。
  is_original: true
  excerpt:
  - 你可能会觉得，出来的效果一般呀？那只是因为我们还没有做最后的IP颜色微调。
  - 剩下的30%可以通过微调语言风格和人工补充更加深刻的观点来完成。
methods:
- name: __overview__
  desc: 三体联动标准作业流程（SOP）：步骤1 长文本清洗压缩（工具：GPT-4 + Superpower ChatGPT切割器）→ 步骤2 风格与人设注入（工具：新对话框
    + AskYourPDF插件加载IP语料）→ 步骤3 链式分步转写（提示词工程：视角切换→风格迁移→观点融合→成文）。全流程约20分钟，产出1500字内IP风格口播稿。
  excerpt:
  - 解决方案：三体联动——通过运用 GPT+谷歌插件+Plugin 组合联动来完成任务。
  - 整体流程分析... 大大提高了文案过滤，归纳总结的效率... 可调教性强，内容锁定、风格、观点补充等都可以自行拓展
- name: 语料清洗提示词
  desc: 针对直播话术的结构化清洗指令：删除冗余语气词/重复、保持视角不变、最大程度保留观点/故事/数据/金句、强制保留指定关键词、压缩至1000字以内。配合文档切割器实现分治处理。
  excerpt:
  - '提示词1

    针对我提供给你的直播话术进行文本优化处理：

    1、删除重复啰嗦、语气词、梳理结构等，不改变视角

    2、最大程度保留内容完整度、观点和举例、故事的细节、数据信息、金句

    3、必须保留内容：xxxx，如果文本没有这部分信息则跳过这一步

    4、缩减文本到1000字以内'
- name: 短视频文案技巧注入提示词
  desc: 系统性灌输短视频平台算法逻辑（娱乐性+去中心化）及五大写作铁律：2秒钩子法则、高信息密度(200-400字/分钟)、钩子设计(悬念/利益)、去专家感(寓教于乐)、口语化改写(书面语→口语/录音转写)，构建GPT的“短视频底层逻辑”认知。
  excerpt:
  - '提示词1：短视频基础调教

    请你先学习以下短视频的文案技巧... （一. 必知：短视频平台，两大核心属性... 二、由此衍生的文案技巧 1. 别废话，上干货 2. 大密度、信息点 3.
    放钩子，留观众 4. 别端着，好玩些 5. 口语化，很重要）'
- name: IP人设学习提示词
  desc: 利用AskYourPDF插件加载IP专属语料库，指令GPT扮演特定人设，约束输出需符合前置技巧及‘观点+说明+举例+总结/金句’结构，且举例必须调用IP自有案例。
  excerpt:
  - '提示词2：人物学习（利用askyourpdf插件调用ip风格或者观点文档）

    首先，我需要你扮演 肖厂长来回答我的提问... 回答的口播文案要符合以上技巧以及符合文案结构（观点+说明+举例+总结/金句）

    最后，注意举例要用到肖厂长自己的例子 文档：3f70a06d-5fc9-4dfa-9fef-d0b9e0e6c9bf'
- name: 链式转写提示词
  desc: 四步走转写指令链：1. 视角标准化(我→CC总) 2. 人设代入(肖厂长口吻复述) 3. 知识融合(调用IP文档注入观点/建议) 4. 成文定稿(1500字内完整短视频脚本)，实现从素材到成品的可控生成。
  excerpt:
  - '提示词3：转写分步处理（分步逻辑）

    1、把直播话术中的第一视角，替换为“cc总”...

    2、以肖厂长的身份 转述上一步“cc总”的分享内容

    3、根据肖厂长的文档doc_id：xxxxxxxxx，模仿肖厂长的语言风格...增加肖厂长的观点以及对企业老板和精英的建议

    4、输出形成一个完整的短视频文案，1500字以内。'
theorems:
- name: 工具组合 > 单一模型升级
  desc: 在当前模型能力边界下，通过外挂插件（切割器、知识库检索）组合联动，比等待原生模型支持超长上下文或原生人设能力更高效、更可控，是解决长文本+风格化创作的最优工程路径。
  excerpt:
  - 即便是你有其他平台作为替代品，但因为底层是3.5的原因，依然没有办法顺畅的解决。
  - 解决方案：三体联动——通过运用 GPT+谷歌插件+Plugin 组合联动来完成任务。
- name: 分治策略解决长文本幻觉
  desc: 万字级长文本直接喂入模型必然导致遗漏与幻觉；必须采用‘切片-并行处理-多轮压缩’的分治策略，在每一切片保持语义完整的前提下逐层压缩，才能在Token预算内保全核心信息。
  excerpt:
  - 处理长文案时候经常不是处理信息有误就是无法按要求执行任务
  - 插件会对自动对原文进行切块、清洗优化的过程，比如12000字拆成8块，逐块进行优化，然后进行第二轮的优化。
- name: 风格迁移 = 结构化技巧显性化 + 专属语料隐性化 + 分步推理链
  desc: 高质量风格迁移非单一提示词可达，需三位一体：①将平台通用技巧（钩子、密度、口语化）显性化为指令；②将IP专属语料（用词、案例、思维）向量化检索注入；③将生成任务拆解为视角替换→风格套用→观点注入的推理链，逐步逼近。
  excerpt:
  - 提示词1：短视频基础调教... 提示词2：人物学习... 提示词3：转写分步处理
  - 结果1... 完成度达到70%。剩下的30%可以通过微调语言风格和人工补充更加深刻的观点来完成。
- name: 框架思维 > 提示词收藏
  desc: 核心竞争力不在于收集特定提示词，而在于构建可拆解、可替换、可扩展的‘调教框架’（思维链路），掌握创造力、感知力、想象力三种能力，实现从‘用工具’到‘驭工具’的跃迁。
  excerpt:
  - 《GPT调教心流》，讲究的不是记住提示词，而是可以把思维链路无限拓宽
  - '掌控GPT三种能力：创造力、感知力、想象力

    初级新人类：记提示词、中级：掌握提问心法、高级：灵活掌控提示词、插件和工具的使用。'
findings:
- name: 万字直播稿转IP口播实测案例
  desc: '[evidence] 实测将1.2万字直播稿经两轮清洗压缩至1千字，经三体联动流程转写输出1500字肖厂长风格短视频脚本，核心内容覆盖率达70%，全流程耗时<20分钟，效率提升10倍以上。'
  excerpt:
  - 语料：原始视频转文字... 1.2万字的录播文稿
  - 一洗成果：简化版本的5千字内容... 二洗成果：1千字以内的文案
  - 结果1... 文案输出涵盖的大部分的核心内容... 完成度达到70%... 前后的时间不到20分钟，提高的效率是十倍以上的效率。
- name: 自动化流程的边界：观点生成与深度风格仍需人工介入
  desc: '[evidence] 实测发现自动化流程在‘原创观点输出’与‘深度语言习惯（IP颜色)’两方面存在短板：GPT难以自主产出深刻商业洞见，且微妙口语特征需人工微调或定向喂料补充，完成度上限约70%。'
  excerpt:
  - 自动输出观点一直是gpt比较难呈现的效果，可以借鉴，但需要自行补充或主动喂。
  - 剩下的30%可以通过微调语言风格和人工补充更加深刻的观点来完成。
  - 缺点：1、对语料的类型和质量有一定要求 2、有一定概率洗掉原本需要的内容
- name: 框架迁移性验证
  desc: '[claim] 作者宣称该三体联动框架具备高度通用性，可通过微调提示词细节解决公众号文章、直播稿转写、短视频创作/拆分、文本提炼、文章转写、小说创作等绝大多数文本处理问题，且已在内部测试2.0版本。'
  excerpt:
  - 它可以解决的内容创作将会有写公众号文章、直播稿件转写、短视频的创造与拆分、所有文本内容的提炼、文章转写、小说等等绝大部份的问题。当前思路是1.0版本，我们已经在测试2.0。
  - 你完全可以在这个框架里去调整任何提示词，以此来完成拆分重组的动作，意味着你几乎可以解决所有的文本处理问题。
