  name: 私域IP进化论：从‘跟谁买’认知重塑到贩卖生活方式的四阶跃迁
  desc: 构建私域IP四步法：认知重塑（跟谁买>买什么）→定位落地（IP定位齿轮）→内容呈现（有颜有料）→维度跃迁（贩卖生活方式），验证航海学员出单实证。
