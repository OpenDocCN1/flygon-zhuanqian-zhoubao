  desc: 验证普通程序员3年兼职运营15个公众号+12个小程序月入5万+案例，揭示老年粉偏好军事/历史非养生、内容质量非核心、双端矩阵抗风险、同IP多账号可行性等反直觉法则。
  role: experiment
