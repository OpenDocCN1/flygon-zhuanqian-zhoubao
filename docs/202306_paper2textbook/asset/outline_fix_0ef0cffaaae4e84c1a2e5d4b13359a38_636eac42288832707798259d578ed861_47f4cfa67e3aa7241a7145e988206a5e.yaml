  desc: 揭示微信风控打分机制核心逻辑，确立“一卡一机独立网络”物理隔离标准，识别分身/云手机/新设备/脏IP高危组合，制定Wetool类工具依赖路径锁死的规避策略与纯人工误封申诉SOP。
