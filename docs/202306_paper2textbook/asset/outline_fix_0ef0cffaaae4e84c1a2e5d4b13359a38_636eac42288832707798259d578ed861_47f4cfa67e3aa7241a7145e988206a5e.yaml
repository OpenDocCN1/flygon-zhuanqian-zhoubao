  name: 社群运营‘茶馆机制’：从免费群死局到付费社群复利蓄水池的转型范式
  desc: 诊断无门槛免费群五大顽疾，确立付费门槛为核心筛选器，设计固定动作SOP、流量利益绑定、用户共创激励（14场群友分享+4场大咖讲座）、精华内容结构化沉淀（4.6万字），实现社群投资蓄水池战略跃迁。
