paper: docs/202306/20230627_011.md
desc: 该素材为一篇航海实战经验分享帖的元数据页，作者常常通过对比2022年抖音大航海失败与小红书运营航海成功的案例，拟从动机、目标、行动、心态四个维度复盘总结“如何开展有成果的航海实战”，并提供21天航行规划作为实操参考，旨在帮助新人避坑并快速上手。
concepts:
- name: 有成果的航海实战
  desc: 指在生财有术社区组织的‘航海’项目中，通过结构化规划与执行，最终获得实质性运营成果（如涨粉、变现）的实战过程，区别于‘一事无成’的无效参与。
  is_original: true
  excerpt:
  - 如何开启一场有成果的航海实战
  - 为什么 2022 年，我投入大量时间精力参与抖音大航海一事无成，却在小红书运营项目上收获满满，有所突破？
- name: 航海复盘四维法
  desc: 作者提出的航海复盘分析框架，从动机、目标、行动、心态四个维度剖析成败原因，用于指导后续实战规划。
  is_original: true
  excerpt:
  - 我从动机、目标、行动、心态等四个方面，总结了一些个人经验分享给大家。
- name: 21天航行规划
  desc: 针对航海周期（21天）设计的分阶段执行计划表，作为新人实操的标准化参考模板。
  is_original: true
  excerpt:
  - 最后也为大家提供了一份 21 天航行规划，抛砖引玉，供大家查看
methods:
- name: __overview__
  desc: 基于对比复盘的经验提炼法：选取成功（小红书）与失败（抖音）两个对比鲜明的实战案例，通过四维复盘框架提炼通用方法论，并输出标准化执行模板（21天规划）。
  excerpt:
  - 基于连续 4 期在小红书航海实战的经验复盘，我从动机、目标、行动、心态等四个方面，总结了一些个人经验分享给大家。最后也为大家提供了一份 21 天航行规划
theorems:
- name: 同投入不同产出源于策略与维度差异
  desc: 核心主张：投入相同时间精力，抖音航海失败而小红书航海成功，根本原因不在于平台优劣，而在于动机清晰度、目标设定、行动策略、心态管理四个维度的运作差异。
  excerpt:
  - 为什么 2022 年，我投入大量时间精力参与抖音大航海一事无成，却在小红书运营项目上收获满满，有所突破？
  - 带着这些疑问和基于连续 4 期在小红书航海实战的经验复盘，我从动机、目标、行动、心态等四个方面，总结了一些个人经验分享给大家。
- name: 新人航海需‘标准化规划’而非‘盲目冲锋’
  desc: 核心主张：刚开始参加航海不应盲目行动，而需先明确姿势（动机/目标），再依托结构化规划（21天航行规划）分阶段执行，才能规避无效劳动。
  excerpt:
  - 刚刚开始参加生财航海，究竟该以什么样的姿势开始航海实战？航海的 21 天，又究竟该如何规划、实操，才会收获自己想要的成果？
findings:
