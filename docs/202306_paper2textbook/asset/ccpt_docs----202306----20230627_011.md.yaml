  desc: '[claim] 作者宣称：2022年投入大量时间精力参与抖音大航海，最终一事无成。'
  excerpt:
  - 为什么 2022 年，我投入大量时间精力参与抖音大航海一事无成
- name: 小红书运营航海连续4期收获满满
