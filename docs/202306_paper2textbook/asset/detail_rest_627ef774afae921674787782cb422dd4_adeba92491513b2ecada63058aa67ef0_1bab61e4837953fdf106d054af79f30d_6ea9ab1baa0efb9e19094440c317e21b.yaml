learning_targets:
- 理解生财有术社群的生态架构与游戏化实战学习模式
- 掌握航海手册的标准操作流程，能够独立跑通一个最小项目闭环
- 学会运用三步走与车日路模型，将模糊目标转化为可执行路径
- 熟练使用搜索杠杆与关键词联想检索法，高效萃取知识库方法论
- 建立认知对齐与利他套利思维，减少信息焦虑并放大成长复利
- 识别风向标掘金、抱团拉新等社群协作玩法的适用条件与风险边界
- 具备风险意识，能够辨别灰产陷阱、红海化信号与幸存者偏差
