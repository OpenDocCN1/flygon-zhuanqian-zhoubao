  - 决定提前给合伙人结算一批基础佣金，也就是 20% 的门票再扣掉手续费之后的金额...这一措施是极大的刺激了战队的积极性，在最后的十天里，很多人都爆发了惊人的转化效果。
  - 直到最后的 2 天我们才再次集中发力...最终在倒数第二天瞬间扭转局势，并在之后迅速拉大优势，最终以超过 50 人的绝对优势逆袭拿下了第三名
