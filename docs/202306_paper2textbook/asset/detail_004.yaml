  name: 短剧CPS —— 切片二剪赚取充值佣金
  points:
  - '**为什么需要这个概念？**'
  - '- 短剧市场年充值将超电影票房，存在巨大分销红利'
  - '**核心定义**'
  - '- 短剧CPS：版权方授权，达人二次剪辑分发，用户充值后按50%-80%分佣'
  - '- 市场规模：月充值15亿，长期可达30亿/月，年超300亿'
  - '**关键性质**'
  - '- 一九原则：10%的剧/达人贡献90%收益'
  - '- CPM基准：1000次播放≈1元收益，与粉丝量级关系不大'
  - '- 判重机制：老剧重复剪无流量，新剧首发有红利'
  - '**典型例子**'
  - '- 版权方月产30部短剧测试爆款；宁波行政女孩一条视频一晚赚6000+佣金'
  - '**边界条件**'
  - '- 存在扣量黑箱、多级分销必死、全职养号ROI低等坑点'
  sources:
  - paper: docs/202306/20230627_061.md
    role: origin
  excerpts:
  - 短剧分销的具体玩法也就是通过切片的二次剪辑分发，分销者只要加入对应的分销平台，拿到短剧的内容授权，进行二次剪辑创作...用户通过抖音切片内容，点击小程序付费充值后，对应的分销达人能获得对应
    50%-80%佣金
  - 目前短剧市场完全是一九原则，做 10 个剧也许只有一个能爆，所以目前在抖音有 10%的短剧投放消耗能占到整个池子的 90%
  - 从营收上来看，每个 CPM 能有 1 块钱的收益（一个 CPM=1000 次播放），这跟分销达人粉丝的量级关系不是很大...1,000 万的播放能拿到大概
    1 万块钱收益
  - 他们告诉我有一个宁波的小姑娘，本职工作是在物业公司上班做行政...发了一条抖音推广短剧，一晚上赚了 6000 多的佣金
- 'no': 16
  name: 短剧产业链 —— 版权方、分发平台、达人的生存法则
  points:
  - '**为什么需要这个概念？**'
  - '- 入局短剧前必须理解每个角色的盈利逻辑与坑点'
  - '**核心定义**'
  - '- 版权方：高风险高回报，制作成本30万/部，靠量产测试爆款'
  - '- 分发平台：中间商，靠独家供给与多任务分发转型'
  - '- 达人：终端分销，拼新剧首发与差异化二剪'
  - '**关键性质**'
  - '- 扣量黑箱：实充100万可能只结算60万，达人无法举证'
  - '- 家猪野猪理论：全职员工不如外部兼职有狼性'
  - '- 入局分层：有资金做版权方，有渠道做分发联盟，个人做达人'
  - '**典型例子**'
  - '- 头部达人月入20万+，腰部6-7万，长尾陪跑'
  - '**边界条件**'
  - '- 平台政策变化快，窗口期短；多级分销模型不适用'
  sources:
  - paper: docs/202306/20230627_061.md
    role: origin
  excerpts:
  - 在实际的分销中很容易被上游扣量，比如你带去了 100 万的充值，最后告诉你只有 60 万，你也无法去反驳，只能是上游告诉你有多少业绩就是多少
  - 收入好点的分发达人一个月大概能赚六七万佣金，头部达人一个月能赚 20 多万
  - 在公司上班的人还真不一定会被那些外部兼职的做的好，毕竟他们是需要依靠这个业务做收入的，在公司上班还是有基本保底工资的，这就是家猪和野猪的区别
  - 总的来说短剧市场最好的还是做上游的版权方，但是这个对资金、投放的要求都很高...对于中小创业公司来说还是个不错的选择...对于个体创业者或者自由职业者来说，还是做这种终端的分发者比较靠谱
