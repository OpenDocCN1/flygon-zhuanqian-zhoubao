  - 光靠我和老徐是不可能拉得了这近百个围观群，几千上万人的潜在用户，我们战队的上百位合伙人都参与了拉新
  - 当时划了三档，理想状态下应该是 TOP5、TOP15 和其它。TOP5 的要求应该是拉新成功 20～50 人及以上的水平垂直 IP 或者流量高手，TOP15
