learning_targets:
- 理解财富、赚钱与商业模式的基本定义，建立从“存钱”到“持续创造并提取价值”的认知框架
- 区分出卖时间、经营资产、掌握资源和制定规则等不同财富获取层级
- 掌握“信息差—认知套利—中间人经济”的机会识别逻辑
- 理解快钱与慢钱的阶段性关系，并能够根据创业目的、资源条件和风险承受力选择策略
- 区分做题家与出题家，学会用第一性原理、反脆弱和边际复制成本分析商业问题
- 认识理论学习与商业实践之间的鸿沟，建立在合规前提下通过实战获取隐性知识的意识
- 掌握生意本质三维模型，能够从个体、群体和标准化需求角度分析商业机会
- 理解职场四层次进化模型，并能够根据自身阶段运用专业做事、利益绑定、独立操盘和赛道选择能力
- 完成关于金钱、资源、时间和个人优势的认知重构，形成扬长避短和资源积累意识
- 掌握四大时间成本模型，能够判断一个商业模式是否具备时间杠杆和规模化潜力
- 理解模仿律与组合拳创新，能够从模仿、微创新和系统壁垒三个层面设计竞争策略
- 理解商业1.0、2.0、3.0时代的演进逻辑，识别代运营2.5模式的价值来源与边界
- 掌握千万商业模式的三要素：好产品、高利润和可规模化，并理解裂变式阿米巴的基本结构
- 理解财富提取的三层级模型，识别血酬、稀缺资源租金和规则制定之间的差异
- 能够结合自身资源、能力、目标和风险承受力，设计个人从时间变现走向资产、资源或规则变现的升级路径
concept_map:
- 商业认知觉醒
- ├── 财富与赚钱的基本认知
- │   ├── 财富的本质
- │   │   ├── 概念：财富是持续从社会提取剩余的能力
- │   │   ├── 方法：从存量财富转向动态现金流与持续价值交换
- │   │   └── 核心主张：财富不是拥有多少钱，而是能否让价值和资金持续流向自己
- │   ├── 财富获取底层法则
- │   │   ├── 概念：对他人施加得利或损害
- │   │   ├── 方法：通过提供价值、掌握稀缺资源或建立规则获得定价权
- │   │   └── 核心主张：影响的人越多、提供的价值越大，财富上限越高
- │   ├── 信息差与认知套利
- │   │   ├── 概念：认知、资源和渠道上的非对称信息
- │   │   ├── 方法：关键词检索、知识库复盘、视角转换和中间人撮合
- │   │   └── 核心主张：视角一变，商机无限；信息差的主流变现形式是分销、转介绍和撮合
- │   ├── 年入百万 vs 考985
- │   │   ├── 概念：命运概率锁定、主观能动性释放、多元评价体系
- │   │   ├── 方法：比较先天变量与后天可控变量，寻找更适合自己的路径
- │   │   └── 核心主张：高考受家庭和教育资源影响较大，而赚钱拥有更多赛道、导师、组织和红利选择
- │   └── 赚钱难度与认知偏差
- │       ├── 概念：观察者偏差、幸存者偏差、稳定年入百万
- │       ├── 方法：区分年度人次、存量人数、营收和净利润
- │       └── 核心主张：赚钱并非天然容易，统计口径和成功案例都需要审慎解释
- ├── 财富获取层级
- │   ├── 出卖时间 vs 经营资产
- │   │   ├── 概念：出售时间、超级个体、商业系统、系统整合
- │   │   ├── 方法：从劳动力变现升级到产品化、系统化和杠杆化
- │   │   └── 核心主张：时间变现是线性的，资产和系统变现能够实现时间复用
- │   ├── 时间即生产资料
- │   │   ├── 概念：生产时间、再生产时间、学习时间、销售时间
- │   │   ├── 方法：用四大时间成本评估商业模式
- │   │   └── 核心主张：再生产成本趋近于零，是形成财富杠杆的关键
- │   ├── 赚钱五重境界
- │   │   ├── 概念：时间、资产、资源、规则、概率正预期
- │   │   ├── 方法：通过资源积累、规则博弈和概率分析实现层级跃迁
- │   │   └── 核心主张：财富层级越高，越不依赖个人时间，越依赖资源、规则和认知
- │   ├── 财富提取三层级
- │   │   ├── 概念：L1血酬、L2稀缺资源租金、L3规则制定
- │   │   ├── 方法：识别稀与缺，抢占新稀缺资源，建立生态和规则
- │   │   └── 核心主张：普通人应逐步从可替代劳动者转向资源掌控者和规则参与者
- │   └── AI与血酬模式消亡
- │       ├── 概念：可标准化劳动、无用阶层、劳动力杠杆过时
- │       ├── 方法：培养专长、产品能力、媒体能力和系统能力
- │       └── 核心主张：生态位不变，换公司和换岗位也无法消除被替代风险
- ├── 创业策略与认知身份
- │   ├── 快钱与慢钱
- │   │   ├── 概念：快钱、慢钱、创业目的论、阶段共生
- │   │   ├── 方法：根据生存需求、资源条件和长期目标配置策略
- │   │   └── 核心主张：快钱和慢钱没有道德高下，快钱可以成为慢钱的启动资本
- │   ├── 做题家 vs 出题家
- │   │   ├── 概念：规则内竞争、规则外创造、思维模型
- │   │   ├── 方法：运用第一性原理、反脆弱和边际复制成本拆解问题
- │   │   └── 核心主张：身份决定视界，定义规则比优化标准答案更接近高阶收益
- │   ├── 理论—实践鸿沟
- │   │   ├── 概念：隐性交易成本、灰色操作、理论的合规性边界
- │   │   ├── 方法：理论学习结合合法合规的真实项目实践和冲突复盘
- │   │   └── 核心主张：理论提供框架，实践提供现实博弈中的生存知识
- │   ├── 职场四层次进化
- │   │   ├── 概念：专业做事、满足上级利益、为自己操盘、选择商业模式
- │   │   ├── 方法：老板视角价值锚定、利益绑定和降维打击
- │   │   └── 核心主张：职场稳定性来自利益绑定，长期上限取决于商业模式和资源杠杆
- │   └── 认知觉醒五维重构
- │       ├── 概念：钱是交换价值、资源积累、反节省时间、扬长避短
- │       ├── 方法：优势测评、资源盘点和高杠杆任务筛选
- │       └── 核心主张：认知觉醒是变现前置条件，扬长避短优于盲目补短板
- ├── 生意与商业模式
- │   ├── 生意本质三维模型
- │   │   ├── 概念：满足个体、满足群体、满足标准化需求
- │   │   ├── 方法：按需求对象、标准化程度和交易要素设计业务
- │   │   └── 核心主张：生意的本质是交易行为满足他人需求
- │   ├── 个体需求交易
- │   │   ├── 概念：劳动力、金钱、智力
- │   │   ├── 方法：将专业认知转化为咨询、方案和陪跑服务
- │   │   └── 核心主张：不出售全部时间时，可以用资本和智力参与交易
- │   ├── 知识付费
- │   │   ├── 概念：认知焦虑、确定感、信任溢价
- │   │   ├── 方法：整理信息、结构化交付、建立信任和设计产品梯度
- │   │   └── 核心主张：用户常为“不再困惑”付费，而不是直接为能力提升付费
- │   ├── 商业模式与生意
- │   │   ├── 概念：长期模式与短期生意的区别
- │   │   ├── 方法：长期坚持模式，短期灵活捕捉可行生意
- │   │   └── 核心主张：好模式和好生意并不总是同一件事
- │   └── 成本与生存力
- │       ├── 概念：成本可控、现金流、风险边界
- │       ├── 方法：盘点人力、资金、智力成本并设计低固定成本模型
- │       └── 核心主张：成本结构可控比业务规模更能决定生存能力
- ├── 创新与商业进化
- │   ├── 模仿律
- │   │   ├── 概念：从上到下、几何扩散、先内后外、文化优先于物质
- │   │   ├── 方法：先模仿标杆，再进行本土化和微创新
- │   │   └── 核心主张：商业和文化都在模仿中发展，绝对原创并不存在
- │   ├── 组合拳创新
- │   │   ├── 概念：组织、选址、用工、供应链、分配的多维耦合
- │   │   ├── 方法：提高全链路耦合度，形成系统性反模仿壁垒
- │   │   └── 核心主张：单一创新容易被复制，长期优势来自持续创新或组合壁垒
- │   ├── 商业1.0、2.0、3.0
- │   │   ├── 概念：物物交换、商铺平台、知识认知
- │   │   ├── 方法：根据供给、渠道和用户变化判断时代位置
- │   │   └── 核心主张：供给过剩时代，认知和效率成为核心生产力
- │   └── 代运营2.5
- │       ├── 概念：连接传统商家与新商业模式的中介层
- │       ├── 方法：只做1到10、深度利益捆绑、项目独立核算、知识壁垒沉淀
- │       └── 核心主张：代运营的价值不在卖劳动力，而在于提升存量业务效率
- └── 规模化顶层设计
- '    ├── 千万商业模式三要素'
- '    │   ├── 概念：好产品、高利润、能规模化'
- '    │   ├── 方法：信息差选品、阶梯产品矩阵、双规模引擎'
- '    │   └── 核心主张：产品定生死，利润决定空间，规模决定上限'
- '    ├── 超级个体天花板'
- '    │   ├── 概念：个人时间和交付能力限制'
- '    │   ├── 方法：从个人IP转向矩阵IP和组织化运营'
- '    │   └── 核心主张：单打独斗适合0到1，组织化才适合突破更高收入层级'
- '    ├── 裂变式阿米巴'
- '    │   ├── 概念：阶梯产品、分销团队、付费流量、人才孵化'
- '    │   ├── 方法：投流招募合伙人，分销产生现金流，再筛选人才开发新品'
- '    │   └── 核心主张：人的规模与资金的规模共同构成商业放大器'
- '    └── 主业养副业与长期积累'
- '        ├── 概念：主业现金流、副业试错、红利捕捉、阶梯式积累'
- '        ├── 方法：先跑通最小闭环，再矩阵化和自动化'
- '        └── 核心主张：普通人应先积累能力和现金流，再选择全职创业'
life_analogy:
- 想象一个人经营一座城市：
- '- **出卖时间** = 每天按小时出租自己的房间'
- '- **经营资产** = 建造房屋、商场或道路，让它们持续产生租金和交易机会'
- '- **信息差** = 你知道一条别人不知道的捷径，并为需要的人提供路线服务'
- '- **稀缺资源** = 城市中有限的好地段、交通入口或信任网络'
- '- **制定规则** = 建立一座平台或市场，决定交易如何发生'
- '- **AI冲击** = 自动化设备替代重复搬运工，迫使人转向设计系统和经营资源'
- 就像租房只能按小时收钱，而建造一套可持续出租的商业设施能够反复产生收入，财富跃迁的核心也是从出售时间转向经营可复用的资产、资源和规则。
- 想象两条道路：
- '- **考985**像参加一场规则固定、题目统一、名额有限的考试，努力方向明确，但起点受家庭、学校和教育资源影响很大。'
- '- **赚钱**像进入一个开放市场，可以更换赛道、产品、导师、老板和渠道，但需要自己识别机会、承担风险并持续试错。'
- 就像餐厅经营：
- '- **快钱**像在节庆期间卖爆款套餐，快速回款'
- '- **慢钱**像长期经营品牌、复购和口碑'
- '- 在没有现金流时，先卖快销套餐维持生存，再建设长期品牌，并不矛盾。'
- 想象一个人在棋盘上行动：
- '- **做题家**是在别人画好的棋盘上寻找最优走法'
- '- **出题家**是在设计棋盘、制定游戏规则，甚至创造新的游戏'
- '- 第一性原理帮助你看棋盘的底层结构，反脆弱帮助你在变化中获益，边际复制成本帮助你判断一次行动能否反复产生收益。'
- 想象一家餐馆满足三类顾客：
- '- **满足个体** = 为某位顾客定制宴席或咨询方案'
- '- **满足群体** = 为一群有共同焦虑的人提供课程或社群'
- '- **满足标准化需求** = 面向大众出售统一规格的餐品'
- 需求越非标，客单价通常越高但交付越依赖个人；需求越标准化，越容易规模化但竞争也更激烈。
- 想象一个内容产品工厂：
- '- 第一次写一本书需要大量时间'
- '- 之后每卖出一本书，几乎不需要重新写一遍'
- '- 这就是再生产成本趋近于零的时间杠杆，也是内容、代码、媒体和软件能够规模化的原因。'
- 想象一家奶茶店推出一种新口味：
- '- 单一口味很快会被竞争者复制'
- '- 如果同时拥有独特选址、供应链、组织、用工和分配方式，竞争者就很难完整复制'
- '- 这就是从单点创新升级到组合拳创新。'
- 想象一个传统商家不会使用线上平台：
- '- 商家拥有产品和线下基础，相当于已经有了“1”'
- '- 代运营团队帮助它改善内容、流量、转化和管理，把“1”做成“10”'
- '- 代运营的价值来自认知和效率，而不是单纯增加劳动力。'
- 想象一家商店想从小摊发展成连锁品牌：
- '- 好卖的产品决定顾客是否愿意购买'
- '- 高利润决定每次交易能留下多少空间'
- '- 分销团队和付费流量决定能否扩大规模'
- '- 阿米巴组织则让多个小团队成为独立的利润中心，共同推动增长。'
- 想象一个人背着水桶走路：
- '- 只靠自己提水，就是出卖时间'
- '- 买一辆车运水，就是使用资产'
- '- 掌握唯一水源，就是掌握稀缺资源'
- '- 建立供水规则和管网，就是制定规则'
- '- 财富层级越高，越依赖系统和资源，而不是个人一次次搬运。'
summary:
- concept: 年入百万 vs 考985
  desc: 高考受先天资源和单一评价体系影响较大，赚钱则拥有更多后天可控变量，但并不意味着赚钱没有风险或天然容易。
- concept: 命运概率锁定与主观能动性
  desc: 个体早期发展常受家庭、地域和教育环境限制，成年后则拥有更多选择老板、赛道、导师和资源的机会。
- concept: 观察者偏差与幸存者偏差
  desc: 不能因为身边或媒体中经常出现成功者，就误判高收入人群的普遍性和成功路径的可复制性。
- concept: 信息差
  desc: 信息差是认知、资源和渠道的不对称，通常通过中介、分销、转介绍和撮合实现变现。
- concept: 认知套利
  desc: 认知套利的核心不是更辛苦，而是切换视角，把别人看不见的信息转化为可交易的机会。
- concept: 快钱
  desc: 快钱依靠短期红利和机会快速获利，周期短、不确定性高，适合特定阶段的现金流和资本积累。
- concept: 慢钱
  desc: 慢钱依靠长期深耕、品牌和持续交付建立稳定现金流，通常需要更充足的资本和耐心。
- concept: 快慢钱互补
  desc: 快钱和慢钱不是道德对立，而是可以形成“快钱积累本金、慢钱构建长期资产”的时序链条。
- concept: 做题家
  desc: 做题家在既定规则内优化答案，主要竞争存量，收益上限受规则和赛道结构限制。
- concept: 出题家
  desc: 出题家能够定义问题、设计规则和创造新标准，重点在规则外创造增量。
- concept: 第一性原理
  desc: 第一性原理要求跳过表面惯例，直接追问问题由哪些最基本的要素构成。
- concept: 理论—实践鸿沟
  desc: 理论提供理想化框架，实践还包含利益博弈、隐性成本和复杂冲突，必须通过真实项目补足隐性知识。
- concept: 生意本质
  desc: 生意就是通过交易行为满足他人需求，商业模式的差异在于满足谁、如何交付以及如何获得回报。
- concept: 三维需求满足模型
  desc: 生意可以分为满足特定个体、满足特定群体和满足客观标准化需求三类。
- concept: 劳动力、金钱与智力
  desc: 个体需求交易可以出售时间和劳动力，也可以投入金钱或将专业智力产品化。
- concept: 知识付费
  desc: 知识付费主要帮助用户降低信息和认知焦虑，用户常为确定感、结构化路径和信任感付费。
- concept: 商业模式与短期生意
  desc: 商业模式强调长期结构，短期生意强调具体机会；生存阶段需要在不破坏长期方向的前提下灵活拿下短期机会。
- concept: 职场四层次
  desc: 职场能力可从专业做事，升级到满足上级利益、为自己操盘，再进阶到选择正确的商业模式和赛道。
- concept: 利益绑定
  desc: 职场和商业合作的稳定基础是利益关系和价值交换，而不是单纯的努力或道德期待。
- concept: 降维打击
  desc: 降维打击是在当前竞争维度低一级运作更高阶的认知和能力，以形成不对称优势。
- concept: 认知觉醒
  desc: 认知觉醒是对金钱、价值、资源、时间和个人优势进行系统重构，并以此推动执行力改变。
- concept: 扬长避短
  desc: 商业选择应优先发挥高优势能力，而不是长期在低优势领域补短板。
- concept: 时间即生产资料
  desc: 时间是知识、产品和财富生产的基础，真正的财富效率取决于如何提高单位时间的复用率。
- concept: 四大时间成本
  desc: 生产、再生产、学习和销售四类时间成本共同决定商业模式的效率，再生产成本越低，规模化潜力越大。
- concept: 零边际成本杠杆
  desc: 书籍、代码、媒体和数字产品可以一次生产、多次销售，从而突破个人可售时间的上限。
- concept: 赚钱五重境界
  desc: 赚钱要素可以从时间，升级到资产、资源、规则和概率正预期，层级越高越依赖认知与系统。
- concept: 财富提取三层级
  desc: L1是出售时间，L2是掌握稀缺资源，L3是建立生态和制定规则。
- concept: 稀与缺
  desc: 稀指供给总量有限或信任成本高，缺指社会运转中不可缺少，二者共同构成资源护城河。
- concept: 血酬模式
  desc: 血酬模式依赖个人时间和健康换取线性收入，可替代性强，容易受到AI和自动化冲击。
- concept: 新稀缺资源
  desc: 普通人可以通过识别新旧资源更替的窗口，抢先进入新的流量、技术、平台或信任资源领域。
- concept: 模仿律
  desc: 商业和文化都在模仿中传播，模仿是学习、扩散和行业进化的重要机制。
- concept: 组合拳创新
  desc: 单点创新容易被复制，长期壁垒需要组织、选址、供应链、用工和分配等多维度系统耦合。
- concept: 商业1.0、2.0、3.0
  desc: 商业社会从低效交换、商铺平台逐步演进到供给过剩下的知识和认知竞争。
- concept: 代运营2.5
  desc: 代运营2.5连接传统商家与新商业模式，核心是用认知和效率提升帮助已有业务从1做到10。
- concept: 项目独立核算
  desc: 将不同项目的收入、成本、负责人和风险分开核算，有助于控制主体公司的固定成本和失败传导。
- concept: 知识壁垒
  desc: 代运营或服务型公司的长期护城河不只是客户关系，而是项目案例沉淀出的行业认知、流程和人才体系。
- concept: 千万商业模式三要素
  desc: 年入千万商业模式需要好卖的产品、足够大的利润和能够被组织或资本放大的规模。
- concept: 超级个体天花板
  desc: 个人IP和一对一交付受创始人时间限制，适合启动业务但难以单独支撑更高规模。
- concept: 裂变式阿米巴
  desc: 通过阶梯产品、分销团队、付费流量和人才孵化，形成由人的规模与资金规模共同驱动的增长飞轮。
- concept: 一句话总结
  desc: 商业认知觉醒的核心，是从出售个人时间转向经营可复用的产品、资源、系统与规则，在理解需求和风险的基础上，通过信息差、时间杠杆、组合创新和组织化设计实现财富跃迁。
exercises:
- 'no': 1
  title: 比较两条人生路径的可控变量
  contents:
  - 请将“考985”和“年入百万”分别列出至少10个影响结果的变量。
  - 将每个变量标记为“先天不可控”“后天可控”或“部分可控”。
  - 比较两条路径在赛道、导师、组织、评价标准、试错方式和红利捕捉方面的差异。
  - 回答问题：
  - '- 哪条路径的可控变量更多？'
  - '- 可控变量更多是否等于结果一定更容易？'
  - '- 统计数据中的“年度人次”和“存量人数”有什么区别？'
- 'no': 2
  title: 绘制个人财富层级地图
  contents:
  - 根据“时间—资产—资源—规则—概率正预期”五重境界，画出自己的当前财富获取结构。
  - 分别写出你目前主要依赖的收入来源、核心投入要素和最大风险。
  - 为下一层级设计一个最小行动：
  - '- 如果当前主要出售时间，尝试找出一个可产品化的技能。'
  - '- 如果已经拥有产品，尝试找出一个可以降低再生产成本的环节。'
  - '- 如果已经拥有流量或客户，尝试思考如何沉淀为长期资源。'
  - 不要直接追求最高层级，说明你选择当前行动的理由。
- 'no': 3
  title: 用信息差视角发现三个机会
  contents:
  - 选择一个你熟悉的行业、平台或生活场景。
  - 分别从认知差、资源差和渠道差三个角度寻找机会。
  - 对每个机会回答：
  - '- 谁掌握了信息？'
  - '- 谁缺少信息？'
  - '- 双方为什么愿意交易？'
  - '- 你可以扮演生产者、中介、分销者还是服务商？'
  - '- 该机会是短期信息差，还是可以积累为长期能力？'
  - 最后选择一个机会，设计一次低成本验证。
- 'no': 4
  title: 设计自己的快钱与慢钱组合
  contents:
  - 写下你当前最重要的创业目标：改善生活、积累本金、获得自由，或建立长期事业。
  - 根据目标，分别设计一个快钱方案和一个慢钱方案。
  - 为每个方案标注：预期周期、启动成本、现金流速度、主要风险、可积累资产和退出条件。
  - 回答问题：
  - '- 快钱方案能否为慢钱方案提供本金？'
  - '- 如果三个月没有收入，你能否承受？'
  - '- 什么时候应该停止继续投入？'
- 'no': 5
  title: 从做题家转向出题家
  contents:
  - 选择一个你正在参与的行业、岗位或副业项目。
  - 分别用做题家视角和出题家视角描述这个项目。
  - 尝试使用第一性原理回答：
  - '- 这个项目真正满足了谁的什么需求？'
  - '- 收入从哪里产生？'
  - '- 谁掌握了定价权和分配权？'
  - '- 哪些规则是可以被重新设计的？'
  - '- 哪些动作能够形成边际复制成本较低的资产？'
  - 将最终结论整理成一页“项目底层逻辑图”。
- 'no': 6
  title: 分析一个商业模式的四大时间成本
  contents:
  - 选择奶茶店、咨询服务、写书、短视频账号或软件工具中的一个案例。
  - 估算其生产时间、再生产时间、学习时间和销售时间。
  - 将四类时间成本分别用高、中、低进行标注，并说明理由。
  - 回答问题：
  - '- 哪一项成本最限制规模化？'
  - '- 哪个环节可以通过标准化、内容化或自动化降低？'
  - '- 如果再生产成本趋近于零，收入结构可能发生什么变化？'
- 'no': 7
  title: 识别生意的三类需求
  contents:
  - 从你身边选择三个生意，分别对应特定个体、特定群体和客观标准化需求。
  - 对每个生意记录：目标对象、核心痛点、交付形式、客单价、复购可能和竞争壁垒。
  - 尝试将其中一个生意改造成组合模式：
  - '- 一个现金流业务'
  - '- 一个知识或内容产品'
  - '- 一个咨询、陪跑或智力服务'
  - 说明组合后可能出现的协同效应和执行难点。
- 'no': 8
  title: 搭建个人优势与资源积累清单
  contents:
  - 列出你的五项优势、三项弱项、五类现有资源和三个可交易能力。
  - 回顾最近一个月的工作和生活行为，将其分为“资源积累型”和“资源消耗型”。
  - 为以下资源分别设计一个积累动作：信任、人脉、技能、内容资产、个人品牌。
  - 避免把“花时间”简单等同于浪费，判断哪些时间投入可能产生长期复利。
- 'no': 9
  title: 设计一个组合拳创新方案
  contents:
  - 选择一个容易被模仿的产品或服务。
  - 分别从产品、组织、选址或渠道、供应链、用工、分配和品牌文化七个维度提出改进方案。
  - 判断哪些改进属于单点创新，哪些改进能够形成系统耦合。
  - 画出竞争者模仿该方案所需要经过的环节，并说明你的壁垒如何提高模仿成本。
  - 补充一个持续微创新计划，安排未来三个月的迭代节奏。
- 'no': 10
  title: 设计一个代运营2.5模式
  contents:
  - 选择一个传统行业商家，假设它已经拥有产品和线下基础，但缺乏线上运营能力。
  - 设计从1到10的效率提升方案，至少包含获客、内容、转化、交付和复盘五个环节。
  - 为项目设置：负责人、利益分配、项目成本、独立核算方式和风险隔离规则。
  - 回答问题：
  - '- 你提供的是劳动力，还是认知和效率？'
  - '- 项目失败时，风险是否会传导到主体公司？'
  - '- 如何把项目经验沉淀为知识壁垒？'
- 'no': 11
  title: 构建裂变式阿米巴草案
  contents:
  - 为一个假想产品设计99元、999元和9999元三个层级。
  - 明确每层产品的目标用户、核心价值、交付方式和利润来源。
  - 设计分销团队的角色、分成规则和晋升标准。
  - 设计付费流量如何招募合伙人，以及如何通过合伙人表现筛选核心人才。
  - 暂不追求具体收入预测，重点检查产品、利润和规模三个要素是否相互匹配。
