  - '**核心定义**'
  - '- 职业成长投入具有“零沉没成本”特性，价值实现存在时间滞后但必然通过“点线面”网络化连接产生复利回报。'
  - '**关键性质**'
  - '- 没有白做的项目，每一步都算数。'
  - '- 隐性经验（坑、成本控制、心理破防）比成功经验更具迁移价值。'
  - '- 失败是新人常态，但真正的分水岭在于失败后能否快速复盘继续。'
  - '**典型例子**'
