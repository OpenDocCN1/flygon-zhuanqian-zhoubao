units:
- 'no': 1
  name: 生财有术 —— 普通人的互联网勇者养成学院
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人在互联网赚钱面前常觉“两眼一抹黑”，缺项目、缺方法、缺同伴。'
  - '- 传统“刷课”只输入不实战，无法把知识变成收入。'
  - '- 需要一个把“学习-实战-反馈-变现”串起来的生态圈。'
  - '**核心定义**'
  - '- 生财有术是一个付费社群生态，通过“新手区-副本区-争霸赛-名人堂”四大模块，把成员变成“互联网勇者”，在真实项目里打怪升级。'
  - '**关键性质**'
  - '- 一切源自真实：真实项目、真实赚钱、真实人脉、真实档案。'
  - '- 全生命周期覆盖：从筛选准入、资源协作、竞技筛选到荣誉变现、裂变复制形成闭环。'
  - '- 游戏化设计：用通关、组队、排行、奖励激发持续行动。'
  - '**典型例子**'
  - '- 新手通过“小航海”完成首个项目赚到第一块钱，拿到“入场券”。'
  - '- 优秀成员进入“名人堂”获得IP孵化与城市合伙人机会。'
  - '**边界条件**'
  - '- 生态圈的有效性依赖成员主动投入；只看不干、囤课不学的人无法获益。'
  - '- 社群内容具有时效性，风向标类信息半衰期极短，需快速执行。'
  sources:
  - paper: docs/202306/20230613_262.md
    role: apply
  - paper: docs/202306/20230613_169.md
    role: apply
  - paper: docs/202306/20230613_260.md
    role: origin
  excerpts:
  - 《拼命拿结果的一年，终于有了第一个正反馈》
  - 用一年时间，认真把生财看完。
  - 感谢生财有术平台给我这样的互联网小白提供的开眼和赚钱实操机会！
  - 得益于生财搭建了专门的搜索导航，这个导航不仅分类明确，也可以自由搜索自己想了解的干货。
- 'no': 2
  name: 游戏化学实战 —— 像打怪升级一样学赚钱
  points:
  - '**为什么需要这个概念？**'
  - '- 传统学习只教概念，不教动作，学完仍然不会赚钱。'
  - '- 人性需要即时反馈、目标激励和同伴竞争，否则难以坚持。'
  - '- 通过游戏化机制把“创业实战”变成“可玩的成长游戏”。'
  - '**核心定义**'
  - '- 将网游机制映射到创业实战：新手区（航海手册+打卡日志）、副本区（3人小队+项目库+议事堂）、英雄争霸赛/龙珠榜（指定任务PK+资源倾斜+奖励基金）、名人堂（IP打造+五五分成+城市合伙人）。'
  - '**关键性质**'
  - '- 形成“筛选-实战-竞技-孵化-裂变”增长飞轮。'
  - '- 强调100%实战与结果导向：赚到钱才能进阶。'
  - '- 用目标驱动反脆弱性，具体目标提供心力引擎与认知过滤器。'
  - '**典型例子**'
  - '- 航海打卡日志：每天输出500字复盘，建立个人成长档案。'
  - '- 龙珠榜：完成指定任务PK，争夺奖励基金，获取资源倾斜。'
  - '**边界条件**'
  - '- 游戏机制需要强运营支撑，去中心化复制难度大。'
  - '- 若只追求打卡形式而忽视真实结果，容易变成“虚假繁荣”。'
  sources:
  - paper: docs/202306/20230613_168.md
    role: origin
  - paper: docs/202306/20230613_169.md
    role: apply
  - paper: docs/202306/20230627_127.md
    role: improve
  excerpts:
  - 2023.2.7 通过生财有术小航海入圈，抓住 brc20 生态，3 个月锁定 3 百万利润。
  - 第一部分：首次听闻 立即执行 ... 三.极速闭环
  - 公益训练营陪跑带 60+圈友下海实战
- 'no': 3
  name: 航海手册 —— 把赚钱项目变成1080p高清攻略
  points:
  - '**为什么需要这个概念？**'
  - '- 新手不知道第一步做什么、第二步做什么，容易迷茫放弃。'
  - '- 市面上课程良莠不齐，缺乏标准化、可执行的操作说明书。'
  - '- 需要一份“照着做就能跑通”的实战地图。'
  - '**核心定义**'
  - '- 航海手册是官方提供的标准化SOP，学员按手册实操执行，强制输出500字复盘日志，实现变现才允许进阶。'
  - '**关键性质**'
  - '- 将知识付费转化为结果付费，口号：“赚到的钱100%归你，赚到钱才有资格进阶”。'
  - '- 颗粒度远超普通教程，被称为“1080p高清攻略”。'
  - '- 手册内嵌大量内部精华链接，是项目的百科全书。'
  - '**典型例子**'
  - '- 视频号带货航海手册：从选品、找对标、批量去重到上传，一步步教你。'
  - '- 新手按手册操作，1小时发布作品、当天出单。'
  - '**边界条件**'
  - '- 手册不是“自动赚钱机”，仍需亲自执行和试错。'
  - '- 平台规则变化后，手册需要迭代更新，过期内容可能失效。'
  sources:
  - paper: docs/202306/Yjt0dfSN8ob6Xgxl9z6ct7Kfnqf.md
    role: origin
  - paper: docs/202306/20230613_169.md
    role: apply
  - paper: docs/202306/Bw25drexlowoYaxyqWwc1BZDnbc.md
    role: improve
  excerpts:
  - 每一本航海手册都是一个项目的百科全书，在这万字长文手册里面又隐藏了无数个星球链接，里面集聚了无数生财大佬的精华和踩坑经验。最适合小白从0到1照着做。
  - 在航海开始前，就开始研究各个航海手册的... 其实这里是看的历史的航海手册。
  - 第一部分：首次听闻 立即执行
- 'no': 4
  name: 全职妈妈上岸记 —— 无IP、无内容、无产品也能跑通闭环
  points:
  - '**为什么需要这个概念？**'
  - '- 许多普通人认为自己“三无”（无IP、无内容、无产品），因此不敢开始。'
  - '- 需要真实案例证明：结构化实战训练可以让普通人0到1突破。'
  - '**核心定义**'
  - '- 三无小白（无IP、无内容、无产品）通过接入航海训练营，遵循流程执行，在结业靠岸当天收获首笔变现，验证“普通人可通过结构化实战训练实现0到1突破”的定律。'
  - '**关键性质**'
  - '- 强调“先赚一元钱积累正反馈”，而不是一开始追求大钱。'
  - '- 路径可复制：详细复盘已沉淀为飞书文档供后续复制。'
  - '**典型例子**'
  - '- 全职妈妈哆啦小梦从零开始，靠岸当天拿到第一笔收入。'
  - '- 大二学生纸鸢两周变现1w+。'
  - '**边界条件**'
  - '- 需要有空闲时间和基本执行意愿，完全拒绝动手的人无法获益。'
  - '- 案例存在幸存者偏差，不是所有人都能短期爆发，但方法论可参考。'
  sources:
  - paper: docs/202306/20230613_169.md
    role: origin
  - paper: docs/202306/UOviddqFLo82H8xOUX9cgHBLnNK.md
    role: apply
  - paper: docs/202306/XfMUdz0TQopqJvxQjducjPKynSf.md
    role: improve
  excerpts:
  - 大家好我是纸鸢，一位互联网小白，刚加入生财的大二学生。 5 月 17 号...第一次上手互联网项目，没想到迅速赚到钱，两周收入 1W+！
  - 终于，我开始有成交了！虚拟学习资料项目，我跑通最小MVP了！破0那个月我赚了七八百
  - 在不到一个小时的时间里，就有五个人加了好友...成功卖出第一单！
- 'no': 5
  name: 把手弄脏 —— 赚钱不是看会的，是干会的
  points:
  - '**为什么需要这个概念？**'
  - '- 只看教程、只做笔记，永远不知道真实项目的坑在哪里。'
  - '- 许多隐性知识（如养号机制）只有亲自下场才能发现。'
  - '- 需要一种强制实战的教学范式，把“知道”变成“做到”。'
  - '**核心定义**'
  - '- 生财社群核心教学法：躬身入局、先把手弄脏、跑通项目赚到第一块钱。强制实操倒逼认知升级。'
  - '**关键性质**'
  - '- 优秀学员具备项目前标准化SOP（思维导图、多维表格）与工具栈认知。'
  - '- 新人通过对标暴露“见识差”与“手艺差”，将模糊焦虑转化为具体学习清单。'
  - '**典型例子**'
  - '- 新人做小红书前先看历史航海手册，预先了解养号等细节，避免违规。'
  - '- 做废8个账号的复盘者通过“强化特训”获得认知跃迁。'
  - '**边界条件**'
  - '- 实战需要容许犯错和损失，心态脆弱者可能被打击。'
  - '- 如果只模仿表面动作而不理解底层逻辑，依然容易失败。'
  sources:
  - paper: docs/202306/AUFtddQyKozkegxnCmhcLbh2nqn.md
    role: origin
  - paper: docs/202306/Bw25drexlowoYaxyqWwc1BZDnbc.md
    role: improve
  - paper: docs/202306/Yjt0dfSN8ob6Xgxl9z6ct7Kfnqf.md
    role: apply
  excerpts:
  - 做废了8个账号，对我来说是一次“强化特训”。
  - 如果我不下场，始终也不知道养号这个细节是需要注意的。
  - 可以尝试先玩废一个号，把所有的规则和玩法都摸清楚再去批量操作。
- 'no': 6
  name: 三步走赚回学费 —— 新手的第一座里程碑
  points:
  - '**为什么需要这个概念？**'
  - '- 新手一上来容易贪多，同时做好几个项目，结果一个都没成。'
  - '- 需要把目标缩小到“赚回学费”，用单一焦点跑通闭环。'
  - '**核心定义**'
  - '- 以“赚回学费”为唯一锚点：1. 目标锚定（设定具体低门槛目标）；2. 单项目锁定（仅报名/专注一个航海）；3. 单玩法穿透（选定一位嘉宾一个玩法，屏蔽干扰）。'
  - '**关键性质**'
  - '- 验证“新手赚钱聚焦定律”：聚焦度与成功率正相关，广度负相关。'
  - '- 拒绝多线作战，集中资源跑通“知-行”最小闭环。'
  - '**典型例子**'
  - '- 白龙笔记通过“边做边学，专项学习”在生财快速找到方向。'
  - '- 纸鸢只跟随一位导师，从天涯神贴项目赚到第一桶金。'
  - '**边界条件**'
  - '- 只适用于从0到1阶段；跑通后需要拓宽视野，避免长期局限单一玩法。'
  - '- 若选错导师或项目，可能“聚焦”变成“执迷”，需及时止损。'
  sources:
  - paper: docs/202306/Bw25drexlowoYaxyqWwc1BZDnbc.md
    role: origin
  - paper: docs/202306/20230613_169.md
    role: apply
  - paper: docs/202306/20230613_260.md
    role: improve
  excerpts:
  - 边做边学，专项学习，这 8 个字是我分享给圈友们的经验和感悟。
  - '任平生 : 纸鸢执行力很强，赚到钱绝非偶然'
  - 找到自己的优势，和擅长的领域，然后报名参与与之匹配的航海活动。
- 'no': 7
  name: 车日路 —— 把自己当成一辆车来规划
  points:
  - '**为什么需要这个概念？**'
  - '- 在等待期（如错过报名）容易陷入焦虑和空转。'
  - '- 需要把模糊目标拆解成“车、日、路”，让等待期变成预建设期。'
  - '**核心定义**'
  - '- 车日路模型：日（目标），车（资源），路（微小行动）。配合六问自我对话法激发驱动力，产出学习攻略。'
  - '**关键性质**'
  - '- 将“等待”转化为“主动准备”，降低不确定性焦虑。'
  - '- 六问包括：想要什么、为什么、不做后果、做成收获、第一步、何时开始。'
  - '**典型例子**'
  - '- 错过航海报名后，用此模型整理出生财索引、预习手册、制定计划，产出一份实战攻略。'
  - '- 自我对话法帮助新人在没有外部督促时维持行动。'
  - '**边界条件**'
  - '- 该模型是认知工具，不能代替真实执行；若只规划不行动，依然是空转。'
  - '- 目标设定需具体可衡量，否则“路”无从谈起。'
  sources:
  - paper: docs/202306/Yjt0dfSN8ob6Xgxl9z6ct7Kfnqf.md
    role: apply
  - paper: docs/202306/Bw25drexlowoYaxyqWwc1BZDnbc.md
    role: improve
  excerpts:
  - 我研究出了一个bug，很多大佬因为星球文章不太方便展现原因，一般会独立开个飞书链接...于是我疯狂大量的保存飞书链接
  - 尤其是里面的航海手册，就算你不是生财会员，就算你一次都没有参加航海，每一条船，每一个项目，每篇手册万字长文，全部可以免费查看
- 'no': 8
  name: 搜索杠杆 —— 让知识库替你打工
  points:
  - '**为什么需要这个概念？**'
  - '- 社群内海量信息，新手不知从何看起，容易迷失。'
  - '- 需要一套分级检索策略，快速找到高质量方法论。'
  - '**核心定义**'
  - '- 生财索引2.0关键词联想检索法：一级搜航海项目名/核心业务词；二级搜衍生长尾词；三级挖掘平台热门话题标签获取高赞精华帖；四级锁定“精华帖”标签优先阅读。'
  - '**关键性质**'
  - '- 将“海量非结构化信息”转化为“可变现知识产品”。'
  - '- 通过关键词锚定检索+飞书文档深度整合发布，实现隐性经验显性化迁移。'
  - '**典型例子**'
  - '- 新人用“小红书”搜索，再延展“小红书运营”“小红书引流”等词，快速建立项目全景。'
  - '- 白龙笔记使用生财搜索导航，专项学习IP、小红书、知乎。'
  - '**边界条件**'
  - '- 关键词选取水平影响检索质量，需要不断修正。'
  - '- 搜索到的内容可能过时，需结合近30天风向标判断时效。'
  sources:
  - paper: docs/202306/20230613_260.md
    role: origin
  - paper: docs/202306/Yjt0dfSN8ob6Xgxl9z6ct7Kfnqf.md
    role: improve
  excerpts:
  - 得益于生财搭建了专门的搜索导航，这个导航不仅分类明确，也可以自由搜索自己想了解的干货。
  - 生财有术索引站2.0 https://search01.shengcaiyoushu.com/ 直接被震惊到，我居然还可以免费看里面绝大多数内容！！！
- 'no': 9
  name: 认知对齐 —— 先治‘看见别人赚钱就焦虑’
  points:
  - '**为什么需要这个概念？**'
  - '- 新手常被成功的表象刺激，盲目模仿后受挫。'
  - '- 需要校正对成功案例、自身禀赋、不完美的认知。'
  - '**核心定义**'
  - '- 三部曲：1. 反幸存者偏差（成功案例溯源法，还原隐性资本）；2. 承认禀赋差异（素人等级森林，成事能力可迁移但路径不可复制）；3. 接纳非完美主义（微进步正反馈锚定，拒绝焦虑瘫痪）。'
  - '**关键性质**'
  - '- 对抗“只看结果不看原因”的认知偏差。'
  - '- 将模糊焦虑转化为具体学习清单。'
  - '**典型例子**'
  - '- 看到500强总监做小红书成功，先调研其履历和团队，再判断自己能否复制。'
  - '- 学会一个下载工具也算进步，用微正反馈维持行动。'
  - '**边界条件**'
  - '- 溯源成功案例需要获取隐性信息，可能难以完全做到。'
  - '- 接纳不完美不等于躺平，仍需保持行动。'
  sources:
  - paper: docs/202306/AUFtddQyKozkegxnCmhcLbh2nqn.md
    role: origin
  - paper: docs/202306/Bw25drexlowoYaxyqWwc1BZDnbc.md
    role: improve
  excerpts:
  - 刷到我面前的，都是已被大数据洗过无数遍的成功了的笔记，压根看不到失败者，以至于有了养成系都能爆的错觉。所以，不要陷入平台给你推的“成功茧房”。
  - 眼睛看懂了，不代表手就会了
- 'no': 10
  name: 五年复盘 —— 用输出倒逼成长
  points:
  - '**为什么需要这个概念？**'
  - '- 大多数人做了很多事却无法沉淀为能力，成长缓慢。'
  - '- 需要一套可复用的复盘原则，把经历变成方法论。'
  - '**核心定义**'
  - '- 五大原则：深度参与式输出、互联网利他思维、禀赋匹配选择法、热点-平台-人群三层方向模型、内容溢价差异化。'
  - '**关键性质**'
  - '- 输出是连接高质量网络唯一入场券。'
  - '- 利他边际收益递增，自利边际收益递减。'
  - '- 以人群为锚可实现跨周期资产沉淀。'
  - '**典型例子**'
  - '- 慧姐通过知乎好物分享换取百倍信息增量，双十一教程引发万人变现。'
  - '- 放弃直播改做视频带货，选择与禀赋匹配的易实现路径。'
  - '**边界条件**'
  - '- 复盘需要真实数据和深度思考，敷衍的复盘无意义。'
