paper: docs/202306/20230613_069.md
desc: 该素材通过一个初中毕业汽修店老板亮仔的真实案例，展示了其折腾抖音一年无果后，采用特定同城号方法论一个月实现营收十万元的获客转型过程，核心在于验证'自媒体仅是获客工具、不依赖保险公司推修、差异化避开4S店竞争'的实体店同城获客逻辑。
concepts:
- name: 同城号方法论
  desc: 一种面向线下实体商家（如汽修店）的抖音同城获客操作体系，强调人人可复制、低门槛、以获客为核心目的而非打造网红。
  is_original: true
  excerpt:
  - 人人可复制的同城号方法论
  - 初中毕业的汽修店老板，折腾抖音一年分文不进，按照这个方法一个月营收十万元
- name: 非保险依赖型获客模式
  desc: 摆脱传统修理厂依赖保险公司推修、低工时费的被动局面，通过自媒体直接触达C端车主，实现自主定价和高利润业务获取。
  is_original: true
  excerpt:
  - 不靠保险公司吃饭呗
  - 保险公司给事故车送配件，压低工时费，如何转变？
- name: 自媒体即获客工具论
  desc: 将抖音等自媒体平台定位为单纯的线下生意获客渠道，而非追求流量变现、IP打造或技术展示的目的，核心指标为线下营收转化。
  is_original: true
  excerpt:
  - 自媒体仅仅是获客工具而已
methods:
- name: __overview__
  desc: 素材未展开具体操作步骤，仅引用飞书文档链接作为详细方法论载体，核心方法论为：实体老板亲自出镜/操作 + 同城定向内容分发 + 线下服务闭环转化。
  excerpt:
  - 按照这个方法一个月营收十万元
  - 详细案例见飞书文档链接
theorems:
- name: 实体店同城获客可复制性定律
  desc: 即使是初中学历、无新媒体经验的传统手艺人，只要掌握正确的同城号方法论，也能在短周期（一月）内实现显著营收增长（十万），证明了该方法论的低门槛与高复制性。
  excerpt:
  - 初中毕业的汽修店老板，折腾抖音一年分文不进，按照这个方法一个月营收十万元
- name: 差异化用户群体定位论
  desc: 同城号获客的目标用户（自费维修车主）与保险推修/4S店用户（走保险/高溢价用户）本质上不是一类群体，因此不构成直接竞争，而是挖掘存量市场中的增量红利。
  excerpt:
  - 就不是一类用户群体
  - 便宜的车都喜欢自己处理
- name: 核心竞争力内生论
  desc: 自媒体无法提升专业技术水平（修车技术靠19年经验积累），自媒体仅解决'有没有客户'的问题，技术信任靠线下服务兑现，二者分工明确。
  excerpt:
  - 建议重读，老板十几年经验了
  - 仅做视频这件事，能否提高自己维修水平...自媒体仅仅是获客工具而已
findings:
- name: 亮仔汽修店转型案例
  desc: '[evidence] 主人公亮仔，汽修从业19年，初中学历。自运营抖音1年无收益 -> 采用该方法论后1个月营收10万元。验证了方法论对''零新媒体基础实体老板''的有效性。'
  excerpt:
  - 案例主人公是我合伙人的亲弟弟亮仔，他做汽修服务 19 年了...之前实体店获客全靠门店自然人流和老客户转介绍
  - 折腾抖音一年分文不进，按照这个方法一个月营收十万元
- name: 避开保险/4S店红海竞争验证
  desc: '[claim] 作者主张通过同城号获取自费客户，可不依赖保险推修、不与4S店正面硬刚，实现利润结构优化。'
  excerpt:
  - 不靠保险公司吃饭呗
  - 就不是一类用户群体
