paper: docs/202306/20230613_205.md
desc: 该素材是一篇关于利用 ChatGPT 联网功能进行自媒体爆款选题的实操指南，核心主张是“选题决定成败，蹭热点是最快捷径，ChatGPT 联网功能是高效挖掘热点的核心工具”，并承诺提供
  3 种结合 IP 定位的具体联网选题方法及实战案例。
concepts:
- name: ChatGPT 联网功能
  desc: 指 ChatGPT 4.0 于 2023 年 5 月开放的联网及插件功能，使其能突破训练数据时间限制，实时获取网络热点信息，成为自媒体选题的核心生产力工具。
  is_original: false
  excerpt:
  - 5 月 16 日开始，ChatGPT4.0 已经在陆续开放联网和插件功能。
  - ChatGPT 联网后在自媒体创作最大的帮助是什么？是找热点！！！
- name: IP 定位结合选题
  desc: 指在利用工具挖掘通用热点后，必须结合自身账号的人设、领域与受众画像进行筛选与改造，而非盲目跟风，以产出符合账号调性的爆款选题。
  is_original: true
  excerpt:
  - 本文我将阐述如何通过 ChatGPT 的联网功能、并讨论如何结合我们自己的 IP 定位，来进行创作选题。
- name: 选题即正义/选题为王
  desc: 核心创作理念，认为在小红书、抖音等自媒体平台，内容质量的上限由选题决定，选题是获取流量的第一要素。
  is_original: false
  excerpt:
  - 不管是小红书还是抖音，自媒体创作重要的是什么？是选题！
  - 最容易爆的选题方法是什么？是蹭热点！！
methods:
- name: __overview__
  desc: 整体方法论框架：利用 ChatGPT 联网功能实时捕捉全网热点 -> 结合自身 IP 定位进行筛选与适配 -> 产出符合账号调性的高潜力选题 ->
    通过实战案例复盘验证方法有效性。
  excerpt:
  - 本文我将阐述如何通过 ChatGPT 的联网功能、并讨论如何结合我们自己的 IP 定位，来进行创作选题。
  - 我这次会在介绍方法之后，再附带一个实际案例，加深大家的理解。
theorems:
- name: 蹭热点是爆款选题最快捷径
  desc: 在自媒体流量分发机制下，跟踪并利用实时热点话题（蹭热点）是获取高曝光、高互动（999+ 点赞）概率最大的选题策略。
  excerpt:
  - 最容易爆的选题方法是什么？是蹭热点！！
- name: ChatGPT 联网重构选题工作流
  desc: ChatGPT 联网功能的开放，将选题工作流从‘人工搜罗-筛选-构思’升级为‘AI 实时联网检索-热点聚合-结合 IP 定位输出’，极大提升了找热点的效率与时效性。
  excerpt:
  - ChatGPT 联网后在自媒体创作最大的帮助是什么？是找热点！！！
  - 研究了一个星期联网功能...我又要给大家带来新东西啦！！
findings:
- name: 作者实战背书与社群认证
  desc: '[evidence] 作者作为 ‘GPT 老司机’（从 22 年 12 月开始使用）、生财有术社区 3 篇精华帖作者、ChatGPT+自媒体航海教练的身份背书，以及评论区
    ‘先赞为敬’、‘赶紧运用到实践中去’ 等正向反馈，侧面印证了该方法论在该社群内的实战价值与受众认可度。'
  excerpt:
  - 作为从去年 12 月就开始用 GPT 写文案的 GPT 老司机、在生财发布 3 篇关于 ChatGPT 的精华帖、正在担任生财本次 5 月份 ChatGPT+自媒体航海教练的小凡
  - '灼眼的夏娜 : 先赞为敬 时空 : 学习了[强] 易水 : 很棒的分享，赶紧运用到实践中去'
