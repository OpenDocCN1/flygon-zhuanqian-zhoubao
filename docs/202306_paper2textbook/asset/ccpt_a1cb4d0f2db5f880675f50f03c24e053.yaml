paper: docs/202306/LjGDdEdDhoyXjUxEiRYcKIdPnMg.md
desc: 该素材是一份实操型经验分享，作者复盘了从零开始利用 ChatGPT 结合微信生态（搜一搜热点、公众号推荐机制）撰写爆款热点文章的全流程方法论。核心逻辑为：锚定自带流量的实时热点
  -> 逆向拆解同领域 10W+ 爆款文章的写作风格 -> 通过“双角色协作提示词工程”（风格模仿角色A + 专业点评角色B）指令 ChatGPT 生成初稿 ->
  人工精修标题/配图/排版 -> 利用平台算法特性（原创标签、发布时间、群发机制、站外引流）放大分发。作者以实测数据（阅读量从个位数到四位数）验证了该方法对新人的可行性。
concepts:
- name: 自带流量热点
  desc: 指微信搜一搜等平台实时热榜中，因涉及性别冲突、社会争议、猎奇事件等天然具备高讨论度、高点击率特征的新闻话题，是冷启动账号获取推荐流量的核心切入点。
  is_original: false
  excerpt:
  - 特别是这种带有「性」相关的热点是自带流量的。
  - 因为事实热点都是自带流量的，那就开干吧。
- name: 双角色协作提示词工程
  desc: 一种结构化的 ChatGPT 协作范式：角色A负责“风格迁移”（学习爆款文章的语气、结构、修辞），角色B负责“深度洞察”（提供专业点评视角、逻辑拆解、受众关切点），最终融合生成兼具爆款形式与优质内容的文章。
  is_original: true
  excerpt:
  - 首先找到对应的要处理的文章，训练一个角色 A；然后再提示AI担任一个分析热点事件的角色B。A 和 B 结合起来写一篇文章。
  - 请学习这篇文章的写作风格，总结这种写作风格，命名为“风格 A”
  - 再用提示词得到一个点评热点事件的角色 B，主要是点评和分析热点事件，以及了解背后的逻辑和其他问题
- name: 微信推荐算法红利期操作
  desc: 针对新号无粉丝基础，利用‘原创声明+精准分类+群发而非发布+黄金发布时间+站外导流’组合拳，最大化触发微信‘看一看’/搜一搜推荐池分发机制的操作规范。
  is_original: false
  excerpt:
  - 原创，这个原创会增加自己的推荐率，必须勾选。
  - 文章在发布的可以定时「群发」，这个一定要选群发，不要选「发布」。
  - 热点就是需要热，越早越好；情感的饭后时间点发布比较好
- name: 完读率阈值控制
  desc: 基于微信公众号算法特性，将文章字数严格控制在 1000-1200 字，平衡内容深度与用户完读率，避免因过长导致完读率下降进而削弱后续推荐权重。
  is_original: false
  excerpt:
  - 重点是字数 1000 字左右，不要太多，完读率不高。
  - 数控制在 1200 左右为佳，多了完读率不高，然后用户点赞后，在底部的推荐就会减少。
- name: 爆款标题关键词库
  desc: 一组经过验证的 36 个高点击率标题模式关键词（如‘万万没想到’、‘你知不知道’、‘为什么’、‘怎么办’等），结合 ChatGPT 批量生成并筛选，适配公众号大数据分发口味。
  is_original: false
  excerpt:
  - 热门标题的的模板，大概是下面这样的（来自航海手册的截图）。比如我最近写的一篇就是「万万没想到，xxxx」，阅读量比之前翻了 10 几倍。
  - 选取下面 36 个爆款关键词的 1-2 个，穿插到标题之中。你知知道**吗？你见过**吗？**值不值？为什么***? ***怎么办？
methods:
- name: __overview__
  desc: 热点锚定 -> 爆款拆解 -> 双角色 AI 写作 -> 人工精修包装 -> 算法友好发布 -> 站外导流放大，形成标准化的‘小胜积累’内容生产闭环。
  excerpt:
  - 下面就是具体的操作步骤，找到热点文章，并分析，然后用 ChatGPT 出文章，直到发布
  - 结合热点的内容，和相关的 10w+文章的内容，写一篇文章，有机会成为 高阅读的文章。
- name: 热点挖掘与验证法
  desc: 优先使用微信‘搜一搜’自带热榜（搜索发现）获取平台内原生热点 -> 点击进入筛选‘文章’类型 -> 翻页寻找 10W+ 爆款样本 -> 确认热点处于‘新闻发生初期，爆款尚未完全涌现’的时间窗口。
  excerpt:
  - 我建议用第三点：微信自带的搜一搜的热点
  - 点击想要的热点，就会回到微信搜一搜，记得选择「文章」，就可以看到文章类的信息了。
  - 大概率是新闻事件的原因，还没来得及有高阅读的文章，这个时候写，说不定就有机会成为 10w+。
- name: 角色A：爆款风格逆向建模提示词
  desc: 提示词模板：‘请学习这篇文章的写作风格，总结这种写作风格，命名为“风格 A” :"""xxx 文章的内容"""’。要求使用分隔符包裹正文，输出风格标签（如‘客观报道风格’)供后续复用。
  excerpt:
  - 请学习这篇文章的写作风格，总结这种写作风格，命名为“风格 A” :"""xxx 文章的内容"""
  - 得到角色 A「客观报道风格」
- name: 角色B：专家视角构建提示词
  desc: 借助 aicosplay 等提示词生成工具，构建‘热门事件点评人’人设，指令其从法律、心理、社会舆论、受众避坑指南等多维度拆解热点事件，补全非专业创作者的认知盲区。
  excerpt:
  - 再用提示词得到一个点评热点事件的角色 B，主要是点评和分析热点事件，以及了解背后的逻辑和其他问题
  - 这里利用 aicosplay 来写一个提示词。https://role.aicosplay.com.cn/zh?
- name: 融合生成与迭代优化提示词
  desc: 终极指令：‘担任一个热门事件点评人，用“客观报道风格“来扩写一篇文章，并点评和分析，帮助观众应该注意什么，不少于 1200 字：(xxx)’。若中断用‘继续’补全，生成后人工植入钩子、金句、互动引导。
  excerpt:
  - 担任一个热门事件点评人，用“客观报道风格“来扩写一篇文章，并点评和分析，帮助观众应该注意什么，不少于 1200 字：（xxx）
  - 如果在生成的过程中，中断了，或者是字数不够，可以输入「继续」来继续写文章
- name: 零成本配图获取流程
  desc: 实时热点类：抖音/小红书搜关键词 -> 复制链接 -> 微信小程序‘抖音去水印’下载视频 -> 本地逐帧截图裁剪。情感/搞笑类：第三方编辑器（如秀米、135编辑器）调用无版权图库。
  excerpt:
  - 打开抖音搜索关键字，转发复制链接 -> 打开微信搜索抖音去水印-> 随便算一个-> 粘贴，并处理-> 下载
  - 有了本地视频，想怎么操作就怎么操作，如果是 iPhone，直接在图片里面 拖拽，找到合适的帧，然后截屏并修改大小即可
- name: ChatGPT 标题生成与筛选 SOP
  desc: 输入文章全文+‘36个爆款关键词库’+格式约束（30字内、含1-2关键词、适配公众号口味）-> 批量生成 10-20 个备选 -> 人工直觉筛选最具‘点击诱惑力’标题。
  excerpt:
  - 直接简单粗暴的把你们的小红书改为「公众号」即可，并且我在最后关键点为改成了这样，更适合公众号的口味
  - 来看看生成的标题，是不是有那种味道了。
theorems:
- name: 新人冷启动‘借势+模仿+AI’铁三角定律
  desc: 零粉丝新号突围核心路径：借势（蹭平台原生热点自带流量）+ 模仿（站在 10W+ 爆款肩膀上拆解风格）+ AI（以低成本复刻爆款结构并注入专业深度）。三者缺一不可，既解决‘没选题’、‘不会写’、‘没流量’三大痛点。
  excerpt:
  - 并不是从转化/流量/产品出发，而是从当前出发---「没有流量」，有没有可能分析「时事热点」，然后写成情感类的文章。因为事实热点都是自带流量的
  - 结合热点的内容，和相关的 10w+文章的内容，写一篇文章，有机会成为 高阅读的文章。
  - 粥左罗老师说的：ChatGPT 写得快，我们思考文章的框架好，那么一个快、一个好，结合起来是不是就超过了不少人了。
- name: 微信公众号推荐机制‘三要素’判断
  desc: 文章能否进入大池推荐取决于：1. 原创保护（版权信任背书）；2. 完读率（字数控制在 1200 字以内）；3. 互动率（文末引导点赞/在看/评论触发二次分发）。
  excerpt:
  - 原创，这个原创会增加自己的推荐率，必须勾选。
  - 数控制在 1200 左右为佳，多了完读率不高，然后用户点赞后，在底部的推荐就会减少。
  - 加几句金句，亦或是引导用户关注和评论。
- name: 标题决定分发上限论
  desc: 在大数据分发机制下，标题是唯一触达用户的钩子；必须植入经过验证的‘爆款关键词’（制造悬念、引发共鸣、触发恐惧/好奇），并严格控制在 30 字以内完整展示。
  excerpt:
  - 标题是重点，因为是大数据推送，没有好的标题，没有人会点击进来看的。
  - 选取下面 36 个爆款关键词的 1-2 个，穿插到标题之中。
  - 第一、控制字数在 30 字以内，更简短
findings:
- name: 实测阅读量跃迁验证
  desc: '[evidence] 作者亲测：操作前文章阅读量长期停留在个位数（甚至需自点赞），应用该全套流程后，单篇阅读量稳定达到 4 位数（千次级），并出现‘万万没想到’标题模板单篇阅读量翻
    10 余倍的案例。'
  excerpt:
  - 从个位数的阅读达到了 4 位数的阅读
  - 比如我最近写的一篇就是「万万没想到，xxxx」，阅读量比之前翻了 10 几倍。
- name: 微信搜一搜热榜对新号最友好
  desc: '[evidence] 对比百度热榜、新榜热榜，微信‘搜一搜’热点（搜索发现）产出的文章更容易匹配公众号内部推荐池调性，且热点自带微信生态内的社交传播属性，冷启动成功率最高。'
  excerpt:
  - 对于微信的生态，我建议用第三点：微信自带的搜一搜的热点
  - 结合热点的内容，和相关的 10w+文章的内容，写一篇文章，有机会成为 高阅读的文章。
- name: 群发 vs 发布的推荐权重差异
  desc: '[claim] 作者主张‘群发’进入订阅号消息列表首位，拥有原生推荐入口；‘发布’仅入‘看过的文章’历史列表，几乎无冷启动推荐流量。建议新号必须勾选‘群发’。'
  excerpt:
  - 文章在发布的可以定时「群发」，这个一定要选群发，不要选「发布」
- name: 站外微博引流可辅助冷启动
  desc: '[evidence] 作者实测在微博同步发布并带上热点话题标签，虽无直接变现，但能为公众号文章带来基础阅读增量（+1 效应），提升文章在微信内部算法中的初始权重，进而获得更多推荐。'
  excerpt:
  - 目前我发现有微博流量，带热点的标签，这样就自然的流量，虽然这个流量没有变现，但是可以给文章增加阅读 +1，就可以带来流量效应，增加文章的推荐率。
- name: 抖音/小红书视频截图规避版权风险
  desc: '[evidence] 实操发现：直接下载热点相关短视频逐帧截图作为配图，兼具‘真实感’、‘零成本’、‘低版权风险’（需模糊水印/个人信息），优于购买图库或自制配图。'
  excerpt:
  - 下载下来自己截图放到文章里面。
  - 记得不要带上别人的个人信息了，免得被举报了。
