paper: docs/202306/20230613_259.md
desc: 该素材为一篇金融从业者老吴的投资劝诫帖，核心观点是“普通人发财秘籍第1条：远离赌博，远离股票”。作者凭借10年股龄、总体盈利二百多万的实战经历，反向论证炒股对普通人极高的倾家荡产风险，主张普通人应认清认知边界，拒绝以赌博心态进入股市，而应量力而行、守住本职工作。
concepts:
- name: 普通人发财秘籍第1条
  desc: 核心避险原则，主张普通人致富的首要前提是规避高风险投机工具（赌博、股票），而非追求高收益技巧。
  is_original: true
  excerpt:
  - 普通人发财秘籍第 1 条：远离赌博，远离股票。
- name: 倾家荡产神器
  desc: 将博彩和股票定性为导致家庭财务毁灭的首选高风险工具，强调其毁灭性后果的普遍性。
  is_original: true
  excerpt:
  - 亏钱方法千千万，首选倾家荡产神器：博彩和股票
- name: 赚钱后的劝退逻辑
  desc: 区别于‘亏钱后恐惧’的劝退，作者基于盈利经历（赚钱了才跟你说不要炒股），因见过太多亏钱案例而产生的幸存者偏差修正与风险警示。
  is_original: true
  excerpt:
  - 反而，我有赚到钱。赚钱了才跟你说不要炒股。因为我看过太多炒股亏钱的。
- name: 认知边界与量力而行
  desc: 评论区延伸出的核心投资哲学，指投资能力需匹配认知水平（看懂公司运营、经济学、国家政策），超出认知即送钱。
  is_original: false
  excerpt:
  - 能力有多少，就做多少事
  - 想在股市赚钱，公司运营、经济学、国家政策看得懂这三样是最基本的，不然就是送钱！
methods:
- name: __overview__
  desc: 基于个人实战盈利案例（幸存者视角）与大量亏钱观察样本（全样本视角）的对比反证法，建立‘远离股票’的风险优先决策框架。
  excerpt:
  - 战绩，赢。总体股票利润二百多万。
  - 我的第一句话就是：普通人发财秘籍第 1 条：远离赌博，远离股票。
  - 赚钱了才跟你说不要炒股。因为我看过太多炒股亏钱的。
theorems:
- name: 普通人炒股必亏定律
  desc: 对于缺乏专业认知（公司运营、经济学、政策）的普通人而言，炒股本质是赌博，大概率导致倾家荡产，而非致富途径。
  excerpt:
  - 亏钱方法千千万，首选倾家荡产神器：博彩和股票
  - 别想着靠炒股发财，最多赚点零花钱是可以的
  - 这么多年啥都不懂的愣头青栽里面见的太多太多了
- name: 幸存者偏差修正原则
  desc: 盈利者的劝退比亏损者的劝退更具参考价值，因为前者基于‘看透盈利难度与风险’而非‘恐惧亏损’。
  excerpt:
  - 不，相反，我不是亏怕了...反而，我有赚到钱。赚钱了才跟你说不要炒股。因为我看过太多炒股亏钱的。
findings:
- name: 作者个人实战数据样本
  desc: '[evidence] 作者披露10年股龄、股票经纪人身份、总体盈利200万+的真实盈利案例，作为‘赚钱者’身份的背书。'
  excerpt:
  - 股龄 10 年。战绩，赢。总体股票利润二百多万。
- name: 普通人咨询炒股的普遍现象
  desc: '[evidence] 作者此前分享盈利经历后，引来大量普通人咨询‘股票怎么炒’，侧证普通人渴望通过股市致富且缺乏认知的现状。'
  excerpt:
  - 里面写了我股票赚钱的事情，然后好多人来加我，问我股票怎么炒比较好。
- name: 评论区共识：认知不足即送钱
  desc: '[evidence] 评论区高赞观点印证核心主张：不懂公司运营、经济学、政策盲目入市者比比皆是，结局多为亏损。'
  excerpt:
  - 想在股市赚钱，公司运营、经济学、国家政策看得懂这三样是最基本的，不然就是送钱！这么多年啥都不懂的愣头青栽里面见的太多太多了
