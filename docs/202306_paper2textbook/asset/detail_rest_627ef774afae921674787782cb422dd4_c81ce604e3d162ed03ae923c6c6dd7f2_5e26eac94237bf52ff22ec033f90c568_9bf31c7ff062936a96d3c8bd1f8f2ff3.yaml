learning_targets:
- 理解“变现路径先行”的底层逻辑，能根据变现目标反推账号定位与内容策略
- 区分虚荣指标与变现指标，建立以成交、咨询和佣金为核心的账号评估体系
- 掌握精选联盟带货的开通条件、选品方法与佣金结算逻辑
- 理解星图商单双轨定价机制，能初步评估账号的商业价值
- 学会设计合规的公域流量私域化闭环，识别站外引流风险边界
- 了解代运营服务的分层结构与核心竞争壁垒
- 能利用全民任务标准化执行完成第一次商业练习
- 认识平台风控与引流博弈的常态化，制定合规经营策略
concept_map:
- 抖音变现生态（第16章）
- ├── 底层认知：变现先于内容
- │   ├── 变现路径先行论
- │   │   ├── 核心主张：变现模式决定账号方向
- │   │   └── 方法：先修“收银台”再装修内容门面
- │   ├── 虚荣指标与变现指标解耦
- │   │   ├── 核心主张：热闹≠收成，播放量不等于收入
- │   │   └── 方法：建立曝光→咨询→成交漏斗，以变现指标考核
- │   └── 平台风控与引流博弈
- │       ├── 核心主张：借流量与守规则长期共存
- │       └── 方法：合规承接 + 多账号矩阵对冲风险
- ├── 官方支持变现：借助平台基础设施
- │   ├── 精选联盟带货
- │   │   ├── 核心主张：不囤货也能借商品赚佣金
- │   │   ├── 方法：开通（1000粉+10作品+500保证金/蓝V豁免）
- │   │   └── 方法：选品验证法（达人后台已售 > 橱窗总量）
- │   ├── 星图商单双轨定价
- │   │   ├── 核心主张：用流量或专业度换品牌预算
- │   │   ├── 方法：CPM按播放结算
- │   │   └── 方法：套餐按粉丝/垂直度/权重定价
- │   └── 全民任务标准化执行
- │       ├── 核心主张：跟着“参考答案”完成首次商业练习
- │       └── 方法：筛选任务→拆解参考视频→1:1复刻
- ├── 私域引流变现：把客流变资产
- │   └── 公域流量私域化闭环
- │       ├── 核心主张：公域找用户，私域养用户
- │       ├── 方法：咨询留资/公众号沉淀/同城服务
- │       └── 边界：禁止站外引流，需使用平台允许的承接方式
- └── 线下商家服务变现：帮别人开店
- '    └── 代运营服务分层'
- '        ├── 核心主张：帮“不会做账号”的商家解决问题'
- '        ├── 方法：账号搭建→内容生产→投流运营→线索转化'
- '        └── 核心壁垒：沟通能力与客户资源而非纯技术'
life_analogy:
- 想象抖音变现像经营一家**线下门店**：
- '- **变现路径先行** = 开店前先想清楚卖什么、靠什么赚钱，再决定门面怎么装修'
- '- **虚荣指标** = 门口围观的人数'
- '- **变现指标** = 收银台实际收到的钱'
- '- **精选联盟带货** = 店里代销别人的商品，卖出拿提成'
- '- **星图商单** = 把店门口的广告位租给品牌方，按曝光或位置收费'
- '- **公域流量私域化** = 把逛店的顾客加进会员群，变成可反复触达的回头客'
- '- **代运营服务** = 帮别人开好店、管好店，挣服务费'
- '- **全民任务** = 按商场提供的样板间施工要求做一单，赚第一笔工钱'
- '- **平台风控** = 商场管理规定，违规摆摊会被警告、罚款甚至清退'
- 就像老板不能只看门口有多少人围观，更要看收银台进了多少钱，抖音运营也应把变现闭环放在内容热度之前。
summary:
- concept: 变现路径先行
  desc: 先确定收入来源和成交闭环，再设计内容与流量策略，避免“有播放无变现”
- concept: 虚荣指标与变现指标
  desc: 播放、点赞是热闹，GMV、咨询、成交才是收成，二者不能互相替代
- concept: 精选联盟带货
  desc: 不囤货也能借别人的商品赚佣金，是普通人低门槛入局的官方电商基建
- concept: 星图商单双轨定价
  desc: 品牌合作要么按播放量（CPM）买卖曝光，要么按垂类影响力打包定价
- concept: 公域流量私域化
  desc: 把平台借来的客流沉淀到公众号、微信或社群，变成可持续经营的用户资产
- concept: 代运营服务分层
  desc: 用账号搭建、内容生产、投流运营、线索转化四模块，帮助商家解决抖音经营问题
- concept: 全民任务标准化执行
  desc: 跟着官方给定的任务要求和参考视频完成作品，是新手低成本起步的训练场
- concept: 平台风控与引流博弈
  desc: 平台限制站外导流与用户刚需长期共存，合规承接和多账号矩阵是对冲风险的关键
exercises:
- 'no': 1
  title: 为内容账号设计三条可行变现路径
  contents:
  - 假设你准备做一个专注“家庭收纳技巧”的抖音账号，目标用户为一二线城市25-40岁女性。当前你只有手机和业余时间，没有任何供应链资源。
  - 请结合本章内容，为这个账号设计三条可行的变现路径，并分别说明：
  - 1. 每条路径对应哪种变现模式（精选联盟/星图商单/私域转化/代运营/全民任务等）；
  - 2. 每条路径对内容定位、粉丝规模和用户信任分别有什么要求；
  - 3. 这三条路径中，你认为哪条最适合冷启动？为什么？
  - 提示：不需要写具体视频脚本，重点考察你是否能把“变现路径先行”用到真实账号上。
- 'no': 2
  title: 辨析虚荣指标与变现指标
  contents:
  - 下面是两个抖音账号一周的数据：
  - 账号A：播放量 200万，点赞 8万，粉丝新增 3万，主页访问 1.2万，私信咨询 20次，成交 3单，客单价 199元。
  - 账号B：播放量 5万，点赞 2000，粉丝新增 300，主页访问 4000，私信咨询 150次，成交 30单，客单价 999元。
  - 请计算：
  - 1. 两个账号的咨询转化率（私信咨询/主页访问）、成交转化率（成交/私信咨询）、总GMV；
  - 2. 分别指出两个账号的主要“虚荣指标”和“变现指标”；
  - 3. 如果只能投入更多资源到一个账号，你选哪个？用变现指标说明理由。
- 'no': 3
  title: 设计合规的公域→私域转化路径
  contents:
  - 你为一个同城家政服务商家运营抖音账号，目标是让用户预约保洁服务。平台严格限制站外引流，但允许企业号使用官方组件（如私信、留资、小程序、粉丝群）。
  - 请画出从视频曝光到完成私域沉淀的完整链路，并标注：
  - 1. 在每个环节使用哪些平台允许的工具或组件；
  - 2. 哪些动作存在被判定为“站外引流”的风险，你会如何规避；
  - 3. 如何用“变现指标”检验这条链路是否有效。
  - 提示：可以结合“公域流量私域化”和“平台风控与引流博弈”两个概念。
- 'no': 4
  title: 给一个垂类账号估算星图报价
  contents:
  - 某家居垂类抖音账号：粉丝数 8万，近30天平均播放量 3万，点赞率 4%，粉丝画像中85%为女性，一线/新一线城市占比60%，近30天有2条商单合作记录。
  - 请参考“星图商单双轨定价”，分别按CPM模式和套餐模式给出你的报价逻辑：
  - 1. 如果按播放量结算，按CPM 20-50元/千次播放估算，这条视频报价区间是多少？
  - 2. 如果按套餐定价，你会考虑哪些因素（粉丝量、垂直度、互动率、用户画像等）？给出一个你觉得合理的价格。
  - 3. 品牌方可能会用什么指标质疑报价？你会如何用数据回应？
