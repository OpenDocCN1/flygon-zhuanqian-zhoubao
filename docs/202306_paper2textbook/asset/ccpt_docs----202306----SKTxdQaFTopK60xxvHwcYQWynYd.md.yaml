desc: 该素材是一份关于‘得物球鞋搬砖’项目的实操教程，核心逻辑是利用电商大促（如618）期间京东、淘宝等一级平台的活动低价（叠加优惠券、凑单、PLUS会员等手段）买入热门球鞋，再转手在得物APP二级市场通过‘现货’或‘寄存’模式高价卖出，赚取价差。素材系统阐述了卖家注册避坑（取消七天无理由/发票）、选品定价策略（参考得物近期成交价与销量）、全流程操作（领券/加购/凑单/付款/退凑单/无货加购刷库存）、到货质检标准（鞋盒/鞋标/氧化/胶水/勾线）、瑕疵处理‘以退代换’技巧、以及价格波动应对心法（砸价周期规律：活动期砸价->消化期->自然回涨），主张通过‘高销量大差价’与‘品牌溢价回涨’两类安全选品模型实现月入4万+的稳定收益。
concepts:
- name: 球鞋搬砖
  desc: 核心商业模式，指跨平台利用信息差与时间差，在一级电商平台大促低价买入正品球鞋，转手在得物等二级交易平台高价卖出赚取差价的套利行为。
  is_original: false
  excerpt:
  - 简单来说球鞋搬砖就是从一些电商平台例如京东淘宝唯品会等电商平台搞活动时通过活动低价买入球鞋，然后在二级市场得物APP或者nice咸鱼等平台卖出，赚取中间的差价。
- name: 现货出售
  desc: 得物卖家模式之一，卖家自留货源，售出后自行在规定时间内（半小时付款后1.5天内发货）寄送至得物鉴定中心，价格竞争遵循‘低价优先、同价先上架优先’规则。
  is_original: false
  excerpt:
  - 现货出售就是直接上架物品出售，自己定价，排队出售，也就是谁出的价格低谁就先出，如遇与他人出售价格相同，则看谁先上架，只要有卖家拍下半小时后即可寄出（寄出时间不得超过1.5天，否则扣保证金）
- name: 寄存出售/闪电直发
  desc: 得物卖家模式之二，卖家预先将货源寄存至得物仓库，售出后由平台直接发货（闪电直发），手续费更低、出货效率更高、发货超时不扣保证金，但需占用仓位。
  is_original: false
  excerpt:
  - 寄存既是把货发到得物仓库，放在得物仓库出售。寄存的手续费比现货更低...寄存鉴定通过后，也属于排队出售...寄存寄出超时（也是1.5天）不会扣除保证金。提醒：能寄存的物品尽量寄存。
- name: 砸价
  desc: 市场价格波动术语，指大促结束后，因搬砖者集中涌入导致供过于求，或急于回笼资金者低价抛售，致使得物市场价格短期大幅下跌的现象。
  is_original: false
  excerpt:
  - 砸价的意思：大促销活动过后打折的款，可能会一定程度得降价(砸价)。因为搬砖的不止是我们，会有人想早点急着卖出球鞋周转资金，一段时间的供过于求必然导致价格下降。
- name: 凑单/退凑单
  desc: 电商大促操作手法，为达到满减门槛加购低价商品（凑单款），主商品付款成功后单独申请退款退货凑单款，以此压低主商品实际到手成本。
  is_original: false
  excerpt:
  - 第三步需要凑单就加购凑单款...第五步退掉凑单款（京东的凑单款需要到收到货后申请售后退货）（淘宝的凑单，付完款就可以直接单独退凑单）
- name: 锁单/无货加购
  desc: 抢购技巧，指商品显示无货时，通过特殊操作（如到货通知、购物车编辑规格）将无货商品加入购物车，持续刷新等待系统释放库存（锁单释放）以完成下单。
  is_original: true
  excerpt:
  - 很多鞋子并不是没货，只是被锁单 ，锁单的意思就是拍下不付款...首先点一下到货通知，另外使用无货加购的办法把无货商品加到购物车，然后使劲刷新，能刷出来的
- name: 以退代换/瑕疵换鞋法
  desc: 素材原创风控操作，遇活动价商品有瑕疵且无货换货时，再买一双同款同码好货，申请退货退回瑕疵品，保留好货，实现不退货换新、成本不变。
  is_original: true
  excerpt:
  - 收到的鞋子如果发现有瑕疵，就再买一双同款同尺码，然后申请退货，把瑕疵鞋退给商家，好鞋留下来。
- name: 得物鉴定标准/质检清单
  desc: 素材总结的实操质检SOP，涵盖鞋盒裂开/褶皱、鞋标货号尺码核对、鞋底污渍清洁、鞋边后跟氧化变黄对比、鞋带/大块胶粒/勾线瑕疵判定等维度，并区分现货/寄存鉴定宽严差异。
  is_original: true
  excerpt:
  - 首先看鞋盒有无裂开，褶皱的没事，然后看鞋标对货号尺码，在看鞋子，鞋子先看鞋底有无污渍...对比一下有无氧化（就是两个鞋边以及鞋内侧后根，是不是存在两种颜色，存在一双偏黄的现象）
- name: 高销量大差价安全模型
  desc: 选品策略模型一，锁定日销量几百双、平时售价高、活动到手价低、差价>100元的头部款（如闪击6），依靠高销量快速消化砸价库存，价格快速回涨。
  is_original: true
  excerpt:
  - 第一种：有销量 差价大...以闪击6为例子吧 ，每天几百双的销量...活动价的鞋子被市场消化了...一个星期半个月，就回涨了
- name: 品牌溢价回涨模型
  desc: 选品策略模型二，锁定平时高价滞销、活动价极具性价比（如踢不烂）的品牌款，活动期低价引爆销量积累口碑/晒图，事后从众心理驱动价格回涨。
  is_original: true
  excerpt:
  - 第二种：差价大销量差的...通过价格换取热度...当市场消化完以后，没有人愿意砸价了，价格便开始回涨了
methods:
- name: __overview__
  desc: 得物球鞋搬砖全流程标准化作业法：大促前选品建档 -> 大促中叠加券/凑单/锁单抢购 -> 到货质检分流（现货/寄存/退货/以退代换） -> 得物定价上架
    -> 砸价期持仓待涨 -> 回涨期出货结利。
  excerpt:
  - 第一步先领卷、第二步加购物车、第三步需要凑单就加购凑单款、第四步付款、第五步退掉凑单款...鞋子到手一定要仔细看...点击出售价格，输入价格，预估收入就是我们的最终收入...砸价的时候，只要稳住不慌...当市场上砸价的球鞋出售消耗得差不多的时候价格自然就会涨回来
- name: 得物卖家注册避坑法
  desc: 注册个人卖家时，强制取消勾选‘支持七天无理由退货’与‘支持开具发票’，规避买家无理由退货导致的双向运费损失及开票税务合规成本。
  excerpt:
  - 【注意·重点】注册成为个人卖家时，一定不能勾选 支持七天无理由退货 和 支持开具发票 这两项。
- name: 京东无货加购刷库存法
  desc: 针对京东显示无货商品，进入商品页点‘到货通知’ -> 点‘加入购物车’(显示无货) -> 进入购物车编辑规格/颜色 -> 反复刷新购物车直至库存释放可勾选结算。
  excerpt:
  - 京东商品无货如何加入购物车刷库存...进入无货商品页面后...点一下到货通知，另外使用无货加购的办法把无货商品加到购物车，然后使劲刷新，能刷出来的
- name: 得物定价预估利润法
  desc: 在得物商品详情页点击‘出售’->输入目标售价->系统自动计算扣除手续费/运费后的‘预估收入’-> 用预估收入减去一级平台实付金额 = 单双净利润，据此决策是否上架。
  excerpt:
  - 首先打开得物找到对应的商品： 点击出售价格，输入价格，预估收入就是我们的最终收入...就例如这单，预估收入582，鞋子拍下价格500，利润是82
- name: 鞋盒瑕疵分级处置法
  desc: 根据鞋盒成色决定销售渠道：成色好->申请闪电直发(寄存)赚取更高溢价；有小瑕疵/开裂->502胶水修补后走现货(鉴定相对松)；烂不可修->申请售后换货/退货。
  excerpt:
  - 鞋盒成色较好的可以选择申请闪电直发，可以多赚点钱,有小瑕疵的推荐卖现货，鞋盒开裂可以用胶水粘一下，鞋盒烂的不能看了修不了了再申请售后,能换货尽量换货。
theorems:
- name: 砸价-消化-回涨周期律
  desc: 大促后价格必经三阶段：活动期低价入手 -> 活动结束后1-3周‘砸价期’(供大于求、价格探底) -> 库存消化完毕‘回涨期’(需求不变、供给减少、价格修复至非活动均价)。核心变量为‘日销量’与‘倒卖货源占比’，销量越高回涨越快。
  excerpt:
  - 活动临之际提醒下，到时候买到的鞋子,都会短暂砸价，砸价之后销量会爆高，待货量少了，后-段时间价格稳步上涨...销量高的鞋子大概2，3个星期价格就完全恢复了，可参考得物历史价格。
- name: 得物鉴定宽严差异定律
  desc: 得物‘现货’模式鉴定标准显著宽于‘寄存/闪电直发’模式。鞋盒破损、微小瑕疵建议走现货；鞋盒完美、鞋况极佳建议走寄存/闪电直发以获取更高溢价与效率。
  excerpt:
  - 如果你的鞋盒破损了，你可以选择出现货,不要发寄存，现货检查比较松...鞋盒成色较好的可以选择申请闪电直发，可以多赚点钱,有小瑕疵的推荐卖现货
- name: 风险可控公理
  desc: 作者实测退货率约3%，单双利润足以覆盖多双退货运费。核心风险（卖不出、鉴定不过、砸价亏本、买到假货）均有对应对策：选高销量款、自检SOP、持仓待涨、仅买官方旗舰店/大代理(假一赔三)。
  excerpt:
  - 搬砖以来，搬了几乎上万双鞋子，也就3%左右的退回率...单双鞋子利润高，搬砖一次够几双鞋子退回的运费...而且都是正规大代理或者官方品牌旗舰店...有电商平台假一赔三担保
findings:
- name: 作者实战收益数据
  desc: '[evidence] 作者上月销售额55万元，毛利率约10%，到手净利润4-5万元，验证了该模式在大促节点的高盈利能力。'
  excerpt:
  - 我上个月的销售额是55w，毛利率在10%左右，到手利润预估4-5w，总体还是非常可观的
- name: 闪击6案例复盘
  desc: '[evidence] 闪击6日销几百双，平价650-750，活动到手400多，得物砸至500多，预估库存1万双，按50%倒卖比例及日销几百双，约10-15天消化完毕，价格回涨，符合‘高销量大差价模型’。'
  excerpt:
  - 以闪击6为例子吧 ，每天几百双的销量，平常价格是650-750，一个活动把tb jd到手价格拉到400多...假如有1w双，每天几百双得销量...也不过十来天就消化完了...一个星期半个月，就回涨了
- name: 踢不烂案例复盘
  desc: '[evidence] 踢不烂平时得物1100+销量仅10+，活动到手690，得物砸至799后日销几十双，后回涨至900左右，验证‘品牌溢价回涨模型’：低价引爆销量积累口碑->从众心理推动价格修复。'
  excerpt:
  - 比如之前开车的踢不烂，得物1100+的时候无人问津，总销量就10+，活动价690到手，得物砸到799，销量立刻每天几十双了，然后陆续回涨到900左右
- name: 单双利润测算样本
  desc: '[evidence] 实操单双测算：得物预估收入582元，一级平台实付500元，毛利82元；寄存模式扣运费净赚约60元/双，印证‘寄存利润>现货利润’及可操作性。'
  excerpt:
  - 就例如这单，预估收入582，鞋子拍下价格500，利润是82，寄存利润大概在70，扣去快递费能赚60
- name: 退货率实测数据
  desc: '[evidence] 作者累计搬砖上万双，实测得物鉴定退回率约3%，远低于新手预期，且单双利润可覆盖多双退货运费，量化了‘鉴定风险’的可控性。'
  excerpt:
  - 搬砖以来，搬了几乎上万双鞋子，也就3%左右的退回率，，所以大家真的不用慌...单双鞋子利润高，搬砖一次够几双鞋子退回的运费
