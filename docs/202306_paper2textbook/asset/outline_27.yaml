'no': 1
name: 短视频电商实战 —— 从“刷视频”到“造生意”
desc: 本章汇聚抖音、快手、视频号三大平台的短视频与直播带货一线实战案例，拆解选品策略、内容生产、投流打法、账号体系搭建及风控规避的全链路方法论，揭示从零起步到月入百万的商业跃迁路径，助你避开新手坑、建立确定性增长模型。
nodes:
- 'no': 1
  name: 抖音纯付费流单品短视频带货全链路复盘
  desc: 拆解千万GMV背后的选品硬标准（高毛利、宽受众、低售后）、实拍素材工厂化生产体系（5人月产1500条）、剪辑团队‘白纸招聘+标准化SOP’管理法，以及随心推测品转千川放大的投流节奏与利润幻觉真相。
  role: method
  src:
  - paper: docs/202306/20230613_042.md
- 'no': 2
  name: 2023年抖音付费短视频红利耗尽与生存定律
  desc: 揭示赛道从蓝海转红海的底层逻辑：流量成本上涨挤压利润空间，核心供应链议价权（佣金≥80%）成生存门槛，付费流本质是‘烧钱买概率’的高风险赌博，新手无供应链优势大概率亏损。
  role: limitation
  src:
  - paper: docs/202306/20230613_042.md
- 'no': 3
  name: 抖音图文带货：上班族副业的低门槛风口实操
  desc: 对比视频带货，图文形式具备抗封禁、制作简单、投流门槛低特性，通过账号搭建、选品、素材制作、发布运营的‘喂饭级’全流程SOP，实测单号日入1000+佣金，旧账号解封亦可复用快速冷启动。
  role: method
  src:
  - paper: docs/202306/20230613_043.md
- 'no': 4
  name: 中老年养生赛道图文矩阵带货：37天零到8.8万佣金
  desc: 深耕垂直赛道积累选品认知，批量运营13个账号构建矩阵对冲单号风险，采用低成本图文形式挂载高佣金商品，利用大数定律稳定整体产出，验证‘赛道深耕+矩阵放大’的快速变现路径。
  role: experiment
  src:
  - paper: docs/202306/20230613_044.md
- 'no': 5
  name: 抖音教辅赛道‘矩阵+爆款’自然流单月百万GMV
  desc: 战略放弃已跑通商业IP矩阵，切入标品属性强、决策周期短的教辅赛道，采用矩阵账号批量测款配合爆款视频收割流量，无需付费投流即达成自然流单月100万GMV，验证赛道与模式的高匹配度。
  role: experiment
  src:
  - paper: docs/202306/20230613_045.md
- 'no': 6
  name: 短视频人设破局核心：制造‘体验差’与‘像观众又超越观众’
  desc: 提出‘体验差’理论：主动降低外部预期（去包装、去权威），超额交付内容价值（干货、情绪价值），构建‘像观众又超越观众’的人设公式，通过正向心理落差获取强粉丝粘性，两个月涨粉5万实战验证。
  role: method
  src:
  - paper: docs/202306/20230613_046.md
- 'no': 7
  name: 抖音情商课无人直播：极简搭建与弱合规生存
  desc: 仅需一段音频+一段动态图片搭建直播间，不挂小黄车/小程序规避违规判定，单机多开4个号矩阵放大，实测3号月入1万+，揭示蓝海赛道低门槛、高复利、窗口期内的合规生存策略。
  role: method
  src:
  - paper: docs/202306/20230613_047.md
- 'no': 8
  name: 抖音女装直播：三次濒临倒闭到月百万营业额的极限逆袭
  desc: 记录红海赛道中团队经历三次结业危机，通过持续复盘迭代最终实现月产出百万营业额的创业历程，证明直播电商存在极限生存后的逆袭可能性。
  role: motivation
  src:
  - paper: docs/202306/20230613_048.md
- 'no': 9
  name: 高客单价抖音培训‘四步组合拳’：月月翻倍增长的反直觉增长法
  desc: 切对人群（传统老板）、找对渠道（分销替代自建）、设计极简漏斗（免费课-299线下课-3万大课）、产品差异化（课程+工具双引擎），破解高客单价培训增长悖论，实现4个月业绩翻倍，年营收4亿模型佐证。
  role: method
  src:
  - paper: docs/202306/20230613_049.md
- 'no': 10
  name: 快手无人直播矩阵化SOP：10号月净赚5万的标准化复制
  desc: 系统拆解快手无人直播全流程：账号养号、选品三维法则（客单50-150/佣金20%+/高转化）、低成本硬软件搭建（2-3千/间）、素材去重防违规技术体系、新号前3场冷启动流量承接法，验证‘货找人’算法下的规模化盈利模型。
  role: method
  src:
  - paper: docs/202306/20230613_063.md
- 'no': 11
  name: 快手无人直播结构性优势与收益预期分层
  desc: 对比抖音，快手具备风控宽容度高、货找人机制弱化人设依赖、变现路径短三大优势；设定小白分阶段现实预期：入门期亏损/回本，成长期单号日佣200-500，成熟期矩阵月入5-20万，核心变量为选品、素材、投流、抗风控。
  role: definition
  src:
  - paper: docs/202306/20230613_063.md
- 'no': 12
  name: TK搬运快手知识付费：擦边内容+技术壁垒的灰色地带变现
  desc: 搬运TikTok擦边内容引流男粉，利用软件安装技术壁垒销售虚拟资源，平台内闭环变现，宣称零门槛、利润即销售额、团队4月盈利20万，但面临法律合规（破解/翻墙风险）、网络环境硬性要求及平台封号双重风险。
  role: limitation
  src:
  - paper: docs/202306/20230613_065.md
- 'no': 13
  name: 养生赛道逆向破局：非真人实拍混剪+纯自然流月佣5万
  desc: 在公认‘内卷低谷’的赛道，采用‘无真人出镜+实拍混剪’轻量化生产模式配合纯自然流打法，应届毕业生3个月实现月佣从602元跃升至5.1万，验证赛道共识性悲观往往蕴含机会，轻量内容可支撑高客单价变现。
  role: experiment
  src:
  - paper: docs/202306/20230613_139.md
- 'no': 14
  name: 抖音员工号体系：破解矩阵运营风控升级的组织架构式方案
  desc: 针对常规养号实名核验率70%-80%失效现状，提出企业号绑定员工号策略：不占个人实名名额、橱窗开通权限独立、提现可至企业对公，显著降低矩阵运营成本与风控风险，并揭示向小红书平台迁移的替代趋势。
  role: method
  src:
  - paper: docs/202306/20230613_140.md
- 'no': 15
  name: 抖音15种变现模式全景图与‘变现路径先行’决策论
  desc: 系统梳理官方变现（精选联盟、星图、全民任务、中视频等）、私域引流（咨询、公众号、知识付费、同城）、线下服务（代运营、同城获客、团购）三大类15种模式，核心主张‘变现决定生死’：变现逻辑通顺后内容生产才有方向，虚荣指标与变现指标需解耦。
  role: definition
  src:
  - paper: docs/202306/20230613_141.md
- 'no': 16
  name: 视频号短视频冷启动：2天5万+播放与‘简介引导橱窗’轻量变现
  desc: 新平台红利期新号2天即可跑出5万+播放，无需开通小店挂车权限，仅通过账号简介引导至橱窗成交，3号矩阵同步测试验证批量起号策略，利润率高且适合投流放大。
  role: experiment
  src:
  - paper: docs/202306/20230613_213.md
- 'no': 17
  name: 带货文案‘素材活用-改编创作’法：从拆书到十六字速记口诀
  desc: 以爆款视频结构为骨架，结合产品卖点（拆书目录）进行参照性修改：提炼结构→拆书提炼→敏感词规避替换→痛点/卖点/催单模块化组装→真人出镜拍摄，总结‘痛点疑问放开头，卖点展示跟上咯，逐一详解很上头，点击下单好理由’十六字口诀，单号日均800单月GMV百万验证。
  role: method
  src:
  - paper: docs/202306/20230613_218.md
- 'no': 18
  name: 抖音食品单店低价爆发模式：厂家代发捕捉爆发期收割利润
  desc: 低价策略获取自然流量爆发（日单千单+），配合厂家代发模式消除库存资金压力，单店短周期（几天爆发期）收割1.5-2万利润，作者从负债20万到还清债务的财务翻盘案例佐证。
  role: method
  src:
  - paper: docs/202306/20230613_219.md
- 'no': 19
  name: 抖音直播卖小吃配方全链路：三模型、合规套利、后端九八佬高利润
  desc: 系统梳理小风车(私域引流)、小黄车(直接成交)、第三方平台(半无人规避违规)三大变现模型；详解执照/ICP/类目选择(生活兴趣避开餐饮资质)合规套利，三大直播场景(实景/绿幕/配方截图)标准化搭建，对标话术逆向建模法，私域沉淀后通过设计餐车/灯箱/Logo‘九八佬’模式实现高客单价后端变现，实测累计变现6万+。
  role: method
  src:
  - paper: docs/202306/20230613_220.md
- 'no': 20
  name: 教辅带货文案‘从抄到超’三阶迭代：评论区公关驱动的转化工程
  desc: 蹭热点首发试错→评论区暴露‘孩子不知热点’痛点→置顶公关化解→二版预埋痛点触发‘卷子封题’专业异议→时间线铁证（百度热搜/二模时间）反制舆论反转→三版成熟模板固化（时间线自证+痛点前置+权威背书+紧迫性收尾），3天推至近3000单，揭示负面评论是最高质量免费需求文档。
  role: method
