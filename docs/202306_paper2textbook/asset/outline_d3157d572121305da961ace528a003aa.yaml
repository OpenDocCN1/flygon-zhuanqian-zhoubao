'no': 1
name: 生财实战体系 —— 从认知重构到变现闭环的全景拆解
desc: 本章基于生财有术社群2023年6月核心精华素材，系统梳理普通人通过‘认知升级→技能习得→项目实战→组织裂变’实现商业变现的完整路径。覆盖资料整理、时间管理、项目筛选、IP定位、内容电商、私域转化、团队激励、副业实操八大核心模块，提炼可复制的方法论与底层逻辑。
nodes:
- 'no': 1
  name: 资料整理核心技能
  desc: 定义信息搜集、整理、分析为连接知识库价值与个人变现的关键杠杆，是工作效能、人生成长、商业变现的必修基础技能。
  role: definition
  src:
  - paper: docs/202306/20230613_108.md
- 'no': 2
  name: 知识库淘金模型
  desc: 在垂直高质量社区（如生财有术）用核心关键词检索、按热度筛选、大样本阅读提炼、结构化输出指南，实现‘海量非结构化信息’到‘可变现知识产品’的转化。
  role: method
  src:
  - paper: docs/202306/20230613_108.md
- 'no': 3
  name: 万篇阅读验证技术变现路径可复制性
  desc: 作者耗时两个月阅读1万+帖子，提炼300篇高质量案例并综合成指南，证明‘技术赚钱’存在清晰可复制的模式而非运气。
  role: experiment
  src:
  - paper: docs/202306/20230613_108.md
- 'no': 4
  name: 资料整理是技术变现的最高杠杆
  desc: 编码是基础，但‘资料整理’才是连接技术能力与商业价值的核心转化器；掌握此技能可在现有知识宝库中低成本挖掘高价值路径。
  role: motivation
  src:
  - paper: docs/202306/20230613_108.md
- 'no': 5
  name: 达人优先原则
  desc: 项目成功取决于个人能力（达人属性）与项目方向的组合，主张‘先具备5条边、先成为达人’，个人积累比单纯寻找风口更重要。
  role: motivation
  src:
  - paper: docs/202306/20230613_109.md
- 'no': 6
  name: 六边形战士模型
  desc: 将项目成功拆解为个人5种核心能力+1个项目方向的组合，强调个人能力边际收益递增，项目仅为能力变现载体。
  role: definition
  src:
  - paper: docs/202306/20230613_109.md
- 'no': 7
  name: 广义阅读与狭义阅读双轨制
  desc: 广义阅读构建跨学科认知框架，狭义阅读针对具体项目穷尽复盘（几十万字）实现‘先胜而后战’，两者缺一不可。
  role: method
  src:
  - paper: docs/202306/20230613_109.md
- 'no': 8
  name: 内生项目方向
  desc: 最优生财路径源于个体阅读积累玫瑰图、资源禀赋玫瑰图的自然涌现，而非外部风口猎取；风口普适但适配度低，内生方向专属且成功率高。
  role: motivation
  src:
  - paper: docs/202306/20230613_109.md
- 'no': 9
  name: 人>项目定律
  desc: 优质项目不稀缺时，关键变量从‘找项目’转移为‘成为能驾驭项目的人’，个人积累是项目落地的充分必要条件。
  role: proof
  src:
  - paper: docs/202306/20230613_109.md
- 'no': 10
  name: 时间管理闭环
  desc: 通过学习理论、实践应用、复盘总结、调整优化四阶段循环迭代，最终形成适合个人的固化习惯体系。
  role: definition
  src:
  - paper: docs/202306/20230613_115.md
- 'no': 11
  name: 组合实战体系
  desc: 将GTD(收集)、四象限/二分钟/8020(分类)、三只青蛙(聚焦)、番茄工作法(执行)串联为标准化工作流，解决‘知易行难’。
  role: method
  src:
  - paper: docs/202306/20230613_115.md
- 'no': 12
  name: 精力管理本质论
  desc: 时间管理本质是精力管理，通过早睡早起、运动、碎片时间利用、拒绝无效社交维护高认知带宽，而非单纯挤压时间。
  role: motivation
  src:
  - paper: docs/202306/20230613_115.md
- 'no': 13
  name: 目标分解与复盘法
  desc: 自顶向下分解：年度→月→周→日目标；自底向上复盘：日复盘→周/月/年定期回顾调整，形成闭环。
  role: method
  src:
  - paper: docs/202306/20230613_115.md
- 'no': 14
  name: 上午黄金时段定律
  desc: 认知带宽上午峰值，最重要/最难任务（三只青蛙）必须安排上午，下午留低认知负荷任务，晚上归还家庭/自我。
  role: proof
  src:
  - paper: docs/202306/20230613_115.md
- 'no': 15
  name: 企业号矩阵模式
  desc: 单人/小团队批量注册运营多个小红书企业号，通过内容标准化复制（换场景/风格/马甲）实现流量获客与销售规模化放大，对冲单号限流风险。
  role: method
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 16
  name: 阿米巴利润分成机制
  desc: 按账号/业务单元拆分独立核算小组织，利润按比例直接分给运营人员，打破固定薪资上限，激发一线执行力与主人翁意识。
  role: method
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 17
  name: 价格-人群锚定定律
  desc: 定价决定消费人群画像：低价吸引价格敏感型（高维权、低复购），高价锚定高净值人群（低敏感、高品质、高复购、低售后），定价是筛选客户的第一道过滤器。
  role: definition
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 18
  name: 认知变现闭环
  desc: 商业本质是认知变现；靠运气赚的钱凭实力亏掉，永远赚不到超出认知的钱。失败源于跨越认知边界盲目扩张，成功源于认知圈内深耕。
  role: motivation
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 19
  name: 轻资产代发供应链
  desc: 无需囤货/发货/售后，仅负责内容生产与私域转化，利用供应链‘免费寄样、卖出代发、不影响二次销售’模式，创业门槛归零、现金流为正。
  role: method
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 20
  name: 爆文复刻与选品SOP
  desc: 标准化内容生产流程：收集竞品→拆解爆款标题/封面/选品/文案/导流钩子→高度复刻发布→数据复盘迭代，将‘爆款’从概率事件变为确定性动作。
  role: method
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 21
  name: 私域高客单转化体系
  desc: 公域种草→诱饵导流→朋友圈人设打造（专业买手）→一对一咨询销售→售后社群促复购（复购率15%），核心靠‘信任溢价’替代‘流量溢价’。
  role: method
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 22
  name: 风口即陷阱法则
  desc: 超出认知边界、需重资产、依赖不可控变量的风口往往是‘灭顶之灾’导火线；真机会在于长期主义赛道深耕复利。
  role: limitation
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 23
  name: 合伙人博弈不可避免论
  desc: 合伙生意顺境掩盖矛盾、逆境必裂；核心岗位被亲属占据导致话语权丧失，唯独资或清晰利润分离机制（如阿米巴）可长久。
  role: limitation
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 24
  name: 平台红利周期迁移论
  desc: 平台生命周期：蓝海期→成长期（红利期）→成熟期（资本垄断/存量博弈）→衰退/合规收紧期；创业者需识别阶段，在成长期入场、成熟期前撤离或转型。
  role: extension
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 25
  name: 小红书高客单女装矩阵实战数据
  desc: 单账号第7天爆文引流120精准好友转化30单客单2000+；单人6号月入20万；30号矩阵月流水600万+；团队122号年流水3100万；私域20万+日增300-600复购15%。
  role: experiment
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 26
  name: 直播带货重资产翻车案例
  desc: 投入重资产缺乏经验遭遇疫情黑天鹅，半年亏光积蓄负债400万，团队核心骨干讨薪离职，验证‘认知外重资产扩张=必死’。
  role: experiment
  src:
  - paper: docs/202306/20230613_119.md
- 'no': 27
  name: 三人团队起盘模型
  desc: 三人小团队通过特定互联网打法从零构建业务实现首个100万营收的组织与业务形态，复盘路径对新入局者可复制。
  role: definition
  src:
  - paper: docs/202306/20230613_120.md
- 'no': 28
  name: 自残式拆解
  desc: 创业者对全过程深度、无保留、暴露短板的复盘，旨在提炼可复制方法论，而非单纯展示成功。
  role: method
  src:
  - paper: docs/202306/20230613_120.md
- 'no': 29
  name: 复盘即升华
  desc: 定期停下来复盘过往路径（风景、弯路）是对心灵的升华和警醒，也是沉淀方法论的关键。
  role: motivation
  src:
  - paper: docs/202306/20230613_120.md
- 'no': 30
  name: 过往路径的可复制性
  desc: 作者实测起盘路径具有跨周期普适性，新入局者直接套用该打法依然能起盘成功。
  role: proof
  src:
  - paper: docs/202306/20230613_120.md
- 'no': 31
  name: 放大挑战、缩小需要
  desc: 面对目标时过度关注困难障碍（放大挑战），忽视所需具体资源动作路径（缩小需要），导致行动瘫痪的认知偏差。
  role: definition
  src:
  - paper: docs/202306/20230613_121.md
- 'no': 32
  name: 目标具体化拆解
  desc: 将模糊宏观目标（月GMV 100万）拆解为可执行、可量化、可逐日落地的微观动作清单（每日拍什么书、文案怎么写），将结果目标转化为过程任务。
  role: method
  src:
  - paper: docs/202306/20230613_121.md
- 'no': 33
  name: 文案迭代优化
  desc: 对带货视频文案从模仿到超越的层层拆解打磨，通过标准化SOP提升转化率，是撬动单品爆发的核心杠杆。
  role: method
  src:
  - paper: docs/202306/20230613_121.md
- 'no': 34
  name: 每日选题可视化看板
  desc: 利用实体黑板提前一天规划次日带货视频选题（具体到SKU），将抽象执行计划物理化、可视化，降低决策成本，保证产出连贯性。
  role: method
  src:
  - paper: docs/202306/20230613_121.md
- 'no': 35
  name: 文案“抄-改-超”三阶迭代法
  desc: 教辅带货文案SOP：抄(拆解标杆结构)→改(结合自有卖点本地化)→超(实测数据微调钩子/痛点/行动号召)，形成超越标杆的高转化模版。
  role: method
  src:
  - paper: docs/202306/20230613_121.md
- 'no': 36
  name: 行动力源于认知重构与任务微粒化
  desc: 突破瓶颈不在增加工时，而在修正‘放大挑战、缩小需要’认知偏差，并将宏大目标拆解为‘每天拍什么、文案怎么写’级微观确定性动作。
  role: proof
  src:
  - paper: docs/202306/20230613_121.md
- 'no': 37
  name: 单品深耕优于泛品广撒
  desc: 短视频带货中，集中资源对单品精细化打磨（文案/视频/投放）造单品GMV 20-30万爆款，再复制方法论至新品，是小团队跃迁最高效路径。
  role: proof
  src:
  - paper: docs/202306/20230613_121.md
- 'no': 38
  name: GMV突破百万实证
  desc: 5月前2/3仅50万GMV，心态调整与执行策略调整后末尾9天冲刺至100万+，验证方法论有效性。
  role: experiment
  src:
  - paper: docs/202306/20230613_121.md
- 'no': 39
  name: 单品爆款复现数据
  desc: 核心爆款（中高考押题作文）3天转化3000单+累计GMV 32万；第二爆款GMV 21万，证明文案迭代策略可复制。
  role: experiment
  src:
  - paper: docs/202306/20230613_121.md
- 'no': 40
  name: 个人单兵作战极限验证
  desc: 全程无团队单人完成选品/拍摄/剪辑/文案/发布全流程，因忙碌航海打卡缺失仍达成GMV翻倍，证明方法论对个人创作者高可执行性。
  role: experiment
  src:
  - paper: docs/202306/20230613_121.md
- 'no': 41
  name: 三层目标分层模型
  desc: 将多并行任务按重要性拆解为重点目标(跑通流程拿结果)、次要目标(低成本获高价值信息)、第三目标(最低成本完成合规)，每层匹配差异化资源投入。
  role: method
  src:
  - paper: docs/202306/20230613_195.md
- 'no': 42
  name: 关键路径锁定
  desc: 针对每层目标设计最小必要执行路径(时间分块/信息处理规则/执行动作标准)，消除决策犹豫实现‘无脑执行’。
  role: method
  src:
  - paper: docs/202306/20230613_195.md
- 'no': 43
  name: 通讯批量化处理
  desc: 将高频碎片化即时通讯干扰集中到固定时段一次性处理并归纳总结至知识库，实现‘单次切换、批量吞吐’，保护深度工作时段。
  role: method
  src:
  - paper: docs/202306/20230613_195.md
- 'no': 44
  name: 异步信息消费策略
  desc: 放弃直播实时参与，利用官方回放/文档在固定时间块高倍速高密度消费核心内容，疑问沉淀教练答疑，实现信息获取时间置换与成本压缩。
  role: method
  src:
  - paper: docs/202306/20230613_195.md
- 'no': 45
  name: 打卡双轨制模板
  desc: 根据执行阶段提供两套标准化打卡话术：前期‘总结感悟型’积累认知资产，后期‘结果导向型’沉淀可复用经验，拒绝无效废话。
  role: method
  src:
  - paper: docs/202306/20230613_195.md
- 'no': 46
  name: URL规律自动化工具
  desc: 逆向工程打卡链接URL参数规律(activity_id固定/subIndex递增)，构建浏览器收藏夹一键直达体系，消除‘寻找入口’隐性时间成本。
  role: method
  src:
  - paper: docs/202306/20230613_195.md
- 'no': 47
  name: 多线程并行执行的分层解耦定律
  desc: 面对多同质并行项目，全维度同步推进必因认知带宽不足崩盘；唯有目标分层+差异化关键路径+工具固化，才能在有限时间实现全线推进。
  role: proof
  src:
  - paper: docs/202306/20230613_195.md
- 'no': 48
  name: 即时通讯零成本隔离公理
  desc: 深度工作中即时通讯‘随时可达’是最大干扰源；物理屏蔽+时间置换+产出沉淀可将通讯成本从‘持续碎片化’压缩为‘一次性批量处理’。
  role: proof
  src:
  - paper: docs/202306/20230613_195.md
- 'no': 49
  name: 合规动作资产化转化原理
  desc: 强制合规动作(打卡)若仅应付则为沉没成本；引入阶段性模板+工具消除摩擦，可转化为个人知识资产积累，实现‘被动打卡’向‘主动复盘’质变。
  role: proof
  src:
  - paper: docs/202306/20230613_195.md
- 'no': 50
  name: 11航海并行实操可行性验证
  desc: 作者作为全职船员通过该方法论实际支撑11个航海并行执行，产出具体打卡案例(章节总结/工具心得/结果数据)，验证极高并发任务下落地有效性。
  role: experiment
  src:
  - paper: docs/202306/20230613_195.md
- 'no': 51
  name: 遥控指挥式运营
  desc: 核心负责人仅通过战略方向设定、关键节点决策介入，将具体战术执行、应变、复盘全权委托给经验不足的一线执行团队的管理模式。
  role: method
  src:
  - paper: docs/202306/20230613_196.md
- 'no': 52
  name: 生财拉新 SOP
  desc: 沉淀自实战的可复用标准化拉新操作流程、话术模板、执行清单及避坑指南，将非标准化实战经验转化为可教学、可交付知识资产。
  role: method
  src:
  - paper: docs/202306/20230613_196.md
- 'no': 53
  name: 实战速成机制
  desc: 新人在高压、真实、有容错空间的实战环境中，通过‘做中学、错中改、赛中练’实现运营能力指数级快速成长，而非依赖理论培训。
  role: proof
  src:
  - paper: docs/202306/20230613_196.md
- 'no': 54
  name: 低成本高潜力人才可承担高风险核心业务
  desc: 在清晰战略框架和容错文化下，缺乏经验的低成本人力(大学生)能通过实战快速成长，完成高难度核心运营任务(拉新Top5)，复盘质量超越资深运营理论整合。
  role: proof
  src:
  - paper: docs/202306/20230613_196.md
- 'no': 55
  name: 一手实战复盘优于二手经验整合
  desc: 一线执行者亲写的包含错误迭代/具体数据话术/踩坑细节的‘非整合帖’长文，比资深运营整理的理论性长文更具教学价值、可操作性和说服力。
  role: proof
  src:
