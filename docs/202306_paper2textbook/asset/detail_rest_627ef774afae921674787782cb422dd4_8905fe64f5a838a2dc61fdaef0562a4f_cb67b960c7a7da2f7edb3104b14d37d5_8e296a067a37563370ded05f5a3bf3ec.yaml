life_analogy:
- 想象 AI 是一个**技术高超但需要明确指令的米其林大厨**：
- '- **你（人类）** = 餐厅老板，负责餐厅定位、菜单设计和品控'
- '- **AI（大厨）** = 按订单执行烹饪，擅长但不负责决策'
- '- **提示词（Prompt）** = 你写给大厨的订单（食材、口味、摆盘）'
- '- **结构化提示词** = 标准化的订单模板，含身份、任务、约束'
- '- **上下文窗口** = 大厨的灶台容量，放不下整本菜单'
- '- **长文本分治** = 把满汉全席拆成一道道菜，分次下单'
- '- **迭代优化** = 试菜、反馈、调整，直到客人满意'
- 就像优秀的餐厅老板不需要自己颠勺，但必须懂品控与经营——AI 时代的核心竞争力不是写代码，而是给出正确指令与判断。
summary:
- concept: AI认知协作范式
  desc: 人与AI基于五步闭环协作，把AI当大脑延伸而非打字机
- concept: 人治AI
  desc: 人类负责审美、结构与判断，AI负责执行与生成
- concept: 结构化提示词
  desc: 用“身份-任务-约束”三要素让大模型输出工业级可控
- concept: 长文本分治策略
  desc: 切片、压缩、链式推理，突破上下文窗口限制
- concept: 上下文二次投喂
  desc: 保存投喂内容，需要时再输入，维持长程关联
- concept: 角色指令工程
  desc: 通过角色设定让大模型具备垂直领域专家能力
- concept: 分层指令工程
  desc: 续写/扩写/大纲控制，降低输出随机性
- concept: 自媒体SOP流水线
  desc: 热点锚定→爆款拆解→双角色协作写作→人工精修→发布
- concept: ControlNet
  desc: 精准控制生成过程的结构、姿态与构图
- concept: LoRA
  desc: 微调训练特定主体或风格的低秩适配技术
- concept: 声音克隆（So-VITS）
  desc: 零基础复现目标音色，但需要警惕版权风险
- concept: AI写作变现进化
  desc: 从卖劳务到卖模版/流量/品牌，实现收入跃迁
- concept: 私有化部署
  desc: 开源基座+高质量指令微调，满足ToB数据隐私刚需
- concept: 跟随者策略
  desc: 不做第一个吃螃蟹的人，做第一批吃螃蟹的人
- concept: ChatGPT Plugins
  desc: 能力增强型才有付费价值，导流型难以持续
- concept: 金税四期合规
  desc: 真实申报、三流合一，规避六大稽查雷区
- concept: 原生IP账号基建
  desc: 原生IP+实体卡+合规支付三位一体防封
- concept: 漫展AIGC创业
  desc: 场地分级+商演Live+AIGC周边+NPC志愿者
- concept: 认知杠杆思维
  desc: 用积累/消耗过滤器做决策，用信用换财富
- concept: 异常值案例库
  desc: 放弃MECE，收集边缘高收益案例激发灵感
exercises:
- 'no': 1
  title: 从“一键生成”到“认知外脑”的提示词重构
  contents:
  - 给定一个低质量 Prompt：“写一篇关于 AI 赚钱的文章”。
  - 1. 使用“身份-任务-约束”三要素，将其重构为一个结构化提示词
  - 2. 将任务拆解为至少 3 个步骤（如大纲→初稿→润色）
  - 3. 为每个步骤设计一条子 Prompt，说明人与 AI 的分工
  - 4. 说明你将如何通过迭代优化提升输出质量
  - 回答问题：
  - '- 为什么角色设定能显著提升输出质量？'
  - '- 如果任务涉及 100 页 PDF，你会如何设计分治策略？'
- 'no': 2
  title: 长文本分治实战：从切片到结构化摘要
  contents:
  - 自选一份 3000 字以上的行业报告或长文。
  - 1. 设计切片策略（每段约 500 字），标注切片边界依据
  - 2. 为每个切片设计摘要指令，并执行生成
  - 3. 将各切片摘要合并，生成一份 300 字的核心观点提炼
  - 4. 记录每一步的人机分工，形成可复用的 Prompt 模板
  - 回答问题：
  - '- 若上下文窗口为 4000 token，你如何确定切片大小？'
  - '- 切片边界如何避免信息断裂？合并时如何处理重复与冲突？'
- 'no': 3
  title: AI变现赛道选择与商业闭环设计
  contents:
  - 从以下赛道中任选一个：AI 绘图/头像定制、AI 写作/公众号、AI 声音克隆、AI 知识库/咨询。
  - 1. 用“需求-产品-流量-转化-交付”五环节画出商业闭环
  - 2. 指出该赛道的合规风险点（版权、隐私、平台规则）
  - 3. 设计一个可以用 AI 替代人工的交付环节，并说明边界
  - 4. 说明你将如何沉淀可复用的方法论资产
  - 回答问题：
  - '- 为什么“工具不值钱，解决方案值钱”？'
  - '- 在低粉丝量下，高客单价策略为何可能优于低客单价走量？'
- 'no': 4
  title: 认知协作范式复盘：重构你的一次 AI 使用经历
  contents:
  - 回顾你最近一次使用 AI 完成的任务（写文案、做图、写代码等）。
  - 1. 写出原流程，标注其问题（如随机性大、不可复用）
  - 2. 按“目标拆解→标准调研→方法论沉淀→结构化提示词→迭代优化”五步重构流程
  - 3. 产出至少 2 条可复用的 Prompt 模板
  - 4. 定义 AI 输出质量的验收标准（人审什么、AI 做什么）
  - 回答问题：
  - '- 如何判断 AI 输出是“垃圾放大器”还是“认知外脑”？'
  - '- 在哪些场景下“一键生成”反而有害？'
