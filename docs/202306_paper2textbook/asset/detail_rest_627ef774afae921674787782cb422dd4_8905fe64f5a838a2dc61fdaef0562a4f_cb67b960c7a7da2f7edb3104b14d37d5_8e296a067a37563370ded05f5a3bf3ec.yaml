learning_targets:
- 理解“认知协作范式”的核心定义，区分“AI 代工”与“AI 认知外脑”的本质差异
- 掌握结构化提示词工程的“身份-任务-约束”三要素与分层指令设计方法
- 能运用长文本分治策略（切片、压缩、链式推理）处理超长文档与复杂任务
- 了解 AI 绘图、AI 音频、AI 视频等可控生成技术栈的落地路径与边界
- 能根据自身禀赋与资源选择合适的 AI 变现赛道，并识别版权、财税、平台合规红线
- 建立“方法论沉淀-可复用资产”的复利意识，告别一次性输出
