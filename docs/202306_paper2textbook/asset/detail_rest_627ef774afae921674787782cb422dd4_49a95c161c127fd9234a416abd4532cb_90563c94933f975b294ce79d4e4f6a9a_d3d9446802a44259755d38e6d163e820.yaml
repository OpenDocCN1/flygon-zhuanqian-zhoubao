learning_targets:
- 理解同城流量垄断的底层逻辑：认知差即本地生意的护城河
- 掌握对标账号拆解复制法，降低初创期试错与认知成本
- 构建模板化内容生产 SOP，实现低成本稳定产出与持续获客
- 搭建美团+私域双轮驱动模型，实现公域获客与私域复购闭环
- 执行选址验证与成本控制铁律，确保实体门店选址不踩坑
- 识别餐饮初创五大核心错误与止损即盈利决策逻辑
- 通过棋牌室案例复制低成本无人化实体店的选址、合规与私域运营体系
concept_map:
- 同城流量垄断
- ├── 认知差即护城河
- │   └── 99.99%实体老板不懂线上流量，稍懂一点即可垄断方圆6公里 —— P159
- ├── 隐形同城账号
- │   └── 不进大众推荐池，仅服务本地精准客群 —— P159
- └── 低粉高变现
- └── 粉丝数≠商业价值，看精准到店转化 —— P161
- 对标账号拆解复制法
- ├── 同量级对标照抄
- │   ├── 投入成本、盈利水平、持续盈利能力、成功先例 —— P162
- │   └── 新开2-3个月且业绩突出的同行 —— P162
- └── 一比一照搬选题、拍摄、脚本、运营细节 —— P159
- 模板化内容生产SOP
- ├── 选题库、脚本结构、拍摄角度、剪辑节奏 —— P161
- ├── 稳定产出优于爆款博弈 —— P161
- └── 分级素材库与素材即弃机制 —— P288
- 选址验证与成本控制
- ├── 笨方法论：计步器统计人流、市政规划进合同、实测街区微观差异 —— P252
- ├── 成本控制铁律：月销<20单SKU强制清洗，房租占营收15%-20% —— P162
- ├── 正负面选址清单 —— P295
- └── 转化漏斗诊断：进店少=选址问题，买少=选品/定价问题 —— P294
- 美团+私域双轮驱动模型
- ├── 公域：美团/大众点评获新客 —— P237
- ├── 私域：体验群→充值会员群→合伙人群三层架构 —— P237
- └── 充值锁客、闲时激活、老带新裂变 —— P237
- 棋牌室实体运营
- ├── 合规红线：娱乐经营许可证、消防、公安备案，拒赌博功能 —— P237
- ├── 选址：住宅/城中村/写字楼周边，避校200米 —— P237
- ├── 美团权重优化：主图视频、引流单/利润单、好评返现 —— P165,P237
- └── 无人/少人化：智能门禁/灯控/监控，核心是运营精细度 —— P237
life_analogy:
- 想象同城流量垄断是一场**社区杂货铺的抢位游戏**：
- '- **认知差** = 只有你懂社区群聊怎么发红包引流，其他店主还守着柜台等客'
- '- **隐形同城账号** = 社区群里不在朋友圈刷屏，但每天被邻居私信问“老板在吗”的账号'
- '- **低粉高变现** = 群里就200个邻居，却每天有50人进店消费'
- 就像杂货铺不需要在全城出名，只需要在方圆500米内成为唯一被想起的店，同城流量垄断也只需在本地线上成为唯一被搜到的商家。
summary:
- concept: 同城流量垄断
  desc: 实体商家在方圆6公里内凭线上认知差独占本地曝光与获客红利的现象。
- concept: 隐形同城账号
  desc: 不进大众推荐池，仅精准触达本地客群的短视频账号。
- concept: 低粉高变现
  desc: 粉丝量与互动数据虽低，但因精准到店转化而变现能力极强。
- concept: 对标账号拆解复制法
  desc: 直接拆解同量级、同阶段、同区域同行的选题拍摄脚本运营细节并原样复制。
- concept: 模板化内容生产SOP
  desc: 将短视频制作标准化为固定模板，实现低时间投入、稳定产出、可复制。
- concept: 美团+私域双轮驱动模型
  desc: 美团公域获新客，私域充值卡锁客与裂变，降低CAC提升LTV。
- concept: 选址验证与成本控制
  desc: 用计步器、市政规划、街区实测量化选址，房租占营收15%-20%，月销<20单SKU强制清洗。
- concept: 止损即盈利
  desc: 结构性缺陷下无法突破盈亏平衡时，果断关店保护本金优于盲目坚持。
- concept: 棋牌室合规红线
  desc: 娱乐经营许可证、消防、公安备案缺一不可，软件严禁赌博功能。
exercises:
- 'no': 1
  title: 同城对标账号拆解实战
  contents:
  - 在你所在城市，找到一家同行业、新开2-3个月且业绩突出的实体门店短视频账号：
  - 1. 拆解该账号最近10条视频的选题、脚本结构、拍摄角度、剪辑节奏；
  - 2. 记录其发布频率、平均点赞、评论区IP分布；
  - 3. 结合自身门店优势，列出可直接照护的3个标准化动作。
  - 回答问题：
  - '- 该账号粉丝量与其月变现是否成正比？为什么？'
  - '- 如果直接照抄头部巨头的菜品/服务结构，会面临什么风险？'
- 'no': 2
  title: 门店选址数据实测练习
  contents:
  - 选择一家你计划开店或观察的门店位置，连续3天进行实测：
  - 1. 每天固定时段（早/中/晚）用计步器统计门前人流量；
  - 2. 查询市政规划，确认未来3个月是否有道路修缮或规划变动；
  - 3. 拍摄同街区左右两侧店铺的微观差异（门头显眼度、竞品密度）。
  - 回答问题：
  - '- 人流高峰时段与你目标客群到店时段是否重合？'
  - '- 房租预计占营收比例是否超过20%？'
- 'no': 3
  title: 模板化内容生产SOP拟定
  contents:
  - 为你的本地服务类门店（如眼镜店、餐饮、美业）设计一套短视频模板化SOP：
  - 1. 列出5个可复用的选题模板（如产品展示、到店理由、客户见证）；
  - 2. 固定脚本结构（钩子-卖点-信任背书-行动号召）；
  - 3. 规定拍摄角度与剪辑节奏，确保单条视频制作时间不超过30分钟。
  - 回答问题：
  - '- 日更稳定产出与追求单条爆款，对本地实体店哪个更重要？'
  - '- 平台去重算法升级后，纯模板化内容可能面临什么风险？如何应对？'
