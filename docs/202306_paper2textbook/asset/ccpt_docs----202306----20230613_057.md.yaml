desc: 该素材为一篇小红书饰品赛道代运营案例的简要宣传帖，作者声称在2022年4月至12月期间，投入客户资金20万元，通过代运营实现200万元收益，达成1000%回报率（ROI），并引导读者跳转飞书文档查看详细复盘内容。
concepts:
- name: 小红书饰品赛道代运营
  desc: 指在小红书平台上，针对饰品品类提供专业的账号运营、内容制作及流量转化服务，帮助商家实现销售增长的商业模式。
  is_original: false
  excerpt:
  - 小红书饰品赛道代运营回报率 1000%的复盘
- name: 投资回报率 (ROI) 1000%
  desc: 本案例的核量化指标，指代运营周期内，产出收益为投入成本的10倍（投入20万，产出200万）。
  is_original: true
  excerpt:
  - 客户给我 20w，我帮她赚了 200w 小红书饰品赛道代运营回报率 1000%的复盘
