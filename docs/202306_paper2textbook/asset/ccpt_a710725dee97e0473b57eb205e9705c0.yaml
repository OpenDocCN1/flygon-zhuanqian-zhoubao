theorems:
- name: 付费学习者成功概率论
  desc: '[claim] 付费学习者因具备更强执行力、对金钱与生活质量提升的渴望更强烈，因此比不付费学习者更容易成功。'
  excerpt:
  - 对于付费学习的人，其实我是非常尊重的。这一部分人，其实比不付费学习的人更容易成功，他们是一群执行力非常强劲的人，对金钱、对提高生活质量的渴望比那些不愿意前进的人更有希望成功。
- name: 创作者共情论
  desc: '[claim] 作者曾作为生财有术圈友同样经历过被割韭菜，基于同理心产出避坑指南与教程。'
  excerpt:
  - 我曾经也是这样的一名生财有术圈友，同样的也被割韭菜！
findings:
