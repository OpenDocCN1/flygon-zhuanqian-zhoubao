paper: docs/202306/20230627_134.md
desc: 该素材是一篇实战复盘文章，作者详细记录了从2015年初中时期接触QQ卡盟代理起步，历经群CPA、浏览号（人气号）运营，至2023年转型前积累2万+私域流量（16个千人群）的完整创业历程。核心揭示了利用学生群体对QQ名片赞、空间赞的虚荣/社交需求，结合‘多开群’技术、自动化框架插件（后自研插件）、话术裂变体系，实现低成本获客、多渠道变现（卖号、推广微商号、代刷网CPS）的完整商业闭环，以及应对腾讯风控（封号、封群、限制名片赞）的对抗博弈过程。
concepts:
- name: QQ浏览号/人气号
  desc: 指拥有几千好友、上千群、发说说浏览量达几千、点赞达千以上的高活跃QQ账号，是私域流量池的核心载体，分为小浏览和大浏览。
  is_original: false
  excerpt:
  - 每个 QQ 号有几千个好友左右，群大概有 1000 个以上，发一条说说大概有几千个人浏览，点赞一千到两千之间，这种就属于浏览号，也就是人气号。
  - 浏览号又分为小浏览和大浏览，小浏览发一条说说只有几百个人浏览，100+个人点赞这种又分为小浏览，大浏览几千几万都是有的
- name: 多开群技术
  desc: 非年费超会的QQ号通过技术手段‘卡’住20-30个2000人大群的能力，突破了官方群容量与数量限制，是早期规模化流量池构建的关键基础设施。
  is_original: true
  excerpt:
  - 就是一个 QQ 不是年费超级会员但可以卡 20-30 个 2k 人群
  - 我把赚的钱买了十几个多开群，有几个号里面只有五个 2k 群，有一两个号里面有十几个 2k 人群
- name: 框架插件/自动化机器人
  desc: 登录QQ协议模拟真人操作的自动化软件，配置话术后可实现关键词触发回复、自动加好友、自动拉群、定时群发等全托管运营，后期因官方打击转为自研私有插件。
  is_original: false
  excerpt:
  - 框架插件就相当于一个软件，登陆上 QQ 配置好话术，这个时候 QQ 就变成一个全自动是机器人了
  - 后面腾讯对这方面打击越来越严格，我们选择了找人写代码做出属于我们自己的插件
- name: 名片赞/空间赞需求
  desc: QQ学生用户群体核心的虚荣社交货币，对点赞数量有极高渴求且付费意愿强、成本低，是本案例所有引流裂变的核心诱饵。
  is_original: false
  excerpt:
  - 玩 QQ 空间的学生都很在意名片点赞量、空间说说的点赞量
  - 我们设置的话术内容都是以名片赞有关的，有人在群里发互赞，赞我空间，空间互赞等关键词
- name: 料子（解冻料）
  desc: 指利用一部手机配合特定资料（人脸/身份证信息）即可无限次解封冻结QQ号的灰产技术/资源包，是应对腾讯高频风控的生存手段。
  is_original: true
  excerpt:
  - 什么是料子？就是只要你有一部手机加上购买的资料就能无限解冻号码
  - 通过我们的不懈努力加坚持，再加上腾讯平台的慢慢松懈我们还是挺了过来
- name: 代刷网CPS分佣模式
  desc: 将代刷网（QQ业务批发平台）链接植入机器人话术与群公告，用户下单刷赞即获得佣金差价，实现流量睡后变现。
  is_original: false
  excerpt:
  - 挂代刷网吃佣金提成就类似于淘宝客一样，有人在平台下单我们赚差价
  - 哪怕到现在我已经完全转型，但我的群依然每天为我宣传着代 S 网网站
methods:
- name: __overview__
  desc: 全流程自动化私域构建体系：以‘名片赞’为钩子 -> 多开群承载流量 -> 框架插件自动化触达/裂变 -> 话术设计引导加好友/进群 -> 沉淀为浏览号/人气号
    -> 多元化变现（卖号/推广/CPS） -> 料子/自研插件对抗风控。
  excerpt:
  - 准备需要引流到私域的 QQ 号+框架插件，在配合上话术，在群里触发关键词达到引流的效果
  - 机器人就会在群里艾特对方自动回复我们设置好的的话术内容。加上好友后也会触发话术提醒对方我们已经送赞成功，并且告诉对方拉我进群还能继续获得更多名片赞
  - 我们找了熟人写代码制作插件，并且用起了那种不起眼的小框架，前前后后七八次为了修改完善插件也投入了 1w+
- name: 关键词触发式裂变话术设计
  desc: 设定‘互赞、赞我、空间互赞’等高频关键词，机器人自动@用户回复诱导话术 -> 引导加好友 -> 好友通过验证触发二次话术（送赞确认+引导拉群/进群）
    -> 进群触发三次话术（免费领赞+留存），形成完整转化漏斗。
  excerpt:
  - 有人在群里发互赞，赞我空间，空间互赞等关键词，机器人就会在群里艾特对方自动回复我们设置好的的话术内容。
  - 加上好友后也会触发话术提醒对方我们已经送赞成功，并且告诉对方拉我进群还能继续获得更多名片赞，到最后触发关键词时让对方进我们的互赞群，并且再次提醒对方进群还能免费领取名片赞。
- name: 存量群资源冷启动法
  desc: 利用历史积累的CPA旧群、名片赞群发布‘进群免费领名片赞’广告，零成本快速拉满首批种子用户群，解决冷启动难题。
  excerpt:
  - 我很庆幸我做了 cpa 积累了一些名片赞群，当我尝试这个新项目的时候，我直接在以前的老群里面宣传广告。
  - ［进×××××群免费领取名片赞]这个方法使我快速起步拉起了第一个互赞群
- name: 浏览号价值测算与定价标准
  desc: 通过发送测试说说，统计实际浏览量，按市场行情单价（0.4-0.5元/浏览）计算账号估值，建立标准化交易定价体系。
  excerpt:
  - 要通过发空间说说测试，比如一条说说有 5794 个浏览量，那么就是 5794×0.4=2317 元。
  - 一般情况下市场价是 0.4-0.5 一个浏览，一般我们要测试一下这个号价值多少钱。
theorems:
- name: 小众平台深耕红利论
  desc: 主流认知认为‘过时/学生’平台无商业价值，实则因竞争低、用户粘性高、需求单一易满足，深耕反而能建立高壁垒、高复购的私域护城河。
  excerpt:
  - 很多人都觉得 QQ 是学生玩的软件，挣不到很多钱，但只要有需求就会有变现的机会，再小都有可能。
  - 有人看不起 QQ，觉得 QQ 就是小学生玩的聊天软件，却不知道 QQ 让很多人的月收入达到几万甚至十几万
- name: 资源复利复用定律
  desc: 前期项目积累的账号、群、技术认知、人脉、渠道（多开群、老群、插件认知）均为可迁移资产，能以极低边际成本支撑后续新项目的冷启动与规模化。
  excerpt:
  - 这些东西在我做了 cpa 后我全都有且都了解。我很庆幸我做了 cpa 积累了一些名片赞群...我利用着以前做 CPA 的资源，迅速起了一批 QQ 号
  - 哪怕到现在我已经完全转型，但我的群依然每天为我宣传着代 S 网网站...这些流量还是属于我的
- name: 平台风控与运营对抗的非对称博弈
  desc: 平台风控（封号、限功能、封群）是常态，生存依赖‘技术迭代（自研插件/小框架）+ 灰产基建（料子/解封渠道）+ 策略调整（停工避险、分散风险）’的组合拳，而非单一战术。
  excerpt:
  - 框架问题我们是通过同行的知道了原来还是有在偷偷经营框架的作者...QQ 冻结我们是通过花钱自己购买料子来解冻
  - 我们就找了熟人写代码制作插件，并且用起了那种不起眼的小框架，前前后后七八次为了修改完善插件也投入了 1w+
- name: 单一核心钩子撬动全链路变现
  desc: 锁定用户最核心的单一高频刚需（名片赞），即可设计出覆盖获客、留存、裂变、变现全链路的标准化自动化流程，无需复杂产品设计。
  excerpt:
  - 我们设置的话术内容都是以名片赞有关的...机器人就会在群里艾特对方自动回复
  - 我们的变现方法有以下三种：第一，把浏览号 M 给市场上有需求的老板 第二，给微商老板推号 第三，挂自己的代刷网吃佣金提成
findings:
- name: 群CPA风口期单日收益验证
  desc: '[evidence] 作者亲历早期群CPA红利期，通过‘合伙人提供群+作者引流挂文件’模式，单日引流3个2000人群，日均收入100-150元，后因平台扣量、封群、合伙人踢人导致模式失效。'
  excerpt:
  - 我们一天引三个群，在群里挂上 cpa 文件，平均一天 100-150+收入
  - 平均 4 个小时满一个 2k 人群...cpa 平台扣量通知，觉得我们这些 QQ 群的质量太差...腾讯又打击 QQ 封群等各种问题，我们这个小圈子也就解散了
- name: 浏览号变现单账号估值实测
  desc: '[evidence] 实测单条说说浏览量5794，按0.4元/浏览计算，单号估值2317元；作者与合伙人各持有多个高权重号，月入2-3万元，印证‘卖号’模式高利润。'
  excerpt:
  - 比如一条说说有 5794 个浏览量，那么就是 5794×0.4=2317 元。那会两个号有接近 3000+
  - 通过这种变现方法给老板推广号我和我朋友的收入也大大的提升，他是一个月 3w+左右，我一个月 2w+左右
- name: 代刷网CPS睡后收入实测
  desc: '[evidence] 代刷网推广峰期日入300元，隔半月提现3000+；转型后闲置群依靠定时群发维持日入收益，每隔一段时间提现1000-2000元，验证流量资产长尾价值。'
  excerpt:
  - 代 S 网最高收入是 300 元一天，有那么一段时间是隔半个月左右就会提现 3000+
  - 代刷网每天正常收入，每隔一段时间都能提现 1000-2000，我也能当个零花钱使用
- name: 自动化裂变获客效率实测
  desc: '[evidence] 利用多开群资源（80+个2k群）配合自研插件，单号日增好友最低100+，峰值近2000，快速构建万人级私域池。'
  excerpt:
  - 我手里至少有十几个这种 QQ 号，我只需要一个流程，一点时间就能把这 80+个 2k 群引流满人
  - 那个时候每个号一天最少有 100 个人加好友，最高接近 2000 个人加好友
- name: 风控高压期生存成本测算
  desc: '[evidence] 最难时期日冻结20+次，市场解封价50元/次，自行购买‘料子’成本降至可控；自研插件迭代7-8版投入1万+；最终因名片赞功能限流（日刷量从十几万降至100-200）及框架即挂即冻，项目彻底不可行。'
  excerpt:
  - 最难的时候是一天冻结高达 20 几次...市场上的解 QQ 号的最高价格是 50 元一个号...我们刚开始想到的办法是去群里找学生帮忙解，解成功一个 20
    元，15 元
  - 前前后后七八次为了修改完善插件也投入了 1w+
  - 目前名片赞因腾讯限制已经很难恢复到以前的速度了，以前一个号一天刷十几万都不是问题，现在刷 100-200 都要一天甚至更长时间
- name: 私域流量资产长尾存续验证
  desc: '[evidence] 项目停止运营、作者转型后，手中16个千人群仍存活，说说浏览稳定1000+，代刷网仍有收益，新项目启动时可直接调用群资源冷启动，验证‘私域即资产’特性。'
  excerpt:
  - 目前手里是还有 16 个群左右每个群最低还有 1000 人。我转型了别的项目但我的群仍然还在正常运行
  - 我发个说说 QQ 浏览量还是稳定在 1000+...当我研究了新的项目需要用到人的时候往群里艾特个全体成员...实操起来只会更加简便
