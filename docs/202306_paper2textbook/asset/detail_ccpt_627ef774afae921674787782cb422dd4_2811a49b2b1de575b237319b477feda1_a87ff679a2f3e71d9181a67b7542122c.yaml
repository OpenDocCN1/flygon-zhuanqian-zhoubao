units:
- 'no': 1
  name: 电子产品套利 —— 让补贴价差变成口袋钱
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人缺乏选品运营经验，自研电商选品风险极高'
  - '- 需要一个低抢购门槛、确定性收益的副业切入点'
  - '- 传统打工收入天花板低，亟需零售层面的信息差套利'
  - '**核心定义**'
  - '- 利用京东/淘宝/拼多多“百亿补贴”价格低于第三方回收商收购价的正向价差，下单新品转卖给回收商赚取差价'
  - '**关键性质**'
  - '- 确定性收益：下单即锁定利润，无需靠手速抢购'
  - '- 资金占用高：单台资金占用 5000-12000 元，周转周期一周内'
  - '- 平台依赖：账号权重（养号）直接决定下单成功率'
  - '**典型例子**'
  - '- iPhone 14 Pro Max 256G：回收价 8178 元，百亿补贴实付 7678 元，单笔利润 500 元'
  - '**边界条件**'
  - '- 账号被风控（黑号）后，高利润商品将无法下单，需通过正常养号恢复'
  - '- 大促期（如 618）补贴力度加大，价差扩大，利润增厚'
  sources:
  - paper: docs/202306/20230613_079.md
    role: origin
  excerpts:
  - “百亿补贴就是会比普通网上售卖更便宜……这种不像演唱会，不像其他的东西，需要靠抢，抢到了才有利润，这种是随便下单，只要下单了就有利润”
  - “以 iPhone 14 Pro Max 256G 为例，6.1 日回收价为 8178，淘宝百亿补贴内实际下单金额为 7678，那么 8178-7678=500
    元”
  - “一般来情况下来说平均利润在是在 300 元左右/单，资金占用 5000-12000 元/台，算上下单、到货、转寄到结款，一周之内就可以搞定”
  - “黑号”并不是代表你不能使用这个账号，平常购物还是可以使用的，只是在有利润的特定商品上会显示没货，或者显示前方下单人数过多，请稍后再试”
- 'no': 2
  name: 选址决定生死 —— 让门店自带“自然流量曝光”
  points:
  - '**为什么需要这个概念？**'
  - '- 99%的实体老板不懂线上流量，却高度依赖营销，导致“裸奔”经营'
  - '- 传统认知中“开店装修>选址”，忽略了物理位置对客流的决定性作用'
  - '- 营销只能优化转化，无法创造不存在的自然流量'
  - '**核心定义**'
  - '- 自然流量曝光：指实体门店因优越地理位置（临街门面、商场通道）自带的、无需付费推广即可获得的目标客群曝光'
  - '**关键性质**'
  - '- 选址边际收益远超同等投入的线上营销'
  - '- 成人用品店需平衡“高流量”与“高隐私”，首选社区、快捷酒店、城中村非主干道'
  - '- 舞蹈工作室从写字楼11层搬至商场2层通道，租金上涨但自然曝光质变，支撑预售转化'
  - '**典型例子**'
  - '- 作者舞蹈室新店投资60万，开业前通过限量50席预售年卡回笼25万现金流，覆盖运营成本'
  - '**边界条件**'
  - '- 选址是前置条件，不存在“运营挽救选址”的可能'
  - '- 主干道或显眼角落虽流量大，但成人用品店等隐私品类会造成顾客心理负担'
  sources:
  - paper: docs/202306/20230613_252.md
    role: origin
  - paper: docs/202306/20230613_294.md
    role: improve
  - paper: docs/202306/20230613_295.md
    role: apply
  excerpts:
  - “你不要看到很多案例，看到他们通过各种自媒体和线上的营销方法获取了流量就觉得很高级，真正的旺铺从来没有藏在写字楼里的”
  - “自然流量的曝光才是实体门店的利器。位置好才是王道。”
  - “新店开业，最好在预售的时候就把所有成本全部 cover 掉，极端一点，只要能覆盖了运营成本，我接着可以立刻再去开新店”
  - “尽量不要开在主干道，或者是特别显眼的地方……毕竟买这些产品的人，被别人看见还是会觉得不好意思的”
- 'no': 3
  name: 低粉高变现 —— 让精准流量“反向锤炼”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人误信“大流量才能赚钱”，陷入刷粉内卷，忽视同城精准流量的高转化价值'
  - '- 本地服务型商家（如旅拍摄影师）不需要百万粉丝，只需要同城精准客群'
  - '- 营销成本高企下，需降低获客门槛，提升单位流量价值'
  - '**核心定义**'
  - '- 低粉高变现：在粉丝基数较小（如千粉量级）的情况下，通过精准定位和高客单价服务转化，实现可观商业收入的模式'
  - '**关键性质**'
  - '- 同城精准流量商业价值远高于泛娱乐流量'
  - '- 核心在于转化率而非流量池大小'
  - '- 需搭建“高价值定位+账号四件套+五维内容矩阵+引流钩子”全链路'
  - '**典型例子**'
  - '- 全职本地旅拍摄影师“荷娜”：粉丝1000+，月收入近万元，涨粉2-3个月即达成'
  - '**边界条件**'
  - '- 受限于同城本地市场，规模上限低于全国性电商'
  - '- 内容必须覆盖“信任建立-需求激发-决策促成”全链路，单一发片不足以成交'
  sources:
  - paper: docs/202306/20230613_289.md
    role: origin
  excerpts:
  - “低粉高变现：旅拍独立摄影师小红书引流，每月收入近万元”
  - “虽受限于同城本地的精准流量，涨粉 1000+，每月收入近万元”
  - “这是一个普通人在小红书找到自己的新生态位，新的商业变现”
- 'no': 4
  name: 无人店选址风向标 —— 用热力图“丈量”门店生死
  points:
  - '**为什么需要这个概念？**'
  - '- 成人用品无人店加盟模式存在高额开户费、虚高进货价等隐形坑位，新人易被割韭菜'
  - '- 缺乏科学选址方法，凭感觉选店直接导致经营失败'
  - '- 需要低成本、可复制的选址工具包以降低试错风险'
  - '**核心定义**'
  - '- 选址风向标工具包：百度热力图判断热度、地图同业分布拦截动线、贝壳找房判断消费实力、链家顾问获取楼盘入驻情报的组合拳'
  - '**关键性质**'
  - '- 选址直接决定无人店生死与盈利上限，不存在“运营挽救选址”'
  - '- 竞品垃圾箱包装可反推客群真实偏好，作为进货决策依据'
  - '- 二手机器性价比高，残值保留，适合新人低成本试错'
  - '**典型例子**'
  - '- 某成人用品加盟品牌选店：先用百度热力图选区域，再骑共享单车实地巡查可租铺面'
  - '**边界条件**'
  - '- 二手设备涉及过户手续繁琐、售后无保障，新手需权衡价差与时间成本'
  - '- 虚拟定位、群控引流属灰产手段，合规风险高，不可长期依赖'
  sources:
  - paper: docs/202306/20230613_294.md
    role: origin
  excerpts:
  - “门店选址-百度地图热力图，判断热门区域；竞争分析-地图模式同业商家分布，设置拦截动线”
  - “你看他的垃圾箱，一般人买成人用品都会把盒子拆下来留在这里，只拿东西走。你可以看出这周围的人喜欢买什么样的商品”
  - “买二手机器最大的好处是性价比高，比如你买一套二手机器 3000 以内，假如那天你不做了，还可以卖 1000 到 2000”
