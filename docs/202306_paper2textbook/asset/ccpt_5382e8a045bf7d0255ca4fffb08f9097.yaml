paper: docs/202306/20230613_244.md
desc: 该素材是一篇生财有术社群内的精华帖分享，作者麦子介绍其通过线上APP拉新项目实现零成本、半自动化月入过万的副业实操经验，强调项目选择不如执行重要，且指出拉新玩法需随平台活动变化而迭代，同时在评论区补充了变现闭环（佣金结算方式）和渠道获取建议。
concepts:
- name: 线上APP拉新
  desc: 指通过互联网渠道而非线下地推，引导新用户下载注册APP以获取平台佣金奖励的获客模式。
  is_original: false
  excerpt:
  - 通过线上 APP 拉新 0 成本实现半自动躺赚过万
  - 前两年地推拉新火爆圈子，而如今为何做的人越来越少了呢？...希望通过我的一点点线上 APP 拉新的实操分享
- name: 半自动躺赚
  desc: 指搭建自动化流程（如自动发单、自动审核、自动结算）后，仅需少量人工维护即可持续产生收益的运营状态。
  is_original: true
  excerpt:
  - 0 成本实现半自动躺赚过万
- name: 项目迭代论
  desc: 核心观点认为项目本身不变，但玩法需随平台规则、市场环境持续迭代，深耕者通过调整玩法持续盈利。
  is_original: true
  excerpt:
  - 其实项目不变，玩法可能一直再改变
- name: 佣金结算模式
  desc: 拉新成功后的变现闭环，包括平台直接结算佣金或团队长向推广者转账（适合兼职人群）等多种方式。
  is_original: false
  excerpt:
  - 拉新成功，可以直接给客户转钱
  - 这种适合兼职人群，不同的人群需要的不一样
methods:
- name: __overview__
  desc: 整体方法论：选定赛道（线上拉新）-> 搭建半自动化流程（工具/渠道）-> 根据平台活动周期调整玩法（迭代）-> 灵活结算佣金实现变现闭环。
  excerpt:
  - 先开始再说
  - 项目不变，玩法可能一直再改变
  - 拉新成功，可以直接给客户转钱...适合兼职人群
- name: 渠道获取法
  desc: 利用社群内部资源对接板块、历史精华帖搜寻可用的拉新平台渠道及一手渠道商信息。
  excerpt:
  - 自己可以在资源对接里面找找，记得有人分享过
theorems:
- name: 行动优于选择原则
  desc: 引用亦仁观点：副业项目不必过度筛选，随便选一个先开始执行，终点往往不是起点，执行过程中迭代方向更关键。
  excerpt:
  - 亦仁大佬曾说过关于副业项目如何选择的问题？他的回答是随便选一个，先开始就行，反正终点都不是最开始选的。
- name: 深耕迭代生存法则
  desc: 赛道红利消退（如地推减少）不代表项目死亡，而是筛选出深耕者，通过持续迭代玩法（线上化、自动化）维持收益。
  excerpt:
  - 前两年地推拉新火爆圈子，而如今为何做的人越来越少了呢？...其实项目不变，玩法可能一直再改变，希望通过我的一点点线上 APP 拉新的实操分享，继续激起大家对于拉新的热潮！
findings:
- name: 平台活动周期性影响收益
  desc: '[evidence] 作者实测快手拉新收益强相关平台官方活动周期，活动期间有佣金，活动停止基本无单可做。'
  excerpt:
  - 快手做活动的时候有，活动停止基本就没有了
- name: 线下拉新存量仍存
  desc: '[claim] 作者宣称线下地推拉新目前仍有大量从业者，未完全歇业。'
  excerpt:
  - 线下的还有很多的
- name: 社群资源对接为高效获渠道径
  desc: '[evidence] 作者建议新人通过社群“资源对接”板块检索历史分享获取一手渠道，而非盲目外部搜索。'
  excerpt:
  - 自己可以在资源对接里面找找，记得有人分享过
