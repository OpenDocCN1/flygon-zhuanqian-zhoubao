  name: 微信风控与RPA模拟人工 —— 侵入式工具必死，模拟人工是当前最优解
  points:
  - '**为什么需要这个概念？**'
  - '- 微信近期加强私域风控，大量个人微信封号，Wetool等侵入式营销工具全面失效'
  - '- 需要一种相对安全的过渡方案替代侵入式自动化工具'
  - '**核心定义**'
  - '- 微信风控与RPA模拟人工：基于无障碍服务、UIAutomator、RPA等技术在操作系统层面模拟人类手指点击、滑屏、输入等物理行为，实现非侵入式自动化'
  - '**关键性质**'
  - '- 行为特征与真人高度一致，安全级别最高'
  - '- 会占用屏幕资源，自动化效率低于侵入式软件'
  - '**典型例子**'
  - '- 群发无忧（qunfa51.cn）作为当前基于模拟人工技术路线、安全性最高的群发工具替代方案'
  - '**边界条件**'
  - '- 微信可通过大数据分析识别模拟人工操作，长期仍面临风控风险'
  - '- iOS与Android微信原生群发助手存在系统性功能差异（iOS独占朋友圈置顶，Android支持标签群发可超200人）'
  - '...'
  sources:
  - paper: docs/202306/SswzdpTECoTtaBxuCrdc5mninZd.md
    role: origin
  excerpts:
  - 最近微信私域的安全升级，导致一大波个微用户私域受到影响，这是一个异常值。而存在异常值的地方，就存在流量和价值机会。
  - Wetool这种依赖微信客户端侵入式的工具……侵入式的工具的原理就是调用微信客户端的进程端口，然后达到一些群发、批量自动化的一些操作。
  - 那就是模拟人工在屏幕点击的一些自动化技术，比如RPA在浏览器上模拟用户点击操作，比如在手机屏幕上模拟人工点击操作，从而自动化。
  - 用iOS和Android做私域，有个很细节的私域功能：1. 朋友圈置顶功能，仅支持iOS版本……2. Android不支持朋友圈置顶，Android版本的群发助手才有标签功能，一次群发可以超过200人
