units:
- 'no': 1
  name: 海外圈友线下组局 —— 把茶局变成信息套利局
  points:
  - '**为什么需要这个概念？**'
  - '- 全球经济下行导致海外创业者孤立，单打独斗生存率极低'
  - '- 线下聚会可通过跨行业信息碰撞获取高价值认知'
  - '- 低成本创业需依赖高信任度社群进行资源互换与情报对称'
  - '**核心定义**'
  - '- 海外圈友线下组局：社区在海外发起的首次线下跨行业交流活动，以''方桌会议''形式聚焦ChatGPT与Web3创业机会，强调低成本创业、跨行业头脑风暴及信任建立'
  - '**关键性质**'
  - '- 高粘性与延时效应：原定3小时实际持续5小时，参与者依依不舍'
  - '- 跨行业碰撞产生增量价值：汽车软件、文学、Web3、贸易、电商五大异质背景深度对话'
  - '**典型例子**'
  - '- 生财有术第7期日本站首次线下茶局，5位圈友围绕ChatGPT、Web3、跨境电商等主题深度交流'
  - '**边界条件**'
  - '- 场地限制导致规模受限，需引入娱乐活动（如K歌）破冰'
  - '- 素材拍摄与脚本设计准备不足，首次场次组织粗糙'
  - '...'
  sources:
  - paper: docs/202306/20230613_247.md
    role: origin
  excerpts:
  - 本次主题组局也是生财海外的首次践行。
  - 活动将关注如何在这两个领域中在日本市场取得成功，主要以探讨可能性为主。
  - 收获：众多圈友，特别是海外圈友，内心很期望有更多的线下聚会机会
  - 原定是从 13:00~16:00,但大家一直聊到 18 点才依依不舍的散去。
- 'no': 2
  name: Web3合规离岸运营 —— 在新加坡/美国'挂牌'，在日本'做生意'
  points:
  - '**为什么需要这个概念？**'
  - '- 日本法律限制直接在本地注册Web3相关公司成本高、不划算'
  - '- 需要一种合规路径规避本地监管门槛，同时开展跨境业务'
  - '**核心定义**'
  - '- Web3合规离岸运营：在美国和新加坡注册主体，在日本开展相关业务，借鉴港股打新经验进行项目筛选'
  - '**关键性质**'
  - '- 离岸注册降低日本本地注册合规成本'
  - '- 项目筛选可迁移港股打新逻辑（资质审核、资金门槛、分配机制）'
  - '**典型例子**'
  - '- 在日本做Web3业务的很多公司，都是在美国和新加坡注册公司在日本开展相关业务'
  - '**边界条件**'
  - '- 当地开展业务需先搞明白法律红线，中国合规合法的在日本不一定合规'
  - '- 日本行业协会较多，以企业抱团制定价格为核心，轻易不要打价格战'
  - '...'
  sources:
  - paper: docs/202306/20230613_247.md
    role: origin
  excerpts:
  - 日本目前由于法律限制直接在本地注册 web3 相关公司成本高不划算
  - 在日本做 web3 业务的很多公司模式，都是在美国和新加坡注册公司在日本开展相关业务
  - 币圈的打法很多都和港股打新类似，可借鉴可迁移
  - 首先要搞明白法律红线在哪里，中国合规合法的在日本不一定，日本合规合法的在中国也是
- 'no': 3
  name: 微信小程序跨境闭环 —— 让日元、人民币、物流三方共赢
  points:
  - '**为什么需要这个概念？**'
  - '- 中日跨境电商痛点在于支付手段（日本供货商想直接拿日元）'
  - '- 中国购买者希望以低于日本市场价的价格拿到日本直邮货物'
  - '- 需要一个统一前端同时解决触达、支付、履约三大问题'
  - '**核心定义**'
  - '- 微信小程序跨境闭环：利用微信小程序作为统一交易前端，对接日本供货商、中国购买者、物流中转站，构建三方共赢模型'
  - '**关键性质**'
  - '- 解决日本供货商无法按中国方法打开中国市场、触达中国用户的问题'
  - '- 满足中国购买者低于日本市场价获取日本直邮货物的需求'
  - '**典型例子**'
  - '- 中日跨境电商中，微信小程序连接供货商、购买者、物流中转站实现三赢'
  - '**边界条件**'
  - '- 需解决跨境支付合规与物流时效问题'
  - '- 依赖微信生态用户基数与小程序稳定性'
  - '...'
  sources:
  - paper: docs/202306/20230613_247.md
    role: origin
  excerpts:
  - 中日跨境电商的痛点难点在于，支付手段（日本供货商想直接拿日元）
  - 用微信小程序解决了以上问题，供货商，购买者，物流中转站三赢
  - 日本供货商，苦于不能按照中国的方法打开中国市场，触达在中国的用户
  - 在中国的购买者，需求点在于以低于日本市场价的价格拿到日本直邮的货物
- 'no': 4
  name: ChatGPT+实体机器人 —— 语言AI与硬件结合的下一个风口
  points:
  - '**为什么需要这个概念？**'
  - '- 当前语言生成AI性能已飞跃式提升，纯软件赛道趋于饱和'
  - '- 下一个商业风口在于AI与硬件结合，即具身智能方向'
  - '**核心定义**'
  - '- ChatGPT+实体机器人：将语言生成AI与实体硬件结合，形成具身智能商业应用'
  - '**关键性质**'
  - '- 企业级应用必须通过输入手册规范化实现数据合规，否则无法通过安审'
  - '- 规范化输入指令可物理隔离核心技术与客户信息'
  - '**典型例子**'
  - '- 制定业务使用输入手册，规范使用以解决客户信息及核心技术泄露问题'
  - '**边界条件**'
  - '- 需解决数据泄露与合规审核风险'
  - '- 硬件集成成本与技术门槛较高'
  - '...'
  sources:
  - paper: docs/202306/20230613_247.md
    role: origin
  excerpts:
  - 当前的语言生成 AI 性能得到了飞跃式的提升，下一个风口是与硬件做结合（ChatGPT+实体机器人）
  - 制定好业务使用输入手册，规范使用就能解决掉客户信息以及核心技术泄露问题
- 'no': 5
  name: 日本商业文化'先稳后快' —— 风险规避优先于速度
  points:
  - '**为什么需要这个概念？**'
  - '- 中国做生意讲求快，但在日本与当地人做生意首先要稳'
  - '- 日本行业协会较多，以企业抱团制定价格为核心，轻易打价格战会触犯行业红线'
  - '**核心定义**'
  - '- 日本商业文化''先稳后快''：进入日本市场前优先排查法律红线，识别中日合规差异，避开行业协会定价陷阱，拒绝价格战'
  - '**关键性质**'
  - '- 法律红线优先于商业模式创新'
  - '- 信任建立优先于业务速度'
  - '**典型例子**'
  - '- 中国合规合法的在日本不一定合规，日本合规合法的在中国也是'
  - '**边界条件**'
  - '- 需深入了解日本行业协会定价机制，避免破坏行业秩序'
  - '- 合规红线具有双向差异性，需分别排查中日法规'
  - '...'
  sources:
  - paper: docs/202306/20230613_247.md
    role: origin
  excerpts:
  - 在中国做生意要的就是快，但在日本和当地人做生意首先要稳
  - 日本行业协会比较多，以企业抱团制定价格为核心，所以轻易不要打价格战
  - 首先要搞明白法律红线在哪里，中国合规合法的在日本不一定，日本合规合法的在中国也是
- 'no': 6
  name: 00后留学生'兴趣变现'画像 —— 泡着互联网长大的跨境桥头堡
  points:
  - '**为什么需要这个概念？**'
  - '- 新生代留学生具备互联网原住民优势，对互联网保持开放心态'
  - '- 肯为知识付费，以爱好兴趣为导向，大学期即具备商业变现意识'
  - '- 可作为连接中日市场、测试Web3/AI新产品的种子用户群体'
  - '**核心定义**'
  - '- 00后留学生''兴趣变现''画像：00后为主的留学生群体，泡着互联网长大，肯为知识付费，以爱好兴趣为导向，大学时期就热爱搞钱'
  - '**关键性质**'
  - '- 付费意愿强，兴趣驱动变现早'
  - '- 具备跨文化沟通与数字化原生能力'
  - '**典型例子**'
  - '- 可作为连接中日市场、测试Web3/AI新产品的种子用户群体'
  - '**边界条件**'
  - '- 群体规模相对有限，需精准定位兴趣垂直领域'
  - '- 变现路径需与留学身份合规边界匹配'
  - '...'
  sources:
  - paper: docs/202306/20230613_247.md
    role: origin
  excerpts:
  - 新留学生群体的特点，00 后为主的留学生群体泡着互联网长大对互联网保持开放心态
  - 肯为知识付费，以爱好兴趣为导向，大学时期就热爱搞钱
- 'no': 7
  name: 视频号定制品带货 —— 用'先下单后备注'跑通非标变现
  points:
  - '**为什么需要这个概念？**'
  - '- 定制品信息收集繁琐，用户操作困难，直播间高并发下主播回复不及时导致流失'
  - '- 视频号小店链接审核未通过时无法直接挂车下单'
  - '- 需一套低成本、高转化的定制品变现链路'
  - '**核心定义**'
  - '- 视频号定制品带货模式：利用视频号短视频/直播流量，销售需个性化刻字/定制的非标品（如黑檀木吊坠），通过私域或视频号小店承接订单，由供应链代发的轻资产电商模式'
  - '**关键性质**'
  - '- 轻资产模式，无需囤货，供应链代发'
  - '- 非标品定价权强，客单价较高（88元一对/128元三块）'
  - '**典型例子**'
  - '- 黑檀木定制吊坠，七天销售额九万多，佣金三万五'
  - '**边界条件**'
  - '- 刻字信息过复杂（身份、姓名、生肖、八字）易导致评分低、被举报、账号限流'
  - '- 客户原因（备忘错/不备忘）导致的问题厂家不处理，需自掏腰包补发维护账号权重'
  - '...'
  sources:
  - paper: docs/202306/AHYMdjjtrosYPYxcfVZcau6Lnkc.md
    role: origin
  excerpts:
  - 二月份我是怎么通过视频号定制品，一周销售额九万多，佣金三万五的
  - 灵机一动，把流程反过来了，教用户先下单再教怎么备注刻字
  - 先不要点购物车，我们分两步走，先下单，再刻字
  - 涉及到的刻字内容太多，身份姓名出生生肖，两个人八个内容，商品因为评分低下架了
  - 90%出单是夫妻款
- 'no': 8
  name: 知识星球内容实时推送机器人 —— 懒人驱动的信息差自动化
  points:
  - '**为什么需要这个概念？**'
  - '- 上班无暇查看知识星球，下班补看效率低，总感觉错过几个亿'
  - '- 需要将知识星球指定分类内容自动抓取并推送至个人微信，解决信息获取滞后问题'
  - '**核心定义**'
  - '- 知识星球内容实时推送机器人：一种将知识星球指定分类内容（最新话题、风向标）自动抓取并通过企业微信群机器人实时推送至个人微信的轻量级自动化工具'
  - '**关键性质**'
  - '- 支持Linux和Windows部署使用'
  - '- 配置采用INI文件与Cron表达式，无需公众号认证门槛'
  - '**典型例子**'
  - '- 平常上班时间忙，下班到家去翻历史内容，通过机器人提前推送最新消息与风向标'
  - '**边界条件**'
  - '- 暂时没有做扫码登录，需手动登录电脑端获取Cookie，长期运行需定期人工更新'
  - '- 依赖知识星球非官方API，存在接口失效风险'
  - '...'
  sources:
  - paper: docs/202306/BNZsd608eoQZffxlFzccXVVmnbb.md
    role: origin
  excerpts:
  - 想做一个实时推送的群聊机器人，将生财每天的更新帖子推送到个人微信
  - 已经支持最新消息和风向标群通知
  - 平常上班时间忙，然后下班到家去翻历史内容，总感觉好像错过了几个亿似的
  - 暂时没有做扫码登录，目前需要手动登录电脑端知识星球获取cookie
- 'no': 9
  name: 抖音SEO —— 热门词优先与合集权重叠加
  points:
  - '**为什么需要这个概念？**'
  - '- 抖音核心还是推荐流量，搜索流量相对较少，布局冷门词无意义'
  - '- 搜索流量精准度高，转化价值大，适合商业变现'
  - '**核心定义**'
  - '- 抖音SEO：通过选热门词、重合集权重、多维度踩词布局、豆荚辅助数据权重、持续维护更新，实现长期精准搜索流量获取'
  - '**关键性质**'
  - '- 合集名称踩词权重极高，数据累积性强'
  - '- 标题多重叠加踩词优于标题可读性'
  - '**典型例子**'
  - '- 首次布局即排第一，50万播放中28万来自搜索，占比56%'
  - '**边界条件**'
  - '- 排名衰减由时间周期与竞品超越两大因子驱动'
  - '- 蓝V账号搜索排名天然优势，普通账号需持续维护'
  - '...'
  sources:
  - paper: docs/202306/CgDFdeYEpoAAWFxjhC0cjtcOnLf.md
    role: origin
  excerpts:
  - 大家一定要记住，在抖音布词，一定要选择热门词。虽然说抖音的流量很庞大，但是他的核心还是推荐流量，搜索流量相对会少很多。
  - 要学会利用合集，合集名称一定要踩词，这是抖音SEO的核心。合集在SEO的权重是比较高的，因为合集的数据会叠加。
  - 这是我第一次真正在抖音去布局SEO……让我惊喜的是，第一次布词，就排在了第一位。
  - 掉排名的原因有两点：1.时间周期 新发布的内容肯定比老内容搜索权重高……2.被后来者超越了
- 'no': 10
  name: 微信问一问 —— 视频号冷启动的高性价比流量入口
  points:
  - '**为什么需要这个概念？**'
  - '- 视频号冷启动难，传统运营成本高'
  - '- 微信问一问作为微信搜一搜团队推出的UGC问答社区，优质回答可获首页推荐与搜一搜首条曝光'
  - '- 视频号视频回答还可为视频带来新增曝光，是吸引粉丝的新渠道'
  - '**核心定义**'
  - '- 微信问一问：融合知乎深度与小红书短平快调性的问答产品，优质回答可获双重曝光（问一问首页+搜一搜），支持视频号视频挂载引流'
  - '**关键性质**'
  - '- 内容垂直度是变现闭环的前置条件'
  - '- 通用大模型需领域知识注入才能胜任专业创作任务'
  - '**典型例子**'
  - '- 回答10个问题（耗时20-40分钟），获得视频号点赞100+、粉丝增长近10人'
  - '**边界条件**'
  - '- 未投喂的模型输出无法通过平台审核，需投喂平台规则与案例'
  - '- 流量获取仅为第一步，需垂直领域持续输出才能连接后端产品'
  - '...'
  sources:
  - paper: docs/202306/DyNYdmVkAodKlZxA2Qacr9gFnTf.md
    role: origin
  - paper: docs/202306/JcEEdG3REoCSaVx079Dc8EoznXb.md
    role: improve
  excerpts:
  - 在问一问里首页，用户可以看到我们为你推荐的优质有趣的问答……优质的答案，除了在问一问首页被推荐，还会在用户搜索相关问题时进行展现
  - 如果你使用视频号视频来回答问题，还会为视频带来新增的曝光
  - 我看到好多人都在反馈，问一问提问之后，都提示审核不通过……从ChatGPT 复制过来的文字，审核都通不过。
  - 你有产品，视频号的下方挂载公众号的链接，等等都是变现的方式……先把流量搞起来，内容尽量垂直。
- 'no': 11
  name: 婚姻即创业项目 —— 赚钱圈子作为婚恋匹配场
  points:
  - '**为什么需要这个概念？**'
  - '- 人一生自然认识的人数极有限（约2000人），靠缘分在自然社交圈层寻找伴侣流量池太小'
  - '- 依赖平台算法推荐的泛相亲平台筛选成本高，三观不合概率高'
  - '- 需主动利用高门槛付费成长社群作为精准婚恋流量池'
  - '**核心定义**'
  - '- 婚姻即创业项目：将婚姻选择视为人生中最重要的创业项目，利用赚钱圈子（如生财有术）作为寻找伴侣的高质量流量池，核心观点是''找到对象抵得过3次创业成功'''
  - '**关键性质**'
  - '- 圈层同频共振：同一付费圈层个体天然具备渴望上进、愿为价值买单、有共同话题三大共性'
  - '- 降低筛选成本：大幅减少''圈子融不进''''三观不合''的筛选与磨合成本'
  - '**典型例子**'
  - '- 作者通过发动社交淘客团队力量发征婚帖，仅一周即通过介绍认识现任伴侣'
  - '**边界条件**'
  - '- 需主动出击，不能被动等缘分'
