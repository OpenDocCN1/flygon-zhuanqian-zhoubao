paper: docs/202306/20230613_109.md
desc: 该素材基于作者参加“风向标航海”实战训练营的复盘，提出生财的核心路径是“先成为达人，再匹配项目”。核心主张包括：1. 项目成功取决于个人能力（达人属性）与项目方向的组合，个人积累（广义/狭义阅读量、基础技能）比单纯寻找风口更重要；2.
  将阅读量划分为构建认知框架的广义阅读和实现项目复盘验证的狭义阅读，主张“先胜而后战”；3. 生财方向应源于个体独特禀赋与阅读积累的“内生”而非外部风口的“外求”，并总结出“广义阅读-狭义阅读-基础技能”三步走的实操方法论。
concepts:
- name: 达人优先原则
  desc: 指在项目落地前，优先构建个人核心能力模型（如戏精人设、拍摄剪辑等项目无关的基础技能），成为垂直领域的达人，再匹配具体项目，而非先找项目再补能力。
  is_original: true
  excerpt:
  - 相比于是否挖掘到好项目，成为一个达人是更为重要的。
  - 先具备 5 条边、先成为一个达人，这事本身是项目无关的，是比项目本身更为重要的。
- name: 六边形战士模型
  desc: 将项目成功拆解为个人5种核心能力（达人属性）+ 1个项目方向的组合模型，强调个人能力边际收益递增，项目仅为能力变现的载体。
  is_original: true
  excerpt:
  - 这个人本身具有了 5 种能力，配合上项目那一条，最终组合成了六边形战士。
  - 人的积累 戏精、基础技能 拍摄 / 平台 小红书或者抖音、带餐饮券或者带货 / 后两项是项目方向，前两项是个人日常积累。
- name: 广义阅读量
  desc: 指跨学科、跨历史、跨文明的泛读积累，旨在构建认知底座、搭建知识框架、理解世事人情与进化规律，为专业学习和决策提供多视角支撑。
  is_original: false
  excerpt:
  - 广义阅读量，随便看什么书，看个几十本、几百本、上千本，自然对世事人情、人间百态有更多的了解。
  - 站在历史的视角、站在中外的视角、站在进化的视角、站在各学科的视角、站在圣贤的视角、站在伟人的视角。
- name: 狭义阅读量
  desc: 指针对特定赚钱项目、生财方向进行的高强度、全方位资料复盘（如几十万字），旨在掌握项目起承转合、避坑指南，实现“先胜而后战”。
  is_original: true
  excerpt:
  - 狭义阅读量，一切跟赚钱、跟项目、跟生财有关的阅读。
  - 围绕一个具体的项目方向，依然可以进行几何级数量的阅读。先胜而后战。相关的文字资料已经看了几十万字，对于项目的起承转合烂熟于心。
- name: 内生项目方向
  desc: 指基于个体独特的阅读积累玫瑰图、资源禀赋玫瑰图，在大剂量阅读和技能叠加过程中自然涌现、适配个体天命的项目方向，而非盲目追逐外部风口。
  is_original: true
  excerpt:
  - 对每个个体而言有效的生财方向，是在大剂量阅读的过程中、在基础技能的不断叠加中，自然而然涌现出来的，而非不停的去研究风口求来的。
  - 风口方向不一定对自己而言是好方向，而内生的项目方向，才是天命之所在。
- name: 玫瑰图
  desc: 用于隐喻个体在阅读积累维度和资源禀赋维度上呈现的独特、不均衡、多维度的能力分布图谱，解释为何标准化风口不适配个体差异。
  is_original: true
  excerpt:
  - 每个个体的阅读积累玫瑰图、资源禀赋玫瑰图都有所不同。
methods:
- name: __overview__
  desc: 生财三步走实操法：第一步广义阅读构建认知框架与跨学科视角；第二步狭义阅读针对具体项目进行资料穷尽与复盘验证；第三步基础技能叠加（文字、图像、视频、AI、代码、流量等）夯实执行基本功，最终实现内生项目方向的自然涌现。
  excerpt:
  - 1、广义的阅读。有精通的领域；其他的领域至少有蜻蜓点水的涉猎，基本框架的搭建、基础概念的熟识。
  - 2、狭义的阅读。针对具体的项目，前前后后、里里外外门清，缸满则溢，不得不动手实操验证自己的想法。
  - 3、基础技能的熟练。文字处理工具、内容分发平台、图像处理、视频的拍摄和剪辑、各类 AI 工具、基础代码能力、流量的生成和投放。
- name: 狭义阅读-先胜而后战法
  desc: 在动手实操前，通过大量文本资料（几十万字）对目标项目进行全链路复盘（起承转合、常见坑点、解决方案），建立心理模拟沙盘，降低试错成本。
  excerpt:
  - 先胜而后战。相关的文字资料已经看了几十万字，对于项目的起承转合烂熟于心，然后动手实操、理论结合实践；或者两眼一抹黑，二话不说就开干，各种常见的坑挨个踩一遍。成事效率会有质的差别。
theorems:
- name: 人>项目定律
  desc: 在优质项目不稀缺的环境下，项目成功的关键变量从“找到好项目”转移为“成为能驾驭项目的人”，个人积累（达人属性）是项目落地的充分必要条件。
  excerpt:
  - 当不缺风向标项目的时候，更为凸显了人的重要性。
  - 项目的落实，往往是多种能力的组合。... 前两项是个人日常积累... 是比项目本身更为重要的。
- name: 阅读量过关定律
  desc: 生财的第一门槛是阅读量达标，包含广义阅读建立认知上限和狭义阅读建立执行下限，两者缺一不可，是“先胜而后战”的认知前提。
  excerpt:
  - 生财的第一步，是阅读量过关。
  - 广义阅读量... 狭义阅读量... 成事效率会有质的差别。
- name: 内生优于外求定律
  desc: 适配个体的最优生财路径源于内部积累（阅读、技能、禀赋）的自然涌现，而非外部风口的刻意猎取；风口具有普适性但个体适配度低，内生方向具有专属性且成功概率高。
  excerpt:
  - 对每个个体而言有效的生财方向，是在大剂量阅读的过程中、在基础技能的不断叠加中，自然而然涌现出来的，而非不停的去研究风口求来的。
  - 风口方向不一定对自己而言是好方向，而内生的项目方向，才是天命之所在。
findings:
- name: 小红书戏精视频带餐饮券案例复盘
  desc: '[evidence] 通过拆解该风向标项目，验证了项目方向（平台/变现模式）仅占成功要素的1/3，而个人积累（戏精人设、拍摄技能）占2/3且为项目无关的长期沉淀，支撑了“达人优先原则”。'
  excerpt:
  - 举个例子，小红书戏精视频带餐饮购物券，这就是一个风向标项目。但一个人本身是个戏精，这有赖于多年的积累。良好的拍摄手法，这个也是项目无关的基础技能。
- name: 阅读量与实操效率的质的差异观察
  desc: '[claim] 作者宣称完成几十万字狭义阅读后“烂熟于心”再实操，与“两眼一抹黑”硬闯相比，成事效率有质的差别，但文中未给出具体量化对比数据（如时间、成本、成功率）。'
  excerpt:
  - 相关的文字资料已经看了几十万字，对于项目的起承转合烂熟于心，然后动手实操、理论结合实践；或者两眼一抹黑，二话不说就开干，各种常见的坑挨个踩一遍。成事效率会有质的差别。
- name: 评论区协同验证：拼图理论与技能内化
  desc: '[evidence] 评论区用户黄柏宁将“5条边”映射为曹大“拼图理论”中的5张图，用户盗梦人指出“大量做”是积累基础技能的过程，作者确认，侧面印证了方法论在社群内的共识度与实践一致性。'
  excerpt:
  - '黄柏宁 : 第一点我可以理解为曹大说的拼图，5 条边等于 5 张图'
  - '盗梦人 : 大量做的过程中也是一个积累基础技能的过程 王健行 : 是这样的'
