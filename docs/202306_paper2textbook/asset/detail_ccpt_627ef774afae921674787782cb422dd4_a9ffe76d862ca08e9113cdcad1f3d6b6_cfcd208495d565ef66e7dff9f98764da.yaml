units:
- 'no': 1
  name: 年入百万 vs 考985 —— 从“命中注定”到“我命由我”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人误以为考不上985就注定平庸，或者以为赚钱全凭运气。'
  - '- 需要校正“难度认知”：哪条路对普通人更友好，决定努力方向。'
  - '**核心定义**'
  - '- 考985：通过高考进入985高校，本质是标准化考试，每年约20万人。'
  - '- 年入百万：每年实现100万元收入，统计口径约每年160万人次。'
  - '**关键性质**'
  - '- 高考受原生家庭、教育资源等先天因素“概率锁定”，评价单一、逆袭概率低。'
  - '- 赚钱拥有赛道、老板、导师、红利、评价标准等后天可控变量，可换赛道、可抱大腿。'
  - '**典型例子**'
  - '- 同一人“我”在山区差校考581分，到省会名校复读后考623分，证明环境锁定上限。'
  - '- 互联网大V崛起，靠抢占新流量资源替代旧渠道，实现逆袭。'
  - '**边界条件**'
  - '- 年入百万的统计包含人次，存量未必大于985毕业生；赚钱需要财商和风险承受力，不是零门槛。'
  - '- 若缺乏行动力和持续学习，赚钱路径仍是小概率事件。'
  sources:
  - paper: docs/202306/20230613_080.md
    role: origin
  - paper: docs/202306/20230613_081.md
    role: improve
  - paper: docs/202306/20230613_082.md
    role: improve
  - paper: docs/202306/20230613_083.md
    role: improve
  - paper: docs/202306/20230613_084.md
    role: critique
  - paper: docs/202306/20230613_085.md
    role: apply
  - paper: docs/202306/20230613_086.md
    role: improve
  - paper: docs/202306/20230613_087.md
    role: apply
  excerpts:
  - 原生家庭（你的爸妈、家庭条件、出生在城市还是农村、当地教育质量），很大程度上定好了你考什么大学的概率。
  - 毕业后，你可以不止一次的给自己挑选更好的老板... 你都可以自己选老师...总有能发挥你才能的地方。
  - 白手起家赚到 100w 比考上 985 难多了。
  - 首先要放弃我要更努力的想法，10 倍的增长绝对不是从努力来的。
  - 假设给你 3 年时间准备，以你目前的情况，你觉得是考上 985 难，还是 3 年之后能年入百万难？
- 'no': 2
  name: 出卖时间 vs 经营资产 —— 从“廉价零件”到“超级个体”
  points:
  - '**为什么需要这个概念？**'
  - '- 打工者靠出卖时间赚钱，天花板极低且面临AI替代。'
  - '- 需要理解从“时间变现”到“资产/系统变现”的跃迁路径。'
  - '**核心定义**'
  - '- 出卖时间：用劳动力换取线性收入，本质是在销售原材料，处于分配链末端。'
  - '- 经营资产：通过产品、商业系统、稀缺资源或规则持续提取剩余价值，实现时间复用。'
  - '**关键性质**'
  - '- 出卖时间的收入上限由可售时间决定，一生约占总寿命的十分之一。'
  - '- 经营资产具备杠杆：劳动力杠杆、资本杠杆、媒体/产品杠杆（零边际成本）。'
  - '**典型例子**'
  - '- 贝索斯、张一鸣等通过代码/平台杠杆创造巨大财富。'
  - '- 打工人被AI替换成“更廉价零件”，而超级个体用产品或服务直接与市场交易。'
  - '**边界条件**'
  - '- 经营资产需要先积累“专长”和“产品能力”，不是直接跳过第一阶段。'
  - '- 劳动力杠杆在AI时代效率降低，媒体杠杆是普通人最容易接触的。'
  sources:
  - paper: docs/202306/20230613_177.md
    role: origin
  - paper: docs/202306/20230613_182.md
    role: improve
  - paper: docs/202306/20230613_253.md
    role: improve
  excerpts:
  - 第一个段位是出卖时间和劳动力赚钱，这时候你是一个廉价零件。
  - 第二个段位是用产品或服务赚钱，这时候你是一个能和市场直接交易的超级个体。
  - 任何螺丝钉它都是廉价零部件，换到哪儿都一样，因为你的生态位没有发生改变，只要是零部件，那就一定能找到更廉价的
  - 第一种商业模式，靠体力赚钱，赚的是“血酬”，花费的生产资料是自己的时间和健康。80%的人玩的是这种商业模式。
  - 第一重境界，靠体力／智力＊时间赚钱。
- 'no': 3
  name: 信息差与认知套利 —— 从“辛苦挣钱”到“弯腰捡钱”
  points:
  - '**为什么需要这个概念？**'
  - '- 大多数人靠汗水赚钱，看不到信息不对称带来的溢价。'
  - '- 需要识别“信息差”这种普通人低成本、高杠杆的机会。'
  - '**核心定义**'
  - '- 信息差：认知、资源、渠道等维度的非对称信息，先发现并行动者可获得超额收益。'
  - '- 认知套利：通过切换视角（如从打工者到中介/分销），将信息差转化为商业机会。'
  - '**关键性质**'
  - '- 信息差变现的主流形态是中间人经济：分销、转介绍、撮合。'
  - '- 核心心法是“视角一变，商机无限”，把辛苦挣钱变成弯腰捡钱。'
  - '**典型例子**'
  - '- 作者搜索“信息差”关键词，阅读100多篇精华帖，整理成万字整合贴，获207赞。'
  - '- 作者通过公众号矩阵、抓住流量红利实现百万积累。'
  - '**边界条件**'
  - '- 信息差红利有时间窗口，一旦公开或泛滥就迅速消失。'
  - '- 需要大量信息输入和敏锐度，否则机会当前也看不见。'
  sources:
  - paper: docs/202306/20230613_004.md
    role: origin
  - paper: docs/202306/20230613_251.md
    role: improve
  - paper: docs/202306/20230613_080.md
    role: improve
  excerpts:
  - 为了弄明白这事情，我在生财搜索引擎里搜【信息差】这个关键词，又打开了 100 多篇精华帖来看。
  - 看完之后，我就有两个感受：1、卧槽、卧槽、卧槽... 这哪里是辛苦挣钱？这真是弯腰就能捡钱呀。2、视角一变，商机无限。
  - 大多数挣钱的方法是什么？是信息差，只有输入的信息量足够大，才能在面对新的风口时游刃有余
  - 推荐一本书籍：中间人经济，绝大多数都是玩中间人这个角色，分销转介绍拉皮条都是如此
- 'no': 4
  name: 快钱慢钱辩证法 —— 从“道德对立”到“阶段共生”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人把“快钱”和“慢钱”对立，形成道德污名和选择焦虑。'
  - '- 需要建立基于目的、阶段和不确定性的中性判断。'
  - '**核心定义**'
  - '- 快钱：利用平台红利、短期机会快速获利，周期短、不确定性大。'
  - '- 慢钱：长期主义、深耕品牌，追求稳定现金流和长久发展。'
  - '**关键性质**'
  - '- 快慢钱没有道德高下，只是目的决定做法。'
  - '- 快钱可作慢钱的第一桶金，二者构成时序链条而非对立。'
  - '**典型例子**'
  - '- 霍英东早期转卖战时剩余物资赚第一桶金，芒格早期做房地产赚快钱。'
  - '- 农民拒绝固定月薪选指数增长最后饿死，说明生存期不应强行赚慢钱。'
  - '**边界条件**'
  - '- 赚快钱需承担风险和道德自责，不是零成本。'
  - '- 慢钱需有资本和生存保障，否则无法熬过长期投入。'
  sources:
  - paper: docs/202306/20230613_006.md
    role: origin
  excerpts:
  - 快钱慢钱都是钱，这只是一种选择，跟谁好谁坏没关系
  - 尤其是在巨大的不确定形式下，我觉得落袋为安，赚点快钱反倒是更好的选择
  - 赚慢钱的前提，是要有资本，要先通过赚快钱迅速积累第一桶金
  - 霍英东早期也是通过转卖战时剩余物资赚的第一桶金，查理芒格早期也通过房地产赚了不少快钱
- 'no': 5
  name: 做题家 vs 出题家 —— 从“标准答案”到“定义规则”
  points:
  - '**为什么需要这个概念？**'
  - '- 大多数人习惯在既有规则里竞争，收益上限被锁死。'
  - '- 需要识别“做题家”与“出题家”两种身份，主动跃迁。'
  - '**核心定义**'
  - '- 做题家：在既定规则、固定赛道内优化答案，被动竞争存量。'
  - '- 出题家：定义规则、创造标准，站在更高维度掌控话语权。'
  - '**关键性质**'
  - '- 身份决定视界与收益上限：做题家在规则内，出题家在规则外。'
  - '- 出题家需要思维模型工具箱：第一性原理、反脆弱、边际复制成本。'
  - '**典型例子**'
  - '- 亦仁等大佬常用出题家视角；读者评论区多自我认同为做题家。'
  - '- 从做题家到出题家，如从“规则内卷”到“规则外创造增量”。'
  - '**边界条件**'
  - '- 普通人不可能一夜成为出题家，需要认知升级和阅读积累。'
  - '- 出题家也面临生态责任，不是单纯权力。'
  sources:
  - paper: docs/202306/20230613_088.md
    role: origin
  excerpts:
  - 你是做题家还是出题家？
  - 我喜欢出题者的角度，可以站在更好维度看问题
  - 其中涉及到的一些名词，例如思维模型，反脆弱，第一性原理，边际复制成本等等，都是经常听到很多大佬提及
- 'no': 6
  name: 理论-实践鸿沟 —— 从“书本理想”到“残酷实战”
  points:
  - '**为什么需要这个概念？**'
  - '- 纯理论学习者进入商业实践往往“懵逼”，因为理论回避大量灰色操作。'
  - '- 需要正视书本没有的“生存技能”。'
  - '**核心定义**'
  - '- 理论-实践鸿沟：正规商业理论无法覆盖回扣、办公室政治、保护费、恶意竞争等现实博弈。'
  - '- 隐性交易成本：商业实践中普遍存在但理论不承认的非标准化手段。'
  - '**关键性质**'
  - '- 理论受合规性、审查和伦理限制，天然过滤非显性知识。'
  - '- 实践认知只能通过直接投身冲突、积累隐性知识获得。'
  - '**典型例子**'
  - '- 芒格“提价增量”案例：用高出行价的钱行贿，把商品卖出去。'
  - '- 房东看你生意红火就毁约收回，对手派人卧底陷害等。'
  - '**边界条件**'
  - '- 并非鼓励违法操作，而是提醒理解现实复杂度。'
  - '- 理论仍是基础，鸿沟需要实践填补，不能跳过。'
  sources:
  - paper: docs/202306/20230627_003.md
    role: origin
  excerpts:
  - 为什么许多学理论的人一去实践就懵逼？因为实践有许多理论不会触碰的地方
  - 营销理论从不给你讲回扣这件事。
  - 餐厅经营的书里，不会告诉你有地痞流氓收保护费该怎么办？
  - 芒格说他最喜欢这个答案，它生动地证明实践与理论的不同，商业实践要比商业理论复杂很多倍。
- 'no': 7
  name: 生意本质三维模型 —— 从“单一生意”到“需求三维”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人把生意等同于开店卖货，陷入红海竞争。'
  - '- 需要按“满足谁的需求”拆解生意，找到自己的生态位。'
  - '**核心定义**'
  - '- 生意本质：通过交易行为满足他人需求。'
  - '- 三维需求模型：满足特定个体（高客单非标）、满足特定群体（认知焦虑知识付费）、满足客观标准化需求（红海标品）。'
  - '**关键性质**'
  - '- 个体需求可交易三种要素：劳动力、金钱、智力。'
  - '- 知识付费贩卖的是“确定感”而非能力，用户为“不再困惑”付费。'
  - '**典型例子**'
  - '- 作者从“给传统生意做运营赋能”的困境，转向“现金流生意+知识付费+甲方陪跑”组合。'
  - '- KEEP会员或买AIGC课程后不学，说明付费缓解焦虑。'
  - '**边界条件**'
  - '- 红海标品竞争激烈无壁垒，需要升级为组合模式。'
  - '- 知识付费需赢得信任，否则难以复购。'
  sources:
  - paper: docs/202306/20230627_004.md
    role: origin
  excerpts:
  - 生意的本质其实就是：通过交易行为，满足他人的需求。
  - 满足某个人的需求
  - 满足一个群体的需求
  - 满足客观存在的需求
  - 知识付费的本质，就是帮你把一个把你认知上感觉困惑的问题，变成一个具体的实践操作的问题。你购买的时候是为你不再困惑付费的
- 'no': 8
  name: 职场四层次进化 —— 从“埋头做事”到“降维打击”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多职场人只埋头做事，却不知道职场本质是利益交换。'
  - '- 需要看清四层进化路径，避免停留在“可替代”的底层。'
  - '**核心定义**'
  - '- 职场四层次：专业做事→满足上级利益→为自己操盘→选择正确商业模式。'
  - '- 降维打击：在当前竞争维度低一级运作认知和能力。'
  - '**关键性质**'
  - '- 每层天花板由外部结构决定：可替代性、老板瓶颈、模式杠杆、资源门槛。'
  - '- 四种能力应作为工具箱灵活调用，而非线性阶梯。'
  - '**典型例子**'
  - '- 阿里P9年薪约等于传统上市公司CEO，说明赛道选择碾压层级努力。'
  - '- 新浪6年老员工因无信任关系错失N+1。'
  - '**边界条件**'
  - '- 层次越低活下来概率越大，强行跳级不具备条件会失败。'
  - '- 降维打击需要认知超前，否则变成好高骛远。'
  sources:
  - paper: docs/202306/20230613_098.md
    role: origin
  excerpts:
  - 做事的第一个层次，就是聚焦做事，把事情做好，发挥自己的专业属性。
  - 做事的第二个层次，搞清楚为了谁而工作，他是否认同你
  - 做事的第三个层次，为自己做事
  - 做事的第四个层次，你所在的行业，是不是好的商业模式
  - 我们最好的策略就是：降维打击。
- 'no': 9
  name: 认知觉醒五维重构 —— 从“补短板”到“扬长避短”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人赚不到钱，往往不是不够努力，而是认知模型错误。'
  - '- 需要完成关于钱、资源、时间的五个维度觉醒。'
  - '**核心定义**'
  - '- 认知觉醒：系统性重塑对金钱、价值、资源积累及时间投资的底层认知。'
  - '- 五维重构：钱的本质是交换价值；模仿有钱人；去除低认知；积累资源而非消耗；不节省时间而投资高杠杆活动。'
  - '**关键性质**'
  - '- 认知觉醒是开始赚钱的第一步，驱动执行力质变。'
  - '- 扬长避短优于补短板：利用优势项而非修补劣势。'
  - '**典型例子**'
  - '- 作者“取悦、沟通”排名最后却做婚礼主持7-8年，效果平平；转用“学习、思维”优势后4个月变现10万。'
  - '- 买车选择雷克萨斯作为信用背书，而非省钱国产车。'
  - '**边界条件**'
  - '- 优势测评结果不是宿命，需要结合实践验证。'
  - '- “不要节省时间”不是挥霍，而是将时间投入到高杠杆的学习和系统建设。'
  sources:
  - paper: docs/202306/20230613_100.md
    role: origin
  excerpts:
  - 认知觉醒是开始赚钱的第一步
  - 测试过个人优势之后我的「取悦，沟通」排名最后，而我这七八年以来都是一名婚礼主持人，由此可见真的是一直在弥补自己的短板。
  - 我的「学习，思维，成就」排名靠前三，这也是我认为从 2 月份进入副业圈以来 4 个月总共变现 10 万的核心原因
  - 你在做事情的时候是在积累资源还是在消耗资源。
  - 5.不要节省时间
- 'no': 10
  name: 时间即生产资料 —— 从“出售时间”到“时间杠杆”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人直接出售时间，可售时间只占一生约1/10，天花板极低。'
  - '- 需要理解时间作为终极生产资料和四种时间成本模型。'
  - '**核心定义**'
  - '- 时间即生产资料：所有生产需要知识，知识需要时间，所以时间是终极生产资料。'
  - '- 四大时间成本：生产、再生产、学习、销售。'
  - '**关键性质**'
  - '- 再生产时间成本趋近零（写书、代码、媒体、直播带货）是高杠杆模型。'
  - '- 成本越大，生意模型越差。'
  - '**典型例子**'
  - '- 奶茶店每杯3-5分钟再生产成本，模型普通。'
  - '- 李佳琦的生产、再生产、学习成本几乎为零，模型极佳。'
  - '**边界条件**'
  - '- 零再生产成本模型需要一次投入质量足够高，如书籍需有十万册实力。'
  - '- 自媒体本质仍是销售，不能只生产不销售。'
  sources:
  - paper: docs/202306/20230613_101.md
    role: origin
  excerpts:
  - 时间是一种生产资料。我们只有通过生产才能获得财富，而真正（能赚到钱）的生产，需要三种要素，一种是材料，一种是需求... 还有一种是时间。因为所有的生产都需要知识，所有的知识学习都需要时间，所以时间是终极的生产资料。
  - 我们一生能销售的个人时间只占总生命的大概十分之一。
  - 从事生产有四种时间成本：生产时间成本，再生产时间成本，学习时间成本，销售时间成本。我们用这四种成本，就可以衡量一个生意模型的好坏。
  - 比如我写书。生产时间成本大概半年，没有再生产的时间成本，写一本卖十年。
- 'no': 11
  name: 模仿律与组合拳创新 —— 从“孤芳自赏”到“系统壁垒”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多创业者害怕被模仿，却不知道世界本质是模仿。'
  - '- 需要理解模仿规律，并学会构建反模仿壁垒。'
  - '**核心定义**'
  - '- 模仿律：源自塔尔德，民族传统、商业、文化通过“模因”模仿传递；世界没有绝对原创。'
  - '- 组合拳创新：多维度耦合（组织、选址、用工、供应链、分配）提高模仿难度，或持续创新。'
  - '**关键性质**'
  - '- 模仿四大规律：从上到下、几何扩散、先内后外、文化优于物质。'
  - '- 单一创新无法阻止模仿，只能短期领先。'
  - '**典型例子**'
  - '- 喜茶芝士奶盖、瑞幸生椰拿铁迅速成为行业标配。'
  - '- 南城香通过组织+选址+用工+供应链+分配组合，几乎无人能完全模仿；戴森靠工业设计+技术专利+工艺组合。'
  - '**边界条件**'
  - '- 组合拳创新门槛高，需要资源和系统能力。'
  - '- 文化先导商业，但模仿需考虑本土化与合规。'
  sources:
  - paper: docs/202306/20230613_093.md
    role: origin
  excerpts:
  - 商业在模仿中发展，儿童在模仿中长大
  - 所以我们要明白一个世界的真相，这世界上本质上是没有原创的，都是模仿的结果，当然好一点的是在模仿中加了一些新东西。
  - 单一形式的创新无法阻止对手模仿，你需要一套组合拳才可以。
  - 南城香的反模仿，源于组织结构，选址原则，用工模式，供应链，分配方式等等的组合手段，所以几乎没人能完全模仿。
- 'no': 12
  name: 商业3.0时代与代运营2.5模式 —— 从“渠道为王”到“认知为王”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统商家用2.0模式在3.0时代越来越难赚钱，转型需要中介。'
  - '- 需要识别时代变化，找到代运营2.5的机会。'
  - '**核心定义**'
  - '- 商业三阶段：1.0鸡毛换糖，2.0商铺/平台，3.0知识/认知。'
  - '- 代运营2.5：连接2.0到3.0的中间商，核心价值来自对新商业模式的认知理解，只做从1到10的效率提升。'
  - '**关键性质**'
  - '- 3.0时代核心生产力是认知，金钱杠杆效果降低。'
  - '- 代运营公司应是“现金流生意+知识壁垒”，通过项目沉淀方法论。'
  - '**典型例子**'
  - '- 作者谈投资款成立代运营公司，采用深度利益捆绑合伙人（增量分成/流水分成）。'
  - '- 传统行业商家代运营渠道稀缺，决策快，易达成合作。'
  - '**边界条件**'
  - '- 代运营只做1-10，不做0-1，需有足够存量客户。'
  - '- 赚劳动力的钱是劣质模式，必须让利合伙人和商家。'
  sources:
  - paper: docs/202306/20230613_178.md
    role: origin
  - paper: docs/202306/20230613_250.md
    role: improve
  excerpts:
  - 我认为现在的社会经济已经进入到 3.0 时代，核心能力是认知。
  - 从 2.0 到 3.0 这个阶段，需要有一个中间方介入，来完成商业的转型。而这个中间方就是商业的 2.5 阶段，我们把它叫做：代运营。
  - 所以，我的商业模式，只做从 1-10 的生意，提升商业的效率，通过变现来获得自己的收益。
  - 目前我寻找的人是愿意把代运营的服务公司作为自己的主业的人，要求利益深度捆绑，做出了增量才能获得收益...
- 'no': 13
  name: 千万商业模式顶层设计 —— 从“单打独斗”到“裂变阿米巴”
  points:
  - '**为什么需要这个概念？**'
  - '- 超级个体模式年入300万封顶，无法突破千万。'
  - '- 需要从顶层设计产品、利润、规模，用组织裂变放大。'
  - '**核心定义**'
  - '- 千万商业模式三要素：好卖的产品（定生死）、巨大的利润（高客单/高毛利）、能做规模（人的规模/钱的规模）。'
  - '- 裂变式阿米巴：阶梯产品矩阵→阿米巴分销团队→付费流量招募合伙人→筛选人才开发新品。'
  - '**关键性质**'
  - '- 选品策略：信息差碾压替代稀缺定价，赚有钱人的零花钱，避开赚穷人生活费。'
  - '- 双规模引擎：人的规模（裂变分销）+钱的规模（付费流量）。'
  - '**典型例子**'
  - '- 作者放弃个人IP，做矩阵IP，团队几个月一个抖音号没做仍完成百万业绩。'
  - '- 采用99-99999客单产品矩阵+阿米巴分销，年入千万很容易。'
  - '**边界条件**'
  - '- 产品必须符合上规模需要，否则换产品。'
  - '- 知识付费已不是好赛道，需向高客单/高净值赛道转型。'
  sources:
  - paper: docs/202306/20230613_254.md
    role: origin
  excerpts:
  - 如何做到千万规模甚至上亿，满足三个要素：①好卖的产品：（产品定生死）②有巨大的利润：（高客单，高利润）③能做起来规模：（人的规模，资金的规模）
  - 如果你现在还在沉迷所谓的超级个体当中，你的收入一年很难突破 300 万的收入。
  - 赚钱有个原则：赚有钱人的零花钱，而不是赚穷人的生活费。
  - ①好产品：产品客单从低到高。从 99-99999 等上不封顶。②上规模：搭建裂变式阿米巴团队，分销产品。③上资本：付费打投流，吸引更多合伙人加入团队。④筛人才：从合伙人中筛选优秀的人才，开发更多新品。
- 'no': 14
  name: 财富即权势即拿捏 —— 从“存钱”到“提取剩余”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人以为财富是存款数字，结果死守存量，失去增长。'
  - '- 需要理解财富是持续提取剩余的能力，以及三种商业模式。'
  - '**核心定义**'
  - '- 财富本质：让别人的钱持续流向自己口袋的能力，即持续从社会提取剩余。'
  - '- 底层法则：对他人施加“得利”或“损害”，影响力决定财富上限。'
  - '**关键性质**'
  - '- 三种模式：L1血酬（出卖时间，将被AI取代）、L2稀缺资源租金（稀+缺）、L3制定规则/建生态（赢家通吃）。'
  - '- 拿捏：提供价值完成绑定，实现对他人劳动剩余的持续定向提取。'
  - '**典型例子**'
  - '- 苹果通过丝滑手机+封闭生态锁定30%用户缴“苹果税”。'
  - '- 互联网大V抢占流量新稀缺资源，替代报刊亭旧资源。'
  - '**边界条件**'
  - '- 血酬模式必然被AI颠覆，普通人需向L2/L3跃迁。'
  - '- 坐庄必须提供价值秩序，否则被创新者抢庄。'
  sources:
  - paper: docs/202306/20230613_182.md
    role: origin
  excerpts:
  - 掌控财富的真正核心是，能够持续不断地从社会中提取剩余。
  - 那么如何让他人把口袋里的钱掏给你呢？除了《刑法》里的办法之外，唯一颠扑不破的法则是：你对他人有用（有利益），或者你可以对他人施加损害。
  - 第一种商业模式，靠体力赚钱，赚的是“血酬”，花费的生产资料是自己的时间和健康。80%的人玩的是这种商业模式。
  - 第二种商业模式，掌握稀缺社会资源赚钱。
  - 第三种商业模式是第二种商业模式的“进阶版”...你是开赌场的老板。在你的场域中，你说了算，你是庄家，你制定规则...
  - 不难看出财富的本质可以浓缩成两个字：“拿捏”。
