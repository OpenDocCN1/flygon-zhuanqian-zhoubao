'no': 1
name: 同城实体生意经 —— 从“守着店等客”到“主动织网捕鱼”
desc: 本章系统拆解线下实体商家如何以极低成本撬动同城流量红利，涵盖认知重塑、对标复制、模板化内容生产、美团私域双轮驱动、选品SKU精简、外卖买量实验、合规资质办理、下沉市场人情博弈、轻资产异业合作等核心方法论，并通过麻辣烫亏损关店、眼镜店3000粉月入5万、棋牌室月利2万、云洗衣增收、同城相亲跨越周期等真实案例，构建从0到1的实体店生存与增收实战教程。
nodes:
- 'no': 1
  name: 为什么99%的实体老板在流量面前是“裸奔”的
  desc: 用“认知差即红利”视角揭示：实体老板深耕行业却完全不懂线上流量，稍微懂一点就能垄断方圆6公里客源；同城账号往往粉丝仅几百、点赞几十，却实现高变现，因为大众推荐池根本刷不到这些隐形同城账号。
  role: motivation
  src:
  - paper: docs/202306/20230613_159.md
  - paper: docs/202306/20230613_161.md
- 'no': 2
  name: 同城流量垄断的底层逻辑：认知差即护城河
  desc: 定义‘同城流量垄断’与‘隐形同城账号’概念：不看泛流量数据，只看精准到店转化；实体生意的核心壁垒不是技术而是‘懂不懂线上流量’的认知差，99.99%同行不懂，懂一点即垄断。
  role: definition
  src:
  - paper: docs/202306/20230613_159.md
  - paper: docs/202306/20230613_161.md
- 'no': 3
  name: 对标账号拆解复制法：不用想怎么拍，直接抄同行最好的
  desc: 核心方法论：寻找同城同行业优秀对标账号，逐帧拆解选题、脚本、拍摄、运营细节并一比一复制执行，将‘不确定的创新’转化为‘确定的复制’，极大降低认知与试错成本。
  role: method
  src:
  - paper: docs/202306/20230613_159.md
- 'no': 4
  name: 模板化内容生产SOP：把拍视频变成像做菜谱一样的标准动作
  desc: 将短视频制作流程标准化为固定模板（选题库、脚本结构、拍摄角度、剪辑节奏），实现‘投入时间少、产出效率高、套模板可复制’，支撑日更高频稳定产出，验证‘稳定产出>爆款博弈’定律。
  role: method
  src:
  - paper: docs/202306/20230613_161.md
- 'no': 5
  name: 案例实证：眼镜店3000粉丝月变现5万的“小号大做”密码
  desc: 复盘同城眼镜店案例：坚持日更、点赞稳定70-100、评论区IP高度聚合本地，通过模板化SOP实现低投入高产出，印证本地生活赛道‘粉丝数≠商业价值’，核心杠杆是粉丝精准度与内容可复制性。
  role: experiment
  src:
  - paper: docs/202306/20230613_161.md
- 'no': 6
  name: 避坑指南：麻辣烫店两月关店的五大致命错误复盘
  desc: 基于真实失败案例归因：1)对标错位（对标头部巨头而非同量级同行）；2)SKU臃肿（100+菜品导致运营失控）；3)流量黑箱（依赖外卖平台却不懂买量逻辑）；4)资源错配（过度投入包材牺牲毛利）；5)伪调研（未触达食堂分流、头部挤压、供应链成本等关键变量）。
  role: limitation
  src:
  - paper: docs/202306/20230613_162.md
- 'no': 7
  name: 同量级对标照抄法：找‘新开2-3个月且业绩突出’的同行抄作业
  desc: 对标层级匹配定律：仅有‘同量级、同阶段、同区域’的成功案例才具可复制指导意义。验证维度：投入成本、盈利水平、持续盈利能力、可复制成功案例。结合自身优势直接复制产品结构、运营动作、流量打法。
  role: method
  src:
  - paper: docs/202306/20230613_162.md
- 'no': 8
  name: SKU销量阈值清洗法：月销<20单的菜品直接砍掉
  desc: 建立月销量最低阈值（如20单/月），定期导出数据清洗长尾SKU，将菜品压缩至后厨高效运转极限（建议30-50个），释放冰箱容量、降低损耗、提升出餐速度。长尾SKU边际贡献为负，精简非减少选择而是聚焦核心单品矩阵。
  role: method
  src:
  - paper: docs/202306/20230613_162.md
- 'no': 9
  name: 外卖买量归因实验法：把‘裸奔’的投流变成可积累的运营资产
  desc: 将买量视为可测试运营动作：设定预算分级测试（200/300/500元档），记录曝光-点击-下单-ROI；建立竞对监控表；AB测试主图、标题、活动。在平台规则不透明前提下，建立‘低成本试错-快速反馈-规模化复制’实验体系。
  role: method
  src:
  - paper: docs/202306/20230613_162.md
- 'no': 10
  name: 核心指标资源聚焦法：第一优先级永远是‘获取流量’
  desc: 资源分配原则：包材/装修/食材溢价投入 < 流量获取成本+核心食材成本。在品质及格线下，谁终端（获客转化）做得好谁有市场。毛利率低于同类均值时，必须砍掉非核心体验成本。
  role: method
  src:
  - paper: docs/202306/20230613_162.md
- 'no': 11
  name: 深度调研清单法：开业前必须搞清的5项硬核指标
  desc: 1)自身优势清单；2)有效客流测算（扣除食堂/非餐时段）；3)3公里竞品全景图（头部/腰部/尾部价格带、SKU、客单、峰值单量）；4)同行成本结构拆解；5)供应链溢价验证。认识30个同行、去店里打工，胜过主观臆断。
  role: method
  src:
  - paper: docs/202306/20230613_162.md
- 'no': 12
  name: 止损即盈利：当结构性缺陷无法修复时，关店是保护本金的最优解
  desc: 止损即盈利定律：单店模型在已知可控范围内无法突破盈亏平衡点且核心逻辑有结构性缺陷时，果断关店优于盲目坚持。亏损可控、保留复盘资本与再战机会，沉没成本转化为下一次创业的‘学费红利’。
  role: extension
  src:
  - paper: docs/202306/20230613_162.md
- 'no': 13
  name: 美团+私域双轮驱动模型：公域获新、私域留存、裂变增量
  desc: 以美团/大众点评为公域流量入口，通过扫码进群、充值卡锁客沉淀至私域，利用私域运营实现高频复购、裂变带新、闲时填充，降低CAC提升LTV。棋牌室案例验证：充值会员贡献营收占比>60%为健康线。
  role: method
  src:
  - paper: docs/202306/20230613_237.md
- 'no': 14
  name: 美团店铺权重优化运营法：从主图视频到好评运营的标准化动作包
  desc: 针对高客单高复购业态：主图/视频突出核心卖点；设置‘引流单’与‘利润单’组合；邀请KOC探店刷标签；好评返现/赠时长；营销中心设置新客立减/闲时券；每日监控曝光-点击-到店-核销漏斗转化。
  role: method
  src:
  - paper: docs/202306/20230613_165.md
  - paper: docs/202306/20230613_237.md
- 'no': 15
  name: 私域分层锁客与裂变体系：三层架构激活沉睡用户
  desc: 建立‘体验群->充值会员群->合伙人群’三层：进群送体验券；首充阶梯权益（充500送100）；会员享专属预约/生日免单/闲时半价；老带新送佣金自动追踪；定时推送闲时特价/包厢预订倒计时，激活沉睡用户。
  role: method
  src:
  - paper: docs/202306/20230613_237.md
- 'no': 16
  name: 无人/少人化运营：解决‘人力成本’不解决‘获客留存’
  desc: ‘无人≠无脑’，核心竞争力在于运营精细度。智能门禁/灯控/监控/自助机/SaaS系统仅降低人力成本，月入2万分水岭在于：美团运营做到区域Top3、私域复购率>40%、闲时利用率>30%、设备故障响应<30分钟。
  role: limitation
  src:
  - paper: docs/202306/20230613_237.md
- 'no': 17
  name: 合规是生死线而非成本线：娱乐经营许可证、消防、公安备案缺一不可
  desc: 棋牌室属特种行业，核心准入：娱乐经营许可证、消防验收、公安备案、工商执照。软件严禁赌博功能（控牌、作弊、赔率、抽水），合规系统仅保留计时计费、桌费、商品销售功能。违规面临查封、罚款、刑事责任。
  role: definition
  src:
  - paper: docs/202306/20230613_237.md
- 'no': 18
  name: 选址‘三选一避’黄金法则：住宅/城中村/写字楼周边，避校200米
  desc: 成功案例多选：成熟住宅小区底商（晚高峰/周末强）、城中村青年公寓聚集区（夜间经济强租金低）、写字楼产业园周边（商务/午休/晚间强）。核心避坑：直线距离中小学<200米硬性红线、地下室无双通道、租金占比>25%、同质竞争>3家/公里。
  role: method
  src:
  - paper: docs/202306/20230613_237.md
- 'no': 19
  name: 下沉市场单店高利润率悖论：房租1/4、营收1/2、利润反而更高
  desc: 三四线城市房租、人力、原料成本显著低于一线，营收虽只有半但成本结构优势大，单店净利润率反超一线，年净利20万+。经营逻辑为‘1’，品牌营销为‘0’，落地执行是生存根本。
  role: motivation
  src:
  - paper: docs/202306/20230613_164.md
- 'no': 20
  name: 强龙不压地头蛇：大品牌下沉街边店必死的‘三死’定律
  desc: 一线品牌硬闯下沉街边必死于：1)职业店长打不过生存型创业者（无人情味）；2)熟人社会排外基因（口音/关系壁垒）；3)标准化供应链对抗非标灵活本地战术（响应慢）。外来品牌入驻商场可屏蔽合规骚扰与同行找茬。
  role: limitation
  src:
  - paper: docs/202306/20230613_164.md
- 'no': 21
  name: 下沉市场人情三维博弈：搞定顾客、同行、监管
  desc: 下沉本质是人情市场：搞定顾客（熟人传播+产品好+会来事）；搞定同行（隐富避免眼红举报）；搞定监管（疏通城管/环保/工商，基层执法月薪3-4千靠‘找事’变现，不搞关系必被‘三天两头停业整顿’）。
  role: method
  src:
  - paper: docs/202306/20230613_164.md
- 'no': 22
  name: 非专业出身也能做产品差异化：请教厨师+找秘方+自主改进工艺
  desc: 设计师转型餐饮者通过‘请教厨师+寻找秘方+自主改进工艺’攻克同质化，研发出‘软糯入味、肥而不腻、勺子舀食’的标志性单品（酱猪头），建立核心竞争壁垒，验证华与华方法论可本地化落地。
  role: method
  src:
  - paper: docs/202306/20230613_164.md
- 'no': 23
  name: 一战而定竞争策略：诱导对手过度备货第七天半价收割
  desc: 避免消耗战，通过一次决战行动击溃对手：沉住气观察基本盘与对手备货节奏，诱导对手盲目加大采购（熟食保质期短），第七天集中火力半价促销+喇叭+地推，导致对手库存报废万元损失迫其退出。
  role: method
  src:
  - paper: docs/202306/20230613_164.md
- 'no': 24
  name: 单店模型标准化优先评估法：熟食>火锅，万店潜力>千店上限
  desc: 以‘标准化程度、复制成本、投入成本、市场容量’评估业态：熟食店高标准化、低复制成本、万店潜力；火锅店操作复杂、单店投入高、海底捞也只千店上限。纠正战略重心，聚焦打磨单店模型为连锁铺路。
  role: method
  src:
  - paper: docs/202306/20230613_164.md
- 'no': 25
  name: 轻医美小红书日引流100组精准私域：标准化SOP可复制
  desc: 在抖音信息流成本上涨ROI下降背景下，小红书成轻医美高性价比获客主阵地。已跑通案例通过详细拆解SOP化，供同类门店参考借鉴，验证‘标准化拆解可复制性强’。
  role: experiment
  src:
  - paper: docs/202306/20230613_163.md
- 'no': 26
  name: 同城相亲项目：普通人借力社群头部案例跨越周期的创业范本
  desc: 大厂离职回老家->加入高质量社群->筛选头部实战案例（唐大、杜总）→确定赛道（同城相亲）→全职入局→熬过疫情周期→月入10万+稳定流水。验证赛道生命力与抗周期性，普通人创业需经历‘收入骤减-心理落差-外部杠杆-行动-穿越周期’心智成熟。
  role: experiment
  src:
  - paper: docs/202306/20230613_166.md
- 'no': 27
  name: 云洗衣新业务模式：零成本接入洗衣家政，老板只做客服中间商
  desc: 帮拥有线下稳定客流的实体门店（便利店、复印店、饭馆、驿站），通过异业合作或自营中间商方式，零成本接入洗衣家政服务，利用外部供应链履约（快递上门取送），仅负责客服与流程对接，单店月销1-2.3万、净利六七千起。
  role: method
  src:
  - paper: docs/202306/20230613_235.md
- 'no': 28
  name: 高频刚需+轻资产中介=门店最优增收项：洗衣极高频、标准化高、无库存无占地
  desc: 相比卖货卖卡，云洗衣无库存压力、无场地人力成本、ROI最高。3个月测试5家不同业态门店验证跨业态普适性与盈利下限。无人自助下单模式解决店员不配合/人力成本高的执行阻力。
  role: experiment
  src:
  - paper: docs/202306/20230613_235.md
- 'no': 29
  name: 供应链外包履约体系：快递网络串联‘上门取件-工厂洗涤-配送回客’
  desc: 门店零接触衣物，解决传统洗衣店选址贵、设备重、人力难管痛点。无人自助下单/店员引导双轨获客：无人值守场景部署扫码小程序/海报；有人服务场景设计标准话术与佣金激励。
  role: method
  src:
  - paper: docs/202306/20230613_235.md
- 'no': 30
  name: 外部知识库索引与引用指南
  desc: 收录教程中引用的外部深度文档链接（如飞书文档、语雀知识库、知识星球精华帖），供读者深入查阅完整SOP、数据看板、法律合同模版等长文档资源。本教程正文已提炼核心精华，外部链接作为‘工具箱’备查。
  role: extension
  src:
  - paper: docs/202306/20230613_160.md
  - paper: docs/202306/20230613_236.md
