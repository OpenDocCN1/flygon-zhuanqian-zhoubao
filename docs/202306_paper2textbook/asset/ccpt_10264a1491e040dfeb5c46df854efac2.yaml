paper: docs/202306/20230613_241.md
desc: 该素材深度解析了 TikTok Shop 美区（漂亮国）推出“全托管模式”并与原有“平台模式”并行的战略调整，指出该变革本质上是平台向 TEMU 模式看齐、解决跨境卖家出单难、履约差的痛点。作者认为全托管模式门槛极高（需优质供应链、压货压账期能力），普通人难以直接入场；但由此带来的红利在于：1)
  利好本土商家，平台清退“骚操作”跨境卖家留出差异化生存空间；2) 创造达人带货（短视频小黄车/联盟营销）超级机会，核心逻辑为平台 GMV 目标（230亿美金）驱动流量扶持、自营模式解决断货/质量差导致的转化损耗、且东南亚市场（马来、菲律宾）当前门槛极低（几百播放即出单）、美区达人补贴政策（10美金/条）加持。建议普通玩家现阶段深耕东南亚达人带货，提前布局美区账号等待门槛降低。
concepts:
- name: 全托管模式
  desc: TikTok Shop 美区推出的新运营模式，类似京东自营/拼多多 TEMU 模式，商家仅作为供应链提供货品，平台负责运营推广、物流履约、售后回款，商家无需运营店铺。
  is_original: false
  excerpt:
  - 就是 TIKTOK 电商未来将调整为全托管模式 + 平台模式了。
  - 顾名思义呢，就是类似京东自营这样，就是你给平台供货。平台帮你卖，其他的你啥也别管了。
  - 我帮你推销、帮你发货、帮你售后，回款还很快
  - 你作为供应链，给官方提供产品，然后官方卖了以后给你回款，完事儿。
- name: 平台模式
  desc: TikTok Shop 原有运营模式，商家自主开店、备货、做内容获客、发货履约，平台仅提供交易场地并抽取佣金。
  is_original: false
  excerpt:
  - 商家不仅要备货、还要做视频或者直播搞流量吸引买家，之后呢还要给买家发货。而平台全程呢，就是提供了一个场地给买卖双方，顺便抽点佣金。
- name: 达人带货/短视频小黄车
  desc: 普通人低门槛参与 TikTok 电商的核心路径，通过发布挂载商品链接（小黄车）的短视频赚取佣金，不需囤货发货，素材制作门槛低（几百播放即可出单）。
  is_original: false
  excerpt:
  - 普通人都能干的机会：短视频小黄车带货！
  - 一条作品的剪辑难度，还有需要的播放数，真的很低，几百播放就有出单的。
  - 出单的简单程度，简直就是离谱妈妈给离谱开门。
- name: 跨境卖家与本土卖家差异
  desc: 素材强调的核心现状：跨境卖家在 TikTok Shop 表现极差（出货量不及 TEMU 零头），而东南亚本土卖家表现较好，促使平台推出全托管模式扶持跨境供应链。
  is_original: true
  excerpt:
  - 玩 TIKTOK 的赚到钱的跨境卖家真的不多，很多别说喝汤了，碗都没了。
  - 有朋友同时供货 TEMU（海外拼多多）和 TIKTOK 的，坦言说，从 TIKTOK 出货的量还不及 TEMU 的零头。
  - 注意哦，我这里说的是跨境卖家，本土卖家玩的还是可以的，特别是东南亚的本土卖家。
- name: 美区达人补贴政策
  desc: TikTok Shop 美区为刺激达人带货内容生产，推出的发布有效带货视频奖励 10 美元/条的现金补贴政策。
  is_original: true
  excerpt:
  - 对了，漂亮国针对达人带货还给出了相应的补贴政策，发布一个有效的带货奖励 10 美刀。
methods:
- name: __overview__
  desc: 基于平台战略变化推演普通人入场机会的分析框架：1) 识别平台核心战略转向（全托管）；2) 评估新模式对普通人的准入门槛（供应链门槛高，放弃直接入场）；3)
    识别策略性红利点（本土店生存空间、达人带货流量倾斜与风险降低）；4) 量化市场规模与实测数据验证可行性；5) 给出分阶段、分市场的具体行动建议。
  excerpt:
  - 今天呢我就来给大家讲讲，这波变化，对我们普通人来说，有哪些机会！
  - 想成为供应链...这都是必然情况。那么接下来说一下今天的正题！对我们普通人来说，这次变化有什么利好？
  - 咱们来算一笔账...市场规模...流量扶持...风险...小黄车真的能赚钱
  - 给小伙伴们的一些建议：我认为接下来 TK 的电商环境一定会变好...现阶段重心呢，还是要放在东南亚市场...欧美账号呢也可以准备一些
- name: 达人带货市场规模测算法
  desc: 通过平台 GMV 目标 * 最低佣金比率估算达人带货总佣金池规模，以此论证市场容量足以容纳大量普通玩家分食。
  excerpt:
  - 咱们来算一笔账，据说 TIKTOK 电商今年的目标 GMV 是 230 亿美金。按最低 10%的佣金，那就是 23 亿美金了，那就是超百亿的规模了。
- name: 东南亚市场实测数据验证法
  desc: 引用马来西亚市场单账号月 GMV 20-30 万美金、佣金率 15-20% 得月入 30 万人民币的实操数据，并对比美区门槛，验证达人带货的低门槛高收益特性。
  excerpt:
  - 就只拿马来地区一个市场来算，之前基本平均每个月的 GMV 都在 20-30W 美金左右，佣金率大概在 15-20%，佣金收益就在 30W 人民币左右了。
  - 而且，一条作品的剪辑难度，还有需要的播放数，真的很低，几百播放就有出单的。
theorems:
- name: 平台战略转向必然论
  desc: TikTok Shop 推出全托管模式的根本原因是跨境卖家自运营表现极差（GMV 远低于 TEMU），平台为完成核心 KPI 必须向成熟的 TEMU/京东自营模式看齐，掌控履约与选品主导权。
  excerpt:
  - 平台一看，这不行啊太拉跨了，跨境才是咱们的核心业务嘛...我看 TEMU 拼多多那套就玩得不错嘛，咱也来。于是全托管模式上线了。
  - 我认为接下来 TK 的电商环境一定会变好，为什么呢，当然是为了完成 KPI 和 flag 啊。
- name: 全托管模式非普通人红利论
  desc: 全托管模式本质是供应链生意，要求优质货源、极致性价比、垫资压货与长账期承受能力，属于强供应链玩家游戏，普通人无法直接参与，不应盲目跟风入驻。
  excerpt:
  - 其实呢，这个跟咱们普通人没什么关系哈哈。想成为供应链，那你的提供的产品不仅要足够优质，还需要性价比十分给力。未来，你还得有能够压货压账期的底气。
- name: 自营模式重构达人带货生态论
  desc: 平台转向自营/全托管将从根本上解决达人带货的两大痛点：商家断货导致链接失效、产品质量差导致店铺被封/退货率高。这将显著提升转化率、降低退货率，并迫使平台增加电商视频流量权重以完成
    GMV 目标，形成达人带货的黄金窗口期。
  excerpt:
  - 如果后面改为自运营以后，就不会有这个问题了。预计转化率，还有退货率都会减少很多。
  - 如果未来官方要做自营了，那么对于电商类视频的比重肯定要增加。不然怎么完成电商目标呢？
  - 电商视频多了，但是平台对于电商政策的规划还比较混乱...我认为改为自营以后，就会非常大的改善这个问题。
- name: 本土商家差异化生存论
  desc: 全托管模式清退了大量依赖“骚操作”的跨境卖家，虽然平台自营成强劲对手，但平台无法覆盖全品类，留给本土商家（含华人本土资源）在非标品、垂类深耕等差异化赛道巨大生存空间。
  excerpt:
  - 这波调整，其实平台直接帮你干掉了很多喜欢骚操作的跨境卖家...虽然看上去你要跟平台自营直接竞争，虽然你肯定不够打，但是呢，平台怎么可能做完所有品类所有产品呢？这就给你很大的操作空间了。
findings:
- name: 跨境卖家 GMV 表现远逊于 TEMU
  desc: '[evidence] 素材引用供货两边的商家实测反馈：TikTok Shop 跨境卖家出货量不及 TEMU 的零头，是平台推动模式变革的直接数据支撑。'
  excerpt:
  - 有朋友同时供货 TEMU（海外拼多多）和 TIKTOK 的，坦言说，从 TIKTOK 出货的量还不及 TEMU 的零头。
- name: 东南亚达人带货实测高收益低门槛
  desc: '[evidence] 作者团队在马来西亚市场实测：单账号月均 GMV 20-30 万美金，佣金率 15-20%，月佣金收益约 30 万人民币；视频制作门槛极低，几百播放量即可出单。'
  excerpt:
  - 就只拿马来地区一个市场来算，之前基本平均每个月的 GMV 都在 20-30W 美金左右，佣金率大概在 15-20%，佣金收益就在 30W 人民币左右了。
  - 而且，一条作品的剪辑难度，还有需要的播放数，真的很低，几百播放就有出单的。
- name: 美区达人带货现金补贴政策落地
  desc: '[claim] 素材宣称 TikTok Shop 美区已推出达人带货补贴：发布一条有效带货视频奖励 10 美元，并附带官方政策截图为证。'
  excerpt:
  - 对了，漂亮国针对达人带货还给出了相应的补贴政策，发布一个有效的带货奖励 10 美刀。
  - '![](img/c28c1bcbab9c49156540b54352549b02.png)'
  - '![](img/4999ce15767cb5174ca480440b526619.png)'
- name: 当前电商视频流量受限于平台管控机制
  desc: '[evidence] 素材揭示现状：小黄车视频属商业视频，受平台特殊管控，推流机制不同于娱乐视频，导致流量普遍低于娱乐内容；平台政策反复横跳导致近期达人带货效果波动。'
  excerpt:
  - 小黄车视频是属于商业类视频，它的推流和发布，是要受到平台特别管控的...小黄车作品需要审核，而且需要权衡平台的流量分布
  - 电商视频多了，但是平台对于电商政策的规划还比较混乱，没有一个明确的方向，所以会发现反复横跳。
- name: 菲律宾市场表现超预期
  desc: '[evidence] 作者透露除马来西亚外，菲律宾市场达人带货表现“很不错”，建议作为东南亚重点布局市场之一。'
  excerpt:
  - 现阶段重心呢，还是要放在东南亚市场，马来就不说了， 菲律宾的表现很不错。
