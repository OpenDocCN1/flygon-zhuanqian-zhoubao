paper: docs/202306/20230613_238.md
desc: 该素材为作者 Start9527 在“生财有术”社区发布的 Web3 新人入门指导文章导读，介绍了作者作为《从零开始读懂 Web3》统筹作者、Web3
  小航海教练及 Web3Going 新手实战营发起人的背景，旨在通过整理过往教学实践内容，帮助 Web3 新人更快参与到 Web3 建设中来。
concepts:
- name: Web3Going 新手实战营
  desc: 作者创办的面向 Web3 新人的实战训练营社区，旨在通过实战指导帮助新人快速入门 Web3 领域。
  is_original: true
  excerpt:
  - 目前在做服务 Web3 新人的 Web3Going 新手实战营社区。
- name: 从零开始读懂 Web3
  desc: 作者统筹编写的 Web3 入门系列读物/教程，作为新人系统学习 Web3 知识的核心教材。
  is_original: true
  excerpt:
  - 《从零开始读懂 Web3》的统筹作者
- name: Web3 小航海
  desc: 生财有术社区组织的 Web3 方向实战训练项目（小航海），作者曾担任第 27 期教练，积累了新人指导经验。
  is_original: false
  excerpt:
  - 生财有术的三期 Web3 小航海教练
  - 在十二月份担任生财有术 Web3 小航海教练的内容
methods:
- name: __overview__
  desc: 基于社群教学与实战营运营的复盘迭代法：将过往担任教练及运营实战营的教学内容进行结构化整理与再发布，形成标准化的新人入门指导体系。
  excerpt:
  - 为了更好的把我的小航海内容串联起来，我把在十二月份担任生财有术 Web3 小航海教练的内容重新发一下
  - 从两期 Web3 小航海和两期 Web3Going 新手实战营效果来看，大家都挺受益的
theorems:
- name: 结构化指导能显著降低 Web3 新人入门门槛
  desc: 作者主张通过系统化的教学内容（如《从零开始读懂 Web3》）、社群陪伴式教学（小航海教练）及实战训练营（Web3Going），能有效帮助新人快速参与
    Web3 建设，且已有两期小航海和两期实战营的效果为证。
  excerpt:
  - 我希望在生财有术成为一位帮助大家进入 Web3 赛道的专家，当然我有这个能力尤其适合于给新人做指导，从两期 Web3 小航海和两期 Web3Going 新手实战营效果来看，大家都挺受益的
findings:
- name: 教学实践验证了新人指导体系的有效性
  desc: '[evidence] 作者基于两期生财有术 Web3 小航海教练经历及两期自营 Web3Going 新手实战营的运营反馈，发现该套指导体系能让参与者受益，验证了方法论的可行性。'
  excerpt:
  - 从两期 Web3 小航海和两期 Web3Going 新手实战营效果来看，大家都挺受益的
