units:
- 'no': 1
  name: 财富的本质 —— 从“存款”到“抽水机”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人把财富等同于存款余额，但存款会花完，真正富有是拥有持续让钱流进口袋的系统'
  - '- 不懂财富是动态过程，容易沉迷攒钱，错过搭建现金流的机会'
  - '**核心定义**'
  - '- 财富是让别人的钱持续流向你口袋的过程，核心是持续不断地从社会中提取剩余'
  - '- 你变得更有钱的过程，就是更多人的劳动和价值转向你的口袋的过程'
  - '**关键性质**'
  - '- 动态性：财富是一种“流”而非“存量”，需要持续运转'
  - '- 可复制性：这个过程可以被系统化、生态化，如平台抽成、内容版权'
  - '- 循环性：越多人依赖你的价值，财富提取越稳定'
  - '**典型例子**'
  - '- 苹果通过丝滑手机提供价值，再用封闭系统绑定用户，让30%消费者持续缴纳“苹果税”'
  - '**边界条件**'
  - '- 如果停止提供价值或失去影响力，财富流就会中断'
  - '- 提取剩余必须在合法范围内（通过得利或损害），不能触碰法律红线'
  sources:
  - paper: 20230613_182.md
    role: origin
  excerpts:
  - 掌控财富的真正核心是，能够持续不断地从社会中提取剩余。
  - “财富”是让别人的钱流向你口袋的过程。你变得更有钱的过程，就是更多人的劳动和价值转向你的口袋的过程。
- 'no': 2
  name: 财富获取的底层法则 —— 让别人离不开你，或不敢得罪你
  points:
  - '**为什么需要这个概念？**'
  - '- 努力只决定你的投入，不决定别人为什么付钱；掌握底层法则才能设计让钱流向自己的机制'
  - '**核心定义**'
  - '- 唯一合法让陌生人掏钱的法则，是你对他人有用（得利），或可以施加损害'
  - '**关键性质**'
  - '- 覆盖面决定规模：你对越多人有用，财富上限越高'
  - '- 强度决定议价力：用处越大或可施加损害越严重，越能定价'
  - '- 双向性：得利是吸引，损害是威慑，二者结合形成控制力'
  - '**典型例子**'
  - '- 掌握稀缺资源的人（如平台、牌照持有者）能对需求者收取租金；垄断型企业拥有定价权'
  - '**边界条件**'
  - '- 施加损害必须在法律允许范围内，不能使用刑法手段'
  - '- 得利必须真实，否则信任崩坏后无法持续'
  sources:
  - paper: 20230613_182.md
    role: origin
  excerpts:
  - 唯一颠扑不破的法则是：你对他人有用（有利益），或者你可以对他人施加损害。
  - 你对越多人有用，你的用处越大，或者你可以对越多人施加损害，你能施加的损害越严重，那么你能把控的财富就会越多。
- 'no': 3
  name: 商业模式公式 —— 赚钱的“物理公式”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多项目看似赚钱，实则亏本；不懂公式的人拼命忙，结果“忙死赔死”'
  - '- 公式提供量化商业模式的标尺，避免凭感觉做决策'
  - '**核心定义**'
  - '- 利润 = (收入 - 成本) × 频次 × 周期'
  - '**关键性质**'
  - '- 高频：单次薄利但频次高，如平台流水'
  - '- 周期：可持续时间越长，复利效应越大'
  - '- 动态：四个因子任一变化都会改变利润'
  - '**典型例子**'
  - '- 农夫山泉早期利润低，但高频、长周期，最终成为好模式；集市摆摊单次利润高但频次周期短，难以放大'
  - '**边界条件**'
  - '- 公式中收入和成本必须真实核算，不能只看毛利率'
  - '- 短期暴利但如果频次周期无法持续，也不算好模式'
  sources:
  - paper: 20230613_007.md
    role: origin
  excerpts:
  - 利润=（收入-成本）x 频次 x 周期。
  - 好的商业模式，就是赚钱，高频，可持续。
- 'no': 4
  name: 赚钱双核心要素 —— 产品与流量，至少占一头
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人创业最容易犯“两头都不占”的错误，既没有产品也没有流量，还幻想赚钱'
  - '- 明确要素，才能选边切入，低门槛试错'
  - '**核心定义**'
  - '- 商业变现的必要条件是产品与流量至少拥有一端，否则不可能赚到钱'
  - '**关键性质**'
  - '- 流量端可低成本验证：分销、带货、无货源开店都属于流量端'
  - '- 产品端可积累护城河：自有产品能做品牌、控成本、提复购'
  - '- 新手建议从流量端切入，因为门槛低、试错成本小'
  - '**典型例子**'
  - '- 普通人做分销、短视频带货、无货源开店，就是用流量换销量、用销量换分佣'
  - '**边界条件**'
  - '- 只做流量没有稳定供给容易断货；只做产品没有流量则酒香也怕巷子深'
  - '- 两头都不占必死'
  sources:
  - paper: 20230613_180.md
    role: origin
  excerpts:
  - 要赚钱，两头总得占一头 产品、流量你总要占一个，否则不可能赚到钱。普通人赚钱，最好去做流量。
- 'no': 5
  name: 时间杠杆效率 —— 一份时间卖多次
  points:
  - '**为什么需要这个概念？**'
  - '- 一对一交易（电销、咨询）时间只能卖一次，天花板极低'
  - '- 想财务自由必须让一份时间被重复购买'
  - '**核心定义**'
  - '- 一对多模式，如内容、代码、媒体，把一份时间重复发售，让时间价值指数级放大'
  - '**关键性质**'
  - '- 边际成本递减：复制和分发的边际成本趋近零'
  - '- 规模效应：一条视频100万播放，等于同时在向100万人销售'
  - '- 必须先有产品化沉淀：把经验固化到可重复交付的内容或工具中'
  - '**典型例子**'
  - '- 短视频带货、写书、直播带货；而电话销售是一对一，效率低'
  - '**边界条件**'
  - '- 一对多需要前期大量投入制作'
  - '- 内容/服务需要持续更新，否则会被算法和用户遗忘'
  sources:
  - paper: 20230613_180.md
    role: origin
  excerpts:
  - 要做一对多，尽量不做一对一 把一份时间重复发售，让时间发挥最大价值。
  - 你做电话销售，是一对一，效率太低；但你做短视频带货...就是一对多。
- 'no': 6
  name: 三大商业模式分层 —— 从卖命到做庄
  points:
  - '**为什么需要这个概念？**'
  - '- 同一个“赚钱”词下，不同模式的抗风险能力、复利效应天差地别'
  - '- 看清分层才能选择赛道，避免在低层级内卷'
  - '**核心定义**'
  - '- L1血酬：出卖时间健康，赚线性收入；L2掌握稀缺社会资源收租；L3制定规则/建生态做庄家'
  - '**关键性质**'
  - '- 层级越高，杠杆越大：L1无杠杆，L2有资产杠杆，L3有生态杠杆'
  - '- 层级越高，抗风险越强：L1易被AI替代，L2依赖资源垄断，L3赢家通吃'
  - '- 可跃迁：通过抢占新稀缺资源，从L2攻擂者可以替代旧资源掌控者'
  - '**典型例子**'
  - '- 80%打工人处于L1；房产、流量、人脉属于L2；微信、抖音、CFA考试规则制定方属于L3'
  - '**边界条件**'
  - '- L2需要资源“稀+缺”双满足；L3需要持续提供价值秩序，否则会被创新者抢庄'
  sources:
  - paper: 20230613_182.md
    role: origin
  excerpts:
  - 第一种商业模式，靠体力赚钱，赚的是“血酬”...第二种商业模式，掌握稀缺社会资源赚钱...第三种商业模式...通过制定规则来赚钱...
  - 因为“建立生态”、“制定规则”，是最深刻地能对参与者施加“得利”和“损害”的商业模式。
- 'no': 7
  name: 血酬模式必然消亡 —— AI时代的“无用阶层”预警
  points:
  - '**为什么需要这个概念？**'
  - '- 如果继续靠出售标准化时间维生，未来可能连议价力都没有'
  - '- 提前认清趋势，才能及时向更高层级跃迁'
  - '**核心定义**'
  - '- AI将淘汰以可标准化、重复性时间为核心的血酬模式，使从事者成为“无用”之人'
  - '**关键性质**'
  - '- AI在成本、效率、规模上全面碾压人力'
  - '- 重复性工作越久，认知和议价能力越退化'
  - '- 不是完全消失，而是失去相对价值和议价权'
  - '**典型例子**'
  - '- 流水线工人、初级客服、标准化文员等重复性岗位，正在被AI和自动化替代'
  - '**边界条件**'
  - '- 创造性、情感连接、复杂决策类工作暂难被替代'
  - '- 若技能可标准化，就存在被替代的风险'
  sources:
  - paper: 20230613_182.md
    role: origin
  excerpts:
  - 随着 AI 带来的第四次科技革命，不难发现很多这种类型的“打工人”已不再被需要。他们做的所有工作 AI 都可以完成，且价格可以更便宜，效率更高。这部分群体注定会成为“无用”之人。
- 'no': 8
  name: 稀缺社会资源双维拆解 —— 又少又缺才是宝
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人误把“贵”当稀缺，其实稀缺要同时满足供给少和需求刚'
  - '- 拆解后才能识别真正护城河，避免投资伪稀缺资产'
  - '**核心定义**'
  - '- “稀”指总量有限、获得成本高（注意力、信任、物理限制）；“缺”指社会运转必不可少、刚需'
  - '**关键性质**'
  - '- 二维独立：稀不等于缺，缺不等于稀，必须同时成立'
  - '- 有无形与有形：房产、厂房有形；流量、人脉、技术无形'
  - '- 信任成本是重要维度：越上层人物信任成本越高，优质人脉越稀有'
  - '**典型例子**'
  - '- 流量/注意力：14亿人一天24小时有限，各APP争夺，巨头焦虑'
  - '**边界条件**'
  - '- 资源会随时代变化贬值（如传统报刊亭）'
  - '- 需要持续维护或寻找新稀缺资源，否则守擂者也会跌落'
  sources:
  - paper: 20230613_182.md
    role: origin
  excerpts:
  - 稀缺其实有两个意思。稀指的是这种社会资源的总量非常有限...缺则指的是社会运转中“必不可少”，没他不行的重要资源。
  - “稀”的方面，同样是基于人这种动物的特性——人的注意力、精力和活动范围都是有限的...
- 'no': 9
  name: 商业进化三阶段论 —— 从鸡毛换糖到认知变现
  points:
  - '**为什么需要这个概念？**'
  - '- 判断自己行业处于哪个历史阶段，才能知道该靠渠道、产品还是认知竞争'
  - '- 避免用旧地图找新大陆'
  - '**核心定义**'
  - '- 1.0鸡毛换糖（低效交易）；2.0商铺模式（供给丰富）；3.0知识模式（供给过剩、渠道复杂、核心能力是认知）'
  - '**关键性质**'
  - '- 2.0向3.0转型需要中间方（代运营2.5）'
  - '- 3.0时代，认知是最核心的生产力'
  - '- 不同阶段竞争要素不同：渠道、产品、认知'
  - '**典型例子**'
  - '- 传统商家在3.0时代靠自身理解转型效率低，催生代运营公司'
  - '**边界条件**'
  - '- 并非所有行业同步进入3.0，但趋势是从低效向高效演进'
  sources:
  - paper: 20230613_007.md
    role: origin
  - paper: 20230613_250.md
    role: improve
  excerpts:
  - 1.0 时代是鸡毛换糖，交易非常不精确，效率非常低... 2.0 时代是商铺模式，市场供给丰富... 3.0 时代是知识模式，供给过剩，渠道复杂，用户需求多样化...
  - 从 2.0 到 3.0 这个阶段，需要有一个中间方介入，来完成商业的转型。而这个中间方就是商业的 2.5 阶段，我们把它叫做：代运营。
- 'no': 10
  name: 生意的本质与三维需求模型 —— 为谁解决问题，就有多大生意
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人把生意等同于“买卖商品”，看不透需求对象差异导致模式选择错误'
  - '- 三维模型帮你定位赛道，匹配交易方式'
  - '**核心定义**'
  - '- 生意本质是通过交易行为满足他人需求；按对象分为满足个体、群体、客观标准化需求三类'
  - '**关键性质**'
  - '- 个体需求：高客单价、非标、信任要求高'
  - '- 群体需求：解决认知焦虑，可规模化、需持续输出'
  - '- 客观需求：标准化、红海、竞争激烈'
  - '**典型例子**'
  - '- 咨询陪跑满足个体；知识付费满足群体；餐饮零售满足客观需求'
  - '**边界条件**'
  - '- 三类并非互斥，可组合升级；无壁垒的标品生意容易陷入价格战'
  sources:
  - paper: 20230627_004.md
    role: origin
  excerpts:
  - 生意的本质其实就是：通过交易行为，满足他人的需求。
  - 满足某个人的需求...满足一个群体的需求...满足客观存在的需求
- 'no': 11
  name: 个体需求交易三要素 —— 除了卖时间，还能卖什么？
  points:
  - '**为什么需要这个概念？**'
  - '- 职场人常觉得自己只能出售时间，看不到还有金钱和智力两个高价值杠杆'
  - '**核心定义**'
  - '- 在个体需求交易中，可交易要素为：劳动力时间、金钱（投资）、智力（专业方案）'
  - '**关键性质**'
  - '- 时间唯一且不可复用，天花板低'
  - '- 金钱可杠杆，多项目并行'
  - '- 智力可标准化产品化，一次性付出持续收益'
  - '**典型例子**'
  - '- 投资获得回报；咨询顾问把专业认知转化为落地方案，绑定优质甲方获取增量分成'
  - '**边界条件**'
  - '- 智力变现需要专业积累和信任背书；纯投资有风险，需量力而行'
  sources:
  - paper: 20230627_004.md
    role: origin
  excerpts:
  - 如果你希望自己交易掉的不是自己的全部劳动力时间，那么还有两个要素是可以用来交易的：金钱和智力。
  - 金钱用于交易其实是投资...另外一种是智力投入，把自己的专业认知转化成客户的落地方案
- 'no': 12
  name: 知识付费本质 —— 卖“确定感”而非“能力”
  points:
  - '**为什么需要这个概念？**'
  - '- 不理解用户购买动机，就会把课程做成“教学大纲”，转化率惨淡'
  - '- 看透本质才能设计出让用户愿意付费且不产生糟糕口碑的产品'
  - '**核心定义**'
  - '- 知识付费的本质是帮用户把认知困惑变成具体操作问题，用户为“不再困惑”付费，而非为“执行结果”付费'
  - '**关键性质**'
  - '- 付费即缓解焦虑：购买瞬间焦虑降低，学习动力反而下降'
  - '- 产品应交付“结构化认知”，而非承诺能力提升'
  - '- 需要持续输出建立信任资产，实现复购'
  - '**典型例子**'
  - '- KEEP会员课、AIGC课程，很多人买了不学，因为焦虑已经缓解'
  - '**边界条件**'
  - '- 若用户追求实操结果，则需要配套训练营/社群等长周期产品，否则容易口碑崩坏'
  sources:
  - paper: 20230627_004.md
    role: origin
  - paper: 20230613_255.md
    role: apply
  excerpts:
  - 知识付费的本质，就是帮你把一个把你认知上感觉困惑的问题，变成一个具体的实践操作的问题。你购买的时候是为你不再困惑付费的，但是它没有办法解决你真的去实践操作的问题。
  - 大多数用户是通过付费来解决自己没有这方面有效信息的焦虑，这个焦虑一旦被解决了，他反而会失去运动的动力。
  - 如果你想持续赚钱，而且赚的比较稳，最好逼自己做一个长线业务。
- 'no': 13
  name: 商业模式与生意辩证关系 —— 长期守模式，短期抢生意
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人要么只看模式不看眼前，饿死；要么只看眼前不看模式，忙死'
  - '- 需要动态平衡，先活下来再追求长期'
  - '**核心定义**'
  - '- 好模式短期未必是好生意；好生意短期未必是好模式。长期坚持模式，短期灵活拿下好生意'
  - '**关键性质**'
  - '- 模式决定长期上限，生意决定短期生存'
  - '- 灵活切换不改变模式：在模式框架内寻找短期高确定性项目'
