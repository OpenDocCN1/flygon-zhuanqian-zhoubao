paper: docs/202306/OpXIdbXvZoXp1HxU0BLcH4TtnHe.md
desc: 该素材系统梳理了《商品和服务国际分类（尼斯分类）》第1-45类的完整框架，详细列出了每个大类的类别名称、类似群代码及群组名称，并配合图示阐述了商品/服务选择的三大核心原则（确定使用范围与类别、选取具体商品/服务项目、跨群组防御性保护）以及选择时的层级规范（严禁使用类别名/群组名，必须选取具体条目）。
concepts:
- name: 尼斯分类
  desc: 商品和服务国际分类体系，将商品划分为1-34类、服务划分为35-45类，是商标注册检索与管理的国际通用标准。
  is_original: false
  excerpt:
  - '### 第一类 ... ### 第四十五类'
- name: 类似群
  desc: 尼斯分类大类下的二级分类单元，用于区分功能、用途、原料或销售渠道相近的商品/服务，是商标近似判断的核心依据。
  is_original: false
  excerpt:
  - 0101 工业气体,单质
  - 0102 用于工业、科学、农业、园艺、林业的工业化工原料
  - 3501 广告
  - 3502 工商管理辅助业
- name: 商品/服务项目
  desc: 类似群下的最小颗粒度条目，是商标申报时必须填报的具体标的（如“灯泡”），不可使用类别名或群组名代替。
  is_original: false
  excerpt:
  - 而应该选的商品是：群组名称下面的“灯泡”。
  - 在选择商品或者服务项目时，不能使用类别名称或者类似群组标题名称；而应该选择类似群组下具体商品或服项目。
- name: 跨群组防御性保护
  desc: 在同一大类下，针对不同类似群组进行商标布局，以防止他人在非核心群组注册近似商标造成权利稀释。
  is_original: true
  excerpt:
  - 3-同类别不同群组的防御性保护策略
methods:
- name: __overview__
  desc: 商标商品/服务选择三步走方法论：1. 界定业务范围锁定大类；2. 映射实际经营项目至具体条目；3. 同类别跨群组布局防御。
  excerpt:
  - 1-确定商标所使用的范围（注册的商品主要是用来干什么的？）确定好类别（可以是多个类别）
  - 2-确定商品（实际销售/服务涉及到的）
  - 3-同类别不同群组的防御性保护策略
- name: 层级穿透选项法
  desc: 禁止在申报书中填写类别名称（如‘照明...装置’）或群组名称（如‘照明用设备、器具’），强制要求穿透至具体商品/服务条目（如‘灯泡’）。
  excerpt:
  - 在选择商品或者服务项目时，不能使用类别名称或者类似群组标题名称；而应该选择类似群组下具体商品或服项目。
  - 例如：第十一类的类别名称是：照明、加热... 1101群组的名称是：照明用设备、器具... 而应该选的商品是：群组名称下面的“灯泡”。
theorems:
- name: 商标保护范围由具体条目界定原则
  desc: 商标专用权的保护边界严格限定在核准注册的具体商品/服务项目上，类别名和群组名仅具导航功能，不产生法律保护效力。
  excerpt:
  - 在选择商品或者服务项目时，不能使用类别名称或者类似群组标题名称；而应该选择类似群组下具体商品或服项目。
- name: 业务实况与注册条目一致性原则
  desc: 商标注册的商品/服务项目必须与权利人实际使用或拟使用的业务范围精准对应，过宽会导致撤三风险，过窄会留保护真空。
  excerpt:
  - 1-确定商标所使用的范围（注册的商品主要是用来干什么的？）
  - 2-确定商品（实际销售/服务涉及到的）
findings:
- name: 第11类层级结构实证样本
  desc: '[evidence] 素材通过第11类‘照明、加热...装置’ -> 1101群组‘照明用设备、器具’ -> 具体商品‘灯泡’的三层结构图示，直观验证了‘类别-群组-项目’的层级穿透关系。'
  excerpt:
  - 例如：第十一类的类别名称是：照明、加热、蒸汽发生、烹饪、冷藏、干燥、通风、供水以及卫生用装置。
  - 1101群组的名称是：照明用设备、器具（不包括汽灯、油灯）
  - 而应该选的商品是：群组名称下面的“灯泡”。
- name: 历史版本演变痕迹记录
  desc: '[evidence] 素材在多个群组标注了版本变更历史（如#0117能源移入0407、#0917电弧焊接设备删除、#1608纸牌删除等），揭示了尼斯分类动态更新与商标实务适配的轨迹。'
  excerpt:
  - '#0117 能源（本类似群第九版时移入 0407 类似群）'
  - '#0917 电弧切割、焊接设备及器具'
  - '#1608 纸牌,扑克牌'
  - '#2506 特殊用鞋'
  - '#2610 茶壶保暖套'
- name: 服务类别（35-45类）群组编码非连续性发现
  desc: '[evidence] 第42类群组编码呈现跳跃分布（4209, 4210, 4211, 4212, 4213, 4214, 4216, 4217,
    4218, 4220, 4227），缺失4215, 4219, 4221-4226，疑为历史版本合并删除或预留编码。'
  excerpt:
  - 4209 提供科学技术研究服务...
  - 4210 提供地质调查、研究、开发服务
  - 4211 提供化学研究服务
  - 4212 提供生物学、医学研究服务...
  - 4227 单一服务
