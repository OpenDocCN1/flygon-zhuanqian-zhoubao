'no': 1
name: 认知破局 —— 从“打工者思维”到“赚钱者思维”的跃迁
desc: 本章系统梳理普通人实现财富跃迁的核心认知障碍与破解路径。通过对比“考985 vs 年入百万”“出卖时间 vs 经营资产”“理论学习 vs 实战试错”等思维范式，揭示认知升级的本质是主观能动性的释放与商业模型的重构，为后续实战方法论奠定底层逻辑基础。
nodes:
- 'no': 1
  name: 年入百万 vs 考985：难度与确定性的认知重构
  desc: 对比标准化考试路径与商业变现路径，揭示高考受先天因素锁定、评价单一、逆袭概率低；而赚钱拥有赛道可选、红利可捕捉、评价多元等后天可控变量，主观能动性释放空间远大于应试教育。
  role: motivation
  src:
  - paper: docs/202306/20230613_080.md
  - paper: docs/202306/20230613_081.md
  - paper: docs/202306/20230613_082.md
  - paper: docs/202306/20230613_083.md
  - paper: docs/202306/20230613_084.md
  - paper: docs/202306/20230613_085.md
  - paper: docs/202306/20230613_086.md
  - paper: docs/202306/20230613_087.md
- 'no': 2
  name: 出卖时间 vs 经营资产：商业模型的层级跃迁
  desc: 系统阐述赚钱四阶段模型：出卖时间劳动力(血酬) -> 产品/服务变现(超级个体) -> 商业系统杠杆(资源构建者) -> 多系统整合(高维整合者)；揭示打工本质是帮中介完成交易、薪资经层层筛减，唯有构建零边际成本产品(媒体/代码)实现时间复用，才能突破财务自由天花板。
  role: definition
  src:
  - paper: docs/202306/20230613_177.md
  - paper: docs/202306/20230613_182.md
  - paper: docs/202306/20230613_253.md
- 'no': 3
  name: 信息差与认知套利：普通人低成本跨越阶层的核心抓手
  desc: 定义信息差为认知、资源、渠道维度的非对称信息；通过百篇精华帖实证，揭示信息差变现本质是‘中间人经济’(分销、转介绍)，核心在于‘视角一变，商机无限’——从打工者视角切换至中介/分销视角，将辛苦挣钱转化为弯腰捡钱。
  role: method
  src:
  - paper: docs/202306/20230613_004.md
  - paper: docs/202306/20230613_080.md
  - paper: docs/202306/20230613_093.md
  - paper: docs/202306/20230613_251.md
- 'no': 4
  name: 快钱慢钱辩证法：目的决定做法，阶段决定策略
  desc: 打破‘快钱/慢钱’二元对立道德评价，提出‘创业目的论’：创业无标准答案，合理性仅取决于创业者主观目的(改善生活 vs 缔造伟大)；在巨大不确定性下落袋为安赚快钱是优选；快钱可为慢钱积累第一桶金(霍英东、芒格案例)，二者构成时序链条而非对立面。
  role: method
  src:
  - paper: docs/202306/20230613_006.md
- 'no': 5
  name: 做题家 vs 出题家：身份决定视界与收益上限
  desc: 区分被动接受规则优化答案的‘做题家’与主动定义规则创造标准的‘出题家’；主张普通人应完成身份跃迁，引入第一性原理、反脆弱、边际复制成本等高阶思维模型作为认知工具包，从规则内竞争存量转向规则外创造增量。
  role: definition
  src:
  - paper: docs/202306/20230613_088.md
- 'no': 6
  name: 理论-实践鸿沟：书本没有的商业生存技能
  desc: 基于芒格‘提价增量’行贿案例，揭示正规商业理论系统性回避回扣、办公室政治、保护费、恶意竞争、房东毁约等灰色地带；论证实践认知只能通过直接投身实战、在具体冲突中积累隐性知识，理论学习者入行必‘懵逼’。
  role: limitation
  src:
  - paper: docs/202306/20230627_003.md
- 'no': 7
  name: 生意本质三维模型：满足个体/群体/标准化需求的交易逻辑
  desc: 将生意拆解为三类需求满足模式：满足特定个体(高客单/非标，交易劳动力/金钱/智力)、满足特定群体(解决认知焦虑的知识付费)、满足客观标准化需求(红海标品)；提出个人商业模式组合升级法：1个现金流传统生意+1个认知变现知识付费+1个优质甲方陪跑咨询。
  role: method
  src:
  - paper: docs/202306/20230627_004.md
- 'no': 8
  name: 职场四层次进化与降维打击策略
  desc: 构建职场能力进化四阶段：专业做事 -> 满足上级利益建立不可替代性 -> 为自己操盘事业版图 -> 选择正确商业模式赛道；揭示每层天花板由外部结构决定(可替代性/老板瓶颈/模式杠杆/资源门槛)；主张‘降维打击’——在当前竞争维度低一级运作认知与能力，将四种能力作为工具箱灵活调用而非线性阶梯。
  role: method
  src:
  - paper: docs/202306/20230613_098.md
- 'no': 9
  name: 认知觉醒五维重构：钱的本质、富人思维、去低认知、资源积累、反节省时间
  desc: 基于个人优势测评(学习/思维/成就前三)的实战复盘，提炼认知觉醒五维度：1.钱是交换价值而非拥有物 2.模仿有钱人底层逻辑 3.去除消耗资源型做事
    4.重新理解钱为积累资源 5.不节省低价值时间而投资高杠杆活动；验证‘扬长避短优于补短板’与‘认知觉醒是变现前置必要条件’。
  role: method
  src:
  - paper: docs/202306/20230613_100.md
- 'no': 10
  name: 时间即生产资料：四大时间成本模型与零边际成本杠杆
  desc: 基于李笑来演讲核心观点，确立时间为终极生产资料；拆解商业模型四大时间成本(生产/再生产/学习/销售)；证明再生产时间成本趋近零(写书、直播带货、代码、媒体)是实现指数级财富增长的必要条件；普通人一生可售时间仅占总寿命10%，直接出售时间天花板极低。
  role: definition
  src:
  - paper: docs/202306/20230613_101.md
- 'no': 11
  name: 模仿律与组合拳创新：商业进化的底层规律与反模仿壁垒
  desc: 基于塔尔德《模仿律》揭示‘世界本质无原创，皆为模仿结果’；总结模仿四大规律(从上到下、几何扩散、先内后外、文化优于物质)；论证单一创新无法阻挡模仿，唯有‘组合拳创新’(组织、选址、用工、供应链、分配多维耦合)或‘持续创新’能显著提升模仿难度，以南城香、戴森为反模仿典范。
  role: method
  src:
  - paper: docs/202306/20230613_093.md
- 'no': 12
  name: 商业3.0时代与代运营2.5模式：认知红利与效率提升的结构性套利
  desc: 划分经济三阶段(1.0鸡毛换糖/2.0商铺平台/3.0知识认知)；定义代运营2.5为连接2.0向3.0转型的中介模式，核心价值来自对新商业模式的认知理解(只做1-10提升效率)；构建‘轻资产主体+深度利益捆绑合伙人+项目独立核算+知识壁垒积累’的操盘体系，实现低固定成本撬动高增量收益的结构性套利。
  role: method
  src:
  - paper: docs/202306/20230613_178.md
  - paper: docs/202306/20230613_250.md
- 'no': 13
  name: 千万商业模式顶层设计：好产品、高利润、上规模的三要素与裂变式阿米巴
  desc: 确立年入千万商业模式三支柱：好卖产品(定生死)、巨大的利润(高客单/高毛利)、能做规模(人/钱的规模)；提出选品策略‘信息差碾压’替代‘稀缺定价’、‘赚有钱人零花钱’避开‘赚穷人生活费’；创新‘裂变式阿米巴’四步飞轮：阶梯产品矩阵+阿米巴分销团队+付费流量招募合伙人+从合伙人筛选人才开发新品。
  role: method
  src:
  - paper: docs/202306/20230613_254.md
- 'no': 14
  name: 财富即权势即拿捏：提取剩余价值的底层法则与三层级模型
  desc: 定义财富为‘持续从社会提取剩余的能力’，底层法则为‘对他人施加得利或损害’；构建三层商业模式：L1血酬(出卖时间，将被AI取代)、L2稀缺社会资源租金(守擂/攻擂博弈)、L3制定规则/建生态做庄家(赢家通吃)；升华‘拿捏’本质：提供价值完成绑定，实现对他人劳动剩余的持续定向提取。
  role: definition
  src:
  - paper: docs/202306/20230613_182.md
