paper: docs/202306/XrRvdOo4pocodMxYS65cxihPnNb.md
desc: 该素材详细记录了作者“波光”从个人玩家转型为多多视频MCN机构负责人的全过程，核心在于揭示了通过“招募达人-赋能培训-分佣结算”模式的三次迭代（1.0自给自足、2.0雇佣/直招达人、3.0合伙人裂变），如何利用组织架构重构与利益分配机制，将不确定的单账号收益转化为确定性的规模化被动收益。文中毫无保留地拆解了MCN入驻、Boss直聘引流、达人邀约绑定、团队分工、选品视频投喂、合伙人分润及风控协议等全链路标准化操作手册（SOP），并复盘了营业执照被封、微信承接瓶颈、合伙人单飞等核心坑点及应对策略，最终升华为“产品可替代，模式不可复制”的商业模式论。
concepts:
- name: 多多视频MCN模式迭代论
  desc: 作者将多多视频带货运营历程划分为三个版本：1.0团队自运营（自给自足）、2.0直招达人分佣（赚确定性的钱）、3.0招募合伙人裂变（被动收益/学会分钱），核心逻辑是从‘人找视频’转向‘人找人、人管人’，通过组织架构升级对冲单账号收益的不确定性。
  is_original: true
  excerpt:
  - 多多视频1.0：自给自足（不确定以后能赚钱）
  - 多多视频2.0：初步尝试（赚确定性的钱）
  - 多多视频3.0：被动收益（学会分钱是大智慧）
  - 只有用大量的人员，账号跟这个不确定性做对冲，从而继续在多多视频这个项目上，赚到确定性的钱。
- name: 达人邀约绑定SOP
  desc: 基于拼多多官方MCN后台的一套标准化操作流程，涵盖机构入驻、多多进宝绑定、后台邀约发送、达人端实名/发视频/同意签约三步走，以及邀约失败的6种异常情况码对应解决方案。
  is_original: true
  excerpt:
  - 首先需要一个拼多多自己的官方MCN平台...MCN申请好之后，先要绑定多多进宝。
  - 这里点击发送合作邀约，可能会出现6种情况！1.邀约成功 2.账号未实名 3.未找到该账户 4.该账户已绑定其他机构 5.该账户已绑定机构 6.重复的邀约
  - 达人这边很简单，其实只需要做3个动作，分别是实名，发2个视频，以及同意签约机构。
- name: Boss直聘引流流量密码
  desc: 作者总结的低成本、大规模获取达人线索的招聘渠道打法：利用新注册账号发布职位、不主动回复、不发链接/二维码、控制聊天频次、偶尔下架职位等反直觉操作规避封号，实现‘新号不回复反而有人来’的流量红利。
  is_original: true
  excerpt:
  - Boss直聘的流量密码，新注册账号发布职位，不回复就会有很多人
  - 不能发链接，和二维码，我们遇到过有1000多个消息还没来得及回复，就被嘎了。
  - 可通过减少每天聊天频次，偶尔下架招聘信息，主动联系别人等方式...降低封号的概率
- name: 合伙人分润与风控体系
  desc: 3.0阶段核心机制：将招聘、社群运维、达人管理下放给合伙人，机构仅保留选品赋能、结算兜底、机构绑定权；通过签署协议、强制绑定机构PID、让利大头佣金、定期会议同步玩法，构建‘各司其职、利益绑定、可控风险’的裂变组织。
  is_original: true
  excerpt:
  - 我们把模式从招达人，改为招合伙人，我们只需要对合伙人负责，招聘的玩法，社群的维护，都由合伙人负责，我们把手里的佣金比例让出去一大半
  - 合伙人，全部都要签协议...并且达人必须要绑定在我们的机构下面
  - 每周五合伙人都有固定会议，互相了解一下近况，以及同步自己的最新玩法
- name: 选品视频投喂机制
  desc: 机构核心赋能手段：建立过爆款产品库与万级视频素材库，达人获取带货资格（50个热门爆款）前由机构提供过爆款产品及视频；获取资格后，机构每周直播赋能选品思路，每日定时投喂高出单概率商品ID及对应视频，实现达人‘无脑搬运/发布’即可出单。
  is_original: false
  excerpt:
  - 先获取下个月的带货资格，也就是50个热门爆款，这里我们会给达人提供过爆款的产品，以及我们公司上万个积累的视频。
  - 每周给达人直播，赋能选品思路，每天提供出单几率比较大的商品ID，以及对应的视频
  - 达人没空自己选品的时候，就可以直接用我们每天提供的选品以及视频。
methods:
- name: __overview__
  desc: 多多视频MCN规模化运营全链路方法论：以MCN机构为法律/结算主体，通过Boss直聘低成本获客/合伙人裂变扩规模，以标准化邀约SOP绑定达人PID，以每日选品视频投喂+周度直播赋能为核心运营动作，以分润协议+机构强绑定为风控手段，实现‘量大出奇迹’的带货分佣模型。
  excerpt:
  - 底层逻辑很简单，招人，给他们赋能，然后分佣。
  - 团队链接了2-30位合伙人，账号也从几百暴增到了12000+，现在每天还以1-300的速度增长
  - 多多带货视频是没啥基础的，就是量大出奇迹，就怼量就完事了
- name: MCN机构入驻与PID绑定流程
  desc: 拼多多官方MCN平台（mcn.pinduoduo.com）入驻标准化步骤：准备营业执照、法人身份证、手机号、3个未绑定机构的多多号 -> 提交审核
    -> 后台绑定多多进宝PID -> 获得统一邀约、管理、结算权限。
  excerpt:
  - 首先需要一个拼多多自己的官方MCN平台...地址：https://mcn.pinduoduo.com
  - 需要提供营业执照，一个手机号，法人身份证正反面，以及3个没有绑定过机构的多多号
  - MCN申请好之后，先要绑定多多进宝。
- name: 达人邀约绑定标准化作业
  desc: MCN后台邀约达人的5步操作流（签约作者->邀约主播/成员->选择合作类型->填写视频号/截止时间->发送邀约）及达人端配合的3步动作（实名认证->发布2个非图片生成视频->同意邀约），并建立6类邀约异常码对应处理预案。
  excerpt:
  - 第一步：点击签约作者 -> 第二步：点击右上角 邀约主播/成员 -> 第三步：选择 直播合作、视频带货合作 -> 第四步：填写多多视频号，选择签约截止时间
    -> 第五步：点击下一步，点击发送合作邀约
  - 达人这边很简单，其实只需要做3个动作，分别是实名，发2个视频，以及同意签约机构。
- name: Boss直聘批量获客与防封操作规范
  desc: 利用Boss直聘招募达人的实操打法：主营执照轮换（死执照测试）、新号发职位不回复引主动咨询、严禁发链接/二维码、控制聊天频次/偶尔下架职位降权重、引导加微信入群转化（测算转化率约30%）、建立微信号矩阵解决承接瓶颈。
  excerpt:
  - Boss直聘的流量密码，新注册账号发布职位，不回复就会有很多人
  - boss直聘经常封号，不能发链接，和二维码
  - 在boss直聘聊100人，可以转化到微信群6-70人，详细了解过后，还想继续做的，只剩30人左右，总体转化率在30%左右。
  - 前端大量进人，后端没有更多的微信号承接，导致微信号被添加频繁（这一直是我们在攻克的问题）。
- name: 合伙人裂变与分级管理体系
  desc: 3.0阶段组织变革方法：机构招募合伙人（而非直招达人）-> 合伙人自负招聘/社群/培训成本 -> 机构让利大头佣金（保留选品/结算/风控核心）->
    合伙人/达人强签协议+强绑PID -> 周度会议同步玩法/数据 -> 小助理监控爆单达人触发补单机制。
  excerpt:
  - 我们把模式从招达人，改为招合伙人，我们只需要对合伙人负责，招聘的玩法，社群的维护，都由合伙人负责，我们把手里的佣金比例让出去一大半
  - 合伙人，全部都要签协议...并且达人必须要绑定在我们的机构下面
  - 小助理可以及时发现爆单的达人，可以迅速反应，让达人补视频。
  - 每周五合伙人都有固定会议，互相了解一下近况，以及同步自己的最新玩法
- name: 每日选品视频投喂与赋能SOP
  desc: 机构运营团队的标准化产出流程：选品组（3人）每日筛选高转化商品ID -> 素材组匹配/剪辑对应带货视频 -> 运营组（小助理）定时推送至合伙人/达人群
    -> 达人一键发布 -> 机构后台监控数据 -> 爆单账号触发补单/加投建议。
  excerpt:
  - 3人负责选品，以及公司剩余账号的更新
  - 每天提供出单几率比较大的商品ID，以及对应的视频
  - 老图新用，这个就是每天投喂的记录
  - 每周给达人直播，赋能选品思路
theorems:
- name: 确定性收益源于规模对冲不确定性定律
  desc: 单账号带货收益具有高方差不确定性，仅通过组织规模扩张（账号数×达人数）实现概率分布的大数定律收敛，将‘可能赚钱’转化为‘稳定赚钱’，是MCN模式盈利的数学基础。
  excerpt:
  - 只有用大量的人员，账号跟这个不确定性做对冲，从而继续在多多视频这个项目上，赚到确定性的钱。
  - 多多带货视频是没啥基础的，就是量大出奇迹，就怼量就完事了，出爆款概率可能就是10%，但是达人的号到了一定程度之后，这个概率就是100%的
- name: 分钱即分配权：被动收益的组织设计公理
  desc: 创始人管理半径有限，必须放权给合伙人（下放招聘/运营/社群），并让渡大头利益（佣金分润），仅保留核心资源（选品库/结算权/机构主体/PID绑定权）与风控底线（协议/绑定），方能实现组织指数级扩张与创始人被动收益。
  excerpt:
  - 我很清楚自己的短板，我管理不了5万人，我还管理不了50人么？
  - tmd一个亿的盘子，你占1%就够了。我觉得很有道理，学会分钱是大智慧。
  - 我们把手里的佣金比例让出去一大半...我们只需要对合伙人负责
- name: 模式大于产品：商业模式可迁移性原理
  desc: 多多视频仅是当前承载模式的‘产品’，核心资产是‘招募-赋能-分佣-风控’的标准化商业模式；当平台红利消退或政策收紧时，该模式可平移至其他内容电商平台（如视频号、快手、抖音店播等）实现复利。
  excerpt:
  - 多多视频，只是这个模式里面的产品，假如多多视频不行了，我们可以把产品换成另一个平台，模式一样是不变的
  - 说人，是人情世故，说商业模式，才是核心思想
- name: 执行力筛选优于培训赋能
  desc: 在‘量大出奇迹’的低门槛带货模型中，前端筛选高执行力人群（如自带私域博主、懂实名/发视频基础操作者）的边际收益，远高于后端对低执行力小白的培训投入；招聘渠道决定人群质量，人群质量决定运营成本。
  excerpt:
  - 跟自带私域的博主链接...他们的私域执行力没的说，多多项目最需要的就是执行力
  - boss来的人真的有不少人不会（实名），虽然听起来很小的一件事
findings:
- name: 1.0阶段验证：单账号纯利优势与规模化可行性
  desc: '[evidence] 团队鲁班爆款视频搬运至多多视频，单月佣金2-3千（纯利，无广告费），折合ROI极高；扩充至100+账号、人均15号/月后，3个月实现月均佣金20万，验证了‘无脑搬运+矩阵号’的跑通路径。'
  excerpt:
  - 同事就把爆单的视频，拿到了多多视频上面，也爆了...佣金好像也就2-3000，但是员工的一句话点醒了我：这个就是纯利，不要花广告费。
  - 这个项目我们3个月后，成功上岸了，平均每月的佣金在20万左右。
- name: 2.0阶段验证：Boss直聘获客模型与转化漏斗数据
  desc: '[evidence] Boss直聘半月引流3-400人，转化入群60-70%，意向留存30%（约30人/百人)；首批200达人首月总佣金2万+，次月运营深耕后增至3万+，单号均值下降但总量上升，验证‘量大出奇迹’但运营成本随人数线性增长的瓶颈。'
  excerpt:
  - 半个月我们这边就涌入了3-400达人
  - 在boss直聘聊100人，可以转化到微信群6-70人...还想继续做的，只剩30人左右，总体转化率在30%左右。
  - 第一个月这200人总收益在2万出头...次月收益达到了3万多
- name: 3.0阶段验证：合伙人裂变实现指数级账号增长
  desc: '[evidence] 引入合伙人模式后，团队从直招200人瓶颈突破，连接20-30位合伙人，机构绑定账号从几百暴增至12000+，日增1-300账号，创始人脱离一线运营实现被动收益，验证组织架构重构的杠杆效应。'
  excerpt:
  - 到目前，我们团队链接了2-30位合伙人，账号也从几百暴增到了12000+，现在每天还以1-300的速度增长
  - 我们团队又开始了新的规划...正式进入多多视频被动收益阶段
- name: 线下结算与官方扶持的增量收益空间
  desc: '[claim] 作者宣称已与上百商家深度合作开展线下结算（规避平台10%技术服务费），且官方MCN扶持政策正从内容/直播向带货倾斜，预期将进一步提升利润率与账号权重。'
  excerpt:
  - 我们还在跟上百个商家深度合作，有些品可以直接走线下结算，不用被平台扣掉10%的佣金
  - 官方也在对MCN进行各种扶持...关于带货部分近期跟官方沟通，后面是有相对应的扶持政策，正在规划中。
- name: 核心坑点复盘：执照/法人消耗、微信承接、合伙人背叛
  desc: '[evidence] 实操中踩中四大致命坑：1) 前期不懂规则导致几十营业执照/十几法人被封（沉没成本高）；2) 前端流量大、后端微信号矩阵不足导致高频加人触发风控（持续攻克中）；3)
    合伙人单飞风险（需协议+绑定PID+持续赋能防御）；4) 早期因品牌偏见错过个人红利期（认知偏差成本）。'
  excerpt:
  - 前期不懂boss直聘的招聘规则，被封了几十个营业执照，加上十几个法人，以及营业执照。
  - 前端大量进人，后端没有更多的微信号承接，导致微信号被添加频繁（这一直是我们在攻克的问题）。
  - 合伙人单飞，需要完善合伙人制度，给予合伙人更多的能量，增强自身竞争力。
  - 被拼多多品牌影响，忽略多多视频的价值，错过了个人玩法的最佳红利期。
