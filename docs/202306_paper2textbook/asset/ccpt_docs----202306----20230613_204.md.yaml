paper: docs/202306/20230613_204.md
desc: 该素材是一篇简短的推广/引流文案，作者“老船长李阳”分享其向 ChatGPT 咨询“风水命理/6+2卦玄学内容如何规避平台敏感词审核、防止被删除封号”的过程，并将
  ChatGPT 的详细回复通过外部链接（飞书文档）形式分享，旨在为同领域内容创作者提供合规运营思路。
concepts:
- name: 风生水起/6+2卦玄学内容
  desc: 素材涉及的特定命理内容品类，属于平台审核重点打击的‘封建迷信’或‘非科学’敏感领域，创作者需特殊处理才能生存。
  is_original: false
  excerpt:
  - 风生水起，6+2 卦玄学方面方面怎么规避敏感被删除被封号的问题
- name: 内容合规/规避敏感词策略
  desc: 针对高风险领域内容，通过话术替换、学术化表达、心理咨询框架包装等手段，规避平台自动审核与人工复核，实现账号长期存活的核心运营概念。
  is_original: false
  excerpt:
  - 有什么好的方法可以规避风水命理类内容不被删除
  - 内容敏感词太多，大家移步飞书吧
- name: AI辅助合规咨询
  desc: 利用大语言模型（ChatGPT）作为合规顾问，生成特定领域的规避审核方案，体现了AI在内容运营风控中的工具属性。
  is_original: false
  excerpt:
  - 看 chatgpt 怎么分析
  - 我先问：好的 ，有什么好的方法可以规避风水命理类内容不被删除
methods:
- name: __overview__
  desc: 素材展示的整体方法论为：提问大模型获取合规方案 -> 将长文本方案托管至外部文档工具（飞书）规避正文敏感词触发 -> 发布引流帖导流至私域/外部文档获取完整方案。
  excerpt:
  - 我先问：好的 ，有什么好的方法可以规避风水命理类内容不被删除
  - 内容敏感词太多，大家移步飞书吧
  - '[看 chatgpt 怎么分析：风生水起，6+2 卦玄学方面怎么规避敏感被删除封号](https://und276ymfr.feishu.cn/docx/KKACdp31KoAyyuxTpHEcA3a2nhd)'
theorems:
- name: 高敏感领域内容需‘外部托管+AI生成方案’双重保障
  desc: 核心主张：对于风水命理等极易触发敏感词的领域，单纯依赖平台内发布极易违规，最优解是利用AI生成系统性合规方案，并将核心干货迁移至飞书等受审核干扰较小的外部载体，通过引流方式分发。
  excerpt:
  - 废话不多说，看看现在 chatgpt 大数据怎么说，或许会给你一些启发。
  - 内容敏感词太多，大家移步飞书吧。
findings:
- name: ChatGPT可输出系统性风水命理合规运营方案
  desc: '[claim] 作者宣称已向 ChatGPT 提问并获得针对‘6+2卦/风生水起’领域的规避敏感词、防封号详细分析，且内容详实到‘敏感词太多’无法直接在正文展示。'
  excerpt:
  - 看看现在 chatgpt 大数据怎么说，或许会给你一些启发。
  - 内容敏感词太多，大家移步飞书吧。
- name: 飞书文档作为敏感内容载体的有效性验证
  desc: '[evidence] 素材本身即为证据：作者成功在平台（语雀/公开渠道）发布了包含‘风水命理’、‘规避敏感词’、‘防封号’等高风险关键词的引流帖，并通过飞书链接承载核心违规内容，验证了‘正文洗白+外链承载’的实操可行性。'
  excerpt:
