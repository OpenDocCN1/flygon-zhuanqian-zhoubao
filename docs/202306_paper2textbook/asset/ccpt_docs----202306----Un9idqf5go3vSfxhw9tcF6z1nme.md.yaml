paper: docs/202306/Un9idqf5go3vSfxhw9tcF6z1nme.md
desc: 该素材是一篇面向大众的AI声音克隆实操教程，以制作“AI孙燕姿”为核心案例，系统梳理了从零基础一键生成、借用开源模型本地推理、到自建数据集训练专属模型的三条完整技术路线，详细记录了Ultimate
  Vocal Remover (UVR5) 与 So-VITS-SVC 4.0 整合包的安装配置、参数调优、音频预处理（分离/去混响/切片）、模型训练监控及推理合成全流程，并提供了配套软件包与模型资源下载链接。
concepts:
- name: AI声音克隆
  desc: 利用深度学习模型学习特定目标说话人/歌手的音色、音高、语调等声学特征，实现将任意源音频的人声转换为目标音色的技术，本文以孙燕姿为案例演示全流程。
  is_original: false
  excerpt:
  - 将大量孙燕姿本人的声音喂给AI，AI自动学习之后形成了一个声音的模型，然后用这个模型去唱别人的歌，出来的歌曲就真的跟孙燕姿翻唱了别人的歌一样
  - 让大家除了AI孙燕姿外，还能做一个AI自己，让你的声音可以唱任何你喜欢的歌曲
- name: So-VITS-SVC (Sovits)
  desc: 基于VITS (Variational Inference with adversarial learning for end-to-end Text-to-Speech)
    和 Soft-VC (Content Encoder) 架构的开源歌声转换框架，是本文核心训练与推理工具，支持零样本或少样本音色迁移。
  is_original: false
  excerpt:
  - 把原歌曲的人声换成孙燕姿的声音：用到的软件是 So-VITS-SVC（后面简称 sovits）
  - 这里我们用到的是B站羽毛布団的整合包
  - 在“训练”的界面开始训练我们的模型
- name: Ultimate Vocal Remover (UVR5)
  desc: 基于深度学习的音频源分离工具，用于将混合音频分离为人声与伴奏，并支持人声去混响/去回声处理，是本文数据预处理与推理前准备的核心工具。
  is_original: false
  excerpt:
  - 分离歌曲里面的人声和伴奏：用到的软件是 Ultimate Vocal Romover（后面简称uvr）
  - 提取声音用的还是这个软件：Ultimate Vocal Romover（uvr）
  - 参数按照图片中的设置...点击“Start Processing”
- name: 数据集制作流程
  desc: 构建高质量训练数据集的标准化工程流程，包含素材收集（≥30分钟干净音频）、预处理（UVR5分离伴奏与去混响）、命名规范（纯英文/数字/下划线）、切片（3-15秒片段）四个关键环节。
  is_original: true
  excerpt:
  - 制作一个素材库，包括了以下三个步骤：1. 收集素材 2. 处理素材 3. 切割素材
  - 素材的要求：1.时长：至少在30分钟以上 2.素材要尽量的干净清晰... 3.不要为了凑素材时长加一些低质量的声音！！
  - 这些文件名不能包含中文 最好最用数字字母、下划线
  - 把这些音频全部切成3~15秒左右的小片段 这样才能保证模型训练的质量和速度
- name: 推理
  desc: 指使用已训练好的声学模型，对输入的源人声音频进行音色转换（Voice Conversion）生成目标音色音频的过程，包含模型加载、f0预测器选择、音高偏移设置等关键参数配置。
  is_original: false
  excerpt:
  - 接下来就是将李荣浩的声音换成孙燕姿的声音 这一步也分为了三个步骤... 3. 替换声音... 在这个软件里面叫做“推理”
  - “f0预测器”选择成crepe，其他参数不用动 最后点击“音频转换”
- name: Loss值监控
  desc: 模型训练过程中 `reference_loss` 指标的实时观测标准，用于判断模型收敛质量：>40为残次品，30-40勉强可用，20-30较好，<10为优质模型。
  is_original: true
  excerpt:
  - 这里面我们只要关注最后面的“reference_loss”的值 这个数字越小，说明模型训练的越好，模型的声音越接近本人
  - loss值是40多：残次品，不能用 loss值是30多：勉强能用 loss值是20多：已经很不错了 如果loss值是10多，那就是一个很好的模型了
- name: 整合包
  desc: 由社区开发者（如B站UP主羽毛布団）预先配置好Python环境、依赖库、模型权重及WebUI界面的压缩包，解决了原生开源项目环境配置复杂、依赖地狱等入门难题。
  is_original: false
  excerpt:
  - 这里我们用到的是B站羽毛布団的整合包，整合包点击链接就可以下载
  - 下载链接里的《2.so-vits-svc》，保存到自己电脑 然后解压sovits的压缩包到D盘或者E盘
methods:
- name: __overview__
  desc: 分层级渐进式AI声音克隆教学法：L1-云端SaaS一键生成（TuneFlow）→ L2-本地开源工具链推理（UVR5 + So-VITS-SVC +
    预训练模型）→ L3-本地全流程自训练（数据集构建 → 参数配置 → 训练监控 → 推理），覆盖零基础到进阶开发者的完整技能树。
  excerpt:
  - 目前我们制作一个AI孙燕姿有三种方法： 1.用傻瓜式软件，一键式生成AI孙燕姿 2.用别人的模型，做自己的AI孙燕姿 3.自己炼一个模型来制作AI孙燕姿
  - 第一种方法生成出来的AI孙燕姿...但有一个缺点就是：哪怕这个软件是下载到我们电脑的，但它用的是官方的服务器...第二个方法...能不能正常运行只取决于我们自己的电脑配置
- name: TuneFlow一键生成法
  desc: 基于云端算力的集成化Web/客户端工作流：新建项目 → 导入音频 → 智能音频分轨(源分离) → 智能变声器(音色迁移，选择YZ模型) → 静音其余轨道
    → 导出整首歌曲。
  excerpt:
  - 1.导入要演唱的歌曲，分离歌曲里面的人声和伴奏 2.把原歌曲的人声换成孙燕姿的声音 3.导出一首孙燕姿歌声+伴奏的新歌曲
  - 鼠标右键点击音频轨道 “运行插件”——“选中的片段”——点击“智能音频分轨”
  - 鼠标右键点击人声的轨道 “运行插件”——“选中的片段”——“智能变声器”...“YZ”就是孙燕姿的声音
- name: 本地推理标准工具链 (UVR5 + So-VITS-SVC)
  desc: 离线本地化部署方案：环境准备(解压整合包至非C盘、配置模型文件至logs/44k与configs) → 数据预处理(UVR5两级分离：乐器分离 →
    人声净化) → 模型推理(So-VITS-SVC加载G/Kmeans/config → 上传干净人声 → f0预测器Crepe → 音频转换) → 后期合成(剪映对齐人声伴奏导出)。
  excerpt:
  - 1.选一首要演唱的歌曲，分离歌曲里面的人声和伴奏：用到的软件是 Ultimate Vocal Romover（后面简称uvr） 2.把原歌曲的人声换成孙燕姿的声音：用到的软件是
    So-VITS-SVC（后面简称 sovits） 3.将孙燕姿歌声+伴奏合并到一起：用到的软件是 剪映
  - 把文件夹里面的压缩包解压到 刚刚下载的uvr里面的models文件夹
  - 复制“sun G_27200”和“sun Kmeans_10000”这两个文件 来到sovits文件夹，找到logs文件夹里的44k文件夹，把这两个文件粘贴进去
    再把剩下的“sun config”那个文件复制到sovits文件夹中的configs文件夹
  - “f0预测器”选择成crepe，其他参数不用动 最后点击“音频转换”
- name: 自训练模型全流程
  desc: '端到端模型训练方法论：硬件门槛(N卡≥6GB VRAM) → 数据工程(收集≥30min → UVR5两阶段净化 → 重命名 → Sovits内置切片3-15s
    → 放入dataset_raw) → 训练配置(Encoder: vec768l12, f0: crepe, Batch Size依显存设定) → 训练执行(数据预处理
    → 写入配置 → 从头训练) → 监控停止(Ctrl+C监控reference_loss≤20) → 模型导出(推理页加载最新G模型)。'
  excerpt:
  - 炼模型可以分为两步：1.制作素材库 2.训练模型
  - 素材的要求：1.时长：至少在30分钟以上 2.素材要尽量的干净清晰...
  - 打开sovits，在最新版本里面更新了一个音频切片的工具...点击开始切片
  - 把刚刚保存切片的文件夹重命名...放到sovits文件夹里的“dataset_raw”文件夹...注意注意！！是整个文件夹放进来
  - “编码器”——vec768l12 “f0预测器”——crepe 然后点击“数据预处理”...点击“写入配置文件” 显示配置写入完成就点击“从头开始训练”
  - 看到每训练200步就会出现一条比较长的信息...关注最后面的“reference_loss”的值
  - 暂停的方法：1.按Ctrl+C 2.关掉黑色框框 训练完回到推理的页面就可以看到我们炼出来的模型
- name: UVR5 两阶段音频净化法
  desc: 针对训练数据/推理输入的标准化预处理范式：Stage 1 (HP5/MDX-Net) 乐器分离分离人声/伴奏 → Stage 2 (VR-DeEcho/DeReverb)
    对分离出的人声进行去混响/去回声净化，输出干声。
  excerpt:
  - ①分离伴奏...参数按照图片中的设置...点击“Start Processing”
  - ②让声音变得更加干净...我们这次导入的是刚刚分离出来的纯人声的音频...下面的参数要按照图片重新修改 点击“Start Processing”
  - 等音频处理好了之后，我们的文件夹会多一个后缀带有两个“Vocals”的音频
theorems:
- name: 数据质量决定模型上限
  desc: 训练数据的纯净度、时长充足度（≥30分钟）、单一说话人纯净度直接决定了So-VITS-SVC模型的音色相似度与自然度上限；垃圾进，垃圾出。
  excerpt:
  - 素材库的质量非常重要！！ 质量越高，出来的模型声音才越像本人
  - 素材的要求：1.时长：至少在30分钟以上 2.素材要尽量的干净清晰（至少后期能处理干净） 3.不要为了凑素材时长加一些低质量的声音！！
- name: 本地部署优于云端SaaS的可用性主张
  desc: 对于高频、长时长、隐私敏感的AI声音生成需求，本地部署开源工具链(UVR5+So-VITS-SVC)在可用性、稳定性、成本控制上优于依赖官方服务器算力的云端SaaS工具(TuneFlow)。
  excerpt:
  - 那个缺点就是：哪怕这个软件是下载到我们电脑的，但它用的是官方的服务器，很多人同时在用的话，可能有些功能就没法正常用了
  - uvr和sovits这两个软件是直接安装在我们自己电脑上的 能不能正常运行只取决于我们自己的电脑配置 那就不会因为软件官方出现问题，而影响到我们的使用
- name: 显存决定批量大小与训练可行性
  desc: NVIDIA显卡显存容量是So-VITS-SVC训练的硬性物理约束：6GB显存对应Batch Size=4，显存不足会导致OOM报错；无N卡或显存不足必须寻求云端租用方案。
  excerpt:
  - 炼模型对电脑配置是有要求的... 1.是NVIDIA的显卡(也就是N卡) 2.显卡的专用内存6GB以上
  - 注意“批量大小”的参数，6G显存就要填“4”，不然会出现显存报错
- name: Loss收敛阈值经验法则
  desc: So-VITS-SVC训练中 `reference_loss` 的数值区间与模型可用性存在强相关经验映射：>40不可用，30-40勉强，20-30良好，<10优秀；建议训练至1万步左右或Loss稳定在20以下。
  excerpt:
  - 这里面我们只要关注最后面的“reference_loss”的值 这个数字越小，说明模型训练的越好
  - loss值是40多：残次品，不能用 loss值是30多：勉强能用 loss值是20多：已经很不错了 如果loss值是10多，那就是一个很好的模型了
  - 一个好的模型训练1万步左右就差不多了
findings:
- name: TuneFlow云端算力瓶颈实测
  desc: '[evidence] 作者在撰写文章期间亲测TuneFlow因官方服务器显存耗尽导致“智能音频分轨”功能不可用，验证了云端SaaS模式在高并发下的服务不稳定性。'
  excerpt:
  - 在我写这篇文章之前，就因为官方的显存爆了，导致没办法进行音频分离
- name: UVR5两级处理显著提升人声纯净度
  desc: '[evidence] 实操对比显示：单次UVR5分离输出的人声仍含残留伴奏/混响，经第二轮“去混响/去回声”模型处理后，输出的双Vocals后缀音频显著更干净，适合作为高质量训练集或推理输入。'
  excerpt:
  - 现在听人声的那一条音频，声音是还不够干净的 我们还要单独把人声重新处理一遍
  - 等音频处理好了之后，我们的文件夹会多一个后缀带有两个“Vocals”的音频 这时候我们的音频就处理好啦！
- name: So-VITS-SVC 4.0整合包内置切片工具提效
  desc: '[evidence] 作者验证So-VITS-SVC 4.0 WebUI集成的“音频切片”功能可直接替代外部切片脚本（如slice_audio.py），支持批量加载文件夹、自动按静音/时长切分3-15秒片段，简化了数据集制作工具链。'
  excerpt:
  - 打开sovits，在最新版本里面更新了一个音频切片的工具 在这里我们就可以直接把音频切成小片段
  - 粘贴路径到sovits，然后点击“加载原始音频”...复制一个空文件夹的路径到“输出目录” 然后点击开始切片
- name: 模型文件命名与目录结构规范
  desc: '[evidence] So-VITS-SVC 4.0整合包要求模型文件严格放置：G模型与Kmeans聚类模型置于 `logs/44k/`，配置文件
    `config.json` 置于 `configs/`，且文件名需与配置内引用一致，否则WebUI无法识别加载。'
  excerpt:
  - 复制“sun G_27200”和“sun Kmeans_10000”这两个文件 来到sovits文件夹，找到logs文件夹里的44k文件夹，把这两个文件粘贴进去
  - 再把剩下的“sun config”那个文件复制到sovits文件夹中的configs文件夹
- name: 训练过程中断与恢复机制验证
  desc: '[evidence] 训练进程通过黑色终端窗口输出日志，支持 `Ctrl+C` 安全中断或直接关闭窗口停止；模型检查点按步数自动保存在 `logs/44k/`
    (命名为 `G_步数.pth`)，停止后可在推理页直接加载最新步数模型，无需手动查找。'
  excerpt:
  - 暂停的方法：1.按Ctrl+C 2.关掉黑色框框
  - 训练完回到推理的页面就可以看到我们炼出来的模型，G后面的数字就是训练的步数
- name: 推理阶段f0预测器选择Crepe效果最优
  desc: '[claim] 作者基于经验建议推理阶段将 `f0预测器` 固定选择为 `crepe` (而非 pm/harvest/rmvpe 等)，可获得更准确的基频提取，提升变声自然度与音准。'
  excerpt:
  - “f0预测器”选择成crepe，其他参数不用动
