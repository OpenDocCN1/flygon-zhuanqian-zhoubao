'no': 1
name: 实体商业选址 —— 物理位置决定流量上限，营销只是放大器
desc: 本章通过多个实战案例对比，揭示实体门店“选址>营销”的底层逻辑：自然流量曝光是核心护城河，优质物理位置自带精准客群，自媒体与营销手段仅能放大线下优势，无法创造不存在的流量。掌握选址工具包与评估模型，是实体创业成败的前置决策。
nodes:
- 'no': 1
  name: 选址决定生死，租金决定利润 —— 实体商业第一性原理
  desc: 地理位置带来的自然流量曝光是实体门店的核心利器，决定生意成败的上限；营销只能优化转化，无法创造不存在的自然流量。租金成本控制直接决定盈利空间与回本周期。
  role: theorem
  src:
  - paper: docs/202306/20230613_252.md
  - paper: docs/202306/20230613_295.md
  - paper: docs/202306/20230613_294.md
- 'no': 2
  name: 自然流量曝光 vs 线上营销 —— 认清自媒体的“放大器”本质
  desc: 自媒体营销的本质不是创造流量，而是放大主体已有的线下优势（产品、位置、服务、事件）。无优势者应通过“创造事件”来生成可记录、可传播的内容素材，而非凭空追求流量技巧。
  role: definition
  src:
  - paper: docs/202306/20230613_252.md
- 'no': 3
  name: 写字楼11层 vs 商场2层通道 —— 自然流量质变的实证对比
  desc: 作者亲历从写字楼11层搬迁至商场2层通道门面，租金大幅上涨但获得质变的自然曝光流量，直接支撑预售转化与长期经营，佐证“选址>营销”论断。
  role: experiment
  src:
  - paper: docs/202306/20230613_252.md
- 'no': 4
  name: 成人用品店“隐私首选址”原则 —— 平衡流量与心理负担
  desc: 成人用品无人店选址需平衡‘高流量’与‘高隐私’，首选社区、快捷酒店、城中村等流动性大但非主干道显眼位置，避免顾客进出被熟人目击产生心理负担。
  role: method
  src:
  - paper: docs/202306/20230613_295.md
- 'no': 5
  name: 选址风向标工具包 —— 百度热力图+竞品侧写+房产情报的组合拳
  desc: 一套组合选址工具链：百度热力图判断热度、地图同业分布拦截动线、贝壳找房判断消费实力、链家顾问获取楼盘入驻情报；配合实地骑行巡查验证线上热力与线下形态匹配度。
  role: method
  src:
  - paper: docs/202306/20230613_294.md
- 'no': 6
  name: 竞品连续观察法 —— 用垃圾箱反推选品，用销量变化验证坑位
  desc: 连续一周每天定时巡查竞品店，通过拍照对比货架销售变化判断畅销品，通过垃圾箱包装分析判断客群偏好，量化竞品销量与选品逻辑，验证目标坑位真实盈利能力。
  role: method
  src:
  - paper: docs/202306/20230613_294.md
- 'no': 7
  name: 选址评估清单法 —— 正负指标量化决策，规避主观臆断
  desc: 结合业态特性建立选址正负面清单：正向指标（社区密度、快捷酒店聚集、城中村/学校周边、租金可控）；负向指标（主干道、显眼角落、租金过高）。通过实地考察打分决策。
  role: method
  src:
  - paper: docs/202306/20230613_295.md
- 'no': 8
  name: 数据驱动运营诊断论 —— 转化漏斗拆解选址/选品/运营责任归属
  desc: 建立‘进店人数/购买人数’转化漏斗模型，通过转化率拆解判断经营不善根因：进店少=选址问题，进店多买少=选品/定价问题，据此精准归因而非盲目优化。
  role: method
  src:
  - paper: docs/202306/20230613_294.md
