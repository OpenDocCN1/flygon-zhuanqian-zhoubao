'no': 1
name: 微信私域生态实战 —— 从流量承接到变现放大的全链路打法
desc: 本章系统梳理微信私域生态下的核心运营方法论，覆盖账号安全合规、公私域流量互通、朋友圈内容体系构建、社群精细化运营、视频号内容与投流变现、公众号SEO与矩阵放大、AI辅助内容生产七大核心板块。旨在帮助学员建立从“搭建基建”到“规模化变现”的完整认知框架与可执行SOP。
nodes:
- 'no': 1
  name: 微信风控评分机制与账号安全基建
  desc: 揭示微信风控的打分制本质，确立“一卡一机独立网络”为账号存活的物理基准线，规避分身、云手机、脏IP等高危环境因子。
  role: definition
  src:
  - paper: docs/202306/20230613_035.md
- 'no': 2
  name: 环境合规大于行为合规的生存铁律
  desc: 论证账号运行环境的物理隔离度权重高于单次业务操作合规性，工具进程特征（如Wetool）本身即为强风控特征，长期依赖非官方工具将导致系统性崩塌。
  role: theorem
  src:
  - paper: docs/202306/20230613_035.md
- 'no': 3
  name: 异常值即红利：风控收紧期的逆向机会
  desc: 平台规则剧变导致的行业性灾难（异常值），倒逼出合规工具、咨询服务、迁移方案等刚性需求，是供给侧捕获超额利润的最佳窗口。
  role: motivation
  src:
  - paper: docs/202306/20230613_035.md
- 'no': 4
  name: 申诉解封应急预案与风控溯源排查法
  desc: 针对纯人工操作触发的误封（如拉群40人阈值），利用官方客服申诉快速解封；通过对比‘正常操作被封’与‘违规操作被封’差异，定位核心诱因在环境指纹而非业务动作。
  role: method
  src:
  - paper: docs/202306/20230613_035.md
- 'no': 5
  name: 公域流量私域化：对抗公域衰退的生存必选项
  desc: 公众号推送规则变化导致打开率暴跌、广告费缩水，唯有将读者引导至微信私域建立多触点触达机制，才能对抗公域流量衰退，实现收入增长与势能复利。
  role: motivation
  src:
  - paper: docs/202306/20230613_037.md
- 'no': 6
  name: 四大低成本引流钩子设计：收稿、社群、福利、资料包
  desc: 微信收稿引流法（以改稿换转发）、节日福利裂变引流法（众筹奖品+门槛筛白嫖）、建免费社群、送干货资料包，构建泛粉私域承接的标准化动作库。
  role: method
  src:
  - paper: docs/202306/20230613_037.md
- 'no': 7
  name: 引流产品与利润产品分层体系
  desc: 将私域产品划分为低价/零成本引流品（9.9社群、押金制打卡群）筛选高意向用户，与高客单利润品（助理班、运营课、分销佣金）实现核心变现，形成产品矩阵闭环。
  role: definition
  src:
  - paper: docs/202306/20230613_037.md
- 'no': 8
  name: 非标品分销变现：轻量化扩展变现路径
  desc: 基于对同行课程口碑调研筛选，推荐非竞品、互补型课程赚取佣金，号主充当资源整合者/百宝箱角色，实现变现路径轻量化扩展。
  role: extension
  src:
  - paper: docs/202306/20230613_037.md
- 'no': 9
  name: 朋友圈内容五板块规划法与黄金发布时间表
  desc: 标准化五大模块：同步公号文章、生活日常、持续宣传产品、安利好物/分销、研发新品；配合早/中/晚/睡前四大黄金时段，日更6-8条，广告占比初期20%-30%、上限50%，间隔1小时以上。
  role: method
  src:
  - paper: docs/202306/20230613_037.md
- 'no': 10
  name: 朋友圈自动成交系统：非营销感成交的布局模式
  desc: 从‘仅晒单’的低阶策略转向系统化布局，通过非营销感内容展示实力、搅动付费欲望，构建可复制的自动成交体系，解决转化率<5%、封号风险高等痛点。
  role: method
  src:
  - paper: docs/202306/20230613_033.md
- 'no': 11
  name: 珠宝高客单私域静默成交模式与三阶段成长曲线
  desc: 高客单成交依赖信任资产而非流量规模，必经新手期（顾虑/自嗨）、成长期（断断续续成交）、放大期（积累老客、年营收七八位数）螺旋上升，核心心法：朋友圈没人看是内容没做好。
  role: case
  src:
  - paper: docs/202306/20230613_034.md
- 'no': 12
  name: 社群运营：从无门槛免费群到付费社群的质变跃迁
  desc: 免费群必然陷入‘劣币驱逐良币/内容熵增/群主倦怠’三重死局；付费门槛是最高效的用户筛选器与价值锚定器，倒逼运营方提供超预期价值，建立高客单、高留存、高转介绍正向飞轮。
  role: theorem
  src:
  - paper: docs/202306/20230613_132.md
- 'no': 13
  name: 群友共创与大咖背书内容生产法
  desc: 解决群主单向输出精疲力竭：邀请群友深度分享（UGC/PGC化）、引入大咖讲座（专家背书）、群主转型‘策展人/连接者’，沉淀结构化知识资产（如4.6万字精华），构建社群护城河。
  role: method
  src:
  - paper: docs/202306/20230613_132.md
- 'no': 14
  name: 3+1共进成交法：三平台同步+痛点解决
  desc: 微信朋友圈+社群+公众号三平台同步运营同步输出，配合‘解决用户痛点’单一方法，实现多触点建立信任、完成转化的私域成交体系，10天变现3万实战验证。
  role: method
  src:
  - paper: docs/202306/20230613_215.md
- 'no': 15
  name: 事件展示引流与流量承接SOP
  desc: 以真实成绩/经验/踩坑为钩子在优质圈层分享吸引精准流量；主动链接五大节点（分享冒泡、新人进群、进新群、自己分享、运营朋友圈），配合‘不卑不亢’沟通心法。
  role: method
  src:
  - paper: docs/202306/20230613_215.md
- 'no': 16
  name: 水到渠成裂变法：分销机制+主动服务高意向用户
  desc: 设置固定佣金激励用户主动传播，针对朋友圈点赞/高意向用户主动邀群、探需、成交，将成交用户转化为销售代理，实现‘1人带1-n流量、低客单撬动高客单’。
  role: method
  src:
  - paper: docs/202306/20230613_215.md
- 'no': 17
  name: 营销良性循环与成长良性循环双飞轮模型
  desc: 营销飞轮：沉淀事件→同步分享→深度转化→产生新事件；成长飞轮：起势→爆发→沉淀交付→下一次起势，实现收入、心态、能力的螺旋上升，预警平台期心态波动风险。
  role: theorem
  src:
  - paper: docs/202306/20230613_215.md
- 'no': 18
  name: 视频号短视频挂车投流全链路SOP
  desc: 账号自查清单、素材拆解优化（黄金前5秒>30%/节奏控制/引单话术）、选品四维筛选（女/大/高客单/高复购/佣金>20%/价格29-199）、合规改造话术库、分层测试投放策略（测素材ROI>1.2/放量ROI>1.5）、三维归因复盘模型。
  role: method
  src:
  - paper: docs/202306/20230613_039.md
- 'no': 19
  name: 账号无罪定理与素材为王论
  desc: 除非后台明确提示违规，账号99.9%无限流问题，播放低本质是素材问题；投流成功关键变量是素材生产迭代能力，而非养号/蹭热点，低水平重复是最大陷阱。
  role: theorem
  src:
  - paper: docs/202306/20230613_039.md
- 'no': 20
  name: 人货场匹配决定ROI上限与学习期不动如山原则
  desc: 投放定向、商品、视频内容三者不匹配则ROI无法达标；新计划学习期模型建模期间任何人为干预均会重置学习期，预算设为目标成本10-20倍跑完学习期。
  role: theorem
  src:
  - paper: docs/202306/20230613_039.md
- 'no': 21
  name: 视频号直播投放：放大器定位与整体ROI视角
  desc: 投放是锦上添花的放大器，人货场才是根本；不应过度关注单条计划ROI，而应通盘考量整体投放ROI及成交额量级，在利润可观前提下追求规模化收益。
  role: definition
  src:
  - paper: docs/202306/20230613_130.md
- 'no': 22
  name: 投放心智博弈与供应链终局论
  desc: 投放是认知与心理素质竞争，胆大心细、敢于试错、持续复盘适应算法动态变化；高阶竞争本质比拼品牌供应链能力、直播场景打造能力及资金规模。
  role: theorem
  src:
  - paper: docs/202306/20230613_130.md
- 'no': 23
  name: 视频号混剪带货：视频指纹去重原理与剪映标准化SOP
  desc: 平台通过视频指纹判重，混剪通过多源素材镜头分割打乱重组（A1B2C3）降低重复度，保留爆款选品与脚本因子；剪映专业版流程：分离背景音→智能镜头分割→打乱顺序→轨道锁定叠加去重特效→入出点批量导出。
  role: method
  src:
  - paper: docs/202306/20230613_135.md
- 'no': 24
  name: 搬运判定唯重复度论与混剪解决三大痛点定理
  desc: 平台判定搬运唯一标准是重复度，与是否原创无关；混剪同时解决限流（指纹归零）、爆款复制（排列组合裂变）、投诉封号（成片与单一源素材不完全一致）三大痛点。
  role: theorem
  src:
  - paper: docs/202306/20230613_135.md
