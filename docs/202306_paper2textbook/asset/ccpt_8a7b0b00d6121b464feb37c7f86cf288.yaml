paper: docs/202306/20230613_193.md
desc: 该素材是一篇关于个人IP定位的实操方法论分享，核心主张是通过系统性的“蓝海定位方法论”避开红海竞争，帮助创业者和副业从业者快速发现细分蓝海市场，实现“选择大于努力”的商业价值。文章以痛点切入，承诺提供一套经过咨询实战验证的定位工具体系，并引导读者至飞书文档获取完整干货。
concepts:
- name: 蓝海定位方法论
  desc: 作者在个人IP咨询实战中总结的一套系统性定位工具体系，用于指导用户跳出红海竞争，快速锁定适合自身的细分蓝海市场。
  is_original: true
  excerpt:
  - 今天就和大家分享一套我在帮别人做 IP 咨询的时候，用到的“蓝海定位方法论”
- name: 个人IP赛道选择
  desc: 指个人品牌建设初期面临的核心决策问题：在竞争激烈的存量市场（红海）与潜力未被充分开发的增量市场（蓝海）之间做抉择。
  is_original: false
  excerpt:
  - 最近很多想做个人 IP 的朋友找我咨询怎么选择赛道。
  - 现在各行业竞争都很激烈，大家相互内卷，做得很痛苦，利润也越来越薄。
- name: 选择大于努力
  desc: 强调战略定位（赛道选择）的正确性对结果的决定性作用高于战术层面的勤奋程度，是蓝海定位的底层逻辑前提。
  is_original: false
  excerpt:
  - 选择比努力更重要，如果多花一点时间精力研究，其实可以另辟蹊径，找到一个适合自己的蓝海市场
methods:
- name: __overview__
  desc: 文章未展开具体步骤，仅确立了“蓝海定位方法论”作为整体方法论框架的存在，并指引完整版内容在飞书文档中。
  excerpt:
  - 分享一套我在帮别人做 IP 咨询的时候，用到的“蓝海定位方法论”
  - 更好的阅读体验，请移步飞书文档：如何快速找到蓝海市场？分享一套定位方法论
theorems:
- name: 蓝海市场可通过方法论系统性挖掘
  desc: 核心主张：蓝海市场非偶然发现，而是可以通过一套标准化、可复制的“蓝海定位方法论”快速找到，从而规避红海内卷、降低创业难度并获取更高利润空间。
  excerpt:
  - 挖掘蓝海市场，其实也没有大家想象的那么复杂
  - 选择比努力更重要，如果多花一点时间精力研究，其实可以另辟蹊径，找到一个适合自己的蓝海市场，做起来又轻松，利润空间还大。
- name: 方法论源于实战咨询验证
  desc: 核心主张：该方法论非理论推演，而是提炼自作者为他人提供IP咨询服务的实战经验，具有实操性和有效性背书。
  excerpt:
  - 一套我在帮别人做 IP 咨询的时候，用到的“蓝海定位方法论”
findings:
- name: 当前个人IP创业环境普遍陷入红海内卷
  desc: '[claim] 文章宣称当前各行业竞争激烈，从业者普遍面临内卷严重、利润薄、执行痛苦的困境。'
  excerpt:
  - 现在各行业竞争都很激烈，大家相互内卷，做得很痛苦，利润也越来越薄。
- name: 用户对赛道选择存在强烈求助需求
  desc: '[evidence] 素材数据支撑：作者近期接到大量想做个人IP的朋友咨询“怎么选择赛道”，印证了市场对定位方法论的刚性需求。'
  excerpt:
  - 最近很多想做个人 IP 的朋友找我咨询怎么选择赛道。
