paper: docs/202306/20230613_070.md
desc: 该素材是一篇知识星球/生财有术社群的精华帖汇总，作者“奋斗的木鱼”基于小马宋老师的营销咨询案例与方法论，结合自身门店实操复盘，系统梳理了线下门店通过菜单工程、选品策略、空间效率优化及MVP最小化运营等手段，实现提升客单价、坪效（单位面积产出）及进店率的实战方法论与案例库。
concepts:
- name: 菜单工程
  desc: 将菜单视为核心销售工具而非价格清单，通过结构设计、视觉引导、锚定定价、招牌菜打造等手段，引导客户“下单快且高”，直接提升客单价与翻台率。
  is_original: false
  excerpt:
  - 门店如何通过菜单提高客单，提高门店效坪（单位产出）？
  - 如何让客户下单下的“快且高”？我们来看看万店的蜜雪冰城怎么做的！
- name: 门店效坪
  desc: 即单位面积产出（坪效），衡量门店空间利用效率的核心指标，本素材核心目标即通过非扩张手段提升该指标。
  is_original: false
  excerpt:
  - 提高门店效坪（单位产出）
- name: MVP最小化运营
  desc: 新门店开业初期不依赖大额营销活动、线上引流或重装修，仅通过核心产品打磨、基础运营动作（如菜单优化、动线设计）验证商业模式，以极低成本达成高业绩。
  is_original: true
  excerpt:
  - 《新门店开店不靠活动、线上引流，仅通过最小 MVP 的运营方法做到 69 平 29.5W/月的业绩》
- name: 进店转化率
  desc: 解决“好地址客户不进店”问题的核心指标，通过门头设计、招牌逻辑、外摆陈列、首屏视觉锤等物理空间干预，将路人转化为进店客。
  is_original: false
  excerpt:
  - 【线下门店重金选了好地址，客户就是不进店，咋办？】
- name: 文化体验刷屏
  desc: 通过具备传播属性的空间文化、文案、周边设计，引导客户自发社交分享，降低获客成本（CAC），形成品牌资产护城河。
  is_original: false
  excerpt:
  - 【餐饮小店如何打造让“客户刷屏”的文化体验？或许你可以看看它！】
methods:
- name: __overview__
  desc: “案例拆解+底层逻辑抽象+自有店铺落地验证+方法论沉淀输出”的复利式学习闭环。作者先跟随小马宋团队拆解标杆案例（蜜雪冰城、宜家、太二/赖美丽），提炼底层逻辑，随即应用至自有门店验证有效性，最后沉淀为可复制的SOP发布社群。
  excerpt:
  - 这是小马宋老师早两年的案例...特地去了这家门店去拆店，回来立即用到之前自己门店里，效果也是奇佳。
  - 以下是之前在生财的门店发文，一并放出供大伙回看
- name: 标杆拆解法
  desc: 选取行业头部（蜜雪冰城、宜家、太二）或现象级品牌为研究对象，通过实地探店、流程录入、数据复盘，逆向推导其菜单结构、动线设计、选品逻辑、营销话术的底层机制。
  excerpt:
  - 如何让客户下单下的“快且高”？我们来看看万店的蜜雪冰城怎么做的！
  - 千亿市值的“宜家”如何让客户“买买买”？
  - 第二个“太二”？赖美丽的观察与思考
- name: 菜单结构重组法
  desc: 核心动作：1. 砍非核心SKU聚焦招牌；2. 设置锚定项（高价/低价）引导决策；3. 组合套餐设计提升客单；4. 视觉重排序（黄金视觉区放高毛利）；5.
    文案话术植入降低决策成本。
  excerpt:
  - 门店如何通过菜单提高客单
  - 让客户下单下的“快且高”
- name: 选址-进店转化拆解框架
  desc: 针对‘好地址不进店’问题，从门头识别度、进店动线阻力、首屏价值传达、信任状展示四个维度诊断堵点，逐个击破。
  excerpt:
  - 线下门店重金选了好地址，客户就是不进店，咋办？
theorems:
- name: 菜单即最大的销售员
  desc: 菜单不是价格表，而是留存时间最长、触达率100%、成本最低的‘金牌销售’。优化菜单ROI远高于雇佣导购或投放广告。
  excerpt:
  - 门店如何通过菜单提高客单，提高门店效坪
  - 如何让客户下单下的“快且高”
- name: 坪效优先于规模扩张
  desc: 在存量竞争时代，单店模型跑通（高坪效）是连锁化的前提。通过MVP验证单店盈利模型，比盲目开新店、搞活动引流更具确定性。
  excerpt:
  - 新门店开店不靠活动、线上引流，仅通过最小 MVP 的运营方法做到 69 平 29.5W/月的业绩
- name: 好生意=好模型×好落地
  desc: 小马宋老师的方法论（模型）提供底层逻辑，但‘落地前的思考更难’，实操者需结合自身资源禀赋进行二次开发与执行，知行合一才能产出结果。
  excerpt:
  - 小马宋老师及他们的团队才是强，我这是借助他们的落地来写，落地前的思考更难
findings:
- name: 蜜雪冰城菜单极简策略验证
  desc: '[evidence] 蜜雪冰城通过极度精简SKU（主推单品）、标准化SOP、低价锚定高频，实现了‘下单快、出餐快、翻台快’的高坪效模型，验证了‘少即是多’在大众茶饮赛道的威力。'
  excerpt:
  - 万店的蜜雪冰城怎么做的！
- name: 宜家动线与陈列的强制曝光机制
  desc: '[evidence] 宜家通过单向动线设计、生活场景化陈列、低价入口商品（如热狗、冰淇淋）锚定价格感知，迫使客户全品类浏览并产生非计划性购买，验证了空间设计对客单价的决定性影响。'
  excerpt:
  - 千亿市值的“宜家”如何让客户“买买买”？
- name: MVP开店实战数据案例
  desc: '[evidence] 作者自有/参与门店：69平米，无开业大促、无线上引流投流，仅靠MVP运营（菜单优化、核心产品、基础服务）实现月业绩29.5万元，坪效远超行业平均，验证了‘产品力+菜单力’大于‘营销力’的假设。'
  excerpt:
  - 69 平 29.5W/月的业绩
  - 不靠活动、线上引流，仅通过最小 MVP 的运营方法
- name: 太二/赖美丽品类聚焦与品牌人格化
  desc: '[claim] 赖美丽（酸菜鱼）通过单品类极致聚焦+创始人IP人格化+标准化中央厨房，复制出‘第二个太二’的高确定性增长路径，核心在于‘做减法’建立品类认知护城河。'
  excerpt:
  - 第二个“太二”？赖美丽的观察与思考
