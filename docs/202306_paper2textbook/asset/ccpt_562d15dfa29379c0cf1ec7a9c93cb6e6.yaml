- name: 八大效率技巧组合拳降本增效
  desc: '[claim] 作者主张‘两分定律/清空大脑/时间折叠/时间外包/时间复利/时间颗粒/做好平衡/目标管理’八句话构成完整技巧体系，覆盖即时处理、外部存储、叠加利用、杠杆放大、长期复利、个性适配、可持续性、目标锚定全维度。'
  excerpt:
  - 八句话，降本又增效...把能快速做完的事立刻做完，是第一步。
  - 用大脑来记事，太傻了...所以，才需要我们「清空大脑」。
  - 相信时间和复利的力量，和时间做朋友，而非做一个短效的人。
  - 目标管理就是冷静但不顾一切，投入巨大的时间成本，去完成一个看似微小的目标。
