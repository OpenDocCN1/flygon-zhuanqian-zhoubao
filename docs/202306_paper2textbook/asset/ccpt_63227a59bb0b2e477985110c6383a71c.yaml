paper: docs/202306/20230613_043.md
desc: 该素材为刘逍遥在生财有术社区的分享预告帖，核心内容是宣称通过抖音图文带货新玩法实现单号日入1000+佣金，并承诺提供从账号搭建、选品、素材制作到发布运营的全流程“�“喂饭级教学”，适合上班族副业操作，详细教程链接指向飞书文档。
concepts:
- name: 抖音图文带货
  desc: 一种利用抖音平台图文（图集/笔记）形式挂载商品链接（小黄车）进行带货变现的玩法，被作者视为当前最适合上班族副业操作的风口。
  is_original: false
  excerpt:
  - 抖音图文带货，一定是目前最适合的风口
  - 针对图文带货的全流程拆解
- name: 单号日入1000+
  desc: 作者实测的单个账号单日佣金收益基准线，作为该玩法可行性的核心背书指标。
  is_original: true
  excerpt:
  - 单号一天也成功出了一些单，单号一天也能赚 1000 多佣金
- name: 喂饭级教学
  desc: 作者对本次分享教程详细程度的定义，意指涵盖全流程操作细节，零基础可直接上手执行。
  is_original: true
  excerpt:
  - 抖音图文带货玩法喂饭级教学
  - 全流程拆解
- name: 账号解封复用
  desc: 此前因平台政策被封禁的账号解封后，直接应用新玩法进行变现的实战场景。
  is_original: false
  excerpt:
  - 我其中一个账号已经解封了，我尝试用现在新的图文玩法，单号一天也成功出了一些单
methods:
- name: __overview__
  desc: 抖音图文带货全流程操作体系（详细内容存于外部飞书文档），包含账号准备、选品定品、素材制作、发布优化、出单变现等标准化SOP。
  excerpt:
  - 针对图文带货的全流程拆解
  - 具体请移步飞书：https://ki9cyy7wy03.feishu.cn/docx/IxvMddmtUor51Dx7czKcMo1Nnsd
theorems:
- name: 图文带货是上班族最佳副业风口
  desc: 基于低门槛、抗封禁（相对视频）、操作简单等特性，判定抖音图文带货为当前在职人群兼职创业的最优选择。
  excerpt:
  - 如果你是正在上班，想一边上班一边做一份副业，那我现在可以说，抖音图文带货，一定是目前最适合的风口
- name: 旧账号新玩法可快速冷启动
  desc: 曾因政策违规被封账号解封后，直接切换图文带货模式可快速出单，验证玩法有效性及账号权重恢复可能。
  excerpt:
  - 我其中一个账号已经解封了，我尝试用现在新的图文玩法，单号一天也成功出了一些单
findings:
- name: 实测单号日收益破千
  desc: '[claim] 作者宣称其解封账号应用新图文玩法后，单日佣金达到1000元以上。'
  excerpt:
  - 单号一天也成功出了一些单，单号一天也能赚 1000 多佣金
- name: 前期视频带货月入5万复盘背书
  desc: '[evidence] 作者此前通过短视频带货（书单号）实现单月变现5万，为本次图文玩法分享提供了操盘手信誉背书。'
  excerpt:
  - 我在 4 月份发布了一篇帖子 95 后打工人，副业做抖音中老年书单号，单月变现 5 万+的复盘
- name: 平台政策导致视频号封禁风险
  desc: '[evidence] 素材揭示此前操作短视频带货因平台政策收紧导致账号被封，倒逼玩法迭代至图文形式。'
  excerpt:
  - 因为平台政策的影响，导致账号被封，以及后续的一些拓展想法
- name: 图文投流内测信息
  desc: '[claim] 评论区用户透露抖音图文投流功能疑似在六月底开放内测，暗示后续付费放量路径打通。'
  excerpt:
  - 图文投流，貌似流传说六月底有内测
