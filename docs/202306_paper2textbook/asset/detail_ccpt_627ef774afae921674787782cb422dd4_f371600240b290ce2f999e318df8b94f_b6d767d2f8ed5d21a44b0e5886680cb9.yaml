  excerpts:
  - 挖掘到蓝海小众需求
  - 蓝海市场，其实也没有大家想象的那么复杂
  - 1 条没中标的风向标，让我多赚了 4 位数
  - 其实这就像家家都有凉开水，把它包装起来放到超市货架上照样卖两块钱一瓶。
  - 我们跑出了一套云洗衣新业务模式，让做本地生活的老板都能够利用线下人流卖出洗衣、家政服务，老板只做客服中间商工作，连线上网店也不用开，实现增收。
- 'no': 8
  name: 执行力与复盘闭环 —— 用行动换确定性，用复盘攒经验
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人懂了很多道理，却依然赚不到钱，缺的不是知识，而是行动和复盘。'
  - '- 对新人来说，先干起来比选对项目更重要；干起来之后，复盘决定你能走多远。'
  - '**核心定义**'
  - '- 执行为王：立即行动、极速闭环、持续迭代，用高密度执行对冲认知不足。'
  - '- 复盘闭环：定期拆解动机、目标、行动、心态，把失败经验沉淀为可迁移能力。'
  - '**关键性质**'
  - '- 过程目标比结果目标更可控：每天更新几条、复盘多久，比“月入十万”更容易坚持。'
  - '- 执行力不是蛮干，而是“下场 + 复盘 + 微调”的循环。'
  - '**典型例子**'
  - '- 大二学生看到精华帖立即执行，两周赚 1w+；头部玩家单日引流仅 5-6 人，说明持续执行比技巧更重要。'
  - '- 作者用四维复盘（动机/目标/行动/心态）对比抖音失败与小红书成功，找到问题根源。'
  - '- 用三层目标 + 关键路径 + 批量处理，同时推进 11 个航海项目。'
  - '**边界条件**'
  - '- 盲目执行而不复盘，只是重复错误；复盘需要诚实面对失败。'
  - '- 执行力不能弥补方向性错误，选项目时仍需基本判断和低成本测试。'
  sources:
  - paper: docs/202306/20230613_169.md
    role: origin
  - paper: docs/202306/20230613_016.md
    role: origin
