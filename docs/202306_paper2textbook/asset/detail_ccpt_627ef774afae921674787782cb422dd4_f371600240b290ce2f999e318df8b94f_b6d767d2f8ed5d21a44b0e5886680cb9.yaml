- 'no': 10
  name: 局限与避坑 —— 知道哪里会翻车，比会开车更重要
  points:
  - '**为什么需要这个概念？**'
  - '- 副业项目有生命周期，平台规则一改，曾经的赚钱方法可能立刻失效。'
  - '- 知道哪儿会翻车，比会开车更重要；提前避坑等于提高存活率。'
  - '**核心定义**'
  - '- 平台风控：账号环境、内容重复度、引流行为等触发的限流/封号机制。'
  - '- 红利窗口期：平台补贴、内容缺口、竞争度低共同形成的短期机会窗口，可复制但会关闭。'
  - '- 模式失效信号：流量断崖、竞品涌入、价格战、平台规则收紧、核心人员流失。'
  - '**关键性质**'
  - '- 低门槛项目一旦公开，会在几小时内被复制，客单价迅速崩塌。'
  - '- 交付模式若过于标准化，员工容易“学会即走”，变成你的竞争对手。'
  - '**典型例子**'
  - '- 公众号情感文全部进入推荐池，但因 ECPM 低，一个月只赚 200 元。'
  - '- 风向标项目被千人下场后，客单价从 99 元崩到 9.9 元。'
  - '- 付费垃圾外链导致 Google 降权 90%，联盟站由月入十万走向被封。'
  - '**边界条件**'
  - '- 合规成本远低于翻车成本；商标、税务、平台规则等红线不可碰。'
  - '- 不要因噎废食；认清局限是为了在窗口期内快速收割，并在失效前转型。'
  sources:
  - paper: docs/202306/20230613_134.md
    role: critique
  - paper: docs/202306/20230613_197.md
    role: critique
  - paper: docs/202306/20230627_048.md
    role: critique
  - paper: docs/202306/20230627_013.md
    role: critique
  - paper: docs/202306/20230613_078.md
    role: critique
  - paper: docs/202306/20230627_009.md
    role: critique
  excerpts:
  - 注意：重点是字数 1200 字左右，不要太多，完读率不高。
  - 抖音我没做，快手我也发现越来越多了
  - 可以去先找个靠谱的外卖代运营公司，自己也要去一点一点学习，最好的老师就是同行
  - 很多人在模型非常好的情况下，最后发现可能现金流不够，因为广告费、账期的原因，没有及时的放大团队。
  - 是我花了前公司近 10w 的费用总结出来的经验，希望能为大家避避坑。
- 'no': 11
  name: 组织化放大 —— 从一个人的战斗到一支军队
  points:
  - '**为什么需要这个概念？**'
  - '- 个人精力有天花板，验证模型后若不放大，永远只赚一份钱。'
  - '- 从 0 到 1 靠个人，从 1 到 N 靠组织；组织能力决定规模上限。'
  - '**核心定义**'
  - '- 三阶段增长模型：0-1 验证模型 → 1-10 标准化复制 → 10-100 平台化合伙。'
  - '- 标准化：销售 SOP + 人才培养 SOP 双轨并行，让新人按模板也能达到保底产出。'
  - '- 组织平台化：把公司拆分为独立核算业务单元，用分红/虚拟股绑定核心人才。'
  - '**关键性质**'
  - '- 放大的本质是使用三大杠杆：信息差、人才资源、资本资源。'
  - '- 管理本质是买时间、买结果；创始人要从“亲自干”转向“发钱买别人的时间和能力”。'
  - '**典型例子**'
  - '- 私域团队按三阶段扩张：0-1 算模型，1-10 做标准，10-100 建中后台和合伙人机制，最终团队 500+、年零售额破亿。'
  - '- 三个大学生在“遥控指挥”下独立执行拉新项目，拿到 Top5 并沉淀 1.7 万字 SOP。'
  - '- AIGC 漫展从个人工作室逐步扩展到“商演人员长期合作 + 志愿者共创”的团队化运营，单场 2-20w。'
  - '**边界条件**'
  - '- 标准化要“先僵化、后优化、再固化”；过早让新人自由发挥会失控。'
  - '- 平台化需要成熟的利益分配机制，否则核心人才留不住；没有稳定现金流支撑，扩张会因资金断裂而崩盘。'
  sources:
  - paper: docs/202306/20230627_013.md
    role: origin
  - paper: docs/202306/20230613_012.md
    role: improve
  - paper: docs/202306/20230613_196.md
    role: apply
  - paper: docs/202306/20230613_172.md
    role: apply
  excerpts:
  - 团队从 0-1 发展，重点是在于把团队模型建立好，通过算流量、人工成本以及其他成本去把利润最大化。而从 1-10 就要结合业务的发展情况去做标准，筛选优化。10-100
    的时候基本上就要有一定的中后台搭建能力。
  - 独行快、众行远，做好利润分配才能更好团结优秀的人持续干。
  - 说起来你可能不信，运营全靠大学生，我们居然做到了生财拉新 Top5！
  - 对于参与舞台演出的人员，可以进行逐步筛选，好的留下，长期合作，培养成自己活动的专业人员，很容易就能把影响力拓展到地区知名。
