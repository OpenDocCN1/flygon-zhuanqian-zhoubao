'no': 1
name: 商业认知觉醒 —— 从“打工思维”到“赚钱逻辑”
desc: 本章旨在重塑学习者的商业底层认知，揭示财富本质、商业模式公式与赚钱核心要素，帮助学习者跳出“出卖时间”的线性收入陷阱，建立“提取剩余价值”的商业视角，为后续实战方法论奠定思维基石。
nodes:
- 'no': 1
  name: 财富的本质：持续从社会提取剩余的能力
  desc: 打破“财富=存款”的静态认知，确立财富是动态流向过程的核心定义：让别人的钱持续流向自己口袋。
  role: definition
  src:
  - paper: docs/202306/20230613_182.md
- 'no': 2
  name: 财富获取的底层法则：对他人施加“得利”或“损害”
  desc: 揭示合法获取财富的唯一路径——提供价值（得利）或掌握稀缺资源（可施加损害/定价权），影响力覆盖面与强度决定财富上限。
  role: method
  src:
  - paper: docs/202306/20230613_182.md
- 'no': 3
  name: 商业模式公式：利润 = (收入 - 成本) × 频次 × 周期
  desc: 建立评估商业模式优劣的量化标尺：好的商业模式=赚钱、高频、可持续；不懂公式盲目努力必然‘忙死赔死’。
  role: definition
  src:
  - paper: docs/202306/20230613_007.md
- 'no': 4
  name: 赚钱双核心要素：产品与流量至少占一头
  desc: 确立商业变现的必要条件——普通人建议从‘流量’端切入（分销、短视频带货、无货源），避免‘两头不占’的无效创业。
  role: method
  src:
  - paper: docs/202306/20230613_180.md
- 'no': 5
  name: 时间杠杆效率：一对多模式是财务自由核心路径
  desc: 对比一对一（电销/咨询）与一对多（内容/代码/媒体）的时间复用率，主张将单位时间重复发售，实现指数级放大。
  role: method
  src:
  - paper: docs/202306/20230613_180.md
- 'no': 6
  name: 三大商业模式分层：血酬、资源租金、规则制定
  desc: 按财富提取深度划分三级模式：L1出卖时间健康（将被AI取代）、L2掌握稀缺社会资源（稀+缺）、L3建立生态制定规则（赢家通吃）。
  role: definition
  src:
  - paper: docs/202306/20230613_182.md
- 'no': 7
  name: 血酬模式的必然消亡：AI颠覆下的“无用阶层”预警
  desc: 论证第四次科技革命将淘汰可标准化、重复性劳动，出卖时间者将失去议价力，成为相对‘无用之人’，倒逼向L2/L3跃迁。
  role: limitation
  src:
  - paper: docs/202306/20230613_182.md
- 'no': 8
  name: 稀缺社会资源的双维拆解：“稀”（供给端）与“缺”（需求端）
  desc: 提供识别核心资产护城河的工具：稀=总量有限/信任成本高；缺=刚需/社会运转必不可少。涵盖有形(房产)与无形(流量/技术/人脉)。
  role: method
  src:
  - paper: docs/202306/20230613_182.md
- 'no': 9
  name: 商业进化三阶段论：1.0鸡毛换糖 → 2.0商铺模式 → 3.0知识模式
  desc: 宏观判断商业社会演进规律：核心生产力从渠道转移至认知，供给过剩倒逼‘代运营’等2.5中介层诞生，指导赛道选择与定位。
  role: definition
  src:
  - paper: docs/202306/20230613_007.md
  - paper: docs/202306/20230613_250.md
- 'no': 10
  name: 生意的本质与三维需求满足模型
  desc: 统一生意定义：交易行为满足他人需求。按需求对象划分：满足个体(高客单/非标)、满足群体(认知焦虑/规模化)、满足客观标准化需求(红海标品)。
  role: definition
  src:
  - paper: docs/202306/20230627_004.md
- 'no': 11
  name: 个体需求交易的三要素：劳动力、金钱、智力
  desc: 在职场/咨询模式中，若不出卖全部时间，仅剩金钱(投资)与智力(专业方案)两大可交易杠杆，指引高阶从业者向智力变现转型。
  role: method
  src:
  - paper: docs/202306/20230627_004.md
- 'no': 12
  name: 知识付费本质：贩卖“确定感”而非“能力”——认知焦虑变现逻辑
  desc: 揭示知识付费‘高购买低使用’的底层机制：用户为‘消除困惑/焦虑’付费，焦虑缓解即失去行动动力，产品设计应聚焦‘结构化认知’交付。
  role: proof
  src:
  - paper: docs/202306/20230627_004.md
  - paper: docs/202306/20230613_255.md
- 'no': 13
  name: 商业模式与生意的辩证关系：长期守模式，短期拿生意
  desc: 好模式短期未必是好生意(农夫山泉早期)；好生意未必是好模式(摆摊)。生存需‘不改变模式’前提下‘灵活拿下短期好生意’。
  role: method
  src:
  - paper: docs/202306/20230613_007.md
- 'no': 14
  name: 成本可控即生存力：找“自己成本可控的业务”投入
  desc: 抗风险能力取决于成本结构可控性而非绝对规模。巴菲特亏1亿是波动，小本亏100万是清零。盘点人力/资金/智力成本结构，定位核心优势。
  role: method
  src:
  - paper: docs/202306/20230613_007.md
- 'no': 15
  name: 智力成本产品化变现：一次性投入，边际成本趋零
  desc: 将智力成本脱离人力/资金独立变现的核心路径：写书、沉淀方法论、标准化产品，实现‘睡后收入’与复利增长。
  role: method
  src:
  - paper: docs/202306/20230613_007.md
- 'no': 16
  name: 赚钱曲线与波动规律：指数级增长与波峰浪谷
  desc: 接受赚钱非线性规律：前期投入产出比极低、后期复利爆发；收入必然波动，追求绝对稳定只能打工。心态建设：耐得住寂寞，受得住波动。
  role: proof
  src:
  - paper: docs/202306/20230613_180.md
- 'no': 17
  name: 中等智商成功充分条件：正确方法 + 足够坚持
  desc: 赚钱不需天赋异禀，但‘无即时反馈下的长期坚持’是最大筛选器。大部分人无法在无奖励情况下坚持两个月，坚持即稀缺。
  role: finding
  src:
  - paper: docs/202306/20230613_180.md
- 'no': 18
  name: 利他利己共振：分享吸引优秀人，构建社交飞轮
  desc: 越分享越得到，越利他越利己。通过价值输出吸引高质量社交资本(优秀伙伴/客户)，形成正向循环，打破孤军套战局面。
  role: extension
  src:
  - paper: docs/202306/20230613_180.md
