paper: docs/202306/IYA2dTaXooUdR9xPjdVcGoCVnfc.md
desc: 该素材由资深金融从业者“老吴”撰写，核心旨在通过大量真实惨痛案例、心理与行为模型剖析以及概率论证，劝诫普通散户“远离股市、切勿炒股”。文章系统揭示了散户必亏的结构性原因：信息/资源/技术的三重劣势、人性弱点（贪婪、侥幸、不认亏）导致的“韭菜模型”、以及杠杆放大下的毁灭性风险。同时，作者罕见地公开了自身盈利的核心逻辑——以实业现金流为底座、利用券商佣金/衍生品收入对冲风险、通过数据化筛选操盘手（重胜率/回撤率/自有资金验证）实现“船大难掉头”前的稳健获利，并推荐“淘股吧交易练习”作为低成本试错训练场。全文立足“防亏”而非“教赚”，属于反直觉的金融风控科普佳作。
concepts:
- name: 韭菜模型
  desc: 描述普通散户在股市中因认知局限、心理缺陷和操作违规而必然被收割的系统性特征画像，包含心理层面（盲目无知、虚妄期望、赌徒心理、错失恐惧、不敢操作、侥幸心理）与操作层面（听信他人、过度分散、无法自控、不改错误、赌徒型、偏执狂）双重维度。
  is_original: true
  excerpt:
  - 从心理上测试一下你是否符合韭菜模型：盲目无知、虚妄的期望、赌徒的不肯认亏心理、怕失去机会、不敢操作、侥幸心理
  - 从操作上测试一下你是否符合韭菜模型：听信他人型、过度分散型、无法自控型、不改错误型、赌徒型、偏执狂型
- name: 马太效应（股市版）
  desc: 指强者恒强、赢家通吃的马太效应在股市中的极致体现：会赚钱的上市公司（如茅台、苹果）凭借现金流护城河持续上涨分红；会赚钱的股民/机构凭借系统优势持续盈利；而散户因缺乏核心竞争力陷入‘凡是少的就连他所有的也要夺过来’的负向循环。
  is_original: false
  excerpt:
  - 马太效应在股市尤为明显:会赚钱的上市公司更加会赚钱;会赚钱的股民也更加会赚钱。
  - 贵州茅台：股价一直都是很稳定的往上走...属于中国股票里强者恒强的。是有现金流壁垒的。
  - 苹果公司：巴菲特在低位的时候没进去，到高位了才进的苹果公司...因为这家公司已经从科技公司转变成一家以日常消费为主的公司
- name: 扁鹊见蔡桓公模型（股市映射）
  desc: 借用经典寓言隐喻股市风险演变规律：股票问题早期在‘腠理’（小亏可止损）、中期在‘肌肤/肠胃’（中亏可砍仓/减杠杆）、后期入‘骨髓’（深套/加杠杆/退市不可逆），散户讳疾忌医（拒不止损、死扛补仓）最终导致‘体痛致死’（爆仓/债务危机/人生悲剧）。
  is_original: true
  excerpt:
  - 同理：股市你踏进去了，这个公司病入膏肓，你还一直补仓补仓，等到最后的时候，哗啦，你破产了。
  - 疾在腠理，汤熨之所及也...今在骨髓，司命之所属，无奈何也。
- name: 现金流护城河
  desc: 作者认为个人能在股市生存的前置条件：拥有主业事业产生的稳定、充沛现金流（如存款业务、淘宝客收入），覆盖生活与事业开支并留有结余，从而建立‘不靠股市吃饭’的心理底座，避免因资金压力导致变形操作。
  is_original: true
  excerpt:
  - 有自己的一份事业，有良好的现金流...如果你没有一个良好的现金流撑着你的生活和事业，那么你很难在股市上获得一个良好的投资心态。
  - 我自己能做存款业务、还有淘宝客业务，收入都是几十万上百万的。
- name: 股市衍生品对冲模型
  desc: 作者通过担任股票经纪人获取佣金收入（年十几万）及其他衍生品收益，覆盖自有资金投资的潜在亏损（如亏10-15%），实现‘用股市赚的钱在股市玩’的风险隔离结构。
  is_original: true
  excerpt:
  - 一年股市佣金十几万，还有其他股市衍生品收入，我投个100万，账户还在自己身上...即使亏个十几个点的钱，也还是从股市赚来的。至少起码覆盖了我的一定的风险。
- name: 最大回撤率风控法则
  desc: 量化投资操盘手风险承受能力的核心指标：以同花顺‘资产分析-最大回撤率’为基准，投资者可承受金额 = 本金 × (最大回撤率 × 1.2)；若无法承受该金额损失则不得投资。短线看胜率，长线看最大回撤率。
  is_original: true
  excerpt:
  - 打开同花顺资产分析...点击右下角最大回撤，就会出现最大回撤率。如果你自己想要投资，按他最大的回撤率再乘以20%，就是你想承受的最大亏损金额，如果能承受，再投资不迟。
  - 所以短线盘手看胜率，长线盘手看历史最大回撤率。
- name: 优质操盘手画像
  desc: 可托付资金的操盘手需同时具备：1) 适合自身性格的稳定交易系统；2) 严格执行策略（不随意改仓位/标的）；3) 极强风控（‘割肉高手’）；4) 自有资金实盘验证（无自有资金者坚不可用）；5)
    成功率>50%、仓位控制30%-50%、短线滚动热点、隔日落袋为安。
  is_original: true
  excerpt:
  - 操盘手往往具备的几个特点：1、他们有适合自己的投资方法和交易系统 2、严格执行策略... 3、风控能力一定要强。只知道猛干的人一定会被市场干死。所以优质操盘手都是割肉高手。
  - 成功率50%以上，30%-50%左右的仓位控制，短线2-3只操作，滚动式轮动热点股票，隔天有赚钱就落地，亏钱就跑。
- name: 模拟实战训练场
  desc: 利用‘淘股吧-交易练习’（或同花顺K线训练营）进行每日10分钟模拟复盘：按实盘资金量梭哈单票、设定进出逻辑、严格执行止损止盈、记录情绪波动，以‘模拟盘亏总好过实盘’的低成本方式快速迭代交易模型，但需警惕‘模拟暴富错觉’（无印花税/流动性约束/时间压缩）。
  is_original: true
  excerpt:
  - 下载淘股吧→交易练习→长期练习→每天把豆用光→复盘对与错...把你现在持有的股从里面找模型→在模拟盘亏总好过实盘吧
  - 警告：玩多了这个软件，有可能你会把十万玩到几千万...忽略了你玩这个软件时间差...里面的一些动作是临时涨停的后续大涨，有些股票你根本不可能买得到
methods:
- name: __overview__
  desc: 作者构建的一套‘普通人股市生存/获利闭环’：前置条件（实业现金流护城河）→ 风险对冲（衍生品佣金覆盖亏损）→ 核心执行（数据化筛选优质操盘手/自主超短线模型）→
    持续进化（模拟实战训练场迭代模型）→ 红线管控（最大回撤率×1.2止损线、拒绝杠杆、拒绝死扛垃圾股）。
  excerpt:
  - 踏实做事业，股票当投资...有良好的现金流...这些年摸爬滚打过来，真心觉得如果你没有一个良好的现金流撑着...很难获得良好的投资心态。
  - 一年股市佣金十几万...即使亏个十几个点的钱，也还是从股市赚来的。
  - 通过数据分析，自己炒，也投资操盘手...打开同花顺→看已清仓股票→分析已清仓历史数据...最大回撤率×20%
  - 通过玩游戏来增长你的炒股能力：交易练习...每天10分钟的训练营游戏，能让你的分析能力快速增长。
- name: 操盘手历史数据真伪验证法
  desc: 利用同花顺‘已清仓股票’功能，要求操盘手提供逐笔清仓记录截图（含胜率、清仓次数、月度盈亏、逐笔买卖明细），重点核验‘每一条交易清仓图’难以短期造假的特性，结合‘资产分析-最大回撤率’交叉验证，识别刷单/曲线拟合造假。
  excerpt:
  - 打开同花顺→看已清仓股票→分析已清仓历史数据...里面包含胜率、清仓次数、每月实现盈亏截屏，每一月的实际买卖数据，基本图片可以造假。但每一条的交易清仓图很难短时间造假。
  - 然后打开同花顺资产分析...点击右下角最大回撤，就会出现最大回撤率。
- name: 模拟盘实战化训练法
  desc: 在淘股吧‘交易练习’中设定：1) 模拟本金=实盘本金；2) 单票梭哈模拟实盘心理压力；3) 设定严格进出规则（上涨后悔/下跌懊恼/狂跌止损）；4)
    每日复盘记录对错；5) 将模拟信号映射至实盘持仓寻找共振模型；6) 警惕模拟特有优势（买到涨停、无滑点/税费、时间压缩）导致的虚假自信。
  excerpt:
  - 每次练习你就模仿我有多少钱，梭哈这只股票后，我能怎么盈利，怎么抗住一波的波段，上涨我会不会后悔，下跌我会不会懊恼，狂跌我要不要及时止损。自己给自己的性格和方法设定一套操作方法。严格执行一段时间，看能否盈利。
  - 建议：你本身在炒，但又很迷茫，试着练习下这个动作，但玩的过程中不要快，慢下来，好好思考这个点位的进出逻辑。
theorems:
- name: 普通人股市必亏铁律
  desc: 散户面临‘三无劣势’（无内幕/调研/技术）与‘机构强势’（研报/资金/团队）的结构性错位，叠加人性弱点（贪婪/赌徒/侥幸），导致长期胜率趋近于零。即便牛市，散户多因‘错过→追高→接盘→套牢→死扛→割肉’周期而在牛市中亏损。概率分布为：80%亏钱、15%平手、5%赚钱（行情好时）。
  excerpt:
  - 普通人：没内幕信息，没调研信息，没技术。机构，基金：强大后盾，很多调研员，专业分析报告
  - 炒股的人或者身边有人炒股的，都有一个理论是7亏2平1赚...我个人觉得...应该是80%亏钱，15%的平手，5%的人赚钱
  - 大部分散户亏钱是在牛市亏的。大部分人是错过行情，涨到头了，自己才来了点感觉，上了就是接盘侠
- name: 杠杆加速毁灭定律
  desc: 融资融券/信用贷/抵押贷等杠杆工具将‘亏损-补仓-再亏’的负反馈放大为‘资金链断裂-资产清算-债务危机’的毁灭性打击。案例显示：董秘杠杆坐庄几日跌停腰斩、公职人员房贷+信贷炒股负债200万、实体老板厂房抵押+融资融券2300万扛单成股东。
  excerpt:
  - 亏钱方法千千万，首选倾家荡产神器：博彩和股票
  - 利用自有加杠杆资金往上推股票，几个跌停下来亏了50%，几天时间，一辈子的收获化为泡影。
  - 拿房产抵押+信用贷的钱继续炒...身上背着快200万的债务
  - 在银行拿自己的厂房贷了一千万，再加上融资融券，2300万...扛着扛着，就成了股东。现在还没解套。
- name: 时间机会成本置换原理
  desc: 股市投入的时间成本（交易时段=上班黄金期）挤占主业晋升、技能积累、资产配置（如买房）的机会窗口。案例显示：职场人炒股数年一事无成，同期房价从几千涨至2万，同事晋升买车买房，反观自身‘股票原地踏步、事业停滞、资产缩水’。
  excerpt:
  - 股市开市时间9.30-11.30 1.00-3.00, 几乎就是上班时间了。上班炒股，没心思经营事业。
  - 炒了好几年，也没见赚钱，但回想起来，周围同事晋升的晋升或者买车买房，他什么也没有，等想买房时，房价已经从原来的几千块钱，涨到了快2万。
- name: 船大难掉头约束
  desc: 操盘手资金规模扩大后面临的流动性陷阱：好股买不满（冲击成本高）、差股卖不出（砸盘风险大）、手续费印花税磨损利润、风格切换滞后导致长周期回撤。这解释了为何作者‘目前不敢乱碰长线操盘手’且选择短线高频小仓位模型。
  excerpt:
  - 他们的模型单一，市场风格变化够大，不能及时调整，往往连着很长时间亏损
  - 操作资金较大时，很难调整股票的买卖节奏，容易出现好股买不到，差股卖不出的情况。造成一定的亏损。船大难掉头。
  - 交易手续费和印花税惊人，无形中磨损了很多的利润
findings:
- name: 作者自有账户超短线模型实测数据
  desc: '[evidence] 作者主账户短线模型成功率约55%，需投入大量时间研究市场与模型，且盈利能力虽强于散户但胜率仅五五开，佐证‘股票真心不好做’、‘散户更无胜算’。'
  excerpt:
  - 我这个主账户的一个短线模型成功率也就55开，而且是花了大量时间研究市场和模型做的超短线。盈利能力肯定比一般的散户强。所以请看，股票还好做么？真心不好做。我的成功几率也就50%。更何况散户。
- name: '*ST中天(中天金融)杠杆死扛毁灭案'
  desc: '[evidence] 作者好友听信内部重组消息，融资融券+银行贷款300万满仓死扛，股票面临退市，本金近乎归零，负债累累且有轻生风险。作者自身同票止损20%仅亏2万，对比鲜明验证‘止损线到了就不是你的名’与‘偏执狂型’必死的铁律。'
  excerpt:
  - '*ST中天，原称：中天金融...我朋友用银行贷款加融资融券杠杆买了这只，300万的资金上车，扛了两年，到今天为止，要退市了。300万啊...现在我经常给他打电话，安慰他人生路很长，一定不要想不开。'
  - 结果我就随手买了几万块钱扔着，止损线20%...亏到20%，亏了2万块钱吧。我就撤了。
- name: 仁东控股庄股接盘惨案
  desc: '[evidence] 资金中介大佬贪图配资利息、散户听信股评家推荐集体接盘庄股，遭遇连续十几个跌停板，股价至今不复，验证‘名嘴/股评家/消息票=骗钱工具’及‘赌徒型/听信他人型’韭菜模型的必然收割结局。'
  excerpt:
  - 仁东控股：庄股。我就有认识的一个资金中介大佬，因为贪几个配资的利息，被骗到这只股票里面接盘，还有大量的散户被股评家，骗到这只股票，然后就是一泻千里，连续十几个跌停板。股价到现在都起不来。
- name: 上市公司董秘清华博士杠杆坐庄爆仓案
  desc: '[evidence] 高知精英（清华经管博士、董秘、人脉强）辞职专职炒股，联合坐庄被伙伴背刺，自有+杠杆资金推股遭遇连续跌停，几天亏损50%，身家过亿灰飞烟灭并连累亲友，极有力证伪‘高学历/内幕/资源/经验=股市护身符’的幻觉。'
  excerpt:
  - 我亲戚的同学，清华大学博士生经管院毕业，上市公司董秘...联合坐庄的另外一个股东提前先跑了，他自己被另外一个庄家给坑了，一夜之间连续跌停...几天时间，一辈子的收获化为泡影。还带着身边很多的朋友、亲戚亏得惨不忍睹。
- name: 公职人员房贷信贷炒股债务危机案
  desc: '[evidence] 体制内月光族听信机会用公积金贷款60万炒股亏30万，随后房产抵押+信用贷补仓博回本，现负债200万（房贷100万+信用贷100万），房产下行期无法变现偿债，验证‘无现金流护城河+杠杆+赌徒心理=中产阶级跌落陷阱’。'
  excerpt:
  - 这个客户在人生前几十年，也是风生水起...听信别人有什么好的股票机会，就用公积金额度在银行的贷款，贸然拿了60万去炒...亏了30多万...拿房产抵押+信用贷的钱继续炒...身上背着快200万的债务，房产100万，信用贷100万。
- name: 实体老板厂房抵押融资融券2300万扛单案
  desc: '[evidence] 茶叶机械老板2015年自有300万赚100万后贪婪加杠杆至2300万（厂房贷1000万+融资融券），5178点位见顶回落连续跌停舍不得止盈扛单，至今未解套沦为银行‘忠实粉丝’（长期还债），验证‘暴利诱导杠杆→贪婪拒止盈→流动性枯竭→人生重创’全链条。'
  excerpt:
  - 某个客户，茶叶机械的老板...在银行拿自己的厂房贷了一千万，再加上融资融券，2300万...本想着赚到1000万就收手，但当时还真给他赚到1000万，但是~
    行情那么好，怎么舍得嘛...结局...扛着扛着，就成了股东。现在还没解套。截止到现在，这位老板过的那种日子，叫一个艰辛。
- name: 职场人炒股机会成本实测案
  desc: '[evidence] 职场人痴迷股票技术分析数年，交易时段与上班重叠导致事业荒废，股票未赚钱、晋升无份、错过房价从几千涨至2万的红利期，量化了‘股市沉没时间成本=主业晋升+实体资产增值机会’的残酷置换。'
  excerpt:
  - 身边的某个职场人，痴迷股票发财致富...上班炒股，没心思经营事业...炒了好几年，也没见赚钱，但回想起来，周围同事晋升的晋升或者买车买房，他什么也没有，等想买房时，房价已经从原来的几千块钱，涨到了快2万。股票还是在原地踏步。
- name: 淘股吧模拟训练提升实证
  desc: '[claim] 作者宣称自身水平提升得益于淘股吧‘交易练习’长期训练（每日10分钟、复盘对错、模拟实盘心理压力），并认为效果优于同花顺K线训练营；但同时警告模拟存在‘时间压缩/无税费/可买涨停’导致的暴富错觉。'
  excerpt:
  - 我的水平的提升，其中有这个软件的功劳。当然同花顺也有类似的功能，叫K线训练营，但效果没有这个淘股吧的好
  - 警告：玩多了这个软件，有可能你会把十万玩到几千万...只是一个错觉。还有，里面的一些动作是临时涨停的后续大涨，有些股票你根本不可能买得到
