paper: docs/202306/Ugc8d4klYozKxuxBAlwcxeEAnrI.md
desc: 该素材是一份实操指南，介绍了如何使用Chrome浏览器插件HARPA AI结合ChatGPT实现网页内容的高效总结、待办提取与深度问答，通过安装配置、核心指令（/summary、/todo、自助问答）演示及多个生财有术社群精华帖实战案例，展示了该工具在降低AI使用门槛、提升知识获取与内容创作效率方面的应用价值，并探讨了自定义指令、标题优化及本地文档支持等拓展用法。
concepts:
- name: HARPA AI
  desc: 一款集成ChatGPT功能的Chrome浏览器扩展插件，支持网页感知、预置提示词命令、多模型调用（浏览器会话/API）及自定义指令，旨在实现网页内容的自动化总结、分析与交互。
  is_original: false
  excerpt:
  - HARPA AI 打开网页，点击“添加至Chrome”就会自动添加
  - 调用HARPA插件后，可以使用它内置的100+快捷命令
  - 官方还介绍说，未来能够支持本地PDF文档识别进行问答
- name: 预置提示词命令
  desc: 插件内置的标准化指令集（如/summary、/todo），用户无需编写Prompt即可一键触发特定任务，降低了Prompt Engineering的门槛。
  is_original: true
  excerpt:
  - 插件已经帮我们预置好脚本，我们只需要发出总结指令，它就自动开始对话并给出总结的内容要点！
  - 这篇指南主要是调用三个指令，分别是/summary，/todo和自助问答
- name: 网页感知上下文
  desc: 插件能自动读取当前浏览器标签页的网页内容作为上下文喂给LLM，实现免复制粘贴的直接问答与分析。
  is_original: false
  excerpt:
  - 浏览器打开文档，点击插件，一切随心所欲~
  - 基于文章内容，提出问题，界面回答问题
- name: 结构化输出框架
  desc: 通过指令要求AI按特定结构（如商业模式画布表格、亮点/背景/收益/变现/延展/行动指南六维框架、高赞标题样式）输出内容，提升信息密度与可读性。
  is_original: true
  excerpt:
  - 这篇文章里的项目商业模式画布是什么，以表格的形式展示
  - 请详细写出文章里的亮点、背景、收益、如何变现、延展思路和行动指南，每个子要点前面都加上适当的表情
  - 用爬虫工具，抓取高赞高评论的标题，让插件根据文章内容和高赞标题样板生成适合文章的标题、摘要等内容
methods:
- name: __overview__
  desc: HARPA AI插件全流程使用方法论：安装插件 -> 配置语言与模型接入 -> 唤醒插件 -> 执行预置/自定义指令 -> 迭代优化输出 -> 拓展应用场景。
  excerpt:
  - 首先，我们来看怎么安装插件...快捷方法是复制插件链接，浏览器里打开，点击添加到Chrome
  - 第一步，改语言...第二步，gpt模型...选择Browser session或OpenAI API key
  - 调用HARPA插件后，可以使用它内置的100+快捷命令
- name: 三步实战分析法
  desc: 针对单篇长文的标准化分析流程：1./summary 自动总结核心观点；2./todo 提取可执行行动清单；3.自助问答 深度挖掘细节（如商业模式画布、变现路径）。
  excerpt:
  - 这篇指南主要是调用三个指令，分别是/summary，/todo和自助问答
  - 在对话框里输入/summary，插件就会自动运行
  - 在对话框输入/todo，点击命令，发送
  - 这篇文章里的项目商业模式画布是什么，以表格的形式展示
- name: 模型双轨接入法
  desc: 提供Browser Session（免费/Plus共享账号会话）与OpenAI API Key（按量付费、高并发、GPT-4独占）两种模型接入模式，平衡成本与性能。
  excerpt:
  - 在openai connection type，可以选择对应的调用方式。比如Browser session 浏览器会话...第二个是OpenAI API key
  - 如果是plus会员，就可以选GPT4模型
- name: 指令迭代优化法
  desc: 针对AI输出不满意时，通过追加指令（增加细节要求、指定格式、添加表情符号、引用样式模板）进行多轮对话优化，直到达到预期质量。
  excerpt:
  - 如果觉得回答的内容不够详细不够生动，可以这样写指令：请详细写出文章里的亮点、背景、收益、如何变现、延展思路和行动指南，每个子要点前面都加上适当的表情
  - 还可以根据精华帖的标题样式来！最后的最后，帮我写个有意义的结尾提出改进的方法
theorems:
- name: 工具降维打击认知负荷
  desc: 通过预置Prompt与网页感知技术，将‘阅读-理解-总结-应用’的高认知负荷流程压缩为‘点击-指令-获取结构化结果’的低门槛操作，实现学习效率的量级跃升。
  excerpt:
  - 不需要调教gpt，插件已经帮我们预置好脚本，我们只需要发出总结指令，它就自动开始对话并给出总结的内容要点！
  - 而不是，哼哧哼哧复制粘贴内容到gpt然后才开始！而是，浏览器打开文档，点击插件，一切随心所欲~
  - 简单一个指令，可以很好的总结了文章的内容，这样的插件可以应用在各种学习上，快速总结内容摘要，学习思考总结快人一步！
- name: 结构化模板复用即复利
  desc: 将高质量内容的输出结构（如高赞笔记框架、商业模式画布、标题公式）显式化为可复用指令/模板，实现单次学习、多次复利的知识生产模式。
  excerpt:
  - 想不想写出像圈友许山山这样简单方便还吸引人的高手分享笔记？自动生成还高赞又利他！
  - 用爬虫工具，抓取高赞高评论的标题，让插件根据文章内容和高赞标题样板生成适合文章的标题、摘要等内容
  - 目前看到的是它还支持自定义的指令，可以将自己特定要求的指令输入，可以和summary一样一键调用
findings:
- name: 案例一：棋牌室复盘帖深度拆解
  desc: '[evidence] 通过/summary提炼出核心商业逻辑，/todo提取出选址/装修/运营等可执行清单，自助问答生成商业模式画布表格及六维详细框架（亮点/背景/收益/变现/延展/行动），验证了三步法对商业案例的深度挖掘能力。'
  excerpt:
  - 插件运行后，得出该篇文章的todo list
  - 精华帖总结框架，回答如下...亮点、背景、收益、如何变现、延展思路和行动指南
- name: 案例二：生财新人航海收获帖快速总结
  desc: '[evidence] 对第二篇精华帖应用/summary指令，快速生成包含背景、过程、收获、心法的结构化摘要，验证了方法在个人成长/变现类文本上的泛化性。'
  excerpt:
  - 简单一个指令，可以很好的总结了文章的内容
  - 阅读精华帖“从失败到成功变现，生财新人成功变现四位数的航海收获”
- name: 案例三：元认知式内容创作辅助
  desc: '[evidence] 作者将插件用于自身创作流程：基于当前文章生成摘要、仿高赞风格起标题、撰写结尾与改进建议，验证了插件对内容生产端的反哺价值。'
  excerpt:
  - 基于这篇文章，让它帮我写摘要，帮我起标题，还可以根据精华帖的标题样式来！最后的最后，帮我写个有意义的结尾提出改进的方法
- name: Browser Session模式的登录态依赖性
  desc: '[claim] 素材宣称Browser Session模式可自动识别已登录GPT账号并据此提供模型选择（Plus可用GPT-4），但未实测其稳定性、频率限制及隐私风险。'
  excerpt:
  - 选择这个选项后，它会自动识别我们已经登录的gpt账号，并根据gpt账号类型显示出可选的模型。如果是plus会员，就可以选GPT4模型
