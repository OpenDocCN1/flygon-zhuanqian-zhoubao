- 'no': 3
  name: 极速闭环法 —— 从听闻项目到首单变现的最短路径
  desc: 方法论：新人入场不求大而全，只求‘跑通’。步骤：精华帖选题 → 立即执行搭建MVP（钱包/建站/账号） → 首单验证 → 复盘迭代。两周内跑通流程优于三月完美策划。
  role: method
  src:
  - paper: docs/202306/20230613_168.md
  - paper: docs/202306/20230613_169.md
  - paper: docs/202306/20230613_240.md
  - paper: docs/202306/20230613_241.md
- 'no': 4
  name: 轻装上阵·以小博大 —— 新人仓位与试错纪律
  desc: 核心策略：资金仓位控制在可承受损失范围（几百至几千美元），通过早期低成本铸造/建站/测品博取高倍潜力（期权思维），严格执行‘分批止盈锁定本金+移动止损’规则，杜绝FOMO追高与钻石手死拿。
  role: method
  src:
  - paper: docs/202306/20230613_168.md
  - paper: docs/202306/20230613_240.md
  - paper: docs/202306/20230613_241.md
- 'no': 5
  name: 先抄再超 —— 站在巨人肩膀上起跑
  desc: 新人学习策略：第一阶段完全复制标杆案例/竞品验证模式（UI布局、内容结构、推广渠道），跑通流程后再基于自有数据（跳出率、用户反馈、A/B测试）进行差异化创新，规避‘创新陷阱’与‘玄学操作’。
  role: method
  src:
  - paper: docs/202306/20230613_169.md
  - paper: docs/202306/20230613_240.md
  - paper: docs/202306/20230613_171.md
- 'no': 6
  name: 实战复盘一：Web3小航海 —— 3个月锁定300万的BRC20实战全记录
  desc: 案例还原：2.7入圈 → 3月初抢跑铸造ORDI/SATS（Gas费成本） → 4-5月分批止盈兑换稳定币/BTC → 5月底锁定300万利润；反面教材：群内钻石手因未止盈导致数十万美金缩水。
  role: experiment
  src:
  - paper: docs/202306/20230613_168.md
- 'no': 7
  name: 实战复盘二：大二学生短视频矩阵 —— 两周变现1w+的极速执行样本
  desc: 案例还原：5.17刷到天涯神贴 → 立即三平台（抖音/B站/视频号）各建一号 → 极速闭环跑通流程 → 迭代优化迎来爆发 → 两周收入破万；头部玩家实测单号日引流仅5-6人，印证矩阵操作必要性。
  role: experiment
  src:
  - paper: docs/202306/20230613_169.md
- 'no': 8
  name: 实战复盘三：程序员联盟站 —— 从0到月入十万再到被封的完整生命周期
  desc: 案例还原：六维模型筛选Amazon Affiliate → <$100建站 → A/B测试选品锁定Amazon → 复制竞品布局 → 挖掘‘百分比折扣搜索’隐藏功能使转化率提升3倍
    → SEO+FB矩阵引流 → 外包自动化实现睡后收入 → 因商标合规/付费外链/多联盟混铺/服务器瓶颈四大红线触碰导致项目终局。
  role: experiment
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 9
  name: 实战复盘四：TikTok Shop东南亚达人带货 —— 几百播放出单的低门槛红利窗口
  desc: 案例还原：平台战略转向全托管清退跨境卖家 → 本土商家生存空间打开 → 达人带货成核心流量承接方；马来/菲律宾实测：单账号月GMV 20-30万美金、佣金15-20%、月入30万RMB、几百播放即出单；美区补贴10美金/条加持，建议现阶段深耕东南亚、提前布局美区账号。
  role: experiment
  src:
