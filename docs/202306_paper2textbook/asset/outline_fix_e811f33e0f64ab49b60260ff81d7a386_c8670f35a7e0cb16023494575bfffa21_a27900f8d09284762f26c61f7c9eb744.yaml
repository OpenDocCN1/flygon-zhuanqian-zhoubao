- 'no': 13
  name: 执行力是新人变现的唯一核心杠杆
  desc: 论证：对于认知不足的小白，执行力（立即行动、极速闭环、持续迭代）比策略选择更重要；赚钱非偶然，而是高密度执行的必然结果。
  role: proof
