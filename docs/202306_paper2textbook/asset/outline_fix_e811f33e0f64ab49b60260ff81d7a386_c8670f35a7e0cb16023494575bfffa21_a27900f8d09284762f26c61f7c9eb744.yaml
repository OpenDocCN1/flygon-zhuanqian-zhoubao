- 'no': 2
  name: 社群杠杆 —— 把‘几年’学习曲线压缩到‘几周’
  desc: 定义高质量付费社群通过‘导师带路+同伴互助+实时情报流+实战打卡’四位一体模式，为个体认知边界有限的新人提供杠杆，使其在红利窗口关闭前完成‘入圈-实战-变现’闭环。
  role: definition
  src:
