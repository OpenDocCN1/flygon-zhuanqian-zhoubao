  name: 社群杠杆放大个体认知论
  desc: 论证：个体在复杂新兴领域认知边界有限，高质量社群通过‘领航员经验沉淀+同伴集体智慧+实时信息流’提供杠杆，将学习曲线从‘几年’压缩到‘几周’，在红利窗口关闭前完成闭环。
