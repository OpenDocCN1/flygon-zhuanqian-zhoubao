- 'no': 11
  name: FOMO与钻石手是新赛道最大杀手论
  desc: 证明：新赛道从0到1爆发、上所/爆发、FOMO到顶点的完整周期中，最大风险不在于买早买错/做早做错，而在于卖不掉/停不下来：FOMO追高接盘或贪婪死拿导致账面暴利归零，生存第一、利润第二。
  role: proof
  src:
