paper: docs/202306/M0hMdjWj3o8WtNxZdv4cLnfenIh.md
desc: 该素材介绍了一个名为“Mediabuy Brand Bid”（媒体购买品牌词竞价）的单人出海赚钱项目，核心逻辑是利用 Google Ads 搜索广告竞价商家品牌词（极低
  CPC 成本），通过联盟营销链接推广赚取佣金差价。素材通过三组真实账户数据验证了项目的高 ROI（359%-496%），详细拆解了账户准备、联盟申请、品牌词选词及合规边界的操作步骤，并阐述了低成本原理（品牌词竞价极低）及长期可行性。
concepts:
- name: Mediabuy Brand Bid (媒体购买品牌词竞价)
  desc: 素材核心提出的项目模式，指通过付费流量购买的方式，在 Google Ads 上竞价商家的品牌词，将流量导向联盟营销推广链接，赚取佣金与广告成本的利差。
  is_original: true
  excerpt:
  - Media Buy是什么？直译就是媒体购买，通俗的理解就是付费流量购买，通过付费的方式购买流量来推广商家的链接，赚取佣金和流量费用支出中的利差。
  - 项目原理... 申请到广告利用Google Ads，出价他们的品牌词，但是广告链接是你自己的即可。
- name: 品牌词低价机制
  desc: 核心成本优势概念，指品牌词在 Google Ads 中因竞争极低、质量得分高，实际出价可无限接近于零（如 0.01 当地货币单位），从而保证极高的
    ROI 空间。
  is_original: true
  excerpt:
  - 其次，为什么单价这么低？因为你是出价品牌词，品牌词实际谷歌出价是无限接近于零，也是免费，所以只要你设置没问题，单价到0.01完全没有问题
- name: 合规品牌词竞价
  desc: 区别于违规套利的核心概念，指商家明确允许联盟客竞价其品牌词，或竞价竞争对手品牌词，属于联盟协议许可范围内的合规操作。
  is_original: true
  excerpt:
  - 此方法不是违规的吗？这句话对，也不对，国外有很多商家，允许你出价他们的品牌词，而且一定可以出价他们竞争对手的品牌词。
- name: Biweekly支付联盟
  desc: 素材推荐的广告联盟结算周期标准，指每两周结算一次佣金的联盟（以 Awin 为例），用于降低新手面临的广告联盟支付信誉风险。
  is_original: false
  excerpt:
  - 广告联盟虽然有很多有信誉又好的广告联盟，我们一般用Biweekly支付的Awin广告联盟来说明。
methods:
- name: __overview__
  desc: Mediabuy Brand Bid 项目的标准化执行流程（SOP），包含账户基建、联盟准入、选品选词、投放执行四大步骤，构成从 0 到 1 的完整操作闭环。
  excerpt:
  - 1，准备一个Google Ads的帐号，个人开户或者代理商开户均可。
  - 2，注册一个广告联盟的帐号，找到有大体量品牌词的广告。
  - 3，申请到广告利用Google Ads，出价他们的品牌词，但是广告链接是你自己的即可。
- name: Google Ads 账户搭建策略
  desc: 解决流量来源问题的方法，支持个人开户或代理商开户，核心目标是获取稳定的 Google 搜索流量入口。
  excerpt:
  - 准备一个Google Ads的帐号，个人开户或者代理商开户均可。
- name: 高体量品牌词挖掘与筛选
  desc: 解决推广对象选择的方法，要求在联盟后台寻找拥有大搜索量品牌词的商家 Offer，并确认商家允许品牌词竞价（或可竞对手品牌词）。
  excerpt:
  - 注册一个广告联盟的帐号，找到有大体量品牌词的广告。
  - 申请到广告利用Google Ads，出价他们的品牌词... 国外有很多商家，允许你出价他们的品牌词，而且一定可以出价他们竞争对手的品牌词。
- name: 超低 CPC 出价执行战术
  desc: 利用品牌词低竞争特性，将关键词出价设置为当地货币最小单位（如 0.01 港币/美元），结合汇率差（港币账户成本更低）极致压缩获客成本。
  excerpt:
  - 品牌词实际谷歌出价是无限接近于零... 单价到0.01完全没有问题，如果你了解各个国家的汇率，这个0.01是当地货币的0.01，比如港币的0.01港币成本远小于美元的0.01美元。
theorems:
- name: 新手双坑规避公理
  desc: 素材主张该项目通过锁定 Google 搜索流量（质量确定）和 Biweekly 支付的 Awin 联盟（信誉确定），从根本上解决了新手做付费流量面临的“流量质量不可控”和“联盟拖欠佣金”两大核心风险。
  excerpt:
  - 对于一个新手，如果去购买流量，一般会踩两个坑：1，流量平台的流量质量无法把握。2，广告联盟支付信誉不清楚。而这个项目... 首先流量是Google的搜索流量，广告联盟...
    我们一般用Biweekly支付的Awin广告联盟来说明。
- name: 品牌词套利必然盈利论
  desc: 核心盈利主张：由于品牌词 CPC 可低至 0.01 当地货币，而联盟 Offer 的 EPC（每次点击收益）极少低于 0.01，因此只要设置正确，数学期望上必然盈利，不依赖特定
    Offer 选品技巧。
  excerpt:
  - 但是当你的CPC本身是0.01的单价的时候，基本上任何产品都会赚钱，很少见到有EPC低于0.01的广告联盟里的Offer。
- name: 长周期可持续性判断
  desc: 主张该项目已存在十余年，生命周期取决于广告主及联盟合规团队的政策松紧，而非平台算法迭代，属于长周期、可规模化操作的项目。
  excerpt:
  - 这个项目可以做多久？我们从十几年前就这样玩，只是某些广告主以及广告联盟的合规团队要求比较严格而已。
- name: 单人百万年收益阈值
  desc: 主张在不追求极致杠杆、控制风险比的前提下，单人操作该项目年净利润突破 100 万人民币是轻松可达成的基准线。
  excerpt:
  - 这个项目可以赚多少钱？如果不追求极致，控制一个风险比，一年一百万人民币以上非常轻松。
findings:
- name: 账户组1 实战复盘数据
  desc: '[evidence] 素材提供的实证数据：Awin 联盟佣金收入 5715 美元，Google Ads 成本 1220 美元，净利润 4495 美元，ROI
    368%。'
  excerpt:
  - 佣金收入：3403英镑+835欧元+369美元；汇率划算后，合计佣金收入：5715美元；
  - 广告成本：1220美元；
  - 利润：5715美元 – 1220美元 = 4495美元；回报率：ROI = 4495 ÷ 1220 = 368%；
- name: 账户组2 实战复盘数据
  desc: '[evidence] 素材提供的实证数据：Awin 联盟佣金收入 7218 美元，Google Ads 成本 1210 美元，净利润 6008 美元，ROI
    496%（三组中最高）。'
  excerpt:
  - 佣金收入：4913英镑+685欧元+67美元；汇率换算后，合计佣收入：7218美元；
  - 广告成本：1210美元；
  - 利润：7218美元 – 1210美元 = 6008美元；回报率：ROI = 6008 ÷ 1210 = 496%；
- name: 账户组3 实战复盘数据
  desc: '[evidence] 素材提供的实证数据：Awin 联盟佣金收入 3988 美元，Google Ads 成本 867 美元，净利润 3121 美元，ROI
    359%。'
  excerpt:
  - 佣金收入：3031英镑+37美元；汇率换算后，合计佣收入：3988美元；
  - 广告成本：867美元；
  - 利润：3988美元 – 867美元 = 3121美元；回报率：ROI = 3121 ÷ 867 = 359%；
- name: 单日实时盈利验证
  desc: '[evidence] 2023年4月4日更新的单日截图数据，进一步佐证项目处于持续盈利状态，而非仅限于历史数据。'
  excerpt:
  - 2023年4月4日更新，还是稍微奉告，免得一些人不理解，当日收入，成本是其中上面一个Google Ads的...
- name: 港币账户成本优势推论
  desc: '[claim] 素材宣称若使用港币计费账户，广告成本可再降低至少 7 倍（因 0.01 港币 << 0.01 美元），但认为在现有高 ROI 下无需过度优化此细节。'
  excerpt:
  - 这里面如果是用港币账户，成本还可以降低至少七倍，但是这些与这个项目是否赚钱关系不大，也没必要在本身比较低的项目成本上过度优化。
