- name: 蓝海选品失败反面教材案例
  desc: '[evidence] 淘宝7年老卖家搬运蓝海选品逻辑至小红书，测试2周仅零散出单、打击信心，经作者调整赛道后好转，数据支撑''小红书早期不适合蓝海冷启动''的判断。'
  excerpt:
  - 他测试了 2 周之后，就找我大吐苦水，商品和笔记怎么铺效果都不大，只有零零散散几单，做得太打击信心了。后面，看了店铺之后，就明白了问题的所在，迅速给他调整了赛道。
