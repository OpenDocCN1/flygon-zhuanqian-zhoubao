paper: docs/202306/SUTKd7wdDoAg2Exv7hoc8m0BnOK.md
desc: 该素材为《ChatGPT 投喂指南》一文，系统阐述了向 ChatGPT 输入外部知识（投喂）的必要性、支持格式、底层技术原理、不同文件类型的实操工具与方法，以及高质量提问与复用提示词模版的策略。核心主张在于：ChatGPT
  知识截止与私有数据不可见的局限，必须通过“投喂”外部资料打破；实操上区分短文本直接粘贴、联网插件获取网页、Embedding/RAG 技术处理长文档/PDF、Code
  Interpreter 分析 Excel 等差异化路径；并提供了从“抄作业”到“掌握底层逻辑”的提问进阶路径。
concepts:
- name: 知识投喂
  desc: 指将 ChatGPT 训练数据中不存在的私有数据、最新联网内容或长文档，通过各种技术手段输入模型上下文或知识库，使其具备处理特定任务能力的过程。
  is_original: false
  excerpt:
  - 并非我们询问的问题资料都在 ChatGPT 的数据库中，因此我们需要教它。
  - 家里来了一个机器人，还不会使用洗碗机。你把洗碗机的使用手册投喂给他，它就能迅速掌握这些知识。
- name: Token 限制与长文本处理
  desc: ChatGPT 网页版受限于模型上下文窗口（如 3.5 为 4096 tokens，约 2000 字），超长文本无法直接投喂，需通过切分、Embedding
    检索等工程化手段解决。
  is_original: false
  excerpt:
  - 受限于 OpenAI 接口对 token 数量的限制，最常用、也最廉价的 ChatGPT 3.5 的 token 限制是 4096 tokens，可以简单粗暴的认为是
    2000 字。
  - 难点不在大小，而在于如何对长文档进行处理，切分。
- name: Fine-tuning (微调) vs Embedding (向量化/语义检索)
  desc: 两种注入领域知识的核心技术范式对比：Fine-tuning 类比‘捏个小人’，改模型权重，泛化强但易发散幻觉；Embedding 类比‘做说明书’，做语义检索，答案收敛可控，适合事实问答。
  is_original: false
  excerpt:
  - finetuning是捏了个小人，会自主回答。embedding就是做了个说明书，只回答说明书里边有的，没有回答不了。
  - 一个非常发散，一个则更加收敛。
- name: RAG (Retrieval-Augmented Generation) 流程
  desc: 素材中未显性命名但详细描述的标准长文本处理流程：文档切块 -> 向量化存储 -> 问题向量化 -> 相似度检索 -> 拼接上下文调用 LLM 生成。
  is_original: false
  excerpt:
  - 1. 用户输入长文本，工具对长文本按照策略切分成为文本块
  - 2. 对每一个文本块进行向量计算（Embedding）并存储到向量数据
  - 3. 用户提问进行向量计算
  - 4. 从向量数据看寻找和用户提问相似度最高的内容
  - 5. 整合命中的内容，连同用户的问题，调用 OpenAI Chat 接口进行处理
- name: 提示词模版复用
  desc: 降低使用门槛的实用策略：通过成熟提示词库（如 aishort.top）或结构化模版（如风向标拆解模版），实现‘抄作业’式快速获得高质量输出，而非从零编写
    Prompt。
  is_original: false
  excerpt:
  - A、知道在哪里找到好的提示词，为自己所用；
  - https://www.aishort.top/ 这个网址，直接内置好了 200 多套提示词的模版，你根据需求直接复制粘贴。
  - 关于风向标拆解的问题模版... 请基于给定的风向标从一个创业者的角度填写以上模板并进行相应扩展
methods:
- name: __overview__
  desc: 素材整体方法论：按数据源类型（短文本/网页/PDF/Excel/多模态）分类，匹配对应的投喂工具链（原生对话框/联网插件/RAG工具/Code Interpreter），辅以结构化提示词工程，实现从数据输入到任务产出的标准化流程。
  excerpt:
  - 我们根据不同的文件格式，来谈谈投喂的具体方法。
  - 首先，投喂区分为：网页端的投喂和 api 的投喂。
- name: 短文本直接投喂法
  desc: 针对 Token 限制内的短文本（如小红书文案、段落），直接在 New Chat 对话框粘贴内容，配合指令（如‘学习风格’、‘模仿写作’）即时生效，利用模型上下文学习能力零样本/少样本完成任务。
  excerpt:
  - 如果你想告诉 ChatGPT 的教育信息较短，你直接在 new chat 就可以进行投喂。
  - 例如，我们将一个小红书的文案发给它，让它学习这种风格，开始模仿
- name: 网页内容联网获取法
  desc: 三种主流路径：A. New Bing (免费、搜索导向、不支持多轮深聊)；B. 浏览器插件 WebChatGPT (免费、嵌入原生界面、易失效)；C.
    官方 Plugin 机制 (需 Plus、安装 WebPilot 等插件、稳定性高、支持深度交互)。
  excerpt:
  - A 使用 New Bing，最简单... 优点：快捷，免费 缺点：...没办法和它唠嗑。
  - B 基于谷歌浏览器的插件... 比如 WebChatGPT
  - C 基于 open ai 的插件应用市场的联网插件... 搜索应用“WebPilot”这款插件
- name: PDF/长文档 RAG 工具投喂法
  desc: 利用 Embedding + 向量检索技术处理超长文档。Plus 用户用官方插件 AskYourPDF/ChatWithPDF；免费用户用 ChatPDF、Chatpan
    等 SaaS 工具；开发者自建需实现：爬虫/解析 -> 切块 -> 向量化存储 -> 检索拼接 -> LLM 生成。
  excerpt:
  - PDF 格式的文件... 可以通过官方和野生的插件来实现访问。如 plugin 中的 AskYourPDF、ChatWithPDF
  - 如果你还不是 plus 用户也没关系，你可以使用 ChatPDF 这款工具... 圈友自制的文档访问工具 Chatpan
  - 如果是一个长文档，已经超过 chat 接口的 token 限制，那么就需要对长文本进行切割，选取和用户提问相关的内容组合到 chat 接口的上下文中。
- name: Excel 数据自然语言分析法
  desc: 利用 GPT-4/Code Interpreter 能力，将表格结构、字段含义、分析目标用自然语言描述，模型输出 Excel 公式或 Python
    代码，用户复制执行即得结果，无需手动拖拽公式。
  excerpt:
  - 对于 Excel 表格的数据投喂也比较简单上手，直接用自然语言对 Excel 表格中的数据描述清晰，把想要实现的需求表达清楚就好。
  - 我们直接对 ChatGPT 用这样的语句发问即可... 根据它提供的公式，我们直接将公式复制，粘贴到 E1 单元格中
- name: 结构化提示词工程模版法
  desc: 将复杂分析任务（如文章深度解读、商业风向标拆解）拆解为固定字段的结构化 Prompt 模版（角色设定、任务步骤、输出格式约束、示例），实现高稳定性、可复用的高质量输出。
  excerpt:
  - 提示词是什么呢？... 以这篇文章为例... 对 ChatGPT 输入了提示词后得到的结果
  - 关于风向标拆解的问题模版... Q：你今天关注的风向标是哪一个？... 你是我的商业助手，需要帮助我分析赚钱的风向标。请基于给定的风向标从一个创业者的角度填写以上模板并进行相应扩展
theorems:
- name: 投喂必要性定理
  desc: ChatGPT 仅掌握训练截止日期前的公开知识，对于私有数据、最新实时信息、超长文档等‘库外知识’，必须通过外部投喂机制引入上下文或知识库，模型才能基于此进行推理、分析与创作。
  excerpt:
  - ChatGPT 本身的公开数据库更新到 21 年 9 月... 我们想要使用 ChatGPT 分析的数据/文本往往存在两种状况：1、这是私人数据，未被公开，ChatGPT
    没有 2、这是联网公开内容，但是未被 ChatGPT 收录
  - 为了让 ChatGPT 更能明白我们的指令，我们有必要进行知识投喂。
- name: 技术范式权衡原则
  desc: Fine-tuning 适合改变模型风格、语气、推理模式等‘内化’需求，但成本高、易幻觉、难更新；Embedding/RAG 适合事实性问答、知识库查询、长文档分析等‘外挂’需求，成本低、可追溯、易维护，二者互补而非替代。
  excerpt:
  - finetuning是捏了个小人，会自主回答。embedding就是做了个说明书，只回答说明书里边有的，没有回答不了。
  - 一个非常发散，一个则更加收敛。
- name: 提问能力决定上限法则
  desc: ChatGPT 输出质量上限由提示词质量决定；掌握‘底层提问逻辑’(B类)优于单纯‘找现成提示词’(A类)；但在技能成熟前，利用提示词库‘抄作业’是最高性价比的启动策略。
  excerpt:
  - ChatGPT 最难的就是：如何提出一个好问题。一个好问题就意味着一个高分的答案，人和人的能力区分也正是由于提问能力的差异。
  - 在我看来，掌握如何提问分为两种：A、知道在哪里找到好的提示词... B、自己掌握了提问的底层逻辑...
  - 在我们没有熟练掌握‘调教’技能之前，我们当然可以抄作业
findings:
- name: New Bing 交互模式局限
  desc: '[evidence] 作者实测 New Bing 基于搜索引擎架构，回答指向短、不支持多轮深度对话、易拒绝继续对话，适合一次性问答不适合复杂协作。'
  excerpt:
  - 优点：快捷，免费 缺点：因为基于搜索引擎，所以它的答案指向很短，你没办法和它唠嗑。它还很傲娇，总是动不动就拒绝和你继续下去了。
- name: ChatPDF/Chatpan 类工具实测有效
  desc: '[evidence] 作者实测将‘亦仁过往发言’投喂至 Chatpan，构建‘亦仁助手’，验证了 RAG 类 SaaS 工具在个人知识库构建与高频问答场景的可用性与耐心度。'
  excerpt:
  - 我就把亦仁的过往发言丢进去，然后随时随地问亦仁问题。这个亦仁助手非常有耐心、而且秒回。
- name: Excel 公式生成实测可用但非完美
  desc: '[evidence] 实测自然语言描述需求生成公式（如筛选表现较好的网页），公式可直接复制到单元格生效，但结果呈现‘并非最完美’，需人工调教优化。'
  excerpt:
  - 根据它提供的公式，我们直接将公式复制，粘贴到 E1 单元格中，回车即可得到以下结果... 不过从结果中可以看出，结果呈现并非最完美的结果，鉴于我们谈的是数据投喂，剩下的调教优化大家可以接着完成。
- name: 结构化提示词实测深度分析公众号文章
  desc: '[evidence] 使用特定提示词模版（含联网指令+分析框架）对指定公众号文章进行深度拆解，输出包含核心观点、逻辑结构、商业洞察等结构化结果，验证了‘好提示词=高分答案’的实战效果。'
  excerpt:
  - 以这篇文章为例：https://mp.weixin.qq.com/s/guBFNFtwR9WdmYlFDKtJNg 对 ChatGPT 输入了提示词后得到的结果...
    看，理智的人看完这通分析，不但不想和老婆创业、甚至还有点想离婚。
- name: 多模态输入尚未开放
  desc: '[claim] 素材声称 GPT-4 发布会宣布支持图片、音频、视频多模态输入，但截至文档撰写时间（2023年5月）仍未向普通用户开放，图形类图片无法直接识别，文本类图片需
    OCR 转文本后投喂。'
  excerpt:
  - ChatGPT4.0 发布会的时候宣布了支持多模态，即音频、图片、短视频格式的输入和输出。但是目前为止还没放出来，静候佳音吧。
  - 图形图片（如一只大猩猩和一个有色人种），gpt 是无法完成输入和识别的。
