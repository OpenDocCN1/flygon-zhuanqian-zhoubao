units:
- 'no': 1
  name: 私域运营的底层逻辑 —— 把微信变成“注意力提款机”
  points:
  - '**为什么需要这个概念？**'
  - '- 私域流量的价值不在于好友数量，而在于你能不能让用户从信息洪流中“看见你”'
  - '- 传统主动加粉、群发广告正在被折叠和限流机制反噬，必须转向精细化运营'
  - '- 注意力是稀缺资源，管好自己注意力和用户注意力，私域才可能持续变现'
  - '**核心定义**'
  - '- 私域运营 = 在微信生态内，通过注意力管理（自身+用户）和信任分层，建立可重复、低成本触达用户的能力'
  - '- 注意力管理包括：折叠低频群、关注核心成员、控制发布节奏、设计首句钩子'
  - '- 信任分层包括：备注-标签-描述、分组可见、付费门槛，将用户按信任深度分层并差异化交付'
  - '**关键性质**'
  - '- 精准度优先于数量：一次对高意向用户的精准触达，转化价值可能是泛粉的数十倍'
  - '- 触达成本递增性：微信越严控营销，合规且精准的触达越稀缺，私域价值越大'
  - '- 双向管理性：运营者先管住自己的注意力，才能有效争取用户的注意力'
  - '**典型例子**'
  - '- 用“标签+群发”只给最近互动过的300人发福利，比给5000人群发广告带来的复购更高'
  - '- 打开“关注核心成员”后，即使群已折叠也能第一时间看到关键客户的提问'
  - '**边界条件**'
  - '- 微信风控越来越严，任何诱导式群发与脏话术都可能触发封号，需在合规框架内操作'
  - '- 信任分层的前提是用户画像数据清晰，没有完善备注和标签，分层运营无从谈起'
  sources:
  - paper: docs/202306/UAm9djDdWol9ImxIO3mcBucInGg.md
    role: improve
  - paper: docs/202306/GG5MdQYCgoWOhDxdSQbc4zUgnDc.md
    role: apply
  excerpts:
  - 你在做事情的时候是在积累资源还是在消耗资源
  - 回购客户或者老带新推荐来的客户特别多，因为他们都特别信任我
- 'no': 2
  name: 工具即基建 —— 让微信原生功能成为“私域军火库”
  points:
  - '**为什么需要这个概念？**'
  - '- 外部 SCRM 工具成本高、有封号风险、数据不自主，不适合普通人'
  - '- 微信原生功能已覆盖私域运营 90% 以上的高频需求，只是多数人不知道如何组合'
  - '**核心定义**'
  - '- 工具即基建：把微信自带的收藏、笔记、标签、群管理、安全中心等功能作为私域运营的默认基础设施'
  - '- 通过“单人群+收藏+标签”可组合成知识库，“标签+群发+备注”可组合成轻量 CRM'
  - '**关键性质**'
  - '- 零成本、零迁移、数据主权完全可控'
  - '- 与微信规则兼容，封号风险远低于第三方侵入式工具'
  - '- 可组合性强，简单功能通过组合拳实现复杂运营'
  - '**典型例子**'
  - '- 给好友名片备注“渠道-姓名-业务”，再用标签分群，群发时按标签筛选即可精准触达'
  - '- 用“单人群+置顶”管理每日待办，替代备忘录'
  - '**边界条件**'
  - '- 原生功能没有华丽的自动化，但胜在稳定，需要人工维护标签与画像'
  - '- 群发等操作仍受频次和内容限制，过度群发一样会被限流'
  sources:
  - paper: docs/202306/20230613_272.md
    role: apply
  - paper: docs/202306/DZundEBSqoCdx2xdBjNc5AA7nye.md
    role: apply
  excerpts:
  - 前段店铺介绍：淘宝店、小红书、闲鱼、公众号、抖音、视频号、微信群、朋友圈
  - 代理合伙SOP：让所有帮你做事儿的人，都有一套标准可复制的SOP
- 'no': 3
  name: 单人群 —— 给自己造一个“云端私人抽屉”
  points:
  - '**为什么需要这个概念？**'
  - '- 收藏夹会吃灰，备忘录会散落，信息管理工具碎片化且成本高'
  - '- 需要一个零成本、随时可达、多端同步的私有知识库'
  - '**核心定义**'
  - '- 单人群 = 仅包含自己的微信群，通过“面对面建群”或“拉好友后踢人”创建，充当私有云端收藏夹、资料库、灵感本与待办清单'
  - '**关键性质**'
  - '- 多端同步：手机、电脑、平板都能访问'
  - '- 可分类：不同主题建不同单人群，支持置顶快捷访问'
  - '- 原生化：数据留在微信生态内，不依赖第三方笔记软件'
  - '**典型例子**'
  - '- 建一个“选题库”单人群，看到好文章直接丢进去，需要时搜索群名即可找到'
  - '- 用单人群记录客户跟进待办，打勾后清除'
  - '**边界条件**'
  - '- 单人群本质是微信群，有容量限制，需定期整理，否则同样变成垃圾场'
  - '- 不适合复杂知识体系搭建，仅适合轻量收集、灵感存储与待办管理'
  sources:
  - paper: docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md
    role: origin
  excerpts:
  - 利用‘面对面建群’或‘邀请好友后踢人’创建仅含自己的群聊，作为私有化的云端收藏夹
- 'no': 4
  name: 好友三维标签体系 —— 给每个联系人戴上“身份手环”
  points:
  - '**为什么需要这个概念？**'
  - '- 好友一多，群发和运营就会变得混乱，无法做到差异化触达'
  - '- 微信单次群发有 200 人上限，倒逼运营者必须对好友进行精细分组'
  - '**核心定义**'
  - '- 好友三维标签体系 = 备注（身份-昵称-业务）+ 标签（群体属性）+ 描述（详细画像/资料）的结构化用户画像框架'
  - '**关键性质**'
  - '- 支撑精准群发：按标签筛选，单次触达不超过 200 人'
  - '- 支撑快速检索：搜备注、搜标签、搜描述都能快速定位用户'
  - '- 支撑分层运营：不同标签的用户看到不同的内容与产品'
  - '**典型例子**'
  - '- 备注“代理-小林-上海”，标签“核心代理”，描述填写合作历史、偏好、生日'
  - '- 群发新品时，先筛选标签“高意向客户”而非向全部好友群发'
  - '**边界条件**'
  - '- 需要持续人工维护，标签过粗则等于没打'
  - '- 描述字段不宜放入隐私信息，防止手机丢失导致泄露'
  sources:
  - paper: docs/202306/DZundEBSqoCdx2xdBjNc5AA7nye.md
    role: improve
  - paper: docs/202306/20230613_272.md
    role: apply
  excerpts:
  - 我是让我所有的代理合伙人统一用我们的头像，品牌名+昵称，用统一的介绍，加人话术
  - 建立SOP标准化流程，作家招募培训考核机制
- 'no': 5
  name: 消息置顶SOP —— 把群聊首页变成“品牌橱窗”
  points:
  - '**为什么需要这个概念？**'
  - '- 新进群用户不知道群价值，容易流失'
  - '- 群内信息杂乱，核心公告和交付内容容易被聊天淹没'
  - '**核心定义**'
  - '- 消息置顶 SOP = 将群公告与聊天置顶标准化为“新人引导+核心价值交付+时效性管理”的动态运营机制'
  - '**关键性质**'
  - '- 新人引导：置顶欢迎语、群规、必读资料，降低认知成本'
  - '- 核心交付：把课程链接、干货合集、活动入口固定在顶部'
  - '- 时效性管理：活动结束后及时取消过期置顶，避免信息噪音'
  - '**典型例子**'
  - '- 付费社群入群后首先看到置顶的“新人三件事”和“群规”'
  - '- 发售期间置顶优惠海报，结束后立即撤销'
  - '**边界条件**'
  - '- 置顶内容不宜超过 3 条，过多反而失去焦点'
  - '- 建群前必须明确目的、设定规则、准备价值，否则置顶也留不住人'
  sources:
  - paper: docs/202306/DZundEBSqoCdx2xdBjNc5AA7nye.md
    role: apply
  excerpts:
  - 群发售SOP的制定...人员需求：场控，主持人，互动嘉宾，分享老师。这个是基本配置
- 'no': 6
  name: 群聊分层过滤与重点突破 —— 在信息洪流中“潜水”而不“溺水”
  points:
  - '**为什么需要这个概念？**'
  - '- 微信群数量过多，消息轰炸会耗尽运营者的精力'
  - '- 重要客户和合作伙伴的消息可能被淹没在闲聊群中'
  - '**核心定义**'
  - '- 群聊分层过滤 = 利用“消息免打扰-折叠该群聊”隔离低频群；重点突破 = 利用“关注核心成员”穿透免打扰屏障，确保关键信息不漏'
  - '**关键性质**'
  - '- 物理隔离：折叠群聊后不再收到打扰，减少认知负担'
  - '- 穿透机制：关注成员最多 4 人，其消息即使群折叠也能提醒'
  - '- 批量清理：定期退出无效群，保持微信生态整洁'
  - '**典型例子**'
  - '- 将行业闲聊群折叠，但关注其中的 2 个潜在客户，他们发言时第一时间看到'
  - '- 用折叠群储存资料群，需要时再翻看'
  - '**边界条件**'
  - '- 关注成员数量有限，必须用在最关键的人身上'
  - '- 折叠不等于退出，长期不看的群应及时退出以降低管理成本'
  sources:
  - paper: docs/202306/UAm9djDdWol9ImxIO3mcBucInGg.md
    role: improve
  excerpts:
  - 之前我做事情的时候是在不断的消耗我的资源，而做副业之后是在不断的积累资源
- 'no': 7
  name: 标签化精准群发 —— 用“点名”代替“广播”
  points:
  - '**为什么需要这个概念？**'
  - '- 盲目群发不仅转化率低，还容易被用户拉黑、投诉甚至封号'
  - '- 微信对群发行为的限制日益严格，需要更精细、更合规的触达方式'
  - '**核心定义**'
  - '- 标签化精准群发 = 基于三维标签体系，建立“单标签<200人”的合规群发池，并执行标准化触达流程'
  - '**关键性质**'
  - '- 内容预编辑：提前准备好文案，带姓名或个性化关键词'
  - '- 标签筛选：选择高意向标签，避免打扰无关好友'
  - '- 引导交互：文案中设置回复关键词（如回复1），筛选深度意向'
  - '- 及时人工回复：群发后安排专人跟进回复，提升转化'
  - '**典型例子**'
  - '- 给标签“兴趣用户”群发体验课邀请：“回复1获取名额”，回复后人工私聊'
  - '**边界条件**'
  - '- 群发频率不能过高，建议每周不超过 2 次'
  - '- 文案必须像私聊，避免“广告嗅探”触发限流'
  sources:
  - paper: docs/202306/XHNNdajhloRsH2xt2MKcWEXSnic.md
    role: apply
  excerpts:
  - 打造个人ip是一个时间积累的过程...认真对待每一次你接的单子，如果你的口碑做好了，你的客户就会不断推荐身边的朋友来找你
- 'no': 8
  name: 付费社群筛选与运营 —— 用门票筑起“质量护城河”
  points:
  - '**为什么需要这个概念？**'
  - '- 免费社群容易涌入广告党、羊毛党，劣币驱逐良币'
  - '- 群主单向输出容易倦怠，社群活跃度和质量难以保证'
  - '**核心定义**'
  - '- 付费社群运营模型 = 通过付费门槛筛选高意向用户，利用沉没成本激励运营者持续产出，配合群规治理构建高质量闭环'
  - '**关键性质**'
  - '- 筛选：付费意愿即需求强度，过滤非目标人群'
  - '- 激励：用户付了费会更认真参与，运营者收了费会更有动力交付'
  - '- 承诺：付费是双向承诺，运营方必须超预期交付'
  - '**典型例子**'
  - '- 押金制打卡社群：入群交 99 元，完成打卡退还，有效提升完课率'
  - '**边界条件**'
  - '- 付费不是万能钥匙，没有真价值照样会被骂“割韭菜”'
  - '- 群规需要前置明确，违规即踢，否则劣质内容会侵蚀社群'
  sources:
  - paper: docs/202306/GG5MdQYCgoWOhDxdSQbc4zUgnDc.md
    role: apply
  excerpts:
  - 服务营销的核心是客户满意度...我觉得【共情能力】在我们日常的对接过程中十分的重要
- 'no': 9
  name: 朋友圈折叠算法对抗 —— 在算法眼皮底下“优雅刷屏”
  points:
  - '**为什么需要这个概念？**'
  - '- 朋友圈发布频率过高、内容重复、复制痕迹明显，会被折叠成一行，触达率暴跌'
  - '- 朋友圈是私域成交的主战场，必须适应折叠算法'
  - '**核心定义**'
  - '- 朋友圈折叠算法对抗 = 通过六维内容发布策略（首句钩子、表情符、发布间隔、图文混排、谐音字规避、互动权重）最大化内容被完整展示的概率'
  - '**关键性质**'
  - '- 首句钩子：第一行就吸引人，避免被折叠后毫无吸引力'
  - '- 发布间隔：同一时间高频发布是折叠主因，建议间隔 1 小时以上'
  - '- 图文混排：纯文字或纯图片更容易被判定为广告'
  - '**典型例子**'
  - '- 每日 4-6 条朋友圈，每条间隔至少 1 小时，首句用提问或悬念'
  - '**边界条件**'
  - '- 任何策略都无法对抗过度营销，内容质量仍然是最底层逻辑'
  - '- 营销敏感词命中是折叠触发条件，需持续建立词库规避'
  sources:
  - paper: docs/202306/LjGDdEdDhoyXjUxEiRYcKIdPnMg.md
    role: apply
  excerpts:
  - 文章在发布的可以定时「群发」，这个一定要选群发，不要选「发布」
- 'no': 10
  name: 朋友圈自定义位置/IP标签化 —— 把签名档变成“黄金广告位”
  points:
  - '**为什么需要这个概念？**'
  - '- 微信朋友圈触达率天然受限（估计不足 200 人），需要额外曝光入口'
  - '- 自定义位置和话题标签是免费且高曝光的个人品牌广告位'
  - '**核心定义**'
  - '- 朋友圈自定义位置/IP标签化 = 利用位置创建功能植入个人品牌口号、课程名、项目名，并使用话题标签聚合内容入口'
  - '**关键性质**'
  - '- 零成本：不需要投流，一次设置长期展示'
  - '- 高曝光：位置信息在朋友圈顶部展示，容易被看到'
  - '- 内容聚合：话题标签可把同主题朋友圈串联成系列'
  - '**典型例子**'
  - '- 把位置设置为“某某IP训练营”，每一条朋友圈都免费打一次广告'
  - '- 用“#私域日记01”“#私域日记02”串联连载内容'
  - '**边界条件**'
  - '- 位置名称需符合平台规范，过度营销可能被清理'
  - '- 话题标签不能替代内容价值，空有标签没有好内容依然无转化'
  sources:
  - paper: docs/202306/PxUIdhkj1oT256xg3gFcScIZnn6.md
    role: apply
  excerpts:
  - 可以做1元钱的引流产品——这里又有引流私域变现的玩法
- 'no': 11
  name: 朋友圈故事化连载 —— 让朋友圈变成“追更剧场”
  points:
  - '**为什么需要这个概念？**'
  - '- 单条朋友圈容易被刷过，无法形成持续关注'
  - '- 故事和悬念能激发好奇心，让用户主动翻看你的朋友圈'
  - '**核心定义**'
  - '- 朋友圈故事化连载 = 采用预告造势、标签串联、悬念设计的连载制策略，把单条内容变成长期内容 IP'
  - '**关键性质**'
  - '- 预告造势：定点发布“今晚八点讲一个亏钱故事”，吸引围观'
  - '- 标签串联：用 #故事分享1/2/3 等标签让用户能顺着看'
  - '- 悬念设计：每条结尾留钩子，驱动用户期待下一集'
  - '**典型例子**'
  - '- 连续一周分享“从月薪3000到月入3万”的真实踩坑经历，每集一个转折'
  - '**边界条件**'
  - '- 连载需要有稳定更新频率，断更会让用户流失'
  - '- 内容必须真实，虚构故事一旦被拆穿会严重损害信任'
  sources:
  - paper: docs/202306/RFRpdNbcOoN9NqxjlUJcEgB7nTc.md
    role: apply
  excerpts:
  - 让客户去做『选择题』，顾客可以在“菜单”中勾选自己想要的画面
- 'no': 12
  name: 朋友圈分组可见 —— 给不同的人看不同的“剧本”
  points:
  - '**为什么需要这个概念？**'
  - '- 不同信任层级的用户需要看到不同的内容，否则会打扰或泄露隐私'
  - '- 同一个内容库需要差异化触达，最大化转化效率'
  - '**核心定义**'
