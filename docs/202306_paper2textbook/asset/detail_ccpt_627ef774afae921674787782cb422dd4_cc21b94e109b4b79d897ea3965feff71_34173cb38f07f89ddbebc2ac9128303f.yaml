  - '- 在航海自我介绍中坦诚说明婚恋状态，吸引同频异性主动连接'
  - '- 参加社群官方交友活动，降低破冰成本'
  - '**边界条件**'
  - '- 婚恋是复杂系统，不能完全功利化，真诚仍是第一原则'
  - '- 注意隐私保护，不要为了展示人设而暴露过多个人信息'
  sources:
  - paper: docs/202306/UAm9djDdWol9ImxIO3mcBucInGg.md
    role: apply
  - paper: docs/202306/LLvLdO3s8oHRoTxniOscOKDanEd.md
    role: improve
  excerpts:
  - 提升自己的认知，不要靠自己，靠别人，相信别人，信赖别人，倾听别人，质疑自己，是提升认知的最快速路径
  - 最赚钱的，还得是卖课啊
- 'no': 24
  name: 朋友圈自动成交系统 —— 打造24小时不打烊的“无人售货店”
  points:
  - '**为什么需要这个概念？**'
  - '- 强销售式刷屏朋友圈让人反感，转化率低且容易被拉黑'
  - '- 需要一套不依赖主动推销、靠内容和信任自动成交的系统'
  - '**核心定义**'
  - '- 朋友圈自动成交系统 = 以“每日4-8条、四大板块固定占位”的宏观布局和“素材获取+文案道术”的微观策划，构建非营销感内容矩阵，实现用户主动询单和成交'
  - '**关键性质**'
  - '- 非营销感：先提供价值和真实生活，再植入产品，避免广告感'
  - '- 结构化：生活、干货、产品、案例四大板块轮动，保持丰富度'
  - '- 可复制：有固定的排版、发布节奏和话术模型，新人可快速上手'
  - '**典型例子**'
  - '- 早上发干货、中午发生活、下午发成交案例、晚上发产品海报，间隔 1 小时以上'
  - '**边界条件**'
  - '- 自动成交的前提是信任积累，新号需要至少 1-3 个月养熟'
  - '- 内容质量决定转化率，低质复制粘贴只会加速取关'
  sources:
  - paper: docs/202306/GG5MdQYCgoWOhDxdSQbc4zUgnDc.md
    role: apply
  - paper: docs/202306/20230613_272.md
    role: improve
  excerpts:
  - 我们的整体思路其实很简单：找到接单渠道——确认客户需求——写作——变现
  - 前端店铺引流 -> 后端工厂生产 -> 衍生项目增收 -> 个人IP沉淀 -> 反哺前端流量
- 'no': 25
  name: 海外线下组局与结果导向 —— 用“作品”代替“名片”去社交
  points:
  - '**为什么需要这个概念？**'
  - '- 低效社交浪费大量时间，而真正的商业合作来自深度信任'
  - '- 海外圈友在陌生环境下更需要抱团取暖，线下组局是建立高信任链接的捷径'
  - '**核心定义**'
  - '- 海外线下组局与结果导向 = 以线下组局为深度交流场景，通过跨行业碰撞探索商业洞见；同时用“结果导向吸引链接”替代“主动链接”，用实战成果吸引高质量人脉'
  - '**关键性质**'
  - '- 深度信任：线下面对面交流建立的关系，远强于线上点赞'
  - '- 资源互换：海外圈友各自拥有不同国家、行业、能力资源，可组合出全新商业模式'
  - '- 结果导向：与其到处加微信，不如跑通一个项目、写一篇精华帖，让人主动来找你'
  - '**典型例子**'
  - '- 日本站线下组局碰撞出 Web3 合规离岸模式、微信小程序跨境闭环等机会'
  - '**边界条件**'
  - '- 线下组局成本高，需要筛选参与者，避免无效社交'
  - '- 结果导向需要先有作品，没有代表作的人应优先做出一个小成果'
  sources:
  - paper: docs/202306/DZundEBSqoCdx2xdBjNc5AA7nye.md
    role: apply
  excerpts:
  - 主动发声的核心是：输出价值，提供帮助，创造机会，展现正能量，给予正反馈
- 'no': 26
  name: 风向标生命周期 —— 在项目“红海化”之前抢跑
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人在风向标出现后才跟进，结果入局即接盘，项目已经价格战红海化'
  - '- 理解项目周期，才能在合适的阶段赚到对应角色的钱'
  - '**核心定义**'
  - '- 风向标生命周期 = 项目从蓝海发现、验证闭环、公开曝光、千人下场到价格战红海化的完整周期；参与者需要在不同阶段扮演不同角色：快速行动者、思路优化者、资源沉淀者（卖铲子者）'
  - '**关键性质**'
  - '- 速度溢价：最早行动者能吃到信息差红利，后来者只能拼价格'
  - '- 角色进化：小白先做快速行动者积累反馈，再进阶为思路优化者，最终成为资源沉淀者'
  - '- 项目必死，能力长存：具体项目会红海化，但需求挖掘能力和执行力是跨周期资产'
  - '**典型例子**'
  - '- 群聊禁言项目：早期卖教程的人日入数万，后期同类产品价格崩到 9.9 元'
  - '**边界条件**'
  - '- 不能只看风向标就下场，要验证需求真实性和自身资源匹配度'
  - '- 灰产型风向标坚决不碰，法律风险远比收益更大'
  sources:
  - paper: docs/202306/LLvLdO3s8oHRoTxniOscOKDanEd.md
    role: apply
  excerpts:
  - 在卖一件产品之前，一定要思考清楚用户真正的需求
- 'no': 27
  name: 尼斯分类 —— 给商标注册画一张“地图”
  points:
  - '**为什么需要这个概念？**'
  - '- 商标注册如果不清楚类别，可能选错保护范围，导致品牌被抢注或侵权'
  - '- 尼斯分类是全球通行的商品和服务分类体系，是商标注册的地图'
  - '**核心定义**'
  - '- 尼斯分类 = 《商品和服务国际分类》第 1-45 类的完整框架，用于确定商标保护范围；选择需遵循“确定使用范围与类别→选取具体商品/服务项目→跨群组防御性保护”三大原则'
  - '**关键性质**'
  - '- 分类体系：1-34 类为商品，35-45 类为服务'
  - '- 条目选择规范：严禁使用类别名或群组名，必须选取具体条目'
  - '- 防御性保护：核心类别之外，相关类别也要注册，防止他人蹭品牌'
  - '**典型例子**'
  - '- 做服装品牌，在第 25 类中选择“服装、外套、裤子”等具体商品，并同时在第 35 类注册“广告销售”服务，防御他人用同名做店铺'
  - '**边界条件**'
  - '- 尼斯分类知识可入门，但重大商标注册建议咨询专业代理机构'
  - '- 分类表会更新，需以最新版本为准'
  sources:
  - paper: docs/202306/TSZBdBfynoBINux2htWcefrtnHc.md
    role: apply
  excerpts:
  - 办理零门槛：1、无需护照；2、无需美国签证；3、无需美国电话号码；4、无需美国地址；5、无需预存款
- 'no': 28
  name: 小说推文差异化运营 —— 用“平台视角”破解引流困局
  points:
  - '**为什么需要这个概念？**'
  - '- 小说推文在不同平台的流量规则、用户习惯、风控力度差异巨大，一套模板走天下必然效果差'
  - '- 只有切换到平台产品经理视角，才能理解平台为什么限流、为什么推荐，从而找到最优操作路径'
  - '**核心定义**'
  - '- 小说推文差异化运营 = 以“平台视角”为底层逻辑，针对抖音、快手、视频号、小红书、B站等平台的差异化特性，优化从视频曝光到搜索转化的用户路径漏斗，重点攻克“找后续”和“关键词设置”两大转化节点'
  - '**关键性质**'
  - '- 平台视角：推演平台限制逻辑与引导逻辑，反推最优操作'
  - '- 漏斗优化：视频曝光→点击主页→搜索关键词→找后续→付费转化，每一步都要减少流失'
  - '- 防风控：用表情包、养号、品牌化前缀等方法规避同音字和助词干扰'
  - '**典型例子**'
  - '- 在视频中不直接写“全集”，而在评论区置顶用表情包引导搜索固定关键词'
  - '**边界条件**'
  - '- 平台风控动态变化，所有方法都需要持续迭代'
  - '- 只做流量不做内容质量，用户留存率会很低'
  sources:
  - paper: docs/202306/LjGDdEdDhoyXjUxEiRYcKIdPnMg.md
    role: apply
  - paper: docs/202306/HIHVdkYbWoksdhxeBdBc9qNKnAb.md
    role: improve
  excerpts:
  - 热点就是需要热，越早越好；情感的饭后时间点发布比较好
  - 直播稿件的完善对于一个直播间非常重要
