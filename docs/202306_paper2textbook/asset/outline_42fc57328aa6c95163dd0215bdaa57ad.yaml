  desc: 拆解2023年小红书本地团购内测期的入场机会：商家端（0佣金/0保证金/食力发店计划/去中心化流量/数据追踪量化ROI） -> 博主端（探照灯计划流量扶持/CPS佣金/置换免单/非垂类穿插变现）
    -> 核心优势（种草拔草一体化/高净值用户/21.4%转化率/双瀑布流主动决策）。
