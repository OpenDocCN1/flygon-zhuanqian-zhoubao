  desc: 系统化拆解爆款笔记生产全流程：对标账号建库 -> 爆款选题漏斗测试（关注头部/搜关键词/提取近期爆款/多选题测试） -> 三大流量属性拿捏（价格敏感/情绪价值/合集长尾）
    -> 二创去重技术栈（抠图换背景/混剪3-5条/伪原创重写） -> 发布节奏控制（日更3-5条/测试周期5-10天） -> 评论区造势托儿引导。
