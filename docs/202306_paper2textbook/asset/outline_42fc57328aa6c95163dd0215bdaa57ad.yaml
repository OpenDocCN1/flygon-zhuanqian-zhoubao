  desc: 从品牌方视角逆向工程商单全流程：广告分类与收益结构（报备10%手续费/返点20-35%/非报备价格趋同） -> 品牌检索决策链路（搜关键词/筛选人设/验数据）
    -> 逆向布局获客（关键词/场景化图片/薯条投流/大小号矩阵/高购买力人设标签/地理位置溢价） -> 三步动态定价法（横向询价/平台基准/博弈微调） ->
    植入准则（需求匹配度标准/内涵共振融合法）。
  role: method
  src:
