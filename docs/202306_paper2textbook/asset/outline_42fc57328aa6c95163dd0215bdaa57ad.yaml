'no': 1
name: 小红书商业生态 —— 从内容种草到变现收割的全链路拆解
desc: 本章系统梳理小红书平台的商业变现底层逻辑，涵盖广告商单、电商带货（无货源/自有货源）、本地生活团购、私域引流、知识付费等五大核心模式。通过20+实战案例复盘，从账号冷启动、爆款内容制造、流量承接转化、供应链履约、团队标准化复制等维度，构建可落地的操作手册体系。
