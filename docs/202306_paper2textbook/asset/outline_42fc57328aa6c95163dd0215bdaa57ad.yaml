- 'no': 12
  name: 避坑指北与认知修正：从‘流量密码’失效到‘中等认知陷阱’突围
  desc: 总结实战中易踩的核心坑位与认知偏差：流量密码失效与内容丰富度门槛提升（粗放搬运必死） -> 素材质量与测品周期解耦（1天测品易误判） -> 盲目怼量导致权重衰减（质量不高越发越低）
    -> 抖音搬运举报限流风险（非全职不可控） -> 自制实拍ROI低于二创（错过热度窗口） -> 中等认知陷阱（想得多做得少/先做再懂/小步快跑） -> 正确预期决定坚持深度（未来更卷/亲自下场积累经验）。
  role: limitation
