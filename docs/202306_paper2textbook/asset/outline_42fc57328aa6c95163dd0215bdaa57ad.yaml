  name: 自有/定制货源模式：内容驱动供应链的高利润护城河
  desc: 对比无货源模式，拆解自有货源的核心优势与操作路径：爆文反向定制选品（先发笔记测需求/再组织生产） -> 供应链快速响应（批量生产/质量把控） ->
