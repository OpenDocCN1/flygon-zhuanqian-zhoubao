  name: 账号冷启动标准化SOP：从“养号”到“权重合格”
  desc: 提炼跨案例通用的账号0-1启动流程：一机一号流量环境搭建 -> 人设五件套搭建（头像/昵称/简介/背景/瞬间） -> 探针笔记测限流（500阈值/连续3次）
    -> 历史爆款去重发布养权重（日更3-5条/3-5天/单篇200-500+阅读） -> 死号判定重置（连续10条不过百注销）。
