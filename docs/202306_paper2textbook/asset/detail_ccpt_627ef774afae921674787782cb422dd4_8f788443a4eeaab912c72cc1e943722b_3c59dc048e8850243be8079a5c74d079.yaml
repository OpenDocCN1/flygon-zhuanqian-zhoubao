units:
- 'no': 1
  name: 价值不等价交换 —— 让付出与回报不再对等
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人找项目时总想找“躺赚”的，但真正赚钱的本质不是“投机”，而是理解交易中的价值不等价交换'
  - '- 只有先明白钱从哪里来，才能找到有利润空间的项目'
  - '**核心定义**'
  - '- 赚钱是提供者提供价值（商品/服务/便利），接收者支付报酬；当提供者收获的报酬大于其付出成本时，就产生了利润'
  - '- 关键不是“我付出了多少”，而是“我提供的价值在市场上的定价有多高”'
  - '**关键性质**'
  - '- 价值与成本不对等：一杯咖啡的成本几元，但在特定场景下可卖几十元，差价来自价值感知'
  - '- 市场价格决定收益：价值市场价格越高，回报越大'
  - '- 可复制性：将同一价值重复出售（如内容、软件）可无限放大收益'
  - '**典型例子**'
  - '- Amazon Affiliate 折扣站：站长提供“帮用户快速找到真实折扣”的便利，用户免费使用，商家支付佣金，站长赚取佣金与运营成本的差价'
  - '**边界条件**'
  - '- 价值必须被接收者真实感知并愿意付费，否则是自嗨'
  - '- 不等价交换不等于欺骗，需要合法合规，不能靠信息敲诈'
  sources:
  - paper: docs/202306/20230613_240.md
    role: origin
  excerpts:
  - 如何赚钱？其实赚钱的逻辑背后是价值不等价交换。提供者提供了价值（包括实体的物品，或者非实体的服务或者便利等等），接收者获得价值的同时则付出对应价值的报酬。
  - 提供者收获的报酬大于其付出，于是赚钱了。赚钱问题的关键就是如何提供价值。提供的价值市场价格越高，获得的回报越大。
- 'no': 2
  name: 项目前置推演 —— 先算账，再开枪
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人看到一个项目就冲进去，执行很努力但最终不赚钱，原因在于没有先想清楚“谁付费、为什么付费、自己提供什么价值”等根本问题'
  - '- 前置逻辑是避免试错成本的元策略'
  - '**核心定义**'
  - '- 在做项目前，必须推演完整的商业模型：谁付费？为什么付费？我提供什么价值？成本结构如何？竞争格局是否允许新人生存？'
  - '- 如果逻辑不通，执行再强也难盈利'
  - '**关键性质**'
  - '- 先胜后战：想清楚再行动，降低盲目试错成本'
  - '- 逻辑优先于执行：商业模型正确时，执行才有意义'
  - '- 动态验证：前置逻辑是假设，需要后续用数据验证'
  - '**典型例子**'
  - '- 作者在做 Amazon Affiliate 前，先分析“商家付费、用户免费、佣金来自联盟”的模型，确认可行后才建站'
  - '- 反之，如果直接复制竞品而不思考模型，容易掉进“有流量没转化”的陷阱'
  - '**边界条件**'
  - '- 前置推演不能取代行动，过度分析会陷入“分析瘫痪”'
  - '- 对全新领域，逻辑推演存在盲区，需要用MVP快速验证'
  sources:
  - paper: docs/202306/20230613_240.md
    role: origin
  excerpts:
  - 做一个项目之前，必须要先把赚钱的逻辑想清楚。
  - 提供的价值市场价格越高，获得的回报越大。所以，做一个项目之前，必须要先把赚钱的逻辑想清楚。
- 'no': 3
  name: 六维评估模型 —— 给项目做一次全身体检
  points:
  - '**为什么需要这个概念？**'
  - '- 项目选择是最大的战略决策，凭感觉入场容易失败'
  - '- 六维模型提供系统化评估框架，拒绝拍脑袋'
  - '**核心定义**'
  - '- 从六个维度评估项目可行性：①是否解决痛点/满足需求；②用户付费意愿/商业模式是否成立；③竞争激烈度/是否赢家通吃；④用户群体规模是否足够大；⑤个人强项是否匹配；⑥执行成本是否可承受'
  - '**关键性质**'
  - '- 维度互补：单一维度好不等于项目可做，需综合评分'
  - '- 决策工具：每个维度都有明确评判标准，可复制使用'
  - '- 动态调整：随着市场变化维度权重可调整'
  - '**典型例子**'
  - '- 作者用该模型评估 Amazon Affiliate：用户省时省钱→需求真；付费方是商家→模型成立；无垄断但竞争激烈→非赢家通吃；用户群体足够大；适合程序员；初始成本<100美元可承受，最终决定入场'
  - '**边界条件**'
  - '- 模型是静态快照，无法预测未来变化'
  - '- 部分维度（如付费意愿）需要市场验证，不能完全靠想象'
  - '- 对资源有限的新人，可优先关注“执行成本”和“个人强项”'
  sources:
  - paper: docs/202306/20230613_240.md
    role: origin
  excerpts:
  - ① 是否解决问题痛点或者满足了需求：是的，用户节省了时间和精力，可以快速获取折扣信息，也省了钱。
  - ② 需求是否足以支持用户付费，用户的付费意愿如何：以 AMAZON 的项目考虑...用户其实不需要额外付费...付费方其实是商家。
  - ⑥ 执行成本是否可以承受：初期成本只需要个人网站建设，导流，成本不高，可接受。
- 'no': 4
  name: 机会雷达 —— 从内向外扫描商机
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人在找项目时往往不知道去哪里找机会，双维分类法提供了系统的搜索地图，让灵感不再依赖运气'
  - '**核心定义**'
  - '- 将商业机会来源归纳为两大类：“从个人出发”（生活痛点、技能优势、资源人脉、兴趣爱好、职业经历、闲暇时间）与“从他人出发”（社会热点、行业趋势、竞品分析、用户投诉、政策法规、资本流向）'
  - '**关键性质**'
  - '- 结构化搜索：将模糊的“找灵感”变成按类目扫描'
  - '- 内外结合：个人内部资源与外部环境趋势互补'
  - '- 可训练：通过刻意练习提高商机发现敏感度'
  - '**典型例子**'
  - '- 作者通过“从他人出发”的竞品分析发现 Amazon 百分比折扣搜索这个隐藏功能，并将其转化为核心爆点'
  - '- 从个人角度，程序员可利用编程技能做自动化工具'
  - '**边界条件**'
  - '- 分类不是绝对，一个机会可同时来自内外'
  - '- 双维扫描只是起点，仍需用六维模型评估可行性'
  sources:
  - paper: docs/202306/20230613_240.md
    role: origin
  excerpts:
  - 寻找机会通常 2 个大类的来源：从个人出发，从他人出发。
  - 对这 2 类来源，我初步把他们归类如下：[思维导图图片] 简单说，我们可以从个人角度出发，从个人生活中涉及到的方方面面中寻找灵感，也可以从其他人的角度出发，寻找社会生活中的方方面面中的灵感。
- 'no': 5
  name: 非品牌忠诚型市场 —— 新人的温柔乡
  points:
  - '**为什么需要这个概念？**'
  - '- 很多行业被巨头垄断，新人难有立足之地'
  - '- 但存在一类“用户只关心利益、不关心品牌”的市场，是资源有限者的最佳切入点'
  - '**核心定义**'
  - '- 指用户对品牌无粘性、仅关注核心利益（如折扣是否真实有效）的市场特性'
  - '- 此类市场无垄断龙头，新进入者只要提供有效信息即可分羹'
  - '**关键性质**'
  - '- 低信任壁垒：用户不因品牌拒绝新人'
  - '- 信息为王：核心竞争是信息有效性而非品牌影响力'
  - '- 可复制性：模式可快速复制到其他类似市场'
  - '**典型例子**'
  - '- Amazon 折扣站——用户只关心折扣信息是否真实有效，不在意是谁推荐，因此小站长也能与大站竞争'
  - '**边界条件**'
  - '- 非品牌忠诚市场往往利润较薄或竞争激烈，需靠效率或差异化功能取胜'
  - '- 用户对价格敏感，忠诚度低，需持续提供价值'
  sources:
  - paper: docs/202306/20230613_240.md
    role: origin
  excerpts:
  - 这个行业的龙头没有垄断优势：只要折扣信息有效，你在哪里看到这个信息，谁推荐给你，其实都不是你在意的内容，作为客户，你其实只关心折扣信息是不是真实有效。
  - 所以，这件事可行性比其他的行业要高。
- 'no': 6
  name: 复制-改良-超越 —— 站在头部肩膀上入场
  points:
  - '**为什么需要这个概念？**'
  - '- 小白资源弱、认知不足，如果自己创新模式，大概率失败'
  - '- 直接复制成熟竞品已验证的布局，再靠数据找差异，是最高效的入场方式'
  - '**核心定义**'
  - '- 资源弱时不创新模式，直接复制成熟竞品的验证过的 UI/内容结构降低认知负荷'
  - '- 随后依托自有数据（跳出率、用户反馈）与无法复制的资源壁垒之外，寻找可复制的技术/体验差异作为突破口'
  - '**关键性质**'
  - '- 降低认知成本：复制比自己从零思考容易得多'
  - '- 市场验证：竞品已经证明该模式可行'
  - '- 数据驱动：差异点不是拍脑袋，而是从数据反馈中挖掘'
  - '**典型例子**'
  - '- 作者复制其他折扣网站的页面布局和折扣信息，再根据自己后台数据（80%跳出率）开发“百分比折扣搜索”功能，转化率提升3倍'
  - '**边界条件**'
  - '- 复制不是抄袭，需避免知识产权和商标风险'
  - '- 若行业特殊不能直接复制，需要用A/B测试让市场帮你选择'
  sources:
  - paper: docs/202306/20230613_240.md
    role: origin
  excerpts:
  - 既然其他折扣网站已经成功了，我直接复制它们的页面布局和折扣信息不就得了吗？
  - 由于各个行业的具体情况不同，很可能不能直接复制，需要进行一定的改进和改良，而不能生搬硬套。
  - 这个时候，你也许会问，我怎么知道哪些可以照抄，哪些不能照抄呢？我的回答是：我也不知道，但是可以让市场帮我们选。
- 'no': 7
  name: 项目三棱镜 —— 同一项目，三类结局
  points:
  - '**为什么需要这个概念？**'
  - '- 新人常被“暴富案例”吸引，却忽视同一项目下多数人亏损的现实'
  - '- 了解风险分布是建立理性预期和止损能力的前提'
  - '**核心定义**'
  - '- 任何副业项目都存在三种结局：持续盈利、未盈利、被骗（被割）'
  - '- 参与者分层决定了收益分布，不存在稳赚不赔的项目'
  - '**关键性质**'
  - '- 普遍性：适用于所有项目，尤其新兴领域'
  - '- 分层根因：能力、资源、认知、时机的差异导致不同结局'
  - '- 风险警示：入场前必须评估自己是哪一层'
  - '**典型例子**'
  - '- Google Cash 项目——有人靠它持续赚钱，有人接触过但没赚钱，还有人被“割”。同一项目，结果天差地别'
  - '**边界条件**'
  - '- 这个定理不是让人放弃，而是提醒要有风险识别能力'
  - '- 具体项目可能短期红利大，但长期必然分化'
  sources:
  - paper: docs/202306/20230627_123.md
    role: origin
  excerpts:
  - 有人正用它持续赚钱，有人接触过但是并没能赚钱，还有人被它“割”过。
  - 结合一些个人的经历，分享给大家。
- 'no': 8
  name: 剥开项目外衣 —— 找到底层商业架构
  points:
  - '**为什么需要这个概念？**'
  - '- 很多项目被包装成神秘黑箱，让新人觉得高深莫测，实际上底层不过是常见的商业模型'
  - '- 识别本质有助于评估天花板与可持续性'
  - '**核心定义**'
  - '- 项目的核心运作机制往往可归因于某种已知商业模式'
  - '- 例如 Google Cash 本质上属于营销联盟（CPS/CPC/CPA）范畴，而非神秘黑箱技术'
  - '**关键性质**'
  - '- 穿透包装：不被话术误导，直达底层逻辑'
  - '- 可迁移性：知道了本质，就能借鉴同类模式的经验'
  - '- 风险评估：可基于成熟模式的规律预判潜在问题'
  - '**典型例子**'
  - '- Google Cash 项目被作者定性为“营销联盟”，即通过推广联盟链接赚取佣金（CPC/CPA），很多号称新技术的项目其实都是联盟营销的变体'
  - '**边界条件**'
  - '- 归因要准确，需要深入了解项目运作细节'
  - '- 即使本质是联盟营销，具体执行仍有差异，不能一概而论'
  sources:
  - paper: docs/202306/20230627_123.md
    role: origin
  excerpts:
  - '这个有点类似于营销联盟？ 大鹏同学 : 是的'
  - 文章较长，详情请移步飞书。 https://viuejh8h99y.feishu.cn/docx/I8QLdxyXYoJWBOxaQSbczLY5nOc?from=from_copylink
- 'no': 9
  name: 辛苦钱与资本钱 —— 运营店铺 vs 招商放大
  points:
  - '**为什么需要这个概念？**'
  - '- 许多人在副业中勤勤恳恳做店，却发现利润微薄'
  - '- 而有些人通过“招商”实现了爆发式增长。理解二者的层级差异，才能规划长期路径'
  - '**核心定义**'
  - '- 单纯运营店铺属于劳动密集型，利润上限低（辛苦钱）'
  - '- 真正的规模化财富路径在于“招商”（收徒/培训/供应链输出），将成熟模式标准化复制给他人，赚取模式复制的收益'
  - '**关键性质**'
  - '- 利润上限不同：做店是线性收益，招商是指数收益'
  - '- 能力要求不同：做店考验运营能力，招商考验信任与交付能力'
  - '- 可复制性：招商本质是把1个成功模型复制给N个人'
  - '**典型例子**'
  - '- 拼多多食品无货源项目——作者明确说“做店铺只是赚个辛苦钱，真正想要变现需要靠招商”，评论区亦仁确认“招商就是大家所谓的付费培训”'
  - '**边界条件**'
  - '- 招商需要更强的信任背书和交付能力，否则容易变成“割韭菜”'
  - '- 并非所有项目都适合招商，需看是否足够标准化'
  sources:
  - paper: docs/202306/20230627_050.md
    role: origin
  excerpts:
  - 此项目，做店铺只是赚个辛苦钱，真正想要变现需要靠招商
  - 这个项目只能赚个辛苦钱，如果想放大变现，是要配合招商的
  - '若念 L : 老大，招商就是大家所谓的付费培训'
- 'no': 10
  name: 闭环即正义 —— 私域CPS的生死线
  points:
  - '**为什么需要这个概念？**'
  - '- 微信生态对诱导分享、跳转外链打击严厉，很多CPS小程序/社群做不起来甚至被封，核心原因是没有实质性业务闭环'
  - '- 理解这条定律才能合规生存'
  - '**核心定义**'
  - '- 在微信生态下，私域CPS小程序的生死线不在于业务品类，而在于是否构建了“用户支付-平台分账-服务履约”的实质性消费闭环'
  - '- 纯导流（跳转/口令）必死，自有交易闭环可生'
  - '**关键性质**'
  - '- 实质性业务：用户必须在小程序内完成下单、支付、消费闭环'
  - '- 平台规则：符合微信审核标准才能长期存活'
  - '- 通用性：适用于所有依赖平台生态的业务'
  - '**典型例子**'
  - '- 用户在小程序内下单购买电影票、寄快递并完成消费，属于“有实质性业务”'
  - '- 如果只是复制口令跳转去其他APP，则属于“没有实质性业务”，极易被封'
  - '**边界条件**'
  - '- 该定律针对微信生态，其他平台规则可能不同'
  - '- 即使有闭环，仍需注意具体类目的合规要求'
  sources:
  - paper: docs/202306/20230627_129.md
    role: origin
  excerpts:
  - 小程序是否被封，取决于有没有实质性业务... 如果用户在这个小程序下单付费，最后完成消费闭环，像电影票、快递等，那就是【有实质性业务】。
  - 如果用户只是在这个小程序跳转链接就到了其它地方，或者只是复制一个口令，然后就转到其它 APP，那这就属于【没有实质性业务】。
- 'no': 11
  name: 折扣站生命周期 —— 从月入十万到一夜归零
  points:
  - '**为什么需要这个概念？**'
  - '- 成功案例很多，但只有同时看到从0到1和从1到0的完整周期，才能理解项目的真实风险与操作细节，避免盲目模仿'
  - '**核心定义**'
  - '- 完整记录一个项目从建站、测试、爆点、放大到因合规问题被封的全过程'
