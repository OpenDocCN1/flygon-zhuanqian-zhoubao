'no': 1
name: 普通人商业破局 —— 从「单打独斗」到「系统化运营」
desc: 本章聚焦普通职场人、创业者在零资源、无头部IP的劣势起点下，如何通过系统化的运营方法论（社交破圈、载体选择、拉新操盘、私域变现、赛道洞察）实现商业价值的跃迁。从『怎么认识大佬』的微观社交动作，到『知识付费载体怎么选』的战略决策，再到『拉新活动怎么跑』的战役执行，最终落地为『个人IP怎么变现』与『短剧CPS怎么做』的具体业务模型，构建一套可复制、可迭代的普通人商业破局全景图。
nodes:
- 'no': 1
  name: 非对等社交的底层逻辑：利益绑定与价值先行
  desc: 剖析弱者连接强者的核心悖论：不靠『索取』靠『给予』。通过『月饼案例』与『螃蟹案例』，拆解『具象化给予』与『服务前置』如何建立利益绑定，并揭示『自身卓越』是持续连接的前置条件。
  role: motivation
  src:
  - paper: docs/202306/20230613_003.md
- 'no': 2
  name: 社交破圈三步走：识别需求、低成本给予、项目深度绑定
  desc: 提炼小V认识大佬的标准化动作分解：1. 站在对方视角识别稀缺需求（视角转换）；2. 用月饼、AI视频、螃蟹等具象化钩子完成冷启动（具象化给予法）；3.
    承接跨年演讲传播等核心项目实现强绑定（服务前置/项目合作法）。
  role: method
  src:
  - paper: docs/202306/20230613_003.md
- 'no': 3
  name: 知识付费四大载体的本质差异与选择决策模型
  desc: 建立『内容垂直度-客单价与交付周期-受众人群画像』三维决策坐标系。揭示泛垂类（生财有术）依靠UGC与知识可迭代性长盛不衰，垂类社群因同行竞争与知识天花板必死；定义低客单星球『知识沉淀+大会员筛选』的双重价值，重新校准高低客单价的相对性本质。
  role: definition
  src:
  - paper: docs/202306/20230613_102.md
- 'no': 4
  name: 垂类社群不可复制泛垂类模式定律：死因解剖与避坑指南
  desc: 从分享机制失效（同行不分享）与知识不可迭代（存量有限）两大根因，证明垂类星球强运营长周期交付的『逆人性』本质。给出载体匹配矩阵：标准化知识选培训课/小报童买断，非标持续迭代选星球，私董会本质是老板建联俱乐部而非真私董会。
  role: proof
  src:
  - paper: docs/202306/20230613_102.md
- 'no': 5
  name: 普通人抱团拉新模型：无头部IP如何逆袭榜单第三
  desc: 复盘IDO老徐战队『无大V、全职场人、7人运营团队』的劣势起点，如何通过『三档合伙人分级』（TOP5/TOP15/长尾百人）聚合长尾流量，配合『数据推演锚定目标』（反推5000人围观池），实现近500人拉新的团队协作奇迹。
  role: motivation
  src:
  - paper: docs/202306/20230613_266.md
- 'no': 6
  name: 全周期拉新操盘体系：从锁单造势到微型航海裂变
  desc: 拆解45天长周期的五大关键动作：1. 锁定金/生财金机制（50元定金锁单+专属直播）实现90%转化；2. 免费星球图文分发避险法（规避封群+沉淀内容+引流私域）；3.
    差异化分工节奏把控（老徐直播+飞巴图文+固定时段+操盘手定题）；4. 微型航海裂变（美团圈圈/网盘拉新实战带练）激活正式圈友自然裂变；5. 基础佣金提前结算（老徐垫资发佣金）与倒计时心理战（最后48小时集中收割）实现榜单逆袭。
  role: method
  src:
  - paper: docs/202306/20230613_266.md
- 'no': 7
  name: 极端风控下的分布式抗脆弱运营：分散建群、隐身操盘、载体转移
  desc: 应对微信严打的四重防御体系：多管理员/小号分散建群风险、关闭群二维码牺牲增量保存量、核心操盘手单群发言+管理员同步转播隐身、免费星球图文替代群文本实现『一箭四雕』。
  role: method
  src:
  - paper: docs/202306/20230613_266.md
- 'no': 8
  name: 以人为本的价值增量导向：劝退不匹配、超预期服务、X倍赚回门票
  desc: 重新定义拉新本质：非卖课而是筛选匹配用户并提供超预期服务。锁定群专属高价值内容、正式群免费微型航海实战带练、帮助新人X倍赚回门票。价值增量→口碑→自然裂变→反哺拉新的飞轮闭环。
  role: extension
  src:
  - paper: docs/202306/20230613_266.md
- 'no': 9
  name: 沟通即广告：编码-解码匹配视角下的亲密关系与商业说服
  desc: 借用广告学『编码-解码』模型，用《万箭穿心》夫妻悲剧复盘沟通失效本质：发送方编码方式（直男逻辑/密码化表达）与接收方解码能力不匹配。提出『广告思维沟通』——用对方听得懂的话说（顾客视角），并揭示『停止投放广告』（拒绝沟通/冷战）比错误沟通更致命。
  role: definition
  src:
  - paper: docs/202306/20230613_267.md
- 'no': 10
  name: 沟通风格匹配度决定关系质量：寻找『协议兼容』的伙伴
  desc: 对比李宝莉-马学武（错位）与李宝莉-建建（匹配）案例，证明『直接编码』对『直接解码』的零损耗传递，优于『门当户对』但协议不兼容的关系。推论至商业：合伙人、客户、用户的筛选本质是寻找编码解码协议兼容的对象。
  role: proof
  src:
  - paper: docs/202306/20230613_267.md
- 'no': 11
  name: CP经济营销：节点杠杆撬动陪伴型社群拉新300+、变现5万
  desc: 复盘白色情人节实战：利用CP配对社交心理+节日热点，设计低门槛裂变玩法。验证『社群基数正相关拉新效果』（50人门槛）、『高客单价承接变现倍增』（低价引流+高价收割）、『营销工具与人文价值分离』（CP只是策略，真实连接才是根基）。5天极速布局SOP可复用至七夕/520/圣诞等节点。
  role: experiment
  src:
  - paper: docs/202306/20230613_298.md
- 'no': 12
  name: 职场个人IP『小而美』轻量化变现模型：3000私域半月近六位数
  desc: 拆解AI君从『微信好友1000、半年不发朋友圈』到『裸辞创业、3000私域+1000公众号+4000小红书粉、半月被动变现近六位数』的完整路径。验证『普通人IP小而美悖论』：无需大流量/大团队/强销售，靠高客单价专业服务（IP孵化教练）实现单位流量价值最大化。
  role: experiment
  src:
  - paper: docs/202306/20230627_067.md
- 'no': 13
  name: 职场人做IP五步法：破局定位、认知重构、模型搭建、飞轮执行、卡点攻关
  desc: 系统化方法论：1. 破局定位（解决职场瓶颈挖掘优势）；2. 认知重构（识别职场人做IP特殊性：副业起步/主业背书/强变现/弱运营，避开『学了不变』陷阱）；3.
    模型搭建（自洽商业IP人设与标准化产品体系）；4. 飞轮执行（私域内容+转化设计+公域引流组合拳，实现被动转化『一两个月从认识到转化、几乎无沟通』）；5.
    卡点攻关（预判转型期常见问题解法库）。
  role: method
  src:
  - paper: docs/202306/20230627_067.md
- 'no': 14
  name: 生财有术沉浸式学习法：付费社群作为冷启动加速器
  desc: 作者亲证路径：加入生财有术→系统读帖建立项目全景认知（心中有数）→主动链接垂直优秀圈友深度交流/近距离观察（看他们怎么做成的）。验证『高质量付费社群+主动链接』对普通人打破认知天花板、获取隐性知识的关键杠杆作用。
  role: method
  src:
  - paper: docs/202306/20230627_067.md
- 'no': 15
  name: 短剧CPS赛道全景拆解：年充值将超电影票房的300亿蓝海
  desc: 基于实地调研+星图负责人私董会+头部切片公司拜访+个人实测的四维拼接。揭示市场『一九原则』（10%剧/达人产出90% GMV）、CPM收益基准（1元/千次播放）、版权方『量产-测试-加投』对抗随机性、达人『新剧首发+差异化二剪』规避判重、中间商『独家供给+多任务分发平台』转型避坑佣金战。
  role: definition
  src:
  - paper: docs/202306/20230627_061.md
- 'no': 16
  name: 短剧CPS三大角色盈利逻辑与核心坑点：扣量黑箱、多级分销必死、家猪野猪理论
  desc: 深度剖析版权方（高风险高回报/成本通胀单剧30万/剧本涨10倍）、分发平台（佣金价格战陷阱/扣量黑箱实充100万结算60万/全职养号ROI低于外部兼职）、达人（账号获取难/判重机制/CPM
    1元基准止损）的生存法则。给出分层入局建议：有资金做版权方、有系统渠道做独家分发联盟、个人小团队做终端分发达人。
  role: limitation
  src:
  - paper: docs/202306/20230627_061.md
