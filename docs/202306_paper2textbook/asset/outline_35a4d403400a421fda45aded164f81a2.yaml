'no': 1
name: 副业认知重构 —— 从“找项目”到“懂商业本质”
desc: 本章通过对比多个真实副业案例的底层逻辑，揭示赚钱的本质是“价值不等价交换”，建立项目筛选的六维评估模型与机会来源双维分类法，帮助学员从盲目跟风转向理性决策，构建副业认知的底层操作系统。
nodes:
- 'no': 1
  name: 赚钱的底层逻辑：价值不等价交换
  desc: 赚钱本质是提供者提供价值（商品/服务/便利），接收者支付报酬；提供者收获报酬大于付出成本即盈利。核心在于如何提供高市场价格的价值。
  role: definition
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 2
  name: 项目前置逻辑：先想清商业模型再动手
  desc: 做项目前必须推演‘谁付费？为什么付费？我提供什么价值？成本结构如何？竞争格局是否允许新人生存？’若逻辑不通，执行再强也难盈利。
  role: motivation
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 3
  name: 项目可行性六维评估模型
  desc: 从解决痛点、付费意愿、竞争激烈度、用户群体规模、个人强项匹配度、执行成本承受力六个维度系统评估项目可行性，拒绝凭感觉入场。
  role: method
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 4
  name: 机会来源双维分类法：从个人出发 vs 从他人出发
  desc: 将商业机会来源归纳为‘从个人出发’（生活痛点、技能优势、资源人脉等）与‘从他人出发’（社会热点、行业趋势、竞品分析等）两大类，结构化拓展机会搜索广度。
  role: method
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 5
  name: 非品牌忠诚型市场：新人切入的最佳战场
  desc: 指用户对品牌无粘性、仅关注核心利益（如折扣真实有效）的市场特性。此类市场无垄断龙头，新进入者只要提供有效信息即可分羹，可行性高。
  role: definition
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 6
  name: 小白入场策略：复制头部布局，数据找差异
  desc: 资源弱时不创新模式，直接复制成熟竞品的验证过的 UI/内容结构降低认知负荷；随后依托自有数据与用户反馈，在‘无法复制的资源壁垒’外寻找‘可复制的技术/体验差异’作为突破口。
  role: method
  src:
  - paper: docs/202306/20230613_240.md
- 'no': 7
  name: 做店赚辛苦钱 vs 招商放大变现的认知分层
  desc: 单纯运营店铺属于劳动密集型，利润上限低（辛苦钱）；真正的规模化财富路径在于‘招商’（收徒/培训/供应链输出），将成熟模式标准化复制给他人。
  role: limitation
  src:
  - paper: docs/202306/20230627_050.md
  - paper: docs/202306/20230627_050.md
- 'no': 7
  name: 项目复盘实证：Amazon Affiliate 折扣站从 0 到月入十万再到被封全过程
  desc: 独立站成本<$100，WordPress建站，A/B测试选品，上线‘百分比折扣搜索’功能转化率提升3倍，巅峰月入十万；后因付费垃圾外链被Google降权、FB群名含商标被封、多联盟混铺降低收益、共享主机性能瓶颈四大踩坑导致项目终局。
  role: experiment
  src:
  - paper: docs/202306/20230613_240.md
  - paper: docs/202306/20230613_240.md
  - paper: docs/202306/20230613_240.md
