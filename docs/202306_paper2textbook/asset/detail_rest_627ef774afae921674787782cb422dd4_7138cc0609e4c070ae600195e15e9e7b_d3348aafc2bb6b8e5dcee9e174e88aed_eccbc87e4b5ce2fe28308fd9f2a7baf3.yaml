learning_targets:
- 理解非对等社交中价值先行与利益绑定的核心逻辑
- 掌握社交破圈三步走：识别需求、具象化给予、项目深度绑定
- 了解知识付费载体的四大类型及选择决策模型
- 识别垂类社群不可复制泛垂类模式的根本原因与避坑原则
- 掌握普通人抱团拉新模型与合伙人三档分级体系
- 掌握拉新操盘五大关键动作：锁单造势、免费星球图文分发、差异化分工、微型航海裂变、提前结算佣金
- 理解抗脆弱运营的分布式防御体系与价值增量导向
- 掌握沟通即广告与协议兼容理论，应用于亲密关系与商业说服
- 理解CP经济营销的节点杠杆与高客单价承接逻辑
- 掌握小而美IP变现模式与IP五步法执行框架
- 了解付费社群杠杆与认知对齐的隐性知识获取路径
- 理解短剧CPS的产业链结构、一九原则与CPM收益基准
- 掌握短剧产业链三大角色盈利逻辑与多级分销必死定律
- 理解数据清洗与无效素材识别的必要性
- 掌握数据驱动运营诊断：转化漏斗拆解与责任归属
