paper: docs/202306/20230613_080.md
desc: 该素材通过对比“考上985大学”与“年入100万”的难易度，核心主张后者在主观能动性发挥空间上远大于前者。作者引用小马宋的统计数据对比两者人数基数，指出年入百万人群规模更大；进而从“命运概率锁定度”与“主观能动性空间”两个维度深度剖析：高考深度绑定原生家庭、教育资源等不可控先天因素，评价体系单一且难以逆袭；而职场赚钱具备赛道可选、师资可换、评价多元、红利可捕捉等特征，个体拥有极大的策略选择权和试错容错率，因此普通人实现阶层跨越的最优路径是毕业后主动经营赚钱能力而非执着于单一的高考路径。
concepts:
- name: 命运概率锁定
  desc: 指个体在成长早期（高考前）受原生家庭、出生地、基础教育质量等不可控先天因素强制束缚，个人努力难以突破的概率上限。
  is_original: true
  excerpt:
  - 原生家庭（你的爸妈、家庭条件、出生在城市还是农村、当地教育质量），很大程度上定好了你考什么大学的概率。
  - 你再怎么学，每年也就那几个考上的。
  - 努力的效应都锁死在那个概率里
- name: 主观能动性释放期
  desc: 指个体成年、毕业后进入社会，摆脱原生环境强制约束，获得选择老板、公司、赛道、老师、圈子、红利等核心资源的自主权，从而能主动改变命运轨迹的时期。
  is_original: true
  excerpt:
  - 人可以主动、有意识改变自己的命运，大多发生在成年后，毕业后。
  - 毕业后，你可以不止一次的给自己挑选更好的老板...你都可以自己选老师...总有能发挥你才能的地方。
- name: 单一评价体系 vs 多元评价体系
  desc: 高考是标准答案、单一维度（分数）、零和博弈的单一评价体系，难以逆袭；赚钱市场是无标准答案、多维度（营销/产品/红利/人脉等）、正和博弈的多元评价体系，人人有机会通过换赛道、换策略实现逆袭。
  is_original: true
  excerpt:
  - 你参与高考，面对的是标准答案下竞争，评价很单一，但毕业后，你做事情，取得成绩，没有标准答案了，你冲就是。
  - 单一的评价体系下...学渣逆袭的比例不高...赚钱的市场里，非单一的评价体系...谁都有机会逆袭
- name: 年入百万人次
  desc: 区别于存量人数的流量概念，指每年实现年收入100万的人数总和（含重复计数），用于校正统计口径差异，证明年入百万的年度达成概率高于考上985。
  is_original: true
  excerpt:
  - 这 160 万人，肯定是每年能做到的人数，并不是只有这 160 万人...所以每年有 160 万人次做到
  - 每年能考上 985 的是 20 万人。每年能做到年入 100 万的，有 160 万人。
methods:
- name: __overview__
  desc: 采用‘数据校正对比法’确立量级基础，再用‘结构性归因分析法’拆解两大路径的底层逻辑差异（概率锁定 vs 能动性释放、单一评价 vs 多元评价），最终得出‘毕业后赚钱是普通人逆袭最优解’的行动指南。
  excerpt:
  - 小马宋老师给出了这样的调查数据...每年能考上 985 的是 20 万人。每年能做到年入 100 万的，有 160 万人。
  - 以下是重点逻辑：1、和年入 100 万比，能否考上 985 更有命中注定的意味...2、年入 100 万，我觉得相对容易，是因为跟高考相比，我们不那么受那个无情的命运的概率锁定
- name: 个人经历对照实验法
  desc: 利用作者自身‘山村差校考581分’与‘济南名校复读考623分’的同一人不同时空表现对比，实证‘环境锁定上限’与‘优质环境释放潜力’的因果关系。
  excerpt:
  - 我考了 581 分...去复读了...第二次高考我考了 623 分...以我这么聪明的人，如果我小时候就在济南上这种好学校呢？
- name: 可控变量清单罗列法
  desc: 将高考路径与赚钱路径的关键变量（家庭、学校、老师、选择数、评价标准、逆袭机制等）逐项对标列表，直观展示后者可控变量数量级远超前者。
  excerpt:
  - 你的爸妈是谁，无法改变，但毕业后，你可以不止一次的给自己挑选更好的老板...城市可以换，行业可以换，老板可以换，项目可以换...
theorems:
- name: 年入百万比考985易达成定理
  desc: 从年度人次概率（160万 vs 20万）和结构性难度（先天锁定 vs 后天可控）双重维度证明：对于普通个体，实现年入100万的难度系数显著低于考入985大学。
  excerpt:
  - 每年能考上 985 的是 20 万人。每年能做到年入 100 万的，有 160 万人。
  - 因此，我认为年入百万，比靠 985 容易的多。
- name: 高考先天锁定定理
  desc: 高考成败核心取决于原生家庭与基础教育资源等个体不可控的先天变量，主观努力仅在极窄浮动区间内起作用，属于‘命中注定’概率游戏。
  excerpt:
  - 原生家庭...很大程度上定好了你考什么大学的概率。
  - 单一的评价体系下...一个差生，大概率再多学 3 年 5 年，也还是考不上 985
- name: 赚钱后天可控定理
  desc: 职业生涯赚钱受个体主观能动性主导，拥有赛道、组织、导师、策略、红利等全维度可控变量，评价体系多元开放，支持通过‘换赛道/抱大腿/踩红利/练新技能’等多种路径实现低成本逆袭。
  excerpt:
  - 毕业后...你能主动改变的东西太多了...赚钱的市场里，非单一的评价体系...谁都有机会逆袭
  - 城市可以换，行业可以换...能力不值钱了也可以培养新能力
findings:
- name: 年入百万年度达成人数远超985招生规模
  desc: '[evidence] 基于小马宋引用的2023年985招生约20万、年入百万纳税户约80万（估算含隐形收入翻倍至160万）的数据测算，每年达成年入百万的人次是考上985人数的8倍。'
  excerpt:
  - 2023 年 985 大学本科招生人数大概是 20 万人...年入 100 万有多少人呢？...数字大概在 80 万人左右...我们把这个数据翻一番，也就是
    160 万人
- name: 同等智力个体在差校与名校的分数跨度可达40分以上
  desc: '[evidence] 作者亲身经历：同一人在县级差校高考581分（文科第一），复读一年进入省会名校后以‘没那么努力’考623分，分数跃升42分，直观证实教育环境对发挥上限的决定性压制。'
  excerpt:
  - 我考了 581 分...第二次高考我考了 623 分...在那一年也没有那么努力，但感觉进步很大
- name: 高考体系中学渣逆袭概率极低
  desc: '[claim] 作者基于单一评价体系特性断言：在高考标准答案竞争机制下，底层学生通过延长备考时间（多学3-5年）逆袭985的概率极低，努力仅能在既定浮动范围内微调。'
  excerpt:
  - 单一的评价体系下...一个差生，大概率再多学 3 年 5 年，也还是考不上 985，学渣逆袭的比例不高
- name: 赚钱领域存在多路径低门槛逆袭机制
  desc: '[claim] 作者归纳总结赚钱市场的八大逆袭路径（换赛道/换项目/开窍/抱大腿/踩红利/长期主义/投机/营销吹牛/踏实干活），断言这些机制在高考体系中均不存在，构成了普通人翻身的结构性红利。'
  excerpt:
  - 赚钱学渣和赚钱学霸，可能就是一个换赛道...这些情况，在高考里都不会发生。
  - 可以靠营销能力赚，可以靠产品能力赚...很多骗人的也赚到了，可以靠吹牛逼赚，可以踏踏实实赚。
