paper: docs/202306/Hk00db5HWo3aMKxBzivcJq4Bnie.md
desc: 该素材是一份基于实战经验的公众号AI写作教程，作者分享了从零起步利用GPT-4在10天内实现3000+收益的全流程方法论。核心内容涵盖：公众号爆款文章的底层结构逻辑（选题占90%、标题公式、开头设计、正文框架）、两套利用ChatGPT批量生成爆款标题的实操工作流（喂养爆款分析提炼公式法、通用指令模板法）、两种正文创作范式（爆款文章逆向拆解仿写法、结构化指令直出法）、以及提升AI写作效率的“多模型库”建设技巧与长期主义心态建设。
concepts:
- name: 公众号爆款选题90%法则
  desc: 核心主张爆款文章的成败90%取决于选题，必须基于领域内用户关心的高互动话题（如参考20-50篇10w+爆款）而非主观臆造。
  is_original: false
  excerpt:
  - 爆文的核心选题占 90%；一定是要选择你这个领域用户关心的话题去创作 而不是你觉得好的选题；找到你这个领域的 20 到 50 篇 的 10w+的爆款，可以让
    GPT 帮你分析和拆解。
- name: 爆款标题四要素公式
  desc: 构建高点击率标题的标准化结构：人物角色 + 情感冲突 + 生活挑战 + 设计悬念，并辅以强感性/视觉词汇（崩溃、反击、震惊等）。
  is_original: true
  excerpt:
  - 爆款标题元素的需要包含：人物角色+ 情感冲突+生活挑战+设计悬念
  - 尽量使用感性、具体、直接和明确的词汇或者视觉效果的词汇，如“崩溃”、“反击”和“震惊”，这些都能引起读者的情绪反应
- name: 公众号爆文五段式正文框架
  desc: 标准化的文章正文结构：问题提出 → 问题展开 → 问题解决 → 引导互动 → 结束语，配合人物设计、情感冲突、生活挑战、意外转折等叙事要素。
  is_original: false
  excerpt:
  - 全文的框架结构可以参考以下几点：① 问题提出 ② 问题展开 ③ 问题解决 ④ 引导互动 ⑤ 结束语
  - 故事正文剧情内容可以包含：人物设计、情感冲突、生活挑战、出乎意料反转剧情、题材多样、引人入胜的叙述。
- name: AI写作指令模型库
  desc: 建立针对不同题材/风格的结构化Prompt模板集合（如‘指令一’‘指令二’），通过持续迭代优化指令而非单次对话，实现AI输出的稳定性与风格可控。
  is_original: true
  excerpt:
  - 建议大家通过不同指令，建立多种模型，这样能够方便你想要创作某类文章时直接找到对应模型。
  - 最开始，大家可以使用不同的模型写，之后看哪个模型写的内容更好，大家就可以选择这个模型持续去创作。
- name: 数据惨淡期
  desc: 新账号冷启动初期阅读量极低、无正反馈的常态阶段，需靠坚持更新和AI效率工具跨越。
  is_original: false
  excerpt:
  - 新账号都会进入一个阶段叫做数据惨淡期，我在没有用 ChatGPT 创作和没有进流量池之前，我的数据也很惨淡
methods:
- name: __overview__
  desc: 整体方法论：确立爆款结构认知 → 建立标题/正文Prompt工程体系 → 通过‘喂养爆款-提炼公式-批量生成-筛选优化’闭环实现量产 → 沉淀指令模型库实现规模化稳产。
  excerpt:
  - 不管是自己写还是用 AI 写首先要了解创作公众号文章的爆款逻辑
  - 我直接来分享实操方法 我们需给 ChatGPT 一个标题写作指令，这个指令需要自己通过给 GPT 喂养爆款选题内容获取。
  - 建议大家通过不同指令，建立多种模型...经过反复实践，最终我掌握了如何根据特定的爆款选题，为 ChatGPT 设定写作指令
- name: 标题生成三步工作流（喂养-提炼-量产）
  desc: 步骤1：投喂5-20个领域10w+标题让GPT分析；步骤2：提炼核心公式并反哺生成写标题的元指令；步骤3：执行元指令批量产出候选标题，人工筛选微调。
  excerpt:
  - 第一步：让 ChatGPT 分析爆款标题...找 5 到 20 个你这个行业的 10w+的爆款标题让 ChatGPT 去分析学习
  - 第二步：根据回答提炼标题核心公式，并把公式喂给 ChatGPT，目的是获得下一步对话的指令
  - 第三步：将新的指令喂给 ChatGPT，批量获得爆款标题
- name: 通用标题指令模板法
  desc: 预设包含角色设定、核心要素（简洁/悬念/感性词/四要素）的通用Prompt，支持两种调用模式：直接给关键词生成、或投喂单个爆款标题生成同类变体。
  excerpt:
  - 为方便大家更快完成「批量取标题」的动作，我再提供一个只需你给主题就可以套用的标题写作指令
  - 第一种用法，直接给关键词...第二种用法，直接给他爆款标题让他写同类型的
- name: 正文创作方法一：爆款逆向拆解仿写法
  desc: 投喂单篇10w+爆款链接/全文 → GPT分析内容结构与写作手法 → GPT基于分析生成复用指令 → 执行指令产出新正文 → 人工查重去噪补全。
  excerpt:
  - 第一步，直接找篇 10w+爆款文章链接让 GPT 分析内容结构然后仿写
  - 第二步，继续根据分析的内容让 GPT 创作指令
  - 第三步，获得通过指令直接产出的正文内容...删除重复内容或不适合的内容
- name: 正文创作方法二：结构化场景指令直出法
  desc: 编写包含角色、视角、开头/发展/冲突/高潮/结局分幕大纲、字数限制、人设细节的高密度指令，一次性直出生成完整正文，适合有预设剧本的创作者。
  excerpt:
  - 第 2 种方法是自己优化指令，直接让 ChatGPT 写...把想法喂给 ChatGPT，让他来产出正文内容。
  - 给大家一个参考指令：作为一个富有洞察力的作家...在开头，你应该详细地描述...在故事的中部...在故事的高潮部分...在故事的结尾...
- name: 长文本分段生成与续写策略
  desc: 针对模型输出Token限制，采用‘生成-检查-继续写’的交互循环，确保长文完整产出且上下文连贯。
  excerpt:
  - 因为 GPT 字数限制，这里可能会没有完，可以让他继续写
theorems:
- name: 选题决定上限，标题决定下限，内容决定留存
  desc: 公众号运营的核心铁律：选题占比90%决定流量天花板；标题决定点击率（入池关键）；正文结构与情感共鸣决定完读率与互动（长期权重）。
  excerpt:
  - 爆文的核心选题占 90%：一定是要选择你这个领域用户关心的话题去创作
  - 标题是读者用户刷到的第一信息，也是决定读者是否点击阅读你这篇内容的关键。
  - 第四步，剧情内容利用情感共鸣、冲突和转折...引人入胜的叙述。
- name: AI写作核心在于‘指令工程’的迭代沉淀而非单次对话
  desc: 高质量AI输出的关键不是提问技巧，而是将‘爆款分析→公式提炼→指令编写→效果验证’形成标准化SOP，并沉淀为可复用的‘指令模型库’。
  excerpt:
  - 这个指令我们还可以通过自己对内容的要求去优化。
  - 建议大家通过不同指令，建立多种模型...最终我掌握了如何根据特定的爆款选题，为 ChatGPT 设定写作指令，让 ChatGPT 高效产出更优质的内容。
  - 只有不断优化 GPT 的写作指令，才能让其创作出读者喜欢阅读的文章。
- name: 人机协作分层：AI负责‘结构化产出’，人负责‘审美筛选’与‘指令进化’
  desc: 高效协作模式：AI承担首稿生产（标题批量、正文直出）、执行既定指令；人类承担爆款样本采集、指令设计迭代、成品筛选润色、账号运营决策。
  excerpt:
  - 你可以从中选择自己觉得合适的，也可以在这些标题的基础上进一步优化修改，作为自己的文章标题。
  - 这之后我们可以检查一下全文，删除重复内容或不适合的内容。
  - 在创作中，大家还可以在指令模板的基础上，加入自己想要的剧情或内容。
findings:
- name: 冷启动至变现的时间压缩验证
  desc: '[evidence] 作者账号从0起步，引入GPT-4辅助创作后，约10天实现单日最高收益457元、累计3000+，单篇创作耗时从1-2小时压缩至5-10分钟，验证了‘结构认知+Prompt工程’可显著跨越新号数据惨淡期。'
  excerpt:
  - 虽然起步晚，但在 GPT-4 的辅助下，10天左右我实现了可观的收益——累计收益 3000＋。
  - 我现在可以在 5 到 10 分钟内创作出一篇情感故事文。
  - 目前单个账号收益最高的一天是 457
- name: 情感故事赛道‘女性视角+婚姻/职场困境+反转’模型的高复现率
  desc: '[evidence] 素材展示的多个爆款标题案例（如‘35岁失业被丈夫抛弃’、‘46岁离婚大妈二婚黑人小伙’、‘丈夫异地领导温柔陷阱’）及生成正文，均高度符合‘女性主角(20-50岁)+核心人际冲突+意外转折’模板，印证了该赛道选题公式的有效性。'
  excerpt:
  - ① 爱情迷阵：丈夫异地工作，我却无法抵挡公司领导的温柔陷阱
  - ③ 人生大逆转：我 35 岁失业被丈夫抛弃，五年后我崭露头角，他却开始乞求原谅
  - ④ 超凡体验：46 岁离婚大妈和年轻黑人小伙的二婚生活，他的体力让她振奋不已
  - 指令二：根据主题 '爱情迷阵：丈夫异地工作，我却无法抵挡公司领导的温柔陷阱'，写出一篇充满情感纠葛、道德冲突的故事。
- name: ‘喂养爆款→提炼指令’范式优于‘零样本直接生成’
  desc: '[evidence] 作者对比展示了从零样本通用指令（2.2节）到喂养自有领域爆款反推指令（2.1节）的演进过程，并明确指出‘这个指令需要自己通过给
    GPT 喂养爆款选题内容获取’，实践证明领域微调后的指令产出质量显著高于通用模板。'
  excerpt:
  - 我们需给 ChatGPT 一个标题写作指令，这个指令需要自己通过给 GPT 喂养爆款选题内容获取。
  - 下面是我自己经过多次优化写的标题指令...这时候 ChatGPT 已经能够根据你的指令批量给出不错的标题
- name: 指令模型库建设显著降低边际创作成本
  desc: '[claim] 作者主张建立多模型库（如指令一、指令二）并筛选优胜模型持续迭代，可实现‘想创作某类文章直接找对应模型’的规模化生产，边际成本趋近零。'
  excerpt:
  - 建议大家通过不同指令，建立多种模型...之后看哪个模型写的内容更好，大家就可以选择这个模型持续去创作。
  - 在创作中，大家还可以在指令模板的基础上，加入自己想要的剧情或内容。
