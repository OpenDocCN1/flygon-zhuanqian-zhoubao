paper: docs/202306/20230613_168.md
desc: 该素材记录了一位 Web3 新人（路遥知马力）通过参与生财有术社群的‘小航海’计划，在 2023 年 2 月至 5 月期间切入 BRC20 生态，仅用
  3 个月实现 300 万利润锁定的实战复盘。核心内容涵盖：BRC20 早期发展历程的亲历者视角复盘、新人‘轻装上阵、以小博大’的实操方法论、风险控制与 FOMO
  情绪管理的心得，以及社群协作对认知升级的关键作用。素材以第一人称实战案例为核心，展示了普通人在新兴加密叙事中通过结构化学习与快速试错捕获超额收益的完整路径。
concepts:
- name: BRC20 生态红利期
  desc: 指比特币区块链上基于 Ordinals 协议发行的同质化代币标准 BRC20 在 2023 年 2 月至 5 月期间，因市场认知尚未普及、工具基建不完善、头部代币（如
    ORDI、SATS）刚上线交易所所形成的高波动、高收益、高信息不对称的市场窗口期。
  is_original: false
  excerpt:
  - 2023.2.7 通过生财有术小航海入圈，抓住 brc20 生态，3 个月锁定 3 百万利润。
  - 让大家了解 brc20 两个多月的发展历程
- name: Web3 小航海计划
  desc: 生财有术社群发起的结构化入圈实战训练营，通过‘导师带路+同伴互助+实战打卡’模式，降低 Web3 领域新人的认知门槛与试错成本，帮助零基础学员快速建立钱包操作、链上交互、叙事捕捉等核心技能。
  is_original: true
  excerpt:
  - 2023.2.7 通过生财有术小航海入圈
- name: 轻装上阵·以小博大
  desc: 作者总结的新人参与高风险新赛道的核心策略：资金仓位控制在可承受损失范围（轻装上阵），通过早期低成本铸造/参与空投获取高倍潜力代币（以小博大），严格执行止盈止损纪律，避免重仓
    FOMO 追高。
  is_original: true
  excerpt:
  - 让大家掌握现阶段如何轻装上阵，以小博大？
  - 分享文章：《BRC20，新人现阶段如何轻装上阵，以小博大？》
- name: 钻石手陷阱
  desc: 指在代币暴涨后未能及时止盈，坚持长期持有（钻石手）导致利润大幅回吐甚至亏损的心理与行为模式。评论区指出 BRC20 代币上所后 FOMO 到顶点故事即将结束，许多持有者因未离场导致数十万美金缩水。
  is_original: false
  excerpt:
  - 亲眼看到群里不止一个哥们钻石手拿着数十万美刀的 insc，到暴跌缩水。
methods:
- name: __overview__
  desc: 作者遵循‘社群结构化入圈 → 赛道深度复盘与工具掌握 → 低成本广撒网试错 → 严格纪律执行止盈 → 复盘输出沉淀方法论’的完整实战闭环。核心在于借力社群降低认知门槛，用小额资金在早期高不确定性阶段博取期权性收益，再通过铁律执行力锁定利润。
  excerpt:
  - 2023.2.7 通过生财有术小航海入圈，抓住 brc20 生态，3 个月锁定 3 百万利润。
  - 今天的分享，主要围绕：我作为一枚 web3 新人，面对 brc20 这种大机会，我的一些做法和思考。
  - 分享文章：《BRC20，新人现阶段如何轻装上阵，以小博大？》
- name: 社群协作式入圈法
  desc: 利用付费高质量社群（生财有术）的‘小航海’机制：跟随领航员学习基础操作（钱包、铭文铸造工具）、每日打卡复盘、同伴群内共享一手情报（如新代币部署、工具更新）、集体规避钓鱼网站/合约漏洞等风险。
  excerpt:
  - 2023.2.7 通过生财有术小航海入圈
- name: 叙事驱动的早期布局法
  desc: 在 BRC20 协议发布初期（2023.3 月），基于‘比特币原生资产+同质化代币’的强叙事预判，在工具成熟前抢跑铸造头部代币（ORDI、SATS
    等）或参与早期项目白名单，成本仅为 Gas 费（几美元至几十美元），获取极低筹码成本。
  excerpt:
  - 抓住 brc20 生态
  - 让大家了解 brc20 两个多月的发展历程
- name: 分批止盈与风控纪律法
  desc: 制定并严格执行‘分批卖出锁定本金+利润跟踪止盈’规则：代币上币安等一线交易所后分批兑换稳定币/BTC 回本，剩余仓位设置移动止损线，杜绝‘钻石手’死拿。评论区作者回复‘切不可
    fomo’印证此纪律。
  excerpt:
  - 3 个月锁定 3 百万利润
  - 新赛道机会与陷阱并存，切不可 fomo
  - 亲眼看到群里不止一个哥们钻石手拿着数十万美刀的 insc，到暴跌缩水
theorems:
- name: 新人捕获新赛道红利的可行性定理
  desc: Web3 领域的新叙事（如 BRC20）在早期存在极高的信息不对称与工具门槛，但普通新人通过‘付费社群结构化学习+极低成本试错+严格执行纪律’的组合拳，完全可以在不懂深层技术原理的前提下，用小额本金博取百倍收益并安全落袋。核心在于‘认知套利’而非‘技术套利’。
  excerpt:
  - 一枚 web3 小白，通过 BRC20， 3 个月锁定 3 百万利润
  - 我作为一枚 web3 新人，面对 brc20 这种大机会，我的一些做法和思考
  - 做擅长的事，寻找自己的天命
- name: FOMO 与钻石手是新赛道最大杀手论
  desc: 在新赛道从 0 到 1 爆发、上所、FOMO 到顶点的完整周期中，最大的风险不在于买早了买错币，而在于卖不掉：上所后 FOMO 情绪驱动追高接盘，或因贪婪持有‘钻石手’拒绝止盈，最终导致账面暴利归零。生存第一，利润第二。
  excerpt:
  - 关注楼主的风险预警，web3 的风险很大需谨慎，尤其 brc20 的代币陆续上所后，fomo 到顶点后故事就快结束了。
  - 新赛道机会与陷阱并存，切不可 fomo
  - 亲眼看到群里不止一个哥们钻石手拿着数十万美刀的 insc，到暴跌缩水。
- name: 社群杠杆放大个体认知论
  desc: 个体在复杂新兴领域的认知边界极其有限，高质量付费社群通过‘领航员经验沉淀+同伴集体智慧+实时信息流’提供杠杆，能将新人的学习曲线从‘几年’压缩到‘几周’，使其在红利窗口关闭前完成‘入圈-实战-变现’闭环。
  excerpt:
  - 2023.2.7 通过生财有术小航海入圈
  - 真羡慕你们这种能搞懂 web3 的人，90 年感觉学不动了，知识盲区
findings:
- name: 个人实战收益案例
  desc: '[evidence] 作者作为 Web3 零基础小白，于 2023.2.7 入圈，至 2023.5 月底（约 3.5 个月）实现账面利润 300
    万人民币并成功锁定（兑换稳定币/BTC），验证了‘小航海+轻装上阵’方法论的有效性。'
  excerpt:
  - 2023.2.7 通过生财有术小航海入圈，抓住 brc20 生态，3 个月锁定 3 百万利润。
- name: 同伴群反面教材观察
  desc: '[evidence] 作者亲历观察到社群内多名成员因持有‘钻石手’心态，在 BRC20 代币（insc）上所后暴涨阶段未止盈，随后遭遇暴跌导致数十万美金账面利润大幅缩水，佐证了‘切不可
    FOMO、严格止盈’风控铁律的必要性。'
  excerpt:
  - 亲眼看到群里不止一个哥们钻石手拿着数十万美刀的 insc，到暴跌缩水。
- name: 外部飞书文档详细复盘
  desc: '[claim] 作者宣称已输出详细实操指南《BRC20，新人现阶段如何轻装上阵，以小博大？》（飞书文档链接），涵盖 BRC20 发展历程复盘、工具使用教程、具体买卖节点、仓位管理细节等，但该文档内容不在当前素材中，无法直接核实细节。'
  excerpt:
  - 分享文章：《BRC20，新人现阶段如何轻装上阵，以小博大？》 https://tbe8c1kz4v.feishu.cn/docx/S8Aldn9uDolab2xB16uc1leAnSf
