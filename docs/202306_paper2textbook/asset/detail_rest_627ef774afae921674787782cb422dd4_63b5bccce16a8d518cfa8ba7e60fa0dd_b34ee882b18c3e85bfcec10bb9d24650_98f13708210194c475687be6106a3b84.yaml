learning_targets:
- 理解“投喂”范式是释放大模型通用能力的前置技能，掌握七大核心场景的结构化输入思路
- 能利用 ChatGPT 联网功能构建“热点实时检索 → IP 定位过滤 → 选题输出”的标准化工作流
- 掌握懒人简笔画、Midjourney 头像等低门槛 AI 绘画定位法，理解“不卷参数卷定位”的变现逻辑
- 了解多模态工具链组装（ChatGPT + Midjourney + LeiaPix / CT8 / 声音克隆）降低内容生产门槛的原理与边界
- 理解 LLaMA 私有化部署“预训练赋能、微调唤醒”范式，能识别中文场景的基座瓶颈与出海窗口期
- 掌握海外工具站“卖流量 / 卖产品”双轨变现模型与“利基 - 能力 - 复杂度”选品铁律
- 掌握 RPA+X 核心能力复用模型与极速 MVP 高客单价打法，能设计自动化内容生产线的三层交付体系
- 树立 AI 应用合规与版权风险意识，理解“正文洗白 + 外部托管 + 引流分发”的敏感领域内容架构
concept_map:
- AI 实战变现指南 —— 从工具操作到商业闭环
- ├── 01 交互范式层：释放大模型通用能力
- │   ├── AI 投喂范式（结构化输入 → 可执行指令）—— P202
- │   │   ├── 方法：七大核心场景（PDF/网页/表格/文本/聊天记录/书籍/公众号）
- │   │   ├── 主张：投喂是前置技能；模糊输入 → 模糊输出
- │   │   └── 边界：长文本需分段、幻觉需人工核查
- │   ├── ChatGPT 联网选题（热点 → 可复制选题）—— P205
- │   │   ├── 方法：AI 实时检索 → 热点聚合 → 结合 IP 定位筛选
- │   │   ├── 主张：选题即正义，蹭热点是爆款最快捷径
- │   │   └── 边界：时效性极强，捕捉后需立即制作
- │   ├── 敏感领域合规（正文洗白 → 外部托管 → 引流分发）—— P204
- │   │   ├── 方法：ChatGPT 生成合规方案 + 飞书托管核心干货
- │   │   ├── 主张：外部托管 + AI 生成方案双重保障
- │   │   └── 边界：外链可能被拦截，需备用分发渠道
- │   └── 图文二创拆解法（对标账号 → 复制微创新）—— W007
- │       ├── 方法：类目与账号挖掘 + 对标账号全维度拆解
- │       ├── 主张：拼搞钱碎片、补搞钱碎片；实操演示优于理论灌输
- │       └── 边界：仅抄表面不拆逻辑，易陷入同质化红海
- ├── 02 内容生产工具链：从零门槛到商品级交付
- │   ├── 懒人简笔画（风格定位 → 动态表情包生产线）—— P203
- │   │   ├── 方法：个人才干定位 × 低门槛工具链 × 场景化变现
- │   │   ├── 主张：不卷参数卷定位；表情包即社群社交货币
- │   │   └── 边界：风格需与目标社群文化匹配
- │   ├── Midjourney 头像（垫图 + --iw → AI 数字分身）—— P211
- │   │   ├── 方法：垫图链接 + 提示词 + --iw 参数梯度实测调优
- │   │   ├── 主张：参数控制决定生成质量；组合 Notion AI 打通变现闭环
- │   │   └── 边界：高 --iw 导致画面僵硬，丢 AI 审美优势
- │   ├── LeiaPix 3D 视频（2D 图像 → 3D 动态视频）—— P207
- │   │   ├── 方法：ChatGPT 故事/脚本 + Midjourney 关键帧 + LeiaPix 转 3D
- │   │   ├── 主张：多模态工具链组装，零成本降低 3D 视频门槛
- │   │   └── 边界：仅生成片段，需剪映等工具后期合成
- │   ├── CrazyTalk 8 数字人（静态图片 → 会说话视频）—— W006
- │   │   ├── 方法：CT8 面部驱动 + 语录音频 + 剪映合成
- │   │   ├── 主张：制作简单 / 原创度高 / 内容共鸣强，月涨粉 10w+
- │   │   └── 边界：工具存在红皇后效应，平台算法升级可能失效
- │   ├── AI 声音克隆（声音 → 可复制资产）—— P209
- │   │   ├── 方法：So-VITS-SVC 一站式整合包 + 训练 / 推理全程教程
- │   │   ├── 主张：零门槛、大白话，照着做准能做出来
- │   │   └── 边界：版权 / 肖像权灰色地带，法律风险需自担
- │   └── 短剧 CPS 混剪（20 分钟复现爆款视频）—— W010
- │       ├── 方法：视频场景划分 + 爆款字幕策略双支柱
- │       ├── 主张：标准化 SOP 实现“量产”与“质量”统一
- │       └── 边界：短剧版权风险、平台去重机制变化影响流量
- └── 03 工程化与商业化：把工具变成可售卖的产品
- '    ├── 海外工具站（AI 能力 → 可售卖产品）—— P206'
- '    │   ├── 方法：卖流量 + 卖产品双轨；关键词组合搜索（ChatGPT To xxx / Xxx For ChatGPT）'
- '    │   ├── 主张：利基 - 能力 - 复杂度三角铁律；巨头边缘效应原理'
- '    │   └── 边界：需与官方插件生态差异化，跨境推广存在门槛'
- '    ├── 超级 SEO 助手（内容生产 → 趋近零成本）—— P210'
- '    │   ├── 方法：标题 / 关键词 → GPT 批量生成 → 自动发布 → 收录获客'
- '    │   ├── 主张：SEO 运营进化三阶段论，全自动化是终局'
- '    │   └── 边界：内容可收录的前提是输入优质标题与关键词'
- '    ├── LLaMA 私有化部署（公有云 API → 离线私有化）—— P208'
- '    │   ├── 方法：LLaMA 基座 + ShareGPT GPT-4 子集清洗 + 指令微调'
- '    │   ├── 主张：预训练赋能、微调唤醒；数据隐私是 ToB 刚需'
- '    │   └── 边界：中文能力被“阉割”，需等待原生中文基座开源'
- '    └── RPA+ChatGPT 自动化（重复操作 → 机器人）—— P212'
- '        ├── 方法：RPA 模拟浏览器批量输入 / 智能续写 / 抓取；思路 × 流程 × 自动化交付'
- '        ├── 主张：核心技能 A + 热点 X 复用模型；极速 MVP + 高客单价杠杆'
- '        └── 边界：长期维护开发者稀缺，低门槛赛道生命周期约 3-6 个月'
life_analogy:
- 想象 AI 投喂范式是**给餐厅主厨递食材**：
- '- **数据** = 你准备的食材（PDF、网页、表格、聊天记录）'
- '- **提示词** = 你写的菜谱（分析、提炼、模仿、分类）'
- '- **ChatGPT** = 那位主厨'
- '- 你只喊一句“给我做顿好的”，主厨只能自由发挥；你把食材和菜谱递到位，他才能端出你要的菜。'
- ''
- 想象 ChatGPT 联网选题是**站在编辑部实时热搜大屏前**：
- '- **联网检索** = 大屏上不断滚动的全网热点'
- '- **IP 定位** = 你所在栏目的编辑方针'
- '- **选题** = 你从滚动热点里挑出适合自己栏目的话题'
- '- 大屏人人可见，但最终能做出爆款的，是那些最快选出与栏目调性匹配话题的编辑。'
- ''
- 想象 Midjourney 头像生成是**请画师给自己画像**：
- '- **垫图** = 你递给画师的参考照片'
- '- **描述词** = 你想要的风格与氛围'
- '- **--iw 参数** = 你说“更像照片一点”还是“画得美一点”'
- '- 参数太低画得不像你，参数太高又失去艺术感——高手都靠多试几张找到那个黄金平衡点。'
- ''
- 想象敏感领域合规是**临街开店、仓库放隔壁街**：
- '- **平台内正文** = 临街橱窗，只放安全、可展示的引流招牌'
- '- **飞书文档** = 隔壁仓库，承载核心干货与敏感内容'
- '- **引流话术** = 引导顾客绕到仓库后门取货'
- '- 橱窗合规才能长期开店，仓库合规才能留住老客。'
- ''
- 想象 RPA+ChatGPT 自动化是**给内容工厂装一条流水线**：
- '- **机器人** = 机械臂，负责重复的搬运、填充、抓取动作'
- '- **人工** = 质检员，只验收最终产品'
- '- **思路与流程** = 生产线设计图，比机械臂本身更值钱'
- '- 只卖机械臂容易被人模仿，连设计图一起交付才构成真正的护城河。'
- ''
- 想象短剧 CPS 混剪是**电影预告片剪辑师的工作台**：
- '- **场景划分** = 把正片按“钩子—铺垫—冲突—高潮—悬念”切成片段库'
- '- **爆款字幕** = 在关键画面上贴上吸引眼球、引导点击的字幕条'
- '- **20 分钟 SOP** = 预告片剪辑的标准化流水线'
- '- 预告片不追求讲完整故事，只负责把观众“勾”进电影院。'
summary:
- concept: AI 投喂范式
  desc: 结构化输入特定数据+提示词，是释放大模型通用能力的前置技能，模糊输入必然导致模糊输出
- concept: 七大投喂场景
  desc: PDF 分析、联网查询、表格分析、风格模仿、聊天记录分类、长文本速读、知识库问答各有对应提示词方法
- concept: ChatGPT 联网选题
  desc: 选题即正义、蹭热点是最快捷径；联网功能将选题工作流升级为 AI 实时检索+IP 定位筛选
- concept: 敏感领域合规
  desc: 利用“正文洗白+外部托管+引流分发”三重架构，降低风水命理等高敏感内容的封号风险
- concept: 懒人简笔画
  desc: 不卷技术参数卷定位：个人才干定位 × 低门槛工具链 × 场景化变现，表情包即社群社交货币
- concept: Midjourney 头像
  desc: 垫图控制参考特征、--iw 平衡“还原度”与“风格化”，组合 Notion AI 才能形成完整变现闭环
- concept: 海外工具站
  desc: 通过“卖流量”与“卖产品”双轨变现，选品须满足利基市场、ChatGPT 强相关、普通人可控复杂度三要素
- concept: LeiaPix 3D 视频
  desc: 免费将 2D 图转 3D 动态视频，与 ChatGPT、Midjourney 串联可零成本搭建端到端 3D 视频工作流
- concept: LLaMA 私有化部署
  desc: 核心范式为“预训练赋能、微调唤醒”，以少量高质量指令数据低成本复现 ChatGPT 级能力
- concept: 中文基座瓶颈
  desc: LLaMA 中文能力被“阉割”且微调难弥补，中文私有化落地需等待原生中文基座开源，短期优先出海英文场景
- concept: AI 声音克隆
  desc: So-VITS-SVC 一站式整合包使零基础用户也能制作 AI 翻唱，但模型训练与商用存在版权法律风险
- concept: 超级 SEO 助手
  desc: 技术+ChatGPT 实现标题/关键词到自动发布收录的全流水线，让内容生产成本趋近于零
- concept: RPA+ChatGPT 自动化
  desc: 核心技能 A 嫁接热点 X，以“思路×流程×自动化”三位一体交付，一周可创收 7 万级营收
- concept: CrazyTalk 8 数字人
  desc: 静态图片+语录音频驱动嘴部动作，十几分钟产出原创短视频，月涨粉 10w+，但存在红皇后效应
- concept: 图文二创拆解法
  desc: 用工具挖掘高潜力类目、全维度拆解对标账号，站在优秀同行肩膀上复制微创新是最短变现路径
- concept: 短剧 CPS 混剪
  desc: 以“视频场景划分+爆款字幕策略”双支柱，20 分钟标准化复现一条混剪爆款视频
exercises:
- 'no': 1
  title: 设计三条投喂指令
  contents:
  - 给定三个真实场景：
  - 场景 A：你收到一份 50 页行业报告 PDF，希望提炼核心观点与数据趋势；
  - 场景 B：你想让 ChatGPT 模仿某位作者的公众号写作风格，写一篇 500 字短文；
  - 场景 C：你有 200 条客户咨询聊天记录，需要按问题类型自动分类打标。
  - 任务：
  - 1. 针对每个场景写出一条完整的投喂指令（包含数据源描述 + 任务动词 + 输出格式约束）；
  - 2. 对比三个场景在“输入结构化程度”上的差异，并说明各自需要哪些预处理；
  - 3. 思考：若 PDF 内容超出上下文窗口，你会如何分段处理？为什么说“模糊输入导致模糊输出”？
- 'no': 2
  title: 海外工具站 IDEA 三要素评估
  contents:
  - 给定三个候选方向：
  - A. Voice Control For ChatGPT（语音控制 ChatGPT 对话）；
  - B. ChatGPT To Notion（将 ChatGPT 会话一键保存到知识库）；
  - C. 朋友圈文案生成器（面向中文用户的中文垂直场景工具）。
  - 任务：
  - 1. 用“市场需求 + ChatGPT 强相关 + 普通人可控复杂度”三个要素分别打分（1-5 分），并写出打分理由；
  - 2. 对每个方向分别指出“卖流量（免费工具+广告/联盟）”与“卖产品（付费工具+销售链路）”的具体变现路径；
  - 3. 用“ChatGPT To xxx / Xxx For ChatGPT / chatgpt for xxx”句式再挖掘 2 个潜在需求，并论证它们为何能满足三要素铁律。
- 'no': 3
  title: Midjourney 头像 --iw 参数对照实验
  contents:
  - 给定条件：一张个人正面半身照作为垫图，描述词为“portrait, cyberpunk style, neon lights, 4k”。
  - 任务：
  - 1. 设计 --iw 分别为 0、0.5、1、1.5、2 的五组生成实验，说明每组应重点观察“还原度”还是“风格化”；
  - 2. 为每组输出打分（相似度、美感各 5 分），并指出你认为的最优 --iw 区间及判断依据；
  - 3. 若垫图是一张模糊的旧照片，你预测最优 --iw 会偏大还是偏小？说明理由；
  - 4. 拓展思考：选出最优头像后，如何结合 Notion AI 生成 3 条小红书配文和 5 个标签？
- 'no': 4
  title: 设计一条 RPA+ChatGPT 自动化内容生产线
  contents:
  - 选择一项你每周都会做的重复性内容任务（例如：整理公众号文章素材、生成日报、批量回复用户咨询）。
  - 任务：
  - 1. 用“思路（业务目标）→ 流程（可标准化的步骤）→ 自动化（RPA 可执行的环节）”三层结构完整描述该任务；
  - 2. 标出至少两个必须保留人工质检的节点，并解释为什么“人工仅负责验收”是可行且必要的；
  - 3. 估算改进前后完成该任务分别需要多少时间，并画出人机分工示意图（文字形式即可）；
  - 4. 回答：为什么这套方案适合用 1980 元的高客单价交付，而不是作为一个裸工具低价出售？
- 'no': 5
  title: 短剧混剪场景划分与字幕策略演练
  contents:
  - 给定一段虚构短剧剧情梗概：
  - “男主发现闺蜜背叛自己 → 当面对质爆发冲突 → 闺蜜反咬一口制造反转 → 女主失望离开 → 片尾留下神秘悬念。”
  - 任务：
  - 1. 按“钩子 → 铺垫 → 冲突 → 高潮 → 悬念”五个场景给素材分段，写出每段应保留的原始画面关键词；
  - 2. 为每个场景设计一条字幕策略（关键台词强调 / 情绪引导 / 引导观看话术），并说明各自的目标；
  - 3. 估算按该 SOP 制作一条混剪视频需要多少分钟，并指出哪一步最容易影响完播率；
  - 4. 思考：若平台升级了去重算法，混剪视频应如何调整？为什么说“爆款结构可以复刻，但素材必须持续更新”？
