  - '**典型例子**'
  - '- 作者用角色指令做了 AI 佛祖、AI 律所等多款火出圈的小应用。'
  - '- 初学者用角色生成器一键生成专家角色指令，修改后直接投入使用。'
  - '**边界条件**'
  - '- 角色生成器不能替代领域知识，指令仍需人工微调。'
  - '- 模型能力决定应用上限；底层模型太弱，再好的指令也难救。'
  sources:
