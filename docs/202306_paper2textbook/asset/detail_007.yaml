  - '- 合规与风控 = 在做任何 AI 变现项目前，先识别平台规则红线、敏感内容边界和版权责任，再设计内容生产与分发方式。'
  - '**关键性质**'
  - '- 合规是底线，不是成本。'
  - '- 常用策略：AI 生成合规方案、外部托管规避正文审核、正文只留引流入口、敏感词预审。'
  - '- 灰色地带“存在合理”不等于永远安全。'
  - '**典型例子**'
  - '- 风水命理内容用 ChatGPT 生成规避敏感词方案，核心干货放飞书，帖子只做引流入口。'
  - '- 直播话术接入抖音官方预审和第三方敏感词查询工具双重扫描。'
