learning_targets:
- 理解 AI 副业入门的认知门槛与机会窗口，建立“信息差 + 工具杠杆”的双重套利思维
- 掌握生态位定位法，能根据自身角色（甲方/乙方生产者/乙方消费者/第三方）选择匹配的变现路径
- 学会用异常值案例库方法捕捉 AI 变现的早期信号，避免盲目追热点
- 掌握 AI 绘画（Lora 炼丹 + ControlNet 控制）、AI 写作（投喂→指令→内容工厂）、AI 编程（自然语言造轮子）等核心技能
- 理解 AI 视频多模态工作流与声音克隆的技术链路及版权边界
- 掌握私有化部署与 To B 变现在数据隐私时代的商业化路径
- 学会 RPA+X 模型快速组合热点产品，并理解提示工程六重境界对提问质量的提升
- 建立合规与风控意识，理解规模化放大中生产端与获客端动态平衡的底层逻辑
concept_map:
- AI 赋能副业实战
- ├── 认知与定位
- │   ├── 认知门槛与机会窗口
- │   │   ├── 方法：识别焦虑误区、捕捉机会窗口
- │   │   └── 主张：AI 第一波淘汰的不是你，副业=信息差+工具杠杆
- │   ├── 生态位定位法
- │   │   ├── 方法：按甲方/乙方生产者/乙方消费者/第三方定位
- │   │   └── 主张：赚什么钱由生态位决定，跨位必败
- │   └── 异常值案例库
- │       ├── 方法：收集边缘高 ROI 案例，不做深度拆解
- │       └── 主张：异常值预示新商业范式，灵感启发>体系分类
- ├── 绘画与视觉
- │   ├── AI 绘画落地进阶
- │   │   ├── 方法：Lora 炼丹（主体）+ ControlNet 控制（生成）
- │   │   └── 主张：从“能出图”到“能交付”需可控生成
- │   └── AI 绘画变现三范式
- │       ├── 方法：头像壁纸号/同人周边/POD 定制
- │       └── 主张：会画图≠会赚钱，需标准化交付闭环
- ├── 写作与内容
- │   ├── AI 写作产业化
- │   │   ├── 方法：投喂 → 结构化指令 → 对标拆解 → 内容工厂
- │   │   └── 主张：过程式协作，人管框架，AI 分步执行
- │   └── AI 写作变现样本
- │       ├── 方法：公众号爆文/线上兼职/直播话术
- │       └── 主张：收入阶梯清晰，新人也能月入过万
- ├── 编程与工具
- │   ├── AI 编程降维
- │   │   ├── 方法：自然语言生成插件/工具站，卖流量或卖产品
- │   │   └── 主张：极简工具链，普通人也能造轮子
- │   └── 角色指令工程
- │       ├── 方法：身份设定+任务设定+约束设定三要素
- │       └── 主张：结构化指令一键生成专家角色
- ├── 视频与音频
- │   ├── AI 视频多模态工作流
- │   │   ├── 方法：ChatGPT+Midjourney+LeiaPix+剪映 六步 SOP
- │   │   └── 主张：多模态组装降维打击专业制作门槛
- │   └── AI 声音克隆
- │       ├── 方法：So-VITS-SVC 整合包，零基础训练推理
- │       └── 主张：技术门槛降低，版权红线升高
- ├── 部署与知识库
- │   ├── 私有化部署
- │   │   ├── 方法：LLaMA+少量高质量数据微调（Vicuna/LIMA 范式）
- │   │   └── 主张：数据隐私时代 To B 落地的核心护城河
- │   └── 个人 AI 知识库
- │       ├── 方法：FastAPI+Embedding+向量数据库+ChatGPT 插件
- │       └── 主张：大模型按需理解私有文档，成本极低
- ├── 变现模型与放大
- │   ├── RPA+X 模型
- │   │   ├── 方法：稳定核心技能 A 嫁接热点 X，极速 MVP
- │   │   └── 主张：工具不值钱，思路×流程×自动化才值钱
- │   └── 规模化放大
- │       ├── 方法：生产端与获客端动态平衡，标准化复制
- │       └── 主张：低门槛红利期仅 3-6 个月，需提前转型
- └── 提问与风控
- '    ├── 提示工程六重境界'
- '    │   ├── 方法：语境→比较→多因果→批判→筛选→案例'
- '    │   └── 主张：提问质量决定回答上限'
- '    └── 合规与风控'
- '        ├── 方法：平台红线识别、外部托管、敏感词预审'
- '        └── 主张：合规是底线，灰色地带不长久'
life_analogy:
- 想象 AI 副业是一场**小吃街创业**：
- '- **认知门槛** = 选对摆摊的街口（信息差和位置）'
- '- **生态位** = 你是摊主、供应商还是街道管理员（甲方/乙方/第三方）'
- '- **工具杠杆** = 一台高效炸锅（AI 工具）让新手也能出餐'
- '- **异常值案例** = 突然排队的神秘小摊（反常中隐藏机会）'
- 就像聪明的摊主会先观察哪条街人流旺、再决定自己卖什么，AI 副业也要先定生态位、再选工具。
- ''
- 想象 AI 写作内容工厂是**快餐连锁的中央厨房**：
- '- **投喂爆款** = 采购优质食材（爆款范文）'
- '- **结构化指令** = 标准菜谱（提示词模板）'
- '- **RPA 自动化** = 自动炒菜机器人'
- '- **不求三性** = 不求每道菜精美，只求批量出餐覆盖关键词'
- 正如中央厨房解决的是“从1到100”的规模出餐，内容工厂解决的是“从1到100”的批量生产。
- ''
- 想象私有化部署是**给企业装数据保险柜**：
- '- **开源基座 LLaMA** = 保险柜的钢板（基础模型）'
- '- **高质量数据微调** = 按企业尺寸定制内部隔层'
- '- **To B 收费** = 卖保险柜及安装服务'
- 企业不敢把现金放在公共广场，同样不敢把核心数据上传公有云，私有化部署正是满足这一刚需的生意。
summary:
- concept: 认知门槛与机会窗口
  desc: 普通人面对 AI 无谓焦虑，机会在于低机会成本与工具杠杆的双重套利。
- concept: 生态位定位法
  desc: 根据你在 AI 生态中的角色（甲方/乙方生产者/乙方消费者/第三方）选择匹配的赚钱路径。
- concept: 异常值案例库
  desc: 放弃体系化分类，收集边缘高 ROI 案例以获得灵感启发，捕捉早期商业信号。
- concept: AI 绘画落地进阶
  desc: Lora 炼丹负责主体炼制，ControlNet 负责生成控制，实现从“能出图”到“能交付”。
- concept: AI 绘画变现三范式
  desc: 头像壁纸号、同人周边、POD 定制是 AI 绘画的三大可复制商业闭环。
- concept: AI 写作产业化
  desc: 从投喂、结构化指令到 RPA+AI 内容工厂，将写作变为标准化流水线。
- concept: AI 写作变现样本
  desc: 公众号爆文、线上兼职、直播话术是三条被验证的变现路径，收入阶梯清晰。
- concept: AI 编程降维
  desc: 自然语言让 ChatGPT 生成代码，通过卖流量或卖产品实现工具变现。
- concept: AI 视频多模态工作流
  desc: 串联 ChatGPT+Midjourney+LeiaPix+剪映，一人完成视频生产管线。
- concept: AI 声音克隆
  desc: So-VITS-SVC 等框架降低技术门槛，但版权红线更高，商用需谨慎。
- concept: 私有化部署
  desc: 开源基座+少量高质量数据微调，为企业提供数据隐私时代的 To B 护城河。
- concept: RPA+X 模型
  desc: 以稳定核心技能嫁接热点场景，快速组合成高客单价解决方案。
- concept: 提示工程六重境界
  desc: 借鉴社会学好问题标准，从语境、比较、多因果到关键案例，提升提问深度。
- concept: 个人 AI 知识库
  desc: 通过 Embedding+向量数据库，让大模型按需理解私有文档，成本极低。
- concept: 合规与风控
  desc: 识别平台红线、版权灰色地带，用外部托管和敏感词预审保护收益。
- concept: 规模化放大
  desc: 生产端与获客端必须动态平衡，低门槛赛道红利期仅 3-6 个月。
- concept: 角色指令工程
  desc: 用“身份+任务+约束”三要素快速创建专家级 AI 角色。
exercises:
- 'no': 1
  title: 绘制你的AI副业生态位地图
  contents:
  - 假设你目前想在AI领域变现，请回答以下问题：
  - 1. 你当前属于哪个生态位（甲方/乙方生产者/乙方消费者/第三方）？判断依据是什么？
  - 2. 针对你的生态位，写出两条最适合你的变现路径，并说明理由。
  - 3. 如果选择第三方，请用“真实痛点+无免费竞品”两个前提筛选一个赛道。
  - 提示：先列出你自己的资源、技能和可投入时间，再画生态位地图。
- 'no': 2
  title: 搭建一个AI写作内容工厂MVP
  contents:
  - 1. 收集同赛道3篇爆款文章，用“投喂爆款反推指令”法让ChatGPT生成一份可复用的写作指令。
  - 2. 用该指令一次性生成5个标题和3篇正文草稿。
  - 3. 记录每篇产出耗时，分析哪些环节可用RPA自动化替代。
  - 4. 回答问题：为什么内容工厂只能解决从1到100，不能解决从0到1？
- 'no': 3
  title: AI绘画变现方案设计
  contents:
  - 1. 从三个变现范式（头像壁纸号/同人周边/POD定制）中选一个，设计从选品、出图、交付到售后的完整SOP。
  - 2. 指出该范式的版权风险点，并给出一个合规规避方案。
  - 3. 如果用“LoRA过拟合”生成指定服装，你会如何平衡还原度与泛化能力？
- 'no': 4
  title: 设计一个RPA+热点产品
  contents:
  - 1. 选择你熟悉的一项稳定技能（如RPA、写作、剪辑），结合当前热点（如AI数字人、短剧CPS），构思一个极速MVP。
  - 2. 写出产品定价（建议高客单价）与目标客户画像。
  - 3. 用“思路×流程×自动化”三层结构描述交付方案。
  - 4. 回答问题：为什么说“工具不值钱，解决方案才值钱”？
units:
- 'no': 1
  name: 认知门槛与机会窗口 —— 别在焦虑中错过 AI 红利
  points:
  - '**为什么需要这个概念？**'
  - '- AI 浪潮一来，很多人第一反应是“我是不是马上要被淘汰了”；没有正确认知，就容易在焦虑中乱买课、乱试错，错过真正的机会窗口。'
  - '- 副业赚钱不是靠找到万能项目，而是先看懂机会在哪里、自己的位置在哪里；这是 AI 副业入门要解决的第一个问题。'
  - '**核心定义**'
  - '- AI 副业入门 = 在正确认知基础上，利用 AI 工具杠杆与信息差实现低门槛变现的起点。它强调两点：普通人面对 AI 的机会成本低，反而拥有历史性红利窗口；副业本质是“信息差
    + 工具杠杆”的双重套利。'
  - '**关键性质**'
  - '- 门槛悖论：AI 看似降低了创作门槛，实则提高了高质量产出的门槛，因为更考验提问能力、判断力和审美。'
  - '- 机会窗口：AI 第一波淘汰的往往是高薪专业岗位，普通人与二三四线城市之间存在认知与技能差。'
  - '- 生态位决定收益：同是使用 AI，甲方赚抽成、生产者赚提效、消费者赚学习成长、第三方赚痛点服务。'
  - '**典型例子**'
  - '- Y仔用 GPT-3.5 + BOSS 直聘接线上兼职，纯小白按步骤操作，5 月也赚了 1 万多；这说明“会用工具 + 肯执行”就能跑通。'
  - '- 很多人让 GPT“秒出高考作文”，结果 low 到爆；这不是 AI 不行，而是把过程式协作当成了两点一线。'
  - '**边界条件**'
  - '- 不是所有生态位都能赚钱：如果只当消费者，却指望直接变现，定位本身就错了。'
  - '- 机会窗口不等于人人可赚；认知、执行力和定位不匹配时，工具杠杆反而会放大差距。'
  sources:
  - paper: docs/202306/20230627_090.md
    role: origin
  - paper: docs/202306/20230613_027.md
    role: critique
  - paper: docs/202306/20230627_094.md
    role: improve
  excerpts:
  - 首先我想说，普通人面对 AI，真没必要焦虑，AI 第一波淘汰的并不是你，天塌了也是高个子的先顶着。
  - 纯小白也能做，你只需要学会怎么用 GPT 输出能用的文章，再按照执行步骤去一步步操作即可。
  - gpt 看似降低门槛，实则提高了门槛，加剧了分化。
  - 使用 GPT 来解决问题是一个过程，但太多人将其当做两点一线。
  - 只有你明确了你在 ChatGPT 生态系统中的生态位，你才有可能弄清楚，你要如何在 ChatGPT 这件事上赚钱，赚的到底是什么钱。
- 'no': 2
  name: 生态位定位法 —— 先认位，再赚钱
  points:
  - '**为什么需要这个概念？**'
  - '- 同样是 ChatGPT，有人做平台、有人做内容、有人卖服务，赚钱方式完全不同。'
  - '- 如果不先定位，就容易这山望着那山高，看到别人赚钱就盲目模仿，最后什么都做不成。'
  - '**核心定义**'
  - '- 生态位定位法 = 借用生物学“生态位”概念，把你在 ChatGPT 商业生态中的位置分成甲方（平台方）、乙方生产者、乙方消费者、第三方（中间服务商），再根据位置选择赚钱路径。'
  - '**关键性质**'
  - '- 赚什么钱由生态位决定：甲方靠平台抽水，生产者靠提效降本，消费者靠学习/决策提效，第三方靠解决痛点赚快钱。'
  - '- 第三方有两个硬前提：发现并解决真实痛点，且该赛道暂时没有免费竞品。'
  - '- 生态位不是终身制，人可以通过技能迁移和资源积累改变位置。'
  - '**典型例子**'
  - '- 付盛创业做垂直大模型“聚言”，属于甲方生态位。'
  - '- 游戏公司用 SD 生成美术图，把成本从几百万压到几十万，属于乙方生产者。'
  - '- 账号代充、代写文章、付费出图、培训社群，属于第三方服务商。'
  - '**边界条件**'
  - '- 如果只把自己定位成消费者，却想着直接靠 ChatGPT 赚钱，定位本身就不合理。'
  - '- 第三方红利窗口很短，免费竞品一出现，套利空间就会快速消失。'
  sources:
  - paper: docs/202306/20230627_094.md
    role: origin
  excerpts:
  - 生态位（Ecological niche）是指一个生物种在生态系统中所处的位置，以及它如何与环境和其他物种相互作用。
  - 我简单的把 ChatGPT 生态系统中的生态位，拆分为三类：1. 甲方 2. 乙方 3. 第三方。
  - 想做 ChatGPT 生态系统中的第三方，有两个前提条件：1. 你发现并解决了一类人的真实痛点 2. 该赛道没有免费的竞品出现。
  - 现在很多游戏研发公司，都在搭建自己的 AIGC 团队，用 SD 去生成一些游戏中的美术图，这部分成本，之前可能在一款游戏中，要占到几百万，那现在如果用几十万甚至更低的价格就实现了。
- 'no': 3
  name: 异常值案例库 —— 盯反常，不追热点
  points:
  - '**为什么需要这个概念？**'
  - '- AI 领域信息爆炸，体系化分类难到无从下手；反而边缘化、高收益的小案例能带来最直接的灵感。'
  - '- 系统性方法论往往太重，普通人需要低认知负荷、可立即行动的“信号源”。'
  - '**核心定义**'
  - '- 异常值案例库 = 一种自底向上的信息整理方法：放弃 MECE 体系化分类，收集、筛选市场上少数成功、可复制、高 ROI 的 AI 应用边缘案例，只做灵感启发，不做深度拆解。'
  - '**关键性质**'
  - '- 低认知负荷：每期只给方向和案例，读者自行验证、复制、放大。'
  - '- 异常值思维：偏离常态的数据点往往预示新的商业范式或流量入口。'
  - '- 可迭代：案例库可以持续更新，比一次性方法论更适应 AI 快速变化。'
  - '**典型例子**'
  - '- 证件照新型 P 图法、MJ 批量定制手机壳、画师新型流量获客法、AI 技术视觉化变现、小孩涂鸦定制。'
  - '- 第一期还收录了宝宝起名号、AI 热点资讯号、头像壁纸号、小说推文号、流量收益号等 10 个案例。'
  - '**边界条件**'
  - '- 案例未经验证，“可能啥用没有，也可能黄金万两”。'
  - '- 不能只收藏不动手；必须结合自身资源去试，才能把灵感变成收益。'
  sources:
  - paper: docs/202306/20230613_029.md
    role: origin
  - paper: docs/202306/20230627_095.md
    role: improve
  excerpts:
  - 于是我转变为写【AI 变现异常值案例库】，侧重于副业项目这款，把我观察到的案例分享给大家，不会做过多的拆解和分析，更多的是偏向于灵感启发。
  - 思考这里面的案例有没有你能做的，能复制的，能放大的，可能屁用没有，也可能黄金万两。
  - 其中有部分信息，也许蕴藏着巨大的变现机会，但我自己没有时间与精力去一一验证。
