  name: AI 绘画落地进阶 —— 从“能出图”到“能交付”
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人学会 Stable Diffusion / Midjourney 后只停留在“玩”的层面，出图随机、不可控，无法商业化。'
  - '- 商业应用要求可控、可定制、可交付，所以必须掌握“控制生成”的核心能力。'
  - '**核心定义**'
  - '- AI 绘画落地进阶 = Lora 炼丹（负责炼制特定人物、物体或风格的小模型）+ ControlNet 控制（负责结构、姿势、边缘、深度等精准控制），再加上
    Midjourney 的结构化提示词范式（摄影写法 / 工艺品写法）。'
  - '**关键性质**'
  - '- Lora 与 ControlNet 是 SD 应用层的双核：Lora 解决“是什么”，ControlNet 解决“怎么生成”。'
  - '- ControlNet 有 15 种模型，每种模型对应不同的采集方式与应用场景。'
  - '- 提示词结构化可以绕过部分设计专业知识，让非设计师也能出商业级概念图。'
  - '**典型例子**'
  - '- 用 Shutterstock 网站的关键词反向提词，生成手提包、珠宝、沙发的商业概念图。'
  - '- ControlNet 实现动漫转真人、真人转动漫、控制人物姿势表情、线稿 AI 上色、固定主角。'
  - '- 指定衣服时，训练专属衣服的 LoRA 并故意“炼到过拟合”，就能生成接近原图的衣服。'
  - '**边界条件**'
  - '- AI 生成目前更适合概念图/思路图，落地仍需工业设计师和工厂配合。'
  - '- 品牌名和设计师调用有版权风险，且不是所有设计师风格都被 MJ 训练过。'
  - '- Lora 过拟合牺牲泛化能力，需要按具体任务选择。'
