    role: origin
  excerpts:
  - 今天，从「浙大社会学系系主任」赵鼎新老师的一篇论文里，找到「向 AI 提出好问题」的六重境界（6 个方法）。
  - 深刻的问题，才有深刻的答案。但很少有人知道，深刻的问题从何而来？
  - 我们很难凭空提出「有深度、具体明确、有探索价值的问题」。但我们可以比较容易地反着来，去避免没有深度、不具体明确和没有探索价值的问题。
