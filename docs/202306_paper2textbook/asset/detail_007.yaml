  - '- 个人 AI 知识库 = ChatGPT 网页端插件 + FastAPI 中间层 + OpenAI Embedding API + 向量数据库。把私有文档向量化存储后，用自然语言对话式检索，并可在网页端继续追问加工。'
  - '**关键性质**'
  - '- 成本极低：约 3.7k 中文字只需两分钱。'
  - '- 灵活性高：不再受“预设框架”限制，模型按你的需求理解信息。'
  - '- 可复用插件生态：检索结果还能交给其他插件做二次梳理。'
  - '**典型例子**'
  - '- 作者自建知识库后，在 ChatGPT 网页端对数据库提取出的上下文继续提问或梳理。'
  - '- HARPA AI 插件把常用 Prompt 封装成快捷指令，在任意网页一键完成摘要、笔记、待办提取。'
  - '**边界条件**'
  - '- 需要基本的 FastAPI 和向量数据库部署能力。'
  - '- 知识库质量依赖文档切分、向量化效果和检索策略。'
  - '- 不是零技术门槛，但比自训模型低得多。'
  sources:
  - paper: docs/202306/20230613_128.md
    role: origin
  - paper: docs/202306/20230613_014.md
    role: apply
  excerpts:
  - 这些工具要求我们按照预设的框架去整理信息，而这些框架可能并不完全符合我们的需求，缺乏足够的灵活性。
  - 成本极低：只需花费一点点费用就能处理大量的文字信息（我计算了下，3.7k 的中文字，两分钱）。
  - 基于 ChatGPT 网页端插件搭建知识库，在 ChatGPT 网页端，你可以对数据库提取出来的上下文进行再次提问。
  - 插件名称叫 HARPA AI，打开对应要阅读的网页界面，点击一下插件图标，就能够调用插件，点选里面的快捷指令就能自动调用，无需调教。
