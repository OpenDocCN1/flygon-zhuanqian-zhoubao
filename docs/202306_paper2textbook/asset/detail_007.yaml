  name: 提示工程六重境界 —— 把社会学家的思考方式教给 AI
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人堆砌提示词仍得不到好答案，因为好问题本身需要方法论。'
  - '- 深刻的问题，才有深刻的答案；但很少有人知道深刻问题从何而来。'
  - '**核心定义**'
  - '- 提示工程六重境界 = 将社会学家赵鼎新“什么是好的研究问题”的标准迁移到 AI 提问：1. 语境完备化；2. 维度化比较分析；3. 多竞争性假设；4.
    隐含假设批判；5. 反向筛选问题；6. 关键案例定标。'
  - '**关键性质**'
  - '- 提问质量决定回答上限。'
  - '- 反向筛选比正向构建容易：先避开“答案太明显”和“问题太发散”的低质量问题。'
  - '- 好案例能把抽象问题具体化，连接理论与实践。'
  - '**典型例子**'
  - '- 张一鸣高考填志愿，按“下雪、靠海、离家远、综合性大学、大城市”五个维度逐项筛选，最后锁定南开大学。'
  - '- 分析“专业就业率高”时，不只看到市场需求，还要想到毕业生求职意愿、职业中心利用率、校友网络等竞争性假设。'
  - '**边界条件**'
  - '- 适用于复杂决策、研究式提问；对常识性简单问题会显得过度设计。'
  - '- 需要刻意练习，不是看一遍就能掌握。'
  sources:
