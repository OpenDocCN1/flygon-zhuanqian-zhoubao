  name: 个人 AI 知识库 —— 给大模型装一块“外挂硬盘”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统笔记工具用预设框架装所有信息，太僵化；资料越多越难调出来。'
  - '- 大模型能理解自然语言，正好可以替代“人适应工具”的旧范式。'
