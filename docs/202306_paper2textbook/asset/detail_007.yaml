  excerpts:
  - Lora 负责把自己生活中有关联的人或物炼制成模型，ControlNet 负责更好地“控制”这个“模型”。
  - 两者结合，你就能真正把 SD 用起来，无论是定制自己的真人模特，还是给某个商业产品做成模型，都可以实现。
  - ControlNet 一共有 15 种模型，每种模型对应不同的采集方式，再对应不同的应用场景，每种应用场景又有不同的变现空间。
  - 如何快速找到设计思路，我们要借助一个叫“shutterstock”的网站，通过在网站上搜索我们想要设计的类别，然后找到关键词，到 MJ 上出图。
  - 要指定衣服，就要炼制定衣服的 lora，炼到过拟合，就能生成接近原图的衣服。
  - 看着这些风格的名字没有什么感觉，但是出图之后就比较清晰了。
