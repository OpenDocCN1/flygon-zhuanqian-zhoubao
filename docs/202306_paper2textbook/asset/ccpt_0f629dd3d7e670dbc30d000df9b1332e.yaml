paper: docs/202306/20230613_256.md
desc: 该素材由实战者老瞿基于闲鱼二手书项目年入百万的实操经验总结，核心阐述了电商平台（以闲鱼为例）的底层分配逻辑：平台仅掌握“曝光分配”与“排序决定”两大权力，其核心目标是最大化GMV与用户留存。素材从平台视角推导出“转化率决定长期流量”“新品扶持机制”“平台多目标引导（降价、优化、任务、服务）”三大核心规则，解释了流量不稳定的概率性本质，并提炼出“选品定生死、基本功扎实、做平台鼓励的事、多试错、重服务控纠纷”五大执行策略，强调在黑箱算法下通过对齐平台目标实现确定性增长。
concepts:
- name: 平台双权模型
  desc: 电商平台核心权力仅限于‘曝光分配’（决定展示哪些商品）与‘排序决定’（决定展示顺序），无法直接干预用户点击与成交决策。
  is_original: false
  excerpt:
  - 闲鱼这个平台爸爸，其实只能做 2 件事：1、决定哪些商品展示出来，也就是所谓的曝光；2、决定各个商品的排序顺序，就是谁排在第一位。
  - 在曝光的商品中，作为顾客，你选择点进去哪个商品，以及你最后是否会成交，这个平台是决定不了的。
- name: 平台目标函数
  desc: 平台算法的底层优化目标：短期最大化单次搜索的转化概率（GMV）、长期最大化用户留存（生态健康）、平衡新老商家生存空间（防止垄断导致生态死亡）。
  is_original: true
  excerpt:
  - 毫无疑问平台喜欢给历史转化高的商品链接更多曝光，因为作为平台，首先我希望客户能在我这里选择到喜欢的商品，下次还能继续来这里……其次商品成交以后，我有现金流，或者我能抽一点提成……
  - 但是平台也要顾及一下新的商家，如果永远只是卖的好的商品链接有曝光，那后面来的商家就没有机会了，这样平台还是会死掉……
- name: 流量分配的概率性本质
  desc: 系统根据用户历史画像分发流量，但用户购买意愿存在不确定性，导致同质商品因初始流量质量差异（如被分发大量比价党）产生马太效应或死亡螺旋，商家无法控制流量质量，只能通过重复试错增加被精准分发的概率。
  is_original: true
  excerpt:
  - 你的商品链接被推的全部是这 30 个看看不买的人，这样就会让系统觉得你的链接不行，转化率太差，渐渐就不会给你流量了。
  - 我们没有办法决定系统给你推了什么的曝光和流量，因为就会存在一定的概率性……那你要怎么办？流量枯竭的商品链接，你就下架呗，多发几次，总有一次我可能给你推的是精准的流量，你这个链接就爆了。
- name: 平台显性引导机制
  desc: 平台通过‘曝光激励’显性引导商家行为：除转化率外，还明确奖励降价、优化详情、完成任务（换闲鱼币推广）、提升好评率等行为，商家应主动对齐这些指标。
  is_original: false
  excerpt:
  - 比如希望大家降价……比如希望大家能优化商品的介绍……比如希望商家都留在自己平台，设置一些小任务……比如希望商家服务好客户，所以如果你的好评占比高，给你更多流量……
  - 闲鱼还在曝光量旁边给你展示了下：因为什么增加了曝光，同时给你一份卖家宝典，就是想告诉你，我们希望你这样做。
methods:
- name: __overview__
  desc: ‘换位思考+第一性原理拆解+概率论试错’三步法：1. 站在平台创始人视角推导规则本质；2. 拆解平台目标函数与权力边界；3. 针对不可控的概率性流量分发，制定‘高频试错+基本功兜底+显性对齐’的执行战术。
  excerpt:
  - 今天我就用一个相对外行，却也取得一些小成绩的电商人视角，给大家聊一聊：电商的底层逻辑……假设你是闲鱼的创始人……
  - 不管平台怎么复杂，底层逻辑肯定是不会有太大变化的，只要我们清楚平台想要什么，我们在能力范围内把这些数据给到平台，平台是不会吝啬曝光的。
- name: 闲鱼二手书实操五步法
  desc: 基于底层逻辑推导的标准化执行SOP：1. 选品定生死（需求大/竞品少）；2. 基本功扎实（号/图/文/价四维转化承接）；3. 做平台鼓励的事（日降价、优详情、做任务换币推广）；4.
    运气不好多试几次（链接死掉即下架重发，直到命中精准流量）；5. 卖出去别惹事（控纠纷、重好评、维护账号权重）。
  excerpt:
  - 1、电商选品定生死 首先你选的这个商品，要有人有需求，最好是卖的人少，有需求的人多。
  - 2、基本功要扎实 ……帐号包装、图片选择、文案描述、合适的价格，这些基本功要做好……
  - 3、做平台鼓励的事情 ……闲鱼平台我喜欢你降价，哪怕一天降价一分钱。喜欢你优化商品详情……喜欢你做各种任务，然后用闲鱼币去推广等等。
  - 4、运气不好，多试几次呗 ……流量枯竭的商品链接，你就下架呗，多发几次……
  - 5、卖出去了，别给我惹事 ……做电商尽可能少点纠纷，大事化小，小事化了……
theorems:
- name: 转化率正反馈循环定律
  desc: '[claim] 高转化率链接获得更多曝光，更多曝光带来更多成交，进一步强化转化率模型权重，形成‘越卖越好’的马太效应；这是S单有效但违法的根本原因。'
  excerpt:
  - 转化率高的链接，会卖的越来越好，这也是为什么 S 单是做好电商最有效的方式；为什么有时候一个商品出了一单就会接着有好几单。
  - 有句话说的好：赚钱的方法都写在刑法里，组织 S 单已经写在刑法里了，你应该懂了吧。
- name: 新品保护期/探索机制
  desc: '[claim] 平台为维持生态活力，强制分配固定比例（如30%）曝光给新上架商品，用于探索潜力链接替代老旧失效链接，是‘每日上新’动作有效的理论依据。'
  excerpt:
  - 所以今天搜索《平凡的世界》这套书有 100 人，我要分 30%的曝光机会给新上的这些商品链接。
  - 而且万一老的商品链接哪天不确定的原因下架了，我也已经从这些新的链接中找到转化比较好的商品链接，成为新的热门商品链接。
  - 新上架的商品平台肯定会给一些机会，这就是为什么每天我们要上新商品。
- name: 黑箱算法下的确定性生存法则
  desc: '[claim] 尽管平台算法极度复杂如黑箱，但其底层商业逻辑（平台需商家留客、商家需平台给流）恒定不变；商家只需持续输出平台目标函数所需数据（转化、低价、优质服务、活跃度），即可稳定获取流量。'
  excerpt:
  - 现在这种过亿用户的平台……他们的代码已经已经特别复杂，游戏规则也很复杂，更像是一个黑匣子，你永远不知道里面具体是什么规则……
  - 但是不管平台怎么复杂，底层逻辑肯定是不会有太大变化的，只要我们清楚平台想要什么，我们在能力范围内把这些数据给到平台，平台是不会吝啬曝光的……
findings:
- name: 流量焦虑源于对平台权力边界的误解
  desc: '[evidence] 作者通过自问自答形式，指出‘无曝光、搜不到、不转化’三大痛点本质：商家被动等待（不主动对齐平台目标）、忽视概率性分发规律（不重试）、基本功欠缺（承接不住流量），而非平台针对性打压。'
  excerpt:
  - 总结起来，就是流量焦虑……如何才能彻底解决流量焦虑这个问题呢？那就是了解平台的游戏规则。
  - 1、为什么我的帐号没有曝光？因为你上架了书以后就等风来，啥动作也不做……
  - 2、为什么我发布的商品自己都搜不到？……要么你的转化率高我天天推你的商品链接……
  - 3、为什么曝光还行就是没什么转化？因为首先我给你曝光了，结果你的图片不吸引人或者价格太高……
- name: 作者实战业绩验证
  desc: '[evidence] 作者以土木工程师转行，2年建立40+闲鱼店铺、单店3000+SKU、年利润100万+的实绩，佐证该底层逻辑与五步法的有效性；且持续输出系列精华帖（无货源玩法、避坑指南、资质办理）形成知识体系。'
  excerpt:
  - 目前已经有 40+闲鱼店铺在运营，都已经升级到 3000+商品数量，年度利润在 100 多个……
  - 花了 2 年时间，我已经算是从职场转型成功了……历史精华帖：1、《深耕行业 2 年后，分享闲鱼二手书无货源、绝版二手书等 5 种玩法》 2、《聊聊你做闲鱼二手书项目失败的
    100 种可能性》 3、《闲鱼二手书航海，办理出版物许可证相关问题解答》
- name: S单本质是作弊转化率正反馈循环
  desc: '[claim] 作者直指S单核心原理：通过造假数据强行触发‘高转化->高曝光->高转化’的平台算法正反馈，并明确指出‘组织S单已写入刑法’的法律红线。'
  excerpt:
  - 转化率高的链接，会卖的越来越好，这也是为什么 S 单是做好电商最有效的方式……有句话说的好：赚钱的方法都写在刑法里，组织 S 单已经写在刑法里了，你应该懂了吧。
