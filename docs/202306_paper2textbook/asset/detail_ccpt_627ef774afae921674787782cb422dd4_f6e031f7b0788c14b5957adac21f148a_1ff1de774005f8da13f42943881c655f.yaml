units:
- 'no': 1
  name: 提示词三要素 —— 让AI拥有“专家大脑”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通用户习惯使用模糊的单条指令，导致AI输出结果低质量、千篇一律'
  - '- AI并非神，无法自动理解深层意图，需要人类保持主体地位进行精细化交流与训练'
  - '- 缺乏结构化设计的提示词，无法将通用大模型快速“调教”为垂直领域的专家角色'
  - '**核心定义**'
  - '- 高质量提示词由“身份设定+任务设定+约束设定”三个模块构成，通过结构化指令实现AI角色调教'
  - '**关键性质**'
  - '- 结构化：拆解为身份/任务/约束三个模块，降低创作门槛'
  - '- 可复用性：可将指令封装为模板，实现工业级可控'
  - '- 元提示词：可让AI反向生成指令草稿，配合微量人工修正'
  - '**典型例子**'
  - '- “AI佛祖”“AI律所”等垂类应用均通过角色指令开发'
  - '**边界条件**'
  - '- 人类仍需投入心力进行交流、训练、把关与修正，AI不能替代人类判断力与审美力'
  - '- 指令质量直接决定输出质量，模糊指令必然产出低质结果'
  sources:
  - paper: docs/202306/20230613_123.md
    role: origin
  excerpts:
  - 角色指令包括身份设定、任务设定、约束设定 3 个部分，结构清晰，可以快速上手，帮助初学者快速创造任意一个专家角色。
  - 当然你也可以使用角色生成器，让 ChatGPT 帮你一键生成角色指令，稍作修改即可使用。
  - 本篇角色指令调教指南，部分已编录在航海手册中。完整版请移步至飞书阅读 https://xq6mz7nkknp.feishu.cn/docx/APhsdunGIoE3j3xfxePcFEwGnhe
- 'no': 2
  name: 投喂范式 —— 让AI从“万能打字机”变成“过程助手”
  points:
  - '**为什么需要这个概念？**'
  - '- 大众普遍将AI当作“单轮指令”工具，妄想“一条提示词秒出高考作文”，导致结果low到爆'
  - '- 缺乏结构化投喂能力，无法将非结构化数据（PDF、网页、表格、长文本、聊天记录）转化为模型可处理的标准化输入'
  - '- 用户难以释放大模型的通用认知能力，陷入“单点式提示词”的误区'
  - '**核心定义**'
  - '- 投喂是指向ChatGPT输入特定格式的数据并配合特定提示词，以触发模型执行分析、总结、提取、模仿等任务的交互范式'
  - '**关键性质**'
  - '- 过程观：AI写作是“需求拆解→角色设定→分步生成→迭代优化”的深度协作过程，而非结果映射'
  - '- 多源支持：涵盖PDF、网页、表格、文本、聊天记录、长文本、公众号等七大数据源'
  - '- 标准化：建立可复制的投喂SOP，适配摘要、联网查询、数据分析、风格模仿、分类打标等高频任务'
  - '**典型例子**'
  - '- 给定PDF让AI分析摘要；给定聊天记录让AI把好友分类打标签；给定公众号让AI提取特定观点'
  - '**边界条件**'
  - '- 输入数据需结构化或具备可读格式，AI无法直接处理加密或非文本文件'
  - '- 输出仍需人工二次润色，不能完全脱离人机协作'
  sources:
  - paper: docs/202306/20230613_202.md
    role: origin
  excerpts:
  - 《ChatGPT 投喂指南》 我想要让 ChatGPT 做这些事： 给它一份 PDF，让它分析摘要、提炼内容； 让它去看某个网页，帮我查询最新的信息； ...
  - 那你不要错过这份入门级的投喂指南！！ 飞书奉上： https://k0z8o16zas8.feishu.cn/docx/SUTKd7wdDoAg2Exv7hoc8m0BnOK
  - 549 赞精华帖背书，用户反馈验证了指南实用性
- 'no': 3
  name: 私有化部署 —— 让AI拥有“保险柜”
  points:
  - '**为什么需要这个概念？**'
  - '- 企业不敢将核心数据上传公有云API，面临数据隐私与合规风险（GDPR、数据安全法）'
  - '- 公有云模式无法满足企业级客户的定制化与本地化部署需求，阻碍大模型ToB商业化落地'
  - '- 缺乏可落地的私有化方案，导致企业级AI变现窗口期未被普通团队捕捉'
  - '**核心定义**'
  - '- 在私有服务器或本地硬件（如U盘型设备）上独立部署类ChatGPT模型，不依赖公有云API，以满足数据隐私与合规要求'
  - '**关键性质**'
  - '- 护城河：数据隐私时代的ToB落地刚需，市场空间巨大'
  - '- 低成本复现：开源基座（LLaMA）+少量高质量指令数据（ShareGPT/LIMA）即可逼近ChatGPT能力'
  - '- 中文瓶颈：LLaMA中文能力被阉割，微调难以根治，短期聚焦英文出海ToB窗口期'
  - '**典型例子**'
  - '- 盈腾/斗学科技团队两个月实现73.2万营收，获融资与政府补贴'
  - '**边界条件**'
  - '- 中文场景需等待原生中文基座开源（如Chinese-LLaMA、Baichuan、Qwen）'
  - '- 需具备模型训练、部署运维等基础工程能力'
  sources:
  - paper: docs/202306/20230613_208.md
    role: origin
  - paper: docs/202306/20230613_126.md
    role: apply
  excerpts:
  - 在数据隐私保护的时代，私有化部署自己的 chatgpt 永远是一个永恒的大需求
  - 基础模型具有了足够的潜力，只需要少量高质量数据微调，就能达到目标水平
  - llama 不是说对中文支持比较差么，fine-tuning 能弥补么 ... 不能，basemodel 阉割了中文 ... 做就来以后做出海产品。中文的要等大佬出
    basemodel 了
  - 截止到今天（5 月 30 日），我们已经实现了 73.2 万的盈利。
- 'no': 4
  name: AI变现案例库 —— 捕捉“异常值”信号
  points:
  - '**为什么需要这个概念？**'
  - '- AI领域跨度过大，无法构建MECE（相互独立、完全穷尽）的体系化分类法'
  - '- 传统方法论抽象难落地，普通人难以从中提取可直接复制的行动路径'
  - '- 缺乏具体可观察的高ROI案例，新手容易陷入“只看理论，不敢实战”的焦虑'
  - '**核心定义**'
  - '- 放弃自顶向下的体系化分类，转而采用自底向上的实证观察，筛选市场上的“异常值”（成功副业案例），按业务方向聚类，侧重灵感启发而非理论构建'
  - '**关键性质**'
  - '- 异常性：收录少数成功、可复制、高ROI的案例，而非平均水平'
  - '- 可迁移：案例库侧重灵感启发，读者可思考“有没有能做的、能复制的、能放大的”'
  - '- 非MECE：不追求分类的穷尽性，降低认知门槛'
  - '**典型例子**'
  - '- 宝宝起名号、AI热点资讯号、头像壁纸号、小说推文号、流量收益号等10个案例'
  - '**边界条件**'
  - '- 案例库不提供深度拆解，仅作为灵感起点，后续需自行验证复制性'
  - '- 部分案例可能受平台风控、红利期限制，具有时效性'
  sources:
  - paper: docs/202306/20230613_029.md
    role: origin
  excerpts:
  - 本来想写一篇 AI 变现方法论...做不到相互独立和完全穷尽...于是我转变为写【AI 变现异常值案例库】
  - 第一期先分享 5 种方向，10 个案例 1.宝宝起名号 2.AI 热点资讯号 3.头像壁纸号 4.小说推文号 5.流量收益号
  - 思考这里面的案例有没有你能做的，能复制的，能放大的
- 'no': 5
  name: AI头像壁纸号 —— 让图片变成“社交货币”
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人切入AI副业缺乏低门槛、零成本、变现清晰的项目起点'
  - '- 缺乏从“出图”到“可控生产”再到“商品级交付”的完整技能树'
  - '- 传统头像壁纸业务受限于绘画技能与设计资源，AI降低了生产门槛但未解决变现路径'
  - '**核心定义**'
  - '- 利用AI绘画工具批量生成头像/壁纸图片，通过内容平台吸引流量并实现流量主广告、私人定制、账号出售/教学等多元变现'
  - '**关键性质**'
  - '- 零成本：无需囤货发货，工具门槛低'
  - '- 垂直细分：需细分至“男生动漫头像”“女生治愈系壁纸”等具体场景，建立精准用户标签'
  - '- 私人定制是利润核心：流量主广告属“喝汤”，私人定制才是“吃肉”'
  - '**典型例子**'
  - '- 治愈系风景、极简线条、IP二创（Jellycat/Labubu）三大爆款关键词体系'
  - '**边界条件**'
  - '- IP二创需注意版权合规红线'
  - '- 单一模型生成人物相似度不足，需结合ControlNet、IP-Adapter或训练专属LoRA提升保真度'
  sources:
  - paper: docs/202306/20230613_030.md
    role: origin
  excerpts:
  - 项目优点是：0 成本，易操作，变现路径足够清晰
  - 方式一：流量主广告分成……方式二：私人定制头像（单价 9.9-99 元，高客单价核心）……方式三：账号出售/教学带徒
  - IP二创：自带流量，易爆款，但需注意版权风险
  - 使用 ControlNet (OpenPose/Depth) 控制姿势和构图 ... 使用 IP-Adapter 或 InstantID 注入人脸特征
- 'no': 6
  name: AI视频工作流 —— 让2D图片“立体起来”
  points:
  - '**为什么需要这个概念？**'
  - '- 专业3D视频制作门槛高、成本贵，普通人无法快速产出商业级动态内容'
  - '- 缺乏串联文本生成、图像生成、动效生成的标准化工具链，导致创作流程割裂'
  - '- 短视频与动态壁纸市场对3D视频需求旺盛，但现有工具（如D-ID）按条收费贵，成本不利于规模化'
  - '**核心定义**'
  - '- 串联ChatGPT（故事/脚本）+ Midjourney（关键帧图像）+ LeiaPix（2D转3D动态视频）+ 剪映（后期合成）的标准化SOP，实现零成本、低门槛的3D视频制作'
  - '**关键性质**'
  - '- 多模态组装：将文本生成、图像生成、深度估计/动效生成三类模型能力组合，降低专业制作门槛'
  - '- 免费优先：LeiaPix完全免费，输出效果逼真，优于按条收费的D-ID'
  - '- 全链路可控：六步骤（故事创作→脚本分镜→提示词工程→图像生成→3D转换→后期合成）'
  - '**典型例子**'
  - '- 动态壁纸、动态头像、动态Logo、广告、短视频等商业级应用'
  - '**边界条件**'
  - '- LeiaPix输出片段仍需导入剪映等剪辑软件进行字幕动画、图标添加、片段拼接等后期处理'
  - '- 适用于中视频和短剧CPS等赛道，非长篇电影级制作'
  sources:
  - paper: docs/202306/20230613_207.md
    role: origin
  excerpts:
  - 首先，使用 ChatGPT 创作一段小故事。接着，将该故事转化为视频脚本...通过 Midjourney 提示词来绘制每个画面的想象图，然后将每个画面输入
    LeiaPix，将 2D 图像转变为 3D 立体效果的视频。
  - 又发现一个宝藏工具，LeiaPix Converter，可以将图像 2D 转换为 3D 效果。关键的是目前完全免费。
  - 完整过程移步飞书文档：https://esouqpttmy.feishu.cn/docx/V3NWdI08Yo4R9lxcIdScEMwanWb
- 'no': 7
  name: RPA+X模式 —— 让“技能”贴上“热点”
  points:
  - '**为什么需要这个概念？**'
  - '- 单一技能（如RPA）容易陷入价格战，缺乏差异化竞争力'
  - '- 热点趋势（如ChatGPT、小红书）转瞬即逝，普通人难以快速组合能力抢占窗口期'
  - '- 缺乏可复用的商业模型，每次面对新热点都要从零开始开发，效率极低'
  - '**核心定义**'
  - '- 以稳定的核心技能A（如RPA自动化）为主线，嫁接变化的热点场景X（如加好友、ChatGPT、小红书、抖音），快速组合形成可变现的解决方案产品'
  - '**关键性质**'
  - '- 内核稳定：核心技能A可复用，降低新产品开发不确定性'
  - '- 外壳敏捷：快速嫁接新热点X，抢占早期窗口期'
  - '- 交付体系：非交付裸机器人，而是“思路×流程×自动化”三位一体解决方案'
  - '**典型例子**'
  - '- RPA+ChatGPT训练营：3节课+核心工具+社群服务，客单价1980元，一周创收7万'
  - '**边界条件**'
  - '- “靠谱长期维护开发者”极度稀缺，RPA技术虽易寻但维护成本高'
  - '- 低门槛赛道（MJ共享账号、AI绘本）极易陷入价格战，生命周期仅3-6个月，需及时转型高客单价产品'
  sources:
  - paper: docs/202306/20230613_212.md
    role: origin
  excerpts:
  - 我的 A 是 RPA，嫁接的对象是 ChatGPT，所以是 RPA+ChatGPT。
  - 交付内容不能是一个机器人。机器人本身不太值钱，值钱的是一整套玩法。
  - 在 3 月 3 号...推出 RPA+ChatGPT 训练营，只讲三节课，收费 1980/人。
  - 创收了 7 万...复用模型推出 AI 航海社 10 天创收 5 万+
- 'no': 8
  name: AI内容自动化生产线 —— 让“手工投喂”变成“批量生产”
  points:
  - '**为什么需要这个概念？**'
  - '- 单次手动输入Prompt生成内容，效率低且难以规模化，无法满足商业级内容需求'
  - '- 人工生产内容存在瓶颈（如一天仅100篇），人力成本随规模指数上升'
  - '- 缺乏标准化的自动化流程，导致内容生产依赖个人经验，无法交付给团队复制'
  - '**核心定义**'
  - '- 利用RPA模拟浏览器操作，实现向AI自动批量输入Prompt、智能判断内容完整性并自动续写、自动抓取保存生成结果，将单日生产量从百篇级提升至万篇级'
  - '**关键性质**'
  - '- 批量化：单次生成提升至批量规模，人工仅负责验收'
  - '- 智能判断：RPA具备内容完整性检测，不完整则自动触发“续写”指令'
  - '- 工程化交付：沉淀为“思路×流程×自动化”三层交付标准，支撑高客单价'
  - '**典型例子**'
  - '- 私域流量一周创收7万，35人成交，客单价1980元'
  - '**边界条件**'
  - '- RPA技术虽易寻，但“靠谱长期维护开发者”极度稀缺'
  - '- 自动化内容生产仍需人工质检，不能完全脱离人机协作'
  sources:
  - paper: docs/202306/20230613_212.md
    role: origin
  excerpts:
  - 把生成流程梳理好之后，就可以借助 RPA 来实现内容的自动输入和内容的自动抓取保存。
  - RPA 机器人还具备多个智能判断功能。比如生成的内容不完整，那么就会自动对这种情况发出「续写」的指令。
  - 手动操作没啥技术含量，这种重复操作的事情应该交给 RPA 机器人，而你去验收生成的内容。
- 'no': 9
  name: 合规与风控 —— 让AI内容“活得久”
  points:
  - '**为什么需要这个概念？**'
  - '- 风水命理等敏感领域内容易触发平台敏感词，面临删除、封号风险'
  - '- 版权灰色地带（AI同人周边、声音克隆）存在法律合规隐患'
  - '- 缺乏系统性的合规话术与内容承载方案，普通人难以在敏感赛道长期生存'
  - '**核心定义**'
  - '- 针对高风险领域，采用“AI生成合规方案+飞书外部托管规避正文审核+引流分发”的双重保障策略，确保内容长期可用'
  - '**关键性质**'
  - '- 双重保障：正文洗白+外链承载，核心干货迁移至飞书等受审核干扰较小的外部载体'
  - '- 话术替换：利用AI生成学术化包装、心理咨询框架，规避封建迷信等敏感标签'
  - '- 风控红线：出版物许可证、虚拟商品打击、季节性波动等合规底线不可逾越'
  - '**典型例子**'
  - '- 风生水起/6+2卦玄学内容规避敏感词审核'
  - '**边界条件**'
  - '- 模型训练与使用仍可能存在侵权风险，需自担法律责任'
  - '- 平台风控升级后，灰产工具（群禁言插件等）极易失效，生命周期短'
  sources:
  - paper: docs/202306/20230613_204.md
    role: origin
  - paper: docs/202306/20230613_209.md
    role: extend
  excerpts:
  - 内容敏感词太多，大家移步飞书吧
  - '[看 chatgpt 怎么分析：风生水起，6+2 卦玄学方面怎么规避敏感被删除封号](https://und276ymfr.feishu.cn/docx/KKACdp31KoAyyuxTpHEcA3a2nhd)'
  - '书香 : 这个怎么能保证训练的模型不会侵权'
