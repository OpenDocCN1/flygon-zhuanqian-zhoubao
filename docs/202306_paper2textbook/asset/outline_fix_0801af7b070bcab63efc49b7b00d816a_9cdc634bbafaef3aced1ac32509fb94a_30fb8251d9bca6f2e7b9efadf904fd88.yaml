- 'no': 6
  name: AI 写作赛道：从“投喂指南”到“内容工厂”的产业化跃迁
  desc: 梳理 ChatGPT 写作进化链：单点投喂（PDF/网页/表格/风格模仿） -> 结构化角色提示词模板 -> 对标拆解分步生成法 -> 投喂爆款反推指令沉淀
    -> RPA+AI 内容工厂（不求质量/流量/结果，只求询盘转化） -> SEO 关键词套娃霸屏与厂家人设 IP 打造。
  role: method
