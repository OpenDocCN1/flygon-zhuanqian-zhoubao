'no': 1
name: AI 赋能副业实战 —— 从工具调用到商业闭环的进阶之路
desc: 本章系统梳理 2023 年上半年生成式 AI 爆发期的典型副业实战案例，覆盖 AI 绘画、AI 写作、AI 编程、AI 视频、AI 语音等五大赛道，从“单点工具技巧”进阶至“标准化工作流
  SOP”，再到“商业变现模型设计”与“规模化放大策略”，旨在帮助普通人跨越“会用工具”到“做成生意”的鸿沟。
nodes:
- 'no': 1
  name: AI 副业入门的认知门槛与机会窗口
  desc: 确立 AI 赋能普通人变现的核心逻辑：AI 首先淘汰高薪专业人士，普通人凭借低机会成本与工具杠杆拥有历史性红利窗口；副业本质是信息差与工具杠杆的双重套利。
  role: motivation
  src:
  - paper: docs/202306/20230627_090.md
  - paper: docs/202306/20230613_027.md
  - paper: docs/202306/20230627_094.md
- 'no': 2
  name: 生态位定位法：你是生产者、消费者还是服务商？
  desc: 引入生物学“生态位”概念，划分甲方（平台方）、乙方生产者（提效降本）、乙方消费者（学习提效/转型）、第三方服务商（解决痛点赚快钱）四大角色，指导学员按身份匹配变现路径，避免跨位盲目试错。
  role: method
  src:
  - paper: docs/202306/20230627_094.md
- 'no': 3
  name: 异常值案例库：捕捉 AI 变现早期信号的方法论
  desc: 放弃 MECE 体系化分类，转用“异常值观察法”收集边缘高收益案例（证件照 P 图、MJ 定制手机壳、画师获客、技术视觉化、涂鸦定制），以灵感启发替代深度复盘，降低捕捉商业早期信号的认知成本。
  role: method
  src:
  - paper: docs/202306/20230613_029.md
  - paper: docs/202306/20230627_095.md
- 'no': 4
  name: AI 绘画赛道：从 Midjourney 到 Stable Diffusion 的落地进阶
  desc: 覆盖 MJ 提示词结构化（摄影写法/工艺品写法/品牌组合）、ControlNet 15 模型全景掌握、Lora 炼丹双核范式、SD 换装过拟合策略，构建从“出图”到“可控生产”再到“商品级交付”的完整技能树。
  role: method
  src:
