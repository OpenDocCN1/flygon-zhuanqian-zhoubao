- 'no': 9
  name: AI 视频与多模态工作流：从单工具到工具链组合拳
  desc: 串联 ChatGPT(故事/脚本) + Midjourney(关键帧) + LeiaPix(2D 转 3D) + 剪映(后期合成) 标准化 SOP；进阶至
    ChatGPT+RPA+剪映“内容工厂 1.0/2.0”批量视频生产线，实现关键词卡位、测品、本地化素材升级的低成本试错闭环。
  role: method
  src:
  - paper: docs/202306/20230613_207.md
  - paper: docs/202306/20230627_092.md
- 'no': 10
  name: AI 语音与声音克隆：技术门槛消解与版权边界
  desc: 以“AI 孙燕姿”现象为背景，拆解 So-VITS-SVC 一站式整合包（环境+模型+教程）降低门槛路径，验证“零基础跑通全流程”可行性，同时揭示模型训练侵权风险与合规边界。
  role: experiment
  src:
  - paper: docs/202306/20230613_209.md
- 'no': 11
  name: 私有化部署与 ToB 变现：数据隐私时代的核心护城河
  desc: 论证私有化部署是大模型落地刚需（GDPR/数据安全法驱动），基于开源基座（LLaMA）+ 高质量指令微调（ShareGPT GPT-4 子集清洗+LIMA/Vicuna
    范式）可低成本复现 ChatGPT 级能力；中文场景受限于基座能力需等待中文基座开源，短期切入出海英文 ToB 窗口期（~6 个月）。
  role: method
  src:
  - paper: docs/202306/20230613_208.md
  - paper: docs/202306/20230613_126.md
- 'no': 12
  name: RPA+X 模式：核心技能嫁接热点的极速 MVP 变现范式
  desc: 提炼“RPA+X”可复用商业模型：核心技能 A（RPA）稳定，嫁接热点 X（加好友/ChatGPT/小红书）快速组合；交付“思路×流程×自动化”三位一体方案而非单一工具；敢于高客单价收费（1980
    元/3 节课）筛选优质客户，私域精准收割实现一周 7 万营收。
  role: method
  src:
  - paper: docs/202306/20230613_212.md
- 'no': 13
  name: 提示工程进阶：社会学想象力迁移的六重境界
  desc: 将赵鼎新社会学方法论迁移为提示词工程分级标准：语境完备化 -> 维度化比较分析 -> 竞争性假设列举 -> 隐含假设批判 -> 负向问题诊断 ->
    双重重要性案例定标，实现从“会提问”到“会做研究式提问”的跃迁。
  role: extension
  src:
  - paper: docs/202306/20230627_024.md
- 'no': 14
  name: 知识管理新范式：个人 AI 知识库与插件生态融合
  desc: 基于 ChatGPT Plugins + FastAPI + OpenAI Embedding + 向量数据库搭建低成本（3.7k 中文两分钱）个人知识库，利用插件生态实现检索结果的上下文二次交互（联网/代码执行/跨插件梳理），打破传统工具“预设框架”限制。
  role: method
  src:
  - paper: docs/202306/20230613_128.md
  - paper: docs/202306/20230613_014.md
- 'no': 15
  name: 合规与风控：敏感领域内容生存法则与平台规则红线
  desc: 针对风水命理等高风险领域，确立“AI 生成合规方案 + 飞书外部托管规避正文审核 + 引流分发”双重保障策略；直播话术接入官方预审标准与第三方敏感词查询工具双重扫描；版权灰色地带（AI
    同人周边、声音克隆）需自担风险。
  role: limitation
  src:
  - paper: docs/202306/20230613_204.md
  - paper: docs/202306/20230627_097.md
  - paper: docs/202306/20230613_172.md
  - paper: docs/202306/20230613_209.md
- 'no': 16
  name: 规模化放大的组织与技术瓶颈：从“赚第一桶金”到“稳定现金流”
  desc: 揭示放大期核心矛盾：生产端（招人/RPA）与获客端（面试 SOP 化/客服分离）必须动态平衡，避免单边失控崩盘；RPA 技术易寻但“靠谱长期维护开发者”极度稀缺；低门槛赛道（MJ
    共享账号、AI 绘本）极易陷入价格战，生命周期仅 3-6 个月，需及时转型高客单价产品（高阶课程/私有化部署/品牌 IP）。
  role: limitation
  src:
