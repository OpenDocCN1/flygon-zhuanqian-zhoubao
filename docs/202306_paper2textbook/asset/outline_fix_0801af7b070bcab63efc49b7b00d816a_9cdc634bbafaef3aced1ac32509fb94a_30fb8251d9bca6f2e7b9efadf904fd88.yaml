- 'no': 5
  name: AI 绘画变现三大范式：头像壁纸号、同人周边、POD 定制
  desc: 拆解头像壁纸号“三大变现模型+精准起号四步法+三大爆款关键词体系”，漫展 AIGC 同人周边“灰色地带高毛利+志愿者 NPC 机制”，MJ+POD
    手机壳“零库存供应链打通”，形成可复制的商业闭环。
  role: experiment
