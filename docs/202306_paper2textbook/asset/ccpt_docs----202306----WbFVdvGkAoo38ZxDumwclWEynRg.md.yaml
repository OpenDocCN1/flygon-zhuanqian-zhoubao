paper: docs/202306/WbFVdvGkAoo38ZxDumwclWEynRg.md
desc: 该素材是一篇面向零基础用户的《瞬息全宇宙——穿越之旅》视频制作实操教程，核心讲解如何利用 Stable Diffusion 的 Deforum 插件，通过关键帧提示词调度、3D
  运镜参数控制及初始化图像引导，制作出画面持续演变的“穿越之旅”风格 AI 视频，并覆盖了模型选择、提示词工程、时长计算、剪映后期合成及预设管理的全流程标准化操作指南。
concepts:
- name: 瞬息全宇宙视频分类体系
  desc: 将‘瞬息全宇宙’视频明确划分为‘穿越之旅’（场景持续演变、镜头运动）与‘平行宇宙’（固定轮廓换风格）两大技术路线，并指出两者工具链截然不同（Deforum
    vs Runway），纠正了网络上混淆两者制作方法的普遍误区。
  is_original: true
  excerpt:
  - 瞬息全宇宙分两种：一种是【穿越之旅】，另一种是【平行宇宙】
  - “穿越之旅”就是这种画面不断变化，变成新场景，看起来像一个穿越旅途一样的视频
  - “平行宇宙”就是固定着原来的照片轮廓，变成不一样的风格的视频
  - 制作穿越之旅，用到的是Stable Diffusion里面的deforum插件；制作平行宇宙，用到的则是一个叫runway的网站里的功能
- name: Deforum 关键帧提示词调度机制
  desc: 'Deforum 通过 JSON 格式的关键帧提示词（帧号: 提示词）实现视频内容的时序控制，系统在关键帧之间自动插值过渡，实现从主体 A 到主体
    B 的连续画面演变，这是‘穿越之旅’视频内容生成的核心逻辑。'
  is_original: false
  excerpt:
  - 我们可以看到一行就是一张照片的提示词，把四张照片的提示词放到一起，出来的视频就是从一张照片演变成另一张照片的过程
  - 这里的数字代表的是照片的帧数... '0'代表的就是一开始的照片：一束花，'30'代表的是第30帧照片：一个漂亮的女孩
  - 所以第0~30帧就是一束花变成一个漂亮女孩的过程
- name: Deforum 3D 运动参数关键帧控制
  desc: '在 Animation Mode 为 3D 时，通过平移 X/Y/Z 及 Rotation 3D X/Y/Z 参数的关键帧设定（格式：帧号: (数值)），实现视频镜头的
    3D 空间运动（平移、缩放、旋转），是赋予视频‘大师级’动态感的核心手段。'
  is_original: false
  excerpt:
  - 先把动画模式设置成‘3D’，右边的参数设置成‘wrap’
  - 当括号里面的数值大于0的时候，视频镜头向右移动；当括号里面的数值小于0的时候，视频镜头向左移动
  - '写出来就变成：0: (2),60:(-2)'
  - 平移 Y 大于0向上，平移 Z 大于0放大，Rotation 3D X 大于0从远到近旋转...
- name: 初始化图像引导生成
  desc: 利用 Deforum 的 Init Image 功能，输入指定图片作为第 0 帧起始帧，配合第 0 帧仅写质量提示词的策略，强制视频从用户指定的具体画面开始演变，实现‘定制开头’的可控生成。
  is_original: false
  excerpt:
  - 还有一种更有趣的玩法就是给视频加一张开头的照片，这样后续的视频就会根据我们给的这张照片继续演变成下一张照片
  - 勾选‘使用初始化’，然后把刚刚复制的文件地址粘贴到‘初始化图像’的文本框里面
  - 因为我们已经给了一张初始照片，就不用再去描述一个画面了，所以这里可以填上一些照片质量的提示词
- name: 视频时长帧率计算公式
  desc: 建立 Max Frames（最大帧数）、FPS（帧率）、Duration（时长）三者的数学映射关系：时长 = 最大帧数 / FPS，指导用户根据目标时长反推关键帧分布与总帧数设置。
  is_original: false
  excerpt:
  - 最大帧数设置成200，FPS的参数设置为15... 那我们的视频时长就是：200÷15=13.33秒
  - 比如我想要一条30秒左右的视频，30×15=450，那我的最大帧数就要设置成450帧
- name: 提示词结构化模板
  desc: 提出‘主体+主体细节+周围环境+画风’的四要素提示词编写模板，并强调全局正/负向提示词与关键帧提示词的分工协作机制，降低用户提示词工程门槛。
  is_original: true
  excerpt:
  - 其实写提示词也是有模板的：主体+主体的细节+周围环境+画风
  - 正向提示词就是你希望视频会出现的东西...作用到整个视频的；反向提示词就是你不希望照片会出现的东西...作用到整个视频的
methods:
- name: __overview__
  desc: 基于 Stable Diffusion + Deforum 插件的‘穿越之旅’视频标准化生产流水线：环境部署与模型适配 -> 关键帧提示词编排 ->
    3D 运镜参数设计 -> 初始化图像可选注入 -> 参数预设复用 -> 剪映实拍素材与 AI 生成片段拼接合成。
  excerpt:
  - 想要快速生成一个视频其实只有两步：1.安装插件 2.写提示词
  - 其他所有的设置都只是为了让这个视频更加的有趣，比如：增加视频时长、制作视频运镜、定制开头、做网上的爆款视频
  - 在剪映导入一段有趣的视频...点击‘帧定格’...‘导出静帧照片’...按照文章第七部分去生成出来一段视频...把开头和AI生成的视频拼到一起、加上BGM
- name: Deforum 插件安装与版本兼容性修复流程
  desc: 通过 SD WebUI 扩展面板在线安装 Deforum，并通过手动拷贝专用模型文件至 models/Deforum 目录解决报错；提供升级 SD
    版本或降级 Deforum 版本两种解决 UI 缺失的兼容性修复方案。
  excerpt:
  - 打开SD，在状态栏里面点击‘扩展’ -> ‘可下载’ -> ‘加载扩展列表’ -> 搜索‘Deforum’ -> ‘安装’
  - 下载网盘里面的《1.deforum模型》，复制里面的两个文件到SD文件夹，放到‘models’里面的‘Deforum’文件夹
  - 如果重启之后还是没有Deforum的界面... 1.升级SD版本 2.降低deforum版本
- name: 关键帧提示词 JSON 编写规范
  desc: 定义 Deforum 提示词输入的严格语法规范：外层大括号包裹、键为帧号整数、值为双引号包裹的英文提示词字符串、行尾逗号分隔（末行除外）、全英文标点符号，保障解析无报错。
  excerpt:
  - 这里一定一定要注意格式！！！ 1.所有的提示词都在{ }里面 2.前面的数字代表的是照片的帧数 3.每一行的提示词都要在“ ”里面 4.每一行最后要有一个逗号（最后一行不用）
    5.所有符号都是英文状态下输入的
- name: 3D 运镜关键帧参数编排法
  desc: 采用‘起始帧设定初始运动向量 -> 中间帧变更/归零运动向量’的分段关键帧策略，通过正负数值控制 6 维自由度（XYZ 平移 + XYZ 旋转），实现复杂镜头轨迹的可视化编程。
  excerpt:
  - '默认状态下的参数是：0:(0)... 比如现在我想让视频镜头前半段向右移动，后半段向左移动，那就是从第0帧开始，速度为2向右移动，一直向右移动直到第60帧，变成速度为2的向左移动，写出来就变成：0:
    (2),60:(-2)'
  - '如果说现在镜头从第0帧开始一直向右运动，运动到一半我想让镜头定住不动了，写出来就变成：0: (2),60:(0)'
- name: 实拍素材‘帧定格-抽帧-接驳’合成法
  desc: 利用剪映‘帧定格’功能冻结实拍视频关键帧 -> ‘导出静帧’获取首帧图像 -> 输入 Deforum 作为初始化图像生成 AI 续写视频 -> 回剪映替换冻结段落并拼接
    AI 视频 -> 添加 BGM 导出，实现真实到虚拟的无缝转场。
  excerpt:
  - 在剪映导入一段有趣的视频... 点击工具栏里面的‘帧定格’... 点击播放器的右上角的三条杠 -> ‘导出静帧照片’
  - 接下来就按照文章第七部分去生成出来一段视频... 把刚刚定格的那段视频和后面那段删掉，只保留开头，把开头和AI生成的视频拼到一起，加上BGM
- name: Deforum 参数预设持久化管理
  desc: 利用 Deforum 界面右下角‘储存设置’生成 JSON 预设文件，下次使用时通过‘载入所有设置’粘贴文件路径一键恢复全参数配置，解决重复配置繁琐问题。
  excerpt:
  - 设置完参数之后，点击右下角的‘储存设置’... 等到下一次需要用这个预设的时候，找到这个文件夹，鼠标右键点击文件，然后复制文件地址... 粘贴到右下角的文本框，点击‘载入所有设置’
theorems:
- name: 工具路线匹配原则
  desc: 制作‘穿越之旅’必须使用 Stable Diffusion + Deforum（本地部署、关键帧调度、3D 运镜）；制作‘平行宇宙’必须使用 Runway
    Gen-1/Gen-2（云端、风格迁移、轮廓保持）。两者技术原理、工具链、适用场景互不兼容，混用必然导致失败。
  excerpt:
  - 制作穿越之旅，用到的是Stable Diffusion里面的deforum插件；制作平行宇宙，用到的则是一个叫runway的网站里的功能
  - 两种视频都叫‘瞬息全宇宙’，但做法是完全不同的... 网络上很多文章，其实都没搞懂两者的区别就教别人做了，甚至很多是教大家用做‘穿越之旅’的方式去做‘平行宇宙’的效果，结果最后观众其实做不出自己心中想要的效果
- name: 提示词决定上限，运镜决定质感
  desc: 关键帧提示词决定了视频‘演变什么内容’（内容上限），3D 运动参数决定了视频‘怎么演变、好不好看’（观感质感）；提示词过简单会导致画面单调，无运镜则呈现静态幻灯片感，二者缺一不可。
  excerpt:
  - 不管是做图还是做视频，最重要的就是提示词，只有通过提示词告诉SD我们脑海里的想法，才能生成出来想要的视频
  - 前面我们生成出来的照片都是固定在一个视角的... 我们可以通过设置参数让视频跟着我们设置的参数动起来，让视频变得更加有趣
  - 现在出来的视频效果还比较差，因为我们的提示词输入的太过于简单了... 而且要配合上视频运镜才会出来好的效果
- name: 初始化图像锚定起点理论
  desc: 提供初始化图像可将生成过程的起点锚定在用户指定的具体像素分布上，第 0 帧提示词仅需描述质量风格而非内容，从而实现‘指定首帧 -> 自由演变’的可控生成，是定制化视频制作的关键技术。
  excerpt:
  - 还有一种更有趣的玩法就是给视频加一张开头的照片，这样后续的视频就会根据我们给的这张照片继续演变成下一张照片
  - 因为我们已经给了一张初始照片，就不用再去描述一个画面了，所以这里可以填上一些照片质量的提示词
- name: 预设复用效率最大化原则
  desc: Deforum 参数量大、依赖性强、重启丢失，必须建立‘配置一次、预设保存、路径加载’的标准化复用机制，将单次配置成本摊销至零，是批量化、系列化生产的前提。
  excerpt:
  - 大家可以看到deforum里面可以设置的参数很多，而且每一次重新打开SD都要重新去设置，非常麻烦
  - 所以大家可以在第一次设置完参数之后，把它保存成预设，之后每一次要应用的时候就可以直接使用预设了
findings:
- name: 推荐模型实证结论
  desc: '[evidence] 作者通过实测筛选，确定特定大模型（文中展示缩略图的模型，已打包放入网盘）在 Deforum 视频生成任务中效果最优，其他模型易出现效果不佳问题，降低了用户选型试错成本。'
  excerpt:
  - 在我自己试验下来发现有些大模型出来的视频效果是不太好的，目前来说，照片里的这个模型做这种特效视频出来的效果是最好的（模型已经放在网盘啦！）
- name: 通用正负向提示词配方实证有效
  desc: '[evidence] 作者提供的一套通用正向提示词和极长的负向提示词（含 DeepNegative、解剖修正、水印去除等），经实测能显著提升整条视频的画质稳定性、解剖正确度及美感，可直接复用无需调整。'
  excerpt:
  - 为了让视频出来的质量更高，我们还可以输入一些正向提示词和反向提示词... 这里的正反向提示词是作用到整个视频的
  - 正向提示词：Highest quality, masterpieces, extreme detail, 8K, HD qualit
  - 反向提示词：nsfw, nude,(worst quality:2), (low quality:2)... bad anatomy, bad hands,
    missing fingers... watermark, text, error
- name: 采样器与步数最佳实践实证
  desc: '[evidence] 经实测，DPM++ 2M Karras 采样器在质量与速度间平衡最优；迭代步数 20-25 适合低配显存，25-30 适合高配，超过
    30 步边际收益递减且显著拖慢生成速度。'
  excerpt:
  - 首先是采样器，比较常用的就是图片框起来那个（DPM++ 2M Karras），出图质量比较高，而且速度也比较快
  - 电脑配置稍微低一点的就设置在20~25，电脑配置比较好的就可以设置在25~30之间，但是不要超过30步，不然出视频会很慢
- name: 分辨率预设适配主流平台规范
  desc: '[evidence] 512x512 (1:1) 适配通用正方形；576x1024 (9:16) 适配抖音/短视频竖屏；1024x576 (16:9)
    适配横屏视频，三套分辨率预设覆盖主流发布场景，避免拉伸变形。'
  excerpt:
  - 宽度512*高度512出来的就是正方形的视频
  - 9：16的竖屏视频可以设置成 宽度576*高度1024
  - 16：9的横屏视频可以设置成 宽度1024*高度576
- name: 版本不兼容导致 UI 缺失的双路修复实证
  desc: '[evidence] 当 SD 重启后 Deforum 标签页消失时，根因为 SD 核心版本与 Deforum 扩展版本不匹配；实测‘升级 SD
    稳定版’或‘降级 Deforum 扩展版本’均能恢复 UI，提供了可落地的故障恢复方案。'
  excerpt:
  - 如果重启之后还是没有Deforum的界面，那是因为SD和deforum的版本不适配
  - 有两种解决办法，选一个就行：1.升级SD版本... 2.降低deforum版本
