  name: 普通人切入 ChatGPT 赛道的‘利基-能力-复杂度’三角铁律
  desc: 筛选方向需同时满足：有市场需求、强依赖 OpenAI 能力、工程复杂度在个人可控范围（Niche利基、信息差、认知差）。
