- 'no': 1
  name: 认知觉醒与财富跃迁 —— 从“打工思维”到“商业认知”的底层逻辑重构
  desc: 本章通过分析普通人从月薪几千到年入百万的真实案例，揭示财富增长的核心不在于勤奋，而在于认知模式的根本性跃迁：从出卖时间换取线性收入，转向构建产品化能力、利用杠杆放大价值、掌握稀缺资源与制定规则的四阶段进化路径。
  nodes:
  - 'no': 1
    name: 打工致富的不可能性与“血酬”陷阱
    desc: 企业本质是帮助无法直连市场的个体完成交易的中介，薪资经层层筛减后所剩无几；出卖时间健康换取的线性收入（血酬）缺乏杠杆，将被AI彻底取代。
    role: motivation
    src:
    - paper: docs/202306/20230613_177.md
    - paper: docs/202306/20230613_182.md
  - 'no': 2
    name: 财富获取的四阶段跃迁模型：从廉价零件到高维整合者
    desc: 个人财富模式进化路径：出卖时间/劳动力 → 产品/服务变现（超级个体） → 商业系统杠杆（资源构建者） → 多系统整合（高维整合者），每阶段核心能力与护城河迭代升级。
    role: definition
    src:
    - paper: docs/202306/20230613_177.md
    - paper: docs/202306/20230613_182.md
  - 'no': 3
    name: 专长与媒体杠杆：指数级财富效率的核心公式
    desc: 财富效率跃迁依赖‘专长’作为支点、‘媒体/产品杠杆’作为放大器；AI时代大幅降低代码/内容生产门槛，普通人可构建零边际成本复制的商业系统。
    role: method
    src:
    - paper: docs/202306/20230613_177.md
    - paper: docs/202306/20230613_101.md
  - 'no': 4
    name: 稀缺社会资源与规则制定者：从守擂到攻擂再到坐庄
    desc: 财富本质是持续从社会提取剩余；掌握‘稀’（总量有限）且‘缺’（刚需必不可少）的资源可获租金；最高阶是建立生态制定规则（庄家），实现赢家通吃与自复制滚雪球效应。
    role: extension
    src:
    - paper: docs/202306/20230613_182.md
  - 'no': 5
    name: 认知觉醒五维重构：钱的本质、富人思维、低认知清洗、资源积累、反节省时间
    desc: 普通人变现的前置条件是完成底层认知重构：钱是交换价值而非存量；模仿有钱人底层逻辑；去除消耗资源型做事；积累复利资产（技能/IP/系统）；敢于在高杠杆活动上投入时间而非省时间。
    role: method
    src:
    - paper: docs/202306/20230613_100.md
  - 'no': 6
    name: 扬长避短的优势变现策略：利用核心优势而非补齐短板
    desc: 个人商业成功取决于核心优势项（如学习、思维、成就）的极致发挥，而非劣势项（如取悦、沟通）的平庸修补；通过优势测评定位，转向高杠杆赛道实现快速变现。
    role: method
    src:
    - paper: docs/202306/20230613_100.md
  - 'no': 7
    name: 时间作为终极生产资料的四大成本模型
    desc: 时间是生产的基础要素；出售时间（销售原材料）效率极低；通过‘生产、再生产、学习、销售’四大时间成本评估商业模型，再生产时间成本趋近零（写书、直播、代码）是实现财富自由的关键路径。
    role: definition
    src:
    - paper: docs/202306/20230613_101.md
  - 'no': 8
    name: 挖井隐喻与三位一体致富法：专注深耕×持续学习×运气捕捉
    desc: 赚钱如挖井，前期需在单一地点长时间深挖（专注深耕），中途频繁换地必无水；出水瞬间短（暴富快），但前置沉淀极长；成功=（专注×时间+学习迭代）×运气捕捉。
    role: method
    src:
    - paper: docs/202306/20230613_258.md
  - 'no': 9
    name: 从‘三无小白’到‘变现上岸’：结构化实战训练的0-1突破路径
    desc: 即使无IP、无内容、无产品的普通人，只要接入成熟实战陪伴体系（如‘航海’），遵循‘边做边学、专项学习’流程执行，即可跑通商业闭环并实现首笔变现。
    role: method
    src:
    - paper: docs/202306/20230627_053.md
  - 'no': 10
    name: 普通人应对AI挑战的核心逻辑：认知升级与工具杠杆
    desc: 面对生成式AI浪潮，普通人生存策略非对抗技术，而是提升认知维度、掌握AI工具链（ChatGPT、Midjourney等），将‘时间’转化为‘产品’，实现从消费者到生产者的身份跃迁。
    role: motivation
    src:
    - paper: docs/202306/20230613_261.md
  - 'no': 11
    name: 目标强度三层级：从‘想要’到‘必须要’的动力跃迁
    desc: 将做事动机划分为‘想要’（愿望）、『一定要’（决心）和『必须要’（背水一战）三个递进层级，唯有『必须要』的非达标誓不罢休心态才能成就大事。
    role: definition
    src:
    - paper: docs/202306/20230613_175.md
  - 'no': 12
    name: 内生自信与逆风破局：自信是由内而外散发的状态
    desc: 自信并非外部赋予，而是内在状态；缺乏内在自信时，所有方向的风都是逆风。建立内生自信是应对不确定性的核心变量。
    role: motivation
    src:
    - paper: docs/202306/20230613_175.md
  - 'no': 13
    name: 破圈向上生长的标杆复制-超越法
    desc: 识别高手/头部标杆 → 解构行动路线与商业模式 → 照单全收式模仿（抄） → 基于自身禀赋迭代优化（超）；主动加入认知对立面社群，理解反对者底层逻辑打破信息茧房。
    role: method
    src:
    - paper: docs/202306/20230613_175.md
    - paper: docs/202306/20230613_184.md
  - 'no': 14
    name: 双圈理论：认知圈的持续外扩与可能性探索
    desc: 认知结构由内层‘认知圈’（已知/舒适区）和外层‘更大认知圈’（未知/成长区）组成，个人成长的本质是不断将内圈向外扩展以探索更多可能性。
    role: definition
    src:
    - paper: docs/202306/20230613_175.md
  - 'no': 15
    name: 信任推荐机制与无我利他：基于真诚的长久连接
    desc: 基于真诚与信任建立的推荐关系最为长久；践行‘无我利他’（不计算直接回报的利他），最终受益最大的反而是自己。
    role: extension
    src:
    - paper: docs/202306/20230613_175.md
  - 'no': 16
    name: 人生三元协同论：事业、健康、家庭的正向飞轮
    desc: 事业、健康、家庭并非零和博弈，而是相辅相成、相互赋能的系统性关系，需整体统筹。
    role: extension
    src:
    - paper: docs/202306/20230613_175.md
  - 'no': 17
    name: 道法术器分阶侧重：阶段性单点突破建立专业护城河
    desc: 道（原则）、法（方法论）、术（技巧）、器（工具）四个维度均重要，但人生不同阶段应有侧重地深耕某一维度，建立核心专业度，形成不可替代性而非平庸全能。
    role: method
    src:
    - paper: docs/202306/20230613_175.md
  - 'no': 18
    name: 焦虑必然性与动力转化：不焦虑才不正常，接纳焦虑做燃料
    desc: 只要追求成长/财富/突破现状，焦虑即为必然内在痛苦（亿万富翁也天天焦虑）；不应消除焦虑，而应接纳并转化为促使向上行动的动力；情绪-思想-行动框架：先接纳情绪、再审视思想、最后落地行动。
    role: motivation
    src:
    - paper: docs/202306/20230613_176.md
  - 'no': 19
    name: 独自创业者的孤独管理：主动连接+内心对话
    desc: 孤独源于决策独特性与风险独自承担，外部社交只能缓解症状；核心在于建立‘与自己对话’的内心秩序，寻找极少数‘同频人’深度连接；组建‘独自做项目互助群’/‘夸夸群’缓解心理压力。
    role: limitation
    src:
    - paper: docs/202306/20230613_176.md
    - paper: docs/202306/20230613_260.md
- 'no': 2
  name: 商业模式设计与顶层架构 —— 从“赚第一桶金”到“年入千万”的系统化构建
  desc: 本章系统拆解从0到1跑通商业闭环、从1到10规模化放大、从10到100组织化扩张的三阶段方法论，核心在于产品选择、利润结构、流量获取、组织架构与资本运作的顶层设计，而非单纯的执行勤奋。
  nodes:
  - 'no': 1
    name: 商业模式公式与三要素：利润 = (收入-成本) × 频次 × 周期
    desc: 好的商业模式即赚钱、高频、可持续；需从人力/资金/智力三类成本中找到自身可控优势，定位平台-内容-运营三要素中的‘运营’角色，实现效率提升变现。
    role: definition
    src:
    - paper: docs/202306/20230613_007.md
  - 'no': 2
    name: 千万商业模式三支柱：好产品、高利润、上规模
    desc: 年入千万需满足：产品定生死（好卖、高客单、高毛利）、利润空间巨大（信息差碾压、赚有钱人零花钱）、规模可放大（人的规模裂变+钱的规模付费流量），缺一不可。
    role: definition
    src:
    - paper: docs/202306/20230613_254.md
  - 'no': 3
    name: 裂变式阿米巴组织模型：产品矩阵+分销团队+付费流量+人才孵化
    desc: 突破超级个体300万天花板的组织化方案：阶梯客单产品矩阵（99-99999）→ 阿米巴分销团队裂变 → 付费流量招募合伙人加速 → 从合伙人筛选人才开发新品，形成自我进化飞轮。
    role: method
    src:
    - paper: docs/202306/20230613_254.md
  - 'no': 4
    name: 三阶段发展模型：0-1死磕单项目、1-10同平台矩阵复制、10-100老板打天下员工守天下
    desc: 垂直电商卖家成长铁律：0-1阶段跑通单店盈利模型；1-10阶段在同平台复制店铺矩阵放大流量（经验复用、SOP标准化）；10-100阶段老板亲自研判新平台/新品类（打天下），员工执行SOP（守天下），接受账号存活率的概率分布特性。
    role: method
    src:
    - paper: docs/202306/20230627_066.md
  - 'no': 5
    name: 长线业务与品牌资产沉淀：业务-品牌-个人IP三层级容错策略
    desc: 持续盈利的确定性锚点是长线业务（核心能力标准化+短长周期产品矩阵）；受阻时退而做长线品牌（业务可变品牌不变）；再退而做个人品牌（产品皆变IP不变），确保每一份付出可积累、可复利。
    role: extension
    src:
    - paper: docs/202306/20230613_255.md
  - 'no': 6
    name: 代运营2.5模式：连接2.0传统商家向3.0认知商业转型的中介层
    desc: 核心价值在于用新商业认知替代传统商家低效自我摸索，采用‘轻资产主体公司+深度利益捆绑合伙人+项目独立核算+知识壁垒积累’架构，仅赚取‘从1到10’的效率提升收益，实现现金流安全与规模扩张并行。
    role: method
    src:
    - paper: docs/202306/20230613_007.md
    - paper: docs/202306/20230613_178.md
    - paper: docs/202306/20230613_250.md
  - 'no': 7
    name: 生意本质三维模型：满足个体/群体/标准化需求的差异化交易策略
    desc: 生意本质是通过交易满足他人需求。按需求对象分为：满足个体需求（高客单价智力/金钱交易）、满足群体需求（解决认知焦虑的知识付费）、满足标准化需求（传统红海标品）。个人应构建三位一体组合模式实现动态平衡。
    role: definition
    src:
    - paper: docs/202306/20230627_004.md
  - 'no': 8
    name: 知识付费的焦虑变现本质与产品设计原则
    desc: 知识付费贩卖‘确定感’而非‘能力’，用户为‘不再困惑’付费；产品设计应聚焦‘消除困惑’而非‘承诺结果’，通过持续内容输出建立信任资产实现复购转化。
    role: method
    src:
    - paper: docs/202306/20230627_004.md
  - 'no': 9
    name: 乙方转甲方/合伙人增量模式：绑定优质甲方共享增长红利
    desc: 高阶智力型从业者应摒弃纯乙方外包，转而绑定优质甲方核心业务，以智力深度介入‘增量创造’，共享期权/分成/高薪等增长红利，实现单位时间收益最大化。
    role: method
    src:
    - paper: docs/202306/20230627_004.md
  - 'no': 10
    name: 红海赋能无效定理与赋能陷阱识别
    desc: 为存量竞争红海市场提供标准化运营赋能，边际收益递减且风险高；被赋能主体缺乏护城河，赋能方难以分享超额利润，陷入‘帮人数钱’的低价值循环，应避免深度介入。
    role: limitation
    src:
    - paper: docs/202306/20230627_004.md
  - 'no': 11
    name: 商业进化三阶段论与认知红利：3.0时代核心能力是认知
    desc: 将商业社会演进分为：1.0鸡毛换糖(低效)、2.0商铺模式(供给丰富/职业商家)、3.0知识模式(供给过剩/渠道复杂/需求多元/认知为核心)；从2.0到3.0转型需经历2.5代运营阶段，认知差是唯一确定性收益来源。
    role: definition
    src:
    - paper: docs/202306/20230613_007.md
    - paper: docs/202306/20230613_178.md
  - 'no': 12
    name: 赚劳动力的钱是劣质模式，赚效率提升的钱才是良性模式
    desc: 商业模式优劣判断标准在于价值来源：若通过压榨员工薪资盈利，模式必不可持续；良性模式应让利于合伙人、让利于商家，自身仅取‘提升效率’的中介费/分成。
    role: theorem
    src:
    - paper: docs/202306/20230613_178.md
  - 'no': 13
    name: 代运营公司的护城河是‘知识壁垒’而非‘客户资源’
    desc: 传统服务商依赖客户关系护城河易被替代；通过项目实战沉淀‘行业认知(方法论)’和‘人力资源(合格合伙人)’，将服务过程标准化、知识化，形成难以复制的结构性优势。
    role: theorem
    src:
    - paper: docs/202306/20230613_178.md
- 'no': 3
  name: 流量获取与私域转化实战 —— 从“公域种草”到“私域成交”的标准化作业流程
  desc: 本章聚焦小红书、抖音、视频号、闲鱼、拼多多等主流平台的流量获取、内容生产、引流转化、私域承接全链路SOP，强调选品决定上限、素材决定下限、投流只是放大器，以及低成本矩阵化操作与高客单价私域成交的组合拳打法。
  nodes:
  - 'no': 1
    name: 平台算法底层逻辑与信任智能投放：曝光分配与排序决定的双权模型
    desc: 电商平台仅掌握曝光分配与排序决定权，目标函数为最大化GMV与用户留存；新人应无脑选择‘系统智能投放’而非人工定向，给算法24小时探索时间，信任算法比人更懂用户。
    role: definition
    src:
    - paper: docs/202306/20230613_256.md
    - paper: docs/202306/20230613_280.md
  - 'no': 2
    name: 小红书电商冷启动SOP：权重诊断→爆款选款→测款放量→六维去重→诱饵定价→评论造势
    desc: 账号权重分级（<几十注销、200+正常、1000+高权重）→ 爆款复发定律（历史爆款再爆概率高）→ 测款先行（低频测选题/形式）→ 六维去重组合拳（画中画+滤镜+调参+镜像+抽帧+挡脸）→
      优惠券诱饵定价（高标价+大额券引爆首单→爆款后取消优惠回归利润）→ 评论区运营战术（买家秀自问自评+争议话题+限时福利）。
    role: method
    src:
    - paper: docs/202306/20230613_288.md
  - 'no': 3
    name: 抖音图书带货投流闭环：随心推养模型+千川高峰起量+数据反推出价+正负反馈博弈
    desc: 随心推24h智能投放养模型（自动出价+ROI目标+容亏心态）→ 千川高峰期一键起量（早6-7/中11-12/晚8点前30分钟开启，2-6小时）→
      随心推数据反推千川出价（平均客单价×佣金率→过新手期÷1.2）→ 正负反馈博弈（降价=负反馈需配合加预算=正反馈，确保正>负）→ 点击不转化素材直接废弃换新。
    role: method
    src:
    - paper: docs/202306/20230613_280.md
  - 'no': 4
    name: 闲鱼二手书项目：资质门槛建立护城河+宏观需求驱动+标准化运营SOP
    desc: 出版物经营许可证为核心准入壁垒；大学教材管控放开、大学生接受度提升、消费降级三重驱动需求增长；选品定生死、基本功扎实（号/图/文/价）、做平台鼓励的事（降价/优详情/任务/服务）、运气不好多试几次（下架重发）、卖出别惹事（控纠纷/重好评）。
    role: method
    src:
    - paper: docs/202306/20230613_256.md
