paper: docs/202306/20230613_128.md
desc: 该素材是一篇实操教程，介绍如何利用 ChatGPT 网页端插件功能、OpenAI Embedding API 与向量数据库、FastAPI 搭建低成本、高灵活性的个人
  AI 知识库系统，文章分为技术原理解析（含流程图）与实践搭建两部分，强调该方案成本极低（3.7k 中文约两分钱）且能充分利用 ChatGPT 网页端插件生态进行上下文二次交互。
concepts:
- name: 个人 AI 知识库系统
  desc: 基于大语言模型与向量检索技术，将用户私有文档转化为可对话查询的知识库，解决传统知识管理工具框架僵化、灵活性不足的问题。
  is_original: false
  excerpt:
  - 搭建一个属于自己的 AI 知识库系统
  - 这些工具要求我们按照预设的框架去整理信息，而这些框架可能并不完全符合我们的需求，缺乏足够的灵活性。
  - 这些模型具备精确理解自然语言的能力，就像拥有了一个为你量身定制的助手，帮你处理整理信息。
- name: ChatGPT 网页端插件架构
  desc: 利用 ChatGPT 官方插件机制作为前端交互入口，调用后端自建的 FastAPI 服务完成向量化与检索，实现知识库与大模型对话能力的融合。
  is_original: true
  excerpt:
  - 基于 ChatGPT 网页端插件搭建知识库
  - 在 ChatGPT 网页端，你可以对数据库提取出来的上下文进行再次提问，这样可以充分利用网页端的功能，做更多的事，比如结合其他插件对你的知识库结构做更细致的梳理
- name: 向量映射/Embedding 存储流程
  desc: 将文档文本通过 OpenAI 官方 Embedding API 转换为向量并存入向量数据库，作为知识库检索的核心数据基础。
  is_original: false
  excerpt:
  - 首先，你需要将你的文档或文本，通过官方的向量映射语言模型转换成向量，并存到向量数据库中。
  - 会给你提供一个 fastapi 服务，这个服务可以支持你将你的文档内容或者文本，以 api 的形式发起请求，请求向 OpenAI 的大模型调用向量映射大模型，做好了向量转换后，会自动向你的量数据库进行存储
- name: 低成本知识库构建
  desc: 强调该方案边际成本极低，仅需支付 Embedding API 费用，无需昂贵的模型微调或自建 GPU 集群。
  is_original: true
  excerpt:
  - 成本极低：只需花费一点点费用就能处理大量的文字信息（我计算了下，3.7k 的中文字，两分钱）而后续的步骤，只需要支付词向量映射的费用，可以说是相当良心了。
methods:
- name: __overview__
  desc: 整体方法论分为两阶段：第一阶段技术原理深度解析（含流程图），第二阶段手把手实践搭建；技术栈为 ChatGPT Plugins + FastAPI +
    OpenAI Embedding API + 向量数据库。
  excerpt:
  - 第一部分，我将通过深入解析技术原理来让大家理解其背后的运行机制，为了方便大家理解，我画了详细的解析图
  - 第二部分则是实践环节，我们将一步一步搭建你的知识库系统。
  - 会给你提供一个 fastapi 服务，这个服务可以支持你将你的文档内容或者文本，以 api 的形式发起请求，请求向 OpenAI 的大模型调用向量映射大模型，做好了向量转换后，会自动向你的量数据库进行存储
- name: FastAPI 中间层服务搭建
  desc: 部署 FastAPI 服务作为 ChatGPT 插件的后端接口，封装 OpenAI Embedding API 调用与向量数据库读写操作，提供文档入库与检索接口。
  excerpt:
  - 会给你提供一个 fastapi 服务，这个服务可以支持你将你的文档内容或者文本，以 api 的形式发起请求，请求向 OpenAI 的大模型调用向量映射大模型，做好了向量转换后，会自动向你的量数据库进行存储
  - 我的教程中，在第一节画了流程图，你可以看下，第二节有 fastapi 的操作图 GIF，可以结合着看下哈~
- name: ChatGPT 插件调用与上下文二次交互
  desc: 在 ChatGPT 网页端安装插件，对话时插件自动检索知识库返回上下文，用户可基于返回上下文继续追问或结合其他插件深度加工。
  excerpt:
  - 在 ChatGPT 网页端，你可以对数据库提取出来的上下文进行再次提问，这样可以充分利用网页端的功能，做更多的事，比如结合其他插件对你的知识库结构做更细致的梳理
theorems:
- name: 大模型重塑知识管理范式
  desc: 大语言模型的自然语言理解能力打破了传统知识管理工具‘预设框架’的限制，实现了‘量身定制’的灵活信息整理，是构建个人知识库的核心使能技术。
  excerpt:
  - 这些工具要求我们按照预设的框架去整理信息，而这些框架可能并不完全符合我们的需求，缺乏足够的灵活性。
  - 但是现在，有了以 OpenAI 为代表的语言模型，一切都有了新的可能。这些模型具备精确理解自然语言的能力，就像拥有了一个为你量身定制的助手，帮你处理整理信息。
- name: ChatGPT 插件生态是知识库落地的最佳前端
  desc: 相比于自建前端界面，接入 ChatGPT 网页端插件体系可零成本获得成熟对话交互界面，并能复用插件生态（联网、代码执行等）对检索结果进行二次加工。
  excerpt:
  - 基于 ChatGPT 网页端插件搭建知识库有两大优势：
  - 在 ChatGPT 网页端，你可以对数据库提取出来的上下文进行再次提问，这样可以充分利用网页端的功能，做更多的事，比如结合其他插件对你的知识库结构做更细致的梳理
