learning_targets:
- 理解优势-项目匹配度的核心定义与资源盘点方法
- 掌握极速闭环与最小可行性验证的0-1执行路径
- 掌握技术杠杆与工具链对边际成本趋零的放大逻辑
- 理解社群杠杆对认知边界与情感支撑系统的双重赋能
- 掌握公私域联动从‘圈人-养鱼-收网’的全链路转化模型
- 掌握蓝海定位与信息差挖掘的非标准化渠道与判断标准
- 理解执行力与复盘闭环对新人穿越认知鸿沟的决定性作用
- 识别平台风控、红利窗口期关闭等关键局限与避坑信号
- 理解组织化放大的0-1、1-10、10-100三阶段增长模型
- 能结合个人禀赋选择适合的副业赛道并跑通首单闭环
concept_map:
- 新人副业核心困境
- ├── 基础概念：眼睛会了，手不会（认知与执行的双重鸿沟） —— docs/202306/20230613_016.md
- ├── 关键障碍：隐性操作知识（养号、平台违规边界） —— docs/202306/20230613_016.md
- └── 突破路径：下场实操、失败复盘、正向反馈循环 —— docs/202306/20230613_016.md, docs/202306/20230613_169.md
- 优势-项目匹配度
- ├── 基础概念：技能、资源、性格偏好盘点 —— docs/202306/20230613_016.md
- ├── 判断标准：相对优势 + 可承受成本 —— docs/202306/20230613_016.md
- └── 决策模型：历史航海手册复盘法、避坑盲目跟热门 —— docs/202306/20230613_016.md
- 极速闭环与MVP验证
- ├── 基础概念：最短路径跑通首单变现 —— docs/202306/20230613_169.md
- ├── 方法：人工/半自动/现成源码二开验证付费意愿 —— docs/202306/20230613_011.md
- └── 核心主张：先跑通再优化，失败即学费 —— docs/202306/20230613_016.md, docs/202306/20230613_011.md
- 技术杠杆与工具链
- ├── 基础概念：代码/RPA/API/AI实现边际成本趋零 —— docs/202306/20230613_011.md
- ├── 应用：易语言/RPA自动化注册充值发货 —— docs/202306/20230613_011.md
- ├── 应用：ChatGPT/SD/Midjourney内容生产矩阵 —— docs/202306/20230613_016.md
- ├── 应用：本地生活矩阵1人管500号 —— docs/202306/20230613_013.md
- └── 边界：模式不成立则亏损更快；灰产有封禁风险 —— docs/202306/20230627_048.md
- 社群杠杆
- ├── 基础概念：付费社群的外挂大脑（认知层+情感层） —— docs/202306/20230613_012.md
- ├── 载体：精华帖、航海手册、领队陪跑 —— docs/202306/20230613_012.md
- ├── 边界：主动参与度决定杠杆大小；白嫖者仅见冰山一角 —— docs/202306/20230613_012.md
- └── 典型：大学生两周变现1w+；三名大学生跑通拉新Top5 —— docs/202306/20230613_169.md, docs/202306/20230613_196.md
- 公私域联动
- ├── 基础概念：公域圈人、私域养鱼、自动收网 —— docs/202306/20230613_011.md
- ├── 钩子：免费资料、体验装、低价课、实用工具 —— docs/202306/20230613_011.md
- ├── 原则：精准度优于数量；全链路SOP可复制 —— docs/202306/20230613_011.md
- └── 案例：公众号吸粉6万半年变现40万；全职妈妈累计260万稿费 —— docs/202306/20230613_142.md
- 蓝海定位与信息差挖掘
- ├── 基础概念：搜索量低但付费意愿强、竞争弱 —— docs/202306/20230613_011.md
- ├── 渠道：百度下拉框、竞品负面评价、知乎冷门问题、社群风向标 —— docs/202306/20230613_011.md
- ├── 核心主张：视角一变，商机无限 —— docs/202306/20230613_011.md
- └── 边界：窗口期48-72小时；需平衡天花板与竞争度；合规框架内挖掘 —— docs/202306/20230613_197.md
- 执行力与复盘闭环
- ├── 基础概念：行动换确定性，复盘攒经验 —— docs/202306/20230613_169.md
- ├── 方法：三层目标分层、关键路径锁定、批量化处理 —— docs/202306/20230613_195.md
- ├── 方法：打卡双轨制、URL规律自动化工具 —— docs/202306/20230613_195.md
- └── 案例：同时推进11个航海项目；抖音失败与小红书成功对比复盘 —— docs/202306/20230613_195.md, docs/202306/20230627_011.md
- 局限与避坑
- ├── 风控：账号环境、内容重复度、引流行为触发限流/封号 —— docs/202306/20230627_013.md
- ├── 红利窗口：平台补贴、内容缺口、竞争度低形成的短期机会 —— docs/202306/20230627_013.md
- ├── 模式失效信号：流量断崖、竞品涌入、价格战、规则收紧 —— docs/202306/20230627_013.md
- └── 案例：情感文ECPM低月入200元；风向标千人下场客单价崩至9.9元 —— docs/202306/20230627_048.md, docs/202306/20230627_009.md
- 组织化放大
- ├── 基础概念：0-1验证模型 → 1-10标准化复制 → 10-100平台化合伙 —— docs/202306/20230627_013.md
- ├── 杠杆：信息差、人才资源、资本资源 —— docs/202306/20230627_013.md
- ├── 标准化：销售SOP + 人才培养SOP双轨并行 —— docs/202306/20230627_013.md
- ├── 激励：利润分红、虚拟股权、实股绑定核心人才 —— docs/202306/20230627_013.md
- └── 案例：私域团队500+人年零售额破亿；AIGC漫展单场2-20万 —— docs/202306/20230627_013.md, docs/202306/20230613_172.md
life_analogy:
- 想象优势-项目匹配度是**为工具找到合适的螺丝孔**：
- '- **技能/资源/性格** = 你手里的工具箱'
- '- **项目赛道** = 待装配的设备'
- '- **匹配度** = 工具与螺丝孔的紧密程度'
- '- **试错成本** = 强行用错工具导致螺丝滑丝的损耗'
- '- **正向反馈** = 设备运转后传来的顺畅运转声'
- 就像安装家具前先盘点工具，再选择匹配的零件，副业入场前也要先盘点自己的禀赋，选择相对优势赛道。
- 想象极速闭环是**学游泳的第一次下水**：
- '- **理论教程** = 陆地上看的游泳动作分解图'
- '- **隐性操作知识** = 水下的浮力感、呼吸节奏、呛水后的应对'
- '- **首单变现** = 第一次不用教练扶着游到对岸'
- '- **正向反馈** = 成功到岸后的成就感与自信心'
- 光看游泳书不会游泳，必须跳进水里呛几口水，才能掌握隐性技能并建立自信。
- 想象公私域联动是**钓鱼与养鱼的组合**：
- '- **公域流量** = 湖里的野生鱼群（数量多但不属于你）'
- '- **钩子** = 饵料（免费资料、低价课等筛选工具）'
- '- **私域池塘** = 你自建的鱼塘（微信、社群）'
- '- **标准化交付** = 按时投喂、分级养殖'
- '- **复购/转化** = 池塘里的鱼持续产出价值'
- 湖里钓鱼不稳定，把鱼引入自己的池塘精心饲养，才能稳定收网。
summary:
- concept: 新人副业核心困境
  desc: 眼睛看懂了不等于手会了，需通过下场实操跨越认知与执行的双重鸿沟。
- concept: 优势-项目匹配度
  desc: 入场前盘点技能资源与性格偏好，选择相对优势赛道以降低试错成本。
- concept: 极速闭环与MVP验证
  desc: 用最低成本跑通获客-转化-交付，以真实订单验证付费意愿后再自动化放大。
- concept: 技术杠杆与工具链
  desc: 用代码/RPA/AI替代重复劳动，使边际成本趋近于零，实现规模化放大。
- concept: 社群杠杆
  desc: 借助精华帖、航海手册与情感支撑，压缩学习曲线并降低信息筛选成本。
- concept: 公私域联动
  desc: 公域引流筛选高意向用户，沉淀私域后用标准化SOP与自动化交付完成转化。
- concept: 蓝海定位与信息差挖掘
  desc: 寻找需求力大于竞争力的细分需求，利用非标准化渠道捕捉被忽略的商业信号。
- concept: 执行力与复盘闭环
  desc: 立即行动对冲认知不足，定期复盘将失败经验沉淀为可迁移能力。
- concept: 局限与避坑
  desc: 识别平台风控、红利窗口期关闭等信号，提前避坑高于盲目执行。
- concept: 组织化放大
  desc: 经0-1验证后，通过销售SOP、人才SOP与利益分配机制实现从个人英雄主义到平台化运营。
exercises:
- 'no': 1
  title: 优势资源盘点与赛道匹配
  contents:
  - 请列出你目前拥有的：擅长技能（如写作、编程、绘图）、可支配时间（每周小时数）、启动资金（元）、人脉资源、以及‘不讨厌且愿意为之熬夜的事’。
  - 根据上述清单，列出3个与你高度匹配的副业赛道，并简要说明匹配理由（不需要给出具体答案，只需列出思考框架）。
  - 回答问题：
  - '- 如果你属于社恐人格，应避开哪类高社交强度的项目？'
  - '- 为什么说‘相对优势’比‘绝对热爱’更适合新人入场？'
- 'no': 2
  title: 极速闭环首单模拟
  contents:
  - 选择一个你感兴趣的低门槛副业项目（如公众号热点写作、无货源电商等），设计一个用最低成本跑通‘获客-转化-交付’的7天计划：
  - 1. 第1-2天：信息源甄选与项目信息确认
  - 2. 第3-4天：人工或半自动方式获取首批种子用户
  - 3. 第5天：完成首单交付并收款
  - 4. 第6-7天：复盘隐性坑点与正向反馈
  - 回答问题：
  - '- 为什么说首单变现比市场调研更准确？'
  - '- 如果商业模型本身不成立，极速闭环会带来什么风险？'
- 'no': 3
  title: 社群信息差捕捉与低成本试错
  contents:
  - 进入一个付费或免费的行业社群，连续观察7天，完成以下动作：
  - 1. 记录社群中出现的至少3条‘不起眼的信号’（如某篇文章角落提到的竞品动态、未中标的风向标等）
  - 2. 选择其中1条信息，用不超过200元的成本进行模拟执行验证
  - 3. 记录执行过程中的隐性坑点（如平台限流、养号要求等）
  - 回答问题：
  - '- 什么样的信息才算‘风向标’而非单纯的噪音？'
  - '- 新人在试错阶段应如何控制单次投入的上限？'
