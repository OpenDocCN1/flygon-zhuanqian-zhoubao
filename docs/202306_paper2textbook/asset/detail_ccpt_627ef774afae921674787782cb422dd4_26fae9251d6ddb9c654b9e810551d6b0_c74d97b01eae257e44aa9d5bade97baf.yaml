units:
- 'no': 1
  name: 小红书电商红利期 —— 打破品牌垄断的机会窗口
  points:
  - '**为什么需要这个概念？**'
  - '- 传统电商（淘宝/京东/拼多多）已高度饱和，普通人难以短期突围'
  - '- 小红书电商尚未形成品牌垄断，玩法百花齐放，处于政策宽松期'
  - '- 进入规范期前存在结构性机会窗口，错过将面临指数级更高成本'
  - '**核心定义**'
  - '- 小红书电商红利期指平台尚未形成品牌垄断、算法鼓励新号、商家入局门槛低的时间窗口'
  - '**关键性质**'
  - '- 无品牌垄断：头部效应弱，小账号仍可通过优质内容获得推荐'
  - '- 未进入规范期：平台稽查宽松，为普通人试错提供容错空间'
  - '- 高转化率：种草型消费决策链路短，不货比三家，笔记爆则单爆'
  - '**典型例子**'
  - '- 小红书2023年推出笔记带货分销功能，扶持自营店铺，成为电商红利核心信号'
  - '**边界条件**'
  - '- 红利期会随平台政策收紧和商家涌入而逐渐衰减，需尽早入场占位'
  sources:
  - paper: docs/202306/20230613_050.md
    role: origin
  - paper: docs/202306/20230613_227.md
    role: apply
  excerpts:
  - 首先，它没有形成品牌垄断，其次，没有形成固定打法，正处于玩法的百花齐放状态，最后，没有进入规范期，稽查也比较宽松。这三个点加起来，意味着普通人现在入场，有大把的肉可以吃。
- 'no': 2
  name: 漏斗式选品法 —— 从宏观赛道锁定微观爆品
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人资源有限，盲目跟风头部品类易陷入红海竞争'
  - '- 需要一套可量化、可复现的选品标准，避免主观臆断导致选品失败'
  - '- 快速筛选出个人能力匹配的蓝海单品，降低试错成本'
  - '**核心定义**'
  - '- 漏斗式选品法是一套分层选品方法论：先通过宏观分析（GMV分级、粉丝门槛、价格带、品类分布、价格区间打分）锁定赛道，再通过微观分析（笔记制作成本、账号运营成本、启动资金、利润核算、竞争度）验证单品可行性'
  - '**关键性质**'
  - '- 宏观分析决定赛道天花板与新手友好度，万级赛道（1w-9w GMV）对新手最友好'
  - '- 微观分析决定单品利润率，成本核算是选品执行的标准化表单'
  - '- 价格带与带货难度正相关，建议新人锁定0-100元，尤其是50元以下区间'
  - '**典型例子**'
  - '- 手机壳品类按10元阶梯分档，17.9-27.9元（2档）综合得分最高，成为实测最优价格带'
  - '**边界条件**'
  - '- 选品目标必须与个人/团队现有能力（内容制作、资金、时间、供应链）匹配，避免眼高手低'
  sources:
  - paper: docs/202306/20230613_050.md
    role: origin
  excerpts:
  - 结合前面的宏观+微观，从赛道到产品，这一套操作下来，我把它叫做：漏斗式选品法。
  - 宏观，就是开启上帝视角，从 GMV 窥探赛道天花板，可以分为三档：百万赛道（100w+）、十万赛道（10w-99w），和万级赛道（1w-9w）。
- 'no': 3
  name: 小红书无货源模式 —— 零库存赚取信息差
  points:
  - '**为什么需要这个概念？**'
  - '- 普通人缺乏囤货资金与供应链资源，传统电商门槛过高'
  - '- 需要一种低启动成本、轻资产、可快速试错的电商模式'
  - '- 利用平台信息差与跨平台价差，无需发货即可赚取中间利润'
  - '**核心定义**'
  - '- 小红书无货源模式是指不囤货、不发货，通过1688/拼多多等平台一件代发，在小红书发布带货笔记引导下单，赚取售价与进货价差价的商业模式'
  - '**关键性质**'
  - '- 开店门槛极低：个人店免保证金，仅需身份证即可注册'
  - '- 轻运营：适合单人或小团队，核心动作是选品、发笔记、测数据'
  - '- 高试错成本分散：可通过多号矩阵增加爆款概率，单号失败不影响整体'
  - '**典型例子**'
  - '- 饰品类目：1688进货6.3元（含邮费），小红书售价48元，单品利润41.7元，单款总利润超32万元'
  - '**边界条件**'
  - '- 当前平台已收紧分销权限，自营店铺+矩阵带货成为主流正解，随意带别人货路径受限'
  sources:
  - paper: docs/202306/20230613_052.md
    role: origin
  - paper: docs/202306/20230613_050.md
    role: apply
  excerpts:
  - 我们在 1688 找了货源渠道，任选一家，一件代发包含邮费成本大约 6.3 元一单，然而它在小红书卖到了 48 元一单，这个一单的利润是：48-6.3=41.7
  - 目前，小红书电商的团队有 5 个人，每月纯利在 30W 以上，光是这个项目就充分说明了，人员在精不在于多，轻模式，轻运营，稳打稳扎
- 'no': 4
  name: 爆款笔记伪原创 —— 混剪与MD5去重
  points:
  - '**为什么需要这个概念？**'
  - '- 小红书去重算法升级，直接搬运图文视频易被判定非原创并限流'
  - '- 普通人无法高成本实拍，需要低成本、可批量的内容生产方式'
  - '- 需要在规避平台风控的前提下，复制验证过的爆款结构'
  - '**核心定义**'
  - '- 爆款笔记伪原创是指通过视频混剪去重（分割、打乱顺序、转场、画中画、比例调整）和图片MD5修改（滤镜调色、消除笔去水印、贴纸遮挡），使搬运内容通过平台原创检测的技术操作'
  - '**关键性质**'
  - '- 视频去重核心在于结构性修改，而非简单滤镜或换BGM'
  - '- 图片MD5修改可通过滤镜直接改变哈希值，配合贴纸遮挡实现“原创”判定'
  - '- 二创混剪单条视频制作成本可控制在5-10分钟，支持规模化量产'
  - '**典型例子**'
  - '- 将3-5个同款竞品视频混剪，生成新视频发布，适合个人非全职运营者起店'
  - '**边界条件**'
  - '- 平台去重能力持续升级，低成本内容形态（如拼图）已被淘汰，需向更高技术门槛（抠图、混剪、养号）迁移'
  sources:
  - paper: docs/202306/20230613_150.md
    role: origin
  - paper: docs/202306/20230613_052.md
    role: apply
  excerpts:
  - 正确的步骤是：首先进行分割，然后打乱顺序，打乱顺序之后，再进行转场特效处理，处理完转场之后，再加画中画，透明度可以设置为 1 左右，这就是一个比较完整的处理步骤。
  - 先对图片加一层滤镜，简单调一下色彩的明艳度，别小看这个操作，这个操作可以直接改掉图片的 MD5 值，改完之后，这就是一张全新的图片。
- 'no': 5
  name: 账号权重冷启动 —— 历史爆款去重养号
  points:
  - '**为什么需要这个概念？**'
  - '- 新号初始流量极低，直接发带货笔记容易被系统判定为营销号'
  - '- 需要在不承担商业风险的前提下，快速建立账号垂直标签与权重'
  - '- 为后续爆款笔记获得更高初始流量池分配打基础'
  - '**核心定义**'
  - '- 账号权重冷启动是指新号在不开店、不带货的情况下，发布去重后的历史爆款笔记（3-5天，日更3-5条），将单条阅读量养至200-500+，作为后续带货的流量基础'
  - '**关键性质**'
  - '- 探针笔记500播放量为账号健康分水岭：连续3次低于500判定为死号，建议注销重注册'
  - '- 历史爆款具有周期性，旧选题在新账号、新时间节点经去重发布仍可触发推荐算法'
  - '- 高权重账号发布同质内容获推概率指数级高于低权重账号'
  - '**典型例子**'
  - '- 检索3-12个月前垂直领域爆款笔记，改文案、换封面、调音乐后发布，单日3-5条，3-5天完成账号标签构建'
  - '**边界条件**'
  - '- 若连续10条笔记阅读量不过百，账号废弃率极高，应及时重置而非盲目养号'
  sources:
  - paper: docs/202306/20230613_152.md
    role: origin
  - paper: docs/202306/20230613_149.md
    role: apply
  excerpts:
  - 前期可以不开通店铺...搜集小红书内容素材，找到去年爆款笔记或者三个月前的爆款笔记，来去重，用做提升账号权重使用
  - 最后，如果发这个流量都没超过 500，那么确定账号有问题，抓紧注销重来（如果不确定，可以连续发 3 次，3 次都在 500 以内，那就是有问题）
- 'no': 6
  name: 私域引流与高客单转化 —— 从收藏夹到公众号中转
  points:
  - '**为什么需要这个概念？**'
  - '- 小红书严打直接留联系方式，私信/评论区硬广易触发限流封号'
  - '- 需要一种高安全性、低风险的公域到私域导流路径'
  - '- 高客单产品（如知识付费、疗愈服务）依赖私域信任建立完成转化'
  - '**核心定义**'
  - '- 私域引流与高客单转化是指利用小红书“收藏夹/笔记收藏”作为间接跳板，引导用户关注公众号，再通过公众号自动回复或菜单栏导入微信私域，完成高客单价产品转化的闭环体系'
  - '**关键性质**'
  - '- 收藏夹引流属于平台原生高权重功能，伪装成正常用户交互行为，安全系数高（自评90/100）'
  - '- 免费内容（如虚拟资料包）充当信任桥梁，用户观察内容数天后主动付费，转化率远超硬推'
  - '- 私域转化漏斗：公域内容做钩子→引导收藏→收藏夹/笔记放联系方式→私域承接与内容信任转化'
  - '**典型例子**'
  - '- 塔罗项目私域转化率达20-40%，金钱疗愈赛道4000粉丝变现20万'
  - '**边界条件**'
  - '- 需持续优化引导话术以规避“重复检测机制”，同类方法泛滥后边际收益会递减'
  sources:
  - paper: docs/202306/20230613_145.md
    role: origin
  - paper: docs/202306/20230613_153.md
    role: apply
  excerpts:
  - 给大家分享一个不起眼却很安全的小红书引流技巧...这个引流技巧已经用有五个多月了，经过了时间的磨合和平台的考验。依然稳固
  - 小红书群里有三四百人，引流到微信平均每 5 个人中，就有 1-2 个人成交。
- 'no': 7
  name: 广告商单变现 —— 逆向品牌决策链路与定价艺术
  points:
  - '**为什么需要这个概念？**'
  - '- 粉丝量不等于广告收入，许多大号因缺乏商业变现逻辑而难以获单'
  - '- 需要理解品牌方寻找达人的标准化流程，从而反向布局内容获客'
  - '- 掌握动态定价与不违和植入，是知识IP类博主实现可持续变现的关键'
  - '**核心定义**'
  - '- 广告商单变现是指博主基于品牌方“搜索关键词→筛选人设→数据验证”决策链路，逆向进行关键词/场景/人设布局，并通过三步动态定价与需求匹配植入，获取品牌广告合作费用的商业模式'
  - '**关键性质**'
  - '- 品牌投放遵循“头部少、腰部中、尾部/素人多”的金字塔结构，单号接单受限，需矩阵号覆盖不同层级突破天花板'
  - '- 报备广告走官方蒲公英平台，博主扣10%手续费；返点机制为隐性成本（20%-35%）'
  - '- 广告是否违和取决于{粉丝需求集合}与{产品满足需求集合}的交集是否为空，而非硬广/软广形式'
  - '**典型例子**'
  - '- 博主漫漫（32万粉）累计广告收益40万+，月均3-4万，验证了“逆向品牌决策链路+矩阵号+动态定价”组合拳的有效性'
  - '**边界条件**'
  - '- 地理位置（上海/杭州等一线城市）可带来品牌线下活动邀约的隐性溢价，区域差异影响变现上限'
  sources:
  - paper: docs/202306/20230613_224.md
    role: origin
  excerpts:
  - 我做过几个公司的商务（pr），寻找达人投放广告的方式其实很简单，就是：搜索自己公司产品的名称、相似产品的名称、使用方法、使用场景。
  - 一个标准：你的粉丝可能会需要你这个产品吗？他们关注你的需求，有可能是想要从你这里获得这个产品吗？如果答案肯定，那么广告随便写。
