paper: docs/202306/YebDdo1UvoFFQUxyIuucM6lLnTc.md
desc: 该素材是一份详细的知识付费产品发售复盘报告，记录了作者通过 3 天策划、5 天执行、2 天收款 54 万的完整实战过程。报告系统拆解了“渠道数据（器、用）”、“渠道路线图（术）”、“应用方法（法）”与“发售内参（道）”四个层面，重点揭示了如何利用“多米诺技法”串联
  4 篇公众号文章构建核心主线，配合朋友圈、社群、企业微信、视频号等多渠道协同，通过 AITDA 模型分层设计用户心理路径，并结合稀缺性、紧迫感、结果展示等营销手段，实现从预热、信任建立、筛选劝退到最终成交的全链路转化。
concepts:
- name: 发售四层模型（道法术器）
  desc: 作者将发售复盘拆解为四个维度：器（渠道基础数据与资产）、用（渠道发售后数据表现）、术（渠道路线图与内容节奏）、法（多米诺技法、B计划、营销套路）、道（多米诺原理、做局理念、AITDA模型），形成从战术执行到战略底层逻辑的完整认知框架。
  is_original: true
  excerpt:
  - '复盘内容比较多，方便阅读，我做了个目录


    ## 1.所有渠道数据（器、用）


    ## 2.渠道路线图（术）


    ## 3.应用方法（法）


    ## 4.发售内参（道）'
- name: 多米诺技法
  desc: 将发售流程拆解为环环相扣的 4 个关键节点（4篇文章），每个节点设计钩子链接下一节点，通过‘连环、叠加、节点’三要素，使心智影响力层层递增，最终推倒成交这块‘摩天大楼’。强调主线（公众号）与分支（朋友圈/群/企微/视频号）的协同关系。
  is_original: true
  excerpt:
  - 在上面视频的开头，推动最开始那块最小的骨牌，带动后面比他大一点的骨牌，这样一块一块的倒下去，最终能压倒移动摩天大楼，这里面包含了：连环，叠加，节点 三个元素
  - 我一共写了 4 篇文章，其实就是 4 块多米诺骨牌，第一块骨牌倒下去，把第二块骨牌也带动了，第一篇文章底部留的钩子就是链接第二篇文章的，依此类推，这四篇文章是有一条线连在一起的。
- name: AITDA 模型
  desc: 经典营销漏斗模型在发售中的双层应用：单篇文章内部遵循 AITDA 结构；整个 4 篇文章序列宏观上也遵循 AITDA 结构。即：Attention（抓住注意力/第一篇高数据标题）、Interest（激发兴趣/第二篇实时数据）、Trust（建立信任/第三篇背后故事劝退筛选）、Desire（刺激欲望/第四篇对赌协议权益）、Action（催促行动/发售收款）。
  is_original: false
  excerpt:
  - '需要用到 AITDA 模型


    A——attention 抓住注意力；


    I——interest 激发兴趣；


    T——trust 建立信任；


    D——desire 刺激欲望；


    A——action 催促行动。'
  - 每篇文章都是利用 AITDA 模型写的，4 篇文章也是利用 AITDA 模型设计的
- name: 做局理念（先胜后战）
  desc: 发售本质是一场‘局中局’，核心在于提前预判用户心理走向，设计好剧本与坑位，让用户按预设路径‘自动’走向成交。强调‘先胜后战’：在策划阶段（3天）完成所有逻辑推演与风险预案（B计划），执行期仅按图索骥。
  is_original: true
  excerpt:
  - 做局，是要在设计这场局的时候提前预判到用户的走向，就像行军打仗一样，做局是做诸葛亮，给敌人挖好坑，等着敌人往里跳，尽可能不废一兵一卒就让敌人投降。
  - 做局就是：先胜后战
- name: 抵扣券锚定策略
  desc: 设定高客单价（39800）配合高面额优惠券（1000元抵20000），利用价格锚定降低决策门槛，同时通过‘名额倒计时’制造稀缺与紧迫，实现低成本筛选高意向用户（付费
    1000 元即为强承诺）。
  is_original: true
  excerpt:
  - 透露最终价格为 3X980，释放一个买 1000 抵扣 20000 的抵扣券，在查看数据的展示屏幕上放抵扣券券倒数名额，增加紧迫感。
  - 名额稀缺性，说有 50 个名额，但是已经被内部学员订走了 30 个了，还剩下 20 个
methods:
- name: __overview__
  desc: 整体发售方法论：3天策划定剧本（设计多米诺节点、AITDA双层结构、B计划）→ 5天执行演剧本（预热→结果展示→信任建立/筛选→劝退/预告→正式发售/对赌）→
    2天收款。核心在于‘主线（公众号文章）+ 分支（多渠道协同）’的矩阵式运作，以‘数据实时公开’为信任基石，以‘抵扣券’为转化杠杆。
  excerpt:
  - 用了 3 天的时间策划了一个为期 7 天的发售方案，最终实现 2 天收款 54 万。
  - 这条主线就是公众号文章，其他的分支全部都是为主线做赋能的。
  - 预热期... 第一天... 第二天... 第三天... 第四天... 第五天... 6-13 收钱... 14 之后 结束
- name: 多米诺节点设计法
  desc: 将长周期发售拆解为 4 个关键内容节点（文章），每个节点包含：核心主题（钩子）、心智目标（AITDA对应阶段）、行动召唤（指向下一节点）、数据反馈机制。节点间通过‘底部钩子+
    次日群发/朋友圈强化’实现强链接。
  excerpt:
  - 第一篇：《流量复利系统》日增粉 200+，日赚 1000+ ... 文章底部引导加企业微信，告知用户第二天的内容是实时看数据
  - 第二篇：《流量复利系统》邀你查看实时收入数据 ... 透露最终价格为 3X980，释放一个买 1000 抵扣 20000 的抵扣券
  - 第三篇：《流量复利系统》日赚 1000+背后的故事 ... 做一下筛选，讲这个项目并不是那么容易，把头脑发热的拒之门外
  - 第四篇标题：《流量复利系统》对赌协议 目的：成交
- name: 全渠道协同放大法
  desc: 以公众号文章为核心主线，朋友圈做高频重复曝光与场景渲染，微信群做基础触达，企业微信做精细化分层运营（打标签、定向群发、自动回复），视频号直播做钩子释放与预约转化。各渠道内容同步、节奏对齐，形成包围圈。
  excerpt:
  - 主要看公众号的内容框架，朋友圈，企业微信，微信群，视频号都是围绕公众号文章这条主线做的分支。
  - 朋友圈主要是围绕公众号文章内容制作发布的，就是昨天公众号发的啥，今天就在朋友圈里重复发
  - 企业微信路线：群发，承接公众号引导流量，设计好自动回复话术。
  - 视频号直播：... 释放钩子，邀请预约第五天直播
- name: B计划兜底法
  desc: 发售前预设 A 计划（理想路径）与 B 计划（补救路径）。若某节点数据异常（如阅读低、转化差），立即启动 B 计划干预（如增加投流、调整文案、补充福利），待数据回归正常后切回
    A 计划；若全链路数据均差，则执行‘发售不卖产品’策略，转为纯分享活动保护品牌资产。
  excerpt:
  - 两个办法，一是永远有一套 B 计划，二是发售继续进行，但不卖产品。
  - 当自己设计的 A 计划执行后得到的结果不好时，要进行补救，当数据回归到正常后，再继续进行。
  - 如果所设计的流程每一环数据都很差，那就先把计划执行完，但是最后不卖，就当做一次分享活动
theorems:
- name: 发售成功 = 精心设计的剧本（多米诺/AITDA） + 多渠道协同执行 + 风险预案（B计划）
  desc: 发售不是靠运气或单一爆文，而是系统工程：底层逻辑用‘做局理念’预判人性，中层结构用‘多米诺技法’串联节点与‘AITDA模型’设计心理路径，执行层用‘全渠道协同’放大声量，安全层用‘B计划’兜底。核心主张：先胜后战，3天策划定生死。
  excerpt:
  - 做局就是：先胜后战
  - 每篇文章都是利用 AITDA 模型写的，4 篇文章也是利用 AITDA 模型设计的，所以才能取得这个成果。
  - 这条主线就是公众号文章，其他的分支全部都是为主线做赋能的。
- name: 信任建立的核心手段是‘实时数据公开’而非‘事后承诺’
  desc: 在知识付费高客单价场景中，通过搭建实时数据看板（第二篇文章核心内容），让用户随时随地验证收益真实性，视觉冲击力强于任何文案背书。这是‘Trust’阶段的关键破局点，直接支撑了后续抵扣券的高转化。
  excerpt:
  - 目的：建立信任，试探市场。用实时查看数据的方式让用户随时查看数据，视觉冲击感比较强。
  - 衔接的文章... 阅读量有两千七
- name: 劝退（筛选）是高客单价发售提升交付质量与口碑的必要环节
  desc: 第三篇文章主动‘讲项目不容易、劝退头脑发热者’，看似减少销量，实则筛选出真正有执行力的种子用户，降低售后压力，反而促使抵扣券购买人数从 17 升至
    35（仅退 2 单），证明‘反向筛选’能强化购买确定性。
  excerpt:
  - 目的：因为第二天，第三天的反馈很好，所以做一下筛选，讲这个项目并不是那么容易，把头脑发热的拒之门外
  - 数据：抵扣券退款 2 人，购买人数从 17 人升到了 35 人
findings:
- name: 小规模私域流量（~1.5万好友+几千公众号粉）可撬动百万级发售业绩
  desc: '[evidence] 作者仅凭订阅号（几千粉）、服务号（几百粉）、个人微信约 1.5 万好友（含重复）、企业微信 3000 余好友的基础流量池，通过
    5 天发售流程实现 2 天收款 54 万，验证了‘深度运营 > 广度流量’在高客单价知识付费中的有效性。'
  excerpt:
  - 5 个微信加起来大概 1.5W 流量（算上重复的流量）
  - 服务号基础粉丝 [图示粉丝数较少]
  - 最终实现 2 天收款 54 万
- name: 抵扣券（定金/资格券）模式显著提升成交转化率与客户质量
  desc: '[evidence] 第二天释放‘1000元抵20000优惠券’后，2天收到17个付款；第三天劝退后购买人数反增至35人，仅2人退款。说明‘付费筛选+大额抵扣’模式能有效过滤低意向用户，锁定高净值意向客户，为最终正式发售（第五天）铺垫高转化种子池。'
  excerpt:
  - 数据：2 天收到 17 个付款
  - 数据：抵扣券退款 2 人，购买人数从 17 人升到了 35 人（这是从第二天到第四天的所有付款）
- name: 视频号直播‘不讲干货、只放钩子、约正课’策略有效提升正式发售直播预约量
  desc: '[claim] 作者声称第二天至第四天每天开短直播‘不讲具体内容，释放钩子，邀请预约第五天直播’，配合公众号/朋友圈预告，为第五天正式发售直播蓄水。素材未给出具体预约人数或观看峰值数据，仅陈述执行动作。'
  excerpt:
  - 视频号直播：... 开一会直播，不讲具体内容，释放钩子，邀请预约第五天直播
  - 第五天：直播讲解
- name: 企业微信‘分层群发+标签运营’显著提升触达精准度与用户体验
  desc: '[evidence] 第一天群发给全量用户并打标签（回复关键词），第二天仅群发给‘打了标签’的高意向用户，第三天回复基础问题，第四天恢复全量群发文章。这种‘广撒网→筛选→精准触达→广撒网’的节奏，避免了骚扰低意向用户，同时确保核心信息触达高意向人群。素材展示了企业微信群发界面的‘已发送/已读/阅读率’数据界面，印证了执行细节。'
  excerpt:
  - 企业微信路线：群发第一篇文案，给回复用户打标签 | 群发文案（只群发给打了第一篇关键词的用户） | 回复基础问题 | 群发文章，所有用户都发
