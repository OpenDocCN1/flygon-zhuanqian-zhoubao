paper: docs/202306/20230613_038.md
desc: 该素材为作者杨留（IP：辞许）在知识星球/社群内分享的实战经验总结帖，核心内容为其基于15年互联网从业经历、定位南京、主营创业副业培训业务，专注微信私域内付费投流（公众号多IP、群推拼车投放），累计投放额超1000万的首次公开分享。文中提及投放形式已从公众号拓展至朋友圈、抖音等渠道，并附带完整文档链接供深度阅读。
concepts:
- name: 公众号多IP矩阵投放
  desc: 指通过运营多个公众号账号（IP）形成矩阵，作为付费投流的承接与分发载体，实现流量规模化获取与变现。
  is_original: false
  excerpt:
  - 公众号多 ip，群推付费投流
  - 公众号已经衍生到了朋友圈和抖音两个领域，拓宽了投放形式
- name: 群推/拼车付费投流
  desc: 一种微信私域特有的付费推广模式，即广告主付费购买社群推广（群推）或多个广告主拼车投放同一资源位，降低单次测试成本。
  is_original: false
  excerpt:
  - 群推付费投流
  - 这个拼车 21 年看到就觉得没什么机会了，没想到还可以有这么大金额的投放
- name: 微信私域内投放闭环
  desc: 作者核心业务模式，指完全在微信生态（公众号、社群、朋友圈、视频号/抖音导流）内完成从获客、转化到复购的投放闭环，不依赖公域广告平台（如巨量引擎、广点通）直接投放。
  is_original: true
  excerpt:
  - 专注微信私域内投放，累计超 1000 万投放额
  - 公众号已经衍生到了朋友圈和抖音两个领域
- name: 创业副业粉画像
  desc: 作者业务核心目标人群，具有高付费意愿、寻找副业项目、易通过培训/项目变现的创业者/副业人群属性。
  is_original: false
  excerpt:
  - 主营互联网创业副业类培训，大量创业副业粉丝
methods:
- name: __overview__
  desc: 作者构建的一套‘IP人设+多渠道矩阵+私域高客单价变现’的投放运营方法论：以个人IP（辞许/杨留）建立信任 -> 运营公众号矩阵+社群矩阵承接流量
    -> 采用群推/拼车形式低成本测试与放量 -> 将投放形式延伸至朋友圈、抖音等泛私域渠道 -> 最终转化至高客单价创业副业培训产品。
  excerpt:
  - 15 年入行互联网，定位南京，主营互联网创业副业类培训，大量创业副业粉丝，专注微信私域内投放，累计超 1000 万投放额。
  - 公众号已经衍生到了朋友圈和抖音两个领域，拓宽了投放形式
  - 全文阅读请移步金山文档：https://kdocs.cn/l/cj0RUPYRPNGF
theorems:
- name: 私域投放规模化可行性定论
  desc: 即便在公众号红利期过后（2021年后），通过多IP矩阵、形式衍生（朋友圈、抖音）及拼车机制，微信私域付费投流依然能跑出千万级投放规模且保持正ROI。
  excerpt:
  - 这个拼车 21 年看到就觉得没什么机会了，没想到还可以有这么大金额的投放。
  - 公众号已经衍生到了朋友圈和抖音两个领域，拓宽了投放形式
  - 累计超 1000 万投放额
- name: 投放形式迁移论
  desc: 成熟的私域投放模式具有跨平台迁移能力：公众号投放方法论可复用至朋友圈广告、抖音信息流/直播间导流等新渠道，实现投放版图的横向扩张。
  excerpt:
  - 公众号已经衍生到了朋友圈和抖音两个领域，拓宽了投放形式
- name: 小红书拼车非主流渠道判断
  desc: 针对创业副业粉赛道，小红书拼车投放虽存在但流量体量小、转化效率低，不适合作为主要投放渠道，仅作补充。
  excerpt:
  - '小红书拼车最近是不是也火 亦仁 : 小红书拼车最近是不是也火 yl 杨留 : 也属于投放形式的一种，但是小红书量小，不作为主要渠道'
findings:
- name: 千万投放规模验证
  desc: '[evidence] 作者实操累计投放额超过1000万元，验证了该模式在创业副业赛道的商业可行性与规模化潜力。'
  excerpt:
  - 专注微信私域内投放，累计超 1000 万投放额
- name: 单次拼车投放成本基准
  desc: '[evidence] 社群成员实测单次公众号拼车投放成本约350元/篇，为该渠道测试门槛提供定量参考。'
  excerpt:
  - '周彦充 : 我今天刚刚发了 1 篇，350 元。'
- name: 渠道拓展实证：朋友圈与抖音
  desc: '[evidence] 作者确认已成功将投放版图从公众号拓展至朋友圈广告及抖音平台，实现投放形式的多元化。'
  excerpt:
  - 公众号已经衍生到了朋友圈和抖音两个领域，拓宽了投放形式
- name: 小红书渠道低效实证
  desc: '[evidence] 实测小红书拼车投放流量体量小，作者明确表示不作为主要投放渠道。'
  excerpt:
  - 'yl 杨留 : 也属于投放形式的一种，但是小红书量小，不作为主要渠道'
