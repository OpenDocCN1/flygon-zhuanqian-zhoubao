paper: docs/202306/E7ZHdk5FzoyqmTxBrRjcIIR7n8e.md
desc: 该素材系统梳理了露营、园林、酒水三大行业的商标注册核心类别与关联类别，依据《类似商品和服务区分表》（尼斯分类）列出了各类别下的核心商品/服务群组及具体项目，为企业商标布局提供分类检索参考。
concepts:
- name: 商标分类布局策略
  desc: 基于尼斯分类体系，针对特定行业（露营、园林、酒水）识别核心注册类别（核心类别）及防御性/延伸注册类别（关联类别）的策略框架。
  is_original: true
  excerpt:
  - '### 常见行业，商品/服务分类选择'
  - '#### 核心类别：'
  - '#### 关联类别：'
- name: 核心类别
  desc: 指与该行业主营业务直接对应、必须优先注册的商标类别（如露营行业的第18/20/22/24/25类）。
  is_original: false
  excerpt:
  - '#### 核心类别：'
  - 第18类：1.登山杖1805；2.手杖1805...
  - 第25类：1.户外防风夹克2501...
  - 第20类：1.露营家具2001...
- name: 关联类别
  desc: 指与主营业务相关联、用于品牌防御、业务延伸或跨类保护的商标类别（如露营行业的第06/08/09/12/28/39/41/43/27/19类）。
  is_original: false
  excerpt:
  - '#### 关联类别：'
  - 第06类：1.金属制帐篷桩0603...
  - 第39类：1.摄影用无人机出租3904...
  - 第43类：1.露营场所住宿预订4301...
- name: 群组号
  desc: 商标分类表中细化至具体商品/服务的编码单位（如 1805、2501、2202），用于精确界定商标保护范围。
  is_original: false
  excerpt:
  - 1.登山杖1805；2.手杖1805；3.户外伞1804
  - 1.露营家具2001；2.露营桌2001
  - 1.遮蔽式露营袋2202；2.露营时铺地用防潮布2202
methods:
- name: __overview__
  desc: 采用行业场景映射法，将露营、园林、酒水三大产业链场景拆解为商品（第1-34类）与服务（第35-45类）两大维度，对照《类似商品和服务区分表》提取高频高核心群组，构建“核心类别+关联类别”双层级分类矩阵。
  excerpt:
  - '### 露营相关类别及商品

    #### 核心类别：

    第18类...第25类...第20类...第21类...第22类...第24类...第11类

    #### 关联类别：

    第06类...第08类...第09类...第12类...第28类...第39类...第41类...第43类...第27类...第19类'
  - '### 园林相关类别及商品

    第1类...第21类...第31类...第35类...第38类...第44类'
  - '### 酒水相关类别及商品

    第6类...第7类...第21类...第29类...第30类...第31类...第32类...第33类...第35类...第40类...第43类'
theorems:
- name: 露营行业商标全类覆盖主张
  desc: 露营产业链长、跨度大，需覆盖装备制造（第18/20/21/22/24/25类）、硬件工具（第06/08类）、电子设备（第09类）、交通工具（第12类）、娱乐服务（第28/41类）、运输旅行（第39类）、住宿餐饮（第43类）及地面材料（第19/27类）等17个大类，形成全链路保护。
  excerpt:
  - '### 露营相关类别及商品'
  - '#### 核心类别：第18类、第25类、第20类、第21类、第22类、第24类、第11类'
  - '#### 关联类别：第06类、第08类、第09类、第12类、第28类、第39类、第41类、第43类、第27类、第19类'
- name: 园林行业商品-服务双轨主张
  desc: 园林行业需同步布局化学制剂/种苗商品类（第1/31类）、器具容器类（第21类）、广告销售传播服务类（第35/38类）及园艺设计养护服务类（第44类），实现“货品+服务”双轨保护。
  excerpt:
  - '### 园林相关类别及商品'
  - 第1类：肥料、植物生长调节剂...
  - 第21类：花盆、园艺手套...
  - 第31类：植物、籽苗、鲜花...
  - 第35类：商业橱窗布置、在线广告...
  - 第38类：网络广播服务、视频会议...
  - 第44类：园林景观设计、园艺、花园护理...
- name: 酒水行业全产业链分类主张
  desc: 酒水行业需贯穿包装容器（第6/21类）、生产设备（第7类）、原料辅料（第29/30/31类）、成品酒核心类（第32/33类）、销售广告（第35类）、委托加工（第40类）、餐饮服务（第43类）全产业链分类。
  excerpt:
  - '### 酒水相关类别及商品'
  - 第6类：啤酒罐；第7类：酿葡萄酒用压榨机；第21类：酒杯、开酒器等；
  - 第29类：乳酒、浸酒的水果；第30类：含酒精的果汁刨冰；第31类：酿酒麦芽；
  - 第32类：啤酒；第33类：含酒精饮料（各种酒）；
  - 第35类：销售、广告；第40类：为他人酿酒、啤酒酿造；第43类：酒吧、酒馆
findings:
- name: 露营核心类别高频群组分布
  desc: '[evidence] 素材数据显示露营核心类别集中于第18类(背包/伞/杖群组1802/1804/1805)、第25类(服装鞋帽群组2501/2507/2508)、第20类(家具/床垫群组2001/2013)、第22类(帐篷/绳网群组2201/2202/2203)、第24类(睡袋/毯/垫群组2406/2407)、第21类(炊具/杯具群组2101/2105)、第11类(照明/烹饪/净水群组1101/1104/1110)等7大类17个核心群组。'
  excerpt:
  - 第18类：1.登山杖1805；2.手杖1805；3.户外伞1804；4.野营手提袋1802；5.背包1802
  - 第25类：1.户外防风夹克2501；2.鞋2507；3.帽2508；4.袜2509；5.登山鞋2507
  - 第22类：1.遮蔽式露营袋2202；2.露营时铺地用防潮布2202；3.帐篷2202；4.登山或野营用帐篷2202；5.绳索2201
- name: 露营关联类别服务化延伸特征
  desc: '[evidence] 素材数据揭示露营关联类别呈现显著服务化特征：第39类(旅行安排/运输/租赁)、第41类(娱乐/培训/野营服务)、第43类(住宿预订/场地设施/设备租赁)构成服务闭环；第12类(房车/无人机)、第28类(游戏帐篷/钓具)实现硬件延伸；第06/08/09/19/27类补全金属件/工具/电子/建材/地材配套。'
  excerpt:
  - 第39类：1.摄影用无人机出租3904；2.物流运输3901；3.安排旅行3911...
  - 第41类：1.娱乐服务4105；2.筹划聚会4105；3.假日野营娱乐服务4105；4.体育野营服务4105...
  - 第43类：1.露营场所住宿预订4301；2.帐篷出租4302；3.提供野营场地设施4302...
  - 第12类：1.露营车（娱乐用车辆）1202；2.房车1202；...10.摄影无人机1209
- name: 园林行业第44类服务核心地位
  desc: '[evidence] 素材中园林行业唯一明确列出的服务核心类别为第44类，涵盖园林景观设计(4404)、园艺(4404)、花卉摆放(4404)、插花出租(4404)、提供植物鉴别信息(4404)、花园护理(4404)等6个同群组(4404)高频服务项目，确立了4404为园林服务保护核心群组。'
  excerpt:
  - 第44类：1.园林景观设计4404；2.园艺4404；3.花卉摆放4404；4.插花出租4404；5.提供园艺用植物和花的鉴别信息4404；6.花园或花圃的护理
    4404
- name: 酒水行业第33类成品酒群组聚焦
  desc: '[evidence] 素材在第33类列举10个具体酒品项目(果酒/白酒/黄酒/调味蒸馏酒/利口酒/威士忌/鸡尾酒/清酒/甜酒/葡萄酒)均归属3301群组，印证《区分表》中第33类核心保护范围高度集中于3301群组，注册时需重点覆盖该群组。'
  excerpt:
  - 第33类：1.果酒3301；2.白酒；3.黄酒；4.已调味的蒸馏酒；5.利口酒；6.威士忌；7.鸡尾酒；8.清酒；9.甜酒；10.葡萄酒
- name: 酒水行业第21类酒具群组双核心
  desc: '[evidence] 素材第21类酒具项目分属两大核心群组：2101群组(开酒器/长柄勺/调酒器)与2105群组(烈酒杯/酒杯/吸液管/酒具)，以及2102/2111群组，提示酒具注册需跨群组布局。'
  excerpt:
  - 第21类：1.开酒器2101；2.葡萄酒用长柄勺2101；3.鸡尾酒调酒器2101；4.酒瓶吊牌2102；5.烈酒杯2105；6.酒杯2105；7.吸液管（品酒用具）2105；8.酒具2105；9.冰酒器2111；10.葡萄酒冷却器2111
