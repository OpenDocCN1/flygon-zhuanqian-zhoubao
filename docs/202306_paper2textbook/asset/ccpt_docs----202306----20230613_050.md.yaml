paper: docs/202306/20230613_050.md
desc: 该素材由梨云撰写，系统阐述了如何在小红书电商红利期通过数据驱动的方式挖掘适合普通人的蓝海爆品。核心内容包含：利用第三方数据平台（灰豚）与爬虫工具（八爪鱼/Python）批量采集带货笔记并补全商品链接、销量、价格计算GMV；提出“漏斗式选品法”，包含宏观赛道分析（按GMV分级、粉丝量分布、价格带分布、大品类/细分品类词云分析、透视表多维打分筛选价格区间）与微观单品成本分析（笔记制作成本、账号运营成本、启动资金估算、拼多多利润核算、矩阵/竞品竞争度排查）；并提供标准化分析表格与实操案例（手机壳、水蜜桃），强调选品需匹配个人能力、先入场抢占红利。
concepts:
- name: 漏斗式选品法
  desc: 一种从宏观赛道筛选到微观单品验证的分层选品方法论，包含宏观分析（赛道天花板、门槛、价格带、品类分布、价格区间打分）与微观分析（制作成本、运营成本、利润核算、竞争度）两大阶段，旨在帮助普通人低成本试错、精准锁定蓝海单品。
  is_original: true
  excerpt:
  - 结合前面的宏观+微观，从赛道到产品，这一套操作下来，我把它叫做：漏斗式选品法。
  - 宏观分析让我们对三个档位有了具体的认知，拿到前面的结论，结合微观分析即可。
- name: 小红书电商三档赛道分级
  desc: 基于单品/赛道GMV将市场划分为百万赛道（100w+）、十万赛道（10w-99w）、万级赛道（1w-9w）三个梯队，作为宏观选品的第一刀切分依据。
  is_original: true
  excerpt:
  - 宏观，就是开启上帝视角，从 GMV 窥探赛道天花板，可以分为三档：百万赛道（100w+）、十万赛道（10w-99w），和万级赛道（1w-9w）。
- name: 粉丝量门槛模型
  desc: 利用不同GMV档位赛道中博主粉丝量分布（如5000粉以下占比）反推内容制作门槛、账号权重及新手友好度，指导新号选择匹配能力的赛道档位。
  is_original: true
  excerpt:
  - 粉丝量本质上，反映的是一个账号内容吸粉能力，能倒推出内容质量，进而初略判断笔记制作成本。
  - 万级赛道：5000 粉以下占了快一半，刚入场不要眼高手低，可以来这个赛道做选品，相比前面，难度就是新手村。
- name: 价格带-难度正相关规律
  desc: 发现赛道GMV档位越高，主流价格带越高（百万赛道主打50-500元，万级赛道主打0-50元），客单价提升伴随带货难度指数级上升，建议新人锁定0-100元、尤其是50元以下区间。
  is_original: true
  excerpt:
  - 发现趋势没，想要突破十几万、上百万，客单价必须往高里走，但是与此相对的，就是带货难度更大。
  - 选品的价格区间，控制到 0-100 块，尤其是 50 块以下，对新人新号会友好一些。
- name: 带货笔记全链路成本核算模型
  desc: 将单条带货笔记的投入产出拆解为四大可量化成本维度：笔记制作成本（拍摄/剪辑/素材源）、账号运营成本（发布频次/周期/矩阵模式）、启动资金成本（无货源垫付/买样品/流量推广）、采购利润核算（拼多多进货价/售价/运费/退货率），形成标准化决策表单。
  is_original: true
  excerpt:
  - 做商品笔记微观分析的宗旨：一切回归到成本计算上来。
  - 你必须透过笔记看到它整个呈现形式，这是第一个：笔记制作成本... 顺势点开主页，来到第二个：账号运营成本... 启动资金，起码准备 6000+... 跨 app，来到拼多多，看利润。
- name: 无货源素人号模式特征
  desc: 识别小红书带货主流模式之一：非混剪、自拍原创图文/视频、不露脸、单品类多SKU布局、低粉高转化、依赖单篇爆款拉动全店GMV、需自备流动资金垫付。
  is_original: false
  excerpt:
  - 从链接类型看，它极大可能是无货源素人号... 走的是单品类打爆，而不是单款打爆。
  - 她是不同的款都发笔记，并且是固定场景，这就意味着，她是自己买产品来拍的，好处是完全避开查重。
methods:
- name: __overview__
  desc: 漏斗式选品法完整流程：数据采集清洗 -> 宏观赛道分级筛选 -> 细分品类/价格带透视表打分 -> 目标单品微观成本核算 -> 竞争环境排查 ->
    决策执行。
  excerpt:
  - 第一步，我们需要搜集大量小红书商品笔记... 我把 4 月的 2000 条带货笔记导了出来... 爬取... 销量、价格... 计算出它们的 GMV。
  - 宏观分析... 微观分析... 结合前面的宏观+微观，从赛道到产品，这一套操作下来，我把它叫做：漏斗式选品法。
- name: 数据采集与清洗流程
  desc: 绕过平台推荐算法信息茧房，使用第三方数据平台（灰豚）导出基础笔记数据，再配合爬虫工具（八爪鱼采集器 / Python+Selenium）批量补全商品链接、实时销量、价格，自动计算GMV，构建结构化选品数据库。
  excerpt:
  - 我只能检索自己认知内的品类关键词... 那些我认知外的品类，岂不是直接被筛选掉了？
  - 把 4 月的 2000 条带货笔记导了出来... 用八爪鱼采集器，爬取灰豚的数据... 拿到商品链接，顺势批量爬下了对应产品的【销量】【价格】，然后用表格计算出它们的【GMV】。
- name: 宏观赛道透视表多维打分法
  desc: 在锁定细分品类（如手机壳）后，按价格区间（如10元阶梯）分档，建立透视表对比GMV、销量、互动量，设定加权打分规则（GMV/互动权重正向、销量权重反向/低权重），量化筛选最优价格带。
  excerpt:
  - 用一个透视表，揭示价格、GMV、销量，和互动量之间的内在联系。
  - 打分规则一出，高下立判：GMV、互动量越大，得分越高；销量越大，得分越低。
- name: 单品笔记微观拆解SOP
  desc: 标准化单品分析动作：1. 笔记页分析制作成本（形式/工具/素材源）；2. 主页分析运营成本（简介/数据/笔记历史/发布节奏/店铺SKU结构）；3.
    跨平台利润核算（拼多多进价/售价/费用/退货率）；4. 竞品排查（关键词搜同款/IP归属/内容同质化）；5. 填入标准化决策表单输出做/不做结论。
  excerpt:
  - 当我们拿到一个商品笔记链接，该怎么计算投入产出比呢？
  - 为了方便大家对带货笔记进行分析，我把这个表格整理好了... 以上分析... 2 分钟就能完成，主要是熟悉，起码练习 10 遍以上。
- name: 常识辅助选品定向法
  desc: 在宏观数据缺失或随机抽样时，利用时间节点（季节/节日）、刚需场景（衣食住行）等常识缩小搜索范围，提高随机抽样命中“普通人可做”蓝海单品的概率。
  excerpt:
  - 用常识！比如现在是 6 月，衣食住行方面，有哪些是 6 月特有的？夏天的女装... 夏天的水果... 盲选成功概率，是不是也更大。
theorems:
- name: 红利期三大特征判断
  desc: 小红书电商处于红利期的核心判断依据：无品牌垄断、无固定打法（百花齐放）、未进入规范期（稽查宽松），三者叠加形成普通人入场的结构性机会窗口。
  excerpt:
  - 首先，它没有形成品牌垄断，其次，没有形成固定打法，正处于玩法的百花齐放状态，最后，没有进入规范期，稽查也比较宽松。这三个点加起来，意味着普通人现在入场，有大把的肉可以吃。
- name: 选品先机即红利核心主张
  desc: 在资源受限条件下，普通人的核心竞争力在于“先下手为强”的选品时效性；选品红利随时间衰减，晚入场需付出指数级更高的矩阵/内容成本才能竞争。
  excerpt:
  - 选品定生死，而且，当大家都知道这个品好卖的时候，它的红利已经被吃掉一大半了。
  - 所以，这就需要我们拥有提前挖掘爆品抢占先机的方法。是的，在没有资源加持的情况下，普通人的选品策略就是：先下手为强。
- name: 能力匹配原则
  desc: 选品目标必须与个人/团队现有能力（内容制作、资金、时间、供应链）匹配，盲目对标头部大号会导致“怀才不遇”式失败；新手应主动降维至万级赛道、低客单价、低粉丝门槛区间。
  excerpt:
  - 答应梨云，你的目标，要和你的能力匹配，不然又要喊怀才不遇了。
  - 俯瞰三档赛道，最后还是选择进入相对简单的万级赛道... 对新人新号会友好一些。
- name: 单品类多SKU原创打法优于单款混剪
  desc: 在当前查重机制下，单品类多SKU自拍原创模式（固定场景、不同花纹）虽增加采样成本，但能规避查重风险，实现账号长期稳定权重积累，优于单款依赖混剪/搬运的短期模式。
  excerpt:
  - 走的是单品类打爆，而不是单款打爆... 她是不同的款都发笔记，并且是固定场景，这就意味着，她是自己买产品来拍的，好处是完全避开查重，毕竟是原创。
findings:
- name: 手机壳细分品类最优价格带实证
  desc: '[evidence] 基于4月2000条带货笔记数据，手机壳品类按10元阶梯分档透视表打分显示：17.9-27.9元（2档）综合得分最高（GMV/互动量高、销量适中），优于7.9-17.9元（1档）与27.9-37.9元（3档），验证了中低客单价区间存在结构性机会。'
  excerpt:
  - 在手机壳这一块，按照 10 元为间隔，分为了三档... 打分规则一出，高下立判：GMV、互动量越大，得分越高；销量越大，得分越低。
  - 恭喜 2 档以 2 分的差距脱颖而出，那么，接下来，就直接在里面选笔记的品了。
- name: 低粉高GMV单品实战案例复盘
  desc: '[evidence] 实测某手机壳笔记：博主粉丝仅100+，单条笔记带货GMV 1.2万；账号45天发68篇（日更1-2），靠1-2篇千赞爆款拉动全店；无货源模式，启动资金约6000元（含5000垫付），半月净利约4700元；非矩阵操作，同款竞品极少，验证了“万级赛道+低粉原创+中低客单”路径对新人可行性。'
  excerpt:
  - 挑了一个粉丝量只有 100 多，却带出了 1.2wGMV 的手机壳来分析。
  - 启动资金，起码准备 6000+... 一个半月 4700，赚的多不多... 可以看出，不是矩阵，对个人玩家友好。同款笔记数量极少。
- name: 万级赛道Top10大品类分布图谱
  desc: '[evidence] 基于GMV 1w-9w赛道数据统计，占比前十大品类依次为：首饰、手机壳、女装上衣、美妆工具、零食、家居收纳、饰品配件、文具、鞋袜、护肤；前五细分词云揭示首饰细分为戒指/手链/项链/耳环/手镯，女装细分为上衣/连衣裙/外套/半身裙/套装，为后续选品提供了确定性方向表。'
  excerpt:
  - 占比前十的大品类：[图示首饰、手机壳、女装上衣等]
  - 取笔记关键词放词云... 分类后，整理得到这个表... 整体造型，和上衣重合度极高，所以我整合在了一起。
- name: 随机抽样命中率低于常识定向搜索
  desc: '[claim] 作者实测直接随机抽取带货笔记分析，遇到“普通人可做”品的概率极大降低；[evidence] 改用“6月+水果/女装”常识定向检索水蜜桃笔记，快速定位到低粉、原创拍摄、有利润空间的可执行案例，证明常识导航能显著提升挖掘效率。'
  excerpt:
  - 直接抓笔记分析，遇到普通人可做的品的概率，突然就大大降低了，那怎么提高这个概率呢？用常识！
  - 那我就挑个不喜欢的桃子来分析一下，直接小红书检索桃子... 根据自己的情况，就可以判断，这个桃子，适不适合自己搞了。
