paper: docs/202306/20230613_170.md
desc: 该素材由资深买量变现从业者 HEXIN 撰写，系统阐述了“付费短剧买量”这一商业模式的全貌，旨在补全市场上以 CPS 分销为主的单一视角。文章溯源付费短剧起源于
  2020 年小说 App 买量素材的演变，核心由嘉兴九州等头部公司推动；定义了“赘婿、神医、战神、总裁、言情”五大题材及“爽感”核心逻辑；深度画像核心用户为 30-50
  岁、安卓机、低价位手机、男性为主的下沉人群，并从情绪宣泄缺口角度解释其心理动因；详细拆解了选剧本、买版权、定角、拍摄剪辑的 20 天制作流程及成本水涨船高现状；厘清了版权方、买量分销商、短剧分销平台三大角色及利益分配链条；最终指出买量模式已进入红海、首日回本率要求极高、对团队效率与资金门槛极高，而
  CPS 分销虽门槛低但处于供应链下游、素材与爆款判断能力缺失，难以大赚。
concepts:
- name: 付费短剧
  desc: 区别于平台免费短剧，起源于 2020 年小说 App 买量素材演变，采用真人演绎、剧情强爽感、直接付费解锁后续集数的短视频内容形态。
  is_original: true
  excerpt:
  - 付费短剧，其实起源跟各大社交平台，视频平台所说的短剧有着天壤之别，大家切记不要把两者混为一谈。付费短剧，起源于 2020 年。它的出现，是从得间，七猫等小说
    App 的抖音买量素材演变而来的。
  - 因为当时在抖音给付费小说 App 买量，只有几种素材的类型：真人演绎的剧情类，小说第一章内容展示等。而这些做小说 App 的大佬，意外地发现，真人演绎的剧情类买量素材，虽然成本高，但是效果真的出乎意料的好
- name: 五大核心题材
  desc: 付费短剧内容高度标准化，仅包含赘婿、神医、战神、总裁、言情五大类，前三类因‘爽感’强效果远超后两类。
  is_original: true
  excerpt:
  - 付费短剧的题材，其实简单来说就 5 大类：1. 赘婿 2. 神医 3. 战神 4. 总裁 5. 言情
  - 而整体的体量和效果，前三类远远好于后两类，关键点就一个：爽
- name: 核心用户画像（下沉情绪缺口人群）
  desc: 男性占 80%，年龄 30-50+，安卓机为主，手机价格 1000-2000 元。因缺乏情绪宣泄渠道、自由支配时间少、无力改变现状但存幻想，成为付费短剧核心付费群体。
  is_original: true
  excerpt:
  - 1. 男女比例：8:2 2. 年龄阶段：30-50+ 3. 手机：以安卓为主 4. 买量平台，一般会用手机价格来衡量这类人群，手机价格：1000-2000
  - 而付费短剧的用户，收入不高，能够用来自由支配的时间很少，也无力改变自己的现状，但是还有一些幻想，有情绪需要宣泄，所以才有了付费短剧的发展。
- name: 短剧产业链三角色模型
  desc: 版权方（拍摄/供剧）、买量分销商（投流/变现）、短剧分销平台（CPS 分发）构成的利益分配与供给链条，版权方掌握首发权与分发节奏。
  is_original: true
  excerpt:
  - 版权方，这里可以简单理解为，拿到小说版权后，把短剧拍出来的一方...典型一点的就是嘉兴九州，南京花生书城等
  - 买量分销商，也就是拿着版权方的授权，去抖音，快手，腾讯买量的一方...买量分销商再把收入跟版权方 91 分成。
  - 短剧分销平台，这个是我了解最少的一方...可以简单理解为版权方的下游。
- name: 首日回本率/ROI 考核标准
  desc: 付费短剧买量的核心生死线：首日需回本 90% 以上，若 3 天内未回本则基本亏损，生命周期仅几天至几周，极度考验投放效率。
  is_original: false
  excerpt:
  - 早期买量，当日轻松回本，现在买量，需要卡死出价，如果首日不回个 90%，后续基本会亏。而一步付费短剧的生命周期，其实很短，抛开个例不谈，长则几周，短则几天
methods:
- name: __overview__
  desc: 付费短剧买量全链路操作方法论：从小说 IP 采购/自制剧本 -> 低成本快速拍摄制作 (5-10天拍摄+后期共 20 天出片) -> 头部买量团队在抖音/快手/腾讯广告平台高强度投放
    -> 首日 ROI 严格把控 -> 生命周期内极致效率榨取利润 -> 后期下放分销平台做 CPS 长尾变现。
  excerpt:
  - 1. 选剧本 2. 购买版权 ... 3. 定角 4. 拍摄&剪辑：短剧的拍摄，大概 5-10 天左右，算上后期的剪辑制作时间，20 天基本能做出一个可用来买量的短剧
  - 买量分销商，也就是拿着版权方的授权，去抖音，快手，腾讯买量的一方
  - 做付费短剧买量，最核心的是从拿到剧到这部剧生命周期结束的整体效率把控。
- name: 题材筛选与‘爽感’量化公式
  desc: 基于用户画像反推题材：仅保留赘婿/神医/战神/总裁/言情五大类，以‘爽’（强冲突、强反转、强情绪）为唯一核心指标筛选剧本，前三类为主流投放标的。
  excerpt:
  - 付费短剧的题材，其实简单来说就 5 大类：1. 赘婿 2. 神医 3. 战神 4. 总裁 5. 言情
  - 而整体的体量和效果，前三类远远好于后两类，关键点就一个：爽
- name: 用户画像定向与出价策略
  desc: 利用广告平台定向功能（性别、年龄、机型、手机价格）精准锁定‘30-50 岁男性、安卓、1000-2000 元机型’人群；采用‘卡死出价’策略，首日
    ROI 未达 90% 即止损，将风控前置至投放首日。
  excerpt:
  - 买量平台，一般会用手机价格来衡量这类人群，手机价格：1000-2000
  - 现在买量，需要卡死出价，如果首日不回个 90%，后续基本会亏。
theorems:
- name: 付费短剧起源于小说买量素材的‘内容产品化’演变
  desc: 付费短剧非自然生长，而是小说 App 为解决买量素材同质化、转化低，将‘真人演绎剧情素材’剥离并强化为独立付费视频产品的结果，嘉兴九州等公司完成了从‘素材’到‘商品’的商业闭环跃迁。
  excerpt:
  - 它的出现，是从得间，七猫等小说 App 的抖音买量素材演变而来的。
  - 真人演绎的剧情类买量素材，虽然成本高，但是效果真的出乎意料的好，我已经不记得谁是第一家动了拍短剧，靠买量做增长，靠直接付费做变现的心思。但是最终把这件事情发扬光大的公司，叫做嘉兴九州。
- name: ‘情绪宣泄缺口’决定下沉男性付费逻辑
  desc: 核心用户（30-50 岁下沉男性）非因内容偏好，而是因现实生活中缺乏购物、旅游、高端娱乐等情绪宣泄渠道，且时间碎片、阶层固化、存幻想，才通过低成本付费短剧获得‘爽感’补偿，这是付费短剧商业模式成立的心理学基石。
  excerpt:
  - 我朋友说了一句经典的总结：因为女性，一二线城市的人，有钱人，有更多可以宣泄自己情绪的途径，而只有这类人没有。
  - 而付费短剧的用户，收入不高，能够用来自由支配的时间很少，也无力改变自己的现状，但是还有一些幻想，有情绪需要宣泄，所以才有了付费短剧的发展。
- name: 版权方掌握‘首发定价权’导致 CPS 分销天然处于劣势
  desc: 产业链上游版权方控制剧集首发时间与买量分销商独家期，CPS 分销平台仅能获取‘跑过一轮买量后的存量剧’，导致素材已疲劳、爆款已现、利润已被上游截留，CPS
    本质是买量模式的‘长尾清理外包’，而非独立创富路径。
  excerpt:
  - 绝大多数的付费短剧，第一时间是供给买量分销商的，所以在短剧分销平台能拿到的剧，其实本身在抖音等平台已经跑过一段时间，所以，别指望大赚特赚。
  - 每个平台都其实从版权方拿，但是版权方有权决定什么时间放给某一个下游。
- name: 买量模式已进入‘红海精细化运营’阶段，个人/小团队慎入
  desc: 经历 2 年发展，付费短剧买量从‘躺赚’转为‘卡死出价、首日回本 90%、生命周期极短、利润率 5-10%’的精细化红海，核心壁垒在于专业投放团队、资金实力（千万级）与全链路效率把控，非强买量背景者极易亏损。
  excerpt:
  - 早期买量，当日轻松回本，现在买量，需要卡死出价，如果首日不回个 90%，后续基本会亏。
  - 这个玩法，已经有很高的门槛，如果自己本身没有强大的买量团队，慎入。
  - 短剧买量需要资金量比较大才能玩（公司为了这个赛道投资千万级别）...扣掉分成和人工，大概有个 5%-10%利润点
findings:
- name: 制作成本通胀与周期压缩
  desc: '[evidence] 素材数据支撑：制作成本从早期 10 万上涨至 30 万甚至百万（小明星），但拍摄周期固定在 5-10 天、总周期 20 天，成本上涨未伴随周期延长，反映行业竞争已从‘速度’转向‘品质/明星效应’军备竞赛。'
  excerpt:
  - 这个成本，从最早的 10 万，现在水涨船高，到了 30 万，甚至有到百万的小明星付费短剧出现。
  - 短剧的拍摄，大概 5-10 天左右，算上后期的剪辑制作时间，20 天基本能做出一个可用来买量的短剧
- name: 嘉兴九州等头部公司实现‘版权+买量’垂直整合
  desc: '[evidence] 素材数据支撑：嘉兴九州、花生书城、杭州容量等头部版权方均具备或依赖强买量能力；嘉兴九州‘拍摄和买量能力都很强’；花生书城‘买量能力稍弱，所以会当版权方，把付费短剧大量的外放给其他买量分销商’，验证了买量能力是核心利润中心，版权方若无买量能力只能让利分成（91
    分）。'
  excerpt:
  - 版权方...典型一点的就是嘉兴九州，南京花生书城等，杭州也有一家，叫做杭州容量
  - 嘉兴九州，就是典型的拍摄和买量能力都很强的一家。而花生就是买量能力稍弱，所以会当版权方，把付费短剧大量的外放给其他买量分销商，买量分销商再把收入跟版权方 91
    分成。
- name: CPS 分销端面临‘素材不可见、爆款不可复制’的信息劣势
  desc: '[claim] 原文宣称结论：CPS 从业者无法获取买量端成熟团队的成熟素材、无法判断买量端已爆剧集是否值得二次推广、缺乏全平台素材监控渠道，导致决策盲目。'
  excerpt:
  - 能不能爆，其实只从短剧分销这个视角去看，有太多缺失。比如买量爆过的剧应不应该做？买量的素材，剪辑都是成熟团队在做，他们的素材有没有办法借鉴？哪里能够看到全平台的短剧素材？
- name: 短剧出海已成新增量方向
  desc: '[claim] 原文宣称结论（评论区）：短剧已开始出海，变现方式与国内有异同，暗示国内红海背景下出海为新蓝海。'
  excerpt:
  - 另外，最近才开始的，短剧已经出海，变现方式方面和国内会有接近也有差异的地方。
