learning_targets:
- 1. 理解“选址>营销”的第一性原理，能解释自然流量曝光为何是实体商业的核心护城河
- 2. 掌握自媒体放大器的本质，能运用“造事→记录→产品化”方法为无优势门店设计内容生产路径
- 3. 学会用量化预售模型制定新店开业前的现金流回笼方案，实现“零成本开店”
- 4. 能熟练使用百度热力图、实地骑行、竞品观察等工具完成一次选址评估
- 5. 掌握“进店-购买”转化漏斗的构建方法，能根据数据定位经营问题并给出改进方向
concept_map:
- 实体商业选址 —— 物理位置决定流量上限
- ├── 核心定理
- │   ├── 选址决定生死，租金决定利润 —— 295
- │   ├── 选址>营销：优质选址边际收益远超线上投入 —— 252
- │   └── 加盟利益绑定度决定扶持深度 —— 295
- ├── 自然流量曝光
- │   ├── 定义：优越地理位置自带的免费客群曝光 —— 252
- │   ├── 关键性质
- │   │   ├── 位置好才是王道，旺铺无需主动营销
- │   │   └── 营销只能优化转化，无法创造自然流量
- │   ├── 实证：写字楼11层→商场2层通道，自然流量质变 —— 252
- │   └── 边界：产品/服务无优势时，好选址只是延缓失败
- ├── 自媒体放大器
- │   ├── 定义：放大已有线下优势，而非创造流量 —— 252
- │   ├── 方法：造事→记录→沉淀产品
- │   │   ├── 有优势者：放大产品/位置/服务
- │   │   └── 无优势者：到生活中创造真实事件
- │   ├── 产品化路径：营销教程→付费社群→加盟体系 —— 252
- │   └── 边界：必须基于真实商业/生活行为
- ├── 预售覆盖成本
- │   ├── 定义：开业前预售收入覆盖装修/房租/运营成本 —— 252
- │   ├── 方法
- │   │   ├── 限量席位稀缺营销（如50个名额+晒单施压）
- │   │   └── 存量私域激活（老会员+试课未成交用户）
- │   └── 实证：60万总投入，预售回笼约25万 —— 252
- ├── 选址风向标工具包
- │   ├── 工具链 —— 294
- │   │   ├── 百度热力图：初筛高热力区域
- │   │   ├── 地图同业分布：设置拦截动线
- │   │   ├── 贝壳找房：判断消费实力
- │   │   └── 链家顾问：获取楼盘入驻情报
- │   ├── 实地验证法
- │   │   ├── 共享单车骑行：交叉验证线上热力与线下形态
- │   │   └── 竞品连续观察：拍照对比销量+垃圾箱选品 —— 294
- │   └── 适用边界：需结合业态特性动态调整权重
- ├── 体验差异化
- │   ├── 定义：产品同质化下，环境与隐私即护城河 —— 295
- │   ├── 核心原则：拒绝价格战，做“有新意”的门店 —— 295
- │   ├── 隐私首选址：社区/酒店/城中村，避开主干道 —— 295
- │   ├── 情绪价值：成人兴趣教育=社交货币 —— 252
- │   └── 案例：无人店体验升级、舞蹈室ins风格改造 —— 295,252
- ├── 延伸应用
- │   ├── 加盟避坑：警惕隐形收费，选择深度绑定型品牌 —— 294,295
- │   ├── 二手机器：低成本试错+保留残值，但需过户信息差 —— 294
- │   ├── 线下线上融合：外卖O2O可带来50%+销售额增量 —— 295
- │   └── 低成本开店：单店启动约6000-7500元 —— 294
- └── 数据驱动运营诊断
- '    ├── 模型：进店人数/购买人数转化漏斗 —— 294'
- '    ├── 归因规则'
- '    │   ├── 进店少 → 选址问题'
- '    │   ├── 进店多买少 → 选品/定价问题'
- '    │   └── 购买异常 → 机器故障/履约问题'
- '    └── 核心：数据替代主观判断，形成闭环复盘'
life_analogy:
- 想象实体创业是在**闹市口开一家柠檬水摊**：
- '- **自然流量曝光** = 摊位摆在人流量大的十字路口，路人自带'
- '- **自媒体** = 在路口支一个闪烁的招牌，只能放大已有客流，不能凭空造人'
- '- **预售** = 摆摊前先发“开业券”，用定金覆盖买柠檬和杯子的成本'
- '- **选址工具包** = 用地图热力图+实地蹲点数人流，而不是凭感觉选位'
- '- **体验差异化** = 同样是柠檬水，你的摊有遮阳伞、有试饮、有可爱杯子'
- '- **数据诊断** = 数一数路过多少人、多少人停下来买，判断是位置问题还是口味问题'
- 就像摆摊要先选对路口，实体店必须先选对位置，之后所有营销和运营才有放大的可能。
summary:
- concept: 自然流量曝光
  desc: 地理位置自带的免费客群曝光，是实体商业的核心护城河
- concept: 自媒体放大器
  desc: 自媒体是放大优势的杠杆，先造事、再记录、最后沉淀为可售产品
- concept: 预售覆盖成本
  desc: 开业前用限量预售回笼现金流，覆盖成本实现零成本开店
- concept: 选址风向标工具包
  desc: 热力图+实地骑行+竞品观察的组合拳，将选址从玄学变科学
- concept: 体验差异化
  desc: 产品同质化时，环境、隐私与情绪价值即护城河
- concept: 数据驱动运营诊断
  desc: 用进店-购买转化漏斗精准定位选址、选品、定价问题
- concept: 隐私首选址
  desc: 敏感业态需平衡高流量与高隐私，避开主干道显眼位置
- concept: 深度绑定型加盟
  desc: 靠运营提点的加盟商比卖机器的更靠谱，利益绑定决定扶持深度
- concept: 二手机器
  desc: 低成本试错且保留残值，但需掌握过户信息差
- concept: 线下线上融合
  desc: 外卖O2O即时零售可为门店带来50%以上销售额增量
exercises:
- 'no': 1
  title: 用“选址评估清单”给两家虚拟店铺打分
  contents:
  - 背景：你计划开一家成人用品无人售货店，现有两个候选地址：
  - A：老社区底商，周边有3家快捷酒店和2所中学，月租6000元，位于非主干道；
  - B：城市主干道临街店铺，人流量大、视觉醒目，月租15000元。
  - 任务：
  - 1. 根据“隐私首选址原则”和“租金占比红线”分别评估A和B；
  - 2. 列出至少4项你认为关键的评估指标，并为每项分配权重；
  - 3. 给出选址建议，并说明理由；
  - 4. 如果选择A，设计一套线上引流方案弥补自然流量的不足。
  - 思考提示：
  - '- 高流量与高隐私如何平衡？'
  - '- 租金成本在什么范围内才不影响回本周期？'
- 'no': 2
  title: 设计一份“预售覆盖成本”方案
  contents:
  - 假设你要开一家舞蹈工作室，总投入60万元，开业前计划用预售年卡和课时卡回笼资金。
  - 已知：年卡定价7180元，50课时卡定价3000元。
  - 任务：
  - 1. 如果预售20张年卡和30张课时卡，能回笼多少资金？还差多少才能覆盖总投入？
  - 2. 如果目标是先覆盖运营成本（假设月运营成本2万元），需要至少卖多少张年卡？
  - 3. 结合“限量席位制造稀缺感”的方法，设计一个50个名额的预售海报文案框架；
  - 4. 讨论：若名额已经全部售完但仍未覆盖成本，你有哪些备选方案？
- 'no': 3
  title: 用“进店-购买”漏斗诊断一家无人店
  contents:
  - 你经营一家成人用品无人售货店，本周记录到以下数据：
  - 路过门店人数约500人，进店人数80人，购买人数20人。
  - 任务：
  - 1. 计算进店率、购买转化率，以及“进店→购买”的转化损失；
  - 2. 根据漏斗数据，判断这家店目前更可能是选址问题还是选品/定价问题；
  - 3. 如果进店率明显偏低，列出3条可执行的改进动作；
  - 4. 如果购买率明显偏低，列出3条可执行的改进动作；
  - 5. 说明你还需要采集哪些数据来验证自己的判断。
- 'no': 4
  title: 为一家“没有优势”的水果店策划“造事”内容日历
  contents:
  - 你是一家社区水果店的老板，水果和周边同行同质化严重，你也不擅长出镜。
  - 请运用“自媒体放大器”理论，设计一个为期两周的“造事-记录-产品化”内容计划：
  - 1. 列出至少3个可以记录的真实事件（如凌晨进货、试吃选品、包装升级）；
  - 2. 为每个事件拟定一个抖音/小红书选题，并说明它放大了哪个线下优势；
  - 3. 从这些内容中提炼一个可以沉淀并出售的知识产品（如“挑西瓜教程”）；
  - 4. 说明如何用这个知识产品吸引私域流量并转化为预售订单。
- 'no': 5
  title: 实地考察任务：用工具包评估一个真实铺位
  contents:
  - 选择你所在城市的一个目标业态（如奶茶店、理发店、健身房），完成一次选址侦察：
  - 1. 用百度热力图找出该业态的高热力区域并截图；
  - 2. 用地图模式标记3公里内同类商家分布，画出拦截动线；
  - 3. 实地骑行或步行，统计周六上午10点-11点路过目标铺位的人流；
  - 4. 观察一家竞品店，记录其货架变化或垃圾箱中的包装，推测畅销品；
  - 5. 综合以上信息，写一份200字以内的选址评估报告。
