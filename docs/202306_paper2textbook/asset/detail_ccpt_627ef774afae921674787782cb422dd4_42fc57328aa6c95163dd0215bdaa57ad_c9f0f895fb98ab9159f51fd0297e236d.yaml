  name: 广告商单变现体系 —— 逆向品牌决策链路的“接单术”
  points:
  - '**为什么需要这个概念？**'
  - '- 被动等广告主找上门，机会少且价格低；了解品牌方如何选人，才能主动布局提高接单率'
  - '- 广告报价充满隐性成本（手续费、返点），不懂定价容易吃亏'
  - '- 广告植入违和会伤粉，需要科学方法平衡商业与内容'
  - '**核心定义**'
  - '- 品牌方决策链路：搜索产品/场景关键词→筛选博主→验证人设数据→投放'
  - '- 逆向布局：在笔记中布局关键词、展示产品场景、设置“广告位”；用薯条投流引商单；大小号矩阵覆盖金字塔投放结构'
  - '- 定价三步法：向同类博主询底价、参考千瓜报备价（非报备对折）、谈判中动态上调'
  - '- 植入双准则：需求匹配度（粉丝需求∩产品需求非空）与内涵共振（产品内涵与IP内涵绑定）'
  - '**关键性质**'
  - '- 报备广告扣10%手续费（签约MCN约7%），非报备通常价格低但管控趋严'
  - '- 报备单常要求返点20%-35%，实际到手=报价×(1-手续费-返点)'
  - '- 品牌投放呈金字塔：头部个位数、腰部两位数、尾部/素人成百上千'
  - '**典型例子**'
  - '- 32万粉博主通过上述方法，累计广告收益40万+，月均3-4万'
  - '- 高客单价品类（数码、美妆）广告报价最高'
  - '**边界条件**'
  - '- 粉丝购买力（高知、一线、白领、女性）是品牌关注核心'
  - '- 广告植入必须与内容调性匹配，否则砍价或掉粉风险高'
  sources:
  - paper: docs/202306/20230613_224.md
    role: origin
  excerpts:
  - 报备单一般会要求返点...返点一般在 20%-35%左右，就是你的后台报价是 1w，那么你要给平台 1000 手续费，还要给 1w*n%返点。
  - 品牌的投放路线是：头部博主控制在个位数，腰部博主控制在 2 位数，尾部博主可能比腰部博主的人数多一倍，素人百来位。
  - 一个标准：你的粉丝可能会需要你这个产品吗？他们关注你的需求，有可能是想要从你这里获得这个产品吗？如果答案肯定，那么广告随便写。
  - 把产品的内涵和我这个人的内涵结合在一起，那样就不违和了。
