    role: origin
  - paper: docs/202306/20230613_152.md
    role: origin
  - paper: docs/202306/20230613_225.md
    role: origin
  - paper: docs/202306/20230613_229.md
    role: apply
  - paper: docs/202306/20230613_142.md
    role: apply
  excerpts:
  - 小红书电商，我们的操作方式，简单说来，重要流程就三个环节，1.选品 2.测品 3.怼爆品
  - 我们测的产品越多，出单的概率也就越高
  - 并不是亏本的意思，你前期可以先赚个 5 块 10 块来增加销量后去转化率会增强，可以设置比如你产品卖 30 定价卖 60 再送 30 的券
  - 新手做小红书电商，1 个月净利润 6W
  - 红利期仍然是红利期，只是对于普通人来说，跟爆品不会再像早期那样。
- 'no': 6
  name: 自有/定制货源模式 —— 用内容测品反向“定制”供应链
  points:
  - '**为什么需要这个概念？**'
  - '- 无货源模式同质化严重，利润被上游挤压，需要掌握供应链才能建立护城河'
  - '- 先生产再销售风险高，用内容验证需求再组织生产能大幅降低试错成本'
  - '- 单人也能通过轻量化供应链实现高利润'
  - '**核心定义**'
  - '- 爆文反向定制选品：先在平台发布笔记测品，出现爆文后再批量生产上架'
  - '- 自有/定制货源：自主设计、生产或定制品类，掌握定价权、质控权、差异化壁垒'
  - '- 单人全流程闭环：选品、拍摄、发布、接单、发货、售后全部一人完成'
  - '**关键性质**'
  - '- 高客单价、高复购、低竞争，毛利显著高于无货源'
  - '- 内容即市场调研：笔记数据直接反映需求强度'
  - '- 模式可复制：一个爆款跑通后，可复制方法论至其他品类'
  - '**典型例子**'
  - '- 作者自制手工玩具，小红书爆文后迅速批量生产，单枪匹马半年单店月盈利稳定10万+'
  - '- 自有货源模式用户拥有定价权，可翻倍定价（1688选品翻倍卖）'
  - '**边界条件**'
  - '- 需要一定的产品设计或供应链整合能力，纯小白初期门槛较高'
  - '- 需警惕季节性波动和平台规则变化，备货有库存风险'
  sources:
  - paper: docs/202306/20230613_222.md
    role: origin
  - paper: docs/202306/20230613_151.md
    role: apply
  excerpts:
  - 自制手工玩具在小红书爆文后迅速批量生产，单枪匹马入局小红书店铺半年单店月盈利稳定 10w+
  - 1688 产品相对好一些，那我们就不能卖贵一点嘛？好产品值得一个好价格，小红书我都是翻倍卖。
- 'no': 7
  name: 本地生活团购红利期 —— 商家与博主的“双向奔赴”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统本地商家流量被美团等平台高佣金剥削，小红书推出0佣金团购，是低成本获客新渠道'
  - '- 平台内测期有流量扶持和政策补贴，早入局者能吃到红利'
  - '- 对博主而言，探店笔记可以多一条CPS变现路径'
  - '**核心定义**'
  - '- 小红书本地团购：商家在笔记挂购买链接，用户在线下单到店核销，目前在内测期提供0佣金、0保证金、流量扶持'
  - '- 商家端“食力发店计划”：邀请餐饮等本地商家入驻，享0佣金红利'
  - '- 博主端“探照灯计划”：官方对探店博主提供流量扶持，博主可通过CPS佣金、置换免单、官方扶持变现'
  - '**关键性质**'
  - '- 去中心化推荐，新号/小号也有机会获巨大曝光'
  - '- 小红书用户画像高净值（80%为18-34岁一二线城市年轻人），平均带货转化率21.4%，远超抖音/快手/微博'
  - '- 种草-拔草一体化，搜索流量+推荐流量双轮驱动'
  - '**典型例子**'
  - '- 作者自己的实体家居生意，80%以上客源来自小红书，累计变现金额从1500万+刷新到2000万+'
  - '- 董洁小红书直播单场GMV 6000万，商品未讲完即售罄'
  - '**边界条件**'
  - '- 内测仅在广州、上海等城市开放，有地域限制'
  - '- 红利期窗口短，平台为吸引商家会持续扶持，但后期可能收紧政策'
  sources:
  - paper: docs/202306/20230613_227.md
    role: origin
  - paper: docs/202306/20230613_230.md
    role: origin
  excerpts:
  - 参与计划的商家，可以在笔记中挂上购买链接，用户通过笔记进入购买页面下单，就可以直接去店里消费了。
  - 据 QuestMobile 数据，小红书的平均带货转化率高达 21.4%，这个数字远远超过了其他平台，抖音、快手、微博的转化率分别只有 8.1%、2.7%、9.1%。
  - 我自己的实体生意，80%以上的客源都来自线上，累计变现金额已经从去年的 1500w+，刷新到了 2000w+。
  - 任何最好赚钱的机会，都是在平台红利期的时候，而往往这个时候，基本都是在捡钱，随便上个链接就能出单
