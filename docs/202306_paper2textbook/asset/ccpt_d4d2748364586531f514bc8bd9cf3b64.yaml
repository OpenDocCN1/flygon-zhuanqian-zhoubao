paper: docs/202306/20230627_018.md
desc: 该素材记录了作者 Xu·东伟 复盘 AI 写作副业项目的实操经验，核心主张是利用 AI 技术（如 ChatGPT 3.5）降低写作门槛，使普通人能通过承接写作订单实现“稳定小富”的变现路径；文中披露了团队核心成员“糕老师”从月入
  1w+ 提升至近 3w 的收入跃迁数据，以及新人入行首日变现几十元、月均日入 200-300 元的阶段性成果，同时揭示了当前写作接单市场普遍存在“刷单返佣”陷阱的行业现状。
concepts:
- name: AI 写作副业
  desc: 利用生成式 AI 工具辅助完成商业写作订单，以降低创作门槛、提升产出效率，实现个人副业变现的商业模式。
  is_original: false
  excerpt:
  - AI 写作，一个稳定小富的成长型副业
  - 我相信利用 AI 可以让普通人做成一些之前做不到的事情，甚至直接变现。
  - 组成了 AI 写作团队，目前已经跑出了一点成绩。
- name: 成长型副业
  desc: 指起步门槛低、初期可快速见现金流（日入百元级），后期可通过建立个人 IP、开设店铺、私域引流等方式实现规模化增长的副业形态。
  is_original: true
  excerpt:
  - AI 写作，一个稳定小富的成长型副业
  - 新人第一天开始做就可以直接变现几十，一个月左右可以稳定在日入 200~300，想要做大就需要往个人 ip、开店铺、引流方面去做了。
- name: 刷单返佣陷阱
  desc: 写作接单市场中，雇主以写作任务为名、实为刷单任务，承诺垫资后返还本金及佣金，实则存在诈骗或违规风险的灰产现象。
  is_original: true
  excerpt:
  - 加了 5 个，有 2 个都是让你刷单的。。。
  - 说明现在写作店铺都是这种趋势了😂 不过都会返钱的
methods:
- name: __overview__
  desc: 组建具备写作经验的合伙人团队，引入 ChatGPT 3.5 作为核心生产力工具，承接外部写作订单（含灰色地带刷单单），通过流程标准化实现新人快速上手及收入阶梯式增长。
  excerpt:
  - 在圈子里认识了向南和荷包蛋糕，两人对写作都有经验，于是我们一拍即合，组成了 AI 写作团队
  - 'ChatGPT 用的是 3.5 还是 4 Xu·东伟 : 3.5 就可以了'
  - 新人第一天开始做就可以直接变现几十，一个月左右可以稳定在日入 200~300
- name: AI 辅助写作 SOP
  desc: 以 ChatGPT 3.5 为核心工具，结合合伙人糕老师三年人工写作经验，建立可复制、可教学的标准化写作作业流程，实现效率提升与新人快速变现。
  excerpt:
  - 糕老师拥有三年写作经验，之前稳定月入 1w+，后来在 GPT 的加持下，效率提升，再加上迎来毕业季，增长到月入近 3w
  - 希望能让大家看完后，直接无脑实操赚钱！
  - 更多细节，烦请移步飞书
theorems:
- name: AI 赋能普通人变现论
  desc: AI 技术的核心价值不在于替代专家，而在于填补普通人与专业任务之间的能力鸿沟，使零基础者能通过工具辅助完成此前无法胜任的商业写作并直接获利。
  excerpt:
  - 我一直相信一个理念，AI 只是一种新的技术，有人嗤之以鼻，有人用来提高效率，但我相信利用 AI 可以让普通人做成一些之前做不到的事情，甚至直接变现。
- name: 写作副业收入阶梯论
  desc: AI 写作副业存在清晰的收入分层：入门期（首日变现、日入几十），稳定期（月均日入 200-300），规模期（月入 1w-3w+，需转型 IP/店铺/引流）。
  excerpt:
  - 新人第一天开始做就可以直接变现几十，一个月左右可以稳定在日入 200~300，想要做大就需要往个人 ip、开店铺、引流方面去做了。
  - 糕老师拥有三年写作经验，之前稳定月入 1w+，后来在 GPT 的加持下，效率提升，再加上迎来毕业季，增长到月入近 3w
- name: 低端模型适配高价值场景论
  desc: 对于结构化、模板化程度高的商业写作任务，ChatGPT 3.5 等基础模型即可满足生产需求，无需追求更昂贵的高阶模型（如 GPT-4），边际成本极低。
  excerpt:
  - 'ChatGPT 用的是 3.5 还是 4 Xu·东伟 : 3.5 就可以了'
findings:
- name: 核心成员收入跃迁案例
  desc: '[evidence] 团队核心成员“糕老师”在引入 GPT 后，结合毕业季红利，月收入从稳定 1w+ 跃升至近 3w，验证了 AI 对资深从业者效率的显著放大作用。'
  excerpt:
  - 糕老师拥有三年写作经验，之前稳定月入 1w+，后来在 GPT 的加持下，效率提升，再加上迎来毕业季，增长到月入近 3w，如下图。
- name: 新人冷启动变现曲线
  desc: '[claim] 作者宣称新人遵循团队 SOP 可实现“第一天变现几十”、“一个月稳定日入 200-300”，但素材未提供具体新人样本数据或学员截图支撑，仅为单向宣称。'
  excerpt:
  - 这两个月跑出的成绩：新人第一天开始做就可以直接变现几十，一个月左右可以稳定在日入 200~300
- name: 写作接单市场灰产化现状
  desc: '[evidence] 基于评论区多位用户实测反馈（5个联系方式中2个为刷单、加的全是刷单），且作者确认“正常的”、“都是这种趋势”，佐证当前低门槛写作接单渠道高度混杂刷单业务。'
  excerpt:
  - 加了 5 个，有 2 个都是让你刷单的。。。
  - 加的全是让我刷单的
  - 说明现在写作店铺都是这种趋势了😂 不过都会返钱的
