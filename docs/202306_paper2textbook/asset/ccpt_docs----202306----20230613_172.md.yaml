paper: docs/202306/20230613_172.md
desc: 该素材是一份资深从业者（陈翔雨）关于 AIGC 赋能动漫 IP 快闪活动（漫展）的全流程实操经验分享，核心在于揭示如何以低成本、轻资产模式（从酒店、商场起步）切入二三线城市市场，通过「舞台商演
  Live 为核心内容、AIGC 同人周边为高利润变现点、志愿者 NPC 机制为低成本运营杠杆」的组合拳，实现单场活动 2-20 万营收的可复制方法论。素材系统拆解了场地分级选择、营收结构拆解（票务/周边/商摊/广告）、内容填充策略（官方
  IP 借势与 AIGC 二创）、现场执行 SOP 及新人避坑指南，是一份极具落地性的「野蛮生长期」漫展创业教科书。
concepts:
- name: 漫展分级场地模型
  desc: 根据资源积累阶段，将漫展场地划分为酒店类（300-800人）、商场类（500-800人）、体育馆类（2500-6000人）、博览中心类（8000-2万人）、自有合作场地五个梯队，形成从轻资产试错到重资产运营的进阶路径。
  is_original: true
  excerpt:
  - 市面上所有举办的活动，按规模大小基本可以分为四类：① 酒店类 ② 商场类 ③ 体育馆类 ④ 博览中心类 ⑤ 自有合作场地类
  - 适合刚起步接触的圈友，小而美
  - 商场的天然属性与我们会展类活动非常契合...可以通过活动的方式进行置换，通过我们的活动引流，商场可以很好的提高热度，我们也可以节省一笔场地费用
  - 大概需要半年到一年左右的时间，通过不断的做系列活动，占据当地活动生态...再提升到体育馆级别，会更加稳妥
- name: 漫展营收四象限结构
  desc: 将漫展收入拆解为门票（占比60%）、自营周边（20%-50%）、商摊招商（20%-50%）、广告赞助（0-30%）四大板块，强调小活动靠票务+周边，大活动靠商摊+赞助的动态平衡。
  is_original: true
  excerpt:
  - 活动盈利点主要有四块：① 活动门票收入部分...【占比 60% 左右】 ② 自己 产品售卖收入 部分...【占比 20%-50% 左右】 ③ 商摊入驻费用...【占比
    20%-50% 左右】 ④ 广告费用...【最高 100%；完美结构的活动一般在 15-30% 左右】
- name: 舞台商演 Live 核心论
  desc: 主张舞台内容的核心性价比在于「商演 Live」而非「大咖嘉宾」，通过招募本地演艺人员（Coser/舞见/唱见）以低成本（200-400元/单）填满
    3-4 小时舞台，并利用其照片制造「嘉宾阵容强」的宣传声量，实现内容填充、品牌背书、人员裂变三重效果。
  is_original: true
  excerpt:
  - 与其高成本请嘉宾造势，不如把预算都挪到商演部分，这样不仅能可以把舞台内容填满，还可以提高当地动漫圈子的影响力，并增加线上宣传，性价比极高
  - 这块舞台商演 live 内容，可以说是舞台的重点核心部分，把这块跑通了以后，舞台部分基本成功了一半
  - 可以将商演人员的 COS 照片与圈名做到宣传海报上...一排几十个参展“嘉宾”，会让你的用户觉得很“专业”
- name: AIGC 同人周边灰色地带变现
  desc: 利用 AIGC（Prompt/垫图/ControlNet）极低成本、高效率生成二创角色周边（徽章、立牌、抱枕等），规避传统约稿高昂成本与长周期，处于版权「灰色地带」但行业默认可商用，形成高毛利自营产品线。
  is_original: true
  excerpt:
  - 这块结合 AI 绘画属于一个新的风口...从原则上来说涉及到官方，都是侵权非商用的，但是这块并没有一个明确的限定，处于一个【灰色】地带，也就是"存在合理"
  - 而在 AIGC 时代的到来...可以说在生产周期跟生产成本这块，有了极大的提升
  - AIGC 的重点，实际上是用于更高级别的商业应用，也就是 to b 端，通过明确的 promet，低成本“大量试错”，解放生产，提高效率
- name: NPC 志愿者共创机制
  desc: 以『活动共创』而非『打工』为叙事，用低薪资（100-150元/天）+ 官方物料+ 优先报名权招募志愿者，配合『好人/坏人』执行培训话术，实现大型活动低成本、高执行力的现场管理。
  is_original: true
  excerpt:
  - 内容上主要偏向于活动共创，满足其参与活动的价值感；同时报名参与活动的志愿者们，除了基础薪资（ 100-150/ 单日）以外，还可以领取官方活动物料一份，并享有后续活动的优点报名权
  - 我们通常还会有一个“好人&坏人”的角色扮演过场，由现场执行作为“坏人”，区域负责作为“好人”...以此来作为一个“反面案例”
  - 一个好的执行人员，在整场活动中，一定是恩威并施的，既让人尊敬，又让人害怕
- name: 官方 IP 借势六步法
  desc: 针对小活动无法邀请大厂官方入驻的痛点，提出：自代理官方货、找经销商批发、官微私戳流量置换、找 IP 聚合猎头、填充自有品牌、引入属性合作门店六条获取官方背书内容的实操路径。
  is_original: true
  excerpt:
  - 大展商都不会考虑小活动做营销...所以基本上是联系不上的
  - 1、自己代理官方产品... 2、系不同地区该产品的经销商... 3、官方微博号私戳合作... 4、寻找 IP 聚合型合作商... 5、自己的品牌&官方...
    6、合作门店品牌
methods:
- name: __overview__
  desc: 「轻资产启动 - 系列化运营 - 区域垄断 - 规模跃迁」全生命周期方法论：以酒店/商场低成本试错 -> 依靠商演 Live 与 AIGC 周边建立现金流与内容护城河
    -> 通过志愿者机制与商摊生态沉淀私域 -> 逐步升级至体育馆/博览中心实现规模变现。
  excerpt:
  - 从一个不到 10m² 的小车库，干到 200m² 写字楼，把活动从酒店做到国际博览中心
  - 先拿小一些的商场进行案例沉淀，再去进行大商场的合作
  - 大概需要半年到一年左右的时间，通过不断的做系列活动，占据当地活动生态...再提升到体育馆级别
- name: 场地选型与谈判决策树
  desc: 决策逻辑：优先交通便捷/自带流量(商场) -> 规模匹配当前粉丝体量(酒店<商场<体育馆<博览中心) -> 成本结构测算(场地费+搭建+人员<预估票务收入60%)
    -> 商场优先采用「流量置换」零成本合作，体育馆以上需「友情价/关系」压降成本。
  excerpt:
  - 需要考虑先考虑到交通问题，像是市中心、地铁口沿线等交通便捷的场地，可以优先选择，最好场地有自带流量（商场）
  - 商场无合作费用，结合商场节日营销活动，可以进行流量置换
  - 场地价格（ 1.5-5w/ 日，看关系跟友情价，会有波动）...基本上一场都是十几到二十 w 区间左右
- name: 舞台内容排期与主持人管控 SOP
  desc: 舞台时长 4.5-5h，节目单 20-40 个 Live 节目（宅舞/宅曲 4-6min/个）；主持人为专业二次元主持，核心职责：时间把控、气氛组调度、人流分流（防舞台围观挤占商摊）、预热下一环节；应急预案：节目不足时主持人
    Solo 互动（送福利、接梗、知识问答）填补真空。
  excerpt:
  - 舞台活动时间分为上下午两场...也就是 4.5-5 个小时 需要进行内容填充
  - 一场活动的舞台 live 数量，大概有 20-40 个 live 节目，也就是 3 个小时（总的是 4.5 小时）
  - 主持人 solo 是我个人定义的一项舞台内容...核心就是福利送，送，送！把气氛炒热
  - 当舞台不够热闹，内容少了，人跑的又快，人少了活动氛围就会变差；全天的内容要分配均衡
- name: AIGC 同人周边生产工作流
  desc: 1. 选品：高热度 IP 角色 + 高客单价品类（立牌/抱枕/徽章）；2. 生成：Prompt 关键词（发色/特征/风格/背景）+ 垫图/ControlNet
    控制构图 -> 批量出图；3. 筛选修图：PS 修复手指/逻辑错误；4. 打样：找工厂小批量打样（盲盒/单品）；5. 上架：预售/现售，结合包装盒/防伪贴提升溢价。
  excerpt:
  - 你可以通过 Promet 描述角色的【特点】关键词，如：颜色头发、特征细节颜色、身型、背景、风格，仅限人物等，直接生成；要么就是垫图，开通高级会员图生图
  - 一些提升产品可能需要的设备物料：包装盒（自制盲盒）、PE 平口袋（玩具包装）、热缩膜、塑封机、标签打印机（小型物料）、防伪贴（门票&产品）
- name: 现场执行复盘闭环
  desc: 前一天晚间布置(21:00-24:00) -> 当日早会分工(07:00-08:00) -> 执行长统筹+ 区域长负责制 -> 影像留存(背书/宣发)
    -> 提前撤展分流 -> 复盘优化流程 -> 线上持续宣发预热下一场。
  excerpt:
  - 活动场地于活动前天正常营业结束后，方可入场进行布置（大概在晚上 9 点-12 点）
  - 第二天开展前，7:00-8:00 左右组织人员到达活动现场，完成进一步的任务分配
  - 活动现场，配备一名现场执行人员...每块区域需要确定一个区域负责人
  - 保留现场活动影像的记录，方便后续背书与线上宣发...活动结束后，对本场活动进行复盘，后续对整体流程进行进一步的优化
theorems:
- name: 「用户认定价值 > 活动客观内容」定价锚定论
  desc: 漫展票务溢价能力不取决于实际内容成本，而取决于用户心中预期的「认定价值」；前期宣传造势（海报堆嘉宾、堆IP、堆活动项）是建立高认定价值、支撑高票价（预售35-60,
    VIP80-120）的关键杠杆。
  excerpt:
  - 【一场活动的好坏不仅在于活动本身,更关键的是用户心中的认定价值（这也是前期启动的一项重点）】
  - 小活动一般只有普通票，票面价格预售票 35-40，现场票 45-60 区间；大中型活动特别设立 VIP 票种与 SVIP 票种，价格在 80-120 区间
- name: 「商演人员即 KOC」生态裂变论
  desc: 商演演员不仅是内容生产者，更是自带微影响力的 KOC；给予其宣传海报曝光、现场福利、专业背书，即可激励其自发传播、带动圈层口碑、沉淀为活动长期合伙人，形成「招募-曝光-裂变-留存」飞轮。
  excerpt:
  - 对于参与的商演人员来说，上了活动的宣传内容，等于参与一场当地的动漫线下活动“共创”，可以很好的增强其专业背书与当地知名度...所以一般都不会拒绝
  - 同时，你活动招募了这些人员，也间接引导了当地市场圈子的舆论...如果你的活动做得很不错...你很有可能就收获了更多口碑，以及当地潜在的曝光量
  - 对于参与舞台演出的人员，可以进行逐步筛选，好的留下，长期合作...培养成自己活动的专业人员，很容易就能把影响力拓展到地区知名
- name: 「内容填充优先级：商演 > 比赛 > 嘉宾 > 电竞」成本效能律
  desc: 在有限预算下，舞台内容投入产出比排序：商演 Live（高性价比、可控、可堆量）> 宅舞比赛（小活动低成本但招募难、大活动高成本高风险）> 大咖嘉宾（极高成本、流量转化率低、仅适合大展造势）>
    电竞比赛（观众留存差、占舞台时长、不推荐）。
  excerpt:
  - 按重要性排列，可以分为以下 5 种：1、coser&配音工作室嘉宾...【很贵，小活动性价比不高】 2、舞台商演 live【舞台部分的重点内容】...性价比极高
    3、宅舞&宅曲比赛【小型成本低，中大型成本高，效果好，比较吃地区】 4、主持人现场 solo【更多算活动预案】 5、游戏电竞比赛【不推荐，效果不好，停留差】
- name: 「二三线城市窗口期」市场红利论
  desc: 一线城市头部展会垄断官方 IP 与大咖资源，二三线城市存在巨大的「内容真空」与「消费能力释放」窗口；本地化运营、系列化品牌、轻资产模式可快速占据区域心智，构建护城河。
  excerpt:
  - 目前整体行业的市场，主要以一线大中型活动为主，二三线相对来说小型活动居多，规模相对会小一些，且大部分活动缺乏有效的运营和活动组织能力，也是我们的主要切入点。
  - 大展商都不会考虑小活动做营销...对比单地区的转化效果而言，也是得不偿失的
  - 通过不断的做系列活动，占据当地活动生态，当有了一定的忠实粉丝，模式成熟后，再提升到体育馆级别
- name: 「主持人即流量调度员」现场运营论
  desc: 优秀主持人不是单纯报幕员，而是全场人流、气氛、商业利益的平衡器：通过节奏控制留住人流、通过互动分流人群避免舞台挤占商摊、通过预热维持期待值、通过 Solo
    兜底风险；主持人水平直接决定小型活动生死。
  excerpt:
  - 舞台处最好配备一名专业的二次元主持...好的主持人不仅可以提高活动气氛，化尴尬为神奇，还能在拯救整场活动、幽默谈笑的同时，兼顾人流停留，与整体人群把控
  - 比如舞台太好，可能人群都围在舞台，商摊产品售卖少...当舞台不够热闹，内容少了，人跑的又快，人少了活动氛围就会变差
  - 全天的内容要分配均衡，做好当前活动的同时，还要持续预热接下来的活动，时刻保持着用户的期待
findings:
- name: 单场漫展营收实测区间
  desc: '[evidence] 作者从业五年组织 40 余场活动，合计服务 12w+ 人流，实测单场活动变现范围为 2-20 万元，覆盖酒店到博览中心全梯队。'
  excerpt:
  - 从业五年内组织活动 40 余场，合计总服务人流 12w+
  - AIGC +动漫 IP 快闪活动，单场活动变现 2-20W+策划经验分享
- name: 商场流量置换零场地费验证
  desc: '[evidence] 实操验证：商场有季节性引流刚需，漫展精准匹配年轻客群，可通过「活动引流换场地」模式实现零场地费合作，且成功案例可复制转介绍至其他商场，形成低成本扩张链。'
  excerpt:
  - 商场无合作费用，结合商场节日营销活动，可以进行流量置换
  - 开头合作好了一家，有了案例之后...后面基本上都会转介绍其他本地商场，且大部分商场资源都可以拿住
- name: 嘉宾邀请费用与流量转化失配实测
  desc: '[evidence] 实测大咖嘉宾单场邀请费 5k-15w，但因受众面窄、城市交通限制，实际带来的增量票务极低；结论：小中型活动嘉宾 ROI 为负，不应作为营收手段。'
  excerpt:
  - 大部分嘉宾的邀请费用在单场 5k-15w 左右不等；部分嘉宾自带流量，但是当地因为其来活动的，基本上不会有太多人流(一方面是受众人群面小，另一方面跟城市交通有关)
  - 如果把它作为“增加门票营收”的一部分，基本上是不用想了
- name: AIGC 生成周边成本降维打击验证
  desc: '[evidence] 对比传统约稿（单张百元至千元、周期长），AIGC 实现「Prompt/垫图 -> 批量生成 -> PS 修图 -> 打样」全流程，生产成本趋近边际成本零，周期压缩至天级，已跑通商业闭环并形成红利期。'
  excerpt:
  - 在没有 AI 之前，一般是由自己的美术设计团队创作内容，或者专门联系画师进行商业约稿，确定商用价格，然后再联系生产商...生产周期跟生产成本这块，有了极大的提升
  - 根据我其他业务的反馈，包括行业里已经产生的案例，基本确定了这块的可操作性，和之后的发展方向，未来会有一段红利风口期
- name: 志愿者「好人/坏人」培训机制有效性
  desc: '[evidence] 实操中引入「执行长扮坏人批评、区域长扮好人安抚」的戏剧化培训手段，有效解决志愿者执行力不足、管理松散问题，建立「恩威并施」的现场纪律体系。'
  excerpt:
  - 我们通常还会有一个“好人&坏人”的角色扮演过场，由现场执行作为“坏人”，区域负责作为“好人”。主要针对区域管理者无法有效管理区域人员...以此来作为一个“反面案例”
  - 一个好的执行人员，在整场活动中，一定是恩威并施的，既让人尊敬，又让人害怕，这就是一个很好的状态
- name: 小型活动舞台节目量阈值发现
  desc: '[evidence] 实测舞台节目数量 20-40 个（约 3 小时内容）是维持 4.5 小时舞台不冷场的临界阈值；低于 8-15 个节目必须依赖专业主持人
    Solo 救场，否则人流流失导致氛围崩塌、商摊投诉。'
  excerpt:
  - 一场活动的舞台 live 数量，大概有 20-40 个 live 节目，也就是 3 个小时（总的是 4.5 小时）只要表演节目足够多，你的舞台容错率就会很高
  - 舞台活动只有 8-15 个节目表演，远远满足不了舞台内容的填充（这种情况常发生于小型活动中）；这时候就需要依托主持人的专业能力...进行大时长的现场互动
