  name: 平台视角降维 —— 用底层逻辑碾压表层技巧
  points:
  - '**为什么需要这个概念？**'
  - '- 运营者容易在无数细节中打转，效率低下'
  - '- 需要一条能“一劳永逸”解决战术困惑的元认知原则'
  - '**核心定义**'
  - '- 平台视角降维打击论：掌握平台产品经理视角的底层逻辑，能够自动推导出大量具体战术层面的最优操作，避免在低性价比的“玄学细节”上盲目试错，是指导推文、引流、店铺等业务的元认知原则'
  - '**关键性质**'
  - '- 解释力强：能解释为什么某个动作有效或无效'
  - '- 预测力强：平台规则变化时能预判新机会/新限制'
  - '- 反玄学：屏蔽“发布时间”“标点符号”等无效细节'
  - '**典型例子**'
  - '- 小说推文中，用平台视角设计“找后续”话法和关键词，而不是纠结发布技巧（20230613_171）'
  - '- 从平台风控逻辑出发，提前规避群禁言、自动撤回等灰产工具的封杀风险'
  - '**边界条件**'
  - '- 平台视角需要持续更新，不能吃老本'
  - '- 仅作为分析方法，不能替代对用户需求的理解'
  - '- 底线是合法合规，不是鼓励对抗平台'
  sources:
  - paper: docs/202306/20230613_171.md
    role: origin
  excerpts:
  - 在做一些关键节点的动作之前，先来假设“如果我是 XX 平台的产品经理，那我会如何限制/引导此类行为”，很多对应解决办法咱们自己就能想出来的。
  - 不管是小说推文，还是小红书店铺等项目，我们往往会钻到一个细节中... 所以，在做一些关键节点的动作之前，先来假设“如果我是 XX 平台的产品经理...” 很多对应解决办法咱们自己就能想出来的。
