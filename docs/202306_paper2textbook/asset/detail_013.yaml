  name: FOMO与钻石手 —— 新赛道最大的两个隐形杀手
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人在新赛道不是没赚到钱，而是赚到了又亏回去'
  - '- 需要识别毁掉收益的两个心理陷阱：FOMO追高和钻石手死拿'
  - '**核心定义**'
  - '- FOMO与钻石手杀手论认为，新赛道从0到1爆发、上交易所、FOMO到顶点的周期中，最大风险不在于买早买错，而在于卖不掉/停不下来——FOMO导致高位接盘，钻石手导致拒绝止盈、把账面利润还给市场'
  - '**关键性质**'
  - '- 幸存者偏差：同群中有人赚钱，更多人靠死拿错过卖出窗口'
  - '- 情绪驱动：价格上涨时贪婪，下跌时恐惧'
  - '- 纪律可解：提前设定分批止盈和移动止损'
  - '**典型例子**'
  - '- 作者群里不止一个“钻石手”拿着数十万美金的铭文，暴跌后大幅缩水（20230613_168）'
  - '- BRC20代币陆续上交易所后，FOMO顶点后故事结束（评论区）'
  - '**边界条件**'
  - '- 主要适用于高波动、高透明的加密市场，但也适用于其他资产'
  - '- 并非所有长期持有都是钻石手，关键看是否有计划'
  - '- 需要区分“投资逻辑”和“赌徒心态”'
