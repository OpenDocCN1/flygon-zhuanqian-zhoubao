  - '- 期权思维：亏损有限，收益无限'
  - '- 纪律优先：分批止盈锁定本金+移动止损跟踪利润'
  - '- 成本极低：早期参与成本往往只有Gas费、域名费等'
  - '**典型例子**'
  - '- BRC20早期铸造ORDI/SATS，成本仅为Gas费，3个月锁定300万（20230613_168）'
  - '- Amazon联盟站建站成本不到$100，验证成功后放大（20230613_240）'
