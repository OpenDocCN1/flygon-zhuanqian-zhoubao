  name: 执行力杠杆 —— 为什么小白赚钱靠的是行动密度
  points:
  - '**为什么需要这个概念？**'
  - '- 新手常以为赚钱靠聪明和策略，但真实案例表明行动密度更关键'
  - '- 需要把“执行力”变成可量化的首要杠杆'
  - '**核心定义**'
  - '- 执行力是新人变现的唯一核心杠杆：对于认知不足的小白，立即行动、极速闭环、持续迭代比项目选择更重要；赚钱不是偶然，而是高密度执行的必然结果'
  - '**关键性质**'
  - '- 紧迫感：看到机会当天就执行，不拖延'
  - '- 迭代频率：每日复盘、持续优化'
  - '- 投入强度：全职或高强度投入才能在早期突破'
  - '**典型例子**'
  - '- 纸鸢5月17日看到精华帖立即下场，两周收入1W+；任平生评价“执行力很强，赚到钱绝非偶然”（20230613_169）'
