paper: docs/202306/20230613_207.md
desc: 该素材分享了一款名为 LeiaPix Converter 的免费 AI 工具，能将 2D 图像转换为 3D 立体动态效果，并展示了结合 ChatGPT（撰写故事/脚本）、Midjourney（生成关键帧图像）与
  LeiaPix（生成 3D 视频片段）的完整 AI 视频制作工作流，适用于动态壁纸、头像、广告及短视频创作等场景。
concepts:
- name: LeiaPix Converter
  desc: 一款可将 2D 静态图像转换为 3D 立体动态视频效果的在线 AI 工具，核心优势为完全免费且输出效果逼真。
  is_original: false
  excerpt:
  - 又发现一个宝藏工具，LeiaPix Converter，可以将图像 2D 转换为 3D 效果。关键的是目前完全免费。
- name: AI 视频制作工作流
  desc: 一种串联大语言模型、文生图模型与 2D 转 3D 模型的端到端视频内容生产流程，实现从文本创意到立体视频成片的自动化/半自动化生产。
  is_original: true
  excerpt:
  - 首先，使用 ChatGPT 创作一段小故事。接着，将该故事转化为视频脚本，并将其分割为各个镜头。通过镜头描述，运用 Midjourney 提示词来绘制每个画面的想象图，然后将每个画面输入
    LeiaPix，将 2D 图像转变为 3D 立体效果的视频。重复这个过程，直到得到所有 3D 画面的视频。最后，将所有视频片段连接在一起，并添加字幕进行朗读。同时，为视频添加背景音乐以增添氛围。
methods:
- name: __overview__
  desc: ChatGPT + Midjourney + LeiaPix 组合拳制作 3D 视频的标准化操作流程（SOP），包含故事创作、脚本分镜、提示词工程、图像生成、3D
    转换、后期合成六大步骤。
  excerpt:
  - 1. 使用 ChatGPT 创作故事。
  - 2. 将故事转化为视频脚本并分割镜头。
  - 3. 根据镜头描述编写 Midjourney 提示词绘制画面。
  - 4. 将生成的 2D 图像导入 LeiaPix 转换为 3D 视频。
  - 5. 重复步骤 3-4 获取所有片段。
  - 6. 剪辑软件（如剪映）连接片段、添加字幕、配音、背景音乐。
theorems:
- name: 多模态 AI 工具链降低 3D 视频创作门槛
  desc: 通过组合文本生成、图像生成、深度估计/动效生成三类基础模型能力，非专业用户也能零成本、低技术门槛地制作出具有商业级视觉效果的 3D 动态视频内容。
  excerpt:
  - 应用场景也非常广泛：动态壁纸，动态头像，动态 logo，广告等等方面。
  - 关键的是目前完全免费。
  - 完整过程移步飞书文档...做一个视频
findings:
- name: 工作流实操可行性验证
  desc: '[evidence] 作者已按该工作流完整制作出成品视频，并输出飞书文档记录全过程，证明该工具链在短视频/中视频制作场景下的工程落地可行性。'
  excerpt:
  - 本文中也有一个小实战案例：ChatGPT + Midjourney + LeiaPix 实操做一个视频
  - 完整过程移步飞书文档：https://esouqpttmy.feishu.cn/docx/V3NWdI08Yo4R9lxcIdScEMwanWb
- name: 商业化应用潜力获社区认证
  desc: '[claim] 评论区专家用户（施霖）判断该玩法适用于‘中视频和短剧 CPS’变现赛道；[claim] 亦仁（知识星球主理人）将帖子加精华，侧面印证该方法论在内容创业圈的高认可度。'
  excerpt:
  - '施霖终生学习者-链接 : 这套玩法很厉害👍🏻做中视频和短剧 CPS 都应该可以'
  - '亦仁 : 感谢分享，已加精华。'
- name: 后期合成工具链互补性
  desc: '[evidence] 作者回复指出 LeiaPix 输出的视频片段需导入剪映等剪辑软件进行字幕动画、图标添加、片段拼接等后期处理，揭示了单点 AI
    工具与完整视频制作管线的衔接需求。'
  excerpt:
  - '元峰 : 我是 PS 做好图，导入剪映，添加动画。也可以直接用剪映做。'
