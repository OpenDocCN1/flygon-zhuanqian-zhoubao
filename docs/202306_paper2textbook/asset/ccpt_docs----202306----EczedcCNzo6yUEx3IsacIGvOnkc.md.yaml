desc: 该素材是一篇由生财有术社群成员‘七小’整合的万字长文，系统梳理了‘信息差’这一商业核心概念的道、法、术、器。文章从‘让价值流通本身就是价值’的底层逻辑出发，阐述了信息差的本质是圈层差，并提出套利三要素（信息差、低成本、确定性）；详细列举了挖掘商机的11个渠道、关键词挖掘、资源搜索等方法论；通过U盘代购、游戏Bug套利、会计继续教育代办、康师傅调研做空、ICP年检代办等20余个实战案例，演示了‘买卖信息差’、‘搬运聚合信息差’、‘利用平台规则/时间差/地域差’等多种变现模式；总结了‘强制即商机’、‘语言即能力差’、‘代/破/免关键词即生意’等核心心法，并提供了大数据平台、航海工具包等工具资源，旨在帮助普通人通过认知迭代找到赚百万的机会。
concepts:
- name: 信息差
  desc: 素材核心概念，定义为‘圈层之差’。社会越发达、圈层越多，信息差获利越容易。本质是让价值在不同圈层间流通，流通本身即价值。
  is_original: false
  excerpt:
  - 所谓信息差，本质上是圈层之差，如果你不能理解圈层，你就理解不了信息差
  - 让价值流通，本身就是一种价值
  - 社会圈层被解构成无数个小圈子，触达所有圈层的难度增大了，流通的价值也就增大了。信息差里的‘差’，就‘差’在这里。
- name: 套利思维
  desc: 利用信息差赚钱的核心思维模型，包含三要素：信息差（蓝海/规避竞争）、低成本（时间/资金成本最小化）、确定性（利润空间大+已有人跑通模式）。强调‘无套利不创业’、‘不专业的人选品，专业的人选模式’。
  is_original: true
  excerpt:
  - 套利三要素，即：信息差、低成本、确定性
  - 不专业的人选品，专业的人选模式；先变专业，再变有钱。
  - 中小创业者请记住：无套利不创业。
- name: 信息差获利三类型
  desc: 白一喵提出的信息差提供价值的三个层级：1. 提供信息 - 解决‘我知道你不知道/认知不同/信息分散’（整合信息、让信息有序）；2. 提供知识 - 解决‘知如何做’，指导达成结果，需设定具体沟通对象决定颗粒度；3.
    提供知识架构/规律模式 - 提供全局观，收集整理专业书/经典教材/客观规律并说懂。
  is_original: true
  excerpt:
  - 【类型1】提供信息（know-what）... 我在消除信息垄断... 认知垄断... 帮你节省时间
  - 【2】提供知识（know-how）... 能够解决问题，指导别人达成结果的信息，才是真正的知识
  - 【3】提供知识架构（structure）和规律模式（pattern）... 集中精力做事的人，容易不小心忽略全局。
- name: 红利期信息差
  desc: 快速致富的核心路径：①找到红利行业（流量簇拥地，易获客）；②找到红利内部的信息差，贩卖给新进场者（卖软件/服务/培训，稳赚不赔）。强调‘玩法注定是一时的，但是信息差的贩卖是长久的’。
  is_original: true
  excerpt:
  - 想快速致富，①找到红利行业... ②找到信息差：你只需要找到这里面的一些信息差，然后卖给新进场的人既可。
  - 稳赚不赔：卖信息差（软件/服务/培训等等）我不做这个事情，但是我教育市场。
  - 玩法注定是一时的，但是信息差的贩卖是长久的。
- name: 价格不透明产品套利
  desc: 针对二手/非标品（如二手家电、奢侈品、文玩）因比价困难、客户比价成本高而形成的信息差空间。核心策略：高客单价+比价困难=高利润+低竞争。
  is_original: true
  excerpt:
  - 2.除了客单价高，还需要选比价困难的二手产品，比如电器产品，二手冰箱，二手洗衣机，二手空调。
  - 选比价困难的二手产品的依据是避开客户比价，和同行对比竞争。
- name: 生财势能公式
  desc: 沐文总结的把握机会逻辑：风向（热点、政策、趋势、节点、时间）-> 需求 -> 内容（流量） -> 产品 -> 转化率 -> 赚钱。强调势能窗口期小、稍纵即逝，需结合风向标、跟对人做对事。
  is_original: true
  excerpt:
  - 风向（热点、政策、趋势、节点、时间）--需求--内容（流量）--产品--转化率--赚钱
  - 大部分的势能窗口期往往很小，机会稍纵即逝，只有个别风向势能有可能成为现象级的存在
- name: 信息差演进路径
  desc: 李晨/亦仁总结的商业机会演进逻辑：发现信息差 -> 早期圈资源做规模 -> 阶段性/区域性垄断细分市场（垄断核心要素资源） -> 认知层垄断（做品牌，形成市场共识）
    -> 参与制定底层商业规则（行业标准，巨无霸级别）。
  is_original: true
  excerpt:
  - 商业机会都是从发现信息差开始，然后早期进入市场的人开始圈资源做规模... 再来就是从具体的资源性垄断到认识层垄断也就是做品牌... 最后就可以参与制定底层的商业规则。
- name: 强制性即商机
  desc: 七小总结的核心洞察：无论强制实行（如电动车戴头盔）还是强制禁止（如禁TikTok），强制意味着强行分配资源，形成刚需，必然催生信息差生意（代办、替代品、新渠道）。
  is_original: true
  excerpt:
  - 强制要求，无论是强制实行（电动车戴头盔），还是强制禁止（美国禁止tiktok），强制就是商机。
  - 许多法规本身就带有强制性，强制性意味着强行分配资源 ，这就形成刚需。——圈友maros
- name: 关键词生意模版
  desc: 七小总结的特定关键词即代表成熟的信息差生意模式：'代'字头（代办、代下、代购、代注册、代充）、'破'字头（软件名+破解版）、'免'字头（免登录/免会员/免魔法）。核心是掌握上游渠道或工具下载渠道。
  is_original: true
  excerpt:
  - 有很多词，一听就是信息差生意了。代：代办、代下、代购、代注册、代充... 破：软件名+破解版 免：软件名+免登录/免会员/免魔法
  - 这些生意，人家能做，无非就是人家比你多知道一个软件下载的渠道、一个上游渠道而已。
- name: 语言能力差
  desc: 语言（人类语言/编程语言）是巨大的能力护城河。精通英文可搬运国外内容/发现商机/做跨境；精通Python等可开发爬虫/自动化工具提效/捞外网流量。语言即打开新世界的大门。
  is_original: true
  excerpt:
  - 语言是一种很大的能力差，许多互联网生意，都可以换个语言重新做一遍。无论是人类语言、还是机器语言。
  - 精通Python等编程语言，你可以用爬虫、发帖、数据分析等工具提高做事效率... 也可以开发一些工具去外网捞流量。
- name: 认知差
  desc: 老黄牛提出的高阶信息差：利用实时大数据（如生意参谋电商销量数据）先于市场/分析师发掘潜力公司（股市布局）、识别趋势。核心是‘用数据提前发掘’，数据源比财报更实时、范围更广。
  is_original: true
  excerpt:
  - █【分享一、利用电商后台数据，先于市场发掘潜力公司】
  - 分析师和基金经理往往是看到一家企业的财报数据后才去调研分析，所以往往滞后于实时数据。
  - 用生意参谋数据更准确，范围更广更方便。
- name: 打压/禁令即替代机会
  desc: 老黄牛提出的政策/平台打压视角：主流平台/巨头打压（如淘宝打假、TikTok被禁）会催生替代品（拼多多、Likee）和新渠道的红利期。核心是关注‘被压制方’和‘替代方’的早期机会。
  is_original: true
  excerpt:
  - 拼多多恰恰趁淘宝打假的时间，抢占了低价市场...
  - 假如tiktok被禁，更早进入替代产品的就有先发优势。
  - 持续关注信息背后的源头，大概率能再发现重磅消息。
- name: 资源差
  desc: knight提出的寻找‘人无我有’的垄断/壁垒生意。好生意模型：关注低、产品少、转化高、竞争少、毛利大（满足3个即可）。通过副业战场验证，寻找独家上游、独家渠道、独家资质等不可复制资源。
  is_original: true
  excerpt:
  - 我理解的好生意，至少应该包括以下5个特征中的3个：关注低、产品少、转化高、竞争少、毛利大。
  - 寻找有垄断和壁垒的生意，也就是人无我有，而不是人有我优。
methods:
- name: __overview__
  desc: 素材整体方法论：基于‘圈层差’视角，通过‘渠道挖掘+关键词监控+资源搜索’发现信息差，利用‘套利三要素’筛选机会，采用‘搬运聚合/代办中介/工具赋能/红利期贩卖教程’等模式变现，最终向‘品牌垄断/规则制定’进阶。
  excerpt:
  - 信息差之道（底层逻辑） -> 信息差之法（方法论：挖掘/利用/筛选/进阶） -> 信息差之术（20+实战案例） -> 信息差之器（工具箱） -> 总结拓展（认知差/资源差）
- name: 商机挖掘11渠道法
  desc: 老成总结的系统性找项目渠道：1.朋友圈 2.跟同行要项目 3.平台热榜 4.APP下载平台 5.平台数据 6.保持好奇心 7.中外联合 8.投诉网站/防骗博主
    9.保持敏感度 10.付费栏目 11.圈子。核心战术：导航站找同行、监控竞品数据异动反推打法、‘一抄二改三复制四改命’、截图保存赚钱项目。
  excerpt:
  - 一、朋友圈 二、跟同行要项目 ... 十一、圈子
  - 太阳底下没有新鲜事，同行是我们找项目的第一渠道。
  - 一抄二改三复制四改命。记住这个截字诀：看到赚钱项目截过来呗。
- name: 关键词挖掘大法
  desc: 梨云提出的利用数据工具（如千瓜数据）挖掘‘显性需求词’（求图、跟团、怎么领）反推商机：搜评论区高频需求词 -> 定位爆款笔记/产品 -> 摸清变现模式
    -> 评估收益 -> 复制执行。
  excerpt:
  - 【求图】【跟团】【怎么领】这些评论区里直白的需求表达，对应的不就是商机满满的笔记。
  - 把上面三个需求词，放到千瓜数据的按笔记评论搜索，顺藤摸瓜找到了笔记、对应的产品或服务。
- name: 资源搜索术
  desc: 淼淼提供的资源获取技术体系（原文为图片展示，含搜索指令、资源站、工具箱等），用于快速定位所需软件、教程、素材、渠道等上游资源。
  excerpt:
  - （原文为图片展示资源搜索思维导图/工具体系，包含搜索指令、常用资源站、下载工具等）
- name: 信息搬运聚合法
  desc: 亦仁实操案例复盘的标准化流程：1.寻找源平台优质内容（快手/火山视频） 2.联系作者获授权 3.聚合加工（拼接成长视频） 4.分发目标平台（腾讯视频/公众号）
    5.引流变现。核心：解决‘用户切换成本高’、‘跨平台用户不重合’、‘用户猎奇心理’。
  excerpt:
  - 1. 找到有意思的视频，联系快手po主获取到对方授权； 2. 将该播主的几十个短视频拼接成一段长视频； 3. 将长视频长传到腾讯； 4. 写一篇文章简单介绍该播主并内嵌该视频到文章；
    5. 分享传播该文章； 6. 每篇文章介绍一个快手玩家。
- name: CPA拉新聚合模式
  desc: 三米实操的聚合变现模式：汇集200+ APP拉新任务（总佣金3000+），统一对接结算审核（非悬赏模式），搭建分销体系。核心：整合碎片化CPA任务
    -> 标准化SOP -> 降低推广者门槛 -> 赚取渠道差价/团队管理费。
  excerpt:
  - 目前我们汇集了市面上200+优质正规拉新推广任务，总佣金保持3000+以上。
  - 平台任务采取统一管理模式（非悬赏和商家模式），所有任务对接结算和审核都是我们商务和客服团队负责。
- name: 国内代购/地域套利模式
  desc: 星星案例：利用一二线城市（杭州）有折扣店/奥特莱斯而三四线县城无此资源的地域差。流程：定人群（宝妈） -> 定品类（童装：高频、低售后、利传播） ->
    定供给源（杭州折扣店） -> 微信社群分销 -> 后期转淘宝店/品牌化。
  excerpt:
  - 破局点就这么出来了：国内代购
  - 最终我们选择了童装作为切入口，原因有以下几点：1.大方向上，当时二胎放开... 6.自己有孩子，也经常关注童装的信息。
  - 一查，相比于全国的城市数量，折扣店的数量真的是寥寥啊
- name: 游戏规则漏洞套利法
  desc: 喵一布案例（Z操作）：1.新游戏上线即研究规则吃透 2.发现数值/兑换逻辑Bug（如时装分解利润166%、可乐兑换码100%中奖） 3.低成本验证(小额试错)
    4.规模化执行/外包给他人 5.风控止盈（未All in，卖小票锁定利润）。核心：帮大佬‘偷懒/规避风险’收费。
  excerpt:
  - Z发现有个材料叫高级衣料，然后某件时装可以分解出3个高级衣料... 靠着不断充值买时装分解赚的利润有166%
  - 因为这个活动设计上有bug，只要有库存就可以百分百的中奖。
  - 在赚钱的路上帮助别人偷懒是很好的赚钱手段，你只要帮助用户偷懒了，用户就能为你的价值付费
- name: 校园/封闭环境电商套利模式
  desc: 亦仁/夏畠案例：利用封闭环境（学校/咸鱼早期）信息封锁与淘宝价格差。流程：淘宝低价进货 -> 线下/平台高价出售 -> 招募代理/同学分销 -> 先货后款建立信任
    -> 谈上游降价/垫资 -> 垂直品类扩展(U盘/耳机/手机/老物件)。
  excerpt:
  - 偶然发现学校门口店铺的U盘卖100多块，淘宝上只要几十块钱，发现套利机会。
  - 为了打消代理的顾虑，给他们先卖货后付款。
  - 我是利用了淘宝的一个功能拍照识物... 进价真的是非常的低廉，只有2位数，那些商贩偶尔也能卖出四位数的价格。
- name: 专业资质/流程代办模式
  desc: 蕣/北封/冲冲冲/亦仁(ICP)案例：利用‘强制要求’（继续教育、ICP年检）或‘复杂流程’（租车、海底捞权益、话费慢充）+‘专业渠道/内部渠道’
    -> 标准化SOP（收信息->下单上游->交付） -> 精准社群/私域转化。核心：售卖‘确定性’与‘节省时间’，而非单纯服务。
  excerpt:
  - 万一错过了没完成继续教育，那么对于日后聘用职称就很受影响... 这不就成为了一个信息差吗？
  - 实际上，提交年检材料也不是很难，他们打了个信息差，转化应该不会差。
  - 话费慢充... 基本每单赚3-4元... 拿到话费90左右，出单的话93-94
- name: 跨语言/跨境搬运套利模式
  desc: Jack/fisher/BerryJon案例：利用中外语言/平台/认知差。1.帮老外做中文生意（翻译/设计/上传国内视频/刷量）反向用淘宝/猪八戒履约赚差价。2.低价电影票聚合（银行权益/会员卡/供货商）解决异地/账号限制技术难题。3.AI动态老照片（抖音风口）利用技术门槛差收徒/卖软件/代制作。
  excerpt:
  - 利用信息差可以两边赚钱... 帮老外翻译，配音，设计logo... 没有技术我们有猪八戒和淘宝呀！
  - 作为中间人，有两种模式：一种是拿到客户订单之后找有资源的人代下... 另一种模式是自己批量购买优惠券，然后自己直接代下。
  - 这股风就是我在抖音里带起来的哈哈。
- name: 数据驱动选品/投资法
  desc: 老黄牛方法：利用生意参谋/大数据平台(Apptopia/七麦/199it)实时销量数据 -> 搜索产品词/品牌词 -> 识别‘高销量但股价未反应’的二三名品牌/区域龙头/细分龙头
    -> 提前布局股票或电商选品。核心优势：数据比财报早、比调研广。
  excerpt:
  - 在生意参谋输入某一个产品词... 看看里面成交的数量。假如成交数量很大，但并没有显示在二级市场的股价上，这就是一个大机会。
  - 用生意参谋数据更准确，范围更广更方便。
  - 大数据平台导航：https://bigdata.ttdh.cn/
- name: 微信版本时间差引流法
  desc: 谭庆波案例：利用大应用(iOS先行/安卓滞后)版本更新时间差 + 全网热点造势(微博/知乎热搜) -> 獲取内测版安装包 -> 多平台分发(知乎/公众号/简书/CSDN)引流私域
    -> 接广告/卖课变现。核心：蹭官方流量红利，卖‘安卓用户想要的先体验’。
  excerpt:
  - 新版本的微信最先是在ios系统上发布... 安卓用户只能羡慕嫉妒恨。
  - 我在第一时间写了一篇关于微信新版本的文章，并且分享了安卓版本的下载地址... 涨了1w多粉丝... 直接收入超1.5万块。
  - 不止是微信，其他任何用户量比较大的应用，都可以用这么方式引流。
- name: 抢购/撸货标准化流程
  desc: 探鹿人·德柯总结的成熟产业化流程：监控大促节点(双11/618) -> 覆盖品类(茅台/潮玩/数码/票务/黄金/茶叶/数藏) -> 技术手段(脚本/云手机/团队)抢购低价/赠品
    -> 闲鱼/回收商/批发商出货。分类管理：稳定低保类(数码) vs 高利高风类(潮玩/茅台)。
  excerpt:
  - 抢购是个行业... 总体有以下几个类别：文娱票务类、电子数码、酒类、潮玩类、收藏属性类、美妆产品、茶叶类、宠物用品、数字藏品、其他。
  - 数码产品是属于稳定搬砖吃低保类型的类目... 潮玩类... 利润相对来讲也非常丰厚。
- name: 康师傅调研做空模式(高阶金融套利)
  desc: 镌刻时光案例：机构雇佣实习生 -> 电话调研终端销量(话费激励) -> 聚合全国真实销量数据(信息差) -> 对冲基金提前得知业绩 -> 股市做多/做空获利巨额。成本：百万话费/服务费；收益：亿级资金博弈。展示了‘一手信息’在资本市场的极致杠杆价值。
  excerpt:
  - 用愉快的声音问好... 按照聊天时间给对方充话费... 我再一一记下... 那些105箱，247箱加加减减，我们就得到了当月康师傅和统一在全国的真实销量。
  - 有了这个数据，这个基金可以在港股市场用几十亿的资金，提前知道应该做多统一，做空康师傅。
  - 这就是信息的价值。
theorems:
- name: 信息差即产品定理
  desc: 信息差本身即产品，可直接转卖（卖教程、卖软件、卖渠道、卖服务）。普通人无法原创生产，核心路径即‘低买高卖’信息差产品。
  excerpt:
  - 赚钱的本质就是买卖。普通无法做到原创生产，那就做低买高卖。
  - 信息差，就是我知道，你不知道，我卖你教程，卖你软件。 教程和软件即是产品。
- name: 工具即商品/杠杆定理
  desc: 一切软件、工具、脚本、插件均可作为商品出售，或作为为人服务的杠杆（点几下搞定客户以为很难的事）。掌握工具下载渠道/破解/免登录技术即掌握生意。
  excerpt:
  - 信息差，就是我觉得很简单，你觉得很难，我帮你做。你以为我也很费力的去做？其实我有工具，点几下就搞定了。
  - 一切的软件、工具，都是可以卖的产品。抱着卖软件，以及使用软件为人提供服务的思路... 这是商品库，是你的金矿。
- name: 渠道即护城河定理
  desc: 你拥有的信息渠道决定你接收的信息上限。主动构建‘刷500网址、关注1000公众号、下载20+APP’的宽渠道体系，是普通人低成本建立持续信息差优势的唯一路径。
  excerpt:
  - 信息，通过不同的信息渠道流通，你拥有哪些渠道，就能接收到哪些信息。你有别人没有的渠道，你就掌握了大量的信息差。
  - 怎么做到掌握大量的信息差呢？先从刷500个网址、关注1000个公众号、下载10个内容app，下载10个电商app开始。
- name: 信息差永存定理
  desc: 没有什么事情人尽皆知。一切经验、技巧、知识、甚至常识，在特定圈层/时间节点/认知水平下，永远可能成为信息差。信息差生意长期主义成立。
  excerpt:
  - 没有什么事情人尽皆知，信息差永远存在，一切经验、技巧、知识、甚至常识，都可能是信息差。
findings:
- name: U盘校园代理案例
  desc: '[evidence] 亦仁2008年大二利用淘宝与校园实体店价差(几十vs一百多)，单人卖U盘日入百元，后组建‘大学生数码联盟’招代理覆盖周边高校，先货后款模式快速扩张，一年赚近10万第一桶金。验证了‘地域/认知差+分销裂变’模式可行性。'
  excerpt:
  - 第一次进的几十个U盘，一晚上卖空。
  - 成立了大学生数码联盟，分工明确... 拓展代理的手段很简单，就是公告栏贴广告，每天被撕，每天去贴... 给他们先卖货后付款。
  - 也帮我赚到了人生第一桶金：近十万块钱
- name: 游戏Bug套利案例
  desc: '[evidence] Z在《剑灵》上线期发现时装分解材料套利(投入30元卖80元，利润166%)及可乐兑换码Bug(3000元买可乐得300码，单码售2000-3000元)，通过小额试错验证后规模化操作，月入数万远超工资并辞职全职。验证了‘新平台规则漏洞+帮大佬偷懒’的高确定性套利路径。'
  excerpt:
  - 时装在商城只卖30元，但是3个高级衣料可以卖80元，靠着不断充值买时装分解赚的利润有166%
  - 因为这个活动设计上有bug，只要有库存就可以百分百的中奖... 一个兑换码的价格是2000-3000元... 核算下来大概能赚30-60万元
  - 迫于风险的压力，Z并没有把所有小票抽奖，只抽了10几张，剩余的小票以每张20元的价格卖掉了。
- name: 会计继续教育代办案例
  desc: '[evidence] 蕣利用淘宝下架‘代办’服务的政策红利期，以专业背景建立信任，在同学群发单条信息单晚引流100+精准用户，后裂变至18个500人群。对接淘宝原上游(100元)对外报价150元，单单赚50元仅耗3分钟(收款/整理表格/发上游)，年复购率高。验证了‘政策强制+渠道垄断+私域信任’的高利润长尾模式。'
  excerpt:
  - 淘宝都下架了... 这不就成为了一个信息差吗？当晚我就在我当时大学的会计大群里和班群里发了这么一条信息... 当晚好友就加了100多个
  - 操作一个赚50元，花费3分钟。现在已经加满18个群了，这些人每年都会继续找我办
- name: 康师傅调研做空案例
  desc: '[evidence] 对冲基金投入约百万成本(话费/实习生/服务费)，雇佣团队电话调研全国康师傅/统一终端销量，获得提前一个月的真实销量数据，指导港股几十亿资金做空康师傅做多统一。展示了‘一手终端数据’在金融市场上的极致杠杆价值(成本百万级撬动亿级博弈)。'
  excerpt:
  - 那个项目我们一个月给的话费在一百万左右... 几个实习生... 服务费... 仅此而已。
  - 有了这个数据，这个基金可以在港股市场用几十亿的资金，提前知道应该做多统一，做空康师傅。
  - 这就是信息的价值。
- name: ICP年检代办案例
  desc: '[evidence] 服务商通过浙江通管局公示的‘未年检名单’(4000+家)，逐个电话恐吓营销(不年检列入黑名单)，单价5000元，按1%转化测算单省收入25万。验证了‘公开公示信息+合规恐惧+非标服务’的标准化套利模型。'
  excerpt:
  - 去浙江省通信管理局查了下，消息属实，有四五千家公司忘记做年检，并给出了公司名单表格
  - 这家服务商挨个查到这些公司的号码，逐个通知... 5000家，按照1%的转化率，5000块的客单价，25万收入进账
- name: 微信8.0时间差引流案例
  desc: '[evidence] 谭庆波利用微信8.0 iOS先发/安卓滞后4天窗口期，获内测包多平台分发(知乎/公众号/简书/CSDN)，蹭官方热搜流量引流1万+精准粉，直接广告收入1.5万+，间接收益10倍。验证了‘大平台版本更新时间差+全网热点造势+多平台矩阵分发’的可复制性引流模型。'
  excerpt:
  - 在iOS系统发布微信8.0版本的第二天... 我用内测版安卓微信8.0引流了1w多粉丝，4天带来的直接收入超1.5万块，间接收入至少翻10倍。
  - 结果当天我的大号涨了2500多粉丝... 到今天是第五天了... 我已经通过利用iOS和安卓系统微信更新中间的时间差涨了1w多粉丝。
- name: 抖音动态老照片风口案例
  desc: '[claim] BerryJon声称‘这股风就是我在抖音里带起来的’，暗示该项目为其首创/主导。但素材未提供具体数据(GMV/收徒收入/软件销量)支撑其规模与盈利细节，仅作为‘信息差获利项目’的类型标注。'
  excerpt:
  - 今天主要来聊一聊：动态老照片——信息差获利项目。我猜经常玩抖音的朋友最近肯定被这个类型的视频刷屏... 这股风就是我在抖音里带起来的哈哈。
- name: 闲鱼老物件/古董套利案例
  desc: '[evidence] 夏畠利用合肥花冲公园旧货市场实地考察选品 -> 淘宝‘拍照识物’找同款低价货源(进价两位数/售价三四位数) -> 咸鱼早期红利期(同类少/审核松)发布
    -> 定价策略(198/298/398小单系统)快速出单。验证了‘实地选品+图搜溯源+平台早期红利’的非标品套利闭环。'
  excerpt:
  - 我是利用了淘宝的一个功能拍照识物... 进价真的是非常的低廉，只有2位数，那些商贩偶尔也能卖出四位数的价格。
  - 我算是无意中获得踏上了咸鱼的红利吧。
- name: 话费慢充聚合分销案例
  desc: '[evidence] matteo 2个月对接多渠道API(成本90元/充100元，售价93-94元)，通过朋友圈/微信群分销日单20-50单，累计2000单赚近1万。验证了‘高频刚需+多渠道比价/备用+私域分销’的稳健低保模式，且揭示了运营商/银行营销权益回收的巨大灰产链条。'
  excerpt:
  - 拿到话费90左右，出单的话93-94，基本每单赚3-4元... 累积下来2000单左右。
  - 三大运营商本身都会有各种话费折扣营销活动... 某些专门回收此类权益的商家会低价回收，然后通过批量转售或者代充值的方式销售。
- name: 生意参谋数据选股案例
  desc: '[evidence] 老黄牛利用生意参谋搜‘酱油’发现千禾味业(第二名)差异化定位高端，后股价大涨；搜‘九阳’发现品类扩张(破壁机/空气炸锅第一)验证成长性；搜‘牛奶’发现旺仔/燕塘细分龙头。验证了‘电商实时销量数据
    > 财报/调研’的认知差套利有效性。'
  excerpt:
  - 搜：酱油，第一名是‘海天酱油’... 第二名‘千禾酱油’... 千禾味业这家公司其实并不是很出名... 千禾味业直到2019年2月底市场才发现其价值，股价一路上扬。
  - 在生意参谋搜品牌名字：九阳... 第一破壁机，第二是豆浆机... 九阳其实以豆浆机为切入口，已经开发出很多产品线。
- name: 拼多多/TikTok替代品红利案例
  desc: '[evidence] 老黄牛复盘拼多多利用淘宝打假窗口期抢占下沉市场，类比TikTok被禁后Likee(欢聚时代/BIGO旗下)增长最快。验证了‘巨头打压/监管禁令
    -> 替代品崛起 -> 早期入场享受红利’的宏观周期规律。'
  excerpt:
  - 拼多多恰恰趁淘宝打假的时间，抢占了低价市场...
  - 在TikTok被国外封禁之后，增长最快的短视频应用，是一个叫Likee的短视频应用... 所属欢聚时代旗下BIGO。
  - 假如tiktok被禁，更早进入替代产品的就有先发优势。
