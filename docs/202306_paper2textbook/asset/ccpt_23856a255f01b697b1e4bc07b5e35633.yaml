paper: docs/202306/20230627_028.md
desc: 该素材是一篇针对新手（特别是受限于时间、需隐蔽操作的体制内人员）的视频号带货实操教程，核心主张通过「爆款开头+自主实拍」的混剪策略规避搬运判定并快速获取正反馈，详细拆解了爆款视频寻找、黄金前3秒复用、产品实拍替换的具体操作流程，并结合作者实测案例揭示了营销行为过重、道具景别单一导致搬运判定及申诉后流量衰减等平台风控规律。
concepts:
- name: 爆款开头复用策略
  desc: 将验证过的爆款视频前3秒（黄金前3秒）直接复用为新视频开头，利用其已验证的完播率优势奠定流量基础。
  is_original: false
  excerpt:
  - 爆款带货视频的开头是一定要用的，也就是视频的前几秒（学名叫黄金前 3 秒）
  - 为什么要用爆款的开头呢？因为爆过的视频是经过验证的，前三秒都没人看，视频的数据必然好不了，也不会有爆的可能性，相反，视频爆了，那么他的开头一定是有点东西的。
- name: 混剪加实拍模式
  desc: 一种折中的视频制作模式：保留爆款视频的高光片段（开头/爆点），将平庸片段替换为自主实拍的产品展示画面，兼顾效率与原创度。
  is_original: true
  excerpt:
  - 视频带货有混剪的方式，有实拍的方式，我选择了混剪加实拍的方式。
  - 具体做法：找你对标产品的爆款视频，对视频进行分析，将爆点保留，其他稀疏平常的部分用自己实拍的片段进行替换。
- name: 黄金前3秒
  desc: 视频前三秒的黄金留人时段，决定视频初始完播率与推流池级别，是爆款视频结构的核心组件。
  is_original: false
  excerpt:
  - 也就是视频的前几秒（学名叫黄金前 3 秒）
- name: 景别道具差异化
  desc: 通过变换拍摄景别（远全中近特）和道具场景，增加画面视觉差异，规避平台「搬运/低原创」算法判定。
  is_original: true
  excerpt:
  - 提示搬运这个是因为我拍摄时用的道具和景别变化不大，我把这样的作品发到另外一个账号上，导致判搬运
methods:
- name: __overview__
  desc: 新手视频号带货标准作业流程（SOP）：选品定品 -> 寻找对标爆款 -> 结构化拆解(保留开头/爆点) -> 实拍替换(展示产品/功能) -> 发布验证
    -> 风控应对(修改景别道具/申诉)。
  excerpt:
  - 具体做法：找你对标产品的爆款视频，对视频进行分析，将爆点保留，其他稀疏平常的部分用自己实拍的片段进行替换。
  - 实拍部分主要是展示产品，展示功能就行，主要是让观众老爷们知道你卖的是什么。
- name: 对标爆款挖掘法
  desc: 针对选定带货产品，在平台内检索同类目高点赞/高销量视频作为拆解对象，素材中提及具体操作指引见飞书文档。
  excerpt:
  - 讲到这里，问题来了，去哪里找爆款视频？（我是懂新手的，因为我也是个新手）
  - '[图片太多移步飞书](https://q2wnncqnyh.feishu.cn/docx/HSUadJ8omoJKLgxorrccStgTn8d)'
- name: 视频结构化重组法
  desc: 将爆款视频拆解为『黄金前3秒(必留)』、『中间爆点(选留)』、『尾部/平庸段(全替)』三层结构，仅保留高权重片段，其余由实拍填充。
  excerpt:
  - 具体做法：找你对标产品的爆款视频，对视频进行分析，将爆点保留，其他稀疏平常的部分用自己实拍的片段进行替换。
  - 爆款带货视频的开头是一定要用的...后面的片段就自己实拍
theorems:
- name: 正反馈最短路径定理
  desc: 对于资源受限新手，『复用验证过的爆款开头』+『低成本实拍补全』是获取平台初始流量推荐（正反馈）概率最高、试错成本最低的路径。
  excerpt:
  - 新手做视频号，如何快速拿到正反馈
  - 爆过的视频是经过验证的...视频爆了，那么他的开头一定是有点东西的。
- name: 体制内副业隐蔽性约束
  desc: 体制内人员从事副业需满足『隐蔽性』约束，直播因强实时、强曝光被排除，视频带货（异步、可批量、可匿名）成为唯一可行赛道。
  excerpt:
  - 作为一个体制内的人，你想搞副业，必然是悄咪咪的搞，那么你对直播这块就无缘了，于是我就选择了视频带货。
- name: 平台风控双重判定机制
  desc: 视频号风控包含『营销行为过重』（商业化特征过强）与『搬运/抄袭』（画面特征相似度高）两大独立判定维度，前者针对账号标签，后者针对视频指纹与跨账号重复投放。
  excerpt:
  - 15 万播放那个号提示说营销行为过重，另外一个号提示说，搬运
  - 提示搬运这个是因为我拍摄时用的道具和景别变化不大，我把这样的作品发到另外一个账号上，导致判搬运
findings:
- name: 申诉解封后带货流量归零实证
  desc: '[evidence] 作者实测：账号因搬运被限流后，按要求发布10条原创风景视频解封，解封后发布带货视频直接0播放，发布自拍风景视频仅有100+播放，表明账号权重已受不可逆损伤或带货标签被永久压制。'
  excerpt:
  - 解开后还有流量没？我之前做过测试，解开后，我又发了带货视频判搬运，然后发自拍的风景类视频 100 多的播放，带货类就是 0 播放，这两天还在测试
- name: 跨账号发布同质化内容触发搬运判定
  desc: '[evidence] 作者将同一批『景别道具变化不大』的混剪视频发布至不同账号，导致第二个账号直接判定搬运，证明平台搬运检测基于视频指纹跨账号比对，而非单账号内部去重。'
  excerpt:
  - 提示搬运这个是因为我拍摄时用的道具和景别变化不大，我把这样的作品发到另外一个账号上，导致判搬运
- name: 营销行为过重导致大号限流案例
  desc: '[evidence] 单条视频达15万播放的账号，因『营销行为过重』被平台限流，说明视频号对商业化变现节奏有隐性阈值，单纯追求爆款而非账号养成易触发风控。'
  excerpt:
  - 15 万播放那个号提示说营销行为过重
- name: 航海学员抄袭判定与恢复案例
  desc: '[claim] 评论区用户『愚小米』宣称：其航海学员视频13万播放被判抄袭，按要求发10条原创视频后解封，但解封后流量仅两三百，怀疑视频质量影响。'
  excerpt:
  - 航海做了一个 13 万的播放，被判定抄袭，也是被禁了，让发 10 条原创视频，后来解了
  - 解开之后两三百的流量 可能是视频质量的关系
