paper: docs/202306/20230627_001.md
desc: 该素材为一期名为“龙哥赚钱周报”的付费社群周报索引文档，主要包含文档来源声明、更新频率说明、内容分类标记规则、版权保护提示及裂变邀请机制，不包含具体的商业案例、赚钱方法论或核心观点实质内容。
concepts:
- name: 龙哥赚钱周报
  desc: 一个定期更新的付费社群内部周报，作为商业风向标和赚钱信息聚合载体。
  is_original: true
  excerpt:
  - 🍳🚣230627 龙哥赚钱周报
  - 每周更新，龙哥风向标另外文档分享。
- name: 专属群
  desc: 发布该周报的核心付费社群，采用邀请制准入机制。
  is_original: true
  excerpt:
  - 如果感觉专属群有价值，可以邀请朋友进群。
methods:
- name: __overview__
  desc: 周报编制与分发方法论：每周固定更新；采用【中括号】分类标签体系组织内容；帖子包含点赞数、精华标识、评论图片等元数据；实施严格的版权管控（请勿外流）与裂变增长策略（邀请好友）。
  excerpt:
  - 每周更新，龙哥风向标另外文档分享。
  - 【中括号】为分类，帖子内含点赞数和是否精华帖，带评论图片等。
  - 请勿外流，防止失效。如果感觉专属群有价值，可以邀请朋友进群。
theorems:
- name: 信息不对称与社群壁垒价值
  desc: 核心主张：高质量商业信息（风向标）具有稀缺性，需通过付费社群（专属群）与版权管控（防外流）构建壁垒，并利用现有成员裂变扩张影响力。
  excerpt:
  - 龙哥风向标另外文档分享。
  - 请勿外流，防止失效。如果感觉专属群有价值，可以邀请朋友进群。
