life_analogy:
- 想象平台视角逆向工程是一个**公司规则制定者的思维转换**：
- '- **你** = 新入职的员工/商家'
- '- **平台产品经理** = 制定游戏规则的老板'
- '- **限制逻辑** = 公司手册里的禁忌条款'
- '- **引导逻辑** = 公司奖励谁、惩罚谁的机制'
- '- **最优操作路径** = 在不违规前提下拿奖金的捷径'
- 就像懂了公司考核逻辑的员工能避坑拿奖，懂了平台底层逻辑的运营者能避开风控拿流量。
