learning_targets:
- 理解平台视角逆向工程法，从产品经理视角反推最优操作路径
- 掌握知乎AI+SEO寄生虫流程，利用高权重平台获取搜索流量
- 理解GPT反向教学范式，让模型先教会人再由人教模型
- 掌握小红书引导模板思路，用模板化提示词降低新手创作门槛
- 理解小红书创业女粉图文矩阵引流的精准获客逻辑
- 掌握珠宝高客单价私域闭环的粉丝量与变现额解耦法则
- 理解小红书电商直营团队模型从搬运到自有供应链的演进
- 掌握玄学赛道高客单变现范式中的价值+信任公式
- 理解小红书电商起号SOP中权重先行与爆款为王的核心
- 掌握本地旅拍摄影师低粉高变现的精准流量转化逻辑
