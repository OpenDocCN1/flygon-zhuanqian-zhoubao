exercises:
- 'no': 1
  title: 平台视角逆向工程实战
  contents:
  - 假设你是小红书或抖音的产品经理，针对‘留微信号引流’这一行为：
  - 1. 你会设计哪些风控限制？
  - 2. 你会通过什么机制引导商家付费获客？
  - 3. 作为运营者，在不触发风控前提下，如何设计最优引流动作？
  - 回答问题：
  - '- 如果平台升级OCR识别，隐写式图片还安全吗？'
  - '**- 为什么‘私信即红线’比群聊引流更危险？**'
- 'no': 2
  title: 知乎AI+SEO手写一篇
  contents:
  - 选择一个你熟悉的细分业务关键词：
  - 1. 用知乎站内+5118+百度规划师挖掘3个长尾词
  - 2. 让ChatGPT生成草稿，按‘大纲式布局’插入关键词
  - 3. 人工进行‘人味儿化’改造（首尾加真实故事、口语化表达）
  - 4. 设计引流钩子（主页/内容/评论区）
  - 回答问题：
  - '- 站内推荐流量与百度搜索流量的考核指标有何不同？'
  - '**- 为什么量变优先于单篇极致质量？**'
- 'no': 3
  title: GPT反向教学三步走
  contents:
  - 选择一个你不熟悉的平台（如抖音/小红书）：
  - 1. 找一个结构化知识清单（如18个爆款密码）作为教材
  - 2. 让GPT扮演教练，向你提问并引导你掌握底层逻辑
  - 3. 待你具备判断力后，反向让GPT生成高质量内容
  - 回答问题：
  - '- 为什么直接将知识清单喂给GPT效果较差？'
  - '**- ‘人机协作能力对等定律’的核心含义是什么？**'
