theorems:
- name: 信息差致富普适性定理
  desc: 在生财有术社区语境下，凡系统学习并内化‘信息差’认知模型的普通人，均存在通过低门槛中介/分销模式实现百万级收益的概率机会。
  excerpt:
  - 看完之后，我觉得我理解了亦仁说的：在生财，人人都能有大机会赚到百万。
- name: 认知重构高于劳动强度原则
  desc: 商业收益的本质源于认知维度的信息不对称（视角一变），而非体力劳动的时间投入（辛苦挣钱），前者属‘弯腰捡钱’的杠杆收益。
  excerpt:
  - 看完之后，我就有两个感受：1、卧槽、卧槽、卧槽... 这哪里是辛苦挣钱？这真是弯腰就能捡钱呀。2、视角一变，商机无限。
