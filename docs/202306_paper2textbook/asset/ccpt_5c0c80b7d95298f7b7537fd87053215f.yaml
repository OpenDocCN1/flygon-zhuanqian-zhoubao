- name: 中间人经济为信息差主流变现形态
  desc: '[claim] 评论区高赞推荐书籍《中间人经济》，指出绝大多数信息差玩法本质是扮演中介角色（分销、转介绍、拉皮条），揭示了变现的底层结构同构性。'
  excerpt:
  - '小马哥 xy50 : 推荐一本书籍：中间人经济，绝大多数都是玩中间人这个角色，分销转介绍拉皮条都是如此'
