paper: docs/202306/20230613_004.md
desc: 该素材为一篇导读帖，作者七小通过阅读生财有术社区内100多篇关于“信息差”的精华帖，整理形成一份万字长文（托管于飞书文档），旨在揭示“信息差”赚钱的底层逻辑与实操路径，佐证亦仁“在生财人人都有赚百万机会”的观点，核心主张是认知视角转换后可将“辛苦挣钱”转化为“弯腰捡钱”的商机发现能力。
concepts:
- name: 信息差
  desc: 指认知、资源、渠道等维度的非对称信息，素材中将其定位为普通人低成本、高杠杆实现财富跃迁的核心抓手，属于社区内隐性知识的显性化提炼。
  is_original: false
  excerpt:
  - 今天的这篇整合贴的主题是【信息差】，想法起源于：在生财里，我听了 N 次信息差赚钱的说法，但是我并不理解，到底啥是信息差赚钱？怎么靠信息差赚钱？
  - 看完之后，我就有两个感受：1、卧槽、卧槽、卧槽... 这哪里是辛苦挣钱？这真是弯腰就能捡钱呀。2、视角一变，商机无限。
- name: 生财有术社区知识库
  desc: 指生财有术付费社区沉淀的精华帖、搜索引擎及会员共创的实战案例库，素材作者以此为原始数据源完成百篇级文献综述。
  is_original: true
  excerpt:
  - 为了弄明白这事情，我在生财搜索引擎里搜【信息差】这个关键词，又打开了 100 多篇精华帖来看。
  - 本文目录如图。正文移步飞书：https://mkfwp3u79v.feishu.cn/docx/EczedcCNzo6yUEx3IsacIGvOnkc
- name: 视角一变，商机无限
  desc: 素材核心心法概念，指通过重构认知框架（如从‘打工者视角’切换至‘中介/分销视角’），将原本不可见的信息差转化为可变现的商业机会。
  is_original: true
  excerpt:
  - 看完之后，我就有两个感受：1、卧槽、卧槽、卧槽... 这哪里是辛苦挣钱？这真是弯腰就能捡钱呀。2、视角一变，商机无限。
