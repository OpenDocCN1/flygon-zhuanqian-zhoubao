paper: docs/202306/20230613_171.md
desc: 该素材为一篇关于小说推文及引流实操经验的分享导读，核心主张是从“平台产品经理视角”反推操作策略，避免陷入低性价比的细节“玄学”，通过换位思考平台限制与引导逻辑，从而推导出高效的推文技巧与引流动作。
concepts:
- name: 平台产品经理视角
  desc: 一种换位思考的分析框架，指操作者设身处地假设自己是平台产品经理，从平台生态健康、风控规则、流量分发机制出发，反推自身操作的边界与最优解，而非单纯研究表层技巧。
  is_original: true
  excerpt:
  - 这次分享重点是要从“平台角度”。
  - 先来假设“如果我是 XX 平台的产品经理，那我会如何限制/引导此类行为”
- name: 低性价比动作/玄学操作
  desc: 指在缺乏平台底层逻辑认知的情况下，过度纠结于非关键细节（如特定发布时间、标点符号、玄学标签等），投入大量时间精力但边际收益极低甚至无效的操作行为。
  is_original: true
  excerpt:
  - 我们往往会钻到一个细节中，做一些性价比不是很高或者很“玄学”的动作，浪费了很多时间精力。
methods:
- name: __overview__
  desc: 核心方法论为“平台视角逆向工程法”：遇到关键决策节点时，暂停微观执行，切换至平台产品经理角色，推演平台的限制逻辑（风控、反作弊、内容分发）与引导逻辑（激励机制、流量扶持），由此反推当前环境下的最优操作路径。
  excerpt:
  - 在做一些关键节点的动作之前，先来假设“如果我是 XX 平台的产品经理，那我会如何限制/引导此类行为”，很多对应解决办法咱们自己就能想出来的。
theorems:
- name: 平台视角降维打击论
  desc: 掌握平台底层逻辑（产品经理视角）能够一劳永逸地解决大量具体战术层面的困惑，避免在战术层面盲目试错，是指导推文及引流等业务操作的元认知原则。
  excerpt:
  - 不管是小说推文，还是小红书店铺等项目，我们往往会钻到一个细节中... 所以，在做一些关键节点的动作之前，先来假设“如果我是 XX 平台的产品经理...” 很多对应解决办法咱们自己就能想出来的。
findings: []
