theorems:
- name: 壁纸赛道适合新手冷启动论
  desc: 壁纸号因内容标准化程度高、制作门槛低、用户需求刚性强（高收藏率），是兼职/新手低成本试错、快速跑通商业闭环的最优赛道之一。
  excerpt:
  - 虽然跟很多大佬动辄几十上百万的经历差了很多档次，但是我觉得也有一些值得借鉴的地方。
  - 比较适合兼职或者刚开始起步的朋友，付出的成本不多，包括时间成本和金钱成本。
- name: 内容即钩子论
  desc: 壁纸图片本身就是最好的‘钩子’，高颜值、高清晰度的图片天然自带高互动（收藏/下载），无需复杂文案包装，算法易判定为优质内容从而获得推荐。
  excerpt:
  - 二、小红书壁纸号全流程
  - 三、关于壁纸号的思考
- name: 全流程标准化可复制论
  desc: 将壁纸号运营拆解为可执行的标准动作集合（选题->找图->修图->排版->发布->运营），普通人通过执行SOP即可复制成功，而非依赖天赋或运气。
  excerpt:
  - 《小红书壁纸号从 0 到 3000＋粉丝，变现 4 位数的保姆式教程》
  - 二、小红书壁纸号全流程
