paper: docs/202306/LUmKdLd0AofzbcxFRkQcg56Rnnf.md
desc: 该素材是一份面向零基础用户的 Stable Diffusion LoRA 模型训练实操教程（炼丹指南），核心主张是通过「赛博丹炉」整合包降低训练门槛，结合高质量素材准备、标签清洗策略（固定特征删标签、灵活特征留标签）、网格化测试法（X/Y/Z
  图表对比步数与权重）及基于 Repeat 参数的欠拟合/过拟合诊断调优，实现真人/服装/风格 LoRA 的低成本定制化训练与落地应用。
concepts:
- name: 赛博丹炉整合包
  desc: 作者推荐的 Stable Diffusion LoRA 训练一体化工具包（由 B 站 UP 主朱尼酱制作），内置预处理、标注、训练、预览全流程，支持本地部署（需
    N 卡 6G+ 显存）与青椒云云端部署，降低环境配置门槛。
  is_original: false
  excerpt:
  - 我这里用的是B站up主朱尼酱的整合包...两个对比下来，我觉得朱尼酱的整合包会更适合小白
  - 整合包就是把炼丹所需要的所有工具都整合到一个软件里
  - 点击链接注册账号，然后下载青椒云...找到“赛博丹炉”，点击右边的“立即添加”
- name: 标签固化/解耦策略
  desc: 核心数据工程方法论：通过删除标签使模型将特征内化为隐式先验（如固定粉发、人脸五官），保留标签则使特征显式化以便推理时通过提示词控制（如换装、换发色），实现
    LoRA 特征的可控与固化平衡。
  is_original: true
  excerpt:
  - 如果你想保留人物的某个特征，那就要把对应的标签删掉，这样AI就会默认这个人就是有这个特征
  - 如果你想灵活调整某个特征，那就要把这个特征打上标签
  - 把粉色头发和绿色眼睛的标签删掉...这样不管我们输入的关键词是白头发或者黑头发，出来的都会是粉色头发
- name: 人脸加强训练
  desc: 针对真人 LoRA 的预处理增强技术：勾选后自动检测并裁剪人脸区域构建独立子数据集，强制模型聚焦学习五官细节，提升真人还原度。
  is_original: false
  excerpt:
  - 如果训练真人Lora，可以勾选最右边的“脸部加强训练”
  - 勾选了之后就会再多裁剪出来一组只有脸的照片，这样AI能学到更多的脸部细节
- name: 网格化测试法 (X/Y/Z Plot 对标法)
  desc: 标准化 LoRA 选型评估流程：利用 SD 脚本 X/Y/Z 图表，X 轴遍历 10 个检查点步数模型，Y 轴遍历 0.1-1.0 权重，单张大图直观对比相似度与泛化性，快速定位最优模型版本与权重区间。
  is_original: false
  excerpt:
  - 在脚本里面选择 “X/Y/Z图表”...X轴的值输入：NUM,000001...000010...Y轴值输入：STRENGTH,0.1,0.2...1
  - 生成出来就是这么一张大图，可以看到10个Lora在不同强度下的表现
  - 在这些图里面找到一张跟本人最像，效果最好的图就可以知道哪个Lora在多少强度的时候效果是最好的
- name: 泛化性验证
  desc: LoRA 质量核心指标：指模型在推理时能否通过提示词自由修改训练集中未出现的属性（发色、服装、背景）而不破坏核心身份特征，是判定 LoRA 合格与否的实战标准。
  is_original: false
  excerpt:
  - 泛化性就是看这个Lora能不能自由的去更换照片里的东西，比如发型、发色、服装之类的
  - 在关键词里面输入一些照片里没有的东西...头发一半白一半黑，衣服变成黑色...那我觉得这个Lora就已经合格了
- name: 过拟合/欠拟合诊断准则
  desc: 基于现象的训练状态判断体系：欠拟合表现为生成图不像本人（AI 没学好），过拟合表现为无视提示词固定输出训练集图片/画面崩坏（AI 学过头了），指导
    Repeat 参数双向调节。
  is_original: false
  excerpt:
  - 1.Lora出来的照片不像本人：AI没学好 2.Lora过拟合，甚至出来的照片崩了：AI学过头了
  - 过拟合就是不管输入什么关键词，出来的照片都是你喂给AI的照片
  - 如果生成的照片不像本人，那就可以适当增加Repeat（学习步数）值...如果照片过拟合了，那就减少Repeat值
methods:
- name: __overview__
  desc: LoRA 训练全流程标准化 SOP：环境就绪（本地/云） -> 基模选择 -> 高质量素材采集(20-30张高清多角度) -> 预处理(裁剪/人脸加强)
    -> 标签清洗(固化/解耦策略) -> 训练(默认参数/实时预览 Loss) -> 网格化测试(X/Y/Z Plot) -> 泛化性验证 -> 参数调优(Repeat
    调节过/欠拟合)。
  excerpt:
  - 炼丹分为以下几步：1.下载整合包 2.准备素材 3.测试Lora 4.优化Lora
  - 我们的素材需要满足几个点：1.上传20~30张照片 2.素材要高清！！！ 3.多角度照片
  - 点击“预处理”...处理完之后训练集里面就会有两组素材...再看到“TAG编辑”...所有标签处理好了就可以点击右下角的开始训练啦
  - 看到这个页面就是模型正在训练中...按照默认参数训练会出来10个模型...模型生成出来之后就可以到Stable Diffusion里面生成图片
- name: 素材质量控制标准
  desc: 训练数据准入硬性指标：数量 20-30 张；质量高清无压缩伪影；覆盖多角度、多表情、多光照、多服装；真人训练强制开启人脸加强裁剪；人工清洗错误标签（如误识别的服装标签）。
  excerpt:
  - 素材的质量非常重要！！它直接影响最后出来的Lora的质量
  - 我们的素材需要满足几个点：1.上传20~30张照片 2.素材要高清！！！ 3.多角度照片
  - 人脸素材里面会有些识别不准确的照片 我们点击照片右下角的图标把照片删掉
  - 比如这张照片的标签里的“夹克”和“白色衬衫”就是错的...把这两个标签勾选上，点击“删除”然后新增一个“粉色衬衫”
- name: 训练监控与检查点保存策略
  desc: 训练过程每 50 步生成一张预览图（注入固定测试提示词：白发红裙）观察泛化性；Loss 收敛参考区间 0.07-0.09；默认输出 10 个步数检查点，非常数认为最后一个最优，需实测筛选。
  excerpt:
  - 每训练50步右下角就会出现一张图片...这个白头发和红裙子是后台加上去的关键词 可以测试Lora的泛化性
  - Loss可以用来参考模型的好坏 一个好的模型Loss值在0.07~0.09之间
  - 按照默认参数训练会出来10个模型，但不是说最后一个模型就是最好的 有可能炼到第六第七个模型就已经够了，再往后的模型就已经训练过度了
- name: Repeat 参数单因子调优法
  desc: 针对过拟合/欠拟合的唯一核心调参手段：固定其他默认参数（视为最优），仅调整 Repeat 值（学习步数/重复次数）——欠拟合增大 Repeat，过拟合减小
    Repeat，避免多参数耦合导致调试失控。
  excerpt:
  - 其他参数都可以不用调，因为默认的参数就差不多是最优值了
  - 如果生成的照片不像本人，那就可以适当增加Repeat（学习步数）值
  - 如果照片过拟合了，那就减少Repeat值
theorems:
- name: LoRA 低门槛定制化可行性定理
  desc: LoRA 技术仅需少量数据(20-30张)和消费级算力(6G显存/云端按小时付费)，即可实现特定人物、物品、风格的高保真复刻与可控生成，是落地 SD
    应用层的关键技术路径。
  excerpt:
  - Lora可以复刻人物和物品的特征，固定人物动作，改变照片画风 而且Lora只需要少量的数据就可以训练出来，比训练大模型要简单很多
  - 大家可以通过训练自己的Lora，做出定制的图片...万物皆可Lora的时代是不远的
- name: 整合包优于原生脚本的工程化主张
  desc: 对于非技术背景用户，封装了环境依赖、预处理流程、参数默认值的整合包（如赛博丹炉）显著优于手动配置脚本或 WebUI 原生训练页，能屏蔽环境差异，聚焦数据与业务逻辑。
  excerpt:
  - 炼制Lora的方式有很多种...它们的训练逻辑都是一样的 所以我们选择整合包就可以了
  - 秋叶的整合包我也试过炼Lora，两个对比下来，我觉得朱尼酱的整合包会更适合小白
- name: 基模与 LoRA 风格强绑定原则
  desc: LoRA 训练所用基模决定了其特征空间分布，推理时必须使用相同基模（或同系合并模型）加载 LoRA，否则特征解耦失效导致人像崩坏或风格偏移。
  excerpt:
  - 首先先选一个大模型 你用哪一个大模型来训练lora就选哪个大模型
  - 我这里打算炼一个真人模型，所以选用“chilloutmix”的大模型 如果是炼二次元模型就可以选“anything”
- name: 实测验证优于指标监控的模型选型主张
  desc: Loss 数值、训练步数仅为辅助参考，LoRA 优劣最终须通过 SD 实测生图（相似度+泛化性双维度）裁决，最优检查点常非最终步数，防止盲目迷信收敛曲线导致过拟合模型上线。
  excerpt:
  - Loss可以用来参考模型的好坏...具体好不好还是要在Stable Diffusion实际测试才知道
  - 按照默认参数训练会出来10个模型，但不是说最后一个模型就是最好的...所以这些模型还要实际在SD测试一下，才知道哪个是最好的
findings:
- name: 真人 LoRA 训练最佳实践配置
  desc: '[evidence] 作者实测验证：基模 ChilloutMix + 赛博丹炉默认参数(人物预设) + 20-30张高清多角度实拍图 + 开启人脸加强训练
    + 标签清洗(删固有特征标签) + 第 7 个检查点(约 3500-4000 steps) + 权重 0.7，可达成高相似度且具备换装/换发色泛化能力的真人
    LoRA。'
  excerpt:
  - 我这里打算炼一个真人模型，所以选用“chilloutmix”的大模型...训练真人Lora就选“人物”
  - 如果训练真人Lora，可以勾选最右边的“脸部加强训练”
  - 像我可能就会选第七个Lora，在权重0.7的时候的照片...头发一半白一半黑，衣服变成黑色 那我觉得这个Lora就已经合格了
- name: 服装 LoRA 训练可行性与局限
  desc: '[evidence] 作者以淘宝商品图训练服装 LoRA 为例，验证物品类 LoRA 训练流程与人物一致，可大致还原款式纹理，但难以做到“完全一模一样”，需后期
    PS 修整细节，说明当前 LoRA 对复杂纹理/结构的精确复刻能力有上限。'
  excerpt:
  - 具体的操作方法其实跟炼人物是一样的...把这套衣服炼成Lora
  - 还做不到完全一模一样，不过大致上可以还原了，需要后期再用PS修整
- name: 云端训练成本基准
  desc: '[evidence] 青椒云“赛博丹炉”镜像定价 2.5 元/小时，新用户含免费试用额度，为无本地算力用户提供了可量化的低成本训练替代方案，验证了“云炼丹”路径的工程可行性。'
  excerpt:
  - 2.5元一个小时，一般新注册的用户会有优惠券，可以免费试用几个小时
  - 退出之后记得给云平台关机，不然会一直计费
- name: 标签错误对训练的负面影响实证
  desc: '[evidence] 作者演示训练集中存在误标签（如实为粉衬衫却标注为夹克/白衬衫），若不清洗会导致模型学习错误映射，人工修正标签后训练出的 LoRA
    能正确解耦服装特征，印证“标签即监督信号”的数据中心论。'
  excerpt:
  - 比如这张照片的标签里的“夹克”和“白色衬衫”就是错的 把这两个标签勾选上，点击“删除” 然后新增一个“粉色衬衫”
  - 标签和照片对不上，AI就会学错了
