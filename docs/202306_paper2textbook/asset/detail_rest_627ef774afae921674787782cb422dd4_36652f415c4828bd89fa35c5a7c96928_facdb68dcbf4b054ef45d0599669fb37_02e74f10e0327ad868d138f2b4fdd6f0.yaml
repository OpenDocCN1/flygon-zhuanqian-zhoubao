learning_targets:
- 掌握抖音短视频电商的15种变现模式分类与选择逻辑
- 理解纯付费流单品带货的选品三硬标准与利润真相
- 学会抖音图文带货、无人直播等低门槛玩法的执行SOP
- 掌握矩阵化运营的多账号组织设计与风险对冲策略
- 理解“体验差”人设构建公式与差异化内容方法论
- 学会通过文案迭代与评论区公关提升带货转化率
- 能对比抖音、快手、视频号平台特性做出正确的赛道选择
- 识别灰色地带商业模式的合规红线，树立底线意识
