paper: docs/202306/20230613_026.md
desc: 该素材为一篇2023年6月发布的《保姆级 Lora 炼丹教程》，旨在解决 Stable Diffusion 用户停留在“玩”的层面、难以落地应用的问题，提出以
  Lora 负责“炼制”特定人/物模型、ControlNet 负责“控制”模型的双核应用范式，并提供了经过作者全流程验证的一站式整合包（含模型、工具、参数）及实操案例，主打零门槛实现真人模特定制与商业产品建模。
concepts:
- name: Lora 炼丹
  desc: 指利用低秩适应技术，基于基础大模型微调训练出针对特定人物、物体或风格的小模型（Lora 模型）的过程，是实现 SD 定制化应用的核心手段。
  is_original: false
  excerpt:
  - Lora 负责把自己生活中有关联的人或物炼制成模型
  - 让你实现真人模特定制
  - 给某个商业产品做成模型
- name: SD 应用双核范式
  desc: 作者提出的 Stable Diffusion 落地应用核心框架：Lora 解决“特定主体/风格的生成”（是什么），ControlNet 解决“生成过程的精准控制”（怎么生成），两者结合实现从“玩”到“用”的跨越。
  is_original: true
  excerpt:
  - 我觉得让大家“用”起来，才是关键
  - 找出了 SD 在“应用”层面，最重要的两个功能：Lora 和 ControlNet
  - Lora 负责把自己生活中有关联的人或物炼制成模型 ControlNet 负责更好地“控制”这个“模型”
  - 两者结合，你就能真正把 SD 用起来
- name: 一站式整合包
  desc: 作者打包提供的包含训练所需软件环境、基础模型、预设参数、教程文档在内的完整资源包，旨在消除环境配置与资源寻找的门槛，实现开箱即用。
  is_original: true
  excerpt:
  - 一站式整合包
  - 需要用到的整合包和模型也都给大家打包好放在网盘（链接在文章末尾）
- name: 全流程自验证教程
  desc: 强调教程中每一步操作均由作者亲自跑通验证，确保可复现性，区别于未经实测的理论拼凑教程。
  is_original: true
  excerpt:
  - 我自己跑了一遍全流程，确保每一步都是经过我自己验证之后，写了一个教程分享给大家
  - 大家只要跟着一步一步操作，一定能学会
methods:
- name: __overview__
  desc: 基于‘Lora 炼制主体 + ControlNet 控制生成’的双核应用方法论，配合‘一站式整合包’降低环境门槛，采用‘全流程自验证’保证教程可落地性，引导用户完成从数据准备、参数配置、训练执行到推理应用的完整
    Lora 训练闭环。
  excerpt:
  - 找出了 SD 在“应用”层面，最重要的两个功能：Lora 和 ControlNet
  - Lora 负责把自己生活中有关联的人或物炼制成模型 ControlNet 负责更好地“控制”这个“模型”
  - 我自己跑了一遍全流程，确保每一步都是经过我自己验证之后，写了一个教程分享给大家
  - 需要用到的整合包和模型也都给大家打包好放在网盘
  - 文章包含了 Lora 的功能介绍，炼丹方法，实操案例，大家只要跟着一步一步操作，一定能学会
theorems:
- name: Lora 是 SD 定制化应用的核心入口
  desc: 核心主张：掌握 Lora 训练是将 Stable Diffusion 从娱乐工具转变为生产力工具、实现‘真人模特定制’及‘商业产品建模’的必要前提。
  excerpt:
  - 最近发现很多朋友学会了 Stable Diffusion 后，都是停留在“玩”的层面。但我觉得让大家“用”起来，才是关键
  - Lora 负责把自己生活中有关联的人或物炼制成模型
  - 两者结合，你就能真正把 SD 用起来，无论是定制自己的真人模特，还是给某个商业产品做成模型，都可以实现
- name: 整合包与验证教程能消除落地门槛
  desc: 核心主张：提供经过实测验证的全流程教程配合打包好的整合资源，是保证普通用户‘跟着一步一步操作，一定能学会’的充分条件。
  excerpt:
  - 我自己跑了一遍全流程，确保每一步都是经过我自己验证之后，写了一个教程分享给大家
  - 需要用到的整合包和模型也都给大家打包好放在网盘
  - 大家只要跟着一步一步操作，一定能学会
findings:
- name: 用户痛点：SD 学习停留在‘玩’的层面
  desc: '[evidence] 作者观察到大量用户虽学会 SD 基础操作，但无法将其转化为解决实际问题（如定制真人、商业建模）的生产力工具。'
  excerpt:
  - 最近发现很多朋友学会了 Stable Diffusion 后，都是停留在“玩”的层面
- name: 教程有效性的社群背书
  desc: '[evidence] 文章获得 190 赞，社群主理人亦仁加精华并建议制作视频版，表明该教程在目标社群（生财有术）中获得了高度认可与传播价值确认。'
  excerpt:
  - (精华帖)(190 赞)
  - '亦仁 : 感谢分享，已加精华。'
  - '亦仁 : 能录制一个视频么？'
  - '亦仁 : 视频发给鱼丸吧，合适的话鱼丸或者我来发'
- name: 飞书文档作为详细教程承载体
  desc: '[evidence] 完整教程内容（功能介绍、炼丹方法、实操案例）托管于飞书文档，当前素材为导流摘要版。'
  excerpt:
  - 文章包含了 Lora 的功能介绍，炼丹方法，实操案例
  - https://ry5hwpuf7b.feishu.cn/docx/LUmKdLd0AofzbcxFRkQcg56Rnnf
