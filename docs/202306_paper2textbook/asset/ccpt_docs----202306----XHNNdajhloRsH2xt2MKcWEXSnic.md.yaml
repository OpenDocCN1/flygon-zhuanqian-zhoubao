paper: docs/202306/XHNNdajhloRsH2xt2MKcWEXSnic.md
desc: 该素材系统复盘了一个基于ChatGPT的AI代写副业项目，从零开始构建了“接单-确需-AI生产-润色-交付-结算”的标准化SOP，揭示了从平台写手（日入200-300）进阶为客服（60%分成）、个人IP私域变现、自建店铺的三阶段收入跃迁路径，并沉淀出“身份+需求+约束”的提示词工程公式、参数化模板插件工具及多群并行管理等效率倍增手段，实证了普通人通过流程化掌握AI可实现稳定变现。
concepts:
- name: AI写作三阶段跃迁模型
  desc: 定义了从初级写手（赚劳务费、练技能）到中级客服（赚管理差价、管分发）再到高级合伙人（赚流量溢价、做私域/开店）的三级进阶路径，每阶段核心资产分别为提示词能力、供应链管理权、私域流量池。
  is_original: true
  excerpt:
  - 初级阶段当写手锤炼技能，赚点小钱，做到日入200~300；中级阶段当上客服，提成提到60%；高级阶段分两条路，要么搞个人ip弄私域，接一手单；要么开店铺，弄好淘宝店接单。
- name: 参数化提示词模板
  desc: 将重复性写作任务抽象为‘GPT身份+我的身份+要求’的结构化公式，并进一步开发插件将文章类型框架固化、关键要素参数化，实现从‘每次重新调教’到‘填参数即出稿’的工业化生产转变。
  is_original: true
  excerpt:
  - GPT调教这块我习惯用GPT身份+我的身份+要求的公式来写
  - 给我们开发了一款网页插件，主要功能就是把我们各类型的文章模板存起来，然后把关键要素做成参数，使用的时候只要修改这个参数就好了。
- name: 需求挖掘清单
  desc: 针对客户模糊需求，总结出的标准化确认维度（题目、字数、风格、背景、岗位、用途等），旨在通过前置信息完备性降低返工率，实现‘一遍过’交付。
  is_original: true
  excerpt:
  - 确认题目、确认字数、确认文章风格、了解背景、了解客户的岗位、了解客户的用途、更多......
  - 你确认的越多，一般返稿修改的概率就越低，争取一遍过
- name: 写手群矩阵管理
  desc: 通过批量加入淘宝代写店铺写手群（建议40-50个），建立Excel台账记录群来源、结算周期、联系人，解决单源分散、结算周期长、对账难的运营管理问题。
  is_original: true
  excerpt:
  - 尽可能多加一些写手群，四五十个群都不算多，这样你可选的单就很多了。
  - 记得要把各个群整理下，以便后续结算...你要记住每个店铺的结算周期，一般周结、月结的居多...记录下结算日期和对应的联系人就很重要
- name: AI感去除与拟人化润色
  desc: 针对大模型输出‘逻辑过于严密、连接词机械（如同时、其次、最后）、缺乏语感’的通病，提出针对性扩写、删减连接词、注入口语化表达的后处理规范。
  is_original: true
  excerpt:
  - 文章AI感太强，不像是真人写出来的文章
  - 对某一段内容进行扩写，同时去除掉一些同时、其次、最后的这类词语
methods:
- name: __overview__
  desc: 端到端AI代写标准作业程序（SOP）：淘宝搜店入群 -> 多群矩阵监控订单 -> 结构化需求确认清单 -> 两步法提示词工程（先问框架再填参数） ->
    ‘身份+需求+约束’公式生成初稿 -> AI感去除/拟人化润色 -> 客户验收迭代 -> Excel台账跟踪周结/月结对账。
  excerpt:
  - 整个项目的流程是怎么样的？答：接单——跟客户确认需求——AI写作——交付，修改——结单。
  - 第一步：询问GPT演讲稿的框架和定义...第二步：确认客户的要求...第三步：利用GPT生成文章...第四步：对文章进行润色修改
- name: 两步法提示词工程
  desc: 第一步：询问GPT特定文体（如演讲稿）的专业框架与定义，获取‘专家知识’；第二步：注入客户具体参数（角色、主题、字数、场景）结合‘GPT身份+用户身份+要求’公式生成定制稿件。
  excerpt:
  - 第一步：询问GPT演讲稿的框架和定义...以上我们就知道了演讲稿该怎么写和演讲稿的框架是怎么样的
  - 第三步：利用GPT生成文章...GPT调教这块我习惯用GPT身份+我的身份+要求的公式来写
- name: 参数化插件开发流程
  desc: 识别高频重复文书类型 -> 抽取通用框架与变量槽位 -> 外包开发网页插件实现模板存储与参数注入 -> 一键生成提示词并调用GPT -> 复制输出，将单篇调教耗时从分钟级压缩至秒级。
  excerpt:
  - 在基本流程跑通以后...联系了一位开发老哥，给我们开发了一款网页插件，主要功能就是把我们各类型的文章模板存起来，然后把关键要素做成参数
theorems:
- name: AI代写变现核心公式：收入 = (单价 × 转化率 × 产能) × 阶段杠杆系数
  desc: 素材隐性论证：初级阶段靠提升产能（熟练度/模板）和单价（难度）赚钱，系数1；中级阶段靠获得分发权（客服60%提成）杠杆放大，系数>1；高级阶段靠获取一手流量（私域/店铺）捕获全额价值，系数最大。核心在于从卖时间向卖资产（模板/流量/品牌）转型。
  excerpt:
  - 一般店铺会拿走40%，剩下60%给客服，客服再给到写手，可能只有15%~40%。
  - 初级阶段当写手...中级阶段当上客服...高级阶段...搞个人ip弄私域，接一手单；要么开店铺
- name: GPT官网模型优于镜像/国产模型的写作逻辑判断
  desc: 实战对比得出：处理复杂长文、逻辑结构化、角色代入写作时，GPT官网原版模型在指令遵循、上下文连贯性、拟人化表达上显著优于国内镜像及自研模型，是专业代写的基础设施选择。
  excerpt:
  - 尝试过很多AI工具，目前国内自研和GPT镜像的写作逻辑还是不如人意，所以还是使用GPT官网是目前逻辑最好的。
- name: 私域信任溢价定律：口碑复购与转介绍的LTV远超平台冷启动获客
  desc: 核心主张：在代写高信任服务中，通过‘认真对待每一单’积累的口碑带来的精准推荐客户，具有极高信任度、转化率与复购率，是摆脱平台抽成、实现高利润的必经之路。
  excerpt:
  - 打造个人ip是一个时间积累的过程...认真对待每一次你接的单子，如果你的口碑做好了，你的客户就会不断推荐身边的朋友来找你，这些是精准度、信任度极高的客户。
- name: 淘宝代写店铺冷启动高成本陷阱
  desc: 基于实测判断：新开淘宝代写店需大量投放直通车获客，流量成本极高，且平台规则复杂多变，非成熟团队不具备ROI正向能力，新人应避免‘开店’作为起步动作。
  excerpt:
  - 2023.10.14更新：经过测试，淘宝开店铺焼直通车太烧钱了，不建议新人入局，大家先从基本开始吧！
findings:
- name: 新人首日变现与月收敛曲线
  desc: '[evidence] 团队实测数据：新人入群首日即可接单变现（几十元），坚持一个月左右可稳定达到日入200-300元，验证了低门槛、快见效、正向反馈强的副业特性。'
  excerpt:
  - 新人第一天开始做就可以直接变现几十，一个月左右可以稳定在日入200~300
- name: 头部写手GPT增效案例
  desc: '[evidence] 案例‘糕老师’：3年写作经验，引入GPT前稳定月入1w+，引入后效率提升叠加毕业季旺季，收入跃升至月入近3w，证明AI对专业写手存在显著杠杆放大效应，而非替代。'
  excerpt:
  - 糕老师拥有三年写作经验，之前稳定月入1w+，后来在GPT的加持下，效率提升，再加上迎来毕业季，增长到月入近3w
- name: 平台分成链条实测结构
  desc: '[evidence] 实地调研数据：店铺抽成40% -> 客服拿60% -> 写手仅得15%-40%（即总单价9%-24%），揭示了处于食物链底端写手的薄利现状，倒逼向上游（客服/店主/私域）突围的必要性。'
  excerpt:
  - 一般店铺会拿走40%，剩下60%给客服，客服再给到写手，可能只有15%~40%。
- name: 演讲稿类代写全流程实测耗时与质控
  desc: '[evidence] 以‘书记门诊开业仪式演讲稿（1000字/3-4分钟）’为例，完整演示了‘问框架->填参数->生成->去AI感润色’全流程，验证了两步法提示词+人工润色可产出可交付的专业级稿件。'
  excerpt:
  - 角色：书记...主题：门诊开业仪式...要求：3-4分钟（1000字左右）
  - 第一步：询问GPT演讲稿的框架和定义...第三步：利用GPT生成文章...第四步：对文章进行润色修改
- name: 客服岗位准入门槛实测
  desc: '[evidence] 店铺招聘客服硬性要求‘一天在线至少三小时’，揭示了中级阶段从‘自由职业’向‘半职业化’转型的时间成本约束，需与店长沟通灵活度。'
  excerpt:
  - 注意：店铺大多对客服有要求，一天至少要在线三小时，这个可以尝试跟店长沟通。
