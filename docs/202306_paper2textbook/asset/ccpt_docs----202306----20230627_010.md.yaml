paper: docs/202306/20230627_010.md
desc: 该素材为一篇短剧CPS项目的实操经验分享文章，核心围绕“如何在20分钟内复现一个混剪爆款视频”这一目标，系统拆解了短剧剪辑的两大核心技术模块——视频场景划分与爆款视频字幕制作，并提供了包含标准化作业程序（SOP）与视频演示在内的完整流程梳理与进阶技巧。
concepts:
- name: 短剧CPS
  desc: 短剧分销推广的商业模式，通过剪辑短剧片段发布视频挂载小程序链接引导用户充值观看，从而获取分成佣金。
  is_original: false
  excerpt:
  - 短剧 CPS 这个项目，在知道怎么选择爆款短剧之后，很自然的就会把焦点放到短剧的剪辑上。
- name: 混剪爆款视频
  desc: 通过将短剧中的高潮、冲突、反转等关键片段重新组合剪辑，制作成具备高完播率、高转化率的推广视频。
  is_original: false
  excerpt:
  - 如何在 20 分钟内复现一个混剪的爆款视频？
- name: 视频场景划分
  desc: 将短剧原始素材按情节节奏、冲突节点进行结构化切分（如开头钩子、铺垫、冲突爆发、高潮、悬念留白），作为混剪素材库的分类依据。
  is_original: true
  excerpt:
  - 我将从以下两个角度，分享整个操作流程... 1.视频场景划分
- name: 爆款视频字幕
  desc: 指针对短剧混剪视频定制的字幕策略，包含关键台词强调、情绪引导文案、引导观看话术等，旨在提升视频完播与转化。
  is_original: true
  excerpt:
  - 我将从以下两个角度，分享整个操作流程... 2.爆款视频字幕
- name: 剪辑SOP（标准化作业程序）
  desc: 将短剧剪辑从选剧、下载、去重、场景划分、字幕制作、调色、发布全流程标准化、模块化，实现‘20分钟复现爆款’的可复制操作手册。
  is_original: true
  excerpt:
  - 内含实操 SOP 和视频演示解说
  - 对短剧剪辑整个流程的梳理
methods:
- name: __overview__
  desc: 基于‘场景结构化拆解+字幕策略化植入’的短剧混剪快速复现方法论，核心流程为：选定爆款短剧 -> 素材获取与去重 -> 按叙事节奏进行场景划分 ->
    匹配爆款字幕模板/策略 -> 快速合成输出 -> 发布转化。
  excerpt:
  - 如何在 20 分钟内复现一个混剪的爆款视频？
  - 我将从以下两个角度，分享整个操作流程（内含实操 SOP 和视频演示解说） 1.视频场景划分 2.爆款视频字幕
  - 还有对短剧剪辑整个流程的梳理，和一些剪辑进阶技巧的分享
theorems:
- name: 剪辑效率与质量的标准化平衡定律
  desc: 通过建立场景划分标准与字幕SOP，可在极大压缩制作时间（20分钟/条）的前提下，保证混剪视频的爆款复现率，实现‘量产’与‘质量’的统一。
  excerpt:
  - 如何在 20 分钟内复现一个混剪的爆款视频？
  - 内含实操 SOP 和视频演示解说
  - 对短剧剪辑整个流程的梳理，和一些剪辑进阶技巧的分享
- name: 爆款核心要素双支柱理论
  desc: 短剧混剪视频的爆款属性主要由两大可控技术要素决定：视频场景划分（决定内容节奏与钩子）与爆款视频字幕（决定留存与转化），掌握这两点即掌握核心生产力。
  excerpt:
  - 我将从以下两个角度，分享整个操作流程... 1.视频场景划分 2.爆款视频字幕
