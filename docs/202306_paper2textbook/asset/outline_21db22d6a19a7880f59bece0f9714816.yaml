- 'no': 1
  name: 商业思维底座 —— 从“打工者”到“操盘手”的认知跃迁
  desc: 本章打破“勤奋致富”的误区，引入商业模式公式与成本结构分析，帮助读者建立以认知、杠杆和信息差为核心的商业底层逻辑，解决“为何努力却难富”的根本困惑。
  nodes:
  - 'no': 1
    name: 普通人的财富陷阱：时间出售与稀缺资源垄断
    desc: 揭示“血酬模式”（出卖时间/健康）的低上限与“稀缺资源租金”的高杠杆，理解为何大多数人困在循环中，以及AI时代对劳动力杠杆的冲击。
    role: motivation
    src:
    - paper: docs/202306/20230613_182.md
    - paper: docs/202306/20230613_177.md
  - 'no': 2
    name: 商业模式的基本公式与成本优势分析
    desc: 定义商业模式 = (收入-成本) × 频次 × 周期，并剖析人力、资金、智力三类成本结构，确定个体的核心杠杆点。
    role: definition
    src:
    - paper: docs/202306/20230613_007.md
  - 'no': 3
    name: 时间作为终极生产资料与再生产边际成本
    desc: 引入李笑来的时间观：区分生产、再生产、学习、销售四类时间成本，强调“零再生产时间成本”（如代码、媒体、产品）是财富自由的关键杠杆。
    role: method
    src:
    - paper: docs/202306/20230613_101.md
  - 'no': 4
    name: 信息差、认知差与中间人经济
    desc: 阐述信息不对称在商业中的价值，介绍如何从“做题家”视角转向“出题家”视角，利用认知重构发现“弯腰捡钱”的商机。
    role: method
    src:
    - paper: docs/202306/20230613_004.md
    - paper: docs/202306/20230613_088.md
  - 'no': 5
    name: 层级跃迁与非线性增长：从100万到1000万的鸿沟
    desc: 类比高考层级与创业收入层级，揭示“努力在低层级有效，高层级靠模式与资源”的规律，避免线性思维陷阱。
    role: limitation
    src:
    - paper: docs/202306/20230613_086.md
    - paper: docs/202306/20230613_097.md
- 'no': 2
  name: 赛道选择与红利捕捉 —— 在正确的时间做正确的事
  desc: 本章聚焦如何识别行业生命周期（1.0/2.0/3.0阶段）与平台红利窗口，通过“平台发展两阶段论”和“快慢钱”策略，指导读者在不确定性中制定生存与发展策略。
  nodes:
  - 'no': 1
    name: 商业进化三阶段论与代运营2.5模式
    desc: 解析从物质交换到认知竞争的演进，阐述“代运营”作为连接传统商家与新商业逻辑的中介价值及实操逻辑。
