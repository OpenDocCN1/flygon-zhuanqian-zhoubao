    - paper: docs/202306/20230627_065.md
  - 'no': 5
    name: 项目红海化与信息半衰期管理
    desc: 分析高密度社群如何加速“蓝海”变“红海”，提出通过提升模仿难度（组合拳创新）或追求能力（需求挖掘）来应对项目生命周期缩短。
    role: limitation
    src:
    - paper: docs/202306/20230613_099.md
    - paper: docs/202306/20230613_093.md
- 'no': 3
