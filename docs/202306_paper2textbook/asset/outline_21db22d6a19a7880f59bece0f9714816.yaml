    - paper: docs/202306/20230613_006.md
  - 'no': 3
    name: 平台生命周期：商品填充期与品牌竞争期
    desc: 识别电商/内容平台的“红利期”（流量宽松、易出单）与“存量期”（内卷、需精细化运营），指导不同阶段的资源投入策略。
