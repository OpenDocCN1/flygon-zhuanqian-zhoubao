paper: docs/202306/T2aDdk1umog1udxJwHGcCHyNnFc.md
desc: 该素材是一份关于“生财有术”社群线下组局（聚会）的全流程标准化操作手册（SOP），详细记录了第1期组局的策划筹备（选址、预算、物料、时间节点）、执行流程（开局规则、自我介绍、主题分享、问题答疑、交流分享）、复盘反馈机制（鸽子费激励、参与者复盘案例）以及组局官常见疑问解答（FAQ），旨在通过结构化流程保障线下聚会的高效产出与知识沉淀。
concepts:
- name: 组局官
  desc: 线下聚会的发起者、统筹者和场控者，负责全流程SOP执行、选址决策、预算把控、现场布置、流程把控及复盘督促。
  is_original: true
  excerpt:
  - SOP【组局官】：1、确认组局主题，目标，时间，并发起组局官报名... 2、3选1确认场地... 制定组局详细方案... 3、坐G1003次... 安排Mo.gz把会务物料...
    布置现场...
  - 组局官而言，应注意流程顺畅，控制时间，过程中做好素材归纳（比如拍照、录音、记录），紧贴主题，让活动聚焦价值。
- name: 鸽子费
  desc: 一种行为经济学激励机制，参与者报名时缴纳押金（如99元），活动后按要求完成复盘分享方可退还，旨在降低爽约率并强制产出知识沉淀。
  is_original: true
  excerpt:
  - 组局后组员需要交99元鸽子费，如活动涉及到费用，建议AA制，一般来说是活动后多除少补。
  - 无复盘分享不退鸽子费，复盘分享截止时间为第2周周一中午12:00前。
- name: 志愿者
  desc: 协助组局官完成事务性工作（物料搬运、现场布置、内容沉淀）但不参与核心议程交流的辅助角色。
  is_original: true
  excerpt:
  - 组局群里除了组局官，还会有志愿者以及参局的组员，其中志愿者是帮助协助组局官完成组局相关事宜，不参与线下活动。
  - 活动结束后志愿者会协助组局官进行内容沉淀。包括参与者的反馈、活动效果和成果等。
- name: 开局规则
  desc: 活动伊始建立的心理契约与行为规范，包含真诚开放、全程投入（上交手机）、互帮互助（带问题与方案来）、拒绝空降四大原则，确保高质量连接。
  is_original: true
  excerpt:
  - 1、真诚开放... 2、全程投入... 请大家全程不玩手机，手机上缴统一保管... 3、互帮互助... 请带着问题而来... 4、拒绝空降...
- name: 结构化议程
  desc: 将4小时线下聚会切分为开局规则(5min)、自我介绍(30min)、主题分享(20min)、中场休息(5min)、问题答疑(30min)、交流分享(30min)六个固定模块，形成可复制的标准会议节奏。
  is_original: true
  excerpt:
  - 开局规则（5分钟，14:00-14:05）... 自我介绍（30分钟1人4分钟，14:05 - 14:35）... 主题分享（20分钟，14:35 - 14:55）...
    中场休息（5分钟拍照时间，14:55 - 15:00）... 问题答疑（30分钟，15:00 - 15:30）... 交流分享（30分钟，15:30 - 16:00）
- name: 三维提问法
  desc: 自我介绍及交流环节的核心提问框架，要求每人输出：1个AI应用难题、1个化解方案、1个从0到1跑通变现案例，倒逼深度思考与干货输出。
  is_original: true
  excerpt:
  - 1》每人提出1个自己对AI在电商领域中应用中遇到的难题？ 2》每人提出1个自己觉得化解上述难题的1个解决方案 3》每人提出1个自己从0到1跑通AI在电商领域引用的案例
  - 每人提出1个自己用AI在电商/其他领域中变现中遇到的难题？... 每人提出1个自己化解上述难题的1个解决方案... 每人提出1个自己从0到1跑通AI在电商/其他领域变现的案例
methods:
- name: __overview__
  desc: 线下组局全生命周期SOP：前期（周二发起报名->周五定场地方案收款->周六执行），中期（六模块结构化议程+三维提问法+手机上交机制），后期（鸽子费绑定复盘+志愿者协助沉淀+照片分享裂变），形成可标准化复制的社群线下运营闭环。
  excerpt:
  - SOP【组局官】... 1... 2... 3...
  - 开局规则... 自我介绍... 主题分享... 中场休息... 问题答疑... 交流分享...
  - 组局后（复盘反馈 退鸽子费）... 参与者需做... 组局官需做...
- name: 场地三选一决策法
  desc: 通过对比场地面积、容纳人数、环境氛围、停车便利性、茶水服务、计费模式（按时vs按天）、人均成本六个维度，结合‘固定场地降低寻找成本’的长期策略，锁定最优性价比方案（本案选山舍）。
  excerpt:
  - 选址【确认山舍】... 3选1（这次开会试过合适，后续可固定此场地，省的每周找不同场地，舟车劳顿）
  - 店名：小茶闲舍... 收费：5人间美团套餐388元2小时... 人均价格... 120元
  - 店名：山舍... 收费：按天计算，半天优惠价300元... 人均价格... 60元
  - 店名：圆梦空间... 收费：10人内350元3个小时... 人均价格... 70元
- name: 手机物理隔离法
  desc: 活动全程收缴手机统一保管，仅保留组局官1台录音设备，物理切断外部干扰，强制参与者进入深度专注状态，保障‘全程投入’规则落地。
  excerpt:
  - 全程投入：请大家全程不玩手机，手机上缴统一保管；组局官会安排1个手机全程录音最后分享给大家录音文件
- name: 复盘强制产出机制
  desc: 以鸽子费退还为硬性杠杆，设定截止时间（次周一中午12点）和平台要求（生财有术星球/公众号），将‘事后总结’转化为‘必须交付的作业’，保障知识资产沉淀与社群内容生产。
  excerpt:
  - 无复盘分享不退鸽子费，复盘分享截止时间为第2周周一中午12:00前。
  - 每个圈友都可将自己的复盘总结分享到生财有术知识星球。
  - 建议是活动结束后24小时内，这样较为印象清晰而且具备热度
theorems:
- name: 结构化流程保障高质量连接
  desc: 只有通过严密的SOP（时间节点、角色分工、规则前置、议程切分）将非标准化的社交聚会转化为标准化产品，才能在低成本、高频次下稳定产出高密度信息交换与信任建立。
  excerpt:
  - SOP【组局官】... 第3步是第一次如此执行，后续物料来来会再做一份，直接暂存场地那边，后续组局官提前半小时到场，参与者14点直接到场地即可。
  - 组局官而言，应注意流程顺畅，控制时间，过程中做好素材归纳... 紧贴主题，让活动聚焦价值。
- name: 利益绑定驱动知识沉淀
  desc: 单纯靠自觉无法保证复盘产出，必须引入经济激励（鸽子费）与时间约束（截止日期），将‘隐性知识外显化’转化为参与者的刚性收益诉求，实现社群资产的规模化积累。
  excerpt:
  - 组局后组员需要交99元鸽子费... 无复盘分享不退鸽子费，复盘分享截止时间为第2周周一中午12:00前。
  - 建议是分享有价值+逻辑完整+具备可读性的内容
- name: 场控核心在于‘紧贴主题’与‘时间控制’
  desc: 组局官的核心价值非服务保障，而是议程推进者：必须物理隔离干扰（收手机）、强制结构化输出（三维提问）、压缩无效社交（拒绝空降、限时自我介绍），确保单位时间信息密度最大化。
  excerpt:
  - 开局规则... 2、全程投入... 手机上缴统一保管... 3、互帮互助... 每人提出1个... 4、拒绝空降...
  - 组局官而言，应注意流程顺畅，控制时间... 紧贴主题，让活动聚焦价值。
findings:
- name: 固定场地策略显著降低组织成本
  desc: '[evidence] 素材记录了第1期尝试3选1选址，最终确认‘山舍’并决定‘后续可固定此场地，省的每周找不同场地，舟车劳顿’，验证了固定场地能消除重复决策成本与物料搬运成本（后续物料暂存场地）。'
  excerpt:
  - 选址【确认山舍】... 3选1（这次开会试过合适，后续可固定此场地，省的每周找不同场地，舟车劳顿）
  - 第3步是第一次如此执行，后续物料来来会再做一份，直接暂存场地那边，后续组局官提前半小时到场...
- name: 三维提问法有效激发跨领域认知碰撞
  desc: '[evidence] 参与者复盘（Kane、英卡、墨鱼）显示，围绕‘AI电商变现’的难题/方案/案例三维提问，成功串联了虾皮台湾站、信用卡提额、B站商务、中老年带货、海南封关、出书流程等10+异质赛道经验，形成‘智囊团’效应。'
  excerpt:
  - Kane复盘：... 聊到了AIGC变现方式... 有小伙伴是做中老年矩阵带货... 跨行业的莫哥、牙姐给我带来成年人的焦虑... 海南封关... 出事的详细路径...
  - 英卡复盘：... 聊到了AIGC变现方式、AI绘画在电商... 虾皮台湾站... 信用卡额度提升... B站up主商务... AI文爱软件... 港股打新...
    出书流程... 海南发展机会...
  - 墨鱼复盘：... 大家就像一个智囊团一样，给出了很多的分析。
- name: 鸽子费机制有效保障复盘产出率
  desc: '[claim] 素材设定‘无复盘不退费’规则及截止时间；[evidence] 素材展示了Kane、英卡、墨鱼、维尼、瑾糖等多人已产出复盘（含公众号链接、星球链接），验证机制有效驱动了内容沉淀。'
  excerpt:
  - 无复盘分享不退鸽子费，复盘分享截止时间为第2周周一中午12:00前。
  - Kane复盘：... 感谢分享～一起生财有术
  - 英卡复盘：... 感谢各位伙伴的分享～有机会一起生财有术
  - 阿墨复盘：https://articles.zsxq.com/id_4nkc321p8nj1.html
  - 维尼复盘：https://mp.weixin.qq.com/s/wc6F8rCdOTGmTf7zWawPKQ
- name: 手机上交机制倒逼深度专注但需平衡录音留档需求
  desc: '[evidence] 规则规定‘全程不玩手机，手机上缴统一保管’，仅保留组局官1台手机录音，这一物理隔离手段在复盘中未见负面反馈，反而配合‘全程录音分享’解决了记录焦虑，实现了专注与留痕的平衡。'
  excerpt:
  - 全程投入：请大家全程不玩手机，手机上缴统一保管；组局官会安排1个手机全程录音最后分享给大家录音文件
