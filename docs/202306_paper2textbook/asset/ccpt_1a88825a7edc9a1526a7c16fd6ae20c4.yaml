- name: 限流自查三大铁律与熔断指标
  desc: '[evidence] 实战归纳：1.播放<200 即限流；2.抖+显示‘不可投’即限流；3.三大成因：营销痕重（删营销动作）、搬运判重（强化去重）、敏感内容（打码/避坑）。若抖+可投但数据低且日更<5条，定性为‘内容烂’需复盘爆款结构。'
