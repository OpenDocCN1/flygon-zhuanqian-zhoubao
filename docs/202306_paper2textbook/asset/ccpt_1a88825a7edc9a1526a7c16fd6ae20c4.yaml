- name: 账号权重测试阈值量化标准
  desc: '[evidence] 实测总结：抖音实拍纯原创风景/摆设视频（5-10s，带音乐文案），基础播放量300-500为正常权重账号；连200不到为低权重/设备脏号，需换号或养号3天复测。该指标为发布营销内容前的必要熔断检测。'
