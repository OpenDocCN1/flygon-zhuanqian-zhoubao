paper: docs/202306/20230613_077.md
desc: 本素材由一位传统行业从业者复盘分享日本出国劳务行业从1.0到3.0的演进历程，核心揭示了该行业依托“信息差”与“资质壁垒”实现闷声发财的商业逻辑：1.0时代凭借商务部派遣资质垄断低技能蓝领输送，双向收费（劳务费+管理费）；2.0时代因国内工资上涨与日本政策转向，切换至高学历白领输送，依托招聘网站等互联网渠道获客，单次佣金高达3-3.5万元；3.0时代向多国多品类拓展。素材详细拆解了派遣公司与咨询公司的分层协作模式、获客渠道迁移策略、以及“包装公开信息卖给精准人群”的核心价值主张，并佐以疫情周期下的行业存活观察。
concepts:
- name: 日本出国劳务 1.0（技能实习生模式）
  desc: 早期以商务部资质派遣公司为主导，面向农村初中学历青年输送体力劳动（种地、电焊、流水线），签证为技能实习签证（1-3年不续签），核心利润来自双向收费：向工人收劳务费、向日方雇主收管理费。
  is_original: false
  excerpt:
  - 早期的出国劳务主要做的国家是日本，被称为“技能实习生”，因为发的签证 是技能实习签证... 1 都是体力劳动，比如种地、养殖、电焊工、流水线工人等； 2 签证时长为一年或者三年...
  - 有商务部资质的公司可以直接招收客户，派遣工人出国... 这种公司是两头赚钱，一个是收出国人员的劳务费，比如说三万元，还有就是向日本客户收取管理费
- name: 日本出国劳务 2.0（工作签证/高学历模式）
  desc: 行业转型期，招工对象升级为会日语的大专以上大学生，签证变为可长期居住、可申请永居的人文工作签证，工种升级为温泉酒店服务、奢侈品销售、IT程序员等，获客渠道从线下劳务市场全面转向招聘网站等线上平台，单人劳务费提升至3-3.5万元。
  is_original: true
  excerpt:
  - 日本出国劳务最重要三个变化： 1 招工对象变了，从之前初中学历的农村青年变成了会日语大专以上学历的大学生； 2 签证类型变了... 变为人文工作签证...
    3 工作内容变了，主要工作种类有温泉酒店服务员、奢侈品店销售、网络公司程序员等
  - 后面发现效果最好的渠道是招聘网站。就是在招聘网站开通各大城市，发布招聘信息；还有就是购买简历库里面的简历，安排销售人员打电话
  - 每面试上一个学员，我们是收三万五的劳务费，后面大概调整成三万了
- name: 日本出国劳务 3.0（多国多元化模式）
  desc: 业务不再局限于日本，拓展至新西兰木工、芬兰厨师、澳大利亚剔骨工及留学项目等多国多品类，形成多点开花的业务组合。
  is_original: false
  excerpt:
  - 出国业务不局限于日本工签项目，还会有还会拓展到其它国家的工签，比如新西兰的木工、芬兰的厨师、澳大利亚的剔骨工，甚至还有留学项目...
- name: 派遣公司与咨询公司的双层分账体系
  desc: 行业核心组织架构：持有商务部资质、缴纳300万保证金的‘派遣公司’掌握日方订单与签证权，向工人收费、向日方收管理费；无资质的‘咨询公司’负责线下获客面试，按人头向派遣公司拿佣金（早期约1万/人），形成‘派遣公司开单-咨询公司送人-分账结算’的协作闭环。
  is_original: false
  excerpt:
  - 在这里劳务公司主要分为两种，一种是有商务部资质的公司... 还有一种就是小型劳务咨询公司...
  - 流程是这样：今天派遣公司某个日本客户需要食品工 5 名... 发给下面的劳务公司，约定好哪天带着工人过来面试，如果被录取后就会返给劳务公司佣金； 四五年前...
    这个佣金是送出去一个人一万
- name: 信息差包装变现
  desc: 劳务公司针对高学历人群的核心价值主张：日本雇主招聘信息虽公开但分散、筛选成本高，劳务公司通过‘项目筛选+资料协助+批量面试安排’将公开信息打包成标准化产品，向求职者收取高额服务费，向雇主提供批量面试效率，实现‘家家有凉开水，包装上架卖两块’的商业模式。
  is_original: true
  excerpt:
  - 其实这就像家家都有凉开水，把它包装起来放到超市货架上照样卖两块钱一瓶。
  - 劳务公司当时做这个事的价值可以分开来看，对于想出国的大学生来说我们把项目都筛选出来了... 劳务公司还会协助你准备相关的出国资料。 对于日本雇主公司来说，我们可以一天安排十几个人都面试，为他们节省时间和精力。
- name: 保证金面试筛选机制
  desc: 2.0阶段针对异地高学历求职者设计的风控与转化流程：面试前收取保证金锁定意向、过滤无效到访；面试通过则抵扣劳务费，未通过全额退还，既降低了公司组织面试的空跑成本，又提升了派遣公司端的录取率信誉。
  is_original: true
  excerpt:
  - 当时有很多外地的大学生过来参加面试... 我们先收一个保证金，学员面试后如果没有通过就退回，如果通过面试保证金后面可以抵扣劳务费。
methods:
- name: __overview__
  desc: 传统出国劳务行业的全周期演进复盘法：按政策周期（签证类型）、人才画像（学历/技能）、获客渠道（线下/线上）、组织形态（派遣/咨询）、盈利模式（双向收费/佣金分账/单向服务费）五个维度拆解行业三个发展阶段，提炼‘资质壁垒+信息差包装’的核心护城河。
  excerpt:
  - 在我看来主要分为三个阶段：日本出国劳务 1.0：技能实习生... 日本出国劳务 2.0：工作签证... 出国劳务 3.0 阶段：多点开花
- name: 1.0阶段线下分层获客法
  desc: 派遣公司依托资质垄断上游日方订单，下游通过‘车站、劳务市场门头店’形式的咨询公司网络覆盖农村蓝领人群，咨询公司赚人头佣金，派遣公司赚劳务费与管理费，实现零广告成本的规模化获客。
  excerpt:
  - 之前这些公司在网上信息比较少，很多公司可能只有一个很老网站... 因为他们主要是靠这些劳务公司来获客。
  - 流程是这样：今天派遣公司某个日本客户需要食品工 5 名... 发给下面的劳务公司，约定好哪天带着工人过来面试
- name: 2.0阶段招聘网站精准获客法
  desc: 针对高学历白领群体，放弃百度竞价、SEO、QQ群、贴吧等低转化渠道，集中资源在招聘网站（前程无忧/智联/BOSS直聘等）开通多城市账号发布JD、购买简历库外呼，建立销售团队电话销售转化，单人获客成本可控、转化率高。
  excerpt:
  - 我们当时尝试了很多网络渠道，比如投放百度广告、网站关键词优化、QQ 群发广告、贴吧论坛发帖子，效果也有但不是很理想，后面发现效果最好的渠道是招聘网站。
  - 就是在招聘网站开通各大城市，发布招聘信息；还有就是购买简历库里面的简历，安排销售人员打电话
- name: 异地面试保证金转化法
  desc: 针对外地大学生面试场景，设计‘面试前收保证金→通过抵扣劳务费/不通过退还’的资金流转机制，同时解决求职者诚意筛选、公司面试组织成本控制、最终劳务费回收三个问题。
  excerpt:
  - 我们先收一个保证金，学员面试后如果没有通过就退回，如果通过面试保证金后面可以抵扣劳务费。
- name: 日方订单自主开发法
  desc: 项目部门人员直接登录日本相关招聘/政府公开网站搜索雇主需求，绕过日方中介层级，直接对接日本雇主企业（项目部门），获取一手订单并掌握工资、住宿、加班等核心参数，构建核心供给侧壁垒。
  excerpt:
  - 我们很多日本雇主都是项目部门的同事去日本相关网站搜索开发出来的。
theorems:
- name: 传统行业‘闷声发财’的核心逻辑：资质准入构建供给垄断，信息不对称创造定价权
  desc: 出国劳务行业长期高利润的根因在于：商务部资质+300万保证金构成高准入壁垒，使得持证派遣公司垄断了合法输送渠道（供给端）；同时利用求职者对海外岗位信息获取渠道不知情、签证办理流程复杂、面试对接困难（需求端），将公开的日本招聘信息‘包装’为标准化服务产品，收取远高于信息本身价值的劳务费。
  excerpt:
  - 有商务部资质的公司可以直接招收客户，派遣工人出国，但是，有个门槛就是需要有三百万的保证金在那里放着。 虽然门槛较高，但是这种公司是两头赚钱...
  - 其实这就像家家都有凉开水，把它包装起来放到超市货架上照样卖两块钱一瓶。
  - 日本招工方面的是免费的，很多信息也是公开发布到网络上
- name: 行业升级的必然路径：跟随‘签证政策红利’与‘国内人才结构变迁’同步迁移产品与渠道
  desc: 1.0向2.0转型的驱动力是双重的：外部推力来自日本政策收紧技能实习签证、开放工作签证及东南亚劳动力竞争；内部拉力来自国内沿海城市工资上涨导致蓝领出国意愿下降、大专以上日语人才供给增加。企业必须同步完成：产品从‘蓝领体力岗’升级为‘白领技能岗’、渠道从‘线下地推’升级为‘招聘网站电销’、定价从‘低客单价高量’转为‘高客单价精准’。
  excerpt:
  - 这几年随着国内工资水平尤其是沿海城市的升高，还有日本招工也在向东南亚国家倾斜，这个行业没有之前那么好做了，也进入了新的转型时期
  - 招工对象变了... 招工的方式也需要做出变化，也就是从传统销售方式转向网络平台
- name: 抗周期生存法则：资质派遣公司凭‘厚底子’熬周期，咨询公司靠‘轻资产’活下去或转型
  desc: 疫情三年冲击下，无资质的小咨询公司大量倒闭（重资产/单一渠道脆弱）；持有资质的派遣公司通过裁员降薪、依靠过往积累的日方客户关系与资质护城河熬过寒冬，并在政策放开后迅速恢复（如新西兰业务复苏），验证了‘重资质、重供给端关系、多元化布局’的抗风险优势。
  excerpt:
  - 出国劳务行业在过去的三年受到很大影响，一些小的劳务公司不少关门的，那些有资质的派遣公司通过裁员降薪大部分都熬了过去，毕竟底子厚一些，今年上半年业务已经恢复的不错，三月初的时候我去给老领导送草莓，进门见我第一句话就是“今年新西兰做的不错”
findings:
- name: 1.0阶段蓝领工人三年净收入约20万人民币+厚生年金
  desc: '[evidence] 作者从业观察，农村青年赴日技能实习三年，勤恳节约可带回约20万人民币，归国后另获厚生年金约2万人民币，对农村家庭具有决定性阶层跃升意义（盖房娶媳妇）。'
  excerpt:
  - 一般来说，在日本三年勤恳节约，能带回二十万人民币吧，对很多农村年轻人来说，这笔钱可以盖房娶媳妇了，回国后日本政府还会有一笔厚生年金，大概是两万左右
- name: 1.0阶段咨询公司单人佣金约1万元，年入几十万可行
  desc: '[evidence] 作者亲历数据：四五年前咨询公司送一人赴日面试通过，派遣公司返佣1万元；小咨询公司通常由家人经营，按年输送几十人计算，年收入可达几十万元，且常同时对接多家派遣公司分散风险。'
  excerpt:
  - 四五年前我我们还在做的时候，这个佣金是送出去一个人一万，做的小劳务公司就是自己家人在做一年有几十万收入，根据他们每年选上的人数就能算出来，而且他们不是去一个派遣公司，而是根据项目去多个派遣公司送人。
- name: 2.0阶段单人劳务费3-3.5万元，招聘网站渠道ROI远超百度/SEO/社群
  desc: '[evidence] 作者实测数据：2.0阶段对大学生收取劳务费3.5万（后因威海/烟台竞争降至3万）；尝试过百度竞价、SEO、QQ群、贴吧等渠道效果不理想，最终确定招聘网站（发JD+买简历库电销）为最高ROI渠道，建立销售团队电话销售模式。'
  excerpt:
  - 每面试上一个学员，我们是收三万五的劳务费，后面大概调整成三万了因为山东其它城市威海、烟台也有在做的。
  - 我们当时尝试了很多网络渠道，比如投放百度广告、网站关键词优化、QQ 群发广告、贴吧论坛发帖子，效果也有但不是很理想，后面发现效果最好的渠道是招聘网站。
- name: 疫情周期验证：资质派遣公司存活率远高于咨询公司，业务恢复具备先发优势
  desc: '[evidence] 作者实地走访观察：疫情三年小咨询公司大量关门；资质派遣公司虽裁员降薪但多数存活，且2023年上半年业务已恢复，新西兰等新项目率先复苏，印证‘资质+供给端积累’为核心抗风险资产。'
  excerpt:
  - 出国劳务行业在过去的三年受到很大影响，一些小的劳务公司不少关门的，那些有资质的派遣公司通过裁员降薪大部分都熬了过去，毕竟底子厚一些，今年上半年业务已经恢复的不错，三月初的时候我去给老领导送草莓，进门见我第一句话就是“今年新西兰做的不错”
- name: 青岛/烟台/威海形成山东出国劳务产业带，区域竞争导致2.0阶段客单价下调
  desc: '[evidence] 作者提及山东威海、烟台也有公司做2.0业务，导致青岛地区劳务费从3.5万被迫降至3万，揭示了区域同质化竞争对高利润模式的侵蚀。'
  excerpt:
  - 后面大概调整成三万了因为山东其它城市威海、烟台也有在做的。
