    name: 二三线城市窗口期市场红利论
    desc: 一线城市头部展会垄断官方IP与大咖资源，二三线城市存在巨大"内容真空"与"消费能力释放"窗口；本地化运营、系列化品牌、轻资产模式可快速占据区域心智构建护城河。
    role: theorem
    src:
