- 'no': 16
  name: TikTok Shop与出海电商新范式 —— 全托管非普通人红利、达人带货黄金窗口、东南亚低门槛高收益
  desc: 本章解析TikTok Shop美区全托管模式(类TEMU/京东自营)门槛极高(优质供应链/压货压账期)，普通人难直接入场；但自营模式重构达人带货生态(解决断货/质量差痛点、提升转化降低退货、平台GMV目标驱动流量扶持)，东南亚市场(马来/菲律宾)门槛极低(几百播放出单)、美区达人补贴10美元/条，建议深耕东南亚达人带货、提前布局美区账号。
  nodes:
  - 'no': 1
    name: 平台战略转向必然论与全托管非普通人红利论
    desc: 跨境卖家自运营表现极差(GMV远低于TEMU)，平台为完成KPI必须向TEMU模式看齐掌控履约选品权；全托管本质是供应链生意，要求优质货源/极致性价比/垫资压货/长账期承受，普通人无法参与。
    role: theorem
    src:
    - paper: docs/202306/20230613_241.md
  - 'no': 2
    name: 自营模式重构达人带货生态论
    desc: 平台转向自营/全托管将从根本解决达人带货两大痛点：商家断货链接失效、产品质量差店铺被封/退货率高；将显著提升转化率、降低退货率，迫使平台增加电商视频流量权重完成GMV目标，形成达人带货黄金窗口。
    role: theorem
    src:
    - paper: docs/202306/20230613_241.md
  - 'no': 3
    name: 达人带货市场规模测算与东南亚实测数据
    desc: 平台GMV目标230亿美金×最低10%佣金=23亿美金佣金池；马来西亚实测：单账号月GMV20-30万美金、佣金率15-20%、月佣金30万人民币；视频制作门槛极低，几百播放即出单。
    role: method
    src:
    - paper: docs/202306/20230613_241.md
  - 'no': 4
    name: 美区达人补贴政策与当前电商视频流量受限
    desc: 美区发布有效带货视频奖励10美元/条；小黄车视频属商业类受特殊管控，推流机制不同于娱乐视频，流量普遍较低，政策反复横跳导致效果波动。
    role: limitation
    src:
    - paper: docs/202306/20230613_241.md
  - 'no': 5
    name: 本土商家差异化生存论
    desc: 全托管清退大量"骚操作"跨境卖家，虽平台自营成强劲对手，但平台无法覆盖全品类，留给本土商家(含华人资源)在非标品、垂类深耕等差异化赛道巨大生存空间。
    role: theorem
    src:
    - paper: docs/202306/20230613_241.md
- 'no': 17
  name: 创业避坑与实体店前置风控 —— 人流实测、修路排查、岗前沉浸、低认知命名、高可见招牌
  desc: 本章提供开店前置风控五步法：人流实测(计步器7天全时段量化)、市政规划风险排查(官网/12345核实+合同嵌入修路减租条款)、岗前沉浸式打工(3个月低成本获取隐性知识)、低认知成本命名法(参考互联网大厂无生僻字)、高可见度招牌设计法(红底白字+强制夜间亮灯最大化物理曝光)。
  nodes:
  - 'no': 1
    name: 前置调研成本<<试错损失成本
    desc: 投入十几万本金前，花时间成本做实地调研/打工学习(近乎零金钱成本)，远低于开业后倒闭导致的本金归零、负债还债沉没成本。
    role: theorem
    src:
    - paper: docs/202306/20230613_068.md
  - 'no': 2
    name: 选址微观差异决定生死与外部政策风险契约对冲
    desc: 同街区马路两侧人流量/商业性质截然不同，宏观"大街火"不等于微观"铺位活"；不可控市政建设可通过租赁合同条款(修路减租)将风险转化为可量化财务对冲。
    role: theorem
    src:
    - paper: docs/202306/20230613_068.md
  - 'no': 3
    name: 商业命名功能主义本质与招牌即物理流量入口
    desc: 店名非自我表达艺术品，而是降低消费者决策摩擦工具；好名字=低认知成本+高业务暗示度。招牌核心KPI=被看见概率×距离，审美偏好让位于物理可见性(红底白字高对比度占比高注意度高)。
    role: theorem
    src:
    - paper: docs/202306/20230613_068.md
  - 'no': 4
    name: 五大基础动作虽不保证盈利但显著降低倒闭概率
    desc: 人流实测、修路排查、岗前打工、低认知命名、高可见招牌是开店风控的必要非充分条件：做到不一定赚钱，但不做倒闭风险大很多。
    role: finding
    src:
    - paper: docs/202306/20230613_068.md
