- 'no': 1
  name: 社群认知重构 —— 从"温室花朵"到"自负盈亏"
  desc: 本章拆解生财有术等付费社群的核心价值定位，揭示新人易陷入的"选择大于努力"误读、幸存者偏差、素人标签掩盖的阶层差异，并提出航海手册优先、精华帖信用体系、三步大佬甄别法等信息过滤与认知对齐方法论。
  nodes:
  - 'no': 1
    name: 生财非温室论
    desc: 付费社群不提供庇护，而是提供风口情报、高手经验、大规模实战标准化（航海）三大杠杆，成员需直面商业竞争残酷性，主动适应环境。
    role: motivation
    src:
    - paper: docs/202306/20230613_012.md
    - paper: docs/202306/20230613_021.md
  - 'no': 2
    name: 航海手册与精华帖信用体系
    desc: 航海手册由多教练协作编写经审核，质量超市面90%课程；精华帖是"真心利他"的硬指标，优于粉丝数、截图等易造假指标。
    role: definition
    src:
    - paper: docs/202306/20230613_012.md
  - 'no': 3
    name: 三步大佬甄别法
    desc: Step1查精华帖（利他证明），Step2查同步发布星球数（>3为营销号高危），Step3查选题多样性（翻新秀肌肉为低质）。
    role: method
    src:
    - paper: docs/202306/20230613_012.md
  - 'no': 4
    name: 素人等级森林与幸存者偏差
    desc: 同为"素人"，500强总监与普通打工者底层能力天差地别；仅看结果忽略隐性变量（精力管理、职场积累、家庭支持）导致错误归因与焦虑。
    role: limitation
    src:
    - paper: docs/202306/20230613_021.md
  - 'no': 5
    name: 选择需建立在认知努力之上
    desc: '''选择大于努力''被误读为只需选对赛道；实则''选择''本身是高强度认知努力（调研、溯源、试错）的产物，无努力支撑的选择是赌博。'
    role: theorem
    src:
    - paper: docs/202306/20230613_021.md
  - 'no': 6
    name: 成事能力可迁移但不可复制
    desc: 核心能力（执行力、结构化思维）可跨域迁移，但其形成路径（职场打磨、资源积累）不可被普通人短期复制，需承认时间差与路径依赖。
    role: theorem
    src:
    - paper: docs/202306/20230613_021.md
  - 'no': 7
    name: 小马宋非对等社交破圈法
    desc: 弱者连接强者核心在于"利益绑定"：站在对方视角提供具体价值（如月饼、AI定制宣传、跨年演讲传播），而非单向索取，前提是自身具备专业能力。
    role: method
    src:
    - paper: docs/202306/20230613_003.md
  - 'no': 8
    name: 信息差系统性复盘与整合发布法
    desc: 以关键词锚定检索社区精华（如信息差100+篇），深度阅读归纳输出结构化长文（飞书文档+公众号导流），实现隐性经验显性化迁移与个人IP资产构建。
    role: method
    src:
    - paper: docs/202306/20230613_004.md
- 'no': 2
  name: 新人破局实战 —— 从"零收入"到"正反馈闭环"
  desc: 本章聚焦零基础新人如何通过社群陪跑（航海）、优势匹配、隐性知识显性化、最小可行性产品（MVP）验证，跨越0-1鸿沟，建立"下场-复盘-迭代"的正向飞轮。
  nodes:
  - 'no': 1
    name: 隐性操作知识与养号门槛
    desc: SOP未覆盖的平台规则细节（如抖音/公众号养号机制、违规判定边界）是新人跑通项目的关键门槛，不下场永远不知道隐性坑点。
    role: motivation
    src:
    - paper: docs/202306/20230613_016.md
  - 'no': 2
    name: 优势-项目匹配度与历史手册复盘法
    desc: 新人入场前盘点自身技能、资源、性格偏好，选择高匹配度航海项目；利用历史航海手册预研规避坑位，降低试错成本。
    role: method
    src:
    - paper: docs/202306/20230613_016.md
  - 'no': 3
    name: 正向反馈循环与心态重建
    desc: 微小变现成功（首笔收入、阅读量增长）建立自信，驱动后续投入与迭代；接受不完美、用数量解决问题、寻求社群帮助是消解焦虑的关键。
    role: method
    src:
    - paper: docs/202306/20230613_016.md
    - paper: docs/202306/20230613_053.md
  - 'no': 4
    name: 社群陪跑式实操法
    desc: 依托航海组织结构，在组长指导下密集实操跑通开店、选品、发笔记、出单、发货全流程，产出复盘文档与直播分享实现知识沉淀。
    role: method
    src:
    - paper: docs/202306/20230613_055.md
    - paper: docs/202306/20230613_036.md
  - 'no': 5
    name: 失败是新人成长的必修课
    desc: 首战失败是大概率事件，核心差异在于能否从失败中提炼隐性知识、完成心态复原并迅速启动下一轮试错；不下场永远不知道隐性坑点，不复盘永远无法内化能力。
    role: theorem
    src:
    - paper: docs/202306/20230613_016.md
  - 'no': 6
    name: 执行力与细节打磨跨越0-1鸿沟
    desc: 同等认知下，能否赚到钱取决于极致执行力（攻克技术难关、持续优化文案、手动跑通前100单）和对用户体验细节的打磨。
    role: theorem
    src:
    - paper: docs/202306/20230613_011.md
  - 'no': 7
    name: 郭晓文低谷破局四步法
    desc: 物理隔离控制成本（退租办公室、星巴克流动办公） -> 心理建设维持战斗意志（拒绝抱怨环境） -> 借力社群捕捉红利项目（生财有术提供SOP与团队）
      -> 实操手册化输出反哺生态（建立个人IP与信任资产）。
    role: method
    src:
    - paper: docs/202306/20230613_020.md
  - 'no': 8
    name: 苍述网赚避坑指南与企业号先行策略
    desc: 基于亲身踩坑总结新手五大深坑，规避抖音店群资质风险需'先申请企业号再开店'，真实经验构成的避坑指南比理论教学更具实战价值。
    role: method
    src:
    - paper: docs/202306/20230613_022.md
- 'no': 3
  name: AI赋能内容生产 —— 从"玩"到"用"的范式跃迁
  desc: 本章系统梳理ChatGPT、Midjourney、Stable Diffusion等生成式AI在文本、图像、视频创作中的落地范式，核心在于"过程观"替代"单点指令"、提示词工程标准化、AI与人类分工协作（角色设定、分步生成、迭代优化）、以及工具链封装降低门槛。
  nodes:
  - 'no': 1
    name: AI写作的过程观与门槛悖论
    desc: AI辅助写作是需人类深度参与的动态交互过程，非单次指令生成；工具表面降低门槛，实则提高对判断力、审美力、提问能力的要求，加剧分化。
    role: motivation
    src:
    - paper: docs/202306/20230613_027.md
  - 'no': 2
    name: 双角色ChatGPT协作写作法
    desc: 角色A（热点点评人）提炼观点，角色B（情感文仿写专家）生成结构，合并输出初稿再人工微调，实现公众号文章高效批量产出。
    role: method
    src:
    - paper: docs/202306/20230613_016.md
  - 'no': 3
    name: 角色指令三要素与生成器
    desc: 高质量角色指令由身份设定、任务设定、约束设定三模块构成；可用"角色生成器"让AI反向生成指令草稿，人工微调即用，降低提示词工程门槛。
    role: definition
    src:
    - paper: docs/202306/20230613_123.md
  - 'no': 4
    name: AI绘画工作流：Midjourney + LeiaPix + 剪映
    desc: ChatGPT创作故事分镜 -> Midjourney生成关键帧 -> LeiaPix转3D动态视频 -> 剪映合成字幕配音BGM，实现零基础制作商业级3D视频。
    role: method
    src:
    - paper: docs/202306/20230613_207.md
  - 'no': 5
    name: Stable Diffusion双核应用范式：LoRA炼丹 + ControlNet控制
    desc: LoRA负责炼制特定人/物模型（是什么），ControlNet负责精准控制生成过程（怎么生成），配合一站式整合包与全流程自验证教程，实现真人模特定制与商业建模。
    role: method
    src:
    - paper: docs/202306/20230613_026.md
  - 'no': 6
    name: AI工具降低应用门槛论
    desc: 将复杂Prompt Engineering封装为产品化"快捷指令"（如HARPA AI插件），普通用户无需掌握提示词工程即可高效利用大模型处理专业阅读任务。
    role: theorem
    src:
    - paper: docs/202306/20230613_014.md
  - 'no': 7
    name: AI加剧创作能力分化定律
    desc: 生成式AI普及不会平均化创作能力，反而因使用者认知水平、提问能力、审美判断力差异，放大高手与新手产出差距，加剧社会分化。
    role: theorem
    src:
    - paper: docs/202306/20230613_027.md
  - 'no': 8
    name: 台风ChatGPT自媒体矩阵自然流量变现法
    desc: 结合ChatGPT特点与角色指令技术，搭建自媒体矩阵获取自然流量，实现自动成交变现，3个月变现5万+。
