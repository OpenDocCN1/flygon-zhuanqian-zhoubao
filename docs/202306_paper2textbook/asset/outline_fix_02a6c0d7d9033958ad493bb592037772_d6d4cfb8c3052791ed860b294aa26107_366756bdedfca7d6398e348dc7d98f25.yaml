    src:
    - paper: docs/202306/20230613_205.md
  - 'no': 18
    name: 海外工具站双重变现与选品方法论
    desc: 卖流量(免费工具+广告/联盟)与卖产品(付费工具+完整销售链路)双轨并行；三要素判断标准(市场需求/ChatGPT相关性/普通人可控复杂度)筛选利基方向；关键词组合搜索挖掘需求。
    role: method
    src:
    - paper: docs/202306/20230613_206.md
  - 'no': 19
