    desc: 票务溢价能力取决于用户心中预期的"认定价值"而非实际内容成本；前期宣传造势(海报堆嘉宾/IP/活动项)建立高认定价值支撑高票价(预售35-60,
      VIP80-120)。
    role: theorem
    src:
