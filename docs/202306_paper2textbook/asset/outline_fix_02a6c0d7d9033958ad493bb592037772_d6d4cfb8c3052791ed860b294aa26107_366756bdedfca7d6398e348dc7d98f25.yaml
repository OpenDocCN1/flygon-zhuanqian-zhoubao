    role: method
    src:
    - paper: docs/202306/20230613_210.md
- 'no': 4
  name: 短视频与直播电商 —— 素材为王、人货场匹配、合规生存
  desc: 本章覆盖抖音、快手、视频号三大平台的短视频挂车投流、无人直播、图文带货、矩阵化运营实战方法论，核心主张：账号99.9%无限流问题，核心在于素材能力；合规是生存底线；人货场匹配决定ROI上限；学习期不动如山。
  nodes:
  - 'no': 1
    name: 视频号挂车投流全链路SOP
    desc: 账号自查清单 -> 素材拆解优化（黄金前3-5秒钩子、节奏控制、引单话术） -> 选品四维筛选（用户画像、佣金>20%、价格带29-199、高转低退）
      -> 合规改造话术库 -> 分层测试投放策略 -> 三维归因复盘模型。
    role: method
    src:
    - paper: docs/202306/20230613_039.md
  - 'no': 2
    name: 快手无人直播矩阵化操作
    desc: 选品三维法则（客单50-150、佣金>20%、高转化） -> 低成本硬软件搭建（闲置手机+采集卡+绿幕+OBS/VMix，单间2-3千元） ->
      素材去重防违规技术体系 -> 新号前3场流量承接法（养权重/测款/放量） -> 矩阵化复制放大。
    role: method
    src:
    - paper: docs/202306/20230613_063.md
  - 'no': 3
    name: 抖音图文带货：矩阵+爆款模式
    desc: 中老年中医赛道适配图文矩阵，单账号受限于流量波动，13号矩阵对冲风险利用大数定律稳定GMV；爆款复刻SOP（标题/封面/内容三要素拆解模仿）实现确定性出单。
    role: method
    src:
    - paper: docs/202306/20230613_044.md
    - paper: docs/202306/20230613_043.md
  - 'no': 4
    name: 抖音混剪带货去重标准化流程
    desc: 分离背景音保留脚本 -> 智能镜头分割 -> 主轨道打乱顺序重组 -> 辅助轨道锁定叠加特效/画中画/干扰音 -> 入出点(I/O键)批量导出，解决限流、爆款复制、投诉风险三大痛点。
    role: method
    src:
    - paper: docs/202306/20230613_135.md
  - 'no': 5
    name: 账号无罪定理与素材迭代优先论
    desc: 除非后台明确违规，账号本身99.9%无限流问题，播放低核心是素材质量不足；投流成功关键变量是素材生产迭代能力，低水平重复生产是最大陷阱。
    role: theorem
    src:
    - paper: docs/202306/20230613_039.md
  - 'no': 6
    name: 合规是生存底线与学习期不动如山原则
    desc: 视频号严打营销号，擦边球（引导私域、硬广、虚假宣传）必死；新计划学习期任何人为干预均会重置模型，导致成本失控。
    role: theorem
    src:
    - paper: docs/202306/20230613_039.md
  - 'no': 7
    name: 抖音纯付费流单品带货红利耗尽与核心供应链生存律
    desc: 2023年赛道进入红海末期，流量成本上涨利润压缩，新手大概率亏损；唯有掌握核心供应链(佣金≥80%)才能抵消成本通胀；原创实拍是长周期跑量必要条件；付费流本质是高风险赌博。
    role: theorem
    src:
    - paper: docs/202306/20230613_042.md
  - 'no': 8
    name: 抖音无人直播情商课蓝海玩法
    desc: 极简场景(一段音频+一段动图)、免挂载防封(不挂小程序/小黄车)、单机多开矩阵(一机4个)、私域引流转化，实测3号月入1万+。
    role: method
    src:
    - paper: docs/202306/20230613_047.md
  - 'no': 9
    name: 行舟体验差理论与人设公式
    desc: 故意降低人设包装压低用户预期(30分)，聚焦打磨内容核心价值超预期交付(50分)，制造正向心理落差获取关注；去权威化人设优于权威人设吸粉。
    role: theorem
    src:
    - paper: docs/202306/20230613_046.md
  - 'no': 10
    name: 快手无人直播平台结构性优势与收益预期分层
    desc: 快手风控宽容/货找人机制/变现路径短三大优势；小白收益分层：入门期亏损/回本、成长期日佣200-500、成熟期矩阵日佣1000+；合规化生存策略将博弈转为经营。
    role: theorem
    src:
    - paper: docs/202306/20230613_063.md
