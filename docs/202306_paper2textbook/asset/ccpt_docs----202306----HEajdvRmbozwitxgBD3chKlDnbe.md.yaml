paper: docs/202306/HEajdvRmbozwitxgBD3chKlDnbe.md
desc: 该素材以高考作文生成为案例，系统阐述了人机协作创作的核心方法论——拒绝“一键生成”的浮躁心态，主张将AI视为大脑延伸的“神级装备”而非万能NPC，通过“目标拆解→标准调研→方法论沉淀→结构化提示词工程→迭代优化”的标准化流程，实现从依赖运气的单次输出到可复用、可复利的方法论资产积累，核心观点在于：AI看似降低门槛，实则提高门槛，人类的创意与深度思考是不可替代的核心竞争力。
concepts:
- name: 人机共创范式转移
  desc: 从将AI视为外包执行者的‘任务委托模式’，转变为将AI视为大脑延伸器官的‘认知协作模式’，强调人类保留顶层设计、标准制定、质量把控等核心决策权，AI负责机械化执行与知识检索。
  is_original: true
  excerpt:
  - GPT更像是我大脑的一部分，他负责了机械化、执行的那一部分。他会是我们的一个器官，而非是一个特定对象
  - 我们应该让ChatGPT融入我们的创作，而非把任务交给GPT。
- name: 神级装备理论
  desc: AI能力的发挥取决于使用者的驾驭能力（属性值），高水平使用者可获得100%能力加成，低水平使用者仅得30%，解释了为何同一工具产出天壤之别。
  is_original: true
  excerpt:
  - 一些RPG游戏里面，高等级的装备是需要我们的某个属性超过某个数值，穿上去才能给你加100%的能力。如果所要求的属性不足，那么穿上这件装备，这些装备或许就只能给你加30%的能力了。
- name: 方法论沉淀与复利
  desc: 将一次性解决问题的过程（调研标准、设计流程、优化Prompt）转化为可复用的结构化资产（提示词库、SOP），实现后续生产边际成本趋近于零的指数级复利效应。
  is_original: true
  excerpt:
  - 我做好这样的调研，沉淀下来了这一套方法论。我下次写出这样的一篇作文的时间，就是复制粘贴的功夫，可能只要几分钟。
  - 沉淀你的方法论，沉淀你的提示词，并且不断优化迭代。千万不要惧怕一开始要投入的大量精力和时间。因为这是一件复利的事，并且极其极其复利。
- name: 高考作文双层评分体系
  desc: 素材整理的高考作文官方评分标准，包含基础等级评分（内容20分+表达20分）与发展等级评分（深刻、丰富、有文采、有创意四维，任一突出可得满分20分），总分60分。
  is_original: false
  excerpt:
  - 一篇中国高考语文满分作文得分由下述规则构成：1. 基础等级评分：基础等级的评分分为内容和表达两项，各自达20分... 2. 发展等级评分：发展等级评分依据4个评分点，只需一点突出，即可按等级评分，直至满分。这里也占20分。
- name: 结构化提示词工程
  desc: 一种分层级、模块化的Prompt设计方法，包含角色设定、任务拆解、标准注入、方法论注入、少样本示例、输出约束等模块，而非单一指令。
  is_original: true
  excerpt:
  - 下面我希望你成为一名中国的语文特级教师... 请认真学习并总结出一套作文得到满分的技巧方法发送给我。
  - 我把评分标准和写作手法都提供给了GPT。
methods:
- name: __overview__
  desc: 标准化AI协作创作五步法：1. 目标与标准显性化（调研评分规则/成功标准）；2. 专家角色建模与方法论萃取（让AI总结满分技巧）；3. 结构化上下文构建（注入标准、方法、案例）；4.
    执行生成与专家评估（真实场景测试）；5. 方法论沉淀与迭代复利（固化Prompt资产）。
  excerpt:
  - 拆解写一篇高考作文的真正步骤：我们的目的是什么？达到目的所要具备的标准是什么？如何达到标准？
  - 先告诉G老师我们要做什么 -> 把我们刚才的标准告诉G老师 -> 获得G老师总结的写作方法 -> 给考生小G布置任务 -> 最终产出结果 -> 专家评测 ->
    沉淀方法论
- name: 标准逆向工程法
  desc: 通过联网搜索或专家咨询，获取目标领域的顶级评价体系（如高考满分标准、爆款笔记指标），将隐性经验显性化为可量化、可执行的检查清单，作为AI生成的约束条件与验收标准。
  excerpt:
  - 一篇中国高考语文满分作文，所需要具备的要素是什么？阅卷老师是怎么样评出一篇满分作文的？你可以联网搜索来优化你的总结。
  - 我们要对得到的信息进行了精简整合，剔除一些我们不需要的内容，于是我们有了以下的投喂资料...
- name: 专家人设链式推理法
  desc: 先让AI扮演领域专家（语文特级教师）内化评分标准并输出方法论，再让AI切换至执行者人设（考生）执行写作，实现‘策划-执行’分离，规避单一角色推理的局限性。
  excerpt:
  - 下面我希望你成为一名中国的语文特级教师，请先完成下面这项任务... 请认真学习并总结出一套作文得到满分的技巧方法发送给我。
  - 参考以前小凡文章的写作技巧... 给予考生小G满分规则和写作手法
- name: 真实专家盲测验证法
  desc: 将AI生成内容伪装为人类作品，提交给真实领域专家（一线阅卷教师）进行盲测打分与定性分析，获取客观质量基线与改进方向，替代主观臆断。
  excerpt:
  - 小凡联系一名俺们台州当地一所高中的语文老师，把这篇文章伪装成俺的小外甥... 得到了下面的评价
  - 在P1-P4中，王老师真把这个作文当成我的小外甥写的文章了... 能拿一个中等偏上水平... 48分，还不错，但没啥特别的亮点。
theorems:
- name: AI使用门槛悖论
  desc: '[claim] AI工具表面上降低了创作技术门槛，但实际提高了优质内容产出的认知门槛，加剧了‘会用AI深度思考者’与‘仅会用AI偷懒者’之间的能力分化。'
  excerpt:
  - AI看似降低了创作的门槛，但实际提升了门槛。
  - 创意，是你生而为人最后的尊严。请不要停止你的思考。
- name: 思考外包陷阱
  desc: '[claim] 将核心思考过程（拆解问题、定义标准、设计路径）外包给AI，必然导致平庸输出；高质量人机协作的前提是人类完成‘脏活累活’的认知前置工作。'
  excerpt:
  - 使用GPT来解决问题是一个过程，但太多人将其当做两点一线。妄想给内容出结果，用你这个思维，我认为你在高考时也手写不出啥好文章来。
  - 我们丧失了一步一步拆解问题的耐心，也放弃了寻找问题本质的思考，这才是让我感到失望和崩溃的地方。
- name: 尊重三原则
  desc: '[claim] 高效人机协作建立在三重尊重之上：尊重AI智商（按流程指挥而非乞求结果）、尊重同行智商（拒绝低质量内容污染生态）、尊重自我智商（通过训练AI倒逼自我成长）。'
  excerpt:
  - 请尊重GPT的智商，请老老实实按照步骤让GPT完成任务... 请尊重他人的智商，不要妄想你随随便便用GPT产出的内容，就去吊打你的同行... 请尊重你自己的智商...
    请你学会好好教导，训练GPT成为你想要他成为的执行机器。
- name: 创作本质迁移律
  desc: '[claim] 所有文字创作（高考作文、小红书文案、情书、复盘）共享同一底层逻辑：目的导向→标准定义→方法论达成，掌握高考作文的AI协作方法论即掌握了通用内容创作范式。'
  excerpt:
  - 全文没有提自媒体创作，但全在讲自媒体创作... 我未尝不是在写小红书笔记呢？我未尝不是在写自媒体创作？
  - 在小红书发笔记的目的是什么？想要达到笔记的目的，我的笔记需要具备哪些特点？如何达到这些特点？
findings:
- name: 一键生成作文实测质量
  desc: '[evidence] 经过标准调研、专家建模、结构化Prompt、双专家盲测的完整流程生成的作文，获真实一线语文教师评分48分（满分60分），评价为‘中等偏上、文笔尚可、结构主旨不够到位、素材积累不足、无特别亮点’。'
  excerpt:
  - 在P1-P4中，王老师真把这个作文当成我的小外甥写的文章了... 能拿一个中等偏上水平，文笔还是很可以的，但是结构和主旨理解还不算到位，素材还可以多积累。
  - 在P5-P6中，我同样把这篇文章给了另一位高中老师，也得到了差不多的结论：48分，还不错，但没啥特别的亮点。
- name: 前置投入时间成本统计
  desc: '[evidence] 完整流程的前置调研与方法论构建耗时约3小时，不含后续迭代优化时间；但沉淀后复用仅需几分钟（复制粘贴Prompt），验证了‘前期高投入、后期零边际成本’的复利特性。'
  excerpt:
  - 在高考中... 最后留给考生写出一篇作文的时间大约一般只有40分钟-1小时。而小凡做的调研，让考生小G学习怎么写作文，花了3个小时左右，这里还不包括后面如果要优化迭代投入的时间。
  - 我做好这样的调研，沉淀下来了这一套方法论。我下次写出这样的一篇作文的时间，就是复制粘贴的功夫，可能只要几分钟。
- name: 典型错误提示词模式
  desc: '[evidence] 付费社群用户典型提示词表现为：指令模糊、逻辑混乱、缺乏标准与约束、甚至人类阅读者也难以理解，印证了‘人话没说清，鬼也办不成’的核心痛点。'
  excerpt:
  - 下面是我的付费星球的一个小伙伴写的提示词，这样的案例实在太多了。
  - 老实说，我作为一个被称为人类的有机生命体，我也看不太懂这说的是啥。
- name: 专家改进建议数据支撑
  desc: '[evidence] 两位一线语文教师独立给出一致改进方向：1. 强化结构与主旨深度（对应‘深刻’评分点）；2. 扩充鲜活素材库（对应‘丰富’评分点）；3.
    提升语言表现力（对应‘有文采’评分点），为后续Prompt定向优化提供了明确梯度。'
  excerpt:
  - 王老师... 结构和主旨理解还不算到位，素材还可以多积累。
  - 戴老师... 48分，还不错，但没啥特别的亮点。
  - 第二位戴老师，还提出了我一直在讲的一个观点…… AI看似降低了创作的门槛，但实际提升了门槛。
