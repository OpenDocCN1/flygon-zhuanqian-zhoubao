    desc: 0-1重点建模型算流量/人工/利润；1-10做标准化、批量上人、筛选优化（销售SOP+人才SOP双轨、杀伐果断清退低产出者）；10-100搭建中后台、拆分业务单元、设计合伙人分红/虚拟股/超额分红机制，以增量利益分配换取核心人才长期绑定。
