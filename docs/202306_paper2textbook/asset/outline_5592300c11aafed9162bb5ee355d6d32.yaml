  - 'no': 9
    name: 管理本质是买时间买结果：发钱买他人能力突破个人精力天花板
    desc: 从1-10的核心跃迁是创始人从‘亲力亲为’转向‘发钱买时间、买解决方案、买结果’，通过资本换取他人时间与能力。标准化是规模化必要充分条件：唯有将‘人’与‘事’双重标准化并建立中后台，才能实现组织低熵增复制。
