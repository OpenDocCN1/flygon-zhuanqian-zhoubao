    desc: 活体/非标品因个体差异巨大、上游分散（养户小散）、质检标准难统一、售后风险不可控、繁育扩张边际成本指数级上升，天然阻碍标准化规模化复制，企业上限受制于供应链而非流量。
    role: limitation
