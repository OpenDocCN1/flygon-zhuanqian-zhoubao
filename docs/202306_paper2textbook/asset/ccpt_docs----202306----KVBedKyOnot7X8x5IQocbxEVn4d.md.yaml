paper: docs/202306/KVBedKyOnot7X8x5IQocbxEVn4d.md
desc: 该素材是一份基于作者“温酒”两年实操经验的小程序推广计划实战手册。核心内容包括：通过“回马枪”策略（利用头部机构撤退后的市场空白期切入）、数据驱动选品（星图平台+搜索话题+同行朋友圈情报三重验证）、低门槛起号路径（图文心理测试→混剪视频→长线品）、以及“个人玩家→团队长→卖铲子”三阶段进化论。作者主张小程序项目虽老但存量市场可做，关键在于建立团队管道收益以对抗项目周期性衰退，实现从赚项目钱向赚组织钱、赚认知钱的跃迁。
concepts:
- name: 小程序推广计划 (CPS模式)
  desc: 创作者发布含小程序链接的内容，用户点击使用小程序并观看广告后，创作者获得广告费分成（90%），平台日结，属于存量持久型变现项目。
  is_original: false
  excerpt:
  - 创作者（我们）创作跟小程序相关的内容，再将小程序链接挂载在我们的视频上去推广小程序，只要要用户通过点击你的作品挂载的小程序链接搜索你并观看了广告，你就能获得对应的广告费收益分成（90%）
  - 广告单价正常是在0.1-0.3之间...平台日结，满20可以提现。
- name: 回马枪策略 (市场空白期切入)
  desc: 当头部机构（如第一馆）战略转移导致主力军撤离，市场竞争降级、素材审核放宽（爆款少掉链接）时，反向切入老项目，利用存量红利快速出结果。
  is_original: true
  excerpt:
  - 由于主力军都跑到推文项目搞钱去了，小程序项目市场不就空白出来了吗。
  - 我通过抖音搜索关键词，搜集数据，发现小程序项目又回到平稳期了，近期爆款很少有掉链接的...这个项目能搞，来个回马枪！
- name: 三阶进化论 (个人玩家→团队长→卖铲子)
  desc: 互联网项目生存的核心路径：第一阶段靠个人执行力跑通流程赚项目钱；第二阶段组建团队建立管道收益（5%下级分佣）对抗项目周期波动；第三阶段输出教程/陪跑服务（卖铲子）实现认知变现，构建项目闭环。
  is_original: true
  excerpt:
  - 活到最后的都是是带团队的，项目低谷期也能靠管道收益活下去
  - 有了一定的经验积累，可以尝试卖铲子赚钱，毕竟教别人赚钱才是最赚钱的生意！
  - 想赚钱先聚集人，与你同行的人越来越多，你测试项目的频率就会越来越高，你的边际成本就会越来越低
- name: 正反馈闭环 (起号心法)
  desc: 新手入场核心逻辑：先用最低成本玩法（图文心理测试）快速跑通流程获得正反馈（出爆款/有收益）→ 建立信心与账号权重 → 延伸至高单价长线品（生日花语/头像定制）
    → 沉淀私域资产。
  is_original: true
  excerpt:
  - 利用简单的图文心理测试让群里的朋友快速拿到正反馈，再延伸到长线品拿到更大的正反馈，从而拉起了200人团队
  - 小程序是一个相对门槛比较低的一个项目，可以先从简单的图文心理玩法，拿到正反馈，入门后，有意识得去积累自己的信息差，优化出属于自己长期的玩法
- name: 信息差纽带效应
  desc: 带团队者因拥有大量学员数据反馈，天然形成信息差优势：可碾压式降低试错成本、交换更多高阶资源、并在项目切换时实现团队平滑迁移，是个人玩家无法比拟的核心护城河。
  is_original: true
  excerpt:
  - 带团队的人是天然的信息纽带，每天大量学员的数据反馈，足以形成信息差碾压，试错成本大大减低
  - 掌握信息差，还可以利用信息差交换更多的信息资源，积累更多的人脉。即使后面项目跑不下去了，还可以带着人继续跑下一个项目。
methods:
- name: __overview__
  desc: 全流程实操方法论：市场窗口期判断(回马枪) → 多源数据选品验证(星图+搜索+同行) → 分级起号执行(图文→视频→长线品) → 团队裂变放大(分佣体系)
    → 认知付费变现(卖铲子)。
  excerpt:
  - 第一部分：小程序推广项目的现状 (市场判断)
  - 第二部分：小程序推广计划保姆教程 (选品、基础教程、进阶玩法)
  - 第四部分：给新入场的朋友一些建议 (分级起号路径)
  - 第五部分：组建两次团队后的一些思考 (团队裂变与认知变现)
- name: 星图天花板法 (选品验证法)
  desc: 利用抖音星图平台‘小程序推广计划’官方后台，按‘收益最高’排序，反查对标爆款视频，分析其玩法、素材、剪辑手法，评估自身可模仿性与优化空间，确定切入品类。
  excerpt:
  - 第一步抖音搜索：小程序推广计划，点击进入官方后台
  - 第二步：点综合排序，选收益最高
  - 第三步：通过收益找对标视频...了解一下爆单视频长什么样，自己有没有可能模仿出来，先抄后超。
- name: 搜索话题溯源法 (对标挖掘法)
  desc: 在抖音搜索目标品类关键词(如‘生日花语’)，点击话题筛选‘播放最高’视频，锁定低粉爆款新号(挖掘新展现形式)与稳定更新老号(参考选品标准)，建立对标账号库。
  excerpt:
  - 我们要做哪个品，先到抖音搜索关键词，找到对标账号...点话题，选播放最高的点进去
  - 对标低粉爆款的新号——可以挖掘新的展现形式，对标稳定更新的老号——参考选品，同行是最好的老师
- name: 同行朋友圈情报法 (隐性数据收集法)
  desc: 主动添加主页留微信的同行，围观朋友圈收集真实收益截图、未打码关键词、爆款案例；甄别‘偷图微商’；与核心玩家建立深度连接(发红包/付费买玩法)，构建私有情报数据库。
  excerpt:
  - 但凡是刷到主页留微信的同行，尽管加上去，围观朋友圈，收集数据
  - 我第一个10万就是通过同行朋友圈的一张星图收益截图赚到的...抖音搜索他没打码的关键词，找到了对标账号
  - 当你有了团队后，个人玩家的爆款玩法直接付费买过来共享，可以减少试错成本
- name: 分级起号执行体系 (三大核心玩法)
  desc: 按操作门槛与收益上限分级：L1 图文心理测试(零基础、快速正反馈)；L2 街坊心理测试(需剪辑基础、互动率高)；L3 生日花语混剪(转化高、长线品、可延伸定制变现)。辅以‘神评论运营’提权重。
  excerpt:
  - 1、一张图心理测试（适合新手）
  - 2、街坊心理测试（适合有剪辑基础的朋友）
  - 3、生日花语混剪（转化高）
  - 4、如何利用神评论提高账号权重（必看）
- name: 团队裂变放大模型 (分佣管道构建法)
  desc: 利用平台自带5%下级分佣机制：个人跑通流程 → 朋友圈摇人/社群陪跑 → 批量复制标准化SOP → 建立200人+团队 → 实现被动管道收益(作者被动收益4万/25万)
    → 覆盖项目低谷期现金流。
  excerpt:
  - 通过平台自带团队分佣体系搭建团队，轻运营实现被动管道收益
  - 利用简单的图文心理测试让群里的朋友快速拿到正反馈...从而拉起了200人团队，稳定发育ing
  - 个人变现20万（被动收益4万）...个人变现30万(被动收益25万)
theorems:
- name: 存量市场红利论
  desc: 老项目不等于死项目。头部机构撤退后，平台监管放松(少掉链接)、竞争质量下降(宝妈团队真人出镜即可爆款)，反而形成‘平稳期’红利窗口，适合中小团队回马枪切入。
  excerpt:
  - 小程序算是比较老的一个项目了，从2019年一直到现在依然坚挺，可以说是为数不多的持久型项目之一
  - 第一馆是小程序项目的风向标...由于主力军都跑到推文项目搞钱去了，小程序项目市场不就空白出来了吗
  - 发现小程序项目又回到平稳期了，近期爆款很少有掉链接的...简单的混剪视频，单个视频能跑到1.5万收益
- name: 团队生存定律
  desc: 在项目周期波动中，个人玩家受限于精力上限(只能加号)且无信息差护城河，必然随项目衰退而出局；只有组建团队建立管道收益，并成为信息纽带节点，才能实现跨周期生存。
  excerpt:
  - 同样的项目...活到最后的都是是带团队的，项目低谷期也能靠管道收益活下去
  - 那些开局收益很好，却没有拉团队的朋友，已经测试在其他的项目了，之前积累的信息差再无用武之地
  - 一个是精力差...一个是信息差，带团队的人是天然的信息纽带
- name: 正反馈驱动增长论
  desc: 新手/团队成员的留存与规模化依赖于‘快速正反馈’。必须设计极低门槛的入门玩法(图文心理测试)保证高成功率，用微小成功建立信心与惯性，再引导向高价值长线品，而非一上来追求高难度高单价。
  excerpt:
  - 前面半个月想用AI绘画切入...大部分小伙伴不熟悉Ai绘画，没法稳定出图，起号周期长，计划搁浅了
  - 后面经过朋友的点拨,利用简单的图文心理测试让群里的朋友快速拿到正反馈，再延伸到长线品拿到更大的正反馈，从而拉起了200人团队
- name: 卖铲子终局论
  desc: 项目红利周期有限，终极变现形态是‘教别人赚钱’(卖课/陪跑/工具/社群)。通过前期项目实战积累信息差、SOP、案例库，转型为服务商，实现从赚‘辛苦钱’到赚‘认知钱’、‘组织钱’的跃迁，构建个人商业闭环。
  excerpt:
  - 有了一定的经验积累，可以尝试卖铲子赚钱，毕竟教别人赚钱才是最赚钱的生意！
  - 打造自己的项目闭环。
  - 收集足够多的正反馈，再反哺给小伙伴们，一起搞钱快乐！
findings:
- name: AI绘画切入失败案例
  desc: '[evidence] 作者尝试用AI绘画切入头像取图类目，因团队成员技能门槛高(不熟悉AI、出图不稳定)、起号周期长，导致计划搁浅。证明了‘技能门槛>团队平均能力’的玩法不适合团队规模化复制。'
  excerpt:
  - 前面半个月想用AI绘画切入小程序头像取图类目里面来，很遗憾，大部分小伙伴不熟悉Ai绘画，没法稳定出图，起号周期长，计划搁浅了
- name: 图文心理测试起号成功案例
  desc: '[evidence] 替换为‘一张图心理测试’玩法后，团队成员快速获得正反馈(出爆款/有收益)，成功拉起200人团队稳定发育。验证了‘低门槛、快出结果、可延展’的起号策略有效性。'
  excerpt:
  - 后面经过朋友的点拨,利用简单的图文心理测试让群里的朋友快速拿到正反馈，再延伸到长线品拿到更大的正反馈，从而拉起了200人团队，稳定发育ing
  - 下面是我和朋友的团队收益榜首。
- name: 同行情报变现首个10万案例
  desc: '[evidence] 作者通过添加同行微信、围观朋友圈获取一张未打码的星图收益截图，反查关键词找到对标账号，模仿头像视频玩法，结合国庆热点，3条视频破千万播放，实现小程序变现8000+定制头像变现3万，该品类累计变现15万并沉淀1万私域粉丝。证明‘同行朋友圈情报法’极高ROI。'
  excerpt:
  - 我第一个10万就是通过同行朋友圈的一张星图收益截图赚到的，抖音搜索他没打码的关键词，找到了对标账号，一看这么简单的头像视频都能赚到3万块
  - 第二天搞了个号测试，刚好碰上国庆节热点，3个视频破千万播放，小程序变现8000，定制头像变现3万，开始了新品之路，这个品后面累计变现15万，积累一万头像定制私域。
- name: 宝妈团队真人出镜高收益案例
  desc: '[evidence] 观察到原全民任务宝妈团队转型小程序推广，采用真人出镜直播拉新，简单混剪视频单条收益达1.5万。佐证了‘平稳期’市场环境下，低成本内容形式即可跑出高收益，验证了回马枪策略的市场窗口期判断正确。'
  excerpt:
  - 发现一个新的团队，之前跑全民任务的宝妈团队，切过来了，她们通过真人出镜直播搞人是真的猛
  - 简单的混剪视频，单个视频能跑到1.5万收益，这个项目能搞，来个回马枪！
- name: 团队被动收益规模化数据
  desc: '[evidence] 作者两次组建团队实战数据：第1次(21-22上)小程序团队收益70万/个人20万(被动4万)；第2次(22下)推文团队百万GMV/个人30万(被动25万)。被动收益占比显著提升(20%→83%)，印证‘团队裂变放大模型’随经验迭代效率指数级提升。'
  excerpt:
  - ⭐21年-22年上半年带朋友一起跑小程序推广计划，团队收益70万，个人变现20万（被动收益4万）
  - ⭐22年下半年，小说推文项目闭环，团队百万GMV，个人变现30万(被动收益25万)
