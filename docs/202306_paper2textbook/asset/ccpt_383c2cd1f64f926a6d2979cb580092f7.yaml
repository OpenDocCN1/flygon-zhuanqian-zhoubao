paper: docs/202306/20230613_130.md
desc: 该素材为一篇视频号直播投放实战经验总结文章，核心观点确立了“投放是锦上添花的放大器，人货场才是根本”的定位，系统梳理了投放类型、工具介绍、全流程操作（调研、建计划、跟踪）及核心心法（整体ROI视角、心智博弈、供应链终局），旨在指导新手避坑并建立正确的投放认知体系。
concepts:
- name: 投放作为放大器
  desc: 定义投放在直播项目中的定位：非决定性因素，只能在人货场跑通基础上放大效果，无法挽救崩盘的基本盘。
  is_original: true
  excerpt:
  - 在整个直播项目中，投放只是锦上添花的放大器，人货场才是扭转乾坤。只有在人货场跑通的情况下，通过投放才能放大效果，脱离人货场，再厉害的投手都不可能能投出好的效果。
- name: 整体ROI视角
  desc: 主张不应过度关注单条计划ROI，而应通盘考量整体投放计划的ROI及成交额量级，在利润可观前提下追求规模化收益。
  is_original: true
  excerpt:
  - 无需过度关注单独每一条投放计划的 ROI，要通盘去看整体投放计划的 ROI，包括成交额量级。在利润可观情况下，ROI 为 10 成交额为 5000 的计划，并不比
    ROI 为 5 成交额为 10000 的好。
- name: 投放心智博弈
  desc: 将投放定性为认知与心理素质的竞争，强调胆大心细、敢于试错、持续复盘，适应平台算法动态变化。
  is_original: true
  excerpt:
  - 投放也是一个拼心智的过程，胆大心细，敢于尝试，ROI 才有可能保持在一个较高的水平，平台的算法是一直在调整变化的，特别是新平台。投放的技巧与经验，都是靠大量实战投放过程中不断总结分析挖掘出来的，踩过坑，交了学费，才能不断在投放这条路一直走下去。
- name: 供应链终局论
  desc: 指出投放高阶竞争的本质：当投放技术趋同，最终比拼的是品牌供应链能力、直播场景打造能力及资金规模。
  is_original: true
  excerpt:
  - 投放最高层次，大家都在同一个高水准里，其实最后拼的只是品的供应链能力、直播场景的打造能力、投放资金规模大小。
- name: 微信豆投放
  desc: 视频号直播特有的付费推广工具/货币体系，文章以此为核心对象展开流程与工具介绍。
  is_original: false
  excerpt:
  - 对于视频号直播的微信豆投放，流程是怎么样的？如何看投放效果？
methods:
- name: __overview__
  desc: 视频号直播投放系统化操作方法论，涵盖投放类型认知、工具选择、标准化流程（调研-建计划-跟踪）及复盘迭代闭环。
  excerpt:
  - 这篇文章会比较系统性介绍以下几个内容 1.有哪些投放类型 2.各种投放工具的介绍 3.投放流程及投放效果 4.如何创建第 1 条投放计划 4.1 投放前如何调研
    4.2 制定投放计划 4.3 跟踪投放计划 5.投放经验分享
- name: 投放前调研法
  desc: 建立第1条投放计划前的标准化前置动作，包括竞品分析、人群画像圈选、素材准备等，以降低冷启动试错成本。
  excerpt:
  - 4.1 投放前如何调研
- name: 投放计划制定与跟踪法
  desc: 包含出价策略、定向设置、预算分配等建计划细节，及实时监控数据指标（ROI、成交额、流量结构）、动态调整优化的标准化运营动作。
  excerpt:
  - 4.2 制定投放计划 4.3 跟踪投放计划
theorems:
- name: 出价非线性收益定律
  desc: 出价与消耗速度、抢量能力非单调正相关，存在最优出价区间，需匹配人货场承接能力以最大化ROI。
  excerpt:
  - 投放过程中，并不是出价越高，就烧得越快或者越容易抢到量，合适的出价+合适的人货场才能最大化 ROI。
- name: 新平台算法动态适应性原则
  desc: 新平台算法迭代周期短、波动大，固化经验快速失效，唯有持续实战复盘才能维持投放优势。
  excerpt:
  - 平台的算法是一直在调整变化的，特别是新平台。投放的技巧与经验，都是靠大量实战投放过程中不断总结分析挖掘出来的。
