paper: docs/202306/20230627_120.md
desc: 该素材为作者温钟奋（阿温）在生财有术社区的精华帖复盘，记录其作为兼职创业者入局“半藏酱酒”项目半年，通过建立南京建邺分院，实现社群会员50+、销售破百万的实战过程。核心内容揭示了半藏酱酒以“联想系”高管为核心创始团队，创新“总院-分院-联创-股东”四层众创架构，引入“分院达标300万销售额即获总院0.04%期权行权”机制，重构了白酒渠道营销模式与用户交互方式。素材详细拆解了销售架构设计、利润分配逻辑、私域社群运营实操、酱酒产品属性认知（M2C模式适配性）及成败关键因素（全职投入、供应链规模化、专业团队降维打击），并对比了成功分院（厦门、合肥）与自身兼职局限的案例。
concepts:
- name: 总院-分院众创架构
  desc: 半藏酱酒构建的四层组织架构：品牌方下设10大总院（由联合创始人担任院长），总院下发展分院（院长+6-N个联合创始人），分院下发展个人股东，形成品牌方-总院-分院-股东的利益共同体与裂变网络。
  is_original: true
  excerpt:
  - 半藏品牌之下是 10 大总院，总院院长大多是半藏联合创始人，各个总院对下发展分院，总院类似传统意义的省包，每个总院由一个院长+（6-10）个联合创始人，大家地位平等，每个人对下发展的分院，有一套多劳多得，按劳分配的保障机制。
  - 映射到分院，也是一个院长 +6（n）个联合创始人，大家对下发展各自股东，分院价进货到股东提货有大致 30%利润，为联创利润，这，股东还可以按照会员价卖，大致也有
    25%利润
- name: 分院期权行权机制
  desc: 创新激励机制：分院首年提货达300万销售额，即可获得所在总院0.04%股份期权行权资格，将短期销售利润与长期上市红利绑定，极大激发联创招募股东、股东复购推广的动力。
  is_original: true
  excerpt:
  - 引进了期权的概念，即分院一年达成 300 万销售额就可享受所在总院的 0.04%的期权，这一创新性的招募理念，在第一年一下子激发了市场的热情
  - 按照约定，每个分院在成立的第一年只要提货达到 300 万，就可以拿到所在总院的 0.04%股份，联创一边卖货有批零差，一边还有未来上市的巨大红利
- name: KOC利益共同体重构
  desc: 将传统白酒营销中‘自上而下’利用KOC口碑带动大盘的模式，转变为直接让关键意见消费者(KOC)和种子用户成为利益共同体（股东/联创），从而重构厂家与渠道商的链接关系及用户交互方式。
  is_original: true
  excerpt:
  - 白酒产品拥有典型的关键意见消费者 koc，同时天然具备社交传播属性以及分享体验场景。当传统白酒企业企图自上而下用关键消费者口碑作为小盘来带动市场大盘时，半藏模式直接把关键意见消费者和种子用户变成利于共同体，并改变了厂家和渠道商的链接关系，白酒渠道营销模式及用户交互方式因此重构。
- name: 酱酒M2C模式适配性
  desc: 基于酱酒‘高频、高客单价、高复购、强社交、长周期’的黄金产品属性，认定其天然适合‘制造直达消费者’(M2C)的社群众创模式，省去中间流通环节，实现性价比与品质双高。
  is_original: false
  excerpt:
  - 做起来的首要核心是认知到了酱酒的黄金产品属性（五点），基于这个属性，只要找到消费者并形成社群，就可以搭建类似 M2C 的商业模式。
- name: 联想系渠道降维打击
  desc: 半藏创始团队多源自联想高管，凭借在IT/通讯行业积累的通路建设、终端运营、渠道管理经验，对传统酒商形成降维打击，实现了13个月建700+分院、销售破6亿的规模速度。
  is_original: false
  excerpt:
  - IT/通讯行业曾经是中国商品流通领域的通路缔造者，联想人在通路领域积累了丰富渠道经验和合作伙伴积淀，通路，终端，运营等经验相对传统酒商属于降维打击。
methods:
- name: __overview__
  desc: 半藏酱酒的整体商业方法论：以‘大曲坤沙12987工艺+核心产区基酒’守住品质底线（初心）；以‘总院-分院-联创-股东’四层众创架构搭建组织骨架；以‘分院期权行权(300万/0.04%)’为核心引擎驱动裂变；以‘私域社群品鉴+品牌故事+熟人信任’为运营战术；依托‘联想系供应链整合与渠道运营能力’实现快速上规模，最终达成M2C模式下的品效合一。
  excerpt:
  - 半藏品牌之下是 10 大总院...映射到分院，也是一个院长 +6（n）个联合创始人...分院一年达成 300 万销售额就可享受所在总院的 0.04%的期权...分院成立之后，有了联创，接下来就是日常的运营，品鉴，拉人加入...酱酒，只要守住大曲坤沙
    12987 标准工艺...半藏创始团队大多来源于前联想高管...仅仅一年多时间快速逼近 7 亿。
- name: 分院冷启动标准化动作包(SOP)
  desc: 新分院成立的标准化流程：1. 召集5-10位熟人联创，每人出资5万（共50万）；2. 约定半年内每人发展10个股东（每人1万投资）；3. 举办线下成立庆典（品鉴会）完成首批提货；4.
    建立社群进行日常运营、品鉴、裂变。
  excerpt:
  - 这是半藏搭建一个分院的指引模版
  - 我们于 2021 年 12 月 20 南京建邺分院成立，我们就汇集了 10 个联合创始人...启动之初我们每人出资 5 万合计 50 万，并约定半年之内每人发展
    10 个股东，很快我们拉到 30 个个人股东并于 2022 年 1 月 8 日在南京同庆楼开启了分院成立庆典。
- name: 四级利润分配定价体系
  desc: 设计分院价、股东价、会员价、京东零售价四级价格体系：分院价到股东价约30%利润（联创所得），股东价到会员价约25%利润（股东所得），股东价约为京东零售价4折，构建‘喝得有面子(对标大牌)、买得实惠(低于市价)、卖得有利(多级让利)’的闭环。
  excerpt:
  - 分院价进货到股东提货有大致 30%利润，为联创利润，这，股东还可以按照会员价卖，大致也有 25%利润，会员价之上是京东零售价做标杆，总体股东价市京东零售价的
    4 折左右，这样大家感觉喝的有面子，喝的实惠。
- name: 私域社群裂变运营战术
  desc: 核心动作为‘拉人-品鉴-讲故事-转化股东’：利用熟人信任基础组织线下品鉴会（封坛/品鉴会/体验馆），在微信群内持续输出品牌故事、产区知识、行权案例，将消费者转化为股东，股东转化为联创，实现社群裂变。
  excerpt:
  - 分院成立之后，有了联创，接下来就是日常的运营，品鉴，拉人加入，这是半藏给与的一个指导。
  - 推广就需要不断拉人品鉴，讲品牌故事，其实这是最难的环节。
  - 私域玩法：社群玩法用这几年的互联网词汇描述叫私域营销。虽然不走传统商超，酒桌之外很少能看到，但随着核心消费者裂变和流量汇聚，现在能见度越来越高，并溢出到达公域。
theorems:
- name: 众创模式需完美兼容通路与参与者双重利益预期
  desc: 商业模式设计的核心在于：既要符合传统渠道‘批发-零售’的利润分配规律（保障联创、股东赚钱），又要满足众创参与者‘短期分红+长期增值’的财富预期（期权机制），二者缺一不可。
  excerpt:
  - 合理的众创模式设计，既符合通路的规律，也满足众创参与者预期，商业利益角度，完美兼容通路的利益分配和众创者的利益分配。
- name: 初创团队资源禀赋决定项目起步成败（自带天使/A轮资源论）
  desc: 优秀的初创团队（职业背景、人脉、渠道、管理经验）本质上节省了项目早期的投入风险，相当于自带了天使轮甚至A轮资源，是项目能否快速冷启动、跑通模式的关键变量。
  excerpt:
  - 好的初创团队实际上节省了初创项目早期的投入风险，或者换句话说，自带天使轮资源甚至 A 轮资源，自然启动容易和成功率高。
- name: 酱酒规模化是品质护城河的前提（规模-品质正向循环论）
  desc: 酱酒需3-5年窖藏，规模小则无法锁定优质基酒产能，资金压力大导致品质妥协；只有快速做大规模，才能反向锁定核心产区优质基酒，降低成本，形成‘规模→基酒→品质→口碑→规模’的正向飞轮。
  excerpt:
  - 酱酒做不大，源头上就拿不到好基酒，难以坚持做出好酒，成本和费用也下不来。消费者就更感受不到品质和性价比双高。
  - 很多酱酒初心也不错，很快能力守不住初心，品质下滑正是因此，毕竟酱酒需要 3-5 年的发酵，今年卖的事好几年的前的库存，这对资金和运营有较高的要求。
- name: 分院制成功的必要条件：院长必须全职投入
  desc: 基于对比观察，达成年销售300万行权目标的分院，其院长无一例外为全职投入；兼职‘玩票’心态因精力分散、执行力不足，难以完成高强度的社群运营、股东招募与品鉴组织，从而丧失期权行权资格。
  excerpt:
  - 我总结了一下，分院要成功达成 300，至少分院院长要全职做，像我这样兼职玩票的只能是玩玩，最后是没发拿到总院的股份，也就是无法分享未来的上市红利。
findings:
- name: 作者分院半年实战数据
  desc: '[evidence] 作者亲身经历的南京建邺分院实测数据：成立半年，联创10人，启动资金50万，发展股东30人，社群会员50+，一季度销售近80万，半年销售破100万，但因疫情及兼职性质未达成年300万行权目标。'
  excerpt:
  - 我们于 2021 年 12 月 20 南京建邺分院成立，我们就汇集了 10 个联合创始人...启动之初我们每人出资 5 万合计 50 万...很快我们拉到
    30 个个人股东并于 2022 年 1 月 8 日在南京同庆楼开启了分院成立庆典。
  - 由于 2 月是春节，每个股东投资 1 万购买一万酒水，很快我们一季度销售的就接近 80 万。
  - 一句话概括是：半年分院社群会员 50+，销售规模破 100 万。
  - 我们南京建邺分院经过过一年运营，后期疫情的关系，加上大家觉得 300 万比较难达成，就放弃了总部的期权
- name: 头部总院与标杆分院行权案例
  desc: '[evidence] 素材披露的官方/头部数据：第一总院首年近50家分院达成300万行权；8总院（作者上级）2021年建50个分院、销售3000万；厦门分院（作者前同事）半年孵化6个分院、年销过千万；合肥分院（酒水从业者）半年销售600万。证明模式在全职、资源匹配度高时可复制放大。'
  excerpt:
  - 例如第一总院，第一年就有近 50 家达成年 300 万的销售目标，实现了行权。
  - 以我所在 8 总院例子...2021 年就完成了 50 个分院的建设，实现销售目标 3000 万。
  - 最早我们有两位联创是厦门的前同事...短短半年也孵化了 6 个分院，年销售业绩过千万，合肥一个做过酒水的前同事成立的分院，短短半年也做到了 600 万销售业绩。
- name: 品牌整体阶段性成果里程碑
  desc: '[claim] 素材宣称的品牌方官方战绩：2020年9月成立，13个月内全国搭建700+分院，7万核心消费者参与共创，订单金额突破6亿（后文称快速逼近7亿）。'
  excerpt:
  - 一个新品牌酱酒 2020 年 9 月成立，20 位初期发起人，短短 13 月全国搭建 700+分院，7 万核心消费者参与共创，订单金额突破 6 亿。
  - 半藏，仅仅一年多时间快速逼近 7 亿。
- name: 分院运营的副产品价值：生意人脉沉淀
  desc: '[evidence] 作者观察到的非财务直接收益：分院运营显著增加了股东/联创间的聚餐聚会频次，促进了内部生意合作达成，验证了‘酒桌社交即商业社交’的社群附加值。'
  excerpt:
  - 另外一个利好是，通过半藏分院的运营，股东的聚餐，聚会的确多了很多，有利于生意上的合作，分院内部也有不少股东，联创之间达成了生意合作，这也是半藏所倡导的。
