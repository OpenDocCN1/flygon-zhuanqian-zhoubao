paper: docs/202306/20230627_057.md
desc: 该素材为产品人Cris在生财有术社区的航海日志复盘帖，核心提出“原因很少在结果附近，结果=行为×概率”这一决策模型，主张通过大量低成本试错（行为）提高成功概率，而非过度分析失败原因，并以公众号爆文写作实战验证：21天从0到1入池、累计收益600+，印证“小正反馈预示指数级放大”的长尾收益规律。
concepts:
- name: 结果=行为×概率
  desc: 核心决策公式，主张结果由行动量（行为）与单次成功率（概率）共同决定，强调通过增加行为频次而非追求单次完美来提升期望值。
  is_original: true
  excerpt:
  - 原因很少在结果附近，结果等于行为乘以概率
  - 该如何减少焦虑，尽早把手弄脏？
- name: 原因很少在结果附近
  desc: 认知原则，指出事后归因分析往往失真，真实因果链条隐藏在复杂系统中，不应过度沉溺于复盘“为何失败”而应聚焦“继续行动”。
  is_original: true
  excerpt:
  - 原因很少在结果附近
- name: 航海续航
  desc: 生财有术社区术语，指首期训练营结束后自发延长的实战周期，以低成本验证商业模型可持续性。
  is_original: false
  excerpt:
  - 马上再来个 21 天续航~
- name: 入池
  desc: 微信公众号流量主开通门槛（通常指阅读量/粉丝数达标），标志着内容商业化变现资格的获得。
  is_original: false
  excerpt:
  - 一个号入池了
methods:
- name: __overview__
  desc: 最小可行性行动循环：设定低预期目标 → 高频执行（日更8篇） → 忽略中间过程焦虑 → 捕捉小正反馈 → 决定是否续投（续航）。
  excerpt:
  - 参加公众号爆文写作，在航海马上结束的时候，一个号入池了
  - 一天写满 8 篇 ，篇篇原创
  - 那就先坚持日更
- name: 正反馈捕捉法
  desc: 在不确定性高的初期，不追求大额收益，仅以“入池”、“首笔收益”、“日更坚持天数”等微弱信号作为继续投入的决策依据。
  excerpt:
  - 截止到 6 月 15 号累计收益 600+...在预料之内
  - 21 天从 0 开始就能赚几百块钱，往往意味着后面会指数放大
theorems:
- name: 焦虑源于过度归因，行动消解焦虑
  desc: 个体焦虑源于试图在结果发生前/后寻找确定性原因；唯有通过“把手弄脏”积累行为量，才能在概率层面获得确定性。
  excerpt:
  - 该如何减少焦虑，尽早把手弄脏？
  - 原因很少在结果附近
- name: 小正反馈预示指数级放大潜力
  desc: 在长尾分布的内容变现赛道中，早期微小的正向数据（如入池、几百元收益）是系统放大潜力的先行指标，而非终点。
  excerpt:
  - 21 天从 0 开始就能赚几百块钱，往往意味着后面会指数放大
findings:
- name: 公众号爆文写作单号入池实证
  desc: '[evidence] 作者实操21天，单号实现入池，累计流量主收益600+元，验证了“高频原创产出（日更8篇）”可触发平台推荐机制。'
  excerpt:
  - 参加公众号爆文写作，在航海马上结束的时候，一个号入池了，截止到 6 月 15 号累计收益 600+
- name: 新号冷启动“仅自己看”常态
  desc: '[evidence] 评论区多位用户确认：新号初期GPT生成内容常无真实阅读，需靠“坚持日更”熬过零反馈期至入池。'
  excerpt:
  - 新开的公众号 GPT 写的文章只有我一个人看怎么破
  - 我也只有自己看，等坚持到哪天入池就更有动力了
