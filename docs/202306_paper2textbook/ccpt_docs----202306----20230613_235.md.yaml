paper: docs/202306/20230613_235.md
desc: 该素材介绍了一种名为“云洗衣”的新业务模式，核心在于帮助拥有线下稳定客流的实体门店（便利店、复印店、饭馆、驿站等），通过“异业合作”或“自营中间商”方式，零成本接入洗衣及家政服务，仅负责客服与流程对接，利用外部供应链履约，实现每月新增1万-2.3万销售额、六七千元起步纯利润的增收路径。
concepts:
- name: 云洗衣新业务模式
  desc: 一种无需自建工厂、无需开网店、无需囤货、无需额外人力场地，仅依托现有线下门店客流，以中间商身份对接外部洗涤供应链，销售洗衣及家政服务赚取差价的轻资产商业模式。
  is_original: true
  excerpt:
  - 我们跑出了一套云洗衣新业务模式，让做本地生活的老板都能够利用线下人流卖出洗衣、家政服务，老板只做客服中间商工作， 连线上网店也不用开，实现增收。
  - 因为不需要额外的人力成本、场地空间、洗衣极其高频，甚至可以做无人自助下单模式
- name: 异业合作/中间商差价模式
  desc: 普通人或服务商无需自有门店，通过谈判合作将洗衣服务植入有客流的实体店，或由店主自营，核心利润来源于客单价与外包履约成本的差价。
  is_original: false
  excerpt:
  - 普通人也可以找线下老板异业合作做中间商挣差价
  - 老板只做客服中间商工作， 连线上网店也不用开，实现增收
- name: 虚拟洗衣店店群/电商中间商打法
  desc: 作者过往经验的延伸，指在美团等平台开设虚拟店铺，接单后外包给实体洗衣店履约的电商玩法，是云洗衣模式供应链端的能力基础。
  is_original: true
  excerpt:
  - 这两年也带了几十个老板在美团等电商平台上做虚拟洗衣店店群，用电商中间商打法做洗衣服务，不用自己洗衣不用开店，只做客服，利用快递外包给洗衣店洗涤。
methods:
- name: __overview__
  desc: 云洗衣模式的标准化落地执行流程：1. 选定具备稳定高频客流的线下实体门店（便利店、驿站等）；2. 搭建无人自助下单体系或店员推荐话术体系；3. 对接成熟外部洗涤/家政供应链（快递上门取送）；4.
    门店仅负责客服沟通与订单流转；5. 赚取零售价与履约成本的差价。
  excerpt:
  - 3 个月我测试了 5 个便利店、复印店、饭馆、驿站等业态，每个店每月洗衣+保洁卖出了 1 万-2.3 万销售额，利润六七千起。
  - 老板只做客服中间商工作， 连线上网店也不用开，实现增收。
  - 甚至可以做无人自助下单模式
- name: 供应链外包履约体系
  desc: 利用快递网络实现‘上门取件-工厂洗涤-配送回客户’的全流程外包，门店零接触衣物，解决了传统洗衣店选址贵、设备重、人力难管的痛点。
  excerpt:
  - 利用快递外包给洗衣店洗涤。
  - 不需要额外的人力成本、场地空间
- name: 无人自助下单/店员引导双轨获客法
  desc: 针对门店无人值守或店员不愿推销的场景，部署扫码自助下单小程序/海报；针对有店员服务的场景，设计标准话术与佣金激励，将进店客流转化为洗衣订单。
  excerpt:
  - 甚至可以做无人自助下单模式
  - 利用线下人流卖出洗衣、家政服务
theorems:
- name: 高频刚需+轻资产中介=门店最优增收项
  desc: 洗衣服务具有极高频次（刚需）且标准化程度高，适合非专业门店通过中介模式切入；相比卖货、卖卡等增收方式，云洗衣无库存压力、无占地、无人力成本，ROI（投入产出比）最高。
  excerpt:
  - 洗衣极其高频，非常适合有稳定人流的物业老板、门店老板、有本地客户的老板当做增收副业做
  - 不需要额外的人力成本、场地空间
- name: 单店月利润6000+可复制性定律
  desc: 经过5家不同业态门店（便利店、复印店、饭馆、驿站）3个月实测验证，该模式单店月销售额稳定在1万-2.3万，净利润六七千起，具备跨业态、跨区域的标准化复制能力。
  excerpt:
  - 3 个月我测试了 5 个便利店、复印店、饭馆、驿站等业态，每个店每月洗衣+保洁卖出了 1 万-2.3 万销售额，利润六七千起。
findings:
- name: 多业态实测业绩数据
  desc: '[evidence] 实测5家不同业态门店（便利店、复印店、饭馆、驿站等），连续3个月单店月销售额达1万-2.3万元，净利润六七千元起步，验证了模式跨业态的普适性与盈利下限。'
  excerpt:
  - 3 个月我测试了 5 个便利店、复印店、饭馆、驿站等业态，每个店每月洗衣+保洁卖出了 1 万-2.3 万销售额，利润六七千起。
- name: 零边际成本扩展家政品类
  desc: '[claim] 作者宣称在洗衣高频引流基础上，可零成本延伸销售保洁等家政服务，进一步提升客单价与LTV（生命周期价值），但素材未给出家政单品具体占比或转化率数据。'
  excerpt:
  - 每个店每月洗衣+保洁卖出了 1 万-2.3 万销售额
  - 卖出洗衣、家政服务
- name: 无人自助模式可行性验证
  desc: '[evidence] 实测证明“无人自助下单模式”在驿站、便利店等无人/少人值守场景下可行，解决了店员不配合推销、人力成本高的核心执行阻力。'
  excerpt:
  - 甚至可以做无人自助下单模式
