paper: docs/202306/20230627_124.md
desc: 该素材为一篇出海应用货币体系逻辑分享的引导性帖子，作者翔叔基于5年秀场直播及社交产品经验，概述了以虚拟礼物打赏为核心的直播商业模式及分成比例（公会10%、主播70%、平台20%），并引用石墨文档详细梳理了以新加坡为例的出海应用货币体系完整逻辑，同时评论区补充了苹果小额开发者计划15%费率的政策细节。
concepts:
- name: 出海应用货币体系
  desc: 指面向海外市场（如新加坡）的应用内虚拟货币充值、消费、结算及分账的完整闭环逻辑体系，是出海变现的核心基础设施。
  is_original: false
  excerpt:
  - 出海应用货币体系完整逻辑分享
  - 详情请移步石墨文档 《出海应用货币体系梳理（以新加坡为例）》
- name: 秀场直播商业模式
  desc: 以虚拟礼物打赏为核心变现手段的直播业务模式，月流水可达上亿级别。
  is_original: false
  excerpt:
  - 秀场整个商业模式都是围绕：虚拟礼物打赏！
  - 月流水：上亿
- name: 三方分成体系
  desc: 直播平台、公会、主播三方的收益分配标准比例，平台20%、公会10%、主播70%，且平台分成可通过策略提升。
  is_original: true
  excerpt:
  - 礼物分成： 1.公会：10% 2.主播：70% 3.平台：20%
  - 以上比例不是绝对的，背后有很多巧妙地策略，可以把平台分成提上来！
- name: 苹果小额开发者计划费率
  desc: 前一年收入不足100万美元的开发者可申请享受苹果App Store 15%佣金费率（标准为30%）。
  is_original: false
  excerpt:
  - 苹果支付，前一年收入不到 100w 美元的话，是可以申请 15%费率哦
methods:
- name: __overview__
  desc: 通过行业经验总结与外部文档引用相结合的方式，建立出海应用货币体系的认知框架：先普及核心业务模式（秀场直播打赏），再明确核心利益分配规则（三方分成），最后指向详细落地文档（新加坡货币体系梳理）。
  excerpt:
  - 先简单普及下秀场直播的逻辑，以便小白能快速了解
  - 详情请移步石墨文档 《出海应用货币体系梳理（以新加坡为例）》
theorems:
- name: 平台分成可通过策略优化提升
  desc: 标准三方分成比例（平台20%）非固定不变，平台方可通过巧妙的运营或产品策略将实际分成比例提升至20%以上。
  excerpt:
  - 以上比例不是绝对的，背后有很多巧妙地策略，可以把平台分成提上来！后续可以详细展开聊聊。
- name: 货币体系是出海变现核心
  desc: 对于想做海外应用的团队，理解钱如何运转（货币体系）是业务落地的前提，是赚钱的核心环节。
  excerpt:
  - 鉴于一些圈友想做海外相关应用，但又不了解钱具体怎么运转，毕竟这是赚钱的核心！
findings:
- name: 秀场直播高流水验证
  desc: '[claim] 秀场直播业务单月流水可达上亿规模，验证了虚拟礼物打赏模式的高商业价值。'
  excerpt:
  - 月流水：上亿
- name: 标准分成比例基准
  desc: '[evidence] 素材给出的行业通用分成基准为：主播70%、平台20%、公会10%，为财务建模提供基准参数。'
  excerpt:
  - 礼物分成： 1.公会：10% 2.主播：70% 3.平台：20%
- name: 苹果支付费率减免政策确认
  desc: '[evidence] 评论区信息确认：年收入<100万美金可申请苹果15%费率，可显著降低出海iOS端支付成本。'
  excerpt:
  - 苹果支付，前一年收入不到 100w 美元的话，是可以申请 15%费率哦
