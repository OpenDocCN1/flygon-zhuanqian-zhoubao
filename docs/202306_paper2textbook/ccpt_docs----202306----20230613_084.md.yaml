paper: docs/202306/20230613_084.md
desc: 该素材为亦仁在“生财有术”社区发起的一期互动问答，核心议题是对比“三年内考上985大学”与“三年后实现年入百万”两条路径的难度与确定性，引发社群成员对学历考证确定性与商业变现不确定性的讨论，折射出成人教育与财富自由路径选择的核心冲突。
concepts:
- name: 确定性路径 vs 不确定性路径
  desc: 将考985定义为路径清晰、标准固定、投入产出比可预期的确定性路径；将年入百万定义为依赖红利捕捉、商业模式验证、运气成分大的不确定性路径。
  is_original: true
  excerpt:
  - '林森 : 985'
  - '果然靠谱 : 985 难'
  - '落日骑士 : 肯定 985 更难哦'
  - 'BO.A : 985 难'
- name: 永远在红利上
  desc: 指商业赚钱的核心逻辑在于持续捕捉和切换风口红利，而非依赖单一固定技能，体现了‘年入百万’路径的动态博弈本质。
  is_original: true
  excerpt:
  - '小新 : 因为我觉得永远都在红利上面'
  - '小新 : 什么赚钱做什么'
methods:
- name: __overview__
  desc: 通过抛设定场景（3年时间、现有基础）、对比两个具体目标（985学历 vs 年入百万）、引导社群投票与理由阐述，以众包方式验证路径难度认知差异。
  excerpt:
  - 假设给你 3 年时间准备，以你目前的情况，你觉得是考上 985 难，还是 3 年之后能年入百万难？
  - 为什么？
theorems:
- name: 考证路径的确定性高于创富路径
  desc: 在相同时间约束下，标准化考试（985）因规则透明、复习资料成熟、通过率可统计，被主流认知判定为比商业变现（年入百万）更具可操作性和确定性的目标，尽管主观难度因人而异。
  excerpt:
  - '林森 : 985'
  - '果然靠谱 : 985 难'
  - '落日骑士 : 肯定 985 更难哦'
  - 'BO.A : 985 难'
- name: 财富自由需具备‘追逐红利’的动态能力
  desc: 年入百万并非靠死磕单一赛道，而是要求个体具备敏锐识别风口、快速切换赛道、‘什么赚钱做什么’的机会主义执行力，这是比考试更高阶的生存技能。
  excerpt:
  - '小新 : 因为我觉得永远都在红利上面'
  - '小新 : 什么赚钱做什么'
findings:
- name: 社群主流倾向：认定985更难（或更不愿尝试）
  desc: '[evidence] 评论区显性表态中，4位典型用户中有3位明确给出‘985难’或‘选985’的结论，仅1位认为‘都简单’，反映该社群（生财考生/创业者）对标准化学历提升的畏难情绪强于商业变现。'
  excerpt:
  - '林森 : 985'
  - '果然靠谱 : 985 难'
  - '落日骑士 : 肯定 985 更难哦'
  - 'BO.A : 985 难'
- name: 认知分层：执行派 vs 战略派的路径选择差异
  desc: '[evidence] 评论呈现两极分化：多数人基于‘规则固定但竞争激烈’判定985难；少数人（小新）基于‘规则变动但机会无限’判定赚钱更易，揭示了‘打工/考证思维’与‘生意/投资思维’的底层认知代差。'
  excerpt:
  - '林森 : 985'
  - '果然靠谱 : 985 难'
  - '小新 : 因为我觉得永远都在红利上面'
  - '小新 : 什么赚钱做什么'
