paper: docs/202306/20230627_132.md
desc: 该素材为一篇球鞋搬砖（倒卖球鞋赚差价）的实战项目分享，作者“小花”以22岁大学毕业生身份，宣称通过建立工作室、整合线报渠道、掌握选品下单变现全流程，实现月收入稳定5万+。文章核心在于推广其整理的飞书详细教程（含视频），并强调618大促期间的红利期。评论区则揭示了行业现状：得物平台手续费上涨、小白卖家涌入导致砸价、无信息差者利润仅约10%、以及拆箱检测、瑕疵退货、打包发货等隐性时间与人力成本极高的运营痛点。
concepts:
- name: 球鞋搬砖
  desc: 指通过在不同平台或渠道低价买入球鞋，再在得物等二级市场平台高价卖出，赚取价差利润的商业行为。素材中将其定义为“撸货”行业中门槛最低、最容易看到收益、流程可在大平台闭环的品类。
  is_original: false
  excerpt:
  - 球鞋搬砖相对于整个“撸货”行业来说，是门槛最低，也最容易看到收益的一个品类，从选品到下单再到变现，都是可以从市面上比较有信任度的大平台上进行的
- name: 撸货
  desc: 泛指利用平台优惠券、活动、信息差等手段低价获取商品（如数码、茅台、日化、美妆、球鞋），再转手变现的商业模式。作者称其业务范围覆盖所有与“撸货”相关品类。
  is_original: false
  excerpt:
  - 同时数码、茅台、日化、美妆等多种类产品均在我的业务范围内，只要与“撸货”两字相关，就一定有我的身影
- name: 线报渠道社群
  desc: 获取一手折扣信息、发售链接、库存漏洞等“线报”的信息聚合群体。作者称已拥有完整的线报渠道社群，是实现稳定收益的核心资产之一。
  is_original: false
  excerpt:
  - 已经拥有了完整的线报渠道社群、出货模式
- name: 信息差收益
  desc: 指拥有独家或超前线报渠道的卖家，能以更低成本拿货或抢到稀缺货源，从而突破普通搬砖者10%左右的基础利润天花板，获得更高利润空间。
  is_original: false
  excerpt:
  - 有信息的可以达到更高，没有的话搬砖利润点 10%差不多
- name: 隐性运营成本
  desc: 指除商品成本、平台手续费外，在搬砖流程中被忽略的时间成本、人工成本、物流风险成本（如拆箱检测、瑕疵修复、顺丰到付退回、二次打包寄件等)。
  is_original: true
  excerpt:
  - 时间成本和人工成本忽略了，出售可能是全自动化，但是出货前的步骤，成箱成箱的快递往家拿拆箱检测，鞋盒破损，鞋子瑕疵寄过去都是检测不通过顺丰到付退回的。再打包寄过去，填单号上传单号。
methods:
- name: __overview__
  desc: 球鞋搬砖全流程标准化作业法：建立工作室 -> 整合线报渠道社群 -> 选品下单（利用大促红利期） -> 收货拆箱检测瑕疵 -> 寄往得物等平台寄售/变现
    -> 处理退货二次发货。作者将其整理为飞书文档+视频教程对外输出。
  excerpt:
  - 在校期间成立工作室取名“森林”，主攻项目球鞋搬砖。
  - 已经拥有了完整的线报渠道社群、出货模式，对整体市场也有一个十分敏锐的判断。
  - 从选品到下单再到变现，都是可以从市面上比较有信任度的大平台上进行的
  - 我几乎把我所能想到的所有的细节点全部总结到了这个飞书文档里并配上了一小时的视频教程
- name: 红利期卡位法
  desc: 利用电商大促节点（如618、双11）平台补贴大、发售多、价格波动大的特征，集中火力进行选品下单与变现，最大化单周期收益。
  excerpt:
  - 618 将近，正是球鞋搬砖、撸货最红利的时候！祝每一位看到这个项目的老板都能在这个风口期捞一桶金！
theorems:
- name: 低门槛高确定性主张
  desc: 作者主张球鞋搬砖是“撸货”行业中门槛最低、流程最标准化（大平台闭环）、最容易看到收益、且适合作为不占用过多时间精力的副业项目。
  excerpt:
  - 球鞋搬砖相对于整个“撸货”行业来说，是门槛最低，也最容易看到收益的一个品类...而且作为副业来做的话并不浪费时间和精力
- name: 教程变现闭环主张
  desc: 作者主张通过将实战经验沉淀为结构化文档（飞书）和视频教程，可实现项目经验的复用与变现（陪跑/售课），形成“实战-总结-教学-招募”的商业飞轮。
  excerpt:
  - 我也把我这些年做这个行业的一些经验分享给大家，整体教程十分详细，我几乎把我所能想到的所有的细节点全部总结到了这个飞书文档里并配上了一小时的视频教程！
- name: 利润天花板与信息差正相关定律
  desc: 评论区核心观点：在平台手续费固定、竞争白热化的存量市场中，普通搬砖者的净利润率被压缩至约10%；唯有掌握独家/超前线报渠道（信息差）者，才能突破该天花板获得超额收益。
  excerpt:
  - 得物手续费的不断提高，加上涌进来的小白卖家越来越多，各种砸价，个人卖家几乎没有什么利润...最终 10 个点的利润
  - 有信息的可以达到更高，没有的话搬砖利润点 10%差不多
- name: 周转率换利润空间理论
  desc: 评论区观点：在薄利环境下，通过极高的资金周转率（快买快卖）可以弥补单笔低利润的劣势，维持现金流与总利润。
  excerpt:
  - 利润和周转率的关系，周转率快，利润低点也可以做。
findings:
- name: 月入5W+的可行性声明
  desc: '[claim] 作者宣称22岁应届毕业生，操盘3年，通过球鞋搬砖实现月收入稳定5万+，并已形成完整工作室体系。'
  excerpt:
  - 22 岁刚刚大学毕业...我是如何通过球鞋搬砖实现月收入稳定 5w+！
- name: 行业利润率实测数据
  desc: '[evidence] 资深从业者（小艾）实测：在得物手续费上涨、小白涌入砸价的当前环境下，扣除所有成本后，无特殊信息渠道的个人卖家净利润率仅约10%。'
  excerpt:
  - 最终 10 个点的利润
  - 有信息的可以达到更高，没有的话搬砖利润点 10%差不多
- name: 隐性劳动强度实测
  desc: '[evidence] 从业者实测揭示：搬砖并非“躺赚”，前端自动化程度高但后端极其依赖人力。单次操作涉及成箱收货、拆箱逐一检测瑕疵、鞋盒破损处理、平台检测不通过导致的顺丰到付退回、二次打包发货、填单号上传等高频重复劳动，时间成本与人工成本极高。'
  excerpt:
  - 时间成本和人工成本忽略了，出售可能是全自动化，但是出货前的步骤，成箱成箱的快递往家拿拆箱检测，鞋盒破损，鞋子瑕疵寄过去都是检测不通过顺丰到付退回的。再打包寄过去，填单号上传单号。
- name: 平台规则收紧趋势
  desc: '[evidence] 观察到得物等主流二级交易平台手续费持续提高，检测标准趋严（瑕疵拦截率高），导致卖家端承担的物流损耗（往返运费、包装损耗）显著增加，压缩利润空间。'
  excerpt:
  - 得物手续费的不断提高...鞋子瑕疵寄过去都是检测不通过顺丰到付退回的
