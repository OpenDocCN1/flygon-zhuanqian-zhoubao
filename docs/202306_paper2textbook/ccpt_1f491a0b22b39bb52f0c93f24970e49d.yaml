paper: docs/202306/20230613_264.md
desc: 该素材是一篇实操指南，介绍了如何在广深莞地区自行、免费、快速（宣称1分钟）完成公司执照注册的全流程，核心在于提前准备齐全六类关键资料（公司名字、地址、注册资金、经营范围、人员证件及角色分配），并通过政府官方渠道在线提交申请，旨在帮助创业者规避中介费用、掌握自主办照核心要素。
concepts:
- name: 自主免费注册
  desc: 指创业者不通过中介代办，直接利用政府官方政务服务平台，零成本完成公司设立登记的行为。
  is_original: false
  excerpt:
  - 如何自己花 1 分钟免费注册公司执照
- name: 公司设立核心要素六件套
  desc: 指公司注册申报前必须备齐的六类核心材料清单，涵盖主体身份、住所、资本、业务、人员资质及架构设置，是注册能否秒过的关键。
  is_original: true
  excerpt:
  - 提前准备好这些资料 1、公司名字（2-6 个字），准备 2-3 个名字备选； 2、地址资料（租赁合同和房产证/临场证明/备案证明） 3、注册资金； 4、经营范围
    ； 5、全体股东身份证正反面复印件、股东股份占比... 6、法人、执行董事、经理、财务负责人及监事
- name: 住所申报材料分级体系
  desc: 将注册地址证明材料按证明力强弱分为房产证、租赁合同、临场证明、备案证明等层级，指导不同房产性质（自有、租赁、孵化器、集群注册）的创业者准备合规材料。
  is_original: true
  excerpt:
  - 地址资料（租赁合同和房产证/临场证明/备案证明）
- name: 股东资质与出资信息标准化
  desc: 规定股东需提供清晰无反光的身份证正反面原图，并明确股份占比、联系方式，确保实名认证与出资结构清晰合规。
  is_original: true
  excerpt:
  - 全体股东身份证正反面复印件、股东股份占比（可拍照：拍正、四边可见、不反光，清晰发原图）、电话和邮箱
- name: 法定岗位配置最小集
  desc: 依据《公司法》规定，一家公司最小配置需包含法定代表人/执行董事、经理、财务负责人、监事四大角色，且法人/执行董事/经理可由一人兼任，监事不可兼任，需至少两人。
  is_original: false
  excerpt:
  - 法人、执行董事、经理、财务负责人及监事
methods:
- name: __overview__
  desc: 资料预备先行法：主张注册提交动作极快（1分钟），核心耗时在于前期资料的标准化准备；通过清单化、标准化（如拍照规格、名字备选数量）的资料包准备，实现政务平台‘一键式’极速申报。
  excerpt:
  - 提前准备好这些资料... 1、公司名字...准备 2-3 个名字备选... 5、...清晰发原图...
theorems:
- name: 资料完备即注册极速
  desc: 核心主张：公司注册的时间成本几乎完全取决于前期资料准备的完备度与规范度；若六大类资料一次性准备齐全且格式合规，正式提交审批环节可在极短时间（宣称1分钟）内完成。
  excerpt:
  - 如何自己花 1 分钟免费注册公司执照
  - 提前准备好这些资料
- name: 自主办照规避中介成本
  desc: 核心主张：创业者掌握核心要素清单后，可完全自主通过政府官方渠道免费办理执照，无需支付代理机构服务费，实现零成本设立。
  excerpt:
  - 如何自己花 1 分钟免费注册公司执照
findings:
- name: 名称预核准需备选策略
  desc: '[claim] 建议准备 2-3 个公司名字备选，以应对核名重名驳回风险，提高一次性通过率。'
  excerpt:
  - 公司名字（2-6 个字），准备 2-3 个名字备选
- name: 地址材料需匹配房产性质
  desc: '[claim] 注册地址证明材料非单一固定，需根据房产性质（自有/租赁/孵化器/集群）对应提供房产证、租赁合同、临场证明或备案证明，材料不匹配会导致驳回。'
  excerpt:
  - 地址资料（租赁合同和房产证/临场证明/备案证明）
- name: 身份证影像规范影响实名认证通过率
  desc: '[claim] 股东身份证照片需满足‘拍正、四边可见、不反光、清晰发原图’标准，否则将因影像质量不合格导致实名认证或提交失败。'
  excerpt:
  - 全体股东身份证正反面复印件...（可拍照：拍正、四边可见、不反光，清晰发原图）
- name: 人员架构至少需两自然人
  desc: '[evidence] 基于第6条岗位配置要求（监事不可兼任法人/执行董事/经理），素材隐含结论：一家有限公司设立至少需要两名自然人（一人任法人/执行董事/经理/财务，另一人任监事）。'
  excerpt:
  - 法人、执行董事、经理、财务负责人及监事
