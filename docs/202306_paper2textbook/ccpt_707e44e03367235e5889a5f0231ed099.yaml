paper: docs/202306/20230613_218.md
desc: 该素材由短视频带货实操者猎音狮分享，核心展示了一套“素材活用-改编创作”的带货文案实操方法论：以高赞爆款视频为素材源，结合待售产品（书籍）的目录内容，通过“拆书提炼-敏感词规避-结构化替换-痛点卖点重组”四步法，快速生成规避平台审核且高转化的原创带货文案，并总结出“痛点疑问放开头，卖点展示跟上咯，逐一详解很上头，点击下单好理由”十六字创作口诀。
concepts:
- name: 素材活用改编法
  desc: 指不直接搬运复制他人爆款文案，而是提炼其底层结构与逻辑，结合自身产品卖点（如书籍目录），进行规避风控、替换重组的二次创作方法论。
  is_original: true
  excerpt:
  - 大家好，我是猎音狮...让我再多分享一些文案创作方面的经验。所以，我今天刚做完这条视频，就把过程写了下来！
  - 下面我们实操，手把手把这条素材改成自己的带货视频。
- name: 拆书
  desc: 将书籍内容（特别是目录、核心章节）提炼转化为短视频文案可直接使用的素材单元（如卖点、范文、知识点）的过程。要求简单易懂、有逻辑、人人可懂。
  is_original: false
  excerpt:
  - 名词解释，拆书：拆书就是转述者或讲书人能把书中的内容、精华提炼出来，然后将原著的中心思想和精华表达具体清楚。其次，拆书稿一定要尽量的简单易懂，并且要有逻辑，需要让每个人都能听懂、看懂，这才能达到拆书稿的要求。
- name: 敏感词规避选品策略
  desc: 在引用权威背书（如人民日报）的选题方向时，主动剔除‘乡村振兴’、‘绿水青山’等易触发平台投流审核卡顿的敏感词方向，替换为‘美食文化’、‘故土情深’等相对安全且贴合产品的方向。
  is_original: true
  excerpt:
  - （在目录里挑选六个，替换掉，这里挑选有技巧哈，敏感词就不要选，免得投流卡审核，比如：乡村振兴、绿水青山会卡审核，我就不选）
- name: 权威背书转化话术
  desc: 利用‘人民日报是中高考作文命题风向标’等权威背书，将‘背范文’包装为考前唯一高性价比动作，通过‘其它科目来不及’制造紧迫感，倒逼下单。
  is_original: true
  excerpt:
  - 相关范文和素材，这本人民日报都给你整理好了，人民日报一直是中高考作文命题的风向标，从现在到考前，一定要背起来！因为作文得分全靠素材，其它科目现在准备可能来不及了...
methods:
- name: __overview__
  desc: 爆款素材结构化拆解 -> 产品卖点（拆书目录）提炼 -> 敏感词规避下的逐项替换重组 -> 痛点/卖点/催单模块化组装 -> 真人出镜拍摄。
  excerpt:
  - 1. 提取原视频文案结构（六大方向标题+权威背书+催单）。
  - 2. 拆书：对着目录提炼六个替换方向。
  - 3. 参照性修改：保留原框架，替换标题，规避敏感词。
  - 4. 追加产品介绍及催单文案。
  - 5. 真人出镜录制。
- name: 参照性修改法
  desc: 保留爆款文案的‘钩子’（如‘2023中考六大方向’、‘人民日报总结’、‘双击收藏’）与‘框架’（六点式罗列），仅替换核心内容载体（六大方向标题）为产品目录内容，实现低成本原创化。
  excerpt:
  - 然后，根据原文案，参照性修改：...（在目录里挑选六个，替换掉...）第一，传统文化， 第一、文化传承 ... 第六、青春奋斗第六、青春之歌
- name: 带货文案撰写速记口诀
  desc: 十六字文案结构公式：痛点疑问放开头（钩子） -> 卖点展示跟上咯（价值） -> 逐一详解很上头（细节/信任） -> 点击下单好理由（转化/行动号召)。
  excerpt:
  - 痛点疑问放开头，卖点展示跟上咯。逐一详解很上头，点击下单好理由。
theorems:
- name: 爆款结构可复制性定律
  desc: 优秀的带货文案核心在于‘结构’而非‘措辞’，保留高转化结构（权威背书+清单式呈现+稀缺性催单），替换个性化内容（产品目录），即可批量复制爆款。
  excerpt:
  - 好多圈友说看完很有启发...所以，我今天刚做完这条视频，就把过程写了下来！
  - 下面我们实操，手把手把这条素材改成自己的带货视频。
- name: 真人出镜转化优先论
  desc: 在教辅赛道短视频带货中，真人出镜的转化率高于非真人形式，且更利于千川投流起量，不易被平台风控掐量。
  excerpt:
  - '鲁西西 : 不真人出镜效果会不会不好呢 猎音狮 : 出境转化率要高些，千川起量也不会被掐'
- name: 考前作文备考唯素材论
  desc: 在中高考临近时间窗口，作文提分唯一可行路径是积累高质量素材（人民日报范文），其他学科复习边际效益递减，因此单品（素材书）具备极强的刚需性与紧迫感销售逻辑。
  excerpt:
  - 因为作文得分全靠素材，其它科目现在准备可能来不及了，现在你要做的，就是调整心态，然后每天背一两篇人民日报里的范文！
findings:
- name: 单账号日均销量与GMV基准
  desc: '[evidence] 作者单人操作账号，日均出单 800 单左右，月 GMV 100w 左右，验证了该文案方法论配合真人出镜及投流打法的商业可行性。'
  excerpt:
  - 单人操作成绩平均每天 800 单 左右，月 GMV 100w 左右。
- name: 原爆款素材数据表现
  desc: '[evidence] 参照素材为快手视频，播放量 110.2 万次，验证了‘人民日报+中考作文方向预测’选题的高流量潜力。'
  excerpt:
  - 原视频链接：...该作品在快手被播放过 110.2 万次
- name: 敏感词导致投流受阻实证
  desc: '[evidence] 实操中发现‘乡村振兴’、‘绿水青山’等方向虽权威但会导致千川投流卡审核，主动规避可保证投流顺畅。'
  excerpt:
  - 敏感词就不要选，免得投流卡审核，比如：乡村振兴、绿水青山会卡审核，我就不选
