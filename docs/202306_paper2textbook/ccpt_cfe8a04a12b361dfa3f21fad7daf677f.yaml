paper: docs/202306/ATkmdw05so8PnCx0CEIcqEdXnMf.md
desc: 该素材提出了一种“反向驯化”AI工作流：当用户自身不精通领域知识（如抖音爆款逻辑）时，不应直接将粗糙的知识投喂给GPT，而应先设定GPT为“专家分析师”角色，利用GPT强大的归纳推理能力对原始素材进行深度解构、扩展案例与结构化重写，生成高质量的“新版训练资料”，再将其分块投喂回GPT进行下游任务创作。核心方法论包含：身份设定与职责确认、分块迭代优化、结构化需求输出、修正型投喂。素材并对比演示了“旧版18个爆款密码”与“新版18个爆款密码”的巨大质量差异，揭示了提示词工程中“思维拆解能力”比“术级技巧”更关键的本质。
concepts:
- name: 反向驯化
  desc: 一种AI协作范式：用户不直接训练GPT，而是先让GPT作为专家对用户提供的低质量原始素材进行深度加工、结构化升级，生成高质量训练语料，再反哺给GPT执行下游任务。解决了‘小白无法写出高质量提示词/训练资料’的鸡生蛋问题。
  is_original: true
  excerpt:
  - 那么有没有一种可能，让GPT先训练我们，再去训练GPT呢？？？
  - 最终我们就得到了这样的一个结果：## 18个抖音爆款密码（新版）
- name: 职责确认机制
  desc: 在Prompt首轮对话中，强制要求AI复述任务理解及执行计划，而非直接执行。借鉴职场管理中‘闭环沟通’与‘确认偏差’原理，对齐人机预期，防止AI‘埋头苦干’偏离目标。
  is_original: false
  excerpt:
  - 如果你明白我的意思，请回答以下两点：1、用自己的话描述一遍你要做的事；2、你会通过怎样的方式更好地完成你要做的事
  - 很多时候，作为领导，你在吩咐下属一项任务之后，需要再三确认其是否理解
- name: 分块迭代投喂
  desc: 针对LLM上下文窗口与推理算力限制，将大量知识素材拆解为单个知识点，逐个轮次进行‘学习-扩展案例-确认’的闭环训练，而非一次性塞入全量Prompt。
  is_original: false
  excerpt:
  - 字数偏多，所以GPT为了节省算力，他很难对所有的内容做更深度的理解领悟。
  - 记得分块记得分块记得分块。
  - 在你输入的字数超过一定程度后，他对文字的理解力会直线下降。
- name: 预训练投喂与修正型投喂
  desc: 区分Prompt Engineering的两个阶段：预训练投喂（推理前注入框架、知识、模板）与修正型投喂（推理后针对细节微调）。强调预训练质量决定上限，修正只能在及格线内打磨，不可在‘屎一样的结果’上修修补补。
  is_original: true
  excerpt:
  - 预训练投喂，其实就在你让GPT出结果前，一口气投喂给他，直接把他训练好。修正型投喂，就是在GPT出了结果之后，你不满意，再让他去修改。
  - 在一个屎一样的结果上去修正，它照样还是一坨屎
- name: 工作流拆解能力
  desc: 使用AI的核心竞争力不在于掌握特定Prompt技巧，而在于人类将复杂任务拆解为AI可执行的标准化步骤（SOP）的能力。即‘道’大于‘术’，思维模型与实战经验是写好Prompt的前提。
  is_original: true
  excerpt:
  - 用GPT来取代人工创作的过程，其实是对工作流程的一次拆解
  - 为什么小凡老师就是能够很好地解决这些问题...因为我坚持了自我复盘7年，我的操作系统中，真的有太多太多思维模型
methods:
- name: __overview__
  desc: 完整的‘反向驯化’SOP：1. 设定专家身份与职责（含确认机制）；2. 传授基础框架知识（脚本模板、黄金三秒等）；3. 分块投喂原始素材，要求GPT延伸案例与结构化重写（生成新版资料）；4.
    结构化输出需求（时长、人群、主题、语气等）；5. 基于新版资料进行创作；6. 视情况进行修正型投喂微调。
  excerpt:
  - 给定身份...赋予他需要完成的职责
  - 传授基础短视频脚本制作框架
  - 分块投喂爆款密码...投喂我们刚才用GPT老师帮忙调教优化过的训练资料
  - 输出内容...把你的要求结构化
  - 视情况再做修正型投喂
- name: 专家角色设定与职责确认Prompt
  desc: 通用的首轮Prompt模板：定义角色 -> 列举职责 -> 定义交互协议（以‘请学习’开头） -> 要求确认（复述任务+阐述执行策略）。
  excerpt:
  - 你好GPT~我有一个小忙需要你来帮助我，我希望你能成为我的抖音爆款文案分析师。
  - 作为抖音爆款文案分析师，你被赋予以下的职责：1.学习分析...2.延伸思考，替我举出更多加深理解...案例。
  - 如果你明白我的意思，请回答以下两点：1、用自己的话描述一遍你要做的事；2、你会通过怎样的方式更好地完成你要做的事
- name: 分块深度学习Prompt
  desc: 针对单个知识点的迭代Prompt：输入‘请学习 + 原始要点’ -> GPT输出‘深度解读+多个垂类案例’ -> 用户确认 -> 进入下一条。
  excerpt:
  - 我会以“请学习”为开头，教授你一些抖音的爆款密码。学会后，请回答“好的，我已经学会”。
  - 在学习分析这个爆款密码后，再通过你的延伸思考，替我举出更多加深理解这个爆款密码的案例。
theorems:
- name: 素材质量决定模型上限定律
  desc: 原始训练资料若仅为‘要点罗列’且缺乏深度解释与案例，直接投喂会导致GPT因算力节省而理解浅层，生成平庸内容。必须先经过‘专家GPT’的结构化加工（解释机理+多维案例），才能转化为高质量少样本示例。
  excerpt:
  - 很多要点仅仅说了一个要点，但是对这个爆款因素的详细解释不够。事实上...仅仅靠这段文字，也是很难完全灵活运用好这18个爆款密码的
  - 仅仅靠这段爆款密码的训练，不投喂脚本模板和抖音常见的黄金三秒技巧的话，GPT是很难写出完美的文案的
- name: 人机协作中的‘确认偏差’对齐原理
  desc: LLM默认倾向于立即生成而非深度规划。强制其输出‘执行计划’与‘任务复述’，能激活其System 2慢思考模式，显著降低幻觉与方向偏离，使人机预期达成共识。
  excerpt:
  - 优秀的员工，他会跟领导告知他去完成这项任务的思路以及计划用到的资源和方式方法
  - 有了这个思路，双方才能形成共识，让员工能够按照领导想要的方向去做
- name: 算力约束下的分块认知边界
  desc: 单次上下文输入存在‘认知带宽’上限。超过阈值后，模型注意力机制会退化为关键词匹配而非语义推理。最优策略是将知识颗粒度控制在‘单概念深度解构’层面，而非‘全知识广度覆盖’。
  excerpt:
  - 字数偏多，所以GPT为了节省算力，他很难对所有的内容做更深度的理解领悟。
  - 现阶段他的脑容量是有限的，你字太多，他就没办法深入理解思考。
findings:
- name: 旧版与新版爆款密码的质量对比
  desc: '[evidence] 素材直接展示了同一组18个知识点经过‘反向驯化’流程前后的对比。旧版为一句话口号式定义（如‘撕开认知缺口，指出盲区...调动观众对未知的恐惧’）；新版统一升级为‘策略定义+心理机制+具体标题案例’的三层结构（如‘撕开认知缺口：这个策略是通过指出观众可能忽略的事情来引发他们的好奇心...例如...标题可以是...’），可读性、可执行性、迁移性显著提升。'
  excerpt:
  - '## 18个抖音爆款密码（旧版）... 2.撕开认知缺口，指出盲区...要调动观众对未知的恐惧。'
  - '## 18个抖音爆款密码（新版）... 2. 撕开认知缺口：这个策略是通过指出观众可能忽略的事情来引发他们的好奇心... 例如，一个健身相关的视频，标题可以是：“你知道吗？这些普通的健身动作，你可能一直都做错了。”'
- name: GPT作为‘知识重构器’的有效性验证
  desc: '[claim] 作者宣称通过该流程，GPT能将碎片化、浅层的‘旧版密码’重构为结构化、深度化、案例化的‘新版密码’，且‘GPT也会是一样的’（即GPT内化后能灵活运用）。[evidence]
    文中附有完整训练过程截图，展示了GPT对第1-5条密码的逐条学习、案例延伸及确认回复，证明了流程在实操中的可落地性。'
  excerpt:
  - 我就问你，牛不牛，是不是感觉这18个爆款密码瞬间就超级容易理解了呢？不单单是你，GPT也会是一样的。
  - '![](img/ad486363a1830524f34cc0909b2142fe.png) 训练全截图'
- name: 提示词工程的本质是‘思维外包’而非‘劳动外包’
  desc: '[claim] 作者核心观点：思考上偷懒的人用不好ChatGPT。写好Prompt的前提是人类具备将业务流程拆解为标准化SOP的能力（道），而非收集现成Prompt（术)。作者从学习博主转型AI训练师的经历印证了‘好内容要找对发现价值的平台/受众’这一商业认知。'
  excerpt:
  - 我越来越发现，在思考上偷懒的人，是用不好ChatGPT的。
  - 这也更加坚定地解释了，为什么小凡老师就是能够很好地解决这些问题...因为我坚持了自我复盘7年...有太多太多思维模型
  - 光光教“术”，并没有用，而是要教真正的“道”
