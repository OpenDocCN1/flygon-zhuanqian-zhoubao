paper: docs/202306/20230613_134.md
desc: 该素材是一篇实战复盘教程，作者分享了从零开始利用微信生态自带的“搜一搜”热点榜单发现选题，结合爆款文章拆解与双角色提示词工程（风格模仿角色A+深度分析角色B）驱动
  ChatGPT 高效产出微信公众号热点情感类文章的完整标准化流程（SOP），并覆盖了配图去水印、封面选取、标题生成模板及发布运营细节，最终实现阅读量从个位数突破至四位数的正反馈闭环。
concepts:
- name: 微信搜一搜热点榜单选题法
  desc: 利用微信客户端自带的“搜一搜”发现页热点榜单（搜索发现 -> 热点）作为核心选题来源，因其自带微信生态流量分发权重，且实时性强，适合捕捉自带流量的社会热点事件。
  is_original: false
  excerpt:
  - 微信自带的搜一搜的热点：注意：微信的热点就是搜索发现，截图里面的第一个。
  - 热点事件，出现了好几条，选第三条：「浙江一处长地铁猥亵他人 被拘 12 日」，特别是这种带有「性」相关的热点是自带流量的。
- name: 双角色协作提示词工程
  desc: 将写作任务拆解为两个专用 AI 角色协作：角色 A 负责学习并模仿目标爆款文章的文风结构（客观报道风格）；角色 B 负责扮演资深评论员，对热点事件进行多维度深度剖析（逻辑、法理、人性、社会心理等），最终融合两者输出兼具爆款文风与深度见解的成稿。
  is_original: true
  excerpt:
  - 首先找到对应的要处理的文章，训练一个角色 A；然后再提示 AI 担任一个分析热点事件的角色 B。A 和 B 结合起来写一篇文章。
  - 得到角色 A「客观报道风格」... 再用提示词得到一个点评热点事件的角色 B，主要是点评和分析热点事件，以及了解背后的逻辑和其他问题。
- name: 爆款标题模板库驱动生成
  desc: 建立基于微信公众号推荐机制的标题模板库（如“万万没想到，xxxx”、“震惊！xxxx”等），结合 ChatGPT 批量生成 20 个候选标题，通过人工筛选符合“公众号口味”、点击率高的标题，解决大数据分发下的冷启动点击难题。
  is_original: false
  excerpt:
  - 热门标题的的模板，大概是下面这样的（来自航海手册的截图）。比如我最近写的一篇就是「万万没想到，xxxx」，阅读量比之前翻了 10 几倍。
  - 并给上面的文章，给出 20 个可能火爆的标题，让读者看了标题就忍不住想点进来看，字数在 30 字以内
- name: 微信生态短视频二创配图法
  desc: 针对热点新闻类文章，利用抖音/小红书热门视频作为素材库，通过微信小程序“抖音去水印”下载视频，本地截取关键帧作为文章配图，解决版权风险与配图时效性问题，且操作门槛极低（无需专业软件）。
  is_original: false
  excerpt:
  - 对于配图，如果是事实热点，就去小红书、抖音找对应的视频，然后下载下来自己截图放到文章里面。
  - 打开微信搜索抖音去水印-> 随便算一个-> 粘贴，并处理-> 下载... 如果是 iPhone，直接在图片里面 拖拽，找到合适的帧，然后截屏并修改大小即可
methods:
- name: __overview__
  desc: 微信公众号热点文章 AI 生产标准化流程（SOP）：热点发现（微信搜一搜） -> 爆款拆解与角色训练（角色A/角色B） -> 融合生成与迭代打磨 ->
    配图/封面/标题优化 -> 发布设置与多渠道分发。
  excerpt:
  - 下面就是具体的操作步骤，找到热点文章，并分析，然后用 ChatGPT 出文章，直到发布
  - 1. 找热点 -> 2. 找相关的热门文章 -> 3. 用 ChatGPT 来分析，并写出文章 -> 4. 配图，封面和标题 -> 5. 文章发布
- name: 角色A训练：爆款文风逆向工程提示词
  desc: 输入一篇 10W+ 爆款文章全文，指令 ChatGPT 从结构、语气、修辞、开头结尾、情绪节奏等维度进行深度拆解，输出结构化风格画像，作为后续写作的风格约束模板。
  excerpt:
  - 得到一个角色 A，用 ChatGPT 来分析一篇热门的文章，提示词如下：注意：内容建议用（xx），““““xx””””等格式，把主体引用起来，方便 ai 能识别到内容主体。
  - 得到角色 A「客观报道风格」，结果如下...
- name: 角色B构建：专家视角深度剖析提示词
  desc: 借助 aicosplay 等工具生成系统提示词，定义 AI 为“资深社会新闻评论员/心理学家/法学专家”，要求其从事件背景、核心冲突、法律法规、社会心理、性别视角、深层逻辑、启示建议等
    7 个维度输出结构化分析报告，为文章提供深度内核。
  excerpt:
  - 再用提示词得到一个点评热点事件的角色 B... 这里利用 aicosplay 来写一个提示词。
  - 下面是具体的提示词信息：[图片展示了角色B的详细系统提示词设定，包含7个分析维度]
- name: 融合生成与迭代打磨提示词
  desc: 将角色A的风格画像、角色B的深度分析报告、原始热点关键词作为上下文注入，设定字数约束（1200字左右）、完读率优化目标，指令 AI 生成初稿；随后通过“继续指令”补全、人工微调（加钩子、金句、互动引导）完成定稿。
  excerpt:
  - 括号里面的为具体的事件内容，把角色 A 和角色 B 的分析结合起来，下面详细的样例。
  - 如果在生成的过程中，中断了，或者是字数不够，可以输入「继续」来继续写文章... 自己在通过生成的全文来适当的修改，并做一些删减的动作，或者加一个钩子之类的、加几句金句
- name: 标题批量生成与筛选法
  desc: 输入成稿正文+爆款标题模板库，指令 ChatGPT 扮演‘微信公众号爆款标题专家’生成 20 个备选标题（<30字），人工结合‘悬念感、代入感、冲突感’筛选最终标题，并验证是否符合微信‘看一看’推荐分发偏好。
  excerpt:
  - 并给上面的文章，给出 20 个可能火爆的标题，让读者看了标题就忍不住想点进来看，字数在 30 字以内
  - 来看看生成的标题，是不是有那种味道了。
theorems:
- name: 热点自带流量 + 情感切入 = 高概率爆款公式
  desc: 核心主张：事实热点事件（尤其是涉性、冲突、反转类）自带公域流量与讨论度；若能迅速切入，用‘情感/人性/深度’视角重写而非单纯搬运新闻，即可承接热点红利，获得微信‘看一看’推荐流量，实现冷启动破圈。
  excerpt:
  - 就反思了下，并不是从转化/流量/产品出发，而是从当前出发---「没有流量」，有没有可能分析「时事热点」，然后写成情感类的文章。因为事实热点都是自带流量的
  - 结合热点的内容，和相关的 10w+文章的内容，写一篇文章，有机会成为 高阅读的文章。
- name: AI 速度 + 人类框架 = 超越常人产出质量
  desc: 核心主张：引用粥左罗观点，ChatGPT 解决‘写得快’（执行层），人类负责‘思考框架好’（策略层：选题、风格定义、深度分析维度、标题模板、发布策略），两者结合形成‘1+1>2’的杠杆效应，普通人可低成本生产专业级内容。
  excerpt:
  - 粥左罗老师说的：ChatGPT 写得快，我们思考文章的框架好，那么一个快、一个好，结合起来是不是就超过了不少人了。
  - '叉叉敌 : 是的，1+1>2'
- name: 完读率优先于字数的分发机制适配原则
  desc: 核心主张：微信公众号推荐算法高度权重‘完读率’，文章字数需严格控制在 1200 字左右；过长导致完读率下降，进而引发推荐衰减、点赞后推荐减少的负向循环，因此‘短小精悍+高密度信息’优于‘长文大作’。
  excerpt:
  - 注意：重点是字数 1200 字左右，不要太多，完读率不高。
  - 数控制在 1200 左右为佳，多了完读率不高，然后用户点赞后，在底部的推荐就会减少。
- name: 新号冷启动依赖‘群发’+‘原创’+‘精准分类’+‘外部导流’组合拳
  desc: 核心主张：无粉丝基础新号的流量来源主要是‘看一看’推荐与搜索；必须勾选‘原创’提权、选择精准分类（社会->热点情感）匹配用户画像、必须使用‘群发’而非‘发布’触发推荐机制、主动利用微博/知乎/百家号同步分发引入外部冷启动流量激活推荐飞轮。
  excerpt:
  - 原创，这个原创会增加自己的推荐率，必须勾选。
  - 文章在发布的可以定时「群发」，这个一定要选群发，不要选「发布」
  - 目前我发现有微博流量，带热点的标签... 如果时间充足，可以考虑知乎、百家号、头条，都来一波
findings:
- name: 实战阅读量跃迁验证
  desc: '[evidence] 作者亲测：采用该 SOP 前，情感类文章阅读量长期停留在个位数（甚至需自点赞）；采用‘微信热点榜+双角色提示词+标题模板’流程后，单篇文章阅读量突破至
    4 位数（1000+），且曾出现‘万万没想到’标题模板使阅读量翻 10 余倍的案例。'
  excerpt:
  - 从加入航海之前... 几天下来还是个位数，自信心原地爆炸。
  - 比如从个位数的阅读达到了 4 位数的阅读
  - 比如我最近写的一篇就是「万万没想到，xxxx」，阅读量比之前翻了 10 几倍。
- name: 微信搜一搜热点榜单的实时性与选题可行性验证
  desc: '[evidence] 实操发现：微信搜一搜热点榜单更新极快，新闻事件发生初期（3-10分钟内）尚未形成垄断性 10W+ 头部文章，此时介入写作，存在成为该热点下首个/唯一高质量深度解读文章的机会窗口，从而垄断该热点的长尾搜索与推荐流量。'
  excerpt:
  - 多刷一会儿，3～10 分钟，就可以找到不少文章了。
  - 大概率是新闻事件的原因，还没来得及有高阅读的文章，这个时候写，说不定就有机会成为 10w+。
- name: 抖音/小红书视频截帧配图的版权安全与效率验证
  desc: '[evidence] 实操验证：通过微信小程序‘抖音去水印’下载热门短视频并本地截帧配图，全流程在手机端完成，无需 PS 等专业软件，素材来源为已验证的爆款视频（自带视觉冲击力），有效规避版权投诉风险（去除水印及个人信息），且极大提升配图时效性。'
  excerpt:
  - 打开微信搜索抖音去水印-> 随便算一个-> 粘贴，并处理-> 下载... 直接在图片里面 拖拽，找到合适的帧，然后截屏并修改大小即可，不需要任何其他软件就能完成。
  - 别人验证过的，靠谱，记得不要带上别人的个人信息了，免得被举报了。
- name: 微博热门标签免费导流微信文章的可行性发现
  desc: '[claim] 作者宣称：在微博发布携带热点标签（话题标签）的动态并挂载公众号链接/关键词，可获得自然搜索流量，虽无直接变现但能为文章增量阅读，触发微信内部推荐算法的正向反馈（阅读量+1
    效应），且成本为零。'
  excerpt:
  - 目前我发现有微博流量，带热点的标签，这样就自然的流量，虽然这个流量没有变现，但是可以给文章增加阅读 +1，就可以带来流量效应，增加文章的推荐率。
