paper: docs/202306/20230613_133.md
desc: 该素材为一篇经验分享类文章，作者惠惠分享了其作为百家号头条作者转型使用 GPT 创作公众号情感爆文的实战心得，核心内容涵盖了选题获取、标题优化、提示词工程优化文章质量、冷启动流量获取及心态调整五大模块，并展示了
  7 天内产出 2 篇 10 万+ 爆文的数据成果。
concepts:
- name: AI 情感爆文创作流程
  desc: 指利用 GPT 等大模型工具，通过结构化的提示词工程、选题库构建、标题公式化及冷启动分发策略，批量产出高阅读量公众号情感文章的标准化作业流程。
  is_original: true
  excerpt:
  - 我会分别从用 gpt 写文章不知道去哪里找题材，标题起了一个小时，结果完全不吸引人，gpt 写的文章太差劲，和一直不入池，心态如何调整，这几方面展开讲一下我踩的坑，以及如何优化
- name: 冷启动
  desc: 公众号新号或新文在无粉丝基础、无推荐流量情况下，通过外部导流（如朋友圈、社群、互推）、平台机制触发（如“看一看”、“精选”入池）获取初始种子流量的过程。
  is_original: false
  excerpt:
  - 请问文章中提到的冷启动，有没有 5.30Adrian 老师的链接呢
  - 在航海的公众号项目中的高手分享里
- name: 入池判定标准
  desc: 判断公众号文章是否进入微信推荐流量池（如“看一看”、“精选”、“搜一搜”）的数据观测指标。
  is_original: false
  excerpt:
  - 在数据分析那里，出现看一看、精选之类的就算入池了
methods:
- name: __overview__
  desc: 作者总结的 AI 写情感爆文全链路方法论，包含选题挖掘、标题公式化、提示词迭代优化、冷启动执行、心态管理五大步骤。
  excerpt:
  - 我会分别从用 gpt 写文章不知道去哪里找题材，标题起了一个小时，结果完全不吸引人，gpt 写的文章太差劲，和一直不入池，心态如何调整，这几方面展开讲一下我踩的坑，以及如何优化
- name: 选题获取法
  desc: 解决‘不知道去哪里找题材’的问题，可能包含竞品分析、热榜追踪、用户痛点挖掘等具体渠道与筛选标准（原文未展开细节，飞书文档可能包含）。
  excerpt:
  - 用 gpt 写文章不知道去哪里找题材
- name: 标题公式化创作法
  desc: 针对‘标题起了一个小时，结果完全不吸引人’的痛点，建立可复用的标题模板或公式（如冲突制造、悬念设置、痛点直击等），提升点击率（CTR）。
  excerpt:
  - 标题起了一个小时，结果完全不吸引人
- name: 提示词迭代优化法
  desc: 针对‘GPT 写的文章太差劲’，通过设定角色、输入范文风格、分步生成（大纲-细节-润色）、负面约束等 Prompt Engineering 手段，将输出质量从‘不可用’提升至‘可发布/爆款’级别。
  excerpt:
  - gpt 写的文章太差劲
- name: 冷启动执行策略
  desc: 解决‘一直不入池’问题，包含发文前种子用户导流、发文后社群互推、数据监控与二次分发等操作，触发平台推荐算法（入池）。
  excerpt:
  - 一直不入池
  - 在数据分析那里，出现看一看、精选之类的就算入池了
- name: 心态调整与复盘机制
  desc: 应对 AI 创作初期输出不稳定、流量波动大带来的焦虑，建立‘复盘-迭代-放松’的心理建设与行动闭环，避免因短期数据挫折放弃。
  excerpt:
  - 心态如何调整
theorems:
- name: AI 协作爆文可复制性定理
  desc: 即使是‘社恐+懒癌’、无专业写作背景的普通人，只要掌握结构化的 AI 协作流程（选题、标题、提示词、冷启动、心态），即可在短周期（7天）内批量产出
    10 万+ 级别的公众号情感爆文。
  excerpt:
  - 之前是百家号头条文章作者，4 月开始用 gpt 写情感文章，7 天写出 2 篇 10 万＋
  - 我是个非常社恐+懒癌...这次来分享下我用 ai 写文章的心得...希望可以帮到感兴趣的小伙伴
- name: 流量入池是爆文的必要条件
  desc: 公众号情感文章要成为 10 万+ 爆文，必须触发平台推荐机制进入‘看一看’、‘精选’等流量池，单纯依靠私域裂变难以达到该量级。
  excerpt:
  - 一直不入池
  - 在数据分析那里，出现看一看、精选之类的就算入池了
- name: 标题决定点击率上限，内容决定完读率与分享率
  desc: 标题是文章能否入池的关键门槛（CTR），而 GPT 生成内容的质量（通过提示词优化）决定用户停留、完读与转发，二者缺一不可。
  excerpt:
  - 标题起了一个小时，结果完全不吸引人
  - gpt 写的文章太差劲
findings:
- name: 7天2篇10万+实战数据
  desc: '[evidence] 作者在 2023 年 4 月开始使用 GPT 创作，仅用 7 天时间产出 2 篇阅读量超过 10 万的公众号情感文章，验证了该
    AI 创作流程的有效性。'
  excerpt:
  - 4 月开始用 gpt 写情感文章，7 天写出 2 篇 10 万＋
  - （晒下其中 2 个号的成绩）
- name: 新手常见四大阻碍点
  desc: '[evidence] 通过作者实踩坑总结，新手用 AI 写公众号情感文主要卡在：选题渠道不明、标题缺乏方法论、Prompt 不会写导致出文质量低、不懂冷启动导致不入池、心态崩盘五大环节。'
  excerpt:
  - 不知道去哪里找题材，标题起了一个小时，结果完全不吸引人，gpt 写的文章太差劲，和一直不入池，心态如何调整
- name: 社群协作加速成长
  desc: '[claim] 作者主张‘一个人走得快，一群人才能走得更远’，认为在航海等付费社群/项目中获取高手分享（如 Adrian 老师的冷启动课程）能显著降低试错成本。'
  excerpt:
  - 一个人走得快，但是一群人才能走得更远
  - 在航海的公众号项目中的高手分享里
