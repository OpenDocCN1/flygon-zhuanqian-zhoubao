paper: docs/202306/20230613_012.md
desc: 该素材为生财有术社群资深成员老瞿 Qu 的成长复盘分享，详细阐述了从“韭菜”成长为“年入百万铁杆粉丝”的四大核心心法：一是重新定义社群价值，认清亦仁格局与航海手册的核心地位；二是建立高效的信息筛选与大佬甄别体系（看精华、看分发、看内容而非截图）；三是提出项目选择的“基本盘衍生”与“跟随航海”双轨原则；四是揭示赚钱本质为“28定律下的超越竞争”，强调付出需超过同行80%才能获利。
concepts:
- name: 航海手册
  desc: 生财有术社群组织的大规模实战训练营产出的结构化知识库，由多位教练协作编写并经审核，被作者视为超越市面90%付费课程的‘商业百科全书’，是项目实操的最高标准参考。
  is_original: true
  excerpt:
  - 生财有术的航海手册才是真正的商业百科全书，学校老师讲的那些大多数是纸上谈兵。
  - 因为也作为教练参与了这次二手书航海手册的编制，所以我真觉得航海手册超过了市面上 90%的付费课程。
  - 他肯定写的没有航海手册好，因为航海是很多教练共同完成的，生财还有人审核
- name: 基本盘衍生原则
  desc: 项目选择策略的核心原则，主张新项目必须在个人现有核心优势（基本盘）周边进行衍生扩展，而非跳跃式进入陌生领域，以此降低试错成本并放大复利效应。
  is_original: true
  excerpt:
  - 在个人基本盘周边进行衍生，比如我的基本盘是二手书项目，那我就会在这个周边去衍生激活码等项目，直到目前我二手书的每月利润能稳定在 10W+
- name: 跟随航海选项原则
  desc: 项目选择策略的辅助原则，主张利用社群头部资源（亦仁/生财团队）的风口筛选能力，直接跟随官方航海项目实操，避免自行选择已被市场玩烂的过时项目。
  is_original: true
  excerpt:
  - 新选的项目，强烈建议跟着生财航海项目走；没问过亦仁，但我猜亦仁每个月很大的精力都在想这次航海上什么项目，所以你放着一个年入上亿元的公司为你选的项目你不做，你找一个早就被市场玩烂的项目，求被割，这个无解。
- name: 赚钱的28定律
  desc: 作者基于个人从农村寄宿生到世界500强高管再到创业者的经历总结的赚钱底层逻辑：赚钱的本质不是‘做了项目’，而是‘在该赛道付出的能力/努力超越了80%的同行’，即必须成为头部20%才能获利。
  is_original: true
  excerpt:
  - 所以我一直觉得，这个世界有个定律是在哪里都存在的，就是 28 定律。
  - 同理，你能赚钱不是因为你开始做某个项目了，而是你的付出，你的能力能超过做这个项目 80%的人，那你才能赚到钱。
  - 你真正想要赚钱，你的付出就超过这次航海的 80%的人，那我相信你一定会取得一些成绩。
- name: 精华帖信用体系
  desc: 生财有术社群内部的高信任度背书机制，作者将其作为判断成员‘真心利他’与否、是否‘靠谱’的核心硬指标，优于粉丝数、收入截图等易造假指标。
  is_original: true
  excerpt:
  - ①他有没有获得过精华帖，只有真心利他的人，才会获得生财精华帖；
  - 我一直通过看这个人在生财多久，发布多少主题，有多少赞，然后判断这人靠不靠谱
methods:
- name: __overview__
  desc: 作者从韭菜到铁杆粉丝的完整成长方法论，包含四个阶层：认知重构（认清社群定位）、信息过滤（三步甄别法）、项目决策（双轨原则）、底层心法（28定律）。
  excerpt:
  - 我将会从以下 4 个问题，聊聊我的经验和观点：1、生财有术的老大亦仁的格局如何？ 2、如何在生财的海量信息中找到自己需要的内容和大佬？ 3、如何选择适合自己的项目？
    4、关于赚钱的本质是什么？
- name: 三步大佬甄别法
  desc: 在生财社群中快速识别高质量内容生产者和可信赖大佬的标准化操作流程：Step 1 查精华帖（利他证明）；Step 2 查同步发布星球数（判断营销意图，>3个为高危）；Step
    3 查选题多样性（判断是否‘秀肌肉’式翻新内容）。
  excerpt:
  - 一般我会关注 3 个东西：①他有没有获得过精华帖，只有真心利他的人，才会获得生财精华帖；②看他同一篇文章在多少个星球发布过，2-3 个还算正常，一下整好多个星球同步发，你懂的；③看他在生财的文章选题，今天发的是小红书年入百万实操流程，明天发的是
    1 个店铺月入 10W 的流程，就是翻来覆去秀肌肉写流程的，你懂的。
- name: 航海手册优先筛选法
  desc: 面对海量‘保姆级教程’时的信息降噪策略：凡有对应航海手册的项目，直接忽略散文教程（划走或<30秒浏览），优先研读航海手册；仅在无航海手册覆盖时，再启用三步甄别法评估散文内容。
  excerpt:
  - 但凡是写什么保姆级教程的，只要这个项目有航海手册，那我基本上全部划走，或者瞄一眼不超过 30 秒。因为他肯定写的没有航海手册好...所以大家多看看对应的航海手册，剩下的就需要用下面的方法甄别了。
- name: 内容实证主义验证法
  desc: 拒绝被收入截图、GMV数据等易造假表象迷惑，转而验证：项目是否有航海手册、群内他人分享差异、内容是否包含超越手册的原创观点心得。
  excerpt:
  - 我从不会盯着月入 10W，年入百万的数字去看，或者截图去看，这玩意你让我一天过亿我也能给你视频版。所以我一般更加会看中这个人写了什么内容，这个项目航海手册有没有，群里其他人分享过嘛，大家分享有哪些差异
theorems:
- name: 社群价值重构定理
  desc: 头部成熟社群的核心价值不在于‘带项目实操’（小社群模式），而在于‘提前1年捕捉风口’、‘聚合有结果者分享前沿经验’、‘大规模航海实现0-1标准化’，航海手册是其核心资产载体。
  excerpt:
  - 生财有术早就不是一个小社群了...那种带几个项目实操，都是几百上千人的小社群干的事情。生财有术更有价值的是什么？1、是他能比其他社群提前 1 年找到创业的风口和风向标；2、是他汇集了无数有结果的人...3、是他的航海能一次性带领几万人实现从
    0-1。
- name: 项目选择无解论
  desc: 个人自主选题在信息不对称下极大概率选中‘市场玩烂的坑’；唯一确定性高的策略是‘基本盘衍生’与‘跟随头部社群航海选题’的组合，其他路径均属‘求被割’。
  excerpt:
  - 所以你放着一个年入上亿元的公司为你选的项目你不做，你找一个早就被市场玩烂的项目，求被割，这个无解。
- name: 利他内容永恒价值论
  desc: 社群优质内容的标准是‘每篇文章都应该有自己的思考’而非‘翻来覆去秀肌肉写流程’；真诚分享者会主动避让已有选题（如作者放弃分享抖音育儿号项目），利他才能获得精华帖与长期信任。
  excerpt:
  - 因为我觉得生财不需要这种内容，每篇文章都应该有自己的思考，所以我最近喜欢看小马宋老师的分享...比如我在抖音国外育儿号项目也在四个月时间拿到 20W 利润的成绩，本来计划分享下的，但有同样的文章了，我就不写了。
findings:
- name: 个人成长路径验证
  desc: '[evidence] 作者从加入生财3年、付费3次、续费到老、产出4篇精华帖、二手书项目月利润稳定10W+的实测数据，验证了‘跟随航海+基本盘深耕+28定律付出’路径的有效性。'
  excerpt:
  - 我是老瞿 Qu，生财有术编号 35610，加入生财有术 604 天，付费过 3 次，只要生财还在一天，续费到老的生财有术铁粉，目前精华帖数量 4 篇...直到目前我二手书的每月利润能稳定在
    10W+
- name: 航海手册质量碾压市面课程
  desc: '[claim] 作者作为教练参与编制亲历者宣称：航海手册质量超过市面90%付费课程，因其多教练协作+官方审核机制，覆盖注册、选品、曝光等全流程标准化动作。'
  excerpt:
  - 因为也作为教练参与了这次二手书航海手册的编制，所以我真觉得航海手册超过了市面上 90%的付费课程。无非就是怎么注册帐号、怎么选品、怎么提升曝光，写不出花来的。
- name: 多星球同步发布为营销号特征
  desc: '[evidence] 经验总结：同一篇文章在2-3个星球发布属正常分发，若‘一下整好多个星球同步发’则为典型营销/引流号特征，可作为快速识别低质量内容源的启发式规则。'
  excerpt:
  - ②看他同一篇文章在多少个星球发布过，2-3 个还算正常，一下整好多个星球同步发，你懂的
- name: 拉新工作室项目避坑案例
  desc: '[evidence] 作者透露曾因拉新工作室项目亏损20W，并据此劝退50+想加盟的生财好友，印证了‘基本盘外跳跃式创业’与‘不跟随航海选题’的高失败率。'
  excerpt:
  - 之前我也大概劝退了 50+想加盟开拉新工作室的生财好友，如果大家对这个我亏了 20W 的项目感兴趣，我下篇文章分享下失败的经历。
- name: 知识星球功能退化影响信任评估
  desc: '[evidence] 发现知识星球APP改版取消了点击头像查看‘加入天数、发布主题数、获赞数’的功能，导致作者无法沿用原有‘看人品/靠谱度’的评估维度，已向亦仁反馈求助。'
  excerpt:
  - 求助：知识星球以前点击头像能看到上面这个截图的，为什么现在看不到了？我一直通过看这个人在生财多久，发布多少主题，有多少赞，然后判断这人靠不靠谱，这个功能真的挺好，为什么被知识星球
    APP 取消了
