paper: docs/202306/20230613_014.md
desc: 该素材为一篇简短的工具推荐类文章，作者介绍了浏览器插件 HARPA AI 的核心功能与使用方法，旨在帮助用户通过预设快捷指令快速对网页内容进行结构化摘要、笔记整理及待办事项提取，从而提升学习与工作效率。
concepts:
- name: HARPA AI
  desc: 一款浏览器插件工具，集成了 GPT 能力，支持在任意网页上通过预设快捷指令自动执行摘要、笔记、待办提取等任务，主打免调教、即装即用。
  is_original: false
  excerpt:
  - 插件名称叫 HARPA AI，打开对应要阅读的网页界面，点击一下插件图标，就能够调用插件，点选里面的快捷指令就能自动调用，无需调教~
- name: 快捷指令
  desc: HARPA AI 插件内置的预设提示词模板，用户无需编写 Prompt 即可一键触发特定的 AI 任务（如摘要、笔记、待办提取）。
  is_original: false
  excerpt:
  - 点选里面的快捷指令就能自动调用，无需调教~
methods:
- name: __overview__
  desc: 基于 HARPA AI 插件的网页内容结构化处理工作流：安装插件 -> 打开目标网页 -> 唤起插件面板 -> 选择预设快捷指令 -> 自动生成摘要/笔记/待办事项。
  excerpt:
  - 安装使用的方法也很简单，根据文章内容就可以操作！
  - 打开对应要阅读的网页界面，点击一下插件图标，就能够调用插件，点选里面的快捷指令就能自动调用，无需调教~
theorems:
- name: 工具降低 AI 应用门槛论
  desc: 通过将复杂的 Prompt Engineering 封装为产品化的‘快捷指令’，普通用户无需掌握提示词工程即可高效利用大模型能力处理专业阅读任务。
  excerpt:
  - 点选里面的快捷指令就能自动调用，无需调教~
  - 如果你经常需要阅读各类文章，并想要以固定的框架去做笔记，做摘要，还想要根据文章内容提取待办事项，把学到的内容真正去应用起来，那你可以试一下这个插件。
findings:
- name: HARPA AI 适用场景验证
  desc: '[claim] 该插件适用于高频阅读、需固定框架笔记、需提取待办并落地应用的知识工作者场景。'
  excerpt:
  - 如果你经常需要阅读各类文章，并想要以固定的框架去做笔记，做摘要，还想要根据文章内容提取待办事项，把学到的内容真正去应用起来，那你可以试一下这个插件。
