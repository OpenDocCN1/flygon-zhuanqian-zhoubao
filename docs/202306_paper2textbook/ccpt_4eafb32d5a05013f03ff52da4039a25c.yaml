paper: docs/202306/20230627_093.md
desc: 该素材是一篇发布于2023年6月的技术分享帖，作者“彦灵”分享了一个基于 Stable Diffusion (SD) 实现“淘宝模特 AI 换装”的教程链接，并在评论区针对“指定衣服生成”这一核心需求，提出了训练专属衣服
  LoRA 并故意过拟合以高保真还原服装细节的技术方案。
concepts:
- name: 淘宝模特 AI 换装
  desc: 利用 Stable Diffusion 技术，实现电商模特穿着指定服装的图像生成与替换流程，旨在降低商拍成本。
  is_original: false
  excerpt:
  - 淘宝模特 AI 换装教程
  - 使用的是 SD,具体的教程放在飞书里面
- name: 指定衣服 LoRA 过拟合生成策略
  desc: 针对需精确还原特定服装图案、纹理的需求，通过训练专属该衣服的 LoRA 模型并故意训练至过拟合状态，以实现生成结果与输入衣服图片的高度一致。
  is_original: true
  excerpt:
  - 要指定衣服，就要炼制定衣服的 lora,炼到过拟合，就能生成接近原图的衣服。
methods:
- name: __overview__
  desc: 基于 Stable Diffusion 生态构建电商换装工作流，核心包含通用换装流程（详见外部飞书文档）与指定服装高保真还原方案（训练专属 LoRA
    至过拟合）。
  excerpt:
  - 使用的是 SD,具体的教程放在飞书里面
  - 要指定衣服，就要炼制定衣服的 lora,炼到过拟合，就能生成接近原图的衣服。
- name: 指定服装 LoRA 训练与过拟合控制
  desc: 针对单件服装收集数据集训练 LoRA，并通过延长训练步数或调整学习率等手段使模型过拟合，牺牲泛化能力换取对该服装纹理、版型、Logo等细节的精确记忆与生成。
  excerpt:
  - 要指定衣服，就要炼制定衣服的 lora,炼到过拟合，就能生成接近原图的衣服。
theorems:
- name: LoRA 过拟合即高保真还原原理
  desc: 在指定服装生成任务中，模型的过拟合状态并非负面现象，而是实现‘生成接近原图衣服’的必要条件与核心手段。
  excerpt:
  - 炼到过拟合，就能生成接近原图的衣服。
findings:
- name: 通用换装 vs 指定换装的技术路线差异
  desc: '[claim] 通用换装教程已整理至外部飞书文档；[claim] 针对用户提出的‘给一张衣服图片生成指定衣服’需求，常规推理无法满足，必须采用‘训练专属
    LoRA + 过拟合’的定制化路线。'
  excerpt:
  - 具体的教程放在飞书里面 https://ciw2i24cl6.feishu.cn/docx/IysYdFRYKoqbqdxeNSGcxr0Qnkb
  - '曹超峰 : 大佬，模特生成之后，可以给她指定的衣服生成吗？给他一张衣服图片，而不是让他生成新的衣服，这样可以吗？ 彦灵 : 要指定衣服，就要炼制定衣服的
    lora,炼到过拟合，就能生成接近原图的衣服。'
