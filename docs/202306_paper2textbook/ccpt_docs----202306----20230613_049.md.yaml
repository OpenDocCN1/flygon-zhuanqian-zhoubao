paper: docs/202306/20230613_049.md
desc: 该素材是一篇高客单价（3万）抖音培训课程在4个月内实现业绩翻倍增长的商业案例复盘。作者阿may从切对人群（瞄准无电商基因的传统行业老板）、找对渠道（摒弃抖音自建团队获客，转向渠道分销体系）、设计好销转流程（简化多层漏斗为“免费公开课-299元线下课-3万大课”三步走）、产品差异化（课程+工具交付体系，以工具驱动复购与成果可视化）四个维度，系统拆解了该案例如何通过“裂变发售模式”突破行业内卷，实现高客单价下的快速规模化增长。
concepts:
- name: 传统行业老板红利人群
  desc: 指工厂、农场等无电商基因、自建团队做直播带货困难，但极度需要抖音获客认知、客单价承受力强、易成交且易出成果的B端决策者群体。
  is_original: true
  excerpt:
  - 他切的是传统行业老板，工厂、农场等，这类人群，基本是很多抖音培训放弃的人群，因为他们没有电商基因，自己组团队做直播带货基本做不起来
  - 抖音培训就是传授认知，卖给小白肯定比老手更容易收到钱，我这个朋友是按企业收费的，2 个人 3 万，多增加 1 人就多收 1 万
- name: 渠道分销获客模式
  desc: 摒弃在抖音平台内部自建团队获客（直播/短视频），转而寻找掌握传统企业老板资源的外部渠道商合作，按分成模式合作，己方专注交付，渠道方专注获客，形成互补共生。
  is_original: true
  excerpt:
  - 去年，他们走出了一条适合自己的获客渠道。那就是直接走分销体系，他们找到有这类传统企业老板资源的渠道合作，分好钱，反而获客效果最快！而自己团队就专注做好交付
  - 依然有很多传统行业用老带新、渠道分销这种方式获客，有时候投入很多精力去研究新媒体渠道，反而还不如扎扎实实做好这些传统获客渠道
- name: 极简销转漏斗
  desc: 精简传统的多层级低转高漏斗（免费课->199->1000->3万），确立“免费公开课 -> 299元1天线下课 -> 3万大课”三阶段高效转化路径，配合1对1销售与1对多直播邀约双轨并行。
  is_original: true
  excerpt:
  - 现在他们走的销转流程主要就是免费公开课卖 299 元 1 天的线下课，然后在 299 元线下课就直接销售 3 万的大课
  - 对于渠道而言，主要有 1 对 1 销售 299 元线下课和 1 对多批量邀约客户到直播间的流程，直播课的销讲讲师和线下课的讲师都是我朋友派人过去
- name: 课程+工具双引擎交付体系
  desc: 以‘线上建认知+线下学着做+线上训练营带着练’为教学闭环，配合自研抖音工具实现作业标准化、数据可视化、教练辅导精准化，解决课程难复购、成果难量化、交付重人力痛点。
  is_original: true
  excerpt:
  - 他们设计了一整套交付流程，线上课建认知+线下课学着做+线上训练营带着练，同时，他们还开发一款抖音工具，所有客户的作业用工具来做
  - 学会用工具批量做出视频内容，批量发布，哪些客户有效果，哪些客户需要重点辅导，所有数据直接可以看得到
  - 课程复购很难，但是工具可以复购，我们之前就是用课程+工具的组合拳，跑出了年营收 4 个亿，课程公司反哺软件公司上市的成果
- name: 询盘导向成果评价体系
  desc: 针对传统行业以获取询盘/线索为核心诉求而非电商直接成交ROI的特点，建立‘培训后成功率95%以上’的可量化评价标准，降低承诺风险，强化转介绍说服力。
  is_original: true
  excerpt:
  - 又由于主要做传统行业为主，抖音效果主要是获得询盘为主，就比很多做电商培训以转化 ROI 的成果要容易，因此他们可以说，客户培训后成功率在 95%以上！优化课程的评价体系也是很出色的一点
methods:
- name: __overview__
  desc: 高客单价B端培训业务的‘四步组合拳增长法’：1. 人群重定义（避开红海切蓝海小白）；2. 渠道外包化（分销替代自建获客）；3. 漏斗极简化（三阶直达大单）；4.
    交付产品化（工具赋能标准化复购）。
  excerpt:
  - 我分析下来，主要原因是以下 4 个： 1、切对人群 2、找对渠道 3、设计好销转流程 4、产品差异化
  - 这 4 步优化下来，他们走出了一条快速增长的方式！
- name: 渠道分销动销裂变法
  desc: 通过利润分成激励渠道方主动获客，己方派驻销讲讲师统一标准化交付‘299元线下课/直播课’，渠道方仅负责邀约，降低渠道操作门槛，实现渠道满意度高、转介绍自发发生的裂变循环。
  excerpt:
  - 渠道简单直接，还能赚钱，满意度就很高，还会转介绍渠道！
  - 接下来，就是继续快速拓展渠道，扎扎实实去赋能渠道获客转化，做好渠道动销裂变转化了
- name: 工具驱动的标准化交付与复购法
  desc: 开发配套SaaS工具承载教学流程（作业提交、批量制视频、发布、数据追踪），将‘人力密集型教学’转为‘工具辅助型标准化交付’，利用工具订阅制实现高毛利复购，反哺课程业务。
  excerpt:
  - 所有客户的作业用工具来做，学会用工具批量做出视频内容，批量发布，哪些客户有效果，哪些客户需要重点辅导，所有数据直接可以看得到，方便教练追踪给建议
  - 课程复购很难，但是工具可以复购，我们之前就是用课程+工具的组合拳，跑出了年营收 4 个亿，课程公司反哺软件公司上市的成果
theorems:
- name: 高客单价培训增长悖论破解论
  desc: 高客单价（3万）非标培训业务，不依赖平台算法公域流量，亦不依赖复杂长周期漏斗，反而通过‘切小白人群+用分销渠道+极简漏斗+工具化交付’四大反直觉动作，实现更确定、更可规模、更高利润的倍增增长。
  excerpt:
  - 抖音培训卷的要死，但是我有个客户，也是做抖音培训的，今年 2 月以来业绩却月月翻倍增长！
  - 很多抖音培训机构切得都是个人用户或者电商、门店等人群，但是他切的是传统行业老板...远比一般抖音培训卖得贵
  - 很多做抖音培训的人，基本都在抖音获客...但是抖音培训就一定要在抖音招生吗？
  - 很多人受营销理论影响，把自己产品体系扩充了很多 SKU...整个销售漏斗，客户被一层层筛选，到最后，反而获客效率并不高
- name: 传统渠道分销在新媒体时代的降维打击论
  desc: 在抖音等新媒体渠道高度内卷、获客成本高企的背景下，针对非互联网原生人群（传统老板）的B端高客单价业务，利用成熟的线下/存量渠道资源进行分销合作，往往比自建新媒体获客团队具备更低CAC、更高转化率、更强抗风险能力。
  excerpt:
  - 虽然抖音等渠道崛起，但是依然有很多传统行业用老带新、渠道分销这种方式获客，有时候投入很多精力去研究新媒体渠道，反而还不如扎扎实实做好这些传统获客渠道
  - 自建团队，从抖音招生，发现团队成本高，也不好招生...走分销体系...获客效果最快！而自己团队就专注做好交付，这样客户满意度反而最高
- name: 课程即前端、工具即后端的教育SaaS化商业模型
  desc: 知识付费/培训行业的天花板在于课程难复购、交付重人力、成果难标准化；引入配套工具将服务标准化、数据化，以课程获客、以工具留存复购，可构建‘课程公司反哺软件公司上市’的双引擎增长飞轮。
  excerpt:
  - 课程复购很难，但是工具可以复购，我们之前就是用课程+工具的组合拳，跑出了年营收 4 个亿，课程公司反哺软件公司上市的成果
  - 所有客户的作业用工具来做...方便教练追踪给建议，也方便抓取到实际成果案例来做宣传
findings:
- name: 业绩倍增核心证据
  desc: '[evidence] 案例主体企业在2023年2月以来（撰文时约4个月），业绩实现月月翻倍增长，验证了‘四步组合拳’的有效性。'
  excerpt:
  - 今年 2 月以来业绩却月月翻倍增长！
  - 这 4 步优化下来，他们走出了一条快速增长的方式
- name: 极简漏斗优于复杂漏斗的实战对比
  desc: '[evidence] 对比同行采用‘免费课->199->1000->3万’四层漏斗导致获客效率低、交付累、团队乱；本案例简化为‘免费课->299线下课->3万大课’三步，直接提升转化效率与团队专注度。'
  excerpt:
  - 例如我身边有另外一个朋友...设计了一个免费公开课产品...整个销售漏斗，客户被一层层筛选，到最后，反而获客效率并不高，团队也被多个产品的交付搞得很累
  - 我这个做抖音培训的客户，一开始也设计了很多层级的销转流程，最后发现效果并不好，现在他们走的销转流程主要就是免费公开课卖 299 元 1 天的线下课，然后在
    299 元线下课就直接销售 3 万的大课
- name: 课程+工具模型百亿级验证案例
  desc: '[evidence] 作者过往实操经验显示，该‘课程+工具’组合拳模型已跑通年营收4亿规模，并实现课程业务反哺软件公司上市，为本案例产品差异化策略提供了宏观级商业模型佐证。'
  excerpt:
  - 我们之前就是用课程+工具的组合拳，跑出了年营收 4 个亿，课程公司反哺软件公司上市的成果
- name: 传统行业客户95%成功率宣称
  desc: '[claim] 因传统行业抖音目标为获取询盘而非电商ROI，成果判定标准宽松，培训方宣称客户培训后成功率95%以上，作为强转介绍、强品牌背书的核心销售话术。'
  excerpt:
  - 因此他们可以说，客户培训后成功率在 95%以上！优化课程的评价体系也是很出色的一点
- name: 渠道分销模式下的双赢结构验证
  desc: '[evidence] 渠道方无需懂交付、只需邀约即可分成赚钱，满意度高并主动转介绍新渠道；主办方专注交付与派驻讲师，形成‘渠道动销裂变’正向循环。'
  excerpt:
  - 渠道简单直接，还能赚钱，满意度就很高，还会转介绍渠道！
  - 做好渠道动销裂变转化了
