paper: docs/202306/20230627_065.md
desc: 该素材基于《绝对价值》一书提出的POM模型，系统阐述了影响消费者购买决策的三种核心力量——个人偏好、品牌营销、他人影响，并进一步解析了决策重要性/风险/不确定性、以及大众化程度这三个维度如何决定消费者在具体购买场景中更倾向于听信哪种力量，为营销决策提供了简洁的思考框架。
concepts:
- name: POM模型
  desc: 消费者决策模型，指出消费者选择仅受个人偏好、品牌营销、他人影响三种力量影响，为营销分析提供简洁思考框架。
  is_original: false
  excerpt:
  - 西蒙森提出的这个模型叫做 POM 模型。一般来说消费者在做选择的时候，只受到三种力量的影响。
- name: 个人偏好力量
  desc: 消费者基于自身经验、口味及判断做出的决策倾向，通常难受广告影响，适用于高主观性、低风险决策场景。
  is_original: false
  excerpt:
  - 第一种力量是消费者自己（Personal），或者叫做个人偏好，比如消费者喝茶，他通常会听自己的...他更容易听自己的，利用自己的经验自己的偏好来判断。
- name: 品牌营销力量
  desc: 品牌方通过广告、代言、联名、潮流定义等传播活动对消费者施加的影响力，适用于低决策重要性、低风险、高大众化场景。
  is_original: false
  excerpt:
  - 第二种力量来自品牌方的传播（Marketing），品牌的营销推广活动对消费者有重要的影响。比如隅田川挂耳咖啡请肖战代言的官宣当天，隅田川天猫店当天就增加了上千万的销量。
- name: 他人影响力量
  desc: 来自朋友、专家、KOL、评测机构等第三方的意见对消费者决策的影响，在移动互联网环境下因信息获取便利而显著增强，适用于高决策重要性、高风险、高不确定性场景。
  is_original: false
  excerpt:
  - 第三力量来自第三方，也就是他人（Others）。实际购买中，顾客会听信身边朋友、网络上专家、信任的 KOL、评测机构等的意见...第三方力量在今天的传播环境中越来越强，因为移动互联网创造了这种条件。
- name: 决策重要性
  desc: 衡量购买决策对消费者后果严重程度的维度，决策越重要，消费者越倾向于依赖他人意见而非品牌宣传。
  is_original: false
  excerpt:
  - 比如你要去做一个近视手术，这个决策相对比较重要，风险也大，你就不太容易受品牌方宣传的影响，更愿意去咨询朋友或者专家的意见。
- name: 决策风险与不确定性
  desc: 衡量购买结果偏离预期的可能性及后果的维度，风险与不确定性越高，消费者越依赖他人背书降低感知风险。
  is_original: false
  excerpt:
  - 顾客在购买时更偏向于听谁的？这由这个决策的重要性、风险和不确定性、大众化程度三个维度来决定。
- name: 大众化程度
  desc: 衡量消费者偏好与大众共识一致性的维度，大众化程度越高（如手机），他人意见参考价值越大；越低（如服装），个人偏好权重越大。
  is_original: false
  excerpt:
  - 大众化程度，指的是消费者和别人消费偏好是不是雷同，比如手机，大家用的基本一样，那别人的意见就值得参考，但是衣服就有个人风格偏好在里面。
methods:
- name: __overview__
  desc: 运用POM模型诊断目标品类/产品的决策力量结构，结合决策三维度（重要性、风险/不确定性、大众化程度）判断主导力量，据此配置营销资源（如加大广告投放、布局KOL种草、强化口碑传播）。
  excerpt:
  - 顾客在购买时更偏向于听谁的？这由这个决策的重要性、风险和不确定性、大众化程度三个维度来决定。
theorems:
- name: 消费者决策三力量假说
  desc: 消费者购买决策仅受个人偏好、品牌营销、他人影响三种力量驱动，不存在第四种独立力量来源。
  excerpt:
  - 一般来说消费者在做选择的时候，只受到三种力量的影响。第一种力量是消费者自己（Personal）...第二种力量来自品牌方的传播（Marketing）...第三力量来自第三方，也就是他人（Others）。
- name: 决策情境决定主导力量定律
  desc: 决策重要性/风险/不确定性越高，他人影响力权重越大；决策重要性/风险越低，品牌营销力量权重越大；大众化程度越高，他人影响参考价值越大，大众化程度越低，个人偏好权重越大。
  excerpt:
  - 顾客在购买时更偏向于听谁的？这由这个决策的重要性、风险和不确定性、大众化程度三个维度来决定。
- name: 移动互联网放大他人影响力趋势
  desc: 移动互联网技术降低了第三方信息获取成本，导致他人影响力量在当代消费决策中呈结构性增强趋势。
  excerpt:
  - 第三方力量在今天的传播环境中越来越强，因为移动互联网创造了这种条件。
findings:
- name: 隅田川明星代言即时转化案例
  desc: '[evidence] 隅田川挂耳咖啡官宣肖战代言当天，天猫店单日增量超千万销售额，佐证品牌营销力量在低决策风险、高粉丝粘性品类中的即时爆发力。'
  excerpt:
  - 比如隅田川挂耳咖啡请肖战代言的官宣当天，隅田川天猫店当天就增加了上千万的销量。
- name: 瑞幸联名产品抢购案例
  desc: '[evidence] 瑞幸与椰树牌联名产品推出时各门店被抢空，佐证品牌营销力量（联名/新品制造话题）在低客单价、高频消费品类中的强驱动力。'
  excerpt:
  - 瑞幸在推出与椰树牌联名产品的时候，各个门店的联名产品也被抢空了。
- name: 近视手术决策依赖专家/朋友案例
  desc: '[evidence] 高决策重要性、高风险（近视手术）场景下，消费者规避品牌宣传，转向寻求专家/朋友意见，佐证高风险决策下他人影响力主导地位。'
  excerpt:
  - 比如你要去做一个近视手术，这个决策相对比较重要，风险也大，你就不太容易受品牌方宣传的影响，更愿意去咨询朋友或者专家的意见。
- name: 元气森林低价气泡水广告易感案例
  desc: '[evidence] 4元低客单价、低风险决策（元气森林）场景下，消费者极易受品牌广告影响，佐证低风险决策下品牌营销力量主导地位。'
  excerpt:
  - 而元气森林气泡水，就 4 块钱，这个决策重要性不高，也没有大风险，你就很容易受到品牌广告的影响。
- name: 手机高大众化vs服装低大众化对比案例
  desc: '[evidence] 手机参数标准化导致大众偏好趋同，他人评测参考价值高；服装涉及个人风格，大众化程度低，个人偏好权重大，佐证大众化程度调节他人影响力与个人偏好权重的对比关系。'
  excerpt:
  - 大众化程度，指的是消费者和别人消费偏好是不是雷同，比如手机，大家用的基本一样，那别人的意见就值得参考，但是衣服就有个人风格偏好在里面，衣服的决策，就有更多的个人偏好在里面。
- name: 东易日盛用户决策路径评论案例
  desc: '[evidence] 评论区用户分享家装决策路径：看广告知品牌→搜索/短视频看评价（他人影响）→询问亲友（他人影响）→到店成交，印证高决策重要性品类中他人影响力在中后期决策中的关键作用。'
  excerpt:
  - 分享东易日盛这个品牌用户的消费决策路径：看广告知道这个品牌——去搜索引擎/短视频平台上查看评价和补全产品信息——询问家人/朋友的建议——到店咨询且最终成交。其中
    2 越来越重要
