paper: docs/202306/20230627_003.md
desc: 该素材通过查理·芒格关于“提价增量”的案例（行贿/回扣）为切入点，深刻揭示了商业理论与商业实践之间存在的巨大鸿沟：正规营销、管理理论系统性地回避回扣、办公室政治、地痞勒索、恶意竞争、房东毁约、对手陷害等“灰色/黑色”现实操作，导致纯理论学习者入行即“懵逼”；作者主张必须直面残酷复杂的现实世界，在实战中获取书本没有的“生存技能”。
concepts:
- name: 理论-实践鸿沟
  desc: 指正规商业教育/理论体系（营销、管理等）与真实商业运作环境之间存在的系统性认知断层，理论倾向于理想化、合规化模型，而实践充斥着灰色地带、权力博弈与非标准化冲突。
  is_original: false
  excerpt:
  - 芒格说他最喜欢这个答案，它生动地证明实践与理论的不同，商业实践要比商业理论复杂很多倍。
  - 为什么许多学理论的人一去实践就懵逼？因为实践有许多理论不会触碰的地方
- name: 隐性交易成本/灰色操作
  desc: 指商业实践中普遍存在但理论不予承认的非标准化交易手段，包括回扣（公关费/信息费）、医药代表赞助医生会议、权色交易、保护费、恶意差评/陷害等，是获取商业利益的隐性路径。
  is_original: true
  excerpt:
  - 比如回扣，这在全世界的商业实践中通行，有一些公司把他叫公关费或者信息费，但不改变它的本质。
  - 欧美虽然没那么明目张胆，但医药公司赞助医生去参加学术会议顺带周游世界几天，这不过分吧。
  - 管理理论也很少会告诉你，公司里有同级同事的理解竞争和陷害，有权色交易，有董事会里的权利斗争。
  - 餐厅经营的书里，不会告诉你有地痞流氓收保护费该怎么办？电商运营的书也没有如何处理恶意差评的事。
  - 对手派人来卧底，还故意把鱼扔到垃圾桶里，偷拍视频发出来你该怎么办？
- name: 理论的合规性边界
  desc: 指理论体系受限于法律、伦理、出版审查及学术规范，天然过滤掉非合规、非显性、高风险的实操知识，导致理论呈现的“理想世界”与现实的“丛林世界”严重脱节。
  is_original: true
  excerpt:
  - 很多真的东西，黑的东西，讲了第一过不了审，第二也不愿意讲（评论区 周彦充）
methods:
- name: __overview__
  desc: 采用“经典案例引入（芒格讲座）” -> “核心矛盾抽象（理论vs实践）” -> “多场景实证罗列（营销/管理/餐饮/电商/零售/房产）” -> “元认知升华（接纳残酷现实、实战练就生存技能）”的演绎论证方法。
  excerpt:
  - 查理芒格有一次给斯坦福商学院的学生们做讲座...芒格给出了四个答案，最后一个，是用高出的价格来行贿...
  - 昨天跟几位教授交流，也谈到实践与理论的问题。
  - 同理也有很多类似操作。管理理论也很少会告诉你...餐厅经营的书里...电商运营的书也没有...当年某电器经销商...房东看你开店红火...对手派人来卧底...
- name: 反直觉案例教学法
  desc: 利用权威人物（芒格）给出的反常识答案（行贿即最优解）打破受众的理论惯性，再通过密集罗列跨行业的“潜规则”案例，构建“理论失效”的压倒性证据链，倒逼受众重构认知框架。
  excerpt:
  - 怎么才能提高商品售价，而把销量提升。很少有人能回答这个问题，芒格给出了四个答案，最后一个，是用高出的价格来行贿，然后把东西卖出去。
  - 同理也有很多类似操作。管理理论也很少会告诉你...餐厅经营的书里...电商运营的书也没有...
theorems:
- name: 商业理论的系统性盲区定律
  desc: 一切正规商业理论（营销、管理、运营等）必然构建在合法、合规、理想化的假设之上，因此天然无法覆盖且刻意回避商业实践中普遍存在的灰色地带、权力斗争、暴力胁迫、作弊欺诈等非标准化博弈。
  excerpt:
  - 营销理论从不给你讲回扣这件事。
  - 管理理论也很少会告诉你，公司里有同级同事的理解竞争和陷害，有权色交易，有董事会里的权利斗争。
  - 餐厅经营的书里，不会告诉你有地痞流氓收保护费该怎么办？电商运营的书也没有如何处理恶意差评的事。
- name: 实践认知的获取路径唯一性
  desc: 面对理论无法覆盖的复杂残酷现实，个体无法通过读书/听课习得应对能力，只能通过直接投身实战（“与人斗，其乐无穷”），在具体冲突与博弈中积累隐性知识、建立生存直觉。
  excerpt:
  - 为什么许多学理论的人一去实践就懵逼？因为实践有许多理论不会触碰的地方
  - 现实复杂又残酷，不过毛主席说，与人斗，其乐无穷。欢迎来到残酷又有趣的现实世界。
  - 生财有术让我学到了书本上没有生活经验，打开思维的一扇窗户（评论区 F💙Faye）
findings:
- name: 芒格“提价增量”案例中的行贿最优解
  desc: '[claim] 在芒格斯坦福讲座的“提高售价并提升销量”四个答案中，行贿/回扣被芒格评价为最生动证明“实践与理论不同”、实践比理论复杂得多的答案。'
  excerpt:
  - 芒格给出了四个答案，最后一个，是用高出的价格来行贿，然后把东西卖出去。芒格说他最喜欢这个答案，它生动地证明实践与理论的不同，商业实践要比商业理论复杂很多倍。
- name: 全球商业实践中回扣的制度化与隐蔽化共存现状
  desc: '[evidence] 素材通过对比国内“明目张胆的回扣/公关费/信息费”与欧美“医药公司赞助医生学术会议顺带周游世界”两种形式，论证回扣是全球商业通行的隐性规则，仅表现形式因监管环境不同而异。'
  excerpt:
  - 比如回扣，这在全世界的商业实践中通行，有一些公司把他叫公关费或者信息费，但不改变它的本质。欧美虽然没那么明目张胆，但医药公司赞助医生去参加学术会议顺带周游世界几天，这不过分吧。
- name: 跨业态“潜规则”覆盖面的实证清单
  desc: '[evidence] 素材罗列了6大类典型场景的“理论盲区”：渠道回扣(营销)、办公室政治/权色/董事会斗争(管理)、地痞保护费(餐饮实体)、恶意差评/刷单(电商)、暴力砸店(零售竞争)、房东毁约/截胡(租赁博弈)、竞争对手卧底陷害(商业间谍/诽谤)，形成覆盖商业全链路的实证素材库。'
  excerpt:
  - 同理也有很多类似操作。管理理论也很少会告诉你...餐厅经营的书里...电商运营的书也没有...当年某电器经销商去南京开店，同行直接去带人去砸店。房东看你开店红火，他要收回来自己干...对手派人来卧底，还故意把鱼扔到垃圾桶里，偷拍视频发出来你该怎么办？
- name: 理论学习者“入行即懵”的普遍现象
  desc: '[evidence] 基于作者与教授交流观察及评论区共鸣（如“读书读傻了”、“驾校教练说读书读傻了”），发现纯理论训练者因缺乏灰度认知与博弈技巧，在初入职场/创业时普遍出现认知失调、决策失效的“懵逼”状态。'
  excerpt:
  - 为什么许多学理论的人一去实践就懵逼？
  - 联想到驾校教练最喜欢说的话，读书读傻了😂，理论脱离实际（评论区 小野）
