paper: docs/202306/20230613_182.md
desc: 该素材由专业投资人丙丙撰写，从“财富是持续从社会中提取剩余的能力”这一核心定义出发，推导出财富获取的底层法则——对他人施加“得利”或“损害”。基于此，文章系统拆解了三种主要商业模式：一是出卖体力/时间赚取“血酬”（80%人群陷阱，将被AI取代）；二是掌握稀缺社会资源（稀+缺）赚取租金，分为守擂者（股权分身、护城河）与攻擂者（搭历史进程、抢占新资源如AI）；三是制定规则/建立生态做“庄家”（进阶版，赢家通吃，需提供价值维持统治）。最后升华为财富的“拿捏”本质，指出阶层跃升的关键在于先提供价值再完成绑定，实质是获取权力的心法。
concepts:
- name: 财富的本质定义
  desc: 财富不是纸币的存量积累，而是让别人的钱持续流向自己口袋的过程，核心是持续不断地从社会中提取剩余价值。
  is_original: false
  excerpt:
  - 掌控财富的真正核心是，能够持续不断地从社会中提取剩余。
  - “财富”是让别人的钱流向你口袋的过程。你变得更有钱的过程，就是更多人的劳动和价值转向你的口袋的过程。
- name: 财富获取的底层法则
  desc: 让他人向自己上供财富的唯一合法路径是：对他人有用（施加得利）或能对他人施加损害。影响力覆盖面与强度决定财富上限。
  is_original: true
  excerpt:
  - 那么如何让他人把口袋里的钱掏给你呢？除了《刑法》里的办法之外，唯一颠扑不破的法则是：你对他人有用（有利益），或者你可以对他人施加损害。
  - 你对越多人有用，你的用处越大，或者你可以对越多人施加损害，你能施加的损害越严重，那么你能把控的财富就会越多。
- name: 血酬模式
  desc: 第一种商业模式，出卖时间健康换取线性收入，从事可替代性极强的螺丝钉工作，缺乏议价力与复利，将被AI彻底取代成为“无用阶层”。
  is_original: true
  excerpt:
  - 第一种商业模式，靠体力赚钱，赚的是“血酬”，花费的生产资料是自己的时间和健康。80%的人玩的是这种商业模式。
  - 这种工作已磨损了他们的认知和思考能力...做这种工作越久，这部分群体就会越缺乏议价力。
  - 随着 AI 带来的第四次科技革命...这部分群体注定会成为“无用”之人，与“财富”无缘。
- name: 稀缺社会资源
  desc: 第二种商业模式的核心载体。指社会运转必不可少（缺）且总量有限仅少数人能掌握（稀）的资源，包括有形（房产、厂房）与无形（流量/注意力、技术、人脉）。掌握者拥有对需求者的定价权与议价力。
  is_original: true
  excerpt:
  - 第二种商业模式，掌握稀缺社会资源赚钱。
  - 稀指的是这种社会资源的总量非常有限...缺则指的是社会运转中“必不可少”，没他不行的重要资源。
  - “掌握稀缺的社会资源”，意味着你对那些没有这些社会资源...有巨大的“作用”（得利）、或者是能够“加害”的力量。
- name: 守擂者与攻擂者
  desc: 基于是否已掌握稀缺资源衍生的两种博弈策略。守擂者通过股权分身、护城河最大化资源价值并排除竞争；攻擂者通过创新抢占“新稀缺资源”替代“旧稀缺资源”，实现阶层跃升（搭历史进程）。
  is_original: true
  excerpt:
  - 一种是守擂者：他们要牢牢固守住社会资源掌控者的位置...通过“股权”的方式制造自己的“分身”...建立自己的分身。
  - 而另一种打法是“攻擂者”...在“新的稀缺社会资源”代替“旧的稀缺社会资源”的过程中，通过抢先入局和迭代，先行掌握住了“新的稀缺社会资源”...这就是，搭上了历史的“进程”。
- name: 制定规则/坐庄模式
  desc: 第三种商业模式，即建立生态、制定规则成为“庄家/上帝/裁判”。基于掌握稀缺资源进阶而来，拥有对生态内所有参与者施加得利/损害的绝对权力，具有自复制、滚雪球、赢家通吃特征，需持续提供价值秩序防止被推翻。
  is_original: true
  excerpt:
  - 第三种商业模式是第二种商业模式的“进阶版”...你是开赌场的老板。在你的场域中，你说了算，你是庄家，你制定规则...
  - 因为“建立生态”、“制定规则”，是最深刻地能对参与者施加“得利”和“损害”的商业模式。而一旦生态完成，就会有自复制自延展的“滚雪球效应”，“赢家通吃”。
- name: 赚风口的钱
  desc: 第四种非主流模式，利用信息差或敏锐度在新旧资源更替窗口期短期获利，缺乏护城河与复利，属“一波流”，无法实现长期财富积累。
  is_original: true
  excerpt:
  - 还有一种赚钱模式，我称之为“赚风口的钱”...赚风口的钱，虽然是“一波流”。
  - 但因为能力不够或者认知不够、运气不足，最终并没有抓到“稀缺”资源，因此无法产生“复利效应”和“护城河”，缺乏长期的积累和发展性。
- name: 拿捏
  desc: 财富本质的终极浓缩。指物质或精神层面对他人的控制力（如奢侈品的精神拿捏、苹果生态的绑定）。财富即权势，权势本质即拿捏。阶层跃升=拿捏自己人性+拿捏他人人性（提供价值->完成绑定）。
  is_original: true
  excerpt:
  - 不难看出财富的本质可以浓缩成两个字：“拿捏”。无论是物质还是精神上的“拿捏”。
  - 从这里，我们可以更深刻地理解马克思的那句话——财富是权势。因为权势的本质，同样是“拿捏”。
  - 对于无权无势的普通人来说，做到“拿捏”，就是要做到：首先提供价值...然后想办法完成绑定，把更多人绑上你的战车...使你产生了能够对他人“给予利益”或者“招来损害”的权力。
methods:
- name: __overview__
  desc: 采用‘本质定义->底层法则->模式分层->博弈策略->本质升华’的演绎逻辑框架。结合投资人实战视角与政治学分析工具，将宏观社会结构（私有制、阶级、技术革命）与微观商业决策（护城河、生态构建、绑定机制）贯通分析。
  excerpt:
  - 不少人盲目地追逐“纸币”...掌控财富的真正核心是...唯一颠扑不破的法则是...根据这条法则，赚钱有“三种常见的商业模式”。
  - 根据大家有没有已经握在手里的“稀缺社会资源”，会衍生出两种不同的打法...接下来，我们再聊聊第三种商业模式...最后总结财富的“三重境界”...“拿捏”。
- name: 稀缺性双维度拆解法
  desc: 将‘稀缺’拆解为‘稀’（供给端：总量有限、物理/认知限制、信任成本高）与‘缺’（需求端：刚需、必不可少、巨大社会需求）两个独立维度，用于识别与评估核心资产护城河。
  excerpt:
  - 稀缺其实有两个意思。稀指的是这种社会资源的总量非常有限...缺则指的是社会运转中“必不可少”，没他不行的重要资源。
  - “稀”的方面，同样是基于人这种动物的特性——人的注意力、精力和活动范围都是有限的...越是金字塔上方的人物，信任成本会越高，这同时增加了优质人脉掌握者的“稀”和“缺”的权重。
- name: 新旧稀缺资源更替模型
  desc: 判断历史进程与阶层跃升机会的模型：识别‘旧稀缺资源湮灭’与‘新稀缺资源诞生’的交叉窗口期（如AI时代），攻擂者通过抢先入局新资源实现弯道超车，守擂者因资产贬值跌落。
  excerpt:
  - 在“新的稀缺社会资源”代替“旧的稀缺社会资源”的过程中，通过抢先入局和迭代，先行掌握住了“新的稀缺社会资源”的方式，完成了对旧有利益集团的“新陈代谢”。
  - 我们这代人的幸运恰恰在于，当前处在 AI 发展的初期阶段...正在孕育和发生着大量“新稀缺社会资源的诞生”和“旧稀缺资源的湮灭”。
- name: 生态绑定与分利机制
  desc: 制定规则模式下的核心操作手法：通过分利让利绑定核心人才（牛人）与大量用户，构建自复制生态；利用‘得利/损害’双向权力抽取剩余；需持续迭代服务对抗反垄断/创新者颠覆。
  excerpt:
  - 在构建这个属于自己场域的过程中，要注意做到把更多人绑上自己的战车，通过分利让利的手段，让更多人、特别是牛人能在自己的场域中得利...
  - 淘宝向店家征收手续费，但与此同时，它也必须迭代自己，提供优质的服务和流量...否则，便会有“创新者”进来钻空子，“抢庄家”的位子。
theorems:
- name: 财富提取三层级定理
  desc: 商业模式按财富提取的深度与广度分三级：L1血酬（线性、可替代、无杠杆）、L2资源租金（垄断稀缺、有杠杆、守/攻博弈）、L3规则制定（生态垄断、赢家通吃、最高杠杆）。层级越高，抗风险与复利能力越强。
  excerpt:
  - 第一种商业模式，靠体力赚钱...第二种商业模式，掌握稀缺社会资源赚钱...第三种商业模式...通过制定规则来赚钱...第三种商业模式是第二种商业模式的“进阶版”。
- name: AI颠覆血酬模式必然性定理
  desc: 第四次科技革命（AI）将必然淘汰以出售可标准化、重复性时间为核心的血酬模式，因为AI在成本、效率、规模上全维度碾压人力，导致该群体失去‘有用性’（议价力归零），成为相对无用阶层。
  excerpt:
  - 随着 AI 带来的第四次科技革命，不难发现很多这种类型的“打工人”已不再被需要。他们做的所有工作 AI 都可以完成，且价格可以更便宜，效率更高。这部分群体注定会成为“无用”之人。
- name: 阶层跃升=搭上历史进程定理
  desc: 普通人实现阶层跃升的核心路径不是在现有模式内卷，而是识别并抢占‘新稀缺社会资源’的诞生窗口期（攻擂者策略），完成对旧利益格局的‘新陈代谢’。当前AI初期即此类最佳历史机遇。
  excerpt:
  - 而搭上“历史的进程”，往往才是普通人改变命运，实现阶层跃升的关键。
  - 抢占掌握新稀缺资源的普通人将会崛起，而随着旧稀缺资源的湮灭，一批既得利益集团也将会跌落。
- name: 庄家统治稳定性悖论
  desc: 制定规则者（庄家）的长期统治依赖于‘提供价值秩序’与‘抽取剩余’的动态平衡。若仅抽取不迭代价值，必引发‘联合掀桌’或‘创新者抢庄’；反垄断本质是引入外部威胁倒逼庄家持续创新。
  excerpt:
  - “坐庄”能够稳稳收割所有牌桌上玩家的背后，是它也在向所有玩家“提供一定的价值和秩序”。否则，这个“庄”一定坐不住...
  - 从这个角度讲，这也是为什么要一定程度“反垄断”：因为“反垄断”意味着到处都有潜在的准备“抢庄家”的“创新者”...
- name: 财富即权势即拿捏定理
  desc: 财富本质是权力的货币化表现。权力的内核是‘拿捏’——通过提供价值建立依赖（得利）、通过绑定/生态构建形成转换成本（损害/得利），实现对他人劳动剩余的持续定向提取。此心法通用于商业、社交、情感。
  excerpt:
  - 不难看出财富的本质可以浓缩成两个字：“拿捏”。...从这里，我们可以更深刻地理解马克思的那句话——财富是权势。因为权势的本质，同样是“拿捏”。
  - 而此种心法，则不仅仅是在“财富”领域，在人际和情感领域都可以广泛复用。因为这种心法的实质，是在教你如何获得权力。
findings:
- name: K12政策预判案例
  desc: '[evidence] 作者于2018年底撰写报告预判K12行业将遭政策重击，助老板规避千万级投资损失，验证其‘宏观趋势判断与底层逻辑分析’方法论的有效性。'
  excerpt:
  - 2018 年底我写过一篇“K12 教育行业必将遭受政策铁锤，建议避开投资”的报告，给当时的老板避免了千万起步的损失
- name: 黄金白银投资预判案例
  desc: '[evidence] 作者于2023年2月中下旬预判黄金白银历史性投资机会，付费文章帮助客户实现7位数收益，再次验证其大趋势预判能力。'
  excerpt:
  - 今年 2 月中下旬我预判了这轮黄金和白银投资的历史性机会，写的付费文章帮助客户赚到了 7 位数的收益
- name: 房地产作为旧稀缺资源的逻辑失效
  desc: '[claim] 作者宣称房地产（北上广深核心资产）作为上个时代稀缺资源的逻辑已在当下产生破坏，但文中未展开论证具体破坏机制（如人口红利消失、供给端松绑、租售比倒挂等），留作读者推导与后续讨论。'
  excerpt:
  - 当然，房子作为“稀缺资源”的逻辑是上个时代的逻辑，在现如今已经产生了破坏。读者朋友们可以尝试按照丙丙给的框架去推导，到底是哪里被破坏了...
- name: 流量/注意力稀缺性实证
  desc: '[evidence] 以微信焦虑小红书、大V守护流量护城河、互联网巨头争夺用户24小时注意力为现象，佐证‘流量/注意力’符合‘稀’（总量固定）与‘缺’（生产消费必需）双重属性，已成为核心稀缺社会资源。'
  excerpt:
  - 流量的本质是人们的注意力，而人们的注意力是有限的。14 亿人的一天只有 24 小时，要被微信、抖音、小红书、知乎、淘宝等 APP 来刮分，所以互联网巨头都那么焦虑。
  - 许多自媒体大 V，非常清楚自己的“护城河”、也就是掌握“财富”的本质——其实是把握自己的“流量”。
- name: 人脉稀缺性的信任成本解释
  desc: '[evidence] 引用作者前作逻辑，揭示优质人脉‘稀’的深层原因：金字塔顶层人物信任成本极高，导致优质连接极难建立与复制，强化了人脉资源的稀缺性与价值。'
  excerpt:
  - 另一个优质人脉“稀缺”的原因...那就是越是金字塔上方的人物，信任成本会越高，这同时增加了优质人脉掌握者的“稀”和“缺”的权重。
- name: 股权分身/矩阵号守擂实证
  desc: '[evidence] 揭示头部自媒体/MCN通过批量注册公司账号、雇佣写手、导流变现的‘股权分身’实操手法，验证守擂者利用产权制度放大个人杠杆、最大化资源榨取、筑高护城河的路径。'
  excerpt:
  - 个人的精力有限，但是有“产权”的保障手段，就可以通过“股权”的方式制造自己的“分身”：比如说批量注册几十几百个公司和账号，招聘写手做内容，自己给这些矩阵账号导流...
- name: 互联网大V颠覆传统媒体案例
  desc: '[evidence] 以互联网大V抢占‘流量’新稀缺资源，取代报刊亭/书城‘物理分发渠道’旧稀缺资源，完成新陈代谢，实证‘攻擂者搭历史进程’理论。'
  excerpt:
  - 比如说，互联网大 V 的崛起对传统报刊纸媒的“革命”，就是大 V 们抢占了新的稀缺社会资源——互联网流量；代替了旧的稀缺社会资源——书城、报刊亭等等。
- name: 平台/考试/游戏坐庄实证
  desc: '[evidence] 列举微信/小红书/抖音平台生态、CFA考试资格把控、网络游戏规则制定等多元场景，验证‘制定规则/建生态’模式具有普适性、高杠杆、赢家通吃特征，且微信无竞品印证生态护城河之深。'
  excerpt:
  - 现实中，这个模式的玩法是很多的。小到网络游戏...再比如说像 CFA 这样的金融资格考试...再比如说所有的互联网平台，微信、小红书、抖音等等...比如说微信作为通讯工具，根本没有竞争对手。
- name: 苹果生态绑定与苹果税案例
  desc: '[evidence] 以苹果通过硬件体验（提供价值）+ 封闭OS生态（完成绑定）锁定30%高净值用户持续缴纳‘苹果税’，完美演示‘拿捏’心法在商业落地中的标准闭环：价值->绑定->提取剩余。'
  excerpt:
  - 例如苹果通过一款丝滑的手机，给予消费者价值，然后通过独特的操作系统完成绑定，让全世界 30%的消费者离不开它，于是便只能给苹果不断上缴“苹果税”。
