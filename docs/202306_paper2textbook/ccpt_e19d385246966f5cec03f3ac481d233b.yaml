paper: docs/202306/20230627_129.md
desc: 本素材为一篇CPS（Cost Per Sale）私域变现实战复盘文章，记录了资深从业者老严与工具商黄海关于7大私域CPS项目的深度对谈。内容涵盖本地生活、卡券采买、CPA、运营商业务、快递CPS、霸王餐、电商CPS（含抖客）等项目的底层供应链逻辑、推广玩法、定价策略、风控痛点及变现模型，核心揭示了“超级单品做钩子、多业务组合变现、自有小程序承接闭环”的私域CPS体系化打法，并强调了“实质性业务”对小程序存活的关键作用。
concepts:
- name: 私域CPS多重变现体系
  desc: 指在单一私域流量池（微信群/小程序）内，通过组合本地生活、快递、电话卡、电商等多条CPS业务线，实现用户全生命周期价值最大化的运营模式。
  is_original: true
  excerpt:
  - 老严=做 CPS 项目+做自媒体 黄海=做 CPS 项目+做工具商
  - '这套系统可以都必须依赖微信服务号才可以运营吧？ 老严干货 CPS : 不需要服务号，这是小程序服务用户'
  - 私域里的 cps 玩法很多，无论用来引流还是变现都比较适合，总之用户实惠，商家获利，我们也赚钱
- name: 超级单品钩子策略
  desc: 利用极高性价比的标品（如3.66元5元代金券、几块钱瑞幸咖啡）作为低成本获客诱饵，引流至私域后通过高客单价、高复购业务（如快递、电话卡、本地生活常规单）回本盈利。
  is_original: true
  excerpt:
  - 群里时不时发一些超级爆款：什么几块钱一杯的瑞鑫咖啡、折扣力度很高的麦当劳肯德基早餐下午茶套餐……用户最终下单是通过小程序。
  - 市面上 1 个粉大概 4~5 块，如果每张卡券我亏 2 元引来 1 个粉，那还是很赚的。如果单纯卖这些标品，复购率太低，利润率低，赚不到什么钱，所以这类产品最适合当做钩子来引流。
  - 我看到很多人利用超级单品优惠当钩子、利用底价外卖卡券当钩子，单个粉丝引流裂变成本 2 元左右
- name: 小程序实质性业务判定标准
  desc: 微信小程序审核的核心生存法则：用户必须在小程序内完成‘下单-支付-消费’闭环（如电影票、快递寄件），而非仅跳转外链或复制口令至外部APP，前者为‘有实质性业务’可存活，后者极易被封禁。
  is_original: true
  excerpt:
  - 小程序是否被封，取决于有没有实质性业务，那啥叫【实质性业务】？
  - 如果用户只是在这个小程序跳转链接就到了其它地方，或者只是复制一个口令，然后就转到其它 APP，那这就属于【没有实质性业务】。
  - 如果用户在这个小程序下单付费，最后完成消费闭环，像电影票、快递等，那就是【有实质性业务】。
- name: 美团CPS单品高佣模式
  desc: 区别于传统‘领券+6%佣金’模式，美团内部开放特定单品（如拼好饭、买药、霸王餐）的高佣金推广权限，允许推广者直接在小程序内完成交易闭环，获取远超常规佣金的收益。
  is_original: false
  excerpt:
  - 大家以前听过的美团 CPS，可能只知道那种【用户领平台外卖券+6%佣金】这种模式，其实美团内部开发了很多品类的 CPS 业务。
  - 也只有美团饿了么有这么大实力整合这些资源，就是因为母亲啊出现了单品高佣模式，我们自己的用户群都在发这些超级单品。
  - 美团拼好饭带 1 个下单新客 7 元、美团买药客户拉新也有钱
- name: 快递CPS上门取件差价结算机制
  desc: 用户预付估算运费（如1kg 8元），实际称重超重时系统自动触发补款流程，拒不补款者录入行业黑名单限制后续使用；退单率约30%但成功用户复购率极高。
  is_original: true
  excerpt:
  - 用户先付费下单以后，实际称重大于客户填的 1kg，那这笔差价怎样让客户补？ 一般如果有差价，系统就会提示用户补，然后客服也会提醒，最后如果对方还是不愿意补，那可能会被拉入圈内的全网黑名单
  - 退单率大概 30%左右... 不过一旦一个用户下单成功以后，复购率相当高，很恐怖。
- name: 运营商电话卡推广合规周期
  desc: 电话卡推广受通管局稽核周期性影响（移动/联通/电信轮流下架），结算链路长（到货->激活->实名->首充->多级审核），存在跨月核算延迟结算现象，但单张卡激活返佣高达100-150元。
  is_original: false
  excerpt:
  - 因为通讯管理部门经常会进行稽核，你看最近市面上只有电信卡，就是移动和联通那边在稽核，所以这两家运营商的卡目前全部下架，过一两个月，就会再重新上架。
  - 我们这边虽然把卡卖出去了，到那时运营商那边有 10 几个审查节点，等全部审核完以后才能结算... 有些 4 月 15 号以后激活的订单，他们内部会核算到 5
    月份激活，然后 6 月份给钱。
- name: 抖客无货源套利模式
  desc: 利用抖音精选联盟商品佣金（如30%）与拼多多低价差（如抖音卖10元，拼多多进货9元）进行套利：用户在拼多多下单9元 -> 推广者代拍抖音10元商品
    -> 赚取3元佣金减去1元差价 = 净赚2元，但需垫资承担资金压力。
  is_original: true
  excerpt:
  - b、无货源店群模式：例如商品在抖音卖 10 元，商家开 30%佣金，那有人就把这个品商家到拼多多，卖 9 元，用户下单以后，这个人就去抖音代拍 10 元的品，拿
    3 块佣金，最终这单赚 2 元，但是这个模式对资金有很大要求。
methods:
- name: __overview__
  desc: 私域CPS项目筛选与组合拳打法：① 识别平台红利期高佣业务（美团单品高佣、运营商拉新、霸王餐测试期）；② 引入‘超级单品’作为破损引流钩子；③ 自建小程序承接‘实质性业务’闭环规避封禁；④
    组合高频刚需（快递、外卖）与高客单价（电话卡、电商）业务实现LTV最大化。
  excerpt:
  - 一般采取“发爆款+培养用户自主下单习惯”的组合拳。
  - 大家可以组合配置一些业务，所以如何处理这个问题，最终还是靠大家自己设置。
  - 我看到很多人利用超级单品优惠当钩子、利用底价外卖卡券当钩子，单个粉丝引流裂变成本 2 元左右，但是这个量就不像投流那样容易扩，可能每天几十个几百个，不过很快就回本。
- name: 本地生活推广组合拳
  desc: ‘发爆款（超级单品）+ 培养自主下单习惯’双轨制：定期在群内推送极致性价比单品建立信任 -> 用户形成肌肉记忆 -> 下次有需求主动打开小程序搜索下单（支持堂食核销码/外卖配送），实现从运营驱动向用户驱动转化。
  excerpt:
  - 一般采取“发爆款+培养用户自主下单习惯”的组合拳。群里时不时发一些超级爆款... 用户最终下单是通过小程序。
  - 一旦客户知道这个小程序能优惠下单，用户养成习惯以后，下回他自己想买优惠购买线下大牌美食，就会自己跑到小程序完成下单过程。
- name: 卡券采买定价与税务套利模型
  desc: 大批量拿货（百万张级）获取底价优势 -> 后台灵活配价（加固定费/加百分比） -> 前端低价/亏本售卖作为引流钩子 -> 通过税票合规抵扣、平台完成量返点实现隐性利润空间，单张利润极薄但规模效应显著。
  excerpt:
  - 跟平台方拿这么大量券的人，除了微薄的差价，还可以通过税票来赚钱，另外有些单品完成量以后，平台还有返点。
  - 这个价格是我们在后台去设置的，你可以加一个百分比，也可以加固定多少钱，比较灵活。
  - 我认识的老板每年做这块的业绩都是以亿为单位计算的，但利润只有千分之几。
- name: 快递CPS区域底价加价运营模型
  desc: 对接整合商获取区域化底价体系 -> 后台设置统一加价规则（如底价6元售价8元） -> 用户端小程序下单支付 -> 上门取件履约 -> 实重超重触发补款/黑名单机制
    -> 依赖高复购特性覆盖30%退单率成本。
  excerpt:
  - 在后台，底价基础上做价格浮动，增加固定价格或者增加百分比，实际上就是赚差价，6 块底价，卖 8 块，赚 2 块。
  - 底价是一套行业内的价格体系，比较复杂，主要是按区域分的。
  - 退单率大概 30%左右... 不过一旦一个用户下单成功以后，复购率相当高，很恐怖。
- name: 霸王餐地推裂变获客法
  desc: 针对美团霸王餐仅限特定城市（如广州）测试的特性，采用‘办公楼外卖收取点摆摊 -> 进群送小礼品 -> 沉淀同楼宇高精准同城粉’的低成本地推模式，单粉成本低且用户画像高度统一，便于后续高转化推广。
  excerpt:
  - 最好的办法就是在办公楼下面的外卖收取点，摆个摊，进群送东西，这个最实在，单粉成本也低，而且群用户都是同一栋楼的。
- name: 抖客1元购薅羊毛与无货源套利双轨玩法
  desc: 轨道A（1元购）：对接商家跑量需求，组织羊毛党1元购获取平台补贴；轨道B（无货源套利）：搬运抖音高佣商品至拼多多低价出单 -> 反向代拍赚佣金差价，需解决垫资周转与售后风控。
  excerpt:
  - a、1 元购模式：通过抖音直播间帮商家跑量，1 元购之类，跑完以后平台给补贴，大部分是薅羊毛的人。
  - b、无货源店群模式：例如商品在抖音卖 10 元，商家开 30%佣金，那有人就把这个品商家到拼多多，卖 9 元，用户下单以后，这个人就去抖音代拍 10 元的品，拿
    3 块佣金，最终这单赚 2 元，但是这个模式对资金有很大要求。
theorems:
- name: 私域CPS生存核心定律：闭环即正义
  desc: 在微信生态下，私域CPS小程序的生死线不在于业务品类，而在于是否构建了‘用户支付-平台分账-服务履约’的实质性消费闭环。纯导流（跳转/口令）必死，自有交易闭环可生。
  excerpt:
  - 小程序是否被封，取决于有没有实质性业务... 如果用户在这个小程序下单付费，最后完成消费闭环，像电影票、快递等，那就是【有实质性业务】。
  - 如果用户只是在这个小程序跳转链接就到了其它地方，或者只是复制一个口令，然后就转到其它 APP，那这就属于【没有实质性业务】。
- name: 超级单品亏本引流正向ROI公式
  desc: 单张卡券亏损成本 < 行业平均获客成本（4-5元/粉）时，即可实现引流正向ROI。例如：亏2元/张卖券引流1粉，远低于市场价4-5元，后端多业务变现覆盖前端亏损。
  excerpt:
  - 市面上 1 个粉大概 4~5 块，如果每张卡券我亏 2 元引来 1 个粉，那还是很赚的。
  - 如果单纯卖这些标品，复购率太低，利润率低，赚不到什么钱，所以这类产品最适合当做钩子来引流。
- name: 平台红利窗口期先发制人定律
  desc: 平台新业务（如美团霸王餐、运营商拉新、抖客早期）处于测试/红利期时，佣金最高、竞争最小、风控最松；拥有资源（本地粉/技术/渠道）的先行者可实现‘倾家荡产投流’级别的超额收益，窗口关闭后边际收益急剧递减。
  excerpt:
  - 美团霸王餐只开放了广州在测试，佣金有 61%，比较高... 目前只适合有广州本地粉的老板来做这块。
  - 我有一个朋友是运营商副总，他说一旦运营商出推广业务了，很多人倾家荡产去投流，抓住这波机会去赚钱，很香的。
  - 抖音商家放在精选联盟的价格没有优势，目前最低价都在大主播手上
- name: 高频刚需业务是私域留存与变现的锚点
  desc: 快递寄件（退货刚需）、本地生活外卖（高频餐饮）等业务具备极高复购率和用户粘性，是私域池留存用户、支撑‘超级单品’引流亏损、实现长期复利变现的核心锚点业务。
  excerpt:
  - 最主要的场景是客户退货... 一旦一个用户下单成功以后，复购率相当高，很恐怖。
  - 用户养成习惯以后，下回他自己想买优惠购买线下大牌美食，就会自己跑到小程序完成下单过程。
findings:
- name: 美团CPS业务形态全景图
  desc: '[evidence] 素材实测数据支撑：美团CPS已演变为包含‘外卖券(6%)、单品高佣(拼好饭/买药/霸王餐61%)、到店堂食核销’的多元化矩阵，而非单一导券模式。'
  excerpt:
  - 美团拼好饭带 1 个下单新客 7 元、美团买药客户拉新也有钱
  - 美团霸王餐只开放了广州在测试，佣金有 61%
  - 用户下单以后，一般是外卖还是到店堂食？... 下单后会有一个编码，到店后凭编码直接领取就好。
- name: 快递CPS市场规模与退单实测数据
  desc: '[evidence] 从业者实测数据：日单量几十万单且增长中；退单率约30%（主要因偏远地区拒收）；但成功用户复购率‘恐怖’级高；差价补款依赖系统提醒+客服干预+行业黑名单威慑三重保障。'
  excerpt:
  - 根据我了解，目前市面上每天大概几十万单，而且还在不停增长。
  - 退单率大概 30%左右... 不过一旦一个用户下单成功以后，复购率相当高，很恐怖。
  - 一般如果有差价，系统就会提示用户补，然后客服也会提醒，最后如果对方还是不愿意补，那可能会被拉入圈内的全网黑名单
- name: 运营商CPA结算周期长尾痛点实测
  desc: '[evidence] 实操痛点确证：结算链路含10+审核节点（到货/激活/实名/首充），基层统计依赖人工导致效率低；存在跨月核算规则（4月中激活算5月，6月给钱）；国美‘真快乐’CPA坑款案例印证中小平台结算违约风险极高。'
  excerpt:
  - 运营商那边有 10 几个审查节点，等全部审核完以后才能结算... 很多小县城甚至靠人工去统计，他们效率低，最终导致结算有点慢。
  - 有些 4 月 15 号以后激活的订单，他们内部会核算到 5 月份激活，然后 6 月份给钱。
  - 之前被国美的【真快乐】坑了，CPA 的钱至今都没有结算，搞的大家都拿不到钱，打官司都没用
- name: 私域引流成本实测基准
  desc: '[evidence] 实操数据基准：利用超级单品/底价卡券裂变引流，单粉成本约2元/人，日增量级几十至几百人（非投流可规模化扩量），但回本周期极快（‘很快就回本’）。'
  excerpt:
  - 我看到很多人利用超级单品优惠当钩子、利用底价外卖卡券当钩子，单个粉丝引流裂变成本 2 元左右，但是这个量就不像投流那样容易扩，可能每天几十个几百个，不过很快就回本。
- name: 抖客私域转化路径断层实测
  desc: '[claim] 从业者经验总结：抖音兴趣电商属性导致用户无‘搜索下单’习惯，私域社群/返利模式失效；精选联盟价格无优势（大主播垄断低价），商家无亏本换量动力（无淘宝式站内流量回血机制），导致抖客私域常规推广模式跑不通。'
  excerpt:
  - 可能因为是消费者习惯，用户在淘宝购物是有固定意向，但是抖音这边主要是兴趣电商，就是看到某个视频了顺手去购买下单。
  - 也可能是抖音商家放在精选联盟的价格没有优势，目前最低价都在大主播手上，商家不可能通过精选联盟走亏本模式，因为亏了以后赚不回来，不像淘宝这边...
