paper: docs/202306/20230627_083.md
desc: 该素材记录了作者小武武在生财有术21天海外工具站航海活动中，利用ChatGPT辅助、Go语言开发的一款「知识星球风向标企业微信通知工具」的完整过程。文章详述了开发动机（解决上班族错过优质内容痛点）、技术选型路径（从公众号转向企业微信机器人，选Go跨平台）、核心功能迭代（定时推送->分类推送->GPT总结）、部署门槛及开源地址，并附带社区反馈与技术支持细节，展示了一个独立开发者从0到1解决自身需求并开源分享的典型案例。
concepts:
- name: 知识星球风向标通知工具
  desc: 一个自动化爬取知识星球指定圈子（生财有术）内‘风向标’精华帖子，并通过企业微信群机器人实时推送至个人微信的开源小工具，旨在解决用户因时间碎片化导致的优质信息遗漏问题。
  is_original: true
  excerpt:
  - 做一个实时推送的群聊机器人，将生财每天的风向标帖子推送到个人微信
  - 平常上班时间忙，然后下班到家去翻历史内容，总感觉好像错过了几个亿似的，主要还是太懒，懒才能推动工具进步
- name: 航海
  desc: 生财有术社区特有的组织形式，指在教练带领下，参与者在固定周期（如21天）内专注完成特定项目（如海外工具站建设）的实战训练营活动。
  is_original: false
  excerpt:
  - 本次参加了 chatgpt+海外工具站航海
  - 经历了 21 天的航海
methods:
- name: __overview__
  desc: 采用‘需求驱动 -> 技术调研 -> 方案迭代 -> AI辅助编码 -> 跨平台部署 -> 社区开源’的完整独立开发闭环方法论。核心在于利用ChatGPT处理繁琐数据转换，Go语言解决跨平台分发，企业微信API实现低门槛触达。
  excerpt:
  - 1.调研了知识星球网站 api 爬取相对简单，传入 cookie 就能获取自己所加入星球的信息
  - 2.机器人最初选择考虑微信公众号推送，但是只有订阅号才有这功能，而且需要企业认证，暂时放弃，目前考虑企业微信的机器
  - 3.实现一个简单的初版，有定时消息推送，然后考虑按分类信息推送，最后考虑订阅信息和加入 gpt 总结功能
  - 4.语言选择了可以跨平台编译的 go 语言，做出的小工具可以在 windows 和 linux 都能支持
  - 5.chatgpt 作为辅助指导，实现了一些自己觉得麻烦且无聊的数据转换功能，chatgpt 辅助写代码真的很香
- name: 知识星球Cookie认证爬取
  desc: 通过提交用户Cookie直接调用知识星球内部API，获取已加入星球的帖子列表与详情，绕过复杂登录流程，实现低成本数据获取。
  excerpt:
  - 调研了知识星球网站 api 爬取相对简单，传入 cookie 就能获取自己所加入星球的信息
- name: 企业微信群机器人推送
  desc: 利用企业微信‘群机器人’Webhook机制，将抓取内容推送至内部群聊，再经企业微信客户端同步至个人微信，规避了个人号防封风险及公众号认证门槛。
  excerpt:
  - 机器人最初选择考虑微信公众号推送，但是只有订阅号才有这功能，而且需要企业认证，暂时放弃，目前考虑企业微信的机器
- name: ChatGPT辅助编码（数据转换）
  desc: 将结构化数据清洗、格式转换、正则表达式编写等重复性高、逻辑简单但耗时的编码任务外包给ChatGPT，人工专注于架构与业务逻辑。
  excerpt:
  - chatgpt 作为辅助指导，实现了一些自己觉得麻烦且无聊的数据转换功能，chatgpt 辅助写代码真的很香
theorems:
- name: 懒惰驱动工具进化论
  desc: 个人痛点（懒/忙导致信息焦虑）是驱动自动化工具诞生的核心动力；解决自身最迫切需求的工具，最具生命力和传播潜力。
  excerpt:
  - 为什么要做这个小工具呢？平常上班时间忙，然后下班到家去翻历史内容，总感觉好像错过了几个亿似的，主要还是太懒，懒才能推动工具进步。
- name: 最小可行性产品（MVP）迭代策略
  desc: 工具开发应遵循‘核心功能跑通 -> 分类/筛选增强 -> 智能化总结’的分阶段迭代路径，而非追求一步到位的完美架构。
  excerpt:
  - 实现一个简单的初版，有定时消息推送，然后考虑按分类信息推送，最后考虑订阅信息和加入 gpt 总结功能
- name: 技术选型‘降维打击’原则
  desc: 面对推送渠道选择时，优先选取门槛最低、到达率最高、跨平台支持最好的方案（企业微信 > 公众号 > 个人号），利用Go语言跨平台特性消除运维环境差异。
  excerpt:
  - 机器人最初选择考虑微信公众号推送，但是只有订阅号才有这功能，而且需要企业认证，暂时放弃，目前考虑企业微信的机器
  - 语言选择了可以跨平台编译的 go 语言，做出的小工具可以在 windows 和 linux 都能支持
findings:
- name: 工具可用性验证与部署坑点
  desc: '[evidence] 作者在评论区提供的技术支持细节表明：工具已跑通核心流程，但部署存在门槛（需Shell基础、配置Cookie/Key、区分内部群与客户群、Cron表达式调试），属于典型‘开发者友好、小白劝退’的早期开源工具特征。'
  excerpt:
  - 工具还有很多不足之处，上手可能有一点点难度，需要简单了解一点 shell 命令，去部署它。
  - 需要检查几个点 1.config.ini 文件中的 cookie 和企业微信的 key 是否填写正确 2.测试时候 调小定时频率 如每隔 3s 执行一次 cronTab
    = @every 3s  3.确认企业微信的群里为内部群而非客户群 4.检查一下企业微信是否有消息
- name: 社区需求延伸：飞书版本与风向标价值定义
  desc: '[claim] 评论区用户明确提出飞书版本需求，作者承诺迭代；[evidence] 用户‘胖大魔’对‘风向标’的业务定义（模型异常值->个人价值->中标->精华）揭示了该工具核心数据源的高商业价值属性，验证了工具‘高信噪比’的定位准确性。'
  excerpt:
  - '陳逸陽 : 有飞书版本就好了[呲牙] 小武武 : 有需求就会迭代'
  - '胖大魔 : 风向标相当于是模型 异常值—对自己的价值—中标—精华'
