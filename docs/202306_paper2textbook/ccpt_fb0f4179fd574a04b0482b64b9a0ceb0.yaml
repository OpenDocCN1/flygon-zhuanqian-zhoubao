paper: docs/202306/20230627_024.md
desc: 该素材基于赵鼎新先生的社会学方法论论文，将其核心思想迁移应用于 AI 提示工程领域，系统性地提出了“向 AI 提出好问题的六重境界”框架。这六重境界由浅入深，分别为：交代要透彻（语境完备化）、对照实验（比较分析法）、综合考虑更多可能性（多因果假设生成）、Stay
  Hungry Stay Foolish（隐含假设批判与开放心态）、问题有深度（反向筛选低价值问题）、案例有分量（关键案例选择策略），旨在指导用户从模糊提问进阶为具有社会学洞察力的高质量提示词工程实践。
concepts:
- name: AI提问六重境界
  desc: 素材核心框架，将社会学经典研究方法论（赵鼎新论文）迁移重构为面向大语言模型的提示词工程分级标准，包含语境构建、比较分析、多因果推理、假设批判、问题筛选、案例选择六个递进层级。
  is_original: true
  excerpt:
  - 今天，从「浙大社会学系系主任」赵鼎新老师的一篇论文里，找到「向 AI 提出好问题」的六重境界（6 个方法）。
  - 【第一重境界】交代要透彻 ... 【第二重境界】“对照实验” ... 【第三重境界】综合考虑更多可能性 ... 【第四重境界】Stay Hungry Stay
    Foolish ... 【第五重境界】问题有深度 ... 【第六重境界】案例有分量
- name: 语境完备化
  desc: 第一重境界的核心概念，指提问时必须提供明确上下文、具体要求、详细描述及相关知识，消除歧义，为模型推理奠定信息基础。
  is_original: false
  excerpt:
  - 提问时，要尽可能提供详细和具体的信息，以帮助 AI 更好地理解你的问题，并给出更准确的答案。
  - 1. 明确的上下文... 2. 具体的要求... 3. 详细的描述... 4. 相关的知识...
- name: 提示词对照实验法
  desc: 第二重境界核心概念，借用自然科学实验逻辑，主张在提问中明确比较维度与测量标准，通过结构化对比（如张一鸣高考志愿案）筛选最优解。
  is_original: true
  excerpt:
  - 就像做对照实验一样，每一次改变其中的某一个重要的因素，从而研究被改变的这个因素对事物的影响
  - 提问时，应明确指出你关注的是哪些差异，并给出合适的测量方法。
  - 他列出了五个参考维度：下雪、靠海、离家远、综合性大学、大城市。经过一个维度一个维度的比较和筛选...
- name: 多因果假设生成
  desc: 第三重境界核心概念，指针对同一现象（如专业就业率高）主动构建多个竞争性解释假设（机会结构、毕业生行为差异、资源利用差异），避免单一归因谬误。
  is_original: true
  excerpt:
  - 除了这个表面的原因外，其实你还有必要思考更多可能性。
  - 某些专业的就业率可能高是因为这些专业的学生更有可能在毕业后立即寻找工作... 或者...更有可能利用学校的校友网络...
- name: 隐含假设批判
  desc: 第四重境界核心概念，指识别并质疑提问中预设的、未经验证的前提假设（如‘专业决定薪酬’），保持‘婴儿般的好奇’与开放心态，防止确证偏误。
  is_original: true
  excerpt:
  - 这个问题中的隐含假设可能是'选择的专业直接决定了工作的薪酬'。然而，这个自以为是的假设，可能并不总是成立...
  - 这就要求我们在提问时，尽量避免先入为主地包含那些可能不成立的隐含假设。保持开放，保持婴儿般的好奇。
- name: 反向问题筛选法
  desc: 第五重境界核心概念，主张通过排除‘答案太明显’（常识性/可搜索性）与‘问题过于发散’（边界模糊/无限解空间）两类低质量问题，反向定位高价值探索性问题。
  is_original: true
  excerpt:
  - 我们很难凭空提出「有深度、具体明确、有探索价值的问题」。但我们可以比较容易地反着来，去避免没有深度、不具体明确和没有探索价值的问题。
  - 1、答案是否太明显... 2、问题是否过于发散...
- name: 关键案例选择策略
  desc: 第六重境界核心概念，指选择具有‘经验重要性’（现实痛点/极端情况）或‘理论重要性’（验证/推演机制、连接理论与实践）的案例作为提问锚点，提升问题穿透力。
  is_original: true
  excerpt:
  - 好的案例，可以将抽象的问题具体化... 提供实证支持... 引发深入思考... 连接理论和实践
  - 1、经验上的重要性... 2、理论上的重要性...
methods:
- name: __overview__
  desc: 社会学方法论向提示词工程的迁移重构法：选取经典社会学研究标准（赵鼎新《什么样的问题才是好的研究问题》）-> 抽象核心逻辑（语境、比较、多因果、反思、筛选、案例）->
    映射为 LLM 交互操作规范（Prompt Pattern）-> 以通俗案例（高考志愿、专业选择）演示落地。
  excerpt:
  - 今天，从「浙大社会学系系主任」赵鼎新老师的一篇论文里，找到「向 AI 提出好问题」的六重境界（6 个方法）。
  - 论文 pdf 官网链接如下... 20210917064949WU_FILE_0.pdf
- name: 结构化语境注入法
  desc: 第一重境界操作化方法，通过填充四大要素模板构建高密度上下文：背景情境、任务指令、场景细节、领域知识库。
  excerpt:
  - 1. 明确的上下文：提供问题的背景信息... 2. 具体的要求：明确指出你希望 AI 做什么... 3. 详细的描述... 4. 相关的知识...
- name: 维度化比较分析法
  desc: 第二重境界操作化方法，将决策/分析问题拆解为若干正交评价维度，逐维度打分/筛选，聚合得出最优解，支持引入 SWOT 等经典模型作为维度来源。
  excerpt:
  - 提问时，应明确指出你关注的是哪些差异，并给出合适的测量方法。
  - 比较的维度，可以来自喜好，也可以来自 SWOT 等的经典模型。有了清晰的标准和全面的衡量，好的答案就不远了。
- name: 竞争性假设列举法
  desc: 第三重境界操作化方法，针对目标现象，强制生成 3 个以上机制迥异的解释假设（结构性/行为性/资源性等），提示模型并行评估各假设权重。
  excerpt:
  - 你的主要假设可能是... 除了这个表面的原因外，其实你还有必要思考更多可能性。
  - 例如... 学生更有可能在毕业后立即寻找工作... 更有可能利用学校的职业发展中心... 更有可能利用学校的校友网络
- name: 预设前提显性化与反证法
  desc: 第四重境界操作化方法，步骤：1. 提取提问中的隐含前提；2. 标记‘自以为是’标签；3. 罗列反面证据或边界条件；4. 重构为开放性探究式提问。
  excerpt:
  - 这个问题中的隐含假设可能是'选择的专业直接决定了工作的薪酬'。然而... 可能并不总是成立...
  - 尽量避免先入为主地包含那些可能不成立的隐含假设。保持开放，保持婴儿般的好奇。
- name: 负向问题诊断清单
  desc: 第五重境界操作化方法，提问前自查两项指标：① 常识性检验（百度/谷歌可秒得答案则废弃）；② 发散度检验（预想答案空间是否过大、边界是否模糊），若通过则进入深度探索模式。
  excerpt:
  - 看看答案是否太明显，或者问题是否过于发散，就知道了。
  - 1、答案是否太明显... 如果简单百度/谷歌一下就能得到答案... 2、问题是否过于发散... 可能会有无数种答案。
- name: 双重重要性案例定标法
  desc: 第六重境界操作化方法，案例库筛选双标准：经验重要性（极端案例、典型案例、关键案例）与 理论重要性（异常案例、最似/最异案例、机制验证案例），将案例嵌入
    Prompt 作为 Few-shot 锚点或推理支架。
  excerpt:
  - 选择问题的案例时，应该选择那些在经验或者理论上具有重要性的案例。
  - 1、经验上的重要性... 严重受到污染的地区... 2、理论上的重要性... 经济发展快速但环境问题严重的地区...
theorems:
- name: 提问质量决定回答上限定律
  desc: 核心主张：深刻的问题源于严谨的思维方法，而非灵感迸发；AI 的回答质量与提问中蕴含的社会学研究质量（语境厚度、比较严谨性、理论深度）高度正相关。
  excerpt:
  - 我们都知道，对于 Al，提问很重要。深刻的问题，才有深刻的答案。但很少有人知道，深刻的问题从何而来？
- name: 社会学想象力迁移假说
  desc: 核心主张：经典社会学研究问题的评判标准（赵鼎新体系）可无损迁移为大语言模型的高阶提示词工程范式，实现从‘会问问题’到‘会做社会学式研究’的跃迁。
  excerpt:
  - 今天，从「浙大社会学系系主任」赵鼎新老师的一篇论文里，找到「向 AI 提出好问题」的六重境界（6 个方法）。
- name: 反向筛选优于正向构建原理
  desc: 核心主张：直接构建‘好问题’认知负荷极高，但识别‘坏问题’（明显、发散）门槛极低；通过负向清单剪枝，是获取高质量探索性问题的最优路径。
  excerpt:
  - 我们很难凭空提出「有深度、具体明确、有探索价值的问题」。但我们可以比较容易地反着来，去避免没有深度、不具体明确和没有探索价值的问题。
- name: 案例即理论支架论
  desc: 核心主张：高质量案例非单纯素材，而是连接抽象问题与具体机制的‘理论支架’；案例选择的经验/理论双重重要性，直接决定提问能否触达因果机制层面。
  excerpt:
  - 好的案例，可以将抽象的问题具体化... 提供实证支持... 引发深入思考... 甚至可以连接理论和实践，帮助我们理解理论在实际中的应用。
findings:
- name: 张一鸣高考志愿决策案例
  desc: '[evidence] 素材引用张一鸣高考填报志愿实例，展示‘维度化比较分析法’的实操过程：设定 5 个偏好维度 -> 逐维度筛选 -> 唯一锁定南开大学。证明结构化对比能将模糊偏好转化为确定性决策。'
  excerpt:
  - 举个张一鸣高考填报志愿的例子，他列出了五个参考维度：下雪、靠海、离家远、综合性大学、大城市。经过一个维度一个维度的比较和筛选，最终发现满足这些维度的学校，只有一所，那就是位于天津的南开大学。
- name: 专业就业率多因果解释验证
  desc: '[evidence] 素材以‘专业就业率高’为现象，实证演示‘多因果假设生成’：除主流‘市场需求’假设外，补充‘毕业生即时就业倾向’、‘职业中心利用率’、‘校友网络激活度’三个竞争性假设。验证了单一归因的局限性。'
  excerpt:
  - 你的主要假设可能是：某些专业...就业率高，是因为这些领域的工作机会多... 除了这个表面的原因外，其实你还有必要思考更多可能性。例如...学生更有可能在毕业后立即寻找工作...更有可能利用学校的职业发展中心...更有可能利用学校的校友网络
- name: 专业决定薪酬隐含假设反证
  desc: '[evidence] 素材以‘选专业定薪酬’为反面教材，实证演示‘隐含假设批判’：揭示该假设忽略个人技能、经验、地理位置等调节变量，证明未经审视的预设会导致提问陷入伪问题陷阱。'
  excerpt:
  - 这个问题中的隐含假设可能是'选择的专业直接决定了工作的薪酬'。然而，这个自以为是的假设，可能并不总是成立，因为工作薪酬可能还会受到其他因素的影响，比如个人的技能、工作经验、地理位置等。
- name: 低质量问题典型画像识别
  desc: '[evidence] 素材归纳两类低质量问题原型并给出判据：① ‘太阳从哪升起’型（答案为公认常识/可秒搜），② ‘怎么成功’型（概念模糊、解空间无界、因人而异）。为‘反向问题筛选法’提供了可操作的负向特征库。'
  excerpt:
  - 例如，'太阳从哪个方向升起？'这个问题的答案（东方）是众所周知的... 如果简单百度/谷歌一下就能得到答案...
  - 例如，'我应该怎么做才能成功？'这个问题太过宽泛，因为'成功'的定义和路径因人而异，可能会有无数种答案。
- name: 环保/经济发展双重案例适配性验证
  desc: '[evidence] 素材对比两类案例选择策略：经验重要性选‘重污染区’（现实痛点导向），理论重要性选‘高增长重污染区’（机制验证导向）。实证展示同一议题下，不同理论目的决定截然不同的案例选择逻辑。'
  excerpt:
  - 例如，如果你正在研究环保问题，那么选择那些严重受到污染的地区作为案例可能会更有意义...
  - 例如，如果你正在研究经济发展对环境的影响，那么选择那些经济发展快速但环境问题严重的地区作为案例可能会更有意义...
