paper: docs/202306/20230613_082.md
desc: 该素材通过对比 985 高校毕业生数量与年入百万人群数量的统计数据，结合“观察者偏差”理论解释认知误区，论证“年入百万比考上 985 更难”这一结论，并基于努力、赛道选择、模仿创新、执行力及运气六个维度给出了实现年入百万的实操建议。
concepts:
- name: 观察者偏差
  desc: 指个体倾向于高估与自己相似人群（如高收入、高学历）在总体人口中占比的认知偏差，导致对社会真实分层（如 95% 人口月入 5000 元以下）产生误判。
  is_original: false
  excerpt:
  - 观察者偏差，意思就是我们总觉得跟我们一样的人特别多。
  - 国家统计局的统计数字，是中国有 95% 的人口月收入不超过 5000 元...但在大厂工作的同学应该会觉得，5000 块的收入，是公司保洁阿姨的底薪。
- name: 幸存者偏差/新闻筛选偏差
  desc: 媒体报道倾向于呈现极端成功案例（如卖煎饼年入百万、放弃百万年薪创业），导致公众对高收入获取难度产生低估。
  is_original: false
  excerpt:
  - 新闻报道里都是年入百万的，卖煎饼果子也可以年入百万，为啥呢？因为不到年入百万不值得上新闻啊。
  - 好多创业者的故事也是，都是放弃百万年薪创业，据说中国被放弃最多的就是百万年薪了。
- name: 稳定年入百万
  desc: 强调收入的持续性与确定性，区别于一次性暴利或高风险投机收益，通常仅见于头部企业高管、大厂高阶岗位或成熟业务主理人。
  is_original: true
  excerpt:
  - 稳定的年入百万，这种高薪很少，一般公司的总经理，也就是百万年薪吧。大厂里，也并不都是行走的百万收入的高 P 们。
methods:
- name: __overview__
  desc: 基于宏观统计数据对比（985招生量 vs 纳税百万人数）建立基准难度模型，引入认知心理学偏差理论修正主观感知，最后提炼致富关键变量形成可执行路径论。
  excerpt:
  - 2023 年 985 大学本科招生人数大概是 20 万人，粗算下来中国 985 毕业的人数有几百万。那年入 100 万有多少人呢？...数字大概在 80 万人左右...翻一番，也就是
    160 万人，比 985 的大学生要少很多。
  - 观察者偏差...我们总觉得跟我们一样的人特别多。
  - 怎么才能做到年入百万？我有几个不成熟的建议：1、付出不亚于任何常人的努力... 2、选择今天最容易赚到钱的领域... 3、学习最厉害的那个同行... 4、不断创新...
    5、超强的执行力... 6、等待运气到来。
- name: 数据修正法
  desc: 针对统计口径不一（如隐形收入、纳税漏报）进行保守系数放大（如翻倍），以区间估计替代精确数值，增强论证鲁棒性。
  excerpt:
  - 就算有许多隐形收入，电商自媒体等等一些不能统计到的纳税额，我们把这个数据翻一番，也就是 160 万人，比 985 的大学生要少很多。
- name: 同侪参照验证法
  desc: 利用作者及配偶 20 年同学圈层的真实收入分布作为微观样本，佐证宏观统计结论的可信度。
  excerpt:
  - 我本人是西安交大，我太太是北航毕业，我们都毕业大概 20 年了，我们两个的同学中，能做到 100 年收入的，也很少。
theorems:
- name: 年入百万难度 > 考上 985 难度
  desc: 基于存量人群对比（985毕业生数百万 vs 年入百万约 80-160 万）及获取路径的不确定性（需打破学生思维、具备财商、承担风险），核心主张年入百万在概率与路径依赖上显著难于标准化考试选拔。
  excerpt:
  - 粗算下来中国 985 毕业的人数有几百万。那年入 100 万有多少人呢？...数字大概在 80 万人左右...翻一番，也就是 160 万人，比 985 的大学生要少很多。
  - 白手起家赚到 100w 比考上 985 难多了。考 985 需要会考试懂考试就行，而赚到 100w 需要打破学生思维，需要多一点财商认知，也需要一点敢于赚钱的冲动和激情。
- name: 选择大于努力（赛道决定上限）
  desc: 处于历史红利期的行业（如 15 年前地产/互联网、当下带货/知识付费）能显著降低达到高收入所需的个人能力门槛，是普通人跨越阶层的关键杠杆。
  excerpt:
  - 选择今天最容易赚到钱的领域，所谓选择大于努力。15 年前你可以去地产，互联网，今天你可能要去折腾带货和直播知识付费等等了。当然，你也要擅长才行。
- name: 模仿是进阶最快捷径
  desc: 直接复制同领域头部玩家的商业模式、流量打法与产品逻辑，避免从 0 到 1 的试错成本，是个人快速建立竞争优势的核心策略。
  excerpt:
  - 学习最厉害的那个同行，不要嘲笑我，抄牛人是最快的进步方式。
- name: 创新即超额利润来源
  desc: 只有通过模式、产品或渠道的微创新形成差异化壁垒，才能突破行业平均利润率，获得高于同行的超额收益。
  excerpt:
  - 不断创新，只有创新，你才能获得高出同行的利润。
- name: 执行力兜底论
  desc: 执行力能将烂想法转化为不错生意，将好想法放大为大生意，是连接战略意图与商业结果的唯一确定性变量。
  excerpt:
  - 超强的执行力。执行力对个人对公司来说，都是极度重要的要素，好想法靠执行，烂想法靠强执行，也能变成不错的生意。
findings:
- name: 985毕业生存量 vs 年入百万存量对比
  desc: '[evidence] 2023年985本科招生约20万/年，存量几百万；年入百万纳税人约80万，即使按隐形收入翻倍估算为160万，仍显著少于985毕业生总量，量化支撑“年入百万更难”结论。'
  excerpt:
  - 2023 年 985 大学本科招生人数大概是 20 万人，粗算下来中国 985 毕业的人数有几百万。那年入 100 万有多少人呢？...数字大概在 80 万人左右...翻一番，也就是
    160 万人，比 985 的大学生要少很多。
- name: 头部名校校友圈层收入实证
  desc: '[evidence] 作者及配偶（西安交大、北航毕业 20 年）同学圈层中年入百万者“很少”，微观样本印证宏观统计，排除“高学历自带高收入”幸存者偏差。'
  excerpt:
  - 我本人是西安交大，我太太是北航毕业，我们都毕业大概 20 年了，我们两个的同学中，能做到 100 年收入的，也很少。
- name: 国民收入真实分层数据
  desc: '[evidence] 引用国家统计局数据：95% 中国人口月收入不超 5000 元（未达社保缴纳基数），揭示大众认知与现实的巨大鸿沟，为“观察者偏差”提供权威锚定。'
  excerpt:
  - 国家统计局的统计数字，是中国有 95% 的人口月收入不超过 5000 元，也就是还没达到交社保的基数。
- name: 大厂高薪普遍性被高估
  desc: '[evidence] 即便在头部互联网大厂，年入百万（高 P 级别）亦非普遍现象，总经理级别薪资上限参考值约百万，修正“大厂人人百万”的刻板印象。'
  excerpt:
  - 稳定的年入百万，这种高薪很少，一般公司的总经理，也就是百万年薪吧。大厂里，也并不都是行走的百万收入的高 P 们。
- name: 小微企业主利润率陷阱
  desc: '[evidence] 中国大量小老板公司流水几百万但净利润极低，营收规模≠个人年入，揭示创业致富的高失败率与低中位数收益。'
  excerpt:
  - 做生意呢，其实中国做生意的小老板们，公司收入几百万还正常，算成利润，那就真的不多了。
- name: 统计隐形收入比例争议
  desc: '[claim] 评论区指出隐形收入（电商、自媒体等）漏报比例可能远超 1:2（翻倍估算），实际年入百万人数可能超过 160 万，对原文数据保守性提出质疑。'
  excerpt:
  - 统计数据能看到的是 80 万人，统计不到的感觉不止 1:2 的比例，感觉应该不止 160 万
- name: 非 985 年入百万路径存在性
  desc: '[claim] 评论区指出“身边 985 但年入百万不多”不等于“考 985 容易”，因为存在大量非 985 毕业却年入百万的群体，原文对比逻辑存在幸存者偏差。'
  excerpt:
  - 身边 985，但年入百万的不多，应该也不能推出考上 985 比年入百万容易，因为也有很多没有考上 985 但是一样年入百万的
