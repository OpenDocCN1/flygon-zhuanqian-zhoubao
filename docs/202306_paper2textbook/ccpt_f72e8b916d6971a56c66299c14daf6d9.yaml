paper: docs/202306/20230613_027.md
desc: 该素材由AI训练师小凡撰写，针对大众使用ChatGPT进行文字创作（以高考作文为载体）普遍存在的“单点式指令”误区进行批判，核心主张AI写作应是一个“过程”而非“两点一线”的结果导向操作。文章提出“AI并未降低门槛，反而提高了门槛并加剧分化”及“需更用心地与AI交流训练”两大核心观点，并引导读者前往飞书文档查看详细的实操方法论（如人机协作的分步骤流程、提示词工程技巧等）。
concepts:
- name: AI写作的过程观
  desc: 将AI辅助写作视为一个需要人类深度参与、迭代打磨的动态交互过程，而非单次指令生成结果的静态映射。
  is_original: true
  excerpt:
  - 使用 GPT 来解决问题是一个过程，但太多人将其当做两点一线。
- name: AI工具的门槛悖论
  desc: AI工具表面上降低了创作的技术门槛，实则因对使用者的判断力、审美力、提问能力提出更高要求，从而提高了产出高质量内容的实际门槛，导致人群分化加剧。
  is_original: true
  excerpt:
  - gpt 看似降低门槛，实则提高了门槛，加剧了分化。
- name: 人机深度协作
  desc: 强调人类不应甩手掌柜，而需投入更多心力进行交流、训练、把关与修正，实现人类意图与机器生成能力的深度对齐。
  is_original: false
  excerpt:
  - gpt 不是神，需要我们更用心的和它交流和训练。
methods:
- name: __overview__
  desc: 作者构建的一种从“误区拆解”到“核心认知重塑”再到“实操方法论落地”的完整教学路径。以高考作文为具体载体，先批判“单点式提示词”反模式，再确立“过程式协作”正向认知，最后在外部飞书文档中展开详细的分步骤操作指南（如需求拆解、角色设定、分段生成、迭代优化等）。
  excerpt:
  - 我想从这个话题中挤出一些有益的养分，给到大家。通过这样一篇思考，解决问题的过程，把写出高考作文作为一个载体，来由小及大，讲清楚更大的一些点。
  - 还请移步飞书链接：别再发 low 到爆的 GPT 秒出高考作文了！一文讲透 AI 在文字创作中的正确使用姿势
theorems:
- name: AI写作本质是过程而非结果的映射
  desc: 使用GPT解决写作问题本质上是一个复杂的交互过程，将其简化为“一条提示词生成一篇成品”的两点一线模式是根本误区，会导致低质量输出。
  excerpt:
  - 使用 GPT 来解决问题是一个过程，但太多人将其当做两点一线。妄想给内容出结果，用你这个思维，我认为你在高考时也手写不出啥好文章来。
- name: AI加剧创作能力分化定律
  desc: 生成式AI工具的普及不会平均化创作能力，反而会因使用者认知水平、提问能力、审美判断力的差异，放大高手与新手的产出差距，加剧社会分化。
  excerpt:
  - gpt 看似降低门槛，实则提高了门槛，加剧了分化。
- name: 人类主体性不可替代原则
  desc: AI不具备神性，无法自动理解深层意图；高质量创作要求人类保持主体地位，投入精力进行精细化的交流、训练、约束与审校。
  excerpt:
  - gpt 不是神，需要我们更用心的和它交流和训练。
findings:
- name: 大众使用AI写作的普遍误区现象
  desc: '[evidence] 观察到大量公众号和朋友圈案例，用户习惯使用简单粗暴的Prompt（如“帮我写一篇高考作文”）直接追求成品输出，导致生成内容质量低下、千篇一律（low到爆）。'
  excerpt:
  - 已经有很多 AI 公众号和朋友圈里的朋友展示了他们用 AI 生成的高考作文。
  - 别再发 low 到爆的 GPT 秒出高考作文了！
- name: 方法论外部化验证
  desc: '[claim] 作者声称在飞书文档中提供了完整的、可复现的“正确使用姿势”实操流程，且评论区用户反馈“分析的拳拳到肉”、“已把整体思路过了一遍”，初步验证了方法论的可传递性与实用性。'
  excerpt:
  - 下面我还是先讲大家大概率会比较喜欢的部分：小凡怎么用 GPT 来生成一篇高考作文。内容很多，为了最好的阅读观感，还请移步飞书链接...
  - '泉州百度营销顺 : 已经把整体思路和看法的东西都过了一遍，果然通透'
  - '朝闻道 : 厉害 分析的拳拳到肉。'
