docs/202306/P4Acd9epMoq1jdxrLeBcsRRjngc.md: '# 37天8万8佣金，0-1抖音图文矩阵带货突出重围  > 来源：[https://mymkbeayzl.feishu.cn/docx/P4Acd9epMoq1jdxrLeBcsRRjngc](https://mymkbeayzl.feishu.cn/docx/P4Acd9epMoq1jdxrLeBcsRRjngc)  大家好。我是九月，全职在做抖音，深耕中老年赛道（中医养生号）快一年了。  ![](img/09315c1e3cbb1084551ea1620bc0b40b.png)  ![](img/c96ba0d1fb99a6a49fb19b4d70f1db34.png)  这是我手里13个号上个月和本月的佣金截图，本月佣金截图于6月6日下午。  感谢生财这个平台，没有生财我也不会知道这个项目，因为生财我才能链接到这个赛道的大佬，才能做到这个成绩，感谢🙏  一、前言  从四月底开始中医的违规非常严重，中医最主要的流量~倪海厦这个ip被封杀，很多跟我同一时期做中医的都已经改换了赛道，五月初的我非常迷茫，这时的我号都已经被封，已经完全没有收益，到底是深耕下去还是放弃，期间还被人骗了（这个'
docs/202306/PDWLdy74BoJcjnxjjRGcwuSvnjc.md: '# 从入行设计师到跑通副业IP，知识付费2W+，我学到了哪些？  > 来源：[https://p2ls2mp3ij.feishu.cn/docx/PDWLdy74BoJcjnxjjRGcwuSvnjc](https://p2ls2mp3ij.feishu.cn/docx/PDWLdy74BoJcjnxjjRGcwuSvnjc)  #
