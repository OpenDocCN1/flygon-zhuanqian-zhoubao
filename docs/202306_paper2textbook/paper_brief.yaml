docs/202306/AwMHdgfqxomlshxeCdgcVpEMn9b.md: '# 超详细步骤毫无保留告诉你，如何靠商业软文年入百万？  > 来源：[https://mmmu5tnlrk.feishu.cn/docx/AwMHdgfqxomlshxeCdgcVpEMn9b](https://mmmu5tnlrk.feishu.cn/docx/AwMHdgfqxomlshxeCdgcVpEMn9b)  哈喽大家好，我是钱酱，今天给大家分享我自己迭代的写商业软文的方法。  先跟大家打个招呼，自己一直都是实战派，很少公开去讲这套方法，所以有讲的不好的地方，大家多担待，不明白的地方也可以下来问我。  我对一篇好的商业软文的定义：  1、如果你做IP，能快速获得读者信任  2、如果你引流，能快速获得粉丝  3、如果你做转化，能快速让你收钱  一句话概括，既能带给读者价值，又能带给自己商业价值的文章，就叫商业软文。  我自己就是靠这套方法，一个人、不露脸、并且在粉丝很少的情况下，快速积累到自己的第一桶金。  质量大家放心，我的文章不会有太多假大空的东西，只要照着去做，就能立马出结果。  可能你会感觉写作这件事很复杂，或者至少需要很强的文字功底，其实不是，我是理科生，大学学的软'
docs/202306/B6jPdJ2qGoa6Jsx5ky8c5iU8nUf.md: '# 小红书无货源电商如何高效测品？  > 来源：[https://rlp3cigezs.feishu.cn/docx/B6jPdJ2qGoa6Jsx5ky8c5iU8nUf](https://rlp3cigezs.feishu.cn/docx/B6jPdJ2qGoa6Jsx5ky8c5iU8nUf)  大家好，我是沐风。最近，应该有很多同学都在落地小红书电商项目，我们都知道，对于电商项目来讲，选品是重中之重，而关于如何选品，星球里已经有很多大佬都已经详细的写过了，我之前也写了一篇关于选品的文章：《
  》，大家有兴趣的话，可以看看。  不过，选品固然重要，但选出来的产品到底能不能出单，我们终归还是要去测试的，我们测的产品越多，出单的概率也就越高，那么我们该如何高效的测品呢？  其实，我们可以梳理一下整体流程：  首先，在测品之前，我们需要搜集产品相关的素材，然后直接发布或者进行二次创作之后发布，之后，根据测试数据来验证我们选出来的产品是否OK，如果OK，就继续围绕这个这个产品创作内容，获取更多流量，如果不OK，那就继续选品、测品，总结来讲就是：  选品->搜集素材->创作笔记->发布笔记-'
docs/202306/BNZsd608eoQZffxlFzccXVVmnbb.md: '# 知识星球_微信群消息提醒  > 来源：[https://mwbd1qmlmx.feishu.cn/docx/BNZsd608eoQZffxlFzccXVVmnbb](https://mwbd1qmlmx.feishu.cn/docx/BNZsd608eoQZffxlFzccXVVmnbb)  ##
  1.背景  经历了14天的航海，今天找到了一个感兴趣的点，想做一个实时推送的群聊机器人，将生财每天的更新帖子推送到个人微信。  为什么要做这个小工具呢？平常上班时间忙，然后下班到家去翻历史内容，总感觉好像错过了几个亿似的，主要还是太懒，懒才能推动工具进步。  目前考虑点如下:  1.调研了知识星球网站api爬取相对简单，传入cookie就能获取自己所加入星球的信息  2.机器人最初选择考虑微信公众号推送，但是只有订阅号才有这功能，而且需要企业认证，暂时放弃，目前考虑企业微信的机器和飞书机器人  3.实现一个简单的初版，有定时消息推送，然后考虑按分类信息推送，最后考虑订阅信息和加入gpt总结功能  ##
  2.功能介绍  1.  已经支持企业微信机器人通知  1.  已经支持最新消息和风向标'
docs/202306/BXOtdGMhBooERgx8qGscVS42nPe.md: '# 闲鱼二手书：程序员的打怪修仙之路，实现全自动赚钱  > 来源：[https://r2rmt6mopc.feishu.cn/docx/BXOtdGMhBooERgx8qGscVS42nPe](https://r2rmt6mopc.feishu.cn/docx/BXOtdGMhBooERgx8qGscVS42nPe)  大家好，我是搞钱界的修(技)仙(术)人——华少，加入生财已经3年了。  ![](img/00ea3f0f217acf429c0bcc2eab3ca952.png)  之前一直默默潜水，看着各位大佬分享，直到链接了生财的二手书一哥老瞿Qu，看着他做二手书年入百万，但这个项目却较为繁琐，感受到老瞿Qu的痛苦，于是决定做老瞿Qu背后的男人，用技术手段让老瞿Qu实现快乐的年入百万。  同时本人也在2022年12月份第一时间，办理了6个出版物许可证，开通了18个闲鱼二手书帐号，开启了躺平式的月入2W的闲鱼卖二手书之路。  本人精通JavaScript，Java，PHP，Python，C#，JavaScript，Swift，Kotlin，TypeScript，Rust，Swift等'
docs/202306/BZIudzyjqoZ3dnxryHScQCRhn1q.md: '# 快手无人直播背后的利与弊  > 来源：[https://dte8en3l2y.feishu.cn/docx/BZIudzyjqoZ3dnxryHScQCRhn1q](https://dte8en3l2y.feishu.cn/docx/BZIudzyjqoZ3dnxryHScQCRhn1q)  很多人都会问我无人直播这个项目怎么样，有没有项目介绍之类的。  我写过很多版本的项目介绍，但是我总觉得写的不好。  今天我以最中肯的方式为大家分析这个项目的好和坏。  #
  快手无人直播的优点有以下几点：  1.  门槛相对较低，一台手机一台电脑一个账号就能操作，稍微懂一点点运营就可以赚钱，但是能赚多少，取决于你账号的数量和执行力。如果运气好，单号赚几十万的情况也有，但是这种概率很低，普遍都是赚几千块钱。  1.  可以快速复制，一个人在家玩十个号都能玩得转，如果两三个人，30-50台电脑都能玩得转，前提是，有执行力。  1.  可以24小时不间断的直播，没有太大的直播成本和投入成本，理论上可以对真人直播进行降维打击。  1.  可以赚钱，这个已经毋庸置疑，而是百分之百能赚钱，至于能赚一百，还是'
docs/202306/BdLRwDg3ni8dMGkD04HcfMs5ngg.md: '# 小红书塔罗项目  > 来源：[https://wn6w5rrjx5.feishu.cn/docx/IGVTdJtkIo4Oyhx80EAcrT6pnJc](https://wn6w5rrjx5.feishu.cn/docx/IGVTdJtkIo4Oyhx80EAcrT6pnJc)  前段时间看到一个塔罗项目，觉得很有意思佛系测试了一波，不到1个月，单价99半小时的私占，成交12单。小红书群里有三四百人，引流到微信平均每5个人中，就有1-2个人成交。三个小时就能做好一周要发的内容  ![](img/c690d6a14fb0de6c01af6cede51dd6d4.png)  我本身是完全不懂塔罗的，后端交付找了一个会算塔罗的朋友帮忙。如果你正好会算塔罗，那这个项目可以时候是为你量身打造，如果你不会算塔罗，只需要变换一下交付形式，利用ai占卜。也可以完成交付  #
  1.找/拆解对标  这里找对标不只是我看看他的账号是什么样子就可以了，而是要细致化的，从他的账号装修，到内容，到引流动作，到加上微信的话术，到产品结构。都要去拆解。目标10-20个。实际上等你拆完基本这个项目怎么做你都明白了'
docs/202306/BiEBd6DQGoKaLlx7TCpco5NpnAb.md: '# 我用自己踩过的五个坑，来防止你的网赚之路夭折  > 来源：[https://uwdpzjnryu8.feishu.cn/docx/BiEBd6DQGoKaLlx7TCpco5NpnAb](https://uwdpzjnryu8.feishu.cn/docx/BiEBd6DQGoKaLlx7TCpco5NpnAb)  #
  一、前言  大家好，这里是【苍述】。  这篇文章也是很多朋友催我出很久了，最近北京大面积二阳不幸中招了，拖更了挺久，今天把它写出来。  简单来说，这是我加入生财两三个月一路走来自己遇到的坑，以及我的社群里的小白过往遇到的坑的总结。  每年都有大量的小白走上网赚、互联网创业的道路，而这条道路无疑是残酷的：同样每年也有大量的小白会退出，回归自己原本的圈子，放弃所谓网赚的想法。  这条路有着很多的深坑，它们会打消小白的热情，摧毁小白的信心，甚至磨灭小白对网赚这件事的信任。  每一个进来的小白都是带着满怀的希望来的，但他们中的大多数人最终只会遗憾离场。  而我今天的总结就是把我遇见的坑先告诉你，尽可能的避免你踩进去，让你能在网赚这条路上多活一段时间，尽可能活到你拿到足够的正'
docs/202306/BiGGd6N0Zog6dyxpBnoc2MQknsW.md: '# 金税四期严控下电商企业老板应该如何应对？  > 来源：[https://d2dfqmvn0e.feishu.cn/docx/BiGGd6N0Zog6dyxpBnoc2MQknsW](https://d2dfqmvn0e.feishu.cn/docx/BiGGd6N0Zog6dyxpBnoc2MQknsW)  随着“金税四期+严征管”时代的到来，税务监管环境越来越严格，新闻更是频频爆出网红主播天价补税、直播电商、社交电商、等电商企业出现补税潮等各种税务问题，企业财税风险防不胜防。  今年5月，广州xx服饰公司，因通过现金以及支付宝收款含隐匿销售收入金额122万元，未计入销售收入，造成少缴纳增值税14万元.......  ![](img/57def8c641d306e14f9f8653641c382f.png)  违法事实正文:  （一）你单位在2019年4月-2020年12月以直接收款方式销售货物，货款通过现金、支付宝方式收取，实现含税销售收入1,227,143.73元，换算成不含税收入为1,085,967.92元。上述业务你单位没有作销售收入记账，至检查日止没有按规定申报纳税，造成'
