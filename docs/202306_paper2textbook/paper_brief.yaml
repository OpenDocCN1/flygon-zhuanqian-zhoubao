docs/202306/ZAV2dmbprovcXvxqVe9cUVfEnKd.md: '# 我让人人0成本卖洗衣家政每月多赚一万  > 来源：[https://ehvzbnju2l.feishu.cn/docx/ZAV2dmbprovcXvxqVe9cUVfEnKd](https://ehvzbnju2l.feishu.cn/docx/ZAV2dmbprovcXvxqVe9cUVfEnKd)  大家好我是做互联网洗衣的老钱，前年在生财分享过我做互联网洗衣的全过程经验：https://shimo.im/docs/gWcqR9TPkX8QwKKw/，目前我是全国唯一在做全套互联网洗衣经验交付的人，这两年也带了几十个老板在美团等电商平台上做虚拟洗衣店店群，用电商中间商打法做洗衣服务，不用自己洗衣不用开店，只做客服，利用快递外包给洗衣店洗涤。  最近受到一个开社区便利店的朋友的启发，我们跑出了一套云洗衣新业务模式，让做本地生活的老板都能够利用线下人流卖出洗衣、家政服务，老板只做客服中间商工作，
  连线上网店也不用开，实现增收。3个月我测试了5个便利店、复印店、饭馆、驿站等业态，每个店每月洗衣+保洁卖出了1万-2.3万销售额，利润六七千起。因为不需要额外的人力成本、场地空间、洗衣极其'
docs/202306/ZbxHdt8nRoi64KxjkEvcuHQNn8g.md: '# 在闲鱼卖露营装备一整年，分享一下我稳定月入1-2W的小蓝海项目  >
  来源：[https://vb5bdj4t4a.feishu.cn/docx/ZbxHdt8nRoi64KxjkEvcuHQNn8g](https://vb5bdj4t4a.feishu.cn/docx/ZbxHdt8nRoi64KxjkEvcuHQNn8g)  大家好，我是吉良吉颖，去年通过捕捉到亦仁发的露营经济风向标，开始在闲鱼卖露营装备  我做这个生意是去年4月初开始做一直到5月底才开始有起色的，从最开始的一个账号每天100多的收益，到后面5个账号每天800-1000的收益，目前这一年我从这个项目获得的收益快小20W了  而且我目前只在闲鱼做这一个领域，除了卖露营装备没卖别的  包括去年我带着搞的这个赛道的几个小伙伴，只要执行力强的，没有谁月入低于8k的，如果你正好在做闲鱼又不知道卖什么，那就来试试卖卖露营装备  本来以为这个项目最多就火完去年今年肯定不怎么赚钱了，没想到今年依旧很可观  先给大家看一下我今年近两个月的战绩  ![](img/69a98e4345de260e1fa10366bda6665d.p'
docs/202306/Zqi3dDa6woRKCUxp9CjcxjHBnGf.md: '# 手把手教你用 ChatGPT plugin 打造一个人知识库系统（一）  >
  来源：[https://vfb2y0pfkc.feishu.cn/docx/Zqi3dDa6woRKCUxp9CjcxjHBnGf](https://vfb2y0pfkc.feishu.cn/docx/Zqi3dDa6woRKCUxp9CjcxjHBnGf)  ##
  为什么需要个人知识库？  大概有很多人跟我一样，被现在信息过载弄得非常焦虑。很自然想到通过整理的方式来对抗信息过载，试图使用各种知识管理工具来整理这些信息，但最后折腾完各种工具后，才发现根本用不起来。因为这些工具常常需要我们按照预设的框架去管理和整理我们的信息，而这些框架可能并不完全符合我们的需求，缺乏足够的灵活性。  所以我在想，是否存在这样一种方案？既不改变我们现有摄入处理信息的方式，又能在整理信息时帮助我们链接和管理我们历史的知识。在大模型语言出现之前，这可能是难以实现的。但现在以
  OpenAI 为代表的语言模型，具备了这个能力，他们能非常精准地理解你的自然语言。因此，我们完全可以不必关心整理这一趴，所有的知识点都可以散落一地，我们只在'
docs/202306/doxcnb8LDVdg910UJXZ8SILXgff.md: '# 如何有效BD达人？  > 来源：[https://xfxnrwx9us.feishu.cn/docx/doxcnb8LDVdg910UJXZ8SILXgff](https://xfxnrwx9us.feishu.cn/docx/doxcnb8LDVdg910UJXZ8SILXgff)  我是宝爷！分享我在五谷磨房做商务几个月，总结出来的一些避坑小经验分享给大家。  ####
  （1）平常通过什么方式去找达人？  1.  达人的主页，基本很多有意向合作的达人都会在主页写上自己的联系方式。（直接备注是哪个品牌方，想如何合作，达人有意向就会通过。  1.  商务社群，达人方以及品牌方都会建一个沟通的社群，可以在里面找到自己想要的品牌方和达人。（群里的小侠，就有很多这方面的资源，有兴趣可以跟小侠多沟通，寻求帮助的同时，也别忘了给人家发个小红包,表示感谢。）  1.  品牌方互推，跟自己品类接近或者竞品的品牌方，可以相互推荐合作产出比较好的达人，也可以通过飞瓜数据去查阅，看看她们过往合作过产出比较好的达人，再进行资源互换，一般很多品牌方的商务都特别友好。  1.  小二/团长机构建联，像五谷磨'
