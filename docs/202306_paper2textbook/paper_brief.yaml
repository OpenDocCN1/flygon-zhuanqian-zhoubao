docs/202306/QdPkd1IM2orhqFxaAXCcM6fynsc.md: '# 线下门店位置好，为什么客户就是不进店？  > 来源：[https://h24wtd3rug.feishu.cn/docx/QdPkd1IM2orhqFxaAXCcM6fynsc](https://h24wtd3rug.feishu.cn/docx/QdPkd1IM2orhqFxaAXCcM6fynsc)  经常有人问：选了好位置，为此付出了昂贵的租金，但客户就是不进店，怎么办？  那为什么顾客不进店？  今天我用一个例子来探讨一下。  下面这家仁材药店，是我在偶然之间看到的，看到后我足足站在它门店面看了30分钟，拍了很多的图片，为说它极具竞争力？我们可以从以下几点说起。  *
  * *  一、转化第一步  先问大家一个问题：在面对流经门店的客户，转化的第一步是啥?  转化的第一步：让他们先注意到我们，看向我们。  是的，就是这么简单，但是我们做到最大限度的让客户注意到我们吗?  我们可以看到，这家药店在让客户注意上做的有多棒！  【180度灯光展示，最大限度曝光自己】  1.从图1来看，这家店是正常的招牌，LED灯，招牌下还有一些灯箱，看起来和其余门店类似。  ![](img/664'
docs/202306/QlUMdZfACoJhFNxp97RcvXygntf.md: '# 《从平台角度，聊一聊推文技巧及高效化引流》  > 来源：[https://dvfan273t0n.feishu.cn/docx/QlUMdZfACoJhFNxp97RcvXygntf](https://dvfan273t0n.feishu.cn/docx/QlUMdZfACoJhFNxp97RcvXygntf)  今天跟大家分享的是在做推文之中最重要的一个环节，就是引流。  做推文的时候，我们一定要了解不同平台的特性，因地施策，避免出现平台选择错误的情况。  ###
  一、小说推文在不同平台的特性  我们在做小说推文的时候，不要只是专做一个平台，要做“海王”，并且需要有一些策略在里面。  #### 1.1 抖音  抖音是咱们一定要做的，他的特点是【起号慢】但是【活得久】，除非特别出格或者频繁被人举报，否则生命力是最长的。可以把号逐渐养起来，然后收益就会比较稳定了。  ####
  1.2 快手  快手其实适合的是“短平快”，尤其我们在做图文素材的时候，很快就能起号，运气好的可能两三天就会爆单。所以快手是【小白最爱】【爆得最快】。  但是快手的审核比较抽，我们叫【废得轻巧】，爆完基本上就会'
docs/202306/Qzd8dBqErofp9axqQRCckvWKnog.md: '# 快手无人直播技术[C级]  > 来源：[https://qv4zhbe2wa.feishu.cn/docx/Qzd8dBqErofp9axqQRCckvWKnog](https://qv4zhbe2wa.feishu.cn/docx/Qzd8dBqErofp9axqQRCckvWKnog)  阅读后，  可以获取快手无人直播技术，  快手无人直播模式，  重点：该模式可以照葫芦画瓢，照猫画虎......举一反三，快速起号，  希望对你有帮助！  ##
