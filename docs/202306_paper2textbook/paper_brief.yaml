docs/202306/PcWudoTDjoGvZGx5pExcKCGBnMc.md: '# 实体商家同城抖音短视频爆款视频打造  > 来源：[https://mgwbx803sq.feishu.cn/docx/PcWudoTDjoGvZGx5pExcKCGBnMc](https://mgwbx803sq.feishu.cn/docx/PcWudoTDjoGvZGx5pExcKCGBnMc)  我是做美容行业，传统实体店。去年在抖音上做了一个同城账号。累积卖了6000+份团单，到店体验顾客，成交300W+。  ![](img/74338beae79c0803aa3ae894eded47e2.png)  今天就花一些时间，和大家聊一聊，我们实体商家做抖音，怎么样打造属于自己的爆款短视频。  #
