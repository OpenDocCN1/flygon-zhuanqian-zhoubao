  (222 赞)简单的副业赚钱思路分享   作者： scalers   日期：2023-06-14   一个简单的副业赚钱思路   很多人对副业赚钱有兴趣，给大家分享一个副业赚钱思路。   简单来说，副业赚钱的第一桶金，就是让人感觉欠你一张门票；第二桶金以及后续就看你的交付能不能给到惊艳。   1、关于让人感觉欠你一张门票   你在网络平台上做一个账号，在上面持续输出内容，吸引到关注者，让关注者感到有价值，不限于从你这学到东西、收获情绪、开阔视野等等。总体来说，就是有一群人觉得你这里好玩，开心，有用，就可以。   要达成这个结果，需要你持续稳定输出。稳定能积累人的信任，让大家习惯你一直都在，表现良好，不会跑路。   当积累了一定时期以后，你可以推出一些定制的付费类的产品。比如社群、课程、活动、咨询等等。一般首次推出，都不会特别'
