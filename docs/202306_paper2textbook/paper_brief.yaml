docs/202306/20230613_091.md: '# 视频时代，为什么还在写文字？  > 原文：[`www.yuque.com/for_lazy/thfiu8/gae9vt9y5p48p68g`](https://www.yuque.com/for_lazy/thfiu8/gae9vt9y5p48p68g)    ##
  (35 赞)视频时代，为什么还在写文字？   作者： 苏佬师@品牌营销   日期：2023-06-02   视频时代，为什么还在写文字？   有朋友问我为什么不做短视频、直播？写文章费时间，而且没多少人看，拍短视频发抖音、视频号，马上就有几千上万的播放。   我总结有这几个原因：   第一媒介即信息。在我看来短视频娱乐的成分更大，要想把干货讲好，还得抖机灵、出金句加好的拍摄剪辑效果。而且短视频环境噪音很大，很容易滑到美女、搞笑视频里，专注度不好。   而且看短视频是一种被动输入的方式，就是你不看，对方还是会哇哇讲，那么对大脑的调动就少，所以吸收的效率低一些。看文字是主动输入，不主动集中注意力看，就无法吸收，对大脑资源的调动更多，学习效果更好。   第二是信息密度。你看三分钟文章和看三分钟短视频，获得的信息数量和质量不同'
