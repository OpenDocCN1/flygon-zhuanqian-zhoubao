  (81 赞)小马宋：如果只有少数企业能赚到钱，那凭什么是你？   作者： 小马宋   日期：2023-05-25   如果只有少数企业能赚到钱，那凭什么是你？创业
  46 条之 17   很多创业者创业的时候，想的总是创业后的美好结果，却没有认真思考过，他能成功的原因。那么多人都想赚钱，那凭什么是你呢？   企业的竞争，就是生产力和执行力的竞争。一个企业，首先要掌握先进的生产力，即使不是制造和科技行业，先进的生产力也是需要的。比如营销咨询，他想赢得竞争力，就需要先进的理论，先进的方法，先进的工具。   二十年前，中国的营销行业有非常简单粗暴又有效的方式，就是投电视广告+铺渠道，那个时候你核心的竞争力来自你对投广告这件事有效性的认知，因为大部分企业还是不敢投，所以掌握了这个认知和投放的效率，以及能找到最'
docs/202306/20230613_180.md: '# 其实很多人真的不会赚钱  > 原文：[`www.yuque.com/for_lazy/thfiu8/hu4u7prkoen2zrgn`](https://www.yuque.com/for_lazy/thfiu8/hu4u7prkoen2zrgn)    ##
  (80 赞)其实很多人真的不会赚钱   作者： 之势   日期：2023-05-24   ## ·其实很多人真的不会赚钱 1.赚大钱的方法没有写在刑法里，而是写在经济学里
  微观经济学赚钱方法是：洗脑需求，控制供给。宏观经济学赚钱方法是：经济危机，暴涨暴跌。这两种赚钱方法都绝对合法，而且高级。（珍大户《认知世界的经济学》) 2.要赚钱，两头总得占一头
  产品、流量你总要占一个，否则不可能赚到钱。普通人赚钱，最好去做流量。做分销， 做短视频带货，做无货源开店，都是用流量换销量，用销量换分佣。 3.要做内容的生产者，而不是消费者
  你刷短视频，刷微博，跟人抬杠、吵架，都是在做消费者。做消费者是赚不到钱的，你做短视频，写微博，才是内容的生产者。做生产者才能赚到钱。 4.要做一对多，尽量不做一对一
  把一份时间重复发售，让时间发挥最大价值。'
