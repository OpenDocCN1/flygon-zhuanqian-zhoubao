docs/202306/CWTGdnwBZoreawxpweSc128UnPe.md: '# 作为普通人，我们该如何挖掘商机？  > 来源：[https://rlp3cigezs.feishu.cn/docx/CWTGdnwBZoreawxpweSc128UnPe](https://rlp3cigezs.feishu.cn/docx/CWTGdnwBZoreawxpweSc128UnPe)  #
  需求是商业的起点  大家好，我是沐风，今天我想跟大家分享一下：作为普通人，我们该如何挖掘商机？  通过生财，大家已经见识到了各种各样的赚钱项目，但实际上，我们也知道，任何一个项目的底层逻辑基本上都可以概括为：  需求-产品/服务-流量-转化-交付-变现。  也就是说，需求其实是一切商业活动的起点。那么，如果我们能围绕着某类目标人群挖掘出一些需求，去针对性的提供一些差异化的产品或服务，并以此为卖点去获取流量，然后做好转化和交付，那么，变现就是水到渠成的事情了。  只不过，对于我们大多数普通人来讲，在资源和精力有限的情况下，我们可能无法兼顾所有环节，这个时候，我们只需要做好其中的某几个环节，然后把剩余的环节交给其他更专业的人去完成，我们一样可以实现变现。  比如，对于大多数做无货源电商'
