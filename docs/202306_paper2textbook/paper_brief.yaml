docs/202306/N147dCBZJoN4sxxAprMcVZZHnWf.md: '# 三年探索，我通过流量主每月被动收入超5w，历程分享  > 来源：[https://q2srbwoeiz.feishu.cn/docx/N147dCBZJoN4sxxAprMcVZZHnWf](https://q2srbwoeiz.feishu.cn/docx/N147dCBZJoN4sxxAprMcVZZHnWf)  大家好，我是程序员田同学，一个在小程序行业沉淀了五年，在老年私域粉+公众号\小程序流量主赛道专研三年的玩家。  三年前，我大四实习工资一月3000，经过这几年的探索，现在在不影响我本职工作和个人IP业务的前提下，兼职运营数十个公众号和小程序。  下图是我今年二月上线的小程序，目前像这样在盈利的老年小程序有十二个。  ![](img/4f94638856b2f528584673cca9c35f71.png)  下图是我今年新开的一个老年公众号的收益，这样的公众号目前有十五个。  ![](img/c7d5b8b2c02031c01a9baabe7c27d543.png)  这样的成绩在大佬云集的生财里可能不值一提，但它对于我这样的普通人来说，在当下的人生阶段还是挺满意的。'
docs/202306/N3dadKnkqohfjSxc12wcTKfpnHc.md: '# 淘宝高客单无货源玩法，一单利润四位数  > 来源：[https://iv6ghbv3yvs.feishu.cn/docx/N3dadKnkqohfjSxc12wcTKfpnHc](https://iv6ghbv3yvs.feishu.cn/docx/N3dadKnkqohfjSxc12wcTKfpnHc)  分享一个淘宝无货源高客单价的玩法。都说电商很卷，淘宝更卷，普通人要入局比较难，但如果是玩高客单，一单利润上千，或者偶尔来个大单利润也有一两个w，是不是顶得上低客单产品几十上百单的利润。  直接上重点。  一、项目介绍  这套模式的核心就是利用电商平台千人千面的机制去做高价值人群的生意，对供应链没有什么要求，几乎所有产品都可以操作，比如服装鞋，电子产品，餐饮器具等等，直接去同行或者网红店采集他的爆款链接，一般一两百成本的商品，到我们店铺就挂一千多。如果有出单就直接去人家店里下单，然后寄回来更换包装和吊牌后重新寄出去，正常一单利润在1000+。如果是比较中性的产品，没有商标品牌之类，可以直接一件代发。比如下面这个壶，挂1198元卖出去了，直接到别人店里下单183元填我们的客户地址，'
docs/202306/NSJLdjAUUosmAixOHIWcFI93nob.md: '# 公众号公域流量爆发+新流量入口  > 来源：[https://c75rzod2h6.feishu.cn/docx/NSJLdjAUUosmAixOHIWcFI93nob](https://c75rzod2h6.feishu.cn/docx/NSJLdjAUUosmAixOHIWcFI93nob)  大家好，我是张柯Ker，  被亦仁老板抓过来分享了，  本来是快闪付费内容，在这里公开分享了，群不进人，我也不培训，纯分享，  ![](img/a7192205fd3e64bb1c41d1523bc56a9c.png)  最近关于公众号流量主收益的项目层出不穷，不管是生财的爆文写作航海也好，最近的AI绘画热点也好，  核心要点就是文章的阅读量会突然爆发，但又不知道这流量是哪来的，主流打法就是，更新，等自然流，外面收费都很高，纯交个朋友来分享一下，内核都是一样的，  我看到最牛逼的人，是用chatgpt批量写狗血情感文，月入8w，纯流量主收益，  ![](img/6c6c131605f25de22d8b4ff184441cdb.png)  ![](img/da0ef08e5080c8013'
docs/202306/NeqIdWC9PovqQ6xruAJcErqHnxc.md: '# 《ControlNet终极攻略》  > 来源：[https://ry5hwpuf7b.feishu.cn/docx/NeqIdWC9PovqQ6xruAJcErqHnxc](https://ry5hwpuf7b.feishu.cn/docx/NeqIdWC9PovqQ6xruAJcErqHnxc)  《耗时7天，终于把15种ControlNet模型搞明白了！》  各位好，我是吴东子  我的所有资料都在公众号「吴东子AI」  这篇文章是SD三部曲的第三篇——「ControlNet的终极攻略」  前面我们说到如果想真正把SD应用起来，最重要的两个功能是：Lora和ControlNet  Lora负责把想要画面的“主体”或“场景”炼制成模型  ControlNet负责更好地“控制”这个“模型”或画面  Lora教程之前已经出了，感兴趣的朋友可以去翻看  ControlNet一共有15种模型，每种模型对应不同的采集方式，再对应不同的应用场景，每种应用场景又有不同的变现空间  我花了一周时间彻底把15种模型研究了一遍，跑了一次全流程，终于写完了本文  文章包含了ControlNet的功能介绍'
