docs/202306/KX97dT9bGoffn2xVdEucHeiYnaf.md: '# 珠宝高客单，如何打造好私域，静默成交高客单产品  > 来源：[https://n28vbku1px.feishu.cn/docx/KX97dT9bGoffn2xVdEucHeiYnaf](https://n28vbku1px.feishu.cn/docx/KX97dT9bGoffn2xVdEucHeiYnaf)  大家好，见贴欢喜，我是李米乐，扎根珠宝领域13年，副业个人IP孵化服务。从疑惑做私域能不能变现，到只会写装逼文案，乱发，到信手拈来；从最初朋友圈0成交，到断断续续成交费劲，到客户主动打钱，转介绍，并且积累了一帮老客户，经历了从新手期，到成长期，到放大期三个阶段，算是成功跑出来了。  我知道有很多人做公域很历害，但却没有做私域，几万甚至几十万的粉丝承接不住，不懂如何在私域变现，就只能不断做流量来缓解焦虑。也有人还在纠结，担心朋友圈没人看，想发圈又怕被亲友同事说，以及朋友圈没东西发，或者发的多却成交不理想等等。  也有很多朋友看了我上一篇的贴子珠宝高客单，从小红书引流到私域，300粉变现20w+我做对了什么，跑来问我如何做好私域。当你想做，却一直没行动；当你纠结迷茫的时候；很'
docs/202306/KYgzdoQwhoA8inx2DE7cQlFin1f.md: '# 创业粉经验分享（视频类项目拆解）  > 来源：[https://hxrdzf4a0ay.feishu.cn/docx/KYgzdoQwhoA8inx2DE7cQlFin1f](https://hxrdzf4a0ay.feishu.cn/docx/KYgzdoQwhoA8inx2DE7cQlFin1f)  【初步简介】  大家好我是小鱼，20年大学生。23年6月7日大学毕业。接触互联网有几年时间了。小鱼这个IP，3个月变现30W。下面是我的自我介绍∶  【互联网IP】小鱼  【现实地址】河南  【思维逻辑】互联网暴利收益，暴力引流，发烧友  【早期经历】  ✔咸鱼有无货源，螺旋起号矩阵日收益2K，美女号全自动变现，单号日跑1K收益。小红书虚拟资源，日收益600+。  ✔单号单人暴力引流300+，均日引流单人一天200+  【我可以提供的】  ✔视频类项目拆解。引流创业粉，我自己的一些经验。  相信有很多人，跟我一样，刚进入社群这个大家庭。是迷糊的状态。前期我也是在专注于做项目。对于引流没太大的兴趣。但是随着认知和思维的精进，我发现了，做项目永远没有卖项目赚钱！  网赚项目有很多，眼花'
docs/202306/KnCAd0j20oC81ZxjQ6jctoFVnpb.md: '# 自己独自做项目，如何消除内耗、焦虑  > 来源：[https://jy0ck0ftw5.feishu.cn/docx/KnCAd0j20oC81ZxjQ6jctoFVnpb](https://jy0ck0ftw5.feishu.cn/docx/KnCAd0j20oC81ZxjQ6jctoFVnpb)  大家好，我是木婉，5期圈友，在生财收获最大的是开阔了眼界，以及随之而来的焦虑。可能你会疑惑，为什么焦虑也是收获，我能从这个收获中学到什么，怎么才能让焦虑成为我的动力呢？那么，你可以接着看下去。  #
