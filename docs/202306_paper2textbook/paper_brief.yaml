  7 位数的结果（职场另算）。2018 年底我写过一篇“K12 教育行业必将遭受政策铁锤，建议避开投资”的报告，给当时的老板避免了千万起步的损失（详细逻辑见《[认清现实，别再逼孩子无效内卷了](https://mp.weixin.qq.com/s/V_3kuok2oEvS3jh4xv3LZw%E5%86%85%E5%8D%B7%E4%BA%86)》）。此外，我也是一名连续创业者，从海外奢侈品代购到剧本杀到如今的商业政经类知识付费博主。    自从加入生财，一直在琢磨可以分享点什么。因为我个人比较擅长对未来大趋势和风向的判断洞察，对世界底层逻辑的分'
docs/202306/20230613_183.md: '# 小马宋：为什么学了那么多，总是没结果？  > 原文：[`www.yuque.com/for_lazy/thfiu8/pe2q0rlc8algz1wz`](https://www.yuque.com/for_lazy/thfiu8/pe2q0rlc8algz1wz)    ##
  (107 赞)小马宋：为什么学了那么多，总是没结果？   作者： 小马宋   日期：2023-05-24   为什么学了那么多，总是没结果？   有一次在给准备一家企业演讲大纲，企业方反馈说这些案例我们都听过了，让我换一些新案例。   后来我就说，你要是要求这么多，那就算了吧，我也没时间准备新案例。   这让我咋说呢，确实很多案例大家都听过了，但我看你们也都没学会啊。   吗为啥会出现这种情况？这就是学习的问题。因为知和行，是两回事。   其实有用道理都没有那么多，也都很简单，只是我们知道，但不会去执行而已。减肥的道理，其实绝对简单绝对正确，就是少吃多动，但，没人能做到。   群里也有朋友说，我知道回家就刷手机不好，应该看书学习，但就是止不住，几个小时就过去了，心里说，明天就不这样了，其实明天还是一样。   '
