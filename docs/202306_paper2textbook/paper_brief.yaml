  (100 赞)自己独自做项目，如何消除内耗、焦虑   作者： 木婉   日期：2023-05-25   《自己独自做项目，如何消除内耗、焦虑》   大家好，我是木婉，5
  期圈友。   在生财收获最大的是开阔了眼界，以及随之而来的焦虑。   可能你会疑惑，为什么焦虑也是收获，我能从这个收获中学到什么，怎么才能让焦虑成为我的动力呢？那么，你可以接着看下去。   本篇的核心思想：情绪——思想——行动   亦任大佬说过，焦虑是好事，是能促使你向上的动力。   而且，有焦虑是一件很正常的事情，他也天天焦虑，他所
  知道的身价几十亿的老板也天天焦虑，这个时代，不焦虑是不正常的。   并不是罗振宇贩卖焦虑，也不是互联网贩卖焦虑，而是，你只要想成长，想赚钱，想要突破现状，必然是会感受到痛苦。   全篇请移步飞书啦~   第一次写帖'
docs/202306/20230613_177.md: '# 职场新人不得不知晓的赚钱四个阶段  > 原文：[`www.yuque.com/for_lazy/thfiu8/rybg1awyd60feg5f`](https://www.yuque.com/for_lazy/thfiu8/rybg1awyd60feg5f)    ##
  (59 赞)职场新人不得不知晓的赚钱四个阶段   作者： Aarom °🐟   日期：2023-05-25   职场新人不得不知晓的赚钱四个阶段   我们绝大多数人从小到大关于财富的教育是空白的，甚至很多认知是有严重误区的，陷入贫穷陷阱。很多人思路的误区无非两个，要么认为赚钱可以靠十倍的勤奋和努力，就会有高人一等的回报，要么他一直在幻想出现一个机会，然后自己就能像做火箭一样实现财务自由，这两种思路，前者根本行不通，后者概率又极小。真正有效的能够循序渐进的方法是升级你的赚钱段位。没错，赚钱的模式它有非常明显的四个段位。   第一个段位是出卖时间和劳动力赚钱，这时候你是一个廉价零件。   第二个段位是用产品或服务赚钱，这时候你是一个能和市场直接交易的超级个体。   第三个段位是用商业系统赚钱，这时候你是一个资源的构建者'
