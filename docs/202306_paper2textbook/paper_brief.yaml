  (148 赞)小马宋：商业在模仿中发展，儿童在模仿中长大   作者： 小马宋   日期：2023-06-01   商业在模仿中发展，儿童在模仿中长大   今天是儿童节，聊一聊孩子成长和商业发展的话题。简单来说，孩子是在模仿中成长的。他们从小模仿父母，朋友，和社会。   所以，一个民族才会形成某种性格，这个跟基因无关，与模仿律有关。   今天的内容，来自《模仿律》这本书。   法国传播学鼻祖塔尔德所著的《模仿率》中揭示了这个规律，民族或者国家独有的传统和文化，不靠基因传递，而是靠模因传递下去。   模仿有几个基本规律，第一是从上到下，一般下层模仿上层，总是从强势的一方向下流动。   比如明星穿搭最容易被群众模仿。而飞跃鞋的再次兴起，起源于时尚之都巴黎对飞跃鞋的发掘。而巴黎人对飞跃鞋的崇拜，源自中华武术高地少'
