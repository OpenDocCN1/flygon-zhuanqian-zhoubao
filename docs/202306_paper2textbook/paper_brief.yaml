docs/202306/HEajdvRmbozwitxgBD3chKlDnbe.md: '# 别再发low到爆的GPT秒出高考作文了！一文讲透AI在文字创作中的正确使用姿势  >
  来源：[https://fjt9w880tn.feishu.cn/docx/HEajdvRmbozwitxgBD3chKlDnbe](https://fjt9w880tn.feishu.cn/docx/HEajdvRmbozwitxgBD3chKlDnbe)  高考作文出炉了，这个热点，怎能不蹭？  已经有很多AI公众号和朋友圈里的朋友展示了他们用AI生成的高考作文。  这个话题，我本不想蹭。  但看了那么写出来的文章，我觉得，除了蹭热点，我还有一个不得不写的理由。  我看到太多人使用ChatGPT在文字创作重点的误区：  使用GPT来解决问题是一个过程，但太多人将其当做两点一线。妄想给内容出结果，用你这个思维，我认为你在高考时也手写不出啥好文章来。  我不希望仅限于用我的方法给大家写几篇作文，我想从这个话题中挤出一些有益的养分，给到大家。通过这样一篇思考，解决问题的过程，把写出高考作文作为一个载体，来由小及大，讲清楚更大的一些点。  下面我还是先讲大家大概率会比较喜欢的部分：小凡怎么用GPT来生'
docs/202306/HIHVdkYbWoksdhxeBdBc9qNKnAb.md: '# 用chatGPT撰写主播直播话术（保姆级文档）  > 来源：[https://ixzs13ngb9.feishu.cn/docx/HIHVdkYbWoksdhxeBdBc9qNKnAb](https://ixzs13ngb9.feishu.cn/docx/HIHVdkYbWoksdhxeBdBc9qNKnAb)  ##
  为什么要写这篇文章  因为大部分做直播地都是败给直播稿件，而如何高效率地辅助创作直播稿件是每一个直播间都应该着重思考的，这个不是简单的搬运改变那么简单，而是如何让AI学习这个模型并且优化。  直播稿件的完善对于一个直播间非常重要，如果主播不喜欢出面可以不露脸，但是如果一个主播在直播的时候没法熟悉直播内容，直播话术，并且根据场景应对，那么直播必定失败。  可是很多主播还是没有那么多能力去写好一篇话术，更多直接抄，那么久导致内容比较生硬，不生动，而且主播也会缺少主动性。  结合chatGPT撰写主播直播稿件，可以说是省时又省力。  ##
  直播话术预审  https://school.jinritemai.com/doudian/wap/article/aHaumkNKZ'
