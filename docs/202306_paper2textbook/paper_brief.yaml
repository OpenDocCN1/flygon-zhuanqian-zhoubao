  文章内容  ## 一、迎接AI时代的态度  在AI时代来临之际，我们首先需要端正我们的态度。  ### 保持冷静和平和  过分紧张和激动可能导致我们无法正确评估AI技术的实际影响。  恐慌和担忧并不能为我们解决问题，  反而可能阻碍我们在这个时代中找到自己的位置。  ###
  适度关注AI相关内容  我们应该了解AI技术的发展趋势，但无需过分沉迷于其中。  只需要关注同行业的人使用的什么AI工具，如何应用AI工具，  自己再了解AI技术的最新动态，发现和自己行业相关的工具抓紧用起来  已经足够应对AI时代的挑战。  这样一来，我们可以在不被AI技术过分影响的情况下，  稳步应对AI时代带来的变革。  ##
  二、AI时代与普通人的关系  AI时'
docs/202306/Z073dMlcmomg5CxeZKQcd5Y6nVg.md: '# 思维语录制作保姆级教程（图片会说话）  > 来源：[https://ixy2s5ruvqf.feishu.cn/docx/Z073dMlcmomg5CxeZKQcd5Y6nVg](https://ixy2s5ruvqf.feishu.cn/docx/Z073dMlcmomg5CxeZKQcd5Y6nVg)  思维语录，老人图像、小和尚图片会说话，月涨粉10w+  大家好，我是云天，
