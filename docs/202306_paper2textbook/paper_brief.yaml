  (134 赞)做公司，心太软，人难管。心太硬，人情淡   作者： 小马宋   日期：2023-06-09   做公司，心太软，人难管。心太硬，人情淡——创业 46
  条之 19   做公司是个很难的事，它并不是说你有一点特长就能干公司的。在员工看来，几乎没有一家公司是完美的，事实就是这样，因为做好一家公司真的是太难了。   就说管理这件事，我遇到的企业家中，什么样的都有。有的真是大好人，他创办公司十年了，没有主动开除过一个人，当然大家很喜欢这样的老板，但坏处是吃闲饭的人太多，反正也不会被开除。不过公司运气好加上老板其他方面能力强，确实赶上了几个风口，增长会掩盖一切问题。   我也遇到过极其严厉的企业家，甚至把员工送进了号子里（贪污受贿），这样的老板呢，员工真的害怕，每个人都战战兢兢，稍微有点能力的也干不长，老板'
docs/202306/20230613_006.md: '# 快钱慢钱都是钱  > 原文：[`www.yuque.com/for_lazy/thfiu8/bzfllsag2favqzps`](https://www.yuque.com/for_lazy/thfiu8/bzfllsag2favqzps)    ##
  (121 赞)快钱慢钱都是钱   作者： 小马宋   日期：2023-06-06   快钱慢钱都是钱：创业 46 条之 18   创业，我们有各自的目的。有人只是想改善一下生活，有人则是想带人来飞向火星，所以创业的目的决定了我们的做法，你想赚一笔就走，还是想在这个行业深耕，都没有对错，只要你能接受结果就可以了。   许多有理想的朋友，看不上那些挣快钱的，我不这么认为，快钱也是钱，慢钱也是钱，这只是一种选择，跟谁好谁坏没关系。   这让我想起《潜伏》里一句台词，特务谢若林说：这两根金条，哪根是高尚的，哪根是龌龊的？   尤其是在巨大的不确定形式下，我觉得落袋为安，赚点快钱反倒是更好的选择。   当然也有人志存高远，想做一家伟大的公司，那也没问题，慢慢来，以十年甚至五十年的周期去规划你的行动，你可能成为一家伟大公司的缔造者。   生财上'
docs/202306/20230613_007.md: '# 不懂商业模式，忙死就是赔死  > 原文：[`www.yuque.com/for_lazy/thfiu8/gc74f0hczr5ugfh8`](https://www.yuque.com/for_lazy/thfiu8/gc74f0hczr5ugfh8)    ##
  (51 赞)不懂商业模式，忙死就是赔死   作者： 我们都是小霸王   日期：2023-06-07   不懂商业模式，忙死就是赔死   一、关注商业模式   商业模式越好，经营的确定性越高，风险越低。所谓商业模式，就是赚钱的方式。那到底什么是赚钱的方式呢，大学里的教授可能可以给一个定义，但是怎么让普通人也能懂得这其中的意思。   利润=（收入-成本）x
  频次 x 周期。   好的商业模式，就是赚钱，高频，可持续。这个公式里，第一个关键变量，就是成本。   二、关心成本优势   人力成本，资金成本，智力成本。   因为每个人的成本优势不同，对成本的控制能力就不同，巴菲特亏
  1 个亿，就是正常波动，我亏 100 万，我就被清零了。所以就资金成本来说同样的额度，对于不同的人，他感受到的风险是不一样的。我们尽可能的找自己成本可控'
