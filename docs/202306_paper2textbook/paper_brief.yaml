  一、社群是个好产品   从用户角度来看，社群是一个人脉和信息的集散地，可以帮我们在创业这个路上获取到极大的帮助。   从运营角度来看，社群是一个复利的产品，可以持续年复一年得收取群费，沉淀粉丝，沉淀信任。   如果是人脉和信息，那社群主是最大的获取利益者，因为所有的信息社群主掌握的最多。   其次还可以通过社群的信任沉淀去一起合作做项目，也可以筛选优秀的人才。   ###
  二、社群是个难产'
