docs/202306/QPXydAae2o8nYFxuMdbcx8xhngf.md: '# 从0-1，参加小红书航海，1周卖资料变现4000+  > 来源：[https://jegjd0iktt.feishu.cn/docx/QPXydAae2o8nYFxuMdbcx8xhngf](https://jegjd0iktt.feishu.cn/docx/QPXydAae2o8nYFxuMdbcx8xhngf)  大家好，我是瑞克，是这次生财航海中的一员，本次小红书运营通过收集爆款笔记数据，并且模仿爆款笔记标题、封面和内容，最终由小红书笔记引流微信公众号卖资料，一周变现4000+  在这里要非常感谢本次航海我们组的志愿者琰姐@琰（Joyce），极其的认真负责，在本次航海的过程中为我提供了极大的帮助和支持！并且帮助我们组成员快速上手，成功上岸！  小白进了生财请注意分辨，建议老老实实的航海，完成从0到1的过程，切记不要想着一飞冲天。  本次航海店铺部分收益如下，一周变现4000+，后续3天变现1000+，目前转换模式为辅导服务，单价在1000-2000。  ![](img/797b6612f508dd34bf3a3c9c9febe72a.png)  做了两个账号数据如下：  !['
docs/202306/QRLidI7zHoJxWix3Dr1csKObnsc.md: '# 引流团队管理分享：如何做到小红书单月引流13000＋，全年变现1000万＋㊙  >
  来源：[https://v4y8yg9y6n.feishu.cn/docx/QRLidI7zHoJxWix3Dr1csKObnsc](https://v4y8yg9y6n.feishu.cn/docx/QRLidI7zHoJxWix3Dr1csKObnsc)  大家好，我是佳能，生财潜水新人，谢无敌老师的关门弟子，目前在做线上教育类目，今天主要给大家分享一下我做小红书以及团队管理的一些经验。部分知识来自于谢无敌老师的实战营@谢无敌。  先做个自我介绍，今年是我工作的第
