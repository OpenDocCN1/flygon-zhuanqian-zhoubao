docs/202306/PxUIdhkj1oT256xg3gFcScIZnn6.md: '# 《AI 头像壁纸号项目全流程拆解》  > 来源：[https://ry5hwpuf7b.feishu.cn/docx/PxUIdhkj1oT256xg3gFcScIZnn6](https://ry5hwpuf7b.feishu.cn/docx/PxUIdhkj1oT256xg3gFcScIZnn6)  《AI头像壁纸号项目，3种热门关键词+私人定制法，从零到一全流程拆解！》  大家好，我是吴东子，内容行业骨灰级玩家，同时也是一个AI探索者  我的所有资料都在公众号「吴东子AI」  这段时间给大家分享了多篇AI实操干货文章，最近越来越多朋友评论“东子出品，必属精品”  非常感谢大家的喜欢，但精品可不敢当  就像李笑来老师说的“知识传递本身不是教育，让教育真正起作用的，主要靠的是吸收者”  如果我的分享能实打实地帮助到大家行动，那才是真正有意义的  很多朋友关注AI很久了，但始终停留在观望上，还没有行动  东子的建议是与其继续观望更好的项目，不如先试着迈开步子走走看  我接下来会对一些AI项目进行“奶奶都能听懂级”落地实操拆解，大家如果发现有自己合适或者擅长的，不妨试试看  今天分享的'
docs/202306/QFpVd2N7Pof208xlclccjeg3n9e.md: '# 《抖音图文带货非常好做，小白，想做副业的朋友可以冲》  > 来源：[https://auyrlu2gke.feishu.cn/docx/QFpVd2N7Pof208xlclccjeg3n9e](https://auyrlu2gke.feishu.cn/docx/QFpVd2N7Pof208xlclccjeg3n9e)  大家好，我是钱劲，加入生财两年了，这是我第一次发帖。  今天看到盗坤分享的抖音图文二创带货，刚好我也在做，虽然没拿到大结果，但算把整个流程跑通了，只要发图文视频都会出单（几百播放就能出单）所以写这篇文章，来给在找项目，想做副业的圈友打打气!  图文带货，可以直接冲！简单易上手，适合小白！！（我想刚开始做的人给新手分享经验更能增加他的信心吧？）  ![](img/becb6ae7080816db6b28e42a7cc789a7.png)  抖音图文现在是风口，有流量扶持，而且抖音图文投流已经在内侧了。  #
