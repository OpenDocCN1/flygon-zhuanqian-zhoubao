  来源：[https://kyjhe9yxvm.feishu.cn/docx/Ecr6dapIPoqmF2xtF7GcISGOnSh](https://kyjhe9yxvm.feishu.cn/docx/Ecr6dapIPoqmF2xtF7GcISGOnSh)  先看数据。  流量主收益：  ![](img/b31f0a2195949cfd206acee850162178.png)  部分阅读量：  ![](img/925387a933f038d338f85f5a37f126a4.png)  我是见川，公众号领域累积粉丝20w+。  这是我在做公众号过程中机缘巧合下做的一个文案类型公众号。起因是一个以前没怎么用的公众号，我想着放着也是放着，就想做一个文案号当做乐趣。当时是0粉丝，没想到几天后我发现阅读量破千了，接连几天都是这样。  于是我意识到这可能是个机会，于是我优化了一下图片标题排版等内容。很快便做出来一个均阅3000+，最高10w+的公众号，后来我利用这套逻辑，接连测试了几个小号，都达到了0粉丝阅读破千。 '
docs/202306/EczedcCNzo6yUEx3IsacIGvOnkc.md: '# 亦仁说在生财人人都有赚百万的机会，看完这篇【信息差】万字整合贴，你会明白这句话的。  >
  来源：[https://mkfwp3u79v.feishu.cn/docx/EczedcCNzo6yUEx3IsacIGvOnkc](https://mkfwp3u79v.feishu.cn/docx/EczedcCNzo6yUEx3IsacIGvOnkc)  #
