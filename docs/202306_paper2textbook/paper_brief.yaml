docs/202306/RIWqd7dg3oTe0OxstEacTLgAnff.md: '# 做私域营销，不得不掌握的100个技巧，学会效率翻倍。  > 来源：[https://dakhb269es.feishu.cn/docx/RIWqd7dg3oTe0OxstEacTLgAnff](https://dakhb269es.feishu.cn/docx/RIWqd7dg3oTe0OxstEacTLgAnff)  各位圈友大家好，见贴欢喜，我是罗卜，非常感谢圈子提供的优质圈子，感谢我的老师@靠谱的耐心指导及给予的建议。  先简单介绍下自己，我是今年加入生财的小白，90后创业者，换过多个行业，一直在读书打卡社群、跑步圈、二手机初步实现变现，通过自学也做了一门竖屏导图课程，并跑通变现。  这篇私域营销100个小技巧，主要从三个方面介绍：  1.微信聊天  2.微信设置  3.微信朋友圈  基于此，个人也找了许多资料，也通过在生财往期精华帖学习，汇总了100个私域营销小技巧，很多时候我们并没有在意这个功能的出现，可以给我们带来哪些便利，是否可以用在私域营销中，让我们效率翻倍。期望这篇文章可以给大家做个参考。  说在最前面，微信是大家一直在使用的工具之一，有些人把它当聊天工具，有些人'
docs/202306/RPpmdimVwoz0VLxjMdlcVRKqnme.md: '# 1条没中标的风向标，让我多赚了4位数  > 来源：[https://gq2psr73l6v.feishu.cn/docx/RPpmdimVwoz0VLxjMdlcVRKqnme](https://gq2psr73l6v.feishu.cn/docx/RPpmdimVwoz0VLxjMdlcVRKqnme)  #
  一、引言  亦仁：江湖赚钱看生财有术，生财有术赚钱看风向标！  第七期中标风向标合集：https://qr19.cn/E2fmDr  大家好，我是Ray，第七期新人，之前成功通过白嫖生财在4.3号前赚到第一张门票钱。更多细节，可移步先前文章
  ：第七期还没开始，我已经通过白嫖生财赚到第一张门票了。  今天看到亦仁发帖说一位圈友，因为在生财看到了一条信息差，多赚了 8 位数，这条信息差还藏在一篇文章里面不起眼的小角落里面，发的人可能本身也没意识到。  恰好上两周我也是看到一个风向标，然后立刻模拟执行，实操几天多赚了4位数。  ![](img/6f7304c04a8cecb7467deb97a8d37e71.png)  ![](img/99a4d4ee2a62aaf7359b0b'
docs/202306/RiuddMx03o2GJSxylBgcGfVXnXb.md: '# 我是如何逆袭自己DIY为孩子申请世界top10名校研究生的  > 来源：[https://zv0h2ktoy4h.feishu.cn/docx/RiuddMx03o2GJSxylBgcGfVXnXb](https://zv0h2ktoy4h.feishu.cn/docx/RiuddMx03o2GJSxylBgcGfVXnXb)  各位生财圈友，大家好！我是绍芸。加入生财9个月了，看到了许多优秀圈友们写的文章，对自己帮助很大。所以我想，自己也要拿出干货来回馈大家，希望我的分享能对圈友们有帮助。我今天分享的主题是：如何自己DIY（不用中介）申请世界名校，以及我在申请过程中踩过的坑。  先说申请结果：我家孩子最终上了世界排名top10的英国大学读研究生。  ![](img/bf22f6101b3213cad33bbc3990afb03a.png)  在我申请成功以后，消息迅速传遍全单位和朋友圈儿，以后不停的有朋友及同事来向我咨询如何做留学申请。这两年，在我的指导和帮助下，已有多名孩子成功申请到了美国、英国等排名前30的学校，其中也包括部分美国藤校。  ![](img/119bf4ab29'
docs/202306/RmGidmCRcoQEJ6xre2Zcm9UqnXd.md: '# 大厂裸辞一年半，跑通职场个人IP，千人私域半月被动收入近六位数，我的历程分享  >
  来源：[https://j7329dxmbu.feishu.cn/docx/RmGidmCRcoQEJ6xre2Zcm9UqnXd](https://j7329dxmbu.feishu.cn/docx/RmGidmCRcoQEJ6xre2Zcm9UqnXd)  大家好，我是赵立心（原名AI君），95后，前大厂产品经理，做个人IP两年，裸辞一年半，目前是一名职场个人IP孵化教练。  一开始做IP的时候，我是无资源无背景，没有业余的自媒体账号，微信好友仅1000人，半年不发朋友圈的小透明。  到上个月的时候，我实现了靠3000私域好友、1000粉公众号和4000粉小红书，半个月被动变现近六位数的净收入。基本都是一两个月从认识到转化，也几乎没有什么沟通。  这种模式对于一个普通职场人来说是非常舒服的，不需要维护太多好友和产品，不需要做太多的销售转化沟通，也不需要搭建和管理团队，一个人的时间精力就能搞得定。  这是我做个人IP两年，微信端的变化情况。  ![](img/d48d2476f92d004c245'
