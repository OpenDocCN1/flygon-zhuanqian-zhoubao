docs/202306/KBlWdtwzOo1B2hxB11BcXoeGnJc.md: '# 如何利用好生财有术找对自己另一半  > 来源：[https://fcf4a0devm.feishu.cn/docx/KBlWdtwzOo1B2hxB11BcXoeGnJc](https://fcf4a0devm.feishu.cn/docx/KBlWdtwzOo1B2hxB11BcXoeGnJc)  大家好，我是小毛  一个90后，自媒体公司小老板，《小毛聊创业》主理人。  之前写文都是项目、创业认知相关的分享文，所以用的这些title  ~but  今天的主题，请忘记掉这些，我重新给一个title,再来一遍介绍  大家好，我是小毛  一个23岁恋爱，24岁结婚，25岁生有第一小孩，26岁生有第二个小孩（三年抱俩）的幸福男人。  今年我29岁，另一半和我一起经营着当下的公司，是我事业上的得力助手，如果只是用本金和欲望的公式来计算，对于欲望值不高，满足现在小日子的我们来说，在某种程度上，也属于财富自由了。  昨两天，520，生财有个发对象的活动，我也打卡参加了，写下了一段我对于找对象的一种观点，同时也借助平台，为我团队的小姑娘广告了一波，之后还挺多人加她的。  ![](img/c8b'
docs/202306/KVBedKyOnot7X8x5IQocbxEVn4d.md: '# 老项目也有春天，小程序推广计划保姆实操手册分享  > 来源：[https://f9ii5g947k.feishu.cn/docx/KVBedKyOnot7X8x5IQocbxEVn4d](https://f9ii5g947k.feishu.cn/docx/KVBedKyOnot7X8x5IQocbxEVn4d)  大家好，我是温酒，上次发帖子还是在上次，  陪跑小程序推广计划两个月，来给大家送把铲子。  【昵称】温酒。  【所在地区】广东茂名  【标签】  私域流量，项目闭环，搞钱  【自我介绍】  94年自由职业者，喜欢围观新事物，寻找出金点，  ⭐21年-22年上半年带朋友一起跑小程序推广计划，团队收益70万，个人变现20万（被动收益4万）  ⭐22年下半年，小说推文项目闭环，团队百万GMV，个人变现30万(被动收益25万)  目前正在陪跑小程序推广计划。  【提供资源】  AI绘画变现思路，姓氏头像定制，迪士尼头像定制  小程序变现思路，通过平台自带团队分佣体系搭建团队，轻运营实现被动管道收益  #
