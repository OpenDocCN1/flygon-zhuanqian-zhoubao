  (精华帖)(392 赞)在生财，我通过“做废了 8 个号”和持续的分享，找到了“正确的道路”   作者： 驯龙师张岩   日期：2023-05-23   大家好，我是生财航海家圈友【驯龙师岩姐】。轰轰烈烈的小航海又开始了，有很多新圈友又开始登船，起航。在远航中，会收获绝美的风景，也会遇到各种风暴。   值各位上船之际，本文特献上我做废了
  8 个账号的复盘，与大家分享我的教训和收获。   阅读本文，当能收获以下几点：   1.  我基本把一个新手做自媒体账号会犯的错误全部犯了。如果你是自媒体的新人，可拿我当反面教材。如能避开我所犯的错误，你做成的概率一定增加好几倍。   2.  我做废了那么多的号，却能不以为耻反以为荣，拿来公开分享，并收获分享红利，这是生财所带来的力量。希望读到的'
