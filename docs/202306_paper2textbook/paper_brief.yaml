  一、小红书和用户一起做爆款玩具的几个阶段  ## 阶段一：发帖分享自己做的玩具，测试用户反应  笔记模版：真实图片拍摄（真实场景拍摄）+标题（关键字：宝宝、妈妈、原创）+内容（搭建过程，尽可能描述简单，看似可以模仿）  举一个案例：  ![](img/2a1ffba4e24042b20912a'
docs/202306/W8wjdOat3o0F5xx2UpIcsTienge.md: '# 小红书禁言发起人的复盘：一个项目的诞生与“毁灭”  > 来源：[https://uwdpzjnryu8.feishu.cn/docx/W8wjdOat3o0F5xx2UpIcsTienge](https://uwdpzjnryu8.feishu.cn/docx/W8wjdOat3o0F5xx2UpIcsTienge)  风向标，小白到底怎么使用？  #
  前言  大家好，这里是北京圈友【苍述】。  在5月25日，我在风向标中分享了一个具有完整流程的，门槛极低的，几乎是看了去做几十分钟就能赚到钱的蓝海项目：小红书群聊禁言。风向标被先中标，后加精华。证明亦仁大大也是比较认可这个标的价值的。  靠着生财的曝光，这个本来市场上几乎没有人做的项目，在两天时间内超过千人下场，小红书相关笔记增加超过2000篇。短短三天，帮别人禁言一个号的客单价已经从99元被卷到9.9元一次。到目前可以说小白再下场也只能赚到一些辛苦钱了。  这篇文章，会给这个项目的发现到卷成红海做一个复盘，并且会更清晰给小白做一个教学：  风向标，小白到底怎么用才能到赚钱。  ![](img/725d2b219d7b8427909'
