docs/202306/EdTrd7M82oEZ1QxUOh2cKYJgnIi.md: '# 5.0分，区域排名第一的美团店铺是如何运营的？  > 来源：[https://q6rpgbg9y1.feishu.cn/docx/EdTrd7M82oEZ1QxUOh2cKYJgnIi](https://q6rpgbg9y1.feishu.cn/docx/EdTrd7M82oEZ1QxUOh2cKYJgnIi)  大家好，我是周先生  前几天分享了棋牌室的案例复盘https://t.zsxq.com/0erTP2s2w，很多伙伴看到后问我，美团到底要怎么样操作才能把评分和排名拉上去，5.0评分是怎么做到的，能不能分享下具体操作细节。  今天就给大家分享一篇我总结的美团提升排名和评分的技巧。  ###
  一、抖音如日中天，美团还能做吗？  虽然现在抖音本地生活如日中天，各大平台也在下场争夺这块蛋糕，很多人会觉得美团不如当年了，以后肯定会被抖音瓜分掉巨大的份额。但毋庸置疑的是，到了现在美团仍旧是本地生活的王者，短时间内它的江湖地位无人能撼动。  早在21年，我就这篇文章中预测过https://t.zsxq.com/0egxbGf2F，抖音下场做团购，美团的体量只会增加不会减少。  ![]'
docs/202306/EmnDdCjCUoycIzxivp1cUyHlnHc.md: '# 全职妈妈写作8年，用260w稿费换了一套学区房！  > 来源：[https://h4zarzxodm.feishu.cn/docx/EmnDdCjCUoycIzxivp1cUyHlnHc](https://h4zarzxodm.feishu.cn/docx/EmnDdCjCUoycIzxivp1cUyHlnHc)  #
  一、前言  大家好，我叫张丹！一个写作8年，挣到大约260w稿费，给我家换了一套学区房的全职妈妈！  我算是非主流妈妈，从来不鸡娃！我的人生目标：好好鸡自己，给我儿打下江山，让我的好大儿当上富二代！  我一直在做副业，写作8年，小红书3年！目前一共做了三个小红书账号：  1、知识付费的写作IP，粉丝量：1.2万  2、无货源电商的，粉丝量：1271  3、一个电商账号，粉丝量：1138  今年小红书电商是趋势所在，所以我会把一半精力放到这两个电商账号上。未来的发展路径是：无货源电商——笔记带货——店群——直播带货——高客单个人IP带货～  电商大号，一共卖了一万多，差价赚了大概一半左右，也就是七千多！  ![](img/e7d6feb062c3320f05fe463'
docs/202306/EoiedT1iZozZvOxArLBcbCIpnBg.md: '# 小红书5个月做到10000个精准粉，变现20万秘籍分享（看懂价值百万）  >
  来源：[https://bd5shvz1qn.feishu.cn/docx/EoiedT1iZozZvOxArLBcbCIpnBg](https://bd5shvz1qn.feishu.cn/docx/EoiedT1iZozZvOxArLBcbCIpnBg)  大家好，我是舒丽。是新加入的生财圈友。  应生财鱼丸老师邀请，给大家分享一下我小红书5个月万粉，变现20万的经验。  如果你是一个知识IP，想在小红书开拓流量，快速吸引精准粉丝，引流变现，这个帖子应该可以给到你帮助。  我是从2022年3月份开始着手做小红书的，算是开始得比较晚的。  我做小红书的目的很明确，一方面是想分享自己这些年写作经验和心得，梳理下写作历程；  另一方面现在写作班招生越来越困难，需要从各个自媒体平台，吸引一些精准粉丝到私域转化。  所以，我一开始给自己的定位就是写作博主，我不是冲着广告变现去的，所以这个定位也决定了广告商很难来找我。  你在做账号定位时，要根据自己的变现目标来，一开始就要想好你要靠什么变现，变现路径怎么设定。 '
