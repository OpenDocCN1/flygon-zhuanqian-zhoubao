docs/202306/OpXIdbXvZoXp1HxU0BLcH4TtnHe.md: '# 商品分类表：各类别所涉及商品及服务领域  > 来源：[https://iwvmcwbm4c2.feishu.cn/docx/OpXIdbXvZoXp1HxU0BLcH4TtnHe](https://iwvmcwbm4c2.feishu.cn/docx/OpXIdbXvZoXp1HxU0BLcH4TtnHe)  ###
  商品/服务选择的3大原则  1-确定商标所使用的范围（注册的商品主要是用来干什么的？）确定好类别（可以是多个类别）  2-确定商品（实际销售/服务涉及到的）  3-同类别不同群组的防御性保护策略  ###
  提示注意：  在选择商品或者服务项目时，不能使用类别名称或者类似群组标题名称；而应该选择类似群组下具体商品或服项目。  例如：第十一类的类别名称是：照明、加热、蒸汽发生、烹饪、冷藏、干燥、通风、供水以及卫生用装置。  1101群组的名称是：照明用设备、器具（不包括汽灯、油灯）  而应该选的商品是：群组名称下面的“灯泡”。  ![](img/504e129d824c45fddcaebfe23e6545e9.png)  ![](img/6911eda2bce0fb545'
