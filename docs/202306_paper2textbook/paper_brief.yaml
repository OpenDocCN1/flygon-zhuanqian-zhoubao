  (15 赞)最近我是怎么把跑步坚持下来的？   作者： 叨叨申   日期：2023-05-24   最近我是怎么把跑步坚持下来的？   一直有颗跑步的心， 却总是三天打鱼两天晒网。其理由如起晚了，太热了，雾霾了等等。   久而久之，便把无法坚持，当做自然。再跑时，心中便已经有个声音，“坚持不了几天”。   可偏偏这次，坚持时间超出预期。其原因主要在于我与一名好兄弟，每天彼此打卡。   两人总是废话少言。每天你一图，我一图。顺带各自有两句鼓励话。仅此简单的行为。却让两人将跑步坚持下来。
  若我今天起晚了，没时间了，我就晚上跑。若今天下雨了，天不好，我就走廊里跑。若天热了，我就找个树阴下，往返跑。办法总比理由多。 目的只有一个，今天的打卡图，得发出来。   可他从未给过我训斥，催促。
  我们也并没有缺卡惩罚之类的制度。那为什'
