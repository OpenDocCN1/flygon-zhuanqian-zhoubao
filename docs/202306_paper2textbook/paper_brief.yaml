docs/202306/VFwTdYT25oHECPxsoVbcf05in3c.md: '# 做高客单闲鱼五个月的一点心得和成绩  > 来源：[https://cxf1s7tdub.feishu.cn/docx/VFwTdYT25oHECPxsoVbcf05in3c](https://cxf1s7tdub.feishu.cn/docx/VFwTdYT25oHECPxsoVbcf05in3c)  #
  前言  圈友们大家好，我叫金又又，星球编号5575。  今天主要想和大家分享作为新生的我们，普遍会处在一种状态，除了那些项目已经很稳定了，但是大多数人付费是为了提升自己的认知，是为自己可以找寻一份除了主业还有一份稳定的副业收入，我们可能会一直迷茫一直犹豫，诚然，我就是这样过来的，今天就是通过我的一点心得分享出来，希望对新生能有收获。  加入了几个知识星球，曾报名学习了视频号、小红书爆款笔记、直播切片、红包封面、问卷调查，有项目就去学习了解。  但是那时候自己的执行力没有拉满，并且很急切想要得到一个正反馈，所以由于个人原因。  期间报名了付费项目【京东短视频】，在这期间看到有很多人是从我这里下单，但是显示在后台却发现没有一点收益。  ![](img/31c29bec45b10474'
