docs/202306/FCekdjKiYoqbe6xUOxVcooOUnCb.md: '# 运营新手，从0到1家居类社群免费向付费转型，深度变现的经验  > 来源：[https://sebz0gwoxb.feishu.cn/docx/FCekdjKiYoqbe6xUOxVcooOUnCb](https://sebz0gwoxb.feishu.cn/docx/FCekdjKiYoqbe6xUOxVcooOUnCb)  #
  惊！这些居然都不是社群？  作为一个体制内幼教，爱折腾房子的土豆妈，在社群运营方面完全是个新手，曾经创建过宝妈购物群、装修围观群，副业赚钱经验分享群等等，但经过3月社群运营大航海深入学习之后，才发现那些群都称不上真正意义上的社群。  这些无门槛的免费群都遇到了一系列共通的问题：  *   加入的新人很多是引流为目的地爆粉，拉低老群友的体验感。  *   群内聊天以闲聊、吐槽为主，没有价值，甚至充满负能量。  *   购物群变成广告发布群，销售额不增反而降低。  *   群内以群主发言为主，持续输出耗费大量时间、精力，得不到反馈，难以坚持输出。  *   群内活跃度越来越低，甚至发10个红包半天都没抢完。  ……  如果你的微信群，也遇到了同样的问题和困扰，'
