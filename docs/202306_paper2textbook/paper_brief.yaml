  来源：[https://fjt9w880tn.feishu.cn/docx/ATkmdw05so8PnCx0CEIcqEdXnMf](https://fjt9w880tn.feishu.cn/docx/ATkmdw05so8PnCx0CEIcqEdXnMf)  大家好，我是小凡。AI时代，让我们成为先富起来的那波人。  最近一方面在做系统化的小红书+GPT课程，另外也是在ChatGPT+自媒体创作中有太多课题可以写，但草草了事又觉得配不上咱生财的帖子质量。  今天终于憋出来一个很有意思，并且也跟大家去做自媒体创作息息相关的课题：  那就是，在小凡的调教体系里，大多数是我们自己去训练GPT，再让GPT来为我们服务写出文案。  可是我们大部分小白，其实本来就对抖音或者小红书的底层逻辑理解得不够到位，所以很多时候，我们对GPT胡乱教育一通，用我们三脚猫的本事，也没有教出一个厉害的文案大师（当然我看过一些小伙伴们的训练过程，其实提示词写得也烂的🤣🤣）。  那么有没有一种可能，让GPT先训练我们，再去训练GPT呢'
