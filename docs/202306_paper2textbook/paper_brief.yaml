docs/202306/FmHpdiE2ooK5kixlEfDc47pPnod.md: '# G：我的19岁，赚了100万  > 来源：[https://zwbfnc29pf1.feishu.cn/docx/FmHpdiE2ooK5kixlEfDc47pPnod](https://zwbfnc29pf1.feishu.cn/docx/FmHpdiE2ooK5kixlEfDc47pPnod)  19岁和一百万，这两个词放到一起怎么看都怎么觉得陌生，但是事实上却同时发生在我的身上，大家好我是高尚坏孩，一名十九岁双非大二在读。  从小我就是同学们眼中再普通不过的一个人，在学校哗众取宠，结交狐朋狗友，在家里孝顺父母，小店收摊摆摊。小学3年级的时候就去过网吧，以至于到高中之前我的梦想很简单——18岁成年的时候名正言顺的用自己的身份证去上一次网。  就是这样一个放到人群里都不会有人多看一眼的普通的不能再普通的人，现在手上握着50万流动资金，1年半的时间赚到人生的第一个一百万，我，是如何破局：  （文章涉及到很多故事，如果您忙的话，打开飞书目录，标题前打了✳️的都可以不看）  #
  ✳️入魔门：（小学）  2003年12月9日，我出生在湖南一个4线城市，不到一岁的时候就被带着到星城长沙生活'
