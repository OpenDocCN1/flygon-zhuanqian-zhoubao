docs/202306/LLvLdO3s8oHRoTxniOscOKDanEd.md: '# 《AI变现异常值案例库》——第1期  > 来源：[https://ry5hwpuf7b.feishu.cn/docx/LLvLdO3s8oHRoTxniOscOKDanEd](https://ry5hwpuf7b.feishu.cn/docx/LLvLdO3s8oHRoTxniOscOKDanEd)  《AI变现异常值案例库，5种方向10个案例，副业项目灵感启发》  第一期先分享5种方向，10个案例  1.宝宝起名号  2.AI热点资讯号  3.头像壁纸号  4.小说推文号  5.流量收益号  大家好，我是吴东子  我的所有资料都在公众号「吴东子AI」  本来想写一篇AI变现方法论，把AI现有的技术方向，应用场景，变现案例都整理出来  但实际写的时候发现难度太大了，因为人工智能这个话题太大了  小到把文字排版成PPT好像也能叫AI，大到汽车领域的无人驾驶技术，以及苹果前些天发布的眼镜用到的视觉追踪技术也叫AI  做不到相互独立和完全穷尽，就算强行用一个分类把他们分类了，也会失去“分类”本身所具备的指导意义  所以只好把AI变现方法论这个大话题先放一放，等我具备足够多的信息时再给大家'
docs/202306/LUmKdLd0AofzbcxFRkQcg56Rnnf.md: '# 《炼丹Lora终极攻略》  > 来源：[https://ry5hwpuf7b.feishu.cn/docx/LUmKdLd0AofzbcxFRkQcg56Rnnf](https://ry5hwpuf7b.feishu.cn/docx/LUmKdLd0AofzbcxFRkQcg56Rnnf)  《保姆级Lora炼丹教程，一站式整合包，让你实现真人模特定制》  大家好，我是吴东子，用奶奶都能听懂的方式分享可以落地实操的干货  我的所有资料都在公众号「吴东子AI」  最近发现很多朋友学会了Stable
  Diffusion后，都是停留在“玩”的层面。但我觉得让大家“用”起来，才是关键  于是我思考了很久，找出了SD在“应用”层面，最重要的两个功能：Lora和ControlNet  Lora负责把自己生活中有关联的人或物炼制成模型  ControlNet负责更好地“控制”这个“模型”  两者结合，你就能真正把SD用起来，无论是定制自己的真人模特，还是给某个商业产品做成模型，都可以实现  我自己跑了一遍全流程，确保每一步都是经过我自己验证之后，写了一个教程分享给大家  今天这篇是Lora的炼丹'
