docs/202306/XmpOd4X0Qos10mxeT3pccrKvnad.md: '# 从设计师到闲鱼卖货，2年副业赚30万+，我经历了哪些（上）  > 来源：[https://p2ls2mp3ij.feishu.cn/docx/XmpOd4X0Qos10mxeT3pccrKvnad](https://p2ls2mp3ij.feishu.cn/docx/XmpOd4X0Qos10mxeT3pccrKvnad)  #
  一、我是谁  各位好，我是青志。来自福建，主业是某互联网公司设计师。  关于副业，我尝试过不下6个互联网项目。  换了很多赛道，失败过、迷茫过，痛苦过。  从副业0收入，到第1单，到100单，2年收入30W+。  我来自农村，没什么背景，也没什么太大的资源。  也没有从欠债几百万到屌丝逆袭年入千万的跌宕人生。  有的是想以此篇文章和所有在赚钱路上奋斗的普通人一起共勉。  #
  二、职场顿悟  本着对设计的一腔热血，毅然选择了设计师这个行业，  但因为自己非科班艺术生，所以总觉得自己差人一等，周末都想着去公司加班学习。  没错，我就是那种打工思维根深蒂固，一心想做打工皇帝的人。  当然了，卷王就要有卷王该做的事：  每天下班后1小时的练习
  + 设计课学习。  '
