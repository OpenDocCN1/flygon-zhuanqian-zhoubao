docs/202306/XBphdNmROojezRxXGvacIHywnbO.md: '# 公众号爆文项目：1个公户代收50个公众号流量主收益  > 来源：[https://wirt1hqfsv.feishu.cn/docx/XBphdNmROojezRxXGvacIHywnbO](https://wirt1hqfsv.feishu.cn/docx/XBphdNmROojezRxXGvacIHywnbO)  圈友们好，我是花甲刺客，专注于搜一搜渠道的幕后玩家。  最近很多关于玩公众号在看一看爆推荐流量的，收益确实不错（当然也有很多做不起来的）。公众号流量主到底好不好做？其实已经有很多人放弃了的（公众号初期就有不少团队几千个号的在薅流量主收益），不过按最近的情况来看，感觉公众号流量主及相关项目这块又会慢慢复苏了，跟以前玩流量主的感觉不一样了。  玩过搜一搜的就知道，官方经常各种更新机制，玩公众号流量主项目的兄弟应该也能体会到流量一起一伏，甚至断崖的情况。那么如果手里仅有的几个号限流掉收录了，没号玩了；或者跑通了找到收益起来了，想矩阵放大又头疼解决不了新增账号的问题。  ![](img/3e801d96aed7e96795e2db07a4fbf76b.png)  ![](im'
docs/202306/XHNNdajhloRsH2xt2MKcWEXSnic.md: '# AI写作，一个稳定小富的成长型副业  > 来源：[https://y9r93uo8au.feishu.cn/docx/XHNNdajhloRsH2xt2MKcWEXSnic](https://y9r93uo8au.feishu.cn/docx/XHNNdajhloRsH2xt2MKcWEXSnic)  #
  一、前言  我一直相信一个理念，AI只是一种新的技术，有人嗤之以鼻，有人用来提高效率，但我相信利用AI可以让普通人做成一些之前做不到的事情，甚至直接变现。  后来在圈子里认识了向南和荷包蛋糕，两人对写作都有经验，于是我们一拍即合，组成了AI写作团队，目前已经跑出了一点成绩。  糕老师拥有三年写作经验，之前稳定月入1w+，后来在GPT的加持下，效率提升，再加上迎来毕业季，增长到月入近3w，如下图。  ![](img/06135aba4d3bcdfcd4e0755e4f8c53cb.png)  这两个月跑出的成绩：新人第一天开始做就可以直接变现几十，一个月左右可以稳定在日入200~300，想要做大就需要往个人ip、开店铺、引流方面去做了。  写这篇文章是一次复盘，覆盖所有实操的细节！'
docs/202306/XfMUdz0TQopqJvxQjducjPKynSf.md: '# 从职场宝妈到自媒体创业者，裸辞一年，月入过万，活成想要的样子  > 来源：[https://jvx6nnxr4va.feishu.cn/docx/XfMUdz0TQopqJvxQjducjPKynSf](https://jvx6nnxr4va.feishu.cn/docx/XfMUdz0TQopqJvxQjducjPKynSf)  你好呀，我是努力追求“左手育儿，右手事业”的小又。  2022年6月~2023年6月，我裸辞一周年了。从职场宝妈到自媒体创业者，从0收入到月入过万，这一年有太多的感慨。  作为一个没颜值没技能学历也不高的中年裸辞宝妈，此前我从未想过我居然可以自己带学员，做自己的知识付费课程。  我也没有想过，自己在黑暗中举起的小小火把照亮了一部分人自媒体的道路。  一、因老公生意失败，债台高筑，我打算做自媒体  我来自桂北山区，2011年大学毕业。像大多数女孩子一样，只想找个安稳的工作，工资不用多高，覆盖日常开销就行。如果可以的话考个公或者考个编，到了合适的年龄遇到合适的人，结婚生子，毫无波澜地过完一生。  步入职场，我换了几份工作，说热爱谈不上，说讨厌也没有，就不咸不'
