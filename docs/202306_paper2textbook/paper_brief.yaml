docs/202306/KxuIdMr5noo7oexcna1cbpgRnlh.md: '# 都说风口过了，知识付费还值得做吗？  > 来源：[https://fs4xcvw5u9.feishu.cn/docx/KxuIdMr5noo7oexcna1cbpgRnlh](https://fs4xcvw5u9.feishu.cn/docx/KxuIdMr5noo7oexcna1cbpgRnlh)  风口过了，知识付费还值得做吗？  大家好，我是亚萨。  距离我发上一篇文，一年多了。当时离京去昆明，但没过多久就又决定出国，所以这段时间一直倒腾这个事。  现在全家在加拿大刚安顿下来。  我一直在做知识付费相关的业务。  但最近有不少人问到我，说大家都在说知识付费的风口已经过去了，还值得做不？  我认为是能做的，这个话题从三个方面来聊一下：  1、为什么还能做？  2、可以怎么做？  3、还能有哪些想象空间？  ##
  1、为什么还能做？  首先知识付费确实不如前两年好做了，一方面经济环境不好，另一方面是市场趋于成熟了，同质化产品多，用户对内容品质的要求变高。所以行业内也是唉声叹气。  回到上面的问题。  不好做的第一个原因，是所有行业要面对的，不仅是知识付费不好做，其他领域你去做一样'
docs/202306/L4OodPeJRoXlJWxPfyjcaq57ndd.md: '# 4年无人直播电商经验，累计1个亿GMV的我告诉你：今年一定要做抖音无人！无人直播小白必看的7问7答！  >
