- name: 基准图揭示模型默认偏好
  desc: '[evidence] 素材开头展示的''原本出的图''(无风格词)呈现为某种半写实、偏数字艺术感、构图居中的默认风格，印证了模型存在显著的''默认审美基线''，所有风格词均是在对抗或偏移该基线。'
  excerpt:
  - 我们先来看看原本出的图是啥样吧
  - '![](img/861e39541e1b3c83ace00373614251e6.png)'
- name: 部分风格词存在语义冲突或不可控性
  desc: '[claim] 素材作者对''星际战甲 Warframe''标注''配这个Prompt有点诡异的画风，不忍直视''，实证表明特定高强度风格词与特定基准Prompt的语义空间可能冲突，导致结构崩解或恐怖谷效应。'
  excerpt:
  - 星际战甲 Warframe（配这个Prompt有点诡异的画风，不忍直视）
