- name: 基准Prompt对照法
  desc: 核心概念，指固定主体、动作、场景等内容要素，仅变换风格修饰词，以隔离风格因素对图像生成影响的实验范式。
  is_original: true
  excerpt:
  - 我们将会使用同一个Prompt：[***] style a boy and a girl play infront of the forest ［里面就是各个风格词]简单粗暴
  - 我们先来看看原本出的图是啥样吧
- name: 风格迁移保真度
  desc: 核心概念，隐含于素材中，指风格关键词能否准确复现目标风域的核心视觉特征（如线条、色彩、构图、质感）的程度。
  is_original: false
  excerpt:
  - （隐含于所有风格对比图中，如齐白石的写意笔触、草间弥生的波尔卡圆点、浮世绘的平涂轮廓线等视觉特征的呈现）
methods:
- name: __overview__
  desc: 整体方法论：采用单一基准Prompt（主体：一男一女孩，动作：玩耍，场景：森林前）作为控制变量，系统性注入100+风格关键词，生成图像并排展示，构建风格关键词-视觉效果的映射图谱。
  excerpt:
  - 我们将会使用同一个Prompt：[***] style a boy and a girl play infront of the forest ［里面就是各个风格词]简单粗暴
  - 我们先来看看原本出的图是啥样吧
- name: 风格分类归档法
  desc: 将收集的风格关键词按来源属性隐性分类（个人艺术家、美术史流派、商业IP/流行文化、影视工作室、传统媒介/技法、游戏美术、设计流派），便于用户按需检索与风格混合参考。
  excerpt:
  - （隐性体现在风格列表的排列顺序中：前段为个人艺术家，中段为IP/工作室/媒介，后段为流派/游戏/题材/技法）
theorems:
- name: 风格关键词即强先验
  desc: 核心主张：在扩散模型中，单个高信息密度的风格关键词（如艺术家名、流派名）即可作为强先验，覆盖基础Prompt的默认审美倾向，决定生成图像的全局风貌（线条、配色、笔触、构图逻辑）。
  excerpt:
  - 我们将会使用同一个Prompt：[***] style a boy and a girl play infront of the forest ［里面就是各个风格词]简单粗暴
  - （全文100+组对比图隐性支撑）
- name: 风格组合的可叠加性假设
  desc: 核心主张：素材隐含主张，不同粒度的风格标签（如'油画' + '梵高' + '印象派'）可在Prompt中叠加，产生风格融合效果，为高级提示词工程提供组合语法基础。
  excerpt:
  - （隐含于素材提供大量原子化风格标签供用户自由组合的意图中）
