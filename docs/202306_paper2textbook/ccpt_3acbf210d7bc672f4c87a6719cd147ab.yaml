desc: 该素材是一份面向Midjourney等AI绘图工具用户的艺术风格提示词参考集锦，通过固定基础Prompt（'a boy and a girl play
  infront of the forest'）结合100余个不同风格关键词，直观展示了各风格关键词对画面风格化的具体视觉效果，涵盖知名艺术家个人风格、经典美术流派、流行文化IP风格、影视动画工作室风格、传统媒介技法、游戏美术风格及设计流派等六大类别，为提示词工程中的风格控制提供了大规模的实证对照样本库。
concepts:
- name: 风格关键词驱动
  desc: 核心概念，指通过在提示词中注入特定风格标识符（艺术家名、流派名、IP名、技法名等），强制引导生成模型向目标视觉分布收敛的机制。
  is_original: false
  excerpt:
  - 我们将会使用同一个Prompt：[***] style a boy and a girl play infront of the forest ［里面就是各个风格词]简单粗暴
