paper: docs/202306/20230613_094.md
desc: 该素材记录了作者苏佬师在加油站遭遇“燃油宝”推销并最终购买的真实经历，通过复盘自身心理变化，拆解了推销员如何通过系统性地消除顾客的心理顾虑（如效果怀疑、价格敏感、决策压力），层层降低购买风险感知，从而攻破高防备心理人群防线的销售话术逻辑与心理博弈过程。
concepts:
- name: 购买风险递减机制
  desc: 指销售过程中，通过针对性话术依次化解顾客的效果怀疑、价格异议、信任危机等心理顾虑，使主观感知风险持续降低至“拒绝成本高于购买成本”的临界点，从而自然成交的心理动力学模型。
  is_original: true
  excerpt:
  - 我在购买环节中的所有心理顾虑，对方都有应对方案，不断降低我的购买风险，到最后我自己都没拒绝的理由。
- name: 高防备人群破防路径
  desc: 针对具有专业背景、防备心强的目标客群，销售方不采用硬性说服，而是利用场景压力、权威背书、试用降价等组合拳，将“理智判断”转化为“情境顺从”的心理攻略路径。
  is_original: true
  excerpt:
  - 试图拆解下我这种防备心这么强的人，是怎么被骗的。
methods:
- name: __overview__
  desc: 基于真实购买案例的事后复盘法：通过第一人称视角还原决策现场，按时间序列梳理“心理顾虑-销售应对-心理变化”的三元互动链条，归纳出销售端的风险消解标准动作库（SOP)。
  excerpt:
  - 回北京一查才发现果然被骗，但我觉得这个骗局很高明，试图拆解下我这种防备心这么强的人，是怎么被骗的。
  - 我在购买环节中的所有心理顾虑，对方都有应对方案，不断降低我的购买风险，到最后我自己都没拒绝的理由。
theorems:
- name: 销售成交的本质是风险转移而非价值说服
  desc: 高客单价/高怀疑度场景下，成交的关键不在于证明产品多好（价值说服），而在于系统性地帮客户找到‘买错也没关系’的理由（风险托底），将决策压力从‘会不会亏’转移为‘不买会不会损失机会/面子’。
  excerpt:
  - 我在购买环节中的所有心理顾虑，对方都有应对方案，不断降低我的购买风险，到最后我自己都没拒绝的理由。
- name: 场景封闭性是冲动消费的必要条件
  desc: 加油站这一封闭、时限紧迫、且车主必须停留的特殊物理场景，切断了顾客‘搜索对比、冷静思考、咨询他人’的外部验证通道，迫使决策在销售方设定的节奏内完成。
  excerpt:
  - 4 月从唐山开车回北京，在加油站加油时被推销「燃油宝」的东西...当时虽然对此怀疑，但还是买了，因为那个场景下，我被打动了。
findings:
- name: 燃油宝加油站推销话术标准化SOP的实证存在
  desc: '[evidence] 作者作为品牌营销从业者（高防备心理）仍中招，且评论区多人（周彦充、胖大魔）在不同时间、地点（唐山、深圳、北京）遭遇高度相似的推销流程（报价50-190元、买二送二/多瓶打包），证明该销售模式具备标准化、可复制、跨区域推广的特征。'
  excerpt:
  - '周彦充 : 我来遭了，50 元一瓶，还说要给我加 2 瓶，带 4 瓶，就是 300 元。'
  - '胖大魔 : 以前深圳做汽车售后，雪铁龙店成本 30-40 多一瓶从厂家拿货，北京现代大胜店从外面拿十几块一瓶。卖 130 跟 190'
  - '苏佬师@品牌营销 : 试图拆解下我这种防备心这么强的人，是怎么被骗的。'
- name: 产品真实成本与终端售价存在数十倍暴利空间
  desc: '[evidence] 评论区从业者胖大魔披露：厂家供货成本30-40元/瓶，外采成本十几元/瓶，终端售价130-190元/瓶，甚至机油螺丝成本0.3元售价3.6元，揭示了该业务模式依赖极高毛利支撑地推团队佣金及运营成本。'
  excerpt:
  - '胖大魔 : 以前深圳做汽车售后，雪铁龙店成本 30-40 多一瓶从厂家拿货，北京现代大胜店从外面拿十几块一瓶。卖 130 跟 190'
  - '胖大魔 : 还有之前一个机油螺丝 3.6 块，觉得很便宜，后面自己开店，这个超过三毛钱算我输。'
- name: 专业背景不构成免疫销售操纵的保护因子
  desc: '[evidence] 作者自述为‘品牌营销’从业者（苏佬师@品牌营销），具备专业防备心理，仍在特定场景下被攻破，说明销售话术针对的是人类通用的认知弱点（损失厌恶、权威顺从、社会认同、稀缺性），而非知识盲区。'
  excerpt:
  - 作者： 苏佬师@品牌营销
  - 试图拆解下我这种防备心这么强的人，是怎么被骗的。
