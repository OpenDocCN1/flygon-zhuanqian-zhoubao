paper: docs/202306/20230613_273.md
desc: 该素材探讨了利用 ChatGPT、AI 换脸、Midjourney 等生成式 AI 工具重构“明星祝福视频”商业模式的可行性与操作闭环。作者指出传统真人明星祝福存在明星档期难约、价格高、效果不可控、版权风险大等痛点，提出“AI
  换脸授权版”新玩法：通过合法获取明星肖像授权，结合 AI 换脸技术、ChatGPT 生成定制化藏头诗/祝福语、Midjourney 生成配套画面视频，实现内容生产标准化、低成本、高交付质量。文中详细拆解了从文本生成到视频合成的技术工作流，分析了合规授权的商业价值（规避风险、维持高客单价、获取打假授权），并建议利用公共领域
  IP（如孙悟空）规避版权风险，最后给出了 ToB（婚庆/蛋糕店分销）与 ToC 双渠道分发策略。
concepts:
- name: AI授权换脸祝福视频
  desc: 核心业务模式概念。指通过合法获取明星肖像授权，利用 AI 换脸技术替换真人出镜，结合大模型生成定制化文案（藏头诗/祝福语）及配套视觉画面，批量生产高质量、可控成本的个性化祝福视频产品。
  is_original: true
  excerpt:
  - 真人明星祝福，改为 AI 换脸+场景情绪自由定制+诵读藏头诗和祝福语+诗的衍生画面视频播放+……
  - 你让明星说啥就说啥，你让 Ta 咋说就咋说。自由调试，不会出现各种意外。视频中表现，甚至比明星当年最火的时候还出彩。
  - 明星为什么乐意合作——自己投入的成本趋 0、视频中呈现的效果还更好
- name: 公共领域IP避险策略
  desc: 版权合规策略概念。指在无法获取商业 IP 授权时，利用孙悟空等版权已过期或归属公共领域的经典形象，结合 AI 生成技术制作祝福视频，以规避侵权风险并承载文化厚重感。
  is_original: true
  excerpt:
  - 公共 IP 就没问题，chatgpt 还能帮你捋一捋
  - 这些 IP，和祝福等玩法结合，也可以试试，不敢说对结婚新人、过生日的人有明星那种鲜活力，但有厚重文化力加持
- name: 文生视频降级工作流
  desc: 技术实现概念。针对当前文生视频（Text-to-Video）成本高、效果差的现状，提出用 ChatGPT 生成分镜提示词 -> Midjourney
    生成关键帧图片 -> 定时轮播合成视频的低成本替代方案。
  is_original: true
  excerpt:
  - 祝福语视频，有初级简单玩法，图片联播，代替复杂的动态视频（目前貌似文字生成视频，还是成本较高，效果一般）
  - 这是让刚才 chatgpt 生成的藏头诗，变成 15 秒短视频画面文案，再让 midjourney 画 5 幅画，3 秒一张，轮播；再配个音乐，就齐活变成视频了。
- name: 合规授权护城河
  desc: 商业策略概念。强调合法合规不仅是底线，更是核心竞争优势：合规带来扩张底气、高客单价支撑、独家授权打假变现等多重商业价值。
  is_original: true
  excerpt:
  - 合法合规的好处，一是可以放心坦荡的扩大；二是可以保持较高客单价；或者同时获得“打假”授权，你是独家授权，可以先对其他人睁只眼闭只眼，等时机合适了，你再索赔
methods:
- name: __overview__
  desc: 素材整体方法论：基于生成式 AI 工具链（LLM + 换脸 + 绘图）重构非标服务产品的标准化生产流程，核心路径为‘合规授权获取 -> 文本大模型定制文案/分镜
    -> 图像大模型生成素材 -> 换脸/数字人合成视频 -> 多渠道分发变现’。
  excerpt:
  - 真人明星祝福，改为 AI 换脸+场景情绪自由定制+诵读藏头诗和祝福语+诗的衍生画面视频播放+……
  - 合法合规的好处，一是可以放心坦荡的扩大；二是可以保持较高客单价；或者同时获得“打假”授权
  - 多渠道分发，是合规带来的好处，也是必然要做的。toB，比如通过和婚庆公司、蛋糕房……的合作，高客单价，再分成。toC，不展开，渠道也很多
- name: ChatGPT 定制化文案与分镜生成法
  desc: 利用 Prompt Engineering 让 ChatGPT 生成符合特定场景（如婚礼）的藏头诗/祝福语，并进一步将其拆解为 Midjourney
    可用的画面分镜提示词（含场景描述、情绪关键词、运镜建议）。
  excerpt:
  - 整俩名字，李月霞、郑格雷。两人名字的藏头诗，婚礼祝福语，内含欢乐美好情绪。一下作 5 首，选 1 首就好
  - 这是让刚才 chatgpt 生成的藏头诗，变成 15 秒短视频画面文案，再让 midjourney 画 5 幅画... [画面一] 黑暗的夜空中，月光璀璨如银...
    [画面二] 夜霞中映照着一群快乐欢快的小鸟...
- name: Midjourney 关键帧联播合成视频法
  desc: 针对 Sora 等视频生成模型尚未成熟/成本高的现状，采用 MJ 生成高质量关键帧静态图，通过 3 秒/张的轮播切换 + 背景音乐 + 旁白音频，低成本合成具有叙事感的短视频成品。
  excerpt:
  - 祝福语视频，有初级简单玩法，图片联播，代替复杂的动态视频
  - 再让 midjourney 画 5 幅画，3 秒一张，轮播；再配个音乐，就齐活变成视频了。
- name: 明星肖像合规授权谈判框架
  desc: 基于‘明星零成本、效果更好、跟风心理’的利益分析，提出以打包价而非分成模式获取独家/授权肖像权，并将授权转化为‘打假授权’等商业杠杆的商务谈判策略。
  excerpt:
  - 要合法长期，拼的还是执行力，找到愿意配合的明星，用打包价可能比分成更合适？
  - 明星为什么乐意合作——自己投入的成本趋 0、视频中呈现的效果还更好，而且看到***也做了（有第一个第二个，其他人跟风就更容易了）
theorems:
- name: 传统明星祝福模式失效定律
  desc: 传统真人明星祝福视频因‘非当红明星吸引力不足’、‘当红明星价格高/效果差/档期不可控’、‘高净值人群偏好线下真人’三重约束，导致市场价格暴跌 80%+，商业模式不可持续。
  excerpt:
  - 多数都是非当红明星；年轻人不一定爱用；用了还感觉效果一般。
  - 少数当红的，又真用不起/或觉得不值。
  - 有钱的主，会通过关系请人家亲临，比视频祝福效果不一个层级。
  - 价格越来越低，一些非当红明星的价格都比 3 年前低 80%+了
- name: AI 重构非标服务核心优势论
  desc: 生成式 AI 能将非标准化的‘明星录制祝福’转化为标准化工业品：解决‘说错台词、妆容不整、状态倦怠、衰老暴露’等不可控风险，实现‘内容自由定制、形象定格巅峰、成本边际趋零’。
  excerpt:
  - 无论中国外国，各种‘读稿子、应付事、神情倦怠、妆容不整、怎么这么老了……’都不会发生。
  - 视频中表现，甚至比明星当年最火的时候还出彩。
  - 你让明星说啥就说啥，你让 Ta 咋说就咋说。自由调试，不会出现各种意外。
- name: 合规即护城河定理
  desc: 在 AI 生成内容版权模糊地带，主动购买肖像授权并非成本中心，而是利润中心：合规支撑高客单价、赋予规模化扩张合法性、独家授权可衍生‘打假索赔’新收入流。
  excerpt:
  - 合法合规的好处，一是可以放心坦荡的扩大；二是可以保持较高客单价；或者同时获得“打假”授权，你是独家授权，可以先对其他人睁只眼闭只眼，等时机合适了，你再索赔
- name: 公共领域 IP 替代商业 IP 可行性判断
  desc: 当商业 IP 授权成本高或风险大（如奥特曼版权混乱）时，公共领域 IP（孙悟空等）虽缺乏‘鲜活明星感’，但具备‘厚重文化力’与‘零版权风险’，是长期主义项目的安全替代方案。
  excerpt:
  - 奥特曼是版权归属复杂，但依然有风险，你用了就是那啥，除非人家懒得找你
  - 公共 IP 就没问题... 这些 IP，和祝福等玩法结合，也可以试试，不敢说对结婚新人、过生日的人有明星那种鲜活力，但有厚重文化力加持
findings:
- name: 藏头诗 Prompt 调教实测效果
  desc: '[evidence] 作者实测仅花半小时优化 Prompt，ChatGPT 即可生成包含指定名字、场景（婚礼）、情绪（欢乐美好）的高质量藏头诗，并能一次性生成
    5 首备选，单次生成耗时 5-20 秒。'
  excerpt:
  - 亲测优化 prompt 就可以了。虽然 chatgpt 的学习资料 90%+是英文，但真的基本够用了
  - 放个成品例子吧，我这个测试调教了半小时... 月光璀璨照夜霞，霞映小鸟快乐家。格局相合心相连，雷鸣欢歌喜无涯。
- name: 文生视频降级方案可行性验证
  desc: '[evidence] 通过 ChatGPT 扩写诗句为分镜 -> Midjourney 生成 5 张图 -> 3 秒/张轮播 + 音乐合成 15
    秒视频的流程，已跑通并产出可用成品，验证了‘图片联播’替代‘文生视频’的低成本可行性。'
  excerpt:
  - 这是让刚才 chatgpt 生成的藏头诗，变成 15 秒短视频画面文案，再让 midjourney 画 5 幅画，3 秒一张，轮播；再配个音乐，就齐活变成视频了。
  - '[画面一] 黑暗的夜空中... [画面五] 画面渐渐淡出...'
- name: 市场现存侵权灰产现状
  desc: '[claim] 评论区用户反馈已有从业者使用漫威等受版权保护 IP 制作 AI 数字人祝福视频，且平台暂未大规模封禁（‘发了几次都没啥流量’暗示账号存活），但法律风险客观存在。'
  excerpt:
  - '秋 : 这个本人已经尝试，AI 绘画生成的漫威英雄图，再用做的数字人告白视频，这个是违规侵权的吗？本人愚昧，还真不知道。不过发了几次都没啥流量。'
  - 'do 小鱼 : 我之前专门咨询过律师这方面 就是这个存在版权问题'
- name: 声音克隆技术落地现状与替代方案
  desc: '[evidence] 评论区讨论揭示：真人原声克隆需采集训练，成本高且法律风险大（不建议）；主流落地方案为‘混搭方式’——如让外国名人形象说方言/方言梗，利用‘旧元素新组合’的反差感吸引流量，规避声音版权。'
  excerpt:
  - '王二 : 请教下，这个声音是怎么来的呀？如果想让人物用原来的声音讲话的话'
  - '蓝海游龙 : 真人原声要采集训练的，不建议。现在起盘的多混搭方式，成本更低，如外国名人说东北话天津话，深一层逻辑是旧元素的新组合，AI 是加速器'
- name: 婚庆/蛋糕店 ToB 分销渠道高客单价特征
  desc: '[claim] 作者基于行业经验判断：婚礼祝福客单价显著高于生日祝福，通过婚庆公司、蛋糕房等 ToB 渠道分销可实现高客单价分成，是变现主路径。'
  excerpt:
  - toB，比如通过和婚庆公司、蛋糕房……的合作，高客单价，再分成。婚礼祝福大概率比生日祝福客单价高？
