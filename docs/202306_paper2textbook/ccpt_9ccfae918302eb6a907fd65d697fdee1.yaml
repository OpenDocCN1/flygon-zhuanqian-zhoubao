paper: docs/202306/20230613_211.md
desc: 该素材是一篇面向新手的 AI 绘画实操教程，主讲人为生财有术社群领队、AI 绘画航海教练木木（依琳）。文章系统讲解了个人头像制作的四大核心板块：垫图的使用方法、基于个人照片生成
  AI 头像的流程、Midjourney 图像权重参数（--iw）的详细说明与实测对比、以及头像变现路径与 Notion AI 辅助工具的结合玩法。素材以“保姆级手册”定位，强调低门槛快速上手，并通过参数实测图、变现案例验证方法有效性，旨在帮助零基础用户掌握从生成到变现的完整闭环。
concepts:
- name: 垫图
  desc: 指在 AI 绘画（如 Midjourney）中，作为生成参考依据的输入图片。通过上传图片获取链接并置于 Prompt 最前端，用于控制生成图像的构图、风格、角色一致性等视觉特征。
  is_original: false
  excerpt:
  - 一、垫图的使用方法
  - 通过制作头像，你不仅可以展示自己的创意和艺术感...
- name: 图像权重参数
  desc: Midjourney 中控制参考图（垫图）对生成结果影响程度的关键参数，取值范围 0-2（V5 版本）。数值越高，生成图越接近原图构图与细节；数值越低，画面自由度越高、越偏向文本提示词。
  is_original: false
  excerpt:
  - 三、图像权重参数--iw 的说明
- name: AI 头像变现闭环
  desc: 指利用 AI 绘画工具生成头像，结合 Notion AI 等效率工具完成选题、文案、排版、分发等运营动作，最终在社交媒体（如小红书、朋友圈）或知识付费社群实现商业变现的完整业务流程。
  is_original: true
  excerpt:
  - 四、头像变现+NotionAI 辅助工具的结合玩法
  - 顺便，也可以赚点钱。
- name: 保姆级教程
  desc: 指操作颗粒度极细、门槛极低、覆盖从工具准备、参数设置到实操演示及变现应用全链路的教学内容，旨在让零基础新手‘跟着做就能成’。
  is_original: false
  excerpt:
  - 真的是保姆级手册呀，必须的点赞收藏一波
  - 新手也可以快速上手
methods:
- name: __overview__
  desc: 基于 Midjourney 的个人头像制作标准化工作流：1. 准备垫图（上传获取链接）；2. 构建 Prompt（垫图链接 + 描述词 + 参数）；3.
    调节 --iw 参数控制相似度与创作度平衡；4. 筛选优化输出；5. 结合 Notion AI 产出变现所需文案与运营素材。
  excerpt:
  - 文章目录如下： 一、垫图的使用方法 二、用自己的照片制作 AI 头像 三、图像权重参数--iw 的说明 四、头像变现+NotionAI 辅助工具的结合玩法
- name: 垫图使用标准流程
  desc: 在 Midjourney Discord 界面上传个人照片/参考图 -> 右键复制图片链接 -> 在 /imagine 提示词框中粘贴链接置于最前
    -> 输入风格描述词 -> 添加 --iw 参数 -> 发送生成。
  excerpt:
  - 一、垫图的使用方法
  - 二、用自己的照片制作 AI 头像
- name: --iw 参数实测调优法
  desc: 针对同一张垫图与 Prompt，分别设置 --iw 0, 0.5, 1, 1.5, 2 等梯度数值进行批量生成，对比输出结果在‘像人’（相似度）与‘好看/风格化’（创作度）之间的权衡，选取最佳数值定版。
  excerpt:
  - 三、图像权重参数--iw 的说明
- name: Notion AI 辅助变现运营法
  desc: 利用 Notion AI 根据头像风格主题自动生成小红书爆款标题、文案、标签，辅助撰写绘画教程笔记、变现引导话术及客户沟通脚本，实现内容生产与商业转化的效率最大化。
  excerpt:
  - 四、头像变现+NotionAI 辅助工具的结合玩法
theorems:
- name: 低门槛高上手 AI 绘画普惠论
  desc: AI 绘画工具（Midjourney）已将专业级头像制作门槛降至零基础可及水平，普通人无需美术功底，仅需掌握‘垫图+参数（--iw）+提示词’核心三要素，即可在极短时间内产出商业级头像作品。
  excerpt:
  - 新手也可以快速上手的 AI 绘画：个人头像篇
  - 通过制作头像，你不仅可以展示自己的创意和艺术感...顺便，也可以赚点钱。
- name: 参数控制决定生成质量核心论
  desc: 在垫图固定的前提下，--iw 参数是平衡‘还原度’与‘美感/风格化’的核心控制杠杆；盲目追求高相似度（高 --iw）会导致画面僵硬、丢失 AI 审美优势，最佳实践在于通过小步快跑实测找到‘像又像、美又美’的黄金区间。
  excerpt:
  - 三、图像权重参数--iw 的说明
- name: 工具组合放大商业价值论
  desc: 单一 AI 绘图工具仅解决‘生产’问题，将 Midjourney 与 Notion AI 结合，形成‘生图-选图-文案-分发-转化’全链路自动化组合拳，才能将技术红利转化为可持续的商业变现能力。
  excerpt:
  - 四、头像变现+NotionAI 辅助工具的结合玩法
