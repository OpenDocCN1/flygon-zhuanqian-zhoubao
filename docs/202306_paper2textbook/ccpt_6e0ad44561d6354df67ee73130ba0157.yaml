paper: docs/202306/20230613_283.md
desc: 该素材为一篇推广帖，作者比比先森分享其利用 ChatGPT 辅助创作小红书笔记的实战经验，主张通过结合小红书运营逻辑提炼的“引导模板思路”，帮助零基础新手解决创作时间成本高的痛点，实现创作效率提升
  30 倍、产出 90 分高质量笔记的目标，并附上飞书文档链接供详细阅读。
concepts:
- name: 小红书引导模板思路
  desc: 作者结合小红书运营逻辑提炼出的一套针对零基础新手的 ChatGPT 提示词/指令体系，旨在降低创作门槛、提升内容产出效率与质量。
  is_original: true
  excerpt:
  - 为此我结合小红书运营逻辑，提炼出一套新手用 ChatGPT 写笔记的引导模板思路
  - 尤其适合 0 基础新手进行小红书内容创作，翻倍提高创作效率
- name: 创作时间成本痛点
  desc: 新手在小红书运营初期面临的核心障碍，即内容生产耗时过长，导致难以持续产出高质量笔记。
  is_original: false
  excerpt:
  - 很多新手在做小红书时遇到的第一个痛点，不是变现，而是创作的时间成本
methods:
- name: __overview__
  desc: 整体方法论为：识别新手创作痛点 -> 结合平台运营逻辑设计提示词模板 -> 利用 ChatGPT 执行生成 -> 实现高效率产出高分笔记。
  excerpt:
  - 结合小红书运营逻辑，提炼出一套新手用 ChatGPT 写笔记的引导模板思路
  - 0 基础新手，用 ChatGPT 创作 90 分高质量小红书笔记，提高 30 倍神仙效率
theorems:
- name: 模板化提示词显著提升新手创作效率与质量
  desc: 核心主张：通过预设符合小红书调性的引导模板，零基础用户可绕过学习曲线，直接利用 ChatGPT 生成符合平台偏好的高质量内容（90分），并将效率提升至人工的30倍。
  excerpt:
  - 0 基础新手，用 ChatGPT 创作 90 分高质量小红书笔记，提高 30 倍神仙效率
  - 提炼出一套新手用 ChatGPT 写笔记的引导模板思路，尤其适合 0 基础新手进行小红书内容创作，翻倍提高创作效率
findings:
- name: 作者实践验证与社群背书
  desc: '[claim] 作者声称该方法已实测可行，能产出90分高质量笔记并提效30倍。[evidence] 素材数据支撑：飞书文档链接记录了完整实操细节；生财有术圈友高赞评论（450赞）及同行背书构成社会证明。'
  excerpt:
