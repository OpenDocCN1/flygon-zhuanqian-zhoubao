paper: docs/202306/20230627_091.md
desc: 该素材介绍了《GPT调教心流法》中的核心技术突破——「三体联动」方法论，旨在解决ChatGPT处理长文案时出现的逻辑失控、不听指挥以及生成内容缺乏深刻主观性（人物IP风格）的两大核心痛点，并实测成功应用于将万字直播文稿转写为带有人物IP风格的口播文案。
concepts:
- name: GPT调教心流法
  desc: 作者体系化的提示工程/模型调教方法论品牌名称，三体联动是其迭代出的新核心组件。
  is_original: true
  excerpt:
  - 《GPT 调教心流法》的新大杀器——三体联动！
  - 过去的两个月里，我们做了很多调教对话框的积累，不管是语料收集、调教思路还是提词微调都花了不少的时间试错。
- name: 三体联动
  desc: 素材核心创新概念，指通过特定的多角色/多阶段协作机制（隐喻《三体》），解决长文本处理与风格化生成的联动策略。
  is_original: true
  excerpt:
  - 终于让我们碰撞出了一个杀器——三体联动
  - 并解决了 “如何把万字直播文稿转写为带有人物 IP 风格的口播文案”的难题。
- name: 长文案处理失控
  desc: ChatGPT在处理超长上下文时出现的幻觉、逻辑断裂、指令跟随失效等典型弱点。
  is_original: false
  excerpt:
  - 处理长文案时候经常不是有误就是不听指挥
- name: 主观性缺失/人物IP风格
  desc: 大模型生成内容往往平淡无味，缺乏特定人物的人设、语气、观点等主观特征，难以直接用于个人IP内容生产。
  is_original: false
  excerpt:
  - 提供的内容缺少深刻的主观性
  - 转写为带有人物 IP 风格的口播文案
methods:
- name: __overview__
  desc: 基于语料收集、调教思路设计、提示词微调的系统性试错积累，形成的「三体联动」整体工作流，专门针对万字级长文本的结构化拆解、风格化重组与IP人设注入。
  excerpt:
  - 过去的两个月里，我们做了很多调教对话框的积累，不管是语料收集、调教思路还是提词微调都花了不少的时间试错。
  - 终于让我们碰撞出了一个杀器——三体联动，并解决了 “如何把万字直播文稿转写为带有人物 IP 风格的口播文案”的难题。
- name: 语料收集与调教积累
  desc: 构建高质量训练/少样本语料库，作为调教模型输出风格与逻辑的基础数据层。
  excerpt:
  - 不管是语料收集、调教思路还是提词微调都花了不少的时间试错。
- name: 提示词微调与迭代
  desc: 通过持续的Prompt Engineering实验，优化指令结构以增强模型对长指令的遵循度及风格模仿能力。
  excerpt:
  - 不管是语料收集、调教思路还是提词微调都花了不少的时间试错。
theorems:
- name: 长文本+风格化双痛点破解论
  desc: 单一模型调用无法同时解决长上下文逻辑保持与高主观性风格生成，必须引入结构化协作机制（三体联动）才能实现万字级文稿的高保真IP化转写。
  excerpt:
  - 你会发现 GPT 有两个很大的弱点。 1、处理长文案时候经常不是有误就是不听指挥 2、提供的内容缺少深刻的主观性 这两个痛点，限制了我们很多场景下的文本创作。
  - 终于让我们碰撞出了一个杀器——三体联动，并解决了 “如何把万字直播文稿转写为带有人物 IP 风格的口播文案”的难题。
- name: 底层模型局限性不可逆论
  desc: 仅依赖底层模型能力（如GPT-3.5）的替代品无法从根本上解决逻辑性长文处理问题，必须在应用层通过调教方法论补足。
  excerpt:
  - 即便是你有其他平台作为替代品，但因为底层是 3.5 的原因，依然没有办法具备逻辑性的解决。
