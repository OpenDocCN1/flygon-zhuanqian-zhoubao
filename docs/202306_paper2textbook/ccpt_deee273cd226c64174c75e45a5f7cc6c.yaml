paper: docs/202306/20230627_013.md
desc: 该素材由私域运营实战专家郭威撰写，系统阐述了私域团队从0-1验证模型、1-10标准化复制放大、10-100平台化与合伙人机制的完整增长路径。核心主张在于：私域增长的本质是杠杆运用（信息差、人才、资本），关键瓶颈在于流量与标准化；通过销售模型标准化（朋友圈、群、私聊、客户朋友圈四维触达）与人才培养SOP双轨并行，配合利润分红与虚拟股权激励机制，实现从个人英雄主义到组织平台化的跨越。
concepts:
- name: 私域团队三阶段增长模型
  desc: 将私域团队发展划分为0-1（模型验证期）、1-10（标准化复制期）、10-100（平台化合伙期）三个阶段，每阶段核心任务、管理重点与杠杆运用截然不同。
  is_original: true
  excerpt:
  - 团队从 0-1 发展，重点是在于把团队模型建立好，通过算流量、人工成本以及其他成本去把利润最大化。而从 1-10 就要结合业务的发展情况去做标准，筛选优化...
    10-100 的时候基本上就要有一定的中后台搭建能力，需要在 2 个层面做流程机制。第一个是人才培养标准化流程（SOP），第二个是业务模型的标准化流程。...
    最后团队继续上台阶，其实就是分蛋糕... 把公司平台化。
- name: 三大增长杠杆
  desc: 驱动团队规模放大的三种核心杠杆：信息差杠杆（认知优势）、人才资源杠杆（买时间/买结果）、资本资源杠杆（解决现金流与扩张资金）。
  is_original: true
  excerpt:
  - 团队放大的过程，其实就是使用杠杆的过程。我认为需要用上三个杠杆：信息差，人才资源，资本资源。
  - 第一个最简单的杠杆，就是信息差... 第二个... 是人才资源... 最后一个是资本资源。
- name: 销售模型四维标准化触达体系
  desc: 私域成交的标准化执行框架，包含朋友圈、社群、私聊跟进、客户朋友圈四个版块，要求对不同标签客户（未购、意向、已购、高净值）实施差异化SOP，将顶尖销售经验沉淀为可复制模板。
  is_original: true
  excerpt:
  - 引流进微信以后，我们主要是从 3-4 个版块来对客户进行营销。 1、朋友圈 2、群... 3、私聊跟进 4、客户的朋友圈
  - 所谓的标准化，就是员工进来以后按照我们的基础要求去做，就能达到我们的保底的数据要求。核心点：达不到就淘汰洗人。
  - 私聊版块，从进粉以后打招呼，到人设背书，产品背书的内容都需要公司提前做好设计。甚至如何报价，如何逼单等都需要用流程...
- name: 人才培养SOP闭环
  desc: 覆盖入职培训、学习内容、考核淘汰、成长路径的全周期标准化流程，与销售端标准强绑定，实现‘新人快速上手-筛选优胜劣汰-复制优秀经验’的飞轮。
  is_original: false
  excerpt:
  - 人才培训 SOP，从入职，培训，到销售团队；需要的学习内容、接受训练内容、成长路径，不同阶段的内容跟进团队情况及时优化调整。
  - 员工培训标准化：从入职，到培训，员工成长计划等，下销售团队以后前中期学习内容，考核内容，淘汰标准都提前做流程设计，和前面营销端的要求相呼应。
- name: 资源向强者倾斜与人均产出最大化原则
  desc: 基于人均成本、人均产出、投产比（ROI）的动态核算，保护高产出销售，淘汰低产出人员（视为负债），通过资源再分配提升组织整体效能。
  is_original: true
  excerpt:
  - 根据资源的总量，做好分配，保护强者。做好人均成本核算，人均产出，根据产出比优化资源分配机制，人才筛选。
  - 团队初期要计算单人投产，杀伐果断，有利润或者觉得未来能有利润的人留下，及时清理没有利润的人（负债），不停筛选人，人提高人均利润。
- name: 平台化合伙人利润分配模型
  desc: 10-100阶段的组织进化形态，将公司拆分为独立核算业务单元（BU），销售负责人作为合伙人参与分红/虚拟股/实股/超额分红，核心逻辑为‘以增量利益分配换取核心人才长期绑定’。
  is_original: true
  excerpt:
  - 最后团队继续上台阶，其实就是分蛋糕。独行快、众行远，做好利润分配才能更好团结优秀的人持续干。
  - 按照团队进行独立核算，销售团队核心负责人分红自己团队利润一部分。可以定目标分红... 分红、虚拟股权、实股、超额分红，等等玩法也挺多的。
  - 核心在于，价值越大，我们要逐步放利，以增量利益分配为主。
methods:
- name: __overview__
  desc: 私域团队规模化综合方法论：以流量获取为前提，经历模型验证(0-1) -> 标准化复制与人才筛选(1-10) -> 中后台搭建与平台化合伙(10-100)
    三阶段，贯穿信息差/人才/资本三杠杆，落地销售SOP与人才SOP双标准化，最终通过利益共享机制实现组织跃迁。
  excerpt:
  - 回顾： 0-1，重点是模型，算流量成本-人工成本-其他成本-利润产出情况。 1-10，结合业务情况，做标准化，批量上人，筛选优化。最后公司平台化，拆分业务单元，设计合伙人体系放大。
  - 团队放大的过程，其实就是使用杠杆的过程。我认为需要用上三个杠杆：信息差，人才资源，资本资源。
- name: 赛道与选品评估模型
  desc: 私域项目前期决策框架：赛道选择以‘流量获取难易度’与‘流量价值（LTV/客单价/复购率）’为坐标，不单看单粉成本；选品标准为‘高毛利+高复购’或‘高客单价’，并强调深耕客户全生命周期价值。
  excerpt:
  - 选择赛道可以根据流量获取难易情况以及流量价值多少来综合衡量。有一些赛道单粉成本 300-500，也能干，不看成本只看价值和能否稳定获得流量。
  - 选品核心：高毛利、高复购，部分产品毛利不够高，客单价足够高也可以。如果只做一次生意，那就想办法针对客户人群去挖掘客户需求，提供更多的产品和服务给客户，深耕客户，挖掘客户价值。
- name: 销售SOP标准化构建法
  desc: 将头部销售的隐性经验显性化为标准作业程序：1) 客户分层标签体系设计；2) 四大触点（朋友圈/群/私聊/客户朋友圈）内容模板与频次标准化；3) 私聊全流程话术库构建（打招呼/人设/产品背书/报价/逼单）；4)
    执行考核与‘达标留存、不达标淘汰’机制；5) 定期复盘迭代模板。
  excerpt:
  - 公司需要设计好对应的流程和提前准备好工具。只需要培训员工如何去按照要求执行。并且结合实际情况及时复盘，优化调整标准化的内容。
  - 私聊版块，从进粉以后打招呼，到人设背书，产品背书的内容都需要公司提前做好设计。甚至如何报价，如何逼单等都需要用流程，团队放量的过程之中坚决不让普通员工随意发挥，先模仿，在超越，慢慢的可以可以让一部分优秀的人来尝试，并且把优秀的人的方式想办法提炼，来做模板标准。
- name: 人才漏斗筛选与投产比管理法
  desc: 1-10阶段核心人才管理动作：大量招聘建立候选池 -> 设定试用期投产比阈值 -> 高频核算单人ROI -> ‘杀伐果断’清退低产出者(负债) ->
    资源向高产出者倾斜 -> 迭代提升人均产出上限。
  excerpt:
  - 这个阶段就是打团队模型的阶段... 通过不停的优化人，优化项目细节，来使得人均产出逐步提高，最后可能有一些能有利润的人也要被替换，因为产出比还是不够，资源是有效的，把有效的资源尽量发挥出最大价值。
  - 团队初期要计算单人投产，杀伐果断，有利润或者觉得未来能有利润的人留下，及时清理没有利润的人（负债），不停筛选人，人提高人均利润。
theorems:
- name: 流量规模决定团队规模上限定律
  desc: 私域团队规模的天花板由稳定获客流量规模决定，流量是核心外部约束，管理与标准化是内部可控变量；无流量则无团队放大必要。
  excerpt:
  - 我一直认为，限制私域做大的核心是流量。流量有多大，团队就能有多大，这个是前提，其他的都是我们相对可以内化解决的。
- name: 管理本质是买时间买结果的杠杆置换
  desc: 从1-10的核心跃迁是创始人从‘亲力亲为’转向‘发钱买时间、买解决方案、买结果’，通过资本换取他人时间与能力，突破个人精力天花板。
  excerpt:
  - 抛开这个信息差，我们来谈 0-1 迈出去比较核心的，是人！人的资源放大，个人的时间精力有限，开始要学会发钱买时间，买解决方案，买结果。
  - 完全靠自己，天花板永远有限。这也是我提到的人才资本。其实迈出去的第一步，就是大量面试和招聘人事。花钱买结果，在人身上舍得投资，花钱。
- name: 标准化是规模化的必要充分条件
  desc: 10-100阶段，唯有将‘人’(人才培养SOP)与‘事’(业务模型SOP)双重标准化，并建立中后台支撑体系，才能实现组织的低熵增复制与规模化扩张。
  excerpt:
  - 10-100 的时候基本上就要有一定的中后台搭建能力，需要在 2 个层面做流程机制。第一个是人才培养标准化流程（SOP），第二个是业务模型的标准化流程。
  - 以上 2 点，一点是人，一点是事，配合起来缺一不可，两者结合威力很大。
- name: 利益分配机制决定组织进化上限
  desc: 团队从‘雇佣制’进化为‘合伙制’/‘平台化’，核心驱动力是设计增量利益分配机制（分红/虚拟股/实股），将核心骨干利益与组织长期价值深度绑定，解决‘独行快，众行远’的协作难题。
  excerpt:
  - 最后团队继续上台阶，其实就是分蛋糕。独行快、众行远，做好利润分配才能更好团结优秀的人持续干。
  - 利润分配永远都是为了给能持续提供价值的人，做好价值交换。私域团队的核心人员，很多时候都是销售团队负责人。这个时候就是 10-100 了，把公司平台化。
findings:
- name: 作者团队规模与业绩实证
  desc: '[evidence] 作者团队实测数据：销售团队500+人、中后台50+人、年零售端营销额破亿，验证了该方法论在母婴大健康赛道的可行性与有效性。'
  excerpt:
  - 目前私域主要经营母婴大健康，销售团队总人数 500+，中后台人员 50+，年零售端营销亿+。
- name: 高客单价赛道可接受高获客成本验证
  desc: '[evidence] 工厂自营项目实测：单粉成本300-500元在高客单价、高复购赛道（特殊膳食/功能性保健食品）下可接受且盈利，通过1688店群、超级工厂等渠道放量获客。'
  excerpt:
  - 比如工厂我们的客户成本 300-500 就是能接受的。猛上 1688 店群，超级工厂等。成本能接受的范围就猛干。
- name: 兼职模型低风险验证人才杠杆
  desc: '[evidence] 作者早期通过‘兼职低成本试错’模型验证：兼职成本1k/月，单人产出2k利润，放大10人即月利润2万，证明了‘花钱买结果’在低利润模型下的可行性边界。'
  excerpt:
  - 先算一下自己的项目，如果是请人来看，投资回报率怎么样，如果自己干一个月利润只有 3k，那只能请兼职。 兼职花 1k，自己赚 2k，10 个兼职，也是 2w。
- name: 现金流断裂导致模型成熟期错失扩张窗口
  desc: '[claim] 作者观察到的常见失败模式：业务模型跑通、流量渠道优质廉价，但因广告费垫付、账期回款导致现金流不足，未能及时注资放大团队，错失红利期。'
  excerpt:
  - 很多人在模型非常好的情况下，最后发现可能现金流不够，因为广告费、账期的原因，没有及时的放大团队。尤其是模型打磨好，流量渠道也可以，优质且便宜，但是基于现金流或者其他原因，没有及时放大规模。
- name: 标准化执行力与人才淘汰率的正相关性
  desc: '[claim] 实施严格SOP标准（达标留、不达标走）配合‘先模仿后超越’培养策略，能快速筛选出可复制的高绩效员工，并将其优秀行为沉淀为新标准，形成正向飞轮。'
  excerpt:
  - 团队放量的过程之中坚决不让普通员工随意发挥，先模仿，在超越，慢慢的可以可以让一部分优秀的人来尝试，并且把优秀的人的方式想办法提炼，来做模板标准。
  - 核心点：达不到就淘汰洗人。
