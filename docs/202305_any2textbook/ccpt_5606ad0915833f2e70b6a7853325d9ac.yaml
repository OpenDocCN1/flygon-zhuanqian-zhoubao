paper: Gn5_项目筛选模型
desc: 素材提出一套面向新手小白的「小航海项目筛选与放大」方法论，包含从初入生财、锻造武器、筛选项目、勇敢行动到放大项目共五阶段的完整路径，并给出可复用的项目筛选模型、最简商业模型、流量形态理论、福格行为模型应用及增长拆解公式。
concepts:
- name: 最简商业模型（流量-产品-变现）
  desc: 几乎所有项目都符合流量、产品、变现三大模块构成的最简结构，是新手拆解项目的底层框架。
  is_original: false
  excerpt:
  - 几乎所有项目都符合最简商业模型「流量-产品-变现」，如何引流、搭建产品、设置变现就是最基本的武器
  - 阅读精华帖目的是拆解并学习圈友如何引流、搭建产品、变现。拆解2篇可得6个模块（流量、产品、变现各2），拼在一起得到新模式
- name: 流量形态
  desc: 在积累10+流量渠道后会发现引流规律的三种本质形式，即关键词、关系链和算法推荐。
  is_original: true
  excerpt:
  - 拥有10+流量渠道会发现引流规律叫「流量形态」，三种形式：关键词（如SEO）、关系链（如微信裂变、外卖cps发帖）、算法推荐（短视频）
- name: 项目筛选模型
  desc: 覆盖近20项参数的项目评估框架，用于新手以「筛选」而非「挑选」的方式匹配自身能力与资源。
  is_original: true
  excerpt:
  - 构建项目筛选模型，覆盖近20项参数：风险（风险概率、风险程度）、收益（反馈周期、最高收益）、附加价值（货源、人脉粉丝、专业能力、杠杆/复利/复购效应）、市场（持续周期、市场渗透率、供需状态、优化空间）、能力（技能、行业知识、资源）、时间、成本、个人评估
- name: 福格行为模型
  desc: 用于分析自身未能行动的原因，行为发生需动机、能力与触发物三要素同时具备。
  is_original: false
  excerpt:
  - 福格行为模型=动机×能力×触发物，用于分析自己为何没做到
- name: 增长模型
  desc: 将商业项目用公式表示并逐层拆解转化环节，从而找到放大盈利的着力点。
  is_original: true
  excerpt:
  - 增长模型指将商业项目用公式代表再拆解。收益=客单价×支付人数，可逐层拆解为客单价×支付率×咨询率×添加率×引流触达率×私信率×阅读量，提高每步转化率、把源头流量提高
methods:
- name: __overview__
  desc: 五阶段渐进式方法论：先锻造武器掌握最简商业模型，再用筛选模型确定战场，继而勇敢行动（用福格模型自诊），最后用增长模型放大盈利。
  excerpt:
  - 1.初入生财·锻造武器：看精华帖拆解→2.筛选项目·明确战场：构建项目筛选模型→3.勇敢行动·把手弄脏：福格行为模型→4.放大项目·增加盈利：增长模型拆解
  - 积累比收益更重要，积累让我步入下一阶层
- name: 项目筛选操作流程
  desc: 四层递进筛选法则，依次过滤原则、能力、收益、市场，若全部过滤掉则从三个方向排查问题。
  excerpt:
  - 筛选操作流程：先筛选原则（违法违纪决不干）→再筛选能力→再筛选收益→最后筛选市场。若一个项目都过滤不到，考虑是条件太苛刻filter太多、看的项目太少、对项目不了解
- name: 增长拆解公式
  desc: 以收益=客单价×支付人数为起点，向下逐层拆出支付率、咨询率、添加率、引流触达率、私信率、阅读量等可优化的转化节点。
  excerpt:
  - 收益=客单价×支付人数，可逐层拆解为客单价×支付率×咨询率×添加率×引流触达率×私信率×阅读量
  - 提高每步转化率、把源头流量提高
- name: 放大方法
  desc: 从业务本身与扩展业务两条路径实现放大的两类策略集合。
  excerpt:
  - 放大方法：业务本身（矩阵、投放）或扩展业务（业务迁移、变卖流量、卖影响力、培训）
theorems:
- name: 选项目是筛选而非挑选
  desc: 新手选项目的核心逻辑在于评估自身能力与资源是否匹配，而非在众多项目中挑最好的。
  excerpt:
  - 新手选项目是「筛选」而非「挑选」，关注自己能力和资源是否匹配
- name: 积累优先于收益
  desc: 在项目筛选与运营过程中，能力与资源的积累比短期收益更重要，是进入下一阶段的通行证。
  excerpt:
  - 积累比收益更重要，积累让我步入下一阶层
- name: 行动-问题-解决闭环
  desc: 推进项目的基本节奏是开始行动、遇到问题、解决问题，配合福格模型诊断未行动的原因。
  excerpt:
  - 勇敢行动·把手弄脏：开始行动、遇到问题、解决问题
  - 福格行为模型=动机×能力×触发物，用于分析自己为何没做到
findings:
- name: 拆解2篇精华帖可拼出新模式
  desc: '[claim] 原文宣称拆解两篇精华帖可获得六个模块（流量、产品、变现各两个），拼合即得新的项目模式。'
  excerpt:
  - 拆解2篇可得6个模块（流量、产品、变现各2），拼在一起得到新模式
- name: 流量渠道积累超过10个后归纳出流量形态规律
  desc: '[claim] 原文宣称当积累超过10个流量渠道后，可归纳出关键词、关系链、算法推荐三种流量形态。'
  excerpt:
  - 拥有10+流量渠道会发现引流规律叫「流量形态」，三种形式：关键词（如SEO）、关系链（如微信裂变、外卖cps发帖）、算法推荐（短视频）
- name: 筛选条件导致无项目可选的三大原因
  desc: '[claim] 原文主张当项目全部被过滤掉时，原因是条件过于苛刻、可选项目太少、或对项目了解不足。'
  excerpt:
  - 若一个项目都过滤不到，考虑是条件太苛刻filter太多、看的项目太少、对项目不了解
