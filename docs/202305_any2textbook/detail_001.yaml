  - '- 可参照性：普通人可以复制的是其流程与节奏，不是运气'
  - '- 闭环性：完美地打通了从认知、洞察、内容、验证到变现的闭环'
  - '- 强杠杆：一次爆款带来远远超出常规线性劳动收益的回流'
  - '**典型例子**'
  - '- 在碳中和内容这个领域：“发现需求”从新闻热点中找机会；“验证需求”从同行评论区与播放数据得到正反馈；“解决需求”通过持续输出高信息密度的内容来满足大众；“变现”：在权威、信任建立的同时，通过课程、咨询、社群等来实现利润转化（2个月100万利润）'
  - '**边界条件**'
  - '- 爆款案例有其时代窗口期（热点话题有生命周期），可复制方法论，不可复制热点本身'
