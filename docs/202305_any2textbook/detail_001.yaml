- 'no': 5
  name: 决策决定论 —— 阶层跃升的终极较量
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人在原地踏步，并非因为没有能力或勤奋，而是因为关键决策的失误'
  - '- 一个人的命运，是由人生中少数几个关键决策决定的，而不是由无数日常琐事的简单累加决定的'
  - '- 在认知破局的过程中，必须把“做正确决策”作为投入产出比最高的核心能力来锻炼'
  - '**核心定义**'
  - '- 人往上走拼的是决策能力：在同一情境之下，不同决策直接导致截然不同的结果，而决策背后是认知、信息与判断力'
  - '**关键性质**'
  - '- 可积累性：每一个正确决策都会带来资源和信息优势，为下一个决策提供更好的底座'
  - '- 排他性：决策正确一次的价值，可能超过长时间的错误努力'
  - '- 非对称性：决策的收益和风险通常是不对称的，要用“最小可行”的试错来换取信息'
  - '**典型例子**'
  - '- 同样面对“碳中和内容”这个热点，有人决策“刷个好看的条目就走”，有人决策“高强度输出3天、直播间高效验证”；后者的决策带来了500万播放与后续100万利润的转化路径'
  - '**边界条件**'
  - '- 决策能力依赖高质量信息输入，没有信息优势的决策往往沦为赌博'
  - '- 决策他有天然的时效性：特定时间窗口内的正确决策，拖久了价值归零'
  sources:
  - paper: 20230516_056_白手起家赚千万认知
    role: theorem
  excerpts:
  - 人往上走拼的是决策能力
  - 找到已跑通的盘投资入局
- 'no': 6
  name: 创业敬畏论 —— 把创业当成日常事而非激情事
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人把创业想象成“灵光一现”“轰烈一场”，一旦真实面对创业中的枯燥与高压，立即退场'
  - '- 创业启动容易坚持难，大多数人低估了真实创业强度而对自己要求过低'
  - '- 缺少敬畏之心会导致致命误判：把“参与”当“投入”，把“试试看”当“all-in”'
  - '**核心定义**'
  - '- 创业者必须对创业保持敬畏：创业绝不是轻松获利的捷径，而是把高强度、高压、高责任变成“日常”的事业状态'
  - '**关键性质**'
  - '- 常态化：创业者的生活不是“爆发式努力”，而是随时待命、随时推进的永动机状态'
  - '- 敬畏伴随谨慎：敬畏带来对市场的敬畏、对每一分钱的敬畏、对每一次决策的敬畏'
  - '- 门槛重塑：对创业足够敬畏的人，会反对“从0到1的名目创业”，倾向寻找已跑通的盘来入局'
  - '**典型例子**'
  - '- 真正的创业者凌晨3点秒回消息是日常，而不是特殊情况；当别人以为是“拼”的时候，对他而言这就是“日常化”的生活'
  - '**边界条件**'
  - '- 创业敬畏论并不鼓励无限透支身体，而是强调状态的持续高压投入与身体的管理并重'
  - '- 敬畏的对象是“创业的事业本身”，敬畏不等于恐惧，而是对机会成本、风险与收益的清醒'
  sources:
  - paper: 20230516_056_白手起家赚千万认知
    role: method
  excerpts:
  - 创业者凌晨3点秒回是日常
  - 日常化是最牛法门
- 'no': 7
  name: 自我救赎 —— 主动成为自己的贵人
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人的困境是抱怨“遇不到贵人”，觉得成功更依赖外部机缘'
  - '- 把希望寄托在别人身上，本质是放弃了对人生的主导权'
  - '- 既然向上走的瓶颈在于自我系统的落后，那么“自我救赎”就是最可靠的破局通路'
  - '**核心定义**'
  - '- 与其等待贵人的提携，不如列出“贵人所愿意提携的那类人”的特征清单，然后主动成为那样的人——最终成为自己的贵人'
  - '**关键性质**'
  - '- 自主性：救赎的主动权完全在自己手上，不受制于外界机遇'
  - '- 主动性：不是等待机会，而是主动触发被看见的机制（如真诚分享）'
  - '- 价值基础：成为贵人青睐的人，必然是在某个维度上不断自我增值的人'
  - '**典型例子**'
  - '- 真诚大气的分享是实现高效链接最高效的方式：一个愿意把认知高保真传递给他人的人，自然能吸引到贵人与伙伴，而非守财奴式地“闷声发大财”'
  - '**边界条件**'
  - '- 自我救赎不等于单打独斗，而是在自我增值的基础上，善用外部资源与链接'
  - '- 成为“贵人愿意提携”的人需要长期主义，短期表现为“好人缘”，长期表现为“高价值”'
