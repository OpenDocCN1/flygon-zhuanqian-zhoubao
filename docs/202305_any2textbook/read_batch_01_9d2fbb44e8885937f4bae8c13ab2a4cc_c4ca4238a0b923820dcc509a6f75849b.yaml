- file_path: docs/202305/20230516_003.md
  title: 《好主意很多，做下去的很少》
  summary: 小马宋的创业随笔，指出经营企业的大方向确定后，关键是彻底执行，并用减肥、门店拉横幅、餐饮服务标准等例子说明执行之难与执行的价值。
  core_question: 为什么好主意很多但能坚持做好的人很少？如何理解执行在创业中的决定性作用？
  key_judgment: 执行比主意更稀缺、更决定性——许多看似简单的动作（如每天开早会、门店拉横幅）若能做到彻底和持续，就能构成真正的竞争力；长期坚持本身就是一种复利，甚至能带来出版等意外回报。
