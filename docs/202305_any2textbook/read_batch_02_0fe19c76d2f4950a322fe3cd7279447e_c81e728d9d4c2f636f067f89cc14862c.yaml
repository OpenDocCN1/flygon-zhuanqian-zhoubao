- file_path: docs/202305/20230516_009.md
  title: 《人生大坑：操别人的心太多，干自己的事太少》
  summary: 小马宋倡导将稀缺的精力和注意力持续投入到自己的成长和实践中，通过拆解案例和坚持执行来建立优势，而非浪费在八卦和他人琐事上。
  core_question: 普通人如何在竞争中建立优势？注意力应该放在哪里？
  key_judgment: 人与人之间的差距主要来自注意力投向和持续执行力。通过简单、重复且大量的刻意练习（如拆解 1000 条视频），能超过 80% 的同僚；而将注意力消耗在他人八卦和琐事上，是对稀缺资源最大的浪费。
  depth: medium
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 重复（与常见效率类观点重合）
  - 口语化
  screening_conclusion: retain
  reason: 核心观点“注意力是最稀缺资源”具有很强的普适性和警醒价值，配合具体案例（门头、抖音拆解）使其落地，可以作为心法篇的重要章节。
- file_path: docs/202305/20230516_010.md
  title: 《20 岁月入 6 位数的七年创业之旅》
  summary: 一位 04 年出生的大学生梦宸，回顾了自己从 13 岁起开始网赚，经历多次项目尝试和失败，最终在 20 岁达到月入六位数的个人经历。
