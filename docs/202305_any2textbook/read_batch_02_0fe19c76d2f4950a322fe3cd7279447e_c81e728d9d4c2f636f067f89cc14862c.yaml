- file_path: docs/202305/20230516_005.md
  title: 《出名是赚钱的代价》
  summary: 小马宋通过身边多位专业人士婉拒成名机会的案例，指出名气往往伴随着麻烦和负担，对于某些人而言，出名是赚钱的代价而非目的。
  core_question: 对于个人而言，名气（个人品牌）与赚钱之间是什么关系？名气是否总是必要的？
  key_judgment: 个人 IP 的打造并非适用于所有人，对于追求自由、清闲或已有稳定收入的个体而言，过度出名（如出镜）带来的负累（如骚扰、隐私暴露、精神消耗）可能大于收益，因此需要权衡名利的代价，选择适合自己的发展路径。
  depth: low
  suggested_destination: case
  possible_shape: pool
  risks:
  - 口语化
  - 其他：内容浅，以案例为主
  screening_conclusion: retain
  reason: 虽然是日常思考随笔，但提出了与主流“人人做 IP”相悖的观点，可作为 IP 打造主题下的反方案例素材，用于平衡观点、引发思考。
- file_path: docs/202305/20230516_006.md
  title: 《解决真正的问题，而不是试图解决所有问题》
  summary: 小马宋从自身创业经历出发，提出经营公司不能追求面面俱到，而应聚焦于解决当前阶段的主要矛盾，学会区分哪些问题必须解决、哪些会自然消失、哪些可以容忍。
  core_question: 创业者在资源有限的情况下，如何选择和聚焦真正需要解决的核心问题？
  key_judgment: 公司由不完美的人组成，因此无法做到完美。经营的核心是识别并解决主要矛盾，能相对客观地评估问题，接受不完美，要能容忍一些无法彻底解决但不会致命的次要问题（如员工对分配公平的抱怨）。
  depth: medium
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 其他：观点类似常见管理方法论
  screening_conclusion: retain
  reason: 内容虽然简短，但核心观点“将军赶路，不打小兔”对创业者和知识付费从业者均有现实指导意义，可作为创创业者心法或公司经营篇章中的一个章节。
