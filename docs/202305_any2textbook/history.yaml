    1.12 多源对照\n\n本章的两大素材源——《把想法变成钱》和《白手起家赚千万认知》——在多个主题上形成互补与相互印证。我们将它们的共识与分歧逐一梳理。\n\n###
    共识\n\n两篇素材在以下核心主张上高度一致：\n1. **想法/认知高于项目/执行**。两篇都强调\"认知先行\"——先有正确的想法与思维方式，再谈具体的项目与执行。\n2.
