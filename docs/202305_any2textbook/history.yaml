    function:
      arguments: '{"paper": "《打造\"不出镜\"个人IP，10个月变现7位数的方法论！》作者：不讲李。个人IP是你在别人眼中的标签，提到某人就知道他是哪个领域的专家。普通人适合打造IP的两条路径：①有一技之长的IP（如10年房产中介讲避坑）；②资源整合型IP（如美妆博主盘点国货，底层逻辑是「盘点」，帮别人节省时间避坑避险）。能对标的不出镜IP有9类：功能类、职场类、虚拟头像类、读书类、游戏解说、半真人出镜、项目拆解类、成长类、恋爱技巧类。运营抖音核心秘诀：1.模仿低粉爆款起号效率最快：对标最近新起的1-2万粉丝账号，蹭人家视频话题大概率能爆发，打上账号标签。模仿只能是展现形式，内容抄袭走不长远。2.寻找受众最广的核心需求：影视解说受众广泛，深挖影视解说交流群看他们痛点（过不了中视频审核、换赛道），以此为创作话题一条视频涨粉8000+，连更3天打上账号标签。给用户在现状和梦想之间搭座桥。3.私域引流与防封：只盯私域流量增长，私域永远是你的，随时触达用户。内容引流方式：抓人开场话题+项目流程讲解+素材混剪/PPT图片；引流：找最大痛点-结尾设置关键词钩子-引导公众号回复领取-加客服领完整版。PPT视频制作：选题+文案+配音；短视频万能内容框架=【爆点前置】+【项目简述/优势】+【流量来源/内容形式】+【变现方式/评价】+【钩子引流】；制作PPT导出混剪。变现方式3种：卖课程（边际成本低，一锤子买卖）、卖咨询（适合高单价）、卖圈子（更高级持久变现多样，但有冷群风险）。算账：私域日进200-500粉，月6000-15000粉，卖社群单价500按5%转化月15W-37.5W，卖课程单价2000按2%转化月24W-60W。核心两点【热爱+擅长】。",
        "paper_name": "GUH_不出镜IP"}'
      name: tool_ext_concepts
    type: function
