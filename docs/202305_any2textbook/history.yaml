      arguments: '{"fname": "chapters/ch06_福格行为模型.md", "text": "# 第 6 章 谁是\"对\"的人
        —— 用福格模型抵挡行动阻力\n\n## 学习目标\n\n- 理解\"知道却做不到\"这一普遍困境的本质\n- 掌握福格行为模型（B=MAP）的三要素与乘积关系\n-
        学会把任务拆小，把\"能力\"门槛降到可轻松完成的水平\n- 学会设置\"触发物\"并建立\"行动-问题-解决\"闭环\n\n## 6.1 生活类比\n\n你办了健身卡却只去过一次；买了本外语书翻了十页就搁置；说好每天早起却总按掉闹钟。这些不是因为你\"意志力差\"，而是行为没有发生所需的条件。这就像**汽车要启动需要三个要素**：有油（动机）、发动机能转（能力）、有人拧钥匙（触发物）。三者缺一，车就跑不起来。你以为的\"没毅力\"，其实是某个要素没备齐。\n\n##
        6.2 概念地图\n\n```\n福格行为模型\n├── B = M × A × P（行为 = 动机 × 能力 × 触发物）\n├── 动机（Motivation）：想不想做\n├──
        能力（Ability）：做不做得到（拆小任务降门槛）\n├── 触发物（Prompt）：什么时候做（提醒/约定）\n└── 行动-问题-解决闭环\n```\n\n##
        6.3 为什么知道却做不到？\n\n**为什么需要这个概念？** 几乎所有人都会遇到\"道理都懂，就是做不到\"的挫败。我们在第 1 章讲了认知、第
        4 章讲了筛选方法——但如果你知道了却不行动，一切方法都是空谈。与其责怪自己意志力差，不如理解行为发生的科学机制。\n\n**核心定义**：行为并非仅靠意志力驱动。当\"知道\"（认知）→
        \"做到\"（行为）之间存在巨大鸿沟时，往往不是认知不足，而是**行为发生的三个必要条件没有同时具备**。\n\n## 6.4 福格行为模型：动机、能力与触发\n\n**核心定义**：福格行为模型认为，行为发生需要三要素同时满足：**B
        = M × A × P**。其中 M 是动机（Motivation），A 是能力（Ability），P 是触发物（Prompt）。\n\n> \"福格行为模型=动机×能力×触发物。\"\n>
        ——《项目筛选模型》\n\n**关键性质**：\n\n- **乘积关系**：三者是相乘关系，任何一项趋近于零，行为都不会发生。即使动机很强（\"我一定要做\"），如果能力不足（太难）或没有触发（忘了），还是不会做。\n-
        **可诊断性**：当行为没发生时，用这个模型逐个排查——是动机不足？能力不够？还是缺触发物？\n\n**诊断示例**：今天要上传 5 个品但没完成——\n\n-
        动机：是我不想做吗？没动力吗？\n- 能力：太繁琐耗时吗？能否用软件、托人降低难度？\n- 触发物：我忘了？能设提醒吗？\n\n这个模型不只用于做项目，学习、工作等任何需要发生行为的任务都可以用它分析。\n\n##
        6.5 把能力门槛拆到\"够得着\"\n\n**为什么需要这个概念？** 很多人\"做不到\"不是因为不想，而是因为任务太大、太难，导致心理阻力巨大，迟迟无法启动。福格模型启示我们：**与其提高动机，不如降低能力门槛**——让任务小到几乎不可能失败。\n\n**操作要点**：\n\n-
        **最小可行动单元**：把一个大型任务拆成\"5 分钟就能完成\"的最小单位（如\"今天只写一条笔记的标题\"）。\n- **工具化/模板化**：借助软件、模板、现成流程，把能力要求降到最低。\n-
        **外包/求助**：自己搞不定的部分，花钱解决或找人请教，本质上也是\"降门槛\"。\n\n**典型例子**：做小红书很难，那就先\"注册个账号、随便发一条笔记\"；做短视频很难，那就先\"套一个
        PPT 模板做一条视频\"。先把最简单的一步动起来。\n\n**边界条件**：拆小是为了\"启动\"，启动后要逐步加量，否则会停留在\"永远做最小动作\"的舒适区，无法真正推进项目。\n\n##
        6.6 设置\"触发物\"与\"行动-问题-解决\"闭环\n\n**为什么需要这个概念？** 有了动机和能力，还差最后一步——**在需要行动的时刻触发行动**。很多人不是不想做，是\"忘了\"或\"拖着没到点就过去了\"。触发物能解决这个问题。\n\n**操作要点**：\n\n-
        **日程提醒**：用日历、闹钟设置固定时间的提醒。\n- **约定伙伴**：和同伴约定\"一起完成并互相打卡\"，通过社交压力触发行动。\n- **环境布置**：把要做的事放在显眼位置，降低记忆负担。\n\n**行动-问题-解决闭环**：行动就是这么简单——**开始行动
        → 遇到问题 → 解决问题**。你会遇到\"没流量\"\"有浏览没转化\"等问题，那就依次想办法解决（优化转化、改标题）。不要等\"准备完美\"再行动，因为问题只能在行动中暴露、也只在行动中解决。\n\n**边界条件**：触发物的作用是\"启动\"而非\"替代意志\"，长期坚持仍需要内在动机（对本项目有热情或清晰目标）；不要把触发物设计得太复杂，否则本身又成了一个\"难以完成的动作\"。\n\n##
        6.7 动手练习\n\n- 用福格模型诊断你最近一次\"想做却没做\"的事，逐项排查动机、能力、触发物，找出卡点。\n- 把一件你一直拖延的任务拆成最小可行动单元（5
        分钟内能完成），今天就完成它。\n- 为你的一个日常目标设计 2 个触发物（提醒/约定），并尝试执行一周。\n- 复盘一个\"行动-问题-解决\"的小案例，写下你遇到的问题与对应解法。\n\n##
        6.8 本章小结\n\n这一章解决\"知道却做不到\"的难题。我们理解了行为并非仅靠意志力，而是**动机 × 能力 × 触发物**三要素的乘积结果；学会通过**拆小任务、工具化、外包**来降低能力门槛；通过**日程提醒、约定伙伴**设置触发物；并建立了\"**行动-问题-解决**\"的推进闭环。记住：不要等完美再行动，问题只在行动中暴露、也只在行动中被解决。\n\n|
        概念 | 解释 |\n|------|------|\n| 福格行为模型 | B=MAP，动机×能力×触发物 |\n| 降低能力门槛 | 拆小任务、工具化、外包，让行动够得着
        |\n| 触发物 | 提醒、约定伙伴，在需要时触发行动 |\n| 行动-问题-解决 | 推进项目的基本节奏：动起来再解决问题 |\n\n下一章，我们将进入\"增长透视镜\"——把\"收入\"用公式拆解成一级级可优化的台阶，找到最省力的放大力臂。"}'
