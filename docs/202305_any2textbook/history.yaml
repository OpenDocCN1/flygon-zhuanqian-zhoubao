        心态与系统（逆袭本质、创业敬畏论、自我救赎）→ 实证验证（碳中和爆款案例）。\n\n## 1.3 想法本位论——让种子比果实更值钱\n项目不值钱，想法值钱。想法是种子，项目是果实；种子比果实更值钱。原因：高杠杆（想法可无限放大）、可复用（成熟想法可应用多项目）、护城河（认知壁垒难以模仿）。前提是行动力兜底，经需求校准。\n\n##
        1.4 人性需求驱动论——一切商业的源头活水\n商业本质是满足人的需求，需求源于人性。基本欲望（七宗原罪）、安全感、懒惰、炫耀。特征：普遍性、稳定性、洞察性。需守住道德与诚信底线。\n\n##
        1.5 发现-验证-解决需求——让想法落地的三连击\n先发现需求（生活数据热点同行评论区），再验证需求（市场反馈），最后解决需求（提供产品内容服务）。可逆推、低风险、循序渐进。碳中和案例实证。\n\n##
        1.6 逆袭的本质——彻底更换自我运作系统\n逆袭是将思维行为认知习惯构成的自我运作系统彻底更换甚至多次更换。系统性、彻底性、持续性。会经历能力真空期。\n\n##
        1.7 决策决定论——阶层跃升的终极较量\n一个人命运由少数几个关键决策决定。可积累性、排他性、非对称性。依赖高质量信息输入。\n\n## 1.8
        创业敬畏论——把创业当成日常事而非激情事\n常态化、敬畏伴随谨慎、门槛重塑（倾向找已跑通的盘）。敬畏不等于畏惧。\n\n## 1.9 自我救赎——主动成为自己的贵人\n列贵人愿意提携之人的特征清单，主动成为那样的人。自主性、主动性、价值基础。\n\n##
        1.10 投资逻辑替代从零盲动——让创业省去试错成本\n找盘、评估、入局、赋能。降低不确定性、可借力。需要赋能不可搭便车。\n\n## 1.11 实证复盘——碳中和爆款是怎样炼成的\n发现碳中和热点、验证同行评论区、解决产出内容、高强度执行、第三条500万播放、2个月100万利润。方法论可复制、热点不可复制。\n\n##
        1.12 多源对照\n两篇素材共识：认知先行、反对从零开创、需求验证重要、高强度投入是常态。分歧：出发点不同（向外探索vs向内修炼）、对项目态度不同、对贵人解释不同、失败归因不同。\n\n##
        1.13 设计中的取舍\n用决策决定论而非努力决定论；用投资已跑通盘而非从0到1创新；自我救赎强调成为那样的人而非主动社交。\n\n## 1.14
        动手练习\n想法-项目价值评估、需求发现实战、自我运作系统诊断、贵人清单设计、跑通的盘识别、碳中和案例复盘。\n\n## 1.15 本章小结\n从打工人思维到创富思维：确立价值本源、搭建操作方法论、重塑心态与系统、用碳中和案例验证可复制性。\n",
