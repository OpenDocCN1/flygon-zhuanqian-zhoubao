    |\n| 对能力要求 | 全能型 | 资源整合型 |\n| 适用人群 | 极少数的天才开拓者 | 大多数务实创业者 |\n\n</figure>\n\n这个方法论的适用范围值得细讲。我们并非主张所有人都不该创新——天才开拓者依然可以创造全新的品类（比如乔布斯）。但对**绝大多数的普通人**而言，从零到一的死亡率太高，而\"找到已跑通的盘，用资源换取确定性入场\"的成功率高得多。这并非保守，而是敬畏之下的智慧。\n\n###
