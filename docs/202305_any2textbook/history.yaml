      arguments: '{"paper": "《好主意很多，做下去的很少》作者：小马宋 2023-05-08。经营企业除了大方向走对，剩下的就是做执行，执行好公司就好，执行不彻底生意做不起来。很少有人能把一件事做得彻底。比如项目小组每天10分钟开早会，能彻底执行的不多，人有惰性。古茗奶茶年度目标让所有门店拉起横幅，难不难？不难，但让几千家门店按时拉横幅很难，这是执行能力问题。给门店设计了很多销售动作：门迎喊宾、送客、推荐新菜小吃，都能促进销售，但你能保证每个服务员每天每次都按流程来吗？99%餐厅做不到。给自己定任务每天在读书群分享一条思考，做一次不难，做一年很难，坚持做彻底执行，做久了就有回报。经营企业不难，关键是基本动作能否做彻底，像减肥，理论上少吃多动就能减下来，但200人只有1个成功，就是不能彻底执行，减肥成功后又很多人反弹。作者坚持5年。评论：执行第一其他第二、行动生财实干兴邦、知易行难。",
