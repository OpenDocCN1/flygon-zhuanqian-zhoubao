    function:
      arguments: '{"paper": "《从AI四维预测说起——把想法变成钱》作者：甜瓜 2023-05-05。核心方法论：发现需求、验证需求、解决需求。AI四维预测案例：亲戚把四维彩超发家庭群引发讨论，作者想到能否还原宝宝长相。发现需求：需求无处不在，藏在生活对话/海量数据/新闻热点下，多留心。验证需求：搜索短视频平台看同行评论区，是最直接验证需求方式，还需搜索验证伪需求。解决需求=解决问题：用midjourney垫图，倒推关键词可能失效（一张图倒推只描述它本身），需反复调试关键词，思考过程重要，AI很强大但思考产生的创意最可贵。案例2碳中和：大大讲话后碳中和指数暴涨，看评论区高频问题（碳中和是啥、怎么赚钱），根据搜索词做内容，3天高强度输入输出视频发第三条500万播放，2个月带来100多万利润。案例3为ta点歌：不会弹唱如何交付？思考一找会弹唱的人合作，多找几个不同音色。思考二分析最终交付物是视频，把问题从弹唱变成做视频，用素人唱歌音频（唱吧全民K歌）。总结：项目不值钱，想法值钱，思考是持续赚钱源泉。人性背后尽是需求，需求背后金钱不眠。",
        "paper_name": "20230516_073_把想法变成钱"}'
      name: tool_ext_concepts
    type: function
  - index: 2
    id: call_sfiiqlde3mjkmuwuedh8iheq
    function:
      arguments: '{"paper": "《我是如何白手起家赚到第一个1000万？》作者：比高 2023-05-05。逆袭是自我洗脑、更换自己运作系统，不是迭代颠覆，是彻底更换甚至更换多次。1.对创业要足够敬畏：创业者凌晨3点秒回，一天飞四五个城市是日常，不能心存敬畏只会偶尔努力，做不成日常。智商不低于平均即可，可以笨点执行快点，能把事一件件做好有头有尾就很了不起。开源无限放大，节流是不要让自己陷入恶性循环。能量圈：身处在良性和恶性能量圈，一定要识别良性恶性并选择进入，负能量圈是隐形恶魔。2.要成为自己的贵人：外面只有自己，自己才是救世主，列贵人会提携什么样的人（感恩上进有潜力有爱心），按这些素质成为这样的人，找贵人前先成为自己的贵人。3.要乐于分享，分享要大气：大大方方分享是高效链接方式，今天不存在闷声发大财的机会。敢于做付出的先行者，真诚分享是索取链接方式。4.无欲无求则无敌：人性最容易被利益控制，最高级的吸引是真诚，真诚是社交中最大的杀手锏，放下功利心才能平等。5.要自我洗脑要自我颠覆：被洗脑不是坏事，要选择洗什么脑。赚钱很简单，逻辑就是从对方兜里把钱掏出来，给足够价值让对方主动掏钱，细化（向谁掏、怎么掏、为什么心甘情愿掏、掏了后不收回）。自我颠覆是足够自我也要否定自我。6.选择比努力重要：选择其实是决策的意思，人往上走拼的是决策能力。做选择前提是有足够能力驾驭，选择是匹配自己最优解不是赌博押宝。7.赚大钱做好一件很小的事：大钱不是从大事里赚的，大事都是小事做足做成的，日常化是所有赚钱秘诀中最牛逼的法门。8.要用投资逻辑看待机会问题：不轻易做从0到1的事，找到已跑通的盘投资入局，从1到10梳理SOP标准化，从10到100找发力点复制放大。项目打卡：正确方法+执行+概率性，成功率一般20%-40%较合理，从成功的人中投资。付费会员2.5万多人。",
        "paper_name": "20230516_056_白手起家赚千万认知"}'
      name: tool_ext_concepts
    type: function
