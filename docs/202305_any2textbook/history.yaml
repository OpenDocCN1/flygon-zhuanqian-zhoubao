- role: tool
  tool_call_id: call_dp3in0zcbumq5hqmhrqh39z9
  content: '"# 《 1 年百万利润，知识付费创业心法》\n\n> 原文：[`www.yuque.com/for_lazy/thfiu8/tvuuptrodh6gpamg`](https://www.yuque.com/for_lazy/thfiu8/tvuuptrodh6gpamg)\n\n\n\n##
    (精华帖)(724 赞)《 1 年百万利润，知识付费创业心法》 \n\n作者： 芷蓝 \n\n日期：2023-05-11 \n\n之前写了 10 个知识付费行业新心法，最近又更新了一些，把后续的内容整理上来，希望对大家有些启发。
    \n\nhttps://t.zsxq.com/0ed2pc8Q5（之前 1-10 链接） \n\n11、其实我尝试过很多新的玩法和项目，但是 80%都失败了，而我这几年赚到的钱，其实是
    20% 成功的结果。 \n\n我认为创业失败是必然的，成功才是偶然的，而知识付费创业的好处就是帮你把成本降到了最低，而很多人不明白这个逻辑，既然成本最低了，就算失败你也不会付出太惨痛的代价，那为什么不多去尝试一下呢？
    \n\n12、做知识付费创业，一定要保留边界感，其中最重要的边界就是：这事我不做，这个用户我不收。 \n\n劝退其实是一种营销方式，劝退用户，然后广而告之，让大家看到你做什么生意，不做什么生意，你服务什么客户，不服务什么客户，这样喜欢你的人一定会越来越喜欢，继而找你来付费，不喜欢你的人，就会更加远离你，也省了你的时间精力。
    \n\n所以，保持边界感，既然帮自己赚钱，也是帮自己节省精力。 \n\n13、永远记住一件事：除了阅读、构建知识体系和生产内容这 3 件事自己做，其他的一定要尽可能外包出去。
    \n\n以前没有团队的时候，我总想着什么事情都自己做，聊用户啊，拉群啊，在群里活跃气氛啊，结果你的大部分时间都会被这种重复性的工作占用，根本没时间提升自己。
    \n\n没时间提升自己，你的业务结构就会永远被困在一个小体量里面。能分钱给别人做的事情就要舍得分钱，你要花钱买别人的时间，买的越多，你的业务体量就会越大。
    \n\n业务体量上来了，你就会赚到更多的钱，从而有了更多购买别人时间的资本。 \n\n14、越是好的交付就越暴力 \n\n很多人觉得优质的交付就是不停和用户沟通，带着他们去实操，给他们解答各种问题。
    \n\n如果你这样做就完全错了，这个错分 2 层，第一层是你挑错了客户。 \n\n永远没有最好的交付，只有更好的用户。 \n\n你的精力应该是放在如何生产优质内容这件事上，用户在看完你的内容时，其实已经完成了交付的过程，他来向你付钱，只是为自己的时间价值买单。
    \n\n营销 2 个字，重点在于营，而销售只是一个最终必然的结果。所以之前我的很多合伙人咨询我如何成交某个用户的时候，我说顺其自然就行了，你没成交，说明你输出的内容不多也不好。
    \n\n输出到位了，和用户随便聊两句，一定成交。否则就算你用各种方法，拿到了用户的钱，也是变相的忽悠而已。 \n\n第二层是错在了交付的方式上，越优质的用户，他想要的东西一定是简单和暴力的，比如说我的某些用户，他们为我付费，就是想看看我的产品体系，和交付模式，进来了，看到了，或者打一个电话就明白了，这个交付就完事了。
    \n\n还有的用户过来就是想借助我的流量推一下他的产品，曝光一下名片，做个冷启动，我做完了，交付也就完毕了。 \n\n如果需要你一直陪着回答各种基础问题的用户，那一定是你的问题，你收错人了。
    \n\n15、每一个产品的发售结果都要把它变成下一个产品的营销素材。举个简单的例子，我之前把“产品见证群”这个模式跑通了，沉淀出了一套 sop，利用这个 sop
    可以帮你从 0-1 建立一个新产品的预售方案。 \n\n从底层逻辑去思考，产品见证群到底是什么？其实我们是在为自己的产品发售制作销售素材而已。 \n\n你想，你不是一个大
    v，没有势能，没有流量，这种情况下你去做新产品的预售，有底气吗？有成功案例吗？有势能吗？ \n\n作为一个普通人，答案是没有。 \n\n我们拉一个群，在群里分享我们制作产品的细节，让用户参与进来，然后把这些全部分享出去，这不是就有了营销素材吗？
    \n\n这个就是“平地抠饼”的过程，我们做的每一件事情，都是在为后续的钱打基础，创造素材。 \n\n16、做知识付费创业，你一定要懂得借势，借风口的势，借行业的势，借人脉的势。
    \n\n比如这次我的团队发售《chatgpt 大师课》就是借了风口的势，小鹅通上卖了 60 多万，还没统计其他渠道的收款，预计这一年来，我们能卖到 300
    万的一个业绩。 \n\n这个就是风口的势能，你把握不住，转眼即逝。 \n\n紧接着，chatgpt 我们把它和健身、医美、写作等等行业或者领域结合，去帮助用户节省营销成本，这个就是借行业的势。
    \n\n所以，只有借势做产品，才能让你在一个段时间内获取大量的财富，细水长流没有错，但是有暴富的机会，我们也要拿住。 \n\n17、复制自己，永远是知识付费创业者最后的大招，这个大招可以帮助你获取更多的财富和建立更完整的业务体系。
    \n\n比如说我自己的定位是帮助自媒体创业者通过 IP 营销来提升商业价值。在这个定位下，我可以帮助各个垂直行业的 IP 建立一个底层的营销框架，即我的“个人品牌十字盾牌”。
    \n\n原文链接：https://t.zsxq.com/0eTitiJ5N \n\n那么，如果你想做更高客单价的产品，赚更多的钱，一定是做一个业务，就是教别人来复制自己，再做出一个芷蓝，在我熟悉的领域内创造更多和我一样的人。
    \n\n然后这些人就可以和你一起构建你的知识付费体系生态，和你一起交付，一起赚钱，一起生产内容。 \n\n18、社群生态里的每一笔交易，无论你是否可以直接获益，都要鼎力支持，因为财富来自于交易，农夫用小提琴换音乐家的斧头，看似总量没有增长，但是他们生活的那个小镇却得到了更多的生产力，这是价值的增量。
    \n\n你社群里用户之间产生交易，虽然你没有拿到钱，但是你社群的势能却增长了，你作为社群的创始人或者运营者，可以用势能去吸引更多的人加入社群，这就是新的增量，看淘宝这个
    c to c 平台你就明白了，你最后可以卖直通车赚钱。 \n\n19、公众号这个平台有可能对自媒体新手不太友好，但却是每个知识付费 kol 必备的一个输出平台。
    \n\n因为我们要把成交过的用户，从公寓引流过来的用户“困”在自己的公众号里。他们在小红书、知乎、抖音上面看到的只是我们的生产的内容碎片，所以他们也会用碎片化时间来获取。
    \n\n但是，如果你想让用户购买你的高客单价产品，或者复购你的产品，就必须有一个能够让他们沉浸式阅读，和你深度链接的平台和方式，这就是公众号的魅力。 \n\n所以，你只需要把之前输出的一些碎片化内容按照逻辑整理到知识星球上即可。
    \n\n20、别轻易去扩充团队，你的收益是有周期的，是不稳定的，是需要看外界环境的，而一旦你扩充团队，你的团队成本却是稳定的，我看过太工作室因为扩充团队最后关门大吉。
    \n\n真正的好方法是把自己的核心学员培养成自己的【模块化】交付团队，随用随取，可以外包，就像 u 盘插拔一样方便，而且这些核心用户和你之间的沟通成本还很低。
    \n\n这个系列我应该会写的很快，因为都是切实感受，未来几天会继续分享，希望对你有一些小启发。 \n\n21、懒，对于做知识付费的创业者来说是一把双刃剑。
    \n\n如果你在从 0~1 这个阶段是犯懒，那么你将永远拿不到第 1 个正反馈，你就不会有后面的无限可能。 \n\n但是如果你已经从 1~10，却还是像以前一样一直把自己当成系统的一个关键零件，每天不停的提升自己的工作效率，那你就进入了一个大误区。
    \n\n因为在这个阶段，你要想方设法让自己变得更懒，通过你的资源和财富去购买别人的劳动力。 \n\n你在做每一件事情之前都要想一个问题，这件事儿我可不可以自己不去做？可不可以通过一个系统，或者是说一个机制让别人去做，而我从中获利？
    \n\n所以，从 0~1 你要勤奋，拼自己的时间和精力，这是考验创业者身体和心智的一个过程。 \n\n而从 1~10，你就要懒人思维，用最少的精力和时间去复制➕放大自己从
    0~1 的成果。 \n\n永远记住：一个创业者不能把自己当成系统中的一个零件，而是要当系统的设计者。 \n\n22、你要先赚目标客户的钱，然后再赚同行的钱。如果反过来，你的人设就崩了。举个例子，我是先通过朋友圈卖我的付费社群，卖出了几千个赚到
    100 万后才教别人做朋友圈营销。 \n\n我见过很多人自己小红书还没有做出 1 个万粉账号，就开始做帮助别人做小红书陪跑，这个逻辑是很矛盾的，只要被质疑，你就没办法反驳。
    \n\n先成为行业 kol，你才有可能把自己积累下来的营销方案传递给同行，去收他们的钱。 \n\n23、如果你的产品在私域有复购场景，或者矩阵模式，付费流量一定要尝试下，这里面有个逻辑，就算你的付费推广成本和后端的转化利润打平也没关系，因为只要用户到了私域，你还可以推荐他复购或者买你其他的产品，后面就没有推广成本了。
    \n\n拿我的舞蹈室举例子，每个月大众点评一定会投 5000 元左右，只要到店转化，后面我卖她化妆品、舞蹈服装、课程包复购都是 0 成本了。 \n\n啥也不如更轻松的拿到精准流量重要！
    \n\n24、路径依赖对于知识付费创业者太可怕了，比如我是靠付费社群运营赚到第一桶金的，所以后来看什么商业模式，都会习惯性地在大脑里先去用社群的玩法去验证，让我损失了很多机会。
    \n\n很多创业者也是这样，成功于什么，最后也有可能失败于什么。所以，我后来用 1 年的时间去练习一种思维方式，那就是“二维思考法”。 \n\n先把自己的固有思考路径清空去看问题，这时候就会发现很多种可能；然后再用自己之前的路径去思考，去和刚才更多的可能做对比，用成本原则去看哪种解决方案是最优的。
    \n\n25、能做咨询，就不做代运营。做知识付费创业，大家要严记一个逻辑，代运营服务到最后，很少有客户满意的。 \n\n道理非常简单，每个人的认知边界和执行力都是不同的，我自己就是做
    IP 营销咨询，我太知道这个了。 \n\n我实战过后沉淀下来一个方法论，分享给不同的人，有的人，马上就能拿到正反馈，有的人，一年过去了还是原来那样。 \n\n你看这个就是每个人的差异化，你收个几万块钱的咨询费用，对方只要觉得你这套方法论有用，那么他无论最后有没有做成功，他都不会说什么。
    \n\n但如果你收他一个几十万的代运营，最后因为他自己的原因没做出来结果，他一定会骂死你，然后找你退费。 \n\n而且你做咨询成本也是很低的，做一个圈子，然后每个月定期给他们打电话做沟通，或者说聚在线下一起，做几次分享，这事就完毕了。
    \n\n你去做代运营，还要自己组建团队，这个成本可就高了，如果能做成了还行，如果做不成，口碑还砸了。 \n\n26、知识付费创业，如果你想把业务做大，就必须接纳比你牛的人和你在一个圈子里，甚至舍弃掉自己的一部分利益，努力把这些牛人捆绑在你身边，成为你的合伙人。
    \n\n真正的牛人，永远不是搞定事情，而是搞定人。只要你能搞定牛人，牛人就能给你办很牛的事情。 \n\n韩信点兵，刘邦带将，一个创业者初期的目标可能是带更多的兵去把商业闭环跑通，甚至是把自己当成兵来用，但是后期，你一定会受制于自己的时间精力，这个时候你要做的就是学会带将。
    \n\n这个也是为什么大公司都是合伙人制，因为你不搞合伙人，就没办法把公司做大。 \n\n27、不要先把时间花在闷头做产品和流量这件事上，而是要花在研究自己如何模仿这件事上。
    \n\n模仿谁？他做的产品你能做吗？他在某个平台发的内容，你能发吗？制作这些内容的门槛高吗？能持续做下去吗？ \n\n一旦你能想明白这些问题，接下来就简单多了，无非是执行力的问题。
    \n\n我观察过很多自媒体创业者，真正成功赚到钱的那些人，他们在开始做的时候，就知道自己要模仿谁了。 \n\n而那些失败没赚到钱的人，一开始做的时候，都是自己的臆想，做了一段时间没有反馈，当然就坚持不下去了。
    \n\n28、关键词逻辑一定要重视起来，你的定位，你发的每一篇文章，每一个视频，其实都是在对某个用户关心的关键词进行详细描述，甚至你的用户身份也是一个个的关键词。
    \n\n我在帮助合伙人做定位的时候，都会刻意去引导他们有关键词思维，比如说社会热点关键词就是流量、用户身份关键词就是画像、痛点关键词就是精准流量等等。 \n\n定位确定下来后，你要把所有跟用户本身和他们需求的关键词尽可能的罗列出来，然后在做内容营销的时候，把这些关键词放进去。
    \n\n29、你一定要有能够静默成交用户的路径，因为你不可能每个用户都去聊一遍，有的用户也不一定非要跟你沟通下才去买的课程。 \n\n公众号是一个非常好的静默成交工具，把你在小红书、知乎、抖音等平台上的碎片化内容在公众号上按照一定的逻辑整理一遍就是一篇深度好文。
    \n\n在文章中插入你的课程产品购买链接，未来去不断的引导用户帮你去转发公众号文章，你的产品就会获得更多的曝光，从而静默成交的用户数量就会越来越多。 \n\n30、在做营销之前，一定要分析好自己到底擅长什么。
    \n\n你比如说我，就不擅长做产品，也不太擅长做流量，我真正擅长的是做圈子，做资源的的配置。 \n\n知识付费领域，你其实可以根据自身的情况去尝试 3 种不同的方向。
    \n\n如果精力不够，或者说不愿意去跟别人做社交，甚至情商偏低，我劝你就踏下心做产品，做出来之后，去找到有流量的人，给到一个极高的分销佣金比例，让他们给你去卖，你在后端随时维护更新即可。
    \n\n如果你很有网感，又有精力，我就劝你去做流量，2 种方法，一个是文章视频引流，另外也就是混圈子引流，流量在手，垂直方向上，你可以随便选择自己的合作对象。
    \n\n最后一种就像我这样，擅长资源整合，那么你就做个社群，先舍弃掉自己的一部分资源，给这个社群原始价值，然后你不断的去找到各个领域的 kol，去跟他们谈合作，用自己的社群价值交换他们的势能或者产品。
    \n\n这样你圈子的势能就会越来越大，最后这个圈子就成为了你的王牌产品。 \n\n31、不管用户买不买，你都要在第一时间告诉用户你有什么产品，还要经常在朋友圈或者任何已知渠道去展示自己的付费产品。
    \n\n我观察过很多做知识付费产品的人朋友圈，基本上分为 2 种，一种是疯狂发产品➕出单截图，还有一种，一个月也不发一回自己的产品，每天就是做干货分享，听着都对，就是不知道他是干啥的。
    \n\n你只有让用户知道自己是卖什么的，做什么生意的，他们才能在自己有需求的时候，想到你，然后才是联系你和购买，甚至还有可能在你朋友圈里静默成交。 \n\n不知道就代表想不起，想不起就不会买。
    \n\n32、引流要做加法，服务交付要做减法。 \n\n帮助付费用户科学的做决策才是我们服务的重点。 \n\n而你去引流，要做的是加法，比如说我用自己的那个【100
    个朋友圈营销技巧】或者【100 个个人 IP 营销技巧】来引流，目的就是多写内容，尽可能覆盖更多的用户需求关键词，尽可能在标准答案上面多去铺垫内容。 \n\n有一部分用户是通过在内容平台主动搜索，找到了我的文章中的某一段，他看了之后，觉得和他的定位相同，觉得你说得对，但这个内容是标准的，没有他想要的具体的场景，所以他会去加你微信，然后问具体的问题，这个时候你就可以收费。
    \n\n收费的理由是什么呢？我来帮助你做减法，给你更加垂直和更加有深度的具体场景的回答，而且还可以根据和你的对话，实现为你快速反馈的服务目的。 \n\n你看，做引流的时候要做加法，让更多的人看到你然后找到你，用户付费服务后，你要尽可能的多做减法，帮助用户节省时间，帮助用户做更精准的决策，给用户更快的反馈，这样用户就会觉得很值得。
    \n\n33、大客户跟好客户是不一样的，大客户是愿意为你付费的，好客户是不光愿意为你付费，还认同你的观点，最重要的是还愿意为你做口碑传播的。 \n\n我经常会跟自己的学员说一个概念叫做【关键裂变人】这个关键裂变人就属于好客户，他们会去各个圈子里为你宣传，为你传播产品和理念，这种人你是要加倍呵护的，要给到他们
    2 个点。 \n\n一个叫做“精神爽点”另外一个叫做“物质激励”，说白了就是要给他们名和利，这样他们才愿意继续去帮你做口碑。 \n\n而对大客户，做好你之前承诺的服务即可，在情绪上他们也许跟你不同频，如果你过于热情，还可能让人家反感。
    \n\n34、关系可以变成一种财富，有了这种财富，就可以帮你降低超级个体的运营成本。 \n\n很多人问我，你一个人运营 5000 人的付费社群，还有 500
    人的合伙人团队，是怎么操作的？精力顾得过来吗？成本是不是很高？ \n\n其实我这边就 2 个固定的员工，和一个兼职，但是我可以利用“关系财富”来降低知识付费创业的运营成本。
    \n\n举个例子，比如说我的某个合伙人在小红书领域非常牛，他的服务和产品非常好，但是他不擅长引流，那么我就可以持续帮他去做优质流量的推荐，让他不用担心流量转化问题。
    \n\n这种合作关系的沉淀就是一种财富，未来如果我需要这方面的优质内容，或者某个服务对象需要小红书这方面的更加深度的交付，我就可以拉上他来协助我。 \n\n这种深度的捆绑会随着时间的累积迭代协作效率，和降低协作成本，甚至比我花钱去请一个员工效果更好。
    \n\n大家互相都能赚到钱，这就是关系财富沉淀的基础逻辑。 \n\n如果你也想低成本自媒体创业，那一定要架构出这么一种产品体系，在这个体系内，你就可以沉淀更多的“关系财富”。
    \n\n35、学会低成本试错，是每个知识付费创业者要有的基础认知。你看我跑通的各种玩法，你看我在赚钱的那几个业务，那只是结果，是我在试错之后确定下来的。 \n\n在这个过程中，其实我放弃了很多玩法，比如我之前想针对会员做的那个“小红书云创作”项目，简单来说就是大家一起去创作小红书内容，然后变现后再分钱。
    \n\n这个就没成功，为啥呢？ \n\n① 普通会员群用户之间的关系不够密切，协作成本太高了，没办法像工厂一样统一管理，流水线式生产 \n\n② 后端的利润分配过于复杂，大家的积极性不高，没有合理的利润驱动，大家就没干劲
    \n\n③ 内容原创版权的管理也不好分配 \n\n你看，这个就是在 1 个月的试错过程中淘汰掉的，像这样的小项目验证还有很多，最后都没成功。 \n\n但是好在这个试错成本我是可控的，那个云创在普通会员群没有成功，但是在合伙人这个关系更加紧密，门槛更高的社群中却成功了。
    \n\n如果没有之前的试错，我也不会有这种系统快速迁移的想法，也不会有后面赚钱的各种玩法。 \n\n所以，试错是必要的，一味的守旧或许可以很稳定，但是真的当风口来了，你就没办法把捂住这个红利期，实现短期利润最大化。
    \n\n36、做知识付费创业确实需要线下更深度的连接，但我建议在初期不要搞大活动，最好就是各个区域的小规模线下链接。 \n\n① 大型活动需要一个团队的支持，比如去协调酒店，比如做签到，比如做各种物料支持，包括对活动流程的策划等等。
    \n\n而知识付费创业者一开始一般都是从超级个体做起的，超级个体的优势就是有更强的机动性，可以快速执行。 \n\n但劣势就是没有团队的支持，如果做大型活动，自己一个人肯定是不行的，而且成本过高。
    \n\n② 线下聚会人如果非常多的话，基本就没有什么有价值的沟通了，就像上次我们在北京的合伙人聚会，一个屋子里小 30 个人，什么都没聊出来。 \n\n③
    一个知识付费创业者在起势之前，最好要保持核心凝聚力，也就是点对点的深度链接，不能去中心化，所以要控制小圈子的形成，会影响你个人品牌势能增长的速度。 \n\n当然到后期你拥有了大量的用户之后，就不用担心这个问题，反而要去进行赋能，多造出几个社区
    kol，帮助他们进行流量的曝光，产品的曝光，他们之后就会反哺于你。 \n\n37、如果你实在不擅长去公域平台做内容引流，就别强迫自己了，不如多花点钱去别人的付费圈子好好做分享，链接优质的用户。
    \n\n但这个前提是，你的后端必须要有一个超高客单价的产品，因为在私域混圈子引流需要不断消耗你的单位时间价值，你今天操作，今天就有人找到你，你今天不干活，就没人找到你。
    \n\n所以你要保证，只要转化一个客户，这个利润就够你吃一段时间的，就好比古董铺子，平时不开张，开张吃 3 年。 \n\n公域流量获客就不一样了，一个内容爆了，可以在极短的时间内为你带来大量用户，而且在未来很长一段时间内，你就算不去输出内容，也可以享受到被动流量，只是会慢慢变少。
    \n\n就好比有很多来加我微信的人，看的甚至还是我 3 年前在豆瓣上写的帖子。 \n\n创业这件事，没有【绝对答案】，只有【相对答案】，找到适合自己的方法才是最重要的。
    \n\n当然，混圈子引流的要点就是你要为别人提供价值，耍小心眼，小心机，很快就会被别人识破，不要怀疑此点。 \n\n就好比，很多人利用知识星球 3 天可以退款的机制，去加各种星球，然后在星球里留下一篇为自己引流的帖子，就退出，自以为很聪明，其实简直傻到家，无非是在浪费自己的时间而已。
    \n\n你在一个圈子里持续输出高价值的内容，星主也愿意为你做曝光，因为做社群，需要的是持续的优质内容，你可以提供，别人就愿意推你。 \n\n38、不要被“有价值的垃圾”困住，如果你觉得某个产品很消耗你的精力，但是却一直能为你赚到点钱，不如果断放弃吧，这个就属于有价值的垃圾，丢了觉得可惜，但一直这么消耗着，你根本没办法去创造更新的产品，赚取更多的利润。
    \n\n说一个我自己的真实感受，我今年停掉了自己的【朋友圈训练营】这个产品，把这个训练营变成了标准课件➕增值服务的形式来交付。 \n\n因为每个月一起的训练营实在太消耗我了，而
    1499 元的客单价又不是很高，但是需要每天没完没了的给用户答疑。 \n\n后来我把它改成了 999 元的标准课件，用户购买完自己学习，再送你个会员，有问题随时在知识星球里提问，轻松多了，其实一个月也能卖出
    20 多个。 \n\n有了更多的精力，我就可以去交付购买我更高客单价产品的用户。 \n\n当初我也是很犹豫，不舍得一个那小 10 万元的收入，但最终理智还是战胜了小诱惑。
    \n\n39、自己转化不了的流量，要学会用价值交换的形式卖给别人来帮你转化。从我的角度来看，流量要具备 2 个特征，才能帮助你更好的变现。 \n\n第一个是足够精准，比如说有些做快团团业务的小伙伴，喜欢用那种
    1 块钱的产品来引流，这个就大错特错了。 \n\n1 块钱产品引流一定是淘宝客的那种玩法，你想想，过来的人都是准备薅羊毛的，而快团团最终是靠团购优质好物赚取利润的。
    \n\n你要展示的是美好的生活方式，才能吸引愿意为高客单价优质好物买单的人。 \n\n第二个就是要流动起来，流量流量，流动起来才值钱，在你这里用户不付费，不代表在别人那里没办法变现。
    \n\n持续的赚取 cps，在我看来是非常好的商业模式。 \n\n40、做知识付费产品，千万别去给用户科普一个新的概念（跨时代科技产品除外，比如 chatgpt），用户接受一个新概念的成本太高了。
    \n\n我之前给大家分享过一个词叫做“认知接口”，就是你要在用户已有的认知世界里面给他输送新场景，卖它搭建这个新场景的工具。 \n\n比如说我们这次做的【chatgpt】大师课，花了大量的篇章去讲
    chatgpt➕自媒体的各种商业场景应用。 \n\n说白了，就是告诉用户，以前你自己通过写小红书来引流变现，现在这个模式不变，只不过我帮你用 chatgpt➕提示词提升内容输出效率和数量
    10 倍以上。 \n\n这样一说，谁都明白，购买课程的人，不需要知道 chatgpt 神经网络学习原理，只需要知道，我学会了提示词之后，就能用它来帮助小红书更轻松快速的赚钱了。
    \n\n41、不管用户买不买，你都要在第一时间告诉用户你有什么产品，还要经常在朋友圈或者任何已知渠道去展示自己的付费产品。 \n\n我观察过很多做知识付费产品的人朋友圈，基本上分为
    2 种，一种是疯狂发产品➕出单截图，还有一种，一个月也不发一回自己的产品，每天就是做干货分享，听着都对，就是不知道他是干啥的。 \n\n你只有让用户知道自己是卖什么的，做什么生意的，他们才能在自己有需求的时候，想到你，然后才是联系你和购买，甚至还有可能在你朋友圈里静默成交。
    \n\n不知道就代表想不起，想不起就不会买。 \n\n42、不要被自己的定位锁死，定位是帮助你赚钱的，不是让你拿来信奉长期价值的。你看马云，一开始做英语翻译，后来做
    1688，再后来做淘宝，再后来做天猫，后来蚂蚁金服，难道真的干一辈子的英语翻译吗？ \n\n李嘉诚最早是卖塑料制品的，雷军是卖杀毒软件的，腾讯是做小游戏的，看到这你就明白了，想实现财富的跃迁，你的定位就要一直在变。
    \n\n所以我才说，我的定位是跟着项目走的，先判断这个项目是否赚钱，然后我的定位就是在这个阶段服务我做这个项目的。 \n\n44、想赚到更多的钱，你必须得明白一个道理，就是选客户比服务客户更重要。
    \n\n99%成功的创业者，都是靠自己觉醒的，而不是别人通过教育他帮助他觉醒的。 \n\n你去看那些每天需要别人看着监督，去做事情的，可能会有一点点效果，但一定成不了大器。
    \n\n所以，找到一个自我觉醒的人，或者说他正在自我觉醒的这条路上，你去稍微帮助他一下，他就成功了。 \n\n你不帮助他，哪怕是链接到他，他也会成功。也就是说他的成功，99%在于自己，1%在于你，但依然是你的客户。
    \n\n只有这样才能够积累更多的成功案例，有了成功案例，你自己的势能就会慢慢崛起，就会不自觉的吸引到那些正在慢慢觉醒的人。 \n\n然后这个雪球就会越滚越大，你也会慢慢趋向于成功。
    \n\n45、起号的时候，千万别做人设，我觉得甚至连个人简介都不需要去写。 \n\n因为在起号的时候，没有人在意你是谁，这个阶段是内容带人，而不是人带内容。
    \n\n直接找爆款抄就行了，等到了 5000 或者 1 万粉丝的时候，你再把自己的人设加入进去。 \n\n这个时候别人因为觉得你的内容写的不错，才会在意你这个人是怎样的。
    \n\n46、自己会不会做知识付费产品，真的一点不重要，如果你不会做，最快速的变现方法就是找准一个赛道去做内容的拆解或者聚合。 \n\n比如你可以持续分享
    100 个商业案例，100 个裂变案例，100 个实体店引流案例，拆解 xxx 活动引流全流程等等。 \n\n然后在后端卖商业课程，卖引流课程，卖裂变课程，只要是和你拆解的内容垂直的产品都没问题，初期真的不必在意是不是自己的产品，先把项目跑通才是重要的。
    \n\n47、记录自己做知识付费的过程，这本身就是一个很好的内容输出方式，可以到抖音、小红书上搜索一下“创业日记”或者说“副业日记”这类关键词，就能看到很多这样的账号，只要真实，只要你能坚持，用户就愿意关注。
    \n\n一旦你在分享的副业跑通了，就会有用户过来咨询你，到时候无论你是推荐项目、课程，赚 cps 佣金，还是说自己亲自带私教赚高客单价费用，都没有问题。 \n\n举例子，比如说你加入了生财星球，那么自己是怎么看到生财的？然后为什么要加入，加入后都做了什么动作，在星球看到了什么，你有什么想法，接下来要做什么，你做了吗，做了之后的反馈是什么？
    \n\n把这一连贯的动作以及自己的想法融合在一起进行输出，就可以获得不错的反馈。 \n\n48、不要为了新鲜感去不停地探索新玩法，你要在正反馈的路径上找爆点，找用户为你付费的理由，然后不停地去重复这个过程。
    \n\n比如说，你某天发的朋友圈成交了好几个用户，大部分人这个时候就开始作了，觉得自己朋友圈文案还是不错的，各种开始炫技，然后就没有然后了。 \n\n他哪里知道，那天的朋友圈可能就是无意踩中了用户的痛点，真不是他的实力，而是他的运气。
    \n\n49、如果你刚开始入场知识付费，我建议你做一个特别特别小的产品，颗粒度做到最细，就比如你看今年很多人去教别人做小红书，他们的产品涵盖了从定位到引流，从引流到变现的全部过程。
    \n\n新手你是卷不过别人的，怎么办？答案就是做一个小产品，比如我的合伙人小沫同学，擅长视觉美化，所以她就教别人做小红书的封面美化，服务分为 2 个部分，一个是爆款小红书封面的拆解，一个是给你模板。
    \n\n我再给你个建议，如果你自己没有成功案例，自己也没跑通一个完整的项目，甚至还没赚到钱，怎么办？ \n\n你就多花点时间，帮别人找对标账号，别帮人做定位，他想清楚了自己的定位后，你为他提供对标账号，包括对标账号的封面模板，自己平时就是给各种行业领域的账号做分类，然后去闲鱼上找人帮忙做这个封面的
    ppt 模板。 \n\n这个东西做出来后，按照不同的定位类别去卖给别人，一定有人愿意买，因为可以帮助用户快速起号，节省了他很多时间。 \n\n50、我现在才明白，做个人
    IP 其实就是做产品，人就是产品，尤其是营销人。 \n\n别人接触你后，你能否给别人爽点？你跟用户说的每一句话，都是一次用户互动，用户在每一个能看见你的地方，都是一个用户触点。
    \n\n举个例子，所有新加我的好友，我都会马上送他一份 10 万字大礼包，先给对方一个好的互动体验，然后我会问他的卡点是什么，这个就是让他自己展现目标。 \n\n然后我会根据他的卡点，给他一个路径，这个就是用户蓝图，而这个路径上的细节，就是我的产品，购买我的产品，完成这个路径，达成目标。
    \n\n举例子：送完用户礼包后我会问您是做什么行业的呢？有什么卡点呢？ \n\n用户说我是做减脂赛道的，怎么引流呢？ \n\n我会回答说你需要先确定自己的定位，然后是找到对标账号，然后是拆解他的内容体系模板。（这个是路径）
    \n\n接下来我就会推荐我的星球，来星球看精华帖，在里面搜索减脂，看之前的优秀学员是怎么在这个赛道赚到钱的。 \n\n然后来参加我们每个月一次的小红书行动营，我们的导师会带着你一步步的从定位开始做下去，还有打卡作业和点评。
    \n\n好啦，基本就是这样，希望能对你有些启发，不一定适用所有人，但是我的真实感受。 \n\n评论区： \n\n乔帮主 : 先赞后看是美德[呲牙] 老罗 :
    才看了几条，就已解了心中困惑已久的疑惑！有时候收错了人，对自己真的就是一种劫难 牧清影 : 一气呵成看完了，含金量太高，一时难消化完[捂脸] 芷蓝 : 哈哈，有用就好
    芷蓝 : 慢慢来 饭饭 : 写的太好了，果断赞👍 梅子 : 写得太好了，狠狠点赞收藏，常看常新！ 郑鹏鑫 : 【创业失败是必然的，成功才是偶然的，而知识付费创业的好处就是帮你把成本降到了最低】
    为何不去实践呢，---致自己"'
- role: tool
  tool_call_id: call_4gwthq3wu6nn3ofzhwqdbg5c
  content: '"# 从基础认知、账号搭建、内容定位、引流涨粉、账号运营，五大板块拆解如何运营一个能赚钱的公众号！\n\n> 来源：[https://n28vbku1px.feishu.cn/docx/VjTFdmoIhoOIuhx4wYUcc1XGn8g](https://n28vbku1px.feishu.cn/docx/VjTFdmoIhoOIuhx4wYUcc1XGn8g)\n\n嗨嗨嗨，大家好，我是王大牙！\n\n牙运营公众号已经有将近一年的时间了，于是把自己运营公众号的心得分为五大板块：【基础认知】【账号搭建】【内容定位】【引流涨粉】【账号运营】来进行拆解。\n\n全文一万三千字，可以说是非常详细军工饼干级别的干货了，希望能够帮助到想要打造自己的公众号的朋友们，也欢迎各位做自媒体、个人IP的朋友们前来和大牙交流碰撞！\n\n本文适合谁：1、想要了解运营公众号，通过公众号变现的的自媒体小白2、想要巩固私域运营打造个人IP，以公众号作为切入点的自媒体创业者3、希望通过私域内容来过滤公域流量做用户筛选的的创业项目人。\n\n好，废话不多说，直接上干货。\n\n#
    公众号基础认知\n\n![](img/34d8a2602031483bafc823e4344bd39a.png)\n\n## 首先，为什么要做公众号。\n\n###
    第一点：自由输出观点，为自己赚钱。\n\n有的宝子可能和我一样，其实最开始接触到公众号在于投稿。但投稿会面临很多限制，比如要符合其他号主对于文章的要求，以及面临被疯狂拒稿的情况。所以搭建自己的内容平台，能够实现自由输出，并且来为自己赚钱而不是在种种限制下为其他账号打工。\n\n###
    第二点：积累案例成果，打造个人名片。\n\n运营公众号可以作为一个案例成果，是对自己的运营能力的证明，公众号成果也完全可以体现在简历上。公众号运营相对其他平台来说，运营更加简单，也更加容易出成果——如果你现在是还在上学的阶段，或者想要调转行业，运营公众号的成绩可以增色你们的简历，在职场的时候可以添更多一份选择。\n\n公众号也能够作为一份线上名片，我拿理白老师的公众#公众号：理白学长
    作为例子。\n\n在公众号当中你可以通过内容比较丰满地了解到理白学长，不仅包括他的成绩和经历，更能从文字内容中了解到他的性格和个人特点，我们能了解到一个有血有肉的形象，而不只是冷冰冰的一大串介绍。与此同时，你还能知道理白老师有哪些产品，理白老师是做什么的，可以满足你哪些需求。了解了他这个人之后，你会对他产生信任和情感，产生这些之后，也为之后的主动链接，课程选择，跟随成长埋下了种子——这种模式，如果有课程产品，我们也可以来进行学习模仿。\n\n###
    第三点：进入圈子，共同成长。\n\n这是我自己做号之后，认为除了变现之外对我影响最大的一点。运营公众号之后，会自然而然地与其他号主有沟通和交流。比如我自己就加入了很多号主群，也通过报名课程、共同合作认识了很多号主，也结识了特别优秀的非常好的朋友和老师。\n\n环境对人的影响是巨大的，当你有一群非常优秀的朋友在身边时，你不再是单打独斗，而是被帮助着和大家一起往前走，收获珍贵的情谊的同时，认知到行动都能获得巨大提升。\n\n###
    第四点：变现。\n\n大家选择做自媒体账号的最终目标都指向一个，就是变现。可能是利用自媒体账号本身变现，比如通过广告、内容吸引流量获得平台奖励的形式来变现；也可能是有自己的产品，通过自媒体账号传播产品信息，通过卖产品变现——无论是哪一种，我们做号最终的目的就是变现。那么公众号的变现能力怎么样？\n\n公众号已经没落，公众号大不如前、逐渐消亡这种论调大家也听过很多了。但实际上公众号背靠微信，背靠最大的社交平台，即便它现在的发展不如之前迅速，但也不妨碍它仍然是流量最大的自媒体平台，公众号依然是广告主们青睐的对象。\n\n如果你有自己的产品，公众号的粘性粉丝引流到私域也是非常有利于成交的。\n\n变现我拿我自己的账号举例，我前期属于情感号，IP成分不多原创文章不多，引流做的还可以，虽然当时粉丝不多，但是阅读能达到过千，那个时候报价我大概一条广告大概250-450，一个月可以接5、6条；逐渐转型IP号之后，我引流这块有点懈怠，主要在写原创文章增加IP成分，这个时候我的阅读都不高，但是一条广告能报到0.3-0.6。\n\n##
    什么类型的公众号比较适合我们做呢？\n\n我们从两个方面来看，第一个方面是长期发展，第二个方面是变现能力。\n\n有见证人问我兼职号变现能力也很强，能不能做——兼职号变现能力确实很强，但是没有办法长久发展，没有内容，依赖涨粉，而且封号风险比较高，长期性不高。\n\n根据长期发展和变现能力来看，情感IP号是比较适合新手小白做的类型。\n\n大家能够看到很多类型的公众号，比如文案号、科普类账号、科技号等等，为什么这些号不合适去做——从三个方面来考量，一个是受众，第二个是价值方面，第三个是运营成本。\n\n###
    从受众方面考量\n\n什么样的受众的公众号广告主比较喜欢，会给你来投放广告呢？\n\n当然是能出单，具有更高出单潜质的账号，简单来讲就是具有购买力的女性受众比例高的账号。有一些账号的受众是未成年、男性或者年龄比较大的群体，这些账号的购买力没有那么强，广告主的报价就会比较低，甚至根本就不找这些账号投放广告——我们号主都比较熟悉的一点，就是账号的未成年比例越高，越会影响报价。\n\n###
    从价值方面考量\n\n第二点就是账号内容价值。比如说文案号、头像号，这些账号无论是价值和粉丝粘性都很弱，数据虽然看起来不错，但是基本无法出单，所以广告主对这些账号的要求高，报价低。\n\n###
    从运营成本方面考量\n\n第三点，是运营成本。想要写对内容要求很高的类型账号，比如科研类型、医学类型。这种类型的账号，首先受众非常狭窄，再就是写作成本运营成本非常高，成本太高，变现和长期发展就会受限——综上所述，情感IP类型账号是新手小白想要变现，比较合适做的类型。\n\n情感IP号从受众上来说，成年女性比例高；在价值内容上，情感IP号能写的内容非常多，可以是情感、经历、干活分享，如果个人IP的成分高的话，粉丝粘性也会提升，广告报价也会水涨船高；成本上，情感内容和围绕自己的经历、真实感受是比较容易进行创作的，粉丝也能从你的文字中感受到你的个人风格。\n\n大家明确了公众号的价值所在，以及做号的类型方向之后，能够更好地开始。\n\n#
    账号搭建\n\n## 如何注册一个公众号\n\n首先，搜索关键词：微信公众号平台，找到官方的网页点击进入\n\n![](img/cd810ddb9d844c7bd3f4135134165b44.png)\n\n我们一般选择的是个人为主体的订阅号，个人订阅号的流程为：基本信息——选择类型——信息登记——公众号基本信息\n\n点击注册后选择注册的账号类型。\n\n![](img/9f1f46196c5cead8213a90e25aca7830.png)\n\n这里一共有四种类型：订阅号、服务号、小程序、企业微信。我们要选择的是订阅号。\n\n小程序和企业微信就不解释了，订阅号和服务号的区别在于订阅号每天能够群发一次，适用于个人，服务号一个月只能群发4次适用于企业，我们自己做的账号就是订阅号哈，类型不要选错了。\n\n接下来填写邮箱\n\n![](img/6265b364e4af2322ed65e9a3da947d6b.png)\n\n![](img/86cfe9fa682e8173fac5388e4d02edda.png)\n\n注意一个邮箱只能申请一个账号，填好邮箱之后会收到激活验证码，收到验证码后填写信息，设置密码。\n\n![](img/7ee41f8dd7fee7a4541bf6f4251025a2.png)\n\n信息填完之后，就可以进行下一步啦，要是没有邮箱就自己去注册一个，网易、QQ都OK。\n\n填写完毕进入下一步，主体信息这一块。在填写主体信息的时候，需要填写姓名、身份证号码、管理员手机（需要接收验证码）。\n\n注意管理员身份验证这里，需要注意右边方框的要求：使用绑定了管理员本人的银行卡微信扫描二维码，并且进行人脸识别，扫码之后的微信号将成为账号的管理员。\n\n创作者信息，也就是选填的部分可以不填写。\n\n![](img/c6387b41e7142af37e160963a273386c.png)\n\n这一块可以不填哈，可以忽略。\n\n人脸识别成功之后，就会显示管理员身份已确认的字样。下一步检查确认自己选择的账号类型是主体为个人的订阅号。\n\n再接下来就到了填写自己公众号信息的步骤了，在这里提醒一下大家，公众号信息填写的几个小细节：\n\n头像（一个月只能修改5次，不能和其他公众号重名）；公众号名称（一年只能修改2次，第一次取名会用掉一次，谨慎考虑）；微信号设置（一年只能设置一次）；公众号功能介绍（可以注册登录之后再填写）\n\n因为有修改次数的限制，我也先给大家讲解一下填信息的方向。\n\n头像、公众号名称和个人介绍怎么设置，设置成什么类型比较好，最根本的原则就是围绕公众号定位而定。\n\n![](img/c374a158fef01c1e9bbcacda2454baf2.png)\n\n![](img/2dbb01ef6f3a2b4be2d298e8b3513171.png)\n\n比如理白先生、以及我自己的账号，大家可以观察一下头像、公众号名称和个人介绍。\n\n当然，这也并不是什么硬性规定，原则是与你做号的方向定位以及你的做号目的紧密挂钩。你想做情感内容，就往你想要的风格上去靠；想做个人IP号，就用凸显你人设风格的信息和元素。\n\n##
    公众号后台设置\n\n我们进入微信公众号后台之后，首页可以看到公众号的数据，原创内容数量、粉丝数量、昨日阅读数据。\n\n![](img/c4598a54d541c3a37c7fb0bf6b6a92ba.png)\n\n![](img/3da1a1d09de91c59e06b3f8d2c4b69d8.png)\n\n首页可以创建、编辑推文，近期草稿和近期发表的文章以及数据都在首页进行显示。\n\n![](img/6f210a0d7de4277a748a99978415c6cc.png)\n\n在首页把鼠标放在已发表文章上就会出现三个选项，分别是该篇文章发布数据、错别字修改以及精选、复制链接和添加合集——错别字选项是在文章发布后可以修改错别字，设置为精选即将文章置于公众号顶部；我们再看到功能栏，有4大分栏：内容与互动、数据、广告与服务、设置与开发，我们一个一个来看。\n\n![](img/8cdcbdff237da83b04445134a38c0ffb.png)\n\n一、内容与互动：这个分栏当中需要注意的有几个部分：原创、私信、自动回复、自定义菜单、合集标签\n\n![](img/ed86a82a1e9845a5df6240889c68e9ec.png)\n\n原创选项：原创栏可以用来开白名单，也就是开启允许指定账号转载你的文章能够修改并且不显示转载来源。\n\n![](img/73630184038984c3a0849fce0be8e8c3.png)\n\n除了单篇文章开白，还可以选择指定账号全局开白。都是在原创这一栏进行操作。\n\n私信选项：私信能够查看并且回复粉丝给你发送的私信，具有与粉丝互动的功能，但与粉丝的互动内容后台管理员之外的人无法看到，这也是私信和留言的区别，留言是可以设置所有人可见的。\n\n![](img/506dc4b42de23c9fc89b5270fec4e904.png)\n\n自动回复、自定义菜单、合集标签：这三个部分比较重要，这三个部分都会在公众号上显示，也是决定公众号传递信息效果的关键设置。\n\n![](img/1844488c90c4d8bab025d8f3ef2addec.png)\n\n1、自动回复：自动回复分为：关键词回复、收到信息回复、被关注回复。\n\n关键词回复需要自己设置，设置一个指定关键词，在后台输入这个关键词，就会弹出指定内容。\n\n![](img/4b39853fb505a1f13a8530298640e819.png)\n\n举个栗子：我在我的公众号设置了关键词为【牙牙】的关键词回复，后台输入【牙牙】就会弹出我的联系方式。\n\n收到信息回复，即后台回复除了关键词之外的文字，将会统一回复的内容。这里可以回复得具有个性化一点，可以选择随机回复一条或者是全部回复。\n\n举个栗子：\n\n![](img/f6db9a3ea4f2ba882699113fba8db029.png)\n\n我设置的是比较俏皮的一句回复，比较有人设的感觉。\n\n被关注回复是新关注公众号之后会直接弹出的内容，既可以作为个人介绍的补充，也可以放上公众号内容指南，提示粉丝输入后台关键词。\n\n![](img/7b856e3f75b4108ef260e08b930502c3.png)\n\n比如我的新关注设置就是个人介绍+关键词回复指南。\n\n2、自定义菜单\n\n![](img/eb621a6b44f9e874b479e2e7c2c79b8b.png)\n\n这里可以设置自己的公众号菜单栏，可以放自己的自我介绍、资料、商务联系方式以及其他想要露出的内容。\n\n![](img/f22b732d840eb47ea90a54892891fb1e.png)\n\n显示在公众号上是这个效果。\n\n3、合集标签\n\n![](img/87bf7d9fe52ffd4163367073eb5b17ce.png)\n\n合集标签会显示在公众号上，起到菜单补充的作用，进入公众号首页可以直接点击合集看到公众内已经发布过的内容，相当于公众号内容分类。\n\n![](img/66dcd303ae89192760ed55bee9e26edf.png)\n\n这个是内容与互动部分需要注意的。\n\n二、数据。\n\n![](img/890eac1a381b8f36dc7f2cdd3af7062f.png)\n\n数据分栏可以查看到公众号各个部分的数据和分析，可以根据分析看到公众号的成绩和效果，来做调整。 需要注意的是用户分析。\n\n![](img/460ec94439de5201377cae78427e153b.png)\n\n用户分析中的用户属性显示公众号受众信息，主要是性别占比和年龄占比——这里是在和广告主谈广告的时候会用到的！广告主主要看受众部分的数据，有购买力年龄层次的女性占比越高，报价相对更高。未成年、老龄人占比越多，报价相对越低。\n\n接广告一般要求未成年在20%以下，最好在18%以下。\n\n三、广告与服务\n\n![](img/70f2a08d56d6289a80803ab19da5df99.png)\n\n重点关注流量主选项——粉丝超过500之后，就可以开启流量主，公众号文章产生阅读就会带来公众号平台的广告收益。\n\n四、设置与开发\n\n![](img/99c9f6566e45dc1564c2427c6fecfe52.png)\n\n主要关注：公众号设置、人员设置\n\n公众号设置：账号设置，也就是公众号的信息更改；功能设置，主要注意隐私设置要设置为能够搜索到公众号。图片水印设置为不添加，以免出现图片侵权的现象。\n\n![](img/0539d7ac9e321ea0fe749ae2d433268d.png)\n\n![](img/1ff4ec147d707ea16203739272ce02f0.png)\n\n人员设置主要用来增添或去除公众号的其他管理员。\n\n![](img/88fb8d6d8a2ee13f17ce4c11df6d2490.png)\n\n明确了这几个公众号后台设置，公众号的基础设置都能够基础完成了。\n\n介绍完后台设置，我们第一部分的分享课程基本结束了，公众号小白应该对公众号如何操作有了一定的了解。\n\n#
    内容定位\n\n要确定写什么内容，还是要从变现开始说起，变现方式搞清楚了才能考虑该写些什么。干货很多，小白做号能不能变现，主要就看这个部分有没有理解。\n\n我们已经有了账号之后，最先考虑就是：我写点什么呢？怎么确定自己要写的内容？怎么确定我们的内容方向呢？\n\n要确定公众号写什么内容，主要看两点：定位、受众人群。\n\n要确定我们的定位和受众人群，我们就要明确变现方式。 所以我们的思考顺序应该是：怎么变现，依靠什么变现——定位、受众人群——写什么内容。\n\n再次强调一下思考顺序：\n\n1、怎么变现，依靠什么变\n\n2、定位、受众人群\n\n3、写什么内容\n\n我们一步一步来拆，拆的同时我们放几个账号案例，大家更好理解。\n\n##
    变现方式\n\n首先，公众号有几种变现方式：\n\n1、没有产品，最基础的变现方式：广告。广告又分为直投广告和cpa广告。解释一下这两个广告——直投广告：和广告主商定一口价，复制粘贴广告主的文案直接发布，直投广告在阅达到200-300左右就可以尝试去和广告主谈了，举个栗子：\n\n![](img/384f3647ccd3d535c3338eceda9bf4d0.png)\n\n像这个就是直投广告，我们发布之后三天或者和广告主约定时间，就会删掉（避免违规风险）\n\ncpa广告：按照广告点击购买有效人数计算，按照cpa广告的不同，1个有效人数的价格在20+—2元不等，每周结算。接cpa广告有一定涨粉门槛，需要日增粉丝达到100左右，才能挂。但也有一些公众号课程，因为开课号主本身就是广告主，可以在你账号0粉丝的时候直接给你挂上cpa广告，比如茶伞。\n\n什么影响广告报价呢？\n\n直投广告报价高低，主要看的是阅读量、粉丝粘性（购买的概率）、粉丝数量以及购买力女性粉丝占比。 cpa广告收入主要和外部涨粉（公域平台，比如小红书、抖音引流来的粉丝数量）有关，外部涨粉越多，cpa收入越高。\n\n这是第一种公众号变现方式：广告。\n\n2、有产品：借助公众号打造个人IP卖产品。\n\n这里的有产品分为两种情况。 一种是自己没有产品，通过打造个人IP积累粉丝信任，分销别人的产品来获得佣金；第二种是有自己的产品，通过打造个人IP卖自己的产品。比如说我买了一个知识星球，这个知识星球是别人的产品，我邀请其他人通过我的邀请码购买这个星球，我就能拿到佣金，这个就是分销别人的产品。\n\n3、有其他变现渠道，利用公众号做流量池。\n\n举个栗子：昨天有和一位大佬聊到的，他做的是文案号，主要是为了把粉丝引流到自己的小程序上，收入来源于小程序，而不依靠广告。如果你有其他变现渠道，只是想利用公众号搞流量引流到其他地方，那也可以完全不考虑建立个人IP。\n\n想学公众号的小白选手大部分应该都不是第3类，变现方式主要还是是1和2。\n\n变现这部分还没清楚的，也不要着急。因为我们还有变现这个部分要单独讲，因为今天给大家推思考流程，也提前讲一点。\n\n清楚了这三种变现方式之后，我们直接上案例：某可复制情感号+#公众号：失重限期\n\n我们从变现方式、定位、内容来分析。\n\n1、某可复制情感号：做号半年时间，现在粉丝将近8w，变现每月四位数到五位数。主要收入为广告，一周cpa广告收入就能达到4000+，文章阅读量在千阅以上，一条广告报价在0.4-0.8一个阅读。\n\n变现方式：广告。\n\n定位：大学生情感、搞钱经验，受众为18-25岁的群体。\n\n内容：征稿文章为主，原创为次。\n\n这个号的特点是有个人IP的成分，但不多，主要的内容还是以征稿文章为主。\n\n这个账号典型就典型在，收入来源主要为广告。广告收入高低重点在于数据，最重要在于引流。\n\n所以在内容上，只需要有内容来承接住这些流量，征稿文足矣。IP成分能够锦上添花，但能达到理想变现的最主要原因在于引流，但是因为IP成分不高，所以粉丝粘性一般。\n\n这种类型的公众号最适合既没有流量又没有产品，只希望通过公众号本身广告来变现的宝子。\n\n2、彩卉的公众号失重限期：战绩：做号半年，粉丝积累7w+，变现每月四位数到五位数。\n\n变现分为：广告+课程社群，文章自然阅读量均阅达到1300+，一条广告报价在0.5-0.7一个阅读。\n\n变现方式：广告+课程社群\n\n定位：个人IP+自律+搞钱经验+情感，受众为18-26岁的群体。\n\n内容：原创IP文为主，征稿为次。\n\n失重限期属于既注重引流，挣到了广告的收入，又同时在打造IP上下功夫，粉丝粘性比较高。所以能在挣广告收入的同时，也能够借助公众号引流粉丝到私域，培养粉丝信任度，开设自己的社群和课程。\n\n广告主表面看的是数据，但根本上关注的是粉丝购买的概率。 数据好，拼的是人多，1万个粉丝里可能会有5个购买；IP强，拼的就是购买概率高，3000粉丝可能就有30个成交。\n\n解释一下个人IP成分和变现的关系：\n\n1、强个人IP，能够使广告报价提升（粉丝信任，购买概率高），但不够强的话，对于只想通过广告赚取收入的号主来说差别不大。\n\n2、公众号的变现进阶之路：（1）阅读达到200-300可接直投广告（IP锦上添花，引流可达到）\n\n（2）日增100粉可接cpa（IP锦上添花，引流可达到）\n\n（3）个人IP强，分销别人的产品赚取佣金（需要强个人IP）\n\n（4）个人IP强，自己有课程产品，可销售自己的产品（需要强个人IP）\n\n从1到4技能点依次点满。\n\n想要公众号产生收入：1、有内容（可以是征稿，可以原创，有IP锦上添花但也不是必要的），流量来了数据来了，需要文章来承接住这些数据。\n\n2、引流，要把流量引来才有数据，才能实现最基础的广告变现。（怎么引流在第三部分会讲到）\n\n如果只想实现广告变现，那以上操作就足够了。\n\n如果只是想提升广告报价，可以适当写一些原创文章增加IP成分，也不需要太多。\n\n如果想进阶。又想赚广告收入，又想分销产品、开设自己的课程、做知识付费，那就在1、2步骤的基础上多在IP上下功夫，参考#公众号：失重限期。\n\n把这个逻辑盘清楚之后，确定自己的变现方式，才能更好确定自己的定位以及内容倾向。\n\n##
    人设文该如何打造\n\n今天还是接着内容的部分来给大家分享，主要就是人设打造，以及人设文要怎么写。\n\n首先，我们来解释一下什么是人设文。\n\n人设文相当于你的自我介绍。人设文的作用是，让粉丝了解你、接触你，感受到你是个有血有肉的鲜活个体。\n\n最好的人设文就是写自己，用自己真实的状态来面对粉丝。但这个真实并不是说什么鸡毛蒜皮、原原本本地都往上写——首先，这些经历和特点肯定是具有正能量的。可以伤心、可以有消极情绪但是不易过多，因为粉丝关注你是想获取价值。最好的状态是你就是他们想成为的人，你身上的特质也是他们想拥有的特质。如果你负能量太多，陷入独自的伤春悲秋，可能会影响到粉丝，他们对你的兴趣也不会太高。\n\n那么我们打造人设，需要根据我们的账号定位，总结我们身上比较鲜明的特点，以及提取让人想要关注的经历，来放大你的特质。\n\n再次强调一下，最好的人设就是你自己，昨天溟桥的分享也非常有说服力。我们需要用我们真实的特点和经历来进行人设的构造——之所以说是构造，指的是可能会聚焦你性格的某一个部分，或者放大你优点中的一个，给大家深刻的印象，但依然真实，不是虚假编造出来的。真实的文章才有真情实感，虚假的素材你写得太累，读者也不傻。\n\n那么什么叫根据账号定位，总结鲜明特点来放大？举个栗子：比如你的账号定位是成长，那么你自己的成长经历，比如：从小城市到大城市的转换成长，从名不经传到小有名气的成长，从被拒稿到上稿的的成长，这些关于你自己的成长话题都可以作为展示的选题。\n\n如果你的账号定位是搞钱干货，那么你的搞钱经历、成交心得，就是重点需要展示的点。\n\n为什么我们要根据账号定位来选择放大我们的某个特征？因为我们要给自己打上强标签。\n\n只要一提起你，就会让人想到这个强标签。\n\n比如我给我自己打的标签就是热情、社牛、真诚，不断成长。（可能还不够强，继续努力）理白学长的强标签是自律、专业、精力旺盛以及社交悍匪，搞钱狂魔。彩卉的强标签在自律、健身、上进努力、认真负责。\n\n你一提到这个人，就能想起他的特质，或者一提到这个特质，就能想到这个人，这就是我们打强标签的意义\n\n。\n\n总结一下上面的几个点，打造人设要注意几个点：1、正能量和有价值
    2、真实 3、人设聚焦账号定位 4、打强标签\n\n那我们怎么给自己打上这个强标签呢？大家应该都在视频号、抖音或者其他平台刷到过张琦老师。张琦老师当时爆火，深入人心的很大的原因，在于关于她的账号的作品铺天盖地。\n\n首先就是一个，量。你发一篇两篇关于自己人设的文章，就像一个月发两条朋友圈。你自己觉得好像发得挺多了，但可能你朋友圈里的人根本不知道你发了，更不知道你发了啥。但是你每天几条，天天都发，你的内容就更有可能被看到，大家就更能了解你是谁，你有什么特点。\n\n人设文一样，打造要靠时间和积累，所以菁欢现在做的日更其实价值是很高的，日拱一卒，功不唐捐，总有一天会无限爆发出来。\n\n第二，我们打造人设的一个思路：从总到分。首先有一篇对你个人特点进行概括的文章，让大家能够大概了解你，这篇文章也能够成为你的一份社交名片，让人在阅读完这篇文章之后就能认识你。\n\n我们想要做IP账号，打造人设的第一步，先写一篇总的介绍自己的文章，一个目的：看了这篇文章，就能大概认识我了解我，让你成为粉丝的小偶像或者让他们崇拜你，想要成为你。\n\n有了这一篇总结性的人设文之后，我们再去抓取我们想要展示的鲜明特点，对应写针对特点的详细文章，可以说经历、感悟心得、故事、观点。\n\n好，我们来进行一个总结。打造人设最重要的就是围绕你这个人，你的账号就是你的名片，别人看一篇文章就能更深层次认识你，也可能是认识了新的你。\n\n人设的力量，真诚是永远的必杀技。\n\n##
    做好公众号排版\n\n今天我们主要讲的是排版的内容。\n\n首先，我们的排版需要符合一个原则：干净、简洁、浏览舒适、独特风格。前三个是基础，最后一项就稍微要花点心思了。\n\n推文排版是图文排版，我就分成两部分来讲，一部分：图，一部分：文，以及提供几个排版做的比较好的账号给大家参考，以及我看到我们群里有小伙伴分享出来了自己的公众号，我们今天就当场来夸夸，以及提提建议哈。\n\n1、图：先上几个账号，大家可以看看他们推文中的图。#公众号：是鹿酱吖
    #公众号：失重限期\n\n推文中的图片分为这几个部分：1、封面图 2、头图 3、标题、分割标识 4、插图 5、底图\n\n封面图是公众号的门面，如果随随便便一张图就做封面，那可能会损失一些曝光的机会。\n\n首先，封面的风格需要与文章标题或者内容比较相符；其次，可以在多次尝试之后，确定封面的风格，在图片上加上一些文字，文字可以是有关内容的，也可以是突出公众号的。\n\n举个栗子，我们来看这个封面：\n\n![](img/e158b31f97ea42b654de488df8bb9829.png)\n\n![](img/af38ab83391bef43dd68dbd6d6191594.png)\n\n风格统一，提示内容，强调公众号名称，一眼看过去，舒适度很高，而且给到的第一眼信息量很足。\n\n如果我们是往个人IP方向发展，可以把自己的生活照作为封面。\n\n![](img/c8bd66c4d3df1567f219e33a5a223d19.png)\n\n![](img/7d0a62ee2fc4b37d31624e8a3e8d742f.png)\n\n看账号内容=看人的感觉一下子拉满，如果本人不想出境，也可以找一个和你的IP气质比较相似的人物图片作为封面，我自己会用到这种方法。\n\n![](img/d175ae3600c339339eb0fe1d84909d6d.png)\n\n![](img/e2be442d069450c0fa2e291666579c29.png)\n\n当然，如果和内容相关，封面图也可以放聊天记录这种带有简短信息的图片，起到吸引大家浏览内容的效果。\n\n这个针对封面图的几点建议，大家在平时看账号的时候，看到自己觉得很不错可以借鉴的方式也可以模仿。\n\n2、头图\n\n头图一般放在文章开头，我主要讲放能够增强IP效果的头图。\n\n![](img/775aecc409f6a2f128b6e8a901aba1ec.png)\n\n![](img/7f46b501f88c01512343bd4eb7e884e0.png)\n\n![](img/233d8a5825e676998ffdf6d4e47a8d6a.png)\n\n这些都是具有个人IP特色的头图，可以是静态的图片也可以是动图，最主要的就是能在看到内容的第一眼先看到你的个人IP特色。头图固定放在每篇推文开头，每次发推文都相当于强调账号的IP属性。\n\n制作图片大家可以使用作图软件：搞定设计、图怪兽、醒图等。\n\n3、标题、分割标识\n\n![](img/b6c91d31cc768a7661ecca63dbf7c967.png)\n\n举三个栗子，标题可以是数字，也可以是一个小标识，也可以是一张图文标题，主要根据我们自己的风格来进行设计。\n\n我们排版的工具给大家推荐135编辑器和秀米，工具中就有现成的标题或者装饰元素来点缀推文。\n\n4、插图\n\n插图是很有必要的，是为了让整篇全是字的文章看起来没那么累。有些号主推文不配插图，整篇看下来就感觉密密麻麻，用插图来控制文章被阅读的节奏。\n\n以及提示：插图不要带水印，其他的水印和自己公众号的水印都不要带，避免侵权的风险。\n\n5、底图\n\n底图主要起到介绍号主或者提供联系方式的作用。\n\n![](img/f30609f9d11e79265da4041419b0ce2e.png)\n\n![](img/7a542f0045a7af02dc545eb9a7dfdefc.png)\n\n![](img/5cc899be9d650f932454d7cc116a2165.png)\n\n也可以提示粉丝点赞、在看。\n\n注意，图片和颜色和风格最好能够统一，有一个账号主题色。用色过多会显得画面很乱，影响浏览，装饰盖过文字喧宾夺主。\n\n2、文\n\n文字排版给大家一个参考格式：\n\n正文字号15\n\n两端缩进8\n\n字间距1\n\n行间距1.75\n\n可以根据风格自行调整\n\n#
    引流涨粉\n\n![](img/09511cefe28126ccfc616232c0fb3601.png)\n\n## 引流-变现的逻辑\n\n我先说2个逻辑：\n\n###
    第一个逻辑\n\n引流涨粉只是表面现象，我们更加关注的应该是引流来的粉丝是否能够变现。所以在做号之前，要先明确自己变现方式，才能明确你应该如何引流，引流什么样的粉丝。还不明确自己自己的变现方式，建议去补补27号的分享，会清楚很多。\n\n其中广告变现，我们引流来的粉丝性质大多数为兼职粉。我详细讲的引流是主要是兼职粉引流。\n\n###
    第二个逻辑\n\n引流就是先吸引人来看，你的内容对来者做一个筛选，感兴趣的留下，不感兴趣的离开。来看你的人越多，留下来的人才可能越多。\n\n公众号变现最重要在于两点：引流、IP。有一个先后关系，先要有流量，IP才能让流量变成留量。有了流量，我们的IP才能实现变现。所以引流真的很重要，即便内容再好、再干，别人看不到，也没法变现。\n\n我们引流的目的：一个是为了增粉，为了冲阅读量，根本是为了提升广告报价；第二个是为了让更多的人留下来，从流量到留量，能够开拓更多的变现方式，比如卖社群、卖课程、卖知识付费。\n\n公众号最基础的收入是广告收入，主要看阅读量、粉丝量以及其他指标。当阅读达到200-300的时候就可以开始接广告了。\n\n阅读量我分为两部分，一部分叫做自然阅读，一部分叫做涨粉阅读——自然阅读：和内容、粉丝粘性有关，文章本身的阅读；涨粉阅读：只要你增粉够多，文章阅读可以直接冲量。\n\n举个栗子：比如你最近发布的一篇文章，自然阅读只有100；但你引流成功，新增了1000粉丝，那么你这篇最新发布的文章阅读就会被冲量，最后达到600-800的阅读。\n\n大家可能看到一些账号，觉得内容平平无奇，为啥阅读量那么高，那可能是人家引流涨粉做的好。\n\n我总结一下引流-变现的逻辑：1、把大量的人先吸引来，来的动作会留下数据，阅读量+涨粉数，能够提升广告报价。（无论是直投广告还是cpa，不知道这些是啥的看27号分享）\n\n2、账号内容、你的IP会对来的人进行筛选。感兴趣的留下，不感兴趣的离开，流量变留量。\n\n3、留量池成为潜在客户，可以对其进行销售动作，分销其他人的产品获得佣金、销售自己的社群、课程变现。\n\n以上就是公众号引流-变现的逻辑，先把这个逻辑理顺，你在知道你做公众号是在做什么，你做公众号，变现从哪变，才能知道自己缺的是什么，下一步要做什么。\n\n##
    去哪引流、怎么引流\n\n去哪引流。两点：内部引流+外部引流\n\n### 内部引流\n\n在微信这个生态中进行引流，微信哪里有流量就去哪里引（其他公众号、社群、知识星球）；外部引流：去微信之外的公域流量池引流，比如小红书、知乎、抖音、快手等。\n\n内部引流方法：1、把其他微信公众号账号的粉丝引来自己的账号2、社群引流3、知识星球引流。\n\n社群引流和星球引流，需要提供更多内容和交流成本。引流来的粉丝相对少但质量相对高，一般用来销售产品，现在没有什么基础的宝子不用考虑哈。\n\n小白白主要看内部引流的第一种，把其他账号的粉丝“勾引”到自己的账号上来。方法有这几种：\n\n1、找征稿号单推（花钱）：花钱找征稿号去推你的征稿函、兼职函。这里有一个小细节我也说一下，小白白可以去找按百阅5-8元计算的征稿号，比一口价的性价比更高。花钱的项目，咱能省就省哈，勤俭持家，省钱=赚钱。找征稿号单推可以是起号时候，第一批粉丝积累。\n\n2、找同等粉丝、阅读的账号互推（免费）：要做到第二点，首先你得有点粉丝和阅读，如果太低，可能找不到愿意和你互推的号主。可以先花钱单推再去互推。\n\n3、联合几个号主红包抽奖活动：可以找一个粉丝多的账号，发布红包抽奖活动，好处是不发自己账号没风险。也可以几个号主各自把联合抽奖发在自己的账号上，有违规风险。\n\n###
    外部引流方法\n\n1、上车（有资金的宝，可以靠砸钱快速涨粉，快速起号）\n\n2、找车发车（性价比高，小钱换取大涨粉，需要投入精力找车，爆车涨大粉靠点经验和运气）\n\n3、自己做账号，自力更生（需要积累，引来的粉丝质量好，已经有产品可以考虑自己去公域开账号）\n\n小白主要看1和2，2性价比高哈，重点关注2。\n\n给宝子们解释一下什么叫“车”：我们到外部的平台找到博主，投放我们公众号的广告。博主的一篇内容一般可以宣传6-8个号主，找博主的宣传费用被上车号主按位置分，靠前的价格会贵一些，靠后的价格低一些。几个号主一起到公域宣传的动作就是“上车”。\n\n自己找“车”，相当于自己找博主，可以免费占据第一个宣传位。“上车”“找车”部分有号主圈自己的规则，细节很多，之后再单独拎出来分享，现在大家只需要知道有一种这样的引流方法，知道它大概是什么就可以了。\n\n插个题外话。之前有宝子来问我，有没有既不用花钱又省时省力的引流方法——没有。\n\n可能有，但我还不够牛，我不了解。但你小白没积累，既不想花钱又不想花精力花时间，号主千千万，我就问一句凭啥你涨粉，凭啥你赚钱？这话听了我人都要气撅过去……当然如果大家以后找到了这种好事记得带带我……\n\n###
    怎么引流\n\n无论是内部还是外部引流，都是把流量“勾引”来自己账号。那么我们怎么“勾引”呢？需要一个钩子。\n\n征稿函、兼职函就是钩子，当然什么样的钩子，勾到什么样的粉丝。\n\n兼职和征稿能大量吸引到流量，相当于质量如何暂且不论，引来的粉丝鱼龙混杂，但都是有兼职需求的人；想勾引其他类型和质量的粉丝，可以用其他钩子。\n\n但对公众号小白来讲，征稿和兼职函是能吸引人最多的钩子，也是能在短时间让我们马上拿到广告收入的引流钩子。\n\n所以我重点讲征稿函和兼职函，我们先来看看征稿函和兼职函长啥样：\n\n![](img/9e3c21d0db2492059084fa12a8be49a3.png)\n\n这是我的征稿函。\n\n![](img/e9a1dba1e39647f194e4f37be4ccc3e0.png)\n\n这是我的兼职函。\n\n首先，征稿函和兼职函都是真实有效的，不是假的——征稿，既可以让号主小成本获得还不错的内容减轻更新的压力，又能让一群投稿的人找到投稿机会，说不定可以遇到狠不错的写手。稿费可以按情况自行设置，大于25引流的质量会相对高一些，一般我们设置30打底，等到账号收入高了可以再提升稿费，来提升筛选门槛。\n\n兼职，这里说的兼职是一些你自己设置的小兼职，比如找错别字、星标、在看、转发获得一些零花钱。我们要引流就先要有自己的征稿函和兼职函，自己的地盘，根据自己情况制定规则和门槛。\n\n给大家参考几个征稿函，基本大同小异：\n\n![](img/dadbe2d8d7bb29b56f0596a182068c15.png)\n\n（失重限期）\n\n![](img/e474c3b339f10767bf87703e74414db1.png)\n\n（是鹿酱吖）\n\n征稿函和兼职函有啥区别：征稿函单独详细介绍征稿；兼职函包含了所有能在你公众号挣到零花钱的小任务，比如征稿（可以简单概括）、错别字、读文章、投图片等等。\n\n兼职函的“钩子”效果更好，我们对外投放的是兼职函；但是我们真正需要的是征稿，所以会把详细的征稿函放在账号里。\n\n有了兼职函、征稿函之后，我们就可以开始从内部和外部开始投放引流了。\n\n#
    账号运营\n\n我们已经有了一个账号，完成了账号的基础建设，确定了基础定位、写什么内容如何来排版，明白了如何引流，那么我们就打通了账号运营的各个环节。我们先来理顺一下日常账号运营的流程。\n\n首先，我们应该有两个表格：1、内容排期2、引流记录。\n\n##
    内容排期\n\n根据自己的定位，有计划地安排账号一个时间段的内容。比如三天、一周，主要看自己的节奏。\n\n这里补充一个点，在我们的内容方面我给漏掉了。我们平时的内容，除了征稿以及自己原创之外，还可以转载。我们找到其他号主给我们开白名单，这样就可以免费转载其他号主的文章了。号主都是非常愿意互开白名单的，不用担心，觉得哪篇文章很不错，可以大胆找号主开白哈——开白名单就不会在转载的时候显示原来的账号来源，但是我们自己在文章里需要标注一下来源。\n\n账号刚刚起步可以一周2-3更，可以以1原创+1征稿+1转载的形式，仅供大家参考，按照自己节奏调配就好啦。彩卉最近也在给大家开白，大家想开白可以直接找彩卉或者找我，也可以和群里的号主相互开白。\n\n有了内容排期之后，内容更新就会保持一定稳定性。\n\n##
    引流记录\n\n引流记录是用来干嘛的？第一，我们找车、上车会产生一定费用，需要表格记录来控制我们的上车成本；第二，我们需要根据表格记录上车的效果，来根据数据分析上哪些类型的账号效果更好，让之后的引流性价比高，以小投入搏取大涨粉。\n\n##
    运营流程标准化作业\n\n把这两个表格设置好之后，之后就可以制定自己的公众号运营流程的标准化作业计划了，提供一个思路给各位宝子：\n\n日常基础运营主要分为： 1、内容（选题、写作、审稿、排版）2、引流（上车、找车、互推、单推……）3、商务（找广告主谈广）4、社群（社群组建+运营）\n\n在内容方面：1、前一天确定第二天要发布的内容，排版、定时发布（如果条理清晰的宝子提前排版一周，提前定时也完全没问题）2、每两天、三天回复一次私信、审稿\n\n在引流方面：制定引流计划，规定自己在一周大概要找多少车、上多少车，准备多少上车资金，做一个预估。\n\n在商务方面：找广告主，大家可以进入一些号主交流群。很多号主发广告都会三连送广，积累了广告主之后可以去和其他号主交换广告主。想进号主群的可以私聊我，我拉宝子进群。\n\n在社群运营方面：社群需要制定社群规则和活动，来保持社群活跃度。可以在每次发文之后可以发到群里进行三连活动。互动越多，粉丝粘性就越强。\n\n这个思路大概理清之后，我们重点来讲一下社群运营哈。\n\n![](img/ce08264c66b3840d00470d8f48f63519.png)\n\n##
    公众号社群搭建\n\n当然，我们不能只看形式，我们要从目的出发，能够促成目的不限于方法哈，建立社群的形式大家有更好的也完全可以。\n\n1、读者群2、任务兼职群3、打卡群\n\n读者群\n\n所有社群的基础，公众号粉丝都可以引流到读者群，其中包括过稿写手、读者，也可以拉一些相熟的号主进群。读者群一般是我们人数最多的群，也是其他群的基础。\n\n任务兼职群：可以自己设立一些兼职，并做具体群的区分。这里的兼职指的是直接参与到公众号内容、引流、管理这些程序里去的兼职，比如主播（读公众号文章插入到内容种）、成为引流小助理等等——会和三连红包、错别字红包、早起红包这些能获得红包的小活动做一个区分。\n\n打卡或者自律群：这个群可以设置为免费，也可以收个1块钱做一个小门槛，做单独的早起打卡自律群。\n\n我们做社群的目的就是为了拉近和粉丝的距离，提高粉丝粘性，或者让粉丝参与到公众号的运营中来，粉丝有参与感又能减轻我们的一部分工作。\n\n然后有一些小细节可以给大家参考：\n\n读者群，我们可以以互动活动为主。\n\n1、红包抽奖2、特定话题征集3、举办一些小的主题活动，比如读书、答疑、甚至是不定期开点小会议（当然，粉丝粘性是锦上添花，如果没有精力也可以不做太复杂）\n\n但对于以后想做知识付费、课程的宝子，粉丝粘性还是很重要的，如果已经有一定粉丝基数了，可以尝试一下。\n\n###
    任务兼职群\n\n明码标价的、参与到公众号建设里的兼职。兼职内容和价格都由号主来制定，可以按照自己的需求来。比如你缺人引流，你就可以建一个引流助理兼职群。\n\n###
    早起打卡或者自律群\n\n如果你自律做的很好，这个群可以作为你未来开设付费打卡营或者自律群的基础，也可以让自己自律的个人特点深入人心。\n\n社群运营不是一定要设置的部分，但对粉丝粘性的巩固非常有利，社群运营最重要的，就是自己制定好社群规则，规则制定好了，就能少出现社群混乱的现象。\n\n我们平时也会进入很多社群，可以注意一下社群的规则和管理细节，取其精华而自用。\n\n社群运营也涉及到实操的部分，很多细节也要靠实操慢慢改进，如果自己还不知道怎么做，可以多进入一些号主的读者群，做一些借鉴和参考。\n\n![](img/34ae67f6737b865581018e4724e8977c.png)\n\n##
    公众号留言\n\n我们从这几个问题入手：留言功能是啥，有啥作用？怎么开留言？有必要开留言吗？留言功能要怎么用？\n\n1、留言功能是啥，有啥作用？\n\n留言功能是类似在公众号文章下评论的功能，举个栗子：\n\n![](img/e6af81c283376ad3607b01d6be7c018c.png)\n\n![](img/1c21baa6fc993551031c7f25a7b5cf91.png)\n\n留言和私信功能不同，私信的内容仅公众号后台管理员可见，留言功能可以根据管理员选择，公开可见，留言就相当于评论——评论越多、互动性就越强，粉丝粘性就越好，互动性强的公众号文章阅读和推荐也会有所提升。\n\n除了互动，留言也能作为一个能实时更新的公告栏，可以用来做活动、抽奖名单公布。\n\n1、留言的作用\n\n辅助建立人设、增长粉丝粘性，以及最直接接受到粉丝的反馈。所以特别想要直接接收到粉丝反馈的号主，留言功能正中下怀。\n\n拿我自己举个栗子，我属于影响力才干非常靠前，这种特质使我极度渴望接收到反馈。让我知道我的观点被大家看到了，这种反馈能推着我往前走，促使我更新。\n\n2、怎么开设留言？\n\n2018年3月之后我们注册的公众号都不再具备留言功能，所以我们想要开设留言功能，就需要找到一个具有留言功能的账号进行迁移。\n\n迁移的逻辑是：企业号可以和个人号相互迁移，但是个人号不能和个人号相互迁移。\n\n如果你原本注册的就是企业号的话，只需要把一个有留言的号迁移到企业号上就可以了；如果注册的是个人号，都需要先迁移成企业号，再把一个有留言的号迁移过来。\n\n这个过程相对比较复杂，涉及迁移以及收购留言号，如果想要一步到位可以直接找专业迁移机构负责。大家想开留言的话可以去找他，我和圈内很多号主都是在小王子这迁移的，非常靠谱。（关键词：公证迁移小王子）\n\n3、有必要开留言吗？\n\n蠢蠢欲动的宝子赶紧来看，如果我们注册的是个人号，想要一步到位找专业机构开留言是需要一定费用的。\n\n我个人建议现在的小白宝子，如果资金不是很支持，或者刚刚起步，开了留言功能也用不上，那可以先不考虑开留言。我自己的留言功能也是在公众号变现之后才开的，等起步之后，或者已经通过公众号变现，再去开留言都没有问题。留言虽然有很多好处，但前提是得用上。\n\n怎么样算是用上了呢？围绕一点：对粉丝粘性是否有帮助。\n\n要用好留言功能：1、你要有一定的粉丝基础。得有人来给你留言反馈，开留言才有用，否则私信也完全够用了，没有粉丝基础，引流没做好，就算做再好的活动没人参加，留言功能也用处不大。\n\n2、有比较合格质量的内容。粉丝留言无非冲着两个点，一是号主本身，二是内容。如果内容不合格，大家也没有留言讨论的欲望。\n\n3、制定互动性比较强，有一定参与感的留言规则。从鼓励、引导大家留言，到引发大家自发留言。\n\n4、有了留言功能，要怎么来用？\n\n总结一下大家比较常用的方式：\n\n1、话题投稿征集\n\n2、公告通知（抽奖开奖、过稿、活动名单）3、引导留言内容(引导留言感悟、计划)\n\n4、留联系方式\n\n留言就是一个公告栏，是一个曝光点，是推文之外又一个突出重点信息的位置。留言功能用得好，确实能够锦上添花，但也并不是必须具备的模块。\n\n如果单谈提升粉丝粘性，那运营社群也是一个很好的办法，不一定非要开留言哈——围绕增强互动、提升粉丝粘性，来利用好留言功能。\n\n至于留言要怎么开，大家可以去找迁移小王子阿栋！一条龙服务搞定！\n\n最后再补充一点注意：\n\n不能接的广告：1.黑五类2.易经（涉及封建迷信，新榜里的也不能接）3.下载理财APP（有违规风险，新榜里的理财课程也不建议大家接）4.纯文案、没链接，文案装在文档里（不正规）5.后台设置回复引流到QQ群（会被举报违规）6.抖音充值（涉及洗hei钱）7.大牌化妆品打折（可能涉及虚假宣传，新榜里的也不能接）以上都没一个好东西，欢迎大家补充！\n\n以上就是大牙对公众号运营的心得啦！大家可以根据自己的情况来做一个参考，公众号运营也属于私域运营当中的的一大板块，目前大牙在私域运营领域深耕，如果有对私域运营，包含但不限于社群运营、朋友圈运营、公众号运营或者视频号方面感兴趣的小伙伴，欢迎大家前来碰撞交流呀~"'
