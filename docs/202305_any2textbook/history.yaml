      arguments: '{"paper": "《新手小白如何借助生财小航海每月多赚2万元（附：小航海项目筛选模型）》作者：毛韩。核心方法论一套阶段：1.初入生财·锻造武器：看精华帖拆解，几乎所有项目都符合最简商业模型「流量-产品-变现」，如何引流、搭建产品、设置变现就是最基本的武器。阅读精华帖目的是拆解并学习圈友如何引流、搭建产品、变现。拆解2篇可得6个模块（流量、产品、变现各2），拼在一起得到新模式。拥有10+流量渠道会发现引流规律叫「流量形态」，三种形式：关键词（如SEO）、关系链（如微信裂变、外卖cps发帖）、算法推荐（短视频）。2.筛选项目·明确战场：新手选项目是「筛选」而非「挑选」，关注自己能力和资源是否匹配。构建项目筛选模型，覆盖近20项参数：风险（风险概率、风险程度）、收益（反馈周期、最高收益）、附加价值（货源、人脉粉丝、专业能力、杠杆/复利/复购效应）、市场（持续周期、市场渗透率、供需状态、优化空间）、能力（技能、行业知识、资源）、时间、成本、个人评估。筛选操作流程：先筛选原则（违法违纪决不干）→再筛选能力→再筛选收益→最后筛选市场。若一个项目都过滤不到，考虑是条件太苛刻filter太多、看的项目太少、对项目不了解。积累比收益更重要，积累让我步入下一阶层。3.勇敢行动·把手弄脏：开始行动、遇到问题、解决问题。福格行为模型=动机×能力×触发物，用于分析自己为何没做到。4.放大项目·增加盈利：增长模型指将商业项目用公式代表再拆解。收益=客单价×支付人数，可逐层拆解为客单价×支付率×咨询率×添加率×引流触达率×私信率×阅读量。提高每步转化率、把源头流量提高。放大方法：业务本身（矩阵、投放）或扩展业务（业务迁移、变卖流量、卖影响力、培训）。",
        "paper_name": "Gn5_项目筛选模型"}'
      name: tool_ext_concepts
    type: function
