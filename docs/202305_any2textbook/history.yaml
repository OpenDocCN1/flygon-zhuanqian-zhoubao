    1.13 设计中的取舍\n\n- **为什么不用\"努力决定论\"而用\"决策决定论\"？**\n\n努力当然重要，但努力的力量有上限。两点原因支撑决策决定论的优越性：其一，努力是线性投入，决策是幂次影响——你连续努力一年（每天比别人多干
    2 小时），产出是 +30% 的边际改善；而正确选择一个爆发式赛道（或错误选择一条死路），产出是数倍或归零。其二，努力不产生复利，但正确决策产生复利——一个正确决策带来的资源与信息优势，会提高你下一个决策的输入质量，形成正循环。所以不是否定努力，而是把努力用在\"提升决策质量\"上，让努力的价值被正确决策放大。\n\n-
    **为什么不用\"从 0 到 1 创新\"而强调\"投资已跑通的盘\"？**\n\n从 0 到 1 的诱惑在于\"开创者的超额收益\"——你第一个做，你可以吃下整个市场。但它的代价极高：市场教育成本全由你承担、产品不确定性极高、失败率
    90% 以上。投资已跑通的盘牺牲了\"开创者的超额收益\"，换来的是\"跨过死亡谷后的确定性\"。前者适合极少数天才，后者适合绝大多数普通人。这个 trade-off
    的本质是：**你愿不愿意用超额收益的可能，换取存活率的确定性。** 对于敬畏创业的人，答案通常是\"愿意\"。\n\n- **为什么\"自我救赎\"不强调\"主动社交\"？**\n\n一个直觉方案是\"主动去认识贵人、多跑饭局、多递名片\"，但作者没有选择这条路。区别在于：主动社交是在\"索取\"——你在向贵人说\"请给我机会\"；而主动成为贵人青睐之人是在\"供给\"——你在向世界说\"我有你需要的价值\"。前者的核心痛点在于：当你自己价值不足时，再多的社交也只是打扰。所以作者把努力的重心放在\"成为那样的人\"，而非\"认识那样的人\"——主动性体现在自我建设上，而非社交表演上。\n\n##
