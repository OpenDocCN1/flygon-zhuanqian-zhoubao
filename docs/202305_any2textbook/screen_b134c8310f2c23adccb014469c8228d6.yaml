screening_principles: 1) 优先保留完整版全链路实操文本，它们信息密度高、可复现性强，能直接作为手册核心章节或知识库条目；2) 降权处理三类内容：时效性强、操作细节易过时的平台技巧类文本（保留其可迁移的方法论内核，转作案例或附录）；高度依赖特定工具或高风险赛道的案例（降低优先级，仅作了解性补充）；以及故事性大于方法论的励志经验（降为案例参考，不进入正文章节）；3)
  本次筛选未见明显信息陈旧、关联度弱或完全重复的冗余文本，故'排除'组为空；4) 所有降权素材均保留可用信息，不直接弃用，而是调整其在书中的形态与位置。
