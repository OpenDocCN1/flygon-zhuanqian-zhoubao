- file_path: docs/202305/20230516_066.md
  title: 《我是如何用生财，从 0 基础小白做到 257 人团队的？》
  summary: 作者思蒙用长篇篇幅记录了自己作为生财有术社群新人，从月薪3000到带257人团队做短剧项目的成长历程。核心包括：入圈后的迷茫与试错、坚持输出拿到正反馈、参与志愿者项目积累经验、以及在短剧红利期利用SOP快速组建团队的过程。
  core_question: 没有资源、没有背景的社群新人，如何利用好社群生态实现个人能力的跃迁并组建团队？
  key_judgment: 新人的成长阶梯是“先专注一个项目赚钱，再转化为方法论（写SOP）去赋能他人”。在生财，参与官方志愿者活动获取组织经验，是低成本学习规模化运营的捷径，也是从“独行侠”转向“带团队”的关键转折点。
  depth: medium
  suggested_destination: case
  possible_shape: book
  risks:
  - 口语化
  - 重复
  screening_conclusion: retain
  reason: 这是一个非常典型的“社群成长+项目操盘”案例，虽然深度一般，但过程真实且具有共鸣性。其“输出→反馈→机会”的路径，以及参与志愿者活动的建议，是极具操作性的经验，可作为个人成长或社群运营的案例章节。
- file_path: docs/202305/20230516_067.md
  title: 《意外搞到 3 万块，不要全职自媒体》
  summary: 作者二丫分享了自己在上海从事项目经理工作并兼职做自媒体的经历。她曾尝试3个月自由职业，虽单月最高收入达3万，但最终因性格偏好防守、平台政策多变以及社保成本等原因，重新选择回归职场，提出了“防守比进攻重要”的核心观点。
  core_question: 在何种情况下，全职做自媒体/创业是一个不明智的选择？
  key_judgment: 在没有建立足够的护城河（如稳定收入、储蓄、资源）之前，盲目放弃主业去赌自媒体是高风险行为。用“战争中的攻守逻辑”来看：打工是防守，创业是进攻。防守不稳，一切进攻都可能是灾难。
  depth: medium
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 重复
  screening_conclusion: retain
  reason: 这篇内容提供了一个反主流视角，对“全职自媒体”热潮进行冷静分析，逻辑清晰，用“进攻与防守”来类比职业规划很有启发性。可作为“决策思维”或“风险控制”章节的素材，给读者提供另一种选择。
