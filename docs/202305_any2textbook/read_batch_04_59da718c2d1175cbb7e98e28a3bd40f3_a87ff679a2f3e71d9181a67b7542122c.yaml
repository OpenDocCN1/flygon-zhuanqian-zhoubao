- file_path: docs/202305/20230516_053.md
  title: 《聊聊快团团和淘客的对比》
  summary: 作者以亲身经历对比了快团团与淘客两种电商分销模式，详细阐述了快团团在微信内成交、价格、佣金、账期、复购、提醒、文案和定价权等八个方面的优势，并分析了生态内的七种角色机会（如供货团长、帮卖团长、文案服务商等）。
  core_question: 在淘客模式衰落、广告难卖的背景下，快团团相较于传统淘客和电商平台有哪些优势？对普通人来说入局机会在哪里？
  key_judgment: 快团团的本质是私域B2B2C分销平台，其“无账期”、“强提醒”和“店铺打通”等机制重塑了分销者的现金流和复购逻辑。生态内已形成分工，机会远不止卖货，还包括文案、工具、撮合等轻资产服务商角色。
  depth: high
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 时效性
  - 重复
  screening_conclusion: retain
  reason: 文章对一种新兴电商模式的拆解非常系统深入，从平台机制对比到生态角色机会均有独到见解，逻辑清晰，案例详实，具备方法论迁移价值，应作为重点素材保留。
- file_path: docs/202305/20230516_054.md
  title: 《平民开店手册「一」》
  summary: 一篇详尽的实体店开店实操指南，以开“无人自习室”为例，从市场调研、选址、合同签订、装修、开业准备到日常运营，事无巨细地介绍了作者亲身实践的一套方法，核心逻辑是“消费力套利”——在低线城市复制高线城市的消费模式。
  core_question: 一个没有实体经验的普通人，如何通过可复制的流程和模型，开一家大概率盈利的实体店？
  key_judgment: 将实体创业拆解为可计算的公式（如首年利润率计算）和标准化的执行SOP（选址看麦当劳、面试物业、装修清包等）。其核心是“确定性”而非“爆发性”，通过精细化的成本控制和流程管理降低试错成本。
  depth: high
  suggested_destination: chapter
  possible_shape: handbook
  risks:
  - 时效性
  - 口语化
  - 格式预处理
  screening_conclusion: retain
  reason: 该文是高度结构化的实操手册，系统性极强，将“消费力套利”理论与选址、装修、运营等细节结合，虽内容口语化且充满个人风格，但作为案例和SOP模板价值极高，可提炼为实体创业的方法论章节。
- file_path: docs/202305/20230516_055.md
  title: 《承认自己的无能和无知》
  summary: 作者小马宋的“创业46条”系列之一，指出老板因身居高位易产生“无所不能”的幻觉，强调承认自身局限的价值，并提醒老板在保持谦虚同时需防范被专业人士忽悠。
  core_question: 创业者/老板为什么很难承认自己无能和无知？这种承认对经营有何价值？
  key_judgment: “承认无知”是经营中的必要能力，它能让你听进建议、放弃不擅长的事。但认知到这个死结需要较高的元认知能力，且必须通过看一个人“做了什么、做成什么”来交叉验证，而非只听其言。
  depth: medium
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 重复
  screening_conclusion: retain
  reason: 该文简短但直击创业者认知盲区，是“创业认知”章节的好素材。价值在于提出了一个具体的行为准则（承认无知）和对应的验证方法（看他做没做），有普适性。
- file_path: docs/202305/20230516_056.md
  title: 《我是如何白手起家赚到第一个 1000 万？》
  summary: 作者比高分享了自己从23岁赚到第一个1000万的经历，将逆袭归因于自我洗脑和系统更换。文章提出了多个核心观点：敬畏创业、乐于分享、无欲则刚、投资逻辑、选择比努力重要等，并以自己在知识付费、直播带货领域的操盘经验为例。
  core_question: 普通人从0到1赚到第一个1000万需要具备哪些底层认知和思维模型？
  key_judgment: 赚钱不是一个机会，而是一套操作系统。核心在于：1. 用投资逻辑看待项目（不轻易从0到1，找到跑通的盘进行资源加持）；2. 将“真诚分享”作为最高效的链接和流量获取方式；3.
    通过日复一日的执行（如写1000万字）完成日常化积累。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 口语化
  - 重复
  screening_conclusion: retain
  reason: 这是典型的成功者复盘，内容翔实，包含了具体案例（PPT拆项目、直播基地、项目打卡）和明确的思维模型（投资逻辑、能量圈、日常化），对构建“财富思维”章节有很高价值，且案例可作为知识付费/社群运营的参考。
- file_path: docs/202305/20230516_057.md
  title: 《价值千万的个人 IP 策略-百年不改名，全域用同名》
  summary: 粥左罗分享了一条个人IP名字策略：全网全域永远使用唯一的名字且永不改名，强调名字是个人品牌所有资产的沉淀容器，坚持不改名能让所有内容形成联动的影响力网络。
  core_question: 在个人IP打造中，如何通过名字策略实现品牌资产的持续增值？
  key_judgment: 个人IP的名字是核心资产。频繁改名或在不同平台用不同名字，会切断内容间的链接，导致此前积累的影响力无法有效聚拢。正确的策略是选定一个好名字后“百年不改”，通过持续产出优质内容在名字上“播种”。
  depth: medium
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 重复
  screening_conclusion: retain
  reason: 该文章提出了一个非常具体且可立即执行的IP操作准则，观点清晰直白，可以作为“个人IP塑造”章节中的一个关键知识点或行动建议。
