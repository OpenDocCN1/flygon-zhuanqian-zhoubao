- 'no': 1
  name: 项目筛先 —— 从“盲选”到“匹配”
  desc: 本章面向零基础新手，从个体能力与资源出发，建立以“筛选”而非“挑选”为核心的项目选择思维，并引入覆盖多维参数的系统化评估框架。
  nodes:
  - 'no': 1
    name: 新手的两种选择心态：挑选与筛选
    desc: 用“相亲”类比——新手挑项目常像“挑对象”只盯对方条件，而正确的做法是像“筛简历”一样先看自己匹配度。引出“项目筛选是筛选而非挑选”的核心定理。
    role: motivation
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 2
    name: 什么是项目筛选模型
    desc: 定义：覆盖风险、收益、附加价值、市场、能力、时间、成本、个人评估等近20项参数的系统化评估框架，用于在新手阶段匹配能力与资源而非追求最优。
    role: definition
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 3
    name: 项目的“最简骨架”：流量—产品—变现
    desc: 拆解项目的最小结构单元，说明几乎所有生意都可归结为三角模型，为新手建立宏观框架认知，降低理解门槛。
    role: definition
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 4
    name: 四层递进筛选：过滤漏斗
    desc: 给出具体筛选流程，按“违法原则→自身能力→收益水平→市场前景”四层漏斗顺序过滤项目，每层通过才进入下一层。此方法将抽象框架落实为可执行操作。
    role: method
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 5
    name: 积累优先于收益：新手的第一性原理
    desc: 强调能力与资源的复利积累比短期现金收益更关键，将其作为筛选项目时的价值排序指导原则，呼应“筛选”思维的本质。
    role: extension
    src:
    - paper: Gn5_项目筛选模型
- 'no': 2
  name: 商业解剖镜 —— 识别引流的“燃料”与“配方”
  desc: 本章深入最简商业模型的“流量”端，揭开引流前端的三大底层规律，让新手能快速判断一个项目流量可持续性的不竭动力。
  nodes:
  - 'no': 1
    name: 为什么流量各有各的方法？
    desc: 从“有人靠搜索、有人靠口碑、有人靠推送”的现象切入，引出所有引流玩法背后必有规律可循的动机，解答“为什么长得都不一样”。
    role: motivation
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 2
    name: 流量三大形态是什么
    desc: 定义三种可穷举的引流本质形式：关键词、关系链、算法推荐，并分别对应SEO、微信裂变、短视频推荐等典型实例。
    role: definition
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 3
    name: 用“关键词”拦截需求
    desc: 讲解关键词型流量的操作原理：用户主动搜索时用内容占位截流；给出SEO等场景下的基本玩法与适配项目类型。
    role: method
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 4
    name: 用“关系链”驱动裂变
    desc: 讲解关系链型流量的操作原理：利用存量用户的社交关系实现指数级扩散（如微信裂变活动）；强调信任背书的作用。
    role: method
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 5
    name: 用“算法推荐”迎合分发
    desc: 讲解算法推荐型流量的玩法：唯有好内容才能撬动平台推荐，核心是把“内容”当成“产品”。
    role: method
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 6
    name: 解析一个项目：对号入座
    desc: 以“小红书好物分享”为例演示如何识别其引流形态为关键“算法推荐”，并讨论其与关键词和关系链组合空间；帮助新手实战判断。
    role: experiment
    src:
    - paper: Gn5_项目筛选模型
- 'no': 3
  name: 谁是“对”的人 —— 用福格模型抵挡行动阻力
  desc: 本章将心理学福格行为模型引入项目推进过程，解释为什么“想做却老不动”，提出通过设计能力与触发物来确保行动发生的可操作方法。
  nodes:
  - 'no': 1
    name: 为什么知道却做不到？
    desc: 用“办了健身卡却只去一次”的日常体验引入行为执行困境，引出福格行为模型的出场——行为并非仅靠意志力驱动。
    role: motivation
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 2
    name: 福格行为模型：动机、能力与触发
    desc: 定义行为发生的三要素公式 B=MAP，阐释三者的乘积关系：任何一项趋近于零，行为都不会发生。并给出对应示例。
    role: definition
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 3
    name: 把能力门槛拆到“够得着”
    desc: 讲解如何通过将任务拆小（最小可行动单元）、工具化、模板化把任务的“能力”门槛降到可轻松完成的水平，是为了增加发生概率。
    role: method
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 4
    name: 设置“触发物”与“行动-问题-解决”闭环
    desc: 介绍如何用日程提醒、约定伙伴等作为触发物；并给出新手推进项目的标准节奏：开始行动→遇到问题→解决问题，承认问题必然出现并视其为推进信号。
    role: method
    src:
    - paper: Gn5_项目筛选模型
- 'no': 4
  name: 增长透视镜 —— 把“收入”拆成一级级台阶
  desc: 本章教授最核心的增长思维：用数学公式拆解收入，把每个环节变成可测量、可优化的运营节点，从而找到更省力的放大力臂。
  nodes:
  - 'no': 1
    name: 看不清的增长问题，拆成公式就能看清
    desc: 用“火锅店怎么月入10万”引发思考引出公式化拆解，阐述“增长模型”的思维价值——把模糊体感变清晰逻辑链。
    role: motivation
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 2
    name: 增长公式：从一条乘法链开始
    desc: 定义通用增长拆解公式：收益=客单价×支付率×咨询率×添加率×引流触达率×私信率×阅读量，并解释每个环节的业务含义。
    role: definition
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 3
    name: 如何定位你的“瓶颈变量”
    desc: 讲解如何通过逐层拆解自身业务路径找到当前短板环节（最低值瓶颈），明确下一步发力点，避免平均用力。
    role: method
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 4
    name: 增长公式的活学活用
    desc: 以某项目为例展示实际数据赋值过程，定位到瓶颈在“阅读量”，再进一步讨论提升该指标的操作杠杆。
    role: experiment
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 5
    name: 警惕公式的盲区
    desc: 指出拆解型增长模型的局限性：它主要适用于以转化率为核心的线上流量模式，对需要重信任、长周期的项目可能失真，需结合业务属性判断。
    role: limitation
    src:
    - paper: Gn5_项目筛选模型
- 'no': 5
  name: 放大的艺术 —— 从业务内功到生态扩张
  desc: 从一个月入三千的副业到规模化主营业务，本章讨论两条放大路径的不同逻辑，以及如何在放大中维持稳定。
  nodes:
  - 'no': 1
    name: 验证完成，你该“放大”什么？
    desc: 用“小店排队到门口”作为起点，提出放大不是加打广告，而是系统化扩展‘流量-产品-变现’中的强势要素。
    role: motivation
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 2
    name: 放大之路一：把“老业务”做厚
    desc: 定义路径A——业务本身放大：通过矩阵化多账号、平台内投放等手段，把已验证的成功流量路径复制多份，强调提高确定性下注。
    role: method
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 3
    name: 放大之路二：把“新边界”画长
    desc: 定义路径B——扩展业务放大：业务迁移到更大市场、变卖流量资源、出售方法论影响力、甚至转型做培训。借此完成赛道跃迁。
    role: method
    src:
    - paper: Gn5_项目筛选模型
  - 'no': 4
    name: 从拆解到复制：拼单式学习法
    desc: 给出放大核心技能“拆解”训练法：拆解N个对标案例，获取多样性模块后将模块重新拼装，即得到自己的新模式——用最少案例掌握最大变化。
    role: extension
    src:
    - paper: Gn5_项目筛选模型
