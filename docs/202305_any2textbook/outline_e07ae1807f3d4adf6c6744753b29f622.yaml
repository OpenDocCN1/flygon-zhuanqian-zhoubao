- 'no': 1
  name: 执行第一 —— 把“知道”变成“做到”的胜负手
  desc: 本章从企业经营观察的视角出发，带你理解为何成功往往不在于高深理论，而在于对基本动作的彻底执行。
  nodes:
  - 'no': 1
    name: 为什么“大方向”不是成败关键
    desc: 用“方向对了却还是失败”的反直觉现象，引出执行彻底性在成败中的决定性地位。类比：人人都知道减肥要“少吃多动”，但只有极少数人真正做到了。
    role: motivation
    src:
    - paper: 20230516_003_执行
  - 'no': 2
    name: 执行彻底性的定义
    desc: 界定核心概念：对一项基本动作或流程做到100%执行的状态，这是经营成败的决定因素。
    role: definition
    src:
    - paper: 20230516_003_执行
  - 'no': 3
    name: 执行惰性 —— 一切不彻底的根源
    desc: 揭示普遍人性弱点：人天然有惰性，表现为对简单重复动作的懈怠，这是执行不彻底的根本原因。类比：像“重力”一样，时刻把执行者拉向水平线以下。
    role: motivation
    src:
    - paper: 20230516_003_执行
  - 'no': 4
    name: 执行决定论定理
    desc: 形式化核心结论：在大方向正确的前提下，企业成败完全取决于基本动作的执行是否彻底。“执行好公司就好，执行不彻底生意做不起来。”
    role: proof
    src:
    - paper: 20230516_003_执行
  - 'no': 5
    name: 坚持回报定律
    desc: 给出正向激励：将简单动作持续彻底执行足够久的时间，最终必然产生回报，即“做久了就有回报”。
    role: extension
    src:
    - paper: 20230516_003_执行
  - 'no': 6
    name: 案例举证 —— 餐饮服务与项目早会
    desc: 通过正反案例（古茗横幅的坚持、多数餐厅服务流程的不彻底、项目小组早会的纪律）佐证执行决定论的普遍性。
    role: experiment
    src:
    - paper: 20230516_003_执行
  - 'no': 7
    name: 量化现实 —— 99%与1/200
    desc: 用两个触目惊心的数据（99%餐厅做不到按流程服务；200人减肥仅1人成功）量化执行成功的稀缺性。
    role: experiment
    src:
    - paper: 20230516_003_执行
  - 'no': 8
    name: 执行的边界 —— 为何“知道却做不到”是常态
    desc: 总结执行惰性如何长期对抗理性认知，说明单纯的认知改变无法克服执行障碍，必须辅以外在机制（如纪律、基准比照）。
    role: limitation
    src:
    - paper: 20230516_003_执行
