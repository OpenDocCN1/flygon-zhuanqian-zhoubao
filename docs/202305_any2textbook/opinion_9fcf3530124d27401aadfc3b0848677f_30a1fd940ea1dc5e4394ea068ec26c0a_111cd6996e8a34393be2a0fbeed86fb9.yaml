retain_principles: 保留方法论完整、具备通用性且体现核心思维模型的素材；排除高风险、高时效的素材；对平台类实操内容做通用化改写，避免单一平台细节过时。
steps:
- 第一步：提炼全书统一主张，按'认知-筛选-打造-运营-变现'五篇章重组素材
- 第二步：将平台类素材（公众号/视频号/抖音）统一改写为通用方法论，补充理论奠基与风险章节
- 第三步：补充读者定位、章节练习与实操清单，完善全稿并进入编辑审校
risks:
- 平台细节时效性强，需在通用方法论与具体操作之间取得平衡
- 目标读者画像不清晰，需作者确认靶心人群
- '''不出镜IP''等个别案例的普适性需验证，避免读者误以为放之四海而皆准'
