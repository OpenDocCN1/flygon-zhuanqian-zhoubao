paper: 20230516_003_执行
desc: 该素材以小马宋的个人企业经营观察与自媒体实践为例，核心观点是：企业经营成功的关键不在于战略或想法，而在于对基本动作的彻底执行。文章从门店早会、拉横幅、销售服务流程、个人每日分享等多个案例出发，指出绝大多数人因惰性和缺乏坚持而无法将简单动作执行彻底，进而提出'执行第一、其他第二'的经营主张，并强调只有长期坚持彻底执行才能获得回报。
concepts:
- name: 执行彻底性
  desc: 指对一项基本动作或流程做到100%执行、不折不扣完成的状态，作者认为这是企业经营成败的决定性因素。
  is_original: true
  excerpt:
  - 经营企业除了大方向走对，剩下的就是做执行，执行好公司就好，执行不彻底生意做不起来。
  - 经营企业不难，关键是基本动作能否做彻底
- name: 执行惰性
  desc: 指人在执行过程中因天然惰性而无法持续完成简单重复动作的普遍现象，是执行不彻底的根本原因。
  is_original: true
  excerpt:
  - 比如项目小组每天10分钟开早会，能彻底执行的不多，人有惰性。
methods:
- name: __overview__
  desc: 作者采用'案例列举+对比论证'的写作方法，通过多个正反案例（门店管理、个人自律）说明执行不彻底的普遍性，最终以'坚持长期主义'作为解决问题的终极方法。
  excerpt:
  - 项目小组每天10分钟开早会，能彻底执行的不多；古茗奶茶让几千家门店按时拉横幅很难；99%餐厅做不到按流程服务；自己定任务每天分享一条思考，做一年很难。
  - 坚持做彻底执行，做久了就有回报。
  - 作者坚持5年。
theorems:
- name: 执行决定论
  desc: 该核心主张认为：只要大方向正确，企业的成败完全取决于对基本动作的执行是否彻底，而非战略新颖度或资源多寡。
  excerpt:
  - 经营企业除了大方向走对，剩下的就是做执行，执行好公司就好，执行不彻底生意做不起来。
  - 经营企业不难，关键是基本动作能否做彻底。
- name: 坚持回报定律
  desc: 该核心主张认为：将简单动作持续彻底执行足够久，最终必然产生回报，短期见效的想法不如长期坚持的动作。
  excerpt:
  - 做一次不难，做一年很难，坚持做彻底执行，做久了就有回报。
  - 减肥成功后又很多人反弹。作者坚持5年。
- name: 执行第一原则
  desc: 该核心主张（来自评论区，作为补充观点）强调执行力高于一切其他要素，是'实干兴邦'的经营哲学。
  excerpt:
  - 执行第一其他第二
  - 行动生财实干兴邦
  - 知易行难
findings:
- name: 门店执行普遍率极低
  desc: '[claim] 作者宣称99%的餐厅无法保证服务员每次按流程执行销售动作；[evidence] 该结论基于个人行业经验观察，无数据支撑，作为定性判断。'
  excerpt:
  - 给门店设计了很多销售动作：门迎喊宾、送客、推荐新菜小吃，都能促进销售，但你能保证每个服务员每天每次都按流程来吗？99%餐厅做不到。
- name: 减肥执行成功率极低
  desc: '[claim] 作者宣称理论上简单的''少吃多动''只需执行彻底即可成功，但现实中200人仅1人成功（0.5%）；[evidence] 此处200:1为作者引用的非精确数据，用以佐证''执行难''的普遍规律。'
  excerpt:
  - 像减肥，理论上少吃多动就能减下来，但200人只有1个成功，就是不能彻底执行。
- name: 长期执行案例（古茗奶茶）
  desc: '[evidence] 以古茗奶茶''年度目标数千家门店同时拉横幅''作为案例，证实''简单动作的大规模彻底执行''是真实业务中的执行难点，并归因于执行能力。'
  excerpt:
  - 古茗奶茶年度目标让所有门店拉起横幅，难不难？不难，但让几千家门店按时拉横幅很难，这是执行能力问题。
- name: 坚持执行的个人实证
  desc: '[evidence] 作者以自己每日社群分享并坚持5年的亲身实践作为证据，证明''坚持彻底执行终有回报''主张的有效性。'
  excerpt:
  - 给自己定任务每天在读书群分享一条思考，做一次不难，做一年很难，坚持做彻底执行，做久了就有回报。……作者坚持5年。
