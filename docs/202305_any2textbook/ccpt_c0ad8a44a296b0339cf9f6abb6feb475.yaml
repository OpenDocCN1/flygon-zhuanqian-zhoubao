paper: 20230516_056_白手起家赚千万认知
desc: 该素材是作者比高基于其个人白手起家赚到千万级财富的经历，系统阐述的一套关于创业心态、个人成长与赚钱方法论的个人心得与主张。素材并非学术研究，而是高密度的人生经验总结，核心逻辑是通过自我认知重构（自我洗脑）、敬畏创业、成为自己的贵人、真诚分享、强化决策能力、将小事日常化以及以投资逻辑对待机会，来实现个人层级的逆袭与财富积累。
concepts:
- name: 逆袭（系统更换）
  desc: 作者将逆袭定义为对自我运作系统的彻底更换甚至多次更换，而非渐进式的迭代或颠覆。
  is_original: true
  excerpt:
  - 逆袭是自我洗脑、更换自己运作系统，不是迭代颠覆，是彻底更换甚至更换多次。
- name: 能量圈
  desc: 指人所处的社交与心理环境系统，分为良性循环（正反馈）与恶性循环（负反馈）两种状态，作者强调必须主动识别并选择进入正能量圈子，远离作为'隐形恶魔'的负能量圈。
  is_original: false
  excerpt:
  - 能量圈：身处在良性和恶性能量圈，一定要识别良性恶性并选择进入，负能量圈是隐形恶魔。
- name: 项目打卡
  desc: 作者将做项目比作打卡行为，强调其由'正确方法+执行+概率性'构成，并且成功率通常在20%-40%之间才是合理区间（即允许失败的可能）。
  is_original: true
  excerpt:
  - 项目打卡：正确方法+执行+概率性，成功率一般20%-40%较合理，从成功的人中投资。
methods:
- name: __overview__
  desc: 整体方法论是围绕'如何从白手起家赚到一千万'构建的一套个人操作系统升级路径，涉及心态敬畏、自我建设、决策原则、机会选择与执行层面的系列实践指导。
  excerpt: []
- name: 自我洗脑与自我颠覆法
  desc: 主动选择性地接受有助于目标达成的信念（'洗脑'），用以重新编程自己的思维与行为模式，同时在拥有强自我时勇于否定自我，实现信念与行动的彻底迭代。
  excerpt:
  - 要自我洗脑要自我颠覆：被洗脑不是坏事，要选择洗什么脑。
  - 自我颠覆是足够自我也要否定自我。
- name: 成为自己的贵人法
  desc: 在找贵人提携之前，先主动列出贵人会提携之人的特征（感恩、上进、有潜力、有爱心），并努力使自己成为这样的人，强调自我拯救。
  excerpt:
  - 列贵人会提携什么样的人（感恩上进有潜力有爱心），按这些素质成为这样的人，找贵人前先成为自己的贵人。
- name: 赚钱链路细化法
  desc: 将'赚钱'这一概念拆解为可操作的链条：逻辑上是从对方兜里掏钱，前提是给予足够价值令对方主动掏钱，并进一步细化为'向谁掏、怎么掏、为什么心甘情愿掏、掏后不收回'四个环节。
  excerpt:
  - 赚钱很简单，逻辑就是从对方兜里把钱掏出来，给足够价值让对方主动掏钱，细化（向谁掏、怎么掏、为什么心甘情愿掏、掏了后不收回）。
- name: 投资逻辑看待机会法（1到10到100模型）
  desc: 对待商业机会采用投资而非赌博逻辑：不轻易从0到1创新，而是找到已跑通的成熟盘进行投资入局；从1到10阶段梳理SOP实现标准化；从10到100阶段寻找发力点进行复制与放大。
  excerpt:
  - 不轻易做从0到1的事，找到已跑通的盘投资入局，从1到10梳理SOP标准化，从10到100找发力点复制放大。
theorems:
- name: 创业敬畏论
  desc: 创业者必须对创业保持十足敬畏，将其视为日常而非偶尔的努力；智商平庸可通过执行力快速弥补，而能把小事一件件做成即已非凡。
  excerpt:
  - 对创业要足够敬畏：创业者凌晨3点秒回，一天飞四五个城市是日常，不能心存敬畏只会偶尔努力，做不成日常。
  - 智商不低于平均即可，可以笨点执行快点，能把事一件件做好有头有尾就很了不起。
- name: 自我救赎论
  desc: 外部没有贵人，唯一能拯救自己的是自己；在求助于贵人前必须先成为自己的贵人。
  excerpt:
  - 外面只有自己，自己才是救世主。
- name: 无欲则刚论（真诚即武器）
  desc: 没有功利性的欲望反而使人强大；人最容易被利益控制，而最高级的吸引力与社交的终极杀手锏是真诚，放下功利心才能实现平等相处。
  excerpt:
  - 无欲无求则无敌：人性最容易被利益控制，最高级的吸引是真诚，真诚是社交中最大的杀手锏，放下功利心才能平等。
- name: 决策决定论
  desc: 阶层跃升的比拼核心是决策能力；选择并非赌博押宝，而是在具备足够能力的前提下的主动匹配与最优解求解。
  excerpt:
  - 选择比努力重要：选择其实是决策的意思，人往上走拼的是决策能力。
  - 做选择前提是有足够能力驾驭，选择是匹配自己最优解不是赌博押宝。
- name: 小事件大财富论
  desc: 赚大钱并非靠做大事，而是将一件极小的事做足、做成、做到日常化；日常化是赚钱法则中最为关键的法门。
  excerpt:
  - 大钱不是从大事里赚的，大事都是小事做足做成的，日常化是所有赚钱秘诀中最牛逼的法门。
findings:
- name: 分享是高效链接途径
  desc: '[claim] 作者主张在今天的环境下不存在''闷声发大财''的机会，真诚、大气的公开分享是高效且成本最低的社交链接方式，并强调愿意做付出的先行者能够通过真诚分享来主动索取链接。'
  excerpt:
  - 要乐于分享，分享要大气：大大方方分享是高效链接方式，今天不存在闷声发大财的机会。
  - 敢于做付出的先行者，真诚分享是索取链接方式。
- name: 项目成功率与规模化效果
  desc: '[evidence] 作者在其社群运营中验证了方法论效果：采用其项目打法（正确方法+执行+概率性，成功率控制在20%-40%）的付费会员已超过2.5万人，侧面支撑其方法的规模可行性与可复制性。'
  excerpt:
  - 成功率一般20%-40%较合理，从成功的人中投资。付费会员2.5万多人。
