paper: 20230516_073_把想法变成钱
desc: 该素材以'发现需求、验证需求、解决需求'为核心方法论，通过AI四维预测、碳中和内容创作、为ta点歌三个案例，论证'把想法变成钱'的可行性，核心主张是'项目不值钱，想法值钱，思考是持续赚钱源泉'。
concepts:
- name: 需求
  desc: 需求无处不在，藏在生活对话、海量数据、新闻热点之下，发现需求需多留心日常细节。
  is_original: false
  excerpt:
  - 需求无处不在，藏在生活对话/海量数据/新闻热点下，多留心
  - 人性背后尽是需求，需求背后金钱不眠
- name: 想法（创意）
  desc: 想法本身最值钱，AI虽强大但思考产生的创意更可贵，是持续赚钱的源泉。
  is_original: true
  excerpt:
  - 项目不值钱，想法值钱，思考是持续赚钱源泉
  - AI很强大但思考产生的创意最可贵
methods:
- name: 发现需求—验证需求—解决需求
  desc: __overview__ 素材提出的核心方法论链条：通过生活细节发现需求，用同行评论区验证需求真伪，最后通过解决问题实现价值变现。
  excerpt:
  - 核心方法论：发现需求、验证需求、解决需求
  - 验证需求：搜索短视频平台看同行评论区，是最直接验证需求方式，还需搜索验证伪需求
- name: 评论区验证法
  desc: 通过搜索短视频平台查看同行评论区的高频问题，直接验证用户需求真伪，并据此调整内容方向。
  excerpt:
  - 搜索短视频平台看同行评论区，是最直接验证需求方式
  - 看评论区高频问题（碳中和是啥、怎么赚钱），根据搜索词做内容
- name: AI垫图关键词调试法
  desc: 利用midjourney垫图生成目标效果，但一张图倒推关键词只能描述它本身，需反复调试关键词，重视思考过程。
  excerpt:
  - 用midjourney垫图，倒推关键词可能失效（一张图倒推只描述它本身）
  - 需反复调试关键词，思考过程重要
- name: 重新定义交付物法
  desc: 通过分析最终交付物形态，将原问题（弹唱）转化为自己可完成的新问题（做视频），从而绕开能力短板。
  excerpt:
  - 分析最终交付物是视频，把问题从弹唱变成做视频
  - 用素人唱歌音频（唱吧全民K歌）
theorems:
- name: 想法本位论
  desc: 核心主张：想法（创意）的价值高于项目本身，思考能力是持续赚钱的真正源泉。
  excerpt:
  - 项目不值钱，想法值钱，思考是持续赚钱源泉
  - AI很强大但思考产生的创意最可贵
- name: 人性需求驱动论
  desc: 核心主张：人性背后尽是需求，需求背后金钱不眠——商业机会源于对人性的理解与需求的满足。
  excerpt:
  - 人性背后尽是需求，需求背后金钱不眠
  - 发现需求：需求无处不在
- name: 伪需求过滤原则
  desc: 核心主张：验证需求时需注意区分真需求与伪需求，仅靠评论区的需求还需再次搜索验证。
  excerpt:
  - 验证需求：搜索短视频平台看同行评论区，是最直接验证需求方式，还需搜索验证伪需求
findings:
- name: 碳中和内容爆款验证
  desc: '[evidence] 素材以碳中和案例证明评论驱动的内容创作路径有效：3天高强度输入输出后，第三条视频达到500万播放，2个月带来100多万利润。'
  excerpt:
  - 大大讲话后碳中和指数暴涨，看评论区高频问题（碳中和是啥、怎么赚钱），根据搜索词做内容
  - 3天高强度输入输出视频发第三条500万播放，2个月带来100多万利润
- name: 需求来源多重性
  desc: '[claim] 素材宣称需求可从生活对话、海量数据、新闻热点三个渠道发现，但未提供各渠道效果差异的量化数据。'
  excerpt:
  - 需求无处不在，藏在生活对话/海量数据/新闻热点下，多留心
- name: AI垫图技术局限
  desc: '[claim] 素材宣称一张图倒推关键词只能描述图本身，因此垫图方式存在局限，需反复调试关键词；该结论为经验性判断，非系统性实验结论。'
  excerpt:
  - 倒推关键词可能失效（一张图倒推只描述它本身），需反复调试关键词
