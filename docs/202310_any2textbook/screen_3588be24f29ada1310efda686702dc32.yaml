screening_principles: 1. 排除纯索引/导航类文件（无正文、无实质观点、无法提炼有效信息）——它们是元数据而非知识内容，纳入会稀释全书；2.
  保留具备完整方法论、有深度判断、观点清晰且论证详实的素材，这类内容能独立承载章节、课程单元或手册条目，且具有普适迁移价值；3. 对观点有价值但结构简单、细节未充分展开、或偏向操作指南的素材进行降权，它们更适合作为案例、附录或补充说明，需重写或补全后才能进入正文。
