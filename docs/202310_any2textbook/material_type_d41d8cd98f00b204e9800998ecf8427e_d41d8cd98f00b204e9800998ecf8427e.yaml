suggested_preprocess:
- 先通读 SUMMARY.md 与 README.md 及各期周报，建立全局主题谱系
- 对哈希命名文件按原帖主题（如生财技能、RPA、抖音、公众号等）做聚类与去重
- 剔除纯转载冗余或重复帖，合并同一主题下的多篇内容为章节素材
- 标记含隐私或时效性过强的旧帖，评估是否适合纳入正式教材
