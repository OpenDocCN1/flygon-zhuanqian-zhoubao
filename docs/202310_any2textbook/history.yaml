        lim_{t→∞} Patience(Form_t) → 0\n\n这个公式展示了注意力稀缺的动力学本质：当一种内容形式在时间轴上反复出现，用户对该形式的耐心会趋于零。注意力稀缺有三个关键特征：\n-
