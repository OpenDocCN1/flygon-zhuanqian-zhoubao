        **AI的角色定位**：P001给出具体AI协作流程，P002强调人的真实感。\n\n## 6.10 设计中的取舍\n**为什么不用\"教知识\"而是\"给情绪\"？**\n在注意力稀缺语境下，先要拿到注意力才有机会给知识。情绪是注意力的钩子，知识是钩子钓上来的鱼。\n**trade-off是什么？**\n情绪导向的爽文框架在换取即时注意力的同时，牺牲了内容深度与持久价值。记录式表达也在真实性与精致性之间作取舍。这个取舍没有标准答案，取决于目标受众和平台特性。\n\n##
