        F[输出短篇爽文]\n```\n\n## 6.6 AI辅助创作的边界——创作的想象力与逻辑脑之争\n> \"一是没用4.0二是希望一步到位加的命令太多三是命令描述不清机器只能盲写四是对故事结构没有规划\"（来源：《用ChatGPT写爽文四步框架》）\n\nAI能力不均衡：短篇、框架内填充时能力高，长篇、多线索一致时能力低。AI是根据模式生成文本的引擎，短篇爽文框架清晰，AI能精准执行；长篇小说需要跨章节逻辑一致性和人物动机长线跟踪，AI难以独立完成。\n\n**用户归因定理**：AI输出质量的上限，由你输入的质量决定。未用GPT-4、指令过多、描述不清、缺乏规划，都会导致生成效果不佳。\n\n人机协作的最优模式：人类负责蓝图，AI负责施工，人类再负责质检。\n\n```mermaid\ngraph
