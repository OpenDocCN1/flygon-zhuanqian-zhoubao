        **动态性**：用户偏好是流动的，要求创作者建立持续迭代机制。\n\n## 6.4 爽文——情绪的肾上腺素注射剂\n在注意力稀缺背景下，最快抓住用户的是**情绪冲击力最强**的内容。爽文存在的意义就是给你一次情绪的过山车。\n\n>
