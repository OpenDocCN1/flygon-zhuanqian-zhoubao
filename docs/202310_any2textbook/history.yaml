        Step1：感官紧张（氛围制造）\n- Step2：危险出现（外部威胁）\n- Step3：内心紧张（心理冲击）\n- Step4：希望曙光（情绪释放）\n\n四步构成一个短促完整的情绪闭环，有**递进性**（从外部刺激到内部心理）和**可编程性**（每步可翻译为提示词指令）。\n\n**大纲细节填充写作流程**（来源：《用ChatGPT写爽文四步框架》）\n```\n1.
