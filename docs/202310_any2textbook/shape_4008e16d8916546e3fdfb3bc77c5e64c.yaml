best_shape: book
reason: 素材整体呈现出两大可成书的稳定母题集群：一是以ChatGPT/SD为代表的AI创作实战（含25、26、27、30、34篇），二是以闲鱼、拼多多、外贸、私域运营为代表的副业/电商从零到一方法论（含72、117、86、102、56篇），两者均有明确读者画像（个体创业者/副业人群）与可持续扩写空间，且多篇被标记为high深度并定位为chapter，厚度足以支撑6-10章成书结构。建议合并为《AI与副业实战：从零到一的可复制方法论》或分拆成两本独立成书。
not_recommended_shapes:
- series
- handbook
- kb
not_recommended_reasons:
- 虽然部分素材（如写作心态、模仿对象）可作独立观点，但整体已形成包括AI创作、电商运营、私域/IP运营等多条可系统化主线，若仅做系列文章会浪费素材的体系性，无法承载16篇high深度章节素材的纵深价值。
- 尽管有44、26、27等操作指南型素材，但大量内容（如去满足需求、闲鱼方法论、拼多多前世今生、外贸深耕）是商业思维与战略判断而非纯流程清单，强行做成手册会丧失其认知深度，且手册形态无法容纳跨主题的多条主线。
- 素材主题虽多，但已能按母题聚类成AI创作与副业电商两大知识树，且多数素材标注destination为chapter而非kb_entry，说明其属于可线性阅读的深度内容而非需持续维护的检索条目，做成知识库会破坏叙事逻辑。
if_force_book_need: 若强行成书，需要补充三方面：1）建立统一叙事框架，将AI创作与副业电商两条主线通过'用AI放大副业收益'这一价值主张串联，否则易变成拼盘；2）需新增开篇导论章与结语章，明确读者对象（尤其要区分AI新手与电商老手）与阅读路径，避免素材之间跳跃；3）部分素材（如怎么写BP、向有结果的人学习）与主线关联较弱，需重新定位为通用素质篇或整体裁撤，同时为各章补充过渡案例与练习环节以填充章节厚度。
