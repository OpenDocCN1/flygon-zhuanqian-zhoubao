- 'no': 1
  name: 内容创作进阶论 —— 从“爽文叙事”到“氛围感传播”
  desc: 本章从创作者视角出发，探讨在信息过载时代，如何通过结构化的方法（如四步爽文框架）和表现形式升级（如口播3.0）来构建能抓住受众注意力的内容。我们既拆解AI辅助创作的具体流程，也分析传统口播内容的困境与破局之道。
  nodes:
  - 'no': 1
    name: 注意力稀缺时代的创作挑战
    desc: 以抖音用户对说教式口播（2.0）的耐心下降为例，引出当代内容创作的核心矛盾：用户注意力日益碎片化，对内容的‘情绪价值’和‘氛围感’要求更高。
    role: motivation
    src:
    - paper: '20231017_064'
  - 'no': 2
    name: 目标导向的创作范式：以“爽文”为例
    desc: 定义“爽文”这一特定内容类型，阐明其核心目标是调动读者强烈的情绪反应（如兴奋、满足感），以此为切入点说明不同类型内容（如爽文 vs. 口播）有其独特的创作逻辑。
    role: definition
    src:
    - paper: '20231017_026'
  - 'no': 3
    name: 结构化创作方法论：从框架到细节
    desc: 介绍两种核心创作方法：一是“四步爽文写作框架”（构建情节张力），二是“大纲细节填充写作流程”（管控创作流程）。强调结构化的方法论是将创意从灵感转化为可执行方案的关键。
    role: method
    src:
    - paper: '20231017_026'
    - paper: '20231017_026'
  - 'no': 4
    name: AI辅助创作的边界与局限
    desc: 通过归纳用户使用ChatGPT生成爽文不佳的归因，以及“AI不适合写长篇”的局限主张，说明在当前阶段，AI（如ChatGPT）更适合作为辅助“创意生成”和“短篇扩写”的工具，而长篇创作仍需人工把控其逻辑连贯性。
    role: limitation
    src:
    - paper: '20231017_026'
  - 'no': 5
    name: 平台特性驱动的内容迭代：口播3.0的诞生
    desc: 在定义口播2.0（说教式）局限性的基础上，提出口播3.0（氛围感口播）的概念。其核心是通过改变视频形式与视觉语言，营造轻松、亲切的“氛围感”，以适应平台（抖音）用户的内容偏好。
    role: definition
    src:
    - paper: '20231017_064'
  - 'no': 6
    name: 营造“氛围感”的实操方法矩阵
    desc: 围绕“氛围感”这一核心目标，引入“呼吸拍摄法”、“三角拍摄法”、“背台词法”和“手持拍摄法”等具体执行技巧，展示如何通过机位、眼神、台词熟练度和拍摄方式等技术手段来增强内容的吸引力和自然感。
    role: method
    src:
    - paper: '20231017_064'
  - 'no': 7
    name: 内容创作的基本规律：从“记录”到“迭代”
    desc: 总结提炼出“记录比摆拍更有力量”、“口播形式须随用户偏好迭代”等超越具体平台的方法论原则。这些原则强调了内容的真实性、与用户情绪的共鸣以及持续迭代优化的必要性，是创作者在长期实践中应遵循的底层逻辑。
    role: extension
    src:
    - paper: '20231017_064'
  - 'no': 8
    name: 案例复盘与经验验证
    desc: 通过“四步框架训练ChatGPT”的宣称案例，以及“录制100个口播视频可解决表达问题”、“聊天气氛下内容更易火”等观察，来检验前面所倡导的创作方法论在实际应用中的有效性。并提示这些经验多为个人总结，需要读者实践验证。
    role: experiment
    src:
    - paper: '20231017_026'
    - paper: '20231017_064'
    - paper: '20231017_064'
