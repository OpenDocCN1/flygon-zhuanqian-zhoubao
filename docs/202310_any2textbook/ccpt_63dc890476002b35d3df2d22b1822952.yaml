paper: '20231017_005'
desc: 该素材针对新手如何靠近“当下有结果的人”这一成长问题，提出了“为何要靠近”“谁算有结果的人”以及“如何靠近”三步法（筛选→看足迹→行动验证），并核心强调“知”与“行”的差距，主张通过看到更多行动痕迹与亲身参与，避免高认知穷人式的只听道理却不行动。
concepts:
- name: 当下有结果的人
  desc: 在当前你正面临的具体问题（不仅指技术，还包括专注力、期望管理、拆解正反馈、复盘等）上已经取得结果的人，且其行动痕迹可见。
  is_original: true
  excerpt:
  - 大家会想到写精华帖的大佬或小航海教练，但这'对但不够'，因为'有结果的人'隐含了场景——在你当前面临的问题上有结果的人。
  - 你面临的不仅是项目技术问题，还有：无法专注反复横跳、期望值不符容易挫败放弃、不懂拆解问题没有正反馈、不懂复盘机械执行等。所以有结果的人是在解决你正在遭遇的这些问题上有结果的人。
- name: 高认知穷人
  desc: 指只明白道理（认知）却不通过实践转化为动作（行）的人，强调知行差距是成长的关键障碍。
  is_original: false
  excerpt:
  - 很多人成为高认知穷人是因为只听道理却不做。
- name: 行动痕迹
  desc: 靠近有结果的人的关键所见，即对方的帖子、评论、历史实战活动的日志等可追踪的、展示其如何解决与行动的证据。
  is_original: true
  excerpt:
  - 靠近的核心是看到更多有结果的人的行动痕迹。
  - 点开头像看历史足迹（帖子、评论、历史参加过的实战活动的日志情况）
methods:
- name: __overview__
  desc: 新手靠近当下有结果之人的整体方法论：先在目标问题维度上初步筛选，再通过查看历史行动痕迹做判断，最后通过行动验证与深度链接实现真正靠近。
  excerpt:
  - 三步：第一步初步筛选一批可能是在你需要解决的问题上有结果的人（如找同项目的人）；第二步点开头像看历史足迹……第三步了解并用行动验证后如果再发现确实能帮到你，可以添加微信用私聊知识付费咨询。
- name: 三步靠近法
  desc: 具体步骤：筛选→考察历史足迹→行动验证后私聊链接，以从观众变为参与者。
  excerpt:
  - 第一步初步筛选一批可能是在你需要解决的问题上有结果的人（如找同项目的人）；
  - 第二步点开头像看历史足迹（帖子、评论、历史参加过的实战活动的日志情况），判断成绩靠谱吗、基础如何、一路走来遇到并解决了哪些问题、怎么解决的、哪些问题刚好困扰着你能否用他的解决方式；
  - 第三步了解并用行动验证后如果再发现确实能帮到你，可以添加微信用私聊知识付费咨询。
theorems:
- name: 靠近对象是解决你所遭遇问题的人
  desc: 有结果的人不是泛泛的头部大V，而是针对你在技术之外遇到的一类具体问题（专注、期望、拆解、复盘）上有结果的人。
  excerpt:
  - 你面临的不仅是项目技术问题，还有：无法专注反复横跳、期望值不符容易挫败放弃、不懂拆解问题没有正反馈、不懂复盘机械执行等。所以有结果的人是在解决你正在遭遇的这些问题上有结果的人。
- name: 观众只会焦虑，参与者才能走近舞台
  desc: 仅点赞或加好友不算靠近，必须通过看到更多行动痕迹并亲身参与，才能一步步走向舞台中央。
  excerpt:
  - 给有结果的人点赞不算靠近，加好友也不算靠近。一直当观众只会越来越焦虑，当参与者才能一步步走到舞台中央。
- name: 知行合一源于一次次实践调整
  desc: 真正改变要靠知道做什么、理解为何做、知道怎么做，并通过实践不断调整认知与动作，最终达到知行合一。
  excerpt:
  - 要真正通过道理改变自己，不仅要知道做什么，还要理解为什么、知道怎么做，通过一次次实践调整认知和动作，最终达到知行合一。
findings:
- name: 靠近行动的三种收获
  desc: '[claim] 靠近当下有结果的人能带来三方面收益：看清全貌、避免自我怀疑内耗、获得可落地细节。'
  excerpt:
  - 1看到更完整的项目全貌便于选择和执行（反面是看到一张截图就上脑冲动）；2看到当下依然可行的项目玩法不容易自我怀疑精神内耗；3看到落地性强的操作细节不至于一听就会一做就废（理论家给方向实战派给操作细节）。
- name: 当观众导致焦虑、当参与者走上前台
  desc: '[claim] 停留在观众角色不仅无助于靠近，反而会加剧焦虑；只有以参与者的姿态行动才能逐步获得靠近与舞台位置。'
  excerpt:
  - 一直当观众只会越来越焦虑，当参与者才能一步步走到舞台中央。
