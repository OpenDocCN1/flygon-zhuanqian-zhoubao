- 'no': 1
  name: 写作的底层认知 —— 写作不是输出，而是成长系统
  desc: 本章从粥左罗的写作经验出发，重构“写作价值”的认知框架：写作不是简单的文字输出，而是以写作为中心的个人成长系统。你将理解写作如何通过提升认知、思考与逻辑能力，最终自然带来复利式回报，并认清“预期与能力匹配”这一核心心法。
  nodes:
  - 'no': 1
    name: 写作成长系统：从“写东西”到“变强大”
    desc: 用“成长飞轮”类比：写作是驱动认知、思考、逻辑能力提升的引擎，赚钱是系统运转的自然结果，而非直接变现。
    role: motivation
    src:
    - paper: '20231017_010'
  - 'no': 2
    name: 回归写作本身：热爱过程而非结果
    desc: 定义“动机本质主张”：仅喜欢写作带来的好处（如赚钱、名声）无法支撑长期坚持，唯有享受写作过程本身才能持续。
    role: definition
    src:
    - paper: '20231017_010'
  - 'no': 3
    name: 预期与能力匹配原则：告别写作痛苦
    desc: 推导痛苦根源：写作痛苦源于心理预期与当前写作能力的落差。将预期调整至与能力匹配，是避免中途放弃的关键策略。
    role: method
    src:
    - paper: '20231017_010'
  - 'no': 4
    name: 写作变现的非直接性：系统思维的结果导向
    desc: 通过对比“写作直接赚钱”与“写作提升底层能力间接挣钱”两种路径，论证为何将写作视为系统才能真正实现变现。
    role: extension
    src:
    - paper: '20231017_010'
- 'no': 2
  name: 写作方法与实践 —— 从“没得写”到“停不下来”
  desc: 本章聚焦可操作的写作方法论，拆解如何通过“倒逼输入”解决积累不足，通过“似懂非懂”驱动深度钻研，以及如何利用“课程闭环”实现领域专家化。最后，用“写作生活化”案例印证：素材无处不在，持续写作的关键在于转换视角。
  nodes:
  - 'no': 1
    name: 积累反转：为何“越没积累越要写”
    desc: 挑战“先积累后输出”的常识，提出“写作倒逼积累法”：写作行为本身迫使自己搜索、学习、消化，从而加速积累沉淀。
    role: motivation
    src:
    - paper: '20231017_011'
  - 'no': 2
    name: 似懂非懂写作法：把模糊变清晰
    desc: 定义并操作“似懂非懂”状态：选择自己理解不深的内容写作，通过面向读者的输出倒逼自己将知识的模糊地带彻底弄明白。
    role: method
    src:
    - paper: '20231017_011'
  - 'no': 3
    name: 专家化路径：写出一门课，成为专家
    desc: 用“边赛边练”类比：不是成为专家才去教别人，而是通过承诺交付一门系统课程，在持续输出与研究中完成专家化蜕变。
    role: experiment
    src:
    - paper: '20231017_011'
  - 'no': 4
    name: 凡事皆可写：写作生活化日常法
    desc: 扩展素材边界：通过解析“吃米线”“陪孩子看病”等生活事例，展示如何将日常观察与感悟提炼为写作主题，实现日更无压力。
    role: motivation
    src:
    - paper: '20231017_011'
- 'no': 3
  name: 行动与向高手靠近 —— 从“高认知穷人”到“知行合一”
  desc: 本章解决认知到行动的最后一公里。以“向当下有结果的人靠近”为具体场景，提出“三步靠近法”与“行动痕迹”概念，剖析“高认知穷人”的陷阱，最终落到“知行合一”的实践哲学：成长只能通过反复行动校准实现。
  nodes:
  - 'no': 1
    name: 识人辨材：谁是“当下有结果的人”
    desc: 定义核心概念：有结果的人不是泛泛的大V，而是针对你当前正遭遇的具体问题上已有成果、且行动轨迹清晰可查的人。
    role: definition
    src:
    - paper: '20231017_005'
  - 'no': 2
    name: 三步靠近法：从旁观到入局
    desc: 给出可执行的完整路径：初步筛选解决你问题的人 → 考察其历史行动足迹 → 用行动验证价值后私聊建立链接，实现从“观众”到“参与者”的身份跃迁。
    role: method
    src:
    - paper: '20231017_005'
  - 'no': 3
    name: 高认知穷人陷阱：知道≠做到
    desc: 剖析成长最大障碍：空有道理认知却不落地为动作。对比“点赞/加好友”的虚假靠近与“研究足迹/实践验证”的真实靠近，指出参与者身份才带来实质成长。
    role: limitation
    src:
    - paper: '20231017_005'
  - 'no': 4
    name: 靠近的复利收获：全貌、信心与细节
    desc: 总结向高手靠近的三层回报：看清项目全貌降低认知偏差、通过验证当下玩法免于自我怀疑内耗、获得可落地的高操作细节，论证靠近高手的必要价值。
    role: extension
    src:
    - paper: '20231017_005'
