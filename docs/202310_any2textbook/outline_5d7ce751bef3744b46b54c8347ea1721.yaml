- 'no': 1
  name: 需求满足回报论 —— 一切所得，皆因利他
  desc: 本章以“需求满足”为核心视角，阐明个人与商业回报的底层逻辑：所得源于对他人的贡献，而非利己的索取。
  nodes:
  - 'no': 1
    name: 从“我想要”到“他需要”的思维转向
    desc: 用“开关”类比：开启“总是思考如何满足别人”的思维模式，会彻底改变做事的方式与结果。
    role: motivation
    src:
    - paper: '20231017_009'
  - 'no': 2
    name: 需求满足回报论
    desc: 核心定理：我们这一生得到的一切，都源于满足了别人的需求。这是后续所有策略的基本公理。
    role: definition
    src:
    - paper: '20231017_009'
  - 'no': 3
    name: 需求满足导向的产品设计方法
    desc: 在产出发售、职场、内容创业等场景中，逐一识别目标对象的担忧与需求，并针对性提供满足方案，是获得回报的具体操作路径。
    role: method
    src:
    - paper: '20231017_009'
- 'no': 2
  name: 竞争优势 —— 商业成功的本质是“比别人更好”
  desc: 本章引入比较维度，说明在同一需求市场中，回报的分配取决于相对优势：不是满足了需求就行，而是要比对手满足得更好。
  nodes:
  - 'no': 1
    name: 从“满足需求”到“更好满足”的跃迁
    desc: 用“比赛”类比：需求市场是一场竞赛，奖金属于跑得最快的人，而非所有参赛者。
    role: motivation
    src:
    - paper: '20231017_009'
  - 'no': 2
    name: 商业成功本质论
    desc: 核心定理：赚更多钱与得到更多回报的本质，是比竞争对手更好地满足别人的需求。
    role: definition
    src:
    - paper: '20231017_009'
  - 'no': 3
    name: 顶峰会发售策略：逐一满足分销担忧
    desc: 案例教学：作者在发售中系统识别用户分销时的每个担忧并逐一满足，体现“更好满足”策略的实际应用。
    role: experiment
    src:
    - paper: '20231017_009'
  - 'no': 4
    name: 内容创业五年验证：持续比对手更好
    desc: 案例教学：作者基于五六年内容创业经历，指出业务持续向好的本质是每年都思考如何比竞争对手更好地满足用户需求。
    role: experiment
    src:
    - paper: '20231017_009'
  - 'no': 5
    name: 竞争优势的适用范围与边界
    desc: 指出“比对手更好”的本质适用于商业竞争场景，但“满足他人需求”的原理更普适；同时需注意素材未给出量化数据验证成效。
    role: limitation
    src:
    - paper: '20231017_009'
