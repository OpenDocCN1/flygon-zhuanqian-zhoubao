- file_path: docs/202310/20231017_004.md
  title: 爆款分析数据库 流量人必备 V1.2 模板分享
  summary: 作者嘉明Lock分享了一个基于飞书多维表格制作的「爆款模仿收集模板」，帮助流量运营者系统化地收集和分析各平台的爆款账号与作品数据，并附带了多次版本更新说明。
  core_question: 如何构建一个高效的爆款案例收集与分析系统，以辅助内容创作和选品决策？
  key_judgment: 相较于简单的Excel表格，使用多维表格建立关联数据库，能更灵活、高效地追踪账号数据与爆款作品，并通过视图和仪表盘进行深度分析。
  depth: medium
  suggested_destination: handbook_entry
