- file_path: docs/202310/20231017_002.md
  title: 如何利用影刀 RPA 加速抖音图文的跟款效率？
  summary: 作者Leeka通过自身实践，介绍了如何利用影刀RPA工具打造24小时不间断的跟款、修图和发布机器人，以解决抖音图文多账号运营中人力不足和效率低下的问题。
  core_question: 如何在抖音图文运营中，利用RPA自动化工具替代重复性人力劳动，提升跟款和内容生产效率？
  key_judgment: RPA不是程序员专属，通过可视化配置，零基础用户也能搭建自动化流程，将重复性操作（如跟款、修图、发布）交给机器人，实现效率的指数级提升。
  depth: medium
  suggested_destination: case
  possible_shape: series
  risks:
  - 时效性
  - 口语化
  screening_conclusion: retain
  reason: 提供了一个RPA在内容营销领域的具体应用案例，对其他平台有迁移性，有一定参考价值。但原文核心内容（详细教程）在外部飞书链接中，且部分技术可能已过时。
- file_path: docs/202310/20231017_003.md
  title: 如何利用影刀给公众号爆文赋能
  summary: 作者马小威分享了利用影刀RPA自动化工具，在公众号爆文项目中完成选品、自动引流、自动发布等重复性工作，以矩阵化操作提升收益效率的入门思路。
  core_question: 在公众号爆文矩阵化运营中，如何利用RPA工具解决人力有限、操作重复的问题？
  key_judgment: RPA能把公众号运营中的重复性工作（选品、发布等）自动化，且对不懂代码的新手友好，是放大矩阵运营效率的关键工具。
  depth: low
  suggested_destination: kb_entry
