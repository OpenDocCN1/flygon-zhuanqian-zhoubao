- 'no': 7
  name: 竞争优势的适用边界——从“相对”回到“绝对”的回归
  points:
  - '**为什么需要这个概念？**'
  - '- 前文反复强调“比对手更好是成功关键”，但在某些场景下这一要求可能不适用或需要弱化'
  - '- 若把“比对手更好”绝对化，可能导致创业者忽略基础需求满足或错误判断竞争强度'
  - '- 需要厘清“满足需求”与“比对手更好”各自适用的条件，避免概念滥用'
  - '**核心定义**'
  - '- 竞争优势边界：比对手更好地满足需求这一原则，本质适用于存在充分竞争的存量市场；在蓝海新兴市场或垄断市场中，只要满足需求即可获得回报，竞争维度并非必要条件'
  - '- 需求满足回报论更普适——它是所有场景的基础；竞争优势是在此基础上附加的竞争性要求'
  - '**关键性质****'
  - '- 层级性：满足需求是第一层法则，比对手更好是第二层附加条件；无第一层，第二层无意义'
  - '- 条件性：竞争压力大时，优势决定生存；竞争压力小时，绝对满足即可成功'
  - '- 动态性：市场从蓝海走向红海的过程中，竞争优势的重要性从低到高递增'
  - '**典型例子**'
  - '- 在无人涉及的细分品类中，只要产品解决了真实痛点，即便功能粗糙也能卖出（如早期智能手环）'
  - '- 而当巨头进入后，市场进入红海，此时只有做到“比对手更好”——如更准的传感器、更优雅的设计——才能留存用户'
  - '- 在垄断市场（如公用事业），用户别无选择，满足基础需求即可收费，竞争维度几乎不存在'
  - '**边界条件**'
  - '- 该边界本身也存在例外：即使蓝海市场中用户也会因信息不对称只选择“看起来更好”的选项，因此竞争优势可能在无意识中仍然起作用'
  - '- 利他主义场景（如公益、亲情）中，“回报”不以金钱衡量，竞争优势完全不适用，只需满足需求即可获得情感回馈'
  sources:
  - paper: '20231017_009'
    role: critique
  excerpts:
  - 需求满足回报论是更普适的原理，适用于所有互动场景
  - 比竞争对手更好地满足用户需求本质适用于商业竞争环境
