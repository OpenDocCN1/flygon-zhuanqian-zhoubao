paper: '20231017_009'
desc: 该素材提出“我们这一生得到的一切，都源于我们满足了别人的需求”这一核心观点，并以知识付费产品发售、商业竞争内容创业为例，主张从“想自己要什么”转向“思考如何满足别人”，从而获得回报；同时提出，赚更多钱与得到更多回报的本质是比竞争对手更好地满足别人的需求。
concepts:
- name: 满足他人需求（需求满足导向）
  desc: 认为一个人所得到的回报本质上源于对他人（用户、老板、贵人、同事等）需求的满足，因此应持续思考如何满足他人需求而非只关注自己想要什么。
  is_original: true
  excerpt:
  - 我们这一生得到的一切，都源于我们满足了别人的需求。
  - 一旦开启'总是思考如何满足别人'的思维模式，很多事情的做法都会变。
  - 当你只想自己要什么时很难得到，当你每天想着怎么满足别人时该来的都会来。
- name: 竞争优势（比竞争对手更好地满足需求）
  desc: 被认为是商业成功和获得更多回报的本质：在满足同一需求的市场竞争中，最终赢得用户最多的一方是比竞争对手更好地满足了用户需求的那一方。
  is_original: true
  excerpt:
  - 任何一个产品都是为了满足用户某一个需求，满足同一个需求的市场上不止一家做产品，最终赢得用户最多的本质就是比竞争对手更好的满足了用户需求。
  - 得到更多是因为我们比竞争对手更好的满足了别人的需求。
methods:
- name: __overview__
  desc: 以“满足别人需求”为导向的产品/业务设计方法：在产出发售、内容创业、职场合作等场景中，通过逐一识别目标对象（用户、老板、读者、贵人）的具体担忧与需求，并针对性地提供满足方案，而非从自身想要什么出发，从而获得回报。
  excerpt:
  - 以知识付费产品「粥左罗·顶峰会=10年会员+高能圈子+赚钱项目」的发售为例，作者始终在思考用户在分销时可能有哪些需求并逐一满足。
  - 用户担心转行后产品没价值→备注做通用底层能力课程；用户担心产品无法做10年→承诺每年提供的学习成长产品不低于1万元；用户帮我分销担心用户直接找我买→公开发售前不开放直接购买渠道、介绍时把朋友购买方式放前面、直播发售不提供直接购买、提供详细介绍链接、《用户可能有的疑问》5篇；用户担心10年太久不能交付→破天荒提出'如果中间不能继续交付，不管已经服务几年，全额返还费用'。
  - 职场中要想怎么比同事更好的满足领导和老板的需求；自媒体要想如何比同领域博主更好的满足读者阅读需求；想得到贵人相助要明白怎么比别人更好的满足贵人的需求。
theorems:
- name: 需求满足回报论
  desc: 核心主张：我们得到的一切都源于满足了别人的需求，只有很好地满足别人需求，才能得到想要的东西。
  excerpt:
  - 我们这一生得到的一切，都源于我们满足了别人的需求。只有很好的满足了别人的需求，才能得到你想要的东西。
- name: 商业成功本质论
  desc: 核心主张：赚更多钱和得到更多回报的本质，是比竞争对手更好地满足别人的需求。
  excerpt:
  - 关于如何赚更多钱：比竞争对手更好的满足别人的需求，这是商业成功的本质。
  - 最终赢得用户最多的本质就是比竞争对手更好的满足了用户需求。
  - 总结：得到更多是因为我们比竞争对手更好的满足了别人的需求。
findings:
- name: 顶峰会发售策略成效（需求满足实例）
  desc: '[claim] 作者宣称通过逐一满足用户在分销中的担忧（转行价值、10年持续性、直接购买分流、交付风险），并据称这些做法使其取得成效，但素材未给出具体结果数据。'
  excerpt:
  - 以知识付费产品「粥左罗·顶峰会=10年会员+高能圈子+赚钱项目」的发售为例，作者始终在思考用户在分销时可能有哪些需求并逐一满足……
  - 破天荒提出'如果中间不能继续交付，不管已经服务几年，全额返还费用'。
- name: 内容创业成功经验（实践验证）
  desc: '[evidence] 作者基于自身五六年内容创业经历指出，业务越做越好的本质是每个业务上每年持续思考如何比竞争对手更好地满足用户需求，这是其经验支撑的发现。'
  excerpt:
  - 作者做内容创业做知识付费五六年来越做越好，本质是每个业务上每年持续思考如何比竞争对手更好的满足用户需求。
