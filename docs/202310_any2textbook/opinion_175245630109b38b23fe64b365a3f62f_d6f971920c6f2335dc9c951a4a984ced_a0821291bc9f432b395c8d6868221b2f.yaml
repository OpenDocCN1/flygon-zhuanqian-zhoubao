steps:
- 第一步：以'AI+副业'为骨架重新裁剪18篇保留素材，先写全书总纲与目录细化至二级标题
- 第二步：划分内容优先级，先完成核心方法论章节（如闲鱼、拼多多、AI创作），将操作细节下沉为附录
- 第三步：补齐实操配图、案例数据与时效性声明，然后打包投稿出版社或自出版平台
risks:
- 内容强依赖平台机制（抖音/小红书/拼多多算法），时效性强，需标注版本日期并持续修订
- AI工具迭代快，SD/ChatGPT相关截图与操作可能迅速过时
- 多个副业主线（闲鱼/拼多多/外贸）容易分散读者注意力，需在总纲中反复强调'选择一条先跑通'
