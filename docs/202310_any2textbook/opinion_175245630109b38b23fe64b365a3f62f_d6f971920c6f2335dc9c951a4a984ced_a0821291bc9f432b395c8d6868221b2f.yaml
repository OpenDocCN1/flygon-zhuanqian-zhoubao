best_shape: book
book_worthiness: worth
conclusion_type: ready
one_line_judgment: 素材虽散但两大主线（AI创作实战与副业方法论）可收束为一部面向普通人的'AI+副业实战'书稿，需补写总纲并统一叙事框架。
recommended_shape: book
shape_reason: 素材横跨AI创作与副业电商，但各自内部有系统篇章（如口播3.0、闲鱼入门、SD教程），可构建'AI赋能普通人副业'的完整叙事框架，且多篇high深度内容具备足够厚度与差异化。
not_recommended_shapes:
- series
- handbook
- kb
not_recommended_reasons:
- 纯系列文章会割裂素材的体系性，无法形成认知升级的阅读体验
- 手册形式丧失认知深度，大量high深度方法论被降维成操作条目
- 知识库破坏叙事逻辑，读者无法获得从认知到实战的递进路径
if_force_book_need: 建立统一叙事框架，以'普通人如何借助AI和副业方法实现收入增长'为主线，串联AI创作（写作、绘画、口播）与副业电商（闲鱼、小红书、拼多多、外贸）两大板块，并补写总纲章节衔接各篇。
core_proposition: 普通人可以不靠资源、不靠技术背景，用AI工具加上一套可复制的副业打法，从0到1跑通自己的赚钱闭环。
target_reader: 想用AI提效或开始副业的职场人、自由职业者、小创业者，没有技术背景但愿意动手实践的普通人。
reader_problem: AI工具和信息太多不知从何下手；副业试错成本高、缺乏系统方法；学了很多技术却无法变现。
differentiation: 市面上同类书要么只讲AI技术（如SD教程）不涉及变现，要么只讲副业缺乏AI赋能视角；本书将'AI实操+副业变现'结合，且全部基于一手实战复盘（如GMV1600万、年入百万外贸），提供可迁移的方法论而非空泛理论。
recommended_title: AI副业实操手册
subtitle: 从0到1用AI跑通你的赚钱闭环
alt_title_1: AI+副业：普通人也能上手的实战打法
alt_title_2: 一个人也能做的AI赚钱生意
shape_description: 一本约10-12万字的实战型图书，分两大部分：AI创作生产力（写作、绘画、口播）与副业电商变现（闲鱼、小红书、拼多多、外贸、私域），每章以真实案例切入+方法论拆解+操作步骤收尾。
structure_logic: 从'道'到'术'再到'用'：首先建立商业底层认知（利他、满足需求），再进入AI工具实操（写作、绘画、口播），随后展开各平台副业打法（闲鱼、小红书、拼多多、外贸、私域），最后以风险提示与心态建设收束，形成'认知-工具-平台-风控'闭环。
