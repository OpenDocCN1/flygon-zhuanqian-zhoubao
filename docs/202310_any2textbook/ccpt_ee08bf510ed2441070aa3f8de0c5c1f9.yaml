paper: '20231017_026'
desc: 该素材提出了一套利用ChatGPT辅助写作爽文小说的四步框架，强调通过感官氛围制造紧张感、明示危险、刻画内心紧张以及给出希望曙光来构建爽文的情节结构，并附带了对用户提问逻辑问题的澄清与评论区关于AI长篇小说写作可行性的讨论。
concepts:
- name: 爽文
  desc: 一种以调动读者情绪为核心、让读者阅读时感到特别燃并具有肾上腺素被激活感觉的小说类型。
  is_original: false
  excerpt:
  - 爽文特点是让用户读起来特别燃，能调动情绪，肾上腺素被激活的感觉。
- name: 四步爽文写作框架
  desc: 构成爽文情节结构的基本步骤，包括感官紧张氛围制造、危险出现、内心紧张描写和希望曙光出现。
  is_original: true
  excerpt:
  - 爽文的框架大致四步：1.从感官上制造紧张氛围，即从视觉、听觉、嗅觉等方面描写制造紧张氛围。2.危险出现，当感官紧张氛围营造得差不多时一定要描写危险的出现。3.内心的紧张，危险出现后进一步描述主人公紧张的内心状态或接下来可能发生哪种最坏情况。4.看见一丝曙光，读者神经不可能一直绷着，这里要给故事一点希望，让主人公能找到出路。
methods:
- name: 四步提示词训练法（ChatGPT爽文写作方法）
  desc: 该方法按四步框架向ChatGPT下达指令，先生成大纲再根据大纲扩展为短篇爽文故事。
  excerpt:
  - 按照这四个步骤去训练ChatGPT，生成大纲，再根据大纲扩展出故事，就能得到一篇短篇爽文。
- name: 大纲—细节填充写作流程（评论区方法）
  desc: 先通过AI确定小说大纲，再通过补充各种细节精确到每一章写什么，最后进行细节填充。
  excerpt:
  - 好的方式是先通过AI确定小说大纲，然后通过补充各种细节精确到每一章写什么，再进行细节填充。
theorems:
- name: 用户提问逻辑混乱的归因定理
  desc: 用户在使用ChatGPT生成爽文时结果不佳主要可归因于四个原因：未使用GPT-4、指令一次到位且命令过多、命令描述不清、对故事结构缺乏规划。
  excerpt:
  - 用户逻辑混乱原因可能是：一是没用4.0要用4.0，二是希望一步到位加的命令太多，三是命令描述不清机器只能盲写，四是对故事结构没有规划。
- name: AI长篇网文写作的局限性主张
  desc: AI适合写短篇，写长篇网文太为难；需要人工写手把控以解决连贯性问题。
  excerpt:
  - 网文太长一本需200万字，AI写短篇还可以写长篇太为难；配一个月薪3000的批量网文工作室写手做把控能解决连贯性。
findings:
- name: 四步框架训练有效性的案例
  desc: '[claim] 作者宣称按四步框架训练ChatGPT即可生成大纲并扩展出短篇爽文，但素材未给出具体实验数据或结果验证样本，仅为个人经验主张。'
  excerpt:
  - 按照这四个步骤去训练ChatGPT，生成大纲，再根据大纲扩展出故事，就能得到一篇短篇爽文。
  - 要不断精细化文章结构一直写（做了示范）。
- name: AI长篇连贯性问题的人工干预解决建议
  desc: '[claim] 评论区建议配人工写手把控AI长篇写作的连贯性，但该建议未提供实际案例或可行性数据支撑。'
  excerpt:
  - 配一个月薪3000的批量网文工作室写手做把控能解决连贯性。
