paper: '20231017_011'
desc: 该素材是粥左罗关于写作方法论的文章，提出四个核心主张：越是没积累沉淀越要写（写作倒逼输入促进积累）、多写似懂非懂的内容（借由写作将其彻底弄明白）、通过写课程/书/专栏完成专家化、以及将写作生活化（从日常生活中持续获取素材与思考）。文章用一个励志练习者案例（作者本人写90节新媒体课程）以及多个日常生活案例来支撑其观点。
concepts:
- name: 积累沉淀
  desc: 指个人在某一领域知识、认知、经验等方面的厚积；作者主张积累不是写作的前提而是写作的结果，写作是加速积累的手段。
  is_original: false
  excerpt:
  - 越是没积累沉淀越要写。因为没积累沉淀，所以每次写要去搜索学习消化思考，一直写就一直在强迫自己搜索学习消化思考，恰恰因为写更快更好地完成了积累沉淀。
- name: 似懂非懂
  desc: 指对某事物只有模糊或部分理解的状态；作者认为应将写作视为驱使自己将这类内容彻底弄明白的工具，从而让世界越来越清晰。
  is_original: false
  excerpt:
  - 要多写自己似懂非懂的东西。平时接触学习的大多数东西都是似懂非懂，因为彻底弄明白并非刚需。而当你把它写出来给别人看时彻底弄明白就成了刚需。
methods:
- name: __overview__
  desc: 文章整体提出一套以写作为核心驱动力的个人成长方法论：通过写作强迫自己搜索、学习、消化、思考，将输入与输出一体化，最终完成知识积累、认知深化与领域专家化。
  excerpt:
  - 你越是没有积累沉淀越要写。因为没积累沉淀，所以每次写要去搜索学习消化思考，一直写就一直在强迫自己搜索学习消化思考，恰恰因为写更快更好地完成了积累沉淀。
- name: 写作倒逼积累法
  desc: 当积累不足时，不应停止写作，而应开始写作；每次写作迫使自己搜索、学习、消化、思考，从而更快完成积累沉淀，反向加速成长。
  excerpt:
  - 如果不写就不需要迫切积累沉淀反而更慢，一年过去还是没有太多积累沉淀。
- name: 似懂非懂写作法
  desc: 选择写那些自己似懂非懂的内容，借由面向读者的输出将模糊理解进化为彻底理解，持续写下去整个认知世界会更加清晰。
  excerpt:
  - 每次写似懂非懂的东西就是通过写作把似懂非懂进化成彻底弄明白，一直写持续写世界就越来越清晰。
- name: 课程撰写闭环
  desc: 通过承诺写一个体系（如90节课程）并定期交付，逼自己持续研究、输出，最终在该领域完成专家化；写作体量本身成为专业深度的引擎。
  excerpt:
  - 他不是因为成为了新媒体专家所以写出这门课，相反是因为逼着自己一点点把课写完所以成为了新媒体专家。
- name: 写作为日常所用法
  desc: 把写作嵌入日常生活：每天都从当天生活（吃、观影片、陪诊、观察地域差异等）中提炼一个结论或抽象一个观点，实现日更的素材自足与思维训练。
  excerpt:
  - 作者的每日写作从每天生活中找一件事得出一个结论或抽象出一个观点认知。
  - 吃米线吃撑写《幸福源于不充分的享受》；咖啡馆被老板说写三个小短篇；陪孩子看病写《人要不断进入积极环境中》……
theorems:
- name: 积累是写作的结果而非前提
  desc: 核心主张：写作者不应等待积累沉淀完成才开始写作；相反，越是没积累越要写，写作行为本身正是加速积累沉淀的手段，不写则积累更慢。
  excerpt:
  - 越是没积累沉淀越要写。
  - 如果不写就不需要迫切积累沉淀反而更慢，一年过去还是没有太多积累沉淀。
- name: 似懂非懂正是写作的合适对象
  desc: 核心主张：写作的对象不应只限于已彻底弄懂的东西，而应多写似懂非懂的内容；因为有面向读者的输出，彻底弄明白才成为刚需，从而借写作完成认知升级。
  excerpt:
  - 不是因为很懂才写，而是如果不写很多东西只能似懂非懂。
  - 每次写似懂非懂的东西就是通过写作把似懂非懂进化成彻底弄明白，一直写持续写世界就越来越清晰。
- name: 写作是专家化的实现路径
  desc: 核心主张：不是先成为专家再写作，而是通过逼自己写完一门课/一本书/一个专栏，在持续的体系化写作中完成专家化；每写出一门课就在某领域功力大增。
  excerpt:
  - 每写出一门课就在某个领域功力大增。
  - 建议：写一门课、写一本书、在某一个领域写专栏，一篇篇持续写写出体系。
- name: 写作生活化：世事洞明皆学问
  desc: 核心主张：读书不是唯一思考来源，观察生活、看文章视频、刷朋友圈、观察身边的人和事都能获得思考；把每天的日常经历转化为写作素材，让每一天都有意义并留下思维痕迹。
  excerpt:
  - 世事洞明皆学问。
  - 把生活写作化的好处：每天没有白过认真生活感受生活洞察生活汲取智慧……回看一天天思考清晰看到自己变化更好规划成长。
findings:
- name: 作者个人案例：从写课到成为专家
  desc: '[claim] 作者声称自己因2016年底开始写90节新媒体课程——在不知道讲什么的情况下每两天更新一节——而成为新媒体专家，即写课行为本身驱动了专家化。该结论来自作者自述，未提供额外数据支撑。'
  excerpt:
  - 作者2015年8月入行新媒体，2016年底开始写90节新媒体课程，开始时不知道90节该讲什么，每两天更新一节，每次写课当天去研究可以写什么。他不是因为成为了新媒体专家所以写出这门课，相反是因为逼着自己一点点把课写完所以成为了新媒体专家。
- name: 写作生活化的日常案例集
  desc: '[evidence] 素材列举了多个作者的写作来源实例（吃米线→《幸福源于不充分的享受》；咖啡馆被老板说→三个小短篇；陪孩子看病→《人要不断进入积极环境中》；看王宝强电影→《人这一辈子得到的一切不会高于他的相信》；北京看病贵柳州便宜→《你的客户消费水平决定你的赚钱水平》），这些案例支撑了“从日常生活抽象观点即可写作”的可行性。'
  excerpt:
  - 吃米线吃撑写《幸福源于不充分的享受》；咖啡馆被老板说写三个小短篇；陪孩子看病写《人要不断进入积极环境中》；看王宝强电影写《人这一辈子得到的一切不会高于他的相信》；北京看病贵柳州便宜写《你的客户消费水平决定你的赚钱水平》。
- name: 低阅读量下的思考供给
  desc: '[claim] 作者自称读书很少（一年不超过10本）但仍有大量思考，并主张非书籍输入（文章、短视频、朋友圈、直播、观察生活）同样能维持高质量写作素材与思考供给。该为作者自我叙事，未提供横向对比或数据。'
  excerpt:
  - 作者读书很少一年不超过10本，但有很多思考。读书不是唯一思考来源，看文章看短视频刷朋友圈看直播观察生活观察身边的人和事每天做事获取思考都行。
