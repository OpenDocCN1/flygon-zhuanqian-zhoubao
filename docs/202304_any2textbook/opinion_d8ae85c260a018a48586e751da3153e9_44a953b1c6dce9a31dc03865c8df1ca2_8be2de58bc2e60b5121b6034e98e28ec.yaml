best_shape: book
book_worthiness: worth
conclusion_type: ready
one_line_judgment: 素材具备成为一本面向个体创业者的'AI时代赚钱方法论'图书的完整潜力，需统一命题与结构化重组。
recommended_shape: book
shape_reason: 素材共享'AI时代个体与中小企业如何聚焦定位、构建壁垒、善用工具实现变现'的强母题，可围绕心法-战略-流量-变现-工具组合成6-8章结构
not_recommended_shapes:
- course
- kb
not_recommended_reasons:
- 素材是文章而非教学结构，转课程需重构
- 内容已收敛于AI变现阶段主题适合线性阅读
if_force_book_need: 需补充失败案例、AI工具局限性论述、配套练习、统一术语体系
core_proposition: AI时代个体与中小企业的赚钱新范式：聚焦'5%优势'，以工具（GPT/AI）提效，以资源差构建壁垒，通过公域引流+私域深耕实现持续变现
target_reader: 个体创业者、自由职业者、中小企业主、希望通过AI工具获得第二增长曲线的职场人
reader_problem: 面对AI浪潮，如何找到属于自己的细分定位？如何利用AI工具大幅提升效率、降低成本？如何将流量转化为可持续的商业变现？
differentiation: 市面同类书多聚焦单一平台技巧或纯理论，本书提供'心法+战略+流量+变现+工具'的闭环体系，融合多个平台一线操盘复盘与AI应用一手案例，兼具高度与实操颗粒度。
recommended_title: AI 时代的赚钱新范式
subtitle: 个体与中小企业的定位、壁垒与变现方法论
alt_title_1: 5% 的生意：AI 时代个体创富心法
alt_title_2: 从 0 到 10 万：AI 时代个体变现实战手册
shape_description: 一本约8章、15-20万字的实战方法论图书，以'心法-战略-流量-变现-工具'五层结构统领，每章末附'行动清单'与'避坑指南'。
structure_logic: 遵循'道（认知升级）- 法（战略定位）- 术（流量/变现）- 器（AI工具）'的逻辑递进，从认知打破、战略聚焦，到各平台实操打法和完整案例复盘，最终以AI工具应用和避坑指南收尾，形成闭环。
toc_draft:
- 1. 重新理解赚钱：本质、要素与赚钱知识体系的构建
- 2. 赚钱的底层商业框架：产品、用户、增长的三环方法论
- 3. 战略聚焦：永远只做属于你的5%生意
- 4. 认知升级：创业层级决定利润天花板，善用资源差构建壁垒
- 5. 公域引爆：主流平台起号涨粉与引流实战（抖音/小红书/视频号/公众号）
- 6. 变现闭环：IP塑造、社群运营与高客单转化的完整操盘复盘
- 7. 效率革命：ChatGPT/GPT 的核心心法、调教技巧与行业提效应用
- 8. 避坑指南与未来展望：AI创业者的4个坑与长期主义路径
to_retain:
- 所有保留的24篇素材作为全书核心章节目录素材
- 《永远只做5%的生意》作为全书的战略定调章节
- 《生财有术赚钱体系梳理新人启航指南》作为商业底层框架
- 《复盘如何发掘资源差并变现》作为资源差方法论
- 《玩ChatGPT2个月后我总结出高效对话的6字真经》和《GPT调教心流法-身份篇》作为AI工具章节核心素材
- 《普通人做情感IP从0-1起盘单日变现5W+》等高质量IP操盘复盘作为变现章节案例
to_delete:
- 未能通过筛选（已排除/降级）的素材
- 时效性极强且与主命题关联弱的纯平台规则细节内容（如彻底过时的算法规则）
to_merge_rewrite:
- 多篇TikTok/抖音带货复盘（书单号、直播带货）合并为'短视频带货实战'一章
- 多篇小红书引流/变现素材合并为'小红书生态玩法'一章
- 公众号与视频号素材合并为'微信生态运营'，并与其他平台形成对比
to_supplement:
- 统一的'前言'，明确核心命题并串联各章逻辑
- 统一的术语表和核心概念框架（如：资源差、5%生意、AI心法六字真经）
- 针对AI工具类章节，补写局限性分析，避免读者产生不切实际期望
- 各章节末尾的'行动清单'和'避坑指南'，增强实操性
- 必要的失败案例（如已有AI创业避坑指南，可补充其他非AI的失败案例对比）
retain_principles: 核心原则：内容共享明确母题、具备方法论高度、能独立成章或成为章内小节的关键素材；对仅提供单一平台技巧、时效性过强且不支持核心命题的素材，作为补充案例或删除。
steps:
- 第一步：提炼并锁定主命题，完成全书大纲细化与章节过渡设计
- 第二步：按新版大纲对24篇素材进行归属、合并重写，并撰写过渡衔接段
- 第三步：补写缺失的框架性内容（前言、行动清单等），完成试读章节并进行外部反馈
risks:
- AI工具章节的时效性风险较高，书稿交付时相关功能可能更新，需在表述上侧重底层心法而非具体操作界面
- 多平台操作细节（抖音、小红书等）易过时，需在编辑层面强化逻辑与方法论沉淀，弱化平台即时规则
- 素材来源为作者个人实践，可能存在视角单一的问题，需补充第三方案例或数据增强说服力
- 需避免全书变成'生财有术'案例合集，需凸显作者独立框架与观点
next_product: 全书完整初稿（含前言、目录、正文、行动清单）
default_output_file: 全书初稿.md
writing_approach: 在原素材基础上进行深度整合与重写，保留作者一手经验的鲜活感，同时统一全书语言风格、术语体系，补齐各章间的逻辑过渡。
