paper: '20230418_088'
desc: 素材提出 '只做5%的生意' 的经营哲学，主张通过严格筛选目标客户、放弃不符合定位的用户，换来电传播、健康经营、从容心态、专业形象和更大规模，并强调品牌拥有选择用户的主动权。
concepts:
- name: 5%的生意
  desc: 主动放弃95%的潜在生意，只承接最符合品牌定位的5%客户，以质量换取长期健康发展的经营策略。
  is_original: true
  excerpt:
  - 永远只做5%的生意。定位决定选择。
  - 5%的生意小吗：5%带来的规模。
- name: 用户选择权
  desc: 品牌拥有选择客户的主动权——这是对'用户是上帝'传统观念的反叛，主张通过主动筛选用户而非被动迎合来实现品牌价值。
  is_original: true
  excerpt:
  - 用户不是上帝：体面尊重认可。
  - 用户心态无法改变但可以选择，好的品牌有选择用户的权利。
- name: 定位决定选择
  desc: 品牌定位是其客户选择行为的决定性因素，定位本身即蕴含了筛选客户的标准。
  is_original: false
  excerpt:
  - 定位决定选择，5%带来的传播。
methods:
- name: 5%客户筛选法
  desc: 通过主动放弃不符合定位的用户、仅服务与品牌定位高度契合的5%优质客户，来综合实现传播、健康、从容、专业、规模五大收益的经营方法论。
  excerpt:
  - 永远只做5%的生意。
  - 放弃不符合定位的用户，吸引符合定位的人。
  - 用户心态无法改变但可以选择，好的品牌有选择用户的权利。
- name: __overview__
  desc: 以'5%法则'为核心的整体经营方法论：定位→筛选→放弃→收获。通过限定客户范围，把资源集中投放在最匹配的客户群，从而在多维度获得系统性的正向反馈。
  excerpt:
  - 定位决定选择，5%带来的传播。保证交付水平，5%带来的健康。
  - 用户不是上帝：体面尊重认可，5%带来的从容。专业细分聚焦，5%带来的专业。
  - 5%的生意小吗：5%带来的规模。当成交和不成交的客户都说你好。
theorems:
- name: 5%规模悖论
  desc: 核心主张：5%的生意虽然是少数，但通过精准选择反而能带来更大的规模收益，即'少即是多'的经营反直觉逻辑。
  excerpt:
  - 5%的生意小吗：5%带来的规模。
  - 当成交和不成交的客户都说你好。
- name: 品牌用户双向选择论
  desc: 核心主张：用户心态无法被改变但可以被选择，好的品牌与用户之间是相互选择的关系，品牌应当主动行使选择权。
  excerpt:
  - 用户心态无法改变但可以选择，好的品牌有选择用户的权利。
  - 放弃不符合定位的用户，吸引符合定位的人。
- name: 5%多维收益定理
  desc: 核心主张：只做5%的生意是一个战略原点，通过这个原点可以在传播、健康、从容、专业、规模五个维度同时获得收益。
  excerpt:
  - 5%带来的传播。... 5%带来的健康。... 5%带来的从容。... 5%带来的专业。... 5%带来的规模。
findings:
- name: 客户口碑效应
  desc: '[claim] 原文宣称：当只服务5%的目标客户时，成交和不成交的客户都会为品牌说好话——这是素材所主张的口碑传播机制，无数据支撑。'
  excerpt:
  - 当成交和不成交的客户都说你好。
- name: 5%经营收益结构
  desc: '[claim] 原文宣称：做5%的生意可以同时带来传播、健康、从容、专业和规模五方面的收益——这是素材的核心因果链条，属于主张而非实证发现。'
  excerpt:
  - 5%带来的传播、健康、从容、专业和规模
  - 当成交和不成交的客户都说你好。
