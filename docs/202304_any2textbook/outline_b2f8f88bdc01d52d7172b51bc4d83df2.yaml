- 'no': 1
  name: 商业思维入门 —— 从“赚钱”到“系统化变现”
  desc: 本章从个人赚钱的底层逻辑出发，将抽象的商业活动拆解为可观察、可分析的组件，并建立一套判断项目价值与个人能力匹配度的筛选与归因框架，帮助你完成从“凭感觉做事”到“按框架决策”的认知升级。
  nodes:
  - 'no': 1
    name: 赚钱的本质 —— “交易三要素”
    desc: 用“组装流水线”类比，将赚钱拆解为用户需求、产品服务、用户增长、商业变现四个必要的组件，理解任何商业活动都必须同时满足“掌握资源、找到买家、完成交易”这三个必要条件，否则链条断裂则无法变现。
    role: motivation
    src:
    - paper: docs/202304/EnMvdgCPboEplRxJPdXcMUrznbf.md
  - 'no': 2
    name: 赚钱的根本原理 —— “三大摩擦力”
    desc: 揭示个人能够赚钱的底层商业原理：信息不对称（信息差即圈层差）、交付不便利、信用不传递。理解这三大原理是识别一切商业机会的“透视镜”。
    role: definition
    src:
    - paper: docs/202304/EnMvdgCPboEplRxJPdXcMUrznbf.md
  - 'no': 3
    name: 项目筛选 —— “八大校验清单”
    desc: 将八大项目筛选标准（对受众产生价值、进入门槛低、兴趣能力圈内、收益天花板高、合法正规、顺应平台规则、能积累复用资源、符合时代趋势）作为一套“体检表”，逐项校验一个赚钱方向是否值得投入。
    role: method
    src:
    - paper: docs/202304/EnMvdgCPboEplRxJPdXcMUrznbf.md
  - 'no': 4
    name: 项目成败归因 —— “双维诊断框架”
    desc: 介绍从“底层关键能力”（强目标导向、关键事项意识、执行闭环、定期复盘、情绪调节、空杯心态）和“失败维度”两个方向对项目结果进行归因的方法，避免把失败简单归咎于运气或市场。
    role: method
    src:
    - paper: docs/202304/EnMvdgCPboEplRxJPdXcMUrznbf.md
  - 'no': 5
    name: 框架的适用边界 —— 从“创业”到“个人成长”的延伸
    desc: 讨论该框架的局限与扩展：该模型主要面向个人/小团队创业场景，对复杂组织、资源密集型企业不完全适用；但其背后的“找需求、建产品、搞增长、通变现”逻辑可迁移至个人职业规划、副业探索等领域。
    role: limitation
    src:
    - paper: docs/202304/EnMvdgCPboEplRxJPdXcMUrznbf.md
