paper: '20230418_092'
desc: 该素材提出将创业划分为七个从低到高的层级（流量型业务、产品型业务、头部类目、圈行业、建生态、推动领域、见天地见众生见自己），并主张创业层级决定利润天花板，强调创业者的收入可以波动，但创业层级必须持续提升，避免低水平重复。
concepts:
- name: 创业七层级
  desc: 将创业由低到高划分为七个层级，层级越高，利润天花板越高、壁垒越强，依次为：流量型业务、产品型业务、头部类目、圈行业、建生态、推动领域、见天地见众生见自己。
  is_original: true
  excerpt:
  - 将创业分为七层级：1流量型业务（流量套利，人最多，无壁垒，天花板有限）2产品型业务（打磨产品，用产品获客变现，有壁垒，可吸人才，年利润千万级）3头部类目（垂直细分类目快速做到头部，对行业赋能，赚业务钱+类目增长钱）4圈行业（提高抗周期性，类目变行业，建立深厚壁垒）5建生态（找到本源的道，创造生态系统）6推动领域（活得久+推动某领域发展）7见天地见众生见自己。
- name: 利润天花板
  desc: 指创业所能达到的利润上限，由创业所处的层级决定，层级越高，利润的天花板也越高。
  is_original: false
  excerpt:
  - 你创业的层级决定利润的天花板。
methods:
- name: __overview__
  desc: 以创业层级评估与定位为核心的整体方法论：通过将创业划分为七个层级来判断企业所处阶段，并以『是否提升创业层级、避免低水平重复』作为创业者决策与进步的评价标准。
  excerpt:
  - 1流量型业务（流量套利，人最多，无壁垒，天花板有限）2产品型业务（打磨产品，用产品获客变现，有壁垒，可吸人才，年利润千万级）3头部类目（垂直细分类目快速做到头部，对行业赋能，赚业务钱+类目增长钱）4圈行业（提高抗周期性，类目变行业，建立深厚壁垒）5建生态（找到本源的道，创造生态系统）6推动领域（活得久+推动某领域发展）7见天地见众生见自己。
theorems:
- name: 创业层级决定利润天花板
  desc: 核心主张：创业所处的层级直接决定了其所能达到的利润上限，层级越高利润空间越大。
  excerpt:
  - 你创业的层级决定利润的天花板。
- name: 收入可波动但层级必须增加
  desc: 核心主张：创业者的收入水平可以有波动起伏，但创业的层级必须持续上升；若没有进步（未能提升层级）即是退步，反对低水平重复。
  excerpt:
  - 收入可以波动但创业层级一定要增加，不要低水平重复，没有进步就是退步。
findings:
- name: 低层级业务的特征
  desc: '[claim] 素材宣称流量型业务层级最低，表现为流量套利、参与者最多、无壁垒、天花板有限。'
  excerpt:
  - 1流量型业务（流量套利，人最多，无壁垒，天花板有限）
- name: 产品型业务的营收规模
  desc: '[claim] 素材宣称产品型业务能建立起壁垒、吸引人才，年利润可达千万级。'
  excerpt:
  - 2产品型业务（打磨产品，用产品获客变现，有壁垒，可吸人才，年利润千万级）
- name: 头部类目与圈行业的收益来源
  desc: '[claim] 素材宣称头部类目可同时赚业务钱与类目增长钱；圈行业（类目变行业）可提高抗周期性并建立深厚壁垒。'
  excerpt:
  - 3头部类目（垂直细分类目快速做到头部，对行业赋能，赚业务钱+类目增长钱）4圈行业（提高抗周期性，类目变行业，建立深厚壁垒）
- name: 顶层创业的价值
  desc: '[claim] 素材宣称建生态（创造生态系统）、推动领域（活得久并推动领域发展）、见天地见众生见自己依次为更高层级的创业追求。'
  excerpt:
  - 5建生态（找到本源的道，创造生态系统）6推动领域（活得久+推动某领域发展）7见天地见众生见自己。
