paper: '20230418_083'
desc: 该素材是一次商业复盘，核心在于提出“垄断是最好的生意”这一核心主张，并给出识别好生意的五个特征（关注低、产品少、转化高、竞争少、毛利大）。素材指出普通人生意应通过发掘认知差、信息差、资源差中的“资源差”来进行降维竞争，并总结出成功万能公式：热情×方向×执行力＝成功，强调选择（方向）比努力更重要。
concepts:
- name: 好生意的五特征
  desc: 判断一门生意是否值得做的五个筛选维度，满足其中至少3个即可称得上好生意。
  is_original: true
  excerpt:
  - 理解的好生意至少有5个特征中的3个：关注低、产品少、转化高、竞争少、毛利大。
- name: 三差（认知差、信息差、资源差）
  desc: 人与人之间赚钱能力差异的三个来源，其中认知差可由生财经验抹平，信息差由精华帖消除，资源差是素材重点讨论的议题。
  is_original: false
  excerpt:
  - 人与人之间赚钱能力区别在于三差：认知差、信息差、资源差。
  - 生财抹平认知差，精华帖消除信息差，重点讲资源差。
- name: 垄断型生意
  desc: 一种资源获取难度大、竞争门槛高的生意类型，普通人难以直接获取，需通过资源差进行降维替代。
  is_original: false
  excerpt:
  - 垄断是最好的生意。
  - 垄断类型资源获取难度大，普通人降维用资源差代替。
methods:
- name: __overview__
  desc: 整体方法论为：通过五特征判别好生意 → 识别自身可支配的资源差 → 以资源差降维切入垄断型市场，并依靠成功公式驱动执行。
  excerpt:
  - 复盘如何发掘资源差并变现。
  - 垄断类型资源获取难度大，普通人降维用资源差代替。
  - 万能公式：热情×方向×执行力＝成功。
- name: 好生意筛选法（五特征打分）
  desc: 用“关注低、产品少、转化高、竞争少、毛利大”五个指标对生意机会进行评估，至少命中3项即可视为好生意。
  excerpt:
  - 理解的好生意至少有5个特征中的3个：关注低、产品少、转化高、竞争少、毛利大。
theorems:
- name: 成功万能公式
  desc: 成功由热情、方向、执行力三要素相乘决定，且方向（选择）的权重被特别强调为“比努力更重要”。
  excerpt:
  - 万能公式：热情×方向×执行力＝成功。
  - 选择比努力更重要。
- name: 普通人垄断替代论
  desc: 垄断是最好生意但资源门槛高，普通人应利用资源差作为垄断资源的降维替代来实现变现。
  excerpt:
  - 垄断是最好的生意。
  - 垄断类型资源获取难度大，普通人降维用资源差代替。
findings:
- name: 资源差是可被发掘并变现的差异化优势
  desc: '[claim] 素材主张普通人赚钱的突破口在于发掘自身资源差，并以降维方式替代垄断资源进行变现；该主张为复盘式经验结论，无数据支撑。'
  excerpt:
  - 复盘如何发掘资源差并变现。
  - 垄断类型资源获取难度大，普通人降维用资源差代替。
- name: 三差消除路径的对应关系
  desc: '[claim] 素材宣称认知差可由生财抹平、信息差由精华帖消除、资源差为讨论重点，形成一套经验性的差异弥补路径。'
  excerpt:
  - 生财抹平认知差，精华帖消除信息差，重点讲资源差。
