learning_targets:
- 理解'赚钱=交易=买卖'的底层逻辑，能用交易视角统一解释各种赚钱形态
- 掌握三多增收法的公式拆解（收入=卖出的件数×单件价格×可卖的品类数）
- 掌握稀缺与定价权的关系，能判断什么条件下自己拥有定价权
- 能运用三多增收法为具体产品或服务设计增收路径
- 能识别交易成立的边界条件（双向自愿、存在可接受对价等）
concept_map:
- 交易式赚钱
- ├── 本质定义
- │   ├── 赚钱 = 交易 = 买卖        —— P001
- │   ├── 交易必须双向成立          —— P001
- │   └── 未卖出的生产不构成赚钱     —— P001
- ├── 三多增收法
- │   ├── 卖得多（复购+分销）        —— P001
- │   ├── 卖得贵（稀缺定价）        —— P001
- │   └── 卖得多元（品类扩展）      —— P001
- ├── 稀缺与定价权
- │   ├── 稀缺方掌控定价权          —— P001
- │   ├── 稀缺来源（产品/技能/渠道/信息）—— P001
- │   └── 稀缺与圈层/信息差          —— P001
- └── 边界条件
- '    ├── 需要可接受对价             —— P001'
- '    ├── 交易必须自愿               —— P001'
- '    └── 稀缺相对买方成立           —— P001'
life_analogy:
- 想象赚钱就像在**集市上摆摊**：
- '- **交易** = 你把商品卖给顾客，顾客付钱给你'
- '- **卖得多** = 老顾客每周都来复购，还介绍了新顾客来'
- '- **卖得贵** = 你的独家商品只有你有，可以定高价'
- '- **卖得多元** = 你从只卖蔬菜扩展到水果、熟食、手工品'
- '- **稀缺与定价权** = 整条街只有你会做某种小吃，价格你说了算'
- 就像摊主需要同时考虑客流量、定价和品类，赚钱也需要同时从三个方向发力。
summary:
- concept: 赚钱=交易=买卖
  desc: 赚钱的本质是价值与货币的双向交换，未卖出的生产不构成赚钱
- concept: 三多增收法
  desc: 通过卖得多、卖得贵、卖得多元三个独立维度拉高收入
- concept: 卖得多
  desc: 通过可复购和分销机制，让同一产品被反复购买、被更多人购买
- concept: 卖得贵
  desc: 通过稀缺定价，提升单次交易的对价
- concept: 卖得多元
  desc: 通过开发多种产品或服务，扩大可交易的品类
- concept: 稀缺与定价权
  desc: 不可替代、供给稀缺的一方拥有决定价格的能力
- concept: 圈层与信息差
  desc: 社会分层导致圈层变多、信息差扩大，信息稀缺成为定价权来源
- concept: 交易边界条件
  desc: 交易需双向自愿、存在可接受对价，强买强卖或价格为零不构成赚钱
exercises:
- 'no': 1
  title: 拆解身边的赚钱案例
  contents:
  - 以一家你熟悉的奶茶店为例：
  - 1. 分别指出其'卖得多、卖得贵、卖得多元'各采取了哪些具体动作
  - 2. 分析这三个维度中哪个最强、哪个最弱
  - 3. 如果只能改进一个维度，你会选哪个？给出具体方案
  - ''
  - 回答问题：
  - '- 这家奶茶店是否拥有定价权？依据是什么？'
- 'no': 2
  title: 用收入公式设计增收路径
  contents:
  - 给定某知识付费博主的收入数据：
  - '- 单门课程售价 ¥199，年销量 1000 份'
  - '- 另有 ¥99/年的社群会员，现有 500 人'
  - ''
  - 请计算：
  - 1. 当前年收入是多少？
  - 2. 分别按'多卖、贵卖、多元卖'给出三种增收方案，并估算每种方案的收入上限
  - 3. 将三种方案叠加，计算理论最大年收入
  - ''
  - 回答问题：
  - '- 三种方案叠加时是否存在相互制约？'
- 'no': 3
  title: 定价权来源分析
  contents:
  - 以'顶尖眼科医生'为例，分析其定价权的来源：
  - 1. 判断其属于哪类稀缺（产品/技能/渠道/信息/品牌信任）
  - 2. 分析如果该技术被 AI 辅助诊断系统替代，定价权会发生什么变化
  - 3. 提出两种'主动创造稀缺'的策略来维持定价权
  - ''
  - 回答问题：
  - '- 定价权是永久的吗？哪些因素会导致定价权流失？'
units:
- 'no': 1
  name: 交易式赚钱 —— 给赚钱一个最底层的定义
  points:
  - '**为什么需要这个概念？**'
  - '- 说到赚钱，直觉会想到工资、利润、副业等，容易碎片化，无法看到全局'
  - '- 如果不定义本质，后续所有方法都缺少一个锚点，难以判断什么是有价值的行动'
  - '- 需要一个最简的、可扩张的定义，把各种赚钱形态统一进一个框架'
  - '**核心定义**'
  - '- 赚钱的本质是交易：用自己的产品、服务、时间、注意力等去换回货币'
  - '- 等价表述：赚钱 = 交易 = 买卖'
  - '- 只要发生了交易（你给出价值、对方付出对价），你就在赚钱'
  - '**关键性质**'
  - '- 交易必须双向成立：没有买家，卖出动作不构成赚钱'
  - '- 交易对象可以是实物、虚拟服务、信息差、乃至注意力'
  - '- 交易既包括一次性买卖，也包括持续性的复购'
  - '**典型例子**'
  - '- 上班打工：用劳动时间换月薪，是一种交易'
  - '- 开网店：用商品换货款，是交易'
  - '- 知识付费：用课程/内容换学费，是交易'
  - '**边界条件**'
  - '- 如果只是生产（做出了东西）但没有卖出去，不构成赚钱'
  - '- 如果交易是非自愿的（强买强卖），也不属于正常意义上的赚钱'
  - '- 交易需要存在一个可接受的对价（价格），价格为零时是赠送而非赚钱'
  sources:
  - paper: docs/202304/doxcnk4mqgBMJTv0mklq0eR48fg.md
    role: origin
  excerpts:
  - 赚钱的本质是交易、卖东西。
  - 赚钱=交易=买卖。
  - 赚钱的本质是交易与买卖行为
- 'no': 2
  name: 三多增收法 —— 把交易规模从三个方向撑大
  points:
  - '**为什么需要这个概念？**'
  - '- 知道了赚钱=交易之后，面临一个实际问题：如何具体地赚更多钱？'
  - '- 单靠一次大买卖无法持续，需要一套可拆解的、可复制的增收框架'
  - '- 从交易公式中拆出三个可操作的杠杆：多卖、贵卖、多元卖'
  - '**核心定义**'
  - '- 三多增收法，即通过三个维度同时拉高收入：'
  - '  - 卖得多：通过可复购和分销机制，让同一产品被反复购买、被更多人购买'
  - '  - 卖得贵：通过稀缺定价，提升单次交易的对价'
  - '  - 卖得多元：通过开发多种产品或服务，扩大可交易的品类'
  - '**关键性质**'
  - '- 三个维度相互独立，可同时叠加生效'
  - '- 三多本质是拆解交易收入公式：收入 = 卖出的件数 × 单件价格 × 可卖的品类数'
  - '- 复购和分销是''卖得多''的两个内在引擎'
  - '**典型例子**'
  - '- 咖啡店：让老顾客每周复购（卖得多）、推出限量款（卖得贵）、增加甜品（卖得多元）'
  - '- 在线课程：一次购买后追加社群费（复购）、按稀缺性涨价（贵）、开设不同主题课（多元）'
  - '**边界条件**'
  - '- 三多增收法成立的前提是产品本身有交易价值；如果产品无人需要，三个维度都无法启动'
  - '- 卖得贵需要稀缺性支撑，否则只是涨价而不会成交'
  - '- 卖得多元需要能力覆盖，盲目扩品类可能分散主营优势'
  sources:
  - paper: docs/202304/doxcnk4mqgBMJTv0mklq0eR48fg.md
    role: apply
  excerpts:
  - 卖的多（可复购+分销）、卖的贵（稀缺定价）、卖的多元
  - 三多增收法
- 'no': 3
  name: 稀缺与定价权 —— 谁稀缺谁说了算
  points:
  - '**为什么需要这个概念？**'
  - '- 三多增收法中的''卖得贵''不能凭空涨价，必须知道什么支撑了高价'
  - '- 缺少定价权概念，容易陷入低价竞争，无法提升交易价值'
  - '- 需要明确一个判定标准：什么条件下你可以自己定价格'
  - '**核心定义**'
  - '- 稀缺方掌控定价权：在交易中，不可替代、供给稀缺的一方，拥有决定价格的能力'
  - '- 稀缺的可以是产品、技能、渠道、信息或品牌信任'
  - '**关键性质**'
  - '- 定价权是非对称的：只有稀缺方拥有，另一方只能接受或放弃'
  - '- 稀缺是可被主动创造的（限量、独特性、时间窗口）'
  - '- 社会分层会导致圈层变多、信息差扩大，信息稀缺成为常见定价权来源'
  - '**典型例子**'
  - '- 限量款球鞋：供给锁死，需求旺盛，售价远超成本'
  - '- 顶尖医生的号源：技术稀缺，挂号费奇高仍一号难求'
  - '- 行业资深顾问：掌握圈层内部信息，咨询费数倍于普通从业者'
  - '**边界条件**'
  - '- 稀缺必须相对买方建立；如果买方找到替代品，定价权流失'
  - '- 稀缺资源本身如果被复制（技术扩散），定价权随之稀释'
  - '- 定价权还受法律法规和市场需求上限约束'
  sources:
  - paper: docs/202304/doxcnk4mqgBMJTv0mklq0eR48fg.md
    role: origin
  excerpts:
  - 稀缺方掌控定价权。
  - 圈层变多，信息差扩大，流通价值增大。
'no': 1
