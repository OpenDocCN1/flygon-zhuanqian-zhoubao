dimensions:
- name: 主题集中度
  score: 4
  evidence: 素材大多围绕社交媒体（小红书、视频号、TikTok）与AI工具（ChatGPT）的运营、变现与IP打造，有清晰主线和多案例支撑，但有少量旁支（如赚钱体系、5%生意哲学）需要收拢整合。
- name: 核心命题清晰度
  score: 3
  evidence: 各素材均有独立思考（如福格行为模型、6字真经、5%生意），但缺乏统一的核心主张，需提炼一个贯穿全书的针对性命题，如‘新个体如何借助AI与新媒体实现低成本变现’。
- name: 目标读者清晰度
  score: 3
  evidence: 素材面向个体创业者、营销人员、内容创作者，但部分细节（如TikTok美区、出海卖家）与普通读者存在一定距离，需取舍或在一个类目下收束。
- name: 内容厚度与互补性
  score: 4
  evidence: 素材覆盖逻辑模型（福格行为模型）、方法论（赚钱体系、6字真经）、实操步骤（视频号、TikTok、情感IP起盘）及商业哲学（5%生意），互为补强，若加以组织可形成章节体系，但个别内容在方法论与案例上有重复。
- name: 区分度与新颖性
  score: 4
  evidence: 素材多带有个人视角与深度复盘，且有独创框架（如赚钱体系、6字真经、只做5%生意），在同类新媒体课程与实操手册中具有较高区分度，但部分内容（如引流逻辑、ChatGPT对话）在市场上已有较多同质性表达。
- name: 时效风险
  score: 3
  evidence: 有较多常青的方法论（行为模型、商业哲学、赚钱逻辑），但涉及具体平台（TikTok、视频号）与工具（ChatGPT）的运营细节、红利窗口期、政策限制，依赖较强时效性，需时效策略。
- name: 可持续扩写空间
  score: 3
  evidence: 素材已有较多高密度内容，接近半本书的量，但需补写章节间的过渡、整合框架与部分缺失主题（如跨平台通用策略、内容生产系统化），否则不足以支撑完整书稿。
total_score: 24
conclusion: potential
recommended_shape: book
alternative_path: 先以‘新个体变现实战手册’小册子/专栏形态发布，积累读者反馈并持续打磨后，再整合成书，形成完整体系。
next_steps:
- 提炼贯穿全书的核心命题（如‘新个体低成本变现的系统方法论’），统一各章论述方向。
- 按平台案例（小红书、视频号、TikTok、ChatGPT）与底层逻辑、实操方法进行篇章重组，避免素材堆叠与重复。
- 扩写章节间的过渡与整合性内容，补上跨平台通用策略、常见误区、资源清单等缺失主题，使全书层次更完整。
- 制作试读章节或小册子，收集目标读者反馈，确认读者定位后再全面进入书稿定稿。
