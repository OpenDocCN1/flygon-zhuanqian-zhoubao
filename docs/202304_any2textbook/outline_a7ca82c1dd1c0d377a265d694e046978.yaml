- 'no': 1
  name: 商业定位 —— 主动做“5%的生意”
  desc: 本章从用户选择权的战略视角切入，探讨如何通过主动筛选目标客户、建立垄断壁垒来实现高价值商业定位。你将学习一套从“认知差、信息差、资源差”到“少即是多”的完整方法论。
  nodes:
  - 'no': 1
    name: 为什么“用户不是上帝”—— 主动权的转移
    desc: 用"餐厅挑食客"类比理解：品牌不应无条件服务所有用户，而应拥有选择客户的主动权，这是商业定位的起点。
    role: motivation
    src:
    - paper: docs/202304/20230418_083.md
    - paper: docs/202304/20230418_088.md
  - 'no': 2
    name: 赚钱能力的三差模型
    desc: 定义并区分认知差、信息差、资源差。指出资源差是垄断型生意的基础，但获取难度大，需通过降维策略用资源差代替其他差。
    role: definition
    src:
    - paper: docs/202304/20230418_088.md
  - 'no': 3
    name: 垄断型生意 —— 商业的“护城河”
    desc: 论证垄断是最好的生意形态。分析其资源获取难度高的瓶颈，并引出通过降维用资源差代替的解决思路。
    role: motivation
    src:
    - paper: docs/202304/20230418_088.md
  - 'no': 4
    name: 好生意筛选法 —— 五特征识别术
    desc: 提供一套实操筛选标准：关注低、产品少、转化高、竞争少、毛利大。通过这五个维度快速评估一个生意是否值得投入。
    role: method
    src:
    - paper: docs/202304/20230418_083.md
    - paper: docs/202304/20230418_088.md
  - 'no': 5
    name: 5%客户筛选法 —— 聚焦定位的执行策略
    desc: 讲解如何通过主动放弃95%的潜在生意，只承接5%目标客户来落地定位。该方法与五特征筛选法配合使用。
    role: method
    src:
    - paper: docs/202304/20230418_083.md
  - 'no': 6
    name: 5%规模悖论 —— 少即是多的数学逻辑
    desc: 揭示"5%的生意"悖论：通过精准选择放弃大部分机会，反而因高转化率和高毛利获得更大规模收益。
    role: proof
    src:
    - paper: docs/202304/20230418_083.md
  - 'no': 7
    name: 成功万能公式 —— 热情×方向×执行力
    desc: 提出成功是三个要素相乘的结果，任何一项为零则整体为零。以此说明商业定位需要热情驱动、方向正确、执行到位三者协同。
    role: extension
    src:
    - paper: docs/202304/20230418_083.md
