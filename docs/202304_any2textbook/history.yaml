    function:
      arguments: '{"paper_name": "EnMvdgCPboEplRxJPdXcMUrznbf", "paper": "生财有术赚钱体系梳理。赚钱的本质：交易（掌握资源、找到买家）。关键要素：用户、需求、找到、方案、买单。赚钱的要素组成：用户需求、产品服务、用户增长、商业变现。为什么你能够赚钱：信息不对称（用户不知其他地方可买）、交付不便利、信用不传递。信息差的思考：社会是圈层组合，信息差本质是圈层之差。如何筛选赚钱方向：对受众产生价值、进入门槛低、兴趣能力圈内、收益天花板高、合法正规、顺应平台规则、能积累复用资源、符合时代趋势。成功项目底层能力：强目标导向、关键事项意识、执行闭环、定期复盘、情绪调节、空杯心态。项目失败原因：不懂自己、不懂用户、不懂平台、不懂借力。"}'
