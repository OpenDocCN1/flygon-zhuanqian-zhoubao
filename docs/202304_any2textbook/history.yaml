  content: '"# 《永远只做 5%的生意》\n\n> 原文：[`www.yuque.com/for_lazy/thfiu8/lixxbez7w0shpoeo`](https://www.yuque.com/for_lazy/thfiu8/lixxbez7w0shpoeo)\n\n\n\n##
    (82 赞)《永远只做 5%的生意》 \n\n作者： 许义 \n\n日期：2023-04-05 \n\n下周在复旦 MBA 有一节关于流量的分享课，今天正好整理
    PPT，分享其中的一节。 \n\n《永远只做 5%的生意》 \n\n这是我自己创业以来的一个感触。 \n\n我是普通人，所谓普通人就是大学毕业以后的所有获得几乎全靠自己的人，普通人从职业到创业这中间需要的大部分认知、能力、钱财都需要依靠后期自身的摸爬滚打积累。
    \n\n创业成功很容易吗？ \n\n说实话，很难。 \n\n因为成功的结果需要要素的累积，达到这个点，结果自然发生，达不到这个点，才不配位，运气带来的钱财也会流走。
    \n\n比如呢： 怎么理解流量？ 怎么理解用户？ 怎么看待产品？ 如何选择经营？ ...... 每一个选择的背后都是思考和理念的千差万别。 如何看待生意？选择市场？如何选择用户？
    这是一个挺有意思的话题。 \n\n延伸开来看，还有一个关于今天大部分、普通人、小公司在接下来的经营逻辑。 包括我自己也感受和经历了专注、效率、极致前的痛苦选择，最后为什么选择上只做
    5%的生意？ \n\n我在旅游行业，结合旅游业来说说小企业的经营逻辑。 \n\n01 定位 \n\n定位决定了选择，定位也决定了主要市场和目标用户，尤其是在旅游行业， 大部分公司是缺少明显定位的，很多公司的业务范围涵盖：机票、酒店、跟团游、定制游、会议、团建、亲子......，也就是只要你有需求我都能做。
    \n\n但这不是今天和接下来的用户喜欢消费的品牌和公司。 \n\n用户开始喜欢美的、精致的、有格调的消费品牌，在用户面前塑造有个性、差异化、标签感明确的旅行品牌成为新旅游公司的一个努力方向。
    \n\n一个没有定位、缺少标签的旅行公司很少被用户记忆、传播和推荐，即便携程，也很少有用户向周围推荐自己的预定来自携程，但会有用户向朋友推荐自己的旅行来自“**旅行，他们家还不错，线路都是自己设计的，玩的也很开心”。
    \n\n你细心地看，尤其在上海这样的城市，很多新出来的旅行公司只要出现的时候都是伴随着定位和价值观的，“我做什么的，什么人该关注”非常明确。 \n\n没有特点和个性，缺少标签和坚持，很难被吸引和喜欢，品牌要给到用户方便的记忆、传播和推荐，你希望用户在向别人介绍自己时说什么？
    \n\n“他们，我也说不清楚，你看看吧” “他们专门做老年人旅行的，比较不错，可以看看公众号” “他们做团建旅行的，经常带不同公司团建” “他们做中产旅行，价格比较贵，但是线路确实玩的好”
    “他们做户外旅行的，年轻人很多，线路很小众，都很好玩” ..... 这是 5%带来的传播。 \n\n02 保证交付水平 \n\n一个能做全部人全球旅行生意的公司是怎么做的？
    \n\n上一秒问了用户想去南极，下一秒开始在朋友圈和微信群询问，哪家可以做南极？ 拿到行程和方案以后，对价格稍加修改，丢给用户。 \n\n如果用户有反馈和持续咨询，一段长时间的对话搬运就开始了。
    \n\n类似这样核心领域以外的业务，旅行公司从中提供的专业价值是非常薄的，整体的交付水平都会不可控，把用户体验交给了运气和随机。 \n\n在今天全面互联网时代的商业经营中，大部分、普通人、小公司想要长久、健康地经营下去，除了做用户心中“一直的好人”是没有其他选择的。
    \n\n坏的比好的传播的更快，超出能力范围以外的业务也会超过自身的服务交付水平，给经营留有很大的风险和缺口，用户交给你的是信任，留给你的是未来，遇到能力范围以外的钱，更要慎重。
    \n\n真诚不一定是真的善良，真诚可能是洞察以后的主动选择。 \n\n这是 5%带来的健康。 \n\n03 用户不是上帝：体面、尊重、认可 \n\n商业的本质是价值交换，用户选择你而付费，是因为你提供了匹配价格需要的价值，是基于需要、认可、交付和满足，始于用户需求、基于认可选择、实际交付完成后满足需求，这个过程双方的地位应该是平等的。
    \n\n实际中为什么常常会有不平等，或是甲方心态？ \n\n很多时候是用户的思维定势，花钱的一方很容易把自己当做甲方，用户的心态无法改变。 \n\n但也有很多时候，是自己的价值积累的还不够，导致用户的不理解、不尊重。
    价值不够，用下低 3 分的态度来补，把用户抬高，把自己降低。 \n\n用户的甲方心态无法改变，但可以选择，好的品牌都有保持自己选择用户的权利。 一个付费用户的不尊重，过于甲方心态的高姿态，应该更早地沟通和拒绝，不应该是唯唯诺诺，一切照办。
    \n\n有的流量不要你，有的流量你也不要，做经营需要赚钱，也需要体面、尊重和认可。 这是 5%带来的从容。 \n\n04 专业、细分、聚焦 \n\n小公司的生存逻辑应该是什么？
    \n\n标签感极强、效率极高，像是一根伸向市场细长的针。 \n\n我有一个朋友，他是户外旅行创业者，云南的雨崩村，今天在旅行市场的体量不算很大，7 年前的一家户外地接社进入雨崩，到今天做到了这个目的地体量的绝对第一，在丽江、香格里拉、雨崩村自建酒店，因为发团高频，可以驻村设置摄影师为用户拍照，建立自己的全职领队，从布局资源到用户体量，从服务交付到闭环管理， 竞争力和标签慢慢显现。
    \n\n中国旅游经过过去 20 年的发展，粗放的经营机会已经变得很少了，只有专业、细分、聚焦才能做出明显的差异化和用户体感。 \n\n这是 5%带来的专业。
    \n\n05.5%的生意小吗？ \n\n5%是主动放弃，主动放弃的是每个近在眼前的订单诱惑，但放弃掉相互不符合的人，也会吸引来符合定位的人。 \n\n看得到的是眼前的失去，看不到的是未来的增长。
    \n\n前提是有明确的标签和差异，和足够的专业。 \n\n我们自己今年成立了新的品牌来做全网的搜索流量：即刻下单，本来出发点是做旅游业务的，但是做着做着找过来的人就多了。
    \n\n服装能不能做？牛肉能不能做？美妆能不能做？ \n\n说实话，我非常心动。 \n\n但是有一天爱人跟我说，你真的要开启这么多业务，你都做的好吗？要投入多少资源进去，会不会丢掉你旅游的地位和产出？
    \n\n一下午我想了很多，决定在旅游流量业务没有做的很扎实的情况下，不轻易开启新项目，包括公司已有的 100 多万收益的广告业务，我也做了暂停。 \n\n这是小公司创始人的难处，精力放在哪里，业务产出就在哪里。
    \n\n贪多、不专注可能会丢掉基本盘。 \n\n但是回过来，仅仅旅游业务的空间，其实已经够我挖很久了。 \n\n每次走到不同的城市，都能发现这个城市还有人做这个的做那个的，做的都很好，5
    个人 1000 万-2000 万的年交易，对于大部分、普通人、小公司，这个生意小吗？ \n\n这是 5%带来的规模。 \n\n06 当成交和不成交的客户都说你好
    \n\n前段时间也看到小马宋老师的分享，说的很好： 拒绝客户，并不是不想做生意。而是保留机会，保住口碑，当你成交和不成交的客户都会说你好的时候，你的业务反倒会慢慢变好。
    \n\n好的生意是相互认可后的相互成全。 \n\n有的流量不要你，有的流量你也不要，做经营需要赚钱，也需要体面、尊重和认可，最后坚决保留自己的选择权，不做生意中的乙方。
    \n\n对于今天大部分、普通人、小公司来说，经营逻辑变成了做好 5%的专业领域，选择 5%的目标用户。 \n\n5%的主动选择可以带来传播、健康、从容、专业和规模。
    \n\n【昵称】许义 【所在地区】上海长宁 【公司/Title】谱见文旅 创始人 投资人 【自我介绍】 新媒体创业者，《新旅游》《小红书变现 7 堂课》作者
    \n\n【其他龙珠文章】 1.《人生辛苦的价值》 2.《小红书 3 天新号粉丝破千的运营方法论》 3.《通过低成本搭建旅游行业的供需匹配系统，实现稳定月入
    5W》 \n\n-----end----- \n\n我向亦仁提个问题不知道是不是合适：生财应该是离钱很近的人，无论更早看到机会、资源链接，还是自身洞察找到优秀团队，亦仁有面对大量生意机会而自己无法一一去做的苦恼吗？
    生财对这个问题的思考和结论是什么？ \n\n评论区： \n\n亦仁 : “我向亦仁提个问题不知道是不是合适：生财应该是离钱很近的人，无论更早看到机会、资源链接，还是自身洞察找到优秀团队，亦仁有面对大量生意机会而自己无法一一去做的苦恼吗？
    生财对这个问题的思考和结论是什么？” \n\n不苦恼，以下是我的几点思考。 \n\n1.  生财不以赚最多钱为第一目标（当然赚到钱也很重要），我希望长期有一件事可以沉浸其中，体验各种深入之后的感受，而不是不断的体验从
    0 到 1； \n\n2.  任何一个业务，都有生命周期。背后是需求的迭代，长期看，几乎所有人都希望赚到更多钱，这是一个大刚需，永远不会消失，慢慢做好好做，用好产品满足这个需求，未来机会还是不小的。满足赚钱需求的产品和团队，整体上属于大公司看不上看不见，小个体跟不上做不到，生财在里面有一些生存优势；
    \n\n3.  我的能力圈和性格更适合做社群产品，其他业务也可以做，也能赚钱，但可能只能做到中上水平，做不到行业前几名； \n\n4.  机会是涌现出来的，不要轻易的把自己
    allin 到一个具体的业务，而是努力去建立一个生态或平台，让各种机会涌现价值被创造，然后努力设计一个好的机制，可以让生财有术参与到新机会的价值创造和分配中；
    \n\n5.  帮别人赚到钱这件事的意义感和成就感非常强，特别是新人，他们赚到非工资外的收入，往往是逆天改命的。 东山老师 : 5%都很多了，中国那么大，真正能把
    1%的生意做好，已经蛮赚钱的了[呲牙] 值得 : 大佬，我总觉得自己抓不住重点，该怎么办[流泪] m : 收藏了 很牛 郑玉斌。 : 确实，生财的机会太多了，而且很多项目和自己本身的资源是可以匹配的，但是自己无法下场做。自己不下场做，又担心没有结果，也是很苦恼。
    零下 4℃ : 做自己喜欢，擅长，有沉淀积累的事情 MD : 或许是因为有了生财这件必须专注和做好交付的事情 孟不惑 : 感谢大佬分享[抱拳]给我的启示是：面对大量的选择和机会，还是要首选评估自己的真实情况，承接能力，去做自己能力范围内可以做的最好的事情，一旦完成
    0-1 不断优化不断深挖。少则多，多则惑啊 大祝 leo : 受教了"'
