  content: '"# 生财有术赚钱体系梳理（新人启航指南）\n\n> 来源：[https://trvzn3ack7.feishu.cn/docx/EnMvdgCPboEplRxJPdXcMUrznbf](https://trvzn3ack7.feishu.cn/docx/EnMvdgCPboEplRxJPdXcMUrznbf)\n\n#
    前言\n\n作为刚加入星球的新人，先简单做下自我介绍以及为什么想写这篇文章\n\n## 自我介绍\n\n我是老猪，19 年进入跨境电商 Shein 做产品经理，21
    年在一家出海企业做千万 DAU 量级的短视频和工具产品，现在出来专注搞钱\n\n## 为什么写这篇文章\n\n近期刷了 N 篇精华、N 个风向标、N 个项目帖子后，情绪亢奋，仿佛已经财富自由。\n\n但冷静下来，会发现尽管输入了很多信息，但是这些信息是相对碎片化的，并没有融入到自己的体系或方法论内，那这些宝藏信息相当于白看了。希望能够发挥自己比较强的分析和梳理能力，建立一个初版的关于赚钱的体系，既可以帮助自己梳理和建立起一个相对全面的认知，也可以给有类似需求的圈友提供一些体系参考～\n\n————————————————————————现在进入正文——————————————————————————\n\n#
    1.赚钱的本质是什么？\n\n*   《学习和赚钱是什么关系？》：「赚钱」是一个结果，是你做一件事情能得到的结果\n\n*   《赚钱的本质是什么》：我们谈到所谓赚钱，其实核心思想是，交易，只有交易才能给你带来金钱。交易的核心，不外乎两点，第一，你掌握的资源；第二，你所能找到的买家，也就是愿意为这个资源付费的人。\n\n解读一下：在整个社会或市场内，存在许许多多的需求方，他们在不同平台不同场景下遇到了多种问题或产生了多样诉求，这时候如果我们能够找到他们，为他们提供解决问题的方案，无论这个方案是实体产品还是虚拟服务，用户愿意为这套解决方案买单，我们就能赚钱。\n\n因此，里面存在几个非常重要的关键词，它们直接决定了我们赚钱的整体思路\n\n*   用户：你会逐步发现，整个社会并不是只有简单的圈子划分，比如男生、女生，而是呈现非常细颗粒度的圈子或群体，这种圈子是通过多个维度进行组合的。比如平台维度有小红书/知乎/抖音/微博等，比如学历维度有小学/中学/大学，比如职业维度有应届/公务员/产品经理/设计师等等，多个维度的组合会圈出非常多的用户群体，这就是我们日常提到的垂直用户群或细分用户，需要评估这部分用户的体量，来评估你服务的用户规模有多大，是一个很小众的群体，还是一个比较广泛的群体\n\n*   需求：需求依托于具体的场景。以在校男大学生为例，他们在不同场景下会产生不同的问题，比如在点外卖场景，觉得钱包吃紧，希望能领下优惠券减几块钱；比如在写论文时需要查重，但是官方推荐的查重服务太贵了，希望能有便宜的查重服务。这就是我们日常提到的场景和需求，各位可以思考下你们提供的产品或服务，目前是在解决哪类人群的哪类场景下的哪类问题，评估需求的刚需与频率，如果发现回答不上，那最好先停止一下手头的项目\n\n*   找到：上面的这些用户群，分散在不同的地域与平台内，我们需要找到这类人群会在哪些地方活动，并且进行触达、联系和引流，我们平时提到的钩子引导等手段都同属于这类\n\n*   方案：当我们清楚知道用户有什么问题后，我们需要为我们的用户提供一套解决方案，这种解决方案包含产品类（包括实体和虚拟）和服务类（包括线上和线下），一个实体物体，一篇文章，一个工具，一项服务等等都是解决方案\n\n*   买单：当用户愿意为你提供的解决方案付费时，这就是变现或赚钱的最后一个节点\n\n#
    2.赚钱的要素组成是？\n\n沿着赚钱的本质是什么，我们将一门赚钱的生意或模式拆分成以下几个要素\n\n| 序号 | 要素 | 说明 |\n| 1 | User
    Need | 用户需求，来源有非常多种 |\n| 2 | Product Solution | 产品服务（提供产品能力或相关服务给用户），在我们设计产品时是有一些抓手进行参考与设计的：
    |\n| 3 | User Growth | 用户增长（精准找到这群用户进行营销与引流） |\n| 4 | Monetization | 商业变现（采用相关策略与手段转化用户盈利），只有到达这步产生交易才有所谓的赚钱，我们可以列举一条公式：利润
    = 用户规模 * 客单价 - 成本，商业模式取决于你的客单价是由整个链路上的哪个角色进行支付，因此构思变现模式本质上在思考流程上各个角色如何交互 |\n\n1.  自己：我们日常会遇到一些问题，可能也会有很多人遇到一样的问题，大部分人解决完问题就结束了，不会把解决问题的思路进行总结归纳与输出，但这些都是很多人需要的，可以用来赚钱或者引流。可以细心观察一下自己，今天遇到什么困难和问题了，以及你是如何解决的，并且观察是否有人也在提供解决问题的思路，以及你是否有入场的可能性\n\n1.  用户：你想要服务的用户群体，在许多平台会产生许多显性或隐性的反馈，比如小红书、贴吧、豆瓣、搜索引擎等等，用户会产生点赞、评论、关注、搜索等行为。有人的地方就有需求，人聚集在哪里，需求就聚集在哪里。比如用户会在小红书评论区有反馈，此处见《在小红书上，如何挖掘出1000个适合普通人的赚钱项目》；比如用户在搜索引擎搜索长尾关键词，此处见《通过Google挖掘细分市场的一个案例》。比如用户在知乎上关注最多的
    1000 个问题详见《从0到0.1，如何从知乎神贴找到创业机会》。你会发现用户通过自己的行为将自己的痛点呈现在了这些平台内，彩蛋：当你想查某个平台上用户相关行为数据比如搜索了什么、评论了什么等等，你会发现这也是个需求，市面上也有不少相关的产品和服务\n\n1.  竞对：留意竞争对手的动态，当竞争对手提供了某些新服务或新能力时，需要尝试进行分析与归因，而不是只是一昧抄作业，抄作业也要抄对逻辑\n\n1.  平台：\n\n1.  平台规则：深入研究平台规则，比如平台有哪些规则、哪些活动、哪些玩法等等（找到需求/机会）《一天赚1000万+的杀手级淘宝客是怎样炼成的？》
    《如何通过游戏信息差获利》\n\n1.  平台能力：通过一些大网站的开放平台，比如Google或者Amazon的云平台，开放了很多技术接口，如图像识别、翻译、鉴黄、语音文字转换等，以可实现为出发点，可以找到不少思路。《如何发现10个高质量的赚钱套路》\n\n1.  广告：如果你在抖音、百度等平台看到某些广告的投放，也是一种收集需求的来源。曹大的文章加案例讲的很清晰，大家可以去看曹大的文章\n\n1.  用户是否可拓展：比如无网用户的人均消费水平超过
    4/5G 并且并肩 WIFI，是否可以将这种能力迁移到 4/5G 用户甚至 WIFI 用户呢？比如 instagram 支持下载，是否可以在除了英文站点外提供这种服务呢？比如在小红书提供学习资料引流，是否可以除了学生还可以向父母辈提供这种服务呢？\n\n1.  场景是否可拓展：\n\n1.  需求是否可拓展：比如下载
    tiktok 短视频，拆分出 3 个元素【下载】【 tiktok】【短视频】\n\n1.  下载：动词\n\n1.  前缀副词：批量、快速、无水印、安全等\n\n1.  动词替换：解析、存储、上传、点赞、关注、评论等用户动作行为\n\n1.  Tiktok：名词\n\n1.  前缀形容词：更多的、更好的、更快的等\n\n1.  名词替换：Youtube、instagram、facebook、抖音、微博、小红书等\n\n1.  短视频：\n\n1.  名词替换：图片、字幕、视频、TED、学习资料等\n\n1.  变现是否可拓展：这位小红书博主变现方式有三种：接品牌广告、引流公众号拉升推文曝光赚广告费、网盘APP拉新返佣，比起好些圈友单一的引流微信卖学习资料，有着更强的变现能力\n\n![](img/b3a8d1d8776a647f6d5abbfba5752108.png)\n\n1.  以小红书资料引流为例，引流用户到私域，引导用户购买更多资源或者相关课\n\n1.  以
    Midjourney 定制头像为例，引流用户到微信，用户提出头像诉求并付费\n\n1.  以抖音小说推文为例，在抖音投放知乎小说内容，并且引流用户到知乎付费小说，由平台支付佣金费用\n\n1.  以小红书资料引流为例，部分博主会提供网盘链接给用户，用户根据这个链接在网盘进行注册，博主会向网盘平台获取拉新费用；\n\n1.  以部分平台上广告投放为例，用户对广告产生曝光、点击等行为后，平台赚取广告主的广告费用；\n\n#
    3.为什么你能够赚钱\n\n## 3.1 能够赚钱的一些原因\n\n赚钱的本质是自己卖了一个东西给别人，那为什么别人要从你这里买呢？《肿安娜的生财思维之路》\n\n|
    原因 | 分析 |\n| 用户没有接触到其他产品服务或解决方案 | 知：不知道其他地方有产品服务（信息不对称：没想过拼多多有很多很便宜的学习资源） |\n|
    用户有接触对比其他产品服务或解决方案 | 感性：用户相比其他人更加愿意相信你（IP 信任度：我选择了 Henu 老师的专栏而非其他人） |\n\n*   不想搜：用户懒得去搜索其他产品服务（人性懒惰：减少很多行为成本如搜寻、鉴别、比较）\n\n*   搜不到：\n\n*   搜索能力不足：缺乏较好的搜索能力导致搜不到（信息不对称：不知道如何搜索电子书）\n\n*   确实搜索不到：市面上解决该问题的产品服务很少（产品稀缺性：比较少人在做这件事）\n\n而以上的本质，是提供了在同等需求下提供了更多的价值，帮助用户降低了更多的成本，因为一个用户买单的路径是十分长的，每个环节都会存在成本，如果你能够为用户降低成本，你就比起别人天然具有优势\n\n1.  产生想法（搜寻成本）\n\n1.  收集信息（鉴别成本）\n\n1.  方案评估（比较成本）\n\n1.  做出决策（议价成本，决策成本，支付成本）\n\n1.  执行履约（时间成本、精力成本）\n\n##
    3.2 关于信息差的思考\n\n关于信息不对称这类信息差生意，有几个思考\n\n1.  整个社会就是一个个大大小小的圈子，圈子之间的信息流通难度是大的，所以做信息流通这件事情是有价值的，信息差里的“差”，就“差”在这里。另外这里的圈子是基于多个维度进行组合的，如基于「平台」、「性别」、「年龄」、「职业」等等维度会划分成一个个极小的圈子或用户群
    《花爷对信息差的思考》\n\n1.  如何用过往的工作实践解释「信息差」，用户群 A 与用户群 B 具有同样的需求，目前用户群 A 中已经具有对应的解决方案，而用户群
    B 不具有解决方案或缺乏搜寻解决方案的意愿与能力时，这时用户群 A 的解决方案就是「信息差」。本质上就是你识别到不同圈子或用户群有共同的诉求，但其中一方不具有解决方案时，将另一方的解决方案迁移。这时候信息差生意就是
    《花爷对信息差的思考》中提到的跨越圈层与搬运方案。\n\n1.  信息差生意赚的是先行优势，信息差间存在阶梯，门槛越高，壁垒更坚实，收益天花板更高，竞争更少，比如杀手级淘宝客《一天赚1000万+的杀手级淘宝客是怎样炼成的？》
    。信息差门槛如果较低，会面临份额被一步步蚕食的可能。前期验证后，中后期需采取批量账号模式，快速占据空间和赚钱。\n\n1.  如何获取信息差：一旦深入熟悉某个平台规则、某款游戏玩法、某个业务模式或者某类人群等，会逐步发现很多信息差。如何获得更深的信息差，那就是不断深入研究平台、研究用户或者对一样事物研究到极致。比如杀手级淘宝客深入研究淘宝联盟规则找到机会点赚到
    1kw，比如有个博主知道小红书要扶持学习类账号《【学习方法博主】小红书三个月涨粉17W，变现10W+，我做对什么？》，比如 Z 在深入抽奖时发现可以给高级玩家提供代抽服务（官方没有保底但他提供
    1500 代抽 SSR），可以给普通玩家提供抽奖经验攻略（20一份赚到20w）《如何通过游戏信息差获利》\n\n1.  我们往往会将一个项目看得过于表面或者想得过于简单，看不到一个项目背后的挑战与难度，正如有人说过：在自己不擅长的领域里，因为只看到了写皮毛，就觉得很简单，自己完全可以。信息差生意并没有想象中这么简单，贯穿了对信息的发现、甄别、分析、执行的环节，需要具备多方面的能力：信息收集能力决定你是否能看得见这个信息差、信息分析与判断能力决定你是否会采用这个信息差、执行能力决定这个信息差的发挥程度，里面的每项能力又可以细分出更多专业能力\n\n1.  首先你需要能够留意到圈子间的信息差，这一点本身就不容易能留意到，需要建立在你对多个圈子间具有一定的敏锐度，比如不泡在小红书和即刻两个圈子内，你很难想象
    ChatGPT 和 MidJourney 注册教程在小红书这么火；不泡在生财有术圈子，你很难想象身边这么多人不知道有什么可以赚钱的方式；不泡互联网圈子，你很难想象一些热点在其他圈子内其实不温不火\n\n1.  其次当你掌握这个信息差时，你需要找到渠道能够触达到这个受众圈，无论是在小红书、知乎还是抖音上做内容投放，还是在百度上做广告投放，需要你掌握如何找到用户的能力\n\n1.  当你能够找到用户的时候，你需要将你的用户进行转化来成交，这时候你需要提供对应的服务和产品，并且让你的用户愿意买单，这时候又需要你有对应的引流、转化和交付的能力。\n\n#
    4.如何找赚钱方向？\n\n如果此篇文章看到这，你还产生了这个疑问，可以回到【赚钱闭环要素】内看下 User Need 内容，赚钱的方向或起点在于找到用户真实需求\n\n#
    5.如何筛选赚钱方向？\n\n当我们已经有一些赚钱的方向了，还需要有一个筛选的环节，将与自己不契合的项目给筛选掉，以下是一些筛选方式\n\n*   p0 对受众产生价值：一切项目建立在这个底层原则上，不废话多说\n\n*   p0
    进入门槛成本不高：对于大多数的普通人来说，可以慢慢一点点投入，尽量用低成本做好验证和投入\n\n*   p0 兴趣能力圈范围内：基于我喜欢（兴趣）、我有能力（能力天赋、现有资源）来评估，不是任意一个项目都适合
    《做自己擅长的事，把技能树打通，然后再去赚钱》。假设目前基于兴趣 + 能力 + 资源 + 用户需求找不到合适的项目，就寻找自己可以做的项目，为下一份项目打好基础做铺垫，这是一个打怪升级的不断提升能力与资源的过程，后续自然能够有更多基于以上公式挑选项目的资本，且随着项目的积累，你也会逐渐突破现有有限的认知，找寻到自己最得心应手或者天赋点\n\n*   p0
    收益天花板较高：聊聊「这个事情天花板有点低，不想碰」，\n\n*   马云爸爸曾经说过一句话，对于很多机会，我们是「看不见、看不起、看不懂、跟不上」。机会出现了，如果用「天花板低」做出判断，看不起这个机会，而拒绝开始行动，那么后面可能真的是「看不懂」、「跟不上」。
    先把第一块钱赚到，上车再说，不要看不起任何业务。\n\n*   天花板并不是静态不变，而是在解决具体问题的过程中，随着产生新的认知而动态发生变化。当你在其中解决了一些问题后，可能会发现更多的痛点，从而找到更多需求和市场，因此收益天花板也在不断上移。\n\n*   p0
    合法正规非灰产：生财有术上这么多项正经的生意，咱们还是低风险做一些正当的生意吧\n\n*   p0 顺应平台的规则：时代红利不是每个人都能赶上这趟周期，但是平台红利还是大多数人可以参与的，比如抖音或小红书每次需要扶持某个类目或者某项活动时，这不就是每个人可以入局的吗\n\n*   p1
    能积累复用资源：每个项目都不是所谓的一次性项目，我们需要从项目中获取到一些可复用的资源比如用户、比如人脉、比如某项能力等等 《如何分析一个互联网项目的可行性？能否值得去做？》，否则每次项目都是意义上的从
    0 开始，需要用复利的视角去看待你要做的项目\n\n*   p1 符合时代的趋势：要在正确的时间用正确的方法做正确的事情，比如自己需要保持每天对 AIGC
    热点的输入\n\n# 6.赚钱内必备的一些能力\n\n## 6.1 项目失败的一些原因\n\n勇气不是毫无准备的冒险，它是基于一定确定性基础上通过对未来风险的驾驭来博取收益。项目失败的原因一般有几种：\n\n*   不懂自己：没有结合兴趣与能力来评估项目契合度
    → 深度剖析自己见下方\n\n*   不懂用户：纯粹 YY 而没有思考用户实际上想要什么 → 深入了解用户需求\n\n*   不懂平台：不了解各个平台的调性、规则与相关政策
    → 深度了解平台机制\n\n*   不懂借力：坚持自己试错，不找标杆学习 → 高度关注竞争同行\n\n## 6.2 成功项目的底层能力\n\n*   目标层：OPEN
    AI 的创始人 Sam 说自己认识的人，都会花很多时间想明白要专注在哪些事情，而且他们的结果都很不错。做正确的事比工作时间长短更重要。多数人是将时间花在了无关紧要的事情上。一旦你想明白了该做什么事情，就快速行动起来，把精力集中在少数几件最重要的事情上。\n\n*   强目标导向型：目标是什么？目标间的优先级如何？目标如何量化？\n\n*   关键事项意识：目标实现与否需要哪些关键策略实现？关键策略之间的优先级如何？\n\n*   计划层：是否具有明晰的计划帮助你推动整体的落地。关键策略可以划分成多少阶段？每个阶段需要完成哪些事项？每个事项对应的时间节点如何？\n\n*   执行层：看准机会后不要再有犹豫，全力投入，如当初做项目时深夜仍然在做数据分析和复盘\n\n*   强执行闭环圈：是否大胆假设与快速验证？事项策略是否达到预期？哪些动作或事项需要进行优化？看到了哪些机会点？\n\n*   定期回复复盘：设定以周/月或者阶段式的结果回顾与复盘：目标是否需要调整？目前进展是否与预期符合？关键策略或事项是否需要调整？\n\n*   情绪调节能力：在许多执行的空窗时刻，我们会由于没有即时反馈陷入自我焦虑的困境\n\n*   持续耐心，耐住自我焦虑\n\n*   不断前行，快速更新认知\n\n*   坚持信念，持续勇往前行\n\n*   保持空杯心态：承认自己的无知、傲慢、焦虑等，一旦承认自己只是一个普通人、一个小白等，自己就会卸下许多所谓的身份袱、负担，反而能够不断精进自己，往前更能大步走\n\n#
    7.关于赚钱过程中一些问题\n\n## 7.1 这个事情天花板有点低不想碰\n\n可以结合【5.如何筛赚钱方向】的「收益天花板」来思考\n\n## 7.2
    这个事情已经有人做过了\n\n当你所要做的事情已经有竞争对手入局了，本质上你是在思考你是否可以在竞争格局中还能赚钱，这时候可以从几个维度去进行评估是否还能入局\n\n1.  宏观视角分析：行业规模与阶段、行业终局与行业产业链\n\n1.  行业规模与阶段\n\n1.  行业市场规模越大，理论上会吸引众多的竞争者，竞争也会随之激烈\n\n1.  行业发展在不同阶段的竞争强度也不一样：在高速增长期，哪怕是小玩家还是能够分一杯羹；在增长趋于稳定时，就是比拼更加精细化的运营，没有强竞争力或低效率的玩家就会被淘汰，比如
    ofo\n\n1.  如果行业处于高速增长期，即使领先者拥有可观的份额，依旧是危险的，因为每年释放出来的空间很大，而当领先者只是维持原样时，就会开始被挤占份额。\n\n1.  行业终局：竞争格局一般会有几种终局，我们可以根据终局的类型来分析公司活下来的概率与发展空间\n\n1.  第一种：强马太效应导致的一家独大。
    比如腾讯在社交领域，用户这方面所有需求几乎都能被满足，没有太大动力选择第二家的产品。\n\n1.  第二种是双寡头或者多寡头的平衡。比如视频行业的格局，最初有几十家视频网站，后来像淘汰赛一样，6进4，4进3，3进2。这种行业通常有一定的规模效应，领先者有一定优势，但也需要靠不停地投入资源来确保地位。\n\n1.  第三种是相对分散百花齐放或者各领风骚数年的行业。
    比较典型的就是内容生产行业，如游戏、影视剧等。这种行业本身门槛未必很高，也通常没有网络效应或是规模效应，甚至规模到了一定程度后，管理成本会比收入的增速更快，所以没有办法做到赢家通吃\n\n1.  综上两点：当我们要考察所处的行业竞争格局的时候，需要从以下几个角度去分析：\n\n1.  第一，这个行业的规模能够有多大？\n\n1.  第二，这个行业进入到了什么阶段？是供不应求？还是供过于求？\n\n1.  第三，这个行业的终局会走向哪种？向垄断、寡头还是充分竞争的平衡状态演变？\n\n1.  第四，这个行业如果竞争态势已经相对平衡，潜在的打破现有平衡的因素会是什么？\n\n1.  理解产业链博弈：将上下游全链路都画在一张图上，分析几个问题\n\n1.  目前我们所处的产业链的每个环节是什么？\n\n1.  整个产业链每个环节的拥挤程度如何？进一步看，哪个环节更有议价能力？\n\n1.  微观视角分析：用户需求、解决方案、解决方案的能力\n\n1.  用户的需求是否被满足好？现有竞争对手提供的解决方案是否够好？\n\n1.  自己是否有一定的能力提供更好的方案\n\n如果从以上
    2 大视角去分析，目前要做的事情，在当前阶段自己还能有一些可接受的收益，那就是可以入局\n\n## 7.3 这个事情没什么壁垒\n\n这个可以结合这个可以结合【3.2
    关于信息差的思考】来思考和 【7.2 这个事情已经有人做过了】来思考\n\n## 7.4 这个事情不可持续\n\n这个可以结合【3.2 关于信息差的思考】来思考\n\n#
    最后\n\n以上是目前 1.0 的赚钱体系，如果对圈友有一点点作用，可以给我点赞评论反馈一下下～\n\n有新认知会不断在这篇文章上做更新，祝愿我们大家都能赚到第一桶金，一起生财有术！\n\n有想法或机会都可以互相聊聊～"'
