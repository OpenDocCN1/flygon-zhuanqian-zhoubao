    type: function
  - index: 2
    id: call_1c06d43aedf644fc8d58d2fb
    function:
      arguments: '{"paper_name": "20230418_088", "paper": "永远只做5%的生意。定位决定选选择，5%带来的传播。保证交付水平，5%带来的健康。用户不是上帝：体面尊重认可，5%带来的从容。专业细分聚焦，5%带来的专业。5%的生意小吗：5%带来的规模。当成交和不成交的客户都说你好。5%的主动选择可以带来传播、健康、从容、专业和规模。放弃不符合定位的用户，吸引符合定位的人。用户心态无法改变但可以选择，好的品牌有选择用户的权利。"}'
