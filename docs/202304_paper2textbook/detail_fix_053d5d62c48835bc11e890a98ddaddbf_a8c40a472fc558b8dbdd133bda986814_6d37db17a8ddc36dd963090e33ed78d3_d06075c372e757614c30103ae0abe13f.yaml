  name: AI 协作翻译与内容生成工作流 —— Prompt 工程化落地
  points:
  - '**为什么需要这个概念？**'
  - '- 翻译资源稀缺、术语不一致、多语言文案生产周期长，传统人工流水线难以支撑高频迭代'
  - '- LLM 具备多语言能力、结构化输出能力、代码理解能力，可作为翻译/文案/代码生成的「副驾驶」'
  - '- 需要将 Prompt 工程化：版本管理、参数化、少样本微调、RAG 增强、输出结构化解析、质量红线'
  - '**核心定义**'
  - '- Prompt 分层模板体系：系统提示词（角色/约束）、任务提示词（输入/输出格式）、少样本示例、RAG 检索上下文'
  - '- 子任务角色定义：翻译官、术语学家、无障碍专家、QA 工程师、DevOps 工程师'
  - '- RAG 知识库：术语库 TBX/CSV、组件库 Storybook 文档、WCAG 规范、历史 PR 修复记录、团队编码规范'
  - '- 质量红线：LLM 输出必须经人工复核/自动化回归测试通过方可合并，建立审计日志与追溯机制'
  - '**关键性质**'
  - '- 结构化输出：强制 LLM 输出 JSON/Markdown/Diff 格式，便于程序化解析与补丁应用'
  - '- 少样本微调：收集高质量「输入-输出」对，定期微调或 Few-shot 引导，提升垂直领域准确率'
  - '- 动态上下文构建：根据变更文件类型（翻译键/组件/页面），自动检索相关术语、规范、历史决策注入 Prompt'
  - '- 成本控制：Token 预算估算、模型分级调度（简单任务用小模型）、缓存命中复用'
  - '**典型例子**'
  - '- 翻译提取 Prompt：`角色：资深本地化工程师。任务：从代码中提取待翻译字符串，生成 ICU MessageFormat 字符串，输出 JSON。约束：保留插值占位符、复数/选择语法、嵌套结构。少样本：[示例1,
    示例2]`'
  - '- 术语校验 Prompt：`角色：术语学家。任务：对比源/译术语，判断语义一致性，输出冲突列表及修正建议。RAG：术语库 CSV + 历史决策记录`'
  - '- 无障碍审查 Prompt：`角色：无障碍专家。任务：分析组件代码，输出 WCAG 违规项、ARIA 缺失/错误、键盘交互缺口、修复代码补丁。RAG：WCAG
    2.1 AA 规范 + 组件库 APG 文档`'
  - '**边界条件**'
  - '- LLM 幻觉风险：必须双轨验证（人工+自动化测试），禁止直接合并 LLM 生成代码'
  - '- Prompt 版本漂移：需纳入 Git 管理，配套回归测试集，定期评估 Prompt 效果并冻结版本'
  - '- 多语言/多框架/多平台适配：Prompt 模板参数化（目标语言、框架、平台），维护差异化片段库'
  - '**素材溯源**'
  - '- 来源：`20230418_036.md`、`20230418_039.md`、`20230418_041.md`、`20230418_044.md`、`20230418_046.md`、`20230418_106.md`'
  - '- 角色：`improve`，补充 AI 赋能 i18n+a11y 的提示词工程与自动化工作流'
