life_analogy:
- 想象前端应用是一家**连锁跨国餐厅**：
- '- **i18n 方案选型** = 选择**菜单制作方式**：'
- '  - 运行时库 = **现点现翻**，服务员随时能改菜名，但厨房（浏览器）负担重、出菜慢'
- '  - 编译时库 = **总部预印好多语言菜单**，分店（用户）直接拿对应语言版，出菜快、不易错'
- '- **ICU MessageFormat** = **通用的菜品规格书**，能自动处理“1 份/2 份/5 份”（复数）、“素/荤”（选择）、嵌套套餐，避免人工写
  if-else 出错'
- '- **翻译管理流水线** = **总部与各国分店的自动化供应链**：菜单改版（源文件变更）自动推送翻译中心，翻译好自动回流分店，术语表保证“招牌菜”全球叫法一致'
- '- **WCAG 2.1 AA** = **建筑无障碍规范**：坡道（键盘导航）、盲文标识（ARIA/语义化 HTML）、色盲友好配色（对比度）、语音广播（屏幕阅读器）'
- '- **组件库适配** = **标准化无障碍预制件**：无障碍门（Dialog）、无障碍电梯（Tabs）、盲文按钮，装修（业务开发）直接用，不用每家店自己焊'
- '- **自动化回归防护** = **每日巡检机器人 + 开业前验收**：机器人（CI/axe-core）每晚巡检坡道是否被堵、盲文是否脱落，开业前（Release）总验收，发现问题立即整改，不让顾客进店踩坑'
- '- **AI 赋能工程化** = **智能总厨 + 自动化质检员**：AI 根据食谱（Prompt）批量生产菜单（翻译/文案/代码），质检员（自动化测试）实时尝味（扫描/审计），发现异味（违规/缺键）立即下架整改，并持续优化食谱（Prompt
  迭代）'
summary:
- concept: 运行时 vs 编译时 i18n
  desc: 运行时库开发体验好支持热更新，编译时库包体积小、类型安全、首屏性能优，按场景选型
- concept: ICU MessageFormat
  desc: 国际化标准语法，原生支持复数分类、选择格式、嵌套插值，覆盖 CLDR 所有语言规则
- concept: 翻译管理工程化
  desc: TMS + CI/CD 实现源文件与翻译双向同步，术语库+机翻预译降本增效，发布门禁守住完整率底线
- concept: WCAG 2.1 AA 级
  desc: 企业级合规基线：可感知/可操作/可理解/健壮四大原则，27 条成功标准，法律风险与商业价值双重保障
- concept: 语义化 HTML 优先
  desc: 原生标签自带角色/状态/键盘交互，是无障碍地基；ARIA 仅作语义缺口兜底，滥用反害无障碍
- concept: 键盘导航与焦点管理
  desc: Tab 顺序符合视觉、模态框焦点陷阱、焦点指示器永不隐藏、跳转链接直达主内容
- concept: WAI-ARIA APG 复合组件模式
  desc: Dialog/Menu/Combobox/Tabs 等复杂组件必须遵循标准交互模式（键盘、ARIA 属性、焦点流转）
- concept: 组件库无障碍兜底
  desc: 基础设施层内置合规，业务侧开箱即用；Storybook + axe-core 每提交必扫，阻断违规合并
- concept: 分层自动化门禁
  desc: Pre-commit 轻量 lint → CI 全量 axe + i18n 完整率 → Release Lighthouse CI 综合审计，左移合规成本
- concept: 动态键与误报治理
  desc: 动态拼接键用显式常量或忽略注释，建立规则白名单，避免误报导致团队忽视门禁
- concept: 人工辅助测试闭环
  desc: 自动化仅覆盖 30-50% 规则，需月度/季度 NVDA/VoiceOver 真机实测核心用户旅程，补齐自动化盲区
- concept: AI 协作翻译与内容生成工作流
  desc: 基于角色设定、结构化 Prompt、RAG 检索、少样本微调，实现翻译/文案/代码的批量生成与质量把关
- concept: AI 辅助无障碍审计与自动化修复
  desc: 利用 LLM 理解组件语义、生成 ARIA 属性、编写测试用例、聚类误报、动态更新规则集，提升审计覆盖率与修复效率
- concept: 多模态 RAG 与跨模态检索
  desc: 攻克表格结构化解析、图表 OCR 理解、图像向量化检索，构建统一的多模态知识库检索生成管线
- concept: 边缘渲染与边缘计算部署
  desc: Cloudflare Workers/Vercel Edge/AWS Lambda@Edge 部署 SSR/中间件，地理就近渲染降低 TTFB，Edge
    KV 存储会话/配置
- concept: AI 原生应用架构
  desc: LLM 作为推理引擎/决策中枢，构建具备记忆、规划、工具使用与自我进化能力的复杂智能系统
- concept: 跨端无障碍一致性适配
  desc: Web/Native/HarmonyOS 统一无障碍适配标准，共享语义结构、ARIA 映射、焦点管理逻辑，保证多端体验一致
exercises:
- 'no': 1
  title: ICU MessageFormat 实战与类型安全
  contents:
  - 给定以下翻译需求：
  - 1. 显示“用户 {name} 有 {count} 条未读消息”，中文无复数变化，英文需区分单复数（message/messages）
  - 2. 显示“性别：{gender, select, male {男} female {女} other {其他}}”
  - 3. 嵌套：{count, plural, one {# 条消息} other {# 条消息，其中 {unread, plural, one {# 条未读}
    other {# 条未读}}}}
  - 任务：
  - 1. 用 ICU MessageFormat 语法编写对应的英/中翻译字符串
  - 2. 若使用 LinguiJS，`lingui extract` 后生成的 .po 文件中 msgid/msgstr 结构长什么样？
  - '3. 如何配置 TypeScript 让 `t(''msg.key'', { count: 1 })` 在 count 传字符串时编译报错？'
  - 思考题：
  - '- 为什么阿拉伯语需要 6 种复数形式？ICU 如何表示？'
  - '- 运行时解析 ICU 与编译时生成函数在性能与包体积上的量级差异？'
  - '- 如何设计 Prompt 让 LLM 自动生成符合 ICU 语法的翻译字符串并校验完整性？'
- 'no': 2
  title: 搭建翻译管理 CI/CD 流水线
  contents:
  - 场景：Monorepo 包含 `apps/web`（React）与 `packages/ui`（共享组件库），翻译文件分别位于 `apps/web/locales`
    与 `packages/ui/locales`，源语言 en。
  - 任务：设计一个 GitHub Actions Workflow 实现：
  - 1. 监听两个目录下 `en.json` 变更，自动推送至 Crowdin（或模拟的本地脚本）
  - 2. 定时/手动触发拉取所有语言翻译，生成包含两个包翻译更新的 PR
  - 3. PR 检查阶段运行术语一致性校验脚本（术语表 `glossary.csv`：`登录,login,sign in`），发现不一致阻断合并
  - 4. 发布前（Tag 推送）校验所有语言翻译完整率 ≥ 99%，不达标阻断发布
  - 产出：
  - '- 画出流水线阶段图（Mermaid 或文字描述）'
  - '- 编写关键步骤的 Shell/Node.js 伪代码（术语校验、完整率计算）'
  - 思考题：
  - '- 微前端子应用共享语言包时，如何避免版本不一致导致的闪烁？'
  - '- 机翻预译质量不稳定，如何在流水线中引入‘置信度阈值’自动跳过低置信度译文？'
  - '- 如何利用 LLM 进行术语语义一致性校验（而非仅字符串匹配）？'
- 'no': 3
  title: 无障碍合规自测与自动化门禁
  contents:
  - 给定一个包含以下问题的 Vue 3 单文件组件 `UserProfile.vue`：
  - '```vue'
  - <template>
  - '  <div class="card">'
  - '    <img :src="avatar" />'
  - '    <h3>{{ name }}</h3>'
  - '    <span class="badge" :class="role">{{ role }}</span>'
  - '    <div @click="edit" class="btn">编辑</div>'
  - '    <input v-model="email" placeholder="邮箱" />'
  - '    <span v-if="error" class="error">{{ error }}</span>'
  - '  </div>'
  - </template>
  - '```'
  - 任务：
  - 1. 列出该组件违反 WCAG 2.1 AA 的至少 5 个具体问题（引用成功标准编号，如 1.1.1、2.1.1、4.1.2 等）
  - 2. 给出修复后的模板代码，补全语义化标签、ARIA 属性、焦点管理、关联关系
  - 3. 编写一个 Playwright + axe-core 测试用例，自动检测该组件的无障碍违规并输出报告
  - 4. 在 GitHub Actions 中配置该测试作为 `required` status check
  - 思考题：
  - '- `role="button"` 的 `<div>` 与原生 `<button>` 在无障碍树中的差异？还需补全哪些键盘交互？'
  - '- 动态错误信息如何通过 `aria-live` 让屏幕阅读器即时播报？`polite` 与 `assertive` 如何选择？'
  - '- axe-core 无法检测的典型问题有哪些？为何仍需人工测试？'
  - '- 如何设计 Prompt 让 LLM 自动生成无障碍测试用例并覆盖 axe-core 盲区？'
- 'no': 4
  title: 组件库无障碍适配：实现一个符合 APG 的 Combobox
  contents:
  - 参考 WAI-ARIA Authoring Practices 1.2 - Combobox Pattern（自动完成下拉），要求：
  - 1. 支持键盘交互：
  - '   - 输入框：输入过滤、Enter 选中、Esc 关闭、上下键移动高亮'
  - '   - 下拉列表：Home/End 跳转首尾、Tab 移出组件'
  - 2. ARIA 属性完备：
  - '   - `aria-controls` 关联列表、`aria-expanded`、`aria-activedescendant`、`role="combobox"`/`listbox`/`option`'
  - '   - 选中项 `aria-selected="true"`'
  - 3. 焦点管理：打开时焦点留在输入框，通过 `aria-activedescendant` 操作虚拟焦点；关闭时焦点不丢失
  - 4. 封装为 Vue 3 组合式函数 `useCombobox(options, props)` 供组件复用
  - 任务：
  - '- 画出组件状态机（闭合/打开/加载/无结果）与键盘事件转移表'
  - '- 实现核心 `useCombobox` 逻辑伪代码（含 `onKeydown`、`updateActiveDescendant`、`toggleList`）'
  - '- 说明如何在 Storybook 中编写交互测试（play function）验证键盘流程'
  - '- 如何接入 `@storybook/addon-a11y` 让该组件每次提交自动跑 axe 扫描？'
  - 思考题：
  - '- `aria-activedescendant` 与 `roving tabindex` 两种焦点管理模式的优劣对比？'
  - '- 移动端 TalkBack/VoiceOver 手势操作 Combobox 时，虚拟光标与真实焦点如何配合？'
  - '- 如何利用 LLM 生成 Combobox 的完整键盘交互测试矩阵与 ARIA 合规检查清单？'
- 'no': 5
  title: i18n+a11y 综合门禁治理：误报白名单与动态键策略
  contents:
  - 背景：项目接入 `axe-core` + `i18n-ally` CI 门禁后，团队反馈：
  - 1. 第三方嵌入的地图组件（iframe）频繁触发 `iframe-title` 违规，但业务无法控制 iframe 内容
  - 2. 组件库 `Icon` 组件故意 `aria-hidden="true"`，却被 axe 标记为‘装饰性元素无需隐藏’警告
  - 3. 业务代码大量使用动态拼接翻译键：`t('error.' + errorCode)`，导致 `i18n-check` 误报‘缺失键’
  - 4. 颜色对比度违规多来自设计稿品牌色，开发无权修改，需设计侧配合
  - 任务：
  - 1. 设计 `axe-core` 配置对象，针对以上 1、2 制定规则白名单/上下文忽略策略
  - 2. 设计 `i18n-check` 配置，支持 `// i18n-ignore` 注释、常量数组显式声明、正则排除动态键路径
  - 3. 制定《无障碍/国际化违规分级与响应 SOP》：
  - '   - P0（阻断合并）：自有代码硬性违规（缺失 alt、表单无 label、翻译缺失）'
  - '   - P1（警告不阻断）：第三方组件、品牌色对比度、axe 最佳实践类规则'
  - '   - P2（技术债）：需重构的遗留模式（如大量动态键）'
  - 4. 设计月度人工测试计划模版：覆盖核心旅程、测试设备/AT 组合、缺陷记录与追踪字段
  - 思考题：
  - '- 如何量化‘门禁收益 vs 误报成本’？引入哪些指标（如：阻断真实 Bug 数 / 误报数、平均修复时长）？'
  - '- 若团队规模扩大到 50+ 人，如何避免‘门禁被绕过’（如 `--no-verify`）成为常态？'
  - '- 如何构建 LLM 驱动的误报自动分类与规则推荐系统，实现白名单的动态维护？'
- 'no': 6
  title: AI 赋能 i18n+a11y 工程化实战：Prompt 设计与自动化工作流
  contents:
  - 场景：团队希望引入 LLM（如 GPT-4 / Claude）辅助 i18n 翻译提取、术语库构建、无障碍代码审查、测试用例生成。
  - 任务：
  - 1. 设计一套结构化 Prompt 模板体系，覆盖以下子任务：
  - '   - 翻译提取与 ICU 语法生成（角色：资深本地化工程师）'
  - '   - 术语一致性校验与语义对齐（角色：术语学家）'
  - '   - 无障碍代码审查与 ARIA 补全建议（角色：无障碍专家）'
  - '   - 无障碍测试用例生成（角色：QA 工程师）'
  - '   - 误报分析与规则白名单推荐（角色：DevOps 工程师）'
  - 2. 基于上述模板，编写一个 Node.js 脚本（伪代码），实现：
  - '   - 读取暂存区变更文件 → 构建上下文 → 调用 LLM API → 解析结构化输出 → 写入 PR 评审评论 / 生成修复补丁'
  - 3. 设计 RAG 增强方案：接入团队内部术语库、组件库文档、WCAG 规范、历史 PR 修复记录作为知识库，提升 LLM 专业度。
  - 4. 制定《AI 协作质量红线》：LLM 输出必须经人工复核/自动化回归测试通过方可合并，建立审计日志与追溯机制。
  - 思考题：
  - '- 如何防止 LLM 幻觉导致错误翻译/错误 ARIA 属性进入生产环境？'
  - '- Prompt 版本管理如何与代码版本管理集成（如 Git 暂存钩子、PR 模板）？'
  - '- 多语言、多框架（Vue/React/Svelte）、多平台（Web/小程序/App）下的 Prompt 复用与适配策略？'
- 'no': 7
  title: 多模态与边缘部署场景下的 i18n+a11y 扩展实践
  contents:
  - 背景：业务拓展至多模态文档（PDF/图表/视频）、边缘渲染（Cloudflare Workers/Vercel Edge）、跨端应用。
  - 任务：
  - 1. 分析多模态文档国际化的难点：文本抽取、布局保持、图表本地化、视频字幕生成与同步。设计基于多模态 RAG 的处理管线（参考素材 20230418_038.md、20230418_074.md）。
  - 2. 探讨边缘运行时（Edge Runtime）对 i18n 运行时库的限制：无 Node.js API、内存/CPU 受限、冷启动延迟。给出边缘兼容的 i18n
    方案选型建议（编译时优先、静态字典、流式传输）。
  - 3. 制定跨端无障碍一致性规范：Web (ARIA) / iOS (VoiceOver) / Android (TalkBack) / HarmonyOS
    的语义映射表、焦点管理统一接口、测试矩阵。
  - 4. 设计一个最小化的边缘部署 Demo：包含 i18n 字典加载、无障碍路由守卫、多语言 SEO 元标签注入，部署至 Cloudflare Workers
    并验证 Lighthouse CI 分数。
  - 思考题：
  - '- PDF 复杂表格的多语言重排版如何保证语义与结构双重一致？'
  - '- Edge Runtime 下 `Intl.Segmenter` / `Intl.DateTimeFormat` 等原生 API 的可用性与 Polyfill
    成本？'
  - '- 原生端无障碍 API（UIAccessibility / AccessibilityNodeInfo）与 Web ARIA 的映射冲突如何解决？'
