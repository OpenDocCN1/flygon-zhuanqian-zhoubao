- 'no': 3
  name: 无障碍核心标准 —— WCAG 2.1 AA 级达标清单与落地执行
  points:
  - '**为什么需要这个概念？**'
  - '- 法律合规风险：欧盟《无障碍指令》、美国 ADA、中国《无障碍环境建设法》强制要求公共服务数字产品达标'
  - '- 商业价值：全球 15%+ 人口有残障，无障碍即可用性，改善 SEO、降低跳出率、扩大受众'
  - '- 技术债：事后整改成本是设计期的 10-100 倍，需建立「左移」质量门禁'
  - '**核心定义**'
  - '- WCAG 2.1 四大原则（POUR）：可感知、可操作、可理解、健壮，共 13 条准则、50 条成功标准（A/AA/AAA 级）'
  - '- 企业级通常以 AA 级为基线（27 条标准），覆盖文本替代、时间媒体、适应性、可辨识、键盘可达、充足时间、癫痫防护、可导航、输入模式、可读性、可预测、输入协助、兼容性'
  - '- 核心技术手段：语义化 HTML（原生无障碍）、ARIA 属性补全语义缺口、键盘导航焦点管理、颜色对比度 ≥ 4.5:1、文本缩放 200% 无功能损失'
  - '**关键性质**'
  - '- 语义化 HTML 优先：`<button>`、`<nav>`、`<main>`、`<h1-h6>` 原生携带角色/状态/键盘交互，无需 ARIA'
  - '- ARIA 仅作兜底：`role`、`aria-label`、`aria-expanded`、`aria-controls` 等修补非语义标签（如 `<div
    role="button"`）'
  - '- 焦点管理：Tab 顺序符合视觉顺序、模态框焦点陷阱、跳转链接、焦点指示器可见（`outline: none` 禁用需替代方案）'
  - '- 屏幕阅读器测试：NVDA (Win)、VoiceOver (Mac/iOS)、TalkBack (Android) 必测三端'
  - '**典型例子**'
  - '- 图片替代文本：装饰性图 `alt=""`，信息性图 `alt="销售增长趋势图，Q1 环比 +12%"`，复杂图表提供 `longdesc` 或可见数据表'
  - '- 表单无障碍：`<label for="email">邮箱</label><input id="email" aria-describedby="email-hint"
    required>`，错误信息关联 `aria-invalid="true" aria-errormessage="email-error"`'
  - '**边界条件**'
  - '- 动态内容更新需 `aria-live="polite"`/`assertive` 通知屏幕阅读器，避免丢失关键状态变更'
  - '- 自定义复合组件（下拉菜单、标签页、树形控件）必须严格遵循 WAI-ARIA Authoring Practices 交互模式'
  - '- 第三方嵌入内容（地图、视频播放器、广告）若不可控，需提供无障碍替代方案或豁免声明'
  - '**素材溯源**'
  - '- 来源：`PbGkdX4YVoO02mxYlYKcbgASnSg.md`，大纲第19章第3节'
  - '- 角色：`definition`，定义 WCAG 标准体系、核心技术要求与测试矩阵'
  sources:
