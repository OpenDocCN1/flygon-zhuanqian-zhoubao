- 'no': 1
  name: i18n 方案选型 —— 运行时与编译时的工程权衡
  points:
  - '**为什么需要这个概念？**'
  - '- 前端应用出海面临多语言、多地区、复数规则差异、性别语法等复杂性，硬编码字符串无法维护'
  - '- 需要在开发期（类型安全、包体积）与运行期（动态切换、按需加载）间寻找最优平衡点'
  - '- 缺乏统一标准会导致翻译键管理混乱、插值语法不兼容、ICU 语法支持缺失'
  - '**核心定义**'
  - '- 国际化方案分为运行时库和编译时库两大流派'
  - '- 运行时库：`vue-i18n`、`react-i18next`、`i18next`，在浏览器解析翻译函数与 ICU 语法，开发体验好但包体积大（~15-30KB）'
  - '- 编译时库：`LinguiJS`、`FormatJS (react-intl)`，构建期将 ICU MessageFormat 编译为原生 JS 函数，运行时极轻（~2-5KB），支持
    Tree-shaking 与类型安全键值'
  - '- 核心标准：ICU MessageFormat，定义 `{count, plural, one {# book} other {# books}}` 等复数、选择、嵌套语法'
  - '**关键性质**'
  - '- 类型安全：编译时方案可从翻译文件自动生成 TS 类型定义，拼写错误编译报错；运行时方案需额外配置插件实现'
  - '- 包体积与性能：编译时方案移除运行时解析器，首屏 JS 体积显著降低；运行时方案支持热更新翻译无需重建'
  - '- 复数/性别/选择格式：ICU 标准覆盖 CLDR 语言复数分类规则（如阿拉伯语 6 种复数形态），手写逻辑极易出错'
  - '**典型例子**'
  - '- Vue 3 + `vue-i18n@9` Composition API：`const { t } = useI18n(); t(''message.hello'',
    { name: ''World'' })`，配合 `@intlify/unplugin-vue-i18n` 实现编译时优化'
  - '- React + `LinguiJS`：`<Trans id="msg">Hello {name}</Trans>` 编译为 `msg({name})`，提取命令
    `lingui extract` 生成 `.po/.json` 翻译文件'
  - '**边界条件**'
  - '- 纯静态站点（Astro/Next.js SSG）优先编译时方案，实现零运行时开销'
  - '- 高频动态换语言、需支持用户自定义翻译覆盖的 SaaS 平台，运行时方案更灵活'
  - '- 微前端子应用需共享 i18n 实例与语言包，需约定统一键名规范与加载时机'
  - '**素材溯源**'
  - '- 来源：`PbGkdX4YVoO02mxYlYKcbgASnSg.md`，大纲第19章第1节'
  - '- 角色：`definition`，定义 i18n 方案分类、核心标准与选型依据'
