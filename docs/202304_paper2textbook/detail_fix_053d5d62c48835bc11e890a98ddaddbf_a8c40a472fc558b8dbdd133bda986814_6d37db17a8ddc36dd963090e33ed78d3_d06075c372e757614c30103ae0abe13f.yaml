  name: 多模态与边缘部署场景下的 i18n+a11y 扩展实践
  points:
  - '**为什么需要这个概念？**'
  - '- 业务拓展至多模态文档（PDF/图表/视频）、边缘渲染、跨端应用，传统纯文本 i18n 与 Web 端 a11y 方案覆盖不足'
  - '- 多模态 RAG、Edge Runtime、AI 原生架构带来新的工程化挑战与机遇'
  - '- 需要统一的跨模态、跨运行时、跨平台的国际化与无障碍工程化标准'
  - '**核心定义**'
  - '- 多模态国际化管线：文本抽取 → 布局分析 → 翻译生成 → 重排版 → 质检 → 资产产出，支持 PDF/图表/视频字幕'
  - '- 边缘兼容 i18n 方案：编译时生成静态字典、流式传输翻译片段、利用原生 Intl API、避免 Node.js 依赖'
  - '- 跨端无障碍一致性：Web ARIA ↔ iOS VoiceOver ↔ Android TalkBack ↔ HarmonyOS 语义映射、焦点管理统一抽象、测试矩阵对齐'
  - '- AI 原生应用架构：LLM 作为推理引擎/决策中枢，集成记忆、规划、工具使用，支撑 i18n+a11y 智能化运维'
  - '**关键性质**'
  - '- 多模态 RAG 检索增强：表格结构化解析、图表 OCR 理解、图像向量化检索，构建统一知识库'
  - '- Edge Runtime 限制与对策：无 fs/net 模块、内存上限 128MB、冷启动 < 50ms，选用编译时 i18n + 静态字典 + 流式渲染'
  - '- 语义映射表：`role="button"` ↔ `accessibilityTrait(.button)` ↔ `AccessibilityNodeInfo.ROLE_BUTTON`
    ↔ `Role.BUTTON`，统一交互模式'
  - '- 智能化运维：LLM 驱动的误报聚类、动态规则更新、翻译质量评分、无障碍审计报告生成'
  - '**典型例子**'
  - '- Cloudflare Workers 部署 Next.js Edge Functions：`i18n.ts` 编译时生成字典 → `middleware.ts`
    注入语言 Cookie → `app/[locale]/layout.tsx` 静态渲染 → Lighthouse CI 90+ 分数'
  - '- 跨端组件库：`Button` 组件统一暴露 `onPress`/`accessibilityLabel`/`accessibilityRole`，内部映射至各端原生无障碍
    API'
  - '- 多模态文档翻译：PDF 表格 → Markdown 结构 → LLM 翻译保持结构 → 图表 OCR 文字提取翻译 → 视频字幕 Whisper 识别
    → 翻译 → 嵌入'
  - '**边界条件**'
  - '- PDF 复杂表格重排版需人工校验，LLM 仅作辅助'
  - '- Edge Runtime 原生 Intl API 覆盖不全，需评估 Polyfill 体积收益比'
  - '- 原生端无障碍 API 行为差异（如焦点顺序、手势导航）需平台专项测试矩阵覆盖'
  - '**素材溯源**'
  - '- 来源：`20230418_038.md`、`20230418_074.md`、`20230418_117.md`、`20230418_124.md`'
  - '- 角色：`extension`，拓展多模态、边缘计算、AI 原生、跨端场景下的 i18n+a11y 工程化实践'
