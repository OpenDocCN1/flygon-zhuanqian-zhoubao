- 'no': 1
  name: XSS 攻防全景 —— 从注入原理到可信类型终极防御
  points:
  - 区分存储型、反射型、DOM-based XSS 的成因、攻击链路与危害差异
  - 掌握 HTML、Attribute、JavaScript、URL、CSS 五大编码上下文的专用转义规则与误用陷阱
  - 实战 DOMPurify 配置策略：白名单标签/属性/URI、CSP 兼容模式、异步清洗大文本
  - 深度理解 Trusted Types 原理：TrustedHTML/TrustedScript/TrustedScriptURL 类型契约、Policy 创建与默认策略、配合
    DOMPurify 实现 createHTML 钩子
  - 分析 Trusted Types 对 DOM 型 XSS 的根治机制：innerHTML、document.write、eval 等敏感汇点的强制类型检查
  sources:
  - paper: 20230418_042.md
    role: origin
  excerpts:
  - 国内是没办法直接访问 openAI 的官网的...那就做一个国内的镜像站吧，国内的小伙伴无需科学上网就能享受到目前世界上最先进的自然语言模型提供的服务
  - 我们也会对用户输入的违禁内容进行过滤，确保合法合规
- 'no': 2
  name: CSRF 与 SameSite Cookie —— 同源策略演进下的请求伪造攻防
  points:
  - 复现经典 CSRF 攻击场景：GET/POST 请求伪造、预检请求绕过、子域名泄露
  - 实测 SameSite 属性三种取值的拦截边界：Lax 允许顶级导航、Strict 全阻断、None 需 Secure 配合跨域
  - 实现双重提交令牌模式：后端签发 CSRF Token、前端 Header 自动携带、AJAX/表单双通道校验
  - 结合 SameSite + 双重提交令牌构建纵深防御，分析边缘场景（子域、重定向、第三方登录）的兼容策略
  sources:
