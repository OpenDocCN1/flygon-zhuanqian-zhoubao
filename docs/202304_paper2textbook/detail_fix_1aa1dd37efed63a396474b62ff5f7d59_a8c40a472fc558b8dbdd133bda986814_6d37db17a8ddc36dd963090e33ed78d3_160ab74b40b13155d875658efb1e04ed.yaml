units:
- 'no': 1
  name: 前端知识图谱构建 —— 为备战绘制“作战地图”
  points:
  - '**为什么需要这个概念？**'
  - '- 面试考点碎片化、体系化程度低，缺乏全局视野导致复习漏洞百出'
  - '- 需要将零散知识点串联成网络，明确核心节点与依赖关系，实现“以一敌百”'
  - '- 可视化地图支持个人掌握度自评，支撑分阶段、有重点的科学复习计划'
  - '**核心定义**'
  - '- 将前端知识体系拆解为基础、框架、工程化、性能、安全、架构、软技能七大板块'
  - '- 节点为知识点，边为依赖/包含/对比关系，权重标注高频考点与个人掌握度'
  - '- 产物为思维导图或交互式图谱，作为复习导航与进度追踪工具'
  - '**关键性质**'
  - '- 结构稳定性：七大板块覆盖面试 90% 以上考点，长期有效'
  - '- 动态可度量：掌握度可量化（如 0-100%），支持按弱项聚焦复习'
  - '- 依赖显性化：揭示“JS 事件循环 -> 框架响应式原理 -> 性能优化”的先后依赖链'
  - '**典型例子**'
  - '- 基础板块：原型链/事件循环/闭包/类型转换为核心高频节点'
  - '- 框架板块：Vue 响应式/虚拟 DOM Diff/组合式 API 为核心高频节点'
  - '- 工程化板块：Webpack/Vite 构建原理/Monorepo/CI/CD 为核心高频节点'
  - '**边界条件**'
  - '- 图谱非静态：需随面试趋势（如 RSC、信号、Wasm）动态增补节点'
  - '- 切勿贪大求全：初级岗聚焦基础/框架/工程化核心节点，高级岗补全架构/软技能'
  - '- 避免“画图当复习”：图谱是索引，深度理解仍需落实到手写代码与系统设计'
  - '...'
  sources:
  - paper: XxczdnuchoE7JtxZrO8cn4eGncb.md
    role: origin
  excerpts:
  - 绘制思维导图/交互式图谱，标注核心节点、依赖关系、高频考点权重、个人掌握度自评，制定分阶段复习计划。
- 'no': 2
  name: 高频手写题专项攻克 —— 让代码成为“通关密语”
  points:
  - '**为什么需要这个概念？**'
  - '- 手写题是验证“知其然知其所以然”最高效手段，区分“会用 API”与“懂原理”'
  - '- 考察编码规范、边界处理、TS 类型体操、复杂度分析等工程基本功'
  - '- 面试官常通过追问（并发安全、内存泄漏、类型收窄）考察思维深度'
  - '**核心定义**'
  - '- 精选高频手写清单：防抖节流、深拷贝、发布订阅、Promise 系列、虚拟 DOM Diff、调度器简化版'
  - '- 每题包含：标准实现、边界情况处理、TypeScript 类型签名、单元测试用例、时空复杂度分析、追问点预判'
  - '**关键性质**'
  - '- 规范先行：代码风格统一（ESLint/Prettier）、变量命名语义化、防御性编程（空值/类型守卫）'
  - '- TS 加分项：泛型约束、条件类型、函数重载体现类型体操能力'
  - '- 追问延展：从“实现功能”到“生产可用”（如防抖支持 leading/trailing/取消）'
  - '**典型例子**'
  - '- Promise.all：需处理可迭代对象、非 Promise 值包装、竞态reject、空数组快速resolve'
  - '- 虚拟 DOM Diff：仅实现同层比较、key 复用、文本节点更新、组件类型变更销毁重建'
  - '- 简易调度器：基于 MessageChannel/MessagePriorityQueue 实现任务优先级与时间切片'
  - '**边界条件**'
  - '- 手写非背诵：须理解核心算法（如 Diff 双指针/最长递增子序列）而非死记模板'
  - '- 环境约束：白板/共享文档无 IDE 提示，需练习纯手写无报错'
  - '- 时间盒：单题 15-20 分钟，优先写核心流程再补边界与类型'
  - '...'
  sources:
  - paper: XxczdnuchoE7JtxZrO8cn4eGncb.md
    role: origin
  excerpts:
  - 提供标准实现、边界情况处理、TypeScript 类型签名、单元测试用例、时间/空间复杂度分析、面试官追问点预判。
- 'no': 3
  name: 系统设计题实战框架 —— 从“画图”到“做架构决策”
  points:
  - '**为什么需要这个概念？**'
  - '- 系统设计题无标准答案，考察抽象建模、权衡取舍、工程落地综合能力'
  - '- 缺乏结构化框架易陷入“功能罗列”而非“架构设计”，忽略非功能性指标'
  - '- 需要一套可复用、可落地的解题范式应对开放性问题（可视化平台/组件库/监控 SDK/微前端基座）'
  - '**核心定义**'
  - '- 六步法框架：需求澄清 → 架构草图 → 核心模块设计 → 数据流 → 非功能性指标 → 演进扩展'
  - '- 产出物：架构图（C4 模型）、技术选型表（对比优劣）、风险缓解方案'
  - '**关键性质**'
  - '- 需求澄清定边界：用户量/QPS/数据量/实时性/一致性/多端/团队技术栈'
  - '- 核心模块抽核心：识别核心难点（如可视化平台的 Schema 设计/渲染引擎/撤销重做）'
  - '- 非功能显性化：可用性（SLA/降级/熔断）、性能（缓存/分页/懒加载）、安全（XSS/CSP/权限）、可维护性（模块解耦/文档/测试）'
  - '**典型例子**'
  - '- 设计组件库：Monorepo 结构/主题系统/Tree Shaking/文档站/版本发布/单测覆盖率'
  - '- 设计监控 SDK：采集端/上报端/存储/查询/告警，重点解决数据丢失/性能开销/采样率'
  - '- 设计微前端基座：沙箱隔离/通信机制/共享依赖/路由分发/子应用生命周期'
  - '**边界条件**'
  - '- 切忌“简历驱动设计”：只谈熟悉技术，忽视场景适配性'
  - '- 避免过度设计：早期不做分布式、Service Mesh 等重架构，强调演进路径'
  - '- 时间分配：澄清 10%、草图 20%、核心模块 40%、数据流/非功能/演进 30%'
  - '...'
  sources:
  - paper: XxczdnuchoE7JtxZrO8cn4eGncb.md
    role: origin
  excerpts:
  - 套用框架解决“设计一个可视化搭建平台/组件库/监控 SDK/微前端基座”等开放性问题，输出架构图、技术选型表、风险缓解方案。
- 'no': 4
  name: 行为面试 STAR 法则 —— 用故事证明“软实力”硬指标
  points:
  - '**为什么需要这个概念？**'
  - '- 大厂面试重“软技能”（沟通/推动/抗压/成长性），行为面试权重常达 30-50%'
  - '- 无结构表达易跑题、细节缺失、无法量化贡献，导致面试官无法评级'
  - '- 需标准化素材库与话术模版，实现“2 分钟讲清故事、证据确凿、亮点突出”'
  - '**核心定义**'
  - '- STAR 模版：Situation（背景）、Task（任务/目标）、Action（关键行动/决策）、Result（量化结果/复盘）'
  - '- 核心素材库：最有挑战项目、技术分歧解决、推动新技术落地、线上故障复盘、跨部门协作冲突'
  - '**关键性质**'
  - '- 我非我们：Action 必须强调“个人”在其中的关键决策、代码编写、沟通协调、推动落地'
  - '- 数据说话：Result 必含指标（性能提升 40%/覆盖率 90%/工时减半/零故障上线/用户投诉归零）'
  - '- 复盘升华：失败案例重点讲“事后做了什么改进、建立了什么机制、避免再犯”'
  - '**典型例子**'
  - '- 推动新技术落地：背景旧架构痛点 -> 任务调研选型 -> 行动 PoC/文档/培训/灰度 -> 结果全组接入/效率提升'
  - '- 技术分歧解决：背景方案 A/B 争执 -> 任务达成共识 -> 行动搭建 Benchmark/数据对比/邀请专家评审 -> 结果统一技术栈/沉淀 ADR'
  - '**边界条件**'
  - '- 素材真实性：严禁编造，细节经得起深挖（如具体指标来源、代码细节、人名时间）'
  - '- 避免“流水账”：背景 10%、任务 10%、行动 60%、结果 20% 的时间比例'
  - '- 反问环节：准备 2-3 个高质量问题（团队技术挑战/技术债务偿还计划/新人成长路径）体现长期意向'
  - '...'
  sources:
  - paper: XxczdnuchoE7JtxZrO8cn4eGncb.md
    role: origin
  excerpts:
  - 构建 Situation/Task/Action/Result 素材库、练习 2 分钟讲清故事、准备“最有挑战项目”“技术分歧解决”“推动新技术落地”标准答案。
- 'no': 5
  name: 模拟面试全流程复盘 —— 在“实战演练”中修正“认知偏差”
  points:
  - '**为什么需要这个概念？**'
  - '- 单独刷题≠面试能力：面试包含心理压力、表达节奏、代码书写规范、交互沟通等隐性维度'
  - '- 真实面试不可复现，模拟面试提供低成本试错环境，暴露“自以为会、一写就废”盲区'
  - '- 复盘机制将隐性经验显性化，形成可迭代的个人面试 SOP'
  - '**核心定义**'
  - '- 全流程模拟：自我介绍 → 基础/手写/系统设计/行为/反向提问，计时、录屏、同伴/导师扮演面试官'
  - '- 复盘四维：语速语调/逻辑结构/眼神交流/代码书写规范（变量命名/格式/注释/边界处理）'
  - '- 产出物：《面试复盘记录表》含题目、表现评分、失分点、改进动作、下次验收标准'
  - '**关键性质**'
  - '- 环境逼真：开摄像头/共享屏幕/白板工具/限时作答，模拟真实压力与工具限制'
  - '- 反馈结构化：面试官给“继续/开始/停止”三类建议，避免模糊鼓励'
  - '- 迭代闭环：每周 1-2 次模拟，记录表累积形成个人“高频失分图谱”，针对性强化'
  - '**典型例子**'
  - '- 手写题卡壳：复盘发现因变量命名混淆导致逻辑错误 -> 改进动作：练习标准命名模版/先写伪代码'
  - '- 系统设计跑题：复盘发现未澄清 QPS 直接上分布式 -> 改进动作：背诵需求澄清清单/练习 5 分钟画草图'
  - '- 行为面试空洞：复盘发现 Action 多用“我们” -> 改进动作：重写 3 个核心故事 STAR 草稿'
  - '**边界条件**'
  - '- 模拟非替代真题：需配合真题库、八股文背诵、项目深度复盘并行'
  - '- 同伴质量：扮演面试官者需有一定面试经验或按标准评分卡打分，否则反馈失真'
  - '- 频次控制：高强度模拟易焦虑，建议每次 60-90 分钟，间隔 1-2 天消化复盘'
  - '...'
  sources:
  - paper: XxczdnuchoE7JtxZrO8cn4eGncb.md
    role: origin
  excerpts:
  - 组织同伴/导师模拟真实面试环节、录屏复盘语速/逻辑/眼神/代码书写规范、输出《面试复盘记录表》持续迭代提升通过率。
