paper: docs/202304/20230418_075.md
desc: 该素材为一篇互联网创业项目复盘文章的导语部分，作者大鹏同学介绍了团队在2022年下半年于成都落地的一个“互联网医馆”项目，并引导读者跳转至飞书文档查看全方位的详细拆解，评论区显示了同行对医疗新媒体及大健康赛道的关注与交流意向。
concepts:
- name: 互联网医馆
  desc: 文中核心项目业态，指结合互联网技术与线下医疗服务的新型医疗机构模式，为本次复盘的拆解对象。
  is_original: false
  excerpt:
  - 方向：互联网医馆
- name: 持续创业者
  desc: 作者团队的自我定位，指持续尝试线上线下多个项目、积累实战经验的创业群体画像。
  is_original: false
  excerpt:
  - 提到过我们团队，做过不少线上线下的项目，算是持续创业者。
methods:
- name: __overview__
  desc: 采用项目复盘法，通过全方位拆解单个真实落地项目（坐标、方向、时间要素明确），并引导至详细文档（飞书）进行深度复盘分享。
  excerpt:
  - 今天这篇文章，来全方位给大家分享去年的一个项目。
  - 坐标：成都 方向：互联网医馆 时间：2022 年下半年
  - '[文章较长，请移步飞书。](https://viuejh8h99y.feishu.cn/docx/FqNZdGrjgopNjzxPbdEcltd2n0e)'
theorems:
- name: 实战复盘价值主张
  desc: 持续创业团队的真实项目复盘（含坐标、方向、时间等关键上下文）对同路人具有高参考价值，能吸引同城同行及垂直领域从业者深度交流。
  excerpt:
  - 前面的文章中，提到过我们团队，做过不少线上线下的项目，算是持续创业者。今天这篇文章，来全方位给大家分享去年的一个项目。
  - '评论区：瑞文: ... 我也在成都 ... 老腊肉: 创业不易！... 最近在策划一个基于中医的大健康项目，多多交流。浮生: 我主要就是做医疗新媒体的...'
findings:
- name: 项目基础画像
  desc: '[evidence] 素材明确记录了项目的三大核心定位要素：地理坐标为成都，业务方向为互联网医馆，执行时间为2022年下半年。'
  excerpt:
  - 坐标：成都 方向：互联网医馆 时间：2022 年下半年
- name: 社群协同信号
  desc: '[evidence] 评论区显示该内容成功触达目标受众：包含同城创业者（瑞文）、投资及大健康规划跨界者（老腊肉）、垂直医疗新媒体从业者（浮生），验证了“实战复盘”内容的链接效应。'
  excerpt:
  - '瑞文 : 厉害[强] 我也在成都 你账号叫啥名呢？'
  - '老腊肉 : 创业不易！方便的话加个微信，我主业做投资，最近在策划一个基于中医的大健康项目，多多交流。V：laoan1982'
  - '浮生 : 我主要就是做医疗新媒体的，主做抖音医生黄 v，快手黄 v，小红书黄 v，以及流量号引流'
