units:
- 'no': 1
  name: 自监督学习 —— 从海量无标签数据中挖掘监督信号
  points:
  - '**为什么需要这个概念？**'
  - '- 大规模人工标注数据成本高昂、速度慢，无法满足大模型对海量数据的需求'
  - '- 自然语言本身蕴含丰富的结构信息（如上下文依赖、句间关系），可构建免费监督信号'
  - '- 通过精心设计的预训练任务，让模型在“解谜”过程中自动习得语言通用表示能力'
  - '**核心定义**'
  - '- 自监督学习：从输入数据自身自动生成标签的机器学习范式，无需人工标注'
  - '- 掩码语言建模（MLM，如 BERT）：随机遮盖输入 Token（通常 15%），利用双向上下文预测被遮盖内容'
  - '- 因果语言建模（CLM，如 GPT）：仅利用历史上下文（单向）预测下一个 Token，符合生成式任务范式'
  - '- 下一句预测（NSP，BERT 专用）：判断两句文本是否为原文连续段落，建模句间关系'
  - '**关键性质**'
  - '- MLM 利用双向上下文，对 NLU（分类、抽取）任务效果更好；CLM 单向自回归，天然适配 NLG（生成、补全）任务'
  - '- NSP 任务后来被证明对下游任务提升有限（如 RoBERTa 移除 NSP 后效果不降反增），核心价值存疑'
  - '- 预训练目标设计直接决定了模型的归纳偏置与适用任务范围'
  - '**典型例子**'
  - '- BERT：MLM + NSP，开启预训练+微调范式统治 NLU 榜单'
  - '- GPT 系列：纯 CLM（Next Token Prediction），通过规模扩展涌现少样本学习与生成能力'
  - '- T5：统一文本到文本框架，用跨度损坏（Span Corruption）融合 MLM 与 CLM 优势'
  - '**边界条件**'
  - '- 仅靠 MLM/CLM 无法直接解决复杂推理、数学计算等需显式逻辑的任务，需后续微调或提示工程激活'
  - '- 数据质量对自监督效果影响巨大：垃圾进，垃圾出（Garbage In, Garbage Out）'
  - '- 预训练目标与下游任务存在“目标错位”，需通过指令微调/对齐缓解'
  sources:
  - paper: 20230418_023.md
    role: origin
  - paper: 20230418_024.md
    role: improve
  excerpts:
  - 对比掩码语言建模（MLM）与因果语言建模（CLM）的双向/单向上下文差异，分析 NSP 任务对句子关系建模的得失。
  - 自监督学习：无标签数据的监督信号设计
- 'no': 2
  name: Scaling Laws —— 模型、数据、算力的“铁三角”最优配比法则
  points:
  - '**为什么需要这个概念？**'
  - '- 训练大模型耗资巨大（百万级美元），盲目堆叠参数或数据极易导致资源浪费'
  - '- 需要科学法则指导：在固定算力预算下，模型有多大？数据练多少？如何分配最划算？'
  - '- 早期 Kaplan 定律误导了“模型越大越好”，Chinchilla 修正后节省了海量算力'
  - '**核心定义**'
  - '- Scaling Laws：描述模型测试损失 L 与模型参数量 N、训练 Token 数 D、算力预算 C 之间幂律关系的经验公式'
  - '- Kaplan 定律 (2020)：L ≈ A/N^α + B/D^β + E，认为模型规模 N 是主导因素，数据 D 相对次要'
  - '- Chinchilla 定律 / Hoffmann 等 (2022)：修正为最优分配下 N 与 D 应同比例缩放，即 **计算最优训练时，模型参数量与训练
    Token 数应大致成正比**'
  - '**关键性质**'
  - '- **算力最优分配原则**：给定算力预算 C (FLOPs)，最优模型大小 N* ∝ C^0.5，最优训练 Token D* ∝ C^0.5'
  - '- **“Chinchilla 最优”基准**：训练一个 70B 模型需 ~1.4T Tokens；若数据不足，宁可练小模型多看数据，也别练大模型欠数据'
  - '- 过度训练（Over-training）：在固定模型上继续投喂数据超出最优 D，收益递减但推理成本固定，有时工程上可接受（如 LLaMA 1T+ tokens）'
  - '**典型例子**'
  - '- Chinchilla (70B, 1.4T tokens) 用 1/4 算力超越 Gopher (280B, 300B tokens)，验证了定律'
  - '- LLaMA 系列：LLaMA-1 遵循 Chinchilla 最优；LLaMA-2/3 选择“过度训练”换取推理阶段性价比'
  - '**边界条件**'
  - '- 定律基于特定架构、数据分布、优化器得出，更换架构（如 MoE、RWKV）或高质量数据比例变化时，指数系数会漂移'
  - '- 仅关注验证集 Loss（困惑度）不等于下游任务性能最优，存在“Loss 下降但能力不增”现象'
  - '- 硬件利用率、并行效率、通信开销等工程因素未纳入公式，实际落地需工程修正'
  sources:
  - paper: 20230418_033.md
    role: origin
  - paper: CQXRd5Lc5ozWjFxwgpgcqmk5nAe.md
    role: improve
  excerpts:
  - 详解 Kaplan 与 Chinchilla 定律，推导最优分配策略：在固定算力下，模型参数量与训练 Token 数应同步缩放。
  - Scaling Laws：规模、数据、计算的三角权衡
- 'no': 3
  name: 大规模预训练工程 —— 3D 并行与混合精度的“分布式拼图”
  points:
  - '**为什么需要这个概念？**'
  - '- 千亿参数模型显存需求远超单张 GPU（如 175B FP16 需 350GB+ 显存，单卡 80GB 根本放不下）'
  - '- 单卡训练速度太慢（年级单位），必须将计算拆分到成百上千张卡上并行'
  - '- 通信开销、负载均衡、数值稳定性是规模化训练成败的工程关键'
  - '**核心定义**'
  - '- **数据并行 (DP)**：各卡持有完整模型副本，切分数据批次，梯度 All-Reduce 同步。基线方案，但显存不随卡数降低'
  - '- **张量并行 (TP)**：将单层矩阵乘法（如 Attention QKV 投影、FFN 线性层）按维度切分到多卡，显存线性降低，但需高频 All-Reduce，依赖高带宽互联
    (NVLink/IB)'
  - '- **流水线并行 (PP)**：将模型按层切分为多个 Stage，不同卡负责不同层，微批次流水流动。显存降低，但存在“气泡”空闲期，需调度优化 (1F1B,
    ZB1P)'
  - '- **3D 并行**：DP × TP × PP 组合，如 Megatron-LM 架构，实现万卡规模训练'
  - '- **ZeRO (Zero Redundancy Optimizer, DeepSpeed)**：按状态分片（优化器状态、梯度、参数）而非复制，ZeRO-3
    可将显存降至单副本 1/N，配合 CPU Offload/NVMe Offload 突破显存墙'
  - '- **混合精度 (BF16/FP16)**：前向/反向用低精度加速，参数主副本、梯度累积、Loss Scaling 用 FP32 保稳定。BF16 无需
    Loss Scaling，动态范围更大，成 A100/H100 标配'
  - '**关键性质**'
  - '- TP 域内通信最频繁，必须部署在 NVLink 互联的节点内（如 8 卡一组），PP/DP 跨节点'
  - '- 通信计算重叠是榨干算力关键：异步 All-Reduce、双缓冲、内核融合'
  - '- 训练稳定性挑战：Loss Spike（梯度爆炸/数据脏样）、BF16 下溢、显存碎片 OOM'
  - '**典型例子**'
  - '- Megatron-LM / Megatron-DeepSpeed：3D 并行 + ZeRO 训练万亿参数模型标配'
  - '- GPT-3 175B：TP=8 (节点内), PP=12 (层数), DP=多节点'
  - '- LLaMA 训练：FSDP (PyTorch 原生 ZeRO-3 类实现) + Activation Checkpointing + BF16'
  - '**边界条件**'
  - '- PP 气泡比例随微批次数增加而下降，但微批次太小降低 GPU 利用率，需权衡'
  - '- ZeRO-3 通信量巨大，对网络带宽极其敏感，InfiniBand 必选'
  - '- 激活重计算 (Activation Checkpointing) 用算力换显存，约 20-30% 训练时间开销'
  sources:
  - paper: 20230418_047.md
    role: origin
  - paper: 20230418_048.md
    role: improve
  excerpts:
  - 拆解 3D 并行（数据/流水线/张量）、ZeRO 优化、BF16 混合精度、梯度累积等工程落地细节。
  - 大规模预训练工程：并行策略与混合精度
- 'no': 4
  name: 数据工程 —— 从 Common Crawl 到高质量训练语料的“炼丹炉”
  points:
  - '**为什么需要这个概念？**'
  - '- 模型上限由数据决定：Scaling Laws 假设数据分布固定，提升数据质量等效于“免费”扩大模型/算力'
  - '- 原始网页数据（Common Crawl）噪声极大：广告、导航栏、重复内容、有毒/非法/低质文本占比高'
  - '- 数据污染会导致基准测试作弊（测试集泄露进训练集），评估失真'
  - '**核心定义**'
  - '- **清洗管线**：语言识别/过滤 → 脱敏/PII 清洗 → 启发式规则过滤（长度、符号比、停用词） → 质量分类器打分 (fastText/BERT-based)
    → 阈值筛选'
  - '- **去重**：精确去重 (URL/文档哈希) + 模糊去重 (MinHash LSH, n-gram Jaccard 相似度) → 文档级/段落级去重，防止模型“背诵”高频语料'
  - '- **课程学习**：按数据质量/难度排序，前期喂高质量/易学数据（如 Wikipedia、书籍、代码），后期喂海量网页，加速收敛提升上限'
  - '- **合成数据**：用强模型生成高质量指令/推理/代码/多语言数据，回补稀缺领域，实现“模型教模型”'
  - '- **数据污染检测**：n-gram 重叠检测、子字符串匹配、训练集/测试集哈希去重，发布前必须做'
  - '**关键性质**'
  - '- 数据质量 > 数据量：RefinedWeb (600B tokens) 超过 Common Crawl 原始几十 TB；Phi-1 (1.3B) 仅用教科书级代码数据超越大模型'
  - '- 多域数据混合比例是核心超参数：代码比例提升推理、数学、结构化能力；多语言比例影响跨语言迁移'
  - '- Tokenizer 训练数据需具备代表性，词表大小（如 32k-256k）影响压缩率与嵌入层参数量'
  - '**典型例子**'
  - '- RedPajama / Falcon RefinedWeb：完整复现开源清洗管线'
  - '- LLaMA 训练数据混合：67% CCNet, 15% C4, 4.5% GitHub, 4.5% Wikipedia, 4.5% Books, 2%
    ArXiv, 2% StackExchange'
  - '- Phi 系列：教科书质量合成数据 + 精选网页，小模型大智慧'
  - '**边界条件**'
  - '- 清洗规则存在“过拟合”风险：过度过滤导致分布偏移、多样性丧失、长尾知识缺失'
  - '- 版权/合规风险：书籍、代码、学术论文版权模糊，需法律审查与去版权化处理'
  - '- 合成数据若质量把控不严，会引入模型幻觉、风格单一、分布坍缩，需人工/强模型复核'
  sources:
  - paper: 20230418_049.md
    role: origin
  - paper: 20230418_050.md
    role: improve
  excerpts:
  - 介绍 Common Crawl 清洗管线、MinHash 去重、质量过滤器训练、课程学习调度及合成数据回补的实战经验。
  - 数据工程：清洗、去重、课程学习与合成数据
- 'no': 5
  name: 预训练稳定性诊断 —— 驯服 Loss Spike 与梯度异常的“急救手册”
  points:
  - '**为什么需要这个概念？**'
  - '- 万亿 Token 训练周期长（数周至数月），中断一次损失巨大（算力费、时间窗口、人力）'
  - '- Loss Spike（损失突增 10-100x）高频发生，不处理会导致模型永久发散（NaN、权重崩坏）'
  - '- 需要标准化的监控、诊断、恢复 SOP，将“玄学调参”变为“工程化运维”'
  - '**核心定义**'
  - '- **Loss Spike 成因三大类**'
  - '  1. **数据脏样**：极长序列、异常字符、编码错误、高熵噪声触发梯度爆炸'
  - '  2. **优化器/超参问题**：学习率过大、LR Warmup 不足、Weight Decay 设置不当、BF16 下溢'
  - '  3. **硬件/软件故障**：GPU ECC 错误、NCCL 通信异常、显存溢出静默截断、内核非确定性'
  - '- **诊断工具链**：逐层梯度范数监控、参数范数监控、激活值分布直方图、异常步骤自动保存 Checkpoint 供事后复盘'
  - '- **应急恢复 SOP**'
  - '  1. **立即停止/回滚**：检测到 Spike 立即终止，回滚到 Spike 前 1-5 个 Checkpoint'
  - '  2. **数据剔除**：定位触发 Spike 的 Batch 数据（需记录 Data Seed/Index），加入黑名单剔除'
  - '  3. **动态缩放/降级**：临时降低 LR (如 ×0.1)、增大 Gradient Clipping 阈值、开启 BF16→FP32 关键层保护'
  - '  4. **重启验证**：小步重启，观察 Loss 曲线平滑恢复后再拉回原 LR'
  - '**关键性质**'
  - '- **预防优于治疗**：充分 Warmup (1-5% steps)、Gradient Clipping (1.0)、稳定的 LR 调度器 (Cosine/Constant
    with Warmup)、BF16 训练'
  - '- **检查点策略**：频繁保存（每 500-1000 步）、异步保存不阻塞训练、多副本异地容灾'
  - '- **确定性训练**：固定随机种子、CUDA_DETERMINISTIC、避免非确定性算子，保证回滚后复现一致'
  - '**典型例子**'
  - '- GPT-3 训练日志：多次因数据脏样/硬件故障回滚，总算力浪费 ~10%'
  - '- LLaMA 训练：采用“Loss Spike 自动检测 + 自动回滚 + 数据黑名单”全自动化管线'
  - '- Megatron-DeepSpeed：内置 Gradient Clipping、Loss Scaling、异常检测回调'
  - '**边界条件**'
  - '- 部分 Spike 属于“良性波动”（如学习率重启后、数据分布切换后），盲目回滚反而浪费算力，需人工/规则二次确认'
  - '- 极大规模（万卡）下，单卡故障率高，需结合集群调度器（Slurm/K8s）实现节点级自动隔离与重调度'
  - '- 训练后期模型进入“平台期”，对扰动极度敏感，容错阈值需动态收紧'
  sources:
  - paper: 20230418_051.md
    role: origin
  excerpts:
  - 分析训练中 Loss 突增成因（数据脏样、学习率过大、数值溢出），给出回滚检查点、动态缩放梯度的应急方案。
  - 预训练稳定性诊断：Loss Spike 与梯度异常处理
