units:
- 'no': 1
  name: 类型体操核心原语 —— 类型层面的“变量、判断、循环、映射”
  points:
  - '**为什么需要这个概念？**'
  - '- TypeScript 类型系统是图灵完备的，但缺乏传统编程语言的变量赋值、if-else、for 循环等直观语法'
  - '- 复杂业务建模（如 API 路由解析、深度只读、路径提取）需要在类型层面进行数据结构变换'
  - '- 掌握核心原语是从“会用类型”进阶到“类型编程”的必经之路'
  - '**核心定义**'
  - '- **infer（推断/变量）**：在 `extends` 条件类型中声明待推断的类型变量，相当于类型层面的 `let` 或参数绑定'
  - '- **extends（约束/判断）**：类型层面的三元运算符前置条件，用于约束泛型范围或触发条件类型分发'
  - '- **keyof（遍历/键集合）**：获取对象类型所有键的联合类型，相当于 `Object.keys` 的类型版，是映射类型的遍历源'
  - '- **Mapped Types（映射/循环）**：`{ [K in KeyType]: ValueType }` 语法，遍历联合类型 `KeyType`
    的每个成员构建新对象类型，是类型层面的 `map`/`forEach`'
  - '**关键性质**'
  - '- **组合性**：四大原语可任意嵌套组合，实现复杂类型逻辑（如 `keyof` 配合 `infer` 做字符串解析，`Mapped` 配合 `extends`
    做条件映射）'
  - '- **分发性**：`extends` 作用于裸类型参数（裸类型变量）时，会自动分发到联合类型的每个成员上（分布式条件类型）'
  - '- **不可变性**：类型操作均为纯函数式，无副作用，输入类型相同输出必然相同'
  - '**典型例子**'
  - '- **提取函数返回类型**：`type ReturnType<T> = T extends (...args: any[]) => infer R ?
    R : never`（利用 `infer` 捕获返回值）'
  - '- **实现 `Pick`**：`type Pick<T, K extends keyof T> = { [P in K]: T[P] }`（`keyof`
    约束 + `in` 映射）'
  - '- **实现 `Readonly`**：`type Readonly<T> = { readonly [P in keyof T]: T[P] }`（映射类型修饰符）'
  - '**边界条件**'
  - '- `infer` 只能出现在 `extends` 的 `true` 分支（或 `?` 之前）中，否则报错'
  - '- `keyof` 作用于 `any` 返回 `string | number | symbol`，作用于 `object` 返回 `string | number
    | symbol`，作用于 `null/undefined` 报错（严格模式）'
  - '- 映射类型的 `in` 右侧必须是 `string | number | symbol` 的联合类型，不能是基础类型如 `string` 字面量联合之外的类型'
  - '- 类型实例化深度限制（默认 50 层）会阻碍过深的递归/映射嵌套，需拆分中间类型别名缓解'
  sources:
  - paper: 20230418_035.md
    role: origin
  excerpts:
  - 类型体操核心原语：infer、extends、keyof、mapped types 组合拳
  - 拆解推断、约束、遍历、映射四大基础操作，建立类型层面的“变量、判断、循环、映射”思维模型。
- 'no': 2
  name: 条件类型与分布式条件类型 —— 类型层面的三元运算符与联合分发
  points:
  - '**为什么需要这个概念？**'
  - '- 需要在类型系统中实现“如果类型 A 满足条件 B 则取 C 否则取 D”的分支逻辑'
  - '- 处理联合类型时，希望自动对联合的每个成员分别应用条件判断（分发），而非整体判断'
  - '- 理解 `Exclude`、`Extract`、`NonNullable` 等内置工具类型的实现原理，避免误用导致类型崩溃'
  - '**核心定义**'
  - '- **条件类型**：`T extends U ? X : Y`，若 `T` 可赋值给 `U` 则类型为 `X`，否则为 `Y`'
  - '- **分布式条件类型**：当 `T` 为**裸类型参数**且为联合类型时，条件类型会自动分发：`(A | B) extends U ? X : Y` 等价于
    `(A extends U ? X : Y) | (B extends U ? X : Y)`'
  - '- **裸类型参数**：指未被数组、元组、函数参数、对象属性等包裹的直接泛型参数 `T`，加上 `[]` 或 `Promise<>` 等即“穿衣服”不再裸露，从而阻止分发'
  - '**关键性质**'
  - '- **分配律**：分发发生在 `extends` 左侧为裸类型参数且实参为联合类型时'
  - '- **阻止分发**：将两边同加 `[]` 变为元组比较：`[T] extends [U] ? X : Y`，此时联合类型作为整体参与判断'
  - '- **`never` 特性**：`never` 是空联合，分发后无成员，结果为 `never`，利用此特性可过滤联合成员（如 `Exclude` 实现）'
  - '**典型例子**'
  - '- **`Exclude<T, U>` 实现**：`type Exclude<T, U> = T extends U ? never : T`（分发特性使
    T 的每个成员单独判断，符合条件的变 never 最终被联合吸收）'
  - '- **`Extract<T, U>` 实现**：`type Extract<T, U> = T extends U ? T : never`（保留符合条件的成员）'
  - '- **阻止分发对比**：`type IsUnion<T> = [T] extends [UnionToIntersection<T>] ? false
    : true`（利用元组包裹阻止分发来检测是否为联合）'
  - '**边界条件**'
  - '- 只有**直接**作用于泛型参数（裸类型参数）才触发分发，`Promise<T> extends ...` 或 `[T] extends ...` 均不分发'
  - '- 条件类型中 `infer` 只能在 `true` 分支使用，且同一 `infer` 名称在多处出现会交叉推断（取交集）'
  - '- 循环引用条件类型会导致 `Type instantiation is excessively deep` 报错，需重构拆分'
  sources:
  - paper: 20230418_035.md
    role: origin
  excerpts:
  - 条件类型与分布式条件类型：类型层面的三元运算符与联合分发
  - '深入理解 `T extends U ? X : Y` 在联合类型上的分发行为，掌握 `Exclude`、`Extract` 等内置工具类型实现原理。'
- 'no': 3
  name: 模板字面量类型 —— 字符串级别的类型运算与解析
  points:
  - '**为什么需要这个概念？**'
  - '- 传统类型系统只能处理结构化对象，无法在类型层面操作字符串内容（如路由 `/user/:id` 解析参数 `id`）'
  - '- 需要在编译期校验字符串格式（SQL、CSS-in-JS 属性、事件命名规范），实现“类型安全的字符串操作”'
  - '- 实现类似 `StartsWith`、`EndsWith`、`Replace`、`Split` 等字符串工具类型'
  - '**核心定义**'
  - '- **模板字面量类型**：使用反引号和 `${}` 插值语法构建字符串字面量类型，如 `type Greeting = `Hello, ${name}`
    ``'
  - '- **推断模式**：在 `extends` 左侧使用 `${infer Prefix}${infer Suffix}` 解构字符串，配合递归实现字符串遍历/解析'
  - '- **字符串联合展开**：`type World = ''World''; type Greeting = `Hello ${World}` // ''Hello
    World''`；若 `World` 是联合则展开为字符串联合'
  - '**关键性质**'
  - '- **展开性**：插值位置若为联合类型，会笛卡尔积展开所有组合（爆炸风险，需警惕组合数量）'
  - '- **推断贪婪性**：`infer` 在模板中默认贪婪匹配，需通过显式分隔符（如 `/`、`.`、`:`）约束边界'
  - '- **递归终止**：字符串递归需显式判断空串 `''''` 作为基线，否则无限递归导致类型实例化深度溢出'
  - '**典型例子**'
  - '- **路由参数提取**：`type ParseRoute<T> = T extends `${infer _}:${infer Param}/${infer
    Rest}` ? Param | ParseRoute<Rest> : T extends `${infer _}:${infer Param}` ? Param
    : never`'
  - '- **SQL 语句校验**：`type SelectStmt = `SELECT ${string} FROM ${string}` ` 约束仅允许 SELECT
    语句'
  - '- **CSS-in-JS 属性提示**：`type MarginProps = `margin${'''' | ''Top'' | ''Right''
    | ''Bottom'' | ''Left''}` // ''margin'' | ''marginTop'' | ...`'
  - '**边界条件**'
  - '- 模板字面量类型展开的联合成员数量有上限（约 10 万），过大导致编译器崩溃或极慢'
  - '- 不支持正则表达式能力，仅支持固定前缀/后缀/分隔符的结构化解析'
  - '- `infer` 在模板字面量中只能推断为 `string` 类型，无法直接推断为数字字面量类型（需额外转换）'
  - '- 递归深度受限于类型实例化深度限制（默认 50），长字符串解析需尾递归优化或分段处理'
  sources:
  - paper: 20230418_035.md
    role: origin
  excerpts:
  - 模板字面量类型：字符串级别的类型运算与解析
  - 演示如何利用 `${infer Prefix}${infer Suffix}` 实现路由解析、SQL 语句校验、CSS-in-JS 属性提示等场景。
- 'no': 4
  name: 递归与尾递归类型 —— 在类型系统中实现复杂数据结构变换
  points:
  - '**为什么需要这个概念？**'
  - '- 类型系统没有 `for`/`while` 循环，处理任意深度嵌套结构（如深度 `Readonly`、数组扁平化、对象路径提取 `Path<T>`）必须用递归'
  - '- 普通递归受限于类型实例化深度（默认 50 层），处理深层结构（如 100 层嵌套对象、长元组）会报错'
  - '- 尾递归优化（通过累加器模式）可将递归深度压缩至对数级，突破深度限制'
  - '**核心定义**'
  - '- **类型递归**：类型别名直接或间接引用自身，配合条件类型终止判断，模拟循环'
  - '- **元组递归载体**：利用元组长度递减 `[any, ...Rest]` 或递增 `[...Acc, any]` 作为递归计数器/状态载体，规避类型别名直接递归的深度限制'
  - '- **尾递归模式**：将中间结果累积在元组参数中，递归调用作为最后一步操作（TypeScript 编译器对元组长度变化的递归有特殊优化，可支持上千层）'
  - '**关键性质**'
  - '- **终止条件必须显式**：通常通过 `T extends []` 或 `T extends ''''` 等基线情况返回累加器结果'
  - '- **元组展开 `...` 是核心操作**：`infer Rest` 获取尾部、`[...Acc, Next]` 追加元素、`Tuple[number]`
    取联合'
  - '- **深度 `Readonly` 实现**：`type DeepReadonly<T> = T extends object ? { readonly
    [K in keyof T]: DeepReadonly<T[K]> } : T`（对象递归）'
  - '**典型例子**'
  - '- **`Flatten<T>` 数组扁平化**：`type Flatten<T> = T extends [infer First, ...infer
    Rest] ? First extends any[] ? [...Flatten<First>, ...Flatten<Rest>] : [First,
    ...Flatten<Rest>] : []`'
  - '- **`Path<T>` 对象路径提取**：递归遍历对象键，拼接字符串路径 `''a.b.c''`，利用模板字面量类型与 `keyof` 结合'
  - '- **尾递归版 `Repeat<Str, N>`**：`type Repeat<Str, N, Acc extends string[] = []> =
    Acc[''length''] extends N ? Acc : Repeat<Str, N, [...Acc, Str]>`（累加器 `Acc` 记录次数）'
  - '**边界条件**'
  - '- 非尾递归（直接递归返回类型表达式）深度限制约 50 层，超出报 `Type instantiation is excessively deep`'
  - '- 尾递归（元组累加器模式）可突破至 999+ 层（TS 4.5+），但元组长度上限约 9999（或更高版本放宽）'
  - '- 递归类型别名不能直接出现在自身定义的“非条件分支”中，必须包裹在条件类型 `extends ? :` 内部实现惰性求值'
  - '- 复杂递归极大消耗编译器内存和 CPU，大型项目中滥用会导致 IDE 卡顿、构建超时，需权衡收益'
  sources:
  - paper: 20230418_035.md
    role: origin
  excerpts:
  - 递归与尾递归类型：在类型系统中实现复杂数据结构变换
  - 通过元组递归模拟循环，实现深度 `Readonly`、`Flatten`、路径提取 `Path<T>` 等实用工具，规避类型实例化深度限制。
- 'no': 5
  name: 实战：从 OpenAPI Schema 自动生成类型安全的请求客户端
  points:
  - '**为什么需要这个概念？**'
  - '- 手写 API 请求类型定义重复、易过时、与后端不一致，维护成本高'
  - '- 需要端到端类型安全：URL 路径参数、查询参数、请求体、响应体全链路推导，重构时编译器即时报错'
  - '- 将前几节核心原语（条件类型、模板字面量、递归、映射）串联落地，验证类型编程工程价值'
  - '**核心定义**'
  - '- **输入**：OpenAPI 3.x JSON/YAML Schema（含 `paths`、`components/schemas`）'
  - '- **核心类型变换管线**：'
  - '  1. **路径解析**：模板字面量提取 `/users/:id/posts/:pid` 中的路径参数联合 `''id'' | ''pid''`'
  - '  2. **操作映射**：遍历 `paths` 对象键（方法+路径），映射为 `HttpMethod<''GET'', ''/users/:id''>`
    结构'
  - '  3. **参数分离**：条件类型区分 `path`/`query`/`header`/`cookie` 参数，生成对应输入类型'
  - '  4. **引用展开**：递归解析 `$ref` 引用，展开 `components/schemas` 中复杂嵌套模型'
  - '  5. **客户端签名生成**：合成 `request<Path, Method, Params, Body>` 重载签名，实现路径参数必填、查询参数可选的类型约束'
  - '**关键性质**'
  - '- **Schema 驱动开发 (SDD)**：Schema 为单一事实来源，类型定义自动衍生，消除手写同步成本'
  - '- **类型安全即文档**：IDE 自动补全即接口文档，参数错误编译期即报错（如缺少必填 path 参数、query 类型不匹配）'
  - '- **增量生成**：利用工具（如 `openapi-typescript`、`orval`、`hey-api`）集成构建流水线，CI 中自动生成 `.d.ts`'
  - '**典型例子**'
  - '- **路径参数强制**：`client.get(''/users/:id'', { params: { id: 123 }})` ✅ 通过；`client.get(''/users/:id'',
    {})` ❌ 报错缺少 `id`'
  - '- **响应体类型推导**：`const user = await client.get(''/users/1'')`，`user` 类型自动为 `UserSchema`
    而非 `any`'
  - '- **泛型约束复用**：`type Client = OpenAPIClient<typeof schema>` 一次定义，全项目复用'
  - '**边界条件**'
  - '- OpenAPI Schema 中 `anyOf`/`oneOf` 映射为 TS 联合类型可能导致类型膨胀，需配置简化策略'
  - '- 循环引用 Schema（如树形结构 `Node { children: Node[] }`）需生成工具支持递归类型别名，否则展开无限'
  - '- 文件上传 `multipart/form-data` 等非 JSON 场景类型建模复杂，常需手写补充声明'
  - '- 生成的类型体积巨大（数万行）可能影响 IDE 性能，建议按模块拆分生成或使用 `export type` 按需导入'
  sources:
  - paper: 20230418_035.md
    role: origin
  excerpts:
  - 实战：从 OpenAPI Schema 自动生成类型安全的请求客户端
  - 串联模板字面量、索引访问、条件类型，构建端到端类型安全的 API 调用层，消灭手写接口定义的维护成本。
