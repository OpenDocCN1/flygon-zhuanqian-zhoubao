learning_targets:
- 掌握微前端架构决策矩阵，能量化评估团队是否具备微前端落地条件
- 深度理解 qiankun 双沙箱机制与样式隔离方案的原理、选型边界与典型坑位
- 掌握 Module Federation 运行时依赖共享、版本协商算法与生态集成要点
- 能制定覆盖依赖治理、路由协议、监控统一的《微前端接入规范》并落地自动化管道
- 掌握遗留系统微前端化改造的‘绞杀者模式’全流程：资产梳理、边界拆分、构建适配、灰度发布与回滚预案
- 理解 AI 赋能微前端开发的实战范式：通过提示词工程与 RPA 自动化提升基座与子应用的研发效能
- 掌握微前端场景下的 AI 代码生成、智能路由分发、自动化测试与监控告警的落地策略
- 掌握遗留系统 AI 重构的代码理解、生命周期补全、依赖拓扑分析、增量迁移实操方法
concept_map:
- 微前端架构落地
- ├── 架构决策矩阵
- │   ├── 量化评估维度：团队规模/部署频率/技术栈异构/业务耦合  —— P001
- │   ├── 触发阈值：团队>10人/多仓库/独立发布/技术栈迁移  —— P001
- │   ├── 收益成本模型：发布效率×规模 vs 基建投入+运行时开销  —— P001
- │   └── 可逆性评估：预设回归单体降级方案  —— P001
- ├── qiankun 深度解析
- │   ├── 双沙箱模式
- │   │   ├── snapshot 沙箱：快照记录/恢复，兼容旧环境，不支持多实例  —— P002
- │   │   └── proxy 沙箱：Proxy 劫持 window，fakeWindow 隔离，主流方案  —— P002
- │   ├── 样式隔离三档
- │   │   ├── Shadow DOM：strictStyleIsolation，最强隔离，弹层需特殊处理  —— P002
- │   │   ├── CSS Modules：experimentalStyleIsolation，编译时隔离，性能最优  —— P002
- │   │   └── 动态 Style 标签：默认方案，弱隔离，卸载移除  —— P002
- │   ├── 生命周期标准化：bootstrap/mount/unmount/update  —— P002
- │   └── 通信机制：initGlobalState 发布订阅，复杂交互建议自定义事件  —— P002
- ├── Module Federation 原生联邦
- │   ├── 核心配置三要素：exposes/remotes/shared  —— P003
- │   ├── 运行时版本协商：semver 比对，满足复用 Host 单例，不满足 Remote 自载  —— P003
- │   ├── 联邦模块热更新：RemoteEntry.js 重构建 + WebSocket 热替换  —— P003
- │   └── 生态集成：@module-federation/vite、Rspack 原生支持  —— P003
- ├── 微前端治理规范
- │   ├── 公共依赖版本锁定：基座提供单例，子应用 externals 排除  —— P004
- │   ├── 路由分发协议：基座管 history，子应用仅响应 basename  —— P004
- │   ├── 组件库版本策略：发布→验证→灰度→全量标准化流程  —— P004
- │   ├── 监控埋点统一：基座注入 SDK，TraceID 透传打通链路  —— P004
- │   └── 接入准入门槛：体积/生命周期/沙箱压测/a11y-i18n 自动化门禁  —— P004
- ├── 遗留系统微前端化改造
- │   ├── 绞杀者模式：新功能新栈/老功能老栈/基座逐步接管  —— P005
- │   ├── 资产梳理与边界拆分：高频变更/高价值/低耦合优先剥离  —— P005
- │   ├── 构建产物适配：补全生命周期/UMD/SystemJS 格式/publicPath 动态注入  —— P005
- │   ├── 基座路由分发与状态同步：主应用管登录/权限/菜单，props 下发  —— P005
- │   └── 灰度发布与回滚：Nginx 金丝雀/一键回滚/监控兜底自动触发  —— P005
- └── AI 赋能微前端工程化
- '    ├── 提示词工程落地：基座/子应用代码生成、配置模版化、Prompt 库沉淀  —— P120,P139'
- '    ├── RPA 自动化集成：脚手架生成、依赖升级、发布流水线、监控巡检  —— P106,P140'
- '    ├── 智能路由与分发：AI 感知路由匹配、动态基座加载、跨应用状态同步  —— P041,P109'
- '    ├── 自动化测试与监控：E2E 用例生成、沙箱异常诊断、性能基线智能告警  —— P039,P046'
- '    └── 遗留系统 AI 重构：代码理解、生命周期补全、依赖拓扑分析、增量迁移  —— P022,P036'
life_analogy:
- 想象微前端架构像一个‘联合办公大厦’（基座/主应用）与‘独立租户’（子应用）的关系：
- '- **架构决策矩阵** = **‘入驻资格审核’**：不是所有人都适合进大厦（团队<5人、单仓库、无迁移需求 = 个体户，自建独栋楼更划算）'
- '- **qiankun 双沙箱** = **‘物理隔墙’**：'
- '  - `proxy` 沙箱 = **‘现代钢筋混凝土隔墙’**（Proxy 劫持），隔音好、互不干扰、支持多户同住'
- '  - `snapshot` 沙箱 = **‘简易活动板房隔断’**（快照还原），隔音一般、只能一户一户轮流住'
- '- **样式隔离** = **‘装修规范’**：'
- '  - Shadow DOM = **‘全封闭精装修’**（最强隔离），但自带家具（UI 弹层）难搬进来'
- '  - CSS Modules = **‘统一编码装修标准’**（编译时隔离），施工麻烦但入住后最省心'
- '- **Module Federation** = **‘大厦共享设施管网’**（水电网/公共依赖）：租户签约（shared 配置）共用大厦中央空调（React/Vue
  单例），版本协商像‘电压标准’不合就自带发电机'
- '- **治理规范** = **‘物业管理条例’**：强制统一门禁（路由分发）、统一宽带（监控 SDK）、统一装修风格（组件库版本），违规不给接水电（CI/CD
  门禁）'
- '- **遗留系统改造** = **‘老旧小区改造’**：不能强拆（重写风险高），采用‘绞杀者模式’——新盖楼（新子应用）接入大厦管网，老住户（遗留子应用）先住沙箱隔离区，分批搬迁、随时可回迁（灰度/回滚）'
- '- **AI 赋能微前端** = **‘智能物业管家’**：'
- '  - 代码生成 = **‘全自动装修机器人’**（Prompt 驱动，从图纸到成品）'
- '  - RPA 自动化 = **‘无人值守运维机器人’**（巡检、修缮、升级全自动）'
- '  - 智能路由 = **‘智能电梯调度系统’**（按需调度、精准送达、无感切换）'
- '  - 自动化测试 = **‘全天候安检机器人’**（沙箱压测、异常捕获、性能体检）'
- '  - 遗留重构 = **‘老楼智能翻新方案’**（结构扫描、管线置换、分批迁居）'
summary:
- concept: 架构决策矩阵
  desc: 量化评估微前端收益与成本，设定团队>10人/多仓库/独立发布等硬性触发阈值，避免盲目拥抱
- concept: qiankun 双沙箱
  desc: proxy 沙箱基于 Proxy 实现多实例强隔离（主流），snapshot 沙箱基于快照兼容旧环境（不支持多实例）
- concept: 样式隔离三档
  desc: Shadow DOM 最强但弹层难题多；CSS Modules 编译时隔离性能最优；动态 Style 标签默认弱隔离
- concept: Module Federation
  desc: Webpack 5 原生联邦，通过 exposes/remotes/shared 实现运行时依赖共享与版本协商，打破构建时边界
- concept: 版本协商算法
  desc: Host 加载 RemoteEntry -> 解析 shared -> semver 比对 -> 满足复用 Host 单例，不满足 Remote 自载
- concept: 微前端治理规范
  desc: 基座下沉能力：公共依赖单例、路由分发协议、组件库版本流程、统一监控 SDK、自动化准入门槛
- concept: 绞杀者模式
  desc: 遗留系统改造核心策略：新功能新子应用、老系统跑遗留子应用、基座逐步接管路由权限，平滑过渡
- concept: 灰度发布与回滚
  desc: Nginx 流量分流 + 一键切回旧 Upstream + 监控指标超阈值自动触发回滚，保障改造零重大故障
- concept: AI 赋能微前端工程化
  desc: Prompt Engineering + RPA + 智能路由 + 自动化测试 + 遗留重构，全链路降本增效
- concept: 提示词工程落地
  desc: 基座/子应用脚手架代码生成、配置模版化、Prompt 库沉淀，实现‘输入关键词 -> 自动生成文案/图片/视频 -> 定时发布’
- concept: RPA 自动化集成
  desc: 脚手架生成、依赖升级、发布流水线、监控巡检，将『人力成本』转化为『脚本维护成本』，实现 7x24 小时低成本运行
- concept: 智能路由与分发
  desc: AI 感知路由匹配、动态基座加载、跨应用状态同步，实现从‘人治/经验驱动’向‘数据/流程驱动’跃迁
- concept: 自动化测试与监控
  desc: E2E 用例生成、沙箱异常诊断、性能基线智能告警，构建覆盖‘创意-生产-分发-变现’全链路的数字化协作体系
- concept: 遗留系统 AI 重构
  desc: 代码理解、生命周期补全、依赖拓扑分析、增量迁移，将不确定性极高的链上投机行为包装成『确定性 SOP’
exercises:
- 'no': 1
  title: 微前端架构决策实战演练
  contents:
  - 某创业公司前端团队 8 人，单仓库，两周一发布，统一 React 18 技术栈，无遗留迁移计划。
  - 请基于架构决策矩阵进行评分：
  - 1. 列出该团队在‘团队规模、部署频率、技术栈异构、业务耦合’四个维度的得分
  - 2. 判断是否满足‘硬性触发条件’
  - 3. 计算收益成本比：假设微前端基建投入 2 人月/季度，运行时首屏 JS 增加 15KB，发布效率提升 10%
  - 4. 给出最终建议：微前端 / 继续单体优化（模块化/懒加载/包体积分析）
  - 思考题：若该公司半年后并购一支 15 人 Vue 2 团队，决策矩阵如何变化？
- 'no': 2
  title: qiankun 沙箱与样式隔离选型题
  contents:
  - 场景：主应用 React 18，需接入三个子应用——子应用 A（Vue 3 + Arco Design）、子应用 B（React 16 + Ant Design
    4）、子应用 C（老旧 jQuery + 手写 CSS，需 IE11 兼容）。
  - 1. 为每个子应用选择沙箱模式并说明理由
  - '2. 子应用 A 使用 Modal 弹窗挂载 document.body，开启 `strictStyleIsolation: true` 后弹窗样式丢失，给出两种解决方案并对比优劣'
  - 3. 子应用 C 因不支持 Proxy 降级 snapshot 沙箱，主应用要求子应用 A、B、C 同时在线，会发生什么问题？如何规避？
  - 4. 如果主应用升级 React 19，子应用 B 仍锁定 React 16，proxy 沙箱能否解决 React 版本冲突？为什么？
- 'no': 3
  title: Module Federation 版本协商与循环依赖排查
  contents:
  - 'Host（基座）与 RemoteA、RemoteB 均配置 `shared: { react: { singleton: true, requiredVersion:
    ''^18.2.0'' } }`。'
  - 1. RemoteA 升级 React 18.3.0，Host 仍为 18.2.0，启动时 RemoteEntry.js 解析共享依赖图的完整流程是什么？最终谁提供
    React 实例？
  - 2. RemoteB 误将 `requiredVersion` 设为 `'^17.0.0'`，运行时会报什么错？如何通过 CI 管道自动拦截此类配置漂移？
  - 3. 现有一循环依赖场景：Host 暴露 `useAuth` Hook 给 RemoteA，RemoteA 暴露 `<UserProfile />` 组件给
    Host，且 `<UserProfile />` 内部调用 `useAuth`。运行时初始化会如何死锁？请画出依赖图并给出架构层面的解耦方案。
  - 4. 如何利用 `package.json` 的 `peerDependencies` 与 MF `shared` 配置联动，建立‘构建时声明、运行时协商、CI
    校验’三位一体的版本治理体系？
- 'no': 4
  title: 遗留系统微前端化改造模拟推演
  contents:
  - 某电商后台管理系统：Vue 2 + jQuery 混编，10 万行代码，无构建工具，全局变量污染严重，Vuex 模块 200+，路由耦合业务逻辑。
  - 请设计改造全流程方案：
  - 1. 资产梳理：如何识别‘高频变更/高价值/低耦合’的首批剥离模块？给出 3 个具体判断标准
  - 2. 构建适配：为老系统引入 Vite，补全 `package.json`、暴露 qiankun 生命周期钩子的最小改动清单（含 `libraryTarget`、`publicPath`
    运行时注入方案）
  - 3. 沙箱隔离：老系统大量使用 `$.extend` 污染全局原型、`eval` 执行后端下发脚本，proxy 沙箱能否拦截？需先做哪些‘去污染’重构？
  - 4. 共享状态迁移：200+ Vuex 模块迁移成本极高，设计‘状态留老应用、新应用跨沙箱通信’的过渡方案（含事件总线协议、数据同步策略）
  - 5. 灰度发布：设计 Nginx 金丝雀配置片段（按 Cookie `user_group=beta` 分流），并制定‘错误率>1% 或 空白页率>0.5%
    自动回滚’的 Prometheus 告警规则表达式
- 'no': 5
  title: AI 赋能微前端工程化实战
  contents:
  - 场景：团队维护 1 个 React 18 基座、5 个子应用（Vue 3/React 16/jQuery/原生 JS/小程序 WebView），月均新增子应用
    1 个。
  - 1. Prompt 库设计：为‘子应用接入基座’建立标准化 Prompt 模版，包含角色设定、任务拆解、输出格式、少样本示例，要求输出生命周期钩子、路由配置、沙箱适配、依赖声明四大模块代码。
  - 2. RPA 流水线编排：设计‘从需求单到子应用上线’的自动化流水线，覆盖：Git 仓库创建、脚手架生成、依赖安装、代码规范检查、单测执行、构建产物上传、基座注册表更新、灰度发布、监控告警配置。
  - 3. 智能路由落地：基于用户行为日志与应用元数据，训练轻量模型预测‘下一个高概率访问的子应用’，实现预加载与预渲染，降低首屏白屏时间。
  - 4. 沙箱异常 AI 诊断：收集 proxy 沙箱运行时错误堆栈，结合子应用源码映射，训练分类器自动定位‘全局变量污染/生命周期未销毁/样式穿透/依赖冲突’四大典型故障类别。
  - 5. 遗留 jQuery 应用 AI 重构：输入 5 万行 jQuery 代码，输出：依赖拓扑图、全局变量清单、DOM 操作模式分类、建议的微前端生命周期适配层代码、增量迁移任务拆解。
units:
- 'no': 1
  name: 架构决策矩阵 —— 量化评估微前端的“入场券”
  points:
  - '**为什么需要这个概念？**'
  - '- 微前端并非银弹，引入会带来运行时性能损耗、开发调试复杂度上升、基础设施维护成本增加'
  - '- 团队常因“技术新潮”盲目拥抱微前端，导致小团队维护大架构、单体应用被过度拆分的反模式'
  - '- 需要一套可量化、可对比的决策框架，将主观判断转化为工程化的“通过/不通过”标准'
  - '**核心定义**'
  - '- 一套基于团队规模、部署频率、技术栈异构度、业务耦合度等核心维度的加权评分模型'
  - '- 设定明确的触发阈值（如：团队>10人、多仓库独立发布、技术栈迁移过渡期），满足N个核心条件才建议实施'
  - '**关键性质**'
  - '- 决策树结构：硬性前置条件（团队/部署）+ 软性加分项（技术栈/业务）'
  - '- 量化收益与成本：收益=发布效率提升×团队规模；成本=基建投入+运行时开销+认知负荷'
  - '- 可逆性评估：必须预设“回归单体”的降级方案与成本预估'
  - '**典型例子**'
  - '- 某中台业务：前端团队3人、单仓库、周发布、统一React栈 → 评分不达标 → 决策继续单体优化（模块化/懒加载）'
  - '- 某集团商业化平台：前端团队25人、多仓库、日发布、Vue2迁移React18过渡期 → 评分达标 → 决策微前端（qiankun主应用+子应用共存）'
  - '**边界条件**'
  - '- 团队规模<5人、单仓库、无技术栈迁移需求时，微前端收益几乎为负'
  - '- 基础设施团队不具备维护微前端基座能力（沙箱调试、版本治理、监控体系）时，强行上马必失败'
  - '- 业务强耦合、共享状态极多、SEO极度敏感的页面（如营销落地页）不适合纳入微前端子应用'
  sources:
  - paper: 20230418_043.md
    role: origin
  excerpts:
  - 引入决策树：团队>10人/多仓库/独立发布/技术栈迁移等触发条件，量化微前端收益与复杂度成本。
  - 架构决策矩阵：单体 vs 微前端——团队规模、部署频率、技术栈异构度量化评估
- 'no': 2
  name: qiankun 深度解析 —— “乾坤未定，你我皆是黑马” 的沙箱与隔离艺术
  points:
  - '**为什么需要这个概念？**'
  - '- 微前端核心难题：多个子应用共存同一主应用时，如何解决全局变量污染、样式冲突、路由抢占、实例不共享'
  - '- 传统 iframe 方案体验差（白屏、刷新、通信难、SEO差），需要原生 JS 级别的隔离与共享机制'
  - '**核心定义**'
  - '- qiankun 基于 single-spa 封装，提供“开箱即用”的微前端解决方案，核心含三大能力：JS 沙箱隔离、样式隔离、预加载'
  - '**关键性质**'
  - '- 双沙箱模式：'
  - '  - `snapshot` 沙箱（适配低版本浏览器/不支持 Proxy 环境）：通过记录 window 变更快照实现隔离，卸载时恢复快照'
  - '  - `proxy` 沙箱（现代浏览器主流，基于 Proxy）：劫持 window 读写，子应用运行在独立 `fakeWindow` 上下文，天然隔离，支持多实例并发'
  - '- 样式隔离三档：'
  - '  - `strictStyleIsolation: true`：Shadow DOM 方案，最强隔离，但样式无法穿透、UI 组件库弹层需特殊处理'
  - '  - `experimentalStyleIsolation: true`：CSS Modules/Scoped CSS 编译时方案（需构建配合），性能最好'
  - '  - 默认：动态头部 style 标签切换，卸载时移除，弱隔离'
  - '- 生命周期标准化：`bootstrap`、`mount`、`unmount`、`update` 四大钩子，主应用控制子应用完整生命周期'
  - '- 通信机制：`initGlobalState` 基于发布订阅的全局状态共享，但仅限简单数据同步，复杂交互建议自定义事件或共享库'
  - '**典型例子**'
  - '- 主应用 React 18，子应用 Vue 2 / Vue 3 / React 16 共存，通过 `proxy` 沙箱实现多实例热切换无污染'
  - '- 老系统微前端化：主应用接管路由分发，子应用保持原有构建产物仅暴露生命周期钩子，零侵入式接入'
  - '**边界条件**'
  - '- `proxy` 沙箱依赖 `window.Proxy`，IE11 等旧环境必须降级 `snapshot` 沙箱，且 `snapshot` 不支持多实例并发'
  - '- Shadow DOM 样式隔离下，全局 CSS 变量、UI 库弹层（Modal/Dropdown/Tooltip 挂载 body）会失效，需配置 `content`
    挂载节点或关闭强隔离'
  - '- 子应用间共享依赖（React/Vue/UI库）需基座统一提供单例，否则重复加载导致体积膨胀、状态不同步（hooks 失效）'
  - '- 嵌套微前端（子应用再套微前端）会导致沙箱嵌套、路由基座冲突，生产环境极不推荐'
  sources:
  - paper: 20230418_043.md
    role: origin
  excerpts:
  - 剖析 `snapshot`/`proxy` 双沙箱模式、`strictStyleIsolation` Shadow DOM 方案、`initGlobalState`
    状态共享、嵌套微前端坑位。
  - qiankun 深度解析：沙箱隔离、样式隔离、预加载、主子应用通信与生命周期
- 'no': 3
  name: Module Federation 原生联邦 —— Webpack 5 赋予的“运行时依赖共享”超能力
  points:
  - '**为什么需要这个概念？**'
  - '- 传统微前端（qiankun/single-spa）基于“运行时集成”，子应用构建产物独立，依赖去重靠外部脚本/CDN 约定，版本不一致极易爆雷'
  - '- 需要构建时感知、运行时动态协商的模块共享机制：实现“按需加载远程模块、自动协商共享依赖版本、支持热更新”'
  - '**核心定义**'
  - '- Webpack 5 核心特性 Module Federation (MF)：允许一个构建产物（Host）在运行时动态加载另一个构建产物（Remote）暴露的模块，并自动处理共享依赖的版本协商与单例化'
  - '**关键性质**'
  - '- 核心配置三要素：'
  - '  - `exposes`：Remote 端声明“导出什么”（如 `./Button` -> `./src/components/Button`）'
  - '  - `remotes`：Host 端声明“从哪拉”（如 `remoteApp@http://localhost:3001/remoteEntry.js`）'
  - '  - `shared`：双端声明“共享什么”（如 `react: { singleton: true, requiredVersion: ''^18.0.0''
    }`）'
  - '- 运行时版本协商算法：Host 加载 RemoteEntry -> 解析 shared 依赖图 -> 比对版本范围（semver） -> 满足则复用 Host
    实例，不满足则 Remote 自行加载并标记共享'
  - '- 联邦模块热更新 (HMR)：Remote 修改触发重新构建 remoteEntry.js，Host 通过 websocket 感知并拉取新模块替换，无需全量刷新'
  - '- 生态集成：`@module-federation/vite`、`@rspack/core` 原生支持 MF，打破 Webpack 专属'
  - '**典型例子**'
  - '- 组件库共享：Host 与 Remote 共享 `@design-system/ui` 单例，Remote 更新组件库版本只需修改 `shared` 配置版本范围，Host
    无需重新构建'
  - '- 业务模块动态下发：Host 为低代码平台，Remote 为各业务团队独立部署的“页面组件”，Host 运行时按需拉取渲染'
  - '**边界条件**'
  - '- 循环依赖死锁：A 暴露模块给 B，B 又暴露模块给 A，运行时初始化会陷入死循环，需架构层面禁止双向暴露'
  - '- 版本地狱：共享依赖版本范围过宽（`*`）导致运行时加载不兼容版本；过窄导致无法共享、重复加载。需配合 `package.json` `peerDependencies`
    与 CI 校验'
  - '- 运行时错误边界缺失：Remote 抛错会直接导致 Host 崩溃，必须在 Host 侧 `ErrorBoundary` 包裹远程组件加载'
  - '- 首屏性能：RemoteEntry.js 为额外网络请求，关键路径 Remote 应预加载或 SSR 注入'
  sources:
  - paper: 20230418_043.md
    role: origin
  excerpts:
  - 详解 `exposes`/`remotes`/`shared` 配置、运行时版本匹配算法、联邦模块热更新、与 Vite/Rspack 生态集成。
  - Module Federation 原生联邦：运行时依赖共享、版本协商、暴露/消费远程模块
- 'no': 4
  name: 微前端治理规范 —— 立宪为王，治理“野蛮生长”
  points:
  - '**为什么需要这个概念？**'
  - '- 微前端赋予团队“技术栈自主权”，但若无治理，极易演变为：React/Vue/jQuery 混用、UI 库版本碎片化、路由规则各异、监控埋点缺失、公共依赖重复打包'
  - '- 治理的本质是“约定优于配置”，通过基座能力下沉、强制规范、自动化校验，将治理成本从“人肉 Review”转移到“工程化管道”'
  - '**核心定义**'
  - '- 一套覆盖接入准入、运行时契约、依赖治理、路由协议、监控统一的《微前端接入规范》文档及配套工具链'
  - '**关键性质**'
  - '- 公共依赖版本锁定：基座提供 React/Vue/Router/UI Library 单例（`shared` 配置 `singleton: true`），子应用构建时
    `externals` 排除，运行时由基座注入，杜绝版本漂移'
  - '- 路由分发协议：基座统一监听 `popstate`/`pushState`，子应用仅响应基座下发的 `basename`/路由前缀，严禁子应用直接操作
    `history` API'
  - '- 通用组件库版本策略：建立“组件库版本发布 -> 基座升级验证 -> 灰度子应用 -> 全量切换”标准化流程，禁止子应用私自锁定旧版本'
  - '- 监控埋点统一：基座注入统一 SDK（错误上报、性能指标、业务埋点），子应用仅调用标准 API，TraceID 透传打通前后端链路'
  - '- 接入准入门槛：新子应用需通过“构建产物体积检查”、“生命周期规范校验”、“沙箱隔离压测”、“无障碍/国际化基线测试”自动化门禁'
  - '**典型例子**'
  - '- 某集团《微前端接入白皮书 v2.0》：规定子应用必须导出标准生命周期、禁止使用 `document.write`、强制使用基座提供的 `request`/`router`/`i18n`
    实例'
  - '- 基座 `@corp/micro-app-shell` 发布为 npm 包，子应用通过 `peerDependencies` 依赖，基座升级只需发版，子应用按需升级适配'
  - '**边界条件**'
  - '- 过度治理扼杀创新：禁止子应用尝试新技术栈（如引入 Solid/Qwik），建议设立“创新沙箱”通道，放宽部分规范但限制流量入口'
  - '- 遗留系统接入成本高：老旧 jQuery/Backbone 应用改造生命周期、适配沙箱 ROI 极低，建议“封装为 iframe 子应用”或“重写替代”而非强行接入'
  - '- 跨团队协作成本：规范制定需架构委员会牵头、多方博弈，执行依赖 CI/CD 管道强制，缺乏强制力的规范等于废纸'
  sources:
  - paper: 20230418_043.md
    role: origin
  excerpts:
  - 制定《微前端接入规范》：基座提供 React/Vue 单例、路由基座分发、UI 组件库强制共享、统一监控 SDK 注入。
  - 微前端治理规范：公共依赖版本锁定、路由分发协议、通用组件库版本策略、监控埋点统一
- 'no': 5
  name: 遗留系统微前端化改造 —— 蜕变的阵痛与灰度的艺术
  points:
  - '**为什么需要这个概念？**'
  - '- 存量系统往往技术栈陈旧（jQuery/Vue2/无构建工具）、代码耦合严重、无测试覆盖、文档缺失，直接重写风险极高、周期极长'
  - '- 微前端提供“绞杀者模式”落地路径：新功能用新栈写子应用、老功能跑在老子应用里、基座逐步接管路由/权限/登态，实现平滑过渡'
  - '**核心定义**'
  - '- 一套从资产梳理、边界拆分、构建适配、基座接入、灰度发布、回滚预案的标准化改造方法论'
  - '**关键性质**'
  - '- 资产梳理与边界拆分：按业务域/页面/组件粒度识别“高频变更/高价值/低耦合”模块优先剥离为首批子应用，核心稳态模块留在主应用或最后迁移'
  - '- 构建产物适配基座：'
  - '  - 无构建工具老项目：引入 Vite/Webpack，补全 `package.json`、暴露生命周期钩子（`bootstrap/mount/unmount`）、处理全局变量/样式冲突'
  - '  - 产物输出为 `UMD`/`SystemJS` 格式，配置 `libraryTarget`、`publicPath` 动态注入'
  - '- 基座路由分发与状态同步：主应用接管登录态、权限、全局菜单、路由守卫；子应用仅管业务路由，通过 `props` 接收基座下发的用户信息/Token/路由前缀'
  - '- 通信与共享：跨子应用跳转用基座 `pushState` + 事件总线；共享状态（购物车/用户偏好）沉淀至基座 `globalState` 或共享 Redux/Pinia
    实例'
  - '- 灰度发布与回滚预案：'
  - '  - Nginx 流量镜像/金丝雀：新旧子应用并行部署，按用户 ID/白名单/比例分流'
  - '  - 一键回滚：Nginx 配置热加载切回旧版本 Upstream，或基座动态下线子应用注册表'
  - '  - 监控兜底：错误率/空白页率/加载时长超阈值自动触发告警并回滚'
  - '**典型例子**'
  - '- 某电商后台管理系统（Vue2 + jQuery 混编，10万行）：'
  - '  1. 基座选型 qiankun（成熟、社区活）、搭建 React 18 主应用'
  - '  2. 首批剥离“商品管理”“订单中心”两个高频迭代模块为独立 Vue3 子应用'
  - '  3. 老系统整体作为“遗留子应用”跑在沙箱里，通过路由前缀 `/legacy/*` 托底'
  - '  4. 共享 `vue-demi` 统一 Vue2/Vue3 运行时、UI 库统一升级 Arco Design 由基座提供单例'
  - '  5. 灰度 10% 内部用户 -> 50% 灰度 -> 全量切换，历时 3 个月，零重大故障'
  - '**边界条件**'
  - '- 老系统若大量使用 `document.domain` 跨域、 `eval`/`new Function`、污染全局原型链，沙箱隔离极大概率失效，需先做“去污染”重构'
  - '- 共享状态过多（如全局几百个 Vuex 模块）迁移成本极高，建议“状态留在老子应用、新子应用通过事件总线跨沙箱通信”过渡'
  - '- 团队缺乏微前端调试经验（沙箱断点不生效、样式穿透排查难、网络请求归因难），必须先投入 1-2 个 Sprint 做基建工具链完善再推业务'
  sources:
  - paper: 20230418_043.md
    role: origin
  excerpts:
  - 梳理存量应用资产、拆分子应用边界、改造构建产物适配基座、配置 Nginx 反向代理、金丝雀发布与一键回滚演练。
  - 实战：遗留系统微前端化改造全流程——从资产梳理到灰度发布与回滚预案
- 'no': 6
  name: AI 赋能微前端工程化 —— 从“手写脚手架”到“智能物业管家”
  points:
  - '**为什么需要这个概念？**'
  - '- 微前端基座与子应用的样板代码高度同构（生命周期、路由、沙箱配置、依赖声明），手工编写重复度极高、易出错、维护成本大'
  - '- 传统脚手架仅能生成静态模版，无法感知业务上下文、技术栈差异、遗留系统约束，导致生成代码仍需大量人工修改'
  - '- 运维操作（依赖升级、发布部署、监控巡检、沙箱调试）高度依赖人工经验，缺乏自动化与智能化支撑，成为规模化扩展的瓶颈'
  - '**核心定义**'
  - '- 一套融合提示词工程、RPA 自动化、智能路由、AI 测试监控的微前端全生命周期智能化工程体系，旨在将“代码生成、基建运维、流量分发、质量保障、遗留重构”五大高频场景的边际成本压缩至近零'
  - '**关键性质**'
  - '- 提示词工程落地：'
  - '  - 基座/子应用脚手架代码生成：角色设定 + 任务拆解 + 输出格式 + 少样本示例，覆盖生命周期钩子、路由配置、沙箱适配、依赖声明四大模块'
  - '  - 配置模版化：`qiankun` 配置、`vite.config.ts`、`webpack.config.js`、`package.json` 标准化模版，支持变量插值与条件渲染'
  - '  - Prompt 库沉淀：建立团队级 `prompts/micro-frontend/` 目录，版本化管理，支持 `promptfoo` 回归测试与
    A/B 评测'
  - '- RPA 自动化集成：'
  - '  - 脚手架生成：`create-micro-app` 一键产出标准化仓库结构、CI/CD 配置、监控埋点、文档站'
  - '  - 依赖升级：Dependabot + 语义化版本规则 + 自动化变更日志生成 + 破坏性变更阻断合并'
  - '  - 发布流水线：GitHub Actions / GitLab CI 标准化编排，覆盖构建、测试、扫描、部署、验证、回滚全链路'
  - '  - 监控巡检：定时任务抓取基座/子应用健康指标，异常自动工单、钉钉/飞书告警、周报自动生成'
  - '- 智能路由与分发：'
  - '  - AI 感知路由匹配：基于用户行为序列预测下一跳子应用，预加载 `remoteEntry.js` 与关键 Chunk'
  - '  - 动态基座加载：按需注入基座运行时，冷启动子应用仅加载必要模块，减少首屏 JS 体积'
  - '  - 跨应用状态同步：基于事件总线 + 共享存储，实现登录态、权限、主题、国际化配置的多端一致性'
  - '- 自动化测试与监控：'
  - '  - E2E 用例生成：从业务流程描述（自然语言）自动生成 Playwright/Vitest 测试代码，覆盖登录、支付、跨应用跳转等核心链路'
  - '  - 沙箱异常诊断：收集 `proxy` 沙箱错误堆栈 + 源码映射，微调分类器自动定位“全局污染/生命周期泄漏/样式穿透/依赖冲突”四大故障'
  - '  - 性能基线智能告警：建立 LCP/CLS/INP/JS Heap 多维基线，引入异常检测算法（Isolation Forest/Prophet），替代静态阈值，消除告警风暴'
  - '- 遗留系统 AI 重构：'
  - '  - 代码理解：输入遗留代码库，输出模块依赖图、全局变量清单、业务领域划分、技术债务热力图'
  - '  - 生命周期补全：自动识别入口文件、注入 `bootstrap/mount/unmount` 钩子、处理全局污染变量、生成 `publicPath`
    运行时注入逻辑'
  - '  - 依赖拓扑分析：构建 `import`/`require`/`script` 三源融合的依赖图，识别循环依赖、版本冲突、未声明依赖，生成 `externals`
    与 `shared` 配置建议'
  - '  - 增量迁移：按“绞杀者模式”生成迁移任务拆解（Strangler Fig Pattern），每期交付可独立部署、可回滚的子应用增量'
  - '**典型例子**'
  - '- 某团队引入 `create-micro-app` + `promptfoo` 后，子应用接入耗时从 2 人天降至 2 小时，配置错误率归零'
  - '- RPA 流水线实现“提交 PR -> 自动生成子应用仓库 -> 跑通流水线 -> 基座注册 -> 灰度 10% -> 全量”全自动闭环，人工干预仅限
    Review'
  - '- 智能路由预加载使子应用首屏白屏时间从 1.2s 降至 300ms，用户感知流畅度显著提升'
  - '- 沙箱异常分类器准确率达 92%，平均定位时间从 30min 缩短至 3min，MTTR 大幅下降'
  - '- 遗留 jQuery 系统 AI 重构：5 万行代码 2 小时完成依赖拓扑与生命周期适配，较人工 3 周提效 90%，顺利接入 qiankun 沙箱'
  - '**边界条件**'
