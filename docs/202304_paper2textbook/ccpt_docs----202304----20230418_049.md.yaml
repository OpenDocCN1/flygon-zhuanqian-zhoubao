theorems:
- name: 打新低风险切入论
  desc: 核心主张：对于普通新人而言，参与 NFT 一级市场打新是风险相对可控、门槛较低的切入 Web3 获利路径，可作为赚取『第一桶金』的起点。
  excerpt:
  - 普通人如果想要来玩 NFT，有什么可以风险比较小，来切入的方式呢？
  - 今天分享一下 NFT 打新的玩法，比较适合刚入门的新人，希望能帮你在 Web3.0 的世界里找到适合自己的机会，赚取第一桶金。
- name: 投资风险免责声明
  desc: 核心主张：尽管打新被视为低风险路径，但 NFT 领域本质仍属投资，收益不确定，决策需个人承担后果。
  excerpt:
  - 但是也要强调一下，投资有风险选择需谨慎。
