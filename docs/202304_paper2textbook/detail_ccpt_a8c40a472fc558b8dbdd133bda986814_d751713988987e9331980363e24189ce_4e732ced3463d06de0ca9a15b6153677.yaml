units:
- 'no': 1
  name: 注意力机制 —— 让模型学会“看哪里”
  points:
  - '**为什么需要这个概念？**'
  - '- RNN/CNN 存在串行计算瓶颈与固定感受野限制，难以捕捉长距离依赖'
  - '- 传统 Seq2Seq 依赖固定长度的上下文向量，造成信息瓶颈'
  - '- 需要一种动态、并行化的机制，根据当前查询自适应聚焦关键输入 Token'
  - '**核心定义**'
  - '- 将输入映射为 Query、Key、Value 三组向量'
  - '- 通过 Q 与 K 的相似度计算注意力权重，对 V 进行加权求和'
  - '- 标准形式：Attention(Q, K, V) = softmax(QK^T / √d_k) V'
  - '**关键性质**'
  - '- 并行计算：所有位置可同时计算，无序列依赖'
  - '- 全局感受野：任意两 Token 直接交互，路径长度 O(1)'
  - '- 缩放因子 √d_k 防止点积过大导致 Softmax 梯度消失'
  - '**典型例子**'
  - '- 机器翻译中 ''The animal didn''t cross the street because it was too tired''，''it''
    对 ''animal'' 的高注意力权重实现指代消歧'
  - '**边界条件**'
  - '- 计算复杂度 O(L²d) 与显存随序列长度平方增长，限制长文本应用'
  - '- 缺乏位置感知，需显式注入位置编码'
  - '- 注意力权重不等于特征重要性解释，存在‘注意力≠解释’争议'
  sources:
  - paper: 20230418_007.md
    role: motivation
  - paper: 20230418_009.md
    role: motivation
  - paper: 20230418_010.md
    role: origin
  - paper: 20230418_022.md
    role: apply
  excerpts:
  - RNN 的串行本质导致无法并行训练，且长距离依赖面临梯度消失困境。
  - Attention(Q, K, V) = softmax(QK^T / √d_k) V
  - 多头注意力允许模型在不同表示子空间联合关注不同位置的信息。
  - 注意力热力图显示模型在翻译时能精准对齐源语言与目标语言的词汇。
- 'no': 2
  name: 缩放点积注意力 —— 让相似度变成分配比例
  points:
  - '**为什么需要这个概念？**'
  - '- 原始点积幅度随向量维度 d_k 增大而增大，推入 Softmax 饱和区导致梯度极小'
  - '- 需要数学上稳定、硬件友好（矩阵乘法高度优化）的相似度计算方式'
  - '**核心定义**'
  - '- 计算流程：Scores = QK^T → Scaled = Scores / √d_k → Weights = Softmax(Scaled) → Output
    = Weights · V'
  - '- √d_k 为缩放因子，d_k 为 Key 向量维度'
  - '**关键性质**'
  - '- 梯度稳定：缩放使方差接近 1，保持 Softmax 输入在敏感区间'
  - '- 硬件高效：核心操作归结为批量矩阵乘法 (Batched GEMM)，极致利用 Tensor Core'
  - '- 排列等变性：输入序列顺序打乱，输出顺序同步打乱（配合位置编码后变为排列不变性）'
  - '**典型例子**'
  - '- d_k=512 时，未缩放点积方差 ~512，Softmax 输入极大导致单峰分布；缩放后方差 ~1，分布平滑'
  - '**边界条件**'
  - '- 当 d_k 很小或 Q/K 正交初始化良好时，缩放影响边际化'
  - '- 极长序列下 QK^T 矩阵显存爆炸，需 FlashAttention 等 IO 感知算法优化'
  sources:
  - paper: 20230418_010.md
    role: origin
  - paper: 20230418_063.md
    role: improve
  excerpts:
  - 为了抵消点积随维度增长的方差放大，除以 √d_k。
  - FlashAttention 通过分块计算与在线 Softmax 实现 O(L) 显存复杂度。
- 'no': 3
  name: 多头注意力 —— 多视角协作的“专家委员会”
  points:
  - '**为什么需要这个概念？**'
  - '- 单头注意力只能聚焦一种关系模式（如句法或语义），难以同时建模多样依赖'
  - '- 需要在不同表示子空间并行捕获异构关系，再融合综合判断'
  - '**核心定义**'
  - '- 将 Q/K/V 通过线性投影分割为 h 个头：Head_i = Attention(QW_i^Q, KW_i^K, VW_i^V)'
  - '- 拼接所有头输出：MultiHead = Concat(Head_1, ..., Head_h) W^O'
  - '- 总参数量与单头大致相当（投影矩阵共享总维度）'
  - '**关键性质**'
  - '- 子空间专业化：不同头自发学习句法依赖、核心指代、位置模式等不同功能'
  - '- 表达能力增强：h 个头相当于集成 h 个注意力模型，参数共享下提升泛化'
  - '- 计算可并行：各头独立计算，适合 GPU 批处理'
  - '**典型例子**'
  - '- BERT 中 Head 关注主谓一致，Head 关注介词宾语，Head 关注最近邻 Token'
  - '- GPT 中早期层头关注局部模式，深层头关注长程推理链路'
  - '**边界条件**'
  - '- 头数过多导致每头维度 d_k = d_model/h 过小，单头表达力不足'
  - '- 存在冗余头，可通过剪枝（如 Head Pruning）压缩模型'
  - '- 推理时可合并投影矩阵为单次大矩阵乘法加速'
  sources:
  - paper: 20230418_019.md
    role: origin
  - paper: A47Vd3fekoelzRxZpdUcTl9Cn7W.md
    role: apply
  excerpts:
  - MultiHead(Q, K, V) = Concat(head_1, ..., head_h)W^O
  - 实验表明不同注意力头学到了不同的语言学关系，如句法树依赖、共指消歧等。
- 'no': 4
  name: 位置编码 —— 给无序集合注入“时间感”
  points:
  - '**为什么需要这个概念？**'
  - '- Self-Attention 本质是集合操作，对 Token 顺序不敏感（排列等变性）'
  - '- 语言高度依赖顺序（''狗咬人'' vs ''人咬狗''），必须显式注入位置信息'
  - '**核心定义**'
  - '- 绝对位置编码：PE(pos, 2i) = sin(pos/10000^(2i/d)), PE(pos, 2i+1) = cos(...)'
  - '- 可学习绝对编码：nn.Embedding(max_len, d_model) 随训练更新'
  - '- 相对位置编码/RoPE：仅建模相对距离，通过旋转矩阵作用于 Q/K：q_m = q_m * e^(i m θ)，实现线性衰减与外推'
  - '**关键性质**'
  - '- 正弦编码：确定性、可外推至未见长度、线性关系允许模型学习相对位置'
  - '- 可学习编码：训练长度内表现更优，但无法外推超出 max_len'
  - '- RoPE：融合绝对与相对优势，无额外参数，支持线性注意力近似，成大模型标配'
  - '**典型例子**'
  - '- Transformer 原版：正弦编码 + 词嵌入求和输入'
  - '- BERT/GPT-2：可学习位置嵌入'
  - '- LLaMA/ChatGLM/GPT-NeoX：RoPE 旋转位置编码'
  - '**边界条件**'
  - '- 正弦编码高维分量波长极长，远距离位置难以区分'
  - '- RoPE 外推至超长上下文（>训练长度）时需结合 YaRN/PI 等频率缩放技术'
  - '- 相对位置偏置（如 T5）引入可学习标量偏置，计算开销随序列长度平方增长'
  sources:
  - paper: 20230418_020.md
    role: origin
  - paper: B95VdtwByoPXGoxac7Ec1KhQnwc.md
    role: improve
  excerpts:
  - PE(pos, 2i) = sin(pos / 10000^(2i/d_model))
  - RoPE 通过旋转矩阵将绝对位置编码转化为相对位置编码，q_m^T k_n 仅依赖 m-n。
  - YaRN 通过动态 NTK 缩放频率基数实现窗口外推。
- 'no': 5
  name: 注意力可视化 —— 打开黑箱的“解剖刀”
  points:
  - '**为什么需要这个概念？**'
  - '- 验证模型是否真正学会语言学规律，而非靠捷径统计'
  - '- 诊断错误案例：关注错位置、重复生成、幻觉触发机制'
  - '- 为模型压缩、知识蒸馏提供结构化先验'
  - '**核心定义**'
  - '- 提取多层、多头注意力权重矩阵 A ∈ ℝ^{h × L × L}'
  - '- 可视化形式：热力图、有向图、聚类树、注意力流图'
  - '**关键性质**'
  - '- 层级分工：底层头多关注局部句法，顶层头关注长程语义/任务相关'
  - '- 稀疏性：多数头注意力集中在对角线及少数关键 Token（如 [CLS], SEP, 标点）'
  - '- 并非解释：高注意力权重 ≠ 因果重要性（需结合梯度/消融实验验证）'
  - '**典型例子**'
  - '- 指代消歧：''The trophy doesn''t fit the suitcase because it is too large'' 中 ''it''
    强关注 ''trophy'''
  - '- 句法树诱导：无监督下注意力头隐式对应依存树边'
  - '**边界条件**'
  - '- 平均多头/多层会掩盖个体头功能，需单头单层分析'
  - '- 仅观察 Encoder 自注意力或 Decoder 交叉注意力，视任务而定'
  - '- 可视化是相关性分析，非因果机制证明'
  sources:
  - paper: 20230418_022.md
    role: apply
  excerpts:
  - 注意力可视化揭示了模型内部隐式学习到的语言结构。
  - 注意力权重高不等于该 Token 对预测贡献大，需谨慎解读。
