paper: docs/202304/NlqtdIqRboDI0nx8PeccsB8gneh.md
desc: 该素材是一份基于生财有术社群方法论的短剧推广实操SOP，核心在于通过‘去重混剪+悬念营销’利用抖音自然流量变现。素材详细拆解了从账号养号、授权获取、素材精细化处理（5集合集、硬字幕提取修改、台词级分割、开头中间结尾素材库建立）、去重模板构建、爆款结构剪辑（开幕雷击+虐+小逆袭+悬念）、发布运营到快速试错的全流程，强调‘不看全集不做爆款’的素材理解深度，并提出‘混剪-轻解说-全程解说’的新人成长路径，核心主张为：短剧推广门槛低、见效快、依靠精细化去重与人性弱点把控即可实现新手冷启动。
concepts:
- name: 短剧分销推广（CPS）
  desc: 获取短剧官方免费授权，在抖音等平台发布剪辑视频挂载小程序链接，用户充值观看后按50%比例分成的变现模式。
  is_original: false
  excerpt:
  - 团队会把这些短剧版权派给各大平台分销，以此利益最大化。我们找官方渠道拿到授权，就可以剪辑短剧推广视频了。授权是免费的。
  - 平台分给我们的佣金在50%。假如用户充值100块，我们的分销比例是50%，我们的收入是50块。
- name: 去重
  desc: 短剧推广的核心生存技能，通过画中画、闪黑闪白、特效透明度、贴纸、水印、音效、变速等组合手段，使二创视频通过平台查重检测，获得自然流量推荐。
  is_original: false
  excerpt:
  - 短剧的核心是去重。做好去重，就有播放量，就有收益，哪怕一个评论也没有。
  - 去重的方式有很多。比如，画中画透明度2%；转场用0.1秒闪黑闪白；特效透明度调小不影响观看的15%；添加贴字左下角或右下角缩小；添加水印；添加音效；变速去重。
- name: 悬念截断
  desc: 在剧情高潮、冲突即将解决前戛然而止，利用用户好奇心与‘蔡格尼克效应’驱动点击小程序付费观看完整版的核心剪辑策略。
  is_original: false
  excerpt:
  - 我们剪辑一般在高潮处、有悬念的地方截止，引发他们的好奇心，让他们想继续看。
  - 比如，女频短剧看男主知道女主受伤后是不是会后悔，但不把男主后悔剪辑出来。又比如，男频短剧是炮灰挑衅男主...不把男主装逼打脸剪辑出来，引导用户去看正版短剧。
- name: 五集合集素材库
  desc: 将长达97集的原剧素材按每5集合并为1个文件（共19个），建立标准化素材管理单元，平衡素材颗粒度与去重查重通过率的工程化处理规范。
  is_original: true
  excerpt:
  - 第一步，按照5集分，把1-5集合成一集...换言之，你把97集的视频，整理为19个视频。
  - 为什么用1-5这种方式命名呢？因为你在选择剧情时，尽量选1个1-5、16-20的。而不是中间剧情全是1-5的。这样更容易过查重。
- name: 台词级分割
  desc: 利用大拍档/CR工具将视频按字幕台词切分为最小颗粒度片段，支持非线性叙事重组（如倒序剪辑、删减冗余台词），是精细化混剪的基础设施。
  is_original: true
  excerpt:
  - 第四步，按台词分割视频（修改字幕后的）。按台词分割视频必须有视频和字幕文件。用大拍档或CR分割。
  - 在原剧情中，A在前，B在后，你剪辑时，B剧情放到A剧情前面，也不影响观看，那就用BA剧情。具体到一句话时，也是这样。
- name: 开头-中间-结尾 三段式素材标注法
  desc: 基于爆款视频拆解与半糖‘开幕雷击’理论，将分割好的台词素材打标分类为：开头（异常/冲突钩子）、中间（虐+小逆袭循环）、结尾（强悬念截断）三大功能性素材池。
  is_original: true
  excerpt:
  - 第五步，整理开头中间结尾文件...你就把哪些情节放到开头结尾。
  - 新手：调研市场，看10个高赞视频，把别人的开头结尾放入开头结尾...老手：按照半糖老师的开幕雷击（异常，金钱，暴力，死亡，民族主义，性暗示，捷径），把开幕雷击的情节放入开头。
- name: 开幕雷击
  desc: 源自半糖老师理论，指视频前3秒必须包含异常、金钱、暴力、死亡、民族主义、性暗示、捷径七大要素之一，制造强认知冲突完成留人。
  is_original: false
  excerpt:
  - 老手：按照半糖老师的开幕雷击（异常，金钱，暴力，死亡，民族主义，性暗示，捷径），把开幕雷击的情节放入开头。
- name: 虐-小逆袭 循环节奏
  desc: 女频短剧中间段落的核心叙事节奏：主角受虐（男主/女配/炮灰施虐）-> 主角小反击（语言/肢体/他人相助）-> 循环叠加，持续激发观众同理心与爽感预期。
  is_original: true
  excerpt:
  - 剧情按照开幕雷击+虐+小逆袭+虐+小逆袭+虐+悬念来排序。
  - 虐是指什么呢？就是男主虐女主、女配虐女主、炮灰虐女主，主角处于不利的境地。小逆袭是指女主反击伤害她的人...很多时候虐与小逆袭的剧情是连在一起的。
- name: 养号玄学
  desc: 针对不实名、不挂橱窗、需多号操作的短剧分销账号，坚持关闭WiFi用流量、一机一号、3天模拟真人行为（刷/赞/评/挂直播）的账号冷启动风控规避策略。
  is_original: true
  excerpt:
  - 关掉wifi：在手机设置里，设置流量可用，关掉wifi...三天里刷视频，像正常人一样点赞关注评论，每天2小时，如果没有时间，可以挂直播间，偶尔评论一句。
  - 但我们做短剧，不实名，后期有精力可以做2-3个号，还是相信玄学为好。
- name: 用户画像纠偏（50+陷阱）
  desc: 监测视频受众画像，若核心受众偏向50岁以上男性（非目标付费人群24-30岁女性），必须果断隐藏作品重发，避免账号标签固化导致长期播放高但不出单。
  is_original: true
  excerpt:
  - 短剧女频的目标人群一般是24-30岁女性，如果你播放量高，出单少， 看看用户画像是不是50岁+。如果是，就隐藏作品，重新发。
  - 你抱着以后可能会出单的侥幸，没有隐藏。那么，你后面发视频，可能数据好，但用户是50+，就是不出单...让你备受折磨。
- name: 混剪-轻解说-全程解说 进阶路径
  desc: 新人能力成长的三阶段：零门槛混剪起步 -> 加入原剧情+解说+原剧情的轻解说 -> 全程原创解说，强制要求先跑通混剪流程再进阶，避免新手因解说门槛高而劝退。
  is_original: true
  excerpt:
  - 新人成长路径是混剪、轻解说、全程解说，如果你以前没有做过短视频，千万别抱着我做全程解说原创高、我一定能更赚钱的想法跳过混剪，直接做解说。
methods:
- name: __overview__
  desc: 短剧分销全流程SOP：授权获取 -> 账号养号(玄学流) -> 素材下载 -> 精细化素材加工(5集合集/硬字幕提取修改/台词分割/三段式标注) ->
    去重模板构建(5项组合+微调) -> 爆款结构剪辑(开幕雷击/虐逆循环/悬念截断) -> 发布运营(流量/引导/画像纠偏) -> 快速试错(智能字幕+分割3分钟测款)。
  excerpt:
  - 三、短剧SOP（重点看）
  - '## 1、获得短剧授权... ## 3、注册新的抖音... ## 4、下载短剧原素材 ## 5、剪辑思路（精细化运作）... ## 6、发布视频'
  - 四、如何快速试错（新手重点看）
- name: 素材精细化加工流程
  desc: 原剧下载 -> 剪映合并5集为1文件(19段) -> Videosrt/录音啦OCR提取硬字幕 -> 人工校对字幕(强制看全集) -> 蒙版覆盖原字幕重做
    -> 大拍档按台词分割 -> 依据爆款/理论打标整理为开头/中间/结尾素材库(台词命名)。
  excerpt:
  - 下载短剧原素材后，步骤如下：第一步，按照5集分...第二步，硬字幕提取...第三步，修改字幕...第四步，按台词分割视频...第五步，整理开头中间结尾文件。
- name: 去重模板复用与微调机制
  desc: 预设5种去重手法组合为标准草稿模板；每次剪辑复制草稿 -> 锁定去重素材轨道 -> 替换主轨道剧情素材 -> 修改1-2个微小参数(贴纸/透明度/音乐/字体)
    -> 解锁导出，实现批量化生产与查重通过的平衡。
  excerpt:
  - 去重用5种方法就好了。每次使用时，复制一份草稿，然后修改一些小细节，保证与之前的去重素材不一样。
  - 你把视频放入主轨道时，去重素材会移动，你不想移动，怎么办呢？点击锁定...等主轨道的视频做好了，再解除锁定。
- name: 爆款结构剪辑法
  desc: 遵循‘开幕雷击(前3秒) -> 虐+小逆袭循环(中段节奏) -> 强悬念截断(尾部钩子)’结构；素材选择策略：角色视角聚焦(核心人物组合) + 剧情节奏筛选(高能片段)
    + 非线性重组(倒序/删减冗余台词)；单视频时长5-10分钟(最低3分钟)。
  excerpt:
  - 简单来说，就是根据你对素材的理解，把开头中间结尾的素材放入剪映中。
  - 从角色来选...从剧情来选：剧情按照开幕雷击+虐+小逆袭+虐+小逆袭+虐+悬念来排序。
  - 在原剧情中，A在前，B在后，你剪辑时，B剧情放到A剧情前面...你还可以删除多余的话、无用的话。
- name: 快速试错验证法 (MVP测款)
  desc: 下载40集 -> 剪映智能字幕导出 -> 大拍档分割 -> 3倍速看台词/视频理解剧情 -> 剪辑3分钟视频(新手抄爆款/老手自创) -> 发布测试市场反馈(播放/出单)
    -> 决定是否深耕该剧，绕过‘看全集’耗时环节实现低成本选品。
  excerpt:
  - 1、下载40集视频，拖入剪映，使用剪映智能字幕自动识别... 2、用大拍档字幕分割功能... 3、视频分割为一句话台词后，通过看台词的方式了解剧情。或者用3倍速度看完视频。
  - 4、老手根据自己的思路剪辑一个3分钟视频，新手参考爆款视频剪辑一个3分钟视频，然后通过市场反馈，看是否继续剪辑这部剧。
- name: 抖音账号养号与发布运营规范
  desc: 新号关WiFi用流量 -> 一机一号(换绑号) -> 验证码注册 -> 3天日刷2小时(赞/评/挂直播) -> 完善资料(小红书找头像/背景/励志简介)
    -> 发布前后各刷10分钟 -> 流量发布 -> 千播后评论区发引导图 -> 监控用户画像(50+隐藏重发) -> 同号同视频最多发3次。
  excerpt:
  - 关掉wifi...账号注册：用新账号注册...三天里刷视频，像正常人一样点赞关注评论，每天2小时...
  - 发布视频，依旧每天要刷2小时抖音，发布前刷10分钟+，发布后刷10分钟+...播放量一千后，在评论区发图片引导...看看用户画像是不是50岁+。如果是，就隐藏作品，重新发。
theorems:
- name: 去重即流量定律
  desc: 在短剧分销赛道，视频能否获得自然流量推荐的唯一核心门槛是‘去重做得好坏’；内容质量(剧情/剪辑)仅影响转化率，去重质量决定生死线。
  excerpt:
  - 短剧的核心是去重。做好去重，就有播放量，就有收益，哪怕一个评论也没有。
- name: 悬念变现链路
  desc: 短剧推广的变现闭环为：剪辑高潮截断制造悬念 -> 引导点击左下角小程序 -> 用户免费看前十几集上瘾 -> 付费解锁后续 -> 分销者得50%佣金。切记不可引导关注或看下集，需切断‘等更新’预期强制付费。
  excerpt:
  - 变现逻辑很简单，引导用户点击左下角观看短剧的小程序。用户看了十几集后，想要看付费剧集，需要开通会员才能看后续。我们的分销比例是50%。
  - 你做短剧推广，不用引导别人关注，不要引导用户看下一集...每次付费充值的用户也是看到你视频的用户，不是关注你的粉丝用户。
- name: 不看全集 不做爆款
  desc: 精细化素材处理(字幕校对/分割/打标)的过程强制创作者看完全集，这是理解剧情脉络、挖掘独家爆点、实现‘开头中间结尾’精准搭建的前提；仅抄袭爆款只能永远做跟随者。
  excerpt:
  - 做短剧，一定要看完全集，才知道如何做好短剧推广。如果不看完全集，只能追别人的爆款，永远无法做出自己的爆款。
- name: 新手女频易上手论
  desc: 新手建议优先切入女频短剧，因为女性用户付费意愿显著高于男性(男频)，女频‘虐-逆袭’情绪曲线更标准化，适合新手套用‘开幕雷击+虐+小逆袭+悬念’模板快速出单。
  excerpt:
  - 为什么新手建议做女频，因为女生相比于男生，舍得花钱。男频也有大爆的，但你是新手的话，做女频更容易上手。
- name: 自然流量红利期论
  desc: 当前短剧推广处于蓝海期，核心优势在于：无需投流(豆荚)、无需写文案、无需养粉、千播即可出单、仅需剪辑与去重硬技能，适合有电脑、每天2小时、能日更的普通人入场。
  excerpt:
  - 这个项目最大的亮点是不用你写文案，1千多播放量也可能出单，且目前项目属于蓝海期，只需要你会剪辑、去重就行了。
  - 短剧推广不用投豆荚，都是自然流量。
findings:
- name: 首日出单验证
  desc: '[evidence] 作者首次尝试短剧推广，第一晚发视频，第二天早上即产生首单，验证了‘见效快、正反馈强’的素材核心宣称。'
  excerpt:
  - 最近在尝试做短剧，第一天晚上发视频，没想到第二天早上就出单了，这个正反馈来的也太快了
- name: 选剧信号源有效性
  desc: '[claim] 素材宣称可通过‘平台标注产出高剧目’、‘同伴口碑’、‘自刷高赞近期视频(抢先看标识)’三大信号源选剧，但未提供量化对比数据支撑哪个源转化率最高。'
  excerpt:
  - 新手选顾少的隐婚罪妻。或者看平台提供的素材下载链接，里面提到了产出较高，重点剪的剧.或者问问在做的小伙伴，哪部剧比较火...看到点赞上万，发布日期在今天或昨天，小程序链接又是抢先看，就可以选。
- name: 调研市场最小样本量
  desc: '[claim] 素材规定‘至少看10个高赞视频’为调研基准，结合‘话题榜/视频榜/综合榜(含广告)’三维度拆解，但未说明为何是10个而非5或20的统计依据。'
  excerpt:
  - 当你选了一部剧时，你去抖音搜索一下，看看高赞视频是怎么做的。至少看10个视频。
  - 有3个看高赞视频的方法。第一个：看话题...第二个：看视频...第三个：看综合。
- name: 硬字幕工具链实测排序
  desc: '[evidence] 作者实测对比得出硬字幕提取工具好用度排序：Videosrt > 录音啦 > 剪映。剪映语音识别易受背景音乐干扰；前两者为OCR图片识别，准确率高但仍需人工校对错别字漏字。'
  excerpt:
  - 工具好用排序：Videosrt>录音啦>剪映。剪映是语音识别，如果音乐过大，人声过小，识别不了。Videosrt、录音啦是图片识别，准确率相对高，但依旧有错别字，漏字，需要人工修改。
- name: 分割工具迭代选择
  desc: '[evidence] 作者经群友推荐经历 CR软件 -> 大拍档 的工具迭代，最终确立大拍档为首选台词分割工具，印证了社群协作对工具链优化的实测价值。'
  excerpt:
  - 用大拍档或CR分割。我建议用大拍档。
  - 我要感谢无苔，她在群里提到了CR软件...后面在群友侣、牛顿273等人的分享下，我改成大拍档了。
- name: 5集合集命名查重优势
  desc: '[claim] 素材主张‘1-5、16-20’跨段选集命名优于连续中段命名利于过查重，但未提供A/B测试对比数据，属经验性策略宣称。'
  excerpt:
  - 因为你在选择剧情时，尽量选1个1-5、16-20的。而不是中间剧情全是1-5的。这样更容易过查重。
- name: 去重参数微调有效性
  desc: '[claim] 素材宣称‘今天用星星贴纸透明度2%，明天用月亮贴纸透明度3%’此类微小参数修改即可通过查重，属操作层面经验之谈，缺乏平台算法层面的验证证据。'
  excerpt:
  - 比如，今天你剪辑视频用星星贴纸，明天用月亮贴纸。或者今天你特效的素材透明度是2%，明天改成3%。
- name: 3分钟MVP测款周期
  desc: '[evidence] 快速试错法将‘精心剪辑十几个视频不出单’的高沉没成本压缩为‘下载40集->智能字幕->分割->3分钟剪辑->测试’的单剧验证周期，作者实测该流程可绕过‘看全集’耗时，但未披露该测款法的准确率(如假阴性率)。'
  excerpt:
  - 上面的方法虽然详细，但若精心剪辑十几个视频不出单，非常打击信心的。沉没成本也大。
  - 老手根据自己的思路剪辑一个3分钟视频，新手参考爆款视频剪辑一个3分钟视频，然后通过市场反馈，看是否继续剪辑这部剧。
- name: 50+用户画像陷阱实测
  desc: '[evidence] 作者实测发现：视频数据好看(几百赞、几十块收益)但用户画像为50+男性时，若不隐藏重发，后续视频会因账号标签固化持续吸引非目标人群，导致长期高播低转化‘备受折磨’，验证了‘果断隐藏’策略的必要性。'
  excerpt:
  - 比如你发了一个视频...有几百赞了...用户是50+，出单几十块...你抱着以后可能会出单的侥幸，没有隐藏。那么，你后面发视频，可能数据好，但用户是50+，就是不出单...让你备受折磨。
- name: 同视频三次发布上限
  desc: '[claim] 素材给出抖音同账号同视频最多发3次、快手隐藏后不可二发的平台规则红线，属运营经验总结，未引用官方文档。'
  excerpt:
  - 抖音同一个视频在同一个账号可以发三次，但别超过三次，也别发到你别的抖音号上。快手隐藏了，不要发第二次，容易违规。
