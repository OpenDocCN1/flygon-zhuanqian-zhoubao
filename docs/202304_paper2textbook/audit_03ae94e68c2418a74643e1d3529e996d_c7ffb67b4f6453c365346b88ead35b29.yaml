unsupported_claims:
- location: 41.3.1
  claim: INP 取代 FID 是因为 FID 只看首次交互，而实际应用中用户会频繁交互，INP 覆盖全周期、取高分位，更能反映真实卡顿体验
  reason: 素材中未直接说明 INP 取代 FID 的具体原因，仅在概念地图中列出 FID/INP 定义
- location: 41.3.3
  claim: CLS 必须过滤 hadRecentInput
  reason: 素材中未明确提及 CLS 采集需过滤 hadRecentInput 的具体技术细节
- location: 41.3.3
  claim: 'INP 需对 event 类型设置 durationThreshold: 0 捕获所有交互'
  reason: 素材中未提及 durationThreshold 参数配置细节
- location: 41.4.2
  claim: '最佳实践：库作者在 package.json 声明 sideEffects: false 并确保纯 ESM；应用层在 vite.config.ts
