life_analogy:
- 想象前端可观测性是**一家智能医院的全科诊疗体系**：
- '- **错误监控** = **急诊监护仪**：7×24 小时捕获「心跳骤停」（白屏/崩溃）与「异常体征」（JS 报错），自动记录病发时刻（堆栈）、既往史（版本/路由）并呼叫医生（告警）'
- '- **性能监控** = **体检指标看板**：持续测量「心肺功能」（LCP/INP）、 「代谢效率」（资源加载/长任务）、 「体重趋势」（内存占用），发现亚健康（卡顿）早干预'
- '- **用户行为埋点** = **病人活动轨迹仪**：记录病人在医院「挂了哪个科」（页面访问）、「做了什么检查」（点击/提交）、「在哪卡住了」（漏斗流失），辅助诊断体验病灶'
- '- **链路追踪** = **全院信息流转追踪**：从「挂号大厅」（前端入口）到「各科室会诊」（微服务调用）再到「检验科报告」（数据库），一条 `trace-id`
  串起全链路，根因定位不再推诿'
- '- **可观测平台** = **医院运营指挥中心**：聚合所有监护仪、体检单、轨迹仪、会诊单数据，配置分级预警（ICU级/普通病房级/体检复查级），支撑院长（业务方）与主治医师（开发）联合会诊'
- '- **GPT 智能助手** = **首席诊断专家**：阅读所有病历（日志/链路/指标），用结构化提示词（六字真经）在秒级输出诊断报告（根因/优化建议/修复代码），让医生（开发）只需确认执行'
summary:
- concept: window.onerror / unhandledrejection
  desc: 浏览器原生全局错误捕获入口，分别覆盖同步运行时错误与未处理的 Promise 拒绝
- concept: 框架错误边界
  desc: Vue errorHandler / React ErrorBoundary，捕获组件渲染及生命周期阶段错误，补全原生捕获盲区
- concept: Source Map 还原
  desc: 将压缩混淆后的生产环境堆栈映射回源码行号，是错误可读性的前提
- concept: 聚合去重指纹
  desc: 以 (类型+信息+栈顶帧) 生成指纹，时间窗内合并计数，防止错误风暴刷屏
- concept: PerformanceObserver
  desc: 浏览器原生性能观测 API，异步非侵入式采集 LCP/CLS/INP/LongTask/Resource 等条目
- concept: Core Web Vitals
  desc: LCP/CLS/INP 三大核心体验指标，直接关联搜索排名与用户留存，监控首要目标
- concept: 长任务
  desc: 主线程连续占用 > 50ms 的任务，卡顿的元凶，需结合堆栈定位优化
- concept: 事件模型三要素
  desc: Event（事件名）、Properties（属性）、User（用户标识），结构化埋点的基石
- concept: 代码埋点 vs 无痕埋点
  desc: 前者灵活精准但侵入业务，后者零侵入但噪音大、隐私风险高，主流趋势：代码埋点主导+可视化圈选辅助
- concept: 会话回放
  desc: 基于 rrweb 录制 DOM 变更/输入/轨迹，还原用户现场，定性分析利器
- concept: W3C Trace Context
  desc: traceparent 头部标准，统一前后端链路 ID 透传格式，打通 RUM 与 APM 的关键协议
- concept: 前端根 Span
  desc: 页面加载/路由跳转/用户交互发起的根节点，子 Span 挂载 HTTP/资源/长任务等细节
- concept: 一致性采样
  desc: 基于 trace-id 固定比例采样，保证同一链路前后端要么全采要么全不采，兼顾成本与完整性
- concept: 四层平台架构
  desc: 采集端 -> 接收处理端 -> 存储端 -> 查询告警端，自研平台的标准化分层
- concept: ClickHouse 宽表
  desc: 列式存储、高压缩比、高吞吐写入，适合高基数指标/日志/链路统一存储
- concept: 分级告警策略
  desc: P0 电话/OnCall、P1 即时通讯、P2 工单/日报，配合聚合抑制实现告警降噪
- concept: 发布守护
  desc: 新版本发布后自动对比核心指标基线，异常阻断流水线或触发一键回滚
- concept: 六字真经
  desc: GPT 高效对话核心框架：背景（身份/目的/受众）、要求（格式/约束/风格）、角色（专家人设/双角色扮演）
- concept: 二极管标题法
  desc: 基于损失厌恶与即时享受的标题公式：正面刺激（产品/方法+短期低成本+逆天效果）与负面刺激（不做+巨大损失+紧迫感）
- concept: GPT 调教范式
  desc: 师生协作模型：用户扮演老师分步教学（分块喂养+强制总结+正向强化），GPT 作为天才童工内化知识并输出高质量结果
exercises:
- 'no': 1
  title: 设计全局错误捕获聚合去重算法
  contents:
  - 假设某高峰期 1 分钟内上报 10 万条原始错误日志，包含大量重复错误：
  - 1. 设计错误指纹生成规则（字段选择、归一化处理、栈顶帧提取策略）
  - 2. 选择合适的数据结构在内存中做滑动时间窗（如 5 分钟）去重计数
  - 3. 当同一指纹计数超过阈值（如 100 次/分钟）时，仅上报 1 条汇总日志并触发告警
  - 回答问题：
  - '- 如何处理 Source Map 解析前后堆栈不一致导致的指纹漂移？'
  - '- 内存占用过高时，如何在不丢失核心错误的前提下降级？'
- 'no': 2
  title: 实现一个最小化性能监控 SDK 核心模块
  contents:
  - 要求：
  - 1. 使用 PerformanceObserver 监听 'largest-contentful-paint'、'layout-shift'、'event'
    (INP)、'longtask' 四类条目
  - 2. 处理 SPA 路由切换场景：在 router.afterEach 中重置观测器并上报“软导航”性能指标
  - 3. 资源加载瀑布采集：筛选 duration > 200ms 或 initiatorType 为 'script'/'css'/'img' 的资源上报
  - 4. 所有上报统一使用 navigator.sendBeacon，Payload < 64KB
  - 回答问题：
  - '- 如何在不阻塞主线程的前提下计算 INP（需取所有交互延迟的 98 分位数）？'
  - '- 跨域资源 ResourceTiming 信息受限，如何通过服端配置获取完整瀑布数据？'
- 'no': 3
  title: 搭建前后端链路追踪 Demo 并验证关联查询
  contents:
  - 环境：前端 Vue/React 简单页面 + 后端 Node.js/Go 两层微服务 + Jaeger/Grafana Tempo
  - 任务：
  - 1. 前端 SDK 封装 axios/fetch 拦截器，注入 traceparent Header（遵循 W3C 格式）
  - 2. 后端网关/服务解析 Header，提取 trace-id/span-id 并续传给下游
  - 3. 前端人为制造一个 API 500 错误，携带 trace-id 上报错误日志
  - 4. 在 Tempo/Grafana 中输入该 trace-id，验证能看到完整链路：前端根 Span -> 网关 -> 服务 A -> 服务 B(报错)
  - 回答问题：
  - '- 若前端部署在 a.com，后端 API 在 b.com，CORS 需如何配置才能透传 traceparent？'
  - '- 第三方支付回调页面无法注入 SDK，如何在链路中补齐这段“盲区”？'
- 'no': 4
  title: 规划自研可观测平台 MVP 版本技术选型与成本估算
  contents:
  - 场景：日活 500 万，日均 PV 2 亿，错误日志 500 万/天，链路 Span 2 亿/天
  - 任务：
  - 1. 选型 ClickHouse 集群规格（分片数、副本数、磁盘类型/容量），估算月存储成本（含冷热分离策略）
  - 2. 设计核心宽表 Schema（字段、类型、编码、分区键、排序键、TTL）
  - 3. 制定三级告警规则示例：错误率突增(P0)、LCP P75 超阈(P1)、新版本资源加载失败率上升(P2)
  - 4. 规划数据合规脱敏方案：IP 掩码、用户 ID 哈希、敏感字段白名单
  - 回答问题：
  - '- ClickHouse 高基数标签（如 trace_id、user_id）如何建索引平衡查询性能与写入吞吐？'
  - '- 如何利用物化视图预聚合“分钟级错误率”、“P75 LCP”加速看板查询？'
- 'no': 5
  title: 实战：用 GPT 六字真经生成前端错误分析报告
  contents:
  - 背景：某电商大促期间，前端上报 5 万条 JS 错误，栈帧指向第三方广告 SDK 的压缩代码。
  - 任务：
  - 1. 设计 Prompt：赋予 GPT“资深前端架构师”角色，要求输出结构化分析报告（错误分类、影响范围、根因定位、修复建议、优先级）
  - 2. 应用“六字真经”：背景（大促高峰/广告SDK/压缩代码）、要求（JSON格式/含代码片段/按严重度排序）、角色（资深架构师/安全专家）
  - 3. 对比人工分析与 GPT 输出的差异，评估准确率与时效性
  - 回答问题：
  - '- 如何通过“分块喂养”处理超长堆栈上下文窗口限制？'
  - '- 如何用“强制总结验证”确保 GPT 真正理解错误上下文而非幻觉？'
- 'no': 6
  title: 实战：用二极管标题法优化埋点事件命名与文案
  contents:
  - 场景：某内容平台“分享得奖励”活动，原埋点事件名 `share_click`，转化率 1.2%。
  - 任务：
  - 1. 应用正面刺激公式：产品/方法（一键分享）+ 短期低成本（3秒）+ 逆天效果（最高得 666 元红包） → 生成新事件名 `share_instant_redpacket`
  - 2. 应用负面刺激公式：不做（不分享）+ 巨大损失（错失百万大奖）+ 紧迫感（仅剩 1 小时） → 生成引导文案“别让 666 元红包飞了，1 小时后过期！”
  - 3. A/B 测试验证新旧埋点方案的点击率与转化率差异
  - 回答问题：
  - '- 如何用 GPT 批量生成符合平台调性的 40 个爆款关键词椸入埋点文案？'
  - '- 埋点文案优化是否会污染原始事件语义，如何在分析端兼容新旧命名？'
units:
- 'no': 1
  name: 全局错误捕获 —— 织就无死角的安全网
  points:
  - '**为什么需要这个概念？**'
  - '- 前端运行环境复杂，错误来源多样（同步代码、Promise、框架内部），单一捕获手段无法覆盖全场景'
  - '- 未捕获的异常会导致页面白屏、功能失效，且开发者无法第一时间感知线上真实错误率'
  - '- 需要一套分层、兜底的捕获体系，确保“错误无处遁形”'
  - '**核心定义**'
  - '- 建立 `window.onerror`（捕获同步运行时错误）、`window.addEventListener(''unhandledrejection'')`（捕获未处理的
    Promise 拒绝）、框架级错误边界（Vue `app.config.errorHandler` / React `ErrorBoundary`）三层防御体系'
  - '- 统一错误对象格式，提取关键上下文：堆栈、时间戳、用户 ID、版本号、路由、设备信息'
  - '**关键性质**'
  - '- **捕获时机差异**：`onerror` 在冒泡到 window 时触发；`unhandledrejection` 在微任务队列空闲时触发；错误边界在组件渲染/生命周期阶段捕获'
  - '- **不可捕获的边界**：网络请求失败（需拦截器）、Web Worker/跨域 iframe 内部错误（需子环境部署 SDK 并通过 `postMessage`
    透传）、语法错误（编译期即报错，运行时无法捕获）'
  - '- **Source Map 还原**：生产环境代码压缩混淆，必须接入 Source Map 解析服务（如 Sentry、Fundebug 或自建），将压缩后堆栈映射回源码行号'
  - '**典型例子**'
  - '- **场景**：用户点击按钮触发异步请求，Promise 因后端返回 500 导致 `reject`，但代码未写 `.catch()`'
  - '- **表现**：控制台红色报错 `UnhandledPromiseRejectionWarning`，`unhandledrejection` 监听器捕获到
    `event.reason`，上报包含堆栈指向调用处'
  - '- **兜底**：若框架层也未捕获，最终由全局 `unhandledrejection` 兜底上报'
  - '**边界条件**'
  - '- `window.onerror` 返回 `true` 可阻止默认浏览器错误处理（如控制台打印），但不建议常规开启，避免掩盖调试线索'
  - '- `unhandledrejection` 事件对象在部分旧浏览器为 `event.reason`，新标准为 `event.reason`，需兼容处理'
  - '- 框架错误边界**无法**捕获：事件处理器、异步代码、服务端渲染、错误边界自身抛出的错误'
  - '**工程化落地要点**'
  - '- **聚合去重**：以 `(错误类型 + 错误信息 + 栈顶关键帧)` 生成指纹，同指纹在时间窗内合并计数，避免风暴刷屏'
  - '- **上报策略**：错误日志优先级最高，采用 `navigator.sendBeacon` 或 `fetch(keepalive=true)` 保证页面卸载前送达'
  - '- **Source Map 安全**：生产环境 Source Map 不应公开下载，需上传至内网解析服务或配置 Nginx 仅允许内网 IP 访问 `.map`
    文件'
  - '- **GPT 辅助错误分析**：利用结构化 Prompt（六字真经）将压缩混淆的堆栈还原为可读业务逻辑，自动提取栈顶关键帧生成指纹，输出修复建议代码片段'
  sources:
  - paper: 20230418_046.md
    role: origin
  - paper: 20230418_000.md
    role: improve
  - paper: 20230418_046.md
    role: apply
  excerpts:
  - 实现 `window.onerror`/`unhandledrejection`/Vue `errorHandler`/React `ErrorBoundary`
    多层兜底、接入 Sentry/Fundebug 或自建平台解析 Source Map 还原源码堆栈。
  - 通过写作倒逼深度阅读，实现输入驱动输出。
  - 把所有的训练用提示词分享给大家，直接手把手教大家如何培养 GPT 成为一名最专业的标题党大师。
- 'no': 2
  name: 性能监控 SDK —— 量化用户体验的体温计
  points:
  - '**为什么需要这个概念？**'
  - '- 实验室数据无法反映真实用户的网络、设备、地理差异，必须采集真实用户监控（RUM）数据'
  - '- Core Web Vitals（LCP/CLS/INP）是搜索排名与用户留存的关键指标，需持续追踪达标率'
  - '- 长任务阻塞主线程、内存泄漏导致页面卡顿崩溃，属于“隐性杀手”，需主动探测'
  - '**核心定义**'
  - '- 基于 `PerformanceObserver` API 设计轻量 SDK，监听 `largest-contentful-paint`、`layout-shift`、`first-input`/`event`（INP）、`longtask`、`resource`
    等条目类型'
  - '- 采集资源加载瀑布流，识别阻塞关键渲染路径的大体积 JS/CSS/字体'
  - '- 监控 JS Heap 内存趋势，结合 `performance.memory`（非标准但 Chrome 支持）预警泄漏'
  - '- 统一通过 `navigator.sendBeacon` 可靠上报，避免阻塞主线程或丢失数据'
  - '**关键性质**'
  - '- **采集时机**：LCP 在页面主要内容渲染完成时触发；CLS 累计生命周期内所有非预期布局偏移；INP 取页面生命周期内所有交互延迟的 98 分位数（或最差值）'
  - '- **长任务定义**：主线程连续占用 > 50ms 的任务，通常由大量 DOM 操作、复杂计算、解析巨大 JSON 引起'
  - '- **内存监控局限**：`performance.memory` 仅 Chrome 支持，且受 GC 影响波动大，需采样平滑后判定趋势而非绝对值'
  - '**典型例子**'
  - '- **LCP 优化前后对比**：首屏大图未设置 `fetchpriority=high` 导致 LCP 3.2s，优化后预加载关键图片降至 1.8s，SDK
    采集数据直观反映提升'
  - '- **长任务定位**：某列表页滚动卡顿，SDK 上报 Long Task 耗时 120ms，堆栈指向 `virtualList.render()`，引导引入虚拟滚动优化'
  - '**边界条件**'
  - '- **SPA 路由切换**：单页应用路由跳转不触发 `onload`，需手动在路由钩子中重置 PerformanceObserver 并上报“软导航”指标'
  - '- **跨域资源**：跨域资源 `ResourceTiming` 信息受限（仅 `duration`、`startTime` 等），需服端配置 `Timing-Allow-Origin:
    *` 获取完整瀑布'
  - '- **Beacon 体积限制**：单次 `sendBeacon` 建议 < 64KB，大批量数据需分片或本地队列定时刷新'
  - '**工程化落地要点**'
  - '- **SDK 体积控制**：核心代码 < 5KB gzip，避免监控本身拖慢性能'
  - '- **采样率**：高流量页面可配置 10%-20% 采样，结合用户 ID 一致性采样保证同一用户会话数据完整'
  - '- **指标归一化**：上报数据统一包含 `page_url`、`connection_type`、`device_memory` 等维度，便于后续多维钻取分析'
  - '- **GPT 生成优化建议**：基于 Long Task 堆栈与资源瀑布数据，用结构化 Prompt 让 GPT 输出“重构方案/代码片段/配置调整”三维优化建议，直接接入研发工单系统'
  sources:
  - paper: 20230418_046.md
    role: origin
