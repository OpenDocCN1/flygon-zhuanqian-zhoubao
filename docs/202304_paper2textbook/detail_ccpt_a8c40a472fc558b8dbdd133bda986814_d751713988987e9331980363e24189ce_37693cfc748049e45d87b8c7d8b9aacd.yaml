- 'no': 6
  name: 异常监控与可观测性接入 —— 给应用装上“黑匣子”与“体检仪”
  points:
  - '**为什么需要这个概念？**'
  - '- 生产环境报错“用户反馈 -> 开发复现 -> 排查日志”周期长，且无法量化错误影响面（多少用户、什么机型、什么版本）。缺乏性能基线，首屏慢、交互卡顿无感知。'
  - '- 需在基建期接入 Sentry/自建监控 SDK，建立错误捕获、性能指标采集、用户行为关联、Source Map 自动上传的全链路可观测体系。'
  - '**核心定义**'
  - '- **错误监控 SDK**：重写 `window.onerror`、`unhandledrejection`、框架错误边界，采集堆栈、环境、用户标识、面包屑；Source
    Map 解析还原源码行号；聚合去重（指纹算法）防止风暴刷屏。'
  - '- **性能监控 SDK**：`PerformanceObserver` 采集 LCP/CLS/INP/TTFB/FID、Resource Timing
    采集资源瀑布、Long Task API 识别阻塞主线程任务、`sendBeacon` 可靠上报。'
  - '- **全链路追踪**：HTTP Header 透传 `trace-id`/`span-id`，前端生成根 Span，后端续接，打通前后端调用链。'
  - '**关键性质**'
  - '- **采样率与成本控制**：错误 100% 上报，性能/行为按比例采样（如 10%），高价值用户/核心链路 100% 采样，平衡存储成本与洞察力。'
  - '- **隐私合规**：IP 脱敏、PII 字段过滤、用户授权埋点、GDPR/个人信息保护法合规审计。'
  - '- **告警分级与降噪**：P0（核心流程错误率>1%/LCP>4s）钉钉/电话即时叫醒；P1（非核心错误/性能劣化）工单处理；P2（预警）周报汇总。'
  - '**典型例子**'
  - '- **SDK 接入代码**：`import { initMonitor } from ''@enterprise/monitor''; initMonitor({
    dsn: ''...'', appId: ''admin-main'', environment: import.meta.env.MODE, sampleRate:
    0.1, plugins: [vuePlugin, routerPlugin, requestPlugin] })`。'
  - '- **Source Map 自动上传**：Vite/Rollup 构建后 `sentry-cli sourcemaps inject` + `upload`，或
    CI 步骤上传至自建 MinIO/对象存储，报错时后端下载解析。'
  - '**边界条件**'
  - '- **Source Map 安全风险**：生产环境 Source Map 包含原始源码，严禁直接部署到 CDN 公开访问，必须存储在私有存储/监控平台后台，仅授权人员解密查看。'
  - '- **框架错误边界覆盖盲区**：Vue `errorHandler` / React `ErrorBoundary` 无法捕获：事件处理器异步错误、生命周期钩子外的
    Promise rejection、SSR 水合错误、Web Worker/Service Worker 错误，需分别针对性兜底。'
  - '- **指标定义漂移**：LCP/CLS/INP 定义随 Chrome 版本演进（如 FID 退役替换为 INP），SDK 需版本化维护，仪表盘指标需标注版本基线。'
