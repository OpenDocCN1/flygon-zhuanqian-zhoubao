- 'no': 7
  name: Schema 驱动的典型 CRUD 页面标准化 —— 从“写页面”到“配页面”
  points:
  - '**为什么需要这个概念？**'
  - '- 中后台 80% 页面是列表/表单/详情的 CRUD 变体，手写重复代码（列表查询/分页/新增编辑弹窗/校验/提交/刷新）极其低效且易出错。'
  - '- 需沉淀 `ProTable`/`ProForm`/`ProChart` 等 Schema 驱动组件，配合页面生成器，实现“JSON 配置 -> 完整页面”的降维打击。'
  - '**核心定义**'
  - '- **Schema 驱动**：定义 `PageSchema` 接口，包含 `layout`（布局）、`toolbar`（工具栏）、`table`（列/操作/选中）、`form`（字段/校验/布局/联动）、`actions`（API
    映射/权限/确认文案）等声明式配置。'
  - '- **通用组件三件套**：`ProTable`（表格+搜索+分页+工具栏）、`ProForm`（表单+校验+布局+联动）、`ProChart`（图表配置化渲染
    ECharts/AntV），均基于 `@enterprise/ui` 封装。'
  - '**关键性质**'
  - '- **代码生产力跃迁**：标准 CRUD 页面从 2-4 小时手写 -> 10-30 分钟配置，且自带类型校验、权限控制、Loading/Empty/Error
    状态、无障碍属性。'
  - '- **运行时动态性**：Schema 可后端下发（低代码平台）、可本地热更新（HMR）、可 A/B 测试不同布局，无需重新部署前端代码。'
  - '- **扩展性设计**：`renderer` 注册机制，支持自定义渲染器（如 `ColorPickerRenderer`、`JsonEditorRenderer`）、自定义校验器、自定义工具栏按钮，避免“配置地狱”限制业务创新。'
  - '**典型例子**'
  - '- **用户列表 PageSchema**：`table.columns: [{ dataIndex: ''name'', title: ''姓名'' },
    { dataIndex: ''status'', title: ''状态'', renderer: ''TagRenderer'', options: {
    1: ''启用'', 0: ''禁用'' } }, { title: ''操作'', renderer: ''ActionRenderer'', actions:
    [{ type: ''edit'', auth: ''user:edit'' }, { type: ''delete'', auth: ''user:delete'',
    confirm: true }] }]`。'
  - '- **表单联动配置**：`form.fields: [{ name: ''province'', onChange: (val) => ({ setFieldsValue:
    { city: [] }, updateFieldProps: { city: { options: await fetchCities(val) } }
    }) }]`。'
  - '**边界条件**'
  - '- **复杂交互不适用**：高度定制化交互（如可视化拖拽画布、复杂多步向导、实时协作编辑）不应强行塞入 Schema，应开发专用业务组件，Schema 仅作入口引用。'
  - '- **Schema 版本演进**：Schema 结构变更需版本化（`schemaVersion: ''2.0''`），提供迁移脚本自动升级旧 Schema，或兼容旧版渲染器并行运行。'
  - '- **类型安全挑战**：Schema 高度动态，TypeScript 类型推导极其复杂，建议核心 Schema 定义用 Zod/Valibot 做运行时校验
    + 类型推导，边缘扩展用 `any` 兜底并文档化。'
