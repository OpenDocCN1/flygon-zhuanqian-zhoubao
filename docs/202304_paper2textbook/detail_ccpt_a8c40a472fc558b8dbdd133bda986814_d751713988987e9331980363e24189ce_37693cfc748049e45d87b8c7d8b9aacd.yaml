units:
- 'no': 1
  name: 技术选型决策矩阵与 ADR 记录 —— 为架构决策建立「可追溯的法庭」
  points:
  - '**为什么需要这个概念？**'
  - '- 中后台项目技术栈众多（框架、状态管理、构建工具、CSS 方案等），凭直觉或习惯选型极易导致后期维护灾难、团队认知分裂、技术债务隐性积累。'
  - '- 需要一套结构化的方法，将隐性经验显性化，建立决策时的上下文、备选方案、权衡理由与后果预期，便于新人于boarding和未来复盘。'
  - '**核心定义**'
  - '- **技术选型决策矩阵**：以评估维度（成熟度、生态、团队熟悉度、性能、长期维护成本、招聘市场供给等）为行，备选方案为列，打分加权得出推荐选型的量化工具。'
  - '- **架构决策记录 (ADR, Architecture Decision Record)**：单页文档，记录“背景(Context) -> 决策(Decision)
    -> 后果(Consequences) -> 替代方案(Alternatives) -> 状态(Status)”，纳入代码仓库版本控制。'
  - '**关键性质**'
  - '- **不可篡改性**：ADR 一旦合入主分支仅能新增“废弃/替代”记录，禁止修改历史，保证决策考古的真实性。'
  - '- **强制关联性**：每个 ADR 必须关联 Issue/PR/设计文档，形成“需求-决策-实现”闭环证据链。'
  - '- **状态机流转**：Proposed -> Accepted -> Superseded/Deprecated，明确决策生命周期。'
  - '**典型例子**'
  - '- **选型矩阵实例**：对比 Vite vs Webpack，在“冷启动速度、HMR 性能、生态插件、团队熟悉度、SSR 支持”五维打分，Vite 以
    4.6/5.0 胜出，ADR 记录决定采用 Vite 5 + SWC。'
  - '- **ADR 实例**：`ADR-0003: 采用 pnpm Monorepo 管理多包`，背景：多业务线共享组件/工具库；决策：pnpm workspace
    + changesets；后果：安装速度提升 40%，但需解决幽灵依赖问题。'
  - '**边界条件**'
  - '- 矩阵权重设定主观性强，需全栈架构师、Tech Lead、核心开发共同投票确权，避免一人独断。'
  - '- ADR 粒度把控：仅记录“重大、难以逆转、跨团队影响”的决策（如框架选型、数据库选型），避免流水账式记录微小配置调整。'
  - '- 遗留系统改造时，需补录“隐性决策” ADR，还原历史上下文，防止重复踩坑。'
