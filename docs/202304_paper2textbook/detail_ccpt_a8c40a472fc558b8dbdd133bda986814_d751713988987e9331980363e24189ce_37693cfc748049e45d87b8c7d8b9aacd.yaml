- 'no': 8
  name: 微前端子应用接入与共享依赖治理 —— “分治”大仓，又要“合一”运行
  points:
  - '**为什么需要这个概念？**'
  - '- 中后台业务线扩展、团队规模>10人、多技术栈共存（Vue 2/3、React、Angular 遗留）时，单体应用构建慢、耦合高、发布互斥。微前端将巨石应用拆分为基座+多子应用，实现独立开发、独立部署、技术栈无关。'
  - '- 核心挑战：JS 沙箱隔离、样式隔离、公共依赖共享（React/Vue/设计系统单例）、基座与子应用通信、路由分发、部署运维复杂度。'
  - '**核心定义**'
  - '- **基座应用**：负责注册子应用、路由分发（`/admin/user` -> 子应用 user）、全局状态分发（`initGlobalState`）、公共依赖提供（`importmap`/Module
    Federation）、统一监控/登录/权限注入。'
  - '- **子应用**：独立构建、独立部署的单页应用，暴露 `bootstrap`/`mount`/`unmount`/`update` 生命周期，运行在沙箱中，无感知基座存在。'
  - '**关键性质**'
  - '- **沙箱隔离模式**：`snapshot`（记录/恢复 window 快照，适配旧应用）vs `proxy` (Proxy 代理 window，支持多实例并发，性能更优)。样式隔离：`scoped
    css` / `strictStyleIsolation: true` (Shadow DOM，最强隔离但样式穿透麻烦)。'
  - '- **共享依赖单例策略**：基座在 `importmap` 或 Module Federation `shared` 配置声明 `react`/`vue`/`@enterprise/ui`
    等单例，子应用 `external` 这些依赖，构建产物极小，运行时共享内存实例，避免多实例导致状态不同步、Hooks 报错。'
  - '- **通信机制**：`initGlobalState` 基于发布订阅（基座发布，子应用订阅），适合用户信息、主题、权限等全局广播；复杂业务通信建议定义共享
    `EventBus`/`SharedStore` 包。'
  - '**典型例子**'
  - '- **qiankun 接入**：基座 `registerMicroApps([{ name: ''sub-user'', entry: ''//sub.user.com'',
    container: ''#subapp-viewport'', activeRule: ''/user'' }])`；子应用 `vite.config.ts`
    配置 `build.lib` + `qiankun` 生命周期导出。'
  - '- **Module Federation 共享**：基座 `exposes: { ''./store'': ''./src/store'' }`，子应用
    `remotes: { host: ''host@//host.com/remoteEntry.js'' }`，`shared: { react: { singleton:
    true }, ''antd'': { singleton: true } }`。'
  - '**边界条件**'
  - '- **不必微前端**：团队<5人、单技术栈、发布频次低、无遗留系统包袱，单体模块化架构（Monorepo + 动态导入）更优，微前端收益<复杂度成本。'
  - '- **嵌套微前端深坑**：子应用再套子应用（三层+）会导致沙箱嵌套失效、路由基础路径计算错误、样式穿透失控，严禁嵌套超过两层。'
  - '- **CSS 变量隔离冲突**：基座与子应用 CSS 变量命名冲突（如 `--primary-color`），必须约定命名空间（`--host-primary`
    / `--sub-user-primary`）或 Shadow DOM 隔离。'
  - '- **公共依赖版本锁定治理**：制定《微前端接入规范》，基座锁定 React 18.2.0 / Vue 3.4.0 / Antd 5.12.0，子应用
    package.json `peerDependencies` 声明兼容范围，CI 扫描违规版本阻断合并。'
