- 'no': 10
  name: 灰度发布与回滚演练 —— 在生产环境“小心翼翼”地试错
  points:
  - '**为什么需要这个概念？**'
  - '- 即使通过所有 CI 门禁，生产环境真实流量、真实数据、真实网络环境仍会暴露潜在问题（内存泄漏、特定机型白屏、第三方接口超时、业务逻辑边界案例）。全量发布风险不可控，需灰度验证。'
  - '- 回滚必须是“常态化演练”的肌肉记忆，而非事故发生时的临时抱佛脚，目标：RTO (恢复时间目标) < 5 分钟。'
  - '**核心定义**'
  - '- **金丝雀发布**：流量按比例切分（1% -> 5% -> 20% -> 50% -> 100%），通过 Header/Cookie/IP/用户分层标识路由至新版本，实时监控错误率/延迟/业务指标，异常自动/人工熔断回滚。'
  - '- **蓝绿部署**：维护两套完全一致的生产环境，新版本部署至闲置环境，验证通过后流量瞬间切换，回滚仅需切回旧环境，零停机、零请求失败。'
  - '- **特性开关**：代码层面 `if (featureFlag(''new-checkout''))` 控制新功能暴露，部署与发布解耦，支持极速回滚（关闭开关）和定向人群测试。'
  - '**关键性质**'
  - '- **观测驱动决策**：灰度期间重点监控：错误率、Apdex、核心业务转化漏斗（如下单支付成功率）、资源利用率（CPU/内存/连接数）、日志错误关键词告警。'
  - '- **会话一致性**：同一用户灰度期间必须固定命中同一版本，避免请求在新旧版本间跳变导致状态错乱（如购物车丢失、表单提交 401）。'
  - '- **数据库迁移兼容性**：灰度期间新旧版本共存，数据库迁移脚本必须向后兼容（仅增表/增列/加默认值，不删列/改类型/重命名），回滚时旧版本代码仍能跑通新库结构。'
  - '**典型例子**'
  - '- **ArgoCD 金丝雀**：`argo rollouts set weight rollouts-demo 10` -> 观测 30min -> `argo
    rollouts promote rollouts-demo` 或 `argo rollouts abort rollouts-demo`。'
  - '- **Nginx 灰度配置**：`split_clients` 基于 `$request_id` 分配版本，`upstream new_version
    { server new:80; } upstream old_version { server old:80; }`。'
  - '- **回滚演练演练单**：季度演练，模拟“新版本导致支付回调失败”，验证：监控告警触发 -> 值班收到 -> 执行 `argo rollouts abort`
    -> 确认流量回切 -> 业务恢复 -> 事后复盘。'
  - '**边界条件**'
  - '- **有状态服务灰度难题**：前端静态资源灰度容易（CDN 缓存+版本化文件名），但后端有状态服务灰度需配合数据库双写/读写分离/消息队列版本兼容，前端灰度策略需与后端发布节奏强绑定。'
  - '- **缓存污染风险**：CDN/浏览器缓存可能导致灰度用户加载旧版本 JS 执行新版本 API（或反之），必须强制资源文件名含 Hash、HTML 不缓存或极短缓存、API
    版本化（Header/URL）。'
  - '- **特性开关技术债**：长期积累的 `if (flag) ... else ...` 会腐化代码库，需建立“旗标生命周期管理”：创建 -> 灰度 ->
    全量 -> 清理旧分支代码 -> 删除旗标，定期扫描僵尸旗标强制清理。'
