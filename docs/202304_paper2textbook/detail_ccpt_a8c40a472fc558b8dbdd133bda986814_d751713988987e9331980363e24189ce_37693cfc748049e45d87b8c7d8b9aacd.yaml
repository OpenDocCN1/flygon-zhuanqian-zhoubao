- 'no': 4
  name: 权限体系（RBAC）与动态路由 —— 让“菜单”和“按钮”听从后端指挥
  points:
  - '**为什么需要这个概念？**'
  - '- 中后台核心诉求：不同角色看到不同菜单、拥有不同操作权限、访问不同页面。硬编码路由/权限会导致发版才能调整权限，无法满足运营/产品“即时生效”的需求。'
  - '- 前端需实现：登录后拉取后端路由树 -> 动态注册路由 -> 递归生成侧边菜单 -> 页面/按钮级指令控制 -> 刷新保持状态（不丢失动态路由）。'
  - '**核心定义**'
  - '- **RBAC (Role-Based Access Control)**：用户 -> 角色 -> 权限/资源 的映射模型。前端持有“权限码”集合（如
    `user:list`, `user:delete`），通过指令 `v-auth="user:delete"` 或函数 `hasAuth(''user:delete'')`
    控制 DOM 渲染。'
  - '- **动态路由 (Dynamic Routing)**：后端返回符合 `RouteRecordRaw` 结构的路由数组（含 `path`, `component`,
    `meta: { roles, title, icon, keepAlive }`），前端通过 `router.addRoute` 动态挂载，配合 `router.removeRoute`
    实现注销登录清理。'
  - '**关键性质**'
  - '- **路由懒加载与代码分割**：后端返回 `component: ''user/management''` 字符串，前端映射为 `() => import(''@/views/user/management.vue'')`，实现按需加载，首屏不加载无权限代码。'
  - '- **刷新保活策略**：动态路由存储于 Pinia（持久化插件），应用初始化 `initRouter()` 从 Store 恢复路由并 `addRoute`，避免
    F5 刷新 404。'
  - '- **401/403 降级体验**：无权限访问页面 -> 403 友好页（含申请权限入口）；Token 失效 -> 401 拦截 -> 记录当前路由 ->
    跳转登录页 -> 登录成功回跳。'
  - '**典型例子**'
  - '- **后端路由数据结构**：`[{ path: ''/user'', meta: { title: ''用户管理'', roles: [''admin'']
    }, children: [{ path: ''list'', component: ''user/list'', meta: { title: ''用户列表'',
    permission: ''user:list'' } }] }]`。'
  - '- **权限指令实现**：`v-auth="[''user:add'', ''user:edit'']"` 满足任一即显示；`v-auth.all="[''admin'',
    ''super'']"` 需同时满足。'
  - '**边界条件**'
  - '- **路由对象序列化陷阱**：`component` 属性不能存函数（无法持久化），必须存字符串路径，前端维护 `componentMap` 映射表。'
  - '- **权限粒度膨胀**：避免定义过细权限码（如 `user:list:export:excel`），建议“资源:动作”二级粒度，细粒度交由后端接口层校验。'
  - '- **微前端子应用权限隔离**：子应用独立路由实例，基座下发全局权限码给子应用，子应用自行过滤自有菜单，避免基座强耦合子应用权限逻辑。'
  sources:
