- 'no': 9
  name: CI/CD 流水线与质量门禁 —— 让“不合格代码”进不了主分支
  points:
  - '**为什么需要这个概念？**'
  - '- 代码规范、类型检查、单测、E2E、构建产物体积、安全扫描、无障碍合规若仅靠人工 Review，漏检率极高且效率低。必须在 CI 流水线设置硬性门禁，自动化拦截不合规提交。'
  - '- 发布流程需标准化：构建 -> 扫描 -> 测试 -> 镜像构建 -> 推送制品库 -> 部署测试环境 -> 人工审批 -> 灰度发布 -> 全量发布
    -> 回滚预案，全程可视、可追溯、可一键回滚。'
  - '**核心定义**'
  - '- **流水线阶段**：`Lint/TypeCheck` (秒级) -> `Unit Test` (分钟级) -> `Build` (产物生成) -> `Security
    Scan` (依赖漏洞/SAST/秘钥扫描) -> `E2E Test` (关键链路) -> `Deploy Staging` -> `Visual Regression`
    (像素对比) -> `Manual Approve` -> `Canary Deploy` -> `Full Deploy`。'
  - '- **质量门禁阈值**：ESLint Error=0 / TypeScript Error=0 / 单测覆盖率≥80%（核心包 95%）/ 关键 E2E
    用例 100% 通过 / LCP<2.5s / CLS<0.1 / INP<200ms / 高危漏洞=0 / axe 违规=0。'
  - '**关键性质**'
  - '- **快速反馈原则**：流水线总耗时<20min（并行矩阵、缓存节点、增量测试），失败即刻通知提交者，防止“红构建”长时间阻塞主分支。'
  - '- **制品不可变性**：构建产物（Docker Image/NPM 包/静态资源包）打上 Git Commit SHA + 语义化版本标签，部署仅拉取制品，绝不在部署阶段二次构建。'
  - '- **GitOps 交付**：ArgoCD 监控 GitOps 仓库（存放 K8s Manifest + Helm Values），集群状态自动收敛至
    Git 声明状态，审计日志完整。'
  - '**典型例子**'
  - '- **GitHub Actions 矩阵策略**：`jobs: lint: runs-on: ubuntu-latest; test: strategy:
    matrix: node: [18, 20] os: [ubuntu, macos]` 兼容性矩阵；`cache: key: ${{ runner.os }}-pnpm-${{
    hashFiles(''pnpm-lock.yaml'') }}` 依赖缓存。'
  - '- **性能预算门禁**：`bundlesize` 配置 `maxSize: ''150 kB''` (gzipped)，`lighthouse-ci`
    预算 `budgets: [{ resourceSizes: [{ resourceType: ''script'', budget: 170 }] }]`，超标阻断
    PR 合并。'
  - '- **安全扫描集成**：`pnpm audit --prod --audit-level=high`、`trivy fs .` (文件系统漏洞扫描)、`gitleaks
    detect` (秘钥泄露)、`syft packages dir:. -o cyclonedx-json` (生成 SBOM)。'
  - '**边界条件**'
  - '- **E2E 环境不稳定导致假阴性**：测试环境依赖后端服务/数据库/第三方 API，需引入 Contract Testing (Pact) 或 Mock
    Server (MSW/Prism) 解耦后端依赖，保证 E2E 确定性。'
  - '- **视觉回归误报**：动画、时间戳、用户头像、广告位导致像素差异，需配置 `mask`/`ignoreRegions`/`threshold` 排除干扰区域，基线图定期人工校验更新。'
  - '- **热修复绕过流水线风险**：生产紧急 Bug 需热修复时，允许 `hotfix/*` 分支简化流程（仅 Lint/TypeCheck/Unit/Build/Deploy），但强制事后补全完整流水线并回合主分支，记录“破例原因”供审计。'
