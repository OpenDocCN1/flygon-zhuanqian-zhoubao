- 'no': 2
  name: Monorepo 仓库初始化与标准化模版 —— 让“新项目创建”变成“npm create enterprise-app”
  points:
  - '**为什么需要这个概念？**'
  - '- 企业级中后台通常包含：主应用、微前端子应用、共享 UI 组件库、共享工具库、共享类型定义、BFF 聚合层、文档站点等多个包，单仓多包（Polyrepo）会导致版本同步地狉、代码复用碎片化、重构跨仓库极其困难。'
  - '- 需要一套标准化的脚手架工具，将最佳实践固化为模版，新项目/新包一键生成，保证工程规范（ESLint/Prettier/Husky/Commitlint/TypeScript
    严格模式/Vite 配置/测试基建）从 Day 1 就到位。'
  - '**核心定义**'
  - '- **Monorepo**：单一代码仓库管理多个关联 Package，利用包管理器（pnpm/yarn/npm）的 Workspace 机制实现依赖链接、提升、锁文件统一。'
  - '- **标准化模版**：包含预置配置的 `package.json`、`.github/workflows`、`.husky`、`.vscode`、`vite.config.ts`、`tsconfig.json`、`.eslintrc.cjs`
    等引导文件的脚手架包（如 `create-enterprise-app`）。'
  - '**关键性质**'
  - '- **依赖去重与磁盘效率**：pnpm 硬链接/符号链接机制，`node_modules` 扁平化，节省 50%+ 磁盘空间，安装速度提升 2-3 倍。'
  - '- **原子化提交与版本联动**：配合 Changesets，单次 PR 可同时版本升级 `@enterprise/ui`、`@enterprise/utils`
    及主应用，生成统一 Changelog。'
  - '- **代码共享零成本**：`import { Button } from ''@enterprise/ui''` 即用，无需发布 npm 再安装，热更新即时生效。'
  - '**典型例子**'
  - '- **目录结构**：`apps/admin-main` (主应用) / `apps/admin-sub-user` (子应用) / `packages/ui`
    / `packages/utils` / `packages/types` / `packages/request` / `packages/config`
    (共享 ESLint/TS/Vite 配置)。'
  - '- **脚手架交互**：`pnpm create @enterprise/app my-new-micro-app -- --framework=vue
    --ui=arco --router=vue-router --state=pinia`，自动生成符合规范的子应用工程。'
  - '**边界条件**'
  - '- **构建性能陷阱**：Monorepo 规模膨胀时，全量构建极慢。必须配合 Turborepo/Nx 实现增量构建、远程缓存、任务编排，仅构建受影响包。'
  - '- **权限隔离难题**：Monorepo 默认全员可读全仓代码，涉及核心算法/加密逻辑/薪资体系等敏感包需拆分至独立私有仓库，通过 npm 私服引入。'
  - '- **包管理器锁定**：团队必须强制统一 pnpm 版本（通过 `packageManager` 字段 + Corepack），禁止混用 yarn/npm
    导致锁文件冲突。'
