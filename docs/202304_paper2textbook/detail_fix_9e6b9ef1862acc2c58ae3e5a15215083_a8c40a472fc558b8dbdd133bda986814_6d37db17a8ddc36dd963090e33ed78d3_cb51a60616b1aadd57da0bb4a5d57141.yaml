  name: 进阶响应式模式 —— 异步状态机、防抖工具与自定义 Ref
  points:
  - '**为什么需要这个概念？**'
  - '- 业务中充斥着异步请求、防抖输入、外部库集成等复杂副作用，直接在组件中写导致逻辑散乱、状态不一致'
  - '- 需要可复用的响应式模式封装“请求-加载-成功-失败”状态机、“防抖/节流”副作用、“自定义触发时机”的响应式变量'
  - '- 标准 ref/reactive 无法表达“仅当条件满足才触发更新”或“读取时才计算”的精细控制'
  - '**核心定义**'
  - '- `useAsyncState`：封装 Promise 执行，自动管理 `loading`/`data`/`error` 三态，支持立即执行/手动触发/轮询/取消'
  - '- `useDebounceFn`/`useThrottleFn`：包装函数返回防抖/节流版本，内部用 `setTimeout`/`requestAnimationFrame`
    管理定时器，组件卸载自动清理'
  - '- `customRef`：工厂函数接收 `track`/`trigger` 手动控制依赖收集与触发时机，返回受控 ref'
  - '**关键性质**'
  - '- 异步状态机：内部用 `ref` 维护状态，`try/catch/finally` 保证状态流转原子性，暴露 `execute`/`cancel` 方法供外部驱动'
  - '- 防抖/节流工具：利用 `effectScope` 或 `onScopeDispose` 绑定组件生命周期，避免内存泄漏；支持 `leading`/`trailing`
    选项控制首尾触发'
  - '- 自定义 Ref：典型用例——防抖 ref(输入 300ms 后同步)、仅脏检查触发、同步本地存储、受控组件桥接'
  - '**典型例子**'
  - '- 搜索框防抖：`const query = useDebouncedRef('''', 300)` 替代手动 watch + setTimeout，模板直接绑定
    `v-model="query"`'
  - '- 数据获取：`const { data, loading, execute } = useAsyncState(fetchUserList)`，模板 `v-if="loading"`
    / `v-else` 渲染列表'
  - '- 受控输入框对接非响应式库：`const value = customRef((track, trigger) => ({ get() { track();
    return extLib.getValue() }, set(v) { extLib.setValue(v); trigger() } }))`'
  - '**边界条件**'
  - '- `useAsyncState` 默认不处理竞态条件(后发先至)，需配合 AbortController 或请求 ID 校验'
  - '- `customRef` 若在 get 中忘记 `track()` 或 set 中忘记 `trigger()` 会导致视图不更新或依赖不收集'
  - '- 防抖函数在组件卸载前触发的回调若访问已销毁的响应式状态会报错，需在回调前检查 `isMounted` 标记'
  - '- `useDebounceFn` 返回的函数丢失了原函数的 `this` 上下文，若原函数依赖 this 需用 `bind` 或箭头函数包装'
  sources:
  - paper: 20230418_036.md
    role: origin
  excerpts:
  - 实现 `useAsyncState` 统一处理 loading/error/data、`useDebounceFn`/`useThrottleFn` 封装副作用、`customRef`
    控制触发时机。
  - 进阶模式：异步状态机、响应式工具函数与自定义 Ref
- 'no': 5
  name: 实战：构建可测试、可追踪的业务级 Hooks 库
  points:
  - '**为什么需要这个概念？**'
  - '- 团队积累的组合式函数散落在各业务目录，缺乏统一规范、类型定义、单测覆盖、文档与发布流程，导致重复造轮子、版本不一致'
  - '- 需要建立类似 `@vueuse/core` 的内部标准库，实现“开箱即用、类型安全、升级无痛、质量可控”'
  - '- 将“个人经验”沉淀为“团队资产”，降低新人上手成本，提升代码复用率'
  - '**核心定义**'
  - '- 目录规范：`packages/hooks/src/useXxx/` 单目录包含 `index.ts`(主入口)、`types.ts`(类型)、`index.test.ts`(单测)、`README.md`(文档)'
  - '- 单元测试策略：使用 `vitest` + `@vue/test-utils` + `effectScope` 模拟组件上下文，测试响应式状态变更、生命周期钩子调用、异步流程、边界异常'
  - '- 文档生成：配置 `typedoc` 或 `vitepress` 自动从 JSDoc/TS 类型生成 API 文档，含参数、返回值、示例代码'
  - '- 发布流程：`changesets` 管理版本日志，`pnpm publish` 发布至私有 npm registry，配合 `semantic-release`
    自动化'
  - '**关键性质**'
  - '- 类型优先：所有对外 API 必须导出 TypeScript 类型，泛型参数支持类型推导，禁止 `any`'
  - '- 零依赖核心：核心 Hooks 仅依赖 `vue`、`@vueuse/shared` 等极少 peerDependencies，避免依赖地狱'
  - '- Tree-shaking 友好：纯 ESM 导出，无副作用导入，支持按需引入 `import { useMouse } from ''@my-org/vue-hooks''`'
  - '- 向后兼容：遵循 SemVer，Breaking Change 仅在 Major 版本，提供代码修改迁移指南'
  - '**典型例子**'
  - '- 目录结构：`@my-org/vue-hooks/useMouse`、`@my-org/vue-hooks/useFetch`、`@my-org/vue-hooks/usePermission`(封装指令/函数双形态)'
  - '- CI 流水线：`lint` → `typecheck` → `test:unit` → `build` → `doc:build` → `changeset
    version` → `publish`'
  - '- 使用侧：`import { useDebouncedRef, useAsyncState } from ''@my-org/vue-hooks''`
    享受全链路类型提示'
  - '**边界条件**'
  - '- 避免过度封装：通用性低、仅单项目使用的逻辑留在业务目录，不纳入通用库'
  - '- 依赖外部 UI 库(如 Ant Design Vue)的 Hooks 应单独拆包(如 `@my-org/vue-hooks-antd`)，避免核心库强依赖
    UI 库版本'
  - '- 测试环境差异：JSDOM 无原生 `ResizeObserver`/`IntersectionObserver`，需 polyfill 或模拟实现'
  - '- 版本锁定：项目锁定 `@my-org/vue-hooks` 具体版本，禁止 `^` 篡改，统一由 Dependabot/Renovate 定期提 PR
    升级'
  sources:
  - paper: 20230418_036.md
    role: origin
  excerpts:
  - 规范目录结构、单元测试策略、文档生成流程，产出团队内部 `@my-org/vue-hooks` 包。
  - 实战：构建可测试、可追踪的业务级 Hooks 库
