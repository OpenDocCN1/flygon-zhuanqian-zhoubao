life_analogy:
- 想象注意力机制是一个**大型国际会议的同声传译与纪要生成系统**：
- '- **Query** = 你手中的“当前议程焦点”提示卡'
- '- **Key** = 每位发言者桌牌上的“发言主题标签”'
- '- **Value** = 每位发言者的“完整发言稿内容”'
- '- **点积相似度** = 你的议程焦点与各发言主题的匹配度打分'
- '- **缩放因子 1/√d** = 会议规模扩大时，防止匹配分数过大导致“只听一个人、完全忽略其他人”（Softmax 饱和/单峰化）的音量调节旋钮'
- '- **Softmax** = 将匹配度转换为“分配给各发言人的专注度权重”'
- '- **加权求和** = 根据专注度权重，拼接生成当前议程的“核心纪要段落”'
- '- **多头注意力** = 同时派遣“语法分析员”、“语义理解员”、“逻辑结构员”三组专家并行记录，最后汇总成全维度会议纪要'
- '- **位置编码** = 给每份发言稿盖上“第几顺序发言”的时间戳章，或标注“紧接上一位/回应第3位”的相对引用标记'
- 正如会议纪要员需根据议程动态聚焦不同发言、并行多视角记录、标注发言顺序，注意力机制也通过 Q/K/V 动态聚合、多头并行、位置注入来建模序列依赖。
summary:
- concept: RNN/CNN 瓶颈
  desc: RNN 串行不可并行、长距离梯度消失；CNN 固定感受野难捕获全局依赖
- concept: Query/Key/Value
  desc: 注意力机制的三个基本角色：提问向量、键向量、值向量，实现基于内容的寻址
- concept: 缩放点积注意力
  desc: 核心公式 Attention(Q,K,V) = Softmax(QK^T/√d_k)V，利用矩阵乘法实现高并行度
- concept: 缩放因子 sqrt(d)
  desc: 抵消点积方差随维度 d 线性增长导致的 Softmax 饱和，保证梯度流动稳定
- concept: 多头注意力
  desc: 将 Q/K/V 投影到 h 个低维子空间并行计算注意力，再拼接投影，捕获多样化依赖关系
- concept: 正弦绝对位置编码
  desc: 用正弦/余弦函数构造确定性位置向量，具备线性关系可外推，但固定不可学习
- concept: 可学习绝对位置编码
  desc: 将位置嵌入作为参数随模型训练，灵活但难外推至训练长度之外的位置
- concept: RoPE 相对位置编码
  desc: 通过旋转矩阵将相对位置信息融入 Q/K 内积，天然支持相对距离建模与长序列外推
- concept: 注意力可视化
  desc: 热力图可直观展示指代消歧、主谓对应等语言现象，但注意力权重不等同于特征归因或因果解释
- concept: 多头张量形状变换
  desc: 从 [batch, seq_len, d_model] 拆分多头 [batch, heads, seq_len, d_k] 再拼接投影回 [batch,
    seq_len, d_model] 的标准化流程
exercises:
- 'no': 1
  title: 手算缩放点积注意力前向传播
  contents:
  - 给定单头注意力输入：
  - Q = [[1, 0, 1], [0, 1, 1]]  (seq_len=2, d_k=3)
  - K = [[1, 0, 0], [0, 1, 0], [1, 1, 1]]  (seq_len=3, d_k=3)
  - V = [[1, 2], [3, 4], [5, 6]]  (seq_len=3, d_v=2)
  - 请按步骤手算（保留 3 位小数）：
  - 1. 计算分数矩阵 S = QK^T
  - 2. 计算缩放分数 S' = S / √d_k (d_k=3)
  - 3. 对 S' 每行做 Softmax 得到注意力权重矩阵 A
  - 4. 计算最终输出 O = A V
  - 思考题：
  - '- 若去掉步骤 2 的缩放因子，当 d_k 增大到 1024 时，Softmax 输出会趋向什么极端分布？梯度会发生什么？'
  - '- 为什么除以 √d_k 而不是 d_k？请从方差角度简述。'
- 'no': 2
  title: 多头注意力张量形状变换实战
  contents:
  - 假设批次大小 batch=4, 序列长度 seq_len=8, 模型维度 d_model=512, 头数 h=8, 头维度 d_k=d_v=64。
  - 输入张量 X 形状为 [4, 8, 512]。
  - 请推导或编写伪代码描述 MultiHeadAttention 前向传播中张量形状的完整变换流程：
  - 1. 线性投影生成 Q, K, V 后的形状
  - 2. 拆分多头后的形状变化
  - 3. 并行计算注意力后的形状
  - 4. 拼接多头后的形状
  - 5. 最终输出线性投影后的形状
  - 思考题：
  - '- 为什么要求 d_model = h * d_k？如果 d_model 不能被 h 整除怎么办？'
  - '- 对比“先拆头再投影”与“先投影再拆头”在参数量与计算量上的异同。'
- 'no': 3
  title: 位置编码外推性实验设计
  contents:
  - 设计一个最小化实验，对比正弦绝对位置编码、可学习绝对位置编码、RoPE 相对位置编码在“长度外推”任务上的表现。
  - 任务：训练一个 2 层小型 Transformer (d_model=64, h=4) 在序列长度 128 的“逆序复制”任务上（输入：随机整数序列，目标：逆序输出）。
  - 实验步骤：
  - 1. 分别使用三种位置编码训练至收敛，记录训练集准确率。
  - 2. 在序列长度 256、512、1024 的测试集上评估（零样本外推），记录准确率曲线。
  - 3. 可视化三种编码在长度 128 与 512 时的位置嵌入相似度热力图（或 RoPE 的旋转角度变化）。
  - 分析问题：
  - '- 哪种编码的外推性能最好？为什么？'
  - '- 可学习绝对编码在长度 256 时为何会急剧失效？'
  - '- RoPE 如何通过旋转矩阵隐式编码相对位置？请写出 Q_i K_j^T 显式包含相对位置 (i-j) 的数学形式。'
- 'no': 4
  title: 注意力可视化的陷阱与正确解读
  contents:
  - 下载一份预训练 BERT-base 的注意力权重（如 HuggingFace `bert-base-uncased`），针对句子 “The animal didn't
    cross the street because it was too tired.” 提取第 5 层第 3 头的注意力矩阵。
  - 操作步骤：
  - 1. 绘制注意力热力图，观察 `it` 与 `animal`/`street` 的注意力分布。
  - 2. 统计该头中 `[CLS]` token 对所有 token 的平均注意力权重。
  - 3. 参考文献（如 Jain & Wallace 2019; Wiegreffe & Pinter 2019），回答：
  - '   - 高注意力权重是否一定意味着模型“依赖”该 token 做预测？'
  - '   - 设计一个对照实验：将注意力权重最高的 token 遮盖，观察模型预测变化；再遮盖权重低但语义关键的 token，对比效果。'
  - '   - 结论：注意力可视化适合作为“现象发现”的探索工具，而非“因果解释”的证据工具。'
units:
- 'no': 1
  name: 序列建模困境与注意力直觉 —— 聚光灯下的动态资源分配
  points:
  - RNN 的串行依赖导致无法并行训练，且长距离梯度易消失/爆炸，难以捕获长程依赖
  - CNN 依赖固定大小的卷积核，感受野有限，难以建模任意距离的 Token 间关系
  - 注意力机制引入“聚光灯”直觉：根据当前 Query 动态计算与所有 Key 的相似度，将计算资源（权重）分配给最相关的 Value，实现基于内容的软寻址
  - 这种动态加权聚合打破了固定窗口与串行瓶颈，是 Transformer 高并行、强建模能力的根基
  sources:
  - paper: 20230418_007.md
    role: motivation
  - paper: 20230418_009.md
    role: motivation
  excerpts:
  - RNN 串行不可并行、长距离梯度消失
  - CNN 固定感受野难捕获全局依赖
  - 注意力像聚光灯：动态分配资源给关键 Token
- 'no': 2
  name: 缩放点积注意力数学形式化 —— 从 Q/K/V 到 Softmax(QK^T/√d)V
  points:
  - 定义 Query/Key/Value 三个向量空间：Q 为提问向量，K 为键向量（标签），V 为值向量（内容）
  - 核心公式：Attention(Q, K, V) = Softmax(QK^T / √d_k) V，其中 d_k 为 Key 向量维度
  - 缩放因子 1/√d_k 的作用：防止点积方差随维度线性增长导致 Softmax 进入饱和区（梯度消失），保证反向传播梯度稳定流动
  - 标准计算流程：QK^T → 除以 √d_k → Row-wise Softmax → 与 V 矩阵乘法 → 输出
  sources:
  - paper: 20230418_010.md
    role: definition
  excerpts:
  - Softmax(QK^T/√d)V 标准形式
  - 缩放因子 sqrt(d) 防梯度消失/爆炸
- 'no': 3
  name: 多头注意力机制 —— 分裂-并行-拼接的多子空间协作
  points:
  - 多头注意力将 Q/K/V 通过线性层投影到 h 个低维子空间（d_k = d_model / h），每个头独立计算注意力
  - “分裂-并行-拼接”流程：输入 [B, L, D] → 投影 → 拆分为 [B, H, L, D/H] → 并行计算 → 拼接为 [B, L, D] → 输出投影
  - 不同头可捕获句法依存、语义角色、相对位置等异构语言学关系，实验表明头间存在功能分化
  - 张量形状变换实战：投影 → reshape/transpose → attention → transpose/reshape → output projection
  sources:
  - paper: 20230418_019.md
    role: method
  - paper: A47Vd3fekoelzRxZpdUcTl9Cn7W.md
    role: method
  excerpts:
  - 分裂-并行-拼接流程
  - 多子空间协作建模
  - 异构关系捕获（句法/语义/位置）
  - 张量形状变换：[B, L, D] -> [B, H, L, D/H] -> [B, L, D]
- 'no': 4
  name: 位置编码方案 —— 绝对与相对的数学权衡
  points:
  - 正弦绝对位置编码：PE(pos, 2i) = sin(pos/10000^(2i/d))，PE(pos, 2i+1) = cos(...)；具有确定性、可外推线性关系、但固定不可学习
  - 可学习绝对位置编码：将位置编码作为模型参数训练，灵活适配数据分布，但难以外推至训练长度之外的位置
  - RoPE 相对位置编码：通过旋转矩阵将位置信息注入 Q/K，使注意力分数显式包含相对距离 (i-j)；天然支持相对位置建模，外推性能优于绝对编码
  - 工程选择建议：短序列/需精确绝对位置用可学习编码；长序列/需外推用 RoPE；追求零参数/确定性用正弦编码
  sources:
  - paper: 20230418_020.md
    role: method
  - paper: B95VdtwByoPXGoxac7Ec1KhQnwc.md
    role: method
  excerpts:
  - 正弦绝对位置编码
  - 可学习绝对位置编码
  - RoPE 相对位置编码
  - Q_i K_j^T 显式包含相对位置 (i-j)
- 'no': 5
  name: 注意力可视化与解读 —— 现象发现 vs 因果解释
  points:
  - 注意力热力图可直观展示指代消歧（如 it→animal）、主谓对应、核心词聚焦等语言学现象
  - 但注意力权重 ≠ 特征重要性/因果解释：高权重不等于模型依赖该 Token，低权重不等于不重要
  - 正确解读姿势：作为探索性工具发现现象，配合消融实验/梯度归因/反事实干预进行因果验证
  - 局限性根源：注意力是模型内部计算机制的副产物，而非面向人类解释设计的归因方法
  sources:
  - paper: 20230418_022.md
    role: experiment
  excerpts:
  - 注意力热力图展示指代消歧/核心词聚焦
  - 局限性：注意力权重 ≠ 特征重要性/因果解释
