  excerpts:
  - 注意力机制本身是排列等变的：打乱输入顺序，输出顺序同步打乱。因此必须注入位置信息。
  - 正弦位置编码：PE(pos, 2i) = sin(pos/10000^(2i/d))，利用三角函数线性组合性质建模相对位置。
  - RoPE (Rotary Position Embedding)：将位置编码融入 Query/Key 的旋转操作中，q_m, k_n 点积仅依赖相对距离 m-n。
  - ALiBi 在注意力分数上直接加偏置：score = QK^T/√d - m·|i-j|，无参数、强外推。
