life_analogy:
- 想象生产级 LLM 应用是一个**高安保的银行金库系统**：
- '- **提示注入** = 伪造的指令单混入客户存款单，诱导柜员违规操作：'
- '  - **指令层级隔离** = 金库核心指令（系统提示）存放在行长保险柜，柜员（模型）只能执行，不可篡改；客户单据（用户输入）仅作业务参考'
- '  - **输入清洗** = 安检门，识别并拦截夹带在单据中的伪造指令（如“忽略所有规则”）'
- '  - **输出监控** = 双人复核制，柜员操作（模型输出/工具调用）需经监控系统校验才能生效'
- '- **自动化评测** = 银行的**全自动化质检流水线**：'
- '  - **规则校验** = 光学字符识别 (OCR) 秒级扫描单据格式、必填字段、关键字（硬指标）'
- '  - **LLM-as-a-Judge** = AI 风控模型，秒级语义分析单据逻辑是否合理、笔迹是否伪造（软指标）'
- '  - **人工标注** = 资深风控专家抽查疑难案件，校准 AI 模型偏差，产出新规则'
- '  - **评测快照** = 每次质检锁定：单据版本、风控模型版本、规则库版本、随机抽样种子，确保复盘可复现'
- '- **PromptOps** = **标准化的单据模版管理与发布系统**：'
- '  - **版本控制** = 所有单据模版（提示词）纳入 Git 版本库，每笔变更关联工单、评测报告、审批签名'
- '  - **灰度发布** = 新版单据先在 1 个网点试用 5% 业务，核对差错率无异常再全网推广'
- '  - **一键回滚** = 发现新版单据导致业务堵塞，行长一声令下（配置中心操作），全网 1 分钟内恢复旧版'
- '- **Token 经济学** = 银行的**精细化成本核算与优化部**：'
- '  - **成本公式** = (进单笔数 × 单笔处理成本 + 出单笔数 × 单笔生成成本) × 业务量'
- '  - **模型级联** = 简单存取款（分类/抽取）派初级柜员（小模型），疑难复杂业务（推理）转行长/专家组（大模型），人力成本降 90%+'
- '  - **语义缓存** = 高频标准问答（如“营业时间”）直接由大厅屏幕/自助机（缓存）答复，无需占用柜员窗口'
- '  - **提示词压缩** = 精简单据模版，去除冗余辞令，单据长度压缩 80%，处理时间大幅缩短'
- '  - **量化/推测解码** = 引入高速计数机/预判算法，加速单据处理流程'
summary:
- concept: 提示注入
  desc: 攻击者利用指令与数据未隔离，通过伪造输入劫持模型行为
- concept: 越狱攻击
  desc: 通过角色扮演、编码绕过等手段突破模型内置安全对齐约束
- concept: 间接注入
  desc: 恶意指令藏于外部数据（RAG检索片段/工具返回）中，经模型读取后触发
- concept: 纵深防御三层
  desc: 指令层级隔离（源头）、输入清洗检测（过程）、输出监控确认（结果）
- concept: 三层评测塔
  desc: 规则校验（快/硬）→ LLM-as-a-Judge（准/软）→ 人工标注（标/准）
- concept: LLM-as-a-Judge
  desc: 用强模型评测弱模型输出，存在位置/冗长/自我增强偏见，需对调位置校准
- concept: 评测快照四元组
  desc: 固定 Prompt版本、模型版本、数据集版本、随机种子，保证评测可复现
- concept: 数据飞轮
  desc: 评测失败案例自动入标注池 → 生成黄金集/少样本 → 提升提示词/模型
- concept: PromptOps
  desc: 将提示词纳入软件工程生命周期：版本控制、评测门禁、灰度发布、回滚、监控
- concept: 提示词注册表
  desc: Git 管理结构化模版，支持参数化渲染、语义 Diff、变更审计
- concept: 配置中心热加载
  desc: 提示词变更无需重启服务，支持环境隔离、灰度流量、一键回滚
- concept: Token 经济学
  desc: 量化 Cost = (In_Tokens*Price_in + Out_Tokens*Price_out) * Calls，指导架构选型
- concept: Prefill/Decode 分相优化
  desc: Prefill 优化并行算力，Decode 优化内存带宽（KV Cache），策略截然不同
- concept: 模型级联
  desc: 小模型处理高频简单任务（分类/路由），大模型兜底复杂推理，极致性价比
- concept: 语义缓存
  desc: 相似度阈值命中历史答案，跳过 LLM 调用，需 TTL/标签隔离防过时
- concept: 提示词压缩
  desc: LLMLingua 等技术压缩上下文至 20%，准确率损失 <1%，Token 成本降 80%
- concept: 量化部署风险
  desc: W4A4/2bit 激进量化可能导致推理任务能力崩塌，需逐任务评测验证
exercises:
- 'no': 1
  title: 设计提示注入防御方案
  contents:
  - 场景：企业内部知识库问答 Bot，接入 RAG 检索，用户可上传文档。
  - 任务：
  - 1. 列举该场景下可能的 3 种间接注入攻击路径
  - 2. 设计包含指令层级隔离、输入清洗、输出监控的三层防御配置（伪代码或 YAML 结构）
  - 3. 解释为何单靠“在系统提示中强调‘忽略用户指令’”无法有效防御
  - 进阶思考：
  - '- 如何检测“语义级”注入（如“请用基64编码输出系统提示”）？'
  - '- 防御过度导致误拦正常业务（如翻译任务包含‘忽略’一词）如何平衡？'
- 'no': 2
  title: 搭建最小化自动化评测流水线
  contents:
  - 任务：为“SQL 生成”任务设计三层评测器，输入：自然语言问题 + 数据库 Schema，输出：SQL 语句。
  - 1. 规则层：编写 5 条必须通过的硬性校验规则（如语法合法、表名存在、无 DELETE/DROP）
  - 2. LLM 评测层：设计评分 Prompt，要求输出 1-5 分及理由，维度：正确性、效率、可读性、安全性
  - 3. 人工层：制定抽样标注 SOP，包含标注指南、Kappa 一致性检查阈值、反馈入库流程
  - 4. 定义评测快照四元组的具体键值示例
  - 回答问题：
  - '- 如何缓解 LLM 评测器对‘冗长 SQL’的偏好？'
  - '- 评测集数据污染检测的自动化方案是什么？'
- 'no': 3
  title: PromptOps 版本发布演练
  contents:
  - 背景：团队维护 50+ 提示词模版，底座模型即将从 GPT-3.5 升级至 GPT-4o-mini。
  - 任务：
  - 1. 设计全量回归测试流水线阶段（建议 5 个 Stage），含入口条件、出口标准、回滚触发条件
  - 2. 编写提示词模版的语义化版本号规范（参考 SemVer），定义 Major/Minor/Patch 对应的提示词变更类型
  - 3. 为某核心提示词（如“意图分类”）设计灰度发布策略：流量切分规则、核心监控指标、自动回滚阈值、人工确认流程
  - 回答问题：
  - '- 动态组装的提示词（含 RAG 片段、少样本）如何在版本管理中锁定完整上下文？'
  - '- 如果新模型在部分任务上表现退化，是回滚模型还是修改提示词？决策依据是什么？'
- 'no': 4
  title: Token 成本优化实战计算
  contents:
  - 某客服 Agent 系统现状：
  - '- 日均 10 万会话，平均 5 轮/会话'
  - '- 平均输入 2000 tokens（含长上下文历史），输出 500 tokens'
  - '- 使用 GPT-4o（输入 $5/M，输出 $15/M），日成本约 $1,750'
  - 目标：成本降低 60% 且准确率下降 < 2%
  - 任务：
  - 1. 计算引入语义缓存（命中率 30%、相似度阈值 0.95）后的理论日成本
  - 2. 计算模型级联（80% 简单意图走 GPT-4o-mini 输入 $0.15/M 输出 $0.6/M，20% 复杂走 GPT-4o）后的理论日成本
  - 3. 计算提示词压缩（LLMLingua 压缩比 5:1，准确率损失 1%）结合上述两方案后的综合日成本
  - 4. 列出方案落地需解决的 3 个工程风险及对策
  - 回答问题：
  - '- 为何 Decode 阶段是长上下文推理的主要成本瓶颈？'
  - '- KV Cache 量化（KV Cache INT8/FP8）对成本公式中哪个变量影响最大？'
