paper: docs/202304/20230418_020.md
desc: 该素材为一篇飞书销售人员发布的推广文案，核心在于将 MCN 行业业务划分为短视频制作、渠道投放、直播电商三大板块，并宣称飞书作为协同办公平台能帮助企业“向内要效率、向外要增量”，通过最佳实践解决上述三大板块的业务痛点，文末附带飞书文档链接及合作伙伴招募信息。
concepts:
- name: MCN 业务三大板块
  desc: 将 MCN 机构的核心业务抽象为短视频制作、渠道投放、直播电商三个核心版块，作为飞书切入提供解决方案的业务边界。
  is_original: false
  excerpt:
  - MCN 行业的业务内容可以总结为 3 大板块：短视频制作、渠道投放、直播电商；
- name: 飞书企业价值主张
  desc: 定义飞书不仅是协同办公工具，更是企业应用平台，核心价值为帮助企业‘向内要效率、向外要增量’。
  is_original: true
  excerpt:
  - 飞书是基于协同办公的企业应用平台，帮助企业向内要效率、向外要增量。
methods:
- name: __overview__
  desc: 采用‘业务板块拆解 + 痛点隐喻 + 平台价值定位 + 最佳实践引流’的销售咨询式营销方法论，通过外部公开文档承载详细解决方案。
  excerpt:
  - MCN 行业的业务内容可以总结为 3 大板块：短视频制作、渠道投放、直播电商；
  - 相信大家在这 3 个版块，或多或少有踩过一些坑，那飞书在这几个方面又有什么最佳实践呢？
  - 欲知详情，还请移步飞书：https://d24gxr9obe.feishu.cn/docx/VQuGd5TikoAEaAxqMSJc4gslnye
theorems:
- name: 飞书可解决 MCN 全链路痛点
  desc: 核心主张飞书针对 MCN 行业短视频制作、渠道投放、直播电商三大核心板块均有最佳实践，能系统性解决业务执行中的‘坑’（痛点)。
  excerpt:
  - 相信大家在这 3 个版块，或多或少有踩过一些坑，那飞书在这几个方面又有什么最佳实践呢？
findings:
- name: 飞书具备合作伙伴渠道销售模式
  desc: '[evidence] 评论区证实飞书支持代理销售/合作伙伴模式，且对合作伙伴有严格准入要求，销售人员可通过官网提交申请。'
  excerpt:
  - '何伟建 : 有的，飞书也有在招合作伙伴，不过对于合作伙伴的要求比较严格就是。'
  - '何伟建 : 可以去官网提交申请'
- name: 目标客户对飞书销售难度存疑
  desc: '[evidence] 评论区用户反馈‘感觉不好卖吧’，侧面印证 MCN 行业客户对 SaaS 协同工具的付费意愿或认知存在门槛。'
  excerpt:
  - '周彦充 : 感觉不好卖吧，业绩怎么样'
