units:
- 'no': 1
  name: 模块化 RAG 流水线 —— 像搭积木一样组装知识计算管线
  points:
  - '**为什么需要这个概念？**'
  - '- 传统 RAG 实现常将加载、分块、嵌入、检索、生成硬编码在一起，难以替换单一环节'
  - '- 业务场景多变（如法律需精准引用、客服需极速响应），要求检索策略可插拔'
  - '- 团队协作需要标准化接口：数据工程师负责索引、算法工程师优化检索、应用工程师调用生成'
  - '**核心定义**'
  - '- 定义标准化 Pipeline 接口：`DocumentLoader/Transformer`（索引侧） -> `VectorStore/Retriever`（检索侧）
    -> `Generator`（生成侧）'
  - '- 每个组件遵循统一输入输出契约（如 LangChain `Runnable` 协议），支持串行、并行、分支编排'
  - '- 核心组件包括：文档加载器、文本分割器、嵌入模型、向量存储、检索器（支持混合检索、父子文档、HyDE）、生成器'
  - '**关键性质**'
  - '- **解耦性**：索引构建与查询服务解耦，支持离线全量/增量索引、在线实时检索独立扩缩容'
  - '- **可组装性**：通过配置或代码即插即用切换策略（如 `BM25Retriever` ↔ `VectorRetriever` ↔ `HybridRetriever`）'
  - '- **可观测性**：每个组件暴露统一指标（延迟、召回数、Token消耗），便于链路追踪与瓶颈定位'
  - '**典型例子**'
  - '- 电商客服场景：索引侧用 `ParentDocumentRetriever`（大块嵌入、小块返回）保留上下文；检索侧配置 `HybridSearch`（关键词
    SKU + 语义意图）；生成侧注入结构化 Prompt 模版'
  - '- 代码助手场景：索引侧用 `CodeSplitter` 按 AST 分块；检索侧启用 `HyDE` 生成假设性代码片段向量化召回；生成侧约束输出 `diff`
    格式'
  - '**边界条件**'
  - '- 组件间接口不匹配（如分割器输出 `metadata` 缺失 `source_id` 导致父子文档关联失败）'
  - '- 过度抽象带来的性能损耗（如多层 `Runnable` 包装导致序列化开销），高吞吐场景需基准测试权衡'
  - '- 状态ful组件（如对话感知的查询重写器）在流水线并行执行时的线程安全问题'
  sources:
  - paper: 20230418_106.md
    role: origin
  - paper: 20230418_109.md
    role: improve
  excerpts:
  - 定义标准化 RAG Pipeline 接口：DocumentLoader/Transformer -> VectorStore/Retriever -> Generator，支持混合检索、父子文档、假设性文档嵌入等高级策略的即插即用组装。
  - 模块化 RAG 流水线：索引、检索、生成的解耦与组装
- 'no': 2
  name: 高级检索策略 —— 从“广撒网”到“精捕捞”的召回与排序组合拳
  points:
  - '**为什么需要这个概念？**'
  - '- 单一向量检索存在“语义鸿沟”：查询与文档表征空间不一致，导致关键词实体（订单号、法条编号）召回率极低'
  - '- Top-K 向量结果噪声大，直接喂给 LLM 易产生幻觉、超出上下文窗口、推理成本高'
  - '- 复杂查询（多跳推理、比较类、汇总类）单次检索无法覆盖完整证据链'
  - '**核心定义**'
  - '- **多路召回**：同步执行稀疏检索（BM25/关键词）与稠密检索（向量），取并集/交集/加权融合（RRF）'
  - '- **重排序**：用 Cross-Encoder 或 LLM 对召回候选集打分重排，利用细粒度交互建模查询-文档相关性'
  - '- **查询理解**：查询重写（改写口语为检索式）、查询分解（拆解多跳问题）、查询路由（选择索引/工具）、HyDE（生成假设性文档向量化检索）'
  - '**关键性质**'
  - '- **召回上界提升**：混合检索通常能使 Recall@10 提升 15%-30%，解决“找不到”的问题'
  - '- **精度下界保障**：重排序将 Top-1 相关文档前置，使 Precision@3 显著提升，解决“排不准”的问题'
  - '- **计算分层**：召回追求高吞吐（毫秒级）、重排追求高精度（百毫秒级），架构上天然分离'
  - '**典型例子**'
  - '- 金融研报问答：用户问“对比2023年各大行净息差变化趋势” → 查询分解为各行子查询 → 混合检索召回表格页 → Cross-Encoder 重排保留含“净息差”表格的
    Chunk → 生成对比表'
  - '- 技术文档排障：用户报错 “OOMKilled” → HyDE 生成假设性解决方案片段 → 向量检索召回相关配置段落 → LLM 重排过滤无关版本 →
    生成修正步骤'
  - '**边界条件**'
  - '- 重排序模型（Cross-Encoder）推理延迟随候选数线性增长，生产环境通常限制候选数 ≤ 50'
  - '- BM25 依赖分词器，中文/代码/混合语言场景需针对性配置分词逻辑（如 Jieba + 保留标识符）'
  - '- HyDE 依赖生成模型能力，小模型生成的假设性文档可能引入幻觉噪声，需配合重排序兜底'
  sources:
  - paper: 20230418_106.md
    role: origin
  - paper: 20230418_110.md
    role: improve
  excerpts:
  - 攻克‘召回不全、排序不准’核心难点：实现 BM25+向量混合检索、Cross-Encoder/LLM 重排序、多查询扩展、查询路由与分解，显著提升检索精度与召回率上界。
  - 高级检索策略：多路召回、重排序与查询理解
- 'no': 3
  name: RAG 评测与数据飞轮 —— 让“无感知优化”变成“有指标迭代”
  points:
  - '**为什么需要这个概念？**'
  - '- RAG 系统参数极多（分块大小、Top-K、重排模型、Prompt模版），凭直觉调参无法收敛'
  - '- 缺乏标准化指标导致“无法对比、无法回归、无法说服业务方上线”'
  - '- 线上真实分布与离线测试集漂移，单靠离线评测会过拟合测试集'
  - '**核心定义**'
  - '- **核心指标体系（RAGAS/ARES）**：忠实度、答案相关性、上下文精确率、上下文召回率、上下文实体召回率'
  - '- **合成测试集生成**：用强模型基于种子文档自动生成 QA 对，覆盖单跳/多跳/不可答/拒答等类型，低成本构建高质量基准'
  - '- **在线评测闭环**：采样真实流量 → LLM-as-Judge/规则/人工标注 → 计算指标 → 触发回归告警/自动触发超参搜索'
  - '**关键性质**'
  - '- **指标正交性**：忠实度（不胡说）与相关性（答对题）可独立优化，需建立 Pareto 前沿而非单一目标'
  - '- **数据飞轮**：线上高质量交互轨迹（用户点赞、修正、追问）自动入库 → 清洗 → 扩充测试集/微调数据 → 模型/提示词迭代 → 线上验证'
  - '- **防作弊机制**：测试集哈希去重、固定随机种子/温度/检索快照、Prompt/模型版本锁定，保证复现性'
  - '**典型例子**'
  - '- 团队建立夜ly评测流水线：每晚用最新代码跑 500 条合成测试集 + 200 条线上精选案例，输出 RAGAS 雷达图，若忠实度下降 > 2% 则阻断合并请求'
  - '- 利用用户“点踩+修正答案”数据，自动构建 DPO 偏好对，微调生成器，使拒答准确率从 78% 提升至 92%'
  - '**边界条件**'
  - '- LLM-as-Judge 存在位置偏好、冗长偏好、自我增强偏见，需校准（如交换位置平均、引入规则硬约束）'
  - '- 合成测试集覆盖率依赖种子文档质量，冷启动阶段种子不足时需人工标注种子集'
  - '- 在线 A/B 测试需流量分桶、统计显著性检验，小流量业务可能样本量不足，需采用序贯检验或贝叶斯方法'
  sources:
  - paper: 20230418_109.md
    role: origin
  - paper: 20230418_136.md
    role: improve
  excerpts:
  - 建立‘可测量即可优化’的评测体系：引入忠实度、答案相关性、上下文精确度/召回率等核心指标，结合合成测试集生成与在线人工反馈，驱动检索策略、分块参数、提示词的持续自动化优化。
  - RAG 评测与数据飞轮：RAGAS、ARES 与自动化迭代闭环
- 'no': 4
  name: Agentic RAG —— 让检索成为 Agent 手中的“瑞士军刀”而非流水线上的“固定工位”
  points:
  - '**为什么需要这个概念？**'
  - '- 固定流水线无法处理“需不需要查”、“查完还要不要查”、“查错了怎么改”这类动态决策'
  - '- 复杂任务（如财报分析、代码库重构）需要多轮检索、工具交替调用、中间结果推理验证'
  - '- 传统 RAG 将检索视为“前置步骤”，实则检索是推理过程中的“中间动作”'
  - '**核心定义**'
  - '- 将检索器封装为 `Tool`（如 `search_knowledge_base`、`query_sql`、`browse_web`），暴露标准化 Function
    Calling Schema'
  - '- Agent 核心循环：`观察(用户查询/上一步结果) -> 思考(CoT/Plan) -> 行动(调用检索工具/计算器/代码执行) -> 验证(结果是否充分/自洽)
    -> 迭代或终止`'
  - '- 关键能力：自主改写查询、判断证据充分性、发现冲突触发二次检索、决定何时停止检索直接回答'
  - '**关键性质**'
  - '- **自适应检索**：简单问题零检索直接答、复杂问题自动分解多子查询并行检索、模糊问题先澄清再检索'
  - '- **推理与检索交织**：检索结果进入推理上下文，推理产出新查询，形成“推理-检索”双螺旋上升'
  - '- **容错与回溯**：检索到错误文档时，Agent 可通过反思识别并发起纠偏检索，而非一条路走到黑'
  - '**典型例子**'
  - '- 多跳问答：“A 公司收购 B 公司的时间是？” → Agent 搜“A 公司收购历史”得知收购了 B/C/D → 判断证据不足 → 搜“B 公司被收购历史”
    → 交叉验证时间一致后回答'
  - '- 代码导航：“这个变量在哪里定义的？” → Agent 搜变量名 → 发现多处赋值 → 判断需看调用链 → 调用 `get_call_graph` 工具
    → 定位定义处 → 回答'
  - '**边界条件**'
  - '- Agent 循环易陷入“死循环”或“工具滥用”，需硬性限制最大步数、Token预算、工具调用频率'
  - '- Function Calling 依赖模型指令遵循能力，小模型（<7B）工具调用成功率低，需微调或用 ReAct 提示词模拟'
  - '- 可观测性压力大：每轮 Thought/Action/Observation 都需完整 Trace，调试排查难度指数级上升，必须配套专用调试平台'
  sources:
  - paper: 20230418_136.md
    role: origin
  - paper: 20230418_140.md
    role: improve
  excerpts:
  - 进化至 Agentic RAG 架构：将检索器封装为 Tool，赋予 Agent 自主决策‘是否检索、检索什么、如何改写查询、如何验证结果’的能力，解决复杂多跳问答与动态知识获取场景。
  - Agentic RAG：让检索成为 Agent 的工具而非固定流程
