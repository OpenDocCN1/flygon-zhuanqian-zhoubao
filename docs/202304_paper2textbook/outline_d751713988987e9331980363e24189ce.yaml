- 'no': 1
  name: 提示工程基石 —— 掌握与大模型对话的底层语法
  desc: 本章建立提示工程的核心认知框架：从定义、核心要素到设计原则，确立“提示即编程”的工程化思维，为后续高阶技法打下基础。
  nodes:
  - 'no': 1
    name: 什么是提示工程
    desc: 界定提示工程的概念边界：它是引导大模型完成特定任务的输入设计艺术，本质是人机交互接口的新范式。
    role: definition
    src:
    - paper: 20230418_011.md
  - 'no': 2
    name: 提示的核心构成要素
    desc: 拆解高质量提示的四大基石——指令、上下文、输入数据、输出指示器，阐述各要素的功能定位与协作关系。
    role: definition
    src:
    - paper: 20230418_012.md
  - 'no': 3
    name: 提示设计的通用原则
    desc: 确立清晰具体、拆解复杂、给予示例、指定格式等黄金法则，从认知负荷视角解释为何这些原则有效。
    role: method
    src:
    - paper: 20230418_013.md
  - 'no': 4
    name: 少样本提示的机理与实践
    desc: 对比零样本与少样本范式，解析演示例如何通过上下文学习激活模型内化的任务模式，包含示例选择、排序与格式化的实战策略。
    role: method
    src:
    - paper: 20230418_014.md
  - 'no': 5
    name: 常见陷阱与迭代优化范式
    desc: 盘点模糊指令、过度约束、幻觉诱导等典型失效模式，建立“评估-诊断-重写”的闭环迭代工作流。
    role: limitation
    src:
    - paper: 20230418_015.md
- 'no': 2
  name: 推理增强技法 —— 激活模型的“系统2”慢思考能力
  desc: 本章聚焦复杂推理任务，系统讲解思维链及其变体如何将隐性推理显性化，攻克多步逻辑、数学计算与常识推理难关。
  nodes:
  - 'no': 1
    name: 思维链：让模型逐步思考
    desc: 从“Let's think step by step”零样本CoT到手工构建演示例的少样本CoT，揭示中间推理步骤对模型性能的决定性提升机制。
    role: method
    src:
    - paper: 20230418_016.md
  - 'no': 2
    name: 自洽性解码：以少数服从多数的鲁棒推理
    desc: 引入温度采样生成多条推理路径，通过答案投票机制修正单路径推理的随机性错误，显著提升数学与符号推理准确率。
    role: method
    src:
    - paper: 20230418_017.md
  - 'no': 3
    name: 知识生成提示：显性化隐性前提
    desc: 在推理前先生成相关知识陈述（如定义、公式、常识），再接入推理主流程，解决模型“知其然不知其所以然”的知识缺失问题。
    role: method
    src:
    - paper: 20230418_018.md
  - 'no': 4
    name: 思维树与思维图：结构化搜索策略
    desc: 超越线性链条，引入树状/图状搜索与状态评估器，支持回溯、分支探索与前瞻规划，攻克战略规划类复杂任务。
    role: extension
    src:
    - paper: AsUTdfb1ioXlpLxltn4cbMfcnNd.md
  - 'no': 5
    name: 推理类提示的失效边界分析
    desc: 实证分析CoT在算术运算长尾、逻辑悖论、幻觉放大等场景的局限，厘清“推理涌现”能力的真实边界。
    role: limitation
    src:
    - paper: EnMvdgCPboEplRxJPdXcMUrznbf.md
- 'no': 3
  name: 智能体架构设计 —— 从单轮问答到自主执行闭环
  desc: 本章构建LLM驱动智能体的系统工程视角：规划、记忆、工具使用三大核心模块的解耦与协作，实现从“生成文本”到“完成任务”的跨越。
  nodes:
  - 'no': 1
    name: 智能体核心架构：大脑、感知与行动
    desc: 定义LLM作为大脑（推理/规划）、记忆模块（短时/长时）、工具调用（行动）、环境反馈（感知）的标准化接口契约。
    role: definition
    src:
    - paper: ETU6dd94wo3ZlMxst46cnwgZn5g.md
  - 'no': 2
    name: 规划与任务分解策略
    desc: 对比ReAct（推理+行动交织）、Plan-and-Solve（先规划后执行）、Reflexion（试错反思）等范式，分析其在复杂任务中的适用边界。
    role: method
    src:
    - paper: FCc1dPLOBosBQIxNgAgctIgDnLg.md
  - 'no': 3
    name: 工具使用与函数调用机制
    desc: 详解Function Calling协议、OpenAPI Schema映射、工具检索与选择算法，以及并行调用、流式返回、错误重试的工程化实现。
    role: method
    src:
    - paper: FgeSdrK4no16NRxepk5cnXUVnvf.md
  - 'no': 4
    name: 记忆系统的分层设计与检索增强
    desc: 设计工作记忆（上下文窗口）、情景记忆（向量检索）、语义记忆（知识图谱）三层架构，解决长时任务的一致性与个性化问题。
    role: method
    src:
    - paper: SnZDdyUsFoxTP0x9wCPcdAX5nWc.md
  - 'no': 5
    name: 多智能体协作与通信协议
    desc: 基于角色扮演与消息传递机制，设计专家委员会、辩论机制、层级分派等协作拓扑，攻解单智能体能力上限。
    role: extension
    src:
    - paper: doxcnk4mqgBMJTv0mklq0eR48fg.md
- 'no': 4
  name: RAG系统工程化 —— 让大模型用好外部知识库
  desc: 本章以生产级RAG（检索增强生成）系统为交付物，覆盖索引构建、检索优化、生成融合、评估迭代全链路，解决幻觉、时效性与私有数据落地难题。
  nodes:
  - 'no': 1
    name: RAG范式演进：从朴素到模块化
    desc: 梳理Naive RAG -> Advanced RAG -> Modular RAG演进脉络，定义检索器、生成器、重排序器、查询重写器等标准化组件接口。
    role: motivation
    src:
    - paper: 20230418_095.md
  - 'no': 2
    name: 文档解析与分块策略的工程抉择
    desc: 对比固定长度、语义分块、层级分块、Agentic Chunking等方案，结合文档类型（PDF/代码/表格）给出最佳实践决策树。
    role: method
    src:
    - paper: 20230418_096.md
  - 'no': 3
    name: 向量索引与混合检索技术
    desc: 深度解析HNSW/IVF索引参数调优，融合稀疏检索（BM25）与稠密检索的混合召回策略，平衡语义匹配与关键词精准命中。
    role: method
    src:
    - paper: 20230418_097.md
  - 'no': 4
    name: 重排序与上下文压缩优化
    desc: 引入Cross-Encoder重排序、LLM-based压缩、关键句提取等后处理手段，在有限上下文窗口内最大化信噪比。
    role: method
    src:
    - paper: 20230418_098.md
  - 'no': 5
    name: 查询重写与路由：理解用户真实意图
    desc: 实现查询扩展（HyDE）、子查询分解、多索引路由、对话历史改写，解决模糊查询、多跳推理、会话上下文依赖等难题。
    role: method
    src:
    - paper: 20230418_099.md
  - 'no': 6
    name: RAG系统的自动化评估体系
    desc: 构建基于RAGAS/ARES框架的忠实度、答案相关性、上下文精确率/召回率指标体系，建立合成测试集与持续集成评估流水线。
    role: experiment
    src:
    - paper: 20230418_100.md
  - 'no': 7
    name: 进阶RAG模式：GraphRAG与Agentic RAG
    desc: 探索知识图谱增强的全局推理能力，以及具备主动检索决策、工具调用能力的智能体化RAG架构。
    role: extension
    src:
    - paper: 20230418_101.md
  - 'no': 8
    name: 生产环境落地：流式响应、缓存与成本控制
    desc: 解决Token流式输出、语义缓存命中、嵌入模型量化、检索并发扩容等工程化挑战，建立SLA保障与成本治理体系。
    role: method
    src:
    - paper: 20230418_102.md
  - 'no': 9
    name: RAG常见失败模式诊断与对策
    desc: 建立“未命中-噪声干扰-生成幻觉-格式错误”四类故障诊断树，配套数据清洗、提示加固、流程兜底的系统性解决方案。
    role: limitation
    src:
    - paper: 20230418_103.md
  - 'no': 10
    name: RAG与微调的协同边界探讨
    desc: 对比RAG（外挂知识）与微调（内化知识）在知识更新频度、领域适配深度、成本延迟等维度的权衡，提出混合部署策略。
    role: extension
    src:
    - paper: 20230418_104.md
  - 'no': 11
    name: 多模态RAG：文档理解与跨模态检索
    desc: 攻克表格结构化解析、图表OCR理解、图像向量化检索等技术难点，构建统一的多模态知识库检索生成管线。
    role: extension
    src:
    - paper: 20230418_107.md
  - 'no': 12
    name: RAG安全与合规：数据脱敏与访问控制
    desc: 设计租户级数据隔离、敏感字段掩码、检索结果权限过滤、审计日志追溯等合规机制，满足企业级数据安全红线。
    role: extension
    src:
    - paper: 20230418_108.md
