life_analogy:
- 想象**教材制作是一场『模块化盖房子』工程**：
- '- **原始素材** = 砖块、沙子、水泥（未加工的建筑原料，堆在那里不成房子）'
- '- **概念卡片** = 预制构件/标准化钢筋笼（经过工厂加工、质检合格、可复用的『中间表示 IR』）'
- '- **四层架构** = 图纸分层：地基图(素材层) -> 构件清单(概念层) -> 结构施工图(结构层/JSON大纲) -> 效果图/交房(呈现层)'
- '- **CDD流水线** = 装配线：原料入厂(聚类) -> 构件生产(提炼) -> 按图纸组装(编排) -> 精装交付(渲染)'
- '- **MECE/金字塔原理** = 结构力学校验：保证承重墙不重叠(相互独立)、房间无遗漏(完全穷尽)、主梁传力路径清晰(核心主张层层分解)'
- '- **教学角色标注** = 构件名牌：承重墙(motivation/definition)、管线(method)、验收报告(experiment/limitation)、预留扩展口(extension)'
- '- **四级溯源链** = 质检档案：效果图上任一构件 -> 追溯构件单号(概念卡片) -> 追溯生产批次(文献卡片) -> 追溯原材料产地(原始素材)'
- 想象**提示词工程是一场『驯养天才神童』的教育实践**：
- '- **GPT** = 3岁智商250的天才神童（原始知识粗浅、学习极快、一教就会）'
- '- **用户/提示词工程师** = 老师而非老板（分步教学、耐心纠错、喂养榜样、设定规则）'
- '- **身份设定** = 给神童发工牌（''你是小红书标题党专家''）'
- '- **方法论注入** = 教核心公式（二极管标题法：正/负刺激公式+进化心理原理）'
- '- **案例库喂养** = 给榜样题（同行高赞标题10个，引导举一反三）'
- '- **关键词修正** = 定校规（20字以内+40词库强制植入，适配平台调性）'
- '- **方法论单一化** = 别塞多本参考书，一本透彻胜过十本浅读'
- '- **案例本地化** = 必须用目标平台真题（小红书同行笔记），捕捉当下语感'
- '- **Prompt Library** = 老师沉淀的教案库（可复用、可变现、核心生产资料）'
- 就像教育神童需循序渐进、因材施教，垂类大模型定制也需结构化训练、平台化适配。
summary:
- concept: 收藏夹谬误
  desc: 误以为保存/高亮/转发信息等于掌握知识，实则缺乏深度加工无法形成长期记忆
- concept: 卡片盒笔记法
  desc: 以原子化卡片、显性链接理由、自底向上生成为核心原则的知识管理与写作工作流
- concept: 三类卡片
  desc: 闪念卡片捕捉灵感、文献卡片改写理解、概念卡片综合创新并作为教材工程的中间表示(IR)
- concept: 教材工程化
  desc: 将软件工程（模块化、版本控制、CI/CD）映射到教材开发全流程，实现内容与形式分离
- concept: 四层架构
  desc: 素材层(原始输入) -> 概念层(知识原子) -> 结构层(大纲骨架) -> 呈现层(多形态交付)
- concept: 概念卡片驱动开发(CDD)
  desc: 标准化流水线：聚类素材 -> 提炼概念卡片 -> 编排大纲节点 -> 渲染章节，概念卡片为唯一IR
- concept: 大纲即代码
  desc: Chapter-Node二级JSON Schema，强制隐喻类比式双段式标题与教学角色标注，实现机器可读与自动化校验
- concept: 认知负荷理论
  desc: 大纲设计必须服务于『图式构建』而非『信息罗列』，控制内在/外在/关联认知负荷
- concept: MECE原理
  desc: 章节划分需『相互独立、完全穷尽』，配套正交性检查表防止知识点耦合与遗漏
- concept: 金字塔原理
  desc: 自上而下表达、自下而上思考：先定核心主张，再纵向提问/横向归纳分解节点，保证逻辑闭环
- concept: 七大教学角色
  desc: motivation/definition/method/proof/experiment/limitation/extension，强制每节点各司其职防止结构性缺失
- concept: 四级溯源链
  desc: 大纲节点 <- 概念卡片 <- 文献卡片 <- 原始素材，src字段支持通配符，保证内容可验证与学术严谨性
- concept: 语义化版本控制
  desc: 引入SemVer：Major=重构逻辑，Minor=新增知识点，Patch=修正细节，建立教材变更日志规范
- concept: 提示词分层训练法
  desc: 四步渐进式训练：身份设定 -> 方法论注入(二极管标题法) -> 少样本学习(案例库) -> 平台化约束优化(字数/关键词)
- concept: 二极管标题法
  desc: 基于进化心理学的标题公式：正面刺激(产品/方法+短期低成本+逆天效果)与负面刺激(不做某事+巨大损失+紧迫感)
- concept: 平台爆款关键词库
  desc: 针对小红书提炼的40个高权重词（如好用到哭/教科书般/宝藏/YYDS），强制植入1-2个且≤20字
- concept: 对话式训练/胎教式训练
  desc: 把自己当成老师而非老板：分步教学、耐心纠错、喂养榜样、设定规则，而非一次性投喂超长Prompt
- concept: 方法论单一化原则
  desc: 给GPT喂方法时'不要多，一个就好'；过多方法论干扰注意力机制，需换法则重开会话训练新模型
- concept: 案例来源本地化原则
  desc: 案例库必须来源于目标平台同行高赞笔记，建议亲自刷5-10分钟手工录入，捕捉平台最当下的'语感'与'调性'
- concept: AI变现路径：卖词集而非号或课
  desc: GPT入门教程因信息差消失而贬值；真正资产是沉淀的可复用专业提示词集，核心生产资料持续变现
exercises:
- 'no': 1
  title: 练习1：从『收藏』到『卡片』的转化实战
  contents:
  - 选取一篇你近期收藏但未深读的技术文章（或提供的一篇约 2000 字素材）：
  - 1. 写出 3 张『文献卡片』：每张卡片用自己语言复述一个核心论点，注明出处段落，并在卡片底部写下『这让我想起了……』建立至少 1 个显性链接（含链接理由）。
  - 2. 基于上述文献卡片，提炼 1 张『概念卡片』：融合你的已有知识，形成一个可独立复用的原子化观点，标题采用『隐喻/类比 + 核心主张』双段式。
  - 3. 反思记录：对比『仅收藏链接』与『写完这三张卡片』在认知投入、理解深度、后续复用便利性上的差异。
- 'no': 2
  title: 练习2：教材大纲的『MECE 正交性』与『金字塔』压力测试
  contents:
  - 给定一个拟写教材的主题（如『RAG 系统工程化』或『前端性能优化』），并假设你已有一组 15-20 个候选知识点（可自行列出或从第 4/8 章节点提取）：
  - 1. 尝试用 MECE 原理将其划分为 4-5 个章（Chapter），产出 Chapter 列表与归属映射表。
  - 2. 对照『章节正交性检查表』自查：是否存在知识点跨章重复（耦合）？是否有核心子主题遗漏（盲区）？
  - 3. 运用金字塔原理，为每个 Chapter 写出『核心主张』（一句话），并演示『纵向提问 -> 横向归纳』分解出 3-4 个 Node（节点）的过程。
  - 4. 为每个 Node 标注教学角色，检查是否覆盖 motivation/definition/method/experiment/limitation 至少
    4 种角色。
- 'no': 3
  title: 练习3：最小化 CDD 流水线与四级溯源链构建
  contents:
  - 使用 Obsidian/Logseq 或纯文本文件模拟工程环境，完成一次微型『从素材到大纲』闭环：
  - 1. **素材层**：放入 3 篇相关主题的 Markdown 素材（文件名规范化）。
  - 2. **概念层**：创建 5-8 个概念卡片文件（YAML Frontmatter 包含 id, title, tags, source_refs），内容来自素材改写与综合。
  - 3. **结构层**：编写一份符合 JSON Schema 的 `outline.json`（包含 Chapter 与 Node），Node 必须引用概念卡片
    id（作为 IR），并标注 role 与 src（指向素材文件名/通配符）。
  - 4. **呈现层**：编写一个简单的 Python/Node.js 脚本，读取 `outline.json` 自动生成一份 Markdown 格式的『教学大纲草稿』（含章标题、节标题、角色标签、溯源链接）。
  - 5. **版本控制**：初始化 Git 仓库，提交上述所有文件，打标签 `v0.1.0`，并写一条符合约定式提交规范的 Commit Message。
  - 思考题：若素材更新导致某概念卡片定义变更，上述流水线中哪些环节需自动化级联更新？如何设计脚本实现？
- 'no': 4
  title: 练习4：教学角色标注的『反模式』识别与重构
  contents:
  - 下面是某教材章节的 3 个节点描述（故意包含结构性缺陷）：
  - '- 节点 A：详细列举了 Transformer 的 15 个超参数默认值及含义。'
  - '- 节点 B：讲解『注意力机制解决了 RNN 的长距离依赖问题』，并给出数学推导。'
  - '- 节点 C：展示一个完整的 PyTorch 训练脚本，包含数据加载、模型定义、训练循环、日志记录。'
  - 任务：
  - 1. 识别每个节点当前的隐性教学角色，并指出其结构性缺陷（如：A 纯定义堆砌缺 motivation/limitation；B 混合 motivation
    与 method 且无 experiment 验证；C 纯 experiment 缺 method 原理支撑与 limitation 边界）。
  - 2. 为该章节重新设计 5-6 个节点，严格遵循七大角色标注体系，确保角色分布合理、逻辑递进（motivation -> definition -> method
    -> experiment -> limitation -> extension），并给出每个节点的核心主张一句话。
- 'no': 5
  title: 练习5：GPT『天才神童』驯养实战——小红书爆款标题生成器训练
  contents:
  - 目标：使用『提示词分层训练法』将 GPT 训练为小红书爆款标题专家，验证『方法论单一化』与『案例本地化』原则。
  - 步骤：
  - 1. **身份设定**：在新会话中发送 System Prompt：'你是一名专业的小红书标题党专家，我会以"请学习"为开头传授技巧，以"请根据以下内容帮我取个标题"为开头请求生成，输出2-3个标题。明白请回复："好的，很高兴帮助你，我将按照你说的成为你的小红书标题党专家。"'
  - 2. **方法论注入**：发送 '请学习：二极管标题法。基本原理：人类厌恶损失、负面偏误、省力法则、及时享受。正面刺激公式：产品/方法+只需1秒(短期)+便可开挂(逆天效果)。负面刺激公式：你不XXX+绝对会后悔(天大损失)+(紧迫感)。请学习总结。'
    观察 GPT 是否复述公式与原理。
  - 3. **案例库喂养**：亲自刷小红书 5 分钟，手工录入 10 个高赞笔记标题（含Emoji/钩子/节奏），发送 '请学习总结：[粘贴10个标题] 请总结这些标题吸引人的特点，并且学会举一反三。'
  - 4. **平台化约束优化**：发送 '你写得不错，但有要求：第一、控制字数在20字以内；第二、选取下面40个爆款关键词的1-2个穿插到标题中：[好用到哭、教科书般、宝藏、YYDS、吐血整理、家人们、正确姿势...共40词]。'
  - 5. **验证测试**：输入 '请根据以下内容帮我取个标题：ChatGPT是OpenAI推出的大语言模型...' 对比三步(无关键词修正)与四步输出，记录差异。
  - 6. **复盘记录**：对比输出是否具有'小红书原生感'(关键词植入/语气/Emoji/节奏)，反思『方法论单一化』与『案例本地化』对结果的影响。
- 'no': 6
  title: 练习6：个人 Prompt Library（词集）资产化构建
  contents:
  - 目标：基于『AI变现路径：卖词集而非号或课』原则，建立你的垂类提示词资产库。
  - 步骤：
  - 1. **盘点高频任务**：列出你日常用 GPT 处理的 5-10 个垂类任务（如：小红书选题/文案/标题、抖音口播脚本、公众号排版、跨境电商邮件、代码重构等）。
  - 2. **标准化模板化**：对每个任务，按『身份设定+方法论+案例库+平台约束』四层结构编写标准 Prompt 模板，存入 Notion/Obsidian/语雀等知识库。
  - 3. **版本化管理**：为每个模板建立版本号（v1.0/v1.1...），记录迭代原因（如：新增平台关键词/修正幻觉案例/优化Token消耗）。
  - 4. **压力测试**：针对每个模板设计 3 个边界测试用例（极长输入/歧义指令/对抗性提示），验证鲁棒性。
  - 5. **资产化产出**：将成熟模板（通过压力测试）整理为『Prompt Library v1.0』文档，包含：任务分类、适用场景、核心Prompt、测试用例、版本日志、变现建议（卖词集/包课程/做工具）。
  - 思考题：如何设计『Prompt Library 的自动化评估流水线』？提示：可引入『黄金标准输出集』+『自动化打分脚本』+『回归测试触发机制』。
units:
- 'no': 1
  name: 认知重塑 —— 从「被动接受」到「主动建构」知识体系
  points:
  - '**为什么需要这个概念？**'
  - '- 传统笔记法（如单纯记录、高亮、转发、收藏）制造了“收藏夹谬误”，让人误以为保存了知识就等于拥有了知识，实则无法形成长期记忆与深度理解'
  - '- 大脑不是存储硬盘，而是处理器；知识必须经过主动加工（连接、结构化、复盘）才能内化为认知结构（图式）'
  - '- 面对信息过载，缺乏一套标准化的“外部大脑”工作流，无法将海量素材转化为可复用的知识资产'
  - '**核心定义**'
  - '- 卡片盒笔记法 是一种知识管理与写作工作流，核心在于将信息拆解为原子化的卡片，通过显性链接建立网络化知识结构，最终自底向上生成文章或教材'
  - '- 它区分三类卡片：闪念卡片（捕捉灵感）、文献卡片（改写他人观点）、概念卡片（综合生成自有洞见）'
  - '**关键性质**'
  - '- 原子化：每张卡片只包含一个核心观点，便于自由组合与链接'
  - '- 链接优于收藏：链接必须书写“链接理由”（为什么相关），而非简单打标签，强迫大脑进行关联思考'
  - '- 自底向上生成：不预设大纲，通过卡片聚类自然长出主题，再生成结构'
  - '- 写作即思考：卡片写作过程本身就是深度加工过程，倒逼输入质量'
  - '**典型例子**'
  - '- 尼克拉斯·卢曼凭借 9 万张卡片出版 70 本书、400 篇论文，展示了该方法的规模化产出能力'
  - '- 使用 Obsidian/Logseq 建立双向链接笔记库，从文献卡片提炼概念卡片，最终自动生成书籍大纲'
  - '**边界条件**'
  - '- 卡片不是碎片：原子化不等于碎片化，卡片需保留完整上下文与论证逻辑，不可随意截断'
  - '- 链接不是标签：单纯添加 #标签 无法触发深度加工，必须写出自然语言的关联解释'
  - '- 工具陷阱：过度折腾软件功能（插件、主题、图谱美化）而忽视卡片内容生产，是典型的“生产力色情”反模式'
  - '- 启动成本高：前期需建立“文献卡片→概念卡片”的肌肉记忆，短期内产出感弱，易放弃'
  sources:
  - paper: 20230418_000.md
    role: origin
  - paper: 20230418_001.md
    role: improve
  - paper: 20230418_079.md
    role: apply
  - paper: README.md
    role: improve
  excerpts:
  - 知识不是被灌输的，而是通过主动连接、结构化组织与持续复盘主动建构出来的。
  - 对比「收藏夹谬误」与「编译器思维」，揭示单纯记录、高亮、转发无法形成长期记忆与深度理解的认知机制。
  - 定义「原子化」、「链接优于收藏」、「自底向上生成」三大核心原则，确立从素材到概念卡片的标准化工作流。
  - 区分「闪念卡片」（捕捉）、「文献卡片”（理解/改写）与「概念卡片”（综合/创新）的定位、写法及演进路径。
  - 论证「写作是思考的结果，更是思考的过程」，展示如何通过卡片写作倒逼深度阅读，实现输入驱动输出。
  - 辨析「原子化」与「碎片化」的本质区别，指出单纯加标签、不写链接理由、忽视上下文关联的典型反模式。
- 'no': 2
  name: 教材工程化 —— 像开发软件一样构建教程
  points:
  - '**为什么需要这个概念？**'
  - '- 传统教材开发面临“难维护、难复用、难迭代、授课脱节”四大痛点：Word二进制格式难版本控制、内容与排版耦合、跨形态交付（PDF/网站/课件）需人工重排、缺乏自动化质量门禁'
  - '- 教材生命周期长、多作者协作、需多版本并行（学生版/教师版），极其类似软件工程场景，引入工程化范式可复用成熟工具链'
  - '- 解决“内容即代码”的版本管理、协作审查、自动化构建、多端一致性交付问题'
  - '**核心定义**'
  - '- 教材工程化 是将软件工程中的模块化、版本控制、CI/CD、需求分析思想，映射到教材开发全流程（素材采集→概念提炼→大纲编排→章节撰写→多形态发布）的方法论'
  - '- 核心主张：教材源文件采用纯文本格式纳入 Git 管理，建立四层架构（素材层/概念层/结构层/呈现层），实现内容与形式分离'
  - '**关键性质**'
  - '- 四层架构解耦：素材层存原始输入，概念层存知识原子（概念卡片），结构层存大纲逻辑骨架，呈现层渲染最终交付物'
  - '- 概念卡片驱动开发（CDD）：概念卡片作为连接素材与大纲的唯一“中间表示（IR）”，标准化流水线：聚类素材→提炼概念卡片→编排大纲节点→渲染章节'
  - '- 大纲即代码：章节结构用 JSON Schema 定义（Chapter-Node 二级结构），强制隐喻类比式标题、教学角色标注，实现机器可读与自动化校验'
  - '- 语义化版本控制：引入 SemVer，Major=重构章节/逻辑重组，Minor=新增知识点/节，Patch=修正错别字/格式，配套 CHANGELOG'
  - '**典型例子**'
  - '- 使用 Markdown/AsciiDoc 编写源文件，Git 管理历史，GitHub Actions 配置 Pandoc/Quarto 流水线，一键生成
    PDF教材、教师版教案、交互式网站、Reveal.js 幻灯片'
  - '- 大纲 JSON 自动校验：CI 检查每个 Node 是否包含 role 字段、Chapter 标题是否符合双段式规范'
  - '**边界条件**'
  - '- 学习曲线陡峭：要求作者具备 Git、Markdown、CI/YAML、JSON Schema 基础，非技术背景作者需额外培训或工具封装'
  - '- 非结构化内容处理难：访谈记录、手绘草图、复杂排版需求（如教材专用版式）在纯文本流程中处理成本高，需引入扩展语法或预处理脚本'
  - '- 协作冲突解决：Git 冲突在文本层面易解决，但语义层面的逻辑冲突（如两人同时修改同一概念定义）仍需人工协商，工具无法完全替代沟通'
  sources:
  - paper: 20230418_001.md
    role: origin
  - paper: README.md
    role: improve
  - paper: SUMMARY.md
    role: improve
  - paper: 20230418_079.md
    role: apply
  excerpts:
  - 类比软件工程，论证教材源文件应采用 Markdown/AsciiDoc 等纯文本格式，纳入 Git 版本控制，实现内容的可追溯、可协作、可自动化构建。
  - 定义教材工程的标准化分层架构：素材层（原始输入）、概念层（知识原子）、结构层（大纲/逻辑骨架）、呈现层（PDF/网站/课件），实现内容与形式分离。
  - 推演「聚类素材 -> 提炼概念卡片 -> 编排大纲节点 -> 渲染章节」的标准化工程流水线，确立概念卡片作为连接素材与大纲的唯一「中间表示（IR）」。
  - 规定 Chapter-Node 二级结构的 JSON Schema，强制要求章标题采用「隐喻类比式」双段式、节点必须标注教学角色，实现大纲的机器可读与自动化校验。
  - 配置 Pandoc/Quarto/GitHub Actions 自动化流水线，一键生成学生版教材、教师版教案、交互式网站、幻灯片，保证多端内容一致性。
  - 引入 SemVer 语义化版本控制至教材，定义 Major/Minor/Patch 对应的内容变更类型（重构章节/新增知识点/修正错别字），建立变更日志规范。
- 'no': 3
  name: 逻辑架构师 —— 为知识搭建可执行的认知脚手架
  points:
  - '**为什么需要这个概念？**'
  - '- 多数教材大纲只是“知识目录”的堆砌（百科全书式），而非“教学导向”的认知路径，导致学习者认知过载、无法构建图式'
  - '- 缺乏结构化设计方法论：章节划分随意（耦合/遗漏）、核心论点模糊、知识点角色不清（全是定义、缺动机、无案例）、素材溯源断裂'
  - '- 需要一套可操作、可检查、可溯源的逻辑建模工具集，将散乱素材重组为具有教学张力的逻辑骨架'
  - '**核心定义**'
  - '- 逻辑架构师 是教材策划中的核心角色/技能集，指运用 MECE、金字塔原理、认知负荷理论、教学角色标注体系、素材溯源链，将非结构化素材转化为结构化、可执行、可验证的教学大纲的方法论'
  - '- 核心产出：符合 JSON Schema 的大纲文件，包含 Chapter（双段式标题）与 Node（教学角色、溯源 src）两级结构'
  - '**关键性质**'
  - '- 认知负荷导向：大纲服务于“图式构建”而非“信息罗列”，通过分块、脚手架、渐进式复杂度控制内在/外在/关联认知负荷'
  - '- MECE 正交性检查：章节划分需“相互独立、完全穷尽”，配套检查表防止知识点重叠与遗漏'
  - '- 金字塔原理反向导出：先定核心主张，再纵向提问/横向归纳分解节点，保证逻辑闭环（自上而下表达、自下而上思考）'
  - '- 七大教学角色标注：motivation/definition/method/proof/experiment/limitation/extension，强制每个节点“各司其职”，防止结构性缺失'
  - '- 四级溯源链：大纲节点 ← 概念卡片 ← 文献卡片 ← 原始素材，src 字段支持通配符引用，保证内容可验证、学术严谨'
  - '**典型例子**'
  - '- 本次任务即为实战案例：从 30 个原始 Markdown 素材出发，聚类提炼概念卡片，逻辑聚类成 6 章，标注教学角色定节点，类比命名定章名，最终输出标准化
    JSON 大纲'
  - '- 章节命名对比：普通“注意力机制” → 类比式“注意力机制 —— 让模型学会‘看哪里’；普通“RAG系统” → 类比式“RAG系统工程化 —— 从‘召回文档’到‘知识计算’”'
  - '**边界条件**'
  - '- MECE 在软性知识领域难绝对达成：人文社科、交叉学科知识点天然耦合，强行正交会破坏知识内在联系，需允许“受控重叠”并显性标注'
  - '- 金字塔原理依赖“核心主张”的清晰度：探索性、前沿性领域若核心主张尚未稳定，自上而下易变成“强行扣帽子”，需采用自底向上聚类为主'
  - '- 角色标注可能僵化：真实教学中一个知识点常兼具 motivation 与 definition，强制单一角色会扭曲表达，建议支持主次角色标注'
  - '- 溯源链维护成本高：四级链条任一环节变更（如素材更新、概念卡片合并）需级联更新上层大纲，需工具链自动化支撑（如知识图谱数据库）'
  sources:
  - paper: 20230418_000.md
    role: origin
  - paper: 20230418_001.md
    role: improve
  - paper: SUMMARY.md
    role: apply
  - paper: 20230418_079.md
    role: improve
  excerpts:
  - 对比「百科全书式」与「教学导向式」目录差异，引入认知负荷理论，论证大纲必须服务于「图式构建」而非「信息罗列」。
  - 演示如何用「相互独立、完全穷尽」原则审视章节划分，避免知识点重叠（耦合）与遗漏（盲区），配套「章节正交性检查表」。
  - 实操「自上而下表达、自下而上思考」：先定本书/章的「核心主张」，再通过纵向提问/横向归纳分解为节点，保证逻辑闭环。
  - 详解 motivation/definition/method/proof/experiment/limitation/extension 七大角色的定义、识别标准及组合模式，防止「全是定义」「缺乏动机」「无案例支撑」的编写弊病。
  - 建立「大纲节点 <- 概念卡片 <- 文献卡片 <- 原始素材」的四级溯源链，规范 src 字段引用格式（支持 author:xxx/** 通配），保证教材内容的可验证性与学术严谨性。
  - 以本次任务素材为例，全程复盘：原始 Markdown 聚类 -> 概念卡片提炼 -> 逻辑聚类成章 -> 角色标注定节 -> 类比命名定章 -> JSON
    规范化输出的决策链路。
- 'no': 4
  name: 提示词工程进阶 —— 从『驯养神童』到『垂类专家』的系统化训练范式
  points:
  - '**为什么需要这个概念？**'
  - '- 通用大模型虽强但泛泛之谈，垂类任务需结构化训练才能落地；直接投喂超长 Prompt 易致幻觉、遗忘、偏离任务'
  - '- 缺乏标准化训练范式：多数人把 GPT 当百科全书/聊天机器人用，未建立『老师-神童』协作范式，导致输出质量不可控'
  - '- 提示词资产沉淀缺失：高质量 Prompt 分散在聊天记录中，无法复用、迁移、版本化、资产化变现'
  - '**核心定义**'
  - '- 提示词分层训练法 是一种将复杂指令拆解为身份设定、方法注入、案例微调、规则约束四个顺序步骤，通过多轮对话渐进式训练大模型完成特定垂类任务的提示词工程范式'
  - '- 二极管标题法 基于进化心理学（损失厌恶、负面偏误）和人性弱点（省力法则、及时享受）设计的标题创作公式，包含正面刺激公式（产品/方法+短期低成本+逆天效果）和负面刺激公式（不做某事+巨大损失+紧迫感）两种模式'
  - '- 平台爆款关键词库 针对目标平台（如小红书）提炼的 40 个高权重关键词，要求生成标题时强制穿插 1-2 个，并控制在 20 字以内，以适配平台推荐算法与用户阅读习惯'
  - '**关键性质**'
  - '- 对话式训练/胎教式训练：把自己当成老师而非老板，通过持续上下文修正（而非一次性投喂超长提示词）来纠正模型偏差（如 GPT-4 的“阿兹海默症”遗忘问题）'
  - '- 方法论单一化原则：给 GPT 喂方法时“不要多，一个就好”；过多方法论会干扰模型注意力机制，导致生成质量下降。若需更换方法，建议重新开启会话训练新模型'
  - '- 案例来源本地化原则：案例库必须来源于目标平台（小红书）的同行高赞笔记，而非通用语料；建议亲自刷 5-10 分钟高赞笔记手工录入，以捕捉平台最当下的“语感”与“调性”'
  - '- AI 变现路径：卖“词集”而非“号”或“课”：GPT 入门教程因信息差填平而贬值；真正资产是沉淀的、可复用的、面向专业场景的提示词集，这是核心生产资料，具有持续变现价值'
  - '**典型例子**'
  - '- 小红书标题专家训练全流程：角色设定(专家) -> 方法注入(二极管标题法) -> 案例喂养(同行高赞10标题) -> 关键词修正(20字/40词库)
    -> 输出具原生感标题'
  - '- 三步训练(无关键词修正)生成标题虽符合公式但缺乏“平台味儿”；四步修正后标题含爆款词(宝藏/吐血整理/YYDS)、≤20字、强平台感'
  - '- 方法论单一化验证：给 GPT 喂 3 种标题法，输出质量下降；换单一方法重新训练，质量回升'
  - '- 案例本地化验证：用通用语料喂养生成的标题语感偏差；用小红书同行高赞笔记喂养，输出符合平台当下调性'
  - '**边界条件**'
  - '- GPT 非百科全书：定位为提升投产比的生产力工具，而非知识检索工具；价值在于配合专业流程解决具体业务问题'
  - '- 上下文窗口限制：长对话存在“遗忘曲线”（仅记得最后 2-3 轮），需通过 Prompt Library 离线沉淀、标准化喂料流程规避'
  - '- 模型版本差异：GPT-3.5/4/4o 在指令遵循、推理深度、上下文长度上有差异，训练范式需适配具体模型特性'
  - '- 法律合规边界：生成内容需人工审核事实性、版权、敏感词；AI 输出不可直发，必须引入“三重介入机制”'
  sources:
  - paper: XxczdnuchoE7JtxZrO8cn4eGncb
    role: origin
  excerpts:
