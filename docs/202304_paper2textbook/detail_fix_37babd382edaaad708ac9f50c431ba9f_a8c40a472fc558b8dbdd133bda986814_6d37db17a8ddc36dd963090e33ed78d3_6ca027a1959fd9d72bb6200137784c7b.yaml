    role: origin
  excerpts:
  - JS-Wasm 互操作深度：数值/字符串/对象传递开销、共享内存、WebIDL Bindings 与 wasm-bindgen
  - 量化跨边界调用成本、利用 `SharedArrayBuffer` 共享线性内存、wasm-bindgen 实现高级类型零拷贝传递、避免频繁边界跨越
- 'no': 4
  name: 前沿提案与生产实践 —— Wasm 从“计算沙箱”进化为“通用运行时”
  points:
  - '**为什么需要这个概念？**'
  - '- MVP 版本仅支持基础数值类型、无 GC、无多线程、无异常处理，无法高效承载 Java/Go/Kotlin 等托管语言'
  - '- 计算密集型不足以覆盖完整应用逻辑，需解决组件组合、系统接口标准化、边缘部署等工程化缺口'
  - '- 新硬件能力（SIMD、GPU 计算）需标准指令集暴露而非厂商私有扩展'
  - '**核心定义**'
  - '- SIMD (v128)：128 位向量类型 + 100+ 指令，单指令多数据流加速图像/音频/ML 推理，主流浏览器已稳定'
  - '- 多线程：Wasm 线程 = Web Worker + SharedArrayBuffer + Atomics，支持 pthread 语义，实现真并行'
  - '- GC (WasmGC)：引入 struct/array 引用类型、栈扫描、精确 GC 接口，让托管语言无需自带运行时'
  - '- 组件模型：基于 Interface Types 定义语言无关的组件接口，支持跨语言链接、能力安全的组件组合'
  - '- WASI (WebAssembly System Interface)：标准化文件/网络/时钟/随机数等系统调用，实现“Write Once, Run
    Anywhere”'
  - '**关键性质**'
  - '- SIMD 需检测硬件支持回退标量，wasm-feature-detect 运行时特性探测'
  - '- 多线程受限于 COOP/COEP 部署要求，移动端 Safari 支持滞后'
  - '- 组件模型 + WASI 组成“云原生 Wasm”核心栈，Cloudflare Workers/Vercel Edge/Fastly Compute@Edge
    已生产可用'
  - '**典型例子**'
  - '- ffmpeg.wasm：SIMD 加速视频转码、多线程并行编码、WASI 访问文件系统，纯前端实现专业级视频编辑'
  - '- Python/Go/Ruby 在浏览器运行：WasmGC + 组件模型编译标准库，无需 Emscripten 模拟 POSIX'
  - '- 边缘中间件：Rust 编写 Wasm 模块 -> WASI 预览版 -> 部署 Cloudflare Workers，冷启动 < 1ms'
  - '**边界条件**'
  - '- WasmGC 仍在标准化后期，V8/SpiderMonkey 实验性支持，生产需谨慎评估兼容性'
  - '- 组件模型工具链生态尚早，跨语言调用约定、错误处理、版本演进最佳实践尚未沉淀'
  - '- WASI Preview 2 引入异步/流/资源模型，破坏 Preview 1 兼容，迁移成本高'
  - '...'
