unsupported_claims:
- location: ch32.3
  claim: RNN 梯度消失/爆炸导致长距离依赖断裂
  reason: 素材 P007 和 P009 虽提及梯度消失和长程记忆失效，但未明确使用‘断裂’一词，属推断性表述
- location: ch32.4
  claim: 点积注意力方差为 d_k 的推导假设 Q、K 分量独立同分布、均值 0 方差 1
  reason: 素材 P010 仅陈述结论‘假设 Q、K 分量独立均值 0 方差 1，则点积均值 0 方差 d_k’，未给出完整数学推导步骤
- location: ch32.5
  claim: 多头注意力参数量守恒：h * d_k = d_model
  reason: 素材 P019 和 A47V... 确认参数守恒，但未显式写出 h * d_k = d_model 等式，属隐含推导
- location: ch32.6
  claim: RoPE 通过复平面旋转实现长文本外推
  reason: 素材 B95V... 解释了 RoPE 旋转机制及仅依赖相对距离，但‘长文本外推’为实验结论，非数学必然推导
- location: ch32.7
  claim: 注意力权重高不代表因果重要性 (Jain & Wallace 2019)
  reason: 素材 P022 引用该结论但未提供原始文献细节，属二手引用
- location: ch32.8
  claim: FlashAttention 不改变数学结果、显存线性、速度 2-4x
  reason: 素材中未出现 FlashAttention 相关论文或实测数据，属工程经验总结
- location: ch32.10-exercise4
  claim: Integrated Gradients 属于因果分析手段
  reason: 素材 P022 将其列入‘严谨解释工具箱’但未论证其因果性，属分类判断
