  - WebGPU 现代图形 API：GPUDevice/Queue/Buffer/Texture/BindGroup/Pipeline 布局与渲染通道
  - 渲染引擎架构设计：场景图、脏标记更新、视锥剔除、批次合并、多层合成与插件化扩展
  - 实战：从零实现一个支持 10 万节点的高性能拓扑图可视化引擎
- 'no': 4
  name: Uni-app/Taro 编译时多端统一 —— DSL 约束、条件编译与平台差异抹平的工程艺术
  points:
  - '**为什么需要这个概念？**'
  - '- 业务需“一次开发，多端发布”（H5、微信/支付宝/字节/快手/QQ 小程序、App、快应用），维护多套代码库成本不可控'
  - '- 运行时框架（如早期 Weex、React Native）在小程序端受限于虚拟机限制（无 eval、无动态执行）、性能与包体积双重压力'
  - '- 编译时转译：将 Vue/React DSL 编译为目标平台原生代码（WXML/WXSS/JS、HTML/CSS/JS），无运行时开销，发挥各平台极致性能'
  - '- AI 辅助编译器插件开发：利用 LLM 生成平台特定转译规则、条件编译指令、API 抹平适配器代码，提升编译器扩展效率'
  - '**核心定义**'
  - '- 核心机制：'
  - '  1. DSL 约束：限制 Vue/React 语法子集（如禁用 with、动态组件受限、模板编译时确定），保证可静态分析、可转译'
  - '  2. 条件编译：`// #ifdef MP-WEIXIN` / `%ifdef%` 语法，编译期根据目标平台裁剪/注入差异代码'
  - '  3. 统一 API 抹平层：`uni.xxx` / `Taro.xxx` 运行时适配器，桥接平台差异（如请求、存储、导航、画布、蓝牙），暴露统一 Promise
    风格接口'
  - '  4. 编译器插件化：Webpack/Vite/Rollup 插件管线，处理模板编译、样式转换、脚本转译、资源哈希、分包策略'
  - '- AI 生成条件编译代码模板：Prompt 设计包含平台差异矩阵、API 映射表、降级策略，输出标准化 `#ifdef` 代码块'
  - '**关键性质**'
  - '- 编译时优势：无运行时框架开销、产物符合平台规范（如小程序 WXML/WXSS）、Tree-shaking 彻底、启动快'
  - '- 开发体验：Vue/React 语法糖、热重载 (HMR)、TypeScript 支持、IDE 智能提示、DevTools 调试映射源码'
  - '- 生态复用：可引入 npm 包（需兼容运行时环境）、组件库按需引入、插件机制扩展编译/运行时能力'
  - '- AI 代码审查：集成 LLM 到 CI/CD，自动检测 DSL 违规、条件编译遗漏、API 调用不兼容、包体积超限'
  - '**典型例子**'
  - '- 电商 SKU 选择器组件：Vue 写法 -> 编译输出微信小程序 WXML 模板 + WXSS + JS 逻辑、H5 Vue 组件、App nvue
    (Weex/RN 模式) 或原生渲染'
  - '- 条件编译实现微信支付 vs 支付宝支付：`#ifdef MP-WEIXIN` 调 `wx.requestPayment` / `#ifdef MP-ALIPAY`
    调 `my.requestPayment`'
  - '- 分包加载：`pages.json` 配置 `subPackages`，编译器自动拆分产物，小程序主包控制在 2M 以内'
  - '- ChatGPT 生成 Uni-app 条件编译模板：输入目标 API（如 Canvas/蓝牙/相册），输出带 `#ifdef` 分支的完整实现代码'
  - '**边界条件**'
  - '- DSL 约束导致部分 Vue/React 高级用法不可用（如 `render` 函数、动态 `is`、部分生命周期时机差异）'
  - '- 平台差异无法 100% 抹平：Canvas 2D/WebGL/API 权限/原生组件（map/video/live-pusher）表现差异大，仍需平台专项测试'
  - '- 编译器 Bug/版本升级破坏性变更风险：依赖框架维护团队响应速度，锁定版本是常态'
  - '- 复杂交互/高性能动画场景：编译输出的小程序逻辑层/视图层通信瓶颈、setData 开销、无法使用 SharedArrayBuffer/Worklet
    等高级特性'
  - '- App 端选择 nvue (Weex) 或原生渲染（Vue3 + Vite + Native）时，技术栈内部又出现分叉，增加心智负担'
  - '- AI 生成的条件编译代码可能遗漏边缘平台、错误映射 API 参数，需人工验证核心业务流程'
