    role: improve
  excerpts:
  - 区分 HTML/Attribute/JS/URL/CSS 五大编码上下文，实战 DOMPurify 白名单清洗、Trusted Types 强制安全类型赋值。
- 'no': 2
  name: CSRF 与 SameSite Cookie —— 同源策略演进下的“令牌双保险”
  points:
  - '**为什么需要这个概念？**'
  - '- 浏览器自动携带 Cookie 的特性导致：用户登录 A 站 -> 访问恶意 B 站 -> B 站自动发起对 A 站的请求（带上 Cookie）-> A
    站误以为是用户自主操作'
  - '- 传统防御依赖 `Referer` 检查或同步令牌模式（表单隐藏字段 + Session 校验），但 `Referer` 可被篡改/隐私模式丢失，同步令牌需后端改造且易漏掉接口'
  - '**核心定义**'
  - '- CSRF（跨站请求伪造）：利用受害者已认证身份，在不知情情况下强制发起状态改变请求（转账、改密、发帖）'
  - '- SameSite Cookie 属性：`Strict`（完全禁止跨站携带）、`Lax`（允许链接/GET 表单跨站携带，默认行为）、`None`（跨站携带，需
    `Secure`）'
  - '**关键性质**'
  - '- SameSite=Lax 是现代浏览器默认值，可拦截 90%+ CSRF（POST 表单、AJAX、iframe 跨站均不带 Cookie），但**无法防御**站内
    XSS 发起的请求、顶级导航 GET 请求'
  - '- 双重提交令牌模式：后端生成 Token -> 前端读取 Cookie/Header -> 请求头/体同时携带 -> 后端校验一致性，防御不依赖 SameSite，兼容旧浏览器'
  - '- `SameSite=None; Secure` 用于跨域嵌入场景（如第三方支付、SSO），必须配合 CSRF Token 双重防护'
  - '**典型例子**'
  - '- 恶意页面：`<form action=''https://bank.com/transfer'' method=''POST''><input name=''amount''
    value=''10000''></form><script>document.forms[0].submit()</script>`'
  - '- SameSite=Lax 下上述表单提交**不携带 Cookie**，请求未认证，防御生效'
  - '- 但若银行提供 `GET /transfer?to=attacker&amount=10000`，Lax 允许顶级导航携带 Cookie，**CSRF
    依然生效**（需强制状态改变用 POST + Token）'
  - '**边界条件**'
  - '- 子域名共享 Cookie（`Domain=.example.com`）时，SameSite 视为同站，**无法防御**子域名 XSS 发起的 CSRF'
  - '- 无状态架构（JWT 在 Header 而非 Cookie）天然免疫 CSRF，但面临 XSS 窃取 Token 风险，需配合短过期 + 刷新机制'
  - '- 旧版浏览器不支持 SameSite，必须保留 CSRF Token 兜底'
  - '...'
  sources:
