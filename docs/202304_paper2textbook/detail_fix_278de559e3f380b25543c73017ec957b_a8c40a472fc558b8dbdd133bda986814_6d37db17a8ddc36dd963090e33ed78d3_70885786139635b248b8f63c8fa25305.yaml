- 'no': 1
  name: XSS 攻防全景 —— 从输入过滤到输出编码的纵深防御
  points:
  - '**为什么需要这个概念？**'
  - '- Web 应用核心交互是“数据输入 -> 处理 -> 数据输出”，若输出环节未对不可信数据进行编码，浏览器会将其当作代码执行'
  - '- 攻击者注入恶意脚本可窃取 Cookie、劫持会话、篡改页面、发起钓鱼，危害直达用户隐私与资金安全'
  - '- 现代前端框架虽提供默认转义，但 `dangerouslySetInnerHTML`、`v-html`、URL 拼接、CSS 注入等“逃逸口”极易被误用'
  - '**核心定义**'
  - '- XSS（跨站脚本攻击）：攻击者将恶意脚本注入被信任网站，受害者浏览器加载页面时执行攻击脚本'
  - '- 按注入持久化路径分：存储型（入库再渲染）、反射型（URL 参数直接渲染）、DOM-based（纯前端 JS 解析 URL/数据动态渲染）'
  - '**关键性质**'
  - '- 编码上下文决定防御策略：HTML 实体编码、属性编码、JavaScript 编码、URL 编码、CSS 编码**互不通用**，必须匹配输出位置'
  - '- 输入过滤/白名单只能作辅助，**输出编码/上下文感知转义**是核心防线（OWASP 首选）'
  - '- Trusted Types (W3C 标准) 强制要求敏感 DOM API（如 `innerHTML`）只接受 `TrustedHTML` 类型对象，从根源杜绝字符串拼接注入'
  - '**典型例子**'
  - '- 反射型：搜索页 `q=<script>alert(1)</script>` 直接拼接到 `<div>搜索结果: {q}</div>`'
  - '- 存储型：评论区提交 `<img src=x onerror=stealCookie()>`，所有访问者中招'
  - '- DOM-based：`document.getElementById(''content'').innerHTML = location.hash.slice(1)`
    无编码渲染 hash'
  - '- 防御实战：React 默认 JSX 转义；Vue `v-html` 需配合 DOMPurify 白名单清洗；原生 JS 必须用 `element.textContent`
    而非 `innerHTML`'
  - '**边界条件**'
  - '- 富文本编辑器、Markdown 渲染、模板引擎等“合法 HTML 场景”必须引入 DOMPurify 等成熟库做白名单清洗，不可自造正则'
  - '- CSP (Content-Security-Policy) 是纵深防御兜底，非替代品；`script-src ''self''` 可阻断内联脚本与外域加载，但需配合
    nonce/hash 支持内联'
  - '- `HttpOnly` Cookie 可防窃取，但无法阻止 `fetch` 发起带凭证请求（CSRF 风险仍在）'
  - '...'
  sources:
