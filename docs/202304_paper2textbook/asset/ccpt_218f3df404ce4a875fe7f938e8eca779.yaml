  desc: 周报内容的核心来源体系或专栏名称，暗示包含趋势研判与项目筛选信息。
  is_original: true
  excerpt:
  - 龙哥风向标另外文档分享。
- name: 专属群/私域社群
  desc: 承载周报分发与用户互动的载体，通过邀请裂变增长，设有准入门槛。
  is_original: false
  excerpt:
  - 如果感觉专属群有价值，可以邀请朋友进群。
