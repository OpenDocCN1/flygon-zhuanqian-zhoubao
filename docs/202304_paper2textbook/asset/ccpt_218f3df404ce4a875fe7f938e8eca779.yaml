paper: docs/202304/20230418_079.md
desc: 该素材为‘龙哥赚钱周报’的封面页与导航页，核心内容为发布周报的更新频率、内容来源（语雀文档）、内容结构特征（分类标签、互动数据、评论图片）以及版权保护与社群裂变邀请机制，不包含具体的赚钱方法论、案例分析或核心观点。
concepts:
- name: 龙哥赚钱周报
  desc: 一种定期发布的付费/私密社群内容产品，以周报形式汇总赚钱风向标信息。
  is_original: true
  excerpt:
  - '# 🧯230411 龙哥赚钱周报'
