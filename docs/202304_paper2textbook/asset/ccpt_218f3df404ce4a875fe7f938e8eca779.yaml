methods:
- name: __overview__
  desc: 内容生产与分发方法论：基于语雀文档协作产出 -> 定期整理为周报 -> 通过私域社群（专属群）分发 -> 利用版权警示维护稀缺性 -> 通过邀请制实现裂变增长。
  excerpt:
  - 原文：`www.yuque.com/for_lazy/thfiu8/fgpmseubv4ogbd4h`
  - 每周更新，龙哥风向标另外文档分享。
  - 请勿外流，防止失效。如果感觉专属群有价值，可以邀请朋友进群。
theorems:
- name: 稀缺性护城河主张
  desc: 通过‘请勿外流，防止失效’的版权控制，维护社群内容的稀缺价值，确保付费/成员的专属权益。
  excerpt:
  - 请勿外流，防止失效。
- name: 社群价值裂变主张
  desc: 主张社群价值由成员认知驱动，通过‘邀请朋友进群’的社交裂变机制实现低成本获客与社群活跃度提升。
  excerpt:
  - 如果感觉专属群有价值，可以邀请朋友进群。
