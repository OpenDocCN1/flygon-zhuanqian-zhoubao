desc: 该素材为《抖音 SEO 的前景和选词指导》分享的元数据记录，主要介绍了作者李小随（Hawli）作为生财有术抖音 SEO 航海教练的背景，以及分享内容聚焦于抖音搜索前景分析与关键词选取方法论的核心主题，并提供了原始飞书文档链接供深入学习。
concepts:
- name: 抖音 SEO 航海
  desc: 生财有术社群组织的实战训练营项目，旨在通过系统教学与答疑帮助学员（船员）掌握抖音搜索优化技能并获取流量成果。
  is_original: true
  excerpt:
  - 很荣幸收到生财有术的邀请，参与了抖音 SEO 航海的教学与答疑，跟各位教练一起，帮助 500+名船员深入抖音搜索，拿到成果。
- name: 选词定生死
  desc: 搜索优化领域的核心原则，强调关键词选择策略直接决定抖音 SEO 业务的成败。
  is_original: false
  excerpt:
  - 大家都知道，做搜索，选词定生死。
methods:
- name: __overview__
  desc: 素材整体方法论为：基于生财有术航海实战项目，由头部教练主导，通过前景分析与选词方法论教学，指导 500+ 学员实操落地抖音搜索流量获取。
  excerpt:
  - 在航海的第一周，我给船员进行了一场分享，船员反馈不错，主题是关于抖音搜索的前景和选词的方法。
theorems:
- name: 抖音搜索前景可期且选词为核心突破口
  desc: 抖音搜索流量具有巨大商业前景，且关键词选择（选词）是实现流量获取与变现的关键决策环节。
  excerpt:
  - 那么抖音搜的前景到底怎样，我们应该如何选词呢？来看看就知道了
findings:
