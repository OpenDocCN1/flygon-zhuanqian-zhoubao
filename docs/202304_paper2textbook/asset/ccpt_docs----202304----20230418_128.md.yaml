paper: docs/202304/20230418_128.md
desc: 该素材为《视频号直播违规避坑》一文的元数据与引导页，核心内容不在本文中，而是通过链接指向外部文档（生财有术文档与腾讯文档），主要介绍了作者宏的从业背景（10年微信生态电商、视频号首批玩家、头部账号操盘经验、百万级投放实操）及分享初衷（在生财航海实战中分享实操避坑经验），旨在引导读者跳转至完整版避坑指南学习视频号直播合规与投放技巧。
concepts:
- name: 视频号直播违规避坑指南
  desc: 一份针对视频号直播带货常见违规风险的实战规避指南，包含违规类型分类、申诉技巧、投放合规要点等核心内容，为视频号从业者提供合规操作参考。
  is_original: true
  excerpt:
  - 《视频号直播违规避坑》
  - 分享我在视频号带货的一些实践踩坑经验，希望能帮助大家少踩一些坑
- name: 微信生态电商实战专家
  desc: 指深耕微信生态（小程序、微信支付、企业微信、视频号等）10年以上，具备从0到1搭建体系、头部账号操盘、百万级GMV达成及大额付费投放（微信豆）实战经验的复合型运营角色。
  is_original: false
  excerpt:
  - 10 年+电商人，一直专注微信生态做电商，经历过小程序，微信支付，企业微信，腾讯惠聚等一系列微信产品
  - 首批进驻视频号直播玩家，操盘过几个小垂类的品牌头部账号，场观有过 100w+，GMV 过 200w+，直播付费投放也花了两三百万流量券
methods:
- name: __overview__
  desc: 基于大量实操案例的复盘总结法，通过梳理首批进驻视频号直播过程中遇到的违规案例、投放坑点、申诉流程，形成标准化的避坑指南与合规操作SOP。
  excerpt:
  - 分享我在视频号带货的一些实践踩坑经验
  - 操盘过几个小垂类的品牌头部账号...直播付费投放也花了两三百万流量券
theorems:
- name: 合规先行是视频号直播长期主义的前提
  desc: 核心主张：视频号直播带货若想长久发展，必须建立系统化的违规认知与规避体系，通过前置性学习避坑指南，降低试错成本，保障账号安全与GMV稳定产出。
  excerpt:
  - 希望能帮助大家少踩一些坑，在视频号带货勇往向前，取得佳绩
- name: 实战经验迁移比理论学习更高效
  desc: 核心主张：来源于百万场观、200万GMV、百万级投放实操的避坑经验，具有极强的即时性与可操作性，能直接解决从业者在投放审核、话术合规、商品合规等环节的具体痛点。
  excerpt:
  - 场观有过 100w+，GMV 过 200w+，直播付费投放也花了两三百万流量券，对微信豆投放颇有些经验
  - 分享我在视频号带货的一些实践踩坑经验
findings:
- name: 完整避坑指南存放于外部文档库
  desc: '[evidence] 素材本体不包含具体违规案例与规避细节，核心干货内容托管于生财有术文档（shengcaiyoushu.com）与腾讯文档（docs.qq.com），需跳转阅读。'
  excerpt:
  - 分享全文： https://i.shengcaiyoushu.com/docx/YwPad1bzcojHC4xUt4acoXyKnrh
  - 基本都在这个文档内 https://docs.qq.com/doc/DTnVBdlZYRFJKTXJi
- name: 作者提供代投流与代播商业服务
  desc: '[claim] 作者在文末隐性透露其当前商业模式包含：为直播账号提供付费投流代运营（微信豆投放）及为知名品牌提供直播代播服务。'
  excerpt:
  - 目前手上帮着一些直播账号代投流与知名品牌作代播
