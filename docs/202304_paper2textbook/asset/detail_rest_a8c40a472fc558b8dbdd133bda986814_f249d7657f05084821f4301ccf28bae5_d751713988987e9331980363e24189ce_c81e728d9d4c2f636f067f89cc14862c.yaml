learning_targets:
- 理解自动提示工程（APE）的‘生成-评分-筛选’自举流程与核心公式
- 掌握 OPRO ‘优化轨迹上下文’机制，会用 LLM 作为黑盒优化器迭代提示词
- 建立多维提示评估指标体系（准确率、鲁棒性、Token 效率、格式合规、安全性）
- 搭建自动化评测流水线：数据集构建、批量推理、LLM-as-a-Judge 打分、CI/CD 集成
- 对比硬提示与软提示/前缀调优的适用边界，理解连续空间优化的参数高效优势与白盒依赖限制
- 能根据模型访问权限（黑盒/白盒）、任务类型、成本预算选择合适的自动化提示优化路线
concept_map:
- 自动化提示优化
- ├── 离散空间优化（黑盒/仅需 API）
- │   ├── APE (Automatic Prompt Engineer)  —— P001
- │   │   ├── 生成-评分-筛选自举循环
- │   │   ├── 解耦：提示生成器 vs 评分器
- │   │   └── 迭代变体：基于历史优秀提示词生成新候选
- │   ├── OPRO (Optimization by PROmpting)  —— P002
- │   │   ├── 优化轨迹上下文：{(p_i, s_i)} -> LLM -> p_{k+1}
- │   │   ├── 自然语言梯度：隐式捕捉修改方向与性能相关性
- │   │   └── 记忆增强：从错误中学习，避免重复低分模式
- │   └── 评测基准与自动化评测体系  —— P003
- │       ├── 多维指标：准确率、鲁棒性、Token效率、格式合规、安全性
- │       ├── 分层评测：单元级/系统级/业务级金字塔
- │       ├── LLM-as-a-Judge + Rubric 校准
- │       └── 防污染：哈希去重、隐藏集、定期轮换
- └── 连续空间优化（白盒/需反向传播）  —— P004
- '    ├── 软提示：输入层拼接可学习虚拟 Token 嵌入'
- '    ├── 前缀调优：每层 K/V 前拼接任务相关前缀向量'
- '    ├── 核心优势：可微优化、参数极少(0.1%-1%)、收敛稳定'
- '    └── 核心限制：需模型权重访问权限、初始化敏感、多任务部署管理前缀向量'
life_analogy:
- 想象自动化提示优化是一场**‘编剧-导演-观众’的电影打磨循环**：
- '- **APE（自动提示工程师）** = **‘海选编剧’**：给一个故事梗概（任务描述），让无数编剧（LLM生成）各写一个开场白（候选提示词），再请专业评委（评分器）打分，留下最高分剧本。'
- '- **OPRO（大模型优化器）** = **‘成长型导演’**：导演拿着历次试镜的剧本和评委打分单（优化轨迹上下文），自己琢磨‘上次台词太啰嗦、上上次情节不连贯’，直接写出下一版更好的剧本，无需外部评委即时参与。'
- '- **自动化评测体系** = **‘标准化考场’**：不仅看票房（准确率），还测口碑稳定性（鲁棒性）、单位成本产出（Token效率）、能否过审（格式/安全），并用‘AI
  影评人’（LLM-as-a-Judge）替代人工试映，接入自动化流水线（CI/CD）每天跑分。'
- '- **软提示/前缀调优** = **‘植入潜意识’**：不改剧本台词（硬提示），而是在演员（模型）大脑皮层植入几个微电极（可学习连续向量），通过微电流（梯度下降）直接调节演员潜意识状态，让演员不靠台词也能精准入戏。但这要求能动手术（白盒/开源模型），且电极参数需专用存储。'
summary:
- concept: APE (Automatic Prompt Engineer)
  desc: 生成-评分-筛选自举循环，将提示词搜索转化为黑盒优化问题，解耦生成与评估
- concept: OPRO (Optimization by PROmpting)
  desc: 用 LLM 自身作为优化器，通过优化轨迹上下文实现自然语言梯度下降，具备记忆与元认知能力
- concept: 提示评估多维指标体系
  desc: 准确率、鲁棒性、Token效率、格式合规、安全性五维度量化‘好提示’，支撑自动化筛选
- concept: 自动化评测流水线
  desc: 数据集构建→批量推理→LLM-as-a-Judge打分→CI/CD集成，实现分层（单元/系统/业务）防污染评测
- concept: 软提示
  desc: 在嵌入层拼接可学习连续向量（虚拟Token），仅优化向量冻结骨干，参数量<1%，需白盒模型支持反向传播
- concept: 前缀调优
  desc: 在每层注意力 K/V 前拼接可学习前缀向量，等价于为注意力注入任务先验，比软提示表达力更强但参数稍多
- concept: 硬提示 vs 软提示
  desc: 硬提示：离散、可解释、黑盒通用、搜索难；软提示：连续、可微、高效、白盒依赖、不可解释、部署需管理前缀参数
exercises:
- 'no': 1
  title: 手动模拟 APE 一轮优化
  contents:
  - 任务：二分类情感分析（正向/负向）
  - 种子示例 (3条)：
  - '  1. "Movie was great!" -> Positive'
  - '  2. "Terrible acting." -> Negative'
  - '  3. "I liked the plot." -> Positive'
  - 步骤：
  - 1. 手写 3 个不同风格的候选提示词 p1, p2, p3（例如：直接指令风、角色扮演风、CoT 风）
  - 2. 设计一个简易评分函数 Score(p) = 准确率 - 0.01 * Token数（惩罚冗长）
  - 3. 假设在验证集上得到分数 s1, s2, s3，选出最高分作为 p*
  - 思考题：
  - '- 如果验证集只有 5 条样本，直接选最高分会有什么风险？如何缓解？'
  - '- APE 中‘基于历史优秀提示词生成变体’的具体 Prompt 怎么写？试写一段元提示词'
- 'no': 2
  title: 体验 OPRO 优化轨迹上下文构建
  contents:
  - 场景：优化 GSM8K 数学题提示词
  - 已有历史轨迹（前 3 轮）：
  - '  p1: "Solve this math problem." -> Score: 0.42'
  - '  p2: "Let''s think step by step." -> Score: 0.71'
  - '  p3: "Calculate carefully and show work." -> Score: 0.68'
  - 任务：
  - 1. 构造发送给 LLM 优化器的完整 Meta-Prompt（包含任务描述、优化目标、历史轨迹、输出格式要求）
  - 2. 预测 LLM 可能生成的 p4 会包含哪些关键改进？（提示：结合 p2 成功经验、p3 失败教训）
  - 思考题：
  - '- 当优化轮次达到 20 轮，上下文窗口装不下完整轨迹时，设计一种‘轨迹压缩/摘要’策略'
  - '- 为什么 OPRO 不需要单独的评分器模型？它的‘评分’隐含在哪里？'
- 'no': 3
  title: 设计提示词自动化评测报告模版
  contents:
  - 要求：输出一份 JSON Schema，用于标准化记录一次提示词评测运行的结果
  - 必须包含字段：
  - '- prompt_id, prompt_text, task_name, dataset_version'
  - '- metrics: {accuracy, robustness_score, avg_tokens, format_compliance_rate, safety_score}'
  - '- judge_info: {judge_model, rubric_version, calibration_notes}'
  - '- ci_metadata: {git_commit, pipeline_run_id, timestamp}'
  - 实操：
  - 1. 写出该 JSON Schema（可用 TypeScript 接口或 JSON Schema Draft 7 表示）
  - 2. 给出一条填充示例数据
  - 思考题：
  - '- 如何在 CI 中实现‘回归阻断’：新提示词若准确率下降 > 2% 或 Token 增加 > 20% 则阻断合并？'
  - '- LLM-as-a-Judge 的偏好偏差（如偏长、偏特定格式）会污染评测，设计一种‘人工校准回环’机制'
- 'no': 4
  title: 软提示 vs 硬提示：工程决策矩阵
  contents:
  - 场景对比表（请补全决策建议）：
  - '| 场景约束 | 推荐方案 | 核心理由 |'
  - '|---|---|---|'
  - '| 仅有黑盒 API (GPT-4/Claude) | ? | ? |'
  - '| 开源模型 (Llama-3-8B)，需极低延迟推理 | ? | ? |'
  - '| 多任务共享部署，任务数 > 50 | ? | ? |'
  - '| 需要人类可读、可审计、可版本控制的提示词 | ? | ? |'
  - '| 任务为全新领域（如古文翻译），预训练数据极少 | ? | ? |'
  - 补充问题：
  - '- 前缀调优相比输入层软提示，为何在深层语义任务上表现更好？（提示：注意力机制的层级特性）'
  - '- 如何用‘硬提示初始化’缓解软提示随机初始化的局部最优问题？给出操作步骤'
- 'no': 5
  title: 端到端实战：为一个分类任务跑通 APE->评测->选型闭环
  contents:
  - 数据集：AG News 标题分类（4类），取 200 条做验证集，200 条做测试集
  - 基座模型：任意可调用的 LLM API（如 gpt-3.5-turbo）
  - 步骤：
  - 1. 用 APE 思路：让模型生成 10 个候选提示词（提供种子示例 5 条）
  - 2. 批量跑验证集，计算准确率、平均 Token、格式合规率（JSON 输出）
  - 3. 选出 Pareto 前沿（高准确率、低 Token）的 Top-3 提示词
  - 4. 在测试集上复测 Top-3，输出最终推荐提示词及评测报告
  - 交付物：
  - '- 候选提示词列表、验证集分数表、Pareto 前沿可视化（ASCII 图或描述）、最终报告'
  - 无需提交代码，只需写出完整操作手册（Prompt 模版、评分脚本逻辑、决策阈值）
