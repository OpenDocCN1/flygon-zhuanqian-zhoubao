  name: 注意力可视化与解读 —— 打开黑盒看模型“在看什么”
  points:
  - '**为什么需要这个概念？**'
  - '- 注意力权重直观可视化，是目前最主流的模型可解释性手段'
  - '- 验证模型是否真正学会了语言学规律（句法树、共指链），还是靠捷径统计'
  - '- 诊断模型失效原因：如注意力发散、关注无关 Token、位置偏移等'
  - '**核心定义**'
  - '- 提取多层、多头注意力矩阵 `A ∈ [Layers, Heads, SeqLen, SeqLen]`'
  - '- 可视化形式：热力图、有向图、聚类图、注意力流图'
  - '- 分析维度：层级演进（浅层句法->深层语义）、头分工、熵/聚焦度指标'
  - '**关键性质**'
  - '- 注意力 ≠ 解释：高权重不等于因果贡献，可能是“旁观者”作用；需结合梯度/消融实验'
  - '- 特殊 Token 偏见：[CLS]/[SEP]/首尾 Token 常吸引过多注意力（垃圾桶现象），需剔除分析'
  - '- 熵指标：注意力熵低=聚焦明确（如指代消歧），熵高=泛化融合（如语义摘要）'
  - '**典型例子**'
  - '- BERT 浅层头呈现依存树结构（Clark et al., 2019），中层捕捉共指链，深层服务下游任务'
  - '- 机器翻译对齐图：注意力对角线主导+跨语言词对齐，验证软对齐机制'
  - '- 代码模型：注意力精准链接变量定义与使用、括号匹配、缩进结构'
  - '**边界条件**'
  - '- 仅可视化注意力权重不足以证明因果机制，需结合 Integrated Gradients、Attention Knockout 等介入实验'
  - '- 多头注意力拼接后的输出经过了 W^O 混合，单头可视化可能不反映最终残差流贡献'
  - '- 规模模型（>7B）头数极多（32-96），全头可视化极难，需采样或聚类分析'
  sources:
  - paper: 20230418_022.md
    role: experiment
  excerpts:
  - 注意力可视化揭示：BERT 无监督学会了依存句法树结构，特定头对应特定依存关系。
  - 警惕‘注意力即解释’谬误：注意力权重高不代表该 Token 对输出贡献大，可能是信息聚合的‘垃圾桶’ Token（如 [SEP]）。
  - 工具：BertViz, Transformer-Interpret, AttentionViz 支持交互式多层多头热力图探索。
