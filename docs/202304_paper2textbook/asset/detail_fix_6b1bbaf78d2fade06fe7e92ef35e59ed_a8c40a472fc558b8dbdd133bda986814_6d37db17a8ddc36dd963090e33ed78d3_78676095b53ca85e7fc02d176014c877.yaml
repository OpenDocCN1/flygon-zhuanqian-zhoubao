learning_targets:
- 理解注意力机制如何从信息瓶颈视角解决 RNN/CNN 的长距离依赖与并行计算难题
- 掌握缩放点积注意力的数学推导、缩放因子作用及其数值稳定性原理
- 理解多头注意力通过子空间分工提升表达能力的机制与工程实现要点
- 对比正弦绝对编码、可学习绝对编码、RoPE 相对位置编码的数学性质与外推能力边界
- 掌握注意力可视化的主流分析维度、工具链及『注意力≠解释』的局限性认知
- 能根据任务特点（长文本、多语言、代码生成等）选择合适的注意力变体与位置编码方案
concept_map:
- 注意力机制核心原理与变体
- ├── 序列建模困境与注意力直觉
- │   ├── RNN 串行瓶颈与梯度消失          —— P001
- │   ├── CNN 固定感受野与位置稀释          —— P001
- │   ├── Seq2Seq 单一向量信息瓶颈          —— P001
- │   └── 聚光灯类比：动态软寻址            —— P001
- ├── 缩放点积注意力
- │   ├── Q/K/V 矩阵与标准公式               —— P002
- │   ├── 缩放因子 1/√d_k 防梯度消失        —— P002
- │   ├── 排列等变性与并行计算优势            —— P002
- │   └── FlashAttention IO 感知优化          —— P002
- ├── 多头注意力
- │   ├── 多头分裂-并行-拼接流程              —— P003
- │   ├── 子空间分工：句法/语义/位置异构建模   —— P003
- │   ├── 参数量恒定约束：d_model = h × d_k   —— P003
- │   └── 头冗余与 Head Pruning 压缩          —— P003
- ├── 位置编码方案
- │   ├── 正弦绝对编码：外推能力与线性关系      —— P004
- │   ├── 可学习绝对编码：表达力强但无外推      —— P004
- │   ├── RoPE 相对位置编码：旋转矩阵与长上下文 —— P004
- │   └── ALiBi 线性偏置：无嵌入向量参数        —— P004
- └── 注意力可视化与解读
- '    ├── 多层多头热力图/有向图分析         —— P005'
- '    ├── 层级演进：浅层句法→深层语义        —— P005'
- '    ├── 熵指标评估聚焦度与垃圾桶现象        —— P005'
- '    └── 局限性：注意力≠因果解释，需介入实验   —— P005'
life_analogy:
- 想象注意力机制是一个**大型国际会议的同声传译系统**：
- '- **Query** = 译员当前需要翻译的『源语言片段』（如『它』）'
- '- **Key** = 会议记录中每个词的『语义标签』与『位置标签』（如『动物-主语-位置3』、『街道-宾语-位置6』）'
- '- **Value** = 每个词携带的『完整语义内容向量』'
- '- **相似度计算 (Q·K^T)** = 译员快速扫描记录，判断『它』与『动物』标签匹配度高、与『街道』匹配度低'
- '- **缩放因子 1/√d** = 会议规模扩大时，防止『匹配度分数』过大导致译员『只盯着一个词看』（Softmax 饱和）'
- '- **Softmax** = 将匹配度归一化为『注意力分配比例』：90% 给『动物』，5% 给『街道』，5% 给其他'
- '- **加权求和 (×V)** = 译员按比例融合语义内容，输出准确翻译『它→那个动物』'
- '- **多头注意力** = 组建『专家译员团』：译员A专管『指代消歧』、译员B专管『句法结构』、译员C专管『长距离依赖』，最后由总译员（W^O）综合输出'
- '- **位置编码 (RoPE)** = 给每个词贴上『相对坐标』而非『绝对房间号』，无论会议多长、中途插入新议程，译员都能精准知道『它』离『动物』隔了几个词'
summary:
- concept: 注意力机制/聚光灯直觉
  desc: 动态软寻址打破 RNN 串行瓶颈与 Seq2Seq 信息瓶颈，实现 O(1) 路径长度的全局建模
- concept: Query/Key/Value
  desc: 注意力机制的三个基本角色：提问者、标签/索引、内容/值
- concept: 缩放点积注意力
  desc: 标准化公式 Attention(Q,K,V)=softmax(QK^T/√d_k)V，利用矩阵乘法加速并通过缩放因子保证梯度稳定
- concept: 缩放因子 1/√d_k
  desc: 抵消高维向量点积方差随维度增长而放大，防止 Softmax 进入饱和区导致梯度消失
- concept: 多头注意力
  desc: 将 Q/K/V 投影到 h 个子空间并行计算再拼接，在不增加总参数量前提下实现多视角（句法/语义/位置）协作建模
- concept: 子空间分工
  desc: 不同头自发学会捕捉不同语言学现象（如指代消歧、依存句法、位置模式），类似集成学习增强表达能力
- concept: 位置编码
  desc: 为排列等变的注意力机制注入顺序信息，解决『狗咬人』vs『人咬狗』的歧义
- concept: 正弦绝对位置编码
  desc: 固定三角函数编码，支持任意长度外推，线性关系便于模型学习相对位置
- concept: 可学习绝对位置编码
  desc: nn.Embedding 形式，表达力强但限于训练最大长度，无外推能力
- concept: RoPE 相对位置编码
  desc: 通过旋转矩阵将绝对位置注入 Q/K，使得注意力分数仅依赖相对距离，是目前长上下文（32k-1M）主流方案
- concept: ALiBi
  desc: 直接在注意力分数加线性偏置 -m·|i-j|，无需位置嵌入向量参数
- concept: 注意力可视化
  desc: 提取多层多头注意力矩阵绘制热力图，分析层级演进（浅层句法→深层语义）、头分工与聚焦度熵
- concept: 注意力≠解释
  desc: 高注意力权重不等于因果贡献，存在『垃圾桶 Token』（如 [SEP]）吸引注意力现象，需结合梯度/消融实验验证
- concept: FlashAttention
  desc: IO 感知算法，通过分块计算减少 HBM 读写，显著加速长序列注意力计算并降低显存占用
exercises:
- 'no': 1
  title: 手算一次缩放点积注意力
  contents:
  - 给定单头注意力输入：
  - Q = [[1, 0, 1], [0, 1, 1]]  (2×3)
  - K = [[1, 0, 0], [0, 1, 0], [1, 1, 1]]  (3×3)
  - V = [[2, 0], [0, 2], [1, 1]]  (3×2)
  - d_k = 3
  - ''
  - 请按步骤计算：
  - 1. 计算原始注意力分数 S = QK^T (形状 2×3)
  - 2. 计算缩放后分数 S' = S / √d_k
  - 3. 对 S' 每行做 Softmax 得到注意力权重 A
  - 4. 计算最终输出 O = A V (形状 2×2)
  - ''
  - 思考题：
  - '- 若去掉缩放因子（即不除以 √3），当 d_k 增大到 100 时，Softmax 输出会呈现什么极端分布？对梯度有何影响？'
  - '- 为什么缩放因子是 √d_k 而不是 d_k 或其他数量级？'
- 'no': 2
  title: 多头注意力参数量与维度验证
  contents:
  - 某 Transformer 模型配置：d_model = 512, h = 8 个头。
  - ''
  - 计算与验证：
  - 1. 每个头的键/查询/值维度 d_k = d_v 是多少？
  - 2. 单头投影矩阵 W^Q, W^K, W^V 的形状分别为？总投影参数量（不含 bias）是多少？
  - 3. 输出投影矩阵 W^O 的形状与参数量？
  - 4. 多头注意力总参数量与单头注意力（h=1, d_k=512）对比，是否基本持平？
  - ''
  - 思考题：
  - '- 若将头数 h 增加到 64（d_k=8），单头表达能力会如何变化？可能引入什么问题？'
  - '- 为什么标准实现中要求 d_k = d_v = d_model / h？若放宽该约束会怎样？'
- 'no': 3
  title: 位置编码外推能力实验设计
  contents:
  - 设计一个最小化实验，对比三种位置编码在长度外推任务上的表现：
  - 任务：训练模型在序列长度 L=128 上学会『复制输入序列倒序』任务，测试在 L=256、512 上的零样本泛化准确率。
  - ''
  - 三种编码方案：
  - A. 正弦绝对位置编码
  - B. 可学习绝对位置编码
  - C. RoPE 相对位置编码 (base=10000)
  - ''
  - 实验步骤：
  - 1. 搭建相同架构的 2 层小型 Transformer Encoder
  - 2. 分别替换位置编码模块，其他超参保持一致
  - 3. 在 L=128 训练至收敛，记录 L=128/256/512 上的 Token 级准确率
  - 4. 绘制长度-准确率曲线
  - ''
  - 分析问题：
  - '- 为什么方案 B 在 L>128 时准确率会崩塌？'
  - '- 方案 A 虽然支持外推，但高频分量在长距离为何易混淆？'
  - '- 方案 C 为何能稳定外推？若将 base 从 10000 改为 1e6，配合 YaRN 微调会有何效果？'
- 'no': 4
  title: 注意力可视化解读实战
  contents:
  - 使用 BertViz 或自制脚本，加载预训练 BERT-base 模型，输入句子：
  - 『The animal didn't cross the street because it was too tired.』
  - ''
  - 观察并记录：
  - 1. 第 1 层、第 5 层、第 12 层的注意力热力图差异
  - 2. 找到生成/预测『it』位置时，哪些头对『animal』注意力权重最高？权重数值约为多少？
  - 3. 统计 [CLS] 和 [SEP] Token 作为 Key 时，平均获得多少注意力权重？（验证『垃圾桶现象』）
  - 4. 计算第 1 层某头的注意力熵，对比第 12 层同头的熵值，解释『浅层聚焦、深层融合』现象
  - ''
  - 思考题：
  - '- 如果某头在所有层对 [SEP] 都给出极高权重，这头可能在干什么？是否可以安全剪枝？'
  - '- 注意力可视化显示模型『看』对了位置，为何仍不能直接断定模型『理解』了指代消歧？需设计何种介入实验验证？'
- 'no': 5
  title: 长序列注意力优化方案选型决策树
  contents:
  - 某生产环境需部署 32k 上下文窗口的 LLaMA-7B 模型，显存预算 24GB (单张 RTX 3090)，要求批大小 ≥ 4。
  - 现有方案菜单：
  - 1. 标准注意力 + 梯度检查点
  - 2. FlashAttention-2
  - 3. 滑动窗口注意力 (SWA, window=4096)
  - 4. 线性注意力
  - 5. 混合方案：前 16k 用 FlashAttention-2，后 16k 用 SWA
  - ''
  - 请从以下维度建立决策矩阵并给出推荐：
  - '- 显存占用估算 (KB/Token/层)'
  - '- 吞吐速度'
  - '- 建模能力损失（能否捕捉 32k 远距离依赖）'
  - '- 实现工程难度（是否需修改 Kernel/模型结构）'
  - '- 与 RoPE 位置编码兼容性'
  - ''
  - 回答要求：
  - '- 列出决策矩阵表格'
  - '- 给出最终推荐方案及核心理由'
  - '- 说明若显存预算增至 80GB (A100)，推荐是否会变化'
units:
- 'no': 1
  name: 序列建模的困境与注意力直觉 —— 从“逐字阅读”到“聚光灯扫描”
  points:
  - '**为什么需要这个概念？**'
  - '- RNN 串行处理导致训练无法并行，长序列梯度消失/爆炸，难以捕捉长距离依赖'
  - '- CNN 固定感受野窗口，需叠加极深层数才能覆盖全局，位置信息稀释严重'
  - '- 传统 Seq2Seq 依赖单一固定长度的上下文向量，造成信息瓶颈，长句翻译质量急剧下降'
  - '**核心定义**'
  - '- 注意力机制模拟人类视觉“聚光灯”机制：不再平均对待所有输入，而是根据当前任务需求（Query），动态计算输入各位置（Key）的相关性权重，对值（Value）加权求和'
  - '- 公式本质：`Output = Σ(Similarity(Q, K_i) * V_i)`，实现“软寻址”'
  - '**关键性质**'
  - '- 全局感受野：任意位置 Token 可直接建立连接，路径长度 O(1)'
  - '- 动态权重：权重由输入内容动态生成，而非固定卷积核'
  - '- 可并行计算：注意力矩阵运算可高度并行化，适配 GPU'
  - '**典型例子**'
  - '- 机器翻译中“The animal didn''t cross the street because it was too tired”中，生成“it”时注意力聚焦于“animal”而非“street”，解决指代消歧'
  - '**边界条件**'
  - '- 计算复杂度 O(N²) 随序列长度平方增长，成为长文本瓶颈'
  - '- 缺乏天然位置感知，必须显式注入位置编码'
  - '- 对极长序列显存占用巨大，需稀疏注意力或线性注意力变体缓解'
  sources:
  - paper: 20230418_007.md
    role: origin
  - paper: 20230418_009.md
    role: improve
  excerpts:
  - RNN 的串行特性使得无法利用现代 GPU 的并行计算能力，且长距离依赖面临梯度消失困境。
  - 注意力机制的核心直觉是‘聚光灯’：模型不再被迫将整个序列压缩进一个固定向量，而是学会在生成每一步时‘看’哪里。
  - 传统 Seq2Seq 的 Context Vector 成为信息瓶颈，注意力机制通过保留所有编码器隐状态并动态加权，打破了这一瓶颈。
- 'no': 2
  name: 缩放点积注意力 —— 让相似度变成分配比例
  points:
  - '**为什么需要这个概念？**'
  - '- 加性注意力（Bahdanau）参数量大、计算慢，难以利用矩阵乘法加速'
  - '- 点积注意力虽快，但当维度 d_k 很大时，点积数值方差过大，导致 Softmax 进入饱和区，梯度消失'
  - '- 需要一个无额外参数、高效并行、数值稳定的标准化计算范式'
  - '**核心定义**'
  - '- 输入：Query(Q)、Key(K)、Value(V) 矩阵'
  - '- 计算：`Attention(Q, K, V) = softmax(QK^T / √d_k) V`'
  - '- 缩放因子 `1/√d_k` 抵消维度增长导致的方差放大，保持梯度健康'
  - '**关键性质**'
  - '- 排列等变性：输入顺序打乱，输出顺序同步打乱（前提是无位置编码）'
  - '- 计算复杂度 O(N²·d)，显存占用 O(N²) 存储注意力图'
  - '- 可高度优化：利用 FlashAttention 等 IO 感知算法减少 HBM 读写'
  - '**典型例子**'
  - '- BERT/GPT 等主流模型的核心计算单元'
  - '- 多头注意力即并行跑多组缩放点积注意力再拼接'
  - '**边界条件**'
  - '- d_k 过小（如 < 16）时缩放因子效果微弱，需结合 LayerNorm'
  - '- 序列长度 N > 4k-8k 时显存/算力压力指数级上升，需长文本优化技术'
  - '- 纯点积注意力对位置不敏感，必须配合位置编码使用'
  sources:
  - paper: 20230418_010.md
    role: origin
  excerpts:
  - 点积注意力相比加性注意力，计算效率高得多，因为可以利用高度优化的矩阵乘法库。
  - 缩放因子 1/√d_k 的作用是防止维度 d_k 过大时，QK^T 点积数值过大，推入 Softmax 饱和区导致梯度消失。
  - 标准化公式：Attention(Q, K, V) = softmax(QK^T / √d_k)V，这是 Transformer 所有变体的基石。
- 'no': 3
  name: 多头注意力 —— 多视角协作的“专家委员会”
  points:
  - '**为什么需要这个概念？**'
  - '- 单头注意力只能关注一种关系模式（如主谓搭配），无法同时捕捉句法、语义、指代、位置等异构关系'
  - '- 单一注意力分布容易陷入局部最优，平均化了不同语言现象的差异'
  - '- 需要在不增加总参数量/计算量前提下，拓展模型的表达维度'
  - '**核心定义**'
  - '- 将 Q/K/V 通过线性投影切分为 h 个头：`Head_i = Attention(QW_i^Q, KW_i^K, VW_i^V)`'
  - '- 各头独立并行计算，最后拼接 `Concat(Head_1,...,Head_h)W^O` 输出'
  - '- 总投影维度保持不变：`d_model = h × d_k`，参数量与计算量与单头大头基本持平'
  - '**关键性质**'
  - '- 子空间分工：不同头自发学会捕捉不同语言学现象（如 Head 1 专管指代消歧，Head 2 专管介词宾语）'
  - '- 表达能力增强：集成多个“弱注意力”形成“强表示”，类似集成学习'
  - '- 并行友好：各头间无依赖，可跨 GPU/核心并行'
  - '**典型例子**'
  - '- BERT-base: 12 heads, d_k=64；GPT-3: 96 heads, d_k=128'
  - '- 可视化显示：浅层头关注局部句法（如形容词-名词），深层头关注长程语义（如主语-动词、指代链）'
  - '**边界条件**'
  - '- 头数过多（h > 64）导致 d_k 过小，单头表达能力不足，收益递减'
  - '- 头数过少（h=1）退化为单头，丧失多视角建模能力'
  - '- 部分头可能冗余（如复制同一模式），可用 Head Pruning 压缩'
  sources:
  - paper: 20230418_019.md
    role: origin
  - paper: A47Vd3fekoelzRxZpdUcTl9Cn7W.md
    role: improve
  excerpts:
  - 多头注意力允许模型在不同表示子空间、不同位置联合关注信息。
  - 实验表明：不同注意力头自发分工，有的专注句法依存，有的专注共指消歧，有的专注位置模式。
  - MultiHead(Q,K,V) = Concat(head_1,...,head_h)W^O，其中 head_i = Attention(QW_i^Q,
    KW_i^K, VW_i^V)。
- 'no': 4
  name: 位置编码 —— 给无序集合注入“时间感”
  points:
  - '**为什么需要这个概念？**'
  - '- Self-Attention 本质是集合操作，对输入 Token 集合顺序不敏感（排列等变性）'
  - '- 自然语言顺序蕴含关键语法/语义信息（‘狗咬人’ vs ‘人咬狗’），必须显式告知模型位置'
  - '- RNN/CNN 天然有时序/平移不变性，Transformer 必须补齐此短板'
  - '**核心定义**'
  - '- 绝对位置编码：为每个位置 pos 分配固定/可学习向量 PE(pos)，直接加到 Token Embedding 上'
  - '- 正弦编码：`PE(pos, 2i) = sin(pos/10000^{2i/d})`，`PE(pos, 2i+1) = cos(...)`，支持外推到未见长度'
  - '- 可学习编码：`nn.Embedding(max_len, d_model)`，仅限训练长度内，表达力更强但无外推能力'
  - '- 相对位置编码/Rope：仅建模相对距离 `i-j`，通过旋转矩阵注入 Query/Key，天然支持长度外推'
  - '**关键性质**'
  - '- 正弦编码：线性关系 `PE(pos+k) ≈ PE(pos) + k·PE''(pos)`，便于模型学习相对位置'
  - '- RoPE：将绝对位置转化为相对位置的旋转操作，`Q_i · K_j` 仅含相对距离信息，无绝对位置偏置'
  - '- ALiBi：直接在注意力分数加线性偏置 `-m·|i-j|`，无需位置嵌入向量'
  - '**典型例子**'
  - '- BERT：可学习绝对位置编码（max_len=512）'
  - '- GPT-3/Neox：可学习绝对位置编码'
  - '- LLaMA/ChatGLM/Mistral：RoPE 相对位置编码，支持 32k-128k+ 上下文'
  - '- T5/ALiBi：相对位置偏置，无嵌入向量参数'
  - '**边界条件**'
  - '- 绝对位置编码（正弦/可学习）在推理时超出训练最大长度会严重性能下降'
  - '- RoPE 需调整基础频率 `theta`（如 10000 -> 1e6）配合 YaRN/PI 微调才能稳定外推'
  - '- 相对位置编码增加注意力计算复杂度或实现难度（需修改 Kernel）'
