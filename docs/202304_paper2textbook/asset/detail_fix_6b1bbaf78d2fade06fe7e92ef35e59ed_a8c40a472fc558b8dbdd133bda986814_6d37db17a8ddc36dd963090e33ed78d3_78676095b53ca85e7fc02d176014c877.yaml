    role: improve
  excerpts:
  - Transformer 纯注意力结构是排列等变的，不加位置编码无法区分‘狗咬人’和‘人咬狗’。
  - 正弦位置编码利用三角函数波长差异编码位置，理论上支持任意长度外推，但高频分量在长距离易混淆。
  - RoPE 通过旋转矩阵将绝对位置注入 Query/Key，使得注意力分数仅依赖相对距离，是目前长上下文主流方案。
