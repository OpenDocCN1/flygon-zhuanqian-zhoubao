    role: origin
  - paper: README.md
    role: improve
  - paper: SUMMARY.md
    role: apply
  - paper: 20230418_079.md
    role: apply
  excerpts:
  - 类比软件工程，论证教材源文件应采用 Markdown/AsciiDoc 等纯文本格式，纳入 Git 版本控制，实现内容的可追溯、可协作、可自动化构建。
  - 定义教材工程的标准化分层架构：素材层（原始输入）、概念层（知识原子）、结构层（大纲/逻辑骨架）、呈现层（PDF/网站/课件），实现内容与形式分离。
  - 推演「聚类素材 -> 提炼概念卡片 -> 编排大纲节点 -> 渲染章节」的标准化工程流水线，确立概念卡片作为连接素材与大纲的唯一「中间表示（IR）」。
  - 规定 Chapter-Node 二级结构的 JSON Schema，强制要求章标题采用「隐喻类比式」双段式、节点必须标注教学角色，实现大纲的机器可读与自动化校验。
  - 配置 Pandoc/Quarto/GitHub Actions 自动化流水线，一键生成学生版教材、教师版教案、交互式网站、幻灯片，保证多端内容一致性。
  - 引入 SemVer 语义化版本控制至教材，定义 Major/Minor/Patch 对应的内容变更类型，建立变更日志规范。
- 'no': 3
  name: 逻辑架构师 —— 为知识搭建可执行的认知脚手架
  points:
  - '**为什么需要这个概念？**'
  - '- 传统大纲常犯“百科全书式”错误：按知识分类罗列目录（如“第一章 概述、第二章 语法、第三章 API”），忽视学习者的认知负荷与图式构建路径，导致“学完即忘、无法迁移”'
  - '- 教学导向的大纲必须服务于“图式构建”：每个节点都有明确的教学功能定位，章节间逻辑正交（MECE），整体服务于核心主张（金字塔原理）'
  - '- 私域/创业决策同理：无结构的信息堆砌（百科全书式）无法指导行动，必须提炼核心主张、建立逻辑骨架、标注执行角色（黄老师/新侠/虚十七）'
  - '**核心定义**'
  - '- MECE 原理在章节划分中的落地：Mutually Exclusive（知识点不重叠/耦合）、Collectively Exhaustive（覆盖达成目标所需所有知识/无盲区），配套“章节正交性检查表”'
  - '- 金字塔原理驱动大纲生成：自上而下表达（先定核心主张）、自下而上思考（通过纵向提问/横向归纳分解节点），保证逻辑闭环'
  - '- 教学角色标注体系：七大角色——motivation（动机/为什么学）、definition（定义/是什么）、method（方法/怎么做）、proof（证明/为什么有效）、experiment（实验/实战案例）、limitation（边界/失效场景）、extension（延伸/前沿拓展），每个节点必须打标'
  - '- 私域/创业决策框架：根源“私域=经营”、黄老师“赚钱三阶层”、虚十七“筛选漏斗”、新侠“抄袭-模仿-创造”均为将碎片经验结构化为可执行认知脚手架的典范'
  - '**关键性质**'
  - '- 认知负荷最小化：通过 motivation 降低门槛激发兴趣，definition 建立精准心智模型，method 提供可执行步骤，experiment
    促进迁移内化'
  - '- 逻辑可验证性：素材溯源四级链条（大纲节点 <- 概念卡片 <- 文献卡片 <- 原始素材），src 字段支持通配符引用，保证每个论点有据可查'
  - '- 结构强制约束：JSON Schema 强制双段式标题（隐喻类比 + 本质阐述）、角色标注非空、素材引用非空，防止“只有定义无动机”、“只有理论无实战”'
  - '**典型例子**'
  - '- 本书大纲生成复盘：原始 24 个章节 Markdown -> 按主题聚类为 3 个篇章（认知/工程/逻辑）-> 提炼 18 个概念卡片 -> 角色标注定节点
    -> 类比命名定章名 -> 输出符合 Schema 的 JSON 大纲'
  - '- 某章节拆分前：混杂“注意力定义、公式推导、代码实现、可视化案例” -> 拆分后：Node1 motivation(序列建模困境)、Node2 definition(数学形式化)、Node3
    method(多头/位置编码)、Node4 experiment(可视化案例)、Node5 limitation(注意力≠解释)'
  - '- 根源私域复盘：公域式管理(大群/广播) vs 私域式经营(小群/深度连接)，用“经营”重构认知，用“150人红线”校验执行，用“主动触达”破解强IP悖论'
  - '- 虚十七筛选漏斗：生财宝藏社群 -> 项目太多无从下手 -> 建立漏斗筛选适合项目 -> 手把手分享思路 -> 高效找到适合自己的项目'
  - '**边界条件**'
  - '- 角色非互斥：单个节点可含多角色（如 definition+method），但需明确主次；禁止全书只有 definition 角色'
  - '- MECE 是理想态：实际操作中允许“概念前置/后置”形成递进依赖，但须在大纲层面显式标注 depends_on 字段（本 Schema 暂未强制，建议扩展）'
  - '- 素材溯源粒度：paper 字段建议引用到具体文件/页码/段落锚点，而非整本书；通配符 author:xxx/** 仅用于批量引用同一文章集'
