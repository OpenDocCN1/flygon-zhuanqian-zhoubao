  excerpts:
  - 知识不是被灌输的，而是通过主动连接、结构化组织与持续复盘主动建构出来的。
  - 对比「收藏夹谬误」与「编译器思维」，揭示单纯记录、高亮、转发无法形成长期记忆与深度理解的认知机制。
  - 定义「原子化」、「链接优于收藏」、「自底向上生成」三大核心原则，确立从素材到概念卡片的标准化工作流。
  - 区分「闪念卡片」（捕捉）、「文献卡片」（理解/改写）与「概念卡片」（综合/创新）的定位、写法及演进路径。
  - 论证「写作是思考的结果，更是思考的过程」，展示如何通过卡片写作倒逼深度阅读，实现输入驱动输出。
  - 辨析「原子化」与「碎片化」的本质区别，指出单纯加标签、不写链接理由、忽视上下文关联的典型反模式。
  - 私域的意义根本就不是管理，而是『经营』。
  - 一个群超过 150 人，效益就会完全的下降。
  - 我真的碰过很多通讯录的人，我主动找他，他给我的回应竟然是：老师 你找我聊天好开心 我平时都不敢给你发讯息……这个没问题 我愿意参加
  - 有沒有可能多数人的情况，是不需要『再引流』了呢？
  - 个人能力越强的，每周都得给自己几天，深度的挖一轮自己的通讯录，或者是一天固定找 3~5 个。
  - 帮生财做的一次品牌设计，现在看是一次最值的投资了，因为后面给了很多惊喜。
  - 在生财里合作了不低于十个合作伙伴，都是很快达成了合作，有几个第一次见面就签约打钱。
  - 因为同频和共识，人对了，所以事就成了。
  - 这几天回山东老家有事，跟我表弟聊了聊他的生意...他在闲鱼卖旧衣服很偶然...没想到直接变现了十几万
- 'no': 2
  name: 教材即软件 —— 用工程化流水线替代手工作坊
  points:
  - '**为什么需要这个概念？**'
  - '- 传统教材开发痛点：Word/PDF 二进制格式难以版本控制、协作冲突频发、内容与排版耦合导致多形态交付（教材/教案/课件/网站）极其痛苦、迭代周期以年计'
  - '- 现代教学需求：内容需频繁更新、多端同步发布、支持协同编写、可追溯决策过程'
  - '**核心定义**'
  - '- 教材即代码：采用 Markdown/AsciiDoc 等纯文本格式作为源文件，纳入 Git 版本控制，实现内容的可追溯、可协作、可自动化构建'
  - '- 四层架构：素材层（原始输入/PDF/网页/笔记） -> 概念层（知识原子/概念卡片/中间表示IR） -> 结构层（大纲/逻辑骨架/JSON Schema）
    -> 呈现层（PDF/网站/课件/电子书）'
  - '- 概念卡片驱动开发（CDD）：以概念卡片为唯一“中间表示（IR）”，标准化流水线：聚类素材 -> 提炼概念卡片 -> 编排大纲节点 -> 渲染章节'
  - '**关键性质**'
  - '- 内容与形式分离：源文件只管语义结构，渲染管线负责样式输出，一源多用'
  - '- 机器可读与自动化校验：大纲采用 JSON Schema 约束（强制双段式标题、教学角色标注、素材溯源字段），CI 流水线自动拦截不合规提交'
  - '- 语义化版本控制：引入 SemVer，Major=重构章节/调整逻辑骨架，Minor=新增知识点/案例，Patch=修正错别字/格式，自动生成 CHANGELOG'
  - '**典型例子**'
  - '- 使用 Pandoc/Quarto + GitHub Actions：提交 Markdown 源文件 -> 自动跑测（链接有效性、术语一致性、角色完整性）->
    并行产出：学生版教材、教师版教案（含答案/备注）、交互式网站、Reveal.js 幻灯片'
  - '- 团队协作：作者通过 PR 提交新概念卡片，审阅者检查溯源链完整性、逻辑角色正确性，合并后自动触发多形态发布'
  - '**边界条件**'
  - '- 学习曲线：要求作者具备基本 Git/Markdown/CI 概念，非技术背景作者需配套图形化客户端或编辑器插件降低门槛'
  - '- 非文本素材处理：图表、公式、复杂排版需约定渲染规范（如 Mermaid 图表、LaTeX 数学公式、SVG 矢量图），避免二进制大文件污染仓库'
  - '- 法规与版权：引用第三方素材需在素材层记录版权元数据（作者、来源、许可证），构建时自动生成版权声明页'
  sources:
