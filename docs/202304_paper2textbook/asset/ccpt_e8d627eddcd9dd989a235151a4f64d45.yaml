paper: docs/202304/20230418_154.md
desc: 该素材为一篇职业教育在线培训平台从0到1的实战复盘案例，作者伊亦基于2014年起参与医考品牌（执业医师、执业药师、健康管理师）纯私域运营一年流水破1500万的亲身经历，系统拆解了注册公司、课程生产、产品结构、技术制作、招生宣传、招商模式六大核心环节的操作路径与避坑指南，旨在为教育创业者提供可复制的商业模式参考。
concepts:
- name: 政策红利驱动的赛道选择
  desc: 指依据国家发布的重要任务指标（如医考政策变革）反向挖掘高确定性、强刚需的职业教育细分赛道，而非单纯靠市场调研发掘机会。
  is_original: true
  excerpt:
  - 我们是从 2014 年国家发布了一个重要任务指标，从而发掘了这个项目，执业医师，执业药师，健康管理师考试培训。
- name: 纯私域运营模式
  desc: 不依赖公域流量购买（如信息流广告、SEO），完全基于微信生态（社群、个人号、裂变）构建的用户获取、转化、服务与复购闭环，实现极低获客成本（CAC）与高生命周期价值（LTV）。
  is_original: true
  excerpt:
  - 纯私域运营一年拿下 1500 万流水。
- name: 教育产品标准化交付体系（SOP）
  desc: 将非标的教学服务拆解为可量化、可复制、可考核的标准化作业流程（课程生产、班主任服务、督学打卡、答疑响应时效等），解决教育行业‘重服务、难标准、难规模’的核心矛盾。
  is_original: true
  excerpt:
  - 接下来从注册公司，课程生产，产品结构，技术制作，招生宣传，招商模式与宣传等 6 环节给大家剖析制作教育品牌平台需要注意的注意事项。
methods:
- name: __overview__
  desc: 教育品牌0-1全链路搭建六步法：1. 政策导向选品与合规主体搭建；2. 课程生产标准化（大纲-录制-剪辑-更新SOP）；3. 阶梯式产品矩阵设计（引流款-信任款-利润款-高客单价）；4.
    低成本技术底座搭建（SaaS/小程序/网校）；5. 私域流量池构建与裂变获客（种子用户-社群运营-分销裂变）；6. 招商代理体系设计（分级代理-利润分成-赋能扶持）。
  excerpt:
  - 接下来从注册公司，课程生产，产品结构，技术制作，招生宣传，招商模式与宣传等 6 环节给大家剖析制作教育品牌平台需要注意的注意事项。
- name: 产品阶梯定价法
  desc: 设计‘引流课（低价/免费）-> 系统班（标准价）-> 协议班/名师班（高价，含过不过退/重学等权益）-> 1V1定制/就业推荐（超高客单价）’的产品矩阵，覆盖不同支付意愿与能力的用户，最大化挖掘用户全生命周期价值。
  excerpt:
  - 产品结构
- name: 私域裂变招生三部曲
  desc: 种子用户冷启动（种子学员精细服务产生口碑） -> 社群精细化运营（分层、SOP服务、考试节点营销） -> 分销代理裂变（老带新返佣、代理分级授权），实现‘老带新’占比超50%的低成本规模化获客。
  excerpt:
  - 招生宣传
  - 招商模式与宣传
theorems:
- name: 职教创业‘政策选赛道、私域跑流量、标准化交付、招商做规模’四步走公式
  desc: 职业教育领域成功的核心逻辑：起步必须卡政策风口（确定性需求）；获客必须建私域池（可控成本、高转化、强信任）；交付必须重标准化（复制规模、控制质量）；规模化必须靠招商/分销（杠杆放大、覆盖长尾）。
  excerpt:
  - 我们是从 2014 年国家发布了一个重要任务指标，从而发掘了这个项目... 纯私域运营一年拿下 1500 万流水。
  - 希望能给没有做过品牌的伙伴朋友一点启示。接下来从注册公司，课程生产，产品结构，技术制作，招生宣传，招商模式与宣传等 6 环节给大家剖析...
- name: 医考/职考赛道‘强监管、高门槛、长周期、高复购’的天然护城河论
  desc: 执业医师、药师等考试具有国家强制准入属性，政策不可逆、考试周期长（备考半年-数年）、用户付费意愿极强、且存在续报/多证复购需求，是教育创业中极少数同时具备‘高毛利+高留存+高复购+难被巨头颠覆’特质的优质赛道。
  excerpt:
  - 执业医师，执业药师，健康管理师考试培训。
  - 纯私域运营一年拿下 1500 万流水。
findings:
- name: 纯私域模式单店年流水破千万验证
  desc: '[evidence] 作者团队在2014-2015年期间，仅凭微信私域生态（无公域广告投放），运营执业医师/药师/健康管理师培训项目，实现单品牌年流水1500万，验证了‘政策红利+私域运营+标准化交付’模式的商业可行性与高盈利潜力。'
  excerpt:
  - 我从 2014 年开始做职业教育，参与了一个医考品牌的诞生到爆发，纯私域运营一年拿下 1500 万流水。
- name: 招商代理模式为规模化核心杠杆
  desc: '[claim] 作者主张在跑通单店模型后，通过‘招商模式与宣传’建立分级代理体系（省代/市代/校区代），以‘品牌授权+课程供给+运营赋能+分润激励’快速复制至全国地级市，是突破单地市流量天花板、实现亿级规模的关键路径。'
  excerpt:
  - 招商模式与宣传等 6 环节给大家剖析制作教育品牌平台需要注意的注意事项。
- name: 技术制作‘轻量级起步，业务跑通再重构’原则
  desc: '[claim] 早期切忌自建研发团队开发APP/PC端，应优先采用成熟SaaS工具（如小鹅通、保利威、EduSoho）或微信小程序/公众号+H5组合，以最低成本验证业务闭环；待业务模型跑通、用户量达标后，再考虑定制化开发数据中台与智能学习系统。'
  excerpt:
  - 技术制作
