units:
- 'no': 1
  name: 架构决策记录（ADR） —— 让技术决策留下“可追溯的脚印”
  points:
  - '**为什么需要这个概念？**'
  - '- 团队技术决策常依赖口头约定或散落在聊天记录中，人员变动后决策背景丢失，导致重复讨论或错误回滚。'
  - '- 缺乏标准化记录模板，决策理由、替代方案、后果评估缺失，新成员无法理解“为什么这么做”。'
  - '- 架构演进缺乏历史证据链，难以支撑复盘、审计与合规要求。'
  - '**核心定义**'
  - '- ADR（Architecture Decision Record）是一种轻量级文档，采用标准化结构（标题、背景、决策、后果、替代方案、状态）记录一次具有长远影响的架构决策。'
  - '- 核心元数据包括：唯一编号、状态（提议/通过/废弃/替代）、关联 Issue/PR、创建日期、决策者。'
  - '**关键性质**'
  - '- 不可变性：一旦进入“通过”状态，正文不得修改，变更需新建 ADR 并标记旧 ADR 为“替代”。'
  - '- 关联性：通过 `supersedes` / `superseded-by` 字段构建决策演进链条，形成架构演进的有向无环图。'
  - '- 就近性：ADR 文件存放于代码仓库 `/docs/adr` 目录，与代码同版本控制，实现“决策即代码”。'
  - '**典型例子**'
  - '- ADR-0005：选型 Pinia 替代 Vuex 作为状态管理库，记录了对比 Vuex 的模块自动代码分割、TypeScript 推导优势及迁移成本评估。'
  - '- ADR-0012：引入 Module Federation 实现微前端，记录了对比 qiankun 的运行时依赖共享优势与版本协商复杂度权衡。'
  - '**边界条件**'
  - '- 仅记录“重大、不可逆、跨团队影响”的决策（如框架选型、基础设施迁移、核心协议变更），避免流水账。'
  - '- 不替代 RFC（Request for Comments）流程：RFC 用于决策前的广泛征集意见，ADR 用于决策后的固化归档。'
  - '- 需配合 `adr-cli` 等工具强制模板规范，防止字段缺失导致溯源失效。'
  sources:
  - paper: KJ0CdYG18oMFStxpa17cxS0wnyt.md
    role: origin
  excerpts:
  - 推行 `adr-cli` 管理决策文档：标题/背景/决策/后果/替代方案、状态、关联 Issue、Markdown 渲染门户、Git 历史不可篡改溯源。
- 'no': 2
  name: 技术雷达 —— 绘制团队技术栈的“动态航海图”
  points:
  - '**为什么需要这个概念？**'
  - '- 技术选型碎片化、个人偏好主导，导致技术栈膨胀、维护成本失控、招聘与培训无标准。'
  - '- 缺乏周期性评审机制，过时技术（如 Vue 2、Webpack 4）长期滞留，新技术（如 Rspack、Vite）无准入路径。'
  - '- 团队缺乏共识的“技术视野”，新人入职无指引，架构演进无方向。'
  - '**核心定义**'
  - '- 技术雷达是将技术项按“采纳/试用/评估/暂缓”四象限、按“语言框架/平台/工具/方法”四环带可视化的战略工具。'
  - '- 每个技术项（Blip）包含：名称、象限、环带、移动轨迹（如：评估→试用→采纳）、决策理由链接（关联 ADR）。'
  - '**关键性质**'
  - '- 周期性：固定节奏（如季度）召开雷达会议，评估 Blip 迁移，输出《雷达变更日志》。'
  - '- 共识驱动：采用“同意制”而非“多数决”，核心维护者有否决权，确保生产可用性优先。'
  - '- 可视化门户：基于 `tech-radar` 开源工具生成交互式网页，嵌入团队 Wiki，新人入职必读。'
  - '**典型例子**'
  - '- “Vite” 从“试用”迁移至“采纳”象限，关联 ADR-0003（构建工具链统一），理由：冷启动速度提升 80%、HMR 稳定。'
  - '- “Class-based Vue Components” 移入“暂缓”，理由：Vue 3 组合式 API 为主流，Options API 仅维护遗留。'
  - '**边界条件**'
  - '- 雷达不等于“技术栈白名单”，处于“评估/试用”象限的技术可在非核心项目小范围验证。'
  - '- 避免雷达项过多（建议 < 60 个），聚焦架构级、基建级决策，不收录具体库版本细节。'
  - '- 需建立“雷达守护者”角色（通常由架构治理委员会成员担任），负责会议组织与工具维护。'
  sources:
  - paper: KJ0CdYG18oMFStxpa17cxS0wnyt.md
    role: origin
  excerpts:
  - 引入 Thoughtworks 技术雷达模式、季度雷达会议流程、Blip 迁移规则、开源工具 `tech-radar` 可视化发布、新人入职必读文档。
- 'no': 3
  name: 架构演进路线图 —— 将战略意图翻译为“可执行的施工图”
  points:
  - '**为什么需要这个概念？**'
  - '- 架构治理易陷入“空谈愿景”或“救火式重构”二元对立，缺乏中长期的有序推进计划。'
  - '- 跨团队依赖不明（如基座团队升级 Node 版本未通知业务线），导致集成冲突、发布延期。'
  - '- 技术债务偿还无预算、无排期，挤占业务迭代资源，最终演变为“重写大坑”。'
  - '**核心定义**'
  - '- 架构演进路线图是覆盖 12-18 月的滚动规划文档，包含：战略主题、季度里程碑、跨团队依赖图谱、资源投入（人力/算力/预算）、风险缓冲与技术债务专项预算。'
  - '- 核心要素：Theme（战略主题，如“全链路类型安全”）、Milestone（可验证交付物）、Dependency（依赖关系）、Capacity Allocation（产能切分比例，如
    70% 业务 / 20% 技术债 / 10% 前沿探索）。'
  - '**关键性质**'
  - '- 滚动波浪式规划：近期（0-3 月）精确到 Sprint，中期（3-9 月）到 Feature，远期（9-18 月）仅定方向。'
  - '- 依赖显性化：识别跨团队阻塞关系（如“微前端基座升级”阻塞“子应用接入”），纳入依赖管理看板。'
  - '- 债务显性化：建立《技术债务清单》，每季度分配固定偿还预算，防止利息复利。'
  - '**典型例子**'
  - '- Q1 主题“全链路类型安全”：里程碑 OpenAPI Schema 生成 TS 类型覆盖率 100%、API 请求客户端类型安全重构完成。'
  - '- Q2 主题“微前端化”：里程碑 基座接入 3 个子应用、共享依赖版本锁定策略落地、Monorepo 迁移完成。'
  - '**边界条件**'
  - '- 路线图 ≠ 项目甘特图：不细化到任务级，保留团队自主规划空间；重“结果”而非“过程”。'
  - '- 必须与 OKR 打通：架构主题映射为团队/个人 OKR，避免“两张皮”。'
  - '- 季度复盘时允许调整主题优先级，但需记录变更理由（关联 ADR），防止随意摇摆。'
  sources:
  - paper: KJ0CdYG18oMFStxpa17cxS0wnyt.md
    role: origin
  excerpts:
  - 制定 12-18 月滚动路线图：主题（如“全链路类型安全”“微前端化”“研发效能平台化”）、季度里程碑、跨团队依赖识别、技术债务专项偿还预算。
- 'no': 4
  name: 架构评审机制（RFC） —— 为重大变更设置“带刹车的快车道”
  points:
  - '**为什么需要这个概念？**'
  - '- 重大技术变更（如引入新框架、修改核心通信协议）缺乏强制评审入口，个人冲动决策导致生产事故。'
  - '- 评审会议走形式：无标准模版、无决策矩阵、无会议纪要、无事后复盘，沦为“汇报会”。'
  - '- 事后无复盘机制，成功经验沉淀不下来，失败教训重复犯。'
  - '**核心定义**'
  - '- RFC（Request for Comments）流程：提案人提交标准化文档（动机、设计、替代方案、迁移计划、测试策略、回滚预案）→ 评审委员会异步审阅+同步答辩
    → 输出决策矩阵评分 → 形成 ADR 归档。'
  - '- 评审委员会：由架构师、技术负责人、安全代表、运维代表组成，拥有“附条件通过/驳回/要求补齐”的决策权。'
  - '**关键性质**'
  - '- 分级门槛：按影响半径分级（L1: 组件库升级/ L2: 基础设施变更/ L3: 架构级重构），匹配不同评审深度与委员会规模。'
  - '- 决策矩阵量化：从技术可行性、业务价值、实施成本、风险可控性、团队能力五维打分，设定及格线，去主观化。'
  - '- 事后复盘强制化：上线 3 个月/6 个月必须填写复盘模版（预期vs实际、偏差原因、经验教训），关联原 RFC 与 ADR。'
  - '**典型例子**'
  - '- RFC-2024-Q2-01：引入 Module Federation 重构微前端架构，评审矩阵得分 4.2/5，条件通过要求补充性能基准报告与回滚演练记录。'
  - '- RFC-2024-Q1-05：全量迁移 Vue 3.3 + TS 5.0，复盘发现类型报错修复耗时超预期 50%，沉淀“大版本升级预演清单”。'
  - '**边界条件**'
  - '- 不评审业务逻辑细节（如某个表单校验规则），聚焦架构边界、技术栈、基础设施、跨团队契约变更。'
  - '- 紧急热修复（Hotfix）可事后补 RFC，但必须在 48 小时内补全文档并走完评审流程。'
  - '- 评审委员会成员需轮换制（如半年一轮），避免权力固化与认知盲区。'
  sources:
  - paper: KJ0CdYG18oMFStxpa17cxS0wnyt.md
    role: origin
  excerpts:
  - 建立 RFC 提交模版、评审会议议程、决策矩阵（技术可行性/业务价值/实施成本/风险/团队能力）、事后复盘模版输出经验教训。
- 'no': 5
  name: 架构治理委员会与运营报告 —— 从“隐形治理”走向“显性交付”
  points:
  - '**为什么需要这个概念？**'
  - '- 架构治理常由少数架构师“隐性”推动，缺乏组织授权、固定节奏、可度量产出，易被业务优先级挤压而虚化。'
  - '- 治理成果不可见：ADR 写了多少？雷达变了什么？债务还了几个？无数据支撑，难以争取资源投入。'
  - '- 团队满意度未纳入考核，治理沦为“自上而下的管控”而非“赋能服务”。'
  - '**核心定义**'
  - '- 架构治理委员会是拥有章程、固定成员、决策权限、会议节奏的正式组织实体，而非虚拟兴趣小组。'
  - '- 章程核心条款：成员构成（主席/核心成员/观察员）、职责边界（决策/咨询/监督）、会议节奏（月度例会/季度战略会/年度规划会）、决策权限（哪些必须委员会决、哪些授权小组决）。'
  - '- 季度运营报告是治理委员会的“交付物”，包含：ADR 数量/质量分析、雷达变更统计、路线图完成度、技术债务偿还量化、团队满意度调研（NPS）、下季度重点。'
  - '**关键性质**'
  - '- 赋能而非管控：委员会输出标准化工具链（脚手架/规范/平台）、提供技术咨询办公时间、组织技术分享，降低团队合规成本。'
  - '- 数据驱动：运营报告指标必须可自动化采集（如从 Git/GitLab/CI/CD/监控平台取数），拒绝手工填报。'
  - '- 透公开：报告全员可见（脱敏敏感信息），接受全团队监督与反馈。'
  - '**典型例子**'
  - '- 首季度运营报告：新增 ADR 12 份（通过 8/废弃 2/替代 2）、雷达 Blip 迁移 5 个、路线图“类型安全”主题完成度 90%、偿还技术债务
    15 项、团队 NPS 7.2/10。'
  - '- 发现“组件库升级”类 RFC 通过率低、周期长，委员会决议推出“组件库升级标准化 SOP”专项，次季度周期缩短 40%。'
  - '**边界条件**'
  - '- 委员会不直接管理业务项目进度，只管架构合规与技术战略落地。'
  - '- 主席建议由 CTO 或一级部门技术负责人担任，保证组织授权与资源协调能力。'
  - '- 运营报告避免“自夸式汇报”，必须包含“未达标指标+根因+整改计划”板块。'
  sources:
  - paper: KJ0CdYG18oMFStxpa17cxS0wnyt.md
    role: origin
  excerpts:
  - 输出委员会章程（成员/职责/会议节奏/决策权限）、首季度运营报告（ADR 数量/雷达变化/路线图完成度/技术债务偿还量/团队满意度调研）。
