paper: docs/202304/20230418_062.md
desc: 该素材为一篇小红书电商选品实操指南，作者沐风针对无货源新手卖家面临的选品困境，提出了一套基于第三方数据平台（如蝉小红、新红）的数据分析选品方法论。核心在于构建“需求排名”与“电商价值排名”双维度指标体系，并通过“综合评分公式（30-排名值）”量化筛选高潜力类目，最后结合单品数据验证，形成从宏观类目到微观单品的漏斗式选品闭环。
concepts:
- name: 小红书电商选品
  desc: 指在小红书电商生态中，通过数据分析手段筛选确定适合销售的行业类目与具体商品的过程，是无货源新手卖家的核心启动难题。
  is_original: false
  excerpt:
  - 面临这么多行业类目和品类，到底该如何进行选择呢？
  - 对于大多数自身没有货源，而且是刚开始接触电商的同学来讲，可能一开始都会面临一个问题
- name: 第三方数据平台辅助选品
  desc: 利用蝉小红、新红等外部数据工具获取行业类目及单品的公开数据，替代主观臆测，作为选品决策的数据基础。
  is_original: false
  excerpt:
  - 稍微有点经验的同学可能都会想到借助一些类似蝉小红、新红这样的小红书三方数据平台来辅助自己选品，而不是全凭自己的感觉
- name: 需求排名
  desc: 基于搜索量、笔记数等内容侧指标，反映用户对某类目兴趣强度与内容供给量的综合排序，是选品模型中的核心需求侧指标。
  is_original: true
  excerpt:
  - 综合评分中 为什么是 30-需求排名和电商价值排名
  - 排名越靠前，得分就越高，例如，排名第 1，（30-排名）之后，分值就越高
- name: 电商价值排名
  desc: 基于销量、GMV、转化率等交易侧指标，反映某类目实际商业变现能力与商品流转效率的综合排序，是选品模型中的核心价值侧指标。
  is_original: true
  excerpt:
  - 综合评分中 为什么是 30-需求排名和电商价值排名
  - 排名越靠前，得分就越高
- name: 综合评分模型
  desc: 作者自创的量化选品公式：Score = (30 - 需求排名) + (30 - 电商价值排名)。通过常数基数（30）减去双维度排名，将定序数据转化为定距分值，排名越靠前得分越高，用于跨类目横向对比筛选。
  is_original: true
  excerpt:
  - 30 就是一个常数值，其实设置成多少都可以，总的行业类目是 29，所以我就取了个 30，减去需求排名和电商价值排名是为了评分，排名越靠前，得分就越高
methods:
- name: __overview__
  desc: 漏斗式数据选品法：宏观类目筛选（第三方平台获取数据 -> 双维度排名 -> 综合评分排序 -> 确定目标类目） -> 微观单品验证（进入类目下挖掘爆款单品/供应链）
    -> 最终决策。
  excerpt:
  - 获取数据只是第一步，更重要的是，我们该如何对这些数据进行分析，并利用它们来辅助我们选择行业类目和品类呢？
  - 这里，我就给大家分享一下我的一些思路和探索。
- name: 双维度排名构建法
  desc: 在第三方平台导出行业类目数据后，分别按需求侧指标（如搜索热度）和价值侧指标（如销售额）生成两份独立排名榜单，为后续评分提供标准化输入。
  excerpt:
  - 需求排名和电商价值排名
- name: 综合评分筛选法
  desc: 应用公式 Score = (C - Rank_demand) + (C - Rank_value) (C=总类目数+1) 计算每个类目得分，按得分降序排列，优先切入高分类目。
  excerpt:
  - 30 就是一个常数值，其实设置成多少都可以，总的行业类目是 29，所以我就取了个 30，减去需求排名和电商价值排名是为了评分
theorems:
- name: 数据驱动优于主观判断
  desc: 在信息不对称且经验不足的初期，依赖第三方平台客观数据进行选品决策，胜过依靠个人感觉或经验，能有效规避认知偏差。
  excerpt:
  - 稍微有点经验的同学可能都会想到借助一些类似蝉小红、新红这样的小红书三方数据平台来辅助自己选品，而不是全凭自己的感觉，毕竟感觉可能会有偏差，但是数据不会骗人。
- name: 需求与价值双高为优质类目
  desc: 优质电商类目必然具备‘用户需求旺盛’（内容侧活跃）与‘商业变现强’（交易侧高效）双重特征，单一维度优势（如仅有流量无转化，或仅有转化无流量）均不足以支撑长期生意。
  excerpt:
  - 综合评分中 为什么是 30-需求排名和电商价值排名
- name: 排名倒序计分法的普适性
  desc: 对于排名型指标，采用‘常数基数减去排名值’的线性变换，可将无量纲的序数转化为可加权、可比较的基数分值，常数取值仅需大于最大排名数即可，不影响相对排序结果。
  excerpt:
  - 30 就是一个常数值，其实设置成多少都可以，总的行业类目是 29，所以我就取了个 30
findings:
- name: 小红书行业类目总数约为29个
  desc: '[evidence] 作者在解释常数30的来源时透露，数据平台上的总行业类目数量为29个，因此取30作为基数保证所有排名得分为正。'
  excerpt:
  - 总的行业类目是 29，所以我就取了个 30
- name: 蝉小红、新红为主流小红书选品分析工具
  desc: '[claim] 作者实测推荐蝉小红、新红作为获取小红书电商类目及单品数据的主流第三方平台。'
  excerpt:
  - 借助一些类似蝉小红、新红这样的小红书三方数据平台来辅助自己选品
