paper: docs/202304/20230418_119.md
desc: 该素材是生财有术社区 Web3 小航海分享实录，作者 Start9527 基于个人从新人到 Flow 公链中国大使、Web3 书籍统筹、社区联创的实战经历，系统阐述了
  Web3 新人应避开投机交易、转向赛道建设参与的核心方法论。内容涵盖：宏观周期判断（四年减半铁律）、行业演进三阶段论（金权/DeFi→物权/NFT→人权/DAO→智权）、行业四层架构体系、安全生存法则、低成本切入路径（MOD/大使/核心贡献者）、工作室批量化玩法（空投/打新/链游）及核心圈层信息差价值，主张新人以时间换空间、以贡献换认知、以圈层换资源，实现从投机者到建设者的身份跃迁。
concepts:
- name: Web3 行业演进三阶段论
  desc: 将 Web3 发展划分为三个核心阶段：第一阶段金权（DeFi 解决金权信任）、第二阶段物权（NFT 解决资产确权）、第三阶段人权（DAO 重新定义个人与组织关系），并预判后续将延伸至信息自由与创作者权益的智权阶段。
  is_original: true
  excerpt:
  - 本质上来讲 Web3 是在去中心化的前提下，重新定义价值和权利的行业。而最容易量化的是金权的信任关系，所以就有了馋嘴猫老师讲的 Defi（去中心化金融）是
    Web3 的最重要应用的结论，而 Defi 是解决金权关系最重要的应用；第二阶段是物权，此时最重要的应用就到了 NFT（非同质化代币），这是我们进入 Web3
    的通行证；第三阶段则是 DAO（去中心化自组织），它是重新定义了个人和组织的关系，我们称之为人权；其后是信息自由和创作者权益的难题，我们称之为智权等等
- name: Web3 行业四层架构体系
  desc: 将 Web3 产业链结构化为四大层级：系统协议层（公链、跨链、底层协议）、基础设施层（存储、审计、身份、通信、治理）、用户用例层（DeFi、NFT、DAO、GameFi）、系统接入层（钱包、聚合器），为新人定位赛道切入点提供地图。
  is_original: true
  excerpt:
  - 在这个大的背景下，我们又将整个 Web3 行业分为四个层面（来源我们和北大出版社的未发表新书《零基础读懂 Web3》）。包括：系统协议层：公链、跨链桥、各种底层协议；基础设施层：存储、审计、身份、通信、治理；用户用例层：DeFi、NFT、DAO、GameFi；系统接入层：钱包、聚合器
- name: 新人七阶段心理成长曲线
  desc: 总结 Web3 新人必经的七个心理阶段：自我怀疑期、迷之自信被打脸期、赌徒附身期、自省定位期、时来运转期、蜕变期、趋稳常态期，强调认知迭代与定位校准是穿越周期的关键。
  is_original: true
  excerpt:
  - 1，自我怀疑时期... 2，迷之自信持续被打脸时期... 3，赌徒附身时期... 4，自省时期（深度刨析自己，不适合做什么：二级交易，擅长做什么：运营和出版）...
    5，时来运转时期... 6，蜕变时期... 7，趋于稳定的常态
- name: 核心贡献者切入模型
  desc: 主张新人通过无本金投入方式（MOD、大使、核心贡献者）深度参与项目建设，通过研读白皮书、路线图、代币模型等实现认知速成，以劳动力换取行业入场券与隐性收益。
  is_original: true
  excerpt:
  - 这个赛道有很多岗位都是基于 DAO 的形式开展，你可以从任意你喜欢的领域切入后，找到相应的项目，去申请成为项目的 MOD（社区管理）或者大使，有的有薪资，有的没有但可以深度学习，对于新人尽量选择那种不需要投入本金的项目，哪怕前期被白嫖劳动力也无所谓，参与其中并快速了解该项目的白皮书、路线图、团队框架、代币模型等等，持续进步迭代你的认知
- name: Web3 工作室批量化生存模式
  desc: 将传统互联网工作室模式（批量账号、指纹浏览器、IP 隔离）迁移至 Web3，通过空投交互、一级市场打新、链游打金等规模化操作获取确定性收益，并衍生出代撸服务商业模式。
  is_original: false
  excerpt:
  - 工作室层面可以批量撸空投、打新或者做链游打金... 工作室其实除了本身收益，还可以给别人带撸... 而工作室就一定要设计 IP、指纹浏览器等工具，这也都是做工作室的基础。而且一定要批量，这和咱们做抖音、视频号、跨境电商等等行业没有本质的区别，都是大力出奇迹。
- name: 核心圈层信息差红利
  desc: 指出 Web3 核心收益来源于高门槛社区（如稳赢&加密湾、龙珠俱乐部）内部的一级项目筛选权、早期消息面及基金份额分配权，圈层准入成本（龙珠/会费）远低于其带来的超额收益。
  is_original: false
  excerpt:
  - 这个就是核心圈层才有的福利，尤其是在牛市，一个消息可能就是价值千金，这就像咱们生财有术的龙珠俱乐部，需要消耗一颗龙珠才可以进入，但是在内部的收益尤其是早期进入的收益绝对大于一颗龙珠...
    我目前是稳赢&加密湾社区的联创，所以，在一级项目筛选上也会有不少资讯面的优势
methods:
- name: __overview__
  desc: Web3 新人低成本生存与成长全周期方法论：宏观判断周期红利 → 理解行业演进与架构 → 完成心理成长七阶段跃迁 → 建立安全底线思维 → 选择核心贡献者路径切入
    → 积累认知与资源后过渡至工作室批量化或核心圈层玩法。
  excerpt:
  - 为了更快的了解这个赛道。首先，我们要了解这个赛道一些大的演变... 其次，在这个大的背景下，我们又将整个 Web3 行业分为四个层面... 最后，就是参与方式...
    围绕以上内容，大家会对在 Web3 找到自己的定位有一个基础认知。
- name: 宏观周期判断法：四年减半铁律定锚
  desc: 基于比特币四年减半周期，判定 2022 年底为上一轮与新一轮行情交替大底，据此规避熊市亏损、把握布局窗口期。
  excerpt:
  - 以往期数据综合来看，加密赛道有着四年减半的铁律，且 2022 年底是上一轮和新一轮行情的交替大底。所以，我有理由相信，生财有术在这个节点开设 Web3 首期小航海，已经帮助大多数人避开了大熊市的亏损风险。
- name: 赛道估值对标法：互联网早期类比
  desc: 将加密赛道总市值（0.85-3 万亿）与单一互联网巨头（亚马逊）市值对比，类比互联网 25 年前估值水平，论证赛道处于极早期、空间巨大。
  excerpt:
  - 可以看到当前的市值数据显示：整个加密赛道总体市值都进不了前五，比不过亚马逊。举个不恰当的例子：如果我们把时间倒退到 25 年前，整个互联网赛道的估值可能也不一定能进前五。而现在的单一互联网公司就可以以压倒性优势霸榜很长时间
- name: 新人零成本切入实操 SOP
  desc: 1. 依据兴趣选择赛道（公链/DeFi/GameFi等）；2. 寻找招募 MOD/大使的项目（Discord/Twitter/官网）；3. 申请核心贡献者角色（无需本金、接受前期白嫖）；4.
    深度研习项目白皮书、路线图、代币模型、团队架构；5. 输出贡献（翻译、运营、测试、治理）建立声誉；6. 积累项目方信任获薪资/代币/期权/人脉；7. 复制经验至多项目或转型工作室/投资端。
  excerpt:
  - 你可以从任意你喜欢的领域切入后，找到相应的项目，去申请成为项目的 MOD（社区管理）或者大使，有的有薪资，有的没有但可以深度学习，对于新人尽量选择那种不需要投入本金的项目，哪怕前期被白嫖劳动力也无所谓，参与其中并快速了解该项目的白皮书、路线图、团队框架、代币模型等等，持续进步迭代你的认知，就会更快的找到适合自己的定位。
- name: 安全生存底线清单
  desc: 核心原则：不贪心。操作规范：仅从官网入口访问、拒绝一切陌生链接（中奖/财富密码/熟人推荐均可能为钓鱼）、使用硬件钱包隔离大额资金、定期撤销不必要的合约授权。
  excerpt:
  - 核心就一句话：不要贪心。不要随便点链接，网站从官网进。一般情况都是钓鱼为主，要么说你幸运得了奖... 要么是天花乱坠的财富密码... 要么是自己偷懒想着发你链接的人没有问题...
- name: 空投交互收益最大化策略
  desc: 聚焦高预期项目（OP、StarkNET、Aptos、ZK 等），通过多账号真实交互（跨链、Swap、治理投票、域名注册等）满足潜在空投标准，侧重零成本或低成本高预期项目，规避打新等不擅长领域。
  excerpt:
  - 撸空投是偏一级的参与方式，有的需要一些成本，有的没有成本，只需要你参与贡献和交互，但是在我的认知里，这是最稳定的获利方式，比打新的侧重要高... 最近在深度参与
    OP（2 期，已经被白嫖）、StarkNET（当前极其热门）、Aptos（2 期）、ZK 等预期很高项目，尤其侧重了 OP。
theorems:
- name: 建设者红利 > 投机者红利
  desc: 长期来看，深度参与项目建设（运营、开发、治理、内容）获取的薪资、代币激励、声誉资产及人脉网络，其确定性与上限均显著高于二级市场交易投机。
  excerpt:
  - 投资亚马逊股票的人不一定赚钱，但是在亚马逊上班的人，一定赚到很多钱。而且相较于交易者时常制造的市场情绪而言，愿意深入到 Web3 项目中的耕耘者才更配得上建设者的标语。
  - 钱能换来你的收益，但是买不来你的真正理解... 不要过早的交出你的筹码
- name: 认知变现滞后性定律
  desc: Web3 收益必然滞后于认知水平；凭运气赚到的超认知收益，最终会因认知不足而亏损归零（"凭运气赚的钱早晚会凭实力亏回去"），唯有认知迭代匹配的收益才可持续。
  excerpt:
  - 生财有术赚钱有道，凭运气赚的钱早晚会凭实力亏回去，相信生财有术的伙伴对此深度认同。
  - 赚了超出自己认知的钱，亏红了眼，亏得更惨，这是每一个在牌桌上的人都会经历的阶段
- name: 新人时间窗口红利期
  desc: 当前处于主流机构未入场（巴菲特诋毁）、监管探索期（香港试点）、牛市未启动（预计明年中期）的三重窗口期，新人拥有 6-12 个月低成本试错、建立优势的战略机遇期。
  excerpt:
  - 现在主流的声音是要等到明年中期才会有赛道的真正行情，所以，新人还有不少时间可以做准备，在这半年里，多参与项目的贡献，多参与社区的建设，少一些锋芒，少一些本金甚至只用极少的可以承担风险的资金入场，找找手感。
  - 6.1 香港试点是个好转机... 甚至都不是很入流（还是存在很多主流机构看不上这个赛道，比如：巴菲特先生甚至是诋毁）
- name: 身份锚定反脆弱性
  desc: 在 DAO/项目中确立核心贡献者/大使等正式身份，比单纯持有代币更具抗风险性：身份带来的信息流、资源流、声誉积累具有复利效应，不随币价剧烈波动而归零。
  excerpt:
  - 我有幸在进入赛道三个月后就成了 Flow 公链的中国大使，帮我有了对这个赛道更立体的了解，相信各位生财圈友一定也可以更快的成为自己认定的项目的核心贡献者，从而更快的进入
    Web3，成为一名真正的建设者。
  - 人的运气会随着自己的状态不断变化的，接下来就是越来越顺的事情，我经手的 NFT 项目主体公司也即将登陆纳斯达克上市等等
findings:
- name: Aptos 空投实测收益
  desc: '[evidence] 作者亲测 Aptos 空投单账号平均收益约 1 万元人民币，验证了零成本交互式空投的高性价比。'
  excerpt:
  - 我在 Aptos 上面吃到了一小波，几乎每个账号平均收益一万元左右
- name: Axie Infinity NFT 价格巅峰案例
  desc: '[claim] 作者引用私董会分享案例：Axie 游戏内单个 NFT 曾炒至上海半套房价，仅耗时一年多，展示 GameFi 早期财富效应极致。'
  excerpt:
  - Gamefi——Axie。它是 Gamefi 极有代表性的项目之一，在去年八月份还在生财有术私董会上听温虾米讲这个项目，一度一个游戏内的 NFT 可以被炒到上海的半套房子的价格，而它只用了一年多时间就达到了这个高度。
- name: CryptoPunks 价格演变史
  desc: '[evidence] 引用公开市场数据：CryptoPunks 从近乎免费铸造到地板价 80 ETH（约 70 万人民币），四年涨幅验证 NFT
    早期持有价值。'
  excerpt:
  - NFT——Cryptopunks。它是继加密猫后的被公认为 NFT 鼻祖的项目，以近乎免费的价格到现在的地板价（市场最低价格）80ETH（70 万人民币），而最高点价格更是恐怖，达到这个程度也就四年时间
- name: 作者个人职业跃迁路径验证
  desc: '[evidence] 作者从小白（2022.10 入圈）到 3 个月成 Flow 中国大使、5 个月任 NFT 公司全职 Leader、6 个月联合出书《零基础读懂
    Web3》、经手项目即将纳斯达克上市，实证核心贡献者路径可行性与时间压缩度。'
  excerpt:
  - 一月份我正式成为了 Flow 中国大使，有一定的薪资；五月份我进入了一家 NFT 公司做全职 Leader... 六月底协助 InverseDAO 的发起人
    Anymose 及 DAO 内成员和北大出版社联合策划推进 Web3 书籍《零基础读懂 Web3》... 我经手的 NFT 项目主体公司也即将登陆纳斯达克上市
- name: FTX 暴雷导致大 V 资产缩水现象
  desc: '[claim] 作者观察到 FTX 暴雷事件导致许多赛道知名大 V 亏损殆尽，反而新人资金储备可能更充足，打破「大 V 富有/专业」的幸存者偏差。'
  excerpt:
  - 尤其是前段时间的 FTX 交易所暴雷，导致很多人亏的都不剩什么，所以，先打好你的基础... 对于新人我想说：不要迷信身份看起来很牛逼的大 V，相比而言，还是新人的你们可能储备资金都比很多在赛场上的大
    V 要多
