learning_targets:
- 理解企业级中后台前端架构的全生命周期落地流程：从技术选型、基建搭建到业务开发、质量保障、发布运维与演进规划
- 掌握技术选型决策矩阵与 ADR 记录方法，建立可追溯、可复盘的架构决策治理体系
- 掌握 Monorepo 仓库初始化、标准化脚手架生成与 pnpm Workspace 依赖管理最佳实践
- 掌握 UI 组件库二次封装、统一请求层、RBAC 权限体系、动态路由、国际化无障碍基线、异常监控等核心基建模块的工程化落地
- 掌握 Schema 驱动的 CRUD 页面标准化开发模式，提升典型业务页面的生产效率与一致性
- 了解微前端架构在中后台场景下的接入策略、沙箱隔离、共享依赖治理与通信机制
- 掌握 CI/CD 流水线设计、质量门禁阈值设定、GitOps 交付、金丝雀灰度发布与回滚演练体系
- 建立技术债务识别、量化评估、ADR 驱动重构的持续治理机制，以及团队技术分享与知识沉淀的工程文化体系
concept_map:
- 第24章 综合实战：企业级中后台前端架构落地全过程
- ├── 1. 项目启动：技术选型与基建基因
- │   ├── 技术选型决策矩阵  —— P001
- │   ├── 架构决策记录 (ADR)  —— P001, P011
- │   ├── Monorepo 仓库初始化 (pnpm Workspace)  —— P002
- │   └── 标准化脚手架模版  —— P002
- ├── 2. 基础设施建设：核心能力封装
- │   ├── UI 组件库二次封装 (@enterprise/ui)  —— P003
- │   ├── 统一请求层 (@enterprise/request)  —— P003
- │   ├── RBAC 权限体系与动态路由  —— P004
- │   ├── 国际化 (i18n) 与无障碍 (a11y) 工程化基线  —— P005
- │   └── 异常监控与全链路可观测性  —— P006
- ├── 3. 核心业务开发：效率与规范并重
- │   ├── Schema 驱动 CRUD 页面标准化 (ProTable/ProForm/ProChart)  —— P007
- │   ├── 微前端子应用接入与共享依赖治理  —— P008
- │   └── 业务单测/E2E 用例编写规范  —— P003
- ├── 4. 质量保障与发布：自动化防线
- │   ├── CI/CD 流水线与质量门禁 (Lint/TypeCheck/Unit/E2E/Scan/Perf/A11y)  —— P009
- │   ├── GitOps 持续交付 (ArgoCD)  —— P009, P010
- │   ├── 金丝雀灰度发布与蓝绿部署  —— P010
- │   └── 回滚演练与混沌工程  —— P010
- └── 5. 架构演进与知识沉淀：持续进化
- '    ├── 技术债务识别、量化与重构提案 (ADR驱动)  —— P011'
- '    ├── 组件复用率统计与度量驱动  —— P011'
- '    ├── 团队技术分享体系化 (周会/月度/季度)  —— P012'
- '    └── 《前端架构演进白皮书》沉淀  —— P012'
life_analogy:
- 想象搭建企业级中后台前端架构，就像**盖一座现代化的“智能商业大厦”**：
- '- **技术选型矩阵与 ADR** = **《建筑设计规范》与《工程会议纪要》**：在动土前，通过量化评分选定钢筋品牌(框架)、电梯型号(构建工具)、物业公司(状态管理)，并将每次重大变更(改梁换柱)的理由、利弊、责任人永久存档，防止后人拍脑袋决策。'
- '- **Monorepo 与标准化脚手架** = **“预制构件工厂”+“标准图纸”**：公共设施(UI库、请求层、工具函数)在工厂统一预制、版本管理；新楼层(子应用/业务包)拿来即用，保证水电管线(规范、配置)从地基就对齐，避免每层楼自行挖沟铺管。'
- '- **二次封装/请求层/RBAC/动态路由** = **“智能物业管理系统”**：统一安保(权限指令)、通行证(动态路由)、弱电箱(请求层Token刷新)、多语言标识牌(i18n)、无障碍坡道(a11y)、火灾报警系统(监控SDK)，租户(业务开发)只需专注装修内部(业务逻辑)。'
- '- **Schema 驱动开发** = **“模块化精装修套餐”**：标准户型(列表/表单/详情)不再现场砌墙砖瓦(手写代码)，而是选定风格配置单(Schema)，工厂预制好模块吊装到位，交付周期从月变周，且自带验收合格证(类型/测试/无障碍)。'
- '- **微前端接入** = **“商业综合体招商运营”**：基座=商场主体(主入口、中庭、消防核心筒)，子应用=品牌专柜(独立装修、独立结算、独立人员)，共享依赖=商场统一提供的中央空调/网络/物流接口(React/Vue/UI库单例)，避免每个专柜自建锅炉房。'
- '- **CI/CD 质量门禁/灰度/回滚** = **“分级验收与应急预案”**：从材料进场检验(Lint/TypeCheck)、样板间验收(Unit/E2E)、消防验收(安全/性能/无障碍)，到试营业(金丝雀1%->100%)、正式开业；一旦发现隐患，启动预案(回滚/熔断)将损失控制在最小范围，并复盘形成新规范。'
- '- **技术债务治理与知识沉淀** = **“大厦全生命周期运营手册”**：定期体检(债务清单)、局部翻新(重构ADR/绞杀者模式)、物业经验沉淀(技术分享/白皮书)，让大厦越住越顺手、越老越值钱，而非越修越烂。'
summary:
- concept: 技术选型决策矩阵
  desc: 多维度量化评分工具，将主观偏好转化为团队共识的客观决策依据
- concept: 架构决策记录 (ADR)
  desc: 记录背景-决策-后果-替代方案的不可篡改单页文档，构建架构考古的证据链
- concept: Monorepo (pnpm Workspace)
  desc: 单仓多包管理模式，实现依赖去重、原子提交、代码共享零成本、统一规范
- concept: 标准化脚手架
  desc: 将最佳实践固化为可交互生成的模版，保证新项目 Day 1 即满足工程规范
- concept: 二次封装组件库 (@enterprise/ui)
  desc: 吸收底层库 Breaking Change，沉淀业务高阶组件(ProTable/ProForm)，提供稳定企业级 API
- concept: 统一请求层 (@enterprise/request)
  desc: 内置拦截器、类型安全、Token无感刷新、错误码映射、请求去重的网络层基建
- concept: RBAC 与动态路由
  desc: 基于后端下发路由树与权限码，实现菜单/按钮/页面级动态访问控制与刷新保活
- concept: i18n/a11y 工程化基线
  desc: ICU MessageFormat + 编译时优化 + CI门禁，WCAG 2.1 AA 级组件库内置合规
- concept: 全链路可观测性
  desc: 错误监控(Source Map还原) + 性能监控(Web Vitals) + 链路追踪(TraceID透传) 三位一体
- concept: Schema 驱动开发
  desc: 声明式 PageSchema 配置生成 CRUD 页面，配合渲染器注册机制平衡标准化与扩展性
- concept: 微前端治理 (qiankun/Module Federation)
  desc: 沙箱隔离/样式隔离/共享依赖单例/基座分发/通信机制/版本锁定规范的系统性落地
- concept: CI/CD 质量门禁
  desc: 分阶段阻断：Lint/TypeCheck/Unit/E2E/Build/Scan/Perf/A11y，制品不可变 + GitOps 交付
- concept: 金丝雀发布与回滚演练
  desc: 流量渐进切分+会话一致性+数据库兼容+自动熔断+季度实战演练，RTO < 5min
- concept: 技术债务 ADR 治理
  desc: 分级分类(P0-P4)、量化成本、绞杀者模式渐进重构、度量驱动验收(构建/体积/LCP/覆盖率/频次)
- concept: 团队技术分享与白皮书
  desc: 周会/月度/季度分层机制，产出导向沉淀资产，技术雷达联动，新人传承标准化
exercises:
- 'no': 1
  title: 技术选型决策矩阵与 ADR 实战演练
  contents:
  - 场景：团队需在 Vue 3 + Pinia + Vite 与 React 18 + Redux Toolkit + Rspack 两套技术栈中二选一，作为新中后台主应用基座。
  - 任务：
  - 1. 设计一个包含至少 6 个评估维度（如：团队熟悉度、生态成熟度、构建性能、长期维护成本、招聘市场供给、TypeScript 支持度）的决策矩阵，定义权重分配原则。
  - 2. 模拟打分过程，计算加权得分。
  - 3. 基于矩阵结果，编写一份 ADR 文档（包含 Context、Decision、Consequences、Alternatives、Status），并关联一个假设的
    GitHub Issue 编号。
  - 思考题：
  - '- 如果 6 个月后团队核心成员流失 30%，导致熟悉度维度得分反转，ADR 应如何流转状态？是否需要新建 ADR？'
  - '- 如何避免决策矩阵沦为“为预设结论找理由”的工具？'
- 'no': 2
  title: Monorepo 依赖治理与脚手架设计
  contents:
  - 场景：企业级 Monorepo 结构包含 `apps/admin-main`、`apps/admin-sub-user`、`packages/ui`、`packages/request`、`packages/config`（共享
    ESLint/TS/Vite 配置）。
  - 任务：
  - 1. 绘制依赖关系图：标明哪些包依赖 `packages/config`、哪些包互相依赖、哪些为叶子节点。
  - 2. 设计 `pnpm-workspace.yaml` 配置，要求：`packages/*` 互相链接、`apps/*` 消费 `packages/*`、根目录统一管理
    `catalog` 依赖版本。
  - 3. 编写 `create-enterprise-app` 脚手架核心交互逻辑伪代码：支持 `--framework=vue|react`、`--ui=arco|antd`、`--state=pinia|redux`
    参数组合，生成对应的 `package.json` 依赖、`vite.config.ts` 插件、`tsconfig.json` 引用、`src/main.ts`
    入口。
  - 思考题：
  - '- 当 `packages/ui` 升级导致 Breaking Change 时，如何利用 Monorepo 优势在单次 PR 中完成所有消费端适配并原子性发版？'
  - '- 核心加密算法包 `packages/crypto` 不能开源，如何在 Monorepo 中做权限隔离？'
- 'no': 3
  title: Schema 驱动 CRUD 页面配置实战
  contents:
  - 场景：需快速生成“用户管理”列表页，包含：搜索区(用户名/状态/日期范围)、表格(姓名/手机/状态标签/角色标签/操作列)、分页、工具栏(新增/批量删除/导出)、新增/编辑抽屉表单(表单联动：选省份->加载城市)。
  - 任务：
  - 1. 定义该页面的 `PageSchema` JSON 结构（含 `layout`、`toolbar`、`table.columns`、`form.fields`、`actions.api`
    映射、`permissions` 绑定）。
  - '2. 针对“状态标签”列，设计 `renderer: ''TagRenderer''` 的 `options` 配置；针对“操作列”，设计 `renderer:
    ''ActionRenderer''` 的 `actions` 数组（含权限码、确认二次弹窗、图标）。'
  - 3. 编写表单联动配置：`province` 字段 `onChange` 回调中，如何声明式描述“清空 city 值”并“异步更新 city 选项”？
  - 思考题：
  - '- 当业务需求超出 Schema 表达能力（如：表格行内展开嵌套子表格、多步向导式表单），如何通过“渲染器注册机制”优雅扩展，而不污染核心 Schema
    类型定义？'
  - '- Schema 版本从 1.0 升级到 2.0（如 `table.columns` 结构扁平化为 `columns` + `columnGroups`），如何设计迁移脚本自动转换存量
    200+ 页面配置？'
- 'no': 4
  title: CI/CD 质量门禁阈值设定与灰度发布策略推演
  contents:
  - 场景：中后台主应用日均部署 5 次，核心链路为“用户登录 -> 列表查询 -> 新建/编辑 -> 审批流转”。
  - 任务：
  - 1. 制定分阶段质量门禁阈值表：
  - '   - Lint/TypeCheck: Error=0 (硬性)'
  - '   - 单测覆盖率: 核心包(@enterprise/*) ≥ 95%，业务包 ≥ 80%'
  - '   - E2E: 核心链路 100% 通过，非核心 ≥ 80%'
  - '   - 性能预算: LCP < 2.5s, CLS < 0.1, INP < 200ms, JS 体积 < 170KB(gzip)'
  - '   - 安全: High/Critical 漏洞 = 0, 秘钥扫描 = 0'
  - '   - 无障碍: axe-core 违规 = 0 (CI 阻断)'
  - 2. 设计金丝雀发布流量切分策略：1%(内部犬食) -> 5%(灰度用户组) -> 20%(新用户) -> 50% -> 100%，每阶段观测指标、持续时长、自动熔断条件(错误率>1%
    或 核心转化率下降>5%)。
  - 3. 编写回滚演练脚本大纲：模拟“新版本导致审批接口 500”，验证监控告警->值班响应->ArgoCD 回滚->流量回切->业务恢复全链路耗时。
  - 思考题：
  - '- 前端静态资源灰度易实现，但后端接口变更不兼容时，前端灰度如何通过 API 版本化/向后兼容字段/双写策略保证新旧前端版本共存？'
  - '- 视觉回归测试在动画/时间戳/用户头像场景频繁误报，如何设计 `mask` 与 `threshold` 策略平衡灵敏度与噪音？'
- 'no': 5
  title: 技术债务识别、量化与重构 ADR 闭环演练
  contents:
  - 场景：遗留项目中存在 3 个典型技术债务：
  - '  A. `utils/request.ts` 被 30+ 业务文件直接 import，内含 5 种 Token 刷新实现，无统一错误处理。'
  - '  B. `UserTable.vue` 组件 1200 行，混杂搜索/表格/表单/权限/导出逻辑，零单测，改动必改 10 处。'
  - '  C. 依赖 `lodash@4.17.15` (含原型污染漏洞) 与 `moment@2.29.0` (体积大、停维) 全量引入。'
  - 任务：
  - 1. 填写《技术债务清单》结构化记录：为 A/B/C 分别定义 ID、类型、严重度(P0-P4)、影响范围、量化痛点数据(如：排查网络问题平均耗时+30min/次、单测覆盖率0%、包体积多增50KB)。
  - 2. 为债务 A 编写重构提案 ADR：背景量化成本、决策采用绞杀者模式分 4 阶段迁移至 `@enterprise/request`、提供 Codemod
    脚本自动替换 import 路径、定义验收指标(网络排查耗时-80%、请求层覆盖率 100%)。
  - 3. 设计“技术债务专项偿还预算”在季度规划中的占比策略：如每 Sprint 预留 20% 带宽、每季度设立 1 周“技术攻坚周”、P0 债务随时插入。
  - 思考题：
  - '- 如何防止“重构债务”本身成为新债务？(提示：并行运行对比、防腐层、特性开关、度量验收)'
  - '- 组件复用率统计若仅计算 `import ''@enterprise/ui''` 次数，有何盲区？如何设计更能反映真实复用价值的指标体系？'
