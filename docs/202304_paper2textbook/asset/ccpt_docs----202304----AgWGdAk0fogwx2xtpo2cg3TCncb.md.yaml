paper: docs/202304/AgWGdAk0fogwx2xtpo2cg3TCncb.md
desc: 该素材提出了一套利用GPT进行抖音口播视频脚本批量化生产的标准化工作流（SOP），核心主张是将GPT视为“需培养的天才童工”而非“全能老板”，通过“角色设定-知识灌输-范例复刻-指令生产”四步法，结合“分块喂养、多轮夸奖、具体化指令、自建Prompt库”等调教技巧，实现对爆款视频结构的低成本复刻与规模化内容生产，解决执行层“听话照做”难的问题。
concepts:
- name: GPT调教范式：老师-天才童工模型
  desc: 重新定义人机协作关系：用户应扮演‘老师’而非‘老板’，GPT是‘智商250的3岁神童/天才童工’，需通过分步教学、耐心引导、正向强化（夸奖）来激发其潜能，而非直接下达模糊指令等待结果。
  is_original: true
  excerpt:
  - 我们可以把GPT当成一个3岁神童，他的原始知识库是很粗浅的。但架不住他智商高呀，几千字的内容他一下子就能学会了。所以，他一定会成为我们24小时在线，任劳任怨，而且一教就会一点就通的天才童工。
  - 大家如果仔细体会的话，会发现我们一直在教GPT怎么做得更好，我们是在传授。我们这样的调教方式，其实更像是让我们成为一名老师，把GPT当成一个智商250的天才神童去培养。
  - 你觉得，从你以前刚毕业初入职场的亲身经历来看，是员工小G的问题，还是老板的问题？
- name: 四步调教法
  desc: 素材核心方法论的结构化总结：步骤一 角色设定；步骤二 结构化知识灌输（航海手册核心方法论）；步骤三 逆向拆解热门文案（少样本学习）；步骤四 无脑执行生产（选题-脚本-录制-剪辑全流程闭环）。
  is_original: true
  excerpt:
  - '## 第一步：给予设定'
  - '## 第二步：灌输知识（资料来源于抖音大航海手册）'
  - '## 第三步：输入从别的热门视频里扒下的文案'
  - '## 第四步：无脑制作'
- name: 分块喂养与自我总结验证机制
  desc: 防止GPT‘囫囵吞枣’式学习的关键机制：将长知识库拆解为小块分批输入，强制要求GPT输出‘学习总结/心得体会’，以此作为其真正理解并内化知识的验证指标，类比‘学霸做笔记总结’与‘学渣一目十行’的差距。
  is_original: true
  excerpt:
  - 记得分块发知识...你发一长串，这小子其实也会说：‘好的，我已经学会了’...但是他写出来的内容就会很垃圾，也没有参照你投喂的内容写。
  - 好好想想，这是不是上学时，学渣和学霸之间的差别？学渣看了一遍就说自己会了，结果一做就废。学霸一步一步脚踏实地，每节课都做笔记，还会自己总结心得体会。调教出来的GPT之间的差距也是这么来的。
  - 核心点是要让他去自己总结，会总结就说明他真的学会了。甚至你还能从他总结的知识点学到新东西。
- name: 个人Prompt资产库
  desc: 将高效指令沉淀为可复用资产的体系，包含四大模块：学习指令模板、知识结构组织模板、范文/案例库、修正指令模板。主张未来优秀创作者必具备‘内容法则’与‘调教能力’双重素养。
  is_original: true
  excerpt:
  - 一定要学会建立自己的prompt库，可以涵盖几个方面：怎么发起学习指令让GPT更好地学会；怎么样的知识结构能让GPT更好地领悟；...建立范文库...要不断修正
- name: 正向强化触发机制
  desc: 利用RLHF（人类反馈强化学习）特性，通过多轮夸奖、情感化称呼（如‘神通广大的GPT’、‘求求你了’）显著提升GPT输出质量与配合度，将拟人化交互技巧工程化。
  is_original: true
  excerpt:
  - 多夸夸这小子...我发现多说他做得好，他会帮我干活干得更卖力。甚至你说：‘求求你了，神通广大的GPT。’这逼还会把‘神通广大的GPT’放到文案里
methods:
- name: __overview__
  desc: 抖音口播视频脚本GPT化批量生产全流程SOP：设定角色 -> 灌输领域知识(分块+验证总结) -> 注入爆款范例(少样本) -> 指令生成成品脚本
    -> 人工落地执行(录制/剪辑/数字人)。
  excerpt:
  - '## 第一步：给予设定...成为我抖音脚本制作助理...'
  - '## 第二步：灌输知识...请学习：视频脚本主要包括哪些方面...常用脚本一：三段式脚本...'
  - '## 第三步：输入从别的热门视频里扒下的文案...请根据你学到的常用脚本模板和爆款因子...将下面这段内容改写...'
  - '## 第四步：无脑制作...选题：来自热门视频...文案脚本：直接扒了同行...录制：直接用剪映提词器...剪辑：都告诉你配啥素材了...'
- name: 角色设定Prompt模板
  desc: 标准化System Prompt，锁定GPT身份、工作流触发词（‘请学习’/‘请改写’）、反馈规范（学会回复‘好的，我已经学会’）与交互协议。
  excerpt:
  - 你好GPT~我有一个小忙需要你来帮助我，我希望你能成为我抖音脚本制作助理，我会教授你你需要参照的脚本框架，如果我向你输入的内容以‘请学习’为开头，则我是在教授你知识，请你认真学习，学会后请回答‘好的，我已经学会’。在教授一系列技巧后，我会以‘请为下面内容改写脚本’为开头，向你提供短视频内容，请你根据你学到的技巧为我创作相应段视频脚本。如果你明白我的意思，请回复：‘好的，小凡，很高兴帮助你，我将按照你说的成为你的抖音脚本制作助理。’
- name: 结构化知识灌输法
  desc: 将非结构化航海手册/方法论拆解为‘定义体系（景别/画面/台词/运镜/道具）’与‘核心模板（三段式：两重一轻/开头重/结尾重/中间轻/无形装逼）’等离散知识单元，分批次喂给GPT并强制要求输出总结。
  excerpt:
  - 请学习：视频脚本主要包括哪些方面 1.景别... 2.画面... 3.台词... 4.运镜... 5.道具...
  - 请学习：常用脚本一：三段式脚本 三段式脚本的核心是 ‘两重一轻’，开头 ‘重’ 是为了吸引用户停留... 结尾 ‘重’... 中间的 ‘一轻’... 无形装逼最为致命...
- name: 爆款范例逆向注入法
  desc: 采集竞品爆款视频文案，作为少样本范例输入GPT，指令其‘选择合适模板+穿插爆款因子’进行改写重组，实现结构迁移而非内容抄袭，输出含时长、素材建议、模板溯源说明的完整脚本。
  excerpt:
  - 你的学习能力太棒了！请根据你学到的常用脚本模板和爆款因子，选择你认为合适的脚本模板，并由选择性地穿插爆款因子，将下面这段内容改写，形成一份3分钟的视频文案脚本，需要包含时长、并建议配合怎么样的视频素材。
  - 甚至他还会说明，这个脚本他是用了哪些模板，用了什么爆款因子。
theorems:
- name: 执行力瓶颈源于‘老板思维’而非工具能力不足
  desc: 大多数人用不好GPT的核心原因是代入‘老板思维’（提模糊需求、不给资料、不培训、只甩锅），而非‘老师思维’（拆解任务、喂养知识、分步验证、正向激励）。GPT表现上限取决于调教者的教学设计能力。
  excerpt:
  - 真的是AI不行？还是你不行？这些人使用GPT时往往代入的是老板思维...而GPT就像是一个初入职场懵懵懂懂的小白...你觉得GPT能做好吗？...是员工小G的问题，还是老板的问题？
- name: 爆款内容可复制性定律：爆过的选题往往都会再爆一遍
  desc: 选题层面的核心确定性假设：已验证的爆款选题具有极高的再次爆款概率，结合标准化爆款脚本结构（三段式+爆款因子），可实现内容生产的确定性复刻。
  excerpt:
  - 选题：来自热门视频，参照‘爆过的选题往往都会再爆一遍。’
  - 文案脚本：直接扒了同行，但是我们用了爆款脚本，甚至可能结构做得还比他们好。
- name: 短视频仍是AI应用护城河，图文领域AI已具备碾压优势
  desc: 判断当前AI能力边界：受限于多模态视频理解能力缺失（无法直接看视频学习），短视频制作仍保留人类门槛；但图文领域GPT已具备击败普通博主的潜力，双料人才（懂内容法则+懂调教）是未来核心竞争力。
  excerpt:
  - 目前GPT最大的一个问题还是没办法观看视频内容...所以我认为未来一段时间，短视频大体对于AI来说还是有一定门槛的。
  - 当然，我仅仅说了短视频还有门槛，但是图片和文字，我可以明确看到GPT有击败普通博主的潜力了。
  - 未来真正优秀的博主，一定是一边拥有超级优秀的内容制作法则，另一边能够得心应手调教GPT的双料人才。
findings:
- name: 分块喂养+强制总结显著提升长上下文学习效果
  desc: '[evidence] 实测对比：一次性喂入长文档GPT虽回复‘已学会’但实战生成垃圾内容；分块喂入并强制要求输出‘学习心得/总结’后，GPT能准确复述知识点（如‘明白了无形装逼的重要性’）且实战脚本质量极高，验证了‘会总结=真学会’的假设。'
  excerpt:
  - 在我们输入之后，GPT不仅仅会说他学会了。他甚至还会自己总结这段内容里面他学到了什么，确实是真的学到。
  - 你发一长串...他写出来的内容就会很垃圾...核心点是要让他去自己总结，会总结就说明他真的学会了。
- name: 正向情感提示词显著增强模型指令遵循与输出质量
  desc: '[evidence] 实测发现：在Prompt中加入夸奖、恳求、情感化称呼（‘神通广大的GPT’、‘求求你了’），GPT输出更卖力、更贴合要求，甚至将称呼内嵌生成内容，证明RLHF机制下情感正向反馈对推理链路的强化作用。'
  excerpt:
  - 多夸夸这小子...我发现多说他做得好，他会帮我干活干得更卖力。甚至你说：‘求求你了，神通广大的GPT。’这逼还会把‘神通广大的GPT’放到文案里
- name: 三段式脚本结构化迁移生成实战验证
  desc: '[evidence] 实测案例：输入一段反AI割韭菜的口播文案，GPT成功套用‘三段式（两重一轻）’模板，植入‘黄金前3秒钩子’、‘无形装逼’、‘行动号召’等爆款因子，输出含分镜时长、素材建议、模板溯源说明的完整3分钟脚本，质量超越人类手写水平。'
  excerpt:
  - 你的学习能力太棒了！请根据你学到的常用脚本模板和爆款因子...将下面这段内容改写...
  - 甚至他还会说明，这个脚本他是用了哪些模板，用了什么爆款因子。你仔细想想你写的短视频脚本，有这家伙几秒钟学完之后写得好吗？
- name: 全流程生产链路打通：从脚本到成片的‘无脑’执行闭环
  desc: '[claim] 宣称已实现选题定策(热门复刻) -> 脚本生成(GPT) -> 录制(剪映提词器/数字人) -> 剪辑(素材库对标) -> 发布的全自动化/半自动化链路，将单条视频边际成本压至极低，实现‘矩阵化批量化运作’。'
  excerpt:
  - '## 第四步：无脑制作 GPT都给我们把饭喂到嘴边了...'
  - 选题：来自热门视频... 文案脚本：直接扒了同行... 录制：直接用剪映提词器录个口播就行，甚至现在还可以用数字人来做 剪辑：都告诉你配啥素材了，直接找素材就行了
