paper: docs/202304/20230418_099.md
desc: 该素材由生财有术圈友虚十七撰写，核心主张是赚钱需具备认知、技能、实战三要素并跑通闭环，三者并非时序关系而应以实战为牵引反向驱动认知与技能的获取，并将生财有术定位为高效的信息引擎，建议带着具体实战项目中的问题去检索、交换社群资源以动态提升天花板。
concepts:
- name: 赚钱闭环三要素
  desc: 指赚钱路径必须包含认知、技能、实战三个要素，缺一不可，三者相互依存共同构成赚钱的完整闭环。
  is_original: false
  excerpt:
  - 赚钱需要具备认知、技能与实战，三者缺少任意一者都无法完成赚钱的路径闭环，也就是无法跑通赚钱。
- name: 非时序认知获取观
  desc: 主张认知、技能与实战不是线性的先后顺序，不应等准备充分再实战，而应在实战中动态获取所需认知与技能。
  is_original: true
  excerpt:
  - 认知、技能与实战并不是时序的关系。也就是说，并非充分准备好认知与技能才能进行实战
  - 在现实实战中，你遇到的问题和挑战可能是动态调整的，甚至当你充分准备好应对策略时，你所面对的 Boss（机会）早已经不存在了。
- name: 动态天花板理论
  desc: 指业务收益天花板非静态固定，而是在解决具体问题、产生新认知的过程中动态上移，解决痛点会发掘新需求与市场。
  is_original: true
  excerpt:
  - 天花板并不是静态不变，而是在解决具体问题的过程中，随着产生新的认知而动态发生变化。当你在其中解决了一些问题后，可能会发现更多的痛点，从而找到更多需求和市场，因此收益天花板也在不断上移。
- name: 生财有术信息引擎
  desc: 将生财有术社群定位为一个高效且丰富的信息检索与价值交换工具，服务于实战项目中的具体问题解决。
  is_original: true
  excerpt:
  - 生财有术是一个高效且丰富的信息引擎。
  - 这时生财有术就是一个高效的信息工具，你可以在上面找到相关的解答。
- name: 带着问题去学习
  desc: 最高效的知识汲取与技能培养方式，即在实战遇到具体障碍时，带着明确问题去社群检索方案或发起价值交换。
  is_original: false
  excerpt:
  - 最高效汲取新知识和培养新技能的方式，是带着问题去学习。当你在实战中遇到了各种关于认知和技能的问题，这时生财有术就是一个高效的信息工具
methods:
- name: __overview__
  desc: 实战牵引式成长法：以启动具体实战项目为起点，在实战中发现认知与技能缺口，带着具体问题利用社群搜索引擎、项目库SOP、价值交换链接圈友三大渠道获取解决方案，完成认知迭代与技能升级，推动天花板动态上移。
  excerpt:
  - 最重要的要实战项目，带着具体的项目去增删改查自己的赚钱认知与赚钱技能
  - 最高效汲取新知识和培养新技能的方式，是带着问题去学习。当你在实战中遇到了各种关于认知和技能的问题，这时生财有术就是一个高效的信息工具，你可以在上面找到相关的解答。
  - 你可以通过生财有术的搜索引擎，找到亦仁老师跟你说...
  - 你可以从项目库找到圈友已经指明好的道路，也可以通过价值交换来链接生财有术圈友帮忙解答
- name: 社群三维检索法
  desc: 针对实战问题，依次利用搜索引擎检索专家观点、项目库调取标准化SOP、价值交换链接人力资源三个层级的社群资产。
  excerpt:
  - 你可以通过生财有术的搜索引擎，找到亦仁老师跟你说...
  - 你可以从项目库找到圈友已经指明好的道路，也可以通过价值交换来链接生财有术圈友帮忙解答
theorems:
- name: 实战优先于准备定理
  desc: 在动态变化的商业环境中，过度前置准备会导致机会窗口关闭，必须先启动实战，在解决具体问题的过程中动态获取认知与技能，而非追求认知技能完备后再行动。
  excerpt:
  - 在现实实战中，你遇到的问题和挑战可能是动态调整的，甚至当你充分准备好应对策略时，你所面对的 Boss（机会）早已经不存在了。
  - 但这里并非指你不需要准备任何的认知和技能...建议你还是先读下生财有术的新人指南，让自己掌握一些分析的框架和基本认知，避免连续踩坑而心灰意冷
- name: 社群作为外脑的工具论
  desc: 高质量付费社群的核心价值不在于提供静态知识库，而在于作为实战过程中的外部大脑，通过搜索、项目库、人脉连接三大功能，支撑个体在不确定性中快速决策与迭代。
  excerpt:
  - 生财有术是一个高效且丰富的信息引擎。
  - 最高效汲取新知识和培养新技能的方式，是带着问题去学习...这时生财有术就是一个高效的信息工具，你可以在上面找到相关的解答。
findings:
- name: 新人指南作为最小可行性认知包的有效性
  desc: '[claim] 作者建议零基础新人先阅读新人指南建立基本分析框架，避免盲目实战导致连续踩坑心灰意冷。'
  excerpt:
  - 如果你不知道一项赚钱内涉及用户、需求、增长、变现，如果你觉得任何生意都适合自己做，如果你觉得信息差生意很简单，那建议你还是先读下生财有术的新人指南，让自己掌握一些分析的框架和基本认知，避免连续踩坑而心灰意冷
- name: 航海项目作为成熟SOP载体的验证
  desc: '[evidence] 评论区圈友反馈往期航海项目已沉淀为成熟SOP文档，且有固定开船节奏（如5月开船），印证了项目库作为标准化实战路径的可用性。'
  excerpt:
  - '虚十七 : 可以看下往期比较新的航海项目，感觉都是比较成熟的 sop 文档了。'
  - '林洛羽 : 下一期是 5 月份开船哦，可以关注下到时候的星球帖'
- name: 社群资源入口隐蔽性导致利用率低
  desc: '[evidence] 评论区用户反馈干货太多但入口隐藏太深（需通过索引站2.0->实战活动才能找到航海资料），揭示了社群知识资产的发现机制存在体验障碍。'
  excerpt:
  - '周彦充 : 生财有术没看见航海的资料呢'
  - '周彦充 : 找到了，哈哈，干货太多了，隐藏得太深了'
  - '林洛羽 : 哈哈我们正在考虑放出航海相关入口，可以期待一下哟'
