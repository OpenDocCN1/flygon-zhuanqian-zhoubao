units:
- 'no': 1
  name: 认知重塑 —— 从被动收藏到主动建构知识体系
  points:
  - '**为什么需要这个概念？**'
  - '- 传统笔记法（高亮、转发、收藏夹）制造了“收藏夹谬误”：误以为保存等于掌握，实则陷入“编译器思维”陷阱，仅做信息搬运工，无法形成长期记忆与深度理解'
  - '- 认知科学表明：知识不是被灌输的，必须通过主动连接、结构化组织与持续复盘才能内化为图式'
  - '**核心定义**'
  - '- 卡片盒笔记法：一种外部化思维工具，核心原则包括原子化（一卡一概念）、链接优于收藏（建立语义关联）、自底向上生成（从卡片聚类长出大纲而非预设框架填充）'
  - '- 外部大脑：将生物大脑擅长的“思考”保留下来，将不擅长的“存储、检索、关联”外包给笔记系统'
  - '**关键性质**'
  - '- 非线性：打破书本/文章的线性叙事，按思维关联网络组织知识'
  - '- 演化性：卡片库随时间增长而价值指数级上升（梅特卡夫定律），而非线性衰减'
  - '- 生成性：写作不再是从零开始的痛苦挤牙膏，而是从卡片库中“组装”成文'
  - '**典型例子**'
  - '- 卢曼：一生出版 70 部著作、 400 篇论文，靠的不是天赋而是 9 万张卡片组成的“第二大脑”'
  - '- 从“阅读时做笔记”转变为“为写作而阅读”：带着手头卡片的空白处去寻找素材，阅读效率极大提升'
  - '**边界条件**'
  - '- 卡片≠碎片：原子化是指“一个核心论点”，而非“一个孤立事实”；必须包含上下文与改写后的洞见'
  - '- 链接≠标签：单纯打标签（#AI）是分类，写链接理由（“这反驳了卡片 20230418_001 中的观点”）才是思考'
  - '- 工具非核心：Obsidian/Logseq/纸卡均可，关键在于遵循“写时思考、链接时归因”的工作流纪律'
  sources:
  - paper: 20230418_000.md
    role: origin
  - paper: 20230418_001.md
    role: improve
  - paper: 20230418_079.md
    role: apply
  - paper: README.md
    role: critique
  - paper: SUMMARY.md
    role: apply
  excerpts:
  - 知识不是被灌输的，而是通过主动连接、结构化组织与持续复盘主动建构出来的。
  - 对比「收藏夹谬误」与「编译器思维」，揭示单纯记录、高亮、转发无法形成长期记忆与深度理解的认知机制。
  - 定义「原子化」、「链接优于收藏」、「自底向上生成」三大核心原则，确立从素材到概念卡片的标准化工作流。
  - 区分「闪念卡片」（捕捉）、「文献卡片」（理解/改写）与「概念卡片」（综合/创新）的定位、写法及演进路径。
  - 论证「写作是思考的结果，更是思考的过程」，展示如何通过卡片写作倒逼深度阅读，实现输入驱动输出。
  - 辨析「原子化」与「碎片化」的本质区别，指出单纯加标签、不写链接理由、忽视上下文关联的典型反模式。
- 'no': 2
  name: 教材即软件 —— 用工程化流水线替代手工作坊
  points:
  - '**为什么需要这个概念？**'
  - '- 传统教材开发痛点：Word/PDF 二进制格式难以版本控制、协作冲突频发、内容与排版耦合导致多形态交付（教材/教案/课件/网站）极其痛苦、迭代周期以年计'
  - '- 现代教学需求：内容需频繁更新、多端同步发布、支持协同编写、可追溯决策过程'
  - '**核心定义**'
  - '- 教材即代码：采用 Markdown/AsciiDoc 等纯文本格式作为源文件，纳入 Git 版本控制，实现内容的可追溯、可协作、可自动化构建'
  - '- 四层架构：素材层（原始输入/PDF/网页/笔记） -> 概念层（知识原子/概念卡片/中间表示IR） -> 结构层（大纲/逻辑骨架/JSON Schema）
    -> 呈现层（PDF/网站/课件/电子书）'
  - '- 概念卡片驱动开发（CDD）：以概念卡片为唯一“中间表示（IR）”，标准化流水线：聚类素材 -> 提炼概念卡片 -> 编排大纲节点 -> 渲染章节'
  - '**关键性质**'
  - '- 内容与形式分离：源文件只管语义结构，渲染管线负责样式输出，一源多用'
  - '- 机器可读与自动化校验：大纲采用 JSON Schema 约束（强制双段式标题、教学角色标注、素材溯源字段），CI 流水线自动拦截不合规提交'
  - '- 语义化版本控制：引入 SemVer，Major=重构章节/调整逻辑骨架，Minor=新增知识点/案例，Patch=修正错别字/格式，自动生成 CHANGELOG'
  - '**典型例子**'
  - '- 使用 Pandoc/Quarto + GitHub Actions：提交 Markdown 源文件 -> 自动跑测（链接有效性、术语一致性、角色完整性）->
    并行产出：学生版教材、教师版教案（含答案/备注）、交互式网站、Reveal.js 幻灯片'
  - '- 团队协作：作者通过 PR 提交新概念卡片，审阅者检查溯源链完整性、逻辑角色正确性，合并后自动触发多形态发布'
  - '**边界条件**'
  - '- 学习曲线：要求作者具备基本 Git/Markdown/CI 概念，非技术背景作者需配套图形化客户端或编辑器插件降低门槛'
  - '- 非文本素材处理：图表、公式、复杂排版需约定渲染规范（如 Mermaid 图表、LaTeX 数学公式、SVG 矢量图），避免二进制大文件污染仓库'
  - '- 法规与版权：引用第三方素材需在素材层记录版权元数据（作者、来源、许可证），构建时自动生成版权声明页'
  sources:
  - paper: 20230418_001.md
    role: origin
  - paper: README.md
    role: improve
  - paper: SUMMARY.md
    role: apply
  - paper: 20230418_079.md
    role: apply
  excerpts:
  - 类比软件工程，论证教材源文件应采用 Markdown/AsciiDoc 等纯文本格式，纳入 Git 版本控制，实现内容的可追溯、可协作、可自动化构建。
  - 定义教材工程的标准化分层架构：素材层（原始输入）、概念层（知识原子）、结构层（大纲/逻辑骨架）、呈现层（PDF/网站/课件），实现内容与形式分离。
  - 推演「聚类素材 -> 提炼概念卡片 -> 编排大纲节点 -> 渲染章节」的标准化工程流水线，确立概念卡片作为连接素材与大纲的唯一「中间表示（IR）」。
  - 规定 Chapter-Node 二级结构的 JSON Schema，强制要求章标题采用「隐喻类比式」双段式、节点必须标注教学角色，实现大纲的机器可读与自动化校验。
  - 配置 Pandoc/Quarto/GitHub Actions 自动化流水线，一键生成学生版教材、教师版教案、交互式网站、幻灯片，保证多端内容一致性。
  - 引入 SemVer 语义化版本控制至教材，定义 Major/Minor/Patch 对应的内容变更类型，建立变更日志规范。
- 'no': 3
  name: 逻辑架构师 —— 为知识搭建可执行的认知脚手架
  points:
  - '**为什么需要这个概念？**'
  - '- 传统大纲常犯“百科全书式”错误：按知识分类罗列目录（如“第一章 概述、第二章 语法、第三章 API”），忽视学习者的认知负荷与图式构建路径，导致“学完即忘、无法迁移”'
  - '- 教学导向的大纲必须服务于“图式构建”：每个节点都有明确的教学功能定位，章节间逻辑正交（MECE），整体服务于核心主张（金字塔原理）'
  - '**核心定义**'
  - '- MECE 原理在章节划分中的落地：Mutually Exclusive（知识点不重叠/耦合）、Collectively Exhaustive（覆盖达成目标所需所有知识/无盲区），配套“章节正交性检查表”'
  - '- 金字塔原理驱动大纲生成：自上而下表达（先定核心主张）、自下而上思考（通过纵向提问/横向归纳分解节点），保证逻辑闭环'
  - '- 教学角色标注体系：七大角色——motivation（动机/为什么学）、definition（定义/是什么）、method（方法/怎么做）、proof（证明/为什么有效）、experiment（实验/实战案例）、limitation（边界/失效场景）、extension（延伸/前沿拓展），每个节点必须打标'
  - '**关键性质**'
  - '- 认知负荷最小化：通过 motivation 降低门槛激发兴趣，definition 建立精准心智模型，method 提供可执行步骤，experiment
    促进迁移内化'
  - '- 逻辑可验证性：素材溯源四级链条（大纲节点 <- 概念卡片 <- 文献卡片 <- 原始素材），src 字段支持通配符引用，保证每个论点有据可查'
  - '- 结构强制约束：JSON Schema 强制双段式标题（隐喻类比 + 本质阐述）、角色标注非空、素材引用非空，防止“只有定义无动机”、“只有理论无实战”'
  - '**典型例子**'
  - '- 本书大纲生成复盘：原始 24 个章节 Markdown -> 按主题聚类为 3 个篇章（认知/工程/逻辑）-> 提炼 18 个概念卡片 -> 角色标注定节点
    -> 类比命名定章名 -> 输出符合 Schema 的 JSON 大纲'
  - '- 某章节拆分前：混杂“注意力定义、公式推导、代码实现、可视化案例” -> 拆分后：Node1 motivation(序列建模困境)、Node2 definition(数学形式化)、Node3
    method(多头/位置编码)、Node4 experiment(可视化案例)、Node5 limitation(注意力≠解释)'
  - '**边界条件**'
  - '- 角色非互斥：单个节点可含多角色（如 definition+method），但需明确主次；禁止全书只有 definition 角色'
  - '- MECE 是理想态：实际操作中允许“概念前置/后置”形成递进依赖，但须在大纲层面显式标注 depends_on 字段（本 Schema 暂未强制，建议扩展）'
  - '- 素材溯源粒度：paper 字段建议引用到具体文件/页码/段落锚点，而非整本书；通配符 author:xxx/** 仅用于批量引用同一文章集'
  sources:
  - paper: 20230418_000.md
    role: origin
  - paper: 20230418_001.md
    role: origin
  - paper: SUMMARY.md
    role: apply
  - paper: 20230418_079.md
    role: improve
  excerpts:
  - 对比「百科全书式」与「教学导向式」目录差异，引入认知负荷理论，论证大纲必须服务于「图式构建」而非「信息罗列」。
  - 演示如何用「相互独立、完全穷尽」原则审视章节划分，避免知识点重叠（耦合）与遗漏（盲区），配套「章节正交性检查表」。
  - 实操「自上而下表达、自下而上思考」：先定本书/章的「核心主张」，再通过纵向提问/横向归纳分解为节点，保证逻辑闭环。
  - 详解 motivation/definition/method/proof/experiment/limitation/extension 七大角色的定义、识别标准及组合模式，防止「全是定义」「缺乏动机」「无案例支撑」的编写弊病。
  - 建立「大纲节点 <- 概念卡片 <- 文献卡片 <- 原始素材」的四级溯源链，规范 src 字段引用格式（支持 author:xxx/** 通配），保证教材内容的可验证性与学术严谨性。
  - 以本次任务素材为例，全程复盘：原始 Markdown 聚类 -> 概念卡片提炼 -> 逻辑聚类成章 -> 角色标注定节 -> 类比命名定章 -> JSON
    规范化输出的决策链路。
