- 'no': 4
  name: Schema 驱动开发 —— 让配置生成代码，告别重复 CRUD
  points:
  - '**为什么需要这个概念？**'
  - '- 中后台 80% 页面是“列表+详情/表单”的 CRUD 变体，手写 Vue/React 模板代码极其机械、易出错、维护成本高'
  - '- 后端接口字段、前端表单校验、表格列、搜索条件、Excel 导出列定义高度同构，单源头维护可消灭不一致'
  - '- 非技术人员（产品/运营）可通过可视化配置平台直接生成页面，释放研发带宽'
  - '**核心定义**'
  - '- Schema：描述页面结构的 JSON 对象，包含 `fields[]`（字段元数据：type/label/validator/options/props）、`layout`（布局：grid/tabs/steps）、`actions`（工具栏/行操作）、`api`（增删改查接口映射）'
  - '- `ProForm`/`ProTable`/`ProChart`：Schema 驱动的通用组件，接收 Schema 自动渲染表单/表格/图表，内置校验、联动、加载态、提交流程'
  - '- 代码生成器：读取 Schema（或数据库表结构/接口文档），基于模版引擎（Handlebars/EJS）生成 `.vue`/`.tsx` 页面源码，支持保留业务自定义代码区（`//
    [CUSTOM_BEGIN]`）'
  - '**关键性质**'
  - '- 单一数据源：后端 Swagger/OpenAPI -> 生成 TypeScript 类型 -> 生成前端 Schema -> 驱动 ProTable/ProForm，字段增删改仅改一处'
  - '- 运行时可解释执行：Schema 可下发、可存储、可动态组合，支持“低代码搭建”模式（可视化拖拽生成 Schema -> 实时预览 -> 一键发布）'
  - '- 渐进式增强：基础 90% 场景 Schema 覆盖，复杂 10% 通过 `render` 自定义渲染函数、Slots 插槽、组合式 API `useProForm`
    逃逸口接管'
  - '**典型例子**'
  - '- 用户管理页面：定义 `userSchema` 包含 15 字段，`ProTable` 自动渲染带搜索/分页/多选删除/导出的表格，`ProForm`
    在抽屉中自动渲染新增/编辑表单（含校验/联动/异步选项），零手写模板代码'
  - '- 复杂表单：分步向导、动态增减行表单、字段权限显隐、异步级联选择器，均通过 Schema `validator`、`visible`、`dependencies`、`asyncOptions`
    声明式配置'
  - '**边界条件**'
  - '- Schema 复杂度随业务增长可能膨胀为“另一种代码”，需定期重构提取公共 Schema 片段（`schema-fragments`）、建立 Schema
    Lint 规范'
  - '- 高度定制化交互（如拖拽排序、可视化编辑器、实时协同编辑）超出 Schema 表达能力，应果断转为手写组件，避免“配置地狱”'
  - '- 代码生成模式下，生成代码纳入 Git 管理，需解决“再次生成覆盖手写逻辑”冲突，推荐“保留区块标记 + AST 合并”策略'
  - '**素材溯源**'
  - '- 20230418_117.md 至 20230418_126.md：覆盖典型 CRUD 标准化、ProTable/ProForm/ProChart 封装、Schema
    驱动页面生成、微前端子应用接入'
