- 'no': 2
  name: Monorepo 仓库治理 —— 让多包协作像单仓一样顺滑
  points:
  - '**为什么需要这个概念？**'
  - '- 中后台业务往往拆分为：UI 组件库、请求层、业务组件、工具函数、多个子应用，多仓库管理依赖升级、代码复用、版本发布极其痛苦'
  - '- 传统多仓模式下，跨仓重构需开多个 PR、CI 耗时长、原子提交困难，严重拖累交付效率'
  - '- 包管理器（pnpm/yarn workspace）已原生支持 Monorepo，工具链成熟度满足生产落地'
  - '**核心定义**'
  - '- Monorepo：在单一代码仓库中管理多个相关联的 Package（Package 可独立版本、独立发布、独立构建）'
  - '- pnpm-workspace.yaml：声明工作区包路径（如 `packages/*`、`apps/*`），配合 `pnpm install` 实现依赖提升、幽灵依赖规避、硬链接节省磁盘'
  - '**关键性质**'
  - '- 原子提交：跨包重构（如修改组件库 API 同步更新所有子应用）仅需 1 个 PR、1 次 CI'
  - '- 依赖去重：共享依赖提升至根节点 `node_modules/.pnpm`，磁盘占用降低 50%+，安装速度提升 2-3 倍'
  - '- 版本联动：配合 Changesets 实现“改动包自动生成 changelog、版本号自动递增、发布时自动更新依赖包版本”'
  - '**典型例子**'
  - '- 目录结构：`apps/admin`（主后台）、`apps/mobile`（移动端）、`packages/ui`（组件库）、`packages/request`（请求层）、`packages/shared-config`（ESLint/TS/Prettier
    共享配置）'
  - '- 内部依赖引用：`"@enterprise/ui": "workspace:*"`，开发时直接链接源码，发布时自动替换为真实版本号'
  - '**边界条件**'
  - '- 仓库体积随历史增长，需配置 `git shallow clone`、Git LFS 存放大型二进制资产、定期清理无用分支'
  - '- 权限管控粒度变粗：全员可读全量代码，敏感业务（如风控、支付核心）仍需拆分独立私有仓库'
  - '- CI 缓存策略复杂：需精准计算受影响包（`pnpm --filter=... --filter=dependents`）实现增量构建测试，避免全量跑测'
  - '**素材溯源**'
  - '- 20230418_117.md 至 20230418_126.md：统一覆盖 Monorepo 初始化、工作区配置、脚手架生成、共享配置包治理'
