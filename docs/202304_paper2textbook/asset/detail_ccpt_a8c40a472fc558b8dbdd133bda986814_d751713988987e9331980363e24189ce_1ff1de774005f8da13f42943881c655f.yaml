- 'no': 6
  name: 架构演进与知识沉淀 —— 让系统在变化中进化
  points:
  - '**为什么需要这个概念？**'
  - '- 业务快速迭代必然产生技术债务（硬编码配置、组件重复造轮子、类型 `any` 泛滥、测试缺失），不主动治理会拖垮交付速度'
  - '- 团队隐性知识（踩坑经验、最佳实践、架构决策背景）流失风险高，需显性化沉淀为组织资产'
  - '- 技术栈演进（Vue 3 -> 4、Vite 5 -> 6、新 CSS 特性、WASM 落地）需要有计划的预研与平滑升级路径'
  - '**核心定义**'
  - '- 技术债务清单：定期（每季度）扫描：`TODO/FIXME` 标注、SonarQube 代码异味、依赖版本滞后（`pnpm outdated`）、类型覆盖率下降、测试覆盖率缺口、性能指标回退，产出《技术债务清单》含优先级/影响面/预估工时/责任人'
  - '- 重构提案 ADR：对重大重构（如迁移到 RSC、引入信号响应式、组件库升级）撰写 ADR，经架构评审会通过后纳入路线图'
  - '- 组件复用率报告：统计 `@enterprise/ui` 组件在各应用中的引用频次、覆盖业务场景、定制化分支数，识别“高价值通用组件”与“低价值僵尸组件”'
  - '- 团队技术分享体系：周会（15min 踩坑/新特性）、月度深度分享（1h 源码解析/架构复盘）、季度架构评审（ADR 评审/路线图对齐）、年度白皮书（《前端架构演进白皮书》）'
  - '**关键性质**'
  - '- 数据驱动决策：复用率 < 20% 的组件考核下线、高频定制化组件提炼为配置项、高频 Bug 类型归因推动工具链/规范完善'
  - '- 显性化知识资产：所有 ADR、分享 PPT、复盘文档、白皮书沉淀至团队知识库（Notion/Confluence/GitBook），新员工入职必读'
  - '- 预算保障：每季度规划预留 15%-20% 带宽专项偿还技术债务、升级依赖、完善基建，纳入 OKR 考核'
  - '**典型例子**'
  - '- 依赖升级专项：Node 16 EOL -> 制定升级 Node 20 计划（CI 镜像更新、原生依赖重编译、Polyfill 移除、异步上下文迁移），分
    3 期灰度，回滚预案就绪'
  - '- 组件库精简：发现 `ProAdvancedTable` 仅 2 个项目用、维护成本高，ADR 决定下线，功能下沉至 `ProTable` 配置项，迁移脚本自动化'
  - '- 新技术预研：调研 React Server Components 对中后台 BFF 层的影响，产出《RSC 在中后台落地可行性报告》，含 PoC Demo、迁移成本估算、收益预测'
  - '**边界条件**'
  - '- 避免“为重构而重构”：每个重构必须关联业务价值（提效/降本/体验/安全），纯技术洁癖驱动的重构需严格评审'
  - '- 知识沉淀非一劳永逸：需设置文档过期机制（如 1 年未更新自动标记 `deprecated`）、定期归档整理、指定文档 Owner'
  - '- 团队分享质量 > 数量：拒绝流水账 PPT，强制包含：背景/问题/方案对比/代码实现/踩坑/效果数据/迁移指南'
  - '**素材溯源**'
  - '- 20230418_117.md 至 20230418_126.md：覆盖技术债务识别、重构提案 ADR、组件复用率统计、团队技术分享体系化、前端架构演进白皮书'
