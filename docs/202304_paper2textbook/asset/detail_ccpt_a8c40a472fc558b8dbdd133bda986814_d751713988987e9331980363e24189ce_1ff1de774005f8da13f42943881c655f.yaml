units:
- 'no': 1
  name: 技术选型决策矩阵 —— 为架构选型装上“导航仪”
  points:
  - '**为什么需要这个概念？**'
  - '- 面对 Vue/React、Vite/Webpack、Pinia/Redux 等海量技术组合，靠直觉选型极易导致技术债务与团队分歧'
  - '- 缺乏量化依据时，技术决策容易演变为“话语权之争”而非“工程权衡”'
  - '- 项目初期决策影响全周期，事后重构成本指数级上升，必须在起跑线建立科学决策机制'
  - '**核心定义**'
  - '- 技术选型决策矩阵：将候选方案按维度（生态成熟度、团队熟悉度、性能指标、长期维护成本、招聘市场供给等）打分加权，输出可视化对比表单'
  - '- ADR (Architecture Decision Records) ：记录决策背景、备选方案、最终决策、后果及替代方案的结构化文档，纳入版本控制'
  - '**关键性质**'
  - '- 可追溯：半年后新成员可通过 ADR 理解“为什么当年选 Vue 而非 React”'
  - '- 可量化：将主观偏好转化为加权评分，便于跨团队对齐预期'
  - '- 动态演进：预设触发重评条件（如重大版本发布、团队技能结构变化、业务形态转型）'
  - '**典型例子**'
  - '- 状态管理选型：对比 Pinia（轻量、TS 友好、Composition API 原生）vs Redux（生态成熟、调试强大、学习曲线陡峭），若团队全栈偏
    Vue、追求开发效率，Pinia 得分更高'
  - '- 构建工具选型：Vite（冷启动快、ESM 原生、插件生态爆发）vs Webpack（成熟稳定、Loader 生态全、大型老项目迁移成本低），新项目首选
    Vite'
  - '**边界条件**'
  - '- 矩阵权重设定具有主观性，需全团队技术骨干共同商定，避免架构师“一言堂”'
  - '- 评分依赖当前认知，不可预测黑天鹅事件（如核心维护者停止维护），需设定定期复盘机制（如每半年）'
  - '- 非功能性需求（如极致首屏性能、国密算法合规）可能否决高分方案，需设置“一票否决”指标'
  - '**素材溯源**'
  - '- 20230418_117.md 至 20230418_126.md：覆盖技术选型、Monorepo 初始化、脚手架生成、标准化模版等全链路决策依据'
