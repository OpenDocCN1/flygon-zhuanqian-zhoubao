paper: docs/202304/20230418_014.md
desc: 该素材为一篇社群经验分享帖的摘要，作者虚十七（老猪）针对“生财有术”社群项目信息过载、无从下手的痛点，提出建立筛选漏斗的核心思路，旨在帮助圈友高效筛选出适合自身的项目，并承诺后续分享落地进展。
concepts:
- name: 项目筛选漏斗
  desc: 作者针对社群内项目过多导致决策瘫痪而提出的核心解决框架，用于结构化地从海量机会中筛选出适合个人的项目。
  is_original: true
  excerpt:
  - 我们需要建立漏斗，帮我们筛出合适的项目
  - 将我的筛选思路分享出来，希望能帮助部分圈友，在生财有术高效找到适合自己的项目
- name: 生财有术
  desc: 文中提及的付费商业社群，被作者定义为包含大量项目线索的‘宝藏社群’，是素材讨论的背景环境。
  is_original: false
  excerpt:
  - 生财有术是个宝藏社群，这能发现很多项目
- name: 信息过载与决策瘫痪
  desc: 描述社群成员面临项目线索过多、无从下手的核心痛点，是引出筛选漏斗方法论的动因。
  is_original: false
  excerpt:
  - 项目太多，让人无从下手
methods:
- name: __overview__
  desc: 作者基于个人实战经验总结的‘建立漏斗筛选项目’整体方法论，包含痛点识别、框架搭建、手把手分享思路、后续落地复盘的完整闭环。
  excerpt:
  - 本篇手把手，将我的筛选思路分享出来
  - 正在分析和落地项目了，过段时间向圈友们分享下进展
theorems:
- name: 社群价值在于筛选而非获取
  desc: 核心主张：高质量社群的核心价值不在于提供海量项目信息（获取），而在于帮助成员建立筛选机制（漏斗）以匹配适合自身的项目，解决‘知易行难’的执行转化问题。
  excerpt:
  - 生财有术是个宝藏社群，这能发现很多项目
  - 但你会逐步发现，项目太多，让人无从下手
  - 我们需要建立漏斗，帮我们筛出合适的项目
findings:
- name: 框架分享获得社群高度正向反馈
  desc: '[evidence] 评论区多位圈友（Kevin、希声、UlyssesChe*等）给予高赞与认可，验证了‘筛选漏斗’框架对解决‘项目太多无从下手’痛点的实用性与及时性。'
  excerpt:
  - 'Kevin : 这是及时雨'
  - '希声。 : 太酷了'
  - 'UlyssesChe* : 哇塞，太赞了，执行力杠杠的'
- name: 作者已进入项目分析落地执行阶段
  desc: '[claim] 作者宣称已基于该筛选思路进入具体项目的分析与落地阶段，并承诺后续复盘分享进展，显示方法论具备可执行性。'
  excerpt:
  - 正在分析和落地项目了，过段时间向圈友们分享下进展
