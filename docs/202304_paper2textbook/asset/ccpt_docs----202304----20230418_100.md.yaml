paper: docs/202304/20230418_100.md
desc: 该素材记录了生财有术社群新人刘卡卡（程序员背景）入圈半个月内，通过复盘生财航海2月项目库、结合自身技术优势与资源劣势，建立'自身分析-项目筛选-路径规划'的三级决策模型，最终确定'小红书店铺验证闭环→英文工具站长期布局'的双轨执行策略，展示了新人从信息过载到聚焦落地的认知升级与实战路径设计全过程。
concepts:
- name: 新人项目筛选三级漏斗模型
  desc: 指新人从海量项目信息中通过'初筛（硬性约束排除）→再筛（核心赛道对比）→最终选择（主次任务组合）'三层过滤，锁定适配自身禀赋的执行标的的系统化决策框架。
  is_original: true
  excerpt:
  - 3. 初筛：删掉自己不能做或者不想做的项目
  - 4. 再筛：在小红书店铺和视频号中做选择
  - 5. 最终选择：先做小红书店铺，小红书店铺跑通闭环后，就将主要精力放在英文工具站上
- name: 双轨执行策略
  desc: 指以'短期现金流项目（小红书店铺）验证商业闭环+长期资产型项目（英文工具站）复利技术壁垒'为核心的资源分配策略，解决新人'既要生存又要成长'的资源冲突。
  is_original: true
  excerpt:
  - 5. 最终选择：先做小红书店铺，小红书店铺跑通闭环后，就将主要精力放在英文工具站上
- name: 航海项目库复盘法
  desc: 指利用社群提供的结构化航海项目文档（如生财航海230218），通过'赛道拆解-难度分级-资源匹配'三维度对标个人禀赋，而非盲目跟风热门项目的分析范式。
  is_original: false
  excerpt:
  - 2. 各项目分析：对 2 月的航海，从个人的角度进行介绍（参考：生财航海 230218）
methods:
- name: __overview__
  desc: 整体方法论为'自我画像建立→外部项目库结构化复盘→约束条件筛选→赛道横向对比→主次任务序列化规划'的五步走决策流程，强调程序员技术背景与新人资源匮乏的动态平衡。
  excerpt:
  - 1. 自身分析：对个人情况进行介绍
  - 2. 各项目分析：对 2 月的航海，从个人的角度进行介绍
  - 3. 初筛：删掉自己不能做或者不想做的项目
  - 4. 再筛：在小红书店铺和视频号中做选择
  - 5. 最终选择：先做小红书店铺，小红书店铺跑通闭环后，就将主要精力放在英文工具站上
  - 6. 方案路径：具体如何从 0 到 1 开始做小红书店铺
- name: 自身分析框架
  desc: 程序员新人视角的SWOT简化版：Strengths（技术开发能力/英文工具站优势）、Weaknesses（零电商运营经验/零流量资源）、Opportunities（生财航海项目库/社群陪跑）、Threats（时间成本/认知偏差）。
  excerpt:
  - 1. 自身分析：对个人情况进行介绍
  - 作者：刘卡卡，今年 3.18 刚进入生财的新人
  - 下次航海要到 5 月份才有了，是得在这之前，自己先实干以一个项目了
- name: 项目初筛硬性约束法
  desc: 设定'不可做/不愿做'二元否决权：技术不可行（如需重资产/供应链）、认知不匹配（如纯销售型/违规灰产）、时间窗口冲突（航海前无法闭环），快速压缩备选集。
  excerpt:
  - 3. 初筛：删掉自己不能做或者不想做的项目
- name: 赛道再筛对比矩阵
  desc: 在小红书店铺（低门槛/快变现/重运营）与视频号（中门槛/中周期/重内容）两强赛道间，按'启动成本-变现周期-技术复用度-抗风险性'四维度打分决策。
  excerpt:
  - 4. 再筛：在小红书店铺和视频号中做选择
theorems:
- name: 新人先跑通闭环再谋长远
  desc: 零资源新人必须优先选择能在有限时间内（如航海前）跑通'获客-转化-交付'完整商业闭环的项目建立正反馈，再以此为资源锚点切入长周期高壁垒赛道，避免'贪大求全导致全盘皆空'。
  excerpt:
  - 5. 最终选择：先做小红书店铺，小红书店铺跑通闭环后，就将主要精力放在英文工具站上
  - 下次航海要到 5 月份才有了，是得在这之前，自己先实干以一个项目了
- name: 程序员转型副业的非对称优势在于工具站
  desc: 程序员在内容电商/运营赛道无经验护城河，但具备'零边际成本构建SaaS/工具站'的非对称优势，应将英文工具站作为核心长期押注，而非短视频/店铺运营。
  excerpt:
  - 5. 最终选择：先做小红书店铺，小红书店铺跑通闭环后，就将主要精力放在英文工具站上
findings:
- name: 认知冲击驱动行动紧迫感
  desc: '[claim] 作者称''世界观受到了很大的冲击，原来赚钱的方式这么多''，认知解锁直接催生''必须在航海前实干一个项目''的执行紧迫感。'
  excerpt:
  - 看了很多的帖子和内容，世界观受到了很大的冲击，原来赚钱的方式这么多，原来真的有人愿意分享自己赚钱的方式。
  - 下次航海要到 5 月份才有了，是得在这之前，自己先实干以一个项目了
- name: 社群航海文档作为结构化决策输入源
  desc: '[evidence] 作者显性引用''生财航海 230218''飞书文档作为项目分析的唯一数据源，印证社群结构化知识资产对新人决策质量的关键支撑作用。'
  excerpt:
  - 2. 各项目分析：对 2 月的航海，从个人的角度进行介绍（参考：生财航海 230218）
- name: 执行路径文档化输出倒逼思考深度
  desc: '[claim] 作者将筛选过程公开撰文（获251赞）并同步飞书wiki详细版，公开承诺机制倒逼其完成从模糊意向到''方案路径''的显性化思考。'
  excerpt:
  - 以下是我对项目的筛选过程以及最终的执行路径……希望对新人有一定参考
  - 更多移步：https://k8g3o29k9j.feishu.cn/wiki/wikcnzYHwHhIZ3OrAFGes3t407d
