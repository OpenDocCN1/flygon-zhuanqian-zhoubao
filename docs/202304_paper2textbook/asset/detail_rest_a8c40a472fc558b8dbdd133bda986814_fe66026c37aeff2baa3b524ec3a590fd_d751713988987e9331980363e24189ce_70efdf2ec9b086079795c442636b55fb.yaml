learning_targets:
- 理解架构决策记录（ADR）的核心结构、不可变性原则与工程化落地工具链
- 掌握技术雷达的四象限分类法、Blip 迁移规则与季度评审运营机制
- 掌握架构演进路线图的战略主题拆解、滚动波浪式规划与依赖可视化方法
- 理解 RFC 评审机制的分级门槛、决策矩阵量化评分与事后复盘闭环流程
- 能够制定架构治理委员会章程，并产出包含核心指标的季度运营报告
- 能够串联 ADR、技术雷达、路线图、RFC 与治理委员会，构建端到端的前端架构治理体系
concept_map:
- 前端架构治理体系
- ├── 架构决策记录（ADR）
- │   ├── 标准化结构：标题/背景/决策/后果/替代方案/状态  —— P001
- │   ├── 核心元数据：编号/状态/关联Issue/日期/决策者  —— P001
- │   ├── 关键性质：不可变性/关联性/就近性  —— P001
- │   ├── 工具链：adr-cli 模板强制/Markdown渲染门户/Git版本控制  —— P001
- │   └── 边界：仅记录重大/不可逆/跨团队决策，不替代RFC  —— P001
- ├── 技术雷达
- │   ├── 四象限：采纳/试用/评估/暂缓  —— P002
- │   ├── 四环带：语言框架/平台/工具/方法  —— P002
- │   ├── Blip要素：名称/象限/环带/移动轨迹/关联ADR  —— P002
- │   ├── 运营机制：季度会议/同意制/可视化门户(tech-radar)/新人必读  —— P002
- │   └── 边界：非白名单/项数<60/聚焦架构级/雷达守护者角色  —— P002
- ├── 架构演进路线图
- │   ├── 核心要素：Theme/Milestone/Dependency/Capacity Allocation  —— P003
- │   ├── 规划特性：滚动波浪式/依赖显性化/债务显性化(固定预算)  —— P003
- │   ├── 与OKR打通：主题映射OKR/避免两张皮  —— P003
- │   └── 边界：非甘特图/季度复盘允许调整优先级(关联ADR)  —— P003
- ├── 架构评审机制（RFC）
- │   ├── 流程：提交标准化文档→异步审阅+同步答辩→决策矩阵评分→形成ADR  —— P004
- │   ├── 评审委员会：架构师/技术负责人/安全/运维代表/轮换制  —— P004
- │   ├── 分级门槛：L1组件库/L2基础设施/L3架构级重构  —— P004
- │   ├── 决策矩阵：技术可行性/业务价值/实施成本/风险/团队能力五维量化  —— P004
- │   ├── 事后复盘：上线3/6月强制填写(预期vs实际/偏差原因/经验教训)  —— P004
- │   └── 边界：不评审业务细节/热修复事后补单48小时  —— P004
- └── 架构治理委员会与运营报告
- '    ├── 章程核心：成员构成/职责边界/会议节奏/决策权限  —— P005'
- '    ├── 运营报告指标：ADR数量质量/雷达变更/路线图完成度/债务偿还量/NPS  —— P005'
- '    ├── 核心性质：赋能而非管控/数据驱动自动化采集/透公开全员可见  —— P005'
- '    └── 边界：不管业务进度/主席由CTO担任/报告含未达标指标整改计划  —— P005'
life_analogy:
- 想象前端架构治理是一场**大型城市的“城市规划与建设”系统工程**：
- '- **ADR（架构决策记录）** = **“土地批文与建筑档案”**：每一块地（技术决策）为何批给谁、盖什么楼、替代方案是什么、后果如何，都有法可查、有据可溯，一旦盖好（通过）不可随意拆改，变更需新批文（新ADR）并标注旧档案作废。'
- '- **技术雷达** = **“城市总体规划图（动态版）”**：将所有建筑材料、工艺、设备（技术项）标注在“推广使用/试点推广/谨慎评估/禁止使用”四个区域，每季度召开规划局会议（雷达会议）根据实测数据调整分区，新入职建筑师（新人）拿到图纸就知哪里能盖、哪里不能盖。'
- '- **架构演进路线图** = **“三年滚动建设计划”**：不是死板的施工进度表（甘特图），而是分“近期精确到楼栋、中期定区域功能、远期定城市轮廓”三层，明确标注“地铁先通后盖楼”（跨团队依赖）和“每年拨款修缮老旧小区”（技术债务预算），并与考核指标（OKR）挂钩。'
- '- **RFC（架构评审机制）** = **“重大项目立项评审会”**：想拆迁盖高楼（架构级重构）？必须提交立项书（RFC文档），经规划、消防、环保、财政多部门联审（评审委员会），用评分卡（决策矩阵）打分，盖完楼还得住满三年回访（事后复盘），看看是不是烂尾楼。'
- '- **架构治理委员会** = **“城市规划委员会办公室”**：不是开会的“谈话室”，而是有编制、有权力、有预算、有KPI的实体机构。定期发布《城市建设白皮书》（季度运营报告）：批了多少地、调整了多少规划、完成了多少地铁、修缮了多少老房子、市民满意度多少，数据全公开，没完成的必须写整改方案。'
- 就像城市建设需要“档案留痕、规划导向、计划推进、评审把关、专职运营”五位一体，前端架构治理也需要 ADR、雷达、路线图、RFC、委员会五大支柱协同，才能避免“拆东墙补西墙”的混乱演进。
summary:
- concept: 架构决策记录（ADR）
  desc: 标准化结构记录重大技术决策，具有不可变性、关联性、就近性，配合 adr-cli 工具链落地
- concept: 技术雷达
  desc: 四象限四环带可视化技术栈战略，季度评审迁移 Blip，采用同意制共识，建立可视化门户
- concept: 架构演进路线图
  desc: 12-18月滚动规划，含战略主题、里程碑、依赖图谱、产能切分，波浪式规划并与 OKR 打通
- concept: 架构评审机制（RFC）
  desc: 标准化提案流程+分级门槛+决策矩阵量化评分+强制事后复盘，形成决策闭环并沉淀 ADR
- concept: 架构治理委员会
  desc: 拥有章程/权限/节奏的正式组织，输出季度运营报告（ADR/雷达/路线图/债务/NPS），坚持赋能、数据驱动、公开透明
exercises:
- 'no': 1
  title: 练习1：撰写一份 ADR 文档
  contents:
  - 场景：团队计划将现有 Vue 2 + Vuex 项目迁移至 Vue 3 + Pinia。
  - 任务：使用标准 ADR 模板（标题、背景、决策、后果、替代方案、状态）撰写 ADR-0001。
  - 要求：
  - 1. 在“背景”中量化维护成本痛点（如 Vue 2 停止维护时间、TypeScript 支持弱痛点）。
  - 2. 在“替代方案”中对比“迁移至 React”、“继续维护 Vue 2”、“渐进式迁移 Vue 3”三条路径的优劣。
  - 3. 在“后果”中列出对现有组件库、构建工具、CI/CD 的连锁影响及迁移成本估算。
  - 4. 标记状态为“提议”，并关联模拟的 GitHub Issue 编号。
  - 思考题：
  - '- 如果 6 个月后团队决定引入 Nuxt 3 作为全栈框架，应如何更新 ADR 体系？（提示：新建 ADR 还是修改旧 ADR？）'
  - '- 为何要求 ADR 存放在代码仓库 `/docs/adr` 而非 Wiki/飞书文档中？'
- 'no': 2
  title: 练习2：模拟季度技术雷达会议
  contents:
  - 场景：你是“雷达守护者”，主持 Q3 季度技术雷达评审会。当前雷达上有 5 个待讨论 Blip：
  - 1. Rspank (构建工具，现处‘评估’)
  - 2. Tailwind CSS (样式方案，现处‘试用’)
  - 3. Module Federation (微前端方案，现处‘试用’)
  - 4. Vue 2 (框架，现处‘采纳’)
  - 5. Monorepo 管理工具：pnpm workspace vs Turborepo (工具，均处‘评估’)
  - 任务：
  - 1. 为每个 Blip 制定迁移提案（如：Rspank 评估→试用，理由：Vite 生态插件兼容性验证通过）。
  - 2. 识别出至少 1 个需移入‘暂缓’的技术项并给出理由。
  - 3. 起草《雷达变更日志》模版，包含：Blip 名称、旧象限、新象限、迁移理由、关联 ADR 编号、决策人。
  - 思考题：
  - '- 为何采用‘同意制’而非‘多数决’？若核心维护者否决了‘采纳 Tailwind’，但 80% 团队成员想用，怎么办？'
  - '- 如何防止雷达变成‘技术简历驱动’的展示柜？'
- 'no': 3
  title: 练习3：绘制架构演进路线图依赖图谱
  contents:
  - 场景：制定未来 12 个月架构演进路线图，包含三大战略主题：
  - 主题 A：全链路类型安全 (OpenAPI->TS 生成、请求库重构、组件库类型补全)
  - 主题 B：微前端基座建设 (基座搭建、子应用接入规范、共享依赖治理、CI/CD 集成)
  - 主题 C：研发效能平台 (脚手架升级、组件物料平台、自动化测试覆盖率门禁)
  - 任务：
  - 1. 将上述主题拆解为 Q1-Q4 季度里程碑，标注每个里程碑的可验证交付物（Definition of Done）。
  - 2. 识别跨主题依赖（例：主题 B 基座搭建需主题 A 的类型安全请求库作为共享依赖基础），绘制依赖有向图。
  - 3. 设定产能切分比例（业务/技术债/探索），并为主题 B 分配 2 人·季资源，计算关键路径。
  - 思考题：
  - '- 若 Q2 业务突击项目占用 50% 产能，应如何调整路线图？削减里程碑还是延期？决策依据是什么？'
  - '- 为何要求‘技术债务专项偿还预算’必须在路线图中显性化，而非挤占业务缝隙？'
- 'no': 4
  title: 练习4：RFC 评审实战演练
  contents:
  - 场景：评审 RFC-2024-08《引入 Module Federation 替代 qiankun 实现微前端架构重构》。
  - 任务：
  - 1. 列出 RFC 文档必须包含的 6 个核心章节（动机、设计、替代方案、迁移计划、测试策略、回滚预案），并为每个章节写出 1 个关键审查点。
  - 2. 组建评审委员会名单（5 人），标注角色（主席、架构师、安全代表、运维代表、业务方技术负责人）。
  - 3. 使用决策矩阵对该 RFC 打分（五维各 1-5 分），计算加权总分（权重：技术可行性 30%、业务价值 25%、实施成本 15%、风险 20%、团队能力
    10%），判定是否通过（及格线 3.5）。
  - 4. 编写一份“附条件通过”的决议，包含 3 个前置条件（如：补充性能基准报告、完成 2 个子应用试点、制定回滚演练脚本）。
  - 思考题：
  - '- 为何要求‘事后复盘’在上线 3 个月和 6 个月各做一次？前后复盘侧重点有何不同？'
  - '- 紧急热修复为何允许‘事后补 RFC’？如何防止团队滥用此通道规避评审？'
- 'no': 5
  title: 练习5：起草架构治理委员会首季度运营报告
  contents:
  - 场景：委员会成立首季度结束，需输出运营报告汇报 CTO。
  - 任务：
  - 1. 设计报告目录结构：概览、ADR 治理效能、雷达演进、路线图执行、技术债务偿还、团队满意度（NPS）、下季度重点。
  - 2. 填充模拟数据（需自圆其说）：如 ADR 总数 12，通过率 67%；雷达迁移 5 个，其中 1 个降级；路线图主题 A 完成度 90%，主题 B 因依赖阻塞仅
    40%；偿还债务 15 项，遗留高危债务 3 项；NPS 7.2。
  - 3. 撰写‘未达标指标复盘’板块：针对主题 B 完成度低、NPS 未达 8.0 目标，分析根因（如：基座团队人力不足、文档滞后），制定下季度整改计划（含 Owner、Deadline）。
  - 4. 列出报告数据来源系统（GitLab API、CI/CD 看板、监控平台、问卷工具），说明如何实现‘数据自动化采集、拒绝手工填报’。
  - 思考题：
  - '- 委员会主席为何建议由 CTO 或一级技术负责人担任？若由资深架构师担任会有何风险？'
  - '- 运营报告‘全员可见’可能带来什么副作用？如何平衡透明度与心理安全感？'
