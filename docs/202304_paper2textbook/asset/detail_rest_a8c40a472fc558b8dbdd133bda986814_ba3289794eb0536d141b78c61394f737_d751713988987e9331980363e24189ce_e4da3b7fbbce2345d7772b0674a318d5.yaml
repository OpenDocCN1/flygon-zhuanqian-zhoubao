learning_targets:
- 理解混合专家模型（MoE）通过稀疏激活实现参数量与计算量解耦的核心原理
- 掌握原生多模态模型统一 Tokenizer 与交错序列训练的架构设计要点
- 熟悉 LLM Agent 从 ReAct 到 Plan-and-Execute、Reflexion 等认知架构的演进脉络与工程落地范式
- 掌握 Test-Time Scaling 利用推理时计算（搜索、PRM、自我修正）提升性能的新 Scaling Law 机制
- 能够串联数据清洗、持续预训练、SFT、DPO、量化部署、RAG、Agent 编排至自动化评测的领域大模型全链路工程闭环
concept_map:
- 前沿扩展：MoE、多模态、Agent 与 Test-Time Scaling
- ├── 混合专家模型 (MoE) —— 稀疏激活的规模化路径
- │   ├── 核心机制：路由器 + 专家网络 + Top-K 稀疏激活       —— P001
- │   ├── 代表架构：Switch Transformer (Top-1) / DeepSeekMoE (细粒度+共享专家) —— P001
- │   ├── 关键工程：负载均衡损失、专家并行 All-to-All 通信、推理显存常驻问题 —— P001
- │   └── 边界条件：通信开销大、训练不稳定、推理内存压力 —— P001
- ├── 原生多模态 —— 统一表征的‘通用语言’
- │   ├── 核心范式：统一 Tokenizer + 统一 Backbone + 交错序列建模       —— P002
- │   ├── 代表架构：Chameleon (早期融合、离散图像 Token)                —— P002
- │   ├── 关键工程：模态特殊 Token、图文交错数据比例调度、损失加权       —— P002
- │   └── 边界条件：离散化信息损失、训练难度大、序列长度爆炸 —— P002
- ├── LLM Agent —— 赋予模型‘手脚’与‘大脑’的协作
- │   ├── 核心组件：LLM(Controller) + Planning + Memory(分层) + Tools + Environment —— P003
- │   ├── 认知范式演进：ReAct -> Plan-and-Execute -> Reflexion              —— P003
- │   ├── 工具标准化：Function Calling / MCP 协议 / Toolformer 微调       —— P003
- │   ├── 记忆架构：工作/情景/语义/程序性四层记忆 + 巩固与遗忘机制         —— P005
- │   ├── 多 Agent 协作：MetaGPT/ChatDev (角色扮演) / AutoGen (群聊辩论)    —— P004
- │   └── 边界条件：上下文溢出、幻觉累积、高成本延迟 —— P003/P005
- ├── Test-Time Scaling —— 推理时计算的新 Scaling Law
- │   ├── 核心公式：Policy Model 生成轨迹 + PRM 逐步打分 + Search (MCTS/Beam Search) 选择最优路径 ——
  P004
- │   ├── 代表范式：OpenAI o1 系列 (长 CoT + RL 训练慢思考)                  —— P004
- │   ├── 关键性质：推理算力与性能正相关、过程监督优于结果监督、自我修正回溯 —— P004
- │   └── 边界条件：推理延迟极高、PRM 训练难/泛化弱、非通用受益任务       —— P004
- └── 领域专属大模型应用全链路构建 —— 从数据到价值的闭环
- '    ├── 端到端流水线：数据清洗 -> 持续预训练 -> SFT -> DPO -> 量化部署 -> RAG增强 -> Agent编排 -> 自动化评测闭环
  —— P005'
- '    ├── 核心原则：数据飞轮驱动、模块化解耦 (RAG+微调互补)、评测贯穿始终 —— P005'
- '    ├── 典型落地：法律助手 (法条+案例+文书生成)、代码 Agent (仓库级生成+工具链) —— P005'
- '    └── 边界条件：持续预训练成本高、领域数据稀缺/版权受限、四位一体版本管理复杂 —— P005'
life_analogy:
- 想象**大模型前沿技术演进**是一场**‘企业组织进化’**：
- '- **MoE (混合专家)** = **‘事业部制改革’**：公司不再让全员参与所有决策（密集模型），而是设立专业事业部（专家），总部派遣路由器（路由机制）将任务精准分发给最擅长的
  1-2 个事业部（Top-K），既扩大了编制（总参数量），又控制了会议成本（激活计算量)。'
- '- **原生多模态** = **‘全能型员工培养计划’**：不再招‘只会写字的文员’和‘只会画图的设计师’再强行对齐（CLIP），而是从校招阶段就培养‘文图通吃’的通才（统一
  Tokenizer/Backbone），让他们用同一套大脑处理文字、图表、语音混合的汇报材料（交错序列)。'
- '- **LLM Agent** = **‘给大脑装上手脚和笔记本’**：大脑 只会‘想’（生成文本），Agent 为它配上了‘手脚’（工具调用/Function
  Calling）、‘笔记本’（分层记忆/向量库）、‘项目经理’（Planning/Plan-and-Execute）和‘复盘机制’（Reflexion/自我修正)，让它能自主完成‘调研-写代码-跑测试-修Bug’的完整项目闭环。'
- '- **Test-Time Scaling** = **‘考场上给天才多发草稿纸和时间’**：传统考试（预训练/SFT）只看平时积累，新范式允许考生在考场上（推理时）通过‘草稿纸搜索’（MCTS/Beam
  Search）、‘逐步打分’（PRM）、‘发现错了回头改’（自我修正），把考试时间换高分，实现‘考得越久、考得越好’。'
- '- **全链路工程闭环** = **‘从招聘到绩效的全周期人才供应链’**：招原材料（数据清洗）-> 内训通识（持续预训练）-> 技能培训（SFT）-> 价值观对齐（DPO）->
  精简上岗（量化部署）-> 配备知识库（RAG）-> 授权工具箱 -> 季度考核（自动化评测）-> 晋升淘汰（数据飞轮迭代)，打通‘人-岗-绩’全链路。'
summary:
- concept: 混合专家模型 (MoE)
  desc: 稀疏激活机制：总参数量大但激活参数量小，通过路由器动态分发 Token 到 Top-K 专家，实现算力高效扩展
- concept: Switch Transformer
  desc: Top-1 路由简化通信，首次将模型规模推向万亿参数级别
- concept: DeepSeekMoE
  desc: 细粒度专家拆分 + 共享专家隔离，平衡专业化分工与通用知识获取
- concept: 负载均衡损失
  desc: 防止路由器塌陷到固定专家，保障所有专家充分训练
- concept: 原生多模态
  desc: 统一 Tokenizer 将文本/图像映射共享词表，单一 Transformer 建模交错序列，实现深度跨模态融合
- concept: Chameleon
  desc: 早期融合原生多模态代表，图像离散化为 1024 Token 与文本混合训练
- concept: LLM Agent
  desc: LLM 作为 Controller，集成 Planning、Memory(分层)、Tools、Environment 实现自主任务执行闭环
- concept: ReAct
  desc: 推理-行动-观察交织循环，适合知识密集型问答
- concept: Plan-and-Execute
  desc: 显式规划与执行分离，适合长程复杂任务
- concept: Reflexion
  desc: 语言强化学习：试错+自然语言反思修正，缓解幻觉累积
- concept: Function Calling / MCP
  desc: 工具调用标准化协议，实现工具即插即用与治理
- concept: 分层记忆架构
  desc: 工作记忆(上下文)/情景记忆(向量)/语义记忆(知识图谱)/程序性记忆(技能)四层协同
- concept: Test-Time Scaling
  desc: 推理阶段投入计算换性能：Policy 生成轨迹 + PRM 过程打分 + Search 搜索最优路径
- concept: 过程奖励模型 (PRM)
  desc: 对推理每一步打分，比仅看最终答案的 ORM 更精准引导搜索
- concept: OpenAI o1
  desc: 大规模 RL 训练长链式思维，推理时自动生成长推理链实现‘慢思考’
- concept: 领域大模型全链路
  desc: 数据清洗 -> 持续预训练 -> SFT -> DPO -> 量化部署 -> RAG增强 -> Agent编排 -> 自动化评测闭环的标准化工程流水线
- concept: 数据飞轮
  desc: 高质量轨迹采样 -> 标注偏好数据 -> 模型迭代 -> 灰度发布 -> 线上收集，实现‘用得越多、懂得越多’
exercises:
- 'no': 1
  title: MoE 路由与负载均衡手算推演
  contents:
  - 假设某 MoE 层有 8 个专家，Top-K=2，某 Batch 输入 4 个 Token，路由器输出的 Logits (未归一化分数) 如下：
  - 'Token 1: [2.0, 0.5, -0.1, 1.0, 0.0, -0.5, 0.2, 0.8]'
  - 'Token 2: [0.1, 1.5, 2.0, -0.2, 0.3, 0.0, -0.1, 0.5]'
  - 'Token 3: [1.0, 0.8, 0.5, 1.2, -0.1, 0.0, 0.3, 0.9]'
  - 'Token 4: [-0.2, 0.0, 1.0, 0.5, 2.0, 1.5, 0.1, -0.1]'
  - 1. 对每个 Token 取 Top-2 专家索引，统计每个专家被选中的次数（负载）。
  - 2. 计算理想负载（总 Token 数 * K / 专家数）与实际负载的差异。
  - 3. 回答问题：如果专家 5 长期负载为 0，训练会发生什么？负载均衡损失通常如何设计来缓解此问题？
- 'no': 2
  title: 原生多模态 Token 序列构造与注意力掩码设计
  contents:
  - 某原生多模态模型词表包含：文本 Token (0-31999)、图像起始 Token <IMG>(32000)、图像结束 Token </IMG>(32001)、图像离散
    Token (32002-33025)。
  - 输入样本：用户发送一张图并提问“这图里有什么？”，图像编码器输出 256 个离散 Token。
  - 1. 写出完整的输入 Token ID 序列（含特殊 Token）。
  - 2. 该模型使用因果注意力，画出 5x5 简化注意力掩码矩阵（假设序列仅含 <IMG>, Img_Tok_1, Img_Tok_2, </IMG>, Text_Tok_1），说明图像
    Token 间是否可见、文本 Token 能否看到图像 Token。
  - 3. 回答问题：为什么原生多模态通常不在图像 Token 间使用双向注意力（如 BERT）？这与‘统一建模’目标有何关联？
- 'no': 3
  title: Agent 任务规划与工具调用失败复盘
  contents:
  - 场景：用户指令‘帮我分析最新季度财报 PDF 的核心风险点，并生成一页 PPT 总结’。
  - Agent 配置：Tools = {PDF_Parser, Web_Search, Python_REPL, PPT_Generator}。
  - 观察到的执行轨迹：
  - 1. Planner 分解任务：[下载PDF -> 解析文本 -> 搜索行业对比数据 -> 量化风险指标 -> 生成PPT]
  - 2. Agent 调用 Web_Search 搜索‘最新季度财报’，返回 404（链接失效）。
  - 3. Agent 尝试调用 PDF_Parser，但未提供本地文件路径，报错 FileNotFound。
  - 4. Agent 陷入循环：反复尝试 Web_Search 不同关键词，Token 耗尽终止。
  - 回答问题：
  - '- 指出该轨迹中 Planner、Memory、Tool Calling、Error Handling 各环节的具体缺陷。'
  - '- 设计一个基于 Reflexion 机制的改进方案：如何利用‘语言反思’修正后续规划？需新增哪些 Memory 组件？'
  - '- 若引入 Plan-and-Execute 架构，Planner 和 Executor 如何分工以规避上述‘规划与执行脱节’问题？'
- 'no': 4
  title: Test-Time Scaling 搜索策略对比实验设计
  contents:
  - 任务：在 MATH 数据集难题子集上对比三种推理时扩展策略的 Pass@1 与平均推理 Token 数。
  - 基础模型：同一 7B 基座模型（已 SFT）。
  - 策略 A：Best-of-N (N=16)，仅生成 16 条独立 CoT，用结果奖励模型 (ORM) 选最优。
  - 策略 B：Beam Search (Width=4, Depth=5)，使用过程奖励模型 (PRM) 对每步打分保留 Top-4。
  - 策略 C：MCTS (模拟次数=20)，使用 PRM 作为价值函数指导 UCB 选择，支持回溯。
  - 回答问题：
  - '- 设计实验记录表格，包含指标：Pass@1、Avg Tokens、峰值显存、是否支持回溯修正。'
  - '- 预测三种策略在‘难题’上的性能排序及计算开销排序，解释原因（提示：搜索空间覆盖 vs 过程监督精度 vs 回溯能力）。'
  - '- 分析：为何 PRM 训练比 ORM 难？若 PRM 在第 3 步给出错误高分，会如何误导 Beam Search 和 MCTS？MCTS 的回溯机制能否部分修正？'
- 'no': 5
  title: 领域大模型全链路成本-收益权衡决策
  contents:
  - 背景：某金融科技公司拟构建‘智能研报生成助手’，预算：训练算力 1000 万 Token·Hours (H100 小时)，推理日均 10万 次，人力 5 人半年。
  - 可选技术路线：
  - 路线 1：持续预训练 50B Token 金融语料 (LLaMA-3-8B) -> LoRA SFT 5万 指令 -> 部署 4-bit 量化模型 + RAG(万条研报库)。
  - 路线 2：不持续预训练，直接基于 GPT-4o API + 精心设计的 Agentic RAG (规划检索+工具计算+多轮验证) + Few-shot Prompting。
  - 路线 3：持续预训练 10B Token -> 全参数 SFT 2万 -> DPO 1万 偏好对齐 -> 部署 8-bit 量化 + 轻量 RAG + Agent
    编排。
  - 回答问题：
  - '- 从‘知识内化深度’、‘幻觉控制’、‘推理延迟/成本’、‘迭代维护难度’四维建立对比矩阵打分 (1-5 分)。'
  - '- 结合预算约束，推荐一条路线并给出核心理由（提示：考虑‘持续预训练边际收益’与‘API 调用长期成本’的权衡）。'
  - '- 设计该项目的‘数据飞轮’最小闭环：线上收集什么数据？如何低成本构建偏好数据？如何触发模型/提示词/检索策略的自动化迭代？'
