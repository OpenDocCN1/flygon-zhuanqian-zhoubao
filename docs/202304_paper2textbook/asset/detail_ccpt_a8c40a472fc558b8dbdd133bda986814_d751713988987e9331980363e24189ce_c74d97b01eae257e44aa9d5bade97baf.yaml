units:
- 'no': 1
  name: AI 编程助手现状 —— 从补全工具到结对程序员
  points:
  - '**为什么需要这个概念？**'
  - '- 前端研发面临框架更新快、样式调试繁、类型系统复杂等高认知负荷场景'
  - '- 传统 IDE 补全仅基于静态分析，无法理解业务意图与上下文语义'
  - '- 需要一种能生成样板代码、解释报错、编写测试、甚至重构架构的智能副驾'
  - '**核心定义**'
  - '- AI 编程助手：基于大语言模型（LLM），集成于 IDE/编辑器中，通过上下文感知提供代码生成、补全、重构、问答、测试生成等全生命周期辅助能力的工具'
  - '- 核心差异维度：模型能力（推理/代码理解）、上下文窗口大小、上下文构建策略（检索/裁剪）、交互范式（Inline Chat/Chat Panel/CMD+K）、工具链集成度（终端/浏览器/数据库）'
  - '**关键性质**'
  - '- 模型层面：CodeLlama/StarCoder 等开源模型与 GPT-4o/Claude 3.5 Sonnet 等闭源模型在前端任务（TS 类型推导、CSS
    布局、Vue/React 组件生成）上存在显著能力差距'
  - '- 上下文工程：主流工具采用「最近文件+语义检索+符号索引+用户选中」混合策略构建上下文，长上下文窗口（128k-1M）使得全库索引成为可能，但「大海捞针」检索精度成为新瓶颈'
  - '- 交互范式演进：从被动补全 → 主动对话 → Agent 模式（自主规划-执行-验证闭环）'
  - '**典型例子**'
  - '- GitHub Copilot：最早普及，Inline 补全延迟低，但上下文感知弱，Chat 面板非原生'
  - '- Cursor：Fork VS Code，深度集成 Composer（多文件生成）、Cmd+K（内联编辑）、@Codebase 语义检索，体验最接近「AI
    原生 IDE」'
  - '- Codeium/Windsurf：免费额度大，支持本地模型部署，企业级隐私合规强'
  - '**边界条件**'
  - '- 幻觉风险：生成不存在的 API、编造 TypeScript 类型、引用已废弃的库版本'
  - '- 上下文污染：无关文件检索噪声导致模型跑偏，需依赖 .gitignore/.cursorignore 等机制隔离'
  - '- 隐私合规：代码上传云端训练/推理风险，金融/政企需部署本地模型或使用零保留模式'
  - '- 成本控制：闭源模型按 Token 计费，大规模团队需评估 ROI，开源模型需算力投入'
  sources:
  - paper: HgjLdWdxHo8ezoxv9iLc4HSwnAh.md
    role: origin
  excerpts:
  - 评测主流工具在前端框架/类型系统/样式/测试生成能力差异、总结 Few-shot/Chain-of-Thought/RAG 提示词模版、长上下文裁剪策略。
  - GitHub Copilot/Cursor/Codeium 对比、提示词工程模式、上下文窗口管理
- 'no': 2
  name: RAG 在前端知识库落地 —— 让 AI 读懂你的私有代码库
  points:
  - '**为什么需要这个概念？**'
  - '- 通用大模型不知晓私有业务组件库、内部设计系统、架构规范、历史决策记录（ADR）'
  - '- 直接喂给模型全量代码超出窗口且 Token 成本高，且噪声干扰推理质量'
  - '- 需要精准检索相关代码片段、文档、配置作为上下文注入，实现「领域专家级」回答'
  - '**核心定义**'
  - '- 代码库 RAG：面向代码仓库的检索增强生成系统，核心流程为「代码解析切片 → 向量化嵌入 → 向量库存储 → 混合检索 → 重排序 → 上下文注入 →
    生成回答」'
  - '- 关键差异点：代码具有严格语法结构（AST）、强依赖关系（Import/Call Graph）、高频更新（增量索引）、多语言混合（TS/JS/CSS/HTML/GraphQL）'
  - '**关键性质**'
  - '- 切片策略：基于 Tree-sitter AST 切片（函数/类/组件/Interface 级），保留语义完整性，元数据附带文件路径、行号、符号名、依赖关系'
  - '- Embedding 选型：代码专用模型（voyage-code-2, jina-embeddings-v2-code, nomic-embed-text）显著优于通用文本模型'
  - '- 混合检索：稠密向量（语义相似）+ 稀疏 BM25（关键词/符号精准匹配），解决「useUserStore」等符号检索难题'
  - '- 重排序：Cross-Encoder 或 LLM-based Reranker 对 Top-K 精排，过滤语义相关但业务无关的噪声片段'
  - '- 溯源引用：生成回答时必须引用源码行号（文件路径+起止行），支持 IDE 一键跳转验证，控制幻觉'
  - '**典型例子**'
  - '- 场景：新人问「我们项目的权限指令 v-permission 怎么用？」 → 检索到指令定义文件、使用示例组件、类型定义 → 生成包含参数说明、用法代码、源码链接的回答'
  - '- 场景：重构「请求层统一错误处理」 → 检索到 request.ts、errorCode.ts、全局异常处理逻辑 → 生成重构方案及影响范围分析'
  - '**边界条件**'
  - '- 增量索引延迟：代码推送后向量库更新滞后导致检索旧版本，需 Git Hooks/CI 触发增量更新'
  - '- 单体仓库规模：Monorepo 万级文件需分模块建库或分片索引，避免单库性能下降'
  - '- 二进制/生成文件污染：dist/node_modules/.d.ts 需严格排除，否则稀释检索质量'
  - '- 幻觉残留：检索召回不全时模型仍会编造，需在 Prompt 中强制要求「仅基于上下文回答，不知则称不知」'
  sources:
  - paper: HgjLdWdxHo8ezoxv9iLc4HSwnAh.md
    role: origin
  excerpts:
  - 实战：Tree-sitter 解析 AST 切片、Embedding 模型选型、Milvus/Chroma 向量库、Hybrid Search（稀疏+稠密）、引用源码行号溯源。
  - RAG 在前端知识库落地：代码库切片、向量化检索、重排序、上下文注入与幻觉控制
- 'no': 3
  name: Agent 工作流自动化 —— 从需求到 PR 的无人驾驶流水线
  points:
  - '**为什么需要这个概念？**'
  - '- 单轮代码生成无法完成「需求分析→拆解任务→编码→测试→修 Bug→提交 PR」的完整工程闭环'
  - '- 复杂任务需要规划能力、工具调用能力（读写文件、运行测试、Git 操作）、状态管理与错误恢复'
  - '- 需要将「人工驱动 AI」升级为「AI 自主驱动，人工把关关键节点」'
  - '**核心定义**'
  - '- 代码 Agent：以 LLM 为大脑，具备规划、工具调用、记忆、反思能力的自主系统，输入为自然语言需求/Issue，输出为代码变更集'
  - '- 编排框架：LangGraph（状态图/循环控制）、AutoGen（多 Agent 群聊）、OpenHands/SWE-agent（软件工程专用基准）'
  - '**关键性质**'
  - '- 角色分工：Planner（拆解 Issue 为任务树/DAG）、Coder（单文件/多文件编辑）、Tester（运行测试/生成测试）、Reviewer（静态分析/规范检查/安全扫描）'
  - '- 状态机流转：Plan → Code → Test → Review → Fix(循环) → Commit → PR，每步产出结构化产物（文件列表、测试报告、Review
    意见）'
  - '- 人工介入点：计划确认、高风险变更审批、测试失败超阈值暂停、PR 提交前最终确认'
  - '- 工具集成：文件系统、终端、LSP（跳转定义/引用）、测试运行器、Linter、Git CLI、GitHub API'
  - '**典型例子**'
  - '- 需求：「为用户列表页增加导出 Excel 功能」 → Planner 拆解：1. 添加 xlsx 依赖 2. 封装导出工具函数 3. 在 ProTable
    组件加按钮 4. 接入权限控制 5. 编写单测 → Coder 并行修改 4 个文件 → Tester 运行 vitest 通过 → Reviewer ESLint/TypeCheck
    通过 → 自动创建 PR'
  - '- 反思机制：Tester 发现类型报错 → 反馈给 Coder 附带错误堆栈 → Coder 修复 → 循环至通过或达重试上限'
  - '**边界条件**'
  - '- 规划幻觉：Planner 可能遗漏隐性依赖（如全局样式、路由守卫、环境变量），需 RAG 检索架构文档辅助规划'
  - '- 上下文爆炸：多轮交互 Token 激增，需压缩历史（摘要/关键决策/文件快照）而非全量保留'
  - '- 权限与安全：Agent 拥有写文件、执行命令、推代码权限，必须沙箱隔离、命令白名单、Git 受保护分支强制 Review'
  - '- 成本不可控：复杂任务往返 50+ 轮，Token 成本高，需设置预算上限与人工托底机制'
  sources:
  - paper: HgjLdWdxHo8ezoxv9iLc4HSwnAh.md
    role: origin
  excerpts:
  - 基于 LangGraph/AutoGen 编排多 Agent：Planner、Coder、Tester、Reviewer，定义工具调用、状态机流转、人工审批检查点。
  - Agent 工作流自动化：需求拆解→代码生成→测试验证→提交 PR 的闭环与人工介入点设计
- 'no': 4
  name: 前端专用模型微调 —— 打造懂业务、懂规范的专属 Copilot
  points:
  - '**为什么需要这个概念？**'
  - '- 通用模型不了解内部组件库 API、项目特有的 TypeScript 模式、CSS 架构约定、错误码体系'
  - '- RAG 只能解决「知识检索」，无法解决「模式内化」（如团队独特的组合式 API 写法、状态管理范式）'
  - '- 微调能将最佳实践固化进模型权重，实现零样本遵循团队规范、生成高通过率代码'
  - '**核心定义**'
  - '- 继续预训练：在基座模型（CodeLlama/DeepSeek-Coder/Qwen2.5-Coder）上继续训练高质量前端代码语料（组件库源码、工具函数、最佳实践文档、优质
    PR Diff），增强领域知识密度'
  - '- 指令微调：构建「指令-响应」对（如「按团队规范写一个用户表格组件」→ 标准代码），使用 LoRA 低秩适配低成本微调'
  - '- 对齐训练：DPO/ORPO 基于偏好数据（优秀代码 vs 违规代码）对齐，修正模型倾向（如倾向 any 类型、忽略无障碍属性）'
  - '**关键性质**'
  - '- 数据工程是核心：去重、去敏感信息、质量打分、难度分层、合成数据扩增（自我进化/知识蒸馏）'
  - '- LoRA 配置：r=64/128, alpha=16/32, target_modules=qkv/o/gate/up/down，仅训练 0.1%-1%
    参数，单张 24GB/48GB 显存可跑 7B/14B'
  - '- 评测体系：HumanEval-MBPP 前端子集、TypeScript 类型正确率、ESLint 规则通过率、组件库 API 调用准确率、单测生成覆盖率'
  - '**典型例子**'
  - '- 训练数据：收集团队近 2 年合并 PR 的 Diff、高星开源组件库源码、内部最佳实践 Wiki → 清洗去重 → GPT-4o 打分过滤 → 构建
    SFT/DPO 数据集'
  - '- 微调后效果：输入「创建一个标准的 ProTable 页面」 → 直接生成符合规范的 columns 定义、request 接口调用、权限指令、i18n
    key、单测文件，无需 RAG 检索即可高准确度完成'
  - '**边界条件**'
  - '- 灾难性遗忘：微调可能降低模型通用推理/编码能力，需混合通用代码数据、使用 Replay Buffer 或 LoRA 合并策略缓解'
  - '- 维护成本：代码库规范演进（如 Vue 2→3、Router 3→4、Pinia 替代 Vuex）需定期重新微调或增量训练'
  - '- 评测陷阱：离线基准高分不等于在线好用，必须建立「在线 A/B 测试 → 采纳率/修改率/通过率」的业务指标闭环'
  - '- 合规风险：训练数据含私有业务逻辑，模型部署需隔离，严禁输出至公共服务'
  sources:
  - paper: HgjLdWdxHo8ezoxv9iLc4HSwnAh.md
    role: origin
  excerpts:
  - 收集高质量前端代码语料（组件库/工具库/最佳实践）、LoRA 低秩适配微调、评测基准：HumanEval-MBPP 前端子集、TypeScript 类型正确率。
  - 前端专用模型微调：CodeLlama/DeepSeek-Coder 继续预训练、指令微调、RLHF 对齐前端最佳实践
- 'no': 5
  name: AI Code Review 机器人 —— 从人工把关到自动化质量红线
  points:
  - '**为什么需要这个概念？**'
  - '- 人工 Code Review 耗时长、覆盖面窄（仅看变更行）、受审阅者经验波动大、低级错误（命名、格式、未用变量）浪费专家时间'
  - '- 需要在 PR 提交即刻进行：规范检查、安全扫描、性能隐患识别、单测补全、最佳实践建议，人工只关注架构与业务逻辑'
  - '- 实现「机器拦截确定性错误，专家聚焦不确定性决策」'
  - '**核心定义**'
  - '- AI Code Review Bot：集成于 Git 平台 的自动化审查系统，触发器为 PR Open/Update，核心能力为「静态分析上下文增强
    + LLM 语义分析 + 结构化评审意见输出」'
  - '- 输出格式：行级内联评论 + 总结报告，包含：严重程度、问题描述、修复建议代码、关联规范链接'
  - '**关键性质**'
  - '- 触发机制：GitHub Action / GitLab CI / Webhook，监听 pull_request 事件'
  - '- 上下文构建：变更文件全量内容 + 关联文件 + 团队规范文档 + ESLint/TypeCheck/SonarQube 执行结果 + 历史同类问题案例'
  - '- 多模型协作：小模型做规范/安全扫描，大模型做架构/逻辑/性能深度分析，成本与效果平衡'
  - '- 结构化输出：强制 JSON Schema 输出，字段包含 file/line/severity/category/description/fix_suggestion/confidence，便于
    IDE 直接应用修复'
  - '- 单测生成：针对变更函数/组件，自动生成 Vitest/Jest 单测草案，覆盖边界条件、异常分支、Props 组合，开发者一键确认落盘'
  - '**典型例子**'
  - '- 场景：PR 修改用户登录接口 → Bot 检测到：1. 未做防重复提交处理（安全规范）2. 密码未加密传输（安全扫描）3. 缺少单测覆盖登录失败分支
    → 输出行级评论并给出修复代码 → 开发者点击 Apply 修复 → CI 通过 → 合并'
  - '- 场景：新增复杂表单组件 → Bot 生成 30+ 条单测用例（必填校验、禁用态、异步校验、重置、提交中 loading） → 开发者微调断言 → 覆盖率从
    0% 提升至 85%'
  - '**边界条件**'
  - '- 假阳性噪音：Bot 误报会消磨开发者信任，需建立「开发者标记 Not Helpful → 纳入负样本微调/调整 Prompt」的反馈闭环'
  - '- 上下文窗口限制：大文件重构变更行数超窗口，需分块审查或仅审查变更块周边上下文'
  - '- 权限最小化：Bot 仅需 Read/Write PR Comment 权限，无需代码库写入权限，通过 GitHub App 精细授权'
  - '- 延迟体验：大模型推理慢，需异步处理 + 进度反馈，或部署小模型做快速扫描，大模型做深度分析'
  sources:
  - paper: HgjLdWdxHo8ezoxv9iLc4HSwnAh.md
    role: origin
  excerpts:
  - GitHub Action 触发 PR Review、调用内部模型 API 输出结构化评审意见、集成 ESLint/TypeCheck 结果上下文、自动生成单测草案供开发者确认。
  - 实战：接入 AI Code Review 机器人——规范检查、安全扫描、性能建议、单测补全自动化
