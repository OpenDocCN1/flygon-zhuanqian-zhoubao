paper: docs/202304/20230418_131.md
desc: 该素材为 Fenng 对 2023 年微信公开课企业微信专场的简要回顾与反馈征集，核心在于呼吁用户在评论区反馈企业微信使用痛点（如文档缺乏套用表格格式、对外直播黑屏
  PPT 丢失等），并暗示微信团队会关注并后续解决。
concepts:
- name: 企业微信公开课反馈机制
  desc: 指微信团队通过公开课后征集用户反馈、并承诺针对存在问题给出后续解决方案的产品迭代机制。
  is_original: true
  excerpt:
  - 总结不重要，重要的是关于产品的反馈，因为微信团队的同学肯定会看。
  - 如果企业微信使用过程中有问题，可以在留言里反馈。存在问题的地方，一般会有个后续解决方案。
methods:
- name: __overview__
  desc: 通过公开课回顾文章引导用户在评论区留言反馈产品问题，利用微信团队关注舆情的特点推动问题解决。
  excerpt:
  - 总结不重要，重要的是关于产品的反馈，因为微信团队的同学肯定会看。
  - 如果企业微信使用过程中有问题，可以在留言里反馈。存在问题的地方，一般会有个后续解决方案。
theorems:
- name: 微信团队重视公开课后用户反馈
  desc: 微信团队成员会阅读公开课相关文章的评论区，用户在此反馈问题通常能获得后续解决方案。
  excerpt:
  - 总结不重要，重要的是关于产品的反馈，因为微信团队的同学肯定会看。
  - 存在问题的地方，一般会有个后续解决方案。
findings:
- name: 企业微信文档缺乏套用表格格式功能
  desc: '[claim] 用户周大壮儿反馈企微文档缺少套用表格格式功能，该功能在 Excel 及各家协作文档中均为常用标配。'
  excerpt:
  - '周大壮儿 : 企微文档缺个套用表格格式，做 excel 很常用，用了各家协作文档基本上都有这功能。'
- name: 企业微信对外直播存在黑屏及 PPT 丢失严重缺陷
  desc: '[claim] 用户秋长反馈使用企业微信对外直播培训时遭遇全程黑屏、PPT 全部接收不到的故障。'
  excerpt:
  - '秋长 : 上次用企业微信开了个对外的直播培训，结果全程黑屏，PPT 全部接收不到'
