unsupported_claims:
- location: 12.3.2
  claim: pnpm 在 Monorepo 场景下磁盘占用通常降低 60%-70%，安装速度提升 2-3 倍
  reason: 素材中未找到 pnpm 官方 benchmark 数据的具体出处，仅在脚注 [^pnpm-benchmark] 中声称来源于官方文档和社区数据
- location: 12.6.1
  claim: DORA 四大指标的精英表现基线（部署频次：按需部署/每天多次；变更前置时间：<1小时；变更失败率：0-15%；MTTR：<1小时）
  reason: 素材中仅引用 DORA 报告作为来源 [^dora-report]，未在素材中给出具体的基线数值出处
- location: 12.7.3
  claim: 组件复用率计算模型公式：Component Reuse Rate = P / (P + L) × 100%
  reason: 素材中虽给出了公式推导，但未说明该模型的行业验证来源或权威参考
- location: 12.7.3
  claim: 低代码产出占比模型公式：LowCode Output Ratio = N_lc / N_total × 100%
  reason: 素材中给出了公式定义，但未引用任何外部研究或行业标准作为支撑
