life_analogy:
- 想象前端性能优化是一场‘极速快递’物流体系建设：
- '- **Core Web Vitals** = **‘签收时效、包裹完好率、客服响应速度’三大核心 KPI**'
- '- **构建产物优化** = **‘精简包装、拆分大件、压缩体积’，减少运输成本**'
- '- **资源加载策略** = **‘预派单、就近仓储、智能路由’，让资源‘零等待’触达**'
- '- **运行时渲染优化** = **‘分拣线自动化、大件上专用车道、高峰期限流分流’，保障主干道（主线程）畅通**'
- '- **性能监控平台** = **‘全程 GPS 追踪、异常自动预警、复盘优化路线’，实现‘可看、可测、可优化’的闭环**'
- 想象 RPA 是一位‘数字实习生’：
- '- 它不懂业务逻辑，只会模仿人的鼠标键盘操作'
- '- 通过‘可视化积木’教会它点击、输入、识别文字'
- '- 它能 7x24 小时不眠不休地处理‘不可复制、无 API’的脏活累活'
- '- 核心价值不在替代代码，而在解决‘人工操作无法规模化’的工程难题'
- 想象小红书引流是一场‘行为设计游戏’：
- '- **私信动力** = 精心设计的‘诱饵’（痛点/收益/选题），让用户‘想联系你’'
- '- **私信能力** = 降低操作门槛的‘工具’（手写纸条/流程图/关键词），让用户‘能联系你’'
- '- **私信提示** = 无处不在的‘路标’（图片/评论/私信/群公告），在用户‘顺手就联系了’'
- '- 合规性是生存红线：手写、打码、关键词、小号协作，不触红线才能长久玩下去'
- 想象 AI 赋能跨境电商是‘配备了母语级英语专家的全能助理团队’：
- '- **角色设定** = 指派专家人设（亚马逊运营/Instagram达人/Facebook广告主）'
- '- **中英双语无损** = 中文下指令、英文出专业文案，彻底消解语言劣势'
- '- **全链路覆盖** = 从选品、Listing、邮件、SEO、品牌命名到数据分析，样样精通'
- '- **工具化封装** = 将高频 Prompt 打包成 SaaS 工具，让‘不会写指令’的人也能用上 AI 红利'
- 想象海外商标投资是‘时间套利的倒爷生意’：
- '- **买入时间** = 以低成本提前承担 6-36 个月的注册等待期与驳回风险'
- '- **卖出确定性** = 将‘已下证 R标’高溢价卖给‘时间不等人、急需备案’的跨境卖家'
- '- **核心护城河** = 好名字稀缺性 + 平台强制备案刚需 + 中国出口结构锚定需求'
- '- **动态调仓** = 避开红海 (美/欧/日) → 布局蓝海 (东南亚/中东/RCEP红利区) → AI 批量造名 → 分级定价分销变现'
- 想象普通人抖音变现是‘守护一颗微小火种，借风助燎原’：
- '- **天分火种** = 找到一个‘别人讨厌、你不厌其烦’的微小切入点（如不讨厌搜索/读绘本/沟通需求）'
- '- **放大器** = 抖音平台算法 + 公开分享机制，强制‘边学边教’'
- '- **飞轮效应** = 越学越会 → 越会越喜欢 → 越喜欢越擅长 → 越擅长越受欢迎 → 越受欢迎越赚钱 → 越赚钱越愿意去学'
- '- **差异化护城河** = 相对于‘讨厌死、给钱不干’的大多数人，你的‘不厌其烦’就是稀缺优势'
summary:
- concept: LCP (Largest Contentful Paint)
  desc: 最大内容绘制，衡量主内容加载速度，目标 < 2.5s
- concept: CLS (Cumulative Layout Shift)
  desc: 累积布局偏移，衡量视觉稳定性，目标 < 0.1
- concept: INP (Interaction to Next Paint)
  desc: 下一帧绘制交互延迟，衡量响应速度，取代 FID，目标 < 200ms
- concept: Tree Shaking
  desc: '基于 ES Module 静态分析，消除死代码，需配置 sideEffects: false'
- concept: 代码分割
  desc: 将打包产物拆分为多个 Chunk，按需/并行加载，减少首屏 JS 体积
- concept: Resource Hints (preload/prefetch)
  desc: 声明式告知浏览器资源优先级与未来需求，优化加载瀑布流
- concept: Service Worker 缓存策略
  desc: 离线化、版本控制、更新广播，实现二次访问毫秒级加载
- concept: 虚拟列表
  desc: 仅渲染可视区 DOM，支撑万级数据流畅滚动，核心是滚动位置到数据索引映射
- concept: Web Worker 卸载主线程
  desc: 将计算密集任务移出主线程，配合 SharedArrayBuffer/Transferable 实现零拷贝通信
- concept: Scheduler.yield / requestIdleCallback
  desc: 主动让出主线程控制权，拆解长任务，提升 INP 指标
- concept: 前端性能监控平台
  desc: SDK采集 -> Beacon上报 -> ClickHouse存储 -> Grafana可视化 -> 告警通知 的全链路工程体系
- concept: RPA (Robotic Process Automation)
  desc: ‘软件的软件’，模拟人工操作实现非侵入式自动化，核心适用‘高频、重复、有界、无 API’场景
- concept: 福格行为模型 B=MAP
  desc: 用户私信行为 = 私信动力 × 私信能力 × 私信提示，引流本质是行为设计而非技巧堆砌
- concept: 角色设定提示词
  desc: 指定 ChatGPT 扮演垂直专家（亚马逊运营/Instagram运营/Facebook广告专家），结合业务背景输出专业内容
- concept: 中英双语无损生产
  desc: 利用 ChatGPT 母语级英语能力，中文指令输入、专业英文输出，消解跨境电商语言劣势
- concept: 垂直 SaaS 工具化封装
  desc: 将高频标准化 Prompt 工作流封装为低代码/插件/独立应用，实现 AI 能力的产品化交付与商业变现
- concept: 商标投资套利
  desc: 提前承担注册时间成本与驳回风险，批量注册海外商标，向急需品牌备案的跨境卖家溢价转让
- concept: 时间套利定理
  desc: 商标注册的强制时间窗口是投资核心护城河：低成本买入时间，高溢价卖给‘时间不等人’的买家
- concept: 不讨厌/不厌其烦
  desc: 普通人发现天分火种的关键信号：相较于他人，在某事上耐受度更高、抗挫折、愿意投入时间且不觉得痛苦
- concept: 边学边教正向循环
  desc: 每天学一点并在抖音分享 → 越学越会 → 越会越喜欢 → 越喜欢越擅长 → 越擅长越受欢迎 → 越受欢迎越赚钱 → 越赚钱越愿意去学
- concept: 差异化定位法
  desc: 通过横向对比（与身边人/同行比）识别‘不讨厌’的相对优势，他人‘讨厌死/给钱不干’即为可切入赛道
exercises:
- 'no': 1
  title: Web Vitals 指标手算与诊断
  contents:
  - 给定以下 PerformanceNavigationTiming 与 PerformancePaintTiming 数据（单位 ms）：
  - '```'
  - 'navigationStart: 0'
  - 'domContentLoadedEventEnd: 1200'
  - 'loadEventEnd: 1800'
  - 'first-paint: 800'
  - 'first-contentful-paint: 950'
  - 'largest-contentful-paint: 2200 (元素: <img src=''hero.jpg''>)'
  - 'layout-shifts: [ {value: 0.05, hadRecentInput: false}, {value: 0.08, hadRecentInput:
    true}, {value: 0.12, hadRecentInput: false} ]'
  - 'first-input: { processingStart: 3100, startTime: 3000 }'
  - '```'
  - 问题：
  - 1. 计算 LCP、CLS、FID 数值，判断是否达标（LCP<2.5s, CLS<0.1, FID<100ms）。
  - '2. 为什么第二次布局偏移 (hadRecentInput: true) 不计入 CLS？'
  - 3. 如果 LCP 元素是一张图片，优化方向有哪三个维度？
- 'no': 2
  title: Vite/Rollup 产物分析与体积预算实战
  contents:
  - 在一个 Vue 3 + Vite 项目中执行：
  - 1. 安装 `rollup-plugin-visualizer` 并在 `vite.config.ts` 中配置生成 `stats.html`。
  - 2. 运行 `npm run build`，打开报告分析：
  - '   - 找出体积最大的 3 个 Chunk 及其所属依赖。'
  - '   - 检查是否有重复打包的依赖（如 lodash 同时出现在 vendor 和业务 chunk）。'
  - '   - 识别未被 Tree Shaking 摇掉的副作用模块（提示：观察 `sideEffects` 标记）。'
  - 3. 修改配置：
  - '   - 针对大体积依赖配置 `manualChunks` 单独拆包。'
  - '   - 在 `package.json` 添加 `"sideEffects": false`（确认无副作用后）。'
  - '   - 配置 `build.chunkSizeWarningLimit` 设置预算阈值。'
  - 4. 再次构建对比：Chunk 数量、最大 Chunk 体积、Gzip 后总体积变化。
  - '思考题：为什么有时开启 `sideEffects: false` 反而导致样式丢失或逻辑异常？如何规避？'
- 'no': 3
  title: 虚拟列表核心算法实现
  contents:
  - 不使用现成库，从零实现一个支持**动态行高**的虚拟列表组件 `VirtualList`：
  - 'Props:'
  - '- `items: Array<{id, height}>` // 每项高度已知或预估'
  - '- `containerHeight: number` // 可视区高度'
  - '- `overscan: number` // 缓冲区项数'
  - 要求：
  - 1. 维护 `startIndex`、`endIndex` 计算逻辑：基于 `scrollTop` 二分查找前缀和数组定位。
  - 2. 实现 `getTotalHeight()` 计算滚动条总高度（占位容器）。
  - '3. 渲染区域：绝对定位 `transform: translateY(offset)` 仅挂载可见项 + overscan。'
  - 4. 监听滚动事件，节流更新索引范围。
  - 5. **进阶**：当 `items` 更新（增删改）时，如何高效维护前缀和数组？（提示：分块/树状数组/Fenwick Tree）。
  - 验收：在 10 万条数据、随机高度 50-200px 下，滚动帧率保持 60fps，内存占用 < 50MB。
- 'no': 4
  title: Web Worker 卸载主线程：CSV 解析基准测试
  contents:
  - 场景：前端需解析 5MB、10 万行 CSV 并渲染表格。
  - 任务：
  - 1. **主线程版**：使用 `PapaParse` 同步解析，记录 `performance.now()` 耗时、主线程阻塞时长（Long Task 数量）、UI
    是否卡顿。
  - 2. **Worker 版**：将解析逻辑移入 Web Worker，通过 `postMessage(file.slice)` 分片传输或 `FileReader`
    读取后传递，解析完成回传结果。
  - 3. **零拷贝优化版**：利用 `File.slice()` + `FileReader.readAsArrayBuffer()` -> `postMessage(buffer,
    [buffer])` 实现 Transferable Objects 所有权转移。
  - 对比指标：
  - '- 总耗时、主线程阻塞时长、Long Task 计数、内存峰值、Worker 通信开销。'
  - 思考题：
  - '- 什么场景下 Worker 通信开销会抵消计算收益？'
  - '- 如何在 Worker 中使用 `CompressionStream` / `DecompressionStream` 做流式压缩？'
- 'no': 5
  title: 搭建最小化性能监控 SDK 与上报管道
  contents:
  - 目标：实现一个 < 2KB gzip 的 `perf-sdk`，采集 LCP/CLS/INP/FID/TTFB 并通过 `navigator.sendBeacon`
    上报。
  - 步骤：
  - 1. 使用 `PerformanceObserver` 监听 `largest-contentful-paint`、`layout-shift`、`first-input`、`event`
    (INP)、`navigation` 条目。
  - 2. 处理 CLS 累积逻辑：会话窗口 1s、间隔 5s 截止，忽略 hadRecentInput。
  - 3. INP 计算：维护交互延迟最大值（排除异常值），页面卸载时上报最终值。
  - 4. 上报端点：`/api/perf` 接收 JSON，存入 ClickHouse（本地可用 Docker 起实例）。
  - 5. Grafana 建表：
  - '   - 表 `web_vitals` (project, page, metric, value, p75, p95, timestamp)'
  - '   - 仪表盘：LCP/CLS/INP 趋势图、分位数热力图、Top 慢页面榜单。'
  - 6. 配置告警：连续 5 分钟 p75 LCP > 2.5s 触发钉钉/飞书机器人通知。
  - 扩展：如何关联 `trace-id` 实现前后端链路打通？如何采集 JS 错误堆栈并关联 Source Map 还原？
