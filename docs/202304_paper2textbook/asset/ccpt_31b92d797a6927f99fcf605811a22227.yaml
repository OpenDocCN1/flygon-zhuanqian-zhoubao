paper: docs/202304/20230418_118.md
desc: 该素材是一篇实操教程，详细记录了作者利用 ChatGPT 生成提示词、Midjourney (MJ) 生成模特与服装图片、Photoshop (PS)
  扣图抠底、再结合 MJ 图生图功能（参数 --iw 控制权重）合成电商模特主图的完整工作流。核心在于解决 AI 生成模特穿着指定服装一致性难的问题，通过“实拍/生成服装平铺图
  -> 扣图 -> 垫图融合”实现模特换装，并分享了 MJ 拒绝生成敏感词的规避技巧及参数设置经验。
concepts:
- name: AI 电商模特主图合成工作流
  desc: 一种结合大语言模型(LLM)生成提示词、文生图模型生成素材、图像编辑软件预处理、文生图模型图生图融合的端到端电商图制作流程。
  is_original: true
  excerpt:
  - 首先用 ChatGPT，让他帮我去写这个模特的描述...关键词有了，接下来的东西就简单了。
  - 之后，我们去找个商品主图...我就直接用 AI 生成短袖图片了。
  - 图片的话默认是白色底，我们去掉...打开 PS，选择魔棒工具，反向选择一下...扣好了，我们把这个图片丢过去，然后导出，再发给，Discord，也就是我们的
    mj。
  - 然后，我们将我们自己的图片上传后复制地址复制连接...输入 /image prompt [图片链接] [模特提示词] --v 5 --iw 2
- name: MJ 图生图权重参数 (--iw)
  desc: Midjourney 中控制参考图对生成结果影响程度的关键参数，数值越高越贴近参考图（服装纹理、版型），本文实测设为 2。
  is_original: false
  excerpt:
  - Prompt 参数是，你的图片连接 你最后模特生成出来的图片词，完整的，复制下来，然后记得加上 ... --iw 2
- name: 敏感词触发拒绝机制规避
  desc: 针对 Midjourney 因 '性感' 等敏感词拒绝生成的机制，通过移除或替换敏感关键词解决生成中断问题。
  is_original: false
  excerpt:
  - 目前测试发现，Ai 生成的模特要是涉及到了“性感”这个关键词，MJ 是会拒绝生成的。去掉这个关键词就可以进行生成了
- name: 服装平铺图/白底图预处理
  desc: 为保证图生图融合时服装轮廓清晰、无背景干扰，需生成纯色背景（白底）服装图并通过 PS 精细扣图得到透明底 PNG。
  is_original: true
  excerpt:
  - 我不是做设计的，又不想碰到版权问题，所以就直接用 AI 生成短袖图片了。给 AI 的关键词：A solid gray short sleeve with a
    dot of colored lettering print
  - 图片的话默认是白色底，我们去掉。打开 PS，选择魔棒工具，反向选择一下，快捷键 Ctrl+J...还有些边边角角，我们可以用快速选择工具选中去操作
methods:
- name: __overview__
  desc: ChatGPT 写提示词 -> MJ 生成模特基础图 (U/V 微调) -> MJ/ChatGPT 生成白底服装平铺图 -> PS 扣图抠底 ->
    MJ 图生图融合 (上传服装图链接 + 模特完整提示词 + --iw 2 参数) -> 得到穿着指定服装的模特主图。
  excerpt:
  - 首先用 ChatGPT，让他帮我去写这个模特的描述...关键词有了，接下来的东西就简单了。
  - 生成完成后，要是觉得不好，或者需要微调，或者图生图，我们点就行。U1，U2...V1，V2...
  - 之后，我们去找个商品主图...我就直接用 AI 生成短袖图片了。
  - 打开 PS，选择魔棒工具，反向选择一下，快捷键 Ctrl+J...扣好了，我们把这个图片丢过去...
  - 然后，我们将我们自己的图片上传后复制地址复制连接。然后，我们在下方输入 /image prompt The 185cm tall male model...
    - Upscaled by --v 5 --iw 2
- name: MJ U/V 按钮微调流程
  desc: 利用 Midjourney 原生 U (Upscale 放大/单独生成) 和 V (Variation 变体/图生图) 按钮对初始四宫格进行筛选与迭代，锁定满意的模特基础形象。
  excerpt:
  - U1，U2，对应的是，你这四张合集里面的顺序。V1，V2，对应的是你这四张图里面，你要拿那几张来做图生图。我觉得 V4 可以，我点击图生图，然后点第四张。
- name: PS 扣图标准化操作 (魔棒+反向选择+快速选择)
  desc: 针对 AI 生成白底服装图的标准化抠图流程：魔棒工具选中白底 -> 反向选中主体 -> Ctrl+J 图层复制 -> 快速选择工具修补边缘细节 ->
    导出透明底 PNG。
  excerpt:
  - 打开 PS，选择魔棒工具，反向选择一下，快捷键 Ctrl+J。
  - 还有一些边边角角，我们可以用快速选择工具选中去操作
theorems:
- name: 垫图融合法实现模特换装一致性
  desc: 核心主张：通过将扣好底的目标服装图作为 'Image Prompt (垫图)' 输入 MJ，配合完整的模特描述提示词和较高的 --iw 权重，可强制生成结果保持服装款式、纹理、印花高度一致，解决纯文本生成不可控问题。
  excerpt:
  - 然后，我们在下方输入 /image prompt [图片链接] [模特完整提示词] --v 5 --iw 2
  - 据目前测试，要是衣服不带字母的话，生成出来的效果应该会更好的，纯色的估计效果会更好
- name: 提示词工程分层策略
  desc: 主张将提示词编写外包给 ChatGPT（中文对话+翻译），人工只负责关键词筛选（如去除敏感词）和参数拼接，降低非英语使用者门槛。
  excerpt:
  - 首先用 ChatGPT，让他帮我去写这个模特的描述，这里可以用中文对话，我们后面用翻译软件翻译回来就行。
  - 我英语不好，就一直用翻译软件帮忙了，其实只要敢做面对这些都没啥难度的。
- name: 纯色/无文字服装素材生成效果优于复杂印花
  desc: 基于实测经验总结：作为垫图的服装素材，纯色、无字母印花、版型清晰的平铺图融合成功率高、效果自然；复杂印花易导致生成伪影或文字变形。
  excerpt:
  - 据目前测试，要是衣服不带字母的话，生成出来的效果应该会更好的，纯色的估计效果会更好
findings:
- name: MJ V5 模特生成真实感与可用性验证
  desc: '[evidence] 文中展示的多张中间过程图（模特四宫格、V4 变体迭代、最终模特图、服装生成图、最终合成图）证明该工作流在 MJ V5 版本下可落地，生成的模特具备自然光影、解剖结构正确、肤色纹理真实的商用级质量。'
  excerpt:
  - '![](img/9a8872f5e38dd32121a4ca170bc816c5.png)![](img/070d9210a400e54b713614efa8b0d501.png)![](img/e3049ce4c354d535763e067959dcfcb0.png)
    最终的图，我们拿下来，模特这样就有了。'
  - '![](img/6031335aaa8a6d225264f8cc3d1ecf21.png) ![](img/9c55655b668232b0bf545e643a146dac.png)'
  - '![](img/38cf3aba4c49ab2239d2bc43102d8088.png)'
- name: 服装带字母印花导致融合伪影
  desc: '[evidence] 作者实测生成的服装带有 ''colored lettering print'' (彩色字母印花)，最终合成图中服装文字可能变形或产生伪影，因此建议后续实践使用纯色或无文字服装素材。'
  excerpt:
  - 给 AI 的关键词：A solid gray short sleeve with a dot of colored lettering print
  - 据目前测试，要是衣服不带字母的话，生成出来的效果应该会更好的，纯色的估计效果会更好
- name: 非专业设计师也可快速上手制作商用级主图
  desc: '[claim] 作者宣称 ''我不是做设计的...我的 PS 就只有那么点基础...有兴趣的可以做更好，我主要是提供教程方法''，且评论区用户反馈
    ''有手就行系列''、''明天试试''，佐证该流程门槛低、可复制性强。'
  excerpt:
  - 我不是做设计的，又不想碰到版权问题...我的 PS 就只有那么点基础，有兴趣的可以做更好，我主要是提供教程方法。
  - '评论区：...吉祥 : 有手就行系列'
