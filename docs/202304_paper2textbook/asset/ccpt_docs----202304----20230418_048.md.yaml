paper: docs/202304/20230418_048.md
desc: 该素材为温虾米在生财航海实战中分享的《Web3空投研究》导读，作者凭借10年投资经验与13年入圈资历，提出将Web3空投历史划分为三个阶段，并选取8个代表性项目作为案例，旨在帮助新手从空投视角建立对Web3生态的系统性认知。
concepts:
- name: Web3空投三阶段划分法
  desc: 一种将Web3空投历史演进划分为三个阶段的分析框架，用于梳理空投逻辑演变与项目筛选标准。
  is_original: true
  excerpt:
  - 我将 Web3 空投分为三个阶段
- name: 空投视角的Web3认知模型
  desc: 通过空投项目的筛选与复盘，反推Web3项目的代币经济设计、社区冷启动逻辑及演进路径的认知方法。
  is_original: true
  excerpt:
  - 让刚进入这个世界的新手们，从空投的角度对 Web3 增加了一定的了解
methods:
- name: __overview__
  desc: 基于周期经验的归纳总结法：结合多周期实战经验，选取8个具有代表性的项目作为锚点，按历史阶段串联空投发展脉络，形成对新手友好的教学式复盘框架。
  excerpt:
  - 经历过几个周期...我将 Web3 空投分为三个阶段，选取了其中具有代表性的 8 个项目
theorems:
- name: 空投演进具备显著的阶段性特征
  desc: Web3空投并非随机营销手段，而是伴随行业基础设施成熟度（L1/L2/模块化等）、用户获取成本及代币经济模型演进而呈现出的清晰三阶段演进规律。
  excerpt:
  - 我将 Web3 空投分为三个阶段，选取了其中具有代表性的 8 个项目
- name: 代表性案例复盘是新手建立Web3认知的最优路径
  desc: 通过精选8个典型项目的空投复盘，可高效传递Web3核心概念（如Layer2、ZK、模块化区块链等）及交互逻辑，降低新手认知门槛。
  excerpt:
  - 让刚进入这个世界的新手们，从空投的角度对 Web3 增加了一定的了解
findings:
- name: 研究范围与样本确定
  desc: '[claim] 研究覆盖Web3空投历史全周期，共梳理出三大演进阶段；[claim] 筛选出8个具有代表性的标杆项目作为核心教学案例。'
  excerpt:
  - 我将 Web3 空投分为三个阶段，选取了其中具有代表性的 8 个项目
- name: 教学交付验证
  desc: '[evidence] 该分享已在生财航海实战中完成交付，获得39次点赞及社群正面反馈（如‘为温老板打 call’），验证了该框架对新手的教学有效性。'
  excerpt:
  - (39 赞)
  - '奥特曼曼曼， : 为温老板打 call！！'
