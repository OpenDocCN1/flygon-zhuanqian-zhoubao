learning_targets:
- 理解 Vue 3 响应式系统的核心原理：Proxy 代理、依赖收集与副作用触发机制
- 掌握组合式函数的设计规范、生命周期钩子注入时机与类型推导最佳实践
- 能够从命名空间、数据来源追踪、TypeScript 支持、测试隔离四个维度对比 Composables 与 Mixins/HOC/Provide-Inject
  的优劣
- 熟练运用 useAsyncState、useDebounceFn、customRef 等进阶模式封装异步状态机、防抖节流与自定义触发时机的响应式变量
- 具备构建团队级业务 Hooks 库的工程化能力：目录规范、单测策略、文档生成、版本发布与 CI/CD 流水线
concept_map:
- Vue 3 组合式 API 设计模式
- ├── 响应式核心原理
- │   ├── Proxy 拦截与惰性代理          —— P001
- │   ├── 依赖图谱：WeakMap<target, Map<key, Set<effect>>>  —— P001
- │   ├── track/get 依赖收集              —— P001
- │   ├── trigger/set 派发更新            —— P001
- │   ├── 调度器：微任务批次合并          —— P001
- │   ├── reactive/ref/shallowReactive    —— P001
- │   ├── computed 惰性求值与脏位标记     —— P001
- │   └── 边界：解构丢失响应性、数组下标、Map/Set 专用实现  —— P001
- ├── 组合式函数设计指北
- │   ├── useXxx 命名规范                 —— P002
- │   ├── 状态封装：返回 ref/reactive 保持响应性  —— P002
- │   ├── 生命周期钩子注入：同步调用绑定当前实例  —— P002
- │   ├── 类型推导友好：TS 自动推导返回签名  —— P002
- │   ├── 状态隔离：每次调用独立副本      —— P002
- │   ├── 可嵌套组合：函数内调用函数      —— P002
- │   └── 边界：禁止条件分支调用、props 只读、共享单例模式  —— P002
- ├── 逻辑复用对决
- │   ├── Composables vs Mixins：命名冲突/来源追踪/TS支持/测试隔离  —— P003
- │   ├── Composables vs HOC：Vue 对象组件非函数，HOC 非主流  —— P003
- │   ├── Composables vs Provide/Inject：显式导入 vs 运行时注入  —— P003
- │   ├── 重构案例：paginationMixin 拆分为 usePagination/useSortable/useExport  —— P003
- │   └── 留存场景：插件全局配置、微前端通信、Vue2 兼容过渡  —— P003
- ├── 进阶响应式模式
- │   ├── useAsyncState：loading/data/error 三态机、竞态处理  —— P004
- │   ├── useDebounceFn/useThrottleFn：定时器管理与组件卸载清理  —— P004
- │   ├── customRef：手控 track/trigger 实现防抖 ref/受控桥接  —— P004
- │   └── 边界：竞态条件、track/trigger 遗漏、卸载后回调、this 丢失  —— P004
- └── 业务级 Hooks 库工程化
- '    ├── 目录规范：单目录含 index/types/test/README  —— P005'
- '    ├── 单测策略：vitest + effectScope 模拟上下文  —— P005'
- '    ├── 文档生成：typedoc/vitepress 自动化  —— P005'
- '    ├── 发布流程：changesets + semantic-release  —— P005'
- '    ├── 类型优先/零依赖/Tree-shaking/向后兼容  —— P005'
- '    └── 治理：避免过度封装、UI库依赖拆包、版本锁定  —— P005'
life_analogy:
- 想象 Vue 3 响应式系统是一个**智能楼宇安防系统**：
- '- **Proxy (代理大楼)** = 整栋大楼被一层隐形智能膜包裹，任何人进出(读写属性)都被感知'
- '- **target (房间/货架)** = 原始数据对象，存放真实物品(值)'
- '- **key (房间号/货架标签)** = 属性名，定位具体位置'
- '- **effect (安保订阅者/住户)** = 副作用函数(渲染、计算属性、watch)，关心特定房间的动静'
- '- **track (登记入住/关注)** = 住户向前台登记："我关注 301 房间"，前台记录在册'
- '- **trigger (广播通知)** = 301 房间有变动(设置值)，前台查册通知所有登记过的住户'
- '- **调度器 (广播延迟合并)** = 短时间内 301 连续变动 10 次，前台只发一条合并通知，避免住户被刷屏'
- '- **ref (智能保管箱)** = 基本类型值(原始值)没有房间号，需放入保管箱(.value)才能被监控'
- '- **computed (智能缓存管家)** = 住户问"301+302 总价值"，管家记录依赖，仅当两房间变动才重算，否则直接读缓存'
- '- **组合式函数 (标准化装修套餐)** = 将"监控入侵+自动报警+手机推送"打包成 "useSecurity" 套餐，业主买房即用，互不干扰'
- '- **customRef (DIY 智能开关)** = 业主自定义规则："只有灯亮超过 3 秒才算真亮"，内部自己决定何时通知前台'
summary:
- concept: Proxy 响应式代理
  desc: 基于 ES6 Proxy 拦截 get/set，构建三层依赖图谱实现精准依赖收集与派发更新
- concept: track / trigger
  desc: track 在 get 时建立 effect 与 key 的订阅关系，trigger 在 set 时通知 effect 重新执行
- concept: 调度器 (Scheduler)
  desc: 将 trigger 的 effect 放入微任务队列批次执行，合并同步代码块内的多次修改，避免重复渲染
- concept: ref / reactive
  desc: ref 包装基本类型通过 .value 访问触发代理，reactive 深度代理对象，模板中自动解包 ref
- concept: computed 惰性求值
  desc: 内部 effect 标记脏位，依赖变化时不立即重算，而是下次读取时触发计算并缓存结果
- concept: 组合式函数 (Composables)
  desc: 以 use 开头的函数，封装响应式状态、逻辑、生命周期，显式导入导出，天然支持 TS 类型推导
- concept: 生命周期钩子注入
  desc: onMounted/onUnmounted 等仅在 setup 同步阶段调用有效，自动绑定当前组件实例上下文
- concept: Composables vs Mixins
  desc: Composables 显式导入零命名冲突、代码跳转直达定义、TS 完整推导、可独立单测，全面优于隐式合并的 Mixins
- concept: useAsyncState
  desc: 封装 Promise 执行的三态机(loading/data/error)，支持立即/手动/轮询执行与取消，需自行处理竞态条件
- concept: useDebounceFn / useThrottleFn
  desc: 包装函数返回防抖/节流版本，利用 onScopeDispose 绑定组件生命周期自动清理定时器，防内存泄漏
- concept: customRef
  desc: 工厂函数接收 track/trigger 手动控制依赖收集与触发时机，适用于防抖 ref、受控组件桥接、脏检查等场景
- concept: 业务级 Hooks 库工程化
  desc: 标准化目录结构、单测覆盖、自动化文档、changesets 版本管理、私有 npm 发布，沉淀团队可复用资产
exercises:
- 'no': 1
  title: 手写简易响应式核心
  contents:
  - 仅使用 ES6 Proxy、WeakMap、Set 实现简易版 reactive、ref、effect：
  - 1. 实现 reactive(target) 返回代理对象，get 时收集依赖，set 时触发更新
  - 2. 实现 ref(value) 返回 { get value(), set value(v) } 对象，内部复用 reactive 逻辑
  - 3. 实现 effect(fn) 接收副作用函数，立即执行一次并建立依赖关系
  - '4. 验证：const state = reactive({ count: 0 }); effect(() => console.log(state.count));
    state.count++ // 应打印 0 然后 1'
  - 思考题：
  - '- 为什么需要 WeakMap 作为第一层映射？如果用 Map 会有什么后果？'
  - '- 如何实现 "仅访问的属性才建立依赖" 的惰性特性？'
  - '- 如果在 effect 中读取 state.count 两次，依赖集合中会存几份 effect？为什么？'
- 'no': 2
  title: 设计 useLocalStorage 组合式函数
  contents:
  - 需求：封装一个 useLocalStorage(key, initialValue) Hook，满足：
  - 1. 读取 localStorage[key] 作为初始值，不存在则用 initialValue
  - 2. 返回 ref，修改 ref 值自动同步写入 localStorage
  - 3. 支持跨标签页同步：监听 storage 事件，外部修改自动更新本地 ref
  - 4. 组件卸载时自动移除 storage 事件监听
  - 5. 提供完整 TypeScript 类型签名，支持泛型约束
  - 实现要点：
  - '- 使用 customRef 控制 track/trigger 时机，或 reactive + watch + onMounted/onUnmounted'
  - '- 处理 JSON.parse/stringify 异常回退'
  - '- 考虑 SSR 环境无 localStorage 的兼容性'
  - 验证：在两个组件中同时使用同一 key，修改一个观察另一个是否联动
- 'no': 3
  title: 重构 Mixins 为 Composables 实战
  contents:
  - 给定一个典型的 Vue 2 分页 Mixin (paginationMixin.js) 源码：
  - '```js'
  - export const paginationMixin = {
  - '  data() { return { page: 1, pageSize: 20, total: 0, loading: false, list: []
    } },'
  - '  methods: {'
  - '    async fetchList() { this.loading = true; const res = await api.getList({
    page: this.page, pageSize: this.pageSize }); this.list = res.data; this.total
    = res.total; this.loading = false }'
  - '    changePage(p) { this.page = p; this.fetchList() }'
  - '    changeSize(s) { this.pageSize = s; this.page = 1; this.fetchList() }'
  - '    sortBy(field) { /* 排序逻辑 */ }'
  - '    exportData() { /* 导出逻辑 */ }'
  - '  },'
  - '  mounted() { this.fetchList() }'
  - '}'
  - '```'
  - 任务：
  - 1. 拆分为三个独立的 Composables：usePagination(分页核心)、useSortable(排序)、useExport(导出)
  - 2. usePagination 需暴露：page、pageSize、total、loading、list、fetchList、changePage、changeSize
    (全部响应式)
  - 3. 组件中演示如何组合使用：const { page, fetchList } = usePagination(); const { sortBy } =
    useSortable(list);
  - 4. 补全 TypeScript 类型定义，确保组件中解构出的变量拥有完整类型提示
  - 对比问题：
  - '- 原 Mixin 中 this.list 与排序/导出耦合，拆分后如何让 useSortable 操作 usePagination 的 list？'
  - '- 如果多个组件共享同一分页状态，Composables 如何实现？Mixin 如何实现？区别何在？'
- 'no': 4
  title: 实现防抖 Ref 与自定义 Ref 边界测试
  contents:
  - 1. 使用 customRef 实现 useDebouncedRef(initialValue, delayMs)：
  - '   - get 时 track()，set 时启动定时器，delayMs 后 trigger() 并更新值'
  - '   - 组件卸载时清理未触发的定时器'
  - 2. 编写单元测试 (vitest) 验证：
  - '   - 初始值正确'
  - '   - 连续修改 3 次，仅最后一次生效'
  - '   - 修改后立即读取值为旧值，delayMs 后读取为新值'
  - '   - 组件卸载(模拟 effectScope.stop)前修改，卸载后不应触发更新'
  - 3. 对比 customRef 实现 vs 普通 ref + watch + setTimeout 实现的优劣
  - 挑战：在 customRef 的 set 中如果抛出异常，trigger 是否还会执行？如何保证异常安全？
- 'no': 5
  title: 搭建 @my-org/vue-hooks 单元测试脚手架
  contents:
  - 目标：为 useMouse、useFetch、useDebouncedRef 建立统一测试环境：
  - 1. 创建 test/utils/mountHook.ts 封装：
  - '   - 使用 effectScope 创建作用域'
  - '   - 在作用域内运行 hook 函数，返回结果'
  - '   - 提供 cleanup 函数停止作用域'
  - '   - 模拟生命周期：onMounted/onUnmounted 回调自动收集'
  - 2. 编写测试用例覆盖：
  - '   - useMouse: 模拟 mousemove 事件，验证 x/y 响应式更新'
  - '   - useFetch: 使用 vi.mock 模拟 fetch，验证 loading/data/error 状态流转、竞态取消'
  - '   - useDebouncedRef: 验证防抖行为、卸载清理'
  - 3. 配置 vitest.config.ts：覆盖率阈值 80%、jsdom 环境、全局 setup 引入 @testing-library/jest-dom
  - 4. 运行测试并生成覆盖率报告，分析未覆盖分支
