learning_targets:
- 掌握技术选型决策矩阵与 ADR 记录方法，实现架构决策的量化、可追溯与动态演进
- 理解 Monorepo 仓库治理的核心优势（原子提交、依赖去重、版本联动）与工程化配置要点
- 掌握基础设施封装层（@enterprise/ui、@enterprise/request、RBAC、动态路由）的设计原则与零侵入业务实践
- 理解 Schema 驱动开发的单一数据源理念，能设计 ProTable/ProForm/ProChart 通用组件与代码生成器
- 掌握质量门禁流水线的分阶段拦截体系（Lint/TypeCheck/Unit/E2E/Build/Scan/Deploy）与量化阈值设定
- 建立架构演进与知识沉淀机制：技术债务清单、重构 ADR、组件复用率报告、分层技术分享体系
concept_map:
- 第25章 综合实战：企业级中后台前端架构落地全过程
- ├── 1. 技术选型决策矩阵 —— 为架构选型装上“导航仪”
- │   ├── 量化决策维度：生态成熟度/团队熟悉度/性能/维护成本/招聘供给 —— P001
- │   ├── ADR 结构化记录：背景/备选/决策/后果/替代方案 —— P001
- │   ├── 一票否决指标：非功能性需求（首屏性能/合规）强制约束 —— P001
- │   └── 定期复盘机制：半年重评触发条件（版本/团队/业务变化） —— P001
- ├── 2. Monorepo 仓库治理 —— 让多包协作像单仓一样顺滑
- │   ├── pnpm-workspace.yaml：工作区声明/依赖提升/幽灵依赖规避/硬链接 —— P002
- │   ├── 目录结构标准：apps/* (子应用) + packages/* (共享库/配置) —— P002
- │   ├── Changesets 版本联动：自动 changelog/版本号/依赖更新 —— P002
- │   └── CI 增量策略：pnpm --filter 受影响包分析/远程缓存/TurboRepo —— P002
- ├── 3. 基础设施封装层 —— 造好“轮子”让业务跑得飞快
- │   ├── @enterprise/ui：二次封装组件库/权限指令/主题变量/类型安全 —— P003
- │   ├── @enterprise/request：统一错误/Loading/Token刷新/拦截器链/MSW切换 —— P003
- │   ├── RBAC 三位一体：v-auth指令/Auth组件/路由meta角色 —— P003
- │   ├── 动态路由注册：后端树->RouteRecordRaw->addRoute->菜单联动->持久化 —— P003
- │   └── 可观测性内置：TraceID/渲染性能/错误边界上报 —— P003
- ├── 4. Schema 驱动开发 —— 让配置生成代码，告别重复 CRUD
- │   ├── Schema 定义：fields/layout/actions/api 四大元数据 —— P004
- │   ├── 通用组件三件套：ProTable/ProForm/ProChart 运行时解释执行 —— P004
- │   ├── 代码生成器：OpenAPI->TS类型->Schema->模版引擎->源码(保留区块) —— P004
- │   ├── 单一数据源链路：后端接口->前端类型->Schema->渲染，单点维护 —— P004
- │   └── 渐进式增强：90% Schema覆盖 + 10% render/Slots/Composables 逃逸口 —— P004
- ├── 5. 质量门禁流水线 —— 让“不合格代码”无法入库
- │   ├── 流水线七阶段：Lint->TypeCheck->Unit->E2E->Build->Scan->Deploy —— P005
- │   ├── 量化红线阈值：覆盖率80%/95%、bundle<500KB、LCP<2.5s、CLS<0.1、INP<200ms、高危漏洞0、axe违规0 ——
  P005
- │   ├── GitOps 发布：ArgoCD监控/PreSync迁移/PostSync健检/自动回滚 —— P005
- │   ├── 多层防御左移：pre-commit -> CI -> 预发布 -> 生产监控 —— P005
- │   └── 可视化看板：Grafana展示DORA四大指标/耗时趋势/覆盖率趋势 —— P005
- └── 6. 架构演进与知识沉淀 —— 让系统在变化中进化
- '    ├── 技术债务清单：季度扫描TODO/SonarQube/依赖滞后/类型覆盖率/性能回退 —— P006'
- '    ├── 重构提案 ADR：关联业务价值/经评审/纳入路线图 —— P006'
- '    ├── 组件复用率报告：引用频次/覆盖场景/定制分支 -> 识别高价值/僵尸组件 —— P006'
- '    ├── 分层分享体系：周会(踩坑)/月度(源码/架构)/季度(ADR评审)/年度(白皮书) —— P006'
- '    ├── 数据驱动治理：复用率<20%下线/高频定制下沉配置/高频Bug归因完善规范 —— P006'
- '    └── 知识资产管理：文档过期标记/Owner制/入职必读/拒绝流水账PPT —— P006'
life_analogy:
- 想象**建设一座“智能城市”**的全过程：
- '- **技术选型决策矩阵** = **城市总体规划图纸**：在动工前，对比地铁还是BRT、集中供暖还是分户供暖，用加权评分锁定方案，并写下《规划决策备忘录》（ADR），十年后新市长也能看懂当年为什么这么选。'
- '- **Monorepo 仓库治理** = **地下统一管廊（综合管廊）**：水、电、气、光纤、通讯走同一条隧道（单仓），维修挖一次路（原子提交），管线共享支架（依赖去重），新增管线只需申请接入（workspace:*），避免了满城挖坑（多仓乱象）。'
- '- **基础设施封装层** = **城市标准化“市政接口”**：楼盘开发商（业务代码）只需对接标准的水电燃气接口（@enterprise/*），不管地下换了燃气公司（Ant
  Design->Arco）还是升级供水管网（Axios->Fetch），楼盘不用返工（零侵入）。'
- '- **Schema 驱动开发** = **“装配式建筑”预制构件**：不用现场砖砌瓦砌（手写CRUD），工厂按图纸（Schema）预制好墙板、楼板、窗户（ProTable/ProForm），运到现场吊装拼接。业主改需求（改字段）只需改图纸（单一数据源），工厂自动出新构件。'
- '- **质量门禁流水线** = **建筑验收的“关卡闸机”**：地基（Lint/TypeCheck）不合格不让盖楼，结构（Unit/E2E）不达标不让封顶，消防/环保/节能（Scan/性能/安全/无障碍）指标超红线直接停工整改（阻断合并），最终拿到“竣工验收备案表”（ArgoCD同步）才能交付入住。'
- '- **架构演进与知识沉淀** = **城市“更新改造局”+“城市档案馆”**：定期巡查危旧楼（技术债务清单）、发改造红头文件（重构ADR）、统计标准件使用率淘汰滞销品（复用率报告）、组织规划师研讨会（分层分享），形成《城市建设白皮书》指导下一个十年。'
summary:
- concept: 技术选型决策矩阵
  desc: 多维度加权评分量化架构决策，配合 ADR 实现可追溯、动态演进
- concept: ADR (Architecture Decision Records)
  desc: 结构化记录决策背景、备选、决策、后果，纳入版本控制成为组织资产
- concept: Monorepo
  desc: 单仓多包管理，实现原子提交、依赖去重、版本联动，配合 pnpm/Changesets 落地
- concept: 基础设施封装层 (@enterprise/*)
  desc: 二次封装 UI/请求/权限/路由/国际化/监控，实现零侵入业务、类型安全全链路、可观测性内置
- concept: Schema 驱动开发
  desc: 以 JSON Schema 为单一数据源驱动 ProTable/ProForm/ProChart 及代码生成，实现声明式 CRUD 与渐进式增强
- concept: 质量门禁流水线
  desc: 七阶段拦截（Lint/TypeCheck/Unit/E2E/Build/Scan/Deploy）+ 量化红线阈值 + GitOps 发布 + 多层左移防御
- concept: 架构演进与知识沉淀
  desc: 技术债务清单、重构 ADR、复用率报告、分层分享体系、白皮书，构建数据驱动的持续进化机制
exercises:
- 'no': 1
  title: 技术选型决策矩阵实战演练
  contents:
  - 场景：团队需在 Vue 3 + Pinia + Vite 与 React 18 + Redux Toolkit + Webpack 5 两套技术栈中二选一，用于新中后台项目。
  - 任务：
  - 1. 设计决策矩阵维度（至少 6 个），并给出权重分配理由（权重之和=100）。
  - 2. 为每个维度设定评分标准（1-5 分），并对两套栈分别打分。
  - 3. 计算加权总分，输出决策建议。
  - 4. 编写一份精简版 ADR 记录（含背景、决策、后果、替代方案）。
  - 思考题：
  - '- 若半年后团队新增 3 名仅有 React 经验的成员，如何触发重评机制？'
  - '- 如何设置“一票否决”指标应对突发合规要求（如必须支持信创国产化浏览器）？'
- 'no': 2
  title: Monorepo 仓库拓扑设计与增量 CI 验证
  contents:
  - 场景：规划一个包含 2 个子应用、3 个共享包的 Monorepo 结构。
  - 任务：
  - 1. 绘制目录树结构（apps/、packages/），标注每个包的职责与内部依赖关系（用 workspace:* 协议）。
  - 2. 编写 pnpm-workspace.yaml 关键配置。
  - 3. 设计 CI 增量构建脚本：当修改 `packages/ui` 时，自动触发 `apps/admin` 和 `apps/mobile` 的类型检查与单测，但不触发无关包构建。
  - 思考题：
  - '- 如何解决“幽灵依赖”导致的本地能跑通、CI 报错的问题？'
  - '- 当 `packages/shared-config` 更新 ESLint 规则导致全仓代码需修复时，如何控制单次 PR 范围与回滚风险？'
- 'no': 3
  title: Schema 驱动的 ProTable 组件最小原型实现
  contents:
  - 目标：实现一个极简版 `ProTable`，接收 Schema 配置自动渲染表格、搜索、分页、列设置持久化。
  - 任务：
  - 1. 定义 `TableSchema` TypeScript 接口，包含 `columns[]`（prop/label/width/sortable/searchable/fixed/render）、`requestApi`（分页查询函数）、`rowKey`、`settingsKey`（localStorage
    键名）。
  - 2. 实现核心逻辑：
  - '   - 根据 `columns` 渲染 `<el-table>` / `<table>`，支持 `render` 插槽函数自定义单元格。'
  - '   - 搜索表单自动生成：筛选 `searchable: true` 的列，渲染输入/选择器，提交时合并参数调用 `requestApi`。'
  - '   - 分页：自动处理 `page`/`pageSize` 与后端约定字段映射。'
  - '   - 列设置持久化：勾选显示/隐藏、拖拽排序、固定列，变更写入 `localStorage[settingsKey]`，刷新恢复。'
  - 3. 编写一个演示 Schema：用户管理表格（姓名、角色、状态、操作列），状态列用 `render` 渲染 Tag，操作列渲染编辑/删除按钮。
  - 思考题：
  - '- 如何通过 `render` 逃逸口支持“复杂交互单元格”（如可编辑单元格、下拉菜单）而不污染 Schema 纯粹性？'
  - '- 若后端接口字段新增/删除，前端仅改 Schema 一处即可生效，这一链路的自动化脚本如何设计（OpenAPI -> Schema）？'
- 'no': 4
  title: 质量门禁阈值收紧策略与误报治理
  contents:
  - 场景：遗留项目接入质量流水线，首月覆盖率仅 45%、Lint Error 200+、bundle 800KB。
  - 任务：
  - 1. 制定 6 个月分阶段收紧计划表（月度覆盖率/Lint/BodySize/性能指标目标值）。
  - 2. 设计“存量豁免、增量达标”机制：配置 ESLint `overrideConfig` 忽略存量目录、Vitest `exclude` 排除旧测试、Vite
    `build.chunkSizeWarningLimit` 动态调整。
  - 3. 定义 E2E 脆弱用例自动重跑与标记流程：失败重跑 2 次 -> 仍失败自动创建 Issue 并打 `flaky` 标签 -> 连续 3 次流水线失败自动禁用该用例并通知
    Owner。
  - 思考题：
  - '- 如何平衡“零容忍高危漏洞”与“依赖升级导致 Breaking Change 无法立即修复”的矛盾？'
  - '- 性能预算（LCP/CLS/INP）在 CI 中如何采集（Lighthouse CI / WebPageTest / 真实用户 RUM 数据回流）？各有何优劣？'
- 'no': 5
  title: 技术债务清单量化与重构 ADR 撰写
  contents:
  - 场景：某中后台项目运行 2 年，积累大量技术债务。
  - 任务：
  - 1. 设计《技术债务清单》表格字段：ID/分类(代码/依赖/架构/测试/文档)/描述/影响面(模块/人数/频次)/优先级(P0-P3)/预估工时/责任人/状态/关联
    ADR。
  - 2. 从 SonarQube 导出 50 条 Code Smell、pnpm outdated 导出 30 个滞后依赖、覆盖率报告导出 10 个低覆盖核心模块，演示如何聚类去重生成
    15 条标准化债务条目。
  - 3. 针对“组件库从 Ant Design v4 升级 v5”这一重大重构，撰写完整 ADR：
  - '   - 背景：v4 停止维护、v5 CSS-in-JS 性能提升、主题能力增强'
  - '   - 备选：就地升级 / 并行双版本灰度 / 迁移至 Arco Design'
  - '   - 决策：并行双版本灰度，预计 3 个月完成'
  - '   - 后果：需维护两套 peerDependencies、Codemod 脚本覆盖 80% 破坏性 API、回滚预案'
  - '   - 替代方案评估矩阵（成本/收益/风险/周期）。'
  - 思考题：
  - '- 如何建立“债务偿还预算制”：每季度规划预留 15% 带宽，如何在 OKR 中量化考核？'
  - '- 组件复用率报告如何指导债务优先级：复用率<20%且高维护成本的组件，是优先下线还是优先重构？'
