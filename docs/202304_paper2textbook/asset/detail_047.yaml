learning_targets:
- 理解自监督学习在大模型预训练中的核心地位与任务设计原理（MLM/CLM/NSP/跨度损坏）
- 掌握 Scaling Laws（Kaplan 与 Chinchilla 定律）推导模型规模、数据量与算力的最优分配策略
- 熟悉大规模分布式预训练工程体系：3D 并行（DP/TP/PP）、ZeRO 优化、混合精度（BF16）与激活重计算
- 掌握从 Common Crawl 到高质量训练语料的数据工程全流程：清洗、去重、课程学习、合成数据与污染检测
- 建立预训练稳定性诊断与应急恢复 SOP：Loss Spike 成因分类、监控体系、回滚策略与数据黑名单机制
- 了解跨度损坏/文本到文本统一框架在预训练目标设计中的应用
- 理解数据质量对 Scaling Laws 指数系数的影响及 Phi 系列小模型大智慧的启示
