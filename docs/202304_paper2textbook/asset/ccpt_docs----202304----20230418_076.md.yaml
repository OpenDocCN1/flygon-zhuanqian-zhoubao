paper: docs/202304/20230418_076.md
desc: 该素材系统拆解了共享WiFi码项目的基础认知，涵盖其发展历程（2021年诞生至2023年爆发）、工作原理（小程序绑定WiFi贴码免密连接）、盈利逻辑（用户看广告产生广告费分成）、商家价值（降本增效、引流变现）及三大演进模式：1.0平台模式（招商加盟分成）、2.0卖工具模式（售源码/独立部署）、3.0
  B端聚合模式（深度服务商家强链接），揭示了市场远未饱和但鱼龙混杂的现状。
concepts:
- name: 共享 WiFi 码
  desc: 一种基于微信小程序的物理贴码产品，将商户WiFi配置绑定至二维码，用户扫码观看广告后自动连接WiFi，实现免密联网与广告变现的双重功能。
  is_original: false
  excerpt:
  - 共享 WiFi 码工作原理非常简单，就是通过后台把 WiFi 绑定到 WiFi 码贴牌，然后再贴到桌子或墙上。客户直接使用手机扫码就可链接 WiFi，无需手动输入繁琐密码，快捷方便。
  - 共享 WiFi 码最早诞生于 21 年 6 月份，后来投入商业化...进入 23 年...热度更是有增无减。
- name: 广告分成变现模型
  desc: 用户扫码连接WiFi前需观看15秒视频广告，产生0.3-1.5元广告收益（实为0.3元以下居多），由平台、推广者（代理/合伙人）、商家多方分成的收益分配机制。
  is_original: false
  excerpt:
  - 客户扫码链接 WiFi 的过程中，会观看 15 秒左右的视频广告，观看完成之后，即可产生 0.3 元-1.5 元的广告费（绝大多数是 0.3 元以下，很多宣传的比较高，慎信），商家和推广者来分这个费用。
- name: 三大赚钱模式演进 (1.0/2.0/3.0)
  desc: 共享WiFi码项目从平台招商分成（1.0），演变为售卖技术工具/源码（2.0），进而向深度服务B端商家的聚合服务模式（3.0）迭代的市场演进路径。
  is_original: true
  excerpt:
  - 共享 WiFi 码项目发展到现在，主要有三个赚钱模式，1.0 模式，我们称之为平台模式...2.0 模式，我们称之为卖工具...3.0 模式，这个模式我称之为
    B 端模式（也叫聚合模式）
  - 总结：共享 WiFi 在变现模式上经历了从平台到铲子再到整合的阶段。
- name: B端聚合模式 (3.0模式)
  desc: 整合小程序全功能（支付、营销、会员等），不单纯依赖广告分成，而是通过深度数字化服务锁定商家，建立高粘性强链接、高门槛的商业模式。
  is_original: true
  excerpt:
  - 3.0 模式...顾名思义这个模式更加完善，整合了小程序大部分功能，这种模式可以更轻松的拿下 B 端客户，并且形成强链接。
  - 这个模式有一定的门槛（市场和开发），目前做的相对不多（大部分小公司实力有限，无法在这么短时间内就完成独立开发并整合）。
methods:
- name: __overview__
  desc: 作者基于生财有术圈子内部中标案例追踪、实地市场调研（楼下门店观察）、行业从业者视角（B端服务经验）的复盘拆解法，将项目拆解为基础认知、商业模式演进、市场机会判断三个维度进行结构化输出。
  excerpt:
  - 我把它拆解成三部分。分别是基础篇，招商加盟篇和个人创业篇。接下来，我会尽量简洁的把这个项目拆清楚。
  - 关于 WiFi 码项目，我仔细做了下市场调查...我去公司楼下吃饭，周围门店都还用着传统的 WiFi 链接方式。
- name: 商家价值锚定法
  desc: 从降低沟通成本、提升客户体验、增加额外广告收入、增加宣传引流渠道四个维度，构建向商家推销WiFi码的标准化话术与价值主张框架。
  excerpt:
  - 对于商家来说：设置 WiFi 码有以下优点：1.降低沟通成本...2.提升客户体验...3.增加额外收入...4.增加宣传渠道...
- name: 市场饱和度快速验证法
  desc: 通过实地走访周边餐饮/零售门店，观察是否仍在使用手写/口述WiFi密码，以此低成本判断共享WiFi码在本地市场的渗透率与蓝海空间。
  excerpt:
  - 我去公司楼下吃饭，周围门店都还用着传统的 WiFi 链接方式。感兴趣的圈友可以稍微调查一下自己的周围，看看有没有共享 WiFi 码...
theorems:
- name: 技术平庸但模式创新论
  desc: 共享WiFi码在技术层面无创新（仅是二维码+小程序+WiFi配置），但商业模式上实现了重大创新：以极低成本解决了全民连WiFi需问密码的高频痛点，重构了‘人-场-网’的连接交互范式。
  excerpt:
  - 虽说共享 WiFi 码在技术上不算创新，但是在模式上是相当创新的，毕竟解决了全民链接 WiFi 需要问老板密码的痛点。
- name: 市场远未饱和但鱼龙混杂论
  desc: 尽管项目火爆一年半，但线下渗透率极低（绝大多数门店仍用传统方式），市场天花板极高；然而入场者良莠不齐，源码交易坑深、平台跑路风险大，真正能穿越周期的玩家稀缺。
  excerpt:
  - WiFi 码自出现一年多的时间里，因为种种原因，市场远远没有达到饱和。
  - 虽然表面看很多人入场，实则鱼龙混杂，真正能经受住考验的依旧不多。
  - 源码这个行业的水是比较深的，服务器，后续服务，bug 修复，功能更新，版权等都是坑点。
- name: 模式必然向 B 端深度服务进化论
  desc: 单纯靠广告分成（1.0）或卖源码（2.0）均非长久之计，行业终局是拥有自主开发能力、整合支付/营销/会员体系、深度绑定商家经营场景的3.0聚合模式。
  excerpt:
  - 总结：共享 WiFi 在变现模式上经历了从平台到铲子再到整合的阶段。
  - 3.0 模式...整合了小程序大部分功能，这种模式可以更轻松的拿下 B 端客户，并且形成强链接。
findings:
- name: 广告单价虚高宣称与实况偏差
  desc: '[evence] 素材实测数据表明：单次连接广告收益绝大多数在 0.3 元以下，市场宣传的 0.3-1.5 元区间上限极难触达，存在夸大收益招商的现象。'
  excerpt:
  - 观看完成之后，即可产生 0.3 元-1.5 元的广告费（绝大多数是 0.3 元以下，很多宣传的比较高，慎信）
- name: 源码/独立部署市场乱象
  desc: '[evidence] 2.0模式下，源码售价 2000-30000 元不等，但服务器维护、Bug修复、功能迭代、版权纠纷等隐性坑点极多，非技术团队极易踩坑。'
  excerpt:
  - 源码这个行业的水是比较深的，服务器，后续服务，bug 修复，功能更新，版权等都是坑点。想入场的朋友，选择服务商时一定要擦亮眼睛。
- name: 线下渗透率极低的实地观察
  desc: '[evidence] 作者实地考察公司楼下周边门店，发现均未部署共享WiFi码，仍沿用传统密码连接方式，侧面印证市场处于早期渗透期。'
  excerpt:
  - 我去公司楼下吃饭，周围门店都还用着传统的 WiFi 链接方式。
- name: 用户连接外部 WiFi 需求下降的反面证据
  desc: '[claim] 评论区用户反馈：因手机流量套餐充足、电量焦虑等原因，个人连接公共WiFi频率大幅下降，暗示C端刚需可能被高估。'
  excerpt:
  - '木头人 : 😂有多少人和我一样，几年没连接过外面的 wifi 了，手机流量够够的'
  - '大龙 dylan : 电量不够[呲牙]，wifi 省电'
