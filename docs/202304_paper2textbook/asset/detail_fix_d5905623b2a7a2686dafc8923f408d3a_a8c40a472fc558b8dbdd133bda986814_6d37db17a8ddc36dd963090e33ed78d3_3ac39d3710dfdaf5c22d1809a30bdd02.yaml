- 'no': 2
  name: 高级检索策略 —— 从“广撒网”到“精捕捞”的召回与排序组合拳
  points:
  - '**为什么需要这个概念？**'
  - '- 单一向量检索存在“语义鸿沟”：查询与文档表征空间不一致，导致关键词实体（订单号、法条编号）召回率极低'
  - '- Top-K 向量结果噪声大，直接喂给 LLM 易产生幻觉、超出上下文窗口、推理成本高'
  - '- 复杂查询（多跳推理、比较类、汇总类）单次检索无法覆盖完整证据链'
  - '**核心定义**'
  - '- **多路召回**：同步执行稀疏检索（BM25/关键词）与稠密检索（向量），取并集/交集/加权融合（RRF）'
  - '- **重排序**：用 Cross-Encoder 或 LLM 对召回候选集打分重排，利用细粒度交互建模查询-文档相关性'
  - '- **查询理解**：查询重写（改写口语为检索式）、查询分解（拆解多跳问题）、查询路由（选择索引/工具）、HyDE（生成假设性文档向量化检索）'
  - '**关键性质**'
  - '- **召回上界提升**：混合检索通常能使 Recall@10 提升 15%-30%，解决“找不到”的问题'
  - '- **精度下界保障**：重排序将 Top-1 相关文档前置，使 Precision@3 显著提升，解决“排不准”的问题'
  - '- **计算分层**：召回追求高吞吐（毫秒级）、重排追求高精度（百毫秒级），架构上天然分离'
  - '**典型例子**'
  - '- 金融研报问答：用户问“对比2023年各大行净息差变化趋势” → 查询分解为各行子查询 → 混合检索召回表格页 → Cross-Encoder 重排保留含“净息差”表格的
    Chunk → 生成对比表'
  - '- 技术文档排障：用户报错 “OOMKilled” → HyDE 生成假设性解决方案片段 → 向量检索召回相关配置段落 → LLM 重排过滤无关版本 →
    生成修正步骤'
  - '**边界条件**'
  - '- 重排序模型（Cross-Encoder）推理延迟随候选数线性增长，生产环境通常限制候选数 ≤ 50'
  - '- BM25 依赖分词器，中文/代码/混合语言场景需针对性配置分词逻辑（如 Jieba + 保留标识符）'
  - '- HyDE 依赖生成模型能力，小模型生成的假设性文档可能引入幻觉噪声，需配合重排序兜底'
  sources:
