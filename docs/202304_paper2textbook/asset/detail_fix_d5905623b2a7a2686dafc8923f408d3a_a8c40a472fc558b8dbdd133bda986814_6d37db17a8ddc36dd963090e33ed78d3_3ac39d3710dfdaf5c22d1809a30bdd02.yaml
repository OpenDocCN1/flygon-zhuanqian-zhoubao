  name: Agentic RAG —— 让检索成为 Agent 手中的“瑞士军刀”而非流水线上的“固定工位”
  points:
  - '**为什么需要这个概念？**'
  - '- 固定流水线无法处理“需不需要查”、“查完还要不要查”、“查错了怎么改”这类动态决策'
  - '- 复杂任务（如财报分析、代码库重构）需要多轮检索、工具交替调用、中间结果推理验证'
  - '- 传统 RAG 将检索视为“前置步骤”，实则检索是推理过程中的“中间动作”'
  - '**核心定义**'
  - '- 将检索器封装为 `Tool`（如 `search_knowledge_base`、`query_sql`、`browse_web`），暴露标准化 Function
    Calling Schema'
  - '- Agent 核心循环：`观察(用户查询/上一步结果) -> 思考(CoT/Plan) -> 行动(调用检索工具/计算器/代码执行) -> 验证(结果是否充分/自洽)
    -> 迭代或终止`'
  - '- 关键能力：自主改写查询、判断证据充分性、发现冲突触发二次检索、决定何时停止检索直接回答'
  - '**关键性质**'
  - '- **自适应检索**：简单问题零检索直接答、复杂问题自动分解多子查询并行检索、模糊问题先澄清再检索'
  - '- **推理与检索交织**：检索结果进入推理上下文，推理产出新查询，形成“推理-检索”双螺旋上升'
  - '- **容错与回溯**：检索到错误文档时，Agent 可通过反思识别并发起纠偏检索，而非一条路走到黑'
  - '**典型例子**'
  - '- 多跳问答：“A 公司收购 B 公司的时间是？” → Agent 搜“A 公司收购历史”得知收购了 B/C/D → 判断证据不足 → 搜“B 公司被收购历史”
    → 交叉验证时间一致后回答'
  - '- 代码导航：“这个变量在哪里定义的？” → Agent 搜变量名 → 发现多处赋值 → 判断需看调用链 → 调用 `get_call_graph` 工具
    → 定位定义处 → 回答'
  - '**边界条件**'
  - '- Agent 循环易陷入“死循环”或“工具滥用”，需硬性限制最大步数、Token预算、工具调用频率'
  - '- Function Calling 依赖模型指令遵循能力，小模型（<7B）工具调用成功率低，需微调或用 ReAct 提示词模拟'
  - '- 可观测性压力大：每轮 Thought/Action/Observation 都需完整 Trace，调试排查难度指数级上升，必须配套专用调试平台'
  - '**进阶扩展：GraphRAG 与多模态 RAG**'
  - '- GraphRAG：构建实体关系图谱，支持全局推理与社区摘要，解决向量检索无法跨文档关联的难题'
  - '- 多模态 RAG：表格结构化解析、图表 OCR 理解、图像向量化检索，统一跨模态知识库管线'
