  excerpts:
  - 攻克‘召回不全、排序不准’核心难点：实现 BM25+向量混合检索、Cross-Encoder/LLM 重排序、多查询扩展、查询路由与分解，显著提升检索精度与召回率上界。
  - 高级检索策略：多路召回、重排序与查询理解
- 'no': 3
  name: RAG 评测与数据飞轮 —— 让“无感知优化”变成“有指标迭代”
  points:
  - '**为什么需要这个概念？**'
  - '- RAG 系统参数极多（分块大小、Top-K、重排模型、Prompt模版），凭直觉调参无法收敛'
  - '- 缺乏标准化指标导致“无法对比、无法回归、无法说服业务方上线”'
  - '- 线上真实分布与离线测试集漂移，单靠离线评测会过拟合测试集'
  - '**核心定义**'
  - '- **核心指标体系（RAGAS/ARES）**：忠实度、答案相关性、上下文精确率、上下文召回率、上下文实体召回率'
  - '- **合成测试集生成**：用强模型基于种子文档自动生成 QA 对，覆盖单跳/多跳/不可答/拒答等类型，低成本构建高质量基准'
  - '- **在线评测闭环**：采样真实流量 → LLM-as-Judge/规则/人工标注 → 计算指标 → 触发回归告警/自动触发超参搜索'
  - '**关键性质**'
  - '- **指标正交性**：忠实度（不胡说）与相关性（答对题）可独立优化，需建立 Pareto 前沿而非单一目标'
  - '- **数据飞轮**：线上高质量交互轨迹（用户点赞、修正、追问）自动入库 → 清洗 → 扩充测试集/微调数据 → 模型/提示词迭代 → 线上验证'
  - '- **防作弊机制**：测试集哈希去重、固定随机种子/温度/检索快照、Prompt/模型版本锁定，保证复现性'
  - '**典型例子**'
  - '- 团队建立夜ly评测流水线：每晚用最新代码跑 500 条合成测试集 + 200 条线上精选案例，输出 RAGAS 雷达图，若忠实度下降 > 2% 则阻断合并请求'
  - '- 利用用户“点踩+修正答案”数据，自动构建 DPO 偏好对，微调生成器，使拒答准确率从 78% 提升至 92%'
  - '**边界条件**'
  - '- LLM-as-Judge 存在位置偏好、冗长偏好、自我增强偏见，需校准（如交换位置平均、引入规则硬约束）'
  - '- 合成测试集覆盖率依赖种子文档质量，冷启动阶段种子不足时需人工标注种子集'
  - '- 在线 A/B 测试需流量分桶、统计显著性检验，小流量业务可能样本量不足，需采用序贯检验或贝叶斯方法'
  sources:
