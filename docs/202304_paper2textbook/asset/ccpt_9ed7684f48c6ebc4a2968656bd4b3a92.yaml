paper: docs/202304/20230418_123.md
desc: 该素材为作者 Start9527 发布的一篇推广与导引性文章，介绍其个人 Web3 领域背景（All in Web3、《从零开始读懂 Web3》统筹作者、生财有术
  Web3 小航海教练、Web3Going 社区创始人），并分享其担任生财有术 Web3 小航海教练期间的教学内容链接，旨在确立专家人设、吸引新人加入其 Web3
  新手实战营社区。
concepts:
- name: Web3Going 新手实战营
  desc: 作者创建的服务 Web3 新人的社区/训练营品牌，定位为帮助新人进入 Web3 赛道的实战指导平台。
  is_original: true
  excerpt:
  - 目前在做服务 Web3 新人的 Web3Going 新手实战营社区。
- name: 生财有术 Web3 小航海
  desc: 生财有术社区组织的 Web3 方向实战训练营活动，作者担任过两期教练。
  is_original: false
  excerpt:
  - 生财有术的两期 Web3 小航海教练
  - 收到 @小霸王 的邀请，我把在二月份担任生财有术 Web3 小航海教练的内容重新发一下
methods:
- name: __overview__
  desc: 作者基于实战经验构建的新人入门 Web3 指导体系，通过担任官方训练营教练、输出系统化教程（《从零开始读懂 Web3》）、运营新手社群（Web3Going）相结合的方式，降低新人入门门槛。
  excerpt:
  - 我是 All in Web3 的 Start，《从零开始读懂 Web3》的统筹作者，生财有术的两期 Web3 小航海教练，目前在做服务 Web3 新人的 Web3Going
    新手实战营社区。
  - 我希望在生财有术成为一位帮助大家进入 Web3 赛道的专家，当然我有这个能力尤其适合于给新人做指导，从两期 Web3 小航海效果来看，大家都挺受益的
theorems:
- name: 实战教练制入门路径优于自学
  desc: 核心主张：通过生财有术等成熟社区组织的“小航海”实战训练营，由经验丰富的教练（如作者）带领新人实操，是新人进入 Web3 赛道最高效、受益最大的路径。
  excerpt:
  - 我希望在生财有术成为一位帮助大家进入 Web3 赛道的专家，当然我有这个能力尤其适合于给新人做指导，从两期 Web3 小航海效果来看，大家都挺受益的
findings:
- name: 两期小航海教练经验的正向反馈
  desc: '[claim] 作者宣称在担任两期生财有术 Web3 小航海教练期间，参与学员均获得显著收益（"大家都挺受益的")，从而证明其教学方法论及指导能力的有效性。'
  excerpt:
  - 从两期 Web3 小航海效果来看，大家都挺受益的
- name: 教学内容外部公开链接
  desc: '[evidence] 素材提供了作者在小航海期间教学内容的完整在线文档链接，供读者验证教学质量与细节。'
  excerpt:
  - 分享全文：https://i.shengcaiyoushu.com/docx/ALKYdNpxDoVQ2VxIj5zcMYBinqc
