  - 3. 智能续写：检测流式输出是否因 `length` 截断，自动发送 `继续` 指令并拼接上下文
  - 4. 上下文拼接：维护对话历史，确保多轮对话的语义连贯性，支持 `system`/`user`/`assistant` 角色分离
