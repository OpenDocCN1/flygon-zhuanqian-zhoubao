  - '  - **背景**：你需要介绍你是谁？你是做什么行业的？你问这个问题，你的目的是什么？你面向的是什么人群'
  - '  - **要求**：你希望它输出的结果具体有哪一些要求？比如说不少于 1000 字、要以悬念式的提问开头、要包含 6 个要点...'
  - '  - **角色**：你需要赋予 ChatGPT 一个专业的角色... 你还可以给你自己赋予一个角色... 让他不断地来和你对话、问问题，最终想方设法把产品卖给你'
  - '**关键性质**'
  - '- 结构化提示词显著提升垂直领域内容生成质量：通过明确赋予专业角色并显式列出硬性约束，可引导大模型输出可直接投产的高质量内容'
  - '- 双角色扮演（销售与客户对练）可生成高转化话术，模拟真实博弈场景'
  - '- 方法论单一化原则：给 GPT 喂方法时‘不要多，一个就好’；过多方法论会干扰模型注意力机制，导致生成质量下降'
  - '**典型例子**'
  - '- 小红书笔记四步生成法：Step1 角色化获取基础素材（含约束条件） → Step2 角色化生成正文（赋予博主人设） → Step3 指令化注入 Emoji（段首+内容内嵌，语义匹配）
    → Step4 结构化生成爆款标题（含问题、方案、结果、字数限制）'
  - '- 游戏攻略脚本对比：未用六字真经得‘正确废话’，应用后得‘资源管理、部队选择搭配、小技巧’等可落地细节'
  - '- Emoji 语义级精准匹配：龙船溪漂流→🚤，植物园→🌸，红色纪念馆→🚩，证明跨模态语义联想能力'
