life_analogy:
- 想象 Pinia 是一个**现代化的智能仓储中心**：
- '- **createPinia()** = 仓储中心的**总控调度塔**（每个请求/用户会话一个独立调度塔，互不干扰）'
- '- **defineStore(''user'')** = 一个**专用货仓**（用户仓、购物车仓、商品仓），各司其职、扁平管理、无嵌套套娃'
- '- **State** = 货架上的**实物库存**（响应式、可盘点、可追溯）'
- '- **Getters** = **智能分拣标签**（派生数据、自动缓存、按需计算，如‘高价值用户’、‘购物车总价’）'
- '- **Actions** = **作业工单/机械臂**（处理入库/出库/盘点等业务流程，支持异步、可组合调用其他货仓工单）'
- '- **storeToRefs** = **给库存贴上 RFID 智能标签**（解构搬运时不丢失‘响应式’追踪能力，拆到哪监控到哪）'
- '- **pinia.use(plugin)** = **给仓储中心装插件**（安装‘自动盘点入账’持久化插件、‘跨园区同步’多标签页插件、‘操作回放’时光机插件），业务货仓零侵入'
- '- **SSR 隔离** = **每位客户专属临时仓库**，下单即建、离场即销、数据随人走、绝不串单'
- '- **Vuex 迁移** = **从‘单一超大仓+分区’升级为‘多个专用智能仓+总控塔’**，分批搬迁、新旧并行、平滑切换'
- 想象『ChatGPT 超级写手机器人 1.0』是一个**不知疲倦的全自动流水线工厂**：
- '- **多账号调度池** = **多条并行生产线**，单线故障自动切换、无人值守'
- '- **任务队列** = **原料传送带**，提示词有序进入、不拥堵不遗漏'
- '- **智能续写判断** = **光学质检传感器**，检测输出是否截断、自动触发‘继续生成’指令'
- '- **上下文自动拼接** = **精密焊接机械臂**，将分段输出无缝拼合、保持语义连贯'
- '- **结果实时入库** = **成品自动入库系统**，生成即存储、可追溯、防丢失'
- 想象福格行为模型（B=MAP）是**引流的‘通用遥控器’**：
- '- **私信动力（M）** = **用户想按下按钮的‘意愿’**，由选题精准度、痛点刺激、收益展示决定'
- '- **私信能力（A）** = **用户‘能按下按钮’的‘容易度’**，由 SOP 教程、关键词搜索指引降低门槛'
- '- **私信提示（P）** = **‘按钮闪烁/震动’的‘外部触发’**，在图片、评论、私信、群聊多触点植入引导线索'
- '- 只要**动力足、能力强、提示及时**，用户就会产生‘私信’行为，平台规则变化仅影响具体‘按钮样式’，不影响‘遥控器原理’'
- 想象『六字真经』是**驾驭 ChatGPT 这台‘超级实习生’的‘标准作业单’**：
- '- **背景** = **实习生入职档案**：告诉 TA 你是谁、做什么行业、问这个问题的目的、面向谁'
- '- **要求** = **任务清单与验收标准**：字数、结构、风格、行动号召、Emoji 位置……'
- '- **角色** = **岗位说明书**：赋予 TA 专业身份（如‘小红书旅游博主’）、对话对象人设（如‘预算 1000 元的背包客’）'
- '- 只要按这‘三张单子’填好，实习生就能交出符合预期的‘成品’'
- 想象『不讨厌/不厌其烦』是**普通人在抖音淘金时的‘金属探测器’**：
- '- 大多数人在沙漠里挖金子（追求热爱/擅长），累得半死不一定有收获'
- '- 你只需拿着探测器走一圈：**别人‘讨厌死、给钱不干’的事，你‘不厌其烦’**'
- '- 这个微小的‘耐受度差异’，就是埋在浅层沙砾下的‘金矿’（天分火种）'
- '- 持续‘边学边教’（挥动镐头），星星之火终将燎原，成为‘天分与赚钱的结合点’'
summary:
- concept: Pinia 核心架构
  desc: 扁平化 Store 设计，自动代码分割，Option/Setup 双风格，无模块嵌套，~1kb 轻量级
- concept: defineStore
  desc: 定义即注册，返回类型自动推导 State/Getters/Actions，Setup Store 支持 Composition API 灵活复用
- concept: storeToRefs
  desc: 解决组合式 API 解构丢失响应式问题，将 Store 转为 Ref 对象并保持完整类型推导
- concept: pinia.use()
  desc: 插件扩展点，接收 {store, app, pinia, options}，可返回属性扩展 Store，支持横切关注点注入
- concept: $subscribe
  desc: 监听 Store 所有状态变更，参数为 MutationPayload，插件实现持久化/同步/审计的核心钩子
- concept: pinia-plugin-persistedstate
  desc: 官方推荐持久化插件，配置式声明持久化策略（storage/paths/serializer），支持 SSR 降级
- concept: SSR 隔离
  desc: 每请求创建 createPinia() 实例，服务端序列化 pinia.state.value 注入 HTML，客户端水合激活
- concept: setActivePinia(createPinia())
  desc: 测试用例级上下文重置，确保 Store 实例隔离，配合 vi.spyOn 实现 Action/Getter Mock
- concept: Setup Store $reset
  desc: 'Option Store 自带重置，Setup Store 需手动 return { $reset: () => { ... } } 实现状态归零'
- concept: Vuex 迁移共存
  desc: app.use(pinia).use(vuex) 双运行，pinia-plugin-vuex 兼容 this.$store，Module 按业务域拆分为扁平
    Store
- concept: Module 拆分策略
  desc: 原 modules/a/b -> useAStore/useBStore，通过组合（useAStore 内调用 useBStore）替代嵌套，利于
    Tree-shaking
- concept: ChatGPT 超级写手机器人 1.0
  desc: 解决长文本输出中断、上下文断层、人工交互、多账号管理、自动保存六大痛点，实现全自动真批量内容生产
- concept: 全自动、真批量
  desc: 零人工干预的端到端自动化：任务分发、多账号轮询、断点续写、上下文拼接、异常切号、结果入库
- concept: 引流行为公式 B=MAP
  desc: 用户私信行为 = 私信动力 × 私信能力 × 私信提示，平台规则变化仅影响方法层不影响逻辑层
- concept: 私信动力
  desc: 用户产生‘想建立联系’意愿的心理驱动力，由选题精准度、痛点刺激、收益展示构成
- concept: 私信能力
  desc: 用户完成私信操作的难易度，核心在于 SOP 教程（手写纸条/流程图）规避平台检测、降低认知门槛
- concept: 私信提示
  desc: 在笔记图片、评论区、私信、群聊等多触点植入引导线索，触发用户即时行动的外部诱因
- concept: 六字真经
  desc: ChatGPT 提示词工程核心框架：背景（身份/行业/目的/受众）、要求（字数/结构/风格/行动号召）、角色（专家人设/双角色扮演）
- concept: AIGC 时代双核竞争力
  desc: 行业经验（方法论沉淀）与执行力（训练/落地强度），工具仅是放大器而非替代品
- concept: 不讨厌/不厌其烦
  desc: 普通人发现天分火种的关键信号：他人‘讨厌死、给钱不干’的事，己方‘不厌其烦’，即为可切入的差异化赛道
- concept: 天分小火花
  desc: 隐喻‘不讨厌’背后蕴含的、可被呵护放大的微小天赋种子，通过持续‘边学边教’可燎原成核心竞争力
- concept: 边学边教正向循环
  desc: 越学越会 → 越会越喜欢 → 越喜欢越擅长 → 越擅长越受欢迎 → 越受欢迎越赚钱 → 越赚钱越愿意去学
exercises:
- 'no': 1
  title: 手写一个迷你 Pinia 核心
  contents:
  - '实现 `createPinia()` 返回 `{ install(app), _s: Map, state: Ref<Record<string, any>>
    }`'
  - 实现 `defineStore(id, setupFn)`：
  - '  1. 接受 Setup Store 工厂函数，返回 `useStore` 函数'
  - '  2. `useStore()` 调用时：若 `_s` 有实例则复用，否则调用 `setupFn` 获取返回对象，用 `reactive` 包装 state，挂载
    `_s`'
  - '  3. 支持 `store.$subscribe(cb)` 记录回调，`store.$patch(obj|fn)` 触发变更并广播'
  - 在 Vue 应用中注册 `app.use(pinia)` 验证：
  - '  - 组件中 `const store = useCounterStore()` 获取状态与方法'
  - '  - 修改 `store.count++` 触发视图更新'
  - '  - 刷新页面后手动挂载 `pinia.state.value = savedState` 验证水合'
  - 思考题：
  - '- 为什么 `defineStore` 返回的 `useStore` 要接受可选的 `pinia` 参数？'
  - '- Setup Store 中的 `ref`/`computed` 如何自动解包为普通属性返回？'
  - '- 如何实现 `storeToRefs(store)` 保持响应式与类型？'
- 'no': 2
  title: 类型安全实战：从定义到组件使用的全链路推导
  contents:
  - 定义一个 `useOrderStore`（Setup Store 风格），包含：
  - '  - state: `orders: Order[]`，`filter: ''all'' | ''pending'' | ''completed''`'
  - '  - getter: `filteredOrders` 根据 filter 筛选，`totalAmount` 计算总金额'
  - '  - action: `addOrder(order)`, `toggleStatus(id)`, `setFilter(f)`'
  - '  - 使用 `storeToRefs` 解构 `filteredOrders` 与 `filter` 在组件中使用'
  - 类型挑战：
  - '  1. 让 `Order` 接口在别处定义，Store 内部引用时自动推导泛型'
  - '  2. `addOrder` 参数类型自动推导为 `Omit<Order, ''id'' | ''createdAt''>`'
  - '  3. 组件中 `const { filteredOrders, totalAmount } = storeToRefs(store)` 类型分别为 `ComputedRef<Order[]>`
    与 `ComputedRef<number>`'
  - '  4. 在另一个 `useUserStore` 的 action 中调用 `useOrderStore().addOrder(...)`，验证跨 Store
    类型合并无报错'
  - 回答问题：
  - '- 如果 Setup Store 返回 `return { orders, filteredOrders, addOrder }` 直接返回 `ref`/`computed`，组件解构后类型会是什么？为何推荐
    `storeToRefs`？'
  - '- 如何为 `defineStore` 显式指定泛型参数以约束返回类型？（提示：`defineStore<''order'', State, Getters,
    Actions>()`）'
- 'no': 3
  title: 开发一个『多标签页状态同步』Pinia 插件
  contents:
  - 需求：在多个标签页打开同一应用时，任一标签页修改 `useUserStore` 的 `token` 或 `profile`，其他标签页自动同步更新，且不触发循环广播。
  - 实现步骤：
  - '  1. 编写 `piniaPluginBroadcastSync(context)` 插件函数'
  - '  2. 利用 `BroadcastChannel API` 创建频道 `pinia-sync-${store.$id}`'
  - '  3. 监听 `store.$subscribe((mutation) => { ... })`，仅当 `mutation.type === ''patch
    object''` 或 `''patch function''` 时，发送 `{ type: ''sync'', payload: mutation.payload
    }` 到 Channel'
  - '  4. 监听 `channel.onmessage`，收到消息时调用 `store.$patch(payload)`，**关键：需标记来源防止回环广播**（如设置
    `mutation._fromSync = true` 并在发送时跳过）'
  - '  5. 在 `pinia.use(piniaPluginBroadcastSync)` 注册，或仅对特定 Store 生效（通过 `options.sync?:
    true` 判断）'
  - 进阶挑战：
  - '  - 支持 `paths: string[]` 配置仅同步部分字段（如仅同步 `token`，不同步 `profile`）'
  - '  - 处理标签页关闭/离线场景：新标签页打开时如何获取最新状态？（提示：Channel 无历史，需结合 localStorage 快照或主动请求广播）'
  - 回答问题：
  - '- 为什么不能直接在 `$subscribe` 回调里无条件 `channel.postMessage`？'
  - '- `BroadcastChannel` 与 `localStorage storage event` 在同步机制上有何本质区别？哪个更适合高频状态同步？'
- 'no': 4
  title: SSR 场景下的 Pinia 实例隔离与水合排查
  contents:
  - 模拟 Nuxt 3 / Vue SSR 环境：
  - '  1. 服务端入口 `server-entry.ts`：为每个请求创建 `const pinia = createPinia()`，`app.use(pinia)`，渲染
    HTML 前序列化 `pinia.state.value` 注入 `window.__PINIA_STATE__`'
  - '  2. 客户端入口 `client-entry.ts`：创建 `pinia = createPinia()`，`app.use(pinia)`，**关键步骤**：`pinia.state.value
    = window.__PINIA_STATE__`'
  - '  3. 定义 `useAuthStore` 包含 `token`、`userInfo`，在服务端 `asyncData` 中模拟登录设置 token'
  - 排查任务：
  - '  - 现象 A：客户端控制台报错 `Cannot read property ''token'' of undefined`，定位原因（提示：Setup
    Store 顶层访问 `useRoute()` 或 `window`）'
  - '  - 现象 B：刷新页面后 `token` 丢失，但 `userInfo` 保留，定位序列化/水合差异（提示：`$subscribe` 序列化时机与 `pinia.state.value`
    赋值顺序）'
  - '  - 现象 C：多用户并发请求，用户 A 看到用户 B 的 `userInfo`，定位实例隔离失败（提示：是否复用了全局单例 `pinia`？）'
  - 回答问题：
  - '- 为什么 SSR 必须每请求 `new createPinia()`，而客户端可以单例？'
  - '- `pinia.state.value = { ... }` 赋值时，Setup Store 内部的 `ref` 变量为何能自动更新？（提示：`pinia.state.value`
    是 Proxy/Ref，Store 实例内部引用同一响应式对象）'
- 'no': 5
  title: Vuex 迁移 Pinia 实战：从 Module 嵌套到扁平 Store 重构
  contents:
  - 给定一个 Vuex 存量结构：
  - '```js'
  - // store/index.js
  - const store = new Vuex.Store({
  - '  modules: {'
  - '    account: {'
  - '      namespaced: true,'
  - '      state: { user: null, permissions: [] },'
  - '      getters: { isAdmin: s => s.permissions.includes(''admin'') },'
  - '      actions: { login(), fetchPermissions() },'
  - '      modules: {'
  - '        profile: { state: { avatar: '''', bio: '''' }, mutations: { updateProfile()
    } }'
  - '      }'
  - '    },'
  - '    cart: { namespaced: true, state: { items: [] }, actions: { addToCart(), checkout()
    } }'
  - '  }'
  - '})'
  - '```'
  - 迁移任务：
  - '  1. 拆分为 3 个 Pinia Store：`useAccountStore`、`useProfileStore`、`useCartStore`'
  - '  2. `useAccountStore` 内通过 `const profileStore = useProfileStore()` 组合原嵌套模块，`getters.isAdmin`
    改为 `computed`'
  - '  3. 编写兼容层插件 `piniaPluginVuex`，使旧组件 `this.$store.state.account.user` 仍可工作（提示：代理
    `pinia.state.value.account`）'
  - '  4. 组件侧重构：将 `mapState(''account'', [''user''])` 替换为 `const { user } = storeToRefs(useAccountStore())`'
  - '  5. 迁移 `vuex-persistedstate` 配置至 `pinia-plugin-persistedstate`，注意 `paths` 映射变化'
  - 回答问题：
  - '- 原 Vuex `account/profile` 嵌套改为扁平组合后，`useAccountStore` 里调用 `useProfileStore()`
    会形成循环依赖吗？如何避免？'
  - '- 迁移后 `store.registerModule(''dynamic'', module)` 动态注册模块的场景如何用 Pinia 实现？（提示：动态
    `import` + `pinia._s.set()`）'
  - '- 为什么迁移后生产包体积通常减少 20%+？（提示：Tree-shaking、无模块嵌套开销、Setup Store 无字符串键名）'
