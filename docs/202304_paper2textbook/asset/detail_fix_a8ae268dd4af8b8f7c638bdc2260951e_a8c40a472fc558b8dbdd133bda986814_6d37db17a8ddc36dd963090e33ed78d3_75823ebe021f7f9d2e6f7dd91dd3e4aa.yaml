  name: ChatGPT 高效对话六字真经 —— 从‘玄学咒语’到‘结构化提示词工程’
  points:
  - '**为什么需要这个概念？**'
  - '- 99% 人觉得 ChatGPT 不好用是因为‘不会问问题’，即缺乏结构化提示词能力'
  - '- 通用大模型输出质量与提示词结构化程度强相关，无背景/角色/约束的‘直抒胸臆式’提问仅得‘正确的废话’'
