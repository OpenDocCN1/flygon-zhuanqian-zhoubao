life_analogy:
- 想象前端团队引入 AI 是一次**‘新员工入职与晋升’的完整过程**：
- '- **AI 编程助手** = **实习生**：手里拿着通用技能手册（预训练模型），能写样板代码、查语法，但不懂业务规范、不认识内部组件库，需时刻监督（Inline
  Chat/补全）。'
- '- **RAG 知识库** = **入职导师手册 + 代码库地图**：把私有组件库、架构文档、历史 ADR 切片索引好，实习生遇到不会的‘查手册’，不再瞎猜，还能指引到具体文件行号（溯源）。'
- '- **Agent 工作流** = **资深工程师**：给一个 Issue（需求），能自主拆解任务（Planner）、写代码（Coder）、跑测试（Tester）、自查
  Bug（Reviewer），只在关键节点找你批准（人工介入点）。'
- '- **模型微调** = **内部晋升培训/肌肉记忆形成**：把团队最佳实践、代码规范、独特模式‘练’进模型权重里，变成‘不看文档也能写出符合规范代码’的专家级员工。'
- '- **AI Code Review** = **自动化质检闸机 + 初级 Reviewer**：PR 一提交，瞬间扫描格式、安全、性能、测试覆盖，把确定性错误拦在门外，只把架构决策、业务逻辑留给人类专家把关。'
summary:
- concept: AI 编程助手
  desc: 基于 LLM 的 IDE 集成工具，核心差异在于模型能力、上下文工程策略与交互范式（补全/对话/Agent）
- concept: 上下文工程
  desc: 构建高质量模型输入的关键技术，融合最近文件、语义检索、符号索引与用户选中，解决‘大海捞针’精度问题
- concept: 代码库 RAG
  desc: 面向代码仓库的检索增强生成，核心流程：AST 切片 → 代码专用 Embedding → 混合检索 → 重排序 → 溯源引用
- concept: Tree-sitter AST 切片
  desc: 按函数/类/组件/接口等语义单元切分代码，保留语法完整性与元数据（路径、行号、依赖），优于固定长度分块
- concept: 混合检索
  desc: 稠密向量（语义）+ 稀疏 BM25（关键词/符号）召回，解决符号精准匹配与语义相关并重的需求
- concept: 代码 Agent
  desc: 具备规划、工具调用、记忆、反思能力的自主系统，输入需求输出代码变更集，编排框架如 LangGraph/AutoGen
- concept: 多角色协作
  desc: Planner（规划）、Coder（编码）、Tester（测试）、Reviewer（评审）分工协作，通过状态机流转实现闭环
- concept: 人工介入点
  desc: 计划确认、高风险审批、测试失败暂停、PR 提交确认，实现‘AI 驱动，人工把关’的安全边界
- concept: 继续预训练
  desc: 在基座模型上继续训练高质量领域代码语料，增强领域知识密度，解决‘不知业务’问题
- concept: 指令微调 (SFT)
  desc: 构建‘指令-标准响应’对，用 LoRA 低成本适配，固化团队最佳实践与编码规范模式
- concept: 对齐训练 (DPO/ORPO)
  desc: 基于偏好数据（优秀 vs 违规代码）对齐，修正模型倾向（如滥用 any、忽略无障碍），提升代码合规率
- concept: AI Code Review Bot
  desc: 集成于 Git 平台的自动化审查系统，融合静态分析结果与 LLM 语义分析，输出行级结构化评审意见
- concept: 结构化评审输出
  desc: 强制 JSON Schema（file/line/severity/category/fix_suggestion），支持 IDE 一键应用修复与单测草案生成
- concept: 反馈闭环
  desc: 开发者标记 Not Helpful → 纳入负样本微调/调整 Prompt，持续治理假阳性，建立信任
exercises:
- 'no': 1
  title: 设计前端代码库 RAG 切片与检索方案
  contents:
  - 假设你接手一个包含 5000 个文件的 Vue 3 + TypeScript Monorepo 代码库，包含业务组件、工具函数、请求封装、设计系统组件库源码。
  - 1. 设计基于 Tree-sitter 的切片策略：定义哪些 AST 节点类型作为切片单元？如何处理跨文件的类型引用与组件依赖？
  - 2. 选择 Embedding 模型：对比 voyage-code-2、jina-embeddings-v2-code、nomic-embed-text 在
    TypeScript/Vue 代码上的召回效果，给出选型建议。
  - 3. 设计混合检索权重：稠密向量检索与 BM25 稀疏检索的融合权重如何设定？针对 'v-permission' 这类指令名搜索如何保证精准命中？
  - 4. 重排序策略：Top-K 取多少？Cross-Encoder 与 LLM-based Reranker 在延迟与精度上的权衡如何决策？
  - 5. 溯源设计：生成回答时如何强制模型引用文件路径与行号？若检索片段相互矛盾（新旧版本混存），如何在 Prompt 中约束模型行为？
- 'no': 2
  title: 编排一个‘需求到 PR’的 Agent 工作流原型
  contents:
  - 使用 LangGraph 或伪代码设计一个最小可行的 Agent 状态机，完成‘为现有用户列表页新增导出 Excel 功能’的任务。
  - 1. 定义状态图的节点：Plan -> Code -> Test -> Review -> Fix(循环) -> Commit -> PR，每个节点的输入输出
    Schema 设计。
  - 2. Planner 节点：如何利用 RAG 检索现有 ProTable 组件用法、权限指令、请求封装、Excel 导出工具函数作为上下文？如何输出结构化任务树？
  - 3. Coder 节点：工具集成设计（文件读写、LSP 跳转定义、Git Diff 生成），如何并行修改多个文件并处理导入依赖冲突？
  - 4. Tester 节点：自动运行 vitest，解析测试报告（通过/失败/覆盖率），失败时如何将错误堆栈精准反馈给 Coder 修复？
  - 5. 人工介入点设计：在哪些节点必须暂停等待人工 Confirm？如何设计‘最多重试 3 次后升级给人工’的熔断机制？
- 'no': 3
  title: 制定前端专用模型微调数据工程与评测方案
  contents:
  - 团队决定基于 DeepSeek-Coder-7B-Base 进行继续预训练 + LoRA SFT + DPO 对齐，打造内部专用 Copilot。
  - 1. 数据收集与清洗：从 Git 历史中提取高质量 PR Diff 作为训练语料，设计去重、去敏感信息、质量打分（如 GPT-4o 打分 > 4 分）的清洗管线。
  - 2. 构建 SFT 数据集：设计 5 类核心任务模版（组件开发、Hook 封装、API 接入、Bug 修复、单测编写），每类至少 200 条高质量指令-响应对，如何保证响应代码的‘标准性’？
  - 3. LoRA 超参数配置：r=64/128, alpha=16/32, target_modules 选择 qkv/o/gate/up/down，在单张
    A100 40GB / H100 80GB 显存下的最大 Batch Size 与训练时长估算。
  - 4. 评测基准搭建：设计前端专用评测集，包含 TypeScript 类型正确率、ESLint 规则通过率、组件库 API 调用准确率、单测生成覆盖率四大指标，如何自动化跑分？
  - 5. 灾难性遗忘缓解：继续预训练阶段混入多少比例通用代码数据？SFT 阶段如何使用 Replay Buffer？最终模型如何通过在线 A/B 测试（采纳率/修改率）验证真实效果？
- 'no': 4
  title: 落地 AI Code Review 机器人的核心工程难点攻关
  contents:
  - 在公司 GitLab 部署 AI Code Review Bot，要求覆盖规范检查、安全扫描、性能建议、单测补全。
  - 1. 上下文构建优化：大型 PR 变更文件超 50 个，Token 预算 128k，设计‘变更块优先 + 关联文件检索 + 规范文档注入’的上下文裁剪算法。
  - 2. 多模型协作路由：小模型（如 7B）处理命名规范/格式/未用变量；大模型（GPT-4o/Claude）处理架构分层违规/业务逻辑漏洞/性能隐患。设计路由分发
    Prompt 与成本控制策略。
  - 3. 结构化输出与 IDE 集成：定义 JSON Schema 强制模型输出，包含 file/start_line/end_line/severity/category/description/fix_code/confidence。如何在
    GitLab MR 界面渲染为可交互的行级评论？
  - 4. 单测生成触发条件：仅对新增/修改的导出函数、组件、Hook 触发生成。生成的 Vitest 用例如何覆盖边界条件、异常分支、Props 组合？如何防止生成冗余/无效测试？
  - 5. 假阳性治理闭环：开发者点击‘Not Helpful’后，数据如何流入负样本池？设计每周自动化微调/Prompt 优化流水线，将假阳性率从 15% 降至
    5% 以下。
