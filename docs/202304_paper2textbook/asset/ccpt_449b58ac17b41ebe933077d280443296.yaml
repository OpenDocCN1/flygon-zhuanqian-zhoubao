paper: docs/202304/IwUDdGvHhojaL2xwtUzc6YyZnHh.md
desc: 该素材系统阐述了如何利用第三方数据平台（如蝉小红）结合RPA自动化抓取技术，基于“需求度、电商价值、竞争度”三个维度建立指标体系，通过加权综合评分模型对小红书电商行业类目及细分品类进行量化筛选，并辅以搜索长尾词验证及主观资源匹配，形成一套可落地的数据驱动选品方法论。
concepts:
- name: 需求度
  desc: 衡量用户对某行业/品类内容消费意愿的指标，定义为笔记互动数与笔记数的比率，同时需结合绝对数量综合判断，反映供需关系中的需求侧强度。
  is_original: false
  excerpt:
  - 这里我们重点关注笔记互动数和笔记数这两个值的比例，也就是：笔记互动数/笔记数
  - 这个比例越大，则说明用户对这类笔记的参与度越高，也就侧面反映了用户对这类笔记的需求度越高，当然，这里我们不能只关注两者的比例，同时还要关注其绝对数量。
- name: 电商价值
  desc: 衡量行业/品类商业化承载能力的指标，核心由带货笔记占比和商品数构成，反映该类目内可直接通过小红书店铺转化的产品丰富度与商家参与度。
  is_original: false
  excerpt:
  - 针对电商价值这个指标，我们需要重点关注的是：1. 带货笔记占比 2. 商品数
  - 因为带货笔记占比和商品数越多，就意味着这个行业中可以商业化的产品就越多。
- name: 竞争度
  desc: 衡量行业内容供给饱和程度的指标，定义为行业笔记占比（某行业笔记数/全平台笔记数），占比越高代表推荐流量争夺越激烈，反映供需关系中的供给侧压力。
  is_original: false
  excerpt:
  - 针对竞争度这个指标，我们需要重点关注的是：行业笔记占比
  - 也就是说，一个行业的笔记在所有行业笔记中的占比越高，就说明该行业竞争度也越高
- name: 综合评分模型
  desc: 作者原创的行业选品决策模型，公式为：综合得分 = (30 - 需求度排名) + (30 - 电商价值排名)*2 + 竞争度排名。引入权重系数（电商价值权重2，需求度与竞争度权重1）及硬性门槛（商品数<1000或带货笔记占比<1%直接判0分），实现多维指标的一体化量化排序。
  is_original: true
  excerpt:
  - 最终的综合评分规则如下：综合得分 = (30 - 需求度排名) + (30 - 电商价值排名)*2 + 竞争度排名
  - 我在计算某个行业综合得分的时候，对于那些商品数低于1000或者带货笔记占比小于1%的行业类目，我直接将其综合得分为 0 了
- name: RPA自动化数据管道
  desc: 作者自主开发的工程化手段，用于批量抓取蝉小红“行业流量大盘”与“品类库”数据，自动计算核心比率指标、多维排序及导出Excel，解决了平台不支持数据导出的工程难题。
  is_original: true
  excerpt:
  - 蝉小红并不支持导出相关的数据，所以，我利用 RPA 搭建了一个自动化流程，来批量的抓取出这些数据，并自动计算出笔记互动数和笔记数之间的比例，之后再利用 RPA
    把这些数据导入到 Excel 表格中
  - 以下是我开发好的 RPA 应用，这里我只需要选择一下我们要分析的行业流量类型，Excel保存的文件夹路径以及数据统计方式就可以了
- name: 搜索长尾词验证机制
  desc: 针对高竞争度行业的补充选品策略，利用小红书搜索功能挖掘长尾关键词对应的细分产品，在需求量达标前提下规避红海竞争。
  is_original: false
  excerpt:
  - 针对这些竞争比较激烈的行业，我们可以利用搜索长尾词去选出一些更加细分的产品，只要需求量足够大，也一样是可以做的。
methods:
- name: __overview__
  desc: 分层级漏斗式选品法：第一层行业类目筛选（需求度/电商价值/竞争度三维建模+加权评分+硬性门槛过滤），第二层细分品类筛选（互动量/笔记数比率横向对比+搜索验证），全流程由RPA自动化工具支撑数据获取与计算，最终结合主观资源匹配决策。
  excerpt:
  - 首先，我们可以先从大的行业类目着手去分析，基于数据分析的结果选定完行业类目之后，再用类似的思路去分析出对我们来说相对比较有价值的品类。
  - 最终，应用运行结束之后，我们会得到如下结果...这样，我们就可以利用一个行业的综合得分来辅助我们选择行业类目了。
  - 确定完行业类目之后，接下来，我们可以利用同样地思路去分析该行业类目下的品类
- name: 行业类目量化筛选法
  desc: 针对29个一级行业，抓取蝉小红‘行业流量大盘’数据，计算需求度(互动/笔记)、电商价值(带货笔记占比/商品数)、竞争度(行业笔记占比)三指标，按排名加权打分(电商价值权重2)并设门槛剔除低价值类目，输出综合得分排名表。
  excerpt:
  - 首先，我们可以打开蝉小红官网，然后点击工具，找到行业流量大盘
  - 最终的综合评分规则如下：综合得分 = (30 - 需求度排名) + (30 - 电商价值排名)*2 + 竞争度排名
  - 最终，应用运行结束之后，我们会得到如下结果
- name: 细分品类量化筛选法
  desc: 针对目标行业下的品类库，抓取蝉小红‘品类库’数据，核心计算品类需求度指标(互动量/相关笔记数量)，结合绝对互动量与笔记数横向筛选高潜品类，再辅以小红书站内搜索验证笔记质量与商品销量。
  excerpt:
  - 这里我们重点关注：互动量/相关笔记数量，这个比值越高，就侧面反应出用户对这个品类的需求度越高。
  - 之后可以再结合小红书的搜索，大概看一下这个品类在小红书中笔记的质量和商品的销量，最终决定是否选择这个品类。
- name: RPA数据抓取与清洗流程
  desc: 配置目标页面(行业流量大盘/品类库)、导出路径、统计时间等参数，自动化执行：页面遍历->字段提取(笔记数/互动数/带货笔记占比/商品数等)->指标计算(比率/占比/排名)->多维排序->Excel结构化导出。
  excerpt:
  - 我利用 RPA 搭建了一个自动化流程，来批量的抓取出这些数据，并自动计算出笔记互动数和笔记数之间的比例，之后再利用 RPA 把这些数据导入到 Excel 表格中，并根据【笔记互动数/笔记数】这个比值对这些数据进行排序。
  - 这里我们只需要选择一下我们要分析的品类，Excel保存的文件夹路径以及统计时间就可以了，之后点击确定，它就会自动帮我们把分析好的数据整理到 Excel 中
theorems:
- name: 选品本质论：产品即需求解决方案
  desc: 商业活动核心链路为产品-流量-转化-交付，产品是基础，产品背后是需求，因此选品首要任务是识别需求而非追逐流量。
  excerpt:
  - 任何商业活动本质上都离不开产品-流量-转化-交付这四个环节，其中产品是后面三个环节的基础。而产品的背后则是需求，我们可以说，所有的产品本质上都是某类需求的解决方案。
- name: 内容需求度不等于电商价值
  desc: 高内容互动(如搞笑类目)不代表高带货潜力，电商选品必须引入‘电商价值’维度(带货笔记占比、商品数)作为硬性约束，剔除‘只有流量无变现’的伪需求赛道。
  excerpt:
  - 排名第一的是搞笑类目...在这个类目下，我们可能很难进行电商带货，也就是说，虽然这个类目的内容需求量很大，但如果我们很难进行电商带货的话，那对于我们来说，价值也不是特别大。
- name: 供需平衡视角下的竞争度定义
  desc: 竞争度本质是供给侧拥挤度，用行业笔记占比表征：笔记占比越高，单篇笔记获取推荐流量难度越大，选品应倾向竞争度相对较低(供给不足)的蓝海机会。
  excerpt:
  - 一个行业的笔记在所有行业笔记中的占比越高，就说明该行业竞争度也越高，因为这意味着我们的笔记要从更多的笔记中脱颖而出才能获取更高的流量
- name: 数据辅助决策边界论
  desc: 数据分析仅适用于小红书店铺直接转化的低客单价标品；高客单价/非标服务需引流私域二次转化，上述公域数据模型失效。选品最终需融合数据结论与自有资源/优势/意愿。
  excerpt:
  - 通过这种方式获取到的数据可能更适合一些直接在小红书店铺中直接转化的产品，这种产品客单价一般不会太高...如果我们想做一些高客单价的产品或服务...我们再通过上面这些数据来辅助我们选品可能就不太合适了。
  - 数据分析只能辅助我们进行决策，我们在选品的时候还要结合我们自身已有资源、个人优势以及主观意愿来综合考虑。
