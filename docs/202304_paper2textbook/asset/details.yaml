- learning_targets:
  - 理解注意力机制解决 RNN 串行瓶颈与长距离依赖的核心动机
  - 掌握缩放点积注意力的数学推导、缩放因子作用及实现细节
  - 理解多头注意力通过子空间分工提升表达能力的机制与并行计算优势
  - 对比绝对位置编码（正弦/可学习）与相对位置编码的数学性质、外推能力及工程选型
  - 掌握注意力可视化的基本模式（句法树、共指、位置模式）及“注意力≠解释”的局限性
  - 能根据序列长度、外推需求、硬件约束选择合适的注意力变体（标准/FlashAttention/稀疏/线性/RoPE/ALiBi）
  concept_map:
