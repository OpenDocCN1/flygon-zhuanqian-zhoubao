  - 'no': 5
    name: 高性能拓扑图可视化实战 —— 10 万节点的工程化落地
    points:
    - '**为什么需要这个概念？**'
    - '- 真实业务场景（依赖分析、知识图谱、网络拓扑）常涉及 10 万+ 节点/边，原生 DOM/SVG 完全无法承载'
    - '- 需要端到端解决方案：布局计算卸载主线程、GPU 实例化渲染、视口裁剪、交互拾取、流畅动画，验证前四节技术选型的工程可行性'
    - '**核心定义**'
    - '- 双引擎兜底：WebGPU 优先（实例化/计算着色器），降级 Canvas 2D（`OffscreenCanvas` + `Path2D` 缓存），统一
      `IRenderEngine` 接口'
    - '- Web Worker 布局：力导向/层次/环形布局算法在 Worker 迭代，仅传回 `Float32Array` 位置增量，主线程解码渲染'
    - '- GPU 实例化渲染：节点几何体（圆/矩形/图标 Atlas UV）单份 Buffer，Instance Buffer 存 `vec2 position,
      float size, vec4 color, uint pickingId`'
    - '- 视口裁剪：CPU 端按相机矩阵反向变换视口矩形，结合四叉树/均匀网格空间索引快速筛选可见实例 ID 范围，仅上传可见子集'
    - '- 交互拾取：方案 A 颜色拾取（离屏渲染 `pickingId` 编码颜色 `readPixels`），方案 B CPU 端空间索引几何测试（矩形/圆形判断）'
    - '**关键性质**'
    - '- 数据驱动：Graph 数据 -> 算法 Worker -> 位置 Buffer -> 渲染引擎，单向数据流，状态单一源头'
    - '- 增量更新：布局迭代每帧仅计算位移 > 阈值的节点，Instance Buffer `subData` 部分更新，避免全量上传'
    - '- 语义缩放：`zoom < 0.1` 隐藏标签/简化边为线段，`zoom > 2` 展示节点详情/纹理图标，LOD 策略减少绘制几何复杂度'
    - '- 平滑动画：相机插值（`lerp`/`spring`）、节点位置插值（布局稳定前）、边路径曲线动画（`dashOffset` 渐变）'
    - '**典型例子**'
    - '- AntV G6 / Graphin 核心渲染管线：WebGL 实例化节点/边，Worker 布局，视口裁剪，拾取交互'
    - '- 自研引擎最小实现：`index.html` + `main.ts` (Engine/Worker 通信) + `render.wgsl` (WebGPU)
      / `render.ts` (Canvas2D) + `layout.worker.ts`'
    - '- 性能基准：10 万节点、20 万边，WebGPU 实例化 60 FPS，Canvas2D Offscreen 30 FPS，内存 < 200MB'
    - '**边界条件**'
    - '- 超大图（> 50 万节点）单帧实例数据上传带宽成瓶颈，需分层级渲染（簇/聚合节点）或服务端渲染瓦片'
    - '- 边交互复杂（弯曲/箭头/标签）实例化难度大，常单独渲染层或用 SDF 纹理在片元着色器程序化绘制'
    - '- 移动端 GPU 内存/带宽受限，需降级策略：减少实例属性精度（`float16`）、简化 Shader、限制最大实例数'
    - '- 无障碍访问：Canvas 无语义 DOM，需同步生成隐形 SVG/ARIA 树供屏幕阅读器遍历，或实现虚拟光标导航'
    - '- 四叉树/均匀网格空间索引在动态场景下的构建/更新开销对比，拓扑图视口裁剪选型建议'
