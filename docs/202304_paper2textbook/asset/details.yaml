  - │   ├── 通信协议：Flight 协议 / RSC Payload (JSON 格式、Promise 占位符、Client Component 引用)
    —— P004
  - │   ├── 核心机制：流式渲染 + Suspense、Server Actions ('use server')、Next.js App Router
