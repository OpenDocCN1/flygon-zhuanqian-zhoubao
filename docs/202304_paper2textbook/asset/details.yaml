    excerpts:
    - Prompt Engineering 基础范式：角色设定、任务拆解、输出约束、少样本示例
    - RPA 5 步法：手动操作 -> 步骤梳理 -> 模块开发 -> 运行测试 -> 修复 BUG
    - 四步调教法：角色设定 -> 结构化知识灌输 -> 逆向拆解热门文案 -> 无脑执行生产
    - 分块喂养与自我总结验证机制：防止 GPT ‘囫囵吞枣’式学习
    - 个人 Prompt 资产库：学习指令模板、知识结构组织模板、范文/案例库、修正指令模板
