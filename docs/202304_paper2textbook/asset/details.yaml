    name: 组件库无障碍适配 —— 基础设施层的合规兜底
    points:
    - '**为什么需要这个概念？**'
    - '- 业务开发若逐个页面手写 ARIA、焦点逻辑，重复造轮子且极易遗漏，导致合规率低、维护成本高'
    - '- 组件库作为基础设施，应内置无障碍最佳实践，让业务「开箱即合规」，仅需关注业务语义'
    - '- 设计系统需输出无障碍规范文档，统一交互模式（如对话框 ESC 关闭、焦点回归触发元素）'
    - '**核心定义**'
    - '- 按 WAI-ARIA Authoring Practices 1.2 (APG) 实现复合组件标准交互模式：Dialog、Menu、Combobox、Tabs、Tree、Listbox、Accordion、Tooltip
      等'
    - '- 基础组件合规清单：Button（原生按钮）、Link（真链接 vs 按钮）、Input（关联 Label/错误态）、Icon（装饰性 `aria-hidden="true"`）、Focus
      Trap 组合式函数'
    - '- 设计系统文档化：每个组件文档包含「键盘交互表」「ARIA 属性表」「屏幕阅读器预期播报」「WCAG 映射标准」'
    - '**关键性质**'
    - '- 复合组件交互模式标准化：如 `Combobox` 必须支持 `aria-controls` 关联列表、`aria-activedescendant`
      高亮项、上下键导航、Enter 确选、Esc 关闭、输入过滤'
    - '- 组合式函数封装通用逻辑：`useFocusTrap`、`useAriaLive`、`useKeyboardNavigation`、`useId`
      生成唯一 ID 关联控件'
    - '- 自动化回归：Storybook 集成 `@storybook/addon-a11y` (axe-core) 每次提交跑全组件库扫描，CI 阻断违规合并'
    - '**典型例子**'
    - '- `@enterprise/ui` 封装 `ElDialog` → `BaseDialog`：内置 `FocusTrap`、焦点回归、`aria-modal="true"`、`role="dialog"`、`aria-labelledby`
      关联标题，业务仅需 `v-model:visible` 与 `title` prop'
    - '- `ProTable` 列头排序按钮：`aria-sort="ascending/descending/none"`、`aria-label="按销售额升序排列"`，键盘可操作'
    - '**边界条件**'
    - '- 组件库无障碍不等于页面无障碍：页面级语义结构（Heading 层级、Landmark 区域）、业务逻辑（错误提示时机、复杂流程引导）仍需业务侧保障'
    - '- 老旧项目逐步迁移：优先替换高频复合组件（Dialog/Table/Form），低频组件后续补齐'
    - '- 定制主题时保证对比度：Design Tokens 输出时附带对比度校验报告，防止品牌色导致文本不可读'
    - '**素材溯源**'
    - '- 来源：`PbGkdX4YVoO02mxYlYKcbgASnSg.md`，大纲第19章第4节'
    - '- 角色：`method`，给出组件库层面的无障碍适配实施路径与自动化保障'
