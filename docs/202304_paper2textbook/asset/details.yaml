  - '    └── 硬骨头攻关：共享状态迁移/样式污染清理(Shadow DOM+Portal)/团队RACI矩阵对齐  —— P005'
  life_analogy:
  - 想象微前端架构是一个**大型商场的经营模式转型**：
  - '- **架构决策矩阵** = **商场选址可行性报告**：不是所有店铺都适合做商场（团队<10人/单仓库=街边小店，强行做商场=空置率高）；只有客流大(团队>10人)、品类多(多技术栈)、商家想自主装修(独立部署)时，才值得建商场'
  - '- **qiankun** = **全托管柜台模式**：商场方(基座)提供统一装修标准(沙箱)、安检隔离(样式隔离)、统一收银系统(通信机制)、预备库存(预加载)；商家(子应用)只需按规范入驻(导出生命周期)，退店时必须清空垃圾(unmount清理副作用)，否则影响下一任商家'
  - '- **Module Federation** = **品牌联营/共享供应链模式**：不再由商场统一装修，而是品牌方(Remote)自带货柜(模块)直接进场；核心优势是共享供应链(shared依赖单例)——所有品牌共用一套物流(React/Vue)、收银台(UI库)，避免重复建设；但需签严格合同(版本协商)，防止供应链版本冲突(版本地狱)'
  - '- **治理规范** = **商场管理条例**：统一招牌规范(路由前缀)、统一会员体系(监控SDK)、统一消防安检(CI门禁)、统一装修风格(组件库单例)；违规者拒绝开业(阻断合并)，但设立“特色品牌申请通道”(新依赖评审流程)保留创新空间'
  - '- **遗留系统改造** = **老旧商场分期改造不歇业**：不能推倒重来(大爆炸重写)，必须分区围挡(边界拆分)、夜间施工(灰度发布)、保留旧通道(版本化目录回滚)、统一水电接口(动态publicPath/Router
    base)；最难的是共享会员数据迁移(共享状态)和拆除违建广告牌(清理全局CSS污染)'
  summary:
  - concept: 架构决策矩阵
    desc: 基于团队规模、部署频率、技术栈异构度的量化评估模型，将架构决策从主观转为数据驱动，包含触发条件、收益成本权衡、可逆性评估
  - concept: qiankun 双沙箱
    desc: Snapshot沙箱(快照恢复/单实例)与Proxy沙箱(劫持window/多实例)解决JS隔离；strictStyleIsolation(Shadow
      DOM)与scoped CSS解决样式隔离
  - concept: qiankun 生命周期
    desc: bootstrap/mount/unmount三大钩子，子应用必须导出且unmount需彻底清理定时器、事件监听、全局变量防内存泄漏
  - concept: Module Federation 核心配置
    desc: exposes(导出)、remotes(引用)、shared(共享)三元组实现运行时动态模块联邦
  - concept: 运行时版本协商
    desc: Host与Remote协商shared依赖版本，满足requiredVersion且singleton:true时复用Host实例，否则下载Remote版本
  - concept: 依赖版本锁定治理
    desc: 基座dependencies锁定核心版本，子应用peerDependencies引用+externals排除，构建时不打包运行时由基座注入单例
  - concept: 路由分发协议
    desc: 基座持有全局路由表监听popstate，子应用声明式注册路由前缀，禁止子应用直接操作history API
  - concept: 遗留系统改造关键动作
    desc: 动态publicPath、libraryTarget:umd导出生命周期、剥离HTML模版、Router base动态化、Nginx灰度分流、版本化目录一键回滚
  - concept: 共享状态迁移难点
    desc: 全局Store拆分为基座GlobalState+子应用LocalState，引入initGlobalState或共享Store实例解决跨应用同步与持久化一致性
  - concept: 样式污染清理方案
    desc: 遗留项目全局CSS/!important顽疾，激进方案：子应用强制Shadow DOM + UI组件库Portal挂载修复弹层定位样式丢失
  exercises:
  - 'no': 1
    title: 微前端架构决策实战演练
    contents:
    - 某公司前端团队 15 人，维护 3 个业务仓库（Vue2 老系统、React 新业务、通用组件库），发布频次：老系统月发布，新业务周发布。现计划引入微前端。
    - 1. 根据架构决策矩阵，列出该场景满足的触发条件与不满足的条件
    - 2. 量化分析：若引入 qiankun，预估基建投入人天（沙箱调试、样式隔离适配、CI/CD 改造）；若不引入，维持现状的协作冲突成本、技术栈升级阻滞风险
    - 3. 设计一个最小化试点方案：仅将“新业务”作为子应用接入，老系统暂留基座，验证收益后再决策全量迁移
    - 回答问题：
    - '- 如果团队只有 6 人，但强烈要求用微前端“练手”，决策矩阵会如何拦截？核心反模式是什么？'
    - '- 如何设定“半年复盘校准”的具体指标（如：子应用数量、构建时长、部署频次、故障率）？'
  - 'no': 2
    title: qiankun 沙箱与样式隔离故障排查
    contents:
    - 生产环境接入 qiankun 子应用（React 18 + Ant Design 5）后，出现以下现象：
    - 1. 子应用卸载后，主应用控制台报错 `Cannot read property 'xxx' of undefined`，疑似全局变量残留
    - 2. 子应用的 Modal 弹窗样式错乱（定位偏移、遮罩层穿透），且主应用的 Toast 组件样式被子应用污染
    - 3. 切换子应用时白屏 2s，Network 面板显示 JS/CSS 资源重复下载
    - 排查任务：
    - 1. 分析现象 1 的原因：对比 Snapshot 与 Proxy 沙箱在 `unmount` 时的清理差异，代码层面应如何保证副作用销毁？
    - '2. 解决现象 2：`strictStyleIsolation: true` 导致 Modal 脱离 Shadow DOM 失效，给出两种修复方案（Portal
      挂载 / getTemplate 注入样式）并对比优劣'
    - '3. 解决现象 3：配置 `prefetch: ''all''` 与 `shared` 依赖去重的完整 webpack/qiankun 配置片段'
    - 回答问题：
    - '- 为什么不推荐在生产环境嵌套 qiankun（子应用再套 qiankun）？沙箱嵌套的原理冲突点在哪里？'
    - '- 子应用使用 CSS-in-JS (styled-components/emotion) 时，Shadow DOM 隔离会失效吗？如何配置？'
  - 'no': 3
    title: Module Federation 依赖共享与版本治理实战
    contents:
    - Host 应用（Vue 3.4 + Element Plus 2.7）消费 Remote 应用（Vue 3.3 + Element Plus 2.6）导出的
      `./TableComponent` 模块。
    - 1. 编写 Host 与 Remote 的 `moduleFederation` 配置，实现：Vue/Element Plus 作为 `shared`
      单例共享，Remote 暴露组件，Host 动态加载
    - 2. 场景模拟：Remote 升级 Element Plus 到 2.8（含 Breaking Change），Host 仍为 2.7。运行时版本协商会如何行为？`requiredVersion`、`singleton`、`eager`
      参数如何设置才能既保证 Host 稳定，又允许 Remote 独立升级？
    - 3. 类型安全：Remote 导出组件的 TypeScript 类型定义如何同步给 Host？对比 `@module-federation/typescript`
      自动生成 vs 手动维护 `@types/remote` 包的维护成本
    - 回答问题：
    - '- 如果 Remote 暴露的模块内部 `import { ref } from ''vue''`，而 Host 也 `import { ref }
      from ''vue''`，且均配置 `shared: { vue: { singleton: true } }`，运行时会加载几次 Vue？为什么？'
    - '- 循环依赖场景：Host 引用 Remote 的 `./A`，Remote 引用 Host 的 `./B`。Webpack 5 Module Federation
      会如何报错？架构上如何通过“抽离公共包”打破循环？'
  - 'no': 4
    title: 遗留系统微前端化改造全流程模拟
    contents:
    - '某单体 Vue 2 + Webpack 3 项目（20 万行代码，无测试，全局 CSS 严重污染，硬编码 `baseUrl: ''/app''`），计划拆分为基座
      + 3 个子应用（用户中心、报表中心、核心交易）。'
    - 1. 资产梳理阶段：编写一个 Node.js 脚本伪代码，扫描项目输出《改造评估报告》关键字段（入口文件、路由表、依赖图谱、全局变量 Top 10、CSS
      选择器污染度指标）
    - 2. 构建改造清单：列出 Webpack 3 升级到 Webpack 5 + Module Federation 所需的 10 项核心配置变更（重点：`publicPath`
      动态化、`libraryTarget`、外部化依赖、HTML 模版剥离）
    - 3. 灰度发布方案：设计 Nginx `split_clients` 配置，按 `uid` 哈希分流 10% 流量到新微前端架构，保持 `session`
      亲和性，监控哪 3 个核心指标（错误率、LCP、业务转化率）自动判定全量/回滚
    - 回答问题：
    - '- 共享状态迁移：原单体 Vuex Store 中 `user`、`permission`、`tagsView` 三个模块，如何拆分为基座 GlobalState
      与子应用 LocalState？跨子应用跳转时 `tagsView` 如何同步？'
    - '- 样式污染终极方案：子应用强制开启 `strictStyleIsolation: true` (Shadow DOM) 后，Element UI 的
      `el-select` 下拉框、 `el-date-picker` 面板渲染到 `body` 导致样式丢失。请给出完整的 `getTemplate` 修复代码模版，确保弹层样式隔离生效'
  units:
  - 'no': 1
    name: 架构决策矩阵 —— 量化评估何时需要微前端
    points:
    - '**为什么需要这个概念？**'
    - '- 微前端并非银弹，盲目引入会带来巨大的工程复杂度（沙箱隔离、样式隔离、通信机制、部署编排）'
    - '- 团队面临单体应用臃肿、多人协作冲突、技术栈升级受阻、独立部署需求等痛点时，需要理性的决策依据而非主观臆断'
    - '- 缺乏量化标准导致架构决策随意性大，事后难以复盘和归因'
    - '**核心定义**'
    - '- 一套基于团队规模、部署频率、技术栈异构度、业务耦合度等关键维度的量化评估模型'
    - '- 通过设定阈值（如团队>10人、多仓库独立发布、技术栈迁移过渡期），将架构决策从“拍脑袋”转变为“数据驱动”'
    - '**关键性质**'
    - '- 决策树结构：满足核心触发条件 → 评估收益成本比 → 产出 ADR（架构决策记录）'
    - '- 权衡维度：开发效率提升 vs 基建投入成本；运行时性能损耗 vs 部署自主权；技术栈自由度 vs 认知负荷增加'
    - '- 可逆性：决策矩阵应包含回退路径评估（如模块化单体作为过渡方案）'
    - '**典型例子**'
    - '- 场景A：5人团队、单仓库、周发布、纯Vue栈 → 矩阵判分：低收益/高成本 → 决策：继续单体，推行模块化治理'
    - '- 场景B：20人团队、多仓库、日发布、Vue/React共存、老系统迁移 → 矩阵判分：高收益/可控成本 → 决策：微前端（qiankun/Module
      Federation）'
    - '**边界条件**'
    - '- 仅因“想尝试新技术”而引入微前端属于技术债驱动，非业务驱动，矩阵会拦截此类伪需求'
    - '- 团队规模小但强行拆分，会导致“分布式单石”反模式：既有分布式复杂度，又无独立部署收益'
    - '- 矩阵需定期（如半年）复盘校准，随组织架构、业务阶段演进动态调整权重'
    sources:
    - paper: 20230418_043.md
      role: origin
    excerpts:
    - 引入决策树：团队>10人/多仓库/独立发布/技术栈迁移等触发条件，量化微前端收益与复杂度成本。
    - 架构决策矩阵：单体 vs 微前端——团队规模、部署频率、技术栈异构度量化评估
  - 'no': 2
    name: qiankun 深度解析 —— 基于单实例沙箱的子应用隔离方案
    points:
    - '**为什么需要这个概念？**'
    - '- 微前端核心难题：多个子应用共享同一个全局 window、document，如何实现 JS 变量隔离、样式隔离、生命周期管理？'
    - '- iframe 虽然隔离彻底，但体验差（白屏、刷新、通信复杂、SEO差），需要无感刷新的原生隔离方案'
    - '- 单实例模式下，主应用卸载子应用时必须彻底清理副作用（定时器、事件监听、全局变量污染）'
    - '**核心定义**'
    - '- qiankun 基于 single-spa 封装，提供“开箱即用”的微前端解决方案：JS 沙箱（Snapshot/Proxy）、样式隔离（scoped
      CSS/Shadow DOM）、预加载、通信机制'
    - '- 核心流程：registerMicroApps → start → 生命周期（bootstrap/mount/unmount） → 沙箱激活/卸载
      → 通信（initGlobalState）'
    - '**关键性质**'
    - '- 双沙箱模式：Snapshot 沙箱（低版本浏览器/单实例）通过快照恢复实现隔离；Proxy 沙箱（现代浏览器/多实例）通过劫持 window 实现多实例隔离'
    - '- 样式隔离：`strictStyleIsolation: true` 强制 Shadow DOM（样式完全隔离但 DOM 结构变化）；`experimentalStyleIsolation`
      通过 scoped CSS 编译实现软隔离'
    - '- 预加载机制：`prefetch: ''all''` 在浏览器空闲期预下载子应用静态资源，显著降低切换首屏加载延迟'
    - '- 主子通信：`initGlobalState` 基于发布订阅模式，数据变更触发 `onGlobalStateChange` 回调，注意避免循环更新'
    - '**典型例子**'
    - '- 遗留系统迁移：主应用 Vue 3，子应用 A 为 Vue 2 老系统，子应用 B 为 React 新业务，通过 qiankun 共存平滑迁移'
    - '- 权限隔离：子应用作为独立权限单元，主应用根据用户角色动态 `registerMicroApps`，实现菜单级路由分发'
    - '**边界条件**'
    - '- 嵌套微前端（子应用再套 qiankun）极易导致沙箱嵌套失效、样式穿透、通信链路混乱，生产环境强烈不推荐'
    - '- 子应用必须导出标准生命周期钩子（bootstrap/mount/unmount），且 `unmount` 必须彻底销毁副作用，否则内存泄漏'
    - '- 公共依赖（Vue/React/工具库）若未通过 `shared` 配置或外部引入去重，会导致多份实例加载，体积膨胀且状态不共享'
    - '- `strictStyleIsolation: true` 会导致 UI 组件库弹层（Modal、Dropdown、Tooltip）因脱离 Shadow
      DOM 而样式丢失或定位错乱，需配合 `getTemplate` 或 Portal 方案修复'
