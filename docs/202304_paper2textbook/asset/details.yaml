  - 'no': 3
    name: Module Federation —— 运行时依赖共享的原生联邦模块方案
    points:
    - '**为什么需要这个概念？**'
    - '- qiankun 属于运行时框架层面的隔离，存在性能开销（沙箱代理）、接入改造成本（生命周期适配）、样式隔离副作用'
    - '- Webpack 5 原生支持 Module Federation，将“模块共享”下沉到构建/运行时底层，实现更轻量、更原生的代码复用'
    - '- 解决“公共依赖重复打包”“版本冲突”“运行时同步更新”的工程化难题'
    - '**核心定义**'
    - '- Module Federation 允许一个构建产物（Host）在运行时动态加载另一个构建产物（Remote）导出的模块，并支持双向依赖共享'
    - '- 核心配置：`exposes`（导出模块）、`remotes`（引用远程模块）、`shared`（共享依赖版本/单例策略）'
    - '**关键性质**'
    - '- 运行时版本协商：Remote 与 Host 协商 `shared` 依赖版本，满足 `requiredVersion` 且符合 `singleton:
      true` 时复用 Host 实例，否则下载 Remote 版本'
    - '- 依赖共享策略：`eager: true` 预加载共享模块（同步可用，增加初始体积）；`eager: false` 按需异步加载（首屏快，首次用到时有延迟）'
    - '- 类型安全：需配合 `@module-federation/typescript` 或手动维护 `d.ts` 声明文件，实现跨应用 TypeScript
      类型提示'
    - '- 热更新：Remote 修改后重新构建，Host 刷新即可获取新版本（需处理缓存策略），支持联邦模块级热更新'
    - '**典型例子**'
    - '- 组件库共享：Host 与 Remote 共享 `react`、`react-dom`、`antd` 单例，避免重复加载 200KB+ 体积'
    - '- 业务模块联邦：微前端子应用作为 Remote 暴露 `./App` 入口，Host 通过 `import(''remote/App'')` 动态加载渲染，无需
      qiankun 沙箱开销'
    - '- 跨框架共享：Vue Host 消费 React Remote 组件（需桥接适配层），共享工具库 `lodash`、`dayjs` 等无框架依赖模块'
    - '**边界条件**'
    - '- 版本地狱：`shared` 依赖版本范围过宽（如 `^16.0.0`）导致运行时加载不兼容版本；版本过死（`16.14.0`）导致无法复用，需建立版本治理规范'
    - '- 循环依赖：Host 引用 Remote，Remote 又反向引用 Host 导出模块，构建报错或运行时死循环，架构上需单向依赖或抽离公共包'
    - '- CSS 隔离缺失：Module Federation 仅管 JS 模块，样式隔离需自行约定 CSS Modules、Scoped CSS 或 Shadow
      DOM 方案'
    - '- 运行时错误边界：Remote 加载失败（网络、版本不匹配、语法错误）会导致 Host 崩溃，必须包裹 `ErrorBoundary` 并实现降级
      UI（如 `fallback: <Loading />`）'
    sources:
    - paper: 20230418_043.md
      role: origin
    excerpts:
    - 详解 `exposes`/`remotes`/`shared` 配置、运行时版本匹配算法、联邦模块热更新、与 Vite/Rspack 生态集成。
    - Module Federation 原生联邦：运行时依赖共享、版本协商、暴露/消费远程模块
  - 'no': 4
    name: 微前端治理规范 —— 从“技术可行”到“工程可控”
    points:
    - '**为什么需要这个概念？**'
    - '- 技术选型（qiankun/MF）仅解决“能跑起来”，生产环境面临：依赖版本漂移、路由冲突、UI 规范不一、监控盲区、发布协作混乱'
    - '- 缺乏治理规范会导致“微前端变微烂端”：子应用随意升级 React 版本导致共享依赖失效；各自引入不同 UI 库导致体积翻倍；埋点 SDK 版本不一致数据错乱'
    - '- 需要建立类似后端微服务治理的“前端服务契约”'
    - '**核心定义**'
    - '- 一套覆盖公共依赖版本锁定、路由分发协议、通用组件库强制共享、统一监控 SDK 注入、发布流程规范的工程化治理体系'
    - '- 核心产出：《微前端接入规范文档》、基座提供的 `@enterprise/mf-core` 核心包、CI/CD 门禁检查脚本'
    - '**关键性质**'
    - '- 依赖版本锁定：基座在 `package.json` `dependencies` 锁定核心框架（React/Vue）、UI 库、工具库版本；子应用
      `peerDependencies` 引用，构建时 `externals` 排除，运行时由基座注入单例'
    - '- 路由分发协议：基座持有全局路由表，子应用声明式注册路由前缀（`/app1/*`），基座负责 `pushState` 监听与子应用 `mount/unmount`
      同步，禁止子应用直接操作 `history`'
    - '- 通用组件库策略：强制共享 `@enterprise/ui` 单例，禁止子应用私自引入 Ant Design/Arco Design 不同版本；组件库需导出
      `reset.css` 消除样式隔离副作用'
    - '- 监控埋点统一：基座统一初始化 Sentry/自建监控 SDK，暴露 `reportError`、`trackEvent` 给子应用，确保 TraceID
      透传、用户上下文一致、SourceMap 统一上传'
    - '**典型例子**'
    - '- 依赖治理 CI 门禁：子应用 MR 流水线强制运行 `mf-dep-check`，检测 `peerDependencies` 与基座 `dependencies`
      版本范围兼容性，不通过阻断合并'
    - '- 发布编排：基座维护 `manifest.json` 记录各子应用版本与入口 URL，发布时仅更新对应子应用条目，支持金丝雀灰度（`manifest.canary`）与一键回滚'
    - '**边界条件**'
    - '- 过度治理扼杀自主性：禁止子应用使用任何新库会阻碍技术演进，需设立“申请引入新依赖”评审流程（如安全审查、体积评估、兼容性测试）'
    - '- 基座成为单点故障：基座挂了所有子应用挂，基座升级需全量回归。需建立基座“极简核心、插件化扩展”架构，降低变更频率'
    - '- 遗留系统接入成本高：老应用无法立即满足规范（如无法拆分构建产物、硬编码路由），需提供“兼容模式”过渡方案（如 iframe 兜底、适配器模式包装）'
    sources:
    - paper: 20230418_043.md
      role: origin
    excerpts:
    - 制定《微前端接入规范》：基座提供 React/Vue 单例、路由基座分发、UI 组件库强制共享、统一监控 SDK 注入。
    - 微前端治理规范：公共依赖版本锁定、路由分发协议、通用组件库版本策略、监控埋点统一
  - 'no': 5
    name: 遗留系统微前端化改造 —— 从资产梳理到灰度发布的全流程实战
    points:
    - '**为什么需要这个概念？**'
    - '- 绝大多数微前端落地不是绿地新建，而是面对几十万行遗留代码、耦合严重、无测试覆盖、构建脚本老旧的存量系统'
    - '- “大爆炸式”重写风险极高（业务停摆、Bug 暴雷、人员疲劳），必须采用增量、可逆、可观测的演进式改造策略'
    - '- 改造过程本质是“换引擎不停机”，涉及构建产物适配、路由劫持、全局变量清理、部署架构变更等硬骨头'
    - '**核心定义**'
    - '- 以“微前端接入规范”为目标态，从资产梳理、边界拆分、构建改造、基座搭建、集成联调、灰度发布、全量切换、回滚预案的标准化交付流程'
    - '**关键性质**'
    - '- 资产梳理：自动化扫描代码仓库（入口文件、路由配置、依赖图谱、全局变量、CSS 污染源），产出《微前端化改造评估报告》'
    - '- 边界拆分：按业务域/团队所有权/变更频率划分子应用边界，提取共享内核（Auth、Menu、UI、Request）下沉基座或公共包'
    - '- 构建改造关键动作：修改 `publicPath` 为动态注入（`__webpack_public_path__` / `import.meta.env.BASE_URL`）、配置
      `libraryTarget: ''umd''` 导出生命周期钩子、剥离 HTML 模版由基座注入'
    - '- 路由适配：子应用 Router `base` 设为动态变量（基座下发），History 模式需基座拦截 `popstate` 同步触发子应用路由变更'
    - '- 灰度发布策略：Nginx 流量分发（`split_clients` 或 Lua 脚本）按比例导入新旧版本入口 HTML，保持 Cookie/Session
      一致性，监控错误率/业务指标自动全量/回滚'
    - '- 回滚预案：保留旧版本静态资源不删除（版本化目录 `/v1.2.3/`），基座 `manifest.json` 一键切回旧版本入口，RTO < 5
      分钟'
    - '**典型例子**'
    - '- 老旧 Vue 2 + Webpack 3 系统：引入 `webpack-micro-frontend-plugin` 适配生命周期、升级 Webpack
      5 开启 Module Federation 共享依赖、CSS 迁移至 CSS Modules 解决样式污染'
    - '- 单体 React 应用拆分：提取“用户中心”“报表中心”两高频变更模块为子应用，核心“交易流程”留在基座，实现核心稳定/边缘敏捷'
    - '**边界条件**'
    - '- 共享状态迁移最难：全局 Redux/Vuex Store 拆分为基座 GlobalState + 子应用 LocalState，涉及跨应用状态同步、持久化一致性，需引入
      `initGlobalState` 或共享 Redux Store 实例'
    - '- 样式污染清理是无底洞：遗留项目大量全局 CSS、!important、元素选择器，建议激进方案：子应用强制开启 `strictStyleIsolation:
      true` (Shadow DOM) + UI 组件库 Portal 挂载修复弹层'
    - '- 团队认知对齐：后端/运维/测试/产品需同步理解微前端边界（谁负责基座？谁负责子应用？接口契约谁定？），建立 RACI 矩阵避免扯皮'
    sources:
    - paper: 20230418_043.md
      role: origin
    excerpts:
    - 梳理存量应用资产、拆分子应用边界、改造构建产物适配基座、配置 Nginx 反向代理、金丝雀发布与一键回滚演练。
    - 实战：遗留系统微前端化改造全流程——从资产梳理到灰度发布与回滚预案
