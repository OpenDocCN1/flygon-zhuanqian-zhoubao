  - 'no': 3
    name: UI 组件库二次封装与请求层统一 —— 造好“手中的刀”，再砍“业务的木”
    points:
    - '**为什么需要这个概念？**'
    - '- 直接使用 Ant Design/Arco Design 等原生组件库，会导致业务代码耦合第三方 API，升级组件库版本时全量改动；且无法统一封装企业级通用逻辑（如表格内置权限列、表单自动校验、弹窗统一销毁、国际化适配）。'
    - '- 网络请求层缺乏统一封装，会导致每个 API 调用分散处理 Loading、Token 刷新、错误码映射、取消重复请求，极难维护和做全链路监控。'
    - '**核心定义**'
    - '- **二次封装组件库 (`@enterprise/ui`)**：在基础组件库之上，封装业务通用高阶组件（`ProTable`、`ProForm`、`ProCard`、`ProModal`）、设计令牌主题包、图标规范、无障碍属性注入，对外暴露稳定的企业级
      API。'
    - '- **统一请求层 (`@enterprise/request`)**：基于 Axios/Ky/Fetch 封装，内置：请求/响应拦截器、TypeScript
      泛型响应体、自动错误码弹窗/跳转登录、请求去重、自动取消上一请求、Mock/真实环境切换、OpenAPI 类型自动生成集成。'
    - '**关键性质**'
    - '- **API 稳定性契约**：二次封装层吸收底层组件库 Breaking Change，业务侧仅升级 `@enterprise/ui` 版本即可平滑过渡。'
    - '- **Schema 驱动能力**：`ProTable`/`ProForm` 支持 JSON Schema 配置化渲染，配合低代码平台实现“零代码生成
      CRUD 页面”。'
    - '- **类型安全全链路**：请求层通过 `openapi-typescript`/`orval` 从后端 Swagger 生成 TS 类型，实现“后端改字段
      -> 前端编译报错 -> 定位修改”的强类型保护。'
    - '**典型例子**'
    - '- **ProTable 封装**：内置列宽拖拽持久化、多选/单选/展开行、工具栏（刷新/密度/列设置/导出）、服务端分页/排序/过滤参数标准化映射、行内编辑/详情弹窗插槽。'
    - '- **请求层 Token 无感刷新**：401 拦截 -> 判断是否正在刷新 -> 是则入队等待 -> 否则调用刷新接口 -> 更新存储 -> 重放原请求队列
      -> 释放等待者。'
    - '**边界条件**'
    - '- **过度封装反模式**：不要把所有 Ant Design 组件都包一层，仅封装“高频使用+含业务逻辑+需扩展”的组件（如 Table/Form/Modal/Select），简单组件（Button/Input/Tag）直接透传或极薄包装。'
    - '- **请求层不可做业务强耦合**：`@enterprise/request` 只处理通用横切关注点（认证、错误、日志、类型），具体业务参数拼接、数据转换应在
      API 服务层（`/api/user.ts`）处理。'
    - '- **版本升级风险**：基础组件库大版本升级（如 Antd v4 -> v5）需建立专项迁移小组，先在 `@enterprise/ui` 内部适配，产出迁移指南与
      Codemod 脚本，再通知业务升级。'
