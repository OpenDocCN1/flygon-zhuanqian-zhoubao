  life_analogy:
  - 想象 CSS 布局系统是一个**建筑工地的空间规划体系**：
  - '- **Flexbox** = **一维流水线传送带**：只负责‘单行/单列’上的物品排队、对齐、分发空间（justify-content）、伸缩大小（flex-grow/shrink）'
  - '- **Grid** = **二维楼层规划图**：同时规划‘行’与‘列’，把房间（区域）精准锚定在网格线交叉点，支持跨行跨列、区域重叠、语义化命名区域'
  - '- **CSS 变量/设计令牌** = **装修材料清单总表**：颜色、间距、字体统一定义在‘总表’（:root），各施工队（组件）引用‘色号’而非实物；换品牌只需换‘总表’，全楼联动'
  - '- **原子化 CSS** = **预制构件库**：不再现场砌墙（写 CSS），而是搬来标准砖块——‘红砖’、‘窗框’、‘门把手’（p-4、rounded、flex），在模板上拼装，用多少造多少'
  - '- **BEM / CSS Modules / @layer** = **施工规范与分区管理**：BEM 给每块砖贴唯一标签防混用；CSS Modules
    给每栋楼发独立编号防串楼；@layer 划分‘地基层、主体层、装饰层’显式优先级，避免‘后盖的墙压倒地基’'
  - '- **企业级样式系统双包** = **‘材料厂’+‘构件厂’分离交付**：ui-theme 厂生产标准材料清单（令牌/变量），ui-components
    厂按图纸组装构件；业务方像买宜家家具一样组装，想换风格只找材料厂换清单'
  - '- **跨境支付实战** = **‘桥梁建造’工程**：Nobepay/Depay 是两座不同收费标准的桥，USDT 是通用货币钢材，欧易是钢材厂，KYC
    是通行证，卡段是桥面材质，免税州地址是导航坐标，IP 节点是车辆牌照，三者一致才能顺利过桥缴费'
  - '- **个人非标品闲鱼变现** = **‘人设即信任、时间即杠杆’的资产化经营**：二十年风格积累 = 天然买家池；非标品随时间增值 = 穿着即投资；认知差套利
    = 低买高卖的信息红利'
  summary:
  - concept: Flexbox
    desc: 一维布局引擎，主轴/交叉轴控制排列对齐与空间分配，适合导航栏、卡片内部等线性场景
  - concept: Grid
    desc: 二维布局引擎，显式/隐式网格轨道精准定位区域，适合仪表盘、整页布局等区域划分场景
  - concept: 布局决策矩阵
    desc: 一维分布选 Flex、二维区域选 Grid、宏观 Grid 嵌套微观 Flex 为最佳实践
  - concept: CSS 变量
    desc: 运行时动态、可继承层叠的自定义属性，var() 引用支持回退值，是主题切换的原子单位
  - concept: 设计令牌
    desc: 设计决策的原子化、平台无关存储（色值/间距/字体/圆角/阴影/动效），单一事实来源分发多端
  - concept: light-dark()
    desc: 根据 color-scheme 自动切换亮/暗色值，零 JS 实现跟随系统偏好
  - concept: color-mix()
    desc: 在指定色空间混合两色，动态生成悬浮/禁用/透明派生色，减少令牌数量
  - concept: '@property'
    desc: 注册 CSS 变量语法类型（<color>/<length>）、初始值、继承性，启用类型检查与插值动画
  - concept: 原子化 CSS
    desc: 单一职责类名组合构建 UI，扫描源码按需生成，产物体积与用量正相关
  - concept: UnoCSS
    desc: 即时原子化引擎，基于规则匹配无需构建依赖图，启动极快，规则完全可编程
  - concept: 任意值
    desc: 方括号语法 w-[123px] bg-[#abc] 即时生成任意数值/颜色/函数，逃逸设计令牌约束
  - concept: 变体
    desc: 'hover: dark: md: 等前缀组合，编译期展开为选择器链，支持任意嵌套'
  - concept: BEM
    desc: Block__Element--Modifier 扁平化命名约定，选择器权重恒定 (0,0,1,0)，消除嵌套耦合
  - concept: CSS Modules
    desc: 构建时哈希化类名实现物理隔离，:global()/:local()/composition 控制作用域与复用
  - concept: '@layer'
    desc: 显式声明层叠优先级顺序，后声明层胜过先声明层，与选择器权重解耦，解决第三方样式覆盖痛点
  - concept: Stylelint
    desc: 强制执行命名规范、禁止魔法数值、限制嵌套深度、排序属性顺序的 CSS Lint 工程化工具
  - concept: 双包架构
    desc: ui-theme (令牌/变量/预设) + ui-components (组件实现) 解耦设计与实现，版本强绑定交付
  - concept: Style Dictionary
    desc: 令牌转换工具：Figma/JSON 源 -> 输出 CSS Variables、TS Types、UnoCSS Preset 等多端产物
  - concept: 主题切换
    desc: 数据属性 [data-theme] 切换 CSS 变量作用域，利用浏览器原生层叠实现零运行时瞬间切换
  - concept: Nobepay/Depay 成本模型
    desc: 月消费<60U 选 Nobepay（零月费），>60U 选 Depay（低手续费），ChatGPT Plus 场景选 Nobepay 更划算
  - concept: USDT 充值兑换法
    desc: 规避 Nobepay 人民币直充 500 元起充不可提现限制，欧易 CEX 买 USDT -> 链上提币至 Nobepay 充值地址
  - concept: 卡段风控策略
    desc: 优先选 556766 卡段（起充 30$），规避 531847 等低起充卡段因用户挤占导致的风控拒付
  - concept: 免税州账单地址
    desc: 利用美五免税州（俄勒冈/阿拉斯加/特拉华/蒙大拿/新罕布什尔）生成虚拟地址，配合同地区 IP 节点通过 AVS 验证
  - concept: 首次开通成本锚定
    desc: 购买 36 USDT 花费 248.05 CNY，扣除各项手续费实付 23.6 USDT (~163 CNY)，余额 12.4 USDT 锁定卡内
  - concept: 续费边际成本
    desc: 扣除 1U 开卡费，考虑欧易提币费波动，预测下次续费 21-22 USDT (~144-152 CNY)
  - concept: 支付风控三要素
    desc: 高质量原生 IP 节点 + 账单地址与节点 IP 地理强一致 + 卡段 BIN 码通过风控白名单（如 556766）
  - concept: 欧易 L3 认证解封
    desc: 触发风控冻结 7 天，补全 L3 实名认证并申诉，约 3 分钟自动/人工解封恢复提币权限
  - concept: 风格护城河
    desc: 个人二十年固化穿搭风格 -> 博客微博期沉淀精准粉丝 -> 闲鱼挂链即秒拍 -> 高信任/低沟通/高溢价
  - concept: 非标品时间杠杆
    desc: 古董绣片/孤品设计师作品随时间增值（不可再生稀缺性），对比奢侈品标品二手折损率超 90%
  - concept: 认知套利
    desc: 卖方不懂行情低价出 -> 买方用外挂/行情数据库秒拍低价 -> 高价转手，单件利润达月薪级别
  - concept: 延迟购买法
    desc: 购物车/存图 -> 冷静期(数周/月) -> 复盘‘仍强烈想要’ -> 购买/删除，利用时间成本过滤冲动消费
  - concept: 佛系单平台运营
    desc: 不讲价/不发视频/仅按平台提示擦亮 -> 依靠货品自带稀缺流量成交，核心杠杆在供给端（选品+粉丝积累）而非运营端
  exercises:
  - 'no': 1
    title: 布局引擎选型与手写核心代码
    contents:
    - 场景：实现一个仪表盘页面，包含顶部导航栏、左侧固定宽度侧边栏、右侧自适应内容区（内含响应式卡片网格）、底部版权栏。
    - 1. 判断宏观页面骨架（Header/Sidebar/Content/Footer）应使用 Flex 还是 Grid？给出关键 CSS 片段。
    - 2. 判断内容区内部的响应式卡片网格（最小 280px，自动换行填满）应使用 Flex 还是 Grid？给出关键 CSS 片段。
    - 3. 导航栏内部：Logo 左侧、菜单居中、用户头像右侧，菜单项需支持横向溢出滚动。请写出 Flex 关键属性。
    - 思考题：
    - '- 如果侧边栏需要支持折叠动画（宽度 240px <-> 64px），Grid 与 Flex 在过渡动画表现上有何差异？'
    - '- 为什么 Grid 容器的 `gap` 在百分比轨道下可能表现不如预期？'
  - 'no': 2
    title: 设计令牌与主题切换工程化实战
    contents:
    - 假设你要为组件库实现‘亮/暗双模式 + 多品牌色’的主题系统，要求：
    - 1. 定义一套设计令牌 JSON 结构，包含色彩（主色/成功/警告/错误）、间距、圆角、字体大小，且每个色彩令牌需包含 light/dark 两套值。
    - 2. 编写 Style Dictionary 配置片段，输出：CSS 变量文件（含 light/dark 两套变量集）、TypeScript 类型定义、UnoCSS
      预设对象。
    - 3. 编写 CSS 变量文件的核心结构：如何利用 `[data-theme='light']` 与 `[data-theme='dark']` 选择器切换变量集？如何用
      `light-dark()` 简化不需要品牌定制的中性色？
    - 4. 组件 Button 内部如何消费这些变量？展示 CSS Modules + CSS 变量的写法，并暴露 `--btn-height` 等组件级变量供外部微调。
    - 思考题：
    - '- 为什么 CSS 变量不能直接用在 `@media (min-width: var(--bp-md))` 中？工程上如何解决断点令牌的双写问题？'
    - '- 如果业务方只想覆盖主色而保留其它令牌，双包架构下应如何指导其正确操作？'
  - 'no': 3
    title: 原子化 CSS 扫描边界与架构治理
    contents:
    - 项目接入 UnoCSS，发现以下问题，请给出排查方案与配置修正：
    - 1. 动态拼接类名 `class={clsx('btn', isPrimary && 'btn-primary')}` 导致 `btn-primary`
      类未生成。解释 UnoCSS 扫描原理为何会遗漏，并给出两种修正方案（safelist 与提取字面量）。
    - 2. 团队成员大量使用任意值 `w-[123px]` `mt-[-7px]` 导致设计令牌约束失效。请设计一套 Stylelint/UnoCSS 自定义规则策略：允许任意值仅用于‘无法用令牌表达’的场景（如
      calc 表达式、精确像素对齐），其余强制走令牌类名。
    - 3. 旧版浏览器（不支持 `:where()`）下 UnoCSS 默认输出的零权重选择器失效。请给出降级配置方案（`uno.config.ts` 中 `layer`
      与 `preflight` 设置）。
    - 4. SSR 场景下首屏出现 FOUC（样式闪烁）。解释原因并给出关键代码：如何在服务端渲染时内联关键 CSS？
    - 思考题：
    - '- 对比 `@layer utilities` 与 `@layer components` 在引入顺序上的优先级差异，为什么建议将第三方库重置样式放入
      `@layer reset`？'
  - 'no': 4
    title: 企业级 UI 组件库样式系统双包发布模拟
    contents:
    - 模拟从零发布 `@my-org/ui-theme@1.0.0` 与 `@my-org/ui-components@1.0.0` 的完整流程：
    - 1. 编写 `pnpm-workspace.yaml` 与两个包的 `package.json` 关键字段（name、version、main/module/types/exports、sideEffects、peerDependencies）。
    - 2. 设计 GitHub Actions 工作流：`tokens:build` -> `theme:publish` -> `components:build`
      -> `components:publish`，要求版本号强绑定（theme 版本变更必须触发 components 重新发布）。
    - 3. 业务项目消费时，如何配置 `package.json` 实现 `ui-theme` 的 CSS 变量自动注入（如 Vite 插件或 PostCSS
      插件），且支持 Tree-shaking 仅打包用到的组件样式？
    - 4. 当设计师在 Figma 中更新主色 `#1890ff` -> `#0052d9` 时，描述从 Figma 到业务项目生效的完整自动化链路（Tokens
      Studio -> CI -> npm -> 业务依赖更新 -> 重新构建）。
    - 思考题：
    - '- 如果 `ui-components` 内部组件样式依赖 `ui-theme` 的某个 CSS 变量（如 `--radius-base`），而业务方覆盖了该变量但未升级
      `ui-components`，可能出现什么样式异常？如何通过版本锁定策略预防？'
