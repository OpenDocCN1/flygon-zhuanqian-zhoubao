    name: 个人成长操作系统 —— 用OKR驾驭不确定的五年
    points:
    - '**为什么需要这个概念？**'
    - '- 职业发展周期长（5-10年），靠“冲动/运气/被动机会”驱动极不稳定'
    - '- 年度目标常年“年初立Flag、年底躺平”，缺乏季度复盘、月度拆解、周度执行的落地机制'
    - '- 需要一套“个人操作系统”将模糊愿景转化为可执行、可度量、可迭代的工程化流程'
    - '**核心定义**'
    - '- 输出《技术成长五年规划》：五年愿景 → 年度主题 → 季度OKR（O：定性目标，KR：量化关键结果） → 月度执行计划 → 周度复盘模版 → 年度复盘报告'
    - '- 核心工件：季度OKR设定会、周度复盘会（回顾完成度/复盘得失/调整下周计划）、年度复盘报告（含技术资产盘点、影响力资产盘点、财务资产盘点）'
    - '**关键性质**'
    - '- 闭环性：Plan（规划）→ Do（执行）→ Check（复盘）→ Act（调整）的PDCA微循环嵌套宏循环'
    - '- 聚焦性：OKR强制“少即是多”，每季度最多3个O，每个O最多3-5个KR，防止贪多嚼不烂'
    - '- 抗脆弱性：预设“黑天鹅缓冲带”（如预留20%时间应对突发项目/家庭变故），允许目标动态调整而非僵化考核'
    - '**典型例子**'
    - '- 五年愿景：成为“前端工程化/智能化方向”的领域专家并拥有独立变现产品'
    - '- 年度主题（第1年）：“夯实工程化底座，打造个人影响力极简模型”'
    - '- Q1 OKR：O1 搭建企业级脚手架开源项目 → KR1 核心功能上线、KR2 Star破100、KR3 输出3篇配套实战文章'
