  life_analogy:
  - 想象前端测试体系是**汽车出厂前的质检流水线**：
  - '- **单元测试** = **零部件台架测试**：发动机、刹车片、芯片单独在实验室极限压测（毫秒级、隔离环境、覆盖率高），保证每个零件合格'
  - '- **集成测试** = **底盘/动力总成联调**：发动机+变速箱+传动轴组装在一起跑台架，验证接口匹配、协作逻辑（保留真实依赖、中等速度）'
  - '- **E2E 测试** = **整车试驾/碰撞测试**：真实路况/赛道/极端天气下整车跑完全程，验证从启动到停车的全链路体验（真实环境、慢、贵、但置信度最高）'
  - '- **Vitest** = **高精度自动化台架**：兼容旧设备(Jest)、即插即用(Vite配置)、并行多工位、自动出报告'
  - '- **Playwright** = **全天候无人驾驶测试车**：跨品牌(Chromium/Firefox/WebKit)、自动避障(自动等待)、远程遥控(网络拦截)、自动拍照对比(视觉回归)'
  - '- **CI/CD 流水线** = **出厂合格证自动签发机**：任一工位不合格即锁死流水线、自动通知工程师、生成可追溯质检档案、贴上合格徽章才能发运'
  - 想象 AI 提示词工程是**大型会议的提问环节**：
  - '- **角色设定** = 你手里的**身份工牌**（谷歌广告专家/跨境运营总监）'
  - '- **任务定义** = 你要解决的**议程议题**（写10条符合规范的广告标题）'
  - '- **输出约束** = **会议规则**（英文输出、字数限制、引人入胜）'
  - '- **少样本案例** = **往期会议纪要**，让模型学会格式与风格'
  - '- 就像主持人根据议题动态分配发言时间，结构化 Prompt 让模型按规范输出高质量内容'
  summary:
  - concept: 测试金字塔/奖杯模型
    desc: 单测70%/集成20%/E2E10% 的资源分配黄金比例，避免倒金字塔与冰激凌筒反模式
  - concept: Vitest
    desc: 基于 Vite 的下一代测试运行器，原生 ESM/TS，零配置复用 Vite 生态，API 兼容 Jest
  - concept: vi.mock / vi.spyOn
    desc: 模块级/函数级 Mock 核心 API，支持定时器模拟、ESM 虚拟模块、hoisted 变量提升
  - concept: 覆盖率阈值
    desc: CI 中设定 lines/branches/functions/statements 80% 门禁，未达标直接阻断流水线
  - concept: Vue Test Utils (VTU)
    desc: 官方组件测试库，提供 mount(全量) 与 shallowMount(浅渲染存根子组件) 两种挂载策略
  - concept: 响应式解包
    desc: wrapper.vm 自动解包 ref/reactive，断言时直接访问值，需配合 await nextTick/flushPromises 处理异步更新
  - concept: Playwright
    desc: 微软跨浏览器 E2E 框架，单进程多 Context 隔离，原生 TypeScript，自动等待与语义定位器
  - concept: Page Object 模式
    desc: 将页面选择器与业务动作封装为类，测试用例仅调用 login()/gotoDashboard() 等高层语义
  - concept: 网络拦截 page.route
    desc: 拦截修改网络请求，模拟后端异常/延迟/限流，实现前端独立于后端的稳定测试
  - concept: 视觉回归测试
    desc: 截图像素级对比 baseline，阈值容忍抗锯齿差异，需按 OS/浏览器/DPR 分目录管理基线图
  - concept: CI/CD 质量红线
    desc: 强制执行 Lint/TypeCheck/单测/构建/E2E 全链路，任一失败阻断合并部署，制品上传与失败即时通知
  - concept: Monorepo 受影响测试
    desc: 利用 turbo affected 或 paths-ignore 仅运行变更包相关测试，大幅缩短流水线耗时
  - concept: 结构化提示词范式
    desc: 角色+任务+约束三要素标准化 Prompt，将‘玄学咒语’转化为可复用、可版本化的工程资产
  - concept: 谷歌广告文案生成
    desc: 指定模型扮演资深广告文案，输出符合 RSA 字数限制的标题与描述组合，强调合规性与说服力并重
  - concept: ChatGPT+RPA 自动化
    desc: 将生成能力封装为 RPA 流程，实现批量文案产出、数据采集、跨平台分发的无人值守作业
  - concept: Prompt 库资产化
    desc: 沉淀学习指令、知识结构、范文库、修正指令四大模块，构建个人/团队核心生产力护城河
