    title: 海外商标投资组合构建推演
    contents:
    - 背景：拟投入 5 万元人民币构建海外商标投资组合，目标年化 ROI ≥ 200%。
    - 任务：
    - 1. **国家选择**：基于‘贸易强国+平台主战场+政策红利+产业优势’四维度，从核心层（美/日/欧/英/加）、机会层（东南亚 6 国/沙特/阿联酋）、观察层中选择
      5 个目标国家，说明理由。
    - 2. **类目布局**：核心仓覆盖 3C电子/服装鞋帽/玩具健身/家具厨房（权重 70%），蓝海仓布局 电子烟/特色食品/宠物用品（权重 30%），列出具体尼斯分类号。
    - 3. **命名策略**：使用 Namelix 生成 50 个候选名，结合 ChatGPT 校验‘短域名可用性/发音友好/行业语义关联/核心小类覆盖/跨文化无负面’，最终敲定
      10 个核心品牌名。
    - 4. **定价与变现**：设定底价挂牌（鱼爪/麦汇），授权分销商代售保底价，买家画像定价（大卖溢价 50%+ / 中小卖标价 / 蓝海高价挂单），目标持有周期
      ≤ 1 年。
    - 风控：单个商标注册成本 ≤ 8000 元，总投入不超预算，预留 20% 资金应对驳回/异议。
