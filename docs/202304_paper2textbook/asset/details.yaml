  - 'no': 3
    name: 内容安全策略 (CSP 3) —— 从策略编写到灰度部署的工程化实践
    points:
    - 解构 script-src 指令：'self'、域名白名单、'nonce-{random}'、'sha256-{hash}'、'strict-dynamic'
      语义与优先级
    - Nonce 方案工程化：服务端每次渲染生成强随机数、模板引擎自动注入、SSR/CSR 同构适配
    - Strict-dynamic 信任链机制：受信脚本动态创建的子脚本自动继承信任、忽略后续域名白名单、适配动态加载场景
    - 哈希值兜底策略：内联脚本/事件处理器计算 SHA256、构建版本时自动注入、CSP 报告收集未授权哈希
    - Report-Only 灰度发布流水线：违规上报聚合分析、误拦白名单机制、分阶段收敛策略至 Enforce 模式
    sources:
    - paper: 20230418_042.md
      role: origin
    excerpts:
    - 编写严格 CSP 策略：`script-src 'nonce-xxx' 'strict-dynamic'`、`report-uri` 收集违规日志、通过
      Report-Only 模式灰度上线。
