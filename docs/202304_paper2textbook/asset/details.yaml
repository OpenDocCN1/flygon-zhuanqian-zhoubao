    name: 生产环境落地：流式响应、语义缓存与成本控制
    points:
    - '**为什么需要这个概念？**'
    - '- RAG 从 Demo 走向生产，面临首包延迟高、并发吞吐低、Token 成本不可控、缺乏 SLA 保障等工程挑战'
    - '- 用户体验要求流式打字机输出，但 RAG 涉及多阶段串行（重写->检索->重排->生成），首包延迟易超 3-5 秒'
    - '- 大量重复/相似查询（如 FAQ）重复消耗昂贵的 LLM Token 与检索资源，需缓存机制'
    - '**核心定义**'
    - '- 流式响应：Generator 采用流式输出，前端 SSE/WebSocket 渲染；上游检索/重排阶段需支持异步流式传递中间结果（如展示检索中、引用文档流式返回）'
    - '- 语义缓存：基于查询 Embedding 相似度匹配历史问答，命中则直接返回缓存答案，未命中则执行全流程并入库'
    - '- 成本控制：嵌入模型量化（INT8/ONNX）、检索并发扩容、模型级联（小模型处理简单查询/大模型处理复杂查询）、Prompt 压缩'
    - '**关键性质**'
    - '- 流式架构：LangChain/LangGraph `astream` / `astream_events` 支持链式流式；需解决中间步骤（如工具调用）的流式化展示'
    - '- 语义缓存键设计：Query Embedding + 业务上下文标签（如用户分群、Prompt 版本），阈值典型 0.95-0.98，需防缓存污染（错误答案入库）'
    - '- 缓存失效策略：知识库更新触发向量失效、TTL 过期、人工标注负反馈强制失效'
    - '- 成本核算：建立 Token 成本模型（Embedding + LLM Input/Output + Reranker），接入 FinOps 看板'
    - '**典型例子**'
    - '- 客服机器人：80% FAQ 命中语义缓存，P99 延迟 < 200ms，成本降低 70%'
    - '- 内网知识库：嵌入模型部署在 CPU 推理服务（BGE-small INT8），仅复杂查询调用 GPU 大模型'
    - '- 流式 UX：用户提问 -> 即时显示“正在检索相关文档...” -> 文档标题流式出现 -> 答案流式生成 -> 引用溯源标注'
    - '**边界条件**'
    - '- 语义缓存不适用于强时效性（实时股价）、强个性化（我的订单）、高风险（医疗诊断）场景'
    - '- 流式输出增加前端实现复杂度，需处理中断、重试、回车换行渲染异常'
    - '- 量化嵌入模型可能导致召回率下降 1-3%，需离线评测验收后上线'
    sources:
