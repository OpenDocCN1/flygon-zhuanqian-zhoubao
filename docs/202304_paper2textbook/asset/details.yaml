    excerpts:
    - 解决Token流式输出、语义缓存命中、嵌入模型量化、检索并发扩容等工程化挑战，建立SLA保障与成本治理体系。
    - 提炼生产级应用必备的非功能性需求：流式输出、异步编排、可观测性、版本管理与回滚，给出基于 LangChain/LangGraph 的分层架构参考实现蓝图。
  - 'no': 9
    name: RAG 失败模式诊断与对策 —— 从症状到根因的“急诊手册”
    points:
    - '**为什么需要这个概念？**'
    - '- RAG 线上故障常表现为“答非所问”、“胡编乱造”、“找不到资料”，但根因可能在解析、分块、嵌入、检索、重排、生成任一环节'
    - '- 缺乏系统性诊断框架，排查依赖经验“玄学”，MTTR（平均修复时间）过长'
    - '- 需要建立标准化故障树，将现象映射到模块、指标、工具、动作，实现快速定位与自动化兜底'
    - '**核心定义**'
    - '- 四大故障类：未命中、噪声干扰、生成幻觉、格式错误'
    - '- 诊断树：现象 -> 定责模块 -> 关键指标异常 -> 根因假设 -> 验证动作 -> 缓解方案'
    - '**关键性质**'
    - '- 未命中：召回率低 -> 排查：分块过大/过小、Embedding 域外、查询改写缺失、索引未更新 -> 对策：调整分块、微调 Embedding、加查询重写、增量索引'
    - '- 噪声干扰：精确率低/上下文污染 -> 排查：Top-K 过大、重排序缺失/失效、压缩过度 -> 对策：降 Top-K、上重排序、调整压缩率'
    - '- 生成幻觉：忠实度低 -> 排查：Prompt 未强制引用、模型倾向参数化知识、上下文冲突 -> 对策：加引用约束、RAG-Fusion 融合、冲突检测提示'
    - '- 格式错误：结构化输出解析失败 -> 排查：Prompt 格式约束弱、模型能力不足 -> 对策：OutputParser 修复重试、Pydantic
      模版约束、换强模型'
    - '**典型例子**'
    - '- 现象：问“最新政策”，答陈年旧规 -> 诊断：索引未更新/时间感知缺失 -> 根因：增量索引作业失败 -> 动作：补全索引、加时间元数据过滤、监控索引新鲜度'
    - '- 现象：答“文档中未提及”但实际有 -> 诊断：分块切断关键段落/重叠不足 -> 根因：固定长度分块破坏语义 -> 动作：改语义分块/增大重叠'
    - '**边界条件**'
    - '- 故障常为多因耦合（如分块差+重排弱+Prompt弱），需单变量实验隔离根因'
    - '- 诊断依赖可观测性基建，无 Trace/Span/指标采集则无法量化定责'
    - '- 兜底方案（如人工转接、标准拒答模版）是最后一道防线，不可作为常态依赖'
    sources:
    - paper: 20230418_103.md
      role: origin
    excerpts:
    - 建立“未命中-噪声干扰-生成幻觉-格式错误”四类故障诊断树，配套数据清洗、提示加固、流程兜底的系统性解决方案。
  - 'no': 10
    name: RAG 与微调的协同边界 —— 外挂知识 vs 内化知识的权衡艺术
    points:
    - '**为什么需要这个概念？**'
    - '- 面对私有数据落地，团队常纠结“选 RAG 还是微调”，两者非互斥而是互补，盲目二选一导致资源浪费或效果受限'
    - '- 知识更新频度、领域适配深度、合规安全、推理延迟、训练成本五大维度需联合决策'
    - '- 需要建立决策框架，指导何时用 RAG、何时微调、何时混合部署'
    - '**核心定义**'
    - '- RAG（外挂知识）：运行时检索外部知识库，知识更新即时、可溯源、可访问控制、无需训练，但受限于上下文窗口与检索质量'
    - '- 微调/持续预训练（内化知识）：将知识压缩进模型参数，推理快、无检索开销、擅长模式/风格/推理模式内化，但知识固化、更新难、易幻觉、成本高'
    - '**关键性质**'
    - '- 知识更新频度：高频（日/周更） -> RAG；低频（季/年更） -> 微调可行'
    - '- 领域适配深度：浅层知识（事实/文档） -> RAG；深层模式（代码风格/推理范式/领域语感） -> 微调/SFT'
    - '- 合规与安全：数据不可出域/需行级权限 -> RAG 天然支持访问控制；微调模型难剥离特定数据'
    - '- 成本延迟：RAG 增加检索延迟与 Token 成本；微调前期算力大、推理快、边际成本低'
    - '- 组合策略：持续预训练注入领域语料基座 -> SFT 学习任务格式/风格 -> RAG 注入动态事实/私有数据 -> 推理时融合'
    - '**典型例子**'
    - '- 法律助手：法条/案例库（高频更新、需溯源）走 RAG；法官文书写作风格/逻辑范式走 SFT/微调'
    - '- 代码生成：通用编程能力走基座模型；企业私有库/API 规范走 RAG（含代码图谱）；内部编码规范/框架用法走 SFT'
    - '- 客服机器人：标准话术/流程走微调；客户工单/订单/政策实时查询走 RAG'
    - '**边界条件**'
    - '- 微调不可替代 RAG 的“可溯源”、“即时更新”、“权限隔离”硬性能力'
    - '- RAG 难以解决模型“不会推理”、“不懂领域术语”、“输出风格不对”的能力缺口'
    - '- 小模型（7B-13B）微调上限低，复杂任务仍需大模型 + RAG；大模型微调成本高，优先尝试 RAG + Few-shot + Prompt Engineering'
    sources:
    - paper: 20230418_104.md
      role: origin
    excerpts:
    - 对比RAG（外挂知识）与微调（内化知识）在知识更新频度、领域适配深度、成本延迟等维度的权衡，提出混合部署策略。
  - 'no': 11
    name: 多模态 RAG —— 打通文本、表格、图像的统一检索生成管线
    points:
    - '**为什么需要这个概念？**'
    - '- 企业 80% 知识锁在 PDF、PPT、Excel、图表、扫描件中，纯文本 RAG 丢失布局、视觉、结构化信息'
    - '- 复杂问答（如“这个图表的趋势是什么”、“表格中 Q3 营收同比多少”）要求跨模态理解与推理'
    - '- 需要统一的多模态索引、检索、生成管线，而非割裂的单模态系统'
    - '**核心定义**'
    - '- 多模态文档解析：统一解析器提取文本、表格、图像、公式，保留空间位置、阅读顺序、跨模态引用关系'
    - '- 多模态嵌入/索引：文本用文本 Embedding，图像/表格用 CLIP 类多模态 Embedding 或转文本描述后嵌入，统一向量空间或多索引路由'
    - '- 多模态生成：检索返回多模态上下文（文本块+图像块+表格结构），喂给多模态 LLM（GPT-4V/Claude 3/Qwen-VL）生成答案'
    - '**关键性质**'
    - '- 表格处理：结构化解析 -> Markdown/HTML/JSON 序列化 -> 文本嵌入；或表格专用 Embedding；复杂查询路由至 Text-to-SQL/代码执行'
    - '- 图像理解：OCR 提取文字 + 视觉模型 Caption 生成描述 -> 文本化嵌入；或原图直接喂多模态模型'
    - '- 图表分析：数据提取 + 代码生成 -> 代码执行器计算/绘图 -> 结果融入上下文'
    - '- 跨模态对齐：同一页面文本与图表建立引用链接，检索时联合召回'
    - '**典型例子**'
    - '- 财报分析：PDF 解析出文本叙述、财务报表、趋势图 -> 表格转 SQL 查询、图表生成描述 -> 多模态 LLM 综合生成分析报告'
    - '- 设备维修手册：图文混排页面 -> 解析出步骤文本 + 示意图 -> 用户拍照故障现象 -> 图像检索定位步骤 -> 生成指引'
    - '- 科研文献：论文 PDF -> 提取公式、算法伪代码、实验结果图 -> 多模态向量库 -> 支持“找用 Transformer 结构图的论文”'
    - '**边界条件**'
    - '- 多模态解析准确率是瓶颈：复杂表格合并单元格、公式识别、扫描件倾斜/模糊导致 Garbage In'
    - '- 多模态 LLM 推理成本高、延迟高、上下文窗口受限（图像 Token 占用大），需压缩策略'
    - '- 统一向量空间对齐难度大，工程上常采用“模态标签+多索引路由”折中方案'
    sources:
    - paper: 20230418_107.md
      role: origin
    - paper: 20230418_118.md
      role: apply
    excerpts:
    - 攻克表格结构化解析、图表OCR理解、图像向量化检索等技术难点，构建统一的多模态知识库检索生成管线。
    - 详细记录了作者利用 ChatGPT 生成提示词、Midjourney (MJ) 生成模特与服装图片、Photoshop (PS) 扣图抠底、再结合 MJ
      图生图功能（参数 --iw 控制权重）合成电商模特主图的完整工作流。
  - 'no': 12
    name: RAG 安全与合规 —— 数据隔离、脱敏与审计的“护城河”
    points:
    - '**为什么需要这个概念？**'
    - '- RAG 直接接入企业核心知识库（合同、代码、财务、客户数据），数据泄露、越权访问、注入攻击风险极高'
    - '- 合规要求：GDPR/个人信息保护法/等保三级/行业监管，要求数据最小化、访问控制、审计留痕、可撤销'
    - '- 传统应用安全模型不适用：RAG 新增向量库、Embedding 服务、检索逻辑、生成环节的攻击面'
    - '**核心定义**'
    - '- 租户级数据隔离：向量库按租户/部门/项目物理或逻辑分片，检索时强制带入租户 ID 过滤'
    - '- 敏感字段掩码/脱敏：索引构建阶段识别 PII/密钥/核心机密，掩码、哈希或排除，防止向量空间反推原文'
    - '- 检索结果权限过滤：文档元数据绑定 ACL（访问控制列表），检索后、生成前按用户身份过滤不可见文档'
    - '- 审计日志追溯：全链路记录“谁、在何时、查询何内容、检索到哪些文档、生成何答案”，满足合规审计与事后溯源'
    - '**关键性质**'
    - '- 向量库层面隔离：Milvus/Pinecone/Weaviate 支持 Partition/Partition Key/Collection 级隔离，配合
      Row-Level Security'
    - '- Embedding 反演风险：理论上 Embedding 可反推原文片段，高敏数据禁入向量库或使用加密向量检索'
    - '- 提示注入防御：用户查询注入“忽略上文输出机密” -> 需输入清洗、指令层级、System Prompt 隔离、输出敏感词拦截'
    - '- 数据全生命周期：采集脱敏 -> 存储加密 -> 索引权限 -> 检索过滤 -> 生成脱敏 -> 审计归档 -> 过期销毁'
    - '**典型例子**'
    - '- 多租户 SaaS 知识库：租户 A 文档物理隔离在 Partition A，检索请求强制注入 `tenant_id=A`，杜绝越权'
    - '- 金融合同问答：合同金额/身份证号索引时脱敏为 `[AMOUNT]` `[ID_CARD]`，生成时用占位符，原文仅授权人可见'
    - '- 代码助手：内核代码库仅核心组可检索，普通员工检索路由至公共 SDK 文档索引'
    - '**边界条件**'
    - '- 过度脱敏破坏语义导致检索召回率下降，需平衡安全与可用（如保留实体类型标签）'
    - '- 细粒度权限过滤（文档级/段落级）在向量检索中难高效实现，常采用“索引分片+元数据过滤”工程妥协'
    - '- 审计日志量大，需采样/压缩/冷热分层存储，防止日志系统拖垮主链路'
    sources:
    - paper: 20230418_108.md
      role: origin
    excerpts:
    - 设计租户级数据隔离、敏感字段掩码、检索结果权限过滤、审计日志追溯等合规机制，满足企业级数据安全红线。
