  - 'no': 11
    name: 技术债务识别与重构提案（ADR 驱动） —— 让“欠债”变成“可控资产”
    points:
    - '**为什么需要这个概念？**'
    - '- 长期迭代必然产生技术债务（过时依赖、耦合代码、缺失测试、性能瓶颈、设计模式腐化）。隐性债务会拖慢交付速度、增加故障率、劝退新人。需建立显性识别、量化评估、ADR
      驱动重构的治理机制。'
    - '- 重构不应是“程序员自嗨”，必须有业务价值锚定（如：提升开发效率 X%、降低故障率 Y%、支撑新业务 Z），通过 ADR 记录决策过程，纳入规划排期。'
    - '**核心定义**'
    - '- **技术债务清单**：结构化记录 `{ id, 标题, 类型(架构/代码/测试/文档/依赖/基建), 影响范围, 严重度(P0-P4), 产生原因,
      当前痛点, 重构方案草案, 预估工时, 业务价值, 关联 ADR }`。'
    - '- **重构提案 ADR**：复用 ADR 流程，在“背景”中量化债务成本（如：每次发版需人工修改 10 处配置，耗时 30min，半年 20 次发版，累计
      10h 浪费），在“决策”中给出分阶段重构方案（绞杀者模式/防腐层/并行运行/渐进切换）。'
    - '**关键性质**'
    - '- **分类分级治理**：P0（安全/数据丢失/核心链路阻塞）立即修复；P1（性能严重/频发故障/阻塞新需求）纳入下个 Sprint；P2/P3（代码异味/文档缺失/依赖旧版）纳入技术专项周/季度规划；P4（主观不爽/最佳实践未遵循）仅记录不强制。'
    - '- **绞杀者模式**：大规模重构（如 Vue 2 -> Vue 3、JS -> TS、微前端拆分）禁止大爆炸式重写，需建立防腐层/适配器，新旧代码共存，按路由/页面/模块逐步迁移，灰度验证。'
    - '- **度量驱动验收**：重构完成需通过指标验收：构建时间 -30%、包体积 -20%、核心页面 LCP -200ms、单测覆盖率 +15%、发版频次
      +50%、Bug 回归率 -50%。'
    - '**典型例子**'
    - '- **债务案例**：`DEBT-2024-001: 请求层未统一封装`，类型：基建/架构，严重度 P1，痛点：30+ 业务包各自封装 Axios，Token
      刷新逻辑 5 种实现，排查网络问题无统一日志。重构方案：推出 `@enterprise/request`，6 个 Sprint 迁移存量，ADR-0045
      记录决策。'
    - '- **重构 ADR 片段**：`## Decision: 采用绞杀者模式迁移 @enterprise/request。Phase 1: 新项目强制使用；Phase
      2: 高频改动老项目迁移（提供 Codemod 脚本）；Phase 3: 存量项目按需迁移；Phase 4: 废弃旧封装。`。'
    - '**边界条件**'
    - '- **重构陷阱**：避免“为重构而重构”，每个重构任务必须关联具体业务目标或痛点数据，拒绝“代码洁癖”驱动的无价值重构。'
    - '- **遗留系统无测试重构**：无单测/E2E 兜底的遗留代码重构风险极高，必须先补齐“安全网”（E2E 核心链路覆盖）再动手，或采用“并行运行对比”策略（新旧同时跑，Diff
      结果）。'
    - '- **组件复用率统计陷阱**：单纯统计 `import ''@enterprise/ui''` 次数无意义，需统计“业务组件复用率”（自研业务组件被多项目引用次数
      / 总业务组件数），目标 > 60%，倒逼公共组件沉淀质量。'
