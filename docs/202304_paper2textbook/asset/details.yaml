  - │   ├── 群规模边际效益递减律（150人阈值，大树/阿黛）
  - │   ├── 强IP信任悖论：高信任反而难转化，需主动触达（根源）
  - │   ├── 存量深度挖掘策略：通讯录主动触达SOP（根源）
  - │   └── 付费群冷启动模型：≤50人小群深度服务（根源/老马）
  - ├── 创业合伙人决策模型
  - │   ├── 单人创业管理真空定律（黄老师）
  - │   ├── 合伙人筛选五维铁律（志向、人品、能力互补、性格互补、金钱观）
  - │   ├── 四大选人误区陷阱（短期工具人、情感投资人、纯财务投资人、大厂职业经理人）
  - │   ├── 三维渠道搜寻法（向上/横向/向下求）
  - │   ├── 闲聊式结构化面试法
  - │   ├── 背调授权机制
  - │   └── 前期严选即后期止损原则（e袋洗案例）
  - ├── 教材工程化：像开发软件一样构建教程
  - │   ├── 核心定义：教材即代码、纯文本源文件、Git版本控制
  - │   ├── 四层架构
  - │   │   ├── 素材层（原始输入：PDF/网页/笔记）
  - │   │   ├── 概念层（知识原子：概念卡片/中间表示IR）
  - │   │   ├── 结构层（逻辑骨架：大纲/JSON Schema）
  - │   │   └── 呈现层（多形态交付：PDF/网站/课件/电子书）
  - │   ├── 概念卡片驱动开发（CDD）流水线
  - │   │   ├── 聚类素材 -> 提炼概念卡片 -> 编排大纲节点 -> 渲染章节
  - │   ├── 大纲编排规范
