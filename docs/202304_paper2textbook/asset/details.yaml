  life_analogy:
  - 想象 **Vue Router 是一座智能商场的“导航中枢”**：
  - '- **路由配置** = 商场的**分层导视图**：嵌套路由是“楼层-区域-柜台”的层级结构；命名视图是“大厅同时显示导视屏、广告屏、应急广播”多通道并行；路由元信息是每个区域贴的“仅限会员/需穿无尘服/免税区”业务标签。'
  - '- **导航守卫** = **安检与引导员体系**：全局前置守卫是“主入口安检(登录态)”；路由独享守卫是“VIP 区专属验证”；组件内守卫是“试衣间进出确认(未保存草稿)”；`next()`
    是“放行/拦截/改道/报警”四种指令。'
  - '- **动态路由** = **每日动态调整的‘柜台租赁表’**：后端下发最新‘租赁合同’(路由树) -> 运营部 `addRoute` 贴最新导视 ->
    同步更新手机 APP 菜单 -> 顾客刷新手机地图不迷路。'
  - '- **性能优化** = **‘按需补货’与‘预判备货’**：懒加载是“顾客去哪层才把该层货品摆上架”；预加载是“大数据预测顾客大概率去 3 楼，提前把货运到楼道口”；滚动恢复是“顾客从
    3 楼下来再上去，自动站在原货架前”。'
  - '- **微前端路由** = **‘商场中入驻独立品牌专柜’**：主应用是商场主通道，子应用是‘苹果/耐克/优衣库’自带装修风格的专柜；`base` 是专柜专属入口前缀；基座分发是‘总导视根据品牌名把顾客领进对应专柜’；沙箱隔离保证‘专柜装修拆除不影响商场主体’。'
  summary:
  - concept: 嵌套路由
    desc: 通过 children 数组实现 UI 层级组合，父路由渲染 RouterView 作为出口
  - concept: 命名视图
    desc: 单路由配置多 components 对应多个 router-view，实现同级多视图并行渲染
  - concept: 路由元信息
    desc: meta 字段携带权限、标题、缓存等业务数据，配合模块扩展实现类型安全
  - concept: 导航守卫执行顺序
    desc: 全局 beforeEach → 路由独享 beforeEnter → 组件 beforeRouteEnter → 全局 beforeResolve
      → 组件 beforeRouteUpdate/Leave → 全局 afterEach
  - concept: next() 控制流
    desc: next() 放行、next(false) 中断并重置 URL、next('/path') 重定向、next(error) 终止传递错误
  - concept: 动态路由注册
    desc: router.addRoute 运行时注入路由记录，配合后端下发路由树实现权限驱动菜单
  - concept: 刷新保持状态
    desc: 本地缓存后端路由树，应用初始化同步注册，避免白屏等待接口
  - concept: 路由懒加载
    desc: 动态 import 语法触发代码分割，按需加载减小首屏包体
  - concept: 预加载策略
    desc: router.prefetchRoutes 在空闲期预取高概率路由 Chunk，隐藏切换延迟
  - concept: 滚动恢复
    desc: scrollBehavior 接管浏览器滚动行为，列表页返回保持位置、详情页回顶部
  - concept: 微前端路由隔离
    desc: 子应用设置 base 前缀，基座按 activeRule 分发，沙箱隔离保证卸载无残留
