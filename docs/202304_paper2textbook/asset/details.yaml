    - Lockfile 完整性机制：package-lock.json 锁定版本+完整性哈希、pnpm-lock.yaml 严格单一依赖树、CI 中 frozen-lockfile
      强制一致性
    - SBOM 生成与应用：@cyclonedx/bom 生成 CycloneDX 格式、GitHub Dependency Graph 集成、漏洞扫描器（Grype/Trivy）对接
      SBOM 溯源
    - 恶意包检测实战：运行时行为监控（网络连接/文件读取/进程创建）、安装钩子扫描（preinstall/postinstall）、依赖混淆攻击防御（内部作用域注册）
