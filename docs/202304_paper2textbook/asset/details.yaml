  - 'no': 4
    name: 行为面试 STAR 法则 —— 用故事证明“软实力”硬指标
    points:
    - '**为什么需要这个概念？**'
    - '- 大厂面试重“软技能”（沟通/推动/抗压/成长性），行为面试权重常达 30-50%'
    - '- 无结构表达易跑题、细节缺失、无法量化贡献，导致面试官无法评级'
    - '- 需标准化素材库与话术模版，实现“2 分钟讲清故事、证据确凿、亮点突出”'
    - '**核心定义**'
    - '- STAR 模版：Situation（背景）、Task（任务/目标）、Action（关键行动/决策）、Result（量化结果/复盘）'
    - '- 核心素材库：最有挑战项目、技术分歧解决、推动新技术落地、线上故障复盘、跨部门协作冲突'
    - '**关键性质**'
    - '- 我非我们：Action 必须强调“个人”在其中的关键决策、代码编写、沟通协调、推动落地'
    - '- 数据说话：Result 必含指标（性能提升 40%/覆盖率 90%/工时减半/零故障上线/用户投诉归零）'
    - '- 复盘升华：失败案例重点讲“事后做了什么改进、建立了什么机制、避免再犯”'
    - '**典型例子**'
    - '- 推动新技术落地：背景旧架构痛点 -> 任务调研选型 -> 行动 PoC/文档/培训/灰度 -> 结果全组接入/效率提升'
    - '- 技术分歧解决：背景方案 A/B 争执 -> 任务达成共识 -> 行动搭建 Benchmark/数据对比/邀请专家评审 -> 结果统一技术栈/沉淀
      ADR'
    - '**边界条件**'
    - '- 素材真实性：严禁编造，细节经得起深挖（如具体指标来源、代码细节、人名时间）'
    - '- 避免“流水账”：背景 10%、任务 10%、行动 60%、结果 20% 的时间比例'
    - '- 反问环节：准备 2-3 个高质量问题（团队技术挑战/技术债务偿还计划/新人成长路径）体现长期意向'
    - '...'
