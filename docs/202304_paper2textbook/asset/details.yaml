    - Scaling Laws：规模、数据、计算的三角权衡
  - 'no': 3
    name: 大规模预训练工程 —— 3D 并行与混合精度的“分布式拼图”
    points:
    - '**为什么需要这个概念？**'
    - '- 千亿参数模型显存需求远超单张 GPU（如 175B FP16 需 350GB+ 显存，单卡 80GB 根本放不下）'
    - '- 单卡训练速度太慢（年级单位），必须将计算拆分到成百上千张卡上并行'
    - '- 通信开销、负载均衡、数值稳定性是规模化训练成败的工程关键'
    - '**核心定义**'
    - '- **数据并行 (DP)**：各卡持有完整模型副本，切分数据批次，梯度 All-Reduce 同步。基线方案，但显存不随卡数降低'
    - '- **张量并行 (TP)**：将单层矩阵乘法（如 Attention QKV 投影、FFN 线性层）按维度切分到多卡，显存线性降低，但需高频 All-Reduce，依赖高带宽互联
      (NVLink/IB)'
    - '- **流水线并行 (PP)**：将模型按层切分为多个 Stage，不同卡负责不同层，微批次流水流动。显存降低，但存在“气泡”空闲期，需调度优化 (1F1B,
      ZB1P)'
    - '- **3D 并行**：DP × TP × PP 组合，如 Megatron-LM 架构，实现万卡规模训练'
    - '- **ZeRO (Zero Redundancy Optimizer, DeepSpeed)**：按状态分片（优化器状态、梯度、参数）而非复制，ZeRO-3
      可将显存降至单副本 1/N，配合 CPU Offload/NVMe Offload 突破显存墙'
    - '- **混合精度 (BF16/FP16)**：前向/反向用低精度加速，参数主副本、梯度累积、Loss Scaling 用 FP32 保稳定。BF16
      无需 Loss Scaling，动态范围更大，成 A100/H100 标配'
    - '**关键性质**'
    - '- TP 域内通信最频繁，必须部署在 NVLink 互联的节点内（如 8 卡一组），PP/DP 跨节点'
    - '- 通信计算重叠是榨干算力关键：异步 All-Reduce、双缓冲、内核融合'
    - '- 训练稳定性挑战：Loss Spike（梯度爆炸/数据脏样）、BF16 下溢、显存碎片 OOM'
    - '**典型例子**'
    - '- Megatron-LM / Megatron-DeepSpeed：3D 并行 + ZeRO 训练万亿参数模型标配'
    - '- GPT-3 175B：TP=8 (节点内), PP=12 (层数), DP=多节点'
    - '- LLaMA 训练：FSDP (PyTorch 原生 ZeRO-3 类实现) + Activation Checkpointing + BF16'
    - '**边界条件**'
    - '- PP 气泡比例随微批次数增加而下降，但微批次太小降低 GPU 利用率，需权衡'
    - '- ZeRO-3 通信量巨大，对网络带宽极其敏感，InfiniBand 必选'
    - '- 激活重计算 (Activation Checkpointing) 用算力换显存，约 20-30% 训练时间开销'
    sources:
    - paper: 20230418_047.md
      role: origin
    - paper: 20230418_048.md
      role: improve
    excerpts:
    - 拆解 3D 并行（数据/流水线/张量）、ZeRO 优化、BF16 混合精度、梯度累积等工程落地细节。
    - 大规模预训练工程：并行策略与混合精度
  - 'no': 4
    name: 数据工程 —— 从 Common Crawl 到高质量训练语料的“炼丹炉”
    points:
    - '**为什么需要这个概念？**'
    - '- 模型上限由数据决定：Scaling Laws 假设数据分布固定，提升数据质量等效于“免费”扩大模型/算力'
    - '- 原始网页数据（Common Crawl）噪声极大：广告、导航栏、重复内容、有毒/非法/低质文本占比高'
    - '- 数据污染会导致基准测试作弊（测试集泄露进训练集），评估失真'
    - '**核心定义**'
    - '- **清洗管线**：语言识别/过滤 → 脱敏/PII 清洗 → 启发式规则过滤（长度、符号比、停用词） → 质量分类器打分 (fastText/BERT-based)
      → 阈值筛选'
    - '- **去重**：精确去重 (URL/文档哈希) + 模糊去重 (MinHash LSH, n-gram Jaccard 相似度) → 文档级/段落级去重，防止模型“背诵”高频语料'
    - '- **课程学习**：按数据质量/难度排序，前期喂高质量/易学数据（如 Wikipedia、书籍、代码），后期喂海量网页，加速收敛提升上限'
    - '- **合成数据**：用强模型生成高质量指令/推理/代码/多语言数据，回补稀缺领域，实现“模型教模型”'
    - '- **数据污染检测**：n-gram 重叠检测、子字符串匹配、训练集/测试集哈希去重，发布前必须做'
    - '**关键性质**'
    - '- 数据质量 > 数据量：RefinedWeb (600B tokens) 超过 Common Crawl 原始几十 TB；Phi-1 (1.3B)
      仅用教科书级代码数据超越大模型'
    - '- 多域数据混合比例是核心超参数：代码比例提升推理、数学、结构化能力；多语言比例影响跨语言迁移'
    - '- Tokenizer 训练数据需具备代表性，词表大小（如 32k-256k）影响压缩率与嵌入层参数量'
    - '**典型例子**'
    - '- RedPajama / Falcon RefinedWeb：完整复现开源清洗管线'
    - '- LLaMA 训练数据混合：67% CCNet, 15% C4, 4.5% GitHub, 4.5% Wikipedia, 4.5% Books,
      2% ArXiv, 2% StackExchange'
    - '- Phi 系列：教科书质量合成数据 + 精选网页，小模型大智慧'
    - '**边界条件**'
    - '- 清洗规则存在“过拟合”风险：过度过滤导致分布偏移、多样性丧失、长尾知识缺失'
    - '- 版权/合规风险：书籍、代码、学术论文版权模糊，需法律审查与去版权化处理'
    - '- 合成数据若质量把控不严，会引入模型幻觉、风格单一、分布坍缩，需人工/强模型复核'
