  - 'no': 5
    name: 国际化与无障碍基线工程化 —— 让产品天生“懂世界、懂人”
    points:
    - '**为什么需要这个概念？**'
    - '- 出海/多语言业务若上线后才补 i18n，需全量改写硬编码文本，成本极高；无障碍 (a11y) 若非基线建设，后期补齐需重构所有组件交互，且易被法律诉讼（如
      ADA、欧洲无障碍法案）。'
    - '- 必须在脚手架阶段接入 i18n/a11y 基建，制定规范、配置工具链、建立 CI 门禁，实现“默认合规、无感接入”。'
    - '**核心定义**'
    - '- **i18n 工程化**：采用 `vue-i18n`/`react-i18next` + `ICU MessageFormat` 标准，支持复数、性别、选择格式；集成
      `lint-staged` 校验硬编码中文、CI 自动推拉翻译平台、TypeScript 类型安全键值提示。'
    - '- **a11y 基线**：强制语义化 HTML、WCAG 2.1 AA 级达标（颜色对比度 4.5:1、键盘可达、ARIA 标签、焦点管理），组件库内置合规，业务组件继承合规。'
    - '**关键性质**'
    - '- **编译时优化**：`@intlify/unplugin-vue-i18n` / `lingui` 编译时提取消息、移除运行时解析开销、Tree-shaking
      未使用语言包，首屏 JS 体积减少 30%+。'
    - '- **设计令牌驱动主题**：CSS Variables 定义色值/间距/圆角，`prefers-color-scheme` + `data-theme`
      双模式切换零闪烁，i18n 文本方向 `dir=rtl` 自动适配阿拉伯语/希伯来语布局反转。'
    - '- **自动化回归防护**：CI 集成 `axe-core`/`lighthouse-ci` 扫描 a11y 违规阻断合并、i18n 缺失键/未使用键检测报警。'
    - '**典型例子**'
    - '- **翻译管理流水线**：开发提交代码 -> GitHub Actions 推送源语言 JSON 到 Crowdin -> 翻译/机翻 -> PR
      合并前 Actions 拉取最新翻译 -> 校验完整率 100% -> 合并部署。'
    - '- **无障碍组件模式**：`ProModal` 内置 `FocusTrap`（焦点陷阱）、`Esc` 关闭、打开时保存上一焦点元素关闭时恢复、`aria-modal=true`
      `aria-labelledby` 关联标题。'
    - '**边界条件**'
    - '- **动态内容国际化**：富文本编辑器内容、用户生成内容（UGC）、后端返回错误码文本无法走前端 i18n，需后端多语言支持或前端建立错误码映射表。'
    - '- **a11y 非银弹**：自动化工具仅能发现 30%-50% 问题（如缺 alt、对比度），复杂交互（如拖拽排序、虚拟列表键盘操作）必须人工 NVDA/VoiceOver
      实测。'
    - '- **字体加载策略**：多语言字体体积大（中日韩 5MB+），必须子集化、WOFF2 压缩、`font-display: swap`、按需动态加载（`unicode-range`），避免首屏阻塞。'
