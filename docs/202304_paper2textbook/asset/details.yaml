  life_analogy:
  - 想象前端团队引入 AI 是一次‘新员工入职与晋升’的完整过程：
  - '- **AI 编程助手** = **实习生**：手里拿着通用技能手册（预训练模型），能写样板代码、查语法，但不懂业务规范、不认识内部组件库，需时刻监督（Inline
    Chat/补全）。'
  - '- **RAG 知识库** = **入职导师手册 + 代码库地图**：把私有组件库、架构文档、历史 ADR 切片索引好，实习生遇到不会的‘查手册’，不再瞎猜，还能指引到具体文件行号（溯源）。'
  - '- **Agent 工作流** = **资深工程师**：给一个 Issue（需求），能自主拆解任务（Planner）、写代码（Coder）、跑测试（Tester）、自查
    Bug（Reviewer），只在关键节点找你批准（人工介入点）。'
  - '- **模型微调** = **内部晋升培训/肌肉记忆形成**：把团队最佳实践、代码规范、独特模式‘练’进模型权重里，变成‘不看文档也能写出符合规范代码’的专家级员工。'
  - '- **AI Code Review** = **自动化质检闸机 + 初级 Reviewer**：PR 一提交，瞬间扫描格式、安全、性能、测试覆盖，把确定性错误拦在门外，只把架构决策、业务逻辑留给人类专家把关。'
  - '- **增量索引机制** = **每日站会同步进度**：代码推送即触发向量库更新，保证实习生查阅的永远是最新版‘手册’，不踩旧坑。'
  - '- **隐私合规部署** = **离线工作模式**：核心代码不出内网，实习生在本地沙箱干活，产出只交付成果物，零数据泄露风险。'
  - '- **Agent 安全边界** = **权限分级管理**：实习生只有读写工作目录权限，危险命令需主管审批，生产环境隔离‘防火墙’。'
  - '- **灾难性遗忘缓解** = **复习旧知识 + 学新知识**：微调时混入通用代码数据、保留 Replay Buffer，防止‘只会新框架、忘了基础语法’。'
  - '- **反馈闭环治理** = **绩效复盘机制**：‘Not Helpful’ 标记自动入库，定期微调 Prompt/模型，把假阳性率从 15% 降到 5%
    以下，建立信任红线。'
  summary:
  - concept: AI 编程助手
    desc: 基于 LLM 的 IDE 集成工具，核心差异在于模型能力、上下文工程策略与交互范式（补全/对话/Agent）
  - concept: 上下文工程
    desc: 构建高质量模型输入的关键技术，融合最近文件、语义检索、符号索引与用户选中，解决‘大海捞针’精度问题
  - concept: 代码库 RAG
    desc: 面向代码仓库的检索增强生成，核心流程：AST 切片 → 代码专用 Embedding → 混合检索 → 重排序 → 溯源引用
  - concept: Tree-sitter AST 切片
    desc: 按函数/类/组件/接口等语义单元切分代码，保留语法完整性与元数据（路径、行号、依赖），优于固定长度分块
  - concept: 混合检索
    desc: 稠密向量（语义）+ 稀疏 BM25（关键词/符号）召回，解决符号精准匹配与语义相关并重的需求
  - concept: 代码 Agent
    desc: 具备规划、工具调用、记忆、反思能力的自主系统，输入需求输出代码变更集，编排框架如 LangGraph/AutoGen
  - concept: 多角色协作
    desc: Planner（规划）、Coder（编码）、Tester（测试）、Reviewer（评审）分工协作，通过状态机流转实现闭环
  - concept: 人工介入点
    desc: 计划确认、高风险审批、测试失败暂停、PR 提交确认，实现‘AI 驱动，人工把关’的安全边界
  - concept: 继续预训练
    desc: 在基座模型上继续训练高质量领域代码语料，增强领域知识密度，解决‘不知业务’问题
  - concept: 指令微调 (SFT)
    desc: 构建‘指令-标准响应’对，用 LoRA 低成本适配，固化团队最佳实践与编码规范模式
  - concept: 对齐训练 (DPO/ORPO)
    desc: 基于偏好数据（优秀 vs 违规代码）对齐，修正模型倾向（如滥用 any、忽略无障碍），提升代码合规率
  - concept: AI Code Review Bot
    desc: 集成于 Git 平台的自动化审查系统，融合静态分析结果与 LLM 语义分析，输出行级结构化评审意见
  - concept: 结构化评审输出
    desc: 强制 JSON Schema（file/line/severity/category/fix_suggestion），支持 IDE 一键应用修复与单测草案生成
  - concept: 反馈闭环
    desc: 开发者标记 Not Helpful → 纳入负样本微调/调整 Prompt，持续治理假阳性，建立信任
  - concept: 增量索引
    desc: Git Hooks/CI 触发向量库自动更新，解决代码推送后检索滞后问题，保证上下文时效性
  - concept: 隐私合规部署
    desc: 本地模型/零保留模式，核心代码不出内网，满足金融/政企数据安全红线要求
  - concept: Agent 安全边界
    desc: 沙箱隔离、命令白名单、Git 受保护分支强制 Review、最小权限原则，防止越权操作
  - concept: 灾难性遗忘缓解
    desc: 混合通用代码数据、Replay Buffer、LoRA 合并策略，平衡领域适配与通用能力保持
  - concept: 假阳性治理
    desc: 负样本采集 → Prompt 优化/微调流水线自动化，将假阳性率从 15% 降至 5% 以下，建立开发者信任
  exercises:
  - 'no': 1
    title: 设计前端代码库 RAG 切片与检索方案
    contents:
    - 假设你接手一个包含 5000 个文件的 Vue 3 + TypeScript Monorepo 代码库，包含业务组件、工具函数、请求封装、设计系统组件库源码。
    - 1. 设计基于 Tree-sitter 的切片策略：定义哪些 AST 节点类型作为切片单元？如何处理跨文件的类型引用与组件依赖？
    - 2. 选择 Embedding 模型：对比 voyage-code-2、jina-embeddings-v2-code、nomic-embed-text
      在 TypeScript/Vue 代码上的召回效果，给出选型建议。
    - 3. 设计混合检索权重：稠密向量检索与 BM25 稀疏检索的融合权重如何设定？针对 'v-permission' 这类指令名搜索如何保证精准命中？
    - 4. 重排序策略：Top-K 取多少？Cross-Encoder 与 LLM-based Reranker 在延迟与精度上的权衡如何决策？
    - 5. 溯源设计：生成回答时如何强制模型引用文件路径与行号？若检索片段相互矛盾（新旧版本混存），如何在 Prompt 中约束模型行为？
    - 6. 增量索引自动化：设计基于 Git Hooks 的增量更新流水线，如何处理删除/重命名文件时的向量库同步？
  - 'no': 2
    title: 编排一个‘需求到 PR’的 Agent 工作流原型
    contents:
    - 使用 LangGraph 或伪代码设计一个最小可行的 Agent 状态机，完成‘为现有用户列表页新增导出 Excel 功能’的任务。
    - 1. 定义状态图的节点：Plan -> Code -> Test -> Review -> Fix(循环) -> Commit -> PR，每个节点的输入输出
      Schema 设计。
    - 2. Planner 节点：如何利用 RAG 检索现有 ProTable 组件用法、权限指令、请求封装、Excel 导出工具函数作为上下文？如何输出结构化任务树？
    - 3. Coder 节点：工具集成设计（文件读写、LSP 跳转定义、Git Diff 生成），如何并行修改多个文件并处理导入依赖冲突？
    - 4. Tester 节点：自动运行 vitest，解析测试报告（通过/失败/覆盖率），失败时如何将错误堆栈精准反馈给 Coder 修复？
    - 5. 人工介入点设计：在哪些节点必须暂停等待人工 Confirm？如何设计‘最多重试 3 次后升级给人工’的熔断机制？
    - 6. 上下文压缩策略：多轮交互 Token 激增时，如何压缩历史（摘要/关键决策/文件快照）而非全量保留？
    - 7. 沙箱与权限隔离：Agent 拥有写文件、执行命令权限，如何设计沙箱环境与命令白名单？
  - 'no': 3
    title: 制定前端专用模型微调数据工程与评测方案
    contents:
    - 团队决定基于 DeepSeek-Coder-7B-Base 进行继续预训练 + LoRA SFT + DPO 对齐，打造内部专用 Copilot。
    - 1. 数据收集与清洗：从 Git 历史中提取高质量 PR Diff 作为训练语料，设计去重、去敏感信息、质量打分（如 GPT-4o 打分 > 4 分）的清洗管线。
    - 2. 构建 SFT 数据集：设计 5 类核心任务模版（组件开发、Hook 封装、API 接入、Bug 修复、单测编写），每类至少 200 条高质量指令-响应对，如何保证响应代码的‘标准性’？
    - 3. LoRA 超参数配置：r=64/128, alpha=16/32, target_modules 选择 qkv/o/gate/up/down，在单张
      A100 40GB / H100 80GB 显存下的最大 Batch Size 与训练时长估算。
    - 4. 评测基准搭建：设计前端专用评测集，包含 TypeScript 类型正确率、ESLint 规则通过率、组件库 API 调用准确率、单测生成覆盖率四大指标，如何自动化跑分？
    - 5. 灾难性遗忘缓解：继续预训练阶段混入多少比例通用代码数据？SFT 阶段如何使用 Replay Buffer？最终模型如何通过在线 A/B 测试（采纳率/修改率）验证真实效果？
    - 6. 隐私合规部署：训练数据含私有业务逻辑，模型部署如何隔离？本地推理与零保留 API 模式的选型标准是什么？
  - 'no': 4
    title: 落地 AI Code Review 机器人的核心工程难点攻关
    contents:
    - 在公司 GitLab 部署 AI Code Review Bot，要求覆盖规范检查、安全扫描、性能建议、单测补全。
    - 1. 上下文构建优化：大型 PR 变更文件超 50 个，Token 预算 128k，设计‘变更块优先 + 关联文件检索 + 规范文档注入’的上下文裁剪算法。
    - 2. 多模型协作路由：小模型（如 7B）处理命名规范/格式/未用变量；大模型（GPT-4o/Claude）处理架构分层违规/业务逻辑漏洞/性能隐患。设计路由分发
      Prompt 与成本控制策略。
    - 3. 结构化输出与 IDE 集成：定义 JSON Schema 强制模型输出，包含 file/start_line/end_line/severity/category/description/fix_code/confidence。如何在
      GitLab MR 界面渲染为可交互的行级评论？
    - 4. 单测生成触发条件：仅对新增/修改的导出函数、组件、Hook 触发生成。生成的 Vitest 用例如何覆盖边界条件、异常分支、Props 组合？如何防止生成冗余/无效测试？
    - 5. 假阳性治理闭环：开发者点击‘Not Helpful’后，数据如何流入负样本池？设计每周自动化微调/Prompt 优化流水线，将假阳性率从 15%
      降至 5% 以下。
    - 6. 反馈闭环自动化：设计‘Not Helpful 标记 → 入库负样本 → 周度 Prompt 优化/月度微调 → 灰度验证 → 全量发布’的治理流水线。
  - 'no': 5
    title: Agent 工作流安全与成本控制实战
    contents:
    - 基于 LangGraph 实现一个带安全边界的 Agent 原型，完成‘重构请求层统一错误处理’任务。
    - 1. 实现上下文压缩：当对话历史超过 80k Token 时，自动触发摘要压缩，保留关键决策与文件快照。
    - 2. 沙箱隔离：使用 Docker/Firecracker 创建临时容器，Agent 仅在容器内执行文件操作与命令，挂载只读代码卷。
    - 3. 权限最小化：Agent 仅拥有工作目录读写权限，Git 操作通过受限 PAT，危险命令（rm -rf, sudo）拦截报警。
    - 4. 成本熔断：设定单任务 Token 预算 50k/美元上限 $10，超限自动暂停并推送钉钉告警。
    - 5. 熔断升级：连续 3 次 Test 失败或成本超限，自动创建 Issue 指派给 Tech Lead 人工介入。
  - 'no': 6
    title: 前端专用模型微调灾难性遗忘缓解实验
    contents:
    - 在继续预训练 + LoRA SFT 流程中，设计对比实验验证灾难性遗忘缓解策略。
    - 1. 实验组 A：继续预训练混入 10% 通用代码数据（The Stack v2 样本）
    - 2. 实验组 B：SFT 阶段引入 Replay Buffer，每步从缓冲区采样 20% 通用指令数据混合训练
    - 3. 实验组 C：LoRA 合并策略，训练完成后合并权重再量化部署
    - 4. 对照组：纯领域数据微调，无缓解措施
    - 5. 评测指标：HumanEval-MBPP 前端子集通过率、TypeScript 类型正确率、通用代码补全能力（HumanEval 基准）保持率
    - 6. 分析对比：哪种策略在领域任务提升 10%+ 的前提下，通用能力下降 < 5%？给出工程化落地建议。
  units:
  - 'no': 1
    name: AI 编程助手现状 —— 从补全工具到结对程序员
    points:
    - '**为什么需要这个概念？**'
    - '- 前端研发面临框架更新快、样式调试繁、类型系统复杂等高认知负荷场景'
    - '- 传统 IDE 补全仅基于静态分析，无法理解业务意图与上下文语义'
    - '- 需要一种能生成样板代码、解释报错、编写测试、甚至重构架构的智能副驾'
    - '**核心定义**'
    - '- AI 编程助手：基于大语言模型（LLM），集成于 IDE/编辑器中，通过上下文感知提供代码生成、补全、重构、问答、测试生成等全生命周期辅助能力的工具'
    - '- 核心差异维度：模型能力（推理/代码理解）、上下文窗口大小、上下文构建策略（检索/裁剪）、交互范式（Inline Chat/Chat Panel/CMD+K）、工具链集成度（终端/浏览器/数据库）'
    - '**关键性质**'
    - '- 模型层面：CodeLlama/StarCoder 等开源模型与 GPT-4o/Claude 3.5 Sonnet 等闭源模型在前端任务（TS 类型推导、CSS
      布局、Vue/React 组件生成）上存在显著能力差距'
    - '- 上下文工程：主流工具采用「最近文件+语义检索+符号索引+用户选中」混合策略构建上下文，长上下文窗口（128k-1M）使得全库索引成为可能，但「大海捞针」检索精度成为新瓶颈'
    - '- 交互范式演进：从被动补全 → 主动对话 → Agent 模式（自主规划-执行-验证闭环）'
    - '**典型例子**'
    - '- GitHub Copilot：最早普及，Inline 补全延迟低，但上下文感知弱，Chat 面板非原生'
    - '- Cursor：Fork VS Code，深度集成 Composer（多文件生成）、Cmd+K（内联编辑）、@Codebase 语义检索，体验最接近「AI
      原生 IDE」'
    - '- Codeium/Windsurf：免费额度大，支持本地模型部署，企业级隐私合规强'
    - '**边界条件**'
    - '- 幻觉风险：生成不存在的 API、编造 TypeScript 类型、引用已废弃的库版本'
    - '- 上下文污染：无关文件检索噪声导致模型跑偏，需依赖 .gitignore/.cursorignore 等机制隔离'
    - '- 隐私合规：代码上传云端训练/推理风险，金融/政企需部署本地模型或使用零保留模式'
    - '- 成本控制：闭源模型按 Token 计费，大规模团队需评估 ROI，开源模型需算力投入'
    sources:
    - paper: HgjLdWdxHo8ezoxv9iLc4HSwnAh.md
      role: origin
    excerpts:
    - 浅谈 ChatGPT 在跨境电商的应用场景和机会，分享我们团队在过去几个月里，在跨境电商上使用 ChatGPT 的一些经验
  - 'no': 2
    name: RAG 在前端知识库落地 —— 让 AI 读懂你的私有代码库
    points:
    - '**为什么需要这个概念？**'
    - '- 通用大模型不知晓私有业务组件库、内部设计系统、架构规范、历史决策记录（ADR）'
    - '- 直接喂给模型全量代码超出窗口且 Token 成本高，且噪声干扰推理质量'
    - '- 需要精准检索相关代码片段、文档、配置作为上下文注入，实现「领域专家级」回答'
    - '**核心定义**'
    - '- 代码库 RAG：面向代码仓库的检索增强生成系统，核心流程为「代码解析切片 → 向量化嵌入 → 向量库存储 → 混合检索 → 重排序 → 上下文注入
      → 生成回答」'
    - '- 关键差异点：代码具有严格语法结构（AST）、强依赖关系（Import/Call Graph）、高频更新（增量索引）、多语言混合（TS/JS/CSS/HTML/GraphQL）'
    - '**关键性质**'
    - '- 切片策略：基于 Tree-sitter AST 切片（函数/类/组件/Interface 级），保留语义完整性，元数据附带文件路径、行号、符号名、依赖关系'
    - '- Embedding 选型：代码专用模型（voyage-code-2, jina-embeddings-v2-code, nomic-embed-text）显著优于通用文本模型'
    - '- 混合检索：稠密向量（语义相似）+ 稀疏 BM25（关键词/符号精准匹配），解决「useUserStore」等符号检索难题'
    - '- 重排序：Cross-Encoder 或 LLM-based Reranker 对 Top-K 精排，过滤语义相关但业务无关的噪声片段'
    - '- 溯源引用：生成回答时必须引用源码行号（文件路径+起止行），支持 IDE 一键跳转验证，控制幻觉'
    - '**典型例子**'
    - '- 场景：新人问「我们项目的权限指令 v-permission 怎么用？」 → 检索到指令定义文件、使用示例组件、类型定义 → 生成包含参数说明、用法代码、源码链接的回答'
    - '- 场景：重构「请求层统一错误处理」 → 检索到 request.ts、errorCode.ts、全局异常处理逻辑 → 生成重构方案及影响范围分析'
    - '**边界条件**'
    - '- 增量索引延迟：代码推送后向量库更新滞后导致检索旧版本，需 Git Hooks/CI 触发增量更新'
    - '- 单体仓库规模：Monorepo 万级文件需分模块建库或分片索引，避免单库性能下降'
    - '- 二进制/生成文件污染：dist/node_modules/.d.ts 需严格排除，否则稀释检索质量'
    - '- 幻觉残留：检索召回不全时模型仍会编造，需在 Prompt 中强制要求「仅基于上下文回答，不知则称不知」'
    sources:
    - paper: HgjLdWdxHo8ezoxv9iLc4HSwnAh.md
      role: origin
    excerpts:
    - 实战：Tree-sitter 解析 AST 切片、Embedding 模型选型、Milvus/Chroma 向量库、Hybrid Search（稀疏+稠密）、引用源码行号溯源。
  - 'no': 3
    name: Agent 工作流自动化 —— 从需求到 PR 的无人驾驶流水线
    points:
    - '**为什么需要这个概念？**'
    - '- 单轮代码生成无法完成「需求分析→拆解任务→编码→测试→修 Bug→提交 PR」的完整工程闭环'
    - '- 复杂任务需要规划能力、工具调用能力（读写文件、运行测试、Git 操作）、状态管理与错误恢复'
    - '- 需要将「人工驱动 AI」升级为「AI 自主驱动，人工把关关键节点」'
    - '**核心定义**'
    - '- 代码 Agent：以 LLM 为大脑，具备规划、工具调用、记忆、反思能力的自主系统，输入为自然语言需求/Issue，输出为代码变更集'
    - '- 编排框架：LangGraph（状态图/循环控制）、AutoGen（多 Agent 群聊）、OpenHands/SWE-agent（软件工程专用基准）'
    - '**关键性质**'
    - '- 角色分工：Planner（拆解 Issue 为任务树/DAG）、Coder（单文件/多文件编辑）、Tester（运行测试/生成测试）、Reviewer（静态分析/规范检查/安全扫描）'
    - '- 状态机流转：Plan → Code → Test → Review → Fix(循环) → Commit → PR，每步产出结构化产物（文件列表、测试报告、Review
      意见）'
    - '- 人工介入点：计划确认、高风险变更审批、测试失败超阈值暂停、PR 提交前最终确认'
    - '- 工具集成：文件系统、终端、LSP（跳转定义/引用）、测试运行器、Linter、Git CLI、GitHub API'
    - '**典型例子**'
    - '- 需求：「为用户列表页增加导出 Excel 功能」 → Planner 拆解：1. 添加 xlsx 依赖 2. 封装导出工具函数 3. 在 ProTable
      组件加按钮 4. 接入权限控制 5. 编写单测 → Coder 并行修改 4 个文件 → Tester 运行 vitest 通过 → Reviewer
      ESLint/TypeCheck 通过 → 自动创建 PR'
    - '- 反思机制：Tester 发现类型报错 → 反馈给 Coder 附带错误堆栈 → Coder 修复 → 循环至通过或达重试上限'
    - '**边界条件**'
    - '- 规划幻觉：Planner 可能遗漏隐性依赖（如全局样式、路由守卫、环境变量），需 RAG 检索架构文档辅助规划'
    - '- 上下文爆炸：多轮交互 Token 激增，需压缩历史（摘要/关键决策/文件快照）而非全量保留'
    - '- 权限与安全：Agent 拥有写文件、执行命令、推代码权限，必须沙箱隔离、命令白名单、Git 受保护分支强制 Review'
    - '- 成本不可控：复杂任务往返 50+ 轮，Token 成本高，需设置预算上限与人工托底机制'
