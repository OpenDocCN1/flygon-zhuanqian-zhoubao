  life_analogy:
  - 想象注意力机制是一个**大型国际会议的同声传译系统**：
  - '- **Query** = 译员当前需要翻译的『源语言片段』（如『它』）'
  - '- **Key** = 会议记录中每个词的『语义标签』与『位置标签』（如『动物-主语-位置3』、『街道-宾语-位置6』）'
  - '- **Value** = 每个词携带的『完整语义内容向量』'
  - '- **相似度计算 (Q·K^T)** = 译员快速扫描记录，判断『它』与『动物』标签匹配度高、与『街道』匹配度低'
  - '- **缩放因子 1/√d** = 会议规模扩大时，防止『匹配度分数』过大导致译员『只盯着一个词看』（Softmax 饱和）'
  - '- **Softmax** = 将匹配度归一化为『注意力分配比例』：90% 给『动物』，5% 给『街道』，5% 给其他'
  - '- **加权求和 (×V)** = 译员按比例融合语义内容，输出准确翻译『它→那个动物』'
  - '- **多头注意力** = 组建『专家译员团』：译员A专管『指代消歧』、译员B专管『句法结构』、译员C专管『长距离依赖』，最后由总译员（W^O）综合输出'
  - '- **位置编码 (RoPE)** = 给每个词贴上『相对坐标』而非『绝对房间号』，无论会议多长、中途插入新议程，译员都能精准知道『它』离『动物』隔了几个词'
  - '- **FlashAttention** = 译员不把整本会议记录搬上台（HBM），而是分页（分块）只看当前需要的那几页（SRAM），大幅减少搬运次数'
  summary:
  - concept: 注意力机制/聚光灯直觉
    desc: 动态软寻址打破 RNN 串行瓶颈与 Seq2Seq 信息瓶颈，实现 O(1) 路径长度的全局建模
  - concept: Query/Key/Value
    desc: 注意力机制的三个基本角色：提问者、标签/索引、内容/值
  - concept: 缩放点积注意力
    desc: 标准化公式 Attention(Q,K,V)=softmax(QK^T/√d_k)V，利用矩阵乘法加速并通过缩放因子保证梯度稳定
  - concept: 缩放因子 1/√d_k
    desc: 抵消高维向量点积方差随维度增长而放大，防止 Softmax 进入饱和区导致梯度消失
  - concept: 多头注意力
    desc: 将 Q/K/V 投影到 h 个子空间并行计算再拼接，在不增加总参数量前提下实现多视角（句法/语义/位置）协作建模
  - concept: 子空间分工
    desc: 不同头自发学会捕捉不同语言学现象（如指代消歧、依存句法、位置模式），类似集成学习增强表达能力
  - concept: 位置编码
    desc: 为排列等变的注意力机制注入顺序信息，解决『狗咬人』vs『人咬狗』的歧义
  - concept: 正弦绝对位置编码
    desc: 固定三角函数编码，支持任意长度外推，线性关系便于模型学习相对位置
  - concept: 可学习绝对位置编码
    desc: nn.Embedding 形式，表达力强但限于训练最大长度，无外推能力
  - concept: RoPE 相对位置编码
    desc: 通过旋转矩阵将绝对位置注入 Q/K，使得注意力分数仅依赖相对距离，是目前长上下文（32k-1M）主流方案
  - concept: ALiBi
    desc: 直接在注意力分数加线性偏置 -m·|i-j|，无需位置嵌入向量参数
  - concept: 注意力可视化
    desc: 提取多层多头注意力矩阵绘制热力图，分析层级演进（浅层句法→深层语义）、头分工与聚焦度熵
  - concept: 注意力≠解释
    desc: 高注意力权重不等于因果贡献，存在『垃圾桶 Token』（如 [SEP]）吸引注意力现象，需结合梯度/消融实验验证
  - concept: FlashAttention
    desc: IO 感知算法，通过分块计算减少 HBM 读写，显著加速长序列注意力计算并降低显存占用
  exercises:
  - 'no': 1
    title: 手算一次缩放点积注意力
    contents:
    - 给定单头注意力输入：
    - Q = [[1, 0, 1], [0, 1, 1]]  (2×3)
    - K = [[1, 0, 0], [0, 1, 0], [1, 1, 1]]  (3×3)
    - V = [[2, 0], [0, 2], [1, 1]]  (3×2)
    - d_k = 3
    - ''
    - 请按步骤计算：
    - 1. 计算原始注意力分数 S = QK^T (形状 2×3)
    - 2. 计算缩放后分数 S' = S / √d_k
    - 3. 对 S' 每行做 Softmax 得到注意力权重 A
    - 4. 计算最终输出 O = A V (形状 2×2)
    - ''
    - 思考题：
    - '- 若去掉缩放因子（即不除以 √3），当 d_k 增大到 100 时，Softmax 输出会呈现什么极端分布？对梯度有何影响？'
    - '- 为什么缩放因子是 √d_k 而不是 d_k 或其他数量级？'
  - 'no': 2
    title: 多头注意力参数量与维度验证
    contents:
    - 某 Transformer 模型配置：d_model = 512, h = 8 个头。
    - ''
    - 计算与验证：
    - 1. 每个头的键/查询/值维度 d_k = d_v 是多少？
    - 2. 单头投影矩阵 W^Q, W^K, W^V 的形状分别为？总投影参数量（不含 bias）是多少？
    - 3. 输出投影矩阵 W^O 的形状与参数量？
    - 4. 多头注意力总参数量与单头注意力（h=1, d_k=512）对比，是否基本持平？
    - ''
    - 思考题：
    - '- 若将头数 h 增加到 64（d_k=8），单头表达能力会如何变化？可能引入什么问题？'
    - '- 为什么标准实现中要求 d_k = d_v = d_model / h？若放宽该约束会怎样？'
  - 'no': 3
    title: 位置编码外推能力实验设计
    contents:
    - 设计一个最小化实验，对比三种位置编码在长度外推任务上的表现：
    - 任务：训练模型在序列长度 L=128 上学会『复制输入序列倒序』任务，测试在 L=256、512 上的零样本泛化准确率。
    - ''
    - 三种编码方案：
    - A. 正弦绝对位置编码
    - B. 可学习绝对位置编码
    - C. RoPE 相对位置编码 (base=10000)
    - ''
    - 实验步骤：
    - 1. 搭建相同架构的 2 层小型 Transformer Encoder
    - 2. 分别替换位置编码模块，其他超参保持一致
    - 3. 在 L=128 训练至收敛，记录 L=128/256/512 上的 Token 级准确率
    - 4. 绘制长度-准确率曲线
    - ''
    - 分析问题：
    - '- 为什么方案 B 在 L>128 时准确率会崩塌？'
    - '- 方案 A 虽然支持外推，但高频分量在长距离为何易混淆？'
    - '- 方案 C 为何能稳定外推？若将 base 从 10000 改为 1e6，配合 YaRN 微调会有何效果？'
