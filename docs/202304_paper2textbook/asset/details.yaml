  life_analogy:
  - 想象图形渲染管线是一个**现代化建筑工地**：
  - '- **Canvas 2D** = **装修队**：工具简单（刷子/滚筒），直接在墙面（画布）作画，即时模式‘想画就画’，适合小面积精细装修（图表/2D
    游戏），但不保留蓝图，重画需全凭记忆。'
  - '- **WebGL** = **传统施工队**：需要详细图纸（着色器 GLSL），材料（Buffer/Texture）得提前按规格打包运到现场（显存），工头（CPU）通过对讲机（Draw
    Call）指挥工人（GPU）干活。状态机模型像‘一根绳子拴所有人’，换个任务全员切换状态，效率受限。扩展机制像‘临时申请特种设备’，审批通过才能用新工艺。'
  - '- **WebGPU** = **智能模块化建筑工厂**：'
  - '  - **GPUDevice** = **工厂总控台**'
  - '  - **Pipeline (PSO)** = **预制好的标准化生产线**（渲染管线/计算管线），一旦建好不可变，切换极快。管线缓存像‘生产线模具’，预热后即刻生产。'
  - '  - **BindGroup** = **标准化物料托盘**，显式绑定 Buffer/Texture/Sampler，换任务只需换托盘。'
  - '  - **Compute Shader** = **通用加工车间**，不只盖房，还能加工零件（物理模拟/布局计算）。'
  - '  - **CommandEncoder/Queue** = **自动化物流调度系统**，支持多线程预录指令（CommandBuffer），最后统一发运。'
  - '- **渲染引擎架构** = **项目管理层**：'
  - '  - **场景图** = **建筑 BIM 模型**（保留模式），树状管理所有构件（节点），自动计算世界坐标。'
  - '  - **脏标记** = **变更通知单**，只重新处理变动的楼层。父子层级合并通知单、增量计算结构位移。'
  - '  - **视锥剔除** = **视野范围划定**，只施工看得见的区域。'
  - '  - **批次合并** = **集中采购/集中施工**，同材质同工艺一次性搞定。'
  - '  - **Layer 合成** = **分层施工图**，地基/主体/装修/外立面分层并行，最后合成交付。'
  - '- **高性能拓扑图实战** = **超大型城市规划项目**（10 万节点）：'
  - '  - **双引擎兜底** = **主力军（WebGPU）+ 后备军**'
  - '  - **Worker 布局** = **规划院离线算好坐标**，只发坐标表给现场。'
  - '  - **实例化渲染** = **标准化预制构件**（节点/边），现场只摆放位置（Instance Buffer）。'
  - '  - **视口裁剪** = **只盖在视野内的楼**。四叉树/均匀网格像‘分区地籍图’，快速定位施工区。'
  - '  - **拾取交互** = **给每栋楼贴隐形二维码（颜色拾取）或发 GPS 坐标（几何测试）**。'
  summary:
  - concept: Canvas 2D 即时模式
    desc: 状态机绘图模型，适合 2D 非 3D 场景，核心优化点为 Path2D 复用、矩阵变换、OffscreenCanvas 多线程、高 DPI 缩放、路径分段绘制
  - concept: WebGL 可编程管线
    desc: GLSL 着色器控制 GPU，VAO 封装顶点状态，实例化绘制减少 Draw Call，受限于状态机模型与驱动开销，扩展机制解锁高级能力，多渲染目标支持延迟渲染
  - concept: WebGPU 现代 API
    desc: 显式资源绑定、不可变 PSO、BindGroup 机制、计算着色器通用计算、WGSL 强类型语言，映射 Vulkan/Metal/DX12，管线缓存优化首帧性能，错误处理机制完善
  - concept: 渲染引擎架构
    desc: 保留模式场景图 + 脏标记增量更新 + 视锥剔除 + 批次合并 + 多层合成 + 插件化，实现业务与渲染解耦，父子脏标记合并与增量矩阵计算提升更新效率
  - concept: GPU 实例化渲染
    desc: 单份几何体 + 实例属性 Buffer，一次 Draw Call 绘制海量同构物体（节点/边/粒子），核心高性能手段
  - concept: 双引擎兜底策略
    desc: WebGPU 优先发挥现代 GPU 性能，降级 Canvas 2D/OffscreenCanvas 保证兼容性，统一抽象接口层
  - concept: Web Worker 布局卸载
    desc: 力导向等计算密集型布局算法移出主线程，仅传输 Float32Array 位置增量，避免阻塞交互
  - concept: 视口裁剪与空间索引
    desc: CPU 端四叉树/均匀网格筛选可见实例，结合相机矩阵反向变换，仅上传可见子集数据，查询复杂度 O(log n)
  - concept: 交互拾取方案
    desc: 颜色拾取（离屏渲染 ID 编码颜色 readPixels）与 CPU 几何测试（空间索引加速）双模式适配
  - concept: 语义缩放 (LOD)
    desc: 根据缩放级别动态调整渲染细节（隐藏标签/简化几何/降级纹理），平衡性能与视觉效果
  exercises:
  - 'no': 1
    title: Canvas 2D 变换矩阵与命中测试手算
    contents:
    - 给定一个矩形节点：局部坐标系下位于 (100, 100)，宽 50，高 30。
    - 当前 Canvas 变换矩阵（SVGMatrix 顺序）为：scale(2, 1.5) → rotate(45deg) → translate(200,
      100)。
    - 1. 计算该节点在屏幕坐标系下的四个顶点坐标。
    - 2. 鼠标点击屏幕坐标 (320, 250)，请通过**反向变换矩阵**将其映射回节点局部坐标系，判断是否命中该矩形。
    - 3. 如果节点层级嵌套（父节点有 transform），反向变换的矩阵乘法顺序应如何调整？
    - 4. 在高 DPI 屏幕（devicePixelRatio=2）下，Canvas 绘制缩放与坐标映射需做何调整？
  - 'no': 2
    title: WebGL 实例化渲染管线设计
    contents:
    - 需渲染 50,000 个相同三角形（顶点数据固定），每个三角形拥有独立的：位置、颜色、缩放、旋转角度。
    - 1. 设计 VBO/IBO/EBO 布局：基础几何体 Buffer 与 Instance Buffer 如何分离？顶点着色器中 `gl_InstanceID`
      如何使用？
    - 2. 编写顶点着色器核心逻辑：从 Instance Buffer 读取实例属性，构建模型矩阵，结合 MVP 矩阵输出 `gl_Position`。
    - 3. 分析：若实例数增加至 500,000，`drawArraysInstanced` 单次调用可能遇到什么硬件/驱动限制？应如何分批次提交？
    - 4. 启用 `OES_element_index_uint` 扩展后，索引缓冲区最大支持多少顶点？这对大规模网格渲染有何意义？
  - 'no': 3
    title: WebGPU BindGroup 与 Compute Shader 实战
    contents:
    - 实现一个简易的 GPU 粒子系统（10,000 粒子），每帧在 Compute Shader 中更新位置：`pos += vel * dt`，边界反弹。
    - 1. 定义 `BindGroupLayout`：包含只读 Uniform Buffer（dt、边界）、存储缓冲区（位置、速度，读写）。对应的 WGSL
      结构体定义是什么？
    - 2. 编写 Compute Shader 入口点：`@compute @workgroup_size(64)`，如何计算全局索引并边界检查？如何实现边界反弹逻辑？
    - '3. 渲染阶段：如何复用位置 Buffer 作为顶点着色器的只读存储缓冲区？`GPURenderPipeline` 的顶点缓冲区布局应如何配置（stepMode:
      ''instance''）？'
    - 4. 管线缓存机制下，如何实现渲染管线与计算管线的预热编译，避免首帧卡顿？
  - 'no': 4
    title: 渲染引擎脏标记与批次合并算法
    contents:
    - 场景图包含 1000 个节点，树深 5 层。某叶子节点修改了 `rotation`。
    - 1. 描述脏标记传播流程：从该叶子到根节点，哪些标记会被置位（TRS_DIRTY, WORLD_MATRIX_DIRTY, BOUNDS_DIRTY 等）？如何避免重复传播？父子层级脏标记如何合并？
    - 2. 渲染队列构建阶段：遍历场景图收集可见 `RenderObject`。设计一个批次合并算法：按 (Pipeline, BindGroupLayout,
      BlendState) 分组，组内再按几何体合并。伪代码实现核心分组逻辑。
    - 3. 透明物体排序问题：Painter's Algorithm 失效场景举例（相交三角形），工程上常用的妥协方案（按包围盒中心距排序）有何缺陷？
    - 4. 增量世界矩阵计算：若仅父节点平移，子节点世界矩阵如何通过增量矩阵快速更新，而非完全重算？
  - 'no': 5
    title: 万级拓扑图性能剖析与优化决策
    contents:
    - 某拓扑图场景：80,000 节点，150,000 边。WebGPU 模式下首帧渲染 45ms，后续帧 16ms（目标 16.6ms）。Profile 显示：
    - '- `GPUQueue.writeBuffer` (Instance Buffer 更新) 耗时 8ms'
    - '- `beginRenderPass` 至 `endRenderPass` 耗时 6ms'
    - '- `readPixels` (颜色拾取) 耗时 12ms（仅交互时触发）'
    - 1. 针对 `writeBuffer` 耗时：提出**增量更新**策略（仅上传位移 > 阈值的实例），如何设计 CPU 端脏实例索引数组？
    - 2. 针对渲染通道耗时：分析是否为顶点/片元着色器 ALU 瓶颈还是带宽/光栅化瓶颈？建议用 WebGPU 时间查询（`writeTimestamp`）如何区分？
    - 3. 针对拾取耗时：对比**颜色拾取**与**CPU 空间索引几何测试**在移动端 GPU/CPU 的优劣势，给出动态切换策略。
    - 4. 若需支持 500,000 节点，单 Buffer 实例化方案面临何种内存/带宽瓶颈？需引入何种 LOD/聚类渲染架构？
    - 5. 四叉树与均匀网格在动态场景下的构建/更新开销对比，拓扑图视口裁剪选哪种更优？
  units:
  - 'no': 1
    name: Canvas 2D 即时模式渲染 —— 像画家一样在画布上挥毫
    points:
    - '**为什么需要这个概念？**'
    - '- 浏览器原生提供 2D 绘图能力，无需复杂的着色器编程，适合图表、简单动画、图片处理等非 3D 场景'
    - '- 即时模式下开发者直接发出绘制指令，状态即代码，心智模型简单，上手快'
    - '- 解决 DOM 元素过多导致的性能瓶颈（如万级节点拓扑图），通过单一 Canvas 统一绘制大幅降低内存占用'
    - '**核心定义**'
    - '- 即时模式：每帧调用 `draw()` 重绘整个场景，画布不保留对象树，开发者需自行维护场景状态（节点位置、样式等）'
    - '- 核心 API：`CanvasRenderingContext2D` 提供路径（`Path2D`）、变换（`transform`/`setTransform`）、合成（`globalCompositeOperation`）、绘图（`fill`/`stroke`/`drawImage`）四大能力集'
    - '**关键性质**'
    - '- 状态机模型：`save()`/`restore()` 栈管理绘图状态（颜色、线宽、变换矩阵），避免状态污染'
    - '- 坐标系变换：基于 3x3 齐次矩阵实现平移、缩放、旋转、倾斜，`transform(a,b,c,d,e,f)` 直接操作矩阵'
    - '- 命中测试：无原生事件分发，需手动实现 `isPointInPath()` 或几何反向变换将屏幕坐标映射至模型坐标判断'
    - '- 离屏渲染：`OffscreenCanvas` 配合 `Worker` 实现主线程解耦，避免复杂绘制阻塞交互'
    - '- 高 DPI 支持：需手动缩放 `canvas.width = cssWidth * dpr; ctx.scale(dpr, dpr)`，否则模糊'
    - '- 路径限制：路径过长（> 65535 点）可能触发浏览器限制，需拆分为多个 `Path2D` 或使用 `LineTo` 分段'
    - '**典型例子**'
    - '- ECharts/Chart.js 底层渲染器：利用 `Path2D` 缓存复杂图形路径，结合 `globalCompositeOperation=''lighter''`
      实现光效叠加'
    - '- 图片编辑器滤镜预览：`drawImage` + `filter` 属性实时渲染，导出时复用相同逻辑'
    - '- 万节点拓扑图：节点数据存储于 `Float32Array`，每帧遍历调用 `arc`/`rect` 批量绘制，配合 `OffscreenCanvas`
      计算布局'
    - '**边界条件**'
    - '- 频繁创建 `Path2D` 对象导致 GC 压力，复杂静态图形应预构建并缓存 `Path2D` 实例'
    - '- 即时模式不保留场景图，无法原生支持 CSS 动画/选择器，需自行实现场景图层或引入保留模式库'
    sources:
    - paper: 20230418_040.md
      role: origin
    excerpts:
    - 掌握 `Path2D` 复用路径、矩阵变换数学、`globalCompositeOperation` 混合模式、事件坐标反向变换拾取、OffscreenCanvas
      多线程渲染、高 DPI 缩放策略、路径长度限制与分段绘制。
  - 'no': 2
    name: WebGL 可编程管线 —— 向 GPU 发送指令的“汇编语言”
    points:
    - '**为什么需要这个概念？**'
    - '- Canvas 2D 无法满足大规模粒子、自定义着色效果、3D 场景等高性能/高自由度需求'
    - '- WebGL 暴露 GPU 可编程管线（顶点/片元着色器），让开发者完全掌控顶点变换与像素着色过程'
    - '- 解决 Draw Call 过多导致的 CPU-GPU 通信瓶颈，通过实例化绘制、合并 Buffer 实现万级物体高效渲染'
    - '**核心定义**'
    - '- 着色器：GLSL ES 代码，顶点着色器处理属性->裁剪空间坐标，片元着色器输出像素颜色'
    - '- 缓冲区：VBO 存顶点属性，EBO 存索引，VAO 封装顶点输入状态（属性指针、启用位、绑定的 Buffer）'
    - '- 统一变量：Uniform 传递全局常量（MVP 矩阵、材质参数），Texture 采样图像数据'
    - '- 绘制调用：`drawArrays`/`drawElements`/`drawArraysInstanced`/`drawElementsInstanced`
      发起 GPU 执行'
    - '**关键性质**'
    - '- 状态机模型：大量全局状态（绑定点、启用位、混合模式、深度测试），切换开销大，需按 Pipeline/Shader/Texture 批次排序'
    - '- 属性分发：`vertexAttribPointer` 定义步长/偏移/归一化，`enableVertexAttribArray` 激活，`vertexAttribDivisor`
      开启实例化属性'
    - '- 纹理单元：`activeTexture` + `bindTexture` 绑定采样器，片元着色器 `uniform sampler2D` 对应单元索引'
    - '- 同步原语：`fenceSync`/`clientWaitSync` 控制 CPU-GPU 同步，避免映射 Buffer 时阻塞'
    - '- 扩展机制：`OES_element_index_uint` 支持 32 位索引，`WEBGL_draw_buffers` 支持多渲染目标'
    - '**典型例子**'
    - '- 粒子系统：单个 Buffer 存位置/速度/生命周期，顶点着色器模拟物理更新，`drawArraysInstanced` 一次绘制 10 万粒子'
    - '- 实例化渲染拓扑图边：边几何体为单位线段，Instance Buffer 存起止点坐标/颜色，顶点着色器按实例 ID 变换拉伸'
    - '- 后处理链：渲染到 Framebuffer 纹理 -> 全屏三角形采样 -> 片元着色器叠加 Bloom/FXAA/ColorGrading'
    - '**边界条件**'
    - '- GLSL ES 1.00 无整数纹理、无几何着色器、无计算着色器，复杂算法需多 Pass 或模拟'
    - '- `uniform` 数量/向量长度受限（如 `MAX_VERTEX_UNIFORM_VECTORS` 通常 256），大规模骨骼动画需用 Texture
      Buffer 存矩阵'
    - '- 移动端 GPU 带宽敏感，过度采样/高分辨率 Framebuffer 易成性能杀手，需 Tile-based 渲染优化'
    - '- 高 DPI 需手动配置帧缓冲区尺寸 `canvas.width = cssWidth * dpr`，视口同步缩放'
    sources:
    - paper: 20230418_040.md
      role: origin
    excerpts:
    - 深入 GLSL ES 语法、顶点/片元着色器协作、VAO/VBO/EBO 缓冲区管理、纹理单元与采样器、实例化绘制减少 Draw Call、扩展机制解锁高级能力、多渲染目标支持延迟渲染、高
      DPI 缓冲区配置。
  - 'no': 3
    name: WebGPU 现代图形 API —— 显式控制 GPU 的“现代操作系统”
    points:
    - '**为什么需要这个概念？**'
    - '- WebGL 状态机模型隐式依赖多，难以多线程录制命令，驱动开销大，无法充分发挥现代 GPU（Vulkan/Metal/DX12）性能'
    - '- WebGPU 引入显式资源管理、管线状态对象（PSO）、绑定组布局，映射现代图形 API，支持计算着色器通用计算'
    - '- 解决 WebGL 无法高效实现的：多线程命令缓冲录制、渲染/计算管线复用、细粒度资源生命周期与同步控制'
    - '**核心定义**'
    - '- `GPUDevice`：核心接口工厂，创建 Buffer/Texture/BindGroupLayout/Pipeline/CommandEncoder'
    - '- `GPUQueue`：提交 `GPUCommandBuffer`、写入 Buffer/Texture 数据（`writeBuffer`/`copyExternalImageToTexture`）'
    - '- `GPURenderPipeline`/`GPUComputePipeline`：不可变管线状态对象（着色器、顶点布局、混合/深度/模板状态、绑定组布局）'
    - '- `GPUBindGroup`/`GPUBindGroupLayout`：显式描述符集，将 Buffer/Texture/Sampler 绑定到着色器
      `@group(@binding)` 变量'
    - '- WGSL：WebGPU Shading Language，强类型、模块化、指针/数组/结构体一等公民，编译目标为 SPIR-V'
    - '**关键性质**'
    - '- 资源创建与使用分离：`createBuffer` 分配显存，`mapAsync`/`writeBuffer` 上传数据，`unmap` 释放 CPU
      访问权，所有权转移显式'
    - '- 渲染通道：`beginRenderPass` 定义色彩/深度附件及 Load/StoreOp，隐式 Tile-based 优化友好'
    - '- 计算着色器：`dispatchWorkgroups` 启动网格，`workgroup` 共享内存、屏障同步，实现物理模拟/布局计算/图像处理全 GPU
      离线'
    - '- 错误处理：`device.lost` Promise、`uncapturederror` 事件，错误非阻塞但需监听，调试依赖标签 `label`
      字段'
    - '- 管线缓存：预创建 Pipeline 避免运行时编译开销，首帧渲染前预热'
    - '**典型例子**'
    - '- 百万节点力导向布局：计算着色器读位置/速度 Buffer，写新位置，`storage` 绑定读写同 Buffer，无需 CPU 往返'
    - '- 可视化引擎双引擎兜底：WebGPU 优先，降级 Canvas 2D；核心渲染逻辑抽象为 `RenderPassEncoder` 统一接口'
    - '- 后处理 Pipeline：预创建 `RenderPipeline`（含 BindGroupLayout），每帧仅更新 `BindGroup` 资源视图，避免管线重建'
    - '**边界条件**'
    - '- 浏览器支持度：Chrome/Edge 稳定支持，Firefox/Safari 需开启标志位或等待版本更新，生产环境需 Polyfill（如 `webgpu-polyfill`
      基于 WebGL2 模拟）'
    - '- 无几何/曲面细分/网格着色器，复杂几何处理仍需顶点着色器+计算着色器预处理或 CPU 端生成'
    - '- `bindGroup` 创建开销较大，动态资源更新建议使用 `dynamicOffset` 或预分配 `BindGroup` 池复用'
    - '- WGSL 与 GLSL 语法差异大（如矩阵列主序、构造函数语法、内置函数名），迁移成本高，建议统一维护 WGSL 源码转译'
