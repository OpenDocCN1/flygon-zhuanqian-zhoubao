- learning_targets:
  - 理解 Core Web Vitals 指标体系的定义、采集原理与工程化达标基线
  - 掌握构建产物优化的分包策略、Tree Shaking 原理、压缩算法选型与体积预算门禁
  - 掌握资源加载策略中 Preload/Prefetch/Preconnect/Modulepreload 与 Service Worker 缓存策略的工程落地
  - 掌握运行时渲染优化中虚拟列表、防抖节流、Web Worker 卸载主线程、Scheduler.yield 调度的实现原理与适用场景
  - 能够搭建包含 SDK 埋点、数据上报、存储查询、可视化看板与告警的全链路前端性能监控平台
  - 理解生财有术社群的核心资源体系（风向标、航海、精华帖、龙珠）与新人成长四阶段模型
  - 掌握利用信息差、工具差、平台红利实现从0到1变现的核心方法论（最小闭环、复制模仿、资源整合）
  - 理解 AI 赋能工作流（Prompt Engineering、RPA、Workflow Automation）在内容生产、决策辅助、自动化运营中的落地范式
  concept_map:
  - 前端性能工程
  - ├── 核心指标体系
  - │   ├── LCP (最大内容绘制) —— 衡量加载速度，目标 < 2.5s
  - │   ├── CLS (累积布局偏移) —— 衡量视觉稳定性，目标 < 0.1
  - │   ├── INP (下一帧绘制交互延迟) —— 衡量整体交互响应，目标 < 200ms
  - │   ├── FID (首次输入延迟) —— 已被 INP 取代，历史指标
  - │   └── TTFB (首字节时间) —— 衡量服务端响应，基础指标
  - ├── 构建产物优化
  - │   ├── 代码分割策略 (splitChunks/manualChunks) —— 按路由/组件库/高频依赖分包
  - │   ├── Tree Shaking 原理 —— 基于 ES Module 静态结构消除死代码，依赖 sideEffects 标记
  - │   ├── 压缩算法对比 (Terser/esbuild/CSSnano) —— 权衡压缩率与构建速度
  - │   └── 体积预算与 CI 门禁 (rollup-plugin-visualizer/bundlesize) —— 阻断超标合并
  - ├── 资源加载策略
  - │   ├── Preload (rel=preload) —— 高优先级获取首屏关键资源 (字体/关键CSS/JS/Hero图)
  - │   ├── Prefetch (rel=prefetch) —— 低优先级预取下一页资源，利用空闲带宽
  - │   ├── Preconnect/DNS-prefetch —— 提前建立跨域连接，消除握手延迟
  - │   ├── Modulepreload —— 专为 JS 模块预加载并预编译依赖图
  - │   └── Service Worker / Workbox —— 离线缓存、Stale-While-Revalidate、版本更新广播
  - ├── 运行时渲染优化
  - │   ├── 虚拟列表 —— 仅渲染可视区 DOM，支撑 10万+ 数据流畅滚动
  - │   ├── 防抖/节流 —— 高频事件回调频率控制，减少不必要计算
  - │   ├── Web Worker —— 独立线程卸载加密/压缩/解析/矩阵运算等纯计算任务
  - │   └── 任务调度 (requestIdleCallback/scheduler.yield) —— 拆解长任务，让出主线程提升 INP
  - └── 性能监控平台
  - '    ├── SDK 采集端 —— 轻量采集 Web Vitals/资源错误/长任务/内存'
  - '    ├── 数据上报 (Beacon API/fetch keepalive) —— 可靠、非阻塞、批量压缩'
  - '    ├── 存储查询 (ClickHouse/Doris) —— OLAP 数据库支持高基数标签秒级聚合'
  - '    ├── 可视化看板 (Grafana) —— P75 趋势/Top 慢页面/错误率分布'
  - '    └── 告警体系 (Alertmanager) —— 阈值触发钉钉/飞书/企微通知'
  - 生财有术知识体系
  - ├── 核心资源矩阵
  - │   ├── 风向标 —— 每日精选赚钱情报，中标2000+条构成机会雷达
  - │   ├── 航海实战 —— 保证金制训练营，4.3w人次实战产出航海手册
  - │   ├── 精华帖 —— 3900+篇实战经验沉淀，被誉为普通人赚钱史
  - │   ├── 龙珠体系 —— 贡献激励与身份认证，驱动利他分享飞轮
  - │   ├── 航海家俱乐部 —— 高阶社群与项目孵化器，汇聚实战创业者
  - │   ├── 同城小局 —— 线下深度链接机制，40+城市98场534人参与
  - │   ├── 资源对接板块 —— 价值交换市场，促进货源/渠道/技能精准匹配
  - │   └── 问题求助互助小分队 —— 200人响应团队，保障每个提问被认真对待
  - ├── 新人成长四阶段模型
  - │   ├── 新手期 (0-1个月) —— 建立信心/开始行动/赚第一块钱
  - │   ├── 探索期 (1-6个月) —— 持续试错/挖掘价值/跟随高手/资源对接
  - │   ├── 增长期 (6-18个月) —— 找到方向/收入增加/全力突破/提升影响力
  - │   └── 放大期 (18个月+) —— 合作共赢/孵化项目/组团打怪/搭建矩阵
  - ├── 核心方法论
  - │   ├── 最小闭环跑通 —— 选品/内容/发布/成交/交付完整跑通
  - │   ├── 复制模仿微创新 —— 像素级模仿跑通后单点微创新
  - │   ├── 信息差跨层搬运 —— 识别圈层差异将方案从A迁移至B
  - │   ├── 利他协作生财 —— 真诚分享激活资源流动，构建互助共创生态
  - │   └── AI赋能工作流 —— Prompt Engineering + RPA + Workflow Automation
  - └── 认知跃迁路径
  - '    ├── 认知变现论 —— 赚钱本质是认知变现，认知边界即收入边界'
  - '    ├── 螺旋式上升定律 —— 真实突破非线性，需耐心试错等待量变质变'
  - '    ├── 杠杆决定天花板 —— 代码/媒体杠杆 > 资本/劳动力杠杆'
  - '    ├── 私域信任资产论 —— 核心非流量池管理，而是信任深度与高频触达经营'
  - '    └── 环境决定论 —— 身边是谁决定成为谁，需物理置换高认知密度环境'
  life_analogy:
  - 想象前端性能优化是一场‘用户体验接力赛’：
  - '- **核心指标 (LCP/CLS/INP)** = **裁判的计分规则**：明确告诉你‘跑得快’(LCP)、『跑得稳』(CLS)、『反应快''(INP)
    的量化标准，只看 P75 成绩单。'
  - '- **构建产物优化** = **运动员‘减重装备’**：通过分包、摇树、压缩把‘背包’(JS Bundle)瘦身，减少起跑负重，跑得更轻快。'
  - '- **资源加载策略** = **赛前‘预热与补给站布局’**：Preload 是‘关键补给提前放到手边’，Prefetch 是‘利用休息时间把下一段路的水放好’，Preconnect
    是‘提前把跑道铺好’。'
  - '- **运行时渲染优化** = **比赛中‘节奏控制与外包’**：虚拟列表是‘只看眼前一米路’，防抖节流是‘不跟着观众起哄乱跑’，Web Worker 是‘把算账、整理装备的活儿外包给教练车(副线程)’，主线程专心‘跑步’。'
  - '- **性能监控平台** = **全程‘数据分析师团队’**：实时记录每圈圈速、心率(长任务)、受伤情况(报错)，赛后复盘出报告，下场比赛跑得更强。'
  - 想象生财有术是一座‘赚钱武林秘籍宝库’：
  - '- **风向标** = **每日情报快报**：每天清晨送达最新江湖动态、秘籍碎片、避坑指南。'
  - '- **航海实战** = **带教练下副本练级**：交保证金、拿地图、跟大佬打怪、爆装备(航海手册)、上岸退还保证金。'
  - '- **精华帖** = **历代大神心法合集**：3900+篇实战笔记，覆盖选品、引流、转化、私域全门派绝学。'
  - '- **龙珠体系** = **门派贡献度排名**：分享心得得龙珠，集齐七颗召唤神龙(专属见面会、分红、俱乐部邀请)。'
  - '- **四阶段成长** = **从初出茅庐到一代宗师**：新手期练内功(信心)、探索期闯江湖(试错)、增长期练绝技(单点突破)、放大期建帮派(组团打怪)。'
  - '- **AI赋能** = **得《葵花宝典》神功**：Prompt当心法、RPA作轻功、Workflow练内力，一人即成一派(超级个体)。'
  summary:
  - concept: LCP (Largest Contentful Paint)
    desc: 衡量加载速度，标记视口内最大内容元素渲染完成时间，工程化目标 < 2.5s (P75)
  - concept: CLS (Cumulative Layout Shift)
    desc: 衡量视觉稳定性，量化页面意外移动程度，工程化目标 < 0.1 (P75)
  - concept: INP (Interaction to Next Paint)
    desc: 衡量整体交互响应，观察全生命周期所有交互延迟百分位，工程化目标 < 200ms (P75)，已取代 FID
  - concept: TTFB (Time to First Byte)
    desc: 衡量服务端响应速度，资源请求到收到第一字节的耗时，是后端与网络性能的基础指标
  - concept: 代码分割
    desc: 将打包产物拆分为多个 Chunk 按需/并行加载，核心配置 splitChunks 与 manualChunks，按路由/组件库/高频依赖分包
  - concept: Tree Shaking
    desc: '基于 ES Module 静态结构消除未引用代码，依赖 package.json 中 sideEffects: false 标记纯模块'
  - concept: Preload / Prefetch / Preconnect
    desc: 资源加载指令：Preload 高优先级获取当前页关键资源，Prefetch 低优先级预取下一页资源，Preconnect 提前建立跨域连接
  - concept: Modulepreload
    desc: 专为 JS 模块设计，预加载并预编译依赖图，解决模块嵌套请求瀑布流问题
  - concept: Service Worker / Workbox
    desc: 拦截请求实现离线缓存、Stale-While-Revalidate 策略、版本更新广播，实现离线首屏与秒开体验
  - concept: 虚拟列表
    desc: 仅渲染可视区 + 缓冲区 DOM，滚动时复用节点更新数据，支撑 10万+ 条数据流畅滚动，大幅降低内存占用
  - concept: Web Worker
    desc: 独立线程运行 JS，无法访问 DOM，适合加密/压缩/解析/矩阵运算等纯计算任务卸载主线程，通过 postMessage 通信
  - concept: Scheduler.yield / requestIdleCallback
    desc: 主动让出主线程控制权或在空闲期执行低优先级任务，拆解长任务避免阻塞高优先级交互，提升 INP
  - concept: 前端性能监控平台
    desc: SDK采集 -> Beacon上报 -> ClickHouse存储 -> Grafana可视化 -> Alertmanager告警，建立可观测、可量化、可回溯的性能工程闭环
  - concept: 风向标
    desc: 生财有术核心情报雷达，每日精选赚钱动态、案例拆解、工具教程，中标2000+条构成机会数据库
  - concept: 航海实战
    desc: 保证金制训练营，提供资料包、高手分享、陪伴体系，第六期4.3w人次实战产出航海手册
  - concept: 精华帖
    desc: 6年累积3900+篇高手实战经验精选，被誉为‘一部普通人的真实赚钱史’
  - concept: 龙珠体系
    desc: 贡献激励与身份认证体系，利他分享得碎片/龙珠，享专属权益(见面会/分红/俱乐部/门票)
  - concept: 新人四阶段模型
    desc: 新手期(信心/行动) -> 探索期(试错/匹配) -> 增长期(聚焦/突破) -> 放大期(组团/矩阵)
  - concept: 最小闭环
    desc: 选品/选题、内容生产、发布引流、成交转化、交付售后完整跑通一遍，验证商业模式可行性
  - concept: 信息差跨层搬运
    desc: 识别圈层A有方案、圈层B有需求无方案，将方案从A迁移至B，核心壁垒在于圈层敏锐度与执行深度
  - concept: AI赋能三板斧
    desc: Prompt Engineering(提示词工程) + RPA(流程自动化) + Workflow Automation(工作流自动化)，普通人红利期在于成为AI应用工程师
  exercises:
  - 'no': 1
    title: Core Web Vitals 指标拆解与优化定位
    contents:
    - 某电商首页 LCP 为 4.2s (P75)，CLS 为 0.25，INP 为 350ms。请分别分析：
    - 1. LCP 超标的可能成因有哪些？(提示：从 TTFB、资源加载、渲染阻塞三个阶段排查)
    - 2. CLS 超标的典型场景是什么？如何通过 DevTools Performance 面板定位偏移元素？
    - 3. INP 超标通常由什么引起？如何利用 Long Task API 与脚本评估器找到罪魁祸首？
    - 4. 如果该页面为 SSR 架构，TTFB 占 LCP 的 60%，优化优先级应如何排序？
  - 'no': 2
    title: 构建产物体积优化实战
    contents:
    - 某 Vue 3 + Vite 项目首屏 JS gzip 后 450KB，目标压缩至 150KB 以内。请设计优化方案：
    - 1. 如何使用 `rollup-plugin-visualizer` 分析体积构成？重点关注哪些大型依赖？
    - 2. `lodash` 全量引入导致 70KB 体积，请对比 `lodash-es` + Tree Shaking、`babel-plugin-lodash`、替换为原生
      API 三种方案的优劣势。
    - 3. 如何配置 `manualChunks` 实现 `vue`/`vue-router`/`pinia` 等基础库的长缓存复用？缓存键如何设计？
    - '4. `sideEffects: false` 误标会导致什么后果？如何在保留 CSS 副作用的前提下开启 Tree Shaking？'
    - 5. Terser 压缩耗时过长，如何引入 `esbuild` 替代并开启并行压缩？
  - 'no': 3
    title: 资源加载策略决策与调试
    contents:
    - 某单页应用(SPA)首屏包含：Hero Banner 图片(200KB)、主字体(50KB)、路由级组件 JS(150KB)、三方统计 SDK(80KB)。
    - 1. 哪些资源适合 `preload`？哪些适合 `prefetch`？请说明理由。
    - 2. 字体文件加 `preload` 时必须添加 `crossorigin` 属性，为什么？若缺失会发生什么？
    - 3. 该应用部署在 HTTP/2 服务器，是否还需要 `preconnect`？针对三方统计 SDK 域名如何处理？
    - 4. 引入 `modulepreload` 解决 JS 依赖瀑布流，如何在 Vite/Rollup 中自动生成这些链接？
    - 5. 配置 Workbox 实现：静态资源 CacheFirst，API 请求 NetworkFirst 并设置超时 5s，HTML StaleWhileRevalidate。请写出核心
      `runtimeCaching` 配置片段。
  - 'no': 4
    title: 运行时长任务拆解与主线程卸载
    contents:
    - 某数据大屏页面包含 5 万行表格渲染、实时图表计算、用户输入联动筛选。主线程长任务频繁超 200ms，INP 指标达 800ms。
    - 1. 表格渲染优化：对比 `react-window` 固定高度虚拟列表与动态高度实现的差异，动态高度如何估算与缓存？
    - 2. 图表计算卸载：将 ECharts 数据转换、坐标计算移至 Web Worker，主线程仅负责 `setOption` 绘制。设计 Worker 通信协议(输入/输出数据结构)及错误兜底机制。
    - 3. 输入联动优化：使用 `useDeferredValue` 或 `useTransition` 区分紧急/非紧急更新，如何判断哪些状态属于‘非紧急’？
    - 4. 使用 `scheduler.yield()` 拆解一个 500ms 的同步递归树遍历函数，改造为异步生成器模式，伪代码实现。
    - 5. 如何在 Performance 面板中验证优化效果？关注 Long Task 红三角、Main 火焰图、Interaction 延迟标记。
  - 'no': 5
    title: 性能监控平台 SDK 设计与告警策略
    contents:
    - 设计一个轻量级前端性能监控 SDK (目标 < 5KB gzip)，要求：
    - 1. 采集模块：使用 `PerformanceObserver` 采集 LCP/CLS/INP/FID/TTFB，`Resource Timing API`
      采集关键资源耗时，`Long Task API` 采集堆栈，`Error Event` 采集 JS 报错。
    - '2. 上报模块：为何首选 `navigator.sendBeacon`？在什么场景需回退到 `fetch(keepalive: true)`？如何实现批量压缩上报(如
      1s/20条触发)？'
    - 3. 采样策略：全量上报成本高，设计 10% 基础采样 + 核心页面 100% 采样 + 报错 100% 采样的动态采样算法。
    - 4. Source Map 解析：上报堆栈为压缩代码位置，平台端如何自动化下载 Source Map 并还原源码行列？
    - 5. 告警规则：LCP P75 环比上升 20% 且绝对值 > 2.5s 触发 P1 告警；JS 报错率 > 1% 触发 P2 告警。如何防止发版初期流量小导致的误报？
  - 'no': 6
    title: 生财有术新人30天破局实战
    contents:
    - 你刚加入生财有术第七期，面对3900+精华帖、每日风向标、即将开启的2月航海，请制定30天行动计划：
    - 1. 第1-3天：完成新人指南阅读、定位所处阶段(作业一)、建立精华帖索引工具2.0收藏夹、加入同城小局群。
    - 2. 第4-7天：报名担任航海志愿者(资料官/打卡组)，利用SOP熟悉社群运营后台，产出第一篇复盘笔记发布获龙珠碎片。
    - 3. 第8-14天：在航海实战中选定单一项目(如视频号带货/小红书引流)，执行『像素级模仿』对标账号，跑通最小闭环赚到第一块钱。
    - 4. 第15-30天：将实战过程标准化为SOP，输出『保姆级教程』发布精华帖，招募合伙人分佣裂变，规划放大期矩阵化路径。
    - 5. 复盘问题：若航海期间遭遇『反复横跳』(多项目切换)怎么办？如何利用『风向标3000条』建立商业嗅觉？
  - 'no': 7
    title: AI 赋能内容生产 Pipeline 落地
    contents:
    - 某团队需每周产出 50 篇小红书笔记(含标题、正文、配图、标签)，现引入 ChatGPT + Midjourney + RPA，请设计标准化生产流水线：
    - 1. Prompt 分层设计：系统角色(小红书爆款专家) + 方法论注入(二极管标题法/40词库) + 少样本案例库(10个高赞标题) + 平台约束(<20字/强制植入1-2词库词)。
    - 2. RPA 编排流程：关键词输入 -> ChatGPT生成标题/正文 -> Midjourney生成配图 -> 飞书多维表格审核 -> 定时发布工具自动分发。
    - 3. 质检兜底机制：人工抽检事实准确性/个人经验注入/合规排版/互动钩子植入，建立『AI生成+人工润色』双轨制。
    - 4. 成本核算：对比纯人工(预估200小时/周)与AI流水线(预估20小时/周)的边际成本，计算ROI。
    - 5. 迭代优化：如何利用数据回流(阅读完读率/互动率/转化率)反向优化 Prompt 与选题方向？
  units:
  - 'no': 1
    name: 核心指标体系 —— 用户体验的“体检单”
    points:
    - '**为什么需要这个概念？**'
    - '- 前端性能优化缺乏统一度量标准，开发者常关注技术指标（如 JS 体积）而非用户真实感受'
    - '- 需要一套以用户为中心、可量化、可对比的关键指标，指导优化方向并设定验收基线'
    - '**核心定义**'
    - '- **LCP (Largest Contentful Painting)**：最大内容绘制，衡量“加载速度”，标记视口内最大内容元素渲染完成的时间，目标
      < 2.5s'
    - '- **CLS (Cumulative Layout Shift)**：累积布局偏移，衡量“视觉稳定性”，量化页面意外移动的程度，目标 < 0.1'
    - '- **FID (First Input Delay)**：首次输入延迟，衡量“交互响应”，记录用户首次交互到浏览器响应的延迟，已被 INP 取代'
    - '- **INP (Interaction to Next Paint)**：下一帧绘制交互延迟，衡量“整体交互响应”，观察页面全生命周期所有交互的延迟百分位，目标
      < 200ms'
    - '- **TTFB (Time to First Byte)**：首字节时间，衡量“服务端响应”，资源请求到收到第一字节的耗时，是后端与网络性能的基础'
    - '**关键性质**'
    - '- **真实用户监控 (RUM) 为准**：实验室数据仅供开发参考，生产环境需以 Chrome UX Report (CrUX) 等真实用户数据为优化依据'
    - '- **生命周期覆盖**：LCP 管加载、CLS 管稳定、INP 管交互，三大核心指标覆盖用户访问全链路'
    - '- **75 分位数法则**：指标达标判定取所有访问样本的 75 分位数（P75），而非平均值，保证大多数用户体验达标'
    - '**典型例子**'
    - '- 电商首屏大图未设置宽高导致 CLS 飙升，用户点击“加入购物车”按钮被下移的广告位“劫持”'
    - '- 单页应用 (SPA) 首屏 JS 过大阻塞主线程，导致 LCP 超 4s，用户感知“白屏”时间过长'
    - '- 列表页点击筛选项无反应 500ms 才渲染结果，INP 不达标，用户疯狂点击触发重复请求'
    - '**边界条件**'
    - '- LCP 元素可能随动态内容变化（如轮播图切换），需关注最终稳定的 LCP 候选元素'
    - '- INP 受长任务影响大，主线程被占用 > 50ms 即可能导致 INP 恶化，需结合 Long Task API 分析'
    - '- 后端渲染 (SSR) 场景下 TTFB 直接决定 LCP 下限，客户端渲染 (CSR) 则更受 JS 下载执行影响'
    sources:
