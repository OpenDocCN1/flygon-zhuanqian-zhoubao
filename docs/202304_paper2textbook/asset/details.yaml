    name: 混合栈共存架构 —— 原生壳工程嵌入 RN/Flutter 模块的 Brownfield 集成与三端代码复用
    points:
    - '**为什么需要这个概念？**'
    - '- 存量大型原生 App（几百万行代码）无法全量重写，需增量引入跨端技术承接新业务、复用现有 Web/跨端资产'
    - '- 解决“原生+跨端”共存时的：生命周期管理、导航栈融合、通信机制、依赖冲突、包体积、热更新、CI/CD 复杂度'
    - '- 实现“核心链路原生兜底、高频变动跨端承接、通用业务逻辑三端复用”的工程最优解'
    - '- AI/RPA 自动化 CI/CD：利用 GitHub Actions/GitLab CI 集成 LLM 代码审查、自动化测试生成、多平台并行构建、热更新包分发'
    - '**核心定义**'
    - '- Brownfield 集成模式：原生 App 作为“宿主壳”，RN/Flutter 作为“模块/Feature”嵌入'
    - '  1. 架构分层：Native Shell (原生壳：启动、导航、基础服务、原生能力) + Cross-platform Module (RN/Flutter
      Module：业务页面、复用逻辑) + Shared Logic Package (共享包：TypeScript/Dart/Kotlin 业务逻辑、API
      定义、状态管理)'
    - '  2. 通信桥接：Native <-> Module 通过 JSI/Platform Channel/EventBus 双向通信，定义协议契约（如
      MethodChannel、标准化 JSON RPC）'
    - '  3. 导航融合：原生路由栈统一管理，Module 内部路由映射为原生 Fragment/UIViewController，支持原生<->跨端页面互相跳转、参数透传、生命周期回调'
    - '  4. 热更新：CodePush (RN) / Shorebird (Flutter) / 原生动态下发 JS/Dart Bundle，绕过应用商店审核快速修复/迭代'
    - '- Pigeon/FFI 类型安全通信：利用代码生成工具从统一 IDL 定义生成 Dart/原生接口代码，消除手写桥接代码的类型不匹配风险'
    - '**关键性质**'
    - '- 渐进式迁移：单模块试点 -> 核心业务迁移 -> 共享组件库沉淀 -> 最终可选全栈跨端'
    - '- 依赖治理：Native 依赖 (Gradle/CocoaPods) 与 Module 依赖 (npm/pub) 物理隔离，共享依赖（如网络库、图片加载）由
      Native 侧统一提供单例给 Module 用'
    - '- 资源隔离：RN/Flutter 实例可单独启动/销毁/复用（单实例/多实例策略），内存占用可控'
    - '- 三端代码复用策略：'
    - '  - 业务逻辑层：TypeScript (RN/Web) / Dart (Flutter) / Kotlin (KMP) 保持三份实现，或核心算法用
      Rust/Wasm 编译三端复用'
    - '  - UI 层：各自维护（RN/Flutter/Web 差异大），通过设计系统/设计令牌保证视觉一致'
    - '  - API 层：OpenAPI/GraphQL Schema 生成三端类型安全 Client'
    - '- AI 驱动的热更新策略：利用 LLM 分析崩溃日志、性能指标，自动生成热修复补丁建议，配合 Shorebird/CodePush 实现分钟级热更'
    - '**典型例子**'
    - '- 某超级 App “发现页/视频流/直播间”用 Flutter 重构，其余 Tab 保持原生，共享登录态、用户信息、埋点 SDK、网络层'
    - '- 电商 App 大促活动页用 RN 开发，活动下线后可动态下发/回收，复用 Web H5 组件库（通过 React Native Web 共享组件代码）'
    - '- 共享业务逻辑包：购物车计算规则、优惠券叠加算法用 TypeScript 写，RN 直接引用，Web 直接引用，Flutter 通过 Dart TS
      互转或单独维护 Dart 版'
    - '- ChatGPT 生成 Pigeon 协议定义文件，RPA 自动化运行代码生成、编译验证、集成测试'
    - '**边界条件**'
    - '- 双端/三端维护成本：需要同时具备 iOS/Android/RN/Flutter/Web 全栈人才或分工极其明确的团队'
    - '- 版本依赖地狱：RN 版本升级牵动 Native 依赖、Flutter 版本升级牵动 Dart SDK/插件兼容、Native 升级 Xcode/AGP
      牵动构建脚本'
    - '- 调试极其困难：Native 崩溃 -> JS 栈 -> Native 栈 穿透定位、内存泄漏跨边界排查、性能分析工具链割裂'
    - '- 导航/手势/键盘/输入法/无障碍/深色模式等系统级行为一致性极难保证，需大量兼容性适配代码'
    - '- 包体积叠加：基线包含双引擎，增量模块再加，需严格拆包、动态下发、按需加载控制总体积'
    - '- 平台审核风险：App Store/小程序审核可能因热更新机制、动态加载代码、隐私合规拒绝上架，需预埋合规开关与降级方案'
    - '- AI 自动化测试覆盖率难以达标：跨端场景下的 E2E 测试需覆盖原生<->跨端跳转、通信桥接、导航融合等复杂路径，传统测试框架支持有限'
