  - 'no': 5
    name: i18n+a11y 自动化回归防护体系 —— 门禁而非事后诸葛亮
    points:
    - '**为什么需要这个概念？**'
    - '- 人工测试覆盖率低、周期长、主观性强，无法跟上敏捷迭代节奏（双周/周发布）'
    - '- i18n 缺失键、a11y 违规（对比度、缺失 alt、ARIA 误用）是高频回归缺陷，需在代码提交/合并/发布三个节点自动拦截'
    - '- 建立「预防-检测-阻断-修复」闭环，将合规成本左移至开发期'
    - '**核心定义**'
    - '- 工具链：`axe-core`/`@axe-core/playwright` (a11y)、`i18n-ally`/`lint-i18n`/`check-i18n`
      (i18n)、`Lighthouse CI` (综合审计)'
    - '- PR 阻断门禁：GitHub Actions `lint`/`test` 阶段并行跑 `axe-playwright` 无障碍扫描 + `i18n-check`
      缺键/未用键检测，失败阻断合并'
    - '- 定期人工辅助测试：自动化仅覆盖 ~30-50% 规则，需制定月度/季度 NVDA/VoiceOver 实测计划，覆盖核心用户旅程'
    - '**关键性质**'
    - '- 分层门禁：Pre-commit (husky) 跑轻量 lint（键名规范、硬编码中文检测）；CI 跑完整 axe 扫描 + i18n 完整率；Release
      阶段 Lighthouse CI 审计性能/SEO/a11y 综合分'
    - '- 误报治理：建立 `axe-core` 规则白名单（如第三方 iframe 不可控）、i18n 动态键忽略列表，避免「狼来了」导致团队忽视门禁'
    - '- 报告可视化：PR 检查项输出违规详情链接（Storybook a11y 面板、i18n 缺键 JSON），开发者点击直达问题代码行'
    - '**典型例子**'
