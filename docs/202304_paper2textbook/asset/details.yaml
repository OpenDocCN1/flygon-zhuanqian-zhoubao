    - 3. **抖音验证 MVP**：连续 7 天，每天学习 30 分钟 + 拍摄 1 条短视频/直播分享（内容：学习过程/避坑指南/工具推荐），记录播放/互动/私信数据。
    - 4. **飞轮自检**：第 7 天复盘是否触发‘越学越会 → 越会越喜欢 → 越擅长 → 越受欢迎 → 越赚钱 → 越愿意学’的正向循环雏形。
    - 验收：7 天内单条视频播放破 1000，或获 ≥ 1 条精准私信咨询/合作意向。
