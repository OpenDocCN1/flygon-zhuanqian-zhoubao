  - 'no': 4
    name: 位置编码 —— 给无序集合注入“时间感”
    points:
    - '**为什么需要这个概念？**'
    - '- Self-Attention 本质是集合操作，对 Token 顺序不敏感（排列等变性）'
    - '- 语言高度依赖顺序（''狗咬人'' vs ''人咬狗''），必须显式注入位置信息'
    - '- **战略视角**：对应“时间复利”逻辑——私域运营中“被记住的人多了，事业就变革”，模型通过位置编码积累时序先验，实现长程依赖的指数级收益（素材：THh7dtp6uoEKloxVqwncmmwBn1b.md、20230418_085.md、SnZDdyUsFoxTP0x9wCPcdAX5nWc.md）'
    - '**核心定义**'
    - '- 绝对位置编码：PE(pos, 2i) = sin(pos/10000^(2i/d)), PE(pos, 2i+1) = cos(...)'
    - '- 可学习绝对编码：nn.Embedding(max_len, d_model) 随训练更新'
    - '- 相对位置编码/RoPE：仅建模相对距离，通过旋转矩阵作用于 Q/K：q_m = q_m * e^(i m θ)，实现线性衰减与外推'
    - '**关键性质**'
    - '- 正弦编码：确定性、可外推至未见长度、线性关系允许模型学习相对位置'
    - '- 可学习编码：训练长度内表现更优，但无法外推超出 max_len'
    - '- RoPE：融合绝对与相对优势，无额外参数，支持线性注意力近似，成大模型标配'
    - '**典型例子**'
    - '- Transformer 原版：正弦编码 + 词嵌入求和输入'
    - '- BERT/GPT-2：可学习位置嵌入'
    - '- LLaMA/ChatGLM/GPT-NeoX：RoPE 旋转位置编码'
    - '- **商业映射**：YaRN 动态 NTK 缩放频率基数实现窗口外推，类比“香港疫情导致港货代购→港资源咨询”这种地域差/信息差服务的动态适配能力（素材：B95VdtwByoPXGoxac7Ec1KhQnwc.md、THh7dtp6uoEKloxVqwncmmwBn1b.md）'
    - '**边界条件**'
    - '- 正弦编码高维分量波长极长，远距离位置难以区分'
    - '- RoPE 外推至超长上下文（>训练长度）时需结合 YaRN/PI 等频率缩放技术'
    - '- 相对位置偏置（如 T5）引入可学习标量偏置，计算开销随序列长度平方增长'
    sources:
    - paper: 20230418_020.md
      role: origin
    - paper: B95VdtwByoPXGoxac7Ec1KhQnwc.md
      role: improve
    - paper: THh7dtp6uoEKloxVqwncmmwBn1b.md
      role: apply
    - paper: 20230418_085.md
      role: apply
    - paper: SnZDdyUsFoxTP0x9wCPcdAX5nWc.md
      role: apply
    excerpts:
    - PE(pos, 2i) = sin(pos / 10000^(2i/d_model))
    - RoPE 通过旋转矩阵将绝对位置编码转化为相对位置编码，q_m^T k_n 仅依赖 m-n。
    - YaRN 通过动态 NTK 缩放频率基数实现窗口外推。
    - 时间是稀缺资源，也是壁垒。一个年轻人即使很有天资，也不应该广泛涉猎，应该先确定创作方向，用 10 年左右时间做出深入的作品...
    - 被记住的人多了，你的事业就变革了。当你的私域多了。你关注到的朋友圈就是你的世界。
  - 'no': 5
    name: 注意力可视化 —— 打开黑箱的“解剖刀”
    points:
    - '**为什么需要这个概念？**'
    - '- 验证模型是否真正学会语言学规律，而非靠捷径统计'
    - '- 诊断错误案例：关注错位置、重复生成、幻觉触发机制'
    - '- 为模型压缩、知识蒸馏提供结构化先验'
    - '- **元认知视角**：对应“输出倒逼成长”机制——通过公开输出（写复盘、提问、教他人）倒逼自己梳理思路、暴露问题、获得外部反馈，利用‘旁观者清’的圈友智慧加速认知迭代（素材：LE3Ad03QAoTJWWxZ8jBcFBKXnEy.md、FgeSdrK4no16NRxepk5cnXUVnvf.md）'
    - '**核心定义**'
    - '- 提取多层、多头注意力权重矩阵 A ∈ ℝ^{h × L × L}'
    - '- 可视化形式：热力图、有向图、聚类树、注意力流图'
    - '**关键性质**'
    - '- 层级分工：底层头多关注局部句法，顶层头关注长程语义/任务相关'
    - '- 稀疏性：多数头注意力集中在对角线及少数关键 Token（如 [CLS], SEP, 标点）'
    - '- 并非解释：高注意力权重 ≠ 因果重要性（需结合梯度/消融实验验证）'
    - '**典型例子**'
    - '- 指代消歧：''The trophy doesn''t fit the suitcase because it is too large'' 中 ''it''
      强关注 ''trophy'''
    - '- 句法树诱导：无监督下注意力头隐式对应依存树边'
    - '- **商业映射**：作者发布抖音小程序实操手册（精华帖/龙珠）后，自然吸引圈友付费咨询及分销转化，进而开设训练营，验证‘利他输出→资源回流→产品化放大’路径，同构于注意力可视化揭示‘高权重≠高因果’后通过消融实验校准真实机制（素材：LE3Ad03QAoTJWWxZ8jBcFBKXnEy.md）'
    - '**边界条件**'
    - '- 平均多头/多层会掩盖个体头功能，需单头单层分析'
    - '- 仅观察 Encoder 自注意力或 Decoder 交叉注意力，视任务而定'
    - '- 可视化是相关性分析，非因果机制证明'
    sources:
    - paper: 20230418_022.md
      role: apply
    - paper: LE3Ad03QAoTJWWxZ8jBcFBKXnEy.md
      role: apply
    - paper: FgeSdrK4no16NRxepk5cnXUVnvf.md
      role: apply
    excerpts:
    - 注意力可视化揭示了模型内部隐式学习到的语言结构。
    - 注意力权重高不等于该 Token 对预测贡献大，需谨慎解读。
    - 有了新发现，就写个复盘帮更多的人跟上。跑通了新项目，就写个保姆级教程让更多的人入门。
