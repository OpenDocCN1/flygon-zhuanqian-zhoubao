    name: 测试策略分层 —— 单元/集成/E2E 的黄金分割比
    points:
    - '**为什么需要这个概念？**'
    - '- 只写单测：无法发现组件间集成Bug、路由跳转、API联调问题'
    - '- 只写E2E：运行慢、调试难、维护成本高、CI流水线耗时过长'
    - '- 需要一套科学的分层模型，指导资源在不同层级的最优分配'
    - '**核心定义**'
    - '- 单元测试（底座，70%）：隔离测试纯函数、组合式函数、Pinia Store、Vue组件逻辑（shallowMount），不依赖网络/浏览器DOM'
    - '- 集成测试（中层，20%）：验证多单元协作，如组件+Router、组件+Pinia、组件+API Mock、跨组件通信'
    - '- 端到端测试（顶尖，10%）：真实浏览器模拟用户关键路径（登录、下单、支付），验证全链路业务闭环'
    - '**关键性质**'
    - '- 测试金字塔/奖杯模型：越往上运行越慢、越脆弱、维护成本越高，但置信度越强'
    - '- ROI评估：单测ROI最高（毫秒级反馈），E2E ROI最低（分钟级反馈），需设定覆盖率阈值（如单测80%、核心E2E 100%）'
    - '- 依赖隔离原则：单测必须Mock外部依赖（axios、router、子组件），集成测试可选择性保留真实依赖'
    - '**典型例子**'
    - '- 单测：`useDebounceFn` 返回值在不同时间点的断言；`ProTable` 组件 `columns` prop 变更触发 `reload`'
    - '- 集成测试：`UserProfile` 组件挂载后自动请求 `/api/user` 并渲染数据；路由守卫拦截未登录用户跳转登录页'
    - '- E2E：用户输入账号密码点击登录 → 跳转首页 → 侧边栏展示权限菜单 → 退出登录回登录页'
    - '**边界条件**'
    - '- 避免“倒金字塔”：E2E数量超过单测，导致CI极其缓慢且频繁闪断'
    - '- 避免“冰激凌筒”：只有单测和E2E，缺中层集成测试，导致组件协作Bug频发'
    - '- 纯UI展示型组件（如 Button、Icon）无需E2E，单测+视觉回归即可'
    - '- 复杂表单联动、多步向导、支付流程必须有E2E兜底'
    sources:
    - paper: 20230418_039.md
      role: origin
    - paper: 20230418_134.md
      role: improve
    excerpts:
    - 引用测试金字塔/奖杯模型，制定“核心逻辑单测全覆盖、关键交互集成测、核心链路 E2E 兜底”的团队规范。
    - 单元/集成/E2E 的边界划分、ROI 评估与覆盖率阈值设定
    - 视频号7天起号实操验证了‘内容为王、选题>画质>剪辑’及‘流量为变现服务’原则
