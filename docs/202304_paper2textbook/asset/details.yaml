  life_analogy:
  - 想象前端效能平台是一个**装修公司的标准化作业体系**：
  - '- **脚手架工程化** = **标准化毛坯房交付标准**：水电走向、弱电箱预留、墙面找平统一规范，新项目（新房）进场即可直接软装，省去反复凿墙布线'
  - '- **组件物料平台** = **品牌建材展厅+ERP系统**：每块瓷砖、每个开关（组件）都有统一编码、规格书（文档）、样板间实景（沙箱）、库存关联记录（依赖图谱），设计师选材不踩坑，采购补货有据可查'
  - '- **低代码搭建引擎** = **模块化全屋定制软件**：业主（运营/业务）拖拽橱柜、衣柜（组件）生成设计图，软件自动出切单、下单生产（代码生成），还能导入
    CAD 进一步微调（双向同步），非专业人士也能产出专业图纸'
  - '- **研发效能度量** = **工地项目管理看板**：交付周期（部署频次）、返工率（变更失败率）、工期偏差（构建耗时）、材料损耗（包体积）实时可视，包工头据此优化排期、换供应商、改工艺'
  - '- **AI 赋能研发** = **智能设计助手+自动化施工队**：Copilot 做设计草图，RAG 查规范图库，Agent 管施工进度，Code Review
    机器人查验收'
  - '- **MVP 平台** = **从‘散工包干’到‘品牌连锁’的跃迁**：打通‘开盘交付-选材下单-定制生产-项目管控-智能辅助’全链路，让装修像造车一样可复制、可度量、可规模化'
  summary:
  - concept: 脚手架工程化
    desc: 将项目初始化抽象为可复用、可插件化、可版本化的代码生成系统，内置最佳实践，解决配置漂移与重复造轮子
  - concept: Monorepo
    desc: 单仓多包管理模式，配合 pnpm workspace 实现核心包、模版包、工具包版本联动与依赖去重
  - concept: 组件物料平台
    desc: 面向组件全生命周期的治理平台，核心产出为标准化元数据、自动化文档、沙箱预览、依赖图谱与复用度量
  - concept: 低代码搭建引擎
    desc: 基于 JSON Schema 驱动的可视化构建系统，支持渲染器插件化、AST 代码生成，实现低代码与高代码双轨并行互转
  - concept: JSON Schema
    desc: 低代码引擎的核心协议，定义组件结构、属性、数据绑定、交互逻辑、样式配置等标准化字段
  - concept: AST 代码生成
    desc: 基于 Babel/TypeScript Compiler API 将 Schema 转换为标准 Vue/React/TS 代码，实现‘低代码产出高代码’纳入工程体系
  - concept: 研发效能度量体系
    desc: 以 DORA 四指标为骨干，融合过程指标与前端专属指标的多维模型，支撑数据驱动的工程治理
  - concept: DORA 四大指标
    desc: 部署频次、变更前置时间、变更失败率、服务恢复时间，衡量软件交付绩效的行业黄金标准
  - concept: 前端效能平台 MVP
    desc: 串联脚手架创建→组件复用统计→低代码产出占比→发布频次/故障率看板的最小可行性闭环产品
  - concept: 数据贯通
    desc: 通过项目 ID 串联脚手架、构建、低代码、CI 等环节数据汇聚至统一存储，打破数据孤岛实现价值可视化
  - concept: AI 编程助手
    desc: GitHub Copilot/Cursor/Codeium 等工具在前端框架/类型系统/样式/测试生成能力的差异评测与提示词工程模式总结
  - concept: RAG 知识库
    desc: 基于 Tree-sitter AST 切片、Embedding 模型、向量库的代码库语义检索系统，实现上下文注入与幻觉控制
  - concept: Agent 工作流
    desc: 基于 LangGraph/AutoGen 编排 Planner/Coder/Tester/Reviewer 多 Agent，实现需求拆解→代码生成→测试验证→提交
      PR 的闭环
  - concept: 前端专用模型微调
    desc: 基于 CodeLlama/DeepSeek-Coder 继续预训练、LoRA 微调、RLHF 对齐，提升 TypeScript 类型正确率与前端最佳实践遵循度
  - concept: AI Code Review
    desc: GitHub Action 触发 PR Review，结合 ESLint/TypeCheck 结果上下文，自动输出规范检查、安全扫描、性能建议、单测补全
  exercises:
  - 'no': 1
    title: 脚手架插件机制设计与模版差异化渲染
    contents:
    - 假设你要设计一个基于 Plop 的微生成器，支持生成 '页面'、'组件'、'Store' 三种类型的代码骨架。
    - 1. 设计 prompt 交互流程：如何通过动态询问（如：是否需要 i18n、是否使用 CSS Modules、测试框架选择 Vitest/Jest）收集上下文变量？
    - 2. 编写模版文件结构：展示如何在模版中使用条件判断（{{#if useI18n}}...{{/if}}）和循环（{{#each fields}}...{{/each}}）生成差异化代码。
    - 3. 核心问题：当团队规范升级（如 ESLint 规则集变更）时，如何设计 `upgrade` 命令对比存量项目与最新模版的差异？请列出三种冲突场景及对应的自动化合并策略（如：核心配置强制覆盖、业务代码保留手动合并、提供
      Codemod 脚本自动修复）。
  - 'no': 2
    title: 低代码 Schema 协议设计与 AST 代码生成实战
    contents:
    - 设计一个简化版低代码页面 Schema，要求支持：容器组件嵌套、表单项绑定变量、按钮点击事件绑定异步函数调用。
    - 1. 定义 JSON Schema 结构：包含 componentName、props、children、events、bindings 字段，给出一个『用户登录表单』的完整
      Schema 示例（含用户名/密码输入框、登录按钮、表单校验规则绑定）。
    - '2. 代码生成策略：基于 @babel/parser 和 @babel/generator，描述如何将上述 Schema 转换为 Vue 3 `<script
      setup>` + `<template>` 的 SFC 代码字符串。重点说明：如何处理 bindings 中的表达式（如 `validate: ''required|min:6''`）转换为组件
      props？如何将 events 中的 `click: ''handleLogin''` 转换为模版上的 `@click` 绑定？'
    - 3. 双向同步难点：当开发者在生成的代码中手写了自定义逻辑（如 `const handleLogin = async () => { await api.login();
      router.push('/home') }`），反向解析回 Schema 时，如何识别并保留这段‘非标准模版’代码？请提出一种基于 AST 注释标记或特定命名约定的保护机制。
  - 'no': 3
    title: 研发效能看板指标体系构建与异常诊断
    contents:
    - 你接手一个 20 人前端团队的效能建设，现有数据源：GitLab MR 记录、GitLab CI 流水线日志、Vite 构建产物 stats.json、Sentry
      错误上报、低代码平台发布记录。
    - "1. 指标采集设计：画出数据流向图，说明如何从上述 5 个数据源中提取并计算以下核心指标：\n   - DORA『变更前置时间』（从首次提交到合并入主干的平均耗时）\n\
      \   - 『构建产物体积趋势』（按项目/按周聚合的 gzip 总大小）\n   - 『组件复用率』（低代码页面引用的组件中，来自 @enterprise/ui\
      \ 的占比）\n   - 『线上 JS 报错率』（PV 千次报错数）"
    - 2. 看板告警规则：为上述 4 个指标设定合理的阈值门禁（如：变更前置时间 > 24h 告警、包体积周环比增长 > 20% 阻断合并），并解释阈值设定的依据（行业基线、团队历史基线、业务容忍度）。
    - 3. 根因分析演练：某周看板显示『变更失败率』从 5% 飙升至 18%，『构建耗时』同时从 10min 涨至 25min。请列出 5 个可能的假设原因（如：新增大型依赖未配置外部化、CI
      缓存失效、测试用例新增大量快照、低代码生成代码引入语法错误、合并请求未跑全量测试），并设计对应的 SQL/日志查询语句快速定位真因。
  - 'no': 4
    title: 前端效能平台 MVP 分阶段落地规划
    contents:
    - 某中型公司前端团队 30 人，现状：无统一脚手架、组件库文档靠手写、无低代码能力、CI 仅跑 lint+test、无度量看板。请制定 6 个月 MVP
      建设路线图。
    - 1. Phase 1（第 1 月）：最小化起步。明确脚手架核心模版包含哪些『锁死配置』与『可选项』？CI 标准流水线最少包含哪 3 个阶段？基础看板首屏展示哪
      3 个核心指标？
    - 2. Phase 2（第 2-3 月）：组件治理。如何推动现有 50+ 散落业务组件『入库』物料平台？制定准入标准（如：单测覆盖率>80%、Storybook
      覆盖核心状态、元数据完整），并设计自动化校验流水线。
    - 3. Phase 3（第 4-5 月）：低代码试点。选取『运营活动页』和『后台 CRUD 页』两类场景试点，定义各自的 Schema 约束差异（如：活动页侧重样式/动画配置，CRUD
      页侧重字段/接口/权限配置）。代码生成产物如何接入现有 Git Flow（MR 评审、CI 门禁）？
    - 4. Phase 4（第 6 月）：数据飞轮雏形。设计『效能月报』自动化生成逻辑：输入原始指标数据，输出『本月提效人天估算、Top3 改进建议、下月 OKR
      草案』的 Markdown 报告。
    - 5. 组织保障：如何设立『前端基建小组』职责边界（建设 vs 支持）？『效能 OKR』如何纳入团队考核而不陷入『指标游戏化』陷阱？
  - 'no': 5
    title: AI 赋能研发效能实战：RAG 知识库与 Agent 工作流落地
    contents:
    - 某前端团队 50 人，已有统一脚手架、组件库、低代码平台、度量看板，拟引入 AI 提升研发效能。现有资源：私有代码库 200+ 仓库、组件库文档、低代码
      Schema 规范、历史 MR 记录、技术分享文档。
    - 1. RAG 知识库构建：设计代码库切片策略（Tree-sitter AST 解析、按文件/函数/类粒度切片）、Embedding 模型选型（对比 text-embedding-3-small
      与开源 BGE）、向量库选型（Milvus vs Chroma）、混合检索策略（稀疏 BM25 + 稠密向量）、引用溯源机制（行号级溯源）、上下文注入模版（Prompt
      Template 设计）。
    - 2. Agent 工作流编排：基于 LangGraph 设计 Planner（任务拆解）、Coder（代码生成）、Tester（单测生成+运行）、Reviewer（规范/安全/性能）四角色协作流程。定义工具集：文件读写、终端执行、Git
      操作、CI 触发、RAG 检索。设定人工介入检查点：方案确认、测试通过、MR 提交。
    - 3. AI Code Review 接入：GitHub Action 触发条件、Prompt 模版设计（结合 ESLint/TypeCheck 结果）、输出格式标准化（JSON
      Schema 约束）、误报/漏报评估指标、人工确认流程。
    - 4. 成本与收益测算：Token 消耗预估（人均日均 MR 数、代码行数）、模型 API 成本、预期效率提升（编码时间缩短%、Bug 率下降%）、ROI
      计算模型。
    - 5. 风险控制：代码数据脱敏（密钥/隐私字段过滤）、模型幻觉兜底（规则校验兜底）、提示词注入防御（指令层级隔离）、供应链安全（依赖审计集成）。
  units:
  - 'no': 1
    name: 脚手架工程化 —— 从模版引擎到 Monorepo 多包统管
    points:
    - '**为什么需要这个概念？**'
    - '- 重复造轮子：每个新项目都要手动配置 ESLint、TS、Git Hooks、CI 流程，耗时且易出错'
    - '- 标准不统一：团队内部项目配置五花八门，新人上手成本高，跨项目协作困难'
    - '- 升级维护难：通用配置（如规范升级）无法统一推送到已有项目，导致“配置漂移”'
    - '**核心定义**'
    - '- 脚手架工程化：将项目初始化过程抽象为可复用、可插件化、可版本化的代码生成系统，核心包含模版引擎、Monorepo 管理、插件扩展机制与自动发布流程'
    - '- 关键技术栈：Yeoman/Plop（模版引擎）、pnpm workspace（Monorepo）、GitHub Actions（自动发布 npm）'
    - '**关键性质**'
    - '- 交互式生成：通过 CLI 询问（框架、CSS 方案、测试库等）动态渲染差异化文件'
    - '- 模版即代码：模版文件支持 EJS/Handlebars 语法，可嵌入 JS 逻辑实现条件渲染、循环生成'
    - '- Monorepo 原生支持：脚手架本身采用 Monorepo 结构管理核心包、模版包、工具包，实现版本联动'
    - '- 插件化架构：核心只负责流程编排，具体框架逻辑（Vue/React）、工具链逻辑（ESLint/Prettier）通过插件注入，业务方可自研插件定制'
    - '- 版本升级策略：支持 `upgrade` 命令对比模版差异，提供交互式合并或强制覆盖模式，解决存量项目同步难题'
    - '**典型例子**'
    - '- `create-my-app`：团队内部标准化生成器，运行 `pnpm create my-app` 交互式选择 Vue/React + TS +
      Pinia/Redux + Vitest/Playwright，30 秒产出符合规范的生产级项目'
    - '- `plop` 微生成器：项目内部新增页面/组件/Store 时，运行 `pnpm plop` 选择类型自动生成符合规范的骨架代码及测试文件'
    - '**边界条件**'
    - '- 脚手架不等于“万能初始化”：核心配置（TS 严格模式、ESLint 核心规则）应锁死在模版中，避免过度暴露选项导致规范形同虚设'
    - '- Monorepo 依赖管理复杂度：需配合 `pnpm -w` / `changesets` 处理跨包依赖升级与版本发布，防止“幽灵依赖”污染'
    - '- 模版更新的破坏性变更：Major 版本模版变更需提供 Codemod 脚本自动迁移存量项目，不能仅靠文档指导人工改动'
    - '**素材溯源**'
    - '- 来源：`20230418_045.md` 第 1 节“脚手架工程化”'
    - '- 角色：origin（原始定义与实践方案）'
    sources:
    - paper: 20230418_045.md
      role: origin
    excerpts:
    - 实现 `create-my-app` 交互式生成器、基于 pnpm workspace 的 Monorepo 结构、脚手架插件机制支持业务定制、GitHub
      Actions 自动发布 npm。
  - 'no': 2
    name: 组件物料平台 —— 让组件“可发现、可度量、可复用”
    points:
    - '**为什么需要这个概念？**'
    - '- 组件沉底：业务组件散落在各项目 `src/components` 中，无文档、无演示、无类型定义，导致“重复造轮子”率极高'
    - '- 选型无依据：想用个表格组件，不知道团队有没有现成的、质量如何、文档在哪、版本多少'
    - '- 升级无感知：基础组件库升级后，业务项目不知情，导致版本碎片化严重'
    - '**核心定义**'
    - '- 组件物料平台：面向组件全生命周期（开发、文档、测试、发布、发现、复用、治理）的工程化平台，核心产出为标准化的组件元数据、自动化文档站、沙箱预览与依赖分析图谱'
    - '- 关键规范：组件元数据规范（名称、版本、Props/Events/Slots、分类、关键词、设计稿链接、责任人）'
    - '**关键性质**'
    - '- 文档自动生成：集成 `vue-docgen-api` / `react-docgen` 解析源码 AST，自动提取 Props/Events/Slots/JSDoc
      生成 Markdown/JSON，杜绝文档与代码脱节'
    - '- 演示沙箱：集成 Storybook/Histoire，支持组件隔离渲染、Controls 面板动态调参、Viewport 模拟、Accessibility
      校验、交互故事编写'
    - '- 版本发布与依赖分析：发布时自动生成 Changelog、依赖图谱可视化（哪些项目依赖了该组件、该组件依赖了哪些基础库），支持影响范围分析'
    - '- 复用率统计：通过构建时注入或运行时上报收集组件使用数据，产出《组件复用率报告》指导治理决策'
    - '**典型例子**'
    - '- `@enterprise/ui` 物料平台：收录 Button、Table、Form、ProTable 等 100+ 组件，每个组件具备自动生成的
      API 文档、Storybook 交互演示、单测覆盖率徽章、依赖关系图谱'
    - '- 新人接入流程：搜关键词“表单” -> 筛选“业务级”分类 -> 查看 ProForm 文档与演示 -> 复制安装命令 `pnpm add @enterprise/ui`
      -> 直接使用'
    - '**边界条件**'
    - '- 物料平台 ≠ 组件库官网：物料平台侧重“治理与发现”（元数据、依赖图、复用率、多版本共存），官网侧重“使用文档”，两者分离部署'
    - '- 元数据维护成本：强制要求组件开发者在源码中编写标准化 JSDoc/注释，配合 CI 校验元数据完整性（缺少 description、 Props
      无类型等阻断发布）'
    - '- 沙箱环境差异：Storybook 运行环境与真实项目环境（路由、状态、权限、国际化）存在差距，复杂业务组件需提供“项目级示例”链接而非仅沙箱'
    - '**素材溯源**'
    - '- 来源：`20230418_045.md` 第 2 节“组件物料平台”'
    - '- 角色：origin（原始定义与实践方案）'
    sources:
    - paper: 20230418_045.md
      role: origin
    excerpts:
    - 制定组件元数据规范、集成 `vue-docgen-api`/`react-docgen` 自动解析 Props/Events/Slots、Storybook/Histoire
      沙箱预览、依赖图谱可视化。
  - 'no': 3
    name: 低代码搭建引擎核心 —— Schema 驱动的可视化构建与代码生成双轨制
    points:
    - '**为什么需要这个概念？**'
    - '- 页面生产效率低：大量营销页、运营页、后台表单页结构相似，纯手写代码重复劳动多、迭代周期长'
    - '- 研发瓶颈：前端人力有限，非核心业务页面排期靠后，业务方诉求无法快速响应'
    - '- 代码与可视化割裂：市面低代码平台多为“黑盒”导出 JSON，无法融入现有代码工程体系（Git、CI、Code Review、类型检查）'
    - '**核心定义**'
    - '- 低代码搭建引擎：基于 JSON Schema 描述页面结构，提供画布渲染器、属性面板、撤销重做、代码生成等核心能力，支持“可视化搭建”与“高代码开发”双轨并行、互相转换的工程化系统'
    - '- 核心协议：JSON Schema（页面结构、组件属性、数据绑定、交互逻辑、样式配置）'
    - '**关键性质**'
    - '- Schema 协议设计：基于 JSON Schema 标准扩展，定义 `componentName`、`props`、`children`、`events`、`style`、`bindings`（数据绑定表达式）、`slots`
      等标准字段，支持嵌套组合、条件渲染、循环渲染'
    - '- 画布渲染器：基于 Vue/React 实现插件化渲染器，核心能力包括组件注册、属性编辑器适配、拖拽排序、辅助线对齐、画布缩放、设备预览模式切换'
    - '- 属性面板：根据组件元数据动态生成表单项，支持基础类型输入、对象编辑器、数组编辑器、表达式编辑器（代码高亮、变量提示）、事件绑定选择器'
    - '- 撤销重做：基于命令模式 + MobX/Redux 状态管理，实现细粒度操作记录（修改属性、增删节点、拖拽移动），支持历史快照回溯、键盘快捷键'
    - '- 代码生成：基于 AST（Babel/TypeScript Compiler API）将 Schema 转换为标准 Vue/React 组件代码（支持
      TSX、Vue SFC、CSS Modules、TypeScript 类型），实现“低代码产出高代码”，纳入 Git 管理、走标准 CI/CD'
    - '- 双向同步：支持“代码转 Schema”反向解析（针对符合约定的组件写法），实现高代码重构后同步回低代码编辑器，打通双向流转链路'
    - '**典型例子**'
    - '- 营销活动页搭建：运营同学拖拽“轮播图-商品列表-优惠券领取”组件，配置数据接口与跳转链接，一键发布生成静态页面，无需前端介入'
    - '- 后台管理系统 CRUD 页面：前端开发者在低代码平台搭建 ProTable + ProForm 页面，导出代码后接入复杂业务逻辑（权限控制、自定义渲染器），走正常研发流程'
    - '**边界条件**'
    - '- 低代码不等于“无代码”：复杂交互逻辑（如多步表单校验联动、Canvas 图表交互）仍需写代码，低代码平台需提供“代码片段/自定义组件”逃生口'
    - '- Schema 版本演进：Schema 协议升级需遵循兼容性原则，提供迁移脚本自动升级旧版本 Schema，防止历史页面打不开'
    - '- 渲染器性能：大型页面（节点数 > 500）需实现虚拟滚动、按需渲染、Web Worker 解析 Schema，避免主线程卡顿'
    - '**素材溯源**'
    - '- 来源：`20230418_045.md` 第 3 节“低代码搭建引擎核心”'
    - '- 角色：origin（原始定义与实践方案）'
    sources:
    - paper: 20230418_045.md
      role: origin
    excerpts:
    - 设计 JSON Schema 描述页面结构、基于 Vue/React 实现渲染器插件化、Mobox/RedoManager 状态历史、AST 代码生成还原高代码。
  - 'no': 4
    name: 研发效能度量体系 —— 从 DORA 四指标到前端专属北极星
    points:
    - '**为什么需要这个概念？**'
    - '- “感受”驱动决策：团队凭直觉觉得“效率低”，但无数据支撑，无法定位瓶颈在编码、构建、审核还是部署'
    - '- 改进无验证：引入新工具、新流程后，不知道是否真正提升了效率，陷入“折腾即工作”假象'
    - '- 缺乏对标：无法横向对比业界水平，也无法纵向追踪团队演进趋势'
    - '**核心定义**'
    - '- 研发效能度量体系：以 DORA 四大指标为骨干，结合前端专属指标（构建耗时、包体积、单测覆盖率、组件复用率、低代码产出占比）构建的多维度度量模型，支撑从“主观感知”到“数据驱动”的工程效能治理'
    - "- 核心指标分层：\n  - 结果指标（北极星）：交付周期、变更失败率、服务恢复时间、部署频次（DORA）\n  - 过程指标：代码评审时长、CI 耗时、构建产物大小、静态检查通过率\n\
      \  - 前端专属：组件复用率、低代码页面产出占比、首屏性能指标（LCP/CLS）、JS 报错率"
    - '**关键性质**'
    - '- 数据采集自动化：集成 GitLab/GitHub API（MR 数据）、CI 系统 API（流水线耗时/结果）、构建产物分析工具、SDK 上报（线上性能/报错）、低代码平台统计（页面产出量）'
    - '- 可视化看板：Grafana 搭建团队/项目/个人三级看板，支持时间范围筛选、趋势对比、异常高亮、下钻明细'
    - '- 阈值门禁与告警：核心指标（如构建时长 > 20min、包体积超标、DORA 变更失败率 > 15%）配置阈值，接入 CI 门禁阻断合并、钉钉/飞书实时告警'
    - '- 定性补足：量化指标无法覆盖“架构合理性”、“代码可读性”、“技术债务”，需配合定期技术债务调研、代码评审质量抽检'
    - '**典型例子**'
    - '- 团队月度效能复盘：拉取 Grafana 看板截图，分析“本月 CI 平均耗时从 15min 降至 10min（优化了缓存策略）、组件复用率从 35%
      升至 52%（推广 ProTable）、变更失败率从 8% 降至 3%（引入 E2E 门禁）”，制定下月改进 OKR'
    - '- 新人入职效能画像：展示团队 DORA 基线、核心仓库构建耗时分布、高频报错 TOP10，帮助新人快速建立工程质量基线认知'
    - '**边界条件**'
    - '- 避免“指标游戏化”：切勿将指标直接挂钩绩效考核（如“部署频次越高奖金越多”），会导致拆小提交、降低测试标准等作弊行为'
    - '- 指标收集成本控制：采集端需极度轻量（< 1ms 开销），存储端按天聚合保留细节 30 天/聚合数据 1 年，平衡成本与查询灵活性'
    - '- 上下文解读权重：同一指标在不同业务阶段（0-1 爆发期 vs 成熟期）、不同团队规模（5 人 vs 50 人）含义截然不同，必须结合上下文定性分析'
    - '**素材溯源**'
    - '- 来源：`20230418_045.md` 第 4 节“研发效能度量体系”'
    - '- 角色：origin（原始定义与实践方案）'
    sources:
    - paper: 20230418_045.md
      role: origin
    excerpts:
    - 引入 DORA（部署频次、变更前置时间、变更失败率、恢复时间）、代码评审时长、构建耗时、缺陷逃逸率，搭建 Grafana 看板驱动改进。
  - 'no': 5
    name: 前端效能平台 MVP —— 串联脚手架/组件/低代码/度量的闭环落地
    points:
    - '**为什么需要这个概念？**'
    - '- 能力割裂：脚手架、组件库、低代码、监控各自为政，数据不通、流程不连、价值难以叠加'
    - '- 缺乏抓手：领导问“前端效能建设投入产出比多少”，只能罗列功能清单，无法量化产出'
    - '- 落地无路径：想建平台，不知从何切入、先建什么、怎么验证价值、怎么推广'
    - '**核心定义**'
    - '- 前端效能平台 MVP：以“脚手架创建 → 组件复用统计 → 低代码产出占比 → 发布频次/故障率看板”为核心链路，打通研发全链路数据，形成“以工具替人工、以平台促规范、以数据驱决策”的最小可行性产品'
    - "- 核心交付物：\n  1. 标准化脚手架（内置最佳实践）\n  2. 组件物料平台（自动文档+沙箱+依赖图）\n  3. 低代码搭建系统（Schema+渲染器+代码生成）\n\
      \  4. 效能度量看板（DORA+前端专属指标）\n  5. CI/CD 标准流水线模版（集成各项门禁）"
    - '**关键性质**'
    - '- 数据贯通：脚手架创建项目时自动注入项目 ID，构建上报产物体积/耗时，低代码发布上报页面 Schema 与组件引用，CI 上报流水线各阶段耗时/结果，所有数据汇聚至统一
      ClickHouse'
    - '- 价值可视化：看板核心卡片展示“本月通过脚手架创建项目 X 个、组件复用节省人天 Y 天、低代码产出页面 Z 个（占比 40%）、部署频次提升 N%、变更失败率降低
      M%”，直接对话业务价值'
    - "- 渐进式建设路线：\n  Phase 1（第 1 月）：脚手架 + CI 标准流水线 + 基础看板（构建/部署/报错）\n  Phase 2（第 2-3\
      \ 月）：组件物料平台 + 核心业务组件沉淀 + 复用率统计\n  Phase 3（第 4-6 月）：低代码引擎 + 运营/后台页面试点 + 代码生成集成\
      \ CI\n  Phase 4（持续）：度量体系深化 + 数据飞轮（自动化优化建议）"
    - '- 组织推动机制：成立“前端基建小组”专职建设、设立“效能 OKR”纳入团队考核、建立“内部用户反馈群”收集痛点、定期输出《前端效能月报》对外同步进展'
    - '**典型例子**'
    - '- 某中大型前端团队（30 人）实践：半年内上线 MVP 平台，实现“新项目接入 0 配置”、“核心组件复用率 60%+”、“运营活动页 80% 低代码产出”、“部署频次周级→日级、变更失败率
      < 5%”，年节省研发工时 2000+ 人天'
    - '**边界条件**'
    - '- MVP 不等于“简陋”：核心链路必须跑通且稳定（脚手架成功率 100%、代码生成代码可直接提交、看板数据准确），避免“烂尾楼”打击信心'
    - '- 避免“大而全”陷阱：不自研通用基础设施（GitLab、Jenkins、Grafana、ClickHouse），拥抱成熟开源/商业化产品，核心精力投入“前端领域适配”与“业务流程串联”'
    - '- 存量项目迁移策略：强制推进不现实，采用“新项目强制标准、旧项目按需迁移、核心库强制升级”策略，配合 Codemod 降低迁移成本'
    - '**素材溯源**'
    - '- 来源：`20230418_045.md` 第 5 节“实战：建设团队级前端效能平台 MVP 版本”'
    - '- 角色：origin（原始定义与实践方案）'
