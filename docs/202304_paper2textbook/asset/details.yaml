    title: 普通人抖音‘不讨厌’切入点挖掘与验证
    contents:
    - 任务：结合自身身份（程序员/大学生/宝妈/老板/打工人/运营/实体店主/餐饮从业者），完成‘不讨厌’切入点挖掘：
