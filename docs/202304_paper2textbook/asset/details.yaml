    name: 链路追踪与日志关联 —— 打通前后端的“神经中枢”
    points:
    - '**为什么需要这个概念？**'
    - '- 单纯前端报错无法定位是前端逻辑、BFF 聚合、下游微服务还是数据库慢查询导致'
    - '- 请求链路跨进程、跨语言、跨网络边界，缺乏统一 TraceID 串联'
    - '- 需要前后端统一日志格式、链路透传、统一查询平台，实现“全链路定位”'
    - '**核心定义**'
    - '- Trace Context 透传：HTTP Header 传递 `traceparent` (W3C TraceContext 标准) 或 `trace-id`/`span-id`'
    - '- 前端生成根 Span：页面加载/路由切换/XHR-Fetch 发起时创建根 Span，子 Span 记录资源加载、组件渲染、API 请求'
    - '- 后端续接：网关/偏入层提取 Header 注入上下文，下游微服务继承传递'
    - '- 结构化日志：统一 JSON 格式（timestamp/level/traceId/spanId/message/context），接入 ELK/Grafana
      Loki'
    - '**关键性质**'
    - '- 采样决策：前端按比例采样（如 1/1000），错误/慢请求 100% 采样；Header 标记 `sampled=true` 通知后端全量采集'
    - '- 跨域限制：第三方域名请求无法读写 Header，需代理层转发或接受断链'
    - '- 时钟同步：前端 `performance.now()` 相对时间戳需映射到服务端绝对时间，便于跨端对齐'
    - '**典型例子**'
    - '- 用户反馈“提交订单转圈 10s”，前端 Trace 显示 `fetch(''/api/order'')` 耗时 9.8s，点击 Span 跳转至后端链路，发现
      `inventory-service` 数据库锁等待 8s，定位至未加索引的 `sku_lock` 表'
    - '**边界条件**'
    - '- 旧版浏览器不支持 `fetch` 拦截器，需重写 `XMLHttpRequest.prototype.send` 实现 Header 注入'
    - '- 日志量巨大，需按 TraceID 分片存储、建立倒排索引、配置 TTL 降本'
    - '- 微服务调用深度过大导致 Span 栈溢出，需限制最大嵌套层级或采用异步上报'
    - '**素材溯源**'
    - '- paper: 20230418_046.md, role: origin, desc: 定义链路追踪与日志关联：TraceID 透传、前后端链路打通、结构化日志与
      ELK/Grafana Loki 查询'
    sources:
    - paper: 20230418_046.md
      role: origin
    excerpts:
    - 链路追踪与日志关联：TraceID 透传、前后端链路打通、结构化日志与 ELK/Grafana Loki 查询
    - HTTP Header 透传 `trace-id`、`span-id`，前端生成根 Span、后端续接，统一 JSON 格式日志接入 Loki，实现“前端报错
      → 后端调用链 → 数据库慢查询”全链路定位。
