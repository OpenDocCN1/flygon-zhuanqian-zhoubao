      128k。
    - 任务：
    - 1. 设计 4 个实验组 Prompt 策略：
    - '   - A组：原文直接塞入（对照组）'
    - '   - B组：关键信息前置（将该条款移到开头）'
    - '   - C组：结构化标记（给每章加<Chapter><Title>标签）+指令‘重点阅读终止条款’'
    - '   - D组：Map-Reduce（分章摘要→汇总问答）'
    - 2. 预测四组在‘发现陷阱条款’准确率上的排序，并解释理论依据（注意力机制、Token位置偏置、信息丢失）。
    - 3. 如果合同长 500k Token，超出窗口，D 组 Map-Reduce 会丢失什么跨章节关联信息？如何改进？
  units:
  - 'no': 1
    name: 视觉语言模型提示：图文对齐与视觉思维链
    points:
    - '**为什么需要这个概念？**'
    - '- 纯文本提示工程无法直接处理图像、视频等视觉模态输入'
    - '- 多模态模型（如GPT-4V、LLaVA）需要显式指定图像在对话中的位置与引用方式'
    - '- 复杂视觉推理任务（如图表分析、几何题求解）需要引导模型进行“视觉思维链”，即先感知再推理'
    - '**核心定义**'
    - '- 多模态提示 = 文本指令 + 视觉Token（图像编码后的向量序列）+ 跨模态交互标记（如<image>、区域坐标）'
    - '- 视觉思维链：提示模型输出“观察→分析→推理→结论”的结构化中间步骤，将视觉感知过程显性化'
    - '**关键性质**'
    - '- 图像分辨率与Token消耗呈二次方关系，需在细节保留与上下文窗口间权衡'
    - '- 模型对图像在上下文中的相对位置敏感，通常“图文交替”优于“图文分离”'
    - '- 区域引用（如坐标框、指点坐标）能显著提升细粒度视觉定位任务的准确率'
    - '**典型例子**'
    - '- 图表问答：提示中嵌入图表图像，指令“请先描述图表类型、坐标轴含义、数据趋势，再回答问题”'
    - '- 视觉定位：用户上传图片并标注“红框内是什么？”，模型需结合坐标Token理解指向性'
    - '**边界条件**'
    - '- 当图像包含大量密集文本（如全页PDF）时，纯视觉模型OCR能力有限，需结合文本提取工具'
    - '- 多图对比任务中，模型易混淆图像顺序，需在提示中强制编号（如Image 1, Image 2）'
    - '- 视觉思维链可能增加幻觉风险：模型可能“编造”未观察到的细节来填补推理链条'
    sources:
    - paper: 20230418_088.md
      role: origin
    - paper: 20230418_089.md
      role: improve
    excerpts:
    - 多模态提示的独特组件包括图像Token序列与区域引用标记。
    - 视觉推理的提示策略需显式引导模型进行感知与推理的分步骤输出。
  - 'no': 2
    name: 多轮对话与上下文工程：状态压缩与记忆管理
    points:
    - '**为什么需要这个概念？**'
    - '- LLM上下文窗口有限，长对话必然面临“遗忘”或截断问题'
    - '- 简单拼接历史对话会导致Token浪费、关键信息被稀释（Lost in the Middle）'
    - '- 业务场景需保持长期人设、偏好记忆、任务状态一致性'
    - '**核心定义**'
    - '- 上下文工程：在固定窗口内，通过压缩、摘要、检索、固定锚点等手段，最大化有效信息密度的系统性方法'
    - '- 分层记忆：工作记忆（近期轮次原文）、短时记忆（对话摘要）、长时记忆（向量化知识库/用户画像）'
    - '**关键性质**'
    - '- 摘要压缩会丢失细节（如具体数字、人名），需配合关键实体抽取保留槽位信息'
    - '- 检索式历史（基于语义相似度召回相关轮次）优于定长滑动窗口，但引入检索延迟与召回不全风险'
    - '- 系统提示与少样本示例需“钉死”在窗口首尾，防止被挤出'
    - '**典型例子**'
    - '- 客服机器人：近3轮原文+历史摘要+用户画像标签+相关知识库片段，总Token<4k'
    - '- 编程助手：当前文件上下文+相关依赖文件摘要+最近编辑历史+项目规范文档'
    - '**边界条件**'
    - '- 当对话轮次极长（>50轮）且任务强依赖早期细节时，纯压缩策略失效，必须引入外部结构化存储'
    - '- 摘要模型若能力弱于主模型，会引入“摘要幻觉”污染上下文'
    - '- 多语言对话中，压缩可能丢失语言切换的隐式上下文线索'
    sources:
