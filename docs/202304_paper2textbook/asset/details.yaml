    - 微前端治理规范：公共依赖版本锁定、路由分发协议、通用组件库版本策略、监控埋点统一
  - 'no': 5
    name: 遗留系统微前端化改造 —— 蜕变的阵痛与灰度的艺术
    points:
    - '**为什么需要这个概念？**'
    - '- 存量系统往往技术栈陈旧（jQuery/Vue2/无构建工具）、代码耦合严重、无测试覆盖、文档缺失，直接重写风险极高、周期极长'
    - '- 微前端提供“绞杀者模式”落地路径：新功能用新栈写子应用、老功能跑在老子应用里、基座逐步接管路由/权限/登态，实现平滑过渡'
    - '**核心定义**'
    - '- 一套从资产梳理、边界拆分、构建适配、基座接入、灰度发布、回滚预案的标准化改造方法论'
    - '**关键性质**'
    - '- 资产梳理与边界拆分：按业务域/页面/组件粒度识别“高频变更/高价值/低耦合”模块优先剥离为首批子应用，核心稳态模块留在主应用或最后迁移'
    - '- 构建产物适配基座：'
    - '  - 无构建工具老项目：引入 Vite/Webpack，补全 `package.json`、暴露生命周期钩子（`bootstrap/mount/unmount`）、处理全局变量/样式冲突'
    - '  - 产物输出为 `UMD`/`SystemJS` 格式，配置 `libraryTarget`、`publicPath` 动态注入'
    - '- 基座路由分发与状态同步：主应用接管登录态、权限、全局菜单、路由守卫；子应用仅管业务路由，通过 `props` 接收基座下发的用户信息/Token/路由前缀'
    - '- 通信与共享：跨子应用跳转用基座 `pushState` + 事件总线；共享状态（购物车/用户偏好）沉淀至基座 `globalState` 或共享
      Redux/Pinia 实例'
    - '- 灰度发布与回滚预案：'
    - '  - Nginx 流量镜像/金丝雀：新旧子应用并行部署，按用户 ID/白名单/比例分流'
    - '  - 一键回滚：Nginx 配置热加载切回旧版本 Upstream，或基座动态下线子应用注册表'
    - '  - 监控兜底：错误率/空白页率/加载时长超阈值自动触发告警并回滚'
    - '**典型例子**'
    - '- 某电商后台管理系统（Vue2 + jQuery 混编，10万行）：'
    - '  1. 基座选型 qiankun（成熟、社区活）、搭建 React 18 主应用'
    - '  2. 首批剥离“商品管理”“订单中心”两个高频迭代模块为独立 Vue3 子应用'
    - '  3. 老系统整体作为“遗留子应用”跑在沙箱里，通过路由前缀 `/legacy/*` 托底'
    - '  4. 共享 `vue-demi` 统一 Vue2/Vue3 运行时、UI 库统一升级 Arco Design 由基座提供单例'
    - '  5. 灰度 10% 内部用户 -> 50% 灰度 -> 全量切换，历时 3 个月，零重大故障'
    - '**边界条件**'
    - '- 老系统若大量使用 `document.domain` 跨域、 `eval`/`new Function`、污染全局原型链，沙箱隔离极大概率失效，需先做“去污染”重构'
    - '- 共享状态过多（如全局几百个 Vuex 模块）迁移成本极高，建议“状态留在老子应用、新子应用通过事件总线跨沙箱通信”过渡'
    - '- 团队缺乏微前端调试经验（沙箱断点不生效、样式穿透排查难、网络请求归因难），必须先投入 1-2 个 Sprint 做基建工具链完善再推业务'
    sources:
    - paper: 20230418_043.md
      role: origin
    excerpts:
    - 梳理存量应用资产、拆分子应用边界、改造构建产物适配基座、配置 Nginx 反向代理、金丝雀发布与一键回滚演练。
    - 实战：遗留系统微前端化改造全流程——从资产梳理到灰度发布与回滚预案
  - 'no': 6
    name: AI 赋能微前端工程化 —— 从“手写脚手架”到“智能物业管家”
    points:
    - '**为什么需要这个概念？**'
    - '- 微前端基座与子应用的样板代码高度同构（生命周期、路由、沙箱配置、依赖声明），手工编写重复度极高、易出错、维护成本大'
    - '- 传统脚手架仅能生成静态模版，无法感知业务上下文、技术栈差异、遗留系统约束，导致生成代码仍需大量人工修改'
    - '- 运维操作（依赖升级、发布部署、监控巡检、沙箱调试）高度依赖人工经验，缺乏自动化与智能化支撑，成为规模化扩展的瓶颈'
    - '**核心定义**'
    - '- 一套融合提示词工程、RPA 自动化、智能路由、AI 测试监控的微前端全生命周期智能化工程体系，旨在将“代码生成、基建运维、流量分发、质量保障、遗留重构”五大高频场景的边际成本压缩至近零'
    - '**关键性质**'
    - '- 提示词工程落地：'
    - '  - 基座/子应用脚手架代码生成：角色设定 + 任务拆解 + 输出格式 + 少样本示例，覆盖生命周期钩子、路由配置、沙箱适配、依赖声明四大模块'
    - '  - 配置模版化：`qiankun` 配置、`vite.config.ts`、`webpack.config.js`、`package.json`
      标准化模版，支持变量插值与条件渲染'
    - '  - Prompt 库沉淀：建立团队级 `prompts/micro-frontend/` 目录，版本化管理，支持 `promptfoo` 回归测试与
      A/B 评测'
    - '- RPA 自动化集成：'
    - '  - 脚手架生成：`create-micro-app` 一键产出标准化仓库结构、CI/CD 配置、监控埋点、文档站'
    - '  - 依赖升级：Dependabot + 语义化版本规则 + 自动化变更日志生成 + 破坏性变更阻断合并'
    - '  - 发布流水线：GitHub Actions / GitLab CI 标准化编排，覆盖构建、测试、扫描、部署、验证、回滚全链路'
    - '  - 监控巡检：定时任务抓取基座/子应用健康指标，异常自动工单、钉钉/飞书告警、周报自动生成'
    - '- 智能路由与分发：'
    - '  - AI 感知路由匹配：基于用户行为序列预测下一跳子应用，预加载 `remoteEntry.js` 与关键 Chunk'
    - '  - 动态基座加载：按需注入基座运行时，冷启动子应用仅加载必要模块，减少首屏 JS 体积'
    - '  - 跨应用状态同步：基于事件总线 + 共享存储，实现登录态、权限、主题、国际化配置的多端一致性'
    - '- 自动化测试与监控：'
    - '  - E2E 用例生成：从业务流程描述（自然语言）自动生成 Playwright/Vitest 测试代码，覆盖登录、支付、跨应用跳转等核心链路'
    - '  - 沙箱异常诊断：收集 `proxy` 沙箱错误堆栈 + 源码映射，微调分类器自动定位“全局污染/生命周期泄漏/样式穿透/依赖冲突”四大故障'
    - '  - 性能基线智能告警：建立 LCP/CLS/INP/JS Heap 多维基线，引入异常检测算法（Isolation Forest/Prophet），替代静态阈值，消除告警风暴'
    - '- 遗留系统 AI 重构：'
    - '  - 代码理解：输入遗留代码库，输出模块依赖图、全局变量清单、业务领域划分、技术债务热力图'
    - '  - 生命周期补全：自动识别入口文件、注入 `bootstrap/mount/unmount` 钩子、处理全局污染变量、生成 `publicPath`
      运行时注入逻辑'
    - '  - 依赖拓扑分析：构建 `import`/`require`/`script` 三源融合的依赖图，识别循环依赖、版本冲突、未声明依赖，生成 `externals`
      与 `shared` 配置建议'
    - '  - 增量迁移：按“绞杀者模式”生成迁移任务拆解（Strangler Fig Pattern），每期交付可独立部署、可回滚的子应用增量'
    - '**典型例子**'
    - '- 某团队引入 `create-micro-app` + `promptfoo` 后，子应用接入耗时从 2 人天降至 2 小时，配置错误率归零'
    - '- RPA 流水线实现“提交 PR -> 自动生成子应用仓库 -> 跑通流水线 -> 基座注册 -> 灰度 10% -> 全量”全自动闭环，人工干预仅限
      Review'
    - '- 智能路由预加载使子应用首屏白屏时间从 1.2s 降至 300ms，用户感知流畅度显著提升'
    - '- 沙箱异常分类器准确率达 92%，平均定位时间从 30min 缩短至 3min，MTTR 大幅下降'
    - '- 遗留 jQuery 系统 AI 重构：5 万行代码 2 小时完成依赖拓扑与生命周期适配，较人工 3 周提效 90%，顺利接入 qiankun 沙箱'
    - '**边界条件**'
    - '- Prompt 工程需配合 `promptfoo` 回归测试，防止模型幻觉导致生成代码含语法错误或逻辑漏洞'
    - '- RPA 自动化仅适用于确定性流程，非常规发布、应急回滚、跨团队协同仍需人工介入'
    - '- 智能路由预测模型需定期用最新日志微调，防止数据漂移导致预加载失效或误加载'
    - '- AI 测试生成的用例需人工抽样复核，核心链路 100% 覆盖前不得仅依赖 AI 产出'
    - '- 遗留系统重构中，涉及 `eval`/`Function` 动态执行、`document.write`、`with` 语句等动态特性时，AI 理解准确率下降，需人工兜底'
