  life_analogy:
  - 想象 RAG 系统是一个**企业级智能知识管理中心**：
  - '- **文档解析与分块** = **专业档案整理员**：将杂乱无章的原始资料（PDF、代码、表格）按章节、函数、行拆分成标准化‘知识卡片’，并加上重叠便利贴防止上下文丢失'
  - '- **向量索引与混合检索** = **双模检索员团队**：语义检索员（向量）擅长‘找意思相近的’；关键词检索员（BM25）擅长‘精准找错误码、型号’，两人合作再由**融合策略（RRF）**裁定最终名单'
  - '- **重排序与压缩** = **首席分析师 + 摘要专员**：初筛名单交给分析师精读打分，踢走噪音；摘要专员将长篇大论压缩成‘核心证据清单’，只留决策所需干货'
  - '- **查询重写与路由** = **需求分析师 + 导航员**：把老板模糊的一句‘对比一下’拆解成三个具体子任务，并指派去结构化数据库查表、去文库找文档、去网上搜最新资讯'
  - '- **评估与飞轮** = **质检部 + 持续改进办**：每周用标准考卷测系统，哪个环节丢分就优化哪个，自动生成新训练数据喂回系统'
  - '- **Agentic RAG** = **资深项目经理**：不再死板走流程，而是自主判断‘要不要查’、‘查完靠不靠谱’、‘需不需要再查一次’，直到拿出满意交付物'
  - '- **安全合规** = **保密办 + 法务**：文件分级归档、敏感信息打码、借阅登记审批、操作留痕可查，确保知识资产不外泄'
  summary:
  - concept: Naive/Advanced/Modular RAG
    desc: 从线性流程到标准化组件接口的演进，解耦索引、检索、生成实现策略即插即用
  - concept: 分块策略
    desc: 固定/语义/层级/Agentic 四大流派，核心权衡语义完整性与检索粒度，无银弹需按文档类型决策
  - concept: 混合检索
    desc: 稠密向量（语义模糊）+ 稀疏 BM25（关键词精准）+ RRF 融合，双保险覆盖多样查询需求
  - concept: 重排序
    desc: Cross-Encoder/LLM 对 Top-K 精细打分，解决 Bi-Encoder 召回精度不足，延迟换精度
  - concept: 上下文压缩
    desc: 抽取/摘要/Token级压缩，在 Lost-in-the-Middle 与 Token 成本约束下最大化信噪比
  - concept: 查询重写
    desc: HyDE、子查询分解、历史改写，将用户模糊意图翻译为检索友好的结构化查询集合
  - concept: 查询路由
    desc: 意图分类后动态分发至向量库/图谱/SQL/Web，解决异构数据源统一接入问题
  - concept: RAGAS/ARES
    desc: 忠实度、答案相关性、上下文精确率/召回率四大核心指标，配合合成测试集构建自动化评测闭环
  - concept: GraphRAG
    desc: 实体关系图谱+社区层级摘要，擅长全局汇总与跨文档多跳推理，构建成本高适合静态知识
  - concept: Agentic RAG
    desc: 检索工具化+Agent自主规划循环，解决复杂任务动态决策需求，引入非确定性需设置预算兜底
  - concept: 流式响应/语义缓存
    desc: 流式降低首包感知延迟，语义缓存命中高频 FAQ 大幅降本增效，需防缓存污染与失效策略
  - concept: 故障四类诊断树
    desc: 未命中/噪声/幻觉/格式错误 -> 定责模块 -> 指标异常 -> 根因验证 -> 缓解方案，标准化排查流程
  - concept: RAG 与微调协同
    desc: 高频动态事实走 RAG，低频深层模式走微调，持续预训练+SFT+RAG 三层组合为最佳实践
  - concept: 多模态 RAG
    desc: 文本/表格/图像统一解析、嵌入、生成管线，核心难点在表格结构化、图表推理与多模态对齐
  - concept: 安全合规体系
    desc: 租户隔离、敏感脱敏、检索 ACL、审计日志四道防线，满足企业级数据红线与监管要求
  exercises:
  - 'no': 1
    title: 分块策略对比实验
    contents:
    - 给定一份 50 页的技术 PDF 文档（含标题层级、代码块、表格），分别实现：
    - 1. 固定长度分块
    - 2. 基于 Markdown 标题层级的递归分块
    - 3. 语义相似度分块
    - 对比指标：平均块长、标题完整率、代码块完整率、检索召回率（构建 20 条测试问答）
    - 回答问题：
    - '- 何种场景下固定长度分块反而优于语义分块？'
    - '- chunk_overlap 设为 0 会导致什么典型检索失败案例？'
  - 'no': 2
    title: 混合检索融合算法实现与调优
    contents:
    - 实现一个混合检索器，输入 Query，并行输出：
    - 1. 向量检索 Top-20
    - 2. BM25 检索 Top-20
    - 3. 实现 RRF（k=60）融合
    - 4. 实现加权求和融合（需解决分数归一化）
    - 在同一测试集上对比 Recall@10、MRR、延迟
    - 回答问题：
    - '- 为什么 RRF 通常比加权求和更鲁棒？'
    - '- 当向量检索与 BM25 召回结果完全不重叠时，RRF 表现如何？'
  - 'no': 3
    title: RAGAS 评测流水线搭建
    contents:
    - 基于某垂直领域文档库（如 100 份合同），构建评测流程：
    - 1. 使用 LLM 生成 200 条合成 QA 对（含单跳、多跳、不可答）
    - 2. 人工抽检 50 条校准质量
    - 3. 跑通 RAGAS 评测：计算 Faithfulness、Answer Relevancy、Context Precision、Context Recall
    - 4. 修改分块大小或 Top-K，重跑评测对比指标变化
    - 回答问题：
    - '- LLM-as-a-Judge 评估忠实度时，常见的‘位置偏好’偏见如何通过 Prompt 工程缓解？'
    - '- 离线指标提升 5% 但线上 A/B 测试无显著差异，可能原因有哪些？'
  - 'no': 4
    title: 故障诊断演练：从‘答非所问’到根因定位
    contents:
    - 现象：用户问‘公司 2023 年差旅报销标准’，系统回答‘2021 年标准是...’
    - 请按诊断树逐步排查：
    - 1. 检查索引是否包含 2023 年文档
    - 2. 检查分块是否切断了年份上下文
    - 3. 检查查询重写是否提取了年份实体
    - 4. 检查重排序是否将旧文档排在前面
    - 5. 检查 Prompt 是否强制引用来源与时间
    - 给出每一步的验证命令/日志查询方法，并制定修复方案与回归测试用例
  - 'no': 5
    title: Agentic RAG 核心循环最小原型
    contents:
    - 使用 LangGraph 实现一个极简 Agentic RAG：
    - 状态：query, context, answer, steps
    - 节点：
    - 1. rewrite_query (LLM 改写/分解)
    - 2. retrieve (向量/BM25/Graph 三选一工具调用)
    - 3. grade_docs (LLM 打分是否相关)
    - 4. generate (生成答案)
    - 5. reflect (LLM 判断答案是否完整/有幻觉，决定循环或结束)
    - 边：grade_docs 低分 -> rewrite_query；reflect 不通过 -> retrieve
    - 设置最大步数 5，运行 3 个复杂多跳问题，观察轨迹
    - 回答问题：
    - '- 如何防止 Agent 陷入‘重写->检索->低分->重写’的无限循环？'
    - '- 将检索器封装为 Tool 相比固定 Chain 调用，在错误恢复能力上有何本质区别？'
  units:
  - 'no': 1
    name: RAG 范式演进 —— 从朴素检索到模块化知识计算
    points:
    - '**为什么需要这个概念？**'
    - '- 早期 Naive RAG 存在“召回不全、排序不准、生成幻觉”的三大顽疾，无法满足生产环境对准确性与可靠性的要求'
    - '- 随着业务复杂度增加，固定的“检索-生成”线性流程无法应对多跳推理、动态知识获取等场景'
    - '- 需要将 RAG 重构为标准化、可组装的工程化组件，实现策略的灵活切换与迭代优化'
    - '**核心定义**'
    - '- 模块化 RAG 将系统解耦为索引构建、检索增强、生成融合三大标准化阶段，每个阶段定义标准接口'
    - '- 核心组件包括：DocumentLoader/Transformer（文档加载与转换）、VectorStore/Retriever（向量存储与检索器）、Generator（生成器）、Reranker（重排序器）、QueryRewriter（查询重写器）'
    - '- 通过 Pipeline 编排器将组件串联，支持混合检索、父子文档、假设性文档嵌入等高级策略的即插即用'
    - '**关键性质**'
    - '- 解耦性：检索策略、嵌入模型、生成模型可独立替换升级，互不影响'
    - '- 可观测性：每个模块输入输出可追踪，便于诊断“未命中-噪声干扰-生成幻觉”故障链路'
    - '- 可评测性：模块化边界使得 RAGAS/ARES 等评测指标可精准定位至具体环节（如上下文精确率归因于检索器）'
    - '**典型例子**'
    - '- Naive RAG：简单的向量相似度 Top-K 检索 + 直接拼接 Prompt 生成，召回率低、易受干扰'
    - '- Advanced RAG：引入查询重写、混合检索、重排序、上下文压缩，显著提升答案忠实度'
    - '- Modular RAG：以 LangChain/LlamaIndex 为代表，通过标准化接口组装 Agentic RAG、GraphRAG 等变体'
    - '**边界条件**'
    - '- 过度模块化可能引入编排开销与延迟，简单 QA 场景 Naive RAG 的 ROI 可能更高'
    - '- 组件接口标准化程度依赖框架生态成熟度，自研组件需遵循统一 Schema 才能纳入 Pipeline'
    - '- 模块化解决的是工程复用问题，核心检索质量仍取决于数据质量、分块策略与 Embedding 模型能力'
    sources:
    - paper: 20230418_095.md
      role: origin
    - paper: 20230418_106.md
      role: improve
    - paper: 20230418_109.md
      role: apply
    excerpts:
    - 梳理Naive RAG -> Advanced RAG -> Modular RAG演进脉络，定义检索器、生成器、重排序器、查询重写器等标准化组件接口。
    - 定义标准化 RAG Pipeline 接口：DocumentLoader/Transformer -> VectorStore/Retriever ->
      Generator，支持混合检索、父子文档、假设性文档嵌入等高级策略的即插即用组装。
    - 提炼生产级应用必备的非功能性需求：流式输出、异步编排、可观测性、版本管理与回滚，给出基于 LangChain/LangGraph 的分层架构参考实现蓝图。
  - 'no': 2
    name: 文档解析与分块策略 —— 知识入库的“切刀”与“筛网”
    points:
    - '**为什么需要这个概念？**'
    - '- 原始文档（PDF/代码/表格）结构异质、长度超限，直接嵌入会导致语义稀释、上下文窗口溢出、关键信息丢失'
    - '- 分块质量直接决定检索上限：“切太碎”丢失上下文连贯性，“切太粗”引入噪声稀释相关性'
    - '- 不同文档类型（结构化代码、非结构化长文、表格图表）对分块策略敏感度极高，无银弹方案'
    - '**核心定义**'
    - '- 文档解析：将异构格式（PDF/HTML/Code/Table）统一转化为结构化文档对象，保留标题层级、代码块、表格结构等元信息'
    - '- 分块策略：将长文档切分为适合 Embedding 编码与上下文窗口的文本块，核心参数含 chunk_size（块大小）、chunk_overlap（重叠量）、separators（分隔符）'
    - '**关键性质**'
    - '- 固定长度分块：实现简单、成本低，但易破坏语义完整性（如截断句子、拆散代码函数）'
    - '- 语义分块：基于嵌入相似度或标题层级切分，保持语义内聚，但计算开销大、依赖嵌入模型质量'
    - '- 层级/父子分块：构建大块（父）用于召回、小块（子）用于精读，平衡上下文广度与精度'
    - '- Agentic Chunking：引入 LLM 智能判断切分点，适应复杂文档结构，但延迟高、成本高、确定性难保证'
    - '**典型例子**'
    - '- 代码文档：按函数/类定义为边界分块（AST 解析），保留函数签名与文档字符串'
    - '- 技术手册/PDF：基于标题层级（Markdown Header Splitter）递归分块，保留章节上下文'
    - '- 表格数据：行级分块 + 表头注入，或转为 Markdown/JSON 结构化文本后嵌入'
    - '- 长上下文场景：父块 1500 tokens 召回，子块 300 tokens 重排/生成'
    - '**边界条件**'
    - '- Embedding 模型最大输入长度（如 512/8192 tokens）设定 chunk_size 硬上限'
    - '- 重叠过大导致索引膨胀、检索冗余；重叠过小导致语义边界割裂'
    - '- 解析器对复杂版面（多栏、公式、扫描件）鲁棒性有限，Garbage In, Garbage Out 原则下需人工清洗兜底'
    sources:
