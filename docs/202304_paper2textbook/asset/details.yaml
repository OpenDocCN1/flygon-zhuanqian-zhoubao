      role: origin
    - paper: 20230418_091.md
      role: improve
    excerpts:
    - 解决长对话中的上下文窗口溢出、一致性漂移问题，引入摘要记忆与检索式对话历史。
    - 状态压缩技术包括对话摘要、关键实体抽取、滑动窗口与语义检索融合。
  - 'no': 3
    name: LLM代理规划与任务分解：从单步到复杂目标达成
    points:
    - '**为什么需要这个概念？**'
    - '- 单轮提示无法解决需要多步工具调用、条件分支、错误重试的复杂任务'
    - '- 模型缺乏内在的“项目管理”能力，易陷入循环、遗漏子目标或工具调用参数错误'
    - '- 需要显式的规划模块将高层目标分解为可执行的原子动作序列'
    - '**核心定义**'
    - '- Planning：生成结构化执行计划（如JSON/DAG/步骤列表），包含子任务、依赖、工具、预期产出'
    - '- Task Decomposition：将复杂指令递归拆解至可直接由工具执行的粒度'
    - '- Self-Reflection：执行后对比预期与实际结果，触发重规划或参数修正'
    - '**关键性质**'
    - '- ReAct范式：思考-行动-观察循环，适合探索性任务，但易因单步错误累积导致偏离'
    - '- Plan-and-Solve：先全局规划再执行，适合确定性流程，但缺乏运行时灵活性'
    - '- 规划粒度权衡：太粗→执行歧义大；太细→规划Token消耗大且脆弱'
    - '**典型例子**'
    - '- AutoGPT风格：目标“调研竞品定价” → 分解：搜索官网→爬取价格页→结构化提取→对比表生成'
    - '- 代码生成Agent：需求→架构设计→接口定义→逐模块编码→单测验证→集成跑通'
    - '**边界条件**'
    - '- 规划能力强依赖基座模型推理上限，小模型（<7B）规划常不可用'
    - '- 长链路规划中，早期决策错误会放大（蝴蝶效应），需引入人工确认关卡或奖励模型验证'
    - '- 动态环境（如网页结构变化）下，静态规划失效，需具备在线重规划能力'
    sources:
    - paper: 20230418_092.md
      role: origin
    - paper: 20230418_093.md
      role: improve
    excerpts:
    - 剖析Planning、Task Decomposition、Self-Reflection在自主代理中的提示实现模式。
    - ReAct、Plan-and-Solve、Reflexion等范式的对比与适用边界分析。
  - 'no': 4
    name: 长上下文处理策略：失落中间现象与注意力引导
    points:
    - '**为什么需要这个概念？**'
    - '- 尽管模型声称支持32k/128k/1M上下文，实际有效利用率随位置呈U型曲线：首尾高、中间低'
    - '- 关键证据（如检索关键句）若位于中间，模型极大概率“视而不见”导致回答错误'
    - '- 单纯堆叠文档无法保证生成质量，必须显式引导模型注意力'
    - '**核心定义**'
    - '- Lost-in-the-Middle：Transformer注意力机制在长序列中对中间Token关注权重系统性偏低的现象'
    - '- 注意力引导：通过提示工程（指令、标记、结构化）或模型干预（位置偏置、检索增强）强制聚焦关键段落'
    - '**关键性质**'
    - '- 关键信息前置/后置策略：将最核心的指令、少样本示例、检索到的关键证据放在上下文首尾'
    - '- 结构化标记：使用XML标签、Markdown标题、特殊分隔符显式划分语义块，辅助模型定位'
    - '- 分块摘要/Map-Reduce：超长文档先分块摘要，再汇总，规避中间遗忘，但可能丢失跨块关联'
    - '**典型例子**'
    - '- 合同审查：将“核心风险条款”提取放在Prompt开头，原文放在结尾供溯源'
    - '- 代码库问答：检索Top-K相关片段，按相关性倒序排列（最相关在最前/最后），而非按文件顺序'
    - '**边界条件**'
    - '- 当有效上下文长度超过模型实际注意力跨度（如>32k实测有效）时，前置策略也会失效'
    - '- 过度的注意力引导指令（如“重点阅读第3段”）会消耗宝贵Token，且可能被模型忽略'
    - '- 多跳推理任务需跨段落综合信息，单纯前置无法解决，需显式要求模型列出引用源片段'
    sources:
    - paper: 20230418_094.md
      role: origin
    - paper: 20230418_111.md
      role: critique
    excerpts:
    - 实验揭示长上下文‘中间遗忘’规律，提出关键信息前置、分块摘要等缓解策略。
    - 注意力引导技术包括：指令强制聚焦、结构化标记、检索重排序、分层摘要。
