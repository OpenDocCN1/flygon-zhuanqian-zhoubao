  life_analogy:
  - 想象前端技术演进是一场**城市基础设施的迭代升级**：
  - '- **Web Components** = **统一接口标准的“预制组件”**：像水电燃气的标准化管道接口，不管你用什么品牌的装修风格（React/Vue），都能直接接入城市主管网，且自带独立表计（Shadow
    DOM 隔离）、原生接入市政表单系统（FACE）、支持远程抄表主题下发（Constructible Stylesheets）。'
  - '- **Signals** = **智能家居的“传感器-执行器”总线**：不需要中央大脑（虚拟 DOM）轮询全屋状态，拉窗帘（set signal）时，只有关联的灯光/空调（effect/computed）精准响应，且这套总线能从别墅（React）搬到公寓（Vue/Vanilla/Worker）无需重装。'
  - '- **原子化框架 (Qwik/Astro/Fresh)** = **“按需送装” 的模块化家具物流**：传统 SPA 是把整屋家具拆成螺丝钉（打包 JS）运到现场再组装（水合），耗时耗力；Qwik
    是把组装好的家具连同说明书（序列化闭包）直接运来，住户动手（交互）时才拆封说明书；Astro 是默认只运成品家具（静态 HTML），只有智能马桶等需交互件（岛屿）才配送安装工；Fresh
    则是就在楼下工厂（边缘节点）现做现送。'
  - '- **RSC** = **“中央厨房+前场盛装” 的餐饮新模式**：传统 SSR 是中央厨房做好全套菜（HTML）端上桌，食客还得自己把菜切碎重组装（水合）才能吃；RSC
    把耗时、隐私、重工序的备菜、炖汤（数据获取、后端直连、大依赖）留在中央厨房，只把精美摆盘（RSC Payload）端上桌，食客只需动刀叉（Client Component
    交互）即可，甚至厨师还能根据食客反馈（Server Action）实时调味。'
  - '- **TC39/W3C 提案** = **城市规划局的“蓝图与预留用地”**：Temporal 是统一时区的新标准钟楼；Decorators 是给建筑打统一标签的元数据系统；Record/Tuple
    是不可篡改的档案原件；Import Maps 是统一的地址门牌映射表。提前研读蓝图，盖房子（写框架/业务）时就不会踩中未来的地铁线。'
  summary:
  - concept: Declarative Shadow DOM (DSD)
    desc: 在 HTML 中声明式定义 Shadow Root，解决 Web Components SSR 闪烁与水合难题
  - concept: Form Associated Custom Elements (FACE)
    desc: 让自定义元素原生参与表单提交、验证、重置，成为真正的表单控件
  - concept: CSS Parts / Constructible Stylesheets
    desc: 标准化的 Shadow DOM 样式穿透与共享方案，支撑设计系统主题分发
  - concept: Signal (信号)
    desc: 细粒度响应式核心原语：自动依赖追踪、运行时收集、无需编译、跨框架复用
  - concept: computed / effect
    desc: 派生状态与副作用原语：惰性缓存计算、依赖变更自动调度执行
  - concept: '@preact/signals-core'
    desc: 框架无关的信号核心实现（~1KB），支撑 Vanilla/Worker/React/Vue/Solid 共享响应式逻辑
  - concept: Resumability (Qwik)
    desc: 序列化闭包而非重演水合：服务端序列化状态与 Handler，客户端按需恢复执行
  - concept: Islands Architecture (Astro)
    desc: HTML 优先，仅交互组件作为岛屿部分水合，支持多框架混用
  - concept: Zero-Hydration / Edge-Native (Fresh)
    desc: Deno 边缘预渲染，默认零客户端 JS，交互通过表单或 Preact Signals 局部增强
  - concept: Server Components (RSC)
    desc: 仅在服务端运行、零包体积发送客户端、可直接访问数据库/文件系统/密钥
  - concept: Client Components (RSC)
    desc: 需交互/状态/浏览器 API 的组件，标记 'use client'，正常打包水合
  - concept: Flight Protocol / RSC Payload
    desc: RSC 流式传输的统一数据格式：虚拟 UI 树、Client Component 引用、Promise 占位符
  - concept: Server Actions
    desc: 标记 'use server' 的服务端函数，客户端调用触发 POST 实现数据变更与重新验证
  - concept: Temporal API
    desc: Stage 3 提案，替代 Date，提供不可变、时区原生、纳秒精度的现代日期时间操作
  - concept: Standard Decorators
    desc: Stage 3 提案，标准化元编程能力，框架注解系统迁移目标，不可修改类结构
  - concept: Record & Tuple
    desc: Stage 2 提案，深度不可变、值语义比较的复合原始类型，解决对象/数组引用比较痛点
  - concept: Import Maps
    desc: 浏览器原生裸说明符映射标准，支持无构建开发、微前端运行时依赖共享
  - concept: ShadowRealm
    desc: Stage 3 提案，轻量级全局作用域隔离沙箱，适配插件系统、多版本共存
