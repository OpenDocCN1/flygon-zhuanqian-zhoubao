  - 'no': 1
    name: 混合专家模型 —— 稀疏激活的规模化路径
    points:
    - '**为什么需要这个概念？**'
    - '- 密集模型参数量增长受限于算力与通信开销，难以无限扩展'
    - '- 需要在不显著增加推理计算量的前提下提升模型容量'
    - '- 稀疏激活机制允许模型参数量大幅增长，但每次前向传播仅激活部分参数'
    - '**核心定义**'
    - '- MoE 由多个专家网络（通常为 FFN）和一个路由器组成'
    - '- 路由器根据输入动态选择 Top-K 个专家进行计算，其余专家不参与前向传播'
    - '- 总参数量 = 专家数 × 单专家参数量 + 共享参数，激活参数量 ≈ K × 单专家参数量 + 共享参数'
    - '**关键性质**'
    - '- 条件计算：输入相关的动态稀疏激活'
    - '- 专家并行：不同专家部署在不同设备，需高效的 All-to-All 通信'
    - '- 负载均衡：需辅助损失函数防止路由器倾向于固定专家导致参数利用率低'
    - '**典型例子**'
    - '- Switch Transformer：Top-1 路由，简化通信，实现万亿参数级模型训练'
    - '- DeepSeekMoE：细粒度专家拆分 + 共享专家隔离，平衡专业化与通用知识获取'
    - '**边界条件**'
    - '- 通信开销大：All-to-All 通信在专家并行时成为瓶颈，需高带宽互联'
    - '- 训练不稳定：路由器梯度方差大，易发散，需精心设计负载均衡损失与学习率调度'
    - '- 推理内存压力：虽计算稀疏，但所有专家权重需常驻显存（或需专家卸载技术）'
    - '...'
    sources:
    - paper: 20230418_070.md
      role: origin
    - paper: XiwmdQFijotSRAxrBv8c1dLmndr.md
      role: improve
    excerpts:
    - 详解 Switch Transformer/DeepSeekMoE 的路由机制、负载均衡损失、专家并行部署，分析通信开销与训练稳定性的工程对策。
    - MoE 核心在于稀疏激活：总参数量大，但激活参数量小。路由器决定 token 去哪个专家。
  - 'no': 2
    name: 原生多模态 —— 统一表征的‘通用语言’
    points:
    - '**为什么需要这个概念？**'
    - '- 传统多模态采用‘对齐’范式（如 CLIP），模态间交互浅层，难以实现深度推理融合'
    - '- 离散化方案（VQ-VAE）将图像压缩为 Token，但重建质量与语义保真难以平衡'
    - '- 需要一种从数据层面统一建模文本、图像、音频等模态的架构'
    - '**核心定义**'
    - '- 原生多模态：使用统一的 Tokenizer 将不同模态数据映射为统一词表中的 Token，共享同一套 Transformer 主干网络进行联合预训练'
    - '- 典型代表：Chameleon，采用图像离散化 Tokenizer + 文本 Tokenizer 合并词表，交错序列建模'
    - '**关键性质**'
    - '- 模态无关的注意力机制：Self-Attention 天然支持跨模态 Token 交互'
    - '- 交错训练数据：文本-图像交错序列而非简单配对，学习模态转换与融合'
    - '- 统一生成能力：同一模型可同时输出文本和图像 Token，实现真正的多模态生成'
    - '**典型例子**'
    - '- Chameleon：早期融合架构，图像编码为 1024 个离散 Token，与文本混合训练'
    - '- 统一 Tokenizer 设计：共享码本，特殊 Token 标识模态边界（如 <IMG>、<TEXT>)'
    - '**边界条件**'
    - '- 图像离散化信息损失：VQ-VAE 压缩导致高频细节丢失，影响生成保真度'
    - '- 训练难度极大：模态间分布差异大，优化景观复杂，需精细的数据比例调度与损失加权'
    - '- 序列长度爆炸：图像展开为大量 Token，显著增加训练显存与计算开销'
    - '...'
    sources:
    - paper: 20230418_071.md
      role: origin
    - paper: 20230418_072.md
      role: improve
    excerpts:
    - 对比 CLIP 对齐、VQ-VAE 离散化、原生多模态（如 Chameleon）的图文联合建模路线，探讨图文交错数据比例对能力迁移的影响。
    - 原生多模态核心：统一 Tokenizer + 统一 Backbone + 交错序列训练。
  - 'no': 3
    name: LLM Agent —— 赋予模型‘手脚’与‘大脑’的协作
    points:
    - '**为什么需要这个概念？**'
    - '- 单纯 LLM 缺乏外部环境交互能力（无法获取实时信息、执行代码、操作工具）'
    - '- 复杂任务需要规划、分步执行、错误修正与记忆积累，单轮生成无法满足'
    - '- 需要标准化的架构将 LLM 从‘生成文本’升级为‘自主执行任务’'
    - '**核心定义**'
    - '- Agent = LLM（大脑/决策者）+ 规划模块 + 记忆模块（短时/长时）+ 工具集（行动）+ 环境反馈'
    - '- 核心范式：ReAct（推理+行动交织）、Plan-and-Execute（显式规划+执行分离）、Reflexion（试错+语言反思修正）'
    - '**关键性质**'
    - '- 工具使用标准化：Function Calling / MCP 协议定义工具 Schema，实现工具即插即用'
    - '- 记忆分层：工作记忆（上下文窗口）、情景记忆（向量检索）、语义记忆（知识图谱）、程序性记忆（技能）'
    - '- 规划与搜索：ToT/树搜索、DAG 任务图并行、LLM Compiler 编译执行计划'
    - '**典型例子**'
    - '- ReAct：思考 -> 行动 -> 观察 循环，解决热点问答、事实核查'
    - '- MetaGPT / ChatDev：多 Agent 角色扮演（PM/Engineer/QA），标准化软件开发 SOP'
    - '- AutoGen：群聊模式，Agent 间自主协商解决复杂编程/数学问题'
    - '**边界条件**'
    - '- 上下文窗口限制：长任务轨迹易溢出，需记忆压缩/摘要/检索机制'
    - '- 幻觉放大与错误累积：单步错误导致后续偏离，需 Reflexion/Verifier/人工介入兜底'
    - '- 成本与延迟：多轮交互、工具调用、树搜索带来高 Token 消耗与高延迟'
    - '...'
    sources:
    - paper: 20230418_073.md
      role: origin
    - paper: 20230418_074.md
      role: improve
    excerpts:
    - 拆解 ReAct、Plan-and-Execute、Reflexion 等 Agent 范式，详解向量数据库长时记忆、函数调用、多 Agent 协商协议（如
      MetaGPT）的落地细节。
    - Agent 核心：LLM 作为 Controller，通过 Tool 与 Environment 交互，Memory 提供状态持久化。
  - 'no': 4
    name: Test-Time Scaling —— 推理时计算的新 Scaling Law
    points:
    - '**为什么需要这个概念？**'
    - '- 预训练与后训练（SFT/RLHF）算力投入边际收益递减，遇到‘数据墙’与‘算力墙’'
    - '- 传统推理仅单次前向传播，无法利用额外推理算力提升答案质量'
    - '- 需要一种机制：在推理阶段投入更多计算，换取更高的问题解决能力'
    - '**核心定义**'
    - '- Test-Time Scaling：通过在推理阶段引入搜索、验证、自我修正机制，利用额外计算量提升模型性能'
    - '- 核心组件：策略模型（生成候选推理路径）、过程奖励模型 PRM（逐步打分）、搜索算法（MCTS/Beam Search/Best-of-N）'
    - '- 代表范式：OpenAI o1 系列模型，通过长链式思维+强化学习训练‘慢思考’能力'
    - '**关键性质**'
    - '- 计算与性能正相关：推理 Token 数/搜索宽度/深度增加，Pass@1 准确率稳步提升'
    - '- 过程监督优于结果监督：PRM 对每一推理步骤打分，比仅对最终答案打分的 ORM 更精准引导搜索'
    - '- 自我修正与回溯：模型能识别自身错误并回溯尝试新路径，类比人类 System 2 思维'
    - '**典型例子**'
    - '- OpenAI o1：大规模 RL 训练长 CoT，推理时自动生成长推理链，数学/代码/科学基准大幅超越 GPT-4o'
    - '- MCTS + PRM：在数学推理中，树搜索结合过程奖励模型显著提升解题率'
