  life_analogy:
  - 想象跨端开发是**一家想要全球开连锁店的餐厅集团** ：
  - '- **Hybrid/WebView** = **外卖加盟模式**：把菜单（Web页面）发给当地食堂（WebView）做，食堂设备不统一（内核碎片化），菜品口味（体验）漂移大，但开店最快、成本最低。'
  - '- **小程序/双线程** = **商场柜台模式**：商场（宿主环境）提供统一装修标准（基础库）和收银系统（原生能力），你只管配菜单（逻辑层）和摆盘（视图层），但柜台面积有限（包体积2M），不能用明火（无完整DOM/BOM）。'
  - '- **React Native (新架构)** = **中央厨房预制菜+同城配送**：中央厨房（JS线程/JSI）统一研发标准菜谱（组件），通过高速专线（Fabric同步渲染）直达门店后厨（Native渲染器）出品，按需开启配送线路，保证口味一致且上菜快。'
  - '- **Flutter/KMP** = **自带厨房设备的标准化门店**：连锁总部（Flutter Engine/Dart AOT）统一配发全套厨具（Skia/Impeller绘制引擎）和标准操作手册（Widget），不依赖当地食堂设备，哪家门店做出来的菜（像素）都一模一样。'
  - '- **Uni-app/Taro** = **万能菜谱翻译官**：你写一份通用菜谱（Vue/React DSL），翻译官（编译器）自动把它翻成肯德基格式、麦当劳格式、本地小吃街格式，还能根据门店设备（条件编译）微调做法。'
  - '- **混合栈** = **老店翻新不歇业**：老字号（原生App）不想全拆重建，就在后院盖个标准化中央厨房模块，新菜品（新业务）在新厨房做，老招牌菜（核心链路）老厨房做，共用一套食材仓库和收银系统。'
  - '- **AI 辅助开发** = **智能中央厨房机器人**：ChatGPT/RPA 等 AI 工具作为“超级备菜员”，根据标准菜谱（Prompt/SOP）批量生产半成品（代码/文案/图片），主厨（开发者）只需把关质量、组装摆盘，大幅提升出菜速度与一致性。'
  - '- **WebAssembly** = **特种食材加工间**：核心调味料（计算密集型算法）用专用设备（Wasm/Rust/C++）预制成半成品，再在中央厨房（JS主线程）快速调用，不占用主灶台资源。'
  - '- **平台合规** = **食品安全监管红线**：小程序审核、App Store 政策如同卫生许可证，跨端方案必须内置“合规基因”（隐私合规、API 合规、内容安全），否则面临“关店整顿”（下架、封号）风险。'
  summary:
  - concept: 四大架构范式
    desc: 按渲染归属与通信机制分类：Hybrid、小程序、原生渲染、AOT自绘，性能与体验呈阶梯分布
  - concept: JSI
    desc: RN新架构基石，C++层直接持有JS对象引用，实现同步、双向、类型安全的跨语言调用，替代异步Bridge
  - concept: Fabric
    desc: 基于JSI的C++同步渲染器，统一渲染逻辑，支持同步布局、并发特性、跨平台行为一致
  - concept: TurboModules
    desc: 新一代Native模块系统，支持惰性加载、同步调用、HostObject、Codegen自动生成类型安全存根
  - concept: Hermes
    desc: 字节码预编译JS引擎，AOT减少启动解析开销，mmap内存映射、GC优化，适配移动端资源受限环境
  - concept: 三棵树
    desc: Flutter运行时核心：Widget(配置描述) -> Element(实例/复用/Diff) -> RenderObject(布局/绘制/语义)
  - concept: Impeller
    desc: Flutter新渲染后端，AOT编译着色器、显式管线状态、现代GPU API，解决Skia运行时编译导致的首帧抖动
  - concept: DSL约束
    desc: Uni-app/Taro限制Vue/React语法子集，保证模板可静态分析、可编译转译为目标平台原生代码
  - concept: 条件编译
    desc: 编译期根据目标平台裁剪/注入差异代码，实现同一代码库多端差异化适配
  - concept: 统一API抹平层
    desc: uni.xxx/Taro.xxx运行时适配器，桥接平台差异（请求/存储/导航/蓝牙等），暴露统一Promise风格接口
  - concept: Brownfield集成
    desc: 原生App作为宿主壳嵌入RN/Flutter模块，实现渐进式迁移、共存共治、三端代码复用
  - concept: 三端代码复用策略
    desc: 业务逻辑层跨端复用（TS/Dart/Kotlin/Rust+Wasm），UI层各自维护配合设计令牌，API层Schema生成类型安全Client
  - concept: 跨端AI内容生产
    desc: ChatGPT/RPA等AI工具深度嵌入选品、文案、制图、视频剪辑、客服、数据分析等全链路，实现降本增效与规模化复制
  - concept: 平台风险与合规
    desc: 小程序审核、App Store政策、数据隐私合规等构成跨端开发的“合规红线”，需内置合规基因与风控机制
  - concept: WebAssembly 跨端复用
    desc: 核心算法用 Rust/C++ 编译为 Wasm，三端复用计算密集型能力，JS-Wasm 互操作通过 wasm-bindgen 实现零拷贝传递
  exercises:
  - 'no': 1
    title: 跨端技术选型决策演练
    contents:
    - 场景：某电商 App 计划重构“个人中心”模块（低频、表单密集、依赖原生相册/定位/支付），并新建“直播带货”模块（高帧率动画、弱网优先、复杂手势交互、Web/H5/小程序/APP
      四端同步上线）。团队主力技术栈为 React + TypeScript，无 Dart/Kotlin 经验，原生 iOS/Android 开发资源极少。
    - 任务：
    - 1. 分别为两个模块推荐最适合的跨端方案，并列出核心理由（渲染性能、开发体验、平台一致性、原生互操作、团队学习成本、包体积）。
    - 2. 分析如果选择 React Native 新架构开发“直播带货”，迁移旧架构第三方原生模块（如推流 SDK）到 TurboModules 可能遇到的三大工程风险。
    - 3. 若决定用 Uni-app 做“直播带货”四端统一，针对“高帧率动画”在小程序端的性能瓶颈，提出两种编译期或运行期优化手段。
    - 4. 设计一个 AI 辅助工作流（ChatGPT/RPA），用于跨端项目中“个人中心”表单页面的代码生成、测试用例生成、多端适配代码转译，并说明如何通过
      Prompt Engineering 保证生成代码的类型安全与平台规范性。
  - 'no': 2
    title: Flutter 三棵树与渲染管线手动推演
    contents:
    - 给定 Flutter 代码片段：
    - '```dart'
    - class Counter extends StatefulWidget {
    - '  @override'
    - '  _CounterState createState() => _CounterState();'
    - '}'
    - class _CounterState extends State<Counter> {
    - '  int _count = 0;'
    - '  @override'
    - '  Widget build(BuildContext context) {'
    - '    return Column(key: Key(''col''), children: ['
    - '      Text(''Count: $_count'', key: Key(''text'')),'
    - '      ElevatedButton(key: Key(''btn''), onPressed: () => setState(() => _count++),
      child: Text(''+1''))'
    - '    ]);'
    - '  }'
    - '}'
    - '```'
    - 任务：
    - 1. 绘制初次 build 后的 Widget Tree、Element Tree、RenderObject Tree 结构图（标注类型、Key、父子关系）。
    - 2. 用户点击按钮触发 `setState`，`_count` 变为 1，描述 Element Tree 的 Diff 复用过程：哪些 Element
      被复用？哪些被标记 dirty？RenderObject Tree 如何变化？
    - 3. 解释为何 `RepaintBoundary` 能隔离重绘范围，并结合 Layer/Composite 阶段说明其原理。
    - 4. 对比 Skia 与 Impeller 在首帧渲染该按钮阴影效果时的着色器处理差异。
    - 5. 设计一个 AI Agent（基于 ReAct 模式），自动分析 Flutter 性能分析工具导出的 Timeline 数据，定位 UI 卡顿根因并输出优化建议报告。
  - 'no': 3
    title: 混合栈共存架构落地方案设计
    contents:
    - 背景：某超级 App（原生 iOS/Android，数百万行代码）决定引入 Flutter 承接“短视频流”新业务，要求：
    - '- 原生 Tab 栏保持不动，点击“视频”Tab 进入 Flutter 页面栈。'
    - '- Flutter 页面需复用原生登录态、网络库（OkHttp/URLSession）、埋点 SDK、图片加载库。'
    - '- 支持 Flutter 模块热更新，绕过应用商店审核。'
    - '- CI/CD 流水线需同时产出原生基线包、Flutter 模块产物（AAR/Framework）、热更新补丁包。'
    - 任务：
    - 1. 设计 Native Shell 与 Flutter Module 的通信协议契约（MethodChannel / Pigeon / FFI 任选其一），定义：初始化参数传递、路由跳转、登录态同步、网络请求代理、埋点上报
      5 个核心接口的 Dart 与 Native 签名。
    - 2. 制定依赖治理策略：原生网络库/图片库如何以“单例服务”形式暴露给 Flutter 使用，避免重复实现与冲突？
    - 3. 设计导航融合方案：原生路由栈如何管理 Flutter 页面？Flutter 内部 Navigator 与原生 UINavigationController/FragmentManager
      如何双向同步？返回手势、系统 Back 键如何统一拦截？
    - 4. 规划热更新落地：Shorebird / 自建方案的差异对比，补丁包下发、校验、加载、回滚的完整流程与风控策略。
    - 5. 列出该架构引入的 3 类典型崩溃场景及跨语言堆栈定位调试方案。
    - 6. 基于 Pigeon 协议生成的 Dart/原生接口代码，设计一个 RPA 流程，自动化完成：接口变更检测 -> 代码重新生成 -> 单元测试执行
      -> 回归测试报告生成。
  - 'no': 4
    title: Uni-app 条件编译与平台差异抹平实战
    contents:
    - 需求：开发一个“海报生成器”组件，需在 H5、微信小程序、App（iOS/Android）三端运行。核心功能：Canvas 绘制文本/图片/二维码 ->
      保存本地相册/预览 -> 分享给好友。
    - 任务：
    - 1. 编写条件编译代码骨架，分别实现三端 Canvas 绘制上下文获取（`uni.createCanvasContext` vs `CanvasRenderingContext2D`
      vs `OffscreenCanvas`）、图片下载（`uni.downloadFile` vs `fetch`/blob）、保存相册（`uni.saveImageToPhotosAlbum`
      vs `a[download]` vs 相册权限申请）的差异化逻辑。
    - 2. 分析微信小程序端 `Canvas 2D` 接口与 H5 标准 `CanvasRenderingContext2D` 的行为差异（如 `measureText`
      返回值、路径闭合、像素比处理），并给出兼容性封装策略。
    - 3. 小程序端包体积超 2M 主包限制，设计分包策略：海报生成器作为分包，主包仅保留登录/首页，分包预加载时机配置。
    - 4. 列举 3 个 Uni-app 编译器常见破坏性变更案例（版本升级导致的语法不兼容/生命周期时机变化/组件属性废弃），并制定版本锁定与升级测试规范。
    - 5. 利用 ChatGPT 编写 Prompt，自动生成 Uni-app 条件编译代码模板（含 Canvas/图片/相册/分享等高频 API 的三端实现），并设计
      RPA 流程批量验证生成代码在三端真机上的运行结果。
  - 'no': 5
    title: 跨端技术选型综合实战：AI 赋能的决策模拟
    contents:
    - 场景：某创业团队计划开发“智能家居控制面板”应用，需支持 iOS/Android/App/小程序/H5 五端，核心功能：设备实时状态同步（MQTT/WebSocket）、复杂动画交互、语音控制集成、本地离线缓存。团队
      3 人，栈为 React/TypeScript/Node.js，预算有限，6 周上线。
    - 任务：
    - 1. 基于本章概念图谱，建立加权评分模型（权重：渲染性能 25%、开发效率 20%、平台一致性 15%、原生能力 15%、学习成本 10%、包体积 10%、AI工具链支持
      5%），对 Uni-app、Taro、React Native、Flutter、KMP 进行量化打分并推荐最优方案。
    - 2. 针对推荐方案，设计“AI 辅助开发基建”：包含 Prompt 模板库（组件/页面/接口/测试）、RPA 自动化流水线（代码生成->类型检查->多端编译->真机同步）、ChatGPT
      Code Review 机器人配置。
    - 3. 识别所选方案在“语音控制集成”、“MQTT 连接保活”、“小程序包体积限制”三个高风险点上的具体缓解措施，并制定应急预案。
    - 4. 撰写一份《跨端技术选型 ADR》（Architecture Decision Record），包含背景、决策、替代方案、后果、合规性评估、AI工具链治理规范。
  - 'no': 6
    title: WebAssembly 跨端高性能计算集成实战
    contents:
    - 场景：跨端电商 App 需在三端（iOS/Android/小程序）实现客户端图片实时滤镜处理（高斯模糊、锐化、色彩空间转换），单张 4K 图片处理耗时需
      < 100ms。团队核心算法用 Rust 实现，需编译为 Wasm 并在三端复用。
    - 任务：
    - 1. 设计 Rust -> Wasm 编译配置：target、opt-level、wasm-opt 参数，输出 .wasm 与 .js 胶水代码，体积
      < 200KB。
    - 2. 编写三端 Wasm 加载与实例化逻辑：iOS (JavaScriptCore)、Android (V8)、小程序 (V8/JSC) 的差异化加载策略，含
      streaming compile 与 fallback 机制。
    - 3. 实现 JS-Wasm 零拷贝内存共享：利用 `SharedArrayBuffer` 与 `wasm-bindgen` 实现图片像素数据零拷贝传递，避免
      base64 编解码开销。
    - 4. 设计性能基准测试：对比 Wasm 实现 vs 纯 JS 实现 vs 原生 GPU 滤镜在三端的耗时、内存、电量消耗。
    - 5. 针对小程序 2MB 包体积限制，设计 Wasm 模块动态下发与缓存策略（分包加载、CDN 预加载、版本管理）。
  units:
  - 'no': 1
    name: 跨端技术谱系图 —— WebView、JS Bridge、原生渲染与 AOT 编译的四大范式对决
    points:
    - '**为什么需要这个概念？**'
    - '- 移动端开发面临 iOS/Android 双平台维护成本高、Web 技术栈复用难、性能与体验难以平衡的核心矛盾'
    - '- 理解不同跨端方案的底层架构差异（渲染层、通信层、执行层），是技术选型避坑的前提'
    - '- 避免盲目跟风选型，建立基于业务形态、团队技术栈、性能要求的理性决策框架'
    - '**核心定义**'
    - '- 跨端技术谱系按“渲染引擎归属”与“通信机制”可划分为四大架构范式：'
    - '  1. Hybrid/WebView 容器：UI 由 WebView 渲染，通过 JS Bridge 与 Native 通信（如 Cordova、早期微信小程序基座）'
    - '  2. 小程序/双线程模型：逻辑层（JS 核心）与视图层（WebView/Native）分离，通过数据绑定与事件通信驱动（如微信小程序、Uni-app
      编译输出）'
    - '  3. 原生渲染/JS 运行时：JS 线程驱动 Native 布局引擎渲染，通过 Bridge/JSI 通信（如 React Native 旧/新架构、Weex）'
    - '  4. AOT 编译/自绘引擎：Dart 代码 AOT 编译为机器码，Skia/Impeller 直接绘制像素，无 JS 运行时（如 Flutter、Kotlin
      Multiplatform Compose）'
    - '**关键性质**'
    - '- 渲染性能阶梯：AOT 自绘 (Flutter) ≈ 原生 > 原生渲染 (RN 新架构) > 小程序/双线程 > Hybrid/WebView'
    - '- 开发体验与生态：Web 技术栈复用度 Hybrid > 小程序 ≈ RN > Flutter (需学 Dart) > KMP'
    - '- 平台一致性：Flutter/KMP (像素级一致) > RN (依赖平台原生组件差异) > 小程序 (受宿主环境限制大) > Hybrid (受
      WebView 内核版本碎片化影响)'
    - '- 与原生互操作成本：KMP (原生互操作零成本) > RN (JSI/TurboModules 低开销) > 小程序 (受限于 Bridge/基础库能力)
      > Hybrid (Bridge 延迟高、易阻塞)'
    - '**典型例子**'
    - '- 电商大促会场页：高频变动、弱交互、强跨平台一致性要求 → 选 Hybrid/小程序/Uni-app'
    - '- 核心交易链路/IM/直播：高性能、强交互、复杂动画、深度原生能力依赖 → 选 RN 新架构/Flutter/KMP/原生'
    - '- 企业内部管理后台/工具类应用：开发效率优先、UI 标准化、团队仅 Web 技术栈 → 选 Uni-app/Taro/小程序'
    - '- 跨平台组件库建设：需同时产出 Web/H5/小程序/APP 组件 → 选 Uni-app/Taro 编译时多端统一'
    - '**边界条件**'
    - '- 纯 WebView 方案无法胜任高帧率动画、复杂手势、后台长任务等场景'
    - '- 小程序受限于包体积限制（主包 2M）、基础库版本碎片化、无法使用完整 DOM/BOM API'
    - '- React Native 旧架构 Bridge 通信异步导致掉帧，新架构 Fabric/JSI 迁移成本高、生态包兼容性风险大'
    - '- Flutter 体积基线大（Hello World ~5-10MB）、Dart 语言学习曲线、三方原生 SDK 接入需编写 Platform Channel
      胶水代码'
    - '- Kotlin Multiplatform 仅共享业务逻辑/UI 需 Compose Multiplatform 成熟度尚在演进中、iOS 侧为 Kotlin/Native
      非 JVM 生态'
    - '- 跨端 AI 工具链（ChatGPT/RPA）可显著提升代码生成、测试、文档编写效率，但需警惕幻觉与平台特定 API 的不准确调用'
    - '- 平台政策（小程序审核、App Store 上架规则、隐私合规）是跨端方案落地的硬性约束，必须纳入技术选型决策矩阵'
