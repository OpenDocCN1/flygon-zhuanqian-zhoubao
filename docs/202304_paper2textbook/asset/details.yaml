    - 实现 LLM 应用的‘显微镜’：标准化 Trace 格式，嵌套 Span 记录 Chain/Agent/Tool/RAG 每一步执行细节。
    - 构建金字塔评测策略：单元级(Prompt/Tool/Retriever 组件测试)、系统级(RAGAS/MT-Bench 离线基准)、业务级(在线 A/B
