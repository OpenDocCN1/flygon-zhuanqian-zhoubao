- learning_targets:
  - 理解 XSS 攻击的三大分类（存储型、反射型、DOM-based）成因及防御核心：上下文感知的输出编码
  - 掌握 HTML/Attribute/JS/URL/CSS 五大编码上下文的差异与对应转义策略，会用 DOMPurify 与 Trusted Types 实施白名单清洗
  - 理解 CSRF 攻击原理与 SameSite Cookie（Strict/Lax/None）的防御边界，能实现双重提交令牌模式作为兜底
  - 掌握 CSP 3 核心指令（nonce、strict-dynamic、report-uri）配置方法，能制定灰度上线策略并处理第三方脚本兼容
  - 建立前端供应链安全意识：会接入依赖审计、锁文件版本固化、恶意包行为检测与 SBOM 生成的 CI/CD 门禁
  - 能产出《前端安全开发规范》《安全编码 Checklist》《漏洞分级与响应流程》，接入 SDL 全生命周期管理体系
  - 理解 RPA 自动化在数据采集与流程执行中的工程化落地方法，掌握‘手动→梳理→开发→测试→修复’五步法
  - 掌握福格行为模型（B=MAP）在引流场景的迁移应用，能拆解‘动机-能力-提示’三要素设计合规引流体系
