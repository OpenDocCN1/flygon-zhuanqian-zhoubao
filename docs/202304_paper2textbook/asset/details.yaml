    name: 翻译管理工程化 —— 从人工复制粘贴到 CI/CD 自动化流水线
    points:
    - '**为什么需要这个概念？**'
    - '- 翻译文件散落在仓库多处，手动协调翻译人员、核对键值完整性、合并冲突极其低效且易错'
    - '- 缺乏术语库导致同一术语在不同模块翻译不一致（如「登录」vs「签到」），损害用户信任'
    - '- 发布前发现缺失翻译键导致回滚或上线后紧急热修复，缺乏自动化质量门禁'
    - '**核心定义**'
    - '- 引入翻译管理平台（TMS）：Crowdin、Lokalise、Phrase 等 SaaS 服务，或自建 `Tolgee`/`SimpleLocalize`'
    - '- CI 集成：GitHub Actions 触发 `push`/`pull_request` 自动推送源语言文件至 TMS、拉取最新翻译文件生成 PR'
    - '- 术语库：定义项目级术语表（TBX/CSV 格式），CI 校验翻译文件术语一致性，阻断不合规 PR'
    - '- 机器翻译预译：集成 DeepL/Google/Azure 翻译 API，新增键自动预译，人工仅做复核，降低 80% 翻译成本'
    - '**关键性质**'
    - '- 双向同步：源文件变更自动推送，翻译完成自动回流，消除人工下载上传环节'
    - '- 完整率门禁：发布流水线强制校验所有语言翻译完整率 ≥ 99%，缺失键视为阻断项'
    - '- 版本发布同步：打 Tag 触发 TMS 发布快照，生产环境回滚时对应语言包版本可追溯'
    - '**典型例子**'
    - '- GitHub Actions Workflow：`name: i18n-sync`，`on: push: paths: [''src/locales/en.json'']`，步骤：`crowdin-action/upload-sources`
      → `crowdin-action/download` → `create-pull-request`'
    - '- 术语校验脚本：`node scripts/check-terminology.js --glossary=glossary.csv --locales=src/locales/*.json`，输出不一致报告并返回非零退出码'
    - '**边界条件**'
    - '- 中小项目可用 GitHub Wiki/CSV + 手动 PR 替代付费 TMS，但需自建校验脚本'
    - '- 高安全合规项目（金融/政务）数据不可出境，需部署私有化 TMS 或仅用本地工具链'
    - '- 翻译文件格式统一为 JSON/PO/YAML，避免格式转换丢失元数据（上下文、复数形式）'
    - '**素材溯源**'
    - '- 来源：`PbGkdX4YVoO02mxYlYKcbgASnSg.md`，大纲第19章第2节'
    - '- 角色：`method`，给出翻译管理的工程化落地流程与工具链'
