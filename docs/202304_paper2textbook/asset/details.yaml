  - 'no': 7
    name: 引流行为设计 —— 福格行为模型的工程化落地
    points:
    - '**为什么需要这个概念？**'
    - '- 传统引流依赖‘技巧/话术/工具’碎片化拼凑，平台规则一变即失效；缺乏底层逻辑框架指导方法层迭代'
    - '- 福格行为模型（B=MAP）揭示行为发生的三要素：动机、能力、提示；将引流拆解为‘强化动机-降低难度-触发提示’三大核心模块，构建平台无关的通用方法论'
    - '**核心定义**'
    - '- 引流行为公式：用户私信行为 = 私信动力 × 私信能力 × 私信提示'
    - '- 私信动力：用户产生‘想与作者建立联系’意愿的心理驱动力，由选题内容精准度、痛点刺激、收益展示等因素构成'
    - '- 私信能力：用户完成私信/联系操作的难易度，核心在于通过 SOP 教程（手写纸条/流程图）规避平台检测、降低认知与操作门槛'
    - '- 私信提示：在笔记图片、评论区、私信、群聊等多触点植入引导线索，触发用户即时行动的外部诱因'
    - '- 引流型选题标准：区分‘爆款选题’与‘引流选题’，强调内容必须吸引‘想买产品/服务’的精准人群，而非泛流量'
    - '- 合规引流 SOP：通过手写纸条、流程图、关键词搜索指引等非链接形式，在平台风控规则内实现私域联系方式的隐性传递'
    - '**关键性质**'
    - '- 引流型选题三维筛选法：从‘用户想要的（产品匹配度）’、‘用户有需求的（需求精准度）’、‘戳用户痛点（潜在需求唤醒）’三个维度筛选选题'
    - '- 三类爆款封面制作法：对比型（前后反差）、纯文字型（关键词/噱头）、大合集型（全景式价值展示）'
    - '- 内容图隐性植入四法：打印资料实物、不完整资料预告、收益截图、交付/反馈截图，自然传递‘有产品、可获取、有价值、可信赖’四大信号'
    - '- 双模态私信 SOP 制作法：手写纸条（低重复率、强伪装性）与流程图（高清晰度、强逻辑）两种范式，规定必须包含‘去哪找、搜什么词、如何识别、有何价值’五要素'
    - '- 全链路提示触达体系：覆盖图片内容植入、评论区置顶/小号带节奏、私信主动引导、群聊公告/小助理运营四大触点'
    - '**典型例子**'
    - '- 单人矩阵运营：10 个账号，月广告收入 1万+，单日单号稳定引流 100+ 精准用户，验证方法论可复制、可规模化'
    - '- 痛点选题引流效率实测：围绕‘宝妈副业’痛点的百赞笔记，引流效果优于发布育儿/宠物泛知识的万赞笔记'
    - '- 手写 SOP 规避风控实测：‘能更好避开平台检测’，且‘随时拍新图，图片重复率低，判定群发概率低’'
    - '**边界条件**'
    - '- 方法会根据平台更新而变化，但逻辑不变；核心竞争力在于‘动机-能力-提示’框架的内化与快速迁移能力'
    - '- 群聊运营需注意：打开率低，建议每进 10 人编辑群公告、用小助理号高频发送资料/收益图/SOP'
    - '- 合规性即生存性：所有动作必须在平台风控红线内，违规即账号死亡'
    - '...'
