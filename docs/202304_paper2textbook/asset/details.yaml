  life_analogy:
  - 想象 **MoE (混合专家模型)** 是一家 **“按需调度的专家咨询公司”**：
  - '- **总参数量** = 公司签约的**所有专家总数**（可能上万名，涵盖法律、医疗、代码、写作等）'
  - '- **激活参数量** = 客户提问时，**实际被叫来开会的专家数**（仅 2-3 位，Top-k 路由）'
  - '- **Router (路由器)** = **智能前台**，听清问题关键词，决定找「法律专家」还是「代码专家」'
  - '- **负载均衡损失** = **绩效考核机制**，防止前台只偏爱某几位明星专家，导致其他专家「吃闲饭」技能退化'
  - '- **专家并行通信** = 专家们开会前**同步案卷资料**的开销，专家太多、会议太频，光传资料就耗光时间'
  - ''
  - 想象 **原生多模态** 是一个 **“天生通感的多媒体创作者”**：
  - '- **传统对齐范式 (CLIP+LLM)** = **“翻译官模式”**：画师画图 → 翻译官用文字描述 → 作家据此写故事（信息两次压缩，细节丢失）'
  - '- **原生多模态** = **“全能创作者”**：大脑同一区域直接处理**像素块 Token**和**文字 Token**，想画就画、想写就写，图文交错如行云流水'
  - '- **统一 Tokenizer** = **“通用思维词汇表”**，把图像切成 8192 种「视觉音节」，和文字共用一本字典'
  - ''
  - 想象 **LLM Agent** 是一个 **“配备工具箱的实习项目经理”**：
  - '- **ReAct** = **“边想边干”**：想一步、跑一步去查资料/敲代码、看结果再想下一步（灵活但易跑偏）'
  - '- **Plan-and-Execute** = **“先甘特图再施工”**：先把整个项目拆解成任务图（DAG），再指挥团队并行干活（结构化、可并行）'
  - '- **Reflexion** = **“写复盘日志”**：项目翻车后，不罚款、不骂人，让他写份《反思笔记》，下次避坑（语言层面的强化学习）'
  - '- **Function Calling / MCP** = **“标准化外包接口文档”**：统一规定好参数格式、权限、返回值，PM 不用靠猜、靠沟通，直接按文档调用'
  - ''
  - 想象 **Test-Time Scaling** 是 **“考试时允许草稿纸、允许检查、允许重考”** 的规则变革：
  - '- **Train-time Scaling (预训练/微调)** = **“平时拼命刷题、背答案”**，上考场闭卷裸考（单次前向传播）'
  - '- **Test-Time Scaling** = **“考场上发草稿纸、给红笔、给计算器、甚至允许组团讨论”**：'
  - '  - **生成 N 条路径** = **“多写几套解题思路”**'
  - '  - **PRM (过程奖励模型)** = **“逐步给分的阅卷老师”**：不只看最终答案，每一步推理打分，哪步逻辑跳跃立马扣分'
  - '  - **MCTS / Beam Search** = **“在草稿纸上剪枝、回溯、找最优解”**'
  - '  - **代价** = 考试时间从 2 小时变 4 小时（推理延迟增加），但及格率飙升'
  - ''
  - 想象 **端到端领域大模型构建** 是 **“把通才博士培养成‘持证上岗’的专科医生”** 的标准化住院医师规培流程：
  - '- **数据清洗** = **“整理病历档案、去重、脱敏”**'
  - '- **持续预训练 (CPT)** = **“系统学习医学教材、最新指南”**（注入领域知识底座）'
  - '- **SFT (监督微调)** = **“跟着名医轮转、抄病历、学问诊模版”**（学会格式与流程）'
  - '- **对齐 (DPO/RLHF)** = **“医德考核、病例复盘、医患沟通演练”**（守规矩、少幻觉、懂拒答）'
  - '- **量化部署** = **“精简装备上战场”**：把大箱子教科书压缩成口袋手册（INT4/INT8），不耽误开刀'
  - '- **RAG 增强** = **“查阅最新版药典、医保目录”**：大脑记不住、过时了，现查现用'
  - '- **Agent 编排** = **“处理疑难杂症 MDT 会诊”**：拆解病情 → 调用检索/计算/影像工具 → 多科室协作 → 给方案'
  - '- **评测飞轮** = **“定期考核+病人满意度回访 → 反馈进教学大纲 → 下一届规培更强”**'
  summary:
  - concept: MoE (混合专家模型)
    desc: 稀疏激活实现参数量与计算量解耦，Router 动态 Top-k 选择专家，需解决负载均衡、通信开销、推理内存墙
  - concept: Switch Transformer
    desc: 简化为 Top-1 路由，首个验证万亿参数规模可行性的 MoE 模型
  - concept: DeepSeekMoE
    desc: 细粒度专家 + 共享专家 + 设备受限路由，工程落地标杆，平衡性能与部署效率
  - concept: 原生多模态
    desc: 单一 Transformer 建模图文混合 Token 序列，统一 Tokenizer (VQ-VAE) 实现跨模态深度融合与生成
  - concept: 统一 Tokenizer
    desc: 将图像离散化为视觉 Token 并入文本词表，共享嵌入层与 Transformer 主干
  - concept: Chameleon
    desc: 早期原生多模态代表，采用 VQ-GAN 离散化图像，统一建模图文交错序列
  - concept: LLM Agent
    desc: LLM 作为大脑，结合 Planning、Memory、Tool Use、Environment 形成自主决策闭环
  - concept: ReAct
    desc: 推理与行动交织范式，Thought-Action-Observation 循环，适合知识密集型任务
  - concept: Plan-and-Execute
    desc: 显式规划与执行分离，生成 DAG 任务图再并行执行，降低推理复杂度，提升鲁棒性
  - concept: Reflexion
    desc: 引入语言强化学习，通过自然语言反思优化策略，实现试错修正
  - concept: Function Calling / MCP
    desc: 工具调用标准化协议，定义 Schema、权限、调用约定，解决工具生态碎片化
  - concept: LLM Compiler
    desc: 将自然语言指令编译为并行执行计划图（DAG），优化多工具调用效率
  - concept: Test-Time Scaling
    desc: 推理阶段投入更多计算（搜索、验证、修正）换取性能，开辟推理算力与性能新 Scaling Law
  - concept: 过程奖励模型 (PRM)
    desc: 对推理每一步打分而非仅看最终答案，引导搜索避开逻辑错误节点，核心训练难点在于逐步标注数据
  - concept: MCTS / Beam Search 在推理时的应用
    desc: 在 Token 树上平衡探索与利用，寻找高奖励推理路径，支持回溯修正
  - concept: 端到端领域大模型流水线
    desc: 数据清洗 → CPT → SFT → 对齐 → 量化 → RAG → Agent → 评测闭环，全生命周期工程化标准化
  - concept: 灾难性遗忘缓解
    desc: 持续预训练/微调中通过 Replay Buffer、KL 约束、合成数据回放保持通用能力
  - concept: 评测污染防范
    desc: 哈希去重、动态基准、人工红队测试，保证评测指标真实反映模型能力
  exercises:
  - 'no': 1
    title: MoE 路由机制与负载均衡手算推演
    contents:
    - 假设有 8 个专家，批次大小 4，序列长度 2，Top-1 路由。
    - '某层 Router 输出 logits (shape: [4, 2, 8]) 对第 0 个样本第 0 个 Token 为：[0.1, 0.5, 0.05,
      0.8, 0.2, 0.3, 0.05, 0.1]。'
    - 1. 该 Token 被路由到哪个专家？门控权重 G 如何计算（Softmax 还是 Sigmoid）？
    - 2. 若该批次所有 Token 均路由到专家 3，计算该专家的负载均衡辅助损失（假设均匀分布为目标）。
    - 3. 回答问题：
    - '   - 为什么 Top-1 配合辅助损失比 Top-k (k>1) 更利于通信优化？'
    - '   - 什么是“专家塌缩”？如何通过噪声注入或熵正则化缓解？'
  - 'no': 2
    title: 原生多模态 Tokenizer 设计权衡
    contents:
    - 某原生多模态模型采用 VQ-VAE 将 256x256 图像压缩为 16x16 离散 Token，码本大小 8192。
    - 1. 计算单张图像对应的视觉 Token 数量及压缩率（假设原始像素 3 通道 8bit）。
    - 2. 视觉 Token 与文本 Token 共享词表时，需预留特殊 Token 标识模态边界（如 <img>, </img>），这会如何影响文本词表的有效容量？
    - 3. 回答问题：
    - '   - 为什么 VQ-VAE 离散化会导致高频纹理细节丢失？扩散模型为何不直接作为 Tokenizer？'
    - '   - 交错训练数据中图文比例过高（如 1:10）会导致文本能力退化，如何通过数据配比或损失加权缓解？'
  - 'no': 3
    title: Agent 规划范式对比与工具调用设计
    contents:
    - 任务：“根据用户上传的财报 PDF，计算过去三年营收复合增长率，并绘制趋势图输出为 HTML”。
    - 1. 分别用 ReAct、Plan-and-Execute、LLM Compiler 三种范式写出前 3 步 Thought/Action/Plan 伪代码。
    - 2. 设计该任务所需的 Function Calling Schema（JSON 格式），包含：PDF 解析、Python 代码执行、绘图渲染三个工具，要求定义参数类型、必填字段、错误码。
    - 3. 回答问题：
    - '   - ReAct 在此任务中可能陷入“死循环”（反复尝试同一错误代码），Plan-and-Execute 如何通过显式规划避免？'
    - '   - MCP (Model Context Protocol) 相比 OpenAI Function Calling 在“工具发现与版本管理”上有何优势？'
  - 'no': 4
    title: Test-Time Scaling 树搜索模拟
    contents:
    - 数学题：“解方程 x^2 - 5x + 6 = 0”。模型生成 3 条候选推理路径，PRM 逐步打分 (0-1)：
    - '路径 A：因式分解 → (x-2)(x-3)=0 → x=2,3  [步骤分: 0.9, 0.95, 0.98]'
    - '路径 B：求根公式 → x=(5±√(25-24))/2 → x=3,2  [步骤分: 0.8, 0.7, 0.9]'
    - '路径 C：暴力试数 → 试 x=1,2,3... → x=2,3  [步骤分: 0.5, 0.4, 0.8]'
    - 1. 若采用 Best-of-N (按最后一步分数选)，选哪条？若按平均分选呢？
    - 2. 模拟 Beam Search (beam=2) 过程：假设每步展开 2 个子节点，展示前两步的剪枝决策。
    - 3. 回答问题：
    - '   - PRM 为何对“最终答案正确但中间逻辑错误”的路径（如猜中答案）给低分？这如何防止奖励作弊？'
    - '   - MCTS 引入“探索项 (PUCT)”相比纯贪心 Beam Search 有何优势？'
  - 'no': 5
    title: 领域大模型端到端流水线关键决策清单
    contents:
    - 场景：构建一个“金融研报生成”领域大模型（基座 7B）。请列出以下各阶段的 3 个核心工程决策点及选型理由：
    - 1. 数据清洗与配比：公开财报、研报、新闻、通用语料的混合比例？如何去重（MinHash 阈值）？
    - 2. 持续预训练 (CPT)：学习率调度（余弦衰减 vs 常数）、数据顺序（课程学习：易→难）、混合精度策略 (BF16/FP8)。
    - 3. SFT 阶段：指令模板设计（ChatML vs Alpaca）、仅计算 Assistant Loss 的掩码实现、LoRA rank 选择 (r=64
      vs 128)。
    - 4. 对齐阶段：DPO vs PPO 选择依据？偏好数据构建（GPT-4 标注 vs 专家标注）、KL 惩罚系数 β 设定。
    - 5. 部署与增强：量化精度 (W4A16 vs W8A8) 对金融数值精度影响？RAG 检索策略（父子文档 vs 假设性文档嵌入 HyDE）？Agent
      规划范式选择？
    - 6. 评测体系：离线基准（自建金融问答集 + 规则校验）、在线 A/B 指标（采纳率、修改率、幻觉投诉率）、数据飞轮触发条件（如幻觉率 > 5% 启动新一轮
      DPO）。
  units:
  - 'no': 1
    name: 混合专家模型 —— 让参数规模与计算量解耦
    points:
    - '**为什么需要这个概念？**'
    - '- 密集模型参数量与计算量线性绑定，扩大模型规模成本呈指数级增长'
    - '- 实际任务中，不同输入只需激活模型部分能力（稀疏激活先验）'
    - '- 需要在保持总参数量巨大（知识容量）的同时，控制单次推理的激活参数量（计算成本）'
    - '**核心定义**'
    - '- MoE 由稀疏门控层路由器和多个专家网络组成'
    - '- 前向传播：Router(x) → Top-k 专家索引 → 专家并行计算 → 加权求和输出'
    - '- 关键公式：y = Σ G_i(x) · E_i(x)，其中 G 为门控权重，E 为专家输出'
    - '**关键性质**'
    - '- 参数计算解耦：总参数量可达万亿级，但激活参数仅占 1/8~1/64'
    - '- 专业化分工：不同专家自发学习语法、推理、领域知识等异构能力'
    - '- 通信瓶颈：专家并行部署需跨节点 All-to-All 通信，成为规模化核心挑战'
    - '**典型例子**'
    - '- Switch Transformer：简化为 Top-1 路由，实现 1.6 万亿参数模型训练'
    - '- DeepSeekMoE：细粒度专家 + 共享专家 + 设备受限路由，工程落地标杆'
    - '**边界条件**'
    - '- 训练不稳定：路由塌缩导致专家负载极度不均，需辅助负载均衡损失'
    - '- 推理内存墙：所有专家权重需常驻显存/内存，单机部署受限于内存容量'
    - '- 通信开销：小批量/长序列时，专家间通信延迟可能抵消计算稀疏收益'
    sources:
    - paper: 20230418_070.md
      role: origin
    - paper: XiwmdQFijotSRAxrBv8c1dLmndr.md
      role: improve
    excerpts:
    - 详解 Switch Transformer/DeepSeekMoE 的路由机制、负载均衡损失、专家并行部署，分析通信开销与训练稳定性的工程对策。
    - MoE 核心优势：稀疏激活实现参数量与计算量解耦，路由器动态分配 Token 到 Top-k 专家。
  - 'no': 2
    name: 原生多模态 —— 让模型天生会“看图说话”
    points:
    - '**为什么需要这个概念？**'
    - '- 传统多模态（如 CLIP+LLM）采用对齐范式，视觉编码器与语言模型分离，交互仅限于特征拼接'
    - '- 对齐范式难以支持图文交错生成、细粒度视觉推理及原生多模态输出'
    - '- 需要统一的 Token 空间与联合建模，实现跨模态深度融合与生成'
    - '**核心定义**'
    - '- 原生多模态：单一 Transformer 直接建模图文混合 Token 序列，无冻结编码器'
    - '- 统一 Tokenizer：将图像离散化为视觉 Token（如 VQ-VAE 码本），与文本 Token 共享词表'
    - '- 交错训练：输入序列为 [文本, 图像, 文本, 图像...]，统一用下一 Token 预测目标'
    - '**关键性质**'
    - '- 统一表征：视觉与语言在同一隐空间交互，支持任意模态输入输出组合'
    - '- 生成原生：可直接生成图文交错内容，而非仅输出文本描述'
    - '- 数据饥渴：需海量高质量图文交错数据，且对图文对齐质量极其敏感'
    - '**典型例子**'
    - '- Chameleon：早期原生多模态代表，采用 VQ-GAN 离散化图像，统一 Transformer 建模'
    - '- 统一 Tokenizer 设计：视觉码本大小（如 8192）与文本词表合并，特殊 Token 标识模态边界'
    - '**边界条件**'
    - '- 图像离散化损失：VQ-VAE 压缩导致高频细节丢失，影响生成保真度'
    - '- 训练不稳定：多模态损失景观复杂，易出现模态竞争、文本能力退化'
    - '- 推理延迟：自回归生成图像 Token 序列极长（如 1024 tokens/图），首包延迟高'
    sources:
    - paper: 20230418_071.md
      role: origin
    - paper: 20230418_072.md
      role: improve
    excerpts:
    - 对比 CLIP 对齐、VQ-VAE 离散化、原生多模态（如 Chameleon）的图文联合建模路线，探讨图文交错数据比例对能力迁移的影响。
    - 原生多模态核心：统一 Tokenizer 将图像映射为离散 Token，与文本共享 Transformer 主干进行交错序列建模。
  - 'no': 3
    name: LLM Agent —— 赋予模型“手脚”与“规划大脑”
    points:
    - '**为什么需要这个概念？**'
    - '- 单一 LLM 受限于上下文窗口、知识截止、无法执行代码/调用工具、缺乏长程规划能力'
    - '- 复杂任务需要：感知环境 → 制定计划 → 调用工具 → 观察反馈 → 修正路径的闭环'
    - '- 需要标准化的认知架构将 LLM 从“文本生成器”升级为“自主决策智能体”'
    - '**核心定义**'
    - '- Agent = LLM（大脑）+ Planning（规划）+ Memory（记忆）+ Tool Use（工具）+ Environment（环境）'
    - '- 核心循环：Thought → Action → Observation → Thought...（ReAct 范式）'
    - '- 工具调用标准化：Function Calling / MCP 协议定义 Schema、权限、调用约定'
    - '**关键性质**'
    - '- 规划与执行分离：Plan-and-Execute 显式生成 DAG 任务图，再并行/串行执行，降低推理复杂度'
    - '- 试错与反思：Reflexion 引入语言强化学习，通过自然语言反思优化后续策略'
    - '- 记忆分层：短时（上下文窗口）、长时（向量检索/知识图谱）、程序性（技能库）'
    - '**典型例子**'
    - '- ReAct：交织推理与行动，解决知识密集型问答'
    - '- MetaGPT / ChatDev：多 Agent 协作模拟软件公司流程（PM/Dev/QA 角色分工）'
    - '- LLM Compiler：将自然语言指令编译为并行执行计划图，显著提升多工具调用效率'
    - '**边界条件**'
    - '- 上下文爆炸：长轨迹导致 Token 消耗指数级增长，需记忆压缩/摘要机制'
    - '- 规划幻觉：LLM 易生成不可执行计划、陷入死循环，需外部验证器/人工介入'
    - '- 工具生态碎片化：缺乏统一标准（MCP 正在推进），工具注册/发现/版本管理成本高'
    sources:
    - paper: 20230418_073.md
      role: origin
    - paper: 20230418_074.md
      role: improve
    excerpts:
    - 拆解 ReAct、Plan-and-Execute、Reflexion 等 Agent 范式，详解向量数据库长时记忆、函数调用、多 Agent 协商协议（如
      MetaGPT）的落地细节。
    - Agent 核心组件：LLM 作为控制器，结合规划模块、记忆系统、工具接口与环境交互形成闭环。
  - 'no': 4
    name: Test-Time Scaling —— 让模型“多思考一会儿”就变强
    points:
    - '**为什么需要这个概念？**'
    - '- 预训练/微调（Train-time Scaling）面临数据墙、算力墙，边际收益递减'
    - '- 复杂推理任务（数学、代码、逻辑）单次前向传播（System 1）易出错'
    - '- 利用推理阶段额外计算量，通过搜索、验证、修正实现性能跃升，开辟新 Scaling Law'
    - '**核心定义**'
    - '- Test-Time Scaling：在推理阶段投入更多计算（Token、采样次数、搜索步数）换取更高准确率'
    - '- 核心组件：生成策略 + 过程奖励模型 + 搜索算法'
    - '- 典型流程：生成 N 条推理路径 → PRM 逐步打分 → Best-of-N / Beam Search / MCTS 选优'
    - '**关键性质**'
    - '- 从结果监督转向过程监督：PRM 对推理每一步打分，而非仅看最终答案'
    - '- 搜索空间指数级扩大：树搜索（ToT/MCTS）探索多条推理分支，支持回溯修正'
    - '- 计算弹性可控：可根据任务难度动态分配推理预算（易题快答、难题慢思考）'
    - '**典型例子**'
    - '- OpenAI o1：大规模强化学习训练长 CoT 模型，配合推理时搜索/验证，数学/代码超越人类专家'
    - '- PRM（Process Reward Model）：对每一步推理打分，引导搜索避开逻辑错误节点'
    - '- Beam Search / MCTS 在 Token 树上的应用：平衡探索与利用，寻找高奖励路径'
    - '**边界条件**'
    - '- 延迟成本：推理延迟从秒级升至分钟级，实时交互场景受限'
    - '- PRM 训练难：需大量逐步标注数据，模型易过拟合特定题型，泛化性挑战大'
    - '- 验证器脆弱：奖励模型自身可能被“攻破”给错误推理高分，导致搜索失效'
    sources:
    - paper: 20230418_075.md
      role: origin
    - paper: 20230418_076.md
      role: improve
    excerpts:
    - 解析 o1 类模型通过思维链搜索（MCTS/Beam Search）、过程奖励模型（PRM）、自我修正实现‘推理时越久越强’的范式转移。
    - Test-Time Scaling 核心：推理时计算 = 生成多条路径 + 过程奖励模型打分 + 搜索选优，实现推理算力与性能的新换算关系。
  - 'no': 5
    name: 端到端领域大模型构建 —— 从数据清洗到评测闭环的工程全景图
    points:
    - '**为什么需要这个概念？**'
    - '- 通用基座模型在垂直领域（医疗、法律、金融、代码）存在幻觉、合规、专业度不足'
    - '- 单一技术点（如仅 SFT 或仅 RAG）无法解决领域适配的系统性工程问题'
    - '- 需要一套标准化、可复现、可迭代的工程流水线覆盖全生命周期'
    - '**核心定义**'
    - '- 端到端流水线：数据清洗 → 持续预训练 → SFT → 对齐 → 量化部署 → RAG 增强 → Agent 编排 → 自动化评测'
    - '- 关键决策点：数据配比、训练阶段学习率调度、对齐算法选择、量化精度、检索策略、Agent 范式'
    - '- 评测驱动开发：每个阶段配套离线基准+在线 A/B 测试，建立数据飞轮'
    - '**关键性质**'
    - '- 阶段耦合：持续预训练数据质量决定上限，SFT 数据多样性决定下限，对齐决定安全边界'
    - '- 工程权衡：模型规模 vs 推理延迟，RAG 召回率 vs 上下文窗口，Agent 自主性 vs 可控性'
    - '- 可观测性贯穿始终：训练 Loss 曲线、评测指标看板、线上用户反馈、自动化回归测试'
    - '**典型例子**'
    - '- 法律大模型：海量法条/判例持续预训练 → 高质量问答/文书 SFT → 偏好对齐防幻觉 → RAG 接入最新法规 → Agent 实现多跳法条检索'
    - '- 代码大模型：代码库清洗/去重 → FIM 目标预训练 → 单测/仓库级 SFT → 执行反馈 RLHF → 沙箱验证 Agent'
    - '**边界条件**'
    - '- 数据版权与合规：领域数据来源合法性、PII 脱敏、输出内容合规审查'
    - '- 灾难性遗忘：持续预训练/微调导致通用能力退化，需 Replay/KL 约束/合成数据回放'
    - '- 评测污染：测试集泄露导致指标虚高，需哈希去重、动态基准、人工红队测试'
