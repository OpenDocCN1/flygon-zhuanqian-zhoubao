  - ├── 开发 5 步法：手动操作 → 步骤梳理 → 模块开发 → 运行测试 → 修复 BUG  —— P106
  - ├── 关键技术难点：元素识别 vs 图像识别 / 滑动参数化校准 / 异常捕获 Try-Catch  —— P106
  - ├── 数据处理：字典去重 / 末尾标志终止判定 / Excel 透视表多维分析  —— P106
  - └── 变现闭环：场景应景 + 能力结合 + 稀缺性 = 数据资产+工具+复盘文档  —— P106
  - 小红书引流行为设计
  - ├── 核心公式：用户私信行为 = 私信动力 × 私信能力 × 私信提示 (B=MAP)  —— P109
  - ├── 动机设计：选题精准度 / 痛点刺激 / 收益展示  —— P109
  - ├── 能力构建：手写纸条 SOP / 流程图 SOP / 关键词搜索指引  —— P109
  - ├── 提示触达：图片植入 / 评论区置顶 / 私信主动引导 / 群聊小助理  —— P109
  - ├── 选题标准：吸引『想买产品/服务』的精准人群 ≠ 泛流量  —— P109
  - └── 合规生存：手写/打码/关键词/小号协作规避检测  —— P109
  - AI 赋能跨境电商
  - ├── 核心范式：角色设定 + 场景化指令 + 迭代优化 + 人工校验  —— P136
  - ├── 六大应用场景：选品定位 / Listing撰写 / 邮件营销 / SEO引流 / 站外推广 / 品牌建设  —— P136
  - ├── 关键能力：中英双语无损生产 / Listing全要素生成 / 全周期邮件矩阵 / SEO内容规模化引擎 / 品牌本土化命名  —— P136
  - └── 工具化封装：垂直 SaaS (邮件/SEO/数据分析) / Prompt 模板参数化 / 低代码/插件/独立应用  —— P136
  - 海外商标投资套利
  - ├── 核心逻辑：时间套利 (注册周期 6-36个月) + 好名字稀缺性 + R标刚需  —— P046
  - ├── 选标策略：国家选择矩阵法 (贸易强国/平台主战场/政策红利/产业优势)  —— P046
  - ├── 类目组合：核心稳健仓 (出口Top类目) + 高溢价蓝海仓 (电子烟/特色食品)  —— P046
  - ├── AI 命名链：Namelix + ChatGPT + 阿里云起名 / 语义筛选 (短域名/发音/行业关联/文化安全)  —— P046
  - ├── 定价体系：底价挂牌 + 授权分销代售 + 买家画像定价 / 目标持有周期≤1年 ROI≥100%  —— P046
  - └── 核心定律：时间套利定理 / 政策-平台双轮驱动 / 中国出口结构映射 / 命名语义溢价公式  —— P046
  - 普通人抖音变现正向循环
