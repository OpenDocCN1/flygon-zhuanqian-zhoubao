  life_analogy:
  - 想象微前端架构像一个‘联合办公大厦’（基座/主应用）与‘独立租户’（子应用）的关系：
  - '- **架构决策矩阵** = **‘入驻资格审核’**：不是所有人都适合进大厦（团队<5人、单仓库、无迁移需求 = 个体户，自建独栋楼更划算）'
  - '- **qiankun 双沙箱** = **‘物理隔墙’**：'
  - '  - `proxy` 沙箱 = **‘现代钢筋混凝土隔墙’**（Proxy 劫持），隔音好、互不干扰、支持多户同住'
  - '  - `snapshot` 沙箱 = **‘简易活动板房隔断’**（快照还原），隔音一般、只能一户一户轮流住'
  - '- **样式隔离** = **‘装修规范’**：'
  - '  - Shadow DOM = **‘全封闭精装修’**（最强隔离），但自带家具（UI 弹层）难搬进来'
  - '  - CSS Modules = **‘统一编码装修标准’**（编译时隔离），施工麻烦但入住后最省心'
  - '- **Module Federation** = **‘大厦共享设施管网’**（水电网/公共依赖）：租户签约（shared 配置）共用大厦中央空调（React/Vue
    单例），版本协商像‘电压标准’不合就自带发电机'
  - '- **治理规范** = **‘物业管理条例’**：强制统一门禁（路由分发）、统一宽带（监控 SDK）、统一装修风格（组件库版本），违规不给接水电（CI/CD
    门禁）'
  - '- **遗留系统改造** = **‘老旧小区改造’**：不能强拆（重写风险高），采用‘绞杀者模式’——新盖楼（新子应用）接入大厦管网，老住户（遗留子应用）先住沙箱隔离区，分批搬迁、随时可回迁（灰度/回滚）'
  - '- **AI 赋能微前端** = **‘智能物业管家’**：'
  - '  - 代码生成 = **‘全自动装修机器人’**（Prompt 驱动，从图纸到成品）'
  - '  - RPA 自动化 = **‘无人值守运维机器人’**（巡检、修缮、升级全自动）'
  - '  - 智能路由 = **‘智能电梯调度系统’**（按需调度、精准送达、无感切换）'
  - '  - 自动化测试 = **‘全天候安检机器人’**（沙箱压测、异常捕获、性能体检）'
  - '  - 遗留重构 = **‘老楼智能翻新方案’**（结构扫描、管线置换、分批迁居）'
  summary:
  - concept: 架构决策矩阵
    desc: 量化评估微前端收益与成本，设定团队>10人/多仓库/独立发布等硬性触发阈值，避免盲目拥抱
  - concept: qiankun 双沙箱
    desc: proxy 沙箱基于 Proxy 实现多实例强隔离（主流），snapshot 沙箱基于快照兼容旧环境（不支持多实例）
  - concept: 样式隔离三档
    desc: Shadow DOM 最强但弹层难题多；CSS Modules 编译时隔离性能最优；动态 Style 标签默认弱隔离
  - concept: Module Federation
    desc: Webpack 5 原生联邦，通过 exposes/remotes/shared 实现运行时依赖共享与版本协商，打破构建时边界
  - concept: 版本协商算法
    desc: Host 加载 RemoteEntry -> 解析 shared -> semver 比对 -> 满足复用 Host 单例，不满足 Remote
      自载
  - concept: 微前端治理规范
    desc: 基座下沉能力：公共依赖单例、路由分发协议、组件库版本流程、统一监控 SDK、自动化准入门槛
  - concept: 绞杀者模式
    desc: 遗留系统改造核心策略：新功能新子应用、老系统跑遗留子应用、基座逐步接管路由权限，平滑过渡
  - concept: 灰度发布与回滚
    desc: Nginx 流量分流 + 一键切回旧 Upstream + 监控指标超阈值自动触发回滚，保障改造零重大故障
  - concept: AI 赋能微前端工程化
    desc: Prompt Engineering + RPA + 智能路由 + 自动化测试 + 遗留重构，全链路降本增效
  - concept: 提示词工程落地
    desc: 基座/子应用脚手架代码生成、配置模版化、Prompt 库沉淀，实现‘输入关键词 -> 自动生成文案/图片/视频 -> 定时发布’
  - concept: RPA 自动化集成
    desc: 脚手架生成、依赖升级、发布流水线、监控巡检，将『人力成本』转化为『脚本维护成本』，实现 7x24 小时低成本运行
  - concept: 智能路由与分发
    desc: AI 感知路由匹配、动态基座加载、跨应用状态同步，实现从‘人治/经验驱动’向‘数据/流程驱动’跃迁
  - concept: 自动化测试与监控
    desc: E2E 用例生成、沙箱异常诊断、性能基线智能告警，构建覆盖‘创意-生产-分发-变现’全链路的数字化协作体系
  - concept: 遗留系统 AI 重构
    desc: 代码理解、生命周期补全、依赖拓扑分析、增量迁移，将不确定性极高的链上投机行为包装成『确定性 SOP’
