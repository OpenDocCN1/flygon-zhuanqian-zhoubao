  life_analogy:
  - 想象注意力机制是一个**大型学术会议的“提问-回答”环节**：
  - '- **Query (Q)** = 你手里的**问题卡片**（“谁做了这项工作？”）'
  - '- **Key (K)** = 每位发言者桌牌上的**关键词标签**（“作者”、“审稿人”、“观众”）'
  - '- **Value (V)** = 每位发言者准备的**完整发言稿/观点内容**'
  - '- **相似度分数 (QK^T)** = 你把问题卡片和每个桌牌**逐一对比**，算出‘匹配度’'
  - '- **缩放因子 (1/√d)** = 会议组织者发现问题太长导致匹配度数值过大、难以区分，于是**统一除以一个系数**让分数回到舒适区间'
  - '- **Softmax** = 你将匹配度转化为**分配给每位发言者的提问时间比例**'
  - '- **加权求和 (×V)** = 最终你收到的**综合回答** = Σ(时间比例 × 对方发言内容)'
  - '- **多头注意力** = 会议设**多个分组讨论室 (Head)**，每组关注不同维度（语法组、逻辑组、指代组），最后由**主持人 (W^O)** 整合成会议纪要'
  - '- **位置编码** = 发言者胸牌上的**发言顺序号**，没有它，‘张三反驳李四’和‘李四反驳张三’模型就分不清了'
  - 就像主持人必须根据提问动态分配时间、且需要知道发言顺序，注意力机制也通过 Query 动态聚合 Value、依赖位置编码建立序列感。
  summary:
  - concept: Query/Key/Value (Q/K/V)
    desc: 注意力机制的三个基本角色：提问向量、标签向量、内容向量，均由输入线性投影得到
  - concept: 缩放点积注意力
    desc: 标准化公式 Attention(Q,K,V)=softmax(QK^T/√d_k)V，利用矩阵乘法并行、缩放因子稳定梯度
  - concept: 缩放因子 1/√d_k
    desc: 抵消点积随维度 d_k 增长导致的方差放大，防止 Softmax 饱和梯度消失
  - concept: 多头注意力
    desc: 将模型维度拆分为 h 个头并行计算，再拼接投影；参数量不变，多子空间捕捉异构关系（句法/语义/位置）
  - concept: 注意力头分工
    desc: 不同头自发专业化：如指代消歧头、主谓依存头、[CLS]聚合头，存在冗余头可剪枝
  - concept: 绝对位置编码 (正弦/可学习)
    desc: 为每个位置分配固定/可学习向量；正弦编码具备线性外推性，可学习编码表达强但定长
  - concept: 相对位置编码 / RoPE
    desc: 仅建模相对距离 i-j；RoPE 通过复平面旋转 Query/Key 将相对位置融入注意力分数，实现长文本优异外推
  - concept: 自注意力
    desc: Q、K、V 来自同一序列，建模序列内部 Token 间的全局依赖，路径长度 O(1)
  - concept: 交叉注意力
    desc: Q 来自解码端，K、V 来自编码端，建模编解码序列间的对齐关系（如翻译对齐）
  - concept: 注意力可视化
    desc: 绘制 (Layer, Head, Query, Key) 热力图，观测底层局部/高层全局、头分工等语言学现象
  - concept: 注意力≠解释
    desc: 权重高不等于因果重要 (Jain & Wallace, 2019)；需结合梯度/消融/探针等因果分析手段
  exercises:
  - 'no': 1
    title: 手算一次缩放点积注意力
    contents:
    - 给定单头注意力输入：
    - Q = [[1, 0], [0, 1]]  (2×2)
    - K = [[1, 0], [0, 1], [1, 1]]  (3×2)
    - V = [[1, 2], [3, 4], [5, 6]]  (3×2)
    - d_k = 2
    - 请按步骤手算（可用 Python/计算器辅助）：
    - 1. 计算原始分数矩阵 S = QK^T (形状 2×3)
    - 2. 计算缩放分数 S' = S / √d_k
    - 3. 对 S' 每行独立做 Softmax 得到权重矩阵 A (2×3)
    - 4. 计算最终输出 O = A V (形状 2×2)
    - 思考题：
    - '- 若 d_k 增大到 100 且不除以 √d_k，S 矩阵数值量级会如何变化？Softmax 输出会趋向什么极端分布？'
    - '- 为什么缩放因子是 √d_k 而不是 d_k 或其他数？（提示：假设 Q、K 分量独立同分布，均值 0 方差 1）'
    - '- 若 Q、K 已归一化为单位向量，是否还需要缩放因子？'
  - 'no': 2
    title: 多头注意力张量变形与参数量验证
    contents:
    - 假设模型维度 d_model=512，头数 h=8，则每头维度 d_k=d_v=64。
    - 输入张量 X 形状为 [batch_size=2, seq_len=10, d_model=512]。
    - 请回答：
    - 1. 线性投影 W^Q、W^K、W^V 的形状分别是什么？投影后 Q/K/V 形状？
    - 2. 为了并行计算，通常将 Q/K/V 重塑为 [batch, h, seq_len, d_k]。请写出 PyTorch 风格的 `view`/`transpose`
      代码片段。
    - 3. 计算多头注意力模块总参数量（含 Q/K/V/O 四组投影，不含 bias），验证是否约等于 4 * d_model²。
    - 4. 若将头数 h 增加到 16 (d_k=32)，单头表达力会如何变化？推理延迟会如何变化？（考虑显存带宽与并行度权衡）
  - 'no': 3
    title: 位置编码外推性实验设计
    contents:
    - 对比三种位置编码在“长度外推”任务上的表现：
    - 任务：训练一个 2 层小型 Transformer 学习‘复制输入序列’或‘反转序列’，训练长度 max_len=64，测试长度 128/256。
    - 三种编码方案：
    - A. 可学习绝对位置编码 (nn.Embedding(64, d_model))
    - B. 正弦绝对位置编码 (sin/cos 公式)
    - C. RoPE 相对位置编码
    - 实验步骤：
    - 1. 固定随机种子、超参数，分别训练三个模型至收敛。
    - 2. 在测试集 (len=128, 256) 评估准确率。
    - 3. 可视化正弦编码中 PE(pos+64) 与 PE(pos) 的线性关系（绘制余弦相似度热力图）。
    - 4. 可视化 RoPE 下不同相对距离的注意力分数分布是否随绝对位置不变。
    - 思考题：
    - '- 为什么方案 A 在 len>64 时会彻底失效？'
    - '- 方案 B 虽有外推性，但长距离性能为何仍下降？（提示：注意力分数中的高频分量）'
    - '- 方案 C 如何通过修改频率基数 (base=10000 → 500000) 进一步增强外推？'
  - 'no': 4
    title: 注意力可视化解读与‘注意力≠解释’复现
    contents:
    - 使用 HuggingFace `bert-base-uncased` 加载模型与 tokenizer。
    - 输入句子：`'The animal didn't cross the street because it was too tired.'`
    - 任务：
    - 1. 提取所有层、所有头的注意力权重，绘制第 5 层第 3 头的热力图（横轴 Key，纵轴 Query）。
    - 2. 观察 token `'it'` (Query) 对 `'animal'` 与 `'street'` (Key) 的注意力权重差异。
    - 3. **对抗实验**：构造反事实输入 `'The animal didn't cross the street because it was too
      wide.'`，重新提取同一头注意力权重。
    - 4. 对比两次实验中 `'it' -> 'animal'` 的权重变化。如果权重几乎不变，但模型预测从 ‘animal’ 变为 ‘street’，说明了什么？
    - 5. 进阶：使用 `captum` 或 `transformers-interpret` 计算 Integrated Gradients 归因分数，对比注意力权重与梯度归因的相关性。
    - 思考题：
    - '- 为什么高注意力权重不保证因果重要性？（提示：注意力是‘相关性’，梯度是‘敏感性’）'
    - '- 哪些场景下注意力可视化最容易误导？（如：冗余模式、位置偏置、[CLS] 汇聚头）'
  units:
  - 'no': 1
    name: 序列建模的困境与注意力直觉 —— 从“死记硬背”到“聚光灯聚焦”
    points:
    - '**为什么需要这个概念？**'
    - '- RNN 串行处理导致训练无法并行，长序列梯度消失/爆炸，难以捕捉长距离依赖'
    - '- CNN 固定窗口感受野有限，需叠加极深层数才能覆盖全局，参数效率低'
    - '- 传统 Seq2Seq 靠单一固定向量压缩全序列信息，形成严重信息瓶颈'
    - '**核心定义**'
    - '- 注意力机制：模拟人类视觉‘聚光灯’，动态计算查询与键的相似度，生成权重分布，对值加权求和'
    - '- 核心公式：Attention(Q, K, V) = Σ(weight_i * V_i)，weight = softmax(score(Q, K))'
    - '**关键性质**'
    - '- 动态上下文感知：权重随输入 Query 变化，非固定参数'
    - '- 全局建模能力：任意两位置直接交互，路径长度 O(1)'
    - '- 可并行计算：矩阵乘法友好，利用 GPU 吞吐优势'
    - '**典型例子**'
    - '- 机器翻译中 ‘The animal didn''t cross the street because it was too tired’ 里 ‘it’
      自动聚焦 ‘animal’ 而非 ‘street’'
    - '**边界条件**'
    - '- 计算复杂度 O(N²) 随序列长度平方增长，成为长文本瓶颈'
    - '- 缺乏天然位置感知，必须显式注入位置编码'
    - '...'
    sources:
    - paper: 20230418_007.md
      role: origin
    - paper: 20230418_009.md
      role: improve
    excerpts:
    - RNN 的串行本质决定了它无法利用现代 GPU 的并行计算能力...
    - 注意力机制的核心直觉是‘聚光灯’：在解码每一步时，不是死记硬背一个固定的上下文向量，而是重新‘看’一遍编码端的所有隐状态，给重要的分高分，不重要的分低分。
    - Bahdanau Attention 公式：score(h_t, h_s) = v^T tanh(W_h h_t + W_s h_s)...
  - 'no': 2
    name: 缩放点积注意力 —— 让相似度变成稳定的分配比例
    points:
    - '**为什么需要这个概念？**'
    - '- 加性注意力 (Bahdanau) 需要学习参数矩阵，计算量大且难以并行优化'
    - '- 点积注意力无参数、极快，但向量维度 d 过大时点积方差变大，导致 Softmax 饱和、梯度消失'
    - '**核心定义**'
    - '- 公式：Attention(Q, K, V) = softmax(QK^T / √d_k) V'
    - '- Q(Query)、K(Key)、V(Value) 均为输入线性投影得到'
    - '- 缩放因子 1/√d_k 抵消维度增长带来的方差放大'
    - '**关键性质**'
    - '- 矩阵乘法高度并行化，极致利用 Tensor Core'
    - '- 缩放因子使梯度方差与 d_k 无关，训练极其稳定'
    - '- 无额外可学习参数，工程落地极简'
    - '**典型例子**'
    - '- Transformer 论文中 Base 模型 d_k=64，未缩放时 Softmax 输入方差 ~64，缩放后归一为 1'
    - '**边界条件**'
    - '- 当 d_k 很小（如 <16）时，缩放可能过度抑制信号差异'
    - '- 标准点积注意力仍为 O(N²) 显存/算力，长序列需 FlashAttention 等 IO 感知算法优化'
    - '...'
    sources:
    - paper: 20230418_010.md
      role: origin
    excerpts:
    - 点积注意力的计算效率远高于加性注意力，因为可以高度优化的矩阵乘法实现。
    - 为了抵消点积随维度增长而变大的问题，作者引入了缩放因子 1/√d_k。假设 Q、K 分量独立均值 0 方差 1，则点积均值 0 方差 d_k，除以 √d_k
      后方差恒为 1，Softmax 输入分布稳定，梯度不易消失。
    - Attention(Q, K, V) = softmax(QK^T / √d_k)V
  - 'no': 3
    name: 多头注意力 —— 多视角专家的‘会议纪要’
    points:
    - '**为什么需要这个概念？**'
    - '- 单头注意力只能学习一种‘关系模式’（如句法依存或语义共指），表达力受限'
    - '- 需要同时捕捉‘主谓一致’、‘代词指代’、‘长程依赖’等异构关系'
    - '**核心定义**'
    - '- MultiHead(Q, K, V) = Concat(head_1, ..., head_h) W^O'
    - '- head_i = Attention(QW_i^Q, KW_i^K, VW_i^V)'
    - '- 将 d_model 拆分为 h 个头，每头维度 d_k = d_model / h'
    - '**关键性质**'
    - '- 参数总量不变：投影矩阵总参数 h * (d_model * d_k) * 3 ≈ 3 d_model²'
    - '- 子空间分工：不同头自发专业化（句法、语义、位置等），实验可视化证实'
    - '- 并行计算：h 个头独立计算，合并时只需一次线性投影'
    - '**典型例子**'
    - '- BERT 第 5 层第 3 头专门关注 ‘[CLS]’ 聚合信息，第 8 层第 11 头专捕获主谓依存'
    - '**边界条件**'
    - '- 头数 h 过多导致 d_k 过小（<32），单头表达力不足，性能下降'
    - '- 并非所有头都有用，存在‘冗余头’，可剪枝加速推理'
    - '...'
    sources:
    - paper: 20230418_019.md
      role: origin
    - paper: A47Vd3fekoelzRxZpdUcTl9Cn7W.md
      role: improve
    excerpts:
    - 多头注意力允许模型在不同的表示子空间里联合关注来自不同位置的信息。单一注意力头只能获得一个加权平均，多头则相当于有 h 组不同的 ‘专家’ 同时分析同一序列，最后再综合汇报。
    - 实验表明：不同注意力头自发学会了不同语言学任务，如核心词指代、介词宾语关系、主谓一致等。
    - MultiHead(Q,K,V) = Concat(head_1,...,head_h)W^O
  - 'no': 4
    name: 位置编码 —— 给无序集合注入‘时间感’
    points:
    - '**为什么需要这个概念？**'
    - '- Self-Attention 是排列等变/不变的：打乱输入顺序，输出只是相应打乱，完全丢失位置信息'
    - '- 语言高度依赖顺序：‘狗咬人’ vs ‘人咬狗’，必须显式告知模型位置'
    - '**核心定义**'
    - '- 绝对位置编码：PE(pos, 2i) = sin(pos/10000^{2i/d}), PE(pos, 2i+1) = cos(...)'
    - '- 可学习位置编码：nn.Embedding(max_len, d_model) 直接优化'
    - '- 相对位置编码：仅建模相对距离 i-j，如 T5 偏置、RoPE 旋转'
    - '**关键性质**'
    - '- 正弦编码：线性关系 PE(pos+k) 可由 PE(pos) 线性表示，天然支持外推'
    - '- RoPE：将相对位置融入 Query/Key 旋转，Attention 分数仅含相对距离，长文本外推性能最强'
    - '- 可学习编码：表达力最强但受限于训练 max_len，外推能力差'
    - '**典型例子**'
    - '- GPT-2/3 使用可学习绝对编码，上下文窗口固定 1024/2048'
    - '- LLaMA/ChatGLM 采用 RoPE，微调频率基数即可扩展至 32k/128k/1M 上下文'
    - '**边界条件**'
    - '- 绝对编码在序列长度超出训练分布时性能崩塌'
    - '- 相对编码计算复杂度略高（需构建偏置矩阵或旋转），但可通过内核融合优化'
    - '...'
    sources:
    - paper: 20230418_020.md
      role: origin
    - paper: B95VdtwByoPXGoxac7Ec1KhQnwc.md
      role: improve
    excerpts:
    - 由于 Self-Attention 不包含循环或卷积结构，模型无法感知 Token 的顺序信息，必须注入位置编码。
    - 正弦位置编码的关键性质：PE(pos+k) 可以表示为 PE(pos) 的线性变换，这意味着模型容易学习到相对位置关系。
    - RoPE (Rotary Position Embedding) 通过将 Query 和 Key 在复平面上旋转，使得 Attention 分数仅依赖于相对位置差，完美解决了长文本外推问题。
  - 'no': 5
    name: 注意力可视化与解读 —— ‘看’进模型大脑，但别过度解读
    points:
    - '**为什么需要这个概念？**'
    - '- 黑盒模型需可解释性支撑调试、合规与科学发现'
    - '- 直观验证注意力是否真学会了语言学现象（指代消歧、核心词聚焦）'
    - '**核心定义**'
    - '- 将 Attention 权重矩阵 (Layer, Head, Query_Pos, Key_Pos) 绘制为热力图'
    - '- 横轴 Key(Source)，纵轴 Query(Target)，颜色深浅=权重大小'
    - '**关键性质**'
    - '- 层层递进：底层头关注局部句法（邻近词），高层头关注长程语义（指代、共指）'
    - '- 头分工：同层不同头展现明显功能分化'
    - '**典型例子**'
    - '- ‘The animal didn''t cross the street because it was too tired’ 中 ‘it’->‘animal’
      权重远高于 ‘street’'
    - '- 代码生成中，变量调用处注意力强指向定义处'
    - '**边界条件**'
    - '- **注意力 ≠ 解释** (Jain & Wallace, 2019)：权重高不等于因果重要，对抗扰动实验常推翻直觉'
    - '- 可视化仅是‘相关性’非‘因果性’，需配合梯度/消融/探针等方法综合判断'
    - '- 多头聚合后的平均热力图常模糊关键模式，需单头单层分析'
    - '...'
    sources:
    - paper: 20230418_022.md
      role: origin
    excerpts:
    - 注意力可视化是理解 Transformer 内部运作最直观的窗口。通过绘制不同层、不同头的注意力热力图，可以清晰看到模型如何‘阅读’输入序列。
    - 经典案例：在指代消歧任务中，特定头的注意力会精准地从代词指向其先行词。
    - 必须警惕 ‘Attention is not Explanation’：注意力权重高不代表该 Token 对预测有因果贡献，权重分布可能被冗余模式主导。严谨解释需结合梯度归因、反事实干预等因果分析手段。
