  life_analogy:
  - 想象职业成长是一场**《文明》系列策略游戏**：
  - '- **成长阶段模型** = **科技树与时代进阶**：从部落时代（初级）到信息时代（专家），每个时代解锁新建筑（能力维度），需满足人口（业绩）、科技点（技术深度）、文化（影响力）多维指标才能进阶'
  - '- **技术影响力构建** = **建立世界奇观与贸易路线**：博客/开源是“金字塔”“大图书馆”，持续产出文化/科技溢出收益；开源项目是“丝绸之路”，连接外部文明获取资源（机会/认可）'
  - '- **双通道抉择** = **选择“统治者”还是“伟大科学家/工程师”路线**：统治者（EM）管城市（团队）、调度资源、外交（跨部门）；科学家（IC）攻关核心科技（疑难杂症）、制定蓝图（标准）、辐射文明（赋能）'
  - '- **技术变现路径** = **发展副业产业链**：用主城（主业）盈余资源，先建低成本贸易站（咨询/模版），再建工厂（课程/插件），最终建立殖民地（独立产品/SaaS）实现资源自给自足'
  - '- **个人成长操作系统** = **游戏内的“顾问面板”与“胜利条件”设定**：五年愿景=胜利条件（科技/文化/征服胜利）；季度OKR=每回合政策调整；周复盘=回合结束结算；PDCA=根据局势动态调整战略'
  summary:
  - concept: 成长阶段模型
    desc: 五阶段×五维度能力雷达，用量化行为锚点替代模糊年限，配套标准化晋升答辩素材包
  - concept: 技术影响力复利模型
    desc: 博客/开源/分享/专利/社区五渠道联动，遵循‘节奏-选题-孵化-演讲’路径，建立长尾资产与信任货币
  - concept: 双通道抉择 (EM vs IC)
    desc: EM管人/项目/流程/招聘/文化，IC管技术前瞻/攻关/标准/赋能，提供6个月试岗验证机制与可逆转型路径
  - concept: 技术变现MVP阶梯
    desc: 咨询/模版（低杠杆快启动）→ 课程/专栏（高杠杆可复制）→ 独立产品/SaaS（资产属性强），核心是低成本试错与合规红线
  - concept: 个人成长操作系统 (OKR/PDCA)
    desc: 五年愿景→年度主题→季度OKR(O/KR)→月度计划→周度复盘→年度报告，嵌套PDCA微循环，含技术/影响力/财务三资产盘点
  - concept: 晋升答辩素材包
    desc: 结构化证据集：业务价值量化(数字)、技术难点拆解(STAR)、复用推广案例(范围)、规范建设成果(标准)
  - concept: 开源孵化路径
    desc: Demo(验证想法) → Tool(解决痛点) → Framework(建立标准) → Ecosystem(构建生态)，每阶段对应影响力跃迁
  - concept: 转型验证计划
    desc: 6个月周期，设定OKR、关键动作清单、退出机制，通过‘技术领头羊’轮岗等低风险方式验证IC/EM适配性
  - concept: 抗脆弱缓冲带
    desc: 预留20%时间应对黑天鹅，允许目标动态调整，OKR完成度70%即成功，防止僵化考核导致系统崩溃
  - concept: 三资产盘点
    desc: 年度复盘核心工件：技术资产(代码/文档/专利)、影响力资产(粉丝/Star/受邀)、财务资产(主业/副业/投资)
  exercises:
  - 'no': 1
    title: 绘制个人能力雷达图与差距分析
    contents:
    - 参考五维度（业务交付、技术深度、工程效能、团队协作、影响力）定义，为自己当前阶段（如中级→高级）在每个维度打分（1-10分）。
    - 列出目标阶段（如高级）在每个维度的3个可观测行为锚点（如：主导过年PV>100万项目、输出过通用组件库、指导过2名新人）。
    - 对比差距，制定本季度针对性提升计划（每个维度最多1个行动项）。
    - 回答问题：
    - '- 哪个维度是你的‘短板’？是否会成为晋升阻碍？'
    - '- 如何将‘熟悉性能优化’转化为可度量的行为锚点？'
  - 'no': 2
    title: 设计个人技术影响力‘最小可行性内容产出’ (MVCP) 计划
    contents:
    - 选择1个你最擅长的细分技术领域（如：Vue响应式原理、微前端落地、CI/CD优化）。
    - 制定未来3个月的内容生产节奏：每月1篇深度复盘/源码解析/最佳实践文章，发布至掘金/博客/GitHub。
    - 设计1个开源项目孵化路径：Demo(周末原型) → Tool(解决团队痛点) → Framework(抽象通用) 的里程碑节点。
    - 回答问题：
    - '- 如何确保内容产出不挤占核心业务交付时间？（提示：工作产出顺手整理）'
    - '- 文章/项目发布后，如何追踪‘长尾效应’与‘信任传递’指标？'
  - 'no': 3
    title: 双通道试岗验证方案设计
    contents:
    - 假设你处于高级工程师阶段，面临EM/IC抉择。为自己设计一份‘6个月转型验证计划’。
    - 若倾向EM：申请带2-3人实习生/外包小组，设定OKR（如：项目按时交付率、成员成长、流程规范产出）。
    - 若倾向IC：申请‘技术领头羊’角色，主导跨团队技术选型/重构/标准制定，设定OKR（如：白皮书产出、推广覆盖率、性能指标提升）。
    - 定义‘退出机制’：若6个月末OKR完成度<50%或强烈不适感，如何无损回归原赛道？
    - 回答问题：
    - '- 你所在组织是否真正落地双通道？如何通过JD/晋升案例/薪资带位验证？'
    - '- EM与IC的‘互补性’在你身上如何体现？缺失哪一极会导致职业天花板？'
  - 'no': 4
    title: 技术变现MVP预售验证实战
    contents:
    - 基于你的技术栈优势，构思1个数字化产品创意（如：VS Code插件、Notion模版库、付费小册大纲、Figma插件）。
    - 完成MVP预售验证：制作Landing Page/预售文档，发布至技术社区/朋友圈，设定‘预售10份/收集50份留资’为通过线。
    - 若通过，制定正式交付计划；若未通过，复盘是‘需求假’、‘分发渠道假’还是‘定价假’，并决定Kill或Pivot。
    - 回答问题：
    - '- 如何确保变现内容不触碰公司竞业协议/IP红线？（提示：通用技能/工具类 vs 业务逻辑类）'
    - '- 独立产品MRR增长模型的核心驱动变量有哪些？（获客成本CAC、生命周期价值LTV、流失率Churn Rate）'
  - 'no': 5
    title: 搭建个人《季度OKR复盘模版》并执行首轮
    contents:
    - 在Notion/Obsidian/Excel中建立模版，包含：五年愿景、年度主题、本季度O(最多3个)/KR(每O 3-5个、可量化)、月度拆解、周度复盘记录区、年度三资产盘点表。
    - '设定下一季度OKR（示例：O1：夯实工程化底座 → KR1: 脚手架核心功能上线并文档化；KR2: Star破100；KR3: 输出3篇实战文章）。'
    - 执行首周周度复盘：填写‘本周完成/受阻原因/下周Top3/需协调资源’。
    - 回答问题：
    - '- 为什么OKR完成度70%即为成功？若连续两季度100%达成，说明了什么？'
    - '- 如何将‘技术资产盘点’（如GitHub仓库/技术文档/专利）量化纳入年度复盘报告？'
  units:
  - 'no': 1
    name: 成长阶段模型 —— 给职业进阶装上“导航仪”
    points:
    - '**为什么需要这个概念？**'
    - '- 前端工程师常陷入“只会写业务代码”的迷茫，缺乏清晰的能力坐标系'
    - '- 企业晋升答辩本质是“能力对标”，需要结构化的证据支撑而非流水账'
    - '- 行业缺乏统一的能力雷达定义，导致跳槽面试、薪资谈判缺乏客观依据'
    - '**核心定义**'
    - '- 将职业生涯划分为初级/中级/高级/专家/资深专家五大阶段'
    - '- 每阶段在业务交付、技术深度、工程效能、团队协作、影响力五个维度设定量化期望值'
    - '- 配套标准化晋升答辩素材包：业务价值量化、技术难点拆解、复用推广案例、规范建设成果'
    - '**关键性质**'
    - '- 阶梯性：高阶能力包含低阶能力并叠加新维度（如从“执行”到“规划”再到“战略”）'
    - '- 正交性：五维度相对独立，避免“技术强但协作弱”模糊判定'
    - '- 可度量：每个维度给出可观测行为锚点（如“主导过年产出>50万PV项目”而非“熟悉性能优化”）'
    - '**典型例子**'
    - '- 初级：在导师指导下完成单模块开发，修复指派Bug，掌握Vue/React基础API'
    - '- 高级：主导复杂系统重构（如微前端架构落地），产出通用组件库沉淀，指导新人成长'
    - '- 专家：制定前端技术雷达，主导跨部门技术攻关（如首屏加载从3s降至1s），建立团队工程化体系'
    - '**边界条件**'
    - '- 年限≠阶级：部分工程师5年仍处于初级（重复1年经验5次）'
    - '- 维度不平衡允许“尖刀型”人才存在，但晋升通常要求“无短板”达标'
    - '- 不同规模/业务阶段公司对同一阶级期望值不同，需结合组织语境校准'
    sources:
    - paper: YE1FdsTuxoaBbNx4f5dcnSNenxb.md
      role: origin
    excerpts:
    - 定义各阶段在业务交付/技术深度/工程效能/团队协作/影响力五维度的期望值、整理晋升答辩 PPT 结构（业务价值/技术难点/复用推广/规范建设）。
  - 'no': 2
    name: 技术影响力构建 —— 从“闷声干活”到“被动被看见”
    points:
    - '**为什么需要这个概念？**'
    - '- 技术能力若不外化，组织无法感知，晋升、加薪、话语权均受限'
    - '- 传统“写博客”往往坚持不下或无人问津，缺乏系统性运营方法论'
    - '- 影响力是复利资产，越早布局边际收益越高，是打破“35岁危机”的核心护城河'
    - '**核心定义**'
    - '- 通过技术博客、开源项目、技术分享、专利论文、社区运营五大渠道持续输出'
    - '- 遵循“内容生产节奏（周更/月更）→ 选题策略（踩坑复盘/源码解析/最佳实践/前沿解读）→ 开源孵化路径（Demo→Tool→Framework→Ecosystem）→
      演讲提案技巧”的完整复利模型'
    - '**关键性质**'
    - '- 长尾效应：一篇深度源码解析文章可能持续3年引流，优于十篇追热点短文'
    - '- 信任传递：开源项目Star数、分享PPT下载量是比简历更硬的“能力货币”'
    - '- 复利杠杆：单次内容产出可衍生为视频、课程、直播、咨询多形态变现'
    - '**典型例子**'
