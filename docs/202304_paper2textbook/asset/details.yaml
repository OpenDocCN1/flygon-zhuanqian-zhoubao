    name: AI 调教范式：老师-天才童工模型与四步调教法
    points:
    - '**为什么需要这个概念？**'
    - '- 大多数人用不好 AI 的核心原因是代入‘老板思维’（提模糊需求、不给资料、不培训、只甩锅），而非‘老师思维’（拆解任务、喂养知识、分步验证、正向激励）'
    - '- GPT 表现上限取决于调教者的教学设计能力，而非模型本身能力'
    - '- 需要一套可复用、可标准化的 AI 协作 SOP，将‘提示词工程’升级为‘AI 调教工程’'
    - '**核心定义**'
    - '- **老师-天才童工模型**：重新定义人机协作关系——用户扮演‘老师’，AI 是‘智商 250 的 3 岁神童’，需通过分步教学、耐心引导、正向强化（夸奖）激发潜能'
    - '- **四步调教法**——素材核心方法论的结构化总结：步骤一 角色设定；步骤二 结构化知识灌输（航海手册核心方法论）；步骤三 逆向拆解热门文案（少样本学习）；步骤四
      无脑执行生产（选题-脚本-录制-剪辑全流程闭环）'
    - '- **分块喂养与自我总结验证机制**——防止 AI ‘囫囵吞枣’式学习的关键机制：将长知识库拆解为小块分批输入，强制要求 AI 输出‘学习总结/心得体会’，以此作为其真正理解并内化知识的验证指标，类比‘学霸做笔记总结’与‘学渣一目十行’的差距'
    - '- **个人 Prompt 资产库**——将高效指令沉淀为可复用资产的体系，包含四大模块：学习指令模板、知识结构组织模板、范文/案例库、修正指令模板。主张未来优秀创作者必具备‘内容法则’与‘调教能力’双重素养'
    - '- **正向强化触发机制**——利用 RLHF 特性，通过多轮夸奖、情感化称呼（如‘神通广大的 GPT’、‘求求你了’) 显著提升 AI 输出质量与配合度，将拟人化交互技巧工程化'
    - '**关键性质**'
    - '- **执行力瓶颈源于‘老板思维’而非工具能力不足**'
    - '- **爆款内容可复制性定律**：爆过的选题往往都会再爆一遍'
    - '- **短视频仍是 AI 应用护城河，图文领域 AI 已具备碾压优势**'
    - '- **双料人才（懂内容法则+懂调教）是未来核心竞争力**'
    - '**典型例子**'
    - '- **角色设定 Prompt 模板**——标准化 System Prompt，锁定 AI 身份、工作流触发词（‘请学习’/‘请改写’）、反馈规范（学会回复‘好的，我已经学会’）与交互协议'
    - '- **结构化知识灌输法**——将非结构化航海手册/方法论拆解为‘定义体系（景别/画面/台词/运镜/道具）’与‘核心模板（三段式：两重一轻/开头重/结尾重/中间轻/无形装逼）’等离散知识单元，分批次喂给
      AI 并强制要求输出总结'
    - '- **爆款范例逆向注入法**——采集竞品爆款视频文案，作为少样本范例输入 AI，指令其‘选择合适模板+穿插爆款因子’进行改写重组，实现结构迁移而非内容抄袭，输出含时长、素材建议、模板溯源说明的完整脚本'
    - '- **身份互换技巧**——一种思维模型技巧，通过让 AI 站在用户视角（‘如果你是我会怎么做？’）反向输出，辅助决策或优化方案'
    - '**边界条件**'
    - '- AI 无法直接观看视频内容，短视频制作仍保留人类门槛'
    - '- 图文领域 AI 已具备击败普通博主的潜力，双料人才是核心竞争力'
    - '- 过多方法论会干扰模型注意力机制，导致生成质量下降，建议‘一个方法论就好，换方法重开会话’'
    sources:
    - paper: A4UGdiBqBoH4T0xnkW5c0Nxtnkh.md
      role: origin
    - paper: AgWGdAk0fogwx2xtpo2cg3TCncb.md
      role: improve
    excerpts:
    - 我们可以把 GPT 当成一个 3 岁神童，他的原始知识库是很粗浅的。但架不住他智商高呀，几千字的内容他一下子就能学会了。所以，他一定会成为我们 24 小时在线，任劳任怨，而且一教就会一点就通的天才童工。
    - '## 第一步：给予设定... ## 第二步：灌输知识... ## 第三步：输入从别的热门视频里扒下的文案... ## 第四步：无脑制作'
    - 记得分块发知识...你发一长串，这小子其实也会说：‘好的，我已经学会了’...但是他写出来的内容就会很垃圾...核心点是要让他去自己总结，会总结就说明他真的学会了。
    - 一定要学会建立自己的 prompt 库，可以涵盖几个方面：怎么发起学习指令让 GPT 更好地学会；怎么样的知识结构能让 GPT 更好地领悟；...建立范文库...要不断修正
