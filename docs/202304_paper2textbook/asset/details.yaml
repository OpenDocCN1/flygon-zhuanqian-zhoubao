  - 'no': 3
    name: 系统设计题实战框架 —— 从“画图”到“做架构决策”
    points:
    - '**为什么需要这个概念？**'
    - '- 系统设计题无标准答案，考察抽象建模、权衡取舍、工程落地综合能力'
    - '- 缺乏结构化框架易陷入“功能罗列”而非“架构设计”，忽略非功能性指标'
    - '- 需要一套可复用、可落地的解题范式应对开放性问题（可视化平台/组件库/监控 SDK/微前端基座）'
    - '**核心定义**'
    - '- 六步法框架：需求澄清 → 架构草图 → 核心模块设计 → 数据流 → 非功能性指标 → 演进扩展'
    - '- 产出物：架构图（C4 模型）、技术选型表（对比优劣）、风险缓解方案'
    - '**关键性质**'
    - '- 需求澄清定边界：用户量/QPS/数据量/实时性/一致性/多端/团队技术栈'
    - '- 核心模块抽核心：识别核心难点（如可视化平台的 Schema 设计/渲染引擎/撤销重做）'
    - '- 非功能显性化：可用性（SLA/降级/熔断）、性能（缓存/分页/懒加载）、安全（XSS/CSP/权限）、可维护性（模块解耦/文档/测试）'
    - '**典型例子**'
    - '- 设计组件库：Monorepo 结构/主题系统/Tree Shaking/文档站/版本发布/单测覆盖率'
    - '- 设计监控 SDK：采集端/上报端/存储/查询/告警，重点解决数据丢失/性能开销/采样率'
    - '- 设计微前端基座：沙箱隔离/通信机制/共享依赖/路由分发/子应用生命周期'
    - '**边界条件**'
    - '- 切忌“简历驱动设计”：只谈熟悉技术，忽视场景适配性'
    - '- 避免过度设计：早期不做分布式、Service Mesh 等重架构，强调演进路径'
    - '- 时间分配：澄清 10%、草图 20%、核心模块 40%、数据流/非功能/演进 30%'
    - '...'
