    title: 实战：基于『ChatGPT 超级写手机器人 1.0』架构设计一个通用的 AI 长文本生产编排器
    contents:
    - 设计一个 TypeScript 类 `AIWriterOrchestrator`，核心能力包括：
    - 1. 账号池管理：支持添加/移除账号、健康度检查、自动隔离异常账号
    - '2. 任务队列：接收 `{ prompt: string, options: { maxTokens, temperature } }`，自动分片、调度、重试'
    - 3. 智能续写：检测流式输出是否因 `length` 截断，自动发送 `继续` 指令并拼接上下文
    - 4. 上下文拼接：维护对话历史，确保多轮对话的语义连贯性，支持 `system`/`user`/`assistant` 角色分离
    - 5. 结果持久化：自动保存至本地数据库（如 IndexedDB），支持断点续传与增量导出
    - 6. 监控面板：暴露 `onProgress`/`onComplete`/`onError` 事件，供上层 UI 实时展示生成进度、Token 消耗、成功率
    - 验收标准：
    - '- 单次任务支持 ≥5000 字输出，上下文连贯性无逻辑断层'
    - '- 账号异常（限流/封号）时自动切换，任务无感知迁移'
    - '- 网络抖动触发指数退避重试，最大重试 3 次'
    - '- 内存占用 ≤ 200MB，无内存泄漏'
