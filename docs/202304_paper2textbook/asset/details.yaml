  - 'no': 2
    title: Vitest Mock 实战与边界处理
    contents:
    - 给定一个组合式函数 `useFetchUser.ts`：
    - '```ts'
    - import { ref } from 'vue'
    - import api from '@/api/user' // 默认导出 axios 实例
    - ''
    - 'export function useFetchUser(id: string) {'
    - '  const user = ref<User | null>(null)'
    - '  const loading = ref(false)'
    - '  const error = ref<Error | null>(null)'
    - ''
    - '  async function fetch() {'
    - '    loading.value = true'
    - '    try {'
    - '      const res = await api.getUser(id)'
    - '      user.value = res.data'
    - '    } catch (e) {'
    - '      error.value = e as Error'
    - '    } finally {'
    - '      loading.value = false'
    - '    }'
    - '  }'
    - ''
    - '  return { user, loading, error, fetch }'
    - '}'
    - '```'
    - 任务：
    - 1. 编写单测文件 `useFetchUser.spec.ts`，使用 `vi.mock` 模拟 `@/api/user`，覆盖成功、失败、loading
      切换三个分支
    - 2. 使用 `vi.useFakeTimers()` 控制时间，验证 `loading` 在异步操作期间为 true
    - 3. 解释：为何 `vi.mock('@/api/user')` 必须放在文件顶层？若 `api` 是命名导出 `export const api =
      ...` 该如何 Mock？
    - 4. 运行 `vitest --coverage` 后发现 `branches` 覆盖率仅 60%，排查可能原因并补全用例
  - 'no': 3
    title: Vue 组件测试：挂载策略与交互断言
    contents:
    - 组件 `SearchSelect.vue`：
    - '- Props: `options: { label: string, value: any }[]`, `modelValue: any`, `placeholder:
      string`'
    - '- Emits: `update:modelValue`, `change`'
    - '- 内部：使用 `<Teleport to="body">` 渲染下拉菜单，点击选项触发 emit，支持键盘 ↑/↓/Enter 选择'
    - 任务：
    - 1. 编写单测：使用 `shallowMount` 验证 Props 透传、默认占位符渲染、点击输入框触发 `focus` 事件
    - '2. 编写集成测试：使用 `mount` + `attachTo: document.body` 完整渲染 Teleport 下拉菜单，模拟键盘 ↑/↓/Enter
      选择第三项，断言 `update:modelValue` 与 `change` 事件载荷正确'
    - 3. 解释：为何单测用 `shallowMount` 而集成测试必须用 `mount` + `attachTo`？若不加 `attachTo` 会报何种错误？
    - '4. 组件内部使用 `watchEffect` 根据 `options` 变化自动修正 `modelValue`，如何在测试中验证此响应式联动？（提示：`await
      wrapper.setProps({ options: newOptions })` 后需等待什么？）'
  - 'no': 4
    title: Playwright E2E：Page Object 封装与网络拦截
    contents:
    - 目标：实现「用户登录 → 拦截订单列表接口返回模拟数据 → 断言表格渲染 → 视觉回归对比」完整流程。
    - 任务：
