      1 个。
    - 1. Prompt 库设计：为‘子应用接入基座’建立标准化 Prompt 模版，包含角色设定、任务拆解、输出格式、少样本示例，要求输出生命周期钩子、路由配置、沙箱适配、依赖声明四大模块代码。
    - 2. RPA 流水线编排：设计‘从需求单到子应用上线’的自动化流水线，覆盖：Git 仓库创建、脚手架生成、依赖安装、代码规范检查、单测执行、构建产物上传、基座注册表更新、灰度发布、监控告警配置。
    - 3. 智能路由落地：基于用户行为日志与应用元数据，训练轻量模型预测‘下一个高概率访问的子应用’，实现预加载与预渲染，降低首屏白屏时间。
    - 4. 沙箱异常 AI 诊断：收集 proxy 沙箱运行时错误堆栈，结合子应用源码映射，训练分类器自动定位‘全局变量污染/生命周期未销毁/样式穿透/依赖冲突’四大典型故障类别。
    - 5. 遗留 jQuery 应用 AI 重构：输入 5 万行 jQuery 代码，输出：依赖拓扑图、全局变量清单、DOM 操作模式分类、建议的微前端生命周期适配层代码、增量迁移任务拆解。
  units:
  - 'no': 1
    name: 架构决策矩阵 —— 量化评估微前端的“入场券”
    points:
    - '**为什么需要这个概念？**'
    - '- 微前端并非银弹，引入会带来运行时性能损耗、开发调试复杂度上升、基础设施维护成本增加'
    - '- 团队常因“技术新潮”盲目拥抱微前端，导致小团队维护大架构、单体应用被过度拆分的反模式'
    - '- 需要一套可量化、可对比的决策框架，将主观判断转化为工程化的“通过/不通过”标准'
    - '**核心定义**'
    - '- 一套基于团队规模、部署频率、技术栈异构度、业务耦合度等核心维度的加权评分模型'
    - '- 设定明确的触发阈值（如：团队>10人、多仓库独立发布、技术栈迁移过渡期），满足N个核心条件才建议实施'
    - '**关键性质**'
    - '- 决策树结构：硬性前置条件（团队/部署）+ 软性加分项（技术栈/业务）'
    - '- 量化收益与成本：收益=发布效率提升×团队规模；成本=基建投入+运行时开销+认知负荷'
    - '- 可逆性评估：必须预设“回归单体”的降级方案与成本预估'
    - '**典型例子**'
    - '- 某中台业务：前端团队3人、单仓库、周发布、统一React栈 → 评分不达标 → 决策继续单体优化（模块化/懒加载）'
    - '- 某集团商业化平台：前端团队25人、多仓库、日发布、Vue2迁移React18过渡期 → 评分达标 → 决策微前端（qiankun主应用+子应用共存）'
    - '**边界条件**'
    - '- 团队规模<5人、单仓库、无技术栈迁移需求时，微前端收益几乎为负'
    - '- 基础设施团队不具备维护微前端基座能力（沙箱调试、版本治理、监控体系）时，强行上马必失败'
    - '- 业务强耦合、共享状态极多、SEO极度敏感的页面（如营销落地页）不适合纳入微前端子应用'
    sources:
    - paper: 20230418_043.md
      role: origin
    excerpts:
    - 引入决策树：团队>10人/多仓库/独立发布/技术栈迁移等触发条件，量化微前端收益与复杂度成本。
    - 架构决策矩阵：单体 vs 微前端——团队规模、部署频率、技术栈异构度量化评估
  - 'no': 2
    name: qiankun 深度解析 —— “乾坤未定，你我皆是黑马” 的沙箱与隔离艺术
    points:
    - '**为什么需要这个概念？**'
    - '- 微前端核心难题：多个子应用共存同一主应用时，如何解决全局变量污染、样式冲突、路由抢占、实例不共享'
    - '- 传统 iframe 方案体验差（白屏、刷新、通信难、SEO差），需要原生 JS 级别的隔离与共享机制'
    - '**核心定义**'
    - '- qiankun 基于 single-spa 封装，提供“开箱即用”的微前端解决方案，核心含三大能力：JS 沙箱隔离、样式隔离、预加载'
    - '**关键性质**'
    - '- 双沙箱模式：'
    - '  - `snapshot` 沙箱（适配低版本浏览器/不支持 Proxy 环境）：通过记录 window 变更快照实现隔离，卸载时恢复快照'
    - '  - `proxy` 沙箱（现代浏览器主流，基于 Proxy）：劫持 window 读写，子应用运行在独立 `fakeWindow` 上下文，天然隔离，支持多实例并发'
    - '- 样式隔离三档：'
    - '  - `strictStyleIsolation: true`：Shadow DOM 方案，最强隔离，但样式无法穿透、UI 组件库弹层需特殊处理'
    - '  - `experimentalStyleIsolation: true`：CSS Modules/Scoped CSS 编译时方案（需构建配合），性能最好'
    - '  - 默认：动态头部 style 标签切换，卸载时移除，弱隔离'
    - '- 生命周期标准化：`bootstrap`、`mount`、`unmount`、`update` 四大钩子，主应用控制子应用完整生命周期'
    - '- 通信机制：`initGlobalState` 基于发布订阅的全局状态共享，但仅限简单数据同步，复杂交互建议自定义事件或共享库'
    - '**典型例子**'
    - '- 主应用 React 18，子应用 Vue 2 / Vue 3 / React 16 共存，通过 `proxy` 沙箱实现多实例热切换无污染'
    - '- 老系统微前端化：主应用接管路由分发，子应用保持原有构建产物仅暴露生命周期钩子，零侵入式接入'
    - '**边界条件**'
    - '- `proxy` 沙箱依赖 `window.Proxy`，IE11 等旧环境必须降级 `snapshot` 沙箱，且 `snapshot` 不支持多实例并发'
    - '- Shadow DOM 样式隔离下，全局 CSS 变量、UI 库弹层（Modal/Dropdown/Tooltip 挂载 body）会失效，需配置
      `content` 挂载节点或关闭强隔离'
    - '- 子应用间共享依赖（React/Vue/UI库）需基座统一提供单例，否则重复加载导致体积膨胀、状态不同步（hooks 失效）'
    - '- 嵌套微前端（子应用再套微前端）会导致沙箱嵌套、路由基座冲突，生产环境极不推荐'
    sources:
    - paper: 20230418_043.md
      role: origin
    excerpts:
    - 剖析 `snapshot`/`proxy` 双沙箱模式、`strictStyleIsolation` Shadow DOM 方案、`initGlobalState`
      状态共享、嵌套微前端坑位。
    - qiankun 深度解析：沙箱隔离、样式隔离、预加载、主子应用通信与生命周期
  - 'no': 3
    name: Module Federation 原生联邦 —— Webpack 5 赋予的“运行时依赖共享”超能力
    points:
    - '**为什么需要这个概念？**'
    - '- 传统微前端（qiankun/single-spa）基于“运行时集成”，子应用构建产物独立，依赖去重靠外部脚本/CDN 约定，版本不一致极易爆雷'
    - '- 需要构建时感知、运行时动态协商的模块共享机制：实现“按需加载远程模块、自动协商共享依赖版本、支持热更新”'
    - '**核心定义**'
    - '- Webpack 5 核心特性 Module Federation (MF)：允许一个构建产物（Host）在运行时动态加载另一个构建产物（Remote）暴露的模块，并自动处理共享依赖的版本协商与单例化'
    - '**关键性质**'
    - '- 核心配置三要素：'
    - '  - `exposes`：Remote 端声明“导出什么”（如 `./Button` -> `./src/components/Button`）'
    - '  - `remotes`：Host 端声明“从哪拉”（如 `remoteApp@http://localhost:3001/remoteEntry.js`）'
    - '  - `shared`：双端声明“共享什么”（如 `react: { singleton: true, requiredVersion: ''^18.0.0''
      }`）'
    - '- 运行时版本协商算法：Host 加载 RemoteEntry -> 解析 shared 依赖图 -> 比对版本范围（semver） -> 满足则复用
      Host 实例，不满足则 Remote 自行加载并标记共享'
    - '- 联邦模块热更新 (HMR)：Remote 修改触发重新构建 remoteEntry.js，Host 通过 websocket 感知并拉取新模块替换，无需全量刷新'
    - '- 生态集成：`@module-federation/vite`、`@rspack/core` 原生支持 MF，打破 Webpack 专属'
    - '**典型例子**'
    - '- 组件库共享：Host 与 Remote 共享 `@design-system/ui` 单例，Remote 更新组件库版本只需修改 `shared`
      配置版本范围，Host 无需重新构建'
    - '- 业务模块动态下发：Host 为低代码平台，Remote 为各业务团队独立部署的“页面组件”，Host 运行时按需拉取渲染'
    - '**边界条件**'
    - '- 循环依赖死锁：A 暴露模块给 B，B 又暴露模块给 A，运行时初始化会陷入死循环，需架构层面禁止双向暴露'
    - '- 版本地狱：共享依赖版本范围过宽（`*`）导致运行时加载不兼容版本；过窄导致无法共享、重复加载。需配合 `package.json` `peerDependencies`
      与 CI 校验'
    - '- 运行时错误边界缺失：Remote 抛错会直接导致 Host 崩溃，必须在 Host 侧 `ErrorBoundary` 包裹远程组件加载'
    - '- 首屏性能：RemoteEntry.js 为额外网络请求，关键路径 Remote 应预加载或 SSR 注入'
    sources:
    - paper: 20230418_043.md
      role: origin
    excerpts:
    - 详解 `exposes`/`remotes`/`shared` 配置、运行时版本匹配算法、联邦模块热更新、与 Vite/Rspack 生态集成。
    - Module Federation 原生联邦：运行时依赖共享、版本协商、暴露/消费远程模块
  - 'no': 4
    name: 微前端治理规范 —— 立宪为王，治理“野蛮生长”
    points:
    - '**为什么需要这个概念？**'
    - '- 微前端赋予团队“技术栈自主权”，但若无治理，极易演变为：React/Vue/jQuery 混用、UI 库版本碎片化、路由规则各异、监控埋点缺失、公共依赖重复打包'
    - '- 治理的本质是“约定优于配置”，通过基座能力下沉、强制规范、自动化校验，将治理成本从“人肉 Review”转移到“工程化管道”'
    - '**核心定义**'
    - '- 一套覆盖接入准入、运行时契约、依赖治理、路由协议、监控统一的《微前端接入规范》文档及配套工具链'
    - '**关键性质**'
    - '- 公共依赖版本锁定：基座提供 React/Vue/Router/UI Library 单例（`shared` 配置 `singleton: true`），子应用构建时
      `externals` 排除，运行时由基座注入，杜绝版本漂移'
    - '- 路由分发协议：基座统一监听 `popstate`/`pushState`，子应用仅响应基座下发的 `basename`/路由前缀，严禁子应用直接操作
      `history` API'
    - '- 通用组件库版本策略：建立“组件库版本发布 -> 基座升级验证 -> 灰度子应用 -> 全量切换”标准化流程，禁止子应用私自锁定旧版本'
    - '- 监控埋点统一：基座注入统一 SDK（错误上报、性能指标、业务埋点），子应用仅调用标准 API，TraceID 透传打通前后端链路'
    - '- 接入准入门槛：新子应用需通过“构建产物体积检查”、“生命周期规范校验”、“沙箱隔离压测”、“无障碍/国际化基线测试”自动化门禁'
    - '**典型例子**'
    - '- 某集团《微前端接入白皮书 v2.0》：规定子应用必须导出标准生命周期、禁止使用 `document.write`、强制使用基座提供的 `request`/`router`/`i18n`
      实例'
    - '- 基座 `@corp/micro-app-shell` 发布为 npm 包，子应用通过 `peerDependencies` 依赖，基座升级只需发版，子应用按需升级适配'
    - '**边界条件**'
    - '- 过度治理扼杀创新：禁止子应用尝试新技术栈（如引入 Solid/Qwik），建议设立“创新沙箱”通道，放宽部分规范但限制流量入口'
    - '- 遗留系统接入成本高：老旧 jQuery/Backbone 应用改造生命周期、适配沙箱 ROI 极低，建议“封装为 iframe 子应用”或“重写替代”而非强行接入'
    - '- 跨团队协作成本：规范制定需架构委员会牵头、多方博弈，执行依赖 CI/CD 管道强制，缺乏强制力的规范等于废纸'
