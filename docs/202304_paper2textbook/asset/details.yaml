  life_analogy:
  - 想象注意力机制是一个**大型学术会议的“提问-发言”环节**：
  - '- **Query** = 你手里的**问题卡片**（想知道什么）'
  - '- **Key** = 每位发言者桌牌上的**研究主题标签**（提供什么线索）'
  - '- **Value** = 每位发言者手中的**完整论文/观点**（实际信息内容）'
  - '- **相似度 (Q·K^T)** = 你用问题卡片去匹配每个桌牌，算出**“这位发言与我问题的相关度”**'
  - '- **缩放因子 1/√d_k** = 会议规模太大(d_k大)时，相关度分数会虚高，**除以√d_k相当于“校准音量”**，防止后续决策失真'
  - '- **Softmax** = 你根据相关度，**把有限的提问时间按比例分配给最相关的几位发言者**'
  - '- **加权求和 (×V)** = 你综合这些发言者的核心观点，**形成你对该问题的最终理解（输出向量）**'
  - ''
  - '**多头注意力** = 邀请 **h 个不同领域的“副主席”并行主持分会场**：'
  - '- 副主席 A 专门关注**方法论细节**（句法结构）'
  - '- 副主席 B 专门关注**实验结论引用**（共指消解）'
  - '- 副主席 C 专门关注**论文章节顺序**（位置信息）'
  - '- 最后**大主席拼接所有副主席的会议纪要**，形成全面决议'
  - ''
  - '**位置编码** = 给原本**无序的会议资料包**加上**页码/章节号**：'
  - '- **正弦编码** = 印好的**标准页码**，没上过会也能推算出前后顺序，甚至能猜出第 1000 页大概在哪（外推）'
  - '- **可学习编码** = 组委会针对本次会议**定制的专属页码**，非常好用但印刷成本高、超出印刷页数就失效（长度受限）'
  - '- **RoPE** = 不印页码，而是给每页**装一个“旋转罗盘”**，比较两页相对角度就知道远近，且页数无限都能用（相对位置、强外推）'
  - '- **ALiBi** = 直接规定**“离得远的发言者音量自动减小”**（注意力分数加负偏置），最省事、外推最强'
  - ''
  - '**注意力可视化** = 给会议全程装**“眼动仪”记录主席看谁的时间**：'
  - '- 发现主席看发言者时，**目光轨迹自动形成了该领域的“知识依存树”**（句法诱导）'
  - '- 但**“看得久 ≠ 决策关键”**（注意力≠解释），主席可能盯着水喝半天（高注意力 Padding），决策却靠那一句核心论据（低注意力关键 Token）'
  summary:
  - concept: Query/Key/Value
    desc: 注意力机制的三个基本角色：提问者(Q)、标签(K)、内容(V)，实现动态信息检索与聚合
  - concept: 缩放因子 √d_k
    desc: 防止点积方差随维度增大导致 Softmax 梯度消失，稳定训练
  - concept: 多头注意力
    desc: 将 Q/K/V 投影到 h 个子空间并行计算再拼接，实现句法、语义、位置等异构关系的多视角建模
  - concept: 自注意力
    desc: Q、K、V 来自同一序列，捕捉序列内部 Token 间的动态依赖关系
  - concept: 交叉注意力
    desc: Q 来自解码端，K/V 来自编码端，建模源-目标序列的对齐与信息传递
  - concept: 正弦绝对位置编码
    desc: 利用三角函数线性组合性质编码绝对位置，无参数、支持任意长度外推
  - concept: 可学习绝对位置编码
    desc: 位置嵌入表随模型训练更新，适应性强但难以外推至训练长度之外
  - concept: RoPE (旋转位置编码)
    desc: 通过旋转矩阵作用于 Q/K 将绝对位置转化为相对位置偏置，兼容线性注意力，长上下文主流方案
  - concept: ALiBi
    desc: 在注意力分数直接加入与距离成正比的负偏置，零参数、强外推性、无需位置嵌入
  - concept: 注意力可视化模式
    desc: 对角线(自关注)、垂直条纹(特殊Token汇聚)、语法树(句法依存)、共指链(长程语义)，揭示模型软对齐行为
  - concept: 注意力≠解释
    desc: 注意力权重反映软对齐分布，不等于特征重要性或因果贡献，高权重可能是捷径统计而非决策依据
  - concept: 标准注意力复杂度
    desc: 时间/空间复杂度 O(N^2·d)，序列长度 N 过长导致显存爆炸，需 FlashAttention/稀疏/线性注意力优化
  exercises:
  - 'no': 1
    title: 手算一次缩放点积注意力
    contents:
    - 给定单头注意力输入：
    - Q = [[1, 0], [0, 1]]  (2 个查询，维度 d_k=2)
    - K = [[1, 0], [0, 1], [1, 1]]  (3 个键，维度 d_k=2)
    - V = [[1, 2], [3, 4], [5, 6]]  (3 个值，维度 d_v=2)
    - ''
    - 请按步骤计算：
    - 1. 计算原始注意力分数矩阵 S = Q K^T (形状 2×3)
    - 2. 缩放：S' = S / √d_k (d_k=2)
    - 3. 对 S' 每行做 Softmax 得到注意力权重 A (形状 2×3)
    - 4. 计算最终输出 O = A V (形状 2×2)
    - ''
    - 思考题：
    - '- 若 d_k 从 2 增大到 100，且 Q、K 元素均值为 0、方差为 1，S 的数量级会发生什么变化？Softmax 会趋向什么分布（One-hot
      还是 Uniform）？'
    - '- 为什么除以 √d_k 而不是除以 d_k？提示：考虑方差的传播。'
    - '- 若去掉 Softmax 直接用线性归一化 (S'' / sum(S''))，会有什么问题？'
  - 'no': 2
    title: 多头注意力参数量与维度权衡分析
    contents:
    - 假设模型维度 d_model = 512，头数 h = 8，每头维度 d_k = d_v = 64。
    - ''
    - 1. 计算多头注意力模块的总参数量（包含 Q/K/V/O 四组投影矩阵，忽略偏置）。
    - 2. 若将头数增加到 h=16，保持 d_model 不变，每头维度变为 32。总参数量会变化吗？单头表达能力会如何变化？
    - 3. 若将头数减少到 h=4，每头维度变为 128。此时单头更强，但为什么可能导致“子空间分工”效果变差？
    - 4. 结合“冗余头”现象，如果在推理阶段剪掉 25% 权重最小的头，近似节省多少注意力计算量？精度会必然下降吗？
  - 'no': 3
    title: 位置编码外推性能实验设计
    contents:
    - 设计一个最小化实验，对比正弦绝对编码、可学习绝对编码、RoPE 在长度外推上的表现。
    - ''
    - 实验设置：
    - '- 任务：复制任务。输入：[BOS, x1, x2, ..., xN, SEP]，目标输出：[x1, x2, ..., xN, EOS]。序列由 10
      个唯一 Token 随机组合。'
    - '- 模型：2 层 Transformer Encoder-Decoder，d_model=128, h=4。'
    - '- 训练长度：N=32 (总长 ~64)。'
    - '- 测试长度：N=32 (ID)、N=64、N=128 (OOD 外推)。'
    - '- 三组实验仅位置编码不同，其余超参一致。'
    - ''
    - 请回答：
    - 1. 预测三种编码在 N=128 时的准确率排名（高→低）并解释原因。
    - 2. 可学习编码在 N=128 时会报什么错？如何修复（不重新训练）？
    - 3. RoPE 在极长序列 (N>4096) 下高频旋转会导致什么数值问题？YaRN 是如何通过“频率缩放”缓解的？
    - 4. 如果任务改为“输出序列第一个 Token”，哪种编码最有优势？为什么？
  - 'no': 4
    title: 注意力可视化解读与陷阱规避
    contents:
    - 给定一个 2 层 4 头的小型 BERT 模型，在句子 “The animal didn't cross the street because it was
      too tired” 上的注意力热力图 (Layer 1, Head 3) 显示：
    - '- 当 Query 为 “it” 时，Key “animal” 与 “street” 的注意力权重分别为 0.45 和 0.40，其余 0.15。'
    - '- 当 Query 为 “cross” 时，Key “street” 权重 0.60，Key “animal” 权重 0.20。'
    - ''
    - 请分析：
    - 1. Head 3 在 “it” 位置的注意力模式提示了什么语言学现象？这是否证明模型完成了共指消解？
    - 2. 设计一个**干预实验**（如注意力遮蔽/替换/梯度归因）来验证 “it”→“animal” 的注意力是否对预测 “tired” 的主语一致性有**因果贡献**。
    - 3. 为什么不能直接断言 “注意力权重 0.45 说明 animal 对 it 的贡献度是 45%”？请从“注意力是分布而非归因”、“残差连接路径”、“MLP
      混合”三个角度反驳。
    - 4. 如果在 Layer 0 Head 0 发现强烈的**对角线模式**，这通常意味着什么？这在分类任务的 [CLS] Token 上是好是坏？
  units:
  - 'no': 1
    name: 注意力机制 —— 让模型学会“看哪里”
    points:
    - '**为什么需要这个概念？**'
    - '- 传统 RNN 处理序列存在串行瓶颈，无法并行计算，训练速度慢'
    - '- RNN 隐状态容量固定，难以捕捉长距离依赖，信息随距离衰减'
    - '- 需要一种机制动态聚焦关键 Token，打破固定窗口限制'
    - '**核心定义**'
    - '- 注意力是一种将 Query 与 Key 计算相似度，再对 Value 加权求和的机制'
    - '- 缩放点积注意力公式：Attention(Q, K, V) = softmax(QK^T / √d_k) V'
    - '- Q(Query) 代表查询意图，K(Key) 代表键/被检索内容，V(Value) 代表值/实际信息'
    - '**关键性质**'
    - '- 并行计算：所有位置的注意力权重可同时计算，适合 GPU 加速'
    - '- 动态上下文：每个位置的输出是全局信息的加权和，权重随输入动态变化'
    - '- 缩放因子 √d_k 防止点积过大导致 Softmax 梯度消失（当 d_k 较大时）'
    - '- 排列等变性：输入顺序变，输出顺序相应变（需配合位置编码）'
    - '**典型例子**'
    - '- 机器翻译中，生成目标词时自动对齐到源语句中的关键词（如主谓宾对应）'
    - '- 代码补全时，模型自动“看向”几百行外定义的变量名或函数签名'
    - '**边界条件**'
    - '- 计算复杂度 O(N^2·d)，序列长度 N 过长时显存与算力呈平方级爆炸'
    - '- 标准注意力无感知位置顺序，必须显式注入位置编码'
    - '- 极长序列下 Key/Value 矩阵无法完全加载进显存，需引入稀疏/线性注意力变体'
