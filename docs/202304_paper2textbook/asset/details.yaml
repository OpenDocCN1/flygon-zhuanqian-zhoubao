    name: Vitest 核心实战 —— 原生 ESM 下的极速测试运行器
    points:
    - '**为什么需要这个概念？**'
    - '- Jest 基于 CommonJS，对 ESM/Vite/TypeScript 原生支持弱，配置复杂、启动慢'
    - '- 前端项目已标准化 Vite + ESM + TS，需要零配置复用 Vite 配置、插件、转换管线的测试工具'
    - '- 需要与现代前端工程链（HMR、类型检查、覆盖率）无缝融合'
    - '**核心定义**'
    - '- Vitest：基于 Vite 的下一代测试框架，API 兼容 Jest，原生支持 ESM、TypeScript、Vite 插件生态'
    - '- 核心命令：`vitest run`（CI模式）、`vitest --watch`（开发模式）、`vitest --coverage`（覆盖率）'
    - '**关键性质**'
    - '- 配置复用：直接读取 `vite.config.ts`，别名、环境变量、CSS/资源处理、插件零差异复用'
    - '- 并行运行：基于 Worker 多进程并行执行测试文件，利用 Vite 模块图实现智能依赖预构建'
    - '- 即时反馈：监听模式下仅重跑受影响测试，配合 HMR 实现毫秒级反馈循环'
    - '- Mock 能力：`vi.mock()`/`vi.spyOn()`/`vi.fn()` 完全兼容 Jest API，支持模块级、函数级、定时器 Mock'
    - '**典型例子**'
    - '- `vi.mock(''axios'')` 拦截网络请求返回 Promise.resolve({ data: [...] })'
    - '- `vi.useFakeTimers()` 控制 `setTimeout`/`setInterval` 验证防抖节流逻辑'
    - '- `expect(x).toMatchSnapshot()` 快照测试组件渲染输出，CI 中 `--update` 更新基准'
    - '- `vi.hoisted` 解决 `vi.mock` 声明提前导致变量未定义的顶层作用域问题'
    - '**边界条件**'
    - '- `vi.mock` 必须在顶层调用，不能在 `describe`/`it` 内部动态调用'
    - '- ESM 环境下 Mock 静态导出需用 `vi.mock(..., { virtual: true })` 或重新导入'
    - '- 覆盖率阈值 `coverage.threshold` 建议在 CI 中设为 `branches: 80, functions: 80, lines:
      80, statements: 80` 阻断合并'
    - '- 全局变量污染：需在 `afterEach` 中 `vi.restoreAllMocks()`、`vi.useRealTimers()` 重置状态'
    sources:
    - paper: 20230418_039.md
      role: origin
    - paper: 20230418_037.md
      role: improve
    excerpts:
    - 演示 `vi.mock`/`vi.spyOn` 模拟依赖、`--watch` 热更新测试、`coverage` 配置阈值阻断流水线。
    - Vitest 核心实战：API 兼容 Jest、原生 ESM 支持、并行运行与快照测试
    - 全自动真批量 ChatGPT 超级写手机器人验证了 RPA+AI 批量内容生产的工程可行性
  - 'no': 3
    name: Vue 组件测试范式 —— Vue Test Utils 的挂载策略与交互断言
    points:
    - '**为什么需要这个概念？**'
    - '- 组件包含模板渲染、响应式状态、生命周期、事件触发、插槽分发，单纯逻辑测试无法覆盖'
    - '- 需要专门的工具在 JSDOM/happy-dom 中真实渲染组件，验证 DOM 结构、CSS 类、用户交互反馈'
    - '- 必须处理 Vue 3 特有的 `ref`/`reactive` 解包、组合式 API、`<Suspense>`、`<Teleport>` 等特性'
    - '**核心定义**'
    - '- Vue Test Utils (VTU) 官方测试工具库，提供 `mount`（全量渲染含子组件）与 `shallowMount`（浅渲染存根子组件）'
    - '- 核心 API：`find`/`findAll`/`findComponent` 选择器、`trigger` 事件触发、`setValue` 表单输入、`vm`
      访问组件实例'
    - '**关键性质**'
    - '- 挂载选项：`global.stubs` 存根全局组件（RouterLink、FontAwesome）、`global.plugins` 注入 Pinia/Router、`attachTo`
      挂载真实 DOM'
    - '- 响应式解包：`wrapper.vm.count` 自动解包 `ref`，`wrapper.vm.state` 访问 `reactive` 对象，断言时需注意响应式代理'
    - '- 事件测试：`await wrapper.find(''button'').trigger(''click'')` 必须 `await` 等待 nextTick
      后再断言 DOM 更新'
    - '- 插槽测试：`slots: { default: ''内容'', header: HeaderComp }` 验证分发内容正确渲染'
    - '**典型例子**'
    - '- 浅渲染 `ProTable`：`shallowMount(ProTable, { props: { columns, data }, global:
      { stubs: { ElTable: true } } })` 验证 props 透传'
    - '- 全量渲染表单：`mount(LoginForm, { global: { plugins: [pinia, router] } })` → `setValue`
      输入 → `trigger(''submit'')` → 断言 `router.push` 被调用'
    - '- 组件通信：父组件 `mount(Parent)` → `findComponent(Child)` → `vm.$emit(''custom'')`
      → 断言父组件处理函数被调用'
    - '**边界条件**'
    - '- 优先 `shallowMount` 单测组件内部逻辑（隔离子组件实现细节），集成测试用 `mount`'
    - '- 含 `<Suspense>`/`<Teleport>` 组件必须用 `mount` 且 `attachTo: document.body` 避免
      JSDOM 找不到容器报错'
    - '- 避免测试私有方法/内部状态，聚焦 Props/Events/Slots/公开方法/渲染输出（黑盒视角）'
    - '- `flushPromises` 处理异步组件/异步 Setup：`await flushPromises()` 后再断言异步渲染结果'
    sources:
    - paper: 20230418_039.md
      role: origin
    - paper: 20230418_124.md
      role: improve
    excerpts:
    - 对比 `shallowMount` 与 `mount`、处理 `ref`/`reactive` 解包断言、`trigger`/`findComponent`
      交互测试、插槽内容验证。
    - Vue 组件测试范式：Vue Test Utils 挂载选项、响应式解包、事件触发与槽位测试
    - GPT 调教‘教师-天才童工’模型验证了分块喂养、正向强化、Prompt库沉淀的方法论有效性
