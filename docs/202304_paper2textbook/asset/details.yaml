    - '- 可测量即可优化：指标驱动参数调优(分块大小/Top-K/重排序模型/提示词)、合成数据加速实验周期'
    - '- 从固定流程到自主决策：Agent 根据任务动态选择检索时机/策略/验证方式，突破静态管线局限'
