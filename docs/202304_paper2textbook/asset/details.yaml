      role: improve
    excerpts:
    - 解读 Chrome UX Report 真实用户数据，制定“LCP < 2.5s、CLS < 0.1、INP < 200ms”工程化达标标准。
    - 轻量 SDK 设计：`PerformanceObserver` 监听 LCP/CLS/FID/INP、Resource Timing API 采集资源耗时、Long
      Task API 识别阻塞、`navigator.sendBeacon` 可靠上报。
  - 'no': 2
    name: 构建产物优化 —— 瘦身与分包的“手术刀”
    points:
    - '**为什么需要这个概念？**'
    - '- 现代前端应用体积膨胀严重，首屏加载 JS 体积动辄 MB 级，直接拖慢 LCP 和 INP'
    - '- 浏览器下载、解析、编译 JS 的成本随体积超线性增长，必须通过分包、摇树、压缩从源头减负'
    - '**核心定义**'
    - '- **代码分割**：将打包产物拆分为多个 Chunk，按需/并行加载，核心配置 `splitChunks`、`manualChunks`'
    - '- **Tree Shaking**：基于 ES Module 静态结构，消除未被引用的“死代码”，依赖 `sideEffects: false` 标记纯模块'
    - '- **压缩算法**：Terser (JS)、esbuild (Go 实现，极快)、CSSnano (CSS)，移除空白、压缩变量名、死代码消除'
    - '- **体积预算**：在 CI 中设定阈值（如 `rollup-plugin-visualizer` + `bundlesize`），超标阻断合并'
    - '**关键性质**'
    - '- **分包粒度权衡**：过细增加 HTTP 请求数（HTTP/1.1 下）或压缩率下降；过粗失去按需加载优势，建议按“路由/组件库/高频依赖”分'
    - '- **副作用标记陷阱**：`package.json` 中 `sideEffects: false` 若误标，会导致有副作用的模块（如 CSS import、polyfill
      注入）被误删'
    - '- **动态导入 `import()`**：是路由级懒加载、组件级懒加载的语法基础，返回 Promise，配合 `Suspense` 实现降级'
    - '**典型例子**'
    - '- 使用 `rollup-plugin-visualizer` 发现 `lodash` 全量引入占 70KB，改用 `lodash-es` + Tree
      Shaking 或 `babel-plugin-lodash` 仅保留用到的函数'
    - '- 将 `moment.js` (67KB) 替换为 `dayjs` (2KB) 或 `date-fns` (按需引入)，大幅减小体积'
    - '- 配置 `manualChunks` 将 `vue`、`vue-router`、`pinia` 打包为 `vendor-[hash].js`，利用长缓存复用'
    - '**边界条件**'
    - '- Tree Shaking 仅对 ES Modules 生效，CommonJS 模块无法静态分析，需配合 `@rollup/plugin-commonjs`
      转换'
    - '- 过度分包在弱网/HTTP/2 多路复用饱和时可能增加调度开销，需结合网络面板分析'
    - '- 压缩阶段的 `terser` 单线程慢，大型项目建议改用 `esbuild` 压缩或开启并行压缩'
    sources:
    - paper: 20230418_041.md
      role: origin
    excerpts:
    - 深入 Rollup/Vite 分包配置、`sideEffects` 标记、`terser`/`esbuild` 压缩选项、`rollup-plugin-visualizer`
      体积分析与 CI 门禁。
  - 'no': 3
    name: 资源加载策略 —— 浏览器与服务端的“接力赛”
    points:
    - '**为什么需要这个概念？**'
    - '- 浏览器默认加载策略并非最优：阻塞渲染、优先级错误、重复下载，需开发者显式指导浏览器“什么时候加载什么”'
    - '- 网络延迟（RTT）往往比带宽更影响首屏，需利用预连接、预加载抢跑关键资源'
    - '**核心定义**'
    - '- **Preload (`rel=preload`)**：强制浏览器高优先级下载当前页面必需资源（字体、关键 CSS/JS、Hero 图），不延迟
      `onload`'
    - '- **Prefetch (`rel=prefetch`)**：低优先级预取下一页可能需要的资源，利用空闲带宽，存入 HTTP 缓存'
    - '- **Preconnect / DNS-prefetch**：提前建立跨域连接（DNS+TCP+TLS），消除后续请求的握手延迟'
    - '- **Modulepreload**：专为 JS 模块设计，预加载并预编译依赖图，解决模块嵌套请求瀑布流问题'
    - '- **Service Worker (SW) / Workbox**：拦截请求实现离线缓存、Stale-While-Revalidate 策略、版本更新广播'
    - '**关键性质**'
    - '- **优先级博弈**：Preload 过多会挤占关键资源带宽，需仅限“首屏关键路径”资源；Prefetch 仅在 `navigator.connection.saveData`
      为 false 且非弱网时执行'
    - '- **HTTP/2 多路复用**：单连接并行传输，消除队头阻塞，但服务端推送因缓存感知缺失已被废弃，客户端 Preload 替代'
    - '- **SW 生命周期**：`install` -> `activate` -> `fetch`，需处理 `skipWaiting`/`clients.claim`
      实现无刷新更新'
    - '**典型例子**'
    - '- 字体文件 `woff2` 添加 `<link rel=preload as=font crossorigin>`，消除字体闪烁 (FOIT/FOUT)
      并提升 LCP'
    - '- 登录后预取 `dashboard` 路由 JS Chunk：`<link rel=prefetch href=/js/dashboard.[hash].js>`，实现“秒开”体验'
    - '- Workbox 配置 `runtimeCaching`：API 走 NetworkFirst，静态资源走 CacheFirst，HTML 走 StaleWhileRevalidate'
    - '**边界条件**'
    - '- Preload 资源若 3 秒内未使用，Chrome 控制台会黄色警告，需精准控制预加载范围'
    - '- SW 无法缓存非 GET 请求、跨域无 CORS 头的不透明响应、以及 `no-store` 头的响应'
    - '- `modulepreload` 需浏览器支持（现代浏览器均支持），旧版浏览器需回退到 `preload as=script`'
    sources:
