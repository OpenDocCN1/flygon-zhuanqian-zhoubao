    excerpts:
    - 实战 `<link rel=preload>` 关键资源、`rel=modulepreload` JS 模块、Workbox 生成 SW 实现离线首屏与版本更新广播。
  - 'no': 4
    name: 运行时渲染优化 —— 主线程的“减负运动”
    points:
    - '**为什么需要这个概念？**'
    - '- JS 单线程模型决定主线程是稀缺资源，长任务阻塞渲染与交互，直接导致掉帧、卡顿、INP 恶化'
    - '- 复杂业务（大列表、实时计算、重绘）若不卸载主线程，无法通过堆砌算力解决体验问题'
    - '**核心定义**'
    - '- **虚拟列表**：仅渲染可视区 + 缓冲区 DOM，滚动时复用节点、更新数据，支撑 10 万+ 条数据流畅滚动'
    - '- **防抖/节流**：高频事件（resize、scroll、input）的回调频率控制，减少不必要的计算与渲染触发'
    - '- **Web Worker**：独立线程运行 JS，可执行加密、压缩、解析、矩阵运算等纯计算任务，通过 `postMessage` 通信'
    - '- **`requestIdleCallback` / `scheduler.yield()`**：在浏览器空闲期或主动让出控制权，拆解长任务，避免阻塞高优先级工作'
    - '**关键性质**'
    - '- **DOM 访问限制**：Worker 无法访问 DOM、window、localStorage，仅适合无副作用的计算密集型任务'
    - '- **虚拟列表实现难点**：动态行高计算、滚动定位跳转、SSR 首屏数据同步、横向虚拟化'
    - '- **调度优先级**：React 18 `useTransition` 标记低优先级更新、`scheduler.yield()` 让出主线程，配合
      `isInputPending` 响应用户输入'
    - '**典型例子**'
    - '- 万行表格渲染：从 10s 白屏降至 50ms 首屏，内存从 200MB 降至 20MB (react-window / @tanstack/virtual)'
    - '- 图片编辑器：将滤镜计算、Base64 编解码移至 Worker，主线程仅负责 Canvas 绘制，INP 从 800ms 降至 50ms'
    - '- 复杂表单联动校验：使用 `useDeferredValue` 延迟非紧急计算，保证输入框响应丝滑'
    - '**边界条件**'
    - '- Worker 启动有开销（~10-50ms），频繁创建销毁得不偿失，建议池化复用或常驻'
    - '- `requestIdleCallback` 在后台标签页可能不触发，关键逻辑不可依赖它，需配合 `setTimeout` 兜底'
    - '- 虚拟列表不适合“需全量 DOM 搜索/选中/打印”场景，需提供“全量渲染”降级开关'
    sources:
