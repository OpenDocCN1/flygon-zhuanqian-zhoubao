    name: Playwright E2E 实战 —— 多浏览器矩阵下的可靠交互自动化
    points:
    - '**为什么需要这个概念？**'
    - '- Cypress 仅支持 Chromium 系、难以处理多标签页/跨域/原生对话框/下载上传'
    - '- Selenium 维护成本高、定位器脆弱、无原生等待机制导致大量显式睡眠'
    - '- 需要原生支持所有主流浏览器引擎、自动等待、强大定位器、网络拦截、视觉回归的现代 E2E 方案'
    - '**核心定义**'
    - '- Playwright：微软出品的跨浏览器（Chromium/Firefox/WebKit）E2E 测试框架，单进程多上下文隔离，支持 TypeScript
      原生'
    - '- 核心架构：`Playwright` → `Browser` → `BrowserContext`（隔离 Cookie/Storage） → `Page`（标签页）'
    - '**关键性质**'
    - '- 自动等待：`page.click(''button'')` 内置可操作性检查（可见、稳定、可接收事件），彻底消除 `waitForTimeout`'
    - '- 定位器：`page.getByRole(''button'', { name: ''提交'' })` / `page.getByTestId(''submit-btn'')`
      语义化、抗重构'
    - '- 网络拦截：`page.route(''**/api/**'', route => route.fulfill({ json: mockData }))`
      模拟后端异常/延迟/限流'
    - '- 多标签/弹窗：`context.waitForEvent(''page'')` 捕获新窗口、`page.on(''dialog'')` 处理 alert/confirm'
    - '- 视觉回归：`expect(await page.screenshot()).toMatchSnapshot(''baseline.png'', {
      threshold: 0.2 })` 像素级对比'
    - '**典型例子**'
    - '- Page Object 模式：封装 `LoginPage` 类暴露 `login(user, pwd)`、`gotoDashboard()`，测试用例仅调用业务动作'
    - '- 认证复用：`storageState` 保存登录态 → `context = await browser.newContext({ storageState:
      ''auth.json'' })` 跳过登录加速测试'
    - '- 文件上传：`page.setInputFiles(''input[type=file]'', ''test.pdf'')` + `page.waitForResponse(''**/upload'')`
      断言上传成功'
    - '- 离线/弱网模拟：`context.setOffline(true)` 或 `page.route(''**/*'', r => { await wait(500);
      r.continue() })`'
    - '**边界条件**'
    - '- 严禁在测试用例中写 CSS/XPath 选择器，强制推行 `getByRole`/`getByTestId`/`getByLabel` 语义定位'
    - '- CI 环境需安装系统依赖 `npx playwright install-deps`，Headless 模式需字体包支持中文截图'
    - '- 并行执行 `workers: 4` 时注意测试数据隔离（独立账号/数据库事务回滚/随机前缀）'
    - '- 视觉回归基线图需按 OS/浏览器/设备像素比分目录存储，避免跨环境误报'
    sources:
    - paper: 20230418_039.md
      role: origin
    - paper: 20230418_132.md
      role: improve
    excerpts:
    - 构建可维护的 Page Object 层、使用 `page.route` 模拟后端异常/延迟、引入 `pixelmatch` 实现截图像素级对比。
    - Playwright E2E 实战：多浏览器矩阵、Page Object 模式、网络拦截与视觉回归
    - 视频号直播冷启动‘双计划投流+长时长拉权重’及‘找熊猫’灰产战术必死无疑的实战教训
  - 'no': 5
    name: CI/CD 质量红线自动化 —— 从代码提交到生产部署的自动化质量闸
    points:
    - '**为什么需要这个概念？**'
    - '- 本地跑通 ≠ 线上可用：环境差异、依赖版本漂移、并发冲突、配置缺失'
    - '- 人工审核不可靠：漏跑测试、忽略警告、主观放行、无审计追溯'
    - '- 需要一条强制执行、快速反馈、可视化报告、失败阻断的自动化流水线守住质量底线'
    - '**核心定义**'
    - '- GitHub Actions / GitLab CI / Jenkins 定义的标准化流水线：`lint` → `typecheck` → `test:unit`
      → `build` → `test:e2e` → `deploy`'
    - '- 质量红线：任意阶段失败即阻断合并/部署，覆盖率不达标、Lint 报错、类型错误、E2E 闪断均视为红线'
    - '**关键性质**'
    - '- 缓存加速：`actions/cache` 缓存 `node_modules`、`~/.npm`、Playwright 浏览器、Vitest 覆盖率中间产物，冷启动
      < 2min'
    - '- 矩阵策略：`matrix: { node: [18, 20], os: [ubuntu-latest, windows-latest] }` 兼容性守夜'
    - '- 制品产出：`actions/upload-artifact` 上传构建产物、覆盖率报告、E2E 视频/截图/Trace、Playwright HTML
      报告'
    - '- 失败通知：`if: failure()` 步骤发送钉钉/飞书/Slack 卡片，附带失败 Job 链接、错误日志摘要、提交者 @'
    - '- 徽章展示：README 动态徽章显示 `build status`、`coverage %`、`e2e pass rate`、最新版本号'
    - '**典型例子**'
    - '- `.github/workflows/ci.yml`：PR 提交触发 → `pnpm lint && pnpm typecheck && pnpm
      test:unit --coverage` → 上传 coverage → `pnpm build` → `pnpm test:e2e` → 上传报告'
    - '- 覆盖率门禁：`vitest --coverage --coverage.threshold.lines=80` 直接返回非零退出码阻断 Job'
