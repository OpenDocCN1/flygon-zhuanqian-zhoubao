    name: 普通人抖音变现正向循环 —— 以‘不讨厌’为火种，借平台杠杆燎原
    points:
    - 核心重构：普通人 = 不知道擅长什么、会的身边人也会、没有特别热爱的事
    - 天分火种：不讨厌/不厌其烦 = 相对他人的微小耐受优势，比‘热爱’更易寻找、更可持续
    - 平台杠杆：抖音作为放大器，通过‘边学边教’公开输出，强制成长、获取反馈、积累资产
    - 正向循环飞轮：越学越会 → 越会越喜欢 → 越喜欢越擅长 → 越擅长越受欢迎 → 越受欢迎越赚钱 → 越赚钱越愿意去学
    - 差异化定位法：横向对比识别‘他人讨厌/自己不厌’的相对优势赛道
    - 适用场景图谱：程序员/大学生/宝妈/老板/打工人/运营/实体店主/餐饮从业者八大典型切入点
    sources:
