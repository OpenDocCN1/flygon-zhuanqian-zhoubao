    - 1. 角色设定 Prompt 库构建：为6大场景（选品定位、Listing撰写、邮件营销、SEO引流、站外推广、品牌建设）编写结构化 System Prompt，包含角色定义、输入变量槽位、输出格式约束、合规红线。
    - 2. 结构化邮件生成工具原型：开发简单 Web 界面，输入『邮件类型/目标受众/产品卖点/营销钩子』，调用 API 一键生成符合 EDM 最佳实践的完整邮件正文（含主题、钩子、利益点、行动号召、售后保障）。
    - 3. SEO 文章扩写与组装流水线：实现『生成大纲 -> 追加细节（如购买理由） -> 人工串联组装 -> 插入链接 -> 批量发布』的分步骤协作模式，规避长文截断风险。
    - 4. 品牌本土化命名生成器：输入『品牌核心价值/目标人群/禁用词』，输出 10 组符合西方文化语境、通过商标初筛的品牌名及品牌故事。
    - 5. 数据分析助手雏形：上传店铺后台导出 CSV，通过 ChatGPT Code Interpreter 能力生成『商品分析、Listing优化建议、评论分析、客户人群分析、关键词分析』报告。
    - 6. 封装为 AIPRM 风格的浏览器插件/网页应用：将上述 Prompt 库与工具封装为『表单填写 -> 一键生成』的低代码产品，部署供团队内测。
    - 思考题：
    - '- 如何设计 Prompt 版本管理与 A/B 测试机制，持续优化生成质量？'
    - '- 跨境电商数据隐私合规（GDPR/CCPA）下，如何处理上传至 OpenAI 的敏感业务数据？'
    - '- 从『工具辅助』进阶到『Agent 自主决策』，需补充哪些能力模块（如 RAG/Function Calling/记忆）？'
