  life_analogy:
  - 想象前端架构治理是一场**大型城市的“城市规划与建设”系统工程**：
  - '- **ADR（架构决策记录）** = **“土地批文与建筑档案”**：每一块地（技术决策）为何批给谁、盖什么楼、替代方案是什么、后果如何，都有法可查、有据可溯，一旦盖好（通过）不可随意拆改，变更需新批文（新ADR）并标注旧档案作废。'
  - '- **技术雷达** = **“城市总体规划图（动态版）”**：将所有建筑材料、工艺、设备（技术项）标注在“推广使用/试点推广/谨慎评估/禁止使用”四个区域，每季度召开规划局会议（雷达会议）根据实测数据调整分区，新入职建筑师（新人）拿到图纸就知哪里能盖、哪里不能盖。'
  - '- **架构演进路线图** = **“三年滚动建设计划”**：不是死板的施工进度表（甘特图），而是分“近期精确到楼栋、中期定区域功能、远期定城市轮廓”三层，明确标注“地铁先通后盖楼”（跨团队依赖）和“每年拨款修缮老旧小区”（技术债务预算），并与考核指标（OKR）挂钩。'
  - '- **RFC（架构评审机制）** = **“重大项目立项评审会”**：想拆迁盖高楼（架构级重构）？必须提交立项书（RFC文档），经规划、消防、环保、财政多部门联审（评审委员会），用评分卡（决策矩阵）打分，盖完楼还得住满三年回访（事后复盘），看看是不是烂尾楼。'
  - '- **架构治理委员会** = **“城市规划委员会办公室”**：不是开会的“谈话室”，而是有编制、有权力、有预算、有KPI的实体机构。定期发布《城市建设白皮书》（季度运营报告）：批了多少地、调整了多少规划、完成了多少地铁、修缮了多少老房子、市民满意度多少，数据全公开，没完成的必须写整改方案。'
  - 就像城市建设需要“档案留痕、规划导向、计划推进、评审把关、专职运营”五位一体，前端架构治理也需要 ADR、雷达、路线图、RFC、委员会五大支柱协同，才能避免“拆东墙补西墙”的混乱演进。
