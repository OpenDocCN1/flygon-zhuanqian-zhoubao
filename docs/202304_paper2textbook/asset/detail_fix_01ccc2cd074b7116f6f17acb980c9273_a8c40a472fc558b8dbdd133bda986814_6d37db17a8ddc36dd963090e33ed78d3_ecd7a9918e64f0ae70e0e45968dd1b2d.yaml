    筛选高潜力类目，结合单品数据验证。
  - 2. 内容为核心：针对目标类目，拆解竞品爆款笔记结构（封面/标题/正文/互动引导），建立垂类专属内容模板（如美妆『知识+实测+推荐』、健身『引言+动作拆解+装备/饮食+号召』）。
  - 3. 单品二次处理：对采集的商品素材执行标准化重构流程——主图去水印/重构、详情页差异化改写、SKU属性规范化、资质合规自查，建立『单品SOP』文档。
  - 4. 合规风控前置：梳理平台违规红线（虚假宣传/资质缺失/售后纠纷），配置敏感词库拦截、发布前自查清单、售后响应SLA，建立『合规台账』。
  - 4. AI辅助创作：使用ChatGPT按垂类模板生成笔记初稿，人工注入真实体验、避坑指南、Emoji排版，实现『AI生成+人工润色+风格化』协作模式。
  - 5. 多店矩阵起号：注册3个店铺账号，分别测试同类产品不同笔记玩法（种草/测评/避雷）或覆盖不同子类目，记录数据对比，复制最优模型放大。
  - 思考题：
  - '- 如何判断一个类目已进入『内容电商』成熟期而非『红利期』？请给出3个定量指标。'
