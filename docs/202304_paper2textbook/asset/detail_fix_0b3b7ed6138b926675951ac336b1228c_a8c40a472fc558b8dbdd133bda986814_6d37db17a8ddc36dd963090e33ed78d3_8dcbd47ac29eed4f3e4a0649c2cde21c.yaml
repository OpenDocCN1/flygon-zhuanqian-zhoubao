- │   │   ├── flex 增长/收缩/基准尺寸
- │   │   └── 多行换行与 align-content
- │   ├── Grid 二维布局  —— P001
- │   │   ├── 显式/隐式网格轨道
- │   │   ├── grid-template-areas 语义化布局
- │   │   ├── 自动放置算法（稀疏/稠密）
- │   │   └── 盒对齐模块统一规范
