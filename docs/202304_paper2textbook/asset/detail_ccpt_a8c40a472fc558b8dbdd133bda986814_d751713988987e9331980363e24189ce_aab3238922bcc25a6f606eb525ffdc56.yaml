units:
- 'no': 1
  name: Wasm 核心概念 —— 给浏览器装上“高性能虚拟机”
  points:
  - '**为什么需要这个概念？**'
  - '- JavaScript 单线程、解释执行、动态类型导致计算密集型任务（图像处理、加密、物理模拟）性能瓶颈明显'
  - '- 需要一种能在浏览器安全沙箱内运行、接近原生速度、支持多语言复用的二进制格式'
  - '- 传统插件或 Native 模块破坏了 Web 的跨平台、免安装、安全分发优势'
  - '**核心定义**'
  - '- WebAssembly (Wasm) 是一种基于栈式虚拟机的低级字节码格式，设计为紧凑、快速加载、可流式编译'
  - '- 核心抽象：Module（模块，编译单元）、Memory（线性内存，字节数组）、Table（函数引用表）、Instance（实例化后的模块+状态）'
  - '- 采用结构化控制流（Block/Loop/If），强制类型检查，保证验证通过即内存安全'
  - '**关键性质**'
  - '- 安全沙箱：线性内存与宿主隔离，无法直接访问 DOM/系统调用，需通过 Import/Export 与 JS 交互'
  - '- 确定性执行：无 GC、无异常（陷阱除外）、定长指令，便于形式化验证与 AOT 编译'
  - '- 可移植性：WASI (System Interface) 让同一模块可在浏览器、边缘计算、Serverless、嵌入式运行'
  - '**典型例子**'
  - '- Figma 将 C++ 渲染引擎编译为 Wasm，实现浏览器媲美原生的协同设计性能'
  - '- AutoCAD Web 复用数百万行 C++ 核心代码，零成本迁移桌面级 CAD 能力到浏览器'
  - '**边界条件**'
  - '- 无直接 DOM 访问权限，频繁 JS-Wasm 边界调用会抵消计算优势（需批量化/共享内存）'
  - '- 线性内存 32 位地址空间限制 4GB（Memory64 提案解决中），大内存场景需分块或迁移 64 位'
  - '- 缺乏原生 GC（GC 提案进行中），Rust/C++ 需自带内存管理，增加模块体积与心智负担'
  - '...'
  sources:
  - paper: AnkEdEtEtoXIbexWlQ3cL6zenFf.md
    role: origin
  excerpts:
  - Wasm 核心概念：模块、内存、表、导入导出、线性内存与安全沙箱模型
  - 建立 Wasm 二进制格式、指令集、栈式虚拟机、线性内存隔离、能力安全模型的基础认知
- 'no': 2
  name: 工具链实战 —— 从源代码到 .wasm 的“编译流水线”
  points:
  - '**为什么需要这个概念？**'
  - '- 浏览器只认识 .wasm 二进制，C/Rust/TS 等源码必须经过编译、链接、优化才能在 Web 运行'
  - '- 不同语言运行时差异大（GC、异常、线程模型），工具链需屏蔽差异生成标准 Wasm'
  - '- 生产环境极其敏感体积与启动速度，需专用优化工具链而非通用编译器默认输出'
  - '**核心定义**'
  - '- Emscripten (C/C++)：Clang/LLVM 前端 + Binaryen 后端，模拟 POSIX 环境（文件系统、pthread），输出
    .wasm + JS 胶水代码'
  - '- wasm-pack (Rust)：cargo 子命令，集成 wasm-bindgen 生成 TS 类型定义，零配置发布 npm 包'
  - '- AssemblyScript (TS-like)：TypeScript 子集直接编译 Wasm，无需 LLVM，前端开发者零门槛上手'
  - '**关键性质**'
  - '- 体积优化链：-Oz 优化 -> wasm-opt (Binaryen) 进一步 DCE/压缩 -> gzip/brotli 传输 -> 流式实例化'
  - '- 类型互操作：wasm-bindgen 实现 Rust 结构体 <-> JS Class 零拷贝映射，自动生成 .d.ts 实现类型安全'
  - '- 调试支持：wasm2wat 反汇编为 .wat 文本格式，配合 DWARF 源码映射在 DevTools 断点调试'
  - '**典型例子**'
  - '- 图像处理库：Rust 编写核心滤镜 -> wasm-pack -> npm 包 -> Vite 引入 -> Web Worker 运行 -> Canvas
    渲染'
  - '- 遗留 C++ 物理引擎：Emscripten 保留 pthread -> SharedArrayBuffer 多线程 -> 复用原有 CMake 构建系统'
  - '**边界条件**'
  - '- Emscripten 胶水代码体积大、JS 交互开销高，不适合极小模块；AssemblyScript 缺乏成熟生态库'
  - '- Rust 编译 Wasm 依赖 panic=abort、无标准库（no_std）配置，编译时间远超原生'
  - '- SIMD/多线程/GC 等后 MVP 特性需工具链与运行时双端支持，版本兼容性需锁定目标环境'
  - '...'
  sources:
  - paper: AnkEdEtEtoXIbexWlQ3cL6zenFf.md
    role: origin
  excerpts:
  - 工具链实战：Emscripten (C/C++)、wasm-pack (Rust)、AssemblyScript (TS-like) 编译与体积优化
  - 对比三大工具链适用场景、演示 `wasm-opt` 优化体积、`wasm2wat` 反汇编调试、TypeScript 类型定义自动生成
- 'no': 3
  name: JS-Wasm 互操作深度 —— 跨越“边境”的性能税与免税政策
  points:
  - '**为什么需要这个概念？**'
  - '- Wasm 无法直接操作 DOM/Web API，所有外部交互必须跨越 JS-Wasm 边界，调用开销极高'
  - '- 数据表示差异：JS 是 GC 管理的对象图，Wasm 是线性内存字节流，类型转换必然涉及拷贝/序列化'
  - '- 错误的交互模式（高频小数据传递）会让 Wasm 版本比纯 JS 更慢'
  - '**核心定义**'
  - '- 数值传递：i32/i64/f32/f64 寄存器直传，零开销（仅限标量）'
  - '- 字符串/对象传递：默认线性内存读写 + 指针/长度传递 + JS 侧 TextDecoder/Struct 解码，涉及拷贝'
  - '- 共享内存：SharedArrayBuffer + Atomics 让 Wasm 与 JS/Web Worker 共享同一线性内存实例，实现零拷贝数据共享'
  - '- 高级绑定：wasm-bindgen 实现 #[wasm_bindgen] 宏自动生成胶水代码，支持 struct/enum/closure/Box<[u8]>
    等复杂类型零/低拷贝传递'
  - '**关键性质**'
  - '- 边界调用成本：~50-100ns（V8），但频繁调用会破坏内联优化、污染 TurboFan 反馈向量'
  - '- 内存所有权：Wasm 线性内存可被 JS 增长，但无法收缩；共享内存需配合 COOP/COEP 响应头启用跨域隔离'
  - '- WebIDL Bindings 提案：浏览器原生支持 Wasm 直接调用 Web API（如 DOM、WebGPU），绕过 JS 中转层'
  - '**典型例子**'
  - '- 图像处理：JS 将 ImageData 像素缓冲区指针传给 Wasm，Wasm 直接在线性内存原地修改像素，零拷贝返回'
  - '- 加密库：wasm-bindgen 导出 Rust fn encrypt(input: &[u8]) -> Vec<u8>，JS 调用如同原生异步函数'
  - '**边界条件**'
  - '- 字符串传递建议用 UTF-8 指针+长度而非 UTF-16，避免双向转码开销'
  - '- 避免在热路径中频繁 new Uint8Array(memory.buffer) 创建视图，应缓存视图或使用指针算术'
  - '- SharedArrayBuffer 需部署 COOP: same-origin / COEP: require-corp 响应头，否则浏览器禁用'
  - '...'
  sources:
  - paper: AnkEdEtEtoXIbexWlQ3cL6zenFf.md
    role: origin
  excerpts:
  - JS-Wasm 互操作深度：数值/字符串/对象传递开销、共享内存、WebIDL Bindings 与 wasm-bindgen
  - 量化跨边界调用成本、利用 `SharedArrayBuffer` 共享线性内存、wasm-bindgen 实现高级类型零拷贝传递、避免频繁边界跨越
- 'no': 4
  name: 前沿提案与生产实践 —— Wasm 从“计算沙箱”进化为“通用运行时”
  points:
  - '**为什么需要这个概念？**'
  - '- MVP 版本仅支持基础数值类型、无 GC、无多线程、无异常处理，无法高效承载 Java/Go/Kotlin 等托管语言'
  - '- 计算密集型不足以覆盖完整应用逻辑，需解决组件组合、系统接口标准化、边缘部署等工程化缺口'
  - '- 新硬件能力（SIMD、GPU 计算）需标准指令集暴露而非厂商私有扩展'
  - '**核心定义**'
  - '- SIMD (v128)：128 位向量类型 + 100+ 指令，单指令多数据流加速图像/音频/ML 推理，主流浏览器已稳定'
  - '- 多线程：Wasm 线程 = Web Worker + SharedArrayBuffer + Atomics，支持 pthread 语义，实现真并行'
  - '- GC (WasmGC)：引入 struct/array 引用类型、栈扫描、精确 GC 接口，让托管语言无需自带运行时'
  - '- 组件模型：基于 Interface Types 定义语言无关的组件接口，支持跨语言链接、能力安全的组件组合'
  - '- WASI (WebAssembly System Interface)：标准化文件/网络/时钟/随机数等系统调用，实现“Write Once, Run
    Anywhere”'
  - '**关键性质**'
  - '- SIMD 需检测硬件支持回退标量，wasm-feature-detect 运行时特性探测'
  - '- 多线程受限于 COOP/COEP 部署要求，移动端 Safari 支持滞后'
  - '- 组件模型 + WASI 组成“云原生 Wasm”核心栈，Cloudflare Workers/Vercel Edge/Fastly Compute@Edge
    已生产可用'
  - '**典型例子**'
  - '- ffmpeg.wasm：SIMD 加速视频转码、多线程并行编码、WASI 访问文件系统，纯前端实现专业级视频编辑'
  - '- Python/Go/Ruby 在浏览器运行：WasmGC + 组件模型编译标准库，无需 Emscripten 模拟 POSIX'
  - '- 边缘中间件：Rust 编写 Wasm 模块 -> WASI 预览版 -> 部署 Cloudflare Workers，冷启动 < 1ms'
  - '**边界条件**'
  - '- WasmGC 仍在标准化后期，V8/SpiderMonkey 实验性支持，生产需谨慎评估兼容性'
  - '- 组件模型工具链生态尚早，跨语言调用约定、错误处理、版本演进最佳实践尚未沉淀'
  - '- WASI Preview 2 引入异步/流/资源模型，破坏 Preview 1 兼容，迁移成本高'
  - '...'
  sources:
  - paper: AnkEdEtEtoXIbexWlQ3cL6zenFf.md
    role: origin
  excerpts:
  - 前沿提案与生产实践：SIMD 向量化、多线程、GC、组件模型、WASI 与边缘计算
  - 追踪 Wasm GC 提案托管语言互操作、组件模型跨语言组合、WASI 预览版在 Cloudflare Workers/Vercel Edge 部署 Serverless
    Wasm
- 'no': 5
  name: 实战集成 —— 在前端项目中落地 Rust 高性能模块的标准化流程
  points:
  - '**为什么需要这个概念？**'
  - '- 理论知懂工具链、互操作、前沿提案，仍缺乏“从零到上线”的标准化工程范式'
  - '- 需解决：构建系统集成、类型安全跨语言调用、主线程阻塞规避、生产环境体积/缓存/更新策略'
  - '- 缺乏端到端基准对比，无法量化 Wasm 引入的真实 ROI（投入产出比）'
  - '**核心定义**'
  - '- 标准化流程：Rust 编写核心算法 -> wasm-pack build --target web -> 生成 pkg/ 目录 -> Vite/Rollup
    插件导入 -> TS 类型即用'
  - '- 运行时隔离：将 Wasm 实例化、计算密集任务放入 Web Worker（OffscreenCanvas/Transferable），主线程仅负责调度与渲染'
  - '- 性能基准：benchmark.js / wasm-bench 对比 JS 实现（如 canvas-filter vs rust-wasm-filter），指标：首帧延迟、吞吐率、内存峰值、包体积'
  - '**关键性质**'
  - '- Vite 插件 @wasm-tool/rollup-plugin-rust 自动化：cargo watch 监听 -> 增量编译 -> HMR 热更新
    Wasm 模块，开发体验接近原生 TS'
  - '- 版本发布：wasm-pack publish 自动发布 npm 包（含 .wasm、.js 胶水、.d.ts、package.json），语义化版本锁定'
  - '- 缓存策略：.wasm 静态资源长缓存 + import.meta.url 动态加载 + Service Worker 预缓存，实现离线首屏与秒级更新'
  - '**典型例子**'
  - '- Web 版 Photoshop 核心滤镜：Rust 实现高斯模糊/锐化/边缘检测 -> wasm-pack -> Vite + React -> Web
    Worker 处理 4K 图片 -> OffscreenCanvas 回传渲染'
  - '- 实测数据：Rust Wasm 版高斯模糊 4K 图耗时 45ms，纯 JS 实现 320ms，加速 7 倍；Wasm 模块 gzip 后 120KB'
  - '**边界条件**'
  - '- 首次加载需下载 .wasm + 实例化编译（~10-50ms），启动期体验需加载骨架屏或预加载关键模块'
  - '- Web Worker 无法直接访问 DOM/CanvasRenderingContext2D，必须用 OffscreenCanvas 或 postMessage
    传回主线程绘制'
  - '- Rust panic 会导致 Wasm Trap 终止整个 Worker，需 catch_unwind 或编写无 panic 代码，生产环境建议监控错误上报'
  - '...'
  sources:
  - paper: AnkEdEtEtoXIbexWlQ3cL6zenFf.md
    role: origin
  excerpts:
  - 实战：在前端项目中集成 Rust 图像处理库实现 Web 版 Photoshop 核心滤镜
  - 完整流程：Rust 编写滤镜算法 → wasm-pack 编译 → Vite 插件集成 → Web Worker 卸载主线程 → Canvas 渲染输出 →
    性能基准对比 JS 实现
