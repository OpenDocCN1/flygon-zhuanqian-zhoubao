life_analogy:
- 想象预训练大模型是一场**“为超级考生设计通识教育课程”**的系统工程：
- '- **自监督目标 (MLM/CLM)** = **“填空题”与“接龙题”**：不请老师批改，用课本自身内容自动生成习题，让学生在海量刷题中悟出语言规律。'
- '- **Scaling Laws** = **“教育投资回报率模型”** ：给定总预算（算力），到底该招多聪明的学生（参数量 N），买多少题库（Token 数
  D），才能考出最高分？Chinchilla 告诉我们：别光招天才不给题做，也别光买题给笨蛋做，聪明度与题量要同步增长。'
- '- **3D 并行 + ZeRO** = **“分布式备考组织架构”** ：'
- '  - **DP (数据并行)** = 多个班级同步上同一门课，最后汇总错题本（梯度 All-Reduce）。'
- '  - **TP (张量并行)** = 一道超大数学题拆给小组每人算一步，算完拼答案（矩阵切分 All-Reduce），组内必须坐得近（NVLink）。'
- '  - **PP (流水线并行)** = 课程分模块，班级 A 讲语法，讲完传给班级 B 讲语义（层切分），中间课桌空着等交接是“气泡”。'
- '  - **ZeRO** = 不让每个学生都背全套参考书（优化器/梯度/参数分片），只背自己负责的章节，考试时现借现还（Offload)。'
- '- **数据工程** = **“题库清洗与精炼”** ：Common Crawl 是堆混杂垃圾的废品站；清洗是拣废纸、洗油污、撕重复页；MinHash 去重是查重防背答案；课程学习是先刷名校真题（Wiki/代码）再刷海量模拟题；合成数据是请状元生成高质量预测题。'
- '- **稳定性诊断** = **“考试监控与应急预案”** ：Loss Spike 如同模考突然崩盘；监控梯度范数如监控心率血压；回滚 Checkpoint
  是回到上次正常模考状态；数据黑名单是把那套有毒试卷销毁；动态降 LR 是暂时降低训练强度缓一缓。'
summary:
- concept: MLM (掩码语言建模)
  desc: 随机遮盖 Token 利用双向上下文预测，适合 NLU 任务，BERT 核心范式
- concept: CLM (因果语言建模)
  desc: 单向自回归预测下一 Token，天然适配生成任务，GPT 系列核心范式
- concept: NSP (下一句预测)
  desc: 判断两句是否连续，后被证明对下游任务提升有限，RoBERTa 等移除
- concept: Scaling Laws
  desc: 描述 Loss 与参数量 N、数据量 D、算力 C 的幂律关系，指导资源最优分配
- concept: Chinchilla 定律 / 计算最优
  desc: 最优训练下 N 与 D 应同比例缩放 (N* ∝ C^0.5, D* ∝ C^0.5)，避免模型大数据少或模型小数据多
- concept: 数据并行 (DP)
  desc: 各卡存完整模型副本，切分数据，梯度同步，显存不随卡数降低
- concept: 张量并行 (TP)
  desc: 单层矩阵切分多卡计算，显存线性降低，高频通信需 NVLink，节点内部署
- concept: 流水线并行 (PP)
  desc: 模型按层切分 Stage，微批次流水执行，存在气泡开销，需 1F1B 等调度优化
- concept: ZeRO (Zero Redundancy Optimizer)
  desc: 按状态分片 (优化器/梯度/参数) 而非复制，ZeRO-3 显存降至 1/N，配合 Offload 突破显存墙
- concept: 混合精度 (BF16/FP16)
  desc: 计算用低精度加速，主参数/梯度累积用 FP32 保稳定，BF16 无需 Loss Scaling 成标配
- concept: 激活重计算
  desc: 前向不存中间激活，反向重算，用 20-30% 算力换取大幅显存节省
- concept: 数据清洗管线
  desc: 语言识别→脱敏→规则过滤→质量分类器打分→阈值筛选，核心原则：数据质量 > 数据量
- concept: 去重 (MinHash LSH)
  desc: 精确哈希 + 模糊 n-gram Jaccard 相似度去重，防止模型背诵高频语料
- concept: 课程学习
  desc: 按质量/难度排序喂数据：前期高质易学 (Wiki/代码/书籍)，后期海量网页，加速收敛提上限
- concept: 合成数据
  desc: 强模型生成指令/推理/代码数据回补稀缺领域，实现模型教模型，需严控质量防分布坍缩
- concept: 数据污染检测
  desc: n-gram 重叠/子串匹配/哈希去重检测测试集泄露，发布前必做
- concept: Loss Spike
  desc: 训练中损失突增 10-100x，三大成因：数据脏样、超参/优化问题、硬软件故障
- concept: 稳定性诊断 SOP
  desc: 监控梯度/参数/激活分布 → 检测异常自动停止 → 回滚前 1-5 步 Checkpoint → 剔除脏数据黑名单 → 临时降 LR/增 Clip
    → 小步重启验证
- concept: 检查点策略
  desc: 高频异步保存 (500-1000 步)、多副本异地容灾、确定性训练保证回滚可复现
exercises:
- 'no': 1
  title: Scaling Laws 实战：算力预算下的最优配置推导
  contents:
  - 假设你拥有 1e24 FLOPs 的算力预算 (C)，遵循 Chinchilla 定律最优分配原则 (N* ∝ C^0.5, D* ∝ C^0.5)，且已知训练一个
    70B 模型需 1.4T Tokens 对应算力约 3.5e23 FLOPs (参考公式 C ≈ 6ND)。
  - 1. 计算在 1e24 FLOPs 预算下，最优模型参数量 N* (Billion) 与训练 Token 数 D* (Trillion) 的理论值。
  - 2. 若受限于显存只能训练 30B 模型，根据定律推导应训练多少 Tokens 才达到该模型规模下的计算最优？此时实际消耗算力是多少？
  - 3. 对比 LLaMA-1 (7B/13B/33B/65B 均训练 1T tokens) 与 Chinchilla 最优策略的差异，分析 LLaMA 选择“过度训练”小模型的工程动机（提示：推理成本、部署灵活性）。
  - 回答问题：
  - '- 为什么 Kaplan 定律会误导研究者“只增大模型不增数据”？其假设条件与 Chinchilla 有何关键不同？'
  - '- 如果数据质量显著提升 (如 Phi 系列教科书级数据)，Scaling Laws 的指数系数会如何变化？对最优分配策略有何启示？'
- 'no': 2
  title: 3D 并行拓扑设计与通信量估算
  contents:
  - 任务：在 128 张 A100 (80GB, NVLink 600GB/s, IB 200Gbps) 上训练一个 40 层、隐藏维度 8192、注意力头数
    64、FFN 隐藏层 22016 的类 GPT 模型 (约 7B 参数)，目标是最大化 MFU (Model FLOPs Utilization)。
  - 1. 设计 3D 并行拓扑 (DP × TP × PP = 128)，给出具体分割方案并说明理由（提示：TP 域大小受限于 NVLink 域，PP 需平衡气泡比例与显存，DP
    承担剩余）。
  - 2. 估算该拓扑下每个微批次的通信量：
  - '   - TP 域内 All-Reduce (Attention QKV 投影 + Output + FFN 两次线性层) 通信数据量 (GB)？'
  - '   - PP 域间激活传递 (隐藏状态) 通信数据量 (GB)？'
  - '   - DP 域间梯度 All-Reduce 通信数据量 (GB)？'
  - 3. 分析该拓扑的主要瓶颈在哪里（计算/显存/通信），并提出一项具体优化建议（如调整微批次、开启异步通信重叠、调整 TP/PP 比例、使用 ZeRO-1 替代
    DP 等）。
  - 回答问题：
  - '- 为什么 TP 必须部署在单节点 (8 卡) 内？跨节点 TP 性能会发生什么？'
  - '- PP 的“气泡比例”如何计算？增加微批次数量对气泡比例、显存占用、通信频率分别有何影响？'
- 'no': 3
  title: 数据清洗管线设计与质量评估实验
  contents:
  - 你获得 10TB 原始 Common Crawl 数据 (WARC 格式)，目标产出 1T 高质量 Token 训练 7B 模型。请设计清洗管线并制定评估指标：
  - 1. 列出管线中 5 个关键清洗阶段，每阶段核心操作、工具/算法 (如 fastText 语言识别、MinHash LSH 去重、KenLM 质量打分) 及预期数据保留率。
  - 2. 设计“质量分类器”训练策略：正样本从哪里来 (Wikipedia/书籍/代码)？负样本如何构造？特征选用 n-gram 还是嵌入向量？阈值如何校准 (Precision/Recall
    权衡)？
  - 3. 制定去重策略：文档级精确去重 vs 段落级模糊去重 (MinHash, n=13, Jaccard > 0.8)，分析两者对数据量、语义多样性、计算开销的影响差异。
  - 4. 定义 3 项离线评估指标 (如困惑度下游任务零样本、重复 n-gram 比例、领域分布 KL 散度) 和 1 项在线评估指标 (训练 Loss 曲线收敛速度/终值)，用于对比不同清洗策略的优劣。
  - 回答问题：
  - '- 过度清洗导致“分布偏移”和“长尾知识缺失”如何量化检测？'
  - '- 合成数据回补时，如何设计“质量把关关卡”防止模型自产幻觉污染训练集？'
- 'no': 4
  title: Loss Spike 复盘与应急演练
  contents:
  - 场景：万卡集群训练第 15 万步 (共 30 万步)，全局 Loss 从 1.8 突增至 45.0，梯度范数爆炸至 1e3 (正常 ~1.0)，触发自动停机。
  - 1. 按 SOP 排查：依次检查 (a) 当前 Batch 数据样本 (通过 Data Seed 定位) 是否含超长序列/异常字符/高熵噪声；(b) 学习率调度器是否异常跳变
    (Warmup 结束/重启点)；(c) GPU 日志 (ECC 错误/温度/时钟降频) 与 NCCL 通信错误计数；(d) BF16 下溢统计 (激活值/梯度是否大量接近
    0)。
  - 2. 假设定位为某条包含大量重复特殊 Unicode 字符的脏数据导致，执行恢复操作：回滚至 Step 149,500 (最近正常 Checkpoint)
    -> 将脏样本 Index 加入数据黑名单 -> 重启训练并临时将 LR 降为 1e-5 (原 3e-4) 运行 500 步 -> 恢复原 LR。
  - 3. 复盘报告撰写要点：根因分类、影响范围 (损失算力小时数)、检测延迟 (从 Spike 发生到停机耗时)、黑名单生效验证、预防措施更新 (如增加数据端侧长度/字符分布校验、梯度爆炸早期预警阈值)。
  - 回答问题：
  - '- 为什么回滚步数建议“前 1-5 个 Checkpoint”而非“仅回滚 1 步”？Checkpoint 间隔过大 (如 5000 步) 对恢复成本与风险有何影响？'
  - '- ZeRO-3 场景下，参数/优化器状态分片在多张卡上，回滚 Checkpoint 的一致性如何保证？需注意什么？'
  - '- 部分 Spike 属于“良性波动”(如 LR 重启后瞬时上升)，如何设计自动化规则区分“良性”与“恶性” Spike，避免误杀？'
