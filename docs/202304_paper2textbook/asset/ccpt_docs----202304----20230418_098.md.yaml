paper: docs/202304/20230418_098.md
desc: 该素材是生财有术社群第七期新人言谦墨的实战复盘分享，其核心主张是新人应遵循“先在航海项目中落地执行、再广度构建商业认知、最后深度扎根单一领域”的三阶段成长路径，通过最小可行性行动快速跑通第一个互联网项目闭环。
concepts:
- name: 生财实操三阶段法
  desc: 作者总结的新人成长标准动作：第一阶段在航海项目中先做起来（执行落地）；第二阶段对商业世界建立基本认知（广度）；第三阶段找一个领域扎根（深度）。
  is_original: true
  excerpt:
  - 1.航海里面找个项目先做起来 2.对商业世界建立基本认知——先广度 3.找一个领域扎根——再深度
- name: 航海项目
  desc: 生财有术社群提供的一种低门槛、强陪伴、有标准化SOP的实战训练营项目，旨在帮助新人通过最小成本完成从0到1的项目闭环。
  is_original: false
  excerpt:
  - 航海里面找个项目先做起来
methods:
- name: __overview__
  desc: 新人入社后的标准化使用流程：优先报名航海项目实战（而非先看理论），在执行中遇到问题再回溯社群精华帖建立商业认知广度，最后基于实战反馈选定单一赛道深耕。
  excerpt:
  - 分享一下我作为一个新人是怎么使用生财来开启我的第一个互联网项目的，以及接下来会怎么做。
  - 1.航海里面找个项目先做起来 2.对商业世界建立基本认知——先广度 3.找一个领域扎根——再深度
theorems:
- name: 行动先于认知原则
  desc: 对于渴望赚钱的新人，应优先在‘航海’等实战项目中‘先做起来’，通过最小可行性行动获取真实反馈，再回头补齐商业认知广度，最后才是领域深度，避免陷入‘只学不做’的知识囤积陷阱。
  excerpt:
  - 对于想要赚钱渴望赚钱的人，生财是一个巨大的宝藏库，里面有很多值得挖掘的文章和机会。
  - 1.航海里面找个项目先做起来 2.对商业世界建立基本认知——先广度 3.找一个领域扎根——再深度
- name: 社群价值利用最大化策略
  desc: 高效利用付费社群的核心在于‘用项目带学习’：将社群定位为‘宝藏库’与‘机会库’，优先消费高确定性的标准化产品（航海），而非被动阅读碎片化文章。
  excerpt:
  - 对于想要赚钱渴望赚钱的人，生财是一个巨大的宝藏库，里面有很多值得挖掘的文章和机会。
findings:
- name: 新人执行力突破验证
  desc: '[evidence] 作者作为第七期新人，通过遵循该三阶段路径，成功开启了第一个互联网项目，验证了‘航海先行’策略对零基础新人的有效性。'
  excerpt:
  - 分享一下我作为一个新人是怎么使用生财来开启我的第一个互联网项目的
  - 同为新人，很有感触，还没迈出第一步，要向你学习，早日开始行动
- name: 路径可复制性佐证
  desc: '[claim] 评论区其他新人表示‘很有感触’、‘要向你学习，早日开始行动’，侧面印证该路径具有示范效应和可复制性，能降低新人的行动心理门槛。'
  excerpt:
  - 同为新人，很有感触，还没迈出第一步，要向你学习，早日开始行动
