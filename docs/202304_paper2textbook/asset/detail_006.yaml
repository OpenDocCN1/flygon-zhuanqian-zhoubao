  excerpts:
  - 私域的意义根本就不是管理，而是『经营』
  - 生财有术的“术”是正道，合法合理并且是三观要正
  - 航海手册是新人唯一完美满足三维筛选模型的资源
  - 赚钱需要具备认知、技能与实战，三者缺少任意一者都无法完成赚钱的路径闭环
  - 实战优先于准备：在现实实战中，你遇到的问题和挑战可能是动态调整的，甚至当你充分准备好应对策略时，你所面对的 Boss（机会）早已经不存在了
  - 普通人副业成功的核心在于‘可复制’而非‘天赋’
  - 高分佣比例是社群裂变规模化的关键驱动力
  - 新人入场需以‘逼自己成长’为内驱力设计商业闭环
  - 朋友圈商业自传：长期经营长期迭代，让朋友圈像一本书一样
  - 以教为学：整个过程‘帮助别人，并意外成就了自己’
  - 视频号起号7天涨粉10W+，核心在于洞察中老年用户画像+二改原视频/保留音频替换画面
  - 小红书引流核心逻辑：动机-能力-提示(福格行为模型)，精准流量优于泛流量
  - ChatGPT调教核心：知己知彼(双向身份设定) + 人物DNA(场景/身份/年龄/性格/语气) + 核心诉求直达 + 元素拆解热身
  - 六字真经：背景(身份/行业/目的/受众) + 要求(字数/结构/风格/行动号召) + 角色(专家人设/双角色扮演)
  - 认知变现：你赚不到认知以外的钱，付费入圈重塑潜意识，圈层套利跨界变现
  - 创业层级决定天花板：L1流量套利 -> L2产品型(营盘) -> L3品类头部赋能 -> L4圈行业 -> L5道生万物 -> L6百年基业 -> L7见天地众生自我
  - 核心竞争力不变论：项目红利变，核心竞争力不变，以不变应万变
