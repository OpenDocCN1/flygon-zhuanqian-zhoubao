learning_targets:
- 理解混合专家模型（MoE）通过稀疏激活实现参数量与计算量解耦的核心原理
- 掌握原生多模态模型统一 Tokenizer 与交错序列训练的架构设计要点
- 熟悉 LLM Agent 从 ReAct 到 Plan-and-Execute、Reflexion 等认知架构的演进脉络与工程落地范式
- 掌握 Test-Time Scaling 利用推理时计算（搜索、PRM、自我修正）提升性能的新 Scaling Law 机制
- 能够串联数据清洗、持续预训练、SFT、DPO、量化部署、RAG、Agent 编排至自动化评测的领域大模型全链路工程闭环
- 理解生财有术社群核心价值观体系（正道、真诚、长期主义）对私域经营的指导作用
- 掌握‘私域经营’而非‘公域管理’的底层逻辑，以及群规模边际效益递减律（150人红线）
- 掌握‘向牛人付费学习、借力打力’的认知变现路径，以及‘先赚第一块钱’的 MVP 验证原则
- 熟悉‘航海手册’、‘风向标’、‘志愿者’等社群基建工具的标准化使用流程
- 理解‘单点突破’、‘利他复利’、‘认知边界即收入边界’等核心商业思维模型
concept_map:
- 前沿扩展：MoE、多模态、Agent 与 Test-Time Scaling
- ├── 混合专家模型 (MoE) —— 稀疏激活的规模化路径
- │   ├── 核心机制：路由器 + 专家网络 + Top-K 稀疏激活       —— P001
- │   ├── 代表架构：Switch Transformer (Top-1) / DeepSeekMoE (细粒度+共享专家) —— P001
- │   ├── 关键工程：负载均衡损失、专家并行 All-to-All 通信、推理显存常驻问题 —— P001
- │   └── 边界条件：通信开销大、训练不稳定、推理内存压力 —— P001
- ├── 原生多模态 —— 统一表征的‘通用语言’
- │   ├── 核心范式：统一 Tokenizer + 统一 Backbone + 交错序列建模       —— P002
- │   ├── 代表架构：Chameleon (早期融合、离散图像 Token)                —— P002
- │   ├── 关键工程：模态特殊 Token、图文交错数据比例调度、损失加权       —— P002
- │   └── 边界条件：离散化信息损失、训练难度大、序列长度爆炸 —— P002
- ├── LLM Agent —— 赋予模型‘手脚’与‘大脑’的协作
- │   ├── 核心组件：LLM(Controller) + Planning + Memory(分层) + Tools + Environment —— P003
- │   ├── 认知范式演进：ReAct -> Plan-and-Execute -> Reflexion              —— P003
- │   ├── 工具标准化：Function Calling / MCP 协议 / Toolformer 微调       —— P003
- │   ├── 记忆架构：工作/情景/语义/程序性四层记忆 + 巩固与遗忘机制         —— P005
- │   ├── 多 Agent 协作：MetaGPT/ChatDev (角色扮演) / AutoGen (群聊辩论)    —— P004
- │   └── 边界条件：上下文溢出、幻觉累积、高成本延迟 —— P003/P005
- ├── Test-Time Scaling —— 推理时计算的新 Scaling Law
- │   ├── 核心公式：Policy Model 生成轨迹 + PRM 逐步打分 + Search (MCTS/Beam Search) 选择最优路径 ——
  P004
- │   ├── 代表范式：OpenAI o1 系列 (长 CoT + RL 训练慢思考)                  —— P004
- │   ├── 关键性质：推理算力与性能正相关、过程监督优于结果监督、自我修正回溯 —— P004
- │   └── 边界条件：推理延迟极高、PRM 训练难/泛化弱、非通用受益任务       —— P004
- └── 领域专属大模型应用全链路构建 —— 从数据到价值的闭环
- '    ├── 端到端流水线：数据清洗 -> 持续预训练 -> SFT -> DPO -> 量化部署 -> RAG增强 -> Agent编排 -> 自动化评测闭环
  —— P005'
- '    ├── 核心原则：数据飞轮驱动、模块化解耦 (RAG+微调互补)、评测贯穿始终 —— P005'
- '    ├── 典型落地：法律助手 (法条+案例+文书生成)、代码 Agent (仓库级生成+工具链) —— P005'
- '    └── 边界条件：持续预训练成本高、领域数据稀缺/版权受限、四位一体版本管理复杂 —— P005'
- ├── 生财有术社群认知体系与实战方法论
- │   ├── 核心价值观：术为正道/信息广度与时效性/真诚分享赚钱思维/普惠愿景 —— P008
- │   ├── 社群基建工具：航海手册(结构化实战SOP)、风向标(前沿情报/选词定生死)、志愿者身份跃迁(60分心法/SOP工具人/多重身份并行) —— P008/P101/P109
- │   ├── 新人成长四阶段：新手期(建立信心/开始行动) -> 探索期(持续试错/挖掘价值) -> 增长期(找到方向/收入增加) -> 放大期(合作共赢/孵化项目)
