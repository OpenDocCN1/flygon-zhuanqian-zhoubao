learning_targets:
- 理解 PromptTemplate 与 ExampleSelector 实现提示词工程化（版本化、参数化、动态少样本）的核心价值
- 掌握结构化输出解析器（OutputParser/PydanticOutputParser）构建“自然语言输入→类型安全对象输出”编程契约的方法
- 了解 DSPy 与 OPRO 将提示词优化建模为离散优化/编译流程的原理、适用边界与工程落地成本
- 能根据任务复杂度、模型能力与数据规模，选择合适的提示词管理与自动优化策略
- 掌握“龙哥赚钱周报”知识生产与分发方法论：基于语雀文档协作产出 -> 定期整理为周报 -> 通过私域社群（专属群）分发 -> 利用版权警示维护稀缺性 -> 通过邀请制实现裂变增长
- 理解“龙哥风向标”作为周报内容核心来源体系/专栏名称，暗示包含趋势研判与项目筛选信息
- 理解“专属群/私域社群”作为承载周报分发与用户互动的载体，通过邀请裂变增长、设有准入门槛
- 掌握知识生产与分发体系的工程化闭环：从碎片情报到结构化知识资产的沉淀、分发与变现路径
- 识别“龙哥赚钱周报”与“龙哥风向标”在生财有术社群知识管理体系中的定位与协作关系
- 理解私域社群运营中“版权警示+邀请裂变”构建稀缺性护城河的商业逻辑
concept_map:
- 提示工程体系化
- ├── 提示词即代码
- │   ├── PromptTemplate（参数化模版/版本控制/序列化）     —— 概念1
- │   └── ExampleSelector（动态少样本/向量检索/长度控制） —— 概念1
- ├── 结构化输出与类型安全
- │   ├── OutputParser 接口（格式指令/解析/自愈重试）     —— 概念2
- │   └── PydanticOutputParser（Schema 共享/强类型映射）  —— 概念2
- └── 提示自动优化
- '    ├── DSPy（声明式模块/编译器优化/指令与示例搜索） —— 概念3'
- '    └── OPRO（LLM 作为优化器/优化轨迹上下文/黑盒离散优化） —— 概念3'
- 知识生产与分发体系
- ├── 龙哥赚钱周报（定期发布的付费/私密社群内容产品）
- ├── 龙哥风向标（周报内容核心来源体系/专栏名称，含趋势研判与项目筛选信息）
- └── 专属群/私域社群（周报分发载体，邀请裂变增长，设有准入门槛）
- ├── 内容生产流水线（语雀协作/定期整理/周报渲染/自动化分发）
- └── 稀缺性护城河（版权警示/邀请制裂变/付费门槛）
life_analogy:
- 想象提示工程体系化是**建筑工程的标准化演进**：
- '- **PromptTemplate** = **标准化图纸模版**：将「盖房子」的通用流程固定为带参数槽位的图纸（户型、朝向、面积为变量），替代每次口头指挥工人砌墙。'
- '- **ExampleSelector** = **智能案例库**：业主说「我想要地中海风格」，系统自动从过往万个项目中检索最相似的 3 套「地中海风格」施工案例图纸附在新图纸后，而非死板贴上公司前
  3 个项目。'
- '- **PydanticOutputParser** = **验收标准书**：约定交付物必须是「JSON 格式的竣工验收单」（字段、类型、枚举全定死），验收员（下游代码）拿着标准书一核对，不合格直接打回重做（自愈重试），彻底杜绝「口头承诺交付」的扯皮。'
- '- **DSPy/OPRO** = **AI 首席架构师**：不再靠人工反复修改图纸，而是告诉架构师「目标：通过验收率>99%、成本降 20%」，架构师自动遍历历史图纸与验收记录，进化出最优图纸模版，并持续随新项目数据迭代。'
- 想象知识生产与分发体系是**专业研报机构的运作模式**：
- '- **龙哥风向标** = **核心分析师团队**：每日产出高密度、强实操的趋势研判与项目筛选情报，作为机构核心知识资产库。'
- '- **语雀文档协作** = **内部知识管理系统**：分析师团队协同产出结构化报告，版本可控、可追溯。'
- '- **龙哥赚钱周报** = **周度策略报告**：将分散情报整理为定期交付产品，形成「短标题吸引、长内容交付」的知识传递路径。'
- '- **专属群/私域社群** = **付费订阅终端+裂变渠道**：通过邀请制实现低成本获客与高粘性留存，版权警示维护内容稀缺价值。'
summary:
- concept: PromptTemplate
  desc: 提示词参数化模版，实现静态骨架与动态变量解耦，支持版本控制、序列化存储与非技术人员维护
- concept: ExampleSelector
  desc: 动态少样本检索器，基于语义相似度/长度/多样性从案例库选取最相关示例，替代静态硬编码 Few-shot
- concept: OutputParser
  desc: 定义格式指令注入、输出解析、带提示词修复重试的标准接口，屏蔽 LLM 非结构化输出的不确定性
- concept: PydanticOutputParser
  desc: 结合 Pydantic Schema 实现输出到强类型对象的自动映射校验，提示词与解析器共享同一 Schema 契约
- concept: DSPy
  desc: 声明式自优化框架，将提示词优化建模为『模块声明→编译器搜索』流程，自动优化指令、示例、CoT 步骤
- concept: OPRO
  desc: 利用 LLM 自身作为优化器，基于历史『Prompt+Score』轨迹生成新候选提示词，实现黑盒离散优化
- concept: 数据飞轮
  desc: 线上交互数据→标注/合成→离线优化→线上 A/B→新数据，驱动提示词持续自动化迭代的闭环机制
- concept: 龙哥赚钱周报
  desc: 定期发布的付费/私密社群内容产品，以周报形式汇总赚钱风向标信息，每周更新
- concept: 龙哥风向标
  desc: 周报内容的核心来源体系或专栏名称，包含趋势研判与项目筛选信息，另有文档分享
- concept: 专属群/私域社群
  desc: 承载周报分发与用户互动的载体，通过邀请裂变增长，设有准入门槛，请勿外流防止失效
- concept: 内容生产流水线
  desc: 语雀协作产出 -> 定期整理周报 -> 私域分发 -> 版权警示维护稀缺性 -> 邀请制裂变增长的标准化知识生产方法论
- concept: 稀缺性护城河
  desc: 通过版权控制、邀请裂变、付费门槛构建社群内容的稀缺价值，确保成员专属权益与长期留存
exercises:
- 'no': 1
  title: 手写一个简易 PromptTemplate 与 ExampleSelector
  contents:
  - 1. 实现 `PromptTemplate` 类：
  - '   - 接收模版字符串（如 "翻译成 {lang}：{text}"）与输入变量字典'
  - '   - 提供 `format()` 方法渲染最终提示词，缺失变量时抛出明确异常或使用默认值'
  - '   - 支持 `save_json()` / `load_json()` 实现版本化持久化'
  - 2. 实现 `SimilarityExampleSelector` 类：
  - '   - 初始化时接收示例列表 `[{''input'': ''...'', ''output'': ''...''}, ...]` 与 Embedding
    函数'
  - '   - `select_examples(query, k=3)`：计算 query 与所有示例 input 的向量相似度，返回 Top-k 示例'
  - '   - 结合 `PromptTemplate`：渲染时自动将选中的示例格式化注入 `few_shot_examples` 变量'
  - 3. 思考题：
  - '   - 当示例库达到 10 万条时，暴力计算相似度延迟过高，如何工程化优化？'
  - '   - 如何设计 A/B 测试对比「固定示例」vs「动态检索示例」的效果差异？'
- 'no': 2
  title: 结构化输出解析与自愈重试实战
  contents:
  - 场景：让模型输出结构化的「代码审查意见」，包含文件路径、行号、严重度、建议修复代码。
  - '1. 定义 Pydantic 模型 `ReviewComment(file: str, line: int, severity: Literal[''low'',''medium'',''high''],
    fix: str)` 与 `CodeReview(comments: List[ReviewComment], summary: str)`。'
  - 2. 使用 `PydanticOutputParser` 生成格式指令，拼接进 PromptTemplate。
  - 3. 模拟模型返回「缺少右大括号」「字段类型不匹配」「Markdown 代码块包裹 JSON」等 3 种典型脏输出。
  - 4. 实现 `parse_with_prompt()` 逻辑：捕获解析异常 → 构造修复提示词（含原始输出、报错信息、Schema）→ 再次调用模型 → 循环重试最多
    3 次。
  - 5. 思考题：
  - '   - 流式输出场景下，为何难以增量解析 JSON？有何替代方案（如 JSON Lines、分隔符流、Grammar-based 解码）？'
  - '   - 小模型（如 3B）遵循复杂 Schema 失败率高，除微调外，如何通过提示词工程提升成功率？'
- 'no': 3
  title: DSPy 风格提示词优化最小闭环
  contents:
  - 任务：优化「从用户问题生成 SQL」的提示词。
  - 1. 准备数据：收集 50 组 `(question, sql)` 训练集，再准备 20 组测试集（含执行正确性校验脚本）。
  - 2. 定义 DSPy 模块：`class Text2SQL(dspy.Module):` 包含 `Predict('question -> sql')` 与可选的
    `ChainOfThought`。
  - '3. 定义指标函数：`def exact_match(pred, gold): return pred.sql.strip() == gold.sql.strip()`。'
  - 4. 运行优化器：`tp = dspy.teleprompt.BootstrapFewShot(metric=exact_match); optimized
    = tp.compile(Text2SQL(), trainset=trainset)`。
  - 5. 对比优化前后在测试集上的 Exact Match 与 Token 消耗。
  - 6. 思考题：
  - '   - BootstrapFewShot 与 MIPROv2 优化器的核心差异是什么？何时选用哪个？'
  - '   - 优化得到的提示词迁移到 GPT-4o-mini 与 Llama-3-8B-Instruct 上效果为何可能大相径庭？如何评估跨模型鲁棒性？'
  - '   - 优化成本（API 调用次数、Token 费用）与收益如何量化？设定何种停止条件最合理？'
- 'no': 4
  title: OPRO 风格提示词进化模拟
  contents:
  - 不调用真实 LLM，手工模拟 OPRO 核心循环理解其动态。
  - 1. 初始提示词池：`["Let's think step by step.", "Solve this problem.", "Answer directly."]`。
  - 2. 模拟评分函数（人工打分或启发式规则）：为每个提示词在 5 道数学题上打分（0-1）。
  - '3. 构造元提示词："以下是历史提示词及其得分：\n[Prompt 1: 0.6]\n[Prompt 2: 0.4]...\n请生成一个更高分的新提示词："。'
  - 4. 人工扮演「优化器 LLM」，根据历史轨迹写出 2 个新候选提示词。
  - 5. 评分新提示词，加入池子，迭代 3 轮。
  - 6. 记录每轮最佳提示词与分数变化曲线。
  - 7. 思考题：
  - '   - OPRO 为何能跳出局部最优？（提示：优化器 LLM 拥有语义理解与泛化能力，非单纯梯度下降）'
  - '   - 元提示词中「历史轨迹」的窗口大小、呈现格式对优化效率影响有多大？'
  - '   - 如何防止优化器生成的提示词过拟合训练集（如死记硬背答案）？'
- 'no': 5
  title: 复刻「龙哥赚钱周报」知识生产流水线
  contents:
  - 场景：你想为自己的领域建立一份周度高质量付费报告。
  - 1. 搭建语雀知识库：创建团队空间，建立「风向标」专栏，设定每日/每周录入规范（标题、来源、标签、核心观点、可执行动作）。
  - 2. 设计周报模版：固定栏目结构（宏观风向、项目拆解、工具推荐、避坑指南、社群动态），约定输出字数与排版标准。
  - 3. 编写自动化脚本：利用语雀 API 定时拉取本周「风向标」条目，按模版渲染 Markdown/PDF，自动推送至微信群/知识星球/邮件列表。
  - 4. 设计裂变机制：生成专属邀请海报/链接，设置「邀请 3 位好友解锁完整版」或「转发朋友圈领取往期精选」规则。
  - 5. 版权保护：在报告页脚植入动态水印（用户 ID+时间），约定「仅限专属群内传阅，外流即封号/追责」。
  - 6. 思考题：
  - '   - 如何平衡「免费公开精华版吸引流量」与「付费专属版留存核心用户」的内容切分比例？'
  - '   - 当分析师团队（风向标产出者）出现人员波动时，如何保证周报输出的稳定性与质量连贯性？'
- 'no': 6
  title: 端到端知识生产与分发闭环设计
  contents:
  - 场景：设计一套从原始信息源到付费周报交付的自动化系统架构。
  - 1. 定义数据模型：原始素材、风向标条目、周报章节、分发渠道、用户权限等核心实体的 Schema。
  - 2. 设计 Pipeline：采集器 -> 清洗/结构化 -> 选题/编排 -> 渲染/多格式导出 -> 分发/推送 -> 反馈/迭代的全链路。
  - 3. 识别关键工程挑战：多源异构数据融合、长文本模版渲染稳定性、分发渠道 API 限流与重试、版权水印注入性能。
  - 4. 制定运营 SLA：周报准时率、内容准确率、分发送达率、用户投诉响应时效的量化指标。
  - 5. 思考题：
  - '   - 如何设计「人工编辑介入点」在自动化流水线中实现质量把控而不阻塞流程？'
  - '   - 当核心分析师（风向标产出者）离职时，如何通过知识资产沉淀实现平滑交接？'
units:
- 'no': 1
  name: PromptTemplate 与 ExampleSelector —— 让提示词像代码一样可复用、可版本化
  points:
  - '**为什么需要这个概念？**'
  - '- 传统提示词散落在业务代码中，难以维护、复用和版本管理'
  - '- 固定的 Few-shot 示例无法适应动态上下文，导致检索精度低、Token 浪费'
  - '- 缺乏 A/B 测试机制，无法数据驱动地迭代提示词效果'
  - '**核心定义**'
  - '- PromptTemplate：将提示词结构化为参数化模版，分离静态骨架与动态变量，支持版本控制与序列化存储'
  - '- ExampleSelector：根据输入动态检索最相关的 Few-shot 示例（如基于向量相似度、长度、多样性），替代静态硬编码示例'
  - '**关键性质**'
  - '- 解耦性：提示词逻辑与业务代码解耦，支持非技术人员维护提示词内容'
  - '- 动态性：示例随输入语义动态变化，显著提升少样本效果上限'
  - '- 可追溯性：每次调用可记录模版版本、示例 ID、渲染后完整提示词，便于复盘'
  - '**典型例子**'
  - '- SQL 生成任务：根据用户问题语义检索 3 个最相似的 (Question, SQL) 对作为示例，而非固定前 3 条'
  - '- 客服分类：引入 LengthBasedExampleSelector 防止示例过长挤占上下文窗口'
  - '**边界条件**'
  - '- ExampleSelector 引入额外检索延迟（向量搜索约 10-50ms），高并发场景需缓存或异步预取'
  - '- 模版变量缺失或类型不匹配会导致渲染失败，需在模版层面做默认值兜底与校验'
  - '- 向量检索示例依赖 Embedding 模型质量，领域差异大时需微调或切换检索策略'
  sources:
  - paper: 20230418_105.md
    role: origin
  - paper: 20230418_106.md
    role: improve
  excerpts:
  - 引入 PromptTemplate 与 ExampleSelector 机制，实现提示词与业务逻辑解耦、动态少样本检索、A/B 测试版本控制，落地‘提示词即配置/代码’的工程规范。
  - 定义标准化 RAG Pipeline 接口：DocumentLoader/Transformer -> VectorStore/Retriever -> Generator，支持混合检索、父子文档、假设性文档嵌入等高级策略的即插即用组装。
- 'no': 2
  name: 结构化输出解析器 —— 从‘文本生成’到‘类型安全对象’的编程契约
  points:
  - '**为什么需要这个概念？**'
  - '- LLM 原生输出非结构化文本，下游代码解析极其脆弱（正则匹配、JSON 报错、字段缺失）'
  - '- 缺乏类型约束导致运行时错误难以发现，无法享受 IDE 智能提示与编译期检查'
  - '- 格式修复重试逻辑分散在业务代码中，违背单一职责原则'
  - '**核心定义**'
  - '- OutputParser：定义 `get_format_instructions()` 注入提示词、`parse()` 解析模型输出、`parse_with_prompt()`
    修复重试的标准接口'
  - '- PydanticOutputParser：结合 Pydantic 模型定义 Schema，实现输出到强类型对象的自动映射与校验'
  - '**关键性质**'
  - '- 契约化：提示词与解析器共享同一 Schema 定义（Pydantic Model），输入输出类型安全'
  - '- 自愈性：解析失败时自动携带原始输出与报错信息二次请求模型修复，成功率超 95%'
  - '- 可组合性：支持嵌套对象、列表、枚举、Optional 等复杂类型组合'
  - '**典型例子**'
  - '- 函数调用参数生成：定义 Pydantic 模型 `SearchParams(query: str, top_k: int = 10)`，模型直接输出合规
    JSON 对象'
  - '- 结构化摘要抽取：定义 `Summary(title: str, keypoints: List[str], sentiment: Literal[''pos'',''neg''])`
    强制格式化输出'
  - '**边界条件**'
  - '- 复杂嵌套 Schema 会显著增加提示词 Token 消耗（Format Instructions 可能达 500+ Tokens）'
  - '- 小模型（<7B）对复杂 JSON Schema 遵循率低，需配合 Grammar-based 解码（如 outlines/guidance）或微调'
  - '- 流式输出场景下难以增量解析 JSON，通常需缓冲完整输出后再解析，增加首包延迟'
  sources:
  - paper: 20230418_105.md
    role: origin
  - paper: 20230418_110.md
    role: improve
  excerpts:
