paper: docs/202304/20230418_092.md
desc: 该素材由资深创业者孙策基于7年实战反思总结，提出了一个包含七个层级的创业进阶模型。核心主张在于：创业者的认知与业务层级决定了利润天花板与抗周期能力，必须从低层级的“流量套利”（无壁垒、累且不积累）向高层级的“产品型”、“品类头部赋能”、“圈行业抗周期”、“道生万物建生态”、“百年基业长青”乃至“见天地众生自我”跃迁，核心路径是从“赚钱”转向“积累资产”，再转向“确立道/使命”，最终避免低水平重复，实现知行合一的长期主义创业。
concepts:
- name: 创业七层级模型
  desc: 素材核心框架，将创业过程划分为七个递进的认知与业务层级：L1流量型业务（流量套利）、L2产品型业务（打磨产品/营盘）、L3品类头部赋能型（业务+IP赋能行业）、L4圈行业型（提高抗周期性）、L5道生万物型（找到本源之道建生态）、L6百年基业型（活久+推动领域发展）、L7见天地众生自我型（知行合一/圣人境界）。层级越高，壁垒越深、抗周期性越强、创始人越不累。
  is_original: true
  excerpt:
  - 一般每年我都会出去逛一圈...就开始思考创业层级的问题，收入可以波动，但是创业的层级一定要增加
  - 现在绝大多数创业者在这一个环节的居多，跑通一个闭环且能赚到钱，流量型业务指的是流量套利的业务...
  - 产品型业务指的是能打磨一个产品，用产品去获客、去变现...
  - 无论你是产品型创业者或者是流量型创业者...开始对整个行业进行赋能，包括：供应链、团队管理、玩法等...
  - 前三个层级有明显的问题，业务都是有周期的...第四层级就是圈行业，提高抗周期性...
  - 道生一、一生二、二生三、三生万物，在这个阶段需要找到一个最本源的东西，贯穿行业，能建立起万物，创造出一个生态系统...
  - 阿里巴巴讲到要活 102 年，特斯拉加速世界向可持续能源转变，第六层级要结合两个来看，一个是要活得久，另一个就是要推动某一个领域的发展...
  - 到达了第七层级，已经完成见天地、见众生、见自己，在道家已经成“圣”、在佛家已经成“佛”...
- name: 流量型业务 (L1)
  desc: 创业最低层级，本质为流量套利（如微信淘宝客、抖音混剪带货）。特点：无核心壁垒、极易复制、人才留不住（掌握全流程即走）、创始人极度疲惫（把控所有细节）、仅积累现金不积累资产、只能向下兼容低级人才。
  is_original: false
  excerpt:
  - 流量型业务指的是流量套利的业务，类似于微信淘宝客（引流到微信群，在微信群进行卖货，获得佣金）、抖音混剪（大量的混剪博取抖音流量，用户购买，获得佣金）...
  - 这种业务天花板很有限，是因为组建不起来优秀的团队...人来人走会形成一种动态平衡...你只能向下兼容，不能向上兼容更多大佬入局...只是积累了现金，而没有积累下任何的东西。
- name: 产品型业务 (L2)
  desc: 第二层级，核心是打磨一个作为“营盘”的产品（公众号、抖音号、小程序、工具、IP等）。特点：有壁垒、知识沉淀在产品上（人走产品留）、向上吸纳人才、创始人可解放抓核心节点、年利润可达千万至几千万级。关键区别：向上吸纳人才
    vs 向下兼容求职者。
  is_original: false
  excerpt:
  - 产品型业务指的是能打磨一个产品，用产品去获客、去变现，类似于：运营一个公众号...运营一个ip等...
  - 产品就是你的营盘，可以向上吸纳，吸纳更多优秀的人，也不怕优秀的人走，因为就算走了，这些优秀的人知识的沉淀，也沉淀到这个产品上了...
  - 向上吸纳人才与向下兼容求职者，一个兼容一个吸纳，一词之差，但是整体差的是一个层级...年利润是可以做到千万级甚至几千万级。
- name: 品类头部赋能型 (L3)
  desc: 第三层级，业务做到垂直类目头部后，通过“业务+业务IP”模式对行业进行赋能（供应链、管理、玩法）。核心壁垒：业务壁垒+创始人成为类目名片（先发优势，第二永远是第二）。赚取业务利润+类目增长红利。
  is_original: true
  excerpt:
  - 很多创业者是快速做到头部，开始对整个行业进行赋能，包括：供应链、团队管理、玩法等...
  - 现在主流的都是业务+业务 ip 的方式在走，这个层级不仅仅是业务形成了壁垒，而且这个创业者也成为了这个类目的名片，一旦占据了这个位置，第二个出现的人永远是第二...
  - 在这个层级的创业者，不仅仅赚了业务的钱，而且还赚了这个类目增长的钱
- name: 圈行业/抗周期型 (L4)
  desc: 第四层级，解决业务周期性消亡（2-3年）的痛点。核心动作：把“类目”变成“行业”（如电商10年从货架->短视频->直播，大周期增长）。建立深厚壁垒并创新引领行业，小周期波动不再影响创业者。
  is_original: true
  excerpt:
  - 前三个层级有明显的问题，业务都是有周期的，很多业务可能三年消亡或者是两年消亡...
  - 第四层级就是圈行业，提高抗周期性，我们要把类目变成行业，举个例子：电商...这 10 多年有电商行业里面有各种小周期，但是整个电商的大周期都是增长的...
  - 在这个层级的创业者，已经是创业多年的老炮，小周期已经波动不到这个层级的创业者。
- name: 道/本源之道 (L5核心)
  desc: 第五层级的核心概念，引用《道德经》“道生一、一生二、二生三、三生万物”。指创业者找到贯穿行业、能建立生态系统的最本源定位（如理想汽车的“家”、服务宇宙、抖音宇宙、社区永恒）。这是从“管业务”进阶到“立道/造生态”的质变。
  is_original: true
  excerpt:
  - 道生一、一生二、二生三、三生万物，在这个阶段需要找到一个最本源的东西，贯穿行业，能建立起万物，创造出一个生态系统...
  - 新能源汽车中，理想、小鹏、蔚来，我认为理想最能杀出来...理想找到了自己理想汽车最本源的道，家，围绕的家创造出自己的生态系统...
  - 或者是一类创业者找到自己本源的道，例如：服务、抖音等...或者是找到永恒的存在道，例如：社区等，社区里的业务一浪又一浪，但是社区永远在
- name: 生态系统/宇宙
  desc: L5层级的产出形态。围绕本源之道（如“家”、“服务”、“抖音”、“社区”）构建的相互促进、自我进化的业务生态（理想汽车生态、服务宇宙、抖音宇宙），实现“知行合一”。
  is_original: true
  excerpt:
  - 围绕的家创造出自己的生态系统，生态系统中的产品相互促进理想“家“的道...
  - 通过服务贯穿行业，建立属于自己的服务宇宙生态系统，或者是通过抖音贯穿行业，抖音+万物，建立属于自己的抖音宇宙生态系统...
  - 在这个层级的创业者，完全做到了知行合一
- name: 百年基业/长青使命 (L6)
  desc: 第六层级双重约束：活得久（如阿里102年）+ 推动领域发展（如特斯拉加速可持续能源转变）。需几代人努力、持续投入资源，长寿是推动发展的前提。
  is_original: false
  excerpt:
  - 阿里巴巴讲到要活 102 年，特斯拉加速世界向可持续能源转变...
  - 第六层级要结合两个来看，一个是要活得久，另一个就是要推动某一个领域的发展...因此活得久也变的极其的核心
- name: 见天地/见众生/见自己 (L7)
  desc: 第七层级终极境界，对应道家“圣”、佛家“佛”。超越业务成败，达到“本来无一物，何处惹尘埃”的精神自由，追寻自我、活好自己。
  is_original: false
  excerpt:
  - 到达了第七层级，已经完成见天地、见众生、见自己，在道家已经成“圣”、在佛家已经成“佛”，可以做到本来无一物，何处惹尘埃的境界，真正可以追寻自己、活好自己。
methods:
- name: __overview__
  desc: 创业层级跃迁诊断法：通过对照七层级模型定位当前阶段，识别核心瓶颈（壁垒缺失、人才流失、周期困境、缺乏本源之道、使命缺位），制定向上跃迁的战略动作（从做流量->打磨产品营盘->建立品类IP赋能->圈定行业大周期->寻找本源之道造生态->确立百年使命->臻于知行合一）。
  excerpt:
  - 收入可以波动，但是创业的层级一定要增加
  - 流量型业务...产品型业务...品类头部赋能...圈行业...道生万物...百年基业...见天地众生自我
  - 归根结底就是不要低水平的重复，没有进步就是退步。
- name: 层级定位自检清单
  desc: 素材隐含的实操方法：创业者可按以下维度自查所在层级：1.核心资产是现金/流量/产品/IP/行业地位/生态/使命？2.人才策略是向下兼容/向上吸纳/行业标杆/生态共建？3.抗周期能力是无/弱/强/极强？4.创始人状态是累死/抓关键节点/赋能行业/立道造物/长青传承/知行合一？
  excerpt:
  - 这种业务天花板很有限，是因为组建不起来优秀的团队...
  - 产品就是你的营盘，可以向上吸纳...
  - 这个创业者也成为了这个类目的名片...
  - 把类目变成行业...小周期已经波动不到...
  - 找到一个最本源的东西...创造出一个生态系统...
  - 要活得久...推动某一个领域的发展...
  - 完成见天地、见众生、见自己
- name: 本源之道发现法 (L5专用)
  desc: 第五层级寻找‘道’的方法论：1.回溯行业长周期不变量（如电商本质是效率、汽车本质是家庭空间）；2.提炼企业不可被替代的核心价值主张（理想=家、服务=服务宇宙、抖音=内容分发基建、社区=连接永恒）；3.验证：该‘道’能否生发出相互促进的多产品生态系统（一生二，二生三，三生万物）。
  excerpt:
  - 道生一、一生二、二生三、三生万物，在这个阶段需要找到一个最本源的东西，贯穿行业，能建立起万物，创造出一个生态系统...
  - 理想找到了自己理想汽车最本源的道，家，围绕的家创造出自己的生态系统...
  - 通过服务贯穿行业，建立属于自己的服务宇宙生态系统...
  - 生态系统中的产品相互促进理想“家“的道
theorems:
- name: 层级决定天花板定律
  desc: '[claim] 创业利润上限、抗周期能力、创始人自由度、组织壁垒深度，本质上由创业者所在的认知与业务层级决定，而非单一业务模型或努力程度。低水平重复（L1-L2循环）无法突破天花板，必须主动进行层级跃迁。'
  excerpt:
  - 你创业的层级决定利润的天花板
  - 收入可以波动，但是创业的层级一定要增加
  - 归根结底就是不要低水平的重复，没有进步就是退步。
- name: 营盘沉淀定律 (L1 vs L2 分水岭)
  desc: '[claim] 创业从‘打工赚钱’进化为‘资产积累’的关键分水岭在于是否拥有‘营盘’（产品）。L1流量套利：人走茶凉、知识不沉淀、只能向下兼容；L2产品型：知识沉淀在产品中、向上吸纳人才、产品自我进化。人才策略‘向下兼容’与‘向上吸纳’一词之差，实则层级之分。'
  excerpt:
  - 这种业务天花板很有限，是因为组建不起来优秀的团队...人来人走会形成一种动态平衡...
  - 产品就是你的营盘，可以向上吸纳，吸纳更多优秀的人，也不怕优秀的人走，因为就算走了，这些优秀的人知识的沉淀，也沉淀到这个产品上了...
  - 向上吸纳人才与向下兼容求职者，一个兼容一个吸纳，一词之差，但是整体差的是一个层级
- name: 类目周期 vs 行业周期对冲论 (L3->L4 跃迁逻辑)
  desc: '[claim] 业务/类目周期短（2-3年消亡）是成熟创业者核心痛点。解决路径是‘圈行业’：将窄类目扩展为宽行业（如单一电商玩法->电商行业大周期）。行业大周期增长可对冲类目小周期消亡，实现抗周期。L3赚类目增长钱，L4赚行业确定性钱。'
  excerpt:
  - 前三个层级有明显的问题，业务都是有周期的，很多业务可能三年消亡或者是两年消亡...
  - 第四层级就是圈行业，提高抗周期性，我们要把类目变成行业...这 10 多年有电商行业里面有各种小周期，但是整个电商的大周期都是增长的...
  - 小周期已经波动不到这个层级的创业者。
- name: 道生万物生态构建论 (L5 核心机制)
  desc: '[claim] 突破单一业务/行业边界的终极路径是‘立道’：找到贯穿行业的本源之道（Path/Origin），以此为核心‘一生二、二生三、三生万物’构建生态系统。生态内产品相互促进、共同强化核心‘道’，实现知行合一。案例：理想‘家’生态、服务宇宙、抖音宇宙、社区永恒。'
  excerpt:
  - 道生一、一生二、二生三、三生万物，在这个阶段需要找到一个最本源的东西，贯穿行业，能建立起万物，创造出一个生态系统...
  - 理想找到了自己理想汽车最本源的道，家，围绕的家创造出自己的生态系统，生态系统中的产品相互促进理想“家“的道...
  - 在这个层级的创业者，完全做到了知行合一
- name: 长青双支柱论 (L6 可持续性条件)
  desc: '[claim] 百年基业/长青企业需要满足双必要条件：1. 极致长寿（活得久，如阿里102年愿景）；2. 使命导向（推动领域发展，如特斯拉能源转变）。前者是物质基础，后者是方向罗盘；推动领域发展需跨代际努力，故长寿成为核心前提。'
  excerpt:
  - 阿里巴巴讲到要活 102 年，特斯拉加速世界向可持续能源转变...
  - 第六层级要结合两个来看，一个是要活得久，另一个就是要推动某一个领域的发展...因此活得久也变的极其的核心
findings:
- name: L1创业者生存现状调研
  desc: '[evidence] 素材观察发现：绝大多数创业者停留在L1流量套利层级。表现为：人数最多、无壁垒、极易复制、跟风严重、团队动态平衡（人来人走）、创始人高强度操作细节、仅留现金流无资产积累。'
  excerpt:
  - 现在绝大多数创业者在这一个环节的居多...人数最多的创业者，没有核心壁垒，复制容易...
  - 这种业务天花板很有限...组建不起来优秀的团队...人来人走会形成一种动态平衡...只是积累了现金，而没有积累下任何的东西。
- name: L2产品型业务利润上限实测
  desc: '[evidence] 素材经验数据：L2产品型业务（公众号、抖音号、小程序、工具、IP等）可实现年利润千万级至几千万级。创始人可从琐事中解放，聚焦核心节点，组织可‘下足够多子，盘活后面足够多的棋’。'
  excerpt:
  - 在这个层级的创业者可以不那么累，可以把握更多的核心关键节点，解放创始人，可以下足够多子，盘活后面足够多的棋...
  - 在这个层级的创业，年利润是可以做到千万级甚至几千万级。
- name: 理想汽车‘家’道生态案例验证
  desc: '[evidence] 素材案例支撑：新能源三强（理想、小鹏、蔚来）中，理想市值≈小鹏+蔚来。归因：理想找到本源之道‘家’，围绕‘家’构建生态系统，产品相互促进核心道，验证了L5‘道生万物’模型的商业有效性。'
  excerpt:
  - 新能源汽车中，理想、小鹏、蔚来，我认为理想最能杀出来，现在市值也是小鹏+蔚来...
  - 理想找到了自己理想汽车最本源的道，家，围绕的家创造出自己的生态系统，生态系统中的产品相互促进理想“家“的道
- name: 评论区IP层级演进总结 (外部印证)
  desc: '[evidence] 读者芷蓝高赞评论提炼的IP视角层级演进路径：低级IP做流量 -> 中级IP做产品 -> 高级IP赋能行业 -> 顶级IP把自己变成行业。作者孙策认可（抱拳），但澄清本文核心是‘层级’而非‘IP’，印证模型通用性。'
  excerpt:
  - '芷蓝 : 好文，低级 IP 做流量，中级 IP 做产品，高级 IP 赋能行业，顶级 IP 把自己变成行业。 孙策 : [抱拳][抱拳] ... 孙策 :
    这个不是以 IP 来探讨的，是以层级来探讨的'
- name: 创业者普遍焦虑与跃迁渴望
