learning_targets:
- 理解知识主动建构的认知机制，识别“收藏夹谬误”与“编译器思维”陷阱
- 掌握卡片盒笔记法的三大核心原则（原子化、链接优于收藏、自底向上生成）及三类卡片分工
- 理解“教材即软件”的工程化范式，掌握四层架构（素材-概念-结构-呈现）与概念卡片驱动开发（CDD）流程
- 掌握大纲编排的 JSON Schema 规范（双段式标题、教学角色标注、素材溯源）与语义化版本控制策略
- 运用 MECE 原理与金字塔原理进行章节划分，熟练应用七大教学角色标注体系设计教学导向大纲
- 建立四级素材溯源链条，保证教材内容的可验证性与学术严谨性
- 能识别并规避卡片碎片化、标签替代链接、大纲百科全书式罗列等典型反模式
concept_map:
- 认知重塑与教材工程化
- ├── 认知重塑：从被动接受到主动建构
- │   ├── 核心动机：反收藏夹谬误、反编译器思维
- │   ├── 卡片盒笔记法三原则
- │   │   ├── 原子化（一卡一核心论点）
- │   │   ├── 链接优于收藏（语义关联＞分类标签）
- │   │   └── 自底向上生成（聚类长出大纲）
- │   ├── 三类卡片分工与流转
- │   │   ├── 闪念卡片（捕捉灵感）
- │   │   ├── 文献卡片（理解改写素材）
- │   │   └── 概念卡片（综合创新产出）
- │   └── 范式切换：为写作而阅读、输入驱动输出
- ├── 教材工程化：像开发软件一样构建教程
- │   ├── 核心定义：教材即代码、纯文本源文件、Git版本控制
- │   ├── 四层架构
- │   │   ├── 素材层（原始输入：PDF/网页/笔记）
- │   │   ├── 概念层（知识原子：概念卡片/中间表示IR）
- │   │   ├── 结构层（逻辑骨架：大纲/JSON Schema）
- │   │   └── 呈现层（多形态交付：PDF/网站/课件/电子书）
- │   ├── 概念卡片驱动开发（CDD）流水线
- │   │   ├── 聚类素材 -> 提炼概念卡片 -> 编排大纲节点 -> 渲染章节
- │   ├── 大纲编排规范
- │   │   ├── 双段式标题（隐喻类比+本质阐述）
- │   │   ├── 教学角色标注（7大角色非空）
- │   │   └── 素材溯源字段（src支持通配符）
- │   ├── 持续集成/多形态交付（Pandoc/Quarto/GitHub Actions）
- │   └── 语义化版本控制
- │       ├── Major：重构章节/调整逻辑骨架
- │       ├── Minor：新增知识点/案例
- │       └── Patch：修正错别字/格式
- └── 逻辑架构师：为知识搭建可执行的认知脚手架
- ├── 设计视角：教学导向＞百科全书式、服务图式构建
- ├── 章节划分原则：MECE（正交性检查表）
- ├── 结构生成方法：金字塔原理（自上而下表达、自下而上思考）
- ├── 教学角色标注体系（7大角色）
- │   ├── motivation（为什么学）
- │   ├── definition（是什么）
- │   ├── method（怎么做）
- │   ├── proof（为什么有效）
- │   ├── experiment（实战案例）
- │   ├── limitation（边界失效）
- │   └── extension（前沿拓展）
- └── 素材溯源与证据链
- '    ├── 四级溯源链：大纲节点 <- 概念卡片 <- 文献卡片 <- 原始素材'
- '    └── 引用规范：文件/页码/锚点粒度、author:xxx/** 通配'
life_analogy:
- 想象**建造一座摩天大楼（教材）**的过程：
- '- **传统手工作坊模式**：架构师（作者）脑中有图，工人（排版/编辑）用砖瓦（Word文档）堆砌。想改地基（逻辑骨架）？推倒重来。想盖分楼（课件/网站）？重新搬砖。版本靠口头传递，出错无法追溯。'
- '- **教材工程化模式（软件工程思维）**：'
- '  - **素材层 = 原材料堆场**：钢材、水泥、玻璃（PDF、网页、原始笔记），按批次入库登记（溯源）。'
- '  - **概念层 = 预制构件厂**：将原材料加工成标准化的**预制构件（概念卡片/IR）**，每个构件有唯一编号、力学参数（核心论点）、接口规范（链接理由），可独立检测合格。'
- '  - **结构层 = BIM数字蓝图（大纲JSON）**：定义构件如何组装、承重逻辑（MECE/金字塔）、施工顺序（教学角色）、符合规范校验（Schema）。蓝图是机器可读的，而非纸张。'
- '  - **呈现层 = 自动化装配线（CI/CD）**：一键启动，按蓝图将预制构件吊装、焊接，产出**主楼（学生版教材）、样板间（教师版教案）、VR看房（交互式网站）、宣传片（幻灯片）**，全程无人工干预，保证一致性。'
- '  - **版本控制 = 施工日志/图纸管理系统**：每次修改（换构件/改蓝图）自动留痕，可随时回滚到任意历史节点，协作无冲突。'
- '- **认知重塑（卡片盒法）= 预制构件的生产工艺标准**'
- '  - **原子化** = 每个构件只承担单一结构功能（一卡一论点），不做“大杂烩”构件。'
- '  - **链接优于收藏** = 构件间用螺栓/焊缝（语义链接+理由）刚性连接，而非扔在同一堆场贴标签（分类标签）。'
- '  - **自底向上** = 先造好构件，再看能拼出什么新结构（创新），而非先画好蓝图再强行切割材料填坑。'
- '- **逻辑架构师 = 总工程师/结构工程师**'
- '  - 用**MECE**检查承重路径无冗余无遗漏。'
- '  - 用**金字塔原理**从核心受力点（核心主张）反向设计传力路径（章节节点）。'
- '  - 用**教学角色**标注每个构件的功能：地基、承重墙、管线、装饰面，防止“全是装饰面（定义）没地基（动机）”。'
summary:
- concept: 收藏夹谬误/编译器思维
  desc: 误以为保存/搬运信息等于掌握知识，忽视主动连接与结构化组织的内化过程
- concept: 卡片盒笔记法三原则
  desc: 原子化（一卡一论点）、链接优于收藏（语义关联）、自底向上生成（聚类长出大纲）
- concept: 三类卡片
  desc: 闪念卡片（捕捉）、文献卡片（理解/改写）、概念卡片（综合/创新），形成演进流转链
- concept: 教材即代码
  desc: Markdown纯文本源文件纳入Git版本控制，实现可追溯、可协作、可自动化构建
- concept: 四层架构
  desc: 素材层(原始输入) -> 概念层(知识原子/IR) -> 结构层(大纲/Schema) -> 呈现层(多形态交付)，内容与形式分离
- concept: 概念卡片驱动开发(CDD)
  desc: 以概念卡片为唯一中间表示(IR)，标准化流水线：聚类素材->提炼卡片->编排大纲->渲染章节
- concept: 双段式标题/角色标注/溯源字段
  desc: 大纲JSON Schema三大强制约束：隐喻+本质标题、7大教学角色非空、素材引用非空
- concept: 语义化版本控制
  desc: Major(重构骨架)/Minor(增知识点)/Patch(改错字)，自动生成CHANGELOG
- concept: MECE原则
  desc: 章节划分相互独立(无耦合)、完全穷尽(无盲区)，配套正交性检查表
- concept: 金字塔原理
  desc: 自上而下表达(定核心主张)、自下而上思考(纵向提问/横向归纳分解节点)，保证逻辑闭环
- concept: 七大教学角色
  desc: motivation/definition/method/proof/experiment/limitation/extension，防止‘全定义无动机无实战’
- concept: 四级溯源链
  desc: 大纲节点 <- 概念卡片 <- 文献卡片 <- 原始素材，引用粒度达文件/页码/锚点
exercises:
- 'no': 1
  title: 诊断与重构：从“收藏夹”到“概念卡片”
  contents:
  - 场景：你在阅读《Transformer架构原理》一篇论文时，高亮了 20 处公式、保存了 5 个 GitHub 代码链接、在阅读软件里写了 3 条划线备注。
  - 任务：
  - 1. 指出这种做法属于哪种认知陷阱？为什么无法形成长期记忆？
  - 2. 尝试将其中一个核心公式（如缩放点积注意力公式）转化为一张**概念卡片**，要求包含：核心论点（原子化）、用自己语言改写的直觉解释、与你已有卡片（如“RNN长距离依赖问题”）建立的**语义链接及链接理由**。
  - '3. 思考：若只打标签 #注意力机制 #Transformer，缺少什么关键要素？'
- 'no': 2
  title: 教材工程化落地：配置最小可行性流水线
  contents:
  - 场景：团队决定用 Markdown + Git + GitHub Actions 管理一本《Python数据分析实战》教材。
  - 任务：
  - 1. 设计仓库目录结构，体现四层架构（素材/概念/结构/呈现），说明各层存放什么文件格式。
  - 2. 编写一个概念卡片的 Markdown 模板（Front Matter 包含哪些必填字段？），使其能作为 CDD 流水线的标准输入（IR）。
  - 3. 设计大纲 JSON Schema 的核心字段，必须强制包含：双段式标题、教学角色（枚举7种）、素材溯源（引用概念卡片ID）。
  - 4. 概述 GitHub Actions 工作流步骤：从 PR 提交概念卡片 -> Schema 校验 -> 合并主干 -> 并行渲染学生版/教师版/网站。
  - 5. 定义语义化版本发布规则：什么情况升 Major？什么情况升 Minor？如何自动生成 CHANGELOG？
- 'no': 3
  title: 大纲手术：将“百科全书式目录”重构为“教学导向大纲”
  contents:
  - 给定一个‘百科全书式’章节目录：
  - 第1章 注意力机制概述
  - 第2章 注意力数学公式
  - 第3章 多头注意力
  - 第4章 位置编码
  - 第5章 注意力可视化
  - 任务：
  - 1. 运用 MECE 原理分析该目录存在的耦合与遗漏问题（如：概述与公式是否重叠？缺少动机？缺少边界讨论？）
  - 2. 确定本章的**核心主张**（金字塔原理顶点），例如：“注意力机制是通过动态资源分配解决序列建模长距离依赖的核心范式”。
  - 3. 从核心主张出发，纵向提问（怎么实现？/为什么有效？/边界在哪？）横向归纳（覆盖哪几个子空间？），重新设计 5-6 个节点，每个节点必须：
  - '   - 采用双段式标题（隐喻类比 + 本质阐述）'
  - '   - 标注主教学角色（从7大角色中选1-2个主次）'
  - '   - 列出支撑该节点所需的概念卡片 ID 列表（模拟溯源）。'
  - 4. 对比重构前后，说明新大纲如何降低认知负荷、服务图式构建。
- 'no': 4
  title: 反模式识别与修正
  contents:
  - 判断下列做法是否违反本章原则，若违反请指出具体原则并给出修正方案：
  - '1. 作者在 Obsidian 中创建笔记《注意力机制》，全文复制粘贴论文摘要、引言、实验结论，并打上 #NLP #Transformer 标签，认为完成了卡片制作。'
  - '2. 教材大纲节点《3.1 多头注意力》仅标注 role: definition，内容包含公式推导、代码实现、消融实验分析。'
  - 3. 团队直接在 Word 文档中协作编写教材，通过文件名 `chapter1_v1.docx`、`chapter1_v2_final.docx` 管理版本，发布课件时人工复制粘贴到
    PPT。
  - '4. 概念卡片引用素材时，src 字段填写 `paper: "Transformer论文"`，未指定具体页码或段落锚点。'
  - 5. 大纲编排时，先拟定 12 个章节标题，再强行将手头零散卡片分配填充进各章节，缺卡片的章节临时从网上搜资料补齐。
