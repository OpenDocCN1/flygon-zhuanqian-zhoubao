paper: docs/202304/20230418_039.md
desc: 该素材为《跨境电商领域的 ChatGPT 应用指南 v1.0》的开篇部分，作者希声于2023年4月发布。核心内容确立了利用 ChatGPT 通过结构化提示词辅助跨境电商运营的指导框架，并以“撰写谷歌广告词”为首个具体应用场景，展示了赋予角色、明确任务、设定输出约束（语言、字数限制、营销效果）的标准化提示词范式。
concepts:
- name: 跨境电商 ChatGPT 应用指南
  desc: 一套面向跨境电商从业者的实操指南体系，旨在通过标准化的提示词工程方法，将 ChatGPT 应用于选品、文案、广告、客服等全流程场景，提升运营效率。
  is_original: true
  excerpt:
  - 效率飙升！跨境电商领域的 ChatGPT 应用指南 v1.0
  - 这是一篇随性写的文章，因为还没做系统的整理，想到哪写到哪，作为第一个版本先发布
- name: 结构化提示词范式
  desc: 素材隐含提出的提示词编写标准模式：包含角色设定、任务定义、输出约束（格式、字数、语言、质量要求）四大核心要素，用于稳定大模型输出质量。
  is_original: true
  excerpt:
  - 提示词： 现在你是一名谷歌广告的编写人员，你需要为 xxx 产品写 10 条谷歌广告标题和谷歌广告描述。要求是： 1.用英文输出你的答案。 2.广告的标题和广告描述的字数等要符合谷歌的标准。
    3.广告要引人入胜，让人有下单的欲望。
methods:
- name: __overview__
  desc: 采用“场景驱动 + 结构化提示词” 的整体方法论。针对具体业务场景（如谷歌广告投放），通过构建包含角色、任务、约束的标准化 Prompt，调用 ChatGPT
    生成符合平台规范且具备转化潜力的专业内容。
  excerpt:
  - 1.写谷歌广告词。
  - 提示词： 现在你是一名谷歌广告的编写人员，你需要为 xxx 产品写 10 条谷歌广告标题和谷歌广告描述。要求是： 1.用英文输出你的答案。 2.广告的标题和广告描述的字数等要符合谷歌的标准。
    3.广告要引人入胜，让人有下单的欲望。
- name: 谷歌广告文案生成法
  desc: 针对 Google Ads 特性的专用 Prompt 构建方法：指定模型扮演资深广告文案，输出符合 RSA（响应式搜索广告）字数限制的标题与描述组合，强调合规性与说服力并重。
  excerpt:
  - 提示词： 现在你是一名谷歌广告的编写人员，你需要为 xxx 产品写 10 条谷歌广告标题和谷歌广告描述。要求是： 1.用英文输出你的答案。 2.广告的标题和广告描述的字数等要符合谷歌的标准。
    3.广告要引人入胜，让人有下单的欲望。
theorems:
- name: 角色扮演与约束显著提升专业内容生成质量
  desc: 核心主张：通过在 Prompt 中明确赋予专业角色（如谷歌广告编写人员）并显式列出硬性约束（平台字数标准、语言、营销目标），可引导大模型输出可直接投产的高质量垂直领域内容，而非泛泛而谈。
  excerpt:
  - 现在你是一名谷歌广告的编写人员... 要求是： 1.用英文输出你的答案。 2.广告的标题和广告描述的字数等要符合谷歌的标准。 3.广告要引人入胜，让人有下单的欲望。
- name: 迭代版本化发布策略
  desc: 核心主张：面对快速演进的 AI 能力与复杂业务场景，采用 v1.0 先行发布、持续迭代更新的策略，优于追求一次性系统性整理，能更快落地价值并收集反馈。
  excerpt:
  - 这是一篇随性写的文章，因为还没做系统的整理，想到哪写到哪，作为第一个版本先发布，如果大家喜欢，后续会继续更新。
findings:
