  desc: '[claim] 使用该结构化提示词可生成符合谷歌广告字数标准、英语表达地道且具备转化导向的标题和描述。素材为 v1.0 版本首发，未附带实测数据表现或
    A/B 测试对比，属作者基于提示词工程经验的理论宣称。'
