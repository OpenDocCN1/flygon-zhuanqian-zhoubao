life_analogy:
- 想象 RAG 系统是一个**企业级智能知识管理中心**：
- '- **文档解析与分块** = **专业档案整理员**：将杂乱无章的原始资料（PDF、代码、表格）按章节、函数、行拆分成标准化‘知识卡片’，并加上重叠便利贴防止上下文丢失'
- '- **向量索引与混合检索** = **双模检索员团队**：语义检索员（向量）擅长‘找意思相近的’；关键词检索员（BM25）擅长‘精准找错误码、型号’，两人合作再由**融合策略（RRF）**裁定最终名单'
- '- **重排序与压缩** = **首席分析师 + 摘要专员**：初筛名单交给分析师精读打分，踢走噪音；摘要专员将长篇大论压缩成‘核心证据清单’，只留决策所需干货'
- '- **查询重写与路由** = **需求分析师 + 导航员**：把老板模糊的一句‘对比一下’拆解成三个具体子任务，并指派去结构化数据库查表、去文库找文档、去网上搜最新资讯'
- '- **评估与飞轮** = **质检部 + 持续改进办**：每周用标准考卷测系统，哪个环节丢分就优化哪个，自动生成新训练数据喂回系统'
- '- **Agentic RAG** = **资深项目经理**：不再死板走流程，而是自主判断‘要不要查’、‘查完靠不靠谱’、‘需不需要再查一次’，直到拿出满意交付物'
- '- **安全合规** = **保密办 + 法务**：文件分级归档、敏感信息打码、借阅登记审批、操作留痕可查，确保知识资产不外泄'
summary:
- concept: Naive/Advanced/Modular RAG
  desc: 从线性流程到标准化组件接口的演进，解耦索引、检索、生成实现策略即插即用
- concept: 分块策略
  desc: 固定/语义/层级/Agentic 四大流派，核心权衡语义完整性与检索粒度，无银弹需按文档类型决策
- concept: 混合检索
  desc: 稠密向量（语义模糊）+ 稀疏 BM25（关键词精准）+ RRF 融合，双保险覆盖多样查询需求
- concept: 重排序
  desc: Cross-Encoder/LLM 对 Top-K 精细打分，解决 Bi-Encoder 召回精度不足，延迟换精度
- concept: 上下文压缩
  desc: 抽取/摘要/Token级压缩，在 Lost-in-the-Middle 与 Token 成本约束下最大化信噪比
- concept: 查询重写
  desc: HyDE、子查询分解、历史改写，将用户模糊意图翻译为检索友好的结构化查询集合
- concept: 查询路由
  desc: 意图分类后动态分发至向量库/图谱/SQL/Web，解决异构数据源统一接入问题
- concept: RAGAS/ARES
  desc: 忠实度、答案相关性、上下文精确率/召回率四大核心指标，配合合成测试集构建自动化评测闭环
- concept: GraphRAG
  desc: 实体关系图谱+社区层级摘要，擅长全局汇总与跨文档多跳推理，构建成本高适合静态知识
- concept: Agentic RAG
  desc: 检索工具化+Agent自主规划循环，解决复杂任务动态决策需求，引入非确定性需设置预算兜底
- concept: 流式响应/语义缓存
  desc: 流式降低首包感知延迟，语义缓存命中高频 FAQ 大幅降本增效，需防缓存污染与失效策略
- concept: 故障四类诊断树
  desc: 未命中/噪声/幻觉/格式错误 -> 定责模块 -> 指标异常 -> 根因验证 -> 缓解方案，标准化排查流程
- concept: RAG 与微调协同
  desc: 高频动态事实走 RAG，低频深层模式走微调，持续预训练+SFT+RAG 三层组合为最佳实践
- concept: 多模态 RAG
  desc: 文本/表格/图像统一解析、嵌入、生成管线，核心难点在表格结构化、图表推理与多模态对齐
- concept: 安全合规体系
  desc: 租户隔离、敏感脱敏、检索 ACL、审计日志四道防线，满足企业级数据红线与监管要求
exercises:
- 'no': 1
  title: 分块策略对比实验
  contents:
  - 给定一份 50 页的技术 PDF 文档（含标题层级、代码块、表格），分别实现：
  - 1. 固定长度分块
  - 2. 基于 Markdown 标题层级的递归分块
  - 3. 语义相似度分块
  - 对比指标：平均块长、标题完整率、代码块完整率、检索召回率（构建 20 条测试问答）
  - 回答问题：
  - '- 何种场景下固定长度分块反而优于语义分块？'
  - '- chunk_overlap 设为 0 会导致什么典型检索失败案例？'
- 'no': 2
  title: 混合检索融合算法实现与调优
  contents:
  - 实现一个混合检索器，输入 Query，并行输出：
  - 1. 向量检索 Top-20
  - 2. BM25 检索 Top-20
  - 3. 实现 RRF（k=60）融合
  - 4. 实现加权求和融合（需解决分数归一化）
  - 在同一测试集上对比 Recall@10、MRR、延迟
  - 回答问题：
  - '- 为什么 RRF 通常比加权求和更鲁棒？'
  - '- 当向量检索与 BM25 召回结果完全不重叠时，RRF 表现如何？'
- 'no': 3
  title: RAGAS 评测流水线搭建
  contents:
  - 基于某垂直领域文档库（如 100 份合同），构建评测流程：
  - 1. 使用 LLM 生成 200 条合成 QA 对（含单跳、多跳、不可答）
  - 2. 人工抽检 50 条校准质量
  - 3. 跑通 RAGAS 评测：计算 Faithfulness、Answer Relevancy、Context Precision、Context Recall
  - 4. 修改分块大小或 Top-K，重跑评测对比指标变化
  - 回答问题：
  - '- LLM-as-a-Judge 评估忠实度时，常见的‘位置偏好’偏见如何通过 Prompt 工程缓解？'
  - '- 离线指标提升 5% 但线上 A/B 测试无显著差异，可能原因有哪些？'
- 'no': 4
  title: 故障诊断演练：从‘答非所问’到根因定位
  contents:
  - 现象：用户问‘公司 2023 年差旅报销标准’，系统回答‘2021 年标准是...’
  - 请按诊断树逐步排查：
  - 1. 检查索引是否包含 2023 年文档
  - 2. 检查分块是否切断了年份上下文
  - 3. 检查查询重写是否提取了年份实体
  - 4. 检查重排序是否将旧文档排在前面
  - 5. 检查 Prompt 是否强制引用来源与时间
  - 给出每一步的验证命令/日志查询方法，并制定修复方案与回归测试用例
- 'no': 5
  title: Agentic RAG 核心循环最小原型
  contents:
  - 使用 LangGraph 实现一个极简 Agentic RAG：
  - 状态：query, context, answer, steps
  - 节点：
  - 1. rewrite_query (LLM 改写/分解)
  - 2. retrieve (向量/BM25/Graph 三选一工具调用)
  - 3. grade_docs (LLM 打分是否相关)
  - 4. generate (生成答案)
  - 5. reflect (LLM 判断答案是否完整/有幻觉，决定循环或结束)
  - 边：grade_docs 低分 -> rewrite_query；reflect 不通过 -> retrieve
  - 设置最大步数 5，运行 3 个复杂多跳问题，观察轨迹
  - 回答问题：
  - '- 如何防止 Agent 陷入‘重写->检索->低分->重写’的无限循环？'
  - '- 将检索器封装为 Tool 相比固定 Chain 调用，在错误恢复能力上有何本质区别？'
