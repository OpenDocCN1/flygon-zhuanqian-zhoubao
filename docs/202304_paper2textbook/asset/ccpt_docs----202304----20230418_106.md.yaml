paper: docs/202304/20230418_106.md
desc: 本素材是一篇技术实战分享帖，作者邹培盛详细记录了如何利用影刀 RPA（Robotic Process Automation）工具，在“生财有术”2023年全国见面会微信群中，自动化爬取
  7 天内 9000+ 份微信红包数据的全过程。文章以非技术视角普及了 RPA“软件的软件”定位与可视化编程特性，系统拆解了“手动操作→步骤梳理→模块开发→运行测试→修复
  BUG”的 5 步 RPA 开发方法论，重点解决了异形红包识别、封面图遮挡滑动、干扰元素排除、去重存储、结束标志判定及异常捕获等关键技术难点，最终通过 Excel
  数据透视表完成数据分析呈现，旨在展示 RPA 在非标准化、无 API 场景下的自动化能力，并引导读者识别自身业务中的高频重复场景以实现“超自动化”。
concepts:
- name: RPA（机器人流程自动化）
  desc: 定义为‘软件的软件’，核心是模拟人类在计算机上执行操作（鼠标、键盘、指令），结合可视化编程/低代码积木块、AI 识别技术（OCR、图像识别、NLP），实现对第三方软件/APP
    的非侵入式自动化控制。
  is_original: false
  excerpt:
  - RPA（Robotic Process Automation，即机器人流程自动化），这是一种通过软件模拟人类在计算机上执行操作的技术...
  - 按我的理解，RPA 可以定义为”软件的软件“，它的核心功能是可以模仿人类的操作...把这两项能力结合起来，加上人工智能技术的文本识别、图像识别和自然语言处理，RPA
    就能“看见”它要操作的软件...
  - RPA 软件大多是属于“可视化编程”或是“低代码”，就是把操作其他软件的各项基础能力，包装成一个个积木块...
- name: 元素识别 vs 图像识别
  desc: RPA 中定位 UI 控件的两种核心策略：图像识别依赖像素匹配，易受界面变化干扰；元素识别基于应用层级结构（如 Accessibility ID、Resource
    ID）定位控件，抗干扰性强，可解决异形红包、界面缩放移动等问题。
  is_original: false
  excerpt:
  - 异形红包：颜色或外形跟普通的红包不同，用图像作为识别的话可能会被略过，所以不能用“图像”识别，需要用“元素”来识别出红包...
- name: 非侵入式数据采集
  desc: 针对无法复制、无开放 API 的场景（如微信红包详情页），利用 RPA 的 OCR/元素文本提取能力，直接读取屏幕渲染文本，绕过前端交互限制实现数据获取。
  is_original: false
  excerpt:
  - 当你打开一个红包时，会发现里面的群友名字和金额，是没法直接复制的...但是用 RPA，是可以直接识别到这些文字内容，按原样保存。这类“不可复制”的情况在很多网页、软件和
    APP 的场景里是常有的，也是使用 RPA 的一个优势。
- name: 超自动化
  desc: 作者业务定位概念，指通过 RPA 结合 AI 等技术，将中小企业和超级个体的业务流程实现端到端的自动化运作，超越单一任务自动化。
  is_original: true
  excerpt:
  - 在做量化交易和流程咨询，也在用 RPA 帮中小企业和超级个体将业务流程“超自动化”运作。
- name: 作品三台阶理论
  desc: 作者对个人作品/产品价值的分层模型：1. 展示型（哇塞，看能力）；2. 工具/方法型（啊哈，可用）；3. 痛点解决型（我要，大众刚需）。用于指导个人品牌建设与产品设计。
  is_original: true
  excerpt:
  - 作品类可以分三个台阶：1. 展示型作品——“哇塞”... 2. 属于工具或方法——“啊哈”... 3. 常见场景可用——“我要”...
methods:
- name: __overview__
  desc: RPA 应用开发标准 5 步法：手动操作（含异常场景枚举） → 步骤梳理（流程图：顺序/循环/分支） → 模块开发（关键步骤优先，可视化拖拽） →
    运行测试（边写边测） → 修复 BUG（异常捕获与容错）。
  excerpt:
  - 在我做一个 RPA 机器人的时候，一般会分成这 5 个步骤：手动操作-步骤梳理-模块开发-运行测试-修复 BUG，可以完成一个小应用的开发。
  - 其实不止是 RPA，所有的编程语言，都是在对机器做一次“操作流程”培训，内容其实也非常清晰，因为流程无非只有三种：顺序（逐个去做的）、循环（重复做的）和分支（判断要不要做的）。
- name: 异常场景预判与处理模式
  desc: 针对 APP 自动化的高不确定性，建立‘识别异常→定义恢复动作→封装 Try-Catch 结构’的标准化处理范式。包含：异形红包（元素识别兜底）、封面遮挡（滑动收起）、干扰元素/过期红包（识别后强制返回群聊）、未知错误（Try
    块捕获并执行恢复流程）。
  excerpt:
  - 异形红包...需要用“元素”来识别...
  - 红包封面图...需要加一步灵魂操作——向上轻轻滑动一下屏幕，图片或视频就会收起...
  - 干扰元素...这些情况都需要识别出来，返回到群聊里，才能继续。
  - 对于重复执行的步骤，我都会放在用“Try”指令里面，在遇到一些没有考虑到的干扰时，不会马上报错终止程序，而是自动进入处理异常的步骤...掌握“处理异常”的方法，是初学者迈出新手村的标志。
- name: 滑动距离参数化校准法
  desc: 针对影刀 RPA 滑动指令仅支持‘滑动时长’控制距离的特性，通过实测建立‘滑动区域选择 + 滑动时长’的经验参数表：群聊列表滑动（全窗口区域，500ms）；红包详情页滑动（发红包人名字区域，200ms）。
  excerpt:
  - 滑动屏幕：这一步原以为简单，实操时却花了好些时间才调试好...影刀目前对滑动屏幕的操作只能通过在选定的区域内的“滑动时间”来控制滑动的距离...提供两个参考的设置：群聊界面选择整个群聊窗口作为滑动区域，滑动时间为
    500 毫秒；红包内是选择发红包人的名字作为滑动区域，滑动时间为 200 毫秒。
- name: 字典去重与末尾标志终止判定法
  desc: 数据采集层面的两大核心逻辑：1. 利用字典键值对唯一性（Key=群成员名）在采集源头天然去重，解决翻页重复读取问题；2. 采集循环终止条件设定为‘连续两次采集最后一条记录的
    Key 相同’，判定已滑动至列表底部。
  excerpt:
  - 去除重复：获取数据时，去重总是必要的一步...这次我是从源头解决，在获取红包数据时使用“字典”存储，因为一个红包里，每个群成员只能抢一次，即使在翻页时重复获取，因为字典类型里键值对的特性，同一个名字也只能存在一个。
  - 结束标志：我用的是对比每次获取数据的最后一个群成员名字，和上一次的最后一位是否相同，滑到底部时就会出现重复，说明已经获取了红包里全部的数据，可以返回群聊了。
- name: Excel 透视表多维分析建模法
  desc: 将 RPA 采集的非结构化/半结构化原始数据（底表）通过透视表建模：以‘发红包群友’为行标签、‘抢红包群友’计数为值分析发包维度；以‘抢红包群友’为行标签、‘时间’计数为值分析抢包维度；支持手气最佳/最差、参与度等指标快速计算。
  excerpt:
  - 1. 抓取的原始数据放在“底表”，用来生成 2 和 3 的透视表。 2. 发出红包是用“发红包群友”为主体，红包份数可以将“抢红包群友”的数量做计数...
    3. 抢到红包的数量是用时间做计数，因为群里的红包都是不同时间（分钟级）发出的。
theorems:
- name: RPA 适用性核心判据：高频、重复、有界、无 API
  desc: RPA 最大价值不在于替代代码开发，而在于解决‘有界上下文内、高频重复、目标系统无开放 API/不支持脚本、需模拟人工操作’的自动化需求。微信生态封闭、红包数据不可复制、无导出接口，是典型
    RPA 必选场景。
  excerpt:
  - 这类“不可复制”的情况在很多网页、软件和 APP 的场景里是常有的，也是使用 RPA 的一个优势。
  - 简单，意味着可以有更高的开放性，也同样能让更多有想法、有痛点的人，可以迈过开发的门槛，让想法得以实现。
  - 理解编程思维，更懂 AI 才能用得更好；掌握操控“软件的软件”，让我们在众多新工具涌现时能够有“影分身”帮我们干活。
- name: 可视化编程降低创新门槛论
  desc: 低代码/可视化编程（积木式）虽封装了底层复杂度，但未降低上限，反而通过极大降低‘从 0 到 1’的门槛，释放非技术人群的创造力，使‘有想法、有痛点’者能直接将业务逻辑转化为可运行自动化流程，类比《我的世界》积木与
    ChatGPT 输入框的开放性。
  excerpt:
  - 简单，意味着可以有更高的开放性，也同样能让更多有想法、有痛点的人，可以迈过开发的门槛，让想法得以实现。就像现在大热的 ChatGPT 或 AI 绘画同样如此，一个产品的界面只有一个输入框...所以对于这类具备较高开放性的工具，值得研究一番，提升搞钱效率。
- name: 技术变现闭环原则：场景应景 + 能力结合 + 稀缺性
  desc: 个人技术变现/品牌建设的三要素：1. 场景应景（生财见面会红包雨热点）；2. 能力结合（RPA 手机自动化技术栈）；3. 稀缺性/独特性（全网首发/数据量级稀缺/无人做过）。产出‘数据资产+自动化工具+复盘文档’三位一体交付物。
  excerpt:
  - 从当时最应景的场景出发，和现在做的事情结合起来，还要有点意思，想法就有了： 1. 场景：生财见面会相关话题 2. 事情：用 RPA 操作微信，批量获取数据
    3. 有趣：统计一下群里的红包数据，这没人做过（也少有机会能达到这个数量) 4. 作品有三份：红包数据、RPA 应用和精华文:)
findings:
- name: 红包雨核心统计指标
  desc: '[evidence] 基于 7 天采集数据的统计发现：单个红包（多为 50 份）抢完中位数约 4 秒；总红包份数超 9000 份（前两天数据缺失按日均
    1000+ 推算）；单个红包手气最佳 76.42 元（200 元/5 份）；单个红包手气最差 0.06 元（均值约 4 元/份背景下）。'
  excerpt:
  - 1. 4 秒：每个发出的红包（大部分为 50 份）被抢完的时间约为 4 秒。 2. 9000 份：在抓取数据时，最开始两天的很多红包已经打不开，按有记录的每一天
    1000+推算，群里一共发出的红包份数超过 9000。 3. 76.42 元：手气最佳的群友... 4. 0.06 元：某位非酋群友...
- name: 作者个人红包手气分布
  desc: '[evidence] 作者徒手抢 38 个红包，平均金额 3.9 元，接近全群均值（约 4 元），符合大数定律期望，验证了红包分配算法的随机公平性。'
  excerpt:
  - 不过可以放出我自己的数据，徒手抢了 38 个红包，平均 3.9 元，相当标准的均值了。
- name: RPA 采集技术可行性验证
  desc: '[evidence] 影刀 RPA 在真实微信群高并发红包场景下，成功实现了百余个红包的自动化打开、数据提取（含不可复制文本）、异常处理（封面遮挡、异形识别、干扰元素）与循环终止，验证了‘元素识别+可视化流程+异常捕获’技术路线在移动端非结构化
    APP 自动化中的工程可行性。'
  excerpt:
  - 显然我并不是“蓄谋已久”地要搞事情...确定想法后，接着就可以开始捋一下实现思路了。
  - 具体的编程内容在这里就不展开讲解了，只提几个关键的地方...可以完成一个小应用的开发。
  - 用这样一个框架处理完数据，即使是“闹着玩”的小项目，看起来好像也有点能随时拿来做汇报的感觉
- name: 滑动操作参数敏感性实测结论
  desc: '[evidence] 影刀 RPA 滑动指令的‘滑动时长’与位移距离呈非线性正相关，且强依赖‘滑动区域’的选择：同一时长下，全窗口区域滑动距离 >
    局部元素区域滑动距离。需针对不同页面结构分别校准参数（群聊列表 500ms/全屏 vs 红包详情 200ms/名字区域），无通用默认值。'
  excerpt:
  - 滑动屏幕：这一步原以为简单，实操时却花了好些时间才调试好...比如同样是下图的这个屏幕中的方块区域，滑动时间设置为 200 毫秒，会比 800 毫秒的距离更远。提供两个参考的设置：群聊界面选择整个群聊窗口作为滑动区域，滑动时间为
    500 毫秒；红包内是选择发红包人的名字作为滑动区域，滑动时间为 200 毫秒。
- name: Try-Catch 异常捕获对流程鲁棒性的关键作用
  desc: '[claim] 作者主张掌握‘处理异常’（Try-Catch 机制）是 RPA 初学者进阶的分水岭。[evidence] 实测中将所有重复执行步骤包裹在
    Try 块中，使流程在遇到未预判干扰（如意外弹窗、识别偏移）时不崩溃终止，而是跳转至预设恢复逻辑（如强制返回群聊主界面），保障了 7 天长时任务的无人值守运行。'
  excerpt:
  - 对于重复执行的步骤，我都会放在用“Try”指令里面，在遇到一些没有考虑到的干扰时，不会马上报错终止程序，而是自动进入处理异常的步骤...可以说掌握“处理异常”的方法，是初学者迈出新手村的标志。
