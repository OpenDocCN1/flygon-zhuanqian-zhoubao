  - MultiHead(Q, K, V) = Concat(head_1, ..., head_h)W^O where head_i = Attention(QW_i^Q,
    KW_i^K, VW_i^V)
  - 多头注意力允许模型联合关注来自不同位置的不同表示子空间的信息。
  - 实验表明：不同注意力头学会了不同的语言学关系，如句法依赖、共指消解、位置感知等。
- 'no': 4
  name: 位置编码 —— 给序列注入“时间感”
  points:
  - '**为什么需要这个概念？**'
  - '- 自注意力是排列等变的（Set Operation），打乱输入顺序输出同步打乱，模型天然‘不懂顺序’'
  - '- 语言高度依赖语序：‘狗咬人’ vs ‘人咬狗’ 语义截然不同，必须显式注入位置信息'
  - '- 位置编码需满足：唯一性（每位置唯一）、相对性（便于建模相对距离）、外推性（泛化到训练长度之外）'
  - '**核心定义**'
  - '- 绝对位置编码（正弦/余弦）：PE(pos, 2i) = sin(pos/10000^{2i/d}), PE(pos, 2i+1) = cos(...)'
  - '- 可学习绝对编码：nn.Embedding(max_len, d_model)，随数据训练，但无外推能力'
  - '- 相对位置编码：仅建模位置差 Δ = i-j，如 T5 的相对偏置、RoPE 旋转位置编码'
  - '- RoPE (Rotary Position Embedding)：将位置信息通过旋转矩阵注入 Query/Key，实现相对位置感知且保持内积形式'
  - '**关键性质**'
  - '- 正弦编码：线性关系允许模型轻易学会相对位置（PE_{pos+k} 可表示为 PE_pos 线性组合）'
  - '- RoPE：内积 <q_m, k_n> 仅依赖于相对位置 m-n，天然支持相对注意力；且可外推至更长序列'
  - '- 可学习编码：表达力强但受限于 max_len，超长序列需插值或截断，性能下降'
  - '**典型例子**'
  - '- BERT：可学习绝对位置编码，max_len=512，超长需截断或模型并行'
  - '- GPT-3：可学习绝对位置编码，max_len=2048'
  - '- LLaMA / PaLM / GLM：采用 RoPE，支持 4k-128k+ 长上下文，无需重新训练即可外推'
  - '**边界条件**'
  - '- 绝对编码（正弦/可学习）难以外推至训练长度之外，强制外推导致注意力模式崩塌'
  - '- RoPE 在极长序列（> 训练长度 4 倍）下仍会性能下降，需 YaRN、LongRoPE 等频率缩放技术修正'
  - '- 位置编码与 Token Embedding 直接相加假设二者正交，实则存在耦合干扰，近期研究探索解耦方案'
  sources:
  - paper: 20230418_020.md
    role: origin
  - paper: B95VdtwByoPXGoxac7Ec1KhQnwc.md
    role: improve
  excerpts:
  - 由于自注意力不包含循环或卷积，为了利用序列顺序，我们必须注入位置信息。
  - 正弦位置编码：PE(pos, 2i) = sin(pos/10000^{2i/d}), PE(pos, 2i+1) = cos(pos/10000^{2i/d})
  - RoPE 通过旋转矩阵将绝对位置编码转化为相对位置编码：q_m^T k_n = (W_q x_m)^T R_{m-n} (W_k x_n)，内积仅依赖相对距离
    m-n。
  - RoPE 具有良好的外推性，可直接应用于比训练时更长的序列。
- 'no': 5
  name: 注意力可视化 —— 打开黑盒看推理
  points:
  - '**为什么需要这个概念？**'
  - '- 注意力权重直观展示模型‘看哪里’，是目前最主流的模型可解释性手段'
  - '- 验证模型是否真正学会语言学知识（句法树、共指消解），而非靠统计捷径作弊'
  - '- 诊断错误案例：翻译遗漏、幻觉生成常对应注意力分散或对齐错位'
  - '**核心定义**'
  - '- 将注意力矩阵 A ∈ ℝ^{L_tgt × L_src} 绘制为热力图，横轴源 Token，纵轴目标 Token，颜色深浅代表权重大小'
  - '- 层/头选择：通常关注编码器-解码器交叉注意力（对齐）或解码器自注意力层（依赖建模）'
  - '- 聚合视图：平均所有头、或选取特定功能头（如句法头）展示'
  - '**关键性质**'
  - '- 对齐可视化：机器翻译中，对角线主导表示单调对齐；跳跃表示语序重排（如中英定语前后置差异）'
  - '- 句法诱导：无监督情况下，某些头注意力图高度吻合依存句法树边（如主谓、动宾关系）'
  - '- 非解释性警示：注意力权重 ≠ 特征重要性；高权重不等于因果贡献大（需结合梯度/消融分析）'
  - '**典型例子**'
  - '- “The animal didn''t cross the street because it was too tired” -> “it” 与 “animal”
    高注意力，验证 Winograd Schema 挑战'
  - '- 代码生成中：变量使用处注意力回溯到定义处，展示作用域追踪能力'
  - '- 多头注意力可视化工具：BertViz, exBERT, Attention Vis'
  - '**边界条件**'
  - '- 注意力权重受残差连接、层归一化、FFN 后续层修饰，不直接等于输出贡献度'
  - '- 高熵注意力（分布均匀）不代表模型‘没看懂’，可能是任务本身需全局信息（如分类任务 [CLS] token）'
  - '- 仅可视化最后一层或平均所有层会丢失层级演化信息，需逐层分析'
  sources:
  - paper: 20230418_022.md
    role: experiment
  excerpts:
  - 注意力可视化是理解 Transformer 内部工作机制的核心窗口。
  - 热力图中，生成目标词 ‘Love’ 时，注意力权重高度集中在源词 ‘爱’ 上，实现了软对齐。
  - 注意力 ≠ 解释：高注意力权重不代表因果贡献大，需结合梯度或干预实验验证。
- 'no': 6
  name: 长序列优化与部署变体 —— FlashAttention、GQA 与外推修正
  points:
  - '**为什么需要这个概念？**'
  - '- 标准注意力 O(N²) 显存与计算瓶颈限制上下文窗口，成为 LLM 落地核心痛点'
  - '- 推理阶段 KV Cache 占用随序列长度线性增长，多头注意力头数放大显存压力'
  - '- RoPE 虽支持外推，但超出训练长度 4 倍后性能仍显著下降，需频率缩放修正'
  - '**核心定义**'
  - '- FlashAttention-2：分块计算 QK^T，利用 SRAM/HBM 带宽差异避免物化大矩阵，实现精确注意力的 IO 优化'
  - '- GQA (Grouped Query Attention)：将 h 个 KV 头压缩为 g 组 (g << h)，每组共享 K/V 投影，Q 头保持
    h 个'
  - '- 滑动窗口注意力 (SWA)：每个 Token 仅关注最近 w 个 Token，复杂度降为 O(N·w)'
  - '- YaRN/LongRoPE：通过缩放 RoPE 基础频率 θ (即修改 10000 基数)，将外推窗口扩展至训练长度 32 倍以上'
  - '**关键性质**'
  - '- FlashAttention-2：训练显存降低 2-4×，速度提升 2×，保持数学等价精度'
  - '- GQA：KV Cache 显存降低 g/h 倍 (如 8→2 头降 75%)，训练显存优势小 (Q 头不变)，推理吞吐提升显著'
  - '- SWA + 全局 Token：兼顾局部细节与全局信息，但需专用位置编码 (如 ALiBi) 配合'
  - '- YaRN：NTK-aware 缩放 + 动态插值，在 128k 上下文保持困惑度接近训练长度水平'
  - '**典型例子**'
  - '- LLaMA-2-7B-32K：RoPE + YaRN 扩展至 32k，单卡 80G 可跑完'
  - '- CodeLlama-34B：GQA (8→8 Q, 2 KV) + FlashAttention-2，单节点 8×A100 训练 16k 上下文'
  - '- Mistral-7B：滑动窗口 4096 + 全局注意力，原生支持 32k 无外推损耗'
  - '**边界条件**'
  - '- FlashAttention 需硬件支持 (Hopper/Ampere GPU)，CPU/旧 GPU 无加速收益'
  - '- GQA 训练需从预训练起或续训练，直接转换预训练权重性能损失大'
  - '- YaRN 缩放因子 s 需按 NTK 理论计算，经验公式 s = L_train / L_target × β，β 经验取 1.0-1.5'
  - '- 线性注意力近似 (RWKV/RetNet) 改变架构，需重新预训练，生态兼容性最弱'
  sources:
  - paper: 20230418_019.md
    role: method
  - paper: 20230418_063.md
    role: experiment
  - paper: B95VdtwByoPXGoxac7Ec1KhQnwc.md
    role: improve
  excerpts:
  - FlashAttention-2 通过分块矩阵乘法与在线 Softmax，实现标准注意力的精确 IO 优化。
  - GQA 将 Key/Value 头数压缩为 Query 头数的 1/4，推理显存大幅降低，训练 FLOPs 几乎不变。
  - YaRN 通过缩放 RoPE 基础频率 θ 并结合动态插值，实现 128k+ 上下文的低困惑度外推。
  - RoPE 在序列长度超出训练 4 倍时，高频分量相位旋转过快导致注意力模式退化。
