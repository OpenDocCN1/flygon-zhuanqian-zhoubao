paper: docs/202304/20230418_004.md
desc: 该素材系统阐述了初创团队寻找合伙人的核心方法论，指出单人创业易陷入管理真空，提出“志同道合、人品过硬、优势互补、性格互补、金钱观一致”五大核心筛选标准，并创新性地将“金钱观一致”作为被忽视的关键变量；揭示四大常见选人误区（短期工具人、情感投资人、纯财务投资人、大厂职业经理人）；构建“向上求、横向求、向下求”三维寻找渠道模型；确立“面试+背调”双重验证机制作为最终决策标准，强调前期严格筛选是规避后期内耗的核心策略。
concepts:
- name: 初创团队铁三角结构
  desc: 指创业合伙人团队的最佳人数配置为3人，最多不超过5人，形成决策高效、分工明确的核心领导小组。
  is_original: false
  excerpt:
  - 合伙人目前比较常见的是三人铁三角结构，最好不要超过 5 个人。
- name: 金钱观一致性
  desc: 指合伙人之间对特定金额体量的认知、分配意愿及资金使用优先级（如分配 vs 再投资）高度一致，是维持合伙关系稳定性的隐性核心变量。
  is_original: true
  excerpt:
  - 我这里还要提一个没有人提过的点：就是金钱观要一致。
  - 其实是金钱观不一致，两个人的眼里几百万人民币的体量不一致。
  - 合伙人在考虑了所有因素之外，一定还要考虑彼此对于金钱在数量上的认知要是一致或者相差不大的。
- name: 堡垒从内部攻破原则
  desc: 强调创业公司失败的主要原因往往源于合伙人内部矛盾而非外部竞争，内部治理风险大于市场风险。
  is_original: false
  excerpt:
  - 我看过太多创业公司失败都是因为合伙人之间的问题，堡垒都是从内部攻破的。
- name: 合伙人能力圈互补模型
  desc: 合伙人团队需覆盖销售/流量、产品/技术、管理/政委三大核心能力象限，形成无缺失的防御阵型。
  is_original: false
  excerpt:
  - 合伙人团队必须是在不同方面的专才，大家组合在一起才能形成一个完整没有缺失的能力圈。
  - 有擅长销售、流量的，有擅长产品设计、技术的，有擅长管理、能做政委的。
methods:
- name: __overview__
  desc: 素材整体方法论：建立‘五维筛选标准 -> 四大误区规避 -> 三维渠道搜寻 -> 双重验证机制’的合伙人全生命周期选拔体系。
  excerpt:
  - 选合伙人要从以下几点去考虑：志向是否一致、人品一定要过关、优势互补且每个人都是自己领域内的人才、性格互补、金钱观要一致。
  - 除此之外，我还要提几个常见的选择合伙人误区...
  - 我们知道了选择什么样的合伙人之后，我们一般都从什么渠道要去寻找合适的合伙人呢？向上求、横向求、向下求。
  - 合伙人必须经过面试和背调！
- name: 三维渠道搜寻法
  desc: 根据创始人资源禀赋，从向上（高阶圈层）、横向（同频同级）、向下（下属/粉丝/学弟妹）三个维度拓展合伙人候选人池。
  excerpt:
  - （1）向上求：找到比自己更厉害的圈层...
  - （2）横向求：可以在自己的同学、朋友、亲戚、以往共事过的同事...
  - （3）向下求：从比自己圈层更低一点的人群里面选择合伙人...
  - 找人的核心就是：多多宣扬自己的创业计划。
- name: 闲聊式结构化面试法
  desc: 通过非正式闲聊弱化面试压迫感，实则植入结构化考察点，通过过往经历判断专业度，通过观点爱好判断价值观/金钱观一致性。
  excerpt:
  - 如果觉得说面试太正式的话，可以“闲聊”，通过聊天来弱化面试的感觉，把面试技术套在聊天中，隐晦的实现你面试的目的。
  - 通过他的过往职业和项目经历来判断他的知识、技能等专业度是否满足你的创业项目需要，通过他的爱好或对一些事情的看法来判断他的价值观金钱观等是否和你一致。
- name: 背调授权机制
  desc: 在实施背景调查前，必须告知候选人并取得其明确同意，确保流程合规与信任基础。
  excerpt:
  - 背调之前要和候选合伙人打好招呼，说你会有这么一个动作，要取得他的同意。
theorems:
- name: 单人创业管理真空定律
  desc: 创始人独自兼任业务、管理、技术多重角色必然导致管理失控，团队产出下降非人员素质问题而是角色缺失导致的系统性后果。
  excerpt:
  - 团队合伙人角色缺失，导致创始人一个人抓业务的同时又抓管理，再兼顾着技术，一个人又当爹又当妈，最后团队自然乱成一锅粥。
  - 在现在的创业环境里，一个人包打天下的时代已经过去了。
- name: 合伙人筛选五维铁律
  desc: 志向一致(战略方向/价值观/底线)、人品过硬(诚信/守规则/德大于才)、能力互补(专才组合/全覆盖)、性格互补(冲锋与审慎/爆发与温和/摇摆与坚定)、金钱观一致(金额体量认知/分配偏好)构成不可缺失的筛选闭环。
  excerpt:
  - 选合伙人要从以下几点去考虑：志向是否一致、人品一定要过关、优势互补且每个人都是自己领域内的人才、性格互补、金钱观要一致。
  - 道不同不相为谋是自古流传下来的真理，志同道合，这是前提。
  - 选合伙人必须要考虑人品问题，如果这个人德行很差，会比没有能力但是德行很好的人更危险。
  - 如果一个合伙人是干劲十足、行动力特别强的冲锋型人物，那就需要有另一个审慎、思考细致的人。
  - 合伙人在考虑了所有因素之外，一定还要考虑彼此对于金钱在数量上的认知要是一致或者相差不大的。
- name: 选人误区四大陷阱论
  desc: 短期工具人化合伙、情感投资人化合伙、纯财务投资人化合伙、大厂职业经理人迷信，均因忽视‘长期贡献’与‘创业适配性’导致组织内耗。
  excerpt:
  - 合伙人一定要是长期并且持续对公司有贡献起作用的人...
  - 选择合伙人一定要以前面提到的因素为考量条件。
  - 合伙人一定要选择能够给公司带来资源或者有经营经验的人...
  - 大多数职业经理人并不愿意从基层干起...这些种种都是创业公司的大忌。
- name: 前期严选即后期止损原则
  desc: 前期因面子不好意思严格筛选（面试/背调），后期必承担团队解体、利益撕裂等核炸弹级后果；Be nice是最大的不负责任。
  excerpt:
  - 前期你不好意思开的口，后期都是你要背的核炸弹；前期你的 Be nice，后期真的就成了你的耐撕。
  - 合伙人必须经过面试和背调！重要的事情说三遍。
findings:
- name: e袋洗团队分裂案例
  desc: '[evidence] 案例实证：十几年挚友、价值观一致的联合创始人，因天使轮融资几百万到账时对‘金钱体量’认知差异（分红 vs 再投资）引发激烈冲突甚至绑架威胁，导致团队解散、业务失败，佐证‘金钱观一致性’独立于‘价值观一致性’且具有决定性破坏力。'
  excerpt:
  - e 袋洗这个业务...国内最早做这个业务的团队是我一个客户...
  - 然而就在第一笔几百万（ 2013 年）天使轮融资到账的时候大戏上演了...
  - 最后甚至到了创始人放话要绑架对方孩子泄愤的地步。团队自然就散了，业务也做不下去了...
  - 是两个人价值观不一致吗？不一致的话是没办法做了十几年的朋友的。其实是金钱观不一致。
- name: 艺术家创始人互补案例
  desc: '[evidence] 案例实证：创始人性格特立独行（艺术家气质、坐看宫斗）但合伙人性格互补，成功化解内部权力斗争，公司存活至E轮融资，佐证‘性格互补’可对冲创始人性格缺陷、保障组织生存。'
  excerpt:
  - 我做过顾问的一家公司，创始人是个艺术家，喜欢坐看公司各种宫斗上演...
  - 但是公司还是磕磕绊绊走下来了，目前已经是 E 轮融资的公司了，这和合伙人是创始人互补性格有很大关系。
- name: 咨询案例：单人创业管理失控
  desc: '[evidence] 素材开篇咨询案例实证：创始人单兵作战导致团队‘隐性摆烂’、营收高但不盈利，员工过往优秀现状差，根因定位为‘合伙人角色缺失’而非‘人员素质下降’，佐证单人创业管理真空定律。'
  excerpt:
  - 有个创业的男孩子来找我咨询，说目前团队的小伙伴工作产出不好、不爱沟通、隐隐摆烂的姿态...
  - 这个男孩子所遇到的问题就是上面的第 2 种情况，他是自己一个人创业，没有合伙人，公司各个方面的事情都是他一个人一把抓。
- name: 大厂职业经理人创业不适配现象
  desc: '[claim] 作者基于顾问观察宣称：大厂职业经理人普遍不愿从基层干起、不适应创业薪酬、过度依赖流程与部门支援，属创业公司大忌，不建议作为合伙人引入。'
  excerpt:
  - 大多数职业经理人并不愿意从基层干起，尤其不愿意接受创业公司的薪酬体系，他们追求程序正确，过于讲究流程制度，过于依赖相关部门的支援，这些种种都是创业公司的大忌。
