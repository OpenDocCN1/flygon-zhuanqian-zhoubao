paper: docs/202304/20230418_088.md
desc: 该素材由许义（谱见文旅创始人）撰写，核心主张普通人、小公司在创业经营中应坚持“永远只做 5%的生意”策略。文章通过旅游行业实战案例，系统阐述了为何要主动放弃
  95% 的非核心业务与非目标用户，并从定位差异化、交付质量把控、平等商业关系、专业细分聚焦、规模效应悖论、口碑长期主义六个维度，论证“5%选择”能带来品牌传播力、经营健康度、心理从容感、专业护城河、可观规模及良性口碑循环。评论区亦仁（生财有术创始人）进一步从平台生态视角补充了专注核心业务、建立机制而非
  All-in 单一项目的战略思考。
concepts:
- name: 5%生意法则
  desc: 核心经营策略，指小企业主动放弃 95% 的非核心订单、非目标用户及非擅长领域，仅聚焦于最擅长、最匹配、交付确定性最高的 5% 核心业务，以换取品牌标签感、交付确定性、商业尊严及长期复利。
  is_original: true
  excerpt:
  - 最后为什么选择上只做 5%的生意？
  - 5%是主动放弃，主动放弃的是每个近在眼前的订单诱惑，但放弃掉相互不符合的人，也会吸引来符合定位的人。
  - 5%的主动选择可以带来传播、健康、从容、专业和规模。
- name: 标签化定位
  desc: 在用户心智中建立清晰、可记忆、可传播、可推荐的品牌标签（如‘专做老年人旅行’、‘专做中产旅行’），解决‘没有特点和个性，缺少标签和坚持，很难被吸引和喜欢’的问题，是
    5% 生意的前置条件。
  is_original: false
  excerpt:
  - 用户开始喜欢美的、精致的、有格调的消费品牌，在用户面前塑造有个性、差异化、标签感明确的旅行品牌成为新旅游公司的一个努力方向。
  - 你希望用户在向别人介绍自己时说什么？
- name: 交付确定性
  desc: 指企业仅承接能力圈内业务，确保服务标准可复制、可控制、不依赖运气与外包搬运，从而规避‘把用户体验交给了运气和随机’的风险，是小企业长久健康经营的底线。
  is_original: false
  excerpt:
  - 类似这样核心领域以外的业务，旅行公司从中提供的专业价值是非常薄的，整体的交付水平都会不可控，把用户体验交给了运气和随机。
  - 超出能力范围以外的业务也会超过自身的服务交付水平，给经营留有很大的风险和缺口。
- name: 商业平等观
  desc: 主张商业本质是价值交换，双方地位平等；企业应拒绝‘用下低 3 分的态度’讨好用户，保留选择用户的权利，拒绝不尊重、过度甲方心态的客户，以维护体面、尊重与认可。
  is_original: true
  excerpt:
  - 商业的本质是价值交换，用户选择你而付费，是因为你提供了匹配价格需要的价值……这个过程双方的地位应该是平等的。
  - 好的品牌都有保持自己选择用户的权利。一个付费用户的不尊重，过于甲方心态的高姿态，应该更早地沟通和拒绝。
- name: 针状聚焦模型
  desc: 小公司生存逻辑应像‘一根伸向市场细长的针’，即标签感极强、效率极高，通过极致的专业、细分、聚焦（如雨崩村户外地接社深耕单一目的地 7 年做到绝对第一），建立不可替代的竞争壁垒。
  is_original: true
  excerpt:
  - 小公司的生存逻辑应该是什么？标签感极强、效率极高，像是一根伸向市场细长的针。
  - 只有专业、细分、聚焦才能做出明显的差异化和用户体感。
- name: 能力圈边界
  desc: 创始人精力与资源的有效覆盖范围。贪多开启新业务（如服装、牛肉、美妆、广告业务）会稀释核心业务资源，导致‘丢掉基本盘’；守住边界（暂停 100 万广告业务、不碰非旅游电商），反而能在细分赛道挖掘出‘5
    人 1000-2000 万年交易’的充分规模。
  is_original: true
  excerpt:
  - 精力放在哪里，业务产出就在哪里。贪多、不专注可能会丢掉基本盘。
  - 决定在旅游流量业务没有做的很扎实的情况下，不轻易开启新项目，包括公司已有的 100 多万收益的广告业务，我也做了暂停。
- name: 双向好评口碑飞轮
  desc: 拒绝不合适客户非拒绝生意，而是‘保留机会，保住口碑’。当成交与不成交客户都说好时，形成良性循环：好口碑吸引精准流量 -> 精准流量提高成交质量 ->
    高质量交付强化口碑。
  is_original: false
  excerpt:
  - 拒绝客户，并不是不想做生意。而是保留机会，保住口碑，当你成交和不成交的客户都会说你好的时候，你的业务反倒会慢慢变好。
  - 好的生意是相互认可后的相互成全。
methods:
- name: __overview__
  desc: 素材整体采用‘第一性原理拆解 + 反直觉策略验证 + 实战案例佐证’的方法论：先从普通人创业困境切入，提出‘只做 5%’反直觉核心主张；再拆解为定位、交付、关系、聚焦、规模、口碑六个逻辑层次；每层均以旅游行业具体场景（如全品类旅行社
    vs 细分品牌、外包南极线路 vs 自营雨崩村、接待无理客户 vs 拒客、贪多开副业 vs 守住主业）对比论证；最后升华为小企业通用经营逻辑。
  excerpt:
  - 我是普通人……创业成功很容易吗？说实话，很难。
  - 结合旅游业来说说小企业的经营逻辑。
  - 01 定位 … 02 保证交付水平 … 03 用户不是上帝 … 04 专业、细分、聚焦 … 05.5%的生意小吗？ … 06 当成交和不成交的客户都说你好
- name: 定位标签化测试法
  desc: 通过设想‘用户向朋友推荐时会怎么说’来验证定位清晰度：若用户只能说‘他们，我也说不清楚’，则定位失败；若能说出‘专做 XX 人群/品类，线路自己设计/体验很好’，则标签建立成功。
  excerpt:
  - 你希望用户在向别人介绍自己时说什么？
  - “他们，我也说不清楚，你看看吧” vs “他们专门做老年人旅行的，比较不错，可以看看公众号”
- name: 能力圈外业务熔断机制
  desc: 建立识别与拒绝超出交付能力范围业务的标准流程：识别非核心需求（如用户突发问南极） -> 发现依赖外包搬运、无专业溢价 -> 判定交付不可控 -> 主动拒单或转介绍，而非硬接单透支信用。
  excerpt:
  - 上一秒问了用户想去南极，下一秒开始在朋友圈和微信群询问，哪家可以做南极？拿到行程和方案以后，对价格稍加修改，丢给用户。
  - 遇到能力范围以外的钱，更要慎重。
- name: 客户筛选与拒单 SOP
  desc: 在销售前置环节引入‘价值匹配度’与‘尊重度’双维筛选：遇到‘过度甲方心态、不尊重、低认可’客户，启动‘更早地沟通和拒绝’程序，而非‘唯唯诺诺，一切照单’；将拒单话术标准化为‘保留机会、保住口碑’的体面表达。
  excerpt:
  - 一个付费用户的不尊重，过于甲方心态的高姿态，应该更早地沟通和拒绝，不应该是唯唯诺诺，一切照办。
  - 拒绝客户，并不是不想做生意。而是保留机会，保住口碑。
- name: 创始人精力审计与资源收缩法
  desc: 定期审视创始人精力分配与业务产出比：列出所有在手业务（主营旅游、广告业务、潜在电商品类） -> 评估各业务对核心能力圈的稀释度 -> 对非核心、高耗能、低协同业务执行‘暂停/关停’决策（如暂停
    100 万广告收入、拒做服装牛肉美妆） -> 将释放资源全量注入核心 5% 赛道深挖。
  excerpt:
  - 一下午我想了很多，决定在旅游流量业务没有做的很扎实的情况下，不轻易开启新项目，包括公司已有的 100 多万收益的广告业务，我也做了暂停。
  - 精力放在哪里，业务产出就在哪里。贪多、不专注可能会丢掉基本盘。
theorems:
- name: 小企业生存悖论：舍得舍得，有舍才有得
  desc: 主动放弃 95% 看似可得的订单与流量（舍），反而能换来品牌标签、交付确定性、商业尊严、专业护城河、细分赛道规模及口碑复利（得）。这是资源受限下小企业突破‘贪多嚼不烂’陷阱的唯一可行路径。
  excerpt:
  - 5%是主动放弃，主动放弃的是每个近在眼前的订单诱惑，但放弃掉相互不符合的人，也会吸引来符合定位的人。
  - 看得到的是眼前的失去，看不到的是未来的增长。
  - 5%的主动选择可以带来传播、健康、从容、专业和规模。
- name: 交付确定性是小企业的最高护城河
  desc: 在全面互联网时代，信息不对称消失，用户对‘一直的好人’（稳定高质量交付）的期待取代了对‘一次性惊喜’的追求。小企业仅有‘不把体验交给运气’的交付确定性，才能建立长期信任，规避‘坏的传播更快’的毁灭性风险。
  excerpt:
  - 在今天全面互联网时代的商业经营中，大部分、普通人、小公司想要长久、健康地经营下去，除了做用户心中‘一直的好人’是没有其他选择的。
  - 坏的比好的传播的更快，超出能力范围以外的业务也会超过自身的服务交付水平。
- name: 商业尊严先于短期营收
  desc: 企业必须保留‘选择用户’的权利，拒绝不匹配、不尊重的客户。牺牲体面换取的短期营收，会透支团队士气、稀释专业服务标准、污染品牌口碑，最终导致‘基本盘丢失’；守住尊严的拒单，反而能筛选出高认可度种子用户，启动口碑飞轮。
  excerpt:
  - 有的流量不要你，有的流量你也不要，做经营需要赚钱，也需要体面、尊重和认可。
  - 最后坚决保留自己的选择权，不做生意中的乙方。
- name: 细分赛道天花板远超认知
  desc: 看似微小的 5% 细分市场（如雨崩村、单一城市深度游），实则蕴含‘5 人团队年交易 1000-2000 万’的充分规模。小企业无需追求大而全的平台型体量，深耕单一细分领域至‘绝对第一’，即可获得普通人创业难以企及的财务自由与生活体面。
  excerpt:
  - 每次走到不同的城市，都能发现这个城市还有人做这个的做那个的，做的都很好，5 个人 1000 万-2000 万的年交易，对于大部分、普通人、小公司，这个生意小吗？
  - 仅仅旅游业务的空间，其实已经够我挖很久了。
findings:
- name: 全品类旅行社模式失效证据
  desc: '[evidence] 素材观察到：大部分缺乏定位的旅行社业务涵盖‘机票、酒店、跟团游、定制游、会议、团建、亲子……’，但‘很少被用户记忆、传播和推荐’，甚至携程也‘很少有用户向周围推荐自己的预定来自携程’，印证了无标签、无专业溢价的大而全模式在存量市场失效。'
  excerpt:
  - 大部分公司是缺少明显定位的，很多公司的业务范围涵盖：机票、酒店、跟团游、定制游、会议、团建、亲子……
  - 一个没有定位、缺少标签的旅行公司很少被用户记忆、传播和推荐，即便携程，也很少有用户向周围推荐自己的预定来自携程
- name: 雨崩村户外地接社深耕案例
  desc: '[evidence] 朋友创业 7 年深耕雨崩村单一目的地：从地接社起步 -> 自建酒店 -> 驻村摄影师 -> 全职领队 -> 闭环资源管理，最终做到该目的地‘体量绝对第一’。验证了‘针状聚焦模型’能构建从资源布局到服务交付的全链路竞争壁垒，实现专业变现。'
  excerpt:
  - 7 年前的一家户外地接社进入雨崩，到今天做到了这个目的地体量的绝对第一，在丽江、香格里拉、雨崩村自建酒店，因为发团高频，可以驻村设置摄影师为用户拍照，建立自己的全职领队，从布局资源到用户体量，从服务交付到闭环管理，竞争力和标签慢慢显现。
- name: 作者自营品牌聚焦决策实证
  desc: '[evidence] 作者面对‘服装、牛肉、美妆、广告业务（100 万收益）’多重扩张诱惑，经‘精力审计’后决定‘暂停广告业务、不碰非旅游电商’，将资源聚焦旅游搜索流量品牌‘即刻下单’。该决策验证了‘能力圈边界’管理的实操性：主动放弃确定性现金流，换取核心赛道深挖的确定性增长。'
  excerpt:
  - 服装能不能做？牛肉能不能做？美妆能不能做？诚实说，我非常心动。
  - 决定在旅游流量业务没有做的很扎实的情况下，不轻易开启新项目，包括公司已有的 100 多万收益的广告业务，我也做了暂停。
- name: 细分旅游赛道规模实测数据
  desc: '[evidence] 作者实地调研发现：多个城市均存在‘5 人团队、年交易 1000-2000 万’的细分旅游玩家。该数据支撑‘5% 生意不小’的结论，打破‘细分市场天花板低’的认知偏差，证明普通人小团队深耕垂类可达成优质生存规模。'
  excerpt:
  - 每次走到不同的城市，都能发现这个城市还有人做这个的做那个的，做的都很好，5 个人 1000 万-2000 万的年交易，对于大部分、普通人、小公司，这个生意小吗？
- name: 亦仁平台化专注策略印证
  desc: '[claim] 亦仁在评论区披露生财有术策略：不以赚最多钱为首要目标；认准‘赚钱需求’大赛道长期主义；承认能力圈局限（仅适合社群产品）；建立‘生态/平台机制’让机会涌现并参与分配，而非
    All-in 单一业务；以‘帮新人赚钱’为核心意义感锚点。此观点从平台视角印证了‘只做 5%（核心擅长+长期价值）’的普适性。'
  excerpt:
  - 生财不以赚最多钱为第一目标……我希望长期有一件事可以沉浸其中
  - 不要轻易的把自己 allin 到一个具体的业务，而是努力去建立一个生态或平台，让各种机会涌现价值被创造
  - 帮别人赚到钱这件事的意义感和成就感非常强
