units:
- 'no': 1
  name: RAG 范式演进 —— 从朴素检索到模块化知识计算
  points:
  - '**为什么需要这个概念？**'
  - '- 早期 Naive RAG 存在“召回不全、排序不准、生成幻觉”的三大顽疾，无法满足生产环境对准确性与可靠性的要求'
  - '- 随着业务复杂度增加，固定的“检索-生成”线性流程无法应对多跳推理、动态知识获取等场景'
  - '- 需要将 RAG 重构为标准化、可组装的工程化组件，实现策略的灵活切换与迭代优化'
  - '**核心定义**'
  - '- 模块化 RAG 将系统解耦为索引构建、检索增强、生成融合三大标准化阶段，每个阶段定义标准接口'
  - '- 核心组件包括：DocumentLoader/Transformer（文档加载与转换）、VectorStore/Retriever（向量存储与检索器）、Generator（生成器）、Reranker（重排序器）、QueryRewriter（查询重写器）'
  - '- 通过 Pipeline 编排器将组件串联，支持混合检索、父子文档、假设性文档嵌入等高级策略的即插即用'
  - '**关键性质**'
  - '- 解耦性：检索策略、嵌入模型、生成模型可独立替换升级，互不影响'
  - '- 可观测性：每个模块输入输出可追踪，便于诊断“未命中-噪声干扰-生成幻觉”故障链路'
  - '- 可评测性：模块化边界使得 RAGAS/ARES 等评测指标可精准定位至具体环节（如上下文精确率归因于检索器）'
  - '**典型例子**'
  - '- Naive RAG：简单的向量相似度 Top-K 检索 + 直接拼接 Prompt 生成，召回率低、易受干扰'
  - '- Advanced RAG：引入查询重写、混合检索、重排序、上下文压缩，显著提升答案忠实度'
  - '- Modular RAG：以 LangChain/LlamaIndex 为代表，通过标准化接口组装 Agentic RAG、GraphRAG 等变体'
  - '**边界条件**'
  - '- 过度模块化可能引入编排开销与延迟，简单 QA 场景 Naive RAG 的 ROI 可能更高'
  - '- 组件接口标准化程度依赖框架生态成熟度，自研组件需遵循统一 Schema 才能纳入 Pipeline'
  - '- 模块化解决的是工程复用问题，核心检索质量仍取决于数据质量、分块策略与 Embedding 模型能力'
  sources:
  - paper: 20230418_095.md
    role: origin
  - paper: 20230418_106.md
    role: improve
  - paper: 20230418_109.md
    role: apply
  excerpts:
  - 梳理Naive RAG -> Advanced RAG -> Modular RAG演进脉络，定义检索器、生成器、重排序器、查询重写器等标准化组件接口。
  - 定义标准化 RAG Pipeline 接口：DocumentLoader/Transformer -> VectorStore/Retriever -> Generator，支持混合检索、父子文档、假设性文档嵌入等高级策略的即插即用组装。
  - 提炼生产级应用必备的非功能性需求：流式输出、异步编排、可观测性、版本管理与回滚，给出基于 LangChain/LangGraph 的分层架构参考实现蓝图。
- 'no': 2
  name: 文档解析与分块策略 —— 知识入库的“切刀”与“筛网”
  points:
  - '**为什么需要这个概念？**'
  - '- 原始文档（PDF/代码/表格）结构异质、长度超限，直接嵌入会导致语义稀释、上下文窗口溢出、关键信息丢失'
  - '- 分块质量直接决定检索上限：“切太碎”丢失上下文连贯性，“切太粗”引入噪声稀释相关性'
  - '- 不同文档类型（结构化代码、非结构化长文、表格图表）对分块策略敏感度极高，无银弹方案'
  - '**核心定义**'
  - '- 文档解析：将异构格式（PDF/HTML/Code/Table）统一转化为结构化文档对象，保留标题层级、代码块、表格结构等元信息'
  - '- 分块策略：将长文档切分为适合 Embedding 编码与上下文窗口的文本块，核心参数含 chunk_size（块大小）、chunk_overlap（重叠量）、separators（分隔符）'
  - '**关键性质**'
  - '- 固定长度分块：实现简单、成本低，但易破坏语义完整性（如截断句子、拆散代码函数）'
  - '- 语义分块：基于嵌入相似度或标题层级切分，保持语义内聚，但计算开销大、依赖嵌入模型质量'
  - '- 层级/父子分块：构建大块（父）用于召回、小块（子）用于精读，平衡上下文广度与精度'
  - '- Agentic Chunking：引入 LLM 智能判断切分点，适应复杂文档结构，但延迟高、成本高、确定性难保证'
  - '**典型例子**'
  - '- 代码文档：按函数/类定义为边界分块（AST 解析），保留函数签名与文档字符串'
  - '- 技术手册/PDF：基于标题层级（Markdown Header Splitter）递归分块，保留章节上下文'
  - '- 表格数据：行级分块 + 表头注入，或转为 Markdown/JSON 结构化文本后嵌入'
  - '- 长上下文场景：父块 1500 tokens 召回，子块 300 tokens 重排/生成'
  - '**边界条件**'
  - '- Embedding 模型最大输入长度（如 512/8192 tokens）设定 chunk_size 硬上限'
  - '- 重叠过大导致索引膨胀、检索冗余；重叠过小导致语义边界割裂'
  - '- 解析器对复杂版面（多栏、公式、扫描件）鲁棒性有限，Garbage In, Garbage Out 原则下需人工清洗兜底'
  sources:
  - paper: 20230418_096.md
    role: origin
  - paper: 20230418_103.md
    role: critique
  excerpts:
  - 对比固定长度、语义分块、层级分块、Agentic Chunking等方案，结合文档类型（PDF/代码/表格）给出最佳实践决策树。
  - 建立“未命中-噪声干扰-生成幻觉-格式错误”四类故障诊断树，配套数据清洗、提示加固、流程兜底的系统性解决方案。
- 'no': 3
  name: 向量索引与混合检索 —— 语义模糊匹配与关键词精准命中的“双保险”
  points:
  - '**为什么需要这个概念？**'
  - '- 稠密向量检索擅长语义模糊匹配，但对实体、数字、专有名词等精确匹配场景表现差（如错误码、API 名称）'
  - '- 稀疏检索（BM25）擅长关键词精准命中，但无法理解同义词、近义词、语义关联'
  - '- 单一检索模式无法覆盖“模糊语义问答”与“精确实体查找”双重需求，需融合两者优势'
  - '**核心定义**'
  - '- 向量索引：将文本嵌入高维向量空间，通过 ANN（近似最近邻）算法（HNSW/IVF）实现亚线性时间复杂度的语义相似度搜索'
  - '- 混合检索：并行执行稠密向量检索与稀疏词法检索（BM25），通过加权融合（RRF/加权求和）或串行重排序合并结果'
  - '**关键性质**'
  - '- HNSW 参数：efConstruction（构建时搜索宽度，影响索引质量）、efSearch（查询时搜索宽度，影响召回率/延迟）、M（图连接度，影响内存/精度）'
  - '- BM25 参数：k1（词频饱和度控制）、b（长度归一化因子），需针对领域语料调优'
  - '- 融合策略：RRF (Reciprocal Rank Fusion) 无需打分校准、鲁棒性强；加权求和需解决向量分数与 BM25 分数量纲不一致问题'
  - '**典型例子**'
  - '- 技术文档问答：用户搜 “报错 500”，BM25 精准命中错误码文档；用户搜 “服务器内部错误怎么排查”，向量检索召回相关排查指南'
  - '- 电商客服：搜 “iPhone 15 Pro Max 256G 深空灰” 依赖 BM25 精确匹配 SKU；搜 “适合送女朋友的手机” 依赖向量语义匹配'
  - '- 代码检索：函数名/变量名用 BM25，业务逻辑意图用向量检索'
  - '**边界条件**'
  - '- 混合检索增加索引存储成本（双份索引）与查询延迟（双路召回+融合）'
  - '- BM25 依赖分词器，中文/代码/混合语言场景分词质量直接影响召回率'
  - '- 向量检索对 Embedding 模型领域适配性敏感，通用模型在垂直领域可能不如微调后的 BM25'
  sources:
  - paper: 20230418_097.md
    role: origin
  - paper: 20230418_106.md
    role: improve
  excerpts:
  - 深度解析HNSW/IVF索引参数调优，融合稀疏检索（BM25）与稠密检索的混合召回策略，平衡语义匹配与关键词精准命中。
  - 攻克‘召回不全、排序不准’核心难点：实现 BM25+向量混合检索、Cross-Encoder/LLM 重排序、多查询扩展、查询路由与分解。
- 'no': 4
  name: 重排序与上下文压缩 —— 在有限窗口中最大化信噪比
  points:
  - '**为什么需要这个概念？**'
  - '- 向量召回的 Top-K 文档常包含大量噪声、冗余或低相关内容，直接喂给 LLM 导致“中间遗忘”、幻觉率上升、Token 浪费'
  - '- LLM 上下文窗口虽扩大（32k-1M），但有效注意力集中在首尾（Lost-in-the-Middle），且推理成本随长度二次方增长'
  - '- 需要在生成前对候选文档进行“二次筛选”与“信息浓缩”，保留高价值证据'
  - '**核心定义**'
  - '- 重排序：使用 Cross-Encoder（交叉编码器）或 LLM 对 Query-Doc 对进行精细打分，将最相关文档前置，过滤无关文档'
  - '- 上下文压缩：通过 LLM 抽取关键句、摘要压缩、实体保留等手段，在保留核心信息前提下大幅压缩 Token 消耗'
  - '**关键性质**'
  - '- Cross-Encoder：输入 [Query, Doc] 拼接，输出相关性分数，精度远高于 Bi-Encoder（向量检索），但计算量大，仅适用于
    Top 50-100 候选集'
  - '- LLM Reranker：利用指令微调模型（如 BGE-Reranker, Cohere Rerank）或 Few-shot Prompting 打分，支持列表式打分降低调用次数'
  - '- 压缩策略：Extractive（抽取关键句）、Abstractive（生成摘要）、LLM Lingua（Token 级软压缩）、LongLLMLingua（问感知压缩）'
  - '- 顺序敏感性：重排序应在压缩前进行，确保压缩源来自高质量文档'
  - '**典型例子**'
  - '- 召回 20 篇文档 -> Cross-Encoder 重排序取 Top 5 -> LLM 抽取关键句压缩至 2000 tokens -> 生成答案'
  - '- 长文档 QA：父文档召回 -> 子文档重排序 -> 仅保留高分子文档对应的父文档片段 -> 生成'
  - '**边界条件**'
  - '- 重排序模型引入额外延迟（50-200ms），高并发场景需权衡吞吐与精度'
  - '- 激进压缩可能丢失支撑推理的关键细节（如数字、引用、否定词），需设置最小保留阈值或保留引用溯源'
  - '- Cross-Encoder 无法处理超长文档，需配合滑动窗口或仅对摘要打分'
  sources:
  - paper: 20230418_098.md
    role: origin
  - paper: 20230418_106.md
    role: improve
  excerpts:
  - 引入Cross-Encoder重排序、LLM-based压缩、关键句提取等后处理手段，在有限上下文窗口内最大化信噪比。
  - 攻克‘召回不全、排序不准’核心难点：实现 BM25+向量混合检索、Cross-Encoder/LLM 重排序、多查询扩展、查询路由与分解。
- 'no': 5
  name: 查询重写与路由 —— 理解用户真实意图的“翻译官”与“导航员”
  points:
  - '**为什么需要这个概念？**'
  - '- 用户查询常模糊、口语化、省略上下文、包含多重意图，直接用于检索召回率极低'
  - '- 单一索引无法覆盖异构数据（结构化 SQL、非结构化文档、图谱），需根据查询类型路由至专用检索器'
  - '- 多轮对话中，当前查询强依赖历史上下文，需改写为自包含的独立查询'
  - '**核心定义**'
  - '- 查询重写：利用 LLM 将用户原始查询转化为检索友好的形式，包含：查询扩展、子查询分解、对话历史改写、假设性文档嵌入'
  - '- 查询路由：根据查询意图分类（事实问答/汇总/代码生成/结构化查询），动态选择检索策略、索引库或工具'
  - '**关键性质**'
  - '- HyDE (Hypothetical Document Embeddings)：让 LLM 先生成一个假设性答案，再用该答案向量检索，缓解“查询-文档”分布错位'
  - '- 多查询扩展：将复杂问题分解为多个子问题并行检索，再聚合答案，解决多跳推理需求'
  - '- 对话历史改写：将指代、省略恢复为完整查询（如“那个呢？” -> “iPhone 15 的电池续航如何？”）'
  - '- 路由分类器：基于关键词、Embedding 分类或 LLM 意图识别，路由至 Vector Store / Graph DB / SQL DB / Web
    Search'
  - '**典型例子**'
  - '- 用户问：“比较一下 iPhone 15 和 14 的续航” -> 分解为：“iPhone 15 续航参数”、“iPhone 14 续航参数”、“续航对比评测”三路并行检索'
  - '- 用户问：“帮我查下上周销售额” -> 路由至 Text-to-SQL 模块执行结构化查询，而非向量检索文档'
  - '- 多轮：Q1: “TensorFlow 怎么安装？” A1: ... Q2: “PyTorch 呢？” -> 改写为 “PyTorch 怎么安装？”'
  - '**边界条件**'
  - '- 查询重写引入额外 LLM 调用延迟（可并行化或用小模型蒸馏），简单查询可跳过'
  - '- 过度分解子查询可能导致检索碎片化、上下文丢失，需限制分解深度（建议 ≤3 步）'
  - '- 路由分类错误会导致灾难性后果（如将 SQL 查询路由至向量检索），需设置低置信度兜底策略（如并行多路检索再融合）'
  sources:
  - paper: 20230418_099.md
    role: origin
  - paper: 20230418_106.md
    role: improve
  excerpts:
  - 实现查询扩展（HyDE）、子查询分解、多索引路由、对话历史改写，解决模糊查询、多跳推理、会话上下文依赖等难题。
  - 攻克‘召回不全、排序不准’核心难点：实现 BM25+向量混合检索、Cross-Encoder/LLM 重排序、多查询扩展、查询路由与分解。
- 'no': 6
  name: RAG 自动化评估体系 —— 从主观感知到可量化的数据飞轮
  points:
  - '**为什么需要这个概念？**'
  - '- RAG 系统参数空间巨大（分块大小、Top-K、重排序模型、Prompt 模版），凭经验调参不可复现、不可规模化'
  - '- “好不好用”缺乏客观指标，无法支撑自动化优化闭环（如 OPRO、DSPy 风格的提示/参数自动搜索）'
  - '- 需要将评估拆解为可计算、可归因的细粒度指标，建立“可测量即可优化”的工程文化'
  - '**核心定义**'
  - '- 评估三维：检索质量、生成质量、系统整体表现'
  - '- 核心指标体系：'
  - '  - 忠实度：答案是否仅基于检索上下文，无幻觉'
  - '  - 答案相关性：答案是否切中用户问题'
  - '  - 上下文精确率：检索上下文中有多少与问题相关'
  - '  - 上下文召回率：所有相关知识有多少被检索到'
  - '- 评测框架：RAGAS（无参考答案、基于 LLM 评估）、ARES（合成训练评估模型）'
  - '**关键性质**'
  - '- 合成测试集生成：利用 LLM 从语料库反向生成 QA 对，覆盖单跳/多跳/不可答等类型，解决人工标注成本高、覆盖面窄问题'
  - '- LLM-as-a-Judge：使用强模型（GPT-4/Claude）打分，需校准 Prompt、温度、Few-shot 保证评估一致性'
  - '- CI/CD 集成：评测作为流水线门禁，新分块策略/Embedding 模型/提示词合并前必须通过基准线回归测试'
  - '**典型例子**'
  - '- 迭代优化流：修改 chunk_size 500->1000 -> 离线跑 RAGAS 评测 -> 召回率 +5%、忠实度 -1% -> 决策：若业务重召回则合并，否则回滚'
  - '- 合成数据构建：输入 1000 份合同文档 -> LLM 生成 5000 条 QA -> 人工抽检 200 条校准 -> 作为黄金测试集固化'
  - '**边界条件**'
  - '- LLM 评估存在位置偏好、冗长偏好、自我增强偏见，需引入对照实验、交换位置平均、细粒度评分维度缓解'
  - '- 合成测试集分布可能偏离真实用户查询分布，需定期注入真实生产流量（脱敏后）校准分布'
  - '- 离线指标提升不一定等于在线业务指标提升，必须建立 A/B 测试验证闭环'
  sources:
  - paper: 20230418_100.md
    role: origin
  - paper: 20230418_109.md
    role: improve
  - paper: 20230418_136.md
    role: apply
  excerpts:
  - 构建基于RAGAS/ARES框架的忠实度、答案相关性、上下文精确率/召回率指标体系，建立合成测试集与持续集成评估流水线。
  - 建立‘可测量即可优化’的评测体系：引入忠实度、答案相关性、上下文精确度/召回率等核心指标，结合合成测试集生成与在线人工反馈，驱动检索策略、分块参数、提示词的持续自动化优化。
  - 设计数据飞轮核心管道：高质量轨迹采样 -> 专家/模型标注 -> 偏好数据构建 (SFT/DPO) -> 模型迭代 -> 灰度发布 -> 线上收集。
- 'no': 7
  name: 进阶 RAG 模式：GraphRAG 与 Agentic RAG
  points:
  - '**为什么需要这个概念？**'
  - '- 基础 RAG 基于文本块相似度，无法处理“全局汇总”、“跨文档关联推理”、“实体关系图谱化问答”等需求'
  - '- 固定的检索-生成流程缺乏自主决策能力，面对复杂任务（需多工具协作、动态规划检索路径）无能为力'
  - '- 需要引入知识图谱结构化先验、Agent 自主规划能力，突破“文本匹配”的天花板'
  - '**核心定义**'
  - '- GraphRAG：构建实体-关系知识图谱，利用社区检测生成层级摘要，支持全局问答（如“该数据集的主要主题有哪些？”）与多跳推理'
  - '- Agentic RAG：将检索器封装为 Tool，赋予 LLM Agent 自主决策“是否检索、检索什么、如何改写查询、如何验证结果”的能力，检索成为动作而非固定步骤'
  - '**关键性质**'
  - '- GraphRAG 索引构建：实体抽取 -> 关系抽取 -> 图构建 -> 社区检测 -> 层级摘要生成，构建成本高、延迟高，适合静态知识库'
  - '- GraphRAG 检索：全局检索（社区摘要汇总）+ 局部检索（实体邻居扩展），兼顾广度与深度'
  - '- Agentic RAG 核心循环：规划 -> 工具选择 -> 执行检索 -> 观察结果 -> 反思/修正 -> 继续或终止'
  - '- Agentic RAG 工具集：向量检索、图谱查询、SQL 执行、Web 搜索、计算器、代码执行器'
  - '**典型例子**'
  - '- GraphRAG：分析某公司 10 年财报，“核心风险因素随年份如何演变？” -> 社区摘要层级聚合 -> 生成趋势报告'
  - '- Agentic RAG：用户问“帮我对比竞品 A/B/C 最新定价并生成报表” -> Agent 规划：搜官网 -> 搜新闻 -> 查数据库 -> 写代码绘图
    -> 输出报表'
  - '**边界条件**'
  - '- GraphRAG 依赖高质量实体关系抽取，噪声实体/关系会污染图谱导致推理错误，维护成本高'
  - '- Agentic RAG 引入非确定性，可能陷入循环、工具调用幻觉、Token 成本失控，需设置最大步数、预算限制、人工介入兜底'
  - '- 两者可结合：Agent 调用 GraphRAG 作为结构化知识检索工具，兼具全局推理与自主决策能力'
  sources:
