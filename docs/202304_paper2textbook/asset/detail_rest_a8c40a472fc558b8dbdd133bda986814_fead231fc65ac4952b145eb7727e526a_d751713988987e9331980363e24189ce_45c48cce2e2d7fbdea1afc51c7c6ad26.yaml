learning_targets:
- 掌握微前端架构决策矩阵，能量化评估团队是否具备微前端落地条件
- 深度理解 qiankun 双沙箱机制与样式隔离方案的原理、选型边界与典型坑位
- 掌握 Module Federation 运行时依赖共享、版本协商算法与生态集成要点
- 能制定覆盖依赖治理、路由协议、监控统一的《微前端接入规范》并落地自动化管道
- 掌握遗留系统微前端化改造的‘绞杀者模式’全流程：资产梳理、边界拆分、构建适配、灰度发布与回滚预案
concept_map:
- 微前端架构落地
- ├── 架构决策矩阵
- │   ├── 量化评估维度：团队规模/部署频率/技术栈异构/业务耦合  —— P001
- │   ├── 触发阈值：团队>10人/多仓库/独立发布/技术栈迁移  —— P001
- │   ├── 收益成本模型：发布效率×规模 vs 基建投入+运行时开销  —— P001
- │   └── 可逆性评估：预设回归单体降级方案  —— P001
- ├── qiankun 深度解析
- │   ├── 双沙箱模式
- │   │   ├── snapshot 沙箱：快照记录/恢复，兼容旧环境，不支持多实例  —— P002
- │   │   └── proxy 沙箱：Proxy 劫持 window，fakeWindow 隔离，主流方案  —— P002
- │   ├── 样式隔离三档
- │   │   ├── Shadow DOM：strictStyleIsolation，最强隔离，弹层需特殊处理  —— P002
- │   │   ├── CSS Modules：experimentalStyleIsolation，编译时隔离，性能最优  —— P002
- │   │   └── 动态 Style 标签：默认方案，弱隔离，卸载移除  —— P002
- │   ├── 生命周期标准化：bootstrap/mount/unmount/update  —— P002
- │   └── 通信机制：initGlobalState 发布订阅，复杂交互建议自定义事件  —— P002
- ├── Module Federation 原生联邦
- │   ├── 核心配置三要素：exposes/remotes/shared  —— P003
- │   ├── 运行时版本协商：semver 比对，满足复用 Host 单例，不满足 Remote 自载  —— P003
- │   ├── 联邦模块热更新：RemoteEntry.js 重构建 + WebSocket 热替换  —— P003
- │   └── 生态集成：@module-federation/vite、Rspack 原生支持  —— P003
- ├── 微前端治理规范
- │   ├── 公共依赖版本锁定：基座提供单例，子应用 externals 排除  —— P004
- │   ├── 路由分发协议：基座管 history，子应用仅响应 basename  —— P004
- │   ├── 组件库版本策略：发布→验证→灰度→全量标准化流程  —— P004
- │   ├── 监控埋点统一：基座注入 SDK，TraceID 透传打通链路  —— P004
- │   └── 接入准入门槛：体积/生命周期/沙箱压测/a11y-i18n 自动化门禁  —— P004
- └── 遗留系统微前端化改造
- '    ├── 绞杀者模式：新功能新栈/老功能老栈/基座逐步接管  —— P005'
- '    ├── 资产梳理与边界拆分：高频变更/高价值/低耦合优先剥离  —— P005'
- '    ├── 构建产物适配：补全生命周期/UMD/SystemJS 格式/publicPath 动态注入  —— P005'
- '    ├── 基座路由分发与状态同步：主应用管登录/权限/菜单，props 下发  —— P005'
- '    └── 灰度发布与回滚：Nginx 金丝雀/一键回滚/监控兜底自动触发  —— P005'
life_analogy:
- 想象微前端架构像一个**‘联合办公大厦’（基座/主应用）**与**‘独立租户’（子应用）**的关系：
- '- **架构决策矩阵** = **‘入驻资格审核’**：不是所有人都适合进大厦（团队<5人、单仓库、无迁移需求 = 个体户，自建独栋楼更划算）'
- '- **qiankun 双沙箱** = **‘物理隔墙’**：'
- '  - `proxy` 沙箱 = **‘现代钢筋混凝土隔墙’**（Proxy 劫持），隔音好、互不干扰、支持多户同住'
- '  - `snapshot` 沙箱 = **‘简易活动板房隔断’**（快照还原），隔音一般、只能一户一户轮流住'
- '- **样式隔离** = **‘装修规范’**：'
- '  - Shadow DOM = **‘全封闭精装修’**（最强隔离），但自带家具（UI 弹层）难搬进来'
- '  - CSS Modules = **‘统一编码装修标准’**（编译时隔离），施工麻烦但入住后最省心'
- '- **Module Federation** = **‘大厦共享设施管网’**（水电网/公共依赖）：租户签约（shared 配置）共用大厦中央空调（React/Vue
  单例），版本协商像‘电压标准’不合就自带发电机'
- '- **治理规范** = **‘物业管理条例’**：强制统一门禁（路由分发）、统一宽带（监控 SDK）、统一装修风格（组件库版本），违规不给接水电（CI/CD
  门禁）'
- '- **遗留系统改造** = **‘老旧小区改造’**：不能强拆（重写风险高），采用‘绞杀者模式’——新盖楼（新子应用）接入大厦管网，老住户（遗留子应用）先住沙箱隔离区，分批搬迁、随时可回迁（灰度/回滚）'
summary:
- concept: 架构决策矩阵
  desc: 量化评估微前端收益与成本，设定团队>10人/多仓库/独立发布等硬性触发阈值，避免盲目拥抱
- concept: qiankun 双沙箱
  desc: proxy 沙箱基于 Proxy 实现多实例强隔离（主流），snapshot 沙箱基于快照兼容旧环境（不支持多实例）
- concept: 样式隔离三档
  desc: Shadow DOM 最强但弹层难题多；CSS Modules 编译时隔离性能最优；动态 Style 标签默认弱隔离
- concept: Module Federation
  desc: Webpack 5 原生联邦，通过 exposes/remotes/shared 实现运行时依赖共享与版本协商，打破构建时边界
- concept: 版本协商算法
  desc: Host 加载 RemoteEntry -> 解析 shared -> semver 比对 -> 满足复用 Host 单例，不满足 Remote 自载
- concept: 微前端治理规范
  desc: 基座下沉能力：公共依赖单例、路由分发协议、组件库版本流程、统一监控 SDK、自动化准入门槛
- concept: 绞杀者模式
  desc: 遗留系统改造核心策略：新功能新子应用、老系统跑遗留子应用、基座逐步接管路由权限，平滑过渡
- concept: 灰度发布与回滚
  desc: Nginx 流量分流 + 一键切回旧 Upstream + 监控指标超阈值自动触发回滚，保障改造零重大故障
exercises:
- 'no': 1
  title: 微前端架构决策实战演练
  contents:
  - 某创业公司前端团队 8 人，单仓库，两周一发布，统一 React 18 技术栈，无遗留迁移计划。
  - 请基于架构决策矩阵进行评分：
  - 1. 列出该团队在‘团队规模、部署频率、技术栈异构、业务耦合’四个维度的得分
  - 2. 判断是否满足‘硬性触发条件’
  - 3. 计算收益成本比：假设微前端基建投入 2 人月/季度，运行时首屏 JS 增加 15KB，发布效率提升 10%
  - 4. 给出最终建议：微前端 / 继续单体优化（模块化/懒加载/包体积分析）
  - 思考题：若该公司半年后并购一支 15 人 Vue 2 团队，决策矩阵如何变化？
- 'no': 2
  title: qiankun 沙箱与样式隔离选型题
  contents:
  - 场景：主应用 React 18，需接入三个子应用——子应用 A（Vue 3 + Arco Design）、子应用 B（React 16 + Ant Design
    4）、子应用 C（老旧 jQuery + 手写 CSS，需 IE11 兼容）。
  - 1. 为每个子应用选择沙箱模式并说明理由
  - '2. 子应用 A 使用 Modal 弹窗挂载 document.body，开启 `strictStyleIsolation: true` 后弹窗样式丢失，给出两种解决方案并对比优劣'
  - 3. 子应用 C 因不支持 Proxy 降级 snapshot 沙箱，主应用要求子应用 A、B、C 同时在线，会发生什么问题？如何规避？
  - 4. 如果主应用升级 React 19，子应用 B 仍锁定 React 16，proxy 沙箱能否解决 React 版本冲突？为什么？
- 'no': 3
  title: Module Federation 版本协商与循环依赖排查
  contents:
  - 'Host（基座）与 RemoteA、RemoteB 均配置 `shared: { react: { singleton: true, requiredVersion:
    ''^18.2.0'' } }`。'
  - 1. RemoteA 升级 React 18.3.0，Host 仍为 18.2.0，启动时 RemoteEntry.js 解析共享依赖图的完整流程是什么？最终谁提供
    React 实例？
  - 2. RemoteB 误将 `requiredVersion` 设为 `'^17.0.0'`，运行时会报什么错？如何通过 CI 管道自动拦截此类配置漂移？
  - 3. 现有一循环依赖场景：Host 暴露 `useAuth` Hook 给 RemoteA，RemoteA 暴露 `<UserProfile />` 组件给
    Host，且 `<UserProfile />` 内部调用 `useAuth`。运行时初始化会如何死锁？请画出依赖图并给出架构层面的解耦方案。
  - 4. 如何利用 `package.json` 的 `peerDependencies` 与 MF `shared` 配置联动，建立‘构建时声明、运行时协商、CI
    校验’三位一体的版本治理体系？
- 'no': 4
  title: 遗留系统微前端化改造模拟推演
  contents:
  - 某电商后台管理系统：Vue 2 + jQuery 混编，10 万行代码，无构建工具，全局变量污染严重，Vuex 模块 200+，路由耦合业务逻辑。
  - 请设计改造全流程方案：
  - 1. 资产梳理：如何识别‘高频变更/高价值/低耦合’的首批剥离模块？给出 3 个具体判断标准
  - 2. 构建适配：为老系统引入 Vite，补全 `package.json`、暴露 qiankun 生命周期钩子的最小改动清单（含 `libraryTarget`、`publicPath`
    运行时注入方案）
  - 3. 沙箱隔离：老系统大量使用 `$.extend` 污染全局原型、`eval` 执行后端下发脚本，proxy 沙箱能否拦截？需先做哪些‘去污染’重构？
  - 4. 共享状态迁移：200+ Vuex 模块迁移成本极高，设计‘状态留老应用、新应用跨沙箱通信’的过渡方案（含事件总线协议、数据同步策略）
  - 5. 灰度发布：设计 Nginx 金丝雀配置片段（按 Cookie `user_group=beta` 分流），并制定‘错误率>1% 或 空白页率>0.5%
    自动回滚’的 Prometheus 告警规则表达式
