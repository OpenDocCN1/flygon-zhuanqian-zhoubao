  name: ChatGPT 结构化提示词工程 —— 跨境电商谷歌广告文案标准化生成
  points:
  - '**为什么需要这个概念？**'
  - '- 手写广告文案耗时、质量依赖个人经验、难以批量产出符合平台规范的高转化文案'
  - '- 跨境电商从业者英语非母语，易出现语法错误、表达不地道、关键词缺失等问题'
  - '- 需要一套标准化、可复用、可版本管理的 Prompt 工程方法论，将‘玄学咒语’转化为工程资产'
  - '**核心定义**'
  - '- 结构化提示词范式：角色设定 + 任务定义 + 输出约束（格式/字数/语言/营销目标）三大核心要素'
  - '- 谷歌广告 RSA 规则：标题 ≤30字符、描述 ≤90字符、最多15个标题/4个描述、需覆盖不同卖点组合'
  - '**关键性质**'
  - '- 角色扮演：`现在你是一名谷歌广告的编写人员` 显式赋予专业身份，激活垂直领域知识'
  - '- 约束显性化：字数限制、语言要求、营销目标（引人入胜/下单欲望）硬编码进 Prompt'
  - '- 少样本注入：提供 2-3 组高质量历史广告作为 Few-shot 示例，引导风格与结构对齐'
  - '- 迭代版本化：v1.0 先行发布，收集实投数据与反馈，持续迭代 Prompt 版本（v1.1、v1.2...）'
  - '**典型例子**'
  - '- 输入：产品=便携式户外电源，卖点=大容量/快充/多接口/防水'
  - '- Prompt 构建：角色(资深广告文案) + 任务(生成10标题4描述) + 约束(英文/字数/RSA规范/高转化) + 少样本(2组历史优秀广告)'
  - '- 输出：10条标题（如：Power Anywhere, 300W Fast Charge...）、4条描述（如：2000Wh capacity charges
    99% devices...），均符合字数与语言规范'
  - '**边界条件**'
  - '- 避免一次性投喂超长 Prompt 导致上下文截断，采用分轮次交互（角色设定→知识灌输→范例注入→生成指令）'
  - '- ChatGPT 多语言输出存在幻觉风险，必须人工复核语言本地化与事实准确性'
  - '- Prompt 需纳入版本管理（Git），建立变更日志，支持 A/B 测试与回滚'
  sources:
