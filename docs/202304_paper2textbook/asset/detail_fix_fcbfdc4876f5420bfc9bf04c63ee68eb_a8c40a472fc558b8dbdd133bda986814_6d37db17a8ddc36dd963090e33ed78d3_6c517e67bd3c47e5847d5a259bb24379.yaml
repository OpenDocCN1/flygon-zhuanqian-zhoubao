  - '- 重复性内容生产（文案/脚本/代码/测试）消耗大量人力，质量不稳定、难以规模化'
  - '- 个人 Prompt 管理混乱、版本不可控、团队间无法复用、无法沉淀为资产'
  - '- 需要将 AI 协作标准化为『输入关键词 → 结构化生成 → 自动化分发 → 数据回流优化』的工程流水线'
  - '**核心定义**'
  - '- ChatGPT + RPA（影刀/UiBot）自动化工作流：将生成能力模块化、流程化，搭建『超级写手机器人』实现单指令触发百/千篇批量产出'
  - '- Prompt 库四大模块：学习指令模板、知识结构组织模板、范文/案例库、修正指令模板，构建个人/团队核心生产力护城河'
  - '- 边学边教/边学边分享机制：新成员学习新技能后 3 天内输出心得/封装模板，强制内化与外溢'
  - '**关键性质**'
  - '- 正向强化触发：多轮夸奖、情感化称呼（‘神通广大的GPT’）显著提升模型指令遵循度与输出质量'
  - '- 分块喂养+强制总结：防止‘囫囵吞枣’，强制 GPT 输出‘学习心得’验证真理解、内化知识'
  - '- 个人 Prompt 资产库：沉淀高效指令为可复用资产，支持版本管理、A/B测试、跨项目迁移'
  - '- 工具化封装变现：将高频 Prompt 封装为 SaaS/插件/低代码应用（如 AIPRM 插件），实现 AI 能力的产品化交付'
  - '**典型例子**'
  - '- 小红书笔记批量生产：关键词输入 → ChatGPT 生成标题/正文/标签/Emoji → RPA 定时发布 → 数据回流优化选题方向'
  - '- 抖音口播脚本复刻：对标爆款结构（三段式+爆款因子） → ChatGPT 批量改写 → 剪映提词器/数字人录制 → 剪映剪辑 → 矩阵号分发'
  - '- 技术博客辅助写作：商品链接锚点 → 结构化 Prompt → AI 生成初稿 → 人工复核事实/链接/合规 → 发布部署'
  - '**边界条件**'
  - '- GPT 会话级记忆隔离：新窗口需重新喂料，长对话存在‘遗忘曲线’，需构建离线 Prompt 库标准化喂料流程'
  - '- AI 生成内容缺失非文本资产（图片/真实链接/合规声明），必须『人工筛选修改+个人经验注入+平台风格适配』三重介入'
  - '- 避免‘巨婴式学习’（依赖保姆级教程、等喂养），主张自主解决环境问题、自主训练模型、自主落地业务'
