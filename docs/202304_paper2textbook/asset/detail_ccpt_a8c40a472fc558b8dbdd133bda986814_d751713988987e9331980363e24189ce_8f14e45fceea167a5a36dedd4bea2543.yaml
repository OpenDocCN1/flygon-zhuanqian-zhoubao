units:
- 'no': 1
  name: 核心指标体系 —— 用户体验的“体检单”
  points:
  - '**为什么需要这个概念？**'
  - '- 前端性能优化缺乏统一度量标准，开发者常关注技术指标（如 JS 体积）而非用户真实感受'
  - '- 需要一套以用户为中心、可量化、可对比的关键指标，指导优化方向并设定验收基线'
  - '**核心定义**'
  - '- **LCP (Largest Contentful Painting)**：最大内容绘制，衡量“加载速度”，标记视口内最大内容元素渲染完成的时间，目标
    < 2.5s'
  - '- **CLS (Cumulative Layout Shift)**：累积布局偏移，衡量“视觉稳定性”，量化页面意外移动的程度，目标 < 0.1'
  - '- **FID (First Input Delay)**：首次输入延迟，衡量“交互响应”，记录用户首次交互到浏览器响应的延迟，已被 INP 取代'
  - '- **INP (Interaction to Next Paint)**：下一帧绘制交互延迟，衡量“整体交互响应”，观察页面全生命周期所有交互的延迟百分位，目标
    < 200ms'
  - '- **TTFB (Time to First Byte)**：首字节时间，衡量“服务端响应”，资源请求到收到第一字节的耗时，是后端与网络性能的基础'
  - '**关键性质**'
  - '- **真实用户监控 (RUM) 为准**：实验室数据仅供开发参考，生产环境需以 Chrome UX Report (CrUX) 等真实用户数据为优化依据'
  - '- **生命周期覆盖**：LCP 管加载、CLS 管稳定、INP 管交互，三大核心指标覆盖用户访问全链路'
  - '- **75 分位数法则**：指标达标判定取所有访问样本的 75 分位数（P75），而非平均值，保证大多数用户体验达标'
  - '**典型例子**'
  - '- 电商首屏大图未设置宽高导致 CLS 飙升，用户点击“加入购物车”按钮被下移的广告位“劫持”'
  - '- 单页应用 (SPA) 首屏 JS 过大阻塞主线程，导致 LCP 超 4s，用户感知“白屏”时间过长'
  - '- 列表页点击筛选项无反应 500ms 才渲染结果，INP 不达标，用户疯狂点击触发重复请求'
  - '**边界条件**'
  - '- LCP 元素可能随动态内容变化（如轮播图切换），需关注最终稳定的 LCP 候选元素'
  - '- INP 受长任务影响大，主线程被占用 > 50ms 即可能导致 INP 恶化，需结合 Long Task API 分析'
  - '- 后端渲染 (SSR) 场景下 TTFB 直接决定 LCP 下限，客户端渲染 (CSR) 则更受 JS 下载执行影响'
  sources:
  - paper: 20230418_041.md
    role: origin
  excerpts:
  - 解读 Chrome UX Report 真实用户数据，制定“LCP < 2.5s、CLS < 0.1、INP < 200ms”工程化达标标准。
- 'no': 2
  name: 构建产物优化 —— 瘦身与分包的“手术刀”
  points:
  - '**为什么需要这个概念？**'
  - '- 现代前端应用体积膨胀严重，首屏加载 JS 体积动辄 MB 级，直接拖慢 LCP 和 INP'
  - '- 浏览器下载、解析、编译 JS 的成本随体积超线性增长，必须通过分包、摇树、压缩从源头减负'
  - '**核心定义**'
  - '- **代码分割**：将打包产物拆分为多个 Chunk，按需/并行加载，核心配置 `splitChunks`、`manualChunks`'
  - '- **Tree Shaking**：基于 ES Module 静态结构，消除未被引用的“死代码”，依赖 `sideEffects: false` 标记纯模块'
  - '- **压缩算法**：Terser (JS)、esbuild (Go 实现，极快)、CSSnano (CSS)，移除空白、压缩变量名、死代码消除'
  - '- **体积预算**：在 CI 中设定阈值（如 `rollup-plugin-visualizer` + `bundlesize`），超标阻断合并'
  - '**关键性质**'
  - '- **分包粒度权衡**：过细增加 HTTP 请求数（HTTP/1.1 下）或压缩率下降；过粗失去按需加载优势，建议按“路由/组件库/高频依赖”分'
  - '- **副作用标记陷阱**：`package.json` 中 `sideEffects: false` 若误标，会导致有副作用的模块（如 CSS import、polyfill
    注入）被误删'
  - '- **动态导入 `import()`**：是路由级懒加载、组件级懒加载的语法基础，返回 Promise，配合 `Suspense` 实现降级'
  - '**典型例子**'
  - '- 使用 `rollup-plugin-visualizer` 发现 `lodash` 全量引入占 70KB，改用 `lodash-es` + Tree
    Shaking 或 `babel-plugin-lodash` 仅保留用到的函数'
  - '- 将 `moment.js` (67KB) 替换为 `dayjs` (2KB) 或 `date-fns` (按需引入)，大幅减小体积'
  - '- 配置 `manualChunks` 将 `vue`、`vue-router`、`pinia` 打包为 `vendor-[hash].js`，利用长缓存复用'
  - '**边界条件**'
  - '- Tree Shaking 仅对 ES Modules 生效，CommonJS 模块无法静态分析，需配合 `@rollup/plugin-commonjs`
    转换'
  - '- 过度分包在弱网/HTTP/2 多路复用饱和时可能增加调度开销，需结合网络面板分析'
  - '- 压缩阶段的 `terser` 单线程慢，大型项目建议改用 `esbuild` 压缩或开启并行压缩'
  sources:
  - paper: 20230418_041.md
    role: origin
  excerpts:
  - 深入 Rollup/Vite 分包配置、`sideEffects` 标记、`terser`/`esbuild` 压缩选项、`rollup-plugin-visualizer`
    体积分析与 CI 门禁。
- 'no': 3
  name: 资源加载策略 —— 浏览器与服务端的“接力赛”
  points:
  - '**为什么需要这个概念？**'
  - '- 浏览器默认加载策略并非最优：阻塞渲染、优先级错误、重复下载，需开发者显式指导浏览器“什么时候加载什么”'
  - '- 网络延迟（RTT）往往比带宽更影响首屏，需利用预连接、预加载抢跑关键资源'
  - '**核心定义**'
  - '- **Preload (`rel=preload`)**：强制浏览器高优先级下载当前页面必需资源（字体、关键 CSS/JS、Hero 图），不延迟 `onload`'
  - '- **Prefetch (`rel=prefetch`)**：低优先级预取下一页可能需要的资源，利用空闲带宽，存入 HTTP 缓存'
  - '- **Preconnect / DNS-prefetch**：提前建立跨域连接（DNS+TCP+TLS），消除后续请求的握手延迟'
  - '- **Modulepreload**：专为 JS 模块设计，预加载并预编译依赖图，解决模块嵌套请求瀑布流问题'
  - '- **Service Worker (SW) / Workbox**：拦截请求实现离线缓存、Stale-While-Revalidate 策略、版本更新广播'
  - '**关键性质**'
  - '- **优先级博弈**：Preload 过多会挤占关键资源带宽，需仅限“首屏关键路径”资源；Prefetch 仅在 `navigator.connection.saveData`
    为 false 且非弱网时执行'
  - '- **HTTP/2 多路复用**：单连接并行传输，消除队头阻塞，但服务端推送 由于缓存感知缺失已被废弃，客户端 Preload 替代'
  - '- **SW 生命周期**：`install` -> `activate` -> `fetch`，需处理 `skipWaiting`/`clients.claim`
    实现无刷新更新'
  - '**典型例子**'
  - '- 字体文件 `woff2` 添加 `<link rel=preload as=font crossorigin>`，消除字体闪烁 (FOIT/FOUT)
    并提升 LCP'
  - '- 登录后预取 `dashboard` 路由 JS Chunk：`<link rel=prefetch href=/js/dashboard.[hash].js>`，实现“秒开”体验'
  - '- Workbox 配置 `runtimeCaching`：API 走 NetworkFirst，静态资源走 CacheFirst，HTML 走 StaleWhileRevalidate'
  - '**边界条件**'
  - '- Preload 资源若 3 秒内未使用，Chrome 控制台会黄色警告，需精准控制预加载范围'
  - '- SW 无法缓存非 GET 请求、跨域无 CORS 头的不透明响应、以及 `no-store` 头的响应'
  - '- `modulepreload` 需浏览器支持（现代浏览器均支持），旧版浏览器需回退到 `preload as=script`'
  sources:
  - paper: 20230418_041.md
    role: origin
  excerpts:
  - 实战 `<link rel=preload>` 关键资源、`rel=modulepreload` JS 模块、Workbox 生成 SW 实现离线首屏与版本更新广播。
- 'no': 4
  name: 运行时渲染优化 —— 主线程的“减负运动”
  points:
  - '**为什么需要这个概念？**'
  - '- JS 单线程模型决定主线程是稀缺资源，长任务阻塞渲染与交互，直接导致掉帧、卡顿、INP 恶化'
  - '- 复杂业务（大列表、实时计算、重绘）若不卸载主线程，无法通过堆砌算力解决体验问题'
  - '**核心定义**'
  - '- **虚拟列表**：仅渲染可视区 + 缓冲区 DOM，滚动时复用节点、更新数据，支撑 10 万+ 条数据流畅滚动'
  - '- **防抖/节流**：高频事件（resize、scroll、input）的回调频率控制，减少不必要的计算与渲染触发'
  - '- **Web Worker**：独立线程运行 JS，可执行加密、压缩、解析、矩阵运算等纯计算任务，通过 `postMessage` 通信'
  - '- **`requestIdleCallback` / `scheduler.yield()`**：在浏览器空闲期或主动让出控制权，拆解长任务，避免阻塞高优先级工作'
  - '**关键性质**'
  - '- **DOM 访问限制**：Worker 无法访问 DOM、window、localStorage，仅适合无副作用的计算密集型任务'
  - '- **虚拟列表实现难点**：动态行高计算、滚动定位跳转、SSR 首屏数据同步、横向虚拟化'
  - '- **调度优先级**：React 18 `useTransition` 标记低优先级更新、`scheduler.yield()` 让出主线程，配合 `isInputPending`
    响应用户输入'
  - '**典型例子**'
  - '- 万行表格渲染：从 10s 白屏降至 50ms 首屏，内存从 200MB 降至 20MB (react-window / @tanstack/virtual)'
  - '- 图片编辑器：将滤镜计算、Base64 编解码移至 Worker，主线程仅负责 Canvas 绘制，INP 从 800ms 降至 50ms'
  - '- 复杂表单联动校验：使用 `useDeferredValue` 延迟非紧急计算，保证输入框响应丝滑'
  - '**边界条件**'
  - '- Worker 启动有开销（~10-50ms），频繁创建销毁得不偿失，建议池化复用或常驻'
  - '- `requestIdleCallback` 在后台标签页可能不触发，关键逻辑不可依赖它，需配合 `setTimeout` 兜底'
  - '- 虚拟列表不适合“需全量 DOM 搜索/选中/打印”场景，需提供“全量渲染”降级开关'
  sources:
  - paper: 20230418_041.md
    role: origin
  excerpts:
  - 实现万级数据虚拟滚动、将加密/压缩/解析任务移至 Worker、`scheduler.yield()` 让出主线程提升 INP。
- 'no': 5
  name: 前端性能监控平台 —— 可观测性的“仪表盘”
  points:
  - '**为什么需要这个概念？**'
  - '- 无度量无优化：本地开发环境与生产环境（设备、网络、缓存）差异巨大，必须在真实用户环境中采集数据'
  - '- 性能退化往往随版本迭代悄然发生，需建立自动化监控、告警、溯源体系，守住质量底线'
  - '**核心定义**'
  - '- **SDK 采集端**：轻量级脚本 (< 5KB gzip)，采集 Web Vitals (LCP/CLS/INP)、Resource Timing、JS
    错误、长任务、内存占用'
  - '- **上报通道**：`navigator.sendBeacon` (可靠、非阻塞、卸载页可用) 或 `fetch(keepalive)`，支持批量压缩上报'
  - '- **存储与查询**：ClickHouse / Apache Doris 等 OLAP 数据库，支持高基数标签（版本、页面、设备、地域）的秒级聚合'
  - '- **可视化与告警**：Grafana 看板展示 P75 趋势、Top 慢页面、错误率分布；Alertmanager 对接钉钉/飞书/企微，阈值触发告警'
  - '**关键性质**'
  - '- **采样率权衡**：全量上报成本高，通常按 10%-100% 采样，但核心业务页面/错误需 100% 上报'
  - '- **Source Map 解析**：上报堆栈为压缩后代码位置，平台需集成 Source Map 还原源码行列，定位到具体业务文件'
  - '- **指标归因**：LCP 差究竟是 TTFB 高、资源加载慢、还是渲染阻塞？需采集 Navigation Timing + Resource Timing
    全链路分解'
  - '**典型例子**'
  - '- 新版本发布后 LCP P75 从 2.1s 飙升至 3.8s，看板钻取发现某三方广告 SDK 同步阻塞主线程 800ms，回滚 SDK 版本恢复'
  - '- 灰度发布 5% 流量，监控 INP 指标无异常波动，放开全量；若超阈值自动触发 ArgoCD 回滚'
  - '- 通过长任务堆栈分析，定位某图表库 `resize` 事件未节流导致主线程拥堵，优化后长任务数下降 90%'
  - '**边界条件**'
  - '- SDK 自身性能开销必须极低：采集逻辑异步化、避免主线程阻塞、定期清理内存缓冲区防泄漏'
  - '- 隐私合规：采集数据需脱敏（用户 ID 哈希、URL 脱敏）、遵守 GDPR/个人信息保护法、提供退出机制'
  - '- 单页应用 (SPA) 路由变更需手动上报“虚拟 PV”，重置 LCP/CLS/INP 计算周期，避免污染整站聚合指标'
  sources:
  - paper: 20230418_041.md
    role: origin
  excerpts:
  - 自研轻量 SDK 采集 Web Vitals/资源错误/长任务、Beacon API 可靠上报、ClickHouse 存储、Grafana 可视化、阈值告警钉钉/飞书。
