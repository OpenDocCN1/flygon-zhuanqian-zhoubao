learning_targets:
- 理解注意力机制如何解决 RNN/CNN 的长距离依赖与并行计算瓶颈
- 掌握缩放点积注意力的数学推导、缩放因子作用及数值稳定性原理
- 理解多头注意力通过子空间分解实现多视角关系建模的机制
- 掌握绝对位置编码、可学习编码与 RoPE 相对位置编码的数学形式及外推性差异
- 能通过注意力可视化诊断模型对齐、指代消歧等语言学现象，理解‘注意力≠解释’的局限
- 能根据序列长度、显存预算选择标准注意力或 FlashAttention 等优化变体
concept_map:
- 第29章 注意力机制核心范式
- ├── 1. 序列建模困境与注意力直觉
- │   ├── RNN 串行瓶颈与梯度消失          —— P007, P009
- │   ├── CNN 固定窗口与感受野受限          —— P007, P009
- │   ├── Seq2Seq 信息瓶颈                    —— P007, P009
- │   └── 核心隐喻：聚光灯/动态资源分配      —— P007, P009
- ├── 2. 缩放点积注意力数学形式化
- │   ├── 核心公式：softmax(QK^T/√d_k)V       —— P010
- │   ├── Q/K/V 角色定义：查询/键/值          —— P010
- │   ├── 缩放因子 √d_k 防止 Softmax 饱和    —— P010, P019
- │   ├── 优势：并行矩阵乘法、数值稳定        —— P010, P019
- │   └── 局限：O(N²) 复杂度、排列等变性      —— P010, P019
- ├── 3. 多头注意力：多子空间协作建模
- │   ├── 分裂-并行-拼接流程                  —— P019, A47V
- │   ├── 头专业化：句法/语义/位置异构关系    —— P019, A47V
- │   ├── 参数隔离与梯度互不干扰              —— P019, A47V
- │   ├── 等价性：分组线性变换视角            —— P019, A47V
- │   └── 部署瓶颈：KV Cache 显存随头数线性增长 —— P019, A47V
- ├── 4. 位置编码：注入顺序感
- │   ├── 正弦绝对编码：线性关系支持相对位置   —— P020
- │   ├── 可学习绝对编码：无外推能力          —— P020, B95V
- │   ├── RoPE 相对位置编码：旋转矩阵注入      —— P020, B95V
- │   │   ├── 内积仅依赖相对距离 m-n          —— B95V
- │   │   └── 天然外推至长序列                —— B95V
- │   └── 外推修正：YaRN/LongRoPE 频率缩放    —— B95V
- └── 5. 注意力可视化与解读
- ├── 热力图展示：对齐/指代消歧/句法树    —— P022
- ├── 工具：BertViz, exBERT                 —— P022
- ├── 经典案例：Winograd Schema/代码作用域  —— P022
- └── 核心警示：注意力≠因果解释            —— P022
life_analogy:
- 想象注意力机制是一个**大型国际会议的同声传译系统**：
- '- **Query** = 译员手中的‘当前待译语句’'
- '- **Key** = 会场大屏上每位发言者的‘发言主题标签’'
- '- **Value** = 每位发言者的‘完整发言内容’'
- '- **点积相似度** = 译员快速匹配：当前语句与谁的主题最相关'
- '- **缩放因子 1/√d_k** = 译员戴上‘降噪耳机’，防止会场太吵（维度太大）导致听不清重点（Softmax 饱和）'
- '- **Softmax** = 译员分配‘专注度预算’：将 100% 注力按比例分给最相关的几位发言者'
- '- **多头注意力** = 配备 **8 位专业译员**（头），有的擅长语法结构，有的擅长专业术语，有的擅长语气情感，最后由**总监译员 (W^O)** 融合成最终译文'
- '- **位置编码 (RoPE)** = 给每句发言打上‘时间戳水印’，且水印设计巧妙：任意两句的‘时间间隔’只需比对水印旋转角度即可得知，无需记忆绝对时间，支持会议无限延长'
- 就像译员系统能实时聚焦关键发言、多视角并行解析、自动适应超长会议，注意力机制让模型在海量 Token 中精准‘看哪里’。
summary:
- concept: Query/Key/Value (Q/K/V)
  desc: 注意力机制三要素：Query=我要找什么，Key=我是什么，Value=我有什么内容
- concept: 缩放因子 √d_k
  desc: 抵消点积随维度增长的方差放大，防止 Softmax 进入饱和区导致梯度消失
- concept: 缩放点积注意力
  desc: Attention(Q,K,V)=softmax(QK^T/√d_k)V，仅含矩阵乘法，极致并行、数值稳定
- concept: 多头注意力
  desc: 将维度拆分为 h 个子空间并行计算，再拼接融合，实现句法/语义/位置等异构关系建模
- concept: 位置编码
  desc: 打破自注意力排列等变性，显式注入序列顺序信息
- concept: 正弦绝对位置编码
  desc: 利用三角函数线性关系编码绝对位置，隐含相对位置线性可表示性
- concept: 可学习绝对位置编码
  desc: 通过 Embedding 学习位置表示，表达力强但固定最大长度，无外推能力
- concept: RoPE (旋转位置编码)
  desc: 以旋转矩阵形式注入 Query/Key，内积仅依赖相对距离，天然支持相对注意力与长序列外推
- concept: 注意力可视化
  desc: 将注意力权重矩阵绘制为热力图，直观展示对齐、指代消歧、句法树等语言学现象
- concept: 注意力≠解释
  desc: 高注意力权重不等于因果贡献大，受残差/FFN 修饰，需结合梯度或干预实验验证
- concept: O(N²) 复杂度瓶颈
  desc: QK^T 矩阵显存随序列长度平方增长，长文本建模核心瓶颈，需 FlashAttention 等 IO 感知算法优化
exercises:
- 'no': 1
  title: 手算一次缩放点积注意力
  contents:
  - 给定单头注意力输入：
  - 'Q = [[1, 0], [0, 1]]  # (2, d_k=2)'
  - 'K = [[1, 0], [0, 1], [1, 1]]  # (3, d_k=2)'
  - 'V = [[1, 2], [3, 4], [5, 6]]  # (3, d_v=2)'
  - d_k = 2
  - 请按步骤计算：
  - 1. 计算 QK^T 得分矩阵 S (形状 2×3)
  - 2. 计算缩放因子 1/√d_k 并得到缩放后得分 S' = S / √2
  - 3. 对 S' 每行做 Softmax 得到注意力权重矩阵 A (形状 2×3)
  - 4. 计算最终输出 O = A × V (形状 2×2)
  - 思考题：
  - '- 若 d_k 增大到 100 且不除以 √d_k，假设 Q、K 元素均值为 0、方差为 1，点积方差约为多少？Softmax 输出会呈现什么极端分布？'
  - '- 为什么缩放因子用 √d_k 而不是 d_k？提示：考虑向量内积的方差性质。'
- 'no': 2
  title: 多头注意力参数量与显存估算
  contents:
  - 假设 Transformer 模型配置：d_model = 512, h = 8 头, d_k = d_v = 64, 序列长度 N = 2048, 批次
    B = 4, FP16 精度 (2 字节/参数)。
  - 计算：
  - 1. 单层多头注意力模块的总参数量 (包含 W^Q, W^K, W^V, W^O，不含偏置)
  - 2. 单层前向传播中 QK^T 注意力矩阵显存占用 (B × h × N × N)
  - 3. 单层 KV Cache 显存占用 (推理阶段，存储 K 和 V，形状 B × h × N × d_k/v)
  - 4. 若改用 GQA (Grouped Query Attention)，将 Key/Value 头数压缩为 2 组 (每组共享 K/V 投影)，重新计算上述
    2 和 3 的显存占用。
  - 思考题：
  - '- 为什么 GQA 能显著降低推理显存而训练显存降幅较小？'
  - '- 头数 h 从 8 增加到 16 (保持 d_model=512)，单头维度 d_k 变为 32，会对模型表达能力和推理显存产生什么影响？'
- 'no': 3
  title: 位置编码性质探究与 RoPE 手算验证
  contents:
  - 'Part A: 正弦位置编码的线性关系'
  - 给定正弦编码公式：PE(pos, 2i) = sin(pos/10000^{2i/d}), PE(pos, 2i+1) = cos(pos/10000^{2i/d})
  - 证明或数值验证：对于任意固定偏移 k，PE(pos+k) 可以表示为 PE(pos) 的线性组合 (即存在矩阵 T_k 使得 PE(pos+k) = T_k
    · PE(pos))。
  - 提示：利用三角函数和角公式 sin(α+β)=sinα cosβ+cosα sinβ。
  - ''
  - 'Part B: RoPE 相对位置内积验证'
  - 设 2 维 Query/Key 向量 q_m, k_n ∈ ℝ^2，RoPE 通过旋转矩阵 R_θ 编码位置：
  - q_m = R_{mθ} q,  k_n = R_{nθ} k, 其中 R_θ = [[cosθ, -sinθ], [sinθ, cosθ]]
  - 请手算验证：q_m^T k_n = q^T R_{(m-n)θ} k，即内积仅依赖于相对位置差 (m-n)。
  - 进阶思考：
  - '- 为什么 RoPE 只作用于 Query 和 Key，而不作用于 Value？'
  - '- 若序列长度超出训练长度 4 倍，RoPE 为何仍会性能下降？YaRN 通过缩放基础频率 θ (即修改 10000 基数) 如何缓解此问题？'
- 'no': 4
  title: 注意力可视化诊断实战
  contents:
  - 你正在调试一个中英翻译模型，发现它在翻译长定语从句时经常丢失主语。
  - 你提取了编码器-解码器第 4 层交叉注意力的平均头热力图 (目标端长度 15 × 源端长度 20)。
  - 观察到的现象：
  - '- 正常句子：热力图呈现清晰的近似对角线带状分布，对齐准确。'
  - '- 错误句子：生成目标动词 ‘loves’ 时，注意力权重分散在源句前半段 5 个词上，峰值仅 0.25，且未在源语主语 ‘He’ 上形成尖锐峰值 (峰值
    < 0.1)。'
  - 请回答：
  - 1. 这种‘注意力分散、峰值低、主语对齐缺失’的模式提示了什么潜在问题？
  - 2. 结合‘注意力≠解释’原则，仅凭此热力图能否断定模型‘没学会主谓关系’？还需要什么证据？
  - 3. 提出两个可操作的实验验证方向 (如：层级分析、消融实验、梯度归因等) 来进一步定位是编码器表示不足、解码器查询失效、还是注意力头冗余导致。
- 'no': 5
  title: 长序列注意力优化方案选型讨论
  contents:
  - 场景：需将 LLaMA-7B 扩展至 128k 上下文窗口，训练数据包含大量 32k-100k 文档，显存预算 8×A100-80G。
  - 候选方案：
  - A. FlashAttention-2 (标准注意力 IO 优化，保持精确计算)
  - B. 滑动窗口注意力 (SWA, 窗口 4096) + 全局注意力 Token
  - C. RoPE + YaRN 频率缩放 (外推至 128k，保持标准注意力)
  - D. 线性注意力 (如 Linear Transformer / RWKV 核函数近似)
  - 请从以下维度对比并给出推荐组合方案：
  - 1. 训练显存占用 (激活值 + 梯度)
  - 2. 推理 KV Cache 显存增长趋势
  - 3. 长距离依赖建模能力 (如 50k 处 Token 依赖开头指令)
  - 4. 实现工程复杂度 (对现有 HuggingFace/Transformers 代码侵入性)
  - 5. 与现有 RoPE 位置编码兼容性
  - 回答要求：给出首选方案及理由，并说明次选方案适用的互补场景。
