learning_targets:
- 理解前端国际化（i18n）与无障碍（a11y）工程化的必要性与核心标准
- 掌握运行时与编译时 i18n 方案的架构差异、ICU MessageFormat 语法及 TypeScript 类型安全落地
- 掌握翻译管理全流程工程化：CI/CD 集成、术语库一致性校验、机器翻译预译与人工复核流水线
- 熟练应用 WCAG 2.1 AA 级标准：语义化 HTML、ARIA 补全模式、键盘导航与焦点管理、颜色对比度达标
- 能按 WAI-ARIA APG 规范完成组件库级无障碍适配，输出合规报告与自动化回归测试体系
- 能搭建 i18n+a11y 自动化防护体系：Pre-commit/CI/Release 多层门禁、动态键/误报治理、人工辅助测试计划
concept_map:
- 前端国际化与无障碍工程化
- ├── 国际化（i18n）方案选型
- │   ├── 运行时库（vue-i18n/react-i18next） —— P001
- │   ├── 编译时库（LinguiJS/FormatJS）   —— P001
- │   ├── ICU MessageFormat 标准        —— P001
- │   └── TypeScript 类型安全键值      —— P001
- ├── 翻译管理工程化
- │   ├── TMS 平台接入（Crowdin/Lokalise） —— P002
- │   ├── GitHub Actions 双向同步流水线   —— P002
- │   ├── 术语库一致性校验与机翻预译      —— P002
- │   └── 发布门禁：翻译完整率 ≥ 99%     —— P002
- ├── 无障碍核心标准（WCAG 2.1 AA）
- │   ├── POUR 四大原则与 27 条成功标准  —— P003
- │   ├── 语义化 HTML 优于 ARIA           —— P003
- │   ├── 键盘导航、焦点陷阱、焦点指示器  —— P003
- │   ├── 颜色对比度 ≥ 4.5:1、文本缩放 200% —— P003
- │   └── NVDA/VoiceOver/TalkBack 三端测试 —— P003
- ├── 组件库无障碍适配
