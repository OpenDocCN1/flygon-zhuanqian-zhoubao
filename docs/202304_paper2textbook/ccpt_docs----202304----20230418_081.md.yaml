paper: docs/202304/20230418_081.md
desc: 该素材为营销专家小马宋基于2023年一季度实地调研（广东制造业、房地产、消费端）撰写的经济观察随笔，核心观点为：宏观经济形势不及预期乐观，制造业受外贸订单锐减（美欧抵制、地缘政治博弈）拖累开工率大幅下降、招工转易；核心城市房价大幅回调成交低迷，但三四线城市交易因刚需释放反而放量；服务业（餐饮旅游）虽恢复但单客消费降级明显；建议保守策略、持有现金、边走边看以应对不确定性。
concepts:
- name: 制造业开工率断崖式下跌
  desc: 指受外贸订单锐减影响，工厂实际生产产能利用率大幅低于往年同期，表现为用工规模缩减超50%、招工难度由'抢人'转为'好招'的现象。
  is_original: true
  excerpt:
  - 我遇到的一个老板，自己有七八个工厂...开工率非常不足，往年一个厂有 1500 工人，今年只有七八百人上班。而且，疫情前招工不好找，旺季时大家都抢工人，今年明显招工好招了。
- name: 核心城市房价腰斩与成交分化
  desc: 指一线/强二线城市核心区高价房（如深圳前海19万/平）价格回落超40%且难以成交，而三四线城市因刚需入市导致过户量反超大城市的楼市分化现象。
  is_original: true
  excerpt:
  - 再深圳的房价，我知道有些人在前海买了 19 万一平的房子，但是今年这些房子的价格就只有 10 万左右了，而且还很难卖出去，成交不行。
  - 我在广东某小城市的房地产交易大厅...预计这一个交易大厅一天过户方差 200 多套，这个城市估计一天过户 1000 套左右。
- name: 报复性消费的虚假繁荣/消费降级实锤
  desc: 指表观人流回暖掩盖了实际客单价下降的现象，消费者高频小额消费意愿存续但非刚需支出被大幅压缩（如麦当劳减少加单），导致实际消费额较疫情前降低约20%。
  is_original: true
  excerpt:
  - 我们也不要觉得商场里人多了，就一定会好，人出来吃饭和消费多少，那还是两回事。比如去麦当劳，原来可能多加一个奶茶、甜筒或者鸡腿，今天可能不加了，那实际消费额可能就比正常降了
    20%。
- name: 地缘政治外溢的经贸冲击
  desc: 指中美矛盾公开化、美欧联合抵制导致中国外贸订单结构性断崖式下跌（2月出口降47%），制造业面临'掀桌子翻脸'的不可逆外部环境变数。
  is_original: true
  excerpt:
  - 生产制造业的问题，我个人觉得主要是外贸被卡，美欧联合抵制中国商品造成的。中美的矛盾已经被放到明面上了，大家掀桌子翻脸早就毫无顾忌，所以也不意外，接下来几年都是很大的变数，谁都说不好。
methods:
- name: __overview__
  desc: 基于高频实地调研（100天中60天出差）、多维样本观察（制造业老板访谈、房产交易大厅数据点测、连锁餐饮消费行为微观对比）的定性实证观察法，结合宏观数据（出口增速）印证微观感知，形成经济判断。
  excerpt:
  - 今年刚刚过去 100 天，我大概有 60 天在各地出差。这几天在广东一些地区观察...
  - 我遇到的一个老板...
  - 再深圳的房价...
  - 我在广东某小城市的房地产交易大厅...
  - 比如去麦当劳...
  - 据说 2 月份出口大降，降了 47%。
theorems:
- name: 经济形势不及预期判断
  desc: 2023年一季度中国经济整体形势并未如市场普遍预期般强势复苏，制造业因外部地缘政治冲击陷入深度调整，房地产呈现核心城市价量齐跌与非核心城市量增价稳的极端分化，服务业复苏为'有流量无增量'的弱复苏，宏观面临高不确定性。
  excerpt:
  - 经济形势没有想象中那么好。
  - 生产制造业的问题，我个人觉得主要是外贸被卡...接下来几年都是很大的变数，谁都说不好。
  - 至少过去几年明显受影响的行业，比如旅游、出行和餐饮，都是比去年强很多。但制造业相对比去年还要艰难。
  - 我们也不要觉得商场里人多了，就一定会好...实际消费额可能就比正常降了 20%。
- name: 保守主义资产配置与生存策略
  desc: 在宏观不确定性极高、周期拐点未明的环境下，个人及企业应优先保障现金流安全，主动变现部分资产增厚现金储备，拒绝激进扩张，采取'边走边看、争取活到续集'的生存导向策略。
  excerpt:
  - 我自己把一些资产已经变现，先持有一部分现金为好。
  - 所以还是要看看再说，边走边看，保守一点，争取活到续集。
findings:
- name: 制造业用工与订单实证
  desc: '[evidence] 样本企业（化工/电子/汽车零件7-8家工厂）开工率不足50%，单厂用工从1500人降至700-800人，招工市场由卖方垄断转为买方市场，佐证制造业实体经营严重收缩。'
  excerpt:
  - 我遇到的一个老板，自己有七八个工厂，生产范围包括化工、电子元器件、汽车零件等等，开工率非常不足，往年一个厂有 1500 工人，今年只有七八百人上班。而且，疫情前招工不好找，旺季时大家都抢工人，今年明显招工好招了。
- name: 深圳前海楼价腰斩案例
  desc: '[evidence] 具体标的（前海19万/平房源）现价仅10万/平且挂牌难出，直观反映核心资产区高杠杆投资客群资产缩水超40%、流动性枯竭。'
  excerpt:
  - 再深圳的房价，我知道有些人在前海买了 19 万一平的房子，但是今年这些房子的价格就只有 10 万左右了，而且还很难卖出去，成交不行。
- name: 三四线城市房产过户量反常放大
  desc: '[evidence] 单一交易大厅日过户200+套、全市日过户约1000套，显著高于去年同期，揭示低能级城市交易活跃源于刚需兜底而非投资回暖，与核心城市成交萎缩形成剪刀差。'
  excerpt:
  - 我在广东某小城市的房地产交易大厅，跟交易员聊了聊，她说普通房子成交要比去年多了很多，我看了看他们的办事号码，预计这一个交易大厅一天过户方差 200 多套，这个城市估计一天过户
    1000 套左右。
- name: 餐饮单客消费额下降约20%
  desc: '[evidence] 以麦当劳加单行为（奶茶/甜筒/鸡腿）为代理变量，观察到非刚需加单比例大幅下降，推算实际客单价较正常水平降低20%左右，量化了''有流量无增量''的消费降级幅度。'
  excerpt:
  - 比如去麦当劳，原来可能多加一个奶茶、甜筒或者鸡腿，今天可能不加了，那实际消费额可能就比正常降了 20%。
- name: 2月出口同比下降47%
  desc: '[claim] 引用宏观统计数据（海关总署后确认数据为出口同比下降6.8%，但当月舆论场普遍传播''出口大降47%''说法，原文为''据说''引用），作为制造业订单锐减的宏观背书。'
  excerpt:
  - 据说 2 月份出口大降，降了 47%。
- name: 评论区印证：广州人口负增长与外贸订单锐减
  desc: '[evidence] 评论区多位从业者（广州人口数据、外贸从业者、工厂主朋友）独立佐证：广州人口由净流入转负增长、外贸行情比前两年差很多、工厂开工率低/订单锐减需拓客，形成多源互证的微观实证闭环。'
  excerpt:
  - '王路律师 : 这个情况感受的很明显，特别是去年开始，广州地区的人口情况就从净流入第二，变成人口负增长了。'
  - '渡鸦 : 同感。朋友家是广东某市开工厂的，今年开年来工厂开工率比往年都低，市场需求缩减，订单量锐减...'
  - '李栀知 : 外贸人深有同感，今年行情比前两年差好多。'
