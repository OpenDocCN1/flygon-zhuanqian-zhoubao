paper: docs/202304/20230418_124.md
desc: 该素材是一篇实操教程，介绍如何利用 GPT（ChatGPT）通过“设定角色-灌输领域知识-输入爆款素材-生成脚本”的四步工作流，实现抖音热门口播视频的低成本复制与量产。作者提出“教师视角”而非“老板视角”调教
  AI 的核心理念，强调分块喂料、多夸奖强化、构建个人 Prompt 库等关键技巧，并探讨了上下文窗口限制等实战痛点及解决方案。
concepts:
- name: AI 调教
  desc: 将大语言模型视为可训练的‘天才童工/实习生’，通过结构化的提示词工程（设定、喂料、纠偏）使其掌握特定领域技能，而非单纯的提问式使用。
  is_original: false
  excerpt:
  - 其实我们可以把 GPT 当成一个 3 岁神童，他的原始知识库是很粗浅的。但架不住他智商高呀，几千字的内容他一下子就能学会了。所以，他一定会成为我们 24 小时在线，任劳任怨，而且一教就会一点就通的天才童工。
  - 把自己当成一名老师，而不是老板……我们一直在教 GPT 怎么做得更好，我们是在传授。我们这样的调教方式，其实更像是让我们成为一名老师，把 GPT 当成一个智商
    250 的天才神童去培养。
- name: 教师视角 vs 老板视角
  desc: 使用 AI 的两种范式对比：老板视角指令模糊、甩手掌柜、怪 AI 不懂业务；教师视角提供知识库、范例、分步教学、耐心纠偏，最终获得高质量输出。
  is_original: true
  excerpt:
  - 太多人用 GPT 后就吐槽……真的是 AI 不行？还是你不行？这些人使用 GPT 时往往代入的是老板思维……而 GPT 就像是一个初入职场懵懵懂懂的小白……你觉得，从你以前刚毕业初入职场的亲身经历来看，是员工小
    G 的问题，还是老板的问题？
- name: Prompt 库
  desc: 用户沉淀的、可复用的高质量指令集合，涵盖学习指令设计、知识结构组织、范文库构建、迭代修正指令四大维度，是个人 AI 核心竞争力的护城河。
  is_original: false
  excerpt:
  - 一定要学会建立自己的 prompt 库，可以涵盖几个方面：1. 怎么发起学习指令让 GPT 更好地学会 2. 怎么样的知识结构能让 GPT 更好地领悟 3.
    上文没有投喂范文，其实投喂范文也是可以的，所以我们也要建立范文库…… 4. 还有一点案例里没有提到，那便是要不断修正
- name: 爆款复制逻辑
  desc: 基于‘爆过的选题往往都会再爆一遍’的假设，通过拆解竞品爆款结构（脚本框架+爆款因子），结合 GPT 重组生成差异化脚本，实现低成本量产。
  is_original: true
  excerpt:
  - 选题：来自热门视频，参照‘爆过的选题往往都会再爆一遍。’ 文案脚本：直接扒了同行，但是我们用了爆款脚本，甚至可能结构做得还比他们好。
- name: 上下文窗口限制
  desc: GPT 仅能在当前会话窗口内保持记忆，新会话需重新喂料；长文本输入会导致早期内容遗忘（遗忘曲线），需通过分块喂料、核心方法论压缩、Prompt 库复用来规避。
  is_original: false
  excerpt:
  - 你个人的，它只是当前这个聊天学会了你教的内容（能理解上下文），下次发起聊天还得重新来……有这个问题，因为我是作为一个助理，他反而也不需要太多的知识储备，更多的是了解方式方法，所以我目前的解决方法是真传一句话，不会给过多的信息，只给方法。
methods:
- name: __overview__
  desc: 抖音口播视频 GPT 量产四步工作流：1. 角色设定；2. 知识灌输（分块喂料+框架+范例）；3. 爆款素材输入重组；4. 落地执行（提词器/数字人+剪映剪辑）。
  excerpt:
  - 话不多说，直接上 PROMPT，抛一个实际运用案例来讲解一下如何调教 GPT
  - 第一步：给予设定……第二步：灌输知识……第三步：输入从别的热门视频里扒下的文案……第四步：无脑制作
- name: 角色设定协议
  desc: 通过结构化 Prompt 确立 GPT 身份、工作流触发词（‘请学习’/‘请为下面内容改写脚本’)、反馈机制（‘回答好的，我已经学会’)，建立人机协作契约。
  excerpt:
  - 你好 GPT~我有一个小忙需要你来帮助我，我希望你能成为我抖音脚本制作助理，我会教授你你需要参照的脚本框架，如果我向你输入的内容以‘请学习’为开头，则我是在教授你知识，请你认真学习，学会后请回答‘好的，我已经学会’。在教授一系列技巧后，我会以‘请为下面内容改写脚本’为开头，向你提供短视频内容，请你根据你学到的技巧为我创作相应段视频脚本。
- name: 分块喂料法
  desc: 将长文本知识库拆解为‘核心框架（如三段式脚本）+ 关键技巧（如黄金前3秒/钩子/留人/互动/升华）’的最小颗粒度，分多轮次输入，每轮要求 GPT 复述总结以验证学习效果，防止上下文溢出与‘囫囵吞枣’。
  excerpt:
  - 记得分块发知识……你发一长串，这小子其实也会说：‘好的，我已经学会了’。……然后你给了改写的内容，但是他写出来的内容就会很垃圾，也没有参照你投喂的内容写。
  - 请学习：常用脚本一：三段式脚本……请学习：爆款视频的五大因子……
- name: 正向强化提示
  desc: 在交互过程中主动给予 GPT 正向情绪反馈（夸奖、感谢、角色代入），利用 RLHF 机制提升模型后续输出的完成度与服从性。
  excerpt:
  - 多夸夸这小子……我发现多说他做得好，他会帮我干活干得更卖力。甚至你说：‘求求你了，神通广大的 GPT。’这逼还会把‘神通广大的 GPT’放到文案里
- name: 范文库驱动微调
  desc: 在 Prompt 中显式投喂高质量范文，并要求 GPT 自主总结范文的结构模式与爆款因子，验证其‘真学会’（能总结即懂原理），再基于此生成新内容。
  excerpt:
  - 上文没有投喂范文，其实投喂范文也是可以的，所以我们也要建立范文库。在训练另外一个类型的 GPT 时我已经测试过，核心点是要让他去自己总结，会总结就说明他真的学会了。甚至你还能从他总结的知识点学到新东西。
theorems:
- name: 执行力代偿定律
  desc: 项目不赚钱的核心原因非项目质量，而是人类执行力不足（知行分离）；GPT 通过将‘执行’外包给 AI，实现‘听话照做’的自动化闭环，弥补人类意志力缺口。
  excerpt:
  - 很多人在生财呆了快两年，为什么还没有赚到钱？我认为是一句生财里经常出现的话：‘听话，照做。’我们没有做到位。不是项目不赚钱，而是我们在执行上面出现了问题。
  - 但是，现在不一样了，GPT 出现了……最需要学习 ChatGPT 的是任何一名线上内容创作者
- name: 内容生产双料人才论
  desc: 未来优秀创作者的核心竞争力 = 顶层内容生产法则（方法论） + 熟练的 AI 调教能力；缺一不可，单纯懂技术不懂内容法则无法指挥 AI，单纯懂法则不会调教无法规模化。
  excerpt:
  - 未来真正优秀的博主，一定是一边拥有超级优秀的内容制作法则，另一边能够得心应手调教 GPT 的双料人才。
- name: 结构化知识迁移优于海量数据喂养
  desc: 受限于上下文窗口，向 GPT 喂养压缩后的‘方法论/框架/套路’（高密度信息）优于喂养海量原始语料（低密度信息）；前者可迁移复用，后者易溢出且泛化差。
  excerpt:
  - 有这个问题……他反而也不需要太多的知识储备，更多的是了解方式方法，所以我目前的解决方法是真传一句话，不会给过多的信息，只给方法。
findings:
- name: GPT 自主总结即掌握验证
  desc: '[evidence] 实测中，当 GPT 在‘分块喂料’后不仅回复‘已学会’，还能主动复述知识要点（如‘我明白了无形装逼的重要性’），且后续生成脚本能准确引用模板与爆款因子，证明分块喂料+总结验证机制有效。'
  excerpt:
  - 可以看到，在我们输入之后，GPT 不仅仅会说他学会了。他甚至还会自己总结这段内容里面他学到了什么，确实是真的学到。
  - 甚至他还会说明，这个脚本他是用了哪些模板，用了什么爆款因素。
- name: 长文本一次性喂料导致‘假学会’
  desc: '[evidence] 作者对比实验：一次性输入大量航海手册内容，GPT 秒回‘已学会’并催促下一步，但实际改写时‘很垃圾，也没有参照你投喂的内容写’，类比学渣‘囫囵吞枣’。'
  excerpt:
  - 你发一长串，这小子其实也会说：‘好的，我已经学会了’。而且他是一下子就回复你的……然后你给了改写的内容，但是他写出来的内容就会很垃圾，也没有参照你投喂的内容写。
- name: 会话级记忆隔离与 Prompt 库复用必要性
  desc: '[claim] 作者宣称 GPT 记忆仅限当前会话，新窗口需重新喂料；[evidence] 评论区用户实测证实‘下次发起聊天还得重新来’，且长对话存在‘遗忘曲线’（仅记得最后
    2-3 轮），验证了构建离线 Prompt 库、标准化喂料流程的刚需性。'
  excerpt:
  - 你个人的，它只是当前这个聊天学会了你教的内容……下次发起聊天还得重新来
  - 给 gpt 发送几十篇文章……大约只能总结最后的 2-3 篇内容。所以判断 gpt 应该只能记住最后的若干条内容
- name: 数字人/提词器闭环可行性
  desc: '[claim] 作者宣称脚本生成后，配合剪映提词器或数字人工具可实现‘无脑制作’全流程闭环，大幅降低拍摄门槛；[evidence] 素材中展示了
    GPT 输出含‘时长、建议视频素材’的详细分镜脚本，具备直接指导拍摄剪辑的执行力。'
  excerpt:
  - 录制：直接用剪映提词器录个口播就行，甚至现在还可以用数字人来做 剪辑：都告诉你配啥素材了，直接找素材就行了
  - 输出脚本包含：时长、建议配合怎么样的视频素材、景别、运镜、道具等字段
