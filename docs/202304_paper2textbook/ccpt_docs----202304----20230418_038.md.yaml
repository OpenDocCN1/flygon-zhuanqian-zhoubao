paper: docs/202304/20230418_038.md
desc: 该素材是一篇实战分享文章，作者陈俊强基于SEO流量公式，详细拆解了利用AI批量生成内容建设“站群”以获取精准搜索流量并实现商业变现的完整操作体系。核心主张在于：通过“深度魔改模型”生成海量长尾关键词内容，配合标准化的站群基建（域名、模版、词库筛选），普通人也能低成本实现日均万级UV及高客单价转化，并给出了具体的流量公式推演、词库获取策略、内容生产避坑指南（如公开模型无效）及商业合作模型。
concepts:
- name: AI站群
  desc: 利用AI技术批量建设、运营多个网站，通过规模化内容覆盖长尾关键词获取搜索流量的商业模式。
  is_original: false
  excerpt:
  - 请尽早拥抱 ai 站群。
  - 古老的站群，带来了这么多流量。而且躺赚就可以来的流量。
- name: SEO流量公式
  desc: 将SEO流量拆解为可量化、可操作的五个核心变量乘积：网页数 × 收录率 × 关键词日搜索数 × 上首页率 × 首页点击率。
  is_original: true
  excerpt:
  - 流量 = 网页数 * 收录率 * 关键词日搜索数* 上首页率 * 首页点击率
  - 最大单日流量 = 100 万 * 10% * 1 * 20% * 50% = 1 万 UV
- name: 深度魔改模型
  desc: 作者团队自研的内容生产核心技术壁垒，指在大模型基础上通过博士级算法团队进行矩阵运算、高等数学层面的深度参数调优，以规避搜索引擎对公开模型生成内容的识别与打压。
  is_original: true
  excerpt:
  - 深度魔改过，是什么意思呢？就是有博士给你做矩阵运算，高数，这些我永远闭嘴无法插上话的事情。深度魔改的话，就是你理解为一个大模型下来，魔改了非常多的细节。
  - cpm,chatgpt, 根据我的经验，100 万篇文章，全都收录了，但是没给流量。
- name: 流量站词库
  desc: 区别于行业精准词库，专指筛选‘单个关键词搜索结果数不超过500万’的低竞争长尾词，用于批量建站获取基础流量。
  is_original: true
  excerpt:
  - 切记，这个是做流量站的词库，这个不是做行业词库的方法...你仅需要筛出来单个关键词搜索结果数不超过 500 万的就行了。
- name: 万能选模版公式
  desc: 一种基于竞品逆向工程的模版筛选标准：选取行业Top20网站模版，排除大站，剩余模版即为相对收录较好的模版；核心技术手段为修改DIV+CSS类名实现模版差异化。
  is_original: true
  excerpt:
  - 选出 top20 的网站的模版，排除大站，剩下的模版就是这个行业里面相对收录比较好的模版。
  - 模版的修改最重要的点：DIV+CSS 的名字不一样，即可。
- name: 单页流量垄断
  desc: 一种精品站玩法：针对单一高价值关键词，建设10个站点垄断该词的搜索首页流量。
  is_original: true
  excerpt:
  - 这里我说一个单页流量的，就是这个网站只有一个单页...然后做 10 个站，垄断这个单页流量。
methods:
- name: __overview__
  desc: AI站群标准化建站与运营全流程：域名合规备案 -> 竞品逆向选模版(改CSS) -> 竞品挖掘筛词(搜索结果<500万) -> 词库分类建栏目(≤10万词)
    -> 标题获取(竞品采集/模型生成) -> 长尾词控制(月搜~30) -> 深度魔改模型批量产出内容 -> 发布收录变现。
  excerpt:
  - 第一个：域名...第二个：网站模版...第三个：词库...第四个：分类合并...第五个：标题...第六个：搜索量...第七个：文章
- name: 竞品域名批量挖掘法
  desc: 执行100个核心关键词搜索，抓取各前10页结果URL，去重清洗得到约1000个目标竞品站点域名库。
  excerpt:
  - 你只需要执行 100 个关键词，然后每个关键词的搜索结果，抓前 10 页，那么就有 10000 个域名了，然后清洗下，可能就剩下 1000 个了。
- name: 流量站关键词筛选法
  desc: 利用5118等工具导出竞品站点排名词库，核心筛选条件为：单个关键词搜索结果数（竞争度）≤ 500万，月搜索量约30（日搜索量1）。
  excerpt:
  - 你仅需要筛出来单个关键词搜索结果数不超过 500 万的就行了。
  - 搜索量：要控制在月搜索 30 的，就够了，不要去做大词。
- name: 模版差异化处理法
  desc: 购买付费WordPress模版，仅修改HTML结构中的DIV标签及CSS类名，不改变视觉布局，以此欺骗搜索引擎判定为独特模版，提升收录率。
  excerpt:
  - 你直接去 wordpress 搞个付费模版，然后改 div+css 的名字。
  - 模版的修改最重要的点：DIV+CSS 的名字不一样，即可。
- name: 标题低成本获取法
  desc: 若无法进行向量分类建模，直接采集搜索引擎结果页（SERP）中的竞品标题直接复用，而非原创撰写。
  excerpt:
  - 你去搜索引擎拿标题回来，然后你直接上就行。
theorems:
- name: 公开大模型内容必死定律
  desc: 主张任何公开的、未经深度魔改的大模型（如ChatGPT、CPM）生成的内容，即便被搜索引擎大量收录，也绝不会获得搜索流量分配；唯有深度魔改模型才能突破收录与流量的割裂。
  excerpt:
  - 任何公开，没有经过魔改的模型都要给百度干死
  - cpm,chatgpt, 根据我的经验，100 万篇文章，全都收录了，但是没给流量。
- name: 长尾词规模化换流量定律
  desc: 主张对于普通人/新站，不应挑战高竞争大词，而应通过站群规模（百万网页）覆盖月搜30左右的极长尾词，依靠数量级优势累积可观总流量。
  excerpt:
  - 你就是小白，你就做 30 次月搜的，然后批量上文章即可。
  - 100 万的网页 * 百分之十的收录 * 每个页面的日搜索量为 1 ... = 1 万 UV
- name: 模版收录决策论
  desc: 主张模版优劣不由美观决定，仅由‘该结构在搜索引擎历史收录表现’决定；最优模版来源于已被验证收录良好的中腰部竞品站点。
  excerpt:
  - 很多人说网站模版很重要，但是他们是说不出来挑选的准则的。我这里提供一个公式...选出 top20 的网站的模版，排除大站，剩下的模版就是这个行业里面相对收录比较好的模版。
- name: 搜索流量商业价值高阶论
  desc: 主张搜索引擎自然流量具有极高商业质量：客单价高（示例1万）、转化率稳定（2-10%）、边际成本低（躺平收割），适合高客单价业务（移民/留学/海外劳务）放大。
  excerpt:
  - 搜索引擎来的流量非常优质。而且很稳定，基本上躺平就可以有钱数。
  - 我的日 GMV 是这样算的= 1 万（客单价） * 100 个粉 * (2-10%) 的转化率 = 2 万-10 万 一天。
findings:
- name: 公开模型收录流量割裂实证
  desc: '[evidence] 作者实测：使用CPM、ChatGPT等公开模型生成100万篇文章，结果全量收录但流量为零，印证了‘收录≠流量’及‘公开模型无效’的结论。'
  excerpt:
  - cpm,chatgpt, 根据我的经验，100 万篇文章，全都收录了，但是没给流量。哈哈。哈哈。哈哈，刺激刺激。
- name: 站群流量公式实测达标
  desc: '[evidence] 作者截图数据印证：通过100万网页量、10%收录率、长尾词策略，实际达成日均1万UV，进而转化日增100+微信线索，验证公式有效性。'
  excerpt:
  - 先发截图，再说做什么事情...古老的站群，带来了这么多流量。
  - 有人问，大概一天能够加多少微信，我说了保底 100 个+（保证不打脸）
- name: 商业变现模型验证
  desc: '[claim] 作者宣称：基于日增100粉、客单价1万、转化率2-10%，日GMV可达2万-10万；已建立成熟合作体系，供稿给合作方建站100个起步，并拓展海外站群。'
  excerpt:
  - 基本上一天 1 万个 uv 左右，就有 100 个粉左右轻松轻松。
  - 我的日 GMV 是这样算的= 1 万（客单价） * 100 个粉 * (2-10%) 的转化率 = 2 万-10 万 一天。
  - 我仅合作 10 个国内客户，然后就出海搞美刀了。目前海外总共有 xx 个站在搞。
- name: 备案政策地域差异观测
  desc: '[evidence] 作者实操观察：广东地区个人/企业备案限制单次最多3个域名，杭州地区最多5个，揭示了站群规模化扩张中的合规基建物理约束。'
  excerpt:
  - 注意点，广东地区，只准许一次性最多 3 个域名备案，杭州的时候，备案最多 5 个一起。个人备案和企业备案是不一样的。
