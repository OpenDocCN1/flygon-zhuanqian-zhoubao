paper: docs/202304/FCc1dPLOBosBQIxNgAgctIgDnLg.md
desc: 该素材记录了作者加入生财有术社群一周内，从信息过载中建立双层漏斗模型筛选副业项目的完整实战复盘。第一层漏斗利用社群内“精华帖”与“航海实战”识别“前方有路”的已验证项目；第二层漏斗建立五维评估原则（兴趣能力圈、低门槛成本、收益确定性、短耐受周期、高天花板），对2月航海实战的15个候选项目逐轮筛选，最终形成P0-P2三级项目清单，并制定后续行动计划。
concepts:
- name: 双层漏斗筛选模型
  desc: 作者原创的项目筛选方法论框架。第一层‘验证漏斗’利用社群公开成功案例（精华帖、航海实战）快速锁定‘前方有路’的已验证项目，规避‘前路迷茫’风险；第二层‘原则漏斗’基于个人条件建立多维评估体系，通过逐轮淘汰匹配最优项目。
  is_original: true
  excerpt:
  - 我们需要建立漏斗，帮我们筛出合适的项目
  - 第一层漏斗：筛出前方有路的项目
  - 第二层漏斗：筛出原则内的项目
- name: 前方有路的项目
  desc: 指在生财有术社群内已被‘精华帖’或‘航海实战’验证过、具有明确路径和上岸率数据支撑的成功项目。核心作用是将‘赚钱最大的风险是前路迷茫’转化为‘看见所以相信’的确定性起点。
  is_original: true
  excerpt:
  - 什么是前方有路的项目？这里指的是已经被验证过的成功项目
  - 精华帖中圈友，会分享自己的成功项目，这里不就是大写地和你说‘此路可通’吗？
  - 航海实战不仅告诉你前路可通，甚至还告诉你可以怎么走
- name: 成功惯性
  desc: 通过先做‘前路通畅且有明确路线’的项目赚到第一桶金，建立正向反馈循环，进而提升后续挑战高难度项目的信心与能力。
  is_original: true
  excerpt:
  - 先选取前路通畅且有明确路线的项目，能提升我们赚第一桶金的概率，进而一步步增加我们的成功惯性
- name: 动态天花板
  desc: 收益天花板非静态，而是随项目执行深入、认知迭代、发现新痛点而动态上移。评估时需预留认知增长空间，而非仅看当前认知下的静态上限。
  is_original: true
  excerpt:
  - 天花板并不是静态不变，而是在解决具体问题的过程中，随着产生新的认知而动态发生变化
  - 当你在其中解决了一些问题后，可能会发现更多的痛点，从而找到更多需求和市场，因此收益天花板也在不断上移
- name: 及时正反馈
  desc: 普通人创业初期核心需求。指通过‘玩命执行’压缩变现周期，快速获得‘小胜’以建立信心，而非盲目追求延迟满足。
  is_original: false
  excerpt:
  - 建立及时正反馈，积小胜成大胜
  - 抓紧赚到第一块钱...我们是普通人，首先要的是信心，给自己创造小胜
methods:
- name: __overview__
  desc: 双层漏斗逐轮淘汰法：L1 验证源筛选（精华帖/航海实战）→ L2 多维原则评分（兴趣/成本/确定性/周期/天花板）→ 分级输出（P0/P1/P2）→
    行动计划制定。
  excerpt:
  - 第一层漏斗：筛出前方有路的项目...选取航海实战的项目
  - 第二层漏斗：筛出原则内的项目...制作一份表格来评估每个项目
  - 结合以上，目前我们在这一轮筛选后，置灰部分项目，剩下的项目见最右侧
- name: L1_验证源筛选法
  desc: 仅信任社群内两类高可信度来源：1）精华帖：圈友主动分享的成功复盘；2）航海实战：带教练、有路线、有上岸率数据（如2月85.5%）的实战营。以此替代主观判断‘前路是否通’。
  excerpt:
  - 生财有术内有哪些帖子会分享已经被验证过的成功项目呢？精华帖和航海实战
  - 此处附上一个 2 月的航海实战上岸率：85.5%
- name: L2_五维逐轮淘汰表
  desc: 建立候选项目清单，按五个维度顺序制作评估表，每轮仅保留通过项进入下一轮。维度顺序：1.兴趣能力资源圈匹配度（主观+适合人群画像对标） 2.金钱门槛成本（零/低成本优先）
    3.收益确定性（航海目标挂钩赚钱+上岸率+船员日志抽样） 4.耐受时间周期（以‘玩命执行’压缩周期替代外部数据参考） 5.动态收益天花板（亦仁解读+认知迭代预期）。
  excerpt:
  - 目前最为重视的几点是【进入门槛成本不高】【兴趣能力圈范围内】【收益天花板较高】【能积累复用资源】
  - 制作一份表格来评估每个项目
  - 项目 | 适合人群 | 评估 | 决策
  - 项目 | 门槛成本 | 评估 | 决策
  - 项目 | 收益评估 | 决策
  - 项目 | 收益天花板评估 | 决策
- name: AI_辅助能力补全
  desc: 在评估‘公众号爆文写作’时，将个人写作水平不足视为可由ChatGPT润色工具补全的非阻断项，体现将AI工具纳入个人能力圈边界的实用策略。
  excerpt:
  - 尽管个人写作水平不是很高，但是可以通过 ChatGPT 生产工具帮我来润色一下，还是有展望前景的
theorems:
- name: 普通人赚钱核心风险=前路迷茫定理
  desc: 赚钱/创业最大风险非能力不足，而是不知道前路是否通、宝藏是否在、努力是否打水漂。已验证项目的核心价值在于消除此不确定性，将风险降维为‘执行力问题’。
  excerpt:
  - 赚钱和创业最大的风险是前路迷茫，你不知道前路是否通，不知道前路是否有宝藏，不知道自己的努力是否会打水漂。但现在有人告诉你，前方有路，那剩下怎么走、走得多快就是自己的事情了
- name: 看见即相信原则
  desc: 普通人难以‘因为相信所以看见’，但能‘因为看见所以相信’。已验证项目的意义在于提供可观测的成功样本，为执行提供最小必要信念基石。
  excerpt:
  - 承认我们都是普通人，没法做到因为相信所以看见，但我们都可以因为看见所以相信。有时候普通人的成功项目，意义就是给自己带来一丝信念
- name: 第一桶金优先于天花板原则
  desc: 项目选择应优先保证‘能快速赚到第一桶金’（高确定性、短周期、低门槛），而非追求最高天花板。第一桶金建立成功惯性与信心，是后续放大收益的前提。
  excerpt:
  - 我们都是普通人，先选取前路通畅且有明确路线的项目，能提升我们赚第一桶金的概率，进而一步步增加我们的成功惯性
  - 抓紧赚到第一块钱...首先要的是信心，给自己创造小胜，之后才能成大胜
- name: 执行力压缩周期论
  desc: 项目耐受周期非固定客观常数，而取决于个人投入的时间/精力密度。与其查询他人周期数据，不如通过‘玩命执行’主动压缩周期，建立及时正反馈。
  excerpt:
  - 每个人投入的时间、精力是不同的，拿这个数据很难衡量实际上自己做的效果周期
  - 还是用亦仁提到的那句话，玩命执行吧，让自己用更多的时间精力缩短耐受时间周期
findings:
- name: 2月航海实战候选项目清单
  desc: '[evidence] 素材数据支撑：作者从2月航海实战数据中提取的15个原始候选项目，构成筛选漏斗的初始输入集。'
  excerpt:
  - 考虑到项目有时效性，因此截取的是 2 月份的航海实战项目：
  - '| 一级分类 | 项目 |'
  - '| 微信 / 视频号 | 朋友圈运营 |'
  - '| 交流/学习 | 风向标共读 |'
  - '| 小红书 / 美团 | 小红书店铺 |'
  - '| 抖音 | 抖音 SEO |'
  - '| 趋势 / 出海 | AI 绘画 & ChatGPT |'
  - '| 技能 / 成长 | 资料整理 |'
- name: 航海实战85.5%上岸率
  desc: '[claim] 原文宣称结论：引用张静伟@生财有术 2月航海数据同步，称航海实战2月上岸率达85.5%，作为‘前方有路’的强量化支撑。'
  excerpt:
  - 此处附上一个 2 月的航海实战上岸率：85.5%，这个数字难道还不够吸引人吗？数据来源于张静伟@生财有术 2 月航海数据同步
- name: 首轮筛选结果（兴趣/能力圈）
  desc: '[evidence] 素材数据支撑：基于‘适合人群画像’与自我评估对标，移除视频号带货、快团团、美团电商、抖音SEO/高客单/游戏推广、Web3、英文工具站、TikTok带货、线下实体引流等10个项目，保留朋友圈运营、风向标共读、小红书店铺(后调整为爆款笔记)、抖音小说推文、AI绘画&ChatGPT、资料整理共6个项目。'
  excerpt:
  - 以下是我筛选掉一些非兴趣和非能力资源内能做的项目
  - '| 项目 | 适合人群 | 评估 | 决策 |'
  - '| 视频号带货 | 爱刷短视频... | 没有很强的兴趣 | 从清单内移除 |'
  - 结合以上...剩下的项目见最右侧
- name: 次轮筛选结果（门槛成本）
  desc: '[evidence] 素材数据支撑：基于‘零/低金钱成本’标准，移除小红书店铺(需自有产品/5000元周转资金)，保留小红书爆款笔记(无货源可深耕)、AI绘画&ChatGPT(仅需魔法)、公众号爆文写作(零成本)共3个新增/保留项。'
  excerpt:
  - 对于当前时间充裕的我来说，成本指代的就是金钱成本，最好就是能够以极低成本甚至零成本就可以运转的项目
  - '| 小红书店铺 | ...手里周转资金大概 ¥5000 | 短期内不符合... | 从清单内移除 |'
  - 结合以上...剩下的项目见最右侧
- name: 三轮筛选结果（收益确定性）
  desc: '[evidence] 素材数据支撑：基于‘航海目标挂钩赚钱+上岸率+船员日志’量化，移除朋友圈运营、社群运营、风向标共读、同城聚会、精华共读、资料整理、时间管理、运动锻炼等8个长期/非直接变现项目，仅保留公众号爆文写作、小红书爆款笔记、抖音小说推文、AI绘画&ChatGPT。'
  excerpt:
  - 我会去观察航海项目的目标是否和赚钱挂钩，以及如果是，那么上岸率如何，并且抽样看船员日志
  - '| 朋友圈运营 | 属于长期需要耕耘... | 短期内从清单移除 |'
  - 结合以上...剩下的项目见最右侧
- name: 最终项目分级清单
  desc: '[evidence] 素材数据支撑：经过五轮筛选后形成的最终决策输出。P0(最高优先级)：公众号爆文写作；P1：AI绘画&ChatGPT、抖音小说推文；P2(探索项)：小红书资料引流、抖音图文引流。'
  excerpt:
  - '## 最终筛选出来的项目'
  - '*   P0：公众号爆文写作'
  - '*   P1：AI 绘画 & ChatGPT、抖音小说推文'
  - '*   P2：小红书资料引流、抖音图文引流'
