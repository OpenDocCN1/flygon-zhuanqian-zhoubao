  - '![](img/ac91afe6afc0706ede7ccc1854eb97dd.png)'
- name: 长尾收益持续性验证
  desc: '[evidence] 作者停止主动运营（发布不足10个作品）后，项目依然持续产生收益，验证‘管道收入’特性。'
  excerpt:
  - 从开始到现在我就发了不到十个作品（纯纯懒）
  - 我一直到现在还有收益
- name: 淘宝源码供应链成熟度验证
  desc: '[evidence] 评论区确认淘宝搜索“匿名信源码”即可大量购买到包含服务器、域名、短信通道、部署服务的全套交付产品，技术门槛极低。'
  excerpt:
  - 'bink : 淘宝直接搜匿名信源码就可以  会出来一大堆'
  - 通常都是服务器域名短信通道全包的。 ... 技术人员会手把手帮你部署，小白也不用太担心会复杂
