paper: docs/202304/WhpFdcM8NotQqvxuqIacwEuUnbb.md
desc: 该素材记录了一位生财有术圈友参与2023年2月航海项目的完整决策复盘过程。作者从亦仁发布的16个航海选题（涵盖视频号、小红书、抖音、AI、英文工具站、私域运营、个人成长等赛道）出发，结合自身资源禀赋（技能、资金、执行力、现有资产）与生存压力（面临回去打工），经历初筛（兴趣删除）、再筛（动机分析）、深度推演（非它不可理由排序）三轮筛选，最终确定选择“公众号爆文写作”作为主攻方向，并规划了7个自学备选方向。文中详细展示了决策中的关键逻辑：亦仁“指路+执行”论、涛哥“实干家+月入2千有手就行”论、矩阵化放大思维，以及对自己“秒执行力不足、抗挫折周期短”的深度自省。
concepts:
- name: 生财航海
  desc: 生财有术社区组织的周期性集体实战学习项目，由亦仁策划选题，圈友报名参与，通过‘航行指南’、实战打卡、大作业等形式，在特定赛道（如视频号、小红书、公众号等）完成从0到1的业务闭环。
  is_original: true
  excerpt:
  - 2月航海哪条船更适合你？
  - 这周六要考。请各位同学拿出笔，我来划一下2月的航海重点
  - 边学边干边分享，不管你是不是已经在做，还是刚想学，都可以继续报名
- name: 深耕版航海
  desc: 亦仁计划推出的付费进阶项目，面向已在航海中找到方向并取得成绩的圈友，提供更长周期、专属社群服务，助力单一领域深度耕作与收益放大。
  is_original: true
  excerpt:
  - 有没有更深度的航海，比如更长周期，专属社群等等？
  - 等我忙完这阵，就可以来安排深耕版航海，服务想专注深耕某领域的圈友继续放大收益，当然，这个肯定要收费了，且不会很低。
- name: 矩阵化/产品化/外包化操作
  desc: 亦仁指出的高阶玩家打法：跑通单账号/单店模型后，通过批量复制账号（矩阵化）、标准化流程为产品（产品化）、外包执行劳动力（外包化）实现规模化收益。
  is_original: true
  excerpt:
  - 能力强的，向来都是矩阵化产品化外包化操作。
  - 如果一个公众号一个月仅凭流量主，能搞到100块，那么矩阵化之后，同一领域互相引流，做上10个账号，就是月入1K了。
- name: 红利期认知
  desc: 亦仁强调的平台红利观：赚到的钱是平台释放的红利而非纯个人本事，红利会消失，因此当有钱赚时必须All in投入资源放大收益，而非小富即安。
  is_original: true
  excerpt:
  - 当你有钱赚的时候，请不要小富即安，all in进去投入更多的资源和精力，放大当前的收益。我们目前赚到的钱，不要以为是自己的本事，是平台释放的红利而已，很快就会消失。
- name: 资料整理变现模型
  desc: 面向无专业知识输出能力人群的低门槛变现路径：收集整理公域优质内容 -> 结构化呈现 -> 作为引流钩子或直接售卖，利用‘懒人经济’赚取差价。
  is_original: true
  excerpt:
  - 对于很多圈友来说，其实是没有专业知识的...但我让你收集整理一下...这个你大概率能完成，我愿不愿意付费？当然，我需要这样的整理好的东西，节约了我大量时间。
  - 这个脏活累活整理好的内容，反而很多人愿意买单，因为绝大多数人实在是太懒了。
- name: 风向标共读
  desc: 生财有术核心内容板块‘风向标’的集体阅读项目，亦仁认为熟读风向标3000条可建立商业嗅觉，发现‘闷声发财’的冷门项目。
  is_original: true
  excerpt:
  - 如果你问我的商业嗅觉和思维从何处来，我会告诉你，熟读风向标3000条，你眼里面就全是赚钱机会。
  - 对了，哪里可以找到没那么多人知道的闷声发财的项目？亦仁遥指风向标。
- name: 快团团社群团购
  desc: 基于微信群的私域分销模式，区别于社区团购（地推），核心流程为：公域引流/私域好友 -> 进微信群 -> 群内好物推荐/社群运营 -> 团员下单 ->
    赚取佣金，核心在于人设建立与信任维护。
  is_original: false
  excerpt:
  - 快团团和社区团购还是不一样的...流程就是拉人进微信群，做好物推荐的分享，群员（团员）下单购买了，就有佣金。
  - 关键在于做好人设，维护与团友的联系，获得信任
methods:
- name: __overview__
  desc: 三阶段漏斗式决策法：初筛（基于直觉/兴趣删除不感兴趣项） -> 再筛（基于动机分析/资源匹配度打标：重要紧急/重要不紧急/排除） -> 深度推演（基于生存压力、高手指路逻辑、执行力自省、赛道特性对比，列举‘非它不可’理由排序决策）。
  excerpt:
  - 动作：我不感兴趣的直接【删除】
  - 一个个看，从后往前看。这些项目我感兴趣在哪里？
  - 我选择这条船的理由分别是什么？分别列举非它不可的理由。或者按照重要程度进行排序
- name: 高手指路-执行二步法
  desc: 亦仁提出的赚钱核心公式：步骤1（占10%）给高手转钱/求指路获取确定性方向；步骤2（占90%）玩命执行/深耕细作。素材中作者将7个备选航海视为‘高手指路’的产物，从而聚焦于解决执行力问题。
  excerpt:
  - 两个步骤—— 1. 给我转5万，我告诉你一个一定能年赚百万的方法， 1. 玩命执行，做到了，今年你就能赚100万！
  - 其中，第一个步骤就是高手指路。那么上面筛选出的7条船，都是非常不错的方向。而第二个步骤的玩命执行。重点就是深耕细作，全身心投入进去。
- name: 赛道筛选排除法
  desc: 作者基于个人约束条件（无产品、技能弱、抗挫折周期短、怕放弃）的逐层排除逻辑：排除需强技能/长周期/无直接变现/需重度社交的赛道，最终锁定‘已有积累+可结合AI+可矩阵化’的公众号赛道。
  excerpt:
  - 从赚钱可能性来看，⑦AI绘画/ChatGPT排在最末，因为我该领域相关能力太过薄弱。随后是②朋友圈运营，因为这个项目并不能直接变现...
  - 抖音系的三个直接排除。因为我怕我到时候看不到希望而再次中途放弃。
theorems:
- name: 实干家胜过研究家定律
  desc: 涛哥观点：实干家不考虑太多，抓住机会即干，往往干成；研究家爱琢磨红海竞争、风险，结果不行动、赚不到钱。
  excerpt:
  - 实干家比研究家更能赚到钱。因为实干家不考虑太多，抓住机会就是干，往往能干成；而研究家喜欢去琢磨，这个赛道已经红海了，竞争太过激烈，赚不到钱了，算了吧。
- name: 月入两千‘有手就行’论
  desc: 涛哥观点：生财项目库大部分项目，月入2千属于‘有手就行’（代指‘有行动就行’），赚不到钱是因为不愿意执行、懒。
  excerpt:
  - 生财项目库大部分的能赚钱的项目，月入2千属于是有手就行，真的是有手就行。（个人认为，涛哥这里的手，代指‘行动’，真的去行动了，就能赚到月入两千。）
- name: 赚钱差距归因论
  desc: 亦仁观点：同一个项目别人赚100万自己赚不到1万，唯一原因是‘自己不行’；不行只因两点：看得不够多、尝试得不够多。
  excerpt:
  - 一个项目，别人能赚100万，但我赚不到1万，只有一个原因，那就是我不行。而不行的原因只有两点：1. 看得不够多； 1. 尝试得不够多。
- name: 私域终点论
  desc: 花爷/涛哥观点：流量的终点就是微信；未来二十年法则‘保持健康，做好私域；我们有人，他们有钱’，确立微信私域（朋友圈/社群）为核心资产阵地。
  excerpt:
  - 花爷也分析过，流量的终点，就是微信。
  - 涛哥未来二十年的16字法则‘保持健康，做好私域；我们有人，他们有钱’
- name: 搜索流量精准转化论
  desc: 作者深度认同的SEO核心价值：通过搜索来的流量是最精准、最容易转化的流量，因此看好抖音SEO等搜索生态机会。
  excerpt:
  - 通过搜索来的流量，才是最精准的流量，也是最容易转化的流量
findings:
- name: 最终决策结果
  desc: '[evidence] 作者经过三轮筛选与深度推演，最终选择‘公众号爆文写作’作为主攻航海方向，并列出7个自学备选方向（资料整理、ChatGPT、朋友圈运营、抖音图文引流、小红书爆款/IP、抖音SEO、英文工具站、风向标共读）。'
  excerpt:
  - 最终我的选择是——公众号爆文写作。
  - 留几个心眼去自学的有...资料整理、ChatGPT、朋友圈运营、抖音图文引流、小红书爆款笔记、小红书IP、抖音SEO、英文工具站、风向标共读
- name: 抖音图文引流实战模型验证
  desc: '[evidence] 作者通过搜索往期精华帖验证‘抖音图文引流’玩法：引流到微信成交卖资料，QQ群/知识星球留存资料，素材来源于同行修改，核心需求是‘勤奋’，属于‘有手就行’项目。'
  excerpt:
  - 搜索精华帖后，看到就是：引流到微信成交，卖资料。放在qq群留存资料提供下载...资料来源是同行的资料稍加修改。或许可以跟小红书引流结合着做？...真的是有手就行的项目。
- name: 知乎好物历史复盘教训
  desc: '[evidence] 作者复盘2020-2022年知乎好物经历：20年末知晓项目，21年中唱衰时他人新手入局月赚几万，22年自己仅得38元收益。教训：秒执行力差、中途放弃、恐惧红海论调，印证‘生财里没有赚不到钱的人，只有不愿意去执行的懒人’。'
  excerpt:
  - 第一次知道这个项目是20年年末家蒙的分享...到了21年中...实战群里有个人...巅峰时期就是一个月赚到了好几万...到了22年...知乎好物收益38元。我为什么当时不认真干下去？说白了还是我的个人问题。我的「秒执行」能力太差了。
- name: ChatGPT变现现状与提问工程需求
  desc: '[evidence] 作者已解决ChatGPT账号注册/使用问题，实现微薄变现（6元助人注册），但核心痛点在于不会‘提问’（Prompt Engineering），认为这是玩转ChatGPT进行内容创作的关键，计划结合公众号写作实践。'
  excerpt:
  - 我已经搞定了chatGPT，随时能用...我现在的最大问题就是，还没有掌握「如何提问」的方法。怎么提出一个好问题？这是玩转chatGPT的关键。
  - 前两天变现了6块钱。因为我帮了一个陌生人解决了chatGPT注册的问题...主动发了红包
- name: 公众号现有资产盘点
  desc: '[evidence] 作者持有三个公众号资产：主号（日更46天，日均阅读20-30，粉丝341）、财经号（买的，粉丝8000+，久未更新）、健身号（粉丝90+，久未更新），为选择公众号爆文写作提供了‘已有积累’的客观条件。'
  excerpt:
  - 目前已经写到第46天。日均阅读量二三十。粉丝数当前341，其中，日更之后的涨粉数刚好70个。
  - 手头还有一个财经类公众号，是买的，粉丝还剩八千左右...还有一个健身类公众号，粉丝90多
