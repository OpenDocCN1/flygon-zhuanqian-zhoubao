life_analogy:
- 想象多模态与复杂交互是一场**‘多专家协作的悬疑案件侦破’**：
- '- **视觉语言模型** = **‘法医+目击者’双重身份的侦探**：'
- '  - **图像Token** = 现场照片像素级证据'
- '  - **区域引用** = 侦探手中的放大镜/红圈标记：‘重点看这个伤口’'
- '  - **视觉思维链** = 侦探的‘现场勘察笔录’：先记录现象（观察），再分析线索（推理），最后定性（结论）'
- '- **上下文工程** = **‘有限容量的案发现场白板’**：'
- '  - **工作记忆** = 白板核心区挂着的‘最近3天行动日志’'
- '  - **短时记忆** = 白板侧边的‘案情阶段性摘要’'
- '  - **长时记忆** = 架子上的‘历史卷宗库’（向量检索），需要时调阅'
- '  - **钉死首尾** = ‘案件核心指令’与‘铁律’永远钉在白板最显眼的顶部和底部'
- '- **代理规划** = **‘总指挥的作战地图’**：'
- '  - **ReAct** = ‘边打边侦察’的游击战术：灵活但易迷失'
- '  - **Plan-and-Solve** = ‘详细作战计划’再发兵：稳健但缺乏应变'
- '  - **Reflexion** = ‘复盘会’：打完一仗总结教训，修正下一步计划'
- '- **长上下文/失落中间** = **‘超长卷宗的阅读陷阱’**：'
- '  - **现象** = 侦探阅读百页卷宗时，开头结尾记得清，中间关键线索却‘视而不见’'
- '  - **对策** = 把‘致命证据’抽出来单独装订成‘重点材料’夹在卷宗最前面（前置），或在页边贴‘重要’便利贴（结构化标记），或让助手先写‘分章摘要’再汇总（Map-Reduce）'
summary:
- concept: 多模态提示组件
  desc: 文本指令+图像Token+区域引用+跨模态标记，构成VLM输入的最小完整单元
- concept: 视觉思维链
  desc: 引导模型输出‘观察→分析→推理→结论’结构化步骤，将隐性视觉感知显性化
- concept: 分层记忆架构
  desc: 工作记忆(近期原文)+短时记忆(摘要)+长时记忆(向量库/画像)，解决上下文窗口有限问题
- concept: 检索式对话历史
  desc: 基于语义相似度召回相关历史轮次，优于定长滑动窗口，平衡Token预算与信息相关性
- concept: ReAct范式
  desc: 思考-行动-观察循环，适合探索性任务，但单步错误易累积导致偏离
- concept: Plan-and-Solve范式
  desc: 先全局生成结构化执行计划(DAG/步骤列表)再执行，适合确定性流程，运行时灵活性弱
- concept: Reflexion/自我反思
  desc: 执行后对比预期与实际，触发重规划或参数修正，引入语言层面的强化学习修正机制
- concept: 失落中间现象
  desc: Transformer在长序列中对中间Token关注权重系统性偏低，导致关键证据位于中间时被忽略
- concept: 注意力引导策略
  desc: 关键信息前置/后置、结构化标记、分块摘要、检索重排序等手段强制模型聚焦关键段落
- concept: Map-Reduce长文本处理
  desc: 超长文档先分块摘要(Map)再汇总(Reduce)，规避中间遗忘，但可能丢失跨块关联信息
exercises:
- 'no': 1
  title: 多模态提示设计与视觉思维链实战
  contents:
  - 场景：你需要让 GPT-4V 分析一张复杂的财务报表截图（包含多个表格、图表、备注文字），回答‘Q3 营收同比增长率是多少？’。
  - 任务：
  - 1. 设计一个包含<image>标记、区域引用（如表格区域坐标）的多模态 Prompt 模版。
  - 2. 编写引导‘视觉思维链’的指令，要求模型先输出：图表类型识别 → 关键坐标轴/表头定位 → 目标数值提取 → 计算过程 → 最终答案。
  - 3. 列举该 Prompt 在以下边界条件下可能失效的原因：
  - '   - 报表截图模糊、分辨率低'
  - '   - 报表跨页，关键数据在两张图中'
  - '   - 模型幻觉出一个不存在的‘Q3 总计’行'
- 'no': 2
  title: 多轮对话上下文工程：压缩与检索的权衡
  contents:
  - 场景：构建一个代码助手 Agent，上下文窗口 8k Token。当前对话已进行 20 轮，包含：需求讨论、架构设计、3 个文件的完整代码、报错堆栈、修复方案讨论。
  - 任务：
  - 1. 设计一个分层记忆填充方案，分配 Token 预算给：系统提示、近 3 轮原文、历史摘要、用户偏好画像、相关代码片段检索结果。说明你的分配理由。
  - 2. 如果用户突然问‘第 5 轮我们讨论的那个单例模式的线程安全问题怎么解决的？’，你的检索式历史召回策略如何确保召回那段对话？向量检索可能失败吗？
  - 3. 对比‘定长滑动窗口(最近 4k Token)’与‘摘要+检索’两种策略在‘长期一致性人设’和‘近期细节追溯’两个维度的优劣。
- 'no': 3
  title: 代理规划范式选择与失败诊断
  contents:
  - 场景：目标‘自动完成一个包含前后端的用户注册登录模块开发，并部署到测试环境’。
  - 任务：
  - 1. 分别用 ReAct、Plan-and-Solve、Reflexion 三种范式写出该任务的前 3 步高层规划伪代码/结构化输出。
  - 2. 分析：若基座模型是 7B 开源模型，哪种范式最可能失败？为什么？
  - 3. 运行中途，后端启动报错‘端口被占用’。ReAct 范式下 Agent 可能如何错误循环？Plan-and-Solve 如何处理？Reflexion 会触发什么机制？
  - 4. 设计一个‘人工确认关卡’插入点，防止 Agent 误删生产数据库配置。
- 'no': 4
  title: 长上下文‘失落中间’缓解方案对比实验设计
  contents:
  - 场景：有一份 100k Token 的法律合同语料，其中第 40k-45k 位置藏着一句‘乙方可随时单方面终止合同无需赔偿’的关键陷阱条款。模型上下文窗口
    128k。
  - 任务：
  - 1. 设计 4 个实验组 Prompt 策略：
  - '   - A组：原文直接塞入（对照组）'
  - '   - B组：关键信息前置（将该条款移到开头）'
  - '   - C组：结构化标记（给每章加<Chapter><Title>标签）+指令‘重点阅读终止条款’'
  - '   - D组：Map-Reduce（分章摘要→汇总问答）'
  - 2. 预测四组在‘发现陷阱条款’准确率上的排序，并解释理论依据（注意力机制、Token位置偏置、信息丢失）。
  - 3. 如果合同长 500k Token，超出窗口，D 组 Map-Reduce 会丢失什么跨章节关联信息？如何改进？
units:
- 'no': 1
  name: 视觉语言模型提示：图文对齐与视觉思维链
  points:
  - '**为什么需要这个概念？**'
  - '- 纯文本提示工程无法直接处理图像、视频等视觉模态输入'
  - '- 多模态模型（如GPT-4V、LLaVA）需要显式指定图像在对话中的位置与引用方式'
  - '- 复杂视觉推理任务（如图表分析、几何题求解）需要引导模型进行“视觉思维链”，即先感知再推理'
  - '**核心定义**'
  - '- 多模态提示 = 文本指令 + 视觉Token（图像编码后的向量序列）+ 跨模态交互标记（如<image>、区域坐标）'
  - '- 视觉思维链：提示模型输出“观察→分析→推理→结论”的结构化中间步骤，将视觉感知过程显性化'
  - '**关键性质**'
  - '- 图像分辨率与Token消耗呈二次方关系，需在细节保留与上下文窗口间权衡'
  - '- 模型对图像在上下文中的相对位置敏感，通常“图文交替”优于“图文分离”'
  - '- 区域引用（如坐标框、指点坐标）能显著提升细粒度视觉定位任务的准确率'
  - '**典型例子**'
  - '- 图表问答：提示中嵌入图表图像，指令“请先描述图表类型、坐标轴含义、数据趋势，再回答问题”'
  - '- 视觉定位：用户上传图片并标注“红框内是什么？”，模型需结合坐标Token理解指向性'
  - '**边界条件**'
  - '- 当图像包含大量密集文本（如全页PDF）时，纯视觉模型OCR能力有限，需结合文本提取工具'
  - '- 多图对比任务中，模型易混淆图像顺序，需在提示中强制编号（如Image 1, Image 2）'
  - '- 视觉思维链可能增加幻觉风险：模型可能“编造”未观察到的细节来填补推理链条'
  sources:
  - paper: 20230418_088.md
    role: origin
  - paper: 20230418_089.md
    role: improve
  excerpts:
  - 多模态提示的独特组件包括图像Token序列与区域引用标记。
  - 视觉推理的提示策略需显式引导模型进行感知与推理的分步骤输出。
- 'no': 2
  name: 多轮对话与上下文工程：状态压缩与记忆管理
  points:
  - '**为什么需要这个概念？**'
  - '- LLM上下文窗口有限，长对话必然面临“遗忘”或截断问题'
  - '- 简单拼接历史对话会导致Token浪费、关键信息被稀释（Lost in the Middle）'
  - '- 业务场景需保持长期人设、偏好记忆、任务状态一致性'
  - '**核心定义**'
  - '- 上下文工程：在固定窗口内，通过压缩、摘要、检索、固定锚点等手段，最大化有效信息密度的系统性方法'
  - '- 分层记忆：工作记忆（近期轮次原文）、短时记忆（对话摘要）、长时记忆（向量化知识库/用户画像）'
  - '**关键性质**'
  - '- 摘要压缩会丢失细节（如具体数字、人名），需配合关键实体抽取保留槽位信息'
  - '- 检索式历史（基于语义相似度召回相关轮次）优于定长滑动窗口，但引入检索延迟与召回不全风险'
  - '- 系统提示与少样本示例需“钉死”在窗口首尾，防止被挤出'
  - '**典型例子**'
  - '- 客服机器人：近3轮原文+历史摘要+用户画像标签+相关知识库片段，总Token<4k'
  - '- 编程助手：当前文件上下文+相关依赖文件摘要+最近编辑历史+项目规范文档'
  - '**边界条件**'
  - '- 当对话轮次极长（>50轮）且任务强依赖早期细节时，纯压缩策略失效，必须引入外部结构化存储'
  - '- 摘要模型若能力弱于主模型，会引入“摘要幻觉”污染上下文'
  - '- 多语言对话中，压缩可能丢失语言切换的隐式上下文线索'
  sources:
  - paper: 20230418_090.md
    role: origin
  - paper: 20230418_091.md
    role: improve
  excerpts:
  - 解决长对话中的上下文窗口溢出、一致性漂移问题，引入摘要记忆与检索式对话历史。
  - 状态压缩技术包括对话摘要、关键实体抽取、滑动窗口与语义检索融合。
- 'no': 3
  name: LLM代理规划与任务分解：从单步到复杂目标达成
  points:
  - '**为什么需要这个概念？**'
  - '- 单轮提示无法解决需要多步工具调用、条件分支、错误重试的复杂任务'
  - '- 模型缺乏内在的“项目管理”能力，易陷入循环、遗漏子目标或工具调用参数错误'
  - '- 需要显式的规划模块将高层目标分解为可执行的原子动作序列'
  - '**核心定义**'
  - '- Planning：生成结构化执行计划（如JSON/DAG/步骤列表），包含子任务、依赖、工具、预期产出'
  - '- Task Decomposition：将复杂指令递归拆解至可直接由工具执行的粒度'
  - '- Self-Reflection：执行后对比预期与实际结果，触发重规划或参数修正'
  - '**关键性质**'
  - '- ReAct范式：思考-行动-观察循环，适合探索性任务，但易因单步错误累积导致偏离'
  - '- Plan-and-Solve：先全局规划再执行，适合确定性流程，但缺乏运行时灵活性'
  - '- 规划粒度权衡：太粗→执行歧义大；太细→规划Token消耗大且脆弱'
  - '**典型例子**'
  - '- AutoGPT风格：目标“调研竞品定价” → 分解：搜索官网→爬取价格页→结构化提取→对比表生成'
  - '- 代码生成Agent：需求→架构设计→接口定义→逐模块编码→单测验证→集成跑通'
  - '**边界条件**'
  - '- 规划能力强依赖基座模型推理上限，小模型（<7B）规划常不可用'
  - '- 长链路规划中，早期决策错误会放大（蝴蝶效应），需引入人工确认关卡或奖励模型验证'
  - '- 动态环境（如网页结构变化）下，静态规划失效，需具备在线重规划能力'
  sources:
  - paper: 20230418_092.md
    role: origin
  - paper: 20230418_093.md
    role: improve
  excerpts:
  - 剖析Planning、Task Decomposition、Self-Reflection在自主代理中的提示实现模式。
  - ReAct、Plan-and-Solve、Reflexion等范式的对比与适用边界分析。
- 'no': 4
  name: 长上下文处理策略：失落中间现象与注意力引导
  points:
  - '**为什么需要这个概念？**'
  - '- 尽管模型声称支持32k/128k/1M上下文，实际有效利用率随位置呈U型曲线：首尾高、中间低'
  - '- 关键证据（如检索关键句）若位于中间，模型极大概率“视而不见”导致回答错误'
  - '- 单纯堆叠文档无法保证生成质量，必须显式引导模型注意力'
  - '**核心定义**'
  - '- Lost-in-the-Middle：Transformer注意力机制在长序列中对中间Token关注权重系统性偏低的现象'
  - '- 注意力引导：通过提示工程（指令、标记、结构化）或模型干预（位置偏置、检索增强）强制聚焦关键段落'
  - '**关键性质**'
  - '- 关键信息前置/后置策略：将最核心的指令、少样本示例、检索到的关键证据放在上下文首尾'
  - '- 结构化标记：使用XML标签、Markdown标题、特殊分隔符显式划分语义块，辅助模型定位'
  - '- 分块摘要/Map-Reduce：超长文档先分块摘要，再汇总，规避中间遗忘，但可能丢失跨块关联'
  - '**典型例子**'
  - '- 合同审查：将“核心风险条款”提取放在Prompt开头，原文放在结尾供溯源'
  - '- 代码库问答：检索Top-K相关片段，按相关性倒序排列（最相关在最前/最后），而非按文件顺序'
  - '**边界条件**'
  - '- 当有效上下文长度超过模型实际注意力跨度（如>32k实测有效）时，前置策略也会失效'
  - '- 过度的注意力引导指令（如“重点阅读第3段”）会消耗宝贵Token，且可能被模型忽略'
  - '- 多跳推理任务需跨段落综合信息，单纯前置无法解决，需显式要求模型列出引用源片段'
