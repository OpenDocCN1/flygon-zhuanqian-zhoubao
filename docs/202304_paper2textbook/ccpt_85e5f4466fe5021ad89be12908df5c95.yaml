paper: docs/202304/YE1FdsTuxoaBbNx4f5dcnSNenxb.md
desc: 该素材是一篇详尽的实操教程，记录了作者在无法使用 Depay 平台时，改用 Nobepay 虚拟信用卡平台配合欧易（OKX）购买 USDT，成功开通 ChatGPT
  Plus 会员的全过程。文章涵盖了平台对比选择、账号注册与 KYC 认证、USDT 充值购买流程、虚拟卡开卡细节（含卡段选择策略）、ChatGPT 订阅支付与账单地址填写技巧（免税州选择、节点匹配），并提供了详细的费用拆解与成本核算，旨在为国内用户提供一条低门槛、可复现的订阅路径。
concepts:
- name: 虚拟信用卡开卡平台对比模型
  desc: 作者基于开卡费、充值手续费、月费三个维度，建立的 Nobepay 与 Depay 两大平台成本对比决策模型，核心结论为：月消费低于 60 美元选 Nobepay
    更划算，超过则选 Depay。
  is_original: true
  excerpt:
  - nobepay的成本是【开卡费1U+充值3%手续费+0月费】
  - depay的成本是【开卡费0U+充值1.35%手续费+1U月费】
  - 如果每个月只是用来开通chatgpt plus的话，nobepay相对来说会更划算，如果每个月消费超过60U的话，用depay会更划算。
- name: 卡段可用性风险
  desc: 指不同 BIN 码（卡段）在特定商户（如 OpenAI）上的支付成功率差异。作者实测 556766 卡段稳定可用，而 531847 等低门槛卡段虽起充金额低但可能因风控拥挤导致支付失败，需支付额外开卡费试错。
  is_original: true
  excerpt:
  - 不同的卡段有不同的开卡起充金额，556766卡段开卡最低起充30＄，像531847卡段就是开卡最低10$起充，不过有可能会出现用的人太多，开通plus的时候不成功，需要重新开卡的情况
  - 因为每开一次新卡，都会扣1$的开卡费，保险起见，为了避免开的卡段无法使用，就直接开了556766卡段
- name: 账单地址-节点一致性原则
  desc: ChatGPT Plus 订阅支付时，账单地址所在的国家/地区必须与代理节点的出口 IP 归属地一致，且推荐使用美国免税州地址以节省税费，这是支付通过风控的关键环节。
  is_original: false
  excerpt:
  - 账单地址最好和节点位置保持一致，漂亮国的地址就用漂亮国的节点，其他国家的节点就用其他国家的账单地址
  - 使用美国虚拟地址生成器（https://www.dizhishengcheng.com/Index/custom_result），选择一个免税州，点击搜索，生成虚拟地址
- name: 欧易平台分级认证与资产解冻机制
  desc: 欧易（OKX）要求用户完成三级实名认证（Lv.1-3）方可解除提币限制。作者因仅完成两级导致提币被冻结 7 天，补全三级认证并申诉后 3 分钟解封，揭示了合规认证与资金流动性的强绑定关系。
  is_original: false
  excerpt:
  - 最好是把3个等级的个人认证全部做完。
  - 我当时买币的时候只做了前两个等级的认证，充完币后直接被锁定了，需要等7天后才能操作，于是就提起申诉，但是提起申诉需要进行第三等级的个人认证，于是就把第三等级的个人认证也给做了，申诉后大概3分钟就通过了
methods:
- name: __overview__
  desc: 全链路开通 ChatGPT Plus 标准作业程序（SOP）：平台选型 -> Nobepay 注册 KYC -> 欧易注册认证买 USDT -> USDT
    提币充值 Nobepay -> 开通虚拟卡(选 556766 段) -> 生成免税州账单地址 -> 切换美区节点支付订阅。
  excerpt:
  - 第一步，打开官方地址，切换成中文
  - 第二步，注册... 第三步，登录... 第四步，认证... 第五步，充值... 第六步，注册欧易平台... 第七步，开卡... 第八步，充值chatgpt
    plus
- name: Nobepay KYC 认证流程
  desc: 通过关注指定公众号 -> 填写问卷 -> 微信扫码人脸核验，完成实名认证，符合国内监管合规要求，门槛低于 Depay 的海外身份证件认证。
  excerpt:
  - 登录进去之后，需要关注公众号，填写问卷，KYC认证
  - 1、关注公众号... 2、填写问卷... 3、微信扫码完成KYC认证
- name: USDT 充值兑换法
  desc: 规避 Nobepay 人民币直充 500 元起充且不可提现的限制，改为在欧易购买 USDT（泰达币），经 TRC20/ERC20 等链上提币至 Nobepay
    充值地址，实现小额、灵活、可控的资金注入。
  excerpt:
  - 因为人民币充值最低要500元起充，并且不能提现，所以推荐采用USDT充值。
  - 点击“资产”→“提币”→“USDT”→“链上提币”... 输入提币数量... 点击提交，大概一两分钟，资金就会到账。
- name: 虚拟卡开卡与账单地址生成法
  desc: 在 Nobepay 选择 556766 卡段、起充 30 美元、使用随机地址生成器填写持卡人信息（姓名改实名）；支付时使用美国地址生成器选取免税州（奥勒冈、阿拉斯加等）生成账单地址，配合同地区代理节点完成
    AVS 验证。
  excerpt:
  - 点左边菜单栏——我的卡片——快速开卡——选择556766——填写完信息——开卡
  - 如果你不知道怎么填写，可以用旁边的“随机地址”... 最好把姓名栏换成自己的姓名。
  - 使用美国虚拟地址生成器... 选择一个免税州... 生成虚拟地址，把生成的虚拟地址信息填进去
theorems:
- name: 低频订阅场景下 Nobepay 成本优势定理
  desc: 在单月消费金额低于 60 美元（如仅订阅 ChatGPT Plus 20 美元）的场景下，Nobepay 的“零月费+高手续费”模式总成本低于 Depay
    的“低手续费+固定月费”模式。
  excerpt:
  - nobepay的成本是【开卡费1U+充值3%手续费+0月费】
  - depay的成本是【开卡费0U+充值1.35%手续费+1U月费】
  - 如果每个月只是用来开通chatgpt plus的话，nobepay相对来说会更划算，如果每个月消费超过60U的话，用depay会更划算。
- name: 首次开通总成本锚定定理
  desc: 首次开通 ChatGPT Plus 的综合成本锚定在约 23.6 USDT（含买币手续费、充值手续费、开卡费、充卡手续费、订阅费），折合人民币约 163
    元；后续续费成本降至 21-22 USDT（约 144-152 元），节省开卡费与部分链上手续费。
  excerpt:
  - 总共花了23.6USDT，相当于163元人民币左右
  - 下次续费的话，由于省了1U的开卡费... 所以如果下次续费的成本大概在21USDT到22USDT之间，换算成人民币大概在144到152元左右。
- name: 支付风控通过三要素假说
  desc: ChatGPT Plus 订阅支付成功的必要条件为：1. 高质量原住民 IP 节点（非机房 IP）；2. 账单地址与节点 IP 归属地严格一致；3.
    卡段 BIN 码通过 OpenAI 风控白名单（如 556766）。缺一不可。
  excerpt:
  - 如果点击订阅后，显示卡片被拒，大概率是节点的问题，更换高质量节点；
  - 账单地址最好和节点位置保持一致...
  - 如果卡片一直被拒，暂停操作，等第二天再尝试
findings:
- name: 首次实操全流程耗时与成本实证
  desc: '[evidence] 作者实测从夜里 10 点半到凌晨 1 点，耗时 2.5 小时一次性成功开通。购买 36 USDT 花费 248.05 元人民币，扣除欧易提币费
    1U、Nobepay 充值费 2%(0.7U)、开卡费 1U、充卡费 3%(0.9U)、订阅费 20U，实付 23.6 USDT，余额 12.4 USDT
    不可提现仅可消费。'
  excerpt:
  - 从夜里10点半到凌晨1点，花了两个半小时一次成功开通chatgpt，共充值248.05元，最后还剩12.4美金，总花费163元左右
  - 欧易平台手续费扣了1USDT... nobepay扣了2%（0.7USDT），开卡费1USDT，充卡费30USDT扣了3%（0.9USDT），开通chatgpt
    plus花了20USDT，总共花了23.6USDT
- name: 欧易提币手续费固定最低值观测
  desc: '[evidence] 欧易平台 USDT 链上提币手续费实测固定扣除 1 USDT（非比例扣除），作者推测存在最低 0.1 USDT 起扣规则，但小额提币时手续费率极高（36U
    扣 1U 约 2.8%），显著增加小额用户成本。'
  excerpt:
  - 欧易平台手续费扣了1USDT（据说这个手续费最低是一次0.1USDT起，不过目前我还没有尝试）
  - 我是直接提了全部36USDT，提币手续费扣了1USDT
- name: 欧易风控触发与申诉解封实证
  desc: '[evidence] 未完成三级实名认证直接买币提币会触发风控冻结 7 天；补全三级认证后发起申诉，约 3 分钟自动/人工解封。证明完成最高级别
    KYC 是规避资金冻结的前置必要条件。'
  excerpt:
  - 充完币后直接被锁定了，需要等7天后才能操作，于是就提起申诉，但是提起申诉需要进行第三等级的个人认证，于是就把第三等级的个人认证也给做了，申诉后大概3分钟就通过了，账户就可以正常操作了。
- name: Nobepay 充值到账延迟与查看技巧
  desc: '[evidence] USDT 提币提交后约 1-2 分钟到账；若前端页面余额未刷新，点击“个人中心”可立即查看到账资金，属前端渲染延迟非链上延迟。'
  excerpt:
  - 点击提交，大概一两分钟，资金就会到账。
  - 如果页面一直不刷新余额，点击个人中心就可以看到充值的资金了。
- name: 免税州地址生成器有效性验证
  desc: '[evidence] 使用 dizhishengcheng.com 生成的俄勒冈、阿拉斯加、特拉华、蒙大拿、新罕布什尔五个免税州地址，配合美区节点成功通过
    OpenAI 账单地址验证（AVS），避免了约 8%-10% 的消费税额外支出。'
  excerpt:
  - 使用美国虚拟地址生成器（https://www.dizhishengcheng.com/Index/custom_result），选择一个免税州，点击搜索，生成虚拟地址
  - 美国免税州：1、俄勒冈州（Oregon） 2、阿拉斯加州（Alaska） 3、特拉华州（Delaware） 4、蒙大拿州（Montana） 5、新罕布什尔州（New
    Hampshire）
