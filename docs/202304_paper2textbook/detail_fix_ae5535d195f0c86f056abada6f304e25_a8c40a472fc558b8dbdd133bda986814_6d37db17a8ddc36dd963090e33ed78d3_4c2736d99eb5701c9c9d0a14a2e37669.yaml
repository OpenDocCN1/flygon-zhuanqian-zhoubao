- 'no': 5
  name: 质量门禁流水线 —— 让“不合格代码”无法入库
  points:
  - '**为什么需要这个概念？**'
  - '- 代码评审靠人肉无法覆盖：性能退化、安全漏洞、无障碍缺陷、包体积超标、类型错误、测试覆盖率下降均需自动化工具拦截'
  - '- “跑通流程 ≠ 质量达标”，必须建立量化指标阈值（性能预算、覆盖率底线、严重漏洞零容忍）作为 CI 红线，自动阻断合并'
  - '- 反馈越左移成本越低：本地 pre-commit -> CI Pipeline -> 预发布环境 -> 生产监控，构建多层防御体系'
  - '**核心定义**'
  - '- CI/CD 流水线阶段：`Lint` (ESLint/Stylelint/Markdownlint) -> `TypeCheck` (tsc --noEmit)
    -> `Test:Unit` (Vitest + Coverage 阈值) -> `Test:E2E` (Playwright 核心链路) -> `Build`
    (Vite 生产构建) -> `Scan` (依赖漏洞/密钥扫描/包体积分析) -> `Deploy` (ArgoCD GitOps 同步)'
  - '- 质量门禁阈值：`statements/branches/functions/lines` 覆盖率 ≥ 80%（核心包 95%）、`bundle size`
    gzip < 500KB（首屏）、`LCP` < 2.5s、`CLS` < 0.1、`INP` < 200ms、高危漏洞 0 个、无障碍 `axe-core`
    违规 0 个'
  - '- GitOps 发布：ArgoCD 监控 Git 仓库 `manifests/` 目录，自动同步 K8s 资源，支持 `PreSync`（跑迁移/冒烟测试）、`PostSync`（健康检查/通知）、自动回滚（健康检查失败）'
  - '**关键性质**'
  - '- 快速反馈：利用 pnpm 内置并行、Vitest 线程池、Playwright 分片、TurboRepo 远程缓存，将全流水线压缩至 15 分钟内'
  - '- 可视化看板：Grafana 看板展示各阶段耗时趋势、覆盖率趋势、部署频次/成功率/前置时间/恢复时间（DORA 四大指标）'
  - '- 渐进式收紧：新项目首月宽松（覆盖率 50%、仅阻断 Error 级 Lint），每季度收紧 5%，配合技术债务专项偿还计划'
  - '**典型例子**'
  - '- PR 提交触发：GitHub Actions 矩阵并行跑 `Node 18/20`、`Chrome/Firefox/Safari`、`Linux/macOS`，生成合并报告（覆盖率徽章、体积分析图、E2E
    视频回放）'
  - '- 夜ly 发布：定时触发 `main` 分支全量构建、跑全量 E2E、性能基准对比（Lighthouse CI）、安全扫描（Trivy/Snyk），生成《每日构建质量报告》推送钉钉/飞书'
  - '- 回滚演练：混沌工程定期注入故障（Pod Kill/网络分区/CPU 限流），验证 ArgoCD 自动回滚 < 2 分钟、业务无感知'
  - '**边界条件**'
  - '- 遗留项目接入需“分层降级”：存量代码允许 `eslint-disable`、覆盖率豁免目录，但新增/修改文件必须达标（`eslint-plugin-import/extensions`
    强制）'
  - '- E2E 测试易脆：需建立 `test-id` 稳定选择器规范、Mock 后端契约（MSW/Pact）、冒烟用例与回归用例分离、失败自动重跑 2 次再判定'
  - '- 单体前端应用构建慢：利用 Vite `build.modulePreload`、`chunkSplit` 策略、ESBuild 压缩、云端远程缓存（Turborepo/Nx
    Cloud）加速'
  - '**素材溯源**'
  - '- 20230418_117.md 至 20230418_126.md：覆盖 CI/CD 流水线、性能/安全/无障碍基线门禁、灰度发布、回滚演练、混沌工程'
