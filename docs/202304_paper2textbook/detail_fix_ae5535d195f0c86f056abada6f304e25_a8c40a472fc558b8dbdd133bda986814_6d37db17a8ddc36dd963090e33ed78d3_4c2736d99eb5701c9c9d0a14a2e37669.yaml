- 'no': 3
  name: 基础设施封装层 —— 造好“轮子”让业务跑得飞快
  points:
  - '**为什么需要这个概念？**'
  - '- 直接在业务代码中裸用 Ant Design、Axios、Vue Router 会导致：API 耦合业务逻辑、切换底层库成本高、横切关注点（鉴权、国际化、异常、监控）散落各处'
  - '- 每个项目重复造“封装轮子”浪费人力，且质量参差不齐，缺乏统一技术标准'
  - '- 中后台高频场景（CRUD 表格、复杂表单、权限控制、主题切换）需沉淀为开箱即用的“企业级脚手架能力”'
  - '**核心定义**'
  - '- `@enterprise/ui`：二次封装组件库（Ant Design/Arco Design），暴露统一 Props/Events/Slots 契约，内置权限指令
    `v-auth`、表单校验集成、表格列配置_schema_化、主题变量注入'
  - '- `@enterprise/request`：基于 Axios/Fetch 封装，内置：统一错误码处理、Loading 自动管理、Token 无感刷新（防并发重复请求）、请求/响应拦截器链、Mock/MSW
    切换'
  - '- RBAC 权限体系：`v-auth="[''user:create'']"` 指令 + `<Auth comp="Button" ... />` 组件
    + 路由元信息 `meta: { roles: [''admin''] }` 三位一体'
  - '- 动态路由注册：后端返回路由树 -> 递归转换为 `RouteRecordRaw` -> `router.addRoute` 注册 -> 菜单联动渲染
    -> 刷新持久化（Pinia + localStorage）'
  - '**关键性质**'
  - '- 零侵入业务：业务代码仅依赖 `@enterprise/*`，不知底层是 Ant Design 还是 Element Plus'
  - '- 类型安全全链路：请求层泛型 `request<T>(config)`、路由对象 `typed-router`、组件库 `vue-component-type-helpers`
    提取 Props 类型'
  - '- 可观测性内置：请求自动上报 TraceID、组件渲染性能标记、错误边界自动捕获上报 Sentry'
  - '**典型例子**'
  - '- 典型 CRUD 页面开发：`ProTable` 组件仅需传 `columns`、`requestApi`、`rowKey` 三个核心配置，自动实现分页、搜索、新增/编辑抽屉、删除确认、导出
    Excel、列设置持久化'
  - '- 权限控制：页面级由路由守卫拦截，按钮级由 `v-auth` 指令隐藏，接口级由 BFF 返回 403 触发请求层统一弹窗提示'
  - '**边界条件**'
  - '- 封装层版本升级必须遵循 SemVer，Breaking Change 需提供 Codemod 自动迁移脚本（如 `jscodeshift`）批量修复业务代码'
  - '- 避免“过度封装”：保留 `rawRequest`、原生组件 `ref` 暴露底层能力，防止“为了封装而封装”限制业务发挥'
  - '- 组件库升级（如 Ant Design v4 -> v5）属于重大变更，需在 Monorepo 中并行维护双版本、灰度迁移子应用'
  - '**素材溯源**'
