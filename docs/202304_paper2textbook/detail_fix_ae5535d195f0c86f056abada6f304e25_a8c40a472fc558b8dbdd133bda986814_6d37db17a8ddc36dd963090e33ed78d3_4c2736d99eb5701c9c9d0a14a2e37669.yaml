- 'no': 7
  name: AI 赋能前端工程化新范式 —— 从“手写代码”到“智能研发闭环”
  points:
  - '**为什么需要这个概念？**'
  - '- 大模型能力跃迁使 AI 能胜任代码生成、重构、测试、文档、评审等全链路研发任务，但缺乏工程化落地范式导致“玩具化”应用'
  - '- 团队面临：Prompt 管理混乱、上下文窗口不足、幻觉风险、私有代码泄露、模型能力与业务场景错位等工程化挑战'
  - '- 需要建立“提示词即代码、RAG 即知识库、Agent 即自动化、Review 即质检、微调即专家”的系统性工程体系'
  - '**核心定义**'
  - '- Prompt Engineering 标准化：PromptTemplate + ExampleSelector 机制，实现提示词与业务逻辑解耦、动态少样本检索、A/B
    测试版本控制'
  - '- 结构化输出与类型安全：JsonOutputParser/PydanticOutputParser + 修复重试机制，实现“自然语言输入 -> 类型安全对象输出”'
  - '- RAG 知识库：Tree-sitter AST 切片 + Embedding 向量化 + Milvus/Chroma 存储 + Hybrid Search（稀疏+稠密）+
    引用溯源'
  - '- Agent 自动化工作流：LangGraph/AutoGen 编排 Planner/Coder/Tester/Reviewer 多 Agent，工具调用、状态机流转、人工审批检查点'
  - '- AI Code Review：GitHub Action 触发 PR Review -> 调用内部模型 -> 结构化评审意见 -> 集成 ESLint/TypeCheck
    结果 -> 自动生成单测草案'
  - '- 前端专用模型微调：CodeLlama/DeepSeek-Coder + LoRA + 高质量前端语料（组件库/工具库/最佳实践）+ RLHF 对齐'
  - '**关键性质**'
  - '- 提示词工程化：提示词纳入版本控制、CI/CD 集成、参数化复用、自动优化（OPRO/DSPy）'
  - '- 知识资产化：代码库变成可查询、可推理、可进化的知识图谱，而非静态文档'
  - '- 自动化闭环：需求 -> 代码 -> 测试 -> 部署 -> 监控 -> 反馈 -> 训练数据，形成数据飞轮'
  - '- 可观测性：LangSmith/LangFuse 全链路 Trace，Token 成本、延迟、错误率、通过率可视化'
  - '- 安全合规：代码脱敏、私有部署、数据不出域、审计日志、模型输出合规性校验'
  - '**典型例子**'
  - '- 新功能开发：PM 写 PRD -> Agent 拆解任务 -> Coder 生成代码/单测 -> Tester 运行验证 -> Reviewer 评审
    -> 人工确认合并'
  - '- Bug 修复：Sentry 告警 -> Agent 定位根因 -> 生成修复 PR -> 关联 Issue -> 自动回归测试'
  - '- 重构升级：依赖升级 -> Codemod 生成迁移脚本 -> 批量修改 -> 单测/E2E 保护 -> 灰度发布'
  - '- 文档生成：代码变更 -> 自动更新 API 文档/架构图/变更日志 -> 多语言同步'
  - '**边界条件**'
  - '- 幻觉风险：生成代码必须经 CI/CD 验证，禁止直接上线；关键路径（支付/安全）必须人工双审'
  - '- 上下文限制：长任务需拆解为子任务、RAG 检索相关上下文、避免单次对话超限'
  - '- 成本控制：Token 预算设定、模型级联（小模型过滤/大模型生成）、语义缓存命中复用'
  - '- 技能迁移：开发者核心能力从“写代码”转向“设计系统、审代码、训模型、管数据”'
  - '**素材溯源**'
  - '- HgjLdWdxHo8ezoxv9iLc4HSwnAh.md：AI 编程助手现状、RAG 落地、Agent 工作流、模型微调、AI Code Review
    机器人'
