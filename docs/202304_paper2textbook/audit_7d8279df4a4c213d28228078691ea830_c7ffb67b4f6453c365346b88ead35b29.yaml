unsupported_claims:
- location: ch40.3
  claim: RNN 的串行特性使得无法利用现代 GPU 的并行计算能力，且长距离依赖面临梯度消失困境。注意力机制的核心直觉是‘聚光灯’：模型不再被迫将整个序列压缩进一个固定向量，而是学会在生成每一步时‘看’哪里。传统
    Seq2Seq 的 Context Vector 成为信息瓶颈，注意力机制通过保留所有编码器隐状态并动态加权，打破了这一瓶颈。
  reason: 素材中未找到支撑
- location: ch40.4
  claim: 点积注意力相比加性注意力，计算效率高得多，因为可以利用高度优化的矩阵乘法库。缩放因子 1/√d_k 的作用是防止维度 d_k 过大时，QK^T 点积数值过大，推入
    Softmax 饱和区导致梯度消失。标准化公式：Attention(Q, K, V) = softmax(QK^T / √d_k)V，这是 Transformer
    所有变体的基石。
  reason: 素材中未找到支撑
- location: ch40.5
  claim: 多头注意力允许模型在不同表示子空间、不同位置联合关注信息。实验表明：不同注意力头自发分工，有的专注句法依存，有的专注共指消歧，有的专注位置模式。
  reason: 素材中未找到支撑
- location: ch40.6
  claim: Transformer 纯注意力结构是排列等变的，不加位置编码无法区分‘狗咬人’和‘人咬狗’。正弦位置编码利用三角函数波长差异编码位置，理论上支持任意长度外推，但高频分量在长距离易混淆。RoPE
    通过旋转矩阵将绝对位置注入 Query/Key，使得注意力分数仅依赖相对距离，是目前长上下文主流方案。
  reason: 素材中未找到支撑
- location: ch40.7
  claim: 注意力可视化揭示：BERT 无监督学会了依存句法树结构，特定头对应特定依存关系。警惕‘注意力即解释’谬误：注意力权重高不代表该 Token 对输出贡献大，可能是信息聚合的‘垃圾桶’
    Token（如 [SEP]）。工具：BertViz, Transformer-Interpret, AttentionViz 支持交互式多层多头热力图探索。
  reason: 素材中未找到支撑
