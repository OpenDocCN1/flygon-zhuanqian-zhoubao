paper: docs/202304/20230418_139.md
desc: 该素材是一篇名为《我用生财教我的方法做短剧》的实操精华帖，作者云珞分享了基于生财有术社群方法论的短剧推广变现全流程 SOP，涵盖短剧基础认知、变现底层逻辑、标准化操作流程（选剧、剪辑、发布、数据复盘）、新手低成本快速试错策略及适用人群分析，强调通过素材分类管理实现复用降本，适合追求月入一二千副业收入的新手小白执行落地。
concepts:
- name: 短剧推广分销 (CPS模式)
  desc: 短剧变现的核心模式，即通过剪辑短剧高光片段发布至抖音/快手/视频号等平台，挂载小程序链接，引导用户充值观看后续剧集，推广者按充值金额比例分佣。
  is_original: false
  excerpt:
  - 二、变现逻辑
  - 短剧 CPS 推广：帮短剧方推广，用户在小程序充值看剧，我们拿分成。
- name: 短剧 SOP (标准化作业程序)
  desc: 作者提炼的短剧推广全流程标准化操作手册，包含开通权限、选剧避坑、素材下载分类、去重剪辑技巧、发布优化、数据复盘六大模块，旨在实现‘听话照做、第二天出单’。
  is_original: true
  excerpt:
  - 三、短剧 SOP（重点看）
  - 具体内容请移步飞书链接。
- name: 素材分类管理复用体系
  desc: 将短剧素材按角色、冲突类型（婆媳、夫妻、家族矛盾）、看点、台词等维度建立结构化素材库，前期投入整理时间，后期实现每句台词对应素材可复用，大幅降低长期剪辑成本。
  is_original: true
  excerpt:
  - '评论区 肖一 : 你这样把剧集做分类管理，虽然初期花费时间长了点，但后期是每句台词对应的素材都是可复用的。'
  - '云珞 YunL : 是的'
- name: 快速试错 (MVP验证)
  desc: 针对新手怕沉没成本过高，提出的低成本验证方法：不求完美，先跑通‘选剧-剪一条-发-出单’最小闭环，用最小动作验证账号权重与选剧眼光，再决定是否深度投入建立素材库。
  is_original: true
  excerpt:
  - 四、如何快速试错（新手重点看）
  - '云珞 YunL : 如果新手怕沉没成本太高，可以看“四、如何快速试错（新手重点看）”，用这个方法快一些'
methods:
- name: __overview__
  desc: 生财有术方法论在短剧副业中的落地总框架：认知对齐（是什么/逻辑）-> 标准化执行（SOP）-> 低成本试错（MVP）-> 复盘迭代 -> 人岗匹配（适合谁）。
  excerpt:
  - 目录：一、短剧是什么 二、变现逻辑 三、短剧 SOP（重点看） 四、如何快速试错（新手重点看） 五、注意事项 六、短剧适合什么人做
- name: 短剧选剧避坑法
  desc: SOP 核心子模块，通过数据平台（如蝉妈妈、飞瓜）筛选近期热度上升、完播率高、充值转化好的剧集，避开版权纠纷剧、过度审美疲劳剧，提升首条视频出单概率。
  excerpt:
  - 三、短剧 SOP（重点看） -> 选剧避坑
- name: 去重剪辑组合拳
  desc: SOP 核心子模块，包含镜像翻转、调色、变速、抽帧、加贴纸/字幕/滤镜、混剪多素材、改MD5等技术手段，解决平台搬运判重问题，保证视频原创度通过审核获推荐。
  excerpt:
  - 三、短剧 SOP（重点看） -> 去重剪辑
- name: 新手三步快速试错法
  desc: 步骤1：开通推广权限（0成本）；步骤2：选1部近期爆款剧，剪3-5条不同看点视频发布；步骤3：观察3天数据（播放>500有推荐，有挂载点击出单即正反馈），决定是否深耕。
  excerpt:
  - 四、如何快速试错（新手重点看）
  - '云珞 YunL : 用这个方法快一些'
theorems:
- name: 副业红利期窗口期论
  desc: 短剧推广目前处于平台扶持、用户付费习惯养成、竞争相对温和的‘红利期’，普通人入场的时间成本最低，但窗口期有限，需抓紧执行。
  excerpt:
  - 适合对月收入要求不高，一个月副业一二千是可以的。
  - '评论区 书情小跟班 : 短剧还处于红利期，抓紧时间做'
- name: 执行力>技巧论
  desc: 短剧副业成功的关键不在于掌握多高深的剪辑技巧，而在于‘听话照做’执行标准化 SOP，新手按流程操作即可实现‘第二天出单’，核心门槛是行动力而非技术力。
  excerpt:
  - 适合新手，听话照做的人，发视频第二天出单。
  - '云珞 YunL : 一起加油'
- name: 沉没成本控制原则
  desc: 新手入场应优先控制沉没成本（时间/精力/金钱），通过‘快速试错’最小化验证成本，避免前期过度投入素材库建设导致放弃时损失过大。
  excerpt:
  - '云珞 YunL : 如果新手怕沉没成本太高，可以看“四、如何快速试错（新手重点看）”，用这个方法快一些'
findings:
- name: 新手首单周期验证
  desc: '[claim] 作者宣称遵循该 SOP 的新手可实现‘发视频第二天出单’。'
  excerpt:
  - 适合新手，听话照做的人，发视频第二天出单。
- name: 收入预期锚定
  desc: '[claim] 作者设定该副业的合理收入预期为‘一个月副业一二千’，定位为低门槛零花钱项目而非主业替代。'
  excerpt:
  - 适合对月收入要求不高，一个月副业一二千是可以的。
- name: 素材库投资回报率验证
  desc: '[evidence] 评论区实操者肖一确证：前期花费时间建立分类素材库，后期实现‘每句台词对应的素材都是可复用的’，验证了素材管理复用体系的长期降本增效价值。'
  excerpt:
  - '评论区 肖一 : 你这样把剧集做分类管理，虽然初期花费时间长了点，但后期是每句台词对应的素材都是可复用的。'
  - '云珞 YunL : 是的'
- name: 快速试错有效性社群反馈
  desc: '[evidence] 社群成员‘某人周’反馈‘快速试错的思路学到了’，侧面印证该降低新手心理门槛和行动成本的方法论受到目标用户认可。'
  excerpt:
  - '评论区 某人周 : 写的很详细，快速试错的思路学到了'
