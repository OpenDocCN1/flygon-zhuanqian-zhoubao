units:
- 'no': 1
  name: 脚手架工程化 —— 让项目初始化变成标准化流水线
  points:
  - '**为什么需要这个概念？**'
  - '- 团队内项目配置分散（ESLint、TS、CSS 方案不一），新人接手成本高、老项目升级难'
  - '- 重复造轮子浪费工时：每个新项目都要手动配置构建、测试、提交规范'
  - '- 缺乏治理手段：无法强制落地最佳实践、安全基线、依赖版本策略'
  - '**核心定义**'
  - '- 脚手架工程化 = 模版引擎 + Monorepo 多包管理 + 插件化扩展 + 自动化发布'
  - '- 核心产出：`create-my-app` 交互式 CLI，一键生成符合团队规范的标准化项目'
  - '**关键性质**'
  - '- **模版即代码**：基于 Yeoman/Plop，支持变量替换、条件渲染、子模版组合'
  - '- **Monorepo 原生支持**：基于 pnpm workspace，天然支持多包联动、版本锁定、依赖提升'
  - '- **插件化机制**：核心 CLI 精简，业务特有逻辑（如微前端接入、组件库选型）通过插件注入'
  - '- **版本升级策略**：提供 `upgrade` 命令，支持 Codemod 自动迁移破坏性变更'
  - '**典型例子**'
  - '- 执行 `pnpm create my-app my-project` → 交互选择 Vue/React、TS/JS、Pinia/Redux、Tailwind/UnoCSS
    → 自动安装依赖、初始化 Git、配置 Husky → 直接可开发'
  - '- 发布新版脚手架：`npm publish` + GitHub Actions 自动生成 Changelog、打 Tag、通知团队'
  - '**边界条件**'
  - '- 仅解决“创建”问题，不解决“运行时”架构问题（如运行时插件、热更新）'
  - '- 模版过度参数化会导致维护爆炸，需通过“约定优于配置”收敛变异点'
  - '- 老项目接入需人工 Codemod，无法完全自动化'
  sources:
  - paper: 20230418_045.md
    role: origin
  excerpts:
  - 实现 `create-my-app` 交互式生成器、基于 pnpm workspace 的 Monorepo 结构、脚手架插件机制支持业务定制、GitHub
    Actions 自动发布 npm。
- 'no': 2
  name: 组件物料平台 —— 让 UI 组件变成可检索、可度量、可复用的资产
  points:
  - '**为什么需要这个概念？**'
  - '- 组件分散在各项目、各仓库，找不到、不敢用、改不动（无文档、无测试、无版本）'
  - '- 重复造轮子率高：同一个 DatePicker、Table 封装了 N 套，质量参差不齐'
  - '- 无法量化复用价值：不知道哪个组件被广泛使用，哪个是僵尸代码'
  - '**核心定义**'
  - '- 组件物料平台 = 规范定义 + 文档自动生成 + 演示沙箱 + 版本发布治理 + 依赖分析图谱'
  - '- 核心产出：团队级组件库官网（如 Storybook/Histoire 部署）、NPM 私服发布流水线、组件复用率看板'
  - '**关键性质**'
  - '- **元数据规范化**：每个组件必须包含 `package.json` 扩展字段（displayName、category、props/types/events/slots
    结构化定义）'
  - '- **文档零成本**：集成 `vue-docgen-api`/`react-docgen` 从源码 AST 自动解析 Props/Events/Slots/JSdoc，生成
    Markdown/MDX 文档'
  - '- **沙箱即测试**：Storybook/Histoire 故事文件即可视化单测，支持交互回放、无障碍检查、视觉回归'
  - '- **依赖图谱可视化**：基于 `pnpm ls --graph` 或自研 AST 分析，产出组件依赖关系图，评估升级影响面'
  - '**典型例子**'
  - '- 新建 Button 组件 → 编写 `Button.stories.tsx` + JSDoc 注释 → 提交 PR → CI 自动生成文档页、发布 `@enterprise/ui@next`
    → 平台自动更新组件列表、依赖图、复用率统计'
  - '- 业务方搜索“带加载态的表单提交按钮” → 平台展示 Button 组件、Props 表单、在线调试沙箱、安装命令、迁移指南'
  - '**边界条件**'
  - '- 平台建设初期投入大（搭建文档站、CI 流水线、沙箱配置），需团队规模 > 10 人或组件数 > 20 个才划算'
  - '- 无法强制业务方使用，需配合架构治理（如 ESLint 规则禁用本地重复组件）'
  - '- 设计系统变更（如 Design Token 升级）需平台配套批量迁移工具'
  sources:
  - paper: 20230418_045.md
    role: origin
  excerpts:
  - 制定组件元数据规范、集成 `vue-docgen-api`/`react-docgen` 自动解析 Props/Events/Slots、Storybook/Histoire
    沙箱预览、依赖图谱可视化。
- 'no': 3
  name: 低代码搭建引擎 —— 让页面生成变成 Schema 驱动的工业化流程
  points:
  - '**为什么需要这个概念？**'
  - '- 运营活动页、后台表单页、大屏看板等“长尾页面”需求量大、迭代快、逻辑弱，纯手写 ROI 低'
  - '- 业务/产品/设计三方沟通链路长：设计稿 → 开发还原 → 联调改需求 → 发布，周期以周计'
  - '- 缺乏资产沉淀：页面上线后即丢弃，无法复用布局、区块、交互逻辑'
  - '**核心定义**'
  - '- 低代码引擎 = Schema 协议（JSON 描述页面） + 画布渲染器（解析 Schema 为真实 UI） + 属性面板（可视化配置） + 撤销重做（历史状态管理）
    + 代码生成（Schema → 高代码）'
  - '- 核心产出：可视化搭建平台、Schema 物料市场、一键发布/嵌入现有应用能力'
  - '**关键性质**'
  - '- **Schema 协议设计**：核心资产。定义 `ComponentNode`（组件类型、props、children、位置）、`PageSchema`（全局样式、数据源、生命周期）、`VersionSchema`（版本、发布记录）'
  - '- **渲染器插件化**：基于 Vue/React 实现 `Renderer` 接口，支持自定义组件注册、插槽渲染、条件渲染、循环渲染、事件绑定'
  - '- **状态历史管理**：引入 Memento 模式（如 MobX `RedoManager`），记录每次操作前的 Schema 快照，支持无限级撤销/重做、跳转历史版本'
  - '- **代码生成还原高代码**：基于 AST（Babel/TS Compiler API）将 Schema 转为 Vue/React 组件代码，支持“低代码起步、高代码接管”无缝演进'
  - '**典型例子**'
  - '- 运营同学拖拽“导航栏+轮播图+商品列表+弹窗” → 配置数据源 API、点击跳转链接 → 点击预览 → 一键发布生成线上链接 `lowcode.xxx.com/activity/618`'
  - '- 开发同学发现低代码性能不足 → 点击“导出代码” → 得到标准 Vue 组件代码 → 接入现有项目继续优化'
  - '**边界条件**'
  - '- 仅适合“结构固定、逻辑标准、高频变更”页面（营销页、表单页、报表页），复杂交互（如在线设计器、代码编辑器、游戏）不适用'
  - '- Schema 协议一旦发布，升级极其困难（涉及存量页面迁移），需极度谨慎设计版本兼容层'
  - '- “代码生成”产物通常不如手写代码优雅，需作为过渡方案而非终态'
  sources:
  - paper: 20230418_045.md
    role: origin
  excerpts:
  - 设计 JSON Schema 描述页面结构、基于 Vue/React 实现渲染器插件化、Mobox/RedoManager 状态历史、AST 代码生成还原高代码。
- 'no': 4
  name: 研发效能度量体系 —— 用北极星指标和 DORA 四大指标驱动工程决策
  points:
  - '**为什么需要这个概念？**'
  - '- “感觉效率低”无法说服管理层投入、无法定位瓶颈、无法验证改进措施有效性'
  - '- 只看代码行数/提交次数等虚荣指标，导致错误激励（如鼓励无意义提交、拒绝重构）'
  - '- 缺乏端到端视角：从需求提出到用户使用，哪个环节最慢、质量最差？'
  - '**核心定义**'
  - '- 研发效能度量体系 = 北极星指标（单一核心目标） + DORA 四大指标（过程健康度） + 工程效能看板（可视化诊断） + 洞察分析（根因定位）'
  - '- 核心产出：Grafana 可观测看板、周度/月度效能报告、改进实验追踪清单'
  - '**关键性质**'
  - '- **北极星指标**：如“有效发布频次”、“核心业务交付周期”、“生产环境 P0 故障数”，拒绝虚荣指标'
  - '- **DORA 四大指标**：部署频次、变更前置时间、变更失败率、平均恢复时间 —— 业界公认的软件交付绩效黄金标准'
  - '- **全链路数据采集**：Git 事件、CI/CD 耗时/成功率、Issue/PR 生命周期、代码评审时长、构建产物体积、线上错误率、用户反馈'
  - '- **洞察分析而非单纯展示**：自动识别“长周期 PR”、“高失败率流水线”、“高耦合模块”，给出改进建议'
  - '**典型例子**'
  - '- 看板显示：变更前置时间 P75 = 2.5 天 → 分析发现“代码评审等待”占 40% → 推行“小步提交 + 评审 SLA 4h” → 一个月后前置时间降至
    1.2 天'
  - '- 部署频次从周 1 次 → 日 3 次，变更失败率从 15% → 2%，MTTR 从 2h → 15min，团队信心显著提升'
  - '**边界条件**'
  - '- 指标本身不产生价值，只有“指标 → 洞察 → 行动 → 复盘”闭环跑通才有效'
  - '- 小团队（<5人）引入重型看板成本高，可用轻量脚本 + 周会复盘代替'
  - '- 需警惕“指标游戏化”：如为降低失败率拒绝发布、为缩短前置时间跳过测试'
  sources:
  - paper: 20230418_045.md
    role: origin
  excerpts:
  - 引入 DORA（部署频次、变更前置时间、变更失败率、恢复时间）、代码评审时长、构建耗时、缺陷逃逸率，搭建 Grafana 看板驱动改进。
- 'no': 5
  name: 前端效能平台 MVP —— 串联脚手架、组件、低代码、度量的闭环最小系统
  points:
  - '**为什么需要这个概念？**'
  - '- 脚手架、组件平台、低代码、度量看板各自为政，数据不通、流程断层，无法形成“以工具替人工、以平台促规范、以数据驱决策”合力'
  - '- 缺乏端到端验证：不知道脚手架生成的项目是否真的用上了组件库、是否跑通了 CI、线上表现如何'
  - '**核心定义**'
  - '- 前端效能平台 MVP = 脚手架创建入口 + 组件复用率统计插件 + 低代码产出页面占比上报 + 发布/故障看板 + 数据聚合分析层'
  - '- 核心产出：一个统一的前端效能仪表盘，覆盖“创建-开发-构建-发布-运行”全生命周期'
  - '**关键性质**'
  - '- **数据打通**：脚手架植入 `project-id`，CI 上报构建产物体积/耗时/测试覆盖率，运行时 SDK 上报 Web Vitals/错误率，关联同一
    `project-id`'
  - '- **组件复用率统计**：构建时扫描 `import` 语句，识别 `@enterprise/ui` 组件用量，对比本地重复组件数量，计算复用率 = 平台组件用量
    / (平台组件用量 + 本地组件用量)'
  - '- **低代码产出占比**：发布时上报页面来源（低代码/手写），统计低代码页面 PV/UV 占比、迭代频次、缺陷率'
  - '- **闭环驱动**：看板发现“某项目组件复用率 < 30%” → 触发架构组介入 → 发现组件库缺少特定业务组件 → 立项补充 → 复用率回升'
  - '**典型例子**'
  - '- 新人入职 Day 1：跑 `create-my-app` → 自动接入监控 SDK、组件库、CI 流水线 → 首个 PR 合并 → 看板自动出现该项目指标'
  - '- 季度复盘：平台数据显示低代码页面占比 40%，人均交付效率提升 2.3x，P0 故障归因 80% 来自手写页面 → 决定下季度重点推广低代码改造存量表单页'
  - '**边界条件**'
  - '- MVP 范围要极度收敛：先跑通“一个项目从创建到看板有数”的最小链路，再逐步扩展'
  - '- 数据上报需极度轻量、非阻塞、可关闭，避免影响开发体验和生产性能'
  - '- 平台本身也是产品，需建立平台团队、用户反馈渠道、版本迭代节奏，防止烂尾'
  sources:
  - paper: 20230418_045.md
    role: origin
  excerpts:
  - 串联脚手架创建 → 组件复用率统计 → 低代码产出页面占比 → 发布频次/故障率看板，形成闭环数据驱动工程效能提升。
