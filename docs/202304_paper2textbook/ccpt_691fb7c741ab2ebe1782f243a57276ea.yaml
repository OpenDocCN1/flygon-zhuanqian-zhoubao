paper: docs/202304/20230418_110.md
desc: 该素材为一次线下小聚复盘分享的索引页，核心主张是面对变化的项目与红利，个人应聚焦于构建“不变”的核心竞争力，以实现跨项目迁移、穿越周期及抗风险能力。素材包含作者背景、核心观点陈述及往期高赞案例链接（超级用户运营、小红书私域引流），但未展开具体方法论与案例细节。
concepts:
- name: 个人核心竞争力
  desc: 指个体在变化的环境中保持不变、可迁移、可复用、能穿越周期并抵御风险的核心能力体系，是应对外部不确定性的锚点。
  is_original: false
  excerpt:
  - 项目、红利等都是不断变化的，我们要更好地赚钱，要去重点关注不变的（比如核心竞争力就是不变的中很重要的点）
  - 有核心竞争力后，可以迁移换项目、可以在一定程度上穿越周期、可以在大环境不好时有自己的小天地
- name: 超级用户付费价值挖掘
  desc: 通过运营手段识别并深度开发高价值用户，实现留存与产品体验双提升的运营策略，属于作者过往实践的核心概念。
  is_original: true
  excerpt:
  - 《如何通过运营挖掘超级用户付费价值，实现用户留存并提升产品体验？》
- name: 小红书低粉高转私域模型
  desc: 在粉丝基数极小（391）的情况下，通过内容引流私域实现高转化（引流432人，成交308单）的轻量级获客模型。
  is_original: true
  excerpt:
  - 《才 391 个小红书粉丝，但引流私域 432 人成交 308 单的复盘》
methods:
- name: __overview__
  desc: 以不变应万变的战略思维框架：识别环境中的变量（项目、红利）与不变量（核心竞争力），战略聚焦不变量建设，战术上通过复盘过往成功案例（超级用户运营、私域引流）提炼可迁移能力。
  excerpt:
  - 定这个主题背后的思考：项目、红利等都是不断变化的，我们要更好地赚钱，要去重点关注不变的...这样才能以不变应万变。
theorems:
- name: 核心竞争力穿越周期定律
  desc: 构建个人核心竞争力是应对外部环境高变动性的最优解，它赋予个体三大能力：跨项目迁移能力、穿越经济周期能力、逆环境生存空间构建能力。
  excerpt:
  - 有核心竞争力后，可以迁移换项目、可以在一定程度上穿越周期、可以在大环境不好时有自己的小天地。
findings:
- name: 过往实战案例有效性佐证
  desc: '[claim] 作者宣称其过往两篇高赞文章分别验证了“超级用户运营”和“小红书低粉高转私域”两条路径的有效性，且获得社群认可（51赞、评论区好评）。'
  excerpt:
  - （51 赞）《线下小聚复盘：赚钱的个人核心竞争力》
  - '评论区：大麦-手机自动赚钱 : 很赞，组局 sop... 美妙人生 : 流程里有一些小细节都是比较用心的'
