  (58 赞)《复盘：如何发掘资源差并变现》   作者： Knight   日期：2023-04-03   大家好，我是 Knight，94 年的内蒙人，从 2016
  年开始扎根家电圈子，先后供职于美的集团总部、网易集团，2020 年从大厂离职，跟我现在的合伙人先后在广州、北京和河北开了三家公司，年流水 2-3 亿。   我从第六期开始加入生财有术，潜水一年把各位大佬的精华帖翻看了一遍，发现了很多其他行业的掘金点，同时也感叹于大家的高效执行力和卓越想象力。   相比之下，我所从事的主业（国内电商-京东平台-大家电品类）就显得乏善可陈，一是利润薄，作为代理商分销商的毛利点位经常不过
  15%左右，而随着平台流量见底流量成本攀高，项目的毛利被不断挤压，稍有不慎就会连项目人员成本都包不住；二是投资回报率不高，动辄几百万上千万的'
docs/202304/20230418_084.md: '# 《关于公益送书引流养群的思考》  > 原文：[`www.yuque.com/for_lazy/thfiu8/xaye7dzfgqftzgkx`](https://www.yuque.com/for_lazy/thfiu8/xaye7dzfgqftzgkx)    ##
  (47 赞)《关于公益送书引流养群的思考》   作者： momo   日期：2023-04-03   关于公益送书引流养群的思考   以公益送书的方式引流、养私域，大概半年多以前我就看见过，但是由于市场上来源渠道比较混杂，没做尝试，因为如果送书渠道本身不靠谱，虽然能引一些流，但是后续的售后也是让人崩溃的。   这次朋友给对接的渠道相对正规，且是个收费渠道，因此临时决定尝试一下。先说下我这次的结果，活动前预热
  1 天，送书活动 3 天，动用了 2 个平时并不活跃的社群（1 个 150 人的本地宝妈群，1 个 200 人的不限地区粉丝群），送出 147 套书，引流了 43
  人（加好友且进群）。   初次尝试后，有了如下思考，如果你也打算对接这种方式来引流养私域，我想应该会有一些启发 （文末赠送本次我做送书活动的 SOP）'
