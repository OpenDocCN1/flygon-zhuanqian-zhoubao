  (精华帖)(268 赞)《简单但能转运和改写人生的秘籍》   作者： 戴懿菡 Amy   日期：2023-04-04   我在生财见面会向内求小局的分享，聊得很爽。虽然简单和稚嫩，但没想到见面会结束后，还是陆续收到圈友私信，说对他们有些启发和鼓舞。整理一下发进星球，希望有缘刷到这个帖子的圈友，尤其是在低谷迷茫期的圈友，会喜欢这份礼物。   #
  【第一部分：攻略】   开篇直给，简单到人人都能做，但是能转运，能把你从持续的低谷状态拉出来的事，很简单，就是——   主动做你以前绝对不会做的事   比如：   以前周末你很宅，那从这个周末开始出去玩玩逛逛   以前你舍不得休息，总是焦虑刷手机，那就给自己专门安排一项高质量休息的
  to do list   以前总是网购便宜的衣服，那就去品牌实体店试穿后购买全身搭配   点一'
