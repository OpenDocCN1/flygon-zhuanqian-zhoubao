  (144 赞)《你在生财为什么赚不到钱？》   作者： 李鲆   日期：2023-04-05   你在生财为什么赚不到钱？   1、赚钱是一个人所有能力、努力和运气的总和。不够努力，赚不到钱。   2、赚钱是个脑力活，也是个体力活，但归根结底是个苦力活。轻松赚大钱这种需求，只有骗子才能满足。   3、中等智商，正确方法，长期坚持，几乎可以做好任何事，当然也包括在生财赚到钱。但是坚持最难。   4、赚钱是加速度的，指数级增长的。开始慢、少很正常，坚持一段时间，才会快、多。但是坚持最难。   5、做好一件事的最小周期是三个月。但是大部分人无法在没有及时奖励的情况下坚持三周——甚至坚持不了三天。   6、冲动消费，进了生财，刚花完钱就觉得自己被割了韭菜。不用想了，你肯定赚不到钱。   7、想的太多，不去行动，赚不到钱。在你开'
