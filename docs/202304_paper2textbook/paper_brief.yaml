  (88 赞)《通过沟通一些小故事去感知这个圈子的意义》   作者： 大树🌳🌳   日期：2023-04-13   通过沟通一些小故事去感知这个圈子的意义。   不允许发一些“旁门左道”的赚钱方法（三观要正）有人通过这个社群学习到了一些技能，现在已经在月收入过万。（这是对术的感知）有人在这个圈子里找到了合伙人（资源链接）有人通过一些案例少踩了坑（信息及时）分享嘉宾的故事（真诚的分享）等等。都是通过沟通聊天所获得的信息。   包括生财有术的背景图为什么是一个卡通的图片，因为亦仁不希望这个圈子充满“铜臭味”这些都是关键信息，这些故事说出来，也就是想要传达出去的信息，是做标志的推理依据，是标志要承载的信息。设计即沟通，标志不仅仅是一个符号，更是一种提炼和精简的过程，把最核心的东西通过符号视觉化，并且传达出去。  '
