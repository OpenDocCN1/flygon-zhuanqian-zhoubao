docs/202304/FqNZdGrjgopNjzxPbdEcltd2n0e.md: '# 全方位拆解一个互联网医馆项目  > 来源：[https://viuejh8h99y.feishu.cn/docx/FqNZdGrjgopNjzxPbdEcltd2n0e](https://viuejh8h99y.feishu.cn/docx/FqNZdGrjgopNjzxPbdEcltd2n0e)  #
  前言  生财圈中大佬云集，可以说目前国内外比较主流的项目，在生财圈都能够看得到。分享今天的这篇文章，或多或少都有一些感慨，大概归结为3点：  1、我们无论是找项目还是做项目，一定要做自己擅长的事情；  2、这个时代无非是赚两种钱，一种是“资源差”的钱，一种是“信息差”的钱；  3、无论做什么项目，都一定要有规划，并且要明确设定每个环节的时间节点。  #
  一、 概述  ## 1\. 项目来源  大鹏和团队成员都是90后的创业者，互联网、实体项目都涉猎过，有赚过钱，也有亏过钱。但是说实话，摆在90后创业者面前一个非常严峻而尖锐的问题，就是我们普遍并不具备很强的社会性资源。  何为社会性资源呢？比如小孩上个学，老人看个病，也就是诸如医疗、教育这些社会性问题，我们其实都不算说特别有强大的资'
