docs/202304/EkZTdONM7oPzFvxbfbtcuQ2Unwd.md: '# 在闲鱼随手卖了10W+自己的旧衣，有几点经验总结  > 来源：[https://y2w73sabxw.feishu.cn/docx/EkZTdONM7oPzFvxbfbtcuQ2Unwd](https://y2w73sabxw.feishu.cn/docx/EkZTdONM7oPzFvxbfbtcuQ2Unwd)  大家好，我是阿黛。刚刚加入生财的萌新。  比起大佬们动辄百万级千万级的资金体量，我的项目弱的不值一提。  但因为发现有很多比我还互联网小白的伙伴，  没有什么储备，从未下过场，非常迷茫，  所以就拿出我的这些例子，看能不能给到一些借鉴和参考。  以前一直做的实体生意，有过黄金时代，行业没落之后转型非常吃力，  卖家乡特产腊肉算是一个路径，分享被加了精华，也得到很多朋友的鼓励，  在这个过程中我其实还学会了重要的一点：  人啊，得有随手赚小钱的能力，能赚的钱都去赚一下试试，  万一中间有机会赚到大钱呢？  做职业经理人的时候销售额以亿计，本来跟我毫无关系，  但人在某种光环下容易迷失，  后来我花了很长时间来适应年薪百万和卖一斤腊肉只赚几块钱的落差，  也逐渐养成了随手赚'
