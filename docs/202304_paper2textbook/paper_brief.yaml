  (97 赞)《永远有人能比你做得更好》   作者： 小马宋   日期：2023-04-04   创业 46 条之 10：永远有人能比你做得更好   我遇到的创业者，有相当一部分在介绍自己的公司时，会使用“业内顶尖”这个词。但我看到他们产品的时候，说实话，也就是比大路货稍微好一点点而已。这种对这家产品的迷之自信，会让很多创业者陶醉在自我感动中。   当然我说的好，并不仅仅指的是产品本身，还有价格，设计，体验等等。如果你做出一个和麦当劳一样好吃的汉堡，但是比它便宜三分之一，那这个就是比麦当劳好。   反过来说，有些人觉得传统的产品有很大问题，比如方便面，垃圾。但自己做出一个更好吃的方便面，确实很好吃，只是太贵了，也没啥可骄傲的。   还有公司的经营。有人经常会说，我们已经做得很好了，但我想说的是，总有人比你做得更好。我遇到过'
