docs/202304/AgWGdAk0fogwx2xtpo2cg3TCncb.md: '# 最强“听话照做打工人”——如何用GPT无脑复制抖音热门口播视频  >
  来源：[https://fjt9w880tn.feishu.cn/docx/AgWGdAk0fogwx2xtpo2cg3TCncb](https://fjt9w880tn.feishu.cn/docx/AgWGdAk0fogwx2xtpo2cg3TCncb)  大家好，我是小凡。在AI时代，让我们成为第一波富起来的人。这篇文章送给生财新到的小伙伴，也给大家分享我在GPT领域最新的研究成果。  PS:这篇是我本人写的，不是GPT。  #
  GPT是搞副业的必备工具  为什么这么说？因为其实生财的项目库里已经有足够多的项目了，而且有非常多的低门槛项目。很多人在生财呆了快两年，为什么还没有赚到钱？我认为是一句生财里经常出现的话：“听话，照做。”我们没有做到位。  不是项目不赚钱，而是我们在执行上面出现了问题。  可能是我们认真地做了几条短视频发现没爆就没有坚持，也有可能其实是因为这些充满了大量干货的航海手册我们压根就没有理解到位。  “听话，照做”这个道理，我们并没有做到知行合一。  但是，现在不一样了，GPT出现了。这'
docs/202304/AiCrd19EAoPvvPx0HSJczxk3nfC.md: '# 《赚30万的项目和赚300万的项目有什么区别？》@亦仁  > 来源：[https://shengcaiyoushu01.feishu.cn/docx/AiCrd19EAoPvvPx0HSJczxk3nfC](https://shengcaiyoushu01.feishu.cn/docx/AiCrd19EAoPvvPx0HSJczxk3nfC)  今天有个朋友问我，赚30万的项目和赚300万的项目有什么区别？  我说，没区别，都是一样的项目。  你赚30万，你以为只有你一个人做到，实际上，在你看不见的地方，大概率有十个、上百个和你差不多的人，他们也赚了30万。  如果你的复制能力足够强，那些人就应该都是你的分身，是你的矩阵，那这就是一个300万的项目了。  你开一个视频号赚1万块，一百个视频号就是100万块。  这是矩阵思维。  星球里面有时候有宝妈圈友分享，一个月通过某项目赚几千块，很多人看不上，觉得是小钱，这些人是真的傻，换个思路想想，如果基础一般的宝妈圈友能一个月赚几千块，意味着什么？意味着这个项目门槛不高，可复制性极强，这才是个大项目，好机会，才有几十倍、上百倍、上千倍的空间'
