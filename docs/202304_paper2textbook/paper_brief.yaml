docs/202304/Ro5mdEccUoXd4oxSbzYcZXCrnfh.md: '# 公益送书sop流程  > 来源：[https://kwj3fkh7ymf.feishu.cn/docx/Ro5mdEccUoXd4oxSbzYcZXCrnfh](https://kwj3fkh7ymf.feishu.cn/docx/Ro5mdEccUoXd4oxSbzYcZXCrnfh)  ##
  一、预热阶段（活动前2~3天）  ### 1、发布书单公号文  一般送书的渠道都会提前给本期书单，我们需要整合到自己可以对外发布的图文渠道里，比如公众号、美篇、简书之类都可以，书单文章里需要有每套书的图文介绍，目的是方便提前种草，转发起来也方便。  参考文章https://mp.weixin.qq.com/s/mEtHunakGuyP3hMb3aedZA  ###
  2、制作公益送书海报  海报是比较好的传播方式，后期在发朋友圈时有大用处，需要提前准备。海报的制作可以在稿定设计上直接找和书籍相关的模板，在海报上需要有以下几个重点信息：  ①公益送书的字样  ②本期活动时间段  ③引流的个人微信二维码，或群二维码  ④为了降低解释成本，我在海报上写明了书籍免费领，邮费15元/套，需自理  参考'
docs/202304/SFqBdG2bpoLKf8xeOWMcUNxVn4d.md: '# 我是如何靠生财对接优质资源 成功变现日入上千的案例分享  > 来源：[https://yiwib3v8sju.feishu.cn/docx/SFqBdG2bpoLKf8xeOWMcUNxVn4d](https://yiwib3v8sju.feishu.cn/docx/SFqBdG2bpoLKf8xeOWMcUNxVn4d)  #
  1前因  众所周知，生财这个圈子里聚集了大量和我一样对【金钱】有着浓烈渴望的人，刚开始我还没有太多的感受，也没有着急写帖子，在【黄小刀】刀姐的交付群里也处于摆烂状态，我们群里个个都是卷王，刚入生才两三天，就有群友（阿黛等人）写帖子，被加了精华。我开始嫉妒了（嫉妒让我面目全非）我也开始冲了
  于是就写了之前内篇帖子（可以在我主页看到）帖子获得了【120➕点赞】（包括【亦仁】）和很多大佬的鼓励。很多人是通过你的帖子了解了我的过往，知道了我目前在从事的业务，成功的链接到了我。  #
  2一篇帖子引起了无数链接  大家通过内篇【00后女大学生写作变现月入三万】的帖子 发现了我的【优势】疯狂的找我要微信 想和我链接起来 短短一天时间成功的链接到了50+圈友
  来自各行各业'
