  (47 赞)《私域的意义不是管理，而是经营》   作者： 心理諮詢師 - 根源   日期：2023-04-10   私域的意义不是管理，而是经营   1.公域的意义是管理   这个时代是一个有过打造个人
  ip，以及曾经有过自己的线上课，运营过群的人的时代。因为不管大公司还是小店都需要有私域   但我发现多数人把私域看的太难，也把私域看的太重。这个重的意思，就是一个群的人要很多。   虽然微信群的限制能塞满五百人，但是一个五百人的群以及五个一百人的群，意义完全不同。五个一百人的群跟十个五十人的群，意义又更不一样。   一个群五百人，管理者就会有种想法：“人太多了，我就随便发发吧，反正这么多人，也不是人人都看我的讯息。”   群里面的人更会想：“反正人这么多，我说话也没人看。”   这种群一般大家都不在意，就是个随便拉'
