  (60 赞)《初创团队成功的关键——找到合适的合伙人》   作者： 宋宋改名叫宋大范儿   日期：2023-04-13   在 2023 年生财有术全国见面会期间，有个创业的男孩子来找我咨询，说目前团队的小伙伴工作产出不好、不爱沟通、隐隐摆烂的姿态，导致公司营业额很高，但是一年到头一算账，基本不赚钱，问我这是不是团队出了问题？是人选错了吗？要怎么解决目前的问题呢？   如果是员工本身的问题的话，团队里面有的小伙伴是从别的项目跟着他来的，以前都很有干劲，也有成绩，现在怎么就变了呢？   还有一些小伙伴是他亲自招聘来的，来的时候都是很有激情很有干劲的人，怎么现在眼里的光就消失了呢？   其实，如果初创团队的成员出现了问题，不一定是团队本身的问题，可能存在三种情况：   1、团队其实是没有问题的，是产品逻辑本身'
docs/202304/20230418_005.md: '# 《从一位艺术老师的观点中得到的启发》  > 原文：[`www.yuque.com/for_lazy/thfiu8/figz3kluop0chnb1`](https://www.yuque.com/for_lazy/thfiu8/figz3kluop0chnb1)    ##
  (精华帖)(389 赞)《从一位艺术老师的观点中得到的启发》   作者： 小马宋   日期：2023-04-10   清明节带孩子去拜访了一位艺术老师，跟他聊了五个小时，他有很前瞻和宽广的视野，许多观点很有启发，今天分享给大家。
  1、 做艺术分两种，一种把作品卖给有钱人，有钱人买这个主要是为了彰显和别人的不同，这是大部分想成为知名艺术家的人的路径；一种是把作品卖给大众，比如漫画，商业设计等等，其实这种的成功概率更高，另一种的山头太小，容不下很多人。
  2、 做艺术首先要学哲学、逻辑、语言学、传播学、政治学、符号学、心理学这些学问，你才能从底层理解艺术为什么会被大众接受？比如颜真卿的书法，其实很规矩，但为什么被尊重？因为儒家思想是当时的主导思想，儒家不喜欢张狂，儒家需要的尊卑秩序。
  3、 跟他学习的所有小孩，必看的'
docs/202304/20230418_006.md: '# 《商业世界的真相》  > 原文：[`www.yuque.com/for_lazy/thfiu8/nmr71hmy0iyv5b1a`](https://www.yuque.com/for_lazy/thfiu8/nmr71hmy0iyv5b1a)    ##
  (157 赞)《商业世界的真相》   作者： 小马宋   日期：2023-04-11   创业 46 条之 11：商业世界的真相 正常的商业案例，从来不会讲企业遇到的黑色和灰色的问题，但这又是正常世界的一部分，不管国内还是国外。过去有许多有志青年，或者大厂的精英出来创业，一下子看到了商业世界脏的一部分，有些受不了。
  其实，你在大厂，只不过大厂帮你把一些事情摆平了，你只要发挥你的业务和技术能力就好了。但创业不是，所有的事都需要你摆平。 创业中，就会遇到敲诈，流氓无赖，同行挤兑各种问题。还有小人陷害，还有甲方的索贿，还有同行的举报、差评，媒体的要挟勒索，合伙人的反目等等。这才是正常的世界，不是那个被学校、被家长、被公司保护起来的那个世界。我们要学会面对和处理这些问题，但是要有底线，因为做多了，总有失手的时候。
  干干净净的经营，其实也'
