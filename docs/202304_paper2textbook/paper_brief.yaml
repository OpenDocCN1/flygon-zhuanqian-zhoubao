docs/202304/YE1FdsTuxoaBbNx4f5dcnSNenxb.md: '# chatgpt plus 最新保姆级开通教程  > 来源：[https://be2m999k9z.feishu.cn/docx/YE1FdsTuxoaBbNx4f5dcnSNenxb](https://be2m999k9z.feishu.cn/docx/YE1FdsTuxoaBbNx4f5dcnSNenxb)  从夜里10点半到凌晨1点，花了两个半小时一次成功开通chatgpt，共充值248.05元，最后还剩12.4美金，总花费163元左右，预计之后再续费充值的话大概每次成本花费应该在144到152人民币之间，上下浮动1美金左右。  接下来说一说，我这两个半小时充值plus的各种详细操作以及遇到的问题，和怎么解决的方法。  #
  开通说明：  最近因为depay平台的系统维护，进行不了KYC认证，所以我一直没办法通过注册depay 开通虚拟信用卡进行充值，于是就选择了nobepay平台进行开卡。  这两个平台相比，  nobepay的成本是【开卡费1U+充值3%手续费+0月费】  depay的成本是【开卡费0U+充值1.35%手续费+1U月费】  如果每个月只是用来开通chatgpt'
docs/202304/Yjt0dfSN8ob6Xgxl9z6ct7Kfnqf.md: '# 第七期还没开始，我已经通过白嫖生财赚到第一张门票了  > 来源：[https://gq2psr73l6v.feishu.cn/docx/Yjt0dfSN8ob6Xgxl9z6ct7Kfnqf](https://gq2psr73l6v.feishu.cn/docx/Yjt0dfSN8ob6Xgxl9z6ct7Kfnqf)  #
  一、【自我介绍】  生财有术的圈友大家好，简单先介绍一下个人情况。我是Ray，第七期新人。目前是在广州的一家电商代运营公司工作，15-17年大学期间遇上微信公众号风口，纯自然流做到了几万公众号粉，可惜认知不行没赚到钱。另外碰上了目前还一直在合作的副业外包公司，每个月能拿到小几千，日子非常平淡。  但是这两年我明显感觉到老老实实，兢兢业业打工的生活并不能满足我，一个月拿那八千块，一年也就十万不到，还没扣除衣食住行，房租月供。再这样下去可能一辈子就这样一事无成，领一份薪水混吃等死，尤其是每天挤在三号线的人潮中更是让我厌恶这样麻木，毫无目的的生活。  ![](img/208711726ced3733a629fbe7708465ef.png)  所以去年我一直在想是不'
docs/202304/doxcnk4mqgBMJTv0mklq0eR48fg.md: '# 看了100+精华帖后，我梳理了一套赚钱的知识体系（超全新人指南！）  >
  来源：[https://mkfwp3u79v.feishu.cn/docx/doxcnk4mqgBMJTv0mklq0eR48fg](https://mkfwp3u79v.feishu.cn/docx/doxcnk4mqgBMJTv0mklq0eR48fg)  自我介绍：  我是七小，99年的深圳靓仔，知识管理专家。  精通搜索、采集、内容整理、关键词挖掘，擅长把碎片化信息整合成体系化的知识产品来变现。  江湖人称生财课代表，专业解决生财新人圈友的各种问题，致力于帮助圈友发挥好生财有术的价值。  微信：rickea150，添加请备注：生财圈友
  。欢迎交流。  公众号：七小的人生游戏攻略  ![](img/542476c9ace23332574494b1aa1451b3.png)  * * *  # 一、前言  各位生财圈友好呀，我是七小。  作为刚加入星球不到一个月的新人，第一次露面，按照社群的惯例，我先来和大家做个自我介绍吧~（有一丢丢长，请耐心看，和后面要讲的正文内容相关）  *
  * *  我是七小，99'
