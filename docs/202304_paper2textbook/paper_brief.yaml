  (159 赞)《群买买生死启示录》   作者： 老胡   日期：2023-04-13   群买买生死启示录   好久没来生财分享了，今天下午写了一篇总结，希望能给做社交电商的创业者和参与者们一些参考。   4
  月 4 号那天群买买公众号发布了一则公告，具体内容就是逐步停止群买买相关的运营服务，到这个阶段就算正式官宣这个项目寿终正寝了。   实际上从 3 月 22 号开始起，拼多多要把这个项目关闭的消息已经开始在小圈子里在传播了，只不过群买买官方没有正式跟我说这个事情，所以我也就没对外说起。   在这期间所有来问我的团队长和朋友们，我都统一回复“等待官方通知，具体情况我不知道”。
  一直到 3 月 26 号那天上午，群买买官方运营人员来到杭州，跟我当面说了这个项目即将关停的事情。实话说我个人感觉到并不意外，只不过对于旗下的团队长们'
docs/202304/20230418_010.md: '# 《包工头的真实生活》  > 原文：[`www.yuque.com/for_lazy/thfiu8/yk1qbsvx7gbqrdgo`](https://www.yuque.com/for_lazy/thfiu8/yk1qbsvx7gbqrdgo)    ##
  (167 赞)《包工头的真实生活》   作者： 小马宋   日期：2023-04-14   包工头的真实生活 这几天回山东老家有事，跟我表弟聊了聊他的生意。他原来跟人合伙制作焊接挖沙船，赚了几年钱，后来生意不好又赔进去了。
  我们黄楼镇是花卉绿植之乡，这几年他转行做绿植工程外包，简单来说就是所谓的包工头。他自己去接外包项目，然后在各个村里拉人头去栽植花卉。 业务主要在山东各地，远一点会到河北等周边省份。
  在外面种植一株绿化花卉 1 毛几分钱左右，他的工人工费是 7 分一棵，他中间赚一点差价。不过，他工钱是现付，工程款是后结，或者先付一半，总之有欠款，这是一个风险。
  他还要负担工人的住宿吃饭来回路费，为了省钱，他要自己给工人做饭，早上四五点钟就要起来在工地做饭。如果是近处的项目，他每早就要早起开车拉工人去工地，四点就要出发。
  为了'
