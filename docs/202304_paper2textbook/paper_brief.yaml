  (286 赞)《经济形势没有想象中那么好》   作者： 小马宋   日期：2023-04-03   经济形势没有想象中那么好。 今年刚刚过去 100 天，我大概有
  60 天在各地出差。这几天在广东一些地区观察，也看到今年的一些地方经济情况，其实并不乐观。我遇到的一个老板，自己有七八个工厂，生产范围包括化工、电子元器件、汽车零件等等，开工率非常不足，往年一个厂有
  1500 工人，今年只有七八百人上班。而且，疫情前招工不好找，旺季时大家都抢工人，今年明显招工好招了。 再说深圳的房价，我知道有些人在前海买了 19 万一平的房子，但是今年这些房子的价格就只有
  10 万左右了，而且还很难卖出去，成交不行。 不过我在广东某小城市的房地产交易大厅，跟交易员聊了聊，她说普通房子成交要比去年多了很多，我看了看他们的办事号码，预计这一个交'
