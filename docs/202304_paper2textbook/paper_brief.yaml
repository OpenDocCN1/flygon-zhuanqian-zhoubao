  19:07  生财圈友，大家好呀！  我是港妈金侣，2008年德国哥廷根大学硕士毕业，一直在外资公司老老实实工作。2020年9月因为孩子要在香港上小学，从宁波搬到香港成为全职妈妈。  不知当时脑子出了什么问题，竟然远程在香港租了一个月三万多房租的“千万豪宅”。一次性付了一年的房租后，也用完了我和老公的一半存款。  来到香港，没工作，成为全职妈妈；我先生也因为疫情，收入大大减少。经济问题是我家当时最大的矛盾。很多人说，钱不是万能的，可是我家当时的情况，因为没有钱，要散了。  2020年下半年，我非常想要赚钱,
  一边尝试给各大香港公司投简历找工作，都石沉大海，快40岁的女'
docs/202304/VQuGd5TikoAEaAxqMSJc4gslnye.md: '# 飞书能帮助MCN行业解决什么业务上的问题？  > 来源：[https://d24gxr9obe.feishu.cn/docx/VQuGd5TikoAEaAxqMSJc4gslnye](https://d24gxr9obe.feishu.cn/docx/VQuGd5TikoAEaAxqMSJc4gslnye)  #
  MCN行业背景  ## 什么是MCN  ![](img/14b560af351d4259ffa95f7f73652b32.png)  MCN（Multi-Channel
  Network）是一种多频道网络的产品形态，将PGC内容联合起来，在资本的有力支持下，保障内容的持续输出，从而最终实现商业的稳定变现。随着直播、短视频、电商等网红经济产业渠道不断扩展，国内的MCN机构在各大平台的助力下迅速扩张版图，并衍生出了头部IP型MCN、电商型MCN等不同类型的MCN机构。  MCN行业的业务内容可以总结为三大板块  *   短视频制作  *   渠道投放  *   直播电商  *
  * *  ## 行业产业链  （摘自华经产业研究院）MCN是整个产业链的中流砥柱。MCN处于整个产业的'
