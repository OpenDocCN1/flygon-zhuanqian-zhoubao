  (64 赞)《无论线上还是线下生意，成功都要讲个天时地利人和》   作者： 阿黛   日期：2023-04-12   线下实体   大家都在分享成功经验，那么由我来聊聊失败。
  妈呀感觉这个我可以写一个系列怎么回事[尴尬][流泪] 我是不是生财的泥石流呀， 貌似绝大多数人都做的线上， 我们这样的线下寥寥无几。 严格来讲，我这个还应该算是线上延伸出来的线下。   失败的这个项目是今年春天我发起的荒野餐桌，
