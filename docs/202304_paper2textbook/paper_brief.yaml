docs/202304/NlqtdIqRboDI0nx8PeccsB8gneh.md: '# 我用生财教我的方法做短剧  > 来源：[https://yf4niapxuw.feishu.cn/docx/NlqtdIqRboDI0nx8PeccsB8gneh](https://yf4niapxuw.feishu.cn/docx/NlqtdIqRboDI0nx8PeccsB8gneh)  最近在尝试做短剧，第一天晚上发视频，没想到第二天早上就出单了，这个正反馈来的也太快了，  所以，我感觉短剧很适合新手小白入场，比我之前做的小说推文见效快多了，  我做短剧之所以能成功，也离不开我在生财里学习到的方法。  正所谓饮水思源，我想在这毫无保留的分享我做短剧的经验。  ![](img/af5db18ee1047fdd8fed4790bac02aaf.png)  #
  一、短剧是什么  类似小说影视化。和电视剧电影差不多。区别在于，拍短剧的导演不是名导，主演不是家喻户晓的大明星。投资没有那么大手笔。说不定以后短剧的主演可能成为大明星。  换言之，有专门的团队买了小说和剧本版权，把他们拍成视频，每集1—2分钟，一部剧一般1—2小时。  然后，团队会把这些短剧版权派给各大平台分销，以此利益最大'
