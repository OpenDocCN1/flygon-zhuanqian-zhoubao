- 'no': 4
  name: 递归与尾递归类型 —— 在类型系统中实现复杂数据结构变换
  points:
  - '**为什么需要这个概念？**'
  - '- 类型系统没有 `for`/`while` 循环，处理任意深度嵌套结构（如深度 `Readonly`、数组扁平化、对象路径提取 `Path<T>`）必须用递归'
  - '- 普通递归受限于类型实例化深度（默认 50 层），处理深层结构（如 100 层嵌套对象、长元组）会报错'
  - '- 尾递归优化（通过累加器模式）可将递归深度压缩至对数级，突破深度限制'
  - '**核心定义**'
  - '- **类型递归**：类型别名直接或间接引用自身，配合条件类型终止判断，模拟循环'
  - '- **元组递归载体**：利用元组长度递减 `[any, ...Rest]` 或递增 `[...Acc, any]` 作为递归计数器/状态载体，规避类型别名直接递归的深度限制'
  - '- **尾递归模式**：将中间结果累积在元组参数中，递归调用作为最后一步操作（TypeScript 编译器对元组长度变化的递归有特殊优化，可支持上千层）'
  - '**关键性质**'
  - '- **终止条件必须显式**：通常通过 `T extends []` 或 `T extends ''''` 等基线情况返回累加器结果'
  - '- **元组展开 `...` 是核心操作**：`infer Rest` 获取尾部、`[...Acc, Next]` 追加元素、`Tuple[number]`
    取联合'
  - '- **深度 `Readonly` 实现**：`type DeepReadonly<T> = T extends object ? { readonly
    [K in keyof T]: DeepReadonly<T[K]> } : T`（对象递归）'
  - '**典型例子**'
  - '- **`Flatten<T>` 数组扁平化**：`type Flatten<T> = T extends [infer First, ...infer
    Rest] ? First extends any[] ? [...Flatten<First>, ...Flatten<Rest>] : [First,
    ...Flatten<Rest>] : []`'
  - '- **`Path<T>` 对象路径提取**：递归遍历对象键，拼接字符串路径 `''a.b.c''`，利用模板字面量类型与 `keyof` 结合'
  - '- **尾递归版 `Repeat<Str, N>`**：`type Repeat<Str, N, Acc extends string[] = []> =
    Acc[''length''] extends N ? Acc : Repeat<Str, N, [...Acc, Str]>`（累加器 `Acc` 记录次数）'
  - '**边界条件**'
  - '- 非尾递归（直接递归返回类型表达式）深度限制约 50 层，超出报 `Type instantiation is excessively deep`'
  - '- 尾递归（元组累加器模式）可突破至 999+ 层（TS 4.5+），但元组长度上限约 9999（或更高版本放宽）'
  - '- 递归类型别名不能直接出现在自身定义的“非条件分支”中，必须包裹在条件类型 `extends ? :` 内部实现惰性求值'
  - '- 复杂递归极大消耗编译器内存和 CPU，大型项目中滥用会导致 IDE 卡顿、构建超时，需权衡收益'
  sources:
  - paper: 20230418_035.md
    role: origin
  excerpts:
  - 递归与尾递归类型：在类型系统中实现复杂数据结构变换
  - 通过元组递归模拟循环，实现深度 `Readonly`、`Flatten`、路径提取 `Path<T>` 等实用工具，规避类型实例化深度限制。
- 'no': 5
  name: 实战：从 OpenAPI Schema 自动生成类型安全的请求客户端
  points:
  - '**为什么需要这个概念？**'
  - '- 手写 API 请求类型定义重复、易过时、与后端不一致，维护成本高'
  - '- 需要端到端类型安全：URL 路径参数、查询参数、请求体、响应体全链路推导，重构时编译器即时报错'
  - '- 将前几节核心原语（条件类型、模板字面量、递归、映射）串联落地，验证类型编程工程价值'
  - '**核心定义**'
  - '- **输入**：OpenAPI 3.x JSON/YAML Schema（含 `paths`、`components/schemas`）'
  - '- **核心类型变换管线**：'
  - '  1. **路径解析**：模板字面量提取 `/users/:id/posts/:pid` 中的路径参数联合 `''id'' | ''pid''`'
  - '  2. **操作映射**：遍历 `paths` 对象键（方法+路径），映射为 `HttpMethod<''GET'', ''/users/:id''>`
    结构'
  - '  3. **参数分离**：条件类型区分 `path`/`query`/`header`/`cookie` 参数，生成对应输入类型'
  - '  4. **引用展开**：递归解析 `$ref` 引用，展开 `components/schemas` 中复杂嵌套模型'
  - '  5. **客户端签名生成**：合成 `request<Path, Method, Params, Body>` 重载签名，实现路径参数必填、查询参数可选的类型约束'
  - '**关键性质**'
  - '- **Schema 驱动开发 (SDD)**：Schema 为单一事实来源，类型定义自动衍生，消除手写同步成本'
  - '- **类型安全即文档**：IDE 自动补全即接口文档，参数错误编译期即报错（如缺少必填 path 参数、query 类型不匹配）'
  - '- **增量生成**：利用工具（如 `openapi-typescript`、`orval`、`hey-api`）集成构建流水线，CI 中自动生成 `.d.ts`'
  - '**典型例子**'
  - '- **路径参数强制**：`client.get(''/users/:id'', { params: { id: 123 }})` ✅ 通过；`client.get(''/users/:id'',
    {})` ❌ 报错缺少 `id`'
  - '- **响应体类型推导**：`const user = await client.get(''/users/1'')`，`user` 类型自动为 `UserSchema`
    而非 `any`'
  - '- **泛型约束复用**：`type Client = OpenAPIClient<typeof schema>` 一次定义，全项目复用'
  - '**边界条件**'
  - '- OpenAPI Schema 中 `anyOf`/`oneOf` 映射为 TS 联合类型可能导致类型膨胀，需配置简化策略'
  - '- 循环引用 Schema（如树形结构 `Node { children: Node[] }`）需生成工具支持递归类型别名，否则展开无限'
  - '- 文件上传 `multipart/form-data` 等非 JSON 场景类型建模复杂，常需手写补充声明'
  - '- 生成的类型体积巨大（数万行）可能影响 IDE 性能，建议按模块拆分生成或使用 `export type` 按需导入'
  sources:
  - paper: 20230418_035.md
    role: origin
  excerpts:
  - 实战：从 OpenAPI Schema 自动生成类型安全的请求客户端
  - 串联模板字面量、索引访问、条件类型，构建端到端类型安全的 API 调用层，消灭手写接口定义的维护成本。
