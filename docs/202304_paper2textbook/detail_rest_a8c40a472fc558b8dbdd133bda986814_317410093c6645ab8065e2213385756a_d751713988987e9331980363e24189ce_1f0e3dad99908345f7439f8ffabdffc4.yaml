learning_targets:
- 理解前端构建产物标准化的核心规范：不可变产物、内容寻址、SPA 回退与 SRI 防篡改
- 掌握生产级 Dockerfile 多阶段构建、非 Root 用户、Distroless 基础镜像、健康检查与资源限额的最佳实践
- 熟悉 Kubernetes 部署策略（RollingUpdate/Recreate）、Ingress 流量治理、ConfigMap/Secret 解耦配置、HPA/VPA
  弹性伸缩及 Istio Service Mesh 金丝雀发布能力
- 理解边缘计算与边缘渲染的架构差异（Edge Runtime vs Node.js），掌握 Next.js/Nuxt Edge Functions 部署、Edge
  KV 状态管理、Middleware 实现 A/B 测试与个性化路由
- 掌握 GitOps 核心原则与 ArgoCD 工程化落地：声明式同步、App of Apps 模式、PreSync/PostSync Hook、自动回滚、Secret
  安全管理与变更日志自动化
