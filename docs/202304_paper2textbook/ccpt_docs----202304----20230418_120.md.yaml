paper: docs/202304/20230418_120.md
desc: 该素材为《GPT 调教心流法-身份篇》，作者 Bittle.白先生提出一套基于“身份认知”与“提问逻辑”的 GPT 高效交互方法论。核心主张是将 GPT
  视为有生命的交互主体，通过“知己知彼”的身份设定（用户身份与 GPT 身份双向设定）、“人物 DNA 优化”（场景、年龄、性格、语气）、“核心诉求挖掘”与“元素拆解热身”的提问逻辑，构建出一套通用的四步提问公式，旨在从“道”的层面解决提示词工程中的对齐与精准度问题。
concepts:
- name: 心流法
  desc: 作者自创的 GPT 交互方法论体系名称，强调在使用 GPT 过程中达到心流状态，融合十年内容创作经验与人性、营销、思维模型洞察，旨在授之以渔而非授之以鱼。
  is_original: true
  excerpt:
  - chatGPT 的调教使用心流法。听上去很虚，但作为一个 AIGC 的创作者，如果你静下心来细细品尝，对于你使用 GPT 会有质的飞跃。
  - 这套心法，基本适用于大部分人，因为我总结的底层逻辑，是基于人性洞察、营销洞察和思维模型相结合的。
- name: 身份四分类
  desc: 将现实生活中的人物身份抽象为四大类型，作为设定 GPT 角色或用户自身角色的基础分类学依据。
  is_original: true
  excerpt:
  - 四个类型： 技术身份：职业类型的专职人员 生活身份：邻居、大爷大妈等等工作身份：同事、上司、下属 家庭身份：丈夫、妻子、儿女、姐姐等
  - 这些基本已经覆盖了你生命中会遇到的人。
- name: 双向身份设定
  desc: 核心概念：不仅要设定 GPT 的身份，更要告知 GPT 用户的身份。实验表明，当 GPT 知晓用户身份（如小说家）时，输出质量显著优于仅设定 GPT
    身份或不设定身份的情况。
  is_original: true
  excerpt:
  - 格局打开！ 我想告诉你的是，小 G 也需要知道你的身份！！
  - 这组对比可以看出，当小 G 知道我是小说家身份之后，给到的反馈更优秀于其他的两个。 更加工整，理解更加深刻，且充分融入到框架中。
- name: 身份四问
  desc: 落实双向身份设定的操作性检查清单，包含四个维度的提问：我是谁、GPT 是谁、输出给谁看、谁分享信息（情景）。
  is_original: true
  excerpt:
  - 请记住这个第一个心流点： 身份四问 ！ 1⃣️你是谁？ 4⃣️小 G 是谁？ 3⃣️你想输出给谁看？ 4⃣️谁和你分享信息（情景设定）
- name: 人物 DNA
  desc: 定义人物形象的五个核心维度：交流场景、人物身份、年龄关系、性格、语气。通过丰富这些维度，使 GPT 输出具备真实感、个性化和交流感，而非格式化的广告腔或说明书腔。
  is_original: true
  excerpt:
  - 人物 DNA：交流场景、人物身份、年龄关系、性格、语气
  - 第三篇就是一篇交流感浓厚、且个性鲜明的种草笔记！ 你只要稍加表情就能发布了。
- name: 核心诉求 vs 表面需求
  desc: 区分用户显性表达的模糊需求（表面需求）与隐性的真实目的（核心诉求）。提问逻辑的第一要义是直接向 GPT 表达核心诉求。
  is_original: true
  excerpt:
  - 人有一个通病：在表达自己欲望时，会先说表面的需求或问题，而非核心诉求。
  - “我想要一份旅游攻略” 是表面需求，想省心省力畅快游玩才是核心诉求。
- name: 元素拆解/热身检索
  desc: 将复杂指令拆解为独立信息元素，针对歧义词汇或专业术语（如‘路演’、‘谐音梗’）与 GPT 进行预对齐，确保双向信息对称，是提问逻辑的第二要义。
  is_original: true
  excerpt:
  - 第二要义，就是拆解逻辑 把你的问题当中涉及的元素分拆开来，特别是少见的词汇信息，先给小 G 热身检索，确保它理解的意思和你要的一致。
  - 其中“路演”在不同行业的意思不同，所以你需要提前和小 G 确认是不是给到你要的解读。
- name: 身份互换
  desc: 一种思维模型技巧，通过让 GPT 站在用户视角（‘如果你是我会怎么做？’）反向输出，辅助决策或优化方案。
  is_original: true
  excerpt:
  - 在思维模型上，还有一个技巧就是身份互换，“小 G，如果你是我的话会怎么做？”。
methods:
- name: __overview__
  desc: GPT 调教心流法的总体方法论流程：四步提问公式。步骤1：明确核心诉求；步骤2：拆解元素锁定信息库；步骤3：设定四向身份（提问者、GPT、输出者、受众）；步骤4：丰富身份
    DNA 或信息深度。理论覆盖 90% 场景，剩余靠微调或喂养数据训练。
  excerpt:
  - step1 明确自己的核心诉求（目的） step2 拆解元素（锁定信息库） step3 设定身份（提问者，小 G，文本输出者，文本受众） step4 丰富身份的
    DNA 或者某个信息点的深度（优化答案）
  - 基于上边这 4 步，理论上能满足你提问的 90%要求，然后再微调补充即可。
- name: 横向对比实验法
  desc: 在独立对话框中，通过控制变量（无身份、设定用户身份、设定 GPT 身份、设定人物 DNA 等级）横向对比输出质量，验证身份设定与 DNA 丰富度对结果的影响。
  excerpt:
  - 我做了一组对比问答，分别是 不设定身份、设定我的身份、设定小 G 的身份 （见图一）
  - 三组问题： 1）写一篇关于 YSL 口红的小红书笔记 2）写一篇关于 YSL 口红的小红书笔记，用姐姐的口吻表达 3）写一篇关于 YSL 口红的小红书笔记，模拟我姐姐跟我分享的口吻，她大概
    25 岁，有点暴躁和活泼 （见图二）
theorems:
- name: 知己知彼定律
  desc: GPT 交互质量取决于双向身份认知的深度。仅设定 GPT 身份不足，必须同时明确‘我是谁’，实现用户与 GPT 的信息对称，才能获得深度融合框架、理解深刻的高质量输出。
  excerpt:
  - 为什么要学习心流法呢？...把 GPT 当作人、物，甚至是“场”，他就有很多的可能性
  - 当小 G 知道我是小说家身份之后，给到的反馈更优秀于其他的两个。 更加工整，理解更加深刻，且充分融入到框架中。
  - 用不同类型的身份运用在提问中，“知己知彼”，就能获得更优质的答案。
- name: DNA 决定质量定律
  desc: 涉及人际交流文本生成时，输出质量与‘人物 DNA’（场景、身份、年龄、性格、语气）的丰富度正相关。DNA 维度越完整，输出越接近真实人类交流感，越不需要后期修饰。
  excerpt:
  - 为什么你总是要优化小 G 输出的文本？是因为你没有给他清晰的了解人物的 DNA。
  - 第一篇是详情页的感觉， 第二篇是广告介绍，有销售味。 第三篇就是一篇交流感浓厚、且个性鲜明的种草笔记！
  - 如果你需要小 G 输出与人交流的文本信息，就去丰富这个人物的 DNA。
- name: 核心诉求直达原则
  desc: 人类表达天然倾向于‘表面需求’，而 GPT 需要‘核心诉求’才能精准抓取海量数据中的有效信息。提问必须显性化：你是谁、想做什么、达到什么目的、通过什么方法、期望什么结果。
  excerpt:
  - 提问逻辑的第一要义，把核心诉求告诉小 G！ 你是什么人，想做什么事，达到什么目的，通过什么样的方法去达成，期望有什么样的结果。
  - 摒弃自己平时的表面问题，你才有可能得到更好的答案。
- name: 信息对称前提论
  desc: GPT 拥有海量数据但缺乏上下文锚定，用户必须通过‘元素拆解’和‘热身检索’消除歧义（如多义词、行业黑话），确保人机双方对关键概念的理解一致，这是精准回答的前提。
  excerpt:
  - 小 G 是一个拥有超级大脑的小孩，有海量的数据，它需要足够的线索来抓取有效信息，并回应的你精准诉求。
  - 你们俩的信息对称了，答案才会更加准确。
- name: 大道至简方法论论
  desc: 复杂的提示词工程可归约为四步标准化流程（诉求-拆解-身份-DNA），覆盖 90% 场景。方法论的形成标志着经历向经验的转化，剩余 10% 需微调或微调训练解决。
  excerpt:
  - 没有形成方法论的时间积累都是经历，不是经验
  - 基于上边这 4 步，理论上能满足你提问的 90%要求，然后再微调补充即可。这一套下来，犯错的概率是极少的。
  - 大道至简，朋友们。
findings:
- name: 双向身份设定优于单向设定
  desc: '[evidence] 作者进行了对比实验（见图一）：不设定身份 < 设定 GPT 身份 < 设定用户身份（小说家）。当 GPT 知晓用户为‘小说家’时，输出最为工整、理解深刻且融入框架。'
  excerpt:
  - 我做了一组对比问答，分别是 不设定身份、设定我的身份、设定小 G 的身份 （见图一）
  - 这组对比可以看出，当小 G 知道我是小说家身份之后，给到的反馈更优秀于其他的两个。 更加工整，理解更加深刻，且充分融入到框架中。
- name: 人物 DNA 丰富度显著提升小红书种草文真实感
  desc: '[evidence] 横向对比三个 Prompt（见图二）：无身份 -> 详情页感；仅身份标签‘姐姐’ -> 广告介绍感/销售味；完整 DNA（25岁、暴躁活泼、模拟分享场景）
    -> 交流感浓厚、个性鲜明、可直接发布。'
  excerpt:
  - 三组问题： 1）写一篇关于 YSL 口红的小红书笔记 2）写一篇关于 YSL 口红的小红书笔记，用姐姐的口吻表达 3）写一篇关于 YSL 口红的小红书笔记，模拟我姐姐跟我分享的口吻，她大概
    25 岁，有点暴躁和活泼 （见图二）
  - 第一篇是详情页的感觉， 第二篇是广告介绍，有销售味。 第三篇就是一篇交流感浓厚、且个性鲜明的种草笔记！ 你只要稍加表情就能发布了。
- name: GPT 对谐音梗等中文语言游戏存在固有缺陷
  desc: '[evidence] 作者实测发现：GPT 能解释‘谐音梗’定义，但无法创作中文谐音梗文案，因其底层逻辑基于英文。需通过喂养数据或特定训练解决，而非常规提示词。'
  excerpt:
  - 还有比如“谐音梗”这个词，小 G 是能解释什么是谐音梗，但他写不出这类文案，因为写出来也是基于英文的逻辑。
- name: 四步公式覆盖 90% 常规提问场景
  desc: '[claim] 作者基于大量实操经验总结，宣称该四步提问公式（核心诉求、拆解元素、设定身份、丰富 DNA）理论上能满足 90% 提问需求，犯错概率极低。'
  excerpt:
  - 基于上边这 4 步，理论上能满足你提问的 90%要求，然后再微调补充即可。这一套下来，犯错的概率是极少的。
- name: 使用 GPT 过程即人类表达能力训练过程
  desc: '[claim] 作者观察到：与 GPT 交互倒逼人类明确诉求、拆解逻辑、设定语境，从而提升工作效率并降低人际沟通成本，是一种双向成长。'
  excerpt:
  - 使用 GPT 其实是也是训练我们表达的过程，他不仅提高我们的工作效率，也在减少沟通成本。
