life_analogy:
- 想象多模态与复杂交互是一场**‘多专家协作的悬疑案件侦破’**：
- '- **视觉语言模型** = **‘法医+目击者’双重身份的侦探**：'
- '  - **图像Token** = 现场照片像素级证据'
- '  - **区域引用** = 侦探手中的放大镜/红圈标记：‘重点看这个伤口’'
- '  - **视觉思维链** = 侦探的‘现场勘察笔录’：先记录现象（观察），再分析线索（推理），最后定性（结论）'
- '- **上下文工程** = **‘有限容量的案发现场白板’**：'
- '  - **工作记忆** = 白板核心区挂着的‘最近3天行动日志’'
- '  - **短时记忆** = 白板侧边的‘案情阶段性摘要’'
- '  - **长时记忆** = 架子上的‘历史卷宗库’（向量检索），需要时调阅'
- '  - **钉死首尾** = ‘案件核心指令’与‘铁律’永远钉在白板最显眼的顶部和底部'
- '- **代理规划** = **‘总指挥的作战地图’**：'
- '  - **ReAct** = ‘边打边侦察’的游击战术：灵活但易迷失'
- '  - **Plan-and-Solve** = ‘详细作战计划’再发兵：稳健但缺乏应变'
- '  - **Reflexion** = ‘复盘会’：打完一仗总结教训，修正下一步计划'
- '- **长上下文/失落中间** = **‘超长卷宗的阅读陷阱’**：'
- '  - **现象** = 侦探阅读百页卷宗时，开头结尾记得清，中间关键线索却‘视而不见’'
- '  - **对策** = 把‘致命证据’抽出来单独装订成‘重点材料’夹在卷宗最前面（前置），或在页边贴‘重要’便利贴（结构化标记），或让助手先写‘分章摘要’再汇总（Map-Reduce）'
summary:
- concept: 多模态提示组件
  desc: 文本指令+图像Token+区域引用+跨模态标记，构成VLM输入的最小完整单元
- concept: 视觉思维链
  desc: 引导模型输出‘观察→分析→推理→结论’结构化步骤，将隐性视觉感知显性化
- concept: 分层记忆架构
  desc: 工作记忆(近期原文)+短时记忆(摘要)+长时记忆(向量库/画像)，解决上下文窗口有限问题
- concept: 检索式对话历史
  desc: 基于语义相似度召回相关历史轮次，优于定长滑动窗口，平衡Token预算与信息相关性
- concept: ReAct范式
  desc: 思考-行动-观察循环，适合探索性任务，但单步错误易累积导致偏离
- concept: Plan-and-Solve范式
  desc: 先全局生成结构化执行计划(DAG/步骤列表)再执行，适合确定性流程，运行时灵活性弱
- concept: Reflexion/自我反思
  desc: 执行后对比预期与实际，触发重规划或参数修正，引入语言层面的强化学习修正机制
- concept: 失落中间现象
  desc: Transformer在长序列中对中间Token关注权重系统性偏低，导致关键证据位于中间时被忽略
- concept: 注意力引导策略
  desc: 关键信息前置/后置、结构化标记、分块摘要、检索重排序等手段强制模型聚焦关键段落
- concept: Map-Reduce长文本处理
  desc: 超长文档先分块摘要(Map)再汇总(Reduce)，规避中间遗忘，但可能丢失跨块关联信息
exercises:
- 'no': 1
  title: 多模态提示设计与视觉思维链实战
  contents:
  - 场景：你需要让 GPT-4V 分析一张复杂的财务报表截图（包含多个表格、图表、备注文字），回答‘Q3 营收同比增长率是多少？’。
  - 任务：
  - 1. 设计一个包含<image>标记、区域引用（如表格区域坐标）的多模态 Prompt 模版。
  - 2. 编写引导‘视觉思维链’的指令，要求模型先输出：图表类型识别 → 关键坐标轴/表头定位 → 目标数值提取 → 计算过程 → 最终答案。
  - 3. 列举该 Prompt 在以下边界条件下可能失效的原因：
  - '   - 报表截图模糊、分辨率低'
  - '   - 报表跨页，关键数据在两张图中'
  - '   - 模型幻觉出一个不存在的‘Q3 总计’行'
- 'no': 2
  title: 多轮对话上下文工程：压缩与检索的权衡
  contents:
  - 场景：构建一个代码助手 Agent，上下文窗口 8k Token。当前对话已进行 20 轮，包含：需求讨论、架构设计、3 个文件的完整代码、报错堆栈、修复方案讨论。
  - 任务：
  - 1. 设计一个分层记忆填充方案，分配 Token 预算给：系统提示、近 3 轮原文、历史摘要、用户偏好画像、相关代码片段检索结果。说明你的分配理由。
  - 2. 如果用户突然问‘第 5 轮我们讨论的那个单例模式的线程安全问题怎么解决的？’，你的检索式历史召回策略如何确保召回那段对话？向量检索可能失败吗？
  - 3. 对比‘定长滑动窗口(最近 4k Token)’与‘摘要+检索’两种策略在‘长期一致性人设’和‘近期细节追溯’两个维度的优劣。
- 'no': 3
  title: 代理规划范式选择与失败诊断
  contents:
  - 场景：目标‘自动完成一个包含前后端的用户注册登录模块开发，并部署到测试环境’。
  - 任务：
  - 1. 分别用 ReAct、Plan-and-Solve、Reflexion 三种范式写出该任务的前 3 步高层规划伪代码/结构化输出。
  - 2. 分析：若基座模型是 7B 开源模型，哪种范式最可能失败？为什么？
  - 3. 运行中途，后端启动报错‘端口被占用’。ReAct 范式下 Agent 可能如何错误循环？Plan-and-Solve 如何处理？Reflexion 会触发什么机制？
  - 4. 设计一个‘人工确认关卡’插入点，防止 Agent 误删生产数据库配置。
- 'no': 4
  title: 长上下文‘失落中间’缓解方案对比实验设计
  contents:
  - 场景：有一份 100k Token 的法律合同语料，其中第 40k-45k 位置藏着一句‘乙方可随时单方面终止合同无需赔偿’的关键陷阱条款。模型上下文窗口
    128k。
  - 任务：
  - 1. 设计 4 个实验组 Prompt 策略：
  - '   - A组：原文直接塞入（对照组）'
  - '   - B组：关键信息前置（将该条款移到开头）'
  - '   - C组：结构化标记（给每章加<Chapter><Title>标签）+指令‘重点阅读终止条款’'
  - '   - D组：Map-Reduce（分章摘要→汇总问答）'
  - 2. 预测四组在‘发现陷阱条款’准确率上的排序，并解释理论依据（注意力机制、Token位置偏置、信息丢失）。
  - 3. 如果合同长 500k Token，超出窗口，D 组 Map-Reduce 会丢失什么跨章节关联信息？如何改进？
