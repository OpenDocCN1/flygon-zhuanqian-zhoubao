paper: docs/202304/20230418_091.md
desc: 该素材为一篇社群推广文章，作者从实践视角对比了“搞钱”（商业变现）与“搞学习”（个人成长）的核心区别：搞钱本质是向外求，通过为他人提供价值实现变现；搞学习本质是向内求，通过夯实基本功提升自我。文章指出两者非割裂关系，而是构成“双向螺旋架构”，需遵循“先搞自己，再搞别人，搞不定别人时回头再搞自己”的动态循环逻辑。
concepts:
- name: 搞钱
  desc: 指商业变现过程，核心逻辑是向外求，通过识别外部需求、提供解决方案并为他人创造价值来换取金钱回报。
  is_original: false
  excerpt:
  - 搞钱是向外求，不断给他人提供价值和解决方案
- name: 搞学习
  desc: 指个人成长过程，核心逻辑是向内求，专注于内在基本功的修炼与能力迭代，是搞钱的地基。
  is_original: false
  excerpt:
  - 搞学习是向内求，不断提升自己的基本功
- name: 双向螺旋架构
  desc: 描述搞钱与搞学习非线性、非割裂的动态共生关系：向内搞学习夯实根基，向外搞钱验证成果并反哺学习，形成持续向上的螺旋上升结构。
  is_original: true
  excerpt:
  - 搞钱和搞学习是一个双向的螺旋架构，可以相辅相成，持续向上
- name: 先搞自己，再搞别人
  desc: 实操层面的行动准则：必须先通过‘搞学习’建立内在确定性（搞自己），才能有效通过‘搞钱’影响外部确定性（搞别人）；外部受挫时需反向回归内部打磨。
  is_original: true
  excerpt:
  - 所以我们要多搞别人才能搞到钱，但也要常搞自己才能搞定别人
  - 先搞自己，再搞别人，搞不定别人的时候，回头再搞自己
methods:
- name: __overview__
  desc: 基于‘向内求/向外求’维度的对比分析法，结合社群实践验证，构建‘双向螺旋’动态模型，指导个体在商业变现与个人成长间分配精力与节奏。
  excerpt:
  - 搞学习是向内求... 搞钱是向外求... 搞钱和搞学习是一个双向的螺旋架构
  - 先搞自己，再搞别人，搞不定别人的时候，回头再搞自己
theorems:
- name: 搞钱与搞学习的内外向本质区别
  desc: 搞钱的本质是向外求价值交换，搞学习的本质是向内求能力构建，二者方向相反但缺一不可。
  excerpt:
  - 搞学习是向内求，不断提升自己的基本功 搞钱是向外求，不断给他人提供价值和解决方案
- name: 双向螺旋共生定理
  desc: 搞钱与搞学习不是二元对立的‘两件事’，而是构成‘双向螺旋架构’：学习为搞钱提供弹药，搞钱为学习提供反馈与资源，两者相辅相成、持续向上。
  excerpt:
  - 搞钱和搞学习是一个双向的螺旋架构，可以相辅相成，持续向上
- name: 行动循环律：先内后外，受挫回内
  desc: 有效的人生策略遵循‘先搞自己（内），再搞别人（外），搞不定别人时回头再搞自己（内）’的闭环逻辑，拒绝单纯向外索取或单纯向内封闭。
  excerpt:
  - 先搞自己，再搞别人，搞不定别人的时候，回头再搞自己
findings:
- name: 社群迁徙路径验证：成长会 -> 生财有术
  desc: '[evidence] 作者观察到真实用户路径：先在‘成长会’（搞学习社群）夯实基本功，再进入‘生财有术’（搞钱社群）实战变现，印证了‘先搞自己，再搞别人’的路径有效性。'
  excerpt:
  - 我就是从成长会到生财有术的
- name: 认知重构效应
  desc: '[claim] 读者在阅读后产生‘新认知’，打破了‘搞学习与搞钱无关’或‘二选一’的误区，确立了‘相辅相成’的系统性认知。'
  excerpt:
  - 新认知，学习了
  - 长见识了很多
  - 相辅相成
