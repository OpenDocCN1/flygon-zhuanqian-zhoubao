learning_targets:
- 理解脚手架工程化的核心价值：以标准化流水线替代手工配置，解决项目初始化碎片化、重复造轮子、治理缺位问题
- 掌握组件物料平台的建设要素：元数据规范、文档自动生成、沙箱演示、依赖图谱，实现组件从“代码”到“资产”的跃迁
- 理解低代码搭建引擎的核心架构：Schema 协议设计、渲染器插件化、状态历史管理、AST 代码生成，明确其适用边界与演进路径
- 掌握研发效能度量体系的指标体系：北极星指标与 DORA 四大指标的选取、采集、可视化与洞察分析闭环
- 能够串联脚手架、组件平台、低代码、度量看板，构建前端效能平台 MVP，形成“创建-开发-构建-发布-运行”全生命周期数据闭环
