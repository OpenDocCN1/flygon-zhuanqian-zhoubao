learning_targets:
- 理解思维链（CoT）在复杂推理中面临的“单一路径不可逆”局限，掌握自我一致性（CoT-SC）与思维树（ToT）的核心机制差异与适用边界
- 掌握检索增强生成（RAG）的标准流程（索引-检索-生成），能识别朴素RAG的召回瓶颈与上下文噪声问题，并设计混合检索、重排序、查询重写等进阶优化策略
- 理解程序辅助推理（PAL）将自然语言推理转为代码执行的“推理-计算分离”范式，掌握其在数学计算、符号推理、表格问答中的优势与沙箱安全工程要求
- 掌握 ReAct（推理+行动）闭环架构与 Function Calling 标准化协议，能设计具备规划、工具调用、环境反馈纠偏能力的 Agent 系统，并处理循环失控与上下文膨胀等工程风险
concept_map:
- 进阶推理技术
- ├── 思维链进化：CoT → CoT-SC → ToT
- '│   ├── CoT-SC（自我一致性）        —— P001: 温度采样+多数投票，解决单路径随机性错误，适合离散答案空间'
- '│   ├── ToT（思维树）               —— P001: 状态分解+价值评估+树搜索（BFS/DFS），支持回溯与规划，适合组合探索任务'
- '│   └── Test-Time Scaling 视角      —— P001: 推理时计算换性能，不改模型参数'
- ├── 检索增强生成（RAG）
- '│   ├── 标准流程                    —— P002: Indexing(分块/嵌入/入库) → Retrieval(向量搜索/Top-K)
  → Generation(拼装Prompt)'
- '│   ├── 进阶优化                    —— P002: 查询重写(HyDE/分解) → 混合检索(BM25+稠密) → 重排序(Cross-Encoder/LLM)
  → 上下文压缩'
- '│   ├── 模块化架构                  —— P002: DocumentLoader/TextSplitter/EmbeddingModel/VectorStore/Retriever/Reranker/Generator/Evaluator
  标准接口'
- '│   └── 核心痛点                    —— P002: 召回瓶颈/上下文窗口限制/隐性知识难检索/噪声干扰'
- ├── 程序辅助推理（PAL）
- '│   ├── 核心范式                    —— P003: Question → LLM生成代码 → Interpreter执行 → Result
  → LLM生成答案'
- '│   ├── 关键优势                    —— P003: 计算精度100%保障/逻辑结构显性化(循环/分支/数据结构)/可验证可调试'
- '│   ├── 适用边界                    —— P003: 需强代码能力模型/沙箱安全隔离/非算法任务无优势'
- '│   └── 对比 PoT                    —— P003: PoT强调程序直接出答案，PAL强调代码作中间推理载体可混合自然语言'
- └── ReAct 与工具调用
- '├── ReAct 循环                  —— P004: Thought(推理) → Action(工具调用) → Observation(环境反馈)
  → 循环直到 Finish'
- '├── Function Calling 标准化      —— P004: 结构化JSON输出/JSON Schema约束/并行多工具调用/OpenAI/Anthropic/MCP协议统一'
- '├── 核心能力                    —— P004: 交互式信息获取/外部反馈纠偏/副作用执行'
- '└── 工程风险与对策              —— P004: 最大步数防死循环/上下文摘要压缩/工具Schema文档化治理'
life_analogy:
- 想象解决一道复杂的奥数题：
- '- **标准 CoT** = 一个学生**只能在草稿纸上线性推导**，一旦第 2 步算错，后面全错，且无法回头。'
- '- **CoT-SC (自我一致性)** = 让 **5 个不同学生独立做同一题**，最后**投票选票数最多的答案**，靠“大概率事件”修正个别粗心。'
- '- **ToT (思维树)** = 一个**会回溯的聪明学生**：尝试“设 x 法”卡住了 → **回退** → 尝试“设 y 法” → **评估哪条路更通**
  → 继续深入，甚至同时在草稿纸上并行探索两条路。'
- ''
- 想象 **RAG** 是 **“开卷考试”系统**：
- '- **Indexing** = 考前把图书馆所有书**拆页、建索引、贴标签**存进智能书架。'
- '- **Retrieval** = 考生提问“什么是量子纠缠”，系统**秒速抽出最相关的 5 页纸**递给考生。'
- '- **Generation** = 考生**只看这 5 页纸**（上下文）作答，并在答卷上**标注引用页码**（溯源）。'
- '- **进阶优化** = 考生问题太模糊 → **帮他改写成精准检索词**；召回太多 → **重排序只留最硬核的 2 页**；纸太长 → **帮他提炼精华摘要**塞进答题卡。'
- ''
- 想象 **PAL (程序辅助推理)** 是 **“数学家 + 计算器”组合**：
- '- 数学家（LLM）负责**看懂题意、设计解题逻辑、写出解题程序（Python 代码）**。'
- '- 计算器（Interpreter）负责**跑代码、算大数、解方程、处理矩阵**，**绝不算错一位小数**。'
- '- 最终答案 = 计算器的**确定性输出**，而非数学家的**模糊心算**。'
- ''
- 想象 **ReAct Agent** 是 **“带工具箱的实习生”**：
- '- **Thought** = 实习生**琢磨**：“老板要竞品分析报告，我得先查官网、再查财报、最后算市占率”。'
- '- **Action** = 实习生**伸手拿工具**：调用 `浏览器搜索(竞品官网)`、`Python跑数(市占率公式)`。'
- '- **Observation** = 工具**返回结果**（网页内容/计算结果），实习生**看一眼**，决定下一步。'
- '- **循环** = 直到实习生说 **Finish**，把报告交上来。'
- '- **Function Calling** = 给实习生发**标准化工具说明书**（JSON Schema），别让他猜参数叫啥、传啥类型。'
summary:
- concept: CoT-SC (自我一致性)
  desc: 通过温度采样生成多条推理路径，对最终答案多数投票修正单路径随机性错误，适合离散答案空间
- concept: ToT (思维树)
  desc: 将推理建模为树状搜索：思维分解、状态评估、搜索算法（BFS/DFS）、计算预算，支持回溯与规划
- concept: Test-Time Scaling
  desc: 在推理阶段投入额外计算（采样/搜索）换取性能提升，不修改模型参数
- concept: RAG (检索增强生成)
  desc: 索引-检索-生成三阶段，将外部知识作为非参数化记忆注入上下文，实现知识零成本更新与可溯源
- concept: 混合检索
  desc: 融合稀疏检索（BM25/关键词精准）与稠密检索（向量/语义匹配），兼顾精确命中与语义召回
- concept: 重排序
  desc: 用 Cross-Encoder 或 LLM 对粗排 Top-K 精细打分，解决向量检索‘语义相似≠答案相关’的噪声问题
- concept: 查询重写
  desc: 将用户模糊/复杂查询转为多个精准子查询或假设性文档（HyDE），提升召回上界
- concept: PAL (程序辅助推理)
  desc: LLM 生成可执行代码，解释器执行保证计算精度，实现‘推理逻辑’与‘数值计算’分离
- concept: 沙箱隔离
  desc: 执行模型生成代码的安全容器：无网络、资源限额、禁用危险库、进程隔离
- concept: ReAct
  desc: Reasoning+Acting 交织循环：Thought(推理)→Action(工具调用)→Observation(观察)→循环，实现自主决策闭环
- concept: Function Calling
  desc: 模型原生输出结构化 JSON `{name, arguments}`，由客户端解析执行，绕过文本解析不稳定，支持并行调用
- concept: MCP (Model Context Protocol)
  desc: 标准化工具接口协议：`tools/list`/`tools/call`/`resources/read`，实现工具跨框架/语言/进程复用
- concept: Agent 工程风险
  desc: 循环失控(设最大步数/去重)、上下文膨胀(摘要/滑动窗口)、工具描述质量(Schema文档化治理)
exercises:
- 'no': 1
  title: CoT-SC 与 ToT 机制对比与参数权衡
  contents:
  - 某数学推理任务，基础模型单次 CoT 准确率 65%。
  - 1. 若使用 CoT-SC，温度 T=0.7，采样 20 条路径投票，预期准确率会如何变化？若模型存在‘系统性幻觉’（如固定认为 2+2=5），投票机制为何会失效？
  - 2. 若改用 ToT，设定广度 b=3，深度 d=4，状态评估器为启发式函数。请估算最坏情况下的节点访问量，并说明剪枝阈值如何影响‘探索-利用’平衡。
  - 3. 对比两者在 Token 消耗、延迟、工程复杂度上的权衡，给出‘选择 CoT-SC 而非 ToT’的 3 个典型场景判据。
- 'no': 2
  title: RAG 召回瓶颈诊断与混合检索设计
  contents:
  - 某企业内部文档问答系统：文档 10 万段，Embedding 模型 BGE-large，Top-K=5，用户反馈‘专有名词查不准、多跳问题答不对’。
  - 1. 设计一个‘召回诊断实验’：如何量化‘关键证据未召回’的比例？需构造什么样的测试集？
  - 2. 请给出‘BM25 + 稠密向量’混合检索的融合公式（如 RRF 或 加权求和），并解释为何 BM25 能补齐向量检索在专有名词/ID/数值上的短板。
  - 3. 引入 Cross-Encoder 重排序后，端到端延迟增加 200ms。如何通过‘两阶段异步’或‘轻量化蒸馏’将延迟压缩至 50ms 以内？请画出优化前后的流程时序图。
- 'no': 3
  title: PAL 沙箱安全与代码生成鲁棒性测试
  contents:
  - 你需部署一个支持 PAL 的数学解题服务，模型生成 Python 代码由沙箱执行。
  - 1. 列举 5 类模型生成代码可能引发的安全风险（如 `os.system`、`__import__('subprocess')`、无限循环、内存炸弹、文件系统访问），并给出沙箱层面的对应硬化方案（如
    seccomp 规则、cgroups 限额、只读根目录、网络命名空间隔离）。
  - 2. 设计一组‘对抗性提示’，诱导模型生成：(a) 看似正确实则含后门的代码 (b) 语法正确但逻辑死循环的代码 (c) 利用 Python 动态特性绕过静态检查的代码。
  - 3. 当沙箱执行超时或报错时，如何设计‘错误反馈回注 Prompt’机制，让模型自动修复代码并重试？限制重试次数为 3，请写出伪代码逻辑。
- 'no': 4
  title: ReAct Agent 循环失控复现与治理
  contents:
  - 某 ReAct Agent 在执行‘预订机票’任务时，陷入循环：反复调用 `search_flight` 参数仅微调日期 ±1 天，累计 50 步未 Finish。
  - 1. 分析导致该循环的 3 个可能根因（涉及 Prompt 设计、工具返回、模型推理缺陷）。
  - '2. 设计一个‘循环检测器’：基于 (Action Name, 关键参数 Hash) 滑动窗口去重，窗口大小 5，连续 3 次重复即强制中断并注入 `Thought:
    检测到重复动作，需换策略或求助`。请给出核心判定逻辑代码。'
  - 3. 对比‘最大步数硬截断’ vs ‘循环检测软中断’ vs ‘引入 Planner 先规划后执行’三种治理方案的优劣，并在‘高确定性流程’ vs ‘高探索性任务’两类场景下给出选型建议。
