paper: docs/202304/XxczdnuchoE7JtxZrO8cn4eGncb.md
desc: 该素材是一份实操性极强的《胎教级标题党培训手册》，作者小凡详细拆解了如何通过四步提示词工程（赋予身份、注入方法论、喂养案例库、平台关键词修正）将GPT训练为小红书爆款标题生成专家。核心贡献在于提出了结构化的“提示词分层训练法”，并创造性地引入“二极管标题法”作为核心方法论，同时总结了小红书平台特有的40个爆款关键词库用于最终润色，实现了从通用大模型到垂类内容生产工具的低成本定制化落地。
concepts:
- name: 提示词分层训练法
  desc: 一种将复杂指令拆解为身份设定、方法注入、案例微调、规则约束四个顺序步骤，通过多轮对话渐进式训练大模型完成特定垂类任务的提示词工程范式。
  is_original: true
  excerpt:
  - 第一步：给身份...第二步：给方法...第三步：给案例...第四步：关键词修正
  - 做完上面3步，基本上大部分人都会直接拿来生成标题了...因为还少一块，最最关键的一步...第四步：关键词修正
- name: 二极管标题法
  desc: 基于进化心理学（损失厌恶、负面偏误）和人性弱点（省力法则、及时享受）设计的标题创作公式，包含正面刺激公式（产品/方法+短期低成本+逆天效果）和负面刺激公式（不做某事+巨大损失+紧迫感）两种模式。
  is_original: false
  excerpt:
  - 基本原理：本能喜欢：最省力法则和及时享受；动物基本驱动力：追求快乐和逃避痛苦...正面刺激：产品或方法+只需1秒（短期）+便可开挂（即获得某种逆天效果）；负面刺激：你不XXX+绝对会后悔（天大损失）+（紧迫感）
  - 其实就是利用人们厌恶损失和负面偏误的心理（毕竟在原始社会得到一个机会可能只是多吃几口肉，但是一个失误可能葬身虎口）
- name: 平台爆款关键词库
  desc: 针对小红书平台调性提炼的40个高权重关键词（如：好用到哭、教科书般、宝藏、YYDS、吐血整理、家人们等），要求生成标题时强制穿插1-2个，并控制在20字以内，以适配平台推荐算法与用户阅读习惯。
  is_original: true
  excerpt:
  - 第二、选取下面40个爆款关键词的1-2个，穿插到标题之中。1.好用到哭...40.正确姿势
  - 因为每个平台有独属于自己的调性，所以在每个平台都会有独属于相应的平台的爆款关键词
- name: GPT作为生产力工具而非百科全书
  desc: 作者核心认知：GPT本质是提升投产比的生产资料，而非知识检索工具；其价值在于配合专业流程解决具体业务问题，而非单纯问答。
  is_original: true
  excerpt:
  - GPT现阶段最适合作为生产力工具，而不是百科全书或是任何一类聊天机器人。
  - GPT是一款工具，GPT本身极难变现，能够变现的是项目本身，GPT只是一项极大提高投产比的生产资料。
- name: 对话式训练/胎教式训练
  desc: 将训练GPT的过程比作教导3岁天才神童，强调‘把自己当成老师而不是老板’，通过持续的上下文修正（而非一次性投喂超长提示词）来纠正模型偏差（如GPT-4的‘阿兹海默症’遗忘问题）。
  is_original: true
  excerpt:
  - GPT是一名3岁的天才神童，伤仲永的本质是当爹的教育失败。
  - 训练GPT，把自己当成一名老师而不是老板。
  - GPT4.0患上了阿兹海默症，所以不断修正有时候会比一次性投喂更好。
methods:
- name: __overview__
  desc: 四步法训练流程：1. 角色设定；2. 方法论注入（二极管标题法）；3. 少样本学习（喂入优秀标题库）；4. 平台化约束优化（字数限制+爆款关键词强制植入）。
  excerpt:
  - 第一步：给身份...第二步：给方法...第三步：给案例...第四步：关键词修正
  - 提示词：下面我需要你扮演一名专业的小红书标题党专家...请学习...请根据以下内容帮我取个标题
- name: 角色设定与任务锚定
  desc: 通过明确的身份指令（小红书标题党专家）和交互协议（‘请学习’触发学习模式，‘请根据以下内容’触发生成模式），建立结构化的上下文记忆框架，避免模型‘幻觉’或偏离任务。
  excerpt:
  - 提示词：下面我需要你扮演一名专业的小红书标题党专家，我会以‘请学习’为开头传授你一些给小红书取标题的技巧...我会以‘请根据以下内容帮我取个标题：’为开头...帮我取2-3个标题。
- name: 方法论显式注入
  desc: 将隐性的标题创作经验显式化为结构化公式（正/负刺激公式）及底层心理学原理，直接作为Prompt上下文喂给模型，利用模型的推理能力而非单纯记忆能力生成标题。
  excerpt:
  - 提示词：下面我将传授你二极管标题法，请学习：1、基本原理...2、标题公式...正面刺激：...负面刺激：...
- name: 少样本案例库喂养
  desc: 收集垂类头部账号高互动标题（建议20-30个筛选10个），作为Few-shot示例输入模型，引导模型学习隐性模式（语气、节奏、Emoji使用、钩子设计），实现‘举一反三’。
  excerpt:
  - 提示词：下面我是为你准备的十分优秀的标题库，请你总结这些标题吸引人的特点，并且学会举一反三...请学习总结：离离原上谱！网易云竟然是隐藏的背书神器！...
- name: 平台化关键词强制植入与长度约束
  desc: 在生成后增加一轮修正指令：强制限制字数（<20字）并从预设的40个平台高频爆款词库中强制选取1-2个嵌入标题，完成从‘符合方法论’到‘符合平台调性’的最后一公里适配。
  excerpt:
  - 提示词：你写得很不错，但有几点要求需要给你做到补充...第一、控制字数在20字以内...第二、选取下面40个爆款关键词的1-2个，穿插到标题之中。
theorems:
- name: 提示词工程即管理学/教育学
  desc: 训练GPT的本质是‘当老师’而非‘当老板’：需要分步教学（分层Prompt）、耐心纠错（多轮修正）、喂养榜样（案例库）、设定规则（关键词库），而非一次性下达模糊指令。
  excerpt:
  - 训练GPT，把自己当成一名老师而不是老板。
  - GPT是一名3岁的天才神童，伤仲永的本质是当爹的教育失败。
  - GPT4.0患上了阿兹海默症，所以不断修正有时候会比一次性投喂更好。
- name: 方法论单一化原则
  desc: 给GPT喂方法时‘不要多，一个就好’；过多方法论会干扰模型注意力机制，导致生成质量下降。若需更换方法，建议重新开启会话训练新模型。
  excerpt:
  - 方法不要多，一个就好。如果你用GPT多了，你会发现给多了反而不好。如果不想用这个，换个方法再训练一个GPT。
- name: 案例来源本地化原则
  desc: 案例库必须来源于目标平台（小红书）的同行高赞笔记，而非通用语料；建议亲自刷5-10分钟高赞笔记手工录入，以捕捉平台最当下的‘语感’与‘调性’。
  excerpt:
  - 强烈建议收集自己的同行的标题，怎么收集也很简单，直接小红书刷个5-10分钟，把高赞笔记的标题记录下来，先取个20-30个。然后再选10个左右，你自己看到都忍不住想点开的标题
- name: AI变现路径：卖‘词集’而非‘号’或‘课’
  desc: GPT入门教程因信息差消失而贬值；真正资产是沉淀的、可复用的、面向专业场景的提示词集（Prompt Library），这是核心生产资料，具有持续变现价值。
  excerpt:
  - GPT入门教程的价值会随着信息差填平而变得一文不值，真正有价值的课程是面向创作者、提高其生产效率的落地化专业课程。
  - GPT提示词集，确实是值得拿来卖钱的。（注意是词集）
findings:
- name: 四步训练法在‘地狱级’测试（百度百科词条）上的生成效果
  desc: '[evidence] 经过四步完整训练后，GPT能将枯燥的百科全书式介绍（ChatGPT技术架构、训练细节、道德约束等）转化为符合小红书调性、包含爆款关键词（如‘宝藏’、‘吐血整理’、‘小白必看’、‘YYDS’）、20字以内的高点击率标题。三步训练（无关键词修正）生成的标题虽符合公式但缺乏‘平台味儿’。'
  excerpt:
  - 案例：【输入】ChatGPT是美国人工智能研究实验室OpenAI新推出的...【输出】（三步版）还行……好像不错。但是...还差点意思？？？
  - 案例：【第四步修正后输出】1. 吐血整理！ChatGPT小白必看保姆级教程 2. 宝藏神器！ChatGPT喂饭级指令大全 3. 好用到哭！ChatGPT写诗写代码YYDS
    4. 教科书般ChatGPT入门指南，建议收藏 5. 家人们！ChatGPT竟能自动做PPT？绝绝子
- name: 二极管标题法在小红书语境下的实战有效性验证
  desc: '[claim] 作者宣称该方法源自生财圈友@星月，并通过大量案例库（第三步喂入的13个标题）反向印证：这些高赞标题均符合‘正刺激/负刺激’公式特征（如‘只需1秒开挂’、‘不看后悔’、‘拒绝焦虑’、‘暴涨词汇量’）。'
  excerpt:
  - 方法来自生财圈友@星月 老师的文章
  - 案例库标题：离离原上谱！网易云竟然是隐藏的背书神器！/暴涨词汇量！！背了它，你的完型稳提分！/发现了一个很变态但能轻松过四六级的方法!/拒绝焦虑，人工智能带来的100种新职业
- name: 关键词修正步骤对‘平台感’的决定性提升
  desc: '[evidence] 对比三步输出与四步输出，第四步引入‘20字以内’硬性约束与‘40词库’强制植入后，标题从‘符合逻辑的好标题’质变为‘具有强烈小红书原生感的爆款标题’，验证了平台调性适配是爆款生成的必要条件。'
  excerpt:
  - 就这？...怎么感觉？？？还差点意思？？？...因为还少一块，最最关键的一步...第四步：关键词修正
  - 这10个标题，有那味儿了吗？有的话把请把‘有那味儿了’打在公屏上！
