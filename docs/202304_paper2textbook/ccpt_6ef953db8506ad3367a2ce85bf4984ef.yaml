paper: docs/202304/20230418_046.md
desc: 该素材是 AI 训练师小凡发布的《胎教级标题党培训手册》，旨在通过 4 个步骤的具体 Prompt 训练流程，手把手教导用户将 GPT 培养为小红书爆款标题创作专家，强调实操落地性与认知升华，并分享了完整的训练提示词。
concepts:
- name: 胎教级训练
  desc: 指从零基础、最基础层面开始，通过极其详细、手把手的步骤引导 AI 完成特定任务的训练方式，降低使用门槛，确保小白也能快速上手。
  is_original: true
  excerpt:
  - 胎教级标题党培训手册——4 步让 GPT 成为小红书标题大师
  - 这一篇标题党培训手册，我将紧紧抓住一个小点，把所有的训练用提示词分享给大家，直接手把手教大家如何培养 GPT 成为一名最专业的标题党大师。
- name: 标题党大师
  desc: 经过专门 Prompt 训练后，能够熟练掌握小红书平台爆款标题规律、心理触发点及写作技巧，可直接输出高点击率、高互动标题的 GPT 角色人设。
  is_original: true
  excerpt:
  - 4 步让 GPT 成为小红书标题大师
  - 培养 GPT 成为一名最专业的标题党大师
- name: Prompt 训练流程
  desc: 将复杂的 AI 任务拆解为标准化的 4 个步骤，并配套具体的提示词模板，形成可复制、可迭代的 AI 协作标准作业程序（SOP）。
  is_original: true
  excerpt:
  - 这一篇标题党培训手册，我将紧紧抓住一个小点，把所有的训练用提示词分享给大家
  - 最后再给认知升华
methods:
- name: __overview__
  desc: 采用“四步走”实战训练法：通过角色设定、规则灌输、少样本微调、实战迭代四个阶段，系统性地将通用大模型定向蒸馏为垂直领域（小红书标题）专家模型。
  excerpt:
  - 胎教级标题党培训手册——4 步让 GPT 成为小红书标题大师
  - 把所有的训练用提示词分享给大家，直接手把手教大家
  - 最后再给认知升华
theorems:
- name: 垂直场景 Prompt 落地优于通用框架
  desc: 针对单一高频任务（如写标题）设计的专用训练手册和提示词，比通用的 Prompt 大框架和基本法则更具实操性、落地性，能直接转化为生产力。
  excerpt:
  - 第一篇文章讲了一些输入 prompt 的大框架和基本法则，但是我觉得还是太浅太泛不够落地实操。
  - 这次直接给落地提示词，最后再给认知升华
- name: AI 协作核心是建立标准化 SOP
  desc: AI 时代的个人竞争力在于能否将经验沉淀为可复用的 Prompt 模板与训练流程，实现‘先富起来’的效率跃迁。
  excerpt:
  - AI 时代，让我们成为先富起来的那波人。
  - 把所有的训练用提示词分享给大家
findings:
- name: 社区认证的高实用性
  desc: '[evidence] 文章发布后获得 149 赞及大量头部圈友（亦仁、鱼丸等）背书，评论区普遍反馈“实操性很强”、“无敌”、“真正的生产力提效神器”，验证了该手册的实战有效性。'
  excerpt:
  - (149 赞)
  - 获得了大家广泛的认可和超级多的链接
  - '评论区：财女小马达 : 实操性很强... 世界和平 : 无敌！！ ... 云筝 : 跟着小凡的流程走一遍估计更有意思... 六月寄雨 : 感谢分享，太有用了'
- name: 认知门槛与工具落地的差距
  desc: '[claim] 作者观察到大多数人仍将 GPT 仅作为简单爬虫工具，存在巨大的认知与用法差距，系统化的 Prompt 训练手册是弥合此差距的关键路径。'
  excerpt:
  - '云筝 : 身边的大多数人还只是把 gpt 当成一个简单的爬虫工具，学到了'
  - 'AI 训练师小凡 : 绝对的生产力提效神器'
