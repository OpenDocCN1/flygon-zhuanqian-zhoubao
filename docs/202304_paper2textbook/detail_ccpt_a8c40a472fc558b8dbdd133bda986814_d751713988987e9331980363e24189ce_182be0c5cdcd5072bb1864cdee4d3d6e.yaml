units:
- 'no': 1
  name: 注意力机制 —— 让模型学会“看哪里”
  points:
  - '**为什么需要这个概念？**'
  - '- 传统 RNN 处理序列存在串行瓶颈，无法并行计算，训练速度慢'
  - '- RNN 隐状态容量固定，难以捕捉长距离依赖，信息随距离衰减'
  - '- 需要一种机制动态聚焦关键 Token，打破固定窗口限制'
  - '**核心定义**'
  - '- 注意力是一种将 Query 与 Key 计算相似度，再对 Value 加权求和的机制'
  - '- 缩放点积注意力公式：Attention(Q, K, V) = softmax(QK^T / √d_k) V'
  - '- Q(Query) 代表查询意图，K(Key) 代表键/被检索内容，V(Value) 代表值/实际信息'
  - '**关键性质**'
  - '- 并行计算：所有位置的注意力权重可同时计算，适合 GPU 加速'
  - '- 动态上下文：每个位置的输出是全局信息的加权和，权重随输入动态变化'
  - '- 缩放因子 √d_k 防止点积过大导致 Softmax 梯度消失（当 d_k 较大时）'
  - '- 排列等变性：输入顺序变，输出顺序相应变（需配合位置编码）'
  - '**典型例子**'
  - '- 机器翻译中，生成目标词时自动对齐到源语句中的关键词（如主谓宾对应）'
  - '- 代码补全时，模型自动“看向”几百行外定义的变量名或函数签名'
  - '**边界条件**'
  - '- 计算复杂度 O(N^2·d)，序列长度 N 过长时显存与算力呈平方级爆炸'
  - '- 标准注意力无感知位置顺序，必须显式注入位置编码'
  - '- 极长序列下 Key/Value 矩阵无法完全加载进显存，需引入稀疏/线性注意力变体'
  sources:
  - paper: 20230418_007.md
    role: motivation
  - paper: 20230418_009.md
    role: motivation
  - paper: 20230418_010.md
    role: definition
  - paper: 20230418_019.md
    role: method
  - paper: A47Vd3fekoelzRxZpdUcTl9Cn7W.md
    role: method
  excerpts:
  - 注意力机制的核心直觉是‘聚光灯’：在解码当前词时，不必把整个编码器隐状态压缩成一个定长向量，而是动态地‘看’编码端哪些位置最相关。
  - Attention(Q, K, V) = softmax(QK^T / √d_k)V
  - 多头注意力将 Q/K/V 线性投影到 h 个子空间，每个头独立计算注意力，最后拼接再投影，捕获句法、语义、位置等异构关系。
  - 标准注意力的时间/空间复杂度为 O(L^2)，导致长序列建模受限。
- 'no': 2
  name: 多头注意力 —— 多视角协作的‘会诊机制’
  points:
  - '**为什么需要这个概念？**'
  - '- 单头注意力只能学习一种注意力模式（如只关注主谓关系），无法同时捕获多样化依赖'
  - '- 不同语言现象（句法、共指、位置）需要不同的表示子空间'
  - '- 单头注意力表达能力受限，相当于只有一个‘专家’诊断'
  - '**核心定义**'
  - '- 将 Q、K、V 通过线性层投影到 h 个头：Head_i = Attention(QW_i^Q, KW_i^K, VW_i^V)'
  - '- 多头输出拼接：MultiHead(Q,K,V) = Concat(Head_1,...,Head_h)W^O'
  - '- 每个头维度 d_k = d_model / h，总参数量与单头大致相当'
  - '**关键性质**'
  - '- 子空间分工：不同头自发专业化（如头 1 关注主谓，头 2 关注共指消解，头 3 关注相对位置）'
  - '- 表达能力增强：相当于集成了 h 个不同的注意力模型，且参数共享'
  - '- 并行计算：各头独立计算，硬件利用率高'
  - '**典型例子**'
  - '- BERT 大小写模型中，特定头专门关注‘[CLS]’聚合信息，特定头关注标点符号边界'
  - '- GPT 中某些头表现为‘缩进头’（关注代码缩进层级）或‘前向/后向邻接头’'
  - '**边界条件**'
  - '- 头数 h 过多会导致每头维度 d_k 过小，单头表达力下降'
  - '- 并非所有头都有用，存在‘冗余头’，可通过剪枝压缩模型'
  - '- 多头注意力仍继承 O(N^2) 复杂度，未解决长序列瓶颈'
  sources:
  - paper: 20230418_019.md
    role: method
  - paper: A47Vd3fekoelzRxZpdUcTl9Cn7W.md
    role: method
  excerpts:
  - 多头注意力允许模型联合关注来自不同位置、不同表示子空间的信息。
  - MultiHead(Q, K, V) = Concat(head_1, ..., head_h)W^O，其中 head_i = Attention(QW_i^Q,
    KW_i^K, VW_i^V)。
  - 实验表明：不同注意力头学会了不同的语言学功能，如句法依存、共指消解、位置感知等。
- 'no': 3
  name: 位置编码 —— 给无序集合注入‘序列感’
  points:
  - '**为什么需要这个概念？**'
  - '- Self-Attention 本质是集合操作，对输入 Token 集合排列不变（Permutation Equivariant）'
  - '- 自然语言序列顺序至关重要，‘狗咬人’与‘人咬狗’含义截然不同'
  - '- 必须显式注入位置信息，否则模型无法区分顺序'
  - '**核心定义**'
  - '- 绝对位置编码：为每个位置 pos 分配固定或可学习的向量 P_pos，与 Token Embedding 相加'
  - '- 正弦绝对编码：PE(pos, 2i) = sin(pos/10000^(2i/d)), PE(pos, 2i+1) = cos(pos/10000^(2i/d))，支持外推'
  - '- 可学习绝对编码：直接初始化位置嵌入表，随训练更新，但难以外推到训练长度之外'
  - '- 相对位置编码（RoPE）：仅建模相对距离，通过旋转矩阵作用于 Q/K，实现线性衰减的相对偏置'
  - '**关键性质**'
  - '- 正弦编码：确定性、无参数、天然支持任意长度外推（但高频分量外推性能下降）'
  - '- 可学习编码：数据驱动、适应性强、但训练长度外泛化差'
  - '- RoPE：将绝对位置转化为相对位置，显式建模相对距离，线性注意力兼容，长外推性能优（配合 YaRN/PI 微调）'
  - '- ALiBi：在注意力分数加上与距离成正比的负偏置，无需位置嵌入参数，强外推性'
  - '**典型例子**'
  - '- BERT/GPT-2 使用可学习绝对位置编码，最大长度 512/1024'
  - '- LLaMA/ChatGLM 等主流大模型采用 RoPE，支持 4k-32k 上下文窗口'
  - '- Transformer-XL 使用相对位置编码实现段落级循环'
  - '**边界条件**'
  - '- 绝对位置编码与 Token Embedding 直接相加，假设语义与位置正交，实则有耦合'
  - '- RoPE 在极长序列（>100k）下高频旋转导致数值不稳定，需频率缩放（YaRN）或长度外推微调'
  - '- 纯相对位置编码丢失绝对位置感知（如‘首句’‘末句’），部分任务需混合绝对编码'
  sources:
  - paper: 20230418_020.md
    role: method
  - paper: B95VdtwByoPXGoxac7Ec1KhQnwc.md
    role: method
  excerpts:
  - 注意力机制本身是排列等变的：打乱输入顺序，输出顺序同步打乱。因此必须注入位置信息。
  - 正弦位置编码：PE(pos, 2i) = sin(pos/10000^(2i/d))，利用三角函数线性组合性质建模相对位置。
  - RoPE (Rotary Position Embedding)：将位置编码融入 Query/Key 的旋转操作中，q_m, k_n 点积仅依赖相对距离 m-n。
  - ALiBi 在注意力分数上直接加偏置：score = QK^T/√d - m·|i-j|，无参数、强外推。
- 'no': 4
  name: 注意力可视化 —— 透视模型‘在看什么’
  points:
  - '**为什么需要这个概念？**'
  - '- 注意力权重直观展示模型决策依据，是可解释性分析的核心手段'
  - '- 验证模型是否真学会了语言学知识（如句法树、共指链），还是靠捷径统计'
  - '- 发现模型失效模式（如注意力发散、关注无关 Padding、重复循环）'
  - '**核心定义**'
  - '- 将 Attention Map (Layer, Head, Query_Pos, Key_Pos) 可视化为热力图或有向图'
  - '- 常见聚合方式：跨头平均、选取特定层/头、关注 [CLS]/生成位置的注意力分布'
  - '**关键性质**'
  - '- 语法树诱导：中低层头常自发形成依存句法树结构（无监督语法感知）'
  - '- 共指消解：高层头在代词位置强注意力指向先行词'
  - '- 位置模式：对角线（关注自己）、垂直条纹（关注特殊 Token 如 [SEP]）、水平条纹（被广泛关注的 Token）'
  - '- ‘注意力≠解释’：注意力权重不等于特征重要性，高权重不等于因果贡献，需结合梯度/消融验证'
  - '**典型例子**'
  - '- 机器翻译对齐图：目标词生成时注意力峰值精准落在源语对应词上'
  - '- BERT 掩码预测：[MASK] 位置注意力聚焦于语法相关词（动词看主语/宾语，形容词看名词）'
  - '- 代码模型：缩进头关注同级缩进 Token，实现结构感知补全'
  - '**边界条件**'
  - '- 可视化仅反映‘软对齐’，非硬性规则；注意力分布往往平滑分散，边界模糊'
  - '- 多头注意力聚合掩盖个体头差异，需单头分析'
  - '- 注意力可视化无法揭示 MLP/FFN 中的知识存储与推理逻辑，只能看‘取数’不看‘算数’'
  sources:
  - paper: 20230418_022.md
    role: experiment
  excerpts:
  - 注意力热力图揭示了模型‘在看哪里’，但注意力权重不等于特征归因，高注意力不等于高因果影响。
  - 中低层注意力头倾向于捕捉局部句法结构（如主谓依存），高层头倾向于捕捉长程语义依赖（如共指消解）。
  - 特定模式：对角线模式（自关注）、垂直条纹（特殊 Token 汇聚）、区块模式（语义分段）。
