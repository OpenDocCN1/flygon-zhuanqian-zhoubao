life_analogy:
- 想象前端可观测性是一座城市的**智慧交通指挥中心**：
- '- **错误监控** = **事故监控摄像头**：全路况覆盖（多层兜底）、自动识别车牌定位肇事车辆、同类事故聚合分析高发路段'
- '- **性能监控** = **路况实时大屏**：关键指标量化（LCP/CLS/INP）、资源加载瀑布图如车辆轨迹回放、长任务检测如拥堵预警、Beacon 上报如应急广播不丢包'
- '- **用户行为埋点** = **出行大数据分析**：代码埋点如定点计数器精准统计、无痕埋点如全路网感知、会话回放如行车记录仪还原现场、漏斗模型如转化率分析'
- '- **链路追踪** = **跨区域协同指挥**：TraceID 如统一调度指令贯穿前后端、Span 如每个路口通行记录、结构化日志如标准化案卷、全链路定位如多部门联合破案'
- '- **自研平台** = **自建指挥中枢**：采集端如前端感知设备、存储端如城市大脑数据湖、查询端如指挥大屏、告警端如智能调度系统，实现数据主权与成本可控'
summary:
- concept: 多层兜底捕获
  desc: window.onerror/unhandledrejection/框架错误边界层层兜底，实现全域错误零遗漏
- concept: Source Map 还原
  desc: 将压缩混淆代码的行列号映射回源码位置，还原真实报错上下文
- concept: 聚合去重与采样限流
  desc: 基于错误指纹合并同类错误，高频错误客户端采样防止日志风暴
- concept: Web Vitals 采集
  desc: 基于 PerformanceObserver 监听 LCP/CLS/FID/INP/TTFB 等核心体感指标
- concept: 资源瀑布与长任务检测
  desc: Resource Timing API 采集资源耗时，Long Task API 识别 >50ms 主线程阻塞
- concept: Beacon 可靠上报
  desc: navigator.sendBeacon/fetch keepalive 保证页面卸载前数据不丢失
- concept: 事件模型三元组
  desc: Event（动作）、Properties（属性）、User（身份）构建标准化埋点数据模型
- concept: 代码埋点 vs 无痕埋点
  desc: 代码埋点语义精准类型安全，无痕埋点零侵入覆盖面广但语义弱需配置治理
- concept: 会话回放与漏斗分析
  desc: rrweb 录制 DOM 变更还原现场，多步事件序列量化转化率与流失节点
- concept: TraceID 透传
  desc: HTTP Header 传递 traceparent/span-id 打通前后端调用链，W3C TraceContext 标准化
- concept: 前端根 Span 生成
  desc: 页面加载/路由切换/网络请求创建根 Span，子 Span 记录渲染/资源/API 细节
- concept: 结构化日志与统一查询
  desc: 统一 JSON 格式接入 Loki/ELK，实现 Trace/Log/Metric 三维关联跳转
- concept: 自研平台四层架构
  desc: 采集端/接入层/存储层/查询告警端，技术选型 TS SDK + ClickHouse + Grafana + Alertmanager
- concept: 多租户与成本控制
  desc: 团队级数据隔离、列压缩/预聚合降本、高基数标签降维处理
- concept: 动态告警策略
  desc: 多维标签路由、抑制规则、自动恢复通知、关联发版变更记录快速定责
exercises:
- 'no': 1
  title: 错误监控实战：手写一个简易的全域错误捕获与上报类
  contents:
  - 要求实现一个 `ErrorMonitor` 类，包含以下能力：
  - 1. 捕获同步错误
  - 2. 捕获 Promise 未处理拒绝
  - 3. 捕获资源加载错误
  - 4. 集成 Vue/React 错误边界（伪代码即可）
  - 5. 生成错误指纹（类型+堆栈顶帧+当前路由）
  - 6. 使用 `navigator.sendBeacon` 上报，包含采样率控制
  - 思考题：
  - '- 如何解决跨域脚本 `Script error.` 无堆栈问题？'
  - '- Source Map 文件通常不部署在 CDN，前端 SDK 如何在上报时辅助后端还原？'
  - '- 高频错误（如第三方广告 SDK 报错）如何在不丢失核心业务错误的前提下限流？'
- 'no': 2
  title: 性能监控实战：基于 PerformanceObserver 采集 Core Web Vitals
  contents:
  - 编写一个 `PerfCollector` 模块，完成：
  - 1. 监听 LCP、CLS、FID、INP、TTFB
  - 2. CLS 计算需排除 `hadRecentInput` 为 true 的布局偏移
  - 3. INP 需记录交互类型、目标元素选择器、延迟耗时
  - 4. 资源瀑布：筛选出耗时 > 500ms 的资源，上报其 initiatorType 和 timing 明细
  - 5. 长任务检测：记录任务耗时、启动时间、归属脚本 URL
  - 6. 所有指标打包，页面卸载时通过 `sendBeacon` 上报
  - 思考题：
  - '- SPA 应用中路由切换如何重新计算 LCP/CLS 等价指标？'
  - '- `PerformanceObserver` 在 Safari 旧版本中不支持 LCP/INP，如何 Polyfill 或降级？'
  - '- 采样率 10% 时，如何保证慢页面（LCP > 4s）100% 上报？'
- 'no': 3
  title: 埋点体系设计：从事件字典到自动化校验
  contents:
  - 设计一套埋点治理方案：
  - 1. 定义事件字典 JSON Schema：包含事件名、必填属性、属性类型、枚举值、版本、负责人
  - 2. 代码埋点类型安全：基于字典生成 TypeScript 类型定义，`track<EventName>(props)` 编译期报错
  - 3. 无痕埋点配置下发：CSS Selector 绑定事件、属性提取规则、采样率
  - 4. CI 校验流水线：检查代码中埋点调用是否在字典注册、属性是否齐全、命名规范
  - 5. 数据质量监控：上报成功率、必填属性缺失率、枚举值非法率仪表盘
  - 思考题：
  - '- 如何在不修改业务代码的情况下，为老项目增量接入类型安全埋点？'
  - '- Shadow DOM / Canvas / 视频播放器内的交互无法通过无痕埋点捕获，如何补齐？'
  - '- rrweb 会话回放数据量巨大，如何设计『按需录制 + 增量快照 + 按需回放』的存储策略？'
- 'no': 4
  title: 链路追踪实战：前端 TraceID 生成、透传与 Span 埋点
  contents:
  - 实现一个轻量 `Tracer` 库：
  - 1. 页面初始化生成 `trace-id`、`span-id`，写入 `localStorage` 实现同标签页会话保持
  - 2. 重写 `fetch`/`XMLHttpRequest`，自动注入 `traceparent` Header
  - 3. 封装 `startSpan(name, attrs?)` / `endSpan()`，支持嵌套 Span 栈管理
  - 4. 自动创建根 Span：`page-load`、`route-change`、`api-request`
  - 5. Span 结束时自动上报至收集端，包含耗时、状态码、错误信息
  - '6. 采样决策：Header `traceparent: 00-<trace-id>-<span-id>-01` 标记 sampled=true'
  - 思考题：
  - '- 跨域请求无法读写 Header，如何通过代理层或 `document.domain` 等方案透传 TraceID？'
  - '- 前端 `performance.now()` 相对时间戳如何与后端绝对时间戳对齐？'
  - '- 微服务调用链路过深导致 Span 层级过多，前端如何压缩上报（如只上报关键 Span）？'
- 'no': 5
  title: 可观测平台架构评审：技术选型与容量规划
  contents:
  - 假设日活 500 万，PV 2 亿，错误上报峰值 5 万/秒，Trace 上报峰值 20 万/秒：
  - 1. 采集端：SDK 体积预算 2KB gzip，如何做到 Tree-shaking 按需加载错误/性能/行为/链路四大模块？
  - 2. 接入层：Nginx + Lua 或 Envoy 做协议校验、采样决策、批量转发 Kafka，如何设计 Kafka Topic 分区数与 Partition
    Key？
  - 3. 存储层：ClickHouse 宽表设计（MergeTree 分区键、TTL、预聚合物化视图），单表写入 QPS 如何支撑峰值？
  - 4. 查询层：Grafana Dashboard 模版变量设计（服务/版本/环境/地域），如何实现 Trace/Log/Metric 三维关联跳转？
  - 5. 告警层：配置『错误率 > 1% 且影响用户 > 100』多维告警，如何避免发版瞬间的抖动误报？
  - 6. 成本优化：高基数标签（user_id/session_id）不建索引，如何通过预聚合降维实现『按用户维度查询错误分布』？
  - 思考题：
  - '- SaaS 方案（Sentry/Datadog）成本随数据量指数增长，自建平台 ROI 临界点在哪里？'
  - '- 数据合规要求『数据不出园区』，自建平台如何对接 OpenTelemetry 生态实现厂商无关？'
  - '- SDK 版本碎片化导致上报协议不兼容，网关层如何做协议适配转换与版本灰度？'
units:
- 'no': 1
  name: 错误监控核心 —— 给前端装上“黑匣子”
  points:
  - '**为什么需要这个概念？**'
  - '- 前端运行环境不可控（浏览器版本、插件、网络），错误不可避免'
  - '- 用户不会主动反馈，且难以复现现场（控制台信息丢失、源码压缩混淆）'
  - '- 需要自动化捕获、聚合、还原源码堆栈，实现“无感知”排查'
  - '**核心定义**'
  - '- 全域错误捕获：覆盖同步代码、Promise/Async 异步、框架错误边界、资源加载失败'
  - '- Source Map 解析：将压缩混淆后的行列号映射回源码位置（文件/行/列/原始函数名）'
  - '- 聚合去重：基于错误指纹（类型+堆栈顶帧+业务路由）合并同类错误，统计频次与影响用户数'
  - '**关键性质**'
  - '- 分层兜底：window.onerror → unhandledrejection → Vue errorHandler / React ErrorBoundary
    → 框架内部 try-catch'
  - '- 采样与限流：高频错误（如第三方广告脚本报错）需客户端采样上报，防止日志风暴拖垮收集端'
  - '- 隐私脱敏：上报前自动剥离 URL 参数中的 token、PII 字段、Request Body 敏感键'
  - '**典型例子**'
  - '- 线上某版本发布后，ErrorBoundary 捕获到 `TypeError: Cannot read property ''map'' of undefined`，经
    Source Map 还原定位至 `UserList.vue:42` 行 `users.value.map`，发现接口返回 `null` 导致，10 分钟内定位并热修复'
  - '**边界条件**'
  - '- 跨域脚本错误（Script error.）无法获取堆栈，需配置 `crossorigin` 响应头'
  - '- Source Map 文件体积大、部署位置隐蔽，需构建时上传至对象存储并配置解析服务白名单'
  - '- 原生 `Error` 对象在不浏览器序列化时丢失堆栈，需手动提取 `error.stack` 字段'
  - '**素材溯源**'
  - '- paper: 20230418_046.md, role: origin, desc: 定义错误监控核心组件：全局捕获、Promise/异步错误、框架错误边界、Source
    Map 还原与聚合去重'
  sources:
  - paper: 20230418_046.md
    role: origin
  excerpts:
  - 错误监控核心：全局捕获、Promise/异步错误、框架错误边界、Source Map 还原与聚合去重
  - 实现 `window.onerror`/`unhandledrejection`/Vue `errorHandler`/React `ErrorBoundary`
    多层兜底、接入 Sentry/Fundebug 或自建平台解析 Source Map 还原源码堆栈。
- 'no': 2
  name: 性能监控 SDK 设计 —— 让性能指标“可量化、可上报、可追踪”
  points:
  - '**为什么需要这个概念？**'
  - '- 体感性能主观且不可度量，需标准化指标（Core Web Vitals）对齐业务目标'
  - '- 手工埋点侵入业务代码、维护成本高，需轻量、无侵入的自动化采集 SDK'
  - '- 上报通道必须可靠（页面卸载不丢失）、低开销（不阻塞主线程）'
  - '**核心定义**'
  - '- Web Vitals 采集：基于 PerformanceObserver 监听 LCP/CLS/FID/INP/TTFB 等关键指标'
  - '- 资源瀑布：Resource Timing API 采集每个资源的 DNS/TCP/TLS/TTFB/Download 耗时'
  - '- 长任务检测：Long Task API 识别阻塞主线程 >50ms 的任务，归因脚本来源'
  - '- 可靠上报：`navigator.sendBeacon` 或 `fetch(keepalive)` 保证页面卸载前数据送达'
  - '**关键性质**'
  - '- 零依赖、体积 < 2KB gzip、ESM/UMD 双格式、Tree-shaking 友好'
  - '- 采样率可配（如 10% 全量 + 100% 错误用户），支持动态下发采样策略'
  - '- 上报批次合并、压缩、重试指数退避，内存队列溢出保护'
  - '**典型例子**'
  - '- SDK 初始化即注入 `performance.mark(''app-init'')`，路由切换完成 `measure(''route-change'')`，自动上报
    SPA 软导航 LCP 等价指标'
  - '**边界条件**'
  - '- PerformanceObserver 不支持的旧浏览器需 Polyfill 或降级采集'
  - '- CLS 计算需排除用户主动交互导致的布局偏移（hadRecentInput 标志）'
  - '- sendBeacon 有 payload 大小限制（约 64KB），超长日志需分片或降级 localStorage 缓存'
  - '**素材溯源**'
  - '- paper: 20230418_046.md, role: origin, desc: 定义性能监控 SDK 设计要点：Web Vitals 采集、资源加载水fall、长任务检测、内存泄漏监控与
    Beacon 上报'
  sources:
  - paper: 20230418_046.md
    role: origin
  excerpts:
  - 性能监控 SDK 设计：Web Vitals 采集、资源加载水fall、长任务检测、内存泄漏监控与 Beacon 上报
  - 轻量 SDK 设计：`PerformanceObserver` 监听 LCP/CLS/FID/INP、Resource Timing API 采集资源耗时、Long
    Task API 识别阻塞、`navigator.sendBeacon` 可靠上报。
- 'no': 3
  name: 用户行为与业务埋点 —— 从“猜用户想什么”到“看用户做什么”
  points:
  - '**为什么需要这个概念？**'
  - '- 产品决策依赖数据而非直觉，需量化用户路径、转化漏斗、功能使用率'
  - '- 代码埋点侵入性强、易漏埋/错埋；无痕埋点覆盖面广但语义弱、噪音大'
  - '- 需要统一事件模型、标准化采集流程、支持会话回放与漏斗分析'
  - '**核心定义**'
  - '- 事件模型三元组：Event（动作：click/submit/view）、Properties（属性：页面/组件/业务ID）、User（身份：匿名ID/登录UID）'
  - '- 代码埋点：业务代码显式调用 `track(''event'', props)`，语义精准、类型安全'
  - '- 无痕埋点：通过 CSS Selector/XPath 绑定 DOM 事件，配置化下发，零代码侵入'
  - '- 会话回放：rrweb 录制 DOM 变更与用户交互，重现用户操作现场'
  - '**关键性质**'
  - '- 埋点治理：建立埋点字典、命名规范、校验规则（CI 阻断未注册事件）、版本管理'
  - '- 数据质量：自动校验必填属性、枚举值合法性、上报成功率监控'
  - '- 隐私合规：GDPR/个保法要求，敏感页面/字段自动脱敏、用户可撤回同意'
  - '**典型例子**'
  - '- 电商下单漏斗：`view_product` → `add_cart` → `create_order` → `pay_success`，通过漏斗模型发现
    `add_cart` 转化率异常下跌，定位至新版规格选择组件交互 Bug'
  - '**边界条件**'
  - '- 无痕埋点在 Shadow DOM、Canvas/WebGL、原生弹窗内失效'
  - '- SPA 路由切换需手动触发 `pageview` 事件，避免 PV 统计缺失'
  - '- rrweb 录屏数据量大，需按采样率录制、压缩存储、按需回放'
  - '**素材溯源**'
  - '- paper: 20230418_046.md, role: origin, desc: 定义用户行为与业务埋点体系：无痕 vs 代码埋点、事件模型、会话回放与漏斗分析'
  sources:
  - paper: 20230418_046.md
    role: origin
  excerpts:
  - 用户行为与业务埋点：无痕埋点 vs 代码埋点、事件模型设计、会话回放与漏斗分析
  - 对比可视化配置无痕埋点与代码埋点优劣、定义事件/属性/用户三元模型、集成 rrweb 实现会话录屏回放、构建转化漏斗模型。
- 'no': 4
  name: 链路追踪与日志关联 —— 打通前后端的“神经中枢”
  points:
  - '**为什么需要这个概念？**'
  - '- 单纯前端报错无法定位是前端逻辑、BFF 聚合、下游微服务还是数据库慢查询导致'
  - '- 请求链路跨进程、跨语言、跨网络边界，缺乏统一 TraceID 串联'
  - '- 需要前后端统一日志格式、链路透传、统一查询平台，实现“全链路定位”'
  - '**核心定义**'
  - '- Trace Context 透传：HTTP Header 传递 `traceparent` (W3C TraceContext 标准) 或 `trace-id`/`span-id`'
  - '- 前端生成根 Span：页面加载/路由切换/XHR-Fetch 发起时创建根 Span，子 Span 记录资源加载、组件渲染、API 请求'
  - '- 后端续接：网关/偏入层提取 Header 注入上下文，下游微服务继承传递'
  - '- 结构化日志：统一 JSON 格式（timestamp/level/traceId/spanId/message/context），接入 ELK/Grafana
    Loki'
  - '**关键性质**'
  - '- 采样决策：前端按比例采样（如 1/1000），错误/慢请求 100% 采样；Header 标记 `sampled=true` 通知后端全量采集'
  - '- 跨域限制：第三方域名请求无法读写 Header，需代理层转发或接受断链'
  - '- 时钟同步：前端 `performance.now()` 相对时间戳需映射到服务端绝对时间，便于跨端对齐'
  - '**典型例子**'
  - '- 用户反馈“提交订单转圈 10s”，前端 Trace 显示 `fetch(''/api/order'')` 耗时 9.8s，点击 Span 跳转至后端链路，发现
    `inventory-service` 数据库锁等待 8s，定位至未加索引的 `sku_lock` 表'
  - '**边界条件**'
  - '- 旧版浏览器不支持 `fetch` 拦截器，需重写 `XMLHttpRequest.prototype.send` 实现 Header 注入'
  - '- 日志量巨大，需按 TraceID 分片存储、建立倒排索引、配置 TTL 降本'
  - '- 微服务调用深度过大导致 Span 栈溢出，需限制最大嵌套层级或采用异步上报'
  - '**素材溯源**'
