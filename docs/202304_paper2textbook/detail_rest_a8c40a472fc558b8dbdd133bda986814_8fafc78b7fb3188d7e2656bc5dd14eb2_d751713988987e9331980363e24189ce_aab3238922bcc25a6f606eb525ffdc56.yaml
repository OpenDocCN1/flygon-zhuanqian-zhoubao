life_analogy:
- 想象 WebAssembly 是**浏览器里的“专业外援团队”**：
- '- **Wasm 模块** = 一支训练有素的**特种部队**（Rust/C++ 编写的高性能核心逻辑）'
- '- **线性内存** = 部队专用的**独立营房/弹药库**（隔离的字节数组，JS 不能随意闯入）'
- '- **JS 主线程** = **指挥部**（负责 UI、调度、DOM 操作，不擅长重计算）'
- '- **Import/Export** = **严格的“通行证/汇报单”**（只有函数签名匹配，才能跨边界调用）'
- '- **wasm-bindgen** = **自动翻译官/后勤专员**（帮 Rust 结构体和 JS Class 无损转换，省去手写序列化）'
- '- **SharedArrayBuffer** = **共享战情大沙盘**（指挥部与特种部队实时同步地图，零拷贝、零延迟）'
- '- **Web Worker** = **前哨作战基地**（把特种部队部署到这里，不阻塞指挥部指挥全局）'
- '- **SIMD/多线程/GC/WASI** = **新式装备/编制扩编/后勤外包/统一军标**（让部队战力指数级跃升、能在任何战场/边缘节点作战）'
- 就像指挥部只需下达高层指令、获取结果，而将繁重计算交给专业部队在营房内高效完成，WebAssembly 让浏览器突破了 JS 单线程的性能天花板。
summary:
- concept: Module/Instance/Memory/Table
  desc: Wasm 的四大核心抽象：编译单元、运行时实例、线性内存、函数引用表
- concept: 线性内存与安全沙箱
  desc: 字节数组隔离宿主环境，无直接 DOM 访问权限，保证内存安全与确定性执行
- concept: Emscripten / wasm-pack / AssemblyScript
  desc: 分别面向 C/C++、Rust、TypeScript 开发者的主流编译工具链，覆盖不同生态迁移需求
- concept: wasm-opt / wasm2wat
  desc: Binaryen 优化体积与反汇编调试的标准工具，生产构建与问题排查必备
- concept: JS-Wasm 边界调用开销
  desc: 跨边界调用 ~50-100ns，频繁小数据传递会抵消计算优势，需批量化或共享内存
- concept: SharedArrayBuffer 零拷贝共享
  desc: 配合 COOP/COEP 头启用跨域隔离，实现 JS 与 Wasm/Worker 共享线性内存实例
- concept: wasm-bindgen
  desc: Rust 宏自动生成胶水代码与 TS 类型定义，实现结构体/枚举/闭包的零/低拷贝互操作
- concept: SIMD (v128)
  desc: 128 位向量指令集，单指令多数据流加速图像/音频/ML 推理，主流浏览器已稳定支持
- concept: Wasm 多线程
  desc: 基于 Web Worker + SharedArrayBuffer + Atomics 实现 pthread 语义，突破单线程限制
- concept: WasmGC 提案
  desc: 引入结构化引用类型与栈扫描接口，让 Java/Go/Kotlin 等托管语言无需自带运行时
- concept: 组件模型
  desc: 基于 Interface Types 的语言无关组件接口，支持跨语言链接与能力安全的组合
- concept: WASI (System Interface)
  desc: 标准化文件/网络/时钟等系统调用，实现 Wasm 模块在浏览器、边缘、Serverless、嵌入式的可移植运行
- concept: Web Worker 卸载主线程
  desc: 将 Wasm 实例化与计算密集任务放入 Worker，配合 OffscreenCanvas 实现非阻塞渲染
- concept: Vite + wasm-pack 集成流程
  desc: Rust -> wasm-pack build -> pkg/ -> Vite 插件导入 -> TS 类型即用 -> HMR 热更新，开发体验接近原生
- concept: 性能基准对比方法论
  desc: benchmark.js 对比 JS 实现，指标覆盖首帧延迟、吞吐率、内存峰值、包体积，量化 ROI
exercises:
- 'no': 1
  title: 手工编译并调用一个最小 Wasm 模块
  contents:
  - '编写一个 Rust 函数 `add(a: i32, b: i32) -> i32`，使用 `wasm-pack build --target web` 编译。'
  - 在纯 HTML 页面中（无构建工具），使用 `fetch` + `WebAssembly.instantiateStreaming` 加载 `.wasm`
    并调用导出函数。
  - 观察 Network 面板中的 `.wasm` 文件大小，对比开启 `-O` 优化与未优化的体积差异。
  - 回答问题：
  - '- 为什么生成的 `.wasm` 文件比预期的大？哪些段占用了空间？'
  - '- 如果不使用 `wasm-bindgen`，如何手动在 JS 中分配线性内存并传递字符串给 Wasm？'
- 'no': 2
  title: 量化 JS-Wasm 边界调用开销
  contents:
  - '编写两个版本的斐波那契数列计算：纯 JS 实现、Rust 编译 Wasm 实现（导出 `fib(n: u32) -> u64`）。'
  - 设计基准测试：分别调用 1 万次 `fib(20)`，记录总耗时；再调用 1 次 `fib(20)`，记录单次调用耗时。
  - 使用 `performance.now()` 或 `benchmark.js` 统计结果。
  - 回答问题：
  - '- 为什么单次调用 Wasm 版本可能比 JS 慢？边界调用开销如何摊销？'
  - '- 当计算复杂度升高（如 `fib(40)`），Wasm 优势为何会显现？'
  - '- 如果在循环中频繁调用 Wasm 导出函数，V8 的 TurboFan 能否将其内联优化？'
- 'no': 3
  title: 零拷贝图像处理实战：SharedArrayBuffer + Wasm
  contents:
  - '创建一个 `SharedArrayBuffer` 作为 Wasm 的线性内存（`new WebAssembly.Memory({ shared: true,
    initial: 100 })`）。'
  - 在 Wasm 端（Rust）编写一个灰度滤镜函数，直接读写线性内存中的像素数据（RGBA 交错格式）。
  - 主线程通过 `canvas.getImageData()` 获取像素，拷贝至 `SharedArrayBuffer`（或直接映射），postMessage
    通知 Worker 处理。
  - Worker 执行 Wasm 函数修改内存，主线程 `putImageData` 渲染结果。
  - 回答问题：
  - '- 为什么必须部署 `COOP: same-origin` 和 `COEP: require-corp` 响应头才能使用 `SharedArrayBuffer`？'
  - '- 这种方案相比 `postMessage` 传递 `ImageData`（结构化克隆）有何性能优势？'
  - '- 如果 Wasm 内存需要动态增长（`memory.grow`），共享内存场景下有什么限制？'
- 'no': 4
  title: SIMD 向量化加速矩阵乘法
  contents:
  - 编写一个 4x4 矩阵乘法：纯 JS 实现、Rust 标量实现、Rust `packed_simd` / `std::simd` 实现（启用 `target_feature
    = "simd128"`）。
  - 分别编译为 Wasm（需在 `.cargo/config.toml` 或 `RUSTFLAGS` 开启 SIMD），在支持 SIMD 的浏览器中运行基准测试。
  - 回答问题：
  - '- 如何在运行时检测浏览器是否支持 Wasm SIMD？（提示：`wasm-feature-detect`）'
  - '- SIMD 版本为何不一定总是最快？数据布局（AoS vs SoA）如何影响向量化效率？'
  - '- 如果目标环境不支持 SIMD，如何实现优雅降级（标量回退）？'
- 'no': 5
  title: 完整工程化流程：Vite + React + Rust Wasm 图像滤镜 Demo
  contents:
  - 初始化 Vite + React + TypeScript 项目，安装 `@wasm-tool/rollup-plugin-rust`。
  - 在 `src/rust` 编写高斯模糊/锐化滤镜逻辑，配置 `wasm-pack` 输出目录。
  - 编写 `useWasmFilter` Hook：动态 `import` Wasm 模块、实例化、创建 `OffscreenCanvas`、转移至 Worker。
  - Worker 中接收 `OffscreenCanvas`、调用 Wasm 处理像素、提交渲染。
  - 对比同算法的纯 JS 实现（Canvas 2D API / WebGL 着色器）在 4K 图片上的耗时、主线程阻塞时长、包体积。
  - 回答问题：
  - '- 如何在 CI/CD 中自动化 `wasm-pack build` 并发布版本化的 npm 包？'
  - '- 生产环境如何配置 Service Worker 预缓存 `.wasm` 文件实现离线可用？'
  - '- Rust `panic` 导致 Worker 崩溃时，主线程如何感知并恢复（重新启动 Worker）？'
