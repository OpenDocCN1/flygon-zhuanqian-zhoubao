paper: docs/202304/FqNZdGrjgopNjzxPbdEcltd2n0e.md
desc: 该素材详细复盘了一个90后团队创业的互联网医馆项目全生命周期，涵盖从资源整合起因、对标头部账号设定目标、市场与资源可行性分析、成本核算、风险识别（政策/技术/法律/决策）到最终项目胎死腹中的失败原因。核心揭示了年轻创业者缺乏社会性资源、决策机制低效、资金链脆弱以及赛道竞争加剧等深层痛点，作为反面教材总结了“擅长领域创业、赚资源差/信息差钱、明确时间节点规划”三大通用创业原则。
concepts:
- name: 社会性资源
  desc: 指解决医疗、教育等刚性社会民生问题所需的特定人脉、渠道或特权资源，是普通创业者（尤其是90后）普遍稀缺且难以自建的核心壁垒。
  is_original: false
  excerpt:
  - 摆在90后创业者面前一个非常严峻而尖锐的问题，就是我们普遍并不具备很强的社会性资源。
  - 何为社会性资源呢？比如小孩上个学，老人看个病，也就是诸如医疗、教育这些社会性问题，我们其实都不算说特别有强大的资源去解决。
- name: 资源整合创业模式
  desc: 年轻创业团队通过整合前辈掌握的三甲医院名医、国医大师等稀缺医疗资源，结合自身互联网运营能力，构建线上线下结合的医疗服务闭环。
  is_original: true
  excerpt:
  - 没有资源怎么办呢？当然是整合资源！
  - 这位前辈，手上又正好掌握着不少成都本地的三甲医院中医师，甚至是一些国医大师的合作资源。
  - 最终线上线下相结合，因为我们线下也有至少1个医馆的场地，并且还可以资源整合更多线下医馆。
- name: 三账号矩阵起号策略
  desc: 针对医疗赛道平台合规要求，设计公司直播号（八段锦引流）、三甲医师黄V号（垂直专业背书）、公司医师号（日常养生）三位一体的账号体系，实现公私域流量互导。
  is_original: true
  excerpt:
  - 我们的账号主要分为3个：①公司直播账号（以传统养生功法八段锦为直播展示...） ②三甲医师黄V账号（主要分享垂直相关领域的医疗问题...） ③公司自己的医师账号（主要分享日常保健类的中医养生）
  - 我们的想法，是希望在视频号上面开始直播，公域私域相互导流
- name: 轻养大健康垂直赛道
  desc: 聚焦非治疗性的养生保健细分领域（如八段锦、养生茶、专家课程），规避强监管的医疗诊疗红线，以“轻量化”产品切入大健康市场。
  is_original: true
  excerpt:
  - 医疗领域，一定不能做太泛，必须要垂直，我们的资源，可以保证我们做【轻养大健康】垂直的经营。——后期会加入妇科
  - 前台直播引流：八段锦一类的中华传统健身操，加上爆款养生茶包
- name: 睡眠私域流量激活
  desc: 利用前辈微商时代积累的沉睡私域用户池，通过视频号直播、小程序课程等新载体进行唤醒转化，实现存量资产变现。
  is_original: false
  excerpt:
  - 这位前辈...当时借着风口，也是积累了蛮多的私域流量。只是现在时代在改变，他们自己的微信商城就没有怎么更新，所以之前的用户绝大部分处于“睡眠”状态；
  - 结合之前微商城的私域分销机制，开始从第一批用户裂变团长
methods:
- name: __overview__
  desc: 项目全流程策划方法论：资源盘点与整合 -> 对标头部设定里程碑 -> 多维可行性分析（市场/自有资源） -> 成本结构测算 -> 关键风险识别与对策
    -> 商业闭环逻辑设计 -> 小步快跑试错与复盘止损。
  excerpt:
  - 大鹏和团队成员...摆在90后创业者面前...就是我们普遍并不具备很强的社会性资源...没有资源怎么办呢？当然是整合资源！
  - 找到了对标账号，我们也开始设置我们自己的项目目标——短期内，我们是希望在3-6个月起号
  - 市场可行性分析...成本分析...项目风险...结论
- name: 对标复盘法
  desc: 选取头部成熟案例（允斌顺时生活、顺时经络，年产值3亿+，团队20-30人）作为标杆，反推自身团队配置、账号矩阵、营收目标及运营节奏。
  excerpt:
  - 前面提到的这位前辈，他有一个很好的朋友，在广州孵化过2个医疗养生类的大号...基本都是团队20-30人，一年3亿以上的产值。
  - 找到了对标账号，我们也开始设置我们自己的项目目标
- name: SWOT式自有资源清单法
  desc: 将项目成功要素拆解为资质、垂直资源、运营团队、医师团队四大硬指标，逐项对照自有资源的有无、强弱及缺口（如缺乏经验操盘手），形成资源缺口清单。
  excerpt:
  - 自有资源分析：①公司必须要有医疗资质...②必须要垂直...③自媒体团队...缺乏有经验的操盘手。④医师团队...拥有至少1位常驻的三甲医院医生...
- name: 合伙制股权激励成本核算法
  desc: 前期核心团队采用合伙制而非雇佣制，通过股权分配替代现金薪资，将固定人力成本压缩至极低（2000元/月/人生活补贴)，延长现金流跑道。
  excerpt:
  - 前期团队以合伙创业为主，主要是进行了股权的设置。所以算下来，团队的几位成员，并没有日常的硬性工资成本，可以按照2000元/月/人的成本来计算。
- name: 前台引流-后台转化-私域裂变商业闭环设计法
  desc: 设计四级转化漏斗：公域直播（八段锦+茶包）引流 -> 私域小程序（专家课程）建立信任 -> 高客单价问诊套餐（599/1899/定制）变现 -> 老微商分销机制裂变团长实现增长飞轮。
  excerpt:
  - 1、前台直播引流：八段锦一类的中华传统健身操，加上爆款养生茶包；
  - 2、后台专家讲解：买了前面说的茶包朋友，还能够免费获得我们的一套课程...（这个会放在小程序私域进行直播/录播讲解，省去违禁词的担忧）
  - 3、专家讲解完，转化个人/家庭1-2年的全家不限次数免费问诊套餐...
  - 4、结合之前微商城的私域分销机制，开始从第一批用户裂变团长，源源不断产生新的个人/家庭套餐。
theorems:
- name: 创业三大核心原则
  desc: 1. 必须做自己擅长的事情（能力圈内创业）；2. 商业本质只赚两种钱：资源差的钱和信息差的钱；3. 一定要有规划并明确设定每个环节的时间节点（里程碑管理）。
  excerpt:
  - 1、我们无论是找项目还是做项目，一定要做自己擅长的事情；
  - 2、这个时代无非是赚两种钱，一种是“资源差”的钱，一种是“信息差”的钱；
  - 3、无论做什么项目，都一定要有规划，并且要明确设定每个环节的时间节点。
- name: 年轻创业者资源劣势定律
  desc: 90后等年轻创业群体普遍缺乏解决医疗、教育等核心社会性问题的‘社会性资源’，必须通过整合前辈资源或依托平台规则来弥补，否则难以在强监管赛道突围。
  excerpt:
  - 摆在90后创业者面前一个非常严峻而尖锐的问题，就是我们普遍并不具备很强的社会性资源。
  - 对于年轻创业者（我们）来说，资源调配是一个比较难解决的问题；（懂得都懂）
- name: 合伙创业单一决策者原则
  desc: 合伙创业团队必须设立唯一最高决策者且该决策者需懂业务，多头决策会导致会议低效、战略执行偏离，是团队内耗与项目失败的核心内因。
  excerpt:
  - 一个项目，一个团队，决策者真的不能太多了...最高决策者只能有1个，否则会出现比较大的问题。
  - 创业团队的决策者，一定要是懂业务的人，而不是不懂业务瞎指挥的人。
- name: 医疗赛道“轻养”合规切入论
  desc: 在强监管的医疗互联网赛道，初创团队应避开重诊疗、重资质的核心医疗环节，聚焦‘轻养大健康’（养生功法、食品、科普课程），通过私域闭环实现商业变现，规避平台违禁词与政策风险。
  excerpt:
  - 医疗领域，一定不能做太泛，必须要垂直，我们的资源，可以保证我们做【轻养大健康】垂直的经营。
  - 后台专家讲解...放在小程序私域进行直播/录播讲解，省去违禁词的担忧
findings:
- name: 项目最终失败-胎死腹中
  desc: '[evidence] 项目未能正式启动运营即终止，无任何营收与用户数据产出，验证了该策略在当时条件下的不可行性。'
  excerpt:
  - 写到这里，其实我们的项目，最终胎死腹中。
  - 那么我们愿意做那个“反面教材”。
- name: 资金链断裂是直接死因
  desc: '[evidence] 团队依靠自筹资金（勒紧裤腰带）而非融资驱动，预留30万营销费用在后疫情时代个人现金流紧缩背景下无法支撑长周期的账号打磨与冷启动期。'
  excerpt:
  - 资金问题，经历了3年YQ，大家口袋里面都有些紧了（做这个项目的时候，也并没有说等到拉到融资再启动），大家勒紧裤腰带创业，创业的成功率确实很低
- name: 年轻团队资源调配能力不足
  desc: '[evidence] 尽管整合到前辈医疗资源，但年轻团队缺乏深度调动、管理和转化这些高阶专家资源（如名医时间协调、合规把控、利益分配）的能力与话语权。'
  excerpt:
  - 任何一个大项目，都是需要有很多资源进行对接的，对于年轻创业者（我们）来说，资源调配是一个比较难解决的问题；（懂得都懂）
- name: 医疗短视频/直播赛道竞争白热化
  desc: '[evidence] 即使垂直细分赛道，头部效应显著，初创团队缺乏经验型操盘手，难以在3-6个月内打磨出有竞争力的账号，起号周期与成本远超预期。'
  excerpt:
  - 现在很多短视频、直播领域，国内其实非常卷了，哪怕看上去医疗赛道相对竞争小一些，但是要打磨一个账号出来，对于一个这个领域的初创团队来说，还是比较困难的。
  - 自媒体团队...存在一个问题，缺乏有经验的操盘手。
- name: 决策机制低效导致执行瘫痪
  desc: '[claim] 作者主张多头决策是核心内因，但素材未直接提供具体决策失误案例支撑，更多为事后归因总结。'
  excerpt:
  - 这一条想重点写一下...决策者真的不能太多了...好几个人一起拍板，那么很容易让会议效率变低
  - 创业团队的决策者，一定要是懂业务的人
