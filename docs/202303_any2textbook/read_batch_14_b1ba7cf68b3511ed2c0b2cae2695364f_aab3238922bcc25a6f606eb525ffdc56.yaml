  title: 普通人买卖旧书的赚钱机会分享——二十年淘书经验分享
  summary: 拥有二十年经验的旧书玩家杜永旺，从收书渠道、价格决定因素、搬砖策略、修复增值、资质合规等维度，系统拆解了普通人在旧书市场通过信息差获利的完整路径与实操经验。
  core_question: 普通人如何利用信息差在旧书市场进行低门槛、可持续的搬砖变现？
  key_judgment: 旧书搬砖的本质是赚信息差钱，而非赚商品钱——核心壁垒在于版本知识和对各渠道供需关系的判断，而非资金投入；同时合规门槛极低（年销售额5万以下不需要资质），适合作为副业切入。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 格式预处理
  screening_conclusion: retain
  reason: 内容极其详实，覆盖从收书到卖书的完整链路，既有战略认知（地域搬砖、平台搬砖、修复增值三大利润来源），又有战术细节（孔网拍卖捡漏、多抓鱼价差陷阱等），是本批素材中稀缺的"二十年功力"型干货，具备出书级别的深度。
