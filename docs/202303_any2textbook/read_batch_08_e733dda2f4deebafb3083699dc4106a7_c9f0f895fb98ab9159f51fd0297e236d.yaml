- file_path: docs/202303/20230328_098.md
  title: 《分享一天内利用小报童设计出一款付费产品的经历》
  summary: 作者分享了从发现'小报童'这个工具，到当天确定产品定位并设计出框架，再到上线推广、设置分销，最终成功售出80单（约1.5万元）的完整实操经历。
  core_question: 如何快速利用'小报童'这一新兴内容付费工具，从零开始设计并上线一款付费产品？
  key_judgment: 成功秘诀在于三点：对市场新工具的极度敏感和快速行动；产品定位基于自身最擅长的内容（公司现有知识库），而非凭空创造；利用'低客单价+静默交易'的特性，将其作为引流品，而非主要盈利来源。
  depth: medium
  suggested_destination: case
  possible_shape: course
  risks:
  - 时效性
  - 口语化
  screening_conclusion: retain
  reason: 提供了一个完整的、可验证的过程复盘，从发现、决策、定位到执行、推广的链路清晰，对利用新兴工具开发产品有较强参考价值。核心在于方法论（敏感、定位、执行）而非具体工具，时效性风险可控，适合作为案例或课程单元素材。
- file_path: docs/202303/20230328_101.md
  title: 《单枪匹马做躺着赚钱项目掘金的随笔》
  summary: 作者以随笔的形式，分享了作为个体站长多年做'躺赚'项目的经验，包括具体项目列举、将项目做成'躺赚'模式的方法论，以及对躺赚项目本质和寻找方法的思考。
  core_question: 个体从业者如何选择和打造能长期产生被动收入的'躺赚'项目？其核心逻辑和风险是什么？
  key_judgment: '''躺赚''并非不劳而获，而是将某个项目模式化、自动化后的结果。其核心逻辑在于简化流程（流量-成交）、量化操作（多站点矩阵）并利用边际成本低的优势；其本质是基于多年技术和资源积累的变现，具有很强的时效性，且需要持续维护，单一躺赚项目收益有限。'
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 口语化
  screening_conclusion: retain
  reason: 内容信息密度高，既有具体的项目案例列举，又有抽象的方法论（总纲、流程简化、信任建立、本质思考），并对'躺赚'有清醒的认知（回报率、时效性）。作者实战经验丰富，观点务实、接地气且不装，深度较高，具备成为方法论章节或工具包章节的潜力。
- file_path: docs/202303/20230328_103.md
  title: 《如何在领英开发客户？》
  summary: 作者分享了自己利用领英开发外贸客户的经验，核心是通过矩阵化的账号人设（设计师、验货员、业务、老板）发布差异化内容，以'真实+专业'吸引客户主动上门，并利用平台社交功能（如共同好友推荐）进行信任背书和破冰。
  core_question: 面向B2B外贸领域，如何通过运营领英实现从被动寻找客户到主动吸引客户的转变？
  key_judgment: 传统在领英上找邮箱、当'备胎'的效率极低。更高级的玩法是将领英视为一个个人/企业IP内容平台，通过矩阵账号从不同角度展示公司的设计、品质、产品和商业认知，建立'专业+真实'的形象，让客户主动上门。其核心是利用自媒体营销思维解决外贸获客难题，并善用平台的社交关系链进行背书。
  depth: medium
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 平台限制
  screening_conclusion: retain
  reason: 提供了针对特定平台（领英）的非常具体、可操作的策略，包括账号架构、内容定位、破冰方法等，实战性很强。虽然具体平台操作有很强时效性，但其'用内容吸引客户替代主动推销'、'矩阵人设'等核心思维具有普适性，可作为海外获客或内容营销章节的案例参考。
