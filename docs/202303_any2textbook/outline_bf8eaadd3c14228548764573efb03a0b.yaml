- 'no': 1
  name: 免费咨询的应对之道 —— 从“防白嫖”到“筛选客户”
  desc: 本章从一个看似棘手的人际问题出发——如何应对没完没了的免费咨询。我们将看到，这不是一个关于“拒绝”或“防卫”的课题，而是一套关于“筛选”、“定价”和“边界”的思维模型。你会掌握一套从理念到实操的完整方法。
  nodes:
  - 'no': 1
    name: 问题重构：这不是“防白嫖”，而是“客户筛选”
    desc: 核心认知转变：将免费咨询的困扰，从消极地防止被占便宜，重构为主动设计机制来筛选有价值的客户与问题。这是整套方法论的出发点。
    role: motivation
    src:
    - paper: 038_如何有礼貌的收钱
  - 'no': 2
    name: 三条“第一原理”：价值、成本与匹配
    desc: 奠定整个应对策略的理论基石。1. 付费即价值判据（Skin in the Game）：真问题与真价值必须通过“对方愿付出代价”来验证。2. 免费服务成本最小化原则：应对免费咨询时，只提供边际成本为零的预制资源。3.
      求助与帮助的匹配性：帮助前必须确认自己能解决。
    role: definition
    src:
    - paper: 038_如何有礼貌的收钱
  - 'no': 3
    name: 五步筛选漏斗：从提问到付费的标准化流程
    desc: 将筛选理念落地为具体操作流程：问题澄清 → 快速评估 → 提供免费资源 → 引导付费咨询 → 探讨预算需求。每一步都是对“代价”与“匹配性”的检验。
    role: method
    src:
    - paper: 038_如何有礼貌的收钱
  - 'no': 4
    name: 五信号识别法：快速判断“真心求助者”
    desc: 提供一套快速评估工具，通过五个关键信号（针对性、态度、认知度、主动性、紧迫性）来识别对方是否为值得投入的真问题，避免陷入低质量沟通。
    role: method
    src:
    - paper: 038_如何有礼貌的收钱
  - 'no': 5
    name: 从“给答案”到“给产品”：应对免费提问的资源库策略
    desc: 阐述如何运营“边际成本为零的产品”（如攻略文档）作为缓冲层，既能维持善意，又能避免手把手指导的时间黑洞，并为后续商业转化埋下伏笔。
    role: method
    src:
    - paper: 038_如何有礼貌的收钱
  - 'no': 6
    name: 案例拆解：如何“有礼貌地收钱”
    desc: 整合运用前序方法。通过提问式引导、主动价值挖掘、强调投资回报（代价意识引导法）以及展示专业背景、成功案例（付费意愿增强法），实现从免费到付费的自然过渡。
    role: experiment
    src:
    - paper: 038_如何有礼貌的收钱
  - 'no': 7
    name: 心法总结：礼貌=流程与立场+课题分离
    desc: 将技巧提炼为态度。真正的礼貌是尊重对方求助的权利，同时坚守自己的流程与立场（课题分离）。将每次沟通视为匹配尝试（像开门做生意允许别人看菜单），而非一场防卫战。此为该策略可持续运用的心理基础。
    role: extension
    src:
    - paper: 038_如何有礼貌的收钱
