- 'no': 1
  name: 小红书赚钱项目挖掘 —— 把“评论区需求”变成“选品指南针”
  desc: 本章从“选择权回归定理”出发，带你理解如何在小红书这个内容生态中，通过系统化方法从评论区需求出发挖掘可变现的赚钱项目。核心不是被动等别人告诉你做什么，而是主动掌握一套可复用的挖掘方法论。
  nodes:
  - 'no': 1
    name: 为什么需要主动挖掘项目——选择权回归定理
    desc: 用“被没收的选票”类比理解：当别人直接告诉你什么赚钱时，你只是执行者而非决策者；唯有自己掌握挖掘方法，才能把选择权拿回自己手里。
    role: motivation
    src:
    - paper: 151_小红书挖掘项目
  - 'no': 2
    name: 小红书赚钱项目的分类体系——从产品到服务的二维框架
    desc: 给项目分类装上“骨架”：产品类（实体/虚拟）与服务类（线上/线下）两大类四小项，四条赛道对应着四类需求入口，为后续检索提供清晰的导航图。
    role: definition
    src:
    - paper: 151_小红书挖掘项目
  - 'no': 3
    name: 需求词库构建法——从评论区高频留言提取“用户心声”
    desc: 评论区的【求图】【跟团】【怎么领】不是闲聊，而是未被满足需求的公开告白。把高频需求词收集成库，作为反向检索商机笔记的搜索词。
    role: method
    src:
    - paper: 151_小红书挖掘项目
  - 'no': 4
    name: 追溯笔记挖掘法——用需求词逆向找爆款商机笔记
    desc: 需求词是“地图”，笔记是“金矿”。通过千瓜按评论搜索快速锁定相关笔记，再对笔记标题做批量分析，从内容形式与账号属性中识别赛道规律。
    role: method
    src:
    - paper: 151_小红书挖掘项目
  - 'no': 5
    name: 标题批量分析法的实证——图文与达人号为何占据主导
    desc: 用数据说话：从1000条笔记清洗去重得到636条有效样本，其中图文笔记占78%，达人账号贡献69%。这一分布揭示了小红书的变现主力形态。
    role: experiment
    src:
    - paper: 151_小红书挖掘项目
  - 'no': 6
    name: 品类拓展法——一条赛道如何长出更多分叉
    desc: 别只停留在一条笔记上：直接拓展是拿赛道标题投喂ChatGPT生成更多idea；间接拓展是从导航网站证书列表反推可切入的细分品类。
    role: extension
    src:
    - paper: 151_小红书挖掘项目
  - 'no': 7
    name: 异常值挖掘法——盯住数据异常账号找出非常规玩法
    desc: 当一个大粉账号在其主页做资料引流时，它就是一个“异常值”。进主页翻到底，研究它的运营与变现逻辑，往往能发现主流之外的隐藏赛道。
    role: method
    src:
    - paper: 151_小红书挖掘项目
  - 'no': 8
    name: 产品词库四维评估法——用【产品/变现/思路/收益】给项目验明正身
    desc: 挖掘出的项目不能只看表面，需要从产品服务、变现模式、赚钱思路、收益评估四个维度做系统化审核，形成可落地的词库档案。
    role: method
    src:
    - paper: 151_小红书挖掘项目
  - 'no': 9
    name: 四类项目的真实收益画像——花植艺卖到公益赠书的多赛道验证
    desc: 四个活案例贯穿全框架：实体产品（花植艺卖3w）、虚拟产品（壁纸无本万利）、线上服务（公益赠书分佣）、线下服务（交友活动单次一两千），验证挖掘方法的实战价值。
    role: experiment
    src:
    - paper: 151_小红书挖掘项目
  - 'no': 10
    name: 方法论边界与扩展——从小红书到多平台挖掘框架
    desc: 需清醒认知：该方法依赖平台评论活跃度与数据工具可用性，单平台样本有偏差；但需求词库→逆向检索→四维评估的链路可迁移至其他内容平台。
    role: limitation
    src:
    - paper: 151_小红书挖掘项目
