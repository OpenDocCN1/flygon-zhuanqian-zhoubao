- 'no': 1
  name: 私域产品方法论 —— 从“流量思维”到“信任资产”
  desc: 本章以同城相亲行业为例，揭示如何在无实体交付的领域，以“信任”为核心构建私域产品体系，从精准流量获取到轻资产运营的全链路方法论。
  nodes:
  - 'no': 1
    name: 私域产品的本质
    desc: 用“自建鱼塘”类比理解：不依赖公域平台分配，直接与用户建立信任关系，实现高毛利高复购。
    role: definition
    src:
    - paper: 155_同城相亲
  - 'no': 2
    name: 为什么信任是唯一交付物
    desc: 以相亲为例，无实体产品的行业，一切商业行为围绕解决“信任”问题展开，信任即产品。
    role: motivation
    src:
    - paper: 155_同城相亲
  - 'no': 3
    name: 四类内容账号矩阵
    desc: 图文资料卡、现场拍摄、街头采访、口播四类账号分工协作，分别承担信任背书与获客引流。
    role: method
    src:
    - paper: 155_同城相亲
  - 'no': 4
    name: 三级阶梯产品体系
    desc: 从低客单活动到高客单一对一，以阶梯式产品设计逐步加深信任，实现转化。
    role: method
    src:
    - paper: 155_同城相亲
  - 'no': 5
    name: 精准流量优于泛流量
    desc: 100个精准胜过1000泛流量：粉丝不过万却积累万余客户，印证精准内容的高转化率。
    role: experiment
    src:
    - paper: 155_同城相亲
  - 'no': 6
    name: 付费投流的性价比逻辑
    desc: 高毛利支撑下，同城付费投放即便百元加微仍不亏损，展示付费与自然流配合策略。
    role: method
    src:
    - paper: 155_同城相亲
  - 'no': 7
    name: 轻资产小而美的团队模型
    desc: 从20+人精简至5人，以高情商人才与流程化服务替代人力堆砌，低成本可持续。
    role: limitation
    src:
    - paper: 155_同城相亲
  - 'no': 8
    name: 长期主义与信任壁垒
    desc: 行业生命力在于长期信任积累与售后保障，而非短期规模或逼单，这是最深护城河。
    role: extension
    src:
    - paper: 155_同城相亲
  - 'no': 9
    name: 流量平台性别绑定定律
    desc: 平台受众性别构成与业务匹配度直接相关：小红书微博偏女性、抖音快手偏男性，选对渠道事半功倍。
    role: proof
    src:
    - paper: 155_同城相亲
- 'no': 2
  name: 高客单知识付费 —— 从“卖课”到“交付改变”
  desc: 本章以家庭教育赛道为例，系统性拆解高客单价产品的定位、分层、产品化与信任构建，揭示知识IP从“传递信息”到“促成改变”的升级路径。
  nodes:
  - 'no': 1
    name: 三圈交集定位法
    desc: 用“定位罗盘”类比理解：热爱、优势、市场需求三圈交集处即最优创业赛道，避免盲目入场。
    role: motivation
    src:
    - paper: 161_家庭教育
  - 'no': 2
    name: 家长付费能力三层分级
    desc: 按付费意愿将客户分为自助解决型、价格敏感型、高认知深度型，不同层级对应不同产品策略。
    role: method
    src:
    - paper: 161_家庭教育
  - 'no': 3
    name: 产品供应链能力
    desc: 持续迭代产品并解决实际问题的综合能力，是低门槛与高客单之间的分水岭。
    role: definition
    src:
    - paper: 161_家庭教育
  - 'no': 4
    name: 从知道到做到
    desc: 知识IP的本质是帮助客户完成认知到行为的转化，而非单纯的信息传递。
    role: extension
    src:
    - paper: 161_家庭教育
  - 'no': 5
    name: 优势梳理三步法
    desc: 盖洛普测试、成就事件回忆、优势观察日记三步将抽象优势具体化为可营销卖点。
    role: method
    src:
    - paper: 161_家庭教育
  - 'no': 6
    name: 六步沟通主线
    desc: 从归因梳理到痛点强化再到植入学习认知，免费咨询转化为付费的完整话术框架。
    role: method
    src:
    - paper: 161_家庭教育
  - 'no': 7
    name: 价格筛选器定理
    desc: 高客单价本身就是有效筛选机制：价格筛掉无效客户，留住高认知或痛点强烈的优质客户。
    role: proof
    src:
    - paper: 161_家庭教育
  - 'no': 8
    name: 私域小规模高转化实证
    desc: 2000+私域用户实现25万营收的案例，证明高客单赛道不需大规模流量。
    role: experiment
    src:
    - paper: 161_家庭教育
  - 'no': 9
    name: 高客单完整服务定理
    desc: 高客单成立关键在于完整服务闭环而非价格本身，持续解决客户真实问题是核心。
    role: limitation
    src:
    - paper: 161_家庭教育
  - 'no': 10
    name: 朋友圈专栏思维
    desc: 将朋友圈按“晒案例、建信任、链感情、专栏化”四类内容结构化运营，长期塑造专业形象。
    role: extension
    src:
    - paper: 161_家庭教育
- 'no': 3
  name: 信息差套利 —— 旧书搬砖的“低门槛”生意经
  desc: 本章以旧书买卖为例，剖析赚“信息差”而非“商品差”的商业本质，详解版本知识壁垒、定价规律与跨地域/平台/修复的套利实操。
  nodes:
  - 'no': 1
    name: 信息差本质论
    desc: 旧书搬砖赚的是认知差而非商品差，通过识别他人不了解的版本价值获利。
    role: definition
    src:
    - paper: 169_旧书搬砖
  - 'no': 2
    name: 版本知识是核心壁垒
    desc: 判断版本、印数、品相、稀缺性、附加值的能力构成行业护城河，而非资金。
    role: motivation
    src:
    - paper: 169_旧书搬砖
  - 'no': 3
    name: 旧书定价多维决定论
    desc: 价格由版本印数、品相、稀缺性、附加值四维共同决定，全品相价值为普通品相的数倍。
    role: method
    src:
    - paper: 169_旧书搬砖
  - 'no': 4
    name: 多渠道收书策略
    desc: 上门回收靠版本知识、书摊早起碰运气、废品站斗智斗勇、出版社库存慧眼识珠，各有门道。
    role: method
    src:
    - paper: 169_旧书搬砖
  - 'no': 5
    name: 地域搬砖
    desc: 利用港台、日本、欧美与内地之间的价格差异赚取差价，跨市场信息不对称即利润。
    role: extension
    src:
    - paper: 169_旧书搬砖
  - 'no': 6
    name: 平台搬砖
    desc: 在孔网、中图网、闲鱼、微店、多抓鱼等平台之间低买高卖，红楼梦毛边本加价秒出验证可行性。
    role: experiment
    src:
    - paper: 169_旧书搬砖
  - 'no': 7
    name: 修复再出售
    desc: 对品相一般的90年代2000年左右的书适度修复后转卖提升售价，低投入高回报。
    role: extension
    src:
    - paper: 169_旧书搬砖
  - 'no': 8
    name: 低门槛准入
    desc: 年销售额5万以下无需资质且多平台可卖，普通人几乎零门槛入场。
    role: motivation
    src:
    - paper: 169_旧书搬砖
