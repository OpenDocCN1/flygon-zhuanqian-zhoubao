- file_path: docs/202303/20230328_111.md
  title: 如何成功举办小型的同城聚会？一个精细的 SOP 流程就可以
  summary: 作者东山老师基于自身丰富的组局经验，将一场成功的同城小型聚会拆解为“精准邀约、场地布置、过程控制、流程设计、善后”五个部分，并提供了极为详细的操作细节和技巧。
  core_question: 如何通过一套精细的、可复用的SOP流程来成功举办一场小型同城聚会或会议？
  key_judgment: 一场成功的线下聚会成功的关键在于细节的精细化控制，从邀约时的付费筛选、过程控场时的收手机和沙漏计时、到善后的转化设计，每一个环节的细节都直接影响参与者的体验和活动目标的达成。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 口语化风格较重
  - 部分方法（如收手机、付费筛选）不一定适用于所有场景
  screening_conclusion: retain
  reason: 内容极其详实，提供了一个高完整度、高可操作性的SOP，覆盖了从筹备到善后的全过程，不仅有具体方法还有背后的理念，非常适合作为成书的一个核心章节。
- file_path: docs/202303/20230328_113.md
  title: 过去的一年虽然没 gap，却也是实打实的 self-caring year
  summary: 作者杨昌参照张潇雨老师提出的框架，回顾了自己过去一年在技能学习、议题研究、作品创作、身心体检和关系梳理等五个维度的自我关怀和成长。
  core_question: 在没有停下工作的情况下，如何度过一个充实且有意义的“自我关怀之年”？
  key_judgment: 自我关怀不是简单的休息，而是有目的地进行“自我建设”：学习一项可终身受益的基础技能、深入研究感兴趣的重要议题，并将其转化为“作品”，同时关注心理和人际关系的健康。
  depth: medium
  suggested_destination: appendix
  possible_shape: booklet
  risks:
  - 内容偏个人化
  - 叙事性强而方法论属性弱
  screening_conclusion: demote
  reason: 虽为个人年度总结，但提供了一个很好的自我成长框架，对读者有参考价值。但内容深度和普适性有限，不足以支撑核心章节，更适合作为附录或阅读材料。
- file_path: docs/202303/20230328_114.md
  title: 体制内从 0-1 突破舒适圈，副业年赚 20W+ 的心得
  summary: 作者爱折腾的土豆妈以体制内幼教身份，分享了如何通过接纳本职工作限制、设定底线、挖掘兴趣、行动试错等方式，开拓出一条副业赚钱（海淘、民宿、社群、咨询）路径的实践心得。
  core_question: 在体制内工作限制下，普通人如何突破舒适圈，从0到1开启并稳定副业？
  key_judgment: 体制内做副业的关键在于“自洽”：接纳本职工作限制并设定清晰的底线（不利用公职资源），从而卸下心理包袱；同时从生活兴趣入手，利用下班后的8小时，先行动跑通0-1，再逐步升级。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性（部分项目如民宿受当时环境影响）
  - 标题与内容调性不符（内容并非教赚钱，而是讲心态）
  screening_conclusion: retain
  reason: 针对“体制内搞副业”这一特定人群的典型困境，提供了从心态调整到具体实践的全方位思路，真实且启发人心，具有成为独立章节的潜力。
- file_path: docs/202303/20230328_115.md
