- file_path: docs/202303/20230328_107.md
  title: 航海复盘：利用剪映+达芬奇+影刀 RPA 提高混剪效率
  summary: 作者德新回顾了自己在视频号短视频带货航海中从直接搬运视频屡次受限，到探索用剪映、达芬奇和影刀RPA实现混剪提效的全过程，最终形成了一套可稳定产出视频的自动化工作流。
  core_question: 如何利用剪映、达芬奇和影刀RPA等工具组合，构建一套高效的短视频混剪自动化流程？
  key_judgment: 混剪效率提升的核心在于将流程拆解为“备料”和“炒菜”两步：先利用达芬奇场景剪切、剪映字幕提取、RPA自动化进行素材预处理（备料），再通过预设模板和随机重命名实现快速组合（炒菜），从而在保证内容原创度的同时大幅提升产能。
  depth: high
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 口语化
  - 依赖特定工具（影刀RPA）和版本，可能随时间失效
  screening_conclusion: retain
  reason: 该文是一线操盘手的实战复盘，从痛点出发描述了一套完整、可复用的自动化解决方案，细节丰富（文件夹设计、RPA流程逻辑等），对工具组合创新应用具有很高的参考价值。
- file_path: docs/202303/20230328_108.md
