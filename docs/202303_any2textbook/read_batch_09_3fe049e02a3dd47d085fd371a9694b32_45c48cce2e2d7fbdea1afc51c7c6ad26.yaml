- file_path: docs/202303/20230328_119.md
  title: Python 小白如何调教 ChatGPT 写爬虫
  summary: 作者青澈君以一个Python小白视角，复盘了如何通过不断“调教”ChatGPT，让其帮助自己成功编写爬虫代码，并顺带解决合并Excel文件问题的过程。
  core_question: 编程基础薄弱的人，如何通过结构化提问，引导ChatGPT完成爬虫等编程任务？
  key_judgment: 让AI写代码成功的关键不在于编程能力，而在于与AI协作的能力：清晰拆解需求、将大问题分解为小步骤、在对话中逐步完善Prompt，并具备一定的调试和纠错能力。
