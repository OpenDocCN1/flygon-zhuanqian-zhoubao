paper: 20230328_038_如何有礼貌的收钱
desc: 该素材以自媒体+创业者徐宿的视角，直面"隔三差五有人免费咨询"这一职业困扰，提出核心主张：问题本质不是"如何防止白嫖"，而是"如何有效设计客户筛选机制"。素材从三条第一原理（对方付出代价、我方低成本、求助匹配性）出发，构建了五步筛选方案，并给出三个关键判断信号与保持礼貌的心法，最终以"礼貌=流程与立场+课题分离"作结。
concepts:
- name: 客户筛选机制
  desc: 将人际求助关系视为一种市场匹配过程，通过主动设计规则（而非被动拒斥白嫖）来筛选真正有价值的客户与问题。
  is_original: true
  excerpt:
  - 本质上我们面对的不是「如何防止白嫖」，而是「如何有效设计客户筛选机制」。
- name: 第一原理：Skin in the Game（绑定结果）
  desc: 判断产品价值应看是否有人付费，判断真问题应看对方是否愿意付出代价——用"付出代价"作为需求真实性的试金石。
  is_original: true
  excerpt:
  - 第一条第一原理：对方要付出代价（Skin in the Game绑定结果）：要判断产品价值就看是否有人付费；一个人的真问题看他是否愿意付出代价。
- name: 边际成本为零的产品
  desc: 以预制的攻略文档类产品应对免费咨询，实现我方付出尽可能少的成本。
  is_original: true
  excerpt:
  - 第二条第一原理：我们要付出尽可能少的成本：用边际成本为零的产品（攻略文档）应对免费问题，不要手把手教。
- name: 求助与帮助的匹配性
  desc: 帮助前需确认自己确实能解决，否则坦诚让开，避免营造"无所不能"的错觉。
  is_original: true
  excerpt:
  - 第三条第一原理：求助和帮助必须有匹配性：确定自己能解决，否则坦诚让开，不要让人觉得你无所不能。
- name: 课题分离（礼貌心法）
  desc: 将"对方是否尊重我的流程"与"对方是否有真实需求"分开处理，以流程和立场为界，礼貌即框架。
  is_original: true
  excerpt:
  - 礼貌是展示胸有成竹；动怒说明事先准备不足；把每次沟通看成匹配过程（像开门做生意允许别人看菜单）；态度就是框架，学会课题分离。
  - 礼貌=我尊重你表达和寻求帮助的权利，但同时我有我的流程和立场；如果你尊重且恰好有需求，那就共同完成一段生命体验，缘分没到先擦肩而过。
methods:
- name: __overview__
  desc: 整体筛选思维：以三条第一原理为原则边界，辅以五步流程与三个关键判断信号，将"被动应对免费咨询"重构为"主动设计客户筛选漏斗"。
  excerpt:
  - 三条第一原理（原则与边界）：1、对方要付出代价；2、我们要付出尽可能少的成本；3、求助和帮助必须有匹配性。
  - 具体筛选方案（5步）：问题澄清→快速评估→提供免费资源→引导付费咨询→探讨预算和需求。
- name: 五步筛选方案
  desc: 标准化漏斗：依次澄清问题真实边界、快速评估我方胜任度、给出免费攻略文档、引导进入付费咨询、最后探讨预算与需求深度。
  excerpt:
  - 问题澄清→快速评估→提供免费资源→引导付费咨询→探讨预算和需求。
- name: 三判信号法（真心求助识别）
  desc: 通过五个观察信号（针对性、态度、认知度、主动性、紧迫性）快速判定对方是否真心求助。
  excerpt:
  - 判断对方是否真心求助（5个信号）：针对性/态度/认知度/主动性/紧迫性。
- name: 代价意识引导法
  desc: 通过提问式引导、主动价值挖掘、强调投资回报，让对方意识到问题严重且需付出代价。
  excerpt:
  - 让对方意识到问题严重需要付出代价（提问式引导/主动价值挖掘/强调投资回报）。
- name: 付费意愿增强法
  desc: 通过展示专业背景、成功案例与顾客评价，降低对方对付费咨询的犹豫、提升意愿。
  excerpt:
  - 让对方更愿意付费咨询（展示专业背景/成功案例/顾客评价）。
theorems:
- name: 付费即价值判据
  desc: 产品的真实价值只能通过付费行为来验证；真问题必然伴随代价意愿。
  excerpt:
  - 要判断产品价值就看是否有人付费；一个人的真问题看他是否愿意付出代价。
- name: 免费服务成本最小化原则
  desc: 应对免费咨询，只提供边际成本为零的预制资源，避免"手把手教"导致的时间黑洞。
  excerpt:
  - 用边际成本为零的产品（攻略文档）应对免费问题，不要手把手教。
- name: 礼貌=流程与立场
  desc: 真正的礼貌是尊重求助权利但同时坚守自己的流程与立场，而非无原则迁就；动怒源于准备不足。
  excerpt:
  - 礼貌是展示胸有成竹；动怒说明事先准备不足；把每次沟通看成匹配过程（像开门做生意允许别人看菜单）；态度就是框架，学会课题分离。
  - 礼貌=我尊重你表达和寻求帮助的权利，但同时我有我的流程和立场；如果你尊重且恰好有需求，那就共同完成一段生命体验，缘分没到先擦肩而过。
- name: 匹配而非对抗（商业心法）
  desc: 把每次免费咨询的应对视为一次匹配尝试，而非防卫战；允许对方"看菜单"后再决定是否合作。
  excerpt:
  - 把每次沟通看成匹配过程（像开门做生意允许别人看菜单）。
findings:
- name: 发现：核心问题重构
  desc: '[claim] 原文宣称：困扰的本质不是"防止白嫖"，而是"设计客户筛选机制"——将情感问题转化为机制设计问题。'
  excerpt:
  - 本质上我们面对的不是「如何防止白嫖」，而是「如何有效设计客户筛选机制」。
- name: 发现：五信号实证（待数据验证）
  desc: '[claim] 素材宣称可用5个信号快速识别真心求助者，但未提供对照实验或统计数据支撑该判定准确率。'
  excerpt:
  - 判断对方是否真心求助（5个信号）：针对性/态度/认知度/主动性/紧迫性。
- name: 发现：筛选步骤的漏斗效应（待数据验证）
  desc: '[claim] 素材按"问题澄清→评估→免费资源→付费→预算"的顺序设计，宣称可产生漏斗效应让付费咨询自然浮现，但未举证转化率数据。'
  excerpt:
  - 具体筛选方案（5步）：问题澄清→快速评估→提供免费资源→引导付费咨询→探讨预算和需求。
- name: 发现：礼貌的心法关联（待数据验证）
  desc: '[claim] 素材宣称"动怒说明事先准备不足"，将准备度与情绪管理直接挂钩，同样缺乏实证支撑，属于经验断言。'
  excerpt:
  - 礼貌是展示胸有成竹；动怒说明事先准备不足。
