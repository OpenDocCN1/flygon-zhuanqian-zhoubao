- 'no': 1
  name: 爆款起号 —— 用执行力对抗天赋论
  desc: 本章从视频号起号实战案例出发，拆解'跟进爆款'这一核心认知：如何通过日更复利、多平台分发和热点追踪，在6个月内实现0到7.5万粉丝的增长，并理解爆款驱动增粉的幂律分布本质。
  nodes:
  - 'no': 1
    name: 流量非天赋论：为什么'抄'比'创'更重要
    desc: 引入核心认知：视频号起号的胜负手是跟进爆款的执行力与复制思路，而非内容天赋。通过'拼执行力不拼天赋'的论断，建立全书的基本价值取向。
    role: motivation
    src:
    - paper: 056_视频号起号
  - 'no': 2
    name: 爆款驱动增粉模型：二八定律下的增长真相
    desc: 定义增长的基本模型：极少数爆款贡献绝大多数粉丝，大量普通视频贡献极少。通过'3个爆款=7万粉，200+视频=5000粉'的实证，揭示粉丝增长的幂律分布结构。
    role: definition
    src:
    - paper: 056_视频号起号
  - 'no': 3
    name: 热点内容跟进法：如何撬动搜索流量杠杆
    desc: 介绍追热点的具体操作方法：主动追踪并模仿热点爆款内容，以快速获取流量与粉丝。通过'975万播放/14天增粉5万'的案例，展示该方法的高效性。
    role: method
    src:
    - paper: 056_视频号起号
  - 'no': 4
    name: 文案来源组合法：建立持续产出的素材库
    desc: 展示解决'每天发什么'的方法：从圈内分享、平台高赞金句、100+对标账号库、随手刷到的爆款中获取文案。强调这是可复制的执行流程而非灵感依赖。
    role: method
    src:
    - paper: 056_视频号起号
  - 'no': 5
    name: 多平台分发抢流量：一鱼多吃的放大策略
    desc: 扩展核心方法：将同一视频分发至多平台测试流量和扩大收入。通过'百家号2万现金、视频号2000佣金'的收益实证，论证多平台分发在验证能力与增强信心方面的双重价值。
    role: extension
    src:
    - paper: 056_视频号起号
  - 'no': 6
    name: 日更复利论：从'做不到日更'到'脱颖而出'
    desc: 通过'6个月288个视频（日更1.6个）'的实证数据，论证持续日更是积累流量与建立竞争力的前提，破除'需要天赋才能坚持'的迷思，并反思该策略在粉丝粘性与内容深度上的潜在局限。
    role: limitation
    src:
    - paper: 056_视频号起号
- 'no': 2
  name: 竞价投放 —— 从'花钱买客户'到'搜索流量变现'
  desc: 本章以百度竞价冷门项目为引，系统讲解付费搜索广告的完整方法论：从'人找货vs货找人'的精准度对比，到选品三法、产品三验证、投放分层控制与私域承接页面，最后论证'同行持续投放必然盈利'的商业定理。
  nodes:
  - 'no': 1
    name: 人找货vs货找人：为什么搜索广告更精准
    desc: 引入核心认知：搜索广告（用户主动搜索）比信息流广告（平台推荐）购买意图更精准。通过对比两种广告模式的底层逻辑，建立对搜索流量价值的直观理解。
    role: motivation
    src:
    - paper: 172_百度竞价
  - 'no': 2
    name: 百度竞价冷门项目：花钱买客户的商业模型
    desc: 定义核心商业模式：以百度搜索广告为核心渠道，选择冷门、价格不透明、高利润产品，通过付费购买精准客户并在私域变现、利润复投广告。给出'年净利润30W+'的可行性实证。
    role: definition
    src:
    - paper: 172_百度竞价
  - 'no': 3
    name: 选品三方法：如何发现冷门高利润产品
    desc: 教授选品的落地方案：通过淘宝搜索关键词、商家店铺、5118长尾词三类渠道发现冷门高利润产品。强调'选品重于投放'这一优先级定理，并列举虚拟资料、滋补品、玉石、檀香等已验证品类。
    role: method
    src:
    - paper: 172_百度竞价
  - 'no': 4
    name: 产品三验证法：交叉确认项目盈利性
    desc: 介绍验证产品可行性的方法：通过淘宝购买人数、百度长期投放、关键词搜索量三个维度交叉验证。重点讲解'同行持续投放必然盈利定理'：有同行长期投放就不可能不赚钱。
    role: proof
    src:
    - paper: 172_百度竞价
  - 'no': 5
    name: 投放控制与分层策略：从开户到否词的精细运营
    desc: 详解投放操作细节：开户先关扩大流量功能、设预算防跑飞；按'计划-单元-创意-关键词'分层管理；强调否词的关键作用和创意多写的必要性，展示从粗放到精细的投放控制流。
    role: method
    src:
    - paper: 172_百度竞价
  - 'no': 6
    name: 私域承接页面法：从搜索点击到成交转化
    desc: 讲解流量落地的承接策略：低价单页直接成交，高客单搭建包含'人物/故事/简介/恐慌/干货/客户反馈/实景/加微信领优惠'的完整落地页，实现从公域到私域的流量闭环。
    role: method
    src:
    - paper: 172_百度竞价
  - 'no': 7
    name: 投放思维普适定理：当'花钱买客户'迁移到生活
    desc: 扩展核心定理的应用边界：论证投放思维（敢于花钱、精准投入）可迁移到生活场景，如送花、买课程、加星球等，揭示这一商业方法论的底层通用性。同时指出平台算法不完全可控的局限。
    role: extension
    src:
    - paper: 172_百度竞价
  - 'no': 8
    name: 平台模型可复用性：从百度到抖音与小红书的迁移
    desc: 验证方法论的跨平台通用性：指出百度竞价的投放逻辑（选品、验证、分层、落地页）在抖音巨量、小红书聚光等平台上本质相同、可完全复用，并反思迁移过程中平台特性的适配问题。
    role: limitation
    src:
    - paper: 172_百度竞价
