learning_targets:
- 理解商业设计思维的核心命题：业务盈利性在第一天就已注定
- 掌握商业设计决定论的形式化表述与可检验性
- 熟练运用业务本质三形态模型判断业务原型
- 学会应用四维聚焦法则进行战略取舍
- 掌握业务目标六遍法的操作流程与多视角审视方法
- 理解用户行为洞察法为何优于口头调研
- 掌握定价权分野定律并据此选择业务模式
- 识别创始人认知瓶颈对业务天花板的影响
- 理解迁移能力优先律与学习能力的递进关系
- 能运用人才三层视角筛选参与者型人才
concept_map:
- 商业设计思维
- ├── 基础命题
- │   ├── 商业设计决定论 —— 盈利从第一天确定 —— 004
- │   ├── 创始人认知瓶颈 —— 业务最大天花板 —— 004
- │   └── 知识体系五层次 —— 收集/利他/关键词/场景/迁移 —— 004
- ├── 业务判断框架
- │   ├── 三形态模型（改造/替代/创造） —— 004
- │   ├── 金字塔两端理论（培优/补差，避开中间） —— 004
- │   └── 定价权分野 —— 标品无/非标品有 —— 004
- ├── 经营策略方法
- │   ├── 四维聚焦法则（广度/深度/高度/速度） —— 004
- │   ├── 业务目标六遍法（重复推敲六遍） —— 004
- │   ├── 用户行为洞察法（信腿不信嘴） —— 004
- │   └── 标准化输出法（标准化才能规模化） —— 004
- └── 人才与成长
- '    ├── 人才三层视角（使用者/探索者/造物者） —— 004'
- '    ├── 参与者原则（招聘参与者） —— 004'
- '    ├── 迁移能力优先律（大于学习能力） —— 004'
- '    └── 碎片化 vs 结构化知识（广度 vs 深度） —— 004'
life_analogy:
- 想象创业就像**请人盖一栋房子**：
- '- **商业设计思维** = 建筑蓝图，图纸画得不好，后面装修再努力也救不回来'
- '- **商业设计决定论** = 地基浇下去那一刻，楼能盖多高就已经定死了'
- '- **三形态模型** = 你是要装修老房（改造）、换套新房（替代）、还是在一块空地上开荒（创造）？'
- '- **四维聚焦法则** = 你手里只有两车砖，别同时想着盖宽、盖深、盖高、还盖快'
- '- **目标六遍法** = 一份图纸要交给六个不同师傅反复看，才能发现隐患'
- '- **定价权分野** = 卖标准化建材只能拼价格，卖定制雕花家具才能开出自己的价'
- '- **创始人认知瓶颈** = 房子封顶的高度，永远超不过你请的总设计师的眼界'
- '- **迁移能力优先律** = 会盖楼的人跳去盖桥也能快速上手，因为结构原理是相通的'
- '- **人才三层视角** = 同一块砖，有人只用来砌墙，有人琢磨怎么拼出图案，有人干脆发明了新型材料'
- 就像好房子是图纸上定出来的，好业务也是设计出来的，前期的设计决定了后期的结局。
summary:
- concept: 商业设计思维
  desc: 所有商业成功皆源于事前设计，业务盈利在第一天就已确定
- concept: 商业设计决定论
  desc: 业务结局是设计变量的函数，后期执行只能影响实现程度，无法改变根本结局
- concept: 三形态模型
  desc: 业务分为改造型、替代型、创造型，不同类型需要不同的战略设计
- concept: 金字塔两端理论
  desc: 优先选择培优（顶端）或补差（底端）生意，避开竞争激烈的中间市场
- concept: 四维聚焦法则
  desc: 经营策略只有广度、深度、高度、速度四种，每阶段最多选2种
- concept: 业务目标六遍法
  desc: 目标须从多视角重复推敲至少六遍，确保合理性与团队共识
- concept: 用户行为洞察法
  desc: 依据实际行为数据而非口头反馈寻找增长爆破点，信腿不信嘴
- concept: 定价权分野
  desc: 标品无定价权，非标品有定价权，模式选择决定利润空间
- concept: 创始人认知瓶颈
  desc: 创始人认知是业务最大瓶颈，战略向上看两级、执行向下落两层
- concept: 迁移能力优先律
  desc: 迁移能力比学习能力更重要，决定成长上限而非起点速度
- concept: 人才三层视角
  desc: 使用者/探索者/造物者三类取向，应招参与者而非旁观者
- concept: 知识五层次体系
  desc: 收集整理/利他/关键词/场景情绪/迁移，逐层建构独特知识体系
- concept: 标准化输出法
  desc: 只有标准化输出才能实现规模化增长
- concept: 碎片化vs结构化知识
  desc: 碎片化知识只增广度，结构化知识增深度
exercises:
- 'no': 1
  title: 判断业务形态：分析三个真实案例
  contents:
  - 以下是三个真实业务场景，请运用三形态模型判断它们分别属于改造型、替代型还是创造型：
  - 1. 一家传统火锅店引入自助点餐系统，优化排队流程，降低人力成本
  - 2. 某创业团队推出一款便携式电动汽车充电宝，替代传统固定充电桩的使用场景
  - 3. 一家公司发明了通过脑电波控制家居设备的系统，此前市场上不存在此类需求
  - 回答问题：
  - '- 每个业务的核心增长逻辑分别是什么？'
  - '- 各自面临的主要风险是什么？'
  - '- 如果让你为每个业务设计下一步战略，你会分别侧重哪个维度？'
- 'no': 2
  title: 四维聚焦：为一家初创公司做战略取舍
  contents:
  - 假设你是一家在线教育创业公司的CEO，公司刚完成A轮融资，手头资源有限，团队只有15人。
  - 市场上有四个发展方向可供选择：
  - ① 广度：快速覆盖K12、职场、兴趣等多个品类
  - ② 深度：只做K12数学单科，做到极致
  - ③ 高度：定位高端素质教育市场，对标VIP陪练
  - ④ 速度：快速迭代产品，抢占下沉市场先机
  - 练习要求：
  - 1. 运用四维聚焦法则，为当前阶段选择2个核心维度
  - 2. 明确说出你放弃的另外2个维度及其理由
  - 3. 说明下一阶段（B轮后）你会如何调整维度组合
- 'no': 3
  title: 目标六遍法实操演练
  contents:
  - 假设你是一家社区团购公司的运营负责人，老板要求你制定下季度GMV目标，目标定为3000万。
  - 请运用业务目标六遍法，从以下六个角度逐一审视这个目标：
  - ① 历史数据视角：从上季度实际GMV推演增长率是否合理
  - ② 市场容量视角：所在城市的社区团购市场总量是否支撑
  - ③ 团队产能视角：现有团长数量和配送能力能否承载
  - ④ 竞争格局视角：美团优选、多多买菜等竞品的份额挤压
  - ⑤ 资本回报视角：3000万GMV对应的毛利是否满足投资方预期
  - ⑥ 共识验证视角：组织核心团队讨论，收集异议和补充信息
  - 完成后回答：
  - '- 经过六遍推敲后，你对3000万目标持什么看法？'
  - '- 你觉得六遍法中哪一遍最能暴露目标的不合理性？为什么？'
- 'no': 4
  title: 行为数据 vs 口头反馈：设计一个验证实验
  contents:
  - 你的团队做了一款健身APP，用户调研显示85%的人表示"愿意为专业私教课程付费"。但实际付费率只有3%。
  - 请设计一个实验，通过用户行为数据来找出"嘴上愿意但行为不愿付"的真实原因：
  - 1. 列出至少3个可追踪的行为指标（如：免费课程完播率、付费页停留时长、观看私教试听课次数等）
  - 2. 说明每个指标可能揭示的用户心理
  - 3. 基于行为数据，提出一个可能的增长爆破点假设
  - 回答：
  - '- 如果行为数据显示用户免费课程完播率很高但从不点击付费页，问题可能出在哪？'
  - '- 如果数据显示用户频繁观看私教试听课但从不购买，又可能说明什么？'
- 'no': 5
  title: 定价权分析：为你的产品做一次定价权诊断
  contents:
  - 选择你熟悉的两个电商产品（例如：一款标准化的数据线 vs 一款手作陶瓷杯），分别进行定价权诊断：
  - 1. 判断每个产品属于标品还是非标品
  - 2. 分析每个产品的差异化空间大小（列出差异化维度）
  - 3. 判断在交易型平台和内容型平台分别能获得怎样的定价空间
  - 4. 如果你是内容型电商平台的运营者，你会选择哪个产品来主推？为什么？
  - 回答：
  - '- 一个非标品在什么条件下会逐渐被"标品化"，丧失定价权？'
  - '- 标品能否通过品牌化、服务化获得定价权？天花板在哪里？'
- 'no': 6
  title: 人才三层视角评估：设计一套面试问题
  contents:
  - 你要为一个增长运营岗位招聘人才，请根据人才三层视角理论，分别设计2个面试问题来考察候选人的视角层次：
  - ① 使用者视角考察：如何判断候选人是按SOP执行型？
  - ② 探索者视角考察：如何判断候选人有主动创新意愿？
  - ③ 造物者视角考察：如何判断候选人能重构增长模型？
  - 回答：
  - '- 如果一个候选人表现出强烈的探索者视角，但当前岗位只需要使用者视角，你会录用吗？为什么？'
  - '- 作为一个创始人，你认为自己在业务中是哪种视角？如何提升到造物者视角？'
units:
- 'no': 1
  name: 商业设计思维 —— 在画图纸时就注定楼会不会塌
  points:
  - '**为什么需要这个概念？**'
  - '- 很多业务失败并非执行不力，而是起点就错了，商业模式在诞生之日起就已“先天不足”'
  - '- 传统的“先干起来再说”思维容易让团队在错误的赛道上狂奔，导致资源浪费'
  - '- 需要一个前置的心智模型，让创业者和管理者在投入资源前先审视业务的设计合理性'
  - '**核心定义**'
  - '- 商业设计思维是指：所有商业成功皆源于事前设计，业务能否赚钱在第一天就已确定'
  - '- 它强调业务的结构性、系统性谋划先于行动，如同建筑设计先于施工'
  - '**关键性质**'
  - '- 前置性：设计发生在业务启动之前，决定了后续所有运营动作的边界'
  - '- 决定性：业务成果的最终上限在设计阶段就被框定，后期运营只是在该框架内优化'
  - '- 系统性：设计涵盖战略、业务、组织、增长等全要素，而非单点优化'
  - '**典型例子**'
  - '- 同是做电商，交易型电商卖标品利润薄，内容型电商卖非标品利润厚，这是设计之初就决定的'
  - '- 一个面向中间市场的业务，往往不如选择金字塔顶端（培优）或底端（补差）的业务，这也是设计选择导致的结果差异'
  - '**边界条件**'
  - '- 商业设计不能消除执行风险，好的设计仍需要高效的执行来落地'
  - '- 商业设计思维并非万能，它需要结合对市场、用户和行业的深刻洞察，否则设计本身可能脱离实际'
  sources:
  - paper: 004_商业设计思维
    role: origin
  excerpts:
  - 所有的商业都是设计出来的，一个业务能不能赚钱，从第一天就已确定。
  - 所有业务三种形态：改造型/替代型/创造型
  - 优先金字塔顶端生意或底端生意，中间不要选
  - 交易型电商卖标品无定价权，内容型电商卖非标品有定价权
- 'no': 2
  name: 商业设计决定论 —— 从第一天就写好的盈利剧本
  points:
  - '**为什么需要这个概念？**'
  - '- 商业设计思维需要一个可操作、可检验的明确命题，否则容易沦为空洞口号'
  - '- 需要将“设计很重要”转化为可指导实践的原则，即设计的质量直接决定业务的成败'
  - '- 帮助团队避免“事后归因”，而将成败的根因前置到设计阶段审视'
  - '**核心定义**'
  - '- 商业设计决定论是指：一个业务最终能否盈利、能赚多少钱，在业务设计的第一天就已经被确定下来，后期的执行与运营只能影响实现程度，无法改变根本结局'
  - '**关键性质**'
  - '- 严格因果性：业务结局是设计变量的函数，设计变则结局变'
  - '- 不可逆性：一旦设计定型，后期修正的成本极高，且往往难以扭转结局'
  - '- 可检验性：可以通过对比“设计良好的业务”与“设计不良的业务”的最终表现来印证'
  - '**典型例子**'
  - '- 交易型电商与内容型电商的定价差异：标品无定价权（交易型），非标品有定价权（内容型），这种差异在设计业务模式时已经决定，后期运营很难改变'
  - '- 选择中间市场的业务往往陷入红海，这与选择金字塔顶端或底端的业务在设计时就注定了不同的竞争格局'
  - '**边界条件**'
  - '- 商业设计决定论不等于宿命论，它允许在执行过程中进行局部优化，但不改变根本格局'
  - '- 该理论依赖高质量的设计输入，如果设计基于错误的市场判断，决定论同样会放大错误'
  sources:
  - paper: 004_商业设计思维
    role: origin
  excerpts:
  - 所有的商业都是设计出来的，一个业务能不能赚钱，从第一天就已确定。
- 'no': 3
  name: 业务本质三形态模型 —— 认清你的业务是装修、换窗还是盖新楼
  points:
  - '**为什么需要这个概念？**'
  - '- 不同业务的增长逻辑、竞争策略和成功要素完全不同，混为一谈会导致战略错配'
  - '- 需要一套分类框架帮助管理者快速识别业务本质，从而选择正确的设计方向'
  - '- 避免“用改造型的方法做创造型业务”这类鸡同鸭讲的战略失误'
  - '**核心定义**'
  - '- 判断业务本质的三形态模型将所有业务分为三种原型：改造型（优化存量）、替代型（替换现有方案）、创造型（创造全新需求）'
  - '**关键性质**'
  - '- 改造型：面向已有市场，核心是效率提升和成本降低，竞争激烈，利润空间有限'
  - '- 替代型：面向已有需求但提供更优解决方案，核心是差异化和体验超越'
  - '- 创造型：面向未知需求，核心是市场教育和定义新规则，风险高但潜在回报最大'
  - '**典型例子**'
  - '- 改造型：传统餐饮的流程优化、数字化点餐系统'
  - '- 替代型：新能源汽车替代燃油车'
  - '- 创造型：智能手机在iPhone出现之前并非大众刚需，是被创造出来的市场'
  - '**边界条件**'
  - '- 三种形态并非绝对互斥，同一业务可同时具备多重属性，需要判断主次'
  - '- 创造型业务在成熟后会逐渐演化为改造型，形态会随生命周期变化'
  sources:
  - paper: 004_商业设计思维
    role: origin
  excerpts:
  - 所有业务三种形态：改造型/替代型/创造型
- 'no': 4
  name: 四维聚焦法则 —— 广度、深度、高度、速度，一局最多押两注
  points:
  - '**为什么需要这个概念？**'
  - '- 企业资源有限，贪多求全会导致兵力分散，样样通样样松'
  - '- 需要明确经营策略的维度边界，防止战略上的“什么都想要”'
  - '- 帮助管理者在做战略取舍时有一个清晰的决策框架'
  - '**核心定义**'
  - '- 经营策略的四维聚焦法则是指：经营策略只有广度（覆盖范围）、深度（专业程度）、高度（定位层级）、速度（响应速率）四种，每一阶段最多选择其中两种作为核心策略'
  - '**关键性质**'
  - '- 排他性：四个维度不可同时追求，最多选两个，否则互相牵制'
  - '- 阶段性：不同发展阶段应选择不同的维度组合，不能一成不变'
  - '- 取舍性：选两个意味着必须放弃另外两个，这是一种主动的战略放弃'
  - '**典型例子**'
  - '- 创业初期可能选择“速度+深度”，快速打磨极致单品；规模化阶段可能转向“广度+高度”，构建平台生态'
  - '- 高端品牌追求高度与深度，放弃广度与速度；快消品追求广度与速度，放弃高度与深度'
  - '**边界条件**'
  - '- 四个维度之间并非完全独立，存在互相促进的关系，聚焦不是绝对的孤立'
  - '- 该法则适用于战略层面的宏观取舍，不适用于日常运营的细节决策'
  sources:
  - paper: 004_商业设计思维
    role: origin
  excerpts:
  - 经营策略只有广度深度高度速度四种每阶段最多选2种
- 'no': 5
  name: 业务目标六遍法 —— 好目标是被推敲出来的，不是拍脑袋定出来的
  points:
  - '**为什么需要这个概念？**'
  - '- 目标设定随意会导致团队方向漂移，执行走样，最终无法兑现'
  - '- 单一视角制定的目标往往忽略市场现实与团队能力，缺乏共识基础'
  - '- 需要一个简单的机制确保目标具备合理性与团队认同感'
  - '**核心定义**'
  - '- 业务目标六遍法是指：在制定业务目标时，至少重复推敲六遍（从不同角度、不同角色、不同时间维度审视），以确保目标的合理性与团队共识'
  - '**关键性质**'
  - '- 重复性：目标必须经过多轮审视，而非一次成型'
  - '- 多视角：每遍审视从不同维度出发（如市场可行性、资源匹配度、团队执行力和财务回报等）'
  - '- 共识性：推敲过程也是团队对齐的过程，确保目标获得广泛认可'
  - '**典型例子**'
  - '- 制定年度营收目标：第一遍从历史数据出发，第二遍从市场容量出发，第三遍从团队产能出发，第四遍从竞争格局出发，第五遍从资本要求出发，第六遍组织全员讨论验证'
  - '- 设定用户增长目标时，每遍推敲都挑战前提假设，避免“乐观偏差”'
  - '**边界条件**'
  - '- 六遍并非固定数量上限，核心在于“重复推敲”而非机械数数，复杂目标可能需要更多轮次'
  - '- 该方法适用于关键业务目标的制定，不适用于日常事务性任务的优先级排列'
  sources:
  - paper: 004_商业设计思维
    role: origin
  excerpts:
  - 定业务目标至少过6遍
- 'no': 6
  name: 用户行为洞察法 —— 信用户的腿，别信用户的嘴
  points:
  - '**为什么需要这个概念？**'
  - '- 用户口头反馈常常失真：出于礼貌、认知局限或社交期望，用户嘴上说的与实际做的大相径庭'
  - '- 依赖问卷调查和访谈来决策容易误判真实需求，导致产品方向跑偏'
  - '- 需要一种基于实际行为的数据驱动方法，找到真正驱动增长的关键点'
  - '**核心定义**'
  - '- 用户行为洞察法是指：在寻找增长爆破点时，依据用户的实际行为数据（如点击、停留、复购、分享）而非用户的言语反馈来进行判断，即“信用户腿（行为），不信用户嘴（言论）”'
  - '**关键性质**'
  - '- 行为优先：实际行为是真实意图的最可靠代理指标'
  - '- 数据驱动：基于可量化的行为数据而非主观感受做决策'
  - '- 爆破点导向：该方法聚焦于找出对增长影响最大的关键行为节点，而非平均用力'
  - '**典型例子**'
  - '- 用户调研中90%的人说愿意为知识付费，但实际付费转化率仅2%，此时应以2%的真实付费行为为准，而非调研的90%意愿'
  - '- 用户嘴上说喜欢“简洁”，但实际行为数据显示功能丰富的页面停留时间更长、转化更高，则应相信行为数据'
  - '**边界条件**'
  - '- 行为数据也可能失真：样本偏差、统计口径错误、短期诱导行为等都会误导判断'
  - '- 该方法适用于已有用户基础、可获取行为数据的阶段，不适用于从零到一的全新业务探索'
  sources:
  - paper: 004_商业设计思维
    role: origin
  excerpts:
  - 洞察人性找到增长爆破点不要信用户嘴要信用户腿
- 'no': 7
  name: 定价权分野 —— 标品无定价权，非标品有定价权
  points:
  - '**为什么需要这个概念？**'
  - '- 很多电商创业者困惑：为什么同样卖货，有的平台能赚钱，有的平台只能打价格战？'
  - '- 归根结底是定价权的有无，决定了利润空间和竞争策略'
  - '- 需要一个清晰的判断标准来指导业务模式的选择和定价策略的制定'
  - '**核心定义**'
  - '- 定价权分野定律是指：交易型电商（卖标品）通常没有定价权，价格由市场决定；内容型电商（卖非标品）通常拥有定价权，可以通过内容赋予产品附加值来主导价格'
  - '**关键性质**'
  - '- 品类决定权：标品（标准化程度高的产品）价格透明，无差异化空间，定价权弱；非标品（个性化、差异化产品）价格不透明，有溢价空间，定价权强'
  - '- 平台类型绑定：交易型平台的竞争核心是价格与效率，内容型平台的核心是信任与附加值'
  - '- 利润传导：无定价权导致利润被压缩，有定价权则带来更高的毛利空间'
  - '**典型例子**'
  - '- 京东卖3C标品（手机、电脑），利润极薄；小红书/抖音卖非标品（设计款服饰、手工艺品），毛利可达数倍'
  - '- 同样的茶叶，在交易型电商平台卖100元/斤，在内容型平台通过故事化包装可卖500元/斤'
  - '**边界条件**'
  - '- 标品也可以通过品牌化、服务化来获取部分定价权，但天花板明显低于非标品'
  - '- 该定律描述的是典型情况，非标品也可能因过度竞争而被“标品化”'
  sources:
  - paper: 004_商业设计思维
    role: origin
  excerpts:
  - 交易型电商卖标品无定价权，内容型电商卖非标品有定价权
- 'no': 8
  name: 创始人认知瓶颈 —— 公司的高度，由创始人的视野焊死
  points:
  - '**为什么需要这个概念？**'
  - '- 企业成长到一定阶段后停滞，往往不是市场问题、不是团队问题，而是创始人的认知边界限制了企业的天花板'
  - '- 需要明确创始人认知在业务系统中的核心地位，才能对症下药'
  - '- 防止企业把战略失误与组织问题误诊为执行问题，从而反复试错'
  - '**核心定义**'
  - '- 创始人认知瓶颈是指：创始人（核心决策者）的认知水平是业务发展的最大瓶颈，业务的高度无法超过创始人认知的天花板'
  - '**关键性质**'
  - '- 天花板效应：业务的长期增长上限由创始人认知决定，团队优秀也无法突破这层限制'
  - '- 杠杆放大：创始人认知的微小提升，通过决策传导可放大为业务的巨大改善'
  - '- 战略关联：创始人需“战略向上看两级，执行向下落两层”，即认知要超越当前业务层级，同时落地要深入执行细节'
  - '**典型例子**'
  - '- 创始人只关注执行细节（如具体运营动作）而缺乏行业格局认知时，企业会陷入低水平重复，难以突破规模瓶颈'
  - '- 创始人认知停留在“卖货思维”时，企业做再大也只是贸易商；认知升级为“品牌思维”后，企业才开始建立护城河'
  - '**边界条件**'
  - '- 创始人认知并非唯一瓶颈，组织能力、资本约束、市场环境等同样构成限制'
  - '- 当企业完成职业化管理转型后，创始人认知的制约作用会有所缓解，但仍是最根本的约束'
  sources:
  - paper: 004_商业设计思维
    role: origin
  excerpts:
  - 创始人认知是业务最大瓶颈
- 'no': 9
  name: 迁移能力优先律 —— 学习能力决定起点，迁移能力决定上限
  points:
  - '**为什么需要这个概念？**'
  - '- 在快速变化的环境中，单纯的学习速度快并不能保证成功，因为学到的旧方法可能迅速过时'
  - '- 需要厘清“学习能力”与“迁移能力”的区别，避免团队陷入“勤奋地学错误的东西”的陷阱'
  - '- 为个人成长和组织能力建设提供明确的发展优先级'
  - '**核心定义**'
  - '- 迁移能力优先律是指：比学习能力更重要的是迁移能力，即能否将在一个领域（或场景）中习得的原理、模式和洞察，有效地应用到另一个新领域（或新场景）中，迁移能力决定了成长上限'
  - '**关键性质**'
  - '- 抽象提炼：迁移的前提是从具体经验中抽象出可复用的底层规律'
  - '- 跨域应用：迁移的价值在于跨越看似不相关的领域建立连接'
  - '- 上限决定：学习能力决定达到既定水平的速度，迁移能力决定能达到的终极高度'
  - '**典型例子**'
  - '- 一个做过线下零售的创业者，将“选址即选客流”的洞察迁移到线上流量获取中，快速建立了新业务的流量优势'
  - '- 将游戏行业的“用户留存设计”迁移到教育产品中，提升学习产品的粘性'
  - '**边界条件**'
  - '- 迁移能力需要以一定的学习能力和知识积累为基础，二者并非替代而是递进关系'
  - '- 迁移不当会沦为“生搬硬套”，需要结合新场景的具体条件进行再创造，而非简单复制'
  sources:
  - paper: 004_商业设计思维
    role: origin
  excerpts:
  - 比学习能力更重要的是迁移能力
- 'no': 10
  name: 人才三层视角与造物者思维 —— 招参与者，不招旁观者
  points:
  - '**为什么需要这个概念？**'
  - '- 团队中不同成员对业务的参与深度差异巨大，传统招聘只看技能匹配，忽略了认知层面的契合度'
  - '- 缺乏“参与者思维”的团队会出现大量“事不关己”的旁观者，导致执行力涣散'
  - '- 需要一套人才分类框架来指导招聘与团队建设，确保团队成员以“参与者”身份融入业务创造'
  - '**核心定义**'
  - '- 人才三层视角与造物者思维是指：从“使用者/探索者/造物者”三个视角来审视人才，在招聘时应优先选择具备“造物者视角”或至少“探索者视角”的参与者，而非只关注“使用者视角”的打工者'
  - '**关键性质**'
  - '- 使用者视角：将现有产品/工具当作既定之物使用，缺乏改进意愿，关注“怎么用”而非“怎么改”'
  - '- 探索者视角：会主动尝试边界，探索工具/系统的新可能，关注“还能怎么用”'
  - '- 造物者视角：从根本上去思考和构建，他们不仅在用，更在创造新的工具与规则，关注“为什么是这样以及怎样创造更好的”'
  - '- 参与者原则：招聘应选择拥有造物者或探索者取向的人，拒绝旁观者式的心态'
  - '**典型例子**'
  - '- 同是招一个运营，使用者视角只按SOP执行；探索者视角会主动尝试新的投放渠道；造物者视角则会重新设计整个增长模型'
  - '- 同是招一个设计师，使用者视角等需求单；探索者视角主动研究用户行为提出优化；造物者视角会重新定义产品的设计语言'
  - '**边界条件**'
  - '- 并非所有岗位都要求“造物者视角”，执行类岗位“使用者视角”也能胜任'
  - '- 造物者思维需要组织赋予相应的决策空间与容错机制，否则会因环境不匹配而流失'
  sources:
  - paper: 004_商业设计思维
    role: origin
  excerpts:
  - 人才三层：使用者视角/探索者视角/造物者视角，招参与者
'no': 1
