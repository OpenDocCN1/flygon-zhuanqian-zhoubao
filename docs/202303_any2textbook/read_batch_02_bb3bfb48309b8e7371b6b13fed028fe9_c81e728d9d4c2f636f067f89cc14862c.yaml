- file_path: docs/202303/20230328_028.md
  title: 《如何正确利用见面会获得的信息？》
  summary: 作者郭晓文结合自己及同伴在初次参加线下见面会后的负面经历，揭示了“信息过载导致行动瘫痪”的现象，并剖析了其成因——幸存者偏差，进而探讨如何正确利用此类信息。
  core_question: 当创业者从高能量的线下活动获得大量成功案例信息后，为什么会陷入低谷期，以及如何正确利用这些信息？
  key_judgment: 参与线下活动后陷入低谷的根源是‘幸存者偏差’，即只看到成功的少数而忽略失败的多数；正确的方法是“抬头看天，低头赶路”，将获取的信息内化为自己的行动，而非盲目对标。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 重复
  screening_conclusion: retain
  reason: 文章从反面提出了一个极具洞察力的认知观点（幸存者偏差），直接指出了信息利用的误区，并给出了正向的行动建议，是构建“信息利用”相关章节的重要认知性素材。
