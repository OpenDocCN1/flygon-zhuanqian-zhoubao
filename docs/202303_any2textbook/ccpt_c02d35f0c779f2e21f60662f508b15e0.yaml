paper: 20230328_004_商业设计思维100条
desc: 该素材是作者麦壳爸爸的战略咨询经验总结，以‘所有的商业都是设计出来的’为核心命题，从战略创新、组织管理、业务增长三个维度提炼出100条商业设计思维要点，旨在构建一套可指导商业实践与教学的系统性认知框架。
concepts:
- name: 商业设计思维
  desc: 认为所有商业成功皆源于事前设计，业务能否盈利在第一天就已确定，而非事后运营的偶然结果。
  is_original: true
  excerpt:
  - 所有的商业都是设计出来的，一个业务能不能赚钱，从第一天就已确定。
- name: 组织能力溢出
  desc: 组织在业务迁移时具备的能力外溢效应，由组织迁移能力与大规模需求溢出组成。
  is_original: true
  excerpt:
  - 组织能力溢出=组织迁移能力+大规模需求溢出
- name: 经营策略的四种形态
  desc: 提出经营策略只有广度、深度、高度、速度四种，且每个阶段最多选择两种，强调战略聚焦与减法。
  is_original: true
  excerpt:
  - 经营策略只有广度深度高度速度四种每阶段最多选2种
- name: 业务三种形态
  desc: 将全部业务区分为改造型、替代型、创造型三种形态，作为判断业务本质与设计路径的起点。
  is_original: true
  excerpt:
  - 所有业务三种形态：改造型/替代型/创造型
- name: 人才三层视角
  desc: 将人才分为使用者视角、探索者视角、造物者视角三个层次，主张招聘具有参与者心态（造物者视角）的人才。
  is_original: true
  excerpt:
  - 人才三层：使用者视角/探索者视角/造物者视角，招参与者
- name: 知识五层次体系
  desc: 通过刻意练习形成独特知识体系的五个层次：收集整理、利他、关键词、场景情绪、迁移。
  is_original: true
  excerpt:
  - 刻意练习形成独特知识体系五层次：收集整理/利他/关键词/场景情绪/迁移
- name: 金字塔生意两端理论
  desc: 主张优先选择金字塔顶端的‘培优模式’或底端的‘补差模式’，避免中间市场的竞争红海。
  is_original: true
  excerpt:
  - 优先金字塔顶端生意（培优模式）或底端生意（补差模式），中间不要选
- name: 业务三种增长阶段
  desc: 将业务增长划分为0-1（深度理解业务）、1-10（拓展流量渠道）、10-100（标准化）三个阶段，各阶段侧重不同。
  is_original: true
  excerpt:
  - 0-1深度理解业务1-10拓展流量渠道10-100做标准化
methods:
- name: __overview__
  desc: 以战略创新、组织管理、业务增长三大模块为骨架，将100条经验法则分层归类，形成可复用的商业设计方法论体系。
  excerpt:
  - 通过战略创新、组织管理、业务增长三方面构建商业体系。战略创新（30条）...组织管理（40条）...业务增长（30条）
- name: 业务目标六遍法
  desc: 在制定业务目标时至少要重复推敲六遍，确保目标的合理性、落地性与内部共识。
  excerpt:
  - 定业务目标至少过6遍
- name: 用户行为洞察法
  desc: 主张洞察人性应依据用户的实际行为（‘用户腿’）而非口头反馈（‘用户嘴’），以此找到增长爆破点。
  excerpt:
  - 洞察人性找到增长爆破点不要信用户嘴要信用户腿
- name: 标准化输出法
  desc: 通过将内容和产品标准化、模板化，实现服务质量的稳定输出，从而支撑规模化增长。
  excerpt:
  - 只有标准化输出才能规模化增长把内容标准化工美化
- name: 流量平台选择法
  desc: 新手应优先选择商业化程度低、专业化程度低的平台，以降低起步门槛并获取平台扶持红利。
  excerpt:
  - 选择流量平台新手选商业化程度低专业化程度低的平台
- name: 效果外化五原则
  desc: 产品效果外化需同时满足高认知、反常识、有场景、可感知、可量化五个原则，以提升营销说服力。
  excerpt:
  - 产品效果外化要高认知反常识有场景可感知可量化
- name: 对标学习法
  desc: 在业务推进中先完成再完美、先对标再对垒，并向竞争对手学习以快速补齐短板。
  excerpt:
  - 先完成再完美先对标再对垒；向竞争对手学习
theorems:
- name: 商业设计决定论
  desc: 核心主张一切商业成果在设计之初即被确定，业务可盈利性由第一天起就已注定。
  excerpt:
  - 所有的商业都是设计出来的，一个业务能不能赚钱，从第一天就已确定。
- name: 战略与组织协同律
  desc: 主张战略决定组织、组织跟随战略，组织流程决定运营效率、组织层级决定决策效率。
  excerpt:
  - 战略决定组织组织跟随战略；组织流程决定运营效率组织层级决定决策效率
- name: 行业竞争形态演变律
  desc: 行业上升期属于非零和博弈，进入放缓或成熟期则转为零和博弈，竞争策略须随之调整。
  excerpt:
  - 行业上升期非零和博弈，放缓则零和博弈
- name: 交易型与内容型电商定价权差异律
  desc: 交易型电商销售标品缺乏定价权，内容型电商销售非标品则拥有定价权。
  excerpt:
  - 交易型电商卖标品无定价权，内容型电商卖非标品有定价权
- name: 迁移能力优先律
  desc: 认为比学习能力更重要的是迁移能力，决定了个人与组织的成长上限。
  excerpt:
  - 比学习能力更重要的是迁移能力
- name: 坏流失率与好流失率管理律
  desc: 人才盘点目标应为提高‘坏流失率’（淘汰不匹配者）并降低‘好流失率’（保留优秀人才）。
  excerpt:
  - 人才盘点提高坏流失率降低好流失率
- name: 招人开人节奏律
  desc: 主张招人要慢、开人要快，以及老人做新事、新人做老事，以平衡风险与创新。
  excerpt:
  - 招人要慢开人要快；老人做新事新人做老事
- name: 获客信任梯度律
  desc: 主张适度专业可吸引客户，过度专业则吸引同行，需把握专业展示的平衡度。
  excerpt:
  - 适度专业吸引客户过度专业吸引同行
findings:
- name: 创始人认知瓶颈发现
  desc: '[claim] 作者宣称创始人认知是业务最大瓶颈，且提出战略规划应‘向上看两级、向下落两层’。'
  excerpt:
  - 创始人认知是业务最大瓶颈；战略向上看两级执行向下落两层
- name: 行业规律三阶段发现
  desc: '[claim] 作者观察行业规律遵循‘野蛮生长→投资入场→国家监管’的三阶段演进路径。'
  excerpt:
  - 行业规律从野蛮生长到投资入场再到国家监管
- name: 客户服务成本分化发现
  desc: '[claim] 作者声称越有钱的客户越好服务，与常见‘高端客户难服务’的直觉相反。'
  excerpt:
  - 越有钱客户越好服务
- name: 小红书算法窗口期发现
  desc: '[claim] 作者判定小红书底层算法智商仅8-12岁，且暂未上重算法，红利窗口期可能仅剩半年；并在起号阶段应专注模仿而非输出干货。'
  excerpt:
  - 小红书底层是算法算法智商只有8-12岁；小红书平台还没有上去重算法窗口期可能半年；起号前专注模仿账号起来再输出干货
- name: 成长与成就关系发现
  desc: '[claim] 作者区分充足与痛苦：成长带来开心，成就带来痛苦，故应选择做有成就感的事。'
  excerpt:
  - 成长都开心成就才痛苦，做有成就感的事
- name: 碎片化与结构化知识效能发现
  desc: '[claim] 作者主张碎片化知识只增加广度，结构化知识才增加深度，强调深度比广度更重要。'
  excerpt:
  - 碎片化知识只增广度，结构化知识增深度
- name: 业务方向确认周期发现
  desc: '[claim] 作者断言业务开展3-6个月若无进展，大概率方向有误并需重新定向。'
  excerpt:
  - 业务3-6个月没进展大多方向错了
- name: 免费与付费流量确定性对比发现
  desc: '[claim] 作者指出免费流量具有不确定性，而规模化付费流量相对确定，理性投流更可控。'
  excerpt:
  - 免费流量不确定需规模化付费流量相对确定
- name: To B与To C业务管理焦点差异发现
  desc: '[claim] 作者提出To B业务本质是决策链管理，To C业务本质是认知管理，二者管理焦点不同。'
  excerpt:
  - To B业务是决策链管理To C业务是认知管理
- name: 用户自发转介绍约束发现
  desc: '[claim] 作者认为用户不会主动转介绍，需通过超预期体验并主动协助准备物料来激发推荐行为。'
  excerpt:
  - 用户不会主动转介绍需超预期+帮助准备物料
