  key_judgment: 爆文的核心是对标爆款并拆解共性：标题结构可按“主体+事件+强调点”重组；笔记关键词需在标题、文案中提及至少 3 次以获得搜索流量；大小标签结合（大标签定领域、小标签求收录）可稳定流量。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
