  title: 《通过爆款笔记数据分析，我在 7 天内把一个账号做到了 60% 的爆文率》
  summary: 作者分享了通过后羿采集器和灰豚数据等工具，进行爆款标题拆解、关键词埋设和标签策略，在 7 天内将小红书账号爆文率做到 60% 的完整方法论。
