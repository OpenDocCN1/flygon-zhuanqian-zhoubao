- file_path: docs/202303/20230328_074.md
  title: 《京东家电代下：一个新手也可以变现的项目》
  summary: 一名大学生分享从做京东代下到专注家电代下的历程，拆解了家电代下的原理（线下门店令牌价）、运作模式（代理制）和盈利前景。
  core_question: 京东家电代下是什么？新手如何上手并规模化运营？
  key_judgment: 京东家电代下的利润本质是借用线下门店的内部进货价（令牌价）赚差价，模式依赖代理分层放大，且需要关注京东对线下渠道的保护政策风险。
  depth: medium
  suggested_destination: case
  possible_shape: handbook
  risks:
  - 时效性
  - 其他
  screening_conclusion: demote
  reason: 项目介绍清楚但深度有限：实操细节（如何找货源、报价、客户渠道）较模糊，更多是个人经历和代理招募介绍；平台政策变化风险高，适合作为平台类型案例（如渠道差价套利）而非独立体系。
