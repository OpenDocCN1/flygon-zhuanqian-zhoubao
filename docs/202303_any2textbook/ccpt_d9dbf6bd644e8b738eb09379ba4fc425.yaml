paper: 20230328_151_小红书挖掘赚钱项目
desc: 该素材提出一套在小红书平台上系统化挖掘赚钱项目的实操方法论，核心主张是摆脱被动等待风向标、主动构建‘需求词库’并‘追溯笔记’以掌握选择权。素材详细拆解了从评论区留言提取用户需求、按产品/服务两大类四小项建立词库、通过标题批量分析与笔记精细挖掘（品类拓展、异常值挖掘）等方法，并辅以具体变现案例与收益数据。
concepts:
- name: 需求词库
  desc: 从小红书笔记评论区的高频需求留言（如‘求图’‘怎么领’）中提取关键词，构成的用户需求集合，作为后续检索商机笔记的检索词库。
  is_original: true
  excerpt:
  - 从评论区留言构建需求词库：【求图】【跟团】【怎么领】是用户留下的需求。
  - 用千瓜数据按笔记评论搜索找笔记、对应产品或服务。
- name: 赚钱项目分类体系
  desc: 将小红书变现项目划分为产品类（实体、虚拟）与服务类（线上、线下）两大类四小项，并对应四类需求词（求链接/怎么学/怎么收费/怎么加入）。
  is_original: true
  excerpt:
  - 小红书赚钱项目分两大类：产品类（实体和虚拟）和服务类（线上和线下）。
  - 通过‘求链接’找实体产品、‘怎么学’找虚拟产品、‘怎么收费’找线上服务、‘怎么加入’找线下服务。
- name: 追溯笔记挖掘法
  desc: 以需求词为入口，通过评论检索获取批量商机笔记，再经标题批量分析与笔记精细挖掘两个步骤，挖掘细分赛道变现方式。
  is_original: true
  excerpt:
  - 追溯笔记挖掘大量赚钱项目：挑【求资料】词，用千瓜评论检索获取批量商机笔记。
  - 目标挖掘更多细分赛道资料变现方式避开竞争。分两步：标题的批量分析+笔记的精细挖掘。
- name: 品类拓展法
  desc: 在已识别赛道基础上，通过直接拓展（投喂标题给ChatGPT提炼营销产品）或间接拓展（用导航网站列举全部职业考试证书）等方式扩充项目品类的方法。
  is_original: true
  excerpt:
  - 品类拓展法：直接拓展（投喂标题给ChatGPT提炼营销产品再拓展品类，或用笔记标签）、间接拓展（职业考试赛道用导航网站把所有证都列出来，如桔梗上网导航，把关键词一个个往小红书检索）。
- name: 异常值挖掘法
  desc: 关注数据异常的账号（如大几万/十万粉账号却从事资料引流），进入主页翻到底深度研究其运营逻辑，以发现非常规变现模式。
  is_original: true
  excerpt:
  - 异常值挖掘法。大几万十万粉账号玩资料引流（废号操作），进主页翻到底研究。
methods:
- name: __overview__
  desc: 整体方法论为‘需求驱动’的逆向挖掘：从用户评论留言提取需求词→检索商机笔记→按四大分类构建产品词库→以多维分析框架（产品/变现/收益）评估筛选项目。核心特点是以评论区真实需求为起点，而非跟随已有风向标。
  excerpt:
  - 核心：不能等别人发风向标，要自己挖更多的风向标。核心方法：从评论区留言构建需求词库，追溯笔记挖掘赚钱项目。
  - 让选择权回到自己手上。拥有挖掘项目的能力，在千百条选择中遇见最适合自己的项目。
- name: 需求词库构建法
  desc: 从评论区高频需求留言中提取关键词，利用千瓜数据按笔记评论搜索定位对应笔记与产品或服务，形成需求驱动的检索入口。
  excerpt:
  - 【求图】【跟团】【怎么领】是用户留下的需求。
  - 用千瓜数据按笔记评论搜索找笔记、对应产品或服务。
- name: 标题批量分析法
  desc: 导出并清洗数据（达人去重按ID）后，对笔记标题进行三种分析：按形式（图文/视频）、账号属性（企业号/达人号）、笔记类型（词云高频词），以发现赛道规律。
  excerpt:
  - 导出1000条数据清洗去重（达人去重按ID），得636条。
  - 分析笔记形式（图文495视频141）、账号属性（企业号181达人号440）、笔记类型（用词云分析高频词）。
- name: 产品词库四维评估法
  desc: 针对挖掘到的每个项目，从【产品服务】【变现模式】【赚钱思路】【收益评估】四个维度进行结构化分析，评估其可行性与收益。
  excerpt:
  - 用【产品服务】【变现模式】【赚钱思路】【收益评估】分析。
theorems:
- name: 选择权回归定理
  desc: 当别人直接告诉你什么赚钱时，你的选择权已被没收；唯有主动构建挖掘项目的能力，才能将选择权掌握在自己手中。
  excerpt:
  - 核心观点：信息差决定选择权，当别人告诉你什么赚钱你就去做的时候，你的选择权其实已经被没收了。
  - 要让选择权回到自己手上。拥有挖掘项目的能力，在千百条选择中遇见最适合自己的项目。
- name: 需求词-项目映射原理
  desc: 小红书评论区的高频需求词与可变现项目之间存在对应关系，且可按产品/服务进行二分：四类需求词分别对应四类项目的发现路径。
  excerpt:
  - 【求链接】找实体产品、【怎么学】找虚拟产品、【怎么收费】找线上服务、【怎么加入】找线下服务。
findings:
- name: 小红书风向标与变现赛道分布
  desc: '[evidence] 挖掘出的风向标中标合集超2000条，其中小红书赛道约200余条，即小红书方向约占整体风向标的10%，构成聚焦该平台的依据。'
  excerpt:
  - 风向标中标合集2000多条，其中小红书200多条。
- name: 小红书记者笔记形式与账号结构分布
  desc: '[evidence] 经1000条数据清洗去重后得636条有效数据：图文笔记495条（78%）远超视频141条；达人号440个（69%）远超企业号181个，说明该赛道以图文+达人号为主导。'
  excerpt:
  - 导出1000条数据清洗去重（达人去重按ID），得636条。
  - 分析笔记形式（图文495视频141）、账号属性（企业号181达人号440）。
- name: 大号资料引流的‘废号’现象与混合打法
  desc: '[evidence] 发现大几万/十万粉账号从事资料引流属‘废号操作’；初中化学号采取个人IP与资料号混合发布的策略，以降低风险、提升信任。'
  excerpt:
  - 大几万十万粉账号玩资料引流（废号操作）。
  - 发现初中化学号做个人IP和资料号结合混着发降低风险提升信任。
- name: 大学英语赛道三种变现模式
  desc: '[claim] 大学英语赛道存在接广告、引公众号赚广告费、网盘拉新返佣三种变现方式（原文宣称，未提供数据支撑）。'
  excerpt:
  - 大学英语赛道变现三种：接广告/引公众号赚广告费/网盘拉新返佣。
- name: 各品类项目收益案例
  desc: '[evidence] 四类典型项目实测收益：实体产品‘花植艺门挂材料包’销售额3w；虚拟产品壁纸售价400元、无本万利；线上服务‘公益赠书’为分佣模式；线下服务‘交友活动’单人100元、50人参加赚一两千。'
  excerpt:
  - 实体产品（花植艺门挂材料包卖3w）、虚拟产品（壁纸卖400块无本万利）、线上服务（公益赠书分佣）、线下服务（交友活动单人100元50人参加赚一两千）。
