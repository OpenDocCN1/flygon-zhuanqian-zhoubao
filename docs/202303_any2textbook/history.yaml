    3.11 方法论边界与扩展\n\n我们用一个设计取舍的思路来分析这套方法论的边界。\n\n**为什么必须用评论区的高频需求词，而不是直接看销量榜单？**\n\n销量榜单反映的是已经被满足的需求，竞争已充分。而评论区高频词表达的是尚未被满足或被满足得不够好的需求——它的**信息价值密度**远高于销量榜。\n\n**这套方法论在非小红书平台真的有效吗？**\n\n从素材来看，这套方法论的核心是\"评论区需求
