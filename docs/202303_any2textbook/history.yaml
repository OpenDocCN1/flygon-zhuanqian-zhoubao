    \        \"- 同是招一个运营，使用者视角只按SOP执行；探索者视角会主动尝试新的投放渠道；造物者视角则会重新设计整个增长模型\",\n    \
    \    \"- 同是招一个设计师，使用者视角等需求单；探索者视角主动研究用户行为提出优化；造物者视角会重新定义产品的设计语言\",\n        \"\
