      arguments: '{"paper": "本教科书《搜商变现：普通人的副业操作系统》覆盖以下9个领域素材的核心术语。\n\n【认知基石】商业设计思维：商业设计决定论、业务三形态模型（改造型/替代型/创造型）、四维聚焦法则、业务目标六遍法、用户行为洞察法（信腿不信嘴）、定价权分野、创始人认知瓶颈、迁移能力优先律、人才三层视角、金字塔两端理论。搜商：搜商、搜索心法、搜索渠道、搜索技术、知识宽度与深度、搜商边界、个人知识操作系统。\n\n【项目挖掘】小红书赚钱项目挖掘：选择权回归定理、需求词库、赚钱项目分类体系（产品实体/虚拟、服务线上/线下）、追溯笔记挖掘法、标题批量分析法、品类拓展法、异常值挖掘法、产品词库四维评估法。\n\n【流量获取】视频号爆款起号：流量非天赋论、爆款驱动增粉模型、热点内容跟进法、文案来源组合法、多平台分发抢流量、日更复利论。百度竞价：人找货vs货找人、竞价冷门项目、选品三方法、产品三验证法、投放控制与分层、否词、私域承接页面法、同行持续投放必然盈利定理、投放思维普适定理。\n\n【垂直深耕】同城相亲私域：私域产品、信任是唯一交付物、四类内容账号矩阵、三级阶梯产品体系、精准流量、轻资产小而美、长期主义与信任壁垒、流量平台性别绑定定律。家庭教育高客单：三圈交集定位法、家长付费能力分层、产品供应链能力、从知道到做到、优势梳理三步法、六步沟通主线、价格筛选器、高客单完整服务定理、朋友圈专栏思维。旧书搬砖：信息差本质论、版本知识、旧书定价多维决定论、多渠道收书策略、地域搬砖、平台搬砖、修复再出售、低门槛准入。\n\n【成交转化】免费咨询应对：客户筛选机制、Skin
