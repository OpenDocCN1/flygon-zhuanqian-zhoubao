    ,\n        \"- 人才三层视角与造物者思维是指：从“使用者/探索者/造物者”三个视角来审视人才，在招聘时应优先选择具备“造物者视角”或至少“探索者视角”的参与者，而非只关注“使用者视角”的打工者\"\
    ,\n        \"**关键性质**\",\n        \"- 使用者视角：将现有产品/工具当作既定之物使用，缺乏改进意愿，关注“怎么用”而非“怎么改”\"\
    ,\n        \"- 探索者视角：会主动尝试边界，探索工具/系统的新可能，关注“还能怎么用”\",\n        \"- 造物者视角：从根本上去思考和构建，他们不仅在用，更在创造新的工具与规则，关注“为什么是这样以及怎样创造更好的”\"\
