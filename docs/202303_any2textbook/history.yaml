    units\": [\n    {\n      \"no\": 1,\n      \"name\": \"商业设计思维 —— 在画图纸时就注定楼会不会塌\"\
    ,\n      \"points\": [\n        \"**为什么需要这个概念？**\",\n        \"- 很多业务失败并非执行不力，而是起点就错了，商业模式在诞生之日起就已“先天不足”\"\
    ,\n        \"- 传统的“先干起来再说”思维容易让团队在错误的赛道上狂奔，导致资源浪费\",\n        \"- 需要一个前置的心智模型，让创业者和管理者在投入资源前先审视业务的设计合理性\"\
    ,\n        \"**核心定义**\",\n        \"- 商业设计思维是指：所有商业成功皆源于事前设计，业务能否赚钱在第一天就已确定\"\
    ,\n        \"- 它强调业务的结构性、系统性谋划先于行动，如同建筑设计先于施工\",\n        \"**关键性质**\",\n    \
    \    \"- 前置性：设计发生在业务启动之前，决定了后续所有运营动作的边界\",\n        \"- 决定性：业务成果的最终上限在设计阶段就被框定，后期运营只是在该框架内优化\"\
    ,\n        \"- 系统性：设计涵盖战略、业务、组织、增长等全要素，而非单点优化\",\n        \"**典型例子**\",\n    \
    \    \"- 同是做电商，交易型电商卖标品利润薄，内容型电商卖非标品利润厚，这是设计之初就决定的\",\n        \"- 一个面向中间市场的业务，往往不如选择金字塔顶端（培优）或底端（补差）的业务，这也是设计选择导致的结果差异\"\
    ,\n        \"**边界条件**\",\n        \"- 商业设计不能消除执行风险，好的设计仍需要高效的执行来落地\",\n      \
    \  \"- 商业设计思维并非万能，它需要结合对市场、用户和行业的深刻洞察，否则设计本身可能脱离实际\"\n      ],\n      \"sources\"\
    : [\n        {\n          \"paper\": \"004_商业设计思维\",\n          \"role\": \"origin\"\
    \n        }\n      ],\n      \"excerpts\": [\n        \"所有的商业都是设计出来的，一个业务能不能赚钱，从第一天就已确定。\"\
    ,\n        \"所有业务三种形态：改造型/替代型/创造型\",\n        \"优先金字塔顶端生意或底端生意，中间不要选\",\n    \
    \    \"交易型电商卖标品无定价权，内容型电商卖非标品有定价权\"\n      ]\n    },\n    {\n      \"no\": 2,\n\
    \      \"name\": \"商业设计决定论 —— 从第一天就写好的盈利剧本\",\n      \"points\": [\n        \"\
    **为什么需要这个概念？**\",\n        \"- 商业设计思维需要一个可操作、可检验的明确命题，否则容易沦为空洞口号\",\n        \"\
    - 需要将“设计很重要”转化为可指导实践的原则，即设计的质量直接决定业务的成败\",\n        \"- 帮助团队避免“事后归因”，而将成败的根因前置到设计阶段审视\"\
    ,\n        \"**核心定义**\",\n        \"- 商业设计决定论是指：一个业务最终能否盈利、能赚多少钱，在业务设计的第一天就已经被确定下来，后期的执行与运营只能影响实现程度，无法改变根本结局\"\
    ,\n        \"**关键性质**\",\n        \"- 严格因果性：业务结局是设计变量的函数，设计变则结局变\",\n        \"\
    - 不可逆性：一旦设计定型，后期修正的成本极高，且往往难以扭转结局\",\n        \"- 可检验性：可以通过对比“设计良好的业务”与“设计不良的业务”的最终表现来印证\"\
    ,\n        \"**典型例子**\",\n        \"- 交易型电商与内容型电商的定价差异：标品无定价权（交易型），非标品有定价权（内容型），这种差异在设计业务模式时已经决定，后期运营很难改变\"\
    ,\n        \"- 选择中间市场的业务往往陷入红海，这与选择金字塔顶端或底端的业务在设计时就注定了不同的竞争格局\",\n        \"**边界条件**\"\
    ,\n        \"- 商业设计决定论不等于宿命论，它允许在执行过程中进行局部优化，但不改变根本格局\",\n        \"- 该理论依赖高质量的设计输入，如果设计基于错误的市场判断，决定论同样会放大错误\"\
    \n      ],\n      \"sources\": [\n        {\n          \"paper\": \"004_商业设计思维\"\
    ,\n          \"role\": \"origin\"\n        }\n      ],\n      \"excerpts\": [\n\
    \        \"所有的商业都是设计出来的，一个业务能不能赚钱，从第一天就已确定。\"\n      ]\n    },\n    {\n      \"\
    no\": 3,\n      \"name\": \"业务本质三形态模型 —— 认清你的业务是装修、换窗还是盖新楼\",\n      \"points\"\
    : [\n        \"**为什么需要这个概念？**\",\n        \"- 不同业务的增长逻辑、竞争策略和成功要素完全不同，混为一谈会导致战略错配\"\
    ,\n        \"- 需要一套分类框架帮助管理者快速识别业务本质，从而选择正确的设计方向\",\n        \"- 避免“用改造型的方法做创造型业务”这类鸡同鸭讲的战略失误\"\
    ,\n        \"**核心定义**\",\n        \"- 判断业务本质的三形态模型将所有业务分为三种原型：改造型（优化存量）、替代型（替换现有方案）、创造型（创造全新需求）\"\
    ,\n        \"**关键性质**\",\n        \"- 改造型：面向已有市场，核心是效率提升和成本降低，竞争激烈，利润空间有限\",\n\
    \        \"- 替代型：面向已有需求但提供更优解决方案，核心是差异化和体验超越\",\n        \"- 创造型：面向未知需求，核心是市场教育和定义新规则，风险高但潜在回报最大\"\
    ,\n        \"**典型例子**\",\n        \"- 改造型：传统餐饮的流程优化、数字化点餐系统\",\n        \"- 替代型：新能源汽车替代燃油车\"\
    ,\n        \"- 创造型：智能手机在iPhone出现之前并非大众刚需，是被创造出来的市场\",\n        \"**边界条件**\",\n\
    \        \"- 三种形态并非绝对互斥，同一业务可同时具备多重属性，需要判断主次\",\n        \"- 创造型业务在成熟后会逐渐演化为改造型，形态会随生命周期变化\"\
    \n      ],\n      \"sources\": [\n        {\n          \"paper\": \"004_商业设计思维\"\
    ,\n          \"role\": \"origin\"\n        }\n      ],\n      \"excerpts\": [\n\
    \        \"所有业务三种形态：改造型/替代型/创造型\"\n      ]\n    },\n    {\n      \"no\": 4,\n\
    \      \"name\": \"四维聚焦法则 —— 广度、深度、高度、速度，一局最多押两注\",\n      \"points\": [\n   \
    \     \"**为什么需要这个概念？**\",\n        \"- 企业资源有限，贪多求全会导致兵力分散，样样通样样松\",\n        \"\
    - 需要明确经营策略的维度边界，防止战略上的“什么都想要”\",\n        \"- 帮助管理者在做战略取舍时有一个清晰的决策框架\",\n    \
    \    \"**核心定义**\",\n        \"- 经营策略的四维聚焦法则是指：经营策略只有广度（覆盖范围）、深度（专业程度）、高度（定位层级）、速度（响应速率）四种，每一阶段最多选择其中两种作为核心策略\"\
    ,\n        \"**关键性质**\",\n        \"- 排他性：四个维度不可同时追求，最多选两个，否则互相牵制\",\n       \
    \ \"- 阶段性：不同发展阶段应选择不同的维度组合，不能一成不变\",\n        \"- 取舍性：选两个意味着必须放弃另外两个，这是一种主动的战略放弃\"\
    ,\n        \"**典型例子**\",\n        \"- 创业初期可能选择“速度+深度”，快速打磨极致单品；规模化阶段可能转向“广度+高度”，构建平台生态\"\
    ,\n        \"- 高端品牌追求高度与深度，放弃广度与速度；快消品追求广度与速度，放弃高度与深度\",\n        \"**边界条件**\"\
    ,\n        \"- 四个维度之间并非完全独立，存在互相促进的关系，聚焦不是绝对的孤立\",\n        \"- 该法则适用于战略层面的宏观取舍，不适用于日常运营的细节决策\"\
    \n      ],\n      \"sources\": [\n        {\n          \"paper\": \"004_商业设计思维\"\
    ,\n          \"role\": \"origin\"\n        }\n      ],\n      \"excerpts\": [\n\
    \        \"经营策略只有广度深度高度速度四种每阶段最多选2种\"\n      ]\n    },\n    {\n      \"no\": 5,\n\
    \      \"name\": \"业务目标六遍法 —— 好目标是被推敲出来的，不是拍脑袋定出来的\",\n      \"points\": [\n \
    \       \"**为什么需要这个概念？**\",\n        \"- 目标设定随意会导致团队方向漂移，执行走样，最终无法兑现\",\n    \
    \    \"- 单一视角制定的目标往往忽略市场现实与团队能力，缺乏共识基础\",\n        \"- 需要一个简单的机制确保目标具备合理性与团队认同感\"\
    ,\n        \"**核心定义**\",\n        \"- 业务目标六遍法是指：在制定业务目标时，至少重复推敲六遍（从不同角度、不同角色、不同时间维度审视），以确保目标的合理性与团队共识\"\
    ,\n        \"**关键性质**\",\n        \"- 重复性：目标必须经过多轮审视，而非一次成型\",\n        \"- 多视角：每遍审视从不同维度出发（如市场可行性、资源匹配度、团队执行力和财务回报等）\"\
    ,\n        \"- 共识性：推敲过程也是团队对齐的过程，确保目标获得广泛认可\",\n        \"**典型例子**\",\n      \
    \  \"- 制定年度营收目标：第一遍从历史数据出发，第二遍从市场容量出发，第三遍从团队产能出发，第四遍从竞争格局出发，第五遍从资本要求出发，第六遍组织全员讨论验证\"\
    ,\n        \"- 设定用户增长目标时，每遍推敲都挑战前提假设，避免“乐观偏差”\",\n        \"**边界条件**\",\n    \
    \    \"- 六遍并非固定数量上限，核心在于“重复推敲”而非机械数数，复杂目标可能需要更多轮次\",\n        \"- 该方法适用于关键业务目标的制定，不适用于日常事务性任务的优先级排列\"\
    \n      ],\n      \"sources\": [\n        {\n          \"paper\": \"004_商业设计思维\"\
    ,\n          \"role\": \"origin\"\n        }\n      ],\n      \"excerpts\": [\n\
    \        \"定业务目标至少过6遍\"\n      ]\n    },\n    {\n      \"no\": 6,\n      \"name\"\
    : \"用户行为洞察法 —— 信用户的腿，别信用户的嘴\",\n      \"points\": [\n        \"**为什么需要这个概念？**\"\
    ,\n        \"- 用户口头反馈常常失真：出于礼貌、认知局限或社交期望，用户嘴上说的与实际做的大相径庭\",\n        \"- 依赖问卷调查和访谈来决策容易误判真实需求，导致产品方向跑偏\"\
    ,\n        \"- 需要一种基于实际行为的数据驱动方法，找到真正驱动增长的关键点\",\n        \"**核心定义**\",\n    \
    \    \"- 用户行为洞察法是指：在寻找增长爆破点时，依据用户的实际行为数据（如点击、停留、复购、分享）而非用户的言语反馈来进行判断，即“信用户腿（行为），不信用户嘴（言论）”\"\
    ,\n        \"**关键性质**\",\n        \"- 行为优先：实际行为是真实意图的最可靠代理指标\",\n        \"- 数据驱动：基于可量化的行为数据而非主观感受做决策\"\
    ,\n        \"- 爆破点导向：该方法聚焦于找出对增长影响最大的关键行为节点，而非平均用力\",\n        \"**典型例子**\",\n\
    \        \"- 用户调研中90%的人说愿意为知识付费，但实际付费转化率仅2%，此时应以2%的真实付费行为为准，而非调研的90%意愿\",\n  \
    \      \"- 用户嘴上说喜欢“简洁”，但实际行为数据显示功能丰富的页面停留时间更长、转化更高，则应相信行为数据\",\n        \"**边界条件**\"\
    ,\n        \"- 行为数据也可能失真：样本偏差、统计口径错误、短期诱导行为等都会误导判断\",\n        \"- 该方法适用于已有用户基础、可获取行为数据的阶段，不适用于从零到一的全新业务探索\"\
    \n      ],\n      \"sources\": [\n        {\n          \"paper\": \"004_商业设计思维\"\
    ,\n          \"role\": \"origin\"\n        }\n      ],\n      \"excerpts\": [\n\
    \        \"洞察人性找到增长爆破点不要信用户嘴要信用户腿\"\n      ]\n    },\n    {\n      \"no\": 7,\n\
    \      \"name\": \"定价权分野 —— 标品无定价权，非标品有定价权\",\n      \"points\": [\n        \"\
    **为什么需要这个概念？**\",\n        \"- 很多电商创业者困惑：为什么同样卖货，有的平台能赚钱，有的平台只能打价格战？\",\n    \
    \    \"- 归根结底是定价权的有无，决定了利润空间和竞争策略\",\n        \"- 需要一个清晰的判断标准来指导业务模式的选择和定价策略的制定\"\
    ,\n        \"**核心定义**\",\n        \"- 定价权分野定律是指：交易型电商（卖标品）通常没有定价权，价格由市场决定；内容型电商（卖非标品）通常拥有定价权，可以通过内容赋予产品附加值来主导价格\"\
    ,\n        \"**关键性质**\",\n        \"- 品类决定权：标品（标准化程度高的产品）价格透明，无差异化空间，定价权弱；非标品（个性化、差异化产品）价格不透明，有溢价空间，定价权强\"\
    ,\n        \"- 平台类型绑定：交易型平台的竞争核心是价格与效率，内容型平台的核心是信任与附加值\",\n        \"- 利润传导：无定价权导致利润被压缩，有定价权则带来更高的毛利空间\"\
    ,\n        \"**典型例子**\",\n        \"- 京东卖3C标品（手机、电脑），利润极薄；小红书/抖音卖非标品（设计款服饰、手工艺品），毛利可达数倍\"\
    ,\n        \"- 同样的茶叶，在交易型电商平台卖100元/斤，在内容型平台通过故事化包装可卖500元/斤\",\n        \"**边界条件**\"\
    ,\n        \"- 标品也可以通过品牌化、服务化来获取部分定价权，但天花板明显低于非标品\",\n        \"- 该定律描述的是典型情况，非标品也可能因过度竞争而被“标品化”\"\
    \n      ],\n      \"sources\": [\n        {\n          \"paper\": \"004_商业设计思维\"\
    ,\n          \"role\": \"origin\"\n        }\n      ],\n      \"excerpts\": [\n\
    \        \"交易型电商卖标品无定价权，内容型电商卖非标品有定价权\"\n      ]\n    },\n    {\n      \"no\"\
    : 8,\n      \"name\": \"创始人认知瓶颈 —— 公司的高度，由创始人的视野焊死\",\n      \"points\": [\n \
    \       \"**为什么需要这个概念？**\",\n        \"- 企业成长到一定阶段后停滞，往往不是市场问题、不是团队问题，而是创始人的认知边界限制了企业的天花板\"\
    ,\n        \"- 需要明确创始人认知在业务系统中的核心地位，才能对症下药\",\n        \"- 防止企业把战略失误与组织问题误诊为执行问题，从而反复试错\"\
    ,\n        \"**核心定义**\",\n        \"- 创始人认知瓶颈是指：创始人（核心决策者）的认知水平是业务发展的最大瓶颈，业务的高度无法超过创始人认知的天花板\"\
    ,\n        \"**关键性质**\",\n        \"- 天花板效应：业务的长期增长上限由创始人认知决定，团队优秀也无法突破这层限制\"\
    ,\n        \"- 杠杆放大：创始人认知的微小提升，通过决策传导可放大为业务的巨大改善\",\n        \"- 战略关联：创始人需“战略向上看两级，执行向下落两层”，即认知要超越当前业务层级，同时落地要深入执行细节\"\
    ,\n        \"**典型例子**\",\n        \"- 创始人只关注执行细节（如具体运营动作）而缺乏行业格局认知时，企业会陷入低水平重复，难以突破规模瓶颈\"\
    ,\n        \"- 创始人认知停留在“卖货思维”时，企业做再大也只是贸易商；认知升级为“品牌思维”后，企业才开始建立护城河\",\n      \
    \  \"**边界条件**\",\n        \"- 创始人认知并非唯一瓶颈，组织能力、资本约束、市场环境等同样构成限制\",\n        \"\
