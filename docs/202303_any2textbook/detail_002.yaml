- 'no': 5
  name: 知识宽度与深度分工 —— 用宽度找路，用深度造城
  points:
  - '**为什么需要这个概念？**'
  - '- 很多人以为资料堆积越多就越厉害，结果变成了互联网上的“信息搬运工”，没有内化没有沉淀'
  - '- 也有人只盯着一本书反复啃，知识单一、视野狭窄，遇到跨界问题就束手无策'
  - '- 两者都不是健康的知识结构——需要搞清楚宽度和深度的分工与边界'
  - '- 理解这个分工，才能解释为什么搜商和资料整理不是一回事，而是互补的两种能力'
  - '**核心定义**'
  - '- 知识深度指通过资料整理（分类、提炼、体系化）获得的对某一主题的逻辑化、结构化的理解'
  - '- 知识宽度指通过搜索技能获得的、围绕某一主题的覆盖面广泛的碎片化信息与视野'
  - '- 二者相加才是完整的知识获取系统：搜索负责铺路，整理负责建城'
  - '**关键性质**'
  - '- 互补性：搜索获得的宽度是散点，整理提炼的深度是骨架；宽度提供候选，深度做出判断'
  - '- 时间差异：搜索见效快（几分钟拿到几个来源），整理见效慢（几小时到几天形成结构），但整理的成果可复用'
  - '- 容量的不对称性：宽度可以无限扩张（搜索几乎无边界），深度受制于个人注意力与认知容量（必然有边界）'
  - '- 转化关系：宽度经过提炼筛选后，会沉淀为深度；深度在遇到新问题时，会指引新的搜索方向（反向拉动宽度）'
  - '**典型例子**'
  - '- 新人研究“私域流量”：先靠搜索获得20篇观点不一的文章（宽度），然后归类出“定义-工具-案例-数据”四个文件夹（整理的开始），最后在反复读写中形成自己的“私域冷启动SOP”（深度）'
  - '- 一位有深度的老专家遇到一个陌生领域的子问题，他的深度框架告诉他缺哪一块拼图，因此可以极其精准地发起搜索（深度反向指导宽度）'
  - '**边界条件**'
  - '- 当一个人只搜索不整理，会长期停留在“知道很多但理解不深”的浮萍状态——典型症状是聊天能侃侃而谈，落笔写不出体系'
  - '- 当一个人只整理不搜索，会在既有体系的边际内内卷——典型症状是笔记厚厚一摞，但对新变化反应迟钝'
  - '- 面对全新的、没有任何存量资料的主题（比如一个刚诞生的领域），深度无从整理起——此时宽度搜索是唯一入口，先把散点攒够再说'
  - '- 宽度搜索有边际效用递减：当围绕一个主题搜到几十个重复来源后，再多搜一个并不会带来新信息，此时应转入整理的深度消化阶段'
  sources:
  - paper: 017_搜商
    role: origin
  excerpts:
  - 资料整理可以让你拥有知识的逻辑与深度，搜索技能可以让你拥有足够的知识宽度。
- 'no': 6
  name: 搜商的边界 —— 找到≠想到，检索≠思考
  points:
  - '**为什么需要这个概念？**'
  - '- 搜商概念大热，很多人误以为只要搜商高，就万事大吉，成为全能高手'
  - '- 这种过度神化会让学习者忽视真正的短板——深度思考与创造力，从而自欺欺人'
  - '- 明确边界不是为了贬低搜商，而是为了让学习者在使用它时更有分寸，知道何时该停下搜索、开始思考'
  - '- 任何心智模型或技能（本课的商业设计思维也是如此）都有不可替代和不能替代的部分，搜商也不例外'
  - '**核心定义**'
  - '- 搜商的边界指：搜商能高效解决“找到答案”的问题，但无法解决“理解答案”“质疑答案”“创造新答案”的问题'
  - '- 搜商的本质是检索与汇集，而不是理解与生成'
  - '**关键性质**'
  - '- 因果性：搜索复制的是他人的知识，思考产出的是自己的洞见——前者永远不能替代后者'
  - '- 时效性：搜到的是已有的、过去的答案，无法应对尚未被任何人写下来的新问题'
  - '- 鉴伪依赖：搜索能提供多个版本，但版本之间的真伪高下需要个人判断力，而判断力恰恰不是搜出来的'
  - '- 单向性：搜商把信息从外部搬到眼前，而思考把信息从眼前内化到系统里——搬过来不构成拥有'
  - '**典型例子**'
  - '- 一位调研者搜到了所有关于“直播带货利润低”的分析文章，但面对自家业务到底该不该做这个决策，任何一篇文章都无法替他定夺——因为答案依赖他的成本结构、资源和时机'
  - '- 搜到了所有关于某算法的优秀讲解，但让他独立设计一个新的改进算法时，搜索无能为力——这需要创造力与深度理解'
  - '**边界条件**'
  - '- 对于价值判断类问题（该不该、好不好、值不值），搜商只能提供事实依据，价值排序必须由个人完成'
  - '- 对于混合复杂问题（战略选择、产品定位），搜商提供的碎片化信息需要先被深度思考整合，边界尤其明显'
  - '- 当搜索结果极度匮乏（冷门问题或前沿问题），搜商的起点效用消失，此时应转向实验、访谈与推理，而不是反复换词重搜'
  - '- 当搜索结果高度一致（群体共识已成），要警惕信息茧房：恰恰是这种时刻，搜商越高效越危险，因为独立思考的机会被悄悄漏掉了'
  - '- 搜商无法回答“为什么”的终极追问：它能告诉你什么是什么，但不能告诉你为什么世界会是这个样子——后者依然是人类专属的思考领域'
  sources:
  - paper: 017_搜商
    role: origin
  excerpts:
  - 搜商就是通过搜索技能解决问题的能力。
  - 资料整理可以让你拥有知识的逻辑与深度，搜索技能可以让你拥有足够的知识宽度。
- 'no': 7
  name: 从搜商到商业设计 —— 组装你的个人知识操作系统
  points:
  - '**为什么需要这个概念？**'
  - '- 前面六节都在讲搜商这个技能，但如果它只是一门孤立的技巧，离开课堂就会很快被遗忘'
  - '- 任何技能都应当能被装进一个更大的操作系统里，与其他能力协作，才算真正有生命力'
  - '- 本书第一章讲“商业设计思维”，本章讲“搜商”，看似不相关，实则是一条价值链的两端：商业设计制定方向，搜商提供燃料'
  - '- 本节给出一个升级视角：把“心法-渠道-技术”的搜商，与“整理-理解-创造”的思维链路打通，组装成个人知识操作系统'
  - '**核心定义**'
  - '- 个人知识操作系统指一套“获取→整理→消化→输出→创造”的完整知识处理流程，搜商是它的输入模块（获取层）'
  - '- 它的运行逻辑是：搜索获取宽度（输入）→ 资料整理沉淀深度（加工）→ 深度理解驱动设计（决策与创造）'
  - '- 从搜商到商业设计的桥梁在于：商业设计需要海量案例、数据和规律为输入，而搜商是获取这些输入的最快引擎'
  - '**关键性质**'
  - '- 模块化：操作系统由各司其职的模块组成（输入、存储、处理器），搜商只是其中一个模块，不独占'
  - '- 顺序性：先宽度后深度再创造，层层递进顺序不可颠倒（跳过深度的创造往往空中楼阁）'
  - '- 闭环性：创造产出的新认知，会变成下一次搜索的新关键词——输出反哺输入，形成循环'
  - '- 杠杆放大：在一个有方向（商业设计）的操作系统里，搜商效率会被放大数倍——因为你永远知道搜来的东西要用在哪里'
  - '**典型例子**'
  - '- 做一次商业设计前，用搜商快速扫描行业报告（宽度）、用整理工具形成竞品矩阵（深度）、然后在矩阵里发现空白机会点（创造）'
  - '- 反向例子：一个没有方向、只会疯狂搜索的人，会陷入“收集癖”旋涡——资料不少，但从没驱动过任何决策，这正好暴露了操作系统缺少方向盘（缺商业设计的指引）'
  - '**边界条件**'
  - '- 当搜索的信噪比极低（如垃圾信息围城）时，操作系统需要更强的筛选模块（判断力）来过滤，否则会被噪声淹没'
  - '- 操作系统并非人人自洽：有人擅长搜不擅长想（宽度极宽深度极浅），有人擅长想不擅长搜（深度极深但视野极窄）——需要刻意补齐短板'
  - '- 极简主义者可以不需要完整操作系统，但至少要有一条自己的“搜索→思考→输出”链路，否则所有信息都只是过眼云烟'
  - '- 当外部信息本身不够用（如市场处于完全没有先例的剧变期），操作系统需要切换输入源——从搜文献转向做实验、从搜索的‘假设已有’转向亲自造答案的“创造未知”'
  - '- 这个操作系统是有磨损的：不更新渠道地图、不检讨思维习惯，系统会老化失灵，需要周期性自省和升级'
  sources:
  - paper: 017_搜商
    role: origin
