best_shape: book
if_force_book_need: 需补充元叙事主线（普通个体从0到1的赚钱系统搭建），串联认知类章与平台实操章、垂直案例章，并补充过渡与总结、把降权素材外链转化为自足文字
not_recommended_reasons:
- 做知识库会降低方法论价值密度；系列形式无法承载体系化实操框架
not_recommended_shapes:
- kb
- series
reason: 素材聚焦商业思维构建、项目拆解与个体变现方法论，含商业设计思维100条、搜商等原创底层框架，及数十篇平台运营/内容创作/垂直行业实操的系统案例，具备稳定母题、明确读者（创业者/副业者/内容创作者）和足够厚度，可支撑6-10章成书。
