- 'no': 1
  name: 商业设计思维 —— 在第一天就决定输赢
  desc: 本章从"商业是设计出来的"这一底层论断出发，带你理解商业设计思维为何是创始人与管理者的核心心智模型，并系统拆解战略、业务、组织、增长中的关键判断框架。
  nodes:
  - 'no': 1
    name: 什么是商业设计思维
    desc: 用"建筑蓝图"类比理解：如同建筑物在动工前就由图纸决定结构，业务的盈利性在设计之初就已注定，后续执行只是在兑现设计。
    role: motivation
    src:
    - paper: 004_商业设计思维
    - paper: 004_商业设计思维
  - 'no': 2
    name: 商业设计决定论的形式化
    desc: 从"业务能否赚钱从第一天确定"的命题出发，引出商业设计作为一切经营活动的先验约束条件，并给出其与创始人认知、战略层级的关系边界。
    role: definition
    src:
    - paper: 004_商业设计思维
    - paper: 004_商业设计思维
  - 'no': 3
    name: 判断业务本质的三形态模型
    desc: 将业务拆分为改造型、替代型、创造型三种原型，作为分析任何商业模式的起点；配合金字塔两端理论，指导业务定位的取舍。
    role: method
    src:
    - paper: 004_商业设计思维
    - paper: 004_商业设计思维
  - 'no': 4
    name: 经营策略的四维聚焦法则
    desc: 面对广度、深度、高度、速度四种策略维度，聚焦最优解：每阶段最多选择两种，避免资源分散，实现战略上的"减法"。
    role: method
    src:
    - paper: 004_商业设计思维
  - 'no': 5
    name: 把目标"过六遍"：业务目标六遍法
    desc: 以"至少重复推敲六遍"的刻意流程，确保业务目标的合理性与团队共识，将模糊愿景转化为可执行、可验证的里程碑。
    role: method
    src:
    - paper: 004_商业设计思维
  - 'no': 6
    name: 增长爆破点：信用户腿而非嘴
    desc: 揭示人性洞察的正确姿势：依据用户实际行为数据而非口头反馈来寻找增长关键点，并配合标准化输出与平台选择实现规模化。
    role: method
    src:
    - paper: 004_商业设计思维
    - paper: 004_商业设计思维
    - paper: 004_商业设计思维
  - 'no': 7
    name: 定价权的分野：交易型与内容型电商
    desc: 通过"标品无定价权、非标品有定价权"的对比，展示商业设计在不同品类中的定价逻辑差异，并映射到选品与内容策略。
    role: proof
    src:
    - paper: 004_商业设计思维
  - 'no': 8
    name: 创始人认知：业务的最大瓶颈
    desc: 指出创始人认知是业务天花板，并以"战略向上看两级、执行向下落两层"作为突破方向；同时用"3-6个月无进展即方向错误"作为早期预警信号。
    role: limitation
    src:
    - paper: 004_商业设计思维
    - paper: 004_商业设计思维
  - 'no': 9
    name: 从商业设计到知识体系：迁移能力优先律
    desc: 将商业洞察延伸至个人成长：比学习能力更重要的是迁移能力；通过"碎片化增广度、结构化增深度"与知识五层次体系，构建可复用的认知资产。
    role: extension
    src:
    - paper: 004_商业设计思维
    - paper: 004_商业设计思维
    - paper: 004_商业设计思维
  - 'no': 10
    name: 人才三层视角与造物者思维
    desc: 以"使用者/探索者/造物者"三层视角评估人才，并主张招聘"参与者"——将商业设计思维落实到组织选人用人的关键决策中。
    role: extension
    src:
    - paper: 004_商业设计思维
- 'no': 2
  name: 搜商 —— 在信息洪流中锻造"找得到"的能力
  desc: 本章引入"搜商"概念，将其拆解为搜索心法、搜索渠道、搜索技术三个可训练的核心，并与资料整理相结合，构成知识宽度与深度兼备的学习基础设施。
  nodes:
  - 'no': 1
    name: 为什么需要搜商
    desc: 用"给大脑装外挂"类比理解：在信息过载时代，搜索能力决定了你能调用的知识边界，是比记忆更高效的信息获取方式。
    role: motivation
    src:
    - paper: 017_搜商
  - 'no': 2
    name: 搜商的精确定义
    desc: 将搜商定义为"通过搜索技能解决问题的能力"，并明确其与学习能力、资料整理能力的边界与互补关系。
    role: definition
    src:
    - paper: 017_搜商
    - paper: 017_搜商
  - 'no': 3
    name: 搜商三核心框架
    desc: 以"搜什么—去哪搜—怎么搜"三问构建系统化搜索方法论，分别对应心法、渠道、技术三个训练维度，形成可复用的提问路径。
    role: method
    src:
    - paper: 017_搜商
    - paper: 017_搜商
    - paper: 017_搜商
    - paper: 017_搜商
  - 'no': 4
    name: 搜索心法：明确"搜什么"
    desc: 训练在发起搜索前先澄清需求与目标的能力，将模糊问题转化为可检索的明确问题，是提升搜索效率的第一步。
    role: method
    src:
    - paper: 017_搜商
  - 'no': 5
    name: 搜索渠道：知道"去哪搜"
    desc: 建立多样化的信息源地图，从通用引擎到垂直社区、学术库与专业平台，根据问题类型匹配合适的渠道，避免单一依赖。
    role: method
    src:
    - paper: 017_搜商
  - 'no': 6
    name: 搜索技术：掌握"怎么搜"
    desc: 掌握关键词组合、布尔运算、限定语法等检索技巧，从"搜得到"进阶到"搜得准"，提升结果的相关性与信噪比。
    role: method
    src:
    - paper: 017_搜商
  - 'no': 7
    name: 知识宽度与深度的分工
    desc: 论证"资料整理给逻辑深度、搜索技能给知识宽度"的互补结构：两者结合构成完整的知识管理闭环，防止"有广度无深度"或"有深度无视野"。
    role: proof
    src:
    - paper: 017_搜商
  - 'no': 8
    name: 搜商的边界与常见误区
    desc: 指出单靠搜索无法替代深度思考与系统整理，警惕"搜到即掌握"的错觉；将搜商定位为工具而非目的，避免信息收集癖。
    role: limitation
    src:
    - paper: 017_搜商
  - 'no': 9
    name: 从搜商到商业设计：构建个人知识操作系统
    desc: 将搜商与商业设计思维中的知识五层次体系、迁移能力优先律贯通，形成"搜索获取宽度—整理沉淀深度—设计驱动创造"的完整能力链路。
    role: extension
    src:
    - paper: 017_搜商
    - paper: 004_商业设计思维
    - paper: 004_商业设计思维
