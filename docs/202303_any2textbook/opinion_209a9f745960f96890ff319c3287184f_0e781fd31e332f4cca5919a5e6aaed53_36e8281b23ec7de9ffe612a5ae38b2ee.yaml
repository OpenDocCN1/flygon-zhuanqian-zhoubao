to_delete:
- 我的时间管理原则与实践（依赖外链，内容单薄，与主线关联弱）
to_merge_rewrite:
- 视频号0到7万粉丝、知乎日引粉3000霸屏截流、爆款笔记数据分析60%爆文率：合并为'平台引流矩阵'一章，重写去除时效性过强的具体数字，提炼可复用的底层公式
- 调教200多个ChatGPT模型经验与ChatGPT+BOSS直聘挖掘项目：合并为'AI提效与挖掘'组合，统一赋能后端经营与项目挖掘
to_supplement:
- 元叙事主线的引入与收束（每章开头的承上启下、结尾的行动清单）
- 后端交付/团队管理/规模化经营的综合章节（现素材偏前端引流）
- 一个贯穿全书的深度主案例（可结合同城相亲或春茶，从挖掘到后端全链路还原）
- 每章配套的思维导图与SOP模板（尤其搜商词库、客户筛选流程）
retain_principles: 凡能提炼出章节级认知或方法论、且有真实数据颗粒度的素材一律保留；纯时效热点、依赖外链、无法脱离原文的碎片条目降级或删除；同平台同质化内容合并重写，保留底层公式、剔除过期参数。
steps:
- 第一步：与作者确认元叙事主线与目标读者画像，锁定最终书名与副标题
- 第二步：按新结构搭建全书框架，将20个保留素材映射到对应章节，标注每章需补写的过渡与行动清单
- 第三步：选取'同城相亲'或'春茶'作为主案例，撰写第6章打透样板，验证写作模式后推进全书
risks:
- 平台算法类内容时效衰减快（视频号/知乎/小红书章节），需在写作策略上以'底层逻辑+通用公式'为主，减少对特定数字的依赖
- 大量案例来自作者个人视角，需补充1-3个第三方深度访谈案例以增强可信度与普适性
- 内容体量较大，需严格把控各章节篇幅均衡，避免前端引流部分过重、后端经营偏薄
next_product: 全书写作蓝图（细化到每章的素材映射表、补写清单、写作优先级及预计字数）
default_output_file: 全书初稿.md
writing_approach: 先框架后内容、先样板后铺开：写作时以'认知重塑→方法论拆解→真实案例→行动清单'四段式节奏推进，强调可操作性与颗粒度，用对话感强的第二人称降低阅读门槛。
