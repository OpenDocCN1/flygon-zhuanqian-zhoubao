- file_path: docs/202303/20230328_090.md
  title: 《专访 23 岁的 00 后创业者乔合的创业心路历程》
  summary: 亦仁对 00 后创业者乔合的专访，乔合分享了自己 7 年围绕学生私域做知识付费、流量变现的创业经历，以及如何选项目、建 IP、定客单价的思考。
  core_question: 如何围绕学生群体建立私域 IP 并实现知识付费变现？
  key_judgment: 学生群体是被低估的付费市场；通过低客单价（188 元）让用户快速回本建立信任，再逐步引导高客单价产品，是可持续的变现策略；项目选择需考量操作难度、平台规则、绿色度、可批量化、周期与利润。
  depth: medium
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 重复（私域变现案例多）
  - 口语化（对谈形式）
  screening_conclusion: retain
  reason: 作为对谈专访，内容详实地呈现了一个垂直群体的 IP 变现模式和选项目方法论，特别是“低门槛快回本”的定价策略具备启发性，可作为案例或手册章节素材。
