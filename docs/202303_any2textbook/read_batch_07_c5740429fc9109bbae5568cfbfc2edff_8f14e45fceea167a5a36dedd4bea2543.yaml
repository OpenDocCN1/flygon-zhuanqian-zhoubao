- file_path: docs/202303/20230328_085.md
  title: 《从水果店倒闭老板到千万级站外服务商我是怎么做到的？》
  summary: 作者 Rick 回顾了自己从开水果店失败、做亚马逊亏损，到转型成为站外推广服务商（海豚出海）的创业历程，并系统介绍了亚马逊站外推广的渠道、策略、方法以及工具化平台。
  core_question: 亚马逊卖家为什么要做站外推广？怎么做？以及如何从卖家转型为服务商？
  key_judgment: 站外推广不仅是清库存的手段，更是辅助亚马逊运营（激活链接、配合秒杀、维护排名）和打造品牌的重要途径，其终局是品牌；透明化、自助化的工具是站外推广服务的发展方向。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 重复（亚马逊运营主题与其他素材部分重叠）
  - 格式预处理（图片无法利用）
  - 推广倾向（为自家网站引流）
  screening_conclusion: retain
  reason: 除了作为个人逆袭案例外，文章对亚马逊联盟、站外推广渠道（FB群组、Deal站、KOL）、找服务商 vs 自建资源等有系统化梳理和深刻洞察，具备成为教程章节的潜力。
- file_path: docs/202303/20230328_086.md
  title: 《聊聊你做闲鱼二手书项目失败的 100 种可能性》
  summary: 作者老瞿以闲鱼二手书项目为例，列举了新手常见的失败原因，包括低估难度、不尊重平台规则、迷恋技术手段、盲目寻找货源以及将责任推给他人等，并以此强调心态和执行的重要性。
  core_question: 为什么大多数人做闲鱼二手书项目会失败？成功的关键是什么？
  key_judgment: 项目失败往往不是因为项目本身不行，而是源于心理准备不足、投机取巧、逃避业绩压力；比技巧更重要的是对规则的敬畏和将精力聚焦于流量与销售。
  depth: medium
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 口语化
  - 重复（闲鱼项目类文章多）
  screening_conclusion: retain
  reason: 通过反面案例来剖析副业/项目失败的心理和操作误区，具有较强的通用性和警示意义，适合作为独立章节或手册中的一部分，核心价值在于“避坑指南”。
