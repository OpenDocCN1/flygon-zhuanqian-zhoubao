- file_path: docs/202303/20230328_081.md
  title: 《成人用品外卖到底赚不赚钱？做了 2 个月的经验分享》
  summary: 作者以哈尔滨为样本，分享了自己经营成人用品外卖店两个月的经验，包括项目形式、市场前景、利润测算、准备工作和运营核心（选址与模仿同行）。
  core_question: 成人用品外卖作为一个副业项目，是否赚钱？如何从零开始运营？
  key_judgment: 该项目的核心在于选址（依托夜生活密集区）和模仿本地优秀同行，而非技术创新；高毛利与隐蔽配送解决了用户痛点，但运营细节与精力投入是现实门槛。
  depth: medium
  suggested_destination: case
  possible_shape: pool
  risks:
  - 时效性
  - 口语化
  - 格式预处理（图像数据无法利用）
  screening_conclusion: retain
  reason: 作为细分蓝海领域的实操案例，提供了具体的利润测算和运营思路（选址、模仿学习），有参考价值；但内容口语化明显，且缺少供应链与合规性深挖，适合作为案例素材而非核心章节。
- file_path: docs/202303/20230328_083.md
  title: 《如何通过精细化运营拯救一个亏钱的亚马逊产品》
  summary: 十二年跨境电商从业者拓跋勇，通过四个案例论证精细化运营的价值，核心是梳理流量结构、精准识别流量词，并总结出一套转化公式（Credibility+USP+User
    benefit+Question Killer+Social proof+Lure）。
  core_question: 在亚马逊流量成本高企、竞争加剧的背景下，如何通过精细化运营挽救亏损产品？
  key_judgment: 大多数卖家失败源于停留在粗放搜索流量阶段，盲目投放广告；先搞清产品流量结构（区分相关词与无关词），再配合销售转化公式，能以更低成本获得更高转化，甚至避免清仓。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 重复（与其他跨境电商文章可能重叠）
  screening_conclusion: retain
  reason: 提供了系统性的方法论（流量词划分、转化公式）和真实案例验证，逻辑清晰，超出个人经验分享层面，具备成为教程或书册章节的深度。
