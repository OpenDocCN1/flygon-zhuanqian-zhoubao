dimensions:
- name: 主题集中度
  score: 4
  evidence: 素材大多围绕'个人商业/副业赚钱与创业实践'这一大主题展开（商业认知、引流、项目挖掘、运营、知识付费等），但有相当部分涉及'私域、直播、小红书/知乎/视频号等平台'细分场景，旁支较多
- name: 核心命题清晰度
  score: 3
  evidence: 可提炼出'普通人可通过系统化设计与执行来构建可盈利的副业/商业模式'这一主张，但素材中多为具体案例/方法论，需进一步收束提炼为一句话核心命题
- name: 目标读者清晰度
  score: 4
  evidence: 目标读者指向'想兼职/副业/轻创业的普通人（含职场人、体制内）'较明确，但部分素材涉及具体垂直领域（如相亲、旧书、茶），读者范围会略有分化，需做取舍
- name: 内容厚度与互补性
  score: 4
  evidence: 素材覆盖认知→选品/找项目→流量获取→转化/成交→运营/复盘完整链路，且案例与SOP互补性强，可支撑章节体系；但有部分素材（如多个平台引流法）存在内容重复与断层（缺后端交付/团队章节）
- name: 区分度与新颖性
  score: 4
  evidence: 有较多新颖方法论与原创概念（如'搜商'、'调教200多个ChatGPT模型经验'、'ChatGPT+BOSS直聘挖掘项目'、评论区需求词库挖掘），表达与案例有个性；但部分平台引流/竞价内容同质化风险偏高
- name: 时效风险
  score: 3
  evidence: 不少素材依赖当前热门平台/工具（小红书、知乎、视频号、ChatGPT、BOSS直聘）与算法红利，部分细节会快速过时；但商业认知类与行业洞见类（相亲、旧书、茶）常青性好，整体需降权处理
- name: 可持续扩写空间
  score: 4
  evidence: 素材接近半本体量，且可按'项目挖掘→引流→成交→运营→典型案例'自然扩展至完整书稿；但需补充总纲/底层认知章并重写整合部分平台性内容
total_score: 26
conclusion: potential
recommended_shape: book
alternative_path: 先做一套高客单价体系化视频课（定价策略贴近素材人群），再在课程基础上扩展为书籍；或联合推出1本主书+多本专题小册子
next_steps:
- 提炼统一核心命题：将素材整合为'普通人构建可盈利副业的系统作战法'一类主张，并拆分为'认知—选品—流量—成交—长效运营'五大篇章
- 重写整合平台性内容：将各平台引流章节降权，合并为一章'多平台引流矩阵'，去除重复与强时效细节
- 补充缺失章节：新增'后端交付与客户维护''团队组建/外包''持续经营与翻车避坑'等章节，弥合断层
- 筛选2-3个最完整的高价值案例（如百度竞价冷门项目、家庭教育赛道、私域卖茶等）作为贯穿全书的深度案例，并标注其时效期数
