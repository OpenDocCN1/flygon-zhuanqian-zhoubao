- file_path: docs/202303/20230328_003.md
  title: 《员工不会完全说真话，你要努力了解公司的真相》
  summary: 作者以小马宋的创业46条之一为引，指出员工不会完全对老板说真话，老板可能是最后一个知道公司出问题的人，因此需要主动、多渠道了解公司真相。文章以袁世凯为例，强调信息失真与立场差异，并给出识别他人诚意、关注公司动态的具体建议，指出老板应有承受真相的胸襟与觉察能力。
  core_question: 老板如何克服信息不对称，了解公司内部真实情况（尤其是员工不满）？
  key_judgment: 老板应认识到员工基于自保、面子、立场等原因不会全说真话，且自身可能是最后一个知道危机的人；因此不能天真依赖直接汇报，需要主动建立多源信息渠道，并具备辨别言语诚意的能力（如“没有痛快答应即拒绝”），这是创业管理者必修的功课。
  depth: medium
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 其他：内容较简短、偏随笔，缺乏具体操作框架，可能需扩充案例与方法论
  screening_conclusion: retain
  reason: 内容质量高，观点具有普遍性与启发性，直击创业管理痛点；虽简短但核心信息密度高，可作章节素材，需补足实操细节。
- file_path: docs/202303/20230328_004.md
  title: 《商业设计思维 100 条》
  summary: 作者基于多年战略咨询与投资经验，将《商业设计》特训营课程内容整理为100条商业认知，涵盖战略创新、组织管理、业务增长三大模块，每条附有实战背景与教训，旨在帮助创业者建立从0-1-100的系统商业思维框架。
  core_question: 创业者如何构建系统的商业思维，以实现业务从0到1再到100的持续突破？
  key_judgment: 商业本质是设计出来的，一个业务能否赚钱由第一天就已确定；创始人认知是最大瓶颈，因此需要建立从战略、组织到业务的完整底层逻辑体系，并以标准化、结构化方式进行思考与迭代。
  depth: high
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 其他：条目式内容，缺乏深度案例与逻辑串联，结构化不强，需体系化加工，避免碎片化呈现
  screening_conclusion: retain
  reason: 内容价值密度极高，覆盖商业全链条，大量可复用、可验证的判断，是最具成书潜力的核心素材；但需进一步解构、补充案例与逻辑线，以形成更大的知识体系。
- file_path: docs/202303/20230328_006.md
  title: 《股权类的生意怎么更好做？》
  summary: 作者以同学 Shiver 的创业股权分配难题为引，记录与资深顾问 Max 的交流过程，呈现了如何通过“记账+利润线+里程碑投资”的机制设计，解决小公司咨询收费难题，既避免固定收费负担，也规避股权绑定的弊端，实现双赢。
  core_question: 咨询顾问如何以合理且不尴尬的方式介入早期公司并收取费用？初创合伙人如何公平分配股权？
  key_judgment: 针对小公司支付能力弱与咨询顾问介入难的两难，创造性提出“记账+利润线+里程碑投资”的机制：以市场价记账，公司存活或超过利润线后再折算现金或股权，甚至可约定后续投资节点，既解决收费又降低风险，本质是贝恩咨询+投资的嵌套模式。
  depth: medium
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 重复：与股权分配、咨询收费主题可能有其他素材重复
  - 其他：核心方案一笔带过，关键细节因合规原因省略，案例深度不足
  screening_conclusion: retain
  reason: 提供了一个非常独特的咨询收费+股权设计机制，案例真实且具启发性；但关键环节处理细节未展开，适合作为较完整的商业案例/谈判故事素材，而非核心方法论。
- file_path: docs/202303/20230328_008.md
  title: 《赚钱就是在帮别人，就是在利他》
  summary: 亦仁指出很多圈友对赚钱存在心理偏见，认为赚别人钱不好意思。他秉持观点：在合法合规前提下，任何交易都在创造价值，因为只有对方认为获得价值高于付出金钱，交易才会发生。赚钱本质是利他与为社会做贡献。
  core_question: 如何破除赚钱的心理障碍？赚钱是否等于利他？
  key_judgment: 赚钱是利他的本质在于交易创造双方价值：没人会购买自认不值的东西。赚钱的心理障碍是认知偏差，只要合法合规，赚取利润即是提供服务与价值交换，以此重塑对商业的正当性认知。
  depth: low
  suggested_destination: kb_entry
  possible_shape: kb
  risks:
  - 重复：观念类金句，易与类似主题重复
  - 口语化：表述简单，缺乏论证深度
  screening_conclusion: retain
  reason: 虽简短、深度低，但对破除常见商业心理障碍有认知引导作用的独特价值，适合作为知识库中价值观导向的金句条目。
- file_path: docs/202303/20230328_009.md
  title: 《什么样的问题才是好问题？》
  summary: 小马宋分享李笑来关于好问题的三个标准：无法通过搜索得到答案、有充足的背景信息支撑、提问姿态是讨论而非索取。通过反面例子（如只问“在哪、怎么买”）说明提问本身能体现一个人的能力与思维方式。
  core_question: 如何提出一个高质量、值得回答的好问题？
  key_judgment: 好问题的核心标准是：无法通过简单搜索解决、具备充足背景信息、以讨论而非索取姿态提出，体现提问者为问题付出的思考与努力。提出好问题是一种稀缺能力，是学霸与高效沟通者的关键特质。
  depth: medium
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 重复：网上可能有类似内容的常见方法论
  - 其他：框架清晰但偏个人经验分享，缺乏实证与案例支撑
  screening_conclusion: retain
  reason: 提供可复用的提问评判框架，覆盖职场/学习等多场景；虽非原创性极强，但框架清晰、实用性强，可作为沟通/思维方法的章节素材。
- file_path: docs/202303/20230328_010.md
  title: 《过程本身就是奖赏》
  summary: 亦仁阐述自己不把任何人当竞争对手、不产生竞争感或危机感，不嫉妒、不自卑也不骄傲，就是专注做独特、有趣、利他之事，享受过程中的各种感受，认为过程本身就是最大的奖赏，而非追求结果最大化。
  core_question: 如何避免被竞争焦虑裹挟？如何在创业/人生中保持专注与心态平和？
  key_judgment: 心流的创造状态来源于专注做事本身而非竞争比较：放下竞争感、对结果的执念与收益最大化追逐，将意义内置于过程之中，反而能积淀长期的竞争力与生命体验。
  depth: medium
  suggested_destination: kb_entry
  possible_shape: kb
  risks:
  - 口语化：感悟式内容，偏个人状态描述，缺乏普适方法框架
  - 重复：与心流、长期主义主题可能有重复
  screening_conclusion: retain
  reason: 有独特的心法价值，短小精悍但对创业者心态建设有启发意义，可作为知识库中的理念条目或文章的开篇引语。
- file_path: docs/202303/20230328_011.md
  title: 《人们真正注意到你时，是发现过了这么久你居然还在那里》
  summary: 亦仁回顾自己连续七年坚持做社群的经历，认为社群是一种无法轻易放弃的事业，从被迫专注到主动选择专注；他引述成员的话：人们真正注意你不是第一眼看到你站在那里，而是发现过了这么久你居然还在那里。
  core_question: 为什么长期坚持与沉淀是创业与个人成长的关键？如何对抗机会诱惑与频繁切换？
  key_judgment: 长期主义的真正价值在于时间复利与可信赖感：人们真正注意到你时，是你长期在场被看见的时刻；持续专注做一件不能轻易撂挑子的事，会从被迫坚持转化为主动专注，产生深厚积累与品牌信任。
  depth: medium
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 重复：长期主义主题在知识星球中常见，易与其他素材重复
  - 口语化：故事性强，但偏个人经验，缺乏方法论的系统化提炼
  screening_conclusion: retain
  reason: 有较强的故事感染力与普适价值，可作为成书中“长期主义”主题章节的故事引子或案例素材，需辅以方法论体系。
- file_path: docs/202303/20230328_014.md
  title: 《我的时间管理原则与实践》
  summary: 作者分享受《原则》启发建立的时间管理方法论，提出先建立原则、再优化实践的模式，文章链接到飞书详细内容，但正文仅有框架介绍，未提供具体原则与实践细节。
  core_question: 如何建立一套简单有效、可落地的时间管理模式？
  key_judgment: 时间管理的关键是先建立原则，再在原则基础上优化实践；空泛的理论难落地，需要基于个人经验形成一套可操作、可迭代的系统。
  depth: low
  suggested_destination: kb_entry
  possible_shape: kb
  risks:
  - 格式预处理：正文极简，详细内容在外部飞书链接，无法直接作为独立素材使用
  - 其他：缺乏可引用的核心方法论内容
  screening_conclusion: demote
  reason: 文章仅作框架介绍，内容具体性依赖外部链接，孤立易失效；可降级为知识库主题线索，待获取完整内容后再评估。
- file_path: docs/202303/20230328_015.md
  title: 《混圈有什么用？混圈有什么办法少花钱？》
  summary: 作者围绕混圈的价值与低成本混圈方法展开论述，认为圈子是信息、资源与认知来源；提出混圈核心是等价交换与双向奔赴，具体包括付费打钱入场、做免费打工人、资料整理、输出内容等方式，以及线上混圈成本更低、线下组局需谨慎等原则。
  core_question: 如何有效混圈、向上社交，尤其是以低成本方式获得圈内资源与连接？
  key_judgment: 混圈是双向奔赴、等价交换的过程；最直接方式是付费入圈，更高阶路径是通过贡献内容（如资料整理、免费服务）获得长曝光与信任连接，从而积累人脉甚至变现；核心是带着明确目的并先付出后回报。
  depth: high
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 口语化：风格偏随性，结构略松散
  - 时效性：部分平台/工具描述具时效性，需核验
  screening_conclusion: retain
  reason: 对向上社交与混圈有系统且实操的框架，包含多种具体方法，深度高、可落地性强；虽文风口语化，但核心观点结构值得系统整理成章节或小册。
- file_path: docs/202303/20230328_016.md
  title: 《一个工具管理上百个社媒账号？指纹浏览器使用全攻略》
  summary: 文章系统讲解指纹浏览器在跨境电商与多账号运营场景中的应用，涵盖账号隔离方案（VPS/紫鸟），介绍浏览器指纹原理、主流指纹浏览器软件对比、IP类型（住宅/服务器/动态/手机）与收费方式，并给出adspower+阿里云服务器及Hubstudio+动态住宅IP的图文实操教程。
  core_question: 如何在一台电脑上安全、高效地管理同平台多个社媒/跨境账号，避免账号关联？
  key_judgment: 指纹浏览器+独立IP的组合是解决多账号隔离的业内通用方案，其核心是让平台无法通过浏览器指纹与IP识别为同一人操作；选择何种指纹浏览器与IP类型（动态住宅IP
    vs 服务器IP）取决于目标平台风控强度与账号重要程度，同时需注意IP质量与工具搭配等坑点。
  depth: high
  suggested_destination: kb_entry
  possible_shape: handbook
  risks:
  - 时效性：工具软件对比（版本、功能、价格）与平台风控政策会持续变化，图内数据需定期更新
  - 格式预处理：文章大量嵌入截图，正文纯图部分若无原始图片则内容不完整
  screening_conclusion: retain
  reason: 内容覆盖面广、操作步骤详细，具备强实操性与工具选型价值，是知识库/手册类稀缺素材；核心风险在于时效性与图片依赖，需标注更新日期并考虑动态更新机制。
