paper: 20230328_172_百度竞价冷门项目
desc: 该素材系统阐述了百度竞价冷门项目（以百度搜索广告投放获取精准客户并在私域中完成变现）的完整操作策略，提出以'人找货'搜索广告为核心、低价选品+高利润复投为依托的六步骤投放方法论，并给出选品方法、投放技巧、私域承接方式及避坑指南。素材指出同行长期投放的存在即为该项目赚钱的铁证，并将投放思维抽象为跨平台、跨场景的'花钱买客户'底层逻辑。
concepts:
- name: 百度竞价冷门项目
  desc: 以百度搜索广告为核心渠道，选择冷门、价格不透明的高利润产品，通过付费买精准客户并在私域变现、利润复投广告的商业模式。
  is_original: true
  excerpt:
  - 《百度竞价冷门项目投放策略》作者王永超，团队年净利润30W+。核心：百度竞价冷门项目就是花钱去购买客户。
  - 项目核心：搜索广告（人找货）比信息流广告（货找人）更精准。
- name: 人找货 vs 货找人
  desc: 搜索广告（用户主动搜索关键词）比信息流广告（平台主动推送）在购买意图上更精准，是百度竞价冷门项目成立的核心依据。
  is_original: true
  excerpt:
  - 项目核心：搜索广告（人找货）比信息流广告（货找人）更精准。
- name: 同行长期投放作为盈利验证信号
  desc: 若某个关键词或产品已有同行长期持续投放广告，则证明该项目在该领域必然盈利（因为长期亏损无人能坚持）。
  is_original: true
  excerpt:
  - 有同行在长期投放的就不可能不赚钱。
- name: 价格不透明产品
  desc: 适合投放的产品需满足价格不透明（用户难以横向比价）且同行的产品质量不如自己两条标准，以保证利润空间。
  is_original: true
  excerpt:
  - 选品：选价格不透明且同行不如自己的产品（虚拟资料、滋补品、玉石、檀香等）。
- name: 否词（否定关键词）
  desc: 投放过程中通过设置否定关键词来排除无效、不精准的搜索流量，是控制成本、提高转化率的关键投放操作。
  is_original: true
  excerpt:
  - 投放策略从计划→单元→创意→关键词分层；否词很关键；创意多写4-5条。
methods:
- name: __overview__
  desc: 百度竞价冷门项目六步骤总方法论：选品打得过→开户2400广告费→准备微信号→投放广告→微信卖产品→赚的钱复投广告。
  excerpt:
  - 六步骤：选品打得过→开户2400广告费→准备微信号→投放广告→微信卖产品→赚的钱复投广告。
- name: 选品三方法
  desc: 通过淘宝搜索关键词（找虚拟资料/实物/高利润商品）、查看商家店铺、使用5118长尾词工具三个渠道来发现冷门高利润产品。
  excerpt:
  - 选品3方法：淘宝搜索关键词（虚拟资料/实物/高利润）、商家店铺、5118长尾词。
- name: 产品三验证法
  desc: 通过三个指标交叉验证产品可行性：淘宝购买人数证明有需求、百度有长期投放证明能赚钱、百度关键词规划师的搜索量决定赚多少。
  excerpt:
  - 验证产品：淘宝购买人数证明有需求、百度有长期投放证明能赚钱、百度关键词规划师搜索量决定赚多少。
- name: 低价/高价分测策略
  desc: 针对不同价格带产品采取差异化测试方法：低价产品投一单不赚钱就删除；高价产品关注加粉成本能否坚持、同行转化能否抄、测试自身转化率。
  excerpt:
  - 测试产品：低价（投一单利润不赚删掉）、高价（加粉成本能否坚持、同行转化能否抄、测试转化率）。
- name: 投放控制与分层策略
  desc: 开户后先关闭'扩大流量'功能、设置预算防跑飞；投放结构按计划→单元→创意→关键词进行分层管理，否词很关键，创意需多写4-5条。
  excerpt:
  - 获取流量：开户先关掉扩大流量功能、设预算防跑飞；投放策略从计划→单元→创意→关键词分层；否词很关键；创意多写4-5条。
- name: 私域承接页面法
  desc: 低价产品用单页直接成交；高客单价产品需搭建落地页（人物/故事/简介/恐慌/干货/客户反馈/采摘实景/加微信领优惠），且尽量减少用户操作步骤。
  excerpt:
  - 承接私域：低价单页成交；高客单需落地页（人物/故事/简介/恐慌/干货/客户反馈/采摘实景/加微信领优惠）尽量减少用户步骤。
theorems:
- name: 同行持续投放必然盈利定理
  desc: 核心主张：只要有同行在某个关键词或产品上长期持续投放广告，就证明该领域必然赚钱——因为长期亏损的投放是不可能坚持的。
  excerpt:
  - 有同行在长期投放的就不可能不赚钱。
- name: 搜索广告优于信息流广告定理
  desc: 核心主张：搜索广告依托用户主动搜索（人找货），购买意图远强于信息流被动推荐（货找人），因此转化更精准，是冷门项目选择百度的根本原因。
  excerpt:
  - 项目核心：搜索广告（人找货）比信息流广告（货找人）更精准。
- name: 选品优先级定理
  desc: 核心主张：在百度竞价冷门项目中，选品（是否打得过同行）的重要性高于投放技巧，是决定成败的首要环节。
  excerpt:
  - 避坑：选品重于投放、投放页面重于策略、策略重于关键词。
- name: 平台算法不完全可控定理
  desc: 核心主张：投放者无法完全掌控平台推荐/排名算法，因此应在可控范围内放开流量测试时段与地域，并承认投放的本质是概率与成本的博弈。
  excerpt:
  - 投放外番：理解平台算法不可完全掌控；放开流量测试时段地域。
- name: 投放思维普适定理
  desc: 核心主张：'花钱买客户'的投放思维可迁移到生活场景（如送花、买课程、加星球），敢于花钱是底层能力而非仅仅是项目技巧。
  excerpt:
  - 投放思维可应用于生活：送花、买课程、加星球。
findings:
- name: 团队年净利润与项目门槛发现
  desc: '[evidence] 素材宣称作者团队通过此项目实现年净利润30W+，且项目几乎无门槛、主要靠执行力，此结论源于作者团队自身实操经验，非独立第三方数据支撑。'
  excerpt:
  - 作者王永超，团队年净利润30W+。
  - 新人建议：几乎没门槛重点是执行力。
- name: 冷门高利润品类清单发现
  desc: '[evidence] 素材列举了适合投放的冷门产品品类（虚拟资料、滋补品、玉石、檀香等），这些品类共同特征是价格不透明、利润丰厚，为选品提供了实操参考品类。'
  excerpt:
  - 选价格不透明且同行不如自己的产品（虚拟资料、滋补品、玉石、檀香等）。
- name: 落地页高客单元素构成发现
  desc: '[claim] 素材宣称高客单价产品落地页需组合人物/故事/简介/恐慌/干货/客户反馈/采摘实景/加微信领优惠八大元素，并应尽量减少用户步骤——此结论为作者经验性主张，缺乏转化率对比实验数据。'
  excerpt:
  - 高客单需落地页（人物/故事/简介/恐慌/干货/客户反馈/采摘实景/加微信领优惠）尽量减少用户步骤。
- name: 多产品并行测试发现
  desc: '[evidence] 素材建议新手同时上马至少10个产品以尽快获得正反馈，且不要将自身可承受的试错成本当作门槛——该策略来自实操经验总结，以批量试错提升选品命中率。'
  excerpt:
  - 多找产品一起上（最少10个）尽快拿正反馈；不要把自己能承受的试错成本当门槛。
- name: 平台模型可复用性发现
  desc: '[claim] 素材宣称百度竞价的核心方法论可完全复用于抖音巨量、小红书聚光等平台，因其实质同为流量采买与转化逻辑——此为作者跨平台推断，未经对比实验验证。'
  excerpt:
  - 其他平台（抖音巨量、小红书聚光）本质一样可复用。
