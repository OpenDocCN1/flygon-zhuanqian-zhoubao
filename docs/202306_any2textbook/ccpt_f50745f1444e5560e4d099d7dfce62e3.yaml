paper: 商业软文明暗线方法论
desc: 该素材由内容创作者提出一套关于商业软文写作的方法论，核心贡献在于原创性地定义了商业软文的“明线”与“暗线”概念，并基于此提供了一套可从数据分析、结构拆解到内容替换的实操SOP（标准作业程序），用以指导用户快速生成具备商业价值的软文。
concepts:
- name: 商业软文（明线+暗线组成）
  desc: 将商业软文的构成解构为明线与暗线两条逻辑线，这是理解素材方法论的基础性概念框架。
  is_original: false
  excerpt:
  - 一个完整的商业软文需要具备的条件有明线和暗线。
- name: 明线
  desc: 指文章中可被替代的知识点或观点，不具备独特性，是文章的信息外壳。
  is_original: true
  excerpt:
  - 明线你可以理解为就是在一篇文章或者一个视频里边可以被代替的知识点或者观点。比如你写一篇自媒体写作文章，有个知识点叫标题怎么写，那我从别的平台搜一下，标题怎么写，找个不同的文案替换上去，效果是一样的，这就是明线。
- name: 暗线
  desc: 指影响用户决策的不可替代性内容，涵盖人设、背书、引导互动等元素，是文章的商业价值内核。
  is_original: true
  excerpt:
  - 暗线就是影响用户决策的点。一些人设类的、背书类的，比如你觉得哪个博主做了哪些事很厉害；引导类的，比如你想引导他私信你，比如你想引导他在评论区提问，等等这种不可替代性的内容，都是暗线。
- name: 写作外挂（素材库）
  desc: 强调素材库的作用在于“用”，通过记录与搜索两个重点，为文章生产提供可复用的原料。
  is_original: false
  excerpt:
  - 搭建写作外挂，就两个重点：一个是记录，一个是搜索。记录知识点、记录感觉。素材库对于咱们来说就一个目的，就是"用"。
methods:
- name: __overview__
  desc: 整体方法论为“爆款借鉴法”：通过拆解同行文章的明线与暗线结构框架，替换明线为通用知识、重写暗线为自身独特价值，从而高效产出商业软文。
  excerpt:
  - 按照这两条线去拆同行的文章，把他拆解成框架，然后明线从别的地方找一个，替换上去，暗线换成自己的。很多时候我们摸着爆款过河就好了。
- name: 商业软文实操SOP（五步法）
  desc: 一套具体落地的操作流程，从解析结构到输出文章的系统化步骤。
  excerpt:
  - 实操SOP：第一步拆解成思维导图；第二步分析文章中的明线和暗线；第三四步修改明线和暗线（用素材库积累的开头、案例替换）；第五步整个梳理一遍，看通顺不通顺，微调一下。
theorems:
- name: 商业软文的效用定义
  desc: 判断一篇商业软文好坏的标准是其是否同时实现读者价值与商业价值（信任、涨粉、收钱）。
  excerpt:
  - 我对一篇好的商业软文的定义：1、如果你做IP，能快速获得读者信任；2、如果你引流，能快速获得粉丝；3、如果你做转化，能快速让你收钱。一句话概括，既能带给读者价值，又能带给自己商业价值的文章，就叫商业软文。
- name: 明暗线可分离替换原理
  desc: 主张文章的明线与暗线是解耦的，可以分别替换与重构，这是整个方法论可操作性的理论前提。
  excerpt:
  - 按照这两条线去拆同行的文章，把他拆解成框架，然后明线从别的地方找一个，替换上去，暗线换成自己的。
- name: 写作起点与素材积累关系论
  desc: 主张高手写作始于确定性选题与素材库，而非从零开始的灵感创作，强调素材库的“用”大于“存”。
  excerpt:
  - 高手写文章都是从确定的选题和一堆素材开始的，小白都是从一张白纸开始的。
findings:
- name: 写作心态的实操导向
  desc: '[claim] 素材提出，写作成功的心态在于目的明确与利他性，这是作者的主观经验总结而非数据实证。'
  excerpt:
  - 心态：1、目的要非常明确。做IP要有定位，写文章要有目的，而且一定要非常明确。2、利他。
