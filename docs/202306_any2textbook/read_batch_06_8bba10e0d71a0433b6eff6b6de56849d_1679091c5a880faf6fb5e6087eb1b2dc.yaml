- file_path: docs/202306/UAm9djDdWol9ImxIO3mcBucInGg.md
  title: 认知觉醒是开始赚钱的第一步
  summary: 作者jime分享其副业4个月变现10万背后的认知转变，包括对钱的认知（钱是交换工具）、有钱人思维（积累资源而非消耗）、去除低认知（学习）和不要节省时间（利用时间杠杆）。
  core_question: 赚钱的起点是什么？普通人如何实现认知觉醒？
  key_judgment: 赚钱的核心是认知觉醒：变有钱先变脑子（学习）、眼睛（看项目）和耳朵（听信息）；富人思维是在做事时积累资源（信任、人脉）而非消耗资源，信用才是真正的财富。
  depth: medium
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 口语化
  - 重复
  - 其他
  screening_conclusion: retain
  reason: 从个人经历提炼认知升级方法论（积攒信用、时间杠杆），观点有启发性，但个人叙事性偏强、部分内容与其他认知类素材重复，可作为认知章节的案例补充。
- file_path: docs/202306/WBsWdTm7uoOXICxiHDncFMdDnvb.md
