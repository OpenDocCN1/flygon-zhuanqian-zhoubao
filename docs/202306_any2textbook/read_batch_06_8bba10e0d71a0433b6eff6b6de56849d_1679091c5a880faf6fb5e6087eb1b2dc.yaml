  key_judgment: 赚钱的核心是积累：第一年不赚钱但积累私域流量和行业资源，第二年抓住独家项目（小红书起号卖号）并打通后端资源，第三年靠团队模式和自动化系统放大，小团队模型为定时定量定人。
