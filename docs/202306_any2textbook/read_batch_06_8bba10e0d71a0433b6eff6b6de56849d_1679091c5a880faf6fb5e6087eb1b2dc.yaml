  core_question: 如何充分利用微信功能提升私域营销效率？
  key_judgment: 微信不仅是聊天工具更是营销工具，用好其隐藏功能（如单人群、消息提醒、标签管理）能显著提升私域运营效率，但需根据使用场景灵活应用。
