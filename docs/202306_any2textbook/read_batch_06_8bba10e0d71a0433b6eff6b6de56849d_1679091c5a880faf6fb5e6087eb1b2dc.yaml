- file_path: docs/202306/HJTtd44mZoTWPbxQwXncLHW1nje.md
  title: 技术赚钱实践指南
  summary: 作者花2个月浏览生财有术1万篇技术类赚钱文章，精选300篇，从认知觉醒、商业思考、需求挖掘、热门赚钱技术和赚钱项目五个维度，系统梳理技术人员如何利用技术优势实现商业变现。
  core_question: 技术人员如何从技术思维转向商业思维，利用自身技术优势赚钱？
  key_judgment: 技术人员赚钱的本质不是比拼技术招式，而是回归业务本质，用技术解决用户需求；技术只是变现手段，需结合商业认知、流量和产品思维，避免陷入技术自嗨。
  depth: high
  suggested_destination: chapter
  possible_shape: book
  risks:
  - 时效性
  - 口语化
  - 格式预处理
  screening_conclusion: retain
  reason: 系统性强，覆盖认知-商业-需求-技术-项目全链路，虽部分案例有2023年时效性，但核心方法论（技术优势+商业思维）具有长期参考价值，可作为书籍核心章节框架。
- file_path: docs/202306/I4tBdhtiEoffmRxhFdqcB8X0niC.md
  title: 小红书店铺从选品到出单全套分享
  summary: 作者小毛分享其团队在小红书电商从选品、测品到怼爆品的完整实操流程，涵盖用户画像分析、选品方法（低粉爆文、跟品、电商平台选品）、测品策略和笔记制作技巧。
  core_question: 如何在小红书平台从零开始选品并成功出单？
  key_judgment: 小红书电商成功核心在于：在蓝海平台做红海品（利用平台红利），通过低粉爆文找有需求的品，测品时封面定生死，测出爆品后持续怼爆品并建立素材库。
  depth: high
  suggested_destination: chapter
  possible_shape: booklet
  risks:
  - 时效性
  - 口语化
  - 格式预处理
  screening_conclusion: retain
  reason: 提供完整可复制的实操SOP（选品-测品-怼爆品），虽然是2023年案例，但选品逻辑和方法论（低粉爆文标准、封面设计原则）仍有参考价值，适合作为电商章节的操作指南。
- file_path: docs/202306/L4OodPeJRoXlJWxPfyjcaq57ndd.md
  title: 4年无人直播电商经验：无人直播小白7问7答
  summary: 作者贾璐分享4年无人直播电商经验（累计1亿GMV），以7问7答形式讲解无人直播的定义、与真人直播区别、赚钱逻辑、收益预期、平台选择、操作方法及风险。
  core_question: 无人直播电商是什么？小白如何入门并规避风险？
  key_judgment: 无人直播本质是薅平台流量羊毛，利用录播内容+精选联盟选品实现24小时自动带货；核心在于选品和素材防检测处理，但平台管控风险高，需要持续换号。
  depth: medium
  suggested_destination: case
  possible_shape: booklet
  risks:
  - 时效性
  - 口语化
  - 格式预处理
  screening_conclusion: retain
  reason: 提供真实的无人直播实操案例和收入数据，对理解直播电商红利有参考价值，但2024年平台规则可能已变化，且“薅平台流量”策略存在合规风险，适合作为案例而非核心方法论。
- file_path: docs/202306/LUmKdLd0AofzbcxFRkQcg56Rnnf.md
  title: 炼丹Lora终极攻略
  summary: 作者吴东子以保姆级教程讲解Stable Diffusion中Lora模型的炼制方法，涵盖Lora功能介绍（云旅游、AI模特等）、炼丹前准备（本地/云平台）、素材制作、训练参数调整及模型测试优化。
  core_question: 如何从零开始训练自己的Lora模型？
  key_judgment: Lora炼制核心在于高质量素材（20-30张高清多角度照片）和正确的标签处理（特征标签删除/保留策略）；炼制是玄学，需要通过调整学习步数解决不像或过拟合问题。
  depth: high
  suggested_destination: handbook_entry
  possible_shape: handbook
  risks:
  - 时效性
  - 格式预处理
  - 重复
  screening_conclusion: retain
  reason: 技术教程操作步骤完整、图文并茂，具有实操价值，但SD技术迭代快（如新版界面、新模型），且与另一篇ControlNet教程可能存在重复，适合作为附录或手册条目。
- file_path: docs/202306/NeqIdWC9PovqQ6xruAJcErqHnxc.md
  title: ControlNet终极攻略
  summary: 作者吴东子系统讲解Stable Diffusion中15种ControlNet模型的功能、安装方法、预处理器选择和实操案例，涵盖姿势约束、线条约束、空间深度、物品种类、风格约束、重绘和特效等应用场景。
  core_question: 如何利用ControlNet精细化控制AI绘画生成效果？
  key_judgment: ControlNet的价值在于将AI绘画从随机抽卡转向可控生成，核心是理解不同模型（OpenPose、Canny、Depth等）的适用场景，并学会组合多个ControlNet实现复杂效果。
  depth: high
  suggested_destination: handbook_entry
  possible_shape: handbook
  risks:
  - 时效性
  - 格式预处理
  - 重复
  screening_conclusion: retain
