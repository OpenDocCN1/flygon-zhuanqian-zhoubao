best_shape: book
book_worthiness: worth
conclusion_type: ready
one_line_judgment: 这批素材已具备从'经验碎片'整合为'方法论著作'的底层条件，但需通过大规模补写串联，方可成书。
recommended_shape: book
shape_reason: 素材既包含大量核心方法论（如商业软文、小红书引流、AI提效、个人IP打造），又有多个真实变现案例复盘，足以支撑一部6-10章的完整著作，且图书形态更利于系统化沉淀方法论和建立作者权威。
not_recommended_shapes:
- kb
- course
not_recommended_reasons:
- 做成知识库会割裂方法论的连贯性，沦为碎片化资料堆砌，丧失系统价值。
- 素材偏重方法结论与案例复盘，缺乏教学设计与互动环节，强行改编成课程需大量补写练习、作业和讲解脚本，成本极高且未必优于图书。
if_force_book_need: 需补写全书唯一核心命题下的理论框架、各章导言小结、案例数据验证，以及新增'从0到1启动'的实操章节以增强读者落地感。
core_proposition: 普通人如何利用技术、内容与平台规则，构建低成本、可持续的'个人商业变现系统'。
target_reader: 内容创作者、小微创业者、希望开拓副业的技术从业者，以及所有想通过个人IP实现商业变现的普通人。
reader_problem: 读者面对大量'看似可行'的赚钱信息，不知如何选择、如何系统化启动、如何避免踩坑，缺乏一套从'找方向→做内容→引流量→变现金→避风险'的完整行动路径。
differentiation: 差异点：不贩卖焦虑，不局限于单一平台；融合技术人视角与商业软文'明暗线'等独家方法论，强调可复制、可执行的底层逻辑，而非短暂风口或工具罗列。
recommended_title: 个人商业变现系统：从0到1的内容与技术方法论
subtitle: 写给普通人的低成本、可持续变现指南
alt_title_1: 普通人变现实战：内容、流量与技术的组合打法
alt_title_2: 不靠风口靠系统：普通人打造个人商业变现闭环
shape_description: 一本以方法论为主轴、案例为佐证的实战指南书，包含工具操作指导、实操清单与风险提示，兼具深度与可落地性。
structure_logic: 全书遵循'认知觉醒（为何与方向）→ 内容创造（如何做）→ 流量获取（怎么增长）→ 商业变现（怎么赚钱）→ 风险控制（怎么避险）→
  系统复盘（如何持续）'的递进式逻辑，由内而外构建读者的变现系统。
toc_draft:
- 前言：告别韭菜宿命，建立你的变现系统
- 第一章 认知启动：普通人如何挖掘商机与避免成为韭菜
- 第二章 内容引擎：AI辅助下的创作与爆文方法论（含GPT指令调教与知识库）
- 第三章 流量密码：小红书、抖音与视频号的引流与SEO实战
- 第四章 商业变现：从产品定制到电商出单的路径拆解（含多平台案例）
- 第五章 个人IP打造：从0到1跑通个人品牌全链路
- 第六章 进阶玩法：技术驱动的自动化与细分行业落地
- 第七章 风险控制：财税合规与安全边界（金税四期与平台合规）
- 第八章 系统复盘：构建你的持续变现系统与未来展望
to_retain:
- 商业软文明暗线方法论（高度原创，可作核心章节）
- 抖音SEO方法论、小红书引流SOP
- ChatGPT角色指令调教指南与细分行业应用
- 视频号定制产品、小红书塔罗、抖音教辅等案例复盘
- 技术赚钱实践指南与个人IP打造全链路
to_delete:
- 所有纯链接汇总及无正文的目录文件（如抖音链接汇总、小红书资料号爆款打法）
to_merge_rewrite:
- 小红书无货源电商、小红书店铺选品出单与测品三篇素材合并重写为'小红书电商闭环'章节
- ChatGPT plugin知识库与'7天用AI写出10万+爆文'合并，统一至'AI内容生产'框架下
- 实体店同城短视频与BD达人内容可合并至'流量获取'或'私域运营'章节，视行文需要灵活调整
to_supplement:
- 突出全书的唯一核心命题与理论框架（如'个人商业变现系统'模型图）
- 为每个章节补充导言、案例背景深度分析及小结，统合素材间的逻辑断点
- 新增'从0到1启动的10个实操步骤'与'避坑自检清单'等落地指引
- 针对时效性强的工具与平台规则进行更新补充，并作出风险提示
retain_principles: 优先保留可独立成章且深度足的方法论、具复利效应的原创观点和完整高价值案例；低深度、内容重复或仅为索引/工具性质的素材剔除或合并，确保全书主题集中、逻辑连贯。
steps:
- 第一步：确定核心命题与全书画布，输出《个人商业变现系统》全书总纲及核心模型图。
- 第二步：按自下而上的逻辑重写各章节导言与小结，将保留素材条目归拢至对应章节，建立章节思维导图。
- 第三步：针对重点章节（如商业软文、小红书引流、AI应用）深入补充实践细节与最新案例，完成全书初稿，并进行统一性修订。
risks:
- 内容涉及平台规则和AI工具，时效性风险中等，需在出版前及时更新并加入免责与风险提示。
- 素材跨度大，若核心命题提炼不当，读者可能感到散乱，需反复打磨总纲与各章导语以强化主题集中度。
- 部分垂直案例（如闲鱼二手书、财税合规）可能偏离主线，需明确归类为'进阶/避坑'模块，避免稀释主命题。
next_product: 《个人商业变现系统》全书总纲与核心章节思维导图（含章节内容清单及对应素材映射表）
default_output_file: 全书初稿.md
writing_approach: 以章节思维导图为主线，采用'理论+方法论+案例复盘+实操清单'四层结构逐章撰写，先从核心命题与逻辑框架搭建，再逐章填充素材并统一文风。
will_split: false
start_from:
- 前言与第一章（认知启动：挖掘商机与避免成为韭菜）
- 第四章（商业变现：案例路径拆解）
- 第五章（个人IP打造与系统复盘）
