    \n  ],\n  \"concept_map\": [\n    \"商业底层逻辑\",\n    \"├── 核心定理\",\n    \"│   ├──\
    \ 需求是一切商业活动的起点 —— 定理\",\n    \"│   │   ├── 先验性：需求先于产品和流量存在\",\n    \"│   │   ├──\
    \ 驱动性：需求越强，搜索意愿越强\",\n    \"│   │   └── 用户带着需求才会搜索（原概念）\",\n    \"│   └── 局部环节变现（切蛋糕策略）\
    \ —— 新概念\",\n    \"│       ├── 聚焦性：只做擅长的环节\",\n    \"│       ├── 协作性：未覆盖环节由他人承接\"\
    ,\n    \"│       └── 低门槛性：降低启动成本\",\n    \"├── 全链路六环节\",\n    \"│   ├── 需求（起点）\"\
    ,\n    \"│   ├── 产品设计与制造\",\n    \"│   ├── 流量获取\",\n    \"│   ├── 转化成交\",\n  \
    \  \"│   ├── 交付履约\",\n    \"│   └── 变现（终点）\",\n    \"└── 框架性质\",\n    \"    ├──\
    \ 起点固定：需求是唯一起点\",\n    \"    ├── 顺序性：环节有先后，互为条件\",\n    \"    ├── 可拆解性：每环节可独立创造价值\"\
    ,\n    \"    └── 普适性：适用于实物/服务/虚拟产品\"\n  ],\n  \"life_analogy\": [\n    \"想象商业底层逻辑是一场**接力赛**：\"\
    ,\n    \"- **需求** = 发令枪（一切从它开始，没它比赛无法开始）\",\n    \"- **产品** = 第一棒选手（把需求变成解决方案）\"\
    ,\n    \"- **流量** = 观众席（把产品推给更多潜在买单者）\",\n    \"- **转化** = 交接棒（让观众从看客变成买主）\",\n\
    \    \"- **交付** = 冲刺跑（把承诺的成果送到客户手上）\",\n    \"- **变现** = 终点线（撞线才算完成闭环）\",\n  \
    \  \"就像接力赛选手不必每棒都自己跑（局部环节变现），商业个体也不必包揽全链路，切下自己最擅长的一棒也能赢。\"\n  ],\n  \"summary\"\
    : [\n    {\n      \"concept\": \"商业底层逻辑\",\n      \"desc\": \"需求-产品-流量-转化-交付-变现的六环节全链路，是分析商业模式的通用坐标系\"\
    \n    },\n    {\n      \"concept\": \"需求\",\n      \"desc\": \"商业第一推动力，先于产品和流量存在的客观缺口，用户带着需求才会搜索\"\
    \n    },\n    {\n      \"concept\": \"局部环节变现\",\n      \"desc\": \"切蛋糕策略：个体只需做好某几个环节，未覆盖环节由他人承接，降低创业门槛\"\
    \n    },\n    {\n      \"concept\": \"全链路完整性\",\n      \"desc\": \"环节可被外部平台承接，但链路本身必须完整存在才能形成商业闭环\"\
    \n    },\n    {\n      \"concept\": \"有效需求\",\n      \"desc\": \"必须真实且存在支付意愿，'想要但不愿花钱'不是有效商业需求\"\
