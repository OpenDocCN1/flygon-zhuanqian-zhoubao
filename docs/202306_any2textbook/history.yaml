    \  我是宝爷！分享我在五谷磨房做商务几个月，总结出来的一些避坑小经验分享给大家。  #### （1）平常通过什么方式去找达人？  1.  达人的主页，基本很多有意向合作的达人都会在主页写上自己的联系方式。（直接备注是哪个品牌方，想如何合作，达人有意向就会通过。\
    \  1.  商务社群，达人方以及品牌方都会建一个沟通的社群，可以在里面找到自己想要的品牌方和达人。（群里的小侠，就有很多这方面的资源，有兴趣可以跟小侠多沟通，寻求帮助的同时，也别忘了给人家发个小红包,表示感谢。）\
