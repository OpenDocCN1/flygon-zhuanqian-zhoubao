  - index: 1
    id: call_9c948850f322421999b57d2a
    function:
      arguments: '{"paper_name": "ChatGPT角色指令调教指南", "paper": "要获得高质量的专业输出，ChatGPT角色指令的设计是关键。系统性地分享了ChatGPT角色指令设计的三大设定：身份、任务、约束。\n\n身份设定：给AI一个明确的身份角色，让它以该身份的专业视角来回答问题。比如AI律师、AI产品专家、AI编程专家、AI夸夸等。\n\n任务设定：明确告诉AI要完成的具体任务，包括目标和输出格式。\n\n约束设定：给AI设定边界条件，比如回答的篇幅、语气、禁止事项、参考依据等。\n\n调试和测试方法：建立标准测试用例来检验角色指令的效果。测试用例一般包括：\n1、身份确认问题：测试AI是否正确进入角色。\n2、常规问题：测试AI在正常场景下的表现。\n3、复杂/跨域问题：测试AI在边界和复杂场景下的能力。\n通过测试用例的反馈不断迭代优化指令。\n\n核心要点：优秀的角色指令依赖于\"身份、任务、约束\"三板斧的明确设定，并通过建立标准测试用例（身份确认、常规/复杂/跨域问题）进行调试，这是掌握AI沟通技能的关键。"}'
