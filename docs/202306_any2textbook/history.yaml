      arguments: '{"previous_chapter": "# 第 2 章 需求挖掘方法论——用搜索框洞察商机\n\n## 2.3 搜索行为——挖掘商机的晴雨表\n\n我们首先确立了理论基础：搜索行为是用户真实需求的最诚实表达，具有真实性、指向性和可量化性三重信号属性。搜索是主动行为，用户花费时间和注意力背后一定有真实动机。每个关键词都指向一个具体的需求方向。搜索量可以统计，需求可以被度量和比较。\n\n这个\"搜索行为=需求信号\"的判定构成整个方法论的理论支点。它的核心逻辑是一次反向推理：用户没说话但搜了某个词，必然有意图，意图即需求，需求即商机。\n\n这里隐含一个边界条件：搜索行为反映的是\"想要\"而非\"已拥有\"。\n\n##
        2.4 sug词——迷你市场探测器\n\nsug词（Suggest Words）是平台基于海量用户行为聚合的市场探测器。它产生于\"众筹式市场调研\"：海量用户搜索行为→搜索日志→统计+分析+去噪→候选词池→排序+过滤+整理→显示在搜索框下方。\n\nsug词具有大数据聚合性、高关联性、低门槛，独特价值在于长尾发现能力。\n\n##
        2.5 关键词+26字母批量挖词法\n\n以核心词为骨，以26个字母为翼，穷举所有可能的长尾词。分为三步：目标词拼26字母、批量获取sug词、Excel批量整理分析。\n\n这套方法的精髓在于穷举，把\"靠运气撞大运\"变成\"全自动式的头脑风暴\"。\n\n##
        2.6 案例：从西藏关键词挖掘细分市场\n\n把26字母法应用到\"西藏\"这个泛词上，挖出了西藏边防证、西藏无人机、西藏包车、西藏旅拍、西藏氧气等细分需求。通过二段式筛选法判定需求真伪。",
        "current_chapter": "# 第 3 章 避坑与进阶——从韭菜思维到商业思维\n\n## 3.3 韭菜画像\n\n\"韭菜\"是一个社会角色的隐喻，描述的是反复进入市场、反复被收割，却无法从过程中学习、进化或退出的参与者。其根本原因是缺乏学习能力、懒惰贪婪。\n\n$$\n\\textbf{韭菜心理基因}
        = \\text{贪婪} \\times \\text{懒惰} \\times \\text{拒绝学习}\n$$\n\n三个因子是相乘关系而非相加，只要其中一个接近零就不会被反复收割。\n\n韭菜画像的三个核心属性：周期性（入场-被收割-离场-再入场）、驱动性（贪婪驱动而非理性分析）、可预测性（行为模式固定）。\n\n##
        3.4 七种核心能力\n\n面对韭菜的三重心理基因，需要一套对抗性能力组合：信息获取能力、逻辑分析能力、延迟满足能力、概率思维方式、独立思考能力、复盘迭代能力、风险管理能力。\n\n每一种能力都对应一个具体心理缺陷，形成一一对应的\"补丁\"关系，构成\"防御系统\"。\n\n七种核心能力的元属性：组合性、归因移植、可习得性。\n\n##
        3.5 先研究价值再行动\n\n\"先研究价值再行动\"是整套防收割体系的黄金法则。它针对韭菜最核心的行为模式：先行动，后后悔。\n\nAlgorithm
        1：事前价值验证：①列出目标的价值维度②对每个维度进行事实核对③预设退出条件④设置冷静期⑤只在自己能承受损失的范围内参与。\n\n关键属性：前瞻性、否定性过滤、多维度评估。\n\n##
        3.6 技术自嗨\n\n当视角从个人投资转移到技术创业，会发现一种新的收割方式：不是别人收割你，而是自己收割自己。\n\n$$\n\\textbf{技术自嗨}
        = \\text{技术复杂度} \\times \\text{用户价值} \\approx 0\n$$\n\n技术自嗨三特征：行业特异性、价值错位、天花板自设。\n\n从技术思维到商业思维：技术思维以自我为中心（技术复杂度最大化），商业思维以用户为中心（用户价值最大化）。技术是手段，业务是目的。"}'
