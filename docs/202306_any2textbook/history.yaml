    \     \"**典型例子**\",\n        \"- 某人搜索“西藏边防证”，直接暴露其计划进藏且对边防政策不确定的潜在旅游需求\",\n  \
    \      \"- 搜索“无人机”与“西藏”组合词，表明用户尝试解决高原地带的航拍或物流需求\",\n        \"**边界条件**\",\n  \
    \      \"- 搜索行为反映的是“即时意图”，可能是一时好奇而非长期可持续的消费需求\",\n        \"- 同一关键词背后可能对应多类用户（如“西藏”可能是旅行者、研究者或移民咨询者），需结合其他信号细分\"\
