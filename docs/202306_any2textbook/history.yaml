  content: "{\n  \"learning_targets\": [\n    \"理解搜索行为作为需求信号的理论基础与边界条件\",\n    \"\
    掌握sug词的定义、数据来源与市场探测价值\",\n    \"熟练运用「关键词+26字母」批量挖词法进行长尾词穷举\",\n    \"能通过案例分析，将批量挖词法迁移至任意行业\"\
    ,\n    \"具备判断真需求与伪需求、筛选商业机会的基本能力\"\n  ],\n  \"concept_map\": [\n    \"商机挖掘方法论\"\
    ,\n    \"├── 理论基础\",\n    \"│   ├── 搜索行为=需求信号        —— 动机\",\n    \"│   │   ├──\
