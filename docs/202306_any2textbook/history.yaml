    function:
      arguments: '{"paper_name": "商业软文明暗线方法论", "paper": "我对一篇好的商业软文的定义：1、如果你做IP，能快速获得读者信任；2、如果你引流，能快速获得粉丝；3、如果你做转化，能快速让你收钱。一句话概括，既能带给读者价值，又能带给自己商业价值的文章，就叫商业软文。\n\n一个完整的商业软文需要具备的条件有明线和暗线。\n\n什么是明线？这个概念是我原创的。明线你可以理解为就是在一篇文章或者一个视频里边可以被代替的知识点或者观点。比如你写一篇自媒体写作文章，有个知识点叫标题怎么写，那我从别的平台搜一下，标题怎么写，找个不同的文案替换上去，效果是一样的，这就是明线。在一篇文章中可以被代替的知识点或者观点叫明线。\n\n什么是暗线？暗线就是影响用户决策的点。一些人设类的、背书类的，比如你觉得哪个博主做了哪些事很厉害；引导类的，比如你想引导他私信你，比如你想引导他在评论区提问，等等这种不可替代性的内容，都是暗线。\n\n按照这两条线去拆同行的文章，把他拆解成框架，然后明线从别的地方找一个，替换上去，暗线换成自己的。很多时候我们摸着爆款过河就好了。\n\n高手写文章都是从确定的选题和一堆素材开始的，小白都是从一张白纸开始的。搭建写作外挂，就两个重点：一个是记录，一个是搜索。记录知识点、记录感觉。素材库对于咱们来说就一个目的，就是\"用\"。\n\n实操SOP：第一步拆解成思维导图；第二步分析文章中的明线和暗线；第三四步修改明线和暗线（用素材库积累的开头、案例替换）；第五步整个梳理一遍，看通顺不通顺，微调一下。\n\n心态：1、目的要非常明确。做IP要有定位，写文章要有目的，而且一定要非常明确。2、利他。"}'
