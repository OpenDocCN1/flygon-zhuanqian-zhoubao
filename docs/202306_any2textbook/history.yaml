        ——来源：《普通人避免成为韭菜》\n\n\"韭菜\"是一个社会角色的隐喻。其心理基因可形式化为：$$\\textbf{韭菜心理基因} = \\text{贪婪}
        \\times \\text{懒惰} \\times \\text{拒绝学习}$$——三个因子是相乘关系，只要一个接近零就不会被反复收割。三个属性：周期性、驱动性、可预测性。核心问题不是\"亏了钱\"而是**拒绝从亏损中学习**。\n\n##
