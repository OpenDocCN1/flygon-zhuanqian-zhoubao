    function:
      arguments: '{"paper_name": "抖音SEO长期获取精准流量", "paper": "分享我最近在抖音布的几个关键词排上第一的经验。我并不是资深SEO玩家，甚至是第一次真正在抖音布局SEO。\n\n抖音SEO的核心逻辑：抖音逐渐成为用户搜索获取信息的入口，用户搜索的关键词背后是精准需求，因此做好抖音SEO能获得精准且长期的搜索流量。\n\n方法步骤：\n1、选词：选择跟业务相关、用户会去搜的热门关键词。可以借助第三方工具（如考古加、蝉妈妈等）看搜索量和竞争程度。选择搜索量适中、竞争不大、有商业价值的词。\n2、布词：把关键词布局到标题、文案、话题、合集等位置，让系统识别内容核心。\n3、优化：通过创作与关键词高度相关的高质量内容，提升账号在该词上的权重。利用合集数据叠加提高权重。\n4、维持排名：持续输出相关内容，观察数据表现，必要时配合付费投流（如抖加）做数据优化，维护词在搜索结果中的排名。\n\n最终目的：把抖音搜索流量引导到私域进行转化，实现变现。SEO获取的是长期精准流量，比靠运气蹭热点更可持续。"}'
