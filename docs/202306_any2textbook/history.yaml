    : \"关键词+26字母批量挖词法 —— 穷举式商机雷达\",\n      \"points\": [\n        \"**为什么需要这个概念？**\"\
    ,\n        \"- 仅靠人工逐个输入搜索词效率极低，且容易遗漏高价值的冷门长尾词\",\n        \"- 用户常以“核心词+拼音/英文缩写”等变体方式搜索，隐藏需求藏在组合词里\"\
    ,\n        \"- 需要一套机械化穷举手段，让市场探测从“靠运气”变成“可复制的工艺流程”\",\n        \"**核心定义**\",\n\
    \        \"- 以目标核心词为骨架，依次拼接26个英文字母（A-Z）生成批量候选搜索词\",\n        \"- 将批量候选词逐一（或分批）丢入搜索平台获取联想sug词，汇集后整理成需求库\"\
