    \    },\n    {\n      \"no\": 4,\n      \"name\": \"西藏长尾词案例 —— 一套方法的试金石\",\n \
    \     \"points\": [\n        \"**为什么需要这个概念？**\",\n        \"- 方法论需要实例背书，才能展示从“关键词”到“可经营的商机”的完整通路\"\
