- 'no': 1
  name: 商业的底层逻辑 —— 从“需求起点”到“变现终点”
  desc: 本章从“需求是一切商业起点”这一核心洞察出发，带你建立从需求挖掘到商业闭环的全局观，并理解普通人如何只抓住链条中的局部环节即可变现。
  nodes:
  - 'no': 1
    name: 商业底层逻辑的全景图
    desc: 用“链条”类比拆解商业全链路，理解需求、产品、流量、转化、交付、变现的完整闭环。
    role: definition
    src:
    - paper: 普通人如何挖掘商机
  - 'no': 2
    name: 需求是商业的“第一推动力”
    desc: 理解“用户带着需求才会搜索”这条铁律，它是所有商业活动最原始的驱动力。
    role: motivation
    src:
    - paper: 普通人如何挖掘商机
  - 'no': 3
    name: 局部环节变现：普通人的“切蛋糕”策略
    desc: 不必懂全链路，只需依托自己擅长的某几个环节（如流量、交付）切入商业，用“接力赛”类比解释。
    role: extension
    src:
    - paper: 普通人如何挖掘商机
- 'no': 2
  name: 需求挖掘方法论 —— 用“搜索框”洞察商机
  desc: 本章将搜索引擎的联想词（sug词）视为市场的“晴雨表”。你会发现，只要顺着用户搜索的行为信号，就能反向挖掘出大量被忽视的真实需求。
  nodes:
  - 'no': 1
    name: 搜索行为：最诚实的“需求投票”
    desc: 解释“搜索即意图”的逻辑：用户搜索关键词必然带着解决某个问题的目的，这种信号远比问卷更真实。
    role: motivation
    src:
    - paper: 普通人如何挖掘商机
  - 'no': 2
    name: sug词：低门槛的“市场探测器”
    desc: 定义平台联想词（sug词）及其数据来源，理解它是如何基于海量用户行为统计出来的。
    role: definition
    src:
    - paper: 普通人如何挖掘商机
  - 'no': 3
    name: 关键词+26字母批量挖词法
    desc: 以“批量实验”为核心思路，介绍用目标词与26个英文字母随机组合，穷举出隐藏长尾词的操作手法。
    role: method
    src:
    - paper: 普通人如何挖掘商机
  - 'no': 4
    name: 案例：从“西藏”关键词挖掘出的细分市场
    desc: 展示“西藏边防证”“西藏无人机”等真实发现案例，用结果验证批量挖词法的实战价值。
    role: experiment
    src:
    - paper: 普通人如何挖掘商机
- 'no': 3
  name: 避坑与进阶 —— 从“韭菜思维”到“商业思维”
  desc: 本章通过剖析普通人在赚快钱路上常见的心理陷阱，区分“韭菜”与“经营者”的本质差别，并指出技术人员最容易掉的“自嗨”深坑。
  nodes:
  - 'no': 1
    name: “韭菜”画像：被收割者的心理特征
    desc: 定义“韭菜”这一概念，说明缺乏钻研、轻易相信高回报、懒惰贪婪是根本成因。
    role: definition
    src:
    - paper: 普通人避免成为韭菜
  - 'no': 2
    name: 摆脱韭菜宿命的七种核心能力
    desc: 给出应对方案：学习钻研、理智冒险、探究本质等关键能力，并逐一展开说明。
    role: method
    src:
    - paper: 普通人避免成为韭菜
  - 'no': 3
    name: 原则：先研究价值，再采取行动
    desc: 面对高回报诱惑时如何理性决策，把“研究价值”放在“立即行动”之前，作为防收割的黄金法则。
    role: limitation
    src:
    - paper: 普通人避免成为韭菜
  - 'no': 4
    name: 技术人的陷阱：“技术自嗨”
    desc: 技术人员常见的误区：沉迷实现复杂度，忘记用户真实需求。以“技术是工具，商业是目的”作结。
    role: limitation
    src:
    - paper: 技术赚钱实践指南
- 'no': 4
  name: 技术变现路径 —— 把“代码能力”转化为“商业价值”
  desc: 本章面向技术从业者，教你正确理解技术赚钱的本质，并盘点当前高价值的变现方向，从“技术思维”切换到“商业思维”。
  nodes:
  - 'no': 1
    name: 技术赚钱的本质：回归业务，而非比拼招式
    desc: 明确技术人员赚钱的底层逻辑是用技术解决用户需求，而不是追求技术本身的复杂度与炫技。
    role: motivation
    src:
    - paper: 技术赚钱实践指南
  - 'no': 2
    name: 从“技术思维”转向“商业思维”
    desc: 对比两种思维模式：技术思维关注实现方案，商业思维关注用户付费意愿与价值交付。
    role: method
    src:
    - paper: 技术赚钱实践指南
  - 'no': 3
    name: 高潜力变现方向盘点
    desc: 列举AI应用、RPA、SEO工具、小程序开发、API接口整合等适合个人技术变现的热门赛道。
    role: extension
    src:
    - paper: 技术赚钱实践指南
  - 'no': 4
    name: 实证样本：上万篇技术赚钱文章的启示
    desc: 基于对10000篇相关文章的筛选分析，从中提炼出可复用的共性规律与实战门槛。
    role: experiment
    src:
    - paper: 技术赚钱实践指南
- 'no': 5
  name: 内容变现的暗器 —— 商业软文的“明线”与“暗线”
  desc: 本章揭示商业软文生产方式：一篇软文由“可替代的明线”和“决策驱动的暗线”构成，掌握五步拆解SOP，能快速产出高转化内容。
  nodes:
  - 'no': 1
    name: 软文结构解剖：明线与暗线
    desc: 用“骨架与灵魂”类比：明线是信息外壳可被替换，暗线是影响用户决策的不可替代内核。
    role: definition
    src:
    - paper: 商业软文明暗线方法论
  - 'no': 2
    name: 双线解耦：替换明线、定制暗线
    desc: 拆解同行文章后，可像换外套一样更换明线知识，保留并植入自己的暗线卖点，实现快速重构。
    role: method
    src:
    - paper: 商业软文明暗线方法论
  - 'no': 3
    name: 实操SOP：五步生产一篇商业软文
    desc: 从拆思维导图开始，经过分析修改明暗线，到最后的梳理微调，一个标准工业流程的完整演示。
    role: method
    src:
    - paper: 商业软文明暗线方法论
  - 'no': 4
    name: 持续生产的“写作外挂”：素材库搭建
    desc: 用“弹药库”类比，讲解如何通过记录与搜索两个重点，持续为内容生产提供原料。
    role: extension
    src:
    - paper: 商业软文明暗线方法论
