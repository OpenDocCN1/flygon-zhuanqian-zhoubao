paper: ChatGPT角色指令调教指南
desc: 该素材提出了一套系统化的ChatGPT角色指令设计方法论，其核心贡献在于将角色指令的设计拆解为'身份、任务、约束'三大设定，并建立了一套标准化的测试用例（身份确认、常规、复杂/跨域问题）来调试和迭代优化指令效果。
concepts:
- name: 身份设定
  desc: 为AI明确赋予一个专业身份角色，使其以该身份的专业视角来分析和回答问题。
  is_original: false
  excerpt:
  - 身份设定：给AI一个明确的身份角色，让它以该身份的专业视角来回答问题。比如AI律师、AI产品专家、AI编程专家、AI夸夸等。
- name: 任务设定
  desc: 清晰界定AI需要完成的具体目标以及期望的输出结果格式。
  is_original: false
  excerpt:
  - 任务设定：明确告诉AI要完成的具体任务，包括目标和输出格式。
- name: 约束设定
  desc: 为AI的生成内容设置边界条件，如篇幅、语气、禁止事项及参考依据等。
  is_original: false
  excerpt:
  - 约束设定：给AI设定边界条件，比如回答的篇幅、语气、禁止事项、参考依据等。
methods:
- name: __overview__
  desc: 针对ChatGPT角色指令设计，提出'身份-任务-约束'三要素设定法，并辅以标准测试用例的调试迭代循环。
  excerpt:
  - 要获得高质量的专业输出，ChatGPT角色指令的设计是关键。系统性地分享了ChatGPT角色指令设计的三大设定：身份、任务、约束。
  - 核心要点：优秀的角色指令依赖于'身份、任务、约束'三板斧的明确设定，并通过建立标准测试用例（身份确认、常规/复杂/跨域问题）进行调试。
- name: 标准测试用例调试法
  desc: 通过构建包含身份确认、常规、复杂/跨域三类问题的标准用例集，测试角色指令效果，并根据反馈持续迭代优化指令。
  excerpt:
  - 建立标准测试用例来检验角色指令的效果。测试用例一般包括：1、身份确认问题：测试AI是否正确进入角色。2、常规问题：测试AI在正常场景下的表现。3、复杂/跨域问题：测试AI在边界和复杂场景下的能力。
  - 通过测试用例的反馈不断迭代优化指令。
theorems:
- name: 角色指令三要素原理
  desc: 高质量ChatGPT专业输出的前提，在于角色指令中'身份、任务、约束'三个要素的明确设定，三者缺一不可或含糊不清将导致输出质量下降。
  excerpt:
  - 优秀的角色指令依赖于'身份、任务、约束'三板斧的明确设定，并通过建立标准测试用例（身份确认、常规/复杂/跨域问题）进行调试，这是掌握AI沟通技能的关键。
findings:
- name: 角色指令效果的可测试性与可迭代性
  desc: '[claim] 该素材宣称角色指令的质量可以通过标准化测试用例进行系统性检验，并依据测试反馈循环迭代。该结论为作者观点陈述，素材未给出实验数据支撑。'
  excerpt:
  - 通过测试用例的反馈不断迭代优化指令。
  - 这是掌握AI沟通技能的关键。
