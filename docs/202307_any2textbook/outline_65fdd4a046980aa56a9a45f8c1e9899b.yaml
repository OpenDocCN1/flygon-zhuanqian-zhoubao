- 'no': 1
  name: 从个体到组织 —— 闲鱼二手书的“工作室化跃迁”
  desc: 本章以闲鱼二手书从个人运营到工作室化放大的真实案例为切入点，拆解流程拆分、劳动力套利与规模扩张之间的逻辑关系，帮助读者理解如何通过组织化改造突破个人能力天花板。
  nodes:
  - 'no': 1
    name: 个人运营的天花板在哪里？
    desc: 通过“个人天花板理论”引出问题：单日100-150单、月利润2-3W是个人运营的极限，从而激发读者对规模化路径的探索动机。
    role: motivation
    src:
    - paper: 闲鱼二手书工作室放大
  - 'no': 2
    name: 流程拆分法：把“经验”变成“标准”
    desc: 介绍将选品上架、客服售后、拍单发货等环节标准化拆解的方法，这是从个人经验向组织流程转化的核心步骤。
    role: method
    src:
    - paper: 闲鱼二手书工作室放大
  - 'no': 3
    name: 劳动力套利：用结构优势降低人力成本
    desc: 定义“劳动力套利”概念——在保持服务质量的前提下，将标准化流程外包给低成本劳动力，通过人员结构优化实现降本增效。
    role: definition
    src:
    - paper: 闲鱼二手书工作室放大
  - 'no': 4
    name: 工作室化放大的完整模型
    desc: 综合流程拆分与劳动力套利，阐述工作室化的运作模式：流程标准化→人员低成本配置→规模扩张，并对比个人运营与工作室化的利润跃升（2-3W→10W+）。
    role: method
    src:
    - paper: 闲鱼二手书工作室放大
  - 'no': 5
    name: ISBN精准搜索批量交付：效率工具化
    desc: 介绍用ISBN/SSID精准搜索、批量交付的操作方法，说明工具化手段如何进一步提升单环节效率并支撑规模化。
    role: extension
    src:
    - paper: 闲鱼二手书工作室放大
  - 'no': 6
    name: 利润跃升的“盲区”：数据支撑的局限
    desc: 指出现有利润跃升结论（月10W+）缺乏量化数据支撑，属于经验性主张而非严格验证，提示读者在实操中需保持审慎并自行测算。
    role: limitation
    src:
    - paper: 闲鱼二手书工作室放大
- 'no': 2
  name: 选对赛道，建立壁垒 —— 小红书无货源电商的盈利逻辑
  desc: 本章从小红书年赚30万的实战案例出发，提炼“累积性赛道选择+长期护城河建设”的核心方法论，帮助读者理解为何有些生意越做越容易，以及如何将偶然经验转化为可复制的经营策略。
  nodes:
  - 'no': 1
    name: 为什么选“有复购”的品类？
    desc: 以运动品类为例，引出“累积性赛道”概念，说明复购率和客户资产积累对长期盈利的决定性作用，激发读者对品类选择维度的重视。
    role: motivation
    src:
    - paper: 小红书年赚30万
  - 'no': 2
    name: 累积性赛道：定义与识别标准
    desc: 正式定义“累积性赛道”——长期经营中能不断积累客户口碑或资产价值的品类，并给出可复用的识别标准（复购率、累积属性）。
    role: definition
    src:
    - paper: 小红书年赚30万
  - 'no': 3
    name: 累积性赛道选择法：筛选品类四步走
    desc: 将选品逻辑方法化：判断品类的复购性、评估长期累积空间、与自身资源匹配、小规模验证后放大。
    role: method
    src:
    - paper: 小红书年赚30万
  - 'no': 4
    name: 从被动到主动：供应链的攻守转换
    desc: 针对无货源模式的天然劣势，提出更换并优化供应链的策略，将经营从被动依赖转为主动掌控。
    role: method
    src:
    - paper: 小红书年赚30万
  - 'no': 5
    name: 护城河：长期思维的竞争壁垒
    desc: 阐述护城河的内涵——通过长期策略建立的供应链关系、品牌信誉等壁垒，并强调其作为复利来源的延展价值。
    role: definition
    src:
    - paper: 小红书年赚30万
  - 'no': 6
    name: 稳健盈利的公式：累积性赛道×长期思维
    desc: 归纳核心主张：选择累积性复购赛道，配合长期思维构筑护城河，即可实现稳定盈利；并给出普通人预期参考（年入10-20万）以及该模式的可复现边界。
    role: method
    src:
    - paper: 小红书年赚30万
  - 'no': 7
    name: 个案数据的适用范围
    desc: 指出现有经营绩效（年销50-60万、利润30万）为单一品类案例，缺乏跨品类或规模化样本支撑，结论外推时需谨慎。
    role: limitation
    src:
    - paper: 小红书年赚30万
- 'no': 3
  name: AI指令开发 —— 从“提示词拼接”到“系统工程”
  desc: 本章以面向B端客户的AI指令开发为对象，系统拆解“先发散后收敛”的方法论框架，涵盖目标拆分、案例引入、持续调试与四套提示词指令链构建，帮助你建立可交付、可盈利的AI指令开发能力。
  nodes:
  - 'no': 1
    name: AI指令是“拼接”还是“工程”？
    desc: 通过对比“简单提示词拼接”与“系统工程”的差异，引出AI指令开发的复杂度与专业性，建立正确的认知起点。
    role: motivation
    src:
    - paper: AI指令开发方法论
  - 'no': 2
    name: AI能力边界：先知道“它能做什么”
    desc: 定义AI能力边界认知——通过AI定位和竞品拆解建立对AI整体能力的认知框架，明确哪些环节适合交给AI、哪些必须人工介入。
    role: definition
    src:
    - paper: AI指令开发方法论
  - 'no': 3
    name: 目标拆分法：化整为零的指令分解术
    desc: 介绍将复杂业务目标拆解为若干可量化子任务、并为每个子任务配置可执行指令单元的方法，这是系统工程的第一级“发散”。
    role: method
    src:
    - paper: AI指令开发方法论
  - 'no': 4
    name: 案例引入法：让AI“照着学”
    desc: 讲解在指令中注入优秀案例或样本作为学习参照的技巧，显著提升AI输出的准确性与质量。
    role: method
    src:
    - paper: AI指令开发方法论
  - 'no': 5
    name: 四套提示词指令链：把流程串成流水线
    desc: 展示如何将完整生产流程拆分为四套分工明确的提示词、依次串联形成AI指令链，实现多环节协同自动化的“收敛”整合。
    role: method
    src:
    - paper: AI指令开发方法论
  - 'no': 6
    name: 持续调试法：多轮对话的迭代优化
    desc: 阐述通过多轮对话持续调试提示词与输出质量的实践方法，强调AI指令开发是迭代演进而非一蹴而就。
    role: method
    src:
    - paper: AI指令开发方法论
  - 'no': 7
    name: 降本增效：好指令的价值判据
    desc: 提出衡量AI指令质量的核心标准——能否为客户降本增效，并由此引伸出AI指令开发的商业化路径：从赋能原有业务关键环节到独立商业模式。
    role: method
    src:
    - paper: AI指令开发方法论
  - 'no': 8
    name: 从单笔变现到规模复制的想象空间
    desc: 基于8000元首单变现案例，探讨AI指令开发从项目制向产品化、标准化交付演进的扩展可能，同时指出单一案例的局限性。
    role: limitation
    src:
    - paper: AI指令开发方法论
- 'no': 4
  name: 跨案例的智慧 —— 从单点经验到可迁移的经营方法论
  desc: 本章横跨闲鱼二手书、小红书无货源电商与AI指令开发三大案例，提炼出共同的底层思维范式——流程化、壁垒化与工程化，帮助读者建立可跨领域迁移的商业思维框架。
  nodes:
  - 'no': 1
    name: 三个案例的共同“基因”是什么？
    desc: 通过对比三个案例的表象差异（实物电商 vs 数字服务），引出背后共同的经营底层逻辑：流程标准化、能力壁垒化、方法工程化。
    role: motivation
    src:
    - paper: 闲鱼二手书工作室放大
    - paper: 小红书年赚30万
    - paper: AI指令开发方法论
  - 'no': 2
    name: 专业能力框架：拆解目标的通用方法论
    desc: 将AI指令开发中的“目标拆分法”抽象为通用“专业能力框架”——把业务目标拆解为可量化环节的结构化能力体系，并回看其在二手书流程拆分中的体现。
    role: definition
    src:
    - paper: AI指令开发方法论
    - paper: 闲鱼二手书工作室放大
  - 'no': 3
    name: 标准化×低成本：人力与AI的替代逻辑
    desc: 对比闲鱼的“劳动力套利”与AI指令开发的“自动化替代”，揭示两条不同路径下共同的本质——用更低成本的结构化资源替换高成本人工操作。
    role: extension
    src:
    - paper: 闲鱼二手书工作室放大
    - paper: AI指令开发方法论
  - 'no': 4
    name: 壁垒思维：从“做一单”到“做长久”
    desc: 将小红书“护城河”概念与AI指令开发的“能力边界认知”对照，说明无论实物还是数字业务，长期盈利依赖可持续竞争壁垒的构建。
    role: extension
    src:
    - paper: 小红书年赚30万
    - paper: AI指令开发方法论
  - 'no': 5
    name: 新客源重心：增长的破局点
    desc: 引入“新客源获取”作为运营重心，并在三个案例中寻找对应策略——二手书的批量交付、小红书的品类扩展、AI指令的B端新客户开发，说明增长引擎的统一性。
    role: method
    src:
    - paper: 小红书年赚30万
    - paper: 闲鱼二手书工作室放大
    - paper: AI指令开发方法论
  - 'no': 6
    name: 先发散后收敛：系统工程思维的通约性
    desc: 将AI指令开发的“先发散后收敛”方法论提升为通用问题解决范式，对照二手书流程拆分与小红书品类试错，展示该思维在经营各场景中的普适价值。
    role: extension
    src:
    - paper: AI指令开发方法论
    - paper: 闲鱼二手书工作室放大
    - paper: 小红书年赚30万
  - 'no': 7
    name: 当个案数据成为“经验”而非“证据”
    desc: 系统审视三个案例共同的方法论局限：均为单一个案、缺乏样本量与对照实验，提示读者在迁移运用时需自行验证。
    role: limitation
    src:
    - paper: 闲鱼二手书工作室放大
    - paper: 小红书年赚30万
    - paper: AI指令开发方法论
