dimensions:
- name: 主题集中度
  score: 3
  evidence: 素材整体围绕“普通人通过互联网/自媒体项目变现”展开，涵盖轻食外卖、AI培训、闲鱼电商、小红书、抖音店播、猎头、探店代运营等多个赛道，存在多条旁支，但均指向同一核心领域——互联网轻资产创业与避坑。
- name: 核心命题清晰度
  score: 3
  evidence: 多篇素材（如AIGC三剑客、思维模型、小红书案例）隐含“方法论比项目更重要”、“将失败与成功经验提炼为可复制系统”的主张，且方向明确；但部分素材停留在个案复盘层面，尚未提炼出一句话贯穿全书的鲜明命题，需进一步收束。
- name: 目标读者清晰度
  score: 4
  evidence: 素材针对“想通过互联网副业/创业赚钱的普通人（尤其小白、跨界者）”这一读者群，多个案例以“从0到1”、“亏损复盘”视角持续回应其痛点——如何选项目、避坑、放大；读者定位清晰且回应持续。
- name: 内容厚度与互补性
  score: 4
  evidence: 素材分佈于选赛道、避坑、运营细节、放大规模、思维升级等层面：如探店运营与闲鱼工作室放大互补成“从单干到工作室”链条；抖音直播与轻食外卖的失败复盘与小红书成功案例形成正反对照；但公众号引流、AI指令等内容与主线有一定重复或断层，需整合。
- name: 区分度与新颖性
  score: 4
  evidence: 以“高颗粒度失败复盘”（亏损40W、20W直播）揭示行业内幕，具有较独特的视角；“10个思维模型”提供了可迁移的分析框架；区别于泛泛的“赚钱资讯合集”，具备“复盘式方法论”的差异化特征。
- name: 时效风险
  score: 3
  evidence: 闲鱼、小红书、公众号运营方法相对可迁移，具备常青性；但依赖平台的引流套路（如多多视频V计划、Copilot安装）极易随平台规则变化失效，整体平均处于“部分依赖特定工具/热点”水平。
- name: 可持续扩写空间
  score: 4
  evidence: 现有素材足以支撑“互联网避坑+变现方法论”的章节骨架，如按“认知→选项目→避坑→运营→放大”五模块布局，已有接近半本的内容厚度；但各章节需统一框架补写衔接段落与共性提炼。
total_score: 25
conclusion: potential
recommended_shape: book
alternative_path: 先以“电子书+系列文章”验证市场反应，再扩展为纸质书；或直接拆分为两本小书（一本“失败避坑案例集”、一本“从0到1变现方法论手册”）。
next_steps:
- 提炼全书的统一核心命题（例：'互联网赚钱不是靠项目，而是靠可复盘的思维系统——用失败与成功经验构建自己的避坑方法论'），并以此重写导论章节。
- 按“认知思维→赛道选择→实操细节→防坑复盘→规模放大”五模块重构章节，将十几篇素材归并为6-8个章节，剔除AI指令、公众号引流等旁支压缩为工具附录。
- 为失败案例（轻食外卖、抖音店播）撰写先后对比分析章节，与小红书、闲鱼成功案例形成正反呼应，凸显“避坑”主线。
- 新增一篇开篇调研章节，基于素材中的共性提炼“常见的8种互联网创业死法”，为全书建立统摄性框架。
