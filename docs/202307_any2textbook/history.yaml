    [claim] 素材宣称书单、口罩、混剪、IP、实拍五种方式在难易度和投产比上存在明确对比差异，但未给出具体对比数据或量化指标。\",\n      \"\
    excerpt\": [\n        \"五种内容制作方式：书单、口罩、混剪、IP、实拍，各有难易度和投产比对比。\"\n      ]\n    },\n\
