    \n      ]\n    }\n  ],\n  \"methods\": [\n    {\n      \"name\": \"标准化SOP\",\n\
    \      \"desc\": \"将情感粉引流过程标准化为'选对标-提取文案-批量制作'三步流程，去除对个人能力的依赖，确保可复制性和规模。\",\n\
