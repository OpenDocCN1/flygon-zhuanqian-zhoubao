      arguments: '{"fname": "教科书.md", "text": "# 小成本创富：从0到1的避坑实战手册\n\n> **副标题**：拆解16个真实项目，用判断力避开90%的坑\n>\n>
        **核心命题**：普通人如何通过互联网轻资产项目，用最小成本完成从0到1并实现放大——核心不是追风口，而是建立判断力与可复制的系统能力。\n>\n>
        **素材来源**：龙哥赚钱周报知识库（2023年7月批次），语雀/飞书导出的一线创业复盘文章。\n\n---\n\n# 前言\n\n本书不是一本\"成功学\"著作，也不是一本\"项目大全\"。它由一批真实创业者真金白银的经验沉淀而成——有人跨界开轻食外卖店亏损40万，有人3个月做抖音店播亏掉20万，也有人通过小红书无货源电商一年做到30万利润、通过闲鱼二手书工作室实现月入十万的跃迁。\n\n本书的核心主张只有一句话：**互联网赚钱不是靠追风口，而是靠建立判断力与可复制的系统能力。**
        如果你能在入场前看清项目的成本结构与风险，在操盘中理解用户痛点和运营逻辑，在放大阶段用流程与杠杆提升效率，那么你就能避开这本书里反复出现的那些\"坑\"——它们大多是同一批坑的变体。\n\n##
        全书结构\n\n本书分为 **五个分部、十三章**，从认知到实战、从避坑到放大，层层递进：\n\n- **分部一 认知升维**：从个人成长与商业本质出发，建立判断力的底层框架\n  -
