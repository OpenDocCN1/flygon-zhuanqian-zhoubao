  content: "{\n  \"docs/202307/AGOAdy5Y1ojz0dx8EP7cIn0tnFh.md\": \"# 关于我开了3家轻食外卖店亏了40W+这回事\
    \  > 来源：[https://ixnoucqi80.feishu.cn/docx/AGOAdy5Y1ojz0dx8EP7cIn0tnFh](https://ixnoucqi80.feishu.cn/docx/AGOAdy5Y1ojz0dx8EP7cIn0tnFh)\
    \  # 前言  我是做互联网运营的，现在在杭州某大厂搬砖，合伙人当时是项目经理（低代码方向），现在仍然在创业（支付行业），我们当时讨论了大半年决定往大健康方向做，然后打算从门槛较低的餐饮入局健康行业，这个轻食外卖项目完全使用互联网思维来玩的，从前端流量获取到厨房菜品制作，我们都是从0-1自己摸索的，踩了很多坑，也输出了一些方法论，如果你也对轻食、减脂餐、外卖店感兴趣，看完这篇，或许能帮到你\
    \  写的很实在，不存在夸大、虚假，全部有真实数据截图，那阵子，钱是真亏了，人是真累了  这里主要讲一下干货，中间其实发生了很多有趣的故事，想了解更多的欢迎链接\
    \  # 一、几个有趣的内容  虽然干倒了，但也有一些可圈可点的成绩，先给大家分享一下  ## 1、复购率31.1%长期杭州余杭区同行TOP\",\n  \"\
    docs/202307/BS9QdN9qKoMXroxzy3AcMUlZn0t.md\": \"# 如何成为一位单日课酬1万+的GPT企业培训师  > 来源：[https://qp7gm5nhlh.feishu.cn/docx/BS9QdN9qKoMXroxzy3AcMUlZn0t](https://qp7gm5nhlh.feishu.cn/docx/BS9QdN9qKoMXroxzy3AcMUlZn0t)\
    \  大家好，我是灵军，1个月前刚从生财辞职，目前全职在AI领域创业。  GPT火了半年多，想必不少圈友听过 GPT企业培训 这个生意。  我之前也对这个职业非常好奇，刚好自己擅长演讲，跟着亦仁和刀姐身边也学到了不少GPT的应用和商业知识。\
    \  于是5月份周末时间，我尝试在一些企业家内部小聚，黄有璨线下学社活动分享过，反馈不错。  出来创业后，选择第一个让自己活下来的业务方向也是成为一位GPT企业讲师，这1个多月也受邀到复旦大学EMBA，金螳螂集团（工装领域连续19年Top1的上市公司），中国铁塔，苏州金龙集团等头部企业讲课。\
    \  收费也从一开始试探性，到后面正式突破单日课酬1万+，算是完整跑通了GPT企业培训的闭环，今天就将这个过程做个拆解，希望能对GPT企业培训领域感兴趣的圈友们\"\
    ,\n  \"docs/202307/C0F6dAOKDopAUdx2q3Mc6UEHnXd.md\": \"# 价值八千AI指令开发保姆级拆解  > 来源：[https://cvh0khn7xvb.feishu.cn/docx/C0F6dAOKDopAUdx2q3Mc6UEHnXd](https://cvh0khn7xvb.feishu.cn/docx/C0F6dAOKDopAUdx2q3Mc6UEHnXd)\
    \  # 零、前提介绍  大家好，我是王俊杰Justin，刚刚结束大二，已创业两年，致力于AI应用领域，项目在清华大学x-lab与校园VC举办的创业活动中获得冠军，得到了许多前辈的关注，并借此实现自己第一单AI指令变现，8000元，并陆续开展AI指令相关业务\
    \  自己是大一开始接触生财有术，作为一个只有一腔热情的小白，被社群里的帖子狠狠震惊，刷了一整个通宵，见识了许多市面上前沿的玩法，受益匪浅。  在社群真诚利他、开放包容的价值观影响下，我遇到了我的贵人，拱卒老师。带我一起做项目、参加活动，与我一起聊生意，让我在一年里，获得了难以想象的成长。\
    \  后来，遇到了北京的贵人，结识了现在的团队，自去年12月7日起开始做AI应用层落地，一开始先是用AI赋能原先业务的某个关键环节，后来持续的进行项目实战\"\
    ,\n  \"docs/202307/Aus2dWr0YoTbOjxYLOFcqdAQnnb.md\": \"# 从3000元到300万，这10个思维模型，让你不走弯路斩获人生第一桶金｜写在理白的三十而立\
    \  > 来源：[https://fcjmogm9bc.feishu.cn/docx/Aus2dWr0YoTbOjxYLOFcqdAQnnb](https://fcjmogm9bc.feishu.cn/docx/Aus2dWr0YoTbOjxYLOFcqdAQnnb)\
    \  大家好，我是圈友理白，今天刚满30岁生日，先臭不要脸求个生日快乐，顺祝圈友们见贴同乐。  30年前，我出生在山东一座沿海小城，虽不是大富大贵，但家境殷实，父母都是老师，受邻里尊敬，没什么艰苦的童年、也没什么鲜亮的故事，考过第一、当过班长，顺风顺水、一路顺遂。\
    \  10年前，我只身前往上海学医，在一座钢铁森林之城，学知识、多见识、长本事，能轻易应付考试，拿到不错的学分，实习、保研、做课题、写论文，按正常医学生的培养轨迹，我顺顺当当来到一家医院，从小医生做起。\
    \  但，命运的齿轮总在不经意间转动，一次无意地涉足，却成就了我今日的欢喜。7年前，我进入自媒体行业，写作投稿、做号运营；5年前，我和同伴线上创业，做知识付费、做私教陪跑、做博主带\"\
    ,\n  \"docs/202307/F3ZEderGaoabeyxctJncVyysnaf.md\": \"# 《闲鱼二手书2.0：从月入过W到年入100W》\
    \  > 来源：[https://qingling21.feishu.cn/docx/F3ZEderGaoabeyxctJncVyysnaf](https://qingling21.feishu.cn/docx/F3ZEderGaoabeyxctJncVyysnaf)\
    \  大家好，我是老瞿Qu，生财有术最懂二手书的男人，也是本次闲鱼二手书航海和续航的教练。当有一天我收到这样一条微信的时候，我知道是时候给大家来一篇闲鱼二手书2.0的分享了，让我们一起从月入过W到年入100W。\
    \  ![](img/dd5e47ebdbf2f6a9d4ca8974c4c83d0f.png)  因为被圈友多次表白喜欢老瞿的文风，所以本次依旧会采用问答式的写作手法，因为我也不喜欢论文式的废话。\
    \  ## 一、闲鱼二手书的天花板在哪里？  根据我前期实战经验，一般一个人一天在100-150单左右的时候，就会到达一个人的极限，按照我工作室统计的数据，平均一单的利润在8-10元左右，也就是一天1000+的利润，一个月在2-3W+左右。\
    \  所以上面这个续航学员，其实基本上已经快\",\n  \"docs/202307/CIiMdBlfjohvsRxcTClcCgSSnae.md\": \"\
    # 小红书一年赚30万的经验分享，适合普通人直接上手  > 来源：[https://rupmba5s9d.feishu.cn/docx/CIiMdBlfjohvsRxcTClcCgSSnae](https://rupmba5s9d.feishu.cn/docx/CIiMdBlfjohvsRxcTClcCgSSnae)\
    \  大家好，我是苏木，分享一下最近 1 年在小红书赚钱的经历。  这个项目初期是无货源模式，我跑了 1 年，销售 50 多不到 60 万，利润有 30 万左右。后期可以通过一些方法建立自己的护城河，我觉得适合大部分普通人做，一年不一定能年入百万，毕竟我也没有赚到，但10～20\
    \ 万应该问题不大。  这次分享有两个目的，一是想多交一些同频的朋友一起研究如何放大，一个人创业太孤独了，有时候挺苦闷的；二是想找找有没有更多合适的供应商朋友，我可以帮你多卖一些货（这方面文末我再说）。\
    \  受徐宿老师鼓励，第一次来生财分享和寻求合作，希望对大家有帮助，先贴一下成绩：  ![](img/57311aa64847eb8a97c04893416eaa77.png)\
    \  ![](img/2a304f\",\n  \"docs/202307/EgJydbzGyocktUxuUOMcM2nfnye.md\": \"# 情感赛道，单月变现5万+全流程复盘\
    \  > 来源：[https://p9z0j9usen.feishu.cn/docx/EgJydbzGyocktUxuUOMcM2nfnye](https://p9z0j9usen.feishu.cn/docx/EgJydbzGyocktUxuUOMcM2nfnye)\
    \  圈友们大家好，我是挽心，一名擅长搞流量的实战家。今天给大家分享我正在做的情感粉引流项目保姆级攻略，我是如何通过情感粉引流项目单月赚到5w+的。  大家平时多多少都了解过情感行业，应该知道情感行业的门槛相对来说比较高，要有相应的资质，许多人想进入情感行业却望洋兴叹。而情感粉引流是进入情感行业的一种相对低门槛的方式。它是指通过社交媒体平台如微信公众号、抖音、小红书等，以引导用户产生情感共鸣和兴趣的方式，吸引用户关注并进行营销推广到情感公司的过程。\
    \  废话不多说，接下来进入正题  # \U0001F9F5情感粉引流成果展示  现在跑的部分账号数据⬇️  ![](img/2e0e09fdd11a48ee5455c19c9e392f11.png)\
    \  ![](img/b2b50ec424e87fa774f72b5\",\n  \"docs/202307/FMpwd5WxMob6ZbxXV21cvgAYnpd.md\"\
    : \"# 《小红书商单&多多视频V计划》保姆级教程  > 来源：[https://gwq4c5gvtwq.feishu.cn/docx/FMpwd5WxMob6ZbxXV21cvgAYnpd](https://gwq4c5gvtwq.feishu.cn/docx/FMpwd5WxMob6ZbxXV21cvgAYnpd)\
    \  哈咯，大家好，我是波光，对，那个虽然肚子很大，但是四肢很短的矮胖子，两个月前我第一次在生财做分享，并有幸拿到的精华，这里再次感谢驴哥，木子田，小毛老师。\
    \  今天跟大家分享的主题是，小红书商单和多多视频V计划，在这里感谢@柯总，@驴哥，@小毛老师帮我修改文章，其实今年5月份我们就开始测试了，当时鱼丸小姐姐还在期待我的这次分享，所以我是把全流程跑通了，才敢拿过来分享。\
