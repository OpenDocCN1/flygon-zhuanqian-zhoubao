- 'no': 1
  name: 内容生产工业化 —— 从“手工作坊”到“标准产线”
  desc: 本章探讨如何将内容创作从依赖个人天赋与灵感的‘手工作坊’模式，升级为可批量复制、标准化运作的‘工业产线’，揭示其底层逻辑与核心方法论。
  nodes:
  - 'no': 1
    name: 内容工具化与流量批发化
    desc: 用“工业革命”类比：如同机器替代手工劳动，内容工具化将创作变成标准动作，流量批发化则把粉丝视为可规模化生产的商品，从而突破对个人强IP与高创作能力的依赖。
    role: motivation
    src:
    - paper: 情感赛道变现
  - 'no': 2
    name: 标准化SOP（标准作业程序）
    desc: 定义将非标准化的‘创意’流程拆解为‘选对标-提取文案-批量制作’三步式的标准化操作程序，是内容生产工业化的核心‘生产线’。
    role: definition
    src:
    - paper: 情感赛道变现
  - 'no': 3
    name: 五种内容制作方式对比
    desc: 罗列并比较书单、口罩、混剪、IP、实拍五种内容形态在制作难度与投产比上的差异，为建立‘生产线’选择合适的‘机台’提供决策依据。
    role: method
    src:
    - paper: 情感赛道变现
  - 'no': 4
    name: 个人变现与公司对接双路径
    desc: 提供‘自产自销’与‘出售流量’两种变现模式，对应着工业品直接零售与批发给下游渠道的两种商业路径。
    role: method
    src:
    - paper: 情感赛道变现
  - 'no': 5
    name: 工业化生产的风险监控
    desc: 阐述如何识别与规避‘扣量’与‘欺诈’两类系统性风险，如同工业生产中的质量检验与风险控制环节，保障产线稳定运行。
    role: limitation
    src:
    - paper: 情感赛道变现
  - 'no': 6
    name: 去个人化内容生产的可行性分析
    desc: 案例复盘：作者宣称在标准化流程下，无需个人IP即可实现单月5万+变现。该案例展示了工业化生产模式的效力，但需注意其为个人宣称，缺乏外部验证。
    role: experiment
    src:
    - paper: 情感赛道变现
- 'no': 2
  name: 平台规则套利 —— 从“单线程”到“多线程”变现
  desc: 本章聚焦于如何利用不同内容平台间的规则差异（算法、扶持政策）进行策略性套利，通过内容复用实现‘一鱼多吃’，构建跨越单一平台的收益矩阵。
  nodes:
  - 'no': 1
    name: 平台规则差异与内容复用
    desc: 用“跨境贸易”类比：贸易者利用两国商品价差获利，内容套利者则利用小红书与多多视频的推荐算法、扶持政策的‘制度价差’进行流量与收益的套利，核心是内容复用。
    role: motivation
    src:
    - paper: 小红书商单与多多视频计划
  - 'no': 2
    name: 小红书商单与多多视频V计划双轨收益
    desc: 定义两种收益机制：小红书商单（广告费）与多多视频V计划（播放量分成），并称通过内容复用可实现同一批内容获得双份收益的‘双重收益定理’。
    role: definition
    src:
    - paper: 小红书商单与多多视频计划
  - 'no': 3
    name: 五类起号内容策略与算法解读
    desc: 讲解动漫搬运、游戏号等五种可复制的起号内容形式，并辅以对小红书流量推荐算法机制的解读，作为落地执行的方法基础。
    role: method
    src:
    - paper: 小红书商单与多多视频计划
  - 'no': 4
    name: 站外认证套利法（粉丝门槛迁移）
    desc: 解析如何利用‘在小红书达到5万粉’这一门槛，去认证多多视频V计划获取更高权限，实现粉丝资产的价值转移与套利（粉丝门槛迁移定理）。
    role: method
    src:
    - paper: 小红书商单与多多视频计划
  - 'no': 5
    name: 套利策略的适用边界与风险
    desc: 指出该方法高度依赖平台间既有的规则差异（信息差），一旦算法或政策同步，套利空间随即消弭，其可持续性面临挑战。
    role: limitation
    src:
    - paper: 小红书商单与多多视频计划
  - 'no': 6
    name: 不同起号路径的效果验证
    desc: 虽宣称存在五种可复制起号方式，但缺乏各方式具体的粉丝增长率数据支撑，所有结论均为经验性宣称，需理性审视其普适性。
    role: experiment
    src:
    - paper: 小红书商单与多多视频计划
