paper: 10个思维模型
desc: 该素材以作者理白从3000元起步到年入300万的自媒体创业历程为背景，提出个人成长的核心是思维升级与迭代，并系统性地提炼出‘10个思维模型’（雪球、取舍、杠杆、破圈、品牌、平衡、射击、人脉、共赢、系统），每个模型均对应一种特定的思维模式或行为策略，旨在指导个体通过思维方式的转变实现能力的放大与长期的财富积累。
concepts:
- name: 思维模型
  desc: 指在特定领域或情境下，用于指导决策和行动的一套结构化思维框架；在本文中特指作者总结的10种有助于个人成长和财富积累的思维模式。
  is_original: false
  excerpt:
  - 作者理白30岁回顾从医学生到年入300万自媒体创业者历程，提炼10个思维模型
  - 核心是个人成长的本质是思维升级与迭代。
- name: 雪球思维
  desc: 一种强调通过‘怼量’（持续积累）来建立初始势能，再逐步放大优势的思维模式，类似滚雪球效应。
  is_original: false
  excerpt:
  - 1）雪球思维：靠怼量积累势能，先平地起势再放大
- name: 取舍思维
  desc: 一种在面对多个‘正确’选项时，通过聚焦核心领域来建立竞争优势和护城河的决策思维。
  is_original: false
  excerpt:
  - 2）取舍思维：在对与对之间选择，聚焦建立护城河
- name: 系统思维
  desc: 一种超越单点爆发，着眼于构建可持续运行、可自动循环的系统的整体性思维模式。
  is_original: false
  excerpt:
  - 10）系统思维：构建可持续运行的系统，而非单点爆发
methods:
- name: __overview__
  desc: 一种基于个人经验回顾与归纳的思维模型提炼法，作者从自身从医学生到创业者的年收入跃升历程中，提炼出10个可复用的思维模型。
  excerpt:
  - 作者理白30岁回顾从医学生到年入300万自媒体创业者历程，提炼10个思维模型
- name: 杠杆思维应用法
  desc: 一种利用影响力、内容或团队等外部资源来放大自身单点能力的策略性方法。
  excerpt:
  - 3）杠杆思维：利用影响力、内容、团队放大单点能力
- name: 射击思维应用法
  desc: 一种‘有意瞄准，无意击发’的长期积累策略，强调在过程上精确准备，对结果保持耐心，依靠时间积累概率优势。
  excerpt:
  - 7）射击思维：有意瞄准，无意击发，注重长期积累概率
theorems:
- name: 个人成长核心定理
  desc: 该素材的核心主张：个人成长的本质并非单纯的能力提升或机会获取，而是思维方式的升级与持续迭代。
  excerpt:
  - 核心是个人成长的本质是思维升级与迭代。
- name: 财富跃迁源于思维转变
  desc: 作者主张，其从3000元到年入300万的变化，根本原因在于应用了上述10个思维模型，即财富的跃迁是由思维升级驱动的。
  excerpt:
  - 从3000元起步，通过思维升级一步步做到年入300万。
findings:
- name: 10个思维模型与财富增长关联
  desc: '[claim] 作者宣称，提炼出的10个思维模型是其实现从3000元到年入300万这一财务转变的关键驱动力。此为作者的个人宣称，素材中并未提供具体的财务数据或实证对比。'
  excerpt:
  - 从3000元到300万，10个思维模型。
  - 从3000元起步，通过思维升级一步步做到年入300万。
