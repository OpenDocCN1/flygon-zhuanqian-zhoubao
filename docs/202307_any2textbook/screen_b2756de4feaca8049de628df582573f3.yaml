screening_principles: 本批次筛选遵循以下原则：1）核心判断力优先：凡能提炼出稳定方法论、完整商业闭环或可复用的认知框架（如轻食创业复盘、GPT培训师闭环、AI指令开发方法论、闲鱼二手书放大模型），无论写作时间，一律保留并转化为常青章节、案例或知识条目；2）实操颗粒度与教学价值：具有高信息密度、详细SOP、成本利润测算的真实一线复盘的素材保留，弱化仅作补充案例的条目；3）时效性分级处理：对高度依赖特定版本、平台规则或风口期的工具教程、灰色操作，若可转化为手册功能条目或历史案例则保留或降权，凡极强时效性且无方法论可迁移的（如Windows
  Copilot安装）予以排除；4）重复度与强弱取舍：与更强文本重复时保留强版本，弱版本作案例库补充或降权处理；5）关联主线评估：与赚钱方法论主线关联弱、仅作信息聚合或纯操作指南的素材视其承载能力决定保留或降权，避免稀释全书。
