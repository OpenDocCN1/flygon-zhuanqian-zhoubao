- 'no': 1
  name: 外卖餐饮创业 —— 从“交学费”到“找对生意”
  desc: 本章通过对轻食外卖亏损40万的深度复盘，拆解纯外卖模式、供应链结构与品类选择的三大认知陷阱，帮你在入场前看清这门生意真正的成本与门槛。
  nodes:
  - 'no': 1
    name: 纯外卖模式的流量费结构
    desc: 用“房租+抽成”双重成本类比，理解纯外卖为何天然比线下实店更依赖平台流量
    role: motivation
    src:
    - paper: 轻食外卖亏损40W
  - 'no': 2
    name: 纯外卖模式的成本定义
    desc: 明确纯外卖概念：仅依赖平台订单、无线下堂食，需向平台支付双重流量费
    role: definition
    src:
    - paper: 轻食外卖亏损40W
  - 'no': 3
    name: 外卖行业双份流量费主张（定理）
    desc: 阐述纯外卖天然劣于线下实店的结构性劣势，并给出成本对比公式
    role: proof
    src:
    - paper: 轻食外卖亏损40W
  - 'no': 4
    name: 高品质外卖的适用边界
    desc: 揭示现场制作、无半成品的“高品质”模式在价格战中无法立足，仅适合作线下附带产品
    role: limitation
    src:
    - paper: 轻食外卖亏损40W
  - 'no': 5
    name: 中央厨房模式的流水门槛
    desc: 用“不配”一词的量化逻辑，说明年流水百万级以下无法消化供应链重资产成本
    role: limitation
    src:
    - paper: 轻食外卖亏损40W
  - 'no': 6
    name: 季节性品类风险与选址评估
    desc: 针对轻食冬季单量骤降、活不过冬天的品类特性，给出“4km覆盖学校写字楼小区”的选址解法
    role: method
    src:
    - paper: 轻食外卖亏损40W
  - 'no': 7
    name: 冷启动与团餐运营法
    desc: 利用新店强制排名做霸王餐换好评、加私域，并引入团餐对冲平台抽成，建立两条腿走路的收入结构
    role: method
    src:
    - paper: 轻食外卖亏损40W
  - 'no': 8
    name: 亏损规模量化证据
    desc: 通过3年3店亏损40万+的实证，验证上述结构性问题在真实经营中的必然性
    role: experiment
    src:
    - paper: 轻食外卖亏损40W
- 'no': 2
  name: 抖音店播起号 —— 从“换人”到“换脑”
  desc: 本章基于3个月亏20万的店播复盘，剖析起号失败的归因谬误，提炼出“自我驱动”与“用户洞察”两大起号核心法则。
  nodes:
  - 'no': 1
    name: 店播起号的错误归因
    desc: 用“换医生不换药”类比：换了3任运营仍失败，提示问题不在执行者而在认知层
    role: motivation
    src:
    - paper: 抖音直播复盘
  - 'no': 2
    name: 外部依赖的定义与危害
    desc: 明确将起号期望寄托于外部运营、而非自身驱动的行为模式，是失败的结构性成因
    role: definition
    src:
    - paper: 抖音直播复盘
  - 'no': 3
    name: 创业者需自我驱动定理
    desc: 论证外部运营无法替代创业者的主动认知与行动，归因于内才是起号前提
    role: proof
    src:
    - paper: 抖音直播复盘
  - 'no': 4
    name: 核心用户洞察缺失
    desc: 指出盲目模仿表象、未真正理解35-50岁中老年妇女痛点的失败案例
    role: experiment
    src:
    - paper: 抖音直播复盘
  - 'no': 5
    name: 理解用户痛点优于盲目模仿
    desc: 提出起号成功的核心方法：以用户痛点洞察驱动内容与选品，而非抄袭同行
    role: method
    src:
    - paper: 抖音直播复盘
  - 'no': 6
    name: 付费投流的健康模型约束
    desc: 强调投流必须建立在可盈利的商业模型之上，拒绝亏本低价引流的自毁式增长
    role: method
    src:
    - paper: 抖音直播复盘
  - 'no': 7
    name: 外部依赖的边界与复盘方法论
    desc: 总结“试错-复盘-归因”的方法论，将失败转译为可复用教训而非他人过错
    role: extension
    src:
    - paper: 抖音直播复盘
