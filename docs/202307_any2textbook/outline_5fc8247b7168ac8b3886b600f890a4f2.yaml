- 'no': 1
  name: 思维升级 —— 从“月薪3000”到“年入300万”的底层密码
  desc: 本章从个人成长的本质出发，拆解作者从医学生蜕变为年入300万创业者的过程，提炼出驱动这一转变的10个核心思维模型，帮助你建立从“做事”到“成事”的思维基础设施。
  nodes:
  - 'no': 1
    name: 个人成长的本质：思维升级与迭代
    desc: 用“换操作系统”类比：个人成长不是单纯增加知识量，而是思维方式的升级与持续迭代，这是全书的理论基石。
    role: motivation
    src:
    - paper: 10个思维模型
    - paper: 10个思维模型
  - 'no': 2
    name: 10个思维模型全景图
    desc: 以“工具箱”为类比，概述10个思维模型的分类与关系，包括雪球思维、取舍思维、系统思维等，作为后续逐一展开的索引。
    role: definition
    src:
    - paper: 10个思维模型
  - 'no': 3
    name: 雪球思维 —— 靠怼量积累势能
    desc: 用“滚雪球”类比：在起步阶段通过持续怼量建立初始势能，先平地起势，再逐步放大优势，实现复利式增长。
    role: method
    src:
    - paper: 10个思维模型
  - 'no': 4
    name: 取舍思维 —— 在对与对之间聚焦护城河
    desc: 用“射手射箭”类比：当多个选项都是正确时，真正的智慧在于聚焦核心领域，通过取舍建立差异化竞争优势和护城河。
    role: method
    src:
    - paper: 10个思维模型
  - 'no': 5
    name: 系统思维 —— 从单点爆发到自动循环
    desc: 用“园林营造”类比：超越一次性投入的爆点思维，着眼于构建可持续运行、可自动循环的系统，让增长自我驱动。
    role: method
    src:
    - paper: 10个思维模型
  - 'no': 6
    name: 杠杆思维 —— 让单点能力被放大
    desc: 用“千斤顶”类比：识别并利用影响力、内容或团队等外部资源，撬动自身单点能力，实现以小博大的放大效应。
    role: method
    src:
    - paper: 10个思维模型
  - 'no': 7
    name: 射击思维 —— 有意瞄准，无意击发
    desc: 用“狙击手”类比：日常专注持续积累（瞄准），不过度纠结短期结果（无意击发），依靠时间积累概率优势，静待质变。
    role: method
    src:
    - paper: 10个思维模型
  - 'no': 8
    name: 从3000到300万：思维转变的实证
    desc: 以作者自身从月薪3000到年入300万的完整历程为案例，验证“思维升级驱动财富跃迁”的核心定理，展示各模型在实战中的联动应用。
    role: experiment
    src:
    - paper: 10个思维模型
  - 'no': 9
    name: 思维模型不是万能药：适用边界与误区
    desc: 指出思维模型的局限性：生搬硬套无效，须结合具体场景灵活运用；并提醒警惕“模型收集癖”，知行合一才是关键。
    role: limitation
    src:
    - paper: 10个思维模型
- 'no': 2
  name: AIGC变现 —— 在技术狂热中识别“真金”与“镰刀”
  desc: 本章以批判性视角审视AIGC赚钱热潮，剥离“工具万能论”的流行叙事，教你分辨技术与业务的关系，识别割韭菜套路，在浪潮中建立清醒的变现策略。
  nodes:
  - 'no': 1
    name: 技术热潮 vs 赚钱现实：从“人工智能”到“人工智障”
    desc: 用“一字之差”的对比引入：AIGC技术的应用效果存在两极化表现，面对热潮需回归理性，辨析技术能力与商业价值之间的鸿沟。
    role: motivation
    src:
    - paper: AIGC三剑客赚钱机会
  - 'no': 2
    name: 核心论断：AI工具不等于赚钱项目
    desc: 给出本章根本定义：AIGC工具仅仅是技术手段，本身不构成赚钱项目；必须与具体业务场景结合落地，才可能产生商业价值。
    role: definition
    src:
    - paper: AIGC三剑客赚钱机会
  - 'no': 3
    name: 流量获取与业务结合法
    desc: 给出可操作的落地路径：将技术工具作为服务具体业务场景的“基础设施”，把核心精力投放在流量获取与真实业务转化上。
    role: method
    src:
    - paper: AIGC三剑客赚钱机会
  - 'no': 4
    name: 风险防控 —— 识别“割韭菜”陷阱
    desc: 剖析“割韭菜”套路：识别通过售卖高价低值课程或系统工具，利用信息差与焦虑心理让从业者受损的短期投机行为，并给出规避策略。
    role: method
    src:
    - paper: AIGC三剑客赚钱机会
  - 'no': 5
    name: AIGC不是好项目的局限性剖析
    desc: 基于案例与逻辑，论证“AIGC真的不是一个好的赚钱项目”这一观点的依据，理解工具属性与项目属性的根本差异。
    role: limitation
    src:
    - paper: AIGC三剑客赚钱机会
  - 'no': 6
    name: AI不会淘汰你，会用AI的人会淘汰你
    desc: 指出在工具快速迭代时代，个人的核心竞争力在于使用AI的能力；掌握AI工具并非终点，而是参与未来竞争的基本门槛。
    role: extension
    src:
    - paper: AIGC三剑客赚钱机会
