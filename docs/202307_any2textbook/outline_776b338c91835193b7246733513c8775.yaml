- 'no': 1
  name: AI 商业价值发现 —— 从岗位技能到“淘金地图”
  desc: 本章引领读者建立 AI 商业化全景视野，洞察从企业培训、指令开发到内容创作乃至思维升级的四大变现赛道与机遇层级。
  nodes:
  - 'no': 1
    name: 机会版图：看见时代的“三剑客”
    desc: 概览 AIGC 三剑客（内容创作、工具应用、商业赋能）赚钱机会，建立初步的商机敏感度。
    role: motivation
    src:
    - paper: AIGC三剑客赚钱机会
  - 'no': 2
    name: 培训需求分层：科普与提效的“价值梯度”
    desc: 剖析企业 GPT 培训需求的三大层级（科普、场景提效、工具提效），指出多数企业员工尚处于科普阶段的巨大蓝海。
    role: definition
    src:
    - paper: GPT企业培训师
  - 'no': 3
    name: 商业闭环：从单点课酬到产品矩阵的“成长飞轮”
    desc: 学习“生意天花板理论”，理解单一高客单价业务的瓶颈，掌握通过认证课程、研学营等多元化产品突破个体年入百万上限的路径。
    role: extension
    src:
    - paper: GPT企业培训师
  - 'no': 4
    name: 思维模型：十倍速决策的“操作杠杆”
    desc: 掌握 10 个高效思维模型，将其作为分析 AI 商业机会、优化资源配置、制定竞争策略的通用底层工具。
    role: method
    src:
    - paper: 10个思维模型
- 'no': 2
  name: 成为 GPT 企业培训师 —— 打造“高客单价”的变现闭环
  desc: 本章深入实操，手把手教你完成从能力构建、个人品牌包装、精准获客到现场交付的完整商业闭环，实现单日课酬过万。
  nodes:
  - 'no': 1
    name: 能力构建：培训师的“能力矩阵”
    desc: 定义高课酬 GPT 培训师的硬性门槛：兼具 10 个以上应用场景提效的实操经验与出色的公众演讲能力。
    role: definition
    src:
    - paper: GPT企业培训师
  - 'no': 2
    name: 客户定位：寻找“付费买单”的大鱼
    desc: 演示“付费客户定位原则”的应用：识别并锁定年培训预算达千万级的大型企业、上市公司与头部国企作为核心目标客群。
    role: method
    src:
    - paper: GPT企业培训师
  - 'no': 3
    name: 个人品牌包装：打造“信任状”的 Title 包装法
    desc: 学习通过学历、专业、经历与成功案例等标签构建个人品牌，甚至运用自创名头、行业认证等策略快速建立专业权威感。
    role: method
    src:
    - paper: GPT企业培训师
  - 'no': 4
    name: 获客渠道：通往客户的“四座桥梁”
    desc: 系统介绍四大核心获客渠道：经纪公司、讲师协会、HR 总监社群与企业家社群，构建稳定的客户来源管道。
    role: method
    src:
    - paper: GPT企业培训师
  - 'no': 5
    name: 现场交付：保障满意度的“内容饱和策略”
    desc: 学习“内容交付饱和策略”与现场互动技巧：多准备 PPT、实时调研水平、15分钟互动法、用大白话讲解，确保高质量交付。
    role: method
    src:
    - paper: GPT企业培训师
  - 'no': 6
    name: 市场验证：突破“单日课酬过万”的真实案例
    desc: 以受邀至复旦 EMBA、金螳螂集团讲课并实现单日课酬破万的实例，验证黄金赛道与方法的可行性。
    role: experiment
    src:
    - paper: GPT企业培训师
  - 'no': 7
    name: 规模化瓶颈与破局：跳出“百万天花板”
    desc: 分析个体培训师客单价单一、时间受限的规模化困境，探讨如何通过产品矩阵（认证、研学营）进行突破与升级。
    role: limitation
    src:
    - paper: GPT企业培训师
- 'no': 3
  name: AI 指令开发 —— 从“提示词拼接”到“系统工程”
  desc: 本章聚焦 B 端交付场景，介绍一套严谨的系统工程方法论，教你将复杂业务目标转化为高价值、可落地的 AI 指令链。
  nodes:
  - 'no': 1
    name: 方法论基石：系统工程的思维转变
    desc: 确立核心认知：AI 指令开发不是提示词的简单拼接，而是一项需遵循先发散后收敛原则的完整系统工程。
    role: motivation
    src:
    - paper: AI指令开发方法论
  - 'no': 2
    name: AI 指令链：串珠成链的生产流水线
    desc: 定义“AI指令链”概念：由多套分工明确的提示词按流程串联形成的完整生产链路，例如以四套提示词完成一条指令链。
    role: definition
    src:
    - paper: AI指令开发方法论
  - 'no': 3
    name: 核心方法一：目标拆分与专业能力框架构建
    desc: 演示系统地将复杂业务目标拆解为可量化的子任务，并构建清晰的、可组合的专业能力框架。
    role: method
    src:
    - paper: AI指令开发方法论
  - 'no': 4
    name: 核心方法二：案例引入与持续调试的迭代循环
    desc: 学习在指令中提供“优秀案例”作为 AI 的参照系，并通过多轮对话与调试持续迭代，优化输出质量。
    role: method
    src:
    - paper: AI指令开发方法论
  - 'no': 5
    name: 商业价值判据：价值闭环的“终点传感器”
    desc: 建立核心评估标准：一切 AI 指令开发工作，都必须以能否为客户实现“降本增效”作为最终价值衡量标准。
    role: proof
    src:
    - paper: AI指令开发方法论
  - 'no': 6
    name: 渐进式商业化：从“赋能者”到“独立业务”的升级路径
    desc: 学习稳健的 AI 商业化路径：从赋能自身原有业务的某个关键环节入手，在积累经验与案例后，逐步扩展为独立的商业模式。
    role: extension
    src:
    - paper: AI指令开发方法论
  - 'no': 7
    name: 案例实证：AI 指令开发的“第一桶金”
    desc: 通过成功实现第一单价值 8000 元的 AI 指令变现的真实案例，论证该商业模式的可行性与方法论的有效性。
    role: experiment
    src:
    - paper: AI指令开发方法论
